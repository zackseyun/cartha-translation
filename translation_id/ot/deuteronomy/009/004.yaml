source:
  edition: WLC
  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: id
  text: Jangan berkata dalam hatimu ketika Yahweh, Allahmu, menghalau mereka dari hadapanmu, dengan berkata, “Karena kebenaranku, Yahweh telah membawa aku masuk untuk memiliki negeri ini,” sedangkan karena kefasikan bangsa-bangsa ini Yahweh mengusir mereka dari hadapanmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: Jangan berkata dalam hatimu
  rationale: אַל dengan bentuk imperfek menyatakan larangan. Ungkapan ‘dalam hatimu’ mempertahankan metafora Ibrani bagi pikiran atau perkataan batin dan tetap wajar dalam bahasa Indonesia.
- source_word: בַּהֲדֹף
  choice: ketika ... menghalau
  rationale: Infinitif konstruk dengan prefiks בְּ menyatakan keadaan temporal. ‘Menghalau’ menyampaikan tindakan mendorong atau mengusir pihak lain dari suatu tempat.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai ‘Yahweh’, sedangkan bentuk posesif אֱלֹהֶיךָ diterjemahkan secara langsung sebagai ‘Allahmu’.
- source_word: מִלְּפָנֶיךָ / מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Terjemahan ini mempertahankan gambaran spasial idiom Ibrani sekaligus alami dalam konteks penyingkiran bangsa-bangsa di depan Israel.
- source_word: בְּצִדְקָתִי
  choice: Karena kebenaranku
  rationale: Prefiks בְּ berfungsi kausal dalam klaim batin Israel. ‘Kebenaran’ mempertahankan istilah moral-teologis צְדָקָה dan tidak melunakkannya menjadi sekadar ‘kebaikan’.
- source_word: הֱבִיאַנִי
  choice: telah membawa aku masuk
  rationale: Bentuk Hifil dari בוא dengan sufiks orang pertama tunggal berarti menyebabkan pembicara masuk; unsur masuk dipertahankan karena konteksnya adalah memasuki negeri.
- source_word: לָרֶשֶׁת אֶת הָאָרֶץ הַזֹּאת
  choice: untuk menduduki negeri ini
  rationale: Dalam konteks masuk dan mengambil alih negeri, ירשׁ bermakna memperoleh atau menguasai sebagai milik. ‘Menduduki’ menyampaikan tindakan mengambil kepemilikan tanpa harus memilih nuansa ‘mewarisi’.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: Sebaliknya, karena kefasikan bangsa-bangsa inilah
  rationale: Waw dipahami secara kontras dengan anggapan Israel sebelumnya. ‘Kefasikan’ mempertahankan bobot moral רִשְׁעָה, dan ‘inilah’ menandai penekanan demonstratif.
- source_word: מוֹרִישָׁם
  choice: menghalau mereka
  rationale: Bentuk Hifil dari ירשׁ di sini menyatakan membuat bangsa-bangsa kehilangan kepemilikan atau tempat mereka. ‘Menghalau’ cocok dengan konteks dan menghindari bentuk Indonesia yang kaku seperti ‘mencabut kepemilikan mereka’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama perjanjian secara langsung. Transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Dugaan bahwa Israel memperoleh negeri karena jasa moralnya
  choice: Karena kebenaranku
  alternative: Karena aku benar atau karena jasa kebenaranku
  rationale: Terjemahan mempertahankan kata benda ‘kebenaran’ dan klaim kausal yang dilarang Musa, tanpa menambahkan konsep ‘jasa’ yang tidak dinyatakan secara eksplisit.
- issue: Hubungan antara klaim Israel dan kefasikan bangsa-bangsa
  choice: Sebaliknya
  alternative: dan; sedangkan; padahal
  rationale: Konteks menunjukkan koreksi terhadap alasan yang dibayangkan Israel. ‘Sebaliknya’ menyatakan kontras tersebut dengan jelas, tanpa mengubah alasan yang diberikan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum, sambil mempertahankan metafora ‘dalam hatimu’, nama ilahi Yahweh, istilah ‘kebenaran’ dan ‘kefasikan’, serta pengulangan ‘dari hadapanmu’.
