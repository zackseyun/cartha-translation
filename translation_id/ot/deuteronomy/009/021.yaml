base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: id
  text: Aku mengambil dosamu itu, yakni anak sapi yang kamu buat, lalu membakarnya dengan api. Aku menghancurkannya dengan menggilingnya sampai menjadi halus seperti debu. Kemudian aku membuang debunya ke aliran air[a] yang turun dari gunung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sungai”, “dasar aliran”, atau “wadi”. Kata Ibrani נחל dapat mengacu pada aliran air, lembah, atau dasar aliran yang kadang-kadang kering.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: dosamu
  rationale: Dalam konteks ini kata tersebut menunjuk kepada berhala sebagai perwujudan dosa Israel, bukan kepada kurban penghapus dosa. Pilihan ini mempertahankan identifikasi tajam dalam bahasa Ibrani.
- source_word: הָעֵגֶל
  choice: anak sapi
  rationale: Makna lazimnya ialah anak sapi dan merujuk kepada anak sapi emas dalam konteks ini.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: membakarnya dalam api
  rationale: Ungkapan ini mempertahankan penyebutan api secara eksplisit dan tetap wajar dalam bahasa Indonesia.
- source_word: וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב
  choice: menghancurkannya dengan menggilingnya sampai halus benar
  rationale: Kata kerja pertama menyatakan penghancuran, sedangkan bentuk טָחוֹן menerangkan caranya, yaitu dengan menggiling; הֵיטֵב menegaskan ketuntasan tindakan itu.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: hingga menjadi sehalus debu
  rationale: Frasa ini menyatakan tingkat penghancuran dan secara alami menyampaikan bahwa hasilnya sangat halus seperti debu.
- source_word: עֲפָרוֹ
  choice: debunya
  rationale: Menunjuk kepada sisa anak sapi yang telah digiling dan menjaga kaitan leksikal dengan 'debu' pada klausa sebelumnya.
- source_word: הַנַּחַל
  choice: sungai
  rationale: נחל dapat menunjuk kepada aliran air, dasar aliran, atau wadi. 'Sungai' mudah dipahami dalam bahasa Indonesia, sementara catatan kaki mempertahankan keluasan makna aslinya.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: yang mengalir turun dari gunung
  rationale: Terjemahan ini mempertahankan daya deskriptif bentuk partisip yang menggambarkan gerak aliran air dari gunung.
theological_decisions:
- issue: Identifikasi anak sapi sebagai 'dosamu'
  choice: dosamu, yaitu anak sapi yang telah kamu buat itu
  alternative: benda berdosa yang kamu buat, yaitu anak sapi itu
  rationale: Konstruksi Ibrani secara keras mengidentifikasi berhala tersebut dengan dosa Israel. Terjemahan utama mempertahankan bobot teologis dan retoris itu tanpa melunakkannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan tindakan dipertahankan untuk menampilkan urutan penghancuran berhala dengan jelas. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang dijelaskan.
