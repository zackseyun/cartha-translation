reference: Deuteronomy 9:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: id
  text: Maka, ketahuilah hari ini bahwa Yahweh, Allahmu, Dialah yang menyeberang di depanmu[a]—api yang menghanguskan[b]. Dia akan memusnahkan mereka dan menundukkan mereka di hadapanmu. Engkau akan menghalau mereka[c] dan membinasakan mereka dengan cepat, seperti yang telah Yahweh firmankan kepadamu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berjalan di depanmu.” Partisip Ibrani secara harfiah menggambarkan Yahweh sebagai Dia yang menyeberang lebih dahulu di depan Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “api yang melahap” atau “api yang memakan habis.”
    reason: lexical_alternative
  - marker: c
    text: Atau “merampas milik mereka” atau “membuat mereka kehilangan milik mereka.” Kata Ibrani dapat menyatakan penghalauan penduduk dan pengambilalihan milik mereka.
    reason: lexical_alternative
  - marker: d
    text: Atau “seperti yang Yahweh firmankan kepadamu.” Maksudnya, hal itu berlangsung sesuai dengan firman Yahweh sebelumnya kepada Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: Maka ketahuilah hari ini
  rationale: Bentuk orang kedua tunggal berfungsi sebagai desakan kepada Israel, sedangkan kata penghubung mengaitkannya dengan konteks sebelumnya. “Maka” menyatakan hubungan itu secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Ungkapan perjanjian dalam sapaan orang kedua tunggal diterjemahkan secara langsung dan ringkas.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: Dialah yang menyeberang di depanmu
  rationale: “Dialah” mempertahankan penekanan הוּא, sedangkan “menyeberang” menjaga gambaran konkret partisip עבר dan kaitannya dengan penyeberangan menuju negeri itu.
- source_word: אֵשׁ אֹכְלָה
  choice: bagaikan api yang melalap
  rationale: Ungkapan ini mempertahankan metafora kehadiran ilahi yang menghancurkan. “Bagaikan” membuat hubungan aposisionalnya wajar dalam bahasa Indonesia tanpa menjelaskan metafora secara berlebihan.
- source_word: יַשְׁמִידֵם
  choice: Dia akan memusnahkan mereka
  rationale: Bentuk kausatif שׁמד menyatakan penghancuran menyeluruh; “memusnahkan” mempertahankan kekuatan ungkapannya.
- source_word: יַכְנִיעֵם
  choice: menundukkan mereka
  rationale: Dalam konteks peperangan, bentuk kausatif כנע berarti membuat lawan takluk atau rendah, bukan terutama merendahkan batin mereka.
- source_word: לְפָנֶיךָ
  choice: di hadapanmu
  rationale: Ungkapan ini mempertahankan dimensi spasial dan militer dari tindakan Yahweh atas bangsa-bangsa itu.
- source_word: וְהוֹרַשְׁתָּם
  choice: Engkau akan mengusir mereka dari negeri itu
  rationale: Bentuk kausatif ירשׁ dalam konteks perebutan negeri menyatakan pencabutan kepemilikan atau pengusiran penduduk. Tambahan “dari negeri itu” mengungkapkan objek wilayah yang tersirat oleh konteks dan menghasilkan bahasa Indonesia yang alami.
- source_word: וְהַאֲבַדְתָּם מַהֵר
  choice: dan membinasakan mereka dengan cepat
  rationale: “Membinasakan” membedakan אבד dari שׁמד sebelumnya, sementara “dengan cepat” mempertahankan keterangan cara מַהֵר.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: seperti yang telah Yahweh firmankan kepadamu
  rationale: Bentuk perfektif menunjuk pada firman ilahi terdahulu. “Firmankan” sesuai bagi perkataan Allah tanpa mempersempitnya menjadi janji secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Gambaran ilahi אֵשׁ אֹכְלָה
  choice: bagaikan api yang melalap
  alternative: api yang menghanguskan
  rationale: Metafora tentang kehadiran Allah yang kudus dan menghancurkan dipertahankan tanpa diperhalus atau diperluas menjadi uraian doktrinal.
- issue: Hubungan tindakan Yahweh dan tindakan Israel
  choice: Yahweh memusnahkan dan menundukkan; Israel mengusir dan membinasakan
  alternative: Menggabungkan semua tindakan sebagai tindakan Yahweh saja atau Israel saja
  rationale: Pergantian subjek dalam bahasa Ibrani dipertahankan, sehingga ketegangan antara prakarsa ilahi dan tindakan Israel tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat dengan sapaan tunggal “engkau” sesuai bentuk Ibrani. Struktur penekanan “Dialah” dipertahankan, sedangkan ungkapan wilayah yang tersirat dibuat eksplisit secara terbatas agar alami dan jelas.
