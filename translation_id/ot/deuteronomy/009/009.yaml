  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: id
  text: Ketika aku naik ke gunung untuk menerima lempeng-lempeng batu[a], yaitu lempeng-lempeng perjanjian yang Yahweh adakan dengan kalian[b], aku tinggal di gunung itu selama empat puluh hari dan empat puluh malam. Aku tidak makan roti dan tidak minum air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk mengambil”; di sini maksudnya menerima lempeng-lempeng yang diberikan kepada Musa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memotong perjanjian dengan kalian”, sebuah ungkapan Ibrani baku untuk mengadakan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי
  choice: Ketika aku naik
  rationale: Bentuk ב ditambah infinitif construct dan akhiran orang pertama tunggal menyatakan waktu. Frasa ini alami dalam bahasa Indonesia dan tetap mempertahankan gerak naik.
- source_word: הָהָרָה
  choice: ke gunung
  rationale: Akhiran ה menunjukkan arah menuju gunung tertentu yang sudah dikenal dari konteks, yakni Horeb/Sinai.
- source_word: לָקַחַת
  choice: untuk menerima
  rationale: Makna dasarnya ialah “mengambil”, tetapi dalam konteks ini Musa naik untuk menerima lempeng yang diberikan kepadanya. Catatan kaki mempertahankan alternatif harfiahnya.
- source_word: לוּחֹת הָאֲבָנִים
  choice: lempeng-lempeng batu
  rationale: Ungkapan construct ini menyebut benda dan bahannya. “Lempeng-lempeng batu” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לוּחֹת הַבְּרִית
  choice: lempeng-lempeng dari perjanjian
  rationale: Pengulangan aposisional dalam bahasa Ibrani dipertahankan untuk menegaskan bahwa lempeng batu tersebut berkaitan dengan perjanjian.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: yang Yahweh adakan dengan kalian
  rationale: Kata kerja כרת, secara harfiah “memotong”, merupakan bagian dari ungkapan baku untuk mengadakan perjanjian. “Kalian” memperjelas bahwa akhiran Ibrani yang dipakai berbentuk jamak.
- source_word: וָאֵשֵׁב
  choice: aku tinggal
  rationale: ישב dapat berarti duduk, menetap, atau tinggal. Di sini lamanya keberadaan Musa di gunung menjadi fokus, sehingga “tinggal” paling sesuai.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: empat puluh hari dan empat puluh malam
  rationale: Terjemahan langsung mempertahankan ungkapan durasi yang berpasangan dalam teks Ibrani.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: Aku tidak makan roti
  rationale: לֶחֶם dapat merujuk pada makanan secara umum, tetapi arti konkretnya adalah roti. Terjemahan mempertahankan istilah konkret tersebut.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: dan tidak minum air
  rationale: Terjemahan langsung ini mempertahankan kesejajaran dengan pernyataan sebelumnya tanpa pengulangan subjek yang tidak diperlukan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber menggunakan Tetragramaton sebagai nama pribadi ilahi. Bentuk “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar, tanpa menambahkan tafsiran denominasi.
- issue: Hubungan klausa relatif dengan perjanjian
  choice: perjanjian yang Yahweh adakan dengan kalian
  alternative: lempeng-lempeng yang Yahweh buat bagi kalian
  rationale: Pemakaian כרת dengan gagasan perjanjian merupakan idiom baku “mengadakan perjanjian”. Terjemahan tidak mengalihkan tindakan itu menjadi pembuatan fisik lempeng.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Aku” mempertahankan tuturan langsung Musa, sedangkan “kalian” menyatakan dengan jelas bahwa orang kedua dalam bahasa Ibrani berbentuk jamak. Pengulangan “lempeng-lempeng” dipertahankan karena merupakan penekanan dalam teks sumber.
