  source_fidelity: Teks Indonesia dengan setia menerjemahkan וּבְחֹרֵב sebagai penekanan yang wajar (“Bahkan di Horeb”), Hifil הִקְצַפְתֶּם sebagai tindakan yang menyebabkan murka, serta וַיִּתְאַנַּף ... לְהַשְׁמִיד sebagai murka yang berhubungan langsung dengan ancaman pemusnahan. “Sehingga hendak memusnahkan” menyampaikan hasil/tujuan yang mengancam tanpa menyatakan pemusnahan telah terjadi.
