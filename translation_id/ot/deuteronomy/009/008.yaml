  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/חֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת יְהוָ֑ה וַ/יִּתְאַנַּ֧ף יְהוָ֛ה בָּ/כֶ֖ם לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: id
  text: Bahkan di Horeb[a] kamu membangkitkan murka Yahweh, dan Yahweh begitu murka terhadap kamu sehingga hendak memusnahkan kamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Di Horeb” atau “Dan di Horeb”. Kata penghubung Ibrani dapat sekadar melanjutkan uraian, meskipun di sini kemungkinan memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “Yahweh murka terhadap kamu untuk memusnahkan kamu.” Bahasa Ibrani menghubungkan murka Yahweh secara langsung dengan pemusnahan yang diancamkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: Bahkan di Horeb
  rationale: Kata penghubung וּ dapat sekadar melanjutkan uraian, tetapi dalam konteks ini kemungkinan memberi penekanan. “Bahkan di Horeb” menyampaikan penekanan itu secara alami sambil mempertahankan nama tempat Horeb.
- source_word: הִקְצַפְתֶּם
  choice: kamu membangkitkan murka
  rationale: Bentuk Hifil dari קצף menyatakan tindakan menyebabkan kemarahan atau membangkitkan murka. Ungkapan ini mempertahankan daya kausatif serta bobot pelanggaran umat.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”; penanda objek langsung אֶת tidak diterjemahkan.
- source_word: וַיִּתְאַנַּף יְהוָה בָּכֶם
  choice: Yahweh begitu murka terhadap kamu
  rationale: Verba אנף menyatakan kemarahan yang kuat. “Terhadap kamu” mengungkapkan arah permusuhan yang ditandai oleh בָּכֶם, sedangkan “begitu” menghubungkan murka itu secara wajar dengan ancaman pemusnahan berikutnya.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: sehingga hendak memusnahkan kamu
  rationale: Infinitif Hifil dari שׁמד berarti membinasakan atau memusnahkan. Rumusan ini menghubungkan murka Yahweh dengan tujuan atau akibat yang mengancam umat tanpa menyatakan bahwa pemusnahan itu benar-benar terlaksana.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi יְהוָה secara langsung. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Hubungan antara murka Yahweh dan pemusnahan yang diancamkan
  choice: begitu murka ... sehingga hendak memusnahkan
  alternative: murka ... untuk memusnahkan
  rationale: Konstruksi לְ dengan infinitif dapat menyatakan tujuan atau akibat. Terjemahan utama menyampaikan hubungan erat antara murka dan ancaman pemusnahan secara alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan kemungkinan susunan yang lebih langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara daya kausatif verba pertama, intensitas murka, nama ilahi, dan ketegangan antara tujuan serta akibat pada infinitif terakhir tetap dipertahankan.
