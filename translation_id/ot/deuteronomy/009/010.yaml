  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: id
  text: Lalu Yahweh memberikan kepadaku kedua loh batu itu, yang ditulisi dengan jari Allah. Pada loh-loh itu tertulis semua firman yang telah Yahweh sampaikan kepada kalian[a] di gunung, dari tengah-tengah api, pada hari perhimpunan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbicara dengan kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Menyampaikan arti dasar נתן secara alami dalam bahasa Indonesia; konteksnya adalah Yahweh memberikan loh-loh itu kepada Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi yang dinyatakan langsung oleh Tetragramaton.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: kedua loh batu itu
  rationale: Ungkapan ini alami dan jelas dalam bahasa Indonesia serta mempertahankan acuan tertentu pada dua loh batu.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: yang ditulisi dengan jari Allah
  rationale: Mempertahankan bentuk pasif dan gambaran antropomorfis yang konkret; 'dengan' menyatakan sarana tanpa menafsirkan gambaran tersebut.
- source_word: וַעֲלֵיהֶם כְּכָל הַדְּבָרִים
  choice: Pada loh-loh itu tertulis semua firman
  rationale: Klausa Ibrani tidak menyatakan verba secara eksplisit; 'tertulis' dilengkapi agar wajar dalam bahasa Indonesia. 'Semua firman' menyampaikan keseluruhan perkataan ilahi dalam konteks ini.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: yang telah Yahweh sampaikan kepada kalian
  rationale: Bentuk ini alami dalam bahasa Indonesia dan menempatkan tindakan berbicara sebelum pemberian loh. 'Kepada kalian' menyampaikan fungsi idiomatis עִם dalam konteks, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: dari tengah-tengah api
  rationale: Mempertahankan kekhususan dan gambaran ruang dari ungkapan Ibrani, bukan meratakannya menjadi sekadar 'dari api'.
- source_word: בְּיוֹם הַקָּהָל
  choice: pada hari perhimpunan itu
  rationale: קהל menunjuk pada perhimpunan umat Israel; bentuk ini ringkas, bermartabat, dan tetap mudah dipahami.
theological_decisions:
- issue: Gambaran antropomorfis tentang tindakan Allah
  choice: dengan jari Allah
  alternative: oleh kuasa Allah
  rationale: Teks Ibrani secara eksplisit memakai gambaran 'jari Allah'. Terjemahan mempertahankan gambaran dan ketegangan teologisnya tanpa mengubahnya menjadi penjelasan abstrak.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama ilahi dipertahankan sebagai nama diri sesuai bukti bahasa sumber, bukan diganti dengan gelar.
- issue: Nuansa preposisi dalam דִּבֶּר יְהוָה עִמָּכֶם
  choice: Yahweh sampaikan kepada kalian
  alternative: Yahweh berbicara dengan kalian
  rationale: Dalam konteks pewahyuan, 'kepada kalian' merupakan bentuk Indonesia yang paling alami, tetapi unsur dialogis atau kebersamaan yang mungkin tersirat dalam עִם tidak dihapus dan dicatat sebagai alternatif harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Kalian' dipakai untuk menandai penerima jamak secara jelas; 'loh batu' mempertahankan istilah Alkitabiah yang telah umum, sedangkan struktur kalimat dipecah menjadi dua agar mudah dibaca tanpa kehilangan hubungan antarklausa.
