id: DEU.9.27
reference: Deuteronomy 9:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: id
  text: Ingatlah akan hamba-hamba-Mu, Abraham, Ishak, dan Yakub. Janganlah mengindahkan[a] sikap keras kepala[b] bangsa ini, kejahatan mereka, ataupun dosa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “janganlah berpaling kepada”; dapat juga diterjemahkan “janganlah memperhatikan” atau “janganlah memandang”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kekerasan”; yang dimaksud ialah kekerasan atau ketegaran sikap, bukan idiom khusus “tegar tengkuk” yang dipakai di tempat lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Ingatlah akan
  rationale: Bentuk imperatif ini ditujukan kepada Allah dalam doa syafaat Musa. Ungkapan ini wajar dalam bahasa Indonesia dan mempertahankan nuansa mengingat dalam konteks relasi perjanjian.
- source_word: לַעֲבָדֶיךָ
  choice: hamba-hamba-Mu
  rationale: עבד dapat berarti hamba atau budak. Di sini kata itu menjadi sebutan penuh hormat bagi para leluhur dalam hubungan mereka dengan Allah; status perbudakan bukan pokok yang ditonjolkan.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraham, Ishak, dan Yakub
  rationale: Nama-nama pribadi mengikuti bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: אַל תֵּפֶן אֶל
  choice: Janganlah mengindahkan
  rationale: Secara harfiah פנה dengan אֶל berarti berpaling atau menghadap kepada. Dalam doa ini maknanya ialah memberikan perhatian atau pertimbangan; 'mengindahkan' menyampaikan maksud tersebut secara ringkas dan bermartabat.
- source_word: קְשִׁי
  choice: sikap keras kepala
  rationale: Nomina ini menunjuk pada kekerasan atau ketegaran yang bersifat moral. 'Sikap keras kepala' jelas bagi pembaca modern dan tidak memasukkan idiom 'tegar tengkuk' yang berasal dari ungkapan Ibrani lain.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עם berarti suatu umat atau bangsa. Dalam kalimat Indonesia, 'bangsa ini' alami untuk kelompok Israel yang sedang dibicarakan, tanpa mengubah rujukan kolektifnya.
- source_word: רִשְׁעוֹ
  choice: kejahatan mereka
  rationale: רשע di sini menunjuk pada keburukan moral. Akhiran tunggal Ibrani merujuk secara kolektif kepada bangsa itu, sehingga bentuk jamak 'mereka' lebih alami dalam bahasa Indonesia.
- source_word: חַטָּאתוֹ
  choice: dosa mereka
  rationale: חטאת menunjuk pada dosa atau pelanggaran. Akhiran tunggalnya merujuk kepada bangsa sebagai satu kesatuan, tetapi bahasa Indonesia secara alami memakai 'mereka'.
theological_decisions:
- issue: Makna עבד sebagai sebutan bagi para leluhur
  choice: hamba-hamba-Mu
  alternative: budak-budak-Mu
  rationale: Dalam doa ini istilah tersebut berfungsi sebagai sebutan relasional dan penuh hormat bagi Abraham, Ishak, dan Yakub. Terjemahan 'budak' akan menonjolkan status keterikatan yang tidak menjadi fokus konteks.
- issue: Akhiran tunggal kolektif pada 'kejahatan' dan 'dosa'
  choice: kejahatan mereka ... dosa mereka
  alternative: kejahatannya ... dosanya
  rationale: Bahasa Ibrani memperlakukan עָם sebagai nomina kolektif tunggal. Bahasa Indonesia lebih alami memakai pronomina jamak ketika membicarakan tindakan moral anggota-anggota bangsa itu; pilihan ini tidak mengubah isi teologis.
- issue: Permohonan agar Allah tidak memperhatikan dosa bangsa itu
  choice: Janganlah mengindahkan
  alternative: Janganlah berpaling kepada / Janganlah memandang
  rationale: Pilihan utama menyampaikan permohonan Musa agar kekerasan hati dan dosa Israel tidak dijadikan perhatian atau pertimbangan, sambil mempertahankan alternatif metaforis sumber dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'hamba-hamba-Mu' mempertahankan register doa, sedangkan 'sikap keras kepala' tetap mudah dipahami pembaca umum. Huruf kapital pada '-Mu' mengikuti kebiasaan penghormatan dalam tulisan keagamaan Indonesia.
