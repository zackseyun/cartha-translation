base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: id
  text: Lalu aku berdoa kepada Yahweh dan berkata, “Ya Tuhan Yahweh,[a] janganlah membinasakan umat-Mu dan warisan-Mu, yang telah Kautebus dengan kebesaran-Mu, yang Kaubawa keluar dari Mesir dengan tangan yang kuat.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Tuhan Yahweh.” Gelar ini menggabungkan אֲדֹנָי dengan nama ilahi יְהוָה.'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “dengan tangan yang perkasa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל יְהוָה וָאֹמַר
  choice: Lalu aku berdoa kepada Yahweh dan berkata
  rationale: Bentuk wayyiqtol meneruskan urutan kisah. “Lalu” menyatakan kelanjutan itu secara alami, sementara “berdoa kepada” menerjemahkan אֶל dengan langsung.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  rationale: Ungkapan ini memadukan gelar אֲדֹנָי dan nama ilahi יְהוָה. Bentuk “Tuhan YAHWEH” mempertahankan kedua unsurnya tanpa meleburkan nama diri menjadi gelar.
- source_word: אַל תַּשְׁחֵת
  choice: janganlah membinasakan
  rationale: Larangan jusif ini bersifat sungguh-sungguh. “Membinasakan” mempertahankan bobot שׁחת tanpa menentukan cara kebinasaan.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: umat-Mu dan milik pusaka-Mu
  rationale: “Umat-Mu” adalah padanan wajar bagi עַם dengan akhiran orang kedua. “Milik pusaka-Mu” mempertahankan nuansa נַחֲלָה sebagai bagian atau kepunyaan yang dikhususkan bagi Yahweh.
- source_word: אֲשֶׁר פָּדִיתָ בְּגָדְלֶךָ
  choice: yang telah Kautebus dengan kebesaran-Mu
  rationale: פדה diterjemahkan “menebus” sesuai konteks pembebasan keluaran. גֹּדֶל secara harfiah menunjuk pada kebesaran; terjemahan ini tidak mempersempitnya hanya menjadi kuasa.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם
  choice: yang Kaubawa keluar dari Mesir
  rationale: הוציא dalam rumusan keluaran berarti membawa keluar. Bentuk ini mempertahankan tindakan Yahweh sebagai pelaku pembebasan.
- source_word: בְּיָד חֲזָקָה
  choice: dengan tangan yang kuat
  rationale: Padanan ini dekat dengan ungkapan Ibrani dan mempertahankan metafora tangan sebagai lambang kekuatan yang bekerja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Penerjemahan gelar gabungan אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  alternative: Tuhan ALLAH
  rationale: Pilihan ini mempertahankan baik gelar אֲדֹנָי maupun nama יְהוָה. Huruf kapital pada YAHWEH membantu menandai unsur nama ilahi dalam gelar gabungan, tanpa menghasilkan pengulangan “Tuhan TUHAN”.
- issue: Makna נַחֲלָה bagi Israel
  choice: milik pusaka-Mu
  alternative: warisan-Mu
  rationale: Dalam konteks ini Israel dipandang sebagai kepunyaan yang menjadi bagian Yahweh. “Milik pusaka” menjaga nuansa perjanjian tanpa menyiratkan bahwa Yahweh menerima warisan karena kematian pihak lain.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Bentuk pronomina terikat dengan huruf kapital dipakai saat merujuk kepada Allah. Susunan klausa relatif dipertahankan agar hubungan antara umat, milik pusaka, penebusan, dan keluaran tetap jelas.
