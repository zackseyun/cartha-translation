  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵ֛י לֻחֹ֥ת הָ/אֲבָנִ֖ים לֻח֥וֹת הַ/בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: id
  text: Pada akhir empat puluh hari dan empat puluh malam,[a] Yahweh memberikan kepadaku kedua lempeng batu itu, yaitu lempeng-lempeng perjanjian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dan terjadilah pada akhir empat puluh hari dan empat puluh malam, Yahweh memberikan kepadaku ....”'
    reason: Bentuk וַיְהִי dapat ditampilkan secara eksplisit sebagai pengantar naratif, tetapi dalam teks utama fungsinya disampaikan secara lebih alami melalui keterangan waktu.
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Bentuk naratif וַיְהִי mengantar keterangan waktu. Dalam bahasa Indonesia alami, fungsinya tercakup oleh pembukaan temporal “Pada akhir ...”, tanpa ungkapan kaku “Dan terjadilah”.
- source_word: מִקֵּץ
  choice: pada akhir
  rationale: Ungkapan ini menunjuk pada titik selesainya suatu jangka waktu; “pada akhir” mempertahankan batas temporal itu lebih tepat daripada sekadar “setelah”.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: empat puluh hari dan empat puluh malam
  rationale: Ungkapan Ibrani dipertahankan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: נָתַן
  choice: memberikan
  rationale: Ini menyampaikan arti umum verba נתן tanpa menambahkan nuansa seperti menyerahkan secara resmi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Preposisi אֶל dengan verba “memberikan” menyatakan penerima; “kepadaku” jelas dan alami.
- source_word: שְׁנֵי
  choice: kedua
  rationale: Bentuk konstruk ini menunjuk kepada sepasang lempeng tertentu dalam konteks; “kedua ... itu” menyatakan ketentuan tersebut secara alami.
- source_word: לֻחֹת הָאֲבָנִים
  choice: lempeng batu
  rationale: Frasa ini menyatakan lempeng yang terbuat dari batu. “Lempeng batu” ringkas, modern, dan setia pada hubungan nomina dalam bahasa Ibrani.
- source_word: לֻחוֹת הַבְּרִית
  choice: lempeng-lempeng perjanjian
  rationale: Pengulangan kata “lempeng” dipertahankan sebagai penjelasan aposisional, sehingga penekanan pada kaitannya dengan perjanjian tidak hilang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan lempeng batu dengan perjanjian
  choice: yaitu lempeng-lempeng perjanjian
  alternative: lempeng-lempeng batu perjanjian
  rationale: Kata לֻחוֹת diulang dalam bahasa Ibrani sebagai penyebutan kembali yang menjelaskan identitas kedua lempeng itu. “Yaitu” membuat hubungan aposisional tersebut jelas tanpa menambahkan tafsiran tentang isi atau fungsi perjanjian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Lempeng” dipilih karena mudah dipahami untuk benda pipih bertulis, sedangkan “kedua ... itu” menyatakan pasangan yang sudah tertentu. Koma sesudah penanda catatan kaki memisahkan keterangan waktu dari klausa utama.
