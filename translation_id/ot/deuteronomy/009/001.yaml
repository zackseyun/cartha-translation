revisions:
- from: Dengarlah, Israel! Hari ini engkau akan menyeberangi Sungai Yordan untuk masuk dan menghalau[a] bangsa-bangsa yang lebih besar dan lebih kuat daripada engkau, dengan kota-kota besar yang berbenteng sampai ke langit[b].
  to: 'Dengarlah, Israel: hari ini engkau menyeberangi Sungai Yordan untuk memasuki negeri itu dan mengambil alih wilayah bangsa-bangsa yang lebih besar dan lebih kuat daripada engkau, dengan kota-kota besar dan berbenteng sampai ke langit[b].[a]'
  rationale: Revisi mengganti "menghalau" dengan ungkapan yang mencakup inti makna ירשׁ, yaitu pengambilalihan milik atau wilayah, tanpa mengubahnya menjadi sekadar tindakan mengusir. "Negeri itu" dan "wilayah" membuat objek penguasaan yang tersirat dalam rangkaian "menyeberangi Yordan ... masuk" menjadi idiomatis dalam bahasa Indonesia. Urutan penanda kaki diubah agar jangkar a berada pada frasa yang diterangkannya, yaitu "mengambil alih wilayah", dan jangkar b pada "langit".
  reviewer_model: gpt-5.6-terra
