  terminology: '"Dengarlah" dan "engkau" mempertahankan sapaan tunggal kepada Israel sebagai umat kolektif. "Sungai Yordan", "bangsa-bangsa", dan "berbenteng sampai ke langit" bersifat baku dan mempertahankan citra hiperbolis sumber. Catatan a diperbarui agar sesuai dengan pilihan utama dan jangkar b tetap melekat pada "langit".'
