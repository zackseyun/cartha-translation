  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: id
  text: 'Dengarlah, Israel: hari ini engkau menyeberangi Sungai Yordan untuk memasuki negeri itu dan mengambil alih wilayah bangsa-bangsa yang lebih besar dan lebih kuat daripada engkau, dengan kota-kota besar dan berbenteng sampai ke langit[b].[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mewarisi" atau "mengambil milik". Kata kerja Ibrani ini berarti mengambil atau memperoleh milik; dalam konteks penaklukan ini, tindakan itu mencakup pengambilalihan dari penduduk sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "sampai ke langit"; ungkapan hiperbolis tentang kota-kota yang sangat tinggi dan berbenteng kuat.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarlah
  rationale: Bentuk perintah tunggal yang menyapa Israel sebagai satu umat. Pilihan ini mempertahankan seruan perjanjian yang khas dalam Ulangan dan terdengar wajar dalam bahasa Indonesia.
- source_word: עֹבֵר הַיּוֹם
  choice: Hari ini engkau akan menyeberangi
  rationale: Partisip dengan keterangan 'hari ini' menyatakan tindakan yang segera berlangsung. Kata 'akan' memperjelas sifat imminennya tanpa menjauh dari maksud sumber.
- source_word: אֶת־הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama geografis ini secara lazim disebut 'Sungai Yordan' dalam bahasa Indonesia; penambahan jenis geografis membuat ungkapan lebih alami.
- source_word: לָבֹא
  choice: untuk masuk
  rationale: Infinitif בוא sesudah tindakan menyeberangi Yordan menunjuk pada masuknya Israel ke negeri itu.
- source_word: לָרֶשֶׁת
  choice: menghalau
  rationale: Dalam konteks penaklukan, ירשׁ dapat menunjuk pada mengambil alih dengan menyingkirkan penduduk sebelumnya. Karena objek langsungnya adalah bangsa-bangsa, 'menghalau' lebih idiomatis daripada 'menduduki bangsa-bangsa'.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Padanan baku bagi kelompok-kelompok nasional yang berbeda dalam konteks ini.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: yang lebih besar dan lebih kuat daripada engkau
  rationale: Mempertahankan kedua sifat komparatif, yakni kebesaran atau skala dan kekuatan, serta perbandingan langsung dengan Israel.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת
  choice: dengan kota-kota besar yang berbenteng
  rationale: Kata 'dengan' memperjelas hubungan kota-kota itu dengan bangsa-bangsa yang disebut sebelumnya, sementara 'berbenteng' menyampaikan keadaan kota yang diperkuat pertahanannya.
- source_word: בַּשָּׁמָיִם
  choice: sampai ke langit
  rationale: Mempertahankan gambaran hiperbolis Ibrani tentang benteng yang luar biasa tinggi dan kuat dalam ungkapan Indonesia yang alami.
theological_decisions:
- issue: Gambaran hiperbolis tentang benteng kota
  choice: berbenteng sampai ke langit
  alternative: berbenteng sangat tinggi
  rationale: Terjemahan mempertahankan citra retoris teks Ibrani dan tidak meratakannya menjadi parafrasa faktual.
- issue: Makna ירשׁ ketika objeknya bangsa-bangsa
  choice: menghalau
  alternative: mengambil alih milik
  rationale: Pilihan utama mengikuti nuansa penyingkiran penduduk dalam konteks penaklukan, tetapi catatan kaki mempertahankan kemungkinan nuansa mengambil alih atau menduduki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal 'engkau' mempertahankan cara teks Ibrani memperlakukan Israel secara kolektif. Tanda seru sesudah seruan pembuka memberi pemisahan yang jelas tanpa menambah isi.
