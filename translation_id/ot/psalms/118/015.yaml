  text: ק֤וֹל רִנָּ֬ה וִֽ/ישׁוּעָ֗ה בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/015.yaml
  text: 'The sound of joyful shouting and salvation is in the tents of the righteous: “The right hand of Yahweh does valiantly!”[a][b]'
translation:
  language: id
  text: 'Suara sorak-sorai sukacita dan keselamatan[a] terdengar di kemah-kemah orang benar: “Tangan kanan Yahweh bertindak dengan gagah perkasa!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemenangan” atau “pembebasan”.
    reason: lexical_alternative
  - marker: b
    text: Idiom Ibrani ini juga dapat diterjemahkan “bertindak dengan penuh kuasa” atau “melakukan perbuatan-perbuatan perkasa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רִנָּ֬ה
  choice: Suara sorak-sorai sukacita
  rationale: קוֹל menunjuk pada suara yang terdengar, sedangkan רִנָּה adalah seruan kegembiraan yang lantang. Ungkapan ini mempertahankan unsur bunyi dan suasana perayaan.
- source_word: וִֽישׁוּעָ֗ה
  choice: keselamatan
  rationale: יְשׁוּעָה dapat berarti keselamatan, pembebasan, atau kemenangan. 'Keselamatan' mempertahankan cakupan makna yang luas, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: בְּ/אָהֳלֵ֥י
  choice: di kemah-kemah
  rationale: Bentuk jamak אָהֳלֵי secara konkret berarti 'kemah-kemah'. Citra konkret ini dipertahankan dan tidak diabstraksikan menjadi rumah atau kediaman.
- source_word: צַדִּיקִ֑ים
  choice: orang benar
  rationale: צַדִּיקִים menunjuk pada orang-orang yang benar. Bentuk 'orang benar' alami dalam bahasa Indonesia dan mempertahankan kategori etis-perjanjian dalam teks.
- source_word: יְמִ֥ין יְ֝הוָה
  choice: Tangan kanan Yahweh
  rationale: Ungkapan ini mempertahankan metafora tangan kanan sebagai kuasa yang bertindak serta menyajikan nama ilahi יְהוָה sebagai 'Yahweh'.
- source_word: עֹ֣שָׂה חָֽיִל
  choice: bertindak dengan gagah perkasa
  rationale: Idiom ini menyatakan tindakan yang dilakukan dengan kekuatan atau keperkasaan. Terjemahan ini alami dalam bahasa Indonesia tanpa mempersempitnya menjadi satu tindakan militer tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Bentuk 'Yahweh' mempertahankan nama diri tersebut.
- issue: Makna יְשׁוּעָה dalam mazmur kemenangan
  choice: keselamatan
  alternative: kemenangan atau pembebasan
  rationale: Konteks merayakan tindakan penyelamatan Yahweh. 'Keselamatan' mencakup penyelamatan konkret dan resonansi teologis yang lebih luas, sedangkan nuansa kemenangan dan pembebasan tetap dicatat sebagai kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa dibuat alami dengan menambahkan 'terdengar', yang tersirat dalam klausa nominal Ibrani, tanpa mengubah isi pokok. Metafora 'tangan kanan' dan citra 'kemah-kemah' dipertahankan.
