id: PSA.118.28
reference: Psalms 118:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵלִ֣/י אַתָּ֣ה וְ/אוֹדֶ֑/ךָּ אֱ֝לֹהַ֗/י אֲרוֹמְמֶֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/028.yaml
  text: You are my God[a], and I will give thanks to you; my God[b], I will exalt you.
translation:
  language: id
  text: Engkaulah Allahku, dan aku hendak bersyukur kepada-Mu[a]; ya Allahku, aku hendak meninggikan-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memuji-Mu”; dalam konteks mazmur, verba ini dapat mencakup ucapan syukur dan pujian.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengagungkan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי
  choice: Allahku
  rationale: Bentuk אֵל dengan akhiran orang pertama tunggal berarti “Allahku” dan berfungsi sebagai sapaan langsung dalam konteks ibadah.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Pronomina mandiri ini memberi penekanan pada klausa nominal “Allahku, Engkau”; bentuk “Engkaulah Allahku” menyampaikan penekanan tersebut secara alami dalam bahasa Indonesia.
- source_word: וְאוֹדֶךָ
  choice: dan aku hendak bersyukur kepada-Mu
  rationale: Bentuk Hifil dari ידה dalam mazmur lazim menyatakan ucapan syukur yang sekaligus bernuansa pujian. “Hendak” menyampaikan tekad atau niat yang terkandung dalam bentuk verba Ibrani ini.
- source_word: אֱלֹהַי
  choice: ya Allahku
  rationale: Sapaan ilahi kedua ini sejajar dengan אֵלִי. Partikel “ya” memperjelas fungsi sapaan sambil mempertahankan pengulangan puitis “Allahku”.
- source_word: אֲרוֹמְמֶךָ
  choice: aku hendak meninggikan-Mu
  rationale: Verba dari רום menyatakan tindakan meninggikan atau mengagungkan. “Meninggikan-Mu” mempertahankan metafora vertikal bahasa Ibrani dan tetap wajar dalam bahasa pujian.
theological_decisions:
- issue: Penerjemahan dua sebutan ilahi אֵלִי dan אֱלֹהַי
  choice: Allahku ... Allahku
  alternative: Yang Mahakuasa milikku ... Allahku
  rationale: Keduanya merupakan sapaan langsung kepada Allah dan membentuk kesejajaran puitis. Terjemahan yang sama mempertahankan penekanan pada hubungan pribadi tanpa memasukkan perbedaan makna teologis yang tidak dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. “Engkaulah” mempertahankan penekanan Ibrani, sedangkan “hendak” menyatakan tekad puitis. Semua penanda catatan kaki ditempatkan langsung pada kata atau frasa yang dijelaskan.
