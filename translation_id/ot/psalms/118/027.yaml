  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֤ל יְהוָה֮ וַ/יָּ֪אֶר לָ֥/נוּ אִסְרוּ חַ֥ג בַּ/עֲבֹתִ֑ים עַד קַ֝רְנ֗וֹת הַ/מִּזְבֵּֽחַ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/027.yaml
  text: Yahweh is God[a], and he has given light to us. Bind the festal sacrifice with cords[d][c][b], up to the horns of the altar.
translation:
  language: id
  text: 'TUHAN adalah Allah,

    dan Ia telah menerangi kita.[a]

    Ikatlah kurban perayaan itu dengan tali

    sampai pada tanduk-tanduk mazbah.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia telah menyinari kita.” Kata kerja Ibrani dapat berarti bahwa TUHAN memberi terang kepada umat-Nya atau menyinari mereka dengan kemurahan-Nya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Ikatlah perayaan itu.” Kata Ibrani yang dipakai biasanya berarti “perayaan” atau “hari raya,” tetapi di sini banyak penafsir memahaminya sebagai kurban perayaan; yang lain memahami baris ini sebagai gambaran arak-arakan perayaan.
    reason: alternative_reading
  - marker: c
    text: “Tali” dapat juga diterjemahkan “tali-tali tebal.” Sebagian orang menafsirkannya sebagai “ranting-ranting,” tetapi arti “tali” lebih mungkin secara leksikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל יְהוָה
  choice: TUHAN adalah Allah
  rationale: Klausa nominal ini mengidentifikasikan YHWH sebagai Allah. Nama perjanjian יהוה diterjemahkan dengan bentuk baku Indonesia, “TUHAN,” sedangkan אֵל berfungsi sebagai predikat, “Allah.”
- source_word: וַיָּאֶר לָנוּ
  choice: dan Ia telah menerangi kita
  rationale: Bentuk Hifil dari אור lazim berarti “memberi terang/menerangi.” Pilihan ini mempertahankan nuansa kausatif sekaligus tetap memungkinkan gagasan bahwa TUHAN menyinari umat-Nya dengan kemurahan.
- source_word: אִסְרוּ
  choice: Ikatlah
  rationale: Imperatif jamak dari אסר secara langsung berarti “ikatlah.” Bahasa Indonesia tidak menandai jamak pada imperatif ini, tetapi konteks seruan komunal tetap dapat dipahami.
- source_word: חַג
  choice: kurban perayaan itu
  rationale: חַג biasanya berarti “perayaan/hari raya,” tetapi bersama perintah mengikat dan acuan kepada mazbah, kata ini kemungkinan dipakai secara metonimis untuk kurban yang dipersembahkan pada perayaan tersebut.
- source_word: בַּעֲבֹתִים
  choice: dengan tali
  rationale: Kata benda ini paling wajar menunjuk pada tali atau tambang. “Tali” alami dalam bahasa Indonesia dan sesuai dengan verba “ikatlah.”
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  choice: sampai pada tanduk-tanduk mazbah
  rationale: “Sampai pada” mempertahankan nilai עַד tanpa memastikan apakah kurban harus diikat langsung kepada tanduk mazbah. Bentuk jamak “tanduk-tanduk” menggambarkan tonjolan pada sudut-sudut mazbah.
theological_decisions:
- issue: Rujukan kultis חַג dalam perintah untuk mengikat
  choice: Diterjemahkan secara metonimis sebagai “kurban perayaan itu”
  alternative: “perayaan itu” atau “arak-arakan perayaan”
  rationale: Konteks ibadah di mazbah dan verba “ikatlah” paling alami menunjuk kepada hewan kurban. Namun, karena חַג sendiri biasanya berarti perayaan, alternatif prosesi/perayaan dicatat dan tidak disembunyikan.
- issue: Makna tindakan ilahi dalam וַיָּאֶר לָנוּ
  choice: “Ia telah menerangi kita”
  alternative: “Ia telah menyinari kita” dalam arti menunjukkan kemurahan-Nya
  rationale: Bentuk kausatif mendukung “menerangi,” tetapi konteks dapat memberi nuansa sinar kemurahan ilahi. Terjemahan utama mempertahankan ungkapan terang tanpa menjadikannya doktrin teknis.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “TUHAN” dipakai untuk יהוה, “Allah” untuk אֵל, dan “mazbah” dipertahankan sebagai istilah ibadah yang dikenal luas. Susunan puitis dibuat ringkas; ambiguitas utama mengenai חַג dan citra terang dijelaskan dalam catatan kaki.
