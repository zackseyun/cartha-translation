  text: סַבּ֤וּ/נִי כִ/דְבוֹרִ֗ים דֹּ֭עֲכוּ כְּ/אֵ֣שׁ קוֹצִ֑ים בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/012.yaml
  text: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
translation:
  language: id
  text: 'Mereka mengerumuni aku seperti lebah;

    mereka padam seperti api di semak duri.[a]

    Dengan nama Yahweh,

    sungguh, aku menebas mereka.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti api duri.” Ungkapan Ibrani ini padat dan dapat menggambarkan api pada semak duri yang berkobar cepat lalu segera padam.
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku memotong mereka” atau “aku memutuskan mereka.” Makna tepat kata kerja Ibrani ini tidak pasti; kata itu mengandung citra pemotongan atau penyingkiran.
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוּנִי
  choice: mereka mengerumuni aku
  rationale: Berasal dari סבב, ‘mengelilingi, mengepung’. Dalam konteks perbandingan dengan lebah, ‘mengerumuni’ terdengar alami dan sekaligus menyampaikan pengepungan yang mengancam.
- source_word: כִדְבוֹרִים
  choice: seperti lebah
  rationale: Prefiks כ menyatakan perbandingan; ungkapan ini mempertahankan gambaran kawanan lebah yang hidup dan mudah dipahami.
- source_word: דֹּעֲכוּ
  choice: mereka padam
  rationale: Kata kerja ini berarti ‘padam’ atau ‘menjadi padam’, khususnya tentang api. Terjemahan ini dekat dengan bentuk Ibrani dan menghubungkan musuh dengan gambaran api pada frasa berikutnya.
- source_word: כְּאֵשׁ קוֹצִים
  choice: seperti api di semak duri
  rationale: Ungkapan Ibrani yang padat dapat dipahami sebagai api dari atau di antara duri. ‘Api di semak duri’ alami dalam bahasa Indonesia serta mempertahankan gambaran api duri yang cepat menyala dan cepat padam.
- source_word: בְּשֵׁם יְהוָה
  choice: Dengan nama Yahweh
  rationale: Preposisi ב dapat menyatakan sarana atau dasar tindakan. ‘Dengan nama’ menyampaikan bahwa tindakan dilakukan dengan menyerukan atau mengandalkan nama ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: כִּי
  choice: sungguh
  rationale: Dalam pengulangan mazmur ini, כִּי paling wajar dibaca sebagai penegasan kuat, bukan sebagai pengantar alasan.
- source_word: אֲמִילַם
  choice: aku menebas mereka
  rationale: Bentuk dari מול di sini kemungkinan berarti ‘memotong, menyingkirkan, atau membabat’. ‘Menebas’ mempertahankan citra pemotongan dan cocok dengan suasana pertempuran tanpa menghapus ketidakpastian leksikalnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk ‘Yahweh’ mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Daya tindakan dalam frasa בְּשֵׁם יְהוָה
  choice: Dengan nama Yahweh
  alternative: Dalam nama Yahweh
  rationale: Pilihan ini mempertahankan kemungkinan bahwa pemazmur bertindak dengan menyerukan, mengandalkan, atau berdasarkan kuasa nama Yahweh, tanpa menentukan mekanismenya secara lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. Susunan baris mempertahankan paralelisme. ‘Mengerumuni’ dipilih agar perbandingan dengan lebah terasa alami, sedangkan ‘menebas’ menjaga citra tindakan memotong dalam konteks kemenangan.
