  text: זֶֽה הַ/שַּׁ֥עַר לַ/יהוָ֑ה צַ֝דִּיקִ֗ים יָבֹ֥אוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/020.yaml
  text: This is the gate of Yahweh[a]; the righteous will enter through it.
translation:
  language: id
  text: Inilah gerbang Yahweh[a]; orang-orang benar akan masuk melaluinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "gerbang bagi Yahweh" atau "gerbang menuju Yahweh." Kata depan Ibrani dapat menyatakan hubungan, peruntukan, atau arah.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Inilah
  rationale: Kata tunjuk ini mengidentifikasi gerbang yang sedang ditunjuk. 'Inilah' alami dalam bahasa Indonesia dan menyampaikan penegasan deiktis tanpa perlu menambahkan kopula.
- source_word: הַשַּׁעַר
  choice: gerbang
  rationale: Kata שַׁעַר menunjuk pada gerbang atau pintu gerbang. 'Gerbang' mempertahankan gambaran konkret dan sesuai dengan konteks peribadatan atau prosesi.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'. Hubungan yang dinyatakan oleh prefiks ל dibiarkan cukup ringkas dalam teks utama dan dijelaskan dalam catatan kaki karena dapat menyatakan kaitan, peruntukan, atau arah.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Bentuk jamak substantival ini menunjuk kepada orang yang bercirikan kebenaran. 'Orang-orang benar' jelas, wajar, dan mempertahankan bobot moral-teologisnya.
- source_word: יָבֹאוּ
  choice: akan masuk
  rationale: Imperfek Qal orang ketiga jamak dari בוא di sini menyatakan tindakan masuk yang akan terjadi. 'Akan masuk' idiomatis dalam kaitannya dengan gerbang.
- source_word: בוֹ
  choice: melaluinya
  rationale: Dengan acuan berupa gerbang, בּוֹ secara alami berarti melewati atau melalui gerbang itu. 'Melaluinya' mempertahankan acuan pronominal dan gerak yang dimaksud.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan semantis prefiks ל pada לַיהוָה
  choice: gerbang Yahweh
  alternative: gerbang bagi Yahweh; gerbang menuju Yahweh
  rationale: Prefiks ל dapat menyatakan hubungan, peruntukan, atau arah. Ungkapan 'gerbang Yahweh' paling ringkas dan sesuai konteks, sementara kemungkinan lain dipertahankan dalam catatan kaki agar ambiguitas Ibrani tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur ayat dibuat ringkas, sesuai bentuk deklaratif teks Ibrani, dan mudah dipahami pembaca umum.
