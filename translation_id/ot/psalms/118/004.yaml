  yaml_path: translation/ot/psalms/118/004.yaml
  text: Let those who fear Yahweh now say[a], “His steadfast love endures forever.”
translation:
  language: id
  text: Biarlah orang-orang yang takut kepada Yahweh sekarang berkata, “Kasih setia-Nya tetap ada selama-lamanya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kasih setia perjanjian-Nya tetap ada selama-lamanya.” Kata Ibrani חֶסֶד mencakup kasih yang teguh serta kesetiaan yang loyal dalam ikatan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ נָא
  choice: Biarlah ... sekarang berkata
  rationale: Bentuk imperfek/jusif jamak dalam konteks liturgis ini menyampaikan ajakan. נָא memberi tekanan pada seruan tersebut, yang secara alami dinyatakan dengan “sekarang”.
- source_word: יִרְאֵי יְהוָה
  choice: orang-orang yang takut kepada Yahweh
  rationale: Frasa ini menunjuk kepada mereka yang dicirikan oleh rasa takut dan hormat kepada Yahweh. “Takut kepada” mempertahankan ungkapan teologis Ibrani tanpa menguranginya menjadi sekadar rasa hormat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כִּי
  choice: tidak diterjemahkan tersendiri
  rationale: Dalam susunan ini כִּי memperkenalkan isi seruan. Bahasa Indonesia lebih alami bila kutipan langsung segera menyatakan isi tersebut tanpa konjungsi “sebab” atau “bahwa”.
- source_word: לְעוֹלָם
  choice: tetap untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Kata “tetap” melengkapi klausa nominal Ibrani secara wajar dalam bahasa Indonesia.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan loyalitas dalam relasi perjanjian. “Kasih setia” merupakan padanan Indonesia yang ringkas dan cukup luas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankan fungsi nama diri itu.
- issue: Cakupan makna חֶסֶד
  choice: kasih setia
  alternative: kesetiaan pada perjanjian
  rationale: “Kasih setia” mempertahankan unsur kasih dan loyalitas tanpa membatasi kata tersebut hanya pada satu aspek perjanjian; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Struktur ajakan liturgis dipertahankan; kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia.
