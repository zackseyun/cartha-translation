  text: Give thanks to Yahweh[a], for he is good, for his steadfast love endures forever.
translation:
  language: id
  text: Bersyukurlah kepada Yahweh, sebab Ia baik, sebab untuk selama-lamanya kasih setia-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebab kasih setia-Nya tetap untuk selama-lamanya.” Secara lebih harfiah, teks Ibrani berbunyi, “sebab untuk selama-lamanya kasih setia-Nya.”'
    reason: Menjelaskan alternatif idiomatis yang menambahkan verba tersirat serta susunan harfiah klausa Ibrani yang tidak memiliki verba tersurat.
lexical_decisions:
- source_word: הוֹדוּ
  choice: Bersyukurlah
  rationale: Bentuk imperatif jamak dari ידה dalam Hifil di sini menyerukan umat untuk mengucap syukur; bentuk Indonesia ini alami dan sesuai dengan refrein liturgis mazmur.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menjadi tujuan ucapan syukur, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: כִּי טוֹב
  choice: sebab Ia baik
  rationale: כִּי menyatakan alasan, dan kopula serta subjek tersirat dilengkapi agar wajar dalam bahasa Indonesia. “Ia” mempertahankan ragam yang khidmat.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan tanpa akhir. Bentuk ini dekat dengan susunan Ibrani dan tidak menambahkan verba yang tidak tersurat.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kemurahan, dan kesetiaan yang teguh. “Kasih setia” merupakan padanan Indonesia yang ringkas dan mampu mempertahankan keluasan maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יהוה; transliterasi “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Apakah verba “tetap/bertahan” perlu ditambahkan dalam klausa terakhir
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: kasih setia-Nya tetap untuk selama-lamanya
  rationale: Klausa Ibrani tidak memiliki verba tersurat. Susunan terpilih tetap dapat dipahami dalam bahasa Indonesia sekaligus mempertahankan bentuk nominal dan ketegangan puitis teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat dengan irama liturgis. Pengulangan “sebab” mempertahankan paralelisme kedua כִּי dalam teks Ibrani.
