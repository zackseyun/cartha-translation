id: PSA.118.13
reference: Psalms 118:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּחֹ֣ה דְחִיתַ֣/נִי לִ/נְפֹּ֑ל וַ֖/יהוָ֣ה עֲזָרָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/013.yaml
  text: You pushed me hard so that I might fall[b][a], but Yahweh helped me.
translation:
  language: id
  text: Engkau mendorongku dengan keras supaya aku jatuh[a], tetapi Yahweh menolongku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Mendorong, engkau mendorongku,” suatu bentuk penegasan yang berarti “engkau mendorongku dengan keras” atau “engkau mendesakku dengan kuat.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan Yahweh menolongku.” Konjungsi Ibrani dapat diterjemahkan hanya sebagai “dan”, meskipun konteks mendukung arti kontras “tetapi”.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּחֹה דְחִיתַנִי
  choice: Engkau mendorongku dengan keras
  rationale: Infinitif absolut diikuti verba finit dari akar דחה membentuk penegasan. Bahasa Indonesia alami menyampaikan intensitas itu dengan frasa adverbial "dengan keras", bukan pengulangan harfiah.
- source_word: לִנְפֹּל
  choice: supaya aku jatuh
  rationale: Infinitif konstruk dengan ל dapat menyatakan tujuan atau hasil. "Supaya aku jatuh" mempertahankan nuansa tujuan tanpa memastikan secara berlebihan apakah kejatuhan itu benar-benar terjadi.
- source_word: וַיהוָה
  choice: tetapi Yahweh
  rationale: Waw secara dasar berarti "dan", tetapi dalam konteks ini menghubungkan serangan dengan pertolongan Yahweh secara kontras; "tetapi" wajar dalam bahasa Indonesia. Nama ilahi יהוה ditransliterasikan sebagai "Yahweh".
- source_word: עֲזָרָנִי
  choice: menolongku
  rationale: Verba Qal perfektum orang ketiga maskulin tunggal dengan sufiks objek orang pertama tunggal diterjemahkan langsung dan alami sebagai "menolongku".
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה. Transliterasi "Yahweh" mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Hubungan antarklausa dengan waw
  choice: tetapi
  alternative: dan
  rationale: Konteks mendukung hubungan kontras antara dorongan keras dari lawan dan pertolongan Yahweh, tetapi arti dasar konjungsi sebagai "dan" tetap dicatat agar ambiguitas sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan register puitis yang sederhana dan bermartabat. Pronomina "engkau" mempertahankan sapaan tunggal langsung; sufiks objek diterjemahkan ringkas sebagai "-ku".
