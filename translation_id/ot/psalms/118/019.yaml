  text: פִּתְחוּ לִ֥/י שַׁעֲרֵי צֶ֑דֶק אָֽבֹא בָ֝/ם אוֹדֶ֥ה יָֽהּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/019.yaml
  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
translation:
  language: id
  text: Bukalah bagiku gerbang-gerbang kebenaran[c]; aku akan masuk melaluinya dan bersyukur[b] kepada Yah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani “Yah”, bentuk singkat nama ilahi; beberapa terjemahan memakai “TUHAN”.
    reason: alternative_reading
  - marker: b
    text: Atau “memuji”. Kata kerja Ibrani ini dapat berarti mengucap syukur atau memuji, bergantung pada konteks.
    reason: lexical_alternative
  - marker: c
    text: Atau “keadilan”. Kata benda Ibrani ini dapat mengandung arti kebenaran atau keadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ לִי
  choice: Bukakanlah bagiku
  rationale: Bentuk perintah jamak dari פתח diikuti לִי meminta beberapa orang membuka jalan bagi penutur. Bahasa Indonesia tidak wajib menandai jumlah orang yang disapa; bentuk dengan sufiks -kan dan 'bagiku' menyampaikan tindakan yang dilakukan untuk kepentingan penutur secara alami.
- source_word: שַׁעֲרֵי צֶדֶק
  choice: pintu-pintu gerbang kebenaran
  rationale: שַׁעֲרֵי adalah bentuk jamak konstruksi dari 'gerbang', sedangkan צֶדֶק mencakup kebenaran, kelurusan, dan keadilan. 'Kebenaran' mempertahankan cakupan moral-religius yang sesuai dengan konteks ibadah, sementara kemungkinan 'keadilan' dicatat dalam catatan kaki.
- source_word: אָבֹא בָם
  choice: aku akan masuk melaluinya
  rationale: Imperfek orang pertama tunggal menyatakan tindakan yang hendak dilakukan sesudah gerbang dibuka. בָם secara harfiah berjumlah jamak, tetapi kata ganti tak bernyawa bahasa Indonesia tidak membedakan jumlah; 'melaluinya' dengan wajar menyatakan gerak melalui gerbang-gerbang itu.
- source_word: אוֹדֶה
  choice: bersyukur
  rationale: Dalam konteks pujian kepada Allah, bentuk dari ידה ini dapat berarti menyatakan syukur atau memuji. 'Bersyukur kepada' paling langsung mengungkapkan tindakan mengucap syukur, sedangkan kemungkinan 'memuji' dipertahankan dalam catatan kaki.
- source_word: יָהּ
  choice: Yah
  rationale: Teks memakai bentuk singkat nama ilahi, יָהּ, bukan tetragramaton lengkap. Transliterasi 'Yah' mempertahankan bentuk khusus yang terdapat dalam bahasa Ibrani.
theological_decisions:
- issue: Terjemahan nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Karena sumber memakai bentuk singkat nama ilahi, transliterasi 'Yah' menjaga perbedaan tekstual itu tanpa menggantinya dengan gelar.
- issue: Makna צֶדֶק dalam ungkapan tentang gerbang
  choice: kebenaran
  alternative: keadilan
  rationale: Kata Ibrani mencakup baik kebenaran/kelurusan maupun keadilan. Konteks liturgis mendukung 'kebenaran', tetapi alternatif yuridis-etisnya tetap dicatat agar ambiguitas sumber tidak dihapus.
- issue: Nuansa אוֹדֶה
  choice: bersyukur kepada
  alternative: memuji
  rationale: Kata kerja ini dapat menunjuk pada ucapan syukur maupun pujian. Dalam konstruksi dengan nama Allah di sini, 'bersyukur kepada' merupakan padanan langsung dan alami, sementara nuansa pujian tetap diakui.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Bukakanlah bagiku' mempertahankan seruan langsung tanpa menjadi kaku; 'aku' sesuai dengan suara pribadi mazmur. Susunan puitis dan tanda titik koma mempertahankan hubungan antara permintaan membuka gerbang dan maksud penutur untuk masuk serta bersyukur.
