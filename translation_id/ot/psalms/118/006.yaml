id: PSA.118.6
reference: Psalms 118:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֣ה לִ֭/י לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה לִ֣/י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/006.yaml
  text: Yahweh is for me[a]; I will not fear[b]. What can man do to me?
translation:
  language: id
  text: Yahweh di pihakku; aku tidak akan takut. Apa yang dapat[a] dilakukan manusia terhadapku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apa yang akan dilakukan manusia terhadapku?” Dalam konteks ini, pertanyaan tersebut bersifat retoris dan menekankan keterbatasan manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לִי
  choice: di pihakku
  rationale: Dalam pernyataan keyakinan ini, לִי menyatakan dukungan atau keberpihakan; ungkapan Indonesia ini alami dan mempertahankan bentuk ringkas teks.
- source_word: לֹא אִירָא
  choice: aku tidak akan takut
  rationale: Bentuk imperfek menyatakan keyakinan atau ketetapan hati untuk tidak takut.
- source_word: מַה יַעֲשֶׂה
  choice: Apa yang dapat dilakukan
  rationale: Secara harfiah berarti 'Apa yang akan dilakukan', tetapi dalam pertanyaan retoris ini 'dapat' menyampaikan keterbatasan kemampuan manusia secara alami dalam bahasa Indonesia.
- source_word: אָדָם
  choice: manusia
  rationale: Kata benda tunggal ini dipakai secara generik untuk seorang manusia atau manusia pada umumnya; 'manusia' mempertahankan cakupan tersebut tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: לִי
  choice: terhadapku
  rationale: Preposisi dengan akhiran orang pertama menandai pihak yang terkena tindakan; 'terhadapku' paling alami dalam konstruksi ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama pribadi dan sesuai dengan bentuk yang lazim dalam kajian Ibrani.
- issue: Makna generik אָדָם
  choice: manusia
  alternative: seorang manusia atau manusia fana
  rationale: Bentuk Ibrani tunggal digunakan secara representatif, bukan khusus untuk laki-laki; pilihan ini menjaga kontras antara Yahweh dan manusia.
- issue: Daya retoris מַה יַעֲשֶׂה
  choice: Apa yang dapat dilakukan
  alternative: Apa yang akan dilakukan
  rationale: '''Dapat'' menyatakan daya retoris pertanyaan tentang terbatasnya kemampuan manusia, sedangkan bentuk harfiahnya tetap dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pronomina 'aku' mempertahankan suara pribadi pemazmur; 'di pihakku' menyampaikan keyakinan akan dukungan Yahweh secara alami.
