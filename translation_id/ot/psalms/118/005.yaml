source:
  edition: WLC
  text: מִֽן הַ֭/מֵּצַ֥ר קָרָ֣אתִי יָּ֑הּ עָנָ֖/נִי בַ/מֶּרְחָ֣ב יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/005.yaml
  text: Out of my distress I called on Yah[a]; Yah answered me with spaciousness.
translation:
  language: id
  text: Dari dalam kesesakan aku berseru kepada Yah; Yah menjawabku dengan kelegaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dari tempat sempit aku berseru kepada Yah; Yah menjawabku di tempat lapang.” Bahasa Ibrani mempertentangkan tempat sempit sebagai gambaran kesesakan dengan tempat lapang sebagai gambaran kelegaan. Kata depan pada “tempat lapang” juga dapat dipahami sebagai “dengan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמֵּצַר
  choice: Dari dalam kesesakan
  rationale: מִן menyatakan asal atau keadaan tempat seruan muncul, sedangkan מֵצַר secara harfiah menggambarkan tempat sempit dan secara kiasan berarti kesesakan. Ungkapan ini alami dalam bahasa Indonesia sekaligus masih menyiratkan keadaan yang menghimpit.
- source_word: קָרָאתִי
  choice: aku berseru kepada
  rationale: Dalam konteks doa, קרא berarti berseru atau memanggil kepada seseorang. “Berseru kepada” wajar dan mempertahankan daya emosional bentuk Ibrani.
- source_word: יָהּ
  choice: Yah
  rationale: יָהּ adalah bentuk singkat dan puitis dari nama ilahi. Transliterasi “Yah” mempertahankan bentuk khusus ini serta pengulangannya dalam ayat.
- source_word: עָנָנִי
  choice: menjawabku
  rationale: Bentuk verba dengan sufiks objek berarti “menjawab aku”; “menjawabku” merupakan padanan Indonesia yang langsung dan alami.
- source_word: בַמֶּרְחָב
  choice: dengan kelegaan
  rationale: מֶרְחָב menunjuk ruang yang luas atau lapang dan secara kiasan berarti kelegaan atau kebebasan dari himpitan. Prefiks ב dapat dipahami secara instrumental (“dengan”) atau lokatif (“di”). Teks utama mengutamakan makna kiasan yang alami, sedangkan catatan kaki mempertahankan gambaran ruang dan kemungkinan lokatifnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks memakai bentuk singkat puitis יָהּ, bukan bentuk lengkap יהוה. “Yah” mempertahankan perbedaan leksikal, bunyi puitis, dan pengulangan nama dalam kedua bagian ayat tanpa memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kata ganti orang pertama “aku” sesuai dengan suara pribadi pemazmur. Tanda titik koma mempertahankan kesejajaran antara seruan dalam kesesakan dan jawaban berupa kelegaan.
