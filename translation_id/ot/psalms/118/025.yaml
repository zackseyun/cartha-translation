source:
  edition: WLC
  text: אָנָּ֣א יְ֭הוָה הוֹשִׁ֘יעָ֥/ה נָּ֑א אָֽנָּ֥א יְ֝הוָ֗ה הַצְלִ֘יחָ֥/ה נָּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/025.yaml
  text: Please, LORD, save us! Please, LORD, grant us success[a]!
translation:
  language: id
  text: Ya TUHAN, kami mohon, selamatkanlah kami! Ya TUHAN, kami mohon, karuniakanlah keberhasilan kepada kami[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani tidak menyatakan objek kedua kata perintah ini; “kami” dipasok berdasarkan konteks doa bersama.
    reason: implicit_object
lexical_decisions:
- source_word: אָנָּא ... נָּא
  choice: kami mohon
  rationale: Kedua partikel permohonan yang mengapit setiap perintah menyatakan desakan yang sungguh-sungguh, bukan keterangan waktu seperti “sekarang”. Ungkapan “kami mohon” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang menandai nama ilahi YHWH dengan huruf kapital.
- source_word: הוֹשִׁיעָה
  choice: selamatkanlah
  rationale: Bentuk imperatif kausatif dari akar יׁשע meminta tindakan penyelamatan atau pembebasan.
- source_word: הַצְלִיחָה
  choice: karuniakanlah keberhasilan
  rationale: Imperatif kausatif ini berarti membuat berhasil atau memberi keberhasilan; pilihan ini alami, tetap luas, dan tidak membatasi keberhasilan pada kemakmuran materi.
theological_decisions:
- issue: Objek yang tidak dinyatakan pada kedua bentuk imperatif
  choice: Memasok “kami/kepada kami” berdasarkan konteks doa bersama
  alternative: 'Membiarkan objek tersirat: “selamatkanlah” dan “karuniakanlah keberhasilan”'
  rationale: Bahasa Ibrani tidak menyebut objek secara eksplisit, tetapi konteks mazmur menunjukkan permohonan komunal. Objek dipasok demi kejelasan bahasa Indonesia dan ditandai dengan catatan kaki agar ketidaktersuratannya tetap transparan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme kedua baris dipertahankan; “kami mohon” menghindari salah tafsir partikel permohonan sebagai “sekarang”.
