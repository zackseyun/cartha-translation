  source_fidelity: 'Terjemahan menyampaikan dua permohonan imperatif dalam teks Ibrani: הוֹשִׁיעָה נא, “selamatkanlah,” dan הַצְלִיחָה נא, “buatlah berhasil/karuniakanlah keberhasilan.” “Kami mohon” dengan tepat menandai fungsi entreati אָנָּא dan נָא tanpa mengubahnya menjadi keterangan waktu. Penambahan “kami/kepada kami” tidak tersurat dalam Ibrani, tetapi merupakan pelengkapan yang wajar dari doa komunal dan telah diberi catatan kaki.'
