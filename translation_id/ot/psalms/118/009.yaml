  yaml_path: translation/ot/psalms/118/009.yaml
  text: It is better to take refuge in Yahweh than to trust in nobles[a].
translation:
  language: id
  text: Lebih baik berlindung kepada Yahweh daripada percaya kepada para bangsawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para pangeran.” Kata Ibrani נְדִיבִים dapat merujuk pada bangsawan atau penguasa terkemuka; “para pangeran” adalah terjemahan tradisional.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Lebih baik
  rationale: Adjektiva predikatif ini menyatakan perbandingan tentang apa yang lebih baik atau lebih menguntungkan; bentuk ringkas ini alami dalam bahasa Indonesia.
- source_word: לַחֲסוֹת
  choice: berlindung
  rationale: Infinitif dari חסה menyatakan tindakan mencari atau mengambil perlindungan, khususnya pada Allah; “berlindung” menyampaikan makna perlindungan sekaligus kebergantungan.
- source_word: בַּיהוָה
  choice: pada Yahweh
  rationale: Preposisi ב menandai pribadi yang menjadi tempat perlindungan, sedangkan nama ilahi יהוה dipertahankan sebagai “Yahweh”.
- source_word: מִבְּטֹחַ
  choice: daripada percaya
  rationale: מן berfungsi sebagai penanda perbandingan, dan בטח berarti menaruh kepercayaan atau mengandalkan; susunan ini mempertahankan kesejajaran dengan “berlindung”.
- source_word: בִּנְדִיבִים
  choice: kepada para bangsawan
  rationale: נְדִיבִים di sini menunjuk pada kalangan terpandang atau elite penguasa yang dapat menjadi tumpuan manusia. “Para bangsawan” cukup luas dan dekat dengan nuansa sosial kata Ibrani tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; transliterasi “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Sifat perbandingan antara Allah dan pemimpin manusia
  choice: Mempertahankan pernyataan bahwa berlindung pada Yahweh lebih baik daripada percaya kepada kalangan elite
  alternative: Memperluasnya menjadi larangan mutlak untuk memercayai semua pemimpin manusia
  rationale: Ayat ini berbentuk perbandingan dan tidak secara eksplisit menyatakan larangan mutlak; terjemahan tidak menambahkan kesimpulan teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas, wajar, dan bermartabat. Struktur perbandingan serta kesejajaran kedua infinitif dipertahankan, dan ambiguitas נְדִיבִים dijelaskan dalam catatan kaki.
