  text: Yahweh is among my helpers[b][a]; I myself will look on my haters.
translation:
  language: id
  text: Yahweh ada di pihakku, bersama para penolongku[a]; aku sendiri akan melihat orang-orang yang membenciku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh ada di antara para penolongku.” Susunan bahasa Ibrani dapat menekankan bahwa Yahweh berdiri bersama para penolong pemazmur, bukan hanya menyebut-Nya sebagai satu penolong tunggal.
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku akan melihat.” Ungkapan Ibrani ini dapat menyiratkan bahwa pemazmur akan menyaksikan kekalahan orang-orang yang membencinya, tetapi hal itu tidak disebutkan secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: לִי בְּעֹזְרָי
  choice: ada di antara para penolongku
  rationale: Frasa berpreposisi ini secara harfiah menunjuk kepada Yahweh yang berada bagi pemazmur di antara atau bersama mereka yang menolongnya. Bentuk jamak עֹזְרָי dipertahankan sebagai “para penolongku”; kemungkinan “berpihak kepadaku di antara para penolongku” dicatat dalam catatan kaki.
- source_word: וַאֲנִי
  choice: aku sendiri
  rationale: Pronomina mandiri אֲנִי memberi penekanan pada pelaku; “aku sendiri” menyampaikan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: אֶרְאֶה
  choice: akan melihat
  rationale: Makna dasar ראה adalah “melihat”. Dalam konstruksi dengan ב pada konteks ini, ungkapan tersebut dapat menyiratkan menyaksikan kekalahan para pembenci, tetapi implikasi itu tidak dimasukkan secara eksplisit ke dalam teks utama.
- source_word: בְשֹׂנְאַי
  choice: orang-orang yang membenciku
  rationale: Bentuk partisipial ini berarti mereka yang membenci pemazmur. Ungkapan ini lebih alami dalam bahasa Indonesia daripada nomina seperti “para pembenciku” dan lebih spesifik daripada “musuh-musuhku”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar dan tanpa memilih bentuk “Yehova” yang berasal dari tradisi vokalisasi kemudian.
- issue: Hubungan Yahweh dengan para penolong pemazmur
  choice: ada di antara para penolongku
  alternative: berpihak kepadaku di antara para penolongku; bersama para penolongku
  rationale: Susunan Ibrani memungkinkan nuansa bahwa Yahweh berpihak kepada pemazmur sekaligus berada di antara atau bersama mereka yang menolongnya. Teks utama mempertahankan gambaran jamak dan catatan kaki menjaga alternatif sintaksisnya.
- issue: Makna melihat orang-orang yang membenci pemazmur
  choice: akan melihat orang-orang yang membenciku
  alternative: akan memandang dengan kemenangan atas orang-orang yang membenciku; akan menyaksikan kejatuhan mereka
  rationale: Idiom Ibrani dapat mengisyaratkan kemenangan atau kejatuhan lawan, tetapi objek atau hasil yang dilihat tidak dinyatakan secara eksplisit. Terjemahan utama tidak menambahkan hasil tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. “Para penolongku” mempertahankan bentuk jamak sumber, sedangkan “orang-orang yang membenciku” dipilih agar alami dan tetap tepat secara leksikal.
