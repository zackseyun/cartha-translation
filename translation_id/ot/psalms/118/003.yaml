  text: Let the house of Aaron now say[a], “His steadfast love endures forever.”
translation:
  language: id
  text: Biarlah kaum Harun sekarang berkata, “Kasih setia-Nya[a] untuk selama-lamanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan perjanjian-Nya untuk selama-lamanya.” Kata Ibrani חֶסֶד (khesed) dapat berarti kasih yang loyal, belas kasih, atau kesetiaan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: Biarlah ... berkata
  rationale: Bentuk imperfek Qal orang ketiga jamak berfungsi sebagai ajakan dalam rangkaian liturgis ini; “Biarlah ... berkata” menyampaikan daya hortatifnya secara wajar.
- source_word: נָא
  choice: sekarang
  rationale: Partikel ini menambahkan desakan pada ajakan. “Sekarang” mempertahankan nuansa urgensi tanpa menjadikannya permohonan sopan.
- source_word: בֵית אַהֲרֹן
  choice: kaum Harun
  rationale: Frasa konstruksi ini menunjuk secara kolektif kepada keluarga atau kelompok keturunan Harun, yakni kalangan imam. “Kaum Harun” alami dalam bahasa Indonesia dan tetap mempertahankan rujukan korporatnya.
- source_word: כִּי
  choice: tidak diterjemahkan secara tersendiri
  rationale: Di sini כִּי memperkenalkan isi seruan. Dalam bahasa Indonesia, kutipan langsung tanpa padanan eksplisit seperti “bahwa” menghasilkan ungkapan liturgis yang lebih alami tanpa mengubah hubungan sintaksis.
- source_word: לְעוֹלָם
  choice: kekal selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Dalam klausa nominal Ibrani, “kekal selama-lamanya” menyampaikan maknanya secara alami dan puitis.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih yang loyal, kemurahan, dan kesetiaan dalam relasi perjanjian. “Kasih setia” mempertahankan keluasan makna itu dan merupakan ungkapan Indonesia yang ringkas serta bermartabat.
theological_decisions:
- issue: Penerjemahan חֶסֶד dalam rumusan pujian yang berlatar perjanjian
  choice: kasih setia-Nya
  alternative: kesetiaan-Nya pada perjanjian; belas kasih-Nya
  rationale: “Kasih setia” menjaga perpaduan kasih, kemurahan, dan loyalitas yang terkandung dalam חֶסֶד tanpa mempersempitnya hanya pada aspek hukum perjanjian atau belas kasihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak liturgis yang wajar. “Kaum Harun” dipilih daripada ungkapan harfiah “rumah Harun” agar rujukan kolektifnya jelas bagi pembaca umum. Penanda catatan ditempatkan sesudah kutipan yang diterangkannya.
