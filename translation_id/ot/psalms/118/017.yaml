  text: לֹֽא אָמ֥וּת כִּי אֶֽחְיֶ֑ה וַ֝/אֲסַפֵּ֗ר מַֽעֲשֵׂ֥י יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/017.yaml
  text: I will not die[a], but I will live and recount the deeds of Yah.
translation:
  language: id
  text: Aku tidak akan mati, tetapi aku akan hidup dan menceritakan perbuatan-perbuatan Yah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yah” adalah bentuk singkat dan puitis dari nama ilahi dalam bahasa Ibrani; banyak terjemahan menerjemahkannya secara lebih umum sebagai “TUHAN.”
    reason: Menjelaskan bentuk nama ilahi dalam bahasa Ibrani dan padanan terjemahan tradisionalnya.
lexical_decisions:
- source_word: לֹא אָמוּת
  choice: aku tidak akan mati
  rationale: Bentuk imperfek orang pertama tunggal dalam konteks ini menyatakan keyakinan mengenai masa depan; negasi לֹא langsung menyangkal kematian.
- source_word: כִּי
  choice: tetapi
  rationale: 'Dalam pertentangan puitis antara mati dan hidup, כִּי paling wajar dipahami secara adversatif: bukan mati, melainkan hidup.'
- source_word: אֶחְיֶה
  choice: aku akan hidup
  rationale: Imperfek orang pertama tunggal sejajar secara antitetis dengan 'aku tidak akan mati' dan menyatakan keyakinan akan kelangsungan hidup.
- source_word: וַאֲסַפֵּר
  choice: dan menceritakan
  rationale: Bentuk Piel dari ספר berarti menuturkan atau menceritakan; pilihan ini alami untuk penyampaian tindakan-tindakan Allah.
- source_word: מַעֲשֵׂי
  choice: perbuatan-perbuatan
  rationale: Bentuk jamak konstruksi ini menunjuk pada tindakan atau karya; 'perbuatan-perbuatan' mempertahankan makna jamak konkret.
- source_word: יָהּ
  choice: Yah
  rationale: יָהּ adalah bentuk singkat dan puitis dari nama ilahi, sehingga ditransliterasikan sebagai nama, bukan diganti dengan gelar 'TUHAN'.
theological_decisions:
- issue: Penerjemahan nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks Ibrani memakai bentuk singkat puitis יָהּ, bukan bentuk lengkap יהוה. 'Yah' mempertahankan perbedaan yang benar-benar ada dalam sumber, sedangkan 'TUHAN' dapat dicantumkan sebagai padanan tradisional dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'aku' mempertahankan penegasan serta keseimbangan puitis antara 'tidak akan mati' dan 'akan hidup'.
