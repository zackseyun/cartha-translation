  text: יַסֹּ֣ר יִסְּרַ֣/נִּי יָּ֑הּ וְ֝/לַ/מָּ֗וֶת לֹ֣א נְתָנָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/018.yaml
  text: Yah has surely disciplined me[a], but he has not given me over to death.
translation:
  language: id
  text: Yah benar-benar telah mendidik aku,[a] tetapi Ia tidak menyerahkan aku kepada maut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “TUHAN benar-benar telah mendidik aku.” Teks Ibrani memakai bentuk pendek puitis nama ilahi, yaitu “Yah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֹּר יִסְּרַנִּי
  choice: benar-benar telah mendidik aku
  rationale: Infinitif absolut sebelum verba finit menguatkan tindakan. 'Benar-benar' menyampaikan penegasan itu secara alami, sedangkan 'mendidik' mempertahankan nuansa korektif dan pembentukan dari יסר tanpa membatasinya pada hukuman.
- source_word: יָּהּ
  choice: Yah
  rationale: Bentuk ini adalah nama ilahi puitis yang pendek, berbeda dari bentuk penuh יהוה. Transliterasi 'Yah' mempertahankan perbedaan leksikal dan corak puisi Ibrani.
- source_word: וְלַמָּוֶת לֹא נְתָנָנִי
  choice: tetapi Ia tidak menyerahkan aku kepada maut
  rationale: Konjungsi dalam konteks negatif menyatakan kontras antara didikan dan hasil akhirnya. נתן dengan objek pribadi dan ל + מָוֶת bermakna menyerahkan kepada kuasa atau nasib kematian; 'kepada maut' mempertahankan personifikasi dan register puitis.
theological_decisions:
- issue: Penerjemahan bentuk pendek nama ilahi יָּהּ
  choice: Yah
  alternative: TUHAN
  rationale: Ayat ini memakai bentuk puitis pendek יָהּ, bukan bentuk penuh יהוה. 'Yah' menjaga perbedaan yang ada dalam teks sumber tanpa menetapkan tafsiran doktrinal tambahan.
- issue: Makna didikan ilahi
  choice: mendidik
  alternative: menghajar
  rationale: '''Mendidik'' menjaga kemungkinan tindakan korektif sekaligus pembentukan, sedangkan ''menghajar'' dalam bahasa Indonesia modern cenderung terdengar semata-mata keras atau menghukum.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kata 'maut' dipilih alih-alih 'kematian' untuk menjaga personifikasi serta kesejajaran dengan gaya mazmur; kapitalisasi 'Ia' mengikuti register Kitab Suci Indonesia yang lazim.
