id: PSA.118.16
reference: Psalms 118:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְמִ֣ין יְ֭הוָה רוֹמֵמָ֑ה יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/016.yaml
  text: The right hand of Yahweh is exalted[b][a]; the right hand of Yahweh does valiantly.
translation:
  language: id
  text: Tangan kanan Yahweh terangkat tinggi[a]; tangan kanan Yahweh bertindak dengan gagah perkasa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditinggikan” atau “menang.” Kata kerja Ibrani ini dapat menyatakan sesuatu yang terangkat atau ditinggikan dan, dalam konteks ini, dapat menyiratkan kemenangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “menunjukkan keperkasaan,” “bertindak dengan penuh kuasa,” atau “meraih kemenangan.” Ungkapan Ibrani harfiahnya berarti “melakukan keperkasaan/kekuatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִין
  choice: tangan kanan
  rationale: Mempertahankan gambaran konkret Ibrani tentang tangan kanan sebagai lambang kekuatan dan tindakan kemenangan, alih-alih langsung mengabstraksikannya menjadi ‘kuasa’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam Tetragramaton sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: רוֹמֵמָה
  choice: terangkat tinggi
  rationale: Mengungkapkan keadaan ditinggikan atau berada di tempat tinggi serta mempertahankan citra puitis tangan yang terangkat; kemungkinan nuansa kemenangan dijelaskan dalam catatan kaki.
- source_word: עֹשָׂה
  choice: bertindak
  rationale: Dalam gabungan idiomatis dengan חָיִל, ‘bertindak’ lebih alami dalam bahasa Indonesia daripada padanan harfiah ‘melakukan’, tanpa menentukan hasil tindakan secara berlebihan.
- source_word: חָיִל
  choice: dengan gagah perkasa
  rationale: Dalam ungkapan עֹשָׂה חָיִל, kata ini menyatakan kekuatan, keperkasaan, atau keberhasilan dalam tindakan. ‘Dengan gagah perkasa’ mempertahankan nada kemenangan dan menghasilkan ungkapan Indonesia yang wajar.
theological_decisions:
- issue: Bahasa antropomorfis bagi tindakan ilahi
  choice: Mempertahankan ‘tangan kanan’ sebagai gambaran konkret bagi kekuatan dan campur tangan Yahweh yang membawa kemenangan.
  alternative: Menggantikannya dengan ungkapan abstrak seperti ‘kuasa Yahweh’.
  rationale: Metafora tubuh ini merupakan unsur penting puisi Ibrani dan memiliki gema luas dalam Alkitab; mempertahankannya menghindari perataan makna teologis menjadi abstraksi.
- issue: Nuansa רוֹמֵמָה antara ketinggian dan kemenangan
  choice: Menerjemahkan ‘terangkat tinggi’ dalam teks utama.
  alternative: ‘Dimuliakan’, ‘ditinggikan’, atau ‘menang’.
  rationale: Pilihan utama mempertahankan citra spasial dan keadaan yang ditinggikan tanpa menjadikan nuansa kemenangan sebagai satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang lugas dan bermartabat. Pengulangan ‘tangan kanan Yahweh’ dipertahankan untuk menjaga paralelisme dan penekanan teks Ibrani.
