source:
  edition: WLC
  text: עָזִּ֣/י וְ/זִמְרָ֣ת יָ֑הּ וַֽ/יְהִי לִ֝֗/י לִֽ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/014.yaml
  text: Yah is my strength and song[a], and he has become my salvation.
translation:
  language: id
  text: Yah[a] adalah kekuatanku dan nyanyianku; Ia telah menjadi keselamatanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk singkat nama ilahi, “Yah”, bukan bentuk lengkap yang di tempat lain diterjemahkan “TUHAN”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזִּי
  choice: kekuatanku
  rationale: Kata עֹז menyatakan kekuatan atau keperkasaan. “Kekuatanku” merupakan padanan Indonesia yang alami dan mempertahankan pengakuan pribadi dalam bentuk posesif.
- source_word: וְזִמְרָת
  choice: dan nyanyianku
  rationale: Dalam ungkapan puitis yang juga terdapat dalam Keluaran 15:2 dan Yesaya 12:2, זִמְרָה paling langsung berarti “nyanyian”. Bentuk “nyanyianku” menjaga kesejajaran dengan “kekuatanku”.
- source_word: יָהּ
  choice: Yah
  rationale: יָהּ adalah bentuk singkat nama ilahi, bukan bentuk lengkap יהוה. Transliterasi “Yah” mempertahankan perbedaan yang nyata dalam teks Ibrani.
- source_word: וַיְהִי
  choice: telah menjadi
  rationale: Bentuk verba היה di sini menyatakan hasil yang telah terwujud. “Telah menjadi” mempertahankan daya verbalnya dengan bahasa Indonesia yang wajar.
- source_word: לִי
  choice: -ku dalam “keselamatanku”
  rationale: Walaupun secara harfiah berarti “bagiku” atau “untukku”, dalam konstruksi ini bentuk posesif Indonesia menyampaikan hubungan pribadi tersebut secara lebih alami.
- source_word: לִישׁוּעָה
  choice: keselamatan
  rationale: יְשׁוּעָה dapat berarti keselamatan, pembebasan, atau kemenangan. “Keselamatan” cukup luas untuk mencakup tindakan penyelamatan dalam konteks mazmur tanpa mempersempit maknanya.
theological_decisions:
- issue: Penerjemahan bentuk singkat nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks memakai bentuk puitis singkat יָהּ, bukan tetragram יהוה. Mempertahankan “Yah” menyajikan bentuk sumber dengan lebih tepat dan tidak menyamakan dua bentuk yang berbeda.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kesejajaran puitis dipertahankan melalui “kekuatanku dan nyanyianku”, sedangkan titik koma menandai peralihan menuju hasil tindakan penyelamatan.
