source:
  edition: WLC
  text: בָּר֣וּךְ הַ֭/בָּא בְּ/שֵׁ֣ם יְהוָ֑ה בֵּ֝רַֽכְנוּ/כֶ֗ם מִ/בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/026.yaml
  text: Blessed is the one who comes in the name of Yahweh[c][b][a]; we bless you from the house of Yahweh.
translation:
  language: id
  text: Diberkatilah orang yang datang dalam nama Yahweh[a][b][c]; kami memberkati kalian dari rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dia yang datang”. Partisip Ibrani berbentuk tunggal maskulin, tetapi bahasa Indonesia tidak menandai gender dalam kata “dia” atau “orang”.
    reason: lexical_alternative
  - marker: b
    text: “Dalam nama” juga dapat berarti “dengan wewenang” atau “sebagai wakil”.
    reason: lexical_alternative
  - marker: c
    text: Ayat ini kemudian dikutip dalam Perjanjian Baru sehubungan dengan masuknya Yesus ke Yerusalem (misalnya Mat. 21:9; Mrk. 11:9; Luk. 19:38; Yoh. 12:13). Teks utama tetap mengikuti rumusan mazmur tanpa memasukkan penerapan yang kemudian itu ke dalam terjemahannya.
    reason: cross_reference
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Diberkatilah
  rationale: Bentuk pasif dari ברך dipakai sebagai rumusan berkat. “Diberkatilah” terdengar wajar dan khidmat dalam bahasa Indonesia serta mempertahankan sifat deklaratif-liturgisnya tanpa mengubahnya menjadi sekadar ungkapan kebahagiaan.
- source_word: הַבָּא
  choice: orang yang datang
  rationale: Partisip berartikel yang dijadikan nomina ini secara harfiah menunjuk kepada “yang datang”. “Orang yang datang” alami dalam bahasa Indonesia dan tidak menentukan identitas tokoh tersebut melebihi teks Ibrani.
- source_word: בְּשֵׁם
  choice: dalam nama
  rationale: Ungkapan ini mempertahankan bentuk Ibrani dan dapat mencakup gagasan datang dengan wewenang atau sebagai wakil seseorang, tanpa memaksakan satu penafsiran ke dalam teks utama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: בֵּרַכְנוּכֶם
  choice: kami memberkati kalian
  rationale: Bentuk verba orang pertama jamak dengan akhiran objek orang kedua jamak paling alami dipahami secara performatif dalam konteks liturgis. “Kalian” menyatakan bahwa objeknya jamak.
- source_word: מִבֵּית
  choice: dari rumah
  rationale: Terjemahan ini mempertahankan ungkapan “dari rumah Yahweh” dan membiarkan makna bait suci tetap tersirat sebagaimana dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi alih-alih menggantinya dengan sebuah gelar.
- issue: Rujukan “orang yang datang”
  choice: Mempertahankannya sebagai rumusan berkat yang tidak menentukan identitas orang tersebut dalam teks utama
  alternative: Menerjemahkannya secara eksplisit sebagai gelar Mesianik
  rationale: Dalam konteks mazmur, frasa itu dapat berfungsi sebagai sambutan liturgis. Perjanjian Baru kemudian mengutipnya sehubungan dengan Yesus, tetapi penerapan tersebut tidak perlu dimasukkan ke dalam kata-kata terjemahan mazmur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk menyatakan dengan jelas objek jamak pada בֵּרַכְנוּכֶם. Tanda titik koma mempertahankan hubungan erat antara seruan berkat dan jawaban dari rumah Yahweh.
