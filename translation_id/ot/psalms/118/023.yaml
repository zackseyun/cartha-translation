  text: מֵ/אֵ֣ת יְ֭הוָה הָ֣יְתָה זֹּ֑את הִ֖יא נִפְלָ֣את בְּ/עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/023.yaml
  text: This has come from Yahweh[b][a]; it is marvelous in our eyes.
translation:
  language: id
  text: Hal ini berasal dari Yahweh[a]; hal ini menakjubkan[b] di mata kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hal ini datang dari Yahweh” atau “Hal ini terjadi karena Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ajaib” atau “luar biasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: berasal dari
  rationale: Gabungan preposisi ini menandai sumber atau asal. “Berasal dari” menyatakan bahwa hal tersebut bersumber pada Yahweh tanpa menambahkan gambaran yang tidak tersurat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: הָיְתָה זֹּאת
  choice: Hal ini berasal
  rationale: Secara harfiah ungkapan ini dapat berarti “hal ini ada/terjadi.” Dalam konstruksi bersama מֵאֵת, “hal ini berasal” menyampaikan keadaan atau peristiwa yang bersumber pada Yahweh dengan bahasa Indonesia yang alami.
- source_word: הִיא
  choice: hal ini
  rationale: Pronomina mandiri feminin ini merujuk kembali kepada זֹּאת dan memberi penegasan. Pengulangan “hal ini” lebih alami dan jelas dalam bahasa Indonesia daripada memakai pronomina bergender.
- source_word: נִפְלָאת
  choice: menakjubkan
  rationale: Bentuk Nifal dari פלא menggambarkan sesuatu yang menimbulkan rasa takjub, luar biasa, atau ajaib. “Menakjubkan” mempertahankan nada pujian dan keterpesonaan.
- source_word: בְּעֵינֵינוּ
  choice: di mata kita
  rationale: Terjemahan ini mempertahankan idiom Ibrani sekaligus tetap wajar dalam bahasa Indonesia dan menyatakan sudut pandang bersama para penutur.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cara menyatakan tindakan atau asal ilahi
  choice: berasal dari Yahweh
  alternative: terjadi karena Yahweh atau dilakukan oleh Yahweh
  rationale: מֵאֵת secara langsung menandai sumber atau asal. Terjemahan utama tidak mempersempitnya menjadi kausalitas atau tindakan langsung, sehingga keluasan makna teks tetap terjaga.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bernada pujian. Pengulangan “hal ini” mempertahankan penegasan pronomina Ibrani, sedangkan “di mata kita” mempertahankan idiom sumber yang masih mudah dipahami.
