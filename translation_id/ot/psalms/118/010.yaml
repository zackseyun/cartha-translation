  text: Semua bangsa mengepung aku; dalam nama TUHAN, aku akan menumpas mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Segala bangsa
  rationale: Mewakili cakupan menyeluruh כָּל dan makna kolektif גּוֹיִם secara alami serta bermartabat.
- source_word: סְבָבוּנִי
  choice: mengepung aku
  rationale: Bentuk ini menyatakan bahwa bangsa-bangsa mengelilingi pemazmur dengan nuansa permusuhan; 'mengepung' menangkap konteks tersebut.
- source_word: בְּשֵׁם יְהוָה
  choice: demi nama TUHAN
  rationale: Dalam konteks tindakan yang dilakukan dengan bersandar pada otoritas dan kuasa ilahi, 'demi nama' lebih alami daripada 'dalam nama'; יהוה ditampilkan sebagai TUHAN sesuai konvensi terjemahan Indonesia.
- source_word: כִּי אֲמִילַם
  choice: sungguh aku menumpas mereka
  rationale: כִּי di sini berfungsi sebagai penegasan, sedangkan bentuk אֲמִילַם berasal dari מול II dalam konteks ini dan berarti memotong habis atau membinasakan; 'menumpas' mempertahankan daya ungkap tanpa memaksakan gambaran harfiah yang janggal.
theological_decisions:
- issue: Peran nama ilahi dalam kemenangan pemazmur
  choice: demi nama TUHAN
  alternative: dalam nama TUHAN
  rationale: Ungkapan ini dibiarkan menyatakan bahwa tindakan pemazmur dilakukan dengan mengandalkan otoritas atau pertolongan TUHAN, tanpa merinci mekanisme teologisnya.
- issue: Kepastian atau penegasan dalam כִּי אֲמִילַם
  choice: sungguh aku menumpas mereka
  alternative: aku akan menumpas mereka
  rationale: Bentuk verbal dapat dibaca dengan nuansa tindakan kini/berulang atau keyakinan akan hasilnya. 'Sungguh' mempertahankan fungsi penegasan כִּי seperti lapisan konsultasi Inggris tanpa menentukan waktu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, padat, puitis, dan bermartabat. Susunan dua klausa dipertahankan agar paralelisme dan penegasan ayat tetap terasa.
