  source_fidelity: 'Klausa pertama diterjemahkan dengan baik: כָּל־גּוֹיִם mencakup semua bangsa dan סְבָבוּנִי berarti mereka mengelilingi/mengepung aku. Namun, בְּשֵׁם YHWH secara langsung berarti “dalam nama TUHAN,” bukan “demi nama TUHAN,” yang dalam bahasa Indonesia lebih mudah dipahami sebagai “demi kepentingan/nama baik” TUHAN. Imperfek אֲמִילַם paling wajar dipertahankan sebagai tindakan yang diyakini akan terjadi: “aku akan menumpas mereka.”'
  naturalness: “Semua bangsa” lebih idiomatis dalam bahasa Indonesia modern daripada “Segala bangsa.” “Dalam nama TUHAN” juga merupakan kolokasi yang jelas dan lazim dalam register Alkitabiah Indonesia. Susunan dua klausa tetap padat dan puitis.
  terminology: TUHAN tepat sebagai representasi konvensional Indonesia untuk nama ilahi יהוה. “Menumpas” secara kontekstual dapat menyampaikan daya verba yang berarti memotong habis/mengalahkan, tanpa memaksakan citra harfiah. Tidak diperlukan catatan kaki.
