  yaml_path: translation/ot/psalms/118/022.yaml
  text: The stone the builders rejected has become the cornerstone[a][b].
translation:
  language: id
  text: Batu yang ditolak para pembangun telah menjadi batu penjuru[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala sudut.”
    reason: lexical_alternative
  - marker: b
    text: Ayat ini kemudian dikutip dalam Perjanjian Baru dengan merujuk kepada Mesias/Kristus (misalnya Mat. 21:42; Kis. 4:11; 1Ptr. 2:7).
    reason: cross_reference
lexical_decisions:
- source_word: אֶבֶן
  choice: batu
  rationale: Kata benda umum ini berarti batu; pilihan ini alami dalam bahasa Indonesia dan mempertahankan metafora tanpa menentukan ukuran atau fungsi secara berlebihan.
- source_word: מָאֲסוּ
  choice: ditolak
  rationale: Kata kerja מאס menyatakan tindakan menolak atau tidak menerima. Bentuk pasif ini wajar dalam konteks dan mempertahankan penolakan sengaja oleh para pembangun.
- source_word: הַבּוֹנִים
  choice: para pembangun
  rationale: Partisipel dari בנה berarti orang-orang yang membangun. 'Para pembangun' ringkas, alami, dan tetap cukup umum tanpa mempersempitnya menjadi tukang batu.
- source_word: הָיְתָה
  choice: telah menjadi
  rationale: Bentuk perfektif Ibrani menyatakan perubahan yang menghasilkan keadaan kini; 'telah menjadi' mempertahankan baik peristiwa maupun hasilnya.
- source_word: לְרֹאשׁ פִּנָּה
  choice: batu penjuru
  rationale: Ungkapan harfiahnya ialah 'kepala sudut'. 'Batu penjuru' merupakan padanan arsitektural Indonesia yang jelas dan lazim, sementara catatan kaki mempertahankan bentuk ungkapan Ibraninya.
theological_decisions:
- issue: Penggunaan mesianik ayat ini dalam penafsiran Alkitab yang kemudian
  choice: Metafora arsitektural dipertahankan dalam teks utama tanpa menyebut Mesias secara eksplisit.
  alternative: Menerjemahkan atau memperluas teks utama secara kristologis berdasarkan kutipan-kutipan Perjanjian Baru.
  rationale: Teks Ibrani sendiri menyatakan pembalikan keadaan dan pemulihan nama baik melalui metafora batu. Penerapannya kepada Mesias/Kristus dalam Perjanjian Baru dicatat tanpa dimasukkan ke dalam bunyi ayat.
- issue: Fungsi tepat batu dalam ungkapan לְרֹאשׁ פִּנָּה
  choice: batu penjuru
  alternative: batu puncak; batu utama pada sudut
  rationale: Ungkapan Ibrani dapat menunjuk batu utama yang berkaitan dengan sudut bangunan, tetapi posisi arsitektural tepatnya tidak sepenuhnya pasti. 'Batu penjuru' mempertahankan metafora tradisional tanpa menegaskan bahwa batu itu pasti berada di dasar atau di puncak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas, alami, dan bermartabat. 'Para pembangun' dipilih daripada istilah teknis yang lebih sempit; 'batu penjuru' dipakai sebagai ungkapan arsitektural yang mudah dipahami. Semua penanda catatan kaki dicantumkan dalam teks utama.
