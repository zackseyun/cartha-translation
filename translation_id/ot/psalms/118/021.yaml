  text: א֭וֹדְ/ךָ כִּ֣י עֲנִיתָ֑/נִי וַ/תְּהִי לִ֝֗/י לִֽ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/021.yaml
  text: I will give thanks to you[a], for you answered me and became my salvation.
translation:
  language: id
  text: Aku akan bersyukur kepada-Mu, sebab Engkau telah menjawab aku dan menjadi keselamatanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasanku.” Istilah Ibrani dapat menunjuk pada pertolongan nyata dalam suatu keadaan maupun keselamatan dalam arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Aku akan bersyukur kepada-Mu
  rationale: Bentuk Hifil dari ידה dalam konteks mazmur syukur berarti menyatakan syukur atau pujian. Bentuk “akan bersyukur” mempertahankan nuansa imperfek yang dapat bersifat prospektif atau menyatakan tekad, sedangkan “kepada-Mu” menerjemahkan sufiks orang kedua tunggal maskulin.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan pemazmur bersyukur; “sebab” menyampaikan hubungan kausal secara alami dan bermartabat.
- source_word: עֲנִיתָנִי
  choice: Engkau telah menjawab aku
  rationale: Berasal dari ענה dalam arti “menjawab/menanggapi,” bukan homonim yang berarti “menindas/merendahkan.” Aspek tindakan yang sudah dialami pemazmur dinyatakan secara alami dengan “telah menjawab.”
- source_word: וַתְּהִי
  choice: dan menjadi
  rationale: Bentuk wayyiqtol dari היה meneruskan rangkaian tindakan dan secara harfiah menyatakan “menjadi”; pilihan ini mempertahankan daya verbalnya, bukan mengubahnya menjadi keadaan statis.
- source_word: לִי
  choice: -ku dalam “keselamatanku”
  rationale: Frasa Ibrani secara harfiah berarti “bagi/untuk aku,” tetapi dalam bahasa Indonesia hubungan itu paling alami dipadatkan sebagai bentuk posesif “keselamatanku.”
- source_word: לִישׁוּעָה
  choice: keselamatan
  rationale: יְשׁוּעָה dapat menunjuk pada penyelamatan konkret maupun keselamatan dalam arti lebih luas. “Keselamatan” menjaga keluasan makna dan bobot teologis teks tanpa mempersempitnya menjadi kemenangan semata.
theological_decisions:
- issue: Makna יְשׁוּעָה dalam mazmur tentang pertolongan
  choice: keselamatan
  alternative: pembebasan atau pertolongan
  rationale: Kata Ibrani dapat menunjuk pada pelepasan dari bahaya yang konkret sekaligus memiliki jangkauan teologis lebih luas. “Keselamatan” mempertahankan kedua kemungkinan itu tanpa memasukkan rincian doktrinal yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada puitis dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Susunan klausa dibuat dekat dengan struktur Ibrani namun tetap alami bagi pembaca umum.
