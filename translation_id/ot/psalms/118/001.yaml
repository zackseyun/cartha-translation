  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: id
  text: Bersyukurlah kepada Yahweh[a], sebab Ia baik, sebab kasih setia-Nya[b] tetap untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, yang secara tradisional diterjemahkan “TUHAN”.
    reason: alternative_reading
  - marker: b
    text: Atau “kesetiaan perjanjian-Nya”. Kata Ibrani חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh, khususnya dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Bersyukurlah
  rationale: Bentuk imperatif jamak dari ידה dalam bentuk Hifil di sini merupakan ajakan liturgis untuk mengucap syukur; bahasa Indonesia secara wajar memakai bentuk kolektif “Bersyukurlah” tanpa harus menyatakan kata ganti jamak.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi לְ menyatakan arah ucapan syukur, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks sumber tetap tampak.
- source_word: כִּי
  choice: sebab
  rationale: Kedua kemunculan כִּי memberikan alasan bagi ajakan untuk bersyukur. Pengulangan “sebab” mempertahankan susunan dan irama retoris bahasa Ibrani.
- source_word: טוֹב
  choice: Ia baik
  rationale: Adjektiva טוֹב menyatakan kebaikan Yahweh secara luas. Kata ganti “Ia” ditambahkan sesuai tata bahasa Indonesia tanpa mempersempit maknanya menjadi hanya “murah hati” atau “baik hati”.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Frasa ini secara harfiah menyatakan keberlangsungan tanpa akhir. Bentuk “untuk selama-lamanya” mempertahankan struktur klausa nominal Ibrani tanpa menambahkan verba yang tidak dinyatakan secara eksplisit.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh, kerap dalam hubungan perjanjian. “Kasih setia” merupakan padanan Indonesia yang alami dan cukup luas untuk mempertahankan rentang makna itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi יהוה. “Yahweh” mempertahankan nama tersebut, sedangkan catatan kaki memberi tahu pembaca mengenai bentuk tradisional “TUHAN” tanpa mengganti nama dalam teks utama.
- issue: Makna חֶסֶד dalam konteks perjanjian
  choice: kasih setia-Nya
  alternative: kesetiaan perjanjian-Nya
  rationale: “Kasih setia” mempertahankan unsur kasih, kemurahan, dan kesetiaan yang terkandung dalam חֶסֶד tanpa menjadikan unsur perjanjian—yang memang relevan tetapi tidak disebutkan secara eksplisit dalam ayat ini—sebagai satu-satunya makna.
- issue: Klausa nominal לְעוֹלָם חַסְדּוֹ
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: kasih setia-Nya tetap selama-lamanya
  rationale: Bahasa Ibrani tidak memuat verba eksplisit seperti “tetap” atau “bertahan”. Klausa nominal dipertahankan karena masih jelas dan wajar dalam laras puitis Indonesia, sehingga ketegangan antara bentuk ringkas dan gagasan keberlangsungan tidak diselesaikan dengan penambahan yang tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras liturgis yang ringkas dan bermartabat. Pengulangan “sebab” mengikuti kesejajaran Ibrani. Huruf kapital pada “Ia” dan akhiran “-Nya” mengikuti kebiasaan penulisan religius Indonesia untuk rujukan kepada Allah.
