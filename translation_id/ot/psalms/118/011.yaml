  text: סַבּ֥וּ/נִי גַם סְבָב֑וּ/נִי בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/011.yaml
  text: They surrounded me[a], yes, they surrounded me[c][b]; in the name of Yahweh I cut them down.
translation:
  language: id
  text: Mereka mengepung aku; ya, mereka mengepung aku. Dalam nama Yahweh, sungguh aku akan menebas mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku akan menghalau mereka” atau “aku akan menumpas mereka.” Kata Ibrani ini menyatakan tindakan tegas terhadap para musuh, tetapi nuansa tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי / סְבָבוּנִי
  choice: mereka mengepung aku
  rationale: Kedua bentuk berasal dari סבב dan menggambarkan pengepungan yang mengancam. Pengulangan dipertahankan karena memberi tekanan puitis.
- source_word: גַם
  choice: ya
  rationale: Dalam klausa berulang ini, גַם berfungsi sebagai penegas, bukan sekadar penambahan. “Ya” wajar dalam bahasa Indonesia dan mempertahankan daya tekan itu.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama Yahweh
  rationale: Ungkapan ini menyatakan bahwa pemazmur bertindak dengan berseru kepada dan mengandalkan kuasa serta wewenang Yahweh. Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: כִּי
  choice: sungguh
  rationale: Di sini כִּי paling wajar dipahami sebagai penegas kepastian dalam refrein puitis. “Sungguh” menyatakan daya asertifnya tanpa memaksakan hubungan sebab-akibat.
- source_word: אֲמִילַם
  choice: aku akan menebas mereka
  rationale: Bentuk ini berasal dari מול dalam Hifil dan menyatakan tindakan tegas terhadap para musuh. “Menebas” mempertahankan citra pemotongan, sedangkan “akan” mencerminkan aspek belum rampung atau kepastian tindakan dari bentuk imperfek.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Kekuatan tindakan dalam אֲמִילַם
  choice: menebas mereka
  alternative: menghalau mereka / menumpas mereka
  rationale: Konteks menggambarkan kemenangan yang tegas atas para pengepung, tetapi cakupan tepat verba ini diperdebatkan. Teks utama mempertahankan citra tajamnya, sedangkan catatan kaki menjaga alternatif yang lebih lemah maupun yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Struktur paralel serta pengulangan teks Ibrani dipertahankan; tanda baca membagi dua baris gagasan tanpa menghilangkan intensitas refrein.
