  text: זֶה הַ֭/יּוֹם עָשָׂ֣ה יְהוָ֑ה נָגִ֖ילָה וְ/נִשְׂמְחָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/024.yaml
  text: This is the day that Yahweh has made; let us rejoice and be glad in it.
translation:
  language: id
  text: Inilah hari yang telah Yahweh buat; marilah kita bersorak dan bersukacita pada hari ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה הַיּוֹם
  choice: Inilah hari
  rationale: Konstruksi demonstratif dan nomina tertentu ini menunjuk dengan tegas kepada hari yang sedang dibicarakan. “Inilah hari” alami dalam bahasa Indonesia dan mempertahankan daya tunjuk teks Ibrani.
- source_word: עָשָׂה
  choice: telah dijadikan
  rationale: Bentuk qal perfektif menyatakan tindakan yang sudah dilakukan. Bentuk pasif Indonesia memungkinkan Yahweh tetap menjadi pelaku yang disebut sesudah verba dan menghasilkan susunan yang wajar dengan “hari” sebagai sesuatu yang dijadikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: נָגִילָה
  choice: marilah kita bersorak
  rationale: Kohortatif orang pertama jamak mengungkapkan ajakan bersama. “Bersorak” menangkap kegembiraan yang kuat dalam גיל dan membedakannya dari verba berikutnya.
- source_word: וְנִשְׂמְחָה
  choice: dan bersukacita
  rationale: Kohortatif kedua melanjutkan ajakan. “Bersukacita” menyampaikan שמח secara alami dan tetap mempertahankan pasangan dua ungkapan kegembiraan.
- source_word: בּוֹ
  choice: pada hari ini
  rationale: Pronomina maskulin tunggal paling wajar merujuk kembali kepada הַיּוֹם. Mengulangi “hari ini” menghindari frasa Indonesia yang kurang alami seperti “di dalamnya” dan mempertahankan rujukannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Rujukan sufiks dalam בּוֹ
  choice: hari ini
  alternative: dia (seorang pribadi)
  rationale: Secara gramatikal sufiksnya maskulin tunggal, tetapi anteseden kontekstual terdekat dan paling alami ialah הַיּוֹם, yang juga maskulin tunggal. Terjemahan tidak mengalihkan rujukannya kepada Allah atau pribadi lain.
translation_notes:
  register: Bahasa Indonesia baku modern, bernada khidmat tetapi mudah dipahami. Paralelisme dua verba kegembiraan dipertahankan tanpa pengulangan yang datar.
