  text: ט֗וֹב לַ/חֲס֥וֹת בַּ/יהוָ֑ה מִ֝/בְּטֹ֗חַ בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/008.yaml
  text: It is better to take refuge in Yahweh than to trust in man[a].
translation:
  language: id
  text: Lebih baik berlindung kepada Yahweh daripada memercayai manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang manusia,” “umat manusia,” atau “orang”; kata Ibrani yang diterjemahkan “manusia” berbentuk tunggal dan digunakan secara generik untuk manusia pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Lebih baik
  rationale: Adjektiva predikatif ini menyatakan penilaian komparatif; ungkapan ringkas “Lebih baik” alami dalam bahasa Indonesia.
- source_word: לַחֲסוֹת
  choice: berlindung
  rationale: Infinitif dari חסה menggambarkan mencari atau mendapatkan perlindungan. “Berlindung” mempertahankan metafora naungan dan perlindungan, bukan sekadar kepercayaan abstrak.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ב menandai pribadi yang menjadi tempat perlindungan. Dalam idiom Indonesia, “berlindung kepada Yahweh” lebih alami daripada “berlindung di dalam Yahweh,” sementara nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh.”
- source_word: מִבְּטֹחַ
  choice: daripada memercayai
  rationale: 'מן bersama infinitif menyatakan perbandingan: lebih baik melakukan yang pertama daripada yang kedua. “Memercayai” menyampaikan keyakinan atau penyandaran diri kepada seseorang.'
- source_word: בָּאָדָם
  choice: manusia
  rationale: אָדָם berbentuk tunggal generik dan di sini menunjuk kepada manusia sebagai kategori, dalam kontras dengan Yahweh. Bahasa Indonesia dapat mempertahankan daya generiknya secara alami dengan “manusia.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi perjanjian dan sejalan dengan lapisan konsultasi yang diberikan.
- issue: Makna generik אָדָם dalam kontras dengan Allah
  choice: manusia
  alternative: seorang manusia; umat manusia; orang
  rationale: Bentuk Ibrani tunggal bersifat generik, bukan menunjuk kepada laki-laki tertentu. “Manusia” mempertahankan kontras antara penyandaran kepada Yahweh dan kepada manusia tanpa mempersempit acuannya berdasarkan gender.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas, bermartabat, dan mudah dipahami. Paralel komparatif ayat dipertahankan, begitu juga perbedaan metaforis antara “berlindung” dan “memercayai.”
