  yaml_path: translation/ot/psalms/118/002.yaml
  text: Let Israel now say[b][a], “His steadfast love endures forever.”
translation:
  language: id
  text: 'Biarlah Israel sekarang berkata[a],


    “Kasih setia-Nya[b] berlangsung selama-lamanya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah Israel berkata, ‘Sebab kasih setia-Nya berlangsung selama-lamanya.’” Kata Ibrani כִּי dapat berarti “sebab” atau “bahwa,” atau memperkenalkan isi pengakuan tersebut.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani חֶסֶד, yang sering menunjuk pada kasih dan kesetiaan yang teguh, khususnya dalam hubungan perjanjian. Padanan lain mencakup “kasih perjanjian”, “kemurahan”, atau “belas kasih”, sesuai konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: Biarlah ... sekarang berkata
  rationale: Bentuk imperfek yang berfungsi sebagai jusif, diperkuat oleh נָא, menyampaikan ajakan liturgis. “Biarlah ... sekarang berkata” mempertahankan unsur ajakan dan desakan secara wajar dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan dalam bentuk baku; dalam konteks ini menunjuk kepada umat Israel secara kolektif.
- source_word: כִּי
  choice: memperkenalkan isi ucapan langsung
  rationale: Dalam refrein ini כִּי dapat memperkenalkan isi pengakuan. Kutipan langsung terdengar alami dalam bahasa Indonesia, sementara kemungkinan arti “sebab” dicatat dalam catatan kaki.
- source_word: לְעוֹלָם
  choice: tetap untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Kata “tetap” melengkapi klausa nominal Ibrani secara alami tanpa mengubah inti maknanya.
- source_word: חַסְדּוֹ
  choice: Kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh, khususnya dalam hubungan perjanjian. “Kasih setia” merupakan padanan Indonesia yang jelas dan tidak mempersempit maknanya hanya menjadi belas kasihan.
theological_decisions:
- issue: Makna חֶסֶד dalam seruan pujian kepada Israel
  choice: kasih setia
  alternative: kasih perjanjian; kemurahan; belas kasih
  rationale: “Kasih setia” mempertahankan unsur kasih dan loyalitas yang teguh tanpa memasukkan rumusan doktrinal yang lebih sempit daripada cakupan istilah Ibraninya.
- issue: Fungsi כִּי dalam isi seruan
  choice: dipahami sebagai pengantar isi pengakuan melalui kutipan langsung
  alternative: 'diterjemahkan “sebab”: “Sebab kasih setia-Nya tetap untuk selama-lamanya”'
  rationale: Konstruksi Ibrani memungkinkan כִּי dibaca sebagai “sebab” atau sebagai pengantar isi yang harus diucapkan. Teks utama memakai kutipan langsung yang alami, sedangkan ambiguitasnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ajakan serta kutipan langsung cocok untuk pembacaan liturgis; istilah “kasih setia” mudah dipahami sekaligus mempertahankan bobot teologis istilah Ibrani.
