source:
  edition: WLC
  text: רָ֘שָׁ֤ע יִרְאֶ֨ה וְ/כָעָ֗ס שִׁנָּ֣י/ו יַחֲרֹ֣ק וְ/נָמָ֑ס תַּאֲוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/010.yaml
  text: The wicked man will see and be angry[a]; he will gnash his teeth and melt away; the desire of the wicked will perish.
translation:
  language: id
  text: Orang fasik akan melihatnya dan menjadi marah[a]; ia akan mengertakkan giginya dan mencair; keinginan orang-orang fasik akan binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani memakai kata tunggal, “orang fasik”, sebagai wakil bagi orang-orang fasik pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Nomina/adjektiva substantival maskulin tunggal yang bersifat representatif. Dalam bahasa Indonesia, "orang fasik" mempertahankan ketunggalan tanpa menambahkan penanda gender yang tidak perlu.
- source_word: יִרְאֶה
  choice: akan melihatnya
  rationale: Imperfek Qal orang ketiga tunggal, dengan nuansa mendatang/resultatif. Akhiran "-nya" menyatakan objek yang tersirat dari konteks, yakni keadaan baik dan kehormatan orang benar yang baru disebutkan.
- source_word: וְכָעָס
  choice: dan menjadi marah
  rationale: Bentuk perfek yang melanjutkan rangkaian puitis sesudah imperfek. "Menjadi marah" alami dalam bahasa Indonesia dan mempertahankan perkembangan reaksi tokoh.
- source_word: שִׁנָּיו יַחֲרֹק
  choice: ia akan mengertakkan giginya
  rationale: Mempertahankan gambaran idiomatis Ibrani tentang kemarahan dan frustrasi.
- source_word: וְנָמָס
  choice: dan lenyap
  rationale: Kata kerja ini dapat menggambarkan mencair, luruh, atau habis. "Lenyap" menyampaikan hasil akhirnya secara alami, sementara alternatif metaforis dicatat dalam catatan kaki.
- source_word: תַּאֲוַת
  choice: keinginan
  rationale: Padanan luas dan alami bagi hasrat atau dambaan, sesuai dengan gagasan tentang harapan orang fasik yang akhirnya gagal.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak substantival diterjemahkan secara eksplisit sebagai jamak dalam bahasa Indonesia.
- source_word: תֹּאבֵד
  choice: akan binasa
  rationale: Imperfek Qal feminin tunggal yang bersesuaian dengan "keinginan"; "binasa" mempertahankan bobot אבד dan menyatakan kegagalan total.
theological_decisions:
- issue: Ketunggalan maskulin representatif pada רָשָׁע
  choice: orang fasik
  alternative: orang-orang fasik
  rationale: Bahasa Indonesia tidak perlu menambahkan kata "laki-laki" untuk mencerminkan gender gramatikal Ibrani. Bentuk tunggal dipertahankan dalam teks utama, sedangkan sifat representatifnya dijelaskan dalam catatan.
- issue: Makna וְנָמָס
  choice: lenyap
  alternative: mencair atau luruh
  rationale: Konteks memungkinkan citra mencair/luruh maupun pengertian habis atau lenyap. Teks utama memakai ungkapan Indonesia yang alami tanpa menutup alternatif metaforis sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Paralelisme ayat dipertahankan dengan tiga klausa bertitik koma; citra mengertakkan gigi dijaga secara harfiah dan idiomatis.
