  text: הַ֥לְלוּ יָ֨הּ אַשְׁרֵי אִ֭ישׁ יָרֵ֣א אֶת יְהוָ֑ה בְּ֝/מִצְוֺתָ֗י/ו חָפֵ֥ץ מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/001.yaml
  text: Praise Yah! Blessed is the man who fears Yahweh[b][a], who greatly delights in his commandments.
translation:
  language: id
  text: Pujilah Yah![a] Berbahagialah orang[b] yang takut akan Yahweh, yang sangat menyukai perintah-perintah-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara tradisional, “Haleluya!”
    reason: lexical_alternative
  - marker: b
    text: Ibrani memakai bentuk tunggal maskulin, secara harfiah “laki-laki”; dalam perkataan hikmat ini bentuk tersebut digunakan secara generik.
    reason: cultural_note
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Bentuk imperatif jamak הַלְלוּ dan nama ilahi pendek יָהּ diterjemahkan secara transparan. Bentuk tradisional “Haleluya!” dicantumkan sebagai alternatif dalam catatan kaki.
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Ungkapan ini memperkenalkan pernyataan hikmat tentang keadaan yang patut dianggap baik dan sejahtera; “Berbahagialah” mempertahankan ragam mazmur yang luhur tanpa membatasinya pada perasaan senang.
- source_word: אִישׁ
  choice: orang
  rationale: Walaupun nomina Ibrani berbentuk maskulin tunggal, dalam pepatah hikmat ini seorang individu mewakili siapa pun yang memiliki sifat tersebut. “Orang” menyampaikan fungsi generiknya secara alami dalam bahasa Indonesia, sementara bentuk sumber dijelaskan dalam catatan kaki.
- source_word: יָרֵא אֶת יְהוָה
  choice: yang takut akan Yahweh
  rationale: “Takut” mempertahankan arti utama יָרֵא serta ketegangan teologis antara rasa gentar, hormat, dan takzim; tidak dipersempit menjadi sekadar “menghormati.” Nama יהוה ditransliterasikan “Yahweh.”
- source_word: בְּמִצְוֹתָיו
  choice: perintah-perintah-Nya
  rationale: Bentuk jamak מִצְוֹת diterjemahkan dengan “perintah-perintah”; pronomina posesif merujuk kepada Yahweh. Dalam bahasa Indonesia, objek verba “menyukai” tidak memerlukan reproduksi harfiah preposisi בְּ.
- source_word: חָפֵץ מְאֹד
  choice: sangat menyukai
  rationale: חָפֵץ menyatakan kesukaan atau kesenangan yang sungguh-sungguh, dan מְאֹד memperkuatnya. “Sangat menyukai” terdengar alami dan jelas bagi pembaca Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu dan membedakannya dari gelar, tanpa menggantinya dengan “TUHAN.”
- issue: Makna takut kepada Yahweh
  choice: takut akan Yahweh
  alternative: hormat kepada Yahweh; gentar terhadap Yahweh
  rationale: Pilihan “takut” menjaga cakupan dan ketegangan kata יָרֵא dalam sastra hikmat, yang mencakup rasa gentar sekaligus takzim, tanpa menyelesaikan nuansanya secara sepihak.
- issue: Bentuk maskulin tunggal אִישׁ dalam pepatah hikmat
  choice: orang
  alternative: laki-laki; seorang pria
  rationale: Konstruksi tunggal maskulin dipakai secara representatif dalam konteks ini. Bahasa Indonesia secara alami memakai “orang” untuk fungsi generik tersebut; bentuk gramatikal sumber tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan bentuk seruan pembuka dan pola ucapan bahagia. “Perintah-perintah-Nya” memakai kapitalisasi pronomina ilahi yang lazim dalam ragam keagamaan Indonesia.
