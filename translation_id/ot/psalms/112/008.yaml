  text: סָמ֣וּךְ לִ֭בּ/וֹ לֹ֣א יִירָ֑א עַ֖ד אֲשֶׁר יִרְאֶ֣ה בְ/צָרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/008.yaml
  text: His heart is steadfast[b][a]; he will not fear until he looks on his adversaries.
translation:
  language: id
  text: Hatinya teguh; ia tidak akan takut sampai ia melihat lawan-lawannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sampai ia melihat pada lawan-lawannya.” Dalam ungkapan Ibrani seperti ini, “melihat” lawan dapat menyiratkan menyaksikan hasil akhir yang menimpa mereka.
    reason: idiom_and_literal_rendering
lexical_decisions:
- source_word: סָמוּךְ
  choice: teguh
  rationale: Partisipel pasif dari סמך menggambarkan sesuatu yang ditopang, kukuh, atau mantap. Dalam konteks hati, “teguh” menyampaikan kestabilan batin secara alami tanpa membatasi maknanya pada dukungan dari luar.
- source_word: לִבּוֹ
  choice: hatinya
  rationale: לֵב mencakup pusat pikiran, kehendak, dan ketetapan batin. “Hati” merupakan padanan Indonesia yang luas dan wajar dalam bahasa mazmur.
- source_word: לֹא יִירָא
  choice: ia tidak akan takut
  rationale: Bentuk imperfek ירא dapat menyatakan keadaan yang berlanjut atau berorientasi ke depan. “Tidak akan takut” menegaskan keyakinan yang bertahan dalam konteks ini.
- source_word: עַד אֲשֶׁר
  choice: sampai
  rationale: Gabungan ini paling langsung menyatakan batas waktu. Dalam konteksnya, batas tersebut mengarah kepada saat pembenaran atau kemenangan, bukan saat keberaniannya berakhir karena berjumpa dengan lawan.
- source_word: יִרְאֶה בְצָרָיו
  choice: ia menyaksikan kekalahan lawan-lawannya
  rationale: Secara harfiah ungkapan ini berarti “ia melihat pada/terhadap lawan-lawannya,” tetapi konstruksi melihat dengan ב pada lawan dalam konteks seperti ini menyiratkan menyaksikan dengan puas hasil yang menimpa mereka. “Menyaksikan kekalahan” membuat maksud idiomatisnya jelas dalam bahasa Indonesia dan menghindari kesan keliru bahwa rasa takut baru timbul ketika ia melihat mereka.
- source_word: צָרָיו
  choice: lawan-lawannya
  rationale: צַר menunjuk kepada orang yang memusuhi atau menentang. “Lawan-lawannya” mempertahankan cakupan yang lebih luas daripada “musuh-musuhnya” dan sesuai dengan ragam puitis modern.
theological_decisions:
- issue: Nada kemenangan atau pembenaran dalam tindakan melihat lawan
  choice: Menyatakan bahwa ia menyaksikan kekalahan lawan-lawannya
  alternative: 'Menerjemahkan secara harfiah: “sampai ia melihat lawan-lawannya”'
  rationale: Terjemahan harfiah dalam bahasa Indonesia mudah dipahami seolah-olah keberaniannya hanya bertahan sampai ia berhadapan dengan para lawan. Konteks mazmur dan konstruksi Ibraninya menunjuk kepada pembenaran yang disaksikan atas mereka. Pilihan ini menyampaikan implikasi tersebut tanpa menentukan cara, waktu, atau pelaku kekalahan mereka.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Paralelisme puitis dipertahankan dengan dua klausa yang seimbang. “Teguh” dan “lawan-lawannya” dipilih agar mudah dipahami pembaca umum tanpa kehilangan bobot ragam mazmur.
