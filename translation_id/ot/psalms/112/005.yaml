translation:
  language: id
  text: Berbahagialah orang yang murah hati dan memberi pinjaman; ia mengelola urusannya dengan adil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia mengatur kata-katanya dengan adil.” Kata Ibrani דְּבָרָיו dapat berarti “urusannya” atau “kata-katanya”; dalam konteks memberi pinjaman dan bertindak adil, “urusannya” lebih sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב אִישׁ
  choice: Baiklah orang
  rationale: Ungkapan predikatif ini menyatakan penilaian positif terhadap orang tersebut. Bentuk ini dekat dengan susunan Ibrani dan tetap wajar dalam bahasa Indonesia; 'orang' menyampaikan pemakaian generik אִישׁ tanpa menjadikan jenis kelamin sebagai pokok ayat.
- source_word: חוֹנֵן
  choice: yang murah hati
  rationale: Partisip ini berarti menunjukkan kemurahan atau belas kasih. Dalam konteks memberi pinjaman, 'murah hati' alami dan tidak membatasi tindakan itu hanya pada pemberian materi.
- source_word: וּמַלְוֶה
  choice: dan memberi pinjaman
  rationale: Bentuk Hifil dari לוה secara langsung menunjuk pada tindakan meminjamkan; 'memberi pinjaman' merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: יְכַלְכֵּל
  choice: ia mengatur
  rationale: Dalam konstruksi dengan דְּבָרָיו, verba ini bermakna mengelola atau menangani. 'Mengatur' sesuai dengan cakupan urusan hidup dan transaksi.
- source_word: דְּבָרָיו
  choice: urusan-urusannya
  rationale: Kata ini dapat berarti perkataan maupun perkara atau urusan. Konteks pinjaman dan keadilan lebih mendukung arti 'urusan-urusannya', sementara kemungkinan 'perkataan-perkataannya' dipertahankan dalam catatan kaki.
- source_word: בְּמִשְׁפָּט
  choice: dengan adil
  rationale: Ungkapan ini menyatakan bahwa segala urusan ditangani berdasarkan keadilan. 'Dengan adil' alami dalam bahasa Indonesia dan mempertahankan daya etis מִשְׁפָּט.
