  text: Light dawns in the darkness for the upright[a]; he is gracious and compassionate and righteous.
translation:
  language: id
  text: Terang terbit dalam kegelapan bagi orang-orang yang lurus[a]; ia murah hati, penuh belas kasihan, dan adil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Terang terbit dalam kegelapan bagi orang-orang yang lurus—murah hati, penuh belas kasihan, dan adil,” dengan tiga sifat terakhir mungkin menggemakan sifat TUHAN dalam Mazmur 111:4.
    reason: alternative_reading
lexical_decisions:
- source_word: זָרַח
  choice: terbit
  rationale: Bentuk qatal dari זרח menyatakan muncul atau terbitnya terang. Dalam puisi hikmat ini, bentuk kini umum "terbit" terdengar alami dan dapat menyatakan kebenaran yang berlaku.
- source_word: בַּחֹשֶׁךְ
  choice: dalam kegelapan
  rationale: Gabungan preposisi ב dengan nomina berartikel secara langsung menyatakan "dalam kegelapan" dan mempertahankan kemungkinan makna harfiah maupun kiasan.
- source_word: אוֹר
  choice: Terang
  rationale: אוֹר merupakan subjek gramatikal klausa. "Terang" tanpa kata sandang cocok dengan gaya puitis bahasa Indonesia.
- source_word: לַיְשָׁרִים
  choice: bagi orang-orang yang tulus
  rationale: יְשָׁרִים menunjuk kepada orang yang lurus secara moral. "Tulus" alami dalam bahasa Indonesia dan menjaga pembedaan leksikal dari צַדִּיק pada akhir ayat.
- source_word: חַנּוּן
  choice: pengasih
  rationale: חַנּוּן menggambarkan pribadi yang menunjukkan kemurahan atau kasih karunia. "Pengasih" merupakan padanan yang alami dan bermartabat.
- source_word: רַחוּם
  choice: penyayang
  rationale: רַחוּם menekankan belas kasih yang lembut. "Penyayang" membedakannya dari חַנּוּן sambil mempertahankan rangkaian sifat.
- source_word: צַדִּיק
  choice: benar
  rationale: צַדִּיק di sini menggambarkan kelurusan moral. "Benar" mempertahankan istilah yang berbeda dari יְשָׁרִים yang diterjemahkan "tulus".
theological_decisions:
- issue: Acuan tiga kata sifat terakhir (חַנּוּן וְרַחוּם וְצַדִּיק)
  choice: Dipahami sebagai sifat orang benar tunggal yang menjadi pokok Mazmur 112, dengan subjek "ia" dinyatakan secara eksplisit.
  alternative: Ketiga sifat itu dapat menerangkan "terang", atau menggemakan sifat TUHAN dalam Mazmur 111:4.
  rationale: Kata-kata sifat tersebut berbentuk tunggal, sedangkan "orang-orang yang tulus" berbentuk jamak. Konteks Mazmur 112 berulang kali menggambarkan seorang yang takut akan TUHAN dalam bentuk tunggal, sehingga "ia" merupakan pembacaan yang masuk akal. Namun, kemiripan dengan sifat TUHAN dalam Mazmur 111:4 tetap dipertahankan dalam catatan kaki agar ketegangan teologis teks tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. Pilihan "tulus" dan "benar" mempertahankan perbedaan antara יָשָׁר dan צַדִּיק. Tanda titik koma membantu menunjukkan pergantian dari gambaran terang kepada sifat pribadi tanpa menutupi ketaksaan sintaksis yang dijelaskan dalam catatan kaki.
