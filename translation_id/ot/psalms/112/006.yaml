  text: Sebab orang benar[a] tidak akan pernah goyah; ia akan dikenang selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, ungkapan ini berbentuk tunggal maskulin dan mewakili orang benar pada umumnya.
