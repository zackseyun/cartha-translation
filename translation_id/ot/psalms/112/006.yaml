lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan logis itu secara alami.
- source_word: לְעוֹלָם לֹא יִמּוֹט
  choice: tidak akan pernah goyah
  rationale: Dalam konstruksi dengan penyangkalan, לְעוֹלָם menegaskan ketidakmungkinan yang berkelanjutan. “Tidak akan pernah goyah” menyampaikan citra keteguhan dari verba מוט secara wajar.
- source_word: לְזֵכֶר עוֹלָם
  choice: akan dikenang selama-lamanya
  rationale: Ungkapan ini menyatakan ingatan atau kenangan yang tetap bertahan. Bentuk verbal pasif alami dalam bahasa Indonesia dan mempertahankan gagasan peringatan yang kekal.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva maskulin tunggal ini dipakai secara substantival untuk sosok yang benar. “Orang benar” mempertahankan bentuk tunggal tanpa menambahkan kata “laki-laki” yang tidak dinyatakan secara leksikal.
- source_word: יִהְיֶה
  choice: akan
  rationale: Dalam ungkapan nominal לְזֵכֶר עוֹלָם יִהְיֶה, verba ini menyatakan keadaan pada masa mendatang; dalam susunan Indonesia “akan dikenang,” maknanya tersampaikan secara idiomatis.
theological_decisions:
- issue: Bentuk maskulin tunggal yang representatif dalam צַדִּיק
  choice: orang benar
  alternative: laki-laki yang benar; orang-orang benar
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal sebagai sosok representatif dalam sastra hikmat. “Orang benar” menjaga ketunggalannya dan cakupan umumnya, tanpa membatasi rujukan hanya kepada laki-laki atau mengubahnya menjadi bentuk jamak.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan gagasan kekekalan dipertahankan melalui “tidak akan pernah” dan “selama-lamanya,” sedangkan titik koma mencerminkan kesejajaran kedua larik.
