  source_fidelity: 'Teks Indonesia menyampaikan dua klausa Ibrani dengan setia: orang benar tidak takut terhadap שְׁמוּעָה רָעָה, dan hatinya נָכוֹן serta בָּטֻחַ kepada Yahweh. Terjemahan tidak menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit dalam teks sumber.'
