id: PSA.112.7
reference: Psalms 112:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/שְּׁמוּעָ֣ה רָ֭עָה לֹ֣א יִירָ֑א נָכ֥וֹן לִ֝בּ֗/וֹ בָּטֻ֥חַ בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/007.yaml
  text: He will not fear bad news[a]; his heart is steadfast[b], trusting in Yahweh.
translation:
  language: id
  text: Ia tidak takut pada kabar buruk[a]; hatinya teguh[b], percaya kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “laporan buruk.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hatinya mantap” atau “hatinya kokoh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׁמוּעָה רָעָה
  choice: pada kabar buruk
  rationale: Gabungan מִן dengan שְׁמוּעָה רָעָה menyatakan hal yang tidak ditakutinya ketika didengar atau datang. 'Kabar buruk' alami dalam bahasa Indonesia dan mempertahankan arti laporan atau berita yang merugikan.
- source_word: לֹא יִירָא
  choice: tidak takut
  rationale: Bentuk imperfek dalam mazmur hikmat ini menyatakan sikap yang menjadi cirinya. Bentuk kini umum 'tidak takut' terdengar alami dalam bahasa Indonesia tanpa meniadakan nuansa tindakan berkelanjutan atau mendatang.
- source_word: נָכוֹן
  choice: teguh
  rationale: Kata ini menggambarkan hati yang kokoh, mantap, atau ditetapkan. 'Teguh' ringkas, bermartabat, dan lazim untuk keteguhan batin.
- source_word: לִבּוֹ
  choice: hatinya
  rationale: '''Hati'' mempertahankan metafora Ibrani bagi batin seseorang, termasuk kehendak dan sikapnya.'
- source_word: בָּטֻחַ
  choice: percaya
  rationale: Bentuk ini menyatakan keadaan yakin atau menaruh kepercayaan. Bersama preposisi berikutnya, 'percaya kepada' merupakan ungkapan Indonesia yang wajar dan menampilkan dasar keteguhan hati tersebut.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ב menandai sasaran kepercayaan, yang secara alami diterjemahkan 'kepada' dalam bahasa Indonesia. Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan antara keteguhan hati dan kepercayaan
  choice: '''percaya kepada Yahweh'' dibiarkan menerangkan keadaan hati yang teguh'
  alternative: menambahkan hubungan sebab-akibat, misalnya 'karena ia percaya kepada Yahweh'
  rationale: Teks hanya menempatkan נָכוֹן dan בָּטֻחַ secara berdampingan tanpa penanda sebab eksplisit. Terjemahan tidak menambahkan hubungan logis yang lebih tegas daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur dua klausa dipertahankan, sementara ungkapan dibuat alami bagi pembaca umum. Semua penanda catatan kaki dicantumkan dalam teks utama.
