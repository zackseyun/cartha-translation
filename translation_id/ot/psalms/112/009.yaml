  text: He has distributed freely[a]; he has given to the poor. His righteousness stands forever[c][b]; his horn will be lifted up in honor.
translation:
  language: id
  text: Ia membagi-bagikan dengan murah hati; ia memberi kepada orang miskin. Kebajikannya tetap untuk selamanya[a]; tanduknya[b] akan terangkat dengan kehormatan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilannya tetap untuk selamanya.” Istilah Ibrani ini dapat menyatakan kebajikan atau keadilan.
    reason: lexical_alternative
  - marker: b
    text: “Tanduk” adalah metafora Ibrani untuk kekuatan, martabat, atau kedudukan yang ditinggikan.
    reason: cultural_note
  - marker: c
    text: Atau “akan ditinggikan dengan kehormatan” atau “dalam kemuliaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּזַּר
  choice: membagi-bagikan dengan murah hati
  rationale: Secara harfiah verba ini menggambarkan tindakan menyebarkan atau menceraiberaikan. Dalam konteks pemberian kepada orang miskin, ungkapan ini menyatakan kemurahan hati yang luas dan bebas, sambil tetap menyiratkan tindakan membagikan.
- source_word: נָתַן
  choice: memberi
  rationale: Padanan langsung yang mempertahankan kesejajaran puitis dengan tindakan membagi-bagikan pada baris sebelumnya.
- source_word: לָאֶבְיוֹנִים
  choice: kepada orang miskin
  rationale: אֶבְיוֹן menunjuk kepada orang miskin atau berkekurangan. 'Orang miskin' ringkas, wajar, dan sesuai dengan konteks kemurahan hati.
- source_word: צִדְקָתוֹ
  choice: kebenarannya
  rationale: צְדָקָה dapat mencakup kebenaran moral maupun keadilan. 'Kebenarannya' mempertahankan keluasan makna etis-teologis, sedangkan nuansa 'keadilannya' dicatat sebagai alternatif.
- source_word: עֹמֶדֶת לָעַד
  choice: tetap untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan yang tidak berakhir. 'Tetap untuk selama-lamanya' alami dalam bahasa Indonesia dan mempertahankan gambaran sesuatu yang terus berdiri atau bertahan.
- source_word: קַרְנוֹ
  choice: tanduknya
  rationale: Metafora Ibrani dipertahankan agar citra puitis sumber tidak dihilangkan; maknanya dijelaskan dalam catatan kaki.
- source_word: תָּרוּם
  choice: akan terangkat
  rationale: Verba ini menyatakan menjadi tinggi atau dimuliakan. 'Akan terangkat' mempertahankan citra tanduk yang meninggi tanpa menentukan secara berlebihan pelaku pengangkatannya.
- source_word: בְּכָבוֹד
  choice: dalam kehormatan
  rationale: כָּבוֹד dapat berarti kehormatan atau kemuliaan. Dalam mazmur hikmat ini, 'kehormatan' secara alami menyampaikan martabat dan pengangkatan di hadapan umum, sementara alternatifnya tetap dicatat.
theological_decisions:
- issue: Makna 'kebenarannya' dalam kaitannya dengan pemberian kepada orang miskin
  choice: Ungkapan ini menunjuk pada sifat dan tindakan benar orang yang murah hati yang tetap bernilai, tanpa dipersempit menjadi jasa untuk memperoleh keselamatan atau sekadar kegiatan sosial.
  alternative: Ungkapan ini dapat dipahami secara lebih khusus sebagai perbuatan amalnya atau sebagai keadilannya dalam kerangka perjanjian.
  rationale: Konteks menghubungkan kemurahan hati dengan kebenaran, tetapi istilah Ibrani tetap lebih luas daripada satu tindakan tertentu. Terjemahan mempertahankan keluasan itu dan tidak memasukkan kesimpulan doktrinal yang tidak dinyatakan oleh ayat.
- issue: Metafora tanduk
  choice: Metafora 'tanduk' dipertahankan sebagai lambang kekuatan, martabat, atau kedudukan yang ditinggikan.
  alternative: Metafora dapat ditafsirkan langsung sebagai 'kekuatan' atau 'martabatnya'.
  rationale: Mempertahankan citra sumber menjaga bentuk puisi dan ketegangan maknanya; catatan kaki membuat metafora itu dapat dipahami pembaca modern.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Paralelisme Ibrani dipertahankan melalui dua verba, 'membagi-bagikan' dan 'memberi'. Metafora 'tanduk' sengaja dipertahankan dalam teks utama dan dijelaskan melalui catatan kaki.
