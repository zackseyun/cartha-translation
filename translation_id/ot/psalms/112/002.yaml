base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/002.yaml
  text: His offspring will be mighty in the land[b][a]; the generation of the upright will be blessed.
translation:
  language: id
  text: Keturunannya[a] akan perkasa di negeri[b]; generasi orang-orang yang lurus akan diberkati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak cucunya”; kata Ibrani yang digunakan bersifat kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “di bumi”; kata Ibrani אֶרֶץ dapat berarti “negeri” atau “bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  choice: perkasa
  rationale: Di sini גִּבּוֹר menyatakan kekuatan atau kedudukan menonjol dari keturunan itu, bukan secara khusus menyebut mereka sebagai para pejuang. “Perkasa” mempertahankan nada luhur dan keluasan maknanya.
- source_word: בָּאָרֶץ
  choice: di negeri
  rationale: אֶרֶץ dapat berarti “negeri” maupun “bumi.” Dalam konteks mazmur hikmat tentang kehidupan dan kemakmuran sosial ini, “di negeri” paling sesuai, sedangkan kemungkinan “di bumi” dipertahankan dalam catatan kaki.
- source_word: יִהְיֶה
  choice: akan
  rationale: Bentuk היה ini menyatakan keadaan pada masa mendatang dalam konteks berkat; dalam bahasa Indonesia, predikat “akan perkasa” menyampaikan makna itu secara alami.
- source_word: זַרְעוֹ
  choice: keturunannya
  rationale: זֶרַע secara harfiah berarti “benih,” tetapi kerap menunjuk secara kolektif kepada anak cucu atau keturunan. “Keturunannya” alami dalam bahasa Indonesia dan mempertahankan pengertian kolektif tersebut.
- source_word: דּוֹר
  choice: angkatan
  rationale: דּוֹר menunjuk kepada suatu generasi atau kelompok segenerasi. “Angkatan” mempertahankan corak komunal ungkapan Ibrani dan tetap dapat dipahami pembaca modern.
- source_word: יְשָׁרִים
  choice: orang-orang yang lurus
  rationale: יָשָׁר menekankan kelurusan moral. Pilihan ini mempertahankan perbedaannya dari צַדִּיק, yang lebih lazim diterjemahkan “orang benar,” tanpa mempersempit makna menjadi kejujuran verbal saja.
- source_word: יְבֹרָךְ
  choice: akan diberkati
  rationale: Bentuk pasif dari ברך dipertahankan secara langsung. “Akan diberkati” mengungkapkan perkenanan yang luas dan tidak mereduksinya menjadi kemakmuran materi semata.
theological_decisions:
- issue: Cakupan bahasa berkat dalam mazmur hikmat
  choice: Pernyataan umum bahwa keturunan atau angkatan orang yang lurus akan menerima berkat dipertahankan tanpa mempersempit bentuk berkatnya.
  alternative: Menafsirkannya hanya sebagai kemakmuran materi atau sebagai jaminan keselamatan rohani bagi setiap keturunan.
  rationale: Teks Ibrani berbicara tentang keperkasaan dan berkat dalam cakupan luas. Terjemahan perlu mempertahankan keluasan serta ketegangan teologis itu dan tidak memasukkan kepastian doktrinal yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Perkasa” menjaga nada puitis tanpa membatasi makna pada kekuatan militer; “angkatan orang-orang yang lurus” mempertahankan paralelisme dan corak hikmat ayat tersebut.
