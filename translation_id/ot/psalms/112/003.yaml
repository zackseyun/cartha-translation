  text: הוֹן וָ/עֹ֥שֶׁר בְּ/בֵית֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/003.yaml
  text: Wealth and riches are in his house[a], and his righteousness stands forever.
translation:
  language: id
  text: Harta dan kekayaan ada di rumahnya, dan kebenarannya[a] tetap untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keadilannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: harta
  rationale: הוֹן menunjuk pada kekayaan atau milik material. “Harta” merupakan padanan Indonesia yang alami dan tetap dapat dipasangkan dengan עֹשֶׁר tanpa meleburkan kedua nomina itu.
- source_word: וָעֹשֶׁר
  choice: dan kekayaan
  rationale: עֹשֶׁר berarti kekayaan atau kelimpahan. “Kekayaan” mempertahankan pasangan puitis dengan הוֹן dalam bahasa Indonesia yang wajar.
- source_word: בְּבֵיתוֹ
  choice: ada di rumahnya
  rationale: בַּיִת dapat berarti rumah atau rumah tangga. “Di rumahnya” mempertahankan gambaran konkret teks Ibrani sekaligus memungkinkan cakupan rumah tangga dipahami dari konteks.
- source_word: וְצִדְקָתוֹ
  choice: dan kebenarannya
  rationale: צְדָקָה dapat menunjuk pada kebenaran moral, keadilan, atau perilaku yang benar. “Kebenarannya” menjaga ungkapan posesif dan makna etis yang luas tanpa memasukkan kategori doktrinal yang tidak dinyatakan teks.
- source_word: עֹמֶדֶת
  choice: tetap
  rationale: Partisipel dari עמד secara harfiah menggambarkan sesuatu yang berdiri atau bertahan. Dalam bahasa Indonesia, “tetap” menyampaikan keteguhan dan keberlangsungan secara alami.
- source_word: לָעַד
  choice: untuk selama-lamanya
  rationale: לָעַד menyatakan keberlangsungan tanpa akhir. “Untuk selama-lamanya” merupakan ungkapan Indonesia yang jelas dan bermartabat.
theological_decisions:
- issue: Makna “kebenarannya” dalam konteks berkat material
  choice: Ungkapan ini dibiarkan merujuk secara langsung pada kebenaran atau kelurusan hidup orang saleh yang bertahan.
  alternative: Ungkapan itu dapat menonjolkan keadilannya, kemurahan hatinya, atau pembenaran yang lebih luas dari Allah.
  rationale: Subjek mazmur ini adalah orang yang takut akan TUHAN. Bentuk posesif Ibrani dipertahankan tanpa menjadikannya istilah teknis tentang kebenaran yang diperhitungkan atau memasukkan pembacaan teologis kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Pasangan “harta dan kekayaan” mempertahankan paralelisme leksikal, sedangkan “tetap untuk selama-lamanya” mengungkapkan daya tahan yang tersirat dalam metafora Ibrani secara alami.
