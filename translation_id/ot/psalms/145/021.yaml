id: PSA.145.21
reference: Psalms 145:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תְּהִלַּ֥ת יְהוָ֗ה יְֽדַבֶּ֫ר פִּ֥/י וִ/יבָרֵ֣ךְ כָּל בָּ֭שָׂר שֵׁ֥ם קָדְשׁ֗/וֹ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/021.yaml
  text: My mouth will speak the praise of Yahweh[a], and all flesh will bless his holy name forever and ever.
translation:
  language: id
  text: Mulutku akan mengucapkan pujian kepada Yahweh, dan semua yang fana akan memuji nama-Nya yang kudus untuk selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “segala daging”; dapat berarti “semua manusia” atau “segala makhluk hidup,” yaitu semua makhluk yang fana.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִלַּת
  choice: pujian kepada
  rationale: Bentuk konstruk dengan יְהוָה menyatakan pujian yang diarahkan kepada Yahweh. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Yahweh adalah sumber pujian itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga mempertahankan nama pribadi yang terdapat dalam teks Ibrani.
- source_word: יְדַבֶּר
  choice: akan mengucapkan
  rationale: Bentuk imperfek dalam penutup mazmur menyatakan tekad atau tindakan yang berlanjut. 'Mengucapkan' cocok dengan subjek konkret 'mulutku' dan objek 'pujian'.
- source_word: פִּי
  choice: Mulutku
  rationale: Mempertahankan gambaran konkret teks Ibrani, alih-alih meratakannya menjadi 'aku'.
- source_word: וִיבָרֵךְ
  choice: akan memuji
  rationale: Dalam konteks manusia atau makhluk fana 'memberkati' nama Allah, ברך bermakna menyatakan pujian atau penghormatan. 'Memuji' lebih alami dan jelas dalam bahasa Indonesia modern.
- source_word: כָּל בָּשָׂר
  choice: semua yang fana
  rationale: Ungkapan harfiah 'segala daging' menunjuk kepada makhluk-makhluk yang fana. Pilihan ini mempertahankan nuansa kefanaan dan cakupan universal tanpa kekakuan ungkapan harfiah dalam bahasa Indonesia.
- source_word: שֵׁם קָדְשׁוֹ
  choice: nama-Nya yang kudus
  rationale: Ungkapan Indonesia yang alami untuk nama Allah sebagai penyataan identitas-Nya yang kudus.
- source_word: לְעוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Menyampaikan penegasan durasi tanpa akhir secara alami dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan כָּל בָּשָׂר
  choice: semua yang fana
  alternative: semua manusia; segala makhluk hidup; segala daging
  rationale: Bahasa Ibrani secara puitis menyebut 'segala daging'. Terjemahan utama mempertahankan unsur kefanaan sekaligus membiarkan cakupan tepatnya tetap terbuka; catatan kaki mencantumkan kemungkinan pembacaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan paralel ayat dipertahankan; 'Mulutku' menjaga citraan Ibrani, sedangkan 'semua yang fana' menyampaikan idiom universal כָּל בָּשָׂר secara wajar. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
