base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/012.yaml
  text: to make known to the sons of man his mighty acts and the glorious splendor of his kingdom[a].
translation:
  language: id
  text: untuk memberitahukan kepada anak-anak manusia[a] perbuatan-perbuatan-Nya yang perkasa dan kemuliaan agung kerajaan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat manusia.” Ungkapan Ibrani secara harfiah berbunyi “anak-anak manusia” dan mengacu kepada manusia pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹדִיעַ
  choice: untuk memberitahukan
  rationale: Bentuk infinitif Hifil dari ידע menyatakan tindakan kausatif, yaitu membuat sesuatu diketahui. “Memberitahukan” alami dalam bahasa Indonesia dan mempertahankan daya kausatif tersebut.
- source_word: לִבְנֵי הָאָדָם
  choice: kepada anak-anak manusia
  rationale: Ungkapan ini secara harfiah berarti “kepada anak-anak manusia” dan secara idiomatis mengacu kepada umat manusia pada umumnya. Bentuk Ibrani dipertahankan dalam teks utama, sedangkan cakupan generiknya dijelaskan dalam catatan kaki.
- source_word: גְּבוּרֹתָיו
  choice: perbuatan-perbuatan-Nya yang perkasa
  rationale: Bentuk jamak גְּבוּרוֹת menunjuk pada tindakan atau karya yang memperlihatkan kekuatan. Pilihan ini mempertahankan unsur tindakan dan kuasa.
- source_word: וּכְבוֹד הֲדַר
  choice: dan kemegahan mulia
  rationale: Gabungan כָּבוֹד dan הָדָר menumpuk gagasan kemuliaan, semarak, dan keagungan. “Kemegahan mulia” mempertahankan kedua unsur tanpa menghasilkan susunan nominal yang terlalu kaku dalam bahasa Indonesia.
- source_word: מַלְכוּתוֹ
  choice: kerajaan-Nya
  rationale: מַלְכוּת dapat berarti kerajaan, pemerintahan, atau kekuasaan sebagai raja. “Kerajaan-Nya” paling alami dalam konteks pujian kerajaan ini dan tetap dapat mencakup ranah serta pemerintahan Allah.
theological_decisions:
- issue: Cakupan generik ungkapan לִבְנֵי הָאָדָם
  choice: Mempertahankan ungkapan berbentuk Ibrani “anak-anak manusia” dalam teks utama
  alternative: “umat manusia” atau “semua manusia”
  rationale: Ungkapan tersebut mengacu kepada manusia secara umum, bukan hanya laki-laki. Bentuk sumber dipertahankan untuk menjaga citra dan corak puisinya, sementara makna inklusifnya dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Huruf kecil pada awal ayat dipertahankan karena klausa infinitif ini melanjutkan gagasan dari konteks sebelumnya. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan ejaan religius Indonesia.
