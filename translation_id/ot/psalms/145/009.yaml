  text: טוֹב יְהוָ֥ה לַ/כֹּ֑ל וְ֝/רַחֲמָ֗י/ו עַל כָּל מַעֲשָֽׂי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/009.yaml
  text: Yahweh is good to all[a], and his mercies are over all his works.
translation:
  language: id
  text: Yahweh baik kepada semua, dan belas kasih-Nya[a] meliputi segala karya-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani ini berbentuk jamak dan dapat diterjemahkan “berbagai belas kasih-Nya” atau “limpahan belas kasih-Nya”; bentuk itu menekankan kelimpahan atau banyaknya perwujudan belas kasih-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: baik
  rationale: Kata sifat ini menyatakan kebaikan dalam arti luas, baik secara moral maupun dalam tindakan yang mendatangkan manfaat; “baik” adalah padanan langsung dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap dipertahankan dan tidak diganti dengan gelar.
- source_word: לַכֹּל
  choice: kepada semua
  rationale: 'Preposisi ל menyatakan arah atau hubungan: kebaikan Yahweh tertuju kepada semua. Ungkapan ini mempertahankan cakupan universal teks.'
- source_word: רַחֲמָיו
  choice: belas kasih-Nya
  rationale: Bentuk jamak dari רַחֲמִים dapat menyatakan belas kasih yang berlimpah atau berbagai perwujudannya. Bentuk tunggal kolektif “belas kasih” paling alami dalam bahasa Indonesia, sedangkan nuansa bentuk Ibraninya dijelaskan dalam catatan kaki.
- source_word: עַל
  choice: meliputi
  rationale: Dalam klausa nominal ini, עַל menggambarkan belas kasih yang berada atau terbentang atas seluruh karya Allah. “Meliputi” menyampaikan cakupan yang menyeluruh secara alami tanpa membatasi maknanya pada tindakan tertentu.
- source_word: כָּל
  choice: segala
  rationale: “Segala” mempertahankan daya universal kata Ibrani dan sesuai dengan ragam puitis mazmur.
- source_word: מַעֲשָׂיו
  choice: karya-Nya
  rationale: Kata ini dapat berarti perbuatan atau hasil karya. Dalam konteks kebaikan ilahi yang universal, “karya-Nya” cukup luas untuk mencakup segala yang dikerjakan atau dijadikan-Nya tanpa memaksakan satu penafsiran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Cakupan universal כֹּל / כָּל
  choice: semua / segala karya-Nya
  alternative: setiap orang / segala yang diciptakan-Nya
  rationale: Teks tidak secara eksplisit membatasi objek pertama pada manusia atau objek kedua pada ciptaan saja. Pilihan ini menjaga keluasan dan kesejajaran ungkapan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang ringkas. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Pengulangan universal “semua ... segala” dipertahankan untuk mencerminkan כֹּל ... כָּל.
