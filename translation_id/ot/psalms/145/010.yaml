  text: All your works will give thanks to you[a], O Yahweh[b], and your faithful ones will bless you.
translation:
  language: id
  text: Segala karya-Mu akan bersyukur kepada-Mu, ya Yahweh[a], dan orang-orang yang setia kepada-Mu[b] akan memberkati-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
  - marker: b
    text: Atau “orang-orang kudus-Mu” atau “orang-orang saleh-Mu”. Istilah Ibrani ini menunjuk kepada mereka yang dicirikan oleh kesetiaan dan pengabdian dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: akan bersyukur kepada-Mu
  rationale: Bentuk Hifil dari ידה dapat berarti mengucap syukur atau memuji. Pilihan ini mempertahankan perbedaannya dari kata 'memberkati' pada baris sejajar serta menyatakan akhiran orang kedua tunggal sebagai 'kepada-Mu'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: כָּל מַעֲשֶׂיךָ
  choice: segala karya-Mu
  rationale: '''Segala'' menyatakan cakupan kolektif כָּל, sedangkan ''karya-Mu'' mempertahankan keluasan makna מַעֲשֶׂיךָ, yang dapat menunjuk pada hasil ciptaan maupun perbuatan Allah.'
- source_word: וַחֲסִידֶיךָ
  choice: dan orang-orang yang setia kepada-Mu
  rationale: חָסִיד menunjuk kepada orang yang dicirikan oleh kesetiaan, kasih setia, dan pengabdian dalam hubungan perjanjian. Ungkapan ini alami dalam bahasa Indonesia dan tidak memasukkan asosiasi gerejawi yang mungkin melekat pada 'orang-orang kudus'.
- source_word: יְבָרֲכוּכָה
  choice: akan memberkati-Mu
  rationale: Bentuk Piel dari ברך di sini berarti memberkati; akhiran orang kedua tunggal dipertahankan sebagai '-Mu'. Bentuk 'akan' mencerminkan nuansa imperfek puitis dan kesejajarannya dengan verba pertama.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH secara langsung. Transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan sebuah gelar.
- issue: Penerjemahan חֲסִידֶיךָ
  choice: orang-orang yang setia kepada-Mu
  alternative: orang-orang kudus-Mu; orang-orang saleh-Mu
  rationale: Pilihan utama mempertahankan unsur kesetiaan dan pengabdian yang terkandung dalam istilah Ibrani tanpa membatasinya pada pengertian kesucian ritual atau kategori gerejawi tertentu.
- issue: Makhluk ciptaan sebagai pelaku ucapan syukur
  choice: Segala karya-Mu akan bersyukur kepada-Mu
  alternative: Segala yang Kauciptakan akan memuji-Mu
  rationale: Personifikasi dalam teks dipertahankan, demikian pula kata kerja 'bersyukur', tanpa merasionalisasikannya menjadi pernyataan bahwa karya-karya itu sekadar menyebabkan manusia memuji Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapital pada pronomina dan akhiran yang mengacu kepada Allah dipakai sebagai konvensi penghormatan bahasa Indonesia. Kesejajaran dua klausa Ibrani dipertahankan melalui pengulangan bentuk 'akan ... kepada-Mu/memberkati-Mu'.
