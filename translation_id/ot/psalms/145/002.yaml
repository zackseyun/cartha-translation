base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/002.yaml
  text: Every day I will bless you[b][a], and I will praise your name forever and ever.
translation:
  language: id
  text: Setiap hari[a] aku akan memberkati Engkau, dan aku akan memuji nama-Mu[b] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan ‘Hari demi hari’.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Alkitab, ‘nama’ Allah menunjuk pada diri-Nya sebagaimana Ia menyatakan diri, termasuk karakter dan reputasi-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל־יוֹם
  choice: Setiap hari
  rationale: Ungkapan ini secara harfiah berarti ‘pada setiap hari’ dan menyatakan tindakan yang dilakukan hari demi hari. ‘Setiap hari’ alami dalam bahasa Indonesia serta mempertahankan makna pengulangan itu.
- source_word: אֲבָרֲכֶךָּ
  choice: aku akan memberkati Engkau
  rationale: Bentuk Piel dari ברך lazim berarti ‘memberkati’. Walaupun ungkapan memberkati Allah tidak umum dalam percakapan Indonesia, pilihan ini mempertahankan perbedaan dengan kata ‘memuji’ pada baris sejajar dan menyampaikan tindakan memaklumkan Allah sebagai Yang Terpuji.
- source_word: וַאֲהַלְלָה
  choice: dan aku akan memuji
  rationale: Bentuk Piel dari הלל berarti ‘memuji’. Dalam kesejajaran puitis, bentuk ini memiliki daya kehendak atau tekad yang wajar dinyatakan dengan ‘aku akan memuji’.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Secara harfiah berarti ‘nama-Mu’. Ungkapan konkret ini dipertahankan karena dalam bahasa pujian Ibrani nama Allah menunjuk pada diri-Nya sebagaimana dikenal, termasuk karakter dan reputasi-Nya.
- source_word: לְעוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Pasangan kata Ibrani ini menegaskan durasi yang tidak berakhir. ‘Untuk selama-lamanya’ merupakan ungkapan Indonesia yang alami dan kuat tanpa menghasilkan pengulangan yang janggal.
theological_decisions:
- issue: Sapaan langsung kepada Allah tanpa menambahkan gelar
  choice: Engkau
  alternative: Engkau, ya Allah; Engkau, Allahku dan Rajaku
  rationale: Akhiran orang kedua dalam ayat ini menyapa Allah secara langsung, tetapi tidak mengulang gelar dari ayat sebelumnya. Terjemahan tidak memasukkan kata-kata yang tidak terdapat dalam ayat ini.
- issue: Bahasa teologis tentang ‘nama’ Allah
  choice: nama-Mu
  alternative: Engkau; kemasyhuran-Mu
  rationale: Teks menyebut ‘nama’ Allah, bukan sekadar kata ganti atau kemasyhuran. Mempertahankan ‘nama-Mu’ menjaga gambaran konkret dan kekayaan makna alkitabiahnya.
- issue: Manusia ‘memberkati’ Allah
  choice: memberkati Engkau
  alternative: memuji Engkau; mengagungkan Engkau
  rationale: Bahasa Ibrani memakai ברך untuk tindakan penyembah terhadap Allah. Terjemahan mempertahankan ungkapan yang secara teologis menegangkan ini tanpa mengartikannya sebagai pemberian berkat kepada Allah atau meleburkannya dengan הלל, ‘memuji’, pada klausa berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada ibadah. Kapitalisasi ‘Engkau’ dan ‘-Mu’ menandai sapaan kepada Allah sesuai kebiasaan luas dalam tulisan keagamaan Indonesia. Struktur paralel puisi Ibrani dipertahankan, dan semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
