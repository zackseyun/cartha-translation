  text: כְּב֣וֹד מַלְכוּתְ/ךָ֣ יֹאמֵ֑רוּ וּ/גְבוּרָתְ/ךָ֥ יְדַבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/011.yaml
  text: They will speak of the glory of your kingdom[b][a], and talk of your might.
translation:
  language: id
  text: Mereka akan berbicara tentang kemuliaan kerajaan-Mu[a] dan membicarakan keperkasaan-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemerintahan-Mu” atau “kedudukan-Mu sebagai Raja.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kuasa-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד
  choice: kemuliaan
  rationale: Kata ini dapat berarti kemuliaan, kehormatan, atau semarak. “Kemuliaan” paling sesuai dengan konteks pujian dan mengungkapkan keagungan kerajaan Allah.
- source_word: מַלְכוּתְךָ
  choice: kerajaan-Mu
  rationale: מַלְכוּת dapat menunjuk pada kerajaan, pemerintahan, atau kedudukan sebagai raja. “Kerajaan-Mu” merupakan padanan yang alami dan tradisional dalam konteks ini, tanpa meniadakan nuansa pemerintahan aktif.
- source_word: יֹאמֵרוּ
  choice: akan berbicara tentang
  rationale: Bentuk imperfek menyatakan tindakan yang akan atau terus dilakukan. Dalam bahasa Indonesia, “berbicara tentang” menyampaikan makna ujaran dengan alami dan cocok dengan objek yang dibicarakan.
- source_word: גְבוּרָתְךָ
  choice: keperkasaan-Mu
  rationale: גְּבוּרָה menunjuk pada kekuatan atau keperkasaan, dan kadang dapat mengacu pada tindakan perkasa. “Keperkasaan-Mu” mempertahankan bentuk abstrak tunggal serta kesejajarannya dengan “kemuliaan”.
- source_word: יְדַבֵּרוּ
  choice: menuturkan
  rationale: דָּבַר berarti berbicara atau berkata. “Menuturkan” menjaga kesejajaran puitis sekaligus menghindari pengulangan kata “berbicara” tanpa menambahkan nuansa proklamasi yang terlalu kuat.
theological_decisions:
- issue: Makna מַלְכוּת ketika dikenakan kepada Allah
  choice: kerajaan-Mu
  alternative: pemerintahan-Mu; kedudukan-Mu sebagai Raja
  rationale: Bahasa Ibrani dapat menyoroti wilayah kerajaan, pelaksanaan pemerintahan, ataupun martabat sebagai raja. Teks utama memakai padanan yang paling alami, sedangkan catatan kaki mempertahankan keluasan maknanya tanpa mempersempitnya menjadi satu gagasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan sapaan ilahi “-Mu”. Dua verba yang sejajar dibedakan secara alami sebagai “berbicara tentang” dan “menuturkan”.
