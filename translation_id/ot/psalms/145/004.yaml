    text: 'Atau: “tindakan-tindakan-Mu yang penuh kuasa” atau “karya-karya keperkasaan-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר לְדוֹר
  choice: Generasi demi generasi
  rationale: Ungkapan ini mempertahankan pengulangan puitis kata Ibrani untuk ‘generasi’ dan menyampaikan kesinambungan pujian dari satu generasi ke generasi berikutnya secara alami dalam bahasa Indonesia.
- source_word: יְשַׁבַּח
  choice: akan memuji
  rationale: Bentuk piel dari שׁבח menyatakan pujian. ‘Akan memuji’ mempertahankan nuansa imperfek yang dapat menunjuk pada tindakan yang berlanjut atau akan berlangsung dalam konteks mazmur ini.
- source_word: מַעֲשֶׂיךָ
  choice: karya-karya-Mu
  rationale: מַעֲשֶׂה menunjuk pada karya atau perbuatan. ‘Karya-karya-Mu’ ringkas, mempertahankan bentuk nomina jamak, dan sesuai dengan ragam puisi yang luhur.
- source_word: וּגְבוּרֹתֶיךָ
  choice: perbuatan-perbuatan-Mu yang perkasa
  rationale: גְּבוּרוֹת menunjuk pada tindakan yang memperlihatkan kekuatan atau keperkasaan. Pilihan ini menyampaikan unsur tindakan sekaligus kuasa tanpa mempersempit maknanya.
- source_word: יַגִּידוּ
  choice: memberitakan
  rationale: Bentuk hifil dari נגד berarti membuat sesuatu diketahui, menceritakan, atau menyatakannya. ‘Memberitakan’ alami dalam bahasa Indonesia dan cocok dengan ragam puitis serta tindakan menyampaikan karya Allah kepada orang lain.
