  text: Generation to generation will praise your works[b][a], and will declare your mighty acts.
translation:
  language: id
  text: Generasi demi generasi[a] akan memuji karya-karya-Mu dan memberitakan perbuatan-perbuatan-Mu yang perkasa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Satu generasi akan memuji karya-karya-Mu kepada generasi lain.”'
    reason: lexical_alternative
