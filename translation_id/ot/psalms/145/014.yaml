  text: סוֹמֵ֣ךְ יְ֭הוָה לְ/כָל הַ/נֹּפְלִ֑ים וְ֝/זוֹקֵ֗ף לְ/כָל הַ/כְּפוּפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/014.yaml
  text: Yahweh supports all who are falling and raises up all who are bowed down[a].
translation:
  language: id
  text: Yahweh menopang semua orang yang sedang jatuh dan menegakkan semua orang yang tertunduk[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menopang semua orang yang jatuh.” Bentuk partisip Ibrani dapat dipahami secara umum atau sebagai tindakan yang sedang berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: סוֹמֵךְ
  choice: menopang
  rationale: Bentuk partisip ini menggambarkan tindakan yang berlangsung atau menjadi ciri tetap; “menopang” alami dalam bahasa Indonesia dan mencakup gagasan menyokong serta mempertahankan.
- source_word: לְכָל
  choice: semua orang
  rationale: Preposisi לְ bersama כָל menandai cakupan objek. Ungkapan “semua orang” menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: הַנֹּפְלִים
  choice: yang sedang jatuh
  rationale: Mempertahankan nuansa partisip yang dapat menggambarkan orang dalam proses jatuh, tanpa mengubahnya menjadi orang yang sudah sepenuhnya terjatuh.
- source_word: זוֹקֵף
  choice: menegakkan
  rationale: Kata ini berarti membuat tegak atau mengangkat kembali; “menegakkan” mempertahankan kesejajaran gambaran dengan orang yang tertunduk.
- source_word: הַכְּפוּפִים
  choice: yang tertunduk
  rationale: Mempertahankan citra orang yang membungkuk atau direndahkan, sekaligus membiarkan makna harfiah dan kiasannya tetap terbuka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan tidak menggantinya dengan gelar.
- issue: Keadaan orang-orang yang ditopang
  choice: yang sedang jatuh
  alternative: yang jatuh
  rationale: Bentuk partisip Ibrani dapat menunjuk tindakan yang sedang berlangsung atau keadaan yang bersifat umum. Teks utama menonjolkan tindakan yang berlangsung, sedangkan catatan kaki mempertahankan kemungkinan umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme Ibrani dipertahankan melalui pasangan “menopang” dan “menegakkan”; “tertunduk” menjaga kemungkinan makna jasmani maupun kiasan.
