  text: Yahweh is righteous in all his ways and faithful in all his works[a].
translation:
  language: id
  text: Yahweh adil dalam segala jalan-Nya dan setia dalam segala perbuatan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “baik hati” atau “murah hati”. Sejumlah terjemahan memakai “kudus” di sini, mengikuti tradisi tekstual yang berbeda dari makna “setia/teguh” dalam Teks Masoret.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: צַדִּיק
  choice: benar
  rationale: Dalam konteks pujian ini, “benar” menyatakan kelurusan moral dan keadilan Yahweh secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: בְּכָל
  choice: dalam segala
  rationale: Preposisi בְּ menandai lingkup, sedangkan כָּל menyatakan keseluruhan; “dalam segala” mempertahankan cakupan menyeluruh dan kesejajaran puitis.
- source_word: דְּרָכָיו
  choice: jalan-Nya
  rationale: “Jalan” mempertahankan metafora Ibrani bagi cara Yahweh bertindak tanpa mempersempitnya menjadi perilaku atau keputusan tertentu.
- source_word: חָסִיד
  choice: setia
  rationale: Kata ini menggambarkan pribadi yang bercirikan חֶסֶד, termasuk kesetiaan teguh dan kebaikan dalam relasi; “setia” mempertahankan bobot kesetiaan perjanjian dalam konteks ini.
- source_word: מַעֲשָׂיו
  choice: perbuatan-Nya
  rationale: “Perbuatan” secara alami menunjuk pada segala tindakan Yahweh dan membentuk pasangan puitis yang jelas dengan “jalan-Nya”.
theological_decisions:
- issue: Makna חָסִיד ketika digunakan bagi sifat Yahweh
  choice: setia
  alternative: baik hati, murah hati, atau kudus
  rationale: Teks Masoret memakai חָסִיד, yang dapat menonjolkan kebaikan atau kesetiaan teguh. “Setia” dipilih karena cocok dengan kesejajaran bersama “benar” dan menyampaikan keterandalan Yahweh tanpa meniadakan kemungkinan nuansa kebaikan. “Kudus” berasal dari tradisi tekstual yang berbeda dan karena itu tidak dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. Kapitalisasi pada pronomina “-Nya” mengikuti kebiasaan penghormatan kepada Allah dalam penerbitan Alkitab bahasa Indonesia; kesejajaran “segala jalan-Nya ... segala perbuatan-Nya” dipertahankan.
