translation:
  language: id
  text: Engkau membuka tangan-Mu dan memuaskan keinginan segala yang hidup[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memuaskan segala yang hidup dengan perkenanan” atau “dengan kehendak baik.” Kata benda Ibrani ini dapat berarti “keinginan,” “perkenanan,” atau “kehendak baik”; dalam konteks ini, “keinginan” paling sesuai dengan pemeliharaan Allah atas semua makhluk.
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹתֵחַ
  choice: membuka
  rationale: Partisipel Qal menggambarkan tindakan Allah yang terus berlangsung atau menjadi kebiasaan. Bentuk kini yang sederhana dan puitis, “membuka,” menyampaikan aspek ini secara alami dalam bahasa Indonesia.
- source_word: יָדֶךָ
  choice: tangan-Mu
  rationale: Citra anggota tubuh dalam bahasa Ibrani jelas dan wajar dipertahankan; bentuk ini menjaga gambaran konkret tentang kemurahan dan pemeliharaan Allah.
- source_word: וּמַשְׂבִּיעַ
  choice: dan memuaskan
  rationale: Bentuk Hifil dari שׂבע berarti menyebabkan kenyang, puas, atau berkecukupan. “Memuaskan” cocok dengan objek “keinginan” sekaligus mempertahankan nuansa kausatifnya.
- source_word: לְכָל
  choice: segala
  rationale: Dalam susunan dengan חַי, frasa ini menyatakan cakupan universal. “Segala” merupakan bentuk ringkas dan bermartabat yang alami untuk puisi Indonesia.
- source_word: חַי
  choice: yang hidup
  rationale: Adjektiva ini dipakai secara substantival dan mencakup semua makhluk bernyawa. “Yang hidup” mempertahankan keluasan ungkapan tanpa membatasinya pada manusia atau jenis makhluk tertentu.
- source_word: רָצוֹן
  choice: keinginan
  rationale: Kata benda ini dapat berarti keinginan, perkenanan, atau kesenangan. Dalam konteks pemeliharaan Allah atas semua makhluk, “keinginan” paling langsung cocok, sementara kemungkinan makna lainnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Gambaran antropomorfis tentang Allah
  choice: Mempertahankan ungkapan harfiah “tangan-Mu.”
  alternative: Engkau menyediakan dengan murah hati.
  rationale: Teks Ibrani memakai gambaran konkret untuk melukiskan pemeliharaan Allah. Mempertahankannya menjaga daya puitis ayat tanpa menambahkan pernyataan doktrinal mengenai hakikat jasmani Allah.
- issue: Ambiguitas רָצוֹן
  choice: Menerjemahkannya “keinginan” dalam teks utama dan mencatat alternatif leksikal.
  alternative: Perkenanan atau kesenangan.
  rationale: Konteks mendukung kebutuhan atau kerinduan makhluk hidup, tetapi rentang makna kata Ibrani tidak boleh dihapus. Catatan kaki mempertahankan ambiguitas yang sungguh ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Kapitalisasi pada “-Mu” mengikuti kebiasaan penulisan sapaan kepada Allah. Susunan kalimat mempertahankan kesejajaran dua tindakan ilahi dan citra konkret teks Ibrani.
