  text: The eyes of all look to you[b][a], and you give them their food in its time.
translation:
  language: id
  text: Semua mata tertuju kepada-Mu dengan penuh harap,[a] dan Engkau memberi mereka makanan pada waktunya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menanti-nantikan Engkau” atau “berharap kepada-Mu.” Kata kerja Ibrani mengandung arti menunggu dengan penuh harap.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada waktu yang tepat” atau “pada musimnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי כֹל
  choice: Mata semua makhluk
  rationale: Mempertahankan gambaran konkret 'mata semua' sambil memakai 'makhluk' agar ungkapan Indonesia alami dalam konteks pemeliharaan Allah; cakupannya tetap luas dan tidak dibatasi hanya pada manusia.
- source_word: אֵלֶיךָ יְשַׂבֵּרוּ
  choice: tertuju kepada-Mu dengan penuh harap
  rationale: Menggabungkan arah pandangan kepada Allah dengan nuansa penantian penuh harap pada verba יְשַׂבֵּרוּ, serta mempertahankan kaitannya dengan 'mata'.
- source_word: וְאַתָּה
  choice: dan Engkau
  rationale: Waw diterjemahkan sebagai penghubung biasa; kesejajaran ayat tidak menuntut makna pertentangan.
- source_word: נֹתֵן
  choice: memberi
  rationale: Partisip Ibrani menyatakan tindakan khas atau berkelanjutan; bentuk kini sederhana dalam bahasa Indonesia mengungkapkannya secara alami.
- source_word: אָכְלָם
  choice: makanan mereka
  rationale: Kata ini menunjuk pada makanan secara umum, bukan khusus roti.
- source_word: בְּעִתּוֹ
  choice: pada waktunya
  rationale: Terjemahan ringkas dan wajar yang mempertahankan akhiran tunggal serta tidak secara berlebihan menentukan apakah yang dimaksud ialah waktu makanan itu atau waktu yang tepat.
theological_decisions:
- issue: Cakupan כֹל dalam pemeliharaan Allah
  choice: semua makhluk
  alternative: semua; semua orang
  rationale: Konteks mazmur berbicara luas tentang makhluk hidup yang menerima makanan, tetapi ayat ini sendiri tidak membatasi cakupannya pada manusia. 'Semua makhluk' membuat rujukan idiomatis dalam bahasa Indonesia tanpa mempersempitnya kepada kelompok tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. Kapitalisasi pronomina bagi Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
