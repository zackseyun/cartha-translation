id: PSA.145.20
reference: Psalms 145:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שׁוֹמֵ֣ר יְ֭הוָה אֶת כָּל אֹהֲבָ֑י/ו וְ/אֵ֖ת כָּל הָ/רְשָׁעִ֣ים יַשְׁמִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/020.yaml
  text: Yahweh preserves all who love him[a], but all the wicked he will destroy.
translation:
  language: id
  text: Yahweh menjaga semua orang yang mengasihi-Nya, tetapi Ia akan membinasakan semua orang fasik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan Ia akan membinasakan semua orang fasik”; kata penghubung Ibrani berarti “dan”, tetapi di sini menyatakan kontras.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: menjaga
  rationale: Partisipel dari שׁמר menyatakan tindakan menjaga atau melindungi yang terus berlangsung. “Menjaga” alami dalam bahasa Indonesia dan mencakup pemeliharaan serta perlindungan, bukan sekadar pengamatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶת כָּל אֹהֲבָיו
  choice: semua orang yang mengasihi-Nya
  rationale: Bentuk partisipel dengan sufiks berarti mereka yang mengasihi Dia. Klausa relatif ini merupakan ungkapan Indonesia yang alami dan mempertahankan arah kasih kepada Yahweh.
- source_word: וְאֵת כָּל הָרְשָׁעִים
  choice: tetapi ... semua orang fasik
  rationale: ו secara bentuk berarti “dan”, tetapi dalam paralelisme antitetis ini menghubungkan dua tindakan yang berlawanan. “Tetapi” menyatakan hubungan kontras itu secara wajar.
- source_word: יַשְׁמִיד
  choice: Ia akan membinasakan
  rationale: Bentuk Hifil dari שׁמד menyatakan menyebabkan kebinasaan. “Membinasakan” mempertahankan kekuatan kata Ibrani tanpa menentukan cara atau cakupannya melebihi teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama diri tersebut dan tidak menggantinya dengan gelar.
- issue: Daya konjungsi ו sebelum klausa kedua
  choice: 'kontras: “tetapi”'
  alternative: 'koordinasi sederhana: “dan”'
  rationale: Secara leksikal konjungsi itu dapat diterjemahkan “dan”, tetapi hubungan antara menjaga orang yang mengasihi Yahweh dan membinasakan orang fasik bersifat antitetis. Catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Orang fasik” mempertahankan istilah moral-teologis yang lazim, sedangkan “menjaga” menyampaikan perlindungan berkelanjutan secara jelas. Huruf kapital pada “-Nya” dan “Ia” mengikuti konvensi penghormatan Indonesia untuk rujukan kepada Allah.
