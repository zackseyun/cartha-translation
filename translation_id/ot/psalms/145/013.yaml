base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/013.yaml
  text: Your kingdom is a kingdom of all ages[b][a], and your dominion is through every generation.
translation:
  language: id
  text: 'Kerajaan-Mu adalah kerajaan sepanjang segala zaman,[a]

    dan kekuasaan-Mu berlangsung dari generasi ke generasi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Kerajaan-Mu adalah kerajaan yang kekal.” Secara lebih harfiah: “Kerajaan-Mu adalah kerajaan segala zaman.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “dalam setiap generasi dan generasi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכוּתְךָ
  choice: Kerajaan-Mu
  rationale: מַלְכוּת dapat menunjuk pada kerajaan, kedudukan sebagai raja, atau pemerintahan. “Kerajaan-Mu” alami dalam bahasa Indonesia, mempertahankan citra kerajaan, dan sejalan dengan “kekuasaan-Mu” pada baris kedua.
- source_word: מַלְכוּת
  choice: adalah kerajaan
  rationale: Pengulangan kata benda dalam bahasa Ibrani—“Kerajaan-Mu adalah kerajaan”—dipertahankan karena memberi penekanan puitis dan tidak mereduksi ungkapan itu menjadi sekadar “kekal”.
- source_word: כָּל עֹלָמִים
  choice: sepanjang segala zaman
  rationale: Bentuk jamak עֹלָמִים menyatakan rentang waktu yang tidak berbatas melintasi segala zaman. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan gambaran zaman demi zaman.
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: dan kekuasaan-Mu
  rationale: מֶמְשָׁלָה menunjuk pada kuasa atau wewenang untuk memerintah. “Kekuasaan” memiliki ragam yang bermartabat dan tidak mempersempit maknanya menjadi administrasi pemerintahan.
- source_word: בְּכָל דּוֹר וָדֹר
  choice: dari generasi ke generasi
  rationale: Secara harfiah ungkapan ini berbunyi “dalam setiap generasi dan generasi,” sebuah idiom bagi kesinambungan sepanjang generasi-generasi berturut-turut. “Dari generasi ke generasi” merupakan padanan Indonesia yang alami dan puitis.
theological_decisions:
- issue: Jangka waktu kerajaan dan kekuasaan Allah
  choice: Ayat ini menegaskan bahwa kerajaan dan kekuasaan Allah mencakup segala zaman dan setiap generasi, dengan tetap mempertahankan bahasa puitis Ibrani.
  alternative: “Kerajaan-Mu adalah kerajaan yang kekal, dan kekuasaan-Mu bertahan sepanjang segala generasi.”
  rationale: Bahasa Ibrani dengan jelas menyatakan keberlangsungan tanpa batas, tetapi memakai pengulangan “kerajaan” dan ungkapan tentang segala zaman serta generasi. Terjemahan utama mempertahankan bentuk puitis itu tanpa memasukkan rumusan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan “kerajaan” dipertahankan untuk mencerminkan penekanan teks Ibrani. Baris kedua memakai elipsis kopula yang wajar dalam puisi Indonesia sehingga tidak menambahkan kata kerja seperti “bertahan” yang tidak dinyatakan secara eksplisit.
