  text: They will pour forth the memory of your abundant goodness[b][a], and they will sing for joy of your righteousness.
translation:
  language: id
  text: Mereka akan meluapkan ingatan tentang kebaikan-Mu yang berlimpah[a], dan akan bersorak-sorai karena kebenaran-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
