    reason: alternative_reading
lexical_decisions:
- source_word: זֵכֶר
  choice: kenangan
  rationale: Kata ini menunjuk pada ingatan atau penyebutan yang mengenang. Sebagai objek יַבִּיעוּ, yang dimaksud ialah kenangan tentang kebaikan Allah yang diungkapkan dalam pujian.
- source_word: רַב
  choice: yang berlimpah
  rationale: Kata sifat ini menyatakan kebesaran dalam jumlah atau keluasan. Frasa ini menyampaikan kelimpahan kebaikan Allah secara alami dalam bahasa Indonesia.
- source_word: טוּבְךָ
  choice: kebaikan-Mu
  rationale: טוּב dapat mencakup sifat baik dan kebaikan yang diwujudkan dalam kemurahan. 'Kebaikan-Mu' mempertahankan cakupan luas itu tanpa membatasinya pada pemberian materi.
- source_word: יַבִּיעוּ
  choice: akan meluapkan
  rationale: Bentuk Hifil dari נבע menggambarkan sesuatu yang memancar atau meluap. 'Meluapkan' mempertahankan metafora tentang pujian yang keluar dengan berlimpah.
- source_word: וְצִדְקָתְךָ
  choice: kebenaran-Mu
  rationale: צדקה dapat berarti kebenaran atau keadilan. 'Kebenaran-Mu' mempertahankan pengertian luas tentang sifat dan tindakan Allah yang benar, sedangkan 'keadilan-Mu' dicatat sebagai alternatif.
- source_word: יְרַנֵּנוּ
  choice: akan menyanyikan dengan sukacita
  rationale: Bentuk Piel dari רנן menyatakan seruan nyaring penuh sukacita yang dapat berupa nyanyian. Pilihan ini alami dalam konteks mazmur dan selaras dengan pujian lisan pada baris pertama.
theological_decisions:
- issue: Makna צדקה dalam konteks pujian
  choice: kebenaran-Mu
  alternative: keadilan-Mu
  rationale: Istilah Ibrani ini mencakup baik kebenaran moral maupun keadilan. Teks utama memakai istilah yang lebih luas, sementara alternatif yang sah dipertahankan dalam catatan kaki agar ketegangan maknanya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora meluap pada יַבִּיעוּ dipertahankan, pengulangan subjek menjaga kesejajaran kedua bagian ayat, dan istilah teologis צדקה tidak dipersempit tanpa catatan.
