base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/001.yaml
  text: A praise of David[a]. I will exalt you, my God the King[d][c][b], and I will bless your name forever and ever.
translation:
  language: id
  text: Pujian Daud[a]. Aku akan meninggikan Engkau, ya Allahku, Sang Raja, dan aku akan memuji[b] nama-Mu untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Pujian oleh Daud.” Ungkapan Ibrani dapat menunjukkan kepengarangan atau keterkaitan dengan Daud.'
    reason: alternative_reading
  - marker: b
    text: 'Secara lebih harfiah: “aku akan memberkati nama-Mu.” Dalam konteks ini, memberkati Allah berarti memuji-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִלָּה
  choice: Pujian
  rationale: Mempertahankan bentuk nomina tunggal dan fungsinya sebagai judul mazmur.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam judul 'Pujian Daud', konstruksi ini secara alami tetap dapat menunjukkan karya Daud atau keterkaitan dengannya; catatan kaki menjelaskan keluwesan preposisinya.
- source_word: אֲרוֹמִמְךָ
  choice: Aku akan meninggikan Engkau
  rationale: Menyampaikan arti dasar רומם, yaitu mengangkat tinggi atau mengagungkan, dengan bahasa ibadah yang wajar.
- source_word: אֱלוֹהַי הַמֶּלֶךְ
  choice: ya Allahku, Sang Raja
  rationale: Mempertahankan hubungan aposisional 'Allahku, Raja itu' dan artikel pada הַמֶּלֶךְ tanpa menambahkan kata hubung atau akhiran posesif pada 'Raja'.
- source_word: וַאֲבָרֲכָה
  choice: dan aku akan memuji
  rationale: Dalam konteks manusia memberkati nama Allah, 'memuji' menyampaikan fungsi idiomatis ברך secara alami dalam bahasa Indonesia; makna harfiahnya dicatat di catatan kaki.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Mempertahankan idiom penting Alkitab tentang nama sebagai identitas dan kemasyhuran Allah.
- source_word: לְעוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang alami dan khidmat untuk durasi tanpa akhir yang ditekankan oleh pasangan kata Ibrani tersebut.
theological_decisions:
- issue: Hubungan antara 'Allahku' dan 'Sang Raja' dalam sapaan langsung
  choice: ya Allahku, Sang Raja
  alternative: ya Allahku dan Rajaku
  rationale: Teks Ibrani menempatkan הַמֶּלֶךְ sebagai aposisi bagi אֱלוֹהַי. Pilihan ini mengidentifikasi Allah sebagai Raja tanpa menambahkan kata hubung dan tanpa mengubah 'Raja itu' menjadi 'Rajaku'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. 'Sang Raja' dipakai sebagai aposisi yang alami dan bermartabat.
