id: PSA.145.3
reference: Psalms 145:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד וְ֝/לִ/גְדֻלָּת֗/וֹ אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/003.yaml
  text: Great is Yahweh[a], and greatly to be praised, and his greatness is unsearchable.
translation:
  language: id
  text: Yahweh itu besar dan sangat patut dipuji; kebesaran-Nya tak terselami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “bagi kebesaran-Nya tidak ada penyelidikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: besar
  rationale: Adjektiva predikatif ini menyatakan kebesaran dan keagungan Yahweh secara langsung tanpa menambahkan gagasan lain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama pribadi dengan transliterasi yang lazim dalam bahasa Indonesia, bukan diganti dengan gelar.
- source_word: מְהֻלָּל מְאֹד
  choice: sangat patut dipuji
  rationale: Partisip pasif dari הלל yang diperkuat oleh מְאֹד menyatakan bahwa Yahweh sungguh layak menerima pujian. Ungkapan ini alami dalam bahasa Indonesia dan menghindari kesan bahwa ayat hanya melaporkan bahwa Ia sedang dipuji.
- source_word: לִגְדֻלָּתוֹ
  choice: kebesaran-Nya
  rationale: Nomina גדלה dengan sufiks orang ketiga maskulin tunggal menunjuk langsung kepada kebesaran Yahweh; preposisi ל disesuaikan secara idiomatis dalam susunan klausa bahasa Indonesia.
- source_word: אֵין חֵקֶר
  choice: tak terselami
  rationale: Ungkapan ini menyatakan bahwa kebesaran Yahweh tidak dapat diselidiki atau dipahami sampai tuntas. 'Tak terselami' ringkas, alami, dan mempertahankan daya puitisnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. Bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Batas pemahaman manusia atas kebesaran Allah
  choice: kebesaran-Nya tak terselami
  alternative: bagi kebesaran-Nya tidak ada penyelidikan
  rationale: Terjemahan utama menyampaikan bahwa kebesaran Yahweh tidak dapat diselidiki sampai tuntas, tanpa menyatakan bahwa manusia sama sekali tidak dapat mengetahui apa pun tentang-Nya. Bentuk yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan kalimat yang mudah dipahami. Bentuk singkat 'tak' dipilih karena sesuai dengan larik puisi dan tetap bermartabat.
