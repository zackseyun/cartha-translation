  text: חַנּ֣וּן וְ/רַח֣וּם יְהוָ֑ה אֶ֥רֶךְ אַ֝פַּ֗יִם וּ/גְדָל חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/008.yaml
  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
translation:
  language: id
  text: Yahweh itu pengasih dan penyayang, lambat marah, dan kasih setia-Nya besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berlimpah dalam kasih setia.” Ungkapan Ibrani ini dapat menekankan baik besarnya maupun melimpahnya kasih setia.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  choice: pengasih
  rationale: Kata ini menggambarkan pribadi yang memberikan anugerah atau kemurahan. “Pengasih” alami dalam bahasa Indonesia dan tetap dibedakan dari רַחוּם.
- source_word: רַחוּם
  choice: penyayang
  rationale: Kata ini menyatakan belas kasih yang mendalam. “Penyayang” merupakan padanan Indonesia yang jelas dan selaras dengan pasangan ungkapan “pengasih dan penyayang” tanpa meleburkan kedua istilah Ibrani menjadi satu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani dipertahankan.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lambat marah
  rationale: Ungkapan Ibrani ini secara harfiah berkaitan dengan “panjang hidung,” tetapi secara idiomatis berarti tidak lekas marah atau sabar menghadapi provokasi. “Lambat marah” mempertahankan citra maknanya dengan bahasa Indonesia yang wajar.
- source_word: גְדָל
  choice: besar
  rationale: Bentuk ini menyatakan kebesaran atau keluasan sifat yang diterangkan. “Besar” adalah padanan langsung, sementara makna kelimpahan juga mungkin dalam konteks ini.
- source_word: חָסֶד
  choice: kasih setia
  rationale: חָסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh, sering dalam hubungan perjanjian. “Kasih setia” ringkas, lazim, dan mempertahankan unsur kasih serta loyalitas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan גְדָל dengan חָסֶד
  choice: besar kasih setia-Nya
  alternative: berlimpah kasih setia
  rationale: Frasa Ibrani dapat menonjolkan besarnya kasih setia atau kelimpahannya. Teks utama memakai padanan yang lebih langsung, sedangkan alternatif dicatat agar nuansa asli tidak disempitkan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan sifat dipertahankan secara puitis dan ringkas; “itu” membantu membentuk predikasi nominal yang alami, sedangkan “serta” menandai unsur terakhir dalam rangkaian.
