  text: וֶ/עֱז֣וּז נוֹרְאֹתֶ֣י/ךָ יֹאמֵ֑רוּ ו/גדולתי/ך אֲסַפְּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/006.yaml
  text: They will speak of the might of your awesome deeds[b][a], and I will recount your greatness.
translation:
  language: id
  text: Mereka akan berbicara tentang keperkasaan perbuatan-perbuatan-Mu yang menggentarkan[a], dan aku akan menuturkan kebesaran-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbuatan-perbuatan-Mu yang dahsyat.” Kata Ibrani ini menunjuk pada tindakan yang membangkitkan kegentaran dan kekaguman penuh hormat.
    reason: lexical_alternative
  - marker: b
    text: Atau “perbuatan-perbuatan-Mu yang besar.” Kata Ibrani ini dapat menyatakan kebesaran ataupun hal-hal besar yang Allah lakukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶעֱזוּז
  choice: kedahsyatan
  rationale: Nomina עֱזוּז menyatakan kekuatan atau keperkasaan. Dalam konstruksi dengan נוֹרְאֹתֶיךָ, 'kedahsyatan' secara alami mempertahankan gagasan daya yang dahsyat serta hubungan erat dengan perbuatan-perbuatan berikutnya.
- source_word: נוֹרְאֹתֶיךָ
  choice: perbuatan-perbuatan-Mu yang menakutkan
  rationale: Bentuk ini menunjuk pada hal-hal atau tindakan-tindakan yang membangkitkan takut, gentar, dan kekaguman. Pilihan ini mempertahankan unsur takut yang nyata dalam akar ירא tanpa menghilangkan nuansa takjub.
- source_word: יֹאמֵרוּ
  choice: mereka akan menceritakan
  rationale: Imperfek orang ketiga jamak menyatakan tindakan yang akan berlangsung atau lazim dilakukan. 'Menceritakan' sesuai dengan objek berupa perbuatan Allah dan sejajar dengan pernyataan orang pertama pada klausa berikutnya.
- source_word: וּגְדוּלָתְךָ
  choice: kebesaran-Mu
  rationale: גדולה dapat berarti kebesaran secara abstrak maupun perbuatan-perbuatan besar. 'Kebesaran-Mu' menjaga bentuk abstrak dan paralelisme puitis, sementara alternatif semantis dicatat dalam catatan kaki.
- source_word: אֲסַפְּרֶנָּה
  choice: aku akan menuturkan
  rationale: Dalam piel, ספר berarti menceritakan, menghitung, atau memberitakan secara terperinci. 'Menuturkan' terdengar alami dan bermartabat dalam puisi serta menyampaikan tindakan deklarasi yang disengaja.
theological_decisions:
- issue: Nuansa נוֹרָאוֹת sebagai tindakan yang menimbulkan takut sekaligus takjub
  choice: perbuatan-perbuatan-Mu yang menakutkan
  alternative: perbuatan-perbuatan-Mu yang mengagumkan
  rationale: Terjemahan utama mempertahankan ketegangan dalam bahasa Ibrani antara kegentaran dan kekaguman, alih-alih mereduksinya menjadi rasa kagum saja.
- issue: Makna גְּדוּלָה sebagai kebesaran atau perbuatan besar
  choice: kebesaran-Mu
  alternative: perbuatan-perbuatan-Mu yang besar
  rationale: Konteks memungkinkan kedua makna. Bentuk abstrak dipertahankan dalam teks utama, sedangkan kemungkinan makna konkret disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, bermartabat, dan mudah dipahami. Pengulangan 'perbuatan-perbuatan' mencerminkan bentuk kolektif/jamak dan menjaga objek konkret pada klausa pertama; 'kedahsyatan' menghindari rangkaian genitif yang kaku. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
