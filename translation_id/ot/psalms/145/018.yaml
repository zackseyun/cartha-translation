  text: קָר֣וֹב יְ֭הוָה לְ/כָל קֹרְאָ֑י/ו לְ/כֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣/הוּ בֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/018.yaml
  text: Yahweh is near to all who call on him[a], to all who call on him in truth.
translation:
  language: id
  text: Yahweh dekat kepada semua orang yang berseru kepada-Nya, kepada semua orang yang berseru kepada-Nya dalam kebenaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan tulus,” “dengan sungguh-sungguh,” atau “dengan setia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: dekat
  rationale: Adjektiva predikatif ini berarti ‘dekat’. Pilihan ini alami dalam bahasa Indonesia dan tetap memuat nuansa kedekatan, baik secara kiasan maupun relasional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai ‘Yahweh’, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: לְכָל
  choice: kepada semua orang
  rationale: Preposisi ל menandai hubungan dengan orang-orang yang dimaksud. ‘Kepada semua orang’ jelas dan mempertahankan cakupan universal serta kesejajaran kedua bagian ayat.
- source_word: קֹרְאָיו
  choice: yang berseru kepada-Nya
  rationale: Dalam konteks doa atau permohonan kepada Allah, קרא secara wajar diterjemahkan ‘berseru kepada’. Sufiks pronominal dinyatakan dengan ‘-Nya’.
- source_word: אֲשֶׁר יִקְרָאֻהוּ
  choice: yang berseru kepada-Nya
  rationale: Pengulangan yang sama mempertahankan paralelisme puitis dan penegasan dalam teks Ibrani.
- source_word: בֶאֱמֶת
  choice: dengan sungguh-sungguh
  rationale: Dalam konteks seruan kepada Allah, frasa ini menunjuk pada seruan yang tulus atau sejati. ‘Dengan sungguh-sungguh’ merupakan ungkapan Indonesia yang alami, sedangkan kemungkinan harfiah ‘dalam kebenaran’ dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa atau TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; penggunaan ‘Yahweh’ mempertahankan nama ilahi tanpa menggantinya dengan sebuah gelar.
- issue: Cakupan kedekatan ilahi
  choice: Mempertahankan ‘semua orang yang berseru kepada-Nya’, dengan kualifikasi pada bagian kedua
  alternative: Membatasi secara tersirat kepada kelompok perjanjian tertentu, atau memperluasnya kepada semua manusia tanpa syarat
  rationale: Ayat itu sendiri menyatakan cakupan dan kualifikasinya. Terjemahan tidak mempersempit ataupun memperluas pernyataan melampaui bahasa Ibrani.
- issue: Makna בֶאֱמֶת
  choice: dengan sungguh-sungguh
  alternative: dalam kebenaran; dengan tulus; dengan setia
  rationale: Pilihan utama menyampaikan ketulusan dan kesejatian seruan tanpa menetapkan tafsiran doktrinal yang lebih sempit; catatan kaki menjaga rentang makna kata Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ‘kepada semua orang yang berseru kepada-Nya’ dipertahankan untuk mencerminkan paralelisme puitis Ibrani. Huruf kapital pada ‘-Nya’ mengikuti kebiasaan ejaan religius Indonesia ketika mengacu kepada Allah.
