  yaml_path: translation/ot/psalms/145/019.yaml
  text: He fulfills the desire of those who fear him[b][a]; he hears their cry for help and saves them.
translation:
  language: id
  text: Ia memenuhi keinginan orang-orang yang takut kepada-Nya; Ia mendengar seruan mereka memohon pertolongan dan menyelamatkan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan melepaskan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: keinginan
  rationale: Dalam konteks ini kata tersebut menunjuk pada apa yang diinginkan atau dirindukan oleh orang-orang yang takut kepada Allah. “Keinginan” alami dalam bahasa Indonesia dan cocok sebagai objek dari יַעֲשֶׂה.
- source_word: יְרֵאָיו
  choice: orang-orang yang takut kepada-Nya
  rationale: Bentuk ini menunjuk pada orang yang dicirikan oleh sikap takut akan Allah. Terjemahan ini mempertahankan istilah “takut” dan bobot teologis bahasa Ibrani tanpa melembutkannya menjadi sekadar “menghormati”.
- source_word: יַעֲשֶׂה
  choice: memenuhi
  rationale: Secara harfiah verba ini berarti “melakukan” atau “mengerjakan”, tetapi bersama רְצוֹן ungkapan Indonesia yang wajar ialah “memenuhi keinginan”.
- source_word: שַׁוְעָתָם
  choice: seruan mereka minta tolong
  rationale: Kata ini menyatakan seruan dalam kesesakan yang memohon pertolongan. Pilihan ini mengungkapkan unsur permohonan pertolongan secara alami dan terkait jelas dengan tindakan menyelamatkan pada klausa berikutnya.
- source_word: יִשְׁמַע
  choice: Ia mendengar
  rationale: Pilihan ini mempertahankan arti dasar verba. Dalam konteks doa, mendengar dapat menyiratkan perhatian dan tanggapan, tetapi implikasi itu tidak dibuat lebih eksplisit daripada teks sumber.
- source_word: וְיוֹשִׁיעֵם
  choice: dan menyelamatkan mereka
  rationale: Bentuk Hifil dari יָשַׁע berarti menyelamatkan atau melepaskan dari bahaya. “Menyelamatkan” mempertahankan keluasan makna dan gema teologisnya, sementara konteks tetap menunjuk pada pertolongan dari kesesakan.
theological_decisions:
- issue: Penerjemahan bahasa ירא tentang sikap umat yang setia
  choice: orang-orang yang takut kepada-Nya
  alternative: orang-orang yang menghormati-Nya
  rationale: Mazmur memakai istilah takut secara eksplisit untuk menggambarkan kesalehan umat. Istilah itu dipertahankan agar daya ungkap dan ketegangan teologis bahasa sumber tidak dilemahkan.
- issue: Cakupan tindakan ilahi dalam וְיוֹשִׁיעֵם
  choice: dan menyelamatkan mereka
  alternative: dan melepaskan mereka
  rationale: Verba Ibrani dapat menunjuk pada penyelamatan atau pelepasan dari kesesakan secara luas. “Menyelamatkan” mempertahankan gema kanonisnya tanpa membatasi ayat ini pada satu jenis keselamatan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme ayat dipertahankan dengan dua klausa yang ringkas. Kata ganti ilahi ditulis dengan bentuk hormat menurut kelaziman penerbitan Alkitab bahasa Indonesia. Catatan kaki hanya diberikan untuk alternatif bermakna pada וְיוֹשִׁיעֵם; alternatif bagi שַׁוְעָתָם sudah terwakili secara alami dalam frasa utama.
