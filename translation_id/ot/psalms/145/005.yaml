  yaml_path: translation/ot/psalms/145/005.yaml
  text: On the glorious splendor of your majesty[a], and on your wondrous works, I will meditate.
translation:
  language: id
  text: 'Semarak kemuliaan keagungan-Mu

    serta kisah-kisah tentang karya-Mu yang ajaib

    akan kurenungkan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan kubicarakan” atau “akan kupikirkan dalam-dalam.” Kata kerja Ibrani ini dapat mencakup baik perenungan maupun pengungkapan dengan kata-kata.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲדַר כְּבוֹד הוֹדֶךָ
  choice: Semarak kemuliaan keagungan-Mu
  rationale: Rangkaian tiga nomina ini menumpuk gambaran tentang kebesaran ilahi yang bercahaya, mulia, dan rajawi. Terjemahan ini mempertahankan daya intensif rangkaian Ibrani tanpa menjadikannya terlalu kaku dalam bahasa Indonesia.
- source_word: וְדִבְרֵי נִפְלְאוֹתֶיךָ
  choice: serta perbuatan-perbuatan-Mu yang ajaib
  rationale: Secara harfiah דִבְרֵי dapat berarti ‘perkataan/perkara-perkara tentang’, tetapi dalam konstruksi ini frasa tersebut menunjuk pada karya-karya Allah yang menakjubkan. ‘Perbuatan-perbuatan-Mu yang ajaib’ menyampaikan rujukan konkret itu secara wajar.
- source_word: אָשִׂיחָה
  choice: akan kurenungkan
  rationale: Kata kerja שׂיח dapat mencakup perenungan maupun pengungkapan dengan kata-kata. Dalam konteks ini, ‘kurenungkan’ cocok sebagai kegiatan memusatkan pikiran pada keagungan dan karya Allah, sedangkan nuansa berbicara dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Apakah tindakan pemazmur bersifat batiniah atau lisan
  choice: Teks utama memakai ‘akan kurenungkan’
  alternative: ‘akan kubicarakan’ atau ‘akan kupikirkan dalam-dalam’
  rationale: Bentuk Ibrani tidak memaksa pilihan mutlak antara perenungan batin dan tuturan. Terjemahan utama mengikuti nada reflektif ayat, dan catatan kaki mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan tiga baris menjaga keseimbangan paralel dan menempatkan kata kerja pada akhir ayat sesuai tekanan retoris teks Ibrani.
