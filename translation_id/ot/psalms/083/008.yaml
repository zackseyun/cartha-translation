source:
  edition: WLC
  text: גַּם אַ֭שּׁוּר נִלְוָ֣ה עִמָּ֑/ם הָ֤י֥וּ זְר֖וֹעַ לִ/בְנֵי ל֣וֹט סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/008.yaml
  text: Even Assyria joined with them[a]; they became an arm for the sons of Lot[b]. Selah
translation:
  language: id
  text: Bahkan Asyur bergabung dengan mereka; mereka menjadi lengan[a] bagi keturunan Lot[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lengan”; maksudnya dapat berupa kekuatan atau dukungan, khususnya dukungan militer.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Lot.” Yang dimaksud kemungkinan besar ialah bangsa-bangsa keturunan Lot, terutama Moab dan Amon.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: Bahkan
  rationale: Kata ini menegaskan bahwa Asyur pun termasuk dalam persekutuan bangsa-bangsa yang memusuhi umat Allah.
- source_word: אַשּׁוּר
  choice: Asyur
  rationale: Bentuk baku dalam bahasa Indonesia untuk nama bangsa dan wilayah geopolitik ini.
- source_word: נִלְוָה עִמָּם
  choice: bergabung dengan mereka
  rationale: Mengungkapkan makna bentuk Nifal, yaitu melekat atau menggabungkan diri dengan pihak-pihak yang telah disebutkan, tanpa mempersempitnya menjadi istilah perjanjian resmi.
- source_word: הָיוּ
  choice: mereka menjadi
  rationale: Dalam hubungan dengan predikat berikutnya, bentuk ini dapat menyatakan bahwa mereka mengambil peran sebagai penopang; terjemahan ini tetap dekat dengan konteks, meskipun 'mereka adalah' juga mungkin.
- source_word: זְרוֹעַ
  choice: lengan
  rationale: Mempertahankan metafora Ibrani tentang kekuatan atau dukungan, khususnya dukungan militer.
- source_word: לִבְנֵי לוֹט
  choice: bagi keturunan Lot
  rationale: Ungkapan harfiah 'anak-anak lelaki Lot' secara idiomatis menunjuk kepada bangsa-bangsa yang berasal dari Lot; 'keturunan' terdengar alami dan tidak membatasi rujukannya pada anak kandung langsung.
- source_word: סֶלָה
  choice: Sela
  rationale: Ditransliterasikan karena arti dan fungsi tepat istilah ini tidak dapat dipastikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'lengan' dipertahankan dalam teks utama, sedangkan idiom genealogis 'anak-anak lelaki Lot' disampaikan secara alami sebagai 'keturunan Lot'. Ambiguitas istilah 'Sela' tetap dipertahankan melalui transliterasi.
