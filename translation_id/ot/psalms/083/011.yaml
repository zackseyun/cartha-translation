  text: שִׁיתֵ֣/מוֹ נְ֭דִיבֵ/מוֹ כְּ/עֹרֵ֣ב וְ/כִ/זְאֵ֑ב וּֽ/כְ/זֶ֥בַח וּ֝/כְ/צַלְמֻנָּ֗ע כָּל נְסִיכֵֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: id
  text: Jadikanlah para bangsawan mereka seperti Oreb dan Zeeb[a], dan semua penguasa mereka seperti Zebah dan Zalmunna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oreb dan Zeeb adalah para pemimpin Midian yang dikalahkan dalam Hakim-Hakim 7:25; Zebah dan Zalmunna adalah raja-raja Midian yang dikalahkan dalam Hakim-Hakim 8:5–21.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: Jadikanlah ... mereka
  rationale: Bentuk imperatif ini ditujukan kepada Allah. Dalam susunan ayat, maknanya ialah menjadikan para pemimpin musuh seperti tokoh-tokoh yang disebut, yakni mengalami nasib serupa.
- source_word: נְדִיבֵמוֹ
  choice: para bangsawan mereka
  rationale: נָדִיב menunjuk kepada kalangan terkemuka atau pemimpin berkedudukan tinggi. 'Bangsawan' membedakannya dari נְסִיכֵמוֹ pada baris sejajar.
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: seperti Oreb dan Zeeb
  rationale: Nama diri dipertahankan melalui transliterasi; satu kata 'seperti' secara alami mencakup kedua nama dalam bahasa Indonesia.
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: seperti Zebah dan Zalmunna
  rationale: Nama para raja Midian ditransliterasikan, dan unsur perbandingan dinyatakan sekali untuk pasangan nama ini.
- source_word: כָּל נְסִיכֵמוֹ
  choice: semua penguasa mereka
  rationale: כָּל dipertahankan sebagai 'semua'. נָסִיךְ dapat berarti pemimpin, pangeran, atau penguasa; 'penguasa' terdengar alami dan mempertahankan perbedaannya dari 'bangsawan'.
theological_decisions:
- issue: Kiasan historis dalam doa penghukuman
  choice: Nama-nama itu dipertahankan sebagai tokoh sejarah yang kekalahannya menjadi pola bagi penghukuman atas musuh pada masa pemazmur.
  alternative: Nama-nama itu dipahami hanya sebagai contoh umum musuh yang telah dikalahkan.
  rationale: Oreb, Zeeb, Zebah, dan Zalmunna adalah para pemimpin Midian tertentu dalam Hakim-Hakim 7–8. Mempertahankan nama mereka menjaga seruan pemazmur kepada tindakan penyelamatan Allah pada masa lampau tanpa menambahkan tafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran imperatif '-lah' mempertahankan corak doa langsung kepada Allah. Paralelisme antara 'para bangsawan' dan 'semua penguasa' dijaga tanpa menyamakan kedua istilah Ibrani.
