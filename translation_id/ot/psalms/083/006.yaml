source:
  edition: WLC
  text: אָהֳלֵ֣י אֱ֭דוֹם וְ/יִשְׁמְעֵאלִ֗ים מוֹאָ֥ב וְ/הַגְרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/006.yaml
  text: the tents of Edom and the Ishmaelites[a], Moab and the Hagrites.
translation:
  language: id
  text: kemah-kemah Edom dan orang-orang Ismael, Moab dan orang-orang Hagri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Hagar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵי
  choice: kemah-kemah
  rationale: Bentuk jamak konstruktus dari אֹהֶל, secara harfiah berarti ‘kemah-kemah’. Ungkapan konkret puitis ini dipertahankan meskipun dapat merujuk secara metonimis kepada kaum atau kelompok yang tinggal di dalamnya.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nama diri bangsa atau wilayah dipertahankan sebagai ‘Edom’, sesuai dengan bentuk Ibrani dan konstruksi ‘kemah-kemah Edom’.
- source_word: יִשְׁמְעֵאלִים
  choice: orang-orang Ismael
  rationale: Nama kelompok etnis jamak yang berasal dari nama Ismael; bentuk ‘orang-orang Ismael’ alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: מוֹאָב
  choice: Moab
  rationale: Nama diri bangsa atau wilayah dipertahankan sebagai ‘Moab’, bukan diubah menjadi nama penduduk, agar mengikuti bentuk Ibrani dan menjaga kesejajaran daftar.
- source_word: הַגְרִים
  choice: orang-orang Hagri
  rationale: Nama kelompok ini mencerminkan bentuk konsonantal Ibrani הַגְרִים. Karena kaitannya dengan nama Hagar juga tercermin dalam tradisi penerjemahan, alternatif itu dicatat dalam catatan kaki.
theological_decisions: []
