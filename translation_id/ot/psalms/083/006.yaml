  register: Bahasa Indonesia baku, ringkas, dan puitis. Pengulangan ‘orang-orang’ memperjelas bahwa Ismael dan Hagri adalah kelompok masyarakat, sedangkan nama Edom dan Moab dipertahankan sebagaimana bentuk nama bangsa atau wilayah dalam teks Ibrani.
