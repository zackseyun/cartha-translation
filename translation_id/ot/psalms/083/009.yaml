base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/009.yaml
  text: Do to them as to Midian[a], as to Sisera, as to Jabin, at the Kishon Brook[b],
translation:
  language: id
  text: Perlakukanlah mereka seperti Midian[a], seperti Sisera, seperti Yabin, di Sungai Kison[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan memperjelas perbandingan yang tersirat, “Perlakukanlah mereka seperti yang Kaulakukan terhadap Midian.”
    reason: lexical_alternative
  - marker: b
    text: Lihat Hakim-Hakim 4:7, 13; 5:21 tentang kekalahan Sisera dan Yabin di Sungai Kison.
    reason: cross_reference
lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: Perlakukanlah mereka
  rationale: Ungkapan imperatif ini secara harfiah berarti 'lakukanlah kepada mereka'; dalam bahasa Indonesia, 'perlakukanlah mereka' menyampaikan tindakan terhadap sasaran dengan alami tanpa terlebih dahulu menjelaskan bahwa tindakan itu bersifat menghukum.
- source_word: כְּמִדְיָן
  choice: seperti Midian
  rationale: Partikel perbandingan כ diterjemahkan secara langsung sebagai 'seperti'. Elipsis Ibrani dipertahankan agar teks tidak menambahkan kata kerja yang tidak dinyatakan secara eksplisit.
- source_word: כְּסִיסְרָא כְיָבִין
  choice: seperti Sisera, seperti Yabin
  rationale: Frasa-frasa sejajar dipertahankan. Nama יָבִין ditransliterasikan 'Yabin' sesuai pelafalan Ibrani dan kebiasaan Indonesia modern.
- source_word: בְּנַחַל קִישׁוֹן
  choice: di Sungai Kison
  rationale: נַחַל dapat berarti sungai, aliran, atau wadi. 'Sungai Kison' merupakan nama geografis yang alami dan dikenal dalam bahasa Indonesia; בְּ diberi arti lokatif 'di'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Imperatif memakai akhiran -lah. Struktur perbandingan Ibrani yang ringkas dipertahankan, sedangkan catatan kaki menjelaskan kata kerja yang tersirat.
