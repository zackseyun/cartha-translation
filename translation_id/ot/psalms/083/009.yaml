  source_fidelity: Teks Indonesia dengan setia mempertahankan imperatif עֲשֵׂה לָהֶם sebagai “Perlakukanlah mereka” dan tiga perbandingan paralel dengan Midian, Sisera, dan Yabin. Elipsis kata kerja dalam frasa-frasa pembanding tidak dipaksakan menjadi tindakan tertentu dalam teks utama. “di Sungai Kison” secara wajar menerjemahkan בְּנַחַל קִישׁוֹן.
