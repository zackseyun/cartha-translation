  text: They make crafty plans against your people[a], and they consult together against your treasured ones.
translation:
  language: id
  text: 'Mereka menyusun siasat licik terhadap umat-Mu,

    dan bersama-sama berunding untuk melawan orang-orang-Mu yang tersembunyi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang kesayangan-Mu.” Ungkapan Ibrani ini dapat merujuk kepada orang-orang yang tersembunyi atau disimpan dengan aman, dan juga dapat mengandung nuansa orang-orang yang berharga bagi Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרִימוּ סוֹד
  choice: menyusun siasat licik
  rationale: Gabungan bentuk Hifil dari ערם dengan סוֹד menyatakan penyusunan rencana secara licik dan rahasia. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan sifat permusuhan dalam konteks.
- source_word: וְיִתְיָעֲצוּ
  choice: berunding bersama
  rationale: Bentuk Hitpael dari יעץ menunjukkan tindakan saling berkonsultasi; 'berunding bersama' mempertahankan unsur timbal balik tanpa memperkuatnya menjadi 'bersekongkol'.
- source_word: עַל עַמְּךָ
  choice: terhadap umat-Mu
  rationale: Dalam konteks tindakan bermusuhan, עַל menyatakan sasaran perlawanan. 'Terhadap' terdengar alami dan tidak kurang tegas daripada konteks Ibraninya.
- source_word: צְפוּנֶיךָ
  choice: orang-orang yang Kau lindungi
  rationale: Kata yang berasal dari צפן dapat menunjuk kepada orang-orang yang disembunyikan atau disimpan dengan aman. Pilihan ini menyampaikan nuansa perlindungan secara alami, sementara arti lebih harfiah dan kemungkinan nuansa 'kesayangan' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna צְפוּנֶיךָ sebagai sebutan bagi umat Allah
  choice: orang-orang yang Kau lindungi
  alternative: orang-orang-Mu yang tersembunyi; orang-orang kesayangan-Mu
  rationale: Bentuk ini dapat menekankan bahwa mereka disembunyikan atau disimpan dengan aman, dan dari gagasan sesuatu yang disimpan juga dapat timbul nuansa sesuatu yang berharga. Terjemahan utama mengutamakan makna perlindungan tanpa meniadakan kemungkinan lain, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kapitalisasi pada enklitik dalam 'umat-Mu' dan kata ganti 'Kau' menandai rujukan kepada Allah. Paralelisme dua larik dipertahankan.
