lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi seruan pemazmur dalam konteks sekitarnya.
- source_word: נוֹעֲצוּ
  choice: bersekongkol
  rationale: Bentuk Nifal dari יעץ menyatakan tindakan saling berunding atau menyusun rencana. Karena konteksnya jelas bermusuhan, “bersekongkol” menyampaikan perencanaan bersama tanpa menghilangkan unsur permufakatan.
- source_word: לֵב יַחְדָּו
  choice: dengan sehati
  rationale: Ungkapan ini mempertahankan gambaran “hati” sebagai pusat kehendak dan maksud, sekaligus menyatakan kesatuan tujuan.
- source_word: עָלֶיךָ
  choice: melawan Engkau
  rationale: Dalam konteks perundingan dan perjanjian yang bermusuhan, עַל memiliki daya adversatif. Penempatan di awal klausa mempertahankan penekanan teks Ibrani.
- source_word: בְּרִית יִכְרֹתוּ
  choice: mereka mengikat perjanjian
  rationale: Secara harfiah ungkapan Ibrani berarti “memotong perjanjian”. Idiom Indonesia “mengikat perjanjian” menyampaikan pembentukan kesepakatan resmi dengan wajar dan bermartabat.
theological_decisions:
- issue: Sifat permufakatan bangsa-bangsa terhadap Allah
  choice: melawan Engkau mereka mengikat perjanjian
  alternative: mengenai Engkau mereka mengikat perjanjian
  rationale: Konteks mazmur menunjukkan perlawanan, sehingga “melawan” tepat menyampaikan daya adversatif עַל tanpa melunakkan pemberontakan itu menjadi pembicaraan netral.
- issue: Kadar permusuhan dalam נוֹעֲצוּ
  choice: bersekongkol
  alternative: berunding bersama
  rationale: Kata dasarnya dapat menunjuk pada perundingan bersama, tetapi konteks perjanjian yang ditujukan melawan Allah mendukung makna persekongkolan. Alternatif yang lebih netral tetap dicatat agar rentang maknanya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. “Engkau” dipakai sebagai sapaan tunggal kepada Allah. Susunan “melawan Engkau” mempertahankan penekanan klausa Ibrani tanpa terasa tidak alami.
