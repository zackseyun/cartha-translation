  text: כִּֽי הִנֵּ֣ה א֭וֹיְבֶי/ךָ יֶהֱמָי֑וּ/ן וּ֝/מְשַׂנְאֶ֗י/ךָ נָ֣שְׂאוּ רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/002.yaml
  text: For look, your enemies are in an uproar, and those who hate you have lifted up their heads.
translation:
  language: id
  text: Sebab lihatlah, musuh-musuh-Mu bergemuruh, dan orang-orang yang membenci-Mu telah mengangkat kepala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Sebab lihatlah
  rationale: כִּי memberi hubungan sebab dengan ayat sebelumnya, sedangkan הִנֵּה mengarahkan perhatian secara langsung; gabungan ini dipertahankan secara alami dan khidmat.
- source_word: יֶהֱמָיוּן
  choice: bergemuruh
  rationale: Kata kerja הָמָה menggambarkan bunyi gaduh atau keributan massa. 'Bergemuruh' mempertahankan citra bunyi dan gejolak tanpa mempersempitnya menjadi sekadar kemarahan.
- source_word: נָשְׂאוּ רֹאשׁ
  choice: telah mengangkat kepala
  rationale: Ungkapan idiomatis ini menyiratkan sikap menantang, angkuh, atau bangkit melawan. Citra Ibraninya dipertahankan karena jelas dalam konteks dan tidak perlu ditafsirkan secara sempit.
theological_decisions:
- issue: Makna ungkapan 'mengangkat kepala'
  choice: Mempertahankan ungkapan harfiah 'telah mengangkat kepala'
  alternative: telah bangkit menantang-Mu
  rationale: Teks sumber menyajikan citra yang dapat mencakup keangkuhan, keberanian, dan perlawanan. Terjemahan harfiah menjaga keluasan makna serta ketegangan puitisnya.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Bentuk '-Mu' memakai huruf kapital karena rujukannya kepada Allah. Paralelisme dua baris Ibrani dipertahankan dalam satu kalimat yang lancar.
