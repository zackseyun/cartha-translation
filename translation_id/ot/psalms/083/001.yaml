  text: אֱלֹהִ֥ים אַל דֳּמִי לָ֑/ךְ אַל תֶּחֱרַ֖שׁ וְ/אַל תִּשְׁקֹ֣ט אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/001.yaml
  text: O God[a], do not be silent; do not be still[b], O God.
translation:
  language: id
  text: Ya Allah[a], janganlah tetap diam; janganlah membisu, dan janganlah tetap tenang, ya Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai dua gelar ilahi yang berbeda dalam ayat ini: אֱלֹהִים (Elohim, “Allah”) dan אֵל (El, “Allah”; mungkin juga “Yang Perkasa”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Sapaan langsung dalam doa. “Ya Allah” merupakan bentuk vokatif yang alami, khidmat, dan lazim dalam bahasa Indonesia.
- source_word: אַל
  choice: janganlah
  rationale: Partikel larangan yang menyatakan permohonan mendesak; “janganlah” mempertahankan nada doa dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: דֳּמִי לָךְ
  choice: janganlah tetap diam
  rationale: Ungkapan ini memohon agar Allah tidak terus diam atau tidak bertindak. Kata “tetap” menyampaikan nuansa keberlanjutan tanpa menghilangkan citra diam.
- source_word: תֶּחֱרַשׁ
  choice: janganlah membisu
  rationale: Dalam konteks ini verba tersebut menunjuk pada sikap diam atau tidak bersuara. “Membisu” membedakannya dari frasa sebelumnya sekaligus mempertahankan kesejajaran puitis.
- source_word: וְאַל תִּשְׁקֹט
  choice: dan janganlah tinggal tenang
  rationale: Verba שׁקט menyatakan keadaan tenang, tidak terusik, atau tidak bertindak. “Tinggal tenang” menjaga gambaran sumber dan menyiratkan permohonan agar Allah bertindak.
- source_word: אֵל
  choice: ya Allah
  rationale: Gelar ilahi kedua dipakai sebagai sapaan penutup. Dalam bahasa Indonesia, “ya Allah” alami dan jelas; perbedaan dengan אֱלֹהִים dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Pembedaan gelar ilahi אֱלֹהִים dan אֵל
  choice: Keduanya diterjemahkan “Allah” dalam sapaan langsung
  alternative: Menerjemahkan אֵל sebagai “Yang Mahakuasa” atau “Yang Perkasa”
  rationale: Kedua istilah memang berbeda, tetapi sama-sama dapat berarti “Allah” dalam konteks ini. Memakai gelar yang lebih khusus untuk אֵל dapat mempersempit nuansa yang tidak diwajibkan oleh teks; perbedaan leksikal dicatat dalam catatan kaki.
- issue: Tiga permohonan negatif dalam teks Ibrani
  choice: 'Mempertahankan ketiganya: tidak tetap diam, tidak membisu, dan tidak tinggal tenang'
  alternative: Menggabungkan atau menghilangkan salah satu ungkapan karena tumpang tindih makna
  rationale: Teks Ibrani memuat tiga verba yang membentuk intensifikasi puitis. Semuanya dipertahankan agar desakan doa dan struktur sumber tidak berkurang.
- issue: Makna תֶּחֱרַשׁ
  choice: “membisu”
  alternative: “berdiam diri” atau, berdasarkan kemungkinan leksikal lain, “menjadi tuli”
  rationale: Konteks paralel mendukung makna diam/tidak bersuara. Namun, karena bentuk yang sama dapat dikaitkan dengan ketulian dalam analisis leksikal, kemungkinan itu tidak disembunyikan dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak doa yang khidmat. Pengulangan dan tiga larangan dipertahankan untuk menjaga desakan serta kesejajaran puisi Ibrani; pilihan kata dibuat cukup alami bagi pembaca umum tanpa menghapus ketegangan leksikal.
