base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/007.yaml
  text: Gebal[a], Ammon, and Amalek[b]; Philistia with the inhabitants of Tyre.
translation:
  language: id
  text: Gebal[a], Amon, dan Amalek; Filistea[b] bersama penduduk Tirus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gebal mungkin merujuk pada kota Fenisia yang dikenal sebagai Byblos.
    reason: cultural_note
  - marker: b
    text: Atau “orang Filistin”, jika nama wilayah ini dipakai untuk menyebut penduduknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבָל
  choice: Gebal
  rationale: Nama tempat ditransliterasikan sesuai bentuk Ibrani; identifikasinya dengan kota Fenisia yang dikenal sebagai Byblos dicatat dalam catatan kaki.
- source_word: וְעַמּוֹן
  choice: Amon
  rationale: Bentuk nama bangsa atau wilayah yang lazim dalam bahasa Indonesia.
- source_word: וַעֲמָלֵק
  choice: Amalek
  rationale: Nama bangsa ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: פְּלֶשֶׁת
  choice: Filistea
  rationale: Bentuk Ibrani menunjuk pada negeri atau wilayah Filistea, bukan secara eksplisit pada orang Filistin.
- source_word: עִם
  choice: bersama
  rationale: Menghubungkan Filistea dengan penduduk Tirus secara alami sambil mempertahankan arti preposisi Ibrani.
- source_word: יֹשְׁבֵי צֽוֹר
  choice: penduduk Tirus
  rationale: Ungkapan konstruksi ini secara harfiah berarti orang-orang yang mendiami Tirus; 'penduduk Tirus' ringkas dan alami dalam bahasa Indonesia modern.
- source_word: צֽוֹר
  choice: Tirus
  rationale: Bentuk baku nama tempat ini dalam tradisi Alkitab bahasa Indonesia.
