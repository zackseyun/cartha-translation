source:
  edition: WLC
  text: כֵּ֭ן תִּרְדְּפֵ֣/ם בְּ/סַעֲרֶ֑/ךָ וּ/בְ/סוּפָתְ/ךָ֥ תְבַהֲלֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/015.yaml
  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: id
  text: Demikianlah, kejarlah mereka dengan badai-Mu[a], dan gentarkanlah mereka dengan angin topan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: dalam badai-Mu.'
    reason: Preposisi Ibrani ב dapat dipahami secara instrumental ('dengan') atau lokatif ('dalam') dalam konteks ini.
lexical_decisions:
- source_word: כֵּן
  choice: Demikianlah
  rationale: Menghubungkan permohonan ini dengan gambaran pada ayat sebelumnya dan menyatakan cara yang dikehendaki; bentuk ini alami sekaligus puitis dalam bahasa Indonesia.
- source_word: תִּרְדְּפֵם
  choice: kejarlah mereka
  rationale: Kata רדף berarti mengejar atau memburu. 'Kejarlah mereka' mempertahankan daya militer dan puitisnya tanpa konotasi sempit yang dapat muncul pada 'aniayalah'.
- source_word: בְּסַעֲרֶךָ
  choice: dengan badai-Mu
  rationale: סַעַר menunjuk pada badai atau cuaca bergolak. 'Dengan' membaca preposisi ב sebagai sarana tindakan, sementara kemungkinan makna lokatif dicatat dalam catatan kaki.
- source_word: וּבְסוּפָתְךָ
  choice: dengan angin topan-Mu
  rationale: סוּפָה menunjuk pada badai dahsyat atau angin topan. Pilihan ini mempertahankan intensifikasi dan membedakannya dari סַעַר pada baris sebelumnya.
- source_word: תְבַהֲלֵם
  choice: gentarkanlah mereka
  rationale: Bentuk piel dari בהל menyatakan tindakan menyebabkan kegentaran, kepanikan, atau ketakutan. 'Gentarkanlah' ringkas, kuat, dan sesuai dengan register puisi doa.
theological_decisions:
- issue: Tindakan ilahi dalam puisi kutukan
  choice: Mempertahankan permohonan langsung agar Allah mengejar dan menggentarkan para musuh.
  alternative: Kiranya Engkau mengejar mereka dengan badai-Mu dan membuat mereka gentar dengan angin topan-Mu.
  rationale: Bentuk imperfek Ibrani dalam konteks doa ini berfungsi sebagai permohonan bernuansa jusif. Akhiran '-lah' dalam bahasa Indonesia dapat menyampaikan permohonan langsung kepada Allah tanpa mengubahnya menjadi ramalan atau melunakkan seruan akan penghakiman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Sapaan ilahi ditandai dengan huruf kapital pada akhiran posesif '-Mu'. Paralelisme dua baris dipertahankan melalui 'badai-Mu' dan 'angin topan-Mu'.
