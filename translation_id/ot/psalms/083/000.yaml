lexical_decisions:
- source_word: שִׁיר
  choice: Nyanyian
  rationale: Nomina ini menunjuk pada lagu atau gubahan yang dinyanyikan. “Nyanyian” merupakan padanan Indonesia yang alami dan sesuai sebagai penanda jenis karya dalam judul mazmur.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah teknis dalam judul-judul Kitab Mazmur ini paling tepat diterjemahkan “mazmur”, sesuai makna jenis karya dan pemakaiannya yang sudah mapan dalam bahasa Indonesia.
- source_word: לְ/אָסָף
  choice: Asaf
  rationale: Preposisi לְ dapat menandai kepengarangan, keterkaitan, atau peruntukan. Bentuk ringkas “Mazmur Asaf” alami dalam judul bahasa Indonesia dan tidak memutuskan secara berlebihan jenis hubungan antara mazmur ini dan Asaf.
