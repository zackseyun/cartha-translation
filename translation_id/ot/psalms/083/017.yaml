id: PSA.83.17
reference: Psalms 83:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יֵבֹ֖שׁוּ וְ/יִבָּהֲל֥וּ עֲדֵי עַ֗ד וְֽ/יַחְפְּר֥וּ וְ/יֹאבֵֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/017.yaml
  text: Let them be put to shame and be terrified forever[a]; let them be disgraced and perish.
translation:
  language: id
  text: Biarlah mereka dipermalukan dan diliputi ketakutan untuk selama-lamanya[a]; biarlah mereka mendapat aib dan binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “biarlah mereka menjadi malu ... biarlah mereka dihina”; bahasa Ibrani memakai dua kata yang berdekatan maknanya untuk rasa malu dan kehinaan (בוש, חפר), dengan nuansa yang sedikit berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: biarlah mereka dipermalukan
  rationale: Bentuk Qal imperfek orang ketiga jamak dari בוש dalam rangkaian yang menyatakan permohonan atau kutukan. “Dipermalukan” menyampaikan keadaan tercela atau malu sebagai akibat, sekaligus mempertahankan daya jussif melalui “biarlah”.
- source_word: וְיִבָּהֲלוּ
  choice: dan diliputi ketakutan
  rationale: Bentuk Nifal imperfek orang ketiga jamak dari בהל menyatakan keadaan gentar, kacau, atau sangat takut. “Diliputi ketakutan” alami dalam bahasa Indonesia dan cukup kuat untuk konteks penghakiman ini.
- source_word: עֲדֵי עַד
  choice: untuk selama-lamanya
  rationale: Ungkapan idiomatis yang menegaskan durasi tanpa akhir. “Untuk selama-lamanya” mempertahankan penekanan tersebut dan cocok dengan laras mazmur.
- source_word: וְיַחְפְּרוּ
  choice: biarlah mereka mendapat aib
  rationale: חפר bertumpang tindih dengan בוש dalam ranah malu dan kehinaan. “Mendapat aib” menjaga nuansa kehinaan yang berkaitan erat namun tidak mengulang “dipermalukan” secara datar.
- source_word: וְיֹאבֵדוּ
  choice: dan binasa
  rationale: Qal imperfek orang ketiga jamak dari אבד berarti binasa atau musnah. “Binasa” mempertahankan keluasan makna tanpa menentukan cara kebinasaan.
theological_decisions:
- issue: Daya imprekatoris bentuk-bentuk imperfek
  choice: Menerjemahkannya sebagai permohonan jussif dengan “biarlah”
  alternative: Mereka akan dipermalukan dan diliputi ketakutan untuk selama-lamanya; mereka akan mendapat aib dan binasa.
  rationale: Dalam konteksnya, bentuk-bentuk ini berfungsi sebagai doa atau harapan terhadap musuh Allah, bukan semata-mata ramalan masa depan. “Biarlah” mempertahankan daya permohonan teks tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras doa yang khidmat. Paralelisme Ibrani dipertahankan, sementara pengulangan “biarlah” menandai dua bagian utama ayat secara alami.
