id: PSA.83.16
reference: Psalms 83:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַלֵּ֣א פְנֵי/הֶ֣ם קָל֑וֹן וִֽ/יבַקְשׁ֖וּ שִׁמְ/ךָ֣ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/016.yaml
  text: Fill their faces with shame[a], that they may seek your name, O Yahweh.
translation:
  language: id
  text: Penuhilah wajah mereka dengan kehinaan[a], supaya mereka mencari nama-Mu, ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan biarlah mereka mencari nama-Mu”; kata kerja Ibrani dapat dipahami sebagai kelanjutan sederhana, meskipun di sini kemungkinan besar menyatakan tujuan atau hasil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Penuhilah
  rationale: Bentuk perintah piel orang kedua tunggal dari מלא, ditujukan kepada Allah. “Penuhilah” mempertahankan gambaran Ibrani secara langsung dan tetap wajar dalam ungkapan ini.
- source_word: פְנֵיהֶם
  choice: wajah mereka
  rationale: Bentuk jamak berkonstruksi dengan akhiran orang ketiga jamak maskulin. Bahasa Indonesia secara alami memakai nomina kolektif tunggal “wajah mereka” sambil mempertahankan gambaran kehinaan yang tampak.
- source_word: קָלוֹן
  choice: kehinaan
  rationale: Kata ini menunjuk pada aib, kehinaan, atau keadaan dipermalukan. “Kehinaan” cocok dengan konstruksi “penuhi wajah” dan mencakup baik rasa malu maupun aib yang tampak.
- source_word: וִיבַקְשׁוּ
  choice: supaya mereka mencari
  rationale: Bentuk imperfek orang ketiga jamak dengan waw sesudah sebuah perintah dapat menyatakan tujuan atau hasil. “Supaya” menyampaikan nuansa yang paling mungkin tanpa menyatakan bahwa pencarian itu pasti terjadi.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Terjemahan langsung yang mempertahankan cakupan alkitabiah mengenai identitas, reputasi, dan penyataan diri Allah tanpa mempersempit maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga mempertahankan nama pribadi dalam teks sumber.
theological_decisions:
- issue: Tujuan penghukuman ilahi
  choice: Kehinaan yang dimohonkan dipahami sebagai mengarah pada tujuan agar para musuh mencari nama Yahweh.
  alternative: 'Klausa itu dapat dibaca sebagai kelanjutan sederhana: “dan biarlah mereka mencari nama-Mu.”'
  rationale: Imperfek berawalan waw setelah bentuk perintah lazim dapat menyatakan tujuan atau hasil. Terjemahan ini mempertahankan ketegangan bahwa penghukuman diarahkan pada pengakuan akan Allah, tanpa mengubahnya menjadi kepastian pertobatan.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan khidmat. Bentuk “Penuhilah” mempertahankan citra puitis Ibrani; “ya Yahweh” memberi sapaan yang alami. Kapitalisasi pronomina ilahi dipakai sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
