  text: They say[a], “Come, let us wipe them out as a nation, so that the name of Israel will be remembered no more.”
translation:
  language: id
  text: Mereka berkata, “Mari, kita lenyapkan mereka agar tidak lagi menjadi suatu bangsa, supaya nama Israel tidak diingat lagi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמְרוּ
  choice: Mereka berkata
  rationale: Bentuk perfek Qal orang ketiga jamak dapat menunjuk pada perkataan yang telah diucapkan; dalam konteks puisi, bentuk Indonesia ini juga wajar untuk melaporkan tekad para musuh tanpa memaksakan aspek waktu yang lebih khusus.
- source_word: לְכוּ
  choice: Mari
  rationale: Imperatif jamak dari הלך dipakai secara idiomatis sebagai ajakan. “Mari” secara alami membuka usulan bersama dalam bahasa Indonesia.
- source_word: וְנַכְחִידֵם
  choice: kita musnahkan mereka
  rationale: Bentuk Hifil orang pertama jamak dengan sufiks objek menyatakan tindakan menyebabkan mereka lenyap atau tidak ada lagi. “Musnahkan” mempertahankan kekuatan dan cakupan total ungkapan Ibrani.
- source_word: מִגּוֹי
  choice: sebagai suatu bangsa
  rationale: Preposisi מִן bersama גּוֹי menyatakan penyingkiran dari keberadaan sebagai bangsa; pilihan ini menyampaikan tujuan agar Israel tidak lagi ada sebagai suatu kelompok bangsa.
- source_word: וְלֹא יִזָּכֵר
  choice: supaya ... tidak diingat lagi
  rationale: Nifal imperfek dari זכר menyatakan ‘diingat’ atau ‘disebut’. “Supaya” mengungkapkan hubungan tujuan yang tersirat dalam konteks, sedangkan bentuk pasif tetap dipertahankan.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: nama Israel
  rationale: Rangkaian konstruksi ini diterjemahkan langsung dan mempertahankan ungkapan alkitabiah tentang nama sebagai identitas dan keberadaan yang dikenal.
- source_word: עוֹד
  choice: lagi
  rationale: Dalam klausa negatif, עוֹד berarti ‘tidak lagi’ atau ‘tidak ... lebih lama’; “tidak diingat lagi” adalah ungkapan Indonesia yang alami dan ringkas.
