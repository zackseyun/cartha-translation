  verdict: revise
  source_fidelity: Ungkapan מִגּוֹי menyatakan penghapusan Israel dari status/keberadaannya sebagai bangsa. Terjemahan draf “musnahkan mereka sebagai suatu bangsa” dapat dipahami sebagai memusnahkan mereka secara kolektif sebagai bangsa, tetapi tidak menyatakan dengan cukup jelas sasaran “agar tidak lagi menjadi bangsa.” Klausa terakhir dan bentuk pasif “tidak diingat lagi” sudah setia pada וְלֹא יִזָּכֵר ... עוֹד.
  naturalness: Kalimat draf pada umumnya baku dan alami. Revisi kecil membuat hubungan tujuan dalam “dari/berhenti menjadi suatu bangsa” lebih eksplisit tanpa mengorbankan kelancaran.
  terminology: “Israel,” “nama Israel,” “Mari,” dan “tidak diingat lagi” tepat untuk register puitis baku modern. “Lenyapkan” secara idiomatis menyampaikan daya hapus total dari כחד.
