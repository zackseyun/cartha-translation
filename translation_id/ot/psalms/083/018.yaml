  text: וְֽ/יֵדְע֗וּ כִּֽי אַתָּ֬ה שִׁמְ/ךָ֣ יְהוָ֣ה לְ/בַדֶּ֑/ךָ עֶ֝לְי֗וֹן עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/018.yaml
  text: Let them know that you alone[a], whose name is Yahweh[b], are the Most High over all the earth.
translation:
  language: id
  text: Biarlah mereka tahu bahwa Engkau—yang nama-Mu Yahweh—sajalah Yang Mahatinggi atas seluruh bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; juga ditransliterasikan “Yehovah” atau “Jehovah” dan secara tradisional diganti dengan “TUHAN”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Biarlah mereka tahu
  rationale: Bentuk imperfek dengan waw melanjutkan konteks permohonan pada ayat sebelumnya; ungkapan volitif ini alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Memperkenalkan isi yang harus mereka ketahui, bukan alasan sebab-akibat.
- source_word: שִׁמְךָ יְהוָה
  choice: yang nama-Mu Yahweh
  rationale: Konstruksi aposisional Ibrani mengidentifikasi pihak yang disapa melalui nama ilahi; klausa relatif mempertahankan hubungan itu secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasi nama ilahi mempertahankan nama pribadi yang terdapat langsung dalam teks sumber, alih-alih menggantinya dengan gelar.
- source_word: לְבַדֶּךָ
  choice: hanya Engkau
  rationale: Menegaskan eksklusivitas pihak yang disapa; penempatan sebelum klausa nama mempertahankan tekanan tersebut.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Gelar ilahi yang menyatakan kedudukan tertinggi; bentuk ini baku, bermartabat, dan mudah dipahami dalam bahasa Indonesia.
- source_word: עַל כָּל הָאָרֶץ
  choice: atas seluruh bumi
  rationale: עַל menyatakan kekuasaan atau keunggulan atas, sedangkan הָאָרֶץ dalam konteks ini berskala universal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar, sementara catatan kaki menyajikan bentuk Ibrani serta varian tradisional.
- issue: Cakupan eksklusivitas לְבַדֶּךָ
  choice: hanya Engkau ... Yang Mahatinggi
  alternative: Engkau sendiri ... adalah Yang Mahatinggi
  rationale: Bahasa Ibrani menegaskan bahwa pihak yang disapa sajalah Yang Mahatinggi. Susunan terjemahan mempertahankan tekanan ini tanpa menentukan secara berlebihan apakah kata tersebut terutama melekat pada subjek atau predikat.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada doa yang khidmat. Kapitalisasi kata ganti ilahi dipakai sebagai konvensi penghormatan Indonesia. Susunan kalimat menjaga penekanan Ibrani pada eksklusivitas, tetapi tetap wajar bagi pembaca umum.
