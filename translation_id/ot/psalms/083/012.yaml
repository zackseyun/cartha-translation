  text: אֲשֶׁ֣ר אָ֭מְרוּ נִ֣ירֲשָׁה לָּ֑/נוּ אֵ֝֗ת נְא֣וֹת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/012.yaml
  text: who said[a], “Let us take possession for ourselves of the pastures of God.”
translation:
  language: id
  text: yang berkata, “Mari kita rebut bagi diri kita sendiri padang-padang rumput milik Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat-tempat kediaman Allah” atau “tempat-tempat tinggal Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: yang berkata
  rationale: Klausa relatif ini merujuk kembali kepada para musuh dalam konteks sebelumnya; bentuk lampau Ibrani diterjemahkan secara wajar dengan "berkata".
- source_word: נִירֲשָׁה
  choice: Mari kita rebut
  rationale: Bentuk kohortatif dari ירשׁ menyatakan ajakan untuk mengambil alih atau memiliki. Dalam konteks permusuhan dan penaklukan, "rebut" menyampaikan unsur pengambilalihan tanpa memberi kesan pewarisan yang damai.
- source_word: לָּנוּ
  choice: bagi diri kita sendiri
  rationale: Preposisi dengan pronomina orang pertama jamak menandai kepentingan dan kepemilikan pihak pembicara; ungkapan ini mempertahankan penekanannya.
- source_word: נְאוֹת
  choice: padang-padang rumput
  rationale: Kata ini dapat berarti padang rumput, tempat kediaman, atau tempat tinggal. Pilihan ini mempertahankan gambaran konkret Ibrani, sedangkan kemungkinan makna lainnya dicatat dalam catatan kaki.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks mazmur ini, bentuk tersebut merujuk kepada Allah Israel dan karena itu diterjemahkan tunggal.
theological_decisions:
- issue: Makna נְאוֹת אֱלֹהִים
  choice: padang-padang rumput milik Allah
  alternative: tempat-tempat kediaman Allah; tempat-tempat tinggal Allah
  rationale: Frasa ini dapat menunjuk pada tanah penggembalaan yang menjadi milik Allah atau pada tempat-tempat kediaman-Nya. Teks utama mempertahankan citra pastoral, sementara catatan kaki menjaga ambiguitas leksikalnya dan tidak membatasinya pada tempat suci tertentu.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. "Mari kita rebut" terdengar alami sebagai ucapan musuh dalam konteks penaklukan; pengulangan jamak pada "padang-padang rumput" mempertahankan bentuk jamak sumber.
