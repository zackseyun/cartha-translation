  yaml_path: translation/ot/psalms/083/013.yaml
  text: My God[a], make them like whirling dust[b], like chaff before the wind.
translation:
  language: id
  text: Ya Allahku, jadikanlah mereka seperti benda yang berputar[a], seperti jerami[b] di hadapan angin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti roda” atau “seperti sesuatu yang bergulir.” Kata Ibrani גַּלְגַּל dapat menunjuk pada roda atau pada sesuatu yang bergulir atau berputar. Dalam konteks ini, referen tepatnya tidak pasti; gambaran paralelnya ialah sesuatu yang mudah digerakkan angin.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani קַשׁ menunjuk pada jerami atau sisa batang tanaman. Gambaran “di hadapan angin” menekankan bahwa bahan itu mudah diterbangkan.
    reason: lexical_clarification
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Ya Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal merupakan sapaan langsung, “Allahku.” Partikel “Ya” membuat fungsi vokatifnya jelas dan wajar dalam doa bahasa Indonesia tanpa mengubah isi sapaan.
- source_word: שִׁיתֵמוֹ
  choice: jadikanlah mereka
  rationale: Dalam konteks dua perbandingan berikutnya, verba imperatif ini meminta Allah membuat mereka menjadi seperti sesuatu. “Jadikanlah mereka” alami dalam bahasa Indonesia dan mempertahankan bentuk permohonan.
- source_word: כַגַּלְגַּל
  choice: seperti debu yang berpusar
  rationale: גַּלְגַּל dapat menunjuk pada roda atau sesuatu yang bergulir dan berputar. Dalam paralel dengan jerami yang diterpa angin, “debu yang berpusar” menyampaikan gambaran benda ringan yang berputar dan terserak, sementara kemungkinan arti harfiahnya dicatat dalam catatan kaki.
- source_word: כְּקַשׁ
  choice: seperti jerami
  rationale: קַשׁ terutama menunjuk pada jerami atau sisa batang tanaman, bukan istilah Ibrani yang paling lazim untuk sekam. “Jerami” mempertahankan rujukan pertanian dan tetap cocok dengan gambaran bahan ringan di hadapan angin.
- source_word: לִפְנֵי רוּחַ
  choice: di hadapan angin
  rationale: Ungkapan ini secara harfiah berarti “di hadapan angin” dan secara puitis menggambarkan sesuatu yang terdorong atau diterbangkan angin. Terjemahan ini menjaga bentuk gambaran Ibrani.
