translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. “Dibinasakan” mempertahankan kekuatan verba Ibrani, sedangkan “pupuk bagi tanah” menjaga citra konkret tanpa terdengar janggal bagi pembaca umum.
