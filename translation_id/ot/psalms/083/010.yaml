  text: They were destroyed at En-dor[b][a]; they became dung for the ground.
translation:
  language: id
  text: Mereka dibinasakan di En-Dor[a]; mereka menjadi kotoran bagi tanah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam En-Dor” atau “di dekat En-Dor.” Preposisi Ibrani yang menyertai nama tempat ini dapat menunjukkan beberapa macam hubungan lokasi.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka menjadi kotoran di atas tanah.” Secara harfiah, teks Ibrani berbunyi “mereka menjadi kotoran bagi tanah,” sebuah gambaran tentang mayat-mayat yang menjadi kotoran atau pupuk kandang.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְדוּ
  choice: dibinasakan
  rationale: Bentuk Nifal perfektum orang ketiga jamak dari שׁמד menyatakan bahwa mereka dihancurkan atau dilenyapkan. “Dibinasakan” mempertahankan makna pasif dan hasil akhirnya tanpa menambah rincian.
- source_word: בְּעֵין דֹּאר
  choice: di En-Dor
  rationale: Nama tempat עֵין דֹּאר didahului preposisi lokatif בְּ. “Di En-Dor” alami dalam bahasa Indonesia dan tidak mempersempit makna menjadi tepat di dalam atau di dekat tempat itu.
- source_word: הָיוּ
  choice: menjadi
  rationale: Dalam konstruksi dengan nomina predikatif, היה dapat menyatakan perubahan atau keadaan yang dihasilkan. “Menjadi” mencerminkan nuansa tersebut.
- source_word: דֹּמֶן
  choice: pupuk
  rationale: דֹּמֶן berarti kotoran atau pupuk kandang. Dalam hubungan dengan tanah, “pupuk” menyampaikan gambaran jasad yang menjadi bahan penyubur tanah secara alami dan tetap kuat.
- source_word: לָאֲדָמָה
  choice: bagi tanah
  rationale: אֲדָמָה menunjuk pada tanah, sedangkan prefiks לְ menyatakan hubungan atau hasil. “Bagi tanah” mempertahankan bentuk gambaran Ibrani lebih dekat daripada mengubahnya menjadi lokasi semata.
