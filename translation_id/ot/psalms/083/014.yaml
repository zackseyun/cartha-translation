  yaml_path: translation/ot/psalms/083/014.yaml
  text: As fire burns a forest[a], and as a flame sets the mountains ablaze,
translation:
  language: id
  text: Seperti api membakar hutan, dan seperti nyala api menghanguskan gunung-gunung,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Seperti api membakar hutan dan nyala api membakar gunung-gunung.”'
