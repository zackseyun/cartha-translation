lexical_decisions:
- source_word: כְּ/אֵשׁ
  choice: Seperti api
  rationale: Prefiks כ menandai perbandingan; “seperti api” merupakan ungkapan simile yang alami dalam bahasa Indonesia.
- source_word: תִּבְעַר
  choice: membakar
  rationale: Bentuk Qal dari בער di sini menggambarkan tindakan api atas hutan; “membakar” menyampaikan makna langsung tanpa melebihkan gagasan pemusnahan.
- source_word: יָעַר
  choice: hutan
  rationale: Kata ini berarti “hutan” atau kawasan berhutan; bentuk tanpa penentu terdengar alami dalam simile umum bahasa Indonesia.
- source_word: וּכְ/לֶהָבָה
  choice: dan seperti nyala api
  rationale: Konjungsi dan prefiks perbandingan memperkenalkan baris sejajar; “nyala api” mempertahankan citra puitis yang konkret.
- source_word: תְּלַהֵט
  choice: menghanguskan
  rationale: Bentuk Piel dari להט menyatakan pembakaran yang kuat; “menghanguskan” membedakannya dari verba pada baris pertama dan mempertahankan intensitasnya.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak הָרִים berarti “gunung-gunung”; reduplikasi menyatakan jamak secara jelas dan alami, sedangkan artikel Ibrani tidak perlu selalu dinyatakan dalam bahasa Indonesia.
