base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/002.yaml
  text: May he judge your people with righteousness[b][a], and your afflicted ones with justice.
translation:
  language: id
  text: Kiranya ia menghakimi[a] umat-Mu dengan kebenaran, dan orang-orang-Mu yang tertindas[b] dengan keadilan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia akan menghakimi umat-Mu dengan kebenaran.” Bentuk imperfek Ibrani dalam konteks ini dapat dipahami sebagai harapan (“Kiranya ia menghakimi”) atau sebagai pernyataan tentang masa depan.
    reason: alternative_reading
  - marker: b
    text: Atau, “orang-orang-Mu yang miskin” atau “orang-orang-Mu yang membutuhkan.” Kata Ibrani ini dapat menunjuk kepada orang miskin, menderita, atau tertindas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִין
  choice: Kiranya ia menghakimi
  rationale: Bentuk imperfek Qal orang ketiga tunggal maskulin dapat bernuansa harapan/permohonan atau menyatakan masa depan. Dalam konteks doa kerajaan Mazmur 72, bentuk harapan paling sesuai, sementara kemungkinan makna futur tetap dicatat dalam catatan kaki.
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: Kata עַם dengan akhiran orang kedua tunggal berarti 'umat-Mu'. 'Umat' alami dalam konteks perjanjian dan kerajaan serta mempertahankan pengertian kolektif.
- source_word: בְצֶדֶק
  choice: dengan kebenaran
  rationale: צֶדֶק mencakup kebenaran, kelurusan, dan keadilan. 'Dengan kebenaran' mempertahankan dimensi moral cara raja menghakimi sekaligus membedakannya dari מִשְׁפָּט pada baris sejajar.
- source_word: וַעֲנִיֶּיךָ
  choice: dan orang-orang-Mu yang tertindas
  rationale: עָנִי dapat menunjuk kepada orang miskin, membutuhkan, menderita, atau tertindas. 'Yang tertindas' menyampaikan kerentanan dan penderitaan sosial tanpa membatasinya semata-mata pada keadaan ekonomi; alternatifnya dicatat dalam catatan kaki.
- source_word: בְמִשְׁפָּט
  choice: dengan keadilan
  rationale: מִשְׁפָּט di sini menunjuk pada keputusan atau pelaksanaan hukum yang adil. 'Dengan keadilan' jelas dalam bahasa Indonesia modern dan membentuk kesejajaran yang wajar dengan 'dengan kebenaran'.
theological_decisions:
- issue: Nuansa volitif atau prediktif pada kata kerja imperfek pembuka dalam doa kerajaan
  choice: Kiranya ia menghakimi
  alternative: Ia akan menghakimi
  rationale: Konteks pembukaan Mazmur 72 mendukung pembacaan sebagai permohonan atau berkat bagi raja. Namun, karena bentuk Ibraninya juga dapat dibaca secara futur/prediktif, alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina -Mu dipakai untuk rujukan kepada Allah. Struktur paralel puisi Ibrani dipertahankan dengan pasangan 'dengan kebenaran' dan 'dengan keadilan'.
