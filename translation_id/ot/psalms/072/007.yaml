  text: יִֽפְרַח בְּ/יָמָ֥י/ו צַדִּ֑יק וְ/רֹ֥ב שָׁ֝ל֗וֹם עַד בְּלִ֥י יָרֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
translation:
  language: id
  text: Pada zamannya, orang benar akan berkembang[a], dan damai sejahtera akan berlimpah[b] sampai bulan tidak ada lagi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Orang benar” berbentuk tunggal dalam bahasa Ibrani. Ungkapan ini dapat berarti orang-orang benar secara kolektif, atau satu orang benar, mungkin sang raja.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “damai sejahtera” juga mencakup kesejahteraan, keutuhan, dan kemakmuran.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “sampai tidak ada bulan,” suatu ungkapan puitis tentang masa yang berlangsung sangat lama.
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרַח
  choice: akan berkembang
  rationale: Verba פרח menggambarkan bertunas, berbunga, atau tumbuh subur. Dalam konteks orang benar, “akan berkembang” mempertahankan metafora pertumbuhan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בְּיָמָיו
  choice: Pada zamannya
  rationale: Frasa ini menunjuk pada masa pemerintahan raja dalam konteks mazmur kerajaan. “Pada zamannya” dekat dengan bentuk Ibrani dan wajar dalam bahasa Indonesia.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Bentuknya tunggal dan dapat menunjuk kepada satu orang benar atau dipakai secara representatif/kolektif. Bahasa Indonesia “orang benar” mempertahankan bentuk tunggal serta ambiguitas tersebut tanpa memaksakan identifikasi.
- source_word: וְרֹב שָׁלוֹם
  choice: dan damai sejahtera akan berlimpah
  rationale: רֹב menyatakan kelimpahan. Susunan ini mengungkapkan klausa nominal Ibrani secara alami, sedangkan “damai sejahtera” menangkap cakupan שָׁלוֹם yang lebih luas daripada sekadar ketiadaan konflik.
- source_word: עַד בְּלִי יָרֵחַ
  choice: sampai bulan tidak ada lagi
  rationale: Terjemahan ini dekat dengan ungkapan harfiah Ibrani dan mempertahankan citra puitis tentang masa yang amat panjang tanpa mengubahnya menjadi penjelasan interpretatif.
theological_decisions:
- issue: Cakupan צַדִּיק dalam mazmur kerajaan
  choice: “orang benar,” dengan bentuk tunggal yang tetap terbuka bagi pengertian representatif atau kolektif
  alternative: “orang-orang benar” secara eksplisit kolektif, atau “sang benar” yang mungkin merujuk kepada raja
  rationale: Teks Ibrani memakai bentuk tunggal substantival. Karena bentuk itu dapat dipahami secara individual maupun representatif, terjemahan utama mempertahankan ketegangan tersebut dan catatan kaki menjelaskan kemungkinan kolektif atau rujukan kepada raja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan struktur yang mudah dipahami. “Damai sejahtera” dipilih sebagai ungkapan Alkitabiah yang masih umum dan mencakup keluasan makna שָׁלוֹם. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
