  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: id
  text: Semoga ia hidup, dan semoga emas dari Syeba diberikan kepadanya.[a] Semoga doa senantiasa dipanjatkan baginya; sepanjang hari semoga ia diberkati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan semoga ia memberikan kepadanya emas dari Syeba.” Kata kerja Ibraninya aktif, tetapi siapa yang memberikan tidak disebutkan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau, dengan bentuk aktif: “semoga orang berdoa baginya senantiasa; sepanjang hari semoga mereka memberkatinya.” Teks Ibrani tidak menyatakan secara eksplisit siapa pelaku doa; pada klausa terakhir bentuknya dapat menyatakan pelaku jamak atau tak tentu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: Semoga ia hidup
  rationale: Bentuk yiqtol berdaya jusif dari חיה menyatakan harapan atau berkat, bukan semata-mata masa depan. “Semoga ia hidup” menyampaikan daya volitif itu secara wajar.
- source_word: וְיִתֶּן לוֹ
  choice: dan semoga ... diberikan kepadanya
  rationale: Bentuk Ibrani bersifat aktif dan subjeknya tidak dinyatakan. Bentuk pasif Indonesia mempertahankan ketidakjelasan pelaku tanpa memaksakan subjek tertentu.
- source_word: מִזְּהַב שְׁבָא
  choice: emas dari Syeba
  rationale: Konstruksi dengan מִן secara alami menunjukkan asal dalam konteks pemberian upeti; “dari Syeba” jelas dan mempertahankan kaitan geografis.
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: Semoga doa ... dipanjatkan baginya
  rationale: Hitpael פלל dengan בְּעַד berarti berdoa bagi atau demi seseorang. Pasif dipakai karena subjek gramatikal bentuk orang ketiga tunggal itu tidak disebutkan.
- source_word: תָמִיד
  choice: senantiasa
  rationale: תָמִיד menyatakan keberlangsungan atau keteraturan yang terus-menerus; “senantiasa” sesuai dengan ragam puisi yang bermartabat.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini merupakan padanan Indonesia yang alami untuk keseluruhan rentang hari.
- source_word: יְבָרֲכֶנְהוּ
  choice: semoga ia diberkati
  rationale: Bentuk Piel orang ketiga tunggal dengan akhiran objek maskulin tunggal secara harfiah berarti “semoga ia memberkatinya”; pasif mempertahankan objek sang raja sekaligus tidak menetapkan siapa pelakunya.
theological_decisions:
- issue: Rujukan permohonan kerajaan dalam Mazmur 72
  choice: Ayat diterjemahkan sebagai harapan atau doa bagi sang raja tanpa menambahkan penafsiran mesianik secara eksplisit.
  alternative: Menerjemahkannya langsung sebagai nubuat tentang Mesias.
  rationale: Makna langsung bahasa Ibrani ialah serangkaian permohonan bagi raja. Terjemahan ini tidak menutup kemungkinan pembacaan kanonik atau mesianik yang lebih luas, tetapi tidak memasukkannya ke dalam teks.
- issue: Pelaku pemberian, doa, dan berkat
  choice: Pelaku dibiarkan tidak disebutkan melalui konstruksi pasif.
  alternative: Menambahkan subjek tak tentu “orang” atau menetapkan sang raja sebagai pelaku.
  rationale: Bentuk-bentuk Ibrani bersifat aktif, tetapi konteks tidak menyebutkan subjeknya secara eksplisit. Konstruksi pasif menjaga ketaktertentuan itu tanpa menyelesaikan ambiguitas secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. “Semoga” mempertahankan corak permohonan; “senantiasa” dan “dipanjatkan” menjaga keluhuran register tanpa menjadi kuno. Bentuk pasif digunakan secara idiomatis untuk mempertahankan pelaku yang tidak disebutkan dalam bahasa Ibrani.
