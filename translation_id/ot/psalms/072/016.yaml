  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: id
  text: Kiranya ada kelimpahan gandum di negeri[a]; di puncak-puncak gunung kiranya hasilnya bergelombang seperti Libanon; dan kiranya penduduk kota tumbuh subur seperti rumput di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segenggam gandum di negeri.” Frasa Ibraninya langka dan dapat menekankan sedikit gandum yang menghasilkan panen luar biasa, atau sekadar kelimpahan gandum.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Kiranya ada
  rationale: Bentuk yusif dari היה menyatakan harapan atau doa; ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: פִסַּת בַּר
  choice: kelimpahan gandum
  rationale: Frasa langka ini diperdebatkan. Dalam konteks kemakmuran yang luar biasa, 'kelimpahan gandum' paling sesuai, sementara arti harfiah/tradisional lainnya dicatat dalam catatan kaki.
- source_word: בָּאָרֶץ
  choice: di negeri ini
  rationale: Dalam mazmur kerajaan ini, kata tersebut terutama menunjuk pada wilayah yang berada di bawah pemerintahan raja, bukan seluruh bumi.
- source_word: בְּרֹאשׁ הָרִים
  choice: di puncak-puncak gunung
  rationale: Menerjemahkan idiom Ibrani secara langsung dan menonjolkan kesuburan bahkan di tempat yang tidak lazim untuk pertanian.
- source_word: יִרְעַשׁ ... פִּרְיוֹ
  choice: hasilnya bergelombang
  rationale: Kata kerja berarti berguncang atau bergetar; dalam gambaran tanaman, 'bergelombang' secara alami menggambarkan hasil panen yang bergerak ditiup angin.
- source_word: כַּלְּבָנוֹן
  choice: seperti Lebanon
  rationale: Perbandingan dengan Lebanon dipertahankan tanpa menafsirkan lebih jauh kemegahan atau kesuburannya.
- source_word: וְיָצִיצוּ מֵעִיר
  choice: penduduk kota berkembang
  rationale: Subjek verba jamak tidak dinyatakan secara eksplisit, tetapi frasa 'dari kota' paling wajar menunjuk kepada para penduduknya. 'Berkembang' mempertahankan metafora pertumbuhan sekaligus terdengar alami.
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: seperti rumput di bumi
  rationale: Mempertahankan perumpamaan tentang pertumbuhan yang subur dan meluas, serta membedakan הָאָרֶץ di sini sebagai bumi/tanah dari konteks wilayah kerajaan pada awal ayat.
theological_decisions:
- issue: Makna frasa langka פִסַּת בַּר
  choice: kelimpahan gandum
  alternative: segenggam gandum
  rationale: Gambaran hasil yang bergelombang seperti Lebanon mendukung pengertian kelimpahan. Namun, karena 'segenggam gandum' tetap mungkin secara leksikal dan dapat menggambarkan sedikit benih yang menghasilkan panen luar biasa, alternatif itu dipertahankan dalam catatan kaki.
- issue: Subjek וְיָצִיצוּ yang tidak dinyatakan
  choice: penduduk kota berkembang
  alternative: mereka berkembang dari kota
  rationale: Bahasa Indonesia membutuhkan rujukan yang lebih jelas; konteks 'kota' paling mungkin menyiratkan penduduknya. Pilihan ini tidak menentukan kelompok tertentu secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang puitis dan bermartabat. Metafora pertanian dipertahankan, sedangkan unsur tersirat dibuat secukupnya eksplisit agar mudah dipahami.
