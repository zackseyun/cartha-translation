  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: id
  text: Kiranya ia seperti hujan yang turun ke atas rumput yang dipangkas[a], seperti curahan hujan yang membasahi bumi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumput yang dipangkas” juga dapat diterjemahkan “rumput yang dipotong”. Kata Ibraninya dapat pula dipahami sebagai “bulu domba yang dicukur”, tetapi gambaran agraris lebih sesuai dengan penyebutan hujan dan bumi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tanah” atau “negeri”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: Kiranya ia turun
  rationale: Bentuk imperfek dari ירד secara harfiah menyatakan gerak turun. Dalam konteks doa dan berkat bagi raja, bentuk ini paling wajar dipahami sebagai harapan atau permohonan, meskipun pembacaan sebagai pernyataan masa depan tetap mungkin.
- source_word: כְּמָטָר
  choice: seperti hujan
  rationale: Preposisi perbandingan כ dan nomina מָטָר membentuk perumpamaan langsung yang alami diterjemahkan 'seperti hujan'.
- source_word: עַל
  choice: ke atas
  rationale: Dalam gambaran hujan yang turun, 'ke atas' menyampaikan arah gerak menuju permukaan rumput secara alami dalam bahasa Indonesia.
- source_word: גֵּז
  choice: rumput yang dipangkas
  rationale: Kata ini menunjuk pada sesuatu yang dipotong atau dicukur. Gambaran hujan dan bumi mendukung makna agraris 'rumput yang dipangkas', sementara arti 'bulu domba yang dicukur' tetap dicatat sebagai kemungkinan leksikal.
- source_word: כִּרְבִיבִים
  choice: seperti hujan lebat
  rationale: רְבִיבִים menunjuk pada curahan atau hujan yang berlimpah. 'Hujan lebat' alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan 'seperti hujan' pada baris pertama.
- source_word: זַרְזִיף
  choice: yang membasahi
  rationale: Bentuk langka ini menggambarkan tetesan atau curahan air pada tanah. Ungkapan verbal 'yang membasahi' menghasilkan sintaksis Indonesia yang alami tanpa menghilangkan fungsi hujan dalam gambaran tersebut.
- source_word: אָרֶץ
  choice: bumi
  rationale: אָרֶץ dapat berarti bumi, tanah, atau negeri. Dalam gambaran puitis yang umum ini, 'bumi' paling sesuai, sementara kemungkinan 'tanah' atau 'negeri' dicatat dalam catatan kaki.
theological_decisions:
- issue: Daya bentuk imperfek dalam konteks mazmur kerajaan yang bernada doa
  choice: 'Harapan atau permohonan: ''Kiranya ia turun'''
  alternative: 'Pernyataan masa depan: ''Ia akan turun'''
  rationale: Mazmur 72 memuat bahasa doa dan berkat bagi raja, sehingga bentuk imperfek ini secara wajar terdengar sebagai harapan. Catatan kaki mempertahankan kemungkinan bahwa bentuk itu merupakan gambaran tentang masa depan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. 'Kiranya' mempertahankan nada doa kerajaan; struktur dua perumpamaan dijaga agar paralelisme Ibraninya tetap terdengar. Semua kemungkinan penting yang tidak dapat dipastikan dari teks sumber dipertahankan dalam catatan kaki.
