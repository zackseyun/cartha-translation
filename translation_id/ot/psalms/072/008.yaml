  text: וְ֭/יֵרְדְּ מִ/יָּ֣ם עַד יָ֑ם וּ֝/מִ/נָּהָ֗ר עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: id
  text: Kiranya ia[a] memerintah dari laut ke laut dan dari Sungai[b] sampai ke ujung-ujung bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia akan memerintah dari laut ke laut dan dari Sungai sampai ke ujung-ujung bumi.”
    reason: alternative_reading
  - marker: b
    text: “Sungai” kemungkinan besar mengacu kepada Sungai Efrat, yang sering disebut sebagai batas geografis dalam Alkitab.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: Kiranya ia memerintah
  rationale: Bentuk dari רדה berarti ‘memerintah’ atau ‘berkuasa’. Dalam konteks doa kerajaan, ‘Kiranya ia memerintah’ menyampaikan nuansa harapan atau permohonan secara alami dalam bahasa Indonesia.
- source_word: מִיָּם עַד יָם
  choice: dari laut ke laut
  rationale: Ungkapan puitis ini menunjukkan luasnya wilayah kekuasaan tanpa menentukan laut tertentu; bentuk ringkasnya mempertahankan kesejajaran dan jangkauan geografis teks Ibrani.
- source_word: וּמִנָּהָר
  choice: dan dari Sungai
  rationale: נהר dengan penunjukan tertentu dalam konteks geografi Alkitab kemungkinan besar mengacu kepada Sungai Efrat. Huruf kapital menandai pemakaian sebagai sebutan geografis khusus, tanpa menambahkan nama yang tidak dinyatakan langsung dalam teks Ibrani.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: sampai ke ujung-ujung bumi
  rationale: אַפְסֵי menunjuk pada bagian-bagian terjauh atau batas-batas. Ungkapan Indonesia ini alami dan mempertahankan cakupan geografis luas dari idiom Ibrani.
theological_decisions:
- issue: Daya bentuk imperfek/yusif dalam mazmur kerajaan
  choice: 'Diterjemahkan sebagai harapan atau doa: ‘Kiranya ia memerintah’'
  alternative: 'Diterjemahkan sebagai pernyataan atau nubuat: ‘Ia akan memerintah’'
  rationale: Bentuk verba ini dapat bernuansa yusif dalam rangkaian doa bagi raja. Terjemahan utama mempertahankan nada permohonan, sedangkan catatan kaki menjaga kemungkinan pembacaan deklaratif atau prediktif beserta resonansi mesianiknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan khidmat. Kata ‘ia’ dipertahankan dengan huruf kecil karena ayat ini secara langsung berbicara tentang raja; teks tidak dipaksa menjadi rujukan kristologis eksplisit. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
