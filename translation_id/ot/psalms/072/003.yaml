  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
translation:
  language: id
  text: Kiranya gunung-gunung membawa damai sejahtera bagi umat[a], dan bukit-bukit—dalam keadilan.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada umat”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam kebenaran”; kata Ibrani ini dapat berarti “kebenaran” atau “keadilan”, dan preposisinya dapat dipahami sebagai “dalam” atau “melalui”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, bagian akhir berbunyi, “dan bukit-bukit, dalam kebenaran/keadilan.” Kata kerja dalam bagian ini tersirat. Frasa “dalam kebenaran/keadilan” dapat dipahami sebagai cara atau sarana; sebagian memahaminya sebagai unsur paralel yang berkaitan dengan apa yang dibawa bukit-bukit.
    reason: source_ambiguity
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: Kiranya ... membawa
  rationale: נָשָׂא secara harfiah berarti ‘mengangkat, memikul, membawa’. Dengan gunung dan bukit sebagai subjek puitis, ‘membawa’ paling alami dalam bahasa Indonesia. Bentuk imperfek dipahami sebagai harapan atau doa sesuai konteks mazmur kerajaan.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Padanan langsung bagi bentuk jamak dengan artikel; dalam bahasa Indonesia artikel tersebut tidak perlu dinyatakan tersendiri.
- source_word: שָׁלוֹם
  choice: damai sejahtera
  rationale: שָׁלוֹם mencakup kedamaian, kesejahteraan, dan keutuhan. ‘Damai sejahtera’ menyampaikan keluasan makna itu secara alami dan tetap mempertahankan istilah Alkitabiah yang mudah dipahami.
- source_word: לָעָם
  choice: bagi umat
  rationale: Preposisi ל dapat menyatakan arah atau manfaat. ‘Bagi umat’ cocok dengan gagasan bahwa damai sejahtera dihasilkan demi kesejahteraan umat; kemungkinan ‘kepada umat’ dipertahankan dalam catatan kaki.
- source_word: וּגְבָעוֹת
  choice: demikian pula bukit-bukit
  rationale: Frasa ini membentuk paralel puitis dengan gunung-gunung. ‘Demikian pula’ secara alami menandai bahwa verba dan gagasan pokok dari klausa pertama berlaku juga pada klausa kedua tanpa mengulanginya secara kaku.
- source_word: בִּצְדָקָה
  choice: melalui keadilan
  rationale: Preposisi בְּ dapat menunjukkan sarana atau cara, sedangkan צְדָקָה dapat berarti kebenaran atau keadilan. Dalam konteks pemerintahan raja pada Mazmur 72, ‘melalui keadilan’ menyampaikan bahwa damai sejahtera terwujud dengan perantaraan pemerintahan yang adil. Bentuk lebih harfiah dan pilihan ‘kebenaran’ dicatat agar ketaksaan sumber tetap terlihat.
theological_decisions:
- issue: Daya bentuk imperfek dalam doa kerajaan
  choice: 'Harapan/doa: ‘Kiranya ... membawa’'
  alternative: 'Pernyataan masa depan: ‘Gunung-gunung akan membawa’'
  rationale: Konteks Mazmur 72 sebagai doa dan berkat bagi pemerintahan raja lebih mendukung nuansa permohonan atau harapan daripada ramalan sederhana.
- issue: Hubungan בִּצְדָקָה dengan klausa kedua
  choice: 'Dipahami sebagai cara atau sarana hadirnya damai sejahtera: ‘melalui keadilan’'
  alternative: ‘dalam kebenaran’, atau memahami ‘keadilan’ sebagai objek puitis yang dibawa bukit-bukit
  rationale: Secara tata bahasa, בְּ lazim menyatakan cara atau sarana. Terjemahan utama tidak menghapus preposisi untuk menjadikan ‘keadilan’ objek langsung, tetapi catatan kaki mempertahankan susunan harfiah dan kemungkinan nuansa lain.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan tetap mudah dipahami. ‘Umat’ dipilih karena konteksnya adalah komunitas yang diperintah sang raja. Elipsis Ibrani dibuat alami dengan ‘demikian pula’, sedangkan bentuk harfiahnya disediakan dalam catatan kaki.
