  text: כָּלּ֥וּ תְפִלּ֑וֹת דָּ֝וִ֗ד בֶּן יִשָֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/020.yaml
  text: The prayers of David son of Jesse are ended[a].
translation:
  language: id
  text: Doa-doa Daud, anak Isai, telah berakhir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah selesai” atau “telah sampai pada akhirnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלּוּ
  choice: telah berakhir
  rationale: Bentuk pual perfektif orang ketiga jamak dari כלה, dengan תְפִלּוֹת sebagai subjek, menyatakan bahwa doa-doa itu sudah mencapai akhirnya. Pilihan ini ringkas, alami, dan mempertahankan fungsi penutup teks.
- source_word: תְפִלּוֹת
  choice: doa-doa
  rationale: Bentuk jamak תְּפִלָּה secara lugas berarti doa-doa; pengulangan kata merupakan pembentukan jamak yang alami dalam bahasa Indonesia.
- source_word: דָּוִד
  choice: Daud
  rationale: Mengikuti bentuk nama baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן יִשָׁי
  choice: anak Isai
  rationale: Rangkaian konstruksi ini mengidentifikasi Daud berdasarkan garis keturunannya. 'Anak Isai' alami dan transparan dalam bahasa Indonesia.
theological_decisions:
- issue: Fungsi ayat sebagai kolofon/catatan editorial atau bagian dari doa mazmur
  choice: Menerjemahkannya sebagai pernyataan langsung yang menandai berakhirnya doa-doa Daud
  alternative: Memperlakukannya secara eksplisit sebagai catatan tambahan penyunting yang lebih kemudian
  rationale: Teks Ibrani berupa pernyataan sederhana dan tidak menetapkan sejarah penyusunannya. Terjemahan mempertahankan makna permukaan tanpa memasukkan kesimpulan kritis yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Penanda catatan kaki [a] ditempatkan langsung setelah klausa yang diterangkannya.
