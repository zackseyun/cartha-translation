- from: Kiranya ia menghakimi orang-orang miskin dari bangsa itu,[a] menyelamatkan anak-anak orang melarat, dan meremukkan penindas.
  to: Kiranya ia mengadili perkara orang-orang miskin dari kalangan rakyat,[a] menyelamatkan anak-anak orang-orang yang berkekurangan, dan meremukkan penindas.
  rationale: Revisi menghilangkan tambahan “itu”, memperjelas fungsi yudisial שׁפט dalam konteks keadilan bagi kaum miskin, dan memakai diksi Indonesia modern yang lebih netral bagi אֶבְיוֹן. Nuansa doa pada teks utama dan alternatif masa depan dalam catatan kaki dipertahankan.
