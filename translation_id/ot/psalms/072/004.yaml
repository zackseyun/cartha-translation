  text: יִשְׁפֹּ֤ט עֲֽנִיֵּי עָ֗ם י֭וֹשִׁיעַ לִ/בְנֵ֣י אֶבְי֑וֹן וִֽ/ידַכֵּ֣א עוֹשֵֽׁק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/004.yaml
  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
translation:
  language: id
  text: Kiranya ia mengadili perkara orang-orang miskin dari kalangan rakyat,[a] menyelamatkan anak-anak orang-orang yang berkekurangan, dan meremukkan penindas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia akan mengadili perkara orang-orang miskin dari kalangan rakyat, menyelamatkan anak-anak orang-orang yang berkekurangan, dan meremukkan penindas.” Dalam konteks ini, bentuk-bentuk imperfek Ibrani dapat dipahami sebagai pernyataan masa depan atau sebagai doa dan harapan.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: Kiranya ia menghakimi
  rationale: Bentuk imperfek Qal orang ketiga tunggal dapat menyatakan masa depan atau harapan. Dalam konteks doa bagi raja, bentuk harapan paling alami, sedangkan 'menghakimi' mempertahankan arti yudisial dasar.
- source_word: עֲנִיֵּי עָם
  choice: orang-orang miskin dari bangsa itu
  rationale: עֲנִיֵּי menunjuk kepada orang miskin, tertindas, atau sengsara; kesejajarannya dengan אֶבְיוֹן menonjolkan keadaan berkekurangan. 'Dari bangsa itu' mempertahankan hubungan konstruksi dengan עָם.
- source_word: יוֹשִׁיעַ
  choice: menyelamatkan
  rationale: Bentuk Hifil dari ישׁע berarti menyelamatkan atau melepaskan; 'menyelamatkan' menyampaikan tindakan pertolongan secara kuat dan alami.
- source_word: לִבְנֵי אֶבְיוֹן
  choice: anak-anak orang melarat
  rationale: בְנֵי secara harfiah berarti anak-anak dan tidak harus dibatasi pada laki-laki. 'Orang melarat' mempertahankan pembedaan leksikal dari עֲנִיֵּי sambil menyatakan kemiskinan dan kebutuhan mendesak.
- source_word: וִידַכֵּא
  choice: dan meremukkan
  rationale: Kata kerja דכא menyampaikan tindakan meremukkan atau menghancurkan. 'Meremukkan' mempertahankan daya ungkap keras teks terhadap pelaku penindasan.
- source_word: עוֹשֵׁק
  choice: penindas
  rationale: Partisipel dari עשׁק menunjuk kepada orang yang menindas atau memeras; 'penindas' ringkas, alami, dan mencakup tindakan eksploitasi yang berulang.
theological_decisions:
- issue: Nuansa modus verba-verba imperfek dalam ayat ini
  choice: 'Harapan atau doa: ''Kiranya ia ...'''
  alternative: 'Pernyataan masa depan: ''Ia akan ...'''
  rationale: Konteks Mazmur 72 sebagai doa bagi raja mendukung pembacaan volitif, tetapi bentuk Ibrani juga dapat dibaca sebagai masa depan. Alternatif itu dicatat agar ambiguitas asli tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Pronomina 'ia' merujuk kepada raja dalam konteks mazmur. Diksi 'orang melarat' dipakai untuk membedakan אֶבְיוֹן dari עֲנִיֵּי tanpa mengaburkan paralelismenya.
