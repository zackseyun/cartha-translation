  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: id
  text: Kiranya mereka takut kepadamu selama matahari dan bulan masih ada, turun-temurun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka akan takut kepadamu selama matahari dan bulan masih ada.” Secara harfiah, bagian tentang benda-benda langit berbunyi “bersama matahari dan di hadapan bulan”, suatu ungkapan puitis tentang masa yang terus berlangsung.
    reason: alternative_reading
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: Kiranya mereka takut kepada-Mu
  rationale: Bentuk dari ירא dapat menyatakan ketakutan atau rasa hormat yang mendalam. Kata “takut” mempertahankan bobot leksikal dan teologisnya, sedangkan “kiranya” mencerminkan kemungkinan nuansa doa atau harapan dalam konteks ini.
- source_word: עִם שָׁמֶשׁ
  choice: selama matahari ... masih ada
  rationale: 'Secara harfiah עִם berarti “bersama/dengan”, tetapi bersama benda langit ungkapan ini menyatakan jangka waktu: selama matahari ada.'
- source_word: וְלִפְנֵי יָרֵחַ
  choice: dan bulan masih ada
  rationale: Secara harfiah berarti “dan di hadapan bulan”. Dalam kesejajaran puitis dengan matahari, frasa ini mengungkapkan keberlangsungan waktu; terjemahan idiomatis membuat maksud itu jelas dalam bahasa Indonesia.
- source_word: דּוֹר דּוֹרִים
  choice: turun-temurun
  rationale: Ungkapan tunggal-jamak ini menekankan rangkaian generasi yang terus berlanjut. “Turun-temurun” alami, ringkas, dan mempertahankan daya pengulangan tersebut.
theological_decisions:
- issue: Subjek dan rujukan kata ganti “-Mu” dalam mazmur kerajaan
  choice: Mempertahankan sapaan langsung “-Mu” tanpa menentukan apakah yang disapa adalah raja, penguasa keturunan Daud dalam gambaran ideal, atau Allah dalam kaitannya dengan pemerintahan raja.
  alternative: Menafsirkan secara eksplisit bahwa rasa takut itu ditujukan hanya kepada raja atau hanya kepada Allah.
  rationale: Teks Ibrani hanya memakai sapaan orang kedua, dan konteks mazmur kerajaan memungkinkan ketegangan penafsiran tersebut tetap terbuka.
- issue: Nuansa bentuk יִירָאוּךָ
  choice: 'Menerjemahkannya sebagai harapan atau doa: “Kiranya mereka takut kepada-Mu”.'
  alternative: 'Pernyataan bernuansa masa depan: “Mereka akan takut kepada-Mu”.'
  rationale: Konteks doa bagi raja mendukung nuansa jussif, tetapi bentuk Ibraninya juga dapat dipahami sebagai pernyataan masa depan; alternatif itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. “Turun-temurun” dipilih sebagai ungkapan umum yang mudah dipahami. Kapitalisasi “-Mu” mengikuti kebiasaan bahasa Indonesia untuk sapaan yang rujukannya mungkin ilahi, tanpa menghapus ambiguitas rujukan dalam mazmur kerajaan.
