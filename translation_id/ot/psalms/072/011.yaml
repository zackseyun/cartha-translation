  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יִשְׁתַּחֲווּ ל֥/וֹ כָל מְלָכִ֑ים כָּל גּוֹיִ֥ם יַֽעַבְדֽוּ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/011.yaml
  text: May all kings bow down before him[a]; may all nations serve him.
translation:
  language: id
  text: Kiranya semua raja sujud di hadapannya[a]; kiranya semua bangsa melayaninya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembahnya” untuk “sujud di hadapannya” dan/atau “melayaninya”; kedua verba Ibrani dapat mengandung nuansa keagamaan maupun penghormatan kepada raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: kiranya ... sujud
  rationale: Bentuk verba שׁחה menyatakan tindakan membungkuk atau bersujud sebagai penghormatan. Dalam konteks mazmur kerajaan, “sujud” mempertahankan tindakan jasmani dan penghormatan kepada raja tanpa membatasi maknanya hanya pada ibadah.
- source_word: לוֹ
  choice: di hadapannya
  rationale: Dengan verba “sujud”, preposisi ל secara alami diungkapkan dalam bahasa Indonesia sebagai “di hadapannya”, yaitu penghormatan yang ditujukan kepadanya.
- source_word: כָל מְלָכִים
  choice: semua raja
  rationale: Terjemahan langsung yang mempertahankan cakupan universal frasa Ibrani.
- source_word: כָל גּוֹיִם
  choice: semua bangsa
  rationale: גּוֹיִם di sini menunjuk pada bangsa-bangsa dunia dan sejajar dengan “semua raja”; “semua bangsa” merupakan padanan Indonesia yang alami dan netral.
- source_word: יַעַבְדוּהוּ
  choice: kiranya ... melayaninya
  rationale: עבד pada dasarnya berarti melayani atau mengabdi dan, menurut konteks, juga dapat mengandung makna pelayanan keagamaan. “Melayaninya” mempertahankan keluasan makna politik dan religius tersebut.
theological_decisions:
- issue: Apakah tindakan terhadap raja harus dinyatakan secara eksplisit sebagai penyembahan
  choice: 'Memakai bahasa penghormatan dan pelayanan yang lebih luas: “sujud di hadapannya” dan “melayaninya”.'
  alternative: Menerjemahkan salah satu atau kedua verba dengan “menyembahnya”.
  rationale: Mazmur 72 adalah mazmur kerajaan. Verba-verba Ibraninya dapat mengandung nuansa religius, tetapi tidak mengharuskannya secara eksklusif. Pilihan ini mempertahankan ketegangan antara penghormatan kerajaan dan kemungkinan makna penyembahan tanpa menyelesaikannya secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “kiranya” menyampaikan nuansa harapan atau permohonan dari verba imperfek dalam konteks ini; “sujud di hadapannya” alami dalam bahasa Indonesia dan tetap mempertahankan ambiguitas penghormatan kerajaan serta ibadah.
