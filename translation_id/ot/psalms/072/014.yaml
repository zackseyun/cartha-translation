  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
translation:
  language: id
  text: Dari penindasan dan kekerasan ia[b] akan menebus nyawa mereka,[a] dan darah mereka akan berharga di matanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup mereka” atau “diri mereka”. Kata Ibrani nefesh dapat berarti nyawa, hidup, diri, jiwa, atau orang, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Kata tunggal “ia” paling wajar meneruskan rujukan kepada raja dalam mazmur ini, meskipun bahasanya juga menggemakan kepedulian Allah sendiri yang menebus orang tertindas.
    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ
  choice: dari penindasan
  rationale: Gabungan מִן dan תּוֹךְ secara harfiah berarti ‘dari tengah-tengah’. Dalam konteks pembebasan dari suatu keadaan, bahasa Indonesia alami cukup memakai ‘dari’, sementara gagasan keadaan yang mencengkeram tercakup dalam ‘penindasan’.
- source_word: וּמֵחָמָס
  choice: dan kekerasan
  rationale: חָמָס dapat berarti kekerasan, kelaliman, atau ketidakadilan yang kejam. ‘Kekerasan’ mempertahankan gambaran konkret dan sesuai dengan perhatian mazmur kepada orang lemah; unsur ‘dari’ berlaku juga bagi frasa ini.
- source_word: יִגְאַל
  choice: akan menebus
  rationale: גאל menunjuk pada tindakan seorang penebus yang membebaskan atau mengambil kembali. ‘Menebus’ mempertahankan nuansa hukum dan relasional yang lebih kaya daripada sekadar ‘menyelamatkan’.
- source_word: נַפְשָׁם
  choice: nyawa mereka
  rationale: נֶפֶשׁ di sini paling wajar menunjuk pada hidup atau nyawa mereka, bukan secara khusus bagian tak berjasmani. ‘Nyawa mereka’ alami dalam bahasa Indonesia dan mempertahankan fokus pada keselamatan hidup.
- source_word: וְיֵיקַר
  choice: akan berharga
  rationale: Bentuk dari יקר menyatakan bahwa sesuatu dipandang bernilai atau berharga. ‘Akan berharga’ jelas dan tetap dekat dengan bentuk predikatif teks Ibrani.
- source_word: דָּמָם
  choice: darah mereka
  rationale: דָּם secara konkret berarti ‘darah’ dan di sini menyatakan bahwa hidup mereka tidak dianggap murah atau boleh ditumpahkan begitu saja. Terjemahan harfiah mempertahankan citranya.
- source_word: בְּעֵינָיו
  choice: di matanya
  rationale: Ungkapan ini secara harfiah berarti ‘di matanya’ dan menyatakan penilaian atau penghargaan. Idiom yang sama jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan subjek dan kata ganti tunggal
  choice: Kata ‘ia’ dan akhiran ‘-nya’ dibiarkan merujuk paling langsung kepada raja yang menjadi subjek dalam konteks mazmur.
  alternative: Memahaminya sebagai rujukan langsung kepada Allah yang menebus dan menghargai orang tertindas.
  rationale: Bentuk tunggal dalam bahasa Ibrani selaras dengan raja sebagai subjek dalam konteks langsung, tetapi tindakan tersebut juga menggemakan pemeliharaan Allah melalui raja yang adil. Terjemahan tidak memaksakan salah satu resonansi dengan menyebut subjek secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti paralelisme Ibrani tanpa menjadi kaku; ‘ia’ mempertahankan rujukan tunggal tanpa menentukan secara eksplisit apakah gema teologisnya hanya terbatas pada raja.
