source:
  edition: WLC
  text: כִּֽי יַ֭צִּיל אֶבְי֣וֹן מְשַׁוֵּ֑עַ וְ֝/עָנִ֗י וְֽ/אֵין עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: id
  text: Sebab ia membebaskan orang yang berkekurangan ketika orang itu berseru minta tolong, dan orang miskin[a] yang tidak mempunyai penolong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang tertindas”; kata Ibrani עָנִי dapat menekankan penindasan atau penderitaan, selain kemiskinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pujian terhadap raja dalam konteks sebelumnya; “Sebab” mempertahankan hubungan kausal itu secara alami.
- source_word: יַצִּיל
  choice: ia membebaskan
  rationale: Bentuk hifil dari נצל menyatakan tindakan melepaskan atau menyelamatkan seseorang dari bahaya atau kesusahan. “Membebaskan” mempertahankan gagasan pelepasan tanpa membatasinya pada keselamatan rohani.
- source_word: אֶבְיוֹן
  choice: orang yang berkekurangan
  rationale: Istilah ini menunjuk kepada orang yang berada dalam kebutuhan dan bergantung pada pertolongan. Pilihan ini membedakannya dari עָנִי pada bagian sejajar berikutnya.
- source_word: מְשַׁוֵּעַ
  choice: ketika orang itu berseru minta tolong
  rationale: Partisip dari שׁוע menggambarkan seruan memohon pertolongan. Ungkapan temporal ini alami dalam bahasa Indonesia, dan pengulangan “orang itu” menghindari ketidakjelasan acuan kata ganti.
- source_word: וְעָנִי
  choice: dan orang miskin[a]
  rationale: עָנִי dapat berarti miskin, tertindas, atau sengsara. Dalam kesejajaran dengan אֶבְיוֹן, keadaan kekurangan menonjol, tetapi nuansa penderitaan atau penindasan tetap dicatat dalam catatan kaki.
- source_word: וְאֵין עֹזֵר לוֹ
  choice: yang tidak mempunyai penolong
  rationale: Klausa ini menerangkan orang miskin sebagai seseorang yang ditinggalkan tanpa siapa pun yang menolong. Terjemahan ini mempertahankan nomina personal עֹזֵר.
theological_decisions:
- issue: Acuan kata “ia”
  choice: Kata ganti tunggal “ia” dipertahankan tanpa identifikasi tambahan dan dalam konteks mengacu kepada tokoh raja yang dipuji dalam mazmur ini.
  alternative: Tokoh itu dapat dipahami sebagai raja yang adil secara umum atau sebagai raja mesianik dalam pembacaan tipologis maupun profetis.
  rationale: Bahasa Ibrani memakai verba orang ketiga maskulin tunggal tanpa menyebut subjek dalam ayat ini. Terjemahan tidak mempersempit acuan melampaui konteks kerajaan mazmur tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel puisi dipertahankan, sedangkan “orang itu” ditambahkan untuk memperjelas bahwa yang berseru adalah orang yang berkekurangan, bukan sang raja.
