  text: יְהִ֤י שְׁמ֨/וֹ לְֽ/עוֹלָ֗ם לִ/פְנֵי שֶׁמֶשׁ֮ ינין שְׁ֫מ֥/וֹ וְ/יִתְבָּ֥רְכוּ ב֑/וֹ כָּל גּוֹיִ֥ם יְאַשְּׁרֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: id
  text: Kiranya namanya tetap ada untuk selama-lamanya; selama matahari bersinar[a], kiranya namanya tetap lestari[b]. Kiranya segala bangsa diberkati melalui dia[c]; kiranya mereka menyebut dia berbahagia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapan matahari.” Ungkapan ini dapat berarti “selama matahari ada” atau “selama matahari bersinar.”
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani di sini langka dan dapat juga menyiratkan “bertumbuh,” “bertambah,” “berkembang,” atau “diteruskan kepada keturunan.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “Kiranya segala bangsa memberkati diri melalui dia.” Bentuk Ibraninya dapat dipahami secara refleksif.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: Kiranya namanya tetap ada untuk selama-lamanya
  rationale: Bentuk jusif יְהִי menyatakan harapan atau doa. Ungkapan “tetap ada” menyampaikan keberlangsungan nama secara alami dalam bahasa Indonesia tanpa menghilangkan kata “nama” dari teks Ibrani.
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: di hadapan matahari
  rationale: Terjemahan ini mempertahankan gambaran harfiah dan puitis teks Ibrani. Kemungkinan makna temporalnya, yaitu “selama matahari ada,” dicatat dalam catatan kaki.
- source_word: ינין
  choice: terus berlanjut
  rationale: Kata kerja yang langka ini menunjuk pada kelanjutan, pertumbuhan, pertambahan, atau pelestarian. Dalam hubungan dengan “namanya,” frasa “terus berlanjut” menjaga paralelisme tanpa menetapkan satu nuansa yang masih diperdebatkan.
- source_word: וְיִתְבָּרְכוּ בוֹ
  choice: Kiranya ... diberkati melalui dia
  rationale: Bentuk hitpael dapat dipahami secara refleksif, pasif, atau medial. Terjemahan ini alami dalam bahasa Indonesia, mempertahankan gagasan bahwa dia menjadi perantara atau lingkup berkat, dan tidak menutup kemungkinan pembacaan refleksif yang dicatat dalam catatan kaki.
- source_word: כָּל גּוֹיִם
  choice: segala bangsa
  rationale: Dalam konteks kerajaan yang universal, גּוֹיִם menunjuk pada bangsa-bangsa di dunia. “Segala bangsa” merupakan padanan baku dan bermartabat.
- source_word: יְאַשְּׁרוּהוּ
  choice: kiranya mereka menyebutnya berbahagia
  rationale: Bentuk piel dari אשר berarti menyatakan seseorang berbahagia atau diberkati. “Menyebutnya berbahagia” membedakannya dari ברך pada klausa sebelumnya dan menyampaikan makna leksikal secara jelas.
theological_decisions:
- issue: Cakupan kerajaan dan mesianik ayat ini
  choice: Mempertahankan rujukan langsung kepada sang raja sekaligus bahasa universal yang memungkinkan gema mesianik, tanpa mengidentifikasi sang raja secara eksplisit dalam terjemahan.
  alternative: Membatasi ayat ini pada pujian hiperbolis bagi seorang raja historis, atau menerjemahkannya sebagai nubuat yang secara langsung dan eksklusif mesianik.
  rationale: Mazmur 72 adalah mazmur kerajaan, tetapi cakupan berkat bagi segala bangsa melampaui gambaran pemerintahan biasa dan menggemakan janji berkat kepada para leluhur. Terjemahan harus mempertahankan ketegangan tersebut tanpa memasukkan kesimpulan teologis ke dalam teks.
- issue: Makna bentuk hitpael וְיִתְבָּרְכוּ
  choice: Menggunakan bentuk pasif “diberkati melalui dia,” dengan kemungkinan refleksif dijelaskan dalam catatan kaki.
  alternative: “Segala bangsa memberkati diri dengan memakai namanya” atau “segala bangsa mendapat berkat dalam dia.”
  rationale: Bentuk Ibrani memungkinkan nuansa refleksif maupun pasif/medial. Pilihan utama menjaga kaitan dengan berkat universal, sedangkan catatan kaki mempertahankan ambiguitas gramatikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan dengan struktur doa “kiranya.” Diksi mempertahankan citra Ibrani serta kesejajaran antarklausa. “Berbahagia” dipilih pada klausa terakhir agar makna אשר tidak dilebur dengan kata ברך pada klausa sebelumnya.
