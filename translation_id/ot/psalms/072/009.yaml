  text: לְ֭/פָנָי/ו יִכְרְע֣וּ צִיִּ֑ים וְ֝/אֹיְבָ֗י/ו עָפָ֥ר יְלַחֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: id
  text: Di hadapannya, para penghuni padang gurun akan sujud[a], dan musuh-musuhnya akan menjilat debu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “suku-suku padang gurun”; istilah Ibrani צִיִּים dapat menunjuk kepada penduduk wilayah gurun, meskipun dalam beberapa konteks dipakai untuk makhluk-makhluk liar di padang tandus.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Di hadapannya
  rationale: Ungkapan preposisional ini secara idiomatis berarti berada di depan atau dalam kehadirannya; pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa relasional-spasialnya.
- source_word: יִכְרְעוּ
  choice: akan sujud
  rationale: Kata kerja כרע menyatakan berlutut atau membungkuk sebagai tanda takluk. 'Sujud' ringkas, wajar, dan sesuai dengan konteks penundukan kepada raja.
- source_word: צִיִּים
  choice: para penghuni padang gurun
  rationale: Istilah ini dapat menunjuk kepada penghuni daerah tandus atau, dalam konteks lain, makhluk liar di gurun. Dalam mazmur kerajaan ini, kesejajarannya dengan 'musuh-musuhnya' mendukung rujukan kepada manusia tanpa menentukan suku tertentu.
- source_word: וְאֹיְבָיו
  choice: dan musuh-musuhnya
  rationale: Padanan langsung dan alami untuk kata yang berarti orang-orang yang memusuhinya, dengan akhiran milik orang ketiga tunggal maskulin.
- source_word: עָפָר
  choice: debu
  rationale: '''Menjilat debu'' merupakan ungkapan konkret yang alami dan mempertahankan gambaran penghinaan serta kekalahan total.'
- source_word: יְלַחֵכוּ
  choice: akan menjilat
  rationale: Kata kerja לחך berarti 'menjilat'; terjemahan langsung mempertahankan citraan puitis yang kuat.
theological_decisions:
- issue: Sifat gambaran penaklukan
  choice: Mempertahankan tindakan sujud dan menjilat debu sebagai citraan puitis penundukan di hadapan raja.
  alternative: Memahaminya sebagai tindakan jasmani yang harus terjadi secara harfiah dalam setiap kasus.
  rationale: Bahasa tersebut merupakan gambaran kuno yang lazim tentang penghinaan dan ketaklukan. Terjemahan mempertahankan metaforanya tanpa mengubahnya menjadi bahasa politik yang abstrak atau memaksakan pembacaan harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang mudah dipahami. 'Di hadapannya' dan 'menjilat debu' mempertahankan citraan sumber, sedangkan 'para penghuni padang gurun' menjaga ambiguitas leksikal melalui catatan kaki.
