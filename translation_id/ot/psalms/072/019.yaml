source:
  edition: WLC
  text: וּ/בָר֤וּךְ שֵׁ֥ם כְּבוֹד֗/וֹ לְ/ע֫וֹלָ֥ם וְ/יִמָּלֵ֣א כְ֭בוֹד/וֹ אֶת כֹּ֥ל הָ/אָ֗רֶץ אָ֘מֵ֥ן וְ/אָמֵֽן׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: id
  text: Terpujilah nama-Nya yang mulia untuk selama-lamanya[a], dan kiranya kemuliaan-Nya memenuhi seluruh bumi[b]. Amin dan amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “nama kemuliaan-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “seluruh negeri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Terpujilah
  rationale: Partisip pasif ini berfungsi sebagai rumusan berkat yang bernuansa harapan dalam doksologi. Bentuk “Terpujilah” alami dalam bahasa Indonesia, mempertahankan daya liturgis, dan tidak menjadikannya sekadar pernyataan datar.
- source_word: שֵׁם כְּבוֹדוֹ
  choice: nama-Nya yang mulia
  rationale: Rangkaian konstruksi ini secara harfiah berarti “nama kemuliaan-Nya.” Ungkapan “nama-Nya yang mulia” lebih alami dalam bahasa Indonesia sambil mempertahankan gagasan bahwa nama itu bercirikan kemuliaan.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyampaikan keberlangsungan tanpa akhir dengan ungkapan Indonesia yang lazim dan bermartabat dalam konteks pujian.
- source_word: וְיִמָּלֵא
  choice: dan kiranya ... memenuhi
  rationale: Bentuk nifal imperfek di sini paling wajar dipahami bernuansa jusif, yaitu doa atau harapan. Dengan כְבוֹדוֹ sebagai subjek dan אֶת menandai objek langsung, terjemahan aktif “kiranya kemuliaan-Nya memenuhi” menyampaikan sintaks dan maksud ayat secara alami.
- source_word: כְבוֹדוֹ
  choice: kemuliaan-Nya
  rationale: כבוד dalam konteks doksologis ini menunjuk pada kemuliaan, keagungan, dan kehormatan Allah; “kemuliaan” paling tepat serta menjaga kesinambungan istilah Alkitab.
- source_word: אֶת כֹּל הָאָרֶץ
  choice: seluruh bumi
  rationale: אֶת menandai objek langsung, sedangkan כֹּל menyatakan totalitas. Dalam puncak universal mazmur ini, הָאָרֶץ paling tepat berarti bumi, bukan hanya suatu negeri.
- source_word: אָמֵן וְאָמֵן
  choice: Amin dan amin
  rationale: Transliterasi mempertahankan penegasan liturgis ganda yang sudah dikenal luas dalam bahasa Indonesia dan menjaga irama penutup doksologi.
theological_decisions:
- issue: Cakupan הָאָרֶץ
  choice: bumi dalam cakupan universal
  alternative: seluruh negeri
  rationale: Konteks mazmur kerajaan yang berpuncak pada doksologi mengarah pada cakupan seluruh dunia. Namun, kemungkinan leksikal “negeri” tetap dicatat dalam catatan kaki agar ambiguitas dasar kata tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak liturgis yang wajar dan bermartabat. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan dua permohonan doksologis dan penegasan penutup yang berulang.
