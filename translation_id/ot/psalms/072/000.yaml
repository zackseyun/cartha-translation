base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: id
  text: Dari Salomo.[a] Ya Allah, berikanlah keadilan-Mu kepada raja dan kebenaran-Mu[b] kepada putra raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Milik Salomo”, “Untuk Salomo”, atau “Kepada Salomo” dalam judul mazmur ini.
    reason: alternative_reading
  - marker: b
    text: “Kebenaran-Mu” juga dapat diterjemahkan “keadilan-Mu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: Tentang Salomo
  rationale: Preposisi לְ pada judul mazmur dapat menunjukkan kepengarangan, peruntukan, atau pokok bahasan. Pilihan ini alami dalam bahasa Indonesia dan ketaksaan lainnya dipertahankan dalam catatan kaki.
- source_word: מִשְׁפָּטֶיךָ
  choice: keadilan-Mu
  rationale: Bentuk jamak Ibrani mencakup keputusan atau ketetapan adil Allah; dalam konteks permohonan bagi raja, nomina kolektif 'keadilan' paling alami.
- source_word: צִדְקָתְךָ
  choice: kebenaran-Mu
  rationale: Istilah ini menunjuk pada kelurusan atau keadilan Allah. 'Kebenaran' mempertahankan pembedaan leksikal dari מִשְׁפָּטֶיךָ, dengan alternatif dicatat.
- source_word: בֶן־מֶלֶךְ
  choice: putra raja
  rationale: Terjemahan langsung dan alami yang mempertahankan hubungan dinasti tanpa menentukan apakah tokohnya sama dengan 'raja' pada klausa sebelumnya.
theological_decisions:
- issue: Hubungan antara keadilan Allah dan pemerintahan raja
  choice: Mempertahankan ungkapan milik 'keadilan-Mu' dan 'kebenaran-Mu' sebagai pemberian yang dimohonkan dari Allah
  alternative: Menafsirkan keduanya sebagai kemampuan raja untuk menghakimi dengan adil
  rationale: Teks secara langsung meminta Allah memberikan milik-Nya kepada raja; terjemahan tidak mempersempit maknanya menjadi sekadar kecakapan pemerintahan.
- issue: Identitas 'raja' dan 'putra raja'
  choice: Tidak menyamakan atau membedakan keduanya secara eksplisit
  alternative: Menafsirkan keduanya sebagai orang yang sama atau sebagai dua penguasa berbeda
  rationale: Paralelisme Ibrani memungkinkan rujukan yang sepadan, tetapi tidak mengharuskan penjelasan identitas dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'Ya Allah' menyampaikan vokatif אֱלֹהִים secara alami. Kapital pada akhiran pronominal ilahi mengikuti kebiasaan ejaan religius Indonesia; struktur paralel ayat dipertahankan.
