  text: בָּר֤וּךְ יְהוָ֣ה אֱ֭לֹהִים אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹשֵׂ֖ה נִפְלָא֣וֹת לְ/בַדּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/018.yaml
  text: Blessed be Yahweh God[a], the God of Israel, who alone does wondrous things.
translation:
  language: id
  text: Terpujilah Yahweh Allah, Allah Israel, satu-satunya yang melakukan perbuatan-perbuatan ajaib.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Diberkatilah Yahweh Allah, Allah Israel, yang melakukan perbuatan-perbuatan ajaib seorang diri.”'
    reason: Mempertahankan alternatif yang lebih harfiah bagi bentuk pasif בָּרוּךְ dan kemungkinan nuansa “seorang diri” pada לְבַדּוֹ, sementara teks utama menyatakan daya eksklusifnya secara lebih alami.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Partisip pasif ini merupakan formula doksologi. Dalam bahasa Indonesia, “Terpujilah” menyampaikan seruan liturgis secara alami dan bermartabat; nuansa harfiahnya sebagai ‘diberkatilah’ dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Di sini אֱלֹהִים beraposisi dengan Yahweh. “Allah” merupakan padanan baku dan wajar untuk sebutan ilahi ini dalam bahasa Indonesia.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi Ibrani diterjemahkan langsung sehingga identitas dan relasinya dengan Israel tetap jelas.
- source_word: עֹשֵׂה
  choice: yang ... melakukan
  rationale: Partisip Qal menggambarkan tindakan yang menjadi ciri Allah; klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan daya deskriptifnya.
- source_word: נִפְלָאוֹת
  choice: perbuatan-perbuatan ajaib
  rationale: Nomina jamak ini menunjuk pada tindakan luar biasa. Padanan tersebut lebih konkret daripada sekadar “keajaiban” dan mempertahankan bentuk jamaknya.
- source_word: לְבַדּוֹ
  choice: satu-satunya
  rationale: Ungkapan adverbial ini menegaskan bahwa hanya Dia yang melakukan perbuatan ajaib; pilihan ini mempertahankan klaim eksklusif tanpa memperluasnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai tetragramaton sebagai nama pribadi. Bentuk “Yahweh” mempertahankan nama itu dan membedakannya dari gelar.
- issue: Daya eksklusif לְבַדּוֹ
  choice: yang satu-satunya melakukan perbuatan-perbuatan ajaib
  alternative: yang melakukan keajaiban seorang diri
  rationale: Pilihan utama menyatakan bahwa hanya Yahweh yang melakukan tindakan-tindakan tersebut, sementara alternatif dapat menonjolkan bahwa Ia bertindak tanpa bantuan. Catatan kaki mempertahankan kemungkinan nuansa kedua.
translation_notes:
  register: Bahasa Indonesia modern, liturgis, dan mudah dipahami. Susunan aposisional “Yahweh, Allah, Allah Israel” dipertahankan dekat dengan teks Ibrani; tanda koma membantu keterbacaan. Pengulangan jamak pada “perbuatan-perbuatan ajaib” menjaga bentuk sumber.
