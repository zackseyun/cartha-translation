source:
  edition: WLC
  text: יָ֭חֹס עַל דַּ֣ל וְ/אֶבְי֑וֹן וְ/נַפְשׁ֖וֹת אֶבְיוֹנִ֣ים יוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
translation:
  language: id
  text: Ia akan berbelas kasihan kepada orang lemah dan orang miskin, dan akan menyelamatkan nyawa orang-orang miskin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jiwa orang-orang miskin.” Kata Ibrani yang dipakai dapat berarti “nyawa,” “diri,” “orang,” atau “jiwa,” tergantung konteksnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹס
  choice: akan berbelas kasihan
  rationale: Dalam konteks ini, verba tersebut menyatakan belas kasihan atau kepedulian kepada orang rentan. Ungkapan ini alami dalam bahasa Indonesia dan selaras dengan tindakan menyelamatkan pada baris berikutnya.
- source_word: עַל
  choice: kepada
  rationale: Dengan יָחֹס, preposisi ini menandai sasaran belas kasihan; dalam bahasa Indonesia paling alami dinyatakan dengan 'kepada'.
- source_word: דַּל
  choice: orang lemah
  rationale: Kata ini dapat menunjuk orang yang lemah, rendah kedudukannya, atau miskin. 'Orang lemah' mempertahankan cakupan kerentanan dan membedakannya dari אֶבְיוֹן.
- source_word: אֶבְיוֹן
  choice: orang miskin
  rationale: Kata ini menunjuk orang yang berkekurangan atau melarat. 'Orang miskin' merupakan padanan Indonesia yang jelas dan mempertahankan perbedaan puitis dari דַּל.
- source_word: נַפְשׁוֹת
  choice: nyawa
  rationale: Bentuk jamak נֶפֶשׁ di sini paling wajar merujuk pada nyawa atau kehidupan orang-orang miskin dalam konteks perlindungan dan penyelamatan oleh raja, bukan secara khusus pada jiwa tak berjasad.
- source_word: אֶבְיוֹנִים
  choice: orang-orang miskin
  rationale: Pilihan ini konsisten dengan אֶבְיוֹן sebelumnya, sedangkan bentuk ulang mencerminkan jamaknya secara alami.
- source_word: יוֹשִׁיעַ
  choice: akan menyelamatkan
  rationale: Bentuk Hifil dari ישׁע berarti menyelamatkan atau melepaskan. 'Menyelamatkan' langsung, alami, dan mempertahankan hubungan leksikalnya dengan pemakaian Alkitab yang lebih luas.
theological_decisions:
- issue: Makna נַפְשׁוֹת dalam kaitannya dengan antropologi manusia
  choice: Diterjemahkan 'nyawa'.
  alternative: '''jiwa'' atau ''diri/orang'''
  rationale: Dalam konteks perlindungan dan pembebasan oleh raja, istilah Ibrani ini paling alami menunjuk pada nyawa atau kehidupan orang-orang miskin. Pilihan 'nyawa' tidak memaksakan dikotomi tubuh-jiwa yang tidak dituntut oleh ayat ini, sementara alternatif leksikalnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Paralelisme Ibrani dipertahankan dengan membedakan דַּל sebagai 'orang lemah' dan אֶבְיוֹן sebagai 'orang miskin'. Penanda catatan kaki ditempatkan setelah klausa yang memuat נַפְשׁוֹת.
