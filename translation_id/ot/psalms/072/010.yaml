  terminology: Nama Tarsis, Syeba, dan Seba konsisten dengan bentuk lazim bahasa Indonesia. Pembedaan “upeti” untuk מִנְחָה dan “hadiah” untuk אֶשְׁכָּר tepat dalam konteks penghormatan kerajaan; “mempersembahkan” sesuai untuk יַקְרִיבוּ tanpa menjadikannya istilah korban ritual secara eksklusif.
