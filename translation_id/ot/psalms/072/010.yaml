  source_fidelity: 'Teks Indonesia secara akurat mencerminkan struktur paralel Ibrani: raja-raja Tarsis dan pulau-pulau memberikan מִנְחָה sebagai “upeti,” sedangkan raja-raja Syeba dan Seba mempersembahkan אֶשְׁכָּר sebagai “hadiah.” “Membawa” adalah pengungkapan Indonesia yang wajar bagi יָשִׁיבוּ dalam konteks penyerahan upeti, tanpa memaksakan arti sempit “mengembalikan.” Nuansa optatif “Kiranya” dapat dipertahankan dalam rangkaian doa mazmur ini dan sejalan dengan audit trail Inggris “May.”'
