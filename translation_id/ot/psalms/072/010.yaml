id: PSA.72.10
reference: Psalms 72:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: id
  text: Kiranya raja-raja Tarsis dan pulau-pulau membawa upeti; kiranya raja-raja Syeba dan Seba mempersembahkan hadiah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִיִּים
  choice: pulau-pulau
  rationale: Istilah ini secara harfiah menunjuk pada pulau-pulau, dan dalam konteks dapat mencakup wilayah pesisir jauh; bentuk konkret sumber dipertahankan tanpa mempersempitnya menjadi hanya daerah pantai.
- source_word: מִנְחָה
  choice: upeti
  rationale: Dalam konteks para raja yang datang kepada penguasa, kata ini paling wajar dipahami sebagai persembahan atau pemberian penghormatan berupa upeti.
- source_word: יַשִׁיבוּ
  choice: membawa
  rationale: Secara leksikal verba ini dapat berarti membawa kembali atau menyerahkan; dalam konstruksi ini terjemahan alami 'membawa upeti' mempertahankan tindakan pemberian tanpa memaksakan gagasan bahwa ada utang sebelumnya.
- source_word: אֶשְׁכָּר
  choice: hadiah
  rationale: Kata ini menunjuk pada pemberian atau persembahan; 'hadiah' membedakannya secara alami dari מִנְחָה tanpa menambahkan makna teknis.
- source_word: יַקְרִיבוּ
  choice: mempersembahkan
  rationale: Verba ini berarti membawa mendekat atau menyajikan; 'mempersembahkan' sesuai dengan tindakan resmi para raja dan tidak harus dibatasi pada korban ritual.
theological_decisions:
- issue: Nuansa modal bentuk imperfek dalam konteks mazmur kerajaan
  choice: Kiranya ... membawa; kiranya ... mempersembahkan
  alternative: Raja-raja ... akan membawa; raja-raja ... akan mempersembahkan
  rationale: Konteks rangkaian permohonan dalam Mazmur 72 mendukung nuansa harapan atau doa, tetapi bentuk Ibrani juga dapat dipahami secara prediktif. 'Kiranya' mengikuti konteks tanpa mengubah ayat menjadi pernyataan kepastian yang lebih tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama tempat ditransliterasikan secara lazim sebagai Tarsis, Syeba, dan Seba; paralelisme puitis dipertahankan.
