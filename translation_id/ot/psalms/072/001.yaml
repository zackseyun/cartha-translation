  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: id
  text: 'Dari Salomo.[a]


    Ya Allah, berikanlah keputusan-keputusan-Mu kepada raja, dan kebenaran-Mu[b] kepada putra raja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk Salomo” atau “Oleh Salomo.”
    reason: alternative_reading
  - marker: b
    text: Atau “keadilan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: Tentang Salomo
  rationale: Prefiks ל dalam judul mazmur dapat menyatakan kepengarangan, peruntukan, atau hubungan. “Tentang Salomo” mempertahankan keluasan hubungan itu dalam bahasa Indonesia; kemungkinan “Untuk Salomo” dan “Oleh Salomo” dicatat dalam catatan kaki.
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung dalam doa. “Ya Allah” merupakan bentuk vokatif yang alami dan khidmat dalam bahasa Indonesia modern.
- source_word: מִשְׁפָּטֶיךָ
  choice: keputusan-keputusan-Mu
  rationale: Bentuk Ibrani ini jamak dan dapat menunjuk pada keputusan hukum, penghakiman, atau keadilan. “Keputusan-keputusan-Mu” mempertahankan bentuk konkret jamak serta konteks tugas peradilan raja.
- source_word: לְמֶלֶךְ
  choice: kepada raja
  rationale: Frasa ini secara langsung menandai raja sebagai penerima hal yang dimohonkan dari Allah.
- source_word: תֵּן
  choice: berikanlah
  rationale: Bentuk imperatif ini menyatakan permohonan agar Allah menganugerahkan sesuatu. Akhiran “-lah” membuat permohonan terdengar alami dan khidmat tanpa menambah makna.
- source_word: וְצִדְקָתְךָ
  choice: dan kebenaran-Mu
  rationale: צְדָקָה mencakup kebenaran moral sekaligus keadilan dalam tindakan dan pemerintahan. “Kebenaran-Mu” mempertahankan keluasan tersebut, sedangkan “keadilan-Mu” tetap merupakan alternatif kontekstual yang kuat.
- source_word: לְבֶן־מֶלֶךְ
  choice: kepada putra raja
  rationale: Frasa konstruksi ini secara harfiah berarti putra seorang raja atau putra raja. Ungkapan tersebut dipertahankan tanpa menetapkan apakah ia menunjuk ahli waris kerajaan atau merupakan paralel bagi sang raja sendiri.
theological_decisions:
- issue: Identitas “raja” dan “putra raja”
  choice: Mempertahankan bahasa doa kerajaan sebagaimana adanya tanpa mengidentifikasi tokohnya secara eksplisit sebagai Mesias dalam teks utama.
  alternative: Menafsirkannya khusus sebagai doa untuk Salomo, atau sebagai doa dinastik/messianis yang melampaui Salomo.
  rationale: Ayat ini memiliki latar kerajaan langsung sekaligus dapat mengandung gema tentang raja ideal. Teksnya sendiri tidak mengharuskan penerjemah menentukan apakah yang dimaksud ialah Salomo, raja keturunan Daud secara umum, atau Mesias secara tipologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya Allah” serta imperatif “berikanlah” sesuai dengan register doa. “Putra raja” dipilih karena lebih alami dan bermartabat daripada “anak laki-laki raja,” tanpa menambahkan gagasan teknis tentang ahli waris.
