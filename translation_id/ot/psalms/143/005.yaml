source:
  edition: WLC
  text: זָ֘כַ֤רְתִּי יָמִ֨ים מִ/קֶּ֗דֶם הָגִ֥יתִי בְ/כָל פָּעֳלֶ֑/ךָ בְּֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ אֲשׂוֹחֵֽחַ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/005.yaml
  text: I remember the days of old[a]; I meditate on all your work[b]; I muse on the work of your hands.
translation:
  language: id
  text: Aku mengingat hari-hari dahulu[a]; aku merenungkan segala karya-Mu; aku memikirkan perbuatan tangan-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku teringat akan hari-hari dahulu.” Bentuk verba Ibrani dapat dipahami sebagai tindakan lampau atau sebagai tindakan mengingat yang sedang dikemukakan dalam puisi ini.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “memikirkan” juga dapat berarti “merenungkan” atau “membicarakan.” Dalam konteks ini, kesejajarannya dengan “merenungkan” mendukung arti refleksi batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְתִּי
  choice: Aku mengingat
  rationale: Bentuk Qal perfek orang pertama tunggal dapat menunjuk pada tindakan mengingat yang telah dilakukan atau yang kini dikemukakan dalam wacana puitis. Bentuk kini terasa alami dalam bahasa Indonesia, sedangkan kemungkinan lampau dicatat dalam catatan kaki.
- source_word: יָמִים מִקֶּדֶם
  choice: hari-hari dahulu
  rationale: Ungkapan ini menunjuk pada masa lampau atau zaman dahulu. Pilihan ini ringkas, puitis, dan mudah dipahami.
- source_word: הָגִיתִי
  choice: aku merenungkan
  rationale: Verba הגה mengandung arti merenung atau memikirkan dengan sungguh-sungguh. 'Merenungkan' sesuai dengan konteks reflektif dan tetap dibedakan dari verba pada klausa terakhir.
- source_word: בְּכָל פָּעֳלֶךָ
  choice: segala karya-Mu
  rationale: פֹּעַל dapat berarti pekerjaan, karya, atau perbuatan. 'Segala karya-Mu' mempertahankan nilai kolektif bentuk tunggal sekaligus terdengar alami.
- source_word: בְּמַעֲשֵׂה יָדֶיךָ
  choice: perbuatan tangan-Mu
  rationale: Pilihan ini mempertahankan gambaran konkret antropomorfis tentang tangan Allah dan mencakup baik apa yang dibuat maupun yang dilakukan-Nya.
- source_word: אֲשׂוֹחֵחַ
  choice: aku memikirkan
  rationale: שׂיח dapat berarti merenung, memikirkan, atau berbicara. Paralelisme dengan הָגִיתִי dan pemakaian בְּ untuk objek mendukung arti refleksi batin; kemungkinan nuansa berbicara dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan 'karya' dan 'perbuatan tangan'
  choice: Tidak mempersempitnya hanya kepada penciptaan atau tindakan penyelamatan tertentu
  alternative: Menafsirkan frasa-frasa ini secara khusus sebagai karya penciptaan atau sejarah penyelamatan
  rationale: Teks Ibrani memakai istilah umum dan konteks ayat tidak mewajibkan satu rujukan teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapital pada pronomina dan sufiks yang merujuk kepada Allah mengikuti konvensi umum Alkitab bahasa Indonesia. Paralelisme tiga klausa dipertahankan, sementara dua verba reflektif diterjemahkan secara berbeda agar perbedaan leksikal sumber tidak hilang.
