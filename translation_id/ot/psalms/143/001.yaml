  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/001.yaml
  text: A psalm of David[a]. O Yahweh, hear my prayer; give ear to my pleas for mercy. In your faithfulness answer me[c][b], in your righteousness.
translation:
  language: id
  text: 'Mazmur Daud.[a]


    Yahweh, dengarlah doaku;

    dengarkanlah permohonanku untuk belas kasihan.


    Dalam kesetiaan-Mu[b], jawablah aku;

    dalam keadilan-Mu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur oleh Daud” atau “Mazmur untuk Daud.” Ungkapan Ibraninya dapat menyatakan kepengarangan, keterkaitan, atau peruntukan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Oleh kesetiaan-Mu” atau “Karena kesetiaan-Mu.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dalam kebenaran-Mu” atau “oleh keadilan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku dan tepat untuk jenis syair atau nyanyian ibadah yang ditunjukkan oleh kata Ibrani ini.
- source_word: לְדָוִד
  choice: Daud
  rationale: Ungkapan singkat “Mazmur Daud” wajar dalam bahasa Indonesia dan tetap dapat mencakup hubungan kepengarangan, keterkaitan, atau peruntukan yang mungkin dinyatakan oleh לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: שְׁמַע תְּפִלָּתִי
  choice: dengarlah doaku
  rationale: Menerjemahkan imperatif secara langsung dan alami dalam konteks doa.
- source_word: הַאֲזִינָה אֶל תַּחֲנוּנַי
  choice: perhatikanlah permohonanku akan belas kasihan
  rationale: “Perhatikanlah” menyampaikan tindakan mendengarkan dengan sungguh-sungguh tanpa mempertahankan idiom tubuh yang terasa kurang alami; תַּחֲנוּנִים menunjuk pada permohonan sungguh-sungguh untuk belas kasihan atau kemurahan.
- source_word: בֶּאֱמֻנָתְךָ
  choice: Dalam kesetiaan-Mu
  rationale: אֱמוּנָה di sini menyatakan sifat Allah yang dapat dipercaya dan setia. “Dalam” mempertahankan bentuk puitis serta tidak memutuskan secara sempit fungsi preposisinya.
- source_word: עֲנֵנִי
  choice: jawablah aku
  rationale: Padanan langsung bagi permohonan agar Allah menanggapi doa; nuansa jawaban yang menguntungkan tidak perlu ditambahkan secara eksplisit.
- source_word: בְּצִדְקָתֶךָ
  choice: dalam kebenaran-Mu
  rationale: Menunjuk pada kelurusan atau sifat benar Allah. “Kebenaran” mempertahankan istilah teologis dan puitis yang luas, sementara kemungkinan “keadilan” dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi ilahi; “Yahweh” mempertahankan nama itu melalui transliterasi, tanpa menggantinya dengan gelar.
- issue: Dasar permohonan dalam frasa בֶּאֱמֻנָתְךָ dan בְּצִדְקָתֶךָ
  choice: dalam kesetiaan-Mu ... dalam kebenaran-Mu
  alternative: oleh/karena kesetiaan-Mu ... oleh/karena kebenaran atau keadilan-Mu
  rationale: Preposisi בְּ dapat menyatakan ranah, cara, atau dasar. Teks utama mempertahankan ungkapan yang cukup terbuka, sedangkan fungsi instrumental atau kausal dicatat sebagai kemungkinan.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. Paralelisme ayat dipertahankan melalui susunan empat baris. “Perhatikanlah” dipilih daripada idiom harfiah “berilah telinga” agar alami bagi pembaca masa kini. Akhiran hormat untuk Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
