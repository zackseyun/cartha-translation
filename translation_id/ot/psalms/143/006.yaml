translation:
  language: id
  text: 'Aku mengulurkan kedua tanganku kepada-Mu;

    jiwaku seperti tanah yang letih mendambakan-Mu.[a]

    Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwaku seperti tanah yang gersang dan haus akan Engkau.” Kata sifat Ibraninya secara harfiah berarti “letih” atau “lesu”; gambaran tanah kemungkinan menyiratkan kegersangan dan kehausan yang sangat.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: Aku menadahkan
  rationale: Dalam konteks doa, פרשׂ menggambarkan tindakan membentangkan atau mengulurkan tangan. “Menadahkan” merupakan ungkapan Indonesia yang alami untuk sikap memohon sambil tetap mempertahankan gerak konkretnya.
- source_word: יָדַי
  choice: kedua tanganku
  rationale: Bentuk Ibrani dengan akhiran orang pertama merujuk pada tangan-tangan pemazmur; “kedua tanganku” menyatakan dengan jelas bahwa kedua tangan terlibat.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Preposisi אֶל menunjukkan arah kepada pihak yang disapa. “Kepada-Mu” alami dalam bahasa doa Indonesia.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, diri, atau keseluruhan batin seseorang. “Jiwaku” mempertahankan daya afektif dan rohani dalam paralelisme puisi ini tanpa mempersempitnya menjadi sekadar emosi.
- source_word: כְּאֶרֶץ עֲיֵפָה
  choice: seperti tanah yang letih
  rationale: עֲיֵפָה secara harfiah berarti “letih” atau “lesu.” Ungkapan puitis “tanah yang letih” mempertahankan personifikasi Ibrani; catatan kaki menjelaskan kemungkinan makna kontekstual “gersang/kehausan.”
- source_word: לְךָ
  choice: mendambakan-Mu
  rationale: לְךָ sangat ringkas dan eliptis, secara harfiah “bagi-Mu/kepada-Mu.” Dalam perumpamaan tentang tanah yang letih, “mendambakan-Mu” mengungkapkan arah kerinduan kepada Allah dalam bahasa Indonesia yang alami, tanpa menambahkan objek lain.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna istilah liturgis atau musikal ini tidak pasti, sehingga ditransliterasikan daripada diterjemahkan secara spekulatif.
