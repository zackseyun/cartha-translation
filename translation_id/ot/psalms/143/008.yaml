  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַשְׁמִ֘יעֵ֤/נִי בַ/בֹּ֨קֶר חַסְדֶּ/ךָ֮ כִּֽי בְ/ךָ֪ בָ֫טָ֥חְתִּי הוֹדִיעֵ֗/נִי דֶּֽרֶךְ ז֥וּ אֵלֵ֑ךְ כִּֽי אֵ֝לֶי/ךָ נָשָׂ֥אתִי נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/008.yaml
  text: Let me hear your steadfast love in the morning[a], for in you I trust. Make known to me the way I should go[c][b], for to you I lift up my soul.
translation:
  language: id
  text: Perdengarkanlah kasih setia-Mu kepadaku pada pagi hari,[a] sebab kepada-Mu aku percaya. Beritahukanlah kepadaku jalan yang harus kutempuh,[b] sebab kepada-Mu kuangkat jiwaku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Buatlah aku mendengar kasih setia-Mu pada pagi hari.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “jalan yang akan kutempuh”; secara harfiah, “jalan yang akan aku jalani.”
    reason: lexical_alternative
  - marker: c
    text: “Mengangkat jiwa” adalah ungkapan Ibrani yang menggambarkan penyerahan diri kepada Allah atau pengarahan seluruh kehidupan batin kepada-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמִיעֵנִי
  choice: Perdengarkanlah ... kepadaku
  rationale: Bentuk imperatif hiphil dengan akhiran orang pertama tunggal secara harfiah berarti ‘buatlah aku mendengar’. ‘Perdengarkanlah ... kepadaku’ mempertahankan daya kausatif dan tetap alami sebagai permohonan doa.
- source_word: בַבֹּקֶר
  choice: pada pagi hari
  rationale: Frasa temporal ini paling wajar menunjuk waktu, bukan tenggat atau kebiasaan berulang.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: חסד mencakup kasih, kesetiaan, dan loyalitas relasional; padanan baku ini mempertahankan keluasan maknanya tanpa membatasinya hanya pada belas kasihan.
- source_word: בְךָ בָטָחְתִּי
  choice: kepada-Mu aku percaya
  rationale: Bentuk perfektif menyatakan sikap percaya yang telah teguh dan masih berlaku. Susunan ini menjaga penekanan Ibrani pada Allah sebagai tujuan kepercayaan.
- source_word: הוֹדִיעֵנִי
  choice: Beritahukanlah kepadaku
  rationale: Imperatif hiphil ידע berarti ‘buatlah tahu’ atau ‘beritahukanlah’; pilihan ini lebih dekat pada bentuk sumber daripada ‘ajarlah’.
- source_word: דֶּרֶךְ זוּ אֵלֵךְ
  choice: jalan yang harus kutempuh
  rationale: Secara bentuk, klausa ini dapat dibaca ‘jalan yang akan kutempuh’. Dalam konteks permohonan akan tuntunan, ‘harus kutempuh’ alami dalam bahasa Indonesia, sementara alternatif yang lebih harfiah dicatat.
- source_word: נָשָׂאתִי נַפְשִׁי
  choice: kuangkat jiwaku
  rationale: Metafora Ibrani dipertahankan agar ungkapan tentang penyerahan diri, kerinduan, dan pengarahan seluruh batin kepada Allah tidak dipersempit menjadi satu tafsiran.
theological_decisions:
- issue: Makna חסד dalam seruan kepada Allah
  choice: kasih setia-Mu
  alternative: belas kasih-Mu; kasih perjanjian-Mu
  rationale: ‘Kasih setia’ menyampaikan kasih yang loyal dan dapat diandalkan tanpa memasukkan istilah teknis teologis yang tidak dinyatakan secara eksplisit dalam ayat.
- issue: Ungkapan metaforis נָשָׂאתִי נַפְשִׁי
  choice: kepada-Mu kuangkat jiwaku
  alternative: kepada-Mu kuserahkan diriku; kepada-Mu kuarahkan seluruh batinku
  rationale: Metafora sumber dipertahankan beserta ketegangan puitis dan keluasan maknanya, alih-alih ditafsirkan menjadi satu tindakan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang luhur tetapi mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Metafora utama dipertahankan, sedangkan klausa tentang jalan dirumuskan secara idiomatis dan alternatif harfiahnya dicatat.
