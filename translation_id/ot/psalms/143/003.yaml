  text: כִּ֥י רָ֘דַ֤ף אוֹיֵ֨ב נַפְשִׁ֗/י דִּכָּ֣א לָ֭/אָרֶץ חַיָּתִ֑/י הוֹשִׁיבַ֥/נִי בְ֝/מַחֲשַׁכִּ֗ים כְּ/מֵתֵ֥י עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/003.yaml
  text: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
translation:
  language: id
  text: Sebab musuh telah mengejar jiwaku[a]; ia telah meremukkan hidupku sampai ke tanah; ia membuat aku tinggal di tempat-tempat gelap, seperti mereka yang sudah lama mati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mengejar aku”; dalam puisi Ibrani, “jiwaku” sering dipakai untuk menunjuk kepada diri seseorang secara utuh.
    reason: lexical_alternative
  - marker: b
    text: Atau “seperti orang-orang mati dari zaman dahulu.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi permohonan dalam konteks ratapan dan mempertahankan hubungan kausal dengan ayat sebelumnya.
- source_word: רָדַף
  choice: telah mengejar
  rationale: Makna dasarnya adalah mengejar atau memburu. Bentuk ini menyatakan tindakan yang telah terjadi dan dampaknya masih dirasakan pemazmur.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Nomina tunggal tanpa artikel diterjemahkan secara alami sebagai 'musuh'; penambahan 'seorang' tidak diperlukan dalam bahasa Indonesia dan dapat memberi penekanan yang tidak ada dalam teks.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Mempertahankan idiom puitis Ibrani serta membedakannya dari חַיָּתִי, 'hidupku', pada klausa berikutnya. Catatan kaki menjelaskan bahwa yang dimaksud dapat berupa diri pemazmur secara utuh.
- source_word: דִּכָּא
  choice: telah meremukkan
  rationale: Kata kerja ini menggambarkan tindakan menghancurkan atau meremukkan dengan kuat; pilihan ini mempertahankan citra kekerasan dalam teks.
- source_word: לָאָרֶץ
  choice: sampai ke tanah
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran seseorang yang dijatuhkan serendah-rendahnya ke tanah.
- source_word: חַיָּתִי
  choice: hidupku
  rationale: Dalam konteks ini menunjuk pada kehidupan atau keberadaan pemazmur sebagai orang hidup.
- source_word: הוֹשִׁיבַנִי
  choice: ia membuat aku tinggal
  rationale: Bentuk kausatif dari ישׁב menyatakan bahwa musuh menyebabkan pemazmur berada atau menetap dalam keadaan tersebut.
- source_word: בְמַחֲשַׁכִּים
  choice: di tempat-tempat gelap
  rationale: Bentuk jamak dipertahankan sebagai tempat-tempat atau kawasan kegelapan, bukan sekadar konsep abstrak 'kegelapan'.
- source_word: כְּמֵתֵי עוֹלָם
  choice: seperti mereka yang sudah lama mati
  rationale: Ungkapan ini paling mungkin menunjuk kepada orang-orang yang telah mati sejak lama. Terjemahan ini alami dan tidak menyelesaikan עוֹלָם secara keliru sebagai pernyataan doktrinal tentang kematian kekal.
theological_decisions:
- issue: Makna temporal עוֹלָם dalam ungkapan כְּמֵתֵי עוֹלָם
  choice: sudah lama mati
  alternative: orang-orang mati dari zaman dahulu
  rationale: Konteks menggambarkan keterasingan seperti orang mati yang telah lama terlupakan. Terjemahan ini mempertahankan daya puitis tanpa menafsirkan frasa itu sebagai ajaran tentang keadaan kekal orang mati.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang puitis dan bermartabat. Paralelisme tiga klausa dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
