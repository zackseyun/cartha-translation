  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/000.yaml
  text: A psalm of David. O LORD, hear my prayer; give ear to my pleas for mercy! In your faithfulness answer me, in your righteousness!
translation:
  language: id
  text: 'Mazmur Daud.


    Ya TUHAN, dengarkanlah doaku;

    berilah telinga kepada permohonan-permohonanku![a]


    Jawablah aku dalam kesetiaan-Mu,[b]

    dalam keadilan-Mu![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “permohonanku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “oleh kesetiaan-Mu”; bahasa Ibrani juga dapat dipahami sebagai seruan yang didasarkan pada kesetiaan Allah.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “dalam kebenaran-Mu” atau “oleh keadilan-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Mazmur Daud
  rationale: Bentuk judul yang alami dan ringkas; konstruksi לְדָוִד dapat menyatakan kepengarangan, hubungan, atau persembahan kepada Daud tanpa perlu mempersempitnya di teks utama.
- source_word: הַאֲזִינָה
  choice: berilah telinga
  rationale: Mempertahankan citra idiomatis Ibrani dan paralelismenya dengan 'dengarkanlah', sambil tetap mudah dipahami dalam ragam bahasa Alkitab yang bermartabat.
- source_word: תַּחֲנוּנַי
  choice: permohonanku memohon belas kasihan
  rationale: Menampilkan unsur permohonan yang mengharapkan belas kasihan, bukan sekadar permintaan umum.
- source_word: בֶּאֱמֻנָתְךָ
  choice: dalam kesetiaan-Mu
  rationale: Menerjemahkan אֱמוּנָה sebagai kesetiaan atau keterandalan Allah serta mempertahankan preposisi ב sebagai 'dalam'; kemungkinan instrumental dicatat dalam catatan kaki.
- source_word: בְּצִדְקָתֶךָ
  choice: dalam kebenaran-Mu
  rationale: Memakai padanan Indonesia yang lazim untuk צְדָקָה dalam konteks sifat dan tindakan Allah, tanpa menghapus kemungkinan nuansa keadilan atau sarana yang dinyatakan oleh ב.
theological_decisions:
- issue: Dasar permohonan pemazmur kepada Allah
  choice: Mempertahankan ungkapan 'dalam kesetiaan-Mu' dan 'dalam kebenaran-Mu'
  alternative: 'Menerjemahkan secara kausal atau instrumental: ''berdasarkan/oleh kesetiaan-Mu'' dan ''oleh keadilan-Mu'''
  rationale: Teks Ibrani memungkinkan nuansa lingkup, dasar, atau sarana. Teks utama mempertahankan bentuk dekat sumber, sedangkan catatan kaki menjaga alternatifnya tanpa menetapkan suatu kerangka teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Seruan 'Ya TUHAN' serta paralelisme puitis dipertahankan. Nama perjanjian יהוה ditampilkan sebagai TUHAN sesuai konvensi Indonesia. Penomoran masukan menyebut ayat 0, tetapi sumber memuat judul sekaligus isi yang biasanya dikenal sebagai Mazmur 143:1; seluruh teks sumber diterjemahkan agar tidak terjadi penghilangan.
