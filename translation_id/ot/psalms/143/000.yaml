  to: 'Mazmur Daud.


    Ya TUHAN, dengarkanlah doaku;

    berilah telinga kepada permohonan-permohonanku![a]


    Jawablah aku dalam kesetiaan-Mu,[b]

    dalam keadilan-Mu![c]'
  rationale: Revisi mengganti konstruksi yang tidak alami dengan padanan jamak yang langsung untuk תַּחֲנוּנַי. Padanan utama untuk צְדָקָה disesuaikan menjadi "keadilan" agar nuansa righteousness/justice Allah tidak direduksi menjadi kebenaran dalam arti proposisional. Susunan puitis, seruan, dan ambiguitas preposisi ב tetap dipertahankan; alternatif yang relevan tersedia dalam catatan kaki.
