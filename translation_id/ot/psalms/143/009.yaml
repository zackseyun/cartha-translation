  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י יְהוָ֗ה אֵלֶ֥י/ךָ כִסִּֽתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/009.yaml
  text: Deliver me from my enemies[a], O Yahweh; in you I have taken refuge.
translation:
  language: id
  text: 'Selamatkanlah aku dari musuh-musuhku, ya Yahweh;

    kepada-Mu aku berlindung.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kepada-Mu aku menyembunyikan diri,” atau, “pada-Mu aku mencari perlindungan.” Ungkapan Ibrani ini menyatakan tindakan mencari perlindungan pada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Selamatkanlah aku
  rationale: Bentuk imperatif Hifil dari נצל dengan akhiran orang pertama tunggal menyatakan permohonan langsung agar dilepaskan dari bahaya. “Selamatkanlah aku” alami dan kuat dalam bahasa Indonesia serta tidak menentukan cara penyelamatannya.
- source_word: מֵאֹיְבַי
  choice: dari musuh-musuhku
  rationale: Preposisi מִן menyatakan pelepasan atau pemisahan, sedangkan bentuk jamak אֹיֵב dengan akhiran orang pertama tunggal berarti “musuh-musuhku”.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”; partikel sapaan “ya” membuat vokatifnya wajar dalam doa bahasa Indonesia.
- source_word: אֵלֶיךָ כִסִּתִי
  choice: kepada-Mu aku berlindung
  rationale: אֵלֶיךָ secara harfiah berarah “kepada-Mu”, dan כִסִּתִי berasal dari כסה, “menutupi/menyembunyikan”. Dalam konteks ini gabungan tersebut mengungkapkan tindakan mencari perlindungan pada Allah. Terjemahan ini mempertahankan arah kepada Allah dan makna idiomatisnya tanpa menghapus metafora dasarnya dari catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama pribadi יהוה. “Yahweh” mempertahankan nama itu dalam bentuk transliterasi yang lazim secara ilmiah, alih-alih menggantinya dengan gelar.
- issue: Makna אֵלֶיךָ כִסִּתִי
  choice: kepada-Mu aku berlindung
  alternative: kepada-Mu aku menyembunyikan diri
  rationale: Ungkapan Ibrani dapat dibaca secara harfiah sebagai tindakan menyembunyikan diri kepada/pada Allah, tetapi dalam konteks permohonan keselamatan maknanya adalah mencari naungan atau perlindungan pada-Nya. Terjemahan utama menyampaikan fungsi ungkapan itu, sementara arti harfiahnya dicatat agar ketegangan leksikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “kepada-Mu aku berlindung” mengikuti penekanan sumber pada Allah sebagai tujuan perlindungan. Huruf kapital pada “-Mu” mengikuti kebiasaan penulisan sapaan kepada Allah.
