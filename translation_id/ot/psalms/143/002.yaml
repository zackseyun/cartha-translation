  text: וְ/אַל תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ כִּ֤י לֹֽא יִצְדַּ֖ק לְ/פָנֶ֣י/ךָ כָל חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/002.yaml
  text: And do not enter into judgment with your servant[a], for no living one is righteous before you.
translation:
  language: id
  text: Janganlah mengadili hamba-Mu, sebab tidak seorang pun yang hidup benar di hadapan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak seorang pun yang hidup akan dinyatakan benar di hadapan-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַל
  choice: Janganlah
  rationale: Larangan ini melanjutkan permohonan dari ayat sebelumnya. Dalam bahasa Indonesia, penghilangan kata sambung menghasilkan alur doa yang alami tanpa menghilangkan kesinambungannya.
- source_word: תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ
  choice: membawa hamba-Mu ini ke pengadilan
  rationale: Ungkapan Ibrani secara harfiah berarti ‘masuk ke dalam penghakiman dengan hamba-Mu’. Pilihan ini mempertahankan gambaran proses hukum dalam bahasa Indonesia yang jelas dan alami; ‘ini’ menandai bahwa pemazmur menyebut dirinya sebagai hamba Allah.
- source_word: כִּ֤י
  choice: sebab
  rationale: Memperkenalkan alasan bagi permohonan sebelumnya dengan penghubung yang wajar dalam ragam doa dan puisi.
- source_word: לֹֽא יִצְדַּ֖ק
  choice: tidak ... benar
  rationale: Qal צדק dapat berarti ‘benar’ sekaligus memiliki nuansa forensik ‘dinyatakan benar’. Teks utama mempertahankan pengakuan umum tentang ketidakbenaran manusia, sedangkan kemungkinan forensiknya dicatat dalam catatan kaki.
- source_word: לְ/פָנֶ֣י/ךָ
  choice: di hadapan-Mu
  rationale: Padanan idiomatis yang mempertahankan gagasan berada dalam kehadiran dan penilaian Allah.
- source_word: כָל חָֽי
  choice: tidak seorang pun yang hidup
  rationale: Di bawah negasi, frasa harfiah ‘setiap yang hidup’ menyatakan penyangkalan universal. ‘Seorang pun’ menunjukkan bahwa manusia yang dimaksud, sementara ‘yang hidup’ mempertahankan ungkapan sumber.
theological_decisions:
- issue: Nuansa moral dan forensik יִצְדַּק dalam konteks penghakiman ilahi
  choice: tidak seorang pun yang hidup benar di hadapan-Mu
  alternative: tidak seorang pun yang hidup akan dinyatakan benar di hadapan-Mu
  rationale: Teks utama menyampaikan pengakuan luas bahwa manusia tidak benar di hadapan Allah, sedangkan metafora pengadilan tetap jelas pada klausa pertama. Catatan kaki mempertahankan pembacaan forensik yang kuat tanpa memasukkan rumusan doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Bentuk ‘hamba-Mu’ mempertahankan ragam doa; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Metafora hukum dibuat eksplisit secara alami, dan alternatif forensik dipertahankan dalam catatan kaki.
