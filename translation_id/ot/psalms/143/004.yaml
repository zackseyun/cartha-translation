  text: Dan rohku melemah dalam diriku[a]; hatiku tertegun dalam diriku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan rohku diliputi tekanan dalam diriku; hatiku hancur dalam diriku.”'
    reason: Kata-kata Ibrani yang diterjemahkan “melemah” dan “tertegun” juga dapat menyatakan roh yang diliputi atau terkalahkan serta hati yang hancur atau menjadi tandus.
lexical_decisions:
- source_word: וַתִּתְעַטֵּף
  choice: melemah
  rationale: Bentuk hitpael dari עטף dalam konteks ratapan menggambarkan keadaan menjadi lemah, lesu, atau diliputi tekanan. “Melemah” alami dalam bahasa Indonesia dan tetap mempertahankan perubahan keadaan batin pemazmur.
- source_word: עָלַי
  choice: dalam diriku
  rationale: Secara harfiah berarti “atas/menimpaku”, tetapi bersama “rohku” frasa ini menunjuk pada pengalaman batin pemazmur. “Dalam diriku” menyampaikan maksud itu secara wajar dan sejalan dengan paralel בְּתוֹכִי.
- source_word: רוּחִי
  choice: rohku
  rationale: Di sini רוּחַ menunjuk pada daya hidup atau batin pemazmur, bukan sekadar napas dan bukan secara khusus Roh Allah. “Rohku” mempertahankan istilah antropologis dan kesejajarannya dengan “hatiku”.
- source_word: בְּתוֹכִי
  choice: dalam batinku
  rationale: Frasa ini menyatakan lokasi batiniah. “Dalam batinku” alami dalam puisi Indonesia dan menghindari pengulangan persis dari “dalam diriku” tanpa mengubah makna.
- source_word: יִשְׁתּוֹמֵם
  choice: tertegun
  rationale: Kata dari akar שמם dapat berarti menjadi sunyi, terpukul, tercengang, atau hancur batinnya. “Tertegun” mempertahankan unsur kelumpuhan akibat keterkejutan tanpa menentukan secara berlebihan jenis emosinya.
- source_word: לִבִּי
  choice: hatiku
  rationale: לֵב menunjuk pada pusat pikiran, kehendak, dan perasaan. “Hatiku” merupakan padanan Indonesia yang baku dan puitis dalam kesejajaran dengan “rohku”.
