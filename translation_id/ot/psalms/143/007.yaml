  text: מַ֘הֵ֤ר עֲנֵ֨/נִי יְהוָה֮ כָּלְתָ֪ה ר֫וּחִ֥/י אַל תַּסְתֵּ֣ר פָּנֶ֣י/ךָ מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם יֹ֥רְדֵי בֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/007.yaml
  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
translation:
  language: id
  text: Jawablah aku dengan segera, ya Yahweh; rohku sudah terkuras. Jangan sembunyikan wajah-Mu dariku; kalau tidak, aku akan menjadi seperti mereka yang turun ke liang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka yang turun ke kubur.” Dalam puisi Ibrani, “liang” merupakan gambaran kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר עֲנֵנִי
  choice: Jawablah aku segera
  rationale: Bentuk imperatif מַהֵר memberi nuansa mendesak pada permohonan עֲנֵנִי. Susunan ini alami dalam bahasa Indonesia dan mempertahankan urgensinya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama pribadi dalam teks Ibrani.
- source_word: כָּלְתָה רוּחִי
  choice: rohku telah habis
  rationale: כָּלְתָה menyatakan bahwa daya atau kekuatan sudah terkuras, sedangkan רוּחִי secara harfiah berarti “rohku”. Ungkapan puitis ini dipertahankan tanpa mempersempitnya hanya menjadi emosi atau semangat.
- source_word: אַל תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: Jangan sembunyikan wajah-Mu dariku
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang wajah Allah, yang menyiratkan kehadiran dan perkenanan-Nya, tanpa menjelaskan idiom itu di dalam teks utama.
- source_word: וְנִמְשַׁלְתִּי
  choice: kalau tidak, aku akan menjadi seperti
  rationale: Dalam rangkaian sesudah larangan, bentuk ini menyatakan akibat yang ditakuti. “Kalau tidak” mengungkapkan hubungan itu secara alami dalam bahasa Indonesia, sementara “menjadi seperti” mempertahankan makna bentuk Nifal dari משל.
- source_word: יֹרְדֵי בוֹר
  choice: mereka yang turun ke liang
  rationale: Partisipel יֹרְדֵי menggambarkan orang-orang yang turun, sedangkan בּוֹר berarti liang atau lubang yang dalam dan secara puitis menunjuk kepada kematian. “Liang” mempertahankan metafora tanpa langsung menyamakannya dengan kubur atau dunia orang mati.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna בּוֹר sebagai gambaran kematian
  choice: Mempertahankan “liang” dalam teks utama
  alternative: liang kubur, kubur, atau dunia orang mati
  rationale: Metafora Ibrani membangkitkan gambaran kematian, tetapi tidak merinci keadaan sesudah kematian. Karena itu, teks utama mempertahankan gambarnya dan catatan kaki memberi alternatif yang lebih interpretatif.
- issue: Cakupan makna רוּחִי
  choice: rohku
  alternative: semangatku atau nafasku
  rationale: רוּחַ dapat menunjuk kepada roh, napas, atau daya hidup. “Rohku” menjaga keluasan dan ketegangan puitis ungkapan tersebut tanpa membatasinya pada keadaan emosional saja.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk doa langsung dipertahankan, termasuk metafora “wajah” dan “liang”. Kata ganti yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
