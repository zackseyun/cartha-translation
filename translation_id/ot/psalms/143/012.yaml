id: PSA.143.12
reference: Psalms 143:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּֽ/בְ/חַסְדְּ/ךָ֮ תַּצְמִ֪ית אֹ֫יְבָ֥/י וְֽ֭/הַאֲבַדְתָּ כָּל צֹרֲרֵ֣י נַפְשִׁ֑/י כִּ֝֗י אֲנִ֣י עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/012.yaml
  text: And in your steadfast love you will cut off my enemies[a], and you will destroy all the adversaries of my soul[b], for I am your servant.
translation:
  language: id
  text: Dan dalam kasih setia-Mu Engkau akan melenyapkan musuh-musuhku[a]; Engkau akan membinasakan semua orang yang memusuhi jiwaku[b], sebab aku adalah hamba-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dengan kasih setia-Mu"; kata depan Ibrani dapat menunjukkan sarana, selain lingkup atau dasar tindakan.
    reason: lexical_alternative
  - marker: b
    text: '"Jiwaku" juga dapat berarti "hidupku" atau sekadar "aku".'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחַסְדְּךָ
  choice: Dan dalam kasih setia-Mu
  rationale: חֶסֶד menyatakan kasih yang teguh dan setia, khususnya dalam relasi perjanjian. Prefiks ב diterjemahkan 'dalam' untuk mempertahankan nuansa lingkup atau dasar tindakan Allah; nuansa alat juga mungkin dan dicatat dalam catatan kaki.
- source_word: תַּצְמִית
  choice: Engkau akan melenyapkan
  rationale: Bentuk Hifil dari צמת berarti menyebabkan berhenti atau musnah. 'Melenyapkan' mempertahankan daya ungkap yang keras tanpa menyamakannya dengan verba berikutnya.
- source_word: אֹיְבָי
  choice: musuh-musuhku
  rationale: Padanan langsung dan alami bagi nomina jamak dengan sufiks orang pertama tunggal.
- source_word: וְהַאֲבַדְתָּ
  choice: Engkau akan membinasakan
  rationale: Bentuk Hifil dari אבד berarti menyebabkan binasa. 'Membinasakan' mempertahankan kekuatan ungkapan serta variasi paralel dengan 'melenyapkan'.
- source_word: כָּל צֹרֲרֵי נַפְשִׁי
  choice: semua orang yang memusuhi jiwaku
  rationale: צרר menunjuk kepada pihak yang bersikap bermusuhan atau menyesakkan. Bentuk verbal Indonesia terdengar alami, sedangkan 'jiwaku' mempertahankan idiom puitis Ibrani beserta keluwesan maknanya.
- source_word: כִּי אֲנִי עַבְדֶּךָ
  choice: sebab aku adalah hamba-Mu
  rationale: כִּי memberikan dasar permohonan. Dalam doa kepada Allah, עֶבֶד secara wajar berarti 'hamba', dengan penekanan pada kepunyaan, kerendahan hati, dan pelayanan.
theological_decisions:
- issue: Bahasa kutukan terhadap para musuh
  choice: Mempertahankan pernyataan langsung bahwa Allah akan melenyapkan musuh dan membinasakan para lawan pemazmur.
  alternative: Melunakkannya menjadi 'mengalahkan', 'membungkam', atau ungkapan nonmematikan lainnya.
  rationale: Kedua verba Ibrani sangat kuat. Terjemahan perlu mempertahankan ketegangan doa memohon penghakiman ilahi dan tidak menguranginya demi menghindari ketidaknyamanan.
- issue: Makna נַפְשִׁי
  choice: jiwaku
  alternative: hidupku; aku
  rationale: Pilihan ini menjaga idiom dan corak puitis teks tanpa mengharuskan pembacaan dualistis; keluasan maknanya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan sapaan ilahi berhuruf kapital. Titik koma mempertahankan kesejajaran dua tindakan tanpa membuat kalimat terasa kaku. Semua penanda catatan kaki dicantumkan dalam teks utama.
