  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
translation:
  language: id
  text: Demi nama-Mu, ya Yahweh, peliharalah hidupku[a]; oleh keadilan-Mu[b], keluarkanlah aku[d] dari kesesakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidupkanlah aku”, “pulihkanlah hidupku”, atau “biarkanlah aku tetap hidup”. Kata kerja Ibrani ini dapat berarti memberi hidup, mempertahankan hidup, atau memulihkan hidup dan kekuatan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam keadilan-Mu”, “oleh kebenaran-Mu”, atau “dalam kebenaran-Mu”.
    reason: lexical_alternative
  - marker: c
    text: Atau “kesusahan” atau “penderitaan”.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “jiwaku”; dalam ungkapan Ibrani, kata ini juga dapat berarti “aku” atau “hidupku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: Demi nama-Mu
  rationale: Ungkapan ini menyatakan dasar atau motif permohonan, yaitu demi kehormatan dan nama Yahweh. Idiom alkitabiah tentang “nama” dipertahankan tanpa diparafrasakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: תְּחַיֵּנִי
  choice: peliharalah hidupku
  rationale: Bentuk piel dari חיה dapat berarti membuat hidup, memulihkan hidup atau kekuatan, maupun mempertahankan kehidupan. Dalam konteks ratapan dan bahaya, pilihan ini menyampaikan permohonan agar hidup pemazmur dipertahankan tanpa mempersempitnya menjadi kebangkitan dari kematian.
- source_word: בְּצִדְקָתְךָ
  choice: dalam kebenaran-Mu
  rationale: Preposisi ב dapat dipahami sebagai “dalam” atau secara instrumental sebagai “oleh/dengan”. “Dalam kebenaran-Mu” mempertahankan bentuk dan keluasan ungkapan Ibraninya.
- source_word: תוֹצִיא
  choice: keluarkanlah
  rationale: Bentuk hifil dari יצא secara konkret berarti menyebabkan keluar atau membawa keluar. Pilihan ini mempertahankan gambaran pembebasan dari keadaan yang menghimpit.
- source_word: מִצָּרָה
  choice: dari kesesakan
  rationale: צָרָה menunjuk pada kesesakan, kesusahan, atau penderitaan. “Kesesakan” sesuai dengan bahasa ratapan dan mempertahankan gambaran keadaan yang menghimpit.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפש dapat berarti jiwa, diri, atau hidup. “Jiwaku” mempertahankan ungkapan antropologis dan bentuk puitis Ibrani, sementara catatan menjelaskan bahwa maksudnya dapat mencakup seluruh diri pemazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa צְדָקָה dalam permohonan kepada Allah
  choice: kebenaran
  alternative: keadilan
  rationale: Istilah ini dapat mencakup keadilan, kelurusan moral, dan tindakan yang sesuai dengan kesetiaan Allah. “Kebenaran” mempertahankan keluasan teologisnya, sedangkan kemungkinan “keadilan” dicatat sebagai alternatif.
- issue: Makna נַפְשִׁי
  choice: jiwaku
  alternative: aku atau hidupku
  rationale: Ungkapan Ibrani dapat menunjuk bukan hanya pada bagian batin manusia, tetapi pada diri atau kehidupannya secara utuh. Teks utama mempertahankan bentuk puitisnya tanpa menutup makna idiomatis tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami digunakan. Bentuk permohonan “peliharalah” dan “keluarkanlah” mempertahankan nada doa. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Susunan penanda catatan mengikuti kata atau frasa yang dijelaskannya, meskipun urutan [d] muncul sebelum [c] dalam teks.
