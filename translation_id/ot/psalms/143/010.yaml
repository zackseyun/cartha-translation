  text: לַמְּדֵ֤/נִי לַֽ/עֲשׂ֣וֹת רְצוֹנֶ/ךָ֮ כִּֽי אַתָּ֪ה אֱל֫וֹהָ֥/י רוּחֲ/ךָ֥ טוֹבָ֑ה תַּ֝נְחֵ֗/נִי בְּ/אֶ֣רֶץ מִישֽׁוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/010.yaml
  text: Teach me to do your will[a], for you are my God. Let your good Spirit lead me in level ground.
translation:
  language: id
  text: Ajarlah aku melakukan kehendak-Mu, sebab Engkaulah Allahku. Kiranya Roh-Mu yang baik[a] menuntun aku di tanah yang rata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh-Mu yang baik”. Tulisan Ibrani tidak membedakan huruf besar dan kecil, sehingga frasa ini dapat dipahami sebagai Roh Allah atau, secara lebih umum, roh maupun sifat-Nya yang baik.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְּדֵנִי
  choice: Ajarlah aku
  rationale: Bentuk imperatif Piel dengan akhiran orang pertama tunggal menyatakan permohonan agar Allah mengajar pemazmur; bentuk ini langsung dan wajar dalam bahasa doa.
- source_word: לַעֲשׂוֹת רְצוֹנֶךָ
  choice: melakukan kehendak-Mu
  rationale: Infinitif עשה menyatakan hal yang harus dipelajari, sedangkan רצון dalam konteks ini menunjuk pada apa yang Allah kehendaki.
- source_word: כִּי אַתָּה אֱלֹהָי
  choice: sebab Engkaulah Allahku
  rationale: כִּי memberikan alasan bagi permohonan sebelumnya. Partikel penegas -lah menghasilkan ungkapan doa yang alami tanpa menambah isi.
- source_word: רוּחֲךָ טוֹבָה
  choice: Roh-Mu yang baik
  rationale: Frasa ini secara harfiah berarti 'roh/Roh-Mu yang baik'. Huruf kapital dipakai karena konteks paling wajar menunjuk pada Roh milik Allah, sementara kemungkinan pembacaan umum dipertahankan dalam catatan kaki.
- source_word: תַּנְחֵנִי
  choice: Kiranya ... menuntun aku
  rationale: Bentuk Hifil dari נחה berarti memimpin atau menuntun. 'Kiranya' menyampaikan nuansa permohonan pada bentuk verbal Ibrani.
- source_word: בְּאֶרֶץ מִישׁוֹר
  choice: di tanah yang rata
  rationale: מישור menggambarkan tempat yang rata atau lapang dan dapat pula bernuansa kelurusan. Terjemahan ini mempertahankan citra spasial sumber tanpa menutup kemungkinan makna kiasannya.
theological_decisions:
- issue: Apakah רוּחֲךָ merujuk kepada 'Roh-Mu' atau 'roh-Mu'
  choice: Roh-Mu yang baik
  alternative: roh-Mu yang baik
  rationale: Karena pemazmur berbicara langsung kepada Allah dan menyebut 'Roh/roh-Mu' sebagai penuntun, rujukan kepada Roh Allah paling alami. Namun, tulisan Ibrani tidak mengenal pembedaan huruf kapital, sehingga kemungkinan bahwa ungkapan itu menunjuk secara lebih umum pada roh atau sifat baik Allah dicatat tanpa diputuskan secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Ajarlah', 'Engkaulah', dan 'Kiranya' sesuai dengan register doa tanpa terasa kuno. Kapitalisasi sapaan ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia; ambiguitas pada רוּחַ dijelaskan dalam catatan kaki.
