  text: A Song of Ascents. To Yahweh in my distress I called[a], and he answered me.
translation:
  language: id
  text: 'Nyanyian ziarah.[a]


    Dalam kesesakanku aku berseru kepada Yahweh, dan Ia menjawabku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Judul Ibrani ini dipakai secara tradisional untuk Mazmur 120–134. Secara lebih harfiah: “Nyanyian pendakian”; maksud khusus judul tersebut tidak pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Ungkapan ini menjadi judul tradisional Mazmur 120–134. Secara harfiah מַעֲלוֹת berkaitan dengan tindakan naik; “ziarah” menyampaikan kemungkinan nyanyian yang dinyanyikan dalam perjalanan naik ke Yerusalem, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang secara eksplisit terdapat dalam teks Ibrani, tanpa menggantinya dengan gelar.
- source_word: בַּצָּרָתָה לִּי
  choice: Dalam kesesakanku
  rationale: Ungkapan idiomatis ini menyatakan keadaan pribadi sang pemazmur ketika ia berseru; bentuk Indonesia ini alami dan tetap dekat dengan makna sumber.
- source_word: קָרָאתִי וַיַּעֲנֵנִי
  choice: aku berseru ... dan Ia menjawab aku
  rationale: Mempertahankan urutan dua tindakan dalam bentuk lampau dan hubungan langsung antara seruan pemazmur dan jawaban Yahweh.
theological_decisions:
- issue: Cara menampilkan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Pemakaian “Yahweh” mempertahankan perbedaan antara nama diri ilahi יהוה dan gelar אֲדֹנָי serta mengikuti bukti sumber secara transparan.
- issue: Makna judul הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  alternative: Nyanyian pendakian
  rationale: Rujukan tepat judul ini tidak sepenuhnya pasti. Teks utama memakai padanan Indonesia yang alami dalam konteks kumpulan mazmur, sementara catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Susunan klausa dibuat alami tanpa menghilangkan penekanan pada keadaan terdesak, seruan kepada Yahweh, dan jawaban-Nya.
