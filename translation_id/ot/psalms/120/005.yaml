  text: אֽוֹיָה לִ֭/י כִּי גַ֣רְתִּי מֶ֑שֶׁךְ שָׁ֝כַ֗נְתִּי עִֽם אָהֳלֵ֥י קֵדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/005.yaml
  text: Woe to me[a], for I have sojourned in Meshech[b]; I have dwelt among the tents of Kedar.
translation:
  language: id
  text: Celakalah aku, sebab aku telah tinggal sebagai pendatang di Mesekh[a]; aku telah berdiam di antara[b] kemah-kemah Kedar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mesekh dan Kedar mungkin dipakai secara puitis sebagai nama bangsa-bangsa yang jauh dan bermusuhan, bukan untuk menyatakan bahwa pemazmur benar-benar tinggal di kedua tempat itu pada waktu yang sama.
    reason: cultural_note
  - marker: b
    text: 'Atau: bersama kemah-kemah Kedar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹיָה לִי
  choice: Celakalah aku
  rationale: Ungkapan seru ini menyatakan ratapan dan kesusahan pribadi dengan kuat serta tetap wajar dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi ratapan pemazmur dan mempertahankan hubungan kausal dalam bentuk yang puitis.
- source_word: גַרְתִּי
  choice: aku telah tinggal sebagai pendatang
  rationale: Kata kerja גור menunjuk pada tinggal sebagai orang asing atau pendatang, bukan sekadar menetap; frasa ini mempertahankan nuansa keterasingan.
- source_word: מֶשֶׁךְ
  choice: Mesekh
  rationale: Nama diri dipertahankan melalui transliterasi yang lazim dan tidak diganti dengan tafsiran geografis atau simbolis.
- source_word: שָׁכַנְתִּי
  choice: aku telah berdiam
  rationale: Pilihan ini menyampaikan arti tinggal atau menghuni sekaligus membedakannya dari nuansa khusus גַרְתִּי pada klausa sebelumnya.
- source_word: עִם
  choice: di antara
  rationale: Secara harfiah berarti 'dengan', tetapi dalam konteks tempat tinggal bersama kelompok yang dilambangkan oleh kemah-kemahnya, 'di antara' lebih alami dalam bahasa Indonesia.
- source_word: אָהֳלֵי
  choice: kemah-kemah
  rationale: Bentuk jamak konkret dipertahankan agar citra kehidupan kaum pengembara dalam puisi Ibrani tidak hilang.
- source_word: קֵדָר
  choice: Kedar
  rationale: Nama diri suku Arab ini ditransliterasikan, sehingga gambaran historis-geografis teks tetap terpelihara.
theological_decisions:
- issue: Apakah Mesekh dan Kedar harus diterjemahkan sebagai nama diri atau ditafsirkan secara simbolis dalam teks utama
  choice: Mempertahankan Mesekh dan Kedar sebagai nama diri
  alternative: Menggantikannya dengan ungkapan umum seperti 'bangsa-bangsa jauh yang memusuhi aku'
  rationale: Teks Ibrani secara langsung menyebut kedua nama itu. Mempertahankannya menjaga citra historis-puitis dan membiarkan kemungkinan fungsi harfiah maupun puitis tetap terbuka.
- issue: Apakah keberadaan pemazmur di Mesekh dan di antara kemah-kemah Kedar harus dipahami sebagai tempat tinggal serentak secara harfiah
  choice: Tidak menjelaskan atau menyelaraskan ketegangan ini di dalam teks utama
  alternative: Menafsirkan kedua nama secara eksplisit sebagai lambang keterasingan di tengah bangsa-bangsa yang bermusuhan
  rationale: Kedua lokasi berjauhan, tetapi puisi dapat menyandingkannya untuk melukiskan keterasingan. Terjemahan mempertahankan ketegangan tersebut dan memberi penjelasan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan irama puitis yang ringkas. Ungkapan 'tinggal sebagai pendatang' mempertahankan nuansa keterasingan, sedangkan nama-nama dan citra kemah tetap konkret.
