  text: חִצֵּ֣י גִבּ֣וֹר שְׁנוּנִ֑ים עִ֝֗ם גַּחֲלֵ֥י רְתָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/004.yaml
  text: Sharp arrows of a warrior[b][a], with coals of the broom tree.
translation:
  language: id
  text: Anak-anak panah seorang pejuang yang telah diasah[a], bersama bara dari semak retam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “anak-anak panah tajam milik seorang perkasa.”'
    reason: lexical_alternative
  - marker: b
    text: Retam adalah semak gurun yang arangnya dikenal menyala dan menghasilkan panas untuk waktu yang lama.
    reason: cultural_note
lexical_decisions:
- source_word: חִצֵּי
  choice: anak-anak panah …
  rationale: Bentuk jamak konstruksi dari חֵץ. Susunan Indonesia menghubungkannya dengan גִבּוֹר sebagai pemilik atau pengguna panah.
- source_word: גִבּוֹר
  choice: seorang pejuang
  rationale: Dalam gambaran yang bersifat militer ini, גִבּוֹר menunjuk kepada orang yang kuat dan ahli berperang; 'pejuang' menyampaikan nuansa itu secara alami tanpa melebih-lebihkannya menjadi gelar kepahlawanan.
- source_word: שְׁנוּנִים
  choice: yang diasah tajam
  rationale: Bentuk ini menerangkan anak-anak panah sebagai telah ditajamkan. Ungkapan tersebut mempertahankan nuansa pasif/resultatif yang tidak sepenuhnya tampak dalam kata 'tajam' saja.
- source_word: עִם
  choice: bersama
  rationale: Preposisi ini menggabungkan dua gambaran hukuman, yaitu anak-anak panah dan bara.
- source_word: גַּחֲלֵי
  choice: bara dari
  rationale: גַּחֲלֵי berarti bara atau arang membara dalam bentuk konstruksi. 'Bara' sudah mengandung gagasan panas atau menyala, sehingga tidak perlu menambahkan kata 'menyala' yang tidak dinyatakan secara terpisah dalam teks.
- source_word: רְתָמִים
  choice: pohon retam
  rationale: רְתָמִים menunjuk kepada semak gurun Retama yang menghasilkan arang tahan lama. Nama 'retam' dipertahankan sebagai nama tumbuhan, sedangkan 'pohon' membuat acuannya mudah dipahami.
theological_decisions:
- issue: Hubungan kedua gambaran dengan konteks penghukuman
  choice: Mempertahankan bentuk frasa nominal tanpa menambahkan pelaku atau penjelasan tentang siapa yang menembakkan panah atau menerima hukuman
  alternative: Menjadikannya kalimat lengkap, misalnya 'Ia akan menghukummu dengan ...'
  rationale: Ayat Ibrani hanya menyajikan dua gambaran, dan unsur pelaku serta sasaran dipahami dari konteks ayat sebelumnya. Penambahan eksplisit akan menafsirkan sesuatu yang dibiarkan tersirat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan tetap mudah dipahami. Pengulangan 'anak-anak panah' dipakai sebagai bentuk jamak baku; 'bara' dipilih agar citra panasnya alami tanpa menambahkan kata sifat yang tidak ada dalam teks sumber. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
