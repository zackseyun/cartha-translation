  source_fidelity: Terjemahan secara tepat menyampaikan durasi yang panjang dari רַבַּת dengan “Sudah lama,” verba menetap שָׁכְנָה dengan “tinggal,” serta ungkapan puitis נַפְשִׁי sebagai “jiwaku.” Unsur pronominal feminin לָּהּ memang sulit secara sintaksis dan wajar dipahami resumtif/pleonastis, sehingga tidak perlu dipaksakan menjadi unsur terpisah dalam bahasa Indonesia. “Orang yang membenci kedamaian” dengan setia mencerminkan עִם שׂוֹנֵא שָׁלוֹם.
