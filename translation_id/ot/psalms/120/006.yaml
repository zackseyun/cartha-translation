  terminology: “Jiwaku” mempertahankan diksi puitis Ibrani tanpa mereduksinya menjadi “aku,” sedangkan “kedamaian” merupakan padanan yang wajar bagi שָׁלוֹם dalam konteks penolakan terhadap relasi damai. Catatan kaki secara akurat menandai kemungkinan nuansa “terlalu lama” tanpa menjadikannya makna utama.
