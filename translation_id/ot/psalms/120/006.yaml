  yaml_path: translation/ot/psalms/120/006.yaml
  text: My soul has long dwelt with one who hates peace[a].
translation:
  language: id
  text: Sudah lama jiwaku tinggal bersama orang yang membenci kedamaian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jiwaku sudah terlalu lama tinggal bersama orang yang membenci kedamaian.” Kata pembuka dalam bahasa Ibrani menekankan lamanya waktu dan mungkin juga menyiratkan bahwa waktu itu sudah berlebihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: sudah lama
  rationale: Bentuk ini berfungsi secara adverbial bersama verba berikutnya untuk menyatakan lamanya waktu. “Sudah lama” alami dalam bahasa Indonesia dan tidak menjadikan makna ‘terlalu lama’ eksplisit, meskipun nuansa itu mungkin tersirat.
- source_word: שָׁכְנָה
  choice: tinggal
  rationale: Verba שכן berarti tinggal atau berdiam. “Tinggal” merupakan padanan modern yang alami dan tetap menyampaikan keadaan menetap.
- source_word: לָּהּ
  choice: tidak diterjemahkan secara terpisah; dipahami berkaitan secara resumtif dengan ‘jiwaku’
  rationale: Akhiran pronominal feminin tunggal ini sulit secara sintaksis dan lazim dipahami sebagai unsur resumtif atau pleonastis yang berkaitan dengan נַפְשִׁי. Menerjemahkannya secara terpisah akan menghasilkan bahasa Indonesia yang janggal.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Menjaga gambaran puitis dan tekstur antropologis Ibrani, alih-alih meratakannya menjadi “aku”.
- source_word: עִם
  choice: bersama
  rationale: Menyatakan pergaulan atau hidup berdampingan secara langsung dan alami.
- source_word: שׂוֹנֵא
  choice: orang yang membenci
  rationale: Partisip ini menunjukkan ciri atau sikap yang menetap. Frasa verbal tersebut mempertahankan daya verba ‘membenci’.
- source_word: שָׁלוֹם
  choice: kedamaian
  rationale: Dalam konteks pertentangan dengan permusuhan, “kedamaian” menyampaikan keadaan dan hubungan damai secara alami.
