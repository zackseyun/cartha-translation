  text: I am for peace[a]; but when I speak[b], they are for war.
translation:
  language: id
  text: Aku menghendaki damai[a], tetapi ketika aku berbicara[b], mereka menghendaki perang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah, “aku—damai”; terjemahan ini menyatakan bahwa penutur menghendaki damai.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan ketika aku berbicara”; kata penghubung Ibrani dapat dipahami lebih sederhana, tetapi konteks mendukung makna pertentangan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי שָׁלוֹם
  choice: Aku menghendaki damai
  rationale: Klausa tanpa verba ini secara harfiah berbunyi “aku—damai.” Ungkapan “menghendaki damai” secara alami menyatakan keberpihakan penutur kepada perdamaian tanpa memberi kesan ontologis seperti “aku adalah damai.”
- source_word: וְכִי
  choice: tetapi ketika
  rationale: Gabungan konjungsi dan partikel ini dapat dibaca secara sederhana sebagai “dan ketika,” tetapi pertentangan dengan sikap lawan dalam konteks mendukung “tetapi ketika.”
- source_word: אֲדַבֵּר
  choice: aku berbicara
  rationale: Bentuk piel imperfek orang pertama tunggal dari דבר diterjemahkan sebagai tindakan kini yang umum. Objek seperti “tentang damai” tidak ditambahkan karena tidak tersurat dalam bahasa Ibrani.
- source_word: הֵמָּה לַמִּלְחָמָה
  choice: mereka menghendaki perang
  rationale: Secara eliptis, bahasa Ibrani berbunyi “mereka—untuk perang.” Pengulangan “menghendaki” melengkapi paralelisme dalam bahasa Indonesia dan menyatakan orientasi mereka kepada perang tanpa menambah gagasan bahwa perang sudah berlangsung.
