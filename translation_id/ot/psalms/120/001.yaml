base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/001.yaml
  text: A Song of Ascents. In my distress I called to Yahweh[a], and he answered me.
translation:
  language: id
  text: 'Nyanyian Pendakian.[a]


    Dalam kesesakanku aku berseru kepada Yahweh, dan Ia menjawabku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Judul Ibrani: “Nyanyian Pendakian,” superskripsi tradisional untuk Mazmur 120–134; atau, “Nyanyian Naik.”'
    reason: Menjelaskan status superskripsi dan memberikan alternatif yang lebih dekat dengan makna dasar הַמַּעֲלוֹת tanpa memastikan penafsiran khususnya.
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Pendakian
  rationale: Frasa judul ini secara harfiah menunjuk pada nyanyian yang berkaitan dengan tindakan naik. Bentuk konvensional dan ringkas ini mempertahankan gambaran gerak ke atas tanpa menentukan apakah yang dimaksud ialah ziarah, anak tangga, atau hal lain.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Preposisi אֶל menyatakan arah seruan, sedangkan nama ilahi יהוה dipertahankan sebagai nama pribadi Yahweh, bukan diganti dengan gelar.
- source_word: בַּצָּרָתָה לִּי
  choice: Dalam kesesakanku
  rationale: Ungkapan harfiahnya berarti 'dalam kesesakan bagiku' dan secara alami dinyatakan dalam bahasa Indonesia sebagai 'dalam kesesakanku'; 'kesesakan' menjaga bobot puitis dan intensitas צרה.
- source_word: קָרָאתִי
  choice: aku berseru
  rationale: Dalam konteks doa ketika mengalami kesesakan, 'berseru' menyampaikan tindakan memanggil dengan wajar tanpa menambahkan isi yang tidak terdapat dalam verba Ibrani.
- source_word: וַיַּעֲנֵנִי
  choice: dan Ia menjawab aku
  rationale: Bentuk verba meneruskan urutan tindakan dan memiliki objek orang pertama tunggal. Subjek tersiratnya ialah Yahweh; 'menjawab aku' mempertahankan konstruksi langsung sumber serta gaya puitis.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Subjek tersirat dalam וַיַּעֲנֵנִי
  choice: Ia, yakni Yahweh
  alternative: Tidak menyebut subjek secara eksplisit
  rationale: Bahasa Indonesia memerlukan subjek eksplisit dalam kalimat ini, dan konteks gramatikal mengacu kepada Yahweh. Huruf kapital pada 'Ia' mengikuti ragam kitab suci Indonesia yang bermartabat tanpa menambah gelar teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Nyanyian' dipilih daripada 'lagu' agar sesuai dengan register mazmur; 'kesesakan' dan 'berseru' menjaga nada doa yang khidmat tetapi tetap mudah dipahami.
