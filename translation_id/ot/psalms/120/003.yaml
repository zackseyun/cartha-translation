base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/003.yaml
  text: What will he give to you[a], and what more will he add to you, O deceitful tongue?
translation:
  language: id
  text: Apa yang akan ia berikan kepadamu[a], dan apa lagi yang akan ia tambahkan kepadamu, hai lidah yang menipu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa yang akan ia lakukan terhadapmu, dan apa lagi yang akan ia lakukan terhadapmu, hai lidah yang menipu?” Subjek yang tersirat dapat dipahami secara umum, meskipun banyak penafsir memahaminya dalam konteks ini sebagai Allah yang menjatuhkan hukuman.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: Apa
  rationale: Kata tanya ini membuka pertanyaan retoris; “apa” mempertahankan kelangsungan dan ketidakpastian ungkapan Ibrani.
- source_word: יִתֵּן
  choice: akan diberikan-Nya
  rationale: Bentuk imperfek Qal orang ketiga tunggal dari נתן secara harfiah berarti “akan ia berikan.” Enklitik “-Nya” mempertahankan subjek tersirat tanpa menyebut Allah secara eksplisit.
- source_word: לְךָ
  choice: kepadamu
  rationale: Preposisi ל dengan sufiks orang kedua paling wajar diterjemahkan “kepadamu.”
- source_word: וּמַה יֹסִיף
  choice: dan apa lagi yang akan ditambahkan-Nya
  rationale: Terjemahan ini mempertahankan kesejajaran dengan “diberikan-Nya”; “lagi” menyampaikan daya tambah dari יסף dalam bahasa Indonesia yang alami.
- source_word: לָשׁוֹן
  choice: lidah
  rationale: Makna harfiah “lidah” dipertahankan sebagai metonimia bagi perkataan, sekaligus menjaga gambaran puitis dan sapaan langsung.
- source_word: רְמִיָּה
  choice: penipu
  rationale: Dalam gabungan dengan “lidah,” pilihan ini menyatakan sifat yang menipu secara ringkas dan wajar tanpa mempersempitnya hanya pada kebohongan verbal.
theological_decisions:
- issue: Subjek tersirat dari kata kerja orang ketiga tunggal
  choice: Dipertahankan secara tersirat melalui bentuk “-Nya” dan tidak diidentifikasi dalam teks utama.
  alternative: Menyebut “Allah” secara eksplisit, atau memakai subjek umum “orang.”
  rationale: Bahasa Ibrani tidak menyatakan subjeknya. Konteks dapat mengarah kepada penghukuman Allah, tetapi penerjemahan tidak boleh menutup ambiguitas yang asli.
- issue: Makna idiomatis נתן ... ל dan יסף ... ל
  choice: Makna leksikal “memberikan” dan “menambahkan” dipertahankan dalam teks utama.
  alternative: Menerjemahkannya secara idiomatis sebagai “melakukan terhadap” atau “memperlakukan.”
  rationale: Bacaan harfiah menjaga paralelisme dan ketegangan retoris, sedangkan kemungkinan makna idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan tetap mudah dipahami. Sapaan “hai” mempertahankan gaya apostrof Ibrani. Huruf kapital pada “-Nya” mengikuti kebiasaan bahasa Indonesia untuk kemungkinan rujukan kepada Allah, tetapi nama Allah tidak dimasukkan ke dalam teks.
