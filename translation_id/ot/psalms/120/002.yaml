  yaml_path: translation/ot/psalms/120/002.yaml
  text: O Yahweh[a], deliver my soul from lying lips[b], from a deceitful tongue.
translation:
  language: id
  text: Ya Yahweh, selamatkanlah jiwaku[a] dari bibir dusta[b], dari lidah penuh tipu daya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “jiwaku” juga dapat berarti “aku” atau “nyawaku”.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “dari bibir kepalsuan, dari lidah tipu daya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”; partikel “Ya” secara alami menandai sapaan langsung dalam doa bahasa Indonesia.
- source_word: הַצִּילָה
  choice: lepaskanlah
  rationale: Bentuk imperatif נצל menyatakan permohonan untuk dibebaskan dari ancaman. “Lepaskanlah” alami dalam konteks ini tanpa membatasi ancamannya pada bahaya fisik.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפש dapat menunjuk pada jiwa, nyawa, atau diri seseorang. “Jiwaku” mempertahankan ungkapan Ibrani dan laras puitis, sedangkan keluasan maknanya dijelaskan dalam catatan kaki.
- source_word: מִשְּׂפַת שֶׁקֶר
  choice: dari bibir dusta
  rationale: שׂפה secara harfiah berarti “bibir” dan di sini mewakili perkataan; שׁקר berarti dusta atau kepalsuan. Ungkapan ringkas ini mempertahankan citra dan bentuk puitis teks sumber.
- source_word: מִלָּשׁוֹן רְמִיָּה
  choice: dari lidah penuh tipu daya
  rationale: “Lidah” dipertahankan agar kesejajaran dengan “bibir” tetap tampak. רמיה menyatakan penipuan atau kelicikan; “penuh tipu daya” terdengar alami dan menyampaikan sifat perkataan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Nama pribadi ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga identitas nama dalam teks Ibrani tetap terlihat tanpa memasukkan penafsiran denominasi tertentu.
- issue: Cakupan makna נַפְשִׁי
  choice: jiwaku, dengan catatan alternatif “aku” atau “nyawaku”
  alternative: aku; nyawaku
  rationale: Teks utama mempertahankan ungkapan puitis Ibrani, sementara catatan menjaga keluasan maknanya dan tidak memaksakan pembedaan antropologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern dengan laras doa yang ringkas dan bermartabat. Citra puitis “bibir” dan “lidah” serta kesejajarannya dipertahankan; partikel -lah memperhalus sekaligus menegaskan permohonan.
