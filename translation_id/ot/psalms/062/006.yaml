source:
  edition: WLC
  text: אַךְ ה֣וּא צ֭וּרִ/י וִֽ/ישׁוּעָתִ֑/י מִ֝שְׂגַּבִּ֗/י לֹ֣א אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/006.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: id
  text: Hanya Dialah gunung batuku dan keselamatanku, bentengku; aku tidak akan goyah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “aku tidak akan terguncang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ הוּא
  choice: Hanya Dialah
  rationale: Gabungan partikel penegas-eksklusif אַךְ dan pronomina הוּא menekankan bahwa Allah sajalah sumber keamanan pemazmur. Bentuk ini alami dan tegas dalam bahasa Indonesia.
- source_word: צוּרִי
  choice: gunung batuku
  rationale: צוּר menggambarkan batu besar atau tebing yang kokoh dan melindungi. Ungkapan metaforis “gunung batuku” lazim, puitis, dan mempertahankan citra kestabilan serta perlindungan.
- source_word: וִישׁוּעָתִי
  choice: dan keselamatanku
  rationale: יְשׁוּעָה mencakup keselamatan atau pembebasan. “Keselamatanku” mempertahankan keluasan makna, bukan membatasinya pada pertolongan dari satu bahaya tertentu.
- source_word: מִשְׂגַּבִּי
  choice: bentengku
  rationale: מִשְׂגָּב menunjuk pada tempat tinggi yang aman dan terlindung. “Bentengku” menyampaikan citra pertahanan dan keamanan secara ringkas serta alami.
- source_word: לֹא אֶמּוֹט
  choice: aku tidak akan goyah
  rationale: Bentuk Niphal dari מוֹט menyatakan diguncangkan, digeser, atau menjadi tidak stabil. “Tidak akan goyah” mempertahankan metafora kestabilan dan mengungkapkan keyakinan dengan bahasa Indonesia modern.
theological_decisions:
- issue: Tingkat keyakinan dalam klausa terakhir
  choice: aku tidak akan goyah
  alternative: aku tidak akan terguncang
  rationale: Bahasa Ibrani menyatakan keyakinan pemazmur karena Allah adalah pelindungnya, tanpa perlu dikembangkan menjadi klaim kebal mutlak. “Tidak akan goyah” mempertahankan citra kestabilan dan keteguhan iman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan paralel dan metafora perlindungan dipertahankan, dengan tanda baca yang membantu pembacaan alami.
