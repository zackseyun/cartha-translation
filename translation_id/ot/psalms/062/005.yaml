base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/005.yaml
  text: For God alone[a], be silent, my soul[c][b], for my hope is from him.
translation:
  language: id
  text: Hanya kepada Allah[a], tenanglah, hai jiwaku[b], sebab harapanku dari Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hanya kepada Allah jiwaku menanti dengan tenang,” jika bentuk kata kerjanya dipahami sebagai pernyataan, bukan seruan.'
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “tenanglah” dapat berarti diam, tetap tenang, atau menanti dengan tenang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hanya
  rationale: Partikel ini menandai pembatasan atau penegasan; “hanya” mempertahankan ketergantungan yang tertuju secara eksklusif kepada Allah.
- source_word: לֵאלֹהִים
  choice: bagi Allah
  rationale: Preposisi ל dipertahankan sebagai penanda arah atau orientasi kepada Allah; bersama “hanya”, frasa ini menyatakan bahwa ketenangan jiwa diarahkan kepada Allah semata.
- source_word: דּוֹמִּי
  choice: tenanglah
  rationale: Bentuk ini dipahami sebagai seruan kepada diri sendiri. “Tenanglah” secara alami mencakup gagasan diam dan tetap tenang tanpa secara eksplisit menambahkan kata “menanti”.
- source_word: נַפְשִׁי
  choice: hai jiwaku
  rationale: Mempertahankan idiom Ibrani berupa sapaan pemazmur kepada jiwanya sendiri; partikel “hai” memperjelas sapaan dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: 'Memperkenalkan alasan bagi seruan sebelumnya: jiwa dapat tenang karena harapannya berasal dari Allah.'
- source_word: מִמֶּנּוּ
  choice: dari Dialah
  rationale: Pronomina merujuk kembali kepada Allah. Partikel -lah memberi penegasan alami dalam bahasa Indonesia tanpa menambahkan “saja” yang tidak terdapat pada frasa ini.
- source_word: תִּקְוָתִי
  choice: harapanku
  rationale: Padanan langsung dan alami untuk harapan atau pengharapan yang dinantikan.
theological_decisions:
- issue: Apakah דּוֹמִּי diterjemahkan sebagai pernyataan atau seruan
  choice: 'Seruan: “tenanglah, hai jiwaku”'
  alternative: 'Pernyataan: “jiwaku menanti dengan tenang hanya kepada Allah”'
  rationale: Vokalisasi teks Masoret paling wajar dibaca sebagai bentuk imperatif feminin tunggal yang menyapa נַפְשִׁי. Namun, tradisi penerjemahan juga mengenal pembacaan deskriptif, sehingga alternatif itu dicatat.
- issue: Apakah unsur ‘menanti’ harus dimasukkan ke dalam teks utama
  choice: Tidak ditambahkan; diterjemahkan “tenanglah”
  alternative: “nantikanlah dengan tenang” atau “menantilah dalam diam”
  rationale: Akar דמם terutama menyatakan diam atau tenang. Gagasan menanti sesuai konteks dan mungkin tersirat, tetapi bukan unsur leksikal eksplisit dari verba tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan “hai jiwaku” mempertahankan gaya puitis mazmur, sedangkan “tenanglah” menghindari ungkapan “diamlah” yang dalam pemakaian modern dapat terdengar seperti teguran keras.
