  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
translation:
  language: id
  text: Pada Allah terletak keselamatanku dan kemuliaanku[a]; gunung batu kekuatanku, tempat perlindunganku, ada pada Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kemuliaanku” dapat juga diterjemahkan “kehormatanku”, yakni martabat atau pemulihan nama baik pemazmur.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, bagian awal ayat ini berbunyi, “Pada Allah keselamatanku dan kemuliaanku.” Bahasa Ibrani tidak mencantumkan kata kerja.
    reason: translation_clarity
lexical_decisions:
- source_word: עַל אֱלֹהִים
  choice: Pada Allah terletak
  rationale: עַל menyatakan dasar atau tumpuan. Kata “terletak” melengkapi klausa Ibrani yang tidak memakai kopula sambil mempertahankan gambaran bahwa keselamatan dan kemuliaan pemazmur bertumpu pada Allah.
- source_word: יִשְׁעִי
  choice: keselamatanku
  rationale: Bentuk ini mencakup gagasan penyelamatan, kelepasan, dan kemenangan tanpa mempersempitnya pada satu jenis bahaya.
- source_word: וּכְבוֹדִי
  choice: dan kemuliaanku
  rationale: כָּבוֹד dapat berarti kemuliaan atau kehormatan. “Kemuliaanku” mempertahankan keluasan istilah dan kesejajaran puitisnya.
- source_word: צוּר עֻזִּי
  choice: gunung batu kekuatanku
  rationale: Terjemahan ini mempertahankan metafora צוּר sebagai batu karang besar yang melambangkan kestabilan dan perlindungan, serta menerjemahkan עֹז secara langsung sebagai “kekuatan”.
- source_word: מַחְסִי
  choice: tempat perlindunganku
  rationale: מַחְסֶה menunjuk tempat berlindung atau perlindungan; bentuk ini jelas dan wajar bagi pembaca Indonesia.
- source_word: בֵּאלֹהִים
  choice: ada pada Allah
  rationale: Preposisi בְּ menyatakan bahwa perlindungan pemazmur terdapat atau berakar pada Allah. “Ada” ditambahkan sebagai kopula yang tersirat dalam puisi Ibrani.
theological_decisions:
- issue: Hubungan frasa pembuka dengan klausa nominal tanpa verba
  choice: Menyatakan bahwa keselamatan dan kemuliaan pemazmur terletak pada Allah
  alternative: 'Menerjemahkan secara lebih harfiah: “Pada Allah keselamatanku dan kemuliaanku”'
  rationale: Teks Ibrani bersifat puitis dan tidak mencantumkan kopula. “Terletak” membuat hubungan sintaksisnya alami dalam bahasa Indonesia tanpa menghilangkan gambaran ketergantungan pada Allah.
- issue: Makna כְבוֹדִי
  choice: kemuliaanku
  alternative: kehormatanku
  rationale: Keduanya mungkin secara leksikal. “Kemuliaanku” mempertahankan istilah yang lebih luas, sedangkan catatan kaki menjaga kemungkinan makna kehormatan, martabat, atau pemulihan nama baik pemazmur.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan tetap mudah dipahami. Susunan paralel dipertahankan, dan metafora “gunung batu” tidak dijelaskan secara berlebihan di dalam teks.
