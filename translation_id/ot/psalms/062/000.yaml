  text: 'For the choir director: according to Jeduthun[a]. A psalm of David[b].'
translation:
  language: id
  text: 'Untuk pemimpin musik: menurut Yedutun[a]. Mazmur Daud[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “tentang Yedutun” atau “untuk Yedutun”; frasa ini dapat merujuk pada gaya musik, lagu, atau petunjuk pelaksanaan musik yang berkaitan dengan Yedutun.
    reason: alternative_reading
  - marker: b
    text: Judul “Mazmur Daud” dapat menunjukkan kepengarangan, peruntukan, atau hubungan dengan Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Ungkapan ini alami dalam bahasa Indonesia modern tanpa membatasi tugasnya hanya pada paduan suara.
- source_word: עַל
  choice: menurut
  rationale: Dalam judul mazmur yang diikuti nama diri, kata ini dapat merujuk pada lagu, gaya, atau petunjuk pementasan. 'Menurut' mempertahankan ketidakpastian itu.
- source_word: יְדוּתוּן
  choice: Yedutun
  rationale: Nama diri Ibrani ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; yang dimaksud dapat berupa musikus bernama Yedutun atau lagu/gaya yang dikaitkan dengannya.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah sebutan jenis karya yang baku dan tepat bagi nyanyian dalam kitab Mazmur.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam konstruksi judul 'Mazmur Daud', bentuk ringkas bahasa Indonesia tetap dapat mencakup karya yang ditulis oleh, dipersembahkan kepada, atau dikaitkan dengan Daud, tanpa memaksakan satu pengertian.
theological_decisions:
- issue: Makna לְדָוִד dalam judul mazmur
  choice: Mazmur Daud
  alternative: '''Mazmur oleh Daud'' atau ''Mazmur untuk Daud'''
  rationale: Preposisi Ibrani לְ dapat menyatakan kepengarangan, peruntukan, kepemilikan, atau hubungan. Bentuk 'Mazmur Daud' mempertahankan keluasan makna tersebut dan tidak memutuskan persoalan sejarah yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat sebagai judul liturgis. 'Pemimpin pujian' dipilih daripada 'pemimpin paduan suara' agar tidak mempersempit לַמְנַצֵּחַ pada paduan suara saja. Semua penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
