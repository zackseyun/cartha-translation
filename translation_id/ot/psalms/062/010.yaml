source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ בְ/עֹשֶׁק֮ וּ/בְ/גָזֵ֪ל אַל תֶּ֫הְבָּ֥לוּ חַ֤יִל כִּֽי יָנ֑וּב אַל תָּשִׁ֥יתוּ לֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: id
  text: Janganlah percaya pada penindasan, dan janganlah menaruh harapan sia-sia pada perampasan[a]. Jika kekayaan bertambah, janganlah menaruh hati padanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan menjadi sia-sia dalam perampasan,” atau “jangan bermegah dalam perampasan.” Kata kerja Ibrani ini sulit dipastikan dan dapat mengandung arti bertindak sia-sia atau menaruh harapan pada sesuatu yang hampa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: percaya kepada
  rationale: Kata בטח menyatakan kepercayaan atau keyakinan yang ditaruh pada sesuatu; frasa ini alami dalam bahasa Indonesia dan mempertahankan gambaran ketergantungan pada sarana yang tidak adil.
- source_word: בְעֹשֶׁק
  choice: kepada penindasan
  rationale: עֹשֶׁק mencakup penindasan dan eksploitasi, kadang-kadang pemerasan. 'Penindasan' mempertahankan cakupan etisnya tanpa mempersempit makna hanya pada pemerasan uang.
- source_word: בְגָזֵל
  choice: pada perampasan
  rationale: גָזֵל menunjuk pada perampokan, rampasan, atau sesuatu yang direbut dengan paksa. 'Perampasan' sesuai dengan bentuk abstrak dalam rangkaian larangan dan sejajar dengan 'penindasan'.
- source_word: תֶּהְבָּלוּ
  choice: menaruh harapan sia-sia
  rationale: Bentuk dari הבל sulit ditafsirkan dan dapat menyatakan bertindak sia-sia, menjadi kosong, atau berharap pada sesuatu yang hampa. Pilihan ini alami dan cocok dengan paralelisme, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: חַיִל
  choice: kekayaan
  rationale: חַיִל dapat berarti kekuatan, kemampuan, sumber daya, atau kekayaan. Dalam hubungan dengan kata kerja 'bertambah', kekayaan materi paling sesuai dengan konteks.
- source_word: כִּי יָנוּב
  choice: jika kekayaan bertambah
  rationale: נוב secara harfiah menggambarkan bertunas atau berkembang. Bersama חַיִל, ungkapan ini berarti kekayaan bertambah; 'jika' mempertahankan nuansa kondisional כִּי yang sesuai konteks.
- source_word: תָּשִׁיתוּ לֵב
  choice: menaruh hati padanya
  rationale: Idiom שׁית לב berarti mengarahkan atau melekatkan hati pada sesuatu. Terjemahan ini mempertahankan citra hati sebagai pusat hasrat dan kebergantungan.
theological_decisions:
- issue: Makna larangan pada bagian tengah ayat
  choice: Larangan untuk menaruh harapan yang sia-sia pada perampasan
  alternative: Jangan menjadi sia-sia karena perampasan; atau jangan bermegah dalam perampasan
  rationale: Kata kerja תֶּהְבָּלוּ memiliki makna yang sulit dipastikan. Terjemahan utama mengikuti kemungkinan ketergantungan pada sesuatu yang hampa dan cocok dengan paralelisme, tetapi catatan kaki mempertahankan kemungkinan bahwa larangan itu menyangkut kesia-siaan atau kebanggaan dalam perampasan.
- issue: Hubungan antara kekayaan tidak adil dan kekayaan secara umum
  choice: Dua larangan pertama menyangkut sarana yang tidak adil, lalu larangan terakhir berlaku pada kekayaan yang bertambah tanpa menentukan asalnya
  alternative: Seluruh ayat hanya membicarakan kekayaan yang diperoleh secara tidak adil
  rationale: Kolon terakhir hanya menyebut חַיִל, 'kekayaan/sumber daya', tanpa secara eksplisit membatasinya pada hasil penindasan atau perampasan. Terjemahan tidak menambahkan pembatas tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pengulangan 'janganlah' mempertahankan corak puitis serta susunan tiga larangan. 'Menaruh hati padanya' sengaja mempertahankan idiom antropologis Ibrani dan tetap mudah dipahami.
