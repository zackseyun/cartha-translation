source:
  edition: WLC
  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: id
  text: 'Sungguh, manusia hanyalah embusan napas;

    orang-orang hanyalah kepalsuan.[a]


    Pada neraca mereka terangkat;

    bersama-sama mereka lebih ringan daripada embusan napas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kedua ungkapan Ibrani itu berarti “anak-anak Adam” (atau “anak-anak manusia”) dan “anak-anak orang.” Keduanya juga dapat ditafsirkan sebagai “orang biasa” dan “orang terkemuka.”
    reason: Menjelaskan perbedaan leksikal dalam kedua ungkapan Ibrani serta mempertahankan pembacaan alternatif mengenai dua lapisan sosial tanpa memastikannya dalam teks utama.
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini menegaskan pernyataan pemazmur; “sungguh” menyampaikan daya penegasannya secara alami dalam bahasa Indonesia.
- source_word: הֶבֶל
  choice: embusan napas
  rationale: Kata ini menggambarkan sesuatu yang cepat lenyap dan tidak berbobot. “Embusan napas” mempertahankan gambaran konkret yang juga mendukung perbandingan dengan neraca.
- source_word: בְּנֵי אָדָם
  choice: manusia
  rationale: Ungkapan harfiahnya adalah “anak-anak manusia/Adam.” Dalam bahasa Indonesia, “manusia” menyampaikan rujukan kolektifnya tanpa menimbulkan kesan keliru bahwa yang dimaksud hanya anak-anak secara usia.
- source_word: כָּזָב
  choice: kebohongan
  rationale: Nomina ini berarti dusta, kepalsuan, atau sesuatu yang tidak dapat diandalkan. “Kebohongan” mempertahankan bentuk nominal dan penilaian puitis yang tajam.
- source_word: בְּנֵי אִישׁ
  choice: orang-orang
  rationale: Ungkapan ini secara harfiah memakai kata lain untuk manusia daripada frasa sebelumnya. “Orang-orang” mempertahankan sedikit perbedaan leksikal tanpa memastikan bahwa frasa ini menunjuk golongan sosial tertentu.
- source_word: בְּמֹאזְנַיִם
  choice: Di atas neraca
  rationale: Nomina bentuk dual ini menunjuk alat penimbang. “Di atas neraca” merupakan ungkapan alami dan mempertahankan gambaran penimbangan.
- source_word: לַעֲלוֹת
  choice: mereka terangkat
  rationale: Kata kerjanya secara harfiah berarti naik. Dalam gambaran neraca, sisi yang memuat mereka terangkat karena mereka tidak berbobot; bentuk ini mempertahankan metafora tersebut.
- source_word: מֵהֶבֶל
  choice: lebih ringan daripada embusan napas
  rationale: Preposisi ini berfungsi komparatif dalam konteks penimbangan. Penambahan “lebih ringan” mengungkapkan perbandingan yang tersirat dan menyatukannya dengan citra neraca.
- source_word: יָחַד
  choice: bersama-sama
  rationale: 'Kata ini menyatakan keseluruhan secara kolektif: semua yang disebut itu, bila digabungkan sekalipun, tetap tidak berbobot.'
theological_decisions:
- issue: Penafsiran pasangan בְּנֵי אָדָם dan בְּנֵי אִישׁ
  choice: Menerjemahkannya sebagai “manusia” dan “orang-orang,” dengan penjelasan dalam catatan kaki.
  alternative: “Orang biasa” dan “orang terkemuka.”
  rationale: Bahasa Ibrani memakai dua ungkapan sejajar dengan dua kata berbeda untuk manusia, tetapi tidak secara eksplisit menyebut golongan rendah dan tinggi. Teks utama tidak memastikan penafsiran kelas sosial, sementara catatan kaki mempertahankannya sebagai kemungkinan.
translation_notes:
  register: Bahasa puitis modern dan bermartabat. Baris-baris pendek mempertahankan kesejajaran Ibrani. “Embusan napas” dipakai secara konsisten, sedangkan “terangkat” menjaga gambaran konkret sisi neraca yang naik karena muatannya tidak berbobot.
