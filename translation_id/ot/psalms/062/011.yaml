  text: אַחַ֤ת דִּבֶּ֬ר אֱלֹהִ֗ים שְׁתַּֽיִם ז֥וּ שָׁמָ֑עְתִּי כִּ֥י עֹ֝֗ז לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: id
  text: 'Satu hal telah difirmankan Allah[a]; dua hal telah kudengar: bahwa kekuatan adalah milik Allah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sekali Allah telah berfirman; dua kali aku mendengar hal ini.” Ungkapan Ibrani ini dapat dipahami secara adverbial (“sekali/dua kali”) atau sebagai pola pepatah bilangan (“satu hal/dua hal”).
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: Satu hal
  rationale: Bilangan feminin tunggal ini berarti “satu”. Dalam pasangan dengan שְׁתַּיִם, pilihan ini mempertahankan bentuk retoris “satu ... dua”, sambil memasok “hal” agar wajar dalam bahasa Indonesia.
- source_word: דִּבֶּר
  choice: telah ... firmankan
  rationale: Bentuk perfektif menyatakan tuturan yang sudah disampaikan dan tetap relevan. “Berfirman” sesuai untuk ujaran Allah dalam ragam Alkitab Indonesia yang tetap alami dan bermartabat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini bermakna tunggal dalam konteks tersebut dan menunjuk kepada Allah Israel.
- source_word: שְׁתַּיִם
  choice: dua hal
  rationale: Bersama אַחַת, kata ini paling mungkin membentuk pola pepatah bilangan “satu hal ... dua hal”. Kata “hal” ditambahkan demi kelancaran bahasa Indonesia.
- source_word: זוּ
  choice: tidak diterjemahkan secara terpisah
  rationale: Unsur penunjuk ini menunjuk pada isi yang menyusul dan secara alami telah tercakup dalam ungkapan “dua hal ... bahwa”.
- source_word: שָׁמַעְתִּי
  choice: telah kudengar
  rationale: Bentuk perfektif diterjemahkan dengan “telah” untuk menyatakan tindakan yang selesai tetapi hasilnya tetap dipegang oleh pemazmur.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini kata tersebut memperkenalkan isi yang didengar.
- source_word: עֹז
  choice: kekuatan
  rationale: Kata benda ini berarti kekuatan atau keperkasaan; “kekuatan” jelas dan mempertahankan cakupan leksikal dasarnya.
- source_word: לֵאלֹהִים
  choice: adalah milik Allah
  rationale: Preposisi לְ di sini menandai kepemilikan atau pengaitan. Ungkapan ini menyatakan bahwa kekuatan merupakan milik atau prerogatif Allah.
theological_decisions:
- issue: Ungkapan bilangan “satu ... dua”
  choice: Satu hal telah Allah firmankan; dua hal telah kudengar
  alternative: Sekali Allah telah berfirman; dua kali aku mendengar hal ini
  rationale: Bahasa Ibrani memungkinkan pembacaan adverbial “sekali/dua kali” maupun pola pepatah bilangan “satu hal/dua hal”. Teks utama memakai pola pepatah karena sesuai dengan susunan paralel dan klausa isi yang menyusul, sedangkan ambiguitas aslinya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Inversi “telah Allah firmankan” menjaga fokus awal pada “satu hal” dan kesejajaran dengan “dua hal telah kudengar”; bentuk terikat “kudengar” tetap lazim dalam puisi dan teks Alkitab.
