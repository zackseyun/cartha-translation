  text: Hanya Dialah batu karangku dan keselamatanku, bentengku; aku tidak akan terguncang hebat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Hanya
  rationale: 'Dalam konteks ini partikel tersebut menandai pembatasan: Allah adalah satu-satunya sumber keamanan. “Hanya” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.'
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina orang ketiga tunggal maskulin merujuk kepada Allah. Bentuk “Dialah” menyatu secara wajar dengan penekanan eksklusif dari אַךְ.
- source_word: צוּרִי
  choice: gunung batuku
  rationale: צוּר menunjuk pada batu besar atau tebing dan secara metaforis menggambarkan kestabilan serta perlindungan. “Gunung batuku” mempertahankan metafora alkitabiah yang dikenal dalam bahasa Indonesia.
- source_word: וִישׁוּעָתִי
  choice: dan keselamatanku
  rationale: יְשׁוּעָה dapat berarti keselamatan atau pembebasan. “Keselamatanku” cukup luas untuk mencakup pertolongan dan pembebasan dalam konteks mazmur ini.
- source_word: מִשְׂגַּבִּי
  choice: bentengku
  rationale: מִשְׂגָּב adalah tempat tinggi yang aman atau kubu perlindungan. “Bentengku” mempertahankan citra pertahanan dan terdengar alami.
- source_word: לֹא אֶמּוֹט
  choice: aku tidak akan terguncang
  rationale: Bentuk verba ini menyatakan digoyahkan, terhuyung, atau kehilangan kestabilan. “Tidak akan terguncang” mempertahankan metafora keteguhan dengan bahasa Indonesia modern.
- source_word: רַבָּה
  choice: hebat
  rationale: Kata ini berfungsi secara adverbial untuk menyatakan derajat guncangan. Dalam frasa “terguncang hebat”, kata “hebat” secara alami berarti sangat atau kuat, bukan sepenuhnya meniadakan kemungkinan adanya guncangan.
theological_decisions:
- issue: Derajat keamanan dalam klausa penutup
  choice: aku tidak akan terguncang hebat
  alternative: aku tidak akan terguncang
  rationale: Teks Ibrani memuat רַבָּה sebagai penanda derajat. Mempertahankannya menjaga nuansa bahwa pemazmur tidak akan terguncang secara besar atau parah dan menghindari penyelarasan diam-diam dengan pernyataan serupa yang lebih mutlak di bagian lain mazmur.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan paralel dipertahankan, dengan metafora batu dan benteng tetap terlihat jelas. Tidak diperlukan catatan kaki karena penanda derajat רַבָּה diterjemahkan langsung dalam teks utama.
