  text: בִּטְח֘וּ ב֤/וֹ בְ/כָל עֵ֨ת עָ֗ם שִׁפְכֽוּ לְ/פָנָ֥י/ו לְבַבְ/כֶ֑ם אֱלֹהִ֖ים מַחֲסֶה לָּ֣/נוּ סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: id
  text: Percayalah kepada-Nya setiap waktu[a], hai umat; curahkanlah isi hati kalian di hadapan-Nya[b]. Allah adalah tempat perlindungan bagi kita. Sela[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada setiap waktu”; dapat juga berarti “senantiasa.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “curahkanlah isi hati kalian” menerjemahkan bentuk jamak Ibrani dan berarti mengungkapkan pikiran, perasaan, serta keinginan batin dengan terbuka di hadapan Allah.
    reason: lexical_alternative
  - marker: c
    text: “Sela” mungkin merupakan istilah liturgis atau musikal, tetapi arti tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: Percayalah kepada-Nya
  rationale: Bentuk perintah jamak dari בטח menyatakan kepercayaan atau keyakinan kepada Allah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arah relasionalnya.
- source_word: בְכָל־עֵת
  choice: setiap waktu
  rationale: Secara dekat berarti 'pada setiap waktu' dan menyatakan kepercayaan yang berlaku terus dalam segala keadaan.
- source_word: עָם
  choice: hai umat
  rationale: Kata ini berfungsi sebagai sapaan langsung kepada komunitas. 'Umat' mempertahankan dimensi komunal tanpa mempersempitnya menjadi bangsa politis.
- source_word: שִׁפְכוּ ... לְבַבְכֶם
  choice: curahkanlah isi hatimu
  rationale: Metafora harfiahnya adalah 'tuangkanlah hatimu'. Dalam bahasa Indonesia, 'mencurahkan isi hati' secara alami menyampaikan pengungkapan pikiran, perasaan, dan keinginan batin secara terbuka. Bentuk '-mu' dapat menyapa umat secara kolektif, sebagaimana kata ganti jamak Ibrani.
- source_word: לְפָנָיו
  choice: di hadapan-Nya
  rationale: Menyampaikan arti berada di depan atau dalam hadirat Allah dengan ungkapan Indonesia yang wajar dan khidmat.
- source_word: אֱלֹהִים מַחֲסֶה לָנוּ
  choice: Allah adalah tempat perlindungan bagi kita
  rationale: מַחֲסֶה menunjuk tempat berlindung atau perlindungan. Bentuk ini jelas dan alami, sedangkan לָנוּ menyatakan manfaat bagi komunitas.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal ini dipertahankan melalui transliterasi karena arti tepatnya tidak diketahui.
theological_decisions:
- issue: Sapaan komunal עָם
  choice: Diterjemahkan sebagai sapaan langsung 'hai umat'.
  alternative: '''orang-orang'' atau ''bangsa'' tanpa penandaan vokatif'
  rationale: Letaknya setelah rangkaian perintah mendukung fungsi vokatif dan mempertahankan sifat komunal dari ajakan untuk percaya.
- issue: Cakupan kata ganti pada לְבַבְכֶם
  choice: Menggunakan 'isi hatimu' sebagai sapaan kolektif kepada umat.
  alternative: '''isi hati kalian'' atau ''hati kamu sekalian'''
  rationale: Sumber memakai kata ganti orang kedua jamak. Dalam bahasa Indonesia baku, '-mu' dapat merujuk kepada kelompok yang disapa sebagai satu umat; catatan menjelaskan bentuk jamaknya agar cakupan sumber tetap transparan.
- issue: Makna סֶלָה
  choice: Dipertahankan sebagai 'Sela'.
  alternative: '''jeda'' atau ''selingan musik'''
  rationale: Karena fungsi tepat istilah ini tidak pasti, penerjemahan interpretatif akan menyatakan kepastian yang tidak terdapat dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme puitis serta sapaan komunal dipertahankan. Kapitalisasi kata ganti ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia, tanpa menambah unsur yang tidak ada dalam teks sumber.
