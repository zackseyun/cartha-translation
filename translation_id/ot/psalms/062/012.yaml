  text: וּ/לְ/ךָֽ אֲדֹנָ֥/י חָ֑סֶד כִּֽי אַתָּ֨ה תְשַׁלֵּ֖ם לְ/אִ֣ישׁ כְּֽ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/012.yaml
  text: And to you[a], O Lord, belongs steadfast love[b], for you repay each man according to his work.
translation:
  language: id
  text: 'Dan milik-Mulah, ya Tuhan, kasih setia,

    sebab Engkau membalas setiap orang sesuai dengan perbuatannya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְךָ
  choice: Dan milik-Mulah
  rationale: Frasa berpreposisi yang ditempatkan di depan menyatakan kepunyaan dengan penekanan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penekanan bahwa kasih setia adalah milik Tuhan.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: Gelar ilahi Adonai digunakan sebagai sapaan langsung dalam puisi dan doa; “ya Tuhan” merupakan padanan Indonesia yang wajar dan khidmat.
- source_word: חָסֶד
  choice: kasih setia
  rationale: Istilah ini mencakup kasih, kemurahan, dan kesetiaan dalam hubungan perjanjian. “Kasih setia” merupakan padanan ringkas yang mempertahankan unsur kasih sekaligus loyalitas.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan atau dasar bagi pernyataan sebelumnya.
- source_word: תְשַׁלֵּם
  choice: membalas
  rationale: Bentuk piel dari שלם menyatakan pemberian balasan yang sepadan, baik positif maupun negatif. “Membalas” tidak membatasi maknanya hanya pada pahala.
- source_word: לְאִישׁ
  choice: setiap orang
  rationale: Nomina maskulin tunggal אִישׁ berfungsi secara representatif dan, bersama konteks distributifnya, menunjuk kepada tiap manusia. “Setiap orang” mengungkapkan cakupan generiknya secara alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: כְּמַעֲשֵׂהוּ
  choice: sesuai dengan perbuatannya
  rationale: Frasa ini menyatakan kesepadanan balasan dengan perbuatan seseorang. “Perbuatannya” mempertahankan bentuk tunggal dan lebih alami daripada “pekerjaannya” dalam konteks penghakiman moral.
theological_decisions:
- issue: Hubungan antara kasih setia Allah dan pembalasan menurut perbuatan
  choice: 'Mempertahankan keduanya tanpa memperlunak salah satunya: kasih setia Tuhan dinyatakan berdampingan dengan tindakan-Nya membalas setiap orang sesuai dengan perbuatannya.'
  alternative: Menafsirkan חָסֶד hanya sebagai belas kasihan, atau menerjemahkan תְשַׁלֵּם hanya sebagai memberi pahala.
  rationale: Teks sendiri menempatkan kasih setia dan pembalasan yang adil dalam satu pernyataan. Terjemahan tidak seharusnya menghapus ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, puitis, khidmat, dan mudah dipahami. Inversi “milik-Mulah” mempertahankan penekanan klausa Ibrani yang tanpa verba; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
