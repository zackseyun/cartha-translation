id: PSA.62.4
reference: Psalms 62:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: id
  text: Mereka hanya bersekongkol untuk menjatuhkan dia dari kedudukannya yang tinggi[a]; mereka menyukai dusta. Dengan mulut mereka memberkati, tetapi dalam hati mereka mengutuk[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari martabatnya,” “dari keluhurannya,” atau “dari kedudukannya yang terhormat.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani secara harfiah berbunyi “dengan mulutnya mereka memberkati”; kemungkinan besar maksudnya bersifat kolektif: secara lahiriah mereka memberkati, tetapi dalam hati mereka mengutuk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: hanya
  rationale: Partikel ini membatasi maksud para lawan pada tindakan yang menyusul; “hanya” menyampaikan daya restriktifnya secara wajar.
- source_word: מִשְּׂאֵתוֹ
  choice: dari kedudukannya yang tinggi
  rationale: Nomina שְׂאֵת dapat menunjuk pada ketinggian, keluhuran, martabat, atau kedudukan terhormat. Pilihan ini mempertahankan citra menjatuhkan seseorang tanpa menentukan secara berlebihan apakah yang dimaksud terutama status sosial atau kehormatan.
- source_word: יָעֲצוּ
  choice: bersekongkol
  rationale: Dalam konteks permusuhan, verba ini menyatakan berembuk atau menyusun rencana bersama. “Bersekongkol” secara alami menyampaikan unsur perencanaan yang jahat.
- source_word: לְהַדִּיחַ
  choice: untuk menjatuhkan dia
  rationale: Bentuk kausatif נדח berarti menyebabkan seseorang tersingkir, terdorong, atau jatuh. “Menjatuhkan” selaras dengan gambaran sasaran yang berada pada suatu ketinggian atau kedudukan.
- source_word: יִרְצוּ כָזָב
  choice: mereka menyukai dusta
  rationale: רצה dengan כָּזָב menyatakan berkenan atau bersuka pada kepalsuan. “Menyukai dusta” jelas, alami, dan tidak mempersempitnya menjadi satu kebohongan tertentu.
- source_word: בְּפִיו יְבָרֵכוּ
  choice: Dengan mulut mereka memberkati
  rationale: 'Bentuk Ibraninya secara harfiah memakai sufiks tunggal, “dengan mulutnya,” tetapi kesejajaran dengan bentuk jamak “dalam batin mereka” dan subjek jamak mendukung pengertian kolektif: ucapan lahiriah mereka memberkati.'
- source_word: וּבְקִרְבָּם
  choice: tetapi dalam hati mereka
  rationale: Secara harfiah berarti “di bagian dalam mereka.” “Dalam hati mereka” merupakan ungkapan Indonesia yang alami bagi sikap batin dan mempertahankan kontras dengan mulut.
- source_word: יְקַלְלוּ
  choice: mereka mengutuk
  rationale: Pilihan langsung ini mempertahankan pertentangan tajam antara memberkati dan mengutuk.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal ini tidak pasti maknanya; transliterasi menghindari tafsiran yang terlalu tegas.
theological_decisions:
- issue: Rujukan sufiks tunggal pada “kedudukannya” dan objek verba “menjatuhkan”
  choice: Mempertahankan sasaran laki-laki tunggal dengan “dia” dan “-nya.”
  alternative: Memakai ungkapan generik seperti “seseorang,” atau menekankan “martabatnya” alih-alih kedudukannya.
  rationale: Teks Ibrani memakai sufiks maskulin tunggal dan konteks mazmur menunjuk pada seorang sasaran tertentu. Terjemahan ini mempertahankan rujukan personal tanpa menetapkannya sebagai tokoh teologis tertentu.
- issue: Ketidaksesuaian gramatikal pada frasa “dengan mulutnya mereka memberkati”
  choice: 'Menerjemahkan menurut pengertian kolektif: “Dengan mulut mereka memberkati.”'
  alternative: Mempertahankan secara harfiah “Dengan mulutnya mereka memberkati.”
  rationale: Bentuk harfiah memang tunggal, tetapi subjek dan pasangan antitetisnya berbentuk jamak. Bacaan kolektif menghasilkan makna kontekstual yang paling masuk akal, sementara bentuk Ibrani dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Bersekongkol” memperjelas konteks permusuhan tanpa menambah pelaku atau motif baru; “Sela” dipertahankan sebagai transliterasi tradisional.
