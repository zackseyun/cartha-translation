  text: אַ֣ךְ אֶל אֱ֭לֹהִים דּֽוּמִיָּ֣ה נַפְשִׁ֑/י מִ֝מֶּ֗/נּוּ יְשׁוּעָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: id
  text: Hanya kepada Allah jiwaku berdiam diri[a]; dari Dialah keselamatanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hanya kepada Allah jiwaku menanti dalam diam,” atau “Hanya dalam Allah jiwaku beristirahat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hanya
  rationale: 'Menjaga daya pembatas dan penekanan partikel Ibrani: orientasi jiwa pemazmur tertuju secara khusus kepada Allah.'
- source_word: אֶל
  choice: kepada
  rationale: Menyatakan arah atau orientasi jiwa kepada Allah; 'kepada' alami dalam bahasa Indonesia dan tidak memaksakan tafsiran menunggu atau beristirahat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks tunggal ini, kata tersebut menunjuk kepada Allah Israel; 'Allah' adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: דּוּמִיָּה
  choice: berdiam diri
  rationale: Mempertahankan gambaran utama tentang diam atau keheningan dalam bentuk predikatif yang wajar, sambil tidak meniadakan nuansa menanti dengan tenang atau beristirahat.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Mempertahankan ungkapan puitis tentang diri batin atau keseluruhan pribadi tanpa mempersempitnya menjadi konsep psikologis modern.
- source_word: מִמֶּנּוּ
  choice: dari Dialah
  rationale: Menandai Allah sebagai sumber keselamatan. Partikel '-lah' menghasilkan penekanan alami dalam bahasa Indonesia dan selaras dengan daya eksklusif אַךְ tanpa menambahkan kata 'saja' secara berlebihan.
- source_word: יְשׁוּעָתִי
  choice: keselamatanku
  rationale: Padanan yang sesuai dengan laras teologis mazmur dan tetap mencakup pengertian pembebasan konkret.
theological_decisions:
- issue: Makna frasa דּוּמִיָּה נַפְשִׁי
  choice: Pernyataan bahwa jiwa diam dengan tenang kepada Allah
  alternative: Jiwaku menanti dalam diam kepada Allah; jiwaku beristirahat dalam Allah
  rationale: Nomina Ibrani dapat menunjuk pada keheningan, ketenangan, atau penantian yang tenang. Teks utama mempertahankan citra diam, sedangkan catatan kaki menjaga kemungkinan nuansa menanti dan beristirahat tanpa menetapkan salah satunya sebagai satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan bermartabat. Susunan klausa mengikuti gerak puisi Ibrani, tetapi tetap alami bagi pembaca umum. Kapitalisasi pronomina ilahi pada 'Dialah' mengikuti kebiasaan umum penerbitan Alkitab Indonesia.
