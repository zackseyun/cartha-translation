id: PSA.136.19
reference: Psalms 136:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ֭/סִיחוֹן מֶ֣לֶךְ הָ/אֱמֹרִ֑י כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/019.yaml
  text: Sihon[a], king of the Amorites[c][b], for his steadfast love endures forever.
translation:
  language: id
  text: Sihon[a], raja orang Amori, sebab kasih setia-Nya[b] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani terdapat kata depan yang menghubungkan “Sihon” sebagai objek dengan tindakan “membunuh raja-raja yang mulia” pada ayat sebelumnya.
    reason: previous_rendering
  - marker: b
    text: Atau “belas kasih-Nya” atau “kesetiaan-Nya pada perjanjian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: Sihon
  rationale: Preposisi לְ menandai Sihon sebagai objek yang meneruskan tindakan pada ayat sebelumnya. Dalam bahasa Indonesia, objek langsung tidak memerlukan preposisi, sehingga nama itu ditampilkan tanpa kata depan agar hubungan sintaksisnya tetap alami.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: raja orang Amori
  rationale: מֶלֶךְ adalah gelar 'raja', sedangkan bentuk gentilik tunggal הָאֱמֹרִי secara idiomatis menunjuk kepada bangsa yang diperintahnya; 'orang Amori' merupakan ungkapan kolektif yang wajar dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Dalam refrein Mazmur 136, כִּי memperkenalkan dasar pujian. 'Sebab' mempertahankan hubungan tersebut dengan gaya yang ringkas dan khidmat.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Bahasa Indonesia dapat mempertahankan klausa nominal Ibrani tanpa menambahkan verba eksplisit.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan kemurahan yang teguh. 'Kasih setia' mempertahankan keluasan makna itu dan sudah alami dalam ragam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna חֶסֶד dalam refrein Mazmur 136
  choice: kasih setia-Nya
  alternative: belas kasih-Nya; kesetiaan-Nya pada perjanjian
  rationale: '''Kasih setia'' menjaga perpaduan kasih dan loyalitas yang terkandung dalam חֶסֶד tanpa membatasinya hanya pada belas kasihan atau menjadikan unsur perjanjian lebih eksplisit daripada teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur penggalan kalimat dipertahankan karena ayat ini secara puitis melanjutkan tindakan pada ayat sebelumnya; refrein diterjemahkan secara konsisten sebagai klausa nominal.
