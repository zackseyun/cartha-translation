  naturalness: “Bagi Dia yang memukul Mesir di antara anak-anak sulung mereka” tetap mempertahankan bentuk litani dan register khidmat, sambil terdengar lebih wajar daripada “memukul Mesir pada anak-anak sulung mereka.” Refrein “sebab kasih setia-Nya untuk selama-lamanya” sudah alami dan sesuai untuk mazmur.
  terminology: “Mesir,” “anak-anak sulung,” dan “kasih setia-Nya” tepat. Kapitalisasi rujukan ilahi konsisten dengan gaya draf. Catatan kaki perlu menyebut alternatif yang benar-benar mencerminkan ambiguitas בְּ, dan frasa harfiahnya lebih tepat “di/dengan,” bukan “pada/dengan.”
