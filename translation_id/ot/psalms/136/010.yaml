  text: To him who struck Egypt in their firstborn[a], for his steadfast love endures forever.
translation:
  language: id
  text: Bagi Dia yang memukul Mesir di antara anak-anak sulung mereka[a], sebab kasih setia-Nya untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pada anak-anak sulung mereka” atau “dengan anak-anak sulung mereka”; secara lebih eksplisit, “dengan memukul anak-anak sulung mereka.” Secara harfiah, bahasa Ibrani berbunyi “di/dengan anak-anak sulung mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Bagi Dia yang memukul
  rationale: Prefiks לְ melanjutkan susunan litani dengan makna datif, sedangkan partisipel מַכֵּה berfungsi secara verbal. Ungkapan ini mempertahankan arah pujian kepada Allah dan memakai bahasa Indonesia yang lugas.
- source_word: מִצְרַיִם
  choice: Mesir
  rationale: Padanan baku untuk nama tempat sekaligus bangsa tersebut.
- source_word: בִּבְכוֹרֵיהֶם
  choice: pada anak-anak sulung mereka
  rationale: Kata depan בְּ dapat menunjuk pada ranah atau sasaran pukulan, dan bentuk ini mempertahankan kekompakan serta sebagian ambiguitas ungkapan Ibrani tanpa memastikan makna instrumental. Bentuk jamak 'mereka' mencerminkan sufiks Ibrani dan merujuk kepada orang Mesir.
- source_word: כִּי
  choice: sebab
  rationale: Dalam mazmur ini כִּי memperkenalkan refrein yang memberikan dasar bagi pujian; 'sebab' wajar dan jelas dalam bahasa Indonesia.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir dan membentuk refrein yang alami dalam bahasa Indonesia.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih yang teguh, kesetiaan, dan komitmen relasional. 'Kasih setia' mempertahankan keluasan itu tanpa membatasinya hanya pada belas kasihan.
theological_decisions:
- issue: Penggambaran penghakiman Allah atas anak-anak sulung Mesir tanpa melunakkan teks
  choice: Mempertahankan pernyataan langsung bahwa Allah memukul Mesir pada anak-anak sulung mereka di dalam refrein pujian.
  alternative: Menguraikannya sebagai 'dengan membunuh anak-anak sulung mereka' atau memakai parafrasa yang memperhalus tindakan penghakiman.
  rationale: Ayat Ibrani menempatkan tindakan penghakiman ini berdampingan dengan kasih setia Allah. Terjemahan tidak melunakkan ketegangan tersebut, tetapi juga tidak menambahkan kata kerja atau penjelasan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur 'Bagi Dia yang ...' mempertahankan bentuk litani mazmur. Kapitalisasi 'Dia' dan '-Nya' menandai rujukan kepada Allah, sedangkan catatan kaki mempertahankan ketidakpastian fungsi kata depan Ibrani.
