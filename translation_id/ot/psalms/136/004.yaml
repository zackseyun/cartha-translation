  text: to him who alone does great wonders[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: kepada Dia yang seorang diri melakukan keajaiban-keajaiban besar[a], sebab kasih setia-Nya[b] berlangsung selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbuatan-perbuatan ajaib yang besar.”
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani hesed, yang mencakup kasih yang teguh dan setia; dapat juga diterjemahkan “belas kasih” atau “kesetiaan perjanjian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: kepada Dia yang melakukan
  rationale: Prefiks לְ melanjutkan pola datif liturgis mazmur ini, sedangkan bentuk partisip עֹשֵׂה menyatakan pelaku yang dikenal melalui tindakan-Nya.
- source_word: נִפְלָאוֹת גְּדֹלוֹת
  choice: keajaiban-keajaiban besar
  rationale: נִפְלָאוֹת menunjuk pada tindakan luar biasa yang membangkitkan rasa takjub, dan גְּדֹלוֹת menerangkan kebesarannya.
- source_word: לְבַדּוֹ
  choice: sendirian
  rationale: Ungkapan ini menekankan bahwa hanya Allah yang melakukan keajaiban-keajaiban tersebut; 'sendirian' mempertahankan penekanan eksklusif itu tanpa menambahkan penafsiran.
- source_word: כִּי
  choice: sebab
  rationale: Dalam refrein Mazmur 136, כִּי memperkenalkan dasar bagi pujian dan ucapan syukur.
- source_word: לְעוֹלָם
  choice: kekal untuk selama-lamanya
  rationale: Klausa Ibrani tidak memakai verba; bahasa Indonesia secara alami dapat mempertahankan predikat nominal, sementara ungkapan ini menyampaikan kesinambungan tanpa akhir.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: '''Kasih setia'' mencakup kasih, loyalitas, dan keteguhan yang terkandung dalam חֶסֶד, serta sudah wajar dalam ragam Alkitab bahasa Indonesia.'
theological_decisions:
- issue: Penerjemahan refrein חַסְדּוֹ לְעוֹלָם
  choice: sebab kasih setia-Nya kekal untuk selama-lamanya
  alternative: sebab belas kasih-Nya untuk selama-lamanya; sebab kesetiaan perjanjian-Nya kekal
  rationale: '''Kasih setia'' menjaga keluasan makna חֶסֶד tanpa membatasinya hanya pada belas kasihan atau secara eksplisit memasukkan kata ''perjanjian'' yang tidak muncul dalam ayat. Bentuk predikat nominal juga mempertahankan keringkasan refrein Ibrani.'
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan liturgis. Kapitalisasi pronomina ilahi mengikuti kelaziman ragam Alkitab Indonesia. Pengulangan 'keajaiban-keajaiban' mempertahankan bentuk jamak dan cocok dengan irama ayat.
