lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: dan membunuh
  rationale: Bentuk wayyiqtol dari הרג melanjutkan penuturan tindakan masa lampau. “Membunuh” mempertahankan makna langsung verba Ibrani tanpa memakai ungkapan arkais.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Bentuk jamak umum yang secara langsung berarti para raja.
- source_word: אַדִּירִים
  choice: yang perkasa
  rationale: Dalam konteks peperangan, kata ini menggambarkan para raja sebagai kuat dan tangguh. “Perkasa” alami dan bermartabat dalam bahasa Indonesia serta tidak menggeser makna ke kemegahan lahiriah.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan refrein yang memberikan dasar bagi pujian. “Sebab” mempertahankan hubungan kausal atau penjelasannya.
- source_word: לְעוֹלָם
  choice: kekal selama-lamanya
  rationale: Frasa Ibrani berarti “untuk selamanya”. Karena klausa Ibrani tidak menyatakan verba, “kekal” melengkapinya secara wajar dalam bahasa Indonesia, sedangkan “selama-lamanya” mempertahankan cakupan waktunya.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חסד mencakup kasih, kesetiaan, kemurahan, dan komitmen dalam relasi. “Kasih setia” merupakan padanan Indonesia yang ringkas dan menjaga keluasan makna tersebut.
theological_decisions:
- issue: Penerjemahan חֶסֶד dalam refrein
  choice: kasih setia-Nya kekal selama-lamanya
  alternative: belas kasih-Nya tetap untuk selama-lamanya; kesetiaan perjanjian-Nya untuk selama-lamanya
  rationale: “Kasih setia” mempertahankan sekaligus unsur kasih dan loyalitas tanpa mempersempit חֶסֶד hanya menjadi belas kasihan atau menjadikan gagasan perjanjian—yang tersirat dalam banyak konteks—lebih eksplisit daripada teks ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama liturgis yang ringkas. Pengulangan refrein dipertahankan dalam bentuk yang mudah dipahami dan layak dibacakan. Kapital pada enklitik “-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah dalam terjemahan Alkitab bahasa Indonesia.
