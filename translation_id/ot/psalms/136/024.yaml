  text: וַ/יִּפְרְקֵ֥/נוּ מִ/צָּרֵ֑י/נוּ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/024.yaml
  text: and rescued us from our foes[a], for his steadfast love endures forever.
translation:
  language: id
  text: dan menyelamatkan kita dari musuh-musuh kita[a], sebab kasih setia-Nya untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lawan-lawan kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרְקֵנוּ
  choice: dan membebaskan kita
  rationale: Kata kerja פרק dengan akhiran objek orang pertama jamak menyatakan tindakan melepaskan atau menyelamatkan dari bahaya maupun penindasan. “Membebaskan” alami dalam bahasa Indonesia dan tetap mencakup pelepasan dari kuasa lawan.
- source_word: מִצָּרֵינוּ
  choice: dari para lawan kita
  rationale: Bentuk jamak dengan akhiran orang pertama jamak menunjuk kepada orang-orang yang memusuhi atau menindas. “Para lawan” cukup luas untuk mempertahankan nuansa itu; “musuh-musuh” juga mungkin.
- source_word: כִּי
  choice: sebab
  rationale: Dalam mazmur ini כִּי mengawali refrein yang menyatakan dasar bagi pujian. “Sebab” mempertahankan fungsi penjelas sekaligus cocok dengan irama liturgis.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini secara harfiah menyatakan keberlangsungan tanpa akhir. Bentuk “untuk selama-lamanya” wajar sebagai predikat nominal dalam refrein Indonesia dan tidak menambahkan kata kerja yang tidak dinyatakan dalam teks Ibrani.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kemurahan, dan kesetiaan relasional atau perjanjian. “Kasih setia” merupakan padanan Indonesia yang ringkas dan mempertahankan keluasan makna tersebut.
theological_decisions:
- issue: Penerjemahan חֶסֶד dalam refrein Mazmur 136
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: belas kasih-Nya kekal untuk selama-lamanya
  rationale: “Kasih setia” menjaga perpaduan kasih dan kesetiaan Allah yang ditunjukkan melalui karya penyelamatan-Nya, tanpa mempersempit istilah itu hanya menjadi rasa iba. Susunan nominal juga mempertahankan ketegangan bentuk Ibrani yang tidak menyatakan kata kerja secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis-liturgis. Refrein dibuat ringkas dan bermartabat; kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab Indonesia.
