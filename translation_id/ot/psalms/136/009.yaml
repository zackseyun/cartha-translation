id: PSA.136.9
reference: Psalms 136:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶת הַ/יָּרֵ֣חַ וְ֭/כוֹכָבִים לְ/מֶמְשְׁל֣וֹת בַּ/לָּ֑יְלָה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/009.yaml
  text: the moon and stars to rule over the night[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: bulan dan bintang-bintang untuk menguasai malam, sebab kasih setia-Nya untuk selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab kasih setia-Nya tetap untuk selama-lamanya.”
    reason: Bahasa Ibrani tidak mencantumkan verba secara eksplisit; kata “tetap” dapat ditambahkan secara wajar untuk menyatakan keberlangsungan.
lexical_decisions:
- source_word: אֶת
  choice: '[penanda objek, tidak diterjemahkan]'
  rationale: Penanda objek langsung yang melanjutkan rangkaian objek dari ayat sebelumnya; tidak memiliki padanan alami dalam bahasa Indonesia.
- source_word: הַיָּרֵחַ
  choice: bulan
  rationale: Padanan baku bagi יָרֵחַ sebagai benda langit; dalam bahasa Indonesia nomina ini tidak memerlukan kata sandang tertentu.
- source_word: וְכוֹכָבִים
  choice: dan bintang-bintang
  rationale: Bentuk jamak כוֹכָבִים diterjemahkan dengan pengulangan nomina yang alami dalam bahasa Indonesia.
- source_word: לְמֶמְשְׁלוֹת
  choice: untuk menguasai
  rationale: Bentuk ini menyatakan fungsi atau tujuan pemerintahan/dominion; 'untuk menguasai' mempertahankan daya ungkap teks dan gema Kejadian 1.
- source_word: בַּלָּיְלָה
  choice: malam
  rationale: Dengan verba 'menguasai', objek langsung 'malam' menghasilkan ungkapan Indonesia yang alami dan mencerminkan ranah malam yang dipercayakan kepada bulan dan bintang.
- source_word: כִּי
  choice: sebab
  rationale: Dalam refrein liturgis Mazmur 136, כִּי memperkenalkan alasan; 'sebab' menjaga hubungan logis dan nada yang khidmat.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan temporal ini menyatakan keberlangsungan tanpa akhir. Karena klausa Ibraninya nominal dan tidak memiliki verba eksplisit, bentuk ini tidak menambahkan 'bertahan' secara wajib.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kebaikan, kesetiaan, dan loyalitas perjanjian; 'kasih setia' merupakan padanan Indonesia yang luas, alami, dan tidak mempersempit maknanya menjadi belas kasihan saja.
theological_decisions:
- issue: Penerjemahan חֶסֶד dalam refrein Mazmur 136
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: kasih-Nya yang teguh tetap untuk selama-lamanya; kemurahan-Nya untuk selama-lamanya
  rationale: '''Kasih setia'' menjaga unsur kasih dan kesetiaan yang melekat pada חֶסֶד, termasuk resonansi relasional dan perjanjiannya, tanpa mengunci istilah itu pada satu doktrin tertentu. Susunan nominal mempertahankan keringkasan dan keterbukaan sintaksis bahasa Ibrani.'
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Baris ini merupakan lanjutan sintaksis dari ayat sebelumnya, sehingga dimulai dengan huruf kecil. Bentuk 'menguasai' dipilih untuk mempertahankan gambaran pemerintahan benda-benda langit, sedangkan refrein dibuat ringkas dan liturgis.
