  text: 'dan membawa Israel melintasi tengahnya,

    sebab kasih setia-Nya untuk selama-lamanya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶעֱבִיר
  choice: dan membawa ... menyeberangi
  rationale: Bentuk Hifil dari עבר menyatakan tindakan kausatif, yaitu membuat atau membawa seseorang melintas. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan gambaran gerak menyeberang.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri ini dipertahankan sesuai bentuk baku dalam bahasa Indonesia.
- source_word: בְּ/תוֹכ֑/וֹ
  choice: bagian tengahnya
  rationale: Ungkapan Ibrani ini secara harfiah menunjuk pada bagian tengah sesuatu; sufiksnya merujuk kepada laut dalam ayat sebelumnya. Bersama kata 'menyeberangi', pilihan ini menyampaikan bahwa Israel melintas tepat di tengah laut.
- source_word: כִּי
  choice: karena
  rationale: Dalam refrein Mazmur 136, כִּי memperkenalkan alasan bagi pujian yang baru dinyatakan.
- source_word: לְ/עוֹלָם
  choice: untuk selama-lamanya
  rationale: Frasa ini menyatakan keberlangsungan tanpa akhir. Karena klausa Ibraninya tidak memiliki verba tersurat, bahasa Indonesia dapat mempertahankan bentuk nominal yang alami tanpa menambahkan 'bertahan'.
- source_word: חַסְדּֽ/וֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kesetiaan, kemurahan, dan loyalitas dalam hubungan. 'Kasih setia' merupakan padanan Indonesia yang ringkas dan mapan serta menjaga dimensi kasih dan kesetiaan.
theological_decisions:
- issue: Pemadanan חֶסֶד dalam refrein Mazmur 136
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: belas kasih-Nya untuk selama-lamanya; kesetiaan-Nya pada perjanjian untuk selama-lamanya
  rationale: Pilihan 'kasih setia' mempertahankan keluasan makna חֶסֶד tanpa membatasinya hanya pada belas kasih atau secara eksplisit menambahkan kata 'perjanjian', yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa liturgis. Susunan baris mempertahankan pola tindakan ilahi diikuti refrein. Tidak diperlukan catatan kaki karena ambiguitas leksikal utama חֶסֶד cukup terwakili oleh padanan 'kasih setia', sedangkan bentuk kausatif עבר disampaikan secara alami dengan 'membawa ... menyeberangi'.
