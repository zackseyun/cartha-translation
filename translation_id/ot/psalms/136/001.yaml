  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: id
  text: Bersyukurlah kepada Yahweh[a], sebab Ia baik, sebab kasih setia-Nya[b] tetap selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani יְהוָה (YHWH), yang ditransliterasikan “Yahweh”; dalam banyak terjemahan Indonesia nama ini ditampilkan sebagai “TUHAN.”
    reason: alternative_reading
  - marker: b
    text: Atau “belas kasih-Nya,” “kemurahan-Nya,” atau “kesetiaan perjanjian-Nya.” Kata Ibrani חֶסֶד menyatakan kasih yang teguh dan loyal dalam suatu hubungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Bersyukurlah
  rationale: Bentuk imperatif jamak dari ידה dalam bentuk Hifil lazim berarti mengucap syukur atau memuji. “Bersyukurlah” paling alami dalam seruan liturgis ini.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menjadi tujuan ucapan syukur, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” agar nama perjanjian itu tetap tampak.
- source_word: כִּי
  choice: sebab
  rationale: Kedua pemunculan כִּי memberikan alasan bagi ajakan bersyukur. “Sebab” mempertahankan hubungan kausal secara ringkas dan wajar.
- source_word: טוֹב
  choice: baik
  rationale: Kata sifat ini menyatakan kebaikan Yahweh secara langsung dan luas tanpa mempersempitnya hanya menjadi kemurahan atau kebajikan.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menunjukkan durasi yang tidak berkesudahan. Susunan nominal Ibrani tidak memiliki kata kerja eksplisit, sehingga terjemahan ini tidak perlu menambahkan “bertahan”.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan loyalitas yang teguh dalam hubungan perjanjian. “Kasih setia” merupakan padanan Indonesia yang ringkas dan mempertahankan keluasan makna itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankan nama itu, alih-alih menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Makna חֶסֶד dalam refrein pujian perjanjian
  choice: kasih setia
  alternative: belas kasih; kemurahan; kesetiaan perjanjian
  rationale: “Kasih setia” menjaga keterpaduan unsur kasih dan loyalitas yang bertahan, sementara pilihan lain cenderung menonjolkan hanya salah satu sisi maknanya.
- issue: Klausa nominal לְעוֹלָם חַסְדּוֹ
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: kasih setia-Nya bertahan untuk selama-lamanya
  rationale: Bahasa Ibrani tidak memuat kata kerja eksplisit. Bentuk tanpa tambahan kata kerja lebih dekat kepada struktur sumber dan tetap alami dalam refrein puitis Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada liturgis yang ringkas dan bermartabat. Kapitalisasi “Ia” dan akhiran “-Nya” mengikuti kebiasaan penghormatan dalam teks keagamaan Indonesia. Pengulangan “sebab” dipertahankan untuk mencerminkan dua כִּי dan irama refrein Ibrani.
