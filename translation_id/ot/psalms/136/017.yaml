base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/017.yaml
  text: To him who struck down great kings[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: 'kepada Dia yang menumbangkan raja-raja besar[a],

    sebab kasih setia-Nya[b] tetap untuk selama-lamanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengalahkan raja-raja yang perkasa.” Kata Ibrani yang diterjemahkan “besar” juga dapat menunjuk pada kekuasaan atau keperkasaan.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani khesed, yang mencakup kasih, kemurahan, dan kesetiaan yang teguh; dapat juga diterjemahkan “belas kasih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: kepada Dia yang menumbangkan
  rationale: Awalan לְ mempertahankan rumus pujian yang berlanjut dari ajakan untuk bersyukur dalam mazmur ini. Partisipel מַכֵּה dipakai secara verbal; “menumbangkan” menyampaikan tindakan mengalahkan secara menentukan tanpa memakai ungkapan yang kuno.
- source_word: מְלָכִים גְּדֹלִים
  choice: raja-raja besar
  rationale: Terjemahan langsung yang mempertahankan bentuk jamak dan sifat “besar”; dalam konteks, “besar” juga dapat menyiratkan kekuasaan atau kedudukan.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan refrein yang memberikan alasan bagi pujian. “Sebab” alami, ringkas, dan menjaga irama liturgis.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan jangka waktu yang tidak berakhir. Bentuk nominal Ibrani dipertahankan secara alami dalam refrein bahasa Indonesia tanpa menambahkan kata kerja yang tidak tersurat.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kemurahan, dan kesetiaan yang teguh dalam relasi perjanjian. “Kasih setia” merupakan padanan Indonesia yang ringkas dan kaya makna.
theological_decisions:
- issue: Makna חֶסֶד dalam refrein
  choice: kasih setia-Nya
  alternative: belas kasih-Nya; kesetiaan perjanjian-Nya
  rationale: “Kasih setia” mempertahankan perpaduan kasih, kemurahan, dan loyalitas yang terkandung dalam חֶסֶד, tanpa membatasinya hanya pada belas kasihan atau memasukkan istilah teknis yang tidak dinyatakan secara eksplisit.
- issue: Kekuatan tindakan נכה terhadap para raja
  choice: menumbangkan
  alternative: memukul; mengalahkan; membunuh
  rationale: Konteks kemenangan ilahi mendukung tindakan yang menentukan, tetapi bentuk Ibraninya sendiri tidak mengharuskan terjemahan “membunuh.” “Menumbangkan” mempertahankan kekuatan tindakan sekaligus tidak mempersempit ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Frasa pembuka “kepada Dia” sengaja mempertahankan hubungan sintaksis dengan rumus ajakan bersyukur dalam mazmur. Refrein dibuat ringkas dan mudah dibacakan secara liturgis.
