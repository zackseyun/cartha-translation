  yaml_path: translation/ot/psalms/136/016.yaml
  text: to him who led his people in the wilderness[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: kepada Dia yang memimpin umat-Nya di padang belantara,[a] sebab kasih setia-Nya[b] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melintasi padang belantara”. Preposisi Ibrani secara harfiah berarti “di/dalam”, tetapi bersama kata “memimpin” dapat menyiratkan perjalanan melintasi wilayah itu.
    reason: lexical_alternative
  - marker: b
    text: Ibrani khesed mencakup kasih, kebaikan, dan kesetiaan yang teguh; dapat juga diterjemahkan “kesetiaan perjanjian” atau, dalam konteks tertentu, “belas kasihan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמוֹלִיךְ
  choice: kepada Dia yang memimpin
  rationale: Bentuk Hifil dari הלך menyatakan tindakan menyebabkan berjalan atau menuntun. Dalam rangkaian liturgis mazmur ini, prefiks לְ melanjutkan seruan untuk bersyukur “kepada Dia yang …”; “memimpin” menyampaikan makna kausatif itu secara alami.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עַם menunjuk kepada bangsa yang memiliki hubungan khusus dengan Allah. “Umat-Nya” alami dalam bahasa Indonesia dan mempertahankan nuansa relasional tersebut.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר adalah daerah liar dan gersang, sedangkan prefiks בְּ secara langsung berarti “di/dalam”. “Padang belantara” tidak mempersempit maknanya menjadi gurun pasir; kemungkinan nuansa perjalanan melintasinya dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Dalam refrein Mazmur 136, כִּי memperkenalkan dasar pujian. “Sebab” mempertahankan hubungan alasan dan sesuai dengan ragam liturgis yang bermartabat.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menunjukkan jangka waktu yang tidak berakhir. Susunan nominal “kasih setia-Nya untuk selama-lamanya” dekat dengan bentuk Ibrani tanpa harus menambahkan kata kerja yang tidak dinyatakan.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh dalam hubungan. “Kasih setia” mempertahankan keluasan itu dan merupakan ungkapan Indonesia yang jelas serta wajar.
theological_decisions:
- issue: Makna חֶסֶד dalam refrein
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: belas kasihan-Nya untuk selama-lamanya; kesetiaan perjanjian-Nya untuk selama-lamanya
  rationale: “Kasih setia” menjaga perpaduan kasih dan kesetiaan dalam חֶסֶד. “Belas kasihan” terlalu membatasi makna pada kemurahan hati, sedangkan “kesetiaan perjanjian” lebih teknis dan membuat unsur perjanjian yang tersirat menjadi eksplisit.
- issue: Lokasi atau gerak dalam בַּמִּדְבָּר
  choice: di padang belantara
  alternative: melintasi padang belantara
  rationale: Preposisi Ibrani secara formal berarti “di/dalam”, tetapi bersama verba memimpin dan dalam konteks perjalanan Israel dapat dipahami sebagai gerak melintasi wilayah itu. Teks utama mempertahankan bentuk yang lebih dekat dengan sumber, sementara alternatif dicatat tanpa meniadakan ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan liturgis tanpa menjadi arkais. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Klausa dipertahankan sebagai kelanjutan sintaksis rangkaian Mazmur 136, bukan dijadikan kalimat mandiri dengan menambahkan perintah yang tidak terdapat dalam ayat ini.
