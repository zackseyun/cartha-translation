  text: וְ/נִ֘עֵ֤ר פַּרְעֹ֣ה וְ/חֵיל֣/וֹ בְ/יַם ס֑וּף כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/015.yaml
  text: and shook off Pharaoh and his army into the Red Sea[a], for his steadfast love endures forever.
translation:
  language: id
  text: dan menghempaskan Firaun beserta tentaranya ke dalam Laut Teberau[a], sebab kasih setia-Nya untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, istilah Ibrani dapat diterjemahkan “Laut Teberau” atau “Laut Gelagah”; secara tradisional disebut “Laut Merah”.
    reason: Menjelaskan arti harfiah nama Ibrani dan padanan tradisionalnya tanpa menyamakan keduanya secara diam-diam.
lexical_decisions:
- source_word: וְנִעֵר
  choice: dan menghempaskan
  rationale: Kata kerja נָעַר menggambarkan tindakan mengguncang atau mengibaskan hingga terlempar. Dalam konteks ini, “menghempaskan” mempertahankan gambaran tindakan yang kuat dan konkret tanpa mereduksinya menjadi sekadar “mengalahkan”.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar raja Mesir.
- source_word: וְחֵילוֹ
  choice: beserta tentaranya
  rationale: Dalam konteks militer, חַיִל berarti pasukan atau tentara. “Beserta tentaranya” alami dalam bahasa Indonesia dan menghubungkan Firaun dengan seluruh kekuatan militernya sebagai objek tindakan.
- source_word: בְיַם סוּף
  choice: ke dalam Laut Teberau
  rationale: Preposisi בְּ dalam konteks tindakan menghempaskan dapat dinyatakan secara dinamis sebagai “ke dalam”. יַם־סוּף secara harfiah menunjuk pada laut yang berkaitan dengan teberau; “Laut Teberau” mempertahankan transparansi terhadap teks Ibrani, sementara sebutan tradisional dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan dasar pujian dalam refrein mazmur. “Sebab” ringkas, wajar, dan sesuai dengan ragam bahasa liturgis yang bermartabat.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Susunan tersebut alami sebagai predikat nominal dalam refrein bahasa Indonesia.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kemurahan, dan kesetiaan yang teguh. “Kasih setia” mempertahankan keluasan makna relasional tersebut tanpa membatasinya hanya pada belas kasihan atau menguraikannya secara doktrinal.
theological_decisions:
- issue: Penerjemahan יַם סוּף
  choice: Laut Teberau dalam teks utama
  alternative: Laut Merah
  rationale: “Laut Teberau” lebih langsung mencerminkan unsur סוּף dalam bahasa Ibrani dan mempertahankan prioritas sumber asli. Karena “Laut Merah” merupakan sebutan tradisional yang sangat dikenal dan relevan bagi pembaca, alternatif itu dicantumkan dalam catatan kaki tanpa memaksakan identifikasi geografis yang lebih spesifik daripada teks.
- issue: Nuansa חֶסֶד
  choice: kasih setia-Nya
  alternative: belas kasih-Nya; kasih perjanjian-Nya
  rationale: “Kasih setia” menjaga perpaduan kasih dan kesetiaan dalam חֶסֶד. “Belas kasih” terlalu mempersempit nuansanya, sedangkan “kasih perjanjian” dapat mengungkapkan implikasi teologis secara lebih eksplisit daripada bentuk leksikal ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel serta refrein liturgis dipertahankan. “Menghempaskan” dipilih untuk menjaga citra konkret verba Ibrani, sedangkan “untuk selama-lamanya” mempertahankan pola refrein Mazmur 136.
