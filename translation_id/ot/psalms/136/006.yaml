  text: לְ/רֹקַ֣ע הָ֭/אָרֶץ עַל הַ/מָּ֑יִם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/006.yaml
  text: to him who spread out the earth upon the waters[a], for his steadfast love endures forever.
translation:
  language: id
  text: 'Bagi Dia yang membentangkan bumi di atas air[a],

    sebab kasih setia-Nya untuk selama-lamanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghamparkan bumi di atas air”; kata kerja Ibrani ini juga dapat memiliki arti konkret “menempa hingga melebar”, seperti ketika logam ditempa menjadi permukaan yang luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/רֹקַע
  choice: kepada Dia yang membentangkan
  rationale: Preposisi לְ meneruskan rangkaian pihak yang menjadi tujuan pujian, sedangkan partisip רֹקַע menggambarkan tindakan menghamparkan atau membentangkan suatu permukaan. ‘Membentangkan’ alami dalam bahasa Indonesia dan tetap mempertahankan gambaran konkret teks.
- source_word: הָ/אָרֶץ
  choice: bumi
  rationale: Dalam konteks penciptaan kosmis dan pasangannya dengan ‘air’, אֶרֶץ menunjuk pada bumi, bukan suatu negeri tertentu.
- source_word: עַל הַ/מָּיִם
  choice: di atas air
  rationale: עַל dapat berarti ‘di atas’, ‘pada’, atau ‘melampaui’. ‘Di atas air’ jelas, puitis, dan mempertahankan gambaran kosmologis sumber. Bentuk Ibrani מַיִם secara morfologis jamak, tetapi bahasa Indonesia lazim memakai nomina massa ‘air’.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan dasar pujian dalam refrein mazmur ini. ‘Sebab’ sesuai dengan laras puitis yang bermartabat.
- source_word: לְ/עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan tanpa akhir. Frasa nominal Ibrani dipertahankan tanpa menambahkan verba yang tidak dinyatakan secara eksplisit.
- source_word: חַסְדּֽ/וֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kesetiaan, kemurahan, dan loyalitas relasional. ‘Kasih setia’ merupakan padanan Indonesia yang ringkas dan tidak mempersempit maknanya hanya menjadi belas kasihan atau perasaan.
theological_decisions:
- issue: Gambaran kosmologis penciptaan
  choice: Mempertahankan gambaran bahwa Allah membentangkan bumi ‘di atas air’.
  alternative: Mengabstraksikannya menjadi pernyataan umum bahwa Allah mendirikan dunia.
  rationale: Bahasa puitis Ibrani menyajikan gambaran kosmologis konkret. Terjemahan tidak menyelaraskannya secara diam-diam dengan kategori ilmiah modern ataupun menggantinya dengan parafrasa abstrak.
- issue: Ketiadaan verba eksplisit dalam refrein
  choice: 'Menerjemahkan secara nominal: ‘kasih setia-Nya untuk selama-lamanya’.'
  alternative: 'Menambahkan verba: ‘kasih setia-Nya tetap untuk selama-lamanya’ atau ‘bertahan selama-lamanya’.'
  rationale: Teks Ibrani tidak memuat verba eksplisit. Susunan nominal Indonesia tetap wajar dalam puisi dan menjaga kepadatan serta ambiguitas gramatikal refrein.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi ‘Dia’ dan akhiran ‘-Nya’ menandai rujukan kepada Allah sesuai kebiasaan ejaan religius Indonesia. Baris kedua mempertahankan bentuk refrein yang ringkas dan bermartabat.
