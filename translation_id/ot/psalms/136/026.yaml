  yaml_path: translation/ot/psalms/136/026.yaml
  text: Give thanks to the God of heaven[a], for his steadfast love endures forever.
translation:
  language: id
  text: 'Bersyukurlah kepada Allah semesta langit,

    sebab kasih setia-Nya berlangsung selama-lamanya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesetiaan perjanjian-Nya berlangsung selama-lamanya.” Kata Ibrani חֶסֶד mencakup kasih yang teguh dan kesetiaan dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Bersyukurlah
  rationale: Bentuk perintah jamak dari ידה dalam bentuk Hifil mengajak umat untuk menyatakan syukur atau pujian. “Bersyukurlah” alami dalam bahasa Indonesia dan sesuai dengan fungsi liturgis refrein Mazmur 136.
- source_word: לְאֵל הַשָּׁמָיִם
  choice: kepada Allah semesta langit
  rationale: אֵל menunjuk kepada Allah, sedangkan הַשָּׁמָיִם secara harfiah berbentuk jamak dan di sini menyatakan ranah surgawi. Ungkapan “Allah semesta langit” terdengar wajar dan agung, serta mempertahankan cakupan bentuk Ibrani tanpa memahaminya hanya sebagai langit fisik.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan untuk bersyukur. “Sebab” ringkas, alami, dan sesuai dengan corak puisi-liturgis.
- source_word: לְעוֹלָם
  choice: kekal selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Karena klausa Ibrani tidak memiliki verba eksplisit, bahasa Indonesia dapat memakai predikat adjektival “kekal”; tambahan “selama-lamanya” menjaga daya temporal לְעוֹלָם dan irama refrein.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh dalam hubungan perjanjian. “Kasih setia” merupakan padanan Indonesia yang ringkas dan mempertahankan baik unsur kasih maupun loyalitas.
theological_decisions:
- issue: Pemaknaan חֶסֶד dalam refrein Mazmur 136
  choice: kasih setia-Nya kekal selama-lamanya
  alternative: kesetiaan-Nya kepada perjanjian kekal selama-lamanya; belas kasih-Nya kekal selama-lamanya
  rationale: “Kasih setia” mempertahankan dimensi afektif dan loyalitas relasional dari חֶסֶד tanpa mempersempitnya menjadi belas kasihan saja atau membuat gagasan perjanjian yang tersirat menjadi terlalu eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, puitis-liturgis, dan mudah dipahami. Bentuk “-lah” mempertahankan ajakan komunal; kapitalisasi pronomina ilahi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia.
