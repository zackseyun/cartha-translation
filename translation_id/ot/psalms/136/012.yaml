translation:
  language: id
  text: 'dengan tangan yang kuat dan lengan yang terentang,

    sebab kasih setia-Nya untuk selama-lamanya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ḥesed dapat juga diterjemahkan “kasih yang setia”, “kesetiaan”, atau “kemurahan”; istilah ini mencakup kasih dan loyalitas dalam suatu relasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָד חֲזָקָה
  choice: dengan tangan yang kuat
  rationale: Preposisi בְּ menyatakan sarana, sedangkan חֲזָקָה berarti kuat atau perkasa. Ungkapan ini mempertahankan gambaran Ibrani dan formula keluaran dengan bahasa Indonesia yang wajar.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: dan lengan yang teracung
  rationale: Terjemahan ini mempertahankan metafora 'lengan' dan menggambarkan lengan yang direntangkan untuk bertindak. 'Teracung' alami dan ringkas dalam bahasa Indonesia, tanpa menghilangkan daya ungkap teks.
- source_word: כִּי
  choice: sebab
  rationale: Dalam refrein Mazmur 136, כִּי memperkenalkan dasar pujian. 'Sebab' mempertahankan hubungan alasan sekaligus corak liturgis.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Frasa ini secara harfiah menyatakan keberlangsungan tanpa akhir. Karena teks Ibrani tidak memiliki verba eksplisit, konstruksi nominal bahasa Indonesia mempertahankan bentuk yang padat.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan kemurahan dalam relasi. 'Kasih setia' mempertahankan keluasan makna itu dan merupakan ungkapan Indonesia yang jelas serta mapan.
theological_decisions:
- issue: Terjemahan חֶסֶד dalam refrein Mazmur 136
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: belas kasih-Nya kekal untuk selama-lamanya; kesetiaan perjanjian-Nya untuk selama-lamanya
  rationale: '''Kasih setia'' mencakup baik kasih maupun loyalitas yang tampak dalam tindakan penyelamatan Allah, tanpa mempersempit istilah hanya pada belas kasihan atau membuat unsur perjanjian lebih eksplisit daripada teks.'
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Paralelisme serta citra tangan dan lengan dipertahankan. Refrein dibuat ringkas dan nominal agar dekat dengan struktur Ibrani.
