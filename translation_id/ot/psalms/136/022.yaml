source:
  edition: WLC
  text: נַ֭חֲלָה לְ/יִשְׂרָאֵ֣ל עַבְדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/022.yaml
  text: an inheritance to Israel his servant[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: sebagai milik pusaka[a] bagi Israel, hamba-Nya, sebab kasih setia-Nya[b] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “warisan” atau “milik yang diwariskan.”
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani hesed, yang sering menunjuk pada kasih yang teguh dan loyal dalam hubungan perjanjian; dapat juga diterjemahkan “belas kasihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: milik pusaka
  rationale: Kata ini menunjuk pada milik yang diwariskan atau bagian yang dianugerahkan. Dalam konteks tanah yang diberikan kepada Israel, “milik pusaka” alami dan mempertahankan gagasan kepemilikan yang diterima sebagai warisan.
- source_word: לְיִשְׂרָאֵל
  choice: bagi Israel
  rationale: Preposisi ל menandai Israel sebagai penerima atau pihak yang memperoleh milik pusaka itu; “bagi Israel” menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Di sini עבד merupakan sebutan relasional dan perjanjian bagi Israel sebagai umat yang menjadi milik dan melayani Allah, bukan penekanan pada keadaan perbudakan.
- source_word: כִּי
  choice: sebab
  rationale: Kata penghubung ini memperkenalkan refrein yang menyatakan alasan untuk memuji Allah.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan tanpa akhir dan mempertahankan bentuk nominal refrein Ibrani tanpa menambahkan kata kerja yang tidak tersurat.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חסד mencakup kasih, kesetiaan, dan komitmen relasional Allah. “Kasih setia” merupakan padanan Indonesia yang ringkas dan tidak mempersempit maknanya hanya menjadi belas kasihan.
theological_decisions:
- issue: Hubungan Israel dengan Allah dalam עַבְדּוֹ
  choice: hamba-Nya
  alternative: budak-Nya
  rationale: Ayat ini memakai istilah tersebut sebagai sebutan perjanjian bagi Israel. Konteks tidak menonjolkan keterikatan paksa, sehingga “hamba-Nya” lebih tepat tanpa menghilangkan unsur kepunyaan dan pelayanan.
- issue: Makna חַסְדּוֹ dalam refrein
  choice: kasih setia-Nya
  alternative: belas kasihan-Nya; kasih perjanjian-Nya
  rationale: “Kasih setia” mempertahankan perpaduan kasih dan kesetiaan yang menjadi ciri חסד tanpa membatasi istilah itu pada rasa iba atau memasukkan kata “perjanjian” secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Frasa pembuka memakai “sebagai” karena ayat ini melanjutkan tindakan pemberian pada ayat sebelumnya. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan hormat yang umum dalam penerbitan Alkitab bahasa Indonesia.
