    sebab untuk selama-lamanya kasih setia-Nya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan kepada Og, raja Basan,” dengan menyatakan secara eksplisit fungsi penerima (objek tidak langsung) dari prefiks Ibrani yang diteruskan dari rangkaian sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעוֹג
  choice: dan Og
  rationale: Waw melanjutkan rangkaian dengan “dan”. Prefiks לְ menandai Og sebagai objek dalam rangkaian yang bergantung pada kata kerja di ayat sebelumnya; bahasa Indonesia secara alami tidak perlu mengungkapkannya dengan preposisi tersendiri.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: raja Basan
  rationale: מֶלֶךְ berarti “raja”, sedangkan הַבָּשָׁן adalah nama wilayah Basan. Susunannya diterjemahkan secara idiomatis sebagai “raja Basan”.
- source_word: כִּי
  choice: sebab
  rationale: Dalam mazmur ini, כִּי memperkenalkan refrein yang menyatakan alasan bagi pujian; “sebab” mempertahankan fungsi penjelas dan corak liturgisnya.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Dalam refrein nominal Ibrani, bahasa Indonesia dapat mempertahankan bentuk ringkas “untuk selama-lamanya” tanpa menambahkan kata kerja yang tidak dinyatakan.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh. “Kasih setia” merupakan padanan Indonesia yang alami dan cukup luas; sufiks orang ketiga tunggal diterjemahkan “-Nya”.
theological_decisions:
- issue: Padanan חֶסֶד dalam refrein Mazmur 136
  choice: kasih setia
  alternative: belas kasih; kasih perjanjian; kemurahan
  rationale: “Kasih setia” mempertahankan unsur kasih dan loyalitas yang melekat pada חֶסֶד tanpa membatasinya hanya pada belas kasihan atau memasukkan kata “perjanjian” yang tidak tersurat.
- issue: Bentuk verbal dalam refrein
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: kasih setia-Nya bertahan untuk selama-lamanya
  rationale: Teks Ibrani tidak memiliki kata kerja tersurat. Bentuk nominal dalam bahasa Indonesia tetap jelas dan mempertahankan kepadatan serta ambiguitas sintaksis refrein, alih-alih menambahkan “bertahan” sebagai satu-satunya penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan liturgis. Nama tempat ditulis “Basan” sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Tanda koma menandai “raja Basan” sebagai aposisi bagi Og.
