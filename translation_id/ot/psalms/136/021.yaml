  text: and gave their land as an inheritance[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: dan Ia memberikan negeri mereka sebagai milik pusaka[a], sebab kasih setia-Nya[b] berlangsung selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai warisan” atau “sebagai milik.” Kata Ibrani נַחֲלָה mengandung pengertian milik pusaka atau bagian yang dialokasikan.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani חֶסֶד, yang sering menyatakan kasih yang loyal dan teguh, khususnya dalam hubungan perjanjian. Terjemahan lain mencakup “belas kasihan” atau “kesetiaan perjanjian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: dan memberikan
  rationale: Bentuk Qal perfektum orang ketiga tunggal dengan kata sambung melanjutkan rangkaian tindakan Allah dalam mazmur ini. Bentuk ini alami sebagai kelanjutan sintaksis dari ayat sebelumnya.
- source_word: אַרְצָם
  choice: negeri mereka
  rationale: Kata אֶרֶץ dengan sufiks orang ketiga jamak menunjuk pada wilayah milik raja-raja atau bangsa-bangsa yang dikalahkan. 'Negeri' menyampaikan makna wilayah tanpa memberi kesan tanah sebagai bahan atau lahan semata.
- source_word: לְנַחֲלָה
  choice: sebagai milik pusaka
  rationale: נַחֲלָה menunjuk pada milik yang diwariskan atau bagian yang dialokasikan. 'Milik pusaka' mempertahankan unsur kepemilikan sekaligus pewarisan dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: כִּי
  choice: sebab
  rationale: Dalam refrein Mazmur 136, כִּי memperkenalkan dasar bagi pujian. 'Sebab' mempertahankan daya kausal dan irama liturgis.
- source_word: לְעוֹלָם
  choice: kekal selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Kata 'kekal' melengkapi klausa nominal Ibrani secara alami dalam bahasa Indonesia, sedangkan 'selama-lamanya' mempertahankan cakupan temporalnya.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan komitmen loyal, sering dalam konteks perjanjian. 'Kasih setia' mempertahankan keluasan makna itu tanpa memakai istilah teknis atau kuno.
theological_decisions:
- issue: Penerjemahan חֶסֶד dalam refrein Mazmur 136
  choice: kasih setia-Nya kekal selama-lamanya
  alternative: belas kasihan-Nya untuk selama-lamanya; kesetiaan perjanjian-Nya kekal selama-lamanya
  rationale: '''Kasih setia'' menyeimbangkan unsur kasih dan loyalitas yang terkandung dalam חֶסֶד. Pilihan ini tidak mempersempit maknanya menjadi belas kasihan saja dan tidak menambahkan kata ''perjanjian'' secara eksplisit ketika kata itu tidak hadir dalam teks.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis-liturgis. Susunan kalimat mengikuti kesinambungan tindakan pada baris pertama dan refrein kausal pada baris kedua; istilah kuno seperti “bahwasanya” dihindari.
