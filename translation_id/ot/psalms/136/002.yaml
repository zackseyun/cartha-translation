  text: ה֭וֹדוּ לֵֽ/אלֹהֵ֣י הָ/אֱלֹהִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/002.yaml
  text: Give thanks to the God of gods[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: Bersyukurlah kepada Allah segala allah[a], sebab kasih setia-Nya berlangsung selama-lamanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Allah yang mengatasi segala allah.” Secara harfiah, bahasa Ibrani berbunyi “Allah segala allah,” suatu ungkapan yang menegaskan keunggulan-Nya.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani hesed, yang dapat menunjuk pada kasih yang teguh dan loyal, sering dalam konteks perjanjian. Terjemahan lain mencakup “belas kasihan” atau “kesetiaan pada perjanjian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Bersyukurlah
  rationale: Bentuk imperatif jamak dari ידה dalam bentuk Hifil menyerukan umat untuk mengucap syukur atau memuji. “Bersyukurlah” alami dalam bahasa Indonesia dan cocok dengan pola berulang Mazmur 136.
- source_word: לֵאלֹהֵי הָאֱלֹהִים
  choice: kepada Allah segala allah
  rationale: Rangkaian konstruksi Ibrani secara harfiah berarti “Allah segala allah.” Bentuk ini mempertahankan ungkapan agung tentang keunggulan Allah tanpa menetapkan status keberadaan ilah-ilah lain.
- source_word: כִּי
  choice: karena
  rationale: Di sini כִּי memperkenalkan alasan untuk bersyukur. “Karena” menyatakan hubungan sebab secara jelas dan wajar.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Frasa ini menyatakan kelangsungan tanpa akhir. Susunan klausa nominal Ibrani dipertahankan dengan ungkapan Indonesia yang alami dan puitis.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kemurahan, kesetiaan, dan loyalitas dalam hubungan perjanjian. “Kasih setia” mempertahankan unsur kasih sekaligus keteguhannya; akhiran pronominal orang ketiga tunggal diterjemahkan “-Nya.”
theological_decisions:
- issue: Makna gelar אֱלֹהֵי הָאֱלֹהִים
  choice: Mempertahankan ungkapan harfiah “Allah segala allah” sebagai pernyataan keunggulan-Nya.
  alternative: “Allah yang mengatasi segala allah.”
  rationale: Ungkapan Ibrani menegaskan supremasi dan ketakterbandingan Allah. Bentuk harfiah tidak dengan sendirinya menyatakan bahwa ilah-ilah lain sungguh ada, sehingga ambiguitas retoris teks tetap terpelihara.
- issue: Cakupan makna חֶסֶד
  choice: “kasih setia”
  alternative: “belas kasihan” atau “kesetiaan pada perjanjian”
  rationale: “Kasih setia” cukup luas untuk memuat dimensi kasih, kemurahan, dan loyalitas tanpa membatasi istilah itu hanya pada salah satu nuansa teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur singkat serta paralel dipertahankan agar sesuai dengan refrein liturgis Mazmur 136. Kapitalisasi “Allah” membedakan rujukan kepada Allah Israel dari “allah” dalam ungkapan kategori atau perbandingan.
