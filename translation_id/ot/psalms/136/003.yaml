  text: ה֭וֹדוּ לַ/אֲדֹנֵ֣י הָ/אֲדֹנִ֑ים כִּ֖י לְ/עֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/003.yaml
  text: Give thanks to the Lord of lords[a], for his steadfast love endures forever.
translation:
  language: id
  text: Bersyukurlah kepada Tuhan segala tuhan, sebab kasih setia-Nya[a] tetap selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesetiaan-Nya pada perjanjian.” Kata Ibrani חֶסֶד dapat menunjuk pada kasih yang teguh dan loyal dalam hubungan perjanjian, serta pada kebaikan atau belas kasihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Bersyukurlah
  rationale: Bentuk perintah jamak dari ידה dalam bentuk Hifil mengajak umat untuk menyatakan syukur atau pujian. “Bersyukurlah” menyampaikan seruan itu secara alami dan sesuai dengan pola berulang dalam Mazmur 136.
- source_word: לַאֲדֹנֵי הָאֲדֹנִים
  choice: kepada Tuhan, Penguasa atas segala penguasa
  rationale: Ungkapan konstruksi “Tuan dari segala tuan” menyatakan kedaulatan tertinggi. “Penguasa atas segala penguasa” mempertahankan bobot gelar tersebut dalam bahasa Indonesia modern tanpa menimbulkan pengulangan “Tuhan segala tuhan” yang dapat terdengar seolah-olah mengakui banyak ilah.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan untuk bersyukur dalam rumusan mazmur yang berulang.
- source_word: לְעוֹלָם
  choice: tetap selama-lamanya
  rationale: Secara harfiah berarti “untuk selamanya.” Kata “tetap” melengkapi klausa Ibrani yang tidak menyatakan kata kerja secara eksplisit dan menghasilkan ungkapan Indonesia yang alami.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh, sering kali dalam hubungan perjanjian. “Kasih setia-Nya” mempertahankan unsur kasih sekaligus loyalitas; akhiran pronominal diterjemahkan “-Nya.”
theological_decisions:
- issue: Penerjemahan gelar אֲדֹנֵי הָאֲדֹנִים
  choice: Tuhan, Penguasa atas segala penguasa
  alternative: Tuhan segala tuan
  rationale: Ungkapan Ibrani menegaskan supremasi Allah atas semua pemegang kuasa. Pilihan ini mempertahankan fungsi gelar dan makna kedaulatan tertinggi dalam bahasa Indonesia yang jelas, tanpa mengubahnya menjadi pernyataan tentang banyak ilah.
- issue: Cakupan makna חֶסֶד
  choice: kasih setia-Nya
  alternative: kesetiaan-Nya pada perjanjian
  rationale: “Kasih setia” menjaga perpaduan kasih, kebaikan, dan loyalitas dalam חֶסֶד. Alternatif yang secara eksplisit menyebut perjanjian mungkin tepat sebagai penjelasan, tetapi lebih sempit dan lebih interpretatif daripada bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis-liturgis. Susunan kalimat mempertahankan seruan imperatif dan alasan yang menjadi pola khas Mazmur 136.
