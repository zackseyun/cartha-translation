  text: לְ/עֹשֵׂ֣ה הַ֭/שָּׁמַיִם בִּ/תְבוּנָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/005.yaml
  text: To him who made the heavens with understanding[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: Kepada Dia yang menjadikan langit dengan pengertian[a], sebab kasih setia-Nya[b] berlangsung selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dengan kebijaksanaan” atau “melalui pengertian.” Kata depan Ibrani dapat menyatakan cara maupun sarana.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani חֶסֶד (khesed), yang menurut konteks juga dapat diterjemahkan “belas kasihan,” “kemurahan,” atau “kesetiaan perjanjian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: kepada Dia yang menjadikan
  rationale: Prefiks לְ dalam rangkaian liturgis mazmur ini menyatakan arah pujian, sedangkan bentuk partisip dapat menyatakan tindakan khas Allah. “Menjadikan” terdengar alami dan tetap dekat dengan bentuk Ibrani tanpa memaksakan kala lampau.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” merupakan padanan idiomatis untuk bentuk Ibrani yang secara morfologis jamak dan mempertahankan cakupan kosmologis konteks penciptaan.
- source_word: בִּתְבוּנָה
  choice: dengan pengertian
  rationale: תְּבוּנָה menunjuk pada pengertian, kecerdasan, atau daya memahami. “Dengan pengertian” mempertahankan pilihan leksikal dan membiarkan בְּ menyatakan cara atau sarana.
- source_word: כִּי
  choice: sebab
  rationale: Dalam refrein Mazmur 136, כִּי memperkenalkan alasan untuk memuji; “sebab” ringkas, wajar, dan bernada sastra.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini secara harfiah menunjuk pada keberlangsungan tanpa akhir. Frasa nominal tersebut dapat berdiri alami dalam refrein Indonesia tanpa menambahkan kata kerja yang tidak dinyatakan dalam teks Ibrani.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד memadukan kasih, kesetiaan, dan kemurahan dalam relasi. “Kasih setia” adalah padanan Indonesia yang ringkas dan luas; sufiks orang ketiga diterjemahkan “-Nya”.
theological_decisions:
- issue: Makna חֶסֶד dalam refrein Mazmur 136
  choice: kasih setia-Nya
  alternative: belas kasihan-Nya; kesetiaan perjanjian-Nya
  rationale: “Kasih setia” mempertahankan dimensi afektif dan loyal dari חֶסֶד tanpa mempersempitnya hanya menjadi belas kasihan atau secara eksplisit menambahkan istilah “perjanjian” yang tidak terdapat dalam ayat.
- issue: Aspek partisip עֹשֵׂה
  choice: yang menjadikan
  alternative: yang telah menjadikan; yang membuat
  rationale: Partisip Ibrani tidak dengan sendirinya menetapkan kala. “Menjadikan” mempertahankan ketegangan antara tindakan penciptaan yang telah terjadi dan penggambaran Allah berdasarkan karya-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis-liturgis. Susunan “kepada Dia yang” mempertahankan kesinambungan rangkaian pujian, sedangkan refrein dibuat ringkas agar mudah diucapkan berulang-ulang.
