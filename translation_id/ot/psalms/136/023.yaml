  text: who remembered us in our low estate[b][a], for his steadfast love is forever.
translation:
  language: id
  text: yang mengingat kita dalam kerendahan kita[a], sebab kasih setia-Nya tetap untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam kehinaan kita” atau “ketika kita direndahkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבְּשִׁפְלֵנוּ
  choice: yang mengingat kita ketika kita berada dalam keadaan hina
  rationale: Ungkapan ini menggambarkan keadaan rendah, terhina, tertindas, atau lemah. Frasa “ketika kita berada dalam keadaan hina” terdengar wajar dalam bahasa Indonesia tanpa menentukan secara berlebihan penyebab atau jenis kehinaan itu.
- source_word: זָכַר
  choice: mengingat
  rationale: Makna dasarnya ialah “mengingat”. Dalam konteks tindakan Allah, kata ini dapat menyiratkan bahwa Ia memperhatikan lalu bertindak, tetapi terjemahan tidak memperluas maknanya secara eksplisit.
- source_word: לָנוּ
  choice: kita
  rationale: Preposisi ל menandai objek verba זכר dalam idiom Ibrani. Dalam bahasa Indonesia, bentuk alami ialah “mengingat kita”.
- source_word: כִּי
  choice: sebab
  rationale: Dalam refrein Mazmur 136, kata ini menghubungkan tindakan Allah dengan kasih setia-Nya yang kekal. “Sebab” mempertahankan hubungan kausal serta cocok dengan gaya liturgis.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan tanpa akhir. Susunan tanpa verba dipertahankan sejauh masih wajar dalam refrein puitis bahasa Indonesia.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חסד mencakup kasih, kemurahan, kesetiaan, dan komitmen relasional. “Kasih setia” mempertahankan keluasan makna itu tanpa membatasinya hanya pada belas kasihan atau memasukkan istilah doktrinal tambahan.
theological_decisions:
- issue: Makna tindakan Allah yang “mengingat” umat-Nya
  choice: mengingat kita
  alternative: memperhatikan kita / bertindak bagi kita
  rationale: Dalam konteks Alkitab, “mengingat” sering berimplikasi pada tindakan penyelamatan, tetapi verba Ibrani sendiri tetap berarti “mengingat”. Implikasi tersebut tidak dijadikan parafrasa dalam teks utama.
- issue: Bentuk refrein כִּי לְעוֹלָם חַסְדּוֹ
  choice: sebab kasih setia-Nya untuk selama-lamanya
  alternative: sebab kasih setia-Nya tetap untuk selama-lamanya / sebab kasih setia-Nya kekal
  rationale: Pilihan utama mempertahankan klausa nominal Ibrani dan pola refrein, sedangkan alternatif dengan verba lebih idiomatis tetapi menambahkan unsur yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan layak untuk pembacaan liturgis. Huruf kecil pada “yang” mempertahankan bentuk anak kalimat yang melanjutkan ayat sebelumnya. Refrein dibuat ringkas dan konsisten dengan struktur nominal teks Ibrani.
