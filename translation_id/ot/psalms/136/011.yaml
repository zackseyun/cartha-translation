  text: and brought Israel out from among them[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: 'dan membawa Israel keluar dari tengah-tengah mereka,

    sebab kasih setia-Nya berlangsung untuk selama-lamanya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: dan membawa ... keluar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan kausatif, yaitu ‘membawa keluar’. Ungkapan ini alami dalam bahasa Indonesia dan tidak memperinci cara yang tidak dinyatakan teks.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri bagi umat atau bangsa Israel, dipertahankan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִתּוֹכָם
  choice: dari tengah-tengah mereka
  rationale: Ungkapan ini menunjukkan bahwa Israel dikeluarkan dari lingkungan atau bagian dalam kelompok tersebut. ‘Dari tengah-tengah mereka’ mempertahankan gambaran spasial-relasional Ibrani dengan wajar.
- source_word: כִּי
  choice: sebab
  rationale: Dalam mazmur ini, כִּי memperkenalkan refrein yang memberikan dasar bagi pujian. ‘Sebab’ mempertahankan daya kausal sekaligus sesuai dengan irama liturgis.
- source_word: לְעוֹלָם
  choice: tetap untuk selama-lamanya
  rationale: Klausa Ibrani tidak memiliki verba eksplisit. ‘Tetap’ melengkapi ungkapan secara alami dan menyampaikan keberlangsungan tanpa akhir.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חסד memadukan kasih, kebaikan, dan kesetiaan yang teguh. ‘Kasih setia’ merupakan padanan Indonesia yang ringkas dan mempertahankan keluasan maknanya lebih baik daripada ‘belas kasihan’ saja.
theological_decisions:
- issue: Penerjemahan חַסְדּוֹ dalam refrein Mazmur 136
  choice: kasih setia-Nya tetap untuk selama-lamanya
  alternative: belas kasihan-Nya untuk selama-lamanya; kasih-Nya yang teguh kekal selamanya
  rationale: ‘Kasih setia’ mempertahankan unsur kasih dan kesetiaan ilahi tanpa membatasi maknanya hanya pada belas kasihan atau secara eksplisit memasukkan istilah ‘perjanjian’, yang tidak hadir dalam frasa ini. Verba ‘tetap’ disuplai agar klausa tanpa verba dalam bahasa Ibrani menjadi alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan baris mempertahankan bentuk pernyataan diikuti refrein liturgis. Tidak diperlukan catatan kaki karena pilihan utama cukup langsung dan alternatifnya tidak menandai ambiguitas tekstual yang perlu ditampilkan.
