  text: לְ֭/עֹשֵׂה אוֹרִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/007.yaml
  text: To him who made the great lights[b][a], for his steadfast love endures forever.
translation:
  language: id
  text: kepada Dia yang menjadikan benda-benda penerang yang besar[a], sebab kasih setia-Nya[b] tetap untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penerang-penerang yang besar.” Yang dimaksud ialah benda-benda langit yang menjadi pembawa terang.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebab kesetiaan kasih-Nya tetap untuk selama-lamanya.” Kata Ibrani חֶסֶד mencakup kasih yang teguh, loyal, dan bertahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: kepada Dia yang menjadikan
  rationale: Prefiks לְ menyatakan sasaran pujian dalam litani, sedangkan bentuk partisip עֹשֵׂה diungkapkan sebagai tindakan penciptaan yang telah dilakukan, sesuai konteks karya penciptaan dalam mazmur ini.
- source_word: אוֹרִים גְּדֹלִים
  choice: benda-benda penerang yang besar
  rationale: אוֹרִים menunjuk pada benda-benda langit yang memancarkan atau membawa terang, selaras dengan bahasa penciptaan dalam Kejadian 1. Ungkapan ini lebih tepat daripada sekadar 'cahaya-cahaya' dan tetap mudah dipahami.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan refrein yang memberikan alasan bagi pujian.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Secara harfiah menyatakan keberlangsungan tanpa akhir; dalam bahasa Indonesia, klausa nominal ini alami dan tidak perlu ditambahi kata kerja yang tidak dinyatakan dalam teks Ibrani.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan loyalitas yang bertahan. 'Kasih setia' mempertahankan keluasan makna itu dalam ungkapan Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Pemaknaan חֶסֶד dalam refrein
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: kesetiaan kasih-Nya untuk selama-lamanya; kemurahan-Nya untuk selama-lamanya
  rationale: '''Kasih setia'' mempertahankan unsur kasih dan loyalitas tanpa membatasi istilah itu hanya pada belas kasihan atau menjadikannya istilah perjanjian yang terlalu eksplisit. Struktur tanpa kata ''bertahan'' juga mencerminkan klausa nominal Ibrani dan mempertahankan ketegangannya.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bernada liturgis. Pemakaian 'Dia' menjaga struktur sapaan pujian, sedangkan 'menjadikan' mempertahankan gema kisah penciptaan. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
