  text: who gives food to all flesh[a], for his steadfast love endures forever.
translation:
  language: id
  text: yang memberikan makanan kepada semua makhluk hidup[a], sebab kasih setia-Nya untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti kepada semua yang berdaging.” “Semua yang berdaging” adalah ungkapan Ibrani bagi semua makhluk hidup, sedangkan “roti” dapat berarti makanan pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹתֵן
  choice: yang memberikan
  rationale: Partisip ini menggambarkan tindakan Allah yang terus berlangsung; bentuk relatif cocok dengan rangkaian litani mazmur.
- source_word: לֶחֶם
  choice: makanan
  rationale: Walaupun arti harfiahnya 'roti', kata ini di sini secara metonimis menunjuk pada makanan secara umum.
- source_word: לְכָל בָּשָׂר
  choice: kepada semua makhluk hidup
  rationale: Ungkapan harfiah 'kepada semua daging' merupakan idiom Ibrani yang mencakup segala makhluk bernyawa; terjemahan ini menyampaikan cakupannya secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan dasar pujian dalam refrein dan mempertahankan hubungan kausalnya.
- source_word: לְעוֹלָם
  choice: tetap untuk selama-lamanya
  rationale: Klausa Ibrani tidak memakai verba; 'tetap' melengkapinya secara wajar sekaligus mengungkapkan keberlangsungan tanpa akhir.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: Ungkapan ini mencakup kasih yang penuh kemurahan, teguh, dan setia; 'kasih setia' merupakan padanan Indonesia yang ringkas dan berbobot.
theological_decisions:
- issue: Cakupan לְכָל בָּשָׂר ('semua daging')
  choice: semua makhluk hidup
  alternative: seluruh umat manusia; semua orang; semua yang berdaging
  rationale: Dalam konteks pemeliharaan ilahi, idiom Ibrani ini lazimnya mencakup makhluk hidup secara luas, bukan hanya manusia. Terjemahan tidak mempersempit cakupannya tanpa dasar tekstual.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Memberikan' dipilih daripada 'memberi' untuk irama liturgis yang lebih utuh; 'kasih setia-Nya tetap untuk selama-lamanya' mempertahankan pola refrein dan nuansa keberlangsungan.
