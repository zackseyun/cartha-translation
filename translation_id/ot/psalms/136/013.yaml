  text: kepada Dia yang membelah Laut Teberau menjadi beberapa bagian[a], karena kasih setia-Nya untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “Laut Merah”. Teks Ibrani berbunyi “Laut Teberau”, yang secara harfiah berarti “Laut Gelagah” atau “Laut Tumbuhan Air”.
    reason: alternative_reading
lexical_decisions:
- source_word: לְ/גֹזֵר
  choice: kepada Dia yang membelah
  rationale: Awalan לְ dalam litani ini menunjuk kepada Dia yang dipuji. Partisip גֹזֵר berarti memotong atau membagi; “membelah” alami dalam bahasa Indonesia dan tepat untuk tindakan atas laut.
- source_word: יַם סוּף
  choice: Laut Teberau
  rationale: Nama tradisional Indonesia ini secara harfiah mewakili יַם סוּף, yakni “Laut Gelagah/Alang-alang,” tanpa menggantinya dengan identifikasi tradisional “Laut Merah.”
- source_word: לִ/גְזָרִים
  choice: menjadi bagian-bagian
  rationale: Kata גְזָרִים menunjuk pada bagian-bagian yang terpisah. Bentuk jamak dipertahankan, meskipun ungkapan ini agak tidak biasa, untuk membawa citra pembelahan dalam teks Ibrani.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan pujian dalam refrein mazmur ini.
- source_word: לְ/עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; konstruksi nominal Ibrani dipertahankan secara alami bersama “kasih setia-Nya.”
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih yang teguh dan kesetiaan relasional; “kasih setia” merupakan padanan Indonesia yang alami dan tidak mempersempit maknanya menjadi hanya belas kasihan.
