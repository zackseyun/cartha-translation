translation:
  language: id
  text: matahari untuk berkuasa pada siang hari[a], sebab kasih setia-Nya berlangsung untuk selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk memerintah pada siang hari.” Kata Ibrani yang dipakai adalah nomina yang berarti “kekuasaan” atau “pemerintahan.”
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani חֶסֶד (khesed), yang juga dapat mencakup kemurahan, belas kasih, dan kesetiaan dalam ikatan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[penanda objek, tidak diterjemahkan tersendiri]'
  rationale: Menandai objek langsung definit dalam bahasa Ibrani dan sudah terwakili oleh susunan alami bahasa Indonesia.
- source_word: הַשֶּׁמֶשׁ
  choice: matahari
  rationale: Padanan langsung dan alami bagi nomina definit שֶׁמֶשׁ.
- source_word: לְמֶמְשֶׁלֶת
  choice: untuk berkuasa
  rationale: Nomina מֶמְשֶׁלֶת berarti kekuasaan atau pemerintahan. Dalam konteks paralel penciptaan, frasa tujuan 'untuk berkuasa' menyampaikan fungsi matahari secara alami tanpa menghilangkan gagasan pemerintahan.
- source_word: בַּיּוֹם
  choice: pada siang hari
  rationale: Menyatakan lingkup waktu kekuasaan matahari serta membentuk pasangan alami dengan malam pada ayat berikutnya.
- source_word: כִּי
  choice: sebab
  rationale: Mempertahankan fungsi kausal refrain sebagai alasan untuk memuji Allah.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyatakan durasi tanpa akhir. Frasa nominal Ibrani tidak memiliki verba eksplisit, sehingga terjemahan ini mempertahankan bentuk verbless dengan wajar dalam bahasa Indonesia.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: Ungkapan Indonesia ini mencakup kasih, kesetiaan, dan keteguhan yang terkandung dalam חֶסֶד tanpa mempersempitnya hanya menjadi belas kasihan.
theological_decisions:
- issue: Penerjemahan חֶסֶד dalam refrain Mazmur 136
  choice: kasih setia-Nya untuk selama-lamanya
  alternative: belas kasih-Nya kekal; kasih perjanjian-Nya untuk selama-lamanya
  rationale: '''Kasih setia'' paling baik mempertahankan keluasan makna חֶסֶד, yaitu kasih yang teguh, kemurahan, dan kesetiaan relasional, tanpa memasukkan rumusan denominasi tertentu.'
- issue: Bentuk nominal מֶמְשֶׁלֶת
  choice: untuk berkuasa
  alternative: untuk memerintah; untuk kekuasaan
  rationale: Terjemahan infinitif sesuai dengan fungsi matahari dalam konteks ayat 7–9, sedangkan catatan kaki mempertahankan kemungkinan bentuk nominal yang lebih harfiah.
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan khidmat. Susunan mengikuti puisi Ibrani: objek penciptaan diikuti fungsinya, lalu refrain liturgis. Kapital pada enklitik -Nya merujuk kepada Allah sesuai kebiasaan ejaan religius Indonesia.'
