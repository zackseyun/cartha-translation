  text: Yahweh mengasihi gerbang-gerbang Sion lebih daripada semua tempat kediaman Yakub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֵב
  choice: mengasihi
  rationale: Partisipel Qal dari אהב berfungsi secara verbal dengan Yahweh sebagai subjek. “Mengasihi” menyampaikan tindakan atau sikap yang berlangsung tanpa menambahkan kadar intensitas yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: שַׁעֲרֵי
  choice: pintu-pintu gerbang
  rationale: Bentuk jamak konstruksi dari שַׁעַר dipertahankan sebagai gambaran konkret. Ungkapan ini dapat mewakili kota secara metonimis, tetapi makna itu tidak perlu dijelaskan di dalam teks utama.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Menggunakan bentuk nama tempat yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: מִכֹּל
  choice: lebih daripada segala
  rationale: Preposisi מִן bersama כֹּל setelah verba yang menyatakan kesukaan menunjukkan perbandingan. Rumusan ini mempertahankan bahwa gerbang-gerbang Sion lebih dikasihi dibandingkan semua tempat kediaman Yakub.
- source_word: מִשְׁכְּנוֹת
  choice: tempat kediaman
  rationale: Bentuk jamak מִשְׁכָּן di sini merujuk pada tempat-tempat tinggal, bukan khusus pada Kemah Suci. “Tempat kediaman” jelas dan tidak menimbulkan kesan kultis yang tidak diperlukan.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama yang terdapat dalam teks Ibrani dipertahankan, meskipun secara kolektif dapat menunjuk kepada umat atau wilayah Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menggunakan Tetragramaton secara langsung; mempertahankan “Yahweh” menjaga sifatnya sebagai nama perjanjian tanpa menggantinya dengan sebuah gelar.
- issue: Daya komparatif מִכֹּל
  choice: lebih daripada segala tempat kediaman Yakub
  alternative: melebihi segala tempat kediaman Yakub
  rationale: Bahasa Ibrani paling wajar menyatakan perbandingan. Pilihan ini menegaskan kedudukan istimewa Sion tanpa menambahkan alasan teologis yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. “Pintu-pintu gerbang” mempertahankan bentuk jamak dan citra konkret teks Ibrani; “segala” memberi nuansa mazmur yang luhur tetapi tetap alami.
