  yaml_path: translation/ot/psalms/087/003.yaml
  text: Glorious things are spoken of you[a], city of God. Selah
translation:
  language: id
  text: Hal-hal yang mulia dikatakan tentang engkau[a], kota Allah. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengenai engkau” atau “di dalammu.” Preposisi Ibrani di sini dapat dipahami dengan lebih dari satu cara; “tentang engkau” paling sesuai dengan konteks pujian kepada Sion.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: Hal-hal yang mulia
  rationale: Bentuk ini berasal dari כבד dan dipakai secara substantival dalam bentuk jamak feminin; dalam konteks pujian, ungkapan ini menunjuk pada perkara-perkara yang penuh kehormatan dan kemuliaan.
- source_word: מְדֻבָּר
  choice: dikatakan
  rationale: Partisip Pual dari דבר menyatakan bahwa hal-hal mulia itu diucapkan. Bentuk pasif 'dikatakan' alami dan tetap mempertahankan susunan Ibrani.
- source_word: בָּךְ
  choice: tentang engkau
  rationale: Preposisi ב dengan verba berbicara dapat menyatakan hal yang menjadi pokok pembicaraan. 'Tentang engkau' paling jelas dalam bahasa Indonesia, sedangkan kemungkinan lokatif 'di dalammu' dipertahankan dalam catatan kaki.
- source_word: עִיר הָאֱלֹהִים
  choice: kota Allah
  rationale: Rangkaian konstruksi ini secara langsung berarti 'kota Allah'. Frasa tersebut berfungsi sebagai sapaan atau aposisi bagi pihak kedua yang disebut sebelumnya.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis atau musikal ini tidak pasti; karena itu, istilah tersebut ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia, bukan ditafsirkan.
