  text: יְֽהוָ֗ה יִ֭סְפֹּר בִּ/כְת֣וֹב עַמִּ֑ים זֶ֖ה יֻלַּד שָׁ֣ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/006.yaml
  text: Yahweh will count[a], when he records the peoples, “This one was born there.” Selah
translation:
  language: id
  text: 'Yahweh akan menghitung ketika Ia mencatat bangsa-bangsa: “Orang ini lahir di sana.”[a] Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, sesuai konteks, “di dalamnya,” yang merujuk kepada Sion dari ayat-ayat sekitarnya.
    reason: alternatif leksikal-kontekstual untuk שָׁם; teks Ibrani sendiri memakai adverbia “di sana”.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: יִסְפֹּר
  choice: akan menghitung
  rationale: Makna dasar verba qal ספר adalah ‘menghitung’; konteks pencatatan dijelaskan oleh frasa berikutnya.
- source_word: בִּכְתוֹב
  choice: ketika Ia mencatat
  rationale: Preposisi ב dengan infinitif konstruk berfungsi temporal. ‘Mencatat’ menyampaikan konteks daftar atau registrasi secara alami.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk pada berbagai kelompok bangsa; pilihan ini alami dalam bahasa Indonesia dan sesuai dengan konteks internasional mazmur.
- source_word: זֶה
  choice: Orang ini
  rationale: Demonstrativa tunggal menunjuk kepada seorang individu. ‘Orang ini’ wajar dalam bahasa Indonesia tanpa membatasi pada jenis kelamin laki-laki.
- source_word: יֻלַּד
  choice: lahir
  rationale: Bentuk pasif ילד berarti ‘dilahirkan/was born’; dalam bahasa Indonesia, ‘lahir’ adalah ungkapan alami dan sudah menyampaikan keadaan pasif tersebut.
- source_word: שָׁם
  choice: di sana
  rationale: Adverbia Ibrani secara harfiah berarti ‘di sana’ dan secara kontekstual merujuk kepada Sion, tanpa perlu membuat rujukan itu lebih eksplisit daripada teks sumber.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal yang maknanya tidak pasti ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: ‘Yahweh’ mempertahankan transliterasi nama perjanjian Allah dan tidak menggantinya dengan sebuah gelar.
- issue: Apakah שָׁם perlu diperjelas menjadi ‘di Sion’ atau ‘di dalamnya’
  choice: di sana
  alternative: di Sion; di dalamnya
  rationale: Walaupun konteks menunjuk kepada Sion, teks Ibrani memakai adverbia ‘di sana’. Terjemahan mempertahankan ungkapan dan ambiguitas rujukannya tanpa memperjelas secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur deklaratif serta citra penghitungan dan pencatatan dipertahankan. Kapitalisasi ‘Ia’ dipakai untuk memperjelas bahwa subjek tersirat pada frasa temporal tetap Yahweh.
