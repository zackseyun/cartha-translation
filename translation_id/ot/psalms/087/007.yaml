  text: Singers and dancers alike say[b][a], “All my springs are in you.”
translation:
  language: id
  text: Para penyanyi dan penari berkata[a][b], “Segala mata airku ada padamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemain seruling” sebagai arti bagi “penari”. Istilah Ibrani ini secara tradisional dipahami sebagai orang yang menari atau berputar, tetapi arti yang berkaitan dengan alat musik juga pernah diusulkan.
    reason: lexical_alternative
  - marker: b
    text: “Segala mata airku ada padamu” adalah metafora puitis yang dapat dipahami sebagai “segala sumber kehidupanku ada padamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרִים
  choice: Para penyanyi
  rationale: Bentuk ini paling alami dipahami dari verba שׁיר, ‘bernyanyi’, dan kesejajarannya dengan כְּחֹלְלִים mendukung kelompok pelaku musik, bukan ‘para pemimpin’.
- source_word: כְּחֹלְלִים
  choice: dan penari sama-sama
  rationale: Kemungkinan besar berasal dari חול dalam arti ‘menari/berputar’. Ungkapan Indonesia ini menyampaikan pasangan penyanyi dan penari dalam baris Ibrani yang padat, sementara kemungkinan ‘pemain seruling’ dicatat dalam catatan kaki.
- source_word: כָּל
  choice: Segala
  rationale: ‘Segala’ menyatakan keseluruhan dan terdengar lebih alami serta puitis di depan frasa jamak ‘mata airku’ daripada ‘setiap’.
- source_word: מַעְיָנַי
  choice: mata airku
  rationale: מַעְיָן menunjuk pada mata air atau sumber air. ‘Mata air’ mempertahankan citra konkret dan puitis tanpa menutup kemungkinan makna metaforis sebagai sumber kehidupan.
- source_word: בָּךְ
  choice: ada di dalammu
  rationale: Preposisi בְּ pada dasarnya berarti ‘di/dalam’. Pronomina feminin tunggal merujuk kepada Sion; ‘ada di dalammu’ mempertahankan lokasinya secara metaforis dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Daya metaforis ‘mata airku’ dalam sapaan kepada Sion
  choice: Mempertahankan metafora ‘Segala mata airku ada di dalammu.’
  alternative: ‘Segala sumber kehidupanku berasal darimu’ atau ‘Segala berkatku ada padamu.’
  rationale: Teks merayakan Sion sebagai tempat kepunyaan dan kehidupan, tetapi gambaran Ibraninya tetap puitis dan terbuka. Terjemahan tidak mengubahnya menjadi tafsiran doktrinal yang lebih sempit.
- issue: Subjek tersirat dari pernyataan langsung
  choice: Menambahkan ‘berkata’ secara implisit untuk menghasilkan kalimat Indonesia yang utuh.
  alternative: '‘Para penyanyi maupun penari: Segala mata airku ada di dalammu.’'
  rationale: Bahasa Ibrani menyajikan konstruksi puitis yang padat tanpa verba ujar eksplisit. ‘Berkata’ membuat hubungan sintaksis jelas tanpa menentukan lebih jauh identitas atau makna teologis para pelakunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. ‘Para penyanyi dan penari sama-sama’ terdengar alami bagi pembaca umum; ‘mata airku’ mempertahankan citra konkret teks sumber. Semua penanda catatan kaki hadir dalam teks utama.
