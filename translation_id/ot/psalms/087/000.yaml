id: PSA.87.0
reference: Psalms 87:0
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לִ/בְנֵי קֹ֭רַח מִזְמ֣וֹר שִׁ֑יר יְ֝סוּדָת֗/וֹ בְּ/הַרְרֵי קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/000.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. Its foundation is in the holy mountains.
translation:
  language: id
  text: Mazmur bani Korah[a]; sebuah nyanyian. Fondasinya terletak di gunung-gunung kudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur untuk bani Korah”; kata depan Ibrani dapat menyatakan kepunyaan, peruntukan, atau hubungan, bukan hanya kepengarangan langsung.
    reason: lexical_alternative
  - marker: b
    text: Acuan kata “-nya” tidak disebutkan dalam bahasa Ibrani; kemungkinan yang dimaksud ialah Sion atau Yerusalem.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: bani Korah
  rationale: Ungkapan ini menyatakan hubungan mazmur dengan kelompok keturunan Korah. Kata depan לִ dapat menunjukkan kepengarangan, kepemilikan, peruntukan, atau hubungan; bentuk ringkas “bani Korah” mempertahankan keluasan itu, sementara catatan kaki menjelaskannya.
- source_word: מִזְמוֹר שִׁיר
  choice: Mazmur ...; sebuah nyanyian
  rationale: Kedua istilah genre diterjemahkan secara terpisah tetapi dihubungkan dengan tanda titik koma agar judul terdengar wajar dan keduanya tetap terwakili.
- source_word: יְסוּדָתוֹ
  choice: Fondasinya
  rationale: Sufiks orang ketiga tunggal maskulin dipertahankan sebagai “-nya” tanpa memasukkan Sion atau Yerusalem ke dalam teks, sebab acuannya tidak disebutkan secara eksplisit.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: di gunung-gunung kudus
  rationale: Bentuk jamak “gunung-gunung” dan gagasan kekudusan dipertahankan secara langsung.
theological_decisions:
- issue: Acuan sufiks pada יְסוּדָתוֹ
  choice: Teks utama memakai “Fondasinya” tanpa menyebut acuan.
  alternative: “Fondasi Sion/Yerusalem” atau “Fondasi kota itu.”
  rationale: Bahasa Ibrani hanya menyatakan sufiks “-nya”; Sion atau Yerusalem sangat mungkin tersirat dari konteks mazmur, tetapi tidak dinyatakan dalam klausa ini. Terjemahan tidak boleh diam-diam menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. “Bani Korah” dipilih karena merupakan ungkapan Alkitabiah yang masih mudah dipahami, sedangkan susunan kalimat dibuat alami bagi pembaca modern. Semua penanda catatan kaki muncul dalam teks utama.
