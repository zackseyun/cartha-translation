  text: Mazmur dan nyanyian dari keturunan Korah[a]. Dasarnya[b] berada di gunung-gunung yang kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mazmur untuk keturunan Korah”; kata depan Ibrani dapat menyatakan peruntukan atau hubungan, bukan hanya kepengarangan langsung.'
