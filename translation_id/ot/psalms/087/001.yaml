lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: keturunan Korah
  rationale: Ungkapan ini menunjuk kepada kelompok yang dikenal sebagai bani atau keturunan Korah. Awalan לְ dapat menyatakan kepengarangan, kepemilikan, peruntukan, atau hubungan; pilihan utama dibuat alami dalam bahasa Indonesia tanpa memastikan kepengarangan langsung.
- source_word: מִזְמוֹר
  choice: mazmur
  rationale: Istilah baku dan tepat untuk jenis karya musikal-puitis ini dalam Kitab Mazmur.
- source_word: שִׁיר
  choice: nyanyian
  rationale: Padanan langsung yang mempertahankan sebutan jenis kedua dalam teks Ibrani, tanpa meleburkannya dengan 'mazmur'.
- source_word: יְסוּדָתוֹ
  choice: dasarnya
  rationale: Kata benda ini berarti 'dasar' atau 'fondasi', dengan akhiran pronominal orang ketiga maskulin tunggal. Bentuk '-nya' dalam bahasa Indonesia secara alami mempertahankan ketidakjelasan mengenai siapa atau apa yang menjadi acuannya.
- source_word: בְּהַרְרֵי
  choice: berada di gunung-gunung
  rationale: Preposisi בְ menyatakan lokasi dan bentuk הַרְרֵי adalah jamak. Penambahan 'berada' menghasilkan kalimat Indonesia yang wajar tanpa menambah penafsiran substantif.
- source_word: קֹדֶשׁ
  choice: yang kudus
  rationale: Kata ini menerangkan gunung-gunung sebagai tempat yang kudus; konstruksi 'yang kudus' jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Acuan akhiran pronominal dalam יְסוּדָתוֹ
  choice: Mempertahankan acuan yang tersirat melalui bentuk 'dasarnya'.
  alternative: '''Dasar-Nya'' dengan Allah sebagai acuan; atau ''dasar kota itu'' dengan Sion/Yerusalem sebagai acuan.'
  rationale: Teks Ibrani memakai akhiran maskulin tunggal tetapi tidak menyebutkan antesedennya dalam ayat ini. Bentuk Indonesia 'dasarnya' memungkinkan pembaca mengikuti ketegangan puitis tersebut tanpa memaksakan Allah ataupun Sion sebagai acuan eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. 'Keturunan Korah' dipilih daripada 'bani Korah' agar mudah dipahami pembaca umum. Tanda titik koma menyatukan dua sebutan jenis dalam judul, sedangkan 'dasarnya' sengaja tidak diberi kapital agar ambiguitas sumber tetap terpelihara.
