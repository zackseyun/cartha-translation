  source_fidelity: 'Terjemahan secara tepat mengikuti struktur dan makna Ibrani: לְצִיּוֹן diperkenalkan sebagai topik (“Tentang Sion”), יֵאָמַר dipertahankan sebagai pasif impersonal bernuansa futurum, dan pengulangan אִישׁ וְאִישׁ tersampaikan secara distributif. Pronomina pada “di dalamnya” dan “mengokohkannya” tetap merujuk kepada Sion. Penekanan הוּא serta gelar עֶלְיוֹן juga terwakili oleh “Yang Mahatinggi sendiri.”'
