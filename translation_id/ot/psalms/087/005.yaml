source:
  edition: WLC
  text: וּֽ/לֲ/צִיּ֨וֹן יֵאָמַ֗ר אִ֣ישׁ וְ֭/אִישׁ יֻלַּד בָּ֑/הּ וְ/ה֖וּא יְכוֹנְנֶ֣/הָ עֶלְיֽוֹן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/005.yaml
  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
translation:
  language: id
  text: Tentang Sion akan dikatakan, “Orang yang satu dan yang lain dilahirkan di dalamnya,”[a] dan Yang Mahatinggi sendiri akan mengokohkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Orang demi orang dilahirkan di dalamnya.” Bahasa Ibrani mengulang kata “orang” untuk menyatakan arti distributif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: Tentang Sion
  rationale: Preposisi ל memperkenalkan Sion sebagai pokok pembicaraan. “Tentang Sion” alami dalam bahasa Indonesia dan tetap mempertahankan hubungan puitis dengan konteks.
- source_word: יֵאָמַר
  choice: akan dikatakan
  rationale: Bentuk nifal imperfek paling wajar diterjemahkan sebagai pasif impersonal dengan nuansa mendatang atau deklaratif.
- source_word: אִישׁ וְאִישׁ
  choice: Orang yang satu dan yang lain
  rationale: Pengulangan אִישׁ bersifat distributif, menunjuk kepada orang-orang secara individual. Ungkapan ini mempertahankan bentuk berpasangan tanpa menjadi kaku dalam bahasa Indonesia.
- source_word: יֻלַּד בָּהּ
  choice: dilahirkan di dalamnya
  rationale: Bentuk pasif dipertahankan. “Di dalamnya” merujuk kembali kepada Sion dan menjaga gambaran kota sebagai tempat kelahiran.
- source_word: וְהוּא ... עֶלְיוֹן
  choice: dan Yang Mahatinggi sendiri
  rationale: Pronomina הוּא bersifat tegas; “sendiri” menyampaikan penekanan itu, sedangkan עֶלְיוֹן diterjemahkan dengan gelar ilahi Indonesia yang baku.
- source_word: יְכוֹנְנֶהָ
  choice: akan mengokohkannya
  rationale: Kata kerja כון dalam bentuk ini menyatakan tindakan menjadikan teguh atau kukuh. “Mengokohkan” sesuai untuk Sion dan tidak membatasi maknanya hanya pada pendirian awal.
theological_decisions:
- issue: Rujukan pronomina tegas הוּא yang diikuti עֶלְיוֹן
  choice: Yang Mahatinggi sendiri akan mengokohkan Sion
  alternative: dan Dia, Yang Mahatinggi, akan mengokohkannya
  rationale: Susunan ini memahami הוּא sebagai rujukan kepada Allah dan mempertahankan tekanannya melalui “sendiri”, tanpa menambahkan klaim teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Personifikasi Sion dipertahankan secara alami melalui pronomina “-nya”, sementara penekanan pada tindakan ilahi disampaikan dengan “sendiri”.
