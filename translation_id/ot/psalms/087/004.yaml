  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַזְכִּ֤יר רַ֥הַב וּ/בָבֶ֗ל לְֽ/יֹ֫דְעָ֥/י הִנֵּ֤ה פְלֶ֣שֶׁת וְ/צ֣וֹר עִם כּ֑וּשׁ זֶ֝֗ה יֻלַּד שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: id
  text: 'Aku akan menyebut Rahab[a] dan Babel di antara mereka yang mengenal aku[b]; lihatlah, Filistia dan Tirus, bersama Kush: orang ini dilahirkan di sana.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab adalah nama puitis bagi Mesir.
    reason: alternative_reading
  - marker: b
    text: Atau “kepada mereka yang mengenal aku.” Frasa Ibraninya dapat menunjukkan bahwa bangsa-bangsa itu termasuk di antara mereka yang mengakui sang pembicara.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, di Sion, menurut konteks mazmur ini.
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Aku akan menyebut
  rationale: Bentuk hifil dari זכר di sini berarti menyebut atau mengingatkan. “Menyebut” paling alami dalam konteks daftar puitis ini.
- source_word: רַהַב
  choice: Rahab
  rationale: Nama puitis bagi Mesir dipertahankan sebagai nama diri; maknanya dijelaskan dalam catatan kaki.
- source_word: וּבָבֶל
  choice: dan Babel
  rationale: Menggunakan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: לְיֹדְעָי
  choice: di antara mereka yang mengenal aku
  rationale: Frasa Ibrani yang padat ini paling mungkin menyatakan bahwa bangsa-bangsa tersebut termasuk golongan yang mengakui atau mengenal sang pembicara. Alternatif datif tetap dicatat.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Mempertahankan fungsi seruan yang mengarahkan perhatian dengan bahasa Indonesia yang wajar dan bernada puitis.
- source_word: פְלֶשֶׁת
  choice: Filistia
  rationale: Teks menyebut wilayah atau negeri, bukan secara eksplisit bangsa Filistin.
- source_word: וְצוֹר
  choice: dan Tirus
  rationale: Menggunakan bentuk Indonesia yang lazim bagi nama tempat ini.
- source_word: עִם כּוּשׁ
  choice: bersama Kush
  rationale: Menyampaikan makna penyertaan dari עִם secara ringkas dan alami.
- source_word: כּוּשׁ
  choice: Kush
  rationale: Transliterasi nama kuno menghindari penyamaan yang berpotensi menyesatkan dengan negara Etiopia modern.
- source_word: זֶה
  choice: orang ini
  rationale: Demonstrativa tunggal maskulin dipertahankan sebagai rujukan tunggal. Kata “orang” membuat ungkapan itu alami dalam bahasa Indonesia tanpa menentukan jenis kelamin.
- source_word: יֻלַּד שָׁם
  choice: dilahirkan di sana
  rationale: Mencerminkan bentuk pasif dari ילד dan adverbia שָׁם secara langsung.
theological_decisions:
- issue: Identitas pembicara orang pertama dalam “mereka yang mengenal aku”
  choice: Mempertahankan kata ganti orang pertama tanpa mengidentifikasi pembicara dan tanpa kapitalisasi teologis.
  alternative: Pembicaranya adalah TUHAN; atau pembicaranya adalah Sion yang dipersonifikasikan.
  rationale: Ayat ini sendiri tidak menyebutkan identitas pembicara secara eksplisit. Bentuk “aku” mempertahankan ambiguitas sastra dan teologis teks Ibrani.
- issue: Acuan “di sana”
  choice: Mempertahankan “di sana” dalam teks utama.
  alternative: Menggantikannya dengan “di Sion” atau “di kota Allah”.
  rationale: Konteks mazmur mengarah kepada Sion, tetapi teks ayat hanya memakai adverbia “di sana”; catatan kaki menerangkan acuan kontekstual tanpa memasukkannya ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan puitis. Tanda baca mengikuti susunan daftar dan pernyataan dalam bahasa Ibrani. Huruf kecil pada “aku” dipakai untuk tidak menetapkan identitas pembicara yang tidak dinyatakan secara eksplisit dalam ayat ini.
