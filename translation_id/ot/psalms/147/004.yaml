  text: מוֹנֶ֣ה מִ֭סְפָּר לַ/כּוֹכָבִ֑ים לְ֝/כֻלָּ֗/ם שֵׁמ֥וֹת יִקְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/004.yaml
  text: He counts the number of the stars; he calls all of them by name.
translation:
  language: id
  text: Ia menghitung jumlah bintang; Ia memanggil semuanya dengan nama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹנֶה
  choice: menghitung
  rationale: Partisipel dari מנה menyatakan tindakan menghitung atau menentukan jumlah. Bentuk kini yang sederhana dan alami dalam bahasa Indonesia mempertahankan gambaran tindakan Allah yang terus berlaku.
- source_word: מִסְפָּר לַכּוֹכָבִים
  choice: jumlah bintang
  rationale: מִסְפָּר berarti 'jumlah' atau 'hitungan'; bersama מוֹנֶה, frasa ini menekankan penghitungan yang tepat. 'Menghitung jumlah bintang' alami dan dekat dengan susunan Ibrani.
- source_word: לְכֻלָּם
  choice: semuanya
  rationale: Frasa ini mencakup setiap bintang tanpa terkecuali. 'Semuanya' ringkas dan mempertahankan daya distributifnya.
- source_word: שֵׁמוֹת יִקְרָא
  choice: memanggil ... dengan nama
  rationale: קרא bersama שֵׁמוֹת secara idiomatis berarti memanggil dengan nama. Pilihan ini mempertahankan kemungkinan nuansa panggilan individual tanpa membatasi maknanya hanya pada tindakan memberi nama.
theological_decisions:
- issue: Subjek ilahi tersirat, bukan disebutkan dalam ayat
  choice: Menggunakan 'Ia' sebagai subjek yang merujuk kepada TUHAN dalam konteks sebelumnya.
  alternative: Mengulang 'TUHAN' atau memakai 'Dia'.
  rationale: Teks Ibrani tidak menyebutkan nomina subjek dalam ayat ini, tetapi subjeknya berlanjut dari konteks. 'Ia' merupakan pronomina yang wajar dan bermartabat; kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah tanpa menambahkan nama ilahi yang tidak terdapat dalam ayat.
- issue: Makna קרא dalam hubungan dengan nama-nama
  choice: memanggil semuanya dengan nama
  alternative: menamai semuanya
  rationale: '''Memanggil ... dengan nama'' menjaga rentang makna קרא—memanggil, menyebut, atau menghadirkan—serta tidak menyempitkannya menjadi sekadar pemberian nama.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Paralelisme dua klausa dipertahankan; tanda titik koma menandai keseimbangan antarbagiannya.
