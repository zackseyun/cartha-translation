id: PSA.147.7
reference: Psalms 147:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֱנ֣וּ לַ/יהוָ֣ה בְּ/תוֹדָ֑ה זַמְּר֖וּ לֵ/אלֹהֵ֣י/נוּ בְ/כִנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/007.yaml
  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
translation:
  language: id
  text: Bernyanyilah bagi Yahweh dengan ucapan syukur[a]; bermazmurlah bagi Allah kita dengan kecapi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tanggapilah Yahweh dengan ucapan syukur.” Kata Ibrani ini dapat berarti “menjawab” atau “menanggapi”, tetapi di sini kemungkinan menunjuk pada nyanyian bersahut-sahutan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih tepat, “lira”, yaitu alat musik petik kuno sejenis kecapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱנוּ
  choice: Bernyanyilah
  rationale: Dalam bentuk Qal, verba ini pada dasarnya dapat berarti ‘menjawab’ atau ‘menanggapi’, tetapi dalam konteks musik dan ibadah dapat menunjuk pada nyanyian bersahut-sahutan. Paralelnya dengan זַמְּרוּ mendukung terjemahan idiomatis ‘Bernyanyilah’.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai arah atau pihak yang menerima pujian, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: בְּתוֹדָה
  choice: dengan ucapan syukur
  rationale: תּוֹדָה menyatakan rasa syukur atau pujian berupa syukur; ‘dengan ucapan syukur’ mempertahankan unsur rasa terima kasih dan fungsi penyertaan dari preposisi ב.
- source_word: זַמְּרוּ
  choice: bermazmurlah
  rationale: זמר berarti menyanyi atau memainkan musik sebagai pujian. ‘Bermazmurlah’ merupakan ungkapan ibadah yang alami dan membedakannya dari imperatif pertama, sekaligus cocok dengan penyebutan alat musik.
- source_word: לֵאלֹהֵינוּ
  choice: bagi Allah kita
  rationale: Preposisi ל menandai pihak yang dituju oleh pujian, dan sufiks orang pertama jamak dipertahankan melalui ‘kita’.
- source_word: בְכִנּוֹר
  choice: dengan kecapi
  rationale: כִּנּוֹר adalah alat musik petik kuno sejenis lira. ‘Kecapi’ lebih mudah dipahami pembaca Indonesia sebagai padanan fungsional, sementara jenis instrumen yang lebih tepat dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Bentuk ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Bermazmurlah’ mempertahankan nuansa pujian musikal, sedangkan ‘kecapi’ dipakai demi keterpahaman umum dengan penjelasan organologis dalam catatan kaki.
