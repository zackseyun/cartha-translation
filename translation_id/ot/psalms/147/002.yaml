  text: בּוֹנֵ֣ה יְרוּשָׁלִַ֣ם יְהוָ֑ה נִדְחֵ֖י יִשְׂרָאֵ֣ל יְכַנֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/002.yaml
  text: Yahweh builds Jerusalem[b][a]; he gathers the outcasts of Israel.
translation:
  language: id
  text: Yahweh membangun Yerusalem; Ia menghimpun orang-orang Israel yang tercerai-berai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang Israel yang terusir” atau “orang-orang Israel yang terbuang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹנֵה
  choice: membangun kembali
  rationale: Partisipel Qal dari בנה menyatakan tindakan yang berlangsung atau menjadi ciri khas. Dalam konteks pemulihan Yerusalem, “membangun kembali” menyampaikan makna restoratif secara alami, meski unsur “kembali” tersirat dari konteks dan bukan morfem tersendiri.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Nama tempat ini memakai bentuk baku dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נִדְחֵי
  choice: orang-orang ... yang tercerai-berai
  rationale: Bentuk dari נדח menunjuk kepada mereka yang dihalau, disingkirkan, atau terserak. “Tercerai-berai” alami dalam bahasa Indonesia dan mempertahankan cakupan yang lebih luas daripada “orang buangan”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama bangsa ini memakai bentuk baku dalam bahasa Indonesia.
- source_word: יְכַנֵּס
  choice: Ia menghimpun
  rationale: Bentuk Piel imperfek dari כנס berarti mengumpulkan atau menghimpun. “Menghimpun” sesuai dengan gambaran pemulihan suatu umat yang terserak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton sebagai nama diri; bentuk “Yahweh” mempertahankan fungsi tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan נִדְחֵי יִשְׂרָאֵל
  choice: orang-orang Israel yang tercerai-berai
  alternative: orang-orang Israel yang terbuang
  rationale: Kata ini dapat menyoroti keadaan terserak maupun keadaan dihalau atau dibuang. Teks utama memakai ungkapan luas, sedangkan alternatif yang menekankan pembuangan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Susunan dua klausa dipertahankan, dengan pronomina “Ia” untuk alur alami. Titik koma mencerminkan kesejajaran tindakan Yahweh dalam teks Ibrani.
