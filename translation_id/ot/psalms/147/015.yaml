  text: He sends his command to the earth[b][a]; his word runs swiftly.
translation:
  language: id
  text: Ia mengirimkan titah-Nya[a] ke bumi; firman-Nya berlari dengan sangat cepat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan-Nya” untuk “titah-Nya” (אִמְרָתוֹ).
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan segera” atau “dengan cepat”; ungkapan Ibraninya menekankan gerakan yang amat cepat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: Ia menyampaikan
  rationale: Partisipel ini berfungsi secara verbal dan melanjutkan gambaran tentang tindakan Allah. “Menyampaikan” secara alami mengungkapkan bahwa titah itu dikirimkan kepada tujuannya.
- source_word: אִמְרָתוֹ
  choice: titah-Nya
  rationale: Kata ini berarti ucapan atau perkataan. Dalam konteks tindakan Allah yang berkuasa atas ciptaan, “titah” menyampaikan daya pelaksana ucapan itu sekaligus membedakannya dari דְּבָרוֹ pada baris berikutnya.
- source_word: אָרֶץ
  choice: ke bumi
  rationale: Cakupan kosmis mazmur mendukung “bumi”, bukan “negeri”; preposisi “ke” sesuai dengan tindakan mengirim atau menyampaikan.
- source_word: עַד מְהֵרָה
  choice: dengan sangat cepat
  rationale: Ungkapan adverbial ini menekankan cepatnya gerakan. “Dengan sangat cepat” mempertahankan daya intensifnya dalam bahasa Indonesia yang alami.
- source_word: יָרוּץ
  choice: berlari
  rationale: Arti dasar verba ini adalah “berlari”. Terjemahan harfiah mempertahankan personifikasi puitis firman Allah yang bergerak cepat.
- source_word: דְּבָרוֹ
  choice: firman-Nya
  rationale: “Firman” merupakan padanan yang alami dan bermartabat untuk perkataan Allah. Pilihan yang berbeda dari “titah” mempertahankan variasi dua kata Ibrani yang bersinonim.
theological_decisions:
- issue: Hakikat perkataan Allah dalam paralelisme puitis
  choice: Menggambarkan perkataan Allah sebagai titah dan firman yang berdaya tanpa mengidentifikasikannya dengan pribadi tertentu.
  alternative: Menerjemahkan kedua nomina dengan kata yang sama, atau menafsirkan ayat ini secara eksplisit sebagai rujukan kepada Logos pribadi.
  rationale: Teks Ibrani berbicara tentang ucapan Allah yang efektif dalam ciptaan dan pemeliharaan-Nya, tetapi tidak secara eksplisit membuat identifikasi kristologis. Terjemahan mempertahankan bobot teologis serta ketegangan puitisnya tanpa memasukkan kategori doktrinal yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan bermartabat. Personifikasi “firman-Nya berlari” dipertahankan agar citra Ibraninya tidak diratakan. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
