  text: He declares his word to Jacob[b][a], his statutes and his judgments to Israel.
translation:
  language: id
  text: 'Ia menyatakan firman-Nya kepada Yakub[a],

    ketetapan-ketetapan-Nya dan hukum-hukum-Nya[b] kepada Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia memberitahukan firman-Nya kepada Yakub.”'
    reason: lexical_alternative
  - marker: b
    text: “Hukum-hukum” juga dapat diterjemahkan “keputusan-keputusan hukum” atau “peraturan-peraturan” dalam konteks hukum perjanjian ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  choice: menyatakan
  rationale: Partisipel Hifil dari נגד berarti membuat sesuatu diketahui atau menyatakannya. "Menyatakan" alami dalam bahasa Indonesia dan mempertahankan gagasan komunikasi yang terbuka.
- source_word: דברו
  choice: firman-Nya
  rationale: דָּבָר dapat berarti kata, firman, perkara, atau pesan. Dalam paralelisme dengan ketetapan dan hukum, "firman-Nya" mempertahankan cakupan perjanjian yang luas tanpa mempersempitnya menjadi satu perintah tertentu.
- source_word: ליעקב
  choice: kepada Yakub
  rationale: Preposisi ל menandai penerima. Nama Yakub dipertahankan secara langsung dan digunakan secara korporat dalam kesejajaran puitis dengan Israel.
- source_word: חקיו
  choice: ketetapan-ketetapan-Nya
  rationale: חֻקִּים menunjuk pada ketentuan atau ketetapan yang ditetapkan. Bentuk ulang menyampaikan kemajemukan, dan "ketetapan" merupakan istilah hukum yang jelas dalam bahasa Indonesia.
- source_word: ומשפטיו
  choice: dan hukum-hukum-Nya
  rationale: מִשְׁפָּטִים dalam konteks hukum-perjanjian dapat menunjuk pada keputusan hukum, peraturan, atau hukum. "Hukum-hukum-Nya" terdengar alami dan mempertahankan nuansa yuridis.
- source_word: לישראל
  choice: kepada Israel
  rationale: Preposisi ל kembali menandai penerima. Israel dipertahankan sebagai nama perjanjian yang sejajar secara puitis dengan Yakub.
theological_decisions:
- issue: Makna korporat Yakub dan Israel
  choice: Menerjemahkan kedua nama secara langsung sebagai "Yakub" dan "Israel" tanpa menambahkan "bangsa" atau "keturunan".
  alternative: kepada keturunan Yakub ... kepada Israel
  rationale: Bahasa Ibrani memakai kedua nama perjanjian itu secara langsung. Bentuk ini menjaga daya sastra dan paralelisme serta tidak memasukkan penjelasan tafsir ke dalam teks utama.
- issue: Cakupan מִשְׁפָּטִים
  choice: hukum-hukum-Nya
  alternative: keputusan-keputusan hukum-Nya; peraturan-peraturan-Nya
  rationale: Istilah Ibrani dapat menunjuk pada keputusan hukum maupun norma yang mengikat. "Hukum-hukum" mempertahankan nuansa legal-perjanjian dengan bahasa Indonesia yang wajar, sementara alternatif dicatat agar keluasan maknanya tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme Ibrani dipertahankan dalam dua larik; nama Yakub dan Israel tidak diperluas secara interpretatif. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab berbahasa Indonesia.
