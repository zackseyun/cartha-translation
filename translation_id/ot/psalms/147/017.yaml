  register: Bahasa Indonesia baku modern dengan gaya puitis yang lugas dan bermartabat. Kapital pada akhiran pronominal -Nya menandai rujukan kepada Allah. Susunan klausa mempertahankan paralelisme gambaran cuaca dan pertanyaan retoris Ibrani.
