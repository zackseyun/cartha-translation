  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan unsur-unsur utama Ibrani: tindakan melemparkan (מַשְׁלִיךְ), es milik-Nya (קַרְחוֹ), perbandingan dengan pecahan/remah (כְפִתִּים), dan pertanyaan retoris mengenai ketahanan terhadap dingin-Nya. “Siapa dapat bertahan menghadapi dingin-Nya?” menyampaikan daya retoris מִי יַעֲמֹד לִפְנֵי dengan baik; catatan kaki menyediakan bentuk yang lebih harfiah.'
