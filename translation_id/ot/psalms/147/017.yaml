id: PSA.147.17
reference: Psalms 147:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַשְׁלִ֣יךְ קַֽרְח֣/וֹ כְ/פִתִּ֑ים לִ/פְנֵ֥י קָ֝רָת֗/וֹ מִ֣י יַעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/017.yaml
  text: He throws down his ice like crumbs[b][a]; who can stand before his cold?
translation:
  language: id
  text: Ia melemparkan es-Nya seperti remah-remah[a]; siapa dapat bertahan menghadapi dingin-Nya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti potongan-potongan kecil” atau “seperti suapan-suapan.” Gambaran Ibraninya adalah pecahan kecil, kemungkinan mengingatkan pada remah atau potongan roti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “siapa dapat berdiri di hadapan dingin-Nya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁלִיךְ
  choice: melemparkan
  rationale: Bentuk partisip Hifil menggambarkan tindakan menyebabkan sesuatu tercampak atau dilempar; bentuk kini puitis dipertahankan secara alami dalam bahasa Indonesia.
- source_word: קַרְחוֹ
  choice: es-Nya
  rationale: קֶרַח dapat berarti es atau embun beku. Dalam gambaran sesuatu yang dilemparkan berupa butiran atau pecahan, 'es' paling konkret dan alami.
- source_word: כְפִתִּים
  choice: seperti remah-remah
  rationale: פִּתִּים menunjuk pada potongan-potongan kecil atau suapan, khususnya pecahan roti; 'remah-remah' menyampaikan gambaran benda-benda kecil yang terserak.
- source_word: לִפְנֵי
  choice: menghadapi
  rationale: Secara harfiah berarti 'di hadapan'; dalam pertanyaan retoris ini, 'menghadapi' menyampaikan daya tahan terhadap dingin secara wajar tanpa menghilangkan relasi 'di hadapan'.
- source_word: קָרָתוֹ
  choice: dingin-Nya
  rationale: קָרָה berarti hawa dingin; akhiran pronominal dipertahankan untuk menegaskan bahwa gejala alam itu berada dalam kuasa Allah.
- source_word: מִי יַעֲמֹד
  choice: siapa dapat bertahan
  rationale: Secara harfiah 'siapa akan berdiri'; dalam konteks ini maksudnya ialah mampu tetap berdiri atau menahan kedahsyatan hawa dingin. 'Bertahan' alami dalam bahasa Indonesia, sementara alternatif harfiahnya dicatat.
theological_decisions: []
