  text: גָּד֣וֹל אֲדוֹנֵ֣י/נוּ וְ/רַב כֹּ֑חַ לִ֝/תְבוּנָת֗/וֹ אֵ֣ין מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/005.yaml
  text: Great is our Lord[a], and abundant in power; his understanding is beyond number.
translation:
  language: id
  text: Besarlah Tuhan kita dan besar kuasa-Nya; pengertian-Nya tidak terhitung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bagi pengertian-Nya tidak ada bilangan”; dapat juga diterjemahkan “pengertian-Nya tidak terhingga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Besarlah
  rationale: Adjektiva predikatif ditempatkan di awal untuk mempertahankan susunan dan daya pujian dalam bahasa Ibrani; partikel -lah memberi nuansa deklaratif yang wajar dan khidmat.
- source_word: אֲדֹנֵינוּ
  choice: Tuhan kita
  rationale: אֲדוֹן di sini merupakan gelar dengan akhiran orang pertama jamak, bukan nama ilahi YHWH. 'Tuhan kita' mempertahankan gelar serta unsur 'kita' tanpa menyamakannya dengan konvensi penulisan nama ilahi.
- source_word: וְרַב
  choice: dan besar
  rationale: רַב menyatakan besarnya kadar atau kelimpahan. Bersama כֹּחַ, ungkapan 'besar kuasa-Nya' alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan klausa pembuka.
- source_word: כֹּחַ
  choice: kuasa-Nya
  rationale: כֹּחַ menunjuk pada kekuatan, daya, atau kemampuan. 'Kuasa' sesuai dengan konteks pujian kepada Allah; akhiran '-Nya' membuat hubungan yang tersirat dalam ungkapan Ibrani menjadi alami dalam bahasa Indonesia.
- source_word: לִתְבוּנָתוֹ
  choice: pengertian-Nya
  rationale: תְּבוּנָה dapat berarti pengertian, pemahaman, atau daya memahami. 'Pengertian-Nya' merupakan padanan yang luas dan mudah dipahami, sedangkan prefiks ל dipahami sebagai bagian dari konstruksi relasional dengan אֵין מִסְפָּר.
- source_word: אֵין מִסְפָּר
  choice: tidak terhitung
  rationale: Ungkapan ini secara harfiah menyatakan bahwa tidak ada bilangan bagi pengertian-Nya. 'Tidak terhitung' mempertahankan citra penghitungan dan menyampaikan bahwa pengertian-Nya melampaui batas hitungan.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנֵינוּ dalam mazmur pujian
  choice: Tuhan kita
  alternative: Tuan kita
  rationale: Bentuk ini adalah אֲדוֹן dengan akhiran 'kita', bukan nama YHWH. 'Tuhan kita' mempertahankan fungsi gelar ilahi yang lazim dalam bahasa Indonesia tanpa mengimpor konvensi khusus untuk nama perjanjian.
- issue: Gambaran ketakterhitungan pengertian Allah
  choice: pengertian-Nya tidak terhitung
  alternative: pengertian-Nya tidak terhingga
  rationale: Pilihan utama mempertahankan metafora bilangan dalam teks Ibrani dan tidak mempersempit pernyataan menjadi rumusan filosofis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada pujian. Susunan awal 'Besarlah Tuhan kita' mempertahankan penekanan Ibrani, sedangkan pengulangan 'besar' dipertahankan karena alami dan mencerminkan kesejajaran puitis. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan.
