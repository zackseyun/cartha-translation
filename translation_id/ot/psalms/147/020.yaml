  text: לֹ֘א עָ֤שָׂה כֵ֨ן לְ/כָל גּ֗וֹי וּ/מִשְׁפָּטִ֥ים בַּל יְדָע֗וּ/ם הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/020.yaml
  text: He has not done so for any nation; they have not known his judgments[a]. Praise Yah!
translation:
  language: id
  text: Ia tidak berbuat demikian kepada bangsa mana pun; ketetapan-ketetapan-Nya tidak mereka kenal. Pujilah Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pujilah TUHAN!” Dalam bahasa Ibrani, seruan ini adalah halelu-yah, secara harfiah “Pujilah Yah,” dengan memakai bentuk singkat nama ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא עָשָׂה כֵן
  choice: Ia tidak berbuat demikian
  rationale: Mempertahankan negasi, tindakan Allah sebagai subjek tersirat, dan כֵן yang menunjuk kembali pada perlakuan istimewa yang disebut dalam konteks sebelumnya.
- source_word: לְכָל גּוֹי
  choice: kepada bangsa mana pun
  rationale: Dalam lingkup negasi, 'bangsa mana pun' merupakan ungkapan Indonesia yang alami untuk menyatakan bahwa tidak ada bangsa lain yang menerima perlakuan serupa.
- source_word: וּמִשְׁפָּטִים
  choice: ketetapan-ketetapan hukum-Nya
  rationale: מִשְׁפָּטִים di sini menunjuk pada ketentuan atau keputusan hukum Allah yang diberikan kepada Israel. Pilihan ini mempertahankan nuansa yuridis tanpa membatasinya hanya pada putusan pengadilan.
- source_word: בַּל יְדָעוּם
  choice: tidak mereka kenal
  rationale: Menerjemahkan partikel negatif puitis בַּל dan verba ידע secara langsung. Akhiran objek jamak pada יְדָעוּם diungkapkan melalui frasa objek sebelumnya, sedangkan akhiran kepunyaan '-Nya' diperjelas dari rujukan kepada Allah dalam konteks.
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Menerjemahkan imperatif jamak הַלְלוּ dan mempertahankan יָהּ sebagai bentuk singkat nama ilahi, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan bentuk singkat nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN; Haleluya
  rationale: Teks Ibrani memakai bentuk singkat יָהּ. Transliterasi 'Yah' mempertahankan bentuk nama yang benar-benar terdapat dalam sumber, sementara 'TUHAN' mengubahnya menjadi gelar dan 'Haleluya' mentransliterasi seluruh seruan tanpa menjelaskan artinya.
- issue: Cakupan ketidaktahuan bangsa-bangsa
  choice: ketetapan-ketetapan hukum-Nya tidak mereka kenal
  alternative: mereka tidak memahami ketetapan-ketetapan hukum-Nya
  rationale: ידע pada dasarnya berarti 'mengenal/mengetahui'. Terjemahan tidak mempersempitnya menjadi sekadar ketidakmampuan memahami, sehingga ketegangan makna sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bernada puitis. Inversi 'tidak mereka kenal' dipertahankan karena tetap wajar dalam puisi dan menonjolkan ketetapan hukum sebagai topik klausa kedua.
