  text: He does not delight in the strength of the horse; he takes no pleasure in the legs of the man.
translation:
  language: id
  text: Ia tidak menyukai kekuatan kuda; Ia tidak berkenan pada tungkai manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶחְפָּץ
  choice: menyukai
  rationale: Dalam konteks ini verba חפץ menyatakan kesenangan atau kegemaran; 'menyukai' alami dalam bahasa Indonesia dan tetap mempertahankan gagasan bahwa kekuatan militer bukan hal yang disenangi Allah.
- source_word: גְבוּרַת הַסּוּס
  choice: kekuatan kuda
  rationale: Terjemahan langsung yang mempertahankan citra kuda sebagai lambang kekuatan, khususnya dalam konteks perang.
- source_word: שׁוֹקֵי הָאִישׁ
  choice: kaki-kaki manusia
  rationale: שׁוֹק menunjuk tungkai atau bagian kaki yang melambangkan daya jasmani. Bentuk jamak diterjemahkan eksplisit, sedangkan הָאִישׁ dipahami secara generik sebagai manusia.
- source_word: יִרְצֶה
  choice: berkenan pada
  rationale: רצה dapat berarti berkenan atau menerima dengan senang hati. Ungkapan ini menjaga paralelisme dengan 'menyukai' tanpa menyamakan kedua verba sepenuhnya.
theological_decisions:
- issue: Objek kesenangan Allah dalam paralelisme ayat
  choice: Ayat menyatakan bahwa Allah tidak menilai tinggi kekuatan kuda maupun daya jasmani manusia.
  alternative: Menafsirkan kuda secara khusus sebagai kekuatan militer dan kaki manusia secara khusus sebagai kecepatan prajurit.
  rationale: Citra tersebut mungkin berkonotasi militer, tetapi teks sendiri menyebut kekuatan kuda dan kaki manusia. Terjemahan mempertahankan citra itu tanpa mempersempitnya melalui tafsiran tambahan.
- issue: Artikel pada הָאִישׁ
  choice: manusia
  alternative: orang itu atau laki-laki itu
  rationale: Dalam pasangan puitis ini, bentuk berartikel paling wajar berfungsi generik, yakni manusia sebagai golongan, bukan menunjuk seorang laki-laki tertentu.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. Kapitalisasi 'Ia' dipakai sebagai pronomina yang merujuk kepada Allah. Pengulangan pola negatif dan kesejajaran kedua baris dipertahankan.
