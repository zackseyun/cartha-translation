  text: נוֹתֵ֣ן לִ/בְהֵמָ֣ה לַחְמָ֑/הּ לִ/בְנֵ֥י עֹ֝רֵ֗ב אֲשֶׁ֣ר יִקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/009.yaml
  text: He gives food to the animals[b][a], and to the young ravens that cry out.
translation:
  language: id
  text: Ia memberi makanan kepada hewan dan kepada anak-anak burung gagak yang berseru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang memanggil”; teks Ibrani tidak menyebutkan kepada siapa mereka berseru.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן
  choice: Ia memberi
  rationale: Partisipel Qal dipakai secara predikatif dalam konteks pujian; bentuk kini dalam bahasa Indonesia menyampaikan tindakan Allah yang berlangsung atau menjadi kebiasaan.
- source_word: לִבְהֵמָה
  choice: kepada hewan-hewan
  rationale: בְּהֵמָה dapat berarti binatang atau ternak. Kesejajarannya dengan burung gagak mendukung arti umum 'hewan-hewan', bukan hanya ternak.
- source_word: לַחְמָהּ
  choice: makanan
  rationale: Walaupun לֶחֶם secara harfiah berarti 'roti', kata itu juga berarti makanan secara umum; 'makanan' paling wajar dalam konteks hewan.
- source_word: לִבְנֵי עֹרֵב
  choice: kepada anak-anak burung gagak
  rationale: Ungkapan בְּנֵי yang diikuti nama binatang lazim menunjuk kepada anak atau keturunannya. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gambaran teks.
- source_word: אֲשֶׁר יִקְרָאוּ
  choice: yang berseru
  rationale: קרא berarti memanggil atau berseru. Objek seruan tidak dinyatakan dalam bahasa Ibrani, sehingga 'yang berseru' mempertahankan ketidaktersuratannya.
theological_decisions:
- issue: Apakah perlu menyatakan secara eksplisit bahwa anak-anak burung gagak berseru kepada Allah
  choice: 'Objek seruan dibiarkan tersirat: ''yang berseru'''
  alternative: '''yang berseru kepada-Nya'' atau ''ketika mereka berseru'''
  rationale: Teks Ibrani tidak menyebutkan kepada siapa mereka berseru. Tidak menambahkan 'kepada-Nya' mempertahankan ambiguitas asli, meskipun konteks mazmur menggambarkan pemeliharaan Allah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Ia' merujuk kepada Allah dari konteks ayat sebelumnya. Susunan kalimat mempertahankan kesejajaran antara hewan-hewan dan anak-anak burung gagak.
