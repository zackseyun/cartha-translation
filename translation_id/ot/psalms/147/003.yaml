  yaml_path: translation/ot/psalms/147/003.yaml
  text: He heals the brokenhearted and binds up their wounds[a].
translation:
  language: id
  text: Ia menyembuhkan orang-orang yang patah hati dan membalut luka-luka mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rasa sakit mereka” atau “cedera mereka.” Istilah Ibrani ini dapat berarti rasa sakit atau luka; “luka-luka” dipilih karena sesuai dengan gambaran membalut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹפֵא
  choice: Ia menyembuhkan
  rationale: Partisipel Qal berfungsi secara predikatif/deskriptif dalam konteks pujian. Bentuk kini bahasa Indonesia menyatakan tindakan Allah yang menjadi ciri-Nya secara alami.
- source_word: לִשְׁבוּרֵי לֵב
  choice: orang-orang yang patah hati
  rationale: Frasa konstruksi ini secara harfiah berarti 'mereka yang remuk hatinya'. Ungkapan 'patah hati' mempertahankan metafora batin dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: וּמְחַבֵּשׁ
  choice: dan membalut
  rationale: Dalam konteks penyembuhan, חבש berarti mengikat atau membalut bagian yang terluka. 'Membalut' mempertahankan gambaran medis konkret dan terdengar alami.
- source_word: לְעַצְּבוֹתָם
  choice: luka-luka mereka
  rationale: Kata עצבות dapat menunjuk pada rasa sakit, cedera, atau luka. 'Luka-luka' paling sesuai dengan tindakan membalut, sementara alternatif semantiknya dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan gambaran penyembuhan
  choice: Mempertahankan perpaduan antara penderitaan batin dan gambaran perawatan luka.
  alternative: Menafsirkan ayat ini secara eksklusif sebagai penyembuhan rohani atau secara utama sebagai penyembuhan jasmani.
  rationale: Paralelisme menghubungkan orang yang 'patah hati' dengan tindakan 'membalut luka-luka mereka'. Terjemahan tidak mempersempit ketegangan puitis ini menjadi satu jenis penyembuhan saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk rujukan kepada Allah secara jelas dan ringkas; bentuk jamak ulang pada 'orang-orang' dan 'luka-luka' menjaga kelancaran serta cakupan kolektif ayat.
