id: PSA.147.11
reference: Psalms 147:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רוֹצֶ֣ה יְ֭הוָה אֶת יְרֵאָ֑י/ו אֶת הַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/011.yaml
  text: Yahweh delights in those who fear him[b][a], in those who hope for his steadfast love.
translation:
  language: id
  text: Yahweh berkenan kepada orang-orang yang takut kepada-Nya, kepada orang-orang yang berharap pada kasih setia-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menantikan kasih setia-Nya.” Kata kerja Ibrani dapat menyatakan penantian yang penuh harap.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֶה
  choice: berkenan kepada
  rationale: Partisipel רצה menyatakan kesenangan atau penerimaan yang penuh kemurahan. “Berkenan kepada” alami dan bermartabat dalam bahasa Indonesia serta tidak mereduksinya menjadi sekadar “menginginkan”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
- source_word: יְרֵאָיו
  choice: orang-orang yang takut kepada-Nya
  rationale: Ungkapan ini mempertahankan kata “takut” beserta ketegangan makna hormat, gentar, dan kesalehan di hadapan Allah, tanpa mempersempitnya menjadi sekadar rasa hormat.
- source_word: הַמְיַחֲלִים
  choice: orang-orang yang berharap
  rationale: Dalam konstruksi dengan לְ, יחל menunjuk pada penantian penuh harap. “Berharap pada” menyampaikan orientasi percaya dan menanti secara alami dalam bahasa Indonesia.
- source_word: לְחַסְדּוֹ
  choice: pada kasih setia-Nya
  rationale: חסד mencakup kasih, kesetiaan, kemurahan, dan komitmen relasional. “Kasih setia” merupakan padanan Indonesia yang ringkas dan mapan tanpa membatasi maknanya hanya pada belas kasihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan nama ilahi secara langsung; transliterasi mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa ירא
  choice: takut kepada-Nya
  alternative: menghormati-Nya
  rationale: “Takut” mempertahankan ketegangan teologis antara kegentaran, hormat, dan kesalehan, sedangkan “menghormati” dapat terlalu melunakkan ungkapan sumber.
- issue: Nuansa יחל dengan לְ
  choice: berharap pada kasih setia-Nya
  alternative: menantikan kasih setia-Nya
  rationale: Kata kerja ini dapat mencakup berharap dan menanti. Teks utama memakai “berharap” karena alami dengan objek kasih setia, sementara catatan mempertahankan kemungkinan nuansa penantian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme dua frasa “kepada orang-orang yang ...” dipertahankan agar struktur puisi Ibrani tetap terasa. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum Indonesia.
