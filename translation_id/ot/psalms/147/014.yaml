  text: Ia menjadikan perbatasanmu aman; Ia mengenyangkanmu dengan gandum terbaik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lemak gandum,” sebuah ungkapan Ibrani untuk bagian gandum yang terbaik atau terkaya.
