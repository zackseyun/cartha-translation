  yaml_path: translation/ot/psalms/147/013.yaml
  text: For he has strengthened the bars of your gates[b][a]; he has blessed your children within you.
translation:
  language: id
  text: Sebab Ia telah memperkuat palang-palang pintu gerbangmu; Ia telah memberkati anak-anakmu[a] di tengah-tengahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak lelakimu.” Kata Ibrani yang digunakan dapat menunjuk khusus kepada anak laki-laki atau, secara lebih luas, kepada anak-anak atau keturunan; dalam konteks sapaan kepada kota, pengertian yang lebih luas sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan alasan bagi ajakan memuji pada ayat sebelumnya; “Sebab” mempertahankan hubungan kausal dan cocok dengan ragam puisi yang bermartabat.
- source_word: חִזַּק
  choice: telah memperkuat
  rationale: Bentuk piel perfek menyatakan tindakan membuat kuat atau kukuh yang dipandang telah terlaksana.
- source_word: בְּרִיחֵי
  choice: palang-palang
  rationale: Merujuk pada palang pengaman pintu gerbang. “Palang-palang” alami dalam bahasa Indonesia dan tidak menentukan mekanisme yang tidak dinyatakan teks.
- source_word: שְׁעָרָיִךְ
  choice: pintu gerbangmu
  rationale: Bentuk jamak dengan akhiran orang kedua feminin tunggal menunjuk kepada kota yang dipersonifikasikan. Dalam bahasa Indonesia, “pintu gerbangmu” dapat menyatakan sejumlah gerbang secara kolektif dengan alami.
- source_word: בֵּרַךְ
  choice: telah memberkati
  rationale: Bentuk piel perfek dari ברך diterjemahkan langsung dan mempertahankan aspek tindakan yang telah terlaksana.
- source_word: בָּנַיִךְ
  choice: anak-anakmu
  rationale: בנים dapat berarti khususnya anak laki-laki atau secara kolektif anak-anak/keturunan. Dalam sapaan kepada kota, makna kolektif bagi penduduknya paling sesuai, sementara alternatif literal dicatat.
- source_word: בְּקִרְבֵּךְ
  choice: di tengah-tengahmu
  rationale: Terjemahan dekat dari ungkapan Ibrani yang berarti “di tengahmu”; bentuk ini mempertahankan personifikasi kota dan terdengar wajar dalam puisi Indonesia.
theological_decisions:
- issue: Kota sebagai pihak yang disapa dalam bentuk feminin tunggal
  choice: Mempertahankan sapaan orang kedua melalui akhiran “-mu” tanpa menyisipkan nama Yerusalem atau Sion.
  alternative: Menyebut “Yerusalem” secara eksplisit dalam ayat.
  rationale: Akhiran Ibrani berbentuk feminin tunggal dan menunjuk kepada kota yang dipersonifikasikan, tetapi nama kota tidak terdapat dalam ayat ini. Bahasa Indonesia dapat mempertahankan sapaan itu tanpa tambahan penafsiran.
- issue: Cakupan makna בָּנַיִךְ dalam konteks kota
  choice: anak-anakmu
  alternative: anak-anak lelakimu
  rationale: Kata tersebut memang dapat menunjuk kepada anak laki-laki, tetapi juga dapat dipakai secara kolektif. Konteks sapaan kepada kota mendukung pengertian luas, namun ambiguitas leksikal tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang wajar dan bermartabat. Kapitalisasi “Ia” mengikuti kebiasaan penulisan rujukan kepada Allah. Pengulangan “telah” mempertahankan kesejajaran dua verba perfek Ibrani. Penempatan catatan kaki langsung setelah “anak-anakmu” menjelaskan satu-satunya alternatif leksikal yang perlu ditampilkan.
