base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/001.yaml
  text: Praise Yah[a], for it is good to sing praises to our God[b]; for it is pleasant and praise is fitting.
translation:
  language: id
  text: Pujilah Yah[a]! Sebab bermazmur bagi Allah kita itu baik; sebab puji-pujian itu menyenangkan, dan puji-pujian itu pantas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Yah,” bentuk pendek nama ilahi; banyak terjemahan menerjemahkannya “TUHAN.”'
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “pantas” juga dapat berarti “elok,” “indah,” atau “serasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak dari הלל merupakan ajakan langsung kepada umat untuk memuji. Dalam bahasa Indonesia, bentuk “-lah” menyampaikan seruan itu dengan wajar dan khidmat.
- source_word: יָהּ
  choice: Yah
  rationale: Ini adalah bentuk pendek nama ilahi, bukan bentuk lengkap יהוה. Transliterasi “Yah” mempertahankan bentuk sumber dan kaitannya dengan seruan “Haleluya”.
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ajakan untuk memuji. “Sebab” alami dalam ragam mazmur dan mempertahankan hubungan logis antarklausa.
- source_word: טוֹב
  choice: baiklah
  rationale: Adjektiva ini menyatakan bahwa tindakan bermazmur itu baik. Bentuk predikatif “baiklah” memberi bahasa Indonesia yang alami tanpa mempersempit maknanya menjadi sekadar menyenangkan.
- source_word: זַמְּרָה
  choice: bermazmur
  rationale: Bentuk dari זמר menunjuk pada pujian musikal. “Bermazmur” ringkas, bermartabat, dan mencakup tindakan menyanyikan pujian kepada Allah.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk konstruksi dengan sufiks orang pertama jamak diterjemahkan secara langsung dan alami.
- source_word: נָעִים
  choice: menyenangkan
  rationale: Kata ini menggambarkan puji-pujian sebagai sesuatu yang sedap, indah dirasakan, atau menyenangkan. Pilihan ini jelas bagi pembaca modern.
- source_word: נָאוָה
  choice: pantas
  rationale: Kata ini dapat menyatakan sesuatu yang layak, serasi, atau elok. “Pantas” mempertahankan penekanan pada kepatutan, sementara alternatif estetis dicatat dalam catatan kaki.
- source_word: תְהִלָּה
  choice: puji-pujian
  rationale: Nomina ini menyebut pujian sebagai tindakan atau isi ungkapan pujian. “Puji-pujian” terdengar alami dalam konteks ibadah dan menjaga bentuk nominal sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks memakai bentuk pendek nama ilahi יָהּ. Mempertahankan “Yah” menghindari pengaburan bentuk khusus ini serta menjaga kaitannya dengan “Haleluya,” tanpa menetapkan tafsiran denominatif.
- issue: Hubungan נָעִים, נָאוָה, dan תְהִלָּה
  choice: puji-pujian itu menyenangkan dan pantas
  alternative: sebab menyenangkan; puji-pujian itu indah
  rationale: Bahasa Ibrani ringkas dan eliptis. Pilihan ini memahami kedua adjektiva sebagai keterangan tentang puji-pujian, sesuai alur paralel ayat, tetapi tidak menghapus nuansa estetis נָאוָה karena alternatifnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda seru mempertahankan daya seruan imperatif pembuka. “Bermazmur” dipilih sebagai istilah puitis yang tetap mudah dipahami, sedangkan susunan klausa dibuat alami tanpa menghilangkan keringkasan dan paralelisme Ibrani.
