  text: שַׁבְּחִ֣י יְ֭רוּשָׁלִַם אֶת יְהוָ֑ה הַֽלְלִ֖י אֱלֹהַ֣יִ/ךְ צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/012.yaml
  text: Praise Yahweh[a], O Jerusalem; praise your God, O Zion.
translation:
  language: id
  text: Pujilah Yahweh, hai Yerusalem! Pujilah Allahmu, hai Sion!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְּחִי
  choice: Pujilah
  rationale: Imperatif feminin tunggal yang menyapa Yerusalem sebagai kota yang dipersonifikasikan. “Pujilah” alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan הַֽלְלִי.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Menggunakan bentuk baku nama tempat dalam bahasa Indonesia.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Penanda objek langsung diikuti nama ilahi YHWH; nama perjanjian dipertahankan sebagai “Yahweh” sesuai bukti teks Ibrani.
- source_word: הַֽלְלִי
  choice: Pujilah
  rationale: Imperatif feminin tunggal dari הלל. Pengulangan “Pujilah” mempertahankan daya perintah dan paralelisme sinonim dalam puisi.
- source_word: אֱלֹהַיִךְ
  choice: Allahmu
  rationale: Bentuk dengan sufiks orang kedua feminin tunggal, merujuk kepada Allah Israel. “Allahmu” ringkas, wajar, dan mempertahankan hubungan posesif teks sumber.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Menggunakan bentuk baku bahasa Indonesia; sejajar dengan Yerusalem dan tetap mempertahankan gambaran kota atau umat yang dipersonifikasikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi YHWH secara langsung. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih bentuk “Yehuwa” yang lebih jauh dari rekonstruksi pelafalan Ibrani yang lazim.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel vokatif “hai” memperjelas sapaan puitis kepada Yerusalem dan Sion, sedangkan tanda seru menyampaikan kekuatan kedua imperatif.
