  text: He gives snow like wool[a]; he scatters frost like ashes.
translation:
  language: id
  text: Ia memberikan salju seperti bulu domba; Ia menebarkan embun beku seperti abu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: Ia memberikan
  rationale: Partisipel Qal dari נתן menggambarkan tindakan Allah yang berlangsung atau berulang dalam rangkaian pujian. Bentuk kini deskriptif ini wajar dalam bahasa Indonesia.
- source_word: שֶׁלֶג
  choice: salju
  rationale: Padanan baku yang sesuai dengan konteks.
- source_word: כַּצָּמֶר
  choice: seperti bulu domba
  rationale: כ komparatif membentuk perumpamaan. צֶמֶר dapat berarti wol atau bulu domba; pilihan ini alami dan mempertahankan gambaran lapisan putih yang lembut.
- source_word: כְּפוֹר
  choice: embun beku
  rationale: Istilah ini menunjuk pada bunga es atau lapisan kristal es di permukaan. 'Embun beku' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: כָּאֵפֶר
  choice: seperti abu
  rationale: כ komparatif membentuk perumpamaan; 'abu' adalah bentuk massal yang alami dalam bahasa Indonesia.
- source_word: יְפַזֵּר
  choice: Ia menebarkan
  rationale: Bentuk Piel dari פזר menyatakan tindakan menyebarkan atau menyerakkan. 'Menebarkan' mempertahankan gambaran puitis tentang Allah menyebarkan embun beku secara luas.
