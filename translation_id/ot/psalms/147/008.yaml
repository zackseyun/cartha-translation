  text: הַֽ/מְכַסֶּ֬ה שָׁמַ֨יִם בְּ/עָבִ֗ים הַ/מֵּכִ֣ין לָ/אָ֣רֶץ מָטָ֑ר הַ/מַּצְמִ֖יחַ הָרִ֣ים חָצִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/008.yaml
  text: who covers the heavens with clouds[a], who prepares rain for the earth, who makes grass sprout on the mountains.
translation:
  language: id
  text: yang menutupi langit dengan awan, yang menyiapkan hujan bagi bumi, yang menumbuhkan rumput di gunung-gunung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְכַסֶּה
  choice: menutupi
  rationale: Partisipel dari כסה menyatakan tindakan menutup atau menyelubungi; “menutupi” paling langsung dan alami dalam konteks langit dan awan.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, bentuk tunggal “langit” secara alami mencakup bentangan angkasa dan tetap sesuai dengan konteks puitis.
- source_word: עָבִים
  choice: awan
  rationale: Kata ini menunjuk pada awan, kadang-kadang awan tebal; konteks tidak mengharuskan penambahan “tebal”.
- source_word: מֵּכִין
  choice: menyediakan
  rationale: Bentuk Hifil dari כון berarti menyiapkan atau menyediakan. Bersama “hujan bagi bumi”, “menyediakan” menyampaikan tindakan pemeliharaan ilahi secara alami tanpa mengubah maknanya.
- source_word: לָאָרֶץ
  choice: bagi bumi
  rationale: Dalam konteks langit, awan, dan hujan, אֶרֶץ paling wajar dipahami dalam cakupan luas sebagai “bumi”, bukan suatu negeri tertentu.
- source_word: מָטָר
  choice: hujan
  rationale: Padanan Indonesia yang langsung, lazim, dan puitis untuk מָטָר.
- source_word: מַּצְמִיחַ
  choice: menumbuhkan
  rationale: Bentuk kausatif dari צמח menyatakan menyebabkan sesuatu bertunas atau tumbuh; “menumbuhkan” mempertahankan daya kausatif itu secara alami.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak ini secara langsung berarti “gunung-gunung”; pilihan tersebut mempertahankan gambaran konkret teks.
- source_word: חָצִיר
  choice: rumput
  rationale: Dalam konteks pertumbuhan di gunung, “rumput” merupakan padanan modern yang paling jelas untuk חָצִיר.
theological_decisions:
- issue: Peran Allah dinyatakan melalui rangkaian partisipel
  choice: Mempertahankan rangkaian klausa relatif “yang menutupi … yang menyediakan … yang menumbuhkan …”
  alternative: 'Mengubahnya menjadi kalimat mandiri: “Dia menutupi … menyediakan … dan menumbuhkan …”'
  rationale: Teks Ibrani memakai rangkaian partisipel yang terhubung dengan konteks sebelumnya dan menggambarkan tindakan Allah yang khas atau berkelanjutan. Pengulangan “yang” mempertahankan hubungan serta irama tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan struktur paralel yang mudah dipahami. Tidak digunakan catatan kaki karena tidak ada ambiguitas leksikal penting yang perlu ditampilkan dalam ayat ini; catatan kaki pada lapisan konsultasi Inggris tampaknya tidak selaras antara penanda dan isinya.
