  text: He sends out his word and melts them; he makes his wind blow[a], and the waters flow.
translation:
  language: id
  text: Ia mengutus firman-Nya dan mencairkan semuanya; Ia membuat angin-Nya bertiup[a], lalu air pun mengalir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “roh-Nya” atau “napas-Nya.” Kata Ibrani yang sama dapat mengandung ketiga arti ini, tetapi “angin” paling sesuai dengan gambaran cuaca dalam konteks ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: menyampaikan
  rationale: Bentuk Qal imperfek menggambarkan tindakan ilahi dalam puisi. 'Menyampaikan' mengungkapkan bahwa Allah mengirimkan firman-Nya secara alami dalam bahasa Indonesia.
- source_word: דְּבָרוֹ
  choice: firman-Nya
  rationale: דבר dapat berarti perkataan, hal, atau perintah. 'Firman-Nya' mempertahankan gambaran puitis tentang perkataan Allah yang berdaya tanpa mempersempitnya menjadi 'perintah'.
- source_word: וַיְמְסֵם
  choice: dan mencairkan semuanya
  rationale: Bentuk Hifil dengan sufiks jamak berarti 'membuat mereka/semuanya mencair'. 'Semuanya' merujuk secara alami kepada unsur-unsur beku dalam ayat sebelumnya tanpa menambahkan objek khusus seperti es.
- source_word: יַשֵּׁב
  choice: membuat ... bertiup
  rationale: 'Bentuk Hifil dari נשׁב menyatakan sebab: membuat sesuatu bertiup. Susunan ini mempertahankan daya kausatif dengan bahasa Indonesia yang wajar.'
- source_word: רוּחוֹ
  choice: angin-Nya
  rationale: רוּחַ dapat berarti angin, napas, atau roh. Dalam konteks cuaca—pencairan dan air yang mengalir—'angin' merupakan makna kontekstual yang paling langsung.
- source_word: יִזְּלוּ
  choice: mengalir
  rationale: Kata kerja ini menunjuk pada cairan yang mengalir. 'Mengalir' merupakan padanan Indonesia yang luas dan alami.
- source_word: מָיִם
  choice: air
  rationale: מַיִם berbentuk gramatikal jamak dalam bahasa Ibrani, tetapi nomina massa 'air' merupakan ungkapan baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna רוּחוֹ dalam kaitannya dengan tindakan Allah
  choice: angin-Nya
  alternative: roh-Nya atau napas-Nya
  rationale: 'Konteks langsung menggambarkan kuasa Allah atas cuaca: firman-Nya mencairkan yang beku, angin bertiup, dan air mengalir. Namun, keluasan makna kata Ibrani dipertahankan dalam catatan kaki agar kemungkinan leksikalnya tidak dihapus.'
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti gaya Alkitab Indonesia yang lazim. Kata 'lalu' memperjelas urutan puitis tanpa menambah hubungan teologis yang tidak dinyatakan.
