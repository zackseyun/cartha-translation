id: PSA.147.6
reference: Psalms 147:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/006.yaml
  text: Yahweh lifts up the humble[b][a]; he brings the wicked down to the ground.
translation:
  language: id
  text: Yahweh menopang orang-orang rendah hati[a], tetapi merendahkan orang-orang fasik sampai ke tanah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang tertindas” atau “orang-orang lemah lembut.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sampai ke bumi,” yakni sampai ke tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹדֵד
  choice: menopang
  rationale: Bentuk partisipel dari עודד menyatakan tindakan menguatkan, menyokong, atau memulihkan. “Menopang” mempertahankan makna dukungan tanpa membatasi ungkapan itu pada pengangkatan secara harfiah; pertentangan vertikal dengan “merendahkan ... sampai ke tanah” tetap terasa.
- source_word: עֲנָוִים
  choice: orang-orang rendah hati
  rationale: ענוים dapat menunjuk kepada mereka yang rendah hati atau lemah dan tertindas. “Orang-orang rendah hati” mempertahankan nuansa moral-sosial serta kontras dengan “orang-orang fasik,” sementara kemungkinan cakupan ‘tertindas’ dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani dipertahankan.
- source_word: מַשְׁפִּיל
  choice: merendahkan
  rationale: Bentuk Hifil partisipel dari שׁפל berarti membuat rendah atau menjatuhkan. “Merendahkan” menyampaikan tindakan kausatif dengan ringkas dan membentuk kontras dengan tindakan menopang.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: “Orang-orang fasik” adalah padanan lazim bagi רשעים dalam Mazmur dan mempertahankan kategori etisnya.
- source_word: עֲדֵי אָרֶץ
  choice: sampai ke tanah
  rationale: Ungkapan ini secara harfiah menyatakan gerak ‘sampai ke bumi/tanah’ dan mengintensifkan tindakan merendahkan. “Sampai ke tanah” alami dalam bahasa Indonesia serta mempertahankan citra spasial teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Cakupan makna עֲנָוִים
  choice: orang-orang rendah hati
  alternative: orang-orang tertindas; orang-orang lemah lembut
  rationale: Istilah Ibrani mengandung tumpang tindih antara kerendahan hati dan keadaan sosial yang rendah atau tertindas. Teks utama memakai ungkapan Indonesia yang alami tanpa meniadakan alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dua klausa mempertahankan kontras puitis antara tindakan Yahweh terhadap orang rendah hati dan terhadap orang fasik; “tetapi” memperjelas pertentangan yang tersirat dalam paralelisme Ibrani.
