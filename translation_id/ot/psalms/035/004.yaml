  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: id
  text: Biarlah orang-orang yang mengincar nyawaku dipermalukan dan mendapat aib; biarlah orang-orang yang merancang celaka bagiku mundur dan menjadi malu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: dipermalukan
  rationale: Bentuk Qal dalam konteks permohonan kutukan menyatakan mengalami malu atau dipermalukan; bentuk pasif alami dalam bahasa Indonesia mempertahankan hasil yang dimohonkan.
- source_word: וְיִכָּלְמוּ
  choice: dan mendapat aib
  rationale: Nifal dari כלם memperkuat medan makna malu dan kehinaan. Ungkapan ini membedakannya dari verba pertama tanpa menghilangkan paralelismenya.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: orang-orang yang mengincar nyawaku
  rationale: Dalam konteks bermusuhan, נפשׁ dengan בקשׁ merupakan idiom untuk berusaha merenggut hidup seseorang. 'Mengincar nyawaku' menyampaikan ancaman mematikan secara alami.
- source_word: יִסֹּגוּ אָחוֹר
  choice: mundur
  rationale: Gabungan סוג dan אָחוֹר menyatakan penarikan diri atau berbalik mundur; 'mundur' ringkas dan wajar dalam bahasa Indonesia.
- source_word: וְיַחְפְּרוּ
  choice: dan tersipu malu
  rationale: חפר di sini mengacu pada rasa malu atau kehinaan, bukan tindakan menggali. 'Tersipu malu' mempertahankan nuansa mengalami malu sekaligus membedakannya dari ungkapan sebelumnya.
- source_word: חֹשְׁבֵי רָעָתִי
  choice: orang-orang yang merancang celaka bagiku
  rationale: חשב menyatakan merencanakan atau merancang, sedangkan רָעָתִי dalam konteks ini ialah celaka yang ditujukan kepada pemazmur. Ungkapan ini tetap membiarkan 'celaka' mencakup kejahatan maupun akibat buruk.
theological_decisions:
- issue: Daya jusif atau kutukan dalam bentuk imperfek
  choice: Diterjemahkan dengan 'Biarlah ...' sebagai permohonan atau harapan pemazmur akan penghakiman.
  alternative: 'Pernyataan masa depan: ''Orang-orang ... akan dipermalukan.'''
  rationale: Dalam konteks doa ini, rangkaian imperfek paling alami berfungsi sebagai jusif atau permohonan kutukan. 'Biarlah' mempertahankan sifat doa tanpa mengubahnya menjadi ramalan semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme dua bagian dipertahankan; pilihan 'mengincar nyawaku' dan 'merancang celaka bagiku' alami bagi pembaca umum tanpa mengaburkan maksud teks Ibrani.
