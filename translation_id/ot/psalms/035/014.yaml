  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: id
  text: Aku bersikap seolah-olah dia sahabatku, seolah-olah dia saudaraku.[a] Aku tertunduk muram[b] seperti orang yang berkabung karena ibunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Seperti sahabat, seperti saudara bagiku, aku menjalani hidup.” Ungkapan Ibrani menekankan kedekatan pribadi dan cara pemazmur membawa diri terhadap orang itu.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “muram” secara harfiah berkaitan dengan keadaan yang menjadi gelap atau suram, yaitu penampilan yang lesu karena berkabung.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/רֵעַ כְּ/אָח לִ/י
  choice: seolah-olah dia sahabat atau saudaraku
  rationale: 'Dua frasa perbandingan itu menggambarkan kedekatan pribadi: sahabat dan saudara. Bahasa Indonesia memerlukan subjek tersirat “dia” agar hubungan dengan orang yang sedang dibicarakan jelas dan alami.'
- source_word: הִתְהַלָּכְתִּי
  choice: Aku bersikap
  rationale: Bentuk Hitpael dari הלך di sini mengacu pada cara pemazmur membawa diri atau menjalani keadaan, bukan semata-mata gerak berjalan. “Bersikap” menyampaikan fungsi idiomatisnya dalam konteks.
- source_word: כַּ/אֲבֶל אֵם
  choice: seperti orang yang berkabung karena ibunya
  rationale: Frasa ini merupakan perbandingan dengan seorang yang berduka atas kematian ibunya; “karena ibunya” merupakan ungkapan Indonesia yang alami tanpa menentukan jenis kelamin pelayat.
- source_word: קֹדֵר
  choice: muram
  rationale: Kata ini secara harfiah berkaitan dengan keadaan gelap atau suram dan dalam konteks perkabungan menunjukkan penampilan yang murung dan diliputi dukacita.
- source_word: שַׁחֽוֹתִי
  choice: Aku tertunduk
  rationale: Kata kerja ini menggambarkan tubuh yang membungkuk atau merunduk. “Tertunduk” mempertahankan gambaran jasmani sekaligus menyiratkan beratnya dukacita.
