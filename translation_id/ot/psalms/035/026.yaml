  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: id
  text: Biarlah mereka yang bersukacita atas kemalanganku menjadi malu dan dipermalukan bersama-sama; biarlah mereka yang membesarkan diri terhadap aku[a] diselubungi malu dan kehinaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka yang meninggikan diri terhadap aku” atau “mereka yang menyombongkan diri terhadap aku.” Secara harfiah, bahasa Ibrani berbicara tentang membesarkan diri atas seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ
  choice: dipermalukan dan mendapat aib
  rationale: Kedua verba menyatakan dipermalukan atau mengalami aib dalam konteks doa kutukan. Pasangan ini mempertahankan penguatan sinonimis dengan bahasa Indonesia yang wajar.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Adverbia ini menunjukkan bahwa seluruh kelompok mengalami nasib yang sama.
- source_word: שְׂמֵחֵי רָעָתִי
  choice: mereka yang bersukacita atas kemalanganku
  rationale: רָעָה di sini menunjuk pada malapetaka atau penderitaan yang menimpa pemazmur, bukan kejahatan moral yang dilakukannya.
- source_word: יִלְבְּשׁוּ
  choice: diselubungi
  rationale: Pilihan ini mempertahankan metafora Ibrani tentang mengenakan malu dan kehinaan seperti pakaian, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בֹשֶׁת וּכְלִמָּה
  choice: rasa malu dan kehinaan
  rationale: Dua nomina yang berdekatan maknanya dipertahankan untuk menyampaikan intensifikasi puitis.
- source_word: הַמַּגְדִּילִים עָלָי
  choice: mereka yang membesarkan diri terhadap aku
  rationale: Ungkapan ini mengikuti gambaran harfiah tindakan menjadikan diri besar atas atau terhadap seseorang dan mempertahankan cakupan makna kesombongan tanpa membatasinya hanya pada ucapan.
