source:
  edition: WLC
  text: הַחֲזֵ֣ק מָגֵ֣ן וְ/צִנָּ֑ה וְ֝/ק֗וּמָ/ה בְּ/עֶזְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/002.yaml
  text: Take hold of shield and buckler[a], and rise up for my help.
translation:
  language: id
  text: Peganglah perisai dan perisai besar[a]; bangkitlah untuk menolong aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai dua istilah berbeda untuk perisai; istilah kedua kemungkinan menunjuk pada perisai besar yang melindungi tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: Peganglah
  rationale: Bentuk perintah ini meminta Allah mengambil atau menggenggam perlengkapan perang untuk bertindak. “Peganglah” mempertahankan tindakan konkret dalam gambaran militer dan terdengar wajar dalam bahasa Indonesia.
- source_word: מָגֵן
  choice: perisai
  rationale: מָגֵן adalah istilah umum untuk perisai; padanan langsung “perisai” mempertahankan gambaran pertahanan.
- source_word: צִנָּה
  choice: perisai besar
  rationale: צִנָּה menunjuk pada perisai yang lebih besar dan berbeda dari מָגֵן. “Perisai besar” menyampaikan perbedaan itu secara jelas tanpa memakai istilah Indonesia yang kuno atau kurang dikenal.
- source_word: וְקוּמָה
  choice: bangkitlah
  rationale: Perintah dari קום, dengan bentuk yang memberi nuansa seruan mendesak, meminta Allah bangkit untuk campur tangan. “Bangkitlah” alami dalam bahasa doa dan mempertahankan daya ungkap sumber.
- source_word: בְּעֶזְרָתִי
  choice: untuk menolong aku
  rationale: Frasa ini menyatakan tindakan demi pertolongan bagi pemazmur. Ungkapan verbal “untuk menolong aku” lebih alami dalam bahasa Indonesia daripada mempertahankan nomina secara kaku.
theological_decisions:
- issue: Penggambaran Allah dengan citra peperangan
  choice: Mempertahankan gambaran harfiah tentang Allah yang memegang perlengkapan pertahanan dan bangkit menolong pemazmur.
  alternative: Menghaluskannya menjadi permohonan umum agar Allah melindungi.
  rationale: Teks Ibrani secara eksplisit memakai gambaran militer tentang Allah sebagai pembela. Gambaran ini dipertahankan dan tidak diubah menjadi perlindungan yang abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Imperatif “Peganglah” dan “bangkitlah” mempertahankan desakan doa serta citra militer yang konkret; “perisai besar” membedakan kedua istilah Ibrani dengan jelas bagi pembaca umum.
