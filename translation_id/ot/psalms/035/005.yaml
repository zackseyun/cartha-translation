  text: יִֽהְי֗וּ כְּ/מֹ֥ץ לִ/פְנֵי ר֑וּחַ וּ/מַלְאַ֖ךְ יְהוָ֣ה דּוֹחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: id
  text: Biarlah mereka seperti sekam di hadapan angin, dan malaikat Yahweh menghalau mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sementara malaikat Yahweh menghalau mereka.” Kata penghubung Ibrani dapat dipahami sebagai “dan” atau sebagai penghubung keadaan; kata kerjanya juga dapat diterjemahkan “mendorong mereka pergi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Biarlah mereka
  rationale: Bentuk yiqtol dalam konteks kutukan atau permohonan ini paling wajar dipahami secara yusif; “Biarlah mereka” menyampaikan harapan pemazmur, bukan sekadar pernyataan masa depan.
- source_word: כְּמֹץ
  choice: seperti sekam
  rationale: מֹץ menunjuk pada sekam ringan yang diterbangkan ketika menampi; padanan ini mempertahankan perumpamaan Ibrani secara alami.
- source_word: לִפְנֵי רוּחַ
  choice: di hadapan angin
  rationale: Terjemahan ini dekat dengan bentuk harfiah frasa Ibrani dan mempertahankan gambaran sekam yang tidak berdaya menghadapi angin.
- source_word: וּמַלְאַךְ יְהוָה
  choice: dan malaikat Yahweh
  rationale: Waw diterjemahkan secara langsung sebagai “dan”, tanpa menentukan hubungan antarklausa lebih jauh daripada teks. מַלְאָךְ dalam ungkapan ini paling wajar dipahami sebagai makhluk surgawi, sedangkan nama ilahi dipertahankan sebagai “Yahweh”.
- source_word: דּוֹחֶה
  choice: menghalau mereka
  rationale: Partisipel דּוֹחֶה menyatakan tindakan mendorong atau mengusir dengan kuat. “Menghalau” alami dalam bahasa Indonesia dan sesuai dengan gambaran mereka yang diusir seperti sekam; objek “mereka” tersirat dari konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, sehingga “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: מַלְאָךְ dapat berarti “utusan” atau “malaikat”, tetapi dalam ungkapan ini dan konteks tindakan ilahi, makna makhluk surgawi paling mungkin. Terjemahan tidak menambahkan klaim mengenai identitas lebih lanjut.
- issue: Hubungan sintaksis waw sebelum מַלְאַךְ
  choice: dan malaikat Yahweh menghalau mereka
  alternative: dengan malaikat Yahweh menghalau mereka
  rationale: Waw dapat sekadar mengoordinasikan klausa atau dipahami secara penyerta. Teks utama memakai padanan paling langsung, sementara alternatif idiomatis dicatat agar ambiguitas sintaksis tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Susunan “di hadapan angin” sengaja mempertahankan citra puitis Ibrani, sedangkan “menghalau” menyampaikan daya paksa partisipel tanpa mempersempitnya menjadi pengejaran.
