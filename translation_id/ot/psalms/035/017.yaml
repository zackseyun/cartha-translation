  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: id
  text: Tuhan, berapa lama lagi Engkau memandang? Selamatkanlah hidupku dari kebinasaan mereka, dan nyawaku yang satu-satunya dari singa-singa muda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang satu-satunya milikku”; dalam konteks ini ungkapan tersebut menunjuk pada nyawa pemazmur yang satu-satunya dan sangat berharga.
    reason: Menjelaskan idiom Ibrani יְחִידָתִי dan kaitannya dengan “nyawaku,” tanpa menghilangkan ungkapan puitis dalam teks utama.
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Sapaan ilahi ini adalah ’Adonai, bukan nama perjanjian YHWH; “Tuhan” merupakan padanan Indonesia yang alami dan tepat.
- source_word: כַּמָּה תִּרְאֶה
  choice: berapa lama lagi Engkau hanya memandang?
  rationale: Secara idiomatis ini menanyakan sampai kapan Tuhan akan terus menyaksikan tanpa bertindak. Kata “hanya” membuat implikasi tersebut jelas tanpa mengubah pertanyaan menjadi pernyataan.
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: Selamatkanlah hidupku
  rationale: Dalam konteks ancaman maut, nefesh menunjuk pada hidup atau nyawa pemazmur. Bentuk kausatif dari שוב secara harfiah berarti membawa kembali atau memulihkan, tetapi di sini berfungsi sebagai permohonan penyelamatan.
- source_word: מִשֹּׁאֵיהֶם
  choice: dari kehancuran yang mereka timbulkan
  rationale: Bentuk ini menunjuk pada kehancuran atau kebinasaan yang berasal dari para lawan. Rumusan verbal Indonesia memperjelas relasi pronomina “mereka” tanpa menentukan cara serangannya secara berlebihan.
- source_word: מִכְּפִירִים
  choice: dari singa-singa muda
  rationale: Mempertahankan gambaran konkret para musuh sebagai singa muda yang kuat dan berbahaya.
- source_word: יְחִידָתִי
  choice: nyawaku satu-satunya
  rationale: Kata ini secara harfiah berarti sesuatu yang tunggal atau satu-satunya, dan dalam paralel dengan nefesh menunjuk pada hidup pemazmur yang unik dan berharga.
theological_decisions:
- issue: Apakah permohonan ini meminta pemulihan batin atau penyelamatan dari maut
  choice: Diterjemahkan sebagai permohonan agar hidup pemazmur diselamatkan.
  alternative: “Pulihkanlah jiwaku” dapat dibaca sebagai pemulihan rohani atau emosional.
  rationale: Paralel dengan “singa-singa muda” dan ungkapan “milikku satu-satunya” menunjukkan ancaman terhadap hidup, bukan terutama keadaan batin.
- issue: Identitas singa-singa muda
  choice: Metafora dipertahankan tanpa menjelaskan secara eksplisit bahwa mereka adalah musuh manusia.
  alternative: “musuh-musuhku yang seperti singa muda.”
  rationale: Teks sumber mempertahankan metafora langsung; terjemahan tidak boleh meniadakan daya puitis atau menambahkan identifikasi yang tidak dinyatakan pada baris ini.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis. Pengulangan “hidupku/nyawaku” mencerminkan kesejajaran Ibrani; metafora “singa-singa muda” dipertahankan. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
