  text: Violent witnesses rise up[a]; they ask me about things I do not know.
translation:
  language: id
  text: Saksi-saksi kejam[a] bangkit; mereka menanyai aku tentang hal-hal yang tidak kuketahui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saksi-saksi palsu” atau “saksi-saksi jahat”; secara harfiah dalam bahasa Ibrani, “saksi-saksi kekerasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  choice: bangkit melawan aku
  rationale: Bentuk dari קום menggambarkan para saksi yang tampil atau mengambil posisi menentang pemazmur. Tambahan “melawan aku” menyatakan arah permusuhan yang tersirat dalam konteks dan menghasilkan ungkapan Indonesia yang alami.
- source_word: עֵדֵי חָמָס
  choice: saksi-saksi kejam
  rationale: Secara harfiah berarti “saksi-saksi kekerasan.” חָמָס dapat menunjuk pada kekerasan, kelaliman, atau ketidakadilan yang mencelakakan. “Saksi-saksi kejam” menjaga sifat mereka yang merusak tanpa mempersempit makna menjadi hanya kesaksian palsu; alternatif harfiah dan interpretatif dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: hal-hal yang tidak kuketahui
  rationale: Klausa relatif Ibrani tidak menyebut objek secara eksplisit. “Hal-hal” ditambahkan secara minimal agar alami dalam bahasa Indonesia, sementara bentuk “tidak kuketahui” mempertahankan pengakuan pemazmur bahwa perkara yang ditanyakan itu tidak ia ketahui.
- source_word: יִשְׁאָלוּנִי
  choice: mereka menanyai aku tentang
  rationale: שׁאל berarti bertanya, meminta, atau menyelidiki. “Menanyai” sesuai dengan konteks permusuhan atau hukum tanpa memperkuatnya secara berlebihan menjadi “menginterogasi” atau menggesernya menjadi “menuntut.”
