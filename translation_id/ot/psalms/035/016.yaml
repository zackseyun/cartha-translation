  text: בְּ֭/חַנְפֵי לַעֲגֵ֣י מָע֑וֹג חָרֹ֖ק עָלַ֣/י שִׁנֵּֽי/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/016.yaml
  text: Among the godless mockers at a feast[a], they gnash their teeth at me.
translation:
  language: id
  text: Di antara para pengejek fasik di perjamuan[a], mereka menggertakkan gigi terhadapku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara para pengejek cemar demi kue/suapan”; istilah Ibrani yang diterjemahkan “di perjamuan” langka dan tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: Di antara ... fasik
  rationale: Kata benda dari חנף menunjuk kepada orang-orang yang cemar secara moral dan religius; “fasik” mempertahankan bobot ini tanpa mempersempit maknanya menjadi kemunafikan. Prefiks ב dipahami secara lokatif/asosiatif sebagai “di antara”.
- source_word: לַעֲגֵי
  choice: para pengejek
  rationale: Bentuk dari לעג menunjuk kepada orang-orang yang mengejek atau mencemooh. “Para pengejek” alami dalam bahasa Indonesia modern dan mempertahankan tindakan penghinaan yang bermusuhan.
- source_word: מָעוֹג
  choice: di perjamuan
  rationale: Istilah langka ini tidak pasti. Kemungkinan kaitannya dengan jamuan atau ejekan di meja makan mendukung “di perjamuan”, sementara kemungkinan arti “kue” atau “suapan” dicatat dalam catatan kaki.
- source_word: חָרֹק
  choice: mereka menggertakkan
  rationale: Kata kerja חרק menggambarkan tindakan menggertakkan atau menggerus gigi sebagai ungkapan permusuhan. Subjek jamak dibuat eksplisit agar kalimat Indonesia jelas dan alami.
- source_word: עָלַי
  choice: terhadapku
  rationale: Dengan tindakan bermusuhan berupa menggertakkan gigi, “terhadapku” menyampaikan arah permusuhan secara alami.
- source_word: שִׁנֵּימוֹ
  choice: gigi
  rationale: Bentuk ini berarti “gigi mereka”. Dalam konstruksi Indonesia “mereka menggertakkan gigi”, kepemilikan sudah jelas dari subjek sehingga akhiran “mereka” tidak perlu diulang.
