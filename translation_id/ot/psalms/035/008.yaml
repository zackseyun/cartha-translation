  text: תְּבוֹאֵ֣/הוּ שׁוֹאָה֮ לֹֽא יֵ֫דָ֥ע וְ/רִשְׁתּ֣/וֹ אֲשֶׁר טָמַ֣ן תִּלְכְּד֑/וֹ בְּ֝/שׁוֹאָ֗ה יִפָּל בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: id
  text: Biarlah kehancuran menimpanya tanpa disadarinya,[a] dan biarlah jaring yang disembunyikannya menangkapnya; biarlah ia jatuh ke dalam kehancuran itu sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “secara tak terduga.” Secara harfiah: “Biarlah kehancuran menimpanya; ia tidak tahu.”'
    reason: lexical_alternative
  - marker: b
    text: Akhiran “di dalamnya” dalam bahasa Ibrani dapat merujuk kembali kepada “kehancuran” sebagai penegasan, seperti dalam teks utama. Namun, akhiran itu juga mungkin merujuk kepada jaring yang disembunyikannya, dengan arti bahwa ia terjerat oleh perangkapnya sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ
  choice: Biarlah ... menimpanya
  rationale: Bentuk ini menerjemahkan verba בוא dengan subjek שׁוֹאָה dan akhiran objek orang ketiga tunggal maskulin. Dalam konteks permohonan penghukuman, “biarlah” mempertahankan daya yusif, sedangkan “menimpa” merupakan ungkapan Indonesia yang wajar untuk datangnya malapetaka.
- source_word: שׁוֹאָה
  choice: kehancuran
  rationale: Nomina ini menunjuk pada kehancuran, keruntuhan, atau malapetaka yang membinasakan. “Kehancuran” sesuai pada kedua kemunculannya dan menjaga pengulangan sumber.
- source_word: לֹא יֵדָע
  choice: tanpa diketahuinya
  rationale: Secara harfiah, “ia tidak tahu.” Pilihan ini mempertahankan unsur mengetahui dan menyampaikan bahwa kehancuran datang tanpa sepengetahuannya, sambil tetap cukup alami dalam bahasa Indonesia.
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: dan ... jaring yang disembunyikannya
  rationale: רֶשֶׁת berarti “jaring,” sedangkan טמן berarti menyembunyikan atau menaruh secara tersembunyi. Klausa relatif Indonesia mengaitkan jaring itu dengan orang yang menyembunyikannya tanpa ungkapan posesif yang kaku.
- source_word: תִּלְכְּדוֹ
  choice: menangkap dia
  rationale: לכד berarti menangkap atau menawan. Bersama “jaring,” verba “menangkap” merupakan padanan yang paling langsung dan alami.
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: biarlah ia jatuh ke dalam kehancuran itu juga
  rationale: 'Frasa berpreposisi yang didahulukan lalu diulang dengan pronomina feminin dapat dipahami sebagai konstruksi penegasan: ia jatuh ke dalam kehancuran itu sendiri. “Itu juga” menyampaikan penegasan tersebut tanpa mengulang “di dalamnya” secara janggal.'
theological_decisions:
- issue: Daya ujar permohonan penghukuman
  choice: Memakai “Biarlah” pada kedua verba utama
  alternative: Memakai bentuk prediktif seperti “akan”
  rationale: Bentuk verba dan konteks mazmur mendukung permohonan atau harapan yusif, bukan sekadar ramalan. Pilihan ini mempertahankan ketegangan teks tanpa menambahkan penjelasan teologis.
- issue: Rujukan akhiran feminin בָּהּ pada akhir ayat
  choice: Dalam teks utama, merujukkannya kembali kepada “kehancuran” sebagai penegasan
  alternative: Memahaminya sebagai rujukan kepada “jaring,” sehingga orang itu jatuh karena atau di dalam perangkapnya sendiri
  rationale: Konstruksi dapat dibaca sebagai frasa depan yang didahulukan dan kemudian diteruskan kembali oleh pronomina. Namun, karena “jaring” dan “kehancuran” sama-sama feminin dalam bahasa Ibrani, alternatifnya tetap dicatat dan tidak disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan kesejajaran serta nada permohonan penghukuman dalam mazmur. Pengulangan “kehancuran” dipertahankan karena penting bagi struktur ayat, sedangkan ambiguitas rujukan pronomina terakhir dijelaskan dalam catatan kaki.
