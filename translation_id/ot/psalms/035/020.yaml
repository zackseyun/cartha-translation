  yaml_path: translation/ot/psalms/035/020.yaml
  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: id
  text: Sebab mereka tidak berbicara tentang perdamaian, melainkan merancang kata-kata penuh tipu daya terhadap orang-orang yang hidup tenang di negeri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang suka damai di negeri” atau “orang-orang yang hidup tenteram di negeri.” Frasa Ibraninya kemungkinan menunjuk kepada orang-orang yang hidup dengan tenang dan damai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi permohonan atau keluhan sebelumnya dan mempertahankan alur argumentatif mazmur.
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: mereka tidak membicarakan perdamaian
  rationale: Mempertahankan שָׁלוֹם sebagai isi pembicaraan, bukan langsung mengubahnya menjadi keterangan cara seperti ‘berbicara dengan damai’. Ungkapan ini tetap wajar dalam bahasa Indonesia dan membuka kemungkinan makna perdamaian atau kerukunan.
- source_word: שָׁלוֹם
  choice: perdamaian
  rationale: Dalam konteks pertentangan dan persekongkolan, ‘perdamaian’ menyampaikan gagasan damai atau kerukunan dengan lebih jelas daripada ‘kesejahteraan’.
- source_word: וְעַל
  choice: tetapi ... untuk melawan
  rationale: ‘Tetapi’ menyatakan pertentangan antara tidak membicarakan perdamaian dan justru merancang tipu daya; ‘untuk melawan’ mengungkapkan arah permusuhan preposisi עַל secara alami.
- source_word: רִגְעֵי אֶרֶץ
  choice: orang-orang yang hidup tenteram di negeri
  rationale: Frasa Ibrani yang sulit ini kemungkinan menunjuk kepada orang-orang yang hidup tenang dan damai. Pilihan ini alami bagi pembaca modern tanpa menyamakan frasa tersebut sepenuhnya dengan שָׁלוֹם sebelumnya.
- source_word: דִּבְרֵי מִרְמוֹת
  choice: kata-kata penuh tipu daya
  rationale: Menyampaikan konstruksi ‘perkataan tipu daya’ dalam bahasa Indonesia yang alami serta mempertahankan fokus pada ucapan yang menipu.
- source_word: יַחֲשֹׁבוּן
  choice: merancang
  rationale: Dalam konteks ini חשׁב menunjuk pada tindakan menyusun atau merencanakan dengan sengaja, bukan sekadar berpikir.
