  yaml_path: translation/ot/psalms/035/018.yaml
  text: I will give thanks to you in the great assembly[b][a]; among a mighty people I will praise you.
translation:
  language: id
  text: Aku akan bersyukur kepada-Mu dalam jemaah yang besar[a]; di tengah orang banyak yang besar jumlahnya[b] aku akan memuji-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam perhimpunan besar.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “besar jumlahnya” juga dapat berarti “kuat” atau “perkasa.”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: א֭וֹדְךָ
  choice: Aku akan bersyukur kepada-Mu
  rationale: Bentuk hifil dari ידה dalam konteks ibadah lazim berarti mengucap syukur atau memuji. Pilihan “bersyukur” membedakannya dari הלל pada bagian kedua ayat.
- source_word: בְּקָהָל רָב
  choice: dalam jemaah yang besar
  rationale: קָהָל menunjuk pada perkumpulan atau jemaah yang berhimpun, sedangkan רָב di sini menerangkan besarnya perkumpulan itu. “Jemaah” sesuai dengan konteks pujian di depan umum dan wajar dalam bahasa Indonesia.
- source_word: בְּעַם עָצוּם
  choice: di tengah orang banyak yang besar jumlahnya
  rationale: עַם dapat menunjuk pada suatu kelompok manusia, sedangkan עָצוּם dapat menyatakan jumlah yang sangat besar ataupun kekuatan. Paralelisme dengan “jemaah yang besar” mendukung nuansa jumlah, tetapi kemungkinan nuansa kuat atau perkasa tetap dicatat dalam catatan kaki.
- source_word: אֲהַלְלֶךָּ
  choice: aku akan memuji-Mu
  rationale: Bentuk piel dari הלל secara langsung berarti memuji atau menyanjung. “Memuji” merupakan padanan Indonesia yang alami dan mempertahankan perbedaannya dari “bersyukur” pada bagian pertama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk “kepada-Mu” dan “memuji-Mu” mengikuti kebiasaan penulisan sapaan kepada Allah. Paralelisme kedua bagian dipertahankan tanpa menyamakan verba “bersyukur” dan “memuji”.
