  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: id
  text: Tetapi aku, ketika mereka sakit, pakaianku berupa kain kabung[a]; aku merendahkan diriku dengan berpuasa[b], dan doaku kembali ke dadaku sendiri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kain kabung ialah kain kasar yang dikenakan untuk mengungkapkan perkabungan, kesusahan, atau pertobatan.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “aku merendahkan jiwaku dengan puasa,” sebuah ungkapan Ibrani tentang merendahkan diri melalui puasa.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani ini juga dapat dipahami sebagai “doaku kembali tanpa jawaban,” “doaku kembali membawa manfaat kepadaku,” atau “aku berdoa seakan-akan untuk diriku sendiri.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: ketika mereka sakit
  rationale: Bentuk dari חלה dengan akhiran orang ketiga jamak menyatakan keadaan mereka yang sakit; frasa ini mempertahankan fungsi temporal ב secara alami.
- source_word: לְבוּשִׁי שָׂק
  choice: mengenakan kain kabung
  rationale: Secara harfiah, 'pakaianku [adalah] kain kabung'. Ungkapan verbal ini lebih alami dalam bahasa Indonesia dan tetap menyampaikan tindakan berkabung.
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: aku merendahkan diriku dengan berpuasa
  rationale: Secara harfiah, 'aku menindas/merendahkan jiwaku dengan puasa'. Terjemahan ini menyampaikan idiom Ibrani tentang merendahkan atau menyangkal diri melalui puasa tanpa memberi kesan menyiksa jiwa secara harfiah.
- source_word: וּתְפִלָּתִי
  choice: dan doaku
  rationale: Padanan nominal langsung; kata penghubung mengaitkan doa dengan perkabungan dan puasanya bagi mereka.
- source_word: עַל חֵיקִי
  choice: ke dadaku sendiri
  rationale: חֵיק dapat menunjuk dada, pangkuan, atau lipatan pakaian di dada. 'Dadaku sendiri' mempertahankan citra sesuatu yang kembali kepada diri pemazmur.
- source_word: תָשׁוּב
  choice: kembali
  rationale: Kata שוב berarti kembali atau berbalik. Bentuk Ibrani ini dapat dibaca dalam rangkaian naratif sebagai tindakan lampau, sementara bahasa Indonesia tidak perlu menandai kala pada verba.
theological_decisions:
- issue: Makna ungkapan 'doaku kembali ke dadaku sendiri'
  choice: Citra Ibrani dipertahankan tanpa menetapkan satu tafsiran.
  alternative: Doaku kembali tanpa jawaban; doaku kembali membawa manfaat kepadaku; doaku kupanjatkan seperti untuk diriku sendiri.
  rationale: Ungkapan Ibrani ini sungguh ambigu. Mempertahankan metaforanya menghindari penyelesaian diam-diam mengenai apakah doa itu tidak dijawab, manfaatnya kembali kepada pemazmur, atau ia berdoa seakan-akan untuk dirinya sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Kain kabung' mempertahankan istilah budaya Alkitab yang lazim, sedangkan catatan kaki menjelaskannya. Metafora penutup sengaja dipertahankan karena maknanya tidak pasti.
