id: PSA.35.1
reference: Psalms 35:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: id
  text: 'Dari Daud.[a]


    Lawanlah[b], ya Yahweh, orang-orang yang melawan aku;

    perangilah orang-orang yang memerangi aku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat berarti “dari Daud”, “oleh Daud”, atau menunjukkan keterkaitan dengan Daud.
    reason: lexical_alternative
  - marker: b
    text: 'Kata Ibrani ini juga dapat bernuansa hukum: “Belalah perkaraku terhadap orang-orang yang menjadi lawanku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Konstruksi לְ dengan nama Daud dalam judul mazmur dapat menunjukkan asal, kepengarangan, atau keterkaitan. “Dari Daud” mempertahankan keluasan itu tanpa mempersempitnya menjadi “ditulis oleh Daud”.
- source_word: רִיבָה ... אֶת יְרִיבַי
  choice: Lawanlah ... orang-orang yang melawan aku
  rationale: Akar ריב mencakup sengketa hukum maupun pertentangan secara umum. Pengulangan “lawanlah ... yang melawan” mempertahankan kesejajaran verbal Ibrani dan terdengar wajar dalam bahasa Indonesia; nuansa hukum dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar “TUHAN”, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: לְחַם ... אֶת לֹחֲמָי
  choice: perangilah ... orang-orang yang memerangi aku
  rationale: Akar לחם menyatakan pertempuran atau peperangan. Pasangan “perangilah ... yang memerangi” mempertahankan daya militer dan pengulangan akar dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu secara langsung dan merupakan transliterasi ilmiah yang lazim.
- issue: Permohonan pemazmur dapat bernuansa hukum atau pertentangan umum
  choice: Lawanlah, dengan alternatif bernuansa hukum dalam catatan kaki
  alternative: Belalah perkaraku terhadap orang-orang yang menjadi lawanku
  rationale: Objek “perkaraku” tidak dinyatakan secara eksplisit dalam bahasa Ibrani, tetapi akar ריב memang dapat menggambarkan perkara hukum. Teks utama tidak menambahkan objek tersebut, sementara catatan kaki menjaga nuansa yuridisnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Kesejajaran puitis serta pengulangan akar pada kedua baris dipertahankan dengan pasangan “lawanlah/melawan” dan “perangilah/memerangi”.
