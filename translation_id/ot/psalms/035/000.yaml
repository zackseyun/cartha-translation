  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: id
  text: Dari Daud. Berperkaralah[a], ya TUHAN, melawan orang-orang yang berperkara denganku; berperanglah melawan orang-orang yang memerangi aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “berperkaralah” dapat berarti “berselisih” atau “membela perkara.” Karena itu, bagian awal dapat pula diterjemahkan, “Belalah perkaraku, ya TUHAN, terhadap para lawanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan judul ini secara harfiah berarti 'milik/untuk/dari Daud'; 'Dari Daud' mempertahankan kaitannya dengan Daud tanpa menentukan secara mutlak jenis hubungan tersebut.
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: Berperkaralah ... melawan orang-orang yang berperkara denganku
  rationale: Akar ריב dapat menunjuk pada perselisihan umum maupun sengketa hukum. Pengulangan akar dipertahankan dengan 'berperkara' agar nuansa yudisial dan permainan katanya tetap terdengar.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Nama ilahi tetragramaton disajikan menurut konvensi Alkitab bahasa Indonesia yang lazim, yaitu TUHAN; bentuk Ibraninya dijelaskan dalam catatan.
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: berperanglah melawan orang-orang yang memerangi aku
  rationale: Terjemahan ini mempertahankan pengulangan akar לחם serta paralelisme dengan klausa sebelumnya.
theological_decisions:
- issue: Permohonan agar Allah melawan para lawan pemazmur
  choice: Dipertahankan sebagai dua imperatif langsung kepada TUHAN
  alternative: Melunakkan menjadi permohonan perlindungan umum
  rationale: Teks Ibrani secara tegas meminta TUHAN berperkara dan berperang melawan para penentang; ketegangan teologisnya tidak dilunakkan.
- issue: Hubungan judul mazmur dengan Daud
  choice: '''Dari Daud'''
  alternative: '''Oleh Daud'', ''Untuk Daud'', atau ''Mengenai Daud'''
  rationale: Preposisi לְ memungkinkan beberapa hubungan. 'Dari Daud' adalah bentuk judul yang alami tetapi tidak dimaksudkan untuk menutup seluruh ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan langsung. Repetisi akar kata pada kedua pasangan verba dipertahankan untuk mencerminkan paralelisme dan daya retoris bahasa Ibrani. Penanda catatan [a] ditempatkan pada akhir ayat karena catatan menjelaskan nama ilahi sekaligus alternatif bagi klausa pertama.
