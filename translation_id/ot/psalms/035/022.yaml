  text: רָאִ֣יתָה יְ֭הוָה אַֽל תֶּחֱרַ֑שׁ אֲ֝דֹנָ֗/י אֲל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: id
  text: Engkau telah melihat, ya Yahweh; jangan tinggal diam. Ya Tuhan, jangan jauh dariku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: Engkau telah melihat
  rationale: Bentuk Qal perfekt orang kedua maskulin tunggal menyapa Allah secara langsung dan menyatakan bahwa Ia telah menyaksikan keadaan yang diadukan. Bentuk 'telah melihat' mempertahankan aspek tindakan yang sudah terjadi tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sehingga dibedakan dari gelar אֲדֹנָי pada bagian berikutnya.
- source_word: אַל תֶּחֱרַשׁ
  choice: jangan tinggal diam
  rationale: Kata חרשׁ di sini berarti berdiam atau tidak bersuara. Ungkapan 'jangan tinggal diam' alami dalam bahasa Indonesia dan tetap dapat mencakup seruan agar Allah tidak terus diam maupun tidak bertindak.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: אֲדֹנָי berfungsi sebagai gelar ilahi 'Tuhan'. Terjemahan ini mempertahankan perbedaannya dari nama Yahweh.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: jangan jauh dariku
  rationale: Ungkapan dengan רחק dan preposisi מן menyampaikan permohonan agar Tuhan tidak berada atau tetap jauh dari pemazmur. Terjemahan ini mempertahankan metafora jarak dalam bentuk Indonesia yang ringkas dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה dan gelar אֲדֹנָי dalam ayat yang sama
  choice: '''Yahweh'' untuk יהוה dan ''Tuhan'' untuk אֲדֹנָי'
  alternative: '''TUHAN'' untuk יהוה dan ''Tuhan'' untuk אֲדֹנָי'
  rationale: Teks Ibrani sengaja memakai nama ilahi lalu gelar ilahi. Mentransliterasikan יהוה sebagai 'Yahweh' sambil menerjemahkan אֲדֹנָי sebagai 'Tuhan' mempertahankan pembedaan leksikal tersebut tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Sapaan 'Engkau' dipakai untuk menjaga bentuk langsung doa. Tidak digunakan catatan kaki karena alternatif 'jangan terus diam' tidak memberi informasi penting yang tidak tercakup oleh 'jangan tinggal diam'; penanda catatan pada lapisan konsultasi Inggris tampaknya salah ditempatkan pada kata 'seen'.
