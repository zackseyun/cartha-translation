id: PSA.35.10
reference: Psalms 35:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּ֥ל עַצְמוֹתַ֨/י תֹּאמַרְנָה֮ יְהוָ֗ה מִ֥י כָ֫מ֥וֹ/ךָ מַצִּ֣יל עָ֭נִי מֵ/חָזָ֣ק מִמֶּ֑/נּוּ וְ/עָנִ֥י וְ֝/אֶבְי֗וֹן מִ/גֹּזְלֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: id
  text: Seluruh tulangku akan berkata, “Ya TUHAN, siapakah yang seperti Engkau? Engkau melepaskan orang tertindas dari orang yang lebih kuat daripadanya, orang tertindas dan orang miskin dari orang yang merampasnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: Seluruh tulangku
  rationale: Mempertahankan gambaran Ibrani tentang segenap diri pemazmur yang bersaksi, tanpa mengubahnya menjadi ungkapan abstrak.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH dengan huruf kapital.
- source_word: עָנִי
  choice: orang tertindas
  rationale: Dalam konteks penyelamatan dari pihak yang kuat dan perampas, kata ini menunjuk pada orang yang lemah, menderita, atau tertindas; pilihan ini mempertahankan dimensi penderitaannya.
- source_word: אֶבְיוֹן
  choice: orang miskin
  rationale: Menyatakan orang yang berkekurangan atau melarat dan membedakannya secara wajar dari עָנִי.
- source_word: גֹּזְלוֹ
  choice: orang yang merampasnya
  rationale: Menerjemahkan partisipel dari גזל sebagai pelaku perampasan, dengan akhiran pronominal tunggal tetap dipertahankan.
theological_decisions:
- issue: Pernyataan bahwa tidak ada yang seperti YHWH
  choice: siapakah yang seperti Engkau?
  alternative: tidak ada yang seperti Engkau
  rationale: Mempertahankan bentuk pertanyaan retoris sumber dan tidak mengubahnya menjadi pernyataan eksplisit.
- issue: Relasi antara orang tertindas dan penindas yang lebih kuat
  choice: dari orang yang lebih kuat daripadanya
  alternative: dari kekuatan yang melampauinya
  rationale: Mempertahankan rujukan personal dan perbandingan dalam teks Ibrani tanpa menentukan identitas penindas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel puisi Ibrani dipertahankan, sedangkan susunan kalimat dibuat alami bagi pembaca Indonesia.
