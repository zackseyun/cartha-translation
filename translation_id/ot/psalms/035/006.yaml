  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: id
  text: Semoga jalan mereka gelap dan licin, dengan malaikat Yahweh mengejar mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan malaikat Yahweh mengejar mereka.” Konjungsi Ibrani dapat menyatakan koordinasi sederhana; teks utama memakai “dengan” untuk menyampaikan keadaan penyerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Semoga ...
  rationale: Bentuk yusif dari היה menyatakan harapan atau kutukan; “semoga” mempertahankan daya volitifnya secara wajar dalam bahasa Indonesia.
- source_word: דַרְכָּם
  choice: jalan mereka
  rationale: דֶּרֶךְ dapat berarti jalan secara harfiah maupun kiasan; “jalan” mempertahankan kedua kemungkinan tersebut.
- source_word: חֹשֶׁךְ
  choice: gelap
  rationale: Nomina Ibrani berfungsi sebagai predikat; bentuk adjektival “gelap” alami dalam bahasa Indonesia dan mempertahankan citra bahaya serta ketidakjelasan.
- source_word: וַחֲלַקְלַקּוֹת
  choice: dan licin
  rationale: Bentuk jamak ini menunjuk pada kelicinan atau tempat-tempat licin. “Licin” alami sebagai predikat yang sejajar dengan “gelap” tanpa menghilangkan gambaran bahayanya.
- source_word: וּמַלְאַךְ יְהוָה
  choice: dengan malaikat Yahweh
  rationale: Waw dapat dipahami sebagai koordinasi sederhana (“dan”) atau keadaan penyerta. “Dengan” menyampaikan keadaan penyerta dengan lancar, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: רֹדְפָם
  choice: mengejar mereka
  rationale: רדף berarti mengejar atau memburu; “mengejar” mempertahankan tindakan aktif yang bermusuhan tanpa mempersempit caranya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Hubungan malaikat Yahweh dengan keadaan jalan mereka
  choice: 'keadaan penyerta: “dengan”'
  alternative: 'koordinasi sederhana: “dan”'
  rationale: Konjungsi Ibrani memungkinkan kedua hubungan tersebut. Teks utama memakai bentuk penyerta yang alami, sedangkan kemungkinan koordinatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan mempertahankan citra puitis jalan yang gelap dan licin serta nada kutukan dalam bentuk “Semoga”.
