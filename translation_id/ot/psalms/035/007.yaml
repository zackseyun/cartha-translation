lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi permohonan pemazmur dalam konteks sekitarnya; “sebab” mempertahankan hubungan kausalnya.
- source_word: חִנָּם
  choice: tanpa alasan
  rationale: Adverbia ini menyatakan tindakan yang dilakukan tanpa dasar atau alasan yang membenarkan. Pengulangannya dipertahankan dalam kedua klausa.
- source_word: טָמְנוּ
  choice: menyembunyikan
  rationale: Verba ini berarti menyembunyikan atau memasang sesuatu secara tersembunyi; pilihan ini mempertahankan gambaran perangkap.
- source_word: לִי
  choice: bagiku
  rationale: Preposisi dengan sufiks orang pertama menunjuk kepada pemazmur sebagai sasaran tindakan yang merugikan.
- source_word: שַׁחַת
  choice: lubang
  rationale: Dalam konteks perburuan dan perangkap, kata ini menunjuk kepada lubang perangkap, bukan semata-mata kebinasaan abstrak.
- source_word: רִשְׁתָּם
  choice: dengan jaring mereka
  rationale: Hubungan sintaksis antara “lubang” dan “jaring mereka” tidak sepenuhnya jelas. Terjemahan utama mempertahankan kedua unsur dan menyajikan jaring sebagai perlengkapan lubang perangkap tanpa menyatakan hubungan itu secara terlalu pasti.
- source_word: חָפְרוּ
  choice: menggali lubang
  rationale: Verba ini berarti menggali. Objek “lubang” dinyatakan kembali secara wajar dalam bahasa Indonesia berdasarkan gambaran pada klausa pertama.
- source_word: לְנַפְשִׁי
  choice: untuk nyawaku
  rationale: נֶפֶשׁ di sini menunjuk kepada hidup atau diri pemazmur yang terancam, bukan secara khusus kepada jiwa tak berjasad.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam ancaman terhadap pemazmur
  choice: nyawaku
  alternative: jiwaku; diriku
  rationale: Konteks menggambarkan ancaman terhadap kehidupan pemazmur. “Nyawaku” menyampaikan makna itu tanpa memasukkan pengertian antropologis yang lebih sempit dari masa kemudian.
translation_notes:
  register: Bahasa Indonesia baku yang puitis namun mudah dipahami. Bentuk terikat “bagiku” dan “nyawaku” menjaga suara orang pertama mazmur. Pengulangan “tanpa alasan” dipertahankan untuk mencerminkan penekanan teks Ibrani. Ambiguitas hubungan antara lubang dan jaring tidak diselesaikan secara dogmatis; alternatifnya dicatat dalam catatan kaki.
