  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ֘רֵ֤ק חֲנִ֣ית וּ֭/סְגֹר לִ/קְרַ֣את רֹדְפָ֑/י אֱמֹ֥ר לְ֝/נַפְשִׁ֗/י יְֽשֻׁעָתֵ֥/ךְ אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: id
  text: Hunuslah tombak dan halangilah jalan orang-orang yang mengejar aku[a]; katakanlah kepada jiwaku[b], “Akulah keselamatanmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hunuslah tombak dan kapak perang untuk menghadapi orang-orang yang mengejar aku,” jika וּסְגֹר dipahami sebagai nama senjata, bukan sebagai kata kerja “menutup” atau “menghalangi.”
    reason: alternative_reading
  - marker: b
    text: Atau “kepada diriku.” Kata Ibrani נֶפֶשׁ dapat berarti jiwa, diri, atau nyawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: Hunuslah
  rationale: Bentuk imperatif Hifil dari ריק di sini berarti mengeluarkan atau menghunus senjata. “Hunuslah” alami dalam konteks persenjataan dan mempertahankan citra pertempuran.
- source_word: חֲנִית
  choice: tombak
  rationale: Padanan baku dan mudah dipahami untuk senjata חֲנִית; bahasa Indonesia tidak memerlukan kata sandang.
- source_word: וּסְגֹר
  choice: halangilah jalan
  rationale: Secara harfiah berarti “tutuplah.” Dalam konteks menghadapi para pengejar, frasa ini menyatakan penutupan atau penghalangan jalan; objek tersirat “jalan” dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: לִקְרַאת
  choice: orang-orang yang mengejar aku
  rationale: לִקְרַאת menyatakan gerak untuk menghadapi pihak yang datang. Nuansa konfrontatifnya tercakup oleh tindakan menghalangi jalan para pengejar tanpa menambahkan kata yang terasa janggal.
- source_word: רֹדְפָי
  choice: orang-orang yang mengejar aku
  rationale: Partisip dengan sufiks orang pertama tunggal berarti “para pengejarku” atau “orang-orang yang mengejar aku.” Bentuk ini jelas dan mempertahankan tindakan yang sedang berlangsung.
- source_word: אֱמֹר
  choice: katakanlah
  rationale: Padanan langsung bagi imperatif אמר dan sesuai dengan ragam doa yang bermartabat.
- source_word: לְנַפְשִׁי
  choice: kepada jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, diri, atau nyawa. “Jiwaku” mempertahankan ungkapan puitis dan daya personal teks tanpa meratakannya menjadi sekadar “kepadaku.”
- source_word: יְשֻׁעָתֵךְ
  choice: keselamatanmu
  rationale: יְשׁוּעָה mencakup pertolongan atau pembebasan dalam bahaya konkret sekaligus keselamatan dalam arti lebih luas. “Keselamatan” mempertahankan keluasan makna itu.
- source_word: אָֽנִי
  choice: Akulah
  rationale: Pronomina mandiri אָֽנִי bersifat menegaskan. Bentuk “Akulah” secara alami menyampaikan tekanan “Aku sendiri adalah keselamatanmu.”
theological_decisions:
- issue: Makna יְשׁוּעָה dalam doa memohon pertolongan
  choice: keselamatan
  alternative: pembebasan
  rationale: Konteks langsungnya adalah penyelamatan dari para pengejar, sehingga “pembebasan” mungkin. Namun, “keselamatan” tetap mencakup pertolongan konkret itu sekaligus menjaga keluasan makna Ibrani tanpa memasukkan rumusan doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Imperatif berakhiran -lah mempertahankan nada permohonan mazmur. Ambiguitas וּסְגֹר dan rentang makna נֶפֶשׁ dicatat dalam catatan kaki.
