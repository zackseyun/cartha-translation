base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: id
  text: Berilah aku keadilan sesuai dengan kebenaran-Mu[a], ya Yahweh, Allahku; jangan biarkan mereka bersukacita atas aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keadilan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Berilah aku keadilan
  rationale: Dalam konteks permohonan ini, bentuk imperatif dari שׁפט meminta Allah menjatuhkan putusan yang membenarkan pemazmur. Ungkapan ini mempertahankan nuansa hukum tanpa menyiratkan bahwa Allah sekadar menilai dirinya secara netral.
- source_word: כְצִדְקְךָ
  choice: sesuai dengan kebenaran-Mu
  rationale: צדק menunjuk pada sifat dan patokan Allah yang benar, sekaligus mencakup keadilan-Nya. Pilihan ini mempertahankan keluasan makna istilah Ibrani; alternatif kontekstualnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri Yahweh, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Akhiran orang pertama tunggal dipertahankan secara langsung dan alami.
- source_word: וְאַל יִשְׂמְחוּ
  choice: jangan biarkan mereka bergembira
  rationale: אַל dengan bentuk tak selesai menyatakan permohonan negatif kepada Allah. 'Jangan biarkan' memperjelas bahwa Allah dimohon mencegah kegembiraan kemenangan para lawan.
- source_word: לִי
  choice: karena aku
  rationale: Dalam konteks permusuhan, preposisi ל dengan שׂמח menyatakan kegembiraan yang timbul dari apa yang menimpa pemazmur. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak terdapat dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna צִדְקְךָ
  choice: kebenaran-Mu
  alternative: keadilan-Mu
  rationale: '''Kebenaran-Mu'' mempertahankan dimensi moral dan relasional dari צדק, sedangkan ''keadilan-Mu'' merupakan kemungkinan yang kuat dalam konteks pengadilan dan karena itu dicantumkan dalam catatan kaki.'
- issue: Nuansa permohonan שָׁפְטֵנִי
  choice: Berilah aku keadilan
  alternative: Hakimilah aku
  rationale: Konteks menunjukkan permohonan akan putusan yang membela pemazmur. Pilihan ini menyampaikan daya forensik teks tanpa mengubah permohonan itu menjadi pernyataan mutlak tentang ketidakbersalahan moralnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan '-Mu' dipakai bagi Allah sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda titik koma mempertahankan hubungan erat antara permohonan akan keadilan dan permohonan agar para lawan tidak bergembira.
