    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: Dan lidahku
  rationale: Mempertahankan kata sambung ו serta metafora Ibrani yang menjadikan 'lidah' sebagai pelaku tutur; bentuk ini juga alami dalam puisi Indonesia.
- source_word: תֶּהְגֶּה
  choice: akan memperkatakan
  rationale: הגה dapat berarti bergumam, merenungkan, atau mengucapkan. Karena subjeknya adalah 'lidah', ungkapan lisan paling sesuai, tetapi catatan kaki mempertahankan keluasan maknanya.
- source_word: צִדְקֶךָ
  choice: kebenaran-Mu
  rationale: Menjaga keluasan צדק yang mencakup kelurusan moral dan tindakan Allah yang adil dalam membela pemazmur; 'keadilan-Mu' dicatat sebagai alternatif kontekstual.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan Indonesia yang alami untuk tindakan yang berlangsung terus selama hari itu.
- source_word: תְּהִלָּתֶךָ
  choice: memuji-Mu
  rationale: Nomina Ibrani berarti 'pujian-Mu' atau 'pujian kepada-Mu'. Dalam klausa eliptis ini, bentuk verbal menghasilkan bahasa Indonesia yang jelas dan alami tanpa mengubah arah pujian kepada Allah.
theological_decisions:
- issue: Makna צִדְקֶךָ dalam konteks pembelaan ilahi
  choice: kebenaran-Mu
  alternative: keadilan-Mu
  rationale: '''Kebenaran'' mempertahankan cakupan sifat dan tindakan Allah, sedangkan ''keadilan'' menonjolkan pembelaan atau keputusan adil yang penting dalam konteks mazmur ini; alternatif tersebut dipertahankan dalam catatan kaki.'
- issue: Hubungan תְּהִלָּתֶךָ dengan Allah
  choice: memuji-Mu
  alternative: menuturkan pujian-Mu
  rationale: Akhiran orang kedua dapat dipahami sebagai pujian yang ditujukan kepada Allah atau pujian yang menjadi milik-Nya. Terjemahan utama menyampaikan arah pujian secara alami, sedangkan bentuk nominal sumber dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Bentuk “memperkatakan” dipilih untuk nuansa tutur yang khidmat; klausa terakhir dibuat verbal agar elipsis puisi Ibrani terbaca alami dalam bahasa Indonesia. Huruf kapital pada akhiran -Mu mengikuti kebiasaan penulisan rujukan kepada Allah.
