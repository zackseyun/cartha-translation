  text: And my tongue will meditate on your righteousness[d][c][b][a], and on your praise all day long.
translation:
  language: id
  text: Dan lidahku akan menuturkan[b] kebenaran-Mu[a] dan pujian-Mu[c] sepanjang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan-Mu.” Kata Ibrani ini dapat menunjuk pada kebenaran maupun keadilan, khususnya tindakan Allah membela orang yang benar.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini dapat berarti “bergumam,” “merenungkan,” atau “mengucapkan.” Karena subjeknya “lidahku,” konteks di sini mengarah pada perkataan yang terdengar.
    reason: lexical_alternative
