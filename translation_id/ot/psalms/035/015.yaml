  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: id
  text: Namun, ketika aku tersandung[a], mereka bersukacita dan berkumpul; mereka berkumpul melawan aku—para penyerang yang tidak kukenal[b][c]. Mereka mencabik-cabik aku dan tidak berhenti[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika aku berjalan timpang” atau “pada saat aku goyah.” Kata Ibrani dapat menunjuk pada kepincangan jasmani atau, secara lebih luas, saat kelemahan atau kejatuhan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “para penyerang” langka dan tidak pasti; mungkin berarti “orang-orang yang memukul,” atau mungkin “orang-orang yang tertindas/pincang.”
    reason: lexical_alternative
  - marker: c
    text: Atau “mereka berkumpul melawan aku—para penyerang—tanpa sepengetahuanku.”
    reason: syntactic_alternative
  - marker: d
    text: Atau “mereka mencabik-cabik aku dan tidak diam,” jika gambaran ini menunjuk pada cercaan lisan yang tiada henti, bukan serangan jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: ketika aku tersandung
  rationale: צלע dapat menunjuk pada keadaan timpang, pincang, atau goyah. Dalam konteks ini, 'ketika aku tersandung' mempertahankan kemungkinan kelemahan jasmani maupun kemunduran atau kejatuhan secara kiasan.
- source_word: שָׂמְחוּ
  choice: mereka bersukacita
  rationale: Padanan langsung dan wajar bagi bentuk Qal perfektum שמח, yang di sini menyatakan kegembiraan penuh permusuhan.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: dan berkumpul; mereka berkumpul
  rationale: Pengulangan kata kerja אסף dipertahankan untuk mencerminkan penekanan retoris teks Ibrani.
- source_word: עָלַי
  choice: melawan aku
  rationale: Dalam konteks permusuhan, עַל secara alami menyatakan tindakan yang ditujukan melawan pemazmur.
- source_word: נֵכִים
  choice: orang-orang yang menyerang aku
  rationale: Istilah ini langka dan maknanya tidak pasti. Hubungannya yang mungkin dengan akar bermakna 'memukul' serta konteks serangan mendukung terjemahan agresif ini, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: וְלֹא יָדַעְתִּי
  choice: yang tidak kukenal
  rationale: Frasa ini dipahami sebagai keterangan relatif bagi para penyerang. Namun, secara sintaksis frasa tersebut juga dapat berarti bahwa pemazmur tidak mengetahui tindakan atau persekongkolan mereka; kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: קָרְעוּ
  choice: mereka mencabik-cabik aku
  rationale: קרע berarti merobek atau mencabik. Objeknya tersirat; 'aku' dipasok dari konteks tanpa menentukan apakah serangan itu jasmani atau berupa cercaan.
- source_word: וְלֹא דָמּוּ
  choice: dan tidak berhenti
  rationale: דמם dapat berarti berhenti atau diam. 'Tidak berhenti' sesuai dengan serangan yang berlangsung terus, sementara arti 'tidak diam' dicatat sebagai alternatif.
