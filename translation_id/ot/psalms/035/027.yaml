id: PSA.35.27
reference: Psalms 35:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: id
  text: Biarlah orang-orang yang menginginkan aku dibenarkan bersorak-sorai dan bergembira[a]; biarlah mereka senantiasa berkata, “Kiranya Yahweh diagungkan, yang menghendaki kesejahteraan hamba-Nya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebenaranku” atau “keadilanku.” Istilah Ibrani ini dapat menunjuk pada kebenaran dalam arti moral atau hukum; di sini kemungkinan besar yang dimaksud ialah pembenaran atau dinyatakannya pemazmur sebagai pihak yang benar.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “kesejahteraan” juga dapat berarti kedamaian, keadaan baik, keutuhan, atau kemakmuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ
  choice: bersorak-sorai
  rationale: Kata kerja רנן menunjuk pada seruan sukacita yang nyaring; “bersorak-sorai” menyampaikan ungkapan sukacita yang terbuka dan penuh semangat.
- source_word: וְיִשְׂמְחוּ
  choice: dan bergembira
  rationale: שמח berarti bergembira atau bersukacita. Pilihan ini mempertahankan kesejajaran dengan seruan sukacita sebelumnya tanpa terdengar janggal dalam bahasa Indonesia.
- source_word: חֲפֵצֵי
  choice: orang-orang yang menyukai
  rationale: Partisipel חפץ menyatakan rasa senang atau berkenan terhadap sesuatu. “Menyukai” alami untuk sikap para pendukung pemazmur terhadap pembelaannya.
- source_word: צִדְקִי
  choice: pembelaanku
  rationale: Dalam konteks sengketa hukum mazmur ini, צֶדֶק dengan sufiks orang pertama terutama menunjuk pada tampilnya pemazmur sebagai pihak yang benar. “Pembelaanku” mengungkapkan nuansa forensik tersebut, sementara kemungkinan arti yang lebih luas dipertahankan dalam catatan kaki.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: biarlah mereka senantiasa berkata
  rationale: Bentuk ini melanjutkan daya harapan atau ajakan dari klausa sebelumnya, dan תָמִיד menunjukkan tindakan yang terus berlangsung.
- source_word: יִגְדַּל יְהוָה
  choice: Kiranya Yahweh diagungkan
  rationale: Bentuk imperfek berfungsi sebagai yusif dalam rumusan pujian. “Kiranya ... diagungkan” mempertahankan daya harapan dan arti גדל sebagai dianggap atau dinyatakan besar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” sehingga nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: הֶחָפֵץ
  choice: yang berkenan atas
  rationale: Partisipel חפץ menyatakan kesenangan atau perkenanan. “Berkenan atas” cocok secara alami dengan kesejahteraan hamba dan tetap mencerminkan kaitan leksikal dengan חֲפֵצֵי.
- source_word: שְׁלוֹם
  choice: kesejahteraan
  rationale: שָׁלוֹם mencakup keadaan damai, aman, utuh, dan sejahtera. Dalam hubungan dengan hamba Yahweh, “kesejahteraan” paling baik menyampaikan cakupan luas tersebut; alternatif “kedamaian” dicatat.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam Mazmur, עבד sebagai sebutan pemazmur dalam hubungannya dengan Allah paling wajar diterjemahkan “hamba”; sufiks posesif dirender dengan bentuk hormat “-Nya.”
theological_decisions:
- issue: Makna צִדְקִי yang mengacu pada pemazmur
  choice: pembelaanku
  alternative: kebenaranku atau keadilanku
  rationale: 'Konteks pertentangan dengan para penuduh mendukung arti forensik: pemazmur dinyatakan berada di pihak yang benar. Pilihan ini tidak mengubahnya menjadi klaim tentang kesempurnaan moral, sedangkan keluasan istilah Ibrani tetap disampaikan dalam catatan kaki.'
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama pribadi ilahi dalam teks sumber tanpa menggantinya dengan suatu gelar.
- issue: Cakupan makna שְׁלוֹם
  choice: kesejahteraan
  alternative: kedamaian atau kemakmuran
  rationale: Istilah ini tidak hanya menunjuk pada ketiadaan konflik, tetapi juga keadaan baik, aman, dan utuh. “Kesejahteraan” mempertahankan keluasan itu tanpa membatasi ayat pada kemakmuran materi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur harapan “Biarlah ...” dan “Kiranya ...” mempertahankan daya yusif teks Ibrani. “Bersorak-sorai dan bergembira” menjaga kesejajaran puitis, sedangkan “senantiasa” mempertahankan kesinambungan pujian.
