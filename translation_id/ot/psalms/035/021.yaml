  text: They opened their mouths wide against me; they said[a], “Aha, aha! Our eyes have seen it!”
translation:
  language: id
  text: Mereka membuka mulut lebar-lebar terhadapku; mereka berkata, “Aha, aha! Mata kami sudah melihatnya!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mata kami telah melihat.” Objek yang dilihat tidak dinyatakan dalam teks Ibrani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְחִיבוּ
  choice: membuka ... lebar-lebar
  rationale: Bentuk Hifil dari רחב secara harfiah berarti ‘membuat lebar’. Dengan ‘mulut’ sebagai objek, ungkapan ini menggambarkan tindakan membuka mulut lebar-lebar dalam ejekan atau sorak kemenangan yang penuh permusuhan.
- source_word: עָלַי
  choice: untuk melawan aku
  rationale: Preposisi עַל dalam konteks ujaran bermusuhan menyatakan sikap menentang. Frasa ini mempertahankan arah permusuhan dengan bahasa Indonesia yang jelas.
- source_word: פִּיהֶם
  choice: mulut
  rationale: Bahasa Ibrani memakai bentuk tunggal dengan subjek jamak secara distributif. Dalam bahasa Indonesia, ‘mereka membuka mulut’ terdengar alami dan dapat merujuk pada mulut masing-masing tanpa perlu menjamakkannya.
- source_word: הֶאָח הֶאָח
  choice: Aha, aha!
  rationale: Seruan berulang ini mengungkapkan kegembiraan jahat atau ejekan penuh kemenangan. ‘Aha’ mempertahankan bentuk seruan dan pengulangannya.
- source_word: רָאֲתָה עֵינֵינוּ
  choice: Mata kami sudah melihatnya
  rationale: Secara bentuk, verba ‘melihat’ tunggal selaras dengan ungkapan kolektif ‘mata kami’. ‘Sudah melihatnya’ merupakan ungkapan Indonesia yang alami; akhiran ‘-nya’ menyatakan hal yang mereka klaim telah saksikan, yang tersirat dalam konteks.
