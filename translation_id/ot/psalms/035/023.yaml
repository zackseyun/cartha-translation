id: PSA.35.23
reference: Psalms 35:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הָעִ֣ירָ/ה וְ֭/הָקִיצָ/ה לְ/מִשְׁפָּטִ֑/י אֱלֹהַ֖/י וַֽ/אדֹנָ֣/י לְ/רִיבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/023.yaml
  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
translation:
  language: id
  text: Bangunlah dan bangkitlah demi keadilan bagiku[a], ya Allahku dan Tuhanku, demi perkaraku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk menghakimi perkaraku” atau “untuk membenarkan aku”; istilah Ibrani dapat berarti penghakiman, keadilan, keputusan hukum, atau pembenaran dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “demi sengketaku”; kata Ibrani menunjuk pada perkara, sengketa, atau pertikaian hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִירָה
  choice: Bangunlah
  rationale: Bentuk permohonan imperatif dari עור yang memakai gambaran terbangun untuk meminta Allah segera bertindak. “Bangunlah” alami dalam bahasa Indonesia dan mempertahankan metaforanya.
- source_word: וְהָקִיצָה
  choice: dan bangkitlah
  rationale: Kata kedua dari יקץ juga menyatakan terbangun dan menguatkan desakan kata pertama. “Bangkitlah” membedakannya dari kata pertama sekaligus menyiratkan kesiapan untuk bertindak.
- source_word: לְמִשְׁפָּטִי
  choice: demi keadilan bagiku
  rationale: מִשְׁפָּט dapat berarti penghakiman, keadilan, keputusan hukum, atau pembenaran dalam konteks perkara. Ungkapan ini mempertahankan nuansa hukum dan permohonan agar Allah memberi keadilan kepada pemazmur tanpa memastikan hasil putusan secara berlebihan.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk dengan akhiran milik orang pertama tunggal dan sapaan langsung diterjemahkan secara lugas.
- source_word: וַאדֹנָי
  choice: dan Tuhanku
  rationale: אֲדֹנָי merupakan gelar ilahi dalam sapaan. “Tuhan” adalah padanan baku dan sesuai dengan bahasa doa Indonesia.
- source_word: לְרִיבִי
  choice: demi perkaraku
  rationale: רִיב menunjuk pada sengketa, pertikaian, atau perkara hukum. “Perkaraku” alami dalam bahasa Indonesia dan tetap membawa nuansa forensik tanpa mempersempitnya menjadi gugatan modern tertentu.
theological_decisions:
- issue: Sapaan kepada Allah dengan gelar berpasangan אֱלֹהַי וַאדֹנָי
  choice: ya Allahku dan Tuhanku
  alternative: ya Allahku dan Penguasaku
  rationale: Kedua bentuk dipertahankan sebagai sapaan hormat langsung kepada Allah. “Tuhan” menerjemahkan gelar ilahi secara wajar tanpa memasukkan klaim kristologis khusus ke dalam mazmur ini.
- issue: Arah מִשְׁפָּט dalam permohonan pemazmur
  choice: keadilan bagiku
  alternative: penghakiman atas perkaraku; pembelaan bagiku
  rationale: Konteks mendukung permohonan pembenaran, tetapi istilah Ibrani tetap dapat menunjuk pada tindakan atau putusan pengadilan. Terjemahan utama mempertahankan ketegangan itu dan tidak menyatakan pembenaran sebagai hasil yang sudah pasti.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Dua kata perintah dipertahankan untuk membawa desakan paralel teks Ibrani; susunan sapaan dan frasa hukum mengikuti sumber sedekat mungkin tanpa menjadi kaku.
