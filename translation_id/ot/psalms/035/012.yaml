lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: mereka membalas ... kepadaku (diungkapkan secara alami melalui “kebaikanku”)
  rationale: Bentuk piel dari שׁלם menyatakan tindakan membalas atau memberi ganjaran. Susunan “membalas kebaikanku dengan kejahatan” merupakan ungkapan Indonesia yang alami dan mempertahankan gagasan balasan yang bermusuhan.
- source_word: רָעָה
  choice: kejahatan
  rationale: Kata ini dapat berarti kejahatan atau malapetaka. “Kejahatan” mempertahankan baik daya moral maupun unsur mencelakakan dalam tuduhan pemazmur.
- source_word: תַּחַת טוֹבָה
  choice: kebaikanku dengan
  rationale: תַּחַת menandai pertukaran atau balasan, sedangkan טוֹבָה berarti kebaikan atau hal baik. Susunan Indonesia membalik urutan unsur agar idiomatis tanpa mengubah hubungan 'kejahatan sebagai balasan atas kebaikan'.
- source_word: שְׁכוֹל
  choice: berduka karena kehilangan
  rationale: Nomina ini menunjuk pada kehilangan yang menyebabkan dukacita, sering kali kematian anak atau orang terkasih. Ungkapan ini menjaga bobot emosionalnya tanpa mempersempitnya menjadi kehilangan anak secara harfiah.
- source_word: לְנַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, atau diri. “Jiwaku” mempertahankan citra puitis dan kedalaman batin, sementara catatan kaki menyatakan keluasan maknanya.
theological_decisions:
- issue: Hubungan sintaksis frasa שְׁכוֹל לְנַפְשִׁי dengan klausa sebelumnya
  choice: 'ditampilkan sebagai akibat: “membuat jiwaku berduka karena kehilangan”'
  alternative: “kehilangan bagi jiwaku” atau “jiwaku kehilangan”
  rationale: Teks Ibrani memakai frasa nominal yang sangat ringkas dan tidak menyatakan penghubung secara eksplisit. Terjemahan utama membuat hubungan yang paling wajar dalam bahasa Indonesia terbaca jelas, sedangkan catatan kaki mempertahankan bentuk dan kemungkinan alternatif sumber.
translation_notes:
