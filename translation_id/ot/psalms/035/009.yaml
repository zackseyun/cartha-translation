  text: וְ֭/נַפְשִׁ/י תָּגִ֣יל בַּ/יהוָ֑ה תָּ֝שִׂישׂ בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/009.yaml
  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: id
  text: Maka jiwaku akan bersukacita dalam Yahweh[a]; akan bersorak gembira dalam keselamatan-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan jiwaku akan bersukacita dalam Yahweh.”'
    reason: Kata penghubung וְ dapat diterjemahkan secara sederhana sebagai “dan”; “maka” menonjolkan hubungan dengan pembebasan yang diharapkan dalam konteks sebelumnya.
  - marker: b
    text: 'Atau: “dalam pembebasan-Nya.”'
    reason: יְשׁוּעָה dapat menunjuk pada keselamatan secara luas atau pembebasan konkret dari bahaya dan musuh; preposisi ב dipertahankan seperti dalam teks Ibrani.
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: Maka jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, diri, atau hidup. Dalam puisi pujian ini, “jiwaku” mempertahankan ungkapan pribadi yang menyeluruh. וְ diterjemahkan “Maka” karena ayat ini menyatakan tanggapan yang diharapkan setelah permohonan dan pembebasan pada konteks sebelumnya.
- source_word: תָּגִיל
  choice: akan bersukacita
  rationale: Bentuk Qal dari גיל menyatakan kegembiraan atau sukacita. “Akan bersukacita” alami dalam bahasa Indonesia dan sesuai dengan bentuk puisi paralel.
- source_word: בַּיהוָה
  choice: dalam Yahweh
  rationale: Preposisi ב menandai Yahweh sebagai arah atau lingkup sukacita. “Dalam Yahweh” mempertahankan bentuk sumber dan paralelismenya.
- source_word: תָּשִׂישׂ
  choice: akan bersorak gembira
  rationale: שׂוּשׂ/שׂישׂ menunjukkan kegembiraan yang meluap. “Bersorak gembira” membedakannya dari תָּגִיל dan mempertahankan peningkatan puitis.
- source_word: בִּישׁוּעָתוֹ
  choice: karena keselamatan-Nya
  rationale: יְשׁוּעָה dapat berarti keselamatan atau pembebasan. “Keselamatan-Nya” mempertahankan keluasan makna, sedangkan “karena” mengungkapkan secara alami bahwa tindakan penyelamatan Allah menjadi alasan untuk bersorak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna יְשׁוּעָה dalam konteks ancaman musuh
  choice: keselamatan
  alternative: pembebasan atau pertolongan
  rationale: Konteks mazmur menunjuk pada pembebasan konkret dari para musuh, tetapi kata Ibraninya juga memiliki cakupan lebih luas. Teks utama memakai “keselamatan,” sementara catatan kaki mempertahankan kemungkinan “pembebasan.”
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Struktur paralel Ibrani dipertahankan, tetapi frasa kedua memakai “karena” agar hubungan sebab sukacita terdengar alami. Akhiran -Nya merujuk kepada Yahweh.
