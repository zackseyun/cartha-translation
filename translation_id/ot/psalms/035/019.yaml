lexical_decisions:
- source_word: אַל ... יִשְׂמְחוּ
  choice: Jangan biarkan ... bersukacita
  rationale: Partikel negatif dengan bentuk imperfek menyampaikan permohonan larangan kepada Allah; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya jussifnya.
- source_word: לִי
  choice: atas aku
  rationale: Secara harfiah berarti 'bagiku/kepadaku', tetapi dalam konteks permusuhan menunjuk pada kegembiraan atas kemalangan pemazmur.
- source_word: אֹיְבַי שֶׁקֶר
  choice: musuh-musuhku ... dengan dusta
  rationale: 'Ungkapan Ibrani ini padat dan ambigu: שֶׁקֶר dapat mencirikan para musuh sebagai pendusta atau menerangkan tindakan mereka sebagai tindakan palsu/curang. Teks utama mempertahankan kaitan dengan dusta tanpa menyamakannya dengan חִנָּם.'
- source_word: שֹׂנְאַי חִנָּם
  choice: orang-orang yang membenci aku tanpa alasan
  rationale: Partisipel menyatakan mereka yang terus membenci pemazmur, sedangkan חִנָּם menandai bahwa kebencian itu tidak beralasan atau tanpa sebab.
- source_word: יִקְרְצוּ עָיִן
  choice: mengedipkan mata
  rationale: Terjemahan konkret ini mempertahankan idiom Ibrani tentang isyarat mata yang bernada mengejek, jahat, atau bersekongkol; nuansanya dijelaskan dalam catatan kaki.
