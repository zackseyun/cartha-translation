  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
translation:
  language: id
  text: Jangan biarkan musuh-musuhku yang berdusta bersukacita atas aku[a], dan jangan biarkan mereka yang membenciku tanpa alasan mengedipkan mata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibraninya padat. Ungkapan ini juga dapat dipahami sebagai “musuh-musuhku bersukacita atas aku secara curang” atau “musuh-musuhku yang penuh dusta.”
    reason: lexical_alternative
  - marker: b
