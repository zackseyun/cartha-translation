  yaml_path: translation/ot/psalms/035/025.yaml
  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: id
  text: Janganlah mereka berkata dalam hati mereka, “Aha, inilah yang kita inginkan!”[a] Janganlah mereka berkata, “Kita telah menelannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa kita”; dapat juga berarti “apa yang kita inginkan” atau “nafsu kita.” Kata Ibrani nefesy di sini kemungkinan mengungkapkan keinginan batin atau rasa puas, bukan jiwa sebagai unsur nonjasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: Jangan biarkan mereka berkata
  rationale: אַל dengan bentuk imperfek/jusif menyatakan permohonan negatif. Dalam konteks doa kepada Allah, frasa ini secara alami menyampaikan permohonan agar musuh tidak sampai mengucapkan kemenangan mereka.
- source_word: בְלִבָּם
  choice: dalam hati
  rationale: Ungkapan Ibrani ini menunjuk pada perkataan batin atau pikiran tersembunyi. Bahasa Indonesia lazim memakai bentuk kolektif “dalam hati” tanpa harus mengulang pronomina “mereka”.
- source_word: הֶאָח
  choice: Aha
  rationale: Interjeksi ini mengungkapkan kegembiraan atau ejekan penuh kemenangan. “Aha” mempertahankan daya serunya dalam bahasa Indonesia.
- source_word: נַפְשֵׁנוּ
  choice: keinginan kita tercapai
  rationale: נֶפֶשׁ memiliki rentang makna jiwa, diri, hidup, nafsu, dan keinginan. Dalam seruan kemenangan ini, bentuk idiomatis “keinginan kita tercapai” menyampaikan kepuasan karena memperoleh apa yang didambakan, sambil mencatat alternatif harfiahnya dalam catatan kaki.
- source_word: בִּלַּעֲנוּהוּ
  choice: Kita telah menelannya
  rationale: Kata kerja בלע berarti menelan atau melahap. Terjemahan ini mempertahankan metafora hidup tentang penghancuran atau kekalahan total serta aspek perfektif dari bentuk Ibraninya.
