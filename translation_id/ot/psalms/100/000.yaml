  text: מִזְמ֥וֹר לְ/תוֹדָ֑ה הָרִ֥יעוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/000.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: id
  text: 'Mazmur untuk ucapan syukur.[a]


    Bersoraklah kepada Yahweh, hai seluruh bumi!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Judul ini juga dapat diterjemahkan “Mazmur untuk kurban syukur” atau “Mazmur ucapan syukur.”
    reason: Frasa Ibrani לְתוֹדָה dapat menyatakan tujuan mazmur, kurban syukur yang menyertainya, atau sifat mazmur itu sendiri.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Padanan baku dan alami untuk nyanyian yang diiringi musik.
- source_word: לְתוֹדָה
  choice: untuk ucapan syukur
  rationale: Preposisi לְ dipertahankan sebagai tujuan atau peruntukan, sedangkan תּוֹדָה dapat menunjuk pada ucapan syukur; kemungkinan makna kurban syukur dicatat dalam catatan kaki.
- source_word: הָרִיעוּ
  choice: Bersoraklah
  rationale: Kata kerja imperatif ini menyerukan pekik sukacita atau kemenangan; 'bersoraklah' ringkas, alami, dan mempertahankan daya serunya.
- source_word: כָּל־הָאָרֶץ
  choice: hai seluruh bumi
  rationale: Ungkapan ini dipahami sebagai sapaan kepada seluruh bumi; partikel 'hai' membuat fungsi vokatifnya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Bentuk 'Yahweh' menyajikan nama diri dalam teks Ibrani secara langsung dan membedakannya dari gelar אֲדֹנָי, tanpa menambahkan penafsiran denominatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Imperatif dibuat langsung dan bersemangat; tanda seru mencerminkan seruan dalam teks. Judul dipisahkan dari isi mazmur.
