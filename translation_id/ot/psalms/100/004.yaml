base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
translation:
  language: id
  text: Masuklah melalui pintu-pintu gerbang-Nya dengan ucapan syukur[a], ke pelataran-Nya dengan pujian; bersyukurlah kepada-Nya; berkatilah nama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan persembahan syukur”. Kata Ibrani תּוֹדָה dapat berarti ucapan syukur atau persembahan syukur, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: Masuklah
  rationale: Bentuk perintah jamak dari בוא. Dalam konteks gerbang dan pelataran tempat ibadah, “masuklah” menyatakan gerakan memasuki kawasan itu secara alami.
- source_word: שְׁעָרָיו
  choice: gerbang-gerbang-Nya
  rationale: Nomina jamak dengan sufiks orang ketiga tunggal maskulin. Bentuk jamak dipertahankan, dan “gerbang” sesuai dengan jalan masuk ke kawasan suci.
- source_word: בְּתוֹדָה
  choice: dengan ucapan syukur
  rationale: תּוֹדָה dapat berarti ungkapan syukur maupun persembahan syukur. Dalam kesejajaran dengan “pujian”, makna abstrak paling sesuai, sementara kemungkinan kultis dicatat dalam catatan kaki.
- source_word: חֲצֵרֹתָיו
  choice: pelataran-pelataran-Nya
  rationale: Kata ini menunjuk pada pelataran atau halaman dalam kawasan bait. “Pelataran” mempertahankan gambaran tempat ibadah dan bentuk jamaknya.
- source_word: בִּתְהִלָּה
  choice: dengan pujian
  rationale: תְּהִלָּה berarti pujian. Terjemahan ini mempertahankan kesejajaran dengan “dengan ucapan syukur” tanpa menambahkan gagasan tentang nyanyian yang tidak dinyatakan secara eksplisit.
- source_word: הוֹדוּ לוֹ
  choice: bersyukurlah kepada-Nya
  rationale: Dalam konteks ibadah, bentuk Hifil dari ידה lazim menyatakan pemberian syukur. Bentuk perintah dan sasaran tindakan dipertahankan.
- source_word: בָּרֲכוּ
  choice: berkatilah
  rationale: Bentuk perintah jamak dari ברך. “Berkatilah” mempertahankan pembedaan leksikal dari תְּהִלָּה dan bahasa ibadah Ibrani, meskipun dalam bahasa Indonesia ungkapan ini kurang lazim daripada “pujilah”.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Terjemahan langsung yang mempertahankan ungkapan Ibrani tentang nama Allah sebagai penyataan identitas dan kemasyhuran-Nya.
theological_decisions:
- issue: Gambaran kultis gerbang dan pelataran
  choice: Mempertahankan gambaran harfiah “gerbang-gerbang-Nya” dan “pelataran-pelataran-Nya”.
  alternative: Menggeneralisasikannya menjadi “hadirat-Nya” atau “rumah-Nya”.
  rationale: Teks Ibrani secara nyata menggambarkan umat memasuki kawasan ibadah. Mempertahankan gambaran tersebut menghindari penyisipan abstraksi teologis yang tidak disebutkan dalam ayat.
- issue: Manusia diperintahkan memberkati nama Allah
  choice: Menerjemahkan ברך dengan “berkatilah” untuk mempertahankan ungkapan dan ketegangan teologis teks sumber.
  alternative: Menerjemahkannya secara interpretatif sebagai “pujilah” atau “agungkanlah”.
  rationale: Dalam bahasa ibadah Ibrani, ברך dapat diarahkan kepada Allah tanpa menyiratkan bahwa manusia menganugerahkan berkat kepada-Nya. Terjemahan harfiah mempertahankan pilihan kata sumber dan membedakannya dari kata “pujian” sebelumnya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bernada khidmat. Struktur paralel puisi dipertahankan. Bentuk ulang menandai jamak Ibrani pada gerbang dan pelataran; kapital pada enklitik -Nya mengikuti kebiasaan penulisan rujukan kepada Allah.
