  text: דְּע֗וּ כִּֽי יְהוָה֮ ה֤וּא אֱלֹ֫הִ֥ים הֽוּא עָ֭שָׂ/נוּ ו/לא אֲנַ֑חְנוּ עַ֝מּ֗/וֹ וְ/צֹ֣אן מַרְעִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: id
  text: Ketahuilah bahwa Yahweh, Dialah Allah. Dialah yang menjadikan kita, bukan kita sendiri[a]; kita adalah umat-Nya dan domba-domba di padang rumput-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut bacaan marginal tradisional: “Dialah yang menjadikan kita, dan kita adalah milik-Nya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: Ketahuilah
  rationale: Bentuk imperatif jamak dari ידע menyerukan agar para pendengar mengakui hal ini sebagai kebenaran yang pasti. “Ketahuilah” alami, ringkas, dan sesuai dengan seruan mazmur.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang harus diketahui; “bahwa” paling alami dalam susunan kalimat bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הוּא אֱלֹהִים
  choice: Yahweh adalah Allah
  rationale: Pronomina הוּא memberi penegasan. Dalam bahasa Indonesia, penegasan tersebut tersampaikan secara wajar melalui pernyataan langsung ini tanpa menambahkan kata “satu-satunya”, yang tidak tersurat.
- source_word: הוּא עָשָׂנוּ
  choice: Dialah yang menjadikan kita
  rationale: “Dialah” mempertahankan penekanan pronomina הוּא, sedangkan “menjadikan” mencakup tindakan Allah membentuk atau menciptakan umat-Nya.
- source_word: וְלֹא אֲנַחְנוּ
  choice: bukan kita sendiri
  rationale: Mengikuti teks tertulis (ketiv) לא, yang menyatakan bahwa bukan kita yang menjadikan diri kita sendiri. Bacaan qere לו dipertahankan dalam catatan kaki.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Padanan baku dan alami bagi sebutan perjanjian tentang umat yang menjadi milik Allah.
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: dan kawanan domba di padang rumput-Nya
  rationale: “Kawanan domba” menyampaikan makna kolektif צֹאן, sementara “di padang rumput-Nya” mempertahankan gambaran pastoral secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bacaan ketiv/qere pada וְלֹא אֲנַחְנוּ
  choice: 'Teks utama mengikuti ketiv: “Dialah yang menjadikan kita, bukan kita sendiri.”'
  alternative: 'Mengikuti qere tradisional: “Dialah yang menjadikan kita, dan kita adalah milik-Nya.”'
  rationale: Teks konsonantal לא berarti “bukan/tidak”, sedangkan bacaan marginal tradisional לו berarti “milik-Nya”. Keduanya kuno dan masuk akal dalam konteks. Keutamaan bukti teks tertulis mendukung ketiv dalam teks utama, sementara qere dicatat agar varian penting ini tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Allah digunakan sesuai kebiasaan penerbitan Alkitab berbahasa Indonesia. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan menjelaskan bacaan alternatif dalam klausa sebelumnya.
