source:
  edition: WLC
  text: כִּי ט֣וֹב יְ֭הֹוָה לְ/עוֹלָ֣ם חַסְדּ֑/וֹ וְ/עַד דֹּ֥ר וָ֝/דֹ֗ר אֱמוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: id
  text: Sebab Yahweh itu baik; kasih setia-Nya untuk selama-lamanya, dan kesetiaan-Nya tetap ada dari generasi ke generasi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ajakan beribadah dalam ayat-ayat sebelumnya; “sebab” mempertahankan fungsi penjelasnya secara alami dalam bahasa Indonesia.
- source_word: טוֹב
  choice: baik
  rationale: Mencakup kebaikan moral sekaligus kemurahan yang mendatangkan kebaikan; “baik” adalah padanan paling langsung dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyatakan durasi yang tidak berakhir dan menjadi keterangan bagi kasih setia Yahweh.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: Ungkapan ini secara alami memadukan kasih, kemurahan, dan kesetiaan yang teguh tanpa mempersempitnya hanya pada satu nuansa.
- source_word: וְעַד דֹּר וָדֹר
  choice: dan ... tetap turun-temurun
  rationale: Frasa Ibrani menyatakan keberlangsungan melintasi generasi demi generasi. “Tetap turun-temurun” menyampaikan makna duratif dan paralelismenya dengan “untuk selama-lamanya” dalam bahasa Indonesia yang wajar.
- source_word: אֱמוּנָתוֹ
  choice: kesetiaan-Nya
  rationale: Menunjukkan keteguhan, keterandalan, dan kesetiaan Yahweh; padanan ini paling alami dalam kesejajaran dengan kasih setia-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk “Yahweh” mempertahankannya sebagai nama diri.
- issue: Cakupan makna חֶסֶד
  choice: kasih setia
  alternative: belas kasih; kesetiaan perjanjian
  rationale: “Kasih setia” menjaga unsur kasih, kemurahan, dan loyalitas yang teguh tanpa memasukkan rumusan teologis yang terlalu sempit.
- issue: Elipsis verba pada klausa terakhir
  choice: menambahkan “tetap”
  alternative: dan kesetiaan-Nya turun-temurun
  rationale: Bahasa Ibrani tidak mengulang verba, tetapi hubungan paralel dengan לְעוֹלָם menyatakan keberlangsungan. “Tetap” membuat makna itu alami dalam bahasa Indonesia tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur puitis dua klausa dipertahankan, dengan paralelisme temporal yang alami bagi pembaca umum.
