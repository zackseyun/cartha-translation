  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/תוֹדָ֑ה הָרִ֥יעוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/001.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: id
  text: 'Mazmur untuk ucapan syukur[a].


    Bersoraklah kepada Yahweh, hai seluruh bumi!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini juga dapat diterjemahkan “Mazmur untuk kurban syukur” atau “Mazmur ucapan syukur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Dalam judul kitab Mazmur, kata ini lazim menunjuk pada nyanyian yang diiringi musik; “mazmur” adalah padanan Indonesia yang tepat dan sudah dikenal luas.
- source_word: לְתוֹדָה
  choice: untuk ucapan syukur
  rationale: Kata תּוֹדָה dapat berarti ucapan syukur, pujian syukur, atau kurban syukur. Pilihan ini alami sebagai judul dan tidak mempersempit maknanya secara tidak perlu kepada konteks kurban.
- source_word: הָרִיעוּ
  choice: Bersoraklah
  rationale: Bentuk perintah ini menyerukan pekik atau aklamasi yang lantang. “Bersoraklah” menyampaikan tindakan vokal dan suasana sukacita dengan ringkas dan alami.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi לְ menandai pihak yang menjadi tujuan sorak, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: כָּל־הָאָרֶץ
  choice: hai seluruh bumi
  rationale: אָרֶץ dapat berarti negeri atau bumi. Dalam seruan universal ini, “seluruh bumi” paling sesuai; “hai” menandai bahwa frasa tersebut disapa langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan כָּל־הָאָרֶץ
  choice: seluruh bumi
  alternative: seluruh negeri
  rationale: Konteks mazmur merupakan panggilan luas untuk beribadah; karena itu, makna universal dipertahankan tanpa membatasinya pada suatu wilayah tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “Bersoraklah kepada Yahweh, hai seluruh bumi” mempertahankan bentuk perintah serta sapaan universal teks Ibrani, sedangkan catatan kaki menjaga ambiguitas judul.
