id: PSA.100.2
reference: Psalms 100:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/שִׂמְחָ֑ה בֹּ֥אוּ לְ֝/פָנָ֗י/ו בִּ/רְנָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/002.yaml
  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: id
  text: Mengabdilah kepada Yahweh dengan sukacita; datanglah ke hadapan-Nya dengan sorak-sorai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan nyanyian sukacita.” Istilah Ibraninya dapat berarti pujian gembira yang diserukan maupun dinyanyikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Mengabdilah kepada
  rationale: Bentuk perintah jamak dari עבד menyatakan pelayanan yang penuh bakti kepada Yahweh. “Mengabdilah kepada” mempertahankan cakupan pelayanan dan ketaatan tanpa membatasinya hanya pada tindakan liturgis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בְּשִׂמְחָה
  choice: dengan sukacita
  rationale: Preposisi בְּ menyatakan cara atau keadaan; “dengan sukacita” merupakan ungkapan Indonesia yang alami untuk pelayanan yang dilakukan dengan kegembiraan.
- source_word: בֹּאוּ
  choice: datanglah
  rationale: Bentuk perintah jamak dari בוא diterjemahkan secara langsung tanpa menambahkan gagasan memasuki tempat kudus yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: לְפָנָיו
  choice: ke hadapan-Nya
  rationale: Ungkapan ini secara harfiah menunjuk gerak menuju wajah atau hadirat-Nya. “Ke hadapan-Nya” alami dalam bahasa Indonesia dan mempertahankan dimensi relasional serta spasialnya.
- source_word: בִּרְנָנָה
  choice: dengan sorak-sorai
  rationale: רננה dapat menunjuk seruan nyaring yang penuh kegembiraan atau nyanyian kemenangan. “Sorak-sorai” mempertahankan sifat vokal dan meluap-luapnya tanpa memastikan bahwa ungkapan itu hanya diteriakkan atau hanya dinyanyikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dalam teks sumber, alih-alih menggantinya dengan gelar “TUHAN”; bentuk “Yehuwa” merupakan alternatif tradisional, tetapi kurang mencerminkan rekonstruksi pelafalan yang umum diterima.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mengabdilah kepada” dipilih agar makna pelayanan penuh bakti tetap luas; “sorak-sorai” menyampaikan pujian vokal yang riang. Kapitalisasi “-Nya” mengikuti kebiasaan ejaan religius Indonesia untuk rujukan kepada Allah.
