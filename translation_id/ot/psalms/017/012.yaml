  text: He is like a lion eager to tear[c][b][a], like a young lion sitting in hiding places.
translation:
  language: id
  text: Ia seperti singa yang ingin mencabik-cabik, seperti singa muda yang duduk[a] di tempat-tempat persembunyian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti singa muda yang mengendap di tempat-tempat persembunyian.” Kata Ibrani yang diterjemahkan “duduk” dalam konteks ini dapat menggambarkan tindakan menunggu untuk menyergap.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְיֹנוֹ כְּאַרְיֵה
  choice: Ia seperti singa
  rationale: Ungkapan nominal harfiah 'keserupaannya seperti singa' akan terasa janggal dan berulang dalam bahasa Indonesia. Perbandingan langsung menyampaikan maksud Ibrani secara alami.
- source_word: יִכְסוֹף לִטְרוֹף
  choice: yang ingin menerkam
  rationale: כסף menyatakan hasrat kuat, sedangkan טרף dalam gambaran binatang buas menunjuk tindakan mencabik atau menangkap mangsa. 'Ingin menerkam' alami dalam konteks singa dan tetap mempertahankan dorongan predatorisnya.
- source_word: וְכִכְפִיר
  choice: seperti singa muda
  rationale: כפיר berarti singa muda; konjungsi dan partikel perbandingan membentuk perbandingan sejajar yang dapat disampaikan secara wajar tanpa menerjemahkan ו secara tersendiri.
- source_word: יֹשֵׁב
  choice: yang duduk
  rationale: Partisip ini secara harfiah berarti 'duduk' atau 'tinggal'. Terjemahan 'duduk' mempertahankan citra Ibrani, sementara konteks tempat persembunyian menyiratkan penyergapan.
- source_word: בְּמִסְתָּרִים
  choice: di tempat-tempat persembunyian
  rationale: Bentuk jamak menunjuk lokasi-lokasi tersembunyi. Pilihan ini mempertahankan nuansa jamak dan mudah dipahami pembaca modern.
