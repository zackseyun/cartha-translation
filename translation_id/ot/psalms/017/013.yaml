id: PSA.17.13
reference: Psalms 17:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה קַדְּמָ֣/ה פָ֭נָי/ו הַכְרִיעֵ֑/הוּ פַּלְּטָ֥/ה נַ֝פְשִׁ֗/י מֵ/רָשָׁ֥ע חַרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: id
  text: Bangkitlah, ya Yahweh! Hadapilah dia, tundukkanlah dia! Selamatkanlah nyawaku[a] dari orang fasik dengan pedang-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani nefesy; dapat berarti “jiwa”, “hidup”, atau “diri”. Dalam konteks ancaman maut ini, yang dimaksud kemungkinan besar adalah nyawa atau hidup pemazmur.
    reason: lexical_alternative
  - marker: b
    text: Atau, “selamatkanlah nyawaku dari orang fasik, pedang-Mu.” Susunan bahasa Ibrani juga dapat menggambarkan orang fasik sebagai pedang, yaitu alat dalam tangan Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Bangkitlah
  rationale: Bentuk imperatif dari קום yang menyampaikan seruan mendesak kepada Allah dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: קַדְּמָה פָנָיו
  choice: Hadapilah dia
  rationale: Ungkapan harfiahnya berkaitan dengan mendatangi atau berada di depan wajahnya; dalam konteks permusuhan, maknanya adalah menghadapi atau menentang lawan secara langsung.
- source_word: הַכְרִיעֵהוּ
  choice: tundukkanlah dia
  rationale: Bentuk kausatif dari כרע berarti membuat lawan membungkuk, bertekuk lutut, atau menjadi rendah. 'Tundukkanlah dia' mempertahankan daya bela diri dan cakupan maknanya.
- source_word: פַּלְּטָה
  choice: Selamatkanlah
  rationale: Imperatif פלט menyatakan tindakan melepaskan atau menyelamatkan seseorang dari bahaya.
- source_word: נַפְשִׁי
  choice: nyawaku
  rationale: Dalam konteks ancaman maut, נֶפֶשׁ menunjuk pada hidup atau diri orang itu, bukan secara khusus jiwa yang tak berwujud.
- source_word: מֵרָשָׁע
  choice: dari orang fasik
  rationale: Bentuk tunggal רָשָׁע menunjuk pada lawan yang jahat atau fasik; 'orang fasik' mempertahankan bentuk personal tunggal dan register mazmur.
- source_word: חַרְבֶּךָ
  choice: dengan pedang-Mu
  rationale: 'Frasa ini dipahami secara instrumental: Yahweh menyelamatkan pemazmur dengan pedang-Nya. Gambaran perang dalam teks tetap dipertahankan.'
theological_decisions:
- issue: Hubungan חַרְבֶּךָ ('pedang-Mu') dengan מֵרָשָׁע ('dari orang fasik')
  choice: Pedang Yahweh adalah sarana yang dipakai-Nya untuk menyelamatkan pemazmur dari orang fasik.
  alternative: Orang fasik itu sendiri disebut 'pedang-Mu', yakni alat dalam tangan Yahweh.
  rationale: Susunan Ibrani yang padat memungkinkan pembacaan instrumental maupun aposisional. Teks utama memakai pembacaan instrumental yang sesuai dengan rangkaian permohonan agar Yahweh bertindak, sedangkan pembacaan aposisional dipertahankan dalam catatan kaki agar ketegangan mengenai perantaraan dan kedaulatan ilahi tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang mendesak dan bermartabat. Imperatif berakhiran -lah mempertahankan bentuk seruan mazmur; tanda seru membagi permohonan menjadi dua gerak yang kuat. Nama Yahweh dipertahankan, dan kapitalisasi pada pronomina posesif ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
