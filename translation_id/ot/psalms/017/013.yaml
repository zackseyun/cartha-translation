  terminology: 'Yahweh konsisten dengan kebijakan nama ilahi yang diberikan. ''Orang fasik'', ''nyawaku'', dan ''pedang-Mu'' merupakan pilihan istilah yang jelas dan sesuai konteks. Penanda catatan kaki telah ditempatkan dengan tepat: [a] pada ''nyawaku'' untuk isu נֶפֶשׁ dan [b] pada ''pedang-Mu'' untuk ambiguitas sintaksis frasa terakhir.'
