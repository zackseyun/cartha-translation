  text: They have now surrounded our steps[c][b][a]; they set their eyes to cast us down to the ground.
translation:
  language: id
  text: 'Jejak langkah kami—kini mereka mengepung aku[a];

    mereka mengarahkan mata mereka untuk menjatuhkan aku ke tanah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi kurang lebih, “Jejak langkah kami—kini mereka mengepung aku.” Susunannya sulit dan beralih dari “kami” ke “aku”; sebagian terjemahan menyelaraskannya menjadi “mereka mengepung jejak langkah kami.”
    reason: textual_variant
  - marker: b
    text: Atau, “mereka mengarahkan mata mereka untuk menundukkan aku hingga ke tanah.” Objek “aku” tidak dinyatakan dalam frasa Ibrani ini, tetapi tersirat dari baris sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: jejak langkah kami
  rationale: Nomina ini menunjuk pada langkah atau jejak kaki. “Jejak langkah kami” mempertahankan gambaran gerak yang sedang dibatasi para musuh dan cocok diletakkan sebagai unsur pendahulu dalam susunan Ibrani yang tidak biasa.
- source_word: עַתָּה
  choice: kini
  rationale: Adverbia waktu ini menandai bahwa pengepungan merupakan krisis yang sedang berlangsung; “kini” ringkas, wajar, dan puitis.
- source_word: סבבוני
  choice: mereka mengepung aku
  rationale: Verba ini berarti mengelilingi atau mengepung, dan sufiksnya secara eksplisit adalah orang pertama tunggal, “aku”. Terjemahan mempertahankan peralihan dari “kami” pada frasa sebelumnya ke “aku” dalam verba.
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: mata mereka arahkan
  rationale: שׁית berarti menaruh, menetapkan, atau mengarahkan. Ungkapan ini mempertahankan gambaran mata yang sengaja dipusatkan pada sasaran, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: לִנְטוֹת
  choice: untuk menjatuhkan aku
  rationale: נטה pada dasarnya dapat berarti membentangkan, memiringkan, membungkukkan, atau membuat condong. Dalam konteks serangan dan frasa “ke tanah”, ungkapan ini paling wajar dipahami sebagai maksud untuk membuat pemazmur jatuh; objek “aku” tersirat dari baris sebelumnya.
- source_word: בָּאָרֶץ
  choice: ke tanah
  rationale: Di sini אֶרֶץ paling mungkin menunjuk pada tanah sebagai permukaan tempat korban dijatuhkan, bukan pada suatu negeri atau wilayah.
theological_decisions:
- issue: Peralihan orang dari “kami” ke “aku”
  choice: 'Peralihan dipertahankan dalam teks utama: “jejak langkah kami ... mengepung aku”.'
  alternative: Menyelaraskan seluruh baris menjadi bentuk jamak, misalnya “mengepung jejak langkah kami” atau “mengepung kami”.
  rationale: Teks Masoret secara nyata memiliki sufiks jamak pada אַשֻּׁרֵינוּ, “langkah kami”, tetapi sufiks tunggal pada סבבוני, “mengepung aku”. Menyelaraskannya akan menghapus ketegangan gramatikal dan kemungkinan pergeseran puitis antara kelompok dan pemazmur sebagai individu.
translation_notes:
  register: Bahasa Indonesia modern yang puitis namun mudah dipahami. Tanda pisah mempertahankan unsur pembuka yang menggantung dalam bahasa Ibrani tanpa memaksakan hubungan sintaksis yang tidak pasti. Bentuk “aku” dipakai sesuai suara pribadi pemazmur dan peralihan pronomina sumber.
