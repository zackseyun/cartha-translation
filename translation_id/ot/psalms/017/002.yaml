  text: מִ֭/לְּ/פָנֶי/ךָ מִשְׁפָּטִ֣/י יֵצֵ֑א עֵ֝ינֶ֗י/ךָ תֶּחֱזֶ֥ינָה מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: id
  text: Kiranya putusan atas perkaraku keluar dari hadapan-Mu[a]; kiranya mata-Mu memandang apa yang lurus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kiranya pembenaranku keluar dari hadirat-Mu.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “keadilan” atau “apa yang benar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: dari hadapan-Mu
  rationale: 'Ungkapan ini mempertahankan gambaran spasial dan ruang pengadilan: putusan bergerak keluar dari hadapan atau hadirat Allah.'
- source_word: מִשְׁפָּטִי
  choice: putusan atas perkaraku
  rationale: מִשְׁפָּטִי dapat menunjuk pada keputusan hukum, keadilan, pembenaran, atau perkara si pemazmur. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa yudisial tanpa langsung menganggap bahwa putusannya pasti menguntungkan.
- source_word: יֵצֵא
  choice: datang
  rationale: Secara harfiah verba ini berarti ‘keluar’ atau ‘pergi ke luar’. Dengan frasa asal ‘dari hadapan-Mu’, ‘datang’ menyampaikan gerak keluarnya putusan secara lebih alami dalam bahasa Indonesia.
- source_word: עֵינֶיךָ
  choice: mata-Mu
  rationale: Bentuk konkret dan antropomorfis dalam bahasa Ibrani dipertahankan, alih-alih diratakan menjadi sekadar ‘Engkau’.
- source_word: תֶּחֱזֶינָה
  choice: memandang
  rationale: Kata ini menyatakan tindakan melihat atau memperhatikan. ‘Memandang’ bernada puitis dan bermartabat, tetapi tetap mudah dipahami.
- source_word: מֵישָׁרִים
  choice: apa yang lurus
  rationale: Bentuk jamak ini dapat berarti kelurusan, keadilan, atau hal yang benar. ‘Apa yang lurus’ mempertahankan citra dasar sekaligus nuansa moral-yudisialnya.
theological_decisions:
- issue: Apakah bentuk-bentuk imperfek diterjemahkan sebagai pernyataan masa depan atau permohonan
  choice: 'Permohonan: ‘Kiranya ... datang; kiranya ... memandang’'
  alternative: 'Pernyataan: ‘Putusan ... datang; mata-Mu memandang ...’'
  rationale: Dalam konteks doa, kedua imperfek wajar dipahami dengan daya jusif sebagai permohonan. ‘Kiranya’ mempertahankan sifat permohonan tanpa menjadikannya perintah langsung kepada Allah.
- issue: Apakah מִשְׁפָּטִי secara eksplisit diterjemahkan sebagai pembenaran
  choice: putusan atas perkaraku
  alternative: pembenaranku
  rationale: ‘Pembenaranku’ mungkin sesuai dengan konteks, tetapi lebih dahulu menentukan bahwa hasil putusan menguntungkan pemazmur. Terjemahan utama mempertahankan cakupan yudisial dan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Paralelisme dua klausa dan gambaran konkret ‘mata-Mu’ dipertahankan.
