  text: שָׁ֭מְרֵ/נִי כְּ/אִישׁ֣וֹן בַּת עָ֑יִן בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ תַּסְתִּירֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/008.yaml
  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: id
  text: Jagalah aku seperti pupil mata[a]; sembunyikanlah aku dalam naungan sayap-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “biji mata.”'
    reason: Alternatif idiomatis yang lazim dalam bahasa Indonesia untuk bagian mata yang sangat dijaga.
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Jagalah aku
  rationale: Kata kerja שׁמר menyatakan tindakan menjaga atau mengawasi. “Jagalah aku” mempertahankan bentuk permohonan langsung dan tidak mempersempit perlindungan yang dimaksud.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: seperti pupil mata
  rationale: Ungkapan Ibrani ini menunjuk pada pupil, bagian mata yang peka dan dijaga dengan cermat. “Pupil mata” menyampaikan acuannya secara jelas dalam bahasa Indonesia modern, sedangkan ungkapan lazim “biji mata” dicantumkan sebagai alternatif.
- source_word: בְּצֵל
  choice: dalam naungan
  rationale: צֵל dapat berarti bayang-bayang atau tempat teduh. Dalam gambaran perlindungan oleh sayap, “naungan” terdengar alami dan tetap mempertahankan citra perlindungan yang konkret.
- source_word: כְּנָפֶיךָ
  choice: sayap-Mu
  rationale: Terjemahan langsung ini mempertahankan metafora puitis tentang perlindungan ilahi tanpa menggantinya dengan penjelasan abstrak.
- source_word: תַּסְתִּירֵנִי
  choice: sembunyikanlah aku
  rationale: Bentuk Hifil dari סתר berarti menyembunyikan atau membuat tersembunyi. “Sembunyikanlah aku” menerjemahkan kata kerja tersebut secara langsung dan mempertahankan daya hidup gambarnya.
theological_decisions:
- issue: Pengungkapan kiasan tentang bagian mata yang dilindungi
  choice: Menerjemahkan acuannya secara jelas sebagai “pupil mata”.
  alternative: “biji mata”
  rationale: Teks memakai gambaran tentang bagian mata yang peka dan dijaga dengan saksama, bukan sedang menetapkan suatu rumusan doktrinal. Pilihan utama dibuat transparan bagi pembaca modern, sementara ungkapan Indonesia yang lebih tradisional dipertahankan dalam catatan kaki.
- issue: Mempertahankan gambaran sayap
  choice: Mempertahankan “sayap-Mu” sebagai metafora perlindungan ilahi.
  alternative: Menguraikannya menjadi “perlindungan-Mu” atau “pemeliharaan-Mu”.
  rationale: Bahasa Ibrani memakai gambaran puitis yang konkret. Mempertahankannya menjaga tekstur sastra dan ketegangan metaforis teks tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa doa yang modern, ringkas, dan khidmat. Partikel “-lah” mempertahankan nuansa permohonan; kapitalisasi “-Mu” mengikuti kebiasaan bahasa Indonesia untuk sapaan kepada Allah.
