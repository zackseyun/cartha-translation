base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/004.yaml
  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
translation:
  language: id
  text: Mengenai perbuatan manusia, dengan firman dari bibir-Mu aku telah menjaga diri dari jalan-jalan orang yang melakukan kekerasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “aku telah menjaga jalan-jalan orang yang melakukan kekerasan.” Kata Ibrani yang diterjemahkan “menjaga diri dari” juga dapat berarti “mengamati” atau “mengawasi jalan-jalan orang yang melakukan kekerasan,” tetapi konteks lebih mendukung pengertian bahwa pemazmur menjauhi jalan-jalan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: Mengenai perbuatan manusia
  rationale: Prefiks לְ dipahami sebagai penanda topik atau lingkup. Bentuk tunggal generik אָדָם merujuk kepada manusia secara umum, bukan seorang tertentu.
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: dengan firman dari bibir-Mu
  rationale: בְּ menyatakan sarana atau pedoman. Ungkapan puitis tentang bibir Allah dipertahankan, sementara kata 'dari' membuat hubungan antarkata wajar dalam bahasa Indonesia.
- source_word: שָׁמַרְתִּי
  choice: aku telah menjaga diri dari
  rationale: Dalam konteks pengakuan integritas, שׁמר paling mungkin menyatakan tindakan menahan atau menjauhkan diri. Unsur 'diri dari' dibuat tersurat agar maksudnya alami dalam bahasa Indonesia, sementara kemungkinan arti lain dicatat dalam catatan kaki.
- source_word: אָרְחוֹת
  choice: jalan-jalan
  rationale: Terjemahan ini mempertahankan metafora mengenai arah hidup atau pola perilaku serta bentuk jamaknya.
- source_word: פָּרִיץ
  choice: orang yang melakukan kekerasan
  rationale: Kata ini menunjuk kepada orang yang keras, bengis, atau menggunakan kekerasan. Frasa ini jelas bagi pembaca modern dan tidak menguranginya menjadi sekadar 'orang berdosa'.
theological_decisions:
- issue: Makna klausa dengan שָׁמַרְתִּי
  choice: Pemazmur menyatakan bahwa firman Allah membuatnya menjaga diri dari jalan hidup orang yang melakukan kekerasan.
  alternative: Pemazmur menyatakan bahwa ia mengamati atau memperhatikan jalan-jalan orang yang melakukan kekerasan.
  rationale: שׁמר dapat berarti menjaga, menaati, atau mengamati. Konteks pengakuan integritas dan frasa tentang firman Allah lebih mendukung makna menghindari atau menahan diri, tetapi ambiguitas leksikalnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapital pada pronomina ilahi mengikuti gaya terbitan yang diminta; metafora 'bibir-Mu' dipertahankan tanpa menjadikannya ungkapan prosa biasa.
