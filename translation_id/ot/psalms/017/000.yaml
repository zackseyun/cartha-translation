    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Doa Daud
  rationale: Judul ini secara alami menyatakan bahwa mazmur tersebut adalah doa yang berkaitan dengan atau berasal dari Daud, tanpa memperluas maknanya.
- source_word: צֶדֶק
  choice: perkara yang adil
  rationale: Nomina ini dapat berarti kebenaran, keadilan, atau perkara yang benar. Dalam konteks permohonan agar didengar, ungkapan ini paling wajar menunjuk pada perkara atau gugatan pemazmur yang adil, sementara alternatif harfiahnya dipertahankan dalam catatan kaki.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal untuk Nama ilahi tetragramaton, dengan huruf kapital sebagai penanda.
- source_word: רִנָּתִי
  choice: seruanku
  rationale: Dalam konteks doa, kata ini menunjuk pada seruan nyaring atau permohonan, bukan terutama nyanyian sukacita.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: yang keluar dari bibir tanpa tipu daya
  rationale: Frasa Ibrani yang padat dijadikan kalimat Indonesia alami; frasa ini menerangkan sumber doa dan menegaskan ketulusan ucapan pemazmur.
theological_decisions:
- issue: Apakah צֶדֶק menyatakan kebenaran abstrak atau perkara pemazmur yang adil
  choice: perkara yang adil
  alternative: kebenaran; keadilan
  rationale: Konteks yudisial permohonan untuk didengar mendukung rujukan kepada perkara yang adil, tetapi keluwesan semantis teks Ibrani tetap dinyatakan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Bentuk imperatif dengan -lah mempertahankan nada doa. Paralelisme tiga permohonan dipertahankan, sedangkan susunan akhir dibuat alami dalam bahasa Indonesia.
