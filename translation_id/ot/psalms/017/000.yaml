  text: Doa Daud. Dengarlah perkara yang adil[a], ya TUHAN; perhatikanlah seruanku; berilah telinga kepada doaku yang keluar dari bibir tanpa tipu daya.
  philosophy: optimal-equivalence
  footnotes:
