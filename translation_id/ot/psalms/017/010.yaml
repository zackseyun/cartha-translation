translation:
  language: id
  text: Mereka menutup rapat hati mereka yang berlemak[a]; mulut mereka berbicara dengan congkak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Mereka menutup lemak mereka.” Dalam ungkapan puitis Ibrani, “lemak” kemungkinan menggambarkan batin yang tidak peka atau puas diri. Dalam bahasa Indonesia, maknanya dapat diungkapkan sebagai hati yang tumpul atau keras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: hati mereka yang berlemak
  rationale: Secara harfiah berarti 'lemak mereka'. Dalam puisi Ibrani, lemak dapat menjadi gambaran ketidakpekaan atau kepuasan diri. Kata 'hati' ditambahkan sebagai unsur tersirat agar metafora dapat dipahami tanpa menggantinya dengan tafsiran abstrak.
- source_word: סָּגְרוּ
  choice: menutup
  rationale: Menerjemahkan makna dasar verba 'menutup' dan mempertahankan gambaran sesuatu yang dibuat tertutup atau tidak tanggap.
- source_word: פִּימוֹ
  choice: mulut mereka
  rationale: Bentuk Ibrani secara morfologis tunggal dengan akhiran jamak; bahasa Indonesia secara alami dapat mempertahankan ungkapan kolektif 'mulut mereka'.
- source_word: דִּבְּרוּ
  choice: mereka berbicara
  rationale: Bentuk perfektif dalam konteks puisi ini menggambarkan perilaku khas atau berkelanjutan, sehingga kala kini netral dalam bahasa Indonesia sesuai.
- source_word: בְגֵאוּת
  choice: dengan congkak
  rationale: Menunjukkan cara berbicara yang penuh kesombongan; ungkapan ini alami, jelas, dan mempertahankan penilaian moral negatif dari kata Ibrani.
