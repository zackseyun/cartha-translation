reference: Psalms 17:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: id
  text: dari orang-orang, oleh tangan-Mu[a], ya Yahweh, dari orang-orang dunia ini, yang bagiannya ada dalam hidup ini. Engkau memenuhi perut mereka dengan simpanan-Mu; mereka puas dengan anak-anak lelaki[b], dan mereka meninggalkan kelimpahan mereka kepada anak-anak mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari orang-orang, dengan tangan-Mu” atau “dari orang-orang tangan-Mu.” Susunan bahasa Ibrani ini padat dan dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
  - marker: b
    text: 'Bahasa Ibrani: “anak-anak lelaki.” Susunannya juga dapat diterjemahkan, “anak-anak lelaki mereka menjadi kenyang.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih khusus: “anak-anak kecil mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים
  choice: dari orang-orang
  rationale: Dalam konteks, frasa ini sejajar dengan “orang-orang dunia” dan menunjuk kepada para lawan manusia, bukan orang mati. Kata depan מִן dipahami melanjutkan permohonan agar dilepaskan dari ayat sebelumnya.
- source_word: יָדְךָ
  choice: melalui tangan-Mu
  rationale: Ungkapan ini dapat menyatakan sarana atau perantaraan tindakan Allah. Pilihan ini tetap cukup terbuka karena susunan Ibraninya padat dan dapat dipahami dengan beberapa cara.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi “Yahweh,” sedangkan “ya” menandai sapaan langsung secara wajar dalam bahasa Indonesia.
- source_word: מֵחֶלֶד
  choice: dari orang-orang dunia
  rationale: חֶלֶד di sini menunjuk pada ranah kehidupan manusia yang fana atau dunia masa kini. Ungkapan ini mempertahankan kesejajaran dengan “orang-orang” pada awal ayat.
- source_word: חֶלְקָם בַּחַיִּים
  choice: yang bagiannya ada dalam hidup ini
  rationale: Terjemahan ini menyampaikan bahwa bagian mereka terletak pada kehidupan sekarang, sambil tidak membuat pernyataan lebih jauh mengenai nasib sesudah kematian.
- source_word: וּצְפוּנְךָ
  choice: dengan simpanan-Mu
  rationale: Kata ini merujuk pada sesuatu yang tersembunyi atau tersimpan. “Simpanan-Mu” mempertahankan gagasan persediaan yang Allah miliki tanpa membatasinya secara khusus pada kekayaan uang.
- source_word: תְּמַלֵּא בִטְנָם
  choice: Engkau memenuhi perut mereka
  rationale: בֶּטֶן dapat berarti perut, rahim, atau bagian dalam tubuh. Dalam konteks kepuasan dan kelimpahan, “perut” mempertahankan gambaran konkret bahasa Ibrani.
- source_word: יִשְׂבְּעוּ בָנִים
  choice: mereka dipuaskan dengan anak-anak lelaki
  rationale: Subjek verba dipahami sebagai orang-orang dunia tersebut, yang menikmati kepuasan berupa banyak keturunan. בָנִים secara khusus berbentuk maskulin jamak, sehingga nuansa “anak-anak lelaki” dipertahankan.
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: mereka meninggalkan kelimpahan mereka
  rationale: יֶתֶר berarti sisa, kelebihan, atau kelimpahan. Di sini ungkapan itu menunjuk pada kelebihan yang diwariskan kepada keturunan.
- source_word: לְעוֹלְלֵיהֶם
  choice: kepada anak-anak mereka
  rationale: עוֹלֵל secara lebih khusus berarti anak kecil. Dalam konteks pewarisan, “anak-anak mereka” terdengar alami, sedangkan nuansa usia dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Hubungan para lawan dengan tangan Allah
  choice: “melalui tangan-Mu” menyatakan bahwa pembebasan terjadi melalui tindakan Allah, tanpa menetapkan para lawan sebagai alat penghukuman-Nya.
  alternative: “dari orang-orang tangan-Mu” atau “dari orang-orang, dengan tangan-Mu”
  rationale: Sintaksis Ibrani sangat padat dan memungkinkan lebih dari satu hubungan antara “orang-orang” dan “tangan-Mu.” Terjemahan serta catatan kaki mempertahankan ketidakpastian itu.
- issue: Kemakmuran sementara orang-orang dunia
  choice: “bagian mereka ada dalam hidup ini” menonjolkan cakrawala kehidupan sekarang.
  alternative: “bagian mereka ada di antara orang-orang hidup” atau “bagian mereka adalah kehidupan”
  rationale: Konteks mendukung kontras temporal, tetapi ayat ini sendiri tidak menguraikan penghakiman masa depan; karena itu terjemahan tidak menambahkan kesimpulan eskatologis.
- issue: Subjek יִשְׂבְּעוּ dan fungsi בָנִים
  choice: 'Orang-orang dunia dipahami sebagai subjek: mereka dipuaskan dengan anak-anak lelaki.'
  alternative: “anak-anak lelaki mereka menjadi kenyang”
  rationale: Kedua unsur berbentuk jamak sehingga tata bahasa memungkinkan pembacaan alternatif. Pembacaan yang dipilih sesuai dengan rangkaian kemakmuran, tetapi ambiguitasnya layak diakui.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Struktur awal sengaja dibiarkan sebagai lanjutan permohonan dari ayat sebelumnya, sebagaimana bentuk ayat Ibraninya. Gambaran konkret “perut” dipertahankan, sementara istilah yang terlalu arkais dihindari.
