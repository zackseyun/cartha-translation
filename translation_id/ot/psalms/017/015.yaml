base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/015.yaml
  text: As for me[a], in righteousness I will behold your face; when I awake[b], I will be satisfied with your likeness.
translation:
  language: id
  text: Adapun aku, dalam kebenaran aku akan memandang wajah-Mu; ketika aku terbangun[a], aku akan merasa puas dengan rupa-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “ketika aku terbangun” dapat dipahami sebagai bangun dari tidur biasa, atau sebagai kebangkitan pada saat pembenaran akhir atau kebangkitan orang mati.
    reason: alternative_reading
  - marker: b
    text: Atau “wujud-Mu” atau “citra-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: dalam kebenaran
  rationale: Mempertahankan ungkapan Ibrani yang padat dan tidak menentukan apakah yang dimaksud ialah integritas pemazmur, tindakan pembenaran Allah, atau keadaan benar di hadapan-Nya.
- source_word: אֶחֱזֶה
  choice: aku akan memandang
  rationale: Kata חזה menyatakan penglihatan yang penuh perhatian atau penghayatan; “memandang” terdengar alami sekaligus lebih kuat daripada sekadar “melihat”.
- source_word: פָנֶיךָ
  choice: wajah-Mu
  rationale: Menerjemahkan gambaran konkret bahasa Ibrani secara langsung; makna yang diperluas sebagai “hadirat-Mu” tidak dimasukkan ke dalam teks utama.
- source_word: אֶשְׂבְּעָה
  choice: aku akan merasa puas
  rationale: Mengungkapkan makna qal שׂבע, yaitu menjadi kenyang atau puas, dalam bahasa Indonesia modern yang alami.
- source_word: בְּהָקִיץ
  choice: ketika aku terbangun
  rationale: Preposisi ב pada infinitif menandai waktu. Terjemahan ini mempertahankan ketidakjelasan apakah kebangkitan itu dari tidur biasa atau menunjuk kepada pemulihan terakhir.
- source_word: תְּמוּנָתֶךָ
  choice: rupa-Mu
  rationale: תְּמוּנָה dapat berarti rupa, wujud, atau citra. “Rupa-Mu” mempertahankan kekonkretan istilah tanpa secara tegas menyiratkan bentuk jasmani.
theological_decisions:
- issue: Apakah בְּהָקִיץ berarti bangun dari tidur biasa atau mengisyaratkan kebangkitan/pengharapan sesudah kematian
  choice: Teks utama memakai “ketika aku terbangun” tanpa menentukan jenis kebangkitan yang dimaksud.
  alternative: Bangun sehari-hari dari tidur; atau kebangkitan dalam pembenaran terakhir/kebangkitan orang mati.
  rationale: Frasa Ibraninya tidak menjelaskan hal itu secara tegas. Ambiguitas dan ketegangan teologisnya dipertahankan, sedangkan kemungkinan penafsirannya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Adapun aku” mempertahankan penekanan pada אֲנִי; pengulangan “aku” menjaga tekanan dan kesejajaran Ibrani. Kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab Indonesia.
