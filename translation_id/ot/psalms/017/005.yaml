translation:
  language: id
  text: Teguhkan langkahku di jalan-jalan-Mu[a][b], agar kakiku tidak tergelincir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Langkahku berpijak teguh di jalan-jalan-Mu”; bentuk Ibrani ini juga dapat dipahami sebagai pernyataan keteguhan.
    reason: alternative_reading
  - marker: b
    text: Atau, “di jalur-jalur-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמֹךְ
  choice: berpijak teguh
  rationale: Kata kerja תמך menyatakan tindakan memegang, menopang, atau bertahan dengan kukuh. Dalam metafora berjalan dan sejajar dengan klausa tentang tidak tergelincir, “berpijak teguh” menyampaikan keteguhan secara alami dalam bahasa Indonesia tanpa menghilangkan gambaran konkretnya.
- source_word: אֲשֻׁרַי
  choice: langkahku
  rationale: Nomina ini menunjuk pada langkah atau gerak perjalanan. “Langkahku” merupakan padanan Indonesia yang lugas dan mempertahankan metafora berjalan.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: pada jalan-Mu
  rationale: מַעְגָּל berarti jalur, lintasan, atau jalan yang dilalui. “Pada jalan-Mu” alami dalam konteks pijakan dan tetap mempertahankan gambaran tentang arah hidup yang ditetapkan Allah.
- source_word: בַּל
  choice: tidak
  rationale: Partikel negatif puitis ini paling langsung dan wajar diterjemahkan “tidak”.
- source_word: נָמֹטּוּ
  choice: tidak tergelincir
  rationale: מוט dapat berarti tergelincir, goyah, atau terhuyung. Bersama gambaran kaki, “tergelincir” merupakan ungkapan Indonesia yang jelas dan konkret.
- source_word: פְעָמָי
  choice: kakiku
  rationale: Kata ini dapat menunjuk pada langkah, tapak, atau gerak kaki. “Kakiku” sesuai dengan kolokasi “tidak tergelincir” dan menghasilkan paralelisme alami dengan “langkahku” pada baris pertama.
theological_decisions:
- issue: Apakah תָּמֹךְ merupakan pernyataan keteguhan atau permohonan agar Allah menopang langkah pemazmur
  choice: 'Diterjemahkan dalam teks utama sebagai pernyataan: “Langkahku berpijak teguh”'
  alternative: “Teguhkanlah langkahku di jalan-Mu” atau “Topanglah langkahku di jalan-Mu”
  rationale: Bentuk Ibraninya dapat dipahami sebagai pernyataan puitis ataupun permohonan. Paralel “kakiku tidak tergelincir” mendukung pembacaan sebagai pernyataan, tetapi ambiguitas yang nyata dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. “Berpijak teguh” dipilih agar metafora berjalan tetap konkret sekaligus terdengar alami; kapital pada “-Mu” mengikuti kebiasaan penulisan rujukan kepada Allah.
