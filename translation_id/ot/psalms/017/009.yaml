translation:
  language: id
  text: 'dari orang-orang fasik yang menghancurkan aku,

    dari musuh-musuhku yang mengancam nyawaku dan mengepung aku.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּנֵי
  choice: dari
  rationale: Dalam konteks permohonan perlindungan, frasa ini menunjukkan pihak yang darinya pemazmur ingin dilindungi. “Dari” alami dalam bahasa Indonesia dan tidak sekaku terjemahan harfiah “dari hadapan”.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk substantival jamak ini menunjuk kepada orang-orang yang bersalah secara moral. “Orang-orang fasik” mempertahankan kategori etisnya tanpa membatasi gender.
- source_word: זוּ
  choice: yang
  rationale: Partikel relatif ini menghubungkan “orang-orang fasik” dengan tindakan berikutnya; “yang” merupakan padanan Indonesia yang alami.
- source_word: שַׁדּוּנִי
  choice: yang menghancurkan aku
  rationale: Kata kerja שׁדד menyatakan tindakan keras yang merusak, merampas, atau menghancurkan. “Menghancurkan aku” mempertahankan daya ungkap yang kuat, sedangkan “menindas” terlalu lemah dan “menjarah aku” terlalu sempit.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung bagi kata benda jamak dengan akhiran orang pertama tunggal.
- source_word: בְּנֶפֶשׁ
  choice: yang mengincar nyawaku
  rationale: Ungkapan ini secara harfiah memuat נֶפֶשׁ, “jiwa/nyawa/kehidupan”. Dalam konteks ancaman, pilihan ini secara alami menyampaikan bahwa musuh-musuh itu memburu kehidupan pemazmur, sambil menandai adanya kemungkinan pemahaman lain dalam catatan kaki.
- source_word: יַקִּיפוּ עָלָי
  choice: mengepung aku
  rationale: Bentuk Hifil נקף dengan עַל menggambarkan tindakan mengelilingi atau mengepung seseorang. “Mengepung aku” jelas, hidup, dan sesuai dengan ancaman dalam konteks.
theological_decisions:
- issue: Hubungan בְּנֶפֶשׁ dengan ancaman para musuh
  choice: Dipahami sebagai musuh yang mengincar nyawa pemazmur.
  alternative: Dipahami sebagai keterangan intensitas, yakni musuh-musuh yang mengepung dengan segenap hasrat atau keganasan mereka.
  rationale: Konstruksi Ibrani ringkas dan dapat menunjuk pada nyawa pemazmur yang terancam atau pada dorongan kuat para musuh. Teks utama mempertahankan unsur “nyawa”, sedangkan catatan kaki menjaga ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Pengulangan “dari” mempertahankan hubungan sintaksis dengan permohonan perlindungan dalam konteks sebelumnya. Ungkapan “mengincar nyawaku” dipilih agar unsur נֶפֶשׁ tetap terdengar tanpa menghasilkan terjemahan harfiah yang kabur.
