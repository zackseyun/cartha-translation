  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: id
  text: 'Doa Daud.


    Dengarlah, ya Yahweh, perkaraku yang benar[a];

    perhatikanlah seruanku;

    simaklah doaku,

    yang terucap dari bibir tanpa tipu daya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dengarlah, ya Yahweh, kebenaran” atau “Dengarlah, ya Yahweh, keadilan.” Kata Ibrani צֶדֶק dapat berarti kebenaran, keadilan, atau perkara yang benar; di sini kemungkinan besar menunjuk pada perkara atau tuntutan pemazmur yang benar.
    reason: Alternatif leksikal bagi צֶדֶק dipertahankan tanpa menambahkan unsur psikologis yang tidak tersurat dalam teks.
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Doa Daud
  rationale: Dalam judul mazmur, לְ yang diikuti nama orang paling wajar menyatakan kepengarangan atau kaitan. Bentuk ringkas ini alami sebagai judul puisi dalam bahasa Indonesia.
- source_word: שִׁמְעָה
  choice: Dengarlah
  rationale: Bentuk perintah ini mempertahankan permohonan langsung kepada Allah dan membuka rangkaian tiga seruan agar Allah mendengarkan.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”; partikel “ya” menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: צֶדֶק
  choice: perkaraku yang benar
  rationale: Dalam konteks permohonan agar Allah mengadili, kata ini menunjuk pada perkara atau tuntutan yang benar, bukan sekadar sifat kebenaran yang abstrak. Unsur “-ku” menjelaskan hubungan yang tersirat dengan pemazmur.
- source_word: הַקְשִׁיבָה
  choice: perhatikanlah
  rationale: Bentuk kausatif dari קשׁב meminta perhatian yang sungguh-sungguh; “perhatikanlah” membedakannya dari dua kata kerja pendengaran lain dalam ayat ini.
- source_word: רִנָּתִי
  choice: seruanku
  rationale: Dalam konteks ratapan dan doa, kata ini menyatakan seruan nyaring atau mendesak, bukan sorak kegembiraan.
- source_word: הַאֲזִינָה
  choice: simaklah
  rationale: Kata ini berarti memasang telinga atau mendengarkan dengan saksama. “Simaklah” menyampaikan perhatian pendengaran secara alami tanpa ungkapan yang kaku.
- source_word: תְפִלָּתִי
  choice: doaku
  rationale: Padanan langsung ini juga mempertahankan hubungan leksikal dengan תְּפִלָּה dalam judul.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: yang terucap dari bibir tanpa tipu daya
  rationale: Frasa ini menggambarkan doa sebagai sesuatu yang berasal dari bibir yang bebas dari penipuan. “Terucap” membuat hubungan itu jelas dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri perjanjian secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna צֶדֶק sebagai objek kata “dengarlah”
  choice: perkaraku yang benar
  alternative: kebenaran atau keadilan
  rationale: Konstruksi ini dapat dibaca secara harfiah sebagai permohonan agar Allah “mendengar kebenaran/keadilan”. Dalam konteksnya, kemungkinan besar yang dimaksud ialah perkara benar yang diajukan pemazmur, tetapi alternatif harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan puitis. Tiga kata kerja pendengaran diterjemahkan secara bervariasi—“dengarlah”, “perhatikanlah”, dan “simaklah”—untuk mempertahankan paralelisme tanpa terdengar kaku. Penanda catatan kaki [a] ditempatkan pada kata yang berkaitan langsung dengan ambiguitas objek צֶדֶק.
