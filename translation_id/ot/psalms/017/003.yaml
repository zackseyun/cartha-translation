  text: בָּ֘חַ֤נְתָּ לִבִּ֨/י פָּ֘קַ֤דְתָּ לַּ֗יְלָה צְרַפְתַּ֥/נִי בַל תִּמְצָ֑א זַ֝מֹּתִ֗י בַּל יַעֲבָר פִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: id
  text: 'Engkau telah menyelidiki hatiku; Engkau mendatangiku pada malam hari; Engkau telah mengujiku dan tidak menemukan apa pun. Aku telah bertekad: mulutku tidak akan melampaui batas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bagian akhir teks Ibrani sangat ringkas. Secara lebih harfiah dapat diterjemahkan, “Aku telah bertekad; mulutku tidak akan melampaui,” yakni tidak akan melampaui batas dalam perkataan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: telah menyelidiki
  rationale: Kata kerja בחן menyatakan pemeriksaan atau pengujian terhadap watak batin. “Menyelidiki” berpadu alami dengan “hatiku” dan mempertahankan nuansa penilaian yang mendalam.
- source_word: לִבִּי
  choice: hatiku
  rationale: Dalam antropologi Ibrani, “hati” menunjuk pada batin, termasuk pikiran dan niat. Padanan langsung ini alami dan tidak perlu diperluas secara tafsiran.
- source_word: פָּקַדְתָּ
  choice: mendatangiku
  rationale: פקד dapat berarti mengunjungi, memperhatikan, atau memeriksa. “Mendatangiku” mempertahankan gambaran kunjungan ilahi, sedangkan konteks menjelaskan bahwa kunjungan itu mencakup pemeriksaan.
- source_word: לַּיְלָה
  choice: pada malam hari
  rationale: Bentuk ini berfungsi sebagai keterangan waktu. “Pada malam hari” jelas, alami, dan sesuai dengan ragam puisi yang bermartabat.
- source_word: צְרַפְתַּנִי
  choice: telah mengujiku
  rationale: צרף secara harfiah berkaitan dengan pemurnian logam dan secara metaforis berarti menguji seseorang. “Menguji” menyampaikan maksud metaforisnya tanpa menambahkan gagasan bahwa proses pemurnian telah mengubah pemazmur.
- source_word: בַל תִּמְצָא
  choice: tidak menemukan apa pun
  rationale: Objek kata kerja ini tidak dinyatakan dalam bahasa Ibrani. “Tidak menemukan apa pun” mempertahankan keringkasan teks tanpa menambahkan objek seperti kejahatan atau kesalahan.
- source_word: זַמֹּתִי
  choice: Aku telah bertekad
  rationale: Bentuk ini dipahami sebagai verba orang pertama dari זמם, yaitu menetapkan niat atau bertekad. “Bertekad” menghubungkannya secara wajar dengan pernyataan berikut mengenai mulut.
- source_word: בַל יַעֲבָר פִּי
  choice: mulutku tidak akan melampaui batas
  rationale: עבר secara dasar berarti melewati atau melampaui. Bersama “mulut,” ungkapan ini menunjuk pada tidak melampaui batas dalam perkataan. Terjemahan ini mempertahankan metafora Ibrani tanpa mempersempitnya menjadi jenis pelanggaran tertentu.
theological_decisions:
- issue: Penafsiran bagian penutup ayat
  choice: 'Bagian akhir dipahami sebagai tekad pemazmur mengenai perkataannya: “Aku telah bertekad: mulutku tidak akan melampaui batas.”'
  alternative: Bagian itu dapat dipahami lebih harfiah atau statif, misalnya, “Apa yang telah kurencanakan tidak dilampaui mulutku,” atau “mulutku tidak melampaui batas.”
  rationale: Susunan bahasa Ibrani ringkas dan hubungan antarklausanya tidak dinyatakan secara eksplisit. Memahami זַמֹּתִי sebagai verba orang pertama lalu membaca klausa berikut sebagai isi tekad menghasilkan makna yang koheren, tetapi catatan kaki mempertahankan kemungkinan susunan lain tanpa mengubahnya menjadi klaim doktrinal.
- issue: Hasil pemeriksaan ilahi
  choice: Menerjemahkan objek yang tidak dinyatakan sebagai “apa pun.”
  alternative: Dapat diperjelas secara tafsiran sebagai “kesalahan,” “kejahatan,” atau “niat jahat.”
  rationale: Teks Ibrani tidak menyebutkan secara eksplisit apa yang tidak ditemukan. Terjemahan utama mempertahankan ketaktertentuan itu dan tidak menjadikan pernyataan ini klaim teologis yang lebih luas daripada bunyi ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan tanpa menjadi arkais. Pengulangan “Engkau” mempertahankan tekanan retoris rangkaian tindakan Allah. “Melampaui batas” menjaga metafora sumber sekaligus tetap dapat dipahami pembaca umum.
