base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: id
  text: Nyatakanlah kasih setia-Mu yang ajaib[a], Ya, Penyelamat orang-orang yang berlindung dari mereka yang bangkit melawan, dengan tangan kanan-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jadikanlah kasih setia-Mu menakjubkan.” Kata perintah Ibrani dapat berarti memperlihatkan sesuatu sebagai luar biasa atau menjadikannya istimewa dan menakjubkan.'
    reason: lexical_alternative
  - marker: b
    text: 'Frasa terakhir juga dapat dihubungkan dengan “orang-orang yang berlindung”: “orang-orang yang berlindung pada tangan kanan-Mu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: Nyatakanlah ... yang ajaib
  rationale: Bentuk imperatif Hifil dari פלא meminta Allah memperlihatkan kasih setia-Nya sebagai sesuatu yang luar biasa; ungkapan ini alami dalam bahasa Indonesia sambil mempertahankan nuansa keajaiban.
- source_word: חֲסָדֶיךָ
  choice: kasih setia-Mu
  rationale: חסד mencakup kasih, kemurahan, dan kesetiaan dalam hubungan perjanjian; 'kasih setia' merupakan padanan Indonesia yang ringkas dan dikenal luas.
- source_word: מוֹשִׁיעַ
  choice: ya Penyelamat
  rationale: Partisip ini berfungsi sebagai sapaan kepada Allah sebagai Dia yang menyelamatkan; bentuk vokatif dipertahankan dengan 'ya'.
- source_word: חוֹסִים
  choice: orang-orang yang berlindung
  rationale: חסה menggambarkan tindakan mencari atau mendapat perlindungan, sehingga citra perlindungan konkret dipertahankan.
- source_word: מִמִּתְקוֹמְמִים
  choice: dari mereka yang bangkit melawan
  rationale: Partisip Hitpolel dari קום menunjukkan orang-orang yang bangkit dengan sikap bermusuhan; sasaran perlawanan tidak dinyatakan secara eksplisit dalam bahasa Ibrani dan tidak ditambahkan dalam teks utama.
- source_word: בִּימִינֶךָ
  choice: dengan tangan kanan-Mu
  rationale: Frasa ini paling wajar menyatakan sarana penyelamatan Allah, sambil mempertahankan citra antropomorfis tangan kanan sebagai kuasa.
theological_decisions:
- issue: Hubungan sintaksis frasa terakhir בִּימִינֶךָ
  choice: 'Dihubungkan dengan tindakan Allah menyelamatkan: ''dengan tangan kanan-Mu.'''
  alternative: 'Dihubungkan dengan orang-orang yang berlindung: ''orang-orang yang berlindung di sebelah kanan-Mu.'''
  rationale: Letak frasa preposisional pada akhir ayat memungkinkan lebih dari satu hubungan sintaksis. Teks utama memakai pembacaan instrumental yang paling koheren, sedangkan pembacaan lain yang sungguh mungkin dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan terbitan Alkitab Indonesia; susunan dibuat alami tanpa meniadakan ambiguitas asli.
