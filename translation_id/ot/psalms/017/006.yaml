source:
  edition: WLC
  text: אֲנִֽי קְרָאתִ֣י/ךָ כִֽי תַעֲנֵ֣/נִי אֵ֑ל הַֽט אָזְנְ/ךָ֥ לִ֝֗/י שְׁמַ֣ע אִמְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: id
  text: Aku berseru kepada-Mu[a], sebab Engkau menjawab aku, ya Allah; condongkanlah telinga-Mu kepadaku[b]; dengarkanlah perkataanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Aku telah berseru kepada-Mu, sebab Engkau akan menjawab aku, ya Allah.” Bentuk-bentuk kata kerja Ibrani dalam doa puitis ini dapat dipahami bernuansa lampau, kini, atau masa depan yang diyakini dengan teguh.
    reason: alternative_reading
  - marker: b
    text: Ungkapan Ibrani “condongkanlah telinga-Mu kepadaku” berarti meminta Allah mendengarkan dengan penuh perhatian.
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: Aku berseru kepada-Mu
  rationale: Bentuk Qal perfek orang pertama tunggal dengan akhiran orang kedua maskulin tunggal. Dalam doa puitis, bentuk ini dapat menunjuk pada seruan yang telah diucapkan, sedang dinyatakan, atau diyakini dengan mantap. Bahasa Indonesia tanpa penanda waktu eksplisit mempertahankan keluwesan itu secara alami.
- source_word: כִּי
  choice: sebab
  rationale: Mengungkapkan alasan bagi seruan pemazmur dan tetap ringkas serta puitis.
- source_word: תַעֲנֵנִי
  choice: Engkau menjawab aku
  rationale: Bentuk imperfek orang kedua maskulin tunggal dengan akhiran orang pertama tunggal menyatakan keyakinan bahwa Allah menanggapi. Bentuk kini tanpa penanda waktu dalam bahasa Indonesia tidak menutup nuansa masa depan yang penuh keyakinan.
- source_word: אֵל
  choice: ya Allah
  rationale: Dipakai sebagai sapaan langsung. 'Ya Allah' merupakan bentuk vokatif yang alami dan khidmat dalam bahasa Indonesia.
- source_word: הַט אָזְנְךָ לִי
  choice: condongkanlah telinga-Mu kepadaku
  rationale: Mempertahankan metafora Ibrani yang meminta perhatian dan pendengaran sungguh-sungguh; bentuk imperatif juga dipertahankan.
- source_word: שְׁמַע
  choice: dengarkanlah
  rationale: Menyampaikan imperatif langsung secara alami dalam bahasa Indonesia dan membentuk paralelisme dengan permintaan sebelumnya.
- source_word: אִמְרָתִי
  choice: perkataanku
  rationale: Nomina tunggal ini berarti ucapan atau perkataan. 'Perkataanku' mempertahankan bentuk kolektif tunggal dan terdengar alami dalam konteks doa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak doa yang khidmat. Metafora tubuh dalam bahasa Ibrani dipertahankan karena masih mudah dipahami, sementara penanda waktu tidak ditambahkan ke dalam teks utama agar ambiguitas aspek verbal puisi Ibrani tetap terjaga.
