id: PSA.22.28
reference: Psalms 22:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: id
  text: Sebab kerajaan[a] adalah milik Yahweh[b], dan Dia memerintah atas bangsa-bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kekuasaan sebagai raja” atau “pemerintahan.” Kata Ibrani ini dapat berarti kerajaan, kedudukan sebagai raja, atau pemerintahan.
    reason: lexical_alternative
  - marker: b
    text: Ibrani YHWH; secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menyatakan alasan atau dasar bagi seruan dan pujian sebelumnya; “sebab” mempertahankan hubungan kausal itu secara alami.
- source_word: לַיהוָה
  choice: adalah milik Yahweh
  rationale: Preposisi לְ menyatakan hubungan kepemilikan. Dalam bahasa Indonesia, hubungan itu diungkapkan dengan jelas dan alami sebagai “adalah milik Yahweh”.
- source_word: הַמְּלוּכָה
  choice: kerajaan
  rationale: Nomina מְלוּכָה dapat menunjuk pada kerajaan, kedudukan sebagai raja, atau pemerintahan. “Kerajaan” mudah dipahami dan tetap mempertahankan nuansa kekuasaan kerajaan, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: וּמֹשֵׁל
  choice: dan Dia memerintah
  rationale: Partisipel Qal dari משל mengungkapkan tindakan atau keadaan yang berlangsung sebagai kebenaran umum. “Memerintah” merupakan padanan Indonesia yang alami tanpa membatasi waktu tindakan tersebut.
- source_word: בַּגּוֹיִם
  choice: atas bangsa-bangsa
  rationale: Dengan verba משל, preposisi בְ menunjuk pada pihak yang berada di bawah pemerintahan. גּוֹיִם di sini berarti bangsa-bangsa secara luas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama ilahi itu, sedangkan kebiasaan tradisional “TUHAN” dicatat sebagai alternatif.
- issue: Cakupan makna מְלוּכָה
  choice: kerajaan adalah milik Yahweh
  alternative: kekuasaan sebagai raja adalah milik Yahweh; pemerintahan adalah milik Yahweh
  rationale: Kata Ibrani tersebut mencakup kerajaan, kedudukan sebagai raja, dan pelaksanaan pemerintahan. Teks utama memakai ungkapan yang ringkas dan lazim tanpa meniadakan kemungkinan nuansa lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan struktur sebab-akibat yang jelas. Pronomina “Dia” dipakai secara wajar untuk merujuk kembali kepada Yahweh; tidak ditambahkan penekanan yang tidak terdapat dalam teks Ibrani.
