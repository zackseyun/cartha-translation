id: PSA.22.24
reference: Psalms 22:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: id
  text: Sebab Ia tidak memandang hina ataupun merasa jijik terhadap penderitaan orang yang tertindas[a]. Ia tidak menyembunyikan wajah-Nya dari orang itu, tetapi ketika orang itu berseru kepada-Nya, Ia mendengar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesengsaraan orang miskin” atau “kehinaan orang yang tertindas.”
    reason: Menunjukkan keluasan makna עֱנוּת dan עָנִי, yang dapat berkaitan dengan penderitaan, kemiskinan, penindasan, atau perendahan.
lexical_decisions:
- source_word: בָזָה
  choice: memandang hina
  rationale: Mengungkapkan tindakan memperlakukan sesuatu dengan penghinaan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: שִׁקַּץ
  choice: merasa jijik terhadap
  rationale: Mempertahankan daya yang lebih kuat daripada בָזָה, yaitu menganggap sesuatu menjijikkan atau sangat tidak disukai.
- source_word: עֱנוּת
  choice: penderitaan
  rationale: Mencakup keadaan sengsara, tertindas, atau direndahkan tanpa membatasinya pada satu dimensi saja.
- source_word: עָנִי
  choice: orang yang tertindas
  rationale: Sesuai dengan konteks penderitaan mazmur dan tidak mempersempit makna hanya pada kemiskinan ekonomi.
- source_word: הִסְתִּיר פָּנָיו
  choice: menyembunyikan wajah-Nya
  rationale: Mempertahankan gambaran idiomatis Ibrani tentang tidak memberikan perhatian atau perkenanan.
- source_word: מִמֶּנּוּ
  choice: dari orang itu
  rationale: Menunjuk kembali kepada orang tunggal yang tertindas sambil menghindari ambiguitas pronomina Indonesia.
- source_word: בְשַׁוְּעוֹ
  choice: ketika orang itu berseru
  rationale: Mengungkapkan seruan mendesak untuk meminta pertolongan secara ringkas dan alami.
- source_word: אֵלָיו
  choice: kepada-Nya
  rationale: Mempertahankan bentuk pronominal teks Ibrani; rujukannya kepada Allah jelas dari konteks.
- source_word: שָׁמֵעַ
  choice: Ia mendengar
  rationale: Mempertahankan arti dasar verba 'mendengar' tanpa menambahkan gagasan eksplisit bahwa Ia menjawab.
theological_decisions:
- issue: Rujukan orang yang tertindas
  choice: Ayat ini berbicara tentang perhatian Allah kepada seorang yang tertindas, selaras dengan pengalaman pribadi pemazmur sekaligus terbuka sebagai pernyataan yang lebih umum.
  alternative: Menjadikannya secara eksklusif nubuat mesianik atau semata-mata pernyataan umum tentang siapa pun yang miskin.
  rationale: Bentuk tunggal Ibrani dapat menunjuk kepada penderita dalam konteks langsung mazmur dan sekaligus mengungkapkan prinsip yang lebih luas; terjemahan tidak memaksakan salah satu pembacaan secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme dua verba negatif dipertahankan, demikian pula gambaran 'menyembunyikan wajah'. Pengulangan 'orang itu' dipakai untuk memperjelas rujukan pronomina tanpa menambahkan identitas tertentu.
source_grounding:
  english_pob_role: consult_only
