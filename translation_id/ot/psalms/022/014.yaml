base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: id
  text: Aku tercurah seperti air, dan semua tulangku terlepas dari sendinya. Hatiku menjadi seperti lilin, meleleh di dalam tubuhku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “di tengah bagian-bagian dalam tubuhku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: seperti air
  rationale: Prefiks כַּ menyatakan perbandingan; bentuk ini mempertahankan perumpamaan secara alami dalam bahasa Indonesia.
- source_word: נִשְׁפַּכְתִּי
  choice: Aku tercurah
  rationale: Bentuk Nifal dari שׁפך menggambarkan pemazmur dalam keadaan seolah-olah telah ditumpahkan atau dikosongkan. 'Tercurah' mempertahankan bentuk pasif dan daya puitisnya.
- source_word: וְהִתְפָּרְדוּ כָּל עַצְמוֹתַי
  choice: semua tulangku terlepas dari sendinya
  rationale: Kata kerja Hitpael dari פרד berarti berpisah atau tercerai. Dalam kaitannya dengan tulang, ungkapan ini menyampaikan gambaran tubuh yang terurai secara jelas dan wajar, tanpa mengubahnya menjadi pernyataan medis teknis.
- source_word: הָיָה לִבִּי
  choice: Hatiku menjadi
  rationale: Terjemahan ini mempertahankan perubahan menuju suatu keadaan, bukan sekadar keadaan statis.
- source_word: כַּדּוֹנָג
  choice: seperti lilin
  rationale: דּוֹנָג berarti lilin; perumpamaan konkret dipertahankan langsung.
- source_word: נָמֵס
  choice: meleleh
  rationale: Kata dari מסס berarti mencair atau meleleh. 'Meleleh' paling sesuai dengan citra lilin dan mengalir alami dalam bahasa Indonesia.
- source_word: בְּתוֹךְ מֵעָי
  choice: di dalam tubuhku
  rationale: מֵעִים secara harfiah menunjuk bagian-bagian dalam tubuh. 'Di dalam tubuhku' tetap mempertahankan citra jasmani dengan bahasa Indonesia yang alami; ungkapan yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Ungkapan antropologis tentang kesesakan batin
  choice: di dalam tubuhku
  alternative: di tengah bagian-bagian dalam tubuhku
  rationale: Teks Ibrani memakai istilah jasmani yang mendalam, bukan kategori abstrak seperti 'jiwa'. Terjemahan utama tetap alami sekaligus tidak merohanikan citra itu; bentuk yang lebih harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa puitis, khidmat, dan mudah dipahami. 'Aku tercurah' mempertahankan metafora pasif; 'terlepas dari sendinya' mengungkapkan pemisahan tulang secara idiomatis. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
