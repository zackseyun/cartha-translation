source:
  edition: WLC
  text: כָּל רֹ֭אַ/י יַלְעִ֣גוּ לִ֑/י יַפְטִ֥ירוּ בְ֝/שָׂפָ֗ה יָנִ֥יעוּ רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/007.yaml
  text: All who see me mock me[a]; they open wide the lip[b]; they shake the head.
translation:
  language: id
  text: Semua orang yang melihat aku mengolok-olok aku; mereka mencibirkan bibir[a] dan menggelengkan kepala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mereka membuka bibir lebar-lebar.” Ungkapan Ibrani ini menggambarkan gerak wajah yang menyatakan penghinaan.'
    reason: lexical_alternative
  - marker: b
    text: Gerakan kepala ini merupakan tanda cemoohan; gambaran yang sama juga muncul dalam kisah sengsara di kitab-kitab Injil.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל רֹאַי
  choice: Semua orang yang melihat aku
  rationale: כָּל menyatakan keseluruhan, sedangkan partisip רֹאַי dengan akhiran orang pertama tunggal berarti ‘orang-orang yang melihat aku’. Klausa relatif ini alami dan tetap dekat dengan bentuk Ibrani.
- source_word: יַלְעִגוּ לִי
  choice: mengolok-olok aku
  rationale: Kata לָעַג menyatakan tindakan mengejek atau mempermainkan dengan nada menghina; ‘mengolok-olok’ jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: mencibirkan bibir
  rationale: Ungkapan Ibrani menggambarkan gerak bibir yang menyatakan penghinaan. ‘Mencibirkan bibir’ mempertahankan gambaran tubuh sekaligus menyampaikan maksud ungkapannya secara alami.
- source_word: יָנִיעוּ רֹאשׁ
  choice: menggelengkan kepala
  rationale: Secara harfiah ungkapan ini menyatakan gerakan kepala; dalam konteksnya gerakan tersebut merupakan tanda cemoohan. Pilihan ini merupakan ungkapan Indonesia yang lazim.
theological_decisions:
- issue: Pemaknaan mesianik dalam penafsiran Kristen kemudian
  choice: Ayat diterjemahkan terlebih dahulu sebagai perkataan pemazmur yang sedang menderita, tanpa menambahkan bahasa kristologis yang tidak tersurat dalam teks Ibrani.
  alternative: Pembaca dapat mengenali gema atau penggunaan ayat ini dalam kisah sengsara di kitab-kitab Injil.
  rationale: Terjemahan harus merepresentasikan teks Mazmur dalam konteksnya sendiri sambil tidak menghalangi hubungan antarteks yang dapat dikenali pembaca.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan tiga tindakan berurutan dalam teks Ibrani, sedangkan dua gerak tubuh diterjemahkan dengan ungkapan yang langsung dipahami pembaca masa kini.
