translation:
  language: id
  text: Keturunan akan mengabdi kepada-Nya; tentang Tuhan akan diceritakan kepada suatu angkatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “akan diceritakan kepada Tuhan untuk/kepada suatu angkatan.” Hubungan kata “kepada Tuhan” dengan kata kerja ini tidak sepenuhnya jelas; teks utama memahaminya sebagai pemberitaan tentang Tuhan kepada suatu angkatan.'
    reason: Menandai ambiguitas sintaksis לַאדֹנָי dan לַדּוֹר tanpa menambahkan unsur waktu atau mempresentasikan pemahaman kontekstual sebagai arti harfiah.
lexical_decisions:
- source_word: זֶרַע
  choice: keturunannya
  rationale: Secara harfiah berarti “benih”, tetapi dalam konteks manusia kata ini lazim menunjuk pada keturunan atau anak cucu. Bentuk Indonesia ini mempertahankan pengertian kolektif tanpa terdengar janggal.
- source_word: יַעַבְדֶנּוּ
  choice: akan melayani Dia
  rationale: Bentuk verba menyatakan tindakan melayani atau mengabdi, dengan sufiks objek orang ketiga tunggal yang merujuk kepada Allah.
- source_word: יְסֻפַּר
  choice: akan diberitakan
  rationale: Bentuk pasif dari ספר berarti akan diceritakan, dikisahkan, atau diberitakan. “Diberitakan” alami dalam konteks penyampaian tentang Tuhan kepada generasi berikut.
- source_word: לַאדֹנָי
  choice: tentang Tuhan
  rationale: Preposisi ל dapat dipahami dalam relasi isi atau acuan, yakni pemberitaan mengenai Tuhan. Terjemahan ini mengikuti konteks, sambil mengakui kemungkinan sintaksis lain dalam catatan kaki.
- source_word: לַדּוֹר
  choice: kepada angkatan yang akan datang
  rationale: Secara bentuk berarti “kepada angkatan itu/sebuah angkatan”. Konteks ayat berikutnya mengarah kepada generasi mendatang, sehingga unsur ini dibuat eksplisit secara terbatas.
theological_decisions:
- issue: Identitas keturunan yang melayani Allah
  choice: Dibiarkan sebagai kelompok kolektif tanpa mengidentifikasikannya dengan komunitas teologis tertentu.
  alternative: Menafsirkannya secara khusus sebagai umat tertentu atau sebagai satu keturunan individual.
  rationale: זֶרַע dapat bersifat kolektif dan ayat ini sendiri tidak menetapkan identitas denominatif atau kristologis secara eksplisit.
- issue: Hubungan frasa לַאדֹנָי dengan verba pasif
  choice: 'Dipahami sebagai isi pemberitaan: “tentang Tuhan”.'
  alternative: “Akan diceritakan kepada Tuhan” atau “akan diperhitungkan sebagai milik Tuhan”.
  rationale: Bacaan “tentang Tuhan” sesuai dengan kesinambungan pemberitaan antargenerasi, tetapi struktur Ibraninya ringkas dan memungkinkan nuansa lain; karena itu ambiguitas dicatat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Kapitalisasi “Dia” dipakai sebagai konvensi penghormatan ketika pronomina merujuk kepada Allah. Istilah “angkatan” dipertahankan karena sesuai dengan register mazmur dan hubungan antargenerasi dalam konteks.
