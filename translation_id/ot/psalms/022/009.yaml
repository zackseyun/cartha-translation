  text: כִּֽי אַתָּ֣ה גֹחִ֣/י מִ/בָּ֑טֶן מַ֝בְטִיחִ֗/י עַל שְׁדֵ֥י אִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/009.yaml
  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: id
  text: Sebab Engkaulah yang mengeluarkan aku dari kandungan, yang membuat aku aman pada payudara ibuku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang membuat aku percaya pada payudara ibuku.”'
    reason: Alternatif leksikal bagi מַבְטִיחִי, yang juga dapat dipahami sebagai “membuat aku percaya.”
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendukung seruan dan pujian sebelumnya; bentuk ini mempertahankan alur argumentatif mazmur.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: 'Mempertahankan penekanan pada kata ganti yang dinyatakan secara eksplisit: Allah sendiri adalah pelakunya.'
- source_word: גֹחִי
  choice: yang mengeluarkan aku
  rationale: Dalam konteks kelahiran, bentuk ini menunjuk pada tindakan menyebabkan seseorang keluar; terjemahan ini mempertahankan gambaran konkret kelahiran.
- source_word: מִבָּטֶן
  choice: dari kandungan
  rationale: Padanan alami dan langsung bagi gabungan preposisi dan nomina dalam konteks kelahiran.
- source_word: מַבְטִיחִי
  choice: yang membuat aku merasa aman
  rationale: Bentuk kausatif dari בטח dapat menyatakan pemberian rasa aman atau kepercayaan. Dalam konteks bayi, pilihan ini alami tanpa mewajibkan gagasan tentang kepercayaan sadar; kemungkinan 'membuat aku percaya' dipertahankan dalam catatan kaki.
- source_word: עַל
  choice: pada
  rationale: Mempertahankan hubungan lokatif dengan payudara ibu dalam ungkapan Indonesia yang ringkas.
- source_word: שְׁדֵי
  choice: payudara
  rationale: Kata Ibrani secara khusus berarti payudara; pilihan ini tepat, modern, dan tidak memperhalus gambaran jasmani dalam teks.
- source_word: אִמִּי
  choice: ibuku
  rationale: Mempertahankan akhiran kepunyaan orang pertama dalam bentuk Indonesia yang alami.
theological_decisions:
- issue: Apakah מַבְטִיחִי menyatakan kepercayaan bayi secara eksplisit atau rasa aman yang lebih luas
  choice: yang membuat aku merasa aman
  alternative: yang membuat aku percaya
  rationale: Konteksnya adalah pemeliharaan Allah sejak kelahiran dan ketika pemazmur masih berada pada payudara ibunya. 'Merasa aman' mempertahankan makna kausatif tentang keamanan tanpa memaksakan klaim mengenai iman sadar seorang bayi. Karena makna 'membuat percaya' tetap mungkin secara leksikal dan memiliki dukungan tradisi penerjemahan, alternatif itu dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Bentuk “Engkaulah” mempertahankan penekanan Ibrani, sedangkan “payudara” dipilih karena tepat dan mudah dipahami. Ambiguitas utama dipertahankan melalui catatan kaki.
