  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: id
  text: Janganlah jauh dariku, sebab kesesakan[a] dekat, sebab tidak ada yang menolong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesusahan” atau “penderitaan.” Kata Ibrani ini dapat menunjuk pada kesulitan, keadaan terdesak, atau penderitaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: Janganlah jauh dariku
  rationale: Bentuk negatif אַל dengan verba orang kedua menyatakan permohonan yang mendesak. Terjemahan ini mempertahankan gambaran ruang dari רחק dan tidak memperkuatnya menjadi ‘jangan tinggalkan aku’.
- source_word: כִּי
  choice: sebab
  rationale: Kedua kemunculan כִּי memberi alasan bagi permohonan. Pengulangan ‘sebab’ mempertahankan susunan dan daya puitis bahasa Ibrani.
- source_word: צָרָה
  choice: kesesakan
  rationale: Nomina ini mencakup kesusahan, keadaan terdesak, atau penderitaan. ‘Kesesakan’ menyampaikan tekanan yang kuat tanpa menentukan bentuk ancamannya.
- source_word: קְרוֹבָה
  choice: sudah dekat
  rationale: Adjektiva ini berfungsi sebagai predikat dan menyatakan bahwa kesesakan berada dekat atau segera mengancam. ‘Sudah dekat’ merupakan ungkapan Indonesia yang alami untuk kedekatan yang mendesak.
- source_word: אֵין עוֹזֵר
  choice: tidak ada yang menolong
  rationale: אֵין menyatakan ketiadaan, sedangkan partisipel עוֹזֵר menunjuk kepada seseorang yang menolong. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada ‘tidak ada penolong’ dan tetap mempertahankan makna personal.
theological_decisions:
- issue: Bahasa tentang jauhnya Allah dalam ratapan
  choice: Janganlah jauh dariku
  alternative: Jangan tinggalkan aku
  rationale: Teks Ibrani memakai gambaran ruang, yaitu רחק dengan מן. Terjemahan yang dipilih mempertahankan ketegangan ratapan tanpa menambahkan gagasan ditinggalkan secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. ‘Janganlah’ mempertahankan nada permohonan yang khidmat; pengulangan ‘sebab’ mencerminkan struktur puisi Ibrani.
