  text: אָכְל֬וּ וַ/יִּֽשְׁתַּחֲוּ֨וּ כָּֽל דִּשְׁנֵי אֶ֗רֶץ לְ/פָנָ֣י/ו יִ֭כְרְעוּ כָּל יוֹרְדֵ֣י עָפָ֑ר וְ֝/נַפְשׁ֗/וֹ לֹ֣א חִיָּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: id
  text: Semua orang yang makmur di bumi[a] akan makan dan bersujud; di hadapan-Nya semua orang yang turun ke debu[b] akan berlutut—bahkan orang yang tidak dapat mempertahankan hidupnya sendiri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua orang gemuk di bumi”; ungkapan ini kemungkinan berarti orang-orang yang makmur atau berkecukupan.
    reason: lexical_alternative
  - marker: b
    text: Atau “semua orang yang turun menuju debu.” “Debu” merupakan gambaran Ibrani tentang kefanaan dan kematian.
    reason: lexical_alternative
  - marker: c
    text: Klausa Ibrani terakhir sulit. Secara sangat harfiah, “dan hidup/jiwanya tidak ia pertahankan tetap hidup”; susunan dan subjeknya tidak pasti. Klausa ini sering dipahami sebagai “bahkan orang yang tidak dapat mempertahankan hidupnya sendiri.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: akan makan
  rationale: Bentuk perfektif dalam konteks puitis-profetis ini dapat menunjuk pada gambaran masa depan dan selaras dengan tindakan penghormatan berikutnya.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: dan sujud
  rationale: Menjaga gambaran jasmani membungkuk atau merebahkan diri, sekaligus membiarkan makna penyembahan tersirat oleh konteks.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: semua orang makmur di bumi
  rationale: Secara harfiah berarti 'semua orang gemuk di bumi', tetapi secara idiomatis menunjuk kepada mereka yang berkecukupan atau hidup makmur.
- source_word: לְפָנָיו
  choice: di hadapan-Nya
  rationale: Padanan Indonesia yang alami dan dekat dengan ungkapan Ibrani.
- source_word: יִכְרְעוּ
  choice: akan berlutut
  rationale: Kata ini secara khusus menggambarkan menekuk lutut; pilihan ini mempertahankan pembedaan dari tindakan sujud pada baris sebelumnya.
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: semua orang yang turun ke debu
  rationale: Mempertahankan citra Ibrani tentang kefanaan dan kematian tanpa langsung menafsirkannya sebagai 'kubur'.
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: bahkan orang yang tidak dapat mempertahankan hidupnya sendiri
  rationale: Klausa Ibrani ini padat dan sulit. Terjemahan ini menyampaikan pemahaman umum bahwa yang dimaksud ialah orang yang tidak sanggup menjaga dirinya tetap hidup, tanpa menghilangkan kesulitannya dari catatan kaki.
theological_decisions:
- issue: Penafsiran klausa akhir וְנַפְשׁוֹ לֹא חִיָּה
  choice: Klausa ini merujuk kepada orang yang tidak dapat mempertahankan hidupnya sendiri.
  alternative: Klausa itu dapat dipahami lebih umum sebagai 'dan hidupnya tidak dipertahankannya' atau sebagai susunan sintaksis yang terputus dan tidak pasti.
  rationale: Bacaan yang dipilih sesuai dengan kontras puitis antara orang makmur dan mereka yang mendekati kematian, tetapi ketidakpastian teks tetap dinyatakan dalam catatan kaki dan tidak dikembangkan menjadi klaim doktrinal yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Istilah 'sujud', 'berlutut', dan 'debu' mempertahankan citra jasmani serta pola paralel puisi Ibrani; kapitalisasi pronomina ilahi mengikuti kebiasaan Indonesia tanpa menambah penafsiran.
