  text: אֱֽלֹהַ֗/י אֶקְרָ֣א י֭וֹמָם וְ/לֹ֣א תַעֲנֶ֑ה וְ֝/לַ֗יְלָה וְֽ/לֹא דֽוּמִיָּ֥ה לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: id
  text: Allahku, aku berseru pada siang hari, tetapi Engkau tidak menjawab; pada malam hari pun aku tidak mendapat ketenangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “tidak ada keheningan bagiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk dengan sufiks orang pertama tunggal berarti 'Allahku' dan berfungsi sebagai sapaan langsung; tidak perlu menambahkan kata seru yang tidak terdapat dalam bahasa Ibrani.
- source_word: אֶקְרָא
  choice: aku berseru
  rationale: Dalam konteks ratapan, verba קרא menyatakan seruan mendesak kepada Allah, bukan sekadar memanggil secara netral.
- source_word: יוֹמָם
  choice: pada siang hari
  rationale: Bentuk adverbial ini menunjuk waktu dan berpasangan secara alami dengan 'pada malam hari'.
- source_word: וְלֹא תַעֲנֶה
  choice: tetapi Engkau tidak menjawab
  rationale: 'Kata penghubung memperoleh nuansa pertentangan dari keluhan ini: pemazmur berseru, tetapi tidak menerima jawaban.'
- source_word: וְלַיְלָה
  choice: juga pada malam hari
  rationale: Ungkapan ini melanjutkan kesejajaran siang dan malam; 'juga' menyampaikan fungsi koordinatif waw secara alami dalam bahasa Indonesia.
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: dan aku tidak dapat berdiam diri
  rationale: דומיה berarti keheningan, sikap diam, atau ketenangan. Dalam konstruksi 'tidak ada דומיה bagiku', terjemahan ini mempertahankan citra tidak diam sekaligus terdengar alami, tanpa langsung menyamakannya dengan tidak mendapat jawaban.
theological_decisions:
- issue: Makna klausa akhir וְלֹא דֽוּמִיָּה לִי
  choice: Pemazmur tidak dapat berdiam diri pada malam hari.
  alternative: aku tidak mendapat ketenangan / tidak ada keheningan bagiku
  rationale: Nomina דומיה memang dapat menunjuk keheningan atau ketenangan. Dalam konteks seruan yang berlangsung siang dan malam, frasa ini secara wajar dapat menggambarkan pemazmur yang tidak diam. Catatan kaki mempertahankan kemungkinan bahwa yang dimaksud adalah tidak adanya ketenangan, sehingga ambiguitas puitis tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang khidmat. Huruf kapital pada 'Engkau' mengikuti gaya penghormatan kepada Allah. Tanda titik koma memperjelas kesejajaran antara seruan pada siang dan malam hari.
