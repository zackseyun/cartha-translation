  text: וְ/אָנֹכִ֣י תוֹלַ֣עַת וְ/לֹא אִ֑ישׁ חֶרְפַּ֥ת אָ֝דָ֗ם וּ/בְז֥וּי עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/006.yaml
  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: id
  text: Namun aku ini ulat, bukan manusia, dicela oleh umat manusia dan dihina oleh orang banyak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: Namun aku ini
  rationale: Kata ganti אָנֹכִי bersifat tegas, sedangkan וְ menandai kontras dengan keyakinan pada ayat sebelumnya. 'Namun aku ini' menyampaikan penekanan dan peralihan itu secara alami.
- source_word: תוֹלַעַת
  choice: ulat
  rationale: Kata ini menunjuk pada ulat atau cacing kecil dan di sini menjadi gambaran kehinaan yang ekstrem. 'Ulat' mempertahankan citra tanpa menentukan jenisnya secara berlebihan.
- source_word: וְ/לֹא אִישׁ
  choice: bukan manusia
  rationale: Ungkapan ini menyangkal martabat atau kedudukan manusiawi si pembicara secara tajam. 'Bukan manusia' alami dalam bahasa Indonesia dan tidak mempersempit אִישׁ menjadi laki-laki.
- source_word: חֶרְפַּת אָדָם
  choice: dicela oleh umat manusia
  rationale: Secara bentuk, חֶרְפַּת adalah nomina konstruksi yang dapat berarti 'celaan manusia'; secara konteks, frasa itu menggambarkan si pembicara sebagai sasaran celaan. Bentuk verbal pasif menghasilkan bahasa Indonesia yang jelas sambil mempertahankan makna kolektif אָדָם.
- source_word: וּ/בְזוּי
  choice: dan dihina
  rationale: Partisip pasif ini menyatakan keadaan dipandang hina atau direndahkan. 'Dihina' ringkas dan mempertahankan bobot emosionalnya.
- source_word: עָם
  choice: rakyat
  rationale: עָם berarti suatu kelompok masyarakat atau rakyat secara kolektif. 'Rakyat' membedakannya dari אָדָם dalam baris sebelumnya dan mempertahankan paralelisme.
theological_decisions:
- issue: Penggunaan mesianik/prototipologis dalam penafsiran Kristen
  choice: Menerjemahkan menurut makna puitis Ibrani tentang penghinaan tanpa menambahkan ungkapan mesianik secara eksplisit.
  alternative: Terjemahan yang secara interpretatif menonjolkan penggenapan kristologis.
  rationale: Mazmur 22 penting secara kristologis, tetapi ayat ini sendiri memakai suara pemazmur dan citra kehinaan. Hubungan kanonik dan teologis sebaiknya muncul dari konteks, bukan dari perluasan teks terjemahan.
- issue: Bentuk nominal חֶרְפַּת אָדָם
  choice: dicela oleh umat manusia
  alternative: celaan umat manusia / suatu cela bagi manusia
  rationale: Bahasa Ibrani memungkinkan bentuk formal 'celaan umat manusia', yang dapat dipahami sebagai celaan yang berasal dari manusia atau keadaan menjadi sasaran celaan mereka. Bentuk pasif dipilih agar maknanya alami dalam bahasa Indonesia tanpa menghapus alternatif formal tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, puitis, lugas, dan bermartabat. Paralelisme penghinaan dipertahankan melalui 'dicela ... dan dihina', sedangkan 'ulat, bukan manusia' menjaga ketajaman metafora sumber.
