id: PSA.22.15
reference: Psalms 22:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: id
  text: Kekuatanku telah mengering seperti pecahan tembikar, dan lidahku melekat pada rahangku[a]; Engkau meletakkan aku dalam debu maut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “langit-langit mulutku.” Istilah Ibrani untuk bagian mulut ini tidak pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: telah mengering
  rationale: Bentuk verba ini menyatakan bahwa kekuatan pemazmur sudah menjadi kering atau layu; pilihan ini mempertahankan citra kehilangan daya hidup.
- source_word: כַּחֶרֶשׂ
  choice: seperti pecahan tembikar
  rationale: חֶרֶשׂ dapat menunjuk pada barang tembikar atau pecahannya. 'Pecahan tembikar' mempertahankan gambaran sesuatu yang kering, keras, rapuh, dan tidak lagi utuh.
- source_word: כֹּחִי
  choice: kekuatanku
  rationale: Dalam konteks ini כֹּחַ menunjuk pada kekuatan atau daya jasmani, bukan wewenang abstrak.
- source_word: וּלְשׁוֹנִי
  choice: dan lidahku
  rationale: Ungkapan anatomis langsung dipertahankan tanpa parafrasa.
- source_word: מֻדְבָּק
  choice: melekat
  rationale: Partisip pasif ini menggambarkan lidah yang dibuat atau berada dalam keadaan menempel; 'melekat' alami dalam bahasa Indonesia dan mempertahankan gambaran fisiknya.
- source_word: מַלְקוֹחָי
  choice: pada rahangku
  rationale: Istilah bagi bagian mulut ini tidak pasti. 'Rahangku' mengikuti kemungkinan arti rahang atau bagian sisi mulut, sementara alternatif 'langit-langit mulutku' dicatat dalam catatan kaki.
- source_word: וְלַעֲפַר
  choice: dalam debu
  rationale: Preposisi ל dapat menyatakan arah atau penempatan. 'Dalam debu' sesuai dengan tindakan menempatkan dan alami dalam puisi Indonesia.
- source_word: מָוֶת
  choice: maut
  rationale: '''Debu maut'' mempertahankan konstruksi puitis Ibrani tanpa mempersempitnya menjadi ''kubur''.'
- source_word: תִּשְׁפְּתֵנִי
  choice: Engkau meletakkan aku
  rationale: Verba ini berarti menaruh atau menempatkan. Subjek orang kedua tunggal dipertahankan sebagai sapaan langsung kepada Allah; kapitalisasi 'Engkau' mengikuti kebiasaan bahasa Indonesia bagi sapaan ilahi.
theological_decisions:
- issue: Pelaku dalam klausa terakhir
  choice: 'Sapaan langsung kepada Allah: ''Engkau meletakkan aku dalam debu maut.'''
  alternative: 'Bacaan impersonal atau resultatif: ''aku diletakkan dalam debu maut.'''
  rationale: 'Verba Ibrani berbentuk orang kedua maskulin tunggal dengan objek orang pertama tunggal, sehingga secara wajar merupakan sapaan langsung. Terjemahan ini mempertahankan ketegangan teologis mazmur: penderita mengaitkan keadaannya yang mendekati maut dengan tindakan Allah tanpa menjelaskan hubungan tindakan ilahi itu dengan tindakan para musuh.'
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. 'Pecahan tembikar' cukup umum untuk mempertahankan citra konkret teks; 'maut' dipilih karena ringkas dan sesuai dengan ragam puisi. Tanda titik koma mempertahankan peralihan dari gambaran ke sapaan langsung.
