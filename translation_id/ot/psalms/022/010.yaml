  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: id
  text: Kepada-Mu aku dilemparkan dari rahim; dari perut ibuku[b], Engkaulah Allahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Allahku Engkau.” Klausa Ibrani tidak memiliki kata kerja yang menyatakan kala secara eksplisit. Dalam konteks, klausa ini juga dapat diterjemahkan secara kontekstual, “Sejak dalam kandungan Engkau telah menjadi Allahku.”
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “perut” juga dapat berarti “kandungan”; karena itu dapat diterjemahkan, “kandungan ibuku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  choice: Kepada-Mu
  rationale: Preposisi עַל di sini menyatakan bahwa pemazmur ditempatkan pada pemeliharaan dan ketergantungan kepada Allah. “Kepada-Mu” alami dalam bahasa Indonesia serta mempertahankan arah gambaran tersebut.
- source_word: הָשְׁלַכְתִּי
  choice: aku dilemparkan
  rationale: Bentuk pasif dari שלך membawa gambaran konkret tentang dilemparkan atau ditaruh. “Aku dilemparkan” mempertahankan daya ungkap Ibrani tanpa memperlunaknya menjadi tafsiran seperti “aku dipercayakan”.
- source_word: מֵרָחֶם
  choice: sejak dari rahim
  rationale: רֶחֶם secara konkret berarti “rahim”. Ungkapan “sejak dari” menyampaikan titik awal hubungan yang dibicarakan dalam konteks puisi.
- source_word: מִבֶּטֶן אִמִּי
  choice: sejak dari kandungan ibuku
  rationale: בֶּטֶן dapat berarti perut atau kandungan. “Kandungan ibuku” terdengar alami dan bermartabat dalam bahasa Indonesia, sekaligus mempertahankan citra asal-usul sejak sebelum kelahiran.
- source_word: אֵלִי
  choice: Allahku
  rationale: אֵל dengan akhiran orang pertama tunggal secara langsung berarti “Allahku” dan mempertahankan sifat pribadi hubungan itu.
- source_word: אָתָּה
  choice: Engkaulah
  rationale: Klausa Ibrani tidak memiliki verba eksplisit. Bentuk penegas “Engkaulah” secara alami menerjemahkan susunan “Allahku Engkau” tanpa menetapkan kala secara berlebihan.
theological_decisions:
- issue: Kala dalam klausa nominal אֵלִי אָתָּה
  choice: Engkaulah Allahku
  alternative: Engkau telah menjadi Allahku
  rationale: Bahasa Ibrani secara harfiah tidak menyatakan kala. Terjemahan utama mempertahankan ketaktertentuan itu, sedangkan konteks memungkinkan pengertian hubungan yang berlangsung sejak kandungan hingga sekarang; kemungkinan tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Bentuk sapaan ilahi memakai huruf kapital. Metafora kuat “dilemparkan” dipertahankan, sementara klausa nominal terakhir dibiarkan tanpa penambahan kala yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
