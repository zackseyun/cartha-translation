  text: אֲסַפְּרָ֣ה שִׁמְ/ךָ֣ לְ/אֶחָ֑/י בְּ/ת֖וֹךְ קָהָ֣ל אֲהַלְלֶֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/022.yaml
  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: id
  text: Aku akan memberitakan nama-Mu kepada saudara-saudaraku[a]; di tengah-tengah jemaah aku akan memuji-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada saudara-saudaraku” dalam bentuk maskulin jamak; dalam konteks ini, istilah tersebut dapat mencakup saudara laki-laki dan perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Aku akan memberitakan
  rationale: Bentuk piel dari ספר menyatakan tindakan menceritakan atau memberitakan. “Memberitakan” sesuai dengan kesaksian publik dalam paralelisme ayat ini dan tetap wajar dalam bahasa Indonesia.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Mempertahankan idiom Ibrani “nama”, yang menunjuk pada pribadi, karakter, dan kemasyhuran Allah sebagaimana Ia menyatakan diri-Nya.
- source_word: לְאֶחָי
  choice: kepada saudara-saudaraku
  rationale: Bentuk Ibrani secara harfiah adalah nomina maskulin jamak dengan akhiran orang pertama. Dalam bahasa Indonesia, “saudara-saudara” mempertahankan bentuk kekeluargaan dan dapat merujuk kepada sesama anggota komunitas; kemungkinan cakupan inklusif dijelaskan dalam catatan kaki.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah
  rationale: Mempertahankan gambaran pemazmur berada dalam perhimpunan dan memberi nada puitis yang alami.
- source_word: קָהָל
  choice: jemaah
  rationale: קָהָל berarti kelompok yang berhimpun. “Jemaah” merupakan padanan Indonesia yang lazim dan ringkas untuk komunitas ibadah yang berkumpul, tanpa harus menunjuk pada lembaga tertentu.
- source_word: אֲהַלְלֶךָּ
  choice: aku akan memuji-Mu
  rationale: Bentuk piel dari הלל secara langsung berarti “memuji”; akhiran objek orang kedua dipertahankan sebagai “-Mu”.
theological_decisions:
- issue: Istilah kekerabatan maskulin dalam konteks ibadah bersama
  choice: kepada saudara-saudaraku
  alternative: kepada saudara-saudaraku, laki-laki dan perempuan
  rationale: Teks Ibrani memakai bentuk maskulin jamak, sehingga bentuk utama tidak diperluas secara eksplisit. Namun, karena istilah itu dapat berfungsi secara representatif bagi komunitas, kemungkinan makna inklusif dicatat tanpa menutup ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kata ganti ilahi ditulis dengan huruf kapital menurut kelaziman penerbitan Alkitab Indonesia. “Jemaah” dipilih daripada “perkumpulan” agar konteks ibadah tetap jelas tanpa mempersempitnya menjadi istilah kelembagaan.
