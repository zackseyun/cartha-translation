  text: סְ֭בָבוּ/נִי פָּרִ֣ים רַבִּ֑ים אַבִּירֵ֖י בָשָׁ֣ן כִּתְּרֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/012.yaml
  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
translation:
  language: id
  text: 'Banyak lembu jantan mengelilingi aku;

    lembu-lembu perkasa dari Basan[a] mengepung aku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Basan adalah wilayah di sebelah timur Sungai Yordan yang terkenal dengan padang rumputnya yang subur dan ternaknya yang kuat serta gemuk. Ungkapan ini menggambarkan lawan-lawan yang kuat dan mengancam.
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: mengelilingi aku
  rationale: Berasal dari סבב, ‘mengelilingi’ atau ‘berputar mengitari’. Bentuk perfektif menggambarkan pemazmur telah terkepung; bentuk kini dalam bahasa Indonesia menjaga daya hidup puisi tanpa menekankan aspek secara berlebihan.
- source_word: פָּרִים רַבִּים
  choice: banyak lembu jantan
  rationale: פָּרִים adalah bentuk jamak dari פַּר, yaitu ‘lembu jantan’ atau ‘lembu jantan muda’, sedangkan רַבִּים berarti ‘banyak’. Pilihan ini mempertahankan metafora hewan yang mengancam.
- source_word: אַבִּירֵי בָשָׁן
  choice: lembu-lembu perkasa dari Basan
  rationale: אַבִּירֵי dapat berarti ‘yang kuat/perkasa’. Karena frasa ini sejajar dan beraposisi dengan ‘lembu jantan’, unsur lembu dinyatakan kembali agar citra hewannya tetap jelas. בָשָׁן dipertahankan sebagai nama tempat ‘Basan’.
- source_word: כִּתְּרוּנִי
  choice: mengepung aku
  rationale: Dari כתר, ‘mengelilingi’ atau ‘mengepung’. ‘Mengepung’ mempertahankan paralelisme dengan baris pertama sekaligus menonjolkan ancaman tanpa pengulangan kata yang kaku.
theological_decisions:
- issue: Metafora lembu untuk para lawan yang mengancam
  choice: Metafora dipertahankan secara langsung sebagai ‘lembu jantan’ dan ‘lembu-lembu perkasa’.
  alternative: Menafsirkannya dalam teks utama sebagai ‘musuh-musuh’ atau ‘orang-orang kuat’.
  rationale: Teks Ibrani menggambarkan para lawan melalui citra hewan yang hidup. Mempertahankan metafora menjaga kekuatan puitis dan tidak menyelesaikan identitas para pengepung secara interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. ‘Lembu jantan’ dipilih daripada ‘banteng’ karena lebih tepat bagi פַּר dan menghindari asosiasi spesies liar; ‘mengepung’ memberi variasi alami dalam paralelisme.
