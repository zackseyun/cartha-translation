base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/000.yaml
  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: id
  text: 'Untuk pemimpin musik: menurut “Rusa Betina Fajar”[a]. Mazmur Daud[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Rusa Betina Kala Fajar.” Ungkapan Ibrani ini kemungkinan besar adalah nama melodi atau gubahan musik.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “Mazmur Daud” dapat menunjukkan kepengarangan, hubungan, koleksi, atau peruntukan; bahasa Ibraninya tidak menentukan salah satunya secara lebih sempit.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, istilah ini menunjuk kepada orang yang memimpin pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: עַל
  choice: menurut
  rationale: Dalam petunjuk musik pada judul mazmur, kata ini dapat memperkenalkan melodi, corak, atau aturan pembawaan. “Menurut” mempertahankan keluasan maknanya tanpa secara tegas menambahkan kata “lagu” atau “nada” ke dalam teks utama.
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: “Rusa Betina Fajar”
  rationale: אַיֶּלֶת adalah bentuk feminin tunggal, sehingga “rusa betina” menyampaikan maknanya secara jelas. Tanda petik menandainya sebagai judul, yang kemungkinan besar merupakan nama melodi atau gubahan musik.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: “Mazmur” adalah padanan baku dan mudah dipahami untuk nyanyian yang lazimnya disertai musik.
- source_word: לְדָוִד
  choice: Daud
  rationale: Ungkapan ringkas “Mazmur Daud” mempertahankan bentuk judul yang alami dalam bahasa Indonesia. Catatan kaki menjelaskan bahwa preposisi Ibrani לְ dapat menandakan kepengarangan, hubungan, koleksi, atau peruntukan.
theological_decisions:
- issue: Fungsi frasa אַיֶּלֶת הַשַּׁחַר
  choice: Diperlakukan sebagai judul melodi atau petunjuk musik
  alternative: Dibaca sebagai judul simbolis atau tematis yang langsung menafsirkan isi mazmur
  rationale: Dalam susunan judul mazmur, frasa yang didahului עַל paling wajar berfungsi sebagai petunjuk pembawaan atau nama melodi. Terjemahan mempertahankan bentuk judul tanpa memasukkan tafsiran simbolis.
- issue: Makna לְדָוִד
  choice: Diterjemahkan secara luas sebagai “Mazmur Daud”
  alternative: Diperjelas secara sempit menjadi “Mazmur karya Daud” atau “Mazmur untuk Daud”
  rationale: Preposisi Ibrani dalam judul mazmur tidak menentukan hanya satu hubungan. Bentuk yang dipilih tidak memastikan kepengarangan ataupun peruntukan, dan ambiguitas tersebut dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan khidmat yang sesuai untuk judul mazmur. “Pemimpin musik” dipilih karena jelas bagi pembaca umum; tanda petik menandai nama melodi. Semua penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkan.
