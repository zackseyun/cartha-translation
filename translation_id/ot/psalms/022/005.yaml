base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: id
  text: Kepada-Mu mereka berseru dan diselamatkan[a]; kepada-Mu mereka percaya dan tidak dipermalukan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diluputkan” atau “lolos.” Kata Ibrani ini dapat menunjuk pada tindakan diselamatkan maupun keberhasilan melepaskan diri; dalam konteks ini, keselamatan terjadi sesudah mereka berseru kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak mendapat malu” atau “tidak dikecewakan.” Ungkapan Ibrani ini dapat menyatakan bahwa kepercayaan mereka tidak berakhir dengan rasa malu atau kehinaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: Kepada-Mu
  rationale: Preposisi אֶל dengan akhiran orang kedua tunggal menunjukkan arah seruan kepada Allah. “Kepada-Mu” alami dan tetap menjaga bentuk sapaan langsung.
- source_word: זָעֲקוּ
  choice: mereka berseru
  rationale: זעק menyatakan seruan kuat, khususnya permohonan pertolongan dalam kesesakan. “Berseru” mempertahankan intensitas itu dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: וְנִמְלָטוּ
  choice: dan diselamatkan
  rationale: Bentuk Nifal dari מלט dapat berarti lolos atau dilepaskan/diselamatkan. Dalam konteks seruan kepada Allah, “diselamatkan” menyampaikan pertolongan yang diterima tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: בְּךָ
  choice: kepada-Mu
  rationale: Dengan בטח, preposisi ב menandai pihak yang menjadi sandaran kepercayaan. Ungkapan Indonesia “percaya kepada-Mu” lebih alami daripada terjemahan harfiah “di dalam-Mu”.
- source_word: בָטְחוּ
  choice: mereka percaya
  rationale: בטח berarti percaya atau mengandalkan. “Percaya” ringkas, alami, dan cocok dengan objek personal yang diperkenalkan oleh “kepada”.
- source_word: וְלֹא בֹשׁוּ
  choice: dan tidak dipermalukan
  rationale: בוש dalam konteks kepercayaan dapat menunjuk pada rasa malu, kekecewaan, atau kehinaan akibat harapan yang gagal. “Tidak dipermalukan” paling baik mempertahankan dimensi kehormatan-kehinaan dan nuansa hasil yang dialami.
theological_decisions:
- issue: Sifat keselamatan yang dinyatakan oleh נִמְלָטוּ
  choice: diselamatkan sebagai hasil seruan kepada Allah
  alternative: lolos tanpa penekanan tersurat pada pelaku ilahi
  rationale: Urutan seruan kepada Allah lalu keselamatan menyiratkan pertolongan-Nya, tetapi bentuk terjemahan tidak menambahkan pelaku secara eksplisit karena teks Ibrani juga tidak menyebutkannya pada verba ini.
- issue: Nuansa kehormatan dan rasa malu dalam בֹשׁוּ
  choice: tidak dipermalukan
  alternative: tidak merasa malu; tidak dikecewakan
  rationale: Pilihan ini mempertahankan kemungkinan bahwa mereka tidak mengalami kehinaan karena kepercayaan mereka, alih-alih membatasi makna pada emosi batin atau kekecewaan semata.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme dua klausa dipertahankan melalui pengulangan “kepada-Mu mereka,” sedangkan kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
