  text: They open their mouth against me like a tearing and roaring lion[a].
translation:
  language: id
  text: Mereka membuka lebar mulutnya terhadapku seperti singa yang mencabik dan mengaum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka membuka lebar mulutnya terhadapku—singa yang mencabik dan mengaum.” Bahasa Ibrani menyajikan gambaran singa secara padat tanpa kata “seperti” yang tersurat.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצוּ
  choice: mengangakan
  rationale: Bentuk dari פצה berarti membuka lebar. Dalam puisi ini, bentuk perfektif dapat diungkapkan dengan kala kini untuk menghadirkan ancaman secara hidup; 'mengangakan' secara alami menyatakan mulut yang terbuka lebar.
- source_word: עָלַי
  choice: terhadap aku
  rationale: Preposisi עַל di sini menunjukkan arah yang bermusuhan. 'Terhadap aku' mempertahankan nuansa perlawanan sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: פִּיהֶם
  choice: mulut
  rationale: Teks Ibrani memakai nomina tunggal dengan sufiks jamak. Bahasa Indonesia dapat mempertahankan bentuk tunggal distributif secara alami setelah subjek jamak.
- source_word: אַרְיֵה
  choice: seperti singa
  rationale: Bahasa Ibrani menyajikan citra singa secara padat tanpa partikel pembanding. 'Seperti' membuat fungsi perbandingannya jelas dan alami dalam bahasa Indonesia tanpa meniadakan bentuk alternatif yang lebih harfiah.
- source_word: טֹרֵף
  choice: yang menerkam
  rationale: Partisipel Qal dari טרף menggambarkan tindakan pemangsa yang mencabik atau menerkam. 'Menerkam' merupakan ungkapan modern dan hidup yang cocok dengan tindakan singa.
- source_word: וְשֹׁאֵג
  choice: dan mengaum
  rationale: שׁאג adalah verba lazim untuk suara auman singa; 'mengaum' merupakan padanan langsung dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Bentuk kini mempertahankan daya hidup adegan, sedangkan citra singa tetap padat dan kuat.
