  text: I can count all my bones[a]; they look[b], they stare at me.
translation:
  language: id
  text: Aku dapat menghitung semua tulangku[a]; mereka memandang dan menatap aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku menghitung semua tulangku.” Kata kerja Ibrani dapat berarti “menghitung” atau “menceritakan kembali”, tetapi objek “semua tulangku” mendukung makna menghitungnya satu per satu.
    reason: lexical_alternative
  - marker: b
    text: Kedua kata kerja Ibrani untuk melihat dipasangkan sebagai penegasan; dapat juga diterjemahkan “mereka memandang dan melihat aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפֵּר
  choice: Aku dapat menghitung
  rationale: Bentuk piel dari ספר dapat berarti “menghitung” atau “menceritakan”. Dengan objek “semua tulangku”, makna menghitung satu per satu paling sesuai; “dapat menghitung” menyampaikan keadaan tulang-tulang yang tampak jelas akibat penderitaan atau tubuh yang sangat kurus tanpa menambah penafsiran ke dalam teks.
- source_word: כָּל
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh yang dinyatakan dalam bahasa Ibrani.
- source_word: עַצְמוֹתָי
  choice: tulangku
  rationale: Terjemahan langsung ini mempertahankan gambaran jasmani yang kuat dan alami dalam bahasa Indonesia.
- source_word: הֵמָּה
  choice: mereka
  rationale: Kata ganti mandiri yang bersifat menegaskan ini menunjuk kepada orang-orang yang menyaksikan penderitaan si pembicara; subjek eksplisit “mereka” dipertahankan.
- source_word: יַבִּיטוּ
  choice: memandang
  rationale: Kata kerja ini menyatakan tindakan melihat dengan perhatian. “Memandang” alami dan cukup kuat, sementara kata kerja berikutnya mempertegas tatapan itu.
- source_word: יִרְאוּ
  choice: menatap
  rationale: Secara dasar berarti “melihat”, tetapi dalam pasangan puitis ini “menatap” menyampaikan perhatian visual yang terus tertuju kepada si pembicara tanpa terlalu menafsirkan sikap para pengamat.
- source_word: בִי
  choice: aku
  rationale: Dengan kata kerja “memandang” dan “menatap”, bahasa Indonesia secara alami memakai objek langsung “aku”; makna arah tatapan kepada si pembicara tetap terpelihara.
theological_decisions:
- issue: Penggunaan mesianik dalam tradisi Kristen
  choice: Menerjemahkan menurut makna puitis teks Ibrani sebagai ratapan tentang penderitaan jasmani yang terlihat dan para pengamat yang terus memandang.
  alternative: Memakai ungkapan yang secara khusus membangkitkan gambaran penyaliban atau memperkuat gema kristologis.
  rationale: Mazmur 22 penting dalam penafsiran Kristen, tetapi ayat ini sendiri tidak memakai istilah yang khusus menunjuk kepada penyaliban. Terjemahan mempertahankan gambaran Ibraninya sehingga hubungan kanonik dan kristologis dapat muncul dari konteks, bukan dari tambahan penerjemah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur dua klausa dan pengulangan kata kerja penglihatan dipertahankan untuk mencerminkan paralelisme Ibrani. Tanda catatan kaki [a] dan [b] ditempatkan pada bagian teks yang dijelaskannya.
