source:
  edition: WLC
  text: יָ֭בֹאוּ וְ/יַגִּ֣ידוּ צִדְקָת֑/וֹ לְ/עַ֥ם נ֝וֹלָ֗ד כִּ֣י עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/031.yaml
  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: id
  text: Mereka akan datang dan memberitakan kebenaran-Nya[a] kepada suatu umat yang belum lahir[b], bahwa Ia telah melakukannya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan-Nya.” Kata Ibrani ini dapat berarti kebenaran dalam arti luas, termasuk tindakan yang adil dan menyelamatkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang akan lahir.”
    reason: lexical_alternative
  - marker: c
    text: Atau “sebab Ia telah melakukannya.” Klausa penutup dalam bahasa Ibrani sangat ringkas dan dapat dipahami sebagai isi yang diberitakan atau sebagai alasan pemberitaan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: Mereka akan datang
  rationale: Bentuk imperfek Qal orang ketiga jamak menunjuk pada tindakan mendatang; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: וְיַגִּידוּ
  choice: dan memberitakan
  rationale: Bentuk Hifil dari נגד berarti membuat sesuatu diketahui atau mengumumkannya. “Memberitakan” mempertahankan nada kesaksian publik dalam mazmur.
- source_word: צִדְקָתוֹ
  choice: kebenaran-Nya
  rationale: צדקה mencakup kelurusan, keadilan, dan dalam Mazmur juga tindakan benar yang menyelamatkan. “Kebenaran-Nya” mempertahankan keluasan makna, sementara alternatif “keadilan-Nya” dicatat dalam catatan kaki.
- source_word: לְעַם
  choice: kepada suatu umat
  rationale: Preposisi ל menandai penerima pemberitaan, dan עַם tidak tentu. “Suatu umat” mempertahankan ketidaktentuan itu.
- source_word: נוֹלָד
  choice: yang belum lahir
  rationale: Partisip pasif dari ילד menerangkan umat yang kelahirannya masih akan datang. Bentuk ini alami dan mempertahankan arah masa depan.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי paling mungkin memperkenalkan isi yang akan diberitakan, tetapi fungsi kausal “sebab” tetap mungkin dan dicatat dalam catatan kaki.
- source_word: עָשָׂה
  choice: Ia telah melakukannya
  rationale: Perfek Qal dari עשה menyatakan bahwa Ia telah melakukan atau menyelesaikan sesuatu. Objek tidak dinyatakan dalam bahasa Ibrani; “-nya” melengkapinya secara wajar tanpa memperinci tindakan yang sengaja dibiarkan tersirat.
theological_decisions:
- issue: Cakupan makna צִדְקָתוֹ
  choice: kebenaran-Nya
  alternative: keadilan-Nya
  rationale: Istilah Ibrani dapat menunjuk baik pada kebenaran maupun keadilan, termasuk tindakan benar yang menyelamatkan. Teks utama mempertahankan istilah yang luas, dan catatan kaki menjaga alternatif yang sah.
- issue: Fungsi klausa penutup כִּי עָשָׂה
  choice: bahwa Ia telah melakukannya
  alternative: sebab Ia telah melakukannya
  rationale: Klausa Ibrani sangat ringkas dan dapat dipahami sebagai isi pemberitaan atau alasan pemberitaan. Teks utama memilih pembacaan isi tanpa meniadakan pembacaan kausal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Memberitakan” menjaga sifat publik dari tindakan tersebut; “suatu umat yang belum lahir” jelas bagi pembaca umum dan tetap dekat dengan susunan Ibrani. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penulisan Alkitab bahasa Indonesia.
