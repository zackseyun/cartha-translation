source:
  edition: WLC
  text: גֹּ֣ל אֶל יְהוָ֣ה יְפַלְּטֵ֑/הוּ יַ֝צִּילֵ֗/הוּ כִּ֘י חָ֥פֵֽץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/008.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: id
  text: “Serahkanlah dirimu kepada Yahweh[a]! Biarlah Dia meluputkannya, biarlah Dia membebaskannya, sebab Dia berkenan kepadanya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Gulingkanlah kepada Yahweh.” Ungkapan ini berarti menyerahkan atau memercayakan diri maupun perkara kepada-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: Serahkanlah dirimu
  rationale: Bentuk perintah ini secara harfiah berarti ‘gulingkanlah’, tetapi dalam ungkapan dengan אֶל dan nama ilahi bermakna menyerahkan atau memercayakan diri maupun perkara kepada Allah. ‘Serahkanlah dirimu’ menyampaikan idiom itu secara wajar tanpa menghilangkan nada ejekan.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah menuju Yahweh; ‘kepada’ merupakan padanan Indonesia yang alami dalam ungkapan ‘menyerahkan diri kepada’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: יְפַלְּטֵהוּ
  choice: Biarlah Dia meluputkannya
  rationale: פלט dalam piel menyatakan tindakan membuat seseorang lolos atau menyelamatkannya dari bahaya. ‘Meluputkan’ mempertahankan nuansa ini sekaligus membedakannya dari kata kerja paralel berikutnya.
- source_word: יַצִּילֵהוּ
  choice: biarlah Dia membebaskannya
  rationale: נצל dalam hiphil berarti membebaskan, melepaskan, atau merenggut dari bahaya. ‘Membebaskan’ alami dalam konteks ini dan menjaga paralelisme tanpa menyamakan kedua verba.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memberikan alasan bagi tantangan yang diucapkan para pengejek.
- source_word: חָפֵץ בּוֹ
  choice: Dia berkenan kepadanya
  rationale: Ungkapan חפץ ב berarti berkenan kepada atau bersukacita dalam seseorang. ‘Berkenan kepadanya’ terdengar alami, bermartabat, dan sesuai dengan konteks relasional.
theological_decisions:
- issue: Ejekan dalam kutipan dan peralihan rujukan pronominal
  choice: Mempertahankan perintah orang kedua ‘Serahkanlah dirimu’ lalu akhiran orang ketiga ‘-nya’ pada klausa-klausa berikutnya.
  alternative: Menyeragamkan seluruh ayat sebagai orang ketiga, misalnya ‘Ia menyerahkan dirinya kepada Yahweh’ atau ‘Serahkan dia kepada Yahweh’.
  rationale: Teks Masoret memuat imperatif orang kedua tunggal tanpa objek eksplisit, disusul verba dengan akhiran objek orang ketiga tunggal. Terjemahan mempertahankan ketegangan gramatikal dan retorika ejekan itu, bukan diam-diam menyeragamkannya. Huruf kapital pada ‘Dia’ menunjukkan bahwa subjek verba penyelamatan adalah Yahweh, sedangkan ‘-nya’ merujuk kepada orang yang menderita.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan ‘biarlah Dia’ mempertahankan paralelisme dan nada tantangan. Bentuk ‘meluputkan’ dan ‘membebaskan’ dipilih untuk membedakan dua verba Ibrani yang berdekatan maknanya.
