lexical_decisions:
- source_word: בְּךָ
  choice: Kepada-Mu
  rationale: Preposisi ב dengan sufiks orang kedua tunggal menandai Pribadi yang menjadi tumpuan kepercayaan. “Kepada-Mu” merupakan ungkapan Indonesia yang alami dan tidak menambahkan makna eksklusif yang tidak dinyatakan oleh teks.
- source_word: בָּטְחוּ
  choice: percaya
  rationale: Kata בטח menyatakan kepercayaan atau ketergantungan yang teguh. “Percaya” ringkas, mudah dipahami, dan memungkinkan pengulangan verba Ibrani dipertahankan.
- source_word: אֲבֹתֵינוּ
  choice: para bapak leluhur kami
  rationale: Bentuk Ibrani secara harfiah berarti “bapak-bapak kami” dan dapat menunjuk kepada generasi pendahulu. “Para bapak leluhur kami” mempertahankan bentuk maskulin serta memperjelas acuan historisnya dalam bahasa Indonesia modern.
- source_word: בָּטְחוּ
  choice: mereka percaya
  rationale: Pengulangan dipertahankan karena teks Ibrani mengulang verba yang sama untuk memberi penekanan, bukan menghaluskannya menjadi ungkapan lain.
- source_word: וַתְּפַלְּטֵמוֹ
  choice: dan Engkau meluputkan mereka
  rationale: Verba פלט berarti meluputkan, menyelamatkan, atau membuat lolos dari bahaya. “Meluputkan” mempertahankan gagasan pembebasan dari ancaman tanpa menentukan bentuk bahayanya.
theological_decisions:
- issue: Cakupan historis dan bentuk maskulin אֲבֹתֵינוּ
  choice: para bapak leluhur kami
  alternative: leluhur kami
  rationale: Teks memakai istilah kekerabatan maskulin jamak, tetapi dalam konteks ini istilah itu menunjuk kepada generasi terdahulu Israel. Terjemahan utama mempertahankan unsur maskulin sekaligus membuat fungsi historisnya jelas; alternatif yang lebih umum dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “Kepada-Mu” di awal mempertahankan penekanan sumber, sedangkan pengulangan “percaya” dipertahankan untuk mencerminkan gaya puitis Ibrani.
