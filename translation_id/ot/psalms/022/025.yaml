base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: id
  text: Dari-Mulah datang pujianku dalam jemaah yang besar; nazar-nazarku akan kutunaikan di hadapan orang-orang yang takut kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “orang-orang yang takut kepada-Nya”; sebagian terjemahan mengubahnya menjadi “orang-orang yang takut kepada-Mu” agar selaras dengan sapaan langsung sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: Dari-Mulah
  rationale: Preposisi dengan akhiran orang kedua tunggal maskulin menyatakan sumber atau asal. Bentuk penegasan “Dari-Mulah” alami dalam bahasa Indonesia dan mempertahankan bahwa pujian pemazmur bersumber dari Allah.
- source_word: תְהִלָּתִי
  choice: pujianku
  rationale: Nomina ini berarti pujian atau ungkapan syukur. “Pujianku” merupakan padanan langsung tanpa menambahkan gagasan nyanyian atau persembahan yang tidak dinyatakan secara eksplisit.
- source_word: בְּקָהָל רָב
  choice: dalam jemaah yang besar
  rationale: קָהָל menunjuk kepada umat atau perhimpunan yang berkumpul, sedangkan רָב menerangkan kebesaran atau banyaknya perhimpunan itu. “Jemaah” sesuai dengan konteks ibadah dan mudah dipahami.
- source_word: נְדָרַי
  choice: nazar-nazarku
  rationale: Bentuk jamak ini menunjuk kepada janji-janji khidmat yang dibuat kepada Allah. “Nazar-nazarku” mempertahankan istilah keagamaan yang mapan dan jumlah jamaknya.
- source_word: אֲשַׁלֵּם
  choice: akan kutunaikan
  rationale: Dalam bentuk piel dan dengan nazar sebagai objek, verba ini berarti membayar atau memenuhi apa yang telah dijanjikan. “Menunaikan nazar” adalah ungkapan Indonesia yang alami dan tepat.
- source_word: נֶגֶד
  choice: di hadapan
  rationale: Preposisi ini menyatakan keberadaan di depan atau dalam kehadiran pihak lain. “Di hadapan” sesuai dengan suasana ibadah publik.
- source_word: יְרֵאָיו
  choice: orang-orang yang takut kepada-Nya
  rationale: Partisip dengan akhiran orang ketiga tunggal berarti mereka yang takut kepada-Nya. Ungkapan ini mempertahankan bahasa takut akan Allah yang mencakup rasa gentar dan hormat, tanpa melembutkannya menjadi sekadar menghormati.
theological_decisions:
- issue: Peralihan dari sapaan orang kedua (“-Mu”) kepada rujukan orang ketiga (“-Nya”)
  choice: 'Mempertahankan peralihan teks Masoret: “Dari-Mulah ... takut kepada-Nya”'
  alternative: 'Menyeragamkan menjadi orang kedua: “takut kepada-Mu”'
  rationale: Teks Ibrani beralih dari akhiran orang kedua pada מֵאִתְּךָ kepada akhiran orang ketiga pada יְרֵאָיו. Peralihan itu dipertahankan sebagai ciri asli teks, sementara catatan kaki menjelaskan alternatif yang sering dipakai demi konsistensi. Dalam konteksnya, keduanya tetap merujuk kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penulisan Alkitab bahasa Indonesia. Istilah “jemaah” dan “nazar” dipertahankan karena mapan dan jelas dalam konteks ibadah.
