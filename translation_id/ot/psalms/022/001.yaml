  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: id
  text: Allahku, Allahku, mengapa Engkau meninggalkan aku? Kata-kata raunganku jauh dari keselamatanku.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasanku” atau “pertolonganku.” Kata Ibrani יְשׁוּעָה dapat berarti keselamatan, pembebasan, atau pertolongan.
    reason: lexical_alternative
  - marker: b
    text: Klausa ini juga dapat dipahami, “Engkau jauh dari menyelamatkan aku, dari kata-kata raunganku.” “Raungan” menggambarkan jeritan keras karena penderitaan; dapat juga diterjemahkan “rintihan” atau “jeritan.”
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: אֵלִי אֵלִי
  choice: Allahku, Allahku
  rationale: Mempertahankan sapaan langsung, akhiran kepunyaan orang pertama, dan pengulangan yang mengungkapkan kepedihan.
- source_word: לָמָה
  choice: mengapa
  rationale: Padanan Indonesia yang alami bagi pertanyaan tentang alasan dan tetap mempertahankan daya ratapan.
- source_word: עֲזַבְתָּנִי
  choice: Engkau meninggalkan aku
  rationale: Kata kerja ini dapat berarti meninggalkan atau menelantarkan. Pilihan ini akurat, wajar, dan tidak mempersempit nuansanya secara berlebihan.
- source_word: רָחוֹק מִישׁוּעָתִי
  choice: jauh dari keselamatanku
  rationale: Mempertahankan susunan padat teks Ibrani. יְשׁוּעָה dapat menunjuk pada keselamatan, pembebasan, atau pertolongan konkret.
- source_word: דִּבְרֵי שַׁאֲגָתִי
  choice: kata-kata raunganku
  rationale: Mempertahankan hubungan konstruksi harfiah serta citra kuat שְׁאָגָה, yaitu raungan atau jeritan keras dalam penderitaan.
theological_decisions:
- issue: Makna יְשׁוּעָה dalam mazmur yang kemudian dikutip dalam Perjanjian Baru
  choice: keselamatanku
  alternative: pembebasanku; pertolonganku
  rationale: ‘Keselamatan’ mencakup tindakan penyelamatan yang diharapkan pemazmur tanpa memaksakan pengertian doktrinal yang lebih sempit; alternatif konkretnya dicatat dalam catatan kaki.
- issue: Konstruksi sintaksis klausa kedua
  choice: Kata-kata raunganku jauh dari keselamatanku
  alternative: Engkau jauh dari menyelamatkan aku, jauh dari kata-kata raunganku
  rationale: Bahasa Ibrani sangat padat dan memungkinkan lebih dari satu hubungan sintaksis. Teks utama mempertahankan pembacaan yang menjadikan ‘kata-kata raunganku’ sebagai pokok, sedangkan pembacaan yang memasok ‘Engkau’ sebagai pokok tersirat dicatat tanpa meniadakan ketegangan asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ‘Allahku’ dan citra ‘raungan’ dipertahankan untuk menjaga intensitas ratapan; susunan klausa kedua sengaja agak padat karena mencerminkan ambiguitas puisi Ibrani.
