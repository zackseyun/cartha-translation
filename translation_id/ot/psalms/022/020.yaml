base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/020.yaml
  text: Deliver my life from the sword[c][b][a], my only one from the power of the dog.
translation:
  language: id
  text: Selamatkanlah nyawaku[a] dari pedang, yang satu-satunya milikku[b] dari kuasa[c] anjing itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jiwaku” atau “diriku.” Kata Ibrani נַפְשִׁי dapat menunjuk pada nyawa, diri, atau jiwa, bergantung pada konteks.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “yang satu-satunya milikku”; dalam konteks ini dapat mengacu pada nyawa atau hidup yang berharga.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “dari tangan.” Dalam ungkapan ini, “tangan” berarti kuasa atau kendali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  choice: Selamatkanlah
  rationale: Bentuk imperatif ini menyampaikan permohonan langsung dan mendesak agar dibebaskan dari bahaya.
- source_word: מֵחֶרֶב
  choice: dari pedang
  rationale: Preposisi מִן menyatakan pemisahan dari ancaman; bentuk ini juga mempertahankan gambaran konkret pedang sebagai bahaya maut.
- source_word: נַפְשִׁי
  choice: nyawaku
  rationale: Dalam konteks ancaman maut, נֶפֶשׁ terutama menunjuk pada hidup atau diri yang hidup, bukan secara khusus unsur rohani yang terpisah dari tubuh.
- source_word: מִיַּד
  choice: dari kuasa
  rationale: Ungkapan harfiah 'dari tangan' secara idiomatis berarti dilepaskan dari kuasa atau kendali pihak lain. 'Dari kuasa' jelas dalam bahasa Indonesia modern.
- source_word: כֶּלֶב
  choice: anjing itu
  rationale: Bentuk Ibrani tunggal dan tertentu dipertahankan tanpa menafsirkan anjing tersebut secara eksplisit sebagai kelompok musuh.
- source_word: יְחִידָתִי
  choice: hidupku satu-satunya
  rationale: Kata ini secara harfiah menunjuk pada 'milikku yang satu-satunya'; dalam kesejajaran dengan נַפְשִׁי, ungkapan ini paling wajar dipahami sebagai satu-satunya hidup yang dimiliki pemazmur, sambil mempertahankan unsur keunikan.
theological_decisions:
- issue: Makna antropologis נַפְשִׁי dalam ratapan
  choice: Diterjemahkan 'nyawaku'
  alternative: '''jiwaku'' atau ''diriku'''
  rationale: Konteksnya adalah permohonan pembebasan dari kematian akibat pedang dan musuh. 'Nyawaku' menyampaikan hidup sang pemazmur tanpa memasukkan konsep teknis tentang pemisahan tubuh dan jiwa.
- issue: Acuan יְחִידָתִי
  choice: Diterjemahkan secara kontekstual sebagai 'hidupku satu-satunya'
  alternative: '''milikku yang satu-satunya'' atau ''jiwaku yang berharga'''
  rationale: Bentuk Ibrani tidak menyebut nomina acuannya secara eksplisit. Kesejajaran dengan 'nyawaku' mendukung acuan pada hidup, tetapi catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah dan nuansa 'berharga'.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan langsung. Paralelisme puisi Ibrani dipertahankan, sementara idiom 'dari tangan' dijelaskan sebagai 'dari kuasa'. Gambaran tunggal 'anjing itu' tidak diperluas menjadi bentuk jamak atau ditafsirkan secara eksplisit sebagai musuh.
