  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: id
  text: 'Selamatkanlah aku dari mulut singa,

    dan dari tanduk lembu-lembu liar[a]—

    Engkau telah menjawabku.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banteng-banteng liar” atau “aurochs”; kata Ibrani ini menunjuk kepada sejenis sapi liar besar dan kuat.
    reason: lexical_alternative
  - marker: b
    text: 'Klausa terakhir dapat dipahami sebagai pernyataan mendadak bahwa doa telah dijawab: “Engkau telah menjawabku,” yang menandai peralihan dari permohonan kepada keyakinan. Klausa ini juga dapat dipahami sebagai kelanjutan permohonan sebelumnya.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Selamatkanlah aku
  rationale: Bentuk imperatif hifil dengan akhiran orang pertama tunggal menyatakan permohonan langsung dan mendesak agar dilepaskan dari bahaya.
- source_word: מִפִּי
  choice: dari mulut
  rationale: Mempertahankan gambaran harfiah Ibrani; ungkapan ini tetap alami dan jelas dalam bahasa Indonesia.
- source_word: אַרְיֵה
  choice: singa
  rationale: Nomina tunggal tanpa artikel dapat dinyatakan secara alami sebagai gambaran generik dalam puisi Indonesia.
- source_word: וּמִקַּרְנֵי
  choice: dan dari tanduk
  rationale: Konjungsi dan preposisi meneruskan permohonan kepada bahaya kedua, sedangkan gambaran tanduk dipertahankan secara konkret.
- source_word: רֵמִים
  choice: lembu-lembu liar
  rationale: Merujuk pada bovina liar yang kuat. Pilihan ini mudah dipahami pembaca modern dan menghindari terjemahan tradisional yang keliru seperti 'unicorn'.
- source_word: עֲנִיתָנִי
  choice: Engkau telah menjawab aku
  rationale: Bentuk qal perfektif orang kedua maskulin tunggal dengan akhiran orang pertama tunggal secara langsung berarti 'Engkau menjawab aku'; bentuk 'telah menjawab' menandai hasil yang kini diyakini dan mempertahankan perubahan nada yang mendadak.
theological_decisions:
- issue: Apakah עֲנִיתָנִי merupakan kelanjutan permohonan atau pernyataan bahwa doa telah dijawab
  choice: 'Pernyataan: “Engkau telah menjawab aku”'
  alternative: Memahaminya sebagai bagian dari permohonan yang berlanjut, misalnya “jawablah aku dari tanduk lembu-lembu liar”
  rationale: Teks memakai bentuk perfektif, bukan imperatif. Pernyataan yang mendadak ini selaras dengan titik balik mazmur dari ratapan menuju keyakinan dan pujian, tetapi catatan kaki mengakui adanya kemungkinan sintaktis lain.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis. Paralelisme serta citra konkret teks Ibrani dipertahankan. Huruf kapital pada “Engkau” mengikuti register religius Indonesia tanpa menambahkan penafsiran denominasi.
