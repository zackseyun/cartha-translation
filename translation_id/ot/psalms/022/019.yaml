  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: id
  text: Namun Engkau, ya Yahweh, janganlah jauh; ya kekuatanku,[a] segeralah menolong aku!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani “kekuatanku”. Kata ini juga dipahami oleh sebagian orang sebagai “pertolonganku”, atau—kemungkinan lebih kecil dalam konteks ini—berkaitan secara harfiah dengan rusa betina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Namun Engkau
  rationale: Konjungsi yang diikuti kata ganti mandiri menandai kontras kuat dengan penderitaan sebelumnya. “Namun Engkau” menyampaikan peralihan itu secara alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אַל תִּרְחָק
  choice: janganlah jauh
  rationale: Bentuk larangan ini merupakan permohonan langsung agar Yahweh tidak berada jauh. Ungkapan ringkas ini alami dalam bahasa Indonesia dan mempertahankan citra jarak dari teks sumber.
- source_word: אֱיָלוּתִי
  choice: kekuatanku
  rationale: Dalam konteks seruan kepada Allah untuk segera menolong, kata ini paling masuk akal dipahami secara kiasan sebagai “kekuatanku”. Karena bentuk dan maknanya tidak sepenuhnya pasti, alternatif penting dicatat dalam catatan kaki.
- source_word: לְעֶזְרָתִי
  choice: menolong aku
  rationale: Frasa ini secara harfiah menunjuk pada datang atau bertindak “untuk pertolonganku”. Dalam bahasa Indonesia, “menolong aku” menyampaikan arah dan tujuan permohonan dengan wajar.
- source_word: חוּשָׁה
  choice: segeralah
  rationale: Imperatif ini mengungkapkan urgensi. “Segeralah” mempertahankan desakan tanpa terdengar kuno atau terlalu percakapan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Sapaan אֱיָלוּתִי kepada Yahweh
  choice: ya kekuatanku
  alternative: pertolonganku; atau secara harfiah dikaitkan dengan rusa betina
  rationale: Konteks mendukung pengertian abstrak “kekuatan”, tetapi ketidakpastian leksikalnya tidak dihapus dan dicatat bagi pembaca.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang langsung dan mendesak. Partikel “ya” menandai sapaan kepada Yahweh dan kepada-Nya sebagai sumber kekuatan; tanda seru mempertahankan intensitas permohonan.
