  text: יִרְאֵ֤י יְהוָ֨ה הַֽלְל֗וּ/הוּ כָּל זֶ֣רַע יַעֲקֹ֣ב כַּבְּד֑וּ/הוּ וְ/ג֥וּרוּ מִ֝מֶּ֗/נּוּ כָּל זֶ֥רַע יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: id
  text: Hai orang-orang yang takut akan Yahweh, pujilah Dia! Seluruh keturunan Yakub, hormatilah Dia! Gentarlah terhadap Dia[a], seluruh keturunan Israel!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “takutlah kepada-Nya” atau “seganlah kepada-Nya.” Kata kerja Ibrani ini menyatakan rasa takut yang penuh hormat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: orang-orang yang takut akan Yahweh
  rationale: Frasa konstruksi ini menunjuk kepada mereka yang bercirikan takut kepada Yahweh. Partikel sapaan “Hai” memperjelas fungsi vokatif yang tersirat oleh rangkaian bentuk imperatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: הַלְלוּהוּ
  choice: pujilah Dia
  rationale: Bentuk imperatif jamak dengan sufiks orang ketiga tunggal maskulin berarti “pujilah Dia”; acuannya adalah Yahweh.
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: seluruh keturunan Yakub
  rationale: זֶרַע dipakai secara kolektif. “Seluruh keturunan” alami dalam bahasa Indonesia dan mempertahankan cakupan כָּל.
- source_word: כַּבְּדֻהוּ
  choice: hormatilah Dia
  rationale: Bentuk piel imperatif dari כבד menyerukan pemberian hormat yang semestinya. “Hormatilah” menyampaikan inti leksikalnya secara langsung.
- source_word: וְגוּרוּ מִמֶּנּוּ
  choice: gentarlah terhadap Dia
  rationale: גור dengan מִן di sini menyatakan rasa takut penuh hormat di hadapan Allah. “Gentarlah” mempertahankan unsur takut dan guncangan batin tanpa mereduksinya menjadi kekaguman biasa.
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: seluruh keturunan Israel
  rationale: Pilihan ini sejajar dengan “seluruh keturunan Yakub” dan mempertahankan keseimbangan puitis kedua baris.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan sebuah gelar.
- issue: Nuansa וְגוּרוּ מִמֶּנּוּ
  choice: gentarlah terhadap Dia
  alternative: takutlah kepada-Nya; berdirilah dengan takjub di hadapan-Nya; seganlah kepada-Nya
  rationale: Kata kerja ini memuat rasa takut yang penuh hormat. “Gentarlah” menjaga ketegangan antara rasa takut, hormat, dan penyembahan, serta membedakannya dari ירא pada sapaan pembuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Hai” mempertahankan sapaan langsung; “seluruh keturunan” dipakai secara konsisten untuk paralelisme puisi. Huruf kapital pada “Dia” mengikuti kebiasaan penghormatan dalam bahasa Indonesia tanpa mengubah rujukan pronominal teks.
