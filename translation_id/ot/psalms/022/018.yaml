translation:
  language: id
  text: Mereka membagi-bagikan pakaian-Ku di antara mereka, dan untuk pakaian-Ku mereka membuang undi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baris ini digaungkan dalam kisah-kisah Injil tentang penyaliban Yesus; lihat Mat. 27:35; Mrk. 15:24; Luk. 23:34; Yoh. 19:24.
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: membagi-bagikan
  rationale: Bentuk Piel imperfek orang ketiga jamak dari חלק menggambarkan tindakan membagi pakaian menjadi bagian-bagian. Bentuk ini alami dalam puisi naratif yang hidup.
- source_word: בְגָדַי
  choice: pakaianku
  rationale: בגד berarti pakaian atau helai pakaian. Pilihan ini alami dan bermartabat dalam bahasa Indonesia serta tetap dibedakan dari istilah kedua melalui kata 'sandanganku'.
- source_word: לָהֶם
  choice: di antara mereka
  rationale: Secara harfiah berarti 'bagi/kepada mereka'; bersama verba 'membagi', ungkapan ini menyampaikan pembagian dalam kelompok tersebut tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: לְבוּשִׁי
  choice: sandanganku
  rationale: לבוש menunjuk pada pakaian atau sandang. 'Sandanganku' mempertahankan kesejajaran sekaligus variasi leksikal terhadap בְגָדַי, tanpa mempersempitnya menjadi jenis pakaian tertentu.
- source_word: יַפִּילוּ גוֹרָל
  choice: membuang undi
  rationale: Bentuk Hiphil dari נפל bersama גורל merupakan idiom untuk menentukan pembagian melalui undian. 'Membuang undi' adalah padanan Indonesia yang lazim dan tidak diterjemahkan secara kaku sebagai 'menjatuhkan undi'.
theological_decisions:
- issue: Gema mesianik dan kutipan Perjanjian Baru
  choice: Menerjemahkan gambaran puitis Ibrani secara langsung tanpa memasukkan bahasa penyaliban ke dalam ayat.
  alternative: Terjemahan yang dibentuk oleh tradisi dengan menonjolkan penggenapannya dalam penyaliban Yesus.
  rationale: Mazmur ini digaungkan dalam kisah penyaliban, tetapi teks utama harus tetap mencerminkan bahasa Ibrani. Hubungan kanoniknya disampaikan melalui catatan kaki, bukan dengan mengubah makna harfiah ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Variasi 'pakaianku' dan 'sandanganku' mempertahankan paralelisme dua istilah Ibrani tanpa menyiratkan bahwa istilah kedua pasti menunjuk pada jubah tertentu.
