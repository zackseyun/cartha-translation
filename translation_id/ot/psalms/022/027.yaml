  text: יִזְכְּר֤וּ וְ/יָשֻׁ֣בוּ אֶל יְ֭הוָה כָּל אַפְסֵי אָ֑רֶץ וְ/יִֽשְׁתַּחֲו֥וּ לְ֝/פָנֶ֗י/ךָ כָּֽל מִשְׁפְּח֥וֹת גּוֹיִֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: id
  text: Seluruh penjuru bumi akan mengingat dan kembali kepada Yahweh[a], dan semua kaum dari bangsa-bangsa akan sujud di hadapan-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani יהוה ditransliterasikan “Yahweh.”
    reason: alternative_reading
  - marker: b
    text: Atau “akan menyembah di hadapan-Mu.” Kata Ibrani ini secara harfiah menunjuk pada tindakan membungkukkan atau merebahkan diri, sering sebagai tindakan penyembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: akan mengingat
  rationale: Bentuk Qal imperfek orang ketiga jamak dari זכר menyatakan tanggapan yang dipandang akan terjadi. “Mengingat” mempertahankan makna langsung tanpa menambahkan objek yang tidak dinyatakan dalam teks.
- source_word: וְיָשֻׁבוּ
  choice: dan kembali
  rationale: Kata שוב dengan אֶל menyatakan gerak berbalik atau kembali kepada seseorang. “Kembali” menjaga kemungkinan nuansa pertobatan tanpa menjadikannya eksplisit.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Preposisi אֶל menunjukkan arah, sedangkan nama ilahi יהוה ditransliterasikan “Yahweh” sebagai nama perjanjian, bukan diganti dengan gelar.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: seluruh penjuru bumi
  rationale: Ungkapan אַפְסֵי אָרֶץ menunjuk pada bagian-bagian bumi yang paling jauh. “Seluruh penjuru bumi” alami dalam bahasa Indonesia dan mempertahankan cakupan universal serta metonimia bagi para penghuninya.
- source_word: וְיִשְׁתַּחֲווּ
  choice: akan sujud
  rationale: Bentuk dari שחה menggambarkan tindakan membungkukkan atau merebahkan diri sebagai penghormatan. “Sujud” mempertahankan tindakan jasmaniah sekaligus memungkinkan konteks menyampaikan makna penyembahan.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Ungkapan harfiah “di depan wajah-Mu” secara idiomatis berarti “di hadapan-Mu.” Akhiran orang kedua tunggal dipertahankan karena pemazmur berbicara langsung kepada Allah.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: segala kaum bangsa-bangsa
  rationale: מִשְׁפְּחוֹת menunjuk pada kelompok keluarga atau kaum, dan גּוֹיִם pada bangsa-bangsa secara luas. Rumusan ini mempertahankan kedua unsur tanpa membatasinya pada pengertian teknis “bangsa bukan Yahudi.”
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama יהוה. “Yahweh” mempertahankan nama diri ilahi dan membedakannya dari gelar umum “Tuhan.”
- issue: Apakah וְיִשְׁתַּחֲווּ dinyatakan secara eksplisit sebagai menyembah
  choice: akan sujud
  alternative: akan menyembah
  rationale: Kata Ibrani menonjolkan tindakan bersujud yang dalam konteks ini merupakan penghormatan atau penyembahan. Terjemahan “sujud” menjaga citra konkret dan tidak menghapus keluasan maknanya.
- issue: Nuansa וְיָשֻׁבוּ sebagai pertobatan
  choice: dan kembali
  alternative: dan bertobat; dan berbalik
  rationale: Kembali kepada Yahweh dapat mengandung pertobatan, tetapi kata tersebut sendiri tidak secara eksklusif berarti pertobatan batin. “Kembali” mempertahankan ketegangan semantis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Seluruh penjuru bumi” mempertahankan idiom geografis Ibrani, sedangkan “segala kaum bangsa-bangsa” menjaga cakupan kolektif dan universal. Huruf kapital pada “-Mu” mengikuti kebiasaan penghormatan dalam penulisan religius Indonesia.
