  text: וְ/אַתָּ֥ה קָד֑וֹשׁ י֝וֹשֵׁ֗ב תְּהִלּ֥וֹת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/003.yaml
  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: id
  text: 'Namun Engkau kudus,

    bersemayam di atas puji-pujian Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tinggal di tengah puji-pujian Israel.” Kata Ibrani yang diterjemahkan “bersemayam” secara harfiah dapat berarti “duduk” atau “tinggal”, dan dalam konteks ini juga dapat menyiratkan bertakhta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Namun Engkau
  rationale: Konjungsi yang diikuti pronomina mandiri menandai kontras dengan ratapan sebelumnya. “Namun Engkau” menyatakan daya adversatif itu secara alami sekaligus mempertahankan sapaan orang kedua.
- source_word: קָדוֹשׁ
  choice: kudus
  rationale: Kata sifat ini menyatakan kekudusan Allah dalam arti yang utuh; “kudus” merupakan padanan baku, alami, dan bermartabat.
- source_word: יֹשֵׁב
  choice: bersemayam
  rationale: Partisip ini secara harfiah dapat berarti “duduk” atau “tinggal”, tetapi ketika dikenakan kepada Allah dapat membawa citra kerajaan. “Bersemayam” mempertahankan nuansa bertakhta sekaligus membiarkan kemungkinan makna tinggal tetap terdengar.
- source_word: תְּהִלּוֹת
  choice: puji-pujian
  rationale: Bentuk ulang “puji-pujian” secara alami mewakili nomina jamak Ibrani dan menunjuk pada berbagai ungkapan pujian.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan menurut bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Makna frasa יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל
  choice: Allah digambarkan bersemayam di atas puji-pujian Israel dalam citra kerajaan dan puitis.
  alternative: Allah tinggal di tengah/dalam puji-pujian Israel; atau frasa tersebut dipahami secara lebih harfiah sebagai “duduk”.
  rationale: Secara sintaksis, “puji-pujian Israel” paling wajar menjadi pelengkap partisip יֹשֵׁב. Ungkapan “bersemayam di atas” mempertahankan metafora kerajaan tanpa mengubahnya menjadi pernyataan abstrak, sedangkan catatan kaki menjaga ambiguitas leksikal aslinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan bermartabat. Kapitalisasi “Engkau” mengikuti kebiasaan penghormatan kepada Allah. Susunan dua baris mempertahankan kesejajaran puisi Ibrani.
