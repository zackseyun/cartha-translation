  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: id
  text: Orang-orang yang sengsara[a] akan makan dan menjadi kenyang[c]; orang-orang yang mencari Dia akan memuji Yahweh. Semoga hati kalian[b] hidup selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang rendah hati,” “orang-orang miskin,” atau “orang-orang yang lemah lembut.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hati kalian”; kata “hati” berbentuk tunggal, kemungkinan sebagai bentuk kolektif yang menunjuk kepada kehidupan batin komunitas yang disapa.
    reason: lexical_alternative
  - marker: c
    text: Dalam konteks mazmur ini, kegiatan makan mungkin mengacu kepada perjamuan kurban atau perjamuan nazar, meskipun ayat ini tidak menyatakannya secara eksplisit.
    reason: cultural_note
lexical_decisions:
- source_word: עֲנָוִים
  choice: orang-orang yang tertindas
  rationale: Kata ini dapat menunjuk kepada orang yang rendah hati, miskin, lemah lembut, atau tertindas. Dalam gerak mazmur dari penderitaan menuju pemulihan dan ibadah bersama, “orang-orang yang tertindas” paling jelas mempertahankan dimensi pengalaman dan sosialnya.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: akan makan dan menjadi kenyang
  rationale: Bentuk imperfek di sini paling wajar dipahami sebagai tindakan yang akan terjadi. “Menjadi kenyang” menyampaikan pemenuhan kebutuhan secara alami tanpa menambahkan jenis perjamuan yang tidak disebutkan.
- source_word: יְהַלְלוּ
  choice: akan memuji
  rationale: Menyampaikan respons ibadah yang dinyatakan oleh bentuk piel imperfek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: דֹּרְשָׁיו
  choice: orang-orang yang mencari Dia
  rationale: Partisip ini menggambarkan orang-orang yang terus mengarahkan diri kepada Yahweh. Pronomina “Dia” mempunyai rujukan yang jelas kepada Yahweh.
- source_word: יְחִי
  choice: Semoga ... hidup
  rationale: Walaupun bentuknya imperfek orang ketiga tunggal, konteks mendukung fungsi jusif sebagai berkat atau harapan.
- source_word: לְבַבְכֶם
  choice: hati kalian
  rationale: Teks Ibrani memakai kata benda tunggal “hati” dengan akhiran pemilik orang kedua jamak. Ungkapan Indonesia ini mempertahankan sapaan jamak dan bentuk “hati” tanpa memaksakan bentuk jamak.
- source_word: לָעַד
  choice: selama-lamanya
  rationale: Padanan Indonesia yang wajar dan bermartabat untuk durasi yang tidak berkesudahan.
theological_decisions:
- issue: Peralihan kepada sapaan orang kedua jamak pada klausa terakhir
  choice: Semoga hati kalian hidup selama-lamanya
  alternative: Semoga hati kamu sekalian hidup selama-lamanya; kiranya hati mereka hidup selama-lamanya
  rationale: Akhiran Ibrani adalah orang kedua jamak, sedangkan “hati” berbentuk tunggal dan kemungkinan berfungsi secara kolektif. Terjemahan mempertahankan berkat langsung kepada komunitas pencari Yahweh serta ketegangan antara pemilik jamak dan kata benda tunggal.
- issue: Sifat peristiwa makan
  choice: Menerjemahkan secara harfiah sebagai makan dan menjadi kenyang
  alternative: Menentukan bahwa mereka makan dalam perjamuan kurban atau perjamuan nazar
  rationale: Konteks mazmur mungkin mengarah kepada perjamuan kurban atau nazar, tetapi ayat ini sendiri tidak menyatakannya secara eksplisit. Karena itu, rincian tersebut tidak dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan liturgis yang tetap mudah dipahami. “Kalian” dipilih untuk menandai sapaan orang kedua jamak secara jelas; “selama-lamanya” mempertahankan keagungan register mazmur. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
