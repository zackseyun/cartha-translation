  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: id
  text: Ya Yahweh[a], Tuhan kami, betapa agung nama-Mu di seluruh bumi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH,” nama ilahi yang secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang mapan untuk nama ilahi YHWH, sambil menjelaskan bentuk Ibraninya dalam catatan kaki.
- source_word: אֲדֹנֵינוּ
  choice: Tuhan kami
  rationale: Sebagai gelar ilahi, kata ini menyatakan kedaulatan dan kewenangan; “Tuhan kami” alami dalam sapaan ibadah dan tetap membedakannya dari nama YHWH melalui kapitalisasi.
- source_word: מָה
  choice: betapa
  rationale: Dalam konstruksi seruan ini, “betapa” secara alami mengungkapkan kekaguman.
- source_word: אַדִּיר
  choice: mulianya
  rationale: Dalam konteks ini kata tersebut menggambarkan kebesaran, keagungan, dan kemegahan nama Allah. “Mulianya” menghasilkan seruan Indonesia yang alami; “agungnya” juga mungkin.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Mempertahankan ungkapan Ibrani tentang nama Allah, yang mencakup kehormatan dan reputasi-Nya, tanpa memperluas maknanya di dalam teks.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh bumi
  rationale: Konteks mazmur bersifat universal dan kosmis, sehingga הָאָרֶץ berarti bumi, bukan suatu negeri tertentu.
theological_decisions:
- issue: Penerjemahan rangkaian nama dan gelar ilahi יְהוָה אֲדֹנֵינוּ
  choice: Ya TUHAN, Tuhan kami
  alternative: Ya Yahweh, Tuhan kami
  rationale: Teks membedakan nama perjanjian YHWH dari gelar אֲדֹנֵינוּ. “TUHAN” mengikuti konvensi Indonesia yang luas, sedangkan catatan kaki mempertahankan transparansi terhadap bentuk Ibrani dan kemungkinan transliterasi “Yahweh”.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Partikel “Ya” menandai sapaan langsung; “betapa mulianya” mempertahankan bentuk seruan dan nada pujian dari teks Ibrani.
