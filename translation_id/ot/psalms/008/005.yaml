  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: id
  text: Namun Engkau membuatnya sedikit lebih rendah daripada Allah[a], dan memahkotainya dengan kemuliaan dan kehormatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daripada makhluk-makhluk surgawi”; Septuaginta menerjemahkannya sebagai “malaikat-malaikat”, suatu terjemahan yang tercermin dalam Ibrani 2:7.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: Engkau membuatnya ... lebih rendah
  rationale: Bentuk Hifil dari חסר dengan objek persona menyatakan tindakan menempatkan seseorang dalam keadaan yang lebih rendah; ungkapan komparatif ini alami dalam bahasa Indonesia bersama frasa מן yang mengikutinya.
- source_word: מְּעַט
  choice: sedikit
  rationale: Dalam konteks Ibrani ini, kata tersebut paling wajar menyatakan derajat kecil, bukan jangka waktu singkat.
- source_word: מֵאֱלֹהִים
  choice: daripada Allah
  rationale: אֱלֹהִים dapat berarti Allah, para ilah, atau makhluk-makhluk surgawi menurut konteks. Di sini bentuk Ibraninya paling langsung dipahami sebagai Allah, sementara kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: וְכָבוֹד
  choice: dengan kemuliaan
  rationale: כָבוֹד lazim berarti kemuliaan atau kehormatan; 'kemuliaan' mempertahankan ragam puitis yang luhur dan berpasangan baik dengan הָדָר.
- source_word: וְהָדָר
  choice: dan kehormatan
  rationale: הָדָר dapat berarti semarak, keagungan, atau kehormatan. 'Kehormatan' menonjolkan martabat yang dianugerahkan tanpa mengulang arti 'kemuliaan'.
- source_word: תְּעַטְּרֵהוּ
  choice: memahkotainya
  rationale: Bentuk Piel dari עטר lazim berarti memahkotai atau mengelilingi; 'memahkotainya' mempertahankan metafora kerajaan dalam ayat ini.
theological_decisions:
- issue: Rujukan dan daya representatif pronomina tunggal
  choice: Mempertahankan bentuk tunggal '-nya'
  alternative: Menggunakan 'mereka' atau 'umat manusia'
  rationale: Teks Ibrani memakai pronomina tunggal dan konteks terdekat berbicara tentang manusia atau anak manusia secara representatif. Bentuk tunggal dipertahankan agar ciri teks sumber dan keterbukaan daya representatifnya tetap terjaga.
- issue: Pemaknaan אֱלֹהִים
  choice: Allah
  alternative: makhluk-makhluk surgawi atau malaikat
  rationale: Prioritas pada teks Ibrani mendukung 'Allah' sebagai pembacaan paling langsung. Terjemahan 'malaikat' berasal dari Septuaginta dan tercermin dalam Ibrani 2:7, sehingga dicantumkan sebagai alternatif penting dalam catatan kaki tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan bermartabat. Kapitalisasi 'Engkau' menandai sapaan kepada Allah. Susunan kalimat mempertahankan kesejajaran tindakan ilahi dan gambaran pemahkotaan.
