  text: Burung-burung di langit, ikan-ikan di laut, dan apa pun yang melintasi jalur-jalur lautan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “yang melintasi jalur-jalur lautan.” Partisip “yang melintasi” berbentuk tunggal, tetapi dapat dipakai secara kolektif untuk merangkum makhluk yang menempuh jalur-jalur lautan.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִפּוֹר שָׁמַיִם
  choice: burung-burung di langit
  rationale: Bentuk tunggal צִפּוֹר berfungsi secara kolektif dalam daftar makhluk hidup. Bentuk ulang merupakan ungkapan Indonesia yang alami, sedangkan “di langit” menyampaikan ranah tempat burung hidup tanpa memberi kesan tempat ilahi yang dapat timbul dari “surga”.
- source_word: וּדְגֵי הַיָּם
  choice: dan ikan-ikan di laut
  rationale: Frasa konstruksi ini secara langsung menunjuk ikan sebagai kelompok penghuni laut. Bentuk ulang memperjelas makna kolektif dalam bahasa Indonesia.
- source_word: עֹבֵר
  choice: yang melintasi
  rationale: Partisip Ibrani ini berbentuk tunggal, tetapi dapat berfungsi secara kolektif. Ungkapan relatif Indonesia mempertahankan keluwesan mengenai acuannya tanpa menambahkan kata “semua” ke dalam teks utama.
- source_word: אָרְחוֹת יַמִּים
  choice: jalur-jalur lautan
  rationale: אָרְחוֹת menggambarkan jalan atau lintasan, sedangkan יַמִּים berbentuk jamak. “Jalur-jalur lautan” mempertahankan citra puitis dan keluasan bentuk jamak Ibraninya.
