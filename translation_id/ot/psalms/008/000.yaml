  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: id
  text: Untuk pemimpin musik; menurut Gitit[a]. Mazmur Daud.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani «Gitit»; mungkin istilah musik atau liturgis, barangkali nama lagu atau alat musik.
    reason: cultural_note
  - marker: b
    text: Atau «Mazmur oleh Daud» atau «Mazmur untuk Daud». Frasa Ibrani ini dapat menunjukkan kepengarangan atau keterkaitan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, bentuk ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Ungkapan ini alami dalam bahasa Indonesia dan tetap menunjukkan konteks ibadah serta musik.
- source_word: עַל
  choice: menurut
  rationale: Dalam petunjuk musik pada judul mazmur, kata ini dapat menghubungkan pelaksanaan mazmur dengan nama lagu, alat musik, atau istilah teknis yang menyusul, tanpa memastikan jenis rujukannya.
- source_word: הַגִּתִּית
  choice: Gitit
  rationale: Acuan tepat istilah ini tidak diketahui; kemungkinan merupakan istilah musik, nama lagu, atau alat musik. Transliterasi mempertahankan ketidakpastian teks Ibrani.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah padanan baku dan tepat bagi label jenis nyanyian dalam judul kitab Mazmur.
- source_word: לְדָוִד
  choice: Mazmur Daud
  rationale: Konstruksi Indonesia ini wajar dan tetap dapat menyatakan kepengarangan maupun hubungan atau keterkaitan dengan Daud; catatan kaki menjelaskan keluasan makna preposisi Ibraninya.
theological_decisions:
- issue: Kepengarangan atau keterkaitan yang dinyatakan oleh לְדָוִד
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud; mazmur untuk Daud
  rationale: Preposisi Ibrani לְ tidak mengharuskan satu hubungan tertentu saja; bentuk utama yang ringkas dan tradisional dipakai tanpa menutup kemungkinan kepengarangan, peruntukan, atau keterkaitan, yang dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda titik koma mempertahankan hubungan antara petunjuk bagi pemimpin pujian dan petunjuk Gitit. Istilah teknis yang tidak pasti ditransliterasikan, sedangkan ambiguitas hubungan dengan Daud dipertahankan melalui catatan kaki.
