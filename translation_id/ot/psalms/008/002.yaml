  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: id
  text: Dari mulut anak-anak kecil dan bayi-bayi yang menyusu Engkau telah menetapkan kekuatan karena lawan-lawan-Mu,[a] untuk membungkam musuh dan orang yang menuntut balas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pujian,” mengikuti tradisi Septuaginta yang tercermin dalam Matius 21:16; teks Ibrani berbunyi “kekuatan.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: Dari mulut
  rationale: Gabungan preposisi מִן dan פֶּה secara idiomatis berarti 'dari mulut'. Bentuk tunggal kolektif alami dalam bahasa Indonesia meskipun dua kelompok anak mengikutinya.
- source_word: עוֹלְלִים
  choice: bayi-bayi
  rationale: Kata ini menunjuk anak-anak yang sangat kecil; 'bayi-bayi' jelas, modern, dan tetap dapat dibedakan dari kelompok berikutnya yang secara khusus digambarkan masih menyusu.
- source_word: וְיֹנְקִים
  choice: dan anak-anak yang masih menyusu
  rationale: Bentuk partisip ini secara konkret berarti mereka yang menyusu. Ungkapan tersebut mempertahankan gambaran Ibrani tanpa memakai istilah yang kaku.
- source_word: יִסַּדְתָּ
  choice: Engkau telah menegakkan
  rationale: יסד berarti mendirikan, meletakkan dasar, atau menetapkan. 'Menegakkan' berpadu alami dengan 'kekuatan' dan mempertahankan tindakan yang telah dilakukan Allah.
- source_word: עֹז
  choice: kekuatan
  rationale: Makna lazim kata Ibrani ini ialah 'kekuatan' atau 'keperkasaan'. Bacaan tradisi Yunani 'pujian' dicatat dalam catatan kaki, tetapi tidak menggantikan teks Ibrani.
- source_word: לְמַעַן
  choice: karena
  rationale: Dalam konteks ini kata tersebut menghubungkan tindakan Allah dengan adanya para lawan dan dapat memuat nuansa alasan atau tujuan. 'Karena' alami dan tidak memperluas maknanya secara berlebihan.
- source_word: צוֹרְרֶיךָ
  choice: lawan-lawan-Mu
  rationale: Nomina partisipial ini menunjuk orang-orang yang memusuhi Allah. 'Lawan-lawan-Mu' mempertahankan bentuk jamak dan menghindari pengulangan langsung dengan 'musuh' pada klausa berikut.
- source_word: לְהַשְׁבִּית
  choice: untuk membungkam
  rationale: Bentuk kausatif ini berarti membuat berhenti atau meniadakan. Dalam konteks perlawanan, 'membungkam' menyampaikan hasil tersebut secara hidup dan wajar.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Bentuk tunggal dipakai secara representatif atau generik; bahasa Indonesia secara alami dapat mempertahankannya tanpa artikel.
- source_word: וּמִתְנַקֵּם
  choice: dan orang yang menuntut balas
  rationale: Partisip ini menunjuk seseorang yang melakukan atau mengupayakan pembalasan. Frasa ini lebih jelas dan alami dalam bahasa Indonesia modern daripada nomina 'pembalas', yang dapat berkonotasi sebagai pelaksana keadilan.
theological_decisions:
- issue: עֹז dalam teks Ibrani dibandingkan dengan 'pujian' dalam tradisi Septuaginta dan Matius 21:16
  choice: kekuatan
  alternative: pujian
  rationale: Teks Masoret secara jelas memakai עֹז, 'kekuatan/keperkasaan'. Karena sumber bahasa asli diutamakan, teks utama mengikuti bahasa Ibrani. Bacaan 'pujian' tetap dicatat karena penting bagi tradisi Yunani dan hubungan antarteks dengan Matius 21:16.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada puitis dan khidmat. Sapaan kepada Allah memakai 'Engkau' serta akhiran hormat '-Mu'. Struktur paralel ayat dipertahankan, sementara ungkapan dibuat jelas bagi pembaca umum.
