id: PSA.8.6
reference: Psalms 8:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תַּ֭מְשִׁילֵ/הוּ בְּ/מַעֲשֵׂ֣י יָדֶ֑י/ךָ כֹּ֝ל שַׁ֣תָּה תַֽחַת רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: id
  text: Engkau membuat dia berkuasa atas karya tangan-Mu[a][b]; segala sesuatu Kauletakkan di bawah kakinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau memberi dia kekuasaan atas karya tangan-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Bentuk tunggal “dia” dan “-nya” melanjutkan ungkapan pada ayat sebelumnya dan mewakili umat manusia sesuai dengan bentuk bahasa Ibrani.
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: Engkau membuat dia berkuasa
  rationale: Bentuk Hifil dari משל menyatakan bahwa Allah menyebabkan atau menetapkan seseorang untuk memerintah. Ungkapan ini mempertahankan daya kausatif bentuk Ibrani dan tetap alami dalam bahasa Indonesia modern.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: atas karya tangan-Mu
  rationale: Dengan משל, preposisi ב menandai lingkup yang dikuasai. Terjemahan ini mempertahankan gambaran konkret tentang tangan Allah sekaligus terdengar wajar.
- source_word: כֹּל
  choice: segala sesuatu
  rationale: Dalam konteks ini, bentuk mutlak כֹּל mencakup seluruh ciptaan yang ditempatkan di bawah kekuasaan manusia.
- source_word: שַׁתָּה
  choice: Kauletakkan
  rationale: Bentuk Qal ini berarti menaruh, menempatkan, atau meletakkan. 'Kauletakkan' ringkas, alami, dan mempertahankan tindakan langsung Allah.
- source_word: תַחַת רַגְלָיו
  choice: di bawah kakinya
  rationale: Terjemahan harfiah ini mempertahankan gambaran Ibrani yang sekaligus menyiratkan penaklukan atau penempatan di bawah wewenang.
theological_decisions:
- issue: Bahasa maskulin tunggal yang mewakili umat manusia dalam Mazmur 8
  choice: Mempertahankan kata ganti tunggal 'dia' dan '-nya'
  alternative: Menggunakan bentuk jamak seperti 'mereka' untuk menyatakan umat manusia
  rationale: Teks Ibrani memakai bentuk maskulin tunggal yang melanjutkan penyebutan manusia pada ayat sebelumnya. Bahasa Indonesia tidak menandai gender pada kata 'dia', tetapi bentuk tunggal tetap dipertahankan agar struktur representatif teks sumber tidak diratakan menjadi bentuk jamak.
- issue: Bahasa tentang kuasa atas ciptaan
  choice: Menerjemahkan משל dengan 'membuat dia berkuasa'
  alternative: Memberi dia kekuasaan
  rationale: Pilihan ini mempertahankan daya kausatif verba Ibrani tanpa menambahkan nuansa teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis yang lugas dan bermartabat. Bentuk sapaan ilahi 'Engkau', 'Kau-', dan '-Mu' dipakai secara konsisten; gambaran konkret 'karya tangan-Mu' dan 'di bawah kakinya' dipertahankan.
