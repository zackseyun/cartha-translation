id: PSA.8.3
reference: Psalms 8:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי אֶרְאֶ֣ה שָׁ֭מֶי/ךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑י/ךָ יָרֵ֥חַ וְ֝/כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָֽנְתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: id
  text: 'Ketika aku memandang langit-Mu[a], karya jari-jari-Mu,

    bulan dan bintang-bintang yang Kautempatkan—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab aku melihat langit-Mu ... yang Kautegakkan.”'
    reason: Alternatif leksikal yang mempertahankan kemungkinan bahwa כִּי bersifat kausal, אֶרְאֶה berarti sederhana “aku melihat”, dan כּוֹנָנְתָּה diterjemahkan “Kautegakkan”.
lexical_decisions:
- source_word: כִּי
  choice: Ketika
  rationale: Dalam konteks puisi ini, כִּי dapat memperkenalkan keadaan yang mendorong perenungan pada ayat berikutnya. “Ketika” menghasilkan alur yang alami, sementara kemungkinan kausal “sebab” dipertahankan dalam catatan kaki.
- source_word: אֶרְאֶה
  choice: aku memandang
  rationale: Bentuk imperfek dari ראה di sini menggambarkan tindakan mengamati. “Memandang” lebih disengaja dan puitis daripada sekadar “melihat”, tetapi tetap wajar dalam bahasa Indonesia modern.
- source_word: שָׁמֶיךָ
  choice: langit-Mu
  rationale: Bahasa Indonesia lazim memakai bentuk tunggal kolektif “langit” untuk cakrawala atau ruang angkasa. Bentuk ulang “langit-langit” dihindari karena dalam pemakaian modern biasanya berarti plafon.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: karya jari-jari-Mu
  rationale: Ungkapan ini mempertahankan metafora antropomorfis dan bentuk jamak “jari-jari”, serta menyampaikan hasil penciptaan secara ringkas dan puitis.
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: bulan dan bintang-bintang
  rationale: “Bulan” menunjuk pada benda langit tertentu, sedangkan pengulangan “bintang-bintang” menyatakan bentuk jamak secara alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata relatif “yang” menghubungkan bulan dan bintang-bintang dengan tindakan Allah secara alami dan tepat.
- source_word: כּוֹנָנְתָּה
  choice: Kautempatkan
  rationale: Bentuk polel dari כון dapat berarti menegakkan, menetapkan, atau menempatkan dengan kokoh. “Kautempatkan” menyampaikan pengaturan benda-benda langit secara konkret tanpa menambahkan gagasan yang tidak dinyatakan.
theological_decisions:
- issue: Bahasa antropomorfis bagi tindakan penciptaan Allah
  choice: Mempertahankan “jari-jari-Mu” secara harfiah
  alternative: “karya tangan-Mu” atau “yang Kaubuat”
  rationale: Teks Ibrani sengaja memakai gambaran jari-jari untuk mengungkapkan tindakan penciptaan Allah secara intim dan seolah tanpa susah payah. Gambaran itu dipertahankan tanpa menyimpulkan bahwa Allah memiliki tubuh jasmani.
- issue: Hubungan logis כִּי dengan pertanyaan pada ayat berikutnya
  choice: Memakai hubungan temporal “Ketika”
  alternative: Hubungan kausal “Sebab”
  rationale: Keduanya dimungkinkan secara leksikal. “Ketika” paling alami memperkenalkan pengalaman memandang langit yang mengantar kepada pertanyaan dalam ayat berikutnya, sementara bacaan kausal dicatat agar ambiguitas sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat tanpa bentuk arkais. Tanda pisah pada akhir ayat dipertahankan untuk menunjukkan bahwa kalimat dan pemikiran berlanjut ke ayat berikutnya.
