  text: kambing domba dan lembu, semuanya, juga binatang di padang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹנֶה
  choice: kambing domba
  rationale: Kata ini menunjuk pada ternak kecil, terutama domba dan kambing. Ungkapan "kambing domba" alami dalam bahasa Indonesia dan mempertahankan cakupan kolektifnya tanpa membatasinya hanya pada domba.
- source_word: וַאֲלָפִים
  choice: dan lembu
  rationale: Istilah ini menunjuk pada ternak besar jenis sapi. "Lembu" ringkas, puitis, dan sesuai sebagai pasangan bagi "kambing domba".
- source_word: כֻּלָּם
  choice: segala
  rationale: Bentuk ini menegaskan keseluruhan semua ternak yang baru disebut. Penempatan "segala" di depan pasangan nomina menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: וְגַם
  choice: dan juga
  rationale: Terjemahan ini mempertahankan unsur penghubung sekaligus daya tambah yang memperluas daftar dari ternak peliharaan kepada binatang di alam terbuka.
- source_word: בַּהֲמוֹת
  choice: binatang-binatang
  rationale: Dalam konteks ini kata tersebut merujuk secara umum kepada hewan, khususnya yang berada di padang, bukan lagi hanya ternak peliharaan. Bentuk ulang menyatakan jamak dengan jelas.
- source_word: שָׂדָי
  choice: di padang
  rationale: Kata ini berarti padang atau wilayah terbuka. Frasa "binatang-binatang di padang" alami dan mempertahankan gambaran puitis tentang hewan di luar lingkungan ternak domestik.
