id: PSA.8.4
reference: Psalms 8:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מָֽה אֱנ֥וֹשׁ כִּֽי תִזְכְּרֶ֑/נּוּ וּ/בֶן אָ֝דָ֗ם כִּ֣י תִפְקְדֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/004.yaml
  text: What is man that you remember him[c][b][a], and the son of man that you attend to him?
translation:
  language: id
  text: Apakah manusia[a] itu sehingga Engkau mengingatnya, dan anak manusia[b] sehingga Engkau memperhatikannya?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “manusia fana”; kata Ibrani אֱנוֹשׁ sering menonjolkan kefanaan dan kerapuhan manusia.
    reason: lexical_alternative
  - marker: b
    text: “Anak manusia” di sini adalah ungkapan Ibrani yang berarti seorang manusia. Dalam pemakaian Alkitab yang lebih kemudian, ungkapan ini dapat memiliki makna mesianik, tetapi dalam mazmur ini berfungsi sebagai kesejajaran puitis bagi manusia.
    reason: cross_reference
  - marker: c
    text: Atau “memedulikannya”, “mengunjunginya”, atau “mengindahkannya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Apakah ... itu
  rationale: Mengungkapkan pertanyaan retoris Ibrani yang tanpa kopula secara alami dalam bahasa Indonesia dan menyoroti kecilnya manusia.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Menunjuk kepada manusia sebagai makhluk fana dan rapuh. “Manusia” mempertahankan acuan umum tanpa membatasinya pada laki-laki.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam kedua klausa, kata ini menghubungkan kecilnya manusia dengan perhatian Allah kepadanya; “sehingga” menyampaikan daya retoris tersebut secara wajar.
- source_word: תִזְכְּרֶנּוּ
  choice: Engkau mengingatnya
  rationale: Menerjemahkan makna lazim זכר secara langsung serta mempertahankan bentuk orang ketiga tunggal yang mewakili umat manusia.
- source_word: וּבֶן אָדָם
  choice: dan anak manusia
  rationale: Mempertahankan gambaran dan kesejajaran puitis Ibrani. Dalam konteks mazmur ini, ungkapan tersebut secara umum berarti seorang manusia.
- source_word: תִפְקְדֶנּוּ
  choice: Engkau memperhatikannya
  rationale: פקד memiliki rentang arti mengindahkan, mengunjungi, memedulikan, atau memperhatikan. “Memperhatikan” menjaga keluasan makna tindakan Allah tanpa terlalu menentukan bentuk perhatian itu.
theological_decisions:
- issue: Bahasa maskulin representatif bagi umat manusia
  choice: Menggunakan “manusia” dan mempertahankan ungkapan “anak manusia”
  alternative: manusia fana; umat manusia; insan
  rationale: אֱנוֹשׁ dan בֶן־אָדָם berbentuk tunggal dan mewakili manusia pada umumnya. Bahasa Indonesia tidak memerlukan kata ganti bergender, sementara ungkapan puitis “anak manusia” tetap dapat dipertahankan.
- issue: Apakah “anak manusia” merupakan gelar mesianik di sini
  choice: Memahaminya sebagai ungkapan umum bagi seorang manusia
  alternative: Menandainya secara eksplisit sebagai gelar mesianik
  rationale: Dalam konteks langsung Mazmur 8, ungkapan ini sejajar dengan אֱנוֹשׁ dan berbicara tentang manusia. Pemakaian kristologis dalam bagian Alkitab lain tidak perlu dimasukkan secara eksplisit ke dalam teks ayat ini.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan khidmat. “Engkau” dipakai untuk sapaan langsung kepada Allah. Susunan paralel kedua klausa dipertahankan, sedangkan tanda baca dibuat alami bagi pembaca Indonesia.
