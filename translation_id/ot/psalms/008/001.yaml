id: PSA.8.1
reference: Psalms 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֤ה אֲדֹנֵ֗י/נוּ מָֽה אַדִּ֣יר שִׁ֭מְ/ךָ בְּ/כָל הָ/אָ֑רֶץ אֲשֶׁ֥ר תְּנָ֥/ה ה֝וֹדְ/ךָ֗ עַל הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: id
  text: Ya Yahweh[a], Tuhan kami, betapa agung nama-Mu di seluruh bumi! Engkau telah menempatkan kemegahan-Mu di atas langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”.
    reason: alternative_reading
  - marker: b
    text: 'Bentuk Ibraninya juga dapat dipahami sebagai permohonan: “Tempatkanlah kemegahan-Mu di atas langit.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH agar nama perjanjian dalam teks Ibrani tetap tampak, alih-alih menggantinya dengan gelar.
- source_word: אֲדֹנֵינוּ
  choice: Tuhan kami
  rationale: Gelar אֲדוֹן dengan akhiran orang pertama jamak merupakan sapaan kepada Allah; “Tuhan kami” alami dan khidmat dalam bahasa Indonesia.
- source_word: מָה אַדִּיר
  choice: betapa agung
  rationale: מָה bersifat seruan kekaguman, sedangkan אַדִּיר menyatakan keagungan atau kemuliaan yang menggentarkan; “betapa agung” mempertahankan daya puitisnya.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Mempertahankan ungkapan Ibrani tentang nama Allah tanpa menguraikannya menjadi reputasi, kehadiran, atau karakter.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh bumi
  rationale: “Bumi” sesuai dengan cakupan kosmis ayat ini dan pasangannya, “langit”; “negeri” akan mempersempit makna.
- source_word: תְּנָה
  choice: Engkau telah menempatkan
  rationale: Dalam alur pujian, bentuk ini dipahami sebagai pernyataan puitis bahwa Allah menempatkan kemegahan-Nya; bentuk Masoret juga menyerupai imperatif, sehingga kemungkinan itu dicatat dalam catatan kaki.
- source_word: הוֹדְךָ
  choice: kemegahan-Mu
  rationale: הוֹד mencakup kemegahan, semarak, dan keagungan. “Kemegahan” jelas bagi pembaca modern sekaligus mempertahankan register puisi.
- source_word: עַל הַשָּׁמָיִם
  choice: di atas langit
  rationale: Menggambarkan kemegahan Allah melampaui langit; “langit” lazim dipakai sebagai nomina kolektif dalam bahasa Indonesia.
theological_decisions:
- issue: Penyajian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama YHWH secara langsung. Transliterasi mempertahankan perbedaan antara nama ilahi dan gelar אֲדֹנֵינוּ, yang langsung mengikutinya.
- issue: Daya ujar תְּנָה
  choice: 'Pernyataan: “Engkau telah menempatkan”'
  alternative: 'Permohonan/perintah: “Tempatkanlah”'
  rationale: Konteks mazmur mendukung pernyataan pujian, tetapi bentuk tertulis Ibrani dapat dibaca sebagai imperatif. Ambiguitas ini tidak disembunyikan dan disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Sapaan “Ya” memperjelas seruan langsung. Tanda seru menandai kekaguman dalam מָה אַדִּיר, sedangkan kapitalisasi pronomina ilahi mengikuti kebiasaan tulisan rohani Indonesia tanpa menambah isi teologis.
