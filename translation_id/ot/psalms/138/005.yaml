source:
  edition: WLC
  text: וְ֭/יָשִׁירוּ בְּ/דַרְכֵ֣י יְהוָ֑ה כִּ֥י גָ֝ד֗וֹל כְּב֣וֹד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/005.yaml
  text: and they will sing of the ways of Yahweh[a], for great is the glory of Yahweh.
translation:
  language: id
  text: Mereka akan bernyanyi tentang jalan-jalan Yahweh[a], sebab kemuliaan Yahweh besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di jalan-jalan Yahweh”; frasa ini kemungkinan berarti bernyanyi tentang jalan-jalan atau cara Yahweh bertindak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׁירוּ
  choice: Mereka akan bernyanyi
  rationale: Bentuk Qal imperfek orang ketiga jamak paling wajar dipahami sebagai tindakan yang akan terjadi, melanjutkan gambaran para raja yang memuji pada ayat sebelumnya. Kata sambung וְ tersampaikan secara alami melalui kesinambungan kalimat dan tidak harus diterjemahkan tersendiri.
- source_word: בְּדַרְכֵי
  choice: tentang jalan-jalan
  rationale: Secara harfiah בְּ berarti ‘di/dalam’, tetapi sesudah verba ‘bernyanyi’ frasa ini kemungkinan menunjukkan pokok nyanyian. ‘Tentang’ alami dalam bahasa Indonesia, sedangkan ‘jalan-jalan’ mempertahankan metafora Ibrani dan cakupan maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan mereka bernyanyi; ‘sebab’ ringkas, puitis, dan jelas bersifat kausal.
- source_word: גָדוֹל
  choice: besar
  rationale: Padanan langsung yang mempertahankan susunan predikatif dan penekanan teks Ibrani.
- source_word: כְּבוֹד
  choice: kemuliaan
  rationale: ‘Kemuliaan’ merupakan padanan baku dan sesuai konteks bagi כבוד ketika merujuk kepada Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna frasa בְּדַרְכֵי יְהוָה
  choice: bernyanyi tentang jalan-jalan Yahweh
  alternative: bernyanyi di jalan-jalan Yahweh
  rationale: Preposisi Ibrani memungkinkan terjemahan harfiah ‘di/dalam’, tetapi dalam hubungan dengan ‘bernyanyi’ kemungkinan besar menunjuk pada pokok nyanyian. Catatan kaki mempertahankan bentuk harfiahnya agar ambiguitas sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bernada puitis. Metafora ‘jalan-jalan Yahweh’ dipertahankan, sementara hubungan preposisional dibuat alami dan perbedaan dari bentuk harfiahnya dicatat dalam catatan kaki.
