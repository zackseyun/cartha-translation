  text: אִם אֵלֵ֤ךְ בְּ/קֶ֥רֶב צָרָ֗ה תְּחַ֫יֵּ֥/נִי עַ֤ל אַ֣ף אֹ֭יְבַ/י תִּשְׁלַ֣ח יָדֶ֑/ךָ וְ/ת֖וֹשִׁיעֵ֣/נִי יְמִינֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life; you stretch out your hand against the anger of my enemies[c][b], and your right hand saves me.
translation:
  language: id
  text: Jika aku berjalan di tengah kesesakan[a], Engkau memelihara hidupku[b]; Engkau mengulurkan tangan-Mu melawan amarah musuh-musuhku[c], dan tangan kanan-Mu menyelamatkan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sekalipun aku berjalan di tengah kesesakan.” Dalam konteks ini, kata Ibrani אִם dapat menyatakan syarat ataupun konsesi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Engkau menghidupkan aku kembali” atau “Engkau menjaga aku tetap hidup.” Kata kerja Ibraninya dapat menunjuk pada tindakan menghidupkan kembali maupun mempertahankan hidup.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “terhadap hidung musuh-musuhku.” Dalam bahasa Ibrani, “hidung” merupakan ungkapan untuk amarah atau murka.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel ini paling langsung menyatakan syarat, tetapi dalam konteks juga dapat bernuansa konsesif; kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: אֵלֵךְ
  choice: aku berjalan
  rationale: Mempertahankan gambaran konkret verba הלך dan tetap alami dalam puisi Indonesia.
- source_word: בְּקֶרֶב צָרָה
  choice: di tengah kesesakan
  rationale: Frasa ini mempertahankan gambaran berada di tengah-tengah keadaan sulit; 'kesesakan' menyampaikan tekanan dan bahaya yang terkandung dalam צָרָה.
- source_word: תְּחַיֵּנִי
  choice: Engkau memelihara hidupku
  rationale: Bentuk Piel dari חיה dapat berarti menghidupkan kembali atau mempertahankan tetap hidup. Dalam ancaman dari musuh, pilihan ini menyatakan pemeliharaan hidup tanpa meniadakan alternatif leksikalnya.
- source_word: עַל אַף אֹיְבַי
  choice: terhadap amarah musuh-musuhku
  rationale: אַף secara harfiah berarti 'hidung', tetapi secara idiomatis berarti amarah. 'Terhadap' menyampaikan arah tindakan Allah melawan amarah mereka tanpa meratakan ungkapan itu menjadi sekadar 'melawan musuh-musuhku'.
- source_word: תִּשְׁלַח יָדֶךָ
  choice: Engkau mengulurkan tangan-Mu
  rationale: Ungkapan ini mempertahankan citra antropomorfis tentang campur tangan yang aktif dan alami dalam bahasa Indonesia.
- source_word: וְתוֹשִׁיעֵנִי
  choice: dan ... menyelamatkan aku
  rationale: ישע dalam Hifil berarti menyelamatkan atau melepaskan; 'menyelamatkan' adalah padanan luas yang tidak menentukan cara pertolongan secara berlebihan.
- source_word: יְמִינֶךָ
  choice: tangan kanan-Mu
  rationale: Terjemahan harfiah ini mempertahankan citra Ibrani tentang kekuatan dan kuasa penyelamatan.
theological_decisions:
- issue: Nuansa tindakan ilahi dalam תְּחַיֵּנִי
  choice: pemeliharaan hidup di tengah bahaya yang sedang dihadapi
  alternative: menghidupkan kembali atau memulihkan
  rationale: Konteks kesesakan dan musuh mendukung makna bahwa Allah menjaga pemazmur tetap hidup. Namun, karena verba itu juga dapat berarti menghidupkan kembali, alternatif tersebut dicatat dan tidak dihapus.
- issue: Sasaran tindakan ilahi dalam עַל אַף אֹיְבַי
  choice: Allah bertindak terhadap amarah para musuh
  alternative: Allah bertindak melawan para musuh itu sendiri
  rationale: Teks secara eksplisit memakai אַף dalam arti idiomatis 'amarah'. Terjemahan mempertahankan ketegangan puitis itu dan tidak menyederhanakannya menjadi tindakan terhadap orang-orangnya saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang tetap mudah dipahami. Sapaan kepada Allah memakai kapital penghormatan secara konsisten. Paralelisme dan citra tangan kanan dipertahankan, sedangkan ambiguitas penting dijelaskan melalui catatan kaki.
