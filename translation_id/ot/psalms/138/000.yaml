  yaml_path: translation/ot/psalms/138/000.yaml
  text: Of David[a]. I will give thanks to you with all my heart; before the gods I will sing praises to you.
translation:
  language: id
  text: 'Dari Daud.[a]


    Aku akan bersyukur kepada-Mu dengan segenap hatiku; di hadapan para ilah[b] aku akan menyanyikan pujian kepada-Mu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk Daud” atau “Mengenai Daud.” Ungkapan Ibrani pada judul dapat menunjukkan kepengarangan, peruntukan, atau keterkaitan.
    reason: alternative_reading
  - marker: b
    text: Atau “makhluk-makhluk surgawi” atau “para malaikat.” Kata Ibrani ini dapat merujuk kepada para ilah, Allah, atau makhluk-makhluk surgawi, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Konstruksi לְ dalam judul mazmur dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan. Frasa ringkas ini mempertahankan keluwesan tersebut tanpa memperluas judul.
- source_word: אוֹדְךָ
  choice: Aku akan bersyukur kepada-Mu
  rationale: Bentuk piel dari ידה dalam konteks pujian menyatakan ucapan syukur atau pengakuan pujian kepada Allah; 'bersyukur' alami dalam bahasa Indonesia.
- source_word: בְכָל־לִבִּי
  choice: dengan segenap hatiku
  rationale: Ungkapan idiomatis Ibrani ini menunjuk pada keterlibatan batin yang utuh; 'segenap hati' mempertahankan citra sumber sekaligus terdengar alami.
- source_word: נֶגֶד אֱלֹהִים
  choice: di hadapan para ilah
  rationale: נֶגֶד berarti 'di hadapan', sedangkan אֱלֹהִים secara bentuk dan konteks memungkinkan rujukan kepada ilah-ilah atau makhluk surgawi. Teks utama mempertahankan pembacaan plural yang langsung, dengan alternatif dijelaskan dalam catatan.
- source_word: אֲזַמְּרֶךָּ
  choice: aku akan bermazmur bagi-Mu
  rationale: Kata זמר menyatakan pujian yang dinyanyikan atau dimainkan. 'Bermazmur' menjaga hubungan leksikal dengan genre Mazmur dan nuansa musikalnya.
theological_decisions:
- issue: Identitas אֱלֹהִים dalam frasa נֶגֶד אֱלֹהִים
  choice: para ilah
  alternative: makhluk-makhluk surgawi atau para malaikat
  rationale: Bentuk tersebut ambigu dan dapat menunjuk kepada ilah-ilah ataupun penghuni sidang surgawi. Terjemahan utama tidak menyelaraskannya secara doktrinal, sedangkan catatan mempertahankan kemungkinan lain.
- issue: Makna לְדָוִד pada judul
  choice: Dari Daud
  alternative: Untuk Daud atau mengenai Daud
  rationale: Preposisi לְ pada superskripsi tidak selalu menentukan kepengarangan secara eksklusif. Pilihan utama mengikuti pemahaman tradisional yang wajar, sementara catatan mengakui rentang maknanya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur paralel dan ketegangan makna אֱלֹהִים dipertahankan.
