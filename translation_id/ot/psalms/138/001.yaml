  text: Of David[a]. I will give thanks to you with my whole heart; before the gods I will sing praises to you.
translation:
  language: id
  text: 'Dari Daud.[a]


    Aku akan bersyukur kepada-Mu dengan segenap hatiku; di hadapan para ilah[b] aku akan menyanyikan puji-pujian kepada-Mu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Untuk Daud.” Ungkapan Ibrani dapat menunjukkan kepengarangan, hubungan, atau peruntukan.'
    reason: ambiguity_in_superscription
  - marker: b
    text: 'Atau: “makhluk-makhluk surgawi” atau “malaikat-malaikat.” Kata Ibrani ini dapat merujuk pada ilah-ilah, Allah, atau makhluk-makhluk surgawi, bergantung pada konteks.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Preposisi לְ pada judul mazmur dapat menyatakan kepengarangan, hubungan, atau peruntukan. “Dari Daud” mempertahankan keluwesan itu dengan ungkapan Indonesia yang ringkas; kemungkinan “Untuk Daud” dicatat dalam catatan kaki.
- source_word: אוֹדְךָ
  choice: Aku akan bersyukur kepada-Mu
  rationale: Bentuk Hifil dari ידה dalam konteks ibadah menyatakan ucapan syukur atau pujian. “Bersyukur kepada-Mu” mempertahankan nuansa syukur serta akhiran pronominal orang kedua.
- source_word: בְכָל לִבִּי
  choice: dengan segenap hatiku
  rationale: Ungkapan ini secara harfiah berarti “dengan seluruh hatiku” dan menunjuk pada pengabdian batin yang utuh. “Dengan segenap hatiku” alami dan bermartabat dalam bahasa Indonesia.
- source_word: נֶגֶד
  choice: di hadapan
  rationale: נֶגֶד menunjukkan posisi di depan atau dalam kehadiran seseorang. “Di hadapan” tepat, ringkas, dan sesuai dengan ragam puitis.
- source_word: אֱלֹהִים
  choice: para ilah
  rationale: Di sini bentuk אֱלֹהִים dapat dipahami secara plural sebagai ilah-ilah atau makhluk-makhluk surgawi. “Para ilah” mempertahankan bentuk plural dan daya retoris teks tanpa menyamakannya dengan Allah yang sedang disapa.
- source_word: אֲזַמְּרֶךָ
  choice: aku akan menyanyikan puji-pujian bagi-Mu
  rationale: Bentuk Piel dari זמר menyatakan bernyanyi atau bermusik dalam pujian. Terjemahan ini menyampaikan unsur musikal dan ibadah, sedangkan “bagi-Mu” menandai pihak yang dituju.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam frasa נֶגֶד אֱלֹהִים
  choice: para ilah
  alternative: makhluk-makhluk surgawi; malaikat-malaikat; Allah
  rationale: Bentuknya dapat dipakai untuk Allah, ilah-ilah, atau makhluk surgawi, tetapi dalam konstruksi ini paling wajar dipahami sebagai plural. Teks utama memakai “para ilah” sebagai padanan langsung, sementara catatan kaki mempertahankan kemungkinan bahwa yang dimaksud ialah penghuni surga tanpa memaksakan penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Bentuk orang pertama “aku” sesuai dengan suara pemazmur; huruf kapital pada enklitik “-Mu” mengikuti kebiasaan penghormatan kepada Allah dalam penerbitan Alkitab bahasa Indonesia. Paralelisme kedua klausa dan ambiguitas utama teks Ibrani dipertahankan.
