  yaml_path: translation/ot/psalms/138/003.yaml
  text: On the day I called[a], you answered me; you made me bold in my soul with strength.
translation:
  language: id
  text: Pada hari ketika aku berseru, Engkau menjawab aku; Engkau membuat aku berani dalam jiwaku dengan kekuatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau melapangkan batinku dengan kekuatan”; secara lebih idiomatis, “Engkau menguatkan aku di dalam batinku.” Kata kerja Ibraninya sulit dan dapat menyiratkan tindakan membuat berani, melapangkan, atau menguatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם
  choice: Pada hari
  rationale: Mempertahankan ungkapan waktu yang konkret dalam bahasa Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: קָרָאתִי
  choice: aku berseru
  rationale: Dalam konteks doa, קרא berarti memanggil atau berseru. 'Berseru' alami dan tidak harus menyiratkan intensitas berlebihan.
- source_word: וַתַּעֲנֵנִי
  choice: Engkau menjawab aku
  rationale: Mencerminkan verba ענה dan sufiks orang pertama tunggal secara eksplisit.
- source_word: תַּרְהִבֵנִי
  choice: Engkau membuat aku berani
  rationale: Bentuk Hifil yang sulit ini kemungkinan menyatakan tindakan membuat berani atau menguatkan. Pilihan ini mempertahankan daya kausatifnya tanpa menutup kemungkinan makna lain.
- source_word: בְנַפְשִׁי
  choice: dalam jiwaku
  rationale: Menjaga penyebutan eksplisit נֶפֶשׁ sebagai batin atau jiwa, alih-alih meleburkannya menjadi 'di dalam diriku'.
- source_word: עֹז
  choice: dengan kekuatan
  rationale: Mempertahankan nomina 'kekuatan' dan memahaminya secara instrumental bersama klausa sebelumnya.
theological_decisions:
- issue: Makna klausa sulit תַּרְהִבֵנִי בְנַפְשִׁי עֹז
  choice: Tindakan Allah yang membuat pemazmur berani dalam batinnya dengan kekuatan.
  alternative: Engkau melapangkan aku dalam jiwaku dengan kekuatan; atau, Engkau menguatkan aku di dalam batinku.
  rationale: Verba רהב di sini jarang dan maknanya tidak pasti. Teks utama mempertahankan bentuk kausatif, penyebutan jiwa, dan nomina kekuatan, sedangkan catatan kaki membuka alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Engkau' dipakai sebagai sapaan langsung kepada Allah. Susunan klausa sengaja cukup dekat dengan bentuk Ibrani agar ketegangan leksikal pada bagian akhir tetap terlihat.
