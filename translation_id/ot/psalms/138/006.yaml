  yaml_path: translation/ot/psalms/138/006.yaml
  text: For Yahweh is high[a], yet he sees the lowly[c][b]; but the haughty he knows from afar.
translation:
  language: id
  text: Sebab Yahweh itu luhur, namun Ia melihat orang yang rendah[a]; orang yang angkuh Ia kenal dari jauh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang rendah hati.” Kata Ibrani dapat menunjuk pada orang yang rendah kedudukannya atau yang rendah hati.
    reason: lexical_alternative
  - marker: b
    text: Atau “Ia mengenali dari jauh.” Ungkapan Ibrani secara harfiah berbunyi “Ia mengenal dari jauh” dan mungkin menyiratkan jarak dalam hubungan tanpa menyatakannya secara lebih tegas.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau dasar bagi pujian sebelumnya dan tetap wajar dalam alur puisi Indonesia.
- source_word: רָם
  choice: luhur
  rationale: Mengungkapkan kedudukan Yahweh yang tinggi atau mulia. Kata ini mempertahankan metafora ketinggian tanpa memberi kesan terutama tentang lokasi fisik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang diwakili Tetragramaton, bukan menggantinya dengan gelar.
- source_word: שָׁפָל
  choice: orang yang rendah
  rationale: Mempertahankan keluasan makna Ibrani, yang dapat menunjuk pada kerendahan kedudukan maupun kerendahan hati, tanpa mempersempitnya hanya pada salah satu sisi.
- source_word: יִרְאֶה
  choice: Ia melihat
  rationale: Menerjemahkan arti dasar verba secara langsung sambil membiarkan konteks menyiratkan perhatian atau kepedulian.
- source_word: גָבֹהַּ
  choice: orang yang tinggi hati
  rationale: Dalam pertentangannya dengan orang yang rendah, istilah yang secara harfiah berarti 'tinggi' ini mengandung arti kesombongan. Ungkapan Indonesia 'tinggi hati' alami dan mempertahankan citra ketinggian.
- source_word: מִמֶּרְחָק
  choice: dari jauh
  rationale: Mempertahankan ungkapan ruang dalam bahasa Ibrani serta kemungkinan nuansa jarak relasional.
- source_word: יְיֵדָע
  choice: Ia kenal
  rationale: Mempertahankan arti inti 'mengenal' tanpa memperjelasnya secara berlebihan menjadi menolak, menghukum, atau menjauhkan.
theological_decisions:
- issue: Nuansa hubungan dalam pengenalan Allah terhadap orang yang tinggi hati
  choice: Ia kenal dari jauh
  alternative: Ia mengenali dari jauh / Ia menjaga jarak dari
  rationale: Teks Ibrani mengatakan bahwa Yahweh 'mengenal' orang yang tinggi hati 'dari jauh'. Terjemahan ini mempertahankan kemungkinan adanya jarak relasional tanpa mengubah implikasi itu menjadi pernyataan tegas bahwa Ia menolak atau sengaja menjaga jarak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Struktur kontras dipertahankan dengan 'tetapi' dan 'sedangkan'; kapitalisasi pronomina ilahi mengikuti register Alkitab Indonesia yang lazim.
