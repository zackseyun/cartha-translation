  text: אֶשְׁתַּחֲוֶ֨ה אֶל הֵיכַ֪ל קָדְשְׁ/ךָ֡ וְ/א֘וֹדֶ֤ה אֶת שְׁמֶ֗/ךָ עַל חַסְדְּ/ךָ֥ וְ/עַל אֲמִתֶּ֑/ךָ כִּֽי הִגְדַּ֥לְתָּ עַל כָּל שִׁ֝מְ/ךָ֗ אִמְרָתֶֽ/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/002.yaml
  text: I bow down toward your holy temple and give thanks to your name for your steadfast love and your faithfulness[a], for you have exalted your word above all your name.
translation:
  language: id
  text: Aku sujud ke arah bait-Mu yang kudus dan bersyukur kepada nama-Mu karena kasih setia-Mu dan kesetiaan-Mu, sebab Engkau telah meninggikan firman-Mu di atas seluruh nama-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab Engkau telah meninggikan janji-Mu di atas segala sesuatu.” Klausa terakhir dalam bahasa Ibrani sulit; sebagian penafsir memahaminya sebagai, “sebab Engkau telah meninggikan nama-Mu dan firman-Mu di atas segala sesuatu.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׁתַּחֲוֶה
  choice: Aku akan sujud
  rationale: Bentuk verba ini menyatakan tindakan membungkuk atau merebahkan diri dalam penghormatan. “Sujud” mempertahankan tindakan jasmani dalam konteks ibadah dan terdengar wajar dalam bahasa Indonesia.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: ke arah bait-Mu yang kudus
  rationale: אֶל bersifat terarah; “ke arah” menunjukkan orientasi saat sujud tanpa menyiratkan bahwa pemazmur berada di dalam tempat suci. הֵיכָל dalam konteks ini paling tepat diterjemahkan “bait”.
- source_word: וְאוֹדֶה אֶת שִׁמְךָ
  choice: dan bersyukur kepada nama-Mu
  rationale: ידה bentuk Hifil dapat berarti mengucap syukur atau memuji. Frasa-frasa עַל berikutnya menyebut alasan untuk bersyukur, sehingga pilihan ini sesuai dengan sintaksis dan konteks.
- source_word: עַל חַסְדְּךָ
  choice: karena kasih setia-Mu
  rationale: חסד mencakup kasih, kesetiaan, dan komitmen yang teguh. “Kasih setia” merupakan padanan Indonesia yang ringkas dan lazim tanpa mempersempitnya secara berlebihan.
- source_word: וְעַל אֲמִתֶּךָ
  choice: dan kesetiaan-Mu
  rationale: אמת dapat berarti kebenaran, keteguhan, atau kesetiaan. Dalam kesejajaran dengan חסד, “kesetiaan” menonjolkan sifat Allah yang dapat diandalkan.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan dasar atau alasan bagi ucapan syukur.
- source_word: הִגְדַּלְתָּ
  choice: Engkau telah meninggikan
  rationale: Bentuk Hifil dari גדל berarti membuat besar atau mengagungkan. “Meninggikan” mempertahankan gagasan pemberian kedudukan atau kehormatan yang luhur.
- source_word: עַל כָּל שִׁמְךָ
  choice: di atas seluruh nama-Mu
  rationale: Susunan Ibraninya sulit, tetapi padanan ini mengikuti urutan dan hubungan gramatikal Teks Masoret secara dekat, tanpa diam-diam menghaluskan ketegangannya.
- source_word: אִמְרָתֶךָ
  choice: firman-Mu
  rationale: אִמְרָה dapat berarti perkataan, firman, atau janji. “Firman” cukup luas untuk mempertahankan cakupan aslinya, sementara konteks tetap memungkinkan nuansa janji.
theological_decisions:
- issue: Penafsiran klausa sulit כִּי הִגְדַּלְתָּ עַל כָּל שִׁמְךָ אִמְרָתֶךָ
  choice: sebab Engkau telah meninggikan firman-Mu di atas seluruh nama-Mu
  alternative: sebab Engkau telah meninggikan janji-Mu di atas segala sesuatu; atau, sebab Engkau telah meninggikan nama-Mu dan firman-Mu di atas segala sesuatu
  rationale: Teks Masoret sulit secara sintaksis dan telah dipahami dengan beberapa cara. Teks utama mengikuti urutan Ibrani secara dekat serta mempertahankan ketegangannya, sedangkan penafsiran yang lebih lancar dicantumkan dalam catatan kaki. Rumusan ini tidak dimaksudkan untuk merendahkan nama Allah, melainkan membiarkan hubungan antara firman dan nama-Nya tetap sebagaimana dinyatakan oleh teks yang sulit tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia. “Bait” dipilih sebagai istilah ibadah yang ringkas dan mudah dikenali; struktur klausa terakhir sengaja tetap agak tidak biasa untuk mempertahankan kesulitan asli teks Ibrani.
