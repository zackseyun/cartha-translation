id: PSA.138.8
reference: Psalms 138:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/008.yaml
  text: Yahweh will fulfill his purpose for me[a]; O Yahweh, your steadfast love endures forever[b]. Do not forsake the work of your hands.
translation:
  language: id
  text: 'Yahweh akan menyelesaikan apa yang menyangkut aku.[a]

    Ya Yahweh, kasih setia-Mu untuk selama-lamanya.

    Jangan tinggalkan karya tangan-Mu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh akan bertindak sampai tuntas demi aku.”
    reason: alternative_reading
  - marker: b
    text: Atau, “Jangan lepaskan karya-karya tangan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi Allah yang dinyatakan dalam Tetragramaton, bukan menggantinya dengan gelar.
- source_word: יִגְמֹר
  choice: akan menyelesaikan
  rationale: Kata kerja גמר menyatakan tindakan menuntaskan atau membawa sesuatu hingga selesai. Pilihan ini mempertahankan gagasan penyelesaian tanpa menambahkan objek seperti 'rencana' yang tidak tersurat dalam bahasa Ibrani.
- source_word: בַּעֲדִי
  choice: apa yang menyangkut aku
  rationale: Preposisi בעד dengan akhiran orang pertama dapat berarti 'demi aku', 'untukku', atau 'mengenai aku'. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan keluasan maknanya.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: חסד mencakup kasih yang teguh, loyal, dan berkomitmen; 'kasih setia' merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyampaikan keberlangsungan tanpa akhir dalam klausa nominal Ibrani tanpa perlu menambahkan kata kerja yang tidak tersurat.
- source_word: מַעֲשֵׂי יָדֶיךָ
  choice: karya tangan-Mu
  rationale: '''Karya'' dapat dipakai secara kolektif dalam bahasa Indonesia, sehingga mempertahankan ungkapan kiasan Ibrani tanpa menentukan apakah acuannya satu karya tertentu atau seluruh karya Allah.'
- source_word: אַל תֶּרֶף
  choice: Jangan tinggalkan
  rationale: רפה secara dasar berarti mengendurkan, melepaskan, atau berhenti menangani. Dalam permohonan ini, 'jangan tinggalkan' menyampaikan seruan agar Allah tidak membiarkan karya-Nya terbengkalai.
theological_decisions:
- issue: Acuan tindakan penyelesaian dalam יִגְמֹר בַּעֲדִי
  choice: Yahweh akan menyelesaikan apa yang menyangkut aku
  alternative: Yahweh akan bertindak sampai tuntas demi aku; Yahweh akan menggenapi tujuan-Nya bagiku
  rationale: Bahasa Ibrani tidak menyebut 'tujuan' atau 'rencana' secara eksplisit. Terjemahan utama mempertahankan ketidakjelasan objek sekaligus menghasilkan kalimat Indonesia yang dapat dipahami.
- issue: Cakupan מַעֲשֵׂי יָדֶיךָ
  choice: karya tangan-Mu
  alternative: karya-karya tangan-Mu; apa yang telah tangan-Mu kerjakan
  rationale: Ungkapan kolektif ini tidak membatasi acuan hanya pada pemazmur atau memperluasnya secara pasti kepada seluruh ciptaan.
- issue: Hubungan חַסְדְּךָ לְעוֹלָם
  choice: kasih setia-Mu untuk selama-lamanya
  alternative: kasih setia-Mu tetap untuk selama-lamanya
  rationale: Klausa Ibrani tidak memiliki kata kerja tersurat. Bentuk nominal dipertahankan secara alami dan khidmat dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Bentuk sapaan 'Ya Yahweh' alami untuk doa. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia, sementara susunan baris mempertahankan tiga gerak puitis ayat.
