id: PSA.138.4
reference: Psalms 138:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַלְכֵי אָ֑רֶץ כִּ֥י שָׁ֝מְע֗וּ אִמְרֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/004.yaml
  text: All the kings of the earth will give thanks to you[a], O Yahweh, for they have heard the words of your mouth.
translation:
  language: id
  text: Semua raja di bumi akan bersyukur kepada-Mu, ya Yahweh, sebab mereka telah mendengar perkataan dari mulut-Mu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: akan bersyukur kepada-Mu
  rationale: Bentuk Hifil dari ידה dapat berarti mengucap syukur atau memuji. Dalam konteks mazmur ucapan syukur dan dengan sufiks objek orang kedua, frasa ini paling tepat menyatakan ucapan syukur yang diarahkan kepada Allah.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh'; partikel 'ya' menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: כָּל מַלְכֵי אָרֶץ
  choice: semua raja di bumi
  rationale: Terjemahan ini mempertahankan cakupan kolektif כָּל dan sebutan khusus bagi para penguasa, sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan para raja akan bersyukur. 'Sebab' mempertahankan hubungan kausal dengan ragam yang wajar dan bermartabat.
- source_word: שָׁמְעוּ
  choice: mereka telah mendengar
  rationale: Bentuk qatal menunjukkan tindakan yang sudah terjadi dan menjadi dasar bagi respons yang akan datang.
- source_word: אִמְרֵי פִיךָ
  choice: perkataan dari mulut-Mu
  rationale: Terjemahan ini mempertahankan gambaran konkret bahasa Ibrani bahwa perkataan itu keluar dari mulut Allah, tanpa terdengar terlalu kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Nuansa יוֹדוּךָ
  choice: akan bersyukur kepada-Mu
  alternative: akan memuji-Mu
  rationale: Kata kerja ידה dapat mencakup syukur dan pujian. Konteks mazmur ini mendukung 'bersyukur', tetapi nuansa pujian tetap melekat dan tidak dimaksudkan untuk disangkal.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam puitis yang sederhana dan bermartabat. Kapitalisasi pada enklitik sapaan ilahi ('-Mu') mengikuti kebiasaan penulisan rohani Indonesia. Urutan sebab-akibat dan citra 'mulut-Mu' dipertahankan dari teks Ibrani.
