base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: id
  text: Namun, Allah akan merobohkanmu untuk selama-lamanya; Ia akan menyambarmu dan menyeretmu keluar dari kemahmu,[a] lalu mencabut akarmu dari negeri orang-orang hidup.[b] Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari kemah”; maksudnya dapat pula dipahami sebagai “dari kediamanmu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan akarmu dari negeri orang-orang hidup.” Susunan puitis ini menyiratkan tindakan mencabut akar.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Namun
  rationale: Partikel ini pada dasarnya berarti 'juga/bahkan'; dalam konteks, partikel tersebut menandai kontras dengan kesombongan orang fasik. 'Namun' mengungkapkan daya adversatif wacananya secara alami dalam bahasa Indonesia.
- source_word: אֵל
  choice: Allah
  rationale: Kata ini menunjuk kepada Allah Israel; 'Allah' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: יִתָּצְךָ
  choice: akan merobohkan engkau
  rationale: Verba נתץ menggambarkan pembongkaran atau perobohan yang keras, sering terhadap bangunan. Ungkapan ini mempertahankan citra penghancuran.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Makna paling alami ialah keberlangsungan permanen. Pilihan ini mempertahankan finalitas penghukuman tanpa menjelaskan lebih jauh daripada teks.
- source_word: יַחְתְּךָ
  choice: Ia akan menyambar engkau
  rationale: Verba langka חתה di sini menyampaikan tindakan mengambil atau merenggut secara paksa. 'Menyambar' mempertahankan gerak yang mendadak dan keras.
- source_word: וְיִסָּחֲךָ
  choice: dan menyeret engkau keluar
  rationale: נסח berarti menarik, mencabut, atau menyingkirkan. 'Menyeret ... keluar' jelas dan konkret dalam hubungan dengan kemah.
- source_word: מֵאֹהֶל
  choice: dari kemahmu
  rationale: Teks secara harfiah menyebut 'kemah'; sufiks orang kedua tersirat pada rangkaian verbal dalam bentuk Masoret. Citra konkret dipertahankan daripada digeneralisasi menjadi 'kediaman'.
- source_word: וְשֵׁרֶשְׁךָ
  choice: lalu mencabut akar-akarmu
  rationale: Bentuk Ibrani secara harfiah nominal, 'dan akarmu', dalam konstruksi puitis eliptis. Padanan ini memasok tindakan yang tersirat sekaligus mempertahankan metafora akar.
- source_word: מֵאֶרֶץ חַיִּים
  choice: dari negeri orang-orang hidup
  rationale: Ungkapan Ibrani ini menunjuk pada ranah kehidupan, berlawanan dengan kematian. Bentuk ini alami dalam bahasa Indonesia dan tetap dekat dengan citra sumber.
- source_word: סֶלָה
  choice: Sela
  rationale: Arti teknis istilah ini tidak pasti; transliterasi menghindari penafsiran spekulatif.
theological_decisions:
- issue: Sifat penghukuman dalam לָנֶצַח
  choice: untuk selama-lamanya
  alternative: sepenuhnya; sekali untuk selamanya
  rationale: Makna temporal permanen paling wajar. Terjemahan mempertahankan kerasnya penghukuman ilahi tanpa menetapkan rincian metafisis yang tidak disebutkan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan pronomina 'engkau' yang sesuai bagi sapaan tunggal dalam mazmur. Citra perobohan, kemah, dan akar dipertahankan. Semua penanda catatan kaki ditempatkan dalam teks utama.
