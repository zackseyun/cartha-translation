  text: אָהַ֥בְתָּ כָֽל דִּבְרֵי בָ֗לַע לְשׁ֣וֹן מִרְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/005.yaml
  text: You love all words of destruction[a], O deceitful tongue.
translation:
  language: id
  text: Engkau telah menyukai segala perkataan yang mendatangkan kebinasaan[a], hai lidah penuh tipu daya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, frasa ini berbunyi “perkataan-perkataan penelanan” atau “perkataan-perkataan yang menelan habis”; kata Ibrani itu memakai citra menelan atau melahap habis.
    reason: Menjelaskan metafora dasar בָלַע yang secara idiomatis diterjemahkan sebagai kebinasaan dalam konteks ini.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Engkau menyukai
  rationale: Bentuk Qal perfek orang kedua maskulin tunggal menyatakan sikap yang telah menjadi pola tetap. Dalam tuduhan puitis langsung, bentuk kini bahasa Indonesia terdengar alami; “menyukai” juga sesuai untuk objek berupa jenis perkataan.
- source_word: כָל דִּבְרֵי
  choice: segala perkataan
  rationale: כָל dengan bentuk jamak konstruksi mencakup seluruh jenis perkataan yang dimaksud. “Segala perkataan” alami dalam bahasa Indonesia dan mempertahankan keluasan tuduhan.
- source_word: בָלַע
  choice: yang membinasakan
  rationale: Kata ini berhubungan dengan tindakan menelan atau melahap habis dan secara metaforis menunjuk pada kehancuran. “Yang membinasakan” menyampaikan daya rusak perkataan secara jelas, sedangkan citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: לְשׁוֹן
  choice: lidah
  rationale: Terjemahan harfiah ini mempertahankan metafora puitis Ibrani yang lazim untuk kemampuan atau tindakan berbicara.
- source_word: מִרְמָה
  choice: penipu
  rationale: Nomina ini berarti tipu daya atau kelicikan. Dalam sapaan kepada “lidah”, “lidah penipu” merupakan ungkapan Indonesia yang ringkas dan alami tanpa menghilangkan personifikasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan mudah dipahami. Sapaan “hai” mempertahankan nada tuduhan langsung; metafora “lidah” dipertahankan, sementara metafora sulit pada בָלַע dijelaskan melalui catatan kaki.
