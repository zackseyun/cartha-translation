base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/001.yaml
  text: when Doeg the Edomite came and told Saul[a], saying to him, “David has come to the house of Ahimelech.”
translation:
  language: id
  text: ketika Doeg, orang Edom itu, datang dan memberi tahu Saul, “Daud telah datang[a] ke rumah Ahimelekh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Daud datang ke rumah Ahimelekh.” Dalam tuturan yang dilaporkan, bentuk perfektif Ibrani dapat diterjemahkan sebagai peristiwa lampau biasa atau sebagai tindakan yang sudah terjadi dan masih relevan pada saat laporan disampaikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: ketika ... datang
  rationale: Preposisi ב dengan infinitif konstruk בוא membentuk anak kalimat waktu; ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan hubungan temporal teks Ibrani.
- source_word: דּוֹאֵג
  choice: Doeg
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הָאֲדֹמִי
  choice: orang Edom itu
  rationale: Bentuk nisbah ini menyatakan asal atau identitas Doeg sebagai orang Edom; kata sandang Ibrani tercermin secara wajar melalui “itu”.
- source_word: וַיַּגֵּד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan; “memberi tahu” sesuai dengan konteks laporan kepada Saul.
- source_word: לְשָׁאוּל
  choice: Saul
  rationale: Penanda objek tak langsung ל diwujudkan secara idiomatis melalui konstruksi “memberi tahu Saul”.
- source_word: וַיֹּאמֶר לוֹ
  choice: katanya kepadanya
  rationale: Frasa ini memperkenalkan isi laporan dan mempertahankan rujukan pronomina kepada Saul tanpa menghasilkan susunan yang kaku.
- source_word: בָּא
  choice: telah datang
  rationale: Bentuk perfektif Qal menyatakan tindakan yang sudah selesai; “telah datang” juga dapat membawa relevansi kini dari sudut pandang laporan kepada Saul.
- source_word: דָוִד
  choice: Daud
  rationale: Menggunakan bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: אֶל בֵּית
  choice: ke rumah
  rationale: אֶל menyatakan arah menuju tempat, sedangkan בֵּית dalam konteks naratif ini paling wajar dipahami sebagai rumah fisik.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelekh
  rationale: Nama diri ditransliterasikan dengan “kh” untuk mencerminkan konsonan akhir כ dan mengikuti pola transliterasi Indonesia yang mudah dikenali.
