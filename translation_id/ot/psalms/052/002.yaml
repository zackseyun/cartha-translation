  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: id
  text: Mengapa engkau bermegah dalam kejahatan, hai orang perkasa? Kasih setia Allah tetap ada sepanjang hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: senantiasa.'
    reason: כָּל־הַיּוֹם secara harfiah berarti "sepanjang hari", tetapi dalam konteks tertentu dapat berfungsi idiomatis dengan arti "terus-menerus" atau "senantiasa".
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: membanggakan kejahatan
  rationale: 'Bentuk hitpael dari הלל menyatakan bermegah atau membanggakan diri, sedangkan בְּרָעָה menunjukkan hal yang menjadi dasar kebanggaan itu: kejahatan.'
- source_word: הַגִּבּוֹר
  choice: hai orang perkasa
  rationale: Istilah גִּבּוֹר dapat menunjuk orang yang kuat, gagah, atau berkuasa; 'orang perkasa' mempertahankan keluasan makna serta nada sapaan langsung.
- source_word: חֶסֶד אֵל
  choice: kasih setia Allah
  rationale: חֶסֶד mencakup kasih yang teguh dan kesetiaan; 'kasih setia' merupakan padanan Indonesia yang ringkas dan lazim, sementara אֵל diterjemahkan 'Allah'.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini secara harfiah berarti 'segenap hari' dan secara idiomatis dapat menyatakan terus-menerus; terjemahan utama mempertahankan gambaran temporal sumber.
theological_decisions:
- issue: Hubungan klausa 'kasih setia Allah' dengan pertanyaan sebelumnya
  choice: Dipertahankan sebagai pernyataan tersendiri tanpa menambahkan penghubung tafsiran
  alternative: Menambahkan 'padahal', atau mengikuti pembacaan yang mengaitkannya dengan ejekan terhadap orang perkasa
  rationale: Teks Ibrani hanya menempatkan klausa nominal חֶסֶד אֵל כָּל־הַיּוֹם setelah sapaan, sehingga hubungan logisnya tetap tersirat dan tidak seharusnya dipersempit.
- issue: Nuansa temporal כָּל־הַיּוֹם
  choice: sepanjang hari
  alternative: senantiasa
  rationale: '''Sepanjang hari'' mempertahankan bentuk konkret ungkapan Ibrani, sementara catatan kaki menjelaskan kemungkinan daya idiomatisnya.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan 'hai orang perkasa' menjaga nada puitis serta konfrontatif mazmur tanpa menjadi arkais berlebihan.
