  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: id
  text: Namun aku seperti pohon zaitun yang subur[a] di rumah Allah; aku percaya pada kasih setia[b] Allah untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang hijau” atau “yang segar.” Kata Ibraninya menekankan kesegaran dan daya hidup.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ḥesed menunjuk pada kasih yang teguh dan penuh kesetiaan; dapat juga diterjemahkan “belas kasih,” “kemurahan,” atau “kasih perjanjian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Kata penghubung dan kata ganti mandiri menandai pertentangan dengan orang fasik dalam konteks sebelumnya. “Namun aku” menyampaikan kontras itu secara alami dan ringkas.
- source_word: כְּזַיִת
  choice: seperti pohon zaitun
  rationale: Prefiks כְּ menyatakan perbandingan. Walaupun זַיִת secara harfiah berarti “zaitun”, konteks gambaran tumbuhan menunjukkan pohon zaitun.
- source_word: רַעֲנָן
  choice: yang subur
  rationale: Kata sifat ini menggambarkan kesegaran, kehijauan, dan daya hidup, bukan warna saja. “Subur” menyampaikan vitalitas tersebut dalam bahasa Indonesia yang wajar.
- source_word: בְּבֵית אֱלֹהִים
  choice: di rumah Allah
  rationale: Terjemahan langsung ini mempertahankan gambaran tempat kudus atau bait tanpa mempersempit acuannya.
- source_word: בָּטַחְתִּי
  choice: aku percaya
  rationale: Bentuk perfektif Ibrani di sini dapat menyatakan sikap percaya yang telah teguh dan tetap berlangsung. Bentuk kini paling sesuai dengan pengakuan pemazmur dan keterangan “untuk selama-lamanya”.
- source_word: בְחֶסֶד
  choice: kepada kasih setia
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan kemurahan yang teguh. “Kasih setia” merupakan padanan Indonesia yang ringkas dan mempertahankan keluasan maknanya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Gelar ilahi umum ini jelas mengacu kepada Allah Israel; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: עוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Ungkapan berpasangan ini menegaskan keberlangsungan tanpa akhir. “Untuk selama-lamanya” mempertahankan penekanan tersebut secara alami.
theological_decisions:
- issue: Pemaknaan חֶסֶד dalam konteks keyakinan kepada Allah
  choice: kasih setia
  alternative: belas kasih; kasih perjanjian; kemurahan
  rationale: “Kasih setia” mempertahankan unsur kasih dan kesetiaan Allah tanpa membatasi istilah itu hanya pada belas kasihan atau memasukkan rumusan teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan kontras, metafora pohon zaitun, gambaran rumah Allah, dan penegasan durasi. Penanda catatan kaki ditempatkan tepat sesudah istilah yang dijelaskan.
