id: PSA.52.8
reference: Psalms 52:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: id
  text: Lihatlah, inilah orang yang tidak menjadikan Allah tempat perlindungannya[a], tetapi mengandalkan kekayaannya yang melimpah dan menjadi kuat dalam kehancurannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bentengnya” atau “kubu pertahanannya.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani הַוָּה juga dapat berarti “keruntuhan,” “hasrat jahat,” atau “rancangan yang merusak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata seru deiktis ini mengarahkan perhatian kepada orang yang dijadikan contoh; “Lihatlah” wajar dalam bahasa Indonesia modern dan tetap mempertahankan daya penunjuknya.
- source_word: הַגֶּבֶר
  choice: orang
  rationale: Nomina ini berbentuk maskulin tunggal dan dapat menyiratkan keperkasaan, tetapi di sini terutama menunjuk kepada sosok tertentu dalam pernyataan demonstratif. “Orang” terdengar alami tanpa menambahkan gagasan bahwa ia sungguh perkasa.
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: tidak menjadikan Allah tempat perlindungannya
  rationale: שׂים menyatakan menjadikan atau menetapkan, sedangkan מָעוֹז menunjuk tempat atau sumber keamanan dan kekuatan. “Tempat perlindungan” jelas dan idiomatis; citra benteng dipertahankan dalam catatan kaki.
- source_word: וַיִּבְטַח
  choice: tetapi mengandalkan
  rationale: Kata penghubung waw secara harfiah dapat diterjemahkan “dan”, tetapi konteksnya mengontraskan penolakan menjadikan Allah perlindungan dengan kepercayaan kepada kekayaan. “Mengandalkan” menyampaikan kepercayaan yang dijadikan sandaran.
- source_word: בְּרֹב עָשְׁרוֹ
  choice: kekayaannya yang melimpah
  rationale: רֹב menyatakan kelimpahan atau besarnya jumlah, dan עֹשֶׁר berarti kekayaan. Ungkapan ini mempertahankan kedua unsur secara alami.
- source_word: יָעֹז
  choice: menjadi kuat
  rationale: Verba ini menyatakan menjadi kuat atau menunjukkan kekuatan. Terjemahan ini menjaga bentuk pernyataan Ibrani dan tidak menambahkan nuansa refleksif atau tujuan yang tidak dinyatakan secara tegas.
- source_word: בְּהַוָּתוֹ
  choice: dalam kehancurannya
  rationale: הַוָּה dapat berarti kehancuran, keruntuhan, hasrat jahat, atau rancangan yang merusak. “Kehancurannya” mempertahankan ironi bahwa sumber kekuatan semunya justru bersifat menghancurkan, sementara alternatif penting dicatat.
theological_decisions:
- issue: Rujukan tunggal maskulin הַגֶּבֶר
  choice: orang
  alternative: laki-laki itu; orang perkasa itu
  rationale: Konteks menggambarkan satu sosok tertentu sebagai contoh orang fasik. Bahasa Indonesia tidak perlu menandai gender pada “orang”; menerjemahkannya sebagai “laki-laki” atau “orang perkasa” akan menonjolkan unsur yang bukan pokok pernyataan.
- issue: Makna הַוָּה
  choice: kehancuran
  alternative: keruntuhan; hasrat jahat; rancangan yang merusak
  rationale: Istilah Ibrani ini memiliki rentang makna yang sukar dipastikan di sini. Teks utama mempertahankan pembacaan “kehancuran” dan ironi teologis tentang rasa aman palsu, tanpa menutup kemungkinan makna lain yang dicantumkan dalam catatan kaki.
- issue: Hubungan antara יָעֹז dan בְּהַוָּתוֹ
  choice: menjadi kuat dalam kehancurannya
  alternative: mencari kekuatan dalam kehancurannya
  rationale: Bentuk Ibrani secara langsung menyatakan menjadi atau tampil kuat, bukan secara eksplisit tindakan mencari kekuatan. Terjemahan utama mempertahankan ketegangan ungkapan yang ganjil dan ironis itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Lihatlah, inilah” mempertahankan tekanan demonstratif pembuka; susunan akhir sengaja mempertahankan ironi dan ambiguitas teks Ibrani. Penanda catatan kaki ditempatkan langsung pada ungkapan yang dijelaskannya.
