  terminology: “Kejahatan” dan “kebaikan” tepat untuk kontras רָּע dan טוֹב. “Kebohongan” untuk שֶׁקֶר dan “kebenaran” untuk צֶדֶק cocok dalam konteks ujaran tanpa menghapus dimensi etisnya. “Sela” tepat dipertahankan sebagai transliterasi. Catatan kaki menyajikan alternatif yang sah dan jangkar [a] ditempatkan dengan tepat.
