  text: אָהַ֣בְתָּ רָּ֣ע מִ/טּ֑וֹב שֶׁ֓קֶר מִ/דַּבֵּ֖ר צֶ֣דֶק סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/004.yaml
  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: id
  text: Engkau lebih mencintai kejahatan daripada kebaikan, kebohongan daripada mengatakan kebenaran.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dusta daripada mengatakan apa yang benar.”
    reason: Alternatif leksikal dan idiomatis untuk שֶׁקֶר serta צֶדֶק dalam konteks perkataan.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Engkau lebih mencintai
  rationale: Bentuk Qal perfek orang kedua tunggal maskulin menyapa pelaku secara langsung. Dalam tuduhan puitis ini, bahasa Indonesia paling alami memakai bentuk kini; unsur perbandingan dari מִן juga dirangkaikan dengan verba sebagai “lebih ... daripada”.
- source_word: רָּע
  choice: kejahatan
  rationale: Sebagai objek yang dipertentangkan dengan טוֹב, kata ini terutama menunjuk pada keburukan moral, bukan sekadar bahaya atau kerugian.
- source_word: מִטּוֹב
  choice: daripada kebaikan
  rationale: Preposisi מִן menyatakan perbandingan atau pilihan yang diutamakan setelah verba mencintai; “daripada” menyampaikan hubungan itu secara alami.
- source_word: שֶׁקֶר
  choice: kebohongan
  rationale: Nomina ini mencakup kepalsuan dan dusta. “Kebohongan” jelas bagi pembaca umum dan tetap mempertahankan kesejajaran abstrak dengan kebenaran.
- source_word: מִדַּבֵּר
  choice: daripada mengatakan
  rationale: מִן kembali menandai hal yang dibandingkan, sedangkan bentuk verbal דַּבֵּר menyatakan tindakan berbicara atau mengatakan.
- source_word: צֶדֶק
  choice: kebenaran
  rationale: Dalam pertentangan langsung dengan שֶׁקֶר dan dalam konteks ucapan, צֶדֶק menunjuk pada apa yang benar atau lurus. “Kebenaran” mempertahankan bobot moralnya sekaligus terdengar wajar dengan verba “mengatakan”.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal ini ditransliterasikan karena arti dan fungsi tepatnya tidak pasti.
theological_decisions:
- issue: Makna צֶדֶק dalam konteks perkataan
  choice: kebenaran
  alternative: apa yang benar; keadilan; kelurusan
  rationale: Konteks memperhadapkan kebohongan dengan ucapan yang benar. “Kebenaran” menjaga cakupan moral kata tersebut tanpa membatasinya pada keadilan sosial atau hukum, sementara catatan kaki mempertahankan kemungkinan ungkapan idiomatis “apa yang benar”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan tuduhan langsung. Pengulangan “daripada” mempertahankan kesejajaran Ibrani. “Sela” dipertahankan sebagai transliterasi tanpa menafsirkan fungsinya.
