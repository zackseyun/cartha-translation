  source_fidelity: 'Terjemahan mempertahankan dua perbandingan preferensial מן: kejahatan dibandingkan dengan kebaikan, dan kebohongan dibandingkan dengan tindakan mengatakan kebenaran. Sapaan orang kedua tunggal, nada tuduhan puitis, dan istilah סֶלָה juga terpelihara. Pemakaian bentuk kini dalam bahasa Indonesia wajar untuk perfek Ibrani dalam tuduhan yang menggambarkan kecenderungan menetap.'
