  text: הַ֭וּוֹת תַּחְשֹׁ֣ב לְשׁוֹנֶ֑/ךָ כְּ/תַ֥עַר מְ֝לֻטָּ֗שׁ עֹשֵׂ֥ה רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/003.yaml
  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
translation:
  language: id
  text: Engkau merancang kehancuran; lidahmu seperti pisau cukur yang diasah, melakukan tipu daya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “melakukan tipu daya” dapat menggambarkan lidah itu sendiri atau orang yang disapa sebagai pelaku tipu daya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: kehancuran
  rationale: Bentuk jamak ini secara idiomatis menunjuk pada berbagai tindakan atau akibat yang menghancurkan; bentuk kolektif tunggal terdengar alami dalam bahasa Indonesia.
- source_word: תַּחְשֹׁב
  choice: merancang
  rationale: Imperfek Qal orang kedua maskulin tunggal ini menyatakan perencanaan yang disengaja, bukan sekadar berpikir.
- source_word: לְשׁוֹנֶךָ
  choice: lidahmu
  rationale: Metafora tubuh dipertahankan agar lidah tetap tampil sebagai alat perkataan yang mencelakakan.
- source_word: כְתַעַר מְלֻטָּשׁ
  choice: seperti pisau cukur yang diasah
  rationale: Perbandingan dan citra bilah tajam dipertahankan secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עֹשֵׂה רְמִיָּה
  choice: melakukan tipu daya
  rationale: Ungkapan ini mempertahankan daya verbal partisipel dan, karena ditempatkan setelah gambaran lidah, tetap memungkinkan rujukan kepada lidah atau kepada orang yang disapa.
theological_decisions:
- issue: Rujukan gramatikal עֹשֵׂה רְמִיָּה
  choice: 'Ambiguitas dipertahankan dalam teks: “melakukan tipu daya” dapat menerangkan lidah atau orang yang disapa.'
  alternative: Menegaskan salah satu subjek, misalnya “engkau yang melakukan tipu daya” atau “lidahmu ... menipu”.
  rationale: Bentuk partisipel maskulin tunggal dan susunan puitis memungkinkan lebih dari satu hubungan sintaksis; terjemahan tidak seharusnya menutup ketegangan itu.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, ringkas, dan puitis. Tanda titik koma mempertahankan pemisahan sintaksis: “engkau” adalah subjek “merancang”, sedangkan “lidahmu” memulai klausa perbandingan berikutnya.'
