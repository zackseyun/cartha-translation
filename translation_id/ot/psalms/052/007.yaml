  terminology: “Orang-orang benar” merupakan padanan yang tepat untuk צַדִּיקִים. “Takut” mempertahankan keluasan ירא, dan catatan kaki secara tepat memberi kemungkinan “gentar” serta nuansa takut penuh hormat tanpa memaksakan salah satunya. Catatan untuk “menertawakan” juga tepat membedakan makna leksikal dasar dari nada cemooh yang tersirat konteks.
