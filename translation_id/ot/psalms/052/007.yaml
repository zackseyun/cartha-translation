  source_fidelity: 'Teks Indonesia dengan setia mengikuti tiga verba imperfek jamak dalam Ibrani: orang-orang benar akan melihat, takut, lalu tertawa terhadap dia. Terjemahan tidak menambahkan objek pada “melihat” atau “takut,” sehingga ambiguitas yang ringkas dalam teks sumber tetap terjaga. “Menertawakan dia” menyampaikan konstruksi שׂחק על secara wajar tanpa menggantikan verba dasar “tertawa” dengan tafsiran yang lebih kuat seperti “mengejek.”'
