  text: וְ/יִרְא֖וּ צַדִּיקִ֥ים וְ/יִירָ֗אוּ וְ/עָלָ֥י/ו יִשְׂחָֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/007.yaml
  text: 'The righteous will see and fear[b][a], and they will laugh at him:'
translation:
  language: id
  text: 'Orang-orang benar akan melihat dan takut[a], lalu mereka akan menertawakan dia[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gentar”; kata Ibrani ini dapat menyatakan rasa takut, tetapi dalam konteks ini juga dapat mengandung makna takut penuh hormat di hadapan penghakiman Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengejek dia.” Kata Ibrani dasarnya berarti “tertawa”; konteks menyiratkan tawa yang mencemooh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוּ
  choice: akan melihat
  rationale: Bentuk imperfek Qal orang ketiga jamak dari ראה menyatakan tindakan yang akan terjadi dalam rangkaian puitis. Pilihan ini mempertahankan makna langsung ‘melihat’ tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva jamak ini dipakai sebagai nomina. ‘Orang-orang benar’ alami dalam bahasa Indonesia dan mempertahankan kategori moral yang dimaksud.
- source_word: וְיִירָאוּ
  choice: takut
  rationale: Bentuk imperfek Qal orang ketiga jamak dari ירא. ‘Takut’ mempertahankan ungkapan Ibrani yang ringkas serta membuka kemungkinan nuansa gentar maupun takut penuh hormat dalam menghadapi penghakiman Allah.
- source_word: וְעָלָיו
  choice: dia (sebagai sasaran dalam ‘menertawakan dia’)
  rationale: Preposisi עַל bersama שׂחק menandai orang yang menjadi sasaran tawa. Susunan ‘menertawakan dia’ merupakan padanan Indonesia yang alami.
- source_word: יִשְׂחָקוּ
  choice: akan menertawakan
  rationale: Bentuk imperfek Qal orang ketiga jamak dari שׂחק pada dasarnya berarti ‘tertawa’; bentuk transitif ‘menertawakan’ menyampaikan bahwa tawa itu diarahkan kepada orang tersebut, sementara konteks menyiratkan ejekan.
theological_decisions:
- issue: Makna ‘takut’ sebagai tanggapan terhadap penghakiman
  choice: takut
  alternative: gentar; takut dengan penuh hormat
  rationale: Ayat ini menggambarkan orang-orang benar yang menyaksikan penghakiman atas orang fasik. ‘Takut’ mempertahankan ketegangan antara rasa gentar dan rasa takut penuh hormat tanpa membatasinya hanya pada salah satu nuansa.
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bermartabat. Pengulangan subjek melalui ‘mereka’ menjaga kejelasan rangkaian tindakan, sedangkan ‘lalu’ mengalirkan urutan puitis tanpa mengubah hubungan dasarnya.
