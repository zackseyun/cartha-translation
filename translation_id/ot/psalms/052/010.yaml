base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: id
  text: Aku akan bersyukur kepada-Mu untuk selama-lamanya, karena Engkau telah bertindak. Aku akan berharap pada nama-Mu[a], sebab itu baik[b], di hadapan orang-orang yang setia kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan menantikan nama-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebab nama-Mu baik.”
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Aku akan bersyukur kepada-Mu
  rationale: Bentuk hifil dari ידה menyatakan ucapan syukur atau pujian yang diarahkan kepada Allah. “Bersyukur kepada-Mu” alami dalam bahasa Indonesia dan sesuai dengan tanggapan pemazmur atas tindakan Allah.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan jangka waktu yang terus berlangsung; bentuk Indonesia ini mempertahankan nada puitis dan agung.
- source_word: כִּי עָשִׂיתָ
  choice: karena Engkau telah bertindak
  rationale: כִּי bersifat kausal, sedangkan עשה dapat berarti melakukan atau bertindak. “Telah bertindak” tidak menambahkan objek yang tidak disebutkan dalam teks Ibrani.
- source_word: וַאֲקַוֶּה
  choice: Aku akan menantikan
  rationale: קוה mencakup penantian yang penuh harap. “Menantikan” mempertahankan gambaran verbal teks sumber, sedangkan nuansa “berharap” dicatat sebagai alternatif.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Terjemahan langsung ini mempertahankan idiom Alkitab tentang nama sebagai penyataan watak dan reputasi Allah.
- source_word: כִּי טוֹב
  choice: sebab itu baik
  rationale: Klausa Ibrani sangat ringkas dan tidak menyebut subjek bagi “baik” secara eksplisit. Kata “itu” mempertahankan kekompakan dan sebagian keterbukaan rujukannya.
- source_word: נֶגֶד חֲסִידֶיךָ
  choice: di hadapan orang-orang yang setia kepada-Mu
  rationale: נֶגֶד menunjukkan kehadiran atau pandangan orang lain. חֲסִידֶיךָ menunjuk kepada umat Allah yang bercirikan kesetiaan dan pengabdian; terjemahan ini jelas tanpa memakai istilah gerejawi teknis.
theological_decisions:
- issue: Makna penantian kepada nama Allah
  choice: Aku akan menantikan nama-Mu
  alternative: Aku akan berharap pada nama-Mu
  rationale: Teks utama mempertahankan citra penantian dalam קוה dan ungkapan “nama-Mu”; catatan kaki menyediakan nuansa pengharapan yang juga terkandung dalam kata tersebut.
- issue: Rujukan kata טוֹב (“baik”)
  choice: sebab itu baik
  alternative: sebab nama-Mu baik
  rationale: Bahasa Ibrani tidak mengulang “nama-Mu” sebagai subjek. Terjemahan utama mempertahankan keringkasan dan ambiguitas sintaksisnya, sementara catatan memberikan pembacaan yang paling dekat secara kontekstual.
- issue: Sebutan bagi חֲסִידֶיךָ
  choice: orang-orang yang setia kepada-Mu
  alternative: orang-orang saleh-Mu
  rationale: Pilihan utama menonjolkan kesetiaan dan pengabdian dalam relasi dengan Allah tanpa memasukkan kategori teknis dari tradisi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah dipakai secara konsisten. Susunan klausa mengikuti gerak teks Ibrani, tetapi tanda baca disesuaikan agar mudah dibaca.
