  text: For the choirmaster[a]. A Maskil[b] of David[c].
translation:
  language: id
  text: Untuk pemimpin musik[a]. Maskil[b] Daud[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kepada pemimpin musik.”
    reason: lexical_alternative
  - marker: b
    text: Maskil adalah istilah Ibrani yang mungkin merupakan sebutan musik atau sastra; mungkin berarti “mazmur pengajaran” atau “nyanyian perenungan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “karya Daud” atau “untuk Daud”; bahasa Ibrani dapat menunjukkan kepengarangan, peruntukan, kepemilikan, atau keterkaitan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, istilah ini menunjuk kepada orang yang memimpin pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia modern dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Makna tepat istilah ini dalam judul mazmur tidak pasti; kemungkinan besar ini adalah sebutan jenis sastra atau musik. Transliterasi mempertahankan ketidakpastian tersebut tanpa memaksakan tafsiran.
- source_word: לְדָוִד
  choice: Daud
  rationale: Susunan “Maskil Daud” mempertahankan hubungan dengan Daud tanpa memastikan apakah Daud adalah pengarang, penerima, pemilik, atau tokoh yang dikaitkan dengannya.
theological_decisions:
- issue: Kepengarangan atau keterkaitan yang dinyatakan oleh לְדָוִד
  choice: Maskil Daud
  alternative: Maskil karya Daud; Maskil untuk Daud; Maskil milik Daud
  rationale: Kata depan Ibrani לְ tidak secara tegas menetapkan kepengarangan. Terjemahan utama mempertahankan ambiguitas historis dan teologis itu.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Pemimpin musik” dipilih daripada “pemimpin biduan” karena lebih mudah dipahami pembaca masa kini. Istilah teknis “Maskil” dipertahankan dan dijelaskan dalam catatan kaki.
