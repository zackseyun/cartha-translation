  text: אֵ֤לֶּה אֶזְכְּרָ֨ה וְ/אֶשְׁפְּכָ֬ה עָלַ֨/י נַפְשִׁ֗/י כִּ֤י אֶֽעֱבֹ֨ר בַּ/סָּךְ֮ אֶדַּדֵּ֗/ם עַד בֵּ֥ית אֱלֹ֫הִ֥ים בְּ/קוֹל רִנָּ֥ה וְ/תוֹדָ֗ה הָמ֥וֹן חוֹגֵֽג׀׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: id
  text: 'Semua ini kuingat, dan kucurahkan jiwaku: bagaimana dahulu aku berjalan bersama rombongan[a], menuntun mereka[b] sampai ke rumah Allah, dengan suara sorak-sorai dan ucapan syukur dari khalayak yang merayakan hari raya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam arak-arakan.” Kata Ibrani בַּסָּךְ sulit dipastikan dan mungkin menunjuk kepada kerumunan yang berkumpul untuk hari raya atau kepada rombongan arak-arakan itu sendiri.
    reason: lexical_alternative
  - marker: b
    text: Atau “berjalan bersama mereka” atau “mengantar mereka.” Kata kerja Ibrani אֶדַּדֵּם jarang dipakai dan nuansanya tidak pasti, tetapi konteksnya jelas menggambarkan gerak bersama orang lain menuju rumah Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: Semua ini kuingat
  rationale: Bentuk penunjuk jamak dipertahankan, sedangkan bentuk verbal puitis diterjemahkan sebagai ingatan yang sedang diungkapkan dalam ratapan.
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: dan kucurahkan isi jiwaku
  rationale: Ungkapan harfiah 'mencurahkan jiwaku atas/di dalam diriku' merupakan idiom luapan batin. Penambahan 'isi' menghasilkan bahasa Indonesia yang alami sambil mempertahankan 'jiwa' dan gambaran mencurahkan.
- source_word: כִּי אֶעֱבֹר
  choice: bagaimana dahulu aku berjalan
  rationale: כִּי memperkenalkan isi kenangan, dan bentuk imperfek dalam konteks ini menyiratkan tindakan yang biasa dilakukan pada masa lampau.
- source_word: בַּסָּךְ
  choice: bersama rombongan
  rationale: Nomina ini sulit dipastikan, tetapi konteks ziarah bersama menuju rumah Allah paling mendukung arti rombongan atau arak-arakan, bukan bangunan pelindung.
- source_word: אֶדַּדֵּם
  choice: menuntun mereka
  rationale: Kata kerja langka ini disertai sufiks orang ketiga jamak dan tampaknya menggambarkan gerak bersama orang lain, mungkin dengan pemazmur memimpin atau menuntun mereka.
- source_word: עַד בֵּית אֱלֹהִים
  choice: sampai ke rumah Allah
  rationale: עַד menyatakan batas atau tujuan gerak; 'sampai ke' mempertahankan nuansa itu tanpa menjelaskan rumah Allah secara berlebihan.
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: diiringi suara sorak-sorai dan ucapan syukur
  rationale: 'Terjemahan ini mempertahankan sifat perayaan yang terdengar: רִנָּה adalah seruan sukacita, sedangkan תוֹדָה menyatakan syukur atau pujian.'
- source_word: הָמוֹן חוֹגֵג
  choice: khalayak yang merayakan hari raya
  rationale: הָמוֹן menunjuk kepada kumpulan besar orang, dan חוֹגֵג secara khusus menggambarkan perayaan hari raya atau pesta ziarah.
