  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: id
  text: Samudra raya berseru kepada samudra raya pada gemuruh air terjun-Mu[a]; segala deburan-Mu dan ombak-Mu telah melanda aku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “saluran-saluran air-Mu” atau “arus deras-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “telah lewat di atasku.”'
    reason: literal_rendering
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: Samudra raya ... samudra raya
  rationale: תְּהוֹם menunjuk pada kedalaman air atau samudra raya. Pilihan ini mempertahankan citra perairan yang luas dan dalam serta pengulangan puitis teks Ibrani tanpa membatasinya menjadi sekadar kedalaman abstrak.
- source_word: קוֹרֵא
  choice: berseru
  rationale: Bentuk partisip dari קרא menghadirkan tindakan secara hidup. “Berseru” wajar dalam puisi Indonesia dan membawa daya suara yang sesuai dengan gemuruh air dalam baris ini.
- source_word: לְקוֹל
  choice: pada gemuruh
  rationale: לְקוֹל secara harfiah berkaitan dengan suara. Dalam konteks air deras, “pada gemuruh” menyampaikan latar bunyi atau saat seruan itu terdengar, tanpa menetapkan hubungan sebab-akibat secara berlebihan.
- source_word: צִנּוֹרֶיךָ
  choice: air terjun-Mu
  rationale: צִנּוֹר dapat merujuk pada saluran atau arus air deras. “Air terjun-Mu” menghasilkan citra dan bunyi yang alami bagi pembaca modern, sedangkan kemungkinan leksikal lain dicatat dalam catatan kaki.
- source_word: כָּל מִשְׁבָּרֶיךָ
  choice: segala gelombang pecah-Mu
  rationale: מִשְׁבָּר menunjuk pada gelombang yang pecah atau hempasan ombak. Ungkapan ini membedakannya dari גַּל berikutnya dan mempertahankan daya citra badai laut.
- source_word: וְגַלֶּיךָ
  choice: dan ombak-Mu
  rationale: גַּל lazim berarti gelombang atau ombak. “Ombak” merupakan padanan modern dan alami serta menghindari pengulangan kata “gelombang” tepat setelah מִשְׁבָּר.
- source_word: עָלַי עָבָרוּ
  choice: telah melanda aku
  rationale: Secara harfiah frasa ini menggambarkan air yang lewat di atas pembicara. “Telah melanda aku” mengungkapkan pengalaman ditimpa dan diliputi air secara alami dalam bahasa Indonesia, sementara bentuk yang lebih harfiah dicatat sebagai alternatif.
