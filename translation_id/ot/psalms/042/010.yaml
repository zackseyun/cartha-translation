  yaml_path: translation/ot/psalms/042/010.yaml
  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: id
  text: Seolah-olah tulang-tulangku diremukkan[a], lawan-lawanku mencela aku dengan berkata kepadaku sepanjang hari, “Di manakah Allahmu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seperti luka mematikan di dalam tulang-tulangku,” atau secara lebih harfiah, “Dengan pembunuhan di dalam tulang-tulangku.” Gambaran Ibraninya sulit dan mungkin menyatakan luka yang mematikan atau rasa sakit yang menghancurkan jauh di dalam diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח
  choice: Seperti remuk
  rationale: Nomina רֶצַח biasanya berkaitan dengan pembunuhan atau tindakan mematikan, tetapi bersama frasa ‘di dalam tulang-tulangku’ membentuk gambaran puitis yang sulit tentang rasa sakit dahsyat dan menghancurkan. ‘Seperti remuk’ mempertahankan kekerasan gambaran tanpa mengesankan pembunuhan harfiah.
- source_word: בְּעַצְמוֹתַי
  choice: di dalam tulang-tulangku
  rationale: Terjemahan ini mempertahankan gambaran jasmani Ibrani tentang penderitaan yang menembus sampai ke bagian terdalam.
- source_word: חֵרְפוּנִי
  choice: mencela aku
  rationale: Kata kerja חרף menyatakan celaan, penghinaan, atau ejekan. ‘Mencela’ sesuai dengan ucapan bermusuhan yang langsung menyusul.
- source_word: צוֹרְרָי
  choice: lawan-lawanku
  rationale: Bentuk ini menunjuk kepada orang-orang yang memusuhi pemazmur. ‘Lawan-lawanku’ jelas dan tidak mempersempit maknanya melebihi teks.
- source_word: בְּאָמְרָם
  choice: dengan berkata
  rationale: Konstruksi ini memperkenalkan cara atau isi celaan mereka secara alami dalam bahasa Indonesia.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Preposisi אֶל menunjukkan arah perkataan kepada pemazmur.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini menyampaikan celaan yang berlangsung atau berulang terus-menerus selama hari itu.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: Di manakah Allahmu?
  rationale: Pertanyaan langsung ini mempertahankan sengat tantangan para lawan terhadap kehadiran atau pertolongan Allah tanpa menambahkan penjelasan teologis.
theological_decisions:
- issue: Tantangan para lawan mengenai Allah
  choice: Di manakah Allahmu?
  alternative: Jadi, di manakah Allahmu?
  rationale: Bentuk sederhana mempertahankan pertanyaan sebagai celaan yang tajam dan membiarkan ketegangan ratapan tetap terbuka tanpa menjelaskan seolah-olah Allah benar-benar tidak hadir.
- issue: Gambaran בְּרֶצַח בְּעַצְמוֹתַי yang sulit
  choice: Seperti remuk di dalam tulang-tulangku
  alternative: Dengan pembunuhan di dalam tulang-tulangku
  rationale: Teks Ibrani memungkinkan nuansa luka mematikan atau rasa sakit yang menghancurkan. Teks utama memakai ungkapan Indonesia yang dapat dipahami, sementara catatan kaki mempertahankan alternatif yang lebih harfiah dan ambiguitas gambarnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan ‘tulang-tulangku’ mempertahankan bentuk jamak dan citra konkret teks Ibrani; ‘Allahmu’ mengikuti sapaan tunggal kepada pemazmur.
