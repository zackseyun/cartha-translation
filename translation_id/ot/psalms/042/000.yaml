lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada pemimpin atau pengarah musik. Frasa ini alami dalam bahasa Indonesia dan mempertahankan fungsi musikalnya; kata depan ל diterjemahkan “untuk” tanpa menutup kemungkinan nuansa “kepada”.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Makna tepat istilah teknis dalam judul mazmur ini tidak pasti. Transliterasi mempertahankan ketidakpastian itu tanpa memaksakan arti seperti “nyanyian pengajaran” atau “mazmur perenungan”.
- source_word: לִבְנֵי קֹרַח
  choice: dari bani Korah
  rationale: Kata depan ל dalam judul dapat menunjukkan kepengarangan, keterkaitan, peruntukan, atau pelaku. “Dari bani Korah” merupakan ungkapan ringkas dan wajar, sementara catatan kaki menjelaskan cakupan kemungkinan tersebut.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
