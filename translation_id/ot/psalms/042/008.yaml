  text: יוֹמָ֤ם יְצַוֶּ֬ה יְהוָ֨ה חַסְדּ֗/וֹ וּ֭/בַ/לַּיְלָה שיר/ה עִמִּ֑/י תְּ֝פִלָּ֗ה לְ/אֵ֣ל חַיָּֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: id
  text: Pada siang hari Yahweh memerintahkan kasih setia-Nya, dan pada malam hari nyanyian-Nya[a] menyertai aku—suatu doa kepada Allah kehidupanku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “nyanyian bagi-Nya menyertai aku.” Bentuk Ibraninya juga dapat dipahami tanpa makna sufiks “-Nya”; teks utama mengikuti pembacaan “nyanyian-Nya”.
    reason: alternative_reading
  - marker: b
    text: Atau, “Allah yang memberi aku hidup.” Secara lebih harfiah, bahasa Ibraninya berbunyi “Allah kehidupanku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: Pada siang hari
  rationale: Ungkapan keterangan waktu ini dibuat sejajar secara alami dengan “pada malam hari”.
- source_word: יְצַוֶּה
  choice: memerintahkan
  rationale: Bentuk piel dari צוה mempertahankan gambaran puitis bahwa Yahweh secara aktif memerintahkan kasih setia-Nya; pilihan ini tidak memperlemah verba menjadi sekadar “memberikan”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חסד mencakup kasih yang teguh, loyal, dan berkomitmen; “kasih setia” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: וּבַלַּיְלָה
  choice: dan pada malam hari
  rationale: Frasa temporal ini sejajar dengan יוֹמָם; waw diterjemahkan netral sebagai “dan” tanpa menambahkan pertentangan.
- source_word: שירה
  choice: nyanyian-Nya
  rationale: Teks utama mengikuti pemahaman bersufiks orang ketiga maskulin tunggal, yakni nyanyian yang berasal dari atau menjadi milik-Nya. Kemungkinan memahami bentuk itu sebagai “nyanyian bagi-Nya” dipertahankan dalam catatan kaki.
- source_word: עִמִּי
  choice: menyertai aku
  rationale: Secara harfiah berarti “bersamaku”; “menyertai aku” menyampaikan kehadiran yang berlanjut dengan bahasa Indonesia yang wajar.
- source_word: תְּפִלָּה
  choice: sebuah doa
  rationale: Dipahami sebagai aposisi yang menjelaskan nyanyian tersebut; “sebuah” membuat hubungan sintaksisnya jelas dalam bahasa Indonesia.
- source_word: לְאֵל
  choice: kepada Allah
  rationale: Preposisi ל menyatakan arah atau pihak yang dituju oleh doa.
- source_word: חַיָּי
  choice: kehidupanku
  rationale: Bentuk nomina dengan sufiks orang pertama tunggal berarti “hidupku/kehidupanku”, bukan adjektiva “yang hidup”. Susunan “Allah kehidupanku” mempertahankan hubungan genitif Ibrani tanpa langsung menafsirkannya sebagai “Allah yang memberi aku hidup”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna חַיָּי dalam לְאֵל חַיָּי
  choice: Allah kehidupanku
  alternative: Allah yang memberi aku hidup
  rationale: חַיָּי adalah nomina bersufiks, “kehidupanku”, bukan bentuk “Allah yang hidup”. Terjemahan utama menjaga ungkapan genitif yang dapat mencakup bahwa Allah adalah sumber, pemilik, atau penopang hidup tanpa menetapkan hanya satu penafsiran.
- issue: Pembacaan שירה
  choice: nyanyian-Nya
  alternative: nyanyian bagi-Nya
  rationale: Terjemahan utama mengikuti pemahaman pronominal “nyanyian-Nya”, yang juga membentuk kesejajaran dengan “kasih setia-Nya”. Karena bentuk tekstualnya memungkinkan pemahaman lain, alternatif tersebut dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kesejajaran waktu dipertahankan melalui “pada siang hari ... pada malam hari”. Verba “memerintahkan” sengaja dipertahankan meski metaforis, sedangkan tanda pisah memperjelas bahwa “sebuah doa” menerangkan nyanyian pada klausa sebelumnya.
