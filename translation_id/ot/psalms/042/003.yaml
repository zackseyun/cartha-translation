source:
  edition: WLC
  text: הָֽיְתָה לִּ֬/י דִמְעָתִ֣/י לֶ֭חֶם יוֹמָ֣ם וָ/לָ֑יְלָה בֶּ/אֱמֹ֥ר אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: id
  text: Air mataku telah menjadi rotiku siang dan malam[a], sementara sepanjang hari orang berkata kepadaku, “Di manakah Allahmu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “air mataku” berbentuk tunggal dalam bahasa Ibrani, tetapi dapat berfungsi secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: telah menjadi ...-ku
  rationale: Konstruksi היה + ל menyatakan sesuatu yang telah menjadi atau berfungsi sebagai sesuatu bagi pembicara. Ungkapan ini mempertahankan nuansa hasil/keadaan secara wajar dalam bahasa Indonesia.
- source_word: דִמְעָתִי
  choice: air mataku
  rationale: Bentuk Ibrani secara morfologis tunggal, tetapi dapat berfungsi kolektif. Dalam bahasa Indonesia, “air mata” secara alami dapat menunjuk pada tetesan tangis secara kolektif tanpa perlu dijamakkan.
- source_word: לֶחֶם
  choice: roti
  rationale: 'Arti harfiah “roti” dipertahankan karena metaforanya jelas dan kuat: air mata menjadi santapan pemazmur.'
- source_word: יוֹמָם וָלָיְלָה
  choice: siang dan malam
  rationale: Merisme ini menyatakan berlangsung terus-menerus dan memiliki padanan alami yang langsung dalam bahasa Indonesia.
- source_word: בֶּאֱמֹר
  choice: sementara ... berkata
  rationale: Preposisi ב dengan infinitif konstruk menandai tindakan yang berlangsung bersamaan; “sementara” menyampaikan ejekan yang terus menyertai tangisan pemazmur.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Preposisi אל menunjukkan arah perkataan kepada pembicara.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini menunjukkan tindakan yang berulang atau terus berlangsung selama hari itu; “sepanjang hari” alami dalam bahasa Indonesia modern.
- source_word: אַיֵּה
  choice: Di manakah
  rationale: Kata tanya ini secara langsung mempertanyakan tempat atau kehadiran. Bentuk tersebut mempertahankan daya ejekan dalam register yang bermartabat.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuknya orang kedua tunggal dan merujuk kepada Allah yang disembah pemazmur, bukan kepada ilah generik.
theological_decisions:
- issue: Sifat pertanyaan para pengejek
  choice: Pertahankan pertanyaan langsung, “Di manakah Allahmu?” sebagai ejekan tentang ketidakhadiran Allah yang tampak.
  alternative: Menafsirkannya sebagai “Apa yang terjadi dengan Allahmu?”
  rationale: Teks Ibrani secara langsung bertanya “Di mana Allahmu?” Terjemahan ini menjaga ketegangan teologis mengenai ketidakhadiran atau pertolongan Allah yang tampak tanpa menjelaskan lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada puitis dan bermartabat. Metafora “air mata ... roti” dipertahankan, sedangkan susunan kalimat dibuat alami dan mudah dipahami.
