  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: id
  text: Jiwaku haus akan Allah, akan Allah yang hidup. Kapan aku akan datang dan menghadap Allah?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “wajah Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  choice: haus
  rationale: Mempertahankan metafora konkret tentang rasa haus, bukan melemahkannya menjadi sekadar ‘rindu’.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Menjaga ungkapan puitis Ibrani dan penekanan pada diri batin, sambil tetap alami dalam bahasa Indonesia.
- source_word: לֵאלֹהִים
  choice: akan Allah
  rationale: Dalam konstruksi ‘haus akan’, preposisi ini secara alami menyatakan sasaran kerinduan.
- source_word: לְאֵל חָי
  choice: akan Allah yang hidup
  rationale: Mengungkapkan makna definit frasa Ibrani אֵל חָי dengan bahasa Indonesia yang wajar.
- source_word: מָתַי
  choice: Kapan
  rationale: Menyampaikan pertanyaan langsung mengenai waktu tanpa menambahkan nuansa ‘berapa lama lagi’ yang tidak dinyatakan secara eksplisit.
- source_word: אָבוֹא
  choice: aku dapat datang
  rationale: Dalam pertanyaan ini, bentuk imperfek mengungkapkan penantian akan kesempatan mendatang untuk datang; ‘dapat’ terdengar alami tanpa memastikan kapan hal itu akan terjadi.
- source_word: וְאֵרָאֶה
  choice: dan menghadap
  rationale: Bentuk Nifal dalam konteks ziarah dan ibadah dipahami sebagai tampil atau hadir di hadapan seseorang; ‘menghadap’ menyampaikan fungsi ungkapan itu secara alami.
- source_word: פְּנֵי אֱלֹהִים
  choice: Allah
  rationale: Bersama kata kerja ‘menghadap’, ungkapan harfiah ‘wajah Allah’ menyatakan hadir di hadapan Allah. Unsur harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan ungkapan פְּנֵי אֱלֹהִים
  choice: menghadap Allah
  alternative: tampil di hadapan wajah Allah; melihat wajah Allah
  rationale: Bacaan Masoret dengan bentuk Nifal וְאֵרָאֶה paling wajar menunjuk pada tampil atau hadir di hadapan Allah, kemungkinan dalam ibadah, bukan secara tegas pada melihat hakikat ilahi. Terjemahan utama menyampaikan idiom tersebut tanpa menutup transparansi bentuk harfiahnya.
translation_notes:
  register: Bahasa puitis, modern, dan bermartabat. Pengulangan ‘akan Allah’ dipertahankan untuk mencerminkan kesejajaran dan penekanan teks Ibrani. ‘Jiwaku’ mempertahankan citra mazmur tanpa terasa kuno.
