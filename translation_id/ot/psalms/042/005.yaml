base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: id
  text: Mengapa engkau tertunduk, hai jiwaku, dan mengapa engkau bergelora di dalam diriku? Berharaplah kepada Allah, sebab aku masih akan memuji Dia karena keselamatan dari hadirat-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keselamatan-keselamatan wajah-Nya” atau “pertolongan wajah-Nya”. Dalam bahasa Ibrani, “wajah” sering menunjuk pada kehadiran atau hadirat seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: engkau tertunduk
  rationale: Kata kerja ini menggambarkan keadaan membungkuk atau tertekan. “Tertunduk” mempertahankan metafora direndahkan sekaligus wajar dalam ratapan puitis Indonesia.
- source_word: נַפְשִׁי
  choice: hai jiwaku
  rationale: Dalam sapaan kepada diri sendiri, נֶפֶשׁ menunjuk pada diri batin. “Jiwaku” mempertahankan daya puitis dan introspektif tanpa memaksakan antropologi teknis.
- source_word: וַתֶּהֱמִי
  choice: engkau bergelora
  rationale: Kata ini dapat menggambarkan bunyi gemuruh, kegaduhan, atau gejolak. “Bergelora” menyampaikan keguncangan batin serta mempertahankan citra dinamisnya.
- source_word: עָלָי
  choice: di dalam diriku
  rationale: Secara harfiah berarti “atas diriku”, tetapi dalam konteks pergolakan jiwa, ungkapan Indonesia “di dalam diriku” menyampaikan maksudnya secara alami.
- source_word: הוֹחִילִי
  choice: berharaplah
  rationale: Bentuk perintah ini menyerukan penantian yang penuh keyakinan. “Berharaplah” mencakup unsur kepercayaan dan pengharapan.
- source_word: לֵאלֹהִים
  choice: kepada Allah
  rationale: Dengan kata kerja berharap, preposisi לְ secara alami menyatakan arah atau sasaran pengharapan.
- source_word: עוֹד אוֹדֶנּוּ
  choice: aku masih akan memuji Dia
  rationale: עוֹד memandang ke depan melampaui kesusahan saat ini, sedangkan bentuk ידה menyatakan pujian atau ucapan syukur. “Masih akan” mempertahankan nada pengharapan yang teguh.
- source_word: יְשׁוּעוֹת פָּנָיו
  choice: keselamatan dari hadirat-Nya
  rationale: Bentuk harfiahnya adalah “keselamatan-keselamatan wajah-Nya”. Bentuk jamak dapat berfungsi intensif atau abstrak, dan “wajah” sering menyatakan hadirat. Preposisi “dari” membuat hubungan sumber pertolongan dapat dipahami tanpa menghapus citra sumbernya.
theological_decisions:
- issue: Hubungan יְשׁוּעוֹת dengan פָּנָיו pada klausa penutup
  choice: keselamatan dari hadirat-Nya
  alternative: keselamatan wajah-Nya; pertolongan dari wajah-Nya
  rationale: Teks Masoret yang diberikan berbunyi “keselamatan-keselamatan wajah-Nya” dan tidak memuat “Allahku” dalam ayat ini. Terjemahan utama memahami “wajah” sebagai kehadiran pribadi Allah, tetapi catatan kaki mempertahankan bentuk harfiah dan kemungkinan hubungan frasa yang padat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Sapaan “hai jiwaku” mempertahankan bentuk puisi Ibrani; kapitalisasi pronomina ilahi mengikuti kebiasaan hormat yang lazim dalam terjemahan Alkitab Indonesia. Klausa penutup sengaja tetap padat karena bahasa sumber juga ambigu dan padat.
