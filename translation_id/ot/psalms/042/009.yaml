  text: אוֹמְרָ֤ה לְ/אֵ֥ל סַלְעִ/י֮ לָ/מָ֪ה שְׁכַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֵלֵ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: id
  text: Aku berkata kepada Allah, batu karangku, “Mengapa Engkau melupakan aku? Mengapa aku berjalan dengan muram di bawah tekanan musuh?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mengapa aku berjalan sambil berkabung di bawah tekanan musuh?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹמְרָה
  choice: Aku berkata
  rationale: Bentuk kohortatif orang pertama tunggal dapat menyatakan tekad atau tindakan berbicara yang langsung; dalam konteks ratapan ini, bentuk kini naratif “Aku berkata” alami dan tidak menambahkan unsur masa depan secara berlebihan.
- source_word: לְאֵל
  choice: kepada Allah
  rationale: אֵל di sini merupakan sebutan umum bagi Allah, bukan nama diri; “kepada Allah” adalah padanan Indonesia yang wajar.
- source_word: סַלְעִי
  choice: gunung batuku
  rationale: סֶלַע menunjuk pada batu besar atau bukit batu yang kokoh. “Gunung batuku” mempertahankan metafora perlindungan dan kestabilan serta terdengar alami dalam ragam puitis Alkitab bahasa Indonesia.
- source_word: שְׁכַחְתָּנִי
  choice: Engkau melupakan aku
  rationale: Bentuk perfektif orang kedua maskulin tunggal dengan objek orang pertama diterjemahkan langsung tanpa mengubahnya menjadi “meninggalkan,” sehingga keluhan tentang kelupaan ilahi tetap dipertahankan.
- source_word: קֹדֵר
  choice: dengan muram
  rationale: Partisipel dari קדר dapat berarti menjadi gelap, suram, atau berkabung. “Dengan muram” menjaga citra kesuraman sekaligus cocok menerangkan cara pemazmur berjalan.
- source_word: אֵלֵךְ
  choice: aku harus berjalan
  rationale: Bentuk imperfektif אֵלֵךְ dalam pertanyaan ratapan dapat menyiratkan keadaan yang terus dialami. “Harus berjalan” menyampaikan nada keluhan idiomatis, meskipun unsur keharusan bersifat kontekstual.
- source_word: בְּלַחַץ
  choice: di bawah tekanan
  rationale: לַחַץ berarti tekanan atau penindasan; dengan preposisi בְּ, ungkapan ini menggambarkan keadaan yang membebani pemazmur. “Di bawah tekanan” mempertahankan keluasan makna tanpa membatasi pada penindasan politik atau sosial.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Nomina tunggal tanpa artikel dapat dipahami secara generik atau kolektif dalam puisi Ibrani; “musuh” mempertahankan ketidakpastian itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Gelar metaforis ilahi סַלְעִי
  choice: gunung batuku
  alternative: batuku; bukit batuku
  rationale: Metafora batu dipertahankan dan tidak dijelaskan menjadi “tempat perlindunganku,” sehingga citra puitis Allah sebagai perlindungan yang kokoh tetap terbuka bagi pembaca.
- issue: Keluhan bahwa Allah melupakan pemazmur
  choice: Mengapa Engkau melupakan aku?
  alternative: Mengapa Engkau telah melupakan aku?
  rationale: Keluhan diterjemahkan secara langsung tanpa dilunakkan menjadi sekadar perasaan ditinggalkan. Ini mempertahankan ketegangan teologis dalam ratapan yang setia namun berani.
- issue: Nuansa קֹדֵר
  choice: dengan muram
  alternative: sambil berkabung
  rationale: “Dengan muram” mempertahankan kemungkinan nuansa gelap atau suram, sedangkan “berkabung” lebih sempit dan dapat menyiratkan praktik perkabungan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang bermartabat. Sapaan kepada Allah memakai “Engkau”; struktur dua pertanyaan dipertahankan untuk menjaga daya ratapan. Tidak ada catatan kaki karena alternatif leksikal קֹדֵר dapat diwakili secara memadai oleh “dengan muram” tanpa perlu memecah teks.
