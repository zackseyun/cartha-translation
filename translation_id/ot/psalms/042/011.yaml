  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: id
  text: Mengapa engkau tertekan, hai jiwaku, dan mengapa engkau bergelora di dalam diriku? Berharaplah kepada Allah, sebab aku masih akan memuji Dia, penolongku[a] dan Allahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keselamatan-keselamatan wajahku.” Ungkapan Ibrani ini dapat dipahami sebagai “pertolongan bagi wajahku”; secara idiomatis, “penolongku.”
    reason: Mempertahankan bentuk jamak dan citra “wajah” dalam bahasa Ibrani, sambil menjelaskan terjemahan idiomatis pada teks utama.
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: engkau tertekan
  rationale: Kata kerja ini menggambarkan keadaan membungkuk atau terpuruk. “Tertekan” menyampaikan keadaan batin yang merunduk tanpa terdengar kuno.
- source_word: נַפְשִׁי
  choice: hai jiwaku
  rationale: Dalam sapaan kepada diri sendiri di mazmur ini, “jiwaku” mempertahankan daya puitis dan introspektif נֶפֶשׁ.
- source_word: תֶּהֱמִי
  choice: engkau bergelora
  rationale: Kata ini dapat menggambarkan deru, kegaduhan, atau gejolak. “Bergelora” mempertahankan citra pergolakan batin dan intensitas bahasa Ibrani.
- source_word: עָלַי
  choice: di dalam diriku
  rationale: Secara harfiah berarti “atas diriku”, tetapi dalam konteks gejolak jiwa ungkapan ini secara wajar menyatakan pergolakan yang berlangsung di dalam diri pemazmur.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: Berharaplah kepada Allah
  rationale: Bentuk ini memadukan penantian dan pengharapan. Dalam bahasa Indonesia, “berharaplah kepada Allah” mengungkapkan arah kepercayaan secara alami, sementara unsur penantian tersirat dalam konteks.
- source_word: עוֹד אוֹדֶנּוּ
  choice: aku akan kembali memuji Dia
  rationale: עוֹד mengarah pada pujian yang kelak atau kembali dilakukan di tengah kesusahan sekarang; “kembali” terdengar alami dan menyatakan keyakinan akan pemulihan.
- source_word: יְשׁוּעֹת פָּנַי
  choice: penolong yang mengangkat wajahku
  rationale: Ungkapan Ibrani yang padat ini secara harfiah berbunyi “keselamatan-keselamatan wajahku”. Pilihan ini menyampaikan Allah sebagai sumber pertolongan yang mengubah wajah yang tertunduk, sambil mempertahankan citra wajah.
- source_word: וֵאלֹהָי
  choice: dan Allahku
  rationale: Terjemahan ini mempertahankan konjungsi serta pengakuan pribadi yang menjadi puncak ayat.
theological_decisions:
- issue: Makna יְשׁוּעֹת פָּנַי
  choice: penolong yang mengangkat wajahku
  alternative: keselamatan wajahku
  rationale: Ungkapan sumber bersifat padat dan ambigu. Teks utama dibuat alami dalam bahasa Indonesia serta menghubungkannya dengan wajah yang tertunduk pada awal ayat, tetapi catatan mempertahankan bentuk harfiah agar citra dan ketegangan teks tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan tetap mudah dipahami. Sapaan “hai jiwaku” mempertahankan keluhuran mazmur; “bergelora” menjaga citra kuat dari teks sumber. Huruf kapital pada “Dia” mengikuti kebiasaan hormat yang lazim dalam bahasa Indonesia.
