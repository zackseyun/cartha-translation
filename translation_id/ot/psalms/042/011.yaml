revisions:
- from: Mengapa engkau tertekan, hai jiwaku, dan mengapa engkau bergelora di dalam diriku? Berharaplah kepada Allah, sebab aku akan kembali memuji Dia, penolong yang mengangkat wajahku[a] dan Allahku.
  to: Mengapa engkau tertekan, hai jiwaku, dan mengapa engkau bergelora di dalam diriku? Berharaplah kepada Allah, sebab aku masih akan memuji Dia, penolongku[a] dan Allahku.
  rationale: Revisi menghilangkan penambahan interpretatif “yang mengangkat wajahku,” memakai penutup yang lebih alami dalam bahasa Indonesia, dan menempatkan citra literal serta ambiguitas frasa Ibrani dalam catatan kaki. Perubahan “masih akan memuji” juga lebih luas dan lebih dekat dengan nilai temporal עוֹד daripada “kembali memuji.”
