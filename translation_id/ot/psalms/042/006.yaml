base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/006.yaml
  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: id
  text: Allahku, jiwaku tertekan dalam diriku; karena itu aku mengingat-Mu[c] dari daerah Sungai Yordan dan pegunungan Hermon[a], dari Gunung Mizar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “Hermon” berbentuk jamak; ini mungkin menunjuk pada rangkaian pegunungan atau puncak-puncak Hermon.
    reason: lexical_alternative
  - marker: b
    text: “Gunung Mizar” mungkin merupakan nama tempat; dapat juga diterjemahkan “gunung kecil” atau “bukit Mizar”.
    reason: lexical_alternative
  - marker: c
    text: Atau, “aku akan mengingat-Mu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal berarti 'Allahku'. Ungkapan ini dapat berfungsi sebagai sapaan langsung tanpa perlu menambahkan kata seru.
- source_word: עָלַי נַפְשִׁי תִשְׁתּוֹחָח
  choice: jiwaku tertekan dalam diriku
  rationale: נפשׁ dipertahankan sebagai 'jiwaku' untuk menjaga corak puitis, sedangkan bentuk שׁוחח menyatakan keadaan tertunduk atau terpuruk; 'tertekan' menyampaikan keadaan batin itu secara wajar dalam bahasa Indonesia.
- source_word: עַל־כֵּן
  choice: karena itu
  rationale: Menandai hubungan konsekuensi antara keadaan jiwa pemazmur dan tindakannya mengingat Allah.
- source_word: אֶזְכָּרְךָ
  choice: aku mengingat-Mu
  rationale: Bentuk imperfek dapat menyatakan tindakan kini atau tekad/tindakan mendatang. Teks utama memakai pembacaan kini yang alami, sementara nuansa mendatang tetap diakui sebagai kemungkinan.
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: dari daerah Sungai Yordan
  rationale: Ungkapan ini menunjuk pada wilayah yang berkaitan dengan Yordan. 'Daerah Sungai Yordan' lebih jelas dan alami daripada terjemahan harfiah 'tanah Yordan'.
- source_word: וְחֶרְמוֹנִים
  choice: dan pegunungan Hermon
  rationale: Bentuk Ibrani adalah jamak dan mungkin menunjuk pada rangkaian atau puncak-puncak Hermon. 'Pegunungan Hermon' mempertahankan nuansa jamak dengan bahasa Indonesia yang alami.
- source_word: מֵהַר מִצְעָר
  choice: dari Gunung Mizar
  rationale: Dalam rangkaian nama geografis, מִצְעָר paling wajar diperlakukan sebagai nama tempat, sambil mencatat kemungkinan makna leksikalnya dalam catatan kaki.
theological_decisions:
- issue: Aspek waktu אֶזְכָּרְךָ
  choice: aku mengingat-Mu
  alternative: aku akan mengingat-Mu
  rationale: Imperfek Ibrani dalam puisi dapat menyatakan tindakan yang sedang berlangsung, tekad, atau tindakan mendatang. Konteks tidak mengharuskan salah satu nuansa dipastikan secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Sapaan 'Allahku' serta 'jiwaku' mempertahankan nada pribadi mazmur. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
