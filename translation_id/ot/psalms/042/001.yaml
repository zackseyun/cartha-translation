source:
  edition: WLC
  text: כְּ/אַיָּ֗ל תַּעֲרֹ֥ג עַל אֲפִֽיקֵי מָ֑יִם כֵּ֤ן נַפְשִׁ֨/י תַעֲרֹ֖ג אֵלֶ֣י/ךָ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs for streams of water[a], so my soul longs for you[c][b], O God.
translation:
  language: id
  text: Seperti rusa merindukan aliran-aliran air[a], demikianlah jiwaku[b] merindukan Engkau, ya Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saluran-saluran air”. Kata Ibrani dapat menunjuk pada alur, palung, atau aliran tempat air mengalir.
    reason: lexical_alternative
  - marker: b
    text: “Jiwaku” juga dapat dipahami sebagai “hidupku”, “diriku”, atau “segenap batinku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: Seperti rusa
  rationale: אַיָּל dapat menunjuk pada rusa, khususnya rusa jantan. “Rusa” alami dan mudah dipahami dalam bahasa Indonesia, sedangkan כְּ dinyatakan dengan “seperti” untuk membuka perbandingan.
- source_word: תַּעֲרֹג
  choice: merindukan
  rationale: Kata kerja ערג menggambarkan kerinduan yang kuat, dalam konteks ini seperti rasa haus yang mendesak. “Merindukan” mempertahankan unsur hasrat tanpa membatasi gambaran pada terengah-engah secara fisik.
- source_word: עַל
  choice: akan (tersirat dalam konstruksi “merindukan”)
  rationale: Dalam bahasa Indonesia, verba “merindukan” langsung mengambil objek sehingga preposisi Ibrani tidak perlu diterjemahkan secara terpisah.
- source_word: אֲפִיקֵי מָיִם
  choice: aliran-aliran air
  rationale: אֲפִיקִים dapat berarti saluran, palung, atau aliran air. Bentuk ulang mempertahankan makna jamak, dan “aliran air” alami serta cukup luas untuk menjaga cakupan istilah Ibrani.
- source_word: כֵּן
  choice: demikianlah
  rationale: Kata ini menandai bagian kedua dari perbandingan. “Demikianlah” sesuai dengan laras puisi yang khidmat dan tetap jelas bagi pembaca modern.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, diri, atau keseluruhan pribadi. “Jiwaku” mempertahankan ungkapan puitis dan devosional tanpa dengan sendirinya menetapkan dualisme tubuh-jiwa; keluasan maknanya dijelaskan dalam catatan.
- source_word: אֵלֶיךָ
  choice: merindukan Engkau
  rationale: Preposisi אֶל menyatakan arah kepada Allah. Dalam idiom Indonesia, “merindukan Engkau” menyampaikan arah relasional itu secara alami tanpa preposisi tambahan.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Bentuk ini menandai sapaan langsung kepada Allah dengan laras doa yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa antropologis נַפְשִׁי
  choice: jiwaku
  alternative: hidupku; diriku; segenap batinku
  rationale: Istilah Ibrani ini tidak harus menunjuk pada jiwa sebagai bagian yang terpisah dari tubuh; istilah tersebut dapat mencakup hidup atau keseluruhan diri. Teks utama mempertahankan bentuk puitis “jiwaku”, sedangkan catatan menjaga keluasan semantiknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. Susunan perbandingan Ibrani dipertahankan, sementara objek verba dibuat idiomatis dalam bahasa Indonesia. Kapitalisasi “Engkau” dipakai sebagai bentuk sapaan hormat kepada Allah.
