  yaml_path: translation/ot/psalms/130/005.yaml
  text: I wait for Yahweh[a]; my soul waits[b], and in his word I hope.
translation:
  language: id
  text: Aku menantikan Yahweh[a]; jiwaku menanti, dan pada firman-Nya[b] aku berharap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah menantikan Yahweh; jiwaku telah menanti.” Bentuk perfektif Ibrani dapat menyatakan tekad yang sudah bulat atau sikap yang sedang berlangsung dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “perkataan-Nya” atau “janji-Nya.” Kata Ibrani ini dapat menunjuk pada firman yang diucapkan Allah secara umum atau, secara tersirat, pada janji-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִוִּיתִי
  choice: Aku menantikan
  rationale: Kata kerja קוה menyatakan penantian yang disertai pengharapan. Bentuk kini paling alami untuk menggambarkan sikap pemazmur dalam konteks ini, sementara nuansa perfektif dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: קִוְּתָה
  choice: menanti
  rationale: Mengulang padanan akar קוה untuk mempertahankan paralelisme dan penekanan puitis teks Ibrani.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Mempertahankan citra puitis נפש sebagai diri atau batin pemazmur; ‘jiwaku’ wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: לִדְבָרוֹ
  choice: pada firman-Nya
  rationale: דבר secara langsung berarti perkataan atau firman; frasa ini menyatakan dasar tempat pemazmur menaruh harap tanpa mempersempit maknanya menjadi ‘janji’.
- source_word: הוֹחָלְתִּי
  choice: aku berharap
  rationale: יחל mencakup menunggu dengan penuh harap. ‘Berharap’ membedakannya dari pengulangan קוה sambil mempertahankan tumpang tindih maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Makna דְבָרוֹ
  choice: firman-Nya
  alternative: janji-Nya
  rationale: ‘Firman-Nya’ mempertahankan keluasan makna דבר, yang dapat menunjuk pada perkataan Allah secara umum dan, berdasarkan konteks, dapat menyiratkan janji-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap wajar. Pengulangan ‘menanti’ dipertahankan untuk mencerminkan paralelisme Ibrani, sedangkan ‘berharap’ mempertahankan perbedaan kata kerja pada bagian terakhir.
