  yaml_path: translation/ot/psalms/130/008.yaml
  text: And he will redeem Israel from all his iniquities[a].
translation:
  language: id
  text: Dan Ia akan menebus Israel dari segala kesalahannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “dari segala kesalahan mereka.” Bahasa Ibrani memakai bentuk tunggal untuk “Israel” beserta akhiran tunggal (“-nya”), sehingga Israel dipandang sebagai satu kesatuan kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ia
  rationale: Pronomina mandiri memberi sedikit penekanan pada pelaku dan melanjutkan ayat sebelumnya. Dalam bahasa Indonesia, “Ia” secara wajar merujuk kepada TUHAN; kata penghubung וְ tidak perlu diterjemahkan secara mekanis.
- source_word: יִפְדֶּה
  choice: akan menebus
  rationale: Kata פדה menyatakan pembebasan atau penebusan dari ikatan maupun tanggungan. “Menebus” mempertahankan bobot makna tersebut dan sesuai dengan harapan akan pembebasan ilahi dalam mazmur ini.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: Partikel ini menandai Israel sebagai objek langsung tertentu dan tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan dalam bentuk baku bahasa Indonesia dan di sini menunjuk kepada umat secara kolektif.
- source_word: מִכֹּל
  choice: dari segala
  rationale: Gabungan מן dan כֹּל menyatakan pembebasan menyeluruh dari seluruh hal yang disebut sesudahnya. “Dari segala” alami sekaligus cukup dekat dengan bentuk sumber.
- source_word: עֲוֺנֹתָיו
  choice: kesalahannya
  rationale: עָוֹן dapat mencakup perbuatan bengkok, dosa, dan kesalahan beserta dimensi kesalahannya. Akhiran orang ketiga maskulin tunggal dipertahankan dengan “-nya”, yang dapat merujuk kepada Israel sebagai satu kesatuan kolektif.
theological_decisions:
- issue: Akhiran tunggal kolektif pada “kesalahan-kesalahannya”
  choice: Menggunakan “kesalahannya” dengan akhiran tunggal yang merujuk kepada Israel sebagai kesatuan kolektif.
  alternative: “segala kesalahan mereka,” yang secara idiomatis menampilkan umat Israel sebagai kumpulan orang.
  rationale: Teks Ibrani memakai nama tunggal “Israel” dan akhiran pronominal orang ketiga maskulin tunggal. Bentuk “-nya” mempertahankan gambaran korporat itu tanpa meniadakan bahwa Israel terdiri dari banyak orang; alternatif yang lebih idiomatis dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Ia” dipakai untuk rujukan kepada TUHAN, sedangkan “kesalahan” dipilih sebagai padanan yang mudah dipahami bagi עָוֹן tanpa mempersempitnya hanya menjadi pelanggaran umum. Penanda catatan kaki ditempatkan langsung sesudah klausa terkait.
