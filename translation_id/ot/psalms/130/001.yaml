  text: A Song of Ascents[a]. Out of the depths I cry to you[b], O Yahweh.
translation:
  language: id
  text: 'Nyanyian Ziarah.[a]


    Dari kedalaman aku berseru[b] kepada-Mu, ya, Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Nyanyian Pendakian.” Ini adalah judul tradisional bagi kelompok mazmur ini; latar tepat istilah tersebut tidak pasti.'
    reason: cultural_note
  - marker: b
    text: 'Atau: “Dari kedalaman aku telah berseru kepada-Mu, ya, Yahweh.” Bentuk kata kerja Ibrani dapat dipahami sebagai tindakan lampau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Nyanyian
  rationale: Kata ini berarti nyanyian atau lagu; “Nyanyian” wajar untuk judul mazmur dan tidak menambahkan penandaan genre yang tidak dinyatakan oleh teks.
- source_word: הַמַּעֲלוֹת
  choice: Ziarah
  rationale: Secara harfiah berkaitan dengan tindakan naik. Dalam judul kelompok mazmur ini, “Ziarah” menyampaikan penggunaan tradisionalnya sebagai nyanyian perjalanan naik menuju Yerusalem tanpa memasukkan penjelasan historis yang terlalu pasti ke dalam teks utama.
- source_word: מִמַּעֲמַקִּים
  choice: Dari tempat yang dalam
  rationale: Bentuk jamak Ibrani menunjuk pada kedalaman atau tempat-tempat dalam dan dipakai secara metaforis untuk kesusahan berat. Ungkapan ini mempertahankan citra ruang tanpa langsung menggantinya dengan tafsiran “kesengsaraan”.
- source_word: קְרָאתִיךָ
  choice: aku berseru kepada-Mu
  rationale: קרא berarti memanggil atau berseru. Dalam konteks doa dari kedalaman, “berseru” mengungkapkan permohonan yang kuat. Bentuk perfek dapat dibaca sebagai lampau, tetapi bahasa Indonesia kini juga dapat mempertahankan daya langsung doa puitis ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Nilai waktu bentuk קְרָאתִיךָ
  choice: aku berseru kepada-Mu
  alternative: aku telah berseru kepada-Mu
  rationale: Bentuk perfek Ibrani memungkinkan pembacaan lampau, tetapi dalam doa puitis dapat menyajikan seruan yang sedang diperdengarkan. Teks utama memakai bentuk Indonesia yang tidak menandai aspek selesai secara tegas, sedangkan alternatif dicatat untuk menjaga ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Sapaan “kepada-Mu” mempertahankan gaya doa yang khidmat. Judul dipisahkan dari isi ayat agar struktur teks Ibrani terlihat.
