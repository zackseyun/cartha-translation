    rationale: Kata Ibrani itu lazim dipakai sebagai ungkapan puitis “kedalaman”; bentuk kolektif/pluralnya tidak perlu direplikasi secara morfologis bila hasilnya tidak wajar dalam bahasa sasaran.
  - severity: low
