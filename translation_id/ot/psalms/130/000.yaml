  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/000.yaml
  text: A Song of Ascents[a]. Out of the depths I have called to you[b], Yahweh.
translation:
  language: id
  text: 'Nyanyian Pendakian.[a]


    Dari kedalaman aku telah berseru kepada-Mu, ya Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ini adalah judul tradisional bagi kelompok Mazmur 120–134. Hubungannya mungkin dengan perjalanan naik ke Yerusalem, tetapi judul Ibraninya sendiri hanya menyebut “pendakian”.
    reason: cultural_note
  - marker: b
    text: Atau, “aku berseru kepada-Mu.” Bahasa Indonesia tidak selalu menandai kala; kata kerja Ibrani berbentuk perfektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian pendakian
  rationale: Menerjemahkan judul Ibrani secara dekat dan tetap wajar. Ungkapan ini merupakan judul tradisional kelompok Mazmur 120–134; makna tepat 'pendakian' dalam konteks judul tidak dijelaskan oleh teks.
- source_word: מִמַּעֲמַקִּים
  choice: Dari tempat-tempat yang dalam
  rationale: Mempertahankan bentuk jamak dan gambaran ruang dalam bahasa Ibrani tanpa membatasinya menjadi jurang fisik tertentu; ungkapan ini juga dapat menyiratkan kesesakan yang amat berat.
- source_word: קְרָאתִיךָ
  choice: aku berseru kepada-Mu
  rationale: '''Berseru'' menyampaikan tindakan memanggil dengan sungguh-sungguh. Bahasa Indonesia tidak wajib menandai kala, sehingga ungkapan ini dapat menghadirkan doa secara langsung sambil tetap memungkinkan nuansa tindakan lampau dari bentuk Ibraninya.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi Ibrani, bukan menggantinya dengan gelar, selaras dengan identitas nama dalam teks sumber.
theological_decisions:
- issue: Nuansa 'tempat-tempat yang dalam'
  choice: Membiarkan ungkapan itu sebagai gambaran yang terbuka, yang dapat menunjuk pada kesesakan mendalam.
  alternative: Menafsirkannya secara khusus sebagai jurang fisik, dosa, atau maut.
  rationale: Teks Ibrani sendiri tidak menentukan satu rujukan khusus, sehingga ketegangan metaforisnya perlu dipertahankan.
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama itu ditampilkan sebagai nama diri sesuai bentuk sumber, tanpa menyangkal tradisi pembacaan yang menggantinya dengan gelar 'Tuhan'.
translation_notes:
  register: Bahasa dibuat modern, khidmat, dan mudah dipahami. Sapaan hormat kepada Allah ditulis dengan kapital pada enklitik “-Mu”. Bentuk jamak “tempat-tempat yang dalam” sengaja dipertahankan untuk mencerminkan teks Ibrani, meskipun sedikit lebih puitis daripada bahasa percakapan.
