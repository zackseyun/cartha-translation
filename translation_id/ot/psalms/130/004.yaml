  text: כִּֽי עִמְּ/ךָ֥ הַ/סְּלִיחָ֑ה לְ֝מַ֗עַן תִּוָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/004.yaml
  text: But with you there is forgiveness[a], so that you may be feared.
translation:
  language: id
  text: Namun, pada-Mu ada pengampunan, supaya Engkau ditakuti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “disegani dengan penuh takzim”; bahasa Ibrani secara harfiah mengatakan “ditakuti,” yang sering mengandung arti takut penuh hormat kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Namun
  rationale: Dalam konteks ayat sebelumnya, partikel ini memperkenalkan kontras antara ketidakmungkinan bertahan jika kesalahan diperhitungkan dan adanya pengampunan pada Allah. “Namun” menyampaikan daya adversatif itu secara alami.
- source_word: עִמְּךָ
  choice: pada-Mu
  rationale: Ungkapan ini menyatakan bahwa pengampunan berada pada atau tersedia dari Allah. “Pada-Mu” alami dalam ragam Alkitab Indonesia dan tidak menyiratkan sekadar kedekatan tempat.
- source_word: הַסְּלִיחָה
  choice: pengampunan
  rationale: Nomina ini berarti pengampunan atau penghapusan kesalahan. “Pengampunan” jelas, modern, dan mempertahankan bobot teologisnya.
- source_word: לְמַעַן
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil. “Supaya” mempertahankan hubungan bahwa pengampunan Allah menghasilkan sikap tertentu terhadap-Nya.
- source_word: תִּוָּרֵא
  choice: Engkau ditakuti
  rationale: Bentuk Nifal dari ירא secara langsung berarti “ditakuti” atau “dipandang dengan gentar.” Terjemahan ini mempertahankan istilah Ibrani dan ketegangan maknanya, sedangkan nuansa takut penuh hormat dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Tanggapan yang dihasilkan oleh pengampunan Allah
  choice: Pengampunan menyebabkan Allah ditakuti, dengan mempertahankan verba “takut” dalam teks utama.
  alternative: Pengampunan menyebabkan Allah dihormati atau disegani dengan penuh takzim.
  rationale: Bahasa Ibrani secara eksplisit memakai ירא. Teks utama tidak melunakkannya menjadi “dihormati,” tetapi catatan kaki menjelaskan bahwa dalam konteks ini rasa takut dapat mencakup kegentaran dan hormat yang mendalam, bukan semata-mata kengerian.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia. Susunan “pada-Mu ada pengampunan” mempertahankan fokus sumber bahwa pengampunan berada pada Allah.
