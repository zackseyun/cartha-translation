  text: אֲדֹנָ/י֮ שִׁמְעָ֪/ה בְ/ק֫וֹלִ֥/י תִּהְיֶ֣ינָה אָ֭זְנֶי/ךָ קַשֻּׁב֑וֹת לְ֝/ק֗וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/002.yaml
  text: Lord[a], hear my voice; let your ears be attentive to the voice of my pleas for mercy.
translation:
  language: id
  text: Tuhan, dengarkanlah suaraku; biarlah telinga-Mu memperhatikan suara permohonanku akan belas kasihan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Sapaan ilahi אֲדֹנָי dibedakan dari nama perjanjian YHWH dan secara wajar diterjemahkan sebagai “Tuhan” dalam bahasa Indonesia.
- source_word: שִׁמְעָה
  choice: dengarkanlah
  rationale: Bentuk imperatif dalam doa ini menyatakan permohonan langsung. “Dengarkanlah” alami dalam bahasa Indonesia dan menyiratkan perhatian, bukan sekadar kemampuan mendengar.
- source_word: בְּקוֹלִי
  choice: suaraku
  rationale: Mempertahankan gambaran konkret קוֹל dan menghasilkan ungkapan doa Indonesia yang alami bersama verba “dengarkanlah”.
- source_word: תִּהְיֶינָה
  choice: biarlah ... memberi
  rationale: Imperfek ini memiliki daya yusif atau permohonan. Konstruksi “biarlah” mempertahankan nuansa tersebut; kopula Ibrani diungkapkan secara idiomatis bersama predikat verbal.
- source_word: אָזְנֶיךָ
  choice: telinga-Mu
  rationale: Gambaran antropomorfis konkret dipertahankan, termasuk rujukan hormat kepada Allah melalui kapitalisasi pronomina terikat.
- source_word: קַשֻּׁבוֹת
  choice: memberi perhatian
  rationale: Adjektiva ini menyatakan keadaan menyimak dengan sungguh-sungguh. “Memberi perhatian” lebih alami daripada “penuh perhatian” ketika subjeknya “telinga-Mu”.
- source_word: לְקוֹל
  choice: kepada suara
  rationale: Mempertahankan pengulangan קוֹל dalam teks Ibrani dan kesejajaran puitis kedua bagian ayat.
- source_word: תַּחֲנוּנָי
  choice: permohonanku memohon belas kasihan
  rationale: Nomina ini menunjuk pada permohonan sungguh-sungguh untuk memperoleh kemurahan atau belas kasihan. Pilihan ini mengungkapkan kandungan leksikalnya tanpa memakai istilah kuno “permohonan belas kasihan” yang dapat terasa kaku.
theological_decisions:
- issue: Bahasa antropomorfis tentang pendengaran Allah
  choice: Mempertahankan “telinga-Mu memberi perhatian”
  alternative: Memparafrasakan sebagai “dengarkanlah aku dengan sungguh-sungguh”
  rationale: Teks Ibrani secara eksplisit memakai gambaran anggota tubuh. Mempertahankannya menjaga daya puitis dan relasional doa tanpa mengubahnya menjadi pernyataan abstrak.
- issue: Nuansa תַּחֲנוּנָי sebagai permohonan akan kemurahan
  choice: “permohonanku memohon belas kasihan”
  alternative: “permohonanku” atau “seruanku”
  rationale: Terjemahan ini mempertahankan sikap pemohon yang mencari kemurahan Allah, tetapi tidak menambahkan rumusan doktrinal di luar kandungan istilah Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “suara” dipertahankan demi kesejajaran Ibrani. Bentuk “-lah” dan “biarlah” menjaga corak permohonan doa; kapitalisasi “-Mu” mengikuti kebiasaan ejaan religius Indonesia.
