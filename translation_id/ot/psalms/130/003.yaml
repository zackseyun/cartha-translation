id: PSA.130.3
reference: Psalms 130:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם עֲוֺנ֥וֹת תִּשְׁמָר יָ֑הּ אֲ֝דֹנָ֗/י מִ֣י יַעֲמֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/003.yaml
  text: If you[a], Yah, should keep watch over iniquities, Lord, who could stand?
translation:
  language: id
  text: Jika Engkau, Yah, memperhitungkan kesalahan-kesalahan[a], Tuhan, siapakah yang dapat bertahan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjaga” atau “mengawasi kesalahan-kesalahan”; dalam konteks ini berarti mencatat atau terus memperhitungkan dosa-dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Membuka klausa bersyarat secara langsung dan alami dalam bahasa Indonesia.
- source_word: עֲוֺנוֹת
  choice: kesalahan-kesalahan
  rationale: Menyampaikan pelanggaran yang mendatangkan kesalahan atau tanggungan moral; bentuk jamaknya dipertahankan.
- source_word: תִּשְׁמָר
  choice: memperhitungkan
  rationale: Dalam konteks ini verba yang secara harfiah berarti menjaga atau mengawasi menunjuk pada tindakan tetap mencatat dan memperhitungkan pelanggaran seseorang.
- source_word: יָהּ
  choice: Yah
  rationale: Mempertahankan bentuk puitis singkat nama ilahi dan membedakannya dari gelar אֲדֹנָי pada baris yang sama.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Merupakan gelar ilahi dalam sapaan langsung; 'Tuhan' adalah padanan Indonesia yang wajar dan baku.
- source_word: מִי
  choice: siapakah
  rationale: Bentuk tanya ini sesuai dengan pertanyaan retoris yang bernada khidmat.
- source_word: יַעֲמֹד
  choice: dapat bertahan
  rationale: Mengungkapkan ketidakmampuan untuk tetap berdiri atau bertahan di hadapan penghakiman Allah.
theological_decisions:
- issue: Pembedaan יָהּ dan אֲדֹנָי dalam ayat yang sama
  choice: יָהּ diterjemahkan 'Yah' dan אֲדֹנָי diterjemahkan 'Tuhan'.
  alternative: Keduanya diterjemahkan dengan sebutan 'Tuhan', atau יָהּ diterjemahkan 'TUHAN'.
  rationale: Teks Ibrani memakai dua sebutan ilahi yang berbeda. Pembedaan ini mempertahankan bentuk puitis nama ilahi dan gelar ilahi tanpa meratakannya.
- issue: Nuansa תִּשְׁמָר terhadap pelanggaran
  choice: memperhitungkan kesalahan-kesalahan
  alternative: mengawasi kesalahan-kesalahan; mencatat dosa-dosa
  rationale: Konteksnya bukan sekadar Allah melihat pelanggaran, melainkan terus menyimpannya sebagai perkara yang harus dipertanggungjawabkan. Pilihan ini mempertahankan daya yudisialnya tanpa menyatakan lebih dari teks.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan dua sapaan ilahi dipertahankan agar perbedaan dalam teks Ibrani tetap tampak; huruf kapital pada 'Engkau' digunakan sebagai konvensi penghormatan kepada Allah.
