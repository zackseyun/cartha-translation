  yaml_path: translation/ot/psalms/130/006.yaml
  text: My soul waits for the Lord more than watchmen for the morning[a], more than watchmen for the morning.
translation:
  language: id
  text: Jiwaku menanti Tuhan lebih daripada para penjaga menanti pagi—lebih daripada para penjaga menanti pagi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jiwaku kepada Tuhan lebih daripada para penjaga kepada pagi.” Dalam bahasa Ibrani tidak ada verba yang dinyatakan secara eksplisit di sini; “menanti” dipasok dari konteks mazmur ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Jiwaku
  rationale: Secara harfiah berarti “jiwaku” dan dalam puisi Mazmur menunjuk pada diri pribadi dalam kerinduan dan ketergantungannya; bentuk ini mempertahankan daya puitis tanpa meratakannya menjadi “aku”.
- source_word: לַאדֹנָי
  choice: menanti-nantikan Tuhan
  rationale: Preposisi ל menandai arah atau sasaran penantian. Karena teks Ibrani tidak menyatakan verba secara eksplisit, “menanti-nantikan” dipasok dari konteks ayat sebelumnya dan gambaran para penjaga.
- source_word: מִשֹּׁמְרִים
  choice: lebih daripada para penjaga
  rationale: מִן menyatakan perbandingan, sedangkan bentuk partisipel jamak שֹׁמְרִים mengacu pada orang-orang yang berjaga, paling wajar dipahami sebagai para penjaga malam.
- source_word: לַבֹּקֶר
  choice: menantikan pagi
  rationale: בֹּקֶר berarti “pagi”; dalam konteks para penjaga, frasa ini menyampaikan penantian akan datangnya pagi. Penambahan verba membuat susunan alami dalam bahasa Indonesia.
- source_word: שֹׁמְרִים לַבֹּקֶר
  choice: para penjaga menantikan pagi
  rationale: Pengulangan frasa dipertahankan untuk menjaga penegasan puitis dan intensitas kerinduan dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan אֲדֹנָי sebagai gelar ilahi
  choice: Tuhan
  alternative: Tuanku
  rationale: Dalam mazmur ini acuannya adalah Allah dan אֲדֹנָי berfungsi sebagai gelar ilahi yang penuh hormat. “Tuhan” merupakan padanan Indonesia yang jelas dan lazim tanpa memasukkan penafsiran denominasi tertentu.
- issue: Verba yang tidak dinyatakan dalam klausa pertama
  choice: menanti-nantikan
  alternative: jiwaku tertuju kepada Tuhan
  rationale: Teks Ibrani secara harfiah tidak memuat verba, sehingga secara gramatikal kedua pemahaman mungkin. Konteks Mazmur 130:5 dan perbandingan dengan para penjaga mendukung pemasokan gagasan menanti; bentuk ulang “menanti-nantikan” menyampaikan penantian yang sungguh-sungguh.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. “Jiwaku” mempertahankan citra batiniah teks; pengulangan penuh pada akhir ayat dipertahankan sebagai unsur penegasan puisi Ibrani.
