  edition: WLC
  text: יַחֵ֥ל יִשְׂרָאֵ֗ל אֶל יְה֫וָה כִּֽי עִם יְהוָ֥ה הַ/חֶ֑סֶד וְ/הַרְבֵּ֖ה עִמּ֣/וֹ פְדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/007.yaml
  text: Israel[a], wait for Yahweh, for with Yahweh there is steadfast love, and with him is abundant redemption.
translation:
  language: id
  text: Hendaklah Israel menantikan[a] Yahweh, sebab pada Yahweh ada kasih setia, dan pada-Nya ada penebusan yang berlimpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berharap kepada Yahweh.” Kata kerja Ibrani ini mencakup makna menanti dengan penuh harap.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֵל
  choice: nantikanlah
  rationale: Kata kerja יחל mencakup penantian yang disertai harapan. Bentuk ajakan kepada Israel diterjemahkan secara alami dengan imperatif bahasa Indonesia; alternatif makna 'berharaplah kepada' dipertahankan dalam catatan kaki.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri umat perjanjian ditransliterasikan menurut bentuk baku bahasa Indonesia.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Dengan kata kerja 'nantikanlah', preposisi אֶל tercakup secara idiomatis dalam konstruksi transitif bahasa Indonesia, tanpa perlu menambahkan 'kepada' atau 'akan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi ajakan sebelumnya dan sesuai dengan ragam puitis yang wajar.
- source_word: עִם יְהוָה
  choice: pada Yahweh ada
  rationale: Mempertahankan gambaran bahwa kasih setia berada bersama Yahweh, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: הַחֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini menyampaikan kasih yang teguh dan kesetiaan relasional dari חֶסֶד tanpa menjadikannya istilah teknis denominasi.
- source_word: וְהַרְבֵּה
  choice: yang berlimpah
  rationale: Menyatakan jumlah atau keluasan yang besar dan berpadu alami dengan 'penebusan'.
- source_word: עִמּוֹ
  choice: pada-Nya ada
  rationale: Mempertahankan pengulangan dan kesejajaran struktur עִם ... עִמּוֹ; pronomina merujuk kepada Yahweh.
- source_word: פְדוּת
  choice: penebusan
  rationale: Menyampaikan gagasan pembebasan melalui penebusan atau pembayaran tebusan serta mempertahankan bobot leksikal kata tersebut dalam konteks mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Nuansa יחל dalam ajakan
  choice: nantikanlah Yahweh
  alternative: berharaplah kepada Yahweh
  rationale: Kata Ibrani dapat menunjuk baik pada menanti maupun berharap. Teks utama menonjolkan penantian penuh harap, sedangkan alternatif leksikal yang sah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. Sapaan 'Hai Israel' mempertahankan fungsi vokatif; kesejajaran 'pada Yahweh ... pada-Nya' mencerminkan struktur Ibrani.
