  yaml_path: translation/ot/psalms/123/001.yaml
  text: A Song of Ascents[a]. To you I lift up my eyes[b], O you who are enthroned in the heavens.
translation:
  language: id
  text: 'Nyanyian Kenaikan.[a]


    Kepada-Mu aku mengangkat mataku,

    Ya, Engkau yang bersemayam di surga.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “Kenaikan” dapat menunjuk pada tindakan naik, perjalanan menuju tempat yang lebih tinggi, atau anak-anak tangga; maksud khusus judul ini tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “yang duduk” atau “yang tinggal di langit.” Kata kerjanya juga dapat mengandung nuansa kerajaan, sehingga diterjemahkan “bersemayam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Nyanyian
  rationale: Kata ini secara langsung berarti nyanyian dan sesuai dengan bentuk judul kumpulan mazmur ini.
- source_word: הַמַּעֲלוֹת
  choice: Kenaikan
  rationale: Mempertahankan gambaran dasar tentang gerak naik tanpa memastikan apakah yang dimaksud adalah perjalanan ziarah, anak tangga liturgis, atau hal lain.
- source_word: אֵלֶיךָ
  choice: Kepada-Mu
  rationale: Menyampaikan arah seruan langsung kepada Allah secara alami dalam bahasa Indonesia.
- source_word: נָשָׂאתִי
  choice: aku mengangkat
  rationale: Bentuk perfektif Ibrani menggambarkan tindakan pemazmur; bentuk kini bahasa Indonesia terdengar alami sebagai tindakan doa yang sedang dinyatakan.
- source_word: אֶת עֵינַי
  choice: mataku
  rationale: Mempertahankan gambaran konkret bahasa Ibrani, bukan menggantinya dengan istilah abstrak seperti perhatian atau pandangan.
- source_word: הַיֹּשְׁבִי
  choice: yang bersemayam
  rationale: Kata Ibrani secara harfiah dapat berarti duduk atau tinggal. Bersemayam mempertahankan gagasan menetap sekaligus memungkinkan nuansa kerajaan dalam sapaan kepada Allah.
- source_word: בַּשָּׁמָיִם
  choice: di surga
  rationale: Dalam sapaan kepada Allah, surga merupakan padanan Indonesia yang alami bagi wilayah surgawi, sementara catatan kaki mempertahankan bentuk harfiah langit.
theological_decisions:
- issue: Nuansa kerajaan dalam הַיֹּשְׁבִי בַּשָּׁמָיִם
  choice: ya Engkau yang bersemayam di surga
  alternative: ya Engkau yang duduk atau tinggal di langit
  rationale: Bersemayam cocok untuk sapaan yang luhur kepada Allah dan dapat menyiratkan kedaulatan, tetapi tidak secara eksplisit menambahkan takhta yang tidak disebutkan dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum bahasa Indonesia. Pemenggalan baris mempertahankan bentuk puisi tanpa menambah tafsiran.
