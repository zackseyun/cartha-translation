  yaml_path: translation/ot/psalms/123/003.yaml
  text: Be gracious to us[a], O Yahweh; be gracious to us[b], for we have had more than enough of contempt.
translation:
  language: id
  text: Berilah kami kemurahan[a], ya Yahweh, berilah kami kemurahan, sebab kami sudah terlalu kenyang akan penghinaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Kasihanilah kami” atau “Tunjukkanlah perkenanan kepada kami.” Kata kerja Ibrani ini dapat menyatakan kemurahan, perkenanan, atau belas kasihan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab kami sangat kenyang dengan penghinaan.” Ini mengungkapkan bahwa mereka telah mengalami penghinaan lebih dari cukup.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנוּ
  choice: Bermurah hatilah kepada kami
  rationale: Bentuk imperatif חנן dengan akhiran orang pertama jamak memohon agar Allah menunjukkan kemurahan, perkenanan, atau belas kasihan. Ungkapan ini mempertahankan keluasan makna tersebut dan terdengar wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi permohonan sebelumnya.
- source_word: רַב שָׂבַעְנוּ
  choice: kami sudah teramat kenyang
  rationale: Secara harfiah ungkapan ini menyatakan bahwa para pemazmur telah dikenyangkan dalam kadar yang sangat besar. “Teramat kenyang” mempertahankan metafora kepenuhan sekaligus menyampaikan bahwa mereka telah mengalaminya lebih dari cukup.
- source_word: בּוּז
  choice: penghinaan
  rationale: Kata ini menunjuk pada sikap atau perlakuan yang merendahkan dan menghina; “penghinaan” sesuai dengan objek abstrak dalam ungkapan Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan permohonan dipertahankan, demikian pula metafora “kenyang” dari teks Ibrani. Sapaan “ya Yahweh” mencerminkan fungsi vokatif nama ilahi.
