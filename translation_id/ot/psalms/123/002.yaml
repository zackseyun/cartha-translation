id: PSA.123.2
reference: Psalms 123:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּ֨ה כְ/עֵינֵ֪י עֲבָדִ֡ים אֶל יַ֤ד אֲֽדוֹנֵי/הֶ֗ם כְּ/עֵינֵ֣י שִׁפְחָה֮ אֶל יַ֪ד גְּבִ֫רְתָּ֥/הּ כֵּ֣ן עֵ֭ינֵי/נוּ אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ עַ֝֗ד שֶׁ/יְּחָנֵּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/002.yaml
  text: Look[a], as the eyes of servants are toward the hand of their masters, as the eyes of a female servant are toward the hand of her mistress, so our eyes are toward Yahweh our God[b], until he shows us favor.
translation:
  language: id
  text: Lihatlah, seperti mata hamba-hamba[a] tertuju kepada tangan tuan mereka, seperti mata seorang hamba perempuan tertuju kepada tangan nyonyanya, demikianlah mata kita tertuju kepada Yahweh, Allah kita, sampai Ia bermurah hati kepada kita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak-budak”. Kata Ibrani dapat menunjuk kepada hamba atau budak; gambaran ini menekankan ketergantungan dan perhatian mereka kepada pihak yang berkuasa atas mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau “sampai Ia mengaruniakan kemurahan kepada kita” atau “sampai Ia mengasihani kita”.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian kepada perbandingan yang menyusul. “Lihatlah” mempertahankan daya penunjuknya dalam bahasa Indonesia modern tanpa kesan terlalu arkais.
- source_word: כְעֵינֵי
  choice: seperti mata
  rationale: Awalan כְּ menyatakan perbandingan. Bentuk ini juga mempertahankan pengulangan puitis “seperti mata ... seperti mata”.
- source_word: עֲבָדִים
  choice: hamba-hamba
  rationale: Kata ini dapat menunjuk kepada hamba atau budak. “Hamba-hamba” cocok dengan gambaran rumah tangga dan menonjolkan ketergantungan serta perhatian mereka, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: יַד
  choice: tangan
  rationale: Dipertahankan secara harfiah karena tangan dapat menyiratkan isyarat, tindakan, atau pemberian dari pihak yang berkuasa; teks tidak menentukan salah satunya.
- source_word: אֲדֹנֵיהֶם
  choice: tuan mereka
  rationale: Bentuk ini menyatakan para pihak yang berkuasa atas hamba-hamba tersebut. “Tuan mereka” alami dalam bahasa Indonesia dan tidak mencampurkannya dengan sebutan ilahi.
- source_word: שִׁפְחָה
  choice: seorang hamba perempuan
  rationale: Terjemahan ini mempertahankan pembedaan gender yang dinyatakan oleh kata Ibrani dan tetap mudah dipahami pembaca modern.
- source_word: גְּבִרְתָּהּ
  choice: nyonyanya
  rationale: Kata Ibrani menunjuk kepada perempuan yang menjadi tuan atas hamba itu. “Nyonyanya” mempertahankan unsur perempuan dan hubungan rumah tangga dengan ringkas.
- source_word: כֵּן
  choice: demikianlah
  rationale: Menandai bagian penerapan dari perbandingan dan memberi kesinambungan puitis yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Menerjemahkan bentuk dengan akhiran orang pertama jamak secara langsung serta mempertahankan ungkapan relasional dalam teks.
- source_word: עַד שֶׁיְחָנֵּנוּ
  choice: sampai Ia bermurah hati kepada kita
  rationale: Kata kerja חנן menyatakan tindakan atau sikap yang penuh kemurahan dan perkenanan. Ungkapan ini alami dalam bahasa Indonesia serta tidak mempersempit maknanya hanya menjadi rasa iba.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan membedakannya dari gelar.
- issue: Nuansa חנן dalam permohonan penutup
  choice: sampai Ia bermurah hati kepada kita
  alternative: sampai Ia mengaruniakan kemurahan kepada kita; sampai Ia mengasihani kita
  rationale: חנן berpusat pada kemurahan atau perkenanan yang diberikan secara cuma-cuma, tetapi dalam konteks permohonan juga dapat dipahami sebagai belas kasihan. Terjemahan utama mempertahankan nuansa kemurahan, sedangkan kemungkinan lain disajikan dalam catatan kaki.
- issue: Makna gambaran mata yang tertuju kepada tangan
  choice: Mempertahankan ungkapan konkret tanpa menjelaskan apakah tangan memberi isyarat, menyediakan kebutuhan, atau bertindak menolong
  alternative: Menambahkan penjelasan tentang menantikan perintah atau pemberian
  rationale: Teks Ibrani membiarkan fungsi “tangan” terbuka. Mempertahankan gambaran tersebut menjaga keluasan dan ketegangan puitisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pengulangan “seperti mata” dipertahankan untuk menjaga paralelisme Ibrani. “Nyonyanya” dipilih sebagai padanan ringkas bagi atasan perempuan dalam lingkungan rumah tangga, sedangkan “bermurah hati” menyampaikan חנן secara alami tanpa menutup kemungkinan nuansa belas kasihan.
