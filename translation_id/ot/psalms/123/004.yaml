  text: Our soul has had more than enough of the mockery of those at ease[b][a], the contempt of the proud.
translation:
  language: id
  text: Jiwa kami sudah sangat kenyang oleh ejekan orang-orang yang hidup tenteram,[a] oleh penghinaan orang-orang sombong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang hidup berpuas diri.”'
    reason: Kata Ibrani dapat menggambarkan orang yang hidup tenteram atau aman, dan dalam konteks ini mungkin bernuansa berpuas diri.
lexical_decisions:
- source_word: רַבַּת שָׂבְעָה
  choice: sudah lebih dari kenyang
  rationale: Gabungan kata penguat רַבַּת dan verba שׂבע menyatakan keadaan telah dipenuhi secara berlebihan oleh sesuatu yang tidak menyenangkan. Ungkapan ini mempertahankan citra Ibrani sekaligus dapat dipahami dalam bahasa Indonesia.
- source_word: נַפְשֵׁנוּ
  choice: Jiwa kami
  rationale: Bentuk tunggal dengan sufiks jamak menunjuk pada diri atau kehidupan batin komunitas. 'Jiwa kami' mempertahankan ungkapan puitis dan bentuk kolektif teks Ibrani.
- source_word: הַלַּעַג
  choice: ejekan
  rationale: Kata ini menunjuk pada olok-olok atau tindakan mempermainkan dengan kata-kata; 'ejekan' alami dan tepat dalam konteks sosial ini.
- source_word: הַשַּׁאֲנַנִּים
  choice: orang-orang yang hidup tenteram
  rationale: Kata ini menggambarkan mereka yang tidak terusik dan hidup aman atau nyaman, dengan kemungkinan nuansa berpuas diri. Pilihan ini mempertahankan arti dasar tanpa menjadikan nuansa negatif yang tersirat sebagai arti eksplisit.
- source_word: הַבּוּז
  choice: penghinaan
  rationale: Kata ini menyatakan sikap atau perlakuan merendahkan. 'Penghinaan' membentuk kesejajaran yang jelas dengan 'ejekan' tanpa sekadar mengulang kata yang sama.
- source_word: לִגְאֵיוֹנִים
  choice: orang-orang sombong
  rationale: Bentuk jamak ini merujuk kepada orang yang tinggi hati atau angkuh. 'Orang-orang sombong' merupakan padanan Indonesia yang langsung dan wajar.
