source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֵ֭לֶי/ךָ נָשָׂ֣אתִי אֶת עֵינַ֑/י הַ֝/יֹּשְׁבִ֗י בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/000.yaml
  text: 'A Song of Ascents[a].

    To you I have lifted up my eyes[b],

    you who sit in the heavens.'
translation:
  language: id
  text: 'Nyanyian ziarah.


    Kepada-Mu aku mengangkat mataku,

    Engkau yang bersemayam di surga.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang duduk atau tinggal di langit.” Ungkapan ini dapat menyiratkan bahwa Allah bersemayam sebagai Raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Secara harfiah berarti “nyanyian pendakian”; sebagai judul kumpulan Mazmur 120–134, ungkapan ini secara wajar dipahami berkaitan dengan perjalanan naik menuju Yerusalem.
- source_word: נָשָׂאתִי אֶת־עֵינַי
  choice: aku mengangkat mataku
  rationale: Mempertahankan citra dan bentuk perfektif Ibrani secara alami dalam bahasa Indonesia.
- source_word: הַיֹּשְׁבִי
  choice: yang bersemayam
  rationale: Kata ini secara harfiah berarti “yang duduk/diam”; “bersemayam” mempertahankan kemungkinan makna tinggal sekaligus nuansa kerajaan tanpa membuatnya terlalu eksplisit.
- source_word: בַּשָּׁמָיִם
  choice: di surga
  rationale: Bentuk Ibrani secara morfologis jamak, tetapi istilah Indonesia “surga” merupakan padanan idiomatis bagi ranah surgawi; alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Nuansa kerajaan dalam הַיֹּשְׁבִי
  choice: bersemayam
  alternative: duduk / tinggal
  rationale: “Bersemayam” mengisyaratkan kedudukan ilahi sebagai Raja, tetapi tidak menambahkan istilah eksplisit seperti “bertakhta” yang tidak terdapat secara leksikal dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Sapaan ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Baris puisi mengikuti susunan sintaksis Ibrani.
