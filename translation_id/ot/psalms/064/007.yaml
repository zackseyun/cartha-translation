  text: Namun Allah menembakkan anak panah kepada mereka[a]; tiba-tiba mereka terluka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “Namun Allah memanah mereka; tiba-tiba luka-luka mereka terjadi.”'
    reason: Alternatif yang mempertahankan sufiks objek pada verba “memanah mereka” dan ungkapan nominal מַכּוֹתָם, “luka-luka mereka.”
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: memanah mereka
  rationale: Bentuk verba dari ירה dengan sufiks orang ketiga jamak menggambarkan Allah sebagai pelaku yang menembakkan anak panah kepada mereka. Bentuk lampau naratif Ibrani disampaikan dengan kala naratif alami dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Sebutan baku bagi Allah Israel dalam konteks ini; verba dan konteks menunjukkan rujukan tunggal.
- source_word: חֵץ
  choice: memanah
  rationale: Nomina חֵץ berarti 'anak panah'. Dalam bahasa Indonesia, gabungan verba 'memanah' secara alami menyampaikan tindakan menembakkan anak panah tanpa kehilangan citra puitisnya; bentuk yang lebih formal dicatat dalam catatan kaki.
- source_word: פִּתְאֹם
  choice: tiba-tiba
  rationale: Mempertahankan makna tindakan atau akibat yang mendadak dan tak terduga.
- source_word: הָיוּ מַכּוֹתָם
  choice: mereka terluka
  rationale: Secara lebih harfiah berbicara tentang 'luka-luka mereka' yang terjadi atau muncul. Ungkapan predikatif ini menyampaikan akibat serangan secara alami sambil mencatat bentuk formal sebagai alternatif.
theological_decisions:
- issue: Gambaran penghakiman ilahi dalam bahasa puisi
  choice: Allah digambarkan secara langsung sebagai pihak yang menyerang mereka dengan anak panah.
  alternative: Menghaluskan gambaran itu menjadi pembalikan keadaan oleh pemeliharaan ilahi semata.
  rationale: Teks Ibrani menampilkan Allah sebagai subjek yang bertindak. Terjemahan mempertahankan pelaku dan metafora penghakiman tersebut tanpa menambahkan penjabaran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. 'Namun' menandai pembalikan tajam dari konteks sebelumnya; 'memanah' mempertahankan citra konkret dengan susunan yang alami bagi pembaca umum.
