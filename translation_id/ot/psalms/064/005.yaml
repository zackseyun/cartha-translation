  yaml_path: translation/ot/psalms/064/005.yaml
  text: They strengthen for themselves an evil matter[a]; they talk of hiding snares; they say[b], “Who will see them?”
translation:
  language: id
  text: Mereka meneguhkan rencana jahat mereka[a]; mereka membicarakan menyembunyikan jerat. Mereka berkata, “Siapa yang akan melihat mereka[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “rencana” juga dapat berarti “perkataan”, “perkara”, atau “urusan”.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Ibrani di sini memakai pronomina orang ketiga jamak, “mereka”, yang mungkin merujuk kepada jerat-jerat atau perbuatan mereka. Ada juga yang memahami ujaran para pelaku itu sebagai, “Siapa yang akan melihat kami?”
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  choice: mereka meneguhkan ... mereka
  rationale: 'Bentuk Piel dari חזק menyatakan membuat teguh atau menguatkan. Pronomina לָמוֹ dipahami secara refleksif dalam konteks, lalu diungkapkan secara alami dalam bahasa Indonesia sebagai kepunyaan: mereka memantapkan rencana mereka sendiri.'
- source_word: דָּבָר רָע
  choice: rencana jahat
  rationale: דבר dapat berarti perkataan, perkara, urusan, atau hal. Konteks persekongkolan dan pemasangan jerat mendukung 'rencana', sementara catatan kaki mempertahankan keluasan leksikalnya.
- source_word: יְסַפְּרוּ
  choice: mereka membicarakan
  rationale: Piel ספר di sini menggambarkan mereka mempercakapkan atau merundingkan tindakan berikutnya; 'membicarakan' alami dan tidak menambahkan gagasan yang tidak tersurat.
- source_word: לִטְמוֹן מוֹקְשִׁים
  choice: cara menyembunyikan jerat
  rationale: טמן berarti menyembunyikan atau menanam secara tersembunyi, sedangkan מוקשׁ berarti jerat atau perangkap. Ungkapan ini mempertahankan tindakan menyembunyikan jerat dalam bahasa Indonesia yang wajar.
- source_word: אָמְרוּ
  choice: mereka berkata
  rationale: Walaupun bentuknya qatal, dalam rangkaian puisi ini kata tersebut melaporkan ujaran para pelaku; bentuk lampau tidak harus dinyatakan secara khusus dalam bahasa Indonesia.
- source_word: מִי יִרְאֶה לָּמוֹ
  choice: Siapa yang akan melihatnya?
  rationale: Suffix לָמוֹ adalah orang ketiga jamak. Klitik '-nya' dalam bahasa Indonesia dapat secara alami merujuk kepada jerat-jerat atau tindakan mereka tanpa memaksakan anteseden yang tidak dinyatakan tegas dalam puisi Ibrani.
