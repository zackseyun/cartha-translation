  text: יַֽחְפְּֽשׂוּ עוֹלֹ֗ת תַּ֭מְנוּ חֵ֣פֶשׂ מְחֻפָּ֑שׂ וְ/קֶ֥רֶב אִ֝֗ישׁ וְ/לֵ֣ב עָמֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: id
  text: Mereka merancang berbagai kejahatan dan berkata, “Kami telah menyempurnakan rencana yang tersembunyi dengan cermat.” Batin dan hati setiap orang itu dalam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: Mereka merancang berbagai kejahatan
  rationale: Bentuk verba menyatakan tindakan mencari, menyelidiki, atau mereka-reka; dalam konteks persekongkolan, “merancang” paling alami. Bentuk jamak עוֹלֹת menunjuk berbagai tindakan jahat atau tidak adil.
- source_word: תַּמְנוּ
  choice: Kami telah menyempurnakan
  rationale: Dipahami sebagai bentuk dari תמם, ‘menuntaskan/menyempurnakan’, sesuai dengan ucapan para pelaku bahwa persiapan mereka telah lengkap.
- source_word: חֵפֶשׂ מְחֻפָּשׂ
  choice: rencana yang tersembunyi dengan cermat
  rationale: Ungkapan ini sukar dan memainkan akar חפשׂ, yang berkaitan dengan pencarian atau penyelidikan. Dalam konteksnya, ungkapan tersebut menggambarkan rencana yang telah dipikirkan secara mendalam dan dibuat sulit ditemukan; terjemahan menjaga gagasan penyembunyian yang cermat tanpa meniru permainan kata secara kaku.
- source_word: וְקֶרֶב אִישׁ וְלֵב עָמֹק
  choice: Batin setiap orang dan hatinya sungguh dalam
  rationale: קֶרֶב menunjuk bagian terdalam atau batin manusia, sedangkan לֵב adalah pusat pikiran dan kehendak. עָמֹק dipertahankan dengan ‘dalam’, sehingga gambaran tentang kedalaman batin tidak dijelaskan secara berlebihan.
theological_decisions:
- issue: Kedalaman hati manusia
  choice: Batin setiap orang dan hatinya sungguh dalam
  alternative: Batin dan hati manusia tidak terselami
  rationale: Terjemahan utama mempertahankan metafora Ibrani ‘dalam’ dan ambiguitasnya—baik mengenai kelicikan maupun sulitnya menyelami batin—tanpa mengubahnya menjadi pernyataan doktrinal yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, dignified, dan mudah dipahami. Struktur puitis dipertahankan dalam dua kalimat, sementara sintaks Ibrani yang padat dibuat alami tanpa menghilangkan metafora ‘dalam’.
