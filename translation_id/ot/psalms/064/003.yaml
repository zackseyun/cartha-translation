  text: who sharpen their tongue like a sword; they bend their arrow—a bitter word—
translation:
  language: id
  text: yang menajamkan lidah mereka seperti pedang; mereka mengarahkan anak panah mereka[a]—perkataan pahit—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka menginjak anak panah mereka.” Ungkapan Ibrani ini tidak lazim dan mungkin eliptis, dengan pengertian menegangkan busur atau menyiapkan dan mengarahkan anak panah.
    reason: Mempertahankan kejanggalan serta ketidakpastian konstruksi Ibrani, sambil menjelaskan padanan Indonesia yang alami.
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: menajamkan
  rationale: Bentuk ini secara langsung menggambarkan tindakan mengasah atau menajamkan; metafora lidah sebagai pedang dipertahankan.
- source_word: דָּרְכוּ חִצָּם
  choice: membidikkan anak panah mereka
  rationale: Kata kerja דָּרַךְ lazim dipakai untuk mengentangkan busur atau menyiapkan senjata panah. Karena objek dalam teks ini adalah 'anak panah mereka', 'membidikkan' menyampaikan tindakan menyiapkan dan mengarahkan anak panah dalam bahasa Indonesia yang wajar, sementara kejanggalan harfiahnya dicatat dalam catatan kaki.
- source_word: דָּבָר מָר
  choice: perkataan pahit
  rationale: Terjemahan langsung yang mempertahankan metafora ucapan yang menyakitkan atau getir tanpa mempersempit maknanya.
theological_decisions:
- issue: Hubungan antara 'anak panah' dan 'perkataan pahit'
  choice: 'Memakai tanda pisah untuk mempertahankan aposisi metaforis: anak panah itu adalah perkataan pahit.'
  alternative: Menambahkan 'yaitu' atau menerjemahkan 'perkataan pahit sebagai anak panah'.
  rationale: Teks Ibrani menempatkan frasa-frasa itu berdampingan secara padat. Tanda pisah mempertahankan daya puitis dan kemungkinan sintaksisnya tanpa menambahkan penjelasan interpretatif.
translation_notes:
  register: Bahasa puitis, modern, dan bermartabat. Klausa relatif pembuka serta tanda pisah penutup dipertahankan karena ayat ini berlanjut dari ayat sebelumnya dan menuju ayat berikutnya.
