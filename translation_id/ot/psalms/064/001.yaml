id: PSA.64.1
reference: Psalms 64:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: id
  text: Dengarlah, ya Allah, suaraku dalam keluh kesahku[a]; jagalah hidupku dari ketakutan terhadap musuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam perenunganku” atau “dalam renunganku.” Istilah Ibrani ini dapat menunjuk pada perenungan batin maupun keluhan yang diucapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarlah
  rationale: Bentuk imperatif yang ditujukan kepada Allah; pilihan ini langsung, wajar, dan sesuai dengan bahasa doa dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini digunakan sebagai sapaan langsung; partikel “ya” menyampaikan fungsi vokatif secara alami.
- source_word: קוֹלִי
  choice: suaraku
  rationale: Mempertahankan ungkapan konkret bahasa Ibrani, bukan menyederhanakannya menjadi sekadar “aku” atau “doaku”.
- source_word: בְשִׂיחִי
  choice: dalam keluh kesahku
  rationale: Dalam konteks ratapan dan ancaman musuh, ungkapan ini paling mungkin menunjuk pada keluhan atau ratapan, tetapi makna perenungan tetap dicatat sebagai alternatif.
- source_word: מִפַּחַד
  choice: dari ketakutan terhadap
  rationale: פַּחַד berarti ketakutan, kegentaran, atau kengerian. “Ketakutan” merupakan padanan langsung yang tidak melebih-lebihkan kadar emosi dalam teks.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Mempertahankan bentuk tunggal yang dapat dipahami secara individual, generik, atau kolektif dalam puisi Ibrani.
- source_word: תִּצֹּר
  choice: jagalah
  rationale: Kata kerja נצר berarti menjaga, melindungi, atau memelihara. “Jagalah” alami bersama objek “hidupku” dan menyatakan permohonan perlindungan.
- source_word: חַיָּי
  choice: hidupku
  rationale: Padanan alami untuk bentuk Ibrani yang berarti kehidupan si pemazmur, tanpa memasukkan pengertian “jiwa” yang lebih interpretatif.
theological_decisions:
- issue: Makna בְשִׂיחִי dalam konteks ratapan
  choice: keluh kesahku
  alternative: perenunganku atau renunganku
  rationale: Konteks permohonan perlindungan dari musuh mendukung makna keluhan atau ratapan. Namun, karena istilah Ibrani juga dapat menunjuk pada perenungan batin, kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Hubungan פַּחַד dengan אוֹיֵב
  choice: ketakutan terhadap musuh
  alternative: kengerian yang ditimbulkan musuh
  rationale: Susunan Ibrani dapat dipahami sebagai rasa takut terhadap musuh atau teror yang berasal darinya. Terjemahan utama mempertahankan hubungan yang cukup terbuka tanpa menentukan secara tegas sumber atau sifat ketakutan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. Ungkapan “keluh kesahku” mempertahankan corak ratapan, sedangkan catatan kaki menjaga ambiguitas leksikal asli.
