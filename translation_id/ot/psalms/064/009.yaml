id: PSA.64.9
reference: Psalms 64:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽירְא֗וּ כָּל אָ֫דָ֥ם וַ֭/יַּגִּידוּ פֹּ֥עַל אֱלֹהִ֗ים וּֽ/מַעֲשֵׂ֥/הוּ הִשְׂכִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: id
  text: Maka semua manusia akan takut, dan mereka akan memberitakan perbuatan Allah; mereka akan memahami apa yang telah dilakukan-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: akan takut
  rationale: Kata ירא mencakup rasa gentar dan rasa hormat yang penuh takjub. Dalam rangkaian puitis sesudah penghukuman Allah, bentuk mendatang mempertahankan kesinambungan konteks.
- source_word: כָּל אָדָם
  choice: semua manusia
  rationale: אָדָם dipakai secara kolektif untuk umat manusia, bukan khusus seorang laki-laki. 'Semua manusia' alami dan tepat dalam bahasa Indonesia modern.
- source_word: וַיַּגִּידוּ
  choice: akan memberitakan
  rationale: Bentuk Hifil dari נגד berarti menyatakan atau membuat sesuatu diketahui; 'memberitakan' sesuai dengan nada kesaksian publik dalam ayat ini.
- source_word: פֹּעַל אֱלֹהִים
  choice: perbuatan Allah
  rationale: פֹּעַל menunjuk pada perbuatan, pekerjaan, atau tindakan. 'Perbuatan Allah' mengacu pada tindakan penghakiman-Nya dalam konteks tanpa mempersempit makna.
- source_word: וּמַעֲשֵׂהוּ
  choice: apa yang telah dilakukan-Nya
  rationale: Secara harfiah berarti 'dan perbuatan-Nya'. Ungkapan ini menghindari pengulangan yang kaku sambil tetap menyampaikan tindakan konkret Allah.
- source_word: הִשְׂכִּילוּ
  choice: akan memahami
  rationale: Bentuk Hifil dari שׂכל dapat berarti memperoleh pengertian, memahami, atau bertindak bijaksana. Karena objeknya adalah perbuatan Allah, pengertian yang tajam atas tindakan-Nya paling sesuai.
theological_decisions:
- issue: Makna kolektif אָדָם
  choice: semua manusia
  alternative: setiap orang
  rationale: Bentuk tunggal אָדָם di sini berfungsi secara kolektif dan merujuk pada manusia pada umumnya, bukan hanya laki-laki atau satu individu.
- issue: Nuansa ירא sebagai respons terhadap tindakan Allah
  choice: takut
  alternative: gentar; takjub
  rationale: '''Takut'' mempertahankan ketegangan antara rasa gentar karena penghakiman dan rasa hormat penuh takjub, tanpa membatasi kata itu pada salah satu nuansa.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur paralel Ibrani dipertahankan, sedangkan pengulangan פֹּעַל/מַעֲשֶׂה dibuat alami melalui 'perbuatan Allah' dan 'apa yang telah dilakukan-Nya'.
