  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
translation:
  language: id
  text: Orang benar akan bersukacita dalam Yahweh dan berlindung kepada-Nya; semua orang yang lurus hati akan bermegah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan bersukaria.” Kata kerja Ibrani ini dapat berarti bermegah atau bersukaria; di sini maknanya positif, yaitu bersukacita di dalam Yahweh dan atas tindakan penyelamatan-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: akan bersukacita
  rationale: Bentuk imperfek dalam konteks penutup mazmur menyatakan hasil yang diharapkan sesudah tindakan penghakiman Allah; bentuk mendatang mempertahankan arah waktunya.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva maskulin tunggal yang dipakai secara substantival dan representatif; 'orang benar' alami dalam bahasa Indonesia tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: בַּיהוָה
  choice: karena Yahweh
  rationale: Preposisi ב menandai dasar atau objek sukacita. 'Karena Yahweh' menyampaikan hubungan itu secara alami, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: וְחָסָה בּוֹ
  choice: dan berlindung kepada-Nya
  rationale: חסה mempertahankan gambaran mencari perlindungan, bukan sekadar percaya; 'kepada-Nya' alami untuk menyatakan Allah sebagai tempat perlindungan.
- source_word: וְיִתְהַלְלוּ
  choice: akan bermegah
  rationale: Bentuk Hitpael dari הלל dapat berarti bermegah, membanggakan diri, atau bersukaria. Dalam konteks ini maknanya positif dan menunjuk pada kegembiraan atas Allah serta karya penyelamatan-Nya.
- source_word: יִשְׁרֵי לֵב
  choice: orang yang tulus hati
  rationale: Ungkapan Ibrani menggambarkan mereka yang batinnya lurus. 'Tulus hati' merupakan ungkapan Indonesia yang alami sambil mempertahankan penekanan pada keadaan batin.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Objek dari tindakan bermegah
  choice: Tidak menambahkan objek tersurat
  alternative: akan bermegah dalam Yahweh
  rationale: Konteks mengarahkan kemegahan kepada Allah dan tindakan penyelamatan-Nya, tetapi klausa Ibrani terakhir tidak menyebutkan objek secara eksplisit. Terjemahan mempertahankan ketakterungkapan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis sederhana. Tanda titik koma memperjelas kesejajaran dua klausa. Huruf kapital pada pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia.
