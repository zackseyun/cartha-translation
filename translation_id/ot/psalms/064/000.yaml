  text: Untuk pemimpin musik. Mazmur Daud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Mazmur oleh Daud” atau “Mazmur untuk Daud”; frasa Ibraninya dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul Mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi penyajian musik. Ungkapan ini jelas, modern, dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah ini merupakan sebutan jenis karya yang lazim untuk nyanyian mazmur, dengan nuansa musikal.
- source_word: לְדָוִד
  choice: Daud
  rationale: Frasa ringkas “Mazmur Daud” alami dalam bahasa Indonesia dan tetap dapat mencakup hubungan kepengarangan, keterkaitan, atau peruntukan; catatan kaki menjelaskan keluasan fungsi preposisi Ibraninya.
theological_decisions:
- issue: Makna hubungan Daud dengan mazmur dalam judul
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud; Mazmur untuk Daud
  rationale: Preposisi לְ dalam judul mazmur dapat menyatakan kepengarangan, keterkaitan, kepemilikan koleksi, atau peruntukan. Terjemahan utama tidak mempersempitnya secara tidak semestinya, dan catatan kaki mempertahankan ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Pemimpin musik” dipilih daripada “pemimpin biduan” karena lebih mudah dipahami pembaca masa kini dan lebih luas cakupannya.
