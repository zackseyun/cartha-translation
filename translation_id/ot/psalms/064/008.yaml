  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Ungkapan ‘menggeleng-gelengkan kepala’ dipilih karena alami bagi pembaca umum, sedangkan ambiguitas sintaksis dan leksikal teks Ibrani dipertahankan melalui catatan kaki.
