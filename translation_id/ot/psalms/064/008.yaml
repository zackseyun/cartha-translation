  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: id
  text: Lidah mereka sendiri membuat mereka tersandung[a]; semua orang yang melihat mereka menggeleng-gelengkan kepala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bagian ini dapat diterjemahkan, “Lidahnya membuat dia/itu tersandung atas mereka.” Susunan kata Ibraninya sulit, dan hubungan antara kata-kata gantinya tidak pasti. Teks utama menyampaikan pengertian bahwa orang-orang fasik dijatuhkan oleh perkataan mereka sendiri.
    reason: alternative_reading
  - marker: b
    text: Kata kerja Ibrani ini juga dapat diterjemahkan “menggelengkan kepala sebagai ejekan,” “gemetar,” atau, dalam konteks tertentu, “melarikan diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: membuat mereka tersandung
  rationale: Bentuk Hifil dari כשׁל berarti ‘membuat tersandung/jatuh’. Akhiran katanya secara morfologis berbentuk orang ketiga tunggal maskulin (‘dia/itu’), tetapi susunan kalimat Ibraninya sulit dan konteks puitis menunjuk secara kolektif kepada orang-orang fasik. Bentuk jamak menghasilkan makna yang koheren tanpa menghilangkan kesulitan teks, yang dijelaskan dalam catatan kaki.
- source_word: עָלֵימוֹ
  choice: mereka
  rationale: Kata depan על dengan akhiran pronominal dapat berarti ‘atas mereka’ atau ‘melawan mereka’. Dalam baris puitis yang padat ini, dayanya tercakup secara alami dalam gambaran bahwa lidah mereka menyebabkan kejatuhan mereka.
- source_word: לְשׁוֹנָם
  choice: lidah mereka sendiri
  rationale: Kata konkret ‘lidah’ dipertahankan sebagai gambaran bagi perkataan. ‘Sendiri’ memperjelas bahwa perkataan mereka menjadi sarana kejatuhan mereka.
- source_word: יִתְנֹדֲדוּ
  choice: menggeleng-gelengkan kepala
  rationale: נוד dapat menggambarkan gerakan menggoyang, mengembara, atau menjauh. Dengan subjek ‘semua orang yang melihat mereka’, ungkapan ini paling wajar dipahami sebagai gerak kepala yang menyatakan keheranan, celaan, atau rasa ngeri; alternatif leksikal dicatat.
- source_word: כָּל רֹאֵה בָם
  choice: semua orang yang melihat mereka
  rationale: Terjemahan langsung dari frasa partisipial yang mempertahankan cakupan universal כָּל dan objek jamaknya.
