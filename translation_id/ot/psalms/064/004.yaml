translation_notes:
  register: 'Bahasa Indonesia modern, ringkas, dan puitis. ''Memanah'' dipilih agar citra serangan kuno jelas dan tidak disalahpahami sebagai penggunaan senjata api. Urutan penanda catatan kaki mengikuti unsur yang dijelaskannya: [a] setelah tempat persembunyian dan [b] setelah orang yang tak bercela.'
