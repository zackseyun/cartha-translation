id: PSA.64.4
reference: Psalms 64:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לִ/יר֣וֹת בַּ/מִּסְתָּרִ֣ים תָּ֑ם פִּתְאֹ֥ם יֹ֝רֻ֗/הוּ וְ/לֹ֣א יִירָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/004.yaml
  text: to shoot at the blameless from hiding places[b][a]; suddenly they shoot at him and do not fear.
translation:
  language: id
  text: untuk memanah orang yang tak bercela dari tempat persembunyian[a][b]; tiba-tiba mereka memanahnya dan tidak takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dari tempat-tempat tersembunyi"; kata Ibraninya berbentuk jamak dan preposisinya secara harfiah dapat diterjemahkan "di", tetapi konteks menggambarkan serangan dari posisi tersembunyi.
    reason: lexical_alternative
  - marker: b
    text: Atau "orang yang tidak bersalah"; istilah Ibrani ini dapat menunjuk integritas moral atau ketidakbersalahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִירוֹת
  choice: untuk memanah
  rationale: Dalam konteks serangan ini, ירה paling wajar berarti menembakkan anak panah. Bahasa Indonesia memerlukan verba yang alami; 'memanah' menyampaikan tindakan itu tanpa memberi kesan senjata api.
- source_word: בַּמִּסְתָּרִים
  choice: dari tempat persembunyian
  rationale: Nomina ini menunjuk tempat-tempat tersembunyi. Walaupun preposisinya secara harfiah berarti 'di/dalam', 'dari' secara alami menyatakan posisi asal serangan penyergapan.
- source_word: תָּם
  choice: orang yang tak bercela
  rationale: תָּם dapat menyatakan keutuhan moral atau keadaan tidak bersalah. 'Tak bercela' mempertahankan nuansa integritas moral, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: פִּתְאֹם
  choice: tiba-tiba
  rationale: Padanan adverbial baku yang menyampaikan mendadaknya serangan.
- source_word: יֹרֻהוּ
  choice: mereka memanahnya
  rationale: Sufiks orang ketiga tunggal merujuk kembali kepada orang yang tak bercela. Bentuk ini mempertahankan keringkasan teks Ibrani.
- source_word: וְלֹא יִירָאוּ
  choice: dan tidak takut
  rationale: Teks tidak menyebut objek rasa takut; terjemahan ini mempertahankan ketegasan sekaligus ambiguitas tersebut.
