  text: תַּ֭סְתִּירֵ/נִי מִ/סּ֣וֹד מְרֵעִ֑ים מֵ֝/רִגְשַׁ֗ת פֹּ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/002.yaml
  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
translation:
  language: id
  text: Sembunyikanlah aku dari perundingan rahasia orang-orang yang berbuat jahat[a], dari hiruk-pikuk para pelaku kejahatan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari rencana rahasia orang-orang yang berbuat jahat.” Kata Ibrani סוֹד dapat berarti perundingan rahasia, kelompok orang dekat, atau rencana tersembunyi.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari kerumunan yang gaduh para pelaku kejahatan.” Kata Ibrani רִגְשָׁה menyiratkan gejolak, kegaduhan, atau kerumunan yang bergolak.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: Sembunyikanlah aku
  rationale: Bentuk hifil dengan akhiran orang pertama tunggal berarti ‘sembunyikanlah aku’. Dalam konteks doa, bentuk ini paling wajar dipahami sebagai permohonan langsung kepada Allah.
- source_word: מִסּוֹד
  choice: dari perundingan rahasia
  rationale: סוֹד dapat menunjuk pada pembicaraan rahasia, kalangan dekat, atau rancangan tersembunyi. ‘Perundingan rahasia’ mempertahankan unsur kerahasiaan dan musyawarah tanpa mempersempitnya menjadi komplotan tertentu.
- source_word: מְרֵעִים
  choice: orang-orang yang berbuat jahat
  rationale: Partisip dari רעע menunjuk kepada mereka yang melakukan kejahatan. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan nuansa tindakan aktif.
- source_word: מֵרִגְשַׁת
  choice: dari hiruk-pikuk
  rationale: רִגְשָׁה menggambarkan kegaduhan, gejolak, atau kerumunan yang riuh. ‘Hiruk-pikuk’ menyampaikan suasana gaduh dan bergolak tanpa memastikan bahwa yang dimaksud semata-mata ukuran kerumunan.
- source_word: פֹּעֲלֵי אָוֶן
  choice: para pelaku kejahatan
  rationale: Frasa konstruksi ini secara harfiah menunjuk kepada orang-orang yang mengerjakan אָוֶן. ‘Para pelaku kejahatan’ jelas, alami, dan mempertahankan sifat aktif ungkapan Ibrani.
