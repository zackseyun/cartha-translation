  text: Let us come before his face with thanksgiving[a]; let us shout joyfully to him with songs.
translation:
  language: id
  text: Marilah kita datang ke hadapan-Nya dengan ucapan syukur; marilah kita bersorak-sorai kepada-Nya dengan nyanyian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקַדְּמָה
  choice: Marilah kita menghadap
  rationale: Bentuk Hifil kohortatif orang pertama jamak menyatakan ajakan untuk datang atau maju ke hadapan seseorang. 'Marilah kita menghadap' alami dalam bahasa Indonesia dan sesuai dengan objek פָנָיו.
- source_word: פָנָיו
  choice: hadirat-Nya
  rationale: Secara harfiah berarti 'wajah-Nya', tetapi dalam konstruksi ini 'wajah' merupakan idiom Ibrani bagi kehadiran pribadi. 'Menghadap hadirat-Nya' menyampaikan idiom tersebut secara wajar dan khidmat dalam bahasa Indonesia.
- source_word: בְּתוֹדָה
  choice: dengan ucapan syukur
  rationale: תּוֹדָה dapat berarti ungkapan syukur, pujian, atau persembahan syukur. Paralelisme dengan nyanyian dan sorak-sorai mendukung makna ungkapan syukur, bukan persembahan korban.
- source_word: בִּזְמִרוֹת
  choice: dengan nyanyian
  rationale: זְמִרוֹת menunjuk pada lagu atau nyanyian, kerap berupa pujian. 'Nyanyian' cukup luas, alami, dan tidak membatasi maknanya pada mazmur tertentu.
- source_word: נָרִיעַ
  choice: marilah kita bersorak-sorai
  rationale: Bentuk Hifil kohortatif orang pertama jamak dari רוע/ריע menyatakan seruan nyaring yang penuh kegembiraan. 'Bersorak-sorai' menangkap tindakan vokal dan suasana sukacita.
- source_word: לוֹ
  choice: kepada-Nya
  rationale: Preposisi ל dengan sufiks orang ketiga maskulin tunggal menunjukkan arah pujian kepada Dia.
