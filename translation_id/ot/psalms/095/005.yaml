id: PSA.95.5
reference: Psalms 95:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁר ל֣/וֹ הַ֭/יָּם וְ/ה֣וּא עָשָׂ֑/הוּ וְ֝/יַבֶּ֗שֶׁת יָדָ֥י/ו יָצָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/005.yaml
  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: id
  text: Laut adalah milik-Nya[a], sebab Dialah yang membuatnya[b], dan tangan-Nya membentuk daratan yang kering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepunyaan-Nya”; secara harfiah bahasa Ibrani berbunyi, “yang kepada-Nya [adalah] laut.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dan Dialah yang membuatnya”; kata penghubung Ibrani secara formal berarti “dan”, meskipun di sini kemungkinan menyatakan alasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לוֹ
  choice: adalah milik-Nya
  rationale: Konstruksi relatif dengan לּוֹ menyatakan kepunyaan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya posesif teks Ibrani.
- source_word: הַיָּם
  choice: laut
  rationale: Makna bakunya adalah 'laut'; 'samudra' akan lebih interpretatif.
- source_word: וְהוּא
  choice: sebab Dialah
  rationale: וְ secara formal berarti 'dan', tetapi hubungan antarklausa kemungkinan bersifat kausal. 'Dialah' mempertahankan pronomina yang eksplisit sekaligus penekanannya.
- source_word: עָשָׂהוּ
  choice: yang membuatnya
  rationale: Verba עשה lazim berarti 'membuat', dan sufiks orang ketiga tunggal merujuk kepada laut.
- source_word: וְיַבֶּשֶׁת
  choice: dan daratan yang kering
  rationale: יַבֶּשֶׁת menunjuk pada tanah atau daratan kering sebagai lawan laut. Bentuk 'daratan yang kering' jelas dan mempertahankan kontras tersebut.
- source_word: יָדָיו
  choice: tangan-Nya
  rationale: Ungkapan antropomorfis dipertahankan sebagai citraan puitis dan tidak diratakan menjadi sekadar 'Ia' atau 'kuasa-Nya'.
- source_word: יָצָרוּ
  choice: membentuk
  rationale: יצר menyampaikan gagasan membentuk dengan sengaja. Pilihan ini juga mempertahankan variasi leksikal dari עשה, 'membuat'.
theological_decisions:
- issue: Bahasa antropomorfis tentang tindakan ilahi
  choice: Mempertahankan 'tangan-Nya membentuk' sebagai antropomorfisme puitis
  alternative: Ia membentuk; kuasa-Nya membentuk
  rationale: Teks Ibrani secara eksplisit menyebut tangan Allah. Mempertahankan citraan ini menghormati bentuk puisi tanpa memaksakan penjelasan doktrinal.
- issue: Perbedaan verba penciptaan עשה dan יצר
  choice: 'Menerjemahkannya dengan dua verba berbeda: ''membuat'' dan ''membentuk'''
  alternative: membuat ... membuat; membentuk ... membentuk
  rationale: Dua verba berbeda menjaga variasi leksikal dan kesejajaran puitis teks sumber tanpa melebih-lebihkan perbedaan teologisnya.
- issue: Hubungan logis yang dinyatakan oleh וְהוּא
  choice: Menampilkan hubungan kausal dengan 'sebab Dialah'
  alternative: dan Dialah
  rationale: Walaupun וְ secara formal bersifat koordinatif, konteks menjadikan tindakan penciptaan sebagai dasar kepemilikan. Catatan kaki mempertahankan kemungkinan terjemahan formal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Huruf kapital pada sufiks yang merujuk kepada Allah mengikuti kebiasaan ortografis Alkitab bahasa Indonesia. Susunan kalimat menjaga kesejajaran antara laut dan daratan serta mempertahankan citraan 'tangan-Nya'.
