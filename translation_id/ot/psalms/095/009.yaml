  text: אֲשֶׁ֣ר נִ֭סּוּ/נִי אֲבוֹתֵי/כֶ֑ם בְּ֝חָנ֗וּ/נִי גַּם רָא֥וּ פָעֳלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/009.yaml
  text: where your fathers tested me and tried me[b][a], though they had seen my work.
translation:
  language: id
  text: di tempat leluhurmu menguji dan mencobai Aku,[a] sekalipun mereka telah melihat karya-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di tempat leluhurmu menguji Aku; mereka mencobai Aku dan juga melihat karya-Ku.” Bahasa Ibrani juga dapat diterjemahkan lebih harfiah demikian; teks utama menampilkan hubungan konsesif yang mungkin dimaksudkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: tempat
  rationale: Partikel relatif ini menunjuk kembali pada lokasi yang disebut dalam ayat sebelumnya; dalam bahasa Indonesia, “tempat” mengalir alami dalam lanjutan kalimat.
- source_word: נִסּוּנִי
  choice: menguji Aku
  rationale: נסה berarti menguji atau mencoba; “menguji Aku” mempertahankan tindakan menempatkan Allah pada ujian.
- source_word: אֲבוֹתֵיכֶם
  choice: leluhurmu
  rationale: Secara harfiah berarti “bapa-bapamu”, tetapi “leluhurmu” lebih alami dalam bahasa Indonesia modern dan tetap merujuk kepada generasi pendahulu umat yang disapa.
- source_word: בְּחָנוּנִי
  choice: mencobai Aku
  rationale: בחן sejajar dengan נסה dalam arti menguji atau membuktikan. “Mencobai” membedakan kedua verba tanpa menghilangkan kesejajarannya.
- source_word: גַּם
  choice: sekalipun
  rationale: 'Walaupun arti dasarnya dapat berupa “juga” atau “bahkan”, konteks mendukung hubungan konsesif: mereka menguji Allah meskipun telah menyaksikan karya-Nya.'
- source_word: רָאוּ
  choice: telah melihat
  rationale: Bentuk perfektif menunjukkan tindakan yang sudah dialami; “telah melihat” memperjelas bahwa pengalaman itu mendahului atau menjadi latar bagi pengujian mereka.
- source_word: פָעֳלִי
  choice: karya-Ku
  rationale: פעל menunjuk pada pekerjaan atau perbuatan. Bentuk tunggal “karya-Ku” dekat dengan teks dan dapat mencakup seluruh tindakan Allah.
theological_decisions:
- issue: Daya konsesif klausa terakhir
  choice: sekalipun mereka telah melihat karya-Ku
  alternative: mereka juga melihat karya-Ku
  rationale: גַּם secara leksikal dapat berarti “juga”, tetapi konteks teguran paling mungkin menyatakan bahwa leluhur itu menguji Allah meskipun telah menyaksikan karya-Nya. Alternatif yang lebih harfiah dicatat agar ambiguitas Ibrani tetap terlihat.
- issue: Penerjemahan אֲבוֹתֵיכֶם
  choice: leluhurmu
  alternative: bapa-bapamu
  rationale: Kata Ibrani berbentuk maskulin dan secara harfiah berarti “bapa-bapamu”. Namun, dalam pemakaian ini kata tersebut menunjuk kepada generasi pendahulu; “leluhurmu” menyampaikan rujukan itu secara wajar tanpa mengubah identitas kelompok yang dimaksud.
translation_notes:
  register: Bahasa puitis yang ringkas, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai konvensi umum Alkitab bahasa Indonesia. “Menguji dan mencobai” mempertahankan dua verba Ibrani yang sejajar.
