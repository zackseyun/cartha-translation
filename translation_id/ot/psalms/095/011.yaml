  text: so I swore in my anger[b][a], ‘They shall not enter my rest.’
translation:
  language: id
  text: Maka dalam murka-Ku Aku bersumpah[a], “Mereka tidak akan masuk ke dalam perhentian-Ku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah memakai rumusan, “jika mereka masuk ke dalam perhentian-Ku”; sesudah suatu sumpah, rumusan ini berarti, “mereka tidak akan masuk ke dalam perhentian-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tempat peristirahatan-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Maka
  rationale: Dalam konteks ini kata tersebut menghubungkan pernyataan ini dengan pemberontakan yang disebut sebelumnya dan menyatakan akibatnya. “Maka” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: נִשְׁבַּעְתִּי
  choice: Aku bersumpah
  rationale: Bentuk Nifal dari שבע lazim berarti bersumpah atau mengucapkan sumpah. “Aku bersumpah” merupakan padanan langsung dan wajar.
- source_word: בְאַפִּי
  choice: dalam murka-Ku
  rationale: אַף secara harfiah berkaitan dengan hidung, tetapi secara idiomatis menyatakan kemarahan. “Murka” sesuai dengan konteks penghakiman ilahi dan mempertahankan ragam bahasa yang bermartabat.
- source_word: אִם
  choice: tidak akan
  rationale: Sesudah pernyataan bersumpah, אִם merupakan rumusan sumpah eliptis yang secara harfiah berbunyi “jika mereka masuk,” tetapi berdaya makna penyangkalan tegas. Negasi perlu dinyatakan agar maknanya jelas dalam bahasa Indonesia.
- source_word: יְבֹאוּן אֶל
  choice: masuk ke dalam
  rationale: Gabungan בוא dengan אֶל menyatakan gerak masuk menuju atau ke dalam sesuatu. “Masuk ke dalam” alami dalam bahasa Indonesia dan mempertahankan unsur arah pada preposisinya.
- source_word: מְנוּחָתִי
  choice: perhentian-Ku
  rationale: מְנוּחָה dapat menunjuk pada keadaan beristirahat maupun tempat peristirahatan. “Perhentian-Ku” tetap ringkas dan tidak mempersempit makna hanya kepada keadaan atau hanya kepada tempat.
theological_decisions:
- issue: Rumusan sumpah eliptis dengan אִם
  choice: 'Negasi dinyatakan secara eksplisit: “Mereka tidak akan masuk.”'
  alternative: 'Terjemahan harfiah: “Jika mereka masuk.”'
  rationale: Dalam rumusan sumpah Ibrani, klausa dengan אִם mengandung penyangkalan yang tegas. Menyatakan “tidak akan” mengungkapkan daya makna rumusan itu tanpa menambahkan kesimpulan teologis.
- issue: Cakupan makna מְנוּחָה
  choice: perhentian-Ku
  alternative: tempat peristirahatan-Ku
  rationale: Istilah sumber dapat mengacu pada keadaan istirahat dan pada tempat menetap dengan tenteram. Pilihan ini mempertahankan ketegangan makna tersebut serta tidak membatasi gema teologisnya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Murka” dipakai untuk konteks penghakiman ilahi, sedangkan “perhentian” mempertahankan keluasan makna sumber dan gema antarteksnya.
