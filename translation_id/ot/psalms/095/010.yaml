  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַרְבָּ֘עִ֤ים שָׁנָ֨ה אָ֘ק֤וּט בְּ/ד֗וֹר וָ/אֹמַ֗ר עַ֤ם תֹּעֵ֣י לֵבָ֣ב הֵ֑ם וְ֝/הֵ֗ם לֹא יָדְע֥וּ דְרָכָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: id
  text: Selama empat puluh tahun Aku muak terhadap angkatan itu[a] dan berkata, “Mereka adalah bangsa yang hatinya tersesat, dan mereka tidak mengenal jalan-jalan-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku berduka karena angkatan itu” atau “Aku jemu terhadap angkatan itu.” Kata kerja Ibrani ini dapat mengungkapkan rasa muak, kejenuhan, atau dukacita; teks utama memakai ungkapan yang lebih kuat sesuai dengan konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: Selama empat puluh tahun
  rationale: Kata “selama” menyatakan rentang waktu secara alami dalam bahasa Indonesia dan mempertahankan penempatan keterangan waktu di awal ayat.
- source_word: אָקוּט
  choice: Aku muak terhadap
  rationale: Kata kerja קוט mengungkapkan rasa jijik, jemu, atau dukacita yang mendalam. “Muak terhadap” mempertahankan kuatnya ketidaksenangan ilahi dalam konteks ini tanpa mempersempit maknanya menjadi kemarahan semata.
- source_word: בְּדוֹר
  choice: terhadap angkatan itu
  rationale: Preposisi ב mengikuti kata kerja yang menyatakan sikap emosional dan secara idiomatis diterjemahkan “terhadap”. “Angkatan itu” menunjuk pada kelompok manusia pada masa pengembaraan di padang gurun.
- source_word: עַם
  choice: bangsa
  rationale: Nomina kolektif עַם secara wajar diterjemahkan “bangsa” dalam bahasa Indonesia dan mempertahankan penilaian terhadap kelompok tersebut sebagai satu kesatuan.
- source_word: תֹּעֵי לֵבָב
  choice: yang hatinya tersesat
  rationale: Partisip תֹּעֵי menggambarkan keadaan atau kecenderungan yang terus berlangsung, sedangkan לֵבָב menunjuk pada batin, kehendak, dan pemikiran. Susunan ini alami dalam bahasa Indonesia serta mempertahankan metafora Ibraninya.
- source_word: לֹא יָדְעוּ דְרָכָי
  choice: mereka tidak mengenal jalan-jalan-Ku
  rationale: ידע diterjemahkan “mengenal”, yang dapat mencakup pengenalan berdasarkan pengalaman, bukan hanya pengetahuan intelektual. Bentuk lampau Ibrani di sini menyatakan penilaian yang sudah tetap; bentuk Indonesia tanpa penandaan kala mempertahankan keluwesan aspek tersebut.
- source_word: וָאֹמַר
  choice: dan berkata
  rationale: Terjemahan langsung ini mempertahankan urutan reaksi dan pernyataan ilahi tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Sikap ilahi yang diungkapkan oleh קוט
  choice: Ungkapan kuat berupa rasa muak atau ketidaksenangan mendalam (“Aku muak terhadap”)
  alternative: Ungkapan yang lebih lunak berupa dukacita atau kejengkelan (“Aku berduka karena” / “Aku jemu terhadap”)
  rationale: Rentang makna kata Ibrani mencakup rasa muak, kejenuhan, dan dukacita. Teks utama mempertahankan daya keras teguran dalam konteks pemberontakan yang berkepanjangan, sementara catatan kaki menjaga alternatif leksikal yang sungguh mungkin.
- issue: Makna לֹא יָדְעוּ דְרָכָי
  choice: Kegagalan mengenal jalan-jalan Allah (“mereka tidak mengenal jalan-jalan-Ku”)
  alternative: Kegagalan memahami jalan-jalan Allah (“mereka tidak memahami jalan-jalan-Ku”)
  rationale: Kata ידע terutama berarti “mengenal/mengetahui” dan dapat memuat unsur pengalaman serta relasi. “Mengenal” mempertahankan keluasan itu tanpa membatasinya pada pemahaman mental.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada kata ganti ilahi mengikuti konvensi penerjemahan Alkitab bahasa Indonesia. “Jalan-jalan-Ku” mempertahankan bentuk jamak dan metafora sumber; “angkatan” dipilih karena lebih tepat untuk generasi sezaman daripada “generasi” dalam register ayat ini.
