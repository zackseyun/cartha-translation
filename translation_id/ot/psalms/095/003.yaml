  text: כִּ֤י אֵ֣ל גָּד֣וֹל יְהוָ֑ה וּ/מֶ֥לֶךְ גָּ֝ד֗וֹל עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/003.yaml
  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: id
  text: 'Sebab Yahweh adalah Allah yang besar,

    dan Raja yang besar mengatasi semua ilah.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengatasi semua makhluk ilahi.” Kata Ibrani אֱלֹהִים dapat merujuk kepada ilah-ilah atau makhluk-makhluk ilahi, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ajakan untuk menyembah pada ayat sebelumnya dan mempertahankan hubungan kausal.
- source_word: אֵל
  choice: Allah
  rationale: Di sini kata tersebut menyatakan bahwa Yahweh adalah Allah; bentuk "Allah" alami dalam bahasa Indonesia untuk menyebut Allah Israel.
- source_word: גָּדוֹל
  choice: besar
  rationale: Pilihan ini mempertahankan arti dasar serta pengulangan yang sejajar dalam kedua bagian ayat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: וּמֶלֶךְ
  choice: dan Raja
  rationale: Konjungsi menghubungkan predikat kedua tentang Yahweh; huruf kapital menandai gelar yang merujuk kepada-Nya.
- source_word: עַל
  choice: mengatasi
  rationale: Dalam konteks perbandingan ini, kata tersebut menyatakan keunggulan dan supremasi, bukan terutama posisi ruang.
- source_word: כָּל אֱלֹהִים
  choice: semua ilah
  rationale: '"Ilah" mempertahankan bentuk jamak dan ketegangan teks tanpa menentukan apakah yang dimaksud ialah dewa-dewa, berhala, atau makhluk ilahi.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna אֱלֹהִים dalam ungkapan supremasi
  choice: ilah
  alternative: makhluk-makhluk ilahi
  rationale: '"Ilah" mempertahankan ungkapan komparatif dan ketegangan teologis teks tanpa menetapkan identitas atau hakikat semua yang dirujuk.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Susunan dua baris mempertahankan kesejajaran puisi serta pengulangan "besar". "Mengatasi" dipilih untuk menyatakan supremasi dengan alami.
