  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
translation:
  language: id
  text: Marilah kita sujud menyembah dan bertekuk lutut; marilah kita berlutut[a] di hadapan Yahweh, Pembuat kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akar kata Ibrani ini dapat berarti “memberkati” dalam bentuk kata kerja lain, tetapi bentuk dan konteksnya di sini paling mungkin berarti “berlutut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: Marilah
  rationale: Imperatif jamak ini mengundang umat untuk bersama-sama mendekat dan beribadah; “Marilah” merupakan ajakan liturgis yang alami dalam bahasa Indonesia.
- source_word: נִשְׁתַּחֲוֶה
  choice: kita sujud menyembah
  rationale: Kata kerja ini menunjuk pada tindakan merendahkan tubuh atau bersujud di hadapan pihak yang dihormati, khususnya dalam ibadah. Ungkapan ini mempertahankan tindakan jasmani sekaligus maksud penyembahannya.
- source_word: וְנִכְרָעָה
  choice: dan bertekuk lutut
  rationale: Kata kerja ini berarti merendahkan badan atau berlutut. “Bertekuk lutut” membedakannya secara wajar dari kata kerja berikutnya sambil mempertahankan gambaran sikap tubuh.
- source_word: נִבְרְכָה
  choice: marilah kita berlutut
  rationale: Bentuk ini paling wajar dipahami sebagai kohortatif Qal dari ברך, “berlutut,” bukan bentuk Piel yang berarti “memberkati.” Paralelisme dengan sujud dan bertekuk lutut serta frasa “di hadapan” mendukung arti jasmani ini.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini menyatakan bahwa tindakan tersebut dilakukan dalam kehadiran Yahweh; “di hadapan” tepat dan alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: עֹשֵׂנוּ
  choice: Pembuat kita
  rationale: Partisip dengan akhiran orang pertama jamak berarti “Dia yang membuat kita” atau “Pembuat kita.” Pilihan ini ringkas dan mempertahankan hubungan langsung antara Yahweh dan umat yang dijadikan-Nya.
theological_decisions:
- issue: Arti נִבְרְכָה dalam konteks ibadah
  choice: marilah kita berlutut
  alternative: marilah kita memberkati/memuji
  rationale: Akar ברך dapat berkaitan dengan “berlutut” dalam Qal dan “memberkati” dalam Piel. Bentuk morfologis di sini dan rangkaian tiga sikap tubuh—sujud, bertekuk lutut, dan berlutut—mendukung arti “berlutut,” meskipun terjemahan alternatif dicatat karena kemiripan bentuk leksikalnya.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi ilahi, bukan sekadar gelar. Transliterasi “Yahweh” mempertahankan hal itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada liturgis. Pengulangan gagasan bertekuk lutut/berlutut dipertahankan karena mencerminkan rangkaian kata kerja Ibrani, bukan diratakan menjadi satu tindakan umum.
