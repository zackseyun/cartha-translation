base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/008.yaml
  text: Do not harden your hearts as at Meribah[d][c][b][a], as on the day at Massah in the wilderness.
translation:
  language: id
  text: Jangan keraskan hati kalian seperti di Meriba[a], seperti pada hari di Masa[b] di padang belantara.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba berarti “pertengkaran” atau “perselisihan”.
    reason: lexical_alternative
  - marker: b
    text: Masa berarti “pengujian”.
    reason: lexical_alternative
  - marker: c
    text: Lihat Keluaran 17:7 dan Bilangan 20:13 mengenai peristiwa-peristiwa di padang belantara yang disinggung di sini.
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  choice: Jangan keraskan
  rationale: Partikel larangan אַל dengan bentuk verbal orang kedua jamak menyatakan larangan langsung; bentuk Hifil dari קשׁה berarti membuat keras atau mengeraskan.
- source_word: לְבַבְכֶם
  choice: hati kalian
  rationale: Nomina 'hati' berbentuk tunggal dengan sufiks orang kedua maskulin jamak. Bahasa Indonesia secara alami mempertahankan nomina tunggal distributif sambil menyatakan penerima jamak melalui 'kalian'.
- source_word: כִּמְרִיבָה
  choice: seperti di Meriba
  rationale: מְרִיבָה dapat berarti pertengkaran, tetapi dalam konteks ini menunjuk pada nama tempat/peristiwa Meriba. Preposisi 'di' membuat rujukan tempat itu alami dalam bahasa Indonesia.
- source_word: כְּיוֹם מַסָּה
  choice: seperti pada hari di Masa
  rationale: כְּיוֹם menyatakan perbandingan temporal, sedangkan מַסָּה dipertahankan sebagai nama tempat. Ungkapan ini juga menjaga kemungkinan bahwa yang dimaksud ialah hari ketika peristiwa di Masa terjadi.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk kawasan liar dan tidak berpenghuni dalam latar perjalanan Israel; 'padang belantara' lebih luas daripada 'gurun' dan tetap mudah dipahami.
theological_decisions:
- issue: Apakah מְרִיבָה dan מַסָּה diterjemahkan sebagai nomina umum atau nama historis
  choice: Keduanya dipertahankan sebagai nama, 'Meriba' dan 'Masa'.
  alternative: “seperti dalam pertengkaran, seperti pada hari pengujian di padang belantara”
  rationale: Konteks mengacu pada peristiwa tertentu dalam perjalanan Israel di padang belantara. Mempertahankan nama menjaga hubungan antarteks tanpa menutup permainan makna Ibraninya, yang dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk memperlihatkan bahwa larangan ditujukan kepada komunitas. Diksi dibuat lugas dan bermartabat; nama-nama historis dipertahankan, sedangkan makna leksikalnya diberikan dalam catatan kaki.
