  text: לְ֭כוּ נְרַנְּנָ֣ה לַ/יהוָ֑ה נָ֝רִ֗יעָה לְ/צ֣וּר יִשְׁעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/001.yaml
  text: Come[a], let us sing for joy to Yahweh; let us shout aloud to the Rock of our salvation.
translation:
  language: id
  text: Mari, kita bernyanyi dengan sukacita kepada Yahweh[a]; mari kita bersorak nyaring kepada Batu Karang keselamatan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (יהוה), nama ilahi yang secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dan terjemahan tradisionalnya tanpa menghapus nama itu dari teks utama.
lexical_decisions:
- source_word: לְכוּ
  choice: Mari
  rationale: Imperatif jamak dari הלך dipakai secara idiomatis sebagai ajakan. Dalam bahasa Indonesia, “Mari” menyampaikan daya ajakan dengan alami tanpa arti harfiah “pergilah” yang tidak sesuai konteks.
- source_word: נְרַנְּנָה
  choice: kita bersorak-sorai
  rationale: Bentuk kohortatif jamak dari רנן menunjuk pada pujian vokal yang penuh kegembiraan. “Bersorak-sorai” mempertahankan unsur sukacita dan suara, tanpa mengharuskan makna menyanyi yang tidak selalu melekat secara sempit pada verba ini.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai pihak yang menjadi tujuan pujian, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian itu tetap tampak.
- source_word: נָרִיעָה
  choice: mari kita bersorak nyaring
  rationale: Bentuk kohortatif dari ריע menyatakan seruan keras dalam ibadah atau kemenangan. “Bersorak nyaring” menyampaikan kekuatan vokal dan publik dari tindakan tersebut.
- source_word: לְצוּר
  choice: kepada Gunung Batu
  rationale: צוּר secara harfiah berarti batu karang dan di sini menjadi metafora ilahi tentang kekokohan, perlindungan, dan kekuatan. “Gunung Batu” merupakan ungkapan Indonesia yang bermartabat dan lazim untuk metafora ini.
- source_word: יִשְׁעֵנוּ
  choice: keselamatan kita
  rationale: Nomina יֵשַׁע dengan sufiks orang pertama jamak dipertahankan sebagai nomina “keselamatan kita”, sehingga keluasan makna pembebasan tidak dipersempit menjadi parafrasa verbal.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama ilahi dalam teks utama dan tidak menggantinya dengan gelar.
- issue: Metafora ilahi צוּר
  choice: Gunung Batu keselamatan kita
  alternative: Batu Karang keselamatan kita; Dia yang menyelamatkan kita
  rationale: Metafora nominal sumber dipertahankan agar gambaran tentang Allah sebagai dasar yang kokoh dan pelindung tidak diubah menjadi pernyataan verbal yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan ajakan serta kesejajaran dua baris Ibrani dipertahankan; “bersorak-sorai” dan “bersorak nyaring” membedakan nuansa kedua verba vokal.
