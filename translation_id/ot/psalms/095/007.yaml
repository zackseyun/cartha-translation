base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/007.yaml
  text: For he is our God[a], and we are the people of his pasture, and the sheep of his hand. Today, if you hear his voice—
translation:
  language: id
  text: Sebab Dialah Allah kita, dan kitalah umat gembalaan-Nya serta kawanan domba yang dituntun oleh tangan-Nya. Hari ini, jika[a] kamu mendengar suara-Nya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hari ini, sekiranya kamu mau mendengar suara-Nya!” Partikel Ibrani yang diterjemahkan “jika” juga dapat mengungkapkan harapan atau desakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memberikan alasan bagi ajakan beribadah dalam ayat-ayat sebelumnya; bentuk ini alami dan mempertahankan hubungan penjelas-kausal.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Menerjemahkan nomina dengan sufiks orang pertama jamak secara langsung dan wajar dalam bahasa Indonesia.
- source_word: עַם מַרְעִיתוֹ
  choice: umat gembalaan-Nya
  rationale: Mempertahankan metafora penggembalaan dan hubungan konstruksi Ibrani, sekaligus memakai ungkapan Indonesia yang ringkas dan bermartabat.
- source_word: צֹאן יָדוֹ
  choice: kawanan domba dalam tangan-Nya
  rationale: Mempertahankan unsur kawanan/domba dan tangan secara konkret; 'dalam tangan-Nya' menyampaikan pemeliharaan dan kuasa tanpa menjabarkan metafora secara berlebihan.
- source_word: הַיּוֹם
  choice: Hari ini
  rationale: Padanan langsung yang berfungsi sebagai engsel retoris menuju peringatan berikutnya.
- source_word: אִם
  choice: jika
  rationale: Mempertahankan bentuk bersyarat yang secara alami mengantar larangan pada ayat berikutnya, tanpa menghapus kemungkinan nuansa harapan atau desakan.
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: kamu mendengar suara-Nya
  rationale: שׁמע dapat berarti mendengar, menyimak, atau menaati. 'Mendengar' mempertahankan keluasan makna sumber dan membiarkan tuntutan ketaatan muncul dari konteks.
theological_decisions:
- issue: Daya ungkap הַיּוֹם אִם בְּקֹלוֹ תִשְׁמָעוּ
  choice: 'Diterjemahkan sebagai pembukaan bersyarat sekaligus mendesak: “Hari ini, jika kamu mendengar suara-Nya—”'
  alternative: “Hari ini, sekiranya kamu mau mendengar suara-Nya!”
  rationale: אִם lazim menandai syarat, dan di sini klausa tersebut mengantar larangan pada ayat 8. Namun, dalam puisi dan nasihat partikel itu juga dapat menyatakan harapan atau desakan; kemungkinan tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Tanda pisah di akhir mempertahankan kesinambungan kalimat menuju ayat 8.
