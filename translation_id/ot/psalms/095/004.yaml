translation:
  language: id
  text: Di tangan-Nya ada kedalaman bumi, dan ketinggian gunung-gunung adalah milik-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan puncak-puncak gunung adalah milik-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Dalam tangan-Nya
  rationale: Klausa relatif ini merujuk kepada TUHAN pada ayat sebelumnya. Ungkapan konkret Ibrani dipertahankan sebagai gambaran kepemilikan dan kekuasaan berdaulat.
- source_word: מֶחְקְרֵי
  choice: tempat-tempat terdalam
  rationale: Kata ini menunjuk pada tempat yang sukar diselidiki atau dijangkau. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kontras vertikal dengan puncak gunung.
- source_word: אָרֶץ
  choice: di bumi
  rationale: Dalam konteks pujian kosmis ini, 'bumi' lebih tepat daripada 'tanah' dan menyatakan cakupan seluruh ciptaan.
- source_word: וְתוֹעֲפוֹת
  choice: puncak-puncak
  rationale: Istilah ini dapat menunjuk pada ketinggian atau bagian yang menjulang. 'Puncak-puncak' memberi gambaran alam yang jelas tanpa mengubah penegasan kepemilikan.
- source_word: הָרִים
  choice: gunung
  rationale: Bentuk jamak Ibrani diungkapkan melalui pengulangan pada 'puncak-puncak' sehingga frasa Indonesia tetap alami.
- source_word: לוֹ
  choice: adalah milik-Nya
  rationale: Menyatakan kepemilikan secara ringkas dan jelas, sejalan dengan predikat posesif Ibrani.
theological_decisions:
- issue: Cakupan kepemilikan ilahi dalam gambaran penciptaan
  choice: Pernyataan kosmis bahwa TUHAN menguasai bagian bumi yang terdalam maupun puncak gunung yang tertinggi.
  alternative: Rujukan yang lebih terbatas pada tanah Israel dan bentang alamnya.
  rationale: Pasangan tempat terdalam dan puncak gunung merupakan gambaran merismik tentang seluruh ciptaan, sesuai dengan seruan universal untuk menyembah dalam konteks mazmur.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. Citra konkret 'dalam tangan-Nya' dipertahankan, sedangkan susunan klausa dibuat alami dalam bahasa Indonesia.
