source:
  edition: WLC
  text: כִּ֤י מֶ֖לֶךְ כָּל הָ/אָ֥רֶץ אֱלֹהִ֗ים זַמְּר֥וּ מַשְׂכִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: id
  text: Sebab Allah adalah Raja atas seluruh bumi; bermazmurlah dengan penuh pengertian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bermazmurlah dengan terampil”; mungkin juga “nyanyikanlah sebuah Maskil,” yaitu istilah musikal atau sastra yang maknanya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi ajakan memuji dalam konteks sebelumnya dan mempertahankan daya kausal/penjelas teks Ibrani.
- source_word: מֶלֶךְ כָּל־הָאָרֶץ
  choice: Raja atas seluruh bumi
  rationale: Mengungkapkan pemerintahan Allah yang meliputi seluruh bumi. Kata depan 'atas' lebih alami dalam bahasa Indonesia ketika menyatakan lingkup kekuasaan seorang raja, tanpa mempersempit cakupan universal frasa Ibrani.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk tersebut bermakna tunggal dan menunjuk kepada Allah Israel; 'Allah' adalah padanan baku dan langsung dalam bahasa Indonesia.
- source_word: זַמְּרוּ
  choice: bermazmurlah
  rationale: Bentuk perintah jamak dari זמר menyerukan nyanyian pujian dengan iringan atau nuansa musikal. 'Bermazmurlah' ringkas, bermartabat, dan mempertahankan konteks pujian.
- source_word: מַשְׂכִּיל
  choice: dengan penuh pengertian
  rationale: Mempertahankan kemungkinan fungsi adverbial yang berkaitan dengan pengertian atau wawasan, sambil mencatat kemungkinan makna keterampilan maupun istilah musikal-sastra dalam catatan kaki.
theological_decisions:
- issue: Cakupan pemerintahan Allah sebagai Raja
  choice: Allah dinyatakan sebagai Raja atas seluruh bumi.
  alternative: Frasa itu dapat diterjemahkan secara lebih harfiah sebagai 'Raja seluruh bumi', dengan אֶרֶץ kadang dapat berarti 'negeri'.
  rationale: Dalam konteks mazmur, frasa כָּל־הָאָרֶץ secara alami menyatakan cakupan universal. Terjemahan tidak mempersempitnya menjadi satu negeri dan tidak menambahkan klaim doktrinal di luar teks.
- issue: Makna מַשְׂכִּיל dalam perintah untuk bermazmur
  choice: Frasa utama memakai makna adverbial 'dengan penuh pengertian'.
  alternative: Kata itu dapat berarti 'dengan terampil' atau menunjuk pada 'Maskil', suatu istilah musikal atau sastra.
  rationale: Bentuk dan fungsi tepat kata ini diperdebatkan. Teks utama memberikan bacaan yang alami, sedangkan catatan kaki mempertahankan ambiguitas leksikal yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada liturgis tanpa menjadi usang. 'Bermazmurlah' dipilih sebagai ungkapan ringkas untuk nyanyian pujian; ambiguitas מַשְׂכִּיל dipertahankan melalui catatan kaki.
