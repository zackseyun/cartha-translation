  source_fidelity: 'Teks Indonesia menerjemahkan unsur-unsur Ibrani dengan setia: נְדִיבֵי עַמִּים sebagai “Para bangsawan dari bangsa-bangsa,” נֶאֱסָפוּ sebagai “telah berkumpul,” dan מָגִנֵּי אֶרֶץ secara harfiah sebagai “perisai-perisai bumi.” “Sebagai umat Allah Abraham” merupakan cara yang wajar untuk menangani frasa appositional yang padat tanpa menutup kemungkinan hubungan alternatif. “Sebab ... adalah milik Allah” menyampaikan fungsi כִּי dan לֵאלֹהִים dengan baik. “Dia sangat ditinggikan” sesuai dengan pembacaan subjek ilahi yang didukung konteks.'
