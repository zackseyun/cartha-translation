id: PSA.47.9
reference: Psalms 47:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: id
  text: Para bangsawan dari bangsa-bangsa telah berkumpul sebagai umat Allah Abraham[a], sebab perisai-perisai bumi adalah milik Allah[b]; Dia sangat ditinggikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersama umat Allah Abraham.” Frasa Ibraninya dapat menyatakan hubungan erat ataupun identifikasi.
    reason: alternative_reading
  - marker: b
    text: Atau “para penguasa bumi”; secara harfiah, “perisai-perisai bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי
  choice: para bangsawan
  rationale: Kata ini lazim menunjuk kepada orang-orang berkedudukan tinggi, seperti bangsawan atau pemuka. “Para bangsawan” wajar dalam bahasa Indonesia dan selaras dengan gambaran para penguasa sebagai “perisai” pada bagian berikutnya.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk kepada beragam kelompok etnis atau masyarakat. “Bangsa-bangsa” merupakan ungkapan Indonesia yang alami tanpa mengharuskan pengertian negara modern.
- source_word: נֶאֱסָפוּ
  choice: telah berkumpul
  rationale: 'Bentuk Nifal di sini paling wajar dipahami secara intransitif: mereka berhimpun atau berkumpul. “Telah berkumpul” cocok dengan pernyataan mazmur ini.'
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: sebagai umat Allah Abraham
  rationale: Frasa Ibrani sangat padat dan dapat menyatakan identifikasi maupun hubungan erat. “Sebagai” menyampaikan kemungkinan bahwa para bangsawan itu dihimpun menjadi atau dikenali sebagai umat milik Allah Abraham, tanpa menghilangkan bacaan alternatif dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya. “Sebab” mempertahankan daya penjelasnya dengan ragam yang wajar dan bermartabat.
- source_word: לֵאלֹהִים
  choice: adalah milik Allah
  rationale: Prefiks ל menyatakan kepunyaan atau keterikatan. Ungkapan ini menyampaikan hubungan tersebut secara jelas dalam bahasa Indonesia.
- source_word: מָגִנֵּי אֶרֶץ
  choice: perisai-perisai bumi
  rationale: Terjemahan ini mempertahankan metafora kuat dalam teks Ibrani. Dalam konteksnya, “perisai” kemungkinan menunjuk kepada para penguasa atau pelindung, yang dicantumkan sebagai alternatif dalam catatan kaki.
- source_word: נַעֲלָה
  choice: Dia sangat ditinggikan
  rationale: Bentuk verba maskulin tunggal paling wajar merujuk kembali kepada Allah. “Ditinggikan” sesuai dengan bahasa pujian mazmur dan tidak mengubahnya menjadi tindakan naik secara harfiah.
theological_decisions:
- issue: Hubungan para bangsawan bangsa-bangsa dengan umat Allah Abraham
  choice: Mereka digambarkan berkumpul sebagai umat Allah Abraham.
  alternative: Mereka berkumpul bersama umat Allah Abraham.
  rationale: Susunan Ibrani yang padat memungkinkan identifikasi ataupun persekutuan erat. Konteks tentang pemerintahan Allah atas bangsa-bangsa mendukung pembacaan inklusif, tetapi alternatif “bersama” tetap dicatat agar ambiguitas dan ketegangan teologis teks tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora Ibrani “perisai-perisai bumi” dipertahankan dalam teks utama, sedangkan makna kiasannya dijelaskan dalam catatan kaki. Semua penanda catatan kaki ditempatkan pada frasa yang bersangkutan.
