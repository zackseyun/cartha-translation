  edition: WLC
  text: יִבְחַר לָ֥/נוּ אֶת נַחֲלָתֵ֑/נוּ אֶ֥ת גְּא֨וֹן יַעֲקֹ֖ב אֲשֶׁר אָהֵ֣ב סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/004.yaml
  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
translation:
  language: id
  text: 'Ia memilihkan bagi kita milik pusaka kita[a],

    kemegahan Yakub, yang dikasihi-Nya.[b]

    Sela.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia akan memilihkan bagi kita milik pusaka kita.”'
    reason: Bentuk verba Ibrani dapat dipahami sebagai tindakan kini atau mendatang.
  - marker: b
    text: Frasa “yang dikasihi-Nya” dapat merujuk kepada Yakub atau kepada milik pusaka/tanah itu.
    reason: Acuan klausa relatif dalam bahasa Ibrani dapat dipahami dengan lebih dari satu cara.
  - marker: c
    text: “Sela” adalah istilah liturgis atau musikal Ibrani yang artinya tidak pasti dan secara tradisional dibiarkan tanpa terjemahan.
    reason: Memberikan keterangan budaya mengenai istilah Ibrani yang tidak pasti.
lexical_decisions:
- source_word: יִבְחַר
  choice: Ia memilih
  rationale: Bentuk imperfek Qal orang ketiga tunggal dapat menyatakan tindakan yang berlangsung atau berulang, maupun tindakan mendatang. Bentuk kini cocok dengan konteks pujian atas pemerintahan dan karya Allah, sedangkan kemungkinan makna mendatang dicatat dalam catatan kaki.
- source_word: לָנוּ
  choice: bagi kita
  rationale: 'Preposisi ל dengan sufiks orang pertama jamak menyatakan manfaat atau kepentingan: Allah memilih demi umat-Nya.'
- source_word: נַחֲלָתֵנוּ
  choice: milik pusaka kita
  rationale: נחלה menunjuk pada warisan atau bagian milik yang dianugerahkan, khususnya tanah perjanjian. 'Milik pusaka' mempertahankan nuansa bagian yang diberikan sebagai kepunyaan.
- source_word: אֶת ... אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Kedua אֶת merupakan penanda objek langsung. Yang kedua memperkenalkan keterangan aposisional yang menjelaskan 'milik pusaka kita', yaitu 'kemegahan Yakub'.
- source_word: גְּאוֹן
  choice: kemegahan
  rationale: Dalam konteks positif ini, גאון berarti keagungan, kemuliaan, atau sesuatu yang dibanggakan. 'Kemegahan' menghindari kesan kesombongan moral yang dapat muncul dari kata 'keangkuhan' atau 'kebanggaan'.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama Ibrani dipertahankan. Dalam konteks ini Yakub juga berfungsi secara korporat bagi umat keturunannya, tetapi tidak diganti secara interpretatif dengan 'Israel'.
- source_word: אֲשֶׁר אָהֵב
  choice: yang dikasihi-Nya
  rationale: Ungkapan ini dapat merujuk kepada Yakub atau kepada milik pusaka/kemegahan tersebut. Bentuk relatif bahasa Indonesia secara alami mempertahankan ambiguitas itu. Perfek אָהֵב dapat mengungkapkan kasih yang tetap berlaku, sehingga bentuk kini pasif 'dikasihi-Nya' wajar.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal Ibrani ini tidak pasti artinya, sehingga ditransliterasikan tanpa memberi arti yang terlalu pasti.
theological_decisions:
- issue: Acuan frasa 'yang dikasihi-Nya'
  choice: Terjemahan utama mempertahankan bentuk relatif yang dapat dipahami terutama sebagai merujuk kepada Yakub.
  alternative: Frasa tersebut dapat merujuk kepada milik pusaka atau tanah yang dikasihi Allah.
  rationale: Yakub adalah anteseden personal yang dekat dan bahasa tentang kasih Allah kepada Yakub lazim dalam Alkitab. Namun, susunan Ibrani juga memungkinkan hubungan dengan milik pusaka/kemegahan; bahasa Indonesia dapat mempertahankan ketegangan ini tanpa memaksakan satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Milik pusaka' mempertahankan nuansa perjanjian dan pemberian tanah, sedangkan 'kemegahan' menyampaikan arti positif גאון. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
