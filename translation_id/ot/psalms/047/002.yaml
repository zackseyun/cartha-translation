  yaml_path: translation/ot/psalms/047/002.yaml
  text: For Yahweh Most High is to be feared[a], a great King over all the earth.
translation:
  language: id
  text: Sebab Yahweh, Yang Mahatinggi, patut ditakuti[a]; Dia adalah Raja agung atas seluruh bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dahsyat” atau “menggentarkan.” Kata Ibrani ini menggambarkan Yahweh sebagai Dia yang membangkitkan rasa takut penuh hormat dan ketakjuban.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi ajakan memuji dalam konteks sebelumnya dan mempertahankan hubungan kausal secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Menyampaikan gelar ilahi dengan daya superlatif dan bentuk Indonesia yang lazim serta khidmat.
- source_word: נוֹרָא
  choice: patut ditakuti
  rationale: Menjaga makna bahwa Yahweh membangkitkan rasa takut yang penuh hormat dan ketakjuban, tanpa membatasinya pada kengerian semata.
- source_word: מֶלֶךְ גָּדוֹל
  choice: Raja agung
  rationale: Mempertahankan citra kerajaan; 'agung' secara alami menekankan kebesaran dan kemuliaan sang Raja.
- source_word: עַל כָּל הָאָרֶץ
  choice: atas seluruh bumi
  rationale: Dalam konteks penobatan ilahi, frasa ini menyatakan pemerintahan universal, bukan hanya kekuasaan atas suatu negeri.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi; bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Nuansa נוֹרָא ketika dikenakan kepada Allah
  choice: patut ditakuti
  alternative: dahsyat; menggentarkan
  rationale: Pilihan ini mempertahankan ketegangan antara rasa takut, hormat, dan takjub dalam ibadah, tanpa menafsirkannya sebagai teror belaka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan khidmat. Susunan aposisional mempertahankan kepadatan puisi Ibrani, sementara 'Raja agung' dipilih agar alami bagi pembaca masa kini.
