  text: זַמְּר֣וּ אֱלֹהִ֣ים זַמֵּ֑רוּ זַמְּר֖וּ לְ/מַלְכֵּ֣/נוּ זַמֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: id
  text: Nyanyikanlah pujian bagi Allah[a], nyanyikanlah pujian; nyanyikanlah pujian bagi Raja kita, nyanyikanlah pujian!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mainkanlah musik bagi Allah ... mainkanlah musik bagi Raja kita.” Kata kerja Ibrani ini dapat menunjuk pada pujian musikal secara lebih luas, bukan hanya nyanyian.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: nyanyikanlah pujian
  rationale: Bentuk imperatif jamak dari זמר dalam konteks ibadah menyerukan pujian melalui nyanyian atau musik. Ungkapan ini mempertahankan nuansa pujian dan pengulangan empat kali dalam bahasa Ibrani.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah Israel sebagai penerima pujian; 'Allah' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: לְמַלְכֵּנוּ
  choice: bagi Raja kita
  rationale: Preposisi לְ menyatakan arah atau penerima pujian. 'Bagi' terdengar alami dengan frasa 'nyanyikanlah pujian', sedangkan 'Raja' memakai huruf kapital karena merujuk kepada Allah sebagai gelar ilahi dalam konteks mazmur.
theological_decisions:
- issue: Gelar kerajaan ilahi
  choice: Raja kita
  alternative: raja kita
  rationale: Konteks langsung mazmur merayakan pemerintahan Allah, sehingga 'Raja' diperlakukan sebagai gelar bagi Allah tanpa menambahkan doktrin di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan empat kali dipertahankan untuk mencerminkan tekanan puitis teks Ibrani; tanda seru menegaskan sifat ajakan liturgis.
