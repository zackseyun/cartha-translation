id: PSA.47.1
reference: Psalms 47:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּֽל הָ֭/עַמִּים תִּקְעוּ כָ֑ף הָרִ֥יעוּ לֵ֝/אלֹהִ֗ים בְּ/ק֣וֹל רִנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
translation:
  language: id
  text: Bertepuk tanganlah, hai segala bangsa[a]; bersoraklah kepada Allah dengan suara penuh sukacita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala suku bangsa.” Kata Ibrani עַמִּים dapat menunjuk pada kelompok-kelompok masyarakat berdasarkan identitas bersama maupun pada bangsa-bangsa dalam arti yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan bunyi sorak-sorai” atau “dengan suara sukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: hai segala bangsa
  rationale: Frasa ini mencakup seluruh kelompok bangsa secara kolektif. Sapaan “hai” membuat bentuk perintah jamak tersampaikan secara alami dalam bahasa Indonesia, sedangkan “segala bangsa” mempertahankan cakupan universal.
- source_word: תִּקְעוּ כָף
  choice: Bertepuk tanganlah
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan memukulkan telapak tangan. “Bertepuk tanganlah” adalah padanan imperatif Indonesia yang alami bagi tindakan perayaan tersebut.
- source_word: הָרִיעוּ
  choice: bersoraklah
  rationale: Bentuk perintah ini menunjuk pada seruan lantang yang bernuansa kegembiraan atau penghormatan. “Bersoraklah” menyampaikan tindakan dan nuansa itu secara ringkas.
- source_word: לֵאלֹהִים
  choice: kepada Allah
  rationale: Preposisi ל menandai arah seruan pujian; “kepada Allah” merupakan padanan langsung dan wajar.
- source_word: בְּקוֹל רִנָּה
  choice: dengan suara penuh sukacita
  rationale: קוֹל berarti “suara” atau “bunyi,” sedangkan רִנָּה menunjuk pada sukacita yang diungkapkan dengan nyaring, termasuk sorak atau nyanyian. Pilihan ini mempertahankan unsur suara dan kegembiraan tanpa mempersempitnya hanya menjadi nyanyian.
theological_decisions:
- issue: Cakupan sapaan kepada bangsa-bangsa
  choice: Ayat ini menyerukan segala bangsa secara universal untuk memuji Allah.
  alternative: Sapaan ini secara retoris hanya ditujukan kepada bangsa-bangsa di sekitar Israel.
  rationale: Teks Ibrani secara eksplisit menyebut “segala bangsa,” dan konteks mazmur tentang pemerintahan Allah mendukung cakupan universal tanpa perlu membatasinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan “hai segala bangsa” mempertahankan daya retoris seruan puitis, sementara bentuk imperatif berakhiran -lah terdengar wajar dan bermartabat.
