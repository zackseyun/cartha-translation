lexical_decisions:
- source_word: עָלָה
  choice: telah naik
  rationale: Kata kerja ini berarti ‘naik’ atau ‘bergerak ke atas’. Bentuk ‘telah naik’ menyampaikan aspek perfektif dalam pernyataan puitis tanpa memaksakan penafsiran kristologis yang lebih kemudian.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam kesejajaran dengan יְהוָה, bentuk ini menunjuk kepada Allah Israel sebagai satu pribadi.
- source_word: בִּתְרוּעָה
  choice: diiringi sorak
  rationale: תְּרוּעָה menunjuk kepada seruan atau pekik keras, khususnya dalam suasana kemenangan atau ibadah. ‘Sorak’ mempertahankan keluasan makna tanpa secara eksplisit menambahkan unsur sukacita atau peperangan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: בְּקוֹל
  choice: diiringi bunyi
  rationale: Dalam hubungan dengan שׁוֹפָר, קוֹל paling alami dipahami sebagai ‘bunyi’. ‘Diiringi’ menyatakan keadaan penyerta yang ditandai oleh preposisi בְּ.
- source_word: שׁוֹפָר
  choice: sangkakala
  rationale: שׁוֹפָר adalah terompet tanduk yang digunakan untuk memberi tanda dan dalam ibadah. ‘Sangkakala’ merupakan padanan Indonesia yang wajar dan bermartabat; bentuk khusus alatnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama itu dan menghindari penggantiannya dengan sebuah gelar.
- issue: Bahasa kenaikan yang berpotensi dibaca secara kristologis
  choice: Allah telah naik
  alternative: Allah telah terangkat atau Allah telah naik ke surga
  rationale: Mazmur menggambarkan kenaikan Allah dalam konteks kerajaan dan kemenangan-Nya. Terjemahan mempertahankan citra Ibrani tanpa menentukan tujuan kenaikan atau memasukkan penggenapan teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan ‘diiringi’ mempertahankan kesejajaran kedua bagian ayat. Penanda catatan [b] ditempatkan pada ‘sangkakala’, yaitu kata yang dijelaskan oleh catatan budaya.
