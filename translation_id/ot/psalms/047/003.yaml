  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: id
  text: Ia menundukkan bangsa-bangsa di bawah kita[a], dan bangsa-bangsa di bawah kaki kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia membawa bangsa-bangsa ke dalam ketundukan di bawah kita.” Kata kerja Ibrani di sini menyatakan tindakan menundukkan, bukan berbicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְבֵּר
  choice: menundukkan
  rationale: Bentuk kausatif ini, dengan objek bangsa-bangsa dan dalam kesejajaran dengan ungkapan “di bawah kaki kita”, berarti membawa ke dalam ketundukan, bukan berbicara. “Menundukkan” alami dan mempertahankan konteks kerajaan serta penaklukan.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak עַם menunjuk pada kelompok-kelompok masyarakat atau bangsa. Pilihan ini jelas bagi pembaca Indonesia modern.
- source_word: תַּחְתֵּינוּ
  choice: di bawah kuasa kita
  rationale: Secara harfiah berarti “di bawah kita”, tetapi dalam konteks ini menyatakan ketundukan. Penambahan “kuasa” membuat makna metaforisnya alami dalam bahasa Indonesia tanpa mengubah hubungan yang dinyatakan teks.
- source_word: וּלְאֻמִּים
  choice: dan suku-suku bangsa
  rationale: לְאֻמִּים menunjuk pada kelompok-kelompok kebangsaan. “Suku-suku bangsa” mempertahankan variasi leksikal terhadap עַמִּים dan tetap wajar dalam bahasa Indonesia.
- source_word: תַּחַת רַגְלֵינוּ
  choice: di bawah kaki kita
  rationale: Terjemahan langsung ini mempertahankan gambaran puitis tentang penaklukan dan ketundukan.
theological_decisions:
- issue: Suara korporat dan pelaku penaklukan
  choice: Allah adalah subjek yang menundukkan bangsa-bangsa di bawah kuasa umat-Nya, sementara bentuk orang pertama jamak dipertahankan sebagai “kita”.
  alternative: Pernyataan kerajaan yang digeneralisasi mengenai kemenangan militer Israel.
  rationale: Konteks langsung mazmur menghubungkan kekuasaan dan kemenangan dengan Allah. Terjemahan tidak melunakkan gambaran penaklukan dan tidak memasukkan penafsiran teologis yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dipakai untuk subjek ilahi sesuai konteks ayat sebelumnya; kesejajaran puitis dan gambaran “di bawah kaki kita” dipertahankan.
