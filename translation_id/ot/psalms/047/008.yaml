  text: מָלַ֣ךְ אֱ֭לֹהִים עַל גּוֹיִ֑ם אֱ֝לֹהִ֗ים יָשַׁ֤ב עַל כִּסֵּ֬א קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/008.yaml
  text: God reigns over the nations[a]; God sits on his holy throne.
translation:
  language: id
  text: Allah memerintah atas bangsa-bangsa[a]; Allah duduk di takhta-Nya yang kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah telah menjadi Raja atas bangsa-bangsa; Allah telah duduk di takhta-Nya yang kudus.” Verba perfek dalam bahasa Ibrani dapat dipahami sebagai penekanan pada ditegakkannya pemerintahan-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: memerintah
  rationale: Bentuk qatal dalam proklamasi puitis ini dapat menyatakan keadaan kini atau hasil yang tetap. "Memerintah" alami dalam bahasa Indonesia dan menyampaikan pemerintahan Allah sebagai Raja tanpa menambahkan kata yang tidak tersurat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk gramatikal jamak tersebut jelas menunjuk kepada satu-satunya Allah. Pengulangannya pada kedua larik dipertahankan demi penekanan.
- source_word: עַל
  choice: atas
  rationale: Bersama verba kerajaan dan objek bangsa-bangsa, preposisi ini menyatakan kekuasaan atau pemerintahan atas mereka.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Istilah ini menunjuk secara kolektif kepada berbagai bangsa. Pilihan ini netral dan tidak memasukkan konotasi teologis yang tidak dituntut oleh konteks.
- source_word: יָשַׁב
  choice: duduk
  rationale: Pilihan ini mempertahankan gambaran konkret teks Ibrani; penyebutan takhta membuat makna bersemayam sebagai Raja jelas dari konteks.
- source_word: כִּסֵּא
  choice: takhta
  rationale: Dalam konteks kerajaan ilahi, kata ini berarti takhta, bukan sekadar tempat duduk.
- source_word: קָדְשׁוֹ
  choice: takhta-Nya yang kudus
  rationale: Ungkapan harfiahnya adalah "takhta kekudusan-Nya". Susunan ini merupakan padanan Indonesia yang alami dan mempertahankan sifat kudus takhta tersebut.
theological_decisions:
- issue: Kerajaan Allah yang diungkapkan dengan verba perfek dalam puisi Ibrani
  choice: 'Proklamasi masa kini: "Allah memerintah ... Allah duduk di takhta-Nya yang kudus."'
  alternative: 'Nuansa ingresif/perfektif: "Allah telah menjadi Raja ... Allah telah duduk di takhta-Nya yang kudus."'
  rationale: Mazmur ini memaklumkan pemerintahan universal Allah dalam gaya puisi liturgis. Bentuk kini menyampaikan realitas pemerintahan-Nya secara alami, sedangkan kemungkinan nuansa penetapan atau dimulainya pemerintahan tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel serta pengulangan "Allah" dipertahankan. "Takhta-Nya yang kudus" dipilih karena lebih alami daripada bentuk harfiah "takhta kekudusan-Nya".
