lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul-judul mazmur, bentuk ini menunjuk kepada orang yang memimpin pelaksanaan musik atau nyanyian. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan fungsi liturgisnya; preposisi ל diterjemahkan “untuk”, meskipun “kepada” juga mungkin.
- source_word: לִבְנֵי
  choice: Dari bani
  rationale: Preposisi ל dalam judul mazmur dapat menyatakan hubungan, peruntukan, atau kepengarangan. “Dari bani” cukup terbuka dan tidak memastikan bahwa mereka adalah penulis atau penerima persembahan mazmur ini.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: מִזְמוֹר adalah sebutan baku bagi jenis nyanyian yang disebut mazmur; pilihan ini lebih tepat daripada istilah umum “lagu”.
