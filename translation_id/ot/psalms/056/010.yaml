id: PSA.56.10
reference: Psalms 56:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֵּֽ֭/אלֹהִים אֲהַלֵּ֣ל דָּבָ֑ר בַּ֝/יהוָ֗ה אֲהַלֵּ֥ל דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/010.yaml
  text: In God I will praise the word[a]; in Yahweh I will praise the word.
translation:
  language: id
  text: Dalam Allah aku akan memuji firman[a]; dalam Yahweh aku akan memuji firman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janji”, di kedua baris; kata Ibrani דָּבָר dapat berarti “firman”, “perkara”, atau “janji”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Dalam Allah
  rationale: Preposisi בְּ dipertahankan sebagai “dalam” untuk mengungkapkan pujian yang berpusat dan berakar pada Allah serta menjaga kesejajaran dengan בַּיהוָה.
- source_word: אֲהַלֵּל
  choice: aku akan memuji
  rationale: Bentuk piel imperfek orang pertama tunggal menyatakan tekad atau orientasi ke depan; pengulangan yang sama dipertahankan dalam kedua baris.
- source_word: דָּבָר
  choice: firman
  rationale: דָּבָר dapat berarti perkataan, perkara, atau janji. “Firman” wajar ketika menunjuk pada perkataan Allah, tetapi catatan kaki mempertahankan kemungkinan kontekstual “janji” tanpa menentukannya secara berlebihan.
- source_word: בַּיהוָה
  choice: dalam Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”, sedangkan preposisi בְּ diterjemahkan “dalam” agar paralelisme dengan “dalam Allah” tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; “Yahweh” mempertahankan nama diri dan membedakannya dari gelar ilahi.
- issue: 'Objek pujian: דָּבָר'
  choice: firman
  alternative: janji
  rationale: Teks tidak secara eksplisit membatasi דָּבָר pada janji. Teks utama mempertahankan cakupan leksikal yang lebih luas, sementara makna “janji” dicatat sebagai kemungkinan kontekstual.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Struktur dua baris serta pengulangan Ibrani dipertahankan; “aku” dipakai sesuai suara pribadi pemazmur.
