  terminology: '''Allah'', ''Yahweh'', dan ''firman'' sesuai untuk register Alkitab bahasa Indonesia. Catatan kaki dengan tepat memberi ''janji'' sebagai alternatif kontekstual bagi דָּבָר tanpa menjadikannya makna tunggal. Istilah ''perkara'' disebut sebagai rentang leksikal tambahan, sesuai sumber dan jejak audit Inggris.'
