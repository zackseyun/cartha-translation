- from: Sebab Engkau telah menyelamatkan nyawaku dari maut[a]; bukankah Engkau juga menjaga kakiku agar tidak tersandung[b], supaya aku dapat berjalan di hadapan Allah dalam terang kehidupan[c]?[d]
  to: Sebab Engkau telah menyelamatkan nyawaku dari maut[a]; bukankah Engkau juga menjaga kakiku dari kejatuhan[b], supaya aku dapat berjalan di hadapan Allah dalam terang kehidupan[c]?[d]
  rationale: 'Revisi utama memulihkan bentuk dan paralelisme Ibrani: “dari maut ... dari kejatuhan.” Verba “menjaga” tetap merupakan pelengkapan Indonesia yang wajar bagi verba yang tersirat dalam pertanyaan retoris. Catatan kaki diperbaiki agar alternatifnya idiomatis, setia pada kemungkinan leksikal, dan tidak menambahkan penafsiran teologis.'
