  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: id
  text: Sebab Engkau telah menyelamatkan nyawaku dari maut[a]; bukankah Engkau juga menjaga kakiku dari kejatuhan[b], supaya aku dapat berjalan di hadapan Allah dalam terang kehidupan[c]?[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “nyawaku” juga dapat berarti “jiwaku” atau “diriku”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dari tersandung”.
    reason: lexical_alternative
  - marker: c
    text: Atau, “dalam terang mereka yang hidup”.
    reason: lexical_alternative
  - marker: d
    text: 'Susunan lain yang mungkin: “Sebab Engkau telah menyelamatkan nyawaku dari maut—bukankah Engkau juga telah menyelamatkan kakiku dari kejatuhan?—supaya aku berjalan di hadapan Allah dalam terang kehidupan.”'
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang menyatakan dasar bagi keyakinan atau pujian sebelumnya.
- source_word: הִצַּלְתָּ
  choice: Engkau telah menyelamatkan
  rationale: Bentuk Hifil perfektif menyatakan tindakan penyelamatan yang telah dilakukan dan tetap relevan dalam konteks ucapan syukur.
- source_word: נַפְשִׁי
  choice: nyawaku
  rationale: Dalam konteks diselamatkan dari maut, נֶפֶשׁ secara alami menunjuk pada nyawa atau diri si pemazmur. Pilihan ini menghindari kesan bahwa ayat tersebut sedang menetapkan antropologi teknis; keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: מִמָּוֶת
  choice: dari maut
  rationale: Menyatakan pembebasan dari ancaman atau kuasa kematian; “maut” sesuai dengan ragam puitis yang bermartabat.
- source_word: הֲלֹא
  choice: bukankah ... juga
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban ya serta menghubungkan klausa kedua dengan penyelamatan pada klausa pertama.
- source_word: רַגְלַי
  choice: kakiku
  rationale: Mempertahankan gambaran konkret Ibrani dan berhubungan secara alami dengan tindakan berjalan.
- source_word: מִדֶּחִי
  choice: agar tidak tersandung
  rationale: דֶּחִי dapat menunjuk pada ketergelinciran, keterhuyungan, atau kejatuhan. Susunan ini alami dalam bahasa Indonesia bersama “menjaga kakiku” dan mempertahankan citra berjalan.
- source_word: לְהִתְהַלֵּךְ
  choice: supaya aku dapat berjalan
  rationale: Infinitif berawalan לְ menyatakan tujuan atau hasil; “supaya” menampilkan hubungan itu dengan jelas.
- source_word: לִפְנֵי אֱלֹהִים
  choice: di hadapan Allah
  rationale: Ungkapan ini secara harfiah berarti berada atau berjalan di hadapan Allah, yakni dalam kehadiran-Nya, tanpa menambahkan penafsiran khusus.
- source_word: בְּאוֹר הַחַיִּים
  choice: dalam terang kehidupan
  rationale: Mempertahankan metafora puitis teks Ibrani. Bentuk הַחַיִּים memungkinkan nuansa “kehidupan” dan, secara idiomatis, “orang-orang hidup”; alternatif dicatat.
theological_decisions:
- issue: Nuansa antropologis נַפְשִׁי
  choice: nyawaku
  alternative: jiwaku; diriku
  rationale: Konteks maut membuat “nyawa” paling alami, tetapi kata Ibrani tidak menetapkan pemisahan teknis antara jiwa dan tubuh. Catatan kaki mempertahankan keluasan maknanya.
- issue: Hubungan penyelamatan dengan kehidupan di hadapan Allah
  choice: Klausa tujuan diterjemahkan tanpa menentukan apakah yang dimaksud hanya kehidupan sekarang atau juga kehidupan sesudah kematian.
  alternative: Menafsirkan “terang kehidupan” secara khusus sebagai kehidupan di dunia ini atau kehidupan kekal.
  rationale: Ungkapan puitisnya dapat membawa nuansa kehidupan, keselamatan, dan kehadiran Allah; terjemahan tidak boleh mempersempitnya secara denominatif.
- issue: Daya retoris הֲלֹא dan verba yang tersirat
  choice: bukankah Engkau juga menjaga
  alternative: sungguh, Engkau telah menyelamatkan kakiku
  rationale: Bahasa Indonesia memerlukan verba untuk kelancaran, tetapi bentuk pertanyaan retoris dipertahankan. “Menjaga” melengkapi gagasan yang tersirat tanpa menghapus hubungan dengan tindakan penyelamatan pada klausa pertama.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. “Maut” serta “di hadapan Allah” mempertahankan warna mazmur tanpa menjadi arkais. Pertanyaan retoris dan hubungan tujuan dipertahankan; semua alternatif penting dicatat tanpa memaksakan kesimpulan teologis.
