  yaml_path: translation/ot/psalms/056/006.yaml
  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
translation:
  language: id
  text: Mereka berkumpul dan bersembunyi; mereka mengawasi langkahku[a], sebagaimana mereka menantikan nyawaku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tumit-tumitku”; secara idiomatis dapat berarti “langkahku” atau “jejakku.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “sebagaimana mereka menantikan nyawaku.” Verba Ibraninya biasanya berarti “menunggu” atau “mengharapkan”; dalam konteks permusuhan, ungkapan ini dapat menyiratkan penantian dengan maksud jahat. “Sebagaimana” juga dapat dipahami sebagai “ketika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוּרוּ
  choice: mereka berkumpul
  rationale: Dalam konteks permusuhan ini, verba tersebut paling wajar menunjuk pada tindakan berhimpun atau bersekutu, bukan sekadar tinggal sebagai pendatang.
- source_word: יצפינו
  choice: lalu bersembunyi
  rationale: Bentuk ini menggambarkan tindakan menyembunyikan diri, kemungkinan untuk mengintai; 'bersembunyi' alami dalam bahasa Indonesia tanpa menjadikan penyergapan eksplisit.
- source_word: הֵמָּה
  choice: mereka
  rationale: Pronomina mandiri ini memberi penekanan. Dalam bahasa Indonesia, pengulangan subjek 'mereka' pada rangkaian tindakan sudah cukup menyampaikan penekanan itu.
- source_word: עֲקֵבַי
  choice: setiap langkahku
  rationale: Secara harfiah berarti 'tumit-tumitku', tetapi secara idiomatis menunjuk pada langkah, jejak, atau gerak-gerik orang yang dibuntuti. Kata 'setiap' menyatakan pengawasan yang terus-menerus secara alami.
- source_word: יִשְׁמֹרוּ
  choice: mereka mengawasi
  rationale: Di sini שמר bukan berarti melindungi, melainkan memperhatikan dan mengikuti gerak-gerik dengan maksud jahat.
- source_word: כַּאֲשֶׁר
  choice: sambil
  rationale: Kata penghubung ini secara dasar dapat berarti 'seperti/sebagaimana'. Dalam susunan ini, 'sambil' menyampaikan hubungan cara atau keadaan yang menyertai secara lebih alami dalam bahasa Indonesia.
- source_word: קִוּוּ
  choice: mengincar
  rationale: Makna dasarnya adalah menunggu atau mengharapkan. Karena objeknya ialah nyawa pemazmur dan konteksnya bermusuhan, 'mengincar' menyampaikan penantian yang bertujuan jahat tanpa menetapkan cara serangan tertentu.
- source_word: נַפְשִׁי
  choice: nyawaku
  rationale: נפש di sini menunjuk pada hidup atau diri pemazmur yang terancam; 'nyawaku' paling jelas dan alami dalam konteks musuh yang mengincarnya.
