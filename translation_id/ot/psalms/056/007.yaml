  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: id
  text: Karena kejahatan, jangan biarkan mereka lolos[a]; dalam murka, jatuhkanlah bangsa-bangsa[b], ya Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena kejahatan, jangan selamatkan mereka.” Klausa Ibrani ini sulit; kata kerjanya dapat berarti “lolos” atau “melepaskan/menyelamatkan,” dan unsur “jangan” tidak dinyatakan secara eksplisit, tetapi dipahami dari konteks. Sebagian memahaminya sebagai, “Karena kejahatan, mereka lolos.”
    reason: alternative_reading
  - marker: b
    text: Atau, “suku-suku bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  choice: Karena kejahatan
  rationale: עַל dipahami menyatakan sebab, sedangkan אָוֶן menunjuk pada kejahatan atau perbuatan jahat. Ungkapan ini mempertahankan bobot moral seruan tersebut tanpa menambahkan pelaku yang tidak dinyatakan dalam teks Ibrani.
- source_word: פַּלֶּט לָמוֹ
  choice: jangan biarkan mereka lolos
  rationale: Akar פלט dapat berarti ‘lolos’ atau ‘melepaskan/menyelamatkan’. Dalam konteks permohonan penghukuman, frasa yang padat ini paling wajar dipahami sebagai permohonan agar para lawan tidak dibiarkan lolos, meskipun unsur negatif tidak dinyatakan secara eksplisit dan susunan Ibraninya sulit.
- source_word: בְּאַף
  choice: dalam murka
  rationale: אַף dalam pemakaian ini berarti kemarahan atau murka. ‘Dalam murka’ mempertahankan ungkapan yang ringkas dan bernada khidmat; kata ganti ‘-Mu’ tidak ditambahkan karena tidak eksplisit dalam bahasa Ibrani.
- source_word: עַמִּים
  choice: bangsa-bangsa itu
  rationale: Bentuk jamak עַמִּים dapat berarti berbagai bangsa atau kelompok masyarakat. ‘Bangsa-bangsa’ merupakan padanan Indonesia yang alami, sedangkan ‘itu’ menandai kelompok-kelompok yang menjadi sasaran permohonan dalam konteks.
- source_word: הוֹרֵד
  choice: jatuhkanlah
  rationale: Bentuk kausatif imperatif dari ירד secara harfiah meminta Allah membuat mereka turun. ‘Jatuhkanlah’ mempertahankan metafora penurunan sekaligus menyampaikan makna merendahkan atau menumbangkan secara alami.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung pada akhir permohonan. ‘Ya Allah’ menyatakan fungsi vokatif itu secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Permohonan penghukuman dan unsur negatif yang tersirat dalam klausa Ibrani yang sulit
  choice: Ayat diterjemahkan sebagai permohonan agar orang-orang jahat tidak lolos karena kejahatan, lalu agar Allah menjatuhkan bangsa-bangsa dalam murka.
  alternative: ‘Karena kejahatan, jangan selamatkan mereka’; atau klausa itu dapat dipahami lebih langsung sebagai ‘Karena kejahatan, mereka lolos.’
  rationale: Klausa עַל אָוֶן פַּלֶּט לָמוֹ sangat padat dan tidak memuat partikel negatif secara eksplisit. Namun, konteks mazmur dan permohonan sejajar agar Allah menjatuhkan bangsa-bangsa mendukung pemahaman sebagai permohonan negatif. Catatan kaki mempertahankan ketidakpastian tekstual dan semantis ini.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan langsung. ‘Murka’ dipilih untuk mempertahankan kekuatan puitis-teologis אַף, sementara ‘jatuhkanlah’ menyampaikan metafora kausatif הוֹרֵד dengan alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
