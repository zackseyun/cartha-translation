  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: id
  text: 'Pada waktu aku berseru, musuh-musuhku akan mundur. Inilah yang aku tahu[a]: Allah berpihak kepadaku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengan ini aku tahu bahwa Allah berpihak kepadaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pada waktu
  rationale: Adverbia temporal ini berkaitan erat dengan frasa berikutnya, בְּיוֹם אֶקְרָא. Dalam bahasa Indonesia, susunan “Pada waktu aku berseru” menyampaikan hubungan waktu dan akibat secara alami tanpa menghilangkan daya pernyataan Ibrani.
- source_word: יָשׁוּבוּ ... אָחוֹר
  choice: akan mundur
  rationale: Gabungan שוב dengan אָחוֹר menggambarkan gerak berbalik atau terpukul mundur. “Akan mundur” ringkas, alami, dan sesuai dengan konteks kekalahan musuh.
- source_word: אוֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan wajar bagi nomina jamak dengan akhiran posesif orang pertama.
- source_word: אֶקְרָא
  choice: aku berseru
  rationale: Dalam konteks doa, קרא menunjuk pada tindakan memanggil atau berseru kepada Allah. “Berseru” menyampaikan konteks permohonan tanpa menambahkan objek yang tidak dinyatakan dalam ayat.
- source_word: זֶה יָדַעְתִּי
  choice: Inilah yang aku tahu
  rationale: Membaca זֶה secara deiktis sebagai isi yang diketahui. Susunan ini jelas dan alami, sementara kemungkinan instrumental dipertahankan dalam catatan kaki.
- source_word: כִּי
  choice: bahwa
  rationale: Memperkenalkan isi pengetahuan pemazmur, yakni bahwa Allah berpihak kepadanya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Sebutan umum bagi Allah Israel dan bentuk baku dalam bahasa Indonesia untuk konteks ini.
- source_word: לִי
  choice: berpihak kepadaku
  rationale: Dalam konteks para musuh yang mundur setelah pemazmur berseru, לִי menyatakan dukungan atau keberpihakan ilahi, bukan terutama kepemilikan.
theological_decisions:
- issue: Makna אֱלֹהִים לִי
  choice: Allah berpihak kepadaku
  alternative: Allah adalah milikku
  rationale: Klausa Ibrani bersifat eliptis dan secara harfiah dapat dikaitkan dengan kepemilikan, tetapi konteks mundurnya para musuh menunjukkan dukungan dan perkenanan Allah kepada pemazmur. Pilihan ini tidak memperluas klaim melampaui konteks.
- issue: Hubungan זֶה dengan klausa berikutnya
  choice: “Inilah yang aku tahu,” dengan isi pengetahuan dijelaskan oleh כִּי
  alternative: “Dengan ini aku tahu,” yakni peristiwa mundurnya musuh menjadi dasar pengetahuan
  rationale: Kedua analisis dimungkinkan secara sintaksis. Teks utama memakai pembacaan deiktis yang langsung, sedangkan pembacaan instrumental dipertahankan dalam catatan kaki agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aku” mempertahankan suara pribadi mazmur; “berseru” cocok dengan konteks doa; “berpihak kepadaku” mudah dipahami pembaca umum dan menyampaikan dukungan ilahi secara alami.
