  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: id
  text: Kasihanilah aku, ya Allah, karena manusia memburu aku dengan ganas[a]; sepanjang hari, sambil berperang, ia menindas aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata Ibrani yang diterjemahkan “memburu aku dengan ganas” secara harfiah berkaitan dengan terengah-engah dan dapat melukiskan pengejaran atau hasrat yang bermusuhan. Kemungkinan lain: “menginjak-injak aku,” “menerkam aku,” atau “hendak menelan aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Kasihanilah aku
  rationale: Imperatif Piel dari חנן dengan sufiks orang pertama tunggal merupakan permohonan agar Allah menunjukkan kemurahan. Ungkapan ini alami dalam doa bahasa Indonesia dan tidak harus menyiratkan pertobatan.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Sapaan langsung kepada Allah; partikel “ya” menyampaikan fungsi vokatif secara alami dan bermartabat.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan bagi permohonan pemazmur.
- source_word: שְׁאָפַנִי
  choice: memburu aku dengan ganas
  rationale: שׁאף menggambarkan terengah-engah atau mengendus dengan nafsu, lalu secara kiasan pengejaran yang penuh permusuhan. Pilihan ini mempertahankan gagasan pengejaran ganas dalam bahasa Indonesia yang wajar, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: אֱנוֹשׁ
  choice: seorang manusia
  rationale: Nomina tunggal ini menunjuk kepada lawan manusia dan dapat menonjolkan kefanaan manusia. “Seorang manusia” mempertahankan ketunggalannya tanpa memberi kesan bahwa seluruh umat manusia menjadi pelaku.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Padanan idiomatis modern untuk ungkapan waktu yang menunjukkan tindakan terus-menerus.
- source_word: לֹחֵם
  choice: memerangi
  rationale: Partisip Qal dari לחם menggambarkan tindakan permusuhan yang sedang berlangsung dan secara sintaksis berkaitan dengan pelaku tunggal.
- source_word: יִלְחָצֵנִי
  choice: menindas aku
  rationale: לחץ berarti menekan, menindas, atau menyusahkan. “Menindas” menyampaikan tekanan bermusuhan dengan jelas.
theological_decisions:
- issue: Cakupan dan nuansa אֱנוֹשׁ
  choice: seorang manusia
  alternative: manusia fana; manusia
  rationale: Konteks menggambarkan lawan tunggal, bukan umat manusia secara umum. Terjemahan ini menjaga kontras antara Allah dan penentang yang hanya manusia tanpa menambahkan penafsiran doktrinal.
- issue: Hubungan partisip לֹחֵם dengan יִלְחָצֵנִי
  choice: ia memerangi dan menindas aku
  alternative: sambil berperang, ia menindas aku; seorang penyerang menindas aku
  rationale: Partisip dapat dipahami secara sirkumstansial atau sebagai gambaran berkelanjutan. Penggunaan dua verba terkoordinasi menghasilkan bahasa Indonesia yang alami sambil mempertahankan kedua unsur tindakan tanpa menentukan hubungan logis yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa doa. Susunan kalimat dijaga ringkas serta puitis. Penanda catatan kaki [a] ditempatkan setelah keseluruhan baris karena menerangkan pilihan leksikal dalam klausa pertama.
