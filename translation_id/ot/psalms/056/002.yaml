  text: שָׁאֲפ֣וּ שׁ֭וֹרְרַ/י כָּל הַ/יּ֑וֹם כִּֽי רַבִּ֨ים לֹחֲמִ֖ים לִ֣/י מָרֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/002.yaml
  text: My enemies pant after me all day long[a], for many fight against me from on high.
translation:
  language: id
  text: Musuh-musuhku memburu aku sepanjang hari, sebab banyak orang memerangi aku dari tempat tinggi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan angkuh”; atau, “Ya Yang Mahatinggi,” jika kata Ibrani terakhir dibaca sebagai sapaan kepada Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאֲפוּ (שׁאף)
  choice: memburu ... dengan ganas
  rationale: Kata kerja ini membangkitkan gambaran mengendus atau terengah-engah dalam pengejaran dan, dalam konteks permusuhan, dapat menyatakan pengejaran yang rakus atau serangan yang menghancurkan. Ungkapan ini mempertahankan daya gambar tersebut dalam bahasa Indonesia yang wajar tanpa mempersempitnya menjadi sekadar tindakan harfiah menginjak-injak.
- source_word: שׁוֹרְרַי
  choice: musuh-musuhku
  rationale: Kata ini menunjuk kepada lawan-lawan yang bermusuhan; padanan ini jelas, ringkas, dan sesuai dengan konteks ratapan.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Padanan idiomatis dalam bahasa Indonesia modern untuk tindakan yang berlangsung terus-menerus sepanjang hari.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi keluhan pemazmur.
- source_word: רַבִּים
  choice: banyak orang
  rationale: Bentuk ini menyatakan banyaknya para penyerang; penambahan 'orang' membuat acuannya alami dan jelas dalam bahasa Indonesia.
- source_word: לֹחֲמִים לִי
  choice: memerangi aku
  rationale: Partisip dengan preposisi ini menggambarkan tindakan bermusuhan yang sedang berlangsung dan diarahkan kepada pemazmur.
- source_word: מָרוֹם
  choice: dengan angkuh
  rationale: Secara harfiah kata ini berkaitan dengan ketinggian atau keluhuran, tetapi dalam susunan padat ini dapat berfungsi secara adverbial untuk menggambarkan para penyerang yang bertindak dengan keangkuhan. Kemungkinan pembacaan lokatif dan sapaan kepada Allah dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penafsiran מָרוֹם
  choice: dengan angkuh
  alternative: dari tempat tinggi; ya Yang Mahatinggi
  rationale: Kata terakhir ayat ini secara sintaksis padat dan dapat dipahami sebagai keterangan cara, keterangan tempat, atau sapaan kepada Allah. Teks utama memakai pengertian adverbial yang alami dalam konteks, sedangkan kemungkinan lokatif dan vokatif dicatat agar ambiguitas serta ketegangan teologis bahasa Ibraninya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Ungkapan 'memburu ... dengan ganas' menyampaikan citra pengejaran predatoris secara mudah dipahami, sedangkan catatan kaki mempertahankan tiga kemungkinan utama bagi מָרוֹם.
