base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: id
  text: 'Untuk pemimpin musik: sesuai lagu “Merpati Bisu dari Tempat-Tempat Jauh.”[a] Dari Daud.[b] Sebuah miktam,[c] ketika orang Filistin menangkapnya di Gat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kemungkinan judul atau petunjuk lagu. Secara harfiah frasa Ibraninya kira-kira berarti “merpati bisu dari tempat-tempat jauh,” tetapi makna tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “milik Daud” atau “untuk Daud”; ungkapan Ibrani ini dapat menunjukkan kepengarangan, peruntukan, atau hubungan dengan Daud.
    reason: alternative_reading
  - marker: c
    text: Miktam adalah istilah teknis dalam judul-judul mazmur; arti tepatnya tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: עַל
  choice: menurut lagu
  rationale: Dalam judul mazmur, kata ini dapat memperkenalkan melodi atau judul lagu yang menjadi acuan; penambahan 'lagu' memperjelas fungsi frasa berikutnya.
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: “Merpati Bisu di Tempat-Tempat Jauh”
  rationale: Frasa ini tampaknya merupakan judul lagu dan maknanya tidak pasti. Terjemahan mempertahankan unsur merpati, kebisuan, dan kejauhan tanpa mengadopsi tafsiran 'pohon tarbantin' yang kurang kuat.
- source_word: לְדָוִד
  choice: Mazmur Daud
  rationale: Ungkapan Indonesia ini lazim untuk judul mazmur, tetapi tetap dapat menyatakan hubungan dengan Daud tanpa secara tegas menetapkan jenis hubungan itu.
- source_word: מִכְתָּם
  choice: miktam
  rationale: Istilah teknis dalam judul mazmur ini tidak diketahui dengan pasti; transliterasi menghindari terjemahan spekulatif.
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: ketika ... menangkapnya
  rationale: Infinitif dengan ב menyatakan waktu atau peristiwa yang melatarbelakangi mazmur; 'menangkap' menyampaikan tindakan bermusuhan secara alami.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Padanan etnis baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: בְּגַת
  choice: di Gat
  rationale: Padanan lokatif yang alami untuk nama tempat tersebut.
theological_decisions:
- issue: Status dan sifat judul mazmur
  choice: Menerjemahkan judul sebagai bagian teks, termasuk petunjuk musik dan keterangan sejarahnya, sambil mempertahankan istilah teknis yang tidak pasti.
  alternative: Memperlakukan judul sebagai metadata editorial atau menerjemahkan מִכְתָּם secara dugaan, misalnya 'mazmur emas'.
  rationale: Judul terdapat dalam teks Ibrani. Mempertahankannya menghormati bentuk teks sumber, sedangkan transliterasi dan catatan kaki mencegah kepastian teologis atau historis yang tidak didukung.
- issue: Hubungan לְדָוִד dengan Daud
  choice: Mazmur Daud
  alternative: Oleh Daud; untuk Daud
  rationale: Preposisi Ibrani dapat menunjukkan kepengarangan, peruntukan, atau keterkaitan. Rumusan judul Indonesia yang lazim ini tidak perlu dipersempit menjadi klaim eksplisit 'ditulis oleh Daud'.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Judul lagu diberi tanda petik untuk menunjukkan kemungkinan fungsi musikalnya. Semua penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
