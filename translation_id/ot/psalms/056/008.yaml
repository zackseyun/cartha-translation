base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: id
  text: Engkau telah menghitung pengembaraanku; taruhlah air mataku dalam kirbat-Mu[a]—bukankah semuanya ada dalam kitab-Mu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirbat adalah wadah dari kulit binatang, yang pada zaman dahulu digunakan untuk menyimpan cairan.
    reason: lexical_clarification
lexical_decisions:
- source_word: נֹדִי
  choice: pengembaraanku
  rationale: Berasal dari נוד, yang menggambarkan gerak mengembara atau berpindah-pindah karena terusir. Pilihan ini mempertahankan gambaran konkret pengalaman pemazmur tanpa menafsirkannya secara abstrak sebagai sekadar kesengsaraan.
- source_word: סָפַרְתָּה
  choice: telah menghitung
  rationale: ספר pada dasarnya berarti menghitung atau memberi nomor, dan dapat meluas menjadi mencatat. 'Telah menghitung' mempertahankan arti verbal yang konkret sekaligus menyiratkan perhatian Allah yang saksama.
- source_word: שִׂימָה
  choice: taruhlah
  rationale: Bentuk perintah dari שׂים. 'Taruhlah' merupakan padanan langsung dan wajar serta mempertahankan permohonan pemazmur.
- source_word: דִמְעָתִי
  choice: air mataku
  rationale: Padanan idiomatis dalam bahasa Indonesia untuk nomina bersufiks posesif ini; bentuk kolektif 'air mata' tidak perlu dijamakkan.
- source_word: בְּנֹאדֶךָ
  choice: dalam kirbat-Mu
  rationale: נֹאד adalah wadah dari kulit, bukan botol kaca modern. 'Kirbat' mempertahankan benda kuno itu secara ringkas; catatan kaki menjelaskannya bagi pembaca modern.
- source_word: הֲלֹא
  choice: bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban ya, tanpa mengubahnya menjadi pernyataan tegas.
- source_word: בְּסִפְרָתֶךָ
  choice: ada dalam kitab-Mu
  rationale: Frasa Ibrani secara harfiah menunjuk pada keberadaan dalam kitab atau catatan milik Allah. 'Kitab' alami dalam konteks puitis dan tidak menentukan bahan fisiknya sebagai gulungan.
theological_decisions:
- issue: Gambaran antropomorfis tentang Allah yang menyimpan air mata dan memiliki kitab
  choice: Mempertahankan gambaran konkret tentang kirbat dan kitab
  alternative: Memparafrasakannya secara abstrak, misalnya 'Engkau mengingat segala dukaku'
  rationale: Bahasa puitis ini menggambarkan perhatian Allah yang sangat pribadi terhadap penderitaan pemazmur. Mengubahnya menjadi gagasan abstrak akan mengurangi daya puitis dan teologis teks.
- issue: Subjek tersirat dalam pertanyaan penutup
  choice: Menggunakan kata netral 'itu' tanpa menjelaskan secara tegas apakah yang dimaksud air mata, pengembaraan, atau seluruh pengalaman pemazmur
  alternative: Menambahkan 'semuanya' atau secara khusus menyebut 'air mataku'
  rationale: Teks Ibrani tidak menyatakan subjek secara eksplisit pada klausa terakhir. Pilihan ini mempertahankan ruang rujukan yang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Sapaan ilahi memakai huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Tanda pisah mempertahankan hubungan puitis antara gambaran kirbat dan kitab.
