  text: עָלַ֣/י אֱלֹהִ֣ים נְדָרֶ֑י/ךָ אֲשַׁלֵּ֖ם תּוֹדֹ֣ת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/012.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: id
  text: Nazar-nazar-Mu menjadi tanggunganku[a], ya Allah; aku akan menunaikan ucapan-ucapan syukur kepada-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “nazar-nazar-Mu ada padaku.” Kemungkinan maksudnya ialah nazar yang diucapkan kepada Allah dan karena itu menjadi tanggungan pemazmur; secara lebih idiomatis, “nazar-nazarku kepada-Mu.”
    reason: alternative_reading
  - marker: b
    text: Atau “persembahan-persembahan syukur.” Istilah Ibrani ini dapat menunjuk baik pada ungkapan syukur maupun pada persembahan syukur.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: menjadi kewajibanku
  rationale: Preposisi עַל dengan akhiran orang pertama tunggal menggambarkan sesuatu yang berada sebagai tanggungan atau kewajiban pada pemazmur. Pilihan ini menyampaikan idiom Ibrani secara alami dalam bahasa Indonesia tanpa menghilangkan unsur kewajiban.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung. Partikel “ya” menyatakan fungsi vokatif tersebut secara wajar dan khidmat.
- source_word: נְדָרֶיךָ
  choice: nazar-nazar-Mu
  rationale: Bentuk Ibraninya secara formal memakai akhiran orang kedua maskulin tunggal, yakni “nazar-nazar-Mu.” Ungkapan ini kemungkinan menunjuk pada nazar yang menjadi hak Allah karena diucapkan kepada-Nya; bentuk sumber dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
- source_word: אֲשַׁלֵּם
  choice: aku akan mempersembahkan
  rationale: Bentuk piel dari שׁלם dapat berarti membayar, menunaikan, atau memberikan apa yang menjadi kewajiban. Bersama תּוֹדוֹת yang mungkin menunjuk pada persembahan, “mempersembahkan” merupakan padanan Indonesia yang alami, meskipun nuansa pelunasan kewajiban juga ditopang oleh klausa pertama.
- source_word: תּוֹדֹת
  choice: persembahan syukur
  rationale: Nomina jamak ini dapat berarti ungkapan-ungkapan syukur atau persembahan-persembahan syukur. Hubungannya dengan nazar dan kata kerja שׁלם mendukung kemungkinan makna ibadah atau kurban, sedangkan bentuk tanpa pengulangan lebih alami dalam bahasa Indonesia.
- source_word: לָךְ
  choice: kepada-Mu
  rationale: Preposisi ל menandai penerima. Konteks dan akhiran maskulin pada נְדָרֶיךָ menunjukkan bahwa Allah tetap menjadi pihak yang disapa.
theological_decisions:
- issue: Makna “nazar-nazar-Mu” dalam hubungannya dengan Allah
  choice: Teks utama mempertahankan bentuk formal “nazar-nazar-Mu” sambil mengungkapkan עָלַי sebagai kewajiban pemazmur.
  alternative: nazar-nazarku kepada-Mu
  rationale: Akhiran orang kedua pada נְדָרֶיךָ paling langsung berarti “-Mu.” Kemungkinan maksudnya ialah nazar yang diucapkan kepada Allah dan oleh sebab itu menjadi hak-Nya, tetapi terjemahan tidak diam-diam menggantinya dengan bentuk orang pertama.
- issue: Arti תּוֹדֹת
  choice: persembahan syukur
  alternative: ucapan syukur
  rationale: Konteks pembayaran atau penunaian nazar mendukung nuansa persembahan ibadah, tetapi cakupan leksikal yang lebih luas tetap dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa mengikuti gerak teks Ibrani, sedangkan idiom עָלַי dinaturalkan menjadi “menjadi kewajibanku.” Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
