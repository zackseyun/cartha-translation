translation:
  language: id
  text: Sepanjang hari mereka memutarbalikkan kata-kataku[a]; segala rencana mereka terhadapku bertujuan jahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani ini sulit dan juga dapat dikaitkan dengan makna menyakiti atau mendukakan. Dengan objek “kata-kataku”, arti “memutarbalikkan” paling sesuai dengan konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “segala pikiran mereka terhadapku adalah untuk kejahatan.” Kata Ibrani yang diterjemahkan “rencana” juga dapat berarti pikiran, niat, atau rancangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Sepanjang hari
  rationale: Ungkapan ini menyatakan tindakan yang berlangsung terus sepanjang hari; bentuk ini alami dan ringkas dalam bahasa Indonesia modern.
- source_word: דְּבָרַי
  choice: perkataanku
  rationale: Walaupun דָּבָר dapat berarti perkataan, perkara, atau urusan, objek verba dalam konteks permusuhan ini paling wajar menunjuk pada perkataan pemazmur.
- source_word: יְעַצֵּבוּ
  choice: memutarbalikkan
  rationale: Bentuk piel dari עצב di sini sulit dan dapat berkaitan dengan menyakiti, mendukakan, atau membengkokkan. Dengan objek 'perkataanku', pemutarbalikan secara bermusuhan paling sesuai dengan konteks, sambil tetap dicatat sebagai persoalan leksikal dalam catatan kaki.
- source_word: עָלַי
  choice: terhadap aku
  rationale: Preposisi ini secara harfiah dapat berarti 'atas/tentang aku', tetapi konteks permusuhan memberinya daya adversatif. 'Terhadap aku' mempertahankan hubungan itu tanpa memperkerasnya secara berlebihan menjadi tafsiran tambahan.
- source_word: כָּל מַחְשְׁבֹתָם
  choice: segala rencana mereka
  rationale: מַחְשָׁבוֹת dapat berarti pikiran, niat, rancangan, atau rencana. Dalam paralel dengan tindakan musuh dan tujuan jahat, 'rencana' terdengar alami dalam bahasa Indonesia; alternatif 'pikiran' dicatat agar keluasan istilah sumber tetap terlihat.
- source_word: לָרָע
  choice: bertujuan jahat
  rationale: Frasa ini menunjukkan arah atau maksud menuju kejahatan. 'Bertujuan jahat' mengungkapkan maksud bermusuhan secara alami serta mempertahankan dimensi moral רַע, bukan hanya akibat berupa kerugian.
