  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: id
  text: Dalam Allah aku akan memuji firman-Nya; kepada Allah aku percaya; aku tidak akan takut. Apakah yang dapat dilakukan manusia fana terhadap aku?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Apakah yang akan dilakukan daging terhadap aku?” “Daging” di sini menunjuk kepada manusia yang lemah dan fana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Dalam Allah / kepada Allah
  rationale: Preposisi ב membingkai Allah sebagai dasar atau sasaran kepercayaan dan pujian. Untuk klausa pertama, “dalam Allah” mempertahankan bentuk yang dekat dengan Ibrani; dalam klausa kedua, “kepada Allah aku percaya” lebih alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: אֲהַלֵּל
  choice: aku akan memuji
  rationale: Bentuk piel imperfek orang pertama tunggal menyatakan tekad atau tindakan yang dipandang ke depan; “akan memuji” mempertahankan nuansa ini.
- source_word: דְּבָרוֹ
  choice: firman-Nya
  rationale: דָּבָר berarti perkataan atau firman. “Firman-Nya” mempertahankan keluasan makna dan tidak mempersempitnya menjadi hanya “janji-Nya”.
- source_word: בָּטַחְתִּי
  choice: aku percaya
  rationale: Bentuk qatal menyatakan kepercayaan yang telah diletakkan kepada Allah dan menghasilkan keyakinan kini. Bahasa Indonesia alami dapat menyatakannya dengan “aku percaya” tanpa harus memakai bentuk lampau yang kaku.
- source_word: לֹא אִירָא
  choice: aku tidak akan takut
  rationale: Imperfek dengan negasi mengungkapkan keyakinan dan tekad untuk tidak takut.
- source_word: מַה יַּעֲשֶׂה
  choice: Apakah yang dapat dilakukan
  rationale: Secara bentuk berarti “apa yang akan dilakukan”, tetapi dalam pertanyaan retoris ini menyiratkan ketidakmampuan; “dapat dilakukan” menyampaikan daya retoris tersebut secara alami.
- source_word: בָשָׂר
  choice: manusia fana
  rationale: Secara harfiah berarti “daging”, tetapi di sini merupakan metonimia bagi manusia yang lemah dan fana, berlawanan dengan Allah. “Manusia fana” membuat referennya jelas sambil mempertahankan kontras teologis.
- source_word: לִי
  choice: terhadap aku
  rationale: Preposisi ל dapat berarti “kepada” atau, dalam konteks tindakan yang mengancam, “terhadap”. Ungkapan ini alami dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah antropologis בָשָׂר dalam kontras dengan Allah
  choice: manusia fana
  alternative: daging
  rationale: Terjemahan harfiah “daging” dapat terdengar sebagai jaringan tubuh dalam bahasa Indonesia dan mengaburkan referen manusia. “Manusia fana” menyatakan metonimia sumber dengan jelas serta mempertahankan gagasan kelemahan manusia di hadapan Allah.
- issue: Aspek בָּטַחְתִּי dan hubungan kepercayaan dengan keberanian
  choice: aku percaya; aku tidak akan takut
  alternative: aku telah percaya; aku tidak takut
  rationale: Bentuk Ibrani dapat menunjuk pada tindakan percaya yang telah ditetapkan dan berdampak kini. Pilihan ini mempertahankan ketegangan antara dasar kepercayaan dan tekad yang mengikutinya tanpa memaksakan waktu lampau yang tidak alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Urutan klausa serta pengulangan nama Allah dipertahankan untuk menjaga paralelisme Ibrani; tanda titik koma memperlihatkan keterkaitan erat antara pujian, kepercayaan, dan keberanian.
