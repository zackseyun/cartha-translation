base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/003.yaml
  text: When I am afraid[a], I will trust in you.
translation:
  language: id
  text: Ketika aku takut[a], aku akan percaya kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Pada hari aku takut, aku—kepada-Mu aku akan percaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: י֥וֹם
  choice: Ketika
  rationale: Walaupun secara harfiah berarti ‘hari’, di sini יוֹם memperkenalkan keterangan waktu (‘pada hari ketika aku takut’). ‘Ketika’ menyampaikan fungsi temporal itu secara alami dalam bahasa Indonesia.
- source_word: אִירָ֑א
  choice: aku takut
  rationale: Bentuk Qal imperfek orang pertama tunggal dari ירא di sini menunjuk pada pengalaman merasa takut, bukan rasa hormat atau takut yang khidmat.
- source_word: אֲנִ֗י
  choice: aku
  rationale: Pronomina mandiri ini memberi penekanan pada subjek. Bahasa Indonesia sudah menyatakannya secara wajar dengan ‘aku’; bentuk harfiah yang lebih tegas dicatat dalam catatan kaki.
- source_word: אֵלֶ֥י/ךָ
  choice: kepada-Mu
  rationale: Preposisi אֶל mengarahkan kepercayaan kepada Allah. Kolokasi ‘percaya kepada-Mu’ alami dalam bahasa Indonesia dan mempertahankan arah relasional tersebut.
- source_word: אֶבְטָֽח
  choice: aku akan percaya
  rationale: 'Imperfek dari בטח menyatakan tekad atau respons yang berorientasi ke depan: ketika takut muncul, pemazmur bertekad untuk percaya.'
theological_decisions:
- issue: Hubungan antara rasa takut dan kepercayaan
  choice: Ayat ini mengakui bahwa pemazmur mengalami ketakutan, lalu menanggapinya dengan tekad untuk percaya kepada Allah.
  alternative: Menyatakan bahwa keyakinan menghapus rasa takut sepenuhnya.
  rationale: Teks Ibrani menempatkan ketakutan dan kepercayaan berdampingan; teks tidak mengatakan bahwa pemazmur sama sekali tidak takut. Terjemahan mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang sederhana dan bermartabat. ‘Aku’ sesuai dengan suara pribadi pemazmur, sedangkan ‘-Mu’ menandai sapaan kepada Allah. Susunan alami dipilih dalam teks utama, sementara penekanan dan bentuk temporal harfiah bahasa Ibrani dipertahankan dalam catatan kaki.
