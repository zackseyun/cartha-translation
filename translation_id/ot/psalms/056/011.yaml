source:
  edition: WLC
  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/011.yaml
  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: id
  text: Kepada Allah aku percaya; aku tidak akan takut. Apa yang dapat dilakukan manusia terhadapku?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Kepada Allah
  rationale: Preposisi ב dengan אֱלֹהִים menandai objek kepercayaan. Dalam bahasa Indonesia, ungkapan alami ialah “percaya kepada Allah”; “di dalam Allah” akan terasa kurang wajar dalam konteks ini.
- source_word: בָּטַחְתִּי
  choice: aku percaya
  rationale: Bentuk Qal perfek orang pertama tunggal menyatakan kepercayaan yang telah ditetapkan dan tetap berlaku. Bentuk kini “aku percaya” secara alami menyampaikan keadaan mantap itu dalam bahasa Indonesia.
- source_word: לֹא אִירָא
  choice: aku tidak akan takut
  rationale: Imperfek setelah לֹא dalam konteks ini menyatakan keyakinan atau tekad mengenai apa yang akan dihadapi.
- source_word: מַה יַּעֲשֶׂה
  choice: Apa yang dapat dilakukan
  rationale: Secara harfiah “apa yang akan/dilakukan,” tetapi sebagai pertanyaan retoris konstruksi ini secara idiomatis menyatakan ketidakmampuan lawan untuk mendatangkan bahaya yang menentukan.
- source_word: אָדָם
  choice: manusia
  rationale: Kata benda tunggal ini dipakai secara representatif bagi seorang manusia atau manusia pada umumnya. “Manusia” mempertahankan kontras antara Allah dan insan fana tanpa mengubahnya menjadi bentuk kolektif eksplisit.
- source_word: לִי
  choice: terhadapku
  rationale: Preposisi ל dengan pronomina berarti “kepadaku/terhadapku”; bersama verba “melakukan,” “terhadapku” adalah susunan Indonesia yang paling alami.
theological_decisions:
- issue: Makna representatif אָדָם dalam kontras dengan Allah
  choice: manusia
  alternative: seorang manusia; manusia fana
  rationale: Teks memakai bentuk tunggal secara representatif. “Manusia” menjaga cakupan umum dan kontras Allah–manusia, sedangkan “manusia fana” menambahkan unsur yang hanya tersirat.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Urutan klausa Ibrani dipertahankan sejauh tetap alami; tanda titik koma menandai hubungan antara kepercayaan dan keberanian.
