lexical_decisions:
- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: yang di tangannya
  rationale: Partikel relatif dan frasa preposisional ini melanjutkan gambaran tentang orang-orang fasik pada ayat sebelumnya. Bentuk kolektif tunggal dalam bahasa Indonesia menjaga gambaran Ibrani tentang tangan sebagai sarana tindakan.
- source_word: זִמָּה
  choice: kejahatan
  rationale: Dalam konteks paralel dengan suap, kata ini menunjuk secara luas pada keburukan moral atau maksud jahat, bukan secara khusus pada dosa seksual.
- source_word: וִימִינָם
  choice: dan tangan kanannya
  rationale: Terjemahan ini mempertahankan bentuk kolektif tunggal dan citra tangan kanan sebagai sarana tindakan atau kuasa.
- source_word: מָלְאָה
  choice: penuh dengan
  rationale: Ungkapan keadaan ini alami dalam bahasa Indonesia dan menyampaikan makna statif verba Ibrani.
- source_word: שֹׁחַד
  choice: suap
  rationale: Nomina Ibrani berbentuk tunggal dan dipakai secara generik; 'suap' merupakan padanan Indonesia yang alami bagi praktik korupsi tersebut.
