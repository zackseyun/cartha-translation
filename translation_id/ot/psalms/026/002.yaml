  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: id
  text: Selidikilah aku, ya Yahweh, dan ujilah aku; murnikanlah ginjalku[a] dan hatiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam pemikiran Ibrani kuno, ginjal merupakan gambaran bagi batin terdalam, termasuk pikiran dan perasaan.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: Selidikilah aku
  rationale: Kata kerja בחן menyatakan pemeriksaan untuk mengetahui atau membuktikan keadaan yang sebenarnya. “Selidikilah” mempertahankan nuansa pemeriksaan dan membedakannya dari נסה pada baris berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: וְנַסֵּנִי
  choice: dan ujilah aku
  rationale: נסה menunjuk pada tindakan menguji atau membuktikan melalui ujian. “Ujilah” alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan בחן.
- source_word: צָרְפָה
  choice: murnikanlah
  rationale: צרף adalah istilah metalurgis untuk memurnikan logam. “Murnikanlah” mempertahankan citra pemurnian dan sesuai dengan objek yang melambangkan batin manusia.
- source_word: כִלְיוֹתַי
  choice: ginjalku
  rationale: Secara harfiah kata ini berarti “ginjal-ginjalku” dan dalam antropologi Ibrani menjadi kiasan bagi batin terdalam, pikiran, atau perasaan. Teks utama mempertahankan citra tubuh konkret; maknanya dijelaskan dalam catatan kaki.
- source_word: וְלִבִּי
  choice: dan hatiku
  rationale: לֵב menunjuk pada hati sebagai pusat pikiran, kehendak, dan perasaan. “Hatiku” mempertahankan citra Ibrani dan terdengar wajar dalam puisi Indonesia.
theological_decisions:
- issue: Citra antropologis dalam puisi Ibrani
  choice: Mempertahankan ungkapan harfiah “ginjalku” dan “hatiku”.
  alternative: Mengalihkannya menjadi “batinku dan hatiku” atau “pikiran dan hatiku”.
  rationale: Teks Ibrani memakai dua anggota tubuh sebagai gambaran seluruh manusia batiniah. Mempertahankan citra tersebut menjaga kekonkretan dan ketegangan puitis sumber tanpa memasukkan satu tafsiran sempit ke dalam teks utama; catatan kaki memberi pembaca makna kiasannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Partikel “ya” menandai sapaan kepada Yahweh. Akhiran imperatif -lah mempertahankan rangkaian permohonan yang tegas dalam puisi.
