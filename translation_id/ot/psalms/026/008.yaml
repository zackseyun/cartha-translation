  text: יְֽהוָ֗ה אָ֭הַבְתִּי מְע֣וֹן בֵּיתֶ֑/ךָ וּ֝/מְק֗וֹם מִשְׁכַּ֥ן כְּבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
translation:
  language: id
  text: 'Yahweh, aku mencintai rumah-Mu,

    tempat Engkau berdiam,

    dan tempat kemuliaan-Mu bersemayam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Dalam bahasa Indonesia, nama perjanjian YHWH secara lazim dan bermartabat ditandai dengan huruf kapital penuh “TUHAN”; pilihan ini membedakannya dari gelar “Tuhan” sambil tetap mudah dipahami pembaca umum.
- source_word: אָהַבְתִּי
  choice: aku mencintai
  rationale: Bentuk perfektum orang pertama tunggal di sini menyatakan sikap yang menetap dalam pengakuan puitis, sehingga wajar diterjemahkan dengan kala kini “aku mencintai”.
- source_word: מְעוֹן בֵּיתֶךָ
  choice: kediaman rumah-Mu
  rationale: Terjemahan ini mempertahankan kedua unsur konkret, “kediaman” dan “rumah-Mu,” tanpa mempersempit referennya secara eksplisit menjadi bait atau Kemah Suci.
- source_word: וּמְקוֹם
  choice: tempat
  rationale: Kata sambung Ibrani dapat disampaikan melalui aposisi puitis dalam bahasa Indonesia; “tempat” menerangkan baris sebelumnya secara alami.
- source_word: מִשְׁכַּן כְּבוֹדֶךָ
  choice: kemuliaan-Mu bersemayam
  rationale: Frasa nominal harfiah “kediaman kemuliaan-Mu” dialihkan menjadi klausa yang alami, sambil mempertahankan gambaran kemuliaan ilahi yang menetap di tempat itu.
theological_decisions:
- issue: Bahasa tempat kudus tanpa menentukan referennya secara berlebihan
  choice: rumah-Mu ... tempat kemuliaan-Mu bersemayam
  alternative: bait-Mu ... tempat kemuliaan-Mu bertakhta
  rationale: Teks Ibrani memakai “rumah” dan bahasa kediaman, bukan istilah yang secara eksplisit harus diterjemahkan “bait” atau “bertakhta.” Pilihan ini mempertahankan citra dan keluasan referen asli.
- issue: Penyajian Tetragramaton
  choice: TUHAN
  alternative: Yahweh
  rationale: “TUHAN” merupakan konvensi Indonesia yang mapan untuk YHWH dan, melalui kapitalisasi penuh, tetap menunjukkan bahwa teks sumber memuat nama ilahi, bukan sekadar gelar biasa.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital menurut konvensi umum Indonesia. Susunan dua baris mempertahankan paralelisme dan aposisi puisi Ibrani tanpa menambahkan penjelasan doktrinal.
