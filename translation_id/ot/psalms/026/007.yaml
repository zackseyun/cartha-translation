  text: to proclaim with a voice of thanksgiving[b][a], and to recount all your wondrous deeds.
translation:
  language: id
  text: untuk memperdengarkan ucapan syukur[a] dan menceritakan segala perbuatan-Mu yang ajaib[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memperdengarkan suara ucapan syukur”; dapat juga diterjemahkan “menyuarakan ucapan syukur.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “segala keajaiban-Mu” atau “segala karya-Mu yang menakjubkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: untuk memperdengarkan
  rationale: Bentuk Hifil dari שׁמע secara kausatif berarti ‘membuat terdengar’ atau ‘memperdengarkan’. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan daya kausatif teks Ibrani.
- source_word: בְּקוֹל תּוֹדָה
  choice: ucapan syukur
  rationale: Secara harfiah berarti ‘dengan suara syukur’. Dalam bahasa Indonesia, ‘memperdengarkan ucapan syukur’ menyampaikan tindakan bersuara dengan wajar; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: וּלְסַפֵּר
  choice: dan menceritakan
  rationale: Dalam bentuk Piel, ספר berarti menceritakan atau menuturkan, sering dengan gagasan menguraikan apa yang telah dilakukan.
- source_word: כָּל
  choice: segala
  rationale: Menyampaikan cakupan menyeluruh dari kata Ibrani dan mengalir alami sebelum nomina jamak kolektif.
- source_word: נִפְלְאוֹתֶיךָ
  choice: perbuatan-Mu yang ajaib
  rationale: Bentuk jamak ini dapat menunjuk pada keajaiban maupun tindakan luar biasa Allah. ‘Perbuatan-Mu yang ajaib’ mengungkapkan nuansa tindakan tanpa menutup alternatif ‘segala keajaiban-Mu’.
