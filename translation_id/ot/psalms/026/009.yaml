  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: id
  text: 'Janganlah kumpulkan[a] jiwaku bersama orang-orang berdosa,

    dan hidupku bersama orang-orang yang menumpahkan darah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Janganlah bawa pergi jiwaku bersama orang-orang berdosa.” Kata kerja ini dapat menyiratkan bahwa seseorang dibawa pergi bersama orang fasik dalam penghakiman.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang darah,” sebuah ungkapan Ibrani bagi orang yang kejam atau bersalah karena pertumpahan darah.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: kumpulkan
  rationale: Makna dasarnya ialah ‘mengumpulkan’. Dalam konteks penghakiman, kata ini juga dapat berarti membawa pergi seseorang bersama orang lain; pilihan ini mempertahankan gambaran Ibrani dan ambiguitas kontekstualnya.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, atau diri. ‘Jiwaku’ membedakannya dari חַיָּי dalam baris sejajar tanpa memaksakan antropologi teknis.
- source_word: חַטָּאִים
  choice: orang-orang berdosa
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menunjuk kepada orang yang dicirikan oleh dosa.
- source_word: אַנְשֵׁי דָמִים
  choice: orang-orang yang menumpahkan darah
  rationale: Ungkapan idiomatis ini menyampaikan kekerasan dan kesalahan karena pertumpahan darah tanpa mempersempit artinya hanya kepada pembunuh.
- source_word: חַיָּי
  choice: hidupku
  rationale: Dalam kesejajaran dengan נַפְשִׁי, kata ini secara alami berarti ‘hidupku’ dan mempertahankan dua istilah puitis yang berkaitan tetapi tidak identik.
- source_word: אַל
  choice: Jangan
  rationale: Dengan bentuk imperfek, אַל menyatakan permohonan negatif atau larangan; ‘Jangan’ merupakan bentuk doa yang ringkas dan wajar.
theological_decisions:
- issue: Nuansa antropologis נַפְשִׁי dan חַיָּי
  choice: Mempertahankan dua istilah puitis yang berbeda sebagai ‘jiwaku’ dan ‘hidupku’.
  alternative: Menerjemahkannya secara lebih umum sebagai ‘aku’ dan ‘hidupku’, atau menyamakan keduanya sebagai ‘hidupku’.
  rationale: Ayat ini tidak mengharuskan suatu ajaran teknis tentang pemisahan jiwa dan tubuh. Namun, teks Ibrani sengaja memakai dua istilah yang berkaitan dalam kesejajaran, sehingga keduanya dipertahankan tanpa menjelaskan ketegangan itu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Susunan dua baris mempertahankan kesejajaran puisi Ibrani. Semua penanda catatan kaki ditempatkan pada unsur yang diterangkannya.
