  text: For your steadfast love is before my eyes[b][a], and I have walked in your truth.
translation:
  language: id
  text: 'Sebab kasih setia-Mu ada di depan mataku,[a]

    dan aku telah berjalan dalam kebenaran-Mu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih setia perjanjian-Mu”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam kesetiaan-Mu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar bagi pernyataan pemazmur dalam konteks sekitarnya; “sebab” mempertahankan fungsi penjelasannya secara alami dalam bahasa Indonesia.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh, khususnya dalam hubungan perjanjian. “Kasih setia” mempertahankan unsur kasih dan keteguhan tanpa mempersempit maknanya.
- source_word: לְנֶגֶד עֵינַי
  choice: selalu ada di depan mataku
  rationale: Secara harfiah berarti “di depan mataku” dan secara idiomatis menunjuk pada sesuatu yang terus diperhatikan. “Selalu ada” membuat implikasi idiomatis itu jelas tanpa menghilangkan gambaran aslinya.
- source_word: וְהִתְהַלַּכְתִּי
  choice: dan aku telah berjalan
  rationale: Bentuk hitpael dari הלך dapat menggambarkan cara hidup atau perilaku seseorang. “Telah berjalan” mempertahankan metafora Ibrani serta menunjukkan pola hidup yang berlangsung sampai saat ini.
- source_word: בַּאֲמִתֶּךָ
  choice: dalam kebenaran-Mu
  rationale: אֱמֶת dapat berarti kebenaran, kesetiaan, atau sifat dapat dipercaya. “Dalam kebenaran-Mu” mempertahankan keluasan makna istilah itu, sementara alternatif “dalam kesetiaan-Mu” dicatat dalam catatan kaki.
theological_decisions:
- issue: Rentang makna istilah ilahi חֶסֶד dan אֱמֶת
  choice: חֶסֶד diterjemahkan “kasih setia” dan אֱמֶת diterjemahkan “kebenaran”, dengan alternatif penting dicatat dalam catatan kaki.
  alternative: Menerjemahkan חֶסֶד sebagai “kesetiaan pada perjanjian-Mu” dan אֱמֶת sebagai “kesetiaan-Mu”.
  rationale: Ayat ini menempatkan watak Allah yang penuh kasih dan dapat dipercaya sebagai pedoman hidup pemazmur. Pilihan ini mempertahankan kekayaan teologis kedua istilah tanpa membatasinya pada satu nuansa doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora “berjalan” dipertahankan karena mudah dipahami sebagai gambaran cara hidup. Sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
