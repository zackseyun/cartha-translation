lexical_decisions:
- source_word: אֶרְחַץ
  choice: Aku membasuh
  rationale: Bentuk imperfek Qal orang pertama tunggal dapat menyatakan tindakan yang biasa dilakukan atau tindakan kini yang digambarkan secara hidup. Bentuk kini dalam bahasa Indonesia paling sesuai dengan pengakuan pemazmur dalam konteks ini.
- source_word: בְּנִקָּיוֹן
  choice: dalam keadaan tak bersalah
  rationale: נִקָּיוֹן mencakup gagasan kebersihan, kemurnian, dan ketidakbersalahan. Ungkapan ini mempertahankan tekanan etisnya sekaligus membiarkan kaitannya dengan kebersihan ritual tetap terdengar melalui gambaran membasuh tangan.
- source_word: כַּפָּי
  choice: tanganku
  rationale: כף secara harfiah dapat berarti telapak tangan, tetapi dalam konteks membasuh, padanan Indonesia yang alami ialah “tangan”.
- source_word: וַאֲסֹבְבָה
  choice: lalu mengelilingi
  rationale: Akar סבב berarti pergi berkeliling atau mengelilingi. Akhiran kohortatif dapat menyiratkan tekad, tetapi dalam rangkaian puitis ini bentuk tindakan berurutan lebih alami dan tidak memaksakan nuansa modal.
- source_word: מִזְבַּחֲךָ
  choice: mezbah-Mu
  rationale: Padanan baku dan jelas untuk מזבח dengan akhiran orang kedua tunggal maskulin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
theological_decisions:
- issue: Makna moral dan ritual dalam בְּנִקָּיוֹן
  choice: dalam keadaan tak bersalah
  alternative: dalam kemurnian / dalam keadaan bersih
  rationale: Konteks mazmur menonjolkan integritas moral, sedangkan tindakan membasuh tangan juga membangkitkan gagasan kebersihan ritual. Teks utama menampilkan nuansa moral, dan catatan kaki mempertahankan cakupan makna lainnya.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN / Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama pribadi. Transliterasi “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Nuansa kohortatif וַאֲסֹבְבָה
  choice: lalu mengelilingi
  alternative: dan aku hendak mengelilingi
  rationale: Bentuk kohortatif mungkin menyatakan kehendak atau tekad, tetapi di sini juga dapat berfungsi dalam urutan tindakan puitis. Terjemahan utama mempertahankan alur tanpa menetapkan nuansa tekad secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. “Mezbah” dipertahankan sebagai istilah Alkitab yang sudah dikenal. Struktur kalimat dibuat ringkas dan puitis; pronomina pada verba kedua tidak diulang karena subjeknya tetap jelas.
