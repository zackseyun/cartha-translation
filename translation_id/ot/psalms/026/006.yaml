  text: Aku membasuh tanganku dalam keadaan tidak bersalah[a] dan mengelilingi[b] mezbah-Mu, ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kemurnian” atau “dalam keadaan bersih.” Istilah Ibrani ini dapat menunjuk pada ketidakbersalahan moral maupun kebersihan ritual.
