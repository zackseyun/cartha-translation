  text: רַ֭גְלִ/י עָֽמְדָ֣ה בְ/מִישׁ֑וֹר בְּ֝/מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: id
  text: Kakiku berdiri di tanah rata[a]; dalam perhimpunan aku akan memberkati Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat yang rata”; kata Ibrani ini juga dapat mengandung nuansa kelurusan atau ketulusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: Kakiku
  rationale: Bentuk Ibrani adalah nomina tunggal dengan akhiran orang pertama tunggal. Bentuk tunggal dapat dipertahankan secara alami dalam bahasa Indonesia dan menonjolkan kestabilan pribadi pemazmur.
- source_word: עָמְדָה
  choice: berdiri
  rationale: Bentuk perfektum Qal orang ketiga feminin tunggal sesuai dengan subjek 'kakiku'. Dalam puisi, bentuk ini dapat menyatakan keadaan kini yang sudah mantap; 'berdiri' mempertahankan keteguhan itu tanpa menambahkan unsur yang tidak tersurat.
- source_word: בְּמִישׁוֹר
  choice: di tanah yang rata
  rationale: מִישׁוֹר terutama menggambarkan tempat atau tanah yang rata, tetapi dapat mengandung nuansa kelurusan atau ketulusan. Terjemahan ini mempertahankan gambaran konkret sambil membiarkan nuansa moral tetap terbuka.
- source_word: בְּמַקְהֵלִים
  choice: dalam perhimpunan-perhimpunan
  rationale: Bentuk jamak dari קהל menunjuk pada kelompok-kelompok yang berhimpun. Pengulangan bentuk jamak mempertahankan jumlah gramatikal dan menghindari pewarnaan gerejawi yang terlalu khusus.
- source_word: אֲבָרֵךְ
  choice: aku akan memuji
  rationale: Secara leksikal verba Piel ברך berarti 'memberkati'. Namun, ketika manusia mengarahkannya kepada Allah, bahasa Indonesia alami menyatakan tindakan itu sebagai 'memuji'; bentuk 'akan' mempertahankan daya deklaratif atau berorientasi ke depan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Makna בְּמִישׁוֹר sebagai gambaran tempat atau kelurusan moral
  choice: di tanah yang rata
  alternative: di tempat yang rata; dalam kelurusan
  rationale: Makna konkret dipertahankan dalam teks utama, sedangkan kemungkinan nuansa moral dicatat tanpa menjadikannya satu-satunya tafsiran.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan perbedaan antara nama tersebut dan gelar ilahi.
- issue: Ucapan manusia kepada Allah dengan verba ברך
  choice: memuji
  alternative: memberkati
  rationale: Terjemahan harfiah 'memberkati Yahweh' dapat terdengar seolah-olah manusia menganugerahkan berkat kepada Allah. 'Memuji' menyampaikan fungsi idiomatis verba ketika Allah menjadi objek, tanpa memasukkan doktrin khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Susunan paralel dipertahankan; bentuk tunggal 'kakiku' dan bentuk jamak 'perhimpunan-perhimpunan' mengikuti teks Ibrani.
