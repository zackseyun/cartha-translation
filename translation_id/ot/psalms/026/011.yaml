id: PSA.26.11
reference: Psalms 26:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֭/אֲנִי בְּ/תֻמִּ֥/י אֵלֵ֗ךְ פְּדֵ֣/נִי וְ/חָנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/011.yaml
  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: id
  text: Namun aku sendiri akan berjalan dalam integritasku[a]; tebuslah aku dan bermurah hatilah kepadaku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketulusanku,” “keadaanku yang tak bercela,” atau “ketidakbersalahanku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kasihanilah aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku sendiri
  rationale: Kata penghubung dan pronomina mandiri menandai kontras sekaligus penegasan. “Namun aku sendiri” menyampaikan keduanya secara wajar dalam bahasa Indonesia.
- source_word: בְּתֻמִּי
  choice: dalam integritasku
  rationale: תֻּם menunjuk pada keutuhan, ketulusan, atau keadaan tak bercela dalam perilaku moral. “Integritas” mempertahankan kekuatan etisnya tanpa dengan sendirinya menyatakan bahwa pemazmur sama sekali tanpa dosa.
- source_word: אֵלֵךְ
  choice: akan berjalan
  rationale: הלך secara harfiah berarti “berjalan” dan di sini juga menggambarkan cara hidup. Metafora Ibrani dipertahankan karena tetap mudah dipahami dalam bahasa Indonesia.
- source_word: פְּדֵנִי
  choice: tebuslah aku
  rationale: פדה berarti menebus atau membebaskan dengan gagasan pelepasan dari kesusahan atau belenggu. “Tebuslah” mempertahankan bobot leksikalnya lebih baik daripada ungkapan umum “lepaskanlah”.
- source_word: וְחָנֵּנִי
  choice: dan bermurah hatilah kepadaku
  rationale: חנן menyatakan tindakan menunjukkan kemurahan atau perkenanan. Pilihan ini mempertahankan nuansa anugerah/perkenanan; “kasihanilah aku” tetap dicatat sebagai kemungkinan.
theological_decisions:
- issue: Makna pengakuan pemazmur tentang תֻם
  choice: Ayat ini menyatakan integritas atau kelurusan hidup pemazmur, bukan secara eksplisit klaim bahwa ia sama sekali tanpa dosa.
  alternative: Klaim yang lebih kuat bahwa pemazmur tidak bercela atau tidak bersalah.
  rationale: Dalam konteksnya, pemazmur membedakan jalan hidupnya dari orang fasik, tetapi tetap memohon penebusan dan kemurahan. “Integritas” mempertahankan ketegangan antara pengakuan moral itu dan permohonannya akan anugerah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora “berjalan” dipertahankan, sedangkan “aku sendiri” mengungkapkan penekanan dan kontras dalam teks Ibrani. Penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
