base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: id
  text: Dari Daud. Belalah aku, ya Yahweh,[a] sebab aku telah hidup dengan integritas,[b] dan aku telah percaya kepada Yahweh; aku tidak akan tergelincir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hakimilah aku, ya Yahweh.” Kata Ibrani yang dipakai dapat berarti “menghakimi”, tetapi dalam konteks ini mengandung permohonan agar keputusan diberikan untuk membenarkan pemazmur.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dalam ketidakbercelaanku.” Istilah Ibrani menunjuk pada integritas, keutuhan, atau perilaku yang tidak bercela.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “aku tidak akan terhuyung” atau “aku tidak akan goyah.” Ungkapan Ibrani menggambarkan tergelincir atau kehilangan pijakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Konstruksi לְ dengan nama Daud dalam judul mazmur dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan. “Dari Daud” mempertahankan keluasan relasi itu secara wajar dalam bahasa Indonesia.
- source_word: שָׁפְטֵנִי
  choice: Belalah aku
  rationale: Imperatif שׁפט secara harfiah dapat berarti “hakimilah aku”, tetapi dalam permohonan hukum ini pemazmur meminta keputusan yang membenarkannya. “Belalah aku” menyampaikan makna vindikasi tanpa meniadakan nuansa penghakiman, yang dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: בְּתֻמִּי
  choice: dengan integritas
  rationale: תֹּם/תֻּמָּה menyatakan keutuhan moral, ketulusan, atau perilaku tak bercela. “Integritas” mempertahankan klaim moral pemazmur tanpa menyiratkan kesempurnaan tanpa dosa.
- source_word: הָלַכְתִּי
  choice: aku telah hidup
  rationale: Secara harfiah berarti “aku telah berjalan”, suatu metafora Ibrani bagi cara hidup. “Telah hidup” mengungkapkan maknanya secara alami dalam bahasa Indonesia modern.
- source_word: בָּטַחְתִּי
  choice: aku telah percaya
  rationale: בטח menyatakan kepercayaan dan kebergantungan yang mantap.
- source_word: לֹא אֶמְעָד
  choice: tanpa goyah
  rationale: מעד menggambarkan terpeleset atau kehilangan pijakan. Dengan mengaitkannya pada tindakan percaya, “tanpa goyah” mempertahankan gambaran keteguhan sekaligus menghasilkan kalimat Indonesia yang alami; kemungkinan pembacaan sebagai akibat atau keyakinan masa depan dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Klaim pemazmur tentang תֻם
  choice: integritas
  alternative: ketidakbercelaan
  rationale: “Integritas” menjaga klaim pemazmur mengenai keutuhan dan kelurusan hidup tanpa mengubahnya menjadi klaim kesempurnaan moral mutlak.
- issue: Hubungan לֹא אֶמְעָד dengan pernyataan kepercayaan
  choice: aku telah percaya kepada Yahweh tanpa goyah
  alternative: aku telah percaya kepada Yahweh; aku tidak akan tergelincir
  rationale: Bentuk Ibrani dapat dipahami sebagai pernyataan bahwa kepercayaannya tidak goyah atau sebagai keyakinan bahwa ia tidak akan tergelincir. Teks utama memilih hubungan adverbial yang alami, sementara catatan kaki mempertahankan alternatif futuratif dan metafora pijakan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Metafora Ibrani “berjalan” dialihkan menjadi “hidup” agar alami; citra kehilangan pijakan dipertahankan melalui catatan kaki. Semua penanda catatan kaki ditempatkan pada unsur terkait dalam teks utama.
