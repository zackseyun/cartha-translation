  yaml_path: translation/ot/psalms/026/004.yaml
  text: I have not sat with men of falsehood[a], and I do not go in with those who conceal themselves.
translation:
  language: id
  text: 'Aku tidak duduk bersama orang-orang dusta,

    dan aku tidak bergaul dengan orang-orang yang menyembunyikan siapa diri mereka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan bersama orang-orang yang tersembunyi aku tidak masuk.” Ungkapan Ibrani ini kemungkinan menunjuk kepada orang-orang yang menyembunyikan watak atau maksud mereka yang sebenarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: duduk
  rationale: Makna dasarnya ialah “duduk, tinggal”; bersama עִם, ungkapan ini juga menyiratkan menemani atau bergaul. “Duduk bersama” mempertahankan gambaran Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: מְתֵי שָׁוְא
  choice: orang-orang yang hidup dalam kepalsuan
  rationale: מְתֵי berarti “orang-orang,” sedangkan שָׁוְא dapat berarti kepalsuan, kesia-siaan, atau tipu daya. Pilihan ini menyampaikan watak dan lingkungan hidup yang ditandai kepalsuan tanpa membatasinya hanya pada tindakan berbohong.
- source_word: נַעֲלָמִים
  choice: orang-orang yang menyembunyikan siapa diri mereka
  rationale: Bentuk ini berasal dari akar עלם, “menyembunyikan/tersembunyi,” dan kemungkinan menunjuk kepada orang yang menutupi watak atau maksud sebenarnya. Terjemahan ini lebih jelas daripada “orang-orang tersembunyi” dan tidak seinterpretatif “orang-orang munafik.”
- source_word: אָבוֹא
  choice: bergaul
  rationale: בוא secara harfiah berarti “datang, pergi, masuk.” Dengan עִם dan dalam kesejajaran dengan “duduk bersama,” konteksnya menyiratkan masuk ke dalam pergaulan mereka. “Bergaul” mengungkapkan fungsi idiomatis tersebut secara alami.
- source_word: וְעִם
  choice: dan ... dengan
  rationale: Konjungsi dan preposisi ini menghubungkan klausa kedua secara sejajar dengan klausa pertama; dalam bahasa Indonesia, pola “dan ... dengan” dinyatakan secara alami melalui “dan ... bergaul dengan.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Orang pertama “Aku” sesuai dengan suara pribadi pemazmur. Paralelisme kedua klausa dipertahankan, sedangkan klausa kedua diterjemahkan secara idiomatis agar jelas bagi pembaca umum.
