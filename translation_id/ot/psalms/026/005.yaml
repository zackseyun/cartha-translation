  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Kata ganti 'Aku' mengikuti suara pribadi pemazmur. 'Duduk bersama' mempertahankan gambaran konkret Ibrani tentang pergaulan atau keberpihakan tanpa mempersempit maknanya menjadi tinggal menetap.
