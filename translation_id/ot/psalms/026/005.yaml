  text: שָׂ֭נֵאתִי קְהַ֣ל מְרֵעִ֑ים וְ/עִם רְ֝שָׁעִ֗ים לֹ֣א אֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/005.yaml
  text: I hate the assembly of evildoers[a], and I will not sit with the wicked.
translation:
  language: id
  text: Aku membenci kumpulan orang yang berbuat jahat[a], dan aku tidak akan duduk bersama orang fasik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah membenci kumpulan orang yang berbuat jahat.” Bentuk perfektif Ibrani dapat dipahami dengan orientasi masa lampau, tetapi di sini kemungkinan besar menyatakan sikap pemazmur yang sudah menetap.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Aku membenci
  rationale: Bentuk Qal perfektif orang pertama tunggal menyatakan sikap pemazmur yang telah menetap; bentuk kini bahasa Indonesia secara alami menyampaikan sikap yang terus berlaku.
- source_word: קְהַל
  choice: kumpulan
  rationale: Menunjuk pada kelompok yang berhimpun. 'Kumpulan' alami dalam bahasa Indonesia dan tidak membawa nuansa ibadah yang dapat melekat pada 'jemaat'.
- source_word: מְרֵעִים
  choice: orang yang berbuat jahat
  rationale: Partisip yang dipakai secara substantival untuk orang-orang yang dicirikan oleh perbuatan jahat; frasa ini jelas dan alami.
- source_word: וְעִם
  choice: dan ... bersama
  rationale: Gabungan konjungsi dan preposisi menghubungkan larik kedua dengan yang pertama; dalam bahasa Indonesia preposisinya menyatu secara alami dengan 'duduk bersama'.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Mengacu kepada orang-orang yang jahat secara moral; 'orang fasik' ringkas, bermartabat, dan mempertahankan kesejajaran dengan pelaku kejahatan.
- source_word: לֹא אֵשֵׁב
  choice: aku tidak akan duduk
  rationale: Bentuk imperfektif dengan penyangkalan menyatakan tekad atau penolakan yang tetap. Terjemahan ini mempertahankan citra duduk dan nuansa kehendaknya.
theological_decisions: []
