  source_fidelity: Terjemahan secara tepat mencerminkan kedua larik Ibrani. "Aku membenci" menangkap perfektum שָׂנֵאתִי sebagai sikap yang menetap tanpa meniadakan alternatif lampau yang dicatat dalam catatan kaki. "Kumpulan orang yang berbuat jahat" menyampaikan קְהַל מְרֵעִים sebagai kelompok yang berhimpun, dan "aku tidak akan duduk bersama orang fasik" mempertahankan penyangkalan imperfektif yang bernuansa penolakan/tekad serta citra pergaulan dari יָשַׁב עִם.
