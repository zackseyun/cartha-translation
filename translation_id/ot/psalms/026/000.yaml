source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: id
  text: 'Dari Daud.[a]


    Hakimilah aku, ya Yahweh,[b] sebab aku telah hidup dalam integritasku,[c] dan aku telah percaya kepada Yahweh; aku tidak akan goyah.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat juga dipahami sebagai “Milik Daud,” “Untuk Daud,” atau “Tentang Daud.”
    reason: source_ambiguity
  - marker: b
    text: Atau “Berilah aku keadilan” atau “Nyatakanlah aku benar.” Verba Ibrani berarti “menghakimi,” tetapi dalam konteks ini dapat berarti memberikan keputusan yang membenarkan pemazmur.
    reason: lexical_alternative
  - marker: c
    text: Atau “dalam ketulusanku” atau “dengan tidak bercela.” Istilah Ibrani menunjuk pada integritas, keutuhan, atau perilaku yang tidak bercela.
    reason: lexical_alternative
  - marker: d
    text: Atau “aku tidak akan tergelincir” atau “aku tidak akan terhuyung.” Gambaran Ibraninya adalah kehilangan pijakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan ini secara tradisional menandai hubungan mazmur dengan Daud, tetapi preposisi Ibrani dapat menunjukkan karya, kepunyaan, persembahan, atau kaitan dengan Daud; terjemahan singkat mempertahankan keluasan itu.
- source_word: שָׁפְטֵנִי
  choice: Hakimilah aku
  rationale: Mempertahankan arti dasar verba 'menghakimi/memberi keputusan' tanpa langsung memastikan bahwa pemazmur meminta pembenaran, meskipun konteks memungkinkan arti tersebut.
- source_word: בְּתֻמִּי הָלַכְתִּי
  choice: aku telah hidup dalam ketulusanku
  rationale: Verba harfiah 'berjalan' merupakan idiom bagi cara hidup; תֹּם menunjuk pada keutuhan moral, integritas, atau kelakuan yang tidak bercela.
- source_word: לֹא אֶמְעָד
  choice: aku tidak akan goyah
  rationale: Mengungkapkan gambaran kehilangan pijakan secara alami dalam bahasa Indonesia sambil mempertahankan keyakinan pemazmur.
theological_decisions:
- issue: Permohonan agar Allah menghakimi pemazmur
  choice: Hakimilah aku
  alternative: Nyatakanlah aku benar / Berilah aku keadilan
  rationale: Pilihan utama tidak mengubah permohonan menjadi klaim pembenaran yang sudah pasti; kemungkinan keputusan yang menguntungkan dijelaskan dalam catatan.
- issue: Klaim ketulusan pemazmur
  choice: dalam ketulusanku
  alternative: dalam keadaanku yang tidak bercela
  rationale: Menghindari pembacaan bahwa pemazmur mengaku mutlak tanpa dosa; istilah sumber menekankan integritas atau keutuhan perilaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama ilahi ditampilkan sebagai “Yahweh” untuk mewakili יהוה secara langsung. Idiom Ibrani “berjalan” dialihkan menjadi “hidup” agar alami, sedangkan ambiguitas penting pada permohonan penghakiman dan klaim integritas dipertahankan serta dijelaskan melalui catatan kaki.
