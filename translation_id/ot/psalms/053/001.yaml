  text: אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽ֝שְׁחִ֗יתוּ וְ/הִֽתְעִ֥יבוּ עָ֝֗וֶל אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: id
  text: Orang bebal berkata dalam hatinya, “Tidak ada Allah.” Mereka telah bertindak bejat dan melakukan kezaliman yang menjijikkan[a]; tidak ada seorang pun yang berbuat baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melakukan kesalahan yang menjijikkan”; atau: “membuat perbuatan mereka menjijikkan.” Bahasa Ibrani memadukan kata kerja yang menyatakan sesuatu yang keji atau menjijikkan dengan kata benda yang berarti kesalahan, kezaliman, atau ketidakadilan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: orang bebal
  rationale: Istilah ini menunjuk bukan sekadar kepada orang yang kurang cerdas, melainkan kepada orang yang rusak secara moral dan menolak Allah. “Orang bebal” mempertahankan bobot etis istilah Ibrani sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: בְּלִבּוֹ
  choice: dalam hatinya
  rationale: Ungkapan Ibrani ini menunjuk kepada pikiran dan sikap batin. Terjemahan ini mempertahankan gambaran antropologis teks dan bentuk maskulin tunggal yang merujuk kepada “orang bebal” sebagai sosok perwakilan.
- source_word: אֵין אֱלֹהִים
  choice: Tidak ada Allah
  rationale: Frasa ini menyatakan penyangkalan terhadap keberadaan Allah dalam kerangka teologis Israel. “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: הִשְׁחִיתוּ
  choice: mereka telah bertindak bejat
  rationale: Kata kerja jamak ini menggambarkan perilaku atau keadaan moral yang rusak. “Bertindak bejat” menghindari kesan kerusakan fisik yang dapat timbul dari terjemahan harfiah “menjadi rusak”.
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: dan melakukan kezaliman yang menjijikkan
  rationale: Gabungan kata kerja yang menyatakan sesuatu yang keji atau menjijikkan dengan nomina yang berarti kesalahan, kezaliman, atau ketidakadilan diterjemahkan secara alami tanpa menghilangkan kedua unsur maknanya.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: tidak ada seorang pun yang berbuat baik
  rationale: Terjemahan ini menyampaikan secara idiomatis ketiadaan orang yang melakukan kebaikan dan tetap dekat dengan konstruksi partisipial Ibrani.
theological_decisions:
- issue: Peralihan dari “orang bebal” tunggal kepada kata kerja jamak
  choice: Mempertahankan bentuk tunggal pada klausa pertama, lalu memakai “mereka” pada klausa berikutnya.
  alternative: Menyeragamkan seluruh ayat menjadi bentuk tunggal atau seluruhnya menjadi bentuk jamak.
  rationale: Teks Ibrani sendiri beralih dari sosok tunggal yang mewakili golongan tertentu kepada gambaran jamak tentang orang-orang semacam itu. Peralihan retoris ini tidak diharmoniskan.
- issue: Bentuk maskulin tunggal pada “dalam hatinya”
  choice: Memakai “hatinya” dengan anteseden tunggal “orang bebal”.
  alternative: Mengubahnya menjadi bentuk jamak atau ungkapan tanpa rujukan personal.
  rationale: Akhiran Ibrani berbentuk maskulin tunggal dan merujuk langsung kepada sosok perwakilan pada awal ayat; bahasa Indonesia tidak perlu menambahkan penanda gender yang tidak dinyatakan secara leksikal.
- issue: Cakupan pernyataan “tidak ada seorang pun yang berbuat baik”
  choice: Membiarkan cakupannya mengikuti peralihan retoris dalam ayat tanpa menambahkan penjelasan pembatas atau universal.
  alternative: Secara eksplisit membatasi pernyataan itu hanya kepada golongan orang bebal, atau memperluasnya secara teologis kepada seluruh umat manusia.
  rationale: Teks ayat ini tidak menyatakan batas cakupan tersebut secara eksplisit. Terjemahan mempertahankan ketegangan dan tidak memasukkan kesimpulan doktrinal dari luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang bebal” mempertahankan nuansa moral tradisional tanpa menjadi arkais; “bertindak bejat” dan “kezaliman yang menjijikkan” menyampaikan kerusakan etis dengan jelas. Tanda catatan kaki ditempatkan pada frasa yang memang dijelaskannya.
