  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: id
  text: Di sana mereka sangat ketakutan[a], padahal tidak ada yang perlu ditakuti, sebab Allah menyerakkan tulang-tulang orang yang berkemah mengepungmu.[b] Engkau telah mempermalukan mereka[c], sebab Allah telah menolak mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mereka takut dengan ketakutan.” Bahasa Ibrani memakai kata kerja dan kata benda yang seakar untuk memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang berkemah di sekelilingmu” atau “pengepungmu.” Akhiran “-mu” dalam bahasa Ibrani berbentuk feminin tunggal; pihak yang dituju tidak disebutkan secara eksplisit dalam ayat ini.
    reason: lexical_alternative
  - marker: c
    text: Teks beralih dari berbicara tentang Allah sebagai orang ketiga (“Allah menyerakkan”) kepada sapaan orang kedua maskulin tunggal (“Engkau telah mempermalukan”). Peralihan puitis ini dipertahankan. Dalam konteksnya, sapaan itu paling mungkin ditujukan kepada Allah, tetapi perubahan mendadak ini tidak diperhalus dalam terjemahan.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Di sana
  rationale: Adverbia tempat ini membuka adegan secara mendadak; “di sana” mempertahankan arti lugas dan daya puitisnya.
- source_word: פָּחֲדוּ פַחַד
  choice: mereka sangat ketakutan
  rationale: Gabungan kata kerja dan kata benda seakar memberi penekanan. Ungkapan alami bahasa Indonesia “sangat ketakutan” menyampaikan intensitas itu.
- source_word: לֹא הָיָה פַחַד
  choice: padahal tidak ada yang perlu ditakuti
  rationale: Klausa ini menyatakan bahwa tidak ada alasan atau objek nyata yang patut ditakuti. “Padahal” mempertahankan pertentangan yang tajam dengan ketakutan mereka.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk Ibrani ini merujuk secara tunggal kepada Allah Israel dan diterjemahkan dengan padanan baku bahasa Indonesia.
- source_word: פִּזַּר
  choice: menyerakkan
  rationale: Bentuk piel menyatakan tindakan menyebarkan dengan kuat; “menyerakkan” cocok dengan gambaran tulang-tulang musuh yang dikalahkan.
- source_word: עַצְמוֹת
  choice: tulang-tulang
  rationale: Bentuk jamak konkret dipertahankan untuk menjaga gambaran kekalahan dan kematian dalam teks.
- source_word: חֹנָךְ
  choice: orang yang berkemah mengepungmu
  rationale: Partisip dari חנה berarti berkemah. Konteks tulang yang diserakkan menunjukkan perkemahan yang bermusuhan; “mengepungmu” menyampaikan fungsi permusuhan itu tanpa menggantinya dengan istilah militer yang terlalu khusus.
- source_word: הֱבִשֹׁתָה
  choice: Engkau mempermalukan mereka
  rationale: Bentuk hiphil orang kedua maskulin tunggal berarti menyebabkan malu atau mempermalukan. Objek “mereka” tersirat dari konteks dan diperlukan agar kalimat Indonesia lengkap.
- source_word: מְאָסָם
  choice: telah menolak mereka
  rationale: Kata מאס menyatakan penolakan, kadang disertai penghinaan. “Menolak” mempertahankan arti pokok tanpa menambahkan kadar emosi yang tidak pasti.
theological_decisions:
- issue: Peralihan persona dan pihak yang disapa
  choice: 'Mempertahankan peralihan dari penyebutan Allah sebagai orang ketiga kepada sapaan langsung kepada-Nya: “Engkau mempermalukan mereka.”'
  alternative: Menyeragamkan semuanya menjadi orang ketiga, “Allah mempermalukan mereka,” atau memahami “Engkau” sebagai sapaan kepada Sion/Yerusalem.
  rationale: Bentuk הֱבִשֹׁתָה adalah orang kedua maskulin tunggal, sedangkan akhiran pada חֹנָךְ adalah feminin tunggal. Peralihan mendadak cocok dengan puisi Ibrani dan tidak patut dihaluskan tanpa penjelasan. Klausa berikutnya, “sebab Allah telah menolak mereka,” mendukung kemungkinan bahwa penyair beralih sejenak kepada sapaan langsung kepada Allah, tetapi identitas pihak yang disapa tetap diberi catatan karena sintaksisnya mendadak.
- issue: Makna permusuhan dalam חֹנָךְ
  choice: orang yang berkemah mengepungmu
  alternative: orang yang berkemah di sekelilingmu; pengepungmu
  rationale: Konteks penyerakan tulang dan penolakan oleh Allah menunjukkan bahwa perkemahan tersebut bermusuhan. Terjemahan mempertahankan citra “berkemah” sekaligus menjelaskan fungsi pengepungan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan puitis serta peralihan persona dalam teks Masoret dipertahankan, sementara ungkapan seakar dan nuansa pengepungan dijelaskan melalui catatan kaki.
