  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: id
  text: Tidakkah para pelaku kejahatan[a] itu mengerti—mereka yang melahap umatku[c] seperti orang makan roti?[b] Mereka tidak berseru kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang berbuat jahat.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mereka yang memakan umatku; mereka makan roti.” Maksudnya, mereka menghabisi umat itu semudah dan sewajarnya orang makan roti.'
    reason: lexical_alternative
  - marker: c
    text: Kata “umatku” dapat dipahami sebagai ucapan Allah atau ucapan pemazmur; teks Ibrani di sini tidak menyebutkan penuturnya secara eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: Tidakkah ... mengerti
  rationale: Bentuk ini mempertahankan pertanyaan retoris yang mengharapkan jawaban ya. Dalam konteks kecaman moral, "mengerti" menyampaikan pengenalan yang seharusnya mereka miliki, tanpa mengubahnya menjadi pernyataan biasa.
- source_word: פֹּעֲלֵי אָוֶן
  choice: para pelaku kejahatan
  rationale: Ungkapan konstruksi ini menunjuk kepada orang-orang yang melakukan atau mengerjakan kejahatan. Pilihan ini mempertahankan unsur tindakan dan tetap alami dalam bahasa Indonesia.
- source_word: אֹכְלֵי עַמִּי
  choice: mereka yang melahap umatku
  rationale: '"Melahap" mempertahankan metafora makan sekaligus menyampaikan penindasan yang rakus dan menghancurkan. Bentuk orang pertama pada "umatku" dipertahankan tanpa menetapkan siapa penuturnya.'
- source_word: אָכְלוּ לֶחֶם
  choice: seperti makan roti
  rationale: Teks Ibrani secara harfiah menjajarkan tindakan memakan umat dengan memakan roti. Kata "seperti" menyatakan daya banding yang tersirat dan menghasilkan bahasa Indonesia yang jelas.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Meskipun bentuk Ibraninya secara morfologis jamak, dalam konteks ini kata tersebut merujuk kepada Allah Israel yang esa. "Allah" adalah padanan baku dalam bahasa Indonesia.
- source_word: לֹא קָרָאוּ
  choice: Mereka tidak berseru kepada
  rationale: Dalam hubungan dengan Allah, verba קרא menyatakan tindakan berseru atau memanggil dalam permohonan maupun ibadah. Kala kini sesuai dengan gambaran umum tentang perilaku mereka.
theological_decisions:
- issue: Rujukan penutur dalam עַמִּי, "umatku"
  choice: Mempertahankan bentuk orang pertama "umatku" tanpa mengidentifikasi penuturnya
  alternative: Menulis "umat-Ku" sebagai ucapan langsung Allah, atau menjelaskan bahwa pemazmurlah yang berbicara
  rationale: Akhiran Ibrani menunjukkan orang pertama tunggal, tetapi baris ini tidak menyebutkan secara eksplisit apakah Allah atau pemazmur yang berbicara. Huruf kecil dipakai agar kapitalisasi tidak memutuskan ambiguitas yang tidak diselesaikan teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda pisah mempertahankan aposisi yang memperinci para pelaku kejahatan. "Melahap" menghidupkan metafora tanpa menjadi kasar. Bentuk "umatku" sengaja tidak dikapitalisasi untuk menjaga ketidakjelasan identitas penutur; catatan kaki menjelaskannya.
