id: PSA.53.6
reference: Psalms 53:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשֻׁע֪וֹת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב אֱ֭לֹהִים שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: id
  text: Kiranya keselamatan Israel datang dari Sion! Ketika Allah memulihkan keadaan umat-Nya[a], biarlah Yakub bersorak, biarlah Israel bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika Allah membawa kembali umat-Nya yang tertawan” atau “ketika Allah memulihkan umat-Nya dari penawanan.” Idiom Ibrani ini dapat berarti pemulihan dari kesusahan secara umum, yang sering juga mencakup kepulangan dari penawanan.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Kiranya
  rationale: Ungkapan idiomatis ini menyatakan kerinduan atau harapan, bukan pertanyaan harfiah. “Kiranya” menyampaikan nuansa optatif secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: מִצִּיּוֹן
  choice: dari Sion
  rationale: Preposisi מִן menandai sumber atau asal. “Dari Sion” alami dalam bahasa Indonesia dan tetap mempertahankan Sion sebagai sumber datangnya keselamatan.
- source_word: יְשֻׁעוֹת יִשְׂרָאֵל
  choice: keselamatan Israel
  rationale: Walaupun יְשֻׁעוֹת berbentuk jamak, di sini kata itu dapat berfungsi sebagai jamak abstrak atau intensif. Bentuk tunggal “keselamatan” paling alami, sedangkan “Israel” dapat menyatakan pihak yang menerima atau memiliki keselamatan itu.
- source_word: בְּשׁוּב אֱלֹהִים
  choice: Ketika Allah memulihkan
  rationale: Infinitif dengan בְּ dapat menyatakan waktu, yaitu “ketika”. Dalam kolokasi dengan שְׁבוּת, verba שׁוב menyampaikan tindakan pemulihan atau pembalikan keadaan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Teks memakai אֱלֹהִים, bukan nama ilahi YHWH. “Allah” adalah padanan baku untuk God dalam bahasa Indonesia.
- source_word: שְׁבוּת עַמּוֹ
  choice: keadaan umat-Nya
  rationale: Dalam idiom שׁוב שׁבות, שְׁבוּת dapat menunjuk pada keadaan buruk yang dipulihkan, termasuk tetapi tidak terbatas pada pembuangan atau penawanan. “Memulihkan keadaan umat-Nya” menyampaikan cakupan idiom yang luas dan alami dalam bahasa Indonesia.
- source_word: יָגֵל
  choice: biarlah Yakub bersorak
  rationale: Yiqtol ini dibaca selaras dengan nada harapan pada pembukaan ayat. “Bersorak” mempertahankan kegembiraan yang kuat dan membedakannya dari verba paralel berikutnya.
- source_word: יִשְׂמַח
  choice: biarlah Israel bersukacita
  rationale: Bentuk ini diterjemahkan sebagai harapan, bukan kepastian waktu mendatang, dan “bersukacita” menjaga variasi leksikal dalam paralelisme puitis.
theological_decisions:
- issue: Makna idiom שׁוּב שְׁבוּת
  choice: memulihkan keadaan umat-Nya
  alternative: membawa kembali umat-Nya yang tertawan; memulihkan umat-Nya dari penawanan
  rationale: Idiom Ibrani ini sering berarti membalikkan kemalangan atau memulihkan keadaan, tetapi dalam konteks tertentu dapat mengacu lebih khusus pada kepulangan dari penawanan. Teks utama mempertahankan arti yang luas, sementara kemungkinan arti harfiah terkait penawanan dicatat dalam catatan kaki.
- issue: Nilai modal יָגֵל dan יִשְׂמַח
  choice: biarlah ... bersorak; biarlah ... bersukacita
  alternative: Yakub akan bersorak; Israel akan bersukacita
  rationale: Dalam kesinambungan dengan ungkapan kerinduan מִי יִתֵּן, kedua bentuk yiqtol dapat menyampaikan harapan atau ajakan puitis. Terjemahan “biarlah” mempertahankan nada optatif tanpa mengubahnya menjadi nubuat yang pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Kiranya” mempertahankan nada kerinduan; “bersorak” dan “bersukacita” menjaga paralelisme dengan variasi yang wajar. Penulisan “umat-Nya” mengikuti kaidah kapitalisasi pronomina yang merujuk kepada Allah.
