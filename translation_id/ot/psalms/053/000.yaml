base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/000.yaml
  text: 'For the choir director: according to Mahalath[a]. A Maskil[b] of David[c].'
translation:
  language: id
  text: 'Untuk pemimpin musik: menurut Mahalat[a]. Maskil[b] Daud[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mungkin nama lagu atau suatu istilah musikal atau liturgis; arti “Mahalat” tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: “Maskil” adalah istilah teknis dalam judul mazmur, mungkin menunjukkan karya yang bersifat pengajaran atau perenungan.
    reason: lexical_alternative
  - marker: c
    text: Dalam bahasa Ibrani, hubungan dengan Daud dapat menunjukkan kepengarangan, keterkaitan, persembahan, atau afiliasi dengan suatu kumpulan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang mengawasi pelaksanaan musik. Pilihan ini jelas dalam bahasa Indonesia modern tanpa membatasi tugasnya hanya pada paduan suara.
- source_word: עַל
  choice: menurut
  rationale: Dalam petunjuk musikal, kata ini dapat memperkenalkan lagu, gaya, atau cara pembawaan. “Menurut” mempertahankan ketidakpastian fungsi teknisnya.
- source_word: מָחֲלַת
  choice: Mahalat
  rationale: Acuannya tidak pasti dan mungkin merupakan nama lagu atau istilah musikal/liturgis. Transliterasi menghindari terjemahan spekulatif seperti “penyakit”.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Ini adalah istilah teknis dalam judul mazmur yang arti tepatnya diperdebatkan. Transliterasi mempertahankan istilah kategori tanpa memberikan kepastian semu.
- source_word: לְדָוִד
  choice: Daud
  rationale: Susunan “Maskil Daud” alami sebagai judul ringkas dalam bahasa Indonesia dan tidak secara tegas memilih antara kepengarangan, keterkaitan, persembahan, atau afiliasi koleksi.
theological_decisions:
- issue: Status judul mazmur dan hubungan dengan Daud
  choice: Menerjemahkan judul sebagai bagian dari teks dan memakai bentuk ringkas “Maskil Daud” untuk mempertahankan keluwesan לְדָוִד.
  alternative: “Maskil karya Daud” atau “Maskil untuk Daud.”
  rationale: Teks Ibrani memuat judul ini sebagai bagian mazmur. “Karya Daud” akan menetapkan kepengarangan secara lebih tegas daripada yang diwajibkan oleh preposisi Ibrani, sedangkan “untuk Daud” akan menetapkan hubungan penerima atau peruntukan.
translation_notes:
  register: Bahasa judul dibuat ringkas, alami, dan bermartabat. Istilah teknis yang tidak pasti ditransliterasikan, sedangkan catatan kaki menjelaskan kemungkinan maknanya. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
