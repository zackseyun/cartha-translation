  text: כֻּלּ֥/וֹ סָג֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/003.yaml
  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: id
  text: 'Mereka semua telah menyimpang;

    bersama-sama mereka telah menjadi rusak[a].

    Tidak ada yang berbuat baik,

    seorang pun tidak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi cemar.” Kata kerja Ibrani ini dapat menggambarkan keadaan yang telah menjadi rusak, busuk, atau tercemar secara moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: mereka semua
  rationale: Ungkapan ini menunjuk secara kolektif kepada seluruh kelompok; “mereka semua” alami dan mempertahankan cakupan menyeluruhnya.
- source_word: סָג
  choice: telah menyimpang
  rationale: Kata kerja ini menggambarkan tindakan berbelok atau menjauh dari jalan yang benar. “Menyimpang” mempertahankan gambaran sekaligus makna moralnya tanpa mempersempit tafsir.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Kata keterangan ini menegaskan bahwa keadaan tersebut berlaku pada mereka secara kolektif.
- source_word: נֶאֱלָחוּ
  choice: telah menjadi rusak
  rationale: Bentuk Nifal menyatakan perubahan menjadi rusak, cemar, atau busuk. “Menjadi rusak” jelas dalam konteks moral dan tetap cukup luas untuk memuat nuansa kata Ibraninya.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: tidak ada yang berbuat baik
  rationale: Frasa ini menyangkal keberadaan siapa pun yang melakukan kebaikan; susunan Indonesia ini alami dan mempertahankan pernyataan mutlak teks.
- source_word: אֵין גַּם אֶחָד
  choice: seorang pun tidak
  rationale: Ungkapan ini memperkuat penyangkalan sebelumnya. “Seorang pun tidak” ringkas, tegas, dan wajar dalam puisi Indonesia.
theological_decisions:
- issue: Cakupan dakwaan moral dalam mazmur
  choice: 'Mempertahankan bahasa menyeluruh: “mereka semua,” “tidak ada,” dan “seorang pun tidak.”'
  alternative: Membatasi dakwaan hanya kepada golongan pelaku kejahatan yang sedang dibicarakan.
  rationale: Bahasa Ibrani ayat ini bersifat komprehensif. Terjemahan mempertahankan cakupan yang dinyatakan teks dalam konteks puisinya tanpa menambahkan suatu sistem doktrin yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat, dengan susunan baris yang mempertahankan paralelisme puisi Ibrani. Penanda catatan ditempatkan langsung setelah kata yang diterangkannya.
