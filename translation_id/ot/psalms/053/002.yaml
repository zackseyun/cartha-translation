id: PSA.53.2
reference: Psalms 53:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵ֫י אָדָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵ֗שׁ אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/002.yaml
  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: id
  text: Allah memandang ke bawah dari surga kepada anak-anak manusia untuk melihat apakah ada orang yang berakal budi, yang mencari Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak manusia”; ungkapan Ibrani ini merujuk kepada umat manusia secara keseluruhan.
    reason: Menjelaskan bahwa ungkapan sumber yang dipertahankan dalam teks utama bersifat kolektif dan inklusif.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk Ibrani tersebut menunjuk kepada Allah Israel yang esa; “Allah” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: מִשָּׁמַיִם
  choice: dari surga
  rationale: Bentuk Ibrani yang secara morfologis jamak lazim menunjuk pada ranah surgawi; “dari surga” alami dalam bahasa Indonesia dan mempertahankan sudut pandang dari atas.
- source_word: הִשְׁקִיף
  choice: memandang ke bawah
  rationale: Kata kerja ini menggambarkan tindakan melihat dari tempat tinggi ke arah bawah. Bentuk perfektif Ibrani diungkapkan dengan verba naratif tanpa penanda kala karena bahasa Indonesia tidak mewajibkan penandaan kala.
- source_word: עַל
  choice: kepada
  rationale: Dalam konstruksi dengan verba memandang, “kepada” secara alami menandai arah perhatian Allah terhadap manusia.
- source_word: בְּנֵי אָדָם
  choice: anak-anak manusia
  rationale: Ungkapan kolektif ini secara harfiah berarti anak-anak manusia dan mengacu kepada umat manusia secara keseluruhan; bentuk sumber dipertahankan tanpa membatasinya pada laki-laki.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Infinitif ini menyatakan tujuan tindakan Allah memandang ke bawah.
- source_word: הֲיֵשׁ
  choice: apakah ada orang
  rationale: Gabungan partikel tanya dan bentuk eksistensial menanyakan apakah terdapat seseorang dengan sifat yang disebut berikutnya.
- source_word: מַשְׂכִּיל
  choice: yang berakal budi
  rationale: Partisipel ini menunjuk kepada orang yang memiliki pengertian atau bertindak dengan wawasan; “berakal budi” mempertahankan dimensi kognitif sekaligus moral.
- source_word: דֹּרֵשׁ
  choice: yang mencari
  rationale: Partisipel ini menggambarkan orang yang mencari atau berpaling kepada Allah secara terus-menerus.
- source_word: אֶת אֱלֹהִים
  choice: Allah
  rationale: Penanda objek langsung אֶת tidak diterjemahkan tersendiri; objeknya diterjemahkan “Allah”.
theological_decisions:
- issue: Cakupan בְּנֵי אָדָם
  choice: anak-anak manusia
  alternative: umat manusia
  rationale: Ungkapan sumber bersifat kolektif dan mencakup manusia secara umum. Terjemahan utama mempertahankan citra genealogis bahasa Ibrani, sedangkan catatan menjelaskan makna kolektifnya.
- issue: Nuansa מַשְׂכִּיל
  choice: yang berakal budi
  alternative: yang bijaksana; yang bertindak bijaksana
  rationale: Bentuk partisipel dapat menekankan pemahaman maupun perilaku yang lahir dari pemahaman. “Berakal budi” menjaga keluasan nuansa itu tanpa menyempitkannya menjadi kecerdasan intelektual saja atau tindakan semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan puitis sumber dipertahankan sejauh tetap alami; pengulangan “Allah” dipertahankan untuk mengikuti teks Ibrani. Penanda catatan kaki [a] ditempatkan setelah klausa yang memuat ungkapan terkait.
