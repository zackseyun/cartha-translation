  yaml_path: translation/ot/psalms/037/002.yaml
  text: For they will quickly wither like grass[a], and fade like green herbage.
translation:
  language: id
  text: Sebab mereka akan segera layu seperti rumput[a] dan mengering seperti tumbuhan hijau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipangkas seperti rumput ... layu seperti tumbuhan hijau.” Kedua kata kerja Ibrani dalam ayat ini memiliki cakupan makna yang saling bertumpang tindih, yaitu mengering, layu, pudar, atau dipangkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi nasihat pada ayat sebelumnya; “sebab” menyatakan hubungan penjelas itu secara alami dalam bahasa Indonesia.
- source_word: כֶחָצִיר
  choice: seperti rumput
  rationale: חָצִיר lazim menunjuk pada rumput atau tumbuhan rerumputan; “rumput” merupakan padanan yang jelas dan alami bagi gambaran kefanaan ini.
- source_word: מְהֵרָה
  choice: segera
  rationale: Kata ini menekankan bahwa hal tersebut akan terjadi dalam waktu dekat; “segera” lebih alami daripada padanan yang menekankan cara berlangsungnya tindakan.
- source_word: יִמָּלוּ
  choice: akan layu
  rationale: Dalam konteks tumbuhan, verba ini menggambarkan hilangnya kesegaran atau mengering; “layu” mempertahankan citra rumput, sementara kemungkinan arti “dipangkas” dicatat dalam catatan kaki.
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: dan seperti tumbuhan hijau
  rationale: Gabungan ini menunjuk pada tumbuhan yang hijau dan segar. “Tumbuhan hijau” mudah dipahami serta menghindari pengulangan kata “rumput”.
- source_word: יִבּוֹלוּן
  choice: mengering
  rationale: Verba ini menyatakan tumbuhan yang menjadi layu atau kering. “Mengering” melengkapi “layu” tanpa menghilangkan paralelisme gambaran.
