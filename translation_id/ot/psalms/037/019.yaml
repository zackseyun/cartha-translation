  text: לֹֽא יֵ֭בֹשׁוּ בְּ/עֵ֣ת רָעָ֑ה וּ/בִ/ימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: id
  text: Mereka tidak akan dipermalukan[a] pada masa kesusahan[b], dan pada hari-hari kelaparan mereka akan kenyang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan malu.” Kata Ibrani ini dapat menunjuk pada mengalami malu atau dipermalukan.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada masa malapetaka” atau “pada masa kemalangan.” Kata ini menunjuk pada kesusahan atau bencana, bukan kejahatan moral.
    reason: lexical_alternative
  - marker: c
    text: Atau “mereka akan dipuaskan,” “mereka akan menjadi kenyang,” atau “mereka akan makan sampai puas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: tidak akan dipermalukan
  rationale: Verba בושׁ dapat menunjuk pada mengalami malu atau dipermalukan akibat harapan yang gagal. Bentuk ini mempertahankan nuansa hasil atau keadaan yang menimpa mereka, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: בְּעֵת רָעָה
  choice: pada masa kesusahan
  rationale: Dalam konteks ini רָעָה berarti kemalangan atau keadaan buruk, bukan kejahatan moral. 'Masa kesusahan' alami, luas, dan sesuai dengan jaminan pemeliharaan dalam mazmur ini.
- source_word: וּבִימֵי רְעָבוֹן
  choice: dan pada hari-hari kelaparan
  rationale: Frasa konstruksi Ibrani menyatakan masa-masa kelaparan. Bentuk jamak 'hari-hari' dipertahankan, sedangkan 'kelaparan' dapat mencakup paceklik atau kekurangan pangan yang parah.
- source_word: יִשְׂבָּעוּ
  choice: mereka akan dikenyangkan
  rationale: Verba שׂבע berarti menjadi kenyang atau mendapat makanan sampai cukup. Bentuk 'dikenyangkan' menyampaikan kecukupan pangan secara konkret dan mempertahankan nuansa keadaan yang dihasilkan tanpa menyebut pelaku secara eksplisit.
theological_decisions:
- issue: Pelaku yang mencukupi kebutuhan mereka tidak disebutkan secara eksplisit dalam verba יִשְׂבָּעוּ.
  choice: Menggunakan bentuk pasif 'akan dikenyangkan' tanpa menambahkan 'oleh Allah'.
  alternative: Allah akan mengenyangkan mereka.
  rationale: Konteks mazmur menyiratkan pemeliharaan ilahi, tetapi teks ayat ini sendiri tidak menyebut pelakunya. Terjemahan tidak memperjelas sesuatu yang dibiarkan implisit dalam bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Paralelisme dua baris dipertahankan. 'Dikenyangkan' dipilih daripada 'dipuaskan' karena konteks kelaparan menjadikan kecukupan makanan sebagai makna utama.
