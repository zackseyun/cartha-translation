  text: שְׁמָר תָּ֭ם וּ/רְאֵ֣ה יָשָׁ֑ר כִּֽי אַחֲרִ֖ית לְ/אִ֣ישׁ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: id
  text: Perhatikanlah orang yang tidak bercela dan lihatlah orang yang lurus, sebab ada masa depan bagi orang yang hidup dalam damai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “masa depan” juga dapat berarti “akhir” atau “hasil akhir”; sebagian orang memahaminya sebagai “keturunan”. Ungkapan Ibrani yang diterjemahkan “orang yang hidup dalam damai” juga dapat menunjuk pada orang yang dicirikan oleh kesejahteraan atau keutuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: Perhatikanlah
  rationale: Imperatif שׁמר di sini berarti mencermati atau memperhatikan seseorang, bukan menjaga. Bentuk ini mempertahankan daya nasihatnya secara alami dalam bahasa Indonesia.
- source_word: תָּם
  choice: orang yang tidak bercela
  rationale: תָּם menunjuk pada keutuhan dan integritas moral, bukan kesempurnaan tanpa dosa. Frasa ini juga menyatakan dengan jelas bahwa adjektiva tersebut dipakai secara substantival.
- source_word: וּרְאֵה
  choice: dan pandanglah
  rationale: Imperatif kedua ini sejajar dengan שְׁמָר. 'Pandanglah' mempertahankan kesejajaran puitis sekaligus terdengar lebih wajar daripada pengulangan 'perhatikanlah'.
- source_word: יָשָׁר
  choice: orang yang lurus
  rationale: יָשָׁר menggambarkan kelurusan moral. 'Orang yang lurus' mempertahankan pemakaian adjektiva sebagai nomina dan sejajar dengan frasa sebelumnya.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi kedua perintah tersebut.
- source_word: אַחֲרִית
  choice: masa depan
  rationale: Dalam konteks hikmat ini, אַחֲרִית menunjuk pada apa yang kelak menanti seseorang atau hasil akhirnya. 'Masa depan' menyampaikan prospek positif tanpa mempersempit maknanya menjadi keturunan atau saat kematian.
- source_word: לְאִישׁ
  choice: bagi orang
  rationale: אִישׁ adalah nomina maskulin tunggal, tetapi dalam konteks pernyataan hikmat bahasa Indonesia 'orang' secara alami mempertahankan acuan tunggal tanpa menambahkan pembedaan jenis kelamin yang tidak diperlukan untuk makna.
- source_word: שָׁלוֹם
  choice: yang suka damai
  rationale: Dalam konstruksi אִישׁ שָׁלוֹם, שָׁלוֹם mencirikan orang itu. 'Yang suka damai' merupakan ungkapan Indonesia yang alami untuk pribadi yang hidup damai, sementara cakupan 'kesejahteraan/keutuhan' dicatat dalam catatan kaki.
theological_decisions:
- issue: Acuan maskulin tunggal אִישׁ dalam pernyataan hikmat
  choice: orang
  alternative: laki-laki
  rationale: Bahasa sumber memakai nomina maskulin tunggal, tetapi konteksnya menyampaikan prinsip hikmat yang representatif. 'Orang' tetap tunggal dan tidak mengubah cakupan prinsip itu, serta lebih alami dalam bahasa Indonesia.
- issue: Makna אַחֲרִית bagi nasib orang lurus
  choice: ada masa depan
  alternative: ada akhir; ada hasil akhir; ada keturunan
  rationale: Konteks membandingkan nasib akhir orang yang hidup lurus dengan para pelanggar. 'Masa depan' mempertahankan prospek positif, sedangkan kemungkinan arti 'akhir' atau 'hasil akhir' tetap dinyatakan dalam catatan kaki.
- issue: Hubungan sintaksis אִישׁ שָׁלוֹם
  choice: orang yang suka damai
  alternative: orang yang memiliki kesejahteraan atau keutuhan
  rationale: Konstruksi ini paling wajar dipahami sebagai pencirian pribadi yang damai. Namun שָׁלוֹם memiliki cakupan semantis lebih luas, sehingga nuansa kesejahteraan dan keutuhan tidak disingkirkan, melainkan dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Dua imperatif dipertahankan secara langsung. 'Orang yang tidak bercela' menyatakan integritas moral, bukan ketidakberdosaan mutlak. Catatan kaki menggabungkan dua ambiguitas leksikal yang sungguh terdapat dalam klausa terakhir.
