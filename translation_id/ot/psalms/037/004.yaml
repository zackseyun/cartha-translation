base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: id
  text: Bersukacitalah dalam Yahweh, maka Ia akan memenuhi keinginan hatimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “permohonan hatimu.” Kata benda Ibrani ini dapat menunjuk kepada apa yang diminta maupun apa yang diinginkan dalam batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: Bergembiralah
  rationale: Bentuk Hitpael imperatif mengajak orang yang disapa untuk menemukan dan menikmati kesenangan. “Bergembiralah” menyampaikan ajakan itu secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: עַל
  choice: dalam
  rationale: Walaupun arti dasarnya “di atas/atas”, bersama kata kerja yang menyatakan kepercayaan atau kesenangan, עַל menunjuk kepada pribadi yang menjadi tumpuan kegembiraan. “Dalam” mempertahankan nuansa relasional tanpa menerjemahkan secara kaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: יִתֶּן
  choice: Ia akan memberikan
  rationale: Bentuk imperfek dengan waw dalam konteks nasihat hikmat paling wajar dipahami sebagai hasil atau janji yang mengikuti perintah sebelumnya.
- source_word: מִשְׁאֲלֹת
  choice: keinginan
  rationale: Kata ini dapat menunjuk kepada hal-hal yang diminta maupun yang diinginkan. Dalam frasa “hatimu”, “keinginan” secara alami menyampaikan kerinduan batin, sementara kemungkinan “permohonan” dicatat dalam catatan kaki.
- source_word: לִבֶּךָ
  choice: hatimu
  rationale: “Hati” merupakan padanan langsung dan alami; dalam pemikiran Ibrani cakupannya meliputi keinginan, kehendak, dan batin seseorang.
theological_decisions:
- issue: Kemungkinan pembacaan sebagai janji kemakmuran tanpa batas
  choice: Janji diterjemahkan secara langsung tanpa pembatas tambahan.
  alternative: Menambahkan “keinginan yang saleh” atau menyatakan bahwa Yahweh terlebih dahulu membentuk keinginan tersebut.
  rationale: Teks Ibrani menyatakan janji ini secara lugas. Menambahkan syarat atau penjelasan teologis ke dalam ayat akan mengatasi ketegangan yang justru perlu dipertahankan.
- issue: Penerjemahan nama ilahi
  choice: Yahweh
  alternative: TUHAN atau Jehovah
  rationale: Teks sumber secara langsung memakai Tetragramaton יְהוָה; transliterasi mempertahankan nama pribadi tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. “Bergembiralah dalam Yahweh” mempertahankan arah relasional ungkapan Ibrani, sedangkan “maka” memperjelas hubungan hasil yang tersirat dalam rangkaian nasihat hikmat tanpa menjadikannya syarat eksplisit.
