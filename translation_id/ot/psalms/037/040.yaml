source:
  edition: WLC
  text: וַֽ/יַּעְזְרֵ֥/ם יְהוָ֗ה וַֽ/יְפַ֫לְּטֵ֥/ם יְפַלְּטֵ֣/ם מֵ֭/רְשָׁעִים וְ/יוֹשִׁיעֵ֑/ם כִּי חָ֥סוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: id
  text: Yahweh menolong dan meluputkan mereka[a]; Ia meluputkan mereka dari orang-orang fasik dan menyelamatkan mereka, karena mereka berlindung pada-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyelamatkan mereka” pada kedua kemunculan kata “meluputkan”; bahasa Ibrani mengulangi verba pembebasan yang sama untuk memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: Atau “karena mereka percaya kepada-Nya”; secara lebih harfiah, bahasa Ibrani berbicara tentang berlindung pada-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיַּעְזְרֵם
  choice: menolong mereka
  rationale: Menerjemahkan עזר secara langsung dan wajar sebagai tindakan aktif Yahweh memberi pertolongan.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: meluputkan mereka; Ia meluputkan mereka
  rationale: Kedua bentuk berasal dari פלט. Pengulangan dipertahankan untuk menjaga penekanan puitis teks Ibrani.
- source_word: מֵרְשָׁעִים
  choice: dari orang-orang fasik
  rationale: רְשָׁעִים adalah bentuk jamak substantival yang menunjuk kepada orang-orang yang fasik; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: וְיוֹשִׁיעֵם
  choice: dan menyelamatkan mereka
  rationale: ישׁע menyatakan tindakan menyelamatkan atau membebaskan; 'menyelamatkan' mempertahankan keluasan dan bobot istilah itu.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi tindakan penyelamatan Yahweh.
- source_word: חָסוּ בוֹ
  choice: mereka berlindung kepada-Nya
  rationale: חסה secara harfiah menggambarkan mencari atau mendapatkan perlindungan; metafora perlindungan dipertahankan, bukan digeneralisasi menjadi sekadar 'percaya'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Pengulangan verba פלט
  choice: Pengulangan 'meluputkan mereka' dipertahankan
  alternative: Meringkasnya menjadi satu penyebutan, misalnya 'menolong dan meluputkan mereka dari orang-orang fasik'
  rationale: Pengulangan yang berdekatan merupakan ciri nyata teks Ibrani dan memberi penekanan puitis pada tindakan pembebasan Yahweh.
- issue: Makna חָסוּ בוֹ
  choice: berlindung kepada-Nya
  alternative: percaya kepada-Nya
  rationale: Pilihan utama mempertahankan gambaran konkret tentang mencari perlindungan, sedangkan 'percaya' menyampaikan implikasinya tetapi menghilangkan metafora.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Struktur paralel dan pengulangan sumber dipertahankan tanpa membuat kalimat terasa kaku.
