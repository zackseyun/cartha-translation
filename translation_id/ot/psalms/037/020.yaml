id: PSA.37.20
reference: Psalms 37:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: id
  text: 'Sebab orang-orang fasik akan binasa,

    dan musuh-musuh Yahweh seperti kemegahan padang rumput[a];

    mereka lenyap—seperti asap, mereka lenyap.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut penafsiran tradisional: “seperti lemak anak-anak domba.” Frasa Ibrani ini sulit.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan daya kausal dalam konteks.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Padanan baku dan wajar dalam konteks sastra hikmat dan mazmur bagi orang yang hidup dalam kejahatan moral.
- source_word: יֹאבֵדוּ
  choice: akan binasa
  rationale: Mempertahankan makna kehancuran atau berakhirnya keberadaan serta bentuk kala mendatang dalam konteks.
- source_word: וְאֹיְבֵי יְהוָה
  choice: dan musuh-musuh Yahweh
  rationale: Menerjemahkan konstruksi Ibrani secara langsung dan wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama diri ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: כִּיקַר כָּרִים
  choice: seperti kemegahan padang rumput
  rationale: Frasa Ibrani ini sulit. Pilihan ini memahami יקר sebagai kemegahan atau keindahan yang berharga dan כרים sebagai padang rumput, selaras dengan gambaran sesuatu yang segera lenyap.
- source_word: כָּלוּ
  choice: mereka lenyap
  rationale: כלה diulang untuk penegasan. Pengulangan padanan yang sama mempertahankan tekanan puitis tentang lenyapnya mereka sama sekali.
- source_word: בֶעָשָׁן
  choice: seperti asap
  rationale: Dalam rangkaian puitis ini, preposisi ב dipahami secara komparatif sehingga menghasilkan ungkapan Indonesia yang alami dan sesuai dengan gambaran lenyapnya asap.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama perjanjian sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Penafsiran כִּיקַר כָּרִים
  choice: seperti kemegahan padang rumput
  alternative: seperti lemak anak-anak domba
  rationale: Frasa ini sulit secara leksikal dan dapat dipahami dengan vokalisasi atau penafsiran berbeda. Bacaan utama mengikuti pengertian yang berhubungan dengan kemegahan padang rumput, sedangkan penafsiran tradisional dipertahankan dalam catatan kaki agar ambiguitas teks tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan baris yang mengikuti paralelisme ayat. Istilah “fasik” dipertahankan karena umum dalam register Alkitab Indonesia dan tetap mudah dipahami. Pengulangan “mereka lenyap” sengaja dipertahankan untuk mencerminkan repetisi Ibrani.
