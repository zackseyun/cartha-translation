  text: כִּֽי מְ֭רֵעִים יִכָּרֵת֑וּ/ן וְ/קֹוֵ֥י יְ֝הוָ֗ה הֵ֣מָּה יִֽירְשׁוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: id
  text: Sebab orang-orang yang berbuat jahat akan disingkirkan, tetapi orang-orang yang menantikan Yahweh—merekalah yang akan mewarisi negeri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bumi.” Kata Ibrani אֶרֶץ dapat berarti “negeri” maupun “bumi”; dalam konteks janji perjanjian mazmur ini, “negeri” paling sesuai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan nasihat sebelumnya dan memperkenalkan alasannya; “sebab” menyampaikan fungsi penjelas tersebut secara alami.
- source_word: מְרֵעִים
  choice: orang-orang yang berbuat jahat
  rationale: Partisipel Hifil dari רעע menunjuk kepada para pelaku kejahatan. Bentuk deskriptif ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יִכָּרֵתוּן
  choice: akan disingkirkan
  rationale: Bentuk Nifal dari כרת menyatakan bahwa mereka akan diputuskan atau dilenyapkan dari tempatnya. “Disingkirkan” mempertahankan gagasan peniadaan secara hukum tanpa memastikan bahwa yang dimaksud semata-mata kematian fisik.
- source_word: וְקֹוֵי
  choice: tetapi orang-orang yang menantikan
  rationale: Partisipel קוה menggambarkan penantian yang disertai harapan. “Tetapi” mengungkapkan pertentangan yang jelas antara kedua kelompok, sedangkan “menantikan” mempertahankan unsur kesabaran dan kepercayaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar teks mempertahankan nama pribadi yang terdapat dalam sumber Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: הֵמָּה
  choice: merekalah
  rationale: Pronomina mandiri memberi penekanan pada kelompok ini. Bentuk “merekalah” menyampaikan penekanan tersebut dengan alami.
- source_word: יִירְשׁוּ
  choice: akan mewarisi
  rationale: Kata ירשׁ dapat berarti memiliki atau mengambil milik; “mewarisi” mempertahankan nuansa janji dan perjanjian yang berulang dalam mazmur ini.
- source_word: אָרֶץ
  choice: negeri
  rationale: Dalam konteks janji perjanjian Mazmur 37, “negeri” paling langsung menyampaikan tanah yang dijanjikan, sementara kemungkinan arti yang lebih luas, “bumi,” tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan makna אָרֶץ dalam janji
  choice: negeri
  alternative: bumi
  rationale: Konteks langsung Mazmur 37 berulang kali memakai bahasa mewarisi negeri yang menggemakan janji perjanjian. Namun, karena אָרֶץ juga dapat berarti seluruh bumi, kemungkinan yang lebih luas itu tidak ditutup dan dicantumkan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan “merekalah” mempertahankan penekanan Ibrani tanpa terasa kaku; tanda pisah menandai kontras dan penekanan pada kelompok yang menantikan Yahweh.
