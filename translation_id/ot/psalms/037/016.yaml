translation:
  language: id
  text: Lebih baik sedikit yang dimiliki orang benar daripada kelimpahan yang dimiliki banyak orang fasik.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lebih baik sedikit bagi orang benar daripada kelimpahan orang fasik.” Bahasa Ibrani bersifat eliptis; makna kepunyaan dalam “yang dimiliki” tersirat.
    reason: lexical_alternative
  - marker: b
    text: Atau, “daripada kelimpahan orang-orang fasik yang banyak.” Kata “banyak” dalam bahasa Ibrani kemungkinan menerangkan “orang-orang fasik.”
    reason: previous_rendering
lexical_decisions:
- source_word: טוֹב
  choice: Lebih baik
  rationale: Dalam susunan perbandingan yang bernada amsal ini, טוֹב berfungsi sebagai ‘lebih baik’, bukan sekadar ‘baik’.
- source_word: מְעַט
  choice: sedikit
  rationale: Kata ini menunjuk pada jumlah yang kecil dan membentuk kontras langsung dengan הֲמוֹן, ‘kelimpahan’.
- source_word: לַצַּדִּיק
  choice: yang dimiliki orang benar
  rationale: Prefiks ל dalam perbandingan eliptis ini dapat menyatakan kepunyaan. Ungkapan ini membuat hubungan tersebut jelas dalam bahasa Indonesia, sedangkan bentuk tunggal ‘orang benar’ mempertahankan bentuk Ibrani.
- source_word: מֵהֲמוֹן
  choice: daripada kelimpahan
  rationale: הָמוֹן dapat berarti kelimpahan, jumlah besar, atau banyaknya sesuatu. ‘Kelimpahan’ mempertahankan cakupan yang lebih luas daripada ‘kekayaan’ dan cocok dengan kontras terhadap ‘sedikit’.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Adjektiva jamak ini dipakai secara substantival untuk menyebut orang-orang yang fasik. Bahasa Indonesia dapat memakai ‘banyak orang fasik’ secara alami tanpa harus menggandakan kata ‘orang’.
- source_word: רַבִּים
  choice: banyak
  rationale: Kata sifat jamak ini paling wajar menerangkan רְשָׁעִים, sehingga menghasilkan arti ‘banyak orang fasik’, bukan memperkuat ‘kelimpahan’.
