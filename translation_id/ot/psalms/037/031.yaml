source:
  edition: WLC
  text: תּוֹרַ֣ת אֱלֹהָ֣י/ו בְּ/לִבּ֑/וֹ לֹ֖א תִמְעַ֣ד אֲשֻׁרָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/031.yaml
  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: id
  text: Hukum Allahnya ada di dalam hatinya[a]; langkah-langkahnya tidak tergelincir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Pengajaran Allahnya ada di dalam hatinya; langkah-langkahnya tidak tersandung.”'
    reason: Alternatif leksikal untuk תּוֹרָה dan תִמְעַד.
lexical_decisions:
- source_word: תּוֹרַת
  choice: Hukum
  rationale: תּוֹרָה dapat berarti hukum, pengajaran, atau petunjuk. Dalam mazmur hikmat ini, “Hukum” mempertahankan bobot kehendak Allah yang berwibawa, sementara alternatif semantis dicatat dalam catatan kaki.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal menyatakan hubungan personal, yaitu “Allahnya”; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: בְּלִבּוֹ
  choice: ada di dalam hatinya
  rationale: Ungkapan ini menunjukkan bahwa hukum Allah telah dihayati dalam batin. “Hati” mempertahankan metafora Ibrani yang mencakup pikiran, kehendak, dan diri batiniah.
- source_word: לֹא תִמְעַד
  choice: tidak tergelincir
  rationale: מעד berarti tergelincir, goyah, atau tersandung. Dengan “langkah-langkah” sebagai subjek, “tidak tergelincir” mempertahankan metafora perjalanan hidup dan menyatakan kebenaran umum.
- source_word: אֲשֻׁרָיו
  choice: langkah-langkahnya
  rationale: Bentuk jamak ini menunjuk pada langkah-langkah seseorang, secara kiasan menggambarkan jalan atau arah hidupnya.
theological_decisions:
- issue: Makna תּוֹרָה dalam konteks hikmat
  choice: Hukum
  alternative: pengajaran; petunjuk
  rationale: “Hukum” mempertahankan daya perjanjian dan moral dari kehendak Allah yang berwibawa. Karena תּוֹרָה juga dapat berarti pengajaran atau petunjuk, keluasan maknanya dipertahankan melalui catatan kaki tanpa memaksakan tafsir denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan kesejajaran puitis dan metafora Ibrani tentang hati serta langkah kehidupan.
