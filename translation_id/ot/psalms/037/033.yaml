  yaml_path: translation/ot/psalms/037/033.yaml
  text: Yahweh will not leave him in his hand[c][b][a], nor condemn him when he is judged.
translation:
  language: id
  text: Yahweh tidak akan membiarkannya tetap berada dalam kuasa orang fasik[a], dan tidak akan menyatakannya bersalah ketika ia diadili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “meninggalkan dia di tangannya”; maksudnya, di bawah kuasa atau kendali orang fasik.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tidak akan menjatuhkan putusan bersalah atasnya ketika ia diadili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: יַעַזְבֶנּוּ
  choice: tidak akan membiarkan dia berada
  rationale: Dalam konstruksi dengan בְיָדוֹ, verba עזב menyatakan bahwa Yahweh tidak akan meninggalkan atau membiarkan orang benar tetap berada di bawah kuasa orang fasik. Pilihan ini alami dalam bahasa Indonesia tanpa menghilangkan gagasan dasarnya.
- source_word: בְיָדוֹ
  choice: dalam kuasa orang fasik
  rationale: Secara harfiah berarti 'dalam tangannya'. Dalam konteks, sufiks itu merujuk kepada orang fasik pada ayat sebelumnya, dan ungkapan 'dalam tangan' menyatakan kuasa atau kendali. Referennya dibuat eksplisit agar jelas dalam bahasa Indonesia.
- source_word: יַרְשִׁיעֶנּוּ
  choice: menyatakan dia bersalah
  rationale: 'Bentuk Hifil dari רשע di sini bersifat forensik: menyatakan seseorang bersalah atau menghukumnya sebagai pihak yang bersalah. ''Menyatakan dia bersalah'' mempertahankan nuansa putusan hukum.'
- source_word: בְּהִשָּׁפְטוֹ
  choice: ketika dia diadili
  rationale: Preposisi ב dengan infinitif konstruk dan sufiks objek paling wajar dipahami secara temporal, tanpa menentukan secara berlebihan tempat atau bentuk pengadilannya.
theological_decisions:
- issue: Rujukan kata-kata ganti dalam ayat ini
  choice: Kata ganti objek merujuk kepada orang benar, sedangkan sufiks pada 'tangannya' merujuk kepada orang fasik dalam konteks sebelumnya.
  alternative: Mempertahankan bentuk 'dalam tangannya' tanpa menjelaskan rujukannya.
  rationale: Konteks langsung Mazmur 37 mempertentangkan orang fasik dengan orang benar. Menyebut 'orang fasik' memperjelas rujukan tata bahasa tanpa menambahkan pelaku baru.
- issue: Makna yudisial pada klausa kedua
  choice: Menerjemahkan sebagai tindakan menyatakan orang benar bersalah ketika ia diadili.
  alternative: Menerjemahkan secara lebih luas sebagai memperlakukannya sebagai orang fasik atau menghukumnya.
  rationale: Gabungan bentuk Hifil רשע dengan שפט memiliki corak forensik. Terjemahan mempertahankan bahasa hukum tanpa memasukkan kategori doktrinal yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel kedua klausa dipertahankan. Istilah 'menyatakan dia bersalah' menjaga corak hukum teks Ibrani, sedangkan 'dalam kuasa orang fasik' menyampaikan idiom Ibrani secara jelas.
