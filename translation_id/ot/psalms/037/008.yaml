source:
  edition: WLC
  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: id
  text: Berhentilah marah dan tinggalkanlah murka; jangan gusar—itu hanya membawa kepada kejahatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan geram—hanya untuk berbuat jahat.” Kata kerja yang diterjemahkan “gusar” juga dapat berarti “geram” atau “menjadi panas,” dan klausa terakhir secara lebih harfiah dapat diterjemahkan “hanya untuk berbuat jahat.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: Berhentilah marah
  rationale: Imperatif הֶרֶף menyatakan berhenti atau melepaskan, sedangkan אַף secara idiomatis berarti kemarahan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: וַעֲזֹב חֵמָה
  choice: dan tinggalkanlah murka
  rationale: עֲזֹב berarti meninggalkan atau melepaskan; חֵמָה menunjuk pada amarah yang menyala atau murka. 'Murka' mempertahankan ragam puitis serta membedakannya dari 'marah' pada klausa pertama.
- source_word: אַל תִּתְחַר
  choice: jangan geram
  rationale: Bentuk hitpael dari חרה menggambarkan keadaan menjadi panas, gusar, atau geram. 'Jangan geram' ringkas, wajar, dan mempertahankan intensitas emosi tanpa mempersempit sebabnya menjadi tindakan orang lain.
- source_word: אַךְ לְהָרֵעַ
  choice: itu hanya membawa kepada kejahatan
  rationale: אַךְ membatasi hasilnya pada sesuatu yang buruk, sementara infinitif לְהָרֵעַ dapat menyatakan tujuan atau akibat. Terjemahan utama menyajikannya secara kontekstual sebagai akibat, dengan alternatif yang lebih harfiah dicatat.
theological_decisions:
- issue: Daya moral klausa terakhir
  choice: Klausa dipahami sebagai peringatan bahwa kegeraman membawa kepada kejahatan.
  alternative: '''hanya untuk berbuat jahat'''
  rationale: Konstruksi infinitif Ibrani dapat dibaca sebagai tujuan ataupun akibat. Konteks mazmur mendukung akibat, tetapi ambiguitas asli dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat, dengan kesejajaran puitis antara 'marah' dan 'murka'. Penanda catatan kaki ditempatkan setelah klausa yang memuat kedua ambiguitas terkait.
