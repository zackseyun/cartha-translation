id: PSA.37.23
reference: Psalms 37:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: id
  text: Dari TUHAN langkah-langkah seorang pria diteguhkan,[b] dan Dia berkenan pada jalan orang itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, subjeknya mungkin pria itu: “dan ia menyukai jalannya.”'
    reason: alternative_reading
  - marker: b
    text: Atau, “Langkah-langkah seorang pria diteguhkan oleh TUHAN.”
    reason: alternative_rendering
lexical_decisions:
- source_word: מֵיְהוָה
  choice: Dari TUHAN
  rationale: Preposisi מִן menyatakan sumber atau asal. Susunan ini mempertahankan penekanan awal teks Ibrani bahwa keteguhan langkah itu berasal dari TUHAN; kemungkinan nuansa pelaku dicatat dalam catatan kaki.
- source_word: מִצְעֲדֵי
  choice: langkah-langkah
  rationale: Kata ini menunjuk pada langkah atau gerak berjalan dan secara alami juga mengibaratkan perjalanan hidup.
- source_word: גֶבֶר
  choice: seorang pria
  rationale: Nomina ini berjenis maskulin dan berarti laki-laki atau pria, kadang dengan nuansa kekuatan. 'Seorang pria' alami dalam bahasa Indonesia modern tanpa menambahkan nuansa kekuatan yang tidak dituntut konteks.
- source_word: כּוֹנָנוּ
  choice: diteguhkan
  rationale: Bentuk pasif dari כון menyatakan bahwa langkah-langkah dibuat kukuh atau ditetapkan. 'Diteguhkan' mempertahankan bentuk pasif dan nuansa kestabilan.
- source_word: וְדַרְכּוֹ
  choice: jalan orang itu
  rationale: דֶּרֶךְ berarti jalan atau laku hidup. 'Orang itu' memperjelas bahwa sufiks maskulin merujuk kepada pria tersebut tanpa mengubah acuan subjek verba berikutnya.
- source_word: יֶחְפָּץ
  choice: Dia berkenan
  rationale: חפץ dapat berarti berkenan, menyukai, atau bersukacita atas sesuatu. 'Berkenan' sesuai dengan konteks perkenanan ilahi dan tetap wajar dalam ragam Alkitab modern.
theological_decisions:
- issue: Subjek tersirat dari יֶחְפָּץ ('berkenan')
  choice: 'Subjek utama dipahami sebagai TUHAN: ''Dia berkenan pada jalan orang itu.'''
  alternative: 'Subjeknya dapat dipahami sebagai pria itu: ''dan ia menyukai jalannya.'''
  rationale: Bahasa Ibrani tidak menyatakan subjek secara eksplisit. TUHAN paling masuk akal sebagai subjek yang berlanjut secara semantis, tetapi rujukan kepada pria itu tetap mungkin; karena itu alternatif dipertahankan dalam catatan kaki.
- issue: Hubungan מֵיְהוָה dengan verba pasif
  choice: 'Diterjemahkan secara harfiah sebagai sumber: ''Dari TUHAN ... diteguhkan.'''
  alternative: 'Dapat diterjemahkan sebagai pelaku: ''... diteguhkan oleh TUHAN.'''
  rationale: מִן pada מֵיְהוָה terutama menyatakan sumber atau asal, tetapi bersama verba pasif hasilnya dapat dipahami secara idiomatis sebagai pelaku ilahi. Teks utama mempertahankan bentuk sumber, sedangkan alternatif yang lebih lazim dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis. Susunan awal 'Dari TUHAN' sengaja dipertahankan untuk mencerminkan fokus teks Ibrani, meskipun lebih bertanda daripada susunan prosa biasa. 'Dia' dipakai bagi TUHAN tanpa menjadikan kapitalisasi sebagai satu-satunya penjelas acuan; objek dinyatakan sebagai 'jalan orang itu'.
