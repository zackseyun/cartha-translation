source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: id
  text: Aku pernah muda, dan sekarang aku sudah tua, tetapi belum pernah kulihat orang benar ditinggalkan atau keturunannya meminta-minta roti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mencari roti” atau “meminta roti.” Dalam konteks ini, ungkapan tersebut kemungkinan menunjuk pada meminta-minta demi pangan pokok.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: Dahulu aku muda
  rationale: Ungkapan predikatif ini secara alami menyatakan keadaan pada masa lampau dan membentuk kontras autobiografis dengan usia tua.
- source_word: גַּם זָקַנְתִּי
  choice: dan sekarang aku sudah tua
  rationale: Secara harfiah menyatakan bahwa penutur juga telah menjadi tua; 'sekarang' memperjelas perkembangan tahap hidup yang tersirat, sedangkan 'sudah tua' mencerminkan keadaan yang telah dicapai.
- source_word: וְלֹא רָאִיתִי
  choice: tetapi belum pernah kulihat
  rationale: Bentuk sempurna merangkum pengamatan sepanjang hidup sampai masa kini. 'Tetapi' menyampaikan hubungan kontras dalam konteks, dan 'belum pernah' terdengar alami dalam bahasa Indonesia.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva tunggal substantival ini merujuk secara representatif kepada seseorang yang benar; 'orang benar' alami dan tidak menambahkan jenis kelamin yang tidak perlu.
- source_word: נֶעֱזָב
  choice: ditinggalkan
  rationale: Bentuk Niphal menyatakan keadaan pasif dari עזב. 'Ditinggalkan' mempertahankan bobot makna tanpa mempersempit siapa pelakunya.
- source_word: וְזַרְעוֹ
  choice: atau keturunannya
  rationale: 'זֶרַע di sini berarti keturunan. Konjungsi diterjemahkan ''atau'' karena kedua unsur berada dalam cakupan ''belum pernah kulihat'': tidak melihat orang benar ditinggalkan ataupun keturunannya meminta-minta.'
- source_word: מְבַקֶּשׁ לָחֶם
  choice: meminta-minta makanan
  rationale: מְבַקֶּשׁ secara dasar berarti mencari atau meminta, tetapi bersama לֶחֶם dalam konteks kekurangan menunjuk pada meminta demi kebutuhan hidup. 'Meminta-minta' menyampaikan nuansa mengemis, sedangkan 'makanan' mengungkap fungsi luas לֶחֶם sebagai kebutuhan pangan pokok.
theological_decisions:
- issue: Apakah ayat ini merupakan jaminan teologis mutlak atau kesaksian pengalaman pemazmur
  choice: 'Dipertahankan sebagai pengamatan pribadi sepanjang hidup: ''belum pernah kulihat''.'
  alternative: Merumuskannya sebagai janji universal bahwa orang benar dan keturunannya tidak pernah mengalami kemelaratan.
  rationale: Teks Ibrani secara eksplisit memakai kesaksian orang pertama. Terjemahan tidak memperkuatnya menjadi pernyataan mutlak yang melampaui bentuk teks.
- issue: Cakupan hubungan antara orang benar yang ditinggalkan dan keturunannya yang meminta-minta
  choice: Menggunakan 'atau' untuk menunjukkan dua keadaan yang sama-sama tidak dilihat.
  alternative: Menggunakan 'dan', yang dapat dibaca seolah-olah hanya gabungan kedua keadaan itu yang disangkal.
  rationale: Walaupun וְ secara bentuk adalah konjungsi koordinatif, dalam cakupan negasi bahasa Indonesia 'atau' lebih jelas menyampaikan bahwa masing-masing keadaan termasuk dalam pengamatan negatif tersebut.
- issue: Representasi gender dalam צַדִּיק dan sufiks tunggal pada זַרְעוֹ
  choice: Menggunakan 'orang benar' dan 'keturunannya'.
  alternative: Menggunakan 'laki-laki benar ... keturunannya' atau menjamakkan menjadi 'orang-orang benar ... keturunan mereka'.
  rationale: '''Orang benar'' mempertahankan tunggal representatif tanpa menambahkan penandaan gender; ''-nya'' tetap mencerminkan rujukan tunggal Ibrani secara alami.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan autobiografis serta ketegangan antara kesaksian pengalaman dan kemungkinan pembacaan sebagai kaidah umum dipertahankan. Penanda catatan kaki [a] ditempatkan sesudah frasa yang diterangkannya.
