source:
  edition: WLC
  text: יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם וְ֝/נַחֲלָתָ֗/ם לְ/עוֹלָ֥ם תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: id
  text: Yahweh mengetahui hari-hari orang yang tak bercela[a], dan warisan mereka akan ada selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang tulus” atau “orang yang berintegritas.”
    reason: lexical_alternative
  - marker: b
    text: Frasa ini dapat menyiratkan bahwa warisan itu tetap ada atau terus menjadi milik mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar seperti “TUHAN”.
- source_word: יוֹדֵעַ
  choice: mengetahui
  rationale: Menerjemahkan secara langsung pengetahuan Yahweh yang terus berlangsung tanpa mempersempitnya menjadi sekadar persetujuan atau penjagaan.
- source_word: יְמֵי
  choice: hari-hari
  rationale: Mempertahankan ungkapan Ibrani yang secara kontekstual menunjuk pada hari-hari atau rentang kehidupan seseorang.
- source_word: תְמִימִם
  choice: orang yang tak bercela
  rationale: Menyatakan keutuhan dan integritas moral dalam kontras hikmat antara orang benar dan orang fasik, tanpa harus berarti kesempurnaan tanpa dosa.
- source_word: נַחֲלָתָם
  choice: warisan mereka
  rationale: Mempertahankan arti warisan atau bagian milik yang dianugerahkan, termasuk gaung konkret dan perjanjiannya.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Padanan Indonesia yang alami bagi durasi yang tidak berakhir.
- source_word: תִּהְיֶה
  choice: akan ada
  rationale: Mewakili bentuk mendatang dari היה tanpa secara diam-diam menambahkan gagasan “tetap dimiliki”, meskipun konteks mungkin menyiratkannya.
theological_decisions:
- issue: Makna “orang yang tak bercela” dalam konteks hikmat
  choice: Orang yang hidup dengan keutuhan dan integritas
  alternative: Orang yang secara moral sempurna dan sama sekali tanpa dosa
  rationale: תְמִימִם menggambarkan integritas atau keutuhan; ayat ini tidak dengan sendirinya mengajarkan kesempurnaan mutlak tanpa dosa.
- issue: Daya makna pengetahuan Yahweh
  choice: Diterjemahkan secara sederhana sebagai “mengetahui”
  alternative: “Memperkenan” atau “menjaga”
  rationale: Konteks dapat memberi nuansa perhatian relasional atau perjanjian, tetapi kata sumber tidak perlu diparafrasakan secara lebih sempit.
- issue: Sifat kekal warisan
  choice: Warisan itu “akan ada untuk selama-lamanya”
  alternative: Warisan itu akan tetap menjadi milik mereka untuk selama-lamanya
  rationale: Terjemahan utama mempertahankan bentuk terbuka dari היה dan membiarkan ungkapan itu mencakup baik kelanggengan warisan maupun kemungkinan kepemilikan yang berkesinambungan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan “hari-hari” dipertahankan agar citra Ibraninya tetap terdengar, sedangkan catatan kaki menjaga nuansa תְמִימִם dan ambiguitas kelanggengan warisan.
