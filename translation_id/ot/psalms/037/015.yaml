  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: id
  text: 'Pedang mereka akan menembus hati mereka sendiri,[a]

    dan busur-busur mereka akan dipatahkan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam hati mereka”; bahasa Ibrani memakai nomina tunggal “hati” dengan sufiks milik jamak, suatu ungkapan kolektif yang umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבָּם
  choice: pedang mereka
  rationale: Nomina tunggal dengan sufiks orang ketiga jamak dipertahankan sebagai bentuk tunggal kolektif; ini dapat menunjuk pada senjata kaum fasik sebagai kelompok atau pada pedang masing-masing secara distributif.
- source_word: תָּבוֹא
  choice: akan menembus
  rationale: Bentuk Qal imperfek ini secara harfiah berarti 'akan masuk/datang'. Dengan pedang sebagai subjek dan jantung sebagai sasaran, 'menembus' menyampaikan gerak masuk secara alami dan jelas dalam bahasa Indonesia.
- source_word: בְלִבָּם
  choice: jantung mereka sendiri
  rationale: Preposisi בְּ menyatakan gerak ke dalam dalam konteks ini. לֵב dapat berarti hati atau jantung; karena gambaran pedang bersifat jasmani, 'jantung' paling konkret. 'Sendiri' memperjelas bahwa senjata itu berbalik mengenai pemiliknya, sebagaimana tersirat oleh konteks.
- source_word: וְקַשְּׁתוֹתָם
  choice: dan busur-busur mereka
  rationale: Nomina sumber berbentuk jamak dengan sufiks orang ketiga jamak; bentuk ulang 'busur-busur' mempertahankan jumlah jamak secara jelas.
- source_word: תִּשָּׁבַרְנָה
  choice: akan dipatahkan
  rationale: Nifal imperfek feminin jamak dari שבר menyatakan bahwa busur-busur itu akan dibuat patah. 'Dipatahkan' mempertahankan nuansa pasif dan daya tindakan lebih baik daripada sekadar 'akan patah'.
