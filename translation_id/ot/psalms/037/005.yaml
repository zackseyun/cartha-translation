  text: גּ֣וֹל עַל יְהוָ֣ה דַּרְכֶּ֑/ךָ וּ/בְטַ֥ח עָ֝לָ֗י/ו וְ/ה֣וּא יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: id
  text: Percayakanlah jalanmu kepada Yahweh[a]; percayalah kepada-Nya, dan Ia akan bertindak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Gulingkanlah jalanmu ke atas Yahweh.” Ungkapan ini berarti menyerahkan atau memercayakan arah hidup dan urusan seseorang kepada-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau “Ia akan melakukannya” atau “Ia akan mewujudkannya.” Bahasa Ibrani hanya mengatakan “Ia akan berbuat/bertindak” tanpa menyatakan objeknya secara eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: Percayakanlah
  rationale: Kata perintah ini secara harfiah berarti ‘gulingkanlah’, tetapi dalam ungkapan dengan עַל dan ‘jalanmu’ bermakna menyerahkan atau memercayakan arah hidup dan urusan seseorang kepada Yahweh. ‘Percayakanlah’ menyampaikan daya perintah dan makna idiomatisnya secara alami.
- source_word: עַל יְהוָה
  choice: kepada Yahweh
  rationale: עַל secara harfiah berarti ‘ke atas/di atas’, tetapi bersama kata kerja גּוֹל dalam idiom ini bahasa Indonesia secara alami memakai ‘kepada’. Nama ilahi יְהוָה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: דַּרְכֶּךָ
  choice: jalanmu
  rationale: ‘Jalan’ adalah padanan langsung yang tetap dapat dipahami secara kiasan sebagai arah, perilaku, atau perjalanan hidup seseorang.
- source_word: וּבְטַח עָלָיו
  choice: percayalah kepada-Nya
  rationale: בטח menyatakan sikap percaya atau mengandalkan. Walaupun עַל secara harfiah berarti ‘pada/di atas’, konstruksi alami dalam bahasa Indonesia adalah ‘percaya kepada’.
- source_word: וְהוּא יַעֲשֶׂה
  choice: dan Ia akan bertindak
  rationale: Kata ganti הוּא menegaskan bahwa Yahwehlah pelakunya. Karena יַעֲשֶׂה tidak memiliki objek yang disebutkan, ‘akan bertindak’ mempertahankan keterbukaan makna Ibrani tanpa menambahkan ‘itu’ atau hasil tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi. ‘Yahweh’ mempertahankan nama tersebut alih-alih menggantinya dengan sebuah gelar.
- issue: Objek yang tidak dinyatakan pada יַעֲשֶׂה
  choice: Ia akan bertindak
  alternative: Ia akan melakukannya; Ia akan mewujudkannya
  rationale: Bahasa Ibrani hanya menyatakan bahwa Ia ‘akan berbuat/bertindak’ tanpa menyebut objek. Terjemahan ini tidak mempersempit janji dengan memasukkan hasil tertentu yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Percayakanlah jalanmu’ mempertahankan citra ‘jalan’ sambil menyampaikan idiom Ibrani secara wajar. Bentuk ‘Ia’ dan ‘-Nya’ dipakai sebagai rujukan hormat kepada Allah.
