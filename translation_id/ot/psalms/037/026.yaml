  text: כָּל הַ֭/יּוֹם חוֹנֵ֣ן וּ/מַלְוֶ֑ה וְ֝/זַרְע֗/וֹ לִ/בְרָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/026.yaml
  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: id
  text: Sepanjang hari ia bermurah hati dan memberi pinjaman, dan keturunannya menjadi berkat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “keturunannya [adalah] untuk berkat.” Dapat juga dipahami: “keturunannya diberkati.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Sepanjang hari
  rationale: Ungkapan ini secara harfiah berarti “sepanjang hari” dan dalam konteks menyatakan tindakan yang terus-menerus atau menjadi kebiasaan.
- source_word: חוֹנֵן
  choice: bermurah hati
  rationale: Partisipel dari חנן berarti menunjukkan kemurahan atau belas kasih. Dalam konteks memberi pinjaman, “bermurah hati” alami dalam bahasa Indonesia tanpa membatasi maknanya pada uang semata.
- source_word: וּמַלְוֶה
  choice: dan memberi pinjaman
  rationale: Bentuk Hifil dari לוה di sini berarti meminjamkan, bukan meminjam. Frasa ini juga mempertahankan sifat tindakan yang menjadi kebiasaan.
- source_word: וְזַרְעוֹ
  choice: dan keturunannya
  rationale: זֶרַע merupakan nomina kolektif yang dapat menunjuk pada anak cucu atau keturunan. “Keturunannya” mempertahankan cakupan kolektif itu secara alami.
- source_word: לִבְרָכָה
  choice: menjadi berkat
  rationale: Secara harfiah frasa ini berarti “untuk berkat”. “Menjadi berkat” menyampaikan fungsi atau keadaan keturunan itu sebagai berkat, sembari mempertahankan perbedaan dari pengertian bahwa mereka hanya menerima berkat.
theological_decisions:
- issue: Makna klausa akhir לִבְרָכָה
  choice: keturunannya menjadi berkat
  alternative: keturunannya diberkati
  rationale: 'Preposisi ל pada בְּרָכָה paling langsung menyatakan tujuan, hasil, atau penetapan: “untuk berkat”. Namun, konstruksinya ringkas dan dapat dipahami sebagai keadaan diberkati; alternatif itu dicatat tanpa menghapus ketegangan maknanya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. “Bermurah hati” dipilih agar makna חנן tetap lebih luas daripada kemurahan dalam hal keuangan, sedangkan “memberi pinjaman” memperjelas arah tindakan bentuk Hifil.
