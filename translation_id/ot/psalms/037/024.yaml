  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: id
  text: Sekalipun ia jatuh[a], ia tidak akan terempas, sebab Yahweh memegang tangan orang itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab jika ia jatuh, ia tidak akan terempas.” Konjungsi Ibrani dapat berarti “sebab”, “jika”, atau, sesuai konteks, “sekalipun”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “menopang tangan orang itu”.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי (pertama)
  choice: Sekalipun
  rationale: 'Dalam konteks ini, konjungsi tersebut paling wajar dipahami secara konsesif: orang benar dapat jatuh, tetapi tidak dibiarkan terempas. Catatan kaki mempertahankan kemungkinan hubungan sebab atau syarat.'
- source_word: יִפֹּל
  choice: ia jatuh
  rationale: Bentuk dari נפל mempertahankan gambaran umum tentang jatuh tanpa membatasinya pada dosa, bahaya jasmani, atau jenis kemalangan tertentu.
- source_word: לֹא יוּטָל
  choice: ia tidak akan terempas
  rationale: Bentuk pasif dari טול menyatakan dilemparkan atau dijatuhkan. 'Terempas' membedakannya dari kata kerja sebelumnya dan menyampaikan daya yang lebih kuat tanpa menambahkan kata seperti 'sama sekali' yang tidak dinyatakan secara eksplisit.
- source_word: כִּי (kedua)
  choice: sebab
  rationale: Konjungsi kedua memberikan alasan bahwa kejatuhan itu tidak berakhir dengan orang tersebut terempas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: סוֹמֵךְ יָדוֹ
  choice: memegang tangannya
  rationale: Secara harfiah ungkapan ini menyatakan bahwa Yahweh menopang tangan orang itu. 'Memegang tangannya' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gambaran pertolongan langsung melalui tangan.
theological_decisions:
- issue: Makna kiasan 'jatuh'
  choice: Mempertahankan gambaran umum tentang kemunduran, kesusahan, atau kejatuhan orang benar tanpa menentukan jenisnya.
  alternative: Menafsirkannya secara khusus sebagai dosa atau kegagalan rohani; atau hanya sebagai bahaya jasmani.
  rationale: Bahasa Ibrani tidak menentukan bentuk kejatuhan tersebut. Terjemahan tidak mempersempit cakupan metaforanya.
- issue: Hubungan Yahweh dengan tangan orang yang jatuh
  choice: Yahweh memegang tangan orang itu sebagai gambaran dukungan yang terus berlangsung.
  alternative: Yahweh menopang orang itu dengan tangan-Nya sendiri.
  rationale: Pronomina pada יָדוֹ paling langsung merujuk pada tangan orang tersebut, bukan pada tangan Yahweh; terjemahan mempertahankan struktur itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Terempas' menjaga perbedaan antara dua kata kerja Ibrani untuk jatuh dan dijatuhkan, sedangkan 'memegang tangannya' lebih alami daripada ungkapan harfiah 'menopang tangannya'.
