  text: חֶ֤רֶב פָּֽתְח֣וּ רְשָׁעִים֮ וְ/דָרְכ֪וּ קַ֫שְׁתָּ֥/ם לְ֭/הַפִּיל עָנִ֣י וְ/אֶבְי֑וֹן לִ֝/טְב֗וֹחַ יִשְׁרֵי דָֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: id
  text: Orang-orang fasik telah menghunus pedang dan melenturkan busur mereka untuk menjatuhkan orang miskin dan orang melarat, untuk membantai orang-orang yang lurus jalan hidupnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: telah menghunus pedang
  rationale: Secara harfiah verba berarti 'membuka', tetapi bersama 'pedang' merupakan ungkapan untuk menghunusnya. Bentuk perfektif diterjemahkan 'telah menghunus'.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Menunjukkan golongan yang secara moral bersalah; 'fasik' merupakan padanan mazmuri yang baku dan tidak membatasi gender.
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: dan melenturkan busur mereka
  rationale: Verba דרך bersama busur berarti menginjak atau melenturkan busur untuk menyiapkannya. 'Melenturkan' mempertahankan gambaran tindakan itu; nomina Ibrani berbentuk tunggal kolektif dengan akhiran jamak.
- source_word: לְהַפִּיל
  choice: untuk menjatuhkan
  rationale: Bentuk kausatif dari נפל berarti menyebabkan jatuh. 'Menjatuhkan' tepat dan alami dalam konteks serangan kekerasan.
- source_word: עָנִי וְאֶבְיוֹן
  choice: orang miskin dan orang melarat
  rationale: Pasangan ini menggambarkan orang yang miskin atau tertindas serta berkekurangan. 'Melarat' membedakan אֶבְיוֹן dari עָנִי sambil mempertahankan paralelisme.
- source_word: לִטְבֹחַ
  choice: untuk membantai
  rationale: Verba ini lebih kuat daripada sekadar 'membunuh' dan menyampaikan kebrutalan pembantaian.
- source_word: יִשְׁרֵי דָרֶךְ
  choice: orang-orang yang lurus jalan hidupnya
  rationale: Secara harfiah 'orang-orang yang lurus dalam hal jalan'. 'Jalan hidupnya' menyampaikan metafora Ibrani tentang perilaku dan haluan hidup secara alami tanpa menghilangkan citranya.
theological_decisions:
- issue: Makna עָנִי sebagai kemiskinan atau penderitaan
  choice: orang miskin
  alternative: orang tertindas / orang sengsara
  rationale: Dalam pasangan dengan אֶבְיוֹן, nuansa kerentanan sosial-ekonomi menonjol, tetapi istilah Ibrani tetap dapat mencakup penderitaan dan penghinaan.
- issue: Makna metaforis יִשְׁרֵי דָרֶךְ
  choice: orang-orang yang lurus jalan hidupnya
  alternative: orang-orang yang hidup benar
  rationale: Pilihan utama mempertahankan metafora 'jalan' dan penilaian moralnya tanpa menyederhanakannya menjadi istilah teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Paralelisme dua tujuan dipertahankan dengan pengulangan 'untuk'; diksi kekerasan sumber juga dipertahankan.
