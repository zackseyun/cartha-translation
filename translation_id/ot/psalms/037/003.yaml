id: PSA.37.3
reference: Psalms 37:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּטַ֣ח בַּֽ֭/יהוָה וַ/עֲשֵׂה ט֑וֹב שְׁכָן אֶ֝֗רֶץ וּ/רְעֵ֥ה אֱמוּנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: id
  text: Percayalah kepada Yahweh dan lakukanlah yang baik; tinggallah di negeri itu dan peliharalah kesetiaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makanlah dari kesetiaan”; kemungkinan lain, “nikmatilah keamanan.” Ungkapan Ibrani ini sulit dan dapat membangkitkan gambaran tentang merumput atau mendapat makanan dari kesetiaan atau keterandalan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: Percayalah
  rationale: Bentuk imperatif בְּטַח menyatakan tindakan menaruh kepercayaan atau keyakinan kepada seseorang. “Percayalah” alami dalam bahasa Indonesia dan mempertahankan daya seruannya.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ב menandai pribadi yang menjadi tujuan kepercayaan. Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: וַעֲשֵׂה טוֹב
  choice: dan lakukanlah yang baik
  rationale: Ungkapan ini terdiri atas imperatif “lakukanlah” dan טוֹב yang berfungsi sebagai objek. Pilihan ini jelas, ringkas, dan wajar dalam bahasa Indonesia modern.
- source_word: שְׁכָן אֶרֶץ
  choice: tinggallah di negeri itu
  rationale: שׁכן berarti tinggal atau menetap. Dalam konteks Mazmur 37, אֶרֶץ menunjuk pada negeri yang menjadi tempat umat tinggal dan warisan mereka, bukan terutama bumi secara umum.
- source_word: וּרְעֵה
  choice: dan peliharalah
  rationale: רעה secara harfiah dapat berarti menggembalakan, merumput, atau makan di padang. Dengan objek abstrak “kesetiaan”, “peliharalah” menyampaikan tindakan aktif membina atau menjalankan kesetiaan tanpa menghapus kesulitan ungkapan aslinya, yang dijelaskan dalam catatan kaki.
- source_word: אֱמוּנָה
  choice: kesetiaan
  rationale: אֱמוּנָה dapat berarti keteguhan, kesetiaan, keterandalan, atau keamanan. “Kesetiaan” paling sesuai dengan rangkaian nasihat etis dalam ayat ini, sementara kemungkinan lain dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa; TUHAN
  rationale: “Yahweh” mempertahankan nama perjanjian yang terdapat dalam teks Ibrani dan mengikuti konvensi proyek tanpa menggantinya dengan gelar.
- issue: Penafsiran וּרְעֵה אֱמוּנָה
  choice: peliharalah kesetiaan
  alternative: makanlah dari kesetiaan; nikmatilah keamanan
  rationale: Ungkapan Ibrani ini sulit dan benar-benar ambigu. Teks utama memakai ungkapan Indonesia yang dapat dipahami serta mempertahankan dorongan aktifnya; gambaran merumput atau mendapat makanan dan kemungkinan makna “keamanan” dicatat agar ketegangan maknanya tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif berakhiran -lah mempertahankan nada nasihat hikmat. “Negeri itu” dipilih untuk konteks tanah sebagai tempat tinggal dan warisan dalam Mazmur 37.
