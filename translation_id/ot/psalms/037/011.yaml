base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: id
  text: Tetapi orang-orang yang rendah hati[a] akan mewarisi negeri[b] dan menikmati damai sejahtera yang berlimpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lemah lembut.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bumi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: orang-orang yang rendah hati
  rationale: Bentuk jamak ini menunjuk kepada orang-orang yang rendah atau rendah hati. Pilihan ini jelas dalam bahasa Indonesia modern dan sesuai dengan nuansa etis mazmur, tanpa menyiratkan kelemahan atau sikap takut.
- source_word: יִירְשׁוּ
  choice: akan mewarisi
  rationale: Kata kerja ירשׁ dapat berarti mewarisi atau memperoleh sebagai milik. 'Akan mewarisi' mempertahankan aspek mendatang sekaligus gema perjanjian.
- source_word: אָרֶץ
  choice: negeri
  rationale: אֶרֶץ dapat berarti negeri, tanah, atau bumi. Dalam konteks Mazmur 37, gagasan menetap dengan aman dan tidak dilenyapkan dari negeri mendukung 'negeri', sementara arti yang lebih luas tetap dicatat sebagai alternatif.
- source_word: וְהִתְעַנְּגוּ
  choice: dan bersukacita
  rationale: Bentuk Hitpael dari ענג menyatakan menikmati atau mengalami kesenangan yang mendalam. 'Bersukacita' menyampaikan kenikmatan batin itu secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: עַל
  choice: dalam
  rationale: Walaupun secara dasar dapat berarti 'di atas' atau 'atas', bersama verba yang menyatakan kegembiraan dan nomina abstrak, 'dalam' merupakan padanan idiomatis yang wajar.
- source_word: רֹב
  choice: yang berlimpah
  rationale: Nomina ini menyatakan kelimpahan atau banyaknya sesuatu. Bentuk adjektival 'yang berlimpah' terdengar alami dan mempertahankan gagasan kelimpahan.
- source_word: שָׁלוֹם
  choice: damai sejahtera
  rationale: שָׁלוֹם mencakup perdamaian, keamanan, kesejahteraan, dan keutuhan. 'Damai sejahtera' merupakan ungkapan Indonesia yang ringkas namun cukup luas untuk konteks kehidupan yang aman dan berkembang baik.
theological_decisions:
- issue: Gema intertekstual dengan Matius 5:5 dan rumusan tradisional tentang orang lemah lembut yang mewarisi bumi
  choice: Menerjemahkan teks Ibrani dalam konteks mazmur sebagai 'orang-orang yang rendah hati akan mewarisi negeri', sambil mencatat 'lemah lembut' dan 'bumi' sebagai alternatif.
  alternative: Orang-orang yang lemah lembut akan mewarisi bumi.
  rationale: Teks utama mengikuti kemungkinan yang paling kuat dalam konteks Ibrani Mazmur 37, bukan sekadar menyalin rumusan yang dikenal dari penerimaan Perjanjian Baru. Namun, alternatif tradisional tetap sah secara leksikal dan penting secara intertekstual, sehingga dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur puitis dibuat ringkas; 'damai sejahtera' dipilih untuk menyampaikan keluasan makna שָׁלוֹם tanpa uraian berlebihan.
