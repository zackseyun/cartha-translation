id: PSA.37.17
reference: Psalms 37:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה וְ/סוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/017.yaml
  text: For the arms of the wicked will be broken[a], but Yahweh upholds the righteous.
translation:
  language: id
  text: 'Sebab lengan orang-orang fasik akan dipatahkan,[a]

    tetapi Yahweh menopang orang-orang benar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lengan-lengan”; gambaran ini kemungkinan melambangkan kekuatan atau kuasa orang fasik.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi konteks sebelumnya; “Sebab” mempertahankan daya kausalnya secara alami dalam bahasa Indonesia.
- source_word: זְרוֹעוֹת
  choice: lengan
  rationale: Makna harfiahnya adalah “lengan”; dalam puisi Ibrani, gambaran ini dapat mewakili kekuatan atau kuasa, tetapi citra konkretnya dipertahankan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Adjektiva substantival jamak ini menunjuk kepada orang-orang yang fasik; bentuk eksplisit ini jelas dan wajar dalam bahasa Indonesia.
- source_word: תִּשָּׁבַרְנָה
  choice: akan dipatahkan
  rationale: 'Bentuk nifal imperfek feminin jamak yang bersesuaian dengan “lengan” menyatakan tindakan pasif: lengan-lengan itu akan dipatahkan.'
- source_word: וְ
  choice: tetapi
  rationale: Walaupun bentuk dasarnya berarti “dan”, hubungan antarklausa bersifat kontras sehingga “tetapi” menyampaikan fungsi wacananya.
- source_word: סוֹמֵךְ
  choice: menopang
  rationale: Partisip ini menggambarkan tindakan mendukung atau menyangga yang berlangsung; “menopang” juga mempertahankan kontras dengan lengan yang dipatahkan.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva substantival jamak ini menunjuk kepada mereka yang benar; terjemahan ini transparan dan lazim dalam konteks mazmur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama pribadi ilahi secara langsung; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Metafora lengan orang fasik
  choice: Mempertahankan citra “lengan” dalam teks utama
  alternative: Mengungkapkannya sebagai “kekuatan” atau “kuasa”
  rationale: “Lengan” secara metonimis dapat berarti kekuatan atau kuasa, tetapi menggantinya dalam teks utama akan menghilangkan citra puitis asli. Implikasinya dijelaskan dalam catatan kaki tanpa membatasi makna hanya pada satu abstraksi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan dua klausa dan kontras puitis dipertahankan; “orang-orang fasik” dan “orang-orang benar” dipilih agar kategori jamaknya eksplisit.
