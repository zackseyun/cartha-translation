  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֗וֹב וּ/שְׁכֹ֥ן לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/027.yaml
  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: id
  text: Berpalinglah dari kejahatan dan berbuatlah baik; tinggallah untuk selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, mengingat tema yang berulang dalam mazmur ini, “tinggallah di negeri itu untuk selama-lamanya” atau “hiduplah dengan aman untuk selama-lamanya.” Teks Ibrani di sini tidak secara eksplisit menyebutkan “di negeri itu.”
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: Berpalinglah
  rationale: Bentuk perintah ini berarti berbalik, menyimpang, atau menjauh. “Berpalinglah” alami dalam konteks moral dan mempertahankan unsur tindakan yang disengaja.
- source_word: מֵרָע
  choice: dari kejahatan
  rationale: Preposisi מִן menyatakan hal yang harus ditinggalkan. Dalam konteks etis ini, רַע paling tepat diterjemahkan “kejahatan”, bukan “bahaya” atau “malapetaka”.
- source_word: וַעֲשֵׂה טוֹב
  choice: dan berbuatlah baik
  rationale: Ungkapan ini secara langsung memadankan perintah sebelumnya dan terdengar ringkas serta wajar dalam bahasa Indonesia modern.
- source_word: וּשְׁכֹן
  choice: tinggallah
  rationale: Kata kerja שׁכן menunjuk pada tinggal, menetap, atau berdiam. “Tinggallah” mempertahankan gambaran kediaman tanpa menambahkan objek yang tidak dinyatakan dalam ayat.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan yang kekal atau tidak berkesudahan. Terjemahan tersebut mempertahankan bentuk ringkas dan cakupan waktu dari teks Ibrani.
theological_decisions:
- issue: Makna nasihat atau janji dalam וּשְׁכֹן לְעוֹלָם
  choice: Menerjemahkan langsung sebagai perintah, “tinggallah untuk selama-lamanya,” tanpa menambahkan tempat tinggal.
  alternative: “tinggallah di negeri itu untuk selama-lamanya” atau “hiduplah dengan aman untuk selama-lamanya”
  rationale: Teks Ibrani memakai rangkaian bentuk perintah dan tidak menyebutkan objek tempat secara eksplisit. Tema berulang dalam Mazmur 37 memungkinkan pembaca memahami negeri sebagai objek tersirat atau keamanan sebagai nuansa hasilnya, tetapi memasukkannya ke dalam teks utama akan mempersempit ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda titik koma mempertahankan hubungan erat antartiga perintah sekaligus menandai peralihan menuju klausa terakhir yang maknanya padat dan agak ambigu.
