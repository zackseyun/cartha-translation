translation:
  language: id
  text: Orang fasik menyusun rencana terhadap orang benar dan menggertakkan giginya terhadapnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyusun siasat terhadap orang benar” atau “merencanakan kejahatan terhadap orang benar.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “menggertakkan gigi” menyatakan kemarahan dan permusuhan.
    reason: cultural_note
lexical_decisions:
- source_word: זֹמֵם
  choice: merancang kejahatan
  rationale: Partisip ini menyatakan tindakan merencanakan atau menyusun siasat dengan maksud jahat. Frasa ini alami dalam bahasa Indonesia dan membuat nuansa permusuhannya jelas tanpa menentukan bentuk rencana tersebut.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Kata sifat ini dipakai secara substantival untuk seorang yang fasik. Bentuk tunggal dipertahankan sesuai verba dan pronomina tunggal dalam bahasa Ibrani.
- source_word: לַצַּדִּיק
  choice: terhadap orang benar
  rationale: Preposisi ל dalam konteks ini menandai sasaran rencana jahat. 'Orang benar' merupakan padanan yang jelas dan lazim untuk צַדִּיק.
- source_word: חֹרֵק
  choice: menggertakkan
  rationale: Kata kerja ini menggambarkan menggiling atau menggertakkan gigi sebagai ungkapan kemarahan dan permusuhan.
- source_word: עָלָיו
  choice: kepada orang itu
  rationale: Preposisi עַל dengan pronomina tunggal menunjukkan arah permusuhan. Pengulangan 'orang itu' menghindari ambiguitas pronomina Indonesia dan tetap merujuk kepada orang benar.
- source_word: שִׁנָּיו
  choice: giginya
  rationale: Nomina jamak dengan sufiks posesif tunggal dipertahankan secara langsung sebagai bagian dari ungkapan Ibrani.
