  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: id
  text: Nantikanlah Yahweh[a] dan tetaplah menempuh jalan-Nya. Ia akan meninggikanmu untuk mewarisi negeri[b][c]; ketika orang-orang fasik dilenyapkan, engkau akan melihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berharaplah kepada Yahweh.” Kata Ibrani ini menunjuk pada penantian yang sabar dan penuh pengharapan.
    reason: lexical_alternative
  - marker: b
    text: Atau “bumi.” Kata Ibrani אֶרֶץ dapat berarti “negeri” maupun “bumi”; “negeri” dipilih di sini karena Mazmur 37 berulang kali memakai bahasa warisan perjanjian.
    reason: alternative_reading
  - marker: c
    text: Bandingkan Matius 5:5, yang menggemakan janji untuk mewarisi bumi atau negeri.
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה
  choice: Nantikanlah
  rationale: Bentuk perintah ini menyatakan penantian yang sabar dan penuh harap kepada Yahweh. “Nantikanlah” mempertahankan unsur waktu dan pengharapan tanpa mempersempit maknanya hanya menjadi harapan batin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: שְׁמֹר דַּרְכּוֹ
  choice: tetaplah menempuh jalan-Nya
  rationale: Secara harfiah ungkapan ini berarti “peliharalah/jagalah jalan-Nya,” yakni tetap setia hidup menurut jalan yang ditetapkan-Nya. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gambaran tentang jalan.
- source_word: וִירוֹמִמְךָ
  choice: Ia akan meninggikanmu
  rationale: Bentuk kausatif dari רום berarti mengangkat atau meninggikan; pilihan ini sesuai dengan konteks pembelaan dan pemberian warisan.
- source_word: לָרֶשֶׁת אָרֶץ
  choice: sehingga engkau mewarisi negeri
  rationale: ירשׁ dapat berarti mewarisi atau memiliki. “Mewarisi” mempertahankan nuansa warisan perjanjian, sedangkan “negeri” sesuai dengan pemakaian berulang dalam Mazmur 37; kemungkinan arti “bumi” dicatat dalam catatan kaki.
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: ketika orang-orang fasik disingkirkan
  rationale: בְּ dengan infinitif menandai waktu. “Disingkirkan” mempertahankan kiasan כרת, ‘dipotong/dilenyapkan dari tengah umat,’ tanpa menentukan secara berlebihan cara penghukuman itu.
- source_word: תִּרְאֶה
  choice: engkau akan melihatnya
  rationale: Kata kerja berarti “engkau akan melihat.” Akhiran “-nya” ditambahkan demi kejelasan sebagai rujukan pada penyingkiran orang-orang fasik.
theological_decisions:
- issue: Makna אָרֶץ dalam konteks hikmat dan perjanjian
  choice: negeri
  alternative: bumi
  rationale: Mazmur 37 berulang kali memakai bahasa warisan yang menggemakan janji tentang negeri. Namun, אָרֶץ juga dapat berarti seluruh bumi; ketegangan ini dipertahankan melalui catatan kaki dan hubungan kanonis dengan Matius 5:5.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Bentuk tunggal “engkau” dipakai karena semua bentuk orang kedua dalam ayat ini tunggal. Ungkapan “tetaplah menempuh jalan-Nya” dipilih agar idiom Ibrani terdengar alami tanpa menghilangkan citra ‘jalan’.
