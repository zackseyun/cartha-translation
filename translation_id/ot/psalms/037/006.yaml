source:
  edition: WLC
  text: וְ/הוֹצִ֣יא כָ/א֣וֹר צִדְקֶ֑/ךָ וּ֝/מִשְׁפָּטֶ֗/ךָ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/006.yaml
  text: He will bring forth your righteousness like the light[b][a], and your justice like the noonday.
translation:
  language: id
  text: Ia akan membuat kebenaranmu[a] tampak seperti terang, dan keadilanmu[b] seperti tengah hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: bahwa engkau benar.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: perkaramu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Ia akan membuat ... tampak
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan sesuatu keluar atau muncul. Dalam konteks ini, ungkapan tersebut berarti Allah membuat kebenaran seseorang menjadi nyata di depan umum; pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan makna kausatif.
- source_word: כָאוֹר
  choice: seperti terang
  rationale: Prefiks כ menyatakan perbandingan, sedangkan אוֹר berarti terang. Frasa ini mempertahankan gambaran sesuatu yang terlihat jelas.
- source_word: צִדְקֶךָ
  choice: kebenaranmu
  rationale: צדק dapat berarti kebenaran, keadaan benar, atau pembuktian bahwa seseorang berada di pihak yang benar. 'Kebenaranmu' menjaga keterkaitan leksikal dengan akar kata tersebut, sementara nuansa pembelaan nama baik dicatat dalam catatan kaki.
- source_word: וּמִשְׁפָּטֶךָ
  choice: dan keadilanmu
  rationale: מִשְׁפָּט mencakup keadilan, keputusan hukum, hak, atau perkara. 'Keadilanmu' mempertahankan istilah utama secara luas tanpa membatasinya hanya pada tindakan menjatuhkan putusan.
- source_word: כַצָּהֳרָיִם
  choice: seperti tengah hari
  rationale: צָהֳרַיִם berarti tengah hari. Ungkapan ini alami, puitis, dan mengisyaratkan terang yang paling jelas tanpa menambahkan kata 'matahari' yang tidak terdapat dalam teks sumber.
theological_decisions:
- issue: Apakah צִדְקֶךָ dan מִשְׁפָּטֶךָ menunjuk sifat moral atau pembenaran perkara di depan umum
  choice: Mempertahankan 'kebenaranmu' dan 'keadilanmu' dalam teks utama
  alternative: Menerjemahkannya secara kontekstual sebagai 'bahwa engkau benar' dan 'perkaramu'
  rationale: Paralelisme dan konteks mendukung nuansa pembuktian di depan umum, tetapi kata-kata Ibrani tetap memiliki cakupan etis dan hukum yang lebih luas. Teks utama mempertahankan ketegangan itu, sedangkan alternatif kontekstual diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. Struktur paralel ayat dipertahankan. Kata 'tampak' hanya dinyatakan pada klausa pertama dan dipahami juga pada klausa kedua, sesuai kelugasan puisi Ibrani.
