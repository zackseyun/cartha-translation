  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: id
  text: Tidak lama lagi, orang fasik tidak akan ada lagi; sekalipun engkau memperhatikan tempatnya dengan saksama, ia tidak akan ada di sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia tidak ada.” Bentuk Ibrani tidak menyebut kata “di sana”, tetapi ketidakhadirannya dari tempat yang baru disebut tersirat oleh konteks.
    reason: translation_clarity
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: Tinggal sedikit waktu lagi
  rationale: Ungkapan ini menyatakan jangka waktu singkat yang masih tersisa. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan arah waktu ke depan.
- source_word: וְאֵין רָשָׁע
  choice: orang fasik tidak akan ada lagi
  rationale: Negasi eksistensial dalam konteks berorientasi masa depan menyatakan bahwa orang fasik tidak lagi hadir. Bentuk tunggal Ibrani dipertahankan melalui 'orang fasik', yang juga dapat berfungsi representatif.
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: sekalipun engkau mengamati ... dengan saksama
  rationale: Bentuk hitpolel dari בין menyiratkan pengamatan atau perhatian yang sungguh-sungguh. 'Sekalipun' mengungkapkan daya konsesif yang wajar dalam konteks.
- source_word: עַל מְקוֹמוֹ
  choice: tempatnya
  rationale: Frasa ini menunjuk pada lokasi tempat orang fasik sebelumnya berada; bentuk posesif mempertahankan ungkapan konkret teks sumber.
- source_word: וְאֵינֶנּוּ
  choice: ia sudah tidak ada di sana
  rationale: Klausa penutup menegaskan ketidakhadiran orang fasik dari tempat yang baru disebut. 'Di sana' membuat hubungan tempat itu jelas tanpa menghilangkan gambaran konkret.
