source:
  edition: WLC
  text: כִּ֣י מְ֭בֹרָכָי/ו יִ֣ירְשׁוּ אָ֑רֶץ וּ֝/מְקֻלָּלָ֗י/ו יִכָּרֵֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/022.yaml
  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: id
  text: Sebab orang-orang yang diberkati-Nya akan mewarisi negeri[a], tetapi orang-orang yang dikutuk-Nya akan dilenyapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bumi.” Kata Ibrani אֶרֶץ dapat berarti “negeri” ataupun “bumi”; dalam konteks perjanjian Mazmur 37, “negeri” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan alasan atau dasar bagi pernyataan sebelumnya; “Sebab” mempertahankan alur argumentatif mazmur secara alami.
- source_word: מְבֹרָכָיו
  choice: orang-orang yang diberkati-Nya
  rationale: Partisip pasif dengan akhiran orang ketiga tunggal berarti “orang-orang yang diberkati oleh-Nya”; bentuk ini memperjelas hubungan dengan TUHAN sebagai pelaku yang tersirat dalam konteks.
- source_word: יִירְשׁוּ
  choice: akan mewarisi
  rationale: Kata ירש dapat berarti mewarisi atau memiliki. “Mewarisi” mempertahankan nuansa penerimaan anugerah dan gema perjanjian.
- source_word: אָרֶץ
  choice: negeri
  rationale: Dalam konteks berulang Mazmur 37, “negeri” paling sesuai dengan latar janji kepemilikan tanah, sementara kemungkinan arti “bumi” dipertahankan dalam catatan kaki.
- source_word: וּמְקֻלָּלָיו
  choice: tetapi orang-orang yang dikutuk-Nya
  rationale: Konjungsi menyatakan pertentangan antarbait, sehingga diterjemahkan “tetapi”; partisip pasif dan akhiran pronominal dipertahankan melalui “yang dikutuk-Nya”.
- source_word: יִכָּרֵתוּ
  choice: akan dilenyapkan
  rationale: Bentuk nifal dari כרת menyatakan bahwa mereka akan diputuskan, disingkirkan, atau dibinasakan. “Dilenyapkan” menyampaikan daya hukum dan akibat tegas idiom Ibrani secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan akhiran orang ketiga tunggal pada “yang diberkati-Nya” dan “yang dikutuk-Nya”
  choice: Akhiran diterjemahkan dengan “-Nya,” yang dalam konteks merujuk kepada TUHAN.
  alternative: Menerjemahkan lebih harfiah sebagai “orang-orang berkat-Nya” dan “orang-orang kutuk-Nya” tanpa memperjelas pelaku.
  rationale: Konteks mazmur menunjukkan bahwa rujukannya adalah TUHAN. Bentuk “-Nya” memperjelas relasi yang sudah terdapat dalam teks tanpa menambahkan klaim teologis baru.
- issue: Cakupan makna אָרֶץ
  choice: negeri
  alternative: bumi
  rationale: Janji yang berulang dalam Mazmur 37 paling langsung menunjuk pada kepemilikan negeri dalam kerangka hikmat dan perjanjian. Namun, karena kata Ibrani juga dapat berarti seluruh bumi, kemungkinan itu dicatat tanpa menutup ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel ayat dipertahankan, dengan kontras yang jelas melalui “tetapi.” Kapitalisasi “-Nya” mengikuti kebiasaan Indonesia untuk rujukan kepada Allah.
