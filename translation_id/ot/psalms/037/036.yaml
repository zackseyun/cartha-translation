source:
  edition: WLC
  text: וַ֭/יַּֽעֲבֹר וְ/הִנֵּ֣ה אֵינֶ֑/נּוּ וָֽ֝/אֲבַקְשֵׁ֗/הוּ וְ/לֹ֣א נִמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: id
  text: Namun ia berlalu[a]—lihatlah, ia sudah tidak ada. Aku mencarinya, tetapi tidak menemukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini dapat berarti “lewat” atau “berlalu dari hadapan”; di sini kata itu menggambarkan orang fasik yang tidak lagi terlihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: ia berlalu
  rationale: Kata kerja עבר pada dasarnya berarti ‘lewat’ atau ‘berlalu’. Dalam konteks ini, ‘berlalu’ mempertahankan gambaran peralihan dari hadir menjadi tidak ada tanpa memastikan bahwa orang fasik itu mati atau lenyap secara ajaib.
- source_word: וְהִנֵּה
  choice: lihatlah
  rationale: Partikel הִנֵּה menarik perhatian kepada hasil yang mengejutkan. ‘Lihatlah’ mempertahankan daya retorisnya dalam ragam puitis yang tetap mudah dipahami.
- source_word: אֵינֶנּוּ
  choice: ia sudah tidak ada
  rationale: Ungkapan ini menyatakan ketidakhadiran atau hilangnya seseorang dari tempat semula. Terjemahan ini mempertahankan ketegasan ungkapan Ibrani tanpa menyiratkan kemusnahan.
- source_word: וָאֲבַקְשֵׁהוּ
  choice: Aku mencarinya
  rationale: בקשׁ berarti mencari atau berusaha menemukan. Pilihan ini ringkas, alami, dan sesuai dengan register mazmur.
- source_word: וְלֹא נִמְצָא
  choice: tetapi tidak menemukannya
  rationale: Bentuk Nifal secara harfiah berarti ‘tidak ditemukan’. Bahasa Indonesia lebih alami memakai susunan aktif setelah ‘Aku mencarinya’; makna hasil pencarian yang gagal tetap dipertahankan.
theological_decisions:
- issue: Apakah ‘berlalu’ secara khusus menyatakan kematian orang fasik
  choice: Tidak memastikan kematian; memakai ‘ia berlalu’
  alternative: ia meninggal / ia lenyap
  rationale: עבר sendiri tidak mengharuskan arti ‘meninggal’. Konteks menekankan bahwa orang fasik itu tidak lagi terlihat dan tidak dapat ditemukan, sehingga ambiguitas cara kepergiannya perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Tanda pisah menonjolkan kejutan yang diperkenalkan oleh הִנֵּה, sedangkan ‘sudah tidak ada’ menyampaikan ketidakhadiran tanpa menetapkan apakah yang dimaksud adalah kematian.
