  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: id
  text: Orang-orang benar akan mewarisi negeri dan tinggal di sana untuk selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bumi”. Kata Ibrani אֶרֶץ dapat berarti “negeri” atau “bumi”; dalam konteks Mazmur 37, “negeri” sesuai dengan ungkapan yang berulang.
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Bentuk jamak ini dipakai sebagai nomina untuk menyebut golongan orang yang hidup benar; 'orang-orang benar' alami dan jelas dalam bahasa Indonesia.
- source_word: יִירְשׁוּ
  choice: akan mewarisi
  rationale: Kata kerja ירשׁ dapat berarti menerima sebagai warisan atau mengambil milik. 'Mewarisi' mempertahankan nuansa janji dan perjanjian yang berulang dalam Mazmur 37.
- source_word: אָרֶץ
  choice: negeri
  rationale: אֶרֶץ dapat berarti 'negeri/tanah' atau 'bumi'. Dalam konteks berulang Mazmur 37, 'negeri' paling baik mempertahankan gema janji akan tempat kediaman, sementara kemungkinan 'bumi' dicatat dalam catatan kaki.
- source_word: וְיִשְׁכְּנוּ
  choice: dan tinggal
  rationale: שׁכן menunjuk pada berdiam atau menetap. 'Tinggal' merupakan ungkapan Indonesia modern yang alami dan tetap menyampaikan kediaman yang menetap.
- source_word: לָעַד
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan tanpa batas; 'untuk selama-lamanya' terdengar wajar, jelas, dan bermartabat.
- source_word: עָלֶיהָ
  choice: di sana
  rationale: Secara harfiah berarti 'di atasnya' dan merujuk kembali kepada negeri. Dalam bahasa Indonesia, 'di sana' lebih alami untuk kediaman di suatu negeri tanpa mengubah rujukannya.
theological_decisions:
- issue: Cakupan אָרֶץ dalam konteks janji
  choice: negeri
  alternative: bumi
  rationale: Konteks langsung Mazmur 37 berulang kali berbicara tentang mewarisi negeri, sehingga 'negeri' dipilih dalam teks utama. Namun, karena kata Ibrani itu juga dapat berarti seluruh bumi, kemungkinan tersebut dipertahankan dalam catatan kaki tanpa menetapkan satu penafsiran teologis secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan kalimat ringkas mengikuti paralelisme Ibrani. 'Di sana' dipilih sebagai padanan idiomatis bagi עָלֶיהָ agar tidak menghasilkan ungkapan kaku 'di atasnya'.
