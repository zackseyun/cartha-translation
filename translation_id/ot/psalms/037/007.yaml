id: PSA.37.7
reference: Psalms 37:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: id
  text: Diamlah di hadapan Yahweh[a] dan nantikanlah Dia dengan sabar[b]. Janganlah terbakar oleh amarah[c] terhadap orang yang berhasil dalam jalannya, terhadap seorang laki-laki yang melaksanakan siasat-siasat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berdiamlah di hadapan Yahweh.” Kata kerja Ibrani dapat menekankan keheningan maupun ketenangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “nantikanlah Dia dengan penuh kerinduan.” Kata kerja Ibrani ini mungkin menggambarkan penantian yang tekun, bahkan disertai pergumulan batin. Secara tradisional diterjemahkan “beristirahatlah dalam Dia.”
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional, “janganlah menjadi gusar.” Bahasa Ibraninya secara lebih harfiah menggambarkan menjadi panas atau terbakar oleh amarah.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: Diamlah
  rationale: Bentuk imperatif ini menyatakan sikap diam dan tenang di hadapan Allah. “Diamlah” alami dalam bahasa Indonesia dan mempertahankan unsur keheningan yang menonjol.
- source_word: לַיהוָה
  choice: di hadapan Yahweh
  rationale: Dalam konstruksi ini, ל dipahami secara relasional sebagai berada dalam hadirat atau mengarahkan diri kepada Yahweh.
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: dan nantikanlah Dia dengan sabar
  rationale: Bentuk hitpolel dari חול dapat menyiratkan kegelisahan atau pergumulan batin, tetapi dalam konteks nasihat ini mengungkapkan penantian yang tekun kepada Allah. Catatan kaki mempertahankan nuansa alternatifnya.
- source_word: אַל תִּתְחַר
  choice: Janganlah terbakar oleh amarah
  rationale: חרה secara metaforis berarti menjadi panas atau menyala dalam kemarahan. Ungkapan ini mempertahankan gambaran Ibrani, bukan sekadar menerjemahkannya sebagai “kesal” atau “gelisah”.
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: karena orang yang berhasil dalam jalannya
  rationale: Preposisi menandai penyebab kemarahan, sedangkan partisip מצליח menyatakan keberhasilan dan דרכו mempertahankan gambaran jalan atau arah hidup seseorang.
- source_word: בְּאִישׁ
  choice: karena seorang laki-laki
  rationale: אִישׁ berbentuk maskulin tunggal. Terjemahan mempertahankan bentuk sumber, meskipun tokoh itu berfungsi sebagai contoh representatif.
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: yang menjalankan siasat-siasat
  rationale: Frasa ini menggambarkan seseorang yang melaksanakan rencana-rencana penuh perhitungan. “Siasat-siasat” mempertahankan nada negatif konteks tanpa menambahkan kata “jahat” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; “Yahweh” mempertahankan nama diri tersebut.
- issue: Penerjemahan אִישׁ yang maskulin
  choice: seorang laki-laki
  alternative: seseorang; seorang
  rationale: Pilihan ini mempertahankan penandaan maskulin dalam teks sumber tanpa menyiratkan bahwa nasihat ayat hanya berlaku bagi laki-laki.
- issue: Nuansa penantian dalam וְהִתְחוֹלֵל לוֹ
  choice: nantikanlah Dia dengan sabar
  alternative: nantikanlah Dia dengan rindu; bergumul dan menantilah Dia; beristirahatlah dalam Dia
  rationale: Konteks paralel mendukung penantian tekun, tetapi bentuk katanya dapat mengandung nuansa batin yang gelisah atau pedih. Ketegangan itu dicatat, bukan dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme nasihat dipertahankan, metafora panasnya amarah diterjemahkan secara transparan, dan ambiguitas pada kata kerja penantian dijelaskan melalui catatan kaki.
