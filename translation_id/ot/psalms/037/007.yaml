  verdict: revise
  source_fidelity: 'Teks utama pada dasarnya setia kepada Ibrani: imperatif untuk berdiam di hadapan Yahweh, menanti Dia, larangan menjadi panas oleh amarah, serta dua keterangan mengenai orang yang berhasil dan pelaksana rencana dipertahankan. Namun, pengulangan “karena ... karena ...” dalam draf menghasilkan hubungan sintaksis yang tersendat dalam bahasa Indonesia. Menggunakan “terhadap” lebih jelas menyatakan sasaran/penyebab kemarahan yang ditandai בְּ setelah תִּתְחַר, tanpa menyamakan kedua pemerian itu.'
  naturalness: “Diamlah di hadapan Yahweh” dan “nantikanlah Dia dengan sabar” baku dan alami. Revisi pada klausa akhir menghilangkan pengulangan kausal yang janggal. “Melaksanakan siasat-siasat” lebih lazim daripada “menjalankan siasat-siasat” untuk tindakan mewujudkan rencana-rencana yang diperhitungkan.
  terminology: “Yahweh” tepat untuk יְהוָה. “Amarah” mempertahankan makna חרה, termasuk metafora panas melalui “terbakar.” “Seorang laki-laki” mempertahankan maskulin tunggal אִישׁ tanpa menjadikan istilah itu tidak alami. “Siasat-siasat” menyampaikan konotasi negatif yang lazim dari מְזִמּוֹת tanpa menambahkan sifat “jahat.”
  issues:
