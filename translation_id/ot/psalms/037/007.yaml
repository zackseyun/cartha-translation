    rationale: Draf berbunyi “karena orang ... , karena seorang laki-laki ...”. Walaupun mencerminkan pengulangan בְּ dalam Ibrani, hasilnya tersendat dalam bahasa Indonesia dan dapat mengaburkan bahwa keduanya adalah sasaran/keadaan yang memicu kemarahan. “Terhadap ...; terhadap ...” menyampaikan fungsi preposisi itu dengan lebih idiomatis.
  - severity: low
    issue: “Menjalankan siasat-siasat” kurang kolokatif.
    rationale: Dalam bahasa Indonesia baku, seseorang lebih lazim “melaksanakan” atau “menjalankan” rencana/program, sedangkan “melaksanakan siasat-siasat” paling jelas menyatakan pengaktualan skema yang dimaksud עֹשֶׂה מְזִמּוֹת.
  - severity: low
    issue: Alternatif pada catatan a kurang idiomatis.
    rationale: “Heninglah” mungkin dipahami, tetapi “Berdiamlah” merupakan alternatif imperatif yang lebih wajar untuk mengungkapkan kemungkinan makna diam/sunyi dari דּוֹם.
