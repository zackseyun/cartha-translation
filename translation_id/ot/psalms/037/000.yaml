reference: Psalms 37:0
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: id
  text: 'Dari Daud.[a]


    Jangan menjadi gusar[b] karena orang-orang jahat; jangan iri kepada orang-orang yang melakukan kezaliman.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk Daud” atau “Mengenai Daud.” Hubungan yang dinyatakan oleh ungkapan Ibrani ini dapat dipahami dengan beberapa cara.
    reason: textual_ambiguity
  - marker: b
    text: Kata Ibrani ini dapat menggambarkan menjadi panas hati, marah, jengkel, atau gelisah.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan singkat ini mempertahankan bentuk judul Ibrani dan tidak menambahkan kata “mazmur” yang tidak tertulis. Preposisi לְ dapat menunjukkan kepengarangan, hubungan, peruntukan, atau persembahan.
- source_word: תִּתְחַר
  choice: menjadi gusar
  rationale: Kata kerja ini secara harfiah berkaitan dengan menjadi panas dan dalam konteks ini menyatakan kegelisahan, kejengkelan, atau kemarahan. “Menjadi gusar” alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya menjadi kekhawatiran.
- source_word: בַּמְּרֵעִים
  choice: karena orang-orang jahat
  rationale: Preposisi בְּ di sini wajar dipahami sebagai penyebab atau alasan kegusaran, sedangkan bentuk partisip merujuk kepada para pelaku kejahatan.
- source_word: תְּקַנֵּא
  choice: iri
  rationale: Dalam konstruksi ini kata tersebut menyatakan rasa iri terhadap keadaan atau keberhasilan orang lain, bukan semangat atau kecemburuan ilahi.
- source_word: עֹשֵׂי עַוְלָה
  choice: orang-orang yang melakukan kezaliman
  rationale: Terjemahan ini mempertahankan unsur pelaku dan tindakan dalam frasa Ibrani serta mencakup ketidakadilan, kelaliman, dan perbuatan salah.
theological_decisions:
- issue: Hubungan Daud dengan mazmur dalam לְדָוִד
  choice: Dari Daud
  alternative: Untuk Daud / Mengenai Daud
  rationale: Bentuk Ibrani tidak dengan sendirinya menentukan secara mutlak apakah Daud adalah pengarang, penerima, tokoh, atau pihak yang terkait. Teks utama mengikuti pemahaman tradisional yang paling alami, sementara catatan mempertahankan ambiguitas gramatikalnya.
- issue: Sikap yang dilarang terhadap orang jahat
  choice: Jangan menjadi gusar ... jangan iri
  alternative: Jangan marah ... jangan cemburu
  rationale: 'Pilihan ini mempertahankan dua larangan yang berbeda: gejolak batin karena orang jahat dan rasa iri terhadap mereka, tanpa menambahkan alasan teologis yang baru dijelaskan dalam ayat-ayat berikutnya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Paralelisme dua larangan dipertahankan; “gusar” dipilih untuk mencakup gejolak emosi tanpa terdengar terlalu arkais.
