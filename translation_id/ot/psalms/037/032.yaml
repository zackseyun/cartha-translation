  text: The wicked watches the righteous and seeks to put him to death[a][b].
translation:
  language: id
  text: Orang fasik mengawasi orang benar[a] dan berusaha membunuhnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengintai orang benar.” Dalam konteks ini, kata Ibrani tersebut dapat berarti mengawasi dengan niat jahat.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk membunuhnya.” Secara harfiah, “menyebabkan dia mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צוֹפֶה
  choice: mengawasi
  rationale: Partisipel dari צפה berarti memperhatikan atau mengawasi. Dalam konteks permusuhan ini, kata tersebut menyiratkan pengamatan dengan niat mencelakakan, sementara “mengawasi” tetap mempertahankan arti dasarnya.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggal yang dipakai secara substantival menunjuk kepada seorang yang jahat. “Orang fasik” merupakan ungkapan Alkitabiah yang tetap jelas dalam bahasa Indonesia modern dan mempertahankan kategori etisnya.
- source_word: לַצַּדִּיק
  choice: orang benar
  rationale: צַדִּיק menunjuk kepada orang yang benar. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan pertentangan etis utama dalam mazmur ini.
- source_word: וּמְבַקֵּשׁ
  choice: dan berusaha
  rationale: בקש secara dasar berarti mencari atau mengupayakan. Dengan infinitif berikutnya, “berusaha” secara alami mengungkapkan maksud dan upaya jahat pelaku tanpa memastikan bahwa tujuannya tercapai.
- source_word: לַהֲמִיתוֹ
  choice: membunuhnya
  rationale: Bentuk Hifil dari מות secara harfiah berarti menyebabkan dia mati. Dalam bahasa Indonesia, “membunuhnya” menyampaikan makna kausatif itu secara tepat, ringkas, dan alami.
- source_word: וּ
  choice: dan
  rationale: 'Konjungsi ini menghubungkan kedua tindakan yang sejajar: mengawasi dan berusaha membunuh.'
