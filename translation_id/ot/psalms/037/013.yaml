id: PSA.37.13
reference: Psalms 37:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲדֹנָ֥/י יִשְׂחַק ל֑/וֹ כִּֽי רָ֝אָ֗ה כִּֽי יָבֹ֥א יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/013.yaml
  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: id
  text: Tuhan menertawakannya[a], sebab Ia melihat bahwa harinya[b] akan tiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencemoohnya” atau “mengejeknya”; verba Ibrani secara harfiah berarti “tertawa”, tetapi dalam konteks ini bernuansa mencemooh.
    reason: lexical_alternative
  - marker: b
    text: “Harinya” menunjuk pada hari kejatuhan atau penghakiman yang akan menimpa orang fasik.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Gelar ilahi אֲדֹנָי secara wajar diterjemahkan “Tuhan” dalam bahasa Indonesia, dengan tetap menyatakan kedaulatan Allah tanpa menambahkan nama ilahi yang tidak terdapat dalam teks.
- source_word: יִשְׂחַק
  choice: menertawakan
  rationale: Bentuk Qal dari שׂחק pada dasarnya berarti “tertawa”. Dengan objek pronominal לוֹ, bahasa Indonesia alami memakai verba transitif “menertawakannya”; konteks memberi nuansa mencemooh tanpa perlu mengganti makna leksikal utama dalam teks.
- source_word: לוֹ
  choice: -nya
  rationale: Preposisi ל dengan verba “tertawa” menandai orang fasik sebagai sasaran tawa Tuhan. Bentuk enklitik “-nya” merupakan ungkapan Indonesia yang ringkas dan alami.
- source_word: כִּי
  choice: sebab
  rationale: כִּי pertama memperkenalkan alasan Tuhan menertawakan orang fasik.
- source_word: רָאָה
  choice: melihat
  rationale: Walaupun berbentuk perfektif, verba ini menyatakan persepsi Tuhan yang relevan pada saat itu. “Melihat” mempertahankan citra konkret teks dan tidak mengubahnya menjadi “mengetahui”.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי kedua memperkenalkan isi dari apa yang Tuhan lihat.
- source_word: יָבֹא
  choice: akan tiba
  rationale: Bentuk imperfektif menunjuk pada kejadian mendatang. Untuk “hari”, ungkapan “akan tiba” alami dalam bahasa Indonesia dan menyampaikan bahwa waktunya sedang mendekat.
- source_word: יוֹמוֹ
  choice: harinya
  rationale: Terjemahan harfiah “harinya” mempertahankan ungkapan puitis yang ringkas; konteks dan catatan menjelaskan bahwa yang dimaksud ialah hari kejatuhan atau penghakiman orang fasik.
theological_decisions:
- issue: Sifat tawa Tuhan
  choice: Teks utama mempertahankan gambaran bahwa Tuhan “menertawakan” orang fasik dalam menghadapi penghakiman yang akan datang.
  alternative: Tuhan mencemooh atau mengejeknya.
  rationale: Verba Ibrani secara leksikal berarti “tertawa”, sedangkan konteks memberi tawa itu nuansa mencemooh. Terjemahan tidak mengubahnya menjadi kegembiraan sembrono ataupun secara berlebihan menentukan sifat tindakan ilahi.
- issue: Makna “harinya”
  choice: Ungkapan tersebut dibiarkan dalam bentuk puitis “harinya”, dengan penjelasan bahwa ini adalah hari kejatuhan atau penghakiman orang fasik.
  alternative: Hari yang ditetapkan baginya atau saat kebinasaannya.
  rationale: Teks Ibrani tidak secara eksplisit menyebut siapa yang menetapkan hari itu maupun memakai kata “kebinasaan”; konteks mendukung penghakiman, tetapi ketegangan dan keringkasan ungkapan asli perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. “Menertawakannya” dipilih sebagai bentuk idiomatis. Pronomina “Ia” menjaga alur puisi dan dengan jelas merujuk kepada Tuhan; kapitalisasi berfungsi sebagai konvensi penghormatan bahasa Indonesia, bukan sebagai tambahan makna dari morfologi Ibrani.
