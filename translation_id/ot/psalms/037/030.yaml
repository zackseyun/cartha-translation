  text: Mulut orang benar mengucapkan hikmat[a], dan lidahnya mengatakan keadilan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merenungkan hikmat” atau “menggumamkan hikmat”. Kata kerja Ibrani ini dapat menunjuk pada perenungan atau ucapan lirih, tetapi di sini kemungkinan besar menunjuk pada perkataan karena sejajar dengan “lidahnya mengatakan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “penghakiman”. Kata Ibrani ini dapat berarti keadilan, keputusan hukum, atau apa yang benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: Mulut orang benar
  rationale: Mempertahankan konstruksi nominal dan metonimia anggota tubuh untuk perkataan; צַדִּיק dipahami sebagai substantiva tunggal yang mewakili orang yang benar.
- source_word: יֶהְגֶּה
  choice: mengucapkan
  rationale: הגה dapat berarti bergumam, merenungkan, atau mengeluarkan ujaran. Karena subjeknya 'mulut' dan baris paralelnya menyebut lidah yang berbicara, konteks terutama menunjuk pada ungkapan lisan.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan wajar dalam konteks sastra hikmat.
- source_word: וּלְשׁוֹנוֹ
  choice: dan lidahnya
  rationale: Mempertahankan metafora anggota tubuh dan kesejajaran puitis dengan 'mulut'.
- source_word: תְּדַבֵּר
  choice: membicarakan
  rationale: Mengungkapkan tindakan berbicara dengan מִשְׁפָּט sebagai isi perkataan, sambil menghindari pengulangan kaku dengan 'mengucapkan'.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks sifat perkataan orang benar, 'keadilan' menyampaikan apa yang adil dan benar; cakupan Ibraninya juga dapat mencakup penghakiman atau keputusan hukum.
theological_decisions:
- issue: Bentuk maskulin tunggal dalam puisi hikmat
  choice: orang benar
  alternative: laki-laki yang benar
  rationale: Bahasa Ibrani memakai bentuk tunggal maskulin substantival, tetapi tidak menambahkan kata yang secara leksikal berarti 'laki-laki'. 'Orang benar' secara alami mempertahankan rujukan tunggal representatif tanpa memasukkan unsur yang tidak dinyatakan.
- issue: Cakupan makna מִשְׁפָּט
  choice: keadilan
  alternative: penghakiman; keputusan yang adil; apa yang benar
  rationale: Terjemahan utama mengikuti konteks etis dalam sastra hikmat, sementara catatan mempertahankan kemungkinan nuansa yuridis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan 'mulut ... lidah' dipertahankan untuk menjaga kesejajaran Ibrani. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
