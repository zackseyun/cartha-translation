  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: id
  text: Aku telah melihat orang fasik yang kejam berkembang pesat seperti pohon yang tumbuh subur di tanah asalnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku melihat orang fasik yang kejam berkembang seperti pohon asli yang hijau subur.” Ungkapan Ibrani ini sulit. Secara harfiah, kata yang diterjemahkan “asli” dapat berarti “penduduk asli” atau “yang lahir di negeri itu”; kata “pohon” tidak tertulis secara eksplisit, tetapi sangat mungkin tersirat dalam gambaran ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Aku pernah melihat
  rationale: Bentuk perfek orang pertama tunggal dari ראה menyatakan kesaksian berdasarkan pengalaman lampau; “pernah melihat” terdengar alami dalam perenungan pemazmur dan tetap relevan bagi pengamatannya sekarang.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Sebutan bagi orang yang jahat secara moral; “orang fasik” merupakan padanan yang mapan dan bermartabat dalam konteks sastra hikmat dan mazmur.
- source_word: עָרִיץ
  choice: yang kejam
  rationale: Kata ini menggambarkan orang kuat yang menindas dan menakutkan. “Kejam” menyampaikan daya moral dan sosialnya tanpa membatasi makna hanya pada kekerasan fisik.
- source_word: וּמִתְעָרֶה
  choice: merentangkan diri
  rationale: Partisipel Hitpael menggambarkan gerak ekspansif atau pertumbuhan lebat dengan nuansa refleksif. “Merentangkan diri” mempertahankan gambaran sosok yang meluas seperti pohon.
- source_word: כְּאֶזְרָח
  choice: seperti pohon … di tanah asalnya
  rationale: אֶזְרָח biasanya berarti “pribumi” atau “yang lahir di negeri itu.” Dalam perumpamaan puitis ini, pohon tampaknya tersirat; rumusan ini membuat citra pohon yang subur di tanah asalnya dapat dipahami tanpa menyatakan bahwa kata “pohon” hadir secara eksplisit.
- source_word: רַעֲנָן
  choice: rimbun
  rationale: Kata ini menyatakan keadaan hijau, segar, dan berkembang subur. “Rimbun” alami dalam bahasa Indonesia dan cocok dengan citra pohon yang meluas.
