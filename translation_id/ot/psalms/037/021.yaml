  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: id
  text: Orang fasik meminjam tetapi tidak membayar kembali, sedangkan orang benar menunjukkan kemurahan hati[a] dan memberi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menunjukkan perkenanan” atau “bermurah hati.” Kata kerja Ibrani ini berarti menunjukkan kasih karunia, kemurahan, atau perkenanan; di sini hal itu tampak dalam tindakan memberi.
    reason: lexical_alternative
  - marker: b
    text: Atau “meminjamkan.” Teks Ibrani secara harfiah mengatakan “memberi”; dalam konteks ini, sebagian penafsir memahaminya sebagai tindakan meminjamkan dengan murah hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  choice: meminjam
  rationale: Partisipel Qal dari לוה berarti ‘meminjam’. Bentuk kini tanpa penanda waktu menyampaikan sifat umum atau pepatah dalam konteks ini.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva yang dipakai sebagai nomina ini menunjuk kepada sosok yang fasik. Bentuk tunggal dipertahankan sebagai wakil suatu golongan dalam kontras hikmat.
- source_word: לֹא יְשַׁלֵּם
  choice: tidak membayar kembali
  rationale: Bentuk Piel dari שלם di sini berarti melunasi atau mengembalikan yang terutang. Ungkapan ini jelas dan alami sesudah ‘meminjam’.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva substantival ini berlawanan langsung dengan רָשָׁע. ‘Orang benar’ mempertahankan bentuk tunggal representatif dengan bahasa Indonesia yang alami.
- source_word: חוֹנֵן
  choice: menunjukkan kemurahan hati
  rationale: Partisipel Qal dari חנן mengandung gagasan menunjukkan kasih karunia, kemurahan, atau perkenanan. Dalam konteks tindakan memberi, ‘menunjukkan kemurahan hati’ mempertahankan makna dasarnya sekaligus terdengar alami.
- source_word: וְנוֹתֵן
  choice: dan memberi
  rationale: נתן pada dasarnya berarti ‘memberi’. Terjemahan ini tidak mempersempit maknanya menjadi ‘meminjamkan’, walaupun konteks memungkinkan pemahaman tersebut.
theological_decisions:
- issue: Bentuk tunggal maskulin yang mewakili golongan dalam kontras hikmat
  choice: Mempertahankan bentuk tunggal sebagai ‘orang fasik’ dan ‘orang benar’.
  alternative: ‘Orang-orang fasik ... orang-orang benar’ atau bentuk jamak lain.
  rationale: Teks Ibrani memakai bentuk tunggal maskulin secara representatif. Bahasa Indonesia dapat mempertahankan kontras tunggal itu tanpa menyiratkan bahwa pernyataan hanya berlaku bagi laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Sedangkan’ menandai pertentangan antarbait secara wajar; ungkapan ‘membayar kembali’ mudah dipahami dan tetap dekat dengan konteks utang-piutang.
