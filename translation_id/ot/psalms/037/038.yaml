  yaml_path: translation/ot/psalms/037/038.yaml
  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
translation:
  language: id
  text: Namun, orang-orang durhaka akan dibinasakan bersama-sama; masa depan[a] orang-orang fasik akan terputus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesudahan”. Kata Ibrani אַחֲרִית dapat berarti “masa depan”, “hasil akhir”, atau “kesudahan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֹשְׁעִים
  choice: Namun, orang-orang durhaka
  rationale: פֹשְׁעִים menunjuk kepada mereka yang memberontak atau melanggar. “Orang-orang durhaka” mempertahankan bobot moralnya tanpa memberi kesan pemberontakan politik; וּ diterjemahkan “Namun” untuk menyatakan kontras dengan nasib orang benar dalam konteks.
- source_word: נִשְׁמְדוּ
  choice: akan dibinasakan
  rationale: Bentuk Nifal dari שׁמד menyatakan bahwa mereka dibinasakan. Bentuk mendatang dalam bahasa Indonesia sesuai dengan gambaran tentang nasib akhir dalam konteks, tanpa menyiratkan pemusnahan metafisik.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Adverbia ini dapat berarti “bersama-sama” atau “seluruhnya”; “bersama-sama” mempertahankan gambaran bahwa orang-orang durhaka mengalami nasib yang sama.
- source_word: אַחֲרִית
  choice: masa depan
  rationale: Kata ini dapat berarti masa depan, kesudahan, atau hasil akhir. “Masa depan” secara alami menyampaikan bahwa tidak ada kelanjutan atau harapan bagi orang fasik, sementara kemungkinan “kesudahan” dicatat dalam catatan kaki.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: “Orang-orang fasik” merupakan padanan baku dalam konteks sastra hikmat dan mazmur serta mempertahankan kategori moral dalam teks.
- source_word: נִכְרָתָה
  choice: akan diputuskan
  rationale: Bentuk Nifal dari כרת secara harfiah berarti “dipotong” atau “diputuskan”. Dalam hubungan dengan “masa depan”, “akan diputuskan” mempertahankan metafora Ibrani sekaligus terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna אַחֲרִית dalam konteks penghakiman
  choice: masa depan orang-orang fasik akan diputuskan
  alternative: kesudahan orang-orang fasik akan diputuskan; keturunan orang-orang fasik akan dilenyapkan
  rationale: Kata Ibrani ini dapat menunjuk kepada masa depan, hasil akhir, kesudahan, atau keturunan. Konteks membandingkan nasib orang benar dan orang fasik, sehingga “masa depan” menyampaikan prospek akhir mereka tanpa mempersempit makna hanya kepada keturunan. Kemungkinan “kesudahan” dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Orang-orang durhaka” dan “orang-orang fasik” mempertahankan pembedaan antara dua istilah moral Ibrani. Tanda titik koma mencerminkan kesejajaran kedua baris puisi.
