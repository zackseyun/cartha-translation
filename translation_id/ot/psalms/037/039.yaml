id: PSA.37.39
reference: Psalms 37:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/תְשׁוּעַ֣ת צַ֭דִּיקִים מֵ/יְהוָ֑ה מָֽ֝עוּזָּ֗/ם בְּ/עֵ֣ת צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: id
  text: Keselamatan[a] orang-orang benar berasal dari Yahweh[b]; Dialah benteng[c] mereka pada waktu kesesakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelepasan” atau “kemenangan”; istilah Ibrani ini dapat menunjuk pada tindakan penyelamatan atau kemenangan, bukan hanya keselamatan dalam arti umum.
    reason: lexical_alternative
  - marker: b
    text: Ibrani YHWH; secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
  - marker: c
    text: Atau “tempat perlindungan” atau “kubu pertahanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: Keselamatan
  rationale: תְּשׁוּעָה dapat menunjuk pada keselamatan, kelepasan, atau kemenangan. “Keselamatan” mempertahankan keluasan makna dan ragam bahasa teologis-puitis mazmur, sementara catatan kaki mencantumkan kemungkinan konkret “kelepasan” dan “kemenangan”.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Bentuk jamak ini dipakai secara substantival untuk golongan orang yang bercirikan kebenaran. “Orang-orang benar” alami dan jelas dalam bahasa Indonesia.
- source_word: מֵיְהוָה
  choice: berasal dari Yahweh
  rationale: Preposisi מִן menandai sumber. “Berasal dari” mengungkapkan klausa nominal Ibrani secara wajar tanpa mengubah hubungan sumber tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasi nama ilahi mempertahankan rujukan langsung kepada nama perjanjian dalam teks Ibrani; bentuk tradisional Indonesia dicatat sebagai alternatif.
- source_word: מָעוּזָּם
  choice: benteng mereka
  rationale: מָעוֹז menyatakan tempat atau sumber kekuatan dan perlindungan. “Benteng” mempertahankan citra pertahanan yang kokoh, dan “mereka” menerjemahkan sufiks orang ketiga jamak.
- source_word: בְּעֵת
  choice: pada waktu
  rationale: Frasa ini menyatakan waktu terjadinya keadaan yang disebut sesudahnya. “Pada waktu” merupakan ungkapan Indonesia yang alami dan cukup dekat dengan bentuk Ibrani.
- source_word: צָרָה
  choice: kesesakan
  rationale: צָרָה menunjuk pada keadaan terjepit, kesusahan, atau tekanan. “Kesesakan” mempertahankan bobot puitis dan nuansa tekanan dalam konteks mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri tersebut tanpa menggantinya dengan gelar, sedangkan bentuk tradisional “TUHAN” diberi dalam catatan kaki.
- issue: Subjek dan kopula tersirat dalam klausa nominal מָעוּזָּם בְּעֵת צָרָה
  choice: Dialah benteng mereka pada waktu kesesakan
  alternative: benteng mereka pada waktu kesesakan; Yahweh adalah benteng mereka pada waktu kesesakan
  rationale: Bahasa Ibrani tidak menyatakan kopula, dan subjeknya dipahami dari Yahweh pada klausa pertama. “Dialah” membuat hubungan itu alami dalam bahasa Indonesia sekaligus memberi tekanan yang sesuai, tanpa menambahkan pelaku baru.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang sederhana dan bermartabat. Susunan dua klausa dipertahankan, tetapi kopula dan subjek tersirat dibuat eksplisit melalui “Dialah” agar alami dan jelas. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkannya.
