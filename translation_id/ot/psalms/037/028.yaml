id: PSA.37.28
reference: Psalms 37:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: id
  text: Sebab Yahweh mencintai keadilan dan tidak meninggalkan orang-orang yang setia kepada-Nya[a]; mereka dipelihara untuk selama-lamanya[b], tetapi keturunan orang-orang fasik akan dilenyapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang kudus-Nya,” “orang-orang saleh-Nya,” atau “orang-orang yang loyal kepada-Nya.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani juga dapat dipahami dengan menghubungkan frasa-frasa ini lebih rapat: “orang-orang yang setia kepada-Nya dipelihara untuk selama-lamanya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֹהֵב
  choice: mencintai
  rationale: Partisipel dari אהב secara langsung menyatakan kasih yang tetap; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks ini menunjuk pada tatanan dan keputusan yang benar sebagai nilai moral yang dicintai Yahweh.
- source_word: יַעֲזֹב
  choice: meninggalkan
  rationale: Menyampaikan arti עזב dengan bahasa Indonesia yang wajar, sambil mempertahankan nuansa bahwa Yahweh tidak menelantarkan umat-Nya.
- source_word: חֲסִידָיו
  choice: orang-orang yang setia kepada-Nya
  rationale: חסיד menunjuk pada orang yang bercirikan kesetiaan, kesalehan, atau loyalitas perjanjian; pilihan ini jelas dan tidak memberi istilah tersebut makna teknis gerejawi.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Mengungkapkan durasi yang tidak berakhir dengan gaya Indonesia yang wajar dan bermartabat.
- source_word: נִשְׁמָרוּ
  choice: mereka dipelihara
  rationale: Bentuk Nifal dari שמר bersifat pasif dan berarti dijaga atau dipelihara; 'dipelihara' cocok dengan jaminan perlindungan dalam konteks ini.
- source_word: זֶרַע
  choice: keturunan
  rationale: Di sini זרע berarti anak cucu atau generasi penerus, bukan benih secara harfiah.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Padanan baku dan dapat dipahami untuk sebutan kolektif bagi mereka yang hidup dalam kefasikan.
- source_word: נִכְרָת
  choice: akan dilenyapkan
  rationale: Menyampaikan akibat penghakiman dari idiom 'diputuskan' dalam bahasa Indonesia yang alami tanpa mempersempit cara terjadinya.
theological_decisions:
- issue: Makna dan acuan חֲסִידָיו
  choice: orang-orang yang setia kepada-Nya
  alternative: orang-orang kudus-Nya; orang-orang saleh-Nya; orang-orang yang loyal kepada-Nya
  rationale: Ungkapan ini menggambarkan orang-orang yang ditandai oleh kesetiaan atau kesalehan dalam hubungan dengan Yahweh. Terjemahan utama mempertahankan dimensi relasional itu tanpa memasukkan pengertian teknis yang berkembang kemudian.
- issue: Hubungan antara dua klausa tengah
  choice: 'Diterjemahkan sebagai dua pernyataan yang saling melengkapi: Yahweh tidak meninggalkan mereka; mereka dipelihara untuk selama-lamanya.'
  alternative: 'Menghubungkannya lebih rapat: ''orang-orang yang setia kepada-Nya dipelihara untuk selama-lamanya.'''
  rationale: Urutan Ibrani memungkinkan klausa kedua menjelaskan klausa pertama. Tanda titik koma mempertahankan kedua predikat secara eksplisit, sedangkan catatan kaki menjaga kemungkinan pembacaan yang lebih rapat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antitesis ayat dipertahankan, dengan istilah yang mudah dimengerti pembaca umum dan tanpa memasukkan kekhasan denominasi.
