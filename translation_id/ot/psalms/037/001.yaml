source:
  edition: WLC
  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: id
  text: 'Dari Daud.[a]


    Jangan menjadi gusar karena orang-orang yang berbuat jahat; jangan iri kepada mereka yang melakukan ketidakadilan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Milik Daud” atau “Untuk Daud.” Ungkapan Ibrani ini dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan.
    reason: source_ambiguity
  - marker: b
    text: Atau “mereka yang berbuat kelaliman” atau “mereka yang melakukan perbuatan salah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan לְדָוִד dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan. “Dari Daud” cukup alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi kepengarangan saja.
- source_word: אַל
  choice: Jangan
  rationale: אַל dengan bentuk imperfek menyatakan larangan; “jangan” adalah padanan Indonesia yang langsung dan alami.
- source_word: תִּתְחַר
  choice: menjadi gusar
  rationale: Bentuk hitpael dari חרה menggambarkan keadaan memanas, menjadi gelisah, atau jengkel. “Menjadi gusar” mempertahankan unsur gejolak batin tanpa membatasinya hanya pada kemarahan keras.
- source_word: בַּמְּרֵעִים
  choice: karena orang-orang yang berbuat jahat
  rationale: Preposisi ב dapat menunjukkan penyebab atau sasaran kegusaran. “Karena” menyampaikan bahwa para pelaku kejahatan menjadi penyebab gejolak tersebut, sementara bentuk partisip diterjemahkan secara aktif.
- source_word: תְּקַנֵּא
  choice: iri
  rationale: Dalam konteks ini קנא menunjuk pada rasa iri terhadap para pelaku kejahatan, bukan terutama kecemburuan dalam hubungan eksklusif.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: kepada mereka yang melakukan ketidakadilan
  rationale: עֹשֵׂי adalah bentuk partisip aktif, sedangkan עַוְלָה mencakup ketidakadilan, kelaliman, atau perbuatan salah. Pilihan ini mempertahankan dimensi moral sekaligus sosial dari istilah Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Gusar” dipilih karena ringkas serta mencakup kejengkelan dan gejolak batin. Pengulangan struktur larangan dipertahankan untuk mencerminkan kesejajaran puisi Ibrani.
