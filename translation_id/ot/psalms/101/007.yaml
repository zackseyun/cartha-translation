  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: id
  text: Orang yang melakukan tipu daya[a] tidak akan tinggal di dalam rumahku; orang yang mengucapkan dusta tidak akan berdiri[b] di depan mataku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang mengerjakan kelicikan.” Ungkapan Ibraninya secara harfiah berarti “orang yang melakukan tipu daya” dan menunjukkan perilaku menipu yang menjadi kebiasaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak akan ditegakkan di depan mataku” atau “tidak akan bertahan di hadapanku.” Kata kerja Ibraninya dapat berarti “ditegakkan”, “menjadi teguh”, atau “berdiri tetap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: akan tinggal
  rationale: Kata kerja יָשַׁב dapat berarti ‘duduk, tinggal, menetap’. Bersama frasa ‘di dalam rumahku’, ‘tinggal’ secara alami menyampaikan keberadaan yang berlanjut atau diterima dalam rumah tangga pemazmur.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: di dalam rumahku
  rationale: בְּקֶרֶב berarti ‘di tengah, di dalam’. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gagasan tentang lingkungan internal rumah tangga sang penutur.
- source_word: עֹשֵׂה רְמִיָּה
  choice: orang yang melakukan tipu daya
  rationale: Bentuk partisip עֹשֵׂה dengan רְמִיָּה menggambarkan tindakan menipu yang menjadi kebiasaan atau ciri seseorang. Ungkapan verbal ini juga mempertahankan kesejajaran dengan klausa berikutnya.
- source_word: דֹּבֵר שְׁקָרִים
  choice: orang yang mengucapkan dusta
  rationale: Bentuk partisip דֹּבֵר menunjukkan perilaku yang menjadi ciri, sedangkan bentuk jamak שְׁקָרִים menunjuk pada perkataan-perkataan dusta. ‘Mengucapkan dusta’ menjaga bentuk verbal dan register yang bermartabat.
- source_word: יִכּוֹן
  choice: akan berdiri
  rationale: Dalam bentuk Nifal, כּוּן dapat berarti ‘ditegakkan, menjadi teguh, berdiri tetap’. Bersama ‘di depan mataku’, ‘berdiri’ mempertahankan citra Ibrani serta kemungkinan nuansa istana atau pengadilan tanpa mempersempitnya menjadi tafsiran tertentu.
- source_word: לְנֶגֶד עֵינַי
  choice: di depan mataku
  rationale: Terjemahan ini mempertahankan gambaran harfiah ‘di hadapan mata’ dan nuansa pribadi-evaluatif dari keberadaan seseorang dalam pandangan sang penutur.
theological_decisions:
- issue: Cakupan penolakan terhadap orang yang menipu
  choice: Ayat diterjemahkan sebagai tekad pribadi atau kerajaan mengenai siapa yang boleh tinggal dalam rumah tangga dan berdiri di hadapan pemazmur-raja.
  alternative: Memahaminya sebagai pernyataan umum tentang rumah Allah atau semata-mata sebagai kiasan tentang kemurnian batin.
  rationale: Mazmur 101 dibingkai sebagai tekad seorang pemimpin mengenai pemerintahan dan rumah tangganya. Kata ganti orang pertama ‘rumahku’ dan ‘mataku’ dipertahankan tanpa mengalihkannya kepada Allah atau menjadikannya pernyataan doktrinal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur paralel kedua klausa dipertahankan, demikian pula citra ‘rumahku’ dan ‘di depan mataku’. Bentuk ‘orang yang ...’ dipakai untuk menyampaikan partisip Ibrani yang menggambarkan perilaku khas atau berulang.
