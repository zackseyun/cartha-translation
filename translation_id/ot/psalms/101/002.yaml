  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: id
  text: Aku akan memperhatikan jalan yang tidak bercela[b]—kapan engkau akan datang kepadaku?[a] Aku akan hidup dengan ketulusan hati di dalam rumahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi, “kapan engkau akan datang kepadaku?” Subjeknya tidak disebutkan secara eksplisit; banyak penafsir memahaminya sebagai sapaan kepada Allah.
    reason: alternative_reading
  - marker: b
    text: Atau “Aku akan mempertimbangkan jalan yang berintegritas” atau “Aku akan bertindak bijaksana di jalan yang tidak bercela.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: Aku akan memperhatikan
  rationale: Bentuk hiphil dari שׂכל dapat berarti bertindak bijaksana atau memberi perhatian dengan saksama. Dalam konteks ini, pilihan ini menyampaikan kesengajaan untuk menempuh kehidupan yang benar tanpa membatasi maknanya pada perenungan intelektual.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: jalan yang tidak bercela
  rationale: דֶּרֶךְ mempertahankan metafora etis 'jalan', sedangkan תָּמִים menunjuk pada keutuhan atau integritas moral, bukan kesempurnaan mutlak tanpa dosa.
- source_word: מָתַי תָּבוֹא אֵלָי
  choice: kapan Engkau akan datang kepadaku?
  rationale: Kata kerja berbentuk orang kedua maskulin tunggal, tetapi subjeknya tidak disebutkan secara eksplisit. Sapaan langsung dipertahankan tanpa menambahkan nama Allah; huruf kapital mengikuti pemahaman kontekstual yang paling lazim, sementara ambiguitas dijelaskan dalam catatan.
- source_word: אֶתְהַלֵּךְ
  choice: Aku akan hidup
  rationale: Bentuk hitpael dari הלך di sini menunjuk pada perilaku atau cara menjalani hidup. 'Hidup' menyampaikan metafora etis itu secara alami dalam bahasa Indonesia modern.
- source_word: בְּתָם לְבָבִי
  choice: dengan hati yang tulus
  rationale: תֹּם menyatakan keutuhan, ketulusan, atau integritas batin. Ungkapan ini alami bagi pembaca Indonesia dan tidak menyiratkan kesempurnaan tanpa dosa.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: di dalam rumahku
  rationale: בְּקֶרֶב secara harfiah berarti 'di tengah/dalam'; di sini ungkapan tersebut menunjuk pada lingkup rumah tangga dan diterjemahkan secara alami.
theological_decisions:
- issue: Subjek tersirat dalam frasa 'kapan ... akan datang kepadaku?'
  choice: Mempertahankan sapaan orang kedua tanpa menyebut Allah secara eksplisit.
  alternative: Menambahkan 'Allah' sebagai subjek, atau mengaitkan klausa itu secara impersonal dengan jalan yang tidak bercela.
  rationale: Bahasa Ibrani memakai kata kerja orang kedua maskulin tunggal tanpa subjek eksplisit. Allah paling mungkin dimaksudkan dalam konteks mazmur, tetapi teks utama tidak boleh menghapus ketidaktersuratan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Metafora etis 'jalan' dipertahankan, sedangkan אֶתְהַלֵּךְ diterjemahkan secara idiomatis sebagai 'hidup'. Penanda catatan ditempatkan tepat setelah klausa yang dijelaskan.
