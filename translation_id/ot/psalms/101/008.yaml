  variant: modern standard Indonesian
source:
  edition: WLC
  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: id
  text: Pagi demi pagi aku akan membinasakan semua orang fasik di negeri[a], untuk melenyapkan dari kota Yahweh[b] semua pelaku kejahatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di bumi.” Kata Ibrani אֶרֶץ dapat berarti “negeri” atau “bumi”; konteks kerajaan dalam mazmur ini mendukung “negeri.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.” Bentuk lain yang digunakan ialah “Yehuwa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: Pagi demi pagi
  rationale: Bentuk jamak dengan preposisi menyatakan tindakan berulang pada setiap pagi; ungkapan ini mempertahankan nuansa distributifnya secara alami dalam bahasa Indonesia.
- source_word: אַצְמִית
  choice: aku akan membinasakan
  rationale: Bentuk Hifil dari צמת menyatakan tindakan menyebabkan binasa atau memusnahkan; dalam konteks tindakan penghakiman seorang raja, 'membinasakan' menyampaikan kekuatan verba tersebut tanpa mempersempit caranya.
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: semua orang fasik di negeri
  rationale: רִשְׁעֵי adalah bentuk jamak substantival, yakni 'orang-orang fasik'. אָרֶץ dapat berarti 'negeri' atau 'bumi'; konteks pemerintahan raja dan penyebutan kota Yahweh mendukung 'negeri'.
- source_word: לְהַכְרִית
  choice: untuk melenyapkan
  rationale: Infinitif ini menyatakan tujuan tindakan sebelumnya. 'Untuk melenyapkan' mempertahankan hubungan tujuan dan daya yudisial verba כרת dalam bahasa Indonesia yang wajar.
- source_word: מֵעִיר יְהוָה
  choice: dari kota Yahweh
  rationale: Frasa ini menunjuk pada kota yang menjadi milik atau secara khusus terkait dengan Yahweh; susunan 'kota Yahweh' ringkas, wajar, dan dekat dengan struktur Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: semua pelaku kejahatan
  rationale: Secara harfiah frasa ini berarti 'semua orang yang melakukan/mengerjakan kejahatan'. 'Semua pelaku kejahatan' mempertahankan gagasan tindakan yang terus menjadi ciri mereka sekaligus terdengar alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Cakupan אָרֶץ
  choice: negeri
  alternative: bumi
  rationale: Suara seorang raja yang membersihkan wilayah pemerintahannya, disusul acuan khusus kepada kota Yahweh, lebih mendukung arti 'negeri'. Kemungkinan arti 'bumi' tetap dicatat karena kata Ibraninya memang memiliki kedua cakupan tersebut.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama itu dalam bentuk transliterasi yang lazim, sementara bentuk pengganti tradisional dan transliterasi alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Paralel tindakan penghakiman dipertahankan melalui 'membinasakan' dan 'melenyapkan', sedangkan ungkapan idiomatis 'Pagi demi pagi' menyampaikan tindakan yang berulang.
