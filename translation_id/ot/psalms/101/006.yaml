  source_fidelity: Terjemahan dengan tepat mencerminkan teks Ibrani. “Mataku tertuju” mempertahankan idiom עֵינַי dengan makna perhatian yang terarah; “orang-orang yang setia di negeri ini” menyampaikan בְּנֶאֶמְנֵי אֶרֶץ secara alami tanpa memperluasnya menjadi seluruh bumi. Klausa tujuan “supaya mereka tinggal bersamaku” sesuai dengan לָשֶׁבֶת עִמָּדִי, dan kalimat kedua dengan jelas menyatakan bahwa orang yang menjalani hidup tanpa cela itulah yang akan melayani pemazmur. Penekanan הוּא tercermin dengan tepat melalui “dialah.”
