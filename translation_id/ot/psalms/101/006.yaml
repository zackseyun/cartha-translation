id: PSA.101.6
reference: Psalms 101:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: id
  text: Mataku tertuju kepada orang-orang yang setia di negeri ini, supaya mereka tinggal bersamaku[a]. Orang yang hidup tanpa cela[b], dialah yang akan melayani aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “duduk bersamaku.” Kata Ibrani yang dipakai dapat berarti “duduk” atau “tinggal”; di sini kemungkinan menunjuk pada hubungan yang berkelanjutan di hadapan raja.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menempuh jalan yang berintegritas.” “Tanpa cela” di sini berarti hidup lurus dan berintegritas, bukan sama sekali tanpa dosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: Mataku tertuju kepada
  rationale: Mempertahankan gambaran konkret 'mataku' sekaligus menyampaikan idiom perhatian dan perkenanan yang terarah secara alami dalam bahasa Indonesia.
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: orang-orang yang setia di negeri ini
  rationale: נֶאֱמָן menunjuk pada orang yang setia atau dapat dipercaya. 'Di negeri ini' menyampaikan ranah kekuasaan sang raja dengan lebih alami daripada 'di bumi'.
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: supaya mereka tinggal bersamaku
  rationale: יָשַׁב dapat berarti 'duduk' atau 'tinggal'. Dalam konteks rekan atau pejabat raja, 'tinggal bersamaku' mengungkapkan hubungan yang berkelanjutan, sedangkan kata 'supaya' menyatakan tujuan.
- source_word: הֹלֵךְ
  choice: Orang yang hidup
  rationale: Secara harfiah berarti 'orang yang berjalan', tetapi di sini merupakan metafora bagi pola atau cara hidup. 'Orang yang hidup' menyampaikan fungsi idiomatisnya secara wajar.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: tanpa cela
  rationale: Frasa ini menggambarkan jalan hidup yang utuh dan berintegritas, bukan kesempurnaan tanpa dosa. Gabungannya dengan 'hidup' menghasilkan ungkapan Indonesia yang alami.
- source_word: הוּא
  choice: dialah
  rationale: Bentuk ini mempertahankan penekanan pada orang yang memenuhi syarat tersebut.
- source_word: יְשָׁרְתֵנִי
  choice: yang akan melayani aku
  rationale: שׁרת menyatakan pelayanan pribadi, mungkin dalam lingkungan istana. 'Melayani aku' cukup luas untuk mencakup pelayanan resmi tanpa memberi kesan khusus keagamaan.
theological_decisions:
- issue: Kualifikasi moral orang-orang di sekitar raja
  choice: Ayat ini menyatakan perhatian dan perkenanan pemazmur kepada orang-orang setia serta menegaskan bahwa orang yang hidup berintegritas layak melayaninya.
  alternative: Ayat ini dapat dipahami secara lebih sempit sebagai pemilihan pejabat istana.
  rationale: Bahasa Ibrani dapat mencakup baik persekutuan dekat ('tinggal bersamaku') maupun tugas resmi ('melayani aku'). Terjemahan tidak membatasi maknanya hanya pada salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Mataku tertuju' mempertahankan citraan Ibrani; 'dialah' mempertahankan penekanan. Pronomina 'aku' mengikuti suara pemazmur sebagai raja, dan pilihan kata tidak mempersempit konteks menjadi semata-mata rumah tangga atau birokrasi istana.
