base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/000.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: id
  text: 'Dari Daud[a]. Mazmur.


    Aku akan menyanyikan kasih setia dan keadilan;

    kepada-Mu, ya TUHAN[b], aku akan bermazmur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani “bagi Daud.” Ungkapan ini dapat menunjukkan kepengarangan, persembahan, kepunyaan, atau kaitan dengan Daud.
    reason: alternative_reading
  - marker: b
    text: Ibrani YHWH, nama pribadi Allah; secara tradisional diterjemahkan “TUHAN.”
    reason: divine_name
lexical_decisions:
- source_word: חֶסֶד (ḥesed)
  choice: kasih setia
  rationale: Ungkapan ini mencakup kasih, kemurahan, dan kesetiaan dalam hubungan perjanjian; “kasih setia” mempertahankan keluasan maknanya secara alami dalam bahasa Indonesia.
- source_word: מִשְׁפָּט (mišpāṭ)
  choice: keadilan
  rationale: Dalam konteks etis ini, kata tersebut menunjuk pada keadilan atau pelaksanaan hukum yang benar, bukan terutama keputusan penghukuman tertentu.
- source_word: אֲזַמֵּרָה (ʾazammerāh)
  choice: aku hendak bermazmur
  rationale: Bentuk verba ini berarti menyanyikan pujian, sering kali dengan iringan musik. “Bermazmur” mempertahankan nuansa pujian musikal dan cocok dengan laras puisi ibadah.
- source_word: יְהוָה (YHWH)
  choice: TUHAN
  rationale: Mengikuti kebiasaan baku Alkitab bahasa Indonesia untuk menyatakan nama ilahi dengan huruf kapital, sambil menjelaskan bentuk Ibraninya dalam catatan kaki.
theological_decisions:
- issue: Makna לְדָוִד (le-Dāwid) dalam judul mazmur
  choice: Dari Daud
  alternative: Untuk Daud; mengenai Daud; milik kumpulan Daud
  rationale: “Dari Daud” mempertahankan pembacaan tradisional sebagai keterangan asal, tetapi catatan kaki menjaga keterbukaan fungsi preposisi לְ yang dapat menandakan kepengarangan, persembahan, kepunyaan, atau kaitan.
- issue: Hubungan “kasih setia dan keadilan” dengan tindakan menyanyi
  choice: Diterjemahkan sebagai dua pokok yang dinyanyikan tanpa mempersempit maknanya
  alternative: Kasih dan penghakiman
  rationale: Kedua istilah dapat merujuk pada sifat dan tindakan Allah maupun pada prinsip pemerintahan pemazmur; teks tidak secara eksplisit membatasi acuannya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan dua baris mempertahankan kesejajaran Ibrani. “Bagi-Mu” menonjolkan tujuan pujian, sedangkan “bermazmur” menjaga nuansa musikal verba Ibrani.
