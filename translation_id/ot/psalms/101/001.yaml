id: PSA.101.1
reference: Psalms 101:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: id
  text: 'Dari Daud.[a] Sebuah mazmur.


    Aku hendak bernyanyi tentang kasih setia dan keadilan.[b]

    Kepada-Mu, ya Yahweh, aku hendak menyanyikan pujian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Untuk/Milik Daud.” Dalam judul mazmur, ungkapan Ibrani ini dapat menunjukkan kepengarangan, peruntukan, kepemilikan, atau kaitan dengan Daud.
    reason: alternative_reading
  - marker: b
    text: Atau “belas kasihan dan penghakiman.” Kedua istilah Ibrani itu dapat diterjemahkan dengan arti yang lebih sempit tersebut, tetapi “kasih setia dan keadilan” lebih mencerminkan cakupan relasional-perjanjian dan etisnya di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Dalam judul mazmur, לְ dapat menunjukkan kepengarangan, peruntukan, kepemilikan, atau kaitan. “Dari Daud” merupakan ungkapan judul yang alami sambil menghindari penegasan sempit bahwa Daud pasti penulisnya.
- source_word: מִזְמוֹר
  choice: Sebuah mazmur
  rationale: Padanan baku dan jelas untuk istilah judul yang menunjuk pada nyanyian yang disertai musik.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini mencakup kasih, kesetiaan, dan kemurahan yang teguh, termasuk nuansa relasional-perjanjian dari חֶסֶד.
- source_word: וּמִשְׁפָּט
  choice: dan keadilan
  rationale: Dalam pasangan dengan חֶסֶד dan dalam tema etis mazmur ini, “keadilan” lebih alami daripada “penghakiman,” meskipun kedua arti dimungkinkan.
- source_word: אָשִׁירָה
  choice: Aku hendak bernyanyi
  rationale: Bentuk kohortatif menyatakan tekad atau kehendak; “aku hendak” mempertahankan daya volitifnya secara alami.
- source_word: לְךָ
  choice: Kepada-Mu
  rationale: Preposisi ini menandai Yahweh sebagai pihak yang dituju oleh pujian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֲזַמֵּרָה
  choice: aku hendak menyanyikan pujian
  rationale: זמר menyatakan pujian yang dinyanyikan atau diiringi musik. Padanan ini jelas dalam bahasa Indonesia dan membedakannya secara halus dari kata kerja אָשִׁירָה pada baris sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama itu dan merupakan transliterasi yang lazim secara akademis.
- issue: Cakupan makna חֶסֶד dan מִשְׁפָּט
  choice: kasih setia dan keadilan
  alternative: belas kasihan dan penghakiman
  rationale: Pilihan utama mempertahankan cakupan relasional-perjanjian dari חֶסֶד dan cakupan etis dari מִשְׁפָּט tanpa meniadakan alternatif yang lebih sempit, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Aku hendak” mempertahankan nada tekad dari kedua bentuk kohortatif. Kapitalisasi pada “Kepada-Mu” mengikuti sapaan langsung kepada Allah tanpa menambah penafsiran pada teks.
