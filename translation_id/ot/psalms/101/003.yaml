source:
  edition: WLC
  text: לֹֽא אָשִׁ֨ית לְ/נֶ֥גֶד עֵינַ֗/י דְּֽבַר בְּלִ֫יָּ֥עַל עֲשֹֽׂה סֵטִ֥ים שָׂנֵ֑אתִי לֹ֖א יִדְבַּ֣ק בִּֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: id
  text: Aku tidak akan menaruh di depan mataku sesuatu yang hina[a]. Aku membenci perbuatan orang-orang yang menyimpang[b]; itu tidak akan melekat padaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuatu yang keji” atau “sesuatu dari Belial.” Kata Ibrani בְּלִיָּעַל di sini kemungkinan besar berarti sesuatu yang hina atau jahat, bukan nama diri.
    reason: lexical_alternative
  - marker: b
    text: Atau “perbuatan orang-orang murtad” atau “perbuatan orang-orang yang bengkok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: Aku akan menaruh
  rationale: Bentuk Qal imperfek orang pertama tunggal dari שׂים menyatakan tekad untuk menaruh atau menempatkan sesuatu; 'menaruh' alami dalam ungkapan ini.
- source_word: לְנֶגֶד עֵינַי
  choice: di depan mataku
  rationale: Mempertahankan gambaran konkret tentang sesuatu yang sengaja ditempatkan dalam pandangan si pemazmur.
- source_word: דְּבַר בְּלִיָּעַל
  choice: perkara yang tidak berguna
  rationale: דבר berarti perkara atau sesuatu, sedangkan בליעל di sini paling wajar menunjuk pada sesuatu yang tidak berguna, keji, atau jahat, bukan nama diri.
- source_word: עֲשֹׂה סֵטִים
  choice: perbuatan orang-orang yang menyimpang
  rationale: Ungkapan ini menunjuk pada tindakan mereka yang berbelok atau menyimpang; terjemahan tersebut mempertahankan citra penyimpangan moral tanpa mempersempitnya menjadi istilah teologis tertentu.
- source_word: שָׂנֵאתִי
  choice: Aku membenci
  rationale: Walaupun berbentuk perfektif, dalam puisi ini kata tersebut menyatakan sikap yang telah tetap; bentuk kini bahasa Indonesia mengungkapkannya secara alami.
- source_word: לֹא יִדְבַּק בִּי
  choice: itu tidak akan melekat padaku
  rationale: דבק berarti melekat atau berpaut. 'Melekat' mempertahankan metafora bahwa perbuatan menyimpang tidak akan menempel pada diri pembicara.
theological_decisions:
- issue: Makna בְּלִיָּעַל
  choice: Dipahami sebagai sebutan umum bagi sesuatu yang tidak berguna atau jahat.
  alternative: 'Dipahami sebagai nama diri: ''Belial''.'
  rationale: Dalam konteks Mazmur 101:3, konstruksi דְּבַר בְּלִיָּעַל paling alami menyatakan perkara yang tidak berguna atau keji. Terjemahan ini tidak memasukkan perkembangan personifikasi 'Belial' yang tidak dituntut oleh teks Ibrani.
- issue: Rujukan subjek dalam סֵטִים
  choice: orang-orang yang menyimpang
  alternative: orang-orang murtad; orang-orang sesat atau bengkok
  rationale: Akar katanya menggambarkan tindakan berbelok atau menyimpang. Pilihan ini menjaga keluasan makna dan tidak menentukan secara berlebihan jenis penyimpangannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tekad yang khidmat. Kata ganti 'Aku' mengikuti suara personal pemazmur; susunan tiga klausa mempertahankan gerak puitis teks Ibrani. Semua penanda catatan kaki dicantumkan dalam teks utama.
