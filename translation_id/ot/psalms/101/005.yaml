base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: id
  text: Orang yang diam-diam memfitnah sesamanya[a] akan kubinasakan; orang yang bermata angkuh dan berhati sombong[b] tidak dapat kutanggung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Orang yang secara tersembunyi memfitnah sesamanya akan kulenyapkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tinggi mata dan lebar hati.” Kedua ungkapan Ibrani ini menggambarkan sikap angkuh yang tampak serta batin yang sombong.'
    reason: cultural_note
lexical_decisions:
- source_word: מְלוֹשְׁנִי בַסֵּתֶר
  choice: orang yang diam-diam memfitnah
  rationale: Bentuk partisipial dari לשׁן menunjuk kepada orang yang melontarkan perkataan jahat atau fitnah; בַסֵּתֶר menerangkan bahwa tindakan itu dilakukan secara tersembunyi. Susunan ini alami dalam bahasa Indonesia dan mempertahankan sifat umum pelakunya.
- source_word: רֵעֵהוּ
  choice: sesamanya
  rationale: רֵעַ menunjuk kepada orang lain dalam lingkup hubungan sosial, tidak harus sahabat akrab atau tetangga tempat tinggal. 'Sesamanya' mempertahankan cakupan yang luas.
- source_word: אַצְמִית
  choice: akan kubinasakan
  rationale: Bentuk hifil dari צמת menyatakan tindakan melenyapkan atau membinasakan. 'Kubinasakan' mempertahankan kerasnya bahasa penghakiman tanpa menentukan mekanismenya.
- source_word: גְּבַהּ עֵינַיִם
  choice: tinggi hati
  rationale: Secara harfiah ungkapan ini berarti 'tinggi matanya' dan menggambarkan keangkuhan yang tampak dalam pandangan atau sikap. 'Tinggi hati' merupakan padanan Indonesia yang alami, sementara gambaran harfiahnya dijelaskan dalam catatan.
- source_word: וּרְחַב לֵבָב
  choice: sombong
  rationale: Secara harfiah 'lebar hati', tetapi dalam konteks ini idiom tersebut menyatakan kesombongan atau keangkuhan, bukan kemurahan hati. 'Sombong' menghindari salah pengertian dalam bahasa Indonesia modern.
- source_word: לֹא אוּכָל
  choice: tidak dapat kutanggung
  rationale: Secara harfiah berarti 'aku tidak sanggup/dapat', dengan gagasan menanggung atau membiarkan orang semacam itu tersirat. Terjemahan ini mempertahankan perpaduan ketidaksanggupan dan penolakan moral.
theological_decisions:
- issue: Cakupan penghakiman dalam pernyataan etis seorang raja
  choice: Pembicara menyatakan tekad keras untuk membinasakan orang yang memfitnah dan tidak menanggung orang yang angkuh, tanpa merinci cara pelaksanaannya.
  alternative: Ayat ini dapat dipahami secara lebih sempit sebagai hukuman mati secara harfiah, atau secara lebih lunak sebagai penolakan untuk bergaul saja.
  rationale: אַצְמִית adalah kata penghakiman yang keras, sedangkan לֹא אוּכָל menyatakan penolakan untuk menanggung orang tersebut. Terjemahan mempertahankan kedua daya ungkap itu tanpa menambahkan prosedur hukuman yang tidak disebutkan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk terikat 'kubinasakan' dan 'kutanggung' mempertahankan suara orang pertama yang tegas. Penanda catatan kaki ditempatkan pada klausa yang dijelaskannya.
