  text: לֵבָ֣ב עִ֭קֵּשׁ יָס֣וּר מִמֶּ֑/נִּי רָ֝֗ע לֹ֣א אֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/004.yaml
  text: A crooked heart will depart from me[a]; I will not know evil.
translation:
  language: id
  text: Hati yang bengkok akan menjauh dariku; aku tidak akan mengenal kejahatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku tidak mau berurusan dengan kejahatan.” Secara harfiah, teks Ibrani berbunyi, “aku tidak akan mengenal kejahatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵבָב
  choice: hati
  rationale: Dalam antropologi Ibrani, kata ini menunjuk pada batin manusia, termasuk pikiran, kehendak, dan arah moral. “Hati” merupakan padanan Indonesia yang alami dan mempertahankan citra sumber.
- source_word: עִקֵּשׁ
  choice: yang bengkok
  rationale: Kata sifat ini menggambarkan kebengkokan atau penyimpangan moral. Pilihan ini mempertahankan metafora tentang sesuatu yang tidak lurus tanpa mempersempit maknanya.
- source_word: יָסוּר מִמֶּנִּי
  choice: akan menjauh dariku
  rationale: Verba סור dengan preposisi מן menyatakan berbalik atau berpisah dari pembicara. “Akan menjauh dariku” alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: רָע
  choice: kejahatan
  rationale: Kata ini menunjuk secara luas pada apa yang jahat atau buruk secara moral. “Kejahatan” mempertahankan keluasan acuan tersebut.
- source_word: לֹא אֵדָע
  choice: aku tidak akan mengenal
  rationale: ידע secara harfiah berarti “mengenal/mengetahui”, tetapi dalam konteks ini dapat menyiratkan keterlibatan atau hubungan. Teks utama mempertahankan ungkapan Ibrani, sedangkan implikasi idiomatis dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna “mengenal” dalam hubungan dengan kejahatan
  choice: Mempertahankan ungkapan “aku tidak akan mengenal kejahatan” dalam teks utama, dengan kemungkinan makna penolakan untuk terlibat dijelaskan dalam catatan kaki.
  alternative: Aku tidak mau berurusan dengan kejahatan.
  rationale: Dalam pemakaian Ibrani, “mengenal” dapat mempunyai daya relasional atau partisipatif, bukan sekadar kesadaran intelektual. Mempertahankan bentuk harfiahnya menjaga ketegangan dan keluasan makna sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Citra “hati yang bengkok” serta idiom “mengenal kejahatan” dipertahankan agar daya sastra dan ambiguitas teks Ibrani tidak hilang.
