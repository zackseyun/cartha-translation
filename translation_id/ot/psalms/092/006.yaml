  text: אִֽישׁ בַּ֭עַר לֹ֣א יֵדָ֑ע וּ֝/כְסִ֗יל לֹא יָבִ֥ין אֶת זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/006.yaml
  text: 'A brutish man does not know[a], and a fool does not understand this:'
translation:
  language: id
  text: 'Orang yang dungu seperti binatang tidak mengetahui[a], dan orang bodoh tidak memahami hal ini:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Orang yang tidak berakal tidak mengetahui.” Kata Ibrani ini menggambarkan orang yang tumpul seperti binatang, bukan sekadar orang yang belum mendapat informasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: orang
  rationale: Dalam bahasa Indonesia, “orang” secara alami menyampaikan nomina tunggal representatif tanpa mengubah rujukan umum ayat.
- source_word: בַּעַר
  choice: dungu seperti binatang
  rationale: Ungkapan ini mempertahankan gambaran Ibrani tentang orang yang tumpul dalam pengertian seperti binatang, bukan sekadar kurang informasi.
- source_word: יֵדָע
  choice: tidak mengetahui
  rationale: Padanan langsung dan wajar bagi ידע, serta tetap berbeda secara halus dari “memahami” pada baris sejajar.
- source_word: כְסִיל
  choice: orang bodoh
  rationale: Istilah hikmat ini menunjuk pada kebodohan yang mencakup watak moral dan kemampuan memahami, bukan hanya kecerdasan rendah.
- source_word: יָבִין
  choice: tidak memahami
  rationale: Menyampaikan unsur pengertian atau daya membedakan dalam בין dan menjaga kesejajaran dengan “tidak mengetahui”.
- source_word: אֶת זֹאת
  choice: hal ini
  rationale: Demonstrativa tersebut menunjuk pada perkara dalam konteks; “hal ini” lebih alami dan jelas daripada hanya “ini” dalam kalimat Indonesia.
theological_decisions: []
