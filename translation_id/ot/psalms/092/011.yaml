  yaml_path: translation/ot/psalms/092/011.yaml
  text: My eye has looked on my foes[b][a]; my ears hear of the evildoers who rise against me.
translation:
  language: id
  text: Mataku telah memandang musuh-musuhku[a]; telingaku mendengar para penjahat yang bangkit melawan aku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang yang mengintai aku”; istilah Ibrani ini dapat lebih harfiah merujuk kepada orang-orang yang mengawasi atau mengintai dengan permusuhan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “telingaku telah mendengar” atau “telingaku akan mendengar”; bentuk kata kerja Ibraninya dapat dipahami dengan nuansa aspek atau waktu yang berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: telah memandang
  rationale: Kata kerja נבט menyatakan tindakan melihat atau memandang. Bentuk ini diterjemahkan sebagai tindakan yang telah terjadi tanpa menambahkan gagasan kemenangan atau kepuasan yang tidak dinyatakan.
- source_word: עֵינִי
  choice: Mataku
  rationale: Bentuk Ibrani tunggal dengan akhiran orang pertama dipertahankan; ungkapan ini tetap alami dan puitis dalam bahasa Indonesia.
- source_word: בְּשׁוּרָי
  choice: musuh-musuh yang mengintai aku
  rationale: Istilah yang berkaitan dengan שׁוּר dapat menunjuk kepada orang yang mengawasi atau mengintai, dan konteksnya menunjukkan sikap bermusuhan. Pilihan ini mempertahankan gambaran pengintaian sekaligus memperjelas sifat mereka.
- source_word: בַּקָּמִים עָלַי
  choice: yang bangkit melawan aku
  rationale: Ungkapan קום dengan עַל menggambarkan bangkitnya pihak yang menentang; terjemahan ini dekat dengan citra Ibrani dan alami dalam bahasa Indonesia.
- source_word: מְרֵעִים
  choice: para penjahat
  rationale: Partisip Hifil dari רעע menunjuk kepada orang-orang yang berbuat jahat atau mencelakakan. 'Para penjahat' ringkas dan mempertahankan dimensi moralnya tanpa membatasi makna pada tindak pidana formal.
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: telingaku mendengar
  rationale: Kata kerja orang ketiga feminin jamak bersesuaian dengan 'telinga'. Bentuk kini mempertahankan personifikasi dan kesejajaran puitis, sementara kemungkinan aspek lain dicatat dalam catatan kaki.
