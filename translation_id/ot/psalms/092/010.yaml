  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: id
  text: Namun Engkau meninggikan tandukku seperti tanduk lembu liar[a]; aku telah diurapi dengan minyak segar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani re'em menunjuk pada hewan sejenis sapi liar yang kuat, biasanya diterjemahkan “lembu liar”. Terjemahan lama kadang memakai “unikorn”.
    reason: cultural_note
  - marker: b
    text: Atau, secara lebih harfiah, “aku telah dibasahi/dicampur dengan minyak segar”. Kata kerja Ibrani di sini tidak lazim, dan nuansa tepatnya diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרֶם
  choice: Engkau meninggikan
  rationale: Bentuk dari רום menyatakan tindakan meninggikan atau mengangkat tinggi; konteks mendukung sapaan langsung kepada Allah. Kapitalisasi pronomina mengikuti kelaziman Alkitab bahasa Indonesia.
- source_word: כִּרְאֵים
  choice: seperti tanduk lembu liar
  rationale: רְאֵם menunjuk pada bovina liar yang kuat, bukan makhluk mitologis. Pengulangan 'tanduk' membuat hubungan perbandingan dengan קַרְנִי jelas dan alami dalam bahasa Indonesia.
- source_word: קַרְנִי
  choice: tandukku
  rationale: Makna harfiahnya 'tanduk', yang dalam puisi Ibrani melambangkan kekuatan, martabat, atau kejayaan. Metafora dipertahankan dan tidak diganti dengan tafsiran seperti 'kekuatanku'.
- source_word: בַּלֹּתִי
  choice: aku telah diurapi
  rationale: Kata kerja dari בלל di sini tidak lazim dan nuansanya diperdebatkan. Dalam hubungan dengan minyak, 'diurapi' menyampaikan kemungkinan makna idiomatis secara alami, sementara kemungkinan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: בְּשֶׁמֶן
  choice: dengan minyak
  rationale: 'Preposisi בְּ dengan שֶׁמֶן secara wajar diterjemahkan sebagai sarana: ''dengan minyak''.'
- source_word: רַעֲנָן
  choice: segar
  rationale: רַעֲנָן menyiratkan kesegaran, kesuburan, dan vitalitas; bersama 'minyak', padanan Indonesia yang paling alami ialah 'segar'.
theological_decisions:
- issue: Metafora 'tanduk'
  choice: Mempertahankan 'tanduk' sebagai lambang kekuatan dan kejayaan
  alternative: kekuatanku; kuasaku
  rationale: Gambaran puitis Ibrani dapat dipahami melalui konteks dan sebaiknya tidak ditafsirkan secara diam-diam menjadi konsep abstrak.
- issue: Makna בַּלֹּתִי dalam kaitannya dengan minyak
  choice: aku telah diurapi
  alternative: aku telah dibasahi dengan minyak segar; aku telah dicampur dengan minyak segar
  rationale: Kolokasi dengan minyak mendukung ungkapan idiomatis 'diurapi', tetapi karena verba Ibraninya langka dan maknanya tidak pasti, alternatif yang lebih harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang bermartabat. Metafora asli dipertahankan, tetapi susunan perbandingan diperjelas secara alami. Semua penanda catatan kaki muncul dalam teks utama.
