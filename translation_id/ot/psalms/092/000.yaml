lexical_decisions:
- source_word: מִזְמוֹר
  choice: mazmur
  rationale: Istilah baku dalam bahasa Indonesia untuk judul nyanyian dalam Kitab Mazmur; mempertahankan kaitan musikalnya tanpa menambahkan penjelasan yang tidak terdapat dalam teks.
- source_word: שִׁיר
  choice: nyanyian
  rationale: Padanan alami bagi istilah umum Ibrani untuk nyanyian dan tetap dibedakan dari מִזְמוֹר, sehingga pasangan dua nomina dalam judul dipertahankan.
- source_word: לְיוֹם
  choice: untuk hari
  rationale: Preposisi לְ menyatakan peruntukan atau keterkaitan. 'Untuk hari' alami dalam sebuah judul dan tidak menentukan secara berlebihan apakah mazmur ini digubah khusus atau dipakai pada hari tersebut.
- source_word: הַשַּׁבָּת
  choice: Sabat
  rationale: Menunjuk secara khusus pada Sabat. Dalam bahasa Indonesia, 'hari Sabat' merupakan ungkapan baku dan wajar; unsur definit dalam bahasa Ibrani tidak perlu diterjemahkan dengan kata sandang tersendiri.
theological_decisions:
- issue: Kedudukan teks sebagai judul mazmur, bukan baris puisi utama
  choice: 'Diterjemahkan sebagai judul nominal: ''Mazmur, nyanyian untuk hari Sabat.'''
  alternative: Memperlakukan teks ini sebagai baris pertama puisi atau menambahkan verba seperti 'adalah'
  rationale: Teks Ibrani terdiri atas unsur-unsur nominal tanpa verba finit dan berfungsi sebagai superskripsi. Bentuk judul mempertahankan fungsi sastra itu tanpa menyisipkan klausa yang tidak ada.
- issue: Makna hubungan לְ dengan hari Sabat
  choice: untuk hari Sabat
  alternative: milik hari Sabat; untuk dipakai pada hari Sabat
  rationale: Konstruksi Ibrani dapat menyatakan peruntukan atau hubungan. Terjemahan ringkas ini mempertahankan keluasan tersebut dan tidak memastikan penggunaan liturgis secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Bentuk nominal dipertahankan sebagai judul. 'Mazmur' dan 'nyanyian' sengaja tidak dilebur agar struktur pasangan kata Ibraninya tetap terlihat.
