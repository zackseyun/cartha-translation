id: PSA.92.14
reference: Psalms 92:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ע֭וֹד יְנוּב֣וּ/ן בְּ/שֵׂיבָ֑ה דְּשֵׁנִ֖ים וְ/רַֽעֲנַנִּ֣ים יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/014.yaml
  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
translation:
  language: id
  text: Pada masa tua pun mereka tetap berbuah[a]; mereka penuh getah dan tetap hijau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Pada masa tua pun mereka masih akan berbuah; mereka akan penuh getah dan hijau.” Bentuk-bentuk imperfek Ibrani juga dapat diterjemahkan dengan nuansa masa depan.'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “gemuk dan hijau”; dalam gambaran tumbuhan, “penuh getah” menyatakan kesuburan dan daya hidup.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: tetap
  rationale: Menunjukkan keberlanjutan keadaan dari konteks sebelumnya; bersama 'pun' menyampaikan bahwa daya hidup mereka masih berlangsung sampai masa tua.
- source_word: יְנוּבוּן
  choice: berbuah
  rationale: Kata kerja נוב menyatakan menghasilkan buah dan cocok dengan gambaran pohon pada ayat-ayat sekitarnya.
- source_word: בְּשֵׂיבָה
  choice: pada masa tua
  rationale: Secara harfiah berkaitan dengan uban, tetapi secara idiomatis menunjuk pada usia tua.
- source_word: דְּשֵׁנִים
  choice: penuh getah
  rationale: Secara harfiah berarti 'gemuk' atau 'subur'; dalam gambaran tumbuhan, ungkapan ini menyatakan vitalitas yang kaya dan terpelihara.
- source_word: רַעֲנַנִּים
  choice: tetap hijau
  rationale: Menggambarkan tumbuhan yang segar dan hijau; 'tetap' memperjelas keberlanjutan vitalitas dalam paralelisme ayat.
- source_word: יִהְיוּ
  choice: mereka ...
  rationale: Kopula tidak perlu dinyatakan secara eksplisit dalam kalimat nominal bahasa Indonesia; bentuk imperfek dipahami sebagai keadaan umum yang terus berlangsung.
theological_decisions:
- issue: Aspek/waktu bentuk imperfek dalam puisi
  choice: Diterjemahkan sebagai pernyataan umum yang berkelanjutan ('tetap berbuah'; 'penuh getah dan tetap hijau').
  alternative: 'Diterjemahkan secara futur: ''mereka masih akan berbuah ... mereka akan penuh getah dan hijau.'''
  rationale: Dalam konteks mazmur, ayat ini menggambarkan keadaan umum orang benar melalui metafora pohon, bukan semata-mata ramalan. Namun, kemungkinan nuansa futur tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang wajar. Susunan dua klausa mempertahankan paralelisme dan gambaran pohon dari konteks. Ungkapan 'penuh getah' dipilih agar metafora tumbuhan alami dan mudah dipahami.
