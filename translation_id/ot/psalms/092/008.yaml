  text: But you are on high forever[a], O Yahweh.
translation:
  language: id
  text: Namun Engkau, ya Yahweh, berada di tempat tinggi untuk selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Engkau luhur untuk selama-lamanya.” Kata Ibrani ini menunjuk pada ketinggian dan juga dapat menyatakan kedudukan yang luhur.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Namun Engkau
  rationale: Kata penghubung dan pronomina mandiri menandai kontras dengan orang-orang fasik yang akan binasa dalam ayat sebelumnya; “Namun Engkau” menyampaikan pertentangan itu secara alami.
- source_word: מָרוֹם
  choice: di tempat tinggi
  rationale: Nomina ini menunjuk pada ketinggian atau keadaan yang luhur. Pilihan ini mempertahankan gambaran ruang sekaligus membuka kemungkinan makna metaforis, tanpa langsung menjadikannya gelar “Yang Mahatinggi”.
- source_word: לְ/עֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; bentuk ini wajar, jelas, dan sesuai dengan ragam puitis yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar. Partikel “ya” ditambahkan karena nama itu digunakan sebagai sapaan langsung.
theological_decisions:
- issue: Makna מָרוֹם sebagai lokasi tinggi atau keadaan luhur
  choice: di tempat tinggi, dengan catatan kaki tentang nuansa “ditinggikan/luhur”
  alternative: Mahatinggi
  rationale: Teks Ibrani dapat membawa gambaran ruang maupun keluhuran. Terjemahan utama tidak mengubah kata tersebut menjadi gelar ilahi tertentu, sedangkan catatan kaki mempertahankan nuansa metaforisnya.
- issue: Penerjemahan nama ilahi יְהוָה dalam sapaan langsung
  choice: ya Yahweh
  alternative: ya TUHAN
  rationale: Teks sumber memakai nama pribadi ilahi secara langsung. Transliterasi mempertahankan nama itu dan menghindari penggantian diam-diam dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern dengan ragam puitis yang sederhana dan khidmat. “Tetap” melengkapi klausa nominal Ibrani secara alami dan menegaskan keberlangsungan yang dinyatakan oleh לְעוֹלָם.
