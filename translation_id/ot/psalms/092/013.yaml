  text: שְׁ֭תוּלִים בְּ/בֵ֣ית יְהוָ֑ה בְּ/חַצְר֖וֹת אֱלֹהֵ֣י/נוּ יַפְרִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/013.yaml
  text: Planted in the house of Yahweh[b][a], they will flourish in the courts of our God.
translation:
  language: id
  text: Ditanam di rumah Yahweh, mereka akan tumbuh subur di pelataran Allah kita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתוּלִים
  choice: Ditanam
  rationale: Partisipel pasif ini berarti ‘ditanam’ atau ‘ditanamkan’. ‘Ditanam’ alami dalam bahasa Indonesia dan mempertahankan metafora tumbuhan tanpa menambahkan penekanan.
- source_word: בְּבֵית
  choice: di rumah
  rationale: בַּיִת secara harfiah berarti ‘rumah’. Dalam konteks Yahweh, kata ini dapat menunjuk pada bait-Nya, tetapi ‘rumah’ mempertahankan gambaran Ibrani dan kesejajaran puisinya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’, sehingga nama pribadi dalam teks Ibrani tidak diganti dengan sebuah gelar.
- source_word: בְּחַצְרוֹת
  choice: di pelataran
  rationale: חָצֵר di sini menunjuk pada pelataran-pelataran kompleks rumah ibadah. Bentuk kolektif ‘pelataran’ wajar dalam bahasa Indonesia dan tetap sejalan dengan bentuk jamak Ibrani.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk ini merupakan konstruksi dengan akhiran orang pertama jamak; ‘Allah kita’ adalah padanan langsung dan alami.
- source_word: יַפְרִיחוּ
  choice: mereka akan tumbuh subur
  rationale: Bentuk hifil dari פרח dapat berarti bertunas, berkembang, atau tumbuh subur. Dalam metafora tentang orang benar, ‘tumbuh subur’ menyampaikan vitalitas yang berkembang sambil mempertahankan citra tumbuhan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama ilahi yang hadir dalam bahasa Ibrani, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang jelas. Paralelisme antara ‘rumah Yahweh’ dan ‘pelataran Allah kita’ dipertahankan; metafora penanaman serta pertumbuhan juga dijaga.
