  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ֭/הַגִּיד כִּֽי יָשָׁ֣ר יְהוָ֑ה צ֝וּרִ֗/י וְֽ/לֹא עלת/ה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: id
  text: untuk menyatakan bahwa Yahweh itu benar; Ia batu karangku, dan tidak ada ketidakadilan[a] pada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kelaliman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  choice: untuk menyatakan
  rationale: Bentuk infinitif ini menyatakan tujuan atau hasil yang terkait dengan konteks sebelumnya. “Menyatakan” mempertahankan nuansa pemberitaan terbuka dan lebih wajar daripada “memberi tahu”.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang dinyatakan, bukan alasan, sehingga paling tepat diterjemahkan “bahwa”.
- source_word: יָשָׁר
  choice: benar
  rationale: Ketika dikenakan kepada Yahweh, kata ini menyatakan kelurusan dan integritas moral. “Benar” terdengar alami dalam bahasa Indonesia dan tetap mempertahankan cakupan etisnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap dipertahankan dan tidak diganti dengan gelar.
- source_word: צוּרִי
  choice: batu karangku
  rationale: Pilihan ini mempertahankan metafora konkret tentang kekokohan, perlindungan, dan keandalan, tanpa menggantinya dengan penafsiran seperti “tempat perlindunganku”.
- source_word: וְלֹא
  choice: dan tidak ada
  rationale: Klausa Ibrani tidak memakai verba; bentuk “dan tidak ada” mengungkapkannya secara alami dalam bahasa Indonesia tanpa menambah gagasan baru.
- source_word: עַוְלָתָה
  choice: ketidakadilan
  rationale: Nomina ini menunjuk pada ketidakadilan, kelaliman, atau penyimpangan moral. “Ketidakadilan” jelas bagi pembaca modern dan selaras dengan pernyataan tentang watak Yahweh.
- source_word: בּוֹ
  choice: pada-Nya
  rationale: Ungkapan ini secara alami menyatakan bahwa ketidakadilan sama sekali tidak terdapat pada diri Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar atau memakai bentuk transliterasi lain.
- issue: Hubungan antara יָשָׁר dan עַוְלָתָה
  choice: “benar” dan “tidak ada ketidakadilan pada-Nya”
  alternative: “lurus” dan “tidak ada kecurangan pada-Nya”
  rationale: Terjemahan mempertahankan penegasan ganda tentang integritas moral Yahweh tanpa mempersempitnya hanya pada ranah hukum, sementara alternatif leksikal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Awal ayat memakai huruf kecil karena frasa tujuan ini melanjutkan kalimat atau gagasan dari ayat sebelumnya. Metafora “batu karang” dipertahankan secara konkret; pronomina ilahi ditulis “Ia” dan “-Nya” sesuai kebiasaan ejaan religius Indonesia.
