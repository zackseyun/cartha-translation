id: PSA.92.7
reference: Psalms 92:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
translation:
  language: id
  text: Ketika orang-orang fasik bertunas seperti rumput dan semua pelaku kejahatan berkembang,[a] itu terjadi supaya mereka dimusnahkan untuk selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan semua pelaku kejahatan berbunga.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hanya untuk dimusnahkan selama-lamanya” atau “menuju kebinasaan mereka untuk selama-lamanya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּפְרֹחַ
  choice: Ketika ... bertunas
  rationale: Preposisi ב dengan infinitif konstruk menyatakan keadaan temporal. 'Ketika ... bertunas' alami dalam bahasa Indonesia dan mempertahankan gambaran tumbuhan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Adjektiva substantival jamak ini menunjuk pada golongan orang yang jahat; 'orang-orang fasik' ringkas, bermartabat, dan lazim dalam ragam Alkitab Indonesia.
- source_word: כְּמוֹ עֵשֶׂב
  choice: seperti rumput
  rationale: עֵשֶׂב berarti rumput atau tumbuh-tumbuhan; 'rumput' mempertahankan gambaran pertumbuhan cepat sekaligus fana.
- source_word: וַיָּצִיצוּ
  choice: berkembang
  rationale: Verba צוץ menggambarkan bersemi atau berbunga. 'Berkembang' menyampaikan keadaan yang tampak makmur sambil tetap selaras dengan metafora tumbuhan.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: semua pelaku kejahatan
  rationale: Ungkapan ini secara harfiah berarti para pelaku atau pekerja kejahatan. 'Semua pelaku kejahatan' alami dalam bahasa Indonesia dan mempertahankan unsur perbuatan.
- source_word: לְהִשָּׁמְדָם
  choice: itu terjadi supaya mereka dimusnahkan
  rationale: 'Infinitif Nifal dengan prefiks ל dan sufiks orang ketiga jamak dapat menyatakan tujuan atau hasil: agar mereka dimusnahkan. Tambahan ''itu terjadi'' membuat hubungan antarklausa jelas tanpa menambahkan pelaku ilahi yang tidak disebutkan secara eksplisit.'
- source_word: עֲדֵי עַד
  choice: untuk selama-lamanya
  rationale: Idiom ini menyatakan keberlangsungan tanpa akhir; 'untuk selama-lamanya' merupakan padanan Indonesia yang jelas dan bermartabat.
theological_decisions:
- issue: Apakah berkembangnya orang fasik hanya diamati sebagai kemakmuran sementara atau dipautkan dengan penghukuman terakhir
  choice: 'Klausa diterjemahkan dengan daya tujuan/hasil: ''itu terjadi supaya mereka dimusnahkan untuk selama-lamanya.'''
  alternative: '''hanya untuk dimusnahkan selama-lamanya'' atau ''menuju kebinasaan mereka untuk selama-lamanya'''
  rationale: Bahasa Ibrani menghubungkan perkembangan orang fasik dengan pemusnahan akhir mereka. Terjemahan mempertahankan ketegangan itu, tetapi tidak menambahkan Allah sebagai pelaku eksplisit karena teks Ibrani sendiri tidak menyebutkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora tumbuhan dipertahankan melalui 'bertunas', 'rumput', dan 'berkembang'; susunan kalimat dibuat alami tanpa menghilangkan kemungkinan nuansa tujuan atau hasil pada לְהִשָּׁמְדָם.
