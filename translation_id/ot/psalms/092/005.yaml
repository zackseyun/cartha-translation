lexical_decisions:
- source_word: מַה גָּדְלוּ
  choice: Betapa besar
  rationale: מַה bersifat seruan kekaguman, bukan pertanyaan, sedangkan bentuk perfektif גָּדְלוּ berfungsi statif. Ungkapan ini menyampaikan kekaguman secara alami dalam bahasa Indonesia.
- source_word: מַעֲשֶׂיךָ
  choice: karya-karya-Mu
  rationale: מַעֲשֶׂה mencakup karya atau perbuatan. 'Karya-karya' mempertahankan cakupan luas yang sesuai dengan konteks pujian, termasuk tindakan dalam penciptaan dan pemeliharaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: מְאֹד עָמְקוּ
  choice: sangat dalam
  rationale: מְאֹד memperkuat predikat statif עָמְקוּ. 'Sangat dalam' langsung, alami, dan tidak mempersempit metafora menjadi sekadar 'sangat bijaksana'.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: pikiran-pikiran-Mu
  rationale: מַחְשָׁבָה dapat berarti pikiran, rencana, atau maksud. 'Pikiran-pikiran-Mu' merupakan padanan paling transparan dan mempertahankan keluasan makna serta bentuk jamaknya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna מַחְשְׁבֹתֶיךָ
  choice: pikiran-pikiran-Mu
  alternative: rencana-rencana-Mu atau maksud-maksud-Mu
  rationale: Kata Ibrani dapat menunjuk baik pada pemikiran maupun niat atau rancangan. Teks utama memakai padanan yang paling luas, sementara alternatif dicatat agar ketegangan leksikal tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Tanda seru dipakai untuk menampilkan sifat seruan pada klausa pertama. Penanda catatan kaki ditempatkan sesudah 'Pikiran-pikiran-Mu', yakni kata yang memiliki alternatif leksikal.
