  text: Betapa besar karya-Mu, ya Yahweh! Sungguh dalam pikiran-Mu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rencana-Mu” atau “maksud-Mu.”
