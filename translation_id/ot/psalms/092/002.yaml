  text: to declare your steadfast love in the morning[a], and your faithfulness in the nights,
translation:
  language: id
  text: untuk menyatakan kasih setia-Mu pada pagi hari dan kesetiaan-Mu malam demi malam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada malam-malam.” Bahasa Ibrani memakai bentuk jamak, yang dapat menyatakan pujian yang dilakukan berulang kali setiap malam.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  choice: untuk menyatakan
  rationale: Infinitif konstruk dengan לְ melanjutkan gagasan tujuan dari ayat sebelumnya. “Menyatakan” mempertahankan nuansa pemberitaan atau kesaksian, bukan sekadar memberi tahu.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Preposisi בְּ dengan nomina definit menyatakan waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kesejajaran temporal dengan malam.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד memadukan kasih, kemurahan, dan keteguhan relasional. “Kasih setia” merupakan padanan Indonesia yang ringkas dan lazim tanpa mempersempitnya secara eksplisit menjadi istilah teknis perjanjian.
- source_word: וֶאֱמוּנָתְךָ
  choice: dan kesetiaan-Mu
  rationale: אֱמוּנָה di sini menunjuk pada keandalan dan keteguhan Allah. “Kesetiaan” alami dan tepat dalam kesejajaran dengan kasih setia.
- source_word: בַּלֵּילוֹת
  choice: pada malam-malam hari
  rationale: Bentuk Ibraninya jamak. Padanan ini mempertahankan jumlah tersebut dan dapat menyiratkan pujian yang berulang setiap malam, meskipun sedikit lebih bertanda daripada bentuk tunggal dalam bahasa Indonesia.
