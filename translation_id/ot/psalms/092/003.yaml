  text: pada alat musik sepuluh dawai dan pada harpa,[a] dengan alunan[b] pada kecapi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas tepat alat-alat musik berdawai dalam bahasa Ibrani tidak diketahui dengan pasti. נָבֶל dapat juga diterjemahkan “kecapi” atau “alat musik petik”, sedangkan כִּנּוֹר kadang-kadang diterjemahkan “harpa”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan renungan pada kecapi”. Kata Ibrani הִגָּיוֹן dapat berarti renungan, gumaman, atau bunyi musik yang bergema; dalam konteks ini, makna musikal tampaknya paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵי
  choice: dengan
  rationale: Dalam konteks musik, preposisi ini menyatakan sarana atau iringan. “Dengan” alami dalam bahasa Indonesia dan cocok untuk rangkaian alat musik.
- source_word: עָשׂוֹר
  choice: kecapi sepuluh dawai
  rationale: Kata ini menunjuk pada alat musik berdawai sepuluh. Pilihan ini jelas tanpa memastikan bentuk alat musik kuno tersebut secara berlebihan.
- source_word: וַעֲלֵי
  choice: dan
  rationale: Konjungsi dipertahankan, sedangkan preposisi berulang dipadatkan secara alami karena “dengan” di awal dapat menaungi kedua alat musik.
- source_word: נָבֶל
  choice: gambus
  rationale: Kata Ibrani ini menunjuk pada alat musik petik yang identifikasi tepatnya tidak pasti. “Gambus” membedakannya dari כִּנּוֹר, dengan ketidakpastian dijelaskan dalam catatan kaki.
- source_word: הִגָּיוֹן
  choice: alunan
  rationale: Dalam lingkungan musikal ayat ini, kata tersebut kemungkinan menunjuk pada bunyi bergema atau permainan musik yang bersifat renungan. “Alunan” menyampaikan makna musikal sambil tetap menyisakan nuansa perenungan dalam catatan kaki.
- source_word: בְּכִנּוֹר
  choice: pada kecapi
  rationale: Preposisi ב menyatakan alat atau sarana, dan כִּנּוֹר ialah alat musik berdawai. “Pada kecapi” merupakan ungkapan alami untuk permainan alat musik dan membedakannya dari נָבֶל.
