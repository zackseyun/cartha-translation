  text: כִּ֤י הִנֵּ֪ה אֹיְבֶ֡י/ךָ יְֽהוָ֗ה כִּֽי הִנֵּ֣ה אֹיְבֶ֣י/ךָ יֹאבֵ֑דוּ יִ֝תְפָּרְד֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: id
  text: Sebab lihatlah, musuh-musuh-Mu, ya Yahweh—sebab lihatlah, musuh-musuh-Mu akan binasa; semua pelaku kejahatan[a] akan tercerai-berai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “semua orang yang mengerjakan kejahatan”; dapat juga diterjemahkan “semua orang yang berbuat jahat.”'
    reason: Menjelaskan bentuk ungkapan Ibrani פֹּעֲלֵי אָוֶן dan memberikan padanan Indonesia yang lebih idiomatis.
lexical_decisions:
- source_word: כִּי
  choice: sebab
  rationale: Mempertahankan fungsi penghubung yang menjelaskan atau menegaskan pernyataan sebelumnya.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Menyampaikan daya demonstratif dan penegasan bentuk Ibrani dalam bahasa Indonesia yang wajar serta tetap khidmat.
- source_word: אֹיְבֶיךָ
  choice: musuh-musuh-Mu
  rationale: Menerjemahkan bentuk jamak dengan sufiks orang kedua tunggal yang merujuk kepada Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang secara langsung terdapat dalam teks Ibrani.
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: sebab lihatlah ... sebab lihatlah
  rationale: Mempertahankan pengulangan yang mencolok sebagai ciri puitis dan sarana penegasan, meskipun menghasilkan struktur kalimat yang sengaja terputus lalu dimulai kembali.
- source_word: יֹאבֵדוּ
  choice: akan binasa
  rationale: Mengungkapkan kehancuran atau kebinasaan tanpa menentukan mekanisme penghukuman yang tidak dinyatakan dalam teks.
- source_word: יִתְפָּרְדוּ
  choice: akan tercerai-berai
  rationale: Menyampaikan gagasan berpisah dan terpencar serta sesuai dengan paralelisme puitis bersama 'akan binasa'.
- source_word: כָּל
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh dari pernyataan Ibrani.
- source_word: פֹּעֲלֵי אָוֶן
  choice: pelaku kejahatan
  rationale: Mencerminkan ungkapan harfiah 'para pelaku kejahatan' secara ringkas, alami, dan berbobot moral dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama khusus itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'sebab lihatlah' serta jeda dengan tanda pisah dipertahankan untuk mencerminkan penegasan dan struktur puitis teks Ibrani. Kapitalisasi pronomina '-Mu' mengikuti kebiasaan hormat dalam penulisan keagamaan Indonesia.
