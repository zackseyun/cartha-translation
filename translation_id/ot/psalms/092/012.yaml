id: PSA.92.12
reference: Psalms 92:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: צַ֭דִּיק כַּ/תָּמָ֣ר יִפְרָ֑ח כְּ/אֶ֖רֶז בַּ/לְּבָנ֣וֹן יִשְׂגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/012.yaml
  text: The righteous flourishes like the palm tree[b][a]; he grows like a cedar in Lebanon.
translation:
  language: id
  text: Orang benar[a] bertumbuh subur seperti pohon kurma; ia tumbuh besar[b] seperti pohon aras di Lebanon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk tunggal dalam bahasa Ibrani dapat dipakai untuk mewakili semua orang benar.
    reason: lexical_alternative
  - marker: b
    text: Atau “bertambah besar”, “bertumbuh subur”, atau “menjulang”; kata Ibrani ini menggambarkan pertumbuhan yang kuat atau keadaan menjadi besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva maskulin tunggal yang dipakai sebagai nomina. Dalam bahasa Indonesia, “orang benar” wajar, setia pada bentuk tunggal, dan dapat berfungsi mewakili semua orang benar tanpa menambahkan kata “laki-laki”.
- source_word: כַּתָּמָר
  choice: seperti pohon kurma
  rationale: Preposisi perbandingan כ dan nomina תמר membentuk perumpamaan dengan pohon kurma. Pilihan ini alami dan mempertahankan citra pohonnya.
- source_word: יִפְרָח
  choice: bertumbuh subur
  rationale: Verba פרח dapat berarti bertunas atau berbunga, lalu secara kiasan berkembang dengan subur. “Bertumbuh subur” mempertahankan citra pertumbuhan dan sesuai dengan penerapannya kepada orang benar.
- source_word: כְּאֶרֶז
  choice: seperti pohon aras
  rationale: Perbandingan ini menunjuk kepada pohon aras. Penyebutan “pohon” membuat citra tersebut jelas dan alami bagi pembaca Indonesia.
- source_word: בַּלְּבָנוֹן
  choice: di Lebanon
  rationale: Preposisi ב pada bentuk ini secara langsung menunjukkan lokasi, yaitu pohon aras yang tumbuh di Lebanon.
- source_word: יִשְׂגֶּה
  choice: ia tumbuh besar
  rationale: Verba שׂגה menyatakan pertumbuhan, pertambahan, atau menjadi besar. “Tumbuh besar” mempertahankan keluasan makna itu tanpa membatasinya hanya pada ketinggian pohon.
theological_decisions:
- issue: Daya representatif bentuk tunggal צַדִּיק
  choice: Mempertahankan bentuk tunggal “orang benar” sambil menjelaskan bahwa bentuk itu dapat mewakili golongan orang benar.
  alternative: “Orang-orang benar”
  rationale: Bentuk tunggal Ibrani sebaiknya tetap terlihat, tetapi dalam konteks pepatah puitis bentuk itu bersifat generik dan tidak perlu dibatasi kepada satu individu atau hanya laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis yang ringkas. Paralelisme kedua bagian dipertahankan, demikian pula citra pohon kurma dan pohon aras. Kata ganti “ia” merujuk kembali kepada bentuk tunggal representatif “orang benar”.
