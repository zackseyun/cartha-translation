  text: כִּ֤י שִׂמַּחְתַּ֣/נִי יְהוָ֣ה בְּ/פָעֳלֶ֑/ךָ בְּֽ/מַעֲשֵׂ֖י יָדֶ֣י/ךָ אֲרַנֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/004.yaml
  text: For you have made me glad[a], O Yahweh, by your work[b]; at the works of your hands I sing for joy.
translation:
  language: id
  text: Sebab Engkau telah membuatku bersukacita, ya Yahweh, oleh pekerjaan-Mu; atas perbuatan tangan-Mu aku bersorak-sorai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “aku bernyanyi dengan sukacita.” Kata Ibrani ini dapat berarti nyanyian gembira atau seruan sukacita yang nyaring.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: 'Mempertahankan fungsi kausal kata penghubung ini: sukacita dan pujian pemazmur didasarkan pada tindakan Yahweh.'
- source_word: שִׂמַּחְתַּנִי
  choice: Engkau telah membuatku bersukacita
  rationale: Bentuk piel dengan akhiran orang pertama tunggal menyatakan bahwa Yahweh menyebabkan pemazmur bersukacita; kata 'telah' menunjukkan tindakan yang sudah terjadi dan berdampak kini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: בְּפָעֳלֶךָ
  choice: oleh pekerjaan-Mu
  rationale: 'פֹּעַל berarti pekerjaan, perbuatan, atau kegiatan. Preposisi ב dipahami secara instrumental atau kausal: pekerjaan Yahweh menjadi sebab sukacita pemazmur.'
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: karena perbuatan tangan-Mu
  rationale: Mempertahankan ungkapan konkret Ibrani 'perbuatan tangan-Mu', sedangkan 'karena' menyampaikan bahwa perbuatan itu menjadi alasan atau pemicu sorak sukacita.
- source_word: אֲרַנֵּן
  choice: aku bersorak-sorai
  rationale: רנן dapat menunjuk pada seruan nyaring penuh sukacita maupun nyanyian gembira. 'Bersorak-sorai' alami dalam konteks pujian dan tidak memaksakan gagasan bernyanyi saja; tanpa penanda aspek, bahasa Indonesia juga membiarkan nuansa kini, kebiasaan, atau hasil tetap terbuka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar atau memilih bentuk 'Yehova' yang lebih jauh dari rekonstruksi pelafalan Ibrani yang umum diterima.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Kapital pada pronomina dan unsur milik yang merujuk kepada Allah mengikuti kebiasaan ejaan Alkitab Indonesia. Ungkapan antropomorfis 'perbuatan tangan-Mu' dipertahankan, dan susunan dua klausa menjaga kesejajaran puisi Ibrani.
