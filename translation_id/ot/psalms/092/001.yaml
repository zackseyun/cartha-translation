  text: It is good to give thanks to Yahweh[a], and to sing praise to your name, O Most High,
translation:
  language: id
  text: Adalah baik untuk mengucap syukur kepada Yahweh[a] dan untuk menyanyikan pujian bagi nama-Mu, Yang Mahatinggi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH,” yang di sini ditransliterasikan “Yahweh”; menurut tradisi, nama ilahi ini sering diterjemahkan “TUHAN.”'
    reason: Menjelaskan bentuk Ibrani dan tradisi penerjemahan nama ilahi.
lexical_decisions:
- source_word: טוֹב
  choice: Baiklah
  rationale: Adjektiva predikatif ini menilai kedua tindakan yang mengikutinya sebagai sesuatu yang baik. Bentuk “Baiklah” alami dalam bahasa Indonesia dan mempertahankan keluasan maknanya tanpa mempersempitnya menjadi sekadar menyenangkan atau patut.
- source_word: לְהוֹדוֹת
  choice: mengucap syukur
  rationale: Dalam konteks ibadah mazmur, bentuk Hifil dari ידה terutama menyatakan ucapan syukur atau pujian. “Mengucap syukur” mempertahankan pembedaan dari tindakan musikal pada klausa berikutnya.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Teks Ibrani menyebut nama ilahi יהוה secara langsung; “Yahweh” mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- source_word: וּלְזַמֵּר
  choice: dan menyanyikan pujian
  rationale: Bentuk Piel dari זמר menunjuk pada pembuatan musik sebagai pujian, sering melalui nyanyian. Pilihan ini alami dan tidak menetapkan adanya alat musik yang tidak disebutkan.
- source_word: לְשִׁמְךָ
  choice: bagi nama-Mu
  rationale: Ungkapan “nama-Mu” dipertahankan karena nama mencakup pribadi, kemasyhuran, dan penyataan diri Allah dalam bahasa ibadah Alkitab.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Gelar ilahi ini berarti “Yang Mahatinggi.” Letaknya sesudah bentuk orang kedua menunjukkan sapaan langsung, yang dapat disampaikan secara alami tanpa partikel vokatif khusus.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Ayat ini memakai Tetragramaton secara langsung. Transliterasi “Yahweh” menjaga perbedaannya dari gelar אֲדֹנָי dan mempertahankan nama ilahi dalam teks utama; catatan memberi tahu pembaca tentang tradisi penggantian dengan “TUHAN.”
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme dua infinitif dipertahankan, demikian pula ungkapan alkitabiah “nama-Mu.” Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia tanpa menambah unsur yang tidak ada dalam sumber.
