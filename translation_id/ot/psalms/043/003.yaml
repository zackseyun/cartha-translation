  text: שְׁלַח אוֹרְ/ךָ֣ וַ֭/אֲמִתְּ/ךָ הֵ֣מָּה יַנְח֑וּ/נִי יְבִיא֥וּ/נִי אֶל הַֽר קָ֝דְשְׁ/ךָ֗ וְ/אֶל מִשְׁכְּנוֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: id
  text: Utuslah terang-Mu dan kebenaran-Mu[a]; biarlah keduanya menuntun aku, biarlah keduanya membawa aku ke gunung-Mu yang kudus dan ke tempat-tempat kediaman-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan-Mu”; kata Ibrani אֱמֶת dapat menyatakan kebenaran, keterandalan, atau kesetiaan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “tempat-tempat kediaman-Mu” berbentuk jamak; secara tradisional juga diterjemahkan “tabernakel-tabernakel-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: Utuslah
  rationale: Bentuk imperatif orang kedua tunggal maskulin dari שלח. Dalam konteks puitis ini, “utuslah” menyampaikan tindakan mengirim ke luar dengan suatu maksud lebih kuat daripada sekadar “kirimlah”.
- source_word: אוֹרְךָ
  choice: terang-Mu
  rationale: אוֹר secara umum berarti “terang.” Pilihan konkret ini mempertahankan citra puitis meskipun dalam konteksnya terang menyiratkan tuntunan dan keselamatan.
- source_word: אֲמִתְּךָ
  choice: kebenaran-Mu
  rationale: אֱמֶת dapat berarti kebenaran, keterandalan, atau kesetiaan. “Kebenaran-Mu” merupakan padanan langsung yang tetap membuka keluasan maknanya; kemungkinan “kesetiaan-Mu” dicatat dalam catatan kaki.
- source_word: הֵמָּה
  choice: keduanya
  rationale: Pronomina jamak yang diberi penekanan merujuk kepada “terang-Mu dan kebenaran-Mu.” Karena bahasa Indonesia tidak menandai jumlah pada pronomina orang ketiga, “keduanya” secara alami mempertahankan rujukan jamak dan penekanannya.
- source_word: יַנְחוּנִי
  choice: biarlah keduanya menuntun aku
  rationale: Bentuk hiphil imperfek dari נחה dengan sufiks orang pertama tunggal, yang sesudah imperatif berdaya jusif. “Menuntun aku” mempertahankan gambaran bimbingan ilahi.
- source_word: יְבִיאוּנִי
  choice: biarlah keduanya membawa aku
  rationale: Bentuk hiphil imperfek dari בוא dengan sufiks orang pertama tunggal, juga berdaya jusif dalam konteks ini. “Membawa aku” mempertahankan gerak menuju hadirat Allah.
- source_word: הַר קָדְשְׁךָ
  choice: gunung-Mu yang kudus
  rationale: Secara harfiah frasa konstruksi ini berarti “gunung kekudusan-Mu”; “gunung-Mu yang kudus” merupakan ungkapan Indonesia yang alami dan tidak menambahkan identifikasi eksplisit sebagai Sion.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: tempat-tempat kediaman-Mu
  rationale: Bentuk jamak dari מִשְׁכָּן. Pilihan ini mempertahankan bentuk jamak serta makna tempat tinggal tanpa memakai istilah tradisional yang lebih teknis, “kemah-kemah suci-Mu” atau “tabernakel-tabernakel-Mu”.
theological_decisions:
- issue: Apakah “terang” dan “kebenaran” harus dipahami sebagai sifat abstrak atau agen yang dipersonifikasikan
  choice: Mempertahankan personifikasi puitis dengan “biarlah keduanya menuntun aku” dan “biarlah keduanya membawa aku.”
  alternative: Menafsirkannya secara eksplisit sebagai tuntunan Allah yang menyelamatkan tanpa bahasa personifikasi.
  rationale: Teks Ibrani memakai pronomina mandiri dan verba jamak yang merujuk kembali kepada terang dan kebenaran. Personifikasi dipertahankan agar gambaran puitis dan ketegangan teks tidak diratakan menjadi parafrasa.
- issue: Apakah Sion atau bait harus disebutkan secara eksplisit
  choice: Memakai “gunung-Mu yang kudus” dan “tempat-tempat kediaman-Mu” tanpa menambahkan Sion atau bait.
  alternative: “Gunung Sion-Mu” atau “tempat kudus-Mu.”
  rationale: Walaupun acuannya kemungkinan besar adalah Sion dan tempat suci, bahasa Ibrani sendiri menggunakan ungkapan puitis yang lebih luas. Terjemahan tidak mempersempit acuan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang luhur tetapi mudah dipahami. Kapital pada sufiks posesif yang mengacu kepada Allah mengikuti kebiasaan ejaan religius Indonesia. Pengulangan “biarlah keduanya” mempertahankan kesejajaran puitis dan memperjelas subjek jamak.
