id: PSA.43.1
reference: Psalms 43:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׁפְטֵ֤/נִי אֱלֹהִ֨ים וְ/רִ֘יבָ֤/ה רִיבִ֗/י מִ/גּ֥וֹי לֹא חָסִ֑יד מֵ֤/אִישׁ מִרְמָ֖ה וְ/עַוְלָ֣ה תְפַלְּטֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: id
  text: Belalah aku, ya Allah, dan perjuangkanlah perkaraku melawan bangsa yang tidak setia[a]; selamatkanlah aku dari orang yang penuh tipu daya dan kezaliman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “bangsa yang tidak saleh”; bahasa Ibrani: “bangsa yang tidak setia/loyal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Belalah aku
  rationale: Dalam mazmur permohonan, imperatif שׁפט dengan objek orang meminta Allah menjatuhkan putusan yang membenarkannya. “Belalah aku” menyampaikan maksud forensik itu secara alami tanpa memberi kesan bahwa pemazmur sekadar meminta dirinya diperiksa.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Sapaan langsung dalam doa secara wajar dinyatakan dengan partikel vokatif “ya” dalam bahasa Indonesia.
- source_word: וְרִיבָה רִיבִי
  choice: dan perjuangkanlah perkaraku
  rationale: Gabungan verba ריב dan nomina serumpunnya merupakan ungkapan hukum tentang menangani atau memperjuangkan perkara seseorang. Pilihan ini mempertahankan citra ruang pengadilan sekaligus terdengar wajar.
- source_word: מִגּוֹי לֹא חָסִיד
  choice: melawan bangsa yang tidak setia
  rationale: Dalam konteks perkara hukum, preposisi מִן menunjuk pihak lawan sehingga “melawan” tepat. חָסִיד berkaitan dengan kesetiaan dan pengabdian; bentuk negatifnya diterjemahkan “tidak setia” untuk mempertahankan dimensi relasional-etisnya.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: dari orang yang penuh tipu daya dan kezaliman
  rationale: אִישׁ yang diikuti nomina abstrak menggambarkan seseorang yang dicirikan oleh sifat-sifat tersebut. “Orang” mempertahankan bentuk tunggal generik, sedangkan “tipu daya dan kezaliman” mencerminkan kedua nomina Ibrani.
- source_word: תְפַלְּטֵנִי
  choice: selamatkanlah aku
  rationale: Bentuk piel פלט menyatakan tindakan membawa seseorang keluar dari bahaya menuju keselamatan. “Selamatkanlah aku” jelas, mendesak, dan sesuai dengan ragam doa Indonesia.
theological_decisions:
- issue: Makna חָסִיד dalam ungkapan negatif
  choice: tidak setia
  alternative: tidak saleh
  rationale: חָסִיד berhubungan dengan חֶסֶד dan dapat menunjuk orang yang setia atau berbakti. “Tidak setia” mempertahankan unsur kesetiaan relasional, sementara catatan kaki menjaga kemungkinan pengertian religius-etis “tidak saleh” tanpa memaksakan salah satunya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Bentuk imperatif dengan -lah mempertahankan nada doa yang sungguh-sungguh; citra hukum pada dua klausa pertama tetap dijaga.
