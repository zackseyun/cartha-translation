  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: id
  text: Sebab Engkaulah Allah perlindunganku[a]. Mengapa Engkau menolak aku? Mengapa aku berjalan sambil berkabung di bawah penindasan musuh?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah, kubu pertahananku” atau “Allah, kekuatanku.” Kata Ibrani ini dapat berarti tempat perlindungan, kubu pertahanan, atau kekuatan, sesuai konteks.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Mengapa aku berjalan dalam kemuraman di bawah penindasan musuh?” Bahasa Ibrani secara harfiah menggambarkan orang yang berjalan dalam keadaan muram atau menjadi gelap, suatu ungkapan dukacita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar seruan pemazmur dan mempertahankan hubungan kausal dengan konteks sebelumnya.
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: Allah, tempat perlindunganku
  rationale: מָעוֹז dapat menunjuk pada perlindungan, kubu pertahanan, atau kekuatan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran Allah sebagai sumber keamanan.
- source_word: זְנַחְתָּנִי
  choice: Engkau menolak aku
  rationale: זנח menyatakan tindakan menolak atau membuang. 'Menolak aku' jelas dan kuat tanpa memperluas maknanya menjadi penelantaran mutlak.
- source_word: קֹדֵר
  choice: dengan berkabung
  rationale: Secara harfiah kata ini menggambarkan keadaan muram atau menjadi gelap, dan dalam konteks ini berfungsi sebagai ungkapan dukacita atau perkabungan.
- source_word: אֶתְהַלֵּךְ
  choice: aku harus berjalan
  rationale: Bentuk hitpael imperfek menggambarkan keadaan atau gerak yang berlangsung. Dalam pertanyaan ratapan, 'harus berjalan' secara alami menyampaikan pengalaman yang terus dijalani, meskipun unsur keharusan tidak dinyatakan secara leksikal.
- source_word: בְּלַחַץ אוֹיֵב
  choice: karena penindasan musuh
  rationale: Preposisi ב dapat menyatakan keadaan atau sebab. Pilihan ini menghasilkan bahasa Indonesia yang alami sambil mempertahankan musuh sebagai sumber penindasan.
theological_decisions:
- issue: Bahasa penolakan ilahi dalam ratapan
  choice: Mengapa Engkau menolak aku?
  alternative: Mengapa Engkau membuang aku?
  rationale: Keluhan langsung pemazmur dipertahankan tanpa dilunakkan atau dijelaskan secara doktrinal, sehingga ketegangan antara pengakuan bahwa Allah adalah perlindungannya dan pengalaman ditolak tetap terasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti untuk Allah digunakan sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia. Pengulangan 'Mengapa' dipertahankan untuk menjaga daya retoris ratapan.
