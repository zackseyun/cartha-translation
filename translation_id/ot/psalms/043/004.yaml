  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָב֤וֹאָה אֶל מִזְבַּ֬ח אֱלֹהִ֗ים אֶל אֵל֮ שִׂמְחַ֪ת גִּ֫ילִ֥/י וְ/אוֹדְ/ךָ֥ בְ/כִנּ֗וֹר אֱלֹהִ֥ים אֱלֹהָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: id
  text: Maka aku akan datang ke mezbah Allah, kepada Allah, sukacita kegembiraanku; dan aku akan memuji-Mu dengan lira[b], ya Allah, Allahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Lira adalah alat musik petik kuno. Istilah Ibrani kinnor juga dapat diterjemahkan “harpa” atau “kecapi”, meskipun kemungkinan besar alat ini lebih menyerupai lira.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: Maka aku akan datang
  rationale: Bentuk kohortatif orang pertama tunggal menyatakan tekad atau hasil yang diharapkan sesudah permohonan pada ayat sebelumnya. “Maka” memperjelas urutan itu secara alami tanpa menghilangkan nuansa kehendak.
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: ke mezbah Allah
  rationale: Menerjemahkan rangkaian konstruksi Ibrani secara langsung dan tetap mempertahankan ragam bahasa ibadah yang khidmat.
- source_word: אֶל אֵל
  choice: kepada Allah
  rationale: אֵל di sini berfungsi sebagai sebutan ilahi yang sejajar dengan אֱלֹהִים. “Allah” menyatakan rujukannya secara wajar tanpa memaksakan perbedaan makna antargelar.
- source_word: שִׂמְחַת גִּילִי
  choice: sukacita yang membuatku bersorak
  rationale: Ungkapan Ibrani merangkaikan dua kata yang berdekatan artinya untuk penegasan. Terjemahan ini mempertahankan kedua citra kegembiraan itu dalam bahasa Indonesia yang alami, sambil tetap menyatakan bahwa Allah sendiri adalah sukacita pemazmur.
- source_word: וְאוֹדְךָ
  choice: Aku akan memuji-Mu
  rationale: Dalam konteks ibadah dengan iringan alat musik, bentuk Hifil dari ידה paling tepat menyatakan pujian yang ditujukan kepada Allah; “bersyukur kepada-Mu” tetap merupakan kemungkinan leksikal.
- source_word: בְכִנּוֹר
  choice: dengan lira
  rationale: כִּנּוֹר menunjuk alat musik petik kuno yang lebih dekat dengan lira daripada harpa atau kecapi dalam pengertian modern.
- source_word: אֱלֹהִים אֱלֹהָי
  choice: ya Allah, Allahku
  rationale: Partikel “ya” menandai sapaan langsung secara alami, sedangkan pengulangan dipertahankan untuk menyampaikan penekanan dan kedekatan pribadi.
theological_decisions:
- issue: Pengulangan sebutan ilahi אֱלֹהִים dan אֵל
  choice: Keduanya diterjemahkan “Allah”, dengan pengulangan tetap dipertahankan.
  alternative: Menerjemahkan אֵל sebagai “Allah Yang Mahakuasa” atau mentransliterasikannya sebagai “El”.
  rationale: Puisi ini memakai beberapa sebutan bagi Pribadi ilahi yang sama dan tidak menuntut pembedaan doktrinal di antara sebutan-sebutan itu. Terjemahan “Allah” mempertahankan kesejajaran dan menghindari penambahan sifat yang tidak dinyatakan secara eksplisit.
- issue: Hubungan Allah dengan שִׂמְחַת גִּילִי
  choice: Allah disebut “sukacita yang membuatku bersorak”.
  alternative: “sukacitaku yang melimpah” atau bentuk harfiah “sukacita kegembiraanku”.
  rationale: Pilihan utama mempertahankan identifikasi langsung Allah sebagai sukacita pemazmur dan gema dua istilah kegembiraan, tanpa menjadikannya sekadar pernyataan mengenai kadar emosi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai huruf kapital sesuai kebiasaan penulisan religius Indonesia. Struktur puitis dan pengulangan “Allah” dipertahankan, sedangkan ungkapan kegembiraan dibuat alami tanpa menghapus intensifikasi bahasa sumber.
