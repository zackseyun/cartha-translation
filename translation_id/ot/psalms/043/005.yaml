  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: id
  text: Mengapa engkau tertunduk, hai jiwaku, dan mengapa engkau gelisah di dalam diriku? Berharaplah kepada Allah, sebab aku akan lagi memuji Dia, Sang Penyelamat wajahku, Allahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibrani ini berbunyi “keselamatan-keselamatan wajahku dan Allahku.” Susunannya padat dan hubungan tepat antarunsurnya diperdebatkan. Frasa ini mungkin menyebut Allah sebagai Dia yang menyelamatkan dan memulihkan wajah pemazmur yang tertunduk; dapat juga diterjemahkan, “keselamatan wajahku dan Allahku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: engkau tertunduk
  rationale: Bentuk ini mempertahankan gambaran konkret tentang jiwa yang membungkuk atau merunduk karena tertekan, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Dalam konteks sapaan kepada diri sendiri, 'jiwaku' mempertahankan ungkapan puitis Ibrani dan tetap mudah dipahami.
- source_word: תֶּהֱמִי
  choice: engkau bergelora
  rationale: Kata kerja ini menggambarkan kegaduhan atau gejolak batin. 'Bergelora' mempertahankan daya metaforisnya tanpa membatasi makna hanya pada rasa gelisah.
- source_word: עָלַי
  choice: di dalam diriku
  rationale: Secara harfiah berarti 'atas diriku', tetapi dalam konteks gejolak jiwa, ungkapan idiomatis Indonesia 'di dalam diriku' menyampaikan maksudnya dengan jelas.
- source_word: הוֹחִילִי
  choice: Berharaplah
  rationale: Imperatif ini menyerukan penantian penuh harap kepada Allah; 'berharaplah' ringkas, alami, dan sesuai dengan konteks.
- source_word: לֵאלֹהִים
  choice: kepada Allah
  rationale: Preposisi menandai Allah sebagai tujuan atau sandaran pengharapan. Dalam bahasa Indonesia, 'berharap kepada Allah' adalah bentuk yang alami.
- source_word: עוֹד
  choice: masih
  rationale: Kata ini menunjuk pada pujian yang tetap atau kelak akan dilakukan sekalipun keadaan sekarang penuh kesesakan. 'Masih akan' mempertahankan nuansa keteguhan dan masa depan.
- source_word: אוֹדֶנּוּ
  choice: aku ... akan memuji Dia
  rationale: Kata kerja ini dalam konteks mazmur berarti mengakui, bersyukur kepada, atau memuji. 'Memuji Dia' paling sesuai dengan konteks ibadah.
- source_word: יְשׁוּעוֹת
  choice: keselamatan
  rationale: Bentuk jamak dapat berfungsi secara intensif atau abstrak. Bentuk tunggal kolektif 'keselamatan' alami dalam bahasa Indonesia dan tetap dekat dengan makna sumber.
- source_word: פָּנַי
  choice: wajahku
  rationale: '''Wajahku'' mempertahankan citra konkret Ibrani dan hubungannya dengan jiwa yang tertunduk pada awal ayat.'
- source_word: וֵאלֹהָי
  choice: dan Allahku
  rationale: Terjemahan ini mempertahankan konjungsi dan penutup pengakuan pribadi dalam teks Masoret.
theological_decisions:
- issue: Makna dan hubungan sintaksis יְשׁוּעוֹת פָּנַי וֵאלֹהָי
  choice: keselamatan bagi wajahku dan Allahku
  alternative: Dia yang menyelamatkan wajahku, Allahku
  rationale: Teks Masoret secara harfiah berbunyi kurang lebih 'keselamatan-keselamatan wajahku dan Allahku'. Terjemahan utama mempertahankan nomina 'keselamatan', citra wajah, dan ketegangan sintaksisnya, sedangkan catatan kaki menjelaskan kemungkinan bahwa Allah adalah Dia yang memulihkan wajah pemazmur yang tertunduk.
translation_notes:
  register: Bahasa Indonesia modern dengan ragam puitis yang khidmat. Sapaan diri 'hai jiwaku' dan citra 'tertunduk'–'wajahku' dipertahankan untuk menjaga kesatuan puisi. Ungkapan penutup sengaja tidak dihaluskan sepenuhnya karena teks Ibraninya padat dan memiliki ketegangan sintaksis yang nyata.
