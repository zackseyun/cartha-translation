  source_fidelity: Teks sumber menyatakan secara puitis, “Milik-Mulah suatu lengan dengan kekuatan; tangan-Mu kuat; tangan kanan-Mu terangkat/menjulang.” Draf mempertahankan tiga citra tubuh dan predikasi pada dua baris terakhir dengan baik. Namun, “penuh keperkasaan” lebih bebas daripada עִם גְּבוּרָה (“dengan kekuatan/keperkasaan”) dan “keperkasaan” dapat bernuansa kemaskulinan, bukan semata-mata daya atau kekuatan. “Lengan yang perkasa” menyampaikan citra dan daya yang dimaksud secara lebih idiomatis.
