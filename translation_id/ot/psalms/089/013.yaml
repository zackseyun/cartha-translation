  terminology: “Lengan,” “tangan,” dan “tangan kanan” tepat dan perlu dipertahankan sebagai metafora tubuh dalam puisi Ibrani. “Perkasa” adalah padanan yang lebih netral dan modern untuk גְּבוּרָה dalam konteks ini daripada “keperkasaan.” “Terangkat tinggi” dengan aman mempertahankan ambiguitas antara keadaan tinggi/ditinggikan dan gambaran pengangkatan.
