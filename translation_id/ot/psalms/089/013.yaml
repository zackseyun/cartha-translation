  yaml_path: translation/ot/psalms/089/013.yaml
  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: id
  text: Milik-Mulah lengan yang perkasa[a]; tangan-Mu kuat; tangan kanan-Mu terangkat tinggi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Engkau mempunyai lengan yang perkasa.”'
    reason: Alternatif ini mencerminkan cara lain yang wajar untuk mengungkapkan konstruksi kepemilikan לְךָ.
lexical_decisions:
- source_word: לְךָ
  choice: adalah milik-Mu
  rationale: Bentuk לְ dengan sufiks orang kedua menyatakan kepemilikan dan ditempatkan secara menonjol dalam bahasa Ibrani. Ungkapan ini mempertahankan penekanan tersebut dengan susunan yang tetap wajar dalam bahasa Indonesia.
- source_word: זְרוֹעַ
  choice: lengan
  rationale: Makna konkretnya adalah “lengan”, yang di sini menjadi gambaran puitis bagi kuasa. Citra tubuh dipertahankan dan tidak diabstrakkan menjadi “kekuatan”.
- source_word: עִם גְּבוּרָה
  choice: yang penuh keperkasaan
  rationale: Gabungan עִם dan גְּבוּרָה menggambarkan lengan yang disertai atau bercirikan daya besar. “Penuh keperkasaan” alami, puitis, dan menjaga nuansa kekuatan yang gagah.
- source_word: תָּעֹז
  choice: kuat
  rationale: Kata kerja ini menyatakan keadaan atau tampilnya kekuatan. Dengan subjek “tangan-Mu”, predikat “kuat” menyampaikan maknanya secara ringkas dan alami.
- source_word: יָדְךָ
  choice: tangan-Mu
  rationale: Terjemahan harfiah mempertahankan gambaran antropomorfis Ibrani tentang kuasa yang bertindak.
- source_word: תָּרוּם
  choice: terangkat tinggi
  rationale: Bentuk dari רום menyatakan menjadi tinggi, menjulang, atau ditinggikan. “Terangkat tinggi” mempertahankan kemungkinan keadaan yang luhur maupun gambaran tangan yang diangkat tanpa membatasinya pada gerak fisik semata.
- source_word: יְמִינֶךָ
  choice: tangan kanan-Mu
  rationale: Terjemahan langsung mempertahankan kesejajaran puitis serta lambang umum bagi kekuatan dan kemenangan.
theological_decisions:
- issue: Bahasa antropomorfis mengenai kuasa Allah
  choice: Mempertahankan “lengan”, “tangan”, dan “tangan kanan” dalam teks utama.
  alternative: Mengabstrakkan semuanya menjadi “kuasa” atau “kekuatan”.
  rationale: Bahasa tubuh merupakan gambaran puitis yang disengaja dalam teks sumber. Mempertahankannya menjaga daya sastra dan tidak menafsirkan metafora secara berlebihan.
- issue: Makna tangan kanan yang “tinggi”
  choice: Menerjemahkan תָּרוּם sebagai “terangkat tinggi”.
  alternative: “Ditinggikan” atau “mulia”.
  rationale: Pilihan ini mempertahankan rentang makna verba רום dan tidak menetapkan apakah frasa itu terutama menggambarkan posisi, kemenangan, atau kemuliaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan khidmat. Sufiks ilahi ditulis dengan huruf kapital menurut kebiasaan ejaan religius Indonesia. Kesejajaran tiga citra tubuh dipertahankan.
