  text: כִּ֣י לַֽ֭/יהוָה מָֽגִנֵּ֑/נוּ וְ/לִ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל מַלְכֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/018.yaml
  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: id
  text: Sebab perisai kita adalah milik TUHAN[a], dan raja kita adalah milik Yang Kudus dari Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab perisai kita kepunyaan TUHAN, dan raja kita kepunyaan Yang Kudus dari Israel.” Bahasa Ibraninya eliptis dan sangat paralel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar bagi pujian atau keyakinan dalam konteks sebelumnya; “Sebab” mempertahankan fungsi penghubung tanpa menambahkan penegasan yang tidak tersurat.
- source_word: לַיהוָה
  choice: adalah milik TUHAN
  rationale: Prefiks ל menyatakan kepemilikan atau hubungan. Ungkapan ini melengkapi konstruksi Ibrani yang eliptis secara wajar dalam bahasa Indonesia. Nama יהוה diterjemahkan “TUHAN” menurut konvensi penerjemahan Alkitab Indonesia.
- source_word: מָגִנֵּנוּ
  choice: perisai kita
  rationale: Terjemahan harfiah mempertahankan citra puitis yang lazim dan mudah dipahami; dalam konteks mazmur kerajaan, metafora ini dapat menunjuk kepada pelindung atau raja tanpa memaksakan referennya dalam teks utama.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: dan raja kita adalah milik Yang Kudus dari Israel
  rationale: Prefiks ל pada bagian kedua sejajar dengan bagian pertama dan paling wajar dipahami sebagai relasi kepemilikan. Susunan kata disesuaikan agar alami dalam bahasa Indonesia sambil mempertahankan kesejajaran kedua klausa.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Yang Kudus dari Israel
  rationale: Ini adalah gelar ilahi yang dikenal dalam Alkitab Ibrani. Bentuk lengkapnya mempertahankan kekhidmatan dan keterkenalan gelar tersebut.
- source_word: מַלְכֵּנוּ
  choice: raja kita
  rationale: Kata benda ini secara langsung berarti “raja”; pilihan tersebut mempertahankan citra kerajaan dan kemungkinan acuan kepada raja manusia sebagai wakil umat.
theological_decisions:
- issue: Acuan “perisai kita” dan “raja kita”
  choice: Teks utama mempertahankan kedua ungkapan sebagai milik TUHAN/Yang Kudus dari Israel, dengan kemungkinan bahwa “perisai” merupakan sebutan metaforis bagi raja sebagai pelindung umat.
  alternative: “Perisai kita” mengacu langsung kepada Allah, sedangkan “raja kita” mengacu kepada raja manusia.
  rationale: 'Kedua bagian memakai konstruksi ל yang sejajar: “milik TUHAN” dan “milik Yang Kudus dari Israel.” Terjemahan mempertahankan kesejajaran dan keelipsisan teologis ini tanpa menentukan referen metafora secara berlebihan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Perisai” dipertahankan sebagai metafora puitis; “adalah milik” dipilih agar konstruksi kepemilikan jelas dan kedua bagian tetap sejajar.
