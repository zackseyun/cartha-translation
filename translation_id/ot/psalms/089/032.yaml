  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: id
  text: Maka Aku akan menghukum pelanggaran mereka dengan tongkat, dan kesalahan mereka dengan pukulan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku akan mendatangi pelanggaran mereka dengan tongkat, dan kesalahan mereka dengan pukulan.” Kata kerja Ibrani dapat berarti “mendatangi” atau “memperhatikan” dalam arti menuntut pertanggungjawaban atau menghukum; kata yang diterjemahkan “pukulan” juga dapat berarti “tulah,” “penderitaan,” atau “bilur.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Maka Aku akan menghukum
  rationale: Dalam konteks pendisiplinan ini, פקד berarti mendatangi atau memperhatikan untuk menghukum. 'Maka' menyatakan kelanjutan dari syarat pada ayat sebelumnya, sedangkan 'menghukum' menyampaikan maksudnya secara alami.
- source_word: בְשֵׁבֶט
  choice: dengan tongkat
  rationale: שֵׁבֶט dapat berarti tongkat, gada, atau tongkat kerajaan. Di sini gambaran yang dimaksud ialah alat pendisiplinan, sehingga 'tongkat' paling sesuai tanpa menggesernya ke lambang pemerintahan.
- source_word: פִּשְׁעָם
  choice: pelanggaran mereka
  rationale: פֶּשַׁע dapat menunjuk pada pelanggaran atau pemberontakan. 'Pelanggaran' mempertahankan bobot moralnya dan cocok dengan paralelisme tanpa mempersempit makna menjadi pemberontakan politik.
- source_word: וּבִנְגָעִים
  choice: dan ... dengan pukulan
  rationale: נֶגַע dapat berarti tulah, penderitaan, bilur, atau pukulan. Dalam kesejajaran dengan 'tongkat', 'pukulan' secara wajar menggambarkan hukuman yang ditimpakan dan tidak membatasi makna pada penyakit.
- source_word: עֲוֺנָם
  choice: kesalahan mereka
  rationale: עָוֹן mencakup kesalahan moral, kebersalahan, dan kadang akibat kesalahan. 'Kesalahan' alami dalam bahasa Indonesia modern serta mempertahankan kesejajaran dengan 'pelanggaran'.
theological_decisions:
- issue: Sifat tanggapan Allah terhadap dosa anggota perjanjian
  choice: Ayat ini menyatakan hukuman pendisiplinan yang nyata dengan gambaran tongkat dan pukulan.
  alternative: Bahasanya dapat diperhalus menjadi sekadar tindakan memperhatikan atau koreksi umum.
  rationale: Gambaran konkret dalam teks tidak boleh dilemahkan. Namun, terjemahan ayat ini juga tidak menambahkan kesimpulan doktrinal mengenai penolakan terakhir; konteks mazmur yang lebih luas tetap mempertahankan ketegangan antara disiplin dan kesetiaan perjanjian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. Kapitalisasi 'Aku' mengikuti ujaran ilahi. Susunan paralel Ibrani dipertahankan, sedangkan 'Maka' menghubungkan ayat ini dengan kondisi pada ayat sebelumnya.
