  yaml_path: translation/ot/psalms/089/022.yaml
  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: id
  text: Musuh tidak akan memeras dia[a], dan orang jahat[b] tidak akan menindasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat berarti “menipu dia”, “memperdaya dia”, atau “membebankan tuntutan kepadanya”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak kejahatan” atau “anak kelaliman”, sebuah ungkapan Ibrani untuk orang jahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: akan memeras
  rationale: Bentuk Hifil ini dapat menunjuk pada tindakan menipu, memperdaya, atau membebankan tuntutan kepada seseorang. Dalam konteks perlindungan raja dan kesejajarannya dengan “menindas”, “memeras” menyampaikan eksploitasi bermusuhan tanpa mempersempitnya hanya pada upeti.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Padanan baku dan wajar bagi nomina tunggal ini dalam konteks kerajaan dan permusuhan.
- source_word: בּוֹ
  choice: dia
  rationale: Dengan verba “memeras”, objek manusia dinyatakan langsung dalam bahasa Indonesia; fungsi preposisi Ibrani terserap secara alami ke dalam konstruksi verba transitif.
- source_word: בֶן עַוְלָה
  choice: orang jahat
  rationale: Ungkapan harfiah “anak kejahatan/kelaliman” adalah idiom Ibrani untuk orang yang bercirikan kejahatan. “Orang jahat” alami dan mudah dipahami, sedangkan bentuk idiom aslinya dicatat dalam catatan kaki.
- source_word: יְעַנֶּנּוּ
  choice: tidak akan menindasnya
  rationale: Bentuk Piel dari ענה di sini berarti menindas atau menyengsarakan. “Menindas” sesuai dengan ancaman dari pelaku kejahatan dan sejajar dengan “memeras”.
theological_decisions:
- issue: Rujukan tokoh tunggal yang dilindungi
  choice: Mempertahankan pronomina tunggal “dia/-nya” tanpa penjelasan identitas.
  alternative: Menuliskan secara eksplisit Daud, raja keturunan Daud, atau Mesias.
  rationale: Teks Ibrani hanya memakai rujukan maskulin tunggal kepada tokoh kerajaan dalam konteks perjanjian. Terjemahan tidak menetapkan identifikasi teologis yang lebih sempit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. Pilihan “memeras” dan “menindas” mempertahankan paralelisme tindakan bermusuhan; idiom Ibrani yang kurang alami dijelaskan dalam catatan kaki.
