base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: id
  text: Ingatlah, ya Tuhan, celaan terhadap hamba-hamba-Mu, yang kutanggung dalam dadaku[b] dari sekian banyak bangsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “yang kutanggung dalam dadaku: semua celaan dari banyak bangsa.” Sintaksis Ibrani sesudah “dalam dadaku” sangat padat. Frasa itu dapat dipahami sebagai menunjukkan sumber celaan (“dari sekian banyak bangsa”) atau sebagai isi/cakupan celaan yang ditanggung.'
    reason: alternative_reading
  - marker: b
    text: Ungkapan “dalam dadaku” merupakan idiom Ibrani untuk menanggung sesuatu secara pribadi dan mendalam, bukan sekadar membawanya secara jasmani.
    reason: cultural_note
lexical_decisions:
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Bentuk imperatif maskulin tunggal dari זכר, berupa permohonan langsung kepada Allah. “Ingatlah” alami dalam bahasa doa dan ratapan, serta tidak menyiratkan bahwa Tuhan sebelumnya lupa.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Di sini אֲדֹנָי adalah gelar ilahi baku dalam sapaan langsung. “Tuhan” merupakan padanan Indonesia yang wajar tanpa menambahkan nuansa posesif “Tuhanku” yang tidak perlu.
- source_word: חֶרְפַּת
  choice: celaan terhadap
  rationale: חֶרְפָּה mencakup cela, penghinaan, dan keadaan dipermalukan. “Celaan terhadap” memperjelas bahwa para hamba menjadi sasaran celaan tanpa membatasinya hanya pada ejekan lisan.
- source_word: עֲבָדֶיךָ
  choice: hamba-hamba-Mu
  rationale: Dalam bahasa doa tentang umat Allah, “hamba-hamba-Mu” adalah padanan yang alami dan sesuai konteks bagi bentuk jamak עבד dengan sufiks orang kedua tunggal.
- source_word: שְׂאֵתִי
  choice: yang kutanggung
  rationale: Berasal dari נשׂא, “mengangkat, membawa, menanggung.” Dalam konteks ini pemazmur secara pribadi memikul atau menahan celaan itu; klausa relatif menghasilkan bahasa Indonesia yang alami.
- source_word: בְחֵיקִי
  choice: di dalam dadaku
  rationale: חֵיק secara konkret menunjuk pada dada atau pangkuan. Pilihan ini mempertahankan citra Ibrani tentang memikul sesuatu dekat pada diri sendiri, sementara catatan kaki menjelaskan fungsi idiomatisnya.
- source_word: כָּל רַבִּים עַמִּים
  choice: dari banyak bangsa
  rationale: Susunan Ibraninya padat dan sukar. Dalam bacaan utama, frasa ini dipahami sebagai sumber celaan; “dari” ditambahkan secara idiomatis. עַמִּים berbentuk jamak dan lazim menunjuk pada bangsa-bangsa, bukan sekadar banyak orang. Unsur keseluruhan/intensifikasi dalam כָּל tercakup oleh keluasan ungkapan, sedangkan kemungkinan konstruksi alternatif dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Tuhanku
  rationale: Kata ini berfungsi sebagai gelar ilahi yang tetap dalam sapaan kepada Allah. “Tuhan” mempertahankan pemakaian tersebut tanpa mengubahnya menjadi bentuk posesif eksplisit.
- issue: Hubungan sintaksis frasa כָּל רַבִּים עַמִּים
  choice: 'Dipahami sebagai sumber celaan: “dari banyak bangsa”'
  alternative: 'Dipahami sebagai isi atau cakupan yang ditanggung: “celaan dari semua bangsa yang banyak itu” atau “semua bangsa yang banyak itu”'
  rationale: Sintaksis sesudah “di dalam dadaku” sangat padat dan memungkinkan lebih dari satu pengaitan. Teks utama memilih pembacaan yang kontekstual dan alami, tetapi catatan kaki mempertahankan ambiguitas asli tanpa menjadikannya kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “ya Tuhan” wajar dalam doa; “hamba-hamba-Mu” mempertahankan ragam mazmur. Citra konkret “di dalam dadaku” sengaja dipertahankan dan dijelaskan melalui catatan kaki. Huruf kapital pada enklitik “-Mu” mengikuti kebiasaan ortografi religius Indonesia.
