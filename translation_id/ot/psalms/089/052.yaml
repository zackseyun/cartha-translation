  text: בָּר֖וּךְ יְהוָ֥ה לְ֝/עוֹלָ֗ם אָ֘מֵ֥ן וְ/אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/052.yaml
  text: Blessed be Yahweh forever[a]. Amen and amen.
translation:
  language: id
  text: Terpujilah Yahweh selama-lamanya! Amin dan amin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Partisip pasif ini dipakai sebagai rumusan doksologis. Dalam bahasa Indonesia, “Terpujilah” menyampaikan fungsi pujian kepada Allah secara alami dan lebih tepat daripada terjemahan harfiah “Diberkatilah”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: לְעוֹלָם
  choice: selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; “selama-lamanya” alami dalam rumusan pujian bahasa Indonesia.
- source_word: אָמֵן וְאָמֵן
  choice: Amin dan amin
  rationale: Pengulangan liturgis beserta kata penghubungnya dipertahankan untuk menyampaikan penegasan yang kuat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna בָּרוּךְ ketika ditujukan kepada Allah
  choice: Terpujilah
  alternative: Diberkatilah
  rationale: Walaupun bentuk Ibraninya secara leksikal berkaitan dengan “diberkati”, dalam rumusan doksologis yang ditujukan kepada Allah maksudnya adalah menyatakan pujian. “Terpujilah” menyampaikan fungsi tersebut secara wajar tanpa menyiratkan bahwa Allah menerima berkat dari pihak yang lebih tinggi.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan liturgis. Tanda seru menandai daya doksologis kalimat pertama; pengulangan “Amin dan amin” dipertahankan.
