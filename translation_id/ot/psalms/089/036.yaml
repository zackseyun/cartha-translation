  text: זַ֭רְע/וֹ לְ/עוֹלָ֣ם יִהְיֶ֑ה וְ/כִסְא֖/וֹ כַ/שֶּׁ֣מֶשׁ נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/036.yaml
  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: id
  text: 'Keturunannya akan tetap ada selama-lamanya,[a]

    dan takhtanya akan seperti matahari di hadapan-Ku.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Benihnya akan ada selama-lamanya.” Kata Ibrani yang diterjemahkan “keturunannya” berbentuk tunggal kolektif dan menunjuk kepada garis keturunan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di hadirat-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעוֹ
  choice: keturunannya
  rationale: זֶרַע secara harfiah dapat berarti “benih”, tetapi dalam konteks perjanjian kerajaan ini menunjuk secara kolektif kepada garis keturunan raja. “Keturunannya” alami dalam bahasa Indonesia dan tetap dapat dipahami sebagai keturunan dinasti.
- source_word: לְעוֹלָם יִהְיֶה
  choice: akan tetap ada selama-lamanya
  rationale: יִהְיֶה secara dasar berarti “akan ada/menjadi”, sedangkan לְעוֹלָם menyatakan keberlangsungan tanpa akhir dalam konteks janji perjanjian. “Akan tetap ada selama-lamanya” menyampaikan daya eksistensial-kontinuatifnya secara wajar.
- source_word: וְכִסְאוֹ
  choice: dan takhtanya
  rationale: כִּסֵּא berarti “takhta” dan di sini melambangkan pemerintahan kerajaan. Citra konkret teks dipertahankan, bukan diabstraksikan menjadi “kerajaan” atau “pemerintahan”.
- source_word: כַשֶּׁמֶשׁ
  choice: seperti matahari
  rationale: Prefiks כ menyatakan perbandingan. “Seperti matahari” mempertahankan perumpamaan itu dengan lugas.
- source_word: נֶגְדִּי
  choice: di hadapan-Ku
  rationale: נֶגֶד dengan akhiran orang pertama tunggal berarti “di hadapanku/di hadiratku”. “Di hadapan-Ku” mempertahankan ungkapan langsung dan khidmat dari tuturan ilahi.
theological_decisions:
- issue: Rujukan pembicara pada akhiran orang pertama dalam נֶגְדִּי
  choice: Mempertahankan “di hadapan-Ku” sebagai perkataan langsung Allah
  alternative: “di hadirat-Ku”
  rationale: Bagian mazmur ini menyajikan TUHAN sedang berbicara tentang Daud dan garis keturunannya. Orang pertama dipertahankan agar daya perjanjian dalam perkataan langsung itu tidak hilang.
- issue: Tidak adanya verba tersurat dalam klausa tentang takhta
  choice: Mempertahankan klausa nominal “dan takhtanya seperti matahari”
  alternative: “dan takhtanya akan seperti matahari”
  rationale: Teks Ibrani tidak mengulang verba pada klausa kedua. Bahasa Indonesia memungkinkan konstruksi nominal ini secara alami, sementara nuansa masa depan tetap terbawa dari klausa pertama; dengan demikian, elipsis puitis dan kemungkinan hubungan antarklausa tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. Bentuk “-Ku” dikapitalisasi karena merujuk kepada Allah sebagai pembicara langsung. Susunan dua baris mempertahankan kesejajaran puisi Ibrani.
