  text: אֵ֣ל נַ֭עֲרָץ בְּ/סוֹד קְדֹשִׁ֣ים רַבָּ֑ה וְ֝/נוֹרָ֗א עַל כָּל סְבִיבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/007.yaml
  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: id
  text: Allah sangat ditakuti dalam majelis[a] orang-orang kudus[b], dan lebih dahsyat daripada semua yang mengelilingi-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perhimpunan”; istilah Ibrani ini dapat menunjuk kepada dewan tertutup atau perkumpulan yang bermusyawarah.
    reason: lexical_alternative
  - marker: b
    text: “Orang-orang kudus” di sini kemungkinan besar adalah makhluk-makhluk surgawi, bukan manusia.
    reason: cultural_note
lexical_decisions:
- source_word: אֵל
  choice: Allah
  rationale: Dalam konteks puisi ini, אֵל menunjuk kepada Allah Israel, bukan kepada suatu ilah secara umum. “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: נַעֲרָץ
  choice: sangat ditakuti
  rationale: Partisipel nifal ini menyatakan bahwa Dia dipandang dengan rasa takut yang penuh hormat dan kekaguman. “Ditakuti” mempertahankan unsur takut tanpa menyiratkan kejahatan moral.
- source_word: בְּסוֹד
  choice: dalam majelis
  rationale: סוֹד dapat berarti lingkungan perundingan yang akrab atau perhimpunan yang bermusyawarah. Dalam konteks ini, “majelis” dengan baik mempertahankan gambaran sidang surgawi.
- source_word: קְדֹשִׁים
  choice: orang-orang kudus
  rationale: Ungkapan ini secara harfiah menyebut pihak-pihak yang kudus tanpa menentukan identitas mereka dalam teks utama. Konteks sangat mungkin menunjuk kepada makhluk-makhluk surgawi; hal itu dijelaskan dalam catatan kaki.
- source_word: רַבָּה
  choice: sangat
  rationale: Kata ini berfungsi secara adverbial untuk memperkuat נַעֲרָץ. “Sangat” menyampaikan kadar yang tinggi secara wajar dalam bahasa Indonesia modern.
- source_word: וְנוֹרָא
  choice: dan lebih dahsyat
  rationale: נוֹרָא menggambarkan Dia sebagai Pribadi yang membangkitkan rasa gentar dan takjub. “Dahsyat” mempertahankan nada agung dan penuh hormat; bentuk komparatif mengikuti hubungan dengan frasa berikutnya.
- source_word: עַל כָּל סְבִיבָיו
  choice: daripada semua yang mengelilingi-Nya
  rationale: 'עַל di sini paling wajar dipahami secara komparatif: Allah membangkitkan kegentaran melampaui semua yang berada di sekeliling-Nya. Rumusan ini menyatakan perbandingan itu dengan jelas.'
theological_decisions:
- issue: Identitas “orang-orang kudus” dan mereka yang mengelilingi Allah
  choice: Teks utama mempertahankan ungkapan umum “orang-orang kudus”; catatan menjelaskan bahwa konteks kemungkinan besar menunjuk kepada makhluk-makhluk surgawi dalam majelis ilahi.
  alternative: Orang-orang saleh di antara manusia, atau suatu perhimpunan penyembah yang mencakup lebih dari satu kelompok.
  rationale: Konteks Mazmur 89 berbicara tentang langit dan perhimpunan surgawi. Namun, karena bahasa Ibraninya sendiri tidak secara eksplisit mengatakan “malaikat” atau “makhluk surgawi”, terjemahan utama tidak mempersempit rujukannya secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Allah” mengikuti pemakaian Alkitab bahasa Indonesia untuk God; “majelis” mempertahankan nuansa deliberatif סוֹד, sedangkan “dahsyat” menyampaikan rasa gentar dan takjub tanpa bernada percakapan.
