id: PSA.89.39
reference: Psalms 89:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נֵ֭אַרְתָּה בְּרִ֣ית עַבְדֶּ֑/ךָ חִלַּ֖לְתָּ לָ/אָ֣רֶץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/039.yaml
  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
translation:
  language: id
  text: Engkau telah menolak[a] perjanjian dengan hamba-Mu; Engkau telah mencemarkan mahkotanya hingga ke tanah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuang” atau “menampik”.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “menajiskan tajnya hingga ke tanah.” Kata Ibrani yang diterjemahkan “mahkota” juga dapat mengandung nuansa pengudusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: telah menolak
  rationale: Bentuk Piel ini menyatakan penolakan atau pengingkaran yang tegas. “Menolak” alami dalam bahasa Indonesia dan tetap mempertahankan kerasnya tuduhan dalam ratapan.
- source_word: בְּרִית
  choice: perjanjian
  rationale: “Perjanjian” merupakan padanan baku yang mempertahankan bobot resmi dan teologis istilah ini dalam konteks perjanjian kerajaan Daud.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Dalam konteks raja keturunan Daud sebagai bawahan dan wakil Allah, “hamba-Mu” paling alami serta mempertahankan hubungan ketundukan tersebut.
- source_word: חִלַּלְתָּ
  choice: telah mencemarkan
  rationale: Kata kerja ini berarti memperlakukan sesuatu yang kudus atau terhormat sebagai cemar. “Mencemarkan” mempertahankan gagasan penodaan sekaligus cocok dengan citra mahkota yang direndahkan.
- source_word: לָאָרֶץ
  choice: hingga ke tanah
  rationale: Secara harfiah berarti “ke bumi/tanah”. Ungkapan “hingga ke tanah” mempertahankan gambaran perendahan total dengan bahasa Indonesia yang wajar dan puitis.
- source_word: נִזְרוֹ
  choice: mahkotanya
  rationale: Dalam mazmur kerajaan ini istilah tersebut menunjuk pada mahkota atau taj kerajaan, tetapi juga memiliki nuansa pengudusan. “Mahkota” menyampaikan rujukan utama, sedangkan nuansa pengudusan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Citra perjanjian kerajaan dan penghinaan terhadap hamba keturunan Daud
  choice: Mempertahankan tuduhan langsung bahwa Allah menolak perjanjian dan mencemarkan mahkota hamba-Nya.
  alternative: Melunakkan ayat menjadi sekadar kekalahan politik atau menafsirkannya secara langsung sebagai nubuat mesianik.
  rationale: Ayat ini menyuarakan ketegangan ratapan atas keruntuhan yang tampak dari perjanjian dengan garis Daud. Terjemahan tidak menyelesaikan ketegangan itu melalui tafsir teologis kemudian dan tidak pula menguranginya menjadi peristiwa politik belaka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Sapaan ilahi memakai “Engkau” dan bentuk terikat “-Mu”. Struktur paralel Ibrani dipertahankan, demikian pula bahasa ratapan yang tajam tanpa melunakkan tuduhan pemazmur.
