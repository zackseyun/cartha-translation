  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/ךָ֣ שָׁ֭מַיִם אַף לְ/ךָ֥ אָ֑רֶץ תֵּבֵ֥ל וּ֝/מְלֹאָ֗/הּ אַתָּ֥ה יְסַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: id
  text: Langit adalah milik-Mu; bumi pun milik-Mu. Dunia dan segala isinya[a]—Engkaulah yang meletakkan dasar bagi semuanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepenuhannya,” yaitu segala sesuatu yang ada di dalam dunia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: milik-Mu
  rationale: Preposisi ל dengan akhiran orang kedua maskulin tunggal menyatakan kepemilikan. Ungkapan “milik-Mu” langsung, alami, dan mempertahankan kesejajaran puitis.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” secara alami dapat menunjuk seluruh ranah langit meskipun bentuk Ibraninya jamak; “langit-langit” tidak tepat karena berarti plafon.
- source_word: אַף
  choice: pun
  rationale: Partikel ini memperluas penegasan dari langit kepada bumi. “Pun” menyampaikan arti “juga” dengan ringkas dan puitis.
- source_word: אָרֶץ
  choice: bumi
  rationale: Kesejajarannya dengan langit serta penyebutan dunia dan isinya menunjukkan cakupan kosmis, bukan sebatas suatu negeri.
- source_word: תֵּבֵל
  choice: dunia
  rationale: Kata ini menunjuk dunia sebagai bumi yang tertata atau berpenghuni. “Dunia” merupakan padanan modern yang alami.
- source_word: מְלֹאָהּ
  choice: segala isinya
  rationale: Secara harfiah berarti “kepenuhannya,” yakni segala sesuatu yang memenuhi atau berada di dalam dunia. “Segala isinya” menyampaikan makna itu secara jelas dalam bahasa Indonesia modern.
- source_word: יְסַדְתָּם
  choice: Engkaulah yang meletakkan dasar bagi semuanya
  rationale: Kata kerja יסד membawa gambaran mendirikan atau meletakkan dasar. Bentuk objek jamaknya dipertahankan melalui “semuanya,” sementara susunan “Engkaulah” menonjolkan subjek seperti אַתָּה dalam bahasa Ibrani.
theological_decisions:
- issue: Kepemilikan ilahi dan tindakan penciptaan
  choice: Ayat diterjemahkan sebagai penegasan bahwa langit dan bumi adalah milik Allah dan bahwa Dia meletakkan dasar bagi dunia beserta seluruh isinya.
  alternative: Memperluasnya menjadi rumusan eksplisit tentang penciptaan dari ketiadaan, atau menguranginya menjadi pernyataan kedaulatan tanpa tindakan pendirian.
  rationale: Teks Ibrani menyatakan baik kepemilikan melalui לְךָ maupun tindakan mendasar melalui יסד. Terjemahan mempertahankan keduanya tanpa menambahkan rumusan teologis yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis. Kapitalisasi pada pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Tanda pisah mempertahankan penekanan pada אַתָּה, “Engkaulah.”
