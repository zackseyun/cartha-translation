id: PSA.89.1
reference: Psalms 89:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה לְ/דֹ֥ר וָ/דֹ֓ר אוֹדִ֖יעַ אֱמוּנָתְ/ךָ֣ בְּ/פִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: id
  text: 'Kasih setia Yahweh[a] akan kunyanyikan selama-lamanya;

    turun-temurun, aku akan memberitakan kesetiaan-Mu dengan mulutku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belas kasihan” atau “tindakan-tindakan kasih setia.” Kata Ibrani yang dipakai berbentuk jamak dan dapat menunjuk pada kasih perjanjian Yahweh sebagaimana dinyatakan berulang kali dalam tindakan kemurahan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  choice: kasih setia
  rationale: Bentuk jamak konstruksi ini dapat menunjuk pada kasih perjanjian Yahweh yang teguh, yang tampak dalam tindakan-tindakan kemurahan-Nya. “Kasih setia” mempertahankan unsur kasih dan kesetiaan, sedangkan catatan kaki menyatakan nuansa jamaknya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi yang terdapat dalam teks Ibrani tetap terlihat.
- source_word: עוֹלָם
  choice: selama-lamanya
  rationale: Di sini kata ini berfungsi sebagai keterangan waktu bagi tindakan menyanyi dan menyatakan keberlangsungan tanpa batas yang dipandang oleh pemazmur.
- source_word: אָשִׁירָה
  choice: akan kunyanyikan
  rationale: Bentuk kohortatif mengungkapkan tekad atau niat pemazmur. Susunan dengan objek di depan juga mempertahankan penekanan awal teks Ibrani pada kasih setia Yahweh.
- source_word: לְדֹר וָדֹר
  choice: turun-temurun
  rationale: Ungkapan Indonesia ini secara alami menyampaikan kesinambungan dari satu generasi ke generasi berikutnya.
- source_word: אוֹדִיעַ
  choice: aku akan memberitakan
  rationale: Bentuk Hifil dari ידע berarti membuat sesuatu diketahui. “Memberitakan” menyampaikan tindakan menjadikan kesetiaan Allah dikenal secara terbuka, tanpa menghilangkan nuansa kausatifnya.
- source_word: אֱמוּנָתְךָ
  choice: kesetiaan-Mu
  rationale: Dalam paralel dengan חסד, kata ini menunjuk pada sifat Allah yang dapat diandalkan dan tetap setia.
- source_word: בְּפִי
  choice: dengan mulutku
  rationale: Terjemahan konkret ini mempertahankan gambaran Ibrani tentang pemberitaan secara lisan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut dalam bentuk transliterasi yang lazim dalam kajian Ibrani, tanpa menggantinya dengan sebuah gelar.
- issue: Nuansa perjanjian dalam חַסְדֵי
  choice: kasih setia
  alternative: belas kasihan atau tindakan-tindakan kasih setia
  rationale: Konteks mazmur menghubungkan חסד dengan kesetiaan Allah, sehingga “kasih setia” mempertahankan relasi kedua istilah tanpa membatasi maknanya hanya pada belas kasihan. Nuansa tindakan berulang dan bentuk jamaknya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Susunan klausa pertama mempertahankan penekanan teks Ibrani pada “kasih setia Yahweh”; “turun-temurun” dipilih sebagai ungkapan alami bagi kesinambungan antargenerasi. Huruf kapital pada enklitik “-Mu” mengikuti kebiasaan ejaan religius Indonesia untuk sapaan kepada Allah.
