  source_fidelity: 'Teks Indonesia secara tepat mencerminkan struktur dan makna Ibrani: עִמּוֹ diterjemahkan “bersama dia,” יָדִי dan זְרוֹעִי dipertahankan sebagai “tangan-Ku” dan “lengan-Ku,” serta תְאַמְּצֶנּוּ sebagai “akan menguatkan dia.” “Akan tetap teguh” adalah pengungkapan yang dapat diterima untuk תִּכּוֹן dalam konteks janji ilahi, tanpa menghapus citra puitis sumber.'
