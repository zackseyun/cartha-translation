  yaml_path: translation/ot/psalms/089/021.yaml
  text: with whom my hand will be established[a]; indeed[c][b], my arm will strengthen him.
translation:
  language: id
  text: bersama dia tangan-Ku akan tetap teguh[a]; bahkan, lengan-Ku[b] akan menguatkan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan diteguhkan.”'
    reason: lexical_alternative
  - marker: b
    text: “Lengan” merupakan gambaran puitis untuk kekuatan dan kuasa.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר ... עִמּוֹ
  choice: bersama dia
  rationale: אֲשֶׁר menghubungkan klausa ini dengan raja pilihan pada ayat sebelumnya, sedangkan עִמּוֹ berarti ‘bersama dia’. Dalam penggalan ayat ini, ‘bersama dia’ mempertahankan hubungan tersebut tanpa membuat susunan bahasa Indonesia menjadi kaku.
- source_word: יָדִי
  choice: tangan-Ku
  rationale: Terjemahan konkret ini mempertahankan gambaran puitis tentang kuasa dan tindakan Allah.
- source_word: תִּכּוֹן
  choice: akan tetap teguh
  rationale: Bentuk Nifal dari כון menyatakan keadaan yang kukuh, mantap, atau diteguhkan. ‘Akan tetap teguh’ alami dalam bahasa Indonesia dan mempertahankan nuansa keteguhan yang berkelanjutan.
- source_word: אַף
  choice: bahkan
  rationale: Partikel ini memberi penegasan dan kelanjutan yang menguatkan baris sebelumnya.
- source_word: זְרוֹעִי
  choice: lengan-Ku
  rationale: Gambaran tubuh dalam puisi Ibrani dipertahankan, bukan diabstraksikan menjadi ‘kekuatan-Ku’.
- source_word: תְאַמְּצֶנּוּ
  choice: akan menguatkan dia
  rationale: Bentuk Piel dari אמץ dengan akhiran orang ketiga tunggal maskulin menyatakan tindakan membuat dia kuat.
theological_decisions:
- issue: Bahasa antropomorfis tentang tindakan Allah
  choice: Mempertahankan ‘tangan-Ku’ dan ‘lengan-Ku’ sebagai gambaran puitis.
  alternative: Menggantikannya dengan ‘kuasa-Ku’ dan ‘kekuatan-Ku’.
  rationale: Teks Ibrani sengaja memakai gambaran tubuh untuk menyatakan dukungan dan kuasa Allah; mempertahankannya menjaga kekuatan puisinya tanpa menyiratkan penafsiran denominasi tertentu.
- issue: Dukungan yang dijanjikan atau kebenaran umum pada masa kini
  choice: 'Menggunakan bentuk mendatang: ‘akan tetap teguh’ dan ‘akan menguatkan’.'
  alternative: 'Menggunakan bentuk kini atau kebiasaan: ‘tetap teguh’ dan ‘menguatkan’.'
  rationale: Bentuk imperfek dalam konteks janji kerajaan secara wajar menyampaikan komitmen ilahi yang akan terus diwujudkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang bermartabat. Huruf kapital pada akhiran pronominal ‘-Ku’ menandai bahwa pembicara adalah Allah. Susunan awal dengan huruf kecil mencerminkan bahwa ayat ini melanjutkan kalimat dari ayat sebelumnya.
