source:
  edition: WLC
  text: וְ/י֘וֹד֤וּ שָׁמַ֣יִם פִּלְאֲ/ךָ֣ יְהוָ֑ה אַף אֱ֝מֽוּנָתְ/ךָ֗ בִּ/קְהַ֥ל קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: id
  text: Langit akan memuji keajaiban-Mu, ya Yahweh, dan juga kesetiaan-Mu dalam sidang para kudus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang kudus”; dalam konteks ini, “para kudus” kemungkinan merujuk kepada makhluk-makhluk surgawi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹודוּ
  choice: akan memuji
  rationale: Bentuk Hifil dari ידה dalam konteks pujian berarti memuji atau mengucap syukur. Dengan langit sebagai subjek dan keajaiban Yahweh sebagai objek, “memuji” paling alami; bentuk imperfek dipertahankan dengan nuansa masa depan.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” secara alami dapat merujuk pada bentangan surgawi tanpa perlu bentuk jamak yang tidak idiomatis.
- source_word: פִּלְאֲךָ
  choice: keajaiban-keajaiban-Mu
  rationale: פֶּלֶא menunjuk pada sesuatu yang menakjubkan atau perbuatan luar biasa. Bentuk ulang menyampaikan daya kolektif/jamak dalam ungkapan pujian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אַף
  choice: bahkan
  rationale: Kata ini menambahkan penegasan pada unsur berikutnya. “Bahkan” mempertahankan daya emfatis tersebut tanpa menghilangkan hubungan dengan klausa pertama.
- source_word: אֱמוּנָתְךָ
  choice: kesetiaan-Mu
  rationale: אֱמוּנָה di sini menyatakan keterandalan dan keteguhan Yahweh dalam memenuhi komitmen-Nya; “kesetiaan” merupakan padanan Indonesia yang paling jelas.
- source_word: בִּקְהַל
  choice: dalam perhimpunan
  rationale: קָהָל menggambarkan suatu kumpulan yang berhimpun. “Dalam perhimpunan” mempertahankan gambaran komunal dan preposisi lokatif.
- source_word: קְדֹשִׁים
  choice: para kudus
  rationale: Bentuk substantif jamak ini secara harfiah berarti mereka yang kudus. “Para kudus” tidak secara eksplisit membatasi rujukannya pada manusia atau malaikat, sehingga ambiguitas teks tetap terjaga.
theological_decisions:
- issue: Rujukan קְדֹשִׁים (“para kudus”)
  choice: Diterjemahkan secara netral sebagai “para kudus”, dengan catatan bahwa konteks kemungkinan menunjuk kepada makhluk-makhluk surgawi.
  alternative: “orang-orang kudus” atau “malaikat-malaikat”
  rationale: Konteks langsung Mazmur 89 berbicara tentang langit dan sidang surgawi, sehingga makhluk surgawi kemungkinan besar dimaksud. Namun, istilah Ibraninya sendiri tidak secara khusus berarti “malaikat”; karena itu, terjemahan utama tidak mempersempit rujukannya.
translation_notes:
  register: Bahasa puitis, khidmat, dan modern. Pengulangan “keajaiban-keajaiban” dipakai secara wajar untuk menyampaikan daya jamak, sedangkan “perhimpunan” mempertahankan citra sidang resmi. Penanda catatan kaki ditempatkan setelah “para kudus”, yaitu istilah yang dijelaskan oleh catatan.
