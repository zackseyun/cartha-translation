  text: וְ/אַתָּ֣ה זָ֭נַחְתָּ וַ/תִּמְאָ֑ס הִ֝תְעַבַּ֗רְתָּ עִם מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/038.yaml
  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: id
  text: Namun Engkau telah membuang dan menolak; Engkau sangat murka terhadap orang yang Kauurapi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “orang yang Kauurapi” atau “Mesias-Mu.” Istilahnya sama dengan kata yang diterjemahkan “Mesias,” tetapi dalam konteks langsung ayat ini menunjuk kepada raja keturunan Daud yang terikat pada perjanjian Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Namun Engkau
  rationale: Kata penghubung dan pronomina mandiri menandai peralihan yang tajam dari penegasan kesetiaan perjanjian Allah kepada keluhan pemazmur; “Namun Engkau” menyampaikan pertentangan itu secara wajar.
- source_word: זָנַחְתָּ
  choice: telah membuang
  rationale: Kata ini menyatakan tindakan menyingkirkan atau mencampakkan. “Membuang” mempertahankan gambaran kuat dalam ratapan tanpa menentukan objek yang tidak dinyatakan secara eksplisit dalam klausa Ibrani.
- source_word: וַ/תִּמְאָס
  choice: dan menolak
  rationale: Kata ini menyatakan penolakan, sering dengan nuansa memandang hina. Pasangan “membuang dan menolak” mempertahankan penegasan ganda teks Ibrani dengan bahasa Indonesia yang jelas.
- source_word: הִתְעַבַּרְתָּ
  choice: sangat murka
  rationale: Bentuk hitpael ini secara idiomatis mengungkapkan kemarahan yang berkobar atau kemurkaan yang hebat. “Sangat murka” alami, bermartabat, dan mempertahankan kekuatan ungkapannya.
- source_word: עִם
  choice: terhadap
  rationale: Preposisi ini secara harfiah berarti “dengan,” tetapi bersama ungkapan kemurkaan, bahasa Indonesia idiomatis memakai “murka terhadap.” Pilihan ini menyatakan relasi permusuhan tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: מְשִׁיחֶךָ
  choice: orang yang Kauurapi
  rationale: Kata tersebut berarti orang yang diurapi oleh Allah. Dalam konteks langsung mazmur ini, acuannya ialah raja keturunan Daud dalam ikatan perjanjian, sedangkan hubungan leksikal dengan gelar “Mesias” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Terjemahan מְשִׁיחֶךָ dalam ratapan kerajaan yang memiliki gema mesianik
  choice: orang yang Kauurapi
  alternative: Mesias-Mu
  rationale: Istilah Ibrani yang sama menjadi sumber gelar “Mesias,” tetapi dalam konteks terdekat ayat ini menunjuk kepada raja keturunan Daud sebagai orang yang diurapi TUHAN. Teks utama tidak memaksakan identifikasi kristologis yang lebih eksplisit daripada teks Ibrani, sementara catatan kaki mempertahankan hubungan mesianiknya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerjemahan Alkitab Indonesia. Objek dari “membuang dan menolak” sengaja tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam dua verba Ibrani tersebut.
