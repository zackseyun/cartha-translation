  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: id
  text: Manusia manakah yang dapat hidup dan tidak melihat kematian?[a] Dapatkah ia menyelamatkan nyawanya[b] dari tangan Syeol?[c] Sela.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengalami kematian.” Secara harfiah, “melihat kematian.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “jiwanya” atau “dirinya sendiri.”
    reason: lexical_alternative
  - marker: c
    text: Syeol adalah istilah Ibrani untuk dunia orang mati; dapat juga diterjemahkan “kubur.”
    reason: alternative_reading
  - marker: d
    text: Arti tepat istilah “Sela” tidak diketahui; kemungkinan merupakan petunjuk musik atau liturgis.
    reason: textual_explanation
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Manusia manakah
  rationale: מִי memperkenalkan pertanyaan retoris, sedangkan גֶבֶר secara leksikal menunjuk kepada laki-laki atau manusia yang kuat. Dalam konteks ini pertanyaannya mencakup semua manusia sebagai makhluk fana; “manusia manakah” mempertahankan unsur insaninya tanpa memberi kesan bahwa perempuan dikecualikan.
- source_word: יִחְיֶה
  choice: yang dapat hidup
  rationale: Bentuk imperfek dalam pertanyaan retoris ini menyatakan kemungkinan; “dapat hidup” menyampaikan maksudnya secara alami.
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: dan tidak melihat kematian
  rationale: Terjemahan ini mempertahankan gambaran harfiah idiom Ibrani. Makna kontekstual “mengalami kematian” dicantumkan dalam catatan kaki.
- source_word: יְמַלֵּט
  choice: Dapatkah ia menyelamatkan
  rationale: Bentuk piel menyatakan tindakan membuat lolos atau menyelamatkan. Bentuk tanya dengan “dapatkah” menampilkan daya retoris dan kesejajarannya dengan baris pertama.
- source_word: נַפְשׁוֹ
  choice: nyawanya
  rationale: נֶפֶשׁ dapat berarti nyawa, jiwa, atau diri. Dalam konteks kematian, “nyawa” paling alami dalam bahasa Indonesia, sementara alternatifnya dipertahankan dalam catatan kaki.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan ini secara harfiah berarti “dari tangan” dan secara kiasan menunjuk pada kuasa atau cengkeraman. Metafora sumber tetap jelas dalam bahasa Indonesia.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan istilah Ibrani bagi ranah orang mati dan tidak mempersempitnya menjadi sekadar kubur atau mengembangkannya menjadi konsep neraka.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah puitis atau musikal ini dipertahankan dalam bentuk transliterasi karena arti tepatnya tidak pasti.
theological_decisions:
- issue: Makna שְׁאוֹל dalam konteks puitis
  choice: Syeol
  alternative: dunia orang mati; kubur
  rationale: Transliterasi mempertahankan kategori Ibrani dan ketegangan teks tentang kuasa kematian tanpa menyamakannya dengan neraka atau membatasinya pada tempat penguburan.
- issue: Cakupan representatif גֶבֶר
  choice: manusia
  alternative: laki-laki; orang
  rationale: Kata sumber berbentuk maskulin dan dapat berarti laki-laki, tetapi pertanyaan retoris ini menyatakan kefanaan universal. “Manusia” menyampaikan cakupan representatif itu tanpa menghapus fakta leksikalnya, yang dijelaskan dalam keputusan penerjemahan.
- issue: Makna נֶפֶשׁ dalam hubungannya dengan kematian
  choice: nyawa
  alternative: jiwa; dirinya sendiri
  rationale: “Nyawa” cocok dengan konteks hidup dan mati, tetapi catatan kaki menjaga keluasan makna נֶפֶשׁ agar teks tidak dipakai untuk menetapkan antropologi tertentu secara berlebihan.
translation_notes:
  register: Bahasa puitis yang bermartabat tetapi tetap mudah dipahami. Susunan dua pertanyaan retoris dipertahankan, demikian pula metafora “melihat kematian” dan “tangan Syeol.” Ejaan “Syeol” dipilih agar mudah dibaca oleh penutur bahasa Indonesia.
