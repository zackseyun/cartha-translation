source:
  edition: WLC
  text: אֲשֶׁ֤ר חֵרְפ֖וּ אוֹיְבֶ֥י/ךָ יְהוָ֑ה אֲשֶׁ֥ר חֵ֝רְפ֗וּ עִקְּב֥וֹת מְשִׁיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/051.yaml
  text: with which your enemies have taunted[a], O Yahweh[b], with which they have taunted the footsteps of your anointed.
translation:
  language: id
  text: yang dengannya musuh-musuh-Mu mencela, ya, Yahweh—yang dengannya mereka mencela jejak langkah orang yang Kauurapi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jejak langkah” dapat juga diterjemahkan “langkah-langkah,” “tumit,” atau “jejak”; ungkapan ini mungkin secara kiasan menunjuk pada gerak atau kedatangan orang yang Kauurapi. “Orang yang Kauurapi” juga dapat dipahami sebagai “Mesias-Mu”; dalam konteks ini kemungkinan besar yang dimaksud ialah raja keturunan Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרְפוּ
  choice: mencela
  rationale: Kata kerja חרף menyatakan celaan atau penghinaan yang bernada mengejek. “Mencela” alami dalam bahasa Indonesia dan cukup luas untuk mempertahankan daya makna sumber tanpa mempersempitnya menjadi sekadar olok-olok.
- source_word: אוֹיְבֶיךָ
  choice: musuh-musuh-Mu
  rationale: Bentuk ini adalah nomina jamak dengan sufiks orang kedua maskulin tunggal; terjemahan langsung dan alami ialah “musuh-musuh-Mu”.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai Yahweh, dengan “ya” untuk menandai sapaan langsung.
- source_word: אֲשֶׁר
  choice: yang dengannya
  rationale: Klausa relatif ini meneruskan isi celaan dari ayat sebelumnya. “Yang dengannya” mempertahankan kaitan sintaksis tersebut, meskipun bentuk Indonesianya sengaja agak formal.
- source_word: עִקְּבוֹת
  choice: jejak langkah
  rationale: Nomina ini dapat menunjuk tumit, langkah, atau jejak. “Jejak langkah” mempertahankan gambaran konkret sekaligus memungkinkan pengertian kiasan tentang gerak, perjalanan, atau kedatangan orang yang diurapi.
- source_word: מְשִׁיחֶךָ
  choice: orang yang Kauurapi
  rationale: Dalam konteks mazmur kerajaan ini, ungkapan tersebut terutama menunjuk kepada raja keturunan Daud yang diurapi Yahweh. Bentuk deskriptif ini mempertahankan arti Ibraninya tanpa secara diam-diam menjadikannya gelar “Mesias” dalam teks utama.
theological_decisions:
- issue: Makna מְשִׁיחֶךָ dalam mazmur kerajaan yang juga memiliki gema mesianik
  choice: orang yang Kauurapi
  alternative: Mesias-Mu
  rationale: Konteks langsung menunjuk kepada raja Daud sebagai orang yang diurapi Yahweh, tetapi kata Ibrani yang sama juga mendasari gelar “Mesias”. Alternatif itu dicatat agar gema mesianik tidak dihapus ataupun dipaksakan ke dalam teks utama.
- issue: Acuan metaforis עִקְּבוֹת
  choice: jejak langkah
  alternative: langkah-langkah; tumit; jejak
  rationale: Sumber mempertahankan gambaran tubuh/perjalanan yang tidak sepenuhnya pasti. “Jejak langkah” cukup alami dan tidak menentukan apakah yang dimaksud ialah gerak, perjalanan, bekas perjalanan, atau kedatangan orang yang diurapi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Tanda pisah menandai pengulangan paralel Ibrani. Penanda catatan kaki [a] dicantumkan pada frasa yang memuat dua ambiguitas terkait.
