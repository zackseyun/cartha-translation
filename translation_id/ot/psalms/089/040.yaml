id: PSA.89.40
reference: Psalms 89:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: פָּרַ֥צְתָּ כָל גְּדֵרֹתָ֑י/ו שַׂ֖מְתָּ מִבְצָרָ֣י/ו מְחִתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
translation:
  language: id
  text: Engkau telah menjebol semua temboknya[a]; Engkau telah menjadikan benteng-bentengnya[b] reruntuhan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua pagar pelindungnya” atau “semua pembatasnya.” Kata Ibrani ini dapat menunjuk pada berbagai jenis pagar atau pertahanan yang mengelilingi.
    reason: lexical_alternative
  - marker: b
    text: Atau “kubu-kubunya” atau “tempat-tempat pertahanannya.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kehancuran”; mungkin juga “kengerian” atau “kegentaran.” Dalam konteks ini, gambaran pertahanan yang dihancurkan mendukung arti “reruntuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: telah menjebol
  rationale: Verba פרץ menyatakan tindakan menerobos atau membuat celah pada pertahanan. Dalam hubungan dengan tembok atau pagar, “menjebol” alami dalam bahasa Indonesia dan mempertahankan daya rusaknya.
- source_word: כָל
  choice: semua
  rationale: Menyatakan keseluruhan dan mempertahankan cakupan penuh kehancuran dalam teks Ibrani.
- source_word: גְּדֵרֹתָיו
  choice: temboknya
  rationale: גְּדֵרָה dapat berarti tembok, pagar, atau pembatas yang mengelilingi. Dalam paralel dengan benteng-benteng, “tembok” paling jelas menyampaikan fungsi pertahanannya, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: שַׂמְתָּ
  choice: telah menjadikan
  rationale: Dalam konstruksi ini, שׂים berarti membuat sesuatu berada dalam keadaan tertentu; “menjadikan” sesuai dengan sintaksis dan tetap wajar dalam bahasa Indonesia.
- source_word: מִבְצָרָיו
  choice: benteng-bentengnya
  rationale: מִבְצָר menunjuk pada tempat yang diperkuat atau kubu pertahanan. Bentuk ulang mempertahankan bentuk jamak Ibrani.
- source_word: מְחִתָּה
  choice: reruntuhan
  rationale: Dalam konteks pertahanan yang dijebol, kata ini paling mungkin menggambarkan keadaan hancur atau porak-poranda. “Reruntuhan” menghasilkan ungkapan Indonesia yang konkret dan puitis tanpa meniadakan kemungkinan arti lain.
theological_decisions:
- issue: Acuan akhiran orang ketiga maskulin tunggal (“-nya”) dalam ratapan Mazmur 89 mengenai raja dan perjanjian Daud
  choice: Mempertahankan akhiran “-nya” tanpa menjelaskan acuannya dalam teks utama.
  alternative: Menyebut secara eksplisit “tembok raja” atau menafsirkannya sebagai pertahanan Sion/Yerusalem.
  rationale: Bahasa Ibrani hanya memakai akhiran orang ketiga maskulin tunggal. Konteks dekat menunjuk kepada orang yang diurapi dari garis Daud, tetapi teks puitis tidak menyebut acuannya secara eksplisit pada ayat ini; karena itu, ambiguitasnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. Sapaan “Engkau” mempertahankan bentuk orang kedua tunggal kepada Allah. Paralelisme kedua bagian ayat dijaga, dan akhiran “-nya” dibiarkan tanpa penjelasan agar ketegangan serta ambiguitas teks sumber tetap ada.
