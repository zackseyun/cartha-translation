id: PSA.89.42
reference: Psalms 89:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: id
  text: Engkau telah meninggikan tangan kanan para lawannya[a]; Engkau telah membuat semua musuhnya bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Engkau telah mengangkat tangan kanan para lawannya.”'
    reason: Alternatif leksikal bagi הֲרִימוֹתָ; 'mengangkat' mempertahankan arti gerak atau peninggian secara lebih harfiah.
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: telah meninggikan
  rationale: Bentuk Hifil perfektum orang kedua maskulin tunggal dari רום menyatakan tindakan menyebabkan sesuatu menjadi tinggi atau terangkat. Dalam konteks tangan kanan, pilihan ini mempertahankan gambaran Ibrani sekaligus menyiratkan pemberian kekuatan atau keunggulan.
- source_word: יְמִין
  choice: tangan kanan
  rationale: Kata ini secara umum berarti tangan kanan dan sering melambangkan kekuatan atau kuasa. Ungkapan tersebut dipertahankan agar citra bahasa sumber tetap tampak.
- source_word: צָרָיו
  choice: para lawannya
  rationale: Istilah ini menunjuk kepada pihak-pihak yang memusuhi atau menentang dia. 'Para lawannya' alami dalam bahasa Indonesia dan membedakannya dari אוֹיְבָיו pada klausa kedua tanpa menegaskan perbedaan makna yang terlalu tajam.
- source_word: הִשְׂמַחְתָּ
  choice: telah membuat ... bersukacita
  rationale: Bentuk Hifil perfektum dari שׂמח bersifat kausatif. Terjemahan ini dengan jelas mempertahankan arti bahwa Allah menyebabkan mereka bersukacita.
- source_word: כָּל
  choice: semua
  rationale: Dengan nomina jamak sesudahnya, 'semua' merupakan padanan distributif yang langsung dan alami.
- source_word: אוֹיְבָיו
  choice: musuhnya
  rationale: Nomina umum ini paling langsung diterjemahkan sebagai 'musuh'. Pilihan ini juga mencerminkan penggunaan istilah Ibrani yang berbeda dari צָרָיו dalam klausa pertama.
theological_decisions:
- issue: Rujukan sufiks orang ketiga maskulin tunggal
  choice: Diterjemahkan dengan '-nya', yang dalam konteks langsung merujuk kepada raja atau orang yang diurapi dari garis Daud.
  alternative: Menyusun terjemahan secara lebih umum tanpa memperjelas rujukan sufiks.
  rationale: Kedua sufiks tersebut berjenis maskulin tunggal. Konteks Mazmur 89 adalah ratapan mengenai keadaan raja yang diurapi dari garis Daud. Bentuk '-nya' mempertahankan rujukan gramatikal itu tanpa menyelesaikan ketegangan teologis dalam mazmur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Engkau' dipakai untuk sapaan kepada Allah. Citra 'tangan kanan' dipertahankan karena mudah dipahami dan membawa konotasi kekuatan dalam konteks puitis.
