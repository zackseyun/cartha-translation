base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/049.yaml
  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
translation:
  language: id
  text: Di manakah tindakan-tindakan kasih setia-Mu yang dahulu[a], ya Tuhan, yang telah Kauikrarkan dengan sumpah kepada Daud dalam kesetiaan-Mu[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “belas kasihan-Mu yang dahulu” atau “kemurahan-Mu yang dahulu.” Dalam bahasa Ibrani, “kasih setia” berbentuk jamak, secara harfiah “kasih-kasih setia-Mu yang dahulu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “oleh kesetiaan-Mu” atau “berdasarkan kesetiaan-Mu.” Frasa ini dapat menyatakan cara atau dasar sumpah tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Di manakah
  rationale: Kata tanya ini menanyakan keberadaan atau lokasi; bentuk ini wajar dalam ratapan puitis bahasa Indonesia.
- source_word: חֲסָדֶיךָ
  choice: segala perbuatan kasih setia-Mu
  rationale: חֶסֶד menyatakan kasih, kebaikan, dan kesetiaan dalam hubungan perjanjian. Bentuk jamaknya dipertahankan secara alami dengan 'segala perbuatan', yang menunjuk pada berbagai bukti nyata kasih setia Allah.
- source_word: הָרִאשֹׁנִים
  choice: pada masa lalu
  rationale: Dalam konteks ratapan, kata ini menunjuk pada bukti-bukti kasih setia yang dahulu, sebagai kontras dengan kesesakan sekarang.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: Ini adalah gelar ilahi dalam sapaan langsung; partikel 'ya' menandai sapaan secara alami dan khidmat dalam bahasa Indonesia.
- source_word: נִשְׁבַּעְתָּ
  choice: Kaujanjikan dengan sumpah
  rationale: Kata kerja ini secara khusus berarti bersumpah. Ungkapan Indonesia ini mempertahankan unsur sumpah sekaligus membuat hubungan dengan hal yang dijanjikan kepada Daud jelas.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Preposisi לְ menandai Daud sebagai penerima sumpah atau janji tersebut.
- source_word: בֶּאֱמוּנָתֶךָ
  choice: dalam kesetiaan-Mu
  rationale: אֱמוּנָה berarti keteguhan, keterandalan, atau kesetiaan. Preposisi בְּ dapat menyatakan lingkup, cara, atau dasar sumpah, sehingga terjemahan ini sengaja tidak mempersempit nuansanya.
theological_decisions:
- issue: Makna חֶסֶד dalam ratapan yang berlatar perjanjian
  choice: kasih setia
  alternative: belas kasihan; kemurahan
  rationale: '''Kasih setia'' mencakup kasih dan loyalitas Allah dalam hubungan perjanjian dengan Daud tanpa membatasinya pada perasaan belas kasihan saja.'
- issue: Bentuk jamak חֲסָדֶיךָ
  choice: segala perbuatan kasih setia-Mu
  alternative: kasih setia-Mu; segala kemurahan-Mu
  rationale: Ungkapan ini membuat bentuk jamak Ibrani terlihat sebagai berbagai tindakan atau bukti nyata, sambil tetap terdengar alami dalam bahasa Indonesia.
- issue: Fungsi preposisi בְּ pada בֶּאֱמוּנָתֶךָ
  choice: dalam kesetiaan-Mu
  alternative: oleh kesetiaan-Mu; berdasarkan kesetiaan-Mu
  rationale: Pilihan ini mempertahankan kemungkinan bahwa kesetiaan Allah merupakan cara, lingkup, atau dasar sumpah itu, tanpa menetapkan satu hubungan teologis secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. 'Segala perbuatan' dipakai untuk menyampaikan bentuk jamak Ibrani secara wajar; susunan pertanyaan mempertahankan nada ratapan dan desakan teks sumber.
