  text: שַׁ֭סֻּ/הוּ כָּל עֹ֣בְרֵי דָ֑רֶךְ הָיָ֥ה חֶ֝רְפָּ֗ה לִ/שְׁכֵנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: id
  text: Semua orang yang melintas di jalan telah menjarahnya[a]; ia telah menjadi cela bagi para tetangganya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah merampasnya.” Frasa Ibraninya secara harfiah berbunyi “semua pelintas jalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: telah menjarahnya
  rationale: Bentuk pasif Pual dengan pelaku yang dinyatakan oleh frasa berikutnya menyampaikan tindakan merampas atau menjarah yang telah dilakukan terhadapnya. Dalam bahasa Indonesia, susunan aktif “semua orang ... telah menjarahnya” paling alami dan tetap mempertahankan daya konkret verba Ibrani.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: Semua orang yang lewat di jalan
  rationale: Frasa ini secara harfiah berarti “semua pelintas jalan”. Terjemahan yang dipilih mempertahankan cakupan menyeluruh כָּל dan gambaran orang-orang yang melintas, dengan ungkapan Indonesia yang wajar.
- source_word: הָיָה
  choice: telah menjadi
  rationale: Bentuk qatal di sini menyatakan perubahan yang menghasilkan keadaan penghinaan yang masih relevan; “telah menjadi” mengungkapkan hasil tersebut secara alami.
- source_word: חֶרְפָּה
  choice: cela
  rationale: Nomina ini menunjuk pada cela, aib, atau keadaan menjadi sasaran penghinaan. “Cela” ringkas, bermartabat, dan sesuai dengan laras ratapan mazmur.
- source_word: לִשְׁכֵנָיו
  choice: bagi tetangga-tetangganya
  rationale: 'שָׁכֵן berarti orang yang tinggal atau berada dekat. Preposisi ל menyatakan hubungan: ia menjadi cela dalam pandangan atau di antara para tetangganya.'
theological_decisions:
- issue: Rujukan pronomina orang ketiga tunggal
  choice: Mempertahankan pronomina “-nya/ia” tanpa menyebutkan identitas rujukannya.
  alternative: Menjelaskan rujukannya sebagai raja keturunan Daud, orang yang diurapi, atau umat yang diwakili oleh raja.
  rationale: Konteks mengarah kepada raja atau orang yang diurapi dari garis Daud, tetapi ayat ini sendiri hanya memakai bentuk pronominal tunggal. Terjemahan tidak mempersempit ambiguitas yang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aktif dipilih agar alami dalam bahasa sasaran, tanpa mengubah hubungan antara tindakan, pelaku, dan objek dalam bahasa Ibrani.
