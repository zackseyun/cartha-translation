id: PSA.89.44
reference: Psalms 89:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִשְׁבַּ֥תָּ מִ/טְּהָר֑/וֹ וְ֝/כִסְא֗/וֹ לָ/אָ֥רֶץ מִגַּֽרְתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/044.yaml
  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: id
  text: Engkau telah mengakhiri kemegahannya[a] dan menghempaskan takhtanya ke tanah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghentikan kecemerlangan/kemurniannya.” Kata Ibrani ini dapat berarti kecemerlangan, kemurnian, atau kemegahan; “kemegahan” paling sesuai dengan konteks kerajaan di sini.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: Engkau telah mengakhiri
  rationale: Bentuk Hifil dari שׁבת menyatakan tindakan menyebabkan sesuatu berhenti. “Telah mengakhiri” alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: מִטְּהָרוֹ
  choice: kemegahannya
  rationale: טֹהַר dapat menunjuk pada kecemerlangan, kemurnian, atau semarak. Dalam konteks kerajaan, “kemegahan” paling wajar menyampaikan sirnanya kecemerlangan dan martabat raja; preposisi מִ diserap secara idiomatis dalam konstruksi verba Indonesia.
- source_word: וְכִסְאוֹ
  choice: dan takhtanya
  rationale: כִּסֵּא secara langsung berarti “takhta”; konjungsi וְ dan akhiran pronominal orang ketiga tunggal tetap dipertahankan.
- source_word: לָאָרֶץ
  choice: ke tanah
  rationale: אֶרֶץ dapat berarti bumi, negeri, atau tanah. Bersama verba menjatuhkan, “ke tanah” merupakan padanan Indonesia yang alami dan menyampaikan gambaran penghinaan.
- source_word: מִגַּרְתָּה
  choice: menghempaskan
  rationale: Verba ini menggambarkan tindakan melemparkan atau menjatuhkan dengan keras. “Menghempaskan” mempertahankan kekuatan citra puitis tanpa menambahkan keterangan yang tidak ada dalam teks.
theological_decisions:
- issue: Acuan akhiran pronominal orang ketiga tunggal
  choice: Diterjemahkan dengan “-nya”, tanpa menyebutkan secara eksplisit siapa tokoh kerajaan itu.
  alternative: Menentukan acuannya sebagai raja keturunan Daud atau orang yang diurapi dalam perjanjian.
  rationale: Teks Ibrani hanya memakai akhiran orang ketiga tunggal dan tidak mengulangi antesedennya dalam ayat ini. Mempertahankan “-nya” menjaga alur puitis serta tidak memutuskan secara tersirat suatu identifikasi teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara terkendali. Sapaan “Engkau” mempertahankan alamat langsung kepada Allah, sedangkan “kemegahan” dan “takhta” menjaga konteks kerajaan.
