source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י בַ/יָּ֣ם יָד֑/וֹ וּֽ/בַ/נְּהָר֥וֹת יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/025.yaml
  text: I will set his hand on the sea[a], and his right hand on the rivers.
translation:
  language: id
  text: Aku akan menaruh tangannya di atas laut[a], dan tangan kanannya di atas sungai-sungai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku akan menempatkan tangannya atas laut, dan tangan kanannya atas sungai-sungai”—gambaran ini tampaknya menyatakan kekuasaan atau jangkauan.
    reason: Alternatif leksikal untuk preposisi ב dan penjelasan singkat fungsi metaforanya.
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Aku akan menaruh
  rationale: Bentuk perfek Qal orang pertama tunggal dengan waw dipahami secara promisorik dalam konteks ini. “Akan menaruh” mempertahankan tindakan konkret dalam gambaran puitis.
- source_word: בַיָּם
  choice: di atas laut
  rationale: Preposisi ב dalam gambaran kekuasaan ini dapat menunjuk penempatan pada/atas suatu wilayah. “Di atas laut” alami dalam bahasa Indonesia dan tetap cukup harfiah tanpa secara eksplisit mengubah metafora menjadi pernyataan tentang pemerintahan.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Citra anggota tubuh dipertahankan karena bahasa Ibrani memakai nomina konkret yang dalam konteks menyiratkan kuasa atau jangkauan.
- source_word: וּבַנְּהָרוֹת
  choice: dan ... di atas sungai-sungai
  rationale: Bentuk jamak נְהָרוֹת diterjemahkan “sungai-sungai”; pengulangan “di atas” menjaga kesejajaran dan memperjelas hubungan sintaksis.
- source_word: יְמִינוֹ
  choice: tangan kanannya
  rationale: Terjemahan harfiah mempertahankan paralelisme Ibrani serta konotasi kekuatan dan kewenangan dari tangan kanan.
theological_decisions:
- issue: Gambaran kerajaan dan kekuasaan
  choice: Mempertahankan gambaran konkret tentang tangan dan tangan kanan yang ditaruh di atas laut dan sungai-sungai.
  alternative: Aku akan menempatkan kekuasaannya atas laut dan tangan kanannya atas sungai-sungai.
  rationale: Ayat ini secara puitis tampaknya menggambarkan kekuasaan luas yang dianugerahkan Allah kepada raja. Metafora tidak dijabarkan menjadi parafrasa politis agar ambiguitas dan daya gambarnya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pronomina “Aku” sesuai dengan ujaran ilahi dalam konteks mazmur. “Menaruh” dipilih sebagai ungkapan konkret dan mudah dipahami; “sungai-sungai” mempertahankan bentuk jamak sumber.
