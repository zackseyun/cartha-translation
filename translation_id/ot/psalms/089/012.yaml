id: PSA.89.12
reference: Psalms 89:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: צָפ֣וֹן וְ֭/יָמִין אַתָּ֣ה בְרָאתָ֑/ם תָּב֥וֹר וְ֝/חֶרְמ֗וֹן בְּ/שִׁמְ/ךָ֥ יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/012.yaml
  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
translation:
  language: id
  text: Utara dan selatan[a]—Engkaulah yang menciptakan keduanya; Tabor dan Hermon bersorak-sorai[b] dalam nama-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “utara dan sisi kanan.” Dalam orientasi geografis Ibrani, “sisi kanan” kemungkinan besar berarti “selatan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bernyanyi dengan sukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן
  choice: utara
  rationale: Kata benda ini lazim menunjuk arah atau wilayah utara. Dalam pasangan dengan יָמִין, makna arah paling sesuai dengan paralelisme dan cakupan ciptaan yang dimaksud.
- source_word: יָמִין
  choice: selatan
  rationale: Secara harfiah berarti 'tangan kanan/sisi kanan', tetapi dalam orientasi geografis Ibrani dapat menunjuk selatan. Di sini pasangan 'utara dan selatan' menyampaikan ungkapan menyeluruh secara alami dalam bahasa Indonesia.
- source_word: בְרָאתָם
  choice: Engkaulah yang menciptakan keduanya
  rationale: Bentuk Qal perfektum orang kedua tunggal maskulin dengan sufiks orang ketiga jamak menyatakan bahwa Allah menciptakan kedua wilayah tersebut. Bentuk penegas 'Engkaulah' mencerminkan hadirnya kata ganti אַתָּה dalam teks.
- source_word: תָּבוֹר
  choice: Tabor
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: חֶרְמוֹן
  choice: Hermon
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְּשִׁמְךָ
  choice: dalam nama-Mu
  rationale: Preposisi בְּ dapat menyatakan lingkup, dasar, atau hal yang menjadi alasan. 'Dalam nama-Mu' mempertahankan keluasan makna itu dan mengaitkan sukacita dengan jati diri serta kemasyhuran Allah.
- source_word: יְרַנֵּנוּ
  choice: bersorak-sorai
  rationale: Bentuk Piel dari רנן menggambarkan seruan sukacita yang nyaring. 'Bersorak-sorai' alami dalam puisi Indonesia dan tetap memungkinkan gambaran gunung-gunung yang dipersonifikasikan.
theological_decisions:
- issue: Makna יָמִין ketika dipasangkan dengan צָפוֹן
  choice: 'Ungkapan arah yang merangkum cakupan: ''utara dan selatan'''
  alternative: 'Terjemahan harfiah: ''utara dan sisi kanan'''
  rationale: Konteks memuji Allah sebagai Pencipta seluruh bentang dunia. Makna geografis 'selatan' menjaga pasangan puitis tersebut tanpa menutupi arti harfiahnya, yang dicatat dalam catatan kaki.
- issue: Personifikasi Tabor dan Hermon
  choice: Kedua gunung digambarkan bersorak-sorai
  alternative: Penduduk di wilayah kedua gunung itu bersorak-sorai
  rationale: Puisi Mazmur kerap mempersonifikasikan alam sebagai pihak yang memuji Allah. Terjemahan utama mempertahankan gambaran teks dan tidak menggantinya dengan penjelasan mengenai para penduduknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pronomina ilahi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia. Tanda pisah menonjolkan penegasan pada אַתָּה, sedangkan 'keduanya' memperjelas sufiks jamak pada verba tanpa menambah gagasan baru.
