id: PSA.89.15
reference: Psalms 89:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: id
  text: 'Berbahagialah umat yang mengenal sorak-sorai[a];

    ya Yahweh, dalam cahaya wajah-Mu[b] mereka berjalan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sorak perayaan”; mungkin juga mencakup bunyi sangkakala yang mengiringi aklamasi dalam ibadah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “wajah-Mu”; ungkapan ini dapat menunjuk pada hadirat atau perkenanan-Mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk seruan jamak ini mengawali ucapan bahagia. “Berbahagialah” mempertahankan nada luhur dan liturgis, bukan sekadar menyatakan perasaan senang.
- source_word: הָעָם
  choice: umat
  rationale: Dalam konteks mazmur ini, עָם menunjuk pada suatu komunitas di hadapan Allah. “Umat” lebih alami dalam bahasa Indonesia dan tidak menekankan pengertian politis seperti “bangsa”.
- source_word: יוֹדְעֵי
  choice: yang mengenal
  rationale: Partisip ini menggambarkan umat yang bercirikan pengenalan akan sorak tersebut. “Mengenal” mempertahankan unsur pengetahuan atau keakraban, tanpa mengubahnya menjadi sekadar kemampuan bersorak.
- source_word: תְרוּעָה
  choice: sorak-sorai
  rationale: Kata ini dapat menunjuk pada sorakan nyaring, aklamasi perayaan atau ibadah, maupun bunyi sangkakala. “Sorak-sorai” sesuai dengan konteks perayaan, tetapi tidak membatasi maknanya hanya pada alat musik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: בְּאוֹר
  choice: dalam cahaya
  rationale: Preposisi ב di sini paling wajar menyatakan lingkup tempat mereka berjalan, sehingga diterjemahkan “dalam cahaya”.
- source_word: פָּנֶיךָ
  choice: wajah-Mu
  rationale: Terjemahan harfiah ini mempertahankan gambaran relasional bahasa Ibrani. Makna idiomatis berupa hadirat atau perkenanan dijelaskan dalam catatan kaki.
- source_word: יְהַלֵּכוּן
  choice: mereka berjalan
  rationale: Terjemahan ini mempertahankan metafora alkitabiah tentang perjalanan dan perilaku hidup yang terus berlangsung di hadapan Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh, dengan sapaan langsung “ya Yahweh”
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi itu, sedangkan partikel “ya” menandai sapaan secara alami dalam bahasa Indonesia.
- issue: Apakah פָּנֶיךָ diterjemahkan secara harfiah atau idiomatis
  choice: wajah-Mu
  alternative: hadirat-Mu; perkenanan-Mu
  rationale: Teks secara harfiah menyebut “wajah-Mu”. Mempertahankan gambaran ini menghindari pembatasan makna hanya pada hadirat atau perkenanan, sementara kemungkinan idiomatisnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan baris kedua mengikuti penekanan teks Ibrani dengan menempatkan “ya Yahweh” dan “dalam cahaya wajah-Mu” sebelum subjek-predikat. Huruf kapital pada akhiran pronominal “-Mu” mengikuti kebiasaan penulisan rujukan kepada Allah.
