lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Kata ini memperkenalkan syarat; “jika” mempertahankan makna kondisional tanpa menyiratkan bahwa hal itu pasti terjadi.
- source_word: יַעַזְבוּ
  choice: meninggalkan
  rationale: Kata kerja עזב berarti meninggalkan atau menelantarkan. “Meninggalkan” alami dalam bahasa Indonesia dan dalam konteks ini menyatakan ketidaksetiaan terhadap ketentuan perjanjian.
- source_word: בָנָיו
  choice: putra-putranya
  rationale: Bentuk Ibrani ini adalah jamak maskulin dengan akhiran orang ketiga tunggal maskulin, secara harfiah “putra-putranya”; pilihan ini mempertahankan rujukan maskulin dalam konteks keturunan Daud.
- source_word: תּוֹרָתִי
  choice: hukum-Ku
  rationale: תּוֹרָה dapat berarti ajaran atau hukum. Paralelnya dengan “ketetapan-ketetapan-Ku” menonjolkan nuansa hukum dan perjanjian.
- source_word: וּבְמִשְׁפָּטַי
  choice: menurut ketetapan-ketetapan-Ku
  rationale: מִשְׁפָּטִים dapat menunjuk pada keputusan hukum, peraturan, atau ketetapan. “Menurut” mengungkapkan fungsi preposisi ב secara alami bersama metafora “berjalan” dalam bahasa Indonesia.
- source_word: לֹא יֵלֵכוּן
  choice: tidak berjalan
  rationale: הלך secara harfiah berarti berjalan dan dalam konteks perjanjian juga menggambarkan cara hidup. Terjemahan ini mempertahankan metafora sumber.
theological_decisions:
- issue: Makna תּוֹרָה dalam konteks hukum perjanjian
  choice: hukum-Ku
  alternative: ajaran-Ku
  rationale: Walaupun תּוֹרָה dapat berarti “ajaran”, pasangan paralelnya dengan מִשְׁפָּטִים memberi baris ini corak hukum perjanjian. Catatan kaki mempertahankan alternatif leksikal yang sah.
- issue: Rujukan gender pada בָנָיו
  choice: putra-putranya
  alternative: anak-anaknya
  rationale: Bahasa Ibrani memakai bentuk maskulin jamak, dan konteksnya berbicara tentang garis keturunan Daud. “Putra-putranya” mempertahankan bentuk tersebut tanpa memperluasnya secara diam-diam.
- issue: Metafora perjanjian pada הלך
  choice: tidak berjalan
  alternative: tidak hidup; tidak mengikuti
  rationale: Mempertahankan gambaran “berjalan” menjaga metafora Ibrani tentang perilaku hidup dan tidak menafsirkan maknanya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “putra-putranya” mempertahankan rujukan maskulin sumber; “berjalan menurut” menjaga metafora perjanjian sambil tetap mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan ejaan Alkitab bahasa Indonesia.
