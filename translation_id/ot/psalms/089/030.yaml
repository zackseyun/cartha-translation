  text: Jika putra-putranya meninggalkan hukum-Ku[a] dan tidak berjalan menurut ketetapan-ketetapan-Ku[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajaran-Ku”. Kata Ibrani torah dapat berarti ajaran atau pengajaran, selain hukum; di sini “hukum” dipilih karena sejajar dengan “ketetapan-ketetapan-Ku”.
