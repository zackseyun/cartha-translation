  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: id
  text: Aku akan menegakkan keturunanmu[a] untuk selama-lamanya dan membangun takhtamu dari generasi ke generasi. Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benihmu”; kata Ibrani berbentuk tunggal dan dapat dipakai secara kolektif untuk menunjuk kepada para keturunan.
    reason: lexical_alternative
  - marker: b
    text: “Sela” kemungkinan merupakan petunjuk musik atau liturgis; makna tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa batas. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan bobot janji perjanjian.
- source_word: אָכִין
  choice: Aku akan meneguhkan
  rationale: Bentuk hifil dari כון berarti membuat kokoh atau menetapkan. “Meneguhkan” sesuai dengan konteks janji kerajaan dan menyampaikan gagasan kestabilan.
- source_word: זַרְעֶךָ
  choice: keturunanmu
  rationale: זֶרַע secara harfiah dapat berarti “benih”, tetapi dalam konteks ini menunjuk secara kolektif kepada keturunan. “Keturunanmu” alami dan tetap dapat mencakup garis dinasti sebagai satu kesatuan.
- source_word: וּבָנִיתִי
  choice: dan membangun
  rationale: Walaupun bentuknya berupa perfektum, dalam paralelisme dengan kata kerja sebelumnya ungkapan ini berfungsi futur. Kata “membangun” mempertahankan metafora arsitektural yang diterapkan pada takhta.
- source_word: לְדֹר וָדֹר
  choice: dari generasi ke generasi
  rationale: Ungkapan ini menunjukkan kesinambungan melalui generasi-generasi yang silih berganti. Terjemahan ini jelas, alami, dan mempertahankan daya iteratif teks Ibrani.
- source_word: כִּסְאֲךָ
  choice: takhtamu
  rationale: Padanan baku dalam konteks kerajaan; di sini takhta melambangkan pemerintahan dan kelangsungan dinasti, bukan hanya tempat duduk fisik.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak pasti. Transliterasi yang lazim dalam bahasa Indonesia menghindari penafsiran yang terlalu spesifik.
theological_decisions:
- issue: Bahasa janji dinasti dalam konteks perjanjian kerajaan
  choice: Mempertahankan sapaan langsung “keturunanmu” dan “takhtamu” tanpa membuat penggenapan mesianik menjadi eksplisit dalam teks ayat.
  alternative: Menambahkan rujukan mesianik secara eksplisit atau mengubahnya menjadi janji umum tentang anak cucu.
  rationale: Teks Ibrani menyampaikan janji langsung mengenai keturunan dan takhta raja. Terjemahan perlu mempertahankan makna historis-dinastisnya sekaligus membiarkan makna kanonis yang lebih luas tetap tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “Aku akan … dan …” membiarkan kata bantu futur “akan” menaungi kedua verba secara alami. “Dari generasi ke generasi” dipilih agar kesinambungan dinasti mudah dipahami tanpa menghilangkan corak puitis.
