base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/035.yaml
  text: Once I have sworn by my holiness[b][a]; I will not lie to David.
translation:
  language: id
  text: 'Sekali Aku telah bersumpah demi kekudusan-Ku[a]: Aku tidak akan berdusta kepada Daud.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Sekali untuk selamanya Aku telah bersumpah demi kekudusan-Ku.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “jika Aku berdusta kepada Daud,” suatu rumusan sumpah yang berarti “Aku tidak akan berdusta kepada Daud” atau “Aku pasti tidak akan berlaku tidak setia kepada Daud.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: Sekali
  rationale: Dalam konteks sumpah, kata ini berfungsi secara adverbial dan menunjuk pada satu tindakan sumpah yang tegas. “Sekali” alami dalam bahasa Indonesia dan tidak menambahkan gagasan yang tidak dinyatakan secara eksplisit.
- source_word: נִשְׁבַּעְתִּי
  choice: Aku telah bersumpah
  rationale: Bentuk Nifal dari שׁבע berarti bersumpah. Bentuk “telah bersumpah” menyatakan tindakan lampau yang daya ikatnya tetap berlaku.
- source_word: בְקָדְשִׁי
  choice: demi kekudusan-Ku
  rationale: Preposisi ב dengan קֹדֶשׁ dan akhiran orang pertama tunggal menyatakan dasar atau jaminan yang disebut dalam sumpah, yaitu kekudusan Allah sendiri.
- source_word: אִם
  choice: Aku tidak akan
  rationale: Sesudah pernyataan sumpah, אִם memperkenalkan rumusan sumpah eliptis yang secara harfiah berbunyi “jika Aku berdusta,” tetapi secara idiomatis menyatakan penyangkalan yang tegas.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Preposisi ל menunjuk kepada pribadi yang menjadi sasaran ketidakbenaran itu; “kepada Daud” merupakan ungkapan Indonesia yang langsung dan wajar.
- source_word: אֲכַזֵּב
  choice: berdusta
  rationale: Bentuk Piel dari כזב di sini berarti berkata tidak benar atau berlaku palsu mengenai janji. “Berdusta” mempertahankan daya moral dan relasi personal dalam ungkapan tersebut.
theological_decisions:
- issue: Rumusan sumpah ilahi yang memakai אִם secara eliptis
  choice: Aku tidak akan berdusta kepada Daud
  alternative: jika Aku berdusta kepada Daud ...
  rationale: Bahasa Ibrani menyiratkan kutukan dalam rumusan sumpah tanpa menyatakannya lengkap. Terjemahan utama menyampaikan makna idiomatisnya sebagai penyangkalan tegas, sedangkan bentuk harfiahnya dicatat agar ketegangan struktur sumber tetap terlihat.
- issue: Makna אַחַת sebagai keterangan pada sumpah
  choice: Sekali
  alternative: Sekali untuk selamanya
  rationale: “Sekali” mempertahankan makna dasar dan ketegasan tindakan tanpa secara eksplisit menambahkan nuansa finalitas “untuk selamanya,” meskipun nuansa itu mungkin terkandung dalam konteks.
- issue: Objek yang dijadikan jaminan sumpah
  choice: demi kekudusan-Ku
  alternative: demi tempat kudus-Ku
  rationale: Dalam rumusan sumpah ini, קֹדֶשׁ dengan akhiran ilahi paling wajar menunjuk pada kekudusan Allah sebagai jaminan sumpah, bukan tempat kudus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi dipakai secara konsisten. Tanda titik dua mempertahankan hubungan erat antara pernyataan sumpah dan isi penyangkalannya.
