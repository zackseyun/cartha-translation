  text: I have found David my servant[a]; with my holy oil I have anointed him.
translation:
  language: id
  text: Aku telah menemukan Daud, hamba-Ku; dengan minyak-Ku yang kudus Aku telah mengurapinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי
  choice: Aku telah menemukan
  rationale: Bentuk Qal perfek orang pertama tunggal dari מצא menyatakan tindakan yang telah selesai. Dalam pernyataan ilahi puitis ini, bentuk 'telah menemukan' mempertahankan relevansi tindakan itu bagi ketetapan perjanjian yang sedang dibicarakan; bentuk lampau sederhana juga mungkin.
- source_word: דָּוִד
  choice: Daud
  rationale: Nama diri ini diterjemahkan menurut bentuk baku yang dikenal dalam bahasa Indonesia.
- source_word: עַבְדִּי
  choice: hamba-Ku
  rationale: עבד dapat berarti hamba atau budak. Di sini kata tersebut merupakan sebutan kehormatan dalam hubungan Daud dengan Allah, sehingga 'hamba-Ku' paling tepat dan alami.
- source_word: בְּשֶׁמֶן
  choice: dengan minyak
  rationale: Preposisi ב dalam konteks משח menunjukkan sarana yang dipakai untuk mengurapi, yang secara idiomatis dinyatakan dengan 'dengan' dalam bahasa Indonesia.
- source_word: קָדְשִׁי
  choice: minyak-Ku yang kudus
  rationale: קדשׁ menyatakan kekudusan atau keadaan yang dikhususkan bagi Allah. Susunan 'minyak-Ku yang kudus' alami dalam bahasa Indonesia serta mempertahankan kepemilikan ilahi dan sifat kudus minyak itu.
- source_word: מְשַׁחְתִּיו
  choice: Aku telah mengurapinya
  rationale: Bentuk Qal perfek orang pertama tunggal dengan sufiks orang ketiga maskulin tunggal menyatakan tindakan Allah terhadap Daud. 'Telah mengurapinya' selaras dengan verba pertama dan menunjukkan tindakan yang selesai dengan makna yang tetap berlaku.
theological_decisions:
- issue: Bahasa pengurapan raja dan kemungkinan gema mesianik
  choice: Mempertahankan rujukan historis langsung kepada Daud tanpa menambahkan gelar mesianik.
  alternative: Terjemahan interpretatif yang menonjolkan tipologi Mesias atau menyebut Daud sebagai sosok mesianik.
  rationale: Teks Ibrani secara eksplisit menyebut Daud dan tindakan Allah mengurapinya. Kemungkinan makna tipologis dalam pembacaan kanonik tidak boleh dimasukkan sebagai tambahan ke dalam bunyi ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada pronomina yang merujuk kepada Allah mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Paralelisme dua klausa dan penekanan pada tindakan ilahi dipertahankan.
