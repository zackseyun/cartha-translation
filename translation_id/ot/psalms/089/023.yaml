  text: And I will crush his adversaries before him[b][a], and strike down those who hate him.
translation:
  language: id
  text: Aku akan meremukkan lawan-lawannya di hadapannya[a], dan menghantam orang-orang yang membencinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari depan wajahnya” atau “dari hadapannya”; ungkapan Ibrani ini dapat menggambarkan para lawan disingkirkan dari hadapan raja.
    reason: lexical_alternative
  - marker: b
    text: Atau “memukul jatuh”; kata Ibrani ini dapat menyatakan pukulan keras dalam penghakiman atau pertempuran, dan dalam konteks tertentu juga dapat berarti “menulahi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: Aku akan meremukkan
  rationale: Bentuk dari כתת menyatakan tindakan menghancurkan atau meremukkan; dalam rangkaian janji ilahi ini bentuk perfektum berwawasan masa depan. “Meremukkan” mempertahankan daya citra peperangan tanpa menjadi terlalu konkret.
- source_word: מִפָּנָיו
  choice: dari hadapannya
  rationale: Secara harfiah berarti “dari depan wajah/kehadirannya.” Ungkapan ini mempertahankan gagasan bahwa Allah menyingkirkan para lawan dari hadapan raja, sekalipun bentuknya sedikit lebih idiomatis-biblis daripada “di hadapannya.”
- source_word: צָרָיו
  choice: lawan-lawannya
  rationale: צָרָיו menunjuk kepada pihak-pihak yang memusuhi atau menentangnya. “Lawan-lawannya” alami dalam bahasa Indonesia dan tetap membedakannya dari ungkapan “orang-orang yang membencinya” pada baris kedua.
- source_word: וּמְשַׂנְאָיו
  choice: dan orang-orang yang membencinya
  rationale: Bentuk partisipial dari שׂנא menggambarkan mereka yang terus atau secara khas membencinya. Frasa verbal ini alami dan mempertahankan kekuatan bentuk Ibraninya.
- source_word: אֶגּוֹף
  choice: menghantam
  rationale: נגף dapat berarti memukul, menimpakan pukulan, atau mengalahkan secara keras dalam penghakiman maupun pertempuran. “Menghantam” mempertahankan tindakan kuat tanpa membatasi maknanya menjadi tulah tertentu.
theological_decisions:
- issue: Bahasa tentang Allah sebagai pejuang dalam janji perjanjian kepada raja keturunan Daud
  choice: Mempertahankan gambaran keras berupa tindakan langsung Allah yang meremukkan dan menghantam musuh-musuh raja.
  alternative: Menghaluskannya menjadi “mengalahkan” atau “mengatasi.”
  rationale: Kedua verba Ibrani bersifat kuat dan menggambarkan Allah secara aktif menundukkan musuh raja. Terjemahan tidak melunakkan ketegangan teologis ini ataupun mengaitkannya secara eksplisit dengan penafsiran doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme antarbagiannya dipertahankan, begitu pula citra peperangan yang kuat. Pronomina “Aku” mengikuti suara ilahi dalam konteks mazmur.
