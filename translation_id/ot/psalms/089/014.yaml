source:
  edition: WLC
  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/014.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: id
  text: Kebenaran dan keadilan adalah dasar takhta-Mu; kasih setia dan kesetiaan berjalan di hadapan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di depan wajah-Mu”; ungkapan ini juga dapat berarti “di hadirat-Mu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק
  choice: kebenaran
  rationale: Dalam pasangan dengan מִשְׁפָּט, kata ini menunjuk pada kelurusan moral atau tatanan yang benar. “Kebenaran” mempertahankan perbedaannya dari keadilan yang bersifat yudisial.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks pemerintahan dan takhta, kata ini menyatakan pelaksanaan hukum atau keputusan yang adil.
- source_word: מְכוֹן
  choice: dasar
  rationale: Nomina ini berarti tempat yang kokoh atau landasan. “Dasar” alami dalam bahasa Indonesia dan sesuai dengan metafora takhta.
- source_word: כִּסְאֶךָ
  choice: takhta-Mu
  rationale: Padanan baku bagi metafora kerajaan ini; akhiran orang kedua tunggal dipertahankan.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini menyampaikan kasih yang teguh, loyal, dan bertahan dalam hubungan perjanjian tanpa memasukkan istilah doktrinal tambahan.
- source_word: אֱמֶת
  choice: kesetiaan
  rationale: Dalam pasangan חֶסֶד וֶאֱמֶת, maknanya terutama adalah keterandalan atau kesetiaan relasional, bukan sekadar kebenaran abstrak.
- source_word: יְקַדְּמוּ
  choice: berjalan di hadapan
  rationale: Kata kerja ini menggambarkan tindakan pergi atau tampil di depan. Frasa tersebut mempertahankan citra puitis sambil tetap alami dalam bahasa Indonesia.
- source_word: פָנֶיךָ
  choice: di hadapan-Mu
  rationale: Secara harfiah berarti “wajah-Mu”, tetapi sebagai ungkapan Ibrani dapat menunjuk pada hadirat atau bagian depan seseorang. “Di hadapan-Mu” mempertahankan citra spasial secara wajar; arti harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan pasangan חֶסֶד וֶאֱמֶת
  choice: kasih setia dan kesetiaan
  alternative: kasih setia dan kebenaran; belas kasih dan kebenaran
  rationale: Pilihan ini menjaga nuansa kasih yang loyal dan keterandalan relasional dalam rumusan Ibrani tersebut, tanpa mereduksinya menjadi dua gagasan abstrak atau memasukkan tafsiran denominasi tertentu.
- issue: Penerjemahan פָנֶיךָ
  choice: di hadapan-Mu
  alternative: di depan wajah-Mu; di hadirat-Mu
  rationale: “Di hadapan-Mu” merupakan ungkapan Indonesia yang alami dan tetap dekat dengan gambaran konkret teks. Catatan kaki mempertahankan informasi bahwa bahasa Ibraninya secara harfiah menyebut “wajah”.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Kapital pada pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Paralelisme kedua pasangan nomina serta metafora dasar takhta dipertahankan.
