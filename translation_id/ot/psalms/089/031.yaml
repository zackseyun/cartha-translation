  text: If they profane my statutes and do not keep my commandments,[a]
translation:
  language: id
  text: Jika mereka mencemarkan ketetapan-ketetapan-Ku dan tidak menaati perintah-perintah-Ku,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melanggar ketetapan-ketetapan-Ku.” Kata kerja Ibrani dapat berarti mencemarkan, menajiskan, atau memperlakukan sebagai sesuatu yang biasa; “mencemarkan” mempertahankan nuansa profanasi yang lebih kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel ini memperkenalkan syarat. “Jika” mempertahankan makna kondisional tanpa menggesernya menjadi kepastian waktu seperti “ketika”.
- source_word: חֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: Kata חֻקָּה menunjuk pada ketentuan atau ketetapan yang ditetapkan. Pilihan ini membedakannya dari מִצְוָה, “perintah”.
- source_word: יְחַלֵּלוּ
  choice: menajiskan
  rationale: Bentuk piel dari חלל membawa arti memperlakukan sesuatu yang kudus sebagai cemar atau biasa. “Menajiskan” mempertahankan daya religius dan moral yang lebih kuat daripada sekadar “melanggar”.
- source_word: וּמִצְוֺתַי
  choice: dan perintah-perintah-Ku
  rationale: מִצְוָה lazim menunjuk pada perintah dalam konteks hukum dan perjanjian. Bentuk ini juga mempertahankan kesejajaran dengan “ketetapan-ketetapan-Ku”.
- source_word: לֹא יִשְׁמֹרוּ
  choice: tidak menaati
  rationale: Dalam konteks perintah, שׁמר berarti memelihara atau menjalankan. “Menaati” merupakan ungkapan Indonesia yang alami dan jelas untuk tindakan menjalankan perintah.
theological_decisions:
- issue: Kekuatan bahasa pelanggaran perjanjian dalam חלל ketika objeknya adalah ketetapan Allah
  choice: menajiskan ketetapan-ketetapan-Ku
  alternative: melanggar ketetapan-ketetapan-Ku
  rationale: “Menajiskan” mempertahankan gagasan bahwa ketetapan Allah diperlakukan sebagai sesuatu yang tidak kudus atau tidak terhormat, bukan hanya tidak dipatuhi. Alternatif “melanggar” tetap mungkin secara kontekstual dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan jamak dipakai untuk mencerminkan bentuk jamak Ibrani dan kesejajaran puitis. Huruf kapital pada enklitik “-Ku” menandai rujukan kepada Allah sesuai kebiasaan penerbitan Alkitab Indonesia.
