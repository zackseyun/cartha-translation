  text: וֶֽ/אֶֽמוּנָתִ֣/י וְ/חַסְדִּ֣/י עִמּ֑/וֹ וּ֝/בִ/שְׁמִ֗/י תָּר֥וּם קַרְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/024.yaml
  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: id
  text: Kesetiaan-Ku dan kasih setia-Ku akan menyertai dia, dan dalam nama-Ku tanduknya akan ditinggikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tanduk” adalah gambaran Ibrani yang melambangkan kekuatan, martabat, atau kuasa kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: kesetiaan-Ku
  rationale: Dalam konteks perjanjian, kata ini menunjuk pada sifat Allah yang setia dan dapat diandalkan, bukan tindakan percaya.
- source_word: חַסְדִּי
  choice: kasih setia-Ku
  rationale: Ungkapan Indonesia ini secara alami memadukan kasih dengan kesetiaan yang teguh dalam hubungan perjanjian.
- source_word: עִמּוֹ
  choice: akan menyertai dia
  rationale: Secara harfiah berarti 'bersama dia'; 'menyertai dia' mengungkapkan kehadiran dan dukungan yang berkelanjutan secara wajar dalam bahasa Indonesia.
- source_word: בִּשְׁמִי
  choice: dalam nama-Ku
  rationale: Mempertahankan idiom Ibrani serta keterkaitan kuasa dan kedudukan raja dengan nama Allah tanpa mempersempit maknanya.
- source_word: תָּרוּם
  choice: akan ditinggikan
  rationale: Bentuk verba menyatakan bahwa tanduknya akan menjadi tinggi atau dimuliakan; 'ditinggikan' mempertahankan metafora dan ragam puitis.
- source_word: קַרְנוֹ
  choice: tanduknya
  rationale: Metafora Ibrani dipertahankan dalam teks utama karena menyandang citra kekuatan, martabat, dan kuasa kerajaan.
theological_decisions:
- issue: Pemertahanan metafora kerajaan
  choice: tanduknya akan ditinggikan
  alternative: kekuatannya akan bertambah
  rationale: Pemertahanan kata 'tanduk' menjaga citra puitis dan nuansa kerajaan dalam mazmur, sedangkan catatan kaki menjelaskan lambangnya tanpa menggantikannya dengan satu tafsiran saja.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kapitalisasi pada akhiran pronomina yang merujuk kepada Allah mengikuti kelaziman penerbitan Alkitab Indonesia. Penanda catatan ditempatkan sesudah klausa yang memuat metafora yang dijelaskan.
