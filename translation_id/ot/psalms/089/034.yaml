id: PSA.89.34
reference: Psalms 89:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא אֲחַלֵּ֥ל בְּרִיתִ֑/י וּ/מוֹצָ֥א שְׂ֝פָתַ֗/י לֹ֣א אֲשַׁנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/034.yaml
  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
translation:
  language: id
  text: Aku tidak akan melanggar perjanjian-Ku atau mengubah apa yang telah keluar dari bibir-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Artinya, apa yang telah Kuucapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  choice: melanggar
  rationale: Bentuk Piel dari חלל di sini menyatakan tindakan menodai atau melanggar perjanjian. “Melanggar” alami dalam bahasa Indonesia untuk pelanggaran terhadap perjanjian dan mempertahankan bobot maknanya.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: בְּרִית merupakan istilah baku untuk perjanjian yang mengikat; sufiks orang pertama dipertahankan.
- source_word: מוֹצָא שְׂפָתַי
  choice: apa yang telah keluar dari bibir-Ku
  rationale: Ungkapan ini secara harfiah berarti “yang keluar dari bibir-Ku” dan menunjuk pada apa yang telah diucapkan. Terjemahan ini mempertahankan citra Ibrani sambil tetap dapat dipahami.
- source_word: אֲשַׁנֶּה
  choice: mengubah
  rationale: Bentuk Piel dari שנה berarti mengubah. Pilihan ini sesuai bagi firman atau janji yang telah diucapkan.
- source_word: לֹא ... לֹא
  choice: tidak akan ... atau ...
  rationale: Dua penyangkalan yang sejajar disampaikan secara alami dalam bahasa Indonesia dengan “tidak akan ... atau ...”, tanpa menghilangkan cakupan negasi pada kedua tindakan.
theological_decisions:
- issue: Sifat komitmen ilahi
  choice: Mempertahankan bahasa konkret tentang perjanjian dan ucapan Allah.
  alternative: Menguraikannya menjadi pernyataan doktrinal umum bahwa Allah tidak berubah atau sekadar menyebut “janji-Ku”.
  rationale: Ayat ini secara khusus berbicara tentang perjanjian Allah dan apa yang keluar dari bibir-Nya. Terjemahan tidak memperluasnya menjadi rumusan teologis yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Aku” serta sufiks hormat “-Ku” sesuai dengan tuturan langsung Allah. Citra “keluar dari bibir-Ku” dipertahankan, dengan catatan untuk menjelaskan idiomnya.
