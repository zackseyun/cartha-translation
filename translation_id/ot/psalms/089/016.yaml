  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: id
  text: Dalam nama-Mu mereka bersukacita sepanjang hari, dan dalam kebenaran-Mu mereka ditinggikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam keadilan-Mu mereka ditinggikan.”
    reason: Alternatif ini mempertahankan kemungkinan arti צְדָקָה sebagai “keadilan”, sambil mempertahankan kata depan “dalam” yang paralel dengan klausa pertama.
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: Dalam nama-Mu
  rationale: Kata depan בְּ menyatakan lingkup atau dasar sukacita. Ungkapan “nama-Mu” menunjuk pada diri, karakter, dan nama baik Allah sebagaimana Ia menyatakan diri-Nya.
- source_word: יְגִילוּן
  choice: mereka bersukacita
  rationale: Kata kerja גיל menyatakan kegembiraan yang meluap. “Bersukacita” alami dalam bahasa Indonesia modern dan mempertahankan nuansa perayaan.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini menunjukkan berlangsungnya sukacita sepanjang hari; “sepanjang hari” ringkas dan idiomatis.
- source_word: וּבְצִדְקָתְךָ
  choice: oleh kebenaran-Mu
  rationale: 'צְדָקָה dapat berarti kebenaran atau keadilan. Kata depan בְּ di sini wajar dipahami secara instrumental atau kausal: kebenaran Allah menjadi dasar mereka ditinggikan.'
- source_word: יָרוּמוּ
  choice: mereka ditinggikan
  rationale: Kata רום berarti menjadi tinggi atau ditinggikan. Bentuk pasif dalam bahasa Indonesia menyampaikan bahwa peninggian mereka terjadi karena tindakan atau kebenaran Allah, bukan karena meninggikan diri.
theological_decisions:
- issue: Makna צְדָקָה ketika dipakai untuk memuji Allah
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam konteks perjanjian dan pujian, “kebenaran” mempertahankan cakupan luas yang mencakup kelurusan moral serta tindakan Allah yang setia dan benar. “Keadilan” tetap merupakan kemungkinan leksikal yang sah dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme Ibrani dipertahankan, sedangkan titik koma menandai keseimbangan kedua klausa.
