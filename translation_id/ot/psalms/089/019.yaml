  text: אָ֤ז דִּבַּ֥רְתָּֽ בְ/חָ֡זוֹן לַֽ/חֲסִידֶ֗י/ךָ וַ/תֹּ֗אמֶר שִׁוִּ֣יתִי עֵ֭זֶר עַל גִּבּ֑וֹר הֲרִימ֖וֹתִי בָח֣וּר מֵ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: id
  text: Pada waktu itu Engkau berbicara dalam suatu penglihatan kepada orang-orang yang setia kepada-Mu[a] dan berkata, “Aku telah memberikan pertolongan kepada seorang yang perkasa[b]; Aku telah meninggikan seorang pilihan dari antara rakyat[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Menurut bacaan lain yang tercermin dalam sejumlah terjemahan: “kepada orang yang setia kepada-Mu.”'
    reason: textual_variant
  - marker: b
    text: “Seorang yang perkasa” juga dapat diterjemahkan “seorang pejuang” atau “seorang pahlawan.”
    reason: lexical_alternative
  - marker: c
    text: Kata yang diterjemahkan “seorang pilihan” juga dapat berarti “seorang pemuda”; konteks di sini mendukung pengertian seseorang yang dipilih.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pada waktu itu
  rationale: Menandai urutan waktu dalam kisah puitis dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: דִּבַּרְתָּ
  choice: Engkau berbicara
  rationale: Mempertahankan perbedaan dengan וַתֹּאמֶר, yang diterjemahkan “dan berkata”.
- source_word: בְחָזוֹן
  choice: dalam suatu penglihatan
  rationale: Preposisi ב paling wajar menunjukkan suasana atau sarana penyataan, tanpa mempersempit maknanya.
- source_word: לַחֲסִידֶיךָ
  choice: kepada orang-orang yang setia kepada-Mu
  rationale: Mengikuti bentuk jamak dalam teks WLC dan menyampaikan gagasan kesetiaan atau kesalehan perjanjian tanpa konotasi gerejawi tambahan.
- source_word: וַתֹּאמֶר
  choice: dan berkata
  rationale: Menerjemahkan verba אמר secara tersendiri sambil mempertahankan kelanjutan ujaran ilahi.
- source_word: שִׁוִּיתִי
  choice: Aku telah menaruh
  rationale: Mempertahankan citra dasar tindakan menempatkan atau menaruh, meskipun konstruksi Ibraninya tidak sepenuhnya biasa dalam bahasa Indonesia.
- source_word: עֵזֶר
  choice: pertolongan
  rationale: Padanan langsung yang tidak membatasi makna menjadi kekuatan atau bantuan militer saja.
- source_word: עַל
  choice: pada
  rationale: Mempertahankan arah relasional “atas/pada” dalam konstruksi Ibrani tanpa menghasilkan ungkapan Indonesia yang terlalu kaku.
- source_word: גִּבּוֹר
  choice: seorang yang perkasa
  rationale: Mencakup makna orang kuat, pahlawan, atau pejuang tanpa secara tidak perlu mempersempitnya pada peran militer.
- source_word: הֲרִימוֹתִי
  choice: Aku telah meninggikan
  rationale: Menyampaikan bentuk kausatif dari רום dan cocok dengan pengangkatan seseorang ke kedudukan tinggi.
- source_word: בָחוּר
  choice: seorang pilihan
  rationale: Dalam konteks pemilihan dan pengangkatan Daud, makna yang berkaitan dengan “dipilih” paling sesuai, sambil mencatat kemungkinan makna “pemuda”.
- source_word: מֵעָם
  choice: dari antara bangsa itu
  rationale: Menyatakan asal sekaligus pemilihan seseorang dari lingkungan kolektif עָם; “bangsa itu” merujuk pada umat yang sedang dibicarakan.
theological_decisions:
- issue: Rujukan tokoh dalam konteks perjanjian Daud
  choice: Terjemahan tetap pada rujukan langsung kepada tokoh pilihan yang ditinggikan Allah dalam konteks Daud.
  alternative: Menjadikan rujukan mesianik atau tipologis eksplisit dalam teks.
  rationale: Ayat ini tidak menuntut perluasan mesianik secara eksplisit; kemungkinan pembacaan tipologis tidak disangkal, tetapi tidak dimasukkan ke dalam terjemahan.
- issue: Jumlah pada לַחֲסִידֶיךָ
  choice: Bentuk jamak, “orang-orang yang setia kepada-Mu,” mengikuti teks WLC yang diberikan.
  alternative: Bentuk tunggal, “orang yang setia kepada-Mu,” menurut tradisi bacaan lain.
  rationale: Bentuk jamak adalah bacaan sumber yang diterjemahkan; varian tunggal dipertahankan dalam catatan kaki agar bukti tekstual tidak diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi kata ganti yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan dua klausa ilahi dipertahankan, sedangkan ungkapan yang tidak biasa tentang “menaruh pertolongan” sengaja dibuat cukup dekat dengan metafora Ibrani dan dijelaskan dalam catatan.
