base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: id
  text: Aku pun akan menjadikannya anak sulung,[a] yang tertinggi di antara raja-raja bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di sini “anak sulung” tidak harus menunjuk urutan kelahiran secara harfiah, melainkan kedudukan tertinggi dan hak istimewa. Dapat juga diterjemahkan “yang terutama”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Bahkan
  rationale: Partikel ini menegaskan dan melanjutkan komitmen ilahi. “Bahkan” menyampaikan daya penegasan itu secara alami dalam bahasa Indonesia.
- source_word: אָנִי
  choice: Aku
  rationale: Pronomina mandiri dalam bahasa Ibrani memberi penekanan pada pembicara; “Aku” mempertahankan penekanan tersebut dan sesuai dengan ujaran Allah.
- source_word: בְּכוֹר
  choice: anak sulung
  rationale: Istilah ini dipertahankan secara konkret karena menunjuk pada kedudukan, hak, dan keutamaan seorang anak sulung, bukan harus urutan kelahiran harfiah.
- source_word: אֶתְּנֵהוּ
  choice: Aku akan menjadikannya
  rationale: Dalam konstruksi dengan predikat ini, נתן berarti menetapkan atau menjadikan seseorang dalam suatu kedudukan. Pilihan ini alami dan mempertahankan hasil tindakan tersebut.
- source_word: עֶלְיוֹן
  choice: yang tertinggi
  rationale: Kata ini menggambarkan kedudukan paling luhur dalam perbandingan dengan para raja dunia; “yang tertinggi” menghindari kesan bahwa gelar ilahi “Yang Mahatinggi” sedang dipakai bagi sang raja.
- source_word: לְמַלְכֵי אָרֶץ
  choice: di antara raja-raja bumi
  rationale: Preposisi ל menandai hubungan atau perbandingan. Ungkapan ini menyatakan bahwa ia berkedudukan tertinggi dalam hubungannya dengan para raja bumi, tanpa mempersempitnya secara berlebihan menjadi lokasi atau pemerintahan langsung.
theological_decisions:
- issue: Daya kerajaan dan kemungkinan daya mesianik dari “anak sulung”
  choice: Mempertahankan “anak sulung” sebagai istilah status kerajaan yang menyiratkan keutamaan.
  alternative: Menerjemahkannya secara dinamis sebagai “yang terutama” atau “ahli waris”.
  rationale: Dalam konteksnya, mazmur ini berbicara tentang raja keturunan Daud dan terbuka bagi pembacaan mesianik. Istilah Ibraninya sendiri patut dipertahankan agar kedalaman dan ketegangan teologisnya tidak diselesaikan di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku” menandai Allah sebagai pembicara. Susunan kalimat dibuat alami tanpa menghilangkan penekanan pada tindakan ilahi maupun metafora “anak sulung”.
