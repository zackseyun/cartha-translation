id: PSA.89.9
reference: Psalms 89:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: id
  text: Engkau menguasai gelora laut[a]; ketika gelombang-gelombangnya meninggi, Engkau meredakannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keangkuhan laut” atau “keagungan laut.” Kata Ibrani dapat menunjuk pada sesuatu yang meninggi, keagungan, atau gelora; dalam konteks ini, gambaran laut yang bergelora paling sesuai.
    reason: lexical_alternative
  - marker: b
    text: Atau “menenangkannya” atau “menaklukkannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: menguasai
  rationale: Bentuk partisip ini menyatakan kekuasaan yang berlangsung. “Menguasai” secara alami menyampaikan pemerintahan dan kendali aktif atas laut.
- source_word: בְּגֵאוּת
  choice: gelora
  rationale: גֵּאוּת dapat berarti keangkuhan, keagungan, atau keadaan meninggi dan bergelora. Dalam kaitannya dengan laut, “gelora” mempertahankan gambaran konkret tentang air yang bergejolak.
- source_word: הַיָּם
  choice: laut
  rationale: Padanan Indonesia yang lazim dan tepat bagi יָם dalam konteks puitis ini.
- source_word: בְּשׂוֹא
  choice: ketika ... meninggi
  rationale: Infinitif ini menyatakan keadaan ketika ombak terangkat atau naik. Ungkapan temporal ini jelas dan wajar dalam bahasa Indonesia.
- source_word: גַלָּיו
  choice: gelombang-gelombangnya
  rationale: Akhiran pronominal merujuk kepada laut. Bentuk ulang menandai jamak secara jelas dan tetap puitis.
- source_word: תְשַׁבְּחֵם
  choice: Engkau meredakannya
  rationale: Dalam bentuk Piel dan konteks air yang bergelora, kata ini berarti menenangkan, meredakan, atau menaklukkan. “Meredakan” alami untuk gelombang dan mempertahankan gambaran tindakan ilahi yang menghentikan gejolaknya.
theological_decisions:
- issue: Kedaulatan Allah atas perairan yang kacau
  choice: Ayat diterjemahkan sebagai penegasan langsung bahwa Allah mengendalikan laut dan gelombangnya.
  alternative: Bahasa ini dapat dipahami sebagai kiasan puitis tentang kemenangan Allah atas kekacauan kosmis.
  rationale: Teks secara eksplisit menggambarkan kuasa Allah atas laut. Terjemahan mempertahankan citra puitis konkret tanpa memasukkan kerangka mitologis yang tidak dinyatakan langsung oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan ilahi memakai “Engkau”; susunan kalimat dibuat lugas serta mudah dipahami, sambil mempertahankan paralelisme antara gelora laut, gelombang yang meninggi, dan tindakan Allah yang meredakannya.
