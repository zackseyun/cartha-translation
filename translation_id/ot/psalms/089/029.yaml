  text: I will establish his offspring forever[a], and his throne as the days of heaven.
translation:
  language: id
  text: Aku akan meneguhkan keturunannya untuk selama-lamanya, dan takhtanya seperti hari-hari langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “selama langit tetap ada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Aku akan menegakkan
  rationale: Kata שׂים secara harfiah berarti ‘menaruh’ atau ‘menetapkan’, tetapi dalam konteks janji perjanjian tentang keturunan dan takhta, ‘menegakkan’ menyampaikan gagasan menetapkan secara kukuh dan berkelanjutan.
- source_word: לָעַד
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa batas; bentuk ini wajar dalam bahasa Indonesia dan mempertahankan kuatnya janji tersebut.
- source_word: זַרְעוֹ
  choice: keturunannya
  rationale: זֶרַע adalah nomina kolektif yang dapat berarti benih atau keturunan. ‘Keturunannya’ alami dalam bahasa Indonesia dan tetap memungkinkan acuan kolektif tanpa menentukan jumlah orang.
- source_word: וְכִסְאוֹ
  choice: dan takhtanya
  rationale: כִּסֵּא secara langsung berarti ‘takhta’; bentuk milik tetap mengacu kepada raja keturunan Daud dalam konteks.
- source_word: כִּימֵי שָׁמָיִם
  choice: seperti hari-hari langit
  rationale: Terjemahan ini mempertahankan perbandingan puitis Ibrani, termasuk unsur ‘hari-hari’, tanpa langsung meratakannya menjadi penjelasan mengenai lamanya waktu.
theological_decisions:
- issue: Durasi janji perjanjian kepada keturunan Daud
  choice: Mempertahankan bahasa kekekalan dan perbandingan puitis dengan hari-hari langit.
  alternative: Menafsirkan secara eksplisit sebagai ‘selama langit tetap ada’ atau membatasinya menjadi ‘sepanjang segala generasi’.
  rationale: Teks menyampaikan janji yang sangat kuat mengenai keberlangsungan keturunan dan takhta. Terjemahan tidak menetapkan kerangka dinasti atau eskatologis tertentu dan tidak melunakkan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Frasa ‘hari-hari langit’ sengaja dipertahankan sebagai citra puitis yang dekat dengan bentuk Ibrani; catatan kaki menyediakan padanan idiomatisnya.
