  text: זְכָר אֲנִ֥י מֶה חָ֑לֶד עַל מַה שָּׁ֝֗וְא בָּרָ֥אתָ כָל בְּנֵי אָדָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/047.yaml
  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: id
  text: Ingatlah betapa singkatnya masa hidupku! Untuk kesia-siaan apakah Engkau telah menciptakan semua anak manusia?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seluruh umat manusia.” Secara harfiah: “semua anak manusia.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau sebagai pernyataan ratapan: “Untuk kesia-siaan Engkau telah menciptakan semua anak manusia.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: זְכָר
  choice: Ingatlah
  rationale: Bentuk imperatif maskulin tunggal yang ditujukan kepada Allah; bentuk permohonan langsung dipertahankan.
- source_word: אֲנִי מֶה חָלֶד
  choice: betapa singkat masa hidupku
  rationale: Secara harfiah susunannya tidak lazim, kira-kira 'aku—apakah masa hidup'; dalam konteks ratapan, frasa ini menyatakan pendeknya rentang hidup pemazmur. Terjemahan ini menyampaikan maknanya secara alami tanpa menghilangkan nada seruan.
- source_word: עַל מַה
  choice: Untuk ... apa
  rationale: Mempertahankan nuansa tujuan dalam pertanyaan retoris, bukan sekadar menerjemahkannya sebagai 'mengapa'.
- source_word: שָּׁוְא
  choice: kesia-siaan
  rationale: Kata ini menunjuk pada kehampaan, kesia-siaan, atau sesuatu yang tanpa hasil; 'kesia-siaan' sesuai dengan nada puitis dan ratapan ayat ini.
- source_word: בָּרָאתָ
  choice: Engkau telah menciptakan
  rationale: Bentuk perfektif orang kedua maskulin tunggal dengan Allah sebagai pelaku. 'Telah menciptakan' menghubungkan tindakan penciptaan itu dengan keluhan sekarang.
- source_word: כָל בְּנֵי אָדָם
  choice: semua anak manusia
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah berarti 'semua anak manusia', sementara cakupannya bersifat umum, yakni seluruh umat manusia.
theological_decisions:
- issue: Rujukan umum dalam כָל בְּנֵי אָדָם
  choice: semua anak manusia
  alternative: seluruh umat manusia
  rationale: Ungkapan sumber memakai idiom yang secara gramatikal berbentuk maskulin tetapi merujuk kepada manusia secara umum. Teks utama mempertahankan citra Ibraninya, sedangkan catatan menjelaskan cakupan universalnya.
- issue: Pertanyaan retoris atau pernyataan mengenai kesia-siaan penciptaan manusia
  choice: Untuk kesia-siaan apa Engkau telah menciptakan ...?
  alternative: Untuk kesia-siaan Engkau telah menciptakan ...
  rationale: עַל מַה paling wajar dibaca sebagai pertanyaan retoris tentang tujuan, tetapi susunan Ibrani yang padat juga dapat ditampilkan sebagai pernyataan ratapan. Teks utama menandai pembacaan interogatif tanpa menutupi alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Sapaan kepada Allah memakai “Engkau” sesuai register doa yang khidmat. “Masa hidupku” dipilih alih-alih bentuk harfiah yang kaku, sedangkan “semua anak manusia” mempertahankan idiom sumber.
