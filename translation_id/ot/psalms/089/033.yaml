source:
  edition: WLC
  text: וְ֭/חַסְדִּ/י לֹֽא אָפִ֣יר מֵֽ/עִמּ֑/וֹ וְ/לֹֽא אֲ֝שַׁקֵּ֗ר בֶּ/אֱמוּנָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/033.yaml
  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: id
  text: Namun kasih setia-Ku tidak akan Kutarik darinya[a], dan Aku tidak akan mengingkari kesetiaan-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kasih teguh-Ku” atau “kasih perjanjian-Ku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “Aku tidak akan berlaku palsu dalam kesetiaan-Ku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: kasih setia-Ku
  rationale: חֶסֶד di sini menunjuk pada kasih yang teguh dan loyal dalam ikatan perjanjian; “kasih setia” merupakan ungkapan Indonesia yang alami dan mempertahankan unsur kasih sekaligus keteguhan.
- source_word: אָפִיר
  choice: tidak akan Kutarik
  rationale: Bentuk Hifil dari פור dalam konstruksi ini menyatakan penarikan atau peniadaan sesuatu dari seseorang. “Kutarik” menyampaikan bahwa kasih setia itu tidak akan ditarik darinya.
- source_word: מֵעִמּוֹ
  choice: darinya
  rationale: Gabungan preposisi dan sufiks pronominal menyatakan pemisahan dari orang yang dimaksud; “darinya” ringkas dan alami.
- source_word: אֲשַׁקֵּר
  choice: Aku tidak akan mengingkari
  rationale: Bentuk Piel dari שׁקר menyatakan bertindak palsu atau tidak benar. Dalam hubungan dengan kesetiaan Allah sendiri, “mengingkari” secara alami menyampaikan tindakan yang bertentangan dengan komitmen-Nya, tanpa membatasinya pada kebohongan lisan.
- source_word: בֶּאֱמוּנָתִי
  choice: kesetiaan-Ku
  rationale: אֱמוּנָה di sini berarti kesetiaan atau keterandalan. Preposisi ב bersifat idiomatis; objek langsung setelah “mengingkari” menghasilkan bahasa Indonesia yang alami sambil mempertahankan acuan kepada kesetiaan Allah sendiri.
- source_word: וְ
  choice: Namun / dan
  rationale: Konjungsi pertama bersifat kontras terhadap hukuman dalam ayat sebelumnya sehingga diterjemahkan “Namun”; konjungsi antarklausa diterjemahkan “dan”.
theological_decisions:
- issue: Bahasa perjanjian tentang komitmen Allah kepada keturunan Daud
  choice: Memakai “kasih setia” dan “kesetiaan”
  alternative: Memakai “belas kasihan” dan “kebenaran”
  rationale: Pilihan ini mempertahankan penegasan bahwa disiplin ilahi tidak membatalkan kasih dan keterandalan perjanjian Allah, tanpa memasukkan kategori teologis yang tidak dinyatakan langsung oleh ayat.
- issue: Hubungan tindakan palsu dengan kesetiaan Allah
  choice: “Aku tidak akan mengingkari kesetiaan-Ku”
  alternative: “Aku tidak akan berlaku palsu dalam kesetiaan-Ku”
  rationale: Terjemahan utama memberi bahasa Indonesia yang lebih alami, sedangkan catatan kaki mempertahankan bentuk ungkapan Ibrani yang lebih harfiah dan ketegangannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kasih setia-Ku” mempertahankan nuansa perjanjian yang dikenal luas, sedangkan susunan klausa dibuat alami bagi pembaca umum tanpa menghilangkan paralelisme ayat.
