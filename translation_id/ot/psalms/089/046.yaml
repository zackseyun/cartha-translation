  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַד מָ֣ה יְ֭הוָה תִּסָּתֵ֣ר לָ/נֶ֑צַח תִּבְעַ֖ר כְּמוֹ אֵ֣שׁ חֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/046.yaml
  text: How long[a], O Yahweh? Will you hide yourself forever? Will your wrath burn like fire?
translation:
  language: id
  text: Sampai kapan, ya Yahweh[a]? Akankah Engkau menyembunyikan diri untuk selama-lamanya? Akankah murka-Mu menyala seperti api?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN.”'
    reason: Menjelaskan bentuk nama ilahi dan padanan tradisionalnya.
lexical_decisions:
- source_word: עַד מָה
  choice: Sampai kapan
  rationale: Ungkapan ratapan Ibrani ini mempertanyakan lamanya penderitaan. “Sampai kapan” merupakan padanan Indonesia yang alami dan mempertahankan desakan keluhan pemazmur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh” agar nama pribadi Allah Israel tetap tampak, bukan diganti dengan gelar.
- source_word: תִּסָּתֵר
  choice: Engkau menyembunyikan diri
  rationale: 'Bentuk Nifal dari סתר dalam konteks ini secara alami dipahami secara refleksif: Allah seolah-olah menyembunyikan diri dari pemazmur.'
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Frasa ini menyatakan durasi tanpa akhir; bentuk ini jelas dalam bahasa Indonesia dan cocok dengan pertanyaan retoris dalam ratapan.
- source_word: תִּבְעַר
  choice: menyala
  rationale: Kata kerja בער berarti membakar atau menyala. “Menyala” berpadu alami dengan murka yang dibandingkan dengan api tanpa menambahkan gagasan bahwa murka itu pasti menghanguskan.
- source_word: כְּמוֹ אֵשׁ
  choice: seperti api
  rationale: Padanan langsung dan alami untuk perumpamaan sederhana yang membandingkan murka ilahi dengan api.
- source_word: חֲמָתֶךָ
  choice: murka-Mu
  rationale: Kata ini menunjuk pada panasnya kemarahan atau murka. “Murka” mempertahankan bobot dan laras luhur yang sesuai untuk kemarahan ilahi, tetapi tetap mudah dipahami.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Ayat ini menyapa Allah perjanjian Israel dengan nama YHWH. Bentuk “Yahweh” mempertahankan nama pribadi itu dalam teks utama; catatan kaki memberi tahu pembaca tentang kebiasaan penerjemahan tradisional.
- issue: Gambaran murka ilahi sebagai api
  choice: murka-Mu menyala seperti api
  alternative: murka-Mu menghanguskan seperti api
  rationale: Teks menyatakan bahwa murka itu membakar atau menyala seperti api, tetapi tidak secara eksplisit menyebut objek yang dihanguskan. Terjemahan ini mempertahankan metafora tanpa memperluas maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel sapaan “ya” membuat seruan kepada Yahweh alami dalam bahasa Indonesia. Huruf kapital pada “Engkau” dan akhiran “-Mu” mengikuti kelaziman penghormatan dalam terjemahan Alkitab Indonesia. Tiga pertanyaan mempertahankan nada ratapan yang mendesak.
