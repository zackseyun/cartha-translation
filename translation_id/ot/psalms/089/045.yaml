  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: id
  text: Engkau telah memperpendek masa mudanya; Engkau telah menyelubunginya dengan aib.[a] Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Engkau telah mengenakan aib kepadanya.”
    reason: Alternatif leksikal untuk הֶעֱטִיתָ עָלָיו בּוּשָׁה, yang dapat menggambarkan aib sebagai sesuatu yang dikenakan seperti pakaian.
lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: Engkau telah memperpendek
  rationale: Bentuk Hifil dari קצר berarti membuat pendek atau memperpendek. Bentuk perfektif diterjemahkan dengan “telah” untuk menyatakan tindakan yang akibatnya masih dirasakan.
- source_word: יְמֵי עֲלוּמָיו
  choice: masa mudanya
  rationale: Secara harfiah berarti “hari-hari masa mudanya”. “Masa mudanya” menyampaikan rentang waktu yang dimaksud dengan wajar dalam bahasa Indonesia tanpa mengubah makna.
- source_word: הֶעֱטִיתָ עָלָיו
  choice: Engkau telah menyelubunginya
  rationale: Bentuk Hifil dari עטה dengan עָלָיו dapat berarti menutupi, menyelubungi, atau mengenakan sesuatu padanya. “Menyelubunginya” mempertahankan citra sesuatu yang menutupi dirinya.
- source_word: בּוּשָׁה
  choice: rasa malu
  rationale: Kata ini menunjuk pada rasa malu, aib, atau kehinaan. “Rasa malu” merupakan padanan dasar dan alami dalam konteks ini.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal ini dialihaksarakan karena fungsi tepatnya tidak pasti.
theological_decisions:
- issue: Acuan akhiran orang ketiga tunggal maskulin pada עֲלוּמָיו dan עָלָיו
  choice: Mempertahankan bentuk “-nya” tanpa menyebutkan siapa acuannya.
  alternative: Menafsirkan acuan itu secara eksplisit sebagai raja keturunan Daud, dinasti Daud, atau orang yang diurapi.
  rationale: Konteks mengarah kepada raja yang diurapi atau dinastinya yang sedang direndahkan, tetapi ayat ini sendiri tidak menyebutkan acuan tersebut. Bentuk “-nya” mempertahankan ambiguitas puitis dan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi “Engkau” dipakai untuk sapaan kepada Allah. “Sela” mempertahankan istilah sumber tanpa menafsirkan fungsi musikal atau liturgisnya.
