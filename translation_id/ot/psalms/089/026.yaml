base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/026.yaml
  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: id
  text: Ia akan berseru kepada-Ku[a], “Engkaulah Bapaku, Allahku, dan gunung batu keselamatanku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia akan memanggil-Ku.” Kata kerja Ibrani ini dapat berarti “memanggil”; dalam konteks invokasi atau doa, kata ini juga dapat dipahami sebagai “berseru kepada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Ia
  rationale: Kata ganti orang ketiga maskulin tunggal dinyatakan secara eksplisit dalam bahasa Ibrani untuk memberi penekanan pada subjek.
- source_word: יִקְרָאֵנִי
  choice: akan berseru kepada-Ku
  rationale: Verba קרא dapat berarti memanggil atau berseru. Dalam konteks doa atau seruan kepada Allah, “berseru kepada-Ku” alami dalam bahasa Indonesia dan mempertahankan nuansa seruan; sufiks orang pertama tunggal diterjemahkan “kepada-Ku”.
- source_word: אָבִי
  choice: Bapaku
  rationale: Nomina dengan sufiks orang pertama tunggal berarti “bapaku”; huruf kapital menandai sapaan langsung kepada Allah tanpa menambahkan kesimpulan doktrinal lain.
- source_word: אָתָּה
  choice: Engkaulah
  rationale: Kata ganti independen dinyatakan eksplisit dan bersifat emfatis. Bentuk “Engkaulah” menyampaikan penekanan itu secara wajar dalam sapaan yang khidmat.
- source_word: אֵלִי
  choice: Allahku
  rationale: אֵל di sini menunjuk kepada Allah, sejajar dengan “Bapaku” dan “gunung batu keselamatanku”; sufiks orang pertama tunggal dipertahankan.
- source_word: וְצוּר
  choice: dan gunung batu
  rationale: צוּר secara harfiah menunjuk batu karang atau gunung batu dan lazim menjadi metafora bagi kekuatan serta perlindungan Allah. Bahasa Indonesia Alkitabiah yang tetap mudah dipahami adalah “gunung batu”.
- source_word: יְשׁוּעָתִי
  choice: keselamatanku
  rationale: Nomina יְשׁוּעָה berarti keselamatan atau pembebasan. Bentuk “gunung batu keselamatanku” mempertahankan hubungan konstruksi Ibrani dan resonansi teologisnya.
theological_decisions:
- issue: Sapaan ilahi dalam konteks kerajaan/Mesianis
  choice: 'Menerjemahkan ucapan sang raja secara langsung sebagai sapaan kepada Allah: “Engkaulah Bapaku, Allahku, dan gunung batu keselamatanku.”'
  alternative: Menurunkan daya sapaan “Bapa” atau menafsirkan ungkapan ini secara eksplisit hanya sebagai bahasa kerajaan hiperbolis.
  rationale: Mazmur 89 membahas raja keturunan Daud dan perjanjian, tetapi ayat ini sendiri menyajikan sapaan langsung kepada Allah dengan bahasa relasional dan perjanjian. Terjemahan mempertahankan tekstur tersebut tanpa memasukkan kesimpulan doktrinal kemudian.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Ia” dipilih untuk narasi puitis; “Engkaulah” mempertahankan penekanan kata ganti Ibrani. Kapitalisasi pada pronomina dan gelar sapaan mengikuti penghormatan kepada Allah.
