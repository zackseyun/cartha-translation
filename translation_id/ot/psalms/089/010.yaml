source:
  edition: WLC
  text: אַתָּ֤ה דִכִּ֣אתָ כֶ/חָלָ֣ל רָ֑הַב בִּ/זְר֥וֹעַ עֻ֝זְּ/ךָ֗ פִּזַּ֥רְתָּ אוֹיְבֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/010.yaml
  text: You crushed Rahab like one slain[a]; with your mighty arm you scattered your enemies.
translation:
  language: id
  text: Engkau meremukkan Rahab seperti orang yang terbunuh[a]; dengan lengan-Mu yang perkasa Engkau mencerai-beraikan musuh-musuh-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab adalah nama puitis yang dapat merujuk kepada Mesir atau kepada monster maupun kuasa kekacauan yang dikalahkan Allah.
    reason: Menjelaskan dua kemungkinan rujukan nama tersebut tanpa memilih salah satunya dalam teks utama.
lexical_decisions:
- source_word: דִכִּאתָ
  choice: meremukkan
  rationale: Kata kerja ini menyatakan tindakan menghancurkan atau meremukkan dengan kuat; pilihan ini mempertahankan daya gambar peperangan.
- source_word: כֶחָלָל
  choice: seperti orang yang terbunuh
  rationale: Prefiks כ menyatakan perbandingan, sedangkan חָלָל lazim menunjuk kepada orang yang tertikam atau terbunuh dalam pertempuran. Ungkapan ini mempertahankan bentuk simile tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: רָהַב
  choice: Rahab
  rationale: Nama atau gelar puitis ini dapat menunjuk kepada Mesir dan sekaligus membangkitkan gambaran kuasa kekacauan. Transliterasi mempertahankan ambiguitas sumber.
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: dengan lengan-Mu yang perkasa
  rationale: Ungkapan instrumental ini diterjemahkan secara alami sambil mempertahankan gambaran antropomorfis tentang kuasa Allah.
- source_word: פִּזַּרְתָּ
  choice: mencerai-beraikan
  rationale: Kata kerja ini berarti menyebarkan atau membuat tercerai-berai. Pilihan ini kuat dan alami tanpa menambahkan makna khusus seperti menghalau dalam perang.
- source_word: אוֹיְבֶיךָ
  choice: musuh-musuh-Mu
  rationale: Padanan langsung dan alami bagi nomina jamak posesif tersebut.
theological_decisions:
- issue: Identitas רָהַב dalam konteks puitis
  choice: Mempertahankan “Rahab” dalam teks utama sebagai nama puitis bagi lawan yang dikalahkan Allah.
  alternative: Menerjemahkannya sebagai “Mesir” atau sebagai monster/kuasa kekacauan.
  rationale: Kata Ibrani itu dapat berfungsi sebagai nama puitis bagi Mesir dan juga menggemakan gambaran kosmis tentang kekacauan. Mempertahankan namanya menghindari penyelesaian prematur atas ambiguitas teologis dan sastrawi tersebut.
translation_notes:
  register: Bahasa Indonesia baku yang modern, khidmat, dan mudah dipahami. Bentuk “Engkau” serta akhiran “-Mu” mempertahankan sapaan langsung kepada Allah; tanda hubung mengikuti kaidah ejaan untuk kata ganti yang merujuk kepada-Nya.
