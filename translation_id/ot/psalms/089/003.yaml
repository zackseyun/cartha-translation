  yaml_path: translation/ot/psalms/089/003.yaml
  text: 'I have made a covenant with my chosen one[a]; I have sworn to David my servant:'
translation:
  language: id
  text: “Aku telah mengadakan perjanjian dengan orang pilihan-Ku[a]; Aku telah bersumpah kepada Daud, hamba-Ku:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “Aku telah memotong perjanjian dengan orang pilihan-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַתִּי
  choice: Aku telah mengikat
  rationale: Ungkapan Ibrani כרת ברית secara harfiah berarti ‘memotong perjanjian’, tetapi merupakan idiom untuk menetapkan atau mengadakan perjanjian. Dalam bahasa Indonesia, ‘mengikat perjanjian’ alami serta mempertahankan nuansa tindakan yang sungguh-sungguh dan mengikat. Bentuk perfektif diterjemahkan ‘telah’ karena tindakan lampau itu tetap berlaku dalam konteks sumpah ilahi.
- source_word: בְּרִית
  choice: perjanjian
  rationale: ‘Perjanjian’ mempertahankan bobot relasional dan teologis ברית tanpa mereduksinya menjadi sekadar persetujuan atau traktat.
- source_word: לִבְחִירִי
  choice: dengan orang pilihan-Ku
  rationale: Dalam konstruksi dengan ברית, preposisi ל secara idiomatis menunjukkan pihak yang dengannya perjanjian diikat. בְחִירִי berarti ‘orang pilihan-Ku’ dan dalam konteks langsung merujuk kepada Daud.
- source_word: נִשְׁבַּעְתִּי
  choice: Aku telah bersumpah
  rationale: Bentuk Nifal dari שׁבע berarti bersumpah atau mengucapkan sumpah. ‘Telah bersumpah’ menyampaikan tindakan khidmat yang daya berlakunya berlanjut.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Preposisi ל setelah verba ‘bersumpah’ menandai orang yang kepadanya sumpah itu dinyatakan; ‘kepada Daud’ merupakan padanan langsung dan alami.
- source_word: עַבְדִּי
  choice: hamba-Ku
  rationale: Dalam konteks kerajaan dan hubungan perjanjian Daud dengan Allah, ‘hamba-Ku’ adalah gelar yang tepat dan alami; penekanan pada status budak tidak ditonjolkan di sini.
theological_decisions:
- issue: Identitas ‘orang pilihan-Ku’
  choice: Mempertahankan Daud sebagai rujukan langsung dalam konteks perjanjian Daud.
  alternative: Menjadikan ungkapan itu secara eksplisit sebagai sebutan mesianik yang melampaui Daud.
  rationale: Paralelisme ayat menghubungkan ‘orang pilihan-Ku’ dengan ‘Daud, hamba-Ku’. Makna tipologis atau mesianik yang lebih luas tidak disisipkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Kapitalisasi pada pronomina -Ku mengikuti kebiasaan ejaan Indonesia untuk rujukan kepada Allah. Tanda titik dua dipertahankan karena sumpah tersebut berlanjut pada ayat berikutnya.
