source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹ֘הֵ֤י צְבָא֗וֹת מִֽי כָֽמ֖וֹ/ךָ חֲסִ֥ין יָ֑הּ וֶ֝/אֱמֽוּנָתְ/ךָ֗ סְבִיבוֹתֶֽי/ךָ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: id
  text: Ya Yahweh, Allah semesta alam, siapakah yang perkasa seperti Engkau, ya Yah[a]? Kesetiaan-Mu mengelilingi-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yah” adalah bentuk pendek nama ilahi “Yahweh” dalam bahasa Ibrani.
    reason: Menjelaskan bahwa bentuk יָהּ berbeda dari bentuk lengkap יְהוָה yang muncul sebelumnya dalam ayat ini.
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”; partikel “Ya” menyatakan sapaan langsung tanpa mengganti nama itu dengan gelar.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Allah segala bala tentara
  rationale: Frasa konstruksi ini secara harfiah menunjuk kepada Allah dari bala-bala tentara. “Segala” mempertahankan bentuk jamak dan keluasan maknanya tanpa membatasi bala tentara itu hanya pada pasukan bumi atau surga.
- source_word: מִי כָמוֹךָ
  choice: siapakah yang seperti Engkau
  rationale: Ungkapan retoris ini menegaskan bahwa Yahweh tidak tertandingi, sambil mempertahankan bentuk pertanyaan puitis Ibrani.
- source_word: חֲסִין
  choice: yang perkasa
  rationale: Kata sifat ini menyatakan kekuatan atau keperkasaan dan secara alami menerangkan nama pendek ilahi “Yah” dalam sapaan tersebut.
- source_word: יָהּ
  choice: ya Yah
  rationale: Bentuk pendek nama ilahi dipertahankan sebagai “Yah”, berbeda dari יְהוָה yang muncul pada awal ayat. “ya” dengan huruf kecil adalah kata seru sapaan dalam bahasa Indonesia.
- source_word: וֶאֱמוּנָתְךָ
  choice: Kesetiaan-Mu
  rationale: אֱמוּנָה di sini menunjuk pada sifat dapat dipercaya, teguh, dan setia. Konjungsi Ibrani diwujudkan secara wajar dengan memulai kalimat lanjutan, bukan dengan “dan” yang kaku.
- source_word: סְבִיבוֹתֶיךָ
  choice: mengelilingi-Mu
  rationale: Bentuk lokatif jamak berarti berada di sekeliling. Kata kerja “mengelilingi” mempertahankan gambaran puitis bahwa kesetiaan ada di sekitar Allah.
theological_decisions:
- issue: Pembedaan יְהוָה dan bentuk pendek יָהּ dalam ayat yang sama
  choice: Menerjemahkan יְהוָה sebagai “Yahweh” dan יָהּ sebagai “Yah”
  alternative: Menyamakan keduanya sebagai “TUHAN” atau “Yahweh”
  rationale: Teks Ibrani sengaja memakai dua bentuk nama ilahi. Mempertahankan perbedaannya menjaga bentuk sumber tanpa memasukkan penafsiran denominasi tertentu.
- issue: Hubungan חֲסִין dengan יָהּ
  choice: “ya Yah yang perkasa”
  alternative: “siapakah yang perkasa seperti Engkau, ya Yah?”
  rationale: Urutan dan bentuk teks paling langsung memungkinkan חֲסִין dipahami sebagai sebutan yang menerangkan Yah. Susunan Indonesia ini mempertahankan sapaan puitis tersebut, meskipun secara makna seluruh pertanyaan tetap menegaskan keperkasaan Yahweh yang tidak tertandingi.
translation_notes:
  register: Bahasa dibuat modern, khidmat, dan puitis. Sapaan “Ya Yahweh” dan “ya Yah yang perkasa” mengikuti gaya doa. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Istilah “Allah segala bala tentara” dipilih untuk menjaga citra צְבָאוֹת dan menghindari penyempitan menjadi hanya tentara surgawi.
