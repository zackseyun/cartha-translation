  text: Like the moon[a], it will be established forever, and the witness in the sky is faithful[b]. Selah
translation:
  language: id
  text: Seperti bulan[a], takhtanya akan tetap teguh untuk selama-lamanya, dan saksi di langit setia[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bagaikan bulan.”'
    reason: lexical_alternative
  - marker: b
    text: “Saksi di langit” sering dipahami sebagai bulan, yang berfungsi sebagai saksi yang dapat diandalkan atas kelanggengan perjanjian itu.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: Seperti bulan
  rationale: Prefiks כְּ menyatakan perbandingan, dan יָרֵחַ berarti “bulan”. “Seperti bulan” mempertahankan perumpamaan dengan bahasa Indonesia yang alami.
- source_word: יִכּוֹן
  choice: akan tetap teguh
  rationale: Bentuk Nifal imperfek dari כון menyatakan keadaan ditegakkan atau berdiri kukuh. “Akan tetap teguh” menyampaikan hasil yang berkelanjutan secara alami; subjeknya, “takhtanya”, dipasok dari konteks langsung ayat sebelumnya.
- source_word: עוֹלָם
  choice: untuk selama-lamanya
  rationale: Dalam konteks perjanjian puitis, עוֹלָם menyatakan kelanggengan; ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: וְעֵד
  choice: saksi
  rationale: עֵד berarti “saksi”. Terjemahan ini tidak menetapkan identitas saksi tersebut.
- source_word: בַּשַּׁחַק
  choice: di langit
  rationale: שַׁחַק dalam puisi dapat menunjuk pada langit, cakrawala, atau awan. “Di langit” paling alami dan tidak mempersempitnya menjadi awan.
- source_word: נֶאֱמָן
  choice: setia
  rationale: Kata ini menyatakan keteguhan, keterandalan, dan kesetiaan. “Setia” mempertahankan gema perjanjian sekaligus gagasan bahwa saksi itu dapat diandalkan.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak pasti, sehingga ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat dari יִכּוֹן
  choice: Subjek dinyatakan sebagai “takhtanya”, mengikuti anteseden terdekat dalam ayat sebelumnya.
  alternative: Membiarkan subjek tanpa dinyatakan atau memakai kata ganti “ia/itu”.
  rationale: Bahasa Ibrani dapat meneruskan subjek dari konteks, sedangkan bahasa Indonesia memerlukan subjek yang lebih jelas. “Takhtanya” mengikuti anteseden langsung tanpa menambahkan konsep teologis baru.
- issue: Identitas “saksi di langit”
  choice: Identitasnya tidak ditentukan dalam teks utama.
  alternative: Mengidentifikasinya secara eksplisit sebagai bulan atau tanda langit lainnya.
  rationale: Teks Ibrani tidak menyebut identitas saksi itu secara eksplisit. Ambiguitas dipertahankan, sementara kemungkinan bahwa bulanlah yang dimaksud diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang sederhana dan bermartabat. Tanda titik koma mempertahankan hubungan erat antara kedua klausa tanpa memaksakan identitas saksi. Bentuk “Sela” mengikuti transliterasi yang lazim bagi pembaca Indonesia.
