source:
  edition: WLC
  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
translation:
  language: id
  text: Sebab aku telah berkata, “Kasih setia akan dibangun[a] untuk selama-lamanya; di langit Engkau akan menegakkan kesetiaan-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan ditegakkan.” Kata kerja Ibrani dapat berarti “dibangun” atau, secara lebih umum, “ditegakkan”; teks utama mempertahankan metafora pembangunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas atau kausal yang menghubungkan pernyataan ini dengan konteks sebelumnya.
- source_word: אָמַרְתִּי
  choice: aku berkata
  rationale: Bentuk qal perfektif orang pertama tunggal paling langsung diterjemahkan sebagai pernyataan lampau, tanpa mengubahnya menjadi verba deklaratif yang lebih interpretatif.
- source_word: עוֹלָם
  choice: untuk selama-lamanya
  rationale: Dipakai secara adverbial untuk menyatakan keberlangsungan tanpa akhir; ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Mencakup unsur kasih dan loyalitas yang teguh, termasuk nuansa relasional-perjanjian, tanpa mempersempitnya hanya menjadi belas kasihan.
- source_word: יִבָּנֶה
  choice: akan dibangun
  rationale: Bentuk nifal imperfektif dari בנה mendukung makna pasif dan mempertahankan metafora arsitektural yang nyata dalam bahasa Ibrani.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, bentuk tunggal kolektif 'langit' merupakan padanan alami bagi bentuk Ibrani yang secara morfologis jamak.
- source_word: תָּכִן
  choice: Engkau akan menegakkan
  rationale: Bentuk hifil orang kedua maskulin tunggal menyatakan tindakan membuat sesuatu kokoh; 'menegakkan' mempertahankan arti kausatif dan sapaan langsung kepada Allah.
- source_word: אֱמוּנָתְךָ
  choice: kesetiaan-Mu
  rationale: Menyampaikan keteguhan, keandalan, dan kesetiaan ilahi; akhiran orang kedua tunggal dinyatakan dengan '-Mu'.
- source_word: בָהֶם
  choice: di langit
  rationale: Pronomina 'di dalam mereka' menunjuk kembali kepada שָׁמַיִם; penyebutan ulang antecedennya menghasilkan bahasa Indonesia yang lebih jelas dan alami.
theological_decisions:
- issue: Makna חֶסֶד dalam konteks puisi yang bernuansa perjanjian
  choice: kasih setia
  alternative: kasih perjanjian; belas kasihan
  rationale: '''Kasih setia'' mempertahankan gabungan kasih dan loyalitas yang teguh tanpa membatasi istilah itu pada satu rumusan doktrinal atau hanya pada rasa iba.'
- issue: Apakah larik kedua merupakan sapaan langsung kepada Allah
  choice: 'sapaan langsung: “Engkau akan menegakkan kesetiaan-Mu”'
  alternative: pernyataan impersonal bahwa kesetiaan ditegakkan di langit
  rationale: Bentuk verba orang kedua maskulin tunggal dan sufiks orang kedua pada אֱמוּנָתְךָ dengan kuat menunjukkan bahwa pemazmur berbicara langsung kepada Allah.
- issue: Metafora pembangunan pada kasih setia
  choice: mempertahankan metafora dengan “akan dibangun”
  alternative: meratakan metafora menjadi “akan ditegakkan”
  rationale: Bahasa sumber memakai verba בנה, 'membangun'. Metafora tersebut dipertahankan dalam teks utama, sementara arti yang lebih umum dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Kapitalisasi “Engkau” dan sufiks “-Mu” menandai sapaan kepada Allah sesuai kebiasaan penerbitan Alkitab bahasa Indonesia, tanpa menambahkan unsur yang tidak ada dalam teks sumber.
