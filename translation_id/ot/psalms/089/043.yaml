  text: אַף תָּ֭שִׁיב צ֣וּר חַרְבּ֑/וֹ וְ/לֹ֥א הֲ֝קֵימֹת֗/וֹ בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/043.yaml
  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
translation:
  language: id
  text: Bahkan Engkau memalingkan mata pedangnya[a], dan Engkau tidak membuatnya berdiri dalam pertempuran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Engkau menumpulkan mata pedangnya.” Secara harfiah, teks Ibrani menyatakan bahwa Engkau memalingkan mata pedangnya, dengan arti bahwa pedang itu dibuat tidak efektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “Engkau tidak menopang dia dalam pertempuran” atau “Engkau tidak memampukan dia bertahan dalam pertempuran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Bahkan
  rationale: Partikel ini menambah sekaligus menegaskan tuduhan dalam rangkaian ratapan. “Bahkan” mempertahankan daya emfatisnya secara alami dalam bahasa Indonesia.
- source_word: תָּשִׁיב
  choice: Engkau membuat ... berbalik
  rationale: Bentuk hifil dari שׁוב berarti menyebabkan sesuatu berbalik atau kembali. Ungkapan ini mempertahankan gambaran konkret dalam teks Ibrani, sementara catatan kaki menjelaskan akibatnya, yaitu pedang menjadi tidak efektif.
- source_word: צוּר חַרְבּוֹ
  choice: mata pedangnya
  rationale: Dalam konstruksi ini, צוּר menunjuk pada sisi tajam atau mata pedang, bukan arti umumnya “batu cadas”. “Mata pedangnya” merupakan ungkapan Indonesia yang jelas dan idiomatis.
- source_word: הֲקֵימֹתוֹ
  choice: membuat dia berdiri teguh
  rationale: Bentuk hifil dari קום menyatakan menyebabkan seseorang berdiri, menegakkan, atau membuatnya tetap bertahan. “Berdiri teguh” menjaga gambaran konkret tentang kemampuan sang raja mempertahankan kedudukannya dalam pertempuran.
- source_word: בַּמִּלְחָמָה
  choice: dalam pertempuran
  rationale: Ungkapan ini secara alami menyatakan konteks pertempuran militer dalam bahasa Indonesia.
theological_decisions:
- issue: Allah digambarkan bertindak melawan raja keturunan Daud
  choice: 'Mempertahankan sapaan langsung kepada Allah: “Engkau membuat ... dan tidak membuat ...”'
  alternative: Menggunakan bentuk pasif atau impersonal untuk mengurangi kesan tindakan langsung Allah
  rationale: Ratapan ini secara eksplisit menghubungkan kekalahan militer sang raja dengan tindakan Allah. Ketegangan teologis tersebut dipertahankan dan tidak diperhalus.
