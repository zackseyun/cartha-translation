  text: כִּ֤י מִ֣י בַ֭/שַּׁחַק יַעֲרֹ֣ךְ לַ/יהוָ֑ה יִדְמֶ֥ה לַ֝/יהוָ֗ה בִּ/בְנֵ֥י אֵלִים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/006.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
translation:
  language: id
  text: Sebab, siapakah di langit yang dapat dibandingkan dengan TUHAN? Siapakah di antara anak-anak Allah yang seperti TUHAN?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara makhluk-makhluk surgawi,” “di antara makhluk-makhluk ilahi,” atau “di antara anak-anak para perkasa.” Ungkapan Ibraninya secara harfiah berbunyi “di antara anak-anak Allah/para allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi pujian sebelumnya dan mengalir wajar ke dalam pertanyaan retoris.
- source_word: מִי
  choice: siapakah
  rationale: Bentuk tanya ini sesuai dengan gaya retoris yang bermartabat dalam bahasa Indonesia.
- source_word: בַשַּׁחַק
  choice: di langit
  rationale: שׁחק dapat berarti langit, cakrawala, atau awan; 'di langit' alami dan mempertahankan latar surgawi tanpa mempersempitnya menjadi awan.
- source_word: יַעֲרֹךְ
  choice: dapat dibandingkan dengan
  rationale: Dalam konteks ini ערך menyatakan tindakan menempatkan sesuatu berdampingan untuk diperbandingkan; terjemahan ini menyampaikan daya retorisnya dengan jelas.
- source_word: לַיהוָה
  choice: dengan TUHAN
  rationale: Nama ilahi יהוה diterjemahkan 'TUHAN' sesuai tradisi penerjemahan Indonesia; preposisi disesuaikan secara idiomatis dengan verba 'dibandingkan'.
- source_word: יִדְמֶה
  choice: yang seperti
  rationale: דמה menyatakan keserupaan atau kemiripan; ungkapan ini alami sekaligus mempertahankan kesejajaran dengan baris pertama.
- source_word: בִּבְנֵי אֵלִים
  choice: di antara anak-anak Allah
  rationale: Terjemahan ini mempertahankan citra harfiah ungkapan Ibrani dan tidak meniadakan kemungkinan bahwa yang dimaksud ialah makhluk-makhluk surgawi.
theological_decisions:
- issue: Penerjemahan יהוה
  choice: TUHAN
  alternative: Yahweh; Yehovah
  rationale: Mengikuti kebiasaan luas Alkitab bahasa Indonesia untuk membedakan nama perjanjian ilahi dengan huruf kapital, tanpa memasukkan pelafalan rekonstruktif ke dalam teks utama.
- issue: Penafsiran בִּבְנֵי אֵלִים
  choice: anak-anak Allah
  alternative: makhluk-makhluk surgawi; makhluk-makhluk ilahi; anak-anak para perkasa
  rationale: Pilihan utama dekat dengan bentuk Ibrani dan mempertahankan citra serta ketegangan teologisnya; berbagai pemaknaan yang sah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'siapakah' mempertahankan nada puitis-retoris, sedangkan susunan dua pertanyaan menjaga paralelisme Ibrani.
