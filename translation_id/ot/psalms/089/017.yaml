  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: id
  text: Sebab Engkaulah kemuliaan[a] kekuatan mereka, dan oleh perkenanan-Mu Engkau meninggikan tanduk kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keindahan kekuatan mereka” atau “semarak kekuatan mereka.”
    reason: lexical_alternative
  - marker: b
    text: “Tanduk” adalah metafora Ibrani untuk kekuatan, kuasa, kehormatan, atau kedudukan yang ditinggikan.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Partikel ini memperkenalkan dasar bagi pernyataan sebelumnya; 'Sebab' alami dalam alur penjelasan mazmur.
- source_word: תִפְאֶרֶת
  choice: kemuliaan
  rationale: Kata ini dapat berarti keindahan, semarak, atau kemuliaan. 'Kemuliaan' mempertahankan gagasan bahwa Allah adalah kehormatan dan kebanggaan kekuatan umat.
- source_word: עֻזָּמוֹ
  choice: kekuatan mereka
  rationale: Nomina berarti kekuatan atau keperkasaan, dengan sufiks orang ketiga jamak. Bentuk jamak dipertahankan dan tidak diselaraskan dengan 'kami' pada klausa berikutnya.
- source_word: אָתָּה
  choice: Engkaulah
  rationale: Pronomina mandiri ini bersifat menegaskan; partikel '-lah' menyampaikan penekanan tersebut secara wajar dan bermartabat.
- source_word: וּבִרְצֹנְךָ
  choice: dan karena perkenanan-Mu
  rationale: רָצוֹן menunjuk pada perkenanan, kerelaan baik, atau penerimaan Allah. 'Karena' menyampaikan bahwa tindakan meninggikan itu terjadi berkat perkenanan-Nya.
- source_word: תרים
  choice: Engkau meninggikan
  rationale: Bentuk Hifil dari רוּם berarti mengangkat atau meninggikan. 'Meninggikan' sesuai dengan laras puitis dan mempertahankan hubungan dengan metafora tanduk.
- source_word: קַרְנֵנוּ
  choice: tanduk kami
  rationale: Terjemahan harfiah mempertahankan citra puisi Ibrani; makna metaforisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna metaforis 'tanduk'
  choice: Mempertahankan 'tanduk kami' dalam teks utama.
  alternative: kekuatan kami; kuasa kami; kehormatan kami
  rationale: Citra Ibrani yang hidup dipertahankan tanpa membatasi maknanya pada satu penafsiran; catatan menjelaskan rentang maknanya.
- issue: Peralihan rujukan antara 'mereka' dan 'kami'
  choice: 'Mempertahankan peralihan asli: ''kekuatan mereka'' ... ''tanduk kami''.'
  alternative: Menyelaraskan keduanya menjadi 'kami'.
  rationale: Teks Ibrani benar-benar beralih dari orang ketiga jamak ke orang pertama jamak. Penyelarasan akan menghapus ketegangan tekstual yang asli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
