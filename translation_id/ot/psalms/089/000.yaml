translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Istilah teknis Ibrani dipertahankan dengan penjelasan, sedangkan sebutan nisbah diterjemahkan secara alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
