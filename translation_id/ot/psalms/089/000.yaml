lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: nyanyian Maskil
  rationale: Istilah ini merupakan label sastra atau musik Ibrani yang makna tepatnya tidak pasti. Transliterasi “Maskil” mempertahankan istilah aslinya, sedangkan “nyanyian” membuat judul ini wajar dan mudah dipahami dalam bahasa Indonesia tanpa menetapkan arti yang diperdebatkan.
- source_word: לְ
  choice: karya
  rationale: Dalam judul mazmur, לְ menandai hubungan atau atribusi yang dapat mencakup kepengarangan, kepemilikan, persembahan, atau keterkaitan. “Karya” merupakan bentuk judul yang alami, tetapi tidak dimaksudkan untuk menutup seluruh kemungkinan hubungan tersebut.
- source_word: אֵיתָן
  choice: Etan
  rationale: Nama Ibrani ini dialihaksarakan menurut bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: הָאֶזְרָחִי
  choice: orang Ezrahi
  rationale: Bentuk Ibrani ini menunjukkan sebutan asal-usul atau kelompok. “Orang Ezrahi” mengikuti bentuk teks Masoret, sementara kemungkinan kaitannya dengan Zerah dipertahankan dalam catatan kaki.
