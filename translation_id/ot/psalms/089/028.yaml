source:
  edition: WLC
  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/028.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: id
  text: Untuk selama-lamanya Aku akan memelihara kasih setia-Ku baginya, dan perjanjian-Ku akan tetap teguh baginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perjanjian-Ku akan tetap setia kepadanya”; atau: “perjanjian-Ku akan terjamin baginya.”'
    reason: Alternatif leksikal untuk נֶאֱמֶנֶת dan relasi yang dinyatakan oleh לוֹ.
lexical_decisions:
- source_word: לְעוֹלָם
  choice: Untuk selama-lamanya
  rationale: Ungkapan ini menyatakan durasi yang terus berlangsung. Pilihan ini alami dalam bahasa Indonesia dan menegaskan kekalnya komitmen perjanjian.
- source_word: אֶשְׁמֹר
  choice: Aku akan memelihara
  rationale: Dalam konteks perjanjian, שׁמר menyampaikan tindakan menjaga dan mempertahankan. 'Memelihara' terdengar alami bersama 'kasih setia' dan menunjukkan tindakan aktif yang berkelanjutan.
- source_word: לוֹ
  choice: baginya
  rationale: Preposisi ל di sini menyatakan hubungan atau manfaat. 'Baginya' sesuai dalam kedua klausa tanpa membatasinya menjadi sekadar objek tidak langsung.
- source_word: חַסְדִּי
  choice: kasih setia-Ku
  rationale: חסד memadukan kasih, kesetiaan, dan komitmen dalam hubungan perjanjian. 'Kasih setia' merupakan padanan Indonesia yang ringkas, wajar, dan kaya makna.
- source_word: וּבְרִיתִי
  choice: dan perjanjian-Ku
  rationale: בְּרִית adalah istilah baku bagi ikatan perjanjian, khususnya janji Allah kepada Daud dan keturunannya.
- source_word: נֶאֱמֶנֶת
  choice: akan tetap teguh
  rationale: Partisipel Nifal dari אמן menyatakan sesuatu yang kukuh, dapat diandalkan, atau pasti. 'Akan tetap teguh' mempertahankan unsur keteguhan dan keberlanjutan secara alami.
theological_decisions:
- issue: Bahasa perjanjian tanpa memperinci penggenapan mesianis
  choice: Ayat diterjemahkan sebagai janji langsung Allah kepada tokoh yang disebut 'dia', tanpa menambahkan sebutan mesianis.
  alternative: Memasukkan penggenapan mesianis secara eksplisit ke dalam teks utama.
  rationale: Dalam konteks langsungnya, Mazmur 89 berbicara tentang perjanjian Allah dengan Daud dan garis keturunannya. Teks Ibrani hanya memakai לוֹ, 'baginya/kepadanya'; karena itu, perkembangan makna kanonis tidak dimasukkan ke dalam redaksi ayat.
- issue: Nuansa נֶאֱמֶנֶת pada perjanjian
  choice: akan tetap teguh baginya
  alternative: akan tetap setia kepadanya; akan terjamin baginya
  rationale: Bentuk feminin נֶאֱמֶנֶת menerangkan 'perjanjian-Ku' dan dapat menonjolkan keteguhan, keterandalan, atau kesetiaan. Teks utama memakai 'tetap teguh', sedangkan catatan kaki mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan klausa dipertahankan dekat dengan teks Ibrani, tetapi tetap alami bagi pembaca umum.
