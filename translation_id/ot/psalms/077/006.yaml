  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: id
  text: Aku mengingat nyanyianku pada malam hari[a]; aku merenung dalam hatiku[b], dan batinku menyelidiki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melodiku” atau “musikku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bersama hatiku aku merenung.” Kata Ibrani yang dipakai dapat berarti merenung atau berbicara dalam perenungan.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “rohku menyelidiki.” Yang dimaksud ialah diri batin pemazmur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Aku mengingat
  rationale: Bentuk imperfek kohortatif 1cs dapat bernuansa kini, akan datang, atau kehendak. Dalam rangkaian perenungan ini, bentuk kini paling wajar tanpa menutup sepenuhnya nuansa tindakan yang disengaja.
- source_word: נְגִינָתִי
  choice: nyanyianku
  rationale: נְגִינָה dapat menunjuk pada nyanyian, melodi, atau musik. 'Nyanyianku' alami dalam konteks puitis dan mempertahankan unsur kepunyaan.
- source_word: בַּלָּיְלָה
  choice: pada malam hari
  rationale: Ungkapan ini menyampaikan latar waktu secara alami dan tetap mempertahankan suasana puitis Ibrani.
- source_word: עִם לְבָבִי אָשִׂיחָה
  choice: aku merenung dalam hatiku
  rationale: Secara harfiah עִם berarti 'dengan', tetapi gabungan ini menggambarkan perenungan batin. 'Dalam hatiku' lebih alami dalam bahasa Indonesia, sedangkan שׂיח tetap dipertahankan sebagai tindakan merenung yang dapat juga mencakup berbicara kepada diri sendiri.
- source_word: וַיְחַפֵּשׂ
  choice: terus menyelidiki
  rationale: חפשׂ menyatakan pencarian atau pemeriksaan yang sungguh-sungguh. 'Terus' mencerminkan gerak perenungan yang berlanjut dalam urutan puitis tanpa menjadikan intensitas itu berlebihan.
- source_word: רוּחִי
  choice: batinku
  rationale: רוּחַ di sini menunjuk pada diri batin pemazmur, bukan angin atau napas. 'Batinku' terdengar alami dan tidak membatasi maknanya hanya pada kemampuan berpikir.
theological_decisions:
- issue: Makna antropologis רוּחִי
  choice: batinku
  alternative: rohku
  rationale: Konteksnya adalah kegiatan reflektif dalam diri pemazmur. 'Batinku' menghindari kesan bahwa yang dimaksud harus merupakan entitas terpisah, namun catatan kaki mempertahankan padanan formal 'rohku'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang sederhana dan bermartabat. Susunan klausa mempertahankan gerak dari mengingat, merenung, lalu menyelidiki. Semua penanda catatan kaki dicantumkan dalam teks utama.
