  text: רָ֘א֤וּ/ךָ מַּ֨יִם אֱֽלֹהִ֗ים רָא֣וּ/ךָ מַּ֣יִם יָחִ֑ילוּ אַ֝֗ף יִרְגְּז֥וּ תְהֹמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: id
  text: 'Air melihat Engkau, ya Allah;

    air melihat Engkau dan menggeliat[a];

    bahkan kedalaman laut pun gemetar[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meronta dalam kesakitan,” “berpilin,” atau “gemetar.” Kata kerja Ibrani ini dapat menggambarkan guncangan kejang atau geliat seperti kesakitan saat bersalin.
    reason: lexical_alternative
  - marker: b
    text: Atau “kedalaman-kedalaman” atau “air yang dalam.” Kata Ibrani ini menunjuk pada air samudra yang dalam atau kedalaman laut.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: melihat Engkau
  rationale: Bentuk Qal perfektum dari ראה dengan sufiks orang kedua maskulin tunggal secara langsung berarti 'melihat Engkau'. Pengulangannya dipertahankan sebagai penegasan puitis.
- source_word: מַיִם
  choice: air
  rationale: Kata Ibrani berbentuk jamak ini secara idiomatis diterjemahkan 'air' dalam bahasa Indonesia. Pengulangan dipertahankan untuk mencerminkan paralelisme Ibrani.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan. Partikel 'ya' menyatakan vokatif secara alami dan bermartabat dalam puisi Indonesia.
- source_word: יָחִילוּ
  choice: menggeliat
  rationale: Verba dari חול/חיל dapat menggambarkan gerakan kejang, gemetar, atau geliat seperti kesakitan saat bersalin. 'Menggeliat' mempertahankan gambaran jasmani yang kuat dan membedakannya dari verba gemetar pada klausa berikutnya.
- source_word: אַף
  choice: bahkan
  rationale: 'Di sini kata tersebut menguatkan perkembangan gambaran: bukan hanya air, bahkan samudra raya pun bereaksi.'
- source_word: יִרְגְּזוּ
  choice: gemetar
  rationale: רגז lazim menyatakan gemetar atau berguncang. 'Gemetar' jelas dan alami dalam bahasa Indonesia serta tetap berbeda dari 'menggeliat'.
- source_word: תְהֹמוֹת
  choice: samudra raya
  rationale: Bentuk jamak תהום menunjuk pada air kedalaman atau kedalaman samudra. 'Samudra raya' mempertahankan citra perairan purba yang luas tanpa memakai istilah teknis atau kurang alami.
theological_decisions:
- issue: Personifikasi air kosmis di hadapan Allah
  choice: Mempertahankan gambaran puitis bahwa air dan samudra raya bereaksi terhadap kehadiran Allah.
  alternative: Membatasi ayat ini sebagai rujukan langsung hanya kepada penyeberangan Laut Merah, atau menafsirkannya secara eksplisit sebagai pertarungan melawan kuasa laut mitologis.
  rationale: Teks menggambarkan ciptaan yang gentar di hadapan Allah, tetapi tidak menjelaskan seluruh latar atau cakupan rujukannya. Terjemahan mempertahankan personifikasi dan ketegangan puitis tanpa memasukkan penafsiran tertentu ke dalam teks.
translation_notes:
  register: Bahasa Indonesia standar modern dengan larik puitis yang ringkas dan bermartabat. Sapaan 'ya Allah' serta pengulangan 'air melihat Engkau' mempertahankan struktur dan tekanan puisi Ibrani. Semua penanda catatan kaki ditempatkan dalam teks utama.
