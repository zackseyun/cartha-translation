id: PSA.77.14
reference: Psalms 77:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: id
  text: Engkaulah Allah yang melakukan keajaiban; Engkau telah menyatakan kekuatan-Mu di antara bangsa-bangsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara suku-suku bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Allah
  rationale: Dengan kata sandang, ungkapan ini secara tegas mengidentifikasi Allah yang disapa pemazmur. Dalam bahasa Indonesia, konstruksi alami “Engkaulah Allah” mempertahankan penekanan itu tanpa bentuk “Allah itu” yang kurang wajar di sini.
- source_word: עֹשֵׂה
  choice: yang melakukan
  rationale: Partisipel ini menggambarkan tindakan yang menjadi ciri khas Allah. “Yang melakukan” alami dan tetap dekat dengan makna dasar verba.
- source_word: פֶלֶא
  choice: keajaiban
  rationale: Nomina tunggal dapat merujuk secara kolektif kepada tindakan-tindakan luar biasa. “Keajaiban” mempertahankan bentuk tunggal kolektif dan tidak mempersempitnya menjadi istilah teknis “mukjizat”.
- source_word: הוֹדַעְתָּ
  choice: Engkau telah menyatakan
  rationale: Bentuk Hifil dari ידע berarti menyebabkan diketahui atau membuat nyata. “Telah menyatakan” mengungkapkan daya kausatif sekaligus cocok dengan perenungan pemazmur atas karya Allah pada masa lampau.
- source_word: בָעַמִּים
  choice: di antara bangsa-bangsa
  rationale: Preposisi ב paling alami diterjemahkan “di antara” dalam konteks ini, sedangkan עַמִּים dapat berarti kelompok-kelompok bangsa atau bangsa-bangsa. Pilihan ini menyampaikan lingkup jamak yang luas.
- source_word: עֻזֶּךָ
  choice: kekuatan-Mu
  rationale: עֹז menunjuk pada kekuatan, keperkasaan, atau kuasa. “Kekuatan-Mu” merupakan padanan langsung dan alami dalam konteks tindakan Allah yang menakjubkan.
theological_decisions:
- issue: Lingkup penyataan kekuatan Allah dalam בָעַמִּים
  choice: di antara bangsa-bangsa
  alternative: di antara suku-suku bangsa; kepada bangsa-bangsa
  rationale: Terjemahan ini mempertahankan preposisi Ibrani dan cakupan jamak yang luas tanpa menentukan bahwa frasa tersebut hanya berarti penerima pewahyuan atau memasukkan program teologis yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pembalikan “Engkaulah Allah” mempertahankan penekanan Ibrani; kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia.
