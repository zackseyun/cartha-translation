  source_fidelity: 'Teks mempertahankan unsur-unsur utama Ibrani: bunyi/suara guruh Allah, lokasinya dalam fenomena yang berputar, kilat yang menerangi dunia, serta dua verba berbeda bagi respons bumi (gemetar dan berguncang). Penambahan "terdengar" diperlukan agar klausa nominal Ibrani menjadi kalimat Indonesia yang utuh dan tidak mengubah gambaran dasarnya.'
