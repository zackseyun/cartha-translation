  text: ק֤וֹל רַעַמְ/ךָ֨ בַּ/גַּלְגַּ֗ל הֵאִ֣ירוּ בְרָקִ֣ים תֵּבֵ֑ל רָגְזָ֖ה וַ/תִּרְעַ֣שׁ הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/018.yaml
  text: The sound of your thunder was in the whirlwind[a]; lightning lit up the world; the earth trembled and quaked.
translation:
  language: id
  text: Bunyi guruh-Mu terdengar dalam pusaran badai[a]; kilat menerangi dunia; bumi gemetar dan berguncang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam roda”; kata Ibrani ini kemungkinan menggambarkan badai yang berpusar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רַעַמְךָ
  choice: Bunyi guruh-Mu
  rationale: קוֹל dapat berarti bunyi atau suara; bersama רַעַם, ungkapan alami dalam bahasa Indonesia ialah “bunyi guruh”. Sufiks orang kedua tunggal dipertahankan sebagai “-Mu” karena mazmur menyapa Allah secara langsung.
- source_word: בַּגַּלְגַּל
  choice: dalam pusaran badai
  rationale: גַּלְגַּל secara harfiah berkaitan dengan roda atau sesuatu yang berputar. Dalam konteks guruh dan kilat, frasa ini kemungkinan menggambarkan badai yang berpusar; “pusaran badai” mempertahankan gerak berputar tanpa menghilangkan konteks meteorologis.
- source_word: הֵאִירוּ בְרָקִים
  choice: kilat menerangi
  rationale: Bentuk kausatif הֵאִירוּ berarti memberi terang atau menerangi. Walaupun בְרָקִים berbentuk jamak, “kilat” lazim dipakai sebagai nomina kolektif dalam bahasa Indonesia.
- source_word: תֵּבֵל
  choice: dunia
  rationale: תֵּבֵל menunjuk pada dunia atau bumi yang dihuni; “dunia” merupakan padanan ringkas dan alami dalam konteks kosmis ini.
- source_word: רָגְזָה
  choice: gemetar
  rationale: Kata kerja ini menyatakan kegentaran atau gerak gemetar. Pilihan ini mempertahankan perbedaannya dari kata kerja berikutnya.
- source_word: וַתִּרְעַשׁ
  choice: dan berguncang
  rationale: רעש berarti berguncang atau bergetar hebat. “Berguncang” menjaga intensifikasi puitis bersama “gemetar” tanpa melebur kedua verba Ibrani.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam gambaran penampakan ilahi yang bersifat kosmis, הָאָרֶץ lebih tepat dipahami sebagai seluruh bumi daripada suatu wilayah tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan tiga klausa dipertahankan, demikian pula intensifikasi “gemetar dan berguncang”. Kapitalisasi “-Mu” mengikuti kebiasaan penulisan rujukan kepada Allah dalam terjemahan Alkitab bahasa Indonesia.
