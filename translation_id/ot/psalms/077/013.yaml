  text: אֱ֭לֹהִים בַּ/קֹּ֣דֶשׁ דַּרְכֶּ֑/ךָ מִי אֵ֥ל גָּ֝ד֗וֹל כֵּֽ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/013.yaml
  text: God[a], your way is in holiness; who is a great god like God?
translation:
  language: id
  text: Ya Allah, jalan-Mu kudus[a]; allah manakah yang besar seperti Allah?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tempat kudus.” Frasa Ibrani ini dapat menunjuk pada kekudusan sebagai sifat atau ranah Allah, ataupun pada tempat kudus.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Dipahami sebagai sapaan langsung karena frasa berikutnya memakai akhiran orang kedua, 'jalan-Mu'; partikel 'Ya' menyatakan bentuk vokatif secara alami dalam bahasa Indonesia.
- source_word: בַּקֹּדֶשׁ
  choice: dalam kekudusan
  rationale: קֹדֶשׁ dapat menunjuk pada kekudusan sebagai sifat atau ranah, maupun pada tempat kudus. Teks utama mempertahankan penekanan pada kekudusan Allah, sedangkan kemungkinan lokatif dicatat dalam catatan kaki.
- source_word: דַּרְכֶּךָ
  choice: jalan-Mu
  rationale: '''Jalan'' mempertahankan metafora Ibrani dan dapat mencakup cara Allah bertindak maupun arah tindakan-Nya.'
- source_word: מִי
  choice: manakah
  rationale: Dalam pertanyaan perbandingan mengenai suatu allah, 'allah manakah' terdengar alami dan mempertahankan daya retoris מִי.
- source_word: אֵל
  choice: allah
  rationale: Dipakai sebagai nomina umum untuk menyatakan perbandingan dengan ilah mana pun; huruf kecil membedakannya dari sebutan bagi Allah yang benar.
- source_word: גָּדוֹל
  choice: besar
  rationale: Padanan langsung yang sesuai dengan pujian retoris terhadap kebesaran Allah.
- source_word: כֵּאלֹהִים
  choice: seperti Allah
  rationale: Prefiks כ־ menyatakan perbandingan, sedangkan אֱלֹהִים dalam konteks ini menunjuk kepada Allah yang benar.
theological_decisions:
- issue: Makna בַּקֹּדֶשׁ
  choice: Jalan Allah berada dalam atau bercirikan kekudusan
  alternative: Jalan Allah berada di tempat kudus
  rationale: Bahasa Ibrani memungkinkan makna abstrak dan makna lokatif-kultis. Teks utama memakai 'dalam kekudusan' tanpa meniadakan pembacaan 'di tempat kudus', yang dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk 'jalan-Mu' mempertahankan citra sumber; 'allah' dengan huruf kecil berfungsi sebagai nomina umum, sedangkan 'Allah' menunjuk kepada Allah yang benar.
