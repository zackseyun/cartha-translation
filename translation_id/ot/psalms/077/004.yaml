  text: You have held my eyelids open[b][a]; I am troubled and cannot speak.
translation:
  language: id
  text: Engkau menahan kelopak mataku agar tetap terbuka[a]; aku gelisah[b] dan tidak dapat berbicara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Engkau menahan penjagaan-penjagaan mataku.” Ungkapan Ibrani ini kemungkinan berarti bahwa Allah membuat mata pemazmur tetap terbuka sehingga ia tidak dapat tidur.
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku terguncang” atau “aku terusik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחַזְתָּ
  choice: Engkau menahan
  rationale: Bentuk qal perfek orang kedua tunggal maskulin yang ditujukan kepada Allah. 'Menahan' mempertahankan peran aktif Allah dan menyatu secara alami dengan ungkapan tentang mata yang tidak dapat terpejam.
- source_word: שְׁמֻרוֹת עֵינָי
  choice: kelopak mataku tetap terbuka
  rationale: Secara harfiah ungkapan ini berkaitan dengan 'penjagaan-penjagaan mataku', tetapi idiomnya kemungkinan menunjuk pada kelopak mata atau keadaan mata yang terus berjaga. Pilihan ini menyampaikan bahwa pemazmur tidak dibiarkan tidur, sambil mencatat bentuk harfiahnya dalam catatan kaki.
- source_word: נִפְעַמְתִּי
  choice: aku gelisah
  rationale: Bentuk nifal orang pertama tunggal dari פעם menyatakan keguncangan atau keresahan batin. 'Gelisah' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi takut, terkejut, atau bingung saja.
- source_word: וְלֹא אֲדַבֵּר
  choice: dan tidak dapat berbicara
  rationale: Secara bentuk berarti 'dan aku tidak berbicara', tetapi dalam konteks keresahan yang melumpuhkan, frasa ini kemungkinan menyatakan ketidakmampuan berbicara. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih formal.
theological_decisions:
- issue: Peran Allah dalam keadaan tidak tidur yang dialami pemazmur
  choice: Mempertahankan sapaan langsung 'Engkau' dan tindakan aktif 'menahan'
  alternative: Mengaburkan pelaku dengan ungkapan pasif seperti 'mataku tetap terbuka'
  rationale: Teks Ibrani secara eksplisit memakai verba orang kedua tunggal; terjemahan tidak boleh menghapus ketegangan bahwa pemazmur memandang Allah sebagai pelaku dalam kesusahannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Kelopak mataku tetap terbuka' mengungkapkan idiom Ibrani secara wajar, sedangkan 'gelisah' mempertahankan cakupan emosi tanpa menafsirkannya terlalu sempit.
