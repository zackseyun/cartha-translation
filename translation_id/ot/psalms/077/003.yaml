translation:
  language: id
  text: Aku mengingat Allah dan mengerang; aku merenung[a], dan rohku melemah[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku mengeluh.” Kata Ibrani ini dapat menunjuk pada perenungan atau pada keluhan yang diucapkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “rohku menjadi lemah” atau “rohku kewalahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Aku mengingat
  rationale: Bentuk Qal orang pertama tunggal ini dapat bernuansa kini, mendatang, atau kehendak. Dalam ratapan ini, bentuk kini menggambarkan tindakan pemazmur yang sedang berlangsung tanpa meniadakan nuansa lainnya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini kata tersebut menunjuk kepada Allah Israel; bentuk tunggal “Allah” menyampaikan acuannya secara wajar dalam bahasa Indonesia.
- source_word: וְאֶהֱמָיָה
  choice: dan mengerang
  rationale: Kata kerja המה menggambarkan kegelisahan yang terdengar atau suara ratapan. “Mengerang” sesuai dengan suasana kesesakan dalam mazmur ini.
- source_word: אָשִׂיחָה
  choice: aku merenung
  rationale: שיח dalam puisi ratapan dapat berarti merenung, berbicara dalam hati, atau menyampaikan keluhan. “Merenung” alami dalam bahasa Indonesia dan mempertahankan makna reflektifnya; kemungkinan makna keluhan dicatat dalam catatan kaki.
- source_word: וְתִתְעַטֵּף
  choice: menjadi lesu
  rationale: Bentuk Hitpael dari עטף dapat menyatakan menjadi lemah atau kewalahan. “Menjadi lesu” dengan jelas menggambarkan merosotnya kekuatan batin tanpa menghapus kemungkinan makna kewalahan.
- source_word: רוּחִי
  choice: rohku
  rationale: רוּחַ dapat berarti angin, napas, atau roh. Dalam ratapan introspektif ini, “rohku” menunjuk pada kehidupan batin pemazmur dan tetap dekat dengan istilah sumber.
- source_word: סֶלָה
  choice: Sela
  rationale: Arti atau fungsi tepat istilah ini tidak pasti, sehingga ditransliterasikan alih-alih diterjemahkan secara spekulatif.
