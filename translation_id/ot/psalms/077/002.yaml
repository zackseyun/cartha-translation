  text: בְּ/י֥וֹם צָרָתִ/י֮ אֲדֹנָ֪/י דָּ֫רָ֥שְׁתִּי יָדִ֤/י לַ֣יְלָה נִ֭גְּרָה וְ/לֹ֣א תָפ֑וּג מֵאֲנָ֖ה הִנָּחֵ֣ם נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/002.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
translation:
  language: id
  text: Pada hari kesesakanku, aku mencari Tuhan; pada malam hari tanganku terulur dan tidak mengendur[a]; jiwaku menolak dihibur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada malam hari tanganku mengalir dan tidak mengendur.” Gambaran dalam bahasa Ibrani sulit dipastikan; teks utama memahaminya sebagai tangan yang terus terulur dalam doa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: Pada hari kesesakanku
  rationale: Ungkapan waktu Ibrani dipertahankan dalam bentuk puitis yang tetap wajar dalam bahasa Indonesia; צָרָה menyatakan kesesakan atau keadaan tertekan.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Bentuk ini adalah gelar אֲדֹנָי, bukan nama ilahi YHWH; 'Tuhan' merupakan padanan gelar yang alami dalam bahasa Indonesia.
- source_word: דָּרָשְׁתִּי
  choice: aku mencari
  rationale: Dalam hubungan dengan Allah, דרשׁ lazim berarti mencari atau berpaling kepada-Nya; pilihan ini ringkas dan sesuai dengan konteks ratapan.
- source_word: יָדִי
  choice: tanganku
  rationale: Bentuk Ibraninya tunggal dan dipertahankan demikian.
- source_word: לַיְלָה
  choice: sepanjang malam
  rationale: Keterangan waktu ini menunjukkan tindakan yang berlangsung pada malam hari; 'sepanjang malam' menyampaikan kegigihan yang tersirat oleh klausa berikutnya.
- source_word: נִגְּרָה
  choice: tetap terulur
  rationale: Secara leksikal verba ini berkaitan dengan mengalir atau tercurah, tetapi bersama 'tanganku' kemungkinan menggambarkan tangan yang diulurkan terus-menerus dalam doa. Kesulitan metaforanya dicatat dalam catatan kaki.
- source_word: וְלֹא תָפוּג
  choice: dan tidak mengendur
  rationale: פוג dapat berarti menjadi lemah, mengendur, atau berhenti. Dengan 'tangan' sebagai subjek, 'tidak mengendur' mempertahankan gambaran ketekunan fisik tanpa menambahkan gagasan yang tidak pasti seperti mati rasa.
- source_word: מֵאֲנָה הִנָּחֵם
  choice: menolak dihibur
  rationale: מאן menyatakan penolakan, sedangkan bentuk Niphal dari נחם berarti menerima penghiburan; terjemahan ini langsung dan alami.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפשׁ dapat menunjuk diri atau batin seseorang. 'Jiwaku' mempertahankan gaya puitis dan kedalaman penderitaan pribadi dalam ratapan ini.
theological_decisions:
- issue: Penerjemahan אֲדֹנָי
  choice: Tuhan
  alternative: Tuanku
  rationale: Kata ini merupakan gelar ilahi, bukan Tetragramaton. 'Tuhan' menerjemahkan gelarnya secara wajar tanpa memperlakukannya sebagai nama YHWH.
- issue: Gambaran tangan yang terulur
  choice: Dipahami sebagai tindakan doa yang berlangsung terus-menerus
  alternative: Tangan secara harfiah 'mengalir' atau 'tercurah' sepanjang malam
  rationale: Gabungan יָדִי dengan נִגְּרָה tidak biasa dan tetap sulit. Teks utama memakai makna kontekstual yang paling masuk akal, sedangkan kemungkinan gambaran harfiahnya dipertahankan dalam catatan kaki agar ketidakpastian sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Struktur tiga klausa dipertahankan, pronomina 'aku/jiwaku' digunakan agar alami dalam puisi ratapan, dan ambiguitas ungkapan mengenai tangan dijelaskan tanpa dibakukan menjadi tafsiran denominasi tertentu.
