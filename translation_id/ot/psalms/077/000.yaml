base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/000.yaml
  text: 'For the choir director: according to Jeduthun[d][c][b][a]. A psalm of Asaph.'
translation:
  language: id
  text: 'Untuk pemimpin musik[a]: menurut Yedutun[b]. Mazmur Asaf.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk pemimpin pujian.”
    reason: lexical_alternative
  - marker: b
    text: “Menurut Yedutun” mungkin menunjuk pada gaya atau lagu tertentu, kelompok musik, atau perkumpulan yang terkait dengan Yedutun.
    reason: cultural_note
  - marker: c
    text: Atau “Mazmur untuk Asaf.” Kata depan Ibrani dapat menunjukkan kepengarangan, hubungan, kepemilikan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, bentuk ini menunjuk kepada orang yang memimpin atau mengawasi penyajian musik. Ungkapan ini alami dalam bahasa Indonesia modern tanpa membatasi tugasnya hanya pada paduan suara.
- source_word: עַל
  choice: menurut
  rationale: Dalam konteks petunjuk musik, עַל dapat memperkenalkan cara, lagu, kelompok, atau ketentuan penyajian; “menurut” mempertahankan sifat rujukan itu tanpa menetapkan salah satunya.
- source_word: יְדוּתוּן
  choice: Yedutun
  rationale: Nama diri Ibrani ditransliterasikan sesuai ejaan Indonesia.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Dalam konstruksi “Mazmur Asaf”, לְ dapat menyatakan kepengarangan, hubungan, peruntukan, atau kepemilikan; bentuk ringkas ini tidak secara tegas menyelesaikan ambiguitas tersebut.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku bahasa Indonesia untuk jenis nyanyian yang ditandai oleh kata Ibrani ini.
theological_decisions:
- issue: Hubungan Asaf dengan mazmur
  choice: Mazmur Asaf
  alternative: Mazmur untuk Asaf
  rationale: Preposisi לְ tidak memastikan apakah Asaf adalah pengarang, penerima, atau pihak yang terkait. Frasa Indonesia yang lazim ini mempertahankan keluasan hubungan tersebut, dengan penjelasan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat untuk sebuah judul mazmur. “Pemimpin pujian” dipilih sebagai istilah fungsional yang mudah dipahami; ambiguitas petunjuk musik dan hubungan dengan Asaf dipertahankan melalui catatan.
