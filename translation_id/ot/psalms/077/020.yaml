  text: You led your people like a flock by the hand of Moses and Aaron[a][b].
translation:
  language: id
  text: Engkau menuntun umat-Mu seperti kawanan domba dengan perantaraan Musa dan Harun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan tangan Musa dan Harun”; ini adalah ungkapan Ibrani yang berarti melalui perantaraan atau kepemimpinan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחִיתָ
  choice: Engkau menuntun
  rationale: Bentuk orang kedua tunggal menyapa Allah secara langsung dan berarti memimpin atau menuntun. “Menuntun” terdengar alami serta selaras dengan gambaran penggembalaan.
- source_word: כַצֹּאן
  choice: seperti kawanan domba
  rationale: Awalan כ menyatakan perbandingan, sedangkan צאן merupakan nomina kolektif bagi ternak kecil, khususnya domba dan kambing. “Kawanan domba” mempertahankan gambaran pastoral kolektif dalam bahasa Indonesia yang alami.
- source_word: עַמֶּךָ
  choice: umat-Mu
  rationale: עם di sini menunjuk kepada bangsa yang menjadi milik Allah dalam konteks perjanjian. “Umat-Mu” merupakan padanan Indonesia yang wajar dan tepat.
- source_word: בְּיַד
  choice: melalui tangan
  rationale: Gabungan ב dengan יָד secara harfiah berarti “dengan/melalui tangan” dan secara idiomatis menyatakan perantaraan atau sarana. Bentuk ini mempertahankan citra Ibrani sambil tetap dapat dipahami.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa dan Harun
  rationale: Nama pribadi mengikuti bentuk baku dalam tradisi dan bahasa Indonesia.
theological_decisions:
- issue: Peranan Musa dan Harun dalam tindakan Allah menuntun umat-Nya
  choice: Allah adalah pelaku utama yang menuntun umat-Nya, sedangkan Musa dan Harun adalah perantara manusia yang dipakai-Nya.
  alternative: Allah menuntun umat itu sementara Musa dan Harun hanya disebut sebagai tokoh sejarah yang menyertai mereka.
  rationale: Kata kerja orang kedua tunggal menyapa Allah sebagai pelaku, dan frasa בְּיַד מֹשֶׁה וְאַהֲרֹן menyatakan perantaraan Musa dan Harun. Terjemahan mempertahankan tindakan ilahi sekaligus peranan manusia tanpa mengurangi salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital menurut konvensi umum bahasa Indonesia. “Kawanan domba” dipilih agar gambaran penggembalaan tetap jelas; cakupan leksikal צאן dapat pula mencakup kambing.
