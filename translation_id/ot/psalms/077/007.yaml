source:
  edition: WLC
  text: הַֽ֭/לְ/עוֹלָמִים יִזְנַ֥ח אֲדֹנָ֑/י וְ/לֹֽא יֹסִ֖יף לִ/רְצ֣וֹת עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/007.yaml
  text: Will the Lord reject forever[a], and never again show favor?
translation:
  language: id
  text: Apakah Tuhan akan menolak untuk selama-lamanya dan tidak akan berkenan lagi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan tidak lagi menunjukkan perkenanan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: untuk selama-lamanya
  rationale: Partikel tanya הַ membentuk pertanyaan retoris, sedangkan לְעוֹלָמִים menyatakan jangka waktu tanpa akhir. Ungkapan ini alami dan khidmat dalam bahasa Indonesia.
- source_word: יִזְנַח
  choice: menolak
  rationale: Kata kerja ini menyatakan tindakan menampik atau membuang dalam konteks hubungan. “Menolak” jelas, modern, dan tidak mempersempit maknanya menjadi tindakan meninggalkan secara fisik.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: אֲדֹנָי adalah gelar ilahi, bukan nama YHWH. “Tuhan” menerjemahkan gelar tersebut secara wajar dalam bahasa Indonesia.
- source_word: וְלֹא יֹסִיף ... עוֹד
  choice: dan tidak akan ... lagi
  rationale: Gabungan negasi, יֹסִיף, dan עוֹד menyatakan bahwa tindakan atau sikap itu tidak berlanjut atau tidak terjadi kembali. Susunan ini mempertahankan bentuk pertanyaan yang mencakup kedua klausa.
- source_word: לִרְצוֹת
  choice: berkenan
  rationale: Dalam konteks ini רצה dapat berarti bersikap berkenan atau menunjukkan perkenanan. “Berkenan” mempertahankan keluasan makna itu tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Adonai
  rationale: Sumber memakai gelar אֲדֹנָי, bukan nama perjanjian YHWH. Menerjemahkannya sebagai “Tuhan” menjaga pembedaan tersebut dan mengikuti pemakaian Indonesia yang alami.
- issue: Arah makna רצה tanpa objek yang dinyatakan
  choice: berkenan
  alternative: menunjukkan perkenanan
  rationale: Teks dapat menyoroti sikap Tuhan yang berkenan maupun tindakan-Nya menunjukkan perkenanan. Terjemahan utama mempertahankan ketidakjelasan gramatikal itu; catatan kaki memberi padanan relasional yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pertanyaan retoris serta kesejajaran kedua klausa dipertahankan; diksi tidak memakai ungkapan arkais yang tidak perlu.
