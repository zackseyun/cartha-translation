base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/019.yaml
  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: id
  text: Jalan-Mu melalui laut[a], lintasan-Mu melalui banyak air; tetapi jejak-Mu tidak diketahui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam laut ... di dalam banyak air.” Preposisi Ibrani dapat diterjemahkan “di/dalam”, tetapi dalam konteks ini kemungkinan menyatakan gerak melalui air.
    reason: lexical_alternative
  - marker: b
    text: Atau “tapak kaki-Mu” atau “langkah-Mu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: melalui laut
  rationale: Preposisi ב secara harfiah dapat berarti “di/dalam”, tetapi bersama “jalan” dalam konteks puitis ini menunjukkan jalur gerak yang melewati laut. “Melalui laut” menyampaikan gambaran itu tanpa menambahkan nama peristiwa tertentu.
- source_word: דַּרְכֶּךָ
  choice: jalan-Mu
  rationale: דֶּרֶךְ berarti jalan atau cara. “Jalan-Mu” alami dalam bahasa Indonesia dan mempertahankan kemungkinan makna harfiah maupun metaforis.
- source_word: שביליך
  choice: jalur-jalur-Mu
  rationale: שְׁבִיל menunjuk pada jalur atau lintasan. Bentuk jamak dipertahankan, sekaligus menjaga paralelisme dengan “jalan-Mu”.
- source_word: בְּמַיִם רַבִּים
  choice: melalui perairan luas
  rationale: Ungkapan ini menguatkan baris pertama. “Perairan luas” lebih alami daripada “banyak air” dalam bahasa Indonesia, sementara “melalui” mempertahankan gambaran gerak.
- source_word: עִקְּבוֹתֶיךָ
  choice: jejak-Mu
  rationale: Kata ini dapat merujuk pada jejak, tapak kaki, atau langkah. “Jejak-Mu” mempertahankan citra bekas lintasan yang tidak dapat dikenali.
- source_word: לֹא נֹדָעוּ
  choice: tidak diketahui
  rationale: Bentuk pasif Ibrani dipertahankan agar teks tetap terbuka mengenai apakah jejak itu tidak terlihat, tidak dikenali, atau tidak dapat dilacak.
theological_decisions:
- issue: Tingkat kekhususan gambaran keluaran melalui laut
  choice: Mempertahankan gambaran puitis tentang jalan Allah melalui laut tanpa menyebut penyeberangan Laut Merah secara eksplisit.
  alternative: Menjelaskan secara langsung bahwa ayat ini merujuk pada peristiwa keluaran atau penyeberangan Laut Merah.
  rationale: Teks Ibrani membangkitkan ingatan akan pembebasan melalui air, tetapi tidak menamai peristiwanya dalam ayat ini. Rumusan puitis mempertahankan ketegangan bahwa Allah sungguh bertindak, sementara jejak-Nya tetap tidak terselami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan ilahi memakai bentuk terikat “-Mu”. Paralelisme Ibrani dipertahankan, dengan “jalan” dan “jalur-jalur”; tanda titik koma menandai peralihan menuju kontras pada baris terakhir.
