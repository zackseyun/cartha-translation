  text: אזכיר מַֽעַלְלֵי יָ֑הּ כִּֽי אֶזְכְּרָ֖ה מִ/קֶּ֣דֶם פִּלְאֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember the deeds of Yah[b][a], for I will remember your wonders from of old.
translation:
  language: id
  text: Aku akan mengingat[a] perbuatan Yah, sebab aku akan mengingat keajaiban-keajaiban-Mu dari zaman dahulu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan menuturkan perbuatan Yah.” Kata kerjanya juga dapat berarti mengingat dengan menyebutkannya atau menceritakannya kembali.
    reason: lexical_alternative
  - marker: b
    text: Atau, “keajaiban-keajaiban-Mu dari zaman purbakala” atau “dahulu kala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: aku akan mengingat
  rationale: Bentuk Hifil dari זכר dapat berarti mengingat, menyebut, atau menuturkan kembali. Dalam paralel dengan אֶזְכְּרָה, pilihan ini mempertahankan tindakan sengaja untuk mengenang tanpa membatasi maknanya pada penyampaian di muka umum.
- source_word: מַעַלְלֵי
  choice: segala perbuatan
  rationale: Kata ini menunjuk pada tindakan atau perbuatan. Ungkapan 'segala perbuatan' menyampaikan bentuk jamak Ibrani dengan wajar dan bermartabat dalam bahasa Indonesia.
- source_word: יָהּ
  choice: Yah
  rationale: Ini adalah bentuk puitis singkat dari nama ilahi, bukan bentuk lengkap יהוה. Bentuk khas tersebut dipertahankan dan tidak disamakan dengan gelar 'TUHAN'.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי menghubungkan larik kedua sebagai penjelasan atau penegasan atas larik pertama.
- source_word: אֶזְכְּרָה
  choice: aku akan mengingat
  rationale: Bentuk ini mengungkapkan tekad orang pertama. 'Aku akan mengingat' terdengar alami serta mempertahankan daya kehendaknya.
- source_word: מִקֶּדֶם
  choice: sejak dahulu
  rationale: Frasa ini menunjuk pada masa lampau yang jauh. 'Sejak dahulu' mempertahankan kedalaman waktu tanpa menyiratkan awal mutlak.
- source_word: פִּלְאֶךָ
  choice: keajaiban-keajaiban-Mu
  rationale: Kata פלא menunjuk pada keajaiban atau tindakan yang menakjubkan. Bentuk ini menyampaikan makna kolektifnya secara alami dan sejalan dengan paralel 'segala perbuatan'.
theological_decisions:
- issue: Penerjemahan bentuk singkat puitis nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks sumber memakai יָהּ, bukan bentuk lengkap יהוה. Mempertahankan 'Yah' menjaga perbedaan leksikal dan corak puitis teks tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Pengulangan 'aku akan mengingat' dipertahankan karena mencerminkan paralelisme dan tekad dalam teks Ibrani; sapaan ilahi ditulis dengan huruf kapital pada sufiks '-Mu'.
