  text: קוֹלִ֣/י אֶל אֱלֹהִ֣ים וְ/אֶצְעָ֑קָה קוֹלִ֥/י אֶל אֱ֝לֹהִ֗ים וְ/הַאֲזִ֥ין אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/001.yaml
  text: My voice is to God[a], and I cry out; my voice is to God[b], and he gives ear to me.
translation:
  language: id
  text: Suaraku tertuju kepada Allah, dan aku berseru; suaraku tertuju kepada Allah, dan Ia mendengarkan aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹלִי
  choice: Suaraku
  rationale: Mempertahankan nomina dengan sufiks orang pertama, pengulangan puitis, dan penekanan pada suara pemazmur.
- source_word: אֶל
  choice: tertuju kepada
  rationale: Preposisi ini menyatakan arah kepada Allah. Kata 'tertuju' melengkapi klausa nominal Ibrani agar wajar dalam bahasa Indonesia tanpa menghilangkan gambaran suara yang diarahkan kepada-Nya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk tersebut menunjuk kepada Allah yang esa.
- source_word: וְאֶצְעָקָה
  choice: dan aku berseru
  rationale: Kata kerja צעק menyatakan seruan kuat, khususnya seruan meminta pertolongan. Bentuk kohortatif/imperfectif dipahami sebagai ungkapan puitis yang hidup.
- source_word: וְהַאֲזִין
  choice: dan Ia mendengarkan
  rationale: Kata kerja אזן menekankan tindakan menyimak atau mendengarkan dengan perhatian. 'Mendengarkan' alami dalam bahasa Indonesia dan tetap menyatakan tanggapan Allah.
- source_word: אֵלָי
  choice: aku
  rationale: Sesudah 'mendengarkan', pronomina objek 'aku' menyampaikan secara alami makna harfiah 'kepada aku' dalam bahasa Indonesia.
theological_decisions:
- issue: Tanggapan Allah pada bagian akhir ayat
  choice: Pernyataan bahwa Allah mendengarkan pemazmur
  alternative: 'Permohonan atau harapan: ''semoga Ia mendengarkan aku'''
  rationale: Bentuk וְהַאֲזִין paling langsung dibaca sebagai pernyataan tentang tindakan Allah, bukan diubah menjadi permohonan. Kala kini dipakai untuk menjaga daya hidup puisi Indonesia tanpa menutup kemungkinan bahwa pemazmur sedang mengenang pengalaman yang telah terjadi.
translation_notes:
  register: Bahasa puitis modern dan khidmat. Pengulangan 'Suaraku tertuju kepada Allah' dipertahankan karena merupakan unsur struktural penting dalam teks Ibrani; 'tertuju' ditambahkan untuk membuat klausa nominal itu jelas dan alami bagi pembaca Indonesia.
