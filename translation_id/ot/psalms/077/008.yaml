  text: הֶ/אָפֵ֣ס לָ/נֶ֣צַח חַסְדּ֑/וֹ גָּ֥מַר אֹ֝֗מֶר לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: id
  text: Apakah kasih setia-Nya telah berakhir untuk selama-lamanya? Apakah janji-Nya[a] telah berakhir untuk generasi demi generasi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “firman-Nya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָפֵס
  choice: telah berakhir
  rationale: Bentuk perfektum dengan awalan interogatif menanyakan apakah sesuatu sudah habis atau lenyap. Frasa ini alami dalam bahasa Indonesia dan sesuai dengan konteks ratapan.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Ungkapan waktu ini menyatakan keberlangsungan permanen; pilihan ini mempertahankan tajamnya pertanyaan pemazmur.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד menunjuk pada kasih yang loyal dan teguh, sering kali dalam hubungan perjanjian. 'Kasih setia' merupakan padanan Indonesia yang wajar dan tidak mempersempit maknanya menjadi sekadar belas kasihan.
- source_word: גָּמַר
  choice: tidak berlaku lagi
  rationale: Kata kerja ini menyatakan bahwa sesuatu telah selesai atau berakhir. Dalam hubungannya dengan janji ilahi, ungkapan ini secara alami menyampaikan kekhawatiran bahwa janji itu telah berakhir, tanpa menyiratkan bahwa janji tersebut sebelumnya digenapi.
- source_word: אֹמֶר
  choice: janji-Nya
  rationale: Secara leksikal berarti 'perkataan/ucapan', tetapi dalam kesejajaran dengan kasih setia Allah kemungkinan menunjuk pada firman yang dijanjikan-Nya. Alternatif yang lebih formal dipertahankan dalam catatan kaki.
- source_word: לְדֹר וָדֹר
  choice: turun-temurun
  rationale: Ungkapan ini menunjuk pada kesinambungan dari satu generasi ke generasi berikutnya; 'turun-temurun' ringkas, alami, dan mempertahankan cakupan antargenerasi.
theological_decisions:
- issue: Apakah אֹמֶר diterjemahkan secara formal sebagai 'firman/perkataan' atau secara kontekstual sebagai 'janji'
  choice: janji-Nya
  alternative: firman-Nya
  rationale: Dalam ratapan tentang kasih setia dan keandalan Allah, אֹמֶר kemungkinan merujuk pada perkataan Allah sebagai komitmen yang dijanjikan. Karena bentuk Ibraninya sendiri lebih luas, alternatif formal dicantumkan dalam catatan kaki agar ketegangan leksikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan khidmat. Dua pertanyaan retoris dipertahankan. Bentuk sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
