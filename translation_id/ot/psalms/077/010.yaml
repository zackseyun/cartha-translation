  text: וָ֭/אֹמַר חַלּ֣וֹתִ/י הִ֑יא שְׁ֝נ֗וֹת יְמִ֣ין עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/010.yaml
  text: 'Then I said[b][a], “This is my grief: the years of the right hand of the Most High.”'
translation:
  language: id
  text: 'Lalu aku berkata, “Inilah penderitaanku[a]: tahun-tahun tangan kanan Yang Mahatinggi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kelemahanku” atau “penyakitku”. Kata Ibrani ini sulit dan dapat menunjuk pada penderitaan, kelemahan, atau penyakit.
    reason: lexical_alternative
  - marker: b
    text: 'Atau, “Inilah dukacitaku: tangan kanan Yang Mahatinggi telah berubah.” Sebagian orang memahami kata Ibrani yang diterjemahkan “tahun-tahun” di sini dalam arti “perubahan”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan urutan pemikiran pemazmur; “Lalu aku berkata” menyatakan peralihan itu secara wajar dalam bahasa Indonesia.
- source_word: חַלּוֹתִי
  choice: penderitaanku
  rationale: Bentuk yang sulit ini berkaitan dengan keadaan menderita, lemah, atau sakit. “Penderitaanku” cocok dengan konteks ratapan tanpa membatasi maknanya hanya pada penyakit jasmani.
- source_word: הִיא
  choice: Inilah
  rationale: Kata ganti feminin tunggal ini menunjuk pada keadaan yang sedang dikenali pemazmur. “Inilah” mengungkapkan fungsi penunjukan tersebut secara alami.
- source_word: שְׁנוֹת
  choice: tahun-tahun
  rationale: Secara paling langsung bentuk ini dipahami sebagai jamak dari שָׁנָה, “tahun”. Kemungkinan kaitannya dengan makna “perubahan” tetap dicatat karena ayat ini secara tekstual dan sintaksis sulit.
- source_word: יְמִין
  choice: tangan kanan
  rationale: Terjemahan harfiah ini mempertahankan gambaran puitis Ibrani yang lazim melambangkan kuasa dan tindakan penyelamatan.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Gelar ilahi ini secara tepat dan wajar diterjemahkan “Yang Mahatinggi”, dengan mempertahankan nuansa keagungan.
theological_decisions:
- issue: Penafsiran hubungan antara penderitaan pemazmur dan “tahun-tahun tangan kanan Yang Mahatinggi”
  choice: 'Teks utama mempertahankan susunan nominal yang terbuka: “Inilah penderitaanku: tahun-tahun tangan kanan Yang Mahatinggi.”'
  alternative: '“Inilah dukacitaku: tangan kanan Yang Mahatinggi telah berubah.”'
  rationale: Bahasa Ibrani memungkinkan beberapa pemenggalan dan penafsiran, terutama untuk חַלּוֹתִי dan שְׁנוֹת. Susunan utama mengikuti arti leksikal yang paling langsung tanpa menambahkan kata kerja yang tidak dinyatakan, sedangkan pembacaan “berubah” dicantumkan dalam catatan kaki agar ketegangan teologis—apakah pemazmur mengenang masa tindakan Allah atau meratapi perubahan yang dirasakannya—tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “tahun-tahun tangan kanan” sengaja mempertahankan kepadatan serta ambiguitas puisi Ibrani; catatan kaki membantu pembaca memahami dua titik kesulitan utama tanpa memasukkan tafsiran tambahan ke dalam teks.
