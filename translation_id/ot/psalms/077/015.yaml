  text: גָּאַ֣לְתָּ בִּ/זְר֣וֹעַ עַמֶּ֑/ךָ בְּנֵי יַעֲקֹ֖ב וְ/יוֹסֵ֣ף סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/015.yaml
  text: You redeemed your people with your arm[a], the sons of Jacob and Joseph[d][c][b]. Selah
translation:
  language: id
  text: Dengan lengan-Mu[b] Engkau telah menebus[a] umat-Mu, anak-anak Yakub dan Yusuf[c]. Sela[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membebaskan”; kata Ibrani ini juga dapat mengandung gagasan bertindak sebagai penebus.
    reason: lexical_alternative
  - marker: b
    text: “Dengan lengan-Mu” mempertahankan gambaran Ibrani tentang kuasa Allah yang sedang bertindak.
    reason: lexical_alternative
  - marker: c
    text: “Anak-anak Yakub dan Yusuf” dapat menjadi sebutan puitis bagi Israel; “Yusuf” mungkin secara khusus menonjolkan suku-suku keturunannya.
    reason: alternative_reading
  - marker: d
    text: “Sela” kemungkinan merupakan petunjuk liturgis atau musik; arti tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: telah menebus
  rationale: Kata kerja גאל menyatakan tindakan menebus atau membebaskan, sering dengan nuansa seorang penebus kerabat. “Menebus” mempertahankan bobot perjanjian dan penyelamatan tanpa mempersempitnya pada pembayaran tebusan.
- source_word: בִּזְרוֹעַ
  choice: dengan lengan-Mu
  rationale: זְרוֹעַ secara harfiah berarti “lengan” dan di sini menggambarkan kuasa Allah yang sedang bertindak. Ungkapan konkret Ibrani dipertahankan daripada diratakan menjadi “dengan kuasa-Mu”.
- source_word: עַמֶּךָ
  choice: umat-Mu
  rationale: עַם dengan akhiran orang kedua tunggal berarti umat kepunyaan Allah. “Umat-Mu” alami dalam bahasa Indonesia dan sesuai dengan konteks perjanjian.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk konstruksi בְּנֵי secara harfiah berarti “anak-anak lelaki dari,” tetapi dalam sebutan genealogis dan kebangsaan dapat menunjuk pada anak cucu atau keturunan. “Anak-anak” mempertahankan bentuk puitis sumber tanpa memasukkan penafsiran kesukuan ke dalam teks utama.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi diterjemahkan menurut bentuk baku bahasa Indonesia.
- source_word: וְיוֹסֵף
  choice: dan Yusuf
  rationale: Nama pribadi dipertahankan. Teks tidak menjelaskan apakah Yusuf mewakili suku-suku tertentu, sehingga terjemahan tidak menambahkan penjelasan itu ke dalam teks utama.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat סֶלָה tidak pasti dan kemungkinan merupakan petunjuk musik atau liturgis. Transliterasi mempertahankan unsur teks tanpa memastikan arti yang belum diketahui.
theological_decisions:
- issue: Sebutan kebangsaan “anak-anak Yakub dan Yusuf”
  choice: Mempertahankan kedua nama sebagaimana dalam teks Ibrani tanpa menjelaskan fungsi perwakilan Yusuf.
  alternative: Menafsirkan “Yusuf” secara khusus sebagai Efraim dan Manasye, kerajaan utara, atau menjadikan seluruh frasa sebagai padanan eksplisit bagi seluruh Israel.
  rationale: Teks menyandingkan Yakub dan Yusuf tetapi tidak menerangkan cakupan sebutan Yusuf. Terjemahan mempertahankan ambiguitas puitis dan historis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan awal “Dengan lengan-Mu” mempertahankan penekanan puitis pada sarana tindakan Allah. Huruf kapital pada pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
