  text: הֲ/שָׁכַ֣ח חַנּ֣וֹת אֵ֑ל אִם קָפַ֥ץ בְּ֝/אַ֗ף רַחֲמָ֥י/ו סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/009.yaml
  text: Has God forgotten to be gracious? Has he in anger shut up his compassion? Selah[a][b]
translation:
  language: id
  text: Apakah Allah telah lupa bermurah hati? Atau, apakah dalam murka-Nya Ia telah menutup belas kasih-Nya? Sela.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apakah Allah telah lupa menunjukkan kemurahan? Atau, apakah Ia dalam murka-Nya telah menahan belas kasih-Nya?”'
    reason: lexical_alternative
  - marker: b
    text: “Sela” kemungkinan merupakan penanda liturgis atau musikal; makna tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁכַח
  choice: Apakah ... telah lupa
  rationale: Partikel tanya הֲ dan verba שׁכח membentuk pertanyaan retoris. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nada keluh kesah pemazmur.
- source_word: חַנּוֹת
  choice: bermurah hati
  rationale: Infinitif dari חנן berarti menunjukkan kemurahan atau perkenanan. 'Bermurah hati' alami, mudah dipahami, dan tetap mencerminkan tindakan penuh anugerah tanpa memasukkan tafsiran doktrinal tambahan.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini merupakan sebutan umum bagi Allah. 'Allah' adalah padanan baku dan jelas dalam bahasa Indonesia.
- source_word: אִם
  choice: Atau, apakah
  rationale: Sesudah pertanyaan retoris pertama, אִם memperkenalkan pertanyaan sejajar sebagai kemungkinan alternatif. 'Atau, apakah' mempertahankan hubungan itu secara wajar.
- source_word: קָפַץ
  choice: menutup
  rationale: Verba ini menggambarkan tindakan menutup atau mengatupkan. 'Menutup belas kasih-Nya' mempertahankan metafora konkret Ibrani, meskipun ungkapannya sengaja puitis.
- source_word: בְּאַף
  choice: dalam murka-Nya
  rationale: אַף secara harfiah berarti 'hidung', tetapi secara idiomatis menunjuk pada amarah atau murka. Sufiks milik tidak tertulis pada אַף, tetapi pelaku ilahi dalam konteks memungkinkan ungkapan Indonesia yang alami 'murka-Nya'.
- source_word: רַחֲמָיו
  choice: belas kasih-Nya
  rationale: Bentuknya secara morfologis jamak, tetapi dapat berfungsi sebagai nomina kolektif atau abstrak bagi belas kasih ilahi. Bentuk tunggal abstrak paling alami dalam bahasa Indonesia; alternatif jamak dicatat dalam catatan kaki.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak pasti. Transliterasi mempertahankan penanda liturgis atau musikal Ibrani tanpa menerka artinya.
theological_decisions:
- issue: Apakah ayat ini diterjemahkan sebagai pertanyaan retoris atau pernyataan
  choice: Dua pertanyaan retoris yang mengungkapkan kegelisahan pemazmur
  alternative: Pernyataan seperti 'Allah telah lupa ...'
  rationale: Partikel interogatif dan konteks ratapan mendukung pertanyaan retoris. Bentuk pertanyaan menjaga ketegangan teologis dan tidak mengubah keluhan pemazmur menjadi pernyataan mutlak tentang Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang bermartabat. Dua pertanyaan retoris dan metafora 'menutup belas kasih' dipertahankan. Kapitalisasi pronomina ilahi mengikuti kelaziman Alkitab bahasa Indonesia tanpa mengubah makna sumber.
