  text: The clouds poured out water; the skies gave forth a sound; indeed[a], your arrows moved about.
translation:
  language: id
  text: 'Awan-awan mencurahkan air;

    langit mengeluarkan suara;

    bahkan anak-anak panah-Mu bergerak ke sana kemari.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahkan kilat-Mu bergerak ke sana kemari.” Teks Ibrani berbunyi “anak-anak panah-Mu”, kemungkinan sebagai gambaran perang untuk kilat dalam konteks penampakan Allah melalui badai ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ
  choice: mencurahkan
  rationale: Kata kerja ini menggambarkan air yang mengalir atau memancar dengan deras; bersama subjek awan dan objek air, 'mencurahkan' alami dalam bahasa Indonesia dan mempertahankan daya citranya.
- source_word: מַיִם
  choice: air
  rationale: Bahasa Indonesia memakai 'air' sebagai nomina massa yang alami, sesuai fungsi bentuk Ibrani tersebut.
- source_word: עָבוֹת
  choice: awan-awan
  rationale: Nomina ini menunjuk pada massa awan tebal. 'Awan-awan' jelas dan puitis tanpa menambahkan penafsiran 'awan badai'.
- source_word: קוֹל נָתְנוּ
  choice: memperdengarkan suara
  rationale: Secara harfiah ungkapan ini berarti 'memberikan suara'. Pilihan ini mempertahankan ungkapan sumber secara wajar tanpa langsung menafsirkannya sebagai guruh.
- source_word: שְׁחָקִים
  choice: langit
  rationale: Kata ini dapat berarti langit atau awan. Karena עָבוֹת sudah diterjemahkan 'awan-awan', 'langit' menjaga kesejajaran puitis tanpa meleburkan kedua istilah.
- source_word: אַף
  choice: bahkan
  rationale: Partikel ini menambahkan penegasan dan gerak klimaks; 'bahkan' menyampaikan fungsi itu secara alami.
- source_word: חֲצָצֶיךָ
  choice: anak-anak panah-Mu
  rationale: Makna leksikal langsungnya ialah anak panah. Citra ini dipertahankan dalam teks utama, sementara kemungkinan rujukannya kepada kilat dijelaskan dalam catatan kaki.
- source_word: יִתְהַלָּכוּ
  choice: melesat ke sana kemari
  rationale: Bentuk hitpael menyatakan gerak berkeliling atau ke berbagai arah. 'Melesat ke sana kemari' cocok dengan anak panah maupun kilat dan mempertahankan dinamika puisi.
theological_decisions:
- issue: 'Citra teofani puitis: anak panah harfiah atau metafora untuk kilat'
  choice: Mempertahankan 'anak-anak panah-Mu' dalam teks utama dan membiarkan konteks badai mengisyaratkan metafora kilat.
  alternative: Menerjemahkan langsung sebagai 'kilat-Mu' atau 'sambaran-sambaran kilat-Mu'.
  rationale: Kata Ibraninya secara leksikal berarti 'anak panah', sedangkan konteks teofani badai sangat mungkin menjadikannya metafora bagi kilat. Mempertahankan citra sumber dalam teks dan mencatat kemungkinan maknanya menghindari penyelesaian paksa atas ketegangan puitis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Baris-baris pendek mempertahankan paralelisme Ibrani. Kapital pada '-Mu' mengikuti kebiasaan ejaan teks keagamaan Indonesia saat merujuk kepada Allah.
