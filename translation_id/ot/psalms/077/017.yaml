- from: 'Awan-awan mencurahkan air;

    langit memperdengarkan suara;

    bahkan anak-anak panah-Mu melesat ke sana kemari.[a]'
  to: 'Awan-awan mencurahkan air;

    langit mengeluarkan suara;

    bahkan anak-anak panah-Mu bergerak ke sana kemari.[a]'
  rationale: Revisi ini mempertahankan struktur puitis, ambiguitas antara anak panah dan kilat, serta tekanan partikel “bahkan”. Perubahan hanya menghilangkan kausatif yang kurang idiomatis pada “memperdengarkan” dan tambahan makna kecepatan pada “melesat”, sehingga terjemahan lebih alami dan lebih dekat dengan keluasan bahasa Ibrani.
