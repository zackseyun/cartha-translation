  text: שִׁ֣ירוּ לַ֭/יהוָה שִׁ֣יר חָדָ֑שׁ שִׁ֥ירוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/001.yaml
  text: Sing to Yahweh a new song; sing to Yahweh[a], all the earth.
translation:
  language: id
  text: Nyanyikanlah nyanyian baru bagi Yahweh; bernyanyilah bagi Yahweh[a], hai seluruh bumi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”; di sini dituliskan “Yahweh”.'
    reason: Menjelaskan bentuk asli dan tradisi penerjemahan nama ilahi.
lexical_decisions:
- source_word: שִׁירוּ
  choice: Bernyanyilah
  rationale: Bentuk imperatif jamak dari שׁיר yang menyerukan para pendengar untuk bernyanyi. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan “memuji” yang tidak dinyatakan secara eksplisit.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai pihak yang menjadi tujuan atau penerima nyanyian. “Bagi Yahweh” menyampaikan hubungan ini secara alami.
- source_word: שִׁיר חָדָשׁ
  choice: sebuah nyanyian baru
  rationale: Menerjemahkan nomina dan adjektiva secara langsung; kata “sebuah” diperlukan agar ungkapan tersebut alami dalam bahasa Indonesia.
- source_word: כָּל הָאָרֶץ
  choice: seluruh bumi
  rationale: Dalam konteks mazmur yang menyerukan ibadah secara universal, הָאָרֶץ paling tepat dipahami sebagai “bumi”, bukan “negeri”. “Hai” menandai sapaan langsung yang tersirat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi YHWH secara langsung. “Yahweh” mempertahankannya sebagai nama diri, sedangkan catatan kaki memberitahukan kebiasaan penerjemahan tradisional tanpa mengganti nama tersebut dalam teks utama.
- issue: Cakupan כָּל הָאָרֶץ
  choice: seluruh bumi
  alternative: seluruh negeri
  rationale: הָאָרֶץ dapat berarti “bumi” atau “negeri”, tetapi cakrawala universal Mazmur 96 mendukung “seluruh bumi”. Pilihan ini tetap mempertahankan seruan kepada segenap dunia tanpa mempersempitnya pada suatu wilayah tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan imperatif dipertahankan untuk mencerminkan struktur puitis Ibrani; “hai” memperjelas bahwa “seluruh bumi” disapa secara langsung.
