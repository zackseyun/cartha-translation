id: PSA.96.13
reference: Psalms 96:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לִ/פְנֵ֤י יְהוָ֨ה כִּ֬י בָ֗א כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בֶּ/אֱמוּנָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/013.yaml
  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: id
  text: di hadapan Yahweh, sebab Ia datang, sebab Ia datang[a] untuk menghakimi bumi. Ia akan menghakimi dunia dengan keadilan[b], dan bangsa-bangsa dengan kesetiaan-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “sebab Ia telah datang, sebab Ia telah datang”; bentuk Ibrani menyatakan kedatangan yang pasti dan mengulang kata kerjanya untuk penegasan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan kebenaran.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dengan kebenaran-Nya”; kata Ibrani juga mengandung nuansa keteguhan dan keterandalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan preposisional ini secara idiomatis berarti berada di hadapan atau dalam hadirat seseorang. “Di hadapan” alami dalam bahasa Indonesia dan mempertahankan nuansa relasionalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: כִּי בָא ... כִּי בָא
  choice: sebab Ia datang, sebab Ia datang
  rationale: Bentuk Ibrani menyatakan kedatangan yang pasti dan terasa dekat. Pengulangan dipertahankan karena memberi penegasan puitis.
- source_word: לִשְׁפֹּט / יִשְׁפֹּט
  choice: untuk menghakimi / akan menghakimi
  rationale: Dalam konteks yang menyebut keadilan dan kesetiaan, verba ini terutama menunjuk pada tindakan mengadili, walaupun dapat pula mencakup pemerintahan.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Paralelnya dengan תֵּבֵל menunjukkan cakupan universal, bukan suatu wilayah tertentu.
- source_word: תֵּבֵל
  choice: dunia
  rationale: Kata ini menunjuk pada dunia yang dihuni dan tertata; “dunia” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: בְּצֶדֶק
  choice: dengan keadilan
  rationale: Dalam konteks penghakiman, צֶדֶק menyatakan kelurusan dan keadilan yang menjadi ukuran tindakan Yahweh.
- source_word: וְעַמִּים
  choice: dan bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk pada berbagai kelompok manusia secara kolektif. “Bangsa-bangsa” adalah ungkapan Indonesia yang alami, sementara “umat-umat” tetap mungkin.
- source_word: בֶּאֱמוּנָתוֹ
  choice: dengan kesetiaan-Nya
  rationale: אֱמוּנָה menyatakan keteguhan, keterandalan, dan kesetiaan. Bentuk dengan sufiks menegaskan bahwa sifat itu milik-Nya.
theological_decisions:
- issue: Hakikat penghakiman ilahi dalam konteks puisi
  choice: Mempertahankan bahasa “menghakimi” tanpa mempersempit atau memperluas maknanya secara doktrinal.
  alternative: Menerjemahkan sebagai “memerintah” atau menjelaskannya secara eksplisit sebagai penghakiman terakhir.
  rationale: Teks menyatakan penghakiman Yahweh atas seluruh bumi, tetapi tidak menguraikan waktu atau bentuk lengkap penghakiman itu.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Bentuk “Yahweh” mempertahankan fungsi יהוה sebagai nama diri dan selaras dengan lapisan konsultasi utama, tanpa menggantinya dengan gelar.
- issue: Hubungan keadilan dan kesetiaan dengan penghakiman
  choice: Mempertahankan keduanya sebagai sifat atau tolok ukur penghakiman Yahweh.
  alternative: Menafsirkan keduanya sebagai uraian teknis mengenai prosedur pengadilan tertentu.
  rationale: Konstruksi Ibrani menyatakan bahwa penghakiman-Nya berlangsung dengan keadilan dan kesetiaan, tetapi tidak merinci mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan dengan susunan kalimat yang tetap mudah dipahami. Pengulangan sumber dipertahankan. Huruf kapital pada “Ia” dan sufiks “-Nya” menandai rujukan kepada Yahweh sesuai kebiasaan penerbitan religius Indonesia.
