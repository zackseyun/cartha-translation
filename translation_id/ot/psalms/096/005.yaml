  text: כִּ֤י כָּל אֱלֹהֵ֣י הָ/עַמִּ֣ים אֱלִילִ֑ים וַֽ֝/יהוָ֗ה שָׁמַ֥יִם עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/005.yaml
  text: For all the gods of the peoples are idols[c][b][a], but Yahweh made the heavens.
translation:
  language: id
  text: Sebab semua ilah bangsa-bangsa[a] adalah berhala[b], tetapi Yahweh[c] membuat langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum-kaum” atau “bangsa-bangsa.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini juga dapat menyiratkan berhala yang hampa atau tidak berharga.
    reason: lexical_alternative
  - marker: c
    text: Ibrani YHWH, yang secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi seruan pada ayat sebelumnya. “Sebab” alami dalam puisi Indonesia dan mempertahankan hubungan argumentatifnya.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: semua ilah bangsa-bangsa
  rationale: “Semua” mempertahankan cakupan menyeluruh כָּל; “ilah” menyatakan dewa-dewa yang disembah berbagai bangsa tanpa menyamakannya dengan Allah; bentuk ulang “bangsa-bangsa” menyampaikan jamak Ibrani.
- source_word: אֱלִילִים
  choice: berhala
  rationale: “Berhala” adalah padanan Indonesia yang jelas bagi objek-objek sembahan palsu. Nuansa polemis berupa kehampaan atau ketidakberhargaan dicatat dalam catatan kaki agar tidak diperkuat secara berlebihan dalam teks utama.
- source_word: וַיהוָה
  choice: tetapi Yahweh
  rationale: Kata sambung ו menyatakan kontras tajam di sini, sehingga diterjemahkan “tetapi”; nama perjanjian YHWH ditransliterasikan sebagai “Yahweh”.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, bahasa Indonesia lazim memakai bentuk tunggal “langit” untuk cakrawala atau wilayah surgawi secara keseluruhan.
- source_word: עָשָׂה
  choice: membuat
  rationale: “Membuat” merupakan padanan langsung bagi עשה dan tidak menggantikannya dengan istilah yang lebih khusus seperti “menciptakan”.
theological_decisions:
- issue: Penyebutan ilah-ilah bangsa-bangsa
  choice: ilah ... adalah berhala
  alternative: dewa-dewa ... adalah berhala yang tidak berharga
  rationale: Teks mengakui sebutan mereka sebagai ilah sambil menyangkal nilainya melalui predikat “berhala”. Terjemahan ini mempertahankan ketegangan polemis tanpa menentukan lebih jauh hakikat ontologis mereka.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri YHWH. “Yahweh” mempertahankan nama tersebut, sedangkan bentuk tradisional “TUHAN” dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan dua klausa mempertahankan kontras puitis antara berhala bangsa-bangsa dan Yahweh sebagai pembuat langit.
