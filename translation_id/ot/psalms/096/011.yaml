  text: יִשְׂמְח֣וּ הַ֭/שָּׁמַיִם וְ/תָגֵ֣ל הָ/אָ֑רֶץ יִֽרְעַ֥ם הַ֝/יָּ֗ם וּ/מְלֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: id
  text: Biarlah langit bersukacita dan bumi bergembira; biarlah laut bergemuruh, beserta segala yang memenuhi laut itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Biarlah ... bersukacita
  rationale: Bentuk imperfek Qal orang ketiga jamak berfungsi volitif dalam rangkaian puitis ini; “biarlah” menyampaikan ajakan kepada ciptaan, sedangkan “bersukacita” mempertahankan makna שׂמח.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” secara alami dapat mencakup bentangan langit secara kosmis dan sesuai dengan pasangan bumi serta laut.
- source_word: וְתָגֵל
  choice: dan bumi bergembira
  rationale: גיל menyatakan kegembiraan atau sorak sukacita. “Bergembira” membedakannya secara puitis dari “bersukacita” tanpa mengubah kesejajaran makna.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Konteks pujian kosmis dengan langit dan laut menuntut “bumi”, bukan “negeri” atau “tanah”.
- source_word: יִרְעַם
  choice: biarlah laut bergemuruh
  rationale: רעם berarti mengguntur atau menghasilkan bunyi dahsyat. “Bergemuruh” merupakan ungkapan Indonesia yang alami untuk bunyi laut dan tetap mempertahankan daya puitisnya.
- source_word: הַיָּם
  choice: laut
  rationale: “Laut” adalah padanan langsung dan wajar bagi יָם dalam triad kosmis langit–bumi–laut.
- source_word: וּמְלֹאוֹ
  choice: beserta segala yang memenuhi laut itu
  rationale: Secara harfiah berarti “dan kepenuhannya”, yakni segala sesuatu yang terkandung di dalam laut. Rumusan ini mempertahankan citra ‘memenuhi’ dengan rujukan pronominal yang jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Daya volitif dari bentuk-bentuk imperfek puitis
  choice: 'Diterjemahkan sebagai ajakan: “Biarlah langit bersukacita ... biarlah laut bergemuruh.”'
  alternative: 'Dibaca sebagai masa depan prediktif: “Langit akan bersukacita ... laut akan bergemuruh.”'
  rationale: Dalam konteks mazmur yang menyerukan pujian dari seluruh ciptaan, rangkaian imperfek ini paling wajar dipahami secara yusif atau volitif. Terjemahan dengan “biarlah” mempertahankan fungsi wacananya tanpa menambahkan muatan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kesejajaran antarklausa dipertahankan, dengan variasi leksikal “bersukacita/bergembira” dan bunyi kuat “bergemuruh”. Tidak diperlukan catatan kaki karena alternatif “mengaum” kurang alami untuk laut dalam konteks ini dan tidak mewakili ambiguitas penting.
