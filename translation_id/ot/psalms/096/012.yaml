  terminology: Pilihan “bersukacita” dan “bersorak-sorai” membedakan dua verba Ibrani tanpa memaksakan perbedaan yang berlebihan. Catatan kaki pada “bersorak-sorai” relevan dengan alternatif leksikal “menyanyi dengan sukacita” bagi יְרַנְּנוּ, dan penandanya ditempatkan pada frasa yang dijelaskan.
