source:
  edition: WLC
  text: יַעֲלֹ֣ז שָׂ֭דַי וְ/כָל אֲשֶׁר בּ֑/וֹ אָ֥ז יְ֝רַנְּנ֗וּ כָּל עֲצֵי יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: id
  text: Biarlah padang bersukacita bersama segala yang ada di dalamnya; kemudian semua pohon di hutan akan bersorak-sorai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menyanyi dengan sukacita.” Kata Ibrani ini dapat menunjuk pada seruan sukacita yang nyaring.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  choice: Biarlah ... bersukacita
  rationale: Bentuk imperfek/yusif menyatakan ajakan atau harapan puitis. “Biarlah ... bersukacita” mempertahankan daya volitif dan nuansa perayaan yang kuat.
- source_word: שָׂדַי
  choice: padang
  rationale: Nomina tunggal ini dipakai secara kolektif. “Padang” alami dalam bahasa Indonesia dan mempertahankan personifikasi alam.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: bersama segala yang ada di dalamnya
  rationale: Frasa ini mencakup seluruh isi padang; “bersama” secara alami menghubungkan semuanya dengan ajakan untuk bersukacita tanpa mengubah cakupan כָל.
- source_word: אָז
  choice: kemudian
  rationale: Kata ini menandai gerak puitis berikutnya atau urutan respons.
- source_word: יְרַנְּנוּ
  choice: akan bersorak-sorai
  rationale: Bentuk piel menunjuk pada seruan sukacita yang nyaring. “Bersorak-sorai” mempertahankan kekuatan leksikalnya dan cocok dengan gambaran puitis pohon-pohon yang memuji.
- source_word: כָּל עֲצֵי יָעַר
  choice: semua pohon di hutan
  rationale: Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan cakupan menyeluruh dari כָל dan citra seluruh hutan.
theological_decisions:
- issue: Personifikasi ciptaan dalam pujian
  choice: Mempertahankan secara langsung gambaran padang dan pepohonan yang bersukacita dan bersorak-sorai.
  alternative: Menjelaskannya sebagai metafora bagi keindahan alam atau pujian manusia.
  rationale: Teks secara puitis menggambarkan ciptaan nonmanusia ikut menyambut dengan sukacita. Personifikasi ini sebaiknya tidak dirasionalisasi atau dipersempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Padang” dipilih daripada “ladang” agar cakupannya tidak terlalu dibatasi pada lahan pertanian. Penanda catatan kaki ditempatkan setelah frasa yang diterangkannya.
