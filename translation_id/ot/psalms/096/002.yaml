  text: שִׁ֣ירוּ לַ֭/יהוָה בָּרֲכ֣וּ שְׁמ֑/וֹ בַּשְּׂר֥וּ מִ/יּֽוֹם לְ֝/י֗וֹם יְשׁוּעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/002.yaml
  text: Sing to Yahweh[a]; bless his name; proclaim his salvation from day to day.
translation:
  language: id
  text: Bernyanyilah bagi Yahweh; pujilah nama-Nya; kabarkanlah[a] keselamatan-Nya dari hari ke hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “beritakanlah kabar baik tentang keselamatan-Nya.”
    reason: Kata Ibrani בשר sering mengandung nuansa mengumumkan berita baik; catatan ini mempertahankan nuansa tersebut tanpa memperpanjang teks utama.
lexical_decisions:
- source_word: שִׁירוּ
  choice: Bernyanyilah
  rationale: Kata kerja imperatif jamak ini merupakan ajakan langsung untuk bernyanyi. Terjemahan ini tidak menambahkan objek seperti “pujian” yang tidak dinyatakan dalam teks Ibrani.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai pihak yang menjadi tujuan nyanyian, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh” agar nama ilahi dalam teks sumber tetap tampak.
- source_word: בָּרֲכוּ
  choice: pujilah
  rationale: Secara harfiah kata ini dapat berarti “berkatilah”, tetapi dalam ungkapan ibadah ketika Allah menjadi objeknya, “pujilah” menyampaikan maksudnya secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Terjemahan langsung dari kata “nama” dengan akhiran orang ketiga tunggal; ungkapan tersebut mempertahankan gagasan Ibrani tentang identitas dan nama baik yang dinyatakan Allah.
- source_word: בַּשְּׂרוּ
  choice: kabarkanlah
  rationale: Bentuk imperatif ini berarti mengumumkan berita, sering kali dengan nuansa berita baik. “Kabarkanlah” ringkas, alami, dan memungkinkan objek “keselamatan-Nya” tetap mengikuti struktur sumber.
- source_word: מִיּוֹם לְיוֹם
  choice: dari hari ke hari
  rationale: Ungkapan ini mempertahankan bentuk idiom Ibrani sekaligus menyampaikan tindakan yang berlangsung terus-menerus setiap hari.
- source_word: יְשׁוּעָתוֹ
  choice: keselamatan-Nya
  rationale: Kata ini mencakup keselamatan atau pembebasan. “Keselamatan” merupakan padanan luas yang sesuai dengan konteks ibadah mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama ilahi sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna memberkati nama Allah
  choice: pujilah nama-Nya
  alternative: berkatilah nama-Nya
  rationale: “Berkatilah” lebih harfiah bagi ברך, tetapi dalam bahasa Indonesia modern dapat terdengar seolah manusia menganugerahkan berkat kepada Allah. “Pujilah” menyampaikan fungsi ungkapan ibadah itu tanpa menambahkan gagasan teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif berakhiran -lah mempertahankan rangkaian seruan puitis. Huruf kapital pada akhiran pronominal dalam “nama-Nya” dan “keselamatan-Nya” mengikuti kebiasaan penulisan hormat untuk rujukan kepada Allah.
