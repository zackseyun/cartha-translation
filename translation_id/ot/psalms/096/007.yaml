  text: הָב֣וּ לַ֭/יהוָה מִשְׁפְּח֣וֹת עַמִּ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: id
  text: Berilah kepada Yahweh[a], hai suku-suku bangsa[b], berilah kepada Yahweh kemuliaan dan kekuatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Berilah kepada” di sini berarti mengakui dan memberikan kepada Yahweh penghormatan yang menjadi hak-Nya. Nama Yahweh juga sering diterjemahkan “TUHAN.”
    reason: Penjelasan idiom Ibrani dan alternatif penerjemahan nama ilahi.
  - marker: b
    text: Atau “kaum-kaum dari antara bangsa-bangsa.” Istilah Ibrani ini dapat menunjuk pada keluarga besar, kelompok kekerabatan, atau suku.
    reason: Alternatif leksikal untuk מִשְׁפְּחוֹת עַמִּים.
lexical_decisions:
- source_word: הָבוּ
  choice: Berilah
  rationale: Bentuk imperatif ini secara harfiah berarti “berilah,” tetapi dalam seruan ibadah bermakna mengakui dan memberikan kepada Allah penghormatan yang menjadi hak-Nya. Pilihan ini mempertahankan bentuk puitis dan pengulangan teks Ibrani.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks sumber tetap tampak.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: hai kaum-kaum bangsa
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan atau kaum, sedangkan עַמִּים berarti bangsa-bangsa atau suku-suku bangsa. Partikel sapaan “hai” membuat fungsi vokatif ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: כָּבוֹד
  choice: kemuliaan
  rationale: Dalam konteks ibadah, כָּבוֹד menunjuk pada kemuliaan atau kehormatan yang patut diakui sebagai milik Allah; “kemuliaan” sesuai dengan laras mazmur.
- source_word: וָעֹז
  choice: dan kekuatan
  rationale: עֹז berarti kekuatan, keperkasaan, atau kuasa. “Kekuatan” merupakan padanan langsung dan alami serta menjaga pasangan puitis dengan “kemuliaan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama יהוה secara langsung. “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar, sementara catatan kaki menjelaskan tradisi penerjemahan lain.
- issue: Makna pemberian kemuliaan dan kekuatan kepada Allah
  choice: Mempertahankan ungkapan “berilah kepada Yahweh”
  alternative: Akuilah kemuliaan dan kekuatan Yahweh
  rationale: Ungkapan ini tidak menyiratkan bahwa manusia menambahkan sesuatu yang sebelumnya tidak dimiliki Allah, tetapi menyerukan pengakuan atas apa yang menjadi hak-Nya. Terjemahan utama mempertahankan metafora dan ketegangan bahasa sumber; catatan kaki memberi penjelasan idiomatis.
translation_notes:
  register: Bahasa puitis, khidmat, dan tetap mudah dipahami. Pengulangan imperatif dipertahankan untuk menjaga irama seruan ibadah dalam teks Ibrani.
