  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: id
  text: Sebab Yahweh agung dan sangat patut dipuji[a]; Ia patut ditakuti[b] melebihi segala ilah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan sangat dipuji.” Bentuk Ibrani ini juga dapat diterjemahkan, “dan sangat layak dipuji.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “dahsyat” atau “membangkitkan rasa takut.” Kata Ibraninya menggambarkan Dia sebagai Pribadi yang membangkitkan rasa takut penuh hormat.
    reason: lexical_alternative
  - marker: c
    text: “Ilah” dapat menunjuk kepada dewa-dewa bangsa-bangsa; ayat berikutnya menyatakan bahwa ilah-ilah bangsa-bangsa adalah berhala-berhala.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ajakan untuk menyembah dalam konteks sekitarnya; “Sebab” mempertahankan fungsi penjelasannya secara alami.
- source_word: גָדוֹל
  choice: agung
  rationale: Dalam konteks pujian kepada Allah, kata ini menyatakan kebesaran dan kemuliaan, bukan sekadar ukuran atau kekuatan; “agung” terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וּמְהֻלָּל מְאֹד
  choice: dan sangat patut dipuji
  rationale: Partisip pasif “dipuji” dengan penguat “sangat” secara idiomatis menyatakan bahwa Yahweh layak menerima pujian yang amat besar; bentuk ini mempertahankan nuansa kewajiban pujian tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: נוֹרָא הוּא
  choice: Dia harus ditakuti
  rationale: Ungkapan ini menyatakan bahwa Dia membangkitkan rasa takut yang penuh hormat. “Harus ditakuti” mempertahankan daya kata Ibrani lebih baik daripada “mengagumkan,” yang dalam pemakaian modern dapat menjadi terlalu lemah.
- source_word: עַל כָּל אֱלֹהִים
  choice: melebihi segala ilah
  rationale: Preposisi עַל menyatakan keunggulan. “Melebihi” menyampaikan perbandingan tersebut, sedangkan “ilah” mempertahankan acuan kepada dewa-dewa bangsa-bangsa tanpa langsung menafsirkannya sebagai berhala.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna אֱלֹהִים dalam konteks ini
  choice: ilah
  alternative: dewa-dewa, makhluk-makhluk ilahi, atau berhala
  rationale: Ayat ini sendiri memakai istilah umum bagi para ilah. Ayat berikutnya menjelaskan ketidakberdayaan ilah bangsa-bangsa, tetapi terjemahan ayat ini tidak seharusnya mendahului penjelasan itu dengan mengganti istilahnya menjadi “berhala”.
- issue: Nuansa נוֹרָא
  choice: harus ditakuti
  alternative: dahsyat atau mengagumkan
  rationale: Pilihan ini mempertahankan ketegangan antara rasa gentar dan penghormatan dalam konteks ibadah, tanpa melemahkannya menjadi sekadar rasa kagum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan bermartabat. “Agung” dipilih daripada “besar” agar tidak menimbulkan kesan ukuran fisik. “Ilah” dipakai untuk membedakan אֱלֹהִים dalam bentuk jamak dari Allah sebagai nama/sebutan bagi satu-satunya Tuhan, sambil mempertahankan polemik asli mazmur.
