id: PSA.96.10
reference: Psalms 96:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: id
  text: Katakanlah di antara bangsa-bangsa, “Yahweh memerintah![a] Sungguh, dunia[b] ditegakkan, tidak akan goyah. Ia akan menghakimi suku-suku bangsa dengan adil[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh adalah Raja,” atau “Yahweh telah menjadi Raja.” Bahasa Ibrani dapat dipahami sebagai pernyataan tentang kerajaan-Nya sekarang atau sebagai seruan penobatan.
    reason: alternative_reading
  - marker: b
    text: Atau, “dunia yang berpenghuni.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “dengan kelurusan” atau “dengan kejujuran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Katakanlah
  rationale: Bentuk imperatif jamak dari אמר; menyampaikan perintah langsung kepada para pendengar untuk memberitakan pesan ini.
- source_word: בַגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: Preposisi ב paling wajar dipahami sebagai lingkup tempat atau sosial tempat seruan itu disampaikan; גּוֹיִם mempertahankan cakupan internasional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
- source_word: מָלָךְ
  choice: memerintah
  rationale: Dalam seruan kerajaan mazmur, bentuk qatal ini dapat menyatakan kenyataan kini bahwa Yahweh bertakhta dan berkuasa, tanpa memaksakan makna bahwa Ia baru saja menjadi raja.
- source_word: אַף
  choice: Sungguh
  rationale: Menangkap fungsi penegasan yang menghubungkan pemerintahan Yahweh dengan keteguhan dunia.
- source_word: תִּכּוֹן
  choice: ditegakkan
  rationale: Bentuk Nifal dari כון menyatakan keadaan yang telah dibuat teguh; pilihan pasif ini mempertahankan nuansa sumber.
- source_word: תֵּבֵל
  choice: dunia
  rationale: Menunjuk dunia yang tertata, sering kali dengan nuansa dunia berpenghuni; 'dunia' paling alami dalam bahasa Indonesia.
- source_word: בַּל תִּמּוֹט
  choice: tidak akan goyah
  rationale: Ungkapan puitis yang menyatakan bahwa dunia tidak akan bergeser atau kehilangan keteguhannya.
- source_word: יָדִין
  choice: Ia akan menghakimi
  rationale: דין mencakup tindakan menghakimi atau memerintah; konteks tatanan moral kerajaan ilahi mendukung makna yudisial.
- source_word: עַמִּים
  choice: suku-suku bangsa
  rationale: Membedakannya dari גּוֹיִם sebelumnya sekaligus menyampaikan bentuk jamak kolektif secara alami dalam bahasa Indonesia.
- source_word: בְּמֵישָׁרִים
  choice: dengan adil
  rationale: מֵישָׁרִים menyatakan kelurusan, kejujuran, atau keadilan; 'dengan adil' alami dalam konteks penghakiman.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Aspek מָלָךְ dalam seruan penobatan
  choice: Yahweh memerintah
  alternative: Yahweh adalah Raja; Yahweh telah menjadi Raja
  rationale: Bentuk Ibrani dapat dipahami sebagai pernyataan pemerintahan yang sedang berlaku atau sebagai seruan penobatan. Teks utama memakai ungkapan kini yang alami, sedangkan catatan kaki mempertahankan kemungkinan lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan kalimat dibuat jelas bagi pembaca umum, sambil mempertahankan paralelisme, nama ilahi, bentuk pasif pada 'ditegakkan', dan ambiguitas seruan kerajaan melalui catatan kaki.
