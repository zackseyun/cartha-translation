id: PSA.96.9
reference: Psalms 96:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִשְׁתַּחֲו֣וּ לַ֭/יהוָה בְּ/הַדְרַת קֹ֑דֶשׁ חִ֥ילוּ מִ֝/פָּנָ֗י/ו כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/009.yaml
  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: id
  text: Sembahlah Yahweh dalam semarak kekudusan[a]; gemetarlah di hadapan-Nya, seluruh bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan pakaian kudus” atau “dalam semarak yang kudus.” Frasa Ibrani ini dapat menunjuk pada semarak yang melekat pada kekudusan atau pada perhiasan maupun pakaian sakral dalam ibadah.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: Sembahlah
  rationale: Kata kerja ini secara harfiah menggambarkan tindakan membungkuk atau bersujud sebagai tanda hormat. Dalam konteks seruan religius ini, “sembahlah” menyampaikan maksudnya secara alami dalam bahasa Indonesia tanpa meniadakan latar tindakan bersujud.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama perjanjian yang muncul secara langsung dalam teks Ibrani.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: dalam semarak kekudusan
  rationale: הֲדָר dapat berarti semarak, kemegahan, keindahan, atau perhiasan. “Semarak kekudusan” mempertahankan bahasa puitis dan tidak menetapkan secara berlebihan apakah yang dimaksud ialah kemegahan yang melekat pada kekudusan atau perhiasan/pakaian sakral para penyembah.
- source_word: חִילוּ
  choice: gemetarlah
  rationale: Kata kerja ini dapat mengacu pada gemetar, menggeliat, atau terguncang oleh rasa takut. “Gemetarlah” paling sesuai untuk rasa gentar di hadapan hadirat ilahi dalam konteks ibadah.
- source_word: מִפָּנָיו
  choice: di hadapan-Nya
  rationale: Ungkapan ini secara harfiah berkaitan dengan berada di depan wajah atau hadirat-Nya. “Di hadapan-Nya” alami dalam bahasa Indonesia dan tetap menyampaikan perjumpaan dengan hadirat ilahi.
- source_word: כָּל־הָאָרֶץ
  choice: seluruh bumi
  rationale: Dalam seruan universal mazmur ini, הָאָרֶץ menunjuk pada bumi beserta para penghuninya, bukan hanya suatu negeri tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna בְּהַדְרַת קֹדֶשׁ
  choice: dalam semarak kekudusan
  alternative: dengan pakaian kudus; dalam semarak yang kudus
  rationale: Susunan Ibrani dapat menggambarkan semarak yang menjadi ciri kekudusan atau perhiasan/pakaian sakral yang dikenakan dalam ibadah. Teks utama mempertahankan ungkapan puitis yang luas, sedangkan kemungkinan konkret dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk imperatif “sembahlah” dan “gemetarlah” mempertahankan daya seruan teks, sedangkan “semarak kekudusan” menjaga keagungan sekaligus ambiguitas frasa Ibrani.
