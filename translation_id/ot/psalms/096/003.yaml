  text: סַפְּר֣וּ בַ/גּוֹיִ֣ם כְּבוֹד֑/וֹ בְּ/כָל הָֽ֝/עַמִּ֗ים נִפְלְאוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: id
  text: Beritakanlah kemuliaan-Nya di antara bangsa-bangsa, perbuatan-perbuatan-Nya yang ajaib[a] di antara segala suku bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: keajaiban-keajaiban-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Beritakanlah
  rationale: Bentuk imperatif jamak piel dari ספר menyerukan penyampaian secara terbuka. “Beritakanlah” mempertahankan nada ajakan yang kuat dan bersifat proklamasi.
- source_word: בַגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם menunjuk pada bangsa-bangsa secara luas. “Di antara” mencerminkan preposisi ב dan menggambarkan pemberitaan di tengah mereka.
- source_word: כְּבוֹדוֹ
  choice: kemuliaan-Nya
  rationale: כָּבוֹד mencakup kehormatan, kebesaran, dan kemegahan. “Kemuliaan” merupakan padanan alami dalam konteks pujian kepada Allah.
- source_word: בְּכָל הָעַמִּים
  choice: di antara segala suku bangsa
  rationale: עַמִּים dibedakan dari גּוֹיִם melalui “suku bangsa,” sehingga paralelisme puitis tetap terasa tanpa menyamakan kedua ungkapan. “Segala” mempertahankan cakupan כָּל.
- source_word: נִפְלְאוֹתָיו
  choice: perbuatan-perbuatan-Nya yang ajaib
  rationale: Kata dari akar פלא merujuk pada tindakan luar biasa yang membangkitkan rasa takjub. Padanan ini menyampaikan baik sifat ajaib maupun unsur tindakan yang terkandung dalam bentuk Ibrani.
theological_decisions:
- issue: Cakupan universal pemberitaan
  choice: Ayat ini memerintahkan agar kemuliaan dan perbuatan ajaib TUHAN diberitakan secara luas di antara bangsa-bangsa dan segala suku bangsa.
  alternative: Rujukannya dibatasi terutama pada bangsa-bangsa tetangga Israel.
  rationale: Pasangan גּוֹיִם dan כָּל הָעַמִּים menekankan cakupan internasional yang luas. Terjemahan mempertahankan keluasan itu tanpa memasukkan rumusan misi yang tidak dinyatakan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Beritakanlah” cocok untuk seruan ibadah publik; “segala suku bangsa” alami bagi pembaca umum dan menjaga variasi leksikal dalam paralelisme Ibrani.
