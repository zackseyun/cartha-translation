source:
  edition: WLC
  text: הָב֣וּ לַ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ שְׂאֽוּ מִ֝נְחָ֗ה וּ/בֹ֥אוּ לְ/חַצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/008.yaml
  text: Ascribe to Yahweh the glory of his name[a]; bring an offering and come into his courts.
translation:
  language: id
  text: Berikanlah kepada Yahweh kemuliaan nama-Nya; bawalah persembahan[a] dan masuklah ke pelataran-pelataran-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberian” atau “upeti”. Kata Ibrani ini dapat berarti pemberian, upeti, atau persembahan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Berikanlah
  rationale: Bentuk imperatif ini secara harfiah berarti ‘berikanlah’. Dalam rumusan mazmur ini, maksudnya ialah mengakui dan memberikan kemuliaan kepada Yahweh, bukan memberi sesuatu yang tidak Ia miliki.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’ untuk mempertahankan nama perjanjian yang muncul langsung dalam teks Ibrani.
- source_word: כְּבוֹד שְׁמוֹ
  choice: kemuliaan nama-Nya
  rationale: Ungkapan ini dipertahankan dekat dengan susunan Ibrani tanpa menambahkan kata ‘yang layak bagi’. ‘Nama’ dapat mencakup karakter dan reputasi yang dinyatakan, tetapi terjemahan tidak mempersempit maknanya.
- source_word: שְׂאוּ
  choice: bawalah
  rationale: Walaupun verba ini pada dasarnya berarti ‘angkatlah’ atau ‘pikullah’, bersama מִנְחָה maknanya secara wajar adalah membawa persembahan.
- source_word: מִנְחָה
  choice: persembahan
  rationale: Istilah ini dapat berarti pemberian, upeti, atau persembahan. Dalam konteks ibadah, ‘persembahan’ merupakan padanan luas yang alami tanpa membatasinya secara tidak perlu pada persembahan sajian.
- source_word: וּבֹאוּ
  choice: dan masuklah
  rationale: Verba berarti ‘datanglah’, tetapi frasa arah menuju pelataran tempat kudus secara alami menyiratkan masuk. ‘Masuklah’ mengungkapkan gerak itu dengan jelas dalam bahasa Indonesia.
- source_word: לְחַצְרוֹתָיו
  choice: ke pelataran-pelataran-Nya
  rationale: Bentuk Ibrani bersifat jamak dan menunjuk pada pelataran kompleks tempat kudus. Pengulangan ‘pelataran-pelataran’ mempertahankan jumlah jamak sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Makna memberikan kemuliaan kepada Allah
  choice: Berikanlah kepada Yahweh kemuliaan nama-Nya
  alternative: Akuilah kemuliaan yang layak bagi nama Yahweh
  rationale: Terjemahan utama mempertahankan metafora dan susunan sumber. Maknanya mencakup pengakuan serta penghormatan, tetapi kata ‘layak’ tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif dengan -lah mempertahankan seruan liturgis. Kapitalisasi pronomina ilahi mengikuti gaya penerbitan Indonesia, sedangkan bentuk jamak ‘pelataran-pelataran’ mempertahankan bentuk sumber.
