id: PSA.96.6
reference: Psalms 96:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הוֹד וְ/הָדָ֥ר לְ/פָנָ֑י/ו עֹ֥ז וְ֝/תִפְאֶ֗רֶת בְּ/מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/006.yaml
  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
translation:
  language: id
  text: Keagungan dan kemegahan ada di hadapan-Nya; kekuatan dan keindahan[a] ada di tempat kudus-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemegahan” atau “kemuliaan.” Kata Ibrani תִפְאֶרֶת memiliki rentang makna tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: keagungan
  rationale: Kata ini menyatakan kebesaran yang luhur dan mengesankan. “Keagungan” alami dalam bahasa Indonesia dan tetap dapat dibedakan dari הָדָר.
- source_word: הָדָר
  choice: kemegahan
  rationale: Dalam pasangan puitis dengan הוֹד, kata ini menunjuk pada kemuliaan atau kebesaran yang tampak. “Kemegahan” mempertahankan nuansa luhur dan megah tanpa mengulang “keagungan”.
- source_word: לְפָנָיו
  choice: ada di hadapan-Nya
  rationale: Ungkapan ini secara harfiah berarti “di hadapan-Nya.” Kata “ada” melengkapi klausa nominal agar jelas dan alami dalam bahasa Indonesia sambil mempertahankan gambaran kehadiran di hadapan Allah.
- source_word: עֹז
  choice: kekuatan
  rationale: Kata עֹז lazim berarti kekuatan atau keperkasaan. “Kekuatan” jelas bagi pembaca modern dan sesuai dengan kesejajaran puitisnya.
- source_word: תִפְאֶרֶת
  choice: keindahan
  rationale: Kata ini dapat berarti keindahan, kemegahan, atau kemuliaan. “Keindahan” mempertahankan dimensi estetisnya dan menghindari pengulangan istilah pada baris pertama; alternatif penting dicatat dalam catatan kaki.
- source_word: בְּמִקְדָּשׁוֹ
  choice: di tempat kudus-Nya
  rationale: מִקְדָּשׁ menunjuk pada tempat yang kudus atau tempat suci. “Tempat kudus-Nya” mempertahankan keluasan makna ruang sakral dan tidak mempersempit rujukannya menjadi bangunan Bait Allah.
theological_decisions:
- issue: Rujukan akhiran pronominal pada לְפָנָיו dan בְּמִקְדָּשׁוֹ
  choice: Akhiran diterjemahkan sebagai “-Nya” dan merujuk kepada TUHAN dalam konteks mazmur.
  alternative: Mengganti pronomina dengan nama “TUHAN” demi memperjelas rujukan.
  rationale: Konteks terdekat menunjukkan bahwa rujukannya ialah TUHAN, tetapi teks Ibrani ayat ini memakai pronomina. Mempertahankan “-Nya” menjaga alur puitis dan bentuk teks tanpa menambahkan nama ilahi yang tidak diulang dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dua klausa sejajar dipertahankan untuk menjaga puisi Ibrani. Huruf kapital pada pronomina “-Nya” mengikuti kelaziman ejaan religius bahasa Indonesia dan memperjelas rujukan ilahi.
