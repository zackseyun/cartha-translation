  text: נ֤וֹרָא֨וֹת בְּ/צֶ֣דֶק תַּ֭עֲנֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ מִבְטָ֥ח כָּל קַצְוֵי אֶ֝֗רֶץ וְ/יָ֣ם רְחֹקִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: id
  text: Dengan perbuatan-perbuatan dahsyat dalam keadilan Engkau menjawab kami[a], ya Allah keselamatan kami, tumpuan kepercayaan semua ujung bumi dan lautan yang jauh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengan perbuatan-perbuatan dahsyat dalam kebenaran Engkau menjawab kami.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani untuk “laut” berbentuk tunggal, tetapi dapat dipahami secara kolektif; karena itu dapat juga diterjemahkan “laut-laut yang jauh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: perbuatan-perbuatan dahsyat
  rationale: Bentuk substantival dari akar ירא menunjuk pada hal atau tindakan yang membangkitkan rasa gentar dan takjub. Kata “perbuatan-perbuatan” ditambahkan secara idiomatis karena tindakan tersirat dalam konteks karya penyelamatan Allah.
- source_word: בְּצֶ֣דֶק
  choice: dalam kebenaran
  rationale: 'Gabungan ב dengan צֶדֶק menyatakan cara atau lingkup tindakan Allah: Ia menjawab selaras dengan kebenaran-Nya. Pilihan ini juga mempertahankan cakupan moral yang lebih luas daripada sekadar keputusan hukum.'
- source_word: תַּ֭עֲנֵנוּ
  choice: Engkau menjawab kami
  rationale: Kata kerja ענה dalam Qal berarti “menjawab” atau “menanggapi”, dan sufiksnya adalah orang pertama jamak. Huruf kapital menandai sapaan langsung kepada Allah menurut kebiasaan penerbitan Alkitab bahasa Indonesia.
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: ya Allah keselamatan kami
  rationale: Frasa konstruksi Ibrani dipertahankan sebagai “Allah keselamatan kami”; “ya” membuat fungsi vokatifnya alami dalam bahasa Indonesia tanpa mengubah hubungan gramatikalnya.
- source_word: מִבְטָ֥ח
  choice: tumpuan kepercayaan
  rationale: מִבְטָח menunjuk kepada pribadi atau hal yang menjadi objek kepercayaan. “Tumpuan kepercayaan” lebih alami dalam bahasa Indonesia daripada “kepercayaan” saja dan tidak menggeser maknanya menjadi tempat perlindungan.
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: seluruh ujung bumi
  rationale: Ungkapan Ibrani ini merujuk pada wilayah-wilayah bumi yang paling jauh. “Seluruh ujung bumi” mempertahankan citra asli dan dapat dipahami dalam ragam puitis Indonesia.
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: dan lautan yang jauh
  rationale: Kata יָם berbentuk tunggal, sehingga teks utama memakai “lautan” dalam bentuk tunggal. Kemungkinan fungsi kolektifnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna צֶדֶק dalam tindakan Allah menjawab doa
  choice: kebenaran
  alternative: keadilan
  rationale: “Kebenaran” mempertahankan cakupan moral dan kesetiaan tindakan Allah, sementara “keadilan” tetap merupakan kemungkinan leksikal yang sah dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. Susunan kalimat mengikuti paralelisme Ibrani sejauh tetap wajar; ungkapan “ujung bumi” dan “Allah keselamatan kami” dipertahankan sebagai citra serta konstruksi teologis teks sumber.
