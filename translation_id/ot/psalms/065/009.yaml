source:
  edition: WLC
  text: פָּקַ֥דְתָּ הָ/אָ֨רֶץ וַ/תְּשֹׁ֪קְקֶ֡/הָ רַבַּ֬ת תַּעְשְׁרֶ֗/נָּה פֶּ֣לֶג אֱ֭לֹהִים מָ֣לֵא מָ֑יִם תָּכִ֥ין דְּ֝גָנָ֗/ם כִּי כֵ֥ן תְּכִינֶֽ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: id
  text: Engkau memperhatikan bumi dan mengairinya; Engkau membuatnya sangat subur. Sungai Allah[a] penuh dengan air. Engkau menyiapkan gandum mereka[b], sebab begitulah Engkau menyiapkan bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aliran Allah” atau “saluran air Allah.” Ungkapan Ibrani ini bersifat puitis dan dapat membangkitkan gambaran tentang sumber surgawi bagi hujan dan kesuburan.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyediakan gandum mereka” atau “meneguhkan gandum mereka.” Kata kerja Ibrani ini dapat berarti “menyiapkan,” “menyediakan,” atau “meneguhkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: memperhatikan
  rationale: Kata פקד dapat berarti mengunjungi, memperhatikan, atau mengurus. Dalam konteks kesuburan yang dianugerahkan Allah, “memperhatikan” menyampaikan tindakan ilahi yang penuh kepedulian secara alami dalam bahasa Indonesia modern.
- source_word: וַתְּשֹׁקְקֶהָ
  choice: dan mengairinya
  rationale: Dalam konteks pertanian, bentuk ini menunjuk pada pemberian air kepada tanah. “Mengairinya” mempertahankan gambaran konkret dan sesuai dengan pemakaian bahasa Indonesia.
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: Engkau membuatnya sangat subur
  rationale: Bentuk kausatif dari עשר berarti membuat kaya, dengan רבת sebagai penguat. Untuk tanah, “membuatnya sangat subur” mengungkapkan kelimpahan yang dimaksud secara wajar tanpa menghilangkan hubungan sebab-akibatnya.
- source_word: פֶּלֶג אֱלֹהִים
  choice: Sungai Allah
  rationale: פלג dapat berarti sungai, aliran, atau saluran air. Terjemahan ini mempertahankan ungkapan puitis dan konstruksi kepunyaan dalam bahasa Ibrani.
- source_word: מָלֵא מָיִם
  choice: penuh dengan air
  rationale: Terjemahan langsung dan alami yang mempertahankan gambaran kelimpahan air.
- source_word: תָּכִין דְּגָנָם
  choice: Engkau menyiapkan gandum mereka
  rationale: כון dalam bentuk Hifil dapat berarti menyiapkan, menyediakan, atau menegakkan. “Menyiapkan” mempertahankan kaitan leksikal dengan kata kerja yang diulang pada akhir ayat, sedangkan “mereka” mempertahankan akhiran jamak maskulin pada דגנם.
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: sebab begitulah Engkau menyiapkan bumi
  rationale: Akhiran feminin tunggal merujuk kembali kepada bumi. Penyebutan “bumi” secara eksplisit membuat rujukannya jelas dalam bahasa Indonesia dan pengulangan “menyiapkan” mempertahankan pengulangan Ibraninya.
theological_decisions:
- issue: Rujukan akhiran jamak pada דְּגָנָם (“gandum mereka”)
  choice: Mempertahankan kata ganti jamak sebagai “gandum mereka”, dengan kemungkinan bahwa “mereka” adalah orang-orang yang menerima hasil bumi.
  alternative: Menerjemahkannya secara lebih umum sebagai hasil bumi tanpa menyatakan penerima manusia.
  rationale: Akhiran tersebut berbentuk jamak maskulin, sehingga tidak sama dengan “bumi” yang feminin tunggal. Mempertahankan “mereka” menjaga perbedaan gramatikal dan tidak menutup ketegangan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan sapaan ilahi “Engkau”. Susunan paralel ayat dipertahankan, sementara pilihan kata dibuat cukup alami bagi pembaca umum. Penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskan.
