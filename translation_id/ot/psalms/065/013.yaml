base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: id
  text: Padang-padang rumput berselubungkan kawanan domba[a], dan lembah-lembah menyelimuti diri dengan biji-bijian; mereka bersorak-sorai, ya, mereka bernyanyi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Padang-padang penggembalaan berselubungkan kawanan domba." Kata Ibrani ini dapat menunjuk pada padang rumput atau padang penggembalaan dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: 'Bentang alam dipersonifikasikan: padang-padang rumput dan lembah-lembah digambarkan seolah-olah dapat bersorak-sorai dan bernyanyi.'
    reason: cultural_note
lexical_decisions:
- source_word: לָבְשׁוּ
  choice: berselubungkan
  rationale: Mempertahankan metafora harfiah tentang tanah yang seolah-olah mengenakan kawanan ternak, sekaligus terdengar puitis dan wajar dalam bahasa Indonesia.
- source_word: כָרִים
  choice: padang-padang rumput
  rationale: Dalam kesejajaran dengan lembah dan dengan kawanan ternak sebagai penutupnya, kata ini paling mungkin menunjuk pada padang penggembalaan, bukan domba jantan.
- source_word: הַצֹּאן
  choice: kawanan ternak
  rationale: Nomina kolektif ini menunjuk pada ternak kecil, terutama domba dan kambing; 'kawanan ternak' mempertahankan keluasan maknanya tanpa membatasinya hanya pada domba.
- source_word: וַעֲמָקִים
  choice: dan lembah-lembah
  rationale: Padanan langsung dan alami bagi bentuk jamak Ibrani, serta sesuai dengan gambaran bentang alam dalam puisi.
- source_word: יַעַטְפוּ
  choice: menyelimuti diri
  rationale: Bentuk aktif dengan lembah sebagai subjek dipertahankan sehingga personifikasi yang hidup tidak diubah menjadi konstruksi pasif.
- source_word: בָר
  choice: gandum
  rationale: Dalam konteks hasil ladang, 'gandum' merupakan ungkapan Indonesia yang alami, meskipun kata Ibrani dapat merujuk pada biji-bijian secara lebih umum; keluasan itu dicatat dalam catatan kaki.
- source_word: יִתְרוֹעֲעוּ
  choice: bersorak-sorai
  rationale: Menyampaikan seruan nyaring penuh sukacita yang dimaksud dalam konteks pujian ciptaan.
- source_word: אַף
  choice: bahkan
  rationale: Partikel ini memberi penegasan dan peningkatan pada klausa sejajar berikutnya; 'bahkan' mempertahankan gerak klimaktis dari bersorak menuju bernyanyi.
- source_word: יָשִׁירוּ
  choice: bernyanyi
  rationale: Padanan langsung dan alami yang mempertahankan puncak paralelisme puitis.
