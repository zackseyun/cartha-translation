  text: וַ/יִּ֤ירְא֨וּ יֹשְׁבֵ֣י קְ֭צָוֺת מֵ/אוֹתֹתֶ֑י/ךָ מ֤וֹצָֽאֵי בֹ֖קֶר וָ/עֶ֣רֶב תַּרְנִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: id
  text: Mereka yang tinggal di ujung-ujung bumi takut karena tanda-tanda-Mu[a]; Engkau membuat fajar dan senja bersorak-sorai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “takjub penuh hormat karena tanda-tanda-Mu.” Kata Ibrani ini dapat menyatakan rasa takut, gentar, atau ketakjuban penuh hormat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “keluarnya pagi dan petang.” Ungkapan puitis ini dapat merujuk pada kemunculan fajar dan senja, atau pada tempat maupun waktu keduanya muncul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: takut
  rationale: Kata ירא dapat menyatakan rasa takut, gentar, atau ketakjuban penuh hormat. Pilihan “takut” mempertahankan keluasan maknanya tanpa membatasi respons itu hanya sebagai kengerian atau penghormatan.
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: penduduk di ujung-ujung bumi
  rationale: Ungkapan ini secara harfiah menunjuk kepada orang-orang yang tinggal di berbagai ujung atau tempat terjauh; “bumi” ditambahkan secara idiomatis sesuai cakupan universal konteks.
- source_word: מֵאוֹתֹתֶיךָ
  choice: karena tanda-tanda-Mu
  rationale: Preposisi מִן setelah verba takut dapat menyatakan sebab. Terjemahan ini menunjukkan bahwa tanda-tanda Allah membangkitkan respons tersebut.
- source_word: אוֹתֹתֶיךָ
  choice: tanda-tanda-Mu
  rationale: אוֹת paling langsung berarti “tanda” dan di sini merujuk kepada tindakan yang menyatakan kuasa Allah; “keajaiban” akan lebih interpretatif.
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: tempat terbitnya pagi dan datangnya petang
  rationale: מוֹצָאֵי secara harfiah berarti “tempat-tempat keluar” atau “kemunculan-kemunculan.” Rumusan ini mempertahankan gambaran puitis tentang munculnya pagi dan petang serta tidak menutup kemungkinan nuansa tempat atau waktu.
- source_word: תַּרְנִין
  choice: Kaubuat bersorak-sorai
  rationale: Bentuk Hifil dari רנן berarti menyebabkan berseru atau bernyanyi dengan sukacita. “Kaubuat bersorak-sorai” mempertahankan kausatif dan daya puitisnya.
theological_decisions:
- issue: Sifat respons manusia terhadap tanda-tanda Allah
  choice: takut
  alternative: takjub penuh hormat; gentar
  rationale: Bahasa Ibrani mencakup rasa takut, gentar, dan penghormatan. Teks utama mempertahankan ketegangan tersebut, sedangkan catatan kaki menjelaskan rentang maknanya tanpa menetapkan satu tafsiran teologis.
- issue: Makna מוֹצָאֵי pagi dan petang
  choice: tempat terbitnya pagi dan datangnya petang
  alternative: kemunculan pagi dan petang; pagi dan petang
  rationale: Ungkapan Ibrani dapat dipahami secara temporal maupun dengan nuansa geografis. Terjemahan mempertahankan metafora “keluar/terbit” dan catatan kaki menyatakan ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang wajar bagi Mazmur. Bentuk “Kaubuat” menjaga sapaan langsung kepada Allah; “bersorak-sorai” mempertahankan personifikasi kosmis dan suasana sukacita.
