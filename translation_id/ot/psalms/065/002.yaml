id: PSA.65.2
reference: Psalms 65:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שֹׁמֵ֥עַ תְּפִלָּ֑ה עָ֝דֶ֗י/ךָ כָּל בָּשָׂ֥ר יָבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: id
  text: 'Engkau yang mendengarkan doa,

    kepada-Mu semua manusia[a] akan datang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “segala daging”; sebuah ungkapan puitis Ibrani untuk seluruh umat manusia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: yang mendengarkan
  rationale: Partisipel Qal ini menyifatkan Allah sebagai Dia yang mendengar doa. Bentuk relatif ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa tindakan yang berkelanjutan.
- source_word: תְּפִלָּה
  choice: doa
  rationale: Nomina tunggal ini dipakai secara umum atau kolektif, sehingga 'doa' tanpa penentu paling tepat menyatakan doa sebagai suatu kategori.
- source_word: עָדֶיךָ
  choice: kepada-Mu
  rationale: Preposisi dengan sufiks orang kedua tunggal menyatakan arah gerak menuju Allah. Bentuk '-Mu' juga sesuai dengan sapaan langsung kepada Allah.
- source_word: כָּל בָּשָׂר
  choice: semua manusia
  rationale: Secara harfiah berarti 'segala daging', tetapi dalam konteks ini merupakan ungkapan puitis yang mencakup seluruh umat manusia. 'Semua manusia' menyampaikan acuannya secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יָבֹאוּ
  choice: akan datang
  rationale: Bentuk imperfek orang ketiga jamak dapat menyatakan tindakan yang akan terjadi; 'akan datang' mempertahankan arah pandang ke depan dalam ayat ini.
theological_decisions:
- issue: Cakupan כָּל בָּשָׂר
  choice: seluruh umat manusia, diterjemahkan 'semua manusia'
  alternative: '''segala daging'' atau ''semua yang hidup'''
  rationale: Ungkapan Ibrani ini memiliki cakupan universal dan dalam konteks kedatangan kepada Allah menunjuk kepada manusia. Terjemahan utama dibuat alami tanpa mempersempit universalitasnya; citra harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis. Susunan dua baris mempertahankan kesejajaran mazmur; 'kepada-Mu' diletakkan di awal baris kedua untuk mempertahankan penekanan arah kepada Allah.
