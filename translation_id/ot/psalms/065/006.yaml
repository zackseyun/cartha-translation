  text: 'yang meneguhkan gunung-gunung dengan kuasa-Nya,

    yang berikat pinggang dengan keperkasaan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang menegakkan gunung-gunung dengan kekuatan-Nya, yang berikat pinggang dengan kuasa.”'
    reason: Alternatif leksikal untuk מֵכִין, כֹחוֹ, נֶאְזָר, dan גְבוּרָה.
lexical_decisions:
- source_word: מֵכִין
  choice: menegakkan
  rationale: Bentuk partisipel Hifil dari כון menyatakan tindakan membuat sesuatu teguh atau tetap. Dalam konteks gunung-gunung, “menegakkan” menyampaikan kestabilan yang Allah berikan tanpa mempersempit maknanya menjadi penciptaan dari ketiadaan.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak ini secara langsung berarti gunung-gunung; bahasa Indonesia tidak memerlukan penanda khusus untuk artikel Ibrani dalam konteks ini.
- source_word: בְּכֹחוֹ
  choice: dengan kuasa-Nya
  rationale: כֹּחַ dapat berarti kekuatan atau kuasa, sedangkan בְּ menyatakan sarana. “Dengan kuasa-Nya” alami dalam bahasa Indonesia dan menunjukkan bahwa kuasa Allah merupakan sarana peneguhan tersebut.
- source_word: נֶאְזָר
  choice: yang berikatpinggangkan
  rationale: Partisipel Nifal dari אזר menggambarkan keadaan telah mengikatkan sesuatu pada pinggang atau memperlengkapi diri. Ungkapan ini mempertahankan metafora jasmani dan alur deskriptif puisi Ibrani.
- source_word: בִּגְבוּרָה
  choice: keperkasaan
  rationale: גְּבוּרָה menunjuk pada kekuatan besar, daya, atau keperkasaan. “Keperkasaan” cocok dengan metafora ikat pinggang dan menghindari pengulangan kata “kuasa”.
theological_decisions:
- issue: Hubungan kedua partisipel
  choice: 'Keduanya diterjemahkan sebagai klausa relatif yang menggambarkan Allah: “yang menegakkan ... yang berikatpinggangkan ...”'
  alternative: 'Klausa kedua dapat dibuat lebih predikatif: “Ia berikatpinggangkan keperkasaan.”'
  rationale: Bahasa Ibrani menempatkan dua partisipel secara berurutan. Dua klausa relatif mempertahankan kesejajaran deskriptif itu secara wajar dalam bahasa Indonesia tanpa menentukan hubungan verbal tambahan.
- issue: Metafora kekuatan ilahi
  choice: Mempertahankan gambaran mengikat keperkasaan pada pinggang
  alternative: Metafora dapat diperjelas secara dinamis menjadi “yang diperlengkapi dengan keperkasaan” atau diabstrakkan menjadi “yang penuh kekuatan.”
  rationale: Teks sumber memakai gambaran berikat pinggang untuk menyatakan kesiapan dan kekuatan. Mempertahankannya menjaga daya puitis serta tidak mereduksi ungkapan tersebut menjadi pernyataan abstrak.
translation_notes:
  register: Bahasa puitis, modern, dan khidmat. “Berikatpinggangkan” sengaja dipakai untuk mempertahankan metafora Ibrani, sementara catatan kaki menyediakan padanan yang lebih langsung. Huruf kapital pada “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
