  text: לְ/ךָ֤ דֻֽמִיָּ֬ה תְהִלָּ֓ה אֱלֹ֘הִ֥ים בְּ/צִיּ֑וֹן וּ֝/לְ/ךָ֗ יְשֻׁלַּם נֶֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/001.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: id
  text: Bagi-Mu[a], keheningan adalah pujian, ya Allah, di Sion, dan kepada-Mu nazar akan ditunaikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pujian menanti-Mu dalam keheningan, ya Allah, di Sion,” atau, “Bagi-Mu ada pujian dalam keheningan, ya Allah, di Sion.” Ungkapan Ibraninya eliptis dan dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: keheningan
  rationale: Kata benda ini lazim berarti keheningan atau keadaan sunyi. Pilihan ini mempertahankan ungkapan puitis Ibrani yang mencolok tanpa mengubahnya menjadi parafrasa tafsiran.
- source_word: תְהִלָּה
  choice: pujian
  rationale: Makna bakunya adalah pujian. Dalam klausa tanpa verba ini, kata tersebut dipasangkan dengan 'keheningan' sehingga paradoks puitis teks tetap terasa.
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: Bagi-Mu, keheningan adalah pujian
  rationale: Ungkapan Ibrani ini eliptis dan tidak memiliki verba eksplisit. Terjemahan ini mempertahankan kedua kata bendanya serta ketegangan puitisnya tanpa menambahkan verba seperti 'menanti'.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, dalam konteks ini kata tersebut jelas merujuk kepada Allah Israel yang esa.
- source_word: בְּצִיּוֹן
  choice: di Sion
  rationale: Preposisi בְּ menyatakan lokasi; 'di Sion' merupakan padanan Indonesia yang alami dan tepat.
- source_word: יְשֻׁלַּם
  choice: akan dibayar
  rationale: Bentuk Pual dari שלם menyatakan bahwa sesuatu yang dijanjikan ditunaikan atau dibayar. Bersama 'nazar', pilihan ini mempertahankan gambaran konkret tentang menyerahkan apa yang telah dijanjikan kepada Allah.
- source_word: נֶדֶר
  choice: nazar
  rationale: '''Nazar'' adalah istilah Indonesia yang baku dan luas dipahami untuk janji khidmat yang dibuat kepada Allah; maknanya tidak dipersempit menjadi persembahan nazar saja.'
theological_decisions:
- issue: Penafsiran frasa eliptis לְךָ דֻמִיָּה תְהִלָּה
  choice: Keheningan itu sendiri disajikan sebagai pujian kepada Allah.
  alternative: 'Pujian menanti-Mu dalam keheningan, ya Allah, di Sion; atau: Bagi-Mu ada pujian dalam keheningan, ya Allah, di Sion.'
  rationale: Teks Ibrani tidak memuat verba eksplisit dan memungkinkan beberapa susunan makna. Bacaan utama mempertahankan ketegangan puitis tersebut, sedangkan catatan kaki mengakui alternatif yang sungguh dimungkinkan oleh bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi ditulis dengan huruf kapital. Susunan yang agak tidak biasa dipertahankan untuk menjaga paradoks dan ambiguitas asli, sementara catatan kaki menawarkan pembacaan alternatif.
