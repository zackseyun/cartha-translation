  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: id
  text: Basahilah alur-alurnya hingga jenuh dan ratakanlah gundukan-gundukannya. Dengan hujan lebat Engkau melunakkannya; Engkau memberkati pertumbuhannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּלָמֶיהָ
  choice: alur-alurnya
  rationale: Menunjuk pada alur-alur tanah yang dibajak; bentuk posesif feminin merujuk pada tanah dalam konteks mazmur.
- source_word: רַוֵּה
  choice: membasahi ... hingga jenuh
  rationale: Bentuk intensif dari רוה menyatakan pemberian air secara berlimpah, bukan sekadar membasahi permukaan.
- source_word: נַחֵת גְּדוּדֶיהָ
  choice: meratakan gundukan-gundukannya
  rationale: נחת di sini menggambarkan membuat bagian tanah yang meninggi turun atau mengendap, sedangkan גְּדוּדִים dalam konteks pertanian adalah gundukan atau galengan tanah.
- source_word: בִּרְבִיבִים
  choice: dengan hujan lebat
  rationale: רְבִיבִים menunjuk pada curahan atau hujan yang berlimpah.
- source_word: תְּמֹגְגֶנָּה
  choice: Engkau melunakkan tanah
  rationale: Secara harfiah berarti membuatnya mencair atau larut; dalam konteks tanah yang menerima hujan, maknanya ialah melunakkan. Nomina 'tanah' memperjelas rujukan sufiks feminin tanpa mengubah gambaran.
- source_word: צִמְחָהּ
  choice: segala yang tumbuh darinya
  rationale: Nomina kolektif ini berarti pertumbuhan atau hasil yang bertunas; ungkapan Indonesia ini mempertahankan cakupan kolektif dan hubungan dengan tanah.
theological_decisions:
- issue: Peralihan dari bentuk suruhan Ibrani ke pernyataan tentang tindakan Allah
  choice: Merender seluruh ayat sebagai pernyataan langsung dengan subjek 'Engkau'
  alternative: Basahilah alur-alurnya ... ratakanlah gundukan-gundukannya
  rationale: Dalam konteks pujian, bentuk awal berfungsi menggambarkan karya Allah dan diikuti bentuk verbal yang secara alami menyatakan tindakan-Nya. Pilihan ini menghasilkan kesinambungan wacana tanpa mengubah Allah sebagai pelaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Pengulangan 'Engkau' mempertahankan sapaan langsung kepada Allah dan memperjelas pelaku tindakan.
