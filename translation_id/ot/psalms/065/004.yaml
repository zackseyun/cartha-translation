  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַשְׁרֵ֤י תִּֽבְחַ֣ר וּ/תְקָרֵב֮ יִשְׁכֹּ֪ן חֲצֵ֫רֶ֥י/ךָ נִ֭שְׂבְּעָה בְּ/ט֣וּב בֵּיתֶ֑/ךָ קְ֝דֹ֗שׁ הֵיכָלֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: id
  text: Berbahagialah orang yang Kaupilih dan Kau dekatkan untuk tinggal di pelataran-Mu.[a] Kami akan dipuaskan dengan kebaikan rumah-Mu,[b] dengan kekudusan bait-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Betapa bahagianya orang yang Kaupilih dan Kau dekatkan, agar ia tinggal di pelataran-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: “Kebaikan” juga dapat diterjemahkan “hal-hal yang baik” atau “kelimpahan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk seruan ini memperkenalkan ucapan bahagia. “Berbahagialah” alami dalam bahasa Indonesia Alkitabiah dan tidak membatasi maknanya pada perasaan senang.
- source_word: תִּבְחַר
  choice: Kaupilih
  rationale: Menyatakan tindakan memilih secara lugas, tanpa memasukkan istilah teologis teknis yang tidak dituntut oleh teks.
- source_word: וּתְקָרֵב
  choice: Kaubawa mendekat
  rationale: Bentuk kausatif verba Ibrani menunjukkan bahwa Allah membuat orang itu datang dekat; pilihan ini mempertahankan prakarsa Allah.
- source_word: יִשְׁכֹּן
  choice: untuk tinggal
  rationale: Imperfek orang ketiga tunggal dipahami sebagai hasil atau tujuan dari tindakan memilih dan membawa mendekat; konstruksi infinitif ini wajar dalam bahasa Indonesia.
- source_word: חֲצֵרֶיךָ
  choice: pelataran-Mu
  rationale: Dalam konteks rumah ibadah, kata ini menunjuk pada pelataran-pelataran kompleks suci. Bentuk tunggal kolektif “pelataran” paling alami dalam bahasa Indonesia.
- source_word: נִשְׂבְּעָה
  choice: Kami akan dikenyangkan
  rationale: Bentuk kohortatif dapat menyatakan harapan atau keyakinan yang kuat. “Akan dikenyangkan” mempertahankan gambaran kepuasan yang penuh dan alur deklaratif ayat.
- source_word: בְּטוּב
  choice: dengan kebaikan
  rationale: טוּב dapat berarti sifat kebaikan maupun segala pemberian baik atau kelimpahan. “Kebaikan” mempertahankan keluasan makna itu.
- source_word: בֵּיתֶךָ
  choice: rumah-Mu
  rationale: Dalam kesejajaran dengan pelataran dan bait, kata ini menunjuk secara konkret pada rumah Allah sebagai tempat ibadah.
- source_word: קְדֹשׁ
  choice: kekudusan
  rationale: Nomina ini menyatakan sifat atau kenyataan yang kudus dan berhubungan erat dengan “bait-Mu”; “kekudusan” mempertahankan ungkapan abstraknya tanpa mengubahnya menjadi tafsiran tempat.
- source_word: הֵיכָלֶךָ
  choice: bait-Mu
  rationale: Dalam konteks ibadah dan kesejajaran dengan rumah serta pelataran Allah, הֵיכָל menunjuk pada bait suci, bukan istana biasa.
theological_decisions:
- issue: Pemilihan ilahi dan kedekatan dalam ibadah
  choice: Mempertahankan pernyataan langsung bahwa Allah memilih dan membawa seseorang mendekat.
  alternative: Memakai istilah teknis seperti “menetapkan sejak semula”, atau membatasi ungkapan ini hanya pada pengangkatan petugas ibadah.
  rationale: Teks menegaskan prakarsa Allah dalam memberi akses kepada-Nya, tetapi tidak menjelaskan cakupan atau sistem doktrinal pemilihan tersebut.
- issue: Bahasa akses ke bait
  choice: Mempertahankan gambaran konkret “pelataran”, “rumah”, dan “bait”.
  alternative: Mengganti semuanya dengan ungkapan abstrak seperti “hadirat-Mu”.
  rationale: Latar ibadah Israel dan citra ruang sucinya merupakan bagian nyata dari ayat dan tidak boleh dispiritualkan dalam terjemahan.
- issue: Daya kohortatif נִשְׂבְּעָה
  choice: “Kami akan dikenyangkan” sebagai pernyataan harapan yang penuh keyakinan.
  alternative: “Kiranya kami dikenyangkan” sebagai permohonan atau harapan eksplisit.
  rationale: Kohortatif memungkinkan nuansa volitif, tetapi dalam konteks ucapan bahagia bentuk deklaratif mengungkapkan keyakinan tanpa meniadakan unsur harapan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. “Bait” dipakai sebagai istilah umum yang tetap mudah dikenali untuk tempat ibadah Allah; struktur paralel Ibrani dipertahankan tanpa membuat kalimat menjadi kaku.
