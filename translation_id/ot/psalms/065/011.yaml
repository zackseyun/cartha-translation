  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: id
  text: Engkau memahkotai tahun dengan kebaikan-Mu, dan lintasan-lintasan-Mu meneteskan kelimpahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kegemukan”; sebuah gambaran Ibrani tentang kesuburan dan persediaan yang berlimpah. “Lintasan-lintasan-Mu” juga dapat diterjemahkan “jalur-jalur-Mu” atau “bekas-bekas roda-Mu”; gambaran ini mungkin membayangkan perjalanan Allah yang meninggalkan kesuburan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: Engkau memahkotai
  rationale: Bentuk verba ini berarti ‘memahkotai’, ‘mengelilingi’, atau ‘menghiasi’. ‘Memahkotai’ mempertahankan metafora hidup tentang Allah yang menyempurnakan tahun dengan berkat-Nya.
- source_word: שְׁנַת טוֹבָתֶךָ
  choice: tahun dengan kebaikan-Mu
  rationale: Frasa konstruksi Ibrani secara harfiah dapat dipahami sebagai ‘tahun kebaikan-Mu’. Ungkapan ‘tahun dengan kebaikan-Mu’ terdengar alami dalam bahasa Indonesia dan mempertahankan makna bahwa kebaikan Allah menjadi mahkota tahun itu.
- source_word: וּמַעְגָּלֶיךָ
  choice: dan jejak-jejak-Mu
  rationale: מַעְגָּל dapat berarti jalur, lintasan, atau bekas roda. ‘Jejak-jejak-Mu’ mempertahankan gambaran konkret tentang perjalanan atau arak-arakan ilahi yang meninggalkan kesuburan, tanpa membatasi gambaran itu secara pasti pada roda kereta.
- source_word: יִרְעֲפוּן
  choice: meneteskan
  rationale: Verba ini menggambarkan tindakan menetes, menitikkan, atau mencurahkan. ‘Meneteskan’ menjaga citraan konkret dalam puisi Ibrani.
- source_word: דָּשֶׁן
  choice: kelimpahan
  rationale: Secara harfiah kata ini menunjuk pada ‘kegemukan’ atau ‘kemakmuran’, lalu secara kiasan pada kesuburan dan persediaan yang berlimpah. ‘Kelimpahan’ menyampaikan maksudnya secara wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penggambaran berkat Allah atas tahun dan tanah
  choice: Mempertahankan metafora bahwa Allah memahkotai tahun dan jejak-Nya meneteskan kelimpahan
  alternative: Menguraikannya secara langsung sebagai Allah memberkati musim panen dengan hasil berlimpah
  rationale: Teks Ibrani sengaja memakai gambaran puitis dan mengaitkan kesuburan dengan tindakan Allah. Mempertahankan metafora menghindari penyempitan makna menjadi penjelasan prosa semata.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Sapaan ‘Engkau’ serta akhiran ‘-Mu’ dipakai untuk Allah. ‘Jejak-jejak’ dipilih alih-alih ‘jalan-jalan’ agar citraan lintasan yang meninggalkan kelimpahan tetap terasa.
