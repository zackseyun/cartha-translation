  text: Words of iniquity have prevailed against me[b][a]; our transgressions—you will atone for them.
translation:
  language: id
  text: Berbagai kesalahan telah menguasai aku[a]; pelanggaran-pelanggaran kami—Engkau akan mengadakan pendamaian bagi pelanggaran-pelanggaran itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Perkara-perkara kesalahan telah menjadi terlalu kuat bagiku.” Ungkapan Ibraninya padat dan dapat menunjuk pada berbagai kesalahan atau perkara yang berkaitan dengan kesalahan.'
    reason: lexical_alternative
  - marker: b
    text: Atau “Engkau akan menutupi pelanggaran-pelanggaran itu” atau “Engkau akan menyucikan pelanggaran-pelanggaran itu.” Kata kerja Ibrani ini berarti mengadakan pendamaian bagi dosa atau menyingkirkannya; nuansa tepatnya ditentukan oleh konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי עֲוֺנֹת
  choice: berbagai kesalahan
  rationale: Ungkapan Ibrani ini padat dan secara harfiah dapat dipahami sebagai “perkataan-perkataan” atau “perkara-perkara kesalahan.” “Berbagai kesalahan” menyampaikan maksudnya secara wajar dalam bahasa Indonesia tanpa menentukan secara sempit apakah עָוֹן menunjuk pada perbuatan salah, keadaan bersalah, atau akibat kesalahan.
- source_word: גָּבְרוּ מֶנִּי
  choice: telah menguasai aku
  rationale: Kata kerja גבר menyatakan menjadi kuat atau menang atas seseorang. “Telah menguasai aku” mempertahankan gambaran bahwa kesalahan lebih kuat daripada pemazmur dan mengalahkannya.
- source_word: פְּשָׁעֵינוּ
  choice: pelanggaran-pelanggaran kami
  rationale: פֶּשַׁע menunjuk pada pelanggaran yang dapat bernuansa pemberontakan. Pilihan ini jelas dan menjaga bobot moral kata tersebut tanpa mempersempitnya menjadi satu jenis pelanggaran tertentu.
- source_word: אַתָּה
  choice: Engkau
  rationale: Kata ganti yang dinyatakan secara eksplisit dalam bahasa Ibrani bersifat tegas. Huruf kapital dan tanda pisah membantu mempertahankan penekanan pada Allah sebagai pelaku.
- source_word: תְכַפְּרֵם
  choice: akan mengadakan pendamaian atasnya
  rationale: Bentuk piel dari כפר di sini menyatakan tindakan mengadakan pendamaian bagi atau menyingkirkan pelanggaran. Ungkapan ini mempertahankan bobot kultis-teologis kata tersebut dan tidak mereduksinya menjadi sekadar menyembunyikan dosa.
theological_decisions:
- issue: Makna כפר ketika pelanggaran menjadi objeknya
  choice: Engkau akan mengadakan pendamaian atasnya
  alternative: Engkau akan mengampuninya / menutupinya / menyucikannya
  rationale: “Mengadakan pendamaian” mempertahankan gagasan penghapusan dosa melalui tindakan pendamaian tanpa menetapkan teori khusus tentang cara pendamaian itu bekerja. Bentuk alternatif seperti “mengampuni” lebih mudah dipahami tetapi mengurangi bobot khas verba Ibrani, sedangkan “menutupi” dapat disalahpahami sebagai hanya menyembunyikan kesalahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Berbagai kesalahan” dipilih agar ungkapan pembuka yang sangat padat terdengar alami, sementara catatan kaki mempertahankan bentuk dan ambiguitas Ibraninya. Tanda pisah mencerminkan penekanan pada אַתָּה.
