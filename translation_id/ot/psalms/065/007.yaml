id: PSA.65.7
reference: Psalms 65:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַשְׁבִּ֤יחַ שְׁא֣וֹן יַ֭מִּים שְׁא֥וֹן גַּלֵּי/הֶ֗ם וַ/הֲמ֥וֹן לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/007.yaml
  text: stilling the roar of the seas[a], the roar of their waves[b], and the tumult of the peoples.
translation:
  language: id
  text: yang meredakan gemuruh lautan[a], gemuruh gelombang-gelombangnya, dan kegaduhan bangsa-bangsa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menenangkan” atau “menundukkan.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kegaduhan” dapat berarti keributan yang riuh dan, dalam konteks tertentu, sejumlah besar orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּיחַ
  choice: yang meredakan
  rationale: Partisipel Hifil menggambarkan Dia yang menyebabkan bunyi gaduh berhenti atau menjadi tenang. Frasa relatif ini mempertahankan daya deskriptif partisipel dan menyambung secara alami dengan konteks mazmur.
- source_word: שְׁאוֹן
  choice: gemuruh
  rationale: Kata ini menunjuk pada bunyi keras atau hiruk-pikuk. 'Gemuruh' cocok bagi lautan dan gelombang, dan pengulangannya mempertahankan repetisi Ibrani.
- source_word: יַמִּים
  choice: lautan
  rationale: Bentuk Ibrani adalah jamak. Dalam bahasa Indonesia, 'lautan' secara alami dapat menyatakan hamparan-hamparan laut secara kolektif tanpa memaksakan rujukan pada satu laut tertentu.
- source_word: גַּלֵּיהֶם
  choice: gelombang-gelombangnya
  rationale: Akhiran orang ketiga jamak merujuk kembali kepada lautan. Bahasa Indonesia lazim memakai '-nya' untuk rujukan kolektif tersebut; pengulangan nomina menampilkan kejamakan gelombang.
- source_word: הֲמוֹן
  choice: kegaduhan
  rationale: Dalam kesejajaran dengan gemuruh laut, makna yang paling sesuai ialah keributan atau hiruk-pikuk, bukan semata-mata jumlah orang yang banyak.
- source_word: לְאֻמִּים
  choice: bangsa-bangsa
  rationale: Istilah ini menunjuk kepada kelompok-kelompok bangsa. 'Bangsa-bangsa' alami dalam puisi Alkitab Indonesia dan tidak harus dibatasi pada negara-bangsa modern.
theological_decisions:
- issue: Cakupan kesejajaran antara kekacauan alam dan manusia
  choice: Ayat ini menggambarkan Allah sebagai Dia yang meredakan baik gemuruh lautan maupun kegaduhan bangsa-bangsa.
  alternative: Membatasi tindakan itu pada gejala alam saja, atau menafsirkannya secara khusus sebagai penaklukan politis bangsa-bangsa.
  rationale: Kesejajaran puitis Ibrani menghubungkan gemuruh laut dengan kegaduhan bangsa-bangsa. Terjemahan mempertahankan cakupan dan ketegangan ini tanpa menambahkan kerangka politik atau eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang wajar. Repetisi 'gemuruh' dipertahankan untuk mencerminkan struktur Ibrani. Semua penanda catatan kaki ditempatkan dalam teks utama.
