  terminology: '''Kegaduhan bangsa-bangsa'' menangkap הֲמוֹן לְאֻמִּים sebagai hiruk-pikuk manusia tanpa mempersempitnya menjadi penaklukan politis atau sekadar jumlah orang. Catatan kaki a memberi alternatif leksikal yang sah, sedangkan catatan b secara tepat mempertahankan kemungkinan arti terkait keramaian/jumlah besar. Penanda b ditempatkan setelah ''bangsa-bangsa'', yaitu unsur yang dijelaskannya.'
