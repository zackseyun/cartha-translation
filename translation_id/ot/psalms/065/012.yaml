lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: meneteskan air
  rationale: Kata kerja רָעַף menggambarkan air atau hujan yang menetes atau tercurah. Penambahan objek tersirat 'air' membuat citra itu wajar dalam bahasa Indonesia tanpa mengubah gambaran puitisnya.
- source_word: נְאוֹת
  choice: padang-padang rumput
  rationale: נָוֶה di sini menunjuk pada tempat penggembalaan atau padang rumput, sesuai dengan gambaran kesuburan alam.
- source_word: מִדְבָּר
  choice: belantara
  rationale: מִדְבָּר dapat berarti kawasan liar atau stepa, bukan hanya gurun pasir yang tandus. 'Belantara' mempertahankan cakupan itu dalam bahasa Indonesia.
- source_word: גִיל
  choice: sukacita
  rationale: גִיל menyatakan kegembiraan yang meluap; 'sukacita' sesuai dengan personifikasi puitis bukit-bukit.
- source_word: גְּבָעוֹת
  choice: bukit-bukit
  rationale: Padanan langsung dan alami bagi bentuk jamak גְּבָעוֹת.
- source_word: תַּחְגֹּרְנָה
  choice: berikatpinggangkan
  rationale: חָגַר berarti mengikatkan sesuatu pada pinggang. Bentuk ini mempertahankan metafora bahwa bukit-bukit mengenakan sukacita seperti ikat pinggang.
