  text: The pastures of the wilderness drip[b][a], and the hills gird themselves with rejoicing.
translation:
  language: id
  text: Padang-padang rumput di padang gurun meneteskan air[a], dan bukit-bukit berikat pinggang dengan sukacita.
  philosophy: optimal-equivalence
  footnotes:
