base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/000.yaml
  text: For the choirmaster[a]. A psalm of David[b]; a song.
translation:
  language: id
  text: Untuk pemimpin musik. Mazmur Daud[a]; sebuah nyanyian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “Mazmur Daud” dapat menunjukkan bahwa mazmur ini digubah oleh Daud, diperuntukkan baginya, atau berkaitan dengannya.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. “Pemimpin musik” alami dalam bahasa Indonesia modern, sedangkan awalan לַ־ diterjemahkan “untuk” untuk mempertahankan arah atau peruntukannya.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku untuk nyanyian keagamaan yang diiringi musik dan lazim digunakan dalam judul-judul kitab Mazmur.
- source_word: לְדָוִד
  choice: Daud
  rationale: Gabungan “Mazmur Daud” mempertahankan bentuk judul yang ringkas dan tidak secara tegas membatasi hubungan itu pada kepengarangan saja; catatan kaki menjelaskan jangkauan makna preposisi Ibrani לְ־.
- source_word: שִׁיר
  choice: sebuah nyanyian
  rationale: Istilah ini dibedakan dari מִזְמוֹר, sehingga kedua sebutan dalam judul tetap dipertahankan. “Nyanyian” merupakan padanan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Hubungan Daud dengan mazmur dalam frasa לְדָוִד
  choice: Mazmur Daud, dengan catatan mengenai ambiguitas
  alternative: Mazmur karya Daud / Mazmur untuk Daud
  rationale: Preposisi לְ־ dapat menyatakan kepengarangan, peruntukan, kepunyaan, atau keterkaitan. Teks utama tidak mempersempitnya menjadi satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat sesuai bentuk judul mazmur. Tanda titik memisahkan petunjuk bagi pemimpin musik, sedangkan titik koma menghubungkan “Mazmur Daud” dengan keterangan tambahan “sebuah nyanyian.”
