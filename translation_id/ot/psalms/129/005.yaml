  text: May all who hate Zion be put to shame and turned backward[a].
translation:
  language: id
  text: Biarlah semua orang yang membenci Sion mendapat malu dan mundur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Semua orang yang membenci Sion akan mendapat malu dan mundur.” Bentuk-bentuk kata kerja Ibrani juga dapat dipahami sebagai pernyataan tentang masa depan, bukan sebagai doa atau harapan.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: mendapat malu
  rationale: Kata kerja בוש menyatakan rasa malu, kehinaan, atau kegagalan yang memalukan. Ungkapan “mendapat malu” secara alami menyampaikan akibat berupa kehinaan dalam bahasa Indonesia dan sesuai dengan daya doa-kutukan dalam konteks ini.
- source_word: וְיִסֹּגוּ אָחוֹר
  choice: dan mundur
  rationale: Kata kerja סוּג dengan אָחוֹר berarti bergerak atau berbalik ke belakang. “Mundur” merupakan padanan Indonesia yang alami dan sudah mencakup arah ke belakang tanpa pengulangan yang janggal.
- source_word: כֹּל
  choice: semua orang
  rationale: Kuantor ini mencakup seluruh kelompok yang disebut. “Semua orang” lebih alami daripada “semua” saja sebelum klausa relatif yang menunjuk kepada manusia.
- source_word: שֹׂנְאֵי
  choice: yang membenci
  rationale: Partisipel ini secara harfiah berarti “orang-orang yang membenci”; klausa relatif “yang membenci” mempertahankan maknanya dalam bentuk Indonesia yang wajar.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Menggunakan bentuk nama tempat yang sudah baku dalam tradisi dan pemakaian Alkitab bahasa Indonesia.
theological_decisions:
- issue: Daya jussif atau prediktif dari kedua verba pembuka
  choice: 'Diterjemahkan sebagai doa atau harapan: “Biarlah ... mendapat malu dan mundur.”'
  alternative: 'Pernyataan tentang masa depan: “Semua orang yang membenci Sion akan mendapat malu dan mundur.”'
  rationale: Bentuk yiqtol dalam konteks puisi ini dapat menyampaikan permohonan atau kutukan, tetapi juga mungkin dibaca sebagai pernyataan masa depan. Teks utama mempertahankan daya doa yang paling sesuai dengan konteks, sedangkan catatan kaki menjaga kemungkinan prediktif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Biarlah” menandai daya doa tanpa memperberat kalimat; “mundur” dipilih sebagai ungkapan alami yang mencakup verba dan keterangan arah Ibrani.
