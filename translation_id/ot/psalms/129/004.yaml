base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/004.yaml
  text: Yahweh is righteous[a]; he has cut the cords of the wicked.
translation:
  language: id
  text: Yahweh itu adil; Ia telah memutus tali-tali[a] orang fasik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tambang-tambang” atau “tali-tali tebal.”'
    reason: Alternatif leksikal untuk עֲבוֹת, yang dapat merujuk pada tali atau tambang yang tebal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: צַדִּיק
  choice: benar
  rationale: Dalam predikasi tentang Yahweh, kata ini menyatakan bahwa Ia benar secara moral dan bertindak sesuai dengan keadilan. 'Benar' mempertahankan cakupan makna itu secara alami; 'adil' juga mungkin, tetapi lebih sempit.
- source_word: קִצֵּץ
  choice: telah memutuskan
  rationale: Bentuk piel perfektif menyatakan tindakan tegas memotong hingga putus. 'Telah memutuskan' alami dalam bahasa Indonesia dan mempertahankan gambaran pembebasan.
- source_word: עֲבוֹת
  choice: tali-tali pengikat
  rationale: Nomina jamak ini menunjuk pada tali, tambang, atau tali tebal yang mengikat. Pilihan ini membuat citra ikatan jelas tanpa menghilangkan sifat metaforisnya.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Adjektiva jamak ini digunakan secara substantival untuk orang-orang yang jahat. 'Orang fasik' merupakan ungkapan ringkas dan bermartabat dalam konteks mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan makna צַדִּיק
  choice: benar
  alternative: adil
  rationale: '''Benar'' dapat mencakup baik watak moral Yahweh maupun keadilan tindakan-Nya dalam membebaskan umat, sedangkan ''adil'' cenderung menonjolkan aspek yudisial saja.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Kata ganti 'Ia' dipakai untuk rujukan kepada Yahweh. Penanda catatan kaki ditempatkan setelah frasa yang memiliki variasi leksikal, bukan setelah 'benar'.
