    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Pendakian
  rationale: Mempertahankan gambaran harfiah מַעֲלוֹת (‘pendakian-pendakian/kenaikan-kenaikan’) tanpa mengunci maksud historisnya sebagai lagu ziarah, walaupun penggunaan liturgis atau ziarah mungkin tersirat.
- source_word: רַבַּת
  choice: Dengan hebat
  rationale: Dipahami secara adverbial sebagai penanda besarnya atau beratnya perlakuan yang dialami. Ungkapan ini tetap alami dalam bahasa Indonesia; kemungkinan makna frekuentatif dicatat dalam catatan kaki.
- source_word: צְרָרוּנִי
  choice: mereka telah menindas aku
  rationale: Kata kerja צרר di sini menyatakan perlakuan bermusuhan yang mendatangkan kesesakan. ‘Menindas’ cukup luas untuk konteks ratapan tanpa menentukan bentuk penindasan secara lebih sempit.
- source_word: מִנְּעוּרַי
  choice: sejak masa mudaku
  rationale: Menyatakan titik awal yang berlanjut dalam waktu dan merupakan padanan Indonesia yang alami bagi frasa temporal tersebut.
- source_word: יֹאמַר נָא
  choice: biarlah ... sekarang berkata
  rationale: Bentuk ini merupakan ajakan kepada Israel untuk mengucapkan pengakuan yang sama. ‘Sekarang’ menyampaikan daya wacana partikel נָא, bukan memahaminya sebagai permohonan sopan.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan; dalam konteks ini Israel dipanggil sebagai umat secara kolektif.
theological_decisions:
- issue: Penutur kolektif dan bingkai liturgis
  choice: Kata ganti orang pertama tunggal dipertahankan, lalu Israel diajak mengucapkan keluhan itu sebagai pengakuan bersama.
  alternative: Memahami ‘aku’ hanya sebagai seorang individu yang pengalamannya kemudian diterapkan kepada Israel.
  rationale: Klausa ‘biarlah Israel sekarang berkata’ mengundang seluruh umat mengambil ucapan ‘aku’ sebagai suara mereka, tetapi terjemahan tidak meniadakan kemungkinan adanya seorang pemimpin atau pemazmur individual yang mula-mula mengucapkannya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Tanda pisah pada akhir ayat dipertahankan untuk menunjukkan bahwa ajakan ini mengantar pada pengulangan pengakuan dalam ayat berikutnya. Istilah ‘Nyanyian Pendakian’ dipilih untuk menjaga metafora judul Ibrani dan menghindari penafsiran historis yang terlalu pasti.
