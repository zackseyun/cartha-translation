id: PSA.129.8
reference: Psalms 129:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹ֤א אָֽמְר֨וּ הָ/עֹבְרִ֗ים בִּרְכַּֽת יְהוָ֥ה אֲלֵי/כֶ֑ם בֵּרַ֥כְנוּ אֶ֝תְ/כֶ֗ם בְּ/שֵׁ֣ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/008.yaml
  text: and those who pass by do not say[a], “The blessing of Yahweh be upon you; we bless you in the name of Yahweh.”
translation:
  language: id
  text: dan orang-orang yang lewat tidak berkata, “Kiranya berkat Yahweh[a] menyertai kalian! Kami memberkati kalian dalam nama Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (nama ilahi), yang secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dan padanan tradisionalnya.
lexical_decisions:
- source_word: וְלֹא
  choice: dan ... tidak
  rationale: Mempertahankan koordinasi dan negasi Ibrani yang melanjutkan gambaran dari ayat sebelumnya.
- source_word: אָמְרוּ
  choice: berkata
  rationale: Bentuk qatal di sini menggambarkan tindakan umum yang tidak dilakukan oleh orang yang lewat; bentuk Indonesia ini alami tanpa memaksakan penandaan waktu.
- source_word: הָעֹבְרִים
  choice: orang-orang yang lewat
  rationale: Partisipel berartikel menunjuk pada suatu golongan orang dan diterjemahkan dengan frasa relatif yang wajar dalam bahasa Indonesia.
- source_word: בִּרְכַּת יְהוָה
  choice: berkat Yahweh
  rationale: Mempertahankan hubungan konstruksi Ibrani secara ringkas dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: אֲלֵיכֶם
  choice: menyertai kalian
  rationale: Klausa Ibrani tidak memiliki verba tersurat; bentuk ini menyampaikan makna optatif 'atas kalian' secara alami dalam rumusan berkat bahasa Indonesia.
- source_word: בֵּרַכְנוּ אֶתְכֶם
  choice: Kami memberkati kalian
  rationale: Menyampaikan daya performatif rumusan berkat, bukan sekadar tindakan lampau.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama Yahweh
  rationale: Mempertahankan ungkapan yang menunjukkan nama yang diserukan atau otoritas yang mendasari pemberkatan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi itu dan catatan kaki memberi tahu pembaca tentang bentuk Ibraninya serta tradisi penerjemahannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai karena kedua pronomina orang kedua dalam teks Ibrani berbentuk jamak. Tanda seru menandai rumusan berkat langsung tanpa mengubah isinya.
