translation:
  language: id
  text: Para pembajak membajak di atas punggungku; mereka membuat alur-alur bajakan mereka panjang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל גַּבִּי
  choice: di atas punggungku
  rationale: 'Mempertahankan gambaran spasial yang konkret: punggung diperlakukan seperti tanah yang dibajak.'
- source_word: חָרְשׁוּ
  choice: membajak
  rationale: Arti harfiahnya adalah membajak; bentuk lampau Ibrani tidak perlu diberi penanda aspek khusus dalam bahasa Indonesia karena konteks menyatakan tindakan yang telah dialami.
- source_word: חֹרְשִׁים
  choice: para pembajak
  rationale: Partisip Ibrani berfungsi sebagai nomina pelaku; frasa ini ringkas, wajar, dan mempertahankan metafora pertanian.
- source_word: הֶאֱרִיכוּ
  choice: membuat ... panjang
  rationale: Bentuk kausatif berarti membuat panjang atau memperpanjang; susunan ini jelas dalam bahasa Indonesia.
- source_word: לְמַעֲנוֹתָם
  choice: alur-alurnya
  rationale: Merujuk pada alur bajakan. Akhiran orang ketiga jamak dapat dipahami sebagai alur yang mereka buat; bentuk -nya lebih alami daripada 'alur-alur mereka' dan tidak menghilangkan metafora.
theological_decisions:
- issue: Gambaran metaforis tentang penderitaan Israel
  choice: Mempertahankan metafora harfiah 'membajak di atas punggungku' dan 'alur-alurnya panjang'.
  alternative: Menguraikannya sebagai pencambukan, luka panjang, atau penindasan berat.
  rationale: Teks Ibrani menyampaikan penderitaan melalui metafora pertanian tanpa menjelaskan tepatnya bentuk kekerasan itu. Terjemahan sebaiknya mempertahankan daya gambar dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan 'pembajak membajak' sengaja dipertahankan karena mencerminkan permainan akar kata חָרְשׁוּ חֹרְשִׁים dan tetap mudah dipahami.
