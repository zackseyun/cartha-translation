  text: רַ֭בַּת צְרָר֣וּ/נִי מִ/נְּעוּרָ֑/י גַּ֝ם לֹא יָ֥כְלוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/002.yaml
  text: Greatly they have afflicted me from my youth[b][a], yet they have not prevailed against me.
translation:
  language: id
  text: Mereka sudah sangat menindas aku sejak masa mudaku[a], tetapi mereka tidak berhasil mengalahkan aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka sudah berkali-kali menindas aku sejak masa mudaku.” Kata pembuka dalam bahasa Ibrani dapat menekankan beratnya penindasan atau bahwa hal itu berulang kali terjadi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka tidak mampu menguasai aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: sangat
  rationale: Bentuk ini dipahami secara adverbial untuk menekankan besarnya atau beratnya penindasan. Dalam konteks ini, “sangat” alami dalam bahasa Indonesia dan mempertahankan daya puitisnya; makna berulang, “berkali-kali”, tetap mungkin.
- source_word: צְרָרוּנִי
  choice: mereka sudah menindas aku
  rationale: Kata kerja צרר menyatakan perlakuan bermusuhan, mengimpit, atau menindas. “Menindas” cukup luas untuk mencakup permusuhan yang terus-menerus tanpa membatasinya pada serangan militer. “Sudah” merangkum pengalaman lampau yang masih relevan.
- source_word: מִנְּעוּרָי
  choice: sejak masa mudaku
  rationale: Ungkapan temporal ini menunjuk pada titik awal pada masa muda dan kelanjutan sesudahnya. “Sejak masa mudaku” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: גַּם
  choice: tetapi
  rationale: 'Dalam susunan ini, גַּם bersama penyangkalan menyampaikan kontras: sekalipun penindasan itu berat, para penindas tidak menang. “Tetapi” menyatakan hubungan adversatif itu secara jelas dan alami.'
- source_word: לֹא יָכְלוּ לִי
  choice: mereka tidak berhasil mengalahkan aku
  rationale: יכל dengan ל menyatakan ketidakmampuan untuk menguasai atau menang atas seseorang. “Tidak berhasil mengalahkan aku” mempertahankan gagasan bahwa usaha mereka gagal, bukan sekadar ketidakmampuan abstrak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Bentuk “aku” dipertahankan sesuai suara orang pertama dalam mazmur. Susunan kalimat dibuat alami tanpa menghilangkan ambiguitas רַבַּת, yang dicatat dalam catatan kaki.
