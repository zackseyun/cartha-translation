translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana. Paralelisme dua pekerja panen dipertahankan. Elipsis pada klausa kedua dilengkapi dengan kata 'memenuhi' agar jelas dalam bahasa Indonesia, tanpa mengubah makna sumber.
