  text: with which the reaper has not filled his hand[a], nor the one who gathers sheaves, his arms.
translation:
  language: id
  text: yang tidak memenuhi tangan penuai, ataupun dekapan pengumpul berkas-berkas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dadanya,” “pangkuannya,” atau “lipatan pakaiannya”—tempat batang-batang yang dikumpulkan ditampung.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁלֹּא
  choice: yang dengannya ... tidak
  rationale: Partikel relatif dengan negasi merujuk kembali kepada rumput di atas atap pada ayat sebelumnya. Ungkapan ini mempertahankan hubungan tersebut secara jelas dan wajar dalam bahasa Indonesia.
- source_word: מִלֵּא
  choice: memenuhi
  rationale: 'Bentuk perfektif menyatakan hasil khas dari rumput itu: jumlahnya tidak cukup untuk memenuhi tangan penuai. Dalam konstruksi relatif bahasa Indonesia, bentuk tanpa penanda waktu khusus terdengar alami.'
- source_word: כַפּוֹ
  choice: tangannya
  rationale: כַּף secara harfiah menunjuk telapak tangan atau tangan; 'tangannya' merupakan ungkapan yang alami sekaligus mempertahankan gambaran konkret panen.
- source_word: קוֹצֵר
  choice: penuai
  rationale: Partisip substantival ini menunjuk orang yang menuai. 'Penuai' ringkas, bermartabat, dan sesuai dengan paralelisme pertanian.
- source_word: וְחִצְנוֹ
  choice: dekapannya
  rationale: חֵצֶן dapat menunjuk dada, pangkuan, atau lipatan pakaian—tempat batang-batang hasil panen ditampung dekat tubuh. 'Dekapannya' menyampaikan gambaran itu tanpa membatasinya secara tidak perlu pada anatomi atau jenis pakaian tertentu.
- source_word: מְעַמֵּר
  choice: pengumpul berkas gandum
  rationale: Partisip ini menunjuk orang yang mengumpulkan hasil tuaian menjadi berkas atau tumpukan. Terjemahan ini membuat tindakan pertanian tersebut jelas bagi pembaca modern.
