  text: 'A Song of Ascents: “Greatly they have afflicted me from my youth”—let Israel now say—[a]'
translation:
  language: id
  text: Nyanyian ziarah. “Sejak masa mudaku mereka sangat menindas aku,” hendaklah Israel berkata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berkali-kali mereka telah menindas aku sejak masa mudaku.” Kata Ibrani רַבַּת dapat menyatakan frekuensi yang berulang maupun besarnya tingkat penindasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Secara harfiah berarti ‘nyanyian kenaikan’. Dalam konteks judul kumpulan Mazmur 120–134, ‘ziarah’ menyampaikan perjalanan naik ke Yerusalem secara alami dalam bahasa Indonesia tanpa memastikan secara mutlak latar penggunaannya.
- source_word: רַבַּת
  choice: sangat
  rationale: Adverbia ini dapat menunjukkan besarnya penderitaan; pilihan utama ‘sangat’ mempertahankan penekanan pada tingkat penindasan, sementara makna frekuentatif dicatat dalam catatan kaki.
- source_word: צְרָרוּנִי
  choice: mereka telah menindas aku
  rationale: Bentuk verba perfektif dengan sufiks objek orang pertama menyatakan tindakan permusuhan atau penindasan terhadap pemazmur. ‘Menindas’ alami dan sesuai dengan konteks penderitaan Israel.
- source_word: מִנְּעוּרַי
  choice: sejak masa mudaku
  rationale: Preposisi מִן bersama bentuk jamak abstrak נְעוּרִים menyatakan rentang waktu yang bermula pada masa muda.
- source_word: יֹאמַר־נָא יִשְׂרָאֵל
  choice: biarlah Israel sekarang berkata
  rationale: Jusif dengan partikel נָא merupakan ajakan atau desakan agar Israel mengucapkan pernyataan tersebut; ‘sekarang’ mempertahankan nuansa partikel tanpa membuatnya terdengar kasar.
theological_decisions:
- issue: Identitas pembicara tunggal ‘aku’ dan Israel
  choice: Mempertahankan ‘aku’ dalam kutipan lalu menyebut Israel sebagai pihak yang diminta mengatakannya
  alternative: Mengubah ‘aku’ menjadi ‘kami’ agar langsung bersifat kolektif
  rationale: Teks Ibrani memakai objek orang pertama tunggal, tetapi mengundang Israel mengucapkannya. Bentuk tunggal kolektif yang tegang dan bermakna dibiarkan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda kutip serta tanda pisah mempertahankan struktur seruan yang kemudian harus diulangi Israel. Judul diterjemahkan secara idiomatis sebagai ‘Nyanyian ziarah’.
