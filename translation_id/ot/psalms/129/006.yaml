  yaml_path: translation/ot/psalms/129/006.yaml
  text: May they be like grass on the rooftops[a], which withers before it grows up.
translation:
  language: id
  text: 'Biarlah mereka menjadi seperti rumput di atas atap,

    yang mengering sebelum dicabut.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang mengering sebelum sempat tumbuh.” Makna kata Ibrani yang diterjemahkan “dicabut” diperdebatkan; dalam konteks ini kata itu juga dapat dipahami sebagai bertunas atau tumbuh.'
    reason: Mempertahankan pembacaan leksikal “dicabut” dalam teks utama sambil menyatakan secara tepat alternatif kontekstual yang mendasari pembacaan “tumbuh.”
lexical_decisions:
- source_word: יִהְיוּ
  choice: Biarlah mereka menjadi
  rationale: Bentuk ini menyampaikan nuansa jusif atau kutukan dalam konteks, bukan sekadar pernyataan tentang masa depan.
- source_word: כַּחֲצִיר
  choice: seperti rumput
  rationale: חָצִיר berarti rumput atau tumbuhan hijau; “rumput” paling alami dan konkret dalam bahasa Indonesia.
- source_word: גַּגּוֹת
  choice: di atas atap
  rationale: Bentuk jamak Ibrani menunjuk pada atap-atap rumah yang datar; ungkapan Indonesia ini mempertahankan gambaran rumput yang tumbuh pada lapisan tanah tipis di atap.
- source_word: שֶׁקַּדְמַת
  choice: sebelum
  rationale: Konstruksi ini menyatakan bahwa pengeringan terjadi lebih dahulu daripada tindakan atau tahap berikutnya.
- source_word: שָׁלַף
  choice: dicabut
  rationale: Makna dasarnya ialah menarik keluar atau mencabut. Bentuk pasif tanpa pelaku mempertahankan keringkasan dan ketidakjelasan pelaku dalam teks sumber.
- source_word: יָבֵשׁ
  choice: mengering
  rationale: Kata kerja ini berarti menjadi kering; “mengering” cocok untuk rumput dan lebih dekat pada citra harfiah daripada penafsiran yang lebih bebas.
