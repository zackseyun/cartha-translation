  text: שְׁלַ֥ח יָדֶ֗י/ךָ מִ/מָּ֫ר֥וֹם פְּצֵ֣/נִי וְ֭/הַצִּילֵ/נִי מִ/מַּ֣יִם רַבִּ֑ים מִ֝/יַּ֗ד בְּנֵ֣י נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/007.yaml
  text: Stretch out your hand from on high[a]; rescue me and deliver me from many waters[b], from the hand of foreign sons.
translation:
  language: id
  text: Ulurkanlah tangan-Mu dari tempat tinggi; bebaskanlah aku dan selamatkanlah aku dari air yang melimpah[a], dari tangan orang-orang asing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “air yang besar.” Ungkapan Ibrani ini merupakan gambaran puitis tentang bahaya yang dahsyat dan mengancam.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak orang asing,” suatu ungkapan Ibrani bagi orang-orang asing.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: Ulurkanlah
  rationale: Bersama objek 'tangan-Mu', bentuk perintah ini secara idiomatis menggambarkan tindakan mengulurkan tangan untuk menolong, bukan sekadar mengirim.
- source_word: יָדֶיךָ
  choice: tangan-Mu
  rationale: Teks Masoret memvokalkan bentuk ini sebagai jamak, tetapi bahasa Indonesia lazim memakai 'tangan' tanpa penandaan jamak ketika jumlahnya tidak perlu ditonjolkan; bentuk ini tetap mempertahankan gambaran konkret tindakan ilahi.
- source_word: מִמָּרוֹם
  choice: dari tempat tinggi
  rationale: מָרוֹם menunjuk pada tempat atau ketinggian yang luhur. Terjemahan ini mempertahankan citra ruang tanpa mempersempit maknanya menjadi 'surga'.
- source_word: פְּצֵנִי
  choice: bebaskanlah aku
  rationale: Dalam konteks permohonan pertolongan ini, verba tersebut menyatakan pembebasan atau penyelamatan dari bahaya.
- source_word: וְהַצִּילֵנִי
  choice: dan lepaskanlah aku
  rationale: נצל berarti melepaskan atau menyelamatkan seseorang dari ancaman. 'Lepaskanlah' menjaga paralelisme dengan 'bebaskanlah' tanpa menghapus dua verba Ibrani.
- source_word: מִמַּיִם רַבִּים
  choice: dari air yang banyak
  rationale: Terjemahan ini dekat dengan bentuk Ibrani dan mempertahankan citra puitis air yang melimpah sebagai bahaya yang mengepung atau menenggelamkan.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan harfiah 'dari tangan' dapat berarti dari kuasa atau kendali. Citra tangan dipertahankan agar berpadanan dengan 'tangan-Mu' pada awal ayat.
- source_word: בְּנֵי נֵכָר
  choice: orang-orang asing
  rationale: Secara harfiah ungkapan ini memakai kata 'anak-anak/putra-putra', tetapi secara idiomatis menunjuk kepada orang asing. Terjemahan utama memakai ungkapan Indonesia yang alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa antropomorfis bagi tindakan Allah
  choice: Mempertahankan citra konkret 'Ulurkanlah tangan-Mu dari tempat tinggi'
  alternative: Turun tanganlah dari surga
  rationale: Bahasa sumber menggambarkan pertolongan Allah melalui citra tubuh dan ruang. Terjemahan tidak mengubahnya menjadi pernyataan abstrak atau menentukan bahwa מָרוֹם secara khusus berarti surga.
- issue: Ungkapan maskulin בְּנֵי נֵכָר
  choice: Menerjemahkan makna idiomatisnya sebagai 'orang-orang asing' dan mencatat bentuk harfiahnya
  alternative: anak-anak lelaki asing
  rationale: Bahasa Indonesia tidak memiliki gender gramatikal pada kata 'orang'. Bentuk harfiah akan terdengar seolah-olah hanya anak lelaki yang dimaksud, padahal ungkapan Ibrani berfungsi sebagai sebutan bagi orang asing.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk permohonan dengan akhiran -lah menjaga nada doa yang khidmat. Paralelisme serta citra tangan dan air dipertahankan, sementara idiom yang akan menyesatkan bila diterjemahkan secara harfiah dijelaskan dalam catatan kaki.
