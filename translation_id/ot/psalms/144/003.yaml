base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/003.yaml
  text: O Yahweh[a], what is man that you know him[c][b], the son of man that you think of him?
translation:
  language: id
  text: Ya Yahweh, apakah manusia, sehingga Engkau mengenalnya, dan anak manusia, sehingga Engkau memikirkannya?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anak manusia” di sini adalah ungkapan puitis bagi seorang manusia, dengan nuansa kefanaan dan kelemahan; dalam konteks ini bukan gelar mesianik.
    reason: lexical_alternative
  - marker: b
    text: Mazmur 144:3 sangat mirip dengan Mazmur 8:5 dalam penomoran Alkitab Indonesia (Mazmur 8:4 dalam penomoran Ibrani/Inggris).
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi diterjemahkan langsung sebagai "Yahweh"; partikel "Ya" menyatakan sapaan dalam konteks ini.
- source_word: מָה אָדָם
  choice: apakah manusia
  rationale: Pertanyaan retoris ini mengungkapkan kecil dan tidak berartinya manusia di hadapan Allah tanpa menambahkan penafsiran ke dalam teks.
- source_word: וַתֵּדָעֵהוּ
  choice: sehingga Engkau mengenalnya
  rationale: Mempertahankan arti inti ידע, "mengenal", sambil membiarkan konteks menyiratkan perhatian atau pengenalan Allah terhadap manusia.
- source_word: בֶּן אֱנוֹשׁ
  choice: anak manusia
  rationale: Mempertahankan ungkapan puitis Ibrani dan kesejajarannya dengan "manusia"; אֱנוֹשׁ juga membawa nuansa kefanaan dan kelemahan manusia.
- source_word: וַתְּחַשְּׁבֵהוּ
  choice: sehingga Engkau memperhitungkannya
  rationale: Mewakili rentang makna חשב, yakni memikirkan, menganggap, atau memperhitungkan, dan mempertahankan kesejajaran dengan "mengenalnya".
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai nama perjanjian YHWH; transliterasi "Yahweh" mempertahankan nama tersebut.
- issue: Daya rujuk אָדָם dan בֶּן אֱנוֹשׁ
  choice: manusia ... anak manusia
  alternative: umat manusia ... insan fana
  rationale: Kedua bentuk tunggal itu berfungsi secara representatif dan generik. Terjemahan ini mempertahankan citra serta paralelisme Ibrani tanpa menjadikannya gelar mesianik dalam konteks ini.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Penggunaan "Engkau" mempertahankan sapaan langsung kepada Allah. Susunan dua klausa sejajar dijaga agar bentuk puitis dan pertanyaan retoris sumber tetap terasa.
