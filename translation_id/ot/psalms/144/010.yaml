  text: the one who gives salvation to kings[b][a], who rescues David his servant from the evil sword.
translation:
  language: id
  text: Dialah yang memberikan keselamatan[a] kepada raja-raja, yang menyelamatkan Daud, hamba-Nya, dari pedang yang mematikan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan” atau “kemenangan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani berbunyi “pedang yang jahat.”
    reason: literal_rendering
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: Dia yang memberikan
  rationale: Partisipel Qal dengan kata sandang berfungsi sebagai sebutan substantival bagi Allah. Bentuk “Dia yang memberikan” mempertahankan gaya partisipial Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: תְּשׁוּעָה
  choice: keselamatan
  rationale: Kata ini dapat berarti keselamatan, pembebasan, atau kemenangan. “Keselamatan” mempertahankan keluasan makna teologisnya, sementara konteks tetap menunjukkan pembebasan dalam ancaman perang.
- source_word: לַמְּלָכִים
  choice: kepada raja-raja
  rationale: Preposisi ל menandai penerima dari tindakan memberi; “kepada raja-raja” merupakan padanan langsung dan alami.
- source_word: הַפּוֹצֶה
  choice: yang membebaskan
  rationale: Partisipel ini menyatakan tindakan melepaskan atau menyelamatkan dari bahaya. “Membebaskan” membedakannya dari kata “keselamatan” pada klausa pertama tanpa menghilangkan kesejajarannya.
- source_word: אֶת דָּוִד
  choice: Daud
  rationale: Nama diri diterjemahkan memakai bentuk baku bahasa Indonesia; אֶת adalah penanda objek langsung dan tidak diterjemahkan tersendiri.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam hubungan Daud dengan Allah, עבד merupakan sebutan kerajaan dan perjanjian. “Hamba” adalah bentuk Indonesia yang wajar dan bermartabat; huruf kapital pada pronomina mengikuti kebiasaan penulisan rujukan kepada Allah.
- source_word: מֵחֶרֶב
  choice: dari pedang
  rationale: Preposisi מן menyatakan pelepasan dari ancaman. “Pedang” dapat mewakili senjata atau ancaman maut secara umum.
- source_word: רָעָה
  choice: yang jahat
  rationale: Padanan ini mempertahankan arti dasar רעה, yaitu buruk atau jahat, dan tidak mempersempit ungkapan itu hanya menjadi “mematikan,” walaupun nuansa tersebut mungkin dimaksudkan dalam konteks.
theological_decisions:
- issue: Cakupan makna תְּשׁוּעָה dalam konteks kerajaan dan peperangan
  choice: keselamatan
  alternative: pembebasan; kemenangan
  rationale: Konteks raja-raja dan pedang memberi istilah ini nuansa militer, tetapi kata Ibraninya memiliki cakupan lebih luas. “Keselamatan” mempertahankan bobot teologis tersebut tanpa meniadakan konteks kemenangan atau pembebasan.
- issue: Sebutan עַבְדּוֹ bagi Daud
  choice: hamba-Nya
  alternative: budak-Nya; pelayan-Nya
  rationale: Sebutan ini menekankan kedudukan Daud di hadapan Allah dalam hubungan kerajaan dan perjanjian. “Hamba-Nya” menyampaikan hubungan pengabdian itu tanpa menonjolkan aspek perbudakan yang tidak menjadi fokus ayat.
- issue: Makna ungkapan חֶרֶב רָעָה
  choice: pedang yang jahat
  alternative: pedang yang mematikan
  rationale: Terjemahan utama mempertahankan ketegangan antara kemungkinan makna moral dan daya rusak ungkapan Ibrani. Alternatif yang lebih idiomatis dicatat dalam catatan kaki dan tidak dimasukkan diam-diam ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua partisipel Ibrani dipertahankan dengan dua klausa “yang,” sementara tanda koma mengapit aposisi “hamba-Nya” agar mudah dibaca. Semua alternatif penting yang mencerminkan keluasan leksikal atau kejanggalan harfiah dijaga melalui catatan kaki.
