  text: אָ֭דָם לַ/הֶ֣בֶל דָּמָ֑ה יָ֝מָ֗י/ו כְּ/צֵ֣ל עוֹבֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/004.yaml
  text: Man is like a breath[b][a]; his days are like a passing shadow.
translation:
  language: id
  text: Manusia seperti embusan napas[a]; hari-harinya seperti bayang-bayang yang berlalu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “embusan napas” juga dapat berarti “uap”, “kesia-siaan”, atau “kehampaan”; dalam konteks ini kata tersebut menekankan singkat dan rapuhnya hidup manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: Manusia
  rationale: Kata ini dapat menunjuk kepada seorang manusia ataupun umat manusia secara umum. Dalam pernyataan hikmat tentang kefanaan ini, “manusia” alami dalam bahasa Indonesia dan tetap mencakup makna generik tanpa menambahkan pembedaan gender yang tidak menjadi pokok ayat.
- source_word: לַהֶבֶל
  choice: seperti embusan napas
  rationale: הֶבֶל secara konkret menggambarkan napas atau uap, lalu secara kiasan menyatakan kefanaan dan ketidakberartian. “Embusan napas” mempertahankan citra yang singkat dan lekas lenyap tanpa mempersempitnya menjadi “kesia-siaan” saja.
- source_word: דָּמָה
  choice: seperti
  rationale: Bentuk ini menyatakan kemiripan atau perbandingan. Dalam bahasa Indonesia, “seperti” menyampaikan perbandingan tersebut secara langsung dan wajar.
- source_word: יָמָיו
  choice: hari-harinya
  rationale: Terjemahan harfiah ini mempertahankan ungkapan Ibrani yang memakai “hari-hari” untuk masa hidup manusia.
- source_word: כְּצֵל
  choice: seperti bayang-bayang
  rationale: Terjemahan ini mempertahankan simile puitis yang menggambarkan sesuatu yang tidak tetap dan tidak berbobot.
- source_word: עוֹבֵר
  choice: yang berlalu
  rationale: Partisipel ini menggambarkan bayang-bayang yang sedang lewat atau berlalu. Klausa relatif terdengar alami dalam bahasa Indonesia dan mempertahankan gerak pada citra sumber.
