base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/001.yaml
  text: Of David. Blessed be Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: id
  text: 'Dari Daud.[a]


    Terpujilah Yahweh, batu karangku,

    yang melatih tanganku untuk bertempur,

    dan jari-jariku untuk berperang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk Daud” atau “Oleh Daud.” Dalam judul mazmur, preposisi Ibrani ini dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Preposisi לְ pada judul mazmur dapat menyatakan kepengarangan, hubungan, atau peruntukan. “Dari Daud” merupakan bentuk judul yang ringkas dan tidak mempersempit maknanya menjadi kepengarangan semata; kemungkinan lain dicatat dalam catatan kaki.
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Dalam seruan doksologis ini, bentuk partisip pasif Ibrani berfungsi sebagai ungkapan pujian. “Terpujilah” alami dan khidmat dalam bahasa Indonesia, sedangkan terjemahan harfiah “diberkatilah” dapat memberi kesan bahwa manusia sedang memberikan berkat kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: צוּרִי
  choice: batu karangku
  rationale: צוּר menunjuk pada batu besar atau tebing batu dan di sini menjadi metafora bagi Allah sebagai pelindung yang kokoh. “Batu karangku” mempertahankan citra konkret itu tanpa menggantinya dengan tafsiran seperti “perlindunganku”.
- source_word: הַמְלַמֵּד
  choice: yang melatih
  rationale: Dalam konteks perang, verba “melatih” menyampaikan pengajaran yang mempersiapkan seseorang untuk bertempur dan mencerminkan tindakan khas yang berkelanjutan dari Yahweh.
- source_word: יָדַי
  choice: tanganku
  rationale: Bahasa Indonesia lazim memakai bentuk tunggal generik “tanganku” untuk anggota tubuh berpasangan. Citra anggota tubuh dipertahankan dan tidak diparafrasakan sebagai kemampuan atau kekuatan.
- source_word: לַקְרָב
  choice: untuk bertempur
  rationale: קְרָב berarti pertempuran atau pertarungan. Bentuk verbal “untuk bertempur” alami setelah “melatih tanganku” dan tetap mempertahankan konteks militer.
- source_word: אֶצְבְּעוֹתַי
  choice: jari-jariku
  rationale: Bentuk ulang menyatakan jamak dengan alami dan mempertahankan kesejajaran puitis yang secara khusus menyebut jari-jari.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: מִלְחָמָה berarti perang. “Untuk berperang” selaras secara idiomatis dengan “untuk bertempur” sambil mempertahankan peningkatan cakupan dari pertempuran menuju perang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Bahasa militer yang diterapkan pada tindakan Allah
  choice: Mempertahankan gambaran harfiah bahwa Yahweh melatih tangan dan jari untuk bertempur dan berperang
  alternative: Menghaluskannya menjadi pemberian kekuatan atau ketekunan secara umum
  rationale: Teks Ibrani secara eksplisit menggambarkan Allah mempersiapkan pemazmur untuk konflik bersenjata. Menerjemahkan citra tersebut secara langsung menjaga kekhususan historis dan ketegangan teologisnya tanpa menafsirkannya secara rohani atau menghaluskannya.
translation_notes:
  register: Bahasa dibuat modern, ringkas, dan khidmat. Paralelisme antara tangan/jari dan bertempur/berperang dipertahankan. Baris-baris puitis digunakan untuk menampilkan struktur ayat, sedangkan catatan kaki menjaga ambiguitas judul Ibrani.
