  yaml_path: translation/ot/psalms/144/000.yaml
  text: Of David. Blessed is Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: id
  text: 'Dari Daud.[a]


    Terpujilah Yahweh, batuku,

    yang melatih tanganku untuk bertempur,

    jari-jariku untuk berperang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk Daud” atau “Oleh Daud” dalam judul mazmur; preposisi Ibrani ini dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Dalam judul mazmur, לְ dapat menyatakan kepengarangan, hubungan, atau peruntukan. “Dari Daud” merupakan terjemahan utama yang ringkas, sementara ambiguitasnya dipertahankan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton diterjemahkan dengan bentuk nama “Yahweh”, bukan diganti dengan gelar, agar pembedaan leksikal dalam teks Ibrani tetap tampak.
- source_word: צוּרִי
  choice: gunung batuku
  rationale: Metafora “batuku” dipertahankan, dengan “gunung batu” sebagai ungkapan Indonesia yang alami untuk tempat perlindungan yang kokoh.
- source_word: הַמְלַמֵּד
  choice: yang melatih
  rationale: Dalam konteks keterampilan tempur, “melatih” menyampaikan makna partisip pengajaran secara lebih tepat daripada sekadar “mengajar”.
- source_word: לַקְרָב / לַמִּלְחָמָה
  choice: untuk bertempur / untuk berperang
  rationale: Paralelisme dua istilah dipertahankan dengan padanan Indonesia yang berdekatan tetapi tidak identik.
theological_decisions:
- issue: Penyebutan nama ilahi
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri יְהוָה. Bentuk “Yahweh” mempertahankan sifatnya sebagai nama tanpa memasukkan tradisi penggantian tertentu.
- issue: Hubungan Daud dengan mazmur
  choice: Dari Daud
  alternative: Untuk Daud / Oleh Daud
  rationale: Preposisi לְ dalam judul tidak memastikan hanya satu relasi. Teks utama memakai bentuk yang wajar, dan alternatif yang sungguh mungkin dinyatakan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme puitis Ibrani dipertahankan dalam susunan tiga baris, dengan metafora konkret dan istilah perang yang mudah dipahami.
