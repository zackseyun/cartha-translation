  yaml_path: translation/ot/psalms/144/015.yaml
  text: Blessed are the people for whom it is so[b][a]; blessed are the people whose God is Yahweh.
translation:
  language: id
  text: Berbahagialah bangsa yang demikian adanya; berbahagialah bangsa yang Allahnya ialah Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk ucapan bahagia ini menyatakan keadaan yang patut dianggap sejahtera dan beruntung. “Berbahagialah” alami dalam gaya mazmur Indonesia serta lebih luas daripada emosi sesaat.
- source_word: הָעָם
  choice: bangsa
  rationale: עָם menunjuk pada suatu kelompok masyarakat secara kolektif. Dalam konteks berkat nasional pada ayat-ayat sebelumnya, “bangsa” paling alami, tanpa harus menekankan negara sebagai lembaga politik.
- source_word: שֶׁכָּכָה לּוֹ
  choice: yang mengalami semua itu
  rationale: Secara harfiah ungkapan ini berarti kira-kira “yang baginya demikian.” “Yang mengalami semua itu” secara alami merujuk kembali pada keadaan makmur yang baru digambarkan, tanpa merinci atau menambah isinya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tetragramaton dipertahankan sebagai nama pribadi Allah Israel, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהָיו
  choice: yang Allahnya adalah
  rationale: Akhiran orang ketiga tunggal merujuk secara kolektif kepada bangsa itu. Susunan ini mempertahankan hubungan kepunyaan dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama itu dan menghindari penggantiannya dengan gelar.
- issue: Cakupan berkat pada שֶׁכָּכָה לּוֹ
  choice: yang mengalami semua itu
  alternative: yang keadaannya demikian
  rationale: Pilihan utama menghubungkan ucapan bahagia dengan gambaran kemakmuran sebelumnya, tetapi tidak menentukan bahwa berkat tersebut hanya bersifat material.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan “berbahagialah bangsa” dipertahankan untuk mencerminkan paralelisme Ibrani. Tidak diperlukan catatan kaki karena pilihan utama cukup jelas dan alternatifnya tidak mengubah makna secara substantif.
