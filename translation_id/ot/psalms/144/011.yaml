base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
translation:
  language: id
  text: Bebaskanlah aku dan selamatkanlah aku dari tangan orang-orang asing[a], yang mulutnya mengucapkan kepalsuan[b], dan yang tangan kanannya adalah tangan kanan penuh tipu daya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak orang asing,” suatu ungkapan yang berarti “orang-orang asing.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kesia-siaan” atau “kehampaan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Ibrani mengulang “tangan kanan”: “tangan kanannya adalah tangan kanan penuh tipu daya.” Tangan kanan sering melambangkan kuasa, ikrar, atau tindakan.'
    reason: cultural_note
lexical_decisions:
- source_word: פְּצֵנִי
  choice: Bebaskanlah aku
  rationale: Imperatif dari פצה dengan sufiks orang pertama tunggal memohon pembebasan dari ancaman; pilihan ini alami dan tetap dibedakan dari verba berikutnya.
- source_word: וְהַצִּילֵנִי
  choice: dan luputkanlah aku
  rationale: Bentuk Hifil imperatif dari נצל berarti melepaskan atau menyelamatkan dari bahaya; 'luputkanlah' mempertahankan verba kedua dalam paralelisme.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Mempertahankan citra Ibrani tentang tangan sebagai kuasa atau kendali; ungkapan ini tetap dapat dipahami dalam bahasa Indonesia.
- source_word: בְּנֵי נֵכָר
  choice: orang-orang asing
  rationale: Secara harfiah 'anak-anak asing/negara asing', tetapi merupakan ungkapan yang menunjuk kepada orang asing; terjemahan idiomatis menghindari bentuk kaku.
- source_word: פִּיהֶם דִּבֶּר שָׁוְא
  choice: yang mulutnya mengucapkan kepalsuan
  rationale: שָׁוְא dapat berarti kesia-siaan, kehampaan, atau kepalsuan. Dalam kesejajaran dengan שֶׁקֶר, 'kepalsuan' menyampaikan nuansa moral tanpa mempersempitnya menjadi satu kebohongan tertentu.
- source_word: וִימִינָם יְמִין שָׁקֶר
  choice: dan yang tangan kanannya adalah tangan kanan penuh tipu daya
  rationale: Pengulangan 'tangan kanan' dipertahankan karena bersifat menegaskan. 'Penuh tipu daya' menyampaikan sifat konstruksi Ibrani secara alami tanpa menghapus citranya.
