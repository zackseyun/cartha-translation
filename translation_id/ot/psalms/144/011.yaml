  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Partikel -lah mempertahankan nuansa permohonan mendesak. Paralelisme dan pengulangan citra tangan dalam teks Ibrani dipertahankan, sedangkan idiom 'anak-anak orang asing' diterjemahkan menurut maknanya.
