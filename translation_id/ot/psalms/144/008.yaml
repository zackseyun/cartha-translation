  text: whose mouth speaks emptiness[b][a], and whose right hand is a right hand of falsehood.
translation:
  language: id
  text: yang mulut mereka mengucapkan kesia-siaan[a], dan tangan kanan mereka adalah tangan kanan kepalsuan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebohongan”. Kata Ibrani yang dipakai dapat berarti kesia-siaan, kehampaan, ketidakberhargaan, atau kebohongan.
    reason: lexical_alternative
  - marker: b
    text: Pengulangan “tangan kanan ... tangan kanan” mengikuti bahasa Ibrani untuk memberi penekanan. Tangan kanan dapat melambangkan sumpah, kuasa, atau kesetiaan yang dijanjikan; karena itu, “tangan kanan kepalsuan” menyiratkan tipu daya atau pengkhianatan.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini melanjutkan gambaran tentang orang-orang asing pada ayat sebelumnya; “yang” alami dalam bahasa Indonesia dan dapat menaungi kedua klausa.
- source_word: פִּיהֶם
  choice: mulutnya
  rationale: Secara bentuk, nomina tunggal dengan sufiks orang ketiga jamak, yakni “mulut mereka”. Bentuk “mulutnya” mengikuti konstruksi relatif kolektif bahasa Indonesia tanpa mengubah acuan jamaknya.
- source_word: דִּבֶּר
  choice: mengucapkan
  rationale: Bentuk perfektif di sini menggambarkan tindakan yang menjadi ciri mereka, sehingga kala kini tersirat secara alami. “Mengucapkan” lebih wajar daripada “berbicara” ketika objeknya adalah kesia-siaan.
- source_word: שָׁוְא
  choice: kesia-siaan
  rationale: Istilah ini dapat menunjuk pada kehampaan, kesia-siaan, ketidakberhargaan, atau kebohongan. “Kesia-siaan” mempertahankan keluasan maknanya dan tidak menyamakannya sepenuhnya dengan שֶׁקֶר pada bagian berikut.
- source_word: וִימִינָם
  choice: dan yang tangan kanannya
  rationale: Pengulangan “yang” mempertahankan kesejajaran kedua klausa secara alami dalam bahasa Indonesia.
- source_word: יְמִין
  choice: tangan kanan
  rationale: 'Nomina yang sama diulang dalam bahasa Ibrani untuk penekanan; pengulangan itu dipertahankan: “tangan kanannya adalah tangan kanan...”.'
- source_word: שָׁקֶר
  choice: kepalsuan
  rationale: Kata ini menyatakan kebohongan, kepalsuan, atau tipu daya. “Kepalsuan” mempertahankan bentuk abstrak dan cocok dalam ungkapan simbolis “tangan kanan kepalsuan”.
