source:
  edition: WLC
  text: בְּר֣וֹק בָּ֭רָק וּ/תְפִיצֵ֑/ם שְׁלַ֥ח חִ֝צֶּ֗י/ךָ וּ/תְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/006.yaml
  text: Flash forth lightning and scatter them[a]; send out your arrows and throw them into confusion.
translation:
  language: id
  text: Pancarkanlah kilat dan cerai-beraikan mereka; lepaskanlah anak-anak panah-Mu dan kacaukanlah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata terakhir juga dapat berarti “buatlah mereka panik” atau “kalahkanlah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹק בָּרָק
  choice: Pancarkanlah kilat
  rationale: Gabungan verba imperatif dan nomina seakar ini secara harfiah mengandung permainan kata seperti “kilatkanlah kilat.” “Pancarkanlah kilat” mempertahankan tindakan langsung dan citra puitisnya dalam bahasa Indonesia yang alami.
- source_word: וּתְפִיצֵם
  choice: dan cerai-beraikan mereka
  rationale: Bentuk kausatif dari פוץ menyatakan tindakan membuat lawan berpencar. “Cerai-beraikan” kuat, alami, dan sesuai dengan konteks pertempuran.
- source_word: שְׁלַח חִצֶּיךָ
  choice: lepaskanlah anak-anak panah-Mu
  rationale: Dalam konteks anak panah, שלח berarti mengirim atau meluncurkannya. “Lepaskanlah” merupakan ungkapan Indonesia yang alami untuk menembakkan anak panah, sedangkan bentuk jamak חִצֶּיךָ dipertahankan.
- source_word: וּתְהֻמֵּם
  choice: dan kacaukanlah mereka
  rationale: Verba המם dapat menyatakan tindakan menimbulkan kekacauan, kepanikan, atau kekalahan di medan perang. “Kacaukanlah” mempertahankan keluasan makna tanpa membatasinya pada kebingungan batin saja.
theological_decisions:
- issue: Gambaran Allah sebagai pejuang
  choice: Mempertahankan permohonan langsung agar Allah memakai kilat dan anak panah dalam gambaran peperangan puitis.
  alternative: Melunakkan ayat menjadi permohonan umum agar Allah menolong atau menghukum.
  rationale: Teks Ibrani secara eksplisit memakai bentuk perintah dan citra senjata ilahi. Terjemahan mempertahankan ketegangan dan daya puitis ini tanpa menjelaskan apakah gambaran tersebut harus dipahami secara harfiah atau metaforis.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Bentuk “-Mu” mengikuti kebiasaan penulisan sapaan kepada Allah. Pengulangan Ibrani yang seakar pada “kilatkanlah kilat” disampaikan secara lebih alami sebagai “pancarkanlah kilat,” sementara citra dan daya imperatifnya tetap dipertahankan.
