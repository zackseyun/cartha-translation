  yaml_path: translation/ot/psalms/144/014.yaml
  text: Our cattle are heavy with young[a]; there is no breach and no going out[c][b], and no cry in our streets.
translation:
  language: id
  text: Ternak kami sarat mengandung[a]; tidak ada pembobolan, tidak ada yang keluar[b], dan tidak ada jeritan di jalan-jalan kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lembu-lembu kami sarat beban.” Kata Ibrani אַלּוּפֵינוּ juga dapat berarti “lembu-lembu kami,” “para pemimpin kami,” atau “kaum-kaum kami,” sedangkan מְסֻבָּלִים secara harfiah berarti “dibebani” atau “sarat beban.” Dalam konteks ini, banyak penafsir memahaminya sebagai gambaran kesuburan atau kelimpahan ternak.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak ada pembuangan” atau “tidak ada seorang pun yang pergi keluar.” Bahasa Ibraninya sangat ringkas dan mungkin menunjuk pada tidak adanya orang yang dipaksa meninggalkan kota; sebagian juga menghubungkannya dengan tidak adanya keguguran.
    reason: alternative_reading
lexical_decisions:
- source_word: אַלּוּפֵינוּ
  choice: ternak kami
  rationale: Dalam konteks berkat berupa kesuburan dan keamanan, kata ini paling masuk akal menunjuk pada hewan ternak, meskipun di tempat lain dapat berarti para pemimpin atau kepala kaum. Pilihan yang lebih umum daripada “lembu-lembu kami” menjaga keluasan maknanya.
- source_word: מְסֻבָּלִים
  choice: bunting sarat
  rationale: Bentuk pasif dari סבל secara harfiah menggambarkan keadaan sarat atau menanggung beban. Jika אַלּוּפֵינוּ dipahami sebagai ternak, ungkapan Indonesia ini secara alami menyampaikan ternak yang sarat mengandung serta kemakmuran melalui perkembangbiakan.
- source_word: אֵין פֶּרֶץ
  choice: tidak ada penerobosan
  rationale: פֶּרֶץ berarti bobolan, rekahan, atau tindakan menerobos. “Penerobosan” mempertahankan gambaran gangguan terhadap keamanan tanpa menambahkan kata “tembok” yang tidak dinyatakan langsung dalam bahasa Ibrani.
- source_word: וְאֵין יוֹצֵאת
  choice: tidak ada yang keluar
  rationale: Ungkapan Ibrani ini singkat, eliptis, dan sulit dipastikan rujukannya. Terjemahan ini mempertahankan ketidakjelasan mengenai apakah yang dimaksud ialah keberangkatan paksa, pembuangan, orang yang keluar, atau kemungkinan lain.
- source_word: וְאֵין צְוָחָה
  choice: tidak ada jeritan
  rationale: צְוָחָה menunjuk pada jeritan atau seruan keras, biasanya karena kesusahan. “Jeritan” singkat, wajar, dan membawa nuansa penderitaan tersebut.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: di jalan-jalan kami
  rationale: רְחֹבוֹת dapat menunjuk pada jalan yang lebar, lapangan, atau ruang umum. “Jalan-jalan kami” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan latar kehidupan umum kota.
