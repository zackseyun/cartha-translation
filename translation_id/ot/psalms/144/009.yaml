  yaml_path: translation/ot/psalms/144/009.yaml
  text: O God[a], I will sing a new song to you; on a ten-stringed harp I will make music to you.
translation:
  language: id
  text: Ya Allah, aku hendak menyanyikan nyanyian baru bagi-Mu; dengan kecapi berdawai sepuluh[a] aku hendak memainkan musik bagi-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan alat musik berdawai sepuluh”; jenis tepat alat musik kuno yang disebut נֵבֶל tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Bentuk ini merupakan sapaan langsung. Partikel “Ya” menyampaikan fungsi vokatif secara alami dan khidmat dalam bahasa Indonesia.
- source_word: שִׁיר חָדָשׁ
  choice: nyanyian baru
  rationale: Padanan langsung dan alami yang mempertahankan motif puitis dalam Mazmur.
- source_word: אָשִׁירָה
  choice: aku hendak menyanyikan
  rationale: Bentuk kohortatif orang pertama menyatakan kehendak atau tekad; “hendak” mempertahankan nuansa volisional itu.
- source_word: לָּךְ
  choice: bagi-Mu
  rationale: Preposisi ini menandai Allah sebagai penerima nyanyian dan musik. “Bagi-Mu” alami dalam konteks persembahan pujian.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: dengan kecapi sepuluh dawai
  rationale: נֵבֶל menunjuk pada alat musik berdawai, tetapi jenis tepatnya tidak pasti. “Kecapi” merupakan padanan Indonesia yang mudah dipahami, sedangkan בְּ diterjemahkan secara instrumental sebagai “dengan”.
- source_word: אֲזַמְּרָה
  choice: aku hendak memainkan musik
  rationale: Bentuk piel dari זמר dapat berarti bermusik atau menyanyikan pujian. Karena alat musik disebut secara eksplisit, pilihan ini menyampaikan tindakan musikal tanpa mengulang kata “menyanyikan”.
