source:
  edition: WLC
  text: אֲשֶׁ֤ר בָּנֵ֨י/נוּ כִּ/נְטִעִים֮ מְגֻדָּלִ֪ים בִּֽ/נְעוּרֵ֫י/הֶ֥ם בְּנוֹתֵ֥י/נוּ כְ/זָוִיֹּ֑ת מְ֝חֻטָּב֗וֹת תַּבְנִ֥ית הֵיכָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/012.yaml
  text: May our sons be like well-grown plants in their youth[c][b][a], and our daughters like corner pillars carved in the pattern of a palace.
translation:
  language: id
  text: Kiranya anak-anak lelaki kita seperti tanaman yang tumbuh subur pada masa muda mereka, dan anak-anak perempuan kita seperti tiang-tiang penjuru yang dipahat menurut rancangan istana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bait suci" atau "balairung besar"; kata Ibrani ini dapat menunjuk istana, bait suci, atau aula besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Kiranya
  rationale: Partikel relatif ini, dalam kesinambungan dengan doa sebelumnya, paling wajar dipahami sebagai pengantar harapan; 'kiranya' menyatakan nuansa optatif tanpa mengubahnya menjadi kepastian.
- source_word: בָּנֵינוּ
  choice: anak-anak lelaki kita
  rationale: Kata Ibrani ini secara khusus berarti anak lelaki dan dipertahankan untuk menjaga kesejajaran dengan anak-anak perempuan.
- source_word: כִּנְטִעִים מְגֻדָּלִים
  choice: seperti tanaman yang tumbuh subur
  rationale: נְטִעִים menunjuk pada sesuatu yang ditanam, sedangkan bentuk pasif מְגֻדָּלִים menggambarkan tanaman yang telah dibesarkan atau bertumbuh dengan baik; 'tumbuh subur' menyampaikan hasil pertumbuhan itu secara alami dalam bahasa Indonesia.
- source_word: בִּנְעוּרֵיהֶם
  choice: pada masa muda mereka
  rationale: Frasa ini menempatkan pertumbuhan tersebut dalam masa muda, tanpa menambahkan gagasan 'sejak' yang tidak wajib.
- source_word: בְּנוֹתֵינוּ
  choice: anak-anak perempuan kita
  rationale: Terjemahan ini mempertahankan arti khusus 'putri/anak perempuan' serta paralelnya dengan anak-anak lelaki.
- source_word: כְזָוִיּוֹת
  choice: seperti tiang-tiang penjuru
  rationale: Secara harfiah berkaitan dengan sudut atau penjuru; dalam gambaran arsitektural ini, 'tiang-tiang penjuru' menyampaikan unsur bangunan yang anggun dan menonjol tanpa membatasinya menjadi batu penjuru.
- source_word: מְחֻטָּבוֹת
  choice: yang dipahat
  rationale: Bentuk pasif ini menyatakan sesuatu yang dibentuk dengan dipotong atau dipahat; 'dipahat' sesuai dengan citra pengerjaan arsitektural.
- source_word: תַּבְנִית
  choice: menurut bentuk
  rationale: Kata ini dapat berarti bentuk, pola, atau rancangan. 'Menurut bentuk' dekat dengan sumber dan tetap wajar dalam frasa arsitektural Indonesia.
- source_word: הֵיכָל
  choice: istana
  rationale: Kata ini dapat menunjuk istana, bait, atau balairung besar. Dalam konteks kemakmuran rumah tangga dan bangsa, 'istana' memberi citra kemegahan nonkultis, sementara kemungkinan 'bait' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Rujukan הֵיכָל dalam perumpamaan arsitektural bagi anak-anak perempuan
  choice: istana
  alternative: bait atau balairung besar
  rationale: Konteks langsung menggambarkan kesejahteraan keluarga dan masyarakat, sehingga 'istana' cocok dengan citra bangunan megah tanpa memasukkan rujukan kultis yang tidak dituntut teks. Namun, ambiguitas leksikalnya tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat. 'Kiranya' mempertahankan nada doa; pengulangan 'anak-anak lelaki/perempuan kita' menjaga kesejajaran sumber. Penanda catatan kaki ditempatkan langsung setelah 'istana'.
