  terminology: 'Istilah perlindungan dan kerajaan konsisten serta tepat: “benteng,” “tempat perlindungan ... yang tinggi,” “pembebas,” “perisai,” dan “menundukkan.” Kapitalisasi “-Nya” sesuai kebiasaan Alkitab Indonesia. Catatan kaki terjangkar pada klausa yang memuat bacaan yang diperselisihkan dan menyatakan alternatifnya tanpa meniadakan teks utama.'
