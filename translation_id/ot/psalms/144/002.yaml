source:
  edition: WLC
  text: חַסְדִּ֥/י וּ/מְצוּדָתִ/י֮ מִשְׂגַּבִּ֪/י וּֽ/מְפַלְטִ֫/י לִ֥/י מָ֭גִנִּ/י וּ/ב֣/וֹ חָסִ֑יתִי הָ/רוֹדֵ֖ד עַמִּ֣/י תַחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/002.yaml
  text: My steadfast love and my fortress[a], my stronghold and my deliverer, my shield, and in him I take refuge[b], the one who subdues peoples under me.
translation:
  language: id
  text: Kasih setiaku dan bentengku, tempat perlindunganku yang tinggi dan pembebasku, perisaiku—kepada-Nya aku berlindung. Dialah yang menundukkan bangsaku di bawah kekuasaanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah versi kuno berbunyi “bangsa-bangsa” sebagai ganti “bangsaku”; bandingkan Mazmur 18:48.
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדִּי
  choice: kasih setiaku
  rationale: Kata חֶסֶד mencakup kasih, kesetiaan, dan kemurahan yang teguh. Dengan akhiran orang pertama tunggal dalam rangkaian sebutan bagi Allah, frasa ini dipertahankan sebagai ungkapan puitis yang berarti bahwa Allah adalah kasih setia bagi pemazmur.
- source_word: מְצוּדָתִי
  choice: bentengku
  rationale: Kata ini menunjuk pada tempat pertahanan yang kokoh; “bentengku” alami dalam bahasa Indonesia dan mempertahankan gambaran militer.
- source_word: מִשְׂגַּבִּי
  choice: tempat perlindunganku yang tinggi
  rationale: Istilah ini menggambarkan tempat tinggi dan aman yang sukar dijangkau musuh. Terjemahan ini membedakannya dari מְצוּדָה sekaligus mempertahankan unsur ketinggian dan keamanan.
- source_word: מְפַלְטִי לִי
  choice: pembebasku
  rationale: Bentuk partisip ini menyatakan pribadi yang meluputkan atau menyelamatkan. לִי menegaskan hubungan pribadi, tetapi tidak diterjemahkan tersendiri karena “pembebasku bagiku” akan berlebihan dan tidak alami; akhiran “-ku” sudah menyampaikan hubungan tersebut.
- source_word: מָגִנִּי
  choice: perisaiku
  rationale: Terjemahan langsung yang mempertahankan metafora perlindungan dalam konteks peperangan.
- source_word: וּבוֹ חָסִיתִי
  choice: kepada-Nya aku berlindung
  rationale: Kata kerja חסה berarti mencari atau mendapatkan perlindungan. Bentuk perfek dapat menunjuk pada tindakan yang telah dilakukan dengan dampak berlanjut; bentuk Indonesia ini tetap alami dan tidak membatasi ungkapan itu hanya pada masa lampau.
- source_word: הָרוֹדֵד
  choice: yang menundukkan
  rationale: Bentuk partisip dari רדד menyatakan tindakan membawa seseorang ke bawah kekuasaan atau pemerintahan; “menundukkan” sesuai dengan konteks kerajaan dan militer.
- source_word: עַמִּי
  choice: bangsaku
  rationale: Teks Masoret berbunyi tunggal dengan akhiran orang pertama, yaitu “bangsaku” atau “umatku”. “Bangsaku” paling alami bagi perkataan seorang raja tentang rakyat yang ditempatkan di bawah pemerintahannya.
- source_word: תַחְתָּי
  choice: di bawah kekuasaanku
  rationale: Secara harfiah berarti “di bawahku”. Penambahan “kekuasaan” membuat metafora pemerintahan jelas dalam bahasa Indonesia tanpa mengubah maknanya.
theological_decisions:
- issue: Apakah עַמִּי diterjemahkan menurut Teks Masoret sebagai “bangsaku” atau menurut bacaan yang tercermin dalam sejumlah saksi kuno sebagai “bangsa-bangsa”.
  choice: bangsaku
  alternative: bangsa-bangsa
  rationale: Bacaan utama mengikuti teks Ibrani WLC, yang secara langsung berbunyi “bangsaku”. Ini dapat dipahami sebagai Allah menempatkan bangsa sang raja di bawah pemerintahannya, tanpa harus menyiratkan penindasan. Bacaan plural didokumentasikan dalam catatan kaki karena dukungan sejumlah versi kuno dan paralelnya dalam Mazmur 18:48.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat. Rangkaian metafora perlindungan dipertahankan, dengan tanda pisah dan pemenggalan kalimat untuk menjaga kelancaran pembacaan. Huruf kapital pada “-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah dalam Alkitab bahasa Indonesia.
