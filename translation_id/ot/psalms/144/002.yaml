  source_fidelity: 'Teks Indonesia mengikuti Teks Masoret WLC dengan cermat: חַסְדִּי dipertahankan sebagai sebutan puitis bagi Allah, rangkaian metafora pertahanan diterjemahkan secara utuh, dan עַמִּי diterjemahkan “bangsaku,” sesuai bentuk tunggal berakhiran orang pertama dalam teks Ibrani. “Di bawah kekuasaanku” secara idiomatis menjelaskan metafora “di bawahku” dalam konteks kerajaan tanpa menggeser makna. Catatan kaki dengan tepat melestarikan bacaan alternatif plural dari sejumlah versi kuno. Audit Inggris yang memakai “peoples” tidak mengungguli pembacaan MT yang dipertahankan dalam draf ini.'
