source:
  edition: WLC
  text: מְזָוֵ֣י/נוּ מְלֵאִים֮ מְפִיקִ֥ים מִ/זַּ֗ן אֶ֫ל זַ֥ן צֹאונֵ֣/נוּ מַ֭אֲלִיפוֹת מְרֻבָּב֗וֹת בְּ/חוּצוֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/013.yaml
  text: May our storehouses be full[a], supplying every kind of produce; may our flocks multiply by thousands, by tens of thousands[b], in our open fields.
translation:
  language: id
  text: Kiranya lumbung-lumbung kami penuh, menyediakan hasil dari segala jenis[a]; kiranya kawanan ternak kami berkembang biak menjadi beribu-ribu, bahkan berpuluh-puluh ribu, di tempat-tempat terbuka kami[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari jenis ke jenis.” Ungkapan ini menyatakan kelimpahan hasil yang beraneka ragam.
    reason: lexical_alternative
  - marker: b
    text: Atau “di jalan-jalan kami” atau “di daerah pinggiran kami.” Istilah Ibrani ini dapat menunjuk pada tempat terbuka di luar atau di dalam suatu permukiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזָוֵינוּ
  choice: lumbung-lumbung kami
  rationale: Nomina langka ini menunjuk pada tempat penyimpanan persediaan. “Lumbung” jelas, alami, dan sesuai dengan konteks berkat pertanian.
- source_word: מְלֵאִים
  choice: penuh
  rationale: Adjektiva predikatif ini berarti “penuh.” Bentuk harapan “Kiranya ... penuh” mengikuti corak permohonan berkat dalam konteks.
- source_word: מְפִיקִים
  choice: menyediakan
  rationale: Partisip ini menggambarkan lumbung yang mengeluarkan atau menghasilkan persediaan; “menyediakan” menyampaikan fungsi tersebut secara alami.
- source_word: מִזַּן אֶל זַן
  choice: hasil dari segala jenis
  rationale: Ungkapan harfiahnya “dari jenis ke jenis” dan menekankan kelimpahan yang beraneka ragam. “Hasil dari segala jenis” mempertahankan gagasan distributif itu tanpa membatasi hasil tersebut secara berlebihan.
- source_word: צֹאנֵנוּ
  choice: kawanan ternak kami
  rationale: Nomina kolektif ini terutama menunjuk pada ternak kecil seperti domba dan kambing. “Kawanan ternak” mempertahankan sifat kolektifnya.
- source_word: מַאֲלִיפוֹת
  choice: berkembang biak menjadi beribu-ribu
  rationale: Bentuk yang berkaitan dengan kata “seribu” menggambarkan pertambahan kawanan hingga ribuan; ungkapan Indonesia ini alami dalam konteks peternakan.
- source_word: מְרֻבָּבוֹת
  choice: bahkan berpuluh-puluh ribu
  rationale: Bentuk ini berasal dari nomina yang berarti “sepuluh ribu” dan melanjutkan peningkatan angka secara bertahap. “Bahkan” menonjolkan klimaks paralel tersebut.
- source_word: בְּחוּצוֹתֵינוּ
  choice: di tempat-tempat terbuka kami
  rationale: חוּץ dapat menunjuk pada tempat di luar, ruang terbuka, atau jalan. “Tempat-tempat terbuka” menjaga keluasan makna dan cocok dengan konteks kawanan ternak tanpa memasukkan “ladang” yang tidak disebut secara eksplisit.
