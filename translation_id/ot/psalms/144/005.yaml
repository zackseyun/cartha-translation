  text: יְ֭הוָה הַט שָׁמֶ֣י/ךָ וְ/תֵרֵ֑ד גַּ֖ע בֶּ/הָרִ֣ים וְֽ/יֶעֱשָֽׁנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/005.yaml
  text: O Yahweh[a], bend your heavens and come down[b]; touch the mountains so that they smoke.
translation:
  language: id
  text: Ya, Yahweh, tundukkanlah langit-Mu dan turunlah; sentuhlah gunung-gunung itu, sehingga gunung-gunung itu berasap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan gunung-gunung itu akan berasap.” Bahasa Ibrani juga dapat dibaca sebagai kelanjutan pernyataan, bukan sebagai akibat dari sentuhan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”; partikel “Ya” menyampaikan sapaan langsung dalam puisi doa.
- source_word: הַט
  choice: tekukkanlah
  rationale: Bentuk imperatif dari נטה menggambarkan langit dicondongkan atau dibentangkan ke bawah; “tekukkanlah” mempertahankan citra puitis dengan ungkapan Indonesia yang ringkas.
- source_word: שָׁמֶיךָ
  choice: langit-Mu
  rationale: Bahasa Indonesia lazim memakai “langit” sebagai nomina kolektif; akhiran orang kedua dipertahankan dengan “-Mu”.
- source_word: וְתֵרֵד
  choice: dan turunlah
  rationale: Bentuk ini menyatakan gerak turun dan berfungsi sebagai permohonan langsung kepada Allah.
- source_word: גַּע
  choice: sentuhlah
  rationale: נגע pada dasarnya berarti “menyentuh”; pilihan ini tidak memperkuatnya secara berlebihan menjadi “pukul” atau “hantam”.
- source_word: בֶּהָרִים
  choice: gunung-gunung itu
  rationale: Bentuk jamak dan unsur definitnya dinyatakan secara wajar dalam bahasa Indonesia.
- source_word: וְיֶעֱשָׁנוּ
  choice: hingga semuanya berasap
  rationale: Bentuk imperfek setelah perintah dapat menyatakan akibat sentuhan ilahi. “Semuanya” merujuk pada gunung-gunung dan menghindari pengulangan yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Hubungan sentuhan Allah dengan gunung-gunung yang berasap
  choice: 'dibaca sebagai akibat: “hingga semuanya berasap”'
  alternative: 'dibaca sebagai rangkaian: “dan gunung-gunung itu akan berasap”'
  rationale: Urutan imperatif dan imperfek mendukung nuansa akibat, tetapi bahasa Ibraninya juga dapat dipahami sebagai kelanjutan tindakan; alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa puitis, khidmat, dan langsung. Bentuk imperatif dengan “-lah” mempertahankan nada permohonan, sedangkan citra langit yang ditekukkan dan gunung-gunung yang berasap dijaga tanpa penjelasan tambahan di dalam teks.
