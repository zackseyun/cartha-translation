  yaml_path: translation/ot/psalms/069/021.yaml
  text: They gave me poison for my food[c][b][a], and for my thirst they gave me vinegar to drink.
translation:
  language: id
  text: Mereka memberi aku racun sebagai makananku,[a] dan ketika aku haus, mereka memberiku cuka untuk diminum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “zat pahit”; secara tradisional diterjemahkan “empedu”. Kata Ibrani yang dipakai di sini menunjuk pada zat beracun atau pahit.
    reason: lexical_alternative
  - marker: b
    text: Atau “anggur asam”. Kata Ibrani ini dapat berarti anggur yang telah menjadi asam atau cuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Mereka memberi
  rationale: Bentuk wayyiqtol dari נתן menyatakan tindakan lampau; 'memberi' merupakan padanan langsung dan alami.
- source_word: בְּבָרוּתִי
  choice: sebagai makananku
  rationale: בָּרוּת berarti makanan atau santapan. Dalam konstruksi ini, 'sebagai makananku' menyampaikan bahwa racun itulah yang diberikan sebagai santapan, tanpa memaksakan arti bahwa racun dicampurkan ke dalam makanan.
- source_word: רֹאשׁ
  choice: racun
  rationale: Dalam konteks puitis, רֹאשׁ dapat menunjuk pada zat beracun atau sangat pahit. 'Racun' mempertahankan unsur berbahaya tanpa menyempitkannya menjadi empedu.
- source_word: וְלִצְמָאִי
  choice: dan ketika aku haus
  rationale: Secara harfiah frasa ini dapat berarti 'dan untuk dahagaku'; ungkapan 'ketika aku haus' lebih alami dalam bahasa Indonesia dan tetap mempertahankan keadaan yang melatarbelakangi tindakan berikutnya.
- source_word: יַשְׁקוּנִי
  choice: mereka memberiku ... untuk diminum
  rationale: Bentuk hifil dari שׁקה berarti memberi atau menyebabkan seseorang minum. Susunan ini alami dalam bahasa Indonesia dan tidak menambahkan unsur paksaan yang belum tentu dimaksud.
- source_word: חֹמֶץ
  choice: cuka
  rationale: חֹמֶץ menunjuk pada cuka atau anggur yang telah menjadi asam. 'Cuka' adalah padanan ringkas dan lazim; kemungkinan 'anggur asam' dicatat dalam catatan kaki.
theological_decisions:
- issue: Gema antarteks dengan kisah sengsara dalam Injil
  choice: Menerjemahkan berdasarkan arti leksikal teks Ibrani Mazmur tanpa menyesuaikan redaksi utama dengan ungkapan Perjanjian Baru.
  alternative: Memakai 'empedu' untuk רֹאשׁ dan 'anggur asam' untuk חֹמֶץ agar lebih dekat dengan sejumlah terjemahan tradisional dan kisah sengsara.
  rationale: Keutamaan diberikan kepada fungsi kata-kata Ibrani dalam Mazmur 69. Padanan tradisional dan kemungkinan arti lain tetap tersedia dalam catatan kaki agar hubungan antarteks tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme dipertahankan melalui dua tindakan memberi, sedangkan 'ketika aku haus' dipilih agar klausa kedua terdengar wajar. Semua penanda catatan kaki muncul dalam teks utama.
