  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: id
  text: Orang-orang yang duduk di gerbang[a] membicarakan aku, dan aku menjadi bahan nyanyian para peminum minuman keras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gerbang kota pada zaman dahulu merupakan tempat berlangsungnya kehidupan umum dan pengadilan. Ungkapan ini dapat menunjuk pada orang-orang yang berada di ruang publik tersebut, bukan hanya penjaga gerbang, dan dalam konteks mazmur dapat mengisyaratkan ejekan terbuka.
    reason: cultural_note
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: membicarakan aku
  rationale: Kata kerja שׂיח dapat berarti merenungkan atau berbicara, tetapi dalam konteks permusuhan sosial ini maknanya adalah membicarakan seseorang. Preposisi ב menandai topik pembicaraan; karena itu terjemahan tidak mempertegasnya menjadi 'menentang aku'.
- source_word: יֹשְׁבֵי שָׁעַר
  choice: orang-orang yang duduk di gerbang
  rationale: Ungkapan harfiahnya menunjuk kepada mereka yang duduk di gerbang kota, pusat kehidupan umum dan pengadilan. Pilihan ini mempertahankan gambaran Ibrani tanpa mempersempit mereka menjadi penjaga gerbang atau tua-tua.
- source_word: וּנְגִינוֹת
  choice: dan aku menjadi nyanyian
  rationale: Kata ini berarti nyanyian atau musik. Dalam kesejajaran dengan klausa pertama, pemazmur menjadi pokok nyanyian mereka; 'aku menjadi' melengkapi predikasi yang tersirat dalam bahasa Ibrani.
- source_word: שׁוֹתֵי שֵׁכָר
  choice: para peminum minuman keras
  rationale: שֵׁכָר adalah minuman memabukkan selain anggur. 'Minuman keras' merupakan padanan Indonesia yang alami, sedangkan 'para peminum' mempertahankan bentuk partisip tanpa langsung menafsirkan mereka sebagai pemabuk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua klausa mempertahankan kesejajaran puisi Ibrani; 'membicarakan' menjaga ambiguitas isi pembicaraan, sementara konteks mazmur menyiratkan ejekan.
