id: PSA.69.35
reference: Psalms 69:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י אֱלֹהִ֨ים י֘וֹשִׁ֤יעַ צִיּ֗וֹן וְ֭/יִבְנֶה עָרֵ֣י יְהוּדָ֑ה וְ/יָ֥שְׁבוּ שָׁ֝֗ם וִ/ירֵשֽׁוּ/הָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/035.yaml
  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: id
  text: Sebab Allah akan menyelamatkan Sion dan membangun kota-kota Yehuda. Mereka akan tinggal di sana dan memilikinya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mewarisinya” atau “mengambilnya menjadi milik mereka.”
    reason: lexical_alternative
  - marker: b
    text: Akhiran kata ganti dalam bahasa Ibrani berbentuk feminin tunggal, kemungkinan merujuk kepada Sion atau negeri itu sebagai satu kesatuan.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar atau jaminan bagi pengharapan yang diungkapkan sebelumnya; “Sebab” mempertahankan hubungan penjelas antarayat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Kata kerja tunggal menunjukkan bahwa yang dimaksud adalah Allah dalam arti tunggal; “Allah” merupakan padanan baku dan wajar dalam bahasa Indonesia.
- source_word: יוֹשִׁיעַ
  choice: akan menyelamatkan
  rationale: Bentuk Hifil dari ישׁע berarti menyelamatkan atau melepaskan. Bentuk mendatang sesuai dengan konteks janji.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Nama diri dipertahankan melalui bentuk transliterasi yang sudah baku dalam bahasa Indonesia.
- source_word: וְיִבְנֶה
  choice: dan membangun
  rationale: Kata בנה secara langsung berarti “membangun”; menerjemahkannya sebagai “membangun kembali” akan menambahkan gagasan pengulangan yang tidak dinyatakan secara eksplisit.
- source_word: עָרֵי יְהוּדָה
  choice: kota-kota Yehuda
  rationale: Frasa konstruksi Ibrani diterjemahkan secara lugas dan alami.
- source_word: וְיָשְׁבוּ שָׁם
  choice: Mereka akan tinggal di sana
  rationale: ישׁב dalam konteks ini menunjuk pada hidup atau menetap di suatu tempat. “Tinggal” jelas dan alami tanpa mempersempit maknanya menjadi tindakan awal bermukim.
- source_word: וִירֵשׁוּהָ
  choice: dan memilikinya
  rationale: ירשׁ dapat berarti memiliki, mewarisi, atau mengambil menjadi milik. “Memilikinya” ringkas, alami, dan mempertahankan pronomina objek tunggal melalui akhiran “-nya”.
theological_decisions:
- issue: Rujukan akhiran feminin tunggal pada וִירֵשׁוּהָ
  choice: Mempertahankan objek tunggal yang tidak disebutkan secara eksplisit melalui “-nya”.
  alternative: Menjelaskannya menjadi “memiliki Sion” atau “memiliki negeri itu”.
  rationale: Akhiran Ibrani berbentuk feminin tunggal dan kemungkinan merujuk kepada Sion atau negeri/kawasan yang diperlakukan sebagai satu kesatuan. Bentuk “-nya” mempertahankan ketidakjelasan rujukan itu tanpa memaksakan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Sebab” menjaga kaitan dengan konteks sebelumnya; “tinggal” dipilih daripada bentuk yang lebih arkais seperti “diam”. Pemenggalan menjadi dua kalimat memperjelas pergantian subjek dari Allah kepada para penghuni tanpa mengubah hubungan makna.
