  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
translation:
  language: id
  text: Aku lelah karena berseru-seru; tenggorokanku kering.[a] Mataku melemah sementara aku menanti Allahku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tenggorokanku terasa terbakar” atau “tenggorokanku serak.” Kata Ibrani menggambarkan kekeringan atau rasa terbakar akibat lama berseru.
    reason: lexical_alternative
  - marker: b
    text: Atau “sementara aku berharap kepada Allahku.” Kata kerja Ibrani dapat menyatakan baik penantian maupun pengharapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Aku lelah
  rationale: Bentuk ini menyatakan keadaan lelah sebagai akibat dari tindakan yang berlangsung lama, dengan ungkapan Indonesia yang alami.
- source_word: בְקָרְאִי
  choice: karena berseru-seru
  rationale: קרא dalam ratapan ini berarti berseru meminta pertolongan; ב dipahami secara kausal. Reduplikasi menandakan seruan yang berulang atau berkepanjangan.
- source_word: נִחַר
  choice: kering
  rationale: Kata ini menggambarkan tenggorokan yang mengering atau terasa terbakar akibat terus berseru. 'Kering' mempertahankan gambaran fisiknya tanpa langsung menafsirkannya sebagai suara serak.
- source_word: גְּרוֹנִי
  choice: tenggorokanku
  rationale: Padanan anatomis langsung yang mempertahankan gambaran jasmani dalam ratapan.
- source_word: כָּלוּ עֵינַי
  choice: Mataku merana
  rationale: כלה berarti habis, melemah, atau gagal. Dalam hubungan dengan mata, 'merana' menyampaikan keadaan mata yang melemah karena penantian panjang, sambil mempertahankan gaya puitis.
- source_word: מְיַחֵל
  choice: sementara aku menanti-nantikan
  rationale: יחל mencakup penantian dan pengharapan. 'Menanti-nantikan' mengungkapkan penantian yang tekun dan penuh harap tanpa menghapus kedua nuansa itu.
- source_word: לֵאלֹהָי
  choice: Allahku
  rationale: Akhiran orang pertama dipertahankan untuk menyatakan hubungan pribadi; preposisi ל terserap secara alami dalam konstruksi 'menanti-nantikan Allahku'.
theological_decisions:
- issue: Nuansa יחל antara menanti dan berharap
  choice: menanti-nantikan
  alternative: berharap kepada
  rationale: Pilihan ini mempertahankan dimensi waktu dan harapan sekaligus, tanpa menentukan bahwa kata tersebut hanya berarti salah satunya.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. 'Berseru-seru' dan 'menanti-nantikan' menyampaikan tindakan berkepanjangan; susunan dua kalimat menjaga ritme ratapan dan kejelasan bagi pembaca umum.
