  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “mengenakan kain kabung sebagai pakaianku” menyampaikan idiom Ibrani secara alami, sedangkan “buah bibir” mempertahankan keluasan makna מָשָׁל dengan konteks negatif dijelaskan dalam catatan kaki.
