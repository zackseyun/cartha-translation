translation:
  language: id
  text: Aku mengenakan kain kabung sebagai pakaianku, dan aku menjadi bahan olok-olok bagi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “buah bibir” atau “peribahasa”; maksudnya, orang yang disebut-sebut sebagai contoh untuk dicemooh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: mengenakan ... sebagai
  rationale: Dalam konstruksi dengan לְבוּשִׁי dan שָׂק, kata נתן menyatakan bahwa pemazmur menjadikan kain kabung sebagai pakaiannya. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “memberikan”.
- source_word: לְבוּשִׁי
  choice: pakaianku
  rationale: Mempertahankan makna benda yang dikenakan serta bentuk kepunyaan orang pertama.
- source_word: שָׂק
  choice: kain kabung
  rationale: Padanan Alkitabiah yang lazim untuk kain kasar yang dikenakan sebagai tanda perkabungan atau perendahan diri.
- source_word: וָאֱהִי
  choice: aku menjadi
  rationale: Menunjukkan keadaan yang timbul sebagai akibat dari tindakan dan tanggapan orang-orang terhadap pemazmur.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Mengungkapkan hubungan pemazmur dengan kelompok yang menjadikannya buah bibir.
- source_word: לְמָשָׁל
  choice: buah bibir
  rationale: Dalam konteks ratapan dan penghinaan, מָשָׁל menunjuk pada orang yang dibicarakan sebagai contoh yang mencemoohkan, bukan terutama pada peribahasa bijaksana. “Buah bibir” mempertahankan citra ujaran yang beredar tanpa terlalu mempersempit makna menjadi ejekan saja.
