  text: תֶּחְשַׁ֣כְנָה עֵ֭ינֵי/הֶם מֵ/רְא֑וֹת וּ֝/מָתְנֵ֗י/הֶם תָּמִ֥יד הַמְעַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/023.yaml
  text: Let their eyes be darkened from seeing[b][a], and make their loins shake continually.
translation:
  language: id
  text: Biarlah mata mereka menjadi gelap sehingga mereka tidak dapat melihat, dan buatlah pinggang mereka terus-menerus goyah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “buatlah pinggang mereka terus-menerus gemetar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: Biarlah ... menjadi gelap
  rationale: Bentuk imperfek dalam konteks kutukan doa menyatakan permohonan atau harapan. Ungkapan ini mempertahankan keadaan yang dihasilkan tanpa mengubahnya menjadi sekadar ramalan.
- source_word: עֵינֵיהֶם
  choice: mata mereka
  rationale: Padanan langsung yang mempertahankan gambaran anggota tubuh dalam puisi Ibrani.
- source_word: מֵרְאוֹת
  choice: sehingga mereka tidak dapat melihat
  rationale: Secara harfiah berarti 'dari melihat', tetapi setelah 'menjadi gelap' konstruksi מן dengan infinitif menyatakan terhalangnya kemampuan melihat. Padanan idiomatis ini menyampaikan daya maknanya dalam bahasa Indonesia.
- source_word: וּמָתְנֵיהֶם
  choice: dan ... pinggang mereka
  rationale: מָתְנַיִם menunjuk kawasan pinggang atau pangkal tubuh. 'Pinggang' merupakan istilah Indonesia yang alami dan tetap mempertahankan gambaran jasmani.
- source_word: תָּמִיד
  choice: terus-menerus
  rationale: Menyatakan keadaan yang berlangsung tanpa henti dan cocok dengan laras puitis ayat.
- source_word: הַמְעַד
  choice: buatlah ... goyah
  rationale: Bentuk Hifil dari מעד bersifat kausatif, yakni menyebabkan terhuyung atau kehilangan kestabilan. 'Goyah' mempertahankan citra ketidakstabilan jasmani dan tidak membatasinya hanya pada gemetar.
theological_decisions:
- issue: Daya kutukan doa dalam ayat
  choice: 'Diterjemahkan sebagai permohonan penghakiman: ''Biarlah ... dan buatlah ...'''
  alternative: 'Diterjemahkan sebagai ramalan masa depan: ''Mata mereka akan menjadi gelap ...'''
  rationale: Dalam konteks mazmur, bentuk-bentuk verba ini berfungsi sebagai permohonan kepada Allah, bukan sekadar pernyataan tentang masa depan. Daya retoris yang keras dipertahankan tanpa diperhalus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan paralelisme, gambaran jasmani, dan nada imprekatoris teks Ibrani.
