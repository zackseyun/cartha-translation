  text: וְ/אַל תַּסְתֵּ֣ר פָּ֭נֶי/ךָ מֵֽ/עַבְדֶּ֑/ךָ כִּֽי צַר לִ֝֗/י מַהֵ֥ר עֲנֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/017.yaml
  text: And do not hide your face from your servant[a], for I am in distress[b]; answer me quickly.
translation:
  language: id
  text: Janganlah sembunyikan wajah-Mu dari hamba-Mu[a], sebab aku dalam kesesakan; jawablah aku segera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “hamba” juga dapat berarti “budak,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל
  choice: Janganlah
  rationale: וְ menghubungkan permohonan ini dengan konteks sebelumnya, sedangkan אַל dengan bentuk tak sempurna menyatakan larangan atau permohonan negatif. Dalam puisi Indonesia, hubungan itu tetap wajar tanpa harus menerjemahkan וְ secara eksplisit sebagai “dan”.
- source_word: תַּסְתֵּר
  choice: sembunyikan
  rationale: Kata סתר berarti “menyembunyikan.” Pilihan ini mempertahankan metafora Ibrani ketika dipadukan dengan “wajah”.
- source_word: פָּנֶיךָ
  choice: wajah-Mu
  rationale: Terjemahan harfiah “wajah-Mu” mempertahankan gambaran puitis tentang perhatian, perkenanan, dan kehadiran Allah tanpa menggantikannya dengan tafsiran abstrak.
- source_word: מֵעַבְדֶּךָ
  choice: dari hamba-Mu
  rationale: עבד dapat berarti hamba, pelayan, atau budak. Dalam doa mazmur kepada Allah, “hamba-Mu” menyampaikan kerendahan dan kepunyaan secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi permohonan sebelumnya; “sebab” mempertahankan hubungan kausal secara ringkas dan sesuai dengan ragam puitis.
- source_word: צַר לִי
  choice: aku dalam kesesakan
  rationale: Ungkapan ringkas ini menyatakan keadaan terdesak atau menderita. “Dalam kesesakan” mempertahankan kekuatan citra tekanan sekaligus dapat dipahami pembaca modern.
- source_word: מַהֵר
  choice: segeralah
  rationale: Bentuk ini menyampaikan desakan untuk bertindak cepat. “Segeralah” secara alami menerangkan perintah berikutnya dan mempertahankan urgensi doa.
- source_word: עֲנֵנִי
  choice: jawab aku
  rationale: Dalam konteks doa, ענה lazim berarti “menjawab.” Ungkapan ini langsung, jelas, dan setia pada permohonan pemazmur.
theological_decisions:
- issue: Bahasa antropomorfis tentang hubungan Allah dengan manusia
  choice: Mempertahankan “wajah-Mu” dalam teks utama
  alternative: kehadiran-Mu; perkenanan-Mu
  rationale: Ungkapan “wajah” dalam bahasa Ibrani dapat menunjuk pada perhatian, perkenanan, atau kehadiran Allah. Mempertahankan metaforanya menjaga kekayaan puitis dan teologis tanpa menetapkan hanya satu nuansa.
- issue: Makna עבד dalam hubungan pemazmur dengan Allah
  choice: hamba-Mu
  alternative: budak-Mu; pelayan-Mu
  rationale: Walaupun עבד dapat menunjuk pada budak, dalam rumusan doa ini tekanannya adalah kerendahan, kepunyaan, dan pelayanan kepada Allah. “Hamba-Mu” paling alami dalam bahasa Indonesia serta tidak meniadakan nuansa ketundukan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan puitis. Bentuk “-lah” mempertahankan kesungguhan permohonan tanpa terdengar kuno. Metafora “wajah-Mu” dipertahankan; pronomina ilahi ditulis dengan huruf kapital sesuai konvensi umum penerbitan Alkitab Indonesia.
