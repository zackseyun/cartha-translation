  text: תְּהִי טִֽירָתָ֥/ם נְשַׁמָּ֑ה בְּ֝/אָהֳלֵי/הֶ֗ם אַל יְהִ֥י יֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/025.yaml
  text: May their encampment become desolate[b][a]; let there be no one dwelling in their tents.
translation:
  language: id
  text: Biarlah perkemahan mereka menjadi tandus[a]; jangan ada seorang pun yang tinggal di kemah-kemah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat tinggal mereka” atau “permukiman mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי
  choice: Biarlah ... menjadi
  rationale: Bentuk volitif ini menyatakan harapan atau permohonan kutukan, bukan sekadar ramalan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya jusifnya.
- source_word: טִירָתָם
  choice: perkemahan mereka
  rationale: טִירָה dapat menunjuk pada perkemahan atau tempat tinggal yang berpagar. “Perkemahan” mempertahankan gambaran kolektif yang konkret dan selaras dengan “kemah-kemah mereka” pada baris berikutnya.
- source_word: נְשַׁמָּה
  choice: menjadi sunyi
  rationale: Kata ini menggambarkan keadaan telantar atau tandus akibat kehancuran. “Menjadi sunyi” menyampaikan ketiadaan penghuni secara alami dalam konteks paralelisme ayat ini.
- source_word: בְּאָהֳלֵיהֶם
  choice: di kemah-kemah mereka
  rationale: אֹהֶל secara harfiah berarti “kemah” dan dalam puisi dapat meluas artinya menjadi tempat tinggal. Terjemahan ini mempertahankan citra konkret bahasa Ibrani.
- source_word: אַל יְהִי
  choice: jangan ada
  rationale: Konstruksi jusif negatif ini menyatakan permohonan atau harapan negatif. “Jangan ada” mempertahankan sifat volitifnya secara lugas.
- source_word: יֹשֵׁב
  choice: seorang pun yang tinggal
  rationale: Partisipel dari ישב di sini berarti orang yang menetap atau tinggal. Penambahan “pun” membuat cakupan negatif total terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Jusif kutukan dalam mazmur ratapan
  choice: 'Diterjemahkan sebagai permohonan atau harapan: “Biarlah ...; jangan ada ...”.'
  alternative: “Perkemahan mereka akan menjadi sunyi; tidak akan ada seorang pun yang tinggal di kemah-kemah mereka.”
  rationale: Bentuk-bentuk Ibrani bersifat volitif dan berfungsi sebagai kutukan atau permohonan di hadapan Allah, bukan semata-mata pernyataan tentang masa depan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Citra konkret “perkemahan” dan “kemah-kemah” dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
