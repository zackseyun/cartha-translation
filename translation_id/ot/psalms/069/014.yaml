  text: הַצִּילֵ֣/נִי מִ֭/טִּיט וְ/אַל אֶטְבָּ֑עָה אִנָּצְלָ֥ה מִ֝/שֹּֽׂנְאַ֗/י וּ/מִ/מַּֽעֲמַקֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/014.yaml
  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: id
  text: Selamatkanlah aku dari lumpur; jangan biarkan aku tenggelam.[a] Biarlah aku diselamatkan dari orang-orang yang membenci aku dan dari kedalaman air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan janganlah aku tenggelam.”'
    reason: Ungkapan utama menyatakan daya permohonan secara idiomatis, sedangkan catatan mempertahankan bentuk gramatikal Ibrani yang lebih langsung.
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Selamatkanlah aku
  rationale: Bentuk imperatif Hifil dari נצל dengan akhiran orang pertama tunggal menyatakan permohonan agar Allah secara aktif menyelamatkan pemazmur. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan desakan permohonan.
- source_word: מִטִּיט
  choice: dari lumpur
  rationale: טיט dapat berarti lumpur, tanah liat, atau kubangan berlumpur. “Lumpur” jelas bagi pembaca modern dan sesuai dengan gambaran tenggelam.
- source_word: וְאַל אֶטְבָּעָה
  choice: jangan biarkan aku tenggelam
  rationale: Partikel negatif dengan bentuk imperfek orang pertama tunggal mengungkapkan permohonan. Ungkapan ini menyampaikan daya volitifnya secara alami, meskipun bentuk Ibraninya secara lebih harfiah berbunyi “janganlah aku tenggelam.”
- source_word: אִנָּצְלָה
  choice: Biarlah aku diselamatkan
  rationale: Bentuk kohortatif Nifal dari נצל memperbarui permohonan dalam bentuk pasif. Terjemahan ini mempertahankan hubungan leksikal dengan הַצִּילֵנִי dan paralelisme puitisnya.
- source_word: מִשֹּׂנְאַי
  choice: dari orang-orang yang membenci aku
  rationale: Ungkapan ini secara harfiah menunjuk kepada mereka yang membenci pemazmur. Terjemahan transparan ini tidak menggantinya dengan istilah interpretatif “musuh-musuhku.”
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: dan dari kedalaman air
  rationale: מַעֲמַקֵּי adalah bentuk konstruk jamak yang berarti tempat-tempat atau bagian-bagian yang dalam. “Kedalaman air” mempertahankan struktur puitis dan gambaran bahaya yang menelan pemazmur.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan nada permohonan yang khidmat. Pengulangan akar נצל dipertahankan melalui “selamatkanlah” dan “diselamatkan,” sementara paralelisme dan citra lumpur, tenggelam, serta kedalaman air tetap jelas.
