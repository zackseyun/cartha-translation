translation:
  language: id
  text: 'Untuk pemimpin musik: menurut “Bunga Bakung”[a]. Dari Daud[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dengan lagu ‘Bunga Bakung’”; frasa ini tampaknya menyebut nama lagu atau corak musik.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “Dari Daud” dapat menunjukkan kepengarangan, peruntukan, kepunyaan, atau hubungan dengan Daud; ungkapan itu sendiri tidak memastikan salah satunya.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, istilah ini merupakan petunjuk bagi orang yang memimpin pelaksanaan musik atau ibadah. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasinya hanya pada pemimpin paduan suara.
- source_word: עַל
  choice: menurut
  rationale: Dalam petunjuk musik pada judul mazmur, kata ini dapat memperkenalkan lagu, corak, atau cara pembawaan. “Menurut” mempertahankan keluwesan hubungan tersebut tanpa memastikan satu arti teknis.
- source_word: שׁוֹשַׁנִּים
  choice: “Bunga Bakung”
  rationale: Secara harfiah berarti bunga-bunga bakung, tetapi di sini kemungkinan merupakan nama lagu atau corak musik. Tanda petik menandai pemakaian sebagai judul tanpa menghilangkan arti leksikalnya.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan ini dapat menunjukkan kepengarangan, peruntukan, kepunyaan, atau hubungan dengan Daud. “Dari Daud” cukup alami sebagai judul dan tidak setegas “karya Daud” dalam menetapkan kepengarangan.
theological_decisions:
- issue: Makna hubungan לְדָוִד dengan Daud
  choice: Dari Daud
  alternative: Karya Daud; untuk Daud; milik Daud
  rationale: Bentuk Ibrani sendiri tidak memastikan apakah Daud adalah pengarang, penerima persembahan, pemilik, atau tokoh yang dikaitkan dengan mazmur ini; terjemahan dan catatan mempertahankan keterbukaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat sebagai judul mazmur. “Pemimpin pujian” dipilih agar mudah dipahami pembaca modern, sedangkan tanda petik pada “Bunga Bakung” memberi isyarat bahwa istilah itu mungkin merupakan nama lagu.
