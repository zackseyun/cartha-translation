source:
  edition: WLC
  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: id
  text: Namun aku, doaku tertuju kepada-Mu, ya Yahweh, pada waktu perkenanan[a]. Ya Allah, dalam kelimpahan kasih setia-Mu, jawablah aku dalam kebenaran keselamatan-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada waktu yang berkenan.” Ungkapan Ibrani ini menunjuk pada waktu yang menguntungkan bagi Allah untuk mendengar dan bertindak.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dalam kesetiaan keselamatan-Mu” atau “dengan keselamatan-Mu yang dapat diandalkan.” Kata Ibrani אֱמֶת dapat berarti kebenaran, kesetiaan, atau keandalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Konjungsi dan pronomina mandiri menyatakan kontras sekaligus penekanan; bentuk ini wajar dalam bahasa Indonesia dan tetap mempertahankan keduanya.
- source_word: תְפִלָּתִי לְךָ
  choice: doaku tertuju kepada-Mu
  rationale: Nomina תְפִלָּה berarti 'doa', sedangkan לְךָ menunjukkan arah atau pihak yang disapa. Penambahan 'tertuju' mengungkapkan hubungan yang dalam bahasa Ibrani tidak memerlukan kopula.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עֵת רָצוֹן
  choice: pada waktu perkenanan
  rationale: Frasa ini menunjuk pada waktu yang berkenan atau menguntungkan bagi Allah untuk mendengar dan bertindak; 'waktu perkenanan' mempertahankan ungkapan puitis sumber.
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Kata ini merupakan sapaan yang diperbarui; partikel 'ya' menandainya secara alami dalam bahasa Indonesia.
- source_word: בְּרָב חַסְדֶּךָ
  choice: dalam kelimpahan kasih setia-Mu
  rationale: רֹב menyatakan kelimpahan, sedangkan חֶסֶד mencakup kasih, kemurahan, dan loyalitas yang teguh. 'Kasih setia' merupakan padanan Indonesia yang ringkas dan berbobot.
- source_word: עֲנֵנִי
  choice: jawablah aku
  rationale: Bentuk imperatif ini merupakan permohonan langsung agar Allah menjawab doa pemazmur.
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: dalam kesetiaan keselamatan-Mu
  rationale: אֱמֶת dapat berarti kebenaran, kesetiaan, atau keandalan. 'Kesetiaan' menghasilkan frasa Indonesia yang lebih dapat dipahami sambil mempertahankan hubungan gramatikalnya dengan 'keselamatan-Mu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Makna אֱמֶת yang menerangkan keselamatan Allah
  choice: kesetiaan
  alternative: kebenaran atau keandalan
  rationale: Kata Ibrani ini mencakup kebenaran objektif dan sifat dapat dipercaya. Konteks permohonan akan pertolongan mendukung 'kesetiaan', tetapi kemungkinan 'kebenaran' dan 'keandalan' tetap dicatat agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern dengan laras doa yang puitis dan bermartabat. Pronomina yang mengacu kepada Allah ditulis dengan huruf kapital. Struktur paralel dan dua sapaan ilahi dipertahankan tanpa menambahkan penafsiran denominasi.
