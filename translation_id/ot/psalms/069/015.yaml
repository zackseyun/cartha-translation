  yaml_path: translation/ot/psalms/069/015.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
translation:
  language: id
  text: Jangan biarkan arus air menghanyutkan aku[a], jangan biarkan kedalaman menelan aku, dan jangan biarkan sumur[b] menutup mulutnya di atasku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aliran air yang deras.”
    reason: lexical_alternative
  - marker: b
    text: Atau “lubang”; Ibrani dapat berarti “sumur,” tetapi dalam konteks puitis ini mungkin menggambarkan lubang yang mematikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  choice: menghanyutkan aku
  rationale: Kata kerja שטף menggambarkan air yang melanda atau menyeret. “Menghanyutkan” menyampaikan daya rusak arus deras secara alami dalam bahasa Indonesia.
- source_word: שִׁבֹּלֶת מַיִם
  choice: arus air
  rationale: Dalam konteks ini שִׁבֹּלֶת menunjuk pada arus atau aliran air yang deras. “Arus air” mempertahankan gambaran gerakan air tanpa membatasi maknanya hanya pada banjir.
- source_word: תִּבְלָעֵנִי
  choice: menelan aku
  rationale: בלע secara langsung berarti “menelan”; pilihan ini mempertahankan personifikasi puitis tentang kedalaman air yang melahap pemazmur.
- source_word: מְצוּלָה
  choice: air yang dalam
  rationale: Nomina ini menunjuk pada kedalaman, khususnya kedalaman perairan. “Air yang dalam” jelas bagi pembaca modern dan tetap selaras dengan gambaran tenggelam.
- source_word: תֶּאְטַר
  choice: mengatupkan
  rationale: Kata kerja ini menyatakan tindakan menutup. “Mengatupkan” cocok dengan metafora mulut yang tertutup di atas seseorang.
- source_word: בְּאֵר
  choice: sumur
  rationale: Makna leksikal biasa בְּאֵר adalah “sumur.” Terjemahan ini dipertahankan dari teks Ibrani, sementara kemungkinan nuansa lubang maut dijelaskan dalam catatan.
- source_word: פִּיהָ
  choice: mulutnya
  rationale: Terjemahan harfiah ini mempertahankan personifikasi sumur sebagai sesuatu yang dapat menutup mulutnya.
- source_word: עָלַי
  choice: di atasku
  rationale: Dalam gambaran seseorang yang berada di dalam sumur, frasa ini menyatakan bahwa bukaan sumur tertutup di atas dirinya.
