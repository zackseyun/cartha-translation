base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/030.yaml
  text: I will praise the name of God with song[a], and I will magnify him with thanksgiving.
translation:
  language: id
  text: Aku akan memuji nama Allah dengan nyanyian, dan mengagungkan Dia dengan ucapan syukur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan persembahan syukur”; kata Ibrani תּוֹדָה dapat berarti ucapan syukur atau persembahan syukur, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Aku akan memuji
  rationale: Bentuk kohortatif orang pertama tunggal menyatakan tekad atau kehendak; bentuk futur bahasa Indonesia secara alami menyampaikan tekad tersebut.
- source_word: שֵׁם אֱלֹהִים
  choice: nama Allah
  rationale: Mempertahankan ungkapan konstruksi Ibrani secara langsung dan wajar dalam bahasa Indonesia.
- source_word: בְּשִׁיר
  choice: dengan nyanyian
  rationale: Preposisi ב menyatakan sarana atau cara; 'dengan nyanyian' alami serta mempertahankan gambaran pujian musikal.
- source_word: וַאֲגַדְּלֶנּוּ
  choice: dan mengagungkan Dia
  rationale: Bentuk dari גדל di sini berarti menyatakan atau memuliakan kebesaran Allah. 'Mengagungkan' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'membuat-Nya besar'.
- source_word: בְתוֹדָה
  choice: dengan ucapan syukur
  rationale: תּוֹדָה dapat berarti ucapan syukur atau persembahan syukur. Paralelisme dengan pujian dan nyanyian mendukung tindakan mengucap syukur, sementara catatan kaki mempertahankan kemungkinan arti persembahan.
theological_decisions:
- issue: Apakah תּוֹדָה berarti ucapan syukur atau persembahan syukur
  choice: ucapan syukur
  alternative: persembahan syukur
  rationale: Konteks langsung menyejajarkannya dengan tindakan verbal dan musikal—memuji, bernyanyi, dan mengagungkan—sehingga 'ucapan syukur' paling sesuai, tetapi arti sakrificial tetap mungkin secara leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada ibadah tanpa menjadi arkais. Pronomina 'Aku' mengikuti suara pemazmur; 'Dia' ditulis dengan huruf kapital sebagai rujukan hormat kepada Allah. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkan.
