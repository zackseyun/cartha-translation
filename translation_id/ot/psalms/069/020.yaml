base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: id
  text: Celaan telah menghancurkan hatiku, dan aku sakit. Aku mengharapkan belas kasih[a], tetapi tidak ada; aku menantikan penghibur, tetapi tidak menemukan seorang pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “simpati.”'
    reason: alternatif_leksikal
lexical_decisions:
- source_word: חֶרְפָּה
  choice: celaan
  rationale: Kata ini mencakup penghinaan verbal sekaligus aib yang ditimpakan oleh orang lain. “Celaan” alami dalam ratapan dan mempertahankan kedua nuansa tersebut.
- source_word: שָׁבְרָה
  choice: telah menghancurkan
  rationale: Bentuk perfektif menyatakan tindakan yang akibatnya masih dirasakan. “Telah menghancurkan” mengungkapkan dampak berat pada batin tanpa harus memakai ungkapan yang lebih kuat seperti “meremukkan”.
- source_word: לִבִּי
  choice: hatiku
  rationale: “Hati” menunjuk pada batin, termasuk perasaan dan keteguhan diri. Padanan harfiah ini juga alami dalam bahasa Indonesia.
- source_word: וָאֲנוּשָׁה
  choice: dan aku sakit
  rationale: Bentuk ini menggambarkan keadaan menderita atau sakit berat. Terjemahan ringkas “aku sakit” mempertahankan kemungkinan penderitaan jasmani maupun batin tanpa mempersempitnya menjadi penyakit yang tidak tersembuhkan.
- source_word: וָאֲקַוֶּה
  choice: aku mengharapkan
  rationale: Kata kerjanya dapat berarti menanti atau berharap. Dalam konteks ini, “mengharapkan” menyampaikan penantian akan tanggapan manusia dengan wajar.
- source_word: לָנוּד
  choice: belas kasih
  rationale: Infinitif ini menunjuk pada sikap ikut merasakan penderitaan seseorang. “Belas kasih” lebih jelas bagi pembaca umum daripada “komiserasi” dan tidak bertumpang tindih sepenuhnya dengan tindakan menghibur pada klausa berikutnya.
- source_word: וָאַיִן
  choice: tetapi tidak ada
  rationale: Ungkapan ketiadaan ini menegaskan bahwa tanggapan yang diharapkan sama sekali tidak muncul. “Tetapi” menyatakan kontras kontekstual dengan jelas.
- source_word: וְלַמְנַחֲמִים
  choice: aku mencari para penghibur
  rationale: Partisipel jamak menunjuk kepada orang-orang yang akan memberi penghiburan. Penambahan “aku mencari” secara alami meneruskan gagasan penantian dalam klausa sebelumnya dan mempertahankan rujukan personal jamaknya.
- source_word: וְלֹא מָצָאתִי
  choice: tetapi tidak menemukan seorang pun
  rationale: Terjemahan ini menyatakan kegagalan menemukan orang-orang yang dicari serta mempertahankan kesejajaran ratapan.
theological_decisions:
- issue: Penggunaan mesianik dalam penafsiran Kristen
  choice: Ayat diterjemahkan menurut konteks asalnya sebagai ratapan seorang pribadi, tanpa menambahkan bahasa mesianik secara eksplisit.
  alternative: Menjadikan penderitaan Mesias sebagai prediksi langsung dalam teks utama.
  rationale: Mazmur 69 diterapkan kepada Yesus dalam Perjanjian Baru, tetapi makna bahasa Ibrani ayat ini tetap harus disajikan dalam konteks ratapannya. Redaksi ini tetap terbuka bagi penerapan mesianik kemudian tanpa memasukkannya secara tersirat ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa mempertahankan gerak ratapan dari luka batin menuju harapan akan belas kasih dan penghiburan, lalu ketiadaan keduanya.
