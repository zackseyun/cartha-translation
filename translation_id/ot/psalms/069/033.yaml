  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: id
  text: Sebab Yahweh mendengarkan orang-orang miskin, dan Ia tidak memandang hina para tahanan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para tawanan-Nya.” Istilah Ibrani ini dapat merujuk secara luas kepada orang-orang yang berada dalam perbudakan atau kurungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi ajakan untuk memuji dalam konteks sebelumnya dan mempertahankan daya kausalnya.
- source_word: שֹׁמֵעַ
  choice: mendengarkan
  rationale: Partisipel Qal menggambarkan tindakan Yahweh yang menjadi ciri-Nya; “mendengarkan” dapat mencakup perhatian dan tanggapan, bukan sekadar kemampuan mendengar.
- source_word: אֶל אֶבְיוֹנִים
  choice: orang-orang yang berkekurangan
  rationale: אֶבְיוֹנִים menunjuk kepada orang miskin atau yang membutuhkan. Pilihan ini alami dalam bahasa Indonesia modern dan tidak membatasi maknanya hanya pada kemiskinan materi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: וְאֶת
  choice: dan
  rationale: Kata sambung menghubungkan objek kedua dari perhatian ilahi; penanda objek אֶת tidak perlu diterjemahkan tersendiri.
- source_word: אֲסִירָיו
  choice: para tahanan-Nya
  rationale: אֲסִיר dapat berarti tahanan atau tawanan, dan akhiran orang ketiga tunggal dipertahankan dengan “-Nya”. “Tahanan” menjaga gagasan orang yang ditahan tanpa menentukan jenis penahanannya.
- source_word: לֹא בָזָה
  choice: Ia tidak memandang hina
  rationale: Bentuk perfektif dalam konteks puitis ini menyatakan kebenaran umum. “Memandang hina” secara alami menyampaikan tindakan memperlakukan dengan penghinaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; bentuk “Yahweh” mempertahankan rujukan nama itu tanpa mengubahnya menjadi gelar.
- issue: Makna kepunyaan dalam אֲסִירָיו
  choice: para tahanan-Nya
  alternative: para tahanan
  rationale: Akhiran posesif Ibrani dipertahankan agar hubungan mereka dengan Yahweh tidak dihilangkan, tetapi terjemahan ini tidak menentukan apakah mereka dipenjarakan oleh-Nya atau merupakan orang-orang yang menjadi milik-Nya dan sedang ditahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa puitis. Kapitalisasi “Ia” dan akhiran “-Nya” dipakai untuk rujukan kepada Yahweh. Penanda catatan kaki ditempatkan sesudah istilah yang dijelaskannya.
