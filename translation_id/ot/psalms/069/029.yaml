  text: וַ֭/אֲנִי עָנִ֣י וְ/כוֹאֵ֑ב יְשׁוּעָתְ/ךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/029.yaml
  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
translation:
  language: id
  text: 'Namun aku tertindas dan kesakitan;

    ya Allah, biarlah keselamatan-Mu

    menempatkan aku di tempat tinggi yang aman.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keselamatan-Mu, ya Allah, akan menempatkan aku di tempat tinggi yang aman.” Bentuk kata kerja Ibraninya dapat dipahami sebagai permohonan ataupun sebagai pernyataan tentang masa depan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Kata penghubung dan pronomina ini menandai kontras dengan konteks sebelumnya. “Namun aku” menyampaikan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: עָנִי
  choice: tertindas
  rationale: Dalam Mazmur, kata ini dapat berarti miskin, rendah, membutuhkan pertolongan, atau menderita karena penindasan. Dalam pasangan dengan “kesakitan”, “tertindas” paling tepat mengungkapkan keadaan sengsara yang dimaksud tanpa membatasinya pada kemiskinan ekonomi.
- source_word: וְכוֹאֵב
  choice: dan kesakitan
  rationale: Bentuk partisip ini menyatakan keadaan sedang menderita atau mengalami rasa sakit. “Kesakitan” alami dan cukup luas untuk mencakup penderitaan yang tidak dijelaskan lebih khusus.
- source_word: יְשׁוּעָתְךָ
  choice: keselamatan-Mu
  rationale: Kata benda ini menunjuk pada keselamatan atau pembebasan. “Keselamatan-Mu” mempertahankan keluasan makna Ibrani, sementara konteksnya tetap menyiratkan pertolongan nyata dari Allah.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Dalam konteks ini kata tersebut merupakan sapaan langsung. “Ya Allah” merupakan bentuk doa yang alami, modern, dan bermartabat dalam bahasa Indonesia.
- source_word: תְּשַׂגְּבֵנִי
  choice: menempatkan aku di tempat tinggi yang aman
  rationale: Kata kerja שׂגב dalam bentuk Piel menggambarkan tindakan menempatkan seseorang di tempat tinggi yang tidak mudah dicapai musuh, sehingga ia aman. Terjemahan ini mempertahankan gambaran spasial sekaligus menjelaskan nuansa perlindungannya.
theological_decisions:
- issue: Daya modal bentuk imperfek תְּשַׂגְּבֵנִי
  choice: 'Permohonan: “biarlah keselamatan-Mu menempatkan aku”'
  alternative: 'Pernyataan masa depan: “keselamatan-Mu akan menempatkan aku”'
  rationale: Dalam konteks ratapan dan doa, bentuk imperfek ini secara wajar dapat berfungsi seperti jusif, yaitu sebagai permohonan. Namun bentuknya juga memungkinkan pembacaan sebagai pernyataan masa depan; karena itu alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak doa yang sederhana dan bermartabat. Susunan baris mempertahankan gerak puitis ayat. Ungkapan “tempat tinggi yang aman” mempertahankan metafora Ibrani tanpa mereduksinya hanya menjadi “melindungi” atau mengalihkannya menjadi gagasan pemuliaan.
