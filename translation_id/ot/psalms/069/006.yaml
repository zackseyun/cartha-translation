  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: id
  text: Janganlah orang-orang yang berharap kepada-Mu mendapat malu karena aku[a], ya Tuhan Yahweh semesta alam[b]; janganlah orang-orang yang mencari Engkau dipermalukan karena aku, ya Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang menantikan Engkau.” Partisipel Ibrani dapat menyatakan penantian yang disertai pengharapan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Tuhan Yahweh bala tentara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: mendapat malu
  rationale: Bentuk Qal dari בוש menyatakan mengalami malu atau kehinaan; “mendapat malu” wajar dalam bahasa Indonesia dan mempertahankan nuansa hasil tanpa menjadikannya tindakan kausatif yang terlalu tegas.
- source_word: בִי
  choice: karena aku
  rationale: Dalam konteks ini, ב dengan pronomina orang pertama menyatakan bahwa pemazmur dapat menjadi sebab atau alasan orang lain dipermalukan; “karena aku” menyampaikan daya kausal itu secara alami.
- source_word: קֹוֶיךָ
  choice: orang-orang yang berharap kepada-Mu
  rationale: Partisipel קוה dapat berarti menanti dengan penuh harap atau berharap. Pilihan ini menonjolkan penantian yang disertai kepercayaan, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: Tuhan Yahweh semesta alam
  rationale: “Tuhan” mewakili אֲדֹנָי, “Yahweh” mempertahankan nama ilahi יְהוָה, dan “semesta alam” memakai ungkapan Indonesia yang dikenal untuk gelar צְבָאוֹת tanpa menggantinya dengan konsep “Yang Mahakuasa.”
- source_word: יִכָּלְמוּ
  choice: dipermalukan
  rationale: כלם bertumpang tindih dengan בוש tetapi dapat menekankan kehinaan atau aib. “Dipermalukan” membedakannya dari “mendapat malu” pada baris pertama dan mempertahankan variasi dalam paralelisme.
- source_word: מְבַקְשֶׁיךָ
  choice: orang-orang yang mencari Engkau
  rationale: Partisipel בקש menunjukkan tindakan mencari yang berlangsung; frasa ini jelas dan alami dalam bahasa Indonesia serta mempertahankan objek personalnya.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini berarti Allah yang terkait dengan Israel dan berfungsi sebagai sapaan; partikel “ya” membuat fungsi vokatifnya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה dalam sapaan gabungan אֲדֹנָי יְהוָה
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH; Tuhan TUHAN
  rationale: “Yahweh” menyajikan nama perjanjian secara langsung, sedangkan “Tuhan” mewakili אֲדֹנָי. Pilihan ini juga menghindari rangkaian “Tuhan TUHAN” yang janggal.
- issue: Makna gelar צְבָאוֹת
  choice: semesta alam
  alternative: bala tentara; bala tentara surgawi
  rationale: Gelar Ibrani secara harfiah berkaitan dengan pasukan atau bala tentara, tetapi cakupan rujukannya tidak harus dipersempit secara eksplisit kepada pasukan manusia atau surgawi. Ungkapan tradisional Indonesia dipakai dalam teks, dan gambaran harfiahnya dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “ya” ditambahkan untuk memperjelas fungsi vokatif. Kapitalisasi pronomina ilahi mengikuti kebiasaan hormat dalam penerbitan Alkitab Indonesia, tanpa mengubah makna gramatikal sumber.
