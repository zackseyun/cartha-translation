base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: id
  text: Sebab semangat yang berkobar untuk rumah-Mu telah melahap aku[a][b], dan celaan orang-orang yang mencela-Mu telah menimpa aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “telah memakan aku.”'
    reason: lexical_alternative
  - marker: b
    text: Ayat ini dikutip dalam Yohanes 2:17 sehubungan dengan Yesus.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi keadaan pemazmur dalam konteks sekitarnya; “sebab” mempertahankan fungsi penjelasnya secara alami.
- source_word: קִנְאַת
  choice: semangat yang berkobar
  rationale: Dalam konteks ini kata tersebut menyatakan pengabdian yang kuat dan berapi-api, bukan iri hati. Ungkapan ini lebih jelas bagi pembaca Indonesia daripada “kecemburuan” atau “zelotisme”.
- source_word: בֵּיתְךָ
  choice: rumah-Mu
  rationale: Terjemahan harfiah ini mempertahankan sebutan Ibrani bagi tempat kediaman Allah tanpa mempersempitnya menjadi “Bait Allah” di dalam teks utama.
- source_word: אֲכָלָתְנִי
  choice: telah menghabiskan aku
  rationale: Kata kerja ini secara harfiah berarti “telah memakan aku”, tetapi dipakai secara idiomatis untuk sesuatu yang melanda atau menguras diri sepenuhnya. “Menghabiskan aku” mempertahankan daya ungkapnya dalam bahasa Indonesia alami.
- source_word: וְחֶרְפּוֹת
  choice: dan celaan
  rationale: Nomina jamak ini menunjuk pada penghinaan atau cercaan. “Celaan” memungkinkan hubungan akar kata dengan partisip berikutnya dipertahankan.
- source_word: חֹרְפֶיךָ
  choice: orang-orang yang mencela-Mu
  rationale: Bentuk partisip ini menunjuk kepada orang-orang yang mencela Allah. Pilihan ini alami sekaligus mempertahankan pengulangan akar kata dengan “celaan”.
- source_word: נָפְלוּ עָלָי
  choice: telah menimpa aku
  rationale: Ungkapan ini menyatakan bahwa celaan yang ditujukan kepada Allah jatuh atau beralih kepada pemazmur. “Menimpa aku” merupakan padanan idiomatis yang dekat dengan gambaran sumber.
theological_decisions:
- issue: Gema mesianik dan kanonik ayat ini
  choice: Ayat diterjemahkan menurut suara pemazmur dalam konteks langsungnya, sementara penerapannya kepada Yesus dicatat dalam catatan kaki.
  alternative: Memasukkan penafsiran kristologis secara eksplisit ke dalam teks utama.
  rationale: Teks Ibrani berbicara langsung dalam suara pemazmur. Yohanes 2:17 menerapkannya kepada Yesus, tetapi penerapan kanonik itu tidak boleh menggantikan atau mempersempit makna teks Mazmur dalam terjemahan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan tanpa menjadi arkais. Pengulangan “celaan—mencela” sengaja dipertahankan untuk mencerminkan permainan akar kata Ibrani. Kapital pada pronomina “-Mu” mengikuti gaya penghormatan yang lazim dalam Alkitab bahasa Indonesia.
