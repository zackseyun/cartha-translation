  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: id
  text: Curahkanlah kemarahan-Mu atas mereka, dan biarlah murka-Mu yang menyala-nyala menyusul mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁפָךְ
  choice: Curahkanlah
  rationale: Bentuk imperatif ini menggambarkan geram Allah seolah-olah cairan yang dicurahkan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan metafora Ibrani.
- source_word: עֲלֵיהֶם
  choice: ke atas mereka
  rationale: Preposisi עַל di sini mengarahkan pencurahan geram kepada sasaran. 'Ke atas mereka' sesuai dengan verba 'curahkanlah' dan jelas bagi pembaca modern.
- source_word: זַעְמֶךָ
  choice: geram-Mu
  rationale: זַעַם menunjuk pada kemarahan keras, khususnya dalam penghukuman ilahi. 'Geram' mempertahankan daya ungkapnya sekaligus membedakannya dari ungkapan murka pada klausa berikut.
- source_word: וַחֲרוֹן אַפְּךָ
  choice: dan biarlah murka-Mu yang menyala-nyala
  rationale: Ungkapan Ibrani חֲרוֹן אַף secara harfiah berkaitan dengan panas atau nyalanya hidung dan secara idiomatis berarti murka yang berkobar. 'Murka-Mu yang menyala-nyala' mempertahankan citra panas dengan bahasa Indonesia yang wajar.
- source_word: יַשִּׂיגֵם
  choice: menyusul mereka
  rationale: Bentuk ini berarti mencapai atau menyusul sesuatu yang dikejar. 'Menyusul mereka' mempertahankan gambaran murka yang mengejar lalu mencapai sasarannya.
theological_decisions:
- issue: Permohonan kutukan terhadap para musuh
  choice: Mempertahankan permohonan langsung agar penghakiman Allah dicurahkan dan menyusul mereka.
  alternative: Melunakkannya menjadi permohonan agar Allah sekadar menunjukkan ketidaksenangan-Nya.
  rationale: Teks Ibrani secara tegas memohon tindakan murka ilahi. Ketegangan teologis dan kerasnya doa ini tidak boleh diredam dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Curahkanlah' mempertahankan seruan langsung; dua istilah, 'geram' dan 'murka', mencerminkan variasi leksikal teks sumber tanpa mengaburkan kesejajarannya.
