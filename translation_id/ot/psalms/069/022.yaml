  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: id
  text: 'Biarlah meja mereka yang di hadapan mereka menjadi perangkap,

    dan kesejahteraan mereka menjadi jerat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan kurban-kurban keselamatan mereka menjadi jerat.” Kata Ibrani שְׁלוֹמִים dapat dipahami sebagai kesejahteraan, tetapi juga dapat merujuk pada kurban keselamatan.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Biarlah ... menjadi
  rationale: Bentuk yusif menyatakan harapan atau kutukan. Ungkapan ini mempertahankan daya volitifnya secara wajar dalam bahasa Indonesia.
- source_word: שֻׁלְחָנָם
  choice: meja ... mereka
  rationale: Makna konkretnya adalah meja. Gambaran tentang hidangan atau kelimpahan tidak dijabarkan agar citra Ibrani tetap terpelihara.
- source_word: לִפְנֵיהֶם
  choice: di hadapan mereka
  rationale: Terjemahan spasial ini mempertahankan ironi bahwa sesuatu yang tersedia tepat di depan mereka berubah menjadi bahaya.
- source_word: לְפָח
  choice: menjadi perangkap
  rationale: פַּח berarti perangkap atau jerat. 'Perangkap' dipilih agar istilah puitis pasangannya dapat dibedakan.
- source_word: וְלִשְׁלוֹמִים
  choice: dan apa yang mendatangkan kesejahteraan bagi mereka
  rationale: שְׁלוֹמִים sulit ditafsirkan di sini dan dapat menunjuk pada kesejahteraan atau keamanan, sementara bentuk yang sama juga memiliki gema kultis berupa 'kurban keselamatan'. Rumusan utama menyampaikan pengertian abstrak yang paling sesuai dengan konteks tanpa meniadakan alternatif tersebut.
- source_word: לְמוֹקֵשׁ
  choice: menjadi jerat
  rationale: מוֹקֵשׁ lazim berarti jerat. Pembedaan dari 'perangkap' mencerminkan dua istilah perburuan yang berkerabat tetapi berbeda dalam teks Ibrani.
theological_decisions:
- issue: Makna שְׁלוֹמִים dalam kutukan ini
  choice: Dipahami secara abstrak sebagai sesuatu yang mendatangkan kesejahteraan bagi mereka
  alternative: Dipahami secara kultis sebagai kurban-kurban keselamatan mereka
  rationale: Konteks menyatakan pembalikan berkat atau keadaan baik menjadi sarana penghukuman. Namun, kedekatan gambaran 'meja' dan pemakaian kultis שְׁלוֹמִים membuat gema kurban tetap mungkin, sehingga dicatat tanpa menjadikannya tafsiran tunggal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme 'perangkap/jerat' serta bentuk kutukan puitis dipertahankan; baris kedua dibuat alami tanpa menutupi ketidakpastian leksikal.
