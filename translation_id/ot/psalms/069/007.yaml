  text: Sebab, aku menanggung cela karena Engkau; kehinaan menutupi wajahku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Partikel ini memperkenalkan alasan atau penjelasan bagi keterasingan pemazmur dalam konteks. 'Sebab' menyampaikan hubungan tersebut secara wajar tanpa penggandaan penghubung yang kaku dalam bahasa Indonesia.
- source_word: עָלֶיךָ
  choice: oleh karena Engkau
  rationale: Preposisi עַל di sini menyatakan sebab atau alasan, bukan lokasi. 'Oleh karena Engkau' mempertahankan fokus pada Allah sebagai alasan cela yang ditanggung, sedangkan 'demi Engkau' dapat menyiratkan tujuan atau manfaat secara lebih kuat.
- source_word: נָשָׂאתִי
  choice: aku menanggung
  rationale: Dengan חֶרְפָּה sebagai objek, נשׂא menggambarkan tindakan memikul atau menanggung cela. Bentuk kini alami dalam bahasa Indonesia untuk keadaan yang dialami pemazmur dan tetap relevan dalam ratapannya.
- source_word: חֶרְפָּה
  choice: cela
  rationale: Kata ini mencakup penghinaan, cercaan, dan aib yang ditimpakan orang lain. 'Cela' ringkas, lazim dalam laras mazmur, dan membedakannya dari כְלִמָּה pada klausa berikutnya.
- source_word: כִּסְּתָה
  choice: telah menutupi
  rationale: Terjemahan ini mempertahankan metafora konkret verba כסה, dengan subjek feminin כְלִמָּה yang muncul sesudah verba.
- source_word: כְלִמָּה
  choice: kehinaan
  rationale: Kata ini menunjuk pada rasa atau keadaan dipermalukan dan kehilangan kehormatan. 'Kehinaan' mempertahankan dimensi aib publik sekaligus menghindari pengulangan 'cela'.
- source_word: פָנַי
  choice: wajahku
  rationale: Dalam gambaran 'menutupi wajah', פָנִים paling alami dipahami sebagai wajah, yakni bagian diri yang tampak dan kini diliputi kehinaan.
theological_decisions: []
