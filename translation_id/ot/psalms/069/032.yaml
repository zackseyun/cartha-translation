  text: רָא֣וּ עֲנָוִ֣ים יִשְׂמָ֑חוּ דֹּרְשֵׁ֥י אֱ֝לֹהִ֗ים וִ/יחִ֥י לְבַבְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/032.yaml
  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
translation:
  language: id
  text: Orang-orang yang rendah hati[a] telah melihat dan bersukacita; hai orang-orang yang mencari Allah, kiranya hati kalian hidup.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang tertindas” atau “orang-orang yang lemah lembut.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kiranya hati kalian hidup”; ungkapan ini menunjuk pada pulihnya keberanian, daya hidup, atau harapan.
    reason: cultural_note
lexical_decisions:
- source_word: רָאוּ
  choice: melihat
  rationale: Bentuk Qal perfektif orang ketiga jamak. Bahasa Indonesia tidak wajib menandai kala; bentuk sederhana “melihat” mempertahankan hubungan puitis dengan respons berikutnya tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: עֲנָוִים
  choice: orang-orang yang rendah hati
  rationale: Kata ini dapat menunjuk kepada orang yang rendah hati atau lemah lembut, sekaligus dapat bernuansa orang yang tertindas atau sengsara. “Rendah hati” mempertahankan sisi moral-rohaninya tanpa meniadakan keadaan mereka yang hina atau tertindas.
- source_word: יִשְׂמָחוּ
  choice: lalu bersukacita
  rationale: Bentuk imperfektif dapat menyatakan respons kini atau mendatang yang hidup. “Lalu bersukacita” secara alami menghubungkan tindakan melihat dengan sukacita yang timbul, tanpa menetapkan kala secara berlebihan.
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: hai orang-orang yang mencari Allah
  rationale: Partisip konstruk dengan objek ini berfungsi sebagai sapaan karena klausa berikutnya memakai akhiran orang kedua jamak. “Hai” memperjelas peralihan kepada sapaan langsung.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk tersebut merujuk secara tunggal kepada Allah Israel; padanan baku bahasa Indonesia adalah “Allah”.
- source_word: וִיחִי לְבַבְכֶם
  choice: kiranya hati kalian hidup kembali
  rationale: Bentuk yusif dari חיה menyatakan harapan atau dorongan. Nomina “hati” berbentuk tunggal kolektif dengan akhiran orang kedua jamak; “hati kalian” mempertahankan bentuk kolektif itu dan memperjelas bahwa sapaannya jamak. “Hidup kembali” menyampaikan idiom tentang pulihnya keberanian, daya hidup, atau harapan.
theological_decisions:
- issue: Makna hidupnya hati
  choice: Mempertahankan gambaran “hati ... hidup kembali”
  alternative: “Kuatkanlah hati kalian” atau “bangkitlah kembali semangat kalian”
  rationale: Ungkapan sumber bersifat metaforis dan dapat mencakup keberanian, daya hidup, serta harapan yang diperbarui. Terjemahan harfiah yang wajar mempertahankan keluasan makna itu tanpa membatasinya pada satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan “hai orang-orang” mempertahankan corak mazmur yang khidmat, sedangkan “kalian” memperjelas bahwa akhiran Ibraninya jamak. Tidak ditambahkan objek setelah “melihat” karena teks sumber tidak menyatakannya.
