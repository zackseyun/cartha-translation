  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: id
  text: Biarlah mereka dihapus dari kitab kehidupan[a], dan biarlah mereka tidak dicatat bersama orang-orang benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kitab orang-orang yang hidup.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: Biarlah mereka dihapus
  rationale: Bentuk Nifal dalam rangkaian kutukan-permohonan menyatakan harapan atau permohonan pasif; “biarlah ... dihapus” mempertahankan daya jusif dan gambaran tulisan.
- source_word: מִסֵּפֶר
  choice: dari kitab
  rationale: סֵפֶר berarti dokumen tertulis, gulungan, atau kitab. “Kitab” alami dalam ungkapan ini dan selaras dengan gambaran pencatatan.
- source_word: חַיִּים
  choice: kehidupan
  rationale: Kata ini dapat berarti “kehidupan” atau “orang-orang yang hidup.” “Kitab kehidupan” mempertahankan ungkapan Ibrani yang dikenal tanpa menetapkan secara sempit jenis daftar yang dimaksud; kemungkinan lain dicantumkan dalam catatan kaki.
- source_word: וְעִם
  choice: dan ... bersama
  rationale: עִם secara harfiah berarti “bersama/dengan” dan di sini menyatakan bahwa nama mereka tidak boleh dimasukkan dalam kelompok yang sama dengan orang-orang benar.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Terjemahan substantival yang wajar bagi bentuk jamak ini dan mempertahankan kategori moral-perjanjian tanpa penafsiran tambahan.
- source_word: אַל יִכָּתֵבוּ
  choice: jangan dicatat
  rationale: אַל dengan bentuk imperfek menyatakan larangan atau harapan negatif. “Dicatat” mengungkapkan tindakan menuliskan nama ke dalam suatu daftar secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna “kitab kehidupan” dalam mazmur kutukan
  choice: Mempertahankan metafora “kitab kehidupan” tanpa menentukan apakah yang dimaksud ialah kehidupan di dunia, keanggotaan umat perjanjian, atau keselamatan akhir.
  alternative: “kitab orang-orang yang hidup,” yakni daftar mereka yang masih hidup
  rationale: Ungkapan Ibrani memungkinkan nuansa daftar ilahi, sementara pemakaiannya di bagian Alkitab lain dapat membawa gema eskatologis. Teks ayat ini sendiri tidak memaksa satu penafsiran teologis tertentu.
- issue: Daya ujar kutukan
  choice: 'Menerjemahkan bentuk verbal sebagai permohonan atau harapan: “Biarlah ... dan jangan ....”'
  alternative: 'Membacanya sebagai ramalan: “Mereka akan dihapus ...”'
  rationale: Dalam konteks rangkaian kutukan mazmur ini, bentuk-bentuk tersebut berfungsi secara jusif, bukan sebagai pernyataan prediktif biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Dihapus” dan “dicatat” mempertahankan kesatuan metafora kitab atau daftar, sedangkan “orang-orang benar” mudah dipahami pembaca umum.
