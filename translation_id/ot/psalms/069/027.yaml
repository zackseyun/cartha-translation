  terminology: “Kesalahan” mempertahankan rentang עָוֺן lebih baik daripada pilihan yang hanya menunjuk tindakan jahat atau hanya hukuman. “Kebenaran-Mu” adalah padanan yang layak untuk צדקתך; catatan “keadilan-Mu” dengan tepat mencatat nuansa yang mungkin tanpa mempersempit teks utama.
