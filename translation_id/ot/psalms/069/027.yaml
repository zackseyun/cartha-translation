  source_fidelity: 'Teks Indonesia dengan setia mencerminkan struktur Ibrani: imperatif kepada Allah, pengulangan עָוֺן untuk gagasan kesalahan/kesalahan mereka yang bertambah, permohonan negatif, dan gambaran mereka tidak masuk ke dalam צדקה Allah. “Kebenaran-Mu” mempertahankan keluasan צדקה tanpa memutuskan apakah yang ditekankan adalah kebenaran, keadilan, atau tindakan pembelaan Allah.'
