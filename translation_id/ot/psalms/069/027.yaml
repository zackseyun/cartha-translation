id: PSA.69.27
reference: Psalms 69:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תְּֽנָ/ה עָ֭וֺן עַל עֲוֺנָ֑/ם וְ/אַל יָ֝בֹ֗אוּ בְּ/צִדְקָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/027.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
translation:
  language: id
  text: Tambahkanlah kesalahan pada kesalahan mereka[a], dan jangan biarkan mereka masuk ke dalam kebenaran-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang sama dapat berarti perbuatan salah, kesalahan sebagai tanggungan, atau akibat maupun hukuman atas kesalahan.
    reason: lexical_alternative
  - marker: b
    text: Atau “keadilan-Mu.” Ungkapan Ibrani ini juga dapat menunjuk pada tindakan Allah yang adil atau yang membela.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: Tambahkanlah
  rationale: Bentuk imperatif dari נתן secara harfiah berarti “berikanlah” atau “taruhlah,” tetapi dalam susunan עָוֺן עַל עֲוֺנָם menyatakan penambahan satu kesalahan pada kesalahan yang sudah ada.
- source_word: עָוֺן / עֲוֺנָם
  choice: kesalahan / kesalahan mereka
  rationale: עָוֺן dapat menunjuk pada perbuatan salah, kesalahan sebagai tanggungan, atau akibat/hukumannya. “Kesalahan” mempertahankan keluasan makna itu dan memungkinkan pengulangan kata sumber tetap terdengar.
- source_word: עַל
  choice: pada
  rationale: Makna dasarnya “di atas/pada.” Dalam bahasa Indonesia, “tambahkan X pada Y” menyampaikan hubungan kumulatif secara alami.
- source_word: וְאַל יָבֹאוּ
  choice: dan jangan biarkan mereka masuk
  rationale: אַל dengan bentuk imperfek menyatakan permohonan atau harapan negatif. “Jangan biarkan” menunjukkan bahwa seruan ini ditujukan kepada Allah, sedangkan “masuk” mempertahankan gambaran gerak dari בוא.
- source_word: בְּצִדְקָתֶךָ
  choice: ke dalam kebenaran-Mu
  rationale: צְדָקָה mencakup kebenaran, keadilan, serta tindakan Allah yang membenarkan atau membela. “Kebenaran-Mu” mempertahankan istilah yang luas tanpa membatasi maksudnya pada satu nuansa.
theological_decisions:
- issue: Makna “kebenaran-Mu” dalam konteks doa penghukuman
  choice: kebenaran-Mu
  alternative: keadilan-Mu
  rationale: Ungkapan Ibrani dapat mengacu pada sifat benar Allah, tatanan keadilan-Nya, atau tindakan-Nya yang membela dan menyelamatkan. Teks utama mempertahankan ketegangan makna tersebut; alternatif dicatat tanpa menetapkan satu tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran hormat ilahi ditulis dengan huruf kapital. Pengulangan “kesalahan” serta gambaran “masuk ke dalam” dipertahankan agar struktur dan ambiguitas teks Ibrani tidak dihilangkan.
