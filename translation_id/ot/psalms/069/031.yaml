  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: id
  text: Hal itu akan lebih berkenan kepada Yahweh daripada seekor lembu[a]—seekor sapi jantan yang bertanduk dan berkuku belah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lebih baik daripada seekor lembu, seekor sapi jantan”; bahasa Ibrani membandingkan pujian dengan hewan kurban yang memenuhi syarat.
    reason: Alternatif leksikal untuk יטב serta penjelasan aposisi שׁוֹר פָּר dan gambaran hewan kurban.
lexical_decisions:
- source_word: וְתִיטַב
  choice: Itu akan lebih menyenangkan
  rationale: Bentuk Qal imperfek feminin tunggal dari יטב mengacu pada pujian atau ucapan syukur dalam ayat sebelumnya. Bersama מִן, bentuk ini menyatakan bahwa pujian tersebut lebih menyenangkan bagi Yahweh daripada kurban hewan.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri 'Yahweh'.
- source_word: מִשּׁוֹר
  choice: daripada seekor lembu
  rationale: Preposisi מִן menandai perbandingan. שׁוֹר diterjemahkan 'lembu' agar tetap dibedakan dari פָּר yang menyusul.
- source_word: פָּר
  choice: seekor sapi jantan
  rationale: פָּר memperjelas atau mengkhususkan שׁוֹר sebagai sapi jantan. Kedua sebutan dipertahankan untuk mencerminkan susunan aposisional bahasa Ibrani.
- source_word: מַקְרִן
  choice: yang bertanduk
  rationale: Bentuk deskriptif dari קרן menunjukkan bahwa hewan itu memiliki tanduk.
- source_word: מַפְרִיס
  choice: dan berkuku belah
  rationale: Bentuk dari פרס menggambarkan hewan yang membelah kuku; 'berkuku belah' merupakan ungkapan Indonesia yang ringkas dan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankan fungsi nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan pujian dengan kurban
  choice: Pujian akan lebih menyenangkan Yahweh daripada hewan kurban yang layak
  alternative: Pujian menggantikan atau meniadakan seluruh kurban
  rationale: Ayat menyatakan perbandingan nilai atau perkenanan, bukan secara eksplisit penghapusan sistem kurban. Terjemahan mempertahankan perbandingan tanpa menarik kesimpulan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Menyenangkan Yahweh' dipilih karena lebih alami daripada 'berkenan kepada Yahweh' ketika subjeknya adalah pujian. Pengulangan 'lembu, seekor sapi jantan' sengaja dipertahankan untuk mewakili dua istilah Ibrani dan hubungan aposisionalnya.
