base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/001.yaml
  text: Save me[a], O God, for the waters have come up to my neck.
translation:
  language: id
  text: Selamatkanlah aku[a], ya Allah, sebab air telah naik sampai ke leherku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sampai kepada jiwa.” Kata Ibrani nefesh dapat berarti “jiwa”, “nyawa”, “diri”, atau, dalam konteks seperti ini, tenggorokan atau leher.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Selamatkanlah aku
  rationale: Bentuk imperatif hifil dari ישׁע dengan akhiran orang pertama tunggal menyatakan permohonan langsung agar dilepaskan dari bahaya. “Selamatkanlah aku” alami dalam doa dan tetap mempertahankan bobot ungkapan Ibraninya.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung. Partikel “ya” menandai bentuk vokatif secara alami dan khidmat dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi permohonan sebelumnya. “Sebab” ringkas, jelas, dan sesuai dengan ragam puisi yang khidmat.
- source_word: בָאוּ
  choice: telah naik
  rationale: Secara harfiah berarti “telah datang”, tetapi bersama gambaran air yang mencapai leher, “telah naik” menyampaikan gerak air meninggi secara alami tanpa mengubah metaforanya.
- source_word: מַיִם
  choice: air
  rationale: Dalam bahasa Indonesia, “air” lazim dipakai sebagai nomina massa untuk gambaran ini. “Air bah” akan menambahkan kekhususan yang tidak dinyatakan langsung oleh teks Ibrani.
- source_word: עַד נָפֶשׁ
  choice: sampai ke leherku
  rationale: נֶפֶשׁ memiliki rentang makna “jiwa”, “nyawa”, “diri”, dan dalam konteks ancaman tenggelam dapat menunjuk daerah tenggorokan atau leher. “Sampai ke leherku” menyampaikan bahaya yang segera mengancam dengan jelas; arti harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan נֶפֶשׁ dalam gambaran puitis tentang bahaya air
  choice: Makna jasmani kontekstual, yaitu “leher”
  alternative: Makna yang lebih harfiah, “jiwaku”, atau makna eksistensial, “nyawaku”
  rationale: Ayat ini memakai gambaran konkret tentang seseorang yang nyaris tenggelam, bukan menetapkan ajaran antropologis mengenai jiwa. Terjemahan “leherku” membuat gambaran itu jelas sambil mempertahankan keluasan makna kata Ibrani melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan khidmat. Bentuk “Selamatkanlah” mempertahankan urgensi doa; “ya Allah” merupakan sapaan langsung yang wajar. Metafora air dipertahankan tanpa penjelasan tambahan dalam teks utama.
