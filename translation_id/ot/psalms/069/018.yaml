  text: קָרְבָ֣/ה אֶל נַפְשִׁ֣/י גְאָלָ֑/הּ לְמַ֖עַן אֹיְבַ֣/י פְּדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/018.yaml
  text: Come near to my soul[a]; redeem it. Because of my enemies[b], ransom me.
translation:
  language: id
  text: Mendekatlah kepada jiwaku[a] dan tebuslah jiwaku; oleh karena musuh-musuhku[b], bebaskanlah aku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani “jiwaku”; kata ini juga dapat berarti “nyawaku,” “hidupku,” atau “diriku,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “demi musuh-musuhku.” Dalam konteks ini, frasa Ibrani tersebut kemungkinan berarti “karena” atau “oleh karena” musuh-musuhku.
    reason: lexical_alternative
  - marker: c
    text: Kata kerja Ibrani di sini berarti membebaskan atau menebus. Kata ini berbeda dari kata “tebuslah” pada klausa sebelumnya, meskipun maknanya berkaitan erat.
    reason: lexical_distinction
lexical_decisions:
- source_word: קָרְבָה
  choice: Mendekatlah
  rationale: Bentuk imperatif qal orang kedua tunggal maskulin dari קרב. Pilihan ini mempertahankan seruan langsung kepada Allah dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפש dapat menunjuk pada jiwa, nyawa, kehidupan, atau diri. “Jiwaku” mempertahankan ungkapan Ibrani dan nada pribadi yang mendalam, sementara keluasan maknanya dijelaskan dalam catatan kaki.
- source_word: גְאָלָהּ
  choice: tebuslah dia
  rationale: Berasal dari גאל, yaitu menebus, memperoleh kembali, atau bertindak sebagai penebus. Sufiks feminin tunggal merujuk kembali kepada נפש; “dia” mempertahankan rujukan tersebut tanpa mengulang kata benda.
- source_word: לְמַעַן
  choice: karena
  rationale: Dalam konteks permohonan ini, musuh-musuh pemazmur paling wajar dipahami sebagai alasan ia meminta pertolongan. Namun, arti yang lebih harfiah, “demi,” tetap dicatat karena struktur Ibraninya memungkinkan nuansa itu.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Bentuk jamak dengan sufiks orang pertama tunggal; padanan ini langsung, jelas, dan lazim.
- source_word: פְּדֵנִי
  choice: bebaskanlah aku
  rationale: פדה menyatakan pembebasan melalui penebusan. “Bebaskanlah aku” membedakannya dari גאל pada klausa sebelumnya dan menghindari pengulangan kaku, sedangkan nuansa penebusannya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Pembedaan dua kata kerja penebusan, גאל dan פדה
  choice: Menerjemahkan גאל sebagai “tebuslah” dan פדה sebagai “bebaskanlah”
  alternative: Menerjemahkan keduanya sebagai “tebuslah,” atau menerjemahkan פדה dengan ungkapan eksplisit “tebuslah aku”
  rationale: Kedua kata kerja itu berhubungan tetapi tidak identik. Pilihan yang berbeda mempertahankan variasi dan intensifikasi puitis tanpa memasukkan teori teologis tentang harga tebusan yang tidak dinyatakan secara eksplisit dalam ayat ini.
- issue: Hubungan לְמַעַן dengan musuh-musuh pemazmur
  choice: “karena musuh-musuhku”
  alternative: “demi musuh-musuhku” atau “oleh karena musuh-musuhku”
  rationale: Konteks ratapan mendukung pengertian bahwa ancaman para musuh menjadi alasan permohonan pembebasan. Karena bentuk Ibrani juga dapat dibaca lebih harfiah sebagai “demi,” kemungkinan itu tidak dihapus, melainkan dicatat.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan langsung. Susunan paralel serta dua kata kerja pembebasan dipertahankan sejauh dapat dibaca secara alami. “Jiwaku” sengaja dipertahankan dengan catatan agar tidak mempersempit נפש hanya pada unsur rohani manusia.
