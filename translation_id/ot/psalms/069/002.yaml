source:
  edition: WLC
  text: טָבַ֤עְתִּי בִּ/יוֵ֣ן מְ֭צוּלָה וְ/אֵ֣ין מָעֳמָ֑ד בָּ֥אתִי בְ/מַעֲמַקֵּי מַ֝֗יִם וְ/שִׁבֹּ֥לֶת שְׁטָפָֽתְ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: id
  text: Aku telah tenggelam dalam lumpur yang dalam, tanpa tempat berpijak; aku telah masuk ke perairan yang dalam, dan arus deras telah menghanyutkan aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: Aku telah tenggelam
  rationale: Bentuk Qal perfektif orang pertama tunggal menyatakan keadaan yang telah dialami dan kini nyata; bentuk 'telah tenggelam' mempertahankan daya resultatifnya.
- source_word: בִּיוֵן מְצוּלָה
  choice: dalam lumpur yang dalam
  rationale: יוֵן berarti lumpur, sedangkan מְצוּלָה menunjuk tempat atau kedalaman; ungkapan ini mempertahankan kedua unsur gambaran tanpa menjadi terlalu teknis.
- source_word: וְאֵין מָעֳמָד
  choice: tanpa tempat berpijak
  rationale: מָעֳמָד adalah tempat berdiri atau tumpuan; 'tempat berpijak' alami dalam bahasa Indonesia dan sesuai dengan gambaran lumpur yang tidak stabil.
- source_word: בָּאתִי
  choice: aku telah masuk
  rationale: בוא secara dasar berarti datang atau masuk. Dengan perairan sebagai tujuan gerak, 'masuk' lebih alami dalam bahasa Indonesia sekaligus mempertahankan paralel bentuk perfektif.
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: ke perairan yang dalam
  rationale: Frasa ini menunjuk kedalaman air. 'Ke' menyatakan gerak yang tersirat oleh בוא, sedangkan 'perairan yang dalam' mempertahankan citra konkret.
- source_word: שִׁבֹּלֶת
  choice: arus deras
  rationale: Dalam konteks ini שִׁבֹּלֶת menunjuk aliran atau arus air yang kuat. 'Arus deras' mempertahankan makna leksikal dan kekuatan destruktif tanpa membatasi gambaran pada jenis banjir tertentu.
- source_word: שְׁטָפָתְנִי
  choice: telah menghanyutkan aku
  rationale: שטף berarti melanda, menggenangi, atau menyeret oleh air. 'Menghanyutkan' menyampaikan daya gerak air yang menguasai pemazmur secara konkret.
theological_decisions: []
