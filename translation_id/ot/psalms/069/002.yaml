  terminology: Pilihan 'lumpur yang dalam', 'tempat berpijak', 'perairan yang dalam', dan 'arus deras' konsisten dengan medan makna sumber. Tidak ada istilah teologis atau nama yang memerlukan penyesuaian. Tidak diperlukan catatan kaki Indonesia, karena pilihan 'arus deras' sudah berada dalam rentang makna yang didukung sumber dan audit Inggris.
