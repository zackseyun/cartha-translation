  source_fidelity: 'Teks Indonesia secara setia mencerminkan urutan dan citra Ibrani: tenggelam dalam lumpur berkedalaman, ketiadaan pijakan, masuk ke air yang dalam, lalu daya arus yang melanda/menghanyutkan pemazmur. Bentuk perfektif ''telah'' secara wajar menyampaikan keadaan yang sudah dialami dengan dampak yang masih terasa. ''Arus deras telah menghanyutkan aku'' merupakan pengungkapan yang sah untuk שִׁבֹּלֶת שְׁטָפָתְנִי, tanpa mengunci istilah itu pada satu jenis aliran air secara berlebihan.'
