translation:
  language: id
  text: 'Sebab mereka mengejar orang yang Kaupukul,

    dan menceritakan tentang penderitaan orang-orang yang Kaulukai.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang terbunuh oleh-Mu” atau “orang-orang yang tertikam oleh-Mu.” Kata Ibrani חֲלָלֶיךָ juga dapat menunjuk kepada orang-orang yang terbunuh atau tertikam oleh-Mu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi permohonan atau penghukuman dalam konteks sebelumnya; “sebab” mempertahankan hubungan kausal secara alami dalam bahasa Indonesia.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: orang yang Kaupukul
  rationale: Ungkapan Ibrani merujuk secara tunggal kepada orang yang dipukul Allah. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan rujukan tunggal tersebut.
- source_word: רָדָפוּ
  choice: mereka mengejar
  rationale: Kata רדף berarti mengejar atau memburu dan dalam konteks ratapan ini menyiratkan pengejaran yang bermusuhan. “Mengejar” mempertahankan gambaran konkret tanpa mengurangi nuansa permusuhan.
- source_word: וְאֶל
  choice: dan
  rationale: Preposisi אֶל digunakan secara idiomatis untuk memperkenalkan pokok yang mereka tuturkan. Dalam bahasa Indonesia, hubungan ini paling alami diungkapkan melalui verba transitif “menceritakan” tanpa menerjemahkan preposisinya secara terpisah.
- source_word: מַכְאוֹב
  choice: penderitaan
  rationale: מַכְאוֹב dapat berarti rasa sakit atau penderitaan. “Penderitaan” cocok dengan keadaan orang-orang yang terluka dan terdengar alami dalam larik puitis ini.
- source_word: חֲלָלֶיךָ
  choice: orang-orang yang Kaulukai
  rationale: Bentuk ini dapat menunjuk kepada orang-orang yang dilukai atau ditikam, dan dalam konteks lain kepada orang-orang yang terbunuh. Terjemahan utama mempertahankan kesejajaran dengan tindakan Allah memukul serta kesesuaian dengan “penderitaan,” sementara kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: יְסַפֵּרוּ
  choice: menceritakan
  rationale: Dalam bentuk Piel, ספר lazim berarti menuturkan, menceritakan, atau memerinci. “Menceritakan” mempertahankan tindakan verbal dalam teks tanpa menambahkan secara eksplisit motif mengejek yang hanya tersirat oleh konteks.
theological_decisions:
- issue: Apakah חֲלָלֶיךָ berarti orang-orang yang dilukai Allah atau orang-orang yang dibunuh-Nya
  choice: orang-orang yang Kaulukai
  alternative: orang-orang yang Kaubunuh; orang-orang yang Kautikam
  rationale: Makna “dilukai” paling sesuai dengan penyebutan penderitaan yang masih dialami dan dengan gambaran musuh yang memperberat kesusahan orang yang telah dipukul Allah. Namun, karena kata Ibraninya juga dapat berarti orang-orang yang terbunuh atau tertikam, ambiguitas itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Bentuk terikat “Kaupukul” dan “Kaulukai” dipakai untuk sapaan kepada Allah. Susunan dua larik mempertahankan paralelisme mazmur, sedangkan pilihan kata menghindari penambahan motif ejekan yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
