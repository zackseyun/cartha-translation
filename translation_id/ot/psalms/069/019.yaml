  text: אַתָּ֤ה יָדַ֗עְתָּ חֶרְפָּתִ֣/י וּ֭/בָשְׁתִּ/י וּ/כְלִמָּתִ֑/י נֶ֝גְדְּ/ךָ֗ כָּל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/019.yaml
  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
translation:
  language: id
  text: Engkau tahu celaan yang kutanggung, rasa maluku, dan kehinaanku; semua lawanku[a] ada di hadapan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “musuh-musuhku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Engkau tahu
  rationale: Bentuk Qal perfekt orang kedua tunggal maskulin dari ידע ditujukan kepada Allah. Dalam doa langsung, bentuk kini statif “tahu” secara alami menyampaikan bahwa Allah sepenuhnya mengetahui keadaan pemazmur.
- source_word: חֶרְפָּתִי
  choice: celaan yang kutanggung
  rationale: חֶרְפָּה dapat menunjuk pada celaan, cemoohan, atau aib yang ditimpakan kepada seseorang. Ungkapan ini menonjolkan penghinaan sosial yang dialami pemazmur dan terdengar alami dalam bahasa Indonesia.
- source_word: בָשְׁתִּי
  choice: rasa maluku
  rationale: Nomina ini menyatakan malu atau keadaan ternoda kehormatannya. “Rasa maluku” mempertahankan unsur pengalaman pribadi dan membedakannya dari istilah sejajar berikutnya.
- source_word: כְלִמָּתִי
  choice: kehinaanku
  rationale: כְּלִמָּה berhubungan dengan kehinaan, penghinaan, atau aib, dan memperkuat rangkaian sinonim dalam baris ini. “Kehinaanku” menjaga intensitas tanpa mengulang kata “malu”.
- source_word: נֶגְדְּךָ
  choice: di hadapan-Mu
  rationale: נֶגֶד dengan sufiks menyatakan bahwa sesuatu berada di depan atau dalam pandangan seseorang. “Di hadapan-Mu” ringkas, wajar, dan menyiratkan bahwa semua lawan pemazmur terlihat jelas oleh Allah.
- source_word: כָּל
  choice: semua
  rationale: Kuantifier ini bersifat menyeluruh dan paling alami diterjemahkan “semua” di depan nomina kolektif jamak.
- source_word: צוֹרְרָי
  choice: lawanku
  rationale: Bentuk dari צרר menunjuk kepada orang-orang yang memusuhi atau menindas pemazmur. “Lawanku” mempertahankan nuansa pihak yang aktif menentang, sedangkan “musuh-musuhku” dicatat sebagai alternatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Tiga istilah yang saling berdekatan dipertahankan sebagai “celaan yang kutanggung,” “rasa maluku,” dan “kehinaanku” agar penumpukan retoris teks Ibrani tidak diratakan. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
