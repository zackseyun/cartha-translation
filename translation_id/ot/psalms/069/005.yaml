source:
  edition: WLC
  text: אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְ/אִוַּלְתִּ֑/י וְ֝/אַשְׁמוֹתַ֗/י מִמְּ/ךָ֥ לֹא נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: id
  text: Ya Allah, Engkau mengetahui kebodohanku[a], dan kesalahan-kesalahanku tidak tersembunyi dari-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kebebalanku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Nomina ini berfungsi sebagai sapaan langsung dalam doa. Partikel “Ya” membuat fungsi vokatifnya jelas dan alami dalam bahasa Indonesia.
- source_word: אַתָּה יָדַעְתָּ
  choice: Engkau mengetahui
  rationale: Pronomina eksplisit memberi penekanan pada Allah sebagai pihak yang mengetahui. Bentuk perfektif dari ידע di sini menyatakan pengetahuan yang tetap dan utuh, sehingga bentuk kini “mengetahui” sesuai dengan konteks.
- source_word: לְאִוַּלְתִּי
  choice: kebodohanku
  rationale: אִוֶּלֶת menunjuk pada kebodohan atau kebebalan yang mengandung dimensi moral, bukan sekadar kurangnya kecerdasan. “Kebodohanku” jelas dan wajar bagi pembaca modern.
- source_word: וְאַשְׁמוֹתַי
  choice: dan kesalahan-kesalahanku
  rationale: Bentuk Ibrani adalah jamak dan dalam paralelisme ini menunjuk pada berbagai perbuatan salah atau pelanggaran si pemazmur, bukan pada kurban penebus salah. Bentuk jamak konkret dipertahankan secara alami dalam bahasa Indonesia.
- source_word: מִמְּךָ לֹא נִכְחָדוּ
  choice: tidak tersembunyi dari-Mu
  rationale: Ungkapan ini secara langsung menyatakan bahwa kesalahan-kesalahan tersebut tidak tersembunyi dari pengetahuan Allah. Susunan ini setia pada idiom Ibrani sekaligus alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pengakuan dosa oleh penutur dalam mazmur yang kemudian diterapkan secara mesianik dalam Perjanjian Baru
  choice: Mempertahankan pengakuan orang pertama tentang kebodohan dan kesalahan si pemazmur.
  alternative: Menafsirkan pengakuan itu hanya sebagai pengakuan korporat atau perwakilan dan mengubah redaksinya agar tidak terdengar pribadi.
  rationale: Teks Ibrani dengan jelas menggunakan bentuk orang pertama. Terjemahan tidak boleh menghapus pengakuan tersebut atau menyelesaikan ketegangan teologis melalui harmonisasi yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” serta akhiran “-Mu” dipakai untuk sapaan langsung kepada Allah. Bentuk jamak “kesalahan-kesalahanku” mempertahankan jumlah gramatikal sumber tanpa terdengar kaku.
