  text: מ֭וּזָר הָיִ֣יתִי לְ/אֶחָ֑/י וְ֝/נָכְרִ֗י לִ/בְנֵ֥י אִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: id
  text: Aku telah menjadi[a] orang asing bagi saudara-saudara laki-lakiku, orang luar bagi anak-anak laki-laki ibuku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku adalah orang asing” atau “Aku menjadi orang asing.” Kata kerja Ibrani dapat diterjemahkan sebagai keadaan pada masa lampau atau sebagai masuknya seseorang ke dalam keadaan itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak laki-laki ibuku”; suatu ungkapan puitis untuk saudara-saudara laki-laki.
    reason: cultural_note
lexical_decisions:
- source_word: מוּזָר
  choice: orang asing
  rationale: Kata ini menyatakan keadaan terasing atau diperlakukan sebagai orang yang tidak dikenal; “orang asing” mempertahankan gambaran relasional yang konkret.
- source_word: הָיִיתִי
  choice: aku telah menjadi
  rationale: Bentuk qatal dari היה di sini dapat menunjuk pada keadaan yang telah terjadi dan masih dirasakan dalam ratapan; pilihan ini juga mempertahankan kemungkinan nuansa ingresif.
- source_word: לְאֶחָי
  choice: bagi saudara-saudaraku
  rationale: Secara harfiah berarti “bagi saudara-saudara lelakiku”; dalam bahasa Indonesia, “saudara-saudaraku” wajar dan tidak menambahkan cakupan yang tidak dituntut teks.
- source_word: וְנָכְרִי
  choice: orang luar
  rationale: נָכְרִי berarti orang asing atau orang luar. “Orang luar” secara alami menyampaikan pengucilan dari lingkungan keluarga dan membedakannya dari istilah paralel sebelumnya.
- source_word: לִבְנֵי אִמִּי
  choice: bagi anak-anak lelaki ibuku
  rationale: Terjemahan ini mempertahankan ungkapan harfiah Ibrani dan paralelisme puitis, sekaligus menjelaskan bahwa bentuk sumbernya maskulin.
theological_decisions:
- issue: Bahasa kekerabatan bergender
  choice: Mempertahankan rujukan maskulin dalam frasa “anak-anak lelaki ibuku”
  alternative: saudara-saudaraku; keluargaku
  rationale: Teks Ibrani secara eksplisit memakai בְּנֵי, “anak-anak lelaki,” sehingga unsur gender dipertahankan tanpa memperluasnya menjadi seluruh keluarga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan “bagi” mengikuti hubungan gramatikal kedua baris Ibrani; “orang asing” dan “orang luar” menjaga paralelisme tanpa terdengar terlalu teknis.
