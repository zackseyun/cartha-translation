  text: רַבּ֤וּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י֮ שֹׂנְאַ֪/י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַ/י אֹיְבַ֣/י שֶׁ֑קֶר אֲשֶׁ֥ר לֹא גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: id
  text: Orang-orang yang membenci aku tanpa alasan lebih banyak daripada rambut di kepalaku; orang-orang yang hendak membinasakan aku, musuh-musuhku yang berdusta,[a] sangat kuat. Apa yang tidak kurampas, harus kukembalikan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat berarti “musuh-musuhku yang palsu” atau “orang-orang yang memusuhi aku secara tidak benar.” Kata tersebut dapat menggambarkan mereka sebagai pendusta atau menunjukkan bahwa mereka memusuhi pemazmur tanpa dasar.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “maka aku mengembalikan.” Maksudnya mungkin bahwa pemazmur dipaksa mengganti sesuatu yang tidak dirampasnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: lebih banyak daripada rambut di kepalaku
  rationale: Kata kerja רַבּוּ menyatakan jumlah yang banyak, sedangkan מִן menandai perbandingan. Ungkapan ini mempertahankan gambaran hiperbolis dalam bahasa Indonesia yang alami.
- source_word: שֹׂנְאַי חִנָּם
  choice: orang-orang yang membenci aku tanpa alasan
  rationale: חִנָּם di sini berarti tanpa sebab atau dasar yang dapat dibenarkan, bukan sekadar tanpa bayaran.
- source_word: עָצְמוּ
  choice: sangat kuat
  rationale: Kata kerja ini menyatakan menjadi kuat atau berkuasa. Tambahan 'sangat' menyampaikan kuatnya ancaman dengan bahasa Indonesia yang wajar.
- source_word: מַצְמִיתַי
  choice: orang-orang yang hendak membinasakan aku
  rationale: Bentuk partisipial ini menunjuk kepada pihak-pihak yang bermaksud menghancurkan atau melenyapkan pemazmur.
- source_word: אֹיְבַי שֶׁקֶר
  choice: musuh-musuhku yang berdusta
  rationale: שֶׁקֶר dapat menggambarkan musuh sebagai pendusta atau menerangkan bahwa permusuhan mereka tidak berdasar. Teks utama memakai ungkapan yang alami, sementara catatan kaki mempertahankan kemungkinan lainnya.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: apa yang tidak kurampas
  rationale: גזל secara khusus menunjuk pada mengambil milik dengan paksa atau merampas; 'kurampas' lebih tepat daripada kata umum 'kucuri'.
- source_word: אָז אָשִׁיב
  choice: harus kukembalikan juga
  rationale: Secara harfiah frasa ini berarti 'maka aku mengembalikan/akan mengembalikan.' Dalam konteks tuduhan palsu, bahasa Indonesia ini menyampaikan restitusi yang dibebankan kepada orang yang tidak bersalah; catatan kaki mencantumkan bentuk harfiahnya.
theological_decisions:
- issue: Apakah klausa terakhir menyatakan pengembalian paksa meskipun pemazmur tidak bersalah
  choice: Apa yang tidak kurampas, harus kukembalikan juga.
  alternative: Apa yang tidak kurampas, maka kukembalikan.
  rationale: Konteksnya menggambarkan penderitaan dan tuduhan yang tidak adil. Terjemahan utama menyampaikan absurditas kewajiban mengganti sesuatu yang tidak pernah dirampas, sedangkan catatan kaki mempertahankan bentuk Ibrani yang lebih terbuka.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pronomina terikat seperti 'kurampas' dan 'kukembalikan' menjaga kelancaran larik, sementara istilah 'merampas' mempertahankan kekuatan makna sumber.
