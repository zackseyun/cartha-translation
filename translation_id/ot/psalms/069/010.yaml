  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Susunan ‘dengan berpuasa dalam jiwaku’ sengaja mempertahankan kepadatan dan ambiguitas ungkapan Ibrani, sedangkan catatan kaki memberikan kemungkinan pemahaman idiomatisnya.
