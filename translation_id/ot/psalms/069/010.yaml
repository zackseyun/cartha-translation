  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
translation:
  language: id
  text: Ketika aku menangis sambil berpuasa—dalam jiwaku[a]—hal itu menjadi celaan bagiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi kurang lebih, “aku menangis dengan puasa, jiwaku.” Hubungan “jiwaku” dengan kata-kata sebelumnya tidak sepenuhnya jelas. Ungkapan ini dapat dipahami sebagai “aku menangis sambil berpuasa” atau, secara idiomatis, “aku merendahkan diriku dengan berpuasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: Ketika aku menangis
  rationale: 'Kata kerja בכה berarti ‘menangis’. Waw pada bentuk wayyiqtol dapat menyatakan urutan (‘dan’), tetapi dalam hubungan dengan klausa berikutnya wajar dipahami secara temporal: ‘ketika ... hal itu menjadi ...’.'
- source_word: בַצּוֹם
  choice: dengan berpuasa
  rationale: צוֹם berarti ‘puasa/berpuasa’. Preposisi ב di sini dapat menyatakan keadaan yang menyertai atau sarana; ‘dengan berpuasa’ alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan tangisan.
- source_word: נַפְשִׁי
  choice: dalam jiwaku
  rationale: נֶפֶשׁ dapat berarti ‘jiwa’, ‘diri’, ‘nyawa’, atau dalam konteks tertentu ‘selera makan’. Ungkapan Ibrani di sini padat dan tidak sepenuhnya jelas. ‘Dalam jiwaku’ mempertahankan unsur eksplisit ‘jiwaku’ tanpa memasukkan gagasan ‘merendahkan diri’ ke dalam teks utama.
- source_word: וַתְּהִי
  choice: hal itu menjadi
  rationale: היה di sini menyatakan keadaan yang timbul sebagai akibat tindakan sebelumnya. Subjek tersiratnya paling wajar adalah seluruh tindakan menangis dan berpuasa.
- source_word: לַחֲרָפוֹת
  choice: celaan
  rationale: חֲרָפוֹת secara bentuk adalah jamak, tetapi dalam konstruksi ini dapat menyatakan cela atau penghinaan secara kolektif. ‘Celaan’ merupakan ungkapan Indonesia yang ringkas dan alami.
- source_word: לִי
  choice: bagiku
  rationale: Preposisi ל menandai orang yang terkena dampak; ‘menjadi celaan bagiku’ menyampaikan konstruksi tersebut secara langsung.
