  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: id
  text: Jawablah aku, ya Yahweh, sebab kasih setia-Mu baik; sesuai dengan kelimpahan belas kasihan-Mu, berpalinglah kepadaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Menurut kelimpahan kasih sayang-Mu, berpalinglah kepadaku.”'
    reason: 'Menunjukkan alternatif padanan untuk כְּרֹב רַחֲמֶיךָ: "menurut kelimpahan" dan "kasih sayang" dapat menerjemahkan ungkapan tentang belas kasihan yang berlimpah.'
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Jawablah aku
  rationale: Bentuk imperatif dari ענה dalam konteks doa meminta tanggapan Allah. “Jawablah aku” alami dalam bahasa Indonesia dan mempertahankan desakan pemazmur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi permohonan. “Sebab” mempertahankan hubungan kausal dan cocok dengan ragam doa yang khidmat.
- source_word: טוֹב
  choice: baik
  rationale: Kata sifat predikatif ini menerangkan kasih setia Yahweh. “Baik” mempertahankan arti dasar dan penilaian moral-teologis teks.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: חסד mencakup kasih, kesetiaan, dan komitmen yang teguh. “Kasih setia” merupakan padanan Indonesia yang ringkas, lazim, dan tidak mempersempitnya hanya menjadi kasih perjanjian.
- source_word: כְּרֹב
  choice: sesuai dengan limpahnya
  rationale: Gabungan כ dengan רֹב menyatakan ukuran atau patokan, yakni “sesuai dengan kelimpahan”. Susunan ini menjaga fungsi preposisional Ibraninya sekaligus terdengar wajar.
- source_word: רַחֲמֶיךָ
  choice: belas kasihan-Mu
  rationale: Bentuk jamak רחמים dapat menunjuk pada belas kasihan yang mendalam atau berbagai tindakan kemurahan. Dalam bahasa Indonesia, bentuk kolektif tunggal “belas kasihan” lebih alami tanpa menghilangkan gagasan kelimpahannya.
- source_word: פְּנֵה אֵלַי
  choice: berpalinglah kepadaku
  rationale: Imperatif פנה dengan אֶל menyatakan gerakan mengarahkan diri kepada seseorang. “Berpalinglah kepadaku” mempertahankan gambaran relasional tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan makna חֶסֶד
  choice: kasih setia
  alternative: kasih perjanjian
  rationale: “Kasih setia” mempertahankan unsur kasih dan loyalitas tanpa menetapkan secara eksplisit bahwa istilah tersebut hanya merujuk pada satu kerangka perjanjian tertentu.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Bentuk “-Mu” dipertahankan untuk sapaan kepada Allah; susunan paralel dan hubungan sebab-akibat dalam puisi Ibrani dijaga tanpa membuat kalimat terasa kaku.
