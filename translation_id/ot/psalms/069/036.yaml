  text: וְ/זֶ֣רַע עֲ֭בָדָי/ו יִנְחָל֑וּ/הָ וְ/אֹהֲבֵ֥י שְׁ֝מ֗/וֹ יִשְׁכְּנוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/036.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: id
  text: Keturunan hamba-hamba-Nya akan mewarisinya[a], dan orang-orang yang mengasihi nama-Nya akan tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ganti pada “mewarisinya” dan ungkapan “di sana” merujuk pada Sion atau kota yang dipulihkan dalam konteks sebelumnya; sebagian orang memahaminya secara lebih luas sebagai negeri itu atau Yerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: keturunan
  rationale: Kata ini secara harfiah dapat berarti ‘benih’, tetapi di sini dipakai secara kolektif untuk anak cucu atau generasi penerus. ‘Keturunan’ alami dalam bahasa Indonesia dan mempertahankan pengertian kolektifnya.
- source_word: עֲבָדָיו
  choice: hamba-hamba-Nya
  rationale: Dalam konteks mazmur yang bersifat ibadah dan perjanjian, ‘hamba-hamba’ menyampaikan hubungan pengabdian kepada Allah tanpa menonjolkan lembaga perbudakan.
- source_word: יִנְחָלוּהָ
  choice: akan mewarisinya
  rationale: Bentuk kata kerja ini mengandung gagasan menerima atau memiliki sebagai warisan. Akhiran feminin tunggal merujuk pada Sion atau kota yang dipulihkan dalam konteks sebelumnya.
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: orang-orang yang mengasihi nama-Nya
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani tentang mengasihi nama Allah, bukan menyederhanakannya menjadi hanya ‘mengasihi Dia’.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: akan tinggal di sana
  rationale: Kata שׁכן berarti tinggal, menetap, atau berdiam. ‘Tinggal’ jelas dan wajar dalam bahasa Indonesia; ‘di sana’ secara alami menunjuk kembali kepada Sion atau kota tersebut.
theological_decisions:
- issue: Rujukan akhiran feminin pada ‘mewarisinya’ dan ‘tinggal di sana’
  choice: Akhiran tersebut dipahami merujuk pada Sion atau kota yang dipulihkan dalam konteks langsung.
  alternative: Akhiran itu dapat dipahami lebih luas sebagai negeri itu atau Yerusalem.
  rationale: Konteks sebelumnya berbicara tentang Allah menyelamatkan Sion dan membangun kembali kota-kota Yehuda. Terjemahan tidak menambahkan nama tempat ke dalam ayat, sehingga keluasan rujukan bahasa Ibrani tetap terpelihara; catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Keturunan’ mudah dipahami, sedangkan ‘mewarisi’ mempertahankan nuansa perjanjian dan warisan. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
