  yaml_path: translation/ot/psalms/069/034.yaml
  text: Let heaven and earth praise him[c][b][a], the seas and everything that moves in them.
translation:
  language: id
  text: Biarlah langit, bumi, laut-laut, dan segala yang bergerak di dalamnya memuji Dia[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan, “Kiranya langit, bumi, laut-laut, dan segala yang bergerak di dalamnya memuji Dia.” Bentuk kata kerja Ibrani ini juga dapat dipahami secara prediktif: “Langit, bumi, laut-laut, dan segala yang bergerak di dalamnya akan memuji Dia.”'
    reason: alternative_reading
  - marker: b
    text: Atau “merayap”; kata Ibrani ini dapat menunjuk makhluk yang bergerak, merayap, atau berkerumun.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּהוּ
  choice: Biarlah ... memuji Dia
  rationale: Bentuk piel imperfek orang ketiga jamak dengan objek orang ketiga tunggal paling wajar dipahami secara jusif sebagai ajakan atau seruan untuk memuji, sambil tetap mempertahankan objek eksplisit “Dia”.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, dalam bahasa Indonesia “langit” lazim berfungsi secara kolektif dan membentuk pasangan puitis alami dengan “bumi”.
- source_word: וָאָרֶץ
  choice: dan bumi
  rationale: Dalam pasangan kosmis “langit dan bumi”, “bumi” menunjuk seluruh dunia ciptaan, bukan suatu negeri atau wilayah tertentu.
- source_word: יַמִּים
  choice: laut-laut
  rationale: Bentuk jamak Ibrani dipertahankan untuk menggambarkan seluruh perairan laut sebagai bagian dari tatanan ciptaan.
- source_word: וְכָל רֹמֵשׂ
  choice: dan segala yang bergerak
  rationale: Ungkapan ini mencakup semua makhluk yang bergerak, merayap, atau berkerumun; “segala yang bergerak” alami dalam bahasa Indonesia dan tidak mempersempitnya pada hewan melata saja.
- source_word: בָּם
  choice: di dalamnya
  rationale: Akhiran pronominal jamak paling dekat merujuk kepada laut-laut; bentuk “di dalamnya” mempertahankan hubungan pronominal tersebut secara alami.
theological_decisions:
- issue: Daya ujar bentuk imperfek dalam seruan pujian kosmis
  choice: 'Seruan kepada ciptaan: “Biarlah ... memuji Dia”'
  alternative: 'Pernyataan prediktif: “Langit dan bumi akan memuji Dia”'
  rationale: Konteks puisi pujian mendukung nuansa jusif atau ajakan, tetapi kemungkinan pembacaan prediktif tetap dicatat agar ketegangan gramatikal tidak dihapus.
- issue: Cakupan ciptaan yang diajak memuji
  choice: Langit, bumi, laut-laut, dan segala makhluk yang bergerak di dalam laut
  alternative: Hanya unsur-unsur alam tak bernyawa
  rationale: Partisip רֹמֵשׂ memperluas seruan dari ranah kosmis kepada makhluk-makhluk yang hidup dan bergerak di laut, tanpa menambahkan klaim doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Biarlah” menyampaikan seruan jusif secara alami; pasangan “langit dan bumi” mempertahankan merisme kosmis, sedangkan “laut-laut” mempertahankan bentuk jamak sumber. Pronomina ilahi ditulis “Dia” sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
