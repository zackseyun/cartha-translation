  text: שַׂ֭מְּחֵ/נוּ כִּ/ימ֣וֹת עִנִּיתָ֑/נוּ שְׁ֝נ֗וֹת רָאִ֥ינוּ רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
translation:
  language: id
  text: Buatlah kami bersukacita sebanding dengan jumlah hari Engkau telah membuat kami menderita, sebanding dengan jumlah tahun kami telah mengalami kesusahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kami telah melihat yang buruk.” Kata Ibrani yang diterjemahkan “kesusahan” juga dapat berarti kemalangan, malapetaka, atau kejahatan, bergantung pada konteksnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: Buatlah kami bersukacita
  rationale: 'Bentuk imperatif Piel dengan akhiran orang pertama jamak menyampaikan permohonan kausatif: pemazmur meminta Allah membuat umat-Nya bersukacita.'
- source_word: כִּימוֹת
  choice: sebanyak hari
  rationale: כ dengan ימות menyatakan kesepadanan atau ukuran yang sebanding. Ungkapan ini mempertahankan permohonan agar masa sukacita sepadan dengan masa penderitaan.
- source_word: עִנִּיתָנוּ
  choice: Engkau menindas kami
  rationale: Piel ענה dapat berarti menindas, menyengsarakan, atau merendahkan. Dalam ratapan ini, 'menindas' mempertahankan kuatnya tindakan yang dikenakan kepada umat tanpa membatasinya pada kerendahan batin.
- source_word: שְׁנוֹת
  choice: sebanyak tahun
  rationale: Bentuk jamak konstruksi ini sejajar dengan 'hari'; pengulangan 'sebanyak' mempertahankan kesejajaran dan gagasan ukuran yang sepadan.
- source_word: רָאִינוּ
  choice: kami mengalami
  rationale: Secara harfiah berarti 'kami melihat', tetapi dalam konteks ini melihat kesusahan berarti mengalaminya. 'Mengalami' menyampaikan idiom tersebut secara alami dalam bahasa Indonesia.
- source_word: רָעָה
  choice: kesusahan
  rationale: רעה dapat menunjuk pada kejahatan moral maupun kemalangan, bencana, atau kesengsaraan. Dalam kesejajaran dengan penindasan, 'kesusahan' menunjukkan penderitaan yang dialami dan tidak menyiratkan bahwa umat melakukan kejahatan.
theological_decisions:
- issue: Makna רָעָה dalam hubungannya dengan tindakan Allah
  choice: Dipahami sebagai kesusahan atau kemalangan yang dialami umat
  alternative: kejahatan; malapetaka; penderitaan
  rationale: Konteksnya adalah permohonan agar sukacita mengimbangi penderitaan terdahulu. Karena itu, רָעָה menunjuk pada pengalaman buruk atau kemalangan, bukan pada kejahatan moral; pilihan ini tidak menghilangkan ketegangan ratapan yang mengaitkan penderitaan itu dengan tindakan Allah.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan 'sebanyak' mempertahankan paralelisme serta ukuran yang sepadan dalam bahasa Ibrani. Huruf kapital pada 'Engkau' mengikuti konvensi penghormatan kepada Allah.
