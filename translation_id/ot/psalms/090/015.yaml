  - severity: medium
    issue: “Menindas” mempersempit arti ענה.
    rationale: Kata ini dapat berarti menganiaya atau menundukkan, tetapi dalam konteks ini arti luas ‘membuat menderita’ lebih netral dan tidak menambahkan gambaran penindasan sosial-politik.
  - severity: low
