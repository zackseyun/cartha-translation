source:
  edition: WLC
  text: וִ/יהִ֤י נֹ֤עַם אֲדֹנָ֥/י אֱלֹהֵ֗י/נוּ עָ֫לֵ֥י/נוּ וּ/מַעֲשֵׂ֣ה יָ֭דֵי/נוּ כּוֹנְנָ֥/ה עָלֵ֑י/נוּ וּֽ/מַעֲשֵׂ֥ה יָ֝דֵ֗י/נוּ כּוֹנְנֵֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: id
  text: Kiranya kemurahan Tuhan, Allah kami, menyertai kami[a]; teguhkanlah bagi kami pekerjaan tangan kami[b]. Ya, teguhkanlah pekerjaan tangan kami[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “kemurahan” juga dapat berarti “keindahan”, “kesenangan”, atau “perkenanan”; secara harfiah, kemurahan itu kiranya ada “atas kami”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “teguhkanlah pekerjaan tangan kami atas kami”. Hubungan yang dinyatakan oleh “atas kami” dapat dipahami sebagai “bagi kami”.
    reason: textual_ambiguity
  - marker: c
    text: 'Bahasa Ibrani mengulangi permohonan ini untuk penegasan: “dan pekerjaan tangan kami, teguhkanlah itu.”'
    reason: discourse_emphasis
lexical_decisions:
- source_word: וִיהִי
  choice: Kiranya ... menyertai
  rationale: Bentuk yiqtol berdaya jusif menyatakan doa atau harapan. “Kiranya” menyampaikan daya permohonan itu secara wajar; “menyertai” mengungkapkan נֹעַם yang berada עָלֵינוּ tanpa ungkapan Indonesia yang kaku seperti “ada di atas kami”.
- source_word: נֹעַם
  choice: kemurahan
  rationale: Kata ini dapat berarti keindahan, kesenangan, atau perkenanan. Dalam doa agar Allah meneguhkan jerih payah umat, “kemurahan” menyampaikan perkenanan-Nya dengan bahasa Indonesia yang alami, sementara kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: Tuhan, Allah kami
  rationale: “Tuhan” mempertahankan gelar אֲדֹנָי, sedangkan “Allah kami” menerjemahkan bentuk bersufiks orang pertama jamak dan cocok dalam doa yang ditujukan kepada Allah.
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: pekerjaan tangan kami
  rationale: Terjemahan ini mempertahankan gambaran konkret ungkapan Ibrani bagi pekerjaan atau jerih payah manusia dan tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: Teguhkanlah ... teguhkanlah itu
  rationale: Akar כון di sini berarti membuat kokoh, mantap, atau bertahan. “Teguhkanlah” mempertahankan bentuk permohonan dan tidak mempersempit artinya menjadi sekadar “berkatilah” atau “buatlah berhasil”.
- source_word: עָלֵינוּ (kedua)
  choice: bagi kami
  rationale: Sesudah “pekerjaan tangan kami”, preposisi ini sulit disalin secara harfiah ke dalam bahasa Indonesia. “Bagi kami” menyampaikan hubungan manfaat atau kepentingan tanpa menghapus kesulitan teks, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna נֹעַם sebagai sesuatu yang berasal dari Tuhan
  choice: kemurahan Tuhan
  alternative: keindahan / kesenangan / perkenanan Tuhan
  rationale: Konteks doa mendukung nuansa perkenanan ilahi, tetapi medan makna yang mencakup keindahan dan kesenangan tidak ditutup dan disajikan dalam catatan kaki.
- issue: Hubungan tindakan Allah dengan pekerjaan manusia
  choice: Teguhkanlah ... pekerjaan tangan kami
  alternative: Buatlah berhasil pekerjaan tangan kami
  rationale: “Teguhkanlah” mempertahankan permohonan agar karya manusia dibuat kokoh atau bertahan, tanpa menafsirkan berkat Allah semata-mata sebagai keberhasilan material.
- issue: Gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Penguasa
  rationale: “Tuhan” adalah padanan Indonesia yang wajar dan khidmat bagi gelar ketuhanan ini serta tidak memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Paralelisme serta pengulangan Ibrani dipertahankan, sedangkan ungkapan preposisional yang kaku dijernihkan dalam teks utama dan transparan dicatat dalam catatan kaki.
