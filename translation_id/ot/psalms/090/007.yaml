id: PSA.90.7
reference: Psalms 90:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי כָלִ֥ינוּ בְ/אַפֶּ֑/ךָ וּֽ/בַ/חֲמָתְ/ךָ֥ נִבְהָֽלְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/007.yaml
  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
translation:
  language: id
  text: Sebab kami lenyap oleh murka-Mu[a], dan oleh amarah-Mu kami ketakutan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kami sampai pada kesudahan karena murka-Mu” atau “kami habis oleh murka-Mu.” Kata kerja Ibrani dapat berarti habis, selesai, atau sampai pada akhir.
    reason: lexical_alternative
  - marker: b
    text: Atau “kami dibuat gentar,” “kami terperanjat,” atau “kami diliputi kecemasan.” Kata kerja Ibrani menyatakan keguncangan, keterkejutan, atau ketakutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan alur penjelasan mazmur.
- source_word: כָלִינוּ
  choice: kami lenyap
  rationale: Bentuk dari כלה menyatakan keadaan telah habis, selesai, atau sampai pada akhir. “Kami lenyap” menyampaikan akibat yang berat tanpa mengubahnya menjadi verba kausatif eksplisit.
- source_word: בְאַפֶּךָ
  choice: oleh murka-Mu
  rationale: 'Preposisi ב dipahami secara instrumental atau kausal: murka Allah merupakan sebab mereka lenyap. “Murka” merupakan padanan alami dan berbobot bagi אַף dalam konteks ini.'
- source_word: חֲמָתְךָ
  choice: amarah-Mu
  rationale: חֵמָה menunjuk pada amarah yang menyala atau dahsyat. “Amarah” mempertahankan istilah yang berbeda dari “murka” dalam baris pertama.
- source_word: נִבְהָלְנוּ
  choice: kami ketakutan
  rationale: Bentuk dari בהל menyatakan keguncangan, keterkejutan, atau ketakutan. Dalam paralel dengan amarah ilahi, “kami ketakutan” menyampaikan intensitasnya dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan dua istilah sejajar untuk kemarahan ilahi
  choice: Mempertahankan pembedaan sebagai “murka” dan “amarah”
  alternative: Menerjemahkan keduanya dengan satu istilah yang sama, atau memakai “murka” dan “kegeraman”
  rationale: Teks Ibrani memakai dua kata yang berkaitan tetapi berbeda, אַף dan חֵמָה. Mempertahankan dua padanan menjaga peningkatan puitis tanpa menambahkan nuansa doktrinal.
- issue: Daya kausal murka ilahi dalam בְאַפֶּךָ dan וּבַחֲמָתְךָ
  choice: Menerjemahkan ב sebagai “oleh”
  alternative: “karena” atau “dalam”
  rationale: “Oleh” menjaga kemungkinan instrumental sekaligus kausal dalam kedua frasa dan tidak mempersempit hubungan tersebut secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Paralelisme Ibrani dipertahankan, termasuk dua istilah berbeda bagi kemarahan ilahi. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
