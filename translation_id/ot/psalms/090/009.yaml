  text: כִּ֣י כָל יָ֭מֵי/נוּ פָּנ֣וּ בְ/עֶבְרָתֶ֑/ךָ כִּלִּ֖ינוּ שָׁנֵ֣י/נוּ כְמוֹ הֶֽגֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/009.yaml
  text: For all our days pass away in your wrath[a]; we finish our years like a sigh.
translation:
  language: id
  text: 'Sebab semua hari kami berlalu dalam murka-Mu;

    kami menghabiskan tahun-tahun kami seperti desahan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gumaman” atau “rintihan.” Kata Ibrani ini menunjuk pada bunyi lirih; “desahan” dipakai dalam teks utama untuk menonjolkan betapa cepat dan rapuhnya hidup dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menjaga fungsi penghubung yang memberi alasan atau penjelasan bagi perenungan pada ayat sebelumnya.
- source_word: כָל יָמֵינוּ
  choice: segala hari kami
  rationale: Mempertahankan bentuk jamak dan kekonkretan puitis teks Ibrani tanpa mengubahnya menjadi ungkapan tunggal yang lebih tafsiriah seperti ‘seumur hidup kami’.
- source_word: פָּנוּ
  choice: berlalu
  rationale: Dalam konteks waktu, verba ini menyatakan bahwa hari-hari beralih atau lewat; ‘berlalu’ alami dalam bahasa Indonesia dan tidak melebih-lebihkan maknanya.
- source_word: בְעֶבְרָתֶךָ
  choice: dalam murka-Mu
  rationale: ‘Murka’ mempertahankan intensitas עֶבְרָה, sedangkan ‘dalam’ mencerminkan keadaan atau lingkup tempat hari-hari itu berlalu.
- source_word: כִּלִּינוּ
  choice: kami menghabiskan
  rationale: Bentuk Piel dari כלה di sini menyampaikan tindakan menuntaskan atau membawa tahun-tahun menuju akhirnya. ‘Menghabiskan’ alami dan tetap memuat nuansa kefanaan.
- source_word: שָׁנֵינוּ
  choice: tahun-tahun kami
  rationale: Mempertahankan bentuk jamak serta kesejajaran puitis dengan ‘hari kami’.
- source_word: כְמוֹ
  choice: seperti
  rationale: Padanan perbandingan yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: הֶגֶה
  choice: desahan
  rationale: Kata ini dapat menunjuk bunyi lirih seperti gumaman, rintihan, atau desahan. Dalam konteks kefanaan dan singkatnya hidup, ‘desahan’ menyampaikan bunyi yang singkat dan seperti embusan napas, sementara kemungkinan lain dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Istilah bagi kemarahan ilahi
  choice: murka-Mu
  alternative: amarah-Mu; kemurkaan-Mu
  rationale: Ayat ini secara tegas menghubungkan berlalunya hidup manusia dengan עֶבְרָה Allah. ‘Murka-Mu’ mempertahankan bobot teologis dan intensitas ungkapan itu tanpa melunakkannya atau menjelaskan ketegangan tersebut secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan dua baris yang mempertahankan paralelisme Ibrani. Huruf kapital pada akhiran ‘-Mu’ mengikuti kebiasaan penulisan Indonesia untuk sapaan kepada Allah. Penanda catatan kaki ditempatkan sesudah ‘desahan’, yakni kata yang dijelaskannya.
