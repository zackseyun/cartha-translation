  text: לִ/מְנ֣וֹת יָ֭מֵי/נוּ כֵּ֣ן הוֹדַ֑ע וְ֝/נָבִ֗א לְבַ֣ב חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/012.yaml
  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: id
  text: Ajarlah kami menghitung hari-hari kami[a], agar kami memperoleh hati yang bijaksana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Ajarlah kami demikian untuk menghitung hari-hari kami, maka kami akan membawa hati kebijaksanaan.” Bagian akhir kalimat Ibrani ini sulit dipahami; banyak penafsir memahaminya sebagai “agar kami memperoleh hati yang bijaksana”.
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: menghitung
  rationale: Kata kerja מנה berarti menghitung atau menentukan jumlah. “Menghitung” mempertahankan metafora konkret tentang menyadari terbatasnya hari-hari kehidupan.
- source_word: יָמֵינוּ
  choice: hari-hari kami
  rationale: Bentuk ini secara langsung berarti “hari-hari kami” dan dalam konteks mazmur menunjuk pada masa hidup manusia yang terbatas.
- source_word: כֵּן
  choice: tidak dinyatakan tersendiri dalam teks utama
  rationale: Kata ini secara harfiah berarti “demikian/begitu”. Dalam susunan Ibrani ini fungsinya tidak sepenuhnya jelas; maknanya tercakup secara alami dalam permohonan agar Allah mengajar manusia menghitung hari-harinya, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הוֹדַע
  choice: ajarlah kami
  rationale: Bentuk kausatif dari ידע secara harfiah berarti “buatlah mengetahui”. Dalam doa bahasa Indonesia, “ajarlah kami” menyampaikan permohonan agar Allah memberi pengertian secara alami dan tepat.
- source_word: וְנָבִא
  choice: agar kami memperoleh
  rationale: Klausa ini sulit secara sintaksis. Secara leksikal bentuk dari בוא dapat berarti “membawa”, tetapi dalam konteks ini banyak dipahami secara idiomatis sebagai mencapai atau memperoleh. Ambiguitasnya dipertahankan dalam catatan kaki.
- source_word: לְבַב חָכְמָה
  choice: hati yang bijaksana
  rationale: Secara harfiah ungkapan ini adalah “hati kebijaksanaan”. “Hati yang bijaksana” tetap mempertahankan gambaran hati sebagai pusat batin dan pemahaman, sekaligus terdengar wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna klausa tujuan/hasil pada bagian kedua ayat
  choice: Permohonan agar Allah mengajar umat menyadari keterbatasan hidup sehingga mereka memperoleh hati yang bijaksana.
  alternative: Permohonan agar Allah mengajar mereka menghitung hari-hari “demikian”, lalu “kami akan membawa hati kebijaksanaan”.
  rationale: Bacaan utama sesuai dengan konteks mazmur tentang kefanaan manusia dan menghasilkan bahasa Indonesia yang jelas. Namun, karena teks Ibrani padat dan bentuk “membawa” tetap mungkin secara leksikal, bacaan alternatif dicatat dan tidak disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. “Menghitung hari-hari kami” mempertahankan metafora Ibrani, sedangkan “hati yang bijaksana” menyampaikan ungkapan antropologisnya secara alami tanpa memasukkan penafsiran denominasi tertentu.
