  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: id
  text: Sebab seribu tahun di mata-Mu seperti hari kemarin yang telah berlalu,[a] dan seperti satu giliran jaga pada malam hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketika berlalu.” Ungkapan Ibrani ini dapat dipahami dengan nuansa waktu yang sedikit berbeda.'
    reason: lexical_alternative
  - marker: b
    text: “Giliran jaga” adalah salah satu bagian waktu malam yang ditetapkan bagi orang-orang yang berjaga.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” menyampaikan hubungan tersebut secara wajar.
- source_word: אֶלֶף שָׁנִים
  choice: seribu tahun
  rationale: Ungkapan bilangan ini diterjemahkan secara langsung untuk mempertahankan perbandingan puitis antara rentang waktu yang panjang dan singkat.
- source_word: בְּעֵינֶיךָ
  choice: di mata-Mu
  rationale: Ungkapan Ibrani ini menyatakan sudut pandang atau penilaian Allah. Terjemahan ini mempertahankan metafora sumber dan alami dalam bahasa Indonesia.
- source_word: כְּיוֹם אֶתְמוֹל
  choice: seperti hari kemarin
  rationale: Konstruksi ini membandingkan seribu tahun dengan hari yang baru saja lewat. “Hari kemarin” mempertahankan unsur יוֹם sekaligus terdengar alami.
- source_word: כִּי יַעֲבֹר
  choice: yang telah berlalu
  rationale: Klausa ini menerangkan “hari kemarin” sebagai hari yang sudah lewat. Bentuk ini alami dalam konteks, sementara nuansa temporal alternatif dicatat dalam catatan kaki.
- source_word: וְאַשְׁמוּרָה
  choice: dan seperti satu giliran jaga
  rationale: Waw diterjemahkan “dan”, sedangkan unsur perbandingan dipahami berlanjut dari klausa sebelumnya. אַשְׁמוּרָה menunjuk pada salah satu pembagian waktu malam untuk berjaga.
- source_word: בַלָּיְלָה
  choice: pada malam hari
  rationale: Frasa ini menentukan waktu berlangsungnya giliran jaga dan diterjemahkan dengan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Bahasa antropomorfis tentang perspektif Allah atas waktu
  choice: Mempertahankan “di mata-Mu” dan kedua perbandingan waktu tanpa penjelasan filosofis tambahan.
  alternative: Menguraikannya sebagai pernyataan bahwa Allah berada di luar waktu atau bahwa seribu tahun tidak berarti apa-apa bagi-Nya.
  rationale: Ayat ini secara puitis membandingkan seribu tahun dengan hari kemarin dan satu giliran jaga. Terjemahan tidak memasukkan rumusan teologis yang melampaui pernyataan teks.
- issue: Hubungan antara dua gambaran perbandingan
  choice: Menerjemahkan וְ dengan “dan” sambil mengulang “seperti” agar hubungan perbandingannya jelas.
  alternative: “atau seperti satu giliran jaga”
  rationale: Kata penghubung Ibrani secara mendasar bersifat aditif. Bahasa Indonesia memerlukan pengulangan “seperti” supaya gambaran kedua terbaca sebagai perbandingan sejajar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. “Di mata-Mu” mempertahankan metafora Ibrani yang sudah mudah dipahami, sedangkan “giliran jaga” lebih jelas bagi pembaca umum daripada istilah teknis yang lebih arkais.
