  text: יֵרָאֶ֣ה אֶל עֲבָדֶ֣י/ךָ פָעֳלֶ֑/ךָ וַ֝/הֲדָרְ/ךָ֗ עַל בְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: id
  text: Biarlah karya-Mu tampak bagi hamba-hamba-Mu, dan keagungan-Mu atas anak-anak mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵרָאֶה
  choice: Biarlah ... tampak
  rationale: Bentuk nifal menyatakan agar sesuatu terlihat atau menjadi nyata; ungkapan ini mempertahankan nuansa permohonan dalam konteks doa.
- source_word: פָעֳלֶךָ
  choice: karya-Mu
  rationale: Nomina tunggal ini menunjuk pada karya atau tindakan Allah; “karya” mempertahankan bentuk kolektifnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: וַהֲדָרְךָ
  choice: dan keagungan-Mu
  rationale: הָדָר mencakup kemegahan, semarak, dan keagungan; “keagungan” sesuai dengan register mazmur yang luhur tanpa mempersempit maknanya pada penampilan lahiriah.
- source_word: עַל־בְּנֵיהֶם
  choice: atas anak-anak mereka
  rationale: “Atas” mempertahankan relasi spasial/metaforis עַל dan gema bahwa keagungan Allah dinyatakan atau menaungi generasi berikutnya; “anak-anak” mengungkapkan bentuk Ibrani “putra-putra” secara inklusif dan alami.
theological_decisions:
- issue: Sifat permohonan agar karya Allah terlihat
  choice: Biarlah karya-Mu tampak
  alternative: Perlihatkanlah karya-Mu
  rationale: Pilihan utama mengikuti struktur nifal, dengan karya Allah sebagai subjek yang tampak, dan tidak mengubahnya menjadi perintah aktif langsung.
- issue: Relasi keagungan Allah dengan generasi berikutnya
  choice: keagungan-Mu atas anak-anak mereka
  alternative: keagungan-Mu bagi anak-anak mereka
  rationale: “Atas” menjaga ambiguitas metaforis preposisi עַל—keagungan itu dapat dinyatakan, hadir, atau menaungi mereka—tanpa menentukan satu tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Sapaan ilahi memakai huruf kapital pada akhiran pronominal. Paralelisme dua larik Ibrani dipertahankan.
