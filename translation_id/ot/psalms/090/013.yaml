  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: id
  text: Kembalilah, ya Yahweh—sampai kapan? Berbelas kasihlah kepada hamba-hamba-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lunakkanlah sikap-Mu terhadap hamba-hamba-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: Kembalilah
  rationale: Bentuk imperatif dari שוב yang ditujukan kepada Yahweh. “Kembalilah” mempertahankan daya relasional dan gambaran gerak yang langsung dalam bahasa ratapan, tanpa memasukkan nuansa “mengurungkan” yang lebih tepat dikaitkan dengan kata kerja berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar “TUHAN”.
- source_word: עַד מָתָי
  choice: sampai kapan?
  rationale: Ungkapan ratapan Ibrani ini diterjemahkan secara idiomatis dan tetap mempertahankan desakan pertanyaannya.
- source_word: וְהִנָּחֵם
  choice: Berbelaskasihanlah
  rationale: Imperatif Nifal dari נחם dapat menyatakan rasa iba maupun perubahan tindakan. “Berbelaskasihanlah” alami dalam bahasa Indonesia dan mempertahankan dimensi afektifnya, sedangkan nuansa mengurungkan tindakan dicatat sebagai alternatif.
- source_word: עַל
  choice: kepada
  rationale: Bersama נחם, preposisi ini menandai pihak yang menjadi sasaran belas kasihan; “kepada” merupakan padanan Indonesia yang wajar.
- source_word: עֲבָדֶיךָ
  choice: hamba-hamba-Mu
  rationale: Dalam doa kepada Allah, “hamba-hamba-Mu” adalah ungkapan yang alami, bermartabat, dan sesuai konteks bagi para pelayan yang berada di bawah otoritas-Nya.
theological_decisions:
- issue: Pemaknaan נחם ketika dikenakan kepada Allah
  choice: Berbelaskasihanlah
  alternative: Urungkanlah tindakan-Mu terhadap hamba-hamba-Mu
  rationale: Teks Ibrani dapat menggambarkan Allah sebagai tergerak oleh belas kasihan dan mengubah tindakan-Nya. Terjemahan utama tidak memakai “bertobatlah” atau “menyesallah,” yang dalam bahasa Indonesia masa kini mudah menyiratkan kesalahan moral. Alternatif dalam catatan mempertahankan nuansa perubahan tindakan tanpa meniadakan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang lugas dan bermartabat. Bentuk “ya Yahweh” mempertahankan sapaan langsung, sedangkan tanda pisah mempertahankan desakan ratapan Ibrani.
