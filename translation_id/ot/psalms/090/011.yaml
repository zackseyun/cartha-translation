  yaml_path: translation/ot/psalms/090/011.yaml
  text: Who knows the power of your anger[a], and your wrath according to the fear due to you?
translation:
  language: id
  text: Siapakah yang mengetahui kekuatan murka-Mu, dan amarah-Mu sesuai dengan rasa takut yang patut kepada-Mu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan amarah-Mu menurut rasa takut kepada-Mu,” atau, “Seperti rasa takut kepada-Mu, demikianlah amarah-Mu.” Ungkapan Ibraninya ringkas dan dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Siapakah
  rationale: Kata tanya ini membuka pertanyaan retoris. “Siapakah” alami dalam bahasa Indonesia dan mempertahankan tekanannya tanpa menambahkan gagasan lain.
- source_word: יוֹדֵעַ
  choice: mengetahui
  rationale: Partisip dari ידע menyatakan mengetahui atau mengenali. “Mengetahui” merupakan padanan langsung; konteks retoris sudah menyiratkan pengenalan yang sungguh-sungguh.
- source_word: עֹז
  choice: dahsyatnya
  rationale: עֹז berarti kekuatan atau kedahsyatan. Dalam hubungan dengan murka, “dahsyatnya” terdengar alami dan menyampaikan kekuatan efektif murka tersebut, bukan sekadar keberadaannya.
- source_word: אַפֶּךָ
  choice: murka-Mu
  rationale: Walaupun אַף secara harfiah berkaitan dengan hidung, dalam ungkapan ini artinya ialah kemarahan. “Murka-Mu” mempertahankan ragam yang luhur dan tidak memasukkan antropomorfisme yang dapat mengaburkan maksud.
- source_word: וּכְיִרְאָתְךָ
  choice: dan ... sesuai dengan rasa takut yang patut kepada-Mu
  rationale: Gabungan waw, preposisi perbandingan כ, dan יִרְאָה menyatakan hubungan antara amarah Allah dan rasa takut kepada-Nya. Ungkapan Indonesia ini jelas dan alami, sambil catatan kaki mempertahankan kepadatan serta kemungkinan pembacaan lain dalam bahasa Ibrani.
- source_word: עֶבְרָתֶךָ
  choice: amarah-Mu
  rationale: עֶבְרָה menunjuk pada amarah atau kemurkaan yang hebat. “Amarah-Mu” membedakannya dari אַף yang diterjemahkan “murka-Mu”, tanpa menghilangkan tumpang tindih maknanya.
theological_decisions:
- issue: Hubungan antara amarah ilahi dan rasa takut dalam וּכְיִרְאָתְךָ עֶבְרָתֶךָ
  choice: Amarah-Mu sesuai dengan rasa takut yang patut kepada-Mu.
  alternative: Dan amarah-Mu menurut rasa takut kepada-Mu; atau, Seperti rasa takut kepada-Mu, demikianlah amarah-Mu.
  rationale: Susunan Ibraninya ringkas dan dapat dipahami dengan lebih dari satu cara. Teks utama menyatakan kesepadanan antara amarah Allah dan rasa takut hormat yang patut diarahkan kepada-Nya, sedangkan catatan kaki menjaga alternatif sintaksis tanpa memaksakan penjelasan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Siapakah” serta pronomina ilahi dengan huruf kapital sesuai dengan gaya teks Kitab Suci Indonesia; pilihan kata tetap mudah dipahami pembaca umum.
