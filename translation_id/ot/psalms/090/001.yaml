source:
  edition: WLC
  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: id
  text: Doa Musa[a], abdi Allah. Tuhan, Engkau telah menjadi tempat kediaman[b] bagi kami dari generasi ke generasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Doa oleh Musa” atau “Doa untuk Musa”; kata depan Ibrani dalam judul ini dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: alternative_reading
  - marker: b
    text: Atau “tempat tinggal” atau “tempat perlindungan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Doa
  rationale: Sebagai label jenis dalam judul mazmur, bentuk ringkas “Doa” alami dalam bahasa Indonesia dan menyampaikan arti nomina Ibrani secara langsung.
- source_word: לְמֹשֶׁה
  choice: Musa
  rationale: Susunan judul “Doa Musa” mempertahankan keluwesan relasi yang ditandai לְ, tanpa secara tegas membatasi maknanya pada kepengarangan atau peruntukan.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: “Abdi Allah” merupakan ungkapan Indonesia yang alami dan bermartabat untuk gelar Ibrani ini, serta menandai seseorang yang mengabdi kepada dan diutus oleh Allah.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Bentuk ini adalah sapaan berupa gelar ilahi; “Tuhan” merupakan padanan Indonesia yang langsung dan lazim tanpa mempertegas unsur posesif historis dalam bentuk tersebut.
- source_word: מָעוֹן
  choice: tempat kediaman
  rationale: Padanan ini mempertahankan metafora spasial tentang Allah sebagai tempat umat-Nya berdiam; “perlindungan” akan mempersempit citra tersebut secara interpretatif.
- source_word: הָיִיתָ לָּנוּ
  choice: Engkaulah ... kami
  rationale: Konstruksi nominal Indonesia dengan “-lah” secara alami menyampaikan bahwa Allah telah dan tetap menjadi tempat kediaman bagi umat-Nya, tanpa terjemahan kaku “telah menjadi bagi kami”.
- source_word: בְּדֹר וָדֹר
  choice: turun-temurun
  rationale: Ungkapan Indonesia ini menyampaikan kesinambungan melalui generasi-generasi berturut-turut secara ringkas dan idiomatis.
theological_decisions:
- issue: Daya makna לְ dalam judul לְמֹשֶׁה
  choice: Diterjemahkan secara netral sebagai “Doa Musa”
  alternative: “Doa oleh Musa” atau “Doa untuk Musa”
  rationale: Preposisi Ibrani dalam judul mazmur dapat menandai kepengarangan, hubungan, atau peruntukan. Susunan “Doa Musa” tidak memutuskan secara tegas mana yang dimaksud.
- issue: Citra Allah sebagai מָעוֹן
  choice: Mempertahankan metafora “tempat kediaman”
  alternative: “tempat perlindungan”
  rationale: Makna dasarnya ialah tempat tinggal atau kediaman. Terjemahan “perlindungan” mungkin menyatakan implikasinya, tetapi mempersempit metafora teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk sapaan langsung kepada Allah. Judul dibuat ringkas menurut kelaziman judul mazmur Indonesia, sedangkan metafora kediaman dipertahankan.
