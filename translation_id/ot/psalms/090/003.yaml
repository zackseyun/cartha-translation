  text: תָּשֵׁ֣ב אֱ֭נוֹשׁ עַד דַּכָּ֑א וַ֝/תֹּ֗אמֶר שׁ֣וּבוּ בְנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/003.yaml
  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: id
  text: Engkau mengembalikan manusia kepada debu[a] dan berkata, “Kembalilah, hai anak-anak manusia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada keadaan remuk” atau “kepada sesuatu yang diremukkan.” Kata Ibraninya menunjuk pada sesuatu yang diremukkan atau dihancurkan hingga lumat; “debu” menyatakan maknanya dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Adam.” Kata Ibrani Adam juga dapat berarti “manusia”; ungkapan ini menunjuk kepada umat manusia.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  choice: mengembalikan
  rationale: Bentuk kausatif dari שׁוב menyatakan bahwa Allah menyebabkan manusia kembali; pilihan ini juga mempertahankan kaitan verbal dengan imperatif שׁוּבוּ, “Kembalilah”.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Kata ini menunjuk manusia, sering dengan nuansa kefanaan dan kelemahan. “Manusia” wajar dalam bahasa Indonesia dan tidak menambahkan penjelasan yang tidak tersurat.
- source_word: עַד דַּכָּא
  choice: kepada debu
  rationale: דַּכָּא berkaitan dengan keadaan atau materi yang diremukkan. Dalam konteks kefanaan manusia, “debu” menyampaikan hasil akhirnya secara alami, sedangkan alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: וַתֹּאמֶר
  choice: dan berkata
  rationale: אמר adalah verba umum untuk berkata. Pilihan ini mempertahankan makna sumber tanpa mempersempitnya menjadi istilah khusus bagi firman ilahi.
- source_word: שׁוּבוּ
  choice: Kembalilah
  rationale: Imperatif jamak ini mengulang akar שׁוב dari verba pertama dan mempertahankan permainan kata penting dalam ayat tersebut.
- source_word: בְנֵי אָדָם
  choice: anak-anak manusia
  rationale: Ungkapan ini secara harfiah berarti “anak-anak manusia/Adam” dan secara idiomatis menunjuk umat manusia. Bentuk yang dipilih mempertahankan citra dan kesejajaran puitis Ibrani.
theological_decisions:
- issue: Makna kembalinya manusia
  choice: kepada debu
  alternative: kepada keadaan remuk / kepada kehancuran
  rationale: Konteks Mazmur 90 menekankan kefanaan, dan “debu” secara alami membangkitkan kembalinya manusia kepada tanah tanpa menjadikan rujukan antarteks tertentu sebagai bagian eksplisit dari teks.
- issue: Penerjemahan בְנֵי אָדָם
  choice: anak-anak manusia
  alternative: anak-anak Adam / umat manusia
  rationale: “Anak-anak manusia” menjaga bentuk puitis dan acuan kolektif sumber. Catatan kaki mempertahankan kemungkinan membaca אָדָם sebagai nama Adam maupun sebagai sebutan bagi manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “mengembalikan—Kembalilah” sengaja dipertahankan untuk mencerminkan pengulangan akar שׁוב. Partikel vokatif “hai” membuat sapaan jamak terdengar alami dalam puisi tanpa mengubah isinya.
