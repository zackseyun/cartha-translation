source:
  edition: WLC
  text: שַׂבְּעֵ֣/נוּ בַ/בֹּ֣קֶר חַסְדֶּ֑/ךָ וּֽ/נְרַנְּנָ֥ה וְ֝/נִשְׂמְחָ֗ה בְּ/כָל יָמֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: id
  text: Kenyangkanlah kami pada pagi hari dengan kasih setia-Mu[a], maka kami akan bersorak-sorai dan bersukacita sepanjang hidup kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih perjanjian-Mu” atau “belas kasihan-Mu.” Kata Ibrani חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: Kenyangkanlah kami
  rationale: Bentuk imperatif Piel dengan sufiks orang pertama jamak memohon agar umat dipuaskan hingga penuh. “Kenyangkanlah kami” mempertahankan gambaran kelimpahan dan tetap wajar dalam bahasa Indonesia.
- source_word: בַבֹּקֶר
  choice: pada pagi hari
  rationale: Frasa ini secara langsung menunjuk waktu, “pada pagi hari.” Terjemahan ini tidak mempersempitnya menjadi pengulangan “setiap pagi” atau batas waktu “menjelang pagi.”
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh. “Kasih setia” merupakan ungkapan Indonesia yang ringkas dan kaya makna tanpa membatasinya hanya pada belas kasihan.
- source_word: וּנְרַנְּנָה
  choice: maka kami akan bersorak-sorai
  rationale: רנן mengungkapkan seruan atau nyanyian sukacita. Bentuk kohortatif setelah permohonan dapat dipahami sebagai hasil atau tujuan; “maka kami akan” menyampaikan hubungan itu secara alami.
- source_word: וְנִשְׂמְחָה
  choice: dan bersukacita
  rationale: שמח berarti bergembira atau bersukacita. Pilihan ini mempertahankan kesejajaran dengan seruan sukacita sebelumnya.
- source_word: בְּכָל יָמֵינוּ
  choice: sepanjang hidup kami
  rationale: Secara harfiah berarti “dalam seluruh hari-hari kami,” yaitu sepanjang masa hidup para pemohon. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan cakupan temporal penuh.
theological_decisions:
- issue: Pemaknaan חֶסֶד dalam permohonan akan kemurahan Allah
  choice: kasih setia-Mu
  alternative: kasih perjanjian-Mu; belas kasihan-Mu
  rationale: Ayat ini memohon kasih Allah yang teguh, baik, dan dapat diandalkan sebagai dasar sukacita umat. “Kasih setia” menjaga keluasan maknanya tanpa mengunci istilah itu pada satu rumusan teologis yang lebih sempit.
- issue: Hubungan kohortatif dengan imperatif pembuka
  choice: maka kami akan bersorak-sorai dan bersukacita
  alternative: supaya kami bersorak-sorai dan bersukacita
  rationale: Rangkaian Ibrani dapat menyatakan hasil maupun tujuan dari tindakan Allah yang dimohonkan. “Maka” mempertahankan alur puitis sebagai tanggapan yang mengikuti pemenuhan oleh kasih setia Allah, tanpa meniadakan nuansa tujuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan kepada Allah memakai huruf kapital pada sufiks “-Mu.” Diksi mempertahankan paralelisme puisi Ibrani dan dapat dipahami pembaca umum.
