source:
  edition: WLC
  text: בַּ֭/בֹּקֶר יָצִ֣יץ וְ/חָלָ֑ף לָ֝/עֶ֗רֶב יְמוֹלֵ֥ל וְ/יָבֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/006.yaml
  text: In the morning it sprouts and flourishes[c][b][a]; by evening it withers and dries up.
translation:
  language: id
  text: Pada pagi hari rumput itu bertunas dan tumbuh subur[a][b]; menjelang petang rumput itu layu[c] dan mengering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbunga” untuk “bertunas” (יָצִיץ); kata kerja Ibrani ini dapat menekankan mekarnya bunga maupun tumbuhnya tunas.
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih harfiah, “dan berlalu” untuk “dan tumbuh subur” (וְחָלָף); terjemahan dalam teks mengikuti kemungkinan maknanya dalam metafora tumbuhan ini.
    reason: lexical_alternative
  - marker: c
    text: Atau “dipotong” untuk “layu” (יְמוֹלֵל); dalam konteks ini kata kerja Ibrani tersebut dapat menunjuk pada dipotongnya atau layunya tumbuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Pada pagi hari
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan mempertahankan kontras dengan petang.
- source_word: יָצִיץ
  choice: bertunas
  rationale: Kata kerja ini dapat menunjuk pada tumbuhnya tunas atau mekarnya bunga; dalam gambaran siklus hidup rumput, 'bertunas' menyatakan tahap awal pertumbuhan dengan jelas.
- source_word: וְחָלָף
  choice: dan tumbuh subur
  rationale: Secara leksikal חלף dapat berarti berlalu atau berubah, tetapi dalam metafora tumbuhan di sini kemungkinan menggambarkan rumput yang berkembang segar sebelum kemerosotannya pada petang hari. Alternatif yang lebih harfiah dipertahankan dalam catatan.
- source_word: לָעֶרֶב
  choice: menjelang petang
  rationale: Menyampaikan peralihan cepat dari kesegaran pagi menuju keadaan pada akhir hari, tanpa mengubah kontras waktunya.
- source_word: יְמוֹלֵל
  choice: layu
  rationale: Dalam konteks tumbuhan, kata ini dapat menggambarkan keadaan layu atau dipotong. 'Layu' selaras dengan kata berikutnya, 'mengering', tanpa menetapkan adanya pelaku luar.
- source_word: וְיָבֵשׁ
  choice: dan mengering
  rationale: Padanan alami bagi keadaan tumbuhan yang kehilangan kelembapan sebagai tahap akhir kemerosotannya.
