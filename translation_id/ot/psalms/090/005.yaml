  text: זְ֭רַמְתָּ/ם שֵׁנָ֣ה יִהְי֑וּ בַּ֝/בֹּ֗קֶר כֶּ/חָצִ֥יר יַחֲלֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/005.yaml
  text: You sweep them away[a]; they are like a dream[c][b]. In the morning they are like grass that sprouts anew.
translation:
  language: id
  text: Engkau menghanyutkan mereka; mereka seperti mimpi.[a] Pada pagi hari mereka seperti rumput yang bertunas kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka seperti tidur”. Bahasa Ibraninya sangat padat. Bagian akhir juga dapat dipahami, “Pada pagi hari ia berlalu seperti rumput.”
    reason: alternative_reading
lexical_decisions:
- source_word: זְרַמְתָּם
  choice: Engkau menghanyutkan mereka
  rationale: Kata kerja זָרַם menggambarkan terbawa oleh arus deras. “Menghanyutkan” mempertahankan citra air dan tindakan penyingkiran yang mendadak secara wajar dalam bahasa Indonesia.
- source_word: שֵׁנָה
  choice: seperti mimpi
  rationale: Secara leksikal berarti “tidur”, tetapi dalam susunan puitis yang sangat padat ini citranya menyatakan kefanaan yang singkat dan tak berwujud. “Seperti mimpi” menyampaikan maksud itu secara alami; kemungkinan harfiah “seperti tidur” dicatat dalam catatan kaki.
- source_word: יִהְיוּ
  choice: mereka seperti
  rationale: Bentuk imperfek dapat bersifat gnomik atau deskriptif dalam puisi Ibrani. Bentuk kini tanpa penanda waktu khusus paling alami dalam bahasa Indonesia.
- source_word: בַּבֹּקֶר
  choice: Pada pagi hari
  rationale: Ungkapan ini mempertahankan keterangan waktu yang membuka citra rumput dalam paruh kedua ayat.
- source_word: כֶּחָצִיר
  choice: seperti rumput
  rationale: חָצִיר lazim berarti rumput atau tumbuh-tumbuhan dan di sini menjadi gambaran kefanaan manusia.
- source_word: יַחֲלֹף
  choice: yang bertunas kembali
  rationale: Dalam konteks ayat 6, akar חלף paling mungkin menggambarkan rumput yang berganti atau tumbuh segar pada pagi hari sebelum layu pada petang. Bentuk tunggalnya secara formal bersesuaian dengan “rumput”.
theological_decisions: []
