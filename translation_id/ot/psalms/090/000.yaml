base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/000.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: id
  text: Doa Musa[a], abdi Allah. Tuhan, Engkaulah tempat kediaman[b] kami dari generasi ke generasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam judul ini, frasa Ibrani juga dapat diterjemahkan “doa oleh Musa” atau “doa untuk Musa”; kata depannya dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan.
    reason: alternative_reading
  - marker: b
    text: Atau “tempat perlindungan” atau “hunian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Doa
  rationale: Padanan langsung dan alami untuk judul mazmur ini.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan Indonesia yang wajar dan bermartabat bagi gelar Ibrani harfiah 'orang Allah', yakni seseorang yang mengabdi kepada Allah.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Mewakili sapaan ilahi Adonai dan membedakannya secara konseptual dari nama perjanjian YHWH.
- source_word: מָעוֹן
  choice: tempat kediaman
  rationale: Makna dasarnya adalah tempat tinggal atau kediaman; pilihan ini mempertahankan gambaran bahwa umat berdiam dengan aman di dalam Tuhan tanpa mempersempitnya menjadi sekadar perlindungan.
- source_word: בְּדֹר וָדֹר
  choice: turun-temurun
  rationale: Ungkapan Indonesia alami yang menyampaikan kesinambungan 'dari generasi ke generasi'.
theological_decisions:
- issue: Hubungan Musa dengan doa dalam frasa לְמֹשֶׁה
  choice: Doa Musa
  alternative: Doa oleh Musa / doa untuk Musa
  rationale: Preposisi לְ dapat menandai kepengarangan, keterkaitan, atau peruntukan. Teks utama memakai bentuk judul yang alami, sedangkan ambiguitas sumber dipertahankan dalam catatan kaki.
- issue: Metafora Allah sebagai מָעוֹן
  choice: tempat kediaman
  alternative: tempat perlindungan / hunian
  rationale: Mempertahankan metafora spasial sumber dan tidak mengubahnya secara teologis menjadi konsep perlindungan saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. 'Abdi Allah' dipilih agar gelar Ibrani terdengar alami bagi pembaca umum. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
