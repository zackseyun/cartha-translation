  text: בְּ/טֶ֤רֶם הָ֘רִ֤ים יֻלָּ֗דוּ וַ/תְּח֣וֹלֵֽל אֶ֣רֶץ וְ/תֵבֵ֑ל וּֽ/מֵ/עוֹלָ֥ם עַד ע֝וֹלָ֗ם אַתָּ֥ה אֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: id
  text: Sebelum gunung-gunung dilahirkan dan sebelum Engkau melahirkan bumi dan dunia[a], dari kekekalan sampai kekekalan Engkaulah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau mengadakan bumi dan dunia.” Kata kerja Ibrani ini memakai gambaran persalinan atau kelahiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Sebelum
  rationale: Partikel temporal ini menyatakan waktu sebelum penciptaan; 'Sebelum' alami dan tepat dalam bahasa Indonesia modern.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak dengan artikel tertentu diterjemahkan secara alami sebagai 'gunung-gunung' dalam konteks puitis.
- source_word: יֻלָּדוּ
  choice: dilahirkan
  rationale: Bentuk pasif dari ילד mempertahankan gambaran kelahiran yang dikenakan kepada gunung-gunung.
- source_word: וַתְּחוֹלֵל
  choice: Engkau melahirkan
  rationale: Kata kerja ini dapat menggambarkan sakit bersalin atau tindakan melahirkan. Pilihan ini mempertahankan metafora kelahiran yang kuat dan kesinambungannya dengan יֻלָּדוּ.
- source_word: אֶרֶץ
  choice: bumi
  rationale: Dalam paralel dengan תבל dan konteks penciptaan kosmis, 'bumi' lebih tepat daripada 'tanah' atau 'negeri'.
- source_word: וְתֵבֵל
  choice: dan dunia
  rationale: תבל menunjuk kepada dunia, sering dengan nuansa dunia yang dihuni atau tertata; 'dunia' ringkas dan alami.
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: dari selama-lamanya sampai selama-lamanya
  rationale: Ungkapan ini mempertahankan idiom Ibrani mengenai durasi yang tak berbatas ke kedua arah tanpa mengubahnya menjadi rumusan filosofis.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Pronomina eksplisit bersifat emfatis; akhiran '-lah' menyampaikan penekanan itu secara alami dan khidmat.
- source_word: אֵל
  choice: Allah
  rationale: אֵל berfungsi sebagai sebutan ilahi; 'Allah' merupakan padanan baku dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Gambaran penciptaan dengan bahasa kelahiran antropomorfis
  choice: Mempertahankan metafora kelahiran bagi gunung-gunung serta bumi dan dunia.
  alternative: Meratakan gambaran menjadi 'dijadikan', 'dibentuk', atau 'diciptakan'.
  rationale: Bahasa Ibrani dengan sengaja memakai citra kelahiran atau persalinan. Mempertahankannya menjaga daya puitis dan menyatakan bahwa Allah mendahului ciptaan tanpa menambahkan klaim mengenai mekanisme penciptaan.
- issue: Ungkapan tentang kekekalan Allah
  choice: dari selama-lamanya sampai selama-lamanya Engkaulah Allah
  alternative: dari kekekalan sampai kekekalan Engkaulah Allah
  rationale: Pilihan ini mempertahankan bentuk idiomatis Ibrani dan klaim bahwa Allah ada sebelum serta melampaui ciptaan, tanpa mempersempitnya menjadi formulasi filosofis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Kapitalisasi 'Engkau' mengikuti kebiasaan penghormatan kepada Allah. Metafora kelahiran sengaja dipertahankan karena menonjol dalam bahasa sumber; catatan kaki memberi alternatif yang kurang harfiah.
