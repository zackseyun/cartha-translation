  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: id
  text: 'Hari-hari kehidupan kami berjumlah tujuh puluh tahun,

    atau, jika kami kuat, delapan puluh tahun.

    Namun, kebanggaan tahun-tahun itu[a] adalah jerih payah dan kesusahan,

    sebab itu segera berlalu[b], dan kami pun terbang pergi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagian terbaik dari tahun-tahun itu.” Kata Ibrani yang diterjemahkan “kebanggaan” juga dapat menunjuk pada bagian yang paling mengesankan atau paling kuat dari tahun-tahun itu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebab itu cepat lenyap” atau “sebab itu segera terputus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: Hari-hari kehidupan kami
  rationale: Ungkapan ini mempertahankan gambaran puitis tentang hari-hari yang membentuk masa hidup, tetapi lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah “hari-hari tahun-tahun kami”.
- source_word: בָהֶם
  choice: berjumlah
  rationale: Preposisi dengan pronomina ini berfungsi idiomatis untuk menyatakan jumlah keseluruhan masa hidup; “berjumlah” menyampaikan fungsi tersebut dengan jelas.
- source_word: שִׁבְעִים שָׁנָה
  choice: tujuh puluh tahun
  rationale: Terjemahan langsung dari ungkapan bilangan.
- source_word: וְאִם בִּגְבוּרֹת
  choice: atau, jika kami kuat
  rationale: Menyampaikan keadaan luar biasa ketika kekuatan atau kebugaran memungkinkan umur yang lebih panjang, sekaligus mempertahankan nuansa bersyarat.
- source_word: שְׁמֹונִים שָׁנָה
  choice: delapan puluh tahun
  rationale: Terjemahan langsung dari ungkapan bilangan.
- source_word: וְרָהְבָּם
  choice: kebanggaannya
  rationale: Kata Ibrani dapat menunjuk pada kebanggaan, sesuatu yang mengesankan, atau bagian yang terbaik. Pilihan ini mempertahankan daya leksikal dan ironi teks tanpa membatasi maknanya pada satu penafsiran.
- source_word: עָמָל וָאָוֶן
  choice: jerih payah dan kesusahan
  rationale: Pasangan ini menyatakan kerja berat yang melelahkan dan pengalaman hidup yang menyusahkan; konteksnya lebih mendukung penderitaan daripada kejahatan moral.
- source_word: כִּי גָז חִישׁ
  choice: sebab itu segera berlalu
  rationale: Mempertahankan gagasan lenyap atau berlalunya sesuatu dengan cepat. Pronomina “itu” tidak menentukan secara berlebihan apakah yang dimaksud ialah masa hidup atau hal yang dibanggakan darinya.
- source_word: וַנָּעֻפָה
  choice: lalu kami pun terbang pergi
  rationale: Mempertahankan citra puitis yang hidup dari kata kerja Ibrani serta bentuk orang pertama jamak.
