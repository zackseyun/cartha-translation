  yaml_path: translation/ot/psalms/090/008.yaml
  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: id
  text: 'Engkau telah menempatkan kesalahan kami di hadapan-Mu,

    dosa-dosa kami yang tersembunyi[a] dalam terang wajah-Mu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dosa-dosa kami yang rahasia.” Kata Ibrani ini menunjuk pada apa yang tersembunyi atau dirahasiakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam terang wajah-Mu,” suatu gambaran bahwa semuanya tersingkap sepenuhnya dalam hadirat Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתָּה / שת (lemma שִׁית)
  choice: Engkau telah menempatkan
  rationale: Bentuk perfektum menyatakan tindakan Allah yang telah dilakukan dan tetap menentukan keadaan yang digambarkan. “Menempatkan” mempertahankan makna dasar ‘menaruh/menempatkan’ dengan bahasa Indonesia yang wajar.
- source_word: עֲוֺנֹתֵינוּ
  choice: kesalahan-kesalahan kami
  rationale: עָוֹן dapat menunjuk pada perbuatan jahat, kesalahan, atau kesalahan yang mendatangkan hukuman. Bentuk jamak dipertahankan; “kesalahan-kesalahan” menyampaikan bobot moral tanpa mempersempitnya hanya pada rasa bersalah.
- source_word: לְנֶגְדֶּךָ
  choice: di hadapan-Mu
  rationale: Frasa ini berarti ‘di depan-Mu’ atau ‘di hadapan-Mu’ dan menyiratkan bahwa semuanya terbuka bagi pandangan Allah.
- source_word: עֲלֻמֵנוּ
  choice: dosa-dosa kami yang tersembunyi
  rationale: Kata ini menunjuk pada hal-hal yang tersembunyi. Sejajar dengan “kesalahan-kesalahan kami”, konteks menunjukkan bahwa yang dimaksud ialah pelanggaran tersembunyi; kata “dosa-dosa” membuat elipsis puitis itu jelas.
- source_word: לִמְאוֹר
  choice: dalam terang
  rationale: Ungkapan ini menggambarkan sesuatu yang tersembunyi sebagai tersingkap oleh cahaya. “Dalam terang” alami dalam bahasa Indonesia dan tetap mempertahankan citra sumber.
- source_word: פָּנֶיךָ
  choice: wajah-Mu
  rationale: Terjemahan harfiah ‘wajah-Mu’ mempertahankan citra konkret Ibrani mengenai sorotan kehadiran dan perhatian Allah; “hadirat-Mu” mungkin secara makna, tetapi kurang mempertahankan metaforanya.
theological_decisions:
- issue: Apakah objek tersirat dalam עֲלֻמֵנוּ perlu dinyatakan secara eksplisit
  choice: dosa-dosa kami yang tersembunyi
  alternative: hal-hal kami yang tersembunyi / rahasia-rahasia kami
  rationale: Paralelisme langsung dengan “kesalahan-kesalahan kami” menunjukkan pelanggaran yang disembunyikan, bukan segala hal rahasia secara netral. Penambahan “dosa-dosa” menjelaskan elipsis Ibrani tanpa memasukkan gagasan asing.
- issue: Apakah פָּנֶיךָ diterjemahkan sebagai metafora konkret atau maknanya
  choice: wajah-Mu
  alternative: hadirat-Mu
  rationale: Metafora wajah Allah adalah bagian dari daya puitis ayat dan menyatakan penyingkapan penuh di hadapan-Nya. Mempertahankannya juga tidak menghilangkan ketegangan antara citra dan makna.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Baris puitis mempertahankan kesejajaran dua klausa Ibrani.
