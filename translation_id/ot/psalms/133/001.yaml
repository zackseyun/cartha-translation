  yaml_path: translation/ot/psalms/133/001.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is when brothers dwell together!
translation:
  language: id
  text: 'Nyanyian Pendakian.[a] Dari Daud.[b]


    Lihatlah, betapa baik dan menyenangkannya

    apabila saudara-saudara tinggal bersama-sama![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “Pendakian” berkaitan dengan “naik” atau “pendakian.” Frasa ini merupakan judul khas Mazmur 120–134.
    reason: lexical_alternative
  - marker: b
    text: Atau “Milik Daud” atau “Untuk Daud”; kata depan Ibrani dapat menyatakan kepengarangan, hubungan, atau persembahan.
    reason: source_ambiguity
  - marker: c
    text: “Saudara-saudara” dapat berarti saudara kandung atau, secara lebih luas, sesama anggota umat perjanjian. Frasa Ibraninya menegaskan kebersamaan dalam tinggal bersama.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Pendakian
  rationale: Menerjemahkan bentuk jamak מַעֲלוֹת secara cukup formal dan mempertahankan judul khas Mazmur 120–134 tanpa memastikan latar ziarah yang hanya tersirat.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan judul ini dapat menunjukkan kepengarangan, hubungan, atau persembahan. 'Dari Daud' cukup alami dalam bahasa Indonesia sambil tidak setegas 'ditulis oleh Daud'.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata seru ini mengarahkan perhatian dengan nada kagum; 'Lihatlah' mempertahankan daya puitisnya dalam bahasa Indonesia modern.
- source_word: מַה טּוֹב וּמַה נָּעִים
  choice: betapa baik dan betapa menyenangkan
  rationale: מַה bersama kata sifat membentuk seruan. Pengulangan 'betapa' mempertahankan kesejajaran dan penekanan teks Ibrani.
- source_word: שֶׁבֶת אַחִים
  choice: ketika saudara-saudara tinggal
  rationale: Infinitif שֶׁבֶת menyatakan keadaan tinggal bersama dan wajar dialihkan sebagai klausa temporal. אַחִים dipertahankan sebagai 'saudara-saudara', yang dapat merujuk kepada saudara kandung maupun sesama anggota komunitas.
- source_word: גַּם יָחַד
  choice: bersama dengan rukun
  rationale: יָחַד secara langsung menyatakan kebersamaan, sedangkan גַּם memberi penguatan. 'Bersama dengan rukun' menyampaikan kebersamaan yang harmonis dalam ungkapan Indonesia yang alami, tanpa menjadikannya istilah doktrinal.
theological_decisions:
- issue: Cakupan אַחִים ('saudara-saudara')
  choice: Memakai 'saudara-saudara' dalam teks utama
  alternative: sanak saudara; sesama umat
  rationale: Bentuk Ibrani dapat menunjuk kepada saudara laki-laki secara harfiah atau secara lebih luas kepada sesama anggota komunitas perjanjian. Terjemahan utama mempertahankan istilah kekerabatan tanpa menutup cakupan yang lebih luas.
- issue: Daya ungkap גַּם יָחַד
  choice: bersama dengan rukun
  alternative: bersama; dalam kesatuan
  rationale: Pilihan ini mempertahankan unsur kebersamaan dari יָחַד dan menyampaikan penguatan serta keharmonisan yang ditimbulkan oleh frasa itu, tanpa memasukkan pengertian kesatuan yang terlalu abstrak.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Bentuk baris mempertahankan kesejajaran seruan Ibrani. 'Saudara-saudara' dipilih karena alami serta tetap membuka arti harfiah dan komunal; 'dengan rukun' memakai ungkapan Indonesia yang lazim untuk kehidupan bersama yang harmonis.
