  text: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
translation:
  language: id
  text: Seperti minyak yang baik[a] di atas kepala, yang mengalir turun ke janggut, ke janggut Harun, yang mengalir turun ke kerah jubahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “minyak yang berharga” atau “minyak yang bermutu”. Bahasa Ibrani secara lebih harfiah berbunyi “minyak yang baik”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke mulut pakaiannya”; ungkapan Ibrani ini dapat menunjuk pada kerah, bukaan leher, atau tepi jubahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּשֶּׁמֶן הַטּוֹב
  choice: Seperti minyak yang baik
  rationale: Prefiks כְּ menyatakan perbandingan, sedangkan טוֹב paling langsung berarti 'baik'. Ungkapan ini mempertahankan bentuk perbandingan dan arti dasar Ibrani tanpa menghilangkan kemungkinan nuansa minyak bermutu tinggi.
- source_word: יֹרֵד
  choice: yang mengalir turun
  rationale: Bentuk partisipel dari ירד menggambarkan gerak turun yang terus berlangsung; untuk minyak, 'mengalir turun' alami dan hidup dalam bahasa Indonesia.
- source_word: עַל הָרֹאשׁ
  choice: di atas kepala
  rationale: Terjemahan langsung dari frasa anatomis tersebut dan wajar untuk minyak yang dicurahkan pada kepala.
- source_word: עַל הַזָּקָן זְקַן אַהֲרֹן
  choice: ke janggut, ke janggut Harun
  rationale: Pengulangan 'janggut' dipertahankan sebagai ciri puitis teks Ibrani; 'Harun' menyatakan hubungan konstruksi secara alami.
- source_word: שֶׁיֹּרֵד
  choice: yang mengalir turun
  rationale: Klausa relatif dan pengulangan verba dipertahankan untuk meneruskan sekaligus menegaskan gambaran gerak minyak.
- source_word: עַל פִּי מִדּוֹתָיו
  choice: sampai ke leher jubahnya
  rationale: פִּי secara harfiah 'mulut' dan dalam hubungan dengan pakaian menunjuk pada bukaan atau tepi pakaian. 'Leher jubah' menyampaikan bukaan bagian atas secara alami, sementara catatan kaki mempertahankan ambiguitas leksikalnya.
theological_decisions:
- issue: Sifat gambaran minyak
  choice: Mempertahankan perumpamaan tentang minyak pada Harun tanpa menambahkan penjelasan doktrinal.
  alternative: Menyebutnya secara eksplisit sebagai minyak pengurapan imam.
  rationale: Konteks kuat menggemakan pengurapan Harun, tetapi ayat ini sendiri menyajikan gambaran puitis. Terjemahan tidak mengubah kiasan itu menjadi tafsiran eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan Ibrani dipertahankan, sedangkan gambaran aliran minyak dibuat alami bagi pembaca umum. Semua penanda catatan kaki terdapat dalam teks utama.
