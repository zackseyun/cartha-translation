  text: כְּ/טַל חֶרְמ֗וֹן שֶׁ/יֹּרֵד֮ עַל הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם צִוָּ֣ה יְ֭הוָה אֶת הַ/בְּרָכָ֑ה חַ֝יִּ֗ים עַד הָ/עוֹלָֽם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/003.yaml
  text: like the dew of Hermon[a], which falls on the mountains of Zion. For there Yahweh commanded the blessing[b], life forever.
translation:
  language: id
  text: 'seperti embun Hermon[a] yang turun di atas gunung-gunung Sion. Sebab di sanalah Yahweh memerintahkan berkat[b]: kehidupan untuk selama-lamanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti embun Hermon yang turun ke atas gunung-gunung Sion.”
    reason: Alternatif ini menonjolkan arah gerak kata kerja “turun,” sementara teks utama memakai “di atas” untuk mencerminkan fungsi lokatif עַל secara langsung.
  - marker: b
    text: Atau, “kehidupan untuk seterusnya.”
    reason: Alternatif leksikal untuk menerjemahkan עַד הָעוֹלָם; frasa ini tetap berfungsi sebagai aposisi yang menjelaskan “berkat.”
lexical_decisions:
- source_word: כְּ/טַל
  choice: seperti embun
  rationale: Prefiks כְּ menandai perbandingan, sedangkan טַל berarti ‘embun’. Ungkapan ini mempertahankan bentuk simile secara alami dalam bahasa Indonesia.
- source_word: חֶרְמוֹן
  choice: Hermon
  rationale: Nama tempat ditransliterasikan sebagai ‘Hermon’ sesuai pemakaian baku.
- source_word: שֶׁ/יֹּרֵד
  choice: yang turun
  rationale: Kata kerja ירד menyatakan gerak turun. ‘Yang turun’ alami untuk embun dan tetap mempertahankan arah geraknya.
- source_word: עַל הַרְרֵי צִיּוֹן
  choice: ke gunung-gunung Sion
  rationale: Bentuk jamak konstruksi הַרְרֵי dipertahankan dengan ‘gunung-gunung’, sedangkan עַל dalam konteks gerak turun diterjemahkan ‘ke’ agar wajar dalam bahasa Indonesia.
- source_word: כִּי שָׁם
  choice: Sebab, di sanalah
  rationale: כִּי memperkenalkan alasan, sementara שָׁם dipertahankan sebagai ‘di sana’ tanpa menjelaskan referennya secara berlebihan. Partikel ‘-lah’ mencerminkan penekanan puitis.
- source_word: צִוָּה
  choice: memerintahkan
  rationale: Kata kerja ini pada dasarnya berarti ‘memerintahkan’. Pilihan tersebut mempertahankan tindakan Yahweh yang berdaulat dan tidak memperhalusnya menjadi ‘menganugerahkan’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֶת הַ/בְּרָכָה
  choice: berkat
  rationale: Nomina tertentu ini menunjuk kepada berkat yang dimaksud dalam konteks. Bahasa Indonesia tidak memiliki kata sandang tertentu yang perlu dinyatakan secara terpisah.
- source_word: חַיִּים עַד הָ/עוֹלָם
  choice: kehidupan untuk selama-lamanya
  rationale: Frasa ini menyatakan kehidupan yang berlangsung tanpa akhir. ‘Untuk selama-lamanya’ merupakan ungkapan Indonesia yang jelas, bermartabat, dan sesuai dengan daya duratif עַד הָעוֹלָם.
theological_decisions:
- issue: Hubungan frasa terakhir dengan ‘berkat’
  choice: Menampilkan ‘kehidupan untuk selama-lamanya’ sebagai aposisi yang menjelaskan berkat itu.
  alternative: Membacanya sebagai klausa atau seruan tersendiri.
  rationale: Urutan Ibrani ‘berkat, kehidupan untuk selama-lamanya’ secara wajar dapat dibaca sebagai aposisi puitis. Kata ‘yaitu’ membuat hubungan itu dapat dipahami dalam bahasa Indonesia tanpa mengembangkan rumusan doktrinal di luar teks.
- issue: Referen ‘di sana’
  choice: Mempertahankan kata penunjuk tempat tanpa menjelaskan referennya dalam teks utama.
  alternative: Menggantikannya dengan ‘di Sion’ atau ‘di tengah saudara-saudara yang hidup rukun’.
  rationale: Teks Ibrani hanya mengatakan ‘di sana’. Mempertahankan bentuk itu menjaga kekompakan dan ambiguitas puisinya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Struktur ayat tetap ringkas; bentuk jamak ‘gunung-gunung Sion’, nama ‘Yahweh’, dan ambiguitas ‘di sana’ dipertahankan. Tanda koma dan ‘yaitu’ membantu pembaca menangkap aposisi terakhir tanpa mengubahnya menjadi pernyataan teologis yang lebih terperinci.
