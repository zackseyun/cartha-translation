  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is for brothers to dwell together.
translation:
  language: id
  text: Nyanyian ziarah[a]. Dari Daud. Lihatlah, betapa baik dan menyenangkannya saudara-saudara[b] tinggal bersama-sama![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Nyanyian Pendakian”; makna tepat istilah judul ini tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara” dapat berarti saudara kandung, kaum kerabat, atau secara lebih luas sesama anggota umat perjanjian.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani memberi penekanan pada kebersamaan; dapat juga diterjemahkan, “tinggal bersama dalam kerukunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Secara harfiah berarti “nyanyian pendakian”. Dalam konteks judul kumpulan Mazmur 120–134, frasa ini lazim dipahami sebagai nyanyian yang dinyanyikan dalam perjalanan naik menuju Yerusalem; terjemahan ini alami dalam bahasa Indonesia tanpa menutup kemungkinan makna harfiahnya, yang dicatat dalam catatan kaki.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Preposisi לְ pada judul mazmur dapat menunjukkan kepengarangan, keterkaitan, persembahan, atau peruntukan. “Dari Daud” ringkas dan tetap cukup terbuka dibandingkan rumusan yang secara mutlak menyatakan kepengarangan.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan seruan yang mengarahkan perhatian pembaca kepada kebaikan keadaan yang digambarkan.
- source_word: אַחִים
  choice: saudara-saudara
  rationale: Padanan langsung bagi bentuk jamak “saudara”; dalam konteks mazmur, cakupannya dapat meluas dari saudara kandung kepada kaum kerabat atau anggota umat perjanjian.
- source_word: שֶׁבֶת ... גַּם יָחַד
  choice: tinggal bersama-sama
  rationale: “Tinggal” mempertahankan gagasan menetap atau berdiam, sedangkan pengulangan “bersama-sama” secara alami menyampaikan penekanan גַּם יָחַד tanpa menambahkan konsep abstrak yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Cakupan istilah אַחִים
  choice: Memakai “saudara-saudara” dalam teks utama dan menjelaskan cakupan yang lebih luas dalam catatan kaki.
  alternative: Menerjemahkan langsung sebagai “umat” atau “kaum kerabat”.
  rationale: Teks Ibrani mempertahankan citra persaudaraan, yang dapat bersifat harfiah ataupun komunal. Terjemahan utama tidak mempersempit atau memperluasnya secara dogmatis.
- issue: Apakah יָחַד menyatakan kesatuan rohani atau sekadar kebersamaan
  choice: Menerjemahkan “bersama-sama”.
  alternative: “dalam kerukunan” atau “dalam kesatuan”.
  rationale: “Bersama-sama” paling langsung mewakili יָחַד. Nuansa keharmonisan tersirat oleh penilaian “baik dan menyenangkan”, tetapi tidak dipaksakan menjadi istilah teologis abstrak.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. “Nyanyian ziarah” mudah dipahami pembaca umum, sedangkan makna harfiah judul dipertahankan dalam catatan. Bentuk “bersama-sama” sengaja dipakai untuk menyampaikan tekanan ungkapan Ibrani secara alami.
