base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/004.yaml
  text: Do not incline my heart to any evil thing[a], to practice wicked deeds with men who work iniquity[c][b]; and let me not eat of their delicacies.
translation:
  language: id
  text: Jangan condongkan hatiku kepada perkara jahat apa pun[a], untuk melakukan perbuatan jahat bersama orang-orang yang melakukan kejahatan[b]; jangan biarkan aku makan hidangan lezat mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada hal jahat apa pun” atau “kepada perkataan jahat apa pun”; kata Ibrani yang dipakai dapat berarti “perkara”, “hal”, atau “perkataan”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bersama orang-orang yang mengerjakan kejahatan”; dapat juga diterjemahkan “bersama para pelaku kejahatan”.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani ini menunjuk pada hal-hal yang menyenangkan, khususnya hidangan pilihan atau lezat; ungkapan ini dapat pula menyiratkan keikutsertaan dalam kenikmatan berdosa mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּט
  choice: condongkan
  rationale: Bentuk dari נטה menyatakan tindakan membuat hati mengarah atau cenderung; “condongkan” mempertahankan metafora dan daya kausatif Ibrani.
- source_word: לִבִּי
  choice: hatiku
  rationale: “Hati” dalam pemakaian Ibrani mencakup kehendak, hasrat, dan pikiran batin; citra antropologis sumber dipertahankan.
- source_word: לְדָבָר רָע
  choice: kepada perkara jahat apa pun
  rationale: דבר dapat berarti perkara, hal, atau perkataan. “Perkara” menjaga keluasan makna dalam konteks ini, sedangkan “apa pun” mengungkapkan sifat tak tentu frasa tersebut.
- source_word: לְהִתְעוֹלֵל עֲלִלוֹת בְּרֶשַׁע
  choice: sehingga aku melakukan perbuatan-perbuatan fasik
  rationale: Infinitif menyatakan keterlibatan dalam tindakan; “melakukan perbuatan-perbuatan fasik” menyampaikan tindakan nyata dan sifat moralnya secara alami.
- source_word: אֶת אִישִׁים פֹּעֲלֵי אָוֶן
  choice: bersama orang-orang yang melakukan kejahatan
  rationale: Frasa ini menyatakan kebersamaan dengan orang-orang yang bercirikan perbuatan jahat. Terjemahan ini mempertahankan unsur verbal פעלי tanpa memakai istilah Indonesia yang terlalu arkais.
- source_word: וּבַל אֶלְחַם
  choice: jangan biarkan aku menikmati
  rationale: Partikel negatif melanjutkan permohonan, sedangkan אֶלְחַם secara harfiah berarti “aku makan”. Dalam bahasa Indonesia, “menikmati makanan” lebih wajar dan tetap membuka kemungkinan makna partisipasi.
- source_word: בְּמַנְעַמֵּיהֶם
  choice: makanan lezat mereka
  rationale: Kata ini menunjuk pada hal-hal yang menyenangkan atau hidangan pilihan; dalam konstruksi dengan verba “makan”, “makanan lezat” paling jelas dan alami.
theological_decisions:
- issue: Agensi moral dan tindakan Allah dalam אַל תַּט לִבִּי
  choice: Jangan condongkan hatiku
  alternative: Jangan biarkan hatiku condong
  rationale: Bahasa sumber secara langsung memohon kepada Allah mengenai arah hati pemazmur. Bentuk kausatif dipertahankan agar ketegangan teologisnya tidak dilunakkan atau diselesaikan oleh penerjemah.
- issue: Makna makan sebagai tindakan harfiah atau partisipasi moral
  choice: menikmati makanan lezat mereka
  alternative: mengambil bagian dalam kenikmatan mereka
  rationale: Citra makan yang konkret dipertahankan, sementara kemungkinan implikasi ikut menikmati kehidupan berdosa dijelaskan dalam catatan, bukan dimasukkan sebagai tafsiran tunggal ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora “hati” serta permohonan kausatif kepada Allah dipertahankan. “Perkara” dipilih untuk menjaga keluasan דבר, sementara catatan kaki mencatat alternatif leksikal dan kemungkinan nuansa partisipatif pada gambaran makan.
