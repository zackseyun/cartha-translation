base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/006.yaml
  text: Their judges have been thrown down by the sides of the rock[a], and they have heard my words[b], for they are pleasant.
translation:
  language: id
  text: Para hakim mereka dijatuhkan di sisi tebing batu[a], dan mereka mendengar perkataanku, sebab perkataanku itu menyenangkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menuruni sisi tebing.” Frasa Ibraninya sulit; secara lebih harfiah juga dapat dipahami sebagai “ke dalam tangan-tangan batu cadas.”
    reason: alternative_reading
  - marker: b
    text: Atau “sedap” atau “manis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְטוּ
  choice: dijatuhkan
  rationale: Bentuk Nifal dari שׁמט menyatakan bahwa mereka dibuat jatuh atau dilemparkan ke bawah; bentuk pasif ini mempertahankan kekerasan gambaran tanpa menentukan pelakunya.
- source_word: בִידֵי
  choice: di sepanjang sisi
  rationale: Secara harfiah ungkapan ini berkaitan dengan 'tangan-tangan', tetapi ketika diikuti סֶלַע kemungkinan besar berfungsi secara topografis, menunjuk pada sisi-sisi tebing. Karena frasanya sulit, arti harfiahnya dicatat dalam catatan kaki.
- source_word: סֶלַע
  choice: tebing
  rationale: Kata ini dapat berarti batu besar, cadas, atau tebing batu. 'Tebing' menyampaikan latar topografis yang paling wajar dalam bahasa Indonesia.
- source_word: שֹׁפְטֵיהֶם
  choice: para hakim mereka
  rationale: Partisip dari שׁפט dapat menunjuk kepada orang yang menghakimi atau memerintah. 'Para hakim mereka' adalah padanan paling langsung dan tidak memperluas makna menjadi 'para penguasa' tanpa keharusan.
- source_word: וְשָׁמְעוּ
  choice: lalu mereka mendengar
  rationale: Bentuk qatal dalam puisi dapat bernuansa lampau, kini, atau hasil. 'Mendengar' tidak terlalu menentukan aspek, sedangkan 'lalu' menghubungkan dua klausa secara alami tanpa memastikan kronologi yang ketat.
- source_word: אֲמָרַי
  choice: perkataanku
  rationale: Padanan alami bagi bentuk jamak dengan akhiran orang pertama; dalam bahasa Indonesia bentuk kolektif tunggal terdengar wajar.
- source_word: כִּי
  choice: sebab
  rationale: Kata penghubung ini dipahami sebagai pemberi alasan mengapa perkataan pemazmur didengar.
- source_word: נָעֵמוּ
  choice: menyenangkan
  rationale: Verba נעם menyatakan sifat yang menyenangkan, sedap, atau manis. 'Menyenangkan' mempertahankan penilaian positif tanpa mempersempitnya menjadi rasa harfiah.
theological_decisions:
- issue: Penafsiran frasa sulit בידי סלע
  choice: 'Makna topografis: ''di sepanjang sisi tebing'''
  alternative: 'Makna yang lebih harfiah: ''ke dalam tangan batu/cadas''; atau ''menuruni sisi tebing'''
  rationale: Sintaksis frasa Ibrani ini sulit dan gambaran tepatnya tidak pasti. Teks utama memakai makna topografis yang masuk akal, sedangkan kemungkinan harfiah dan arah geraknya dipertahankan dalam catatan kaki agar ambiguitas asli tidak diselesaikan secara dogmatis.
- issue: Kala atau aspek וְשָׁמְעוּ
  choice: 'Bentuk Indonesia yang tidak menandai kala secara eksplisit: ''lalu mereka mendengar'''
  alternative: '''dan mereka telah mendengar'' atau ''dan mereka akan mendengar'''
  rationale: Qatal Ibrani dalam puisi dapat memperoleh nilai waktu dari konteks. Bahasa Indonesia memungkinkan ambiguitas ini dipertahankan tanpa tambahan penanda kala.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis yang ringkas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara kesulitan topografis teks Ibrani serta ketidakpastian aspek verba tetap dinyatakan.
