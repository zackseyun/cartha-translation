  text: יֶֽהֶלְמֵֽ/נִי צַדִּ֨יק חֶ֡סֶד וְֽ/יוֹכִיחֵ֗/נִי שֶׁ֣מֶן רֹ֭אשׁ אַל יָנִ֣י רֹאשִׁ֑/י כִּי ע֥וֹד וּ֝/תְפִלָּתִ֗/י בְּ/רָעוֹתֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/005.yaml
  text: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[d][c][b]. For still my prayer is against their evils.
translation:
  language: id
  text: Biarlah orang benar memukul aku—itu suatu kebaikan[a]; biarlah ia menegur aku—itu minyak bagi kepala; janganlah kepalaku menolaknya[b]. Sebab doaku tetap menentang kejahatan mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah orang benar memukul aku dengan kasih setia,” jika חֶסֶד dipahami lebih kuat sebagai kasih setia atau belas kasihan.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani sulit; bagian ini juga dapat dipahami sebagai “janganlah kepalaku menolak minyak itu.”
    reason: lexical_alternative
  - marker: c
    text: Klausa terakhir tidak pasti. Mungkin juga berarti, “Sebab doaku masih dalam malapetaka mereka,” atau, “Bahkan ketika mereka mengalami kesusahan, doaku tetap bagi mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: יֶהֶלְמֵנִי
  choice: biarlah ... memukul aku
  rationale: Berasal dari הלם, yang menyatakan pukulan kuat. Terjemahan ini mempertahankan metafora konkret dan nuansa yusif tanpa memakai ungkapan kuno.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva maskulin tunggal yang dipakai secara substantival. Dalam bahasa Indonesia, 'orang benar' alami dan tetap mewakili satu pribadi tanpa perlu menambahkan penanda gender yang tidak wajib.
- source_word: חֶסֶד
  choice: suatu kebaikan
  rationale: Di sini חֶסֶד mencirikan pukulan korektif orang benar sebagai tindakan yang baik dan penuh kepedulian. 'Suatu kebaikan' sesuai dengan konteks antarpribadi, sementara kemungkinan nuansa kasih setia dicatat dalam catatan kaki.
- source_word: וְיוֹכִיחֵנִי
  choice: biarlah ia menegur aku
  rationale: Bentuk hifil dari יכח menyatakan teguran atau koreksi. 'Menegur' mempertahankan ketegasan moralnya dan terdengar alami.
- source_word: שֶׁמֶן רֹאשׁ
  choice: minyak bagi kepala
  rationale: Frasa konstruksi ini dipertahankan sebagai gambaran sesuatu yang menyegarkan, menyambut, atau menghormati, tanpa mempersempitnya menjadi pengurapan resmi.
- source_word: אַל יָנִי רֹאשִׁי
  choice: janganlah kepalaku menolaknya
  rationale: Kata kerjanya sulit, tetapi konteks mendukung pengertian bahwa pemazmur tidak menolak minyak kiasan berupa teguran itu. Subjek metaforis 'kepalaku' dipertahankan.
- source_word: כִּי עוֹד
  choice: sebab ... tetap
  rationale: Mengungkapkan alasan sekaligus kelanjutan sikap pemazmur secara wajar dalam bahasa Indonesia.
- source_word: וּתְפִלָּתִי
  choice: doaku
  rationale: Nomina dengan sufiks orang pertama tunggal diterjemahkan langsung; waw diserap secara alami dalam susunan klausa.
- source_word: בְּרָעוֹתֵיהֶם
  choice: menentang kejahatan-kejahatan mereka
  rationale: Preposisi בְּ dan hubungan sintaksis klausa ini tidak pasti. Pilihan ini memahami doa pemazmur sebagai diarahkan melawan perbuatan jahat mereka dan cocok dengan konteks, sedangkan pembacaan lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Identitas gramatikal צַדִּיק
  choice: orang benar
  alternative: seorang laki-laki yang benar; orang yang benar itu
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal secara substantival. 'Orang benar' mempertahankan ketunggalan referen secara idiomatis tanpa menjadikan gender biologis lebih eksplisit daripada yang diperlukan dalam bahasa Indonesia.
- issue: Penafsiran klausa terakhir yang sulit
  choice: Sebab doaku tetap menentang kejahatan-kejahatan mereka
  alternative: Sebab doaku tetap ada dalam malapetaka mereka; bahkan ketika mereka mengalami kesusahan, doaku tetap bagi mereka
  rationale: Teks Ibrani memungkinkan beberapa analisis atas בְּ dan sufiks jamak. Bacaan utama paling sesuai dengan pertentangan kontekstual antara teguran orang benar dan kejahatan orang fasik, sementara ketidakpastiannya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme antara pukulan, teguran, dan minyak dipertahankan; susunan yang tidak pasti tidak dibuat seolah-olah sepenuhnya jelas.
