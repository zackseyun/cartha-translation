  yaml_path: translation/ot/psalms/141/008.yaml
  text: For my eyes are toward you[a], O Yahweh, my Lord; in you I take refuge[b]; do not pour out my life.
translation:
  language: id
  text: Sebab mataku tertuju kepada-Mu, ya Yahweh, Tuhanku; pada-Mu aku berlindung. Janganlah mencurahkan[b] nyawaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwaku” atau “diriku.” Kata Ibrani nefesh dapat berarti nyawa, diri, atau jiwa, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Verba Ibrani ini juga dapat berarti “mengosongkan” atau “menyingkapkan.” Dalam konteks ini, permohonan tersebut dapat dipahami sebagai “jangan biarkan aku tanpa perlindungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan dasar bagi permohonan dalam konteks sebelumnya; “sebab” mempertahankan hubungan logis itu secara alami.
- source_word: אֵלֶיךָ ... עֵינַי
  choice: mataku tertuju kepada-Mu
  rationale: Ungkapan Ibrani secara harfiah mengarahkan mata kepada Allah dan menyatakan perhatian, pengharapan, serta ketergantungan. “Tertuju kepada-Mu” alami dalam bahasa Indonesia tanpa menghilangkan metaforanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, sesuai bukti bahasa sumber dan untuk membedakannya dari gelar אֲדֹנָי yang langsung menyusul.
- source_word: אֲדֹנָי
  choice: Tuhanku
  rationale: Terjemahan ini mempertahankan gelar ketuhanan sekaligus unsur orang pertama tunggal, “-ku,” dalam sapaan tersebut.
- source_word: בְּךָ חָסִיתִי
  choice: kepada-Mu aku berlindung
  rationale: Preposisi bersama verba חסה menyatakan bahwa Yahweh adalah tempat perlindungan. Bentuk perfektif di sini mengungkapkan sikap percaya yang sedang berlaku dalam doa.
- source_word: אַל תְּעַר
  choice: Janganlah mencurahkan
  rationale: Partikel larangan dan bentuk verba dipertahankan sebagai permohonan langsung. “Mencurahkan” menjaga gambaran dasar verba ערה, sementara kemungkinan arti ‘menelanjangi’ atau ‘membiarkan tanpa perlindungan’ dicatat dalam catatan kaki.
- source_word: נַפְשִׁי
  choice: nyawaku
  rationale: Dalam konteks ancaman dan permohonan agar dipelihara, נֶפֶשׁ menunjuk pada hidup atau diri si pemazmur. “Nyawaku” lebih tepat daripada membatasinya pada jiwa yang tidak berwujud.
theological_decisions:
- issue: Sapaan ilahi יְהוָה אֲדֹנָי
  choice: ya Yahweh, Tuhanku
  alternative: ya TUHAN, Tuhanku; ya Tuhan ALLAH
  rationale: Teks memuat nama perjanjian dan gelar dengan unsur kepunyaan orang pertama. Menerjemahkan keduanya secara berbeda mempertahankan sapaan berlapis itu tanpa melebur nama dan gelar.
- issue: Makna נֶפֶשׁ dalam permohonan pembebasan
  choice: nyawaku
  alternative: jiwaku; diriku
  rationale: Konteks menunjuk pada kehidupan atau pribadi pemazmur yang terancam. Pilihan ini menghindari memasukkan konsep antropologis yang lebih sempit, sedangkan keluasan istilah Ibrani tetap dijelaskan dalam catatan kaki.
- issue: Makna permohonan אַל תְּעַר נַפְשִׁי
  choice: Janganlah mencurahkan nyawaku
  alternative: Janganlah menelanjangi diriku; janganlah membiarkan aku tanpa perlindungan
  rationale: Terjemahan utama mempertahankan citra konkret verba Ibrani dan ketegangan ungkapannya. Tafsiran yang menekankan keadaan terbuka atau tanpa perlindungan tidak dimasukkan diam-diam, tetapi disajikan sebagai kemungkinan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi dipakai dalam sapaan langsung. Struktur puitis dibuat ringkas dengan paralelisme “kepada-Mu,” sementara metafora mata, perlindungan, dan pencurahan dipertahankan.
