  text: תִּכּ֤וֹן תְּפִלָּתִ֣/י קְטֹ֣רֶת לְ/פָנֶ֑י/ךָ מַֽשְׂאַ֥ת כַּ֝פַּ֗/י מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/002.yaml
  text: May my prayer be established before you as incense[b][a], the lifting up of my hands as the evening offering.
translation:
  language: id
  text: Kiranya doaku tertata di hadapan-Mu seperti dupa[a], dan pengangkatan tanganku seperti persembahan petang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipersiapkan” atau “diteguhkan” di hadapan-Mu; kata Ibraninya memohon agar doa ditempatkan dengan teguh di hadirat Allah.
    reason: lexical_alternative
  - marker: b
    text: “Persembahan petang” mengacu pada persembahan rutin yang dipersembahkan pada petang hari; istilah Ibraninya dapat secara lebih khusus menunjuk pada persembahan sajian.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  choice: Kiranya ... tertata
  rationale: Bentuk Nifal menyatakan harapan agar doa ditempatkan atau dipersiapkan dengan teguh di hadapan Allah. “Tertata” mempertahankan cakupan makna itu tanpa mempersempitnya menjadi “diterima”.
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: Padanan langsung nomina dengan sufiks orang pertama tunggal.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Istilah baku dan alami untuk bahan harum yang dibakar sebagai persembahan; mempertahankan citra ibadah dalam teks.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Padanan Indonesia yang wajar dan bermartabat untuk ungkapan relasional-spasial yang berarti berada dalam hadirat Allah.
- source_word: מַשְׂאַת כַּפַּי
  choice: tanganku yang terangkat
  rationale: Mengungkapkan tindakan mengangkat tangan dalam doa secara alami, sambil mempertahankan citra gerak tubuh dari bahasa Ibrani.
- source_word: מִנְחַת עָרֶב
  choice: persembahan petang
  rationale: Mempertahankan acuan ritual dan waktu pemberian persembahan tanpa menjadikan makna teknis “persembahan sajian” terlalu pasti dalam teks utama.
theological_decisions:
- issue: Citra ibadah kurban diterapkan pada doa
  choice: Doa dan tangan yang terangkat dibandingkan dengan dupa dan persembahan petang.
  alternative: Doa dinyatakan menggantikan kurban atau sepenuhnya setara secara doktrinal dengan kurban.
  rationale: Bahasa Ibrani menyandingkan unsur-unsur ini secara puitis dan liturgis. Terjemahan mempertahankan daya teologis citra tersebut tanpa menambahkan ajaran tentang penggantian kurban yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapital pada sufiks “-Mu” mengikuti kebiasaan penulisan rujukan kepada Allah. Susunan paralel dipertahankan, sedangkan “tanganku yang terangkat” dipilih agar lebih alami daripada nominalisasi harfiah “pengangkatan tanganku”.
