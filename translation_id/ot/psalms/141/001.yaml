  yaml_path: translation/ot/psalms/141/001.yaml
  text: A psalm of David. O Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: id
  text: 'Mazmur Daud.


    Ya Yahweh[a], aku berseru kepada-Mu; datanglah segera kepadaku. Dengarkanlah suaraku ketika aku berseru kepada-Mu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, yang secara tradisional diterjemahkan “TUHAN”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku dan tepat untuk judul jenis nyanyian ini.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam frasa judul 'Mazmur Daud', bentuk ini mempertahankan kaitan dengan Daud tanpa menegaskan secara berlebihan apakah ia penulis, pemilik, atau penerima persembahan mazmur.
- source_word: יְהוָה
  choice: TUHAN[a]
  rationale: Mengikuti kebiasaan luas Alkitab Indonesia untuk mewakili Tetragramaton dengan TUHAN, sementara catatan kaki menyatakan nama Ibraninya dan alternatif transliterasinya.
- source_word: קְרָאתִיךָ
  choice: aku berseru kepada-Mu
  rationale: Dalam konteks doa mendesak, 'berseru' menyampaikan tindakan memanggil Allah dengan kuat dan alami; bentuk perfektif Ibrani tidak dipaksakan menjadi lampau dalam konteks ini.
- source_word: חוּשָׁה לִּי
  choice: datanglah segera kepadaku
  rationale: Ungkapan ini meminta tindakan cepat yang tertuju kepada pemazmur; 'datanglah segera' alami dalam doa Indonesia dan menyampaikan urgensinya.
- source_word: הַאֲזִינָה
  choice: Dengarkanlah
  rationale: Menyampaikan permohonan agar Allah mendengar dengan penuh perhatian, dalam bahasa Indonesia yang alami dan tetap khidmat.
- source_word: קוֹלִי
  choice: suaraku
  rationale: Padanan langsung yang mempertahankan gambaran suara pemazmur, tanpa menafsirkannya secara lebih sempit sebagai keluhan atau jeritan.
- source_word: בְּקָרְאִי לָךְ
  choice: ketika aku berseru kepada-Mu
  rationale: Awalan ב pada infinitif konstruk wajar dipahami secara temporal; susunan ini jelas dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: TUHAN[a]
  alternative: Yahweh
  rationale: Teks utama memakai bentuk tradisional yang luas dikenal pembaca Alkitab Indonesia, sedangkan catatan kaki secara terbuka menunjukkan bahwa teks Ibrani memuat YHWH dan bahwa 'Yahweh' merupakan alternatif transliterasi, sehingga nama sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme 'aku berseru' dipertahankan, sementara 'datanglah segera' dipilih agar permohonan yang mendesak terdengar alami.
