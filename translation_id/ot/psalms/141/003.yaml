id: PSA.141.3
reference: Psalms 141:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁיתָ֣/ה יְ֭הוָה שָׁמְרָ֣ה לְ/פִ֑/י נִ֝צְּרָ֗/ה עַל דַּ֥ל שְׂפָתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/003.yaml
  text: Set a guard[a], O Yahweh, over my mouth; keep watch over the door of my lips.
translation:
  language: id
  text: Tempatkanlah penjaga pada mulutku, ya Yahweh; awasilah pintu bibirku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jagalah bukaan atau gerbang bibirku.” Kata Ibrani di sini secara harfiah menggambarkan “pintu” bibir.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתָה
  choice: Tempatkanlah
  rationale: Bentuk permohonan dari שׁית meminta Yahweh menempatkan atau menetapkan sesuatu; “tempatkanlah” alami dalam bahasa Indonesia dan cocok dengan objek konkret “penjaga”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dinyatakan sebagai nama diri, bukan diganti dengan gelar, sehingga bentuk “Yahweh” dipertahankan.
- source_word: שָׁמְרָה
  choice: penjaga
  rationale: Nomina dari akar שמר menunjuk pada penjagaan atau sosok penjaga. “Penjaga” mempertahankan gambaran konkret tentang pengendalian ucapan.
- source_word: לְפִי
  choice: pada mulutku
  rationale: Preposisi לְ menyatakan lokasi atau kaitan penempatan penjaga dengan mulut; “pada mulutku” ringkas dan wajar.
- source_word: נִצְּרָה
  choice: awasilah
  rationale: Imperatif dari נצר meminta tindakan menjaga atau mengawasi. “Awasilah” mempertahankan kesejajaran makna dengan baris pertama tanpa pengulangan kaku.
- source_word: עַל
  choice: atas
  rationale: Dalam gabungan verba “awasilah,” עַל menandai hal yang diawasi; dalam bahasa Indonesia maknanya tersampaikan secara alami tanpa harus dinyatakan sebagai preposisi terpisah.
- source_word: דַּל שְׂפָתָי
  choice: pintu bibirku
  rationale: דַּל paling mungkin berarti pintu atau daun pintu. Terjemahan ini mempertahankan metafora Ibrani tentang bibir sebagai pintu yang mengatur keluarnya perkataan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Metafora pengendalian ucapan
  choice: Mempertahankan gambaran penjaga dan pintu bibir
  alternative: Parafrasa seperti “jagalah agar aku tidak salah bicara”
  rationale: Bahasa sumber menyampaikan doa melalui dua gambaran konkret. Mempertahankannya menjaga daya puitis serta tidak mempersempit maksud ayat pada satu jenis kesalahan bicara.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Partikel “-lah” menandai permohonan dengan sopan. Metafora Ibrani dipertahankan, sementara susunan kalimat dibuat alami dalam bahasa Indonesia.
