base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/009.yaml
  text: Keep me from the hands of the trap they have set for me[b][a], and from the snares of the workers of wickedness.
translation:
  language: id
  text: Jagalah aku dari cengkeraman perangkap yang mereka pasang bagiku,[a] dan dari jerat para pelaku kejahatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari tangan perangkap yang mereka pasang bagiku.” Dalam bahasa Ibrani, “tangan” dapat menyatakan kuasa atau cengkeraman.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Jagalah aku
  rationale: Bentuk permohonan imperatif dari שׁמר. “Jagalah aku” alami dalam doa dan mempertahankan arti menjaga atau melindungi.
- source_word: מִידֵי
  choice: dari cengkeraman
  rationale: Secara harfiah berarti “dari tangan,” tetapi bersama benda mati פח ungkapan ini menyatakan kuasa atau daya tangkap. “Cengkeraman” mempertahankan citra konkret dan menghasilkan bahasa Indonesia yang wajar.
- source_word: פַח
  choice: perangkap
  rationale: פח menunjuk pada perangkap atau jerat. “Perangkap” dipilih untuk membedakannya dari מֹקְשׁוֹת pada baris berikutnya.
- source_word: יָקְשׁוּ לִי
  choice: yang telah mereka pasang bagiku
  rationale: Kata kerja יקשׁ berkaitan dengan memasang perangkap atau jerat. Bentuk jamak pelakunya dipertahankan secara eksplisit melalui “mereka.”
- source_word: וּמֹקְשׁוֹת
  choice: dan dari jerat
  rationale: Bentuk jamak dari מוֹקֵשׁ. Preposisi “dari” diulang dalam bahasa Indonesia demi kejelasan paralelisme.
- source_word: פֹּעֲלֵי אָוֶן
  choice: para pelaku kejahatan
  rationale: Secara harfiah, “orang-orang yang melakukan kejahatan.” Pilihan ini mempertahankan unsur tindakan dalam פֹּעֲלֵי dan daya moral אָוֶן, sekaligus terdengar alami.
