  text: יִפְּל֣וּ בְ/מַכְמֹרָ֣י/ו רְשָׁעִ֑ים יַ֥חַד אָ֝נֹכִ֗י עַֽד אֶעֱבֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/010.yaml
  text: Let the wicked fall into their own nets together[c][b][a], while I pass by.
translation:
  language: id
  text: Biarlah orang-orang fasik jatuh bersama-sama ke dalam jala-jala mereka sendiri,[a] sementara aku berlalu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam jala-jalanya”; sufiks Ibrani berbentuk tunggal, tetapi dalam konteks ini dapat dipahami secara kolektif sebagai jala-jala orang fasik sendiri.
    reason: alternative_reading
  - marker: b
    text: Atau, lebih harfiah, “sampai aku berlalu” atau “sampai aku lewat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְּלוּ
  choice: Biarlah ... jatuh
  rationale: Bentuk imperfek Qal orang ketiga jamak dapat bernuansa jusif dalam konteks doa; “Biarlah” menyampaikan permohonan atau harapan pemazmur.
- source_word: בְמַכְמֹרָיו
  choice: ke dalam jala-jala mereka sendiri
  rationale: מַכְמֹר berarti jala atau perangkap, dan prefiks בְּ dengan verba “jatuh” wajar diterjemahkan “ke dalam”. Bentuk nomina ini jamak dengan sufiks orang ketiga maskulin tunggal (“jala-jalanya”); terjemahan utama memakai ungkapan refleksif kolektif yang sesuai dengan subjek jamak, sementara bentuk harfiahnya dicatat.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Substantiva jamak ini menunjuk kepada orang yang jahat secara moral. “Orang-orang fasik” merupakan padanan Indonesia yang ringkas, lazim, dan tidak membatasi gender.
- source_word: יַחַד
  choice: bersama-sama
  rationale: Adverbia ini menyatakan kebersamaan atau keserentakan; “bersama-sama” mempertahankan kedua kemungkinan nuansa tersebut.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina mandiri memberi penekanan pada pemazmur dan secara alami dinyatakan dengan “aku” dalam puisi orang pertama.
- source_word: עַד אֶעֱבוֹר
  choice: sementara aku berlalu
  rationale: Secara harfiah עַד lazim berarti “sampai”, sedangkan עבר berarti melewati atau berlalu. Dalam baris puitis yang padat ini, “sementara” menyatakan rentang waktu yang berlawanan dengan jatuhnya orang fasik; alternatif yang lebih harfiah dicatat tanpa menambahkan gagasan “dengan selamat” yang tidak dinyatakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan “jatuh bersama-sama” dibuat alami tanpa menghilangkan nuansa keserentakan. “Berlalu” dipilih untuk mempertahankan keluasan makna עבר dan tidak memperjelas secara berlebihan bahwa pemazmur lolos dengan selamat.
