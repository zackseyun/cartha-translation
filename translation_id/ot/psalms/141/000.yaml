  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֣ה קְ֭רָאתִי/ךָ ח֣וּשָׁ/ה לִּ֑/י הַאֲזִ֥ינָ/ה ק֝וֹלִ֗/י בְּ/קָרְאִ/י לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/000.yaml
  text: A psalm of David. Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: id
  text: Mazmur Daud. TUHAN[a], aku berseru kepada-Mu; segeralah datang kepadaku. Dengarkanlah suaraku ketika aku berseru kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”; dapat juga ditulis “Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Mazmur Daud
  rationale: Ungkapan judul Ibrani ini secara alami menyatakan keterkaitan mazmur dengan Daud; bentuk ringkas mempertahankan ambiguitas preposisi לְ tanpa memperinci apakah artinya karya, milik, untuk, atau mengenai Daud.
- source_word: יְהוָה
  choice: TUHAN[a]
  rationale: Memakai padanan tradisional Indonesia dengan huruf kapital untuk nama ilahi YHWH, sambil mencantumkan bentuk nama Ibraninya dalam catatan kaki.
- source_word: קְרָאתִיךָ
  choice: aku berseru kepada-Mu
  rationale: Kata kerja קרא dalam konteks doa berarti memanggil atau berseru; 'berseru' mengungkapkan permohonan yang mendesak.
- source_word: חוּשָׁה לִּי
  choice: segeralah datang kepadaku
  rationale: Imperatif חושׁ meminta tindakan segera, sedangkan לִי menyatakan arah atau kepentingan pemazmur; penambahan 'datang' membuat ungkapan eliptis Ibrani wajar dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: הַאֲזִינָה קוֹלִי
  choice: Dengarkanlah suaraku
  rationale: האֲזין menyatakan memberi perhatian dengan telinga atau mendengarkan sungguh-sungguh; bentuk ini alami dan tetap dekat dengan citra sumber.
- source_word: בְּקָרְאִי לָךְ
  choice: ketika aku berseru kepada-Mu
  rationale: Preposisi בְּ dengan infinitif berkonstruksi menyatakan waktu atau keadaan; 'ketika' menghasilkan bahasa Indonesia yang jelas dan alami.
theological_decisions:
- issue: Penyajian nama ilahi YHWH
  choice: TUHAN dengan catatan kaki YHWH/Yahweh
  alternative: Yahweh dalam teks utama
  rationale: Pilihan ini mengikuti kebiasaan luas Alkitab bahasa Indonesia dan menjaga keterbacaan liturgis, tetapi catatan kaki mempertahankan informasi bahwa teks Ibrani memakai nama diri ilahi, bukan sekadar gelar.
- issue: Hubungan Daud dengan mazmur
  choice: Mazmur Daud
  alternative: Mazmur karya Daud / Mazmur untuk Daud
  rationale: Konstruksi לְדָוִד dapat menandai kepengarangan, kepemilikan, dedikasi, atau keterkaitan. Rumusan tradisional yang ringkas tidak menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Pronomina yang merujuk kepada Allah dikapitalisasi sesuai kebiasaan umum penerbitan Alkitab Indonesia. Judul dan isi ayat disajikan sebagai satu unit mengikuti data sumber.
