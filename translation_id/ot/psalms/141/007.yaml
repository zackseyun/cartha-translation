  text: כְּמ֤וֹ פֹלֵ֣חַ וּ/בֹקֵ֣עַ בָּ/אָ֑רֶץ נִפְזְר֥וּ עֲ֝צָמֵ֗י/נוּ לְ/פִ֣י שְׁאֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/007.yaml
  text: As one plows and breaks up the earth[b][a], our bones have been scattered at the mouth of Sheol.
translation:
  language: id
  text: Seperti orang yang membajak dan membelah tanah[a], tulang-tulang kami telah terserak di mulut Syeol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seperti orang yang membelah dan memecah tanah.” Kedua bentuk partisip Ibrani menggambarkan tindakan itu dengan hidup dan dapat diterjemahkan dengan beberapa kata kerja pertanian yang sedikit berbeda.
    reason: lexical_alternative
  - marker: b
    text: Syeol adalah istilah Ibrani bagi dunia orang mati; secara tradisional juga diterjemahkan “kubur”, dan dalam beberapa konteks secara kurang tepat “neraka”.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: Seperti
  rationale: Memperkenalkan perbandingan secara alami dalam bahasa Indonesia dan mempertahankan bentuk kiasan Ibrani.
- source_word: פֹלֵחַ
  choice: membajak
  rationale: Dalam kesejajaran dengan tindakan membelah tanah, kata ini menggambarkan pengerjaan tanah; “membajak” menyampaikan gambaran pertanian dengan jelas.
- source_word: וּבֹקֵעַ
  choice: dan membelah
  rationale: Mempertahankan gambaran tanah yang dibuka atau dipecahkan, sekaligus mencerminkan kesejajaran kedua partisip Ibrani.
- source_word: בָּאָרֶץ
  choice: tanah
  rationale: Dalam konteks pengerjaan tanah, “tanah” lebih alami dan tepat daripada “bumi” atau “negeri”.
- source_word: נִפְזְרוּ
  choice: telah terserak
  rationale: Bentuk Nifal menyatakan keadaan pasif atau resultatif; “telah terserak” mempertahankan hasil tindakan itu dan memberi kesan yang kuat.
- source_word: עֲצָמֵינוּ
  choice: tulang-tulang kami
  rationale: Terjemahan langsung yang mempertahankan gambaran kematian yang keras tanpa memperhalusnya.
- source_word: לְפִי
  choice: di mulut
  rationale: Mempertahankan ungkapan konkret Ibrani dan personifikasi Syeol sebagai ranah yang seakan-akan menelan.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi Indonesia mempertahankan konsep Ibrani tentang ranah orang mati tanpa menyamakannya begitu saja dengan kubur atau konsep teologis “neraka” yang lebih kemudian.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syeol
  alternative: kubur; dunia orang mati; neraka
  rationale: “Syeol” menjaga latar konseptual Israel kuno dan tidak memasukkan pengertian doktrinal tentang neraka yang tidak dituntut oleh teks. Catatan kaki memberi penjelasan yang mudah dipahami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan perbandingan dipertahankan, sedangkan kata kerja dipilih agar gambaran pertanian mudah dipahami. Bentuk “Syeol” digunakan sebagai transliterasi yang lazim dibaca dalam bahasa Indonesia.
