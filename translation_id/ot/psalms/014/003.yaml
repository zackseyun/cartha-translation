  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
translation:
  language: id
  text: Semua telah menyimpang; bersama-sama mereka telah menjadi cemar[a]. Tidak ada yang berbuat baik, tidak seorang pun.
  philosophy: optimal-equivalence
  footnotes:
