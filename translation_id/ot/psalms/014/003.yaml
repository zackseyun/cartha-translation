    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Semua
  rationale: Bentuk dengan kata sandang menyatakan keseluruhan. Dalam konteks ini, “Semua” secara ringkas mempertahankan cakupan menyeluruh terhadap manusia.
- source_word: סָר
  choice: telah menyimpang
  rationale: Kata kerja סור berarti berbelok, menyimpang, atau meninggalkan arah. Bentuk tunggalnya mengikuti subjek kolektif, sehingga dalam bahasa Indonesia wajar diterjemahkan tanpa menandai jumlah pada verba.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Keterangan ini menegaskan tindakan kolektif dan mempertahankan nuansa bahwa semuanya berada dalam keadaan yang sama.
- source_word: נֶאֱלָחוּ
  choice: telah menjadi rusak
  rationale: Bentuk Nifal menyampaikan perubahan menuju keadaan busuk, cemar, atau rusak. “Telah menjadi rusak” mempertahankan aspek resultatif tanpa mempersempitnya menjadi kekotoran jasmani.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Tidak ada yang berbuat baik
  rationale: Partikel ketiadaan diikuti partisip menyatakan bahwa tidak seorang pun bercirikan tindakan berbuat baik. Ungkapan ini alami dan dekat dengan susunan Ibrani.
- source_word: אֵין גַּם אֶחָד
  choice: seorang pun tidak
  rationale: Gabungan negasi dan גַּם אֶחָד memperkuat penyangkalan. “Seorang pun tidak” menyampaikan penegasan itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan pernyataan menyeluruh tentang kerusakan manusia
  choice: 'Dipertahankan sebagai dakwaan universal: “Semua,” “Tidak ada,” dan “seorang pun tidak.”'
  alternative: Melunakkannya menjadi gambaran umum tentang banyak orang.
  rationale: Bahasa Ibrani memakai ungkapan komprehensif dan penyangkalan yang berulang. Terjemahan mempertahankan daya retoris dan teologis itu tanpa memasukkan rumusan doktrinal di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Paralelisme serta pengulangan negasi dalam puisi Ibrani dipertahankan. Tidak diperlukan catatan kaki karena “menjadi rusak” mewakili rentang makna utama נֶאֱלָחוּ dengan cukup jelas.
