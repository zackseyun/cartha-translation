  text: הֲ/לֹ֥א יָדְעוּ֮ כָּל פֹּ֪עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם יְ֝הוָ֗ה לֹ֣א קָרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: id
  text: Tidakkah semua pelaku kejahatan tahu—mereka yang melahap umat-Ku seperti makan roti[a] dan tidak berseru kepada Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “memakan umat-Ku; mereka makan roti”—sebuah ungkapan yang membandingkan perlakuan mereka terhadap umat Allah dengan makan roti sebagai hal yang biasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Tidakkah ...?
  rationale: Menyampaikan pertanyaan retoris yang mengharapkan jawaban ya secara alami dalam bahasa Indonesia.
- source_word: יָדְעוּ
  choice: tahu
  rationale: Mempertahankan arti umum verba ידע, yakni mengetahui atau menyadari, tanpa mempersempitnya menjadi sekadar pemahaman intelektual.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: semua pelaku kejahatan
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern serta mempertahankan cakupan כָּל dan bobot moral אָוֶן.
- source_word: אֹכְלֵי עַמִּי
  choice: mereka yang melahap umat-Ku
  rationale: Klausa relatif mewakili bentuk partisipel Ibrani, sedangkan 'melahap' mempertahankan metafora pemangsaan dengan lebih alami daripada terjemahan harfiah 'memakan'.
- source_word: אָכְלוּ לֶחֶם
  choice: seperti makan roti
  rationale: Kata 'seperti' membuat perbandingan idiomatis yang tersirat dalam penjajaran bahasa Ibrani menjadi jelas, tanpa mengubah gambaran dasarnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar umum seperti 'Tuhan'.
- source_word: לֹא קָרָאוּ
  choice: tidak berseru kepada
  rationale: Dalam hubungan dengan nama ilahi, קרא dapat menunjuk pada memanggil atau berseru kepada Allah dalam doa dan ibadah; pilihan ini alami dan tetap cukup luas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan rujukan nama perjanjian tanpa menggantinya dengan sebuah gelar.
- issue: Identitas pembicara dalam עַמִּי
  choice: umat-Ku
  alternative: umatku
  rationale: Pronomina orang pertama dipertahankan sebagaimana teks sumber. Huruf kapital menandai bahwa pembicaranya adalah Allah menurut konteks mazmur, tanpa menambahkan nama-Nya ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Tanda pisah mempertahankan struktur pertanyaan retoris dan menghubungkan sebutan umum 'pelaku kejahatan' dengan gambaran partisipial berikutnya. Metafora makan dipertahankan, sedangkan perbandingannya dibuat alami dalam bahasa sasaran.
