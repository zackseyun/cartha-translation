  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: id
  text: 'Untuk pemimpin musik.[a] Milik Daud.[b]


    Orang bebal berkata dalam hatinya,


    “Tidak ada Allah.”


    Mereka telah menjadi bejat; mereka melakukan perbuatan keji.[c]


    Tidak seorang pun berbuat baik.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Untuk pemimpin paduan suara” atau “Untuk pemimpin biduan.”
    reason: lexical_alternative
  - marker: b
    text: Dalam judul mazmur, ungkapan ini juga dapat berarti “oleh Daud,” “untuk Daud,” atau “berkaitan dengan Daud.”
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani beralih dari bentuk tunggal (“orang bebal”) ke bentuk jamak (“mereka”), dari seorang tokoh yang mewakili kepada golongan yang diwakilinya.
    reason: textual_feature
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Menunjuk kepada orang yang memimpin pelaksanaan musik atau nyanyian. Ungkapan ini alami dalam bahasa Indonesia sambil mempertahankan fungsi judul Ibrani.
- source_word: לְדָוִד
  choice: Mazmur Daud
  rationale: Dalam konteks judul mazmur, frasa ringkas ini paling wajar dipahami sebagai penanda hubungan mazmur dengan Daud; catatan kaki mempertahankan kemungkinan nuansa kepengarangan, peruntukan, atau keterkaitan.
- source_word: נָבָל
  choice: orang bebal
  rationale: Istilah ini bukan sekadar menyatakan kurang cerdas, melainkan kebodohan moral dan rohani; 'bebal' mempertahankan bobot tersebut.
- source_word: בְּלִבּוֹ
  choice: dalam hatinya
  rationale: Mempertahankan gambaran Ibrani tentang pusat pikiran, kehendak, dan batin seseorang.
- source_word: אֵין אֱלֹהִים
  choice: Tidak ada Allah
  rationale: Menerjemahkan pernyataan eksistensial secara langsung tanpa menambahkan penjelasan teologis.
- source_word: הִשְׁחִיתוּ
  choice: Mereka telah bobrok
  rationale: Bentuk jamak menggambarkan keadaan moral yang rusak; 'bobrok' alami dan kuat dalam bahasa Indonesia.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: perbuatan mereka menjijikkan
  rationale: Mengungkapkan bahwa tindakan mereka telah menjadi keji atau menjijikkan, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Tidak seorang pun berbuat baik
  rationale: Menyampaikan penyangkalan menyeluruh dari teks Ibrani secara ringkas dan idiomatis.
theological_decisions:
- issue: Makna pernyataan 'Tidak ada Allah'
  choice: Mempertahankan pernyataan langsung tanpa menjelaskan apakah ini penyangkalan lisan, keyakinan batin, atau sikap hidup praktis.
  alternative: Menafsirkan sebagai 'Allah tidak akan bertindak' atau 'bagiku tidak ada Allah'.
  rationale: Teks Ibrani secara harfiah dan ambigu menyatakan 'tidak ada Allah'; terjemahan tidak boleh mempersempitnya secara teologis.
- issue: Peralihan dari tunggal ke jamak
  choice: Mempertahankan 'orang bebal' dalam bentuk tunggal lalu 'mereka' dalam bentuk jamak.
  alternative: Menyeragamkan seluruh bagian menjadi tunggal atau jamak.
  rationale: Peralihan gramatikal ini terdapat dalam sumber dan memperluas gambaran dari sosok representatif kepada golongan yang diwakilinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Larik puitis dipertahankan agar mudah dibaca sebagai mazmur. 'Orang bebal' dipilih karena membawa makna moral, sedangkan 'bobrok' dan 'menjijikkan' menyampaikan kerasnya penilaian teks tanpa istilah teknis atau denominasi.
