  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: id
  text: Kalian mempermalukan nasihat orang miskin[a], karena Yahweh adalah tempat perlindungannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kalian mempermalukan rencana orang miskin,” jika עֲצַת עָנִי dipahami sebagai “rencana orang miskin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: nasihat
  rationale: Bentuk konstruk dari עֵצָה dapat berarti nasihat, rencana, atau pertimbangan. “Nasihat” mempertahankan keluasan makna tanpa membatasinya hanya pada rencana batin atau anjuran lisan.
- source_word: עָנִי
  choice: orang miskin
  rationale: עָנִי dapat menunjuk kepada orang miskin, tertindas, atau sengsara. Dalam konteks sosial dan moral mazmur ini, “orang miskin” alami dan ringkas, sambil tetap menyiratkan kerentanan.
- source_word: תָבִישׁוּ
  choice: Kalian mempermalukan
  rationale: Bentuk Hifil orang kedua jamak dari בוש berarti menyebabkan malu atau mempermalukan. “Kalian” menyatakan dengan jelas bahwa sapaan Ibrani berbentuk jamak.
- source_word: כִּי
  choice: karena
  rationale: כִּי di sini paling wajar dipahami sebagai penghubung sebab, yang menjelaskan mengapa tindakan mempermalukan itu keliru atau sia-sia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: מַחְסֵהוּ
  choice: tempat perlindungannya
  rationale: מַחְסֶה dengan akhiran orang ketiga tunggal maskulin berarti tempat perlindungannya. Pilihan ini mempertahankan metafora perlindungan dan rujukan kepada orang miskin tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama ilahi dan tidak menggantinya dengan gelar.
- issue: Hubungan sebab yang dinyatakan כִּי
  choice: karena
  alternative: sebab
  rationale: Keduanya mungkin, tetapi “karena” secara alami mempertahankan ketegangan bahwa orang miskin dipermalukan justru ketika Yahweh menjadi perlindungannya, tanpa menambahkan penjelasan teologis yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kata “kalian” dipakai untuk mempertahankan orang kedua jamak yang eksplisit dalam bahasa Ibrani; “tempat perlindungan” dipilih sebagai ungkapan alami bagi metafora מַחְסֶה.
