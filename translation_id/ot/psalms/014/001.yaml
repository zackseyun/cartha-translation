  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: id
  text: 'Untuk pemimpin musik[a]. Dari Daud[b].


    Orang bebal berkata dalam hatinya, “Tidak ada Allah.” Mereka[c] telah rusak dan melakukan perbuatan keji. Tidak seorang pun berbuat baik.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Untuk pengarah musik” atau “Untuk pemimpin paduan suara.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “Dari Daud” juga dapat dipahami sebagai “oleh Daud,” “milik Daud,” atau “untuk Daud.”
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani beralih dari bentuk tunggal (“orang bebal”) kepada bentuk jamak (“mereka”), yaitu dari satu sosok perwakilan kepada golongan yang diwakilinya.
    reason: source_structure
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah pada judul mazmur ini menunjuk kepada orang yang memimpin pelaksanaan musik. Pilihan ini jelas dalam bahasa Indonesia modern tanpa mempersempitnya hanya kepada paduan suara.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Kata depan לְ pada judul mazmur dapat menyatakan kepengarangan, hubungan, kepemilikan, atau peruntukan. Teks utama dibuat ringkas, sedangkan keragaman kemungkinannya dipertahankan dalam catatan kaki.
- source_word: נָבָל
  choice: orang bebal
  rationale: Kata ini menggambarkan kebebalan moral dan rohani, bukan sekadar kurangnya kecerdasan. Bentuk tunggalnya dipertahankan sebagai sosok yang mewakili suatu golongan.
- source_word: בְּלִבּוֹ
  choice: dalam hatinya
  rationale: Dalam pemikiran Ibrani, hati mencakup pikiran, kehendak, dan batin. Terjemahan harfiah ini tetap alami dalam bahasa Indonesia.
- source_word: אֵין אֱלֹהִים
  choice: Tidak ada Allah
  rationale: Frasa ini secara langsung menyatakan penyangkalan akan keberadaan Allah. Nama 'Allah' sesuai dengan konteks monoteistis mazmur ini.
- source_word: הִשְׁחִיתוּ
  choice: mereka telah bobrok
  rationale: Kata kerja ini menyatakan kerusakan atau kebejatan yang menghasilkan keadaan moral yang rusak. 'Bobrok' menyampaikan keadaan tersebut secara kuat dan alami.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: melakukan perbuatan keji
  rationale: Gabungan ini menggambarkan tindakan atau perilaku yang menjijikkan secara moral. Pilihan ini idiomatis dan mempertahankan penilaian etis dari teks Ibrani.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Tidak seorang pun berbuat baik
  rationale: Terjemahan ini menyampaikan ketiadaan orang yang melakukan kebaikan dengan susunan bahasa Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Cakupan penyangkalan dalam אֵין אֱלֹהִים
  choice: 'Penyangkalan eksistensial: “Tidak ada Allah.”'
  alternative: 'Ateisme praktis: “Allah tidak penting” atau “Tidak ada penghakiman.”'
  rationale: Makna langsung frasa Ibrani ialah bahwa Allah tidak ada. Implikasi berupa kehidupan yang mengabaikan Allah memang hadir dalam konteks, tetapi tidak menggantikan perkataan eksplisit dalam teks.
- issue: Peralihan dari נָבָל tunggal kepada kata kerja jamak
  choice: 'Mempertahankan bentuk tunggal yang mewakili golongan, lalu beralih kepada bentuk jamak: “Orang bebal ... Mereka.”'
  alternative: Menyeragamkan semuanya menjadi tunggal atau menjamakkan kalimat pembuka.
  rationale: Peralihan tata bahasa dalam teks Ibrani bergerak dari satu sosok perwakilan kepada golongan yang diwakilinya. Mempertahankannya menjaga ketegangan dan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Orang bebal” mempertahankan bobot moral istilah Ibrani; “bobrok” mengungkapkan kerusakan moral tanpa istilah teknis. Tanda baca memisahkan judul mazmur dari isi ayat.
