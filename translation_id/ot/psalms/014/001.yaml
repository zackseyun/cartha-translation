  naturalness: Bahasa keseluruhan jelas dan baku. Frasa “Mereka telah bobrok” tidak lazim untuk subjek manusia dalam ragam Indonesia baku dan terdengar lebih cocok bagi benda, sistem, atau bangunan. “Mereka telah rusak” lebih alami dan tetap menyatakan keadaan kerusakan moral yang dimaksud.
  terminology: “Orang bebal,” “dalam hatinya,” “Allah,” “perbuatan keji,” dan “berbuat baik” merupakan pilihan yang baik. Catatan a sebaiknya tidak memakai “pemimpin pujian,” karena istilah Ibrani menunjuk fungsi kepemimpinan/pengarahan musik dan tidak secara khusus berarti pujian.
