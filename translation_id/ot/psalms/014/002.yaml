id: PSA.14.2
reference: Psalms 14:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְֽהוָ֗ה מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵי אָ֫דָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵשׁ אֶת אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/002.yaml
  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: id
  text: Yahweh memandang ke bawah dari surga kepada anak-anak manusia, untuk melihat apakah ada orang yang berakal budi, yang mencari Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: מִשָּׁמַיִם
  choice: dari surga
  rationale: Bentuk Ibrani ini secara idiomatis menunjuk pada surga sebagai tempat pandang Allah; bentuk tunggal alami dalam bahasa Indonesia.
- source_word: הִשְׁקִיף
  choice: memandang ke bawah
  rationale: Menjaga gambaran tindakan melihat dari tempat yang tinggi; kala kini sesuai dengan gaya puitis ayat.
- source_word: בְּנֵי אָדָם
  choice: anak-anak manusia
  rationale: Mempertahankan ungkapan representatif Ibrani yang secara kolektif berarti umat manusia.
- source_word: לִרְאוֹת הֲיֵשׁ
  choice: untuk melihat apakah ada
  rationale: Menyampaikan infinitif tujuan dan pertanyaan tak langsung secara wajar.
- source_word: מַשְׂכִּיל
  choice: orang yang berakal budi
  rationale: Mengungkapkan pengertian atau wawasan tanpa mempersempitnya menjadi kecerdasan intelektual semata.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: yang mencari Allah
  rationale: Menerjemahkan partisip aktif sebagai ciri orang yang dicari Yahweh.
theological_decisions:
- issue: Cakupan בְּנֵי אָדָם
  choice: anak-anak manusia
  alternative: umat manusia
  rationale: Bentuk ungkapan Ibrani dipertahankan karena dapat dipahami dalam bahasa Indonesia dan tetap memiliki arti kolektif, tanpa menghilangkan citra sumber.
- issue: Hubungan מַשְׂכִּיל dan דֹּרֵשׁ
  choice: Dipahami sebagai dua gambaran sejajar tentang orang yang dicari
  alternative: Dipahami sebagai dua orang atau kelompok yang berbeda
  rationale: Konstruksi puitis paling alami menggambarkan sosok yang berakal budi sebagai orang yang mencari Allah, tetapi terjemahan tidak menambahkan penjelasan kausal atau doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan puitis dipertahankan, dengan kosakata yang mudah dipahami pembaca umum.
