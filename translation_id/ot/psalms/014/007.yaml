base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: id
  text: Kiranya keselamatan Israel datang dari Sion! Ketika Yahweh memulihkan keadaan umat-Nya[a], Yakub akan bersorak-sorai; Israel akan bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “mengembalikan penawanan umat-Nya.” Ungkapan Ibrani ini sering berarti memulihkan keadaan suatu umat atau membalikkan kemalangan mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Kiranya
  rationale: Ungkapan idiomatis ini menyatakan harapan atau kerinduan, bukan pertanyaan harfiah. “Kiranya” menyampaikan nuansa optatif secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: מִצִּיּוֹן
  choice: dari Sion
  rationale: Preposisi מִן menunjukkan sumber atau asal; nama tempat צִיּוֹן ditransliterasikan menurut bentuk baku Indonesia.
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: keselamatan Israel
  rationale: Rangkaian konstruksi ini berarti “keselamatan Israel.” Kata “keselamatan” mempertahankan keluasan makna יְשׁוּעָה, yang mencakup pembebasan dan pertolongan.
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: Ketika Yahweh memulihkan keadaan umat-Nya
  rationale: Gabungan שׁוּב שְׁבוּת lazim berfungsi sebagai idiom untuk membalikkan kemalangan atau memulihkan keadaan suatu umat, bukan semata-mata memulangkan tawanan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: יָגֵל יַעֲקֹב
  choice: Yakub akan bersorak-sorai
  rationale: גיל menyatakan kegembiraan yang meluap. “Bersorak-sorai” menangkap kekuatannya dan membedakannya dari kata sukacita pada baris sejajar.
- source_word: יִשְׂמַח יִשְׂרָאֵל
  choice: Israel akan bersukacita
  rationale: שׂמח menyatakan kegembiraan atau sukacita; pilihan ini alami dalam puisi Indonesia dan mempertahankan kesejajaran dengan klausa sebelumnya.
theological_decisions:
- issue: Makna idiom שׁוּב שְׁבוּת
  choice: memulihkan keadaan umat-Nya
  alternative: membawa kembali tawanan umat-Nya
  rationale: Konteks mazmur tidak secara tegas menunjuk pada suatu pembuangan historis. Karena idiom Ibrani ini dapat berarti pemulihan keadaan atau pembalikan nasib secara umum, makna yang lebih luas ditempatkan dalam teks utama, sedangkan kemungkinan yang lebih harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang jelas dan bermartabat. “Kiranya” mempertahankan seruan kerinduan; dua kata kegembiraan dibedakan sebagai “bersorak-sorai” dan “bersukacita” untuk mencerminkan paralelisme Ibrani.
