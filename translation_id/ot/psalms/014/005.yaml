  text: שָׁ֤ם פָּ֣חֲדוּ פָ֑חַד כִּֽי אֱ֝לֹהִ֗ים בְּ/ד֣וֹר צַדִּֽיק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/005.yaml
  text: There they were in great dread[b][a], for God is with the generation of the righteous.
translation:
  language: id
  text: Di sanalah mereka diliputi ketakutan besar[a], sebab Allah menyertai angkatan orang benar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka takut dengan suatu ketakutan,” suatu ungkapan penegasan yang berarti bahwa mereka diliputi ketakutan besar.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Allah berada di tengah angkatan orang benar.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Di sanalah
  rationale: Kata keterangan tempat ini menunjuk dengan tegas pada tempat atau keadaan yang sedang digambarkan. Partikel -lah mempertahankan daya tunjuk dan tekanan puitis bahasa Ibrani tanpa menambah keterangan yang tidak tersurat.
- source_word: פָּחֲדוּ פָחַד
  choice: mereka diliputi ketakutan besar
  rationale: Gabungan verba dan nomina serumpun secara harfiah berarti ‘mereka takut dengan suatu ketakutan’ dan berfungsi sebagai penegasan. Ungkapan Indonesia ini menyampaikan rasa takut yang sangat kuat secara alami.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi ketakutan mereka. ‘Sebab’ mempertahankan hubungan kausal dan sesuai dengan ragam puitis.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini mengacu kepada Allah Israel dalam konteks ini dan diterjemahkan dengan sebutan baku bahasa Indonesia.
- source_word: בְּדוֹר
  choice: menyertai angkatan
  rationale: Preposisi בְּ dapat menyatakan keberadaan di dalam atau di tengah suatu kelompok. ‘Menyertai’ secara alami mengungkapkan kehadiran Allah bersama kelompok tersebut, sementara kemungkinan ‘berada di tengah’ dipertahankan dalam catatan kaki.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini dapat berfungsi secara kolektif dalam konstruksi dengan דּוֹר. ‘Angkatan orang benar’ menyampaikan kelompok yang bercirikan kebenaran tanpa membatasinya pada satu individu.
theological_decisions:
- issue: Makna hubungan Allah dengan orang benar dalam בְּדוֹר צַדִּיק
  choice: Allah menyertai angkatan orang benar
  alternative: Allah berada di tengah angkatan orang benar
  rationale: Teks mengaitkan ketakutan para pelaku kejahatan dengan kehadiran Allah pada atau di tengah kelompok orang benar. ‘Menyertai’ menyampaikan kehadiran dan keberpihakan yang tersirat secara wajar, sedangkan catatan kaki mempertahankan kemungkinan lokatif yang lebih harfiah.
- issue: Pemahaman bentuk tunggal צַדִּיק
  choice: Dipahami secara kolektif sebagai ‘orang benar’ dalam ‘angkatan orang benar’
  alternative: ‘angkatan orang yang benar’ atau ‘angkatan yang benar’
  rationale: Dalam hubungan dengan ‘angkatan’, bentuk tunggal dapat menyebut jenis atau ciri kolektif. Terjemahan ini tidak menafsirkannya sebagai satu tokoh tertentu dan tetap mempertahankan kategori moral teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan ringkas. ‘Di sanalah’ mempertahankan tekanan pembuka; ‘diliputi ketakutan besar’ mengalihkan idiom penegasan Ibrani secara alami; ‘angkatan’ dipilih untuk דּוֹר karena sesuai dengan konteks kelompok sezaman dan ragam Mazmur.
