source:
  edition: WLC
  text: הַֽלְל֣וּ אֶת יְ֭הוָה כָּל גּוֹיִ֑ם שַׁ֝בְּח֗וּ/הוּ כָּל הָ/אֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/001.yaml
  text: Praise Yahweh[a], all nations; extol him, all peoples.
translation:
  language: id
  text: 'Pujilah Yahweh[a], hai semua bangsa;

    sanjunglah dia, hai segala kaum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Pujilah Yahweh” atau “Pujilah TUHAN”; nama ilahi itu adalah YHWH.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak piel dari הלל menyerukan para pendengar untuk memuji. “Pujilah” merupakan padanan langsung, alami, dan sesuai dengan ragam puisi yang bermartabat.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: אֶת menandai objek langsung, sedangkan יְהוָה adalah nama ilahi YHWH. “Yahweh” mempertahankan nama diri yang terdapat dalam teks Ibrani.
- source_word: כָּל גּוֹיִם
  choice: semua bangsa
  rationale: גּוֹיִם menunjuk pada bangsa-bangsa atau kelompok-kelompok etnis. “Semua bangsa” menyampaikan cakupan universal seruan ini dan tetap dapat dibedakan dari אֻמִּים pada baris berikutnya.
- source_word: שַׁבְּחוּהוּ
  choice: sanjunglah dia
  rationale: Imperatif jamak dari שבח dengan sufiks objek orang ketiga maskulin tunggal berarti memuji atau menyanjung dia. “Sanjunglah dia” mempertahankan variasi verba dalam paralelisme puisi tanpa mengubah maknanya.
- source_word: כָּל הָאֻמִּים
  choice: segala kaum
  rationale: אֻמִּים berarti kelompok-kelompok masyarakat atau kaum. “Segala kaum” menjaga kesejajaran dengan “semua bangsa” sekaligus mencerminkan perbedaan kosakata Ibraninya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks secara langsung memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi itu, sedangkan “TUHAN” merupakan penggantian tradisional yang dapat dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. Partikel vokatif “hai” mempertahankan seruan langsung kepada seluruh bangsa dan kaum; dua verba serta dua sebutan kolektif dibedakan untuk menjaga paralelisme Ibrani.
