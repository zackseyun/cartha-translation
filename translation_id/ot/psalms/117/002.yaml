source:
  edition: WLC
  text: כִּ֥י גָ֘בַ֤ר עָלֵ֨י/נוּ חַסְדּ֗/וֹ וֶֽ/אֱמֶת יְהוָ֥ה לְ/עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/002.yaml
  text: For his steadfast love has prevailed over us[a], and the faithfulness of Yahweh is forever. Praise Yah!
translation:
  language: id
  text: Sebab kasih setia-Nya begitu besar bagi kita, dan kesetiaan[a] Yahweh tetap selama-lamanya. Pujilah Yah!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kebenaran”. Kata Ibrani dapat berarti kebenaran, kesetiaan, atau sifat dapat dipercaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi ajakan untuk memuji dalam ayat sebelumnya dan mengalir alami dalam puisi Indonesia.
- source_word: גָבַר עָלֵינוּ
  choice: telah berkuasa atas kita
  rationale: Mempertahankan daya verbal גָבַר, yakni menjadi kuat atau berjaya, serta hubungan עַל, tanpa meratakannya menjadi sekadar 'besar'.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: Ungkapan Indonesia yang wajar dan bermartabat ini mencakup kasih sekaligus loyalitas teguh yang terkandung dalam חֶסֶד.
- source_word: וֶאֱמֶת
  choice: dan kesetiaan
  rationale: Dalam pasangan dengan חֶסֶד, אֱמֶת terutama menonjolkan sifat dapat dipercaya dan keteguhan; kemungkinan arti 'kebenaran' tetap dicatat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama diri ilahi yang diwakili oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: לְעוֹלָם
  choice: tetap untuk selama-lamanya
  rationale: Menyatakan keberlangsungan tanpa akhir dan melengkapi susunan nominal Ibrani dengan predikat yang alami dalam bahasa Indonesia.
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Menerjemahkan bentuk perintah הַלְלוּ dan mempertahankan bentuk singkat nama ilahi יָהּ.
theological_decisions:
- issue: Makna אֱמֶת dalam pasangan dengan חֶסֶד
  choice: kesetiaan
  alternative: kebenaran
  rationale: Konteks pasangan perjanjian mendukung 'kesetiaan', tetapi kata Ibrani juga sungguh dapat berarti 'kebenaran'; catatan kaki mempertahankan keluasan maknanya.
- issue: Penyebutan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi, sehingga transliterasi mempertahankan pembedaan antara nama dan gelar.
- issue: Gambaran גָבַר עָלֵינוּ
  choice: telah berkuasa atas kita
  alternative: besar bagi kita
  rationale: Pilihan utama mempertahankan gambaran dinamis tentang kasih setia yang terbukti kuat, tanpa menafsirkan tindakan itu sebagai permusuhan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas, puitis, dan bermartabat. Bentuk 'kasih setia' mempertahankan ungkapan Alkitabiah yang sudah mudah dipahami, sedangkan 'Pujilah Yah!' menerjemahkan seruan penutup sambil menjaga bentuk singkat nama ilahi.
