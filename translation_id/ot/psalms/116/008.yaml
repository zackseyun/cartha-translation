base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/008.yaml
  text: For you have delivered my soul from death[a], my eyes from tears[b], my feet from stumbling.
translation:
  language: id
  text: Sebab Engkau telah menyelamatkan jiwaku dari maut[a], mataku dari air mata, dan kakiku dari jatuh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyawaku” atau “diriku”; kata Ibrani nefesy dapat menunjuk pada jiwa, nyawa, atau diri seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau “kakiku dari tersandung”; kata Ibrani tersebut dapat menyatakan tersandung atau jatuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau dasar bagi pujian dalam konteks sekitarnya; “Sebab” mempertahankan fungsi penjelasannya secara alami dalam bahasa Indonesia.
- source_word: חִלַּצְתָּ
  choice: telah menyelamatkan
  rationale: Bentuk piel dari חלץ menyatakan tindakan melepaskan atau menyelamatkan dari bahaya. Pilihan ini wajar, berbobot, dan dapat menaungi ketiga unsur penyelamatan dalam larik tersebut.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat menunjuk pada jiwa, nyawa, atau diri seseorang. “Jiwaku” mempertahankan keluasan istilah dan corak puitisnya, sedangkan alternatif kontekstual dicatat dalam catatan kaki.
- source_word: מִמָּוֶת
  choice: dari maut
  rationale: Gabungan preposisi dan nomina ini secara langsung menyatakan penyelamatan dari kematian; “maut” ringkas dan sesuai dengan ragam puisi yang khidmat.
- source_word: אֶת עֵינַי מִן דִּמְעָה
  choice: mataku dari air mata
  rationale: Terjemahan ringkas ini mempertahankan unsur kedua dalam susunan tiga serangkai serta elipsis verba Ibrani, yang dalam bahasa Indonesia tetap mudah dipahami.
- source_word: אֶת רַגְלִי מִדֶּחִי
  choice: kakiku dari tersandung
  rationale: דֶּחִי dapat menyatakan sandungan, tindakan jatuh, atau keruntuhan. “Dari tersandung” menyampaikan pemeliharaan dari kehilangan pijakan tanpa menentukan secara berlebihan apakah sandungan itu berakhir dengan jatuh.
theological_decisions:
- issue: Cakupan antropologis נַפְשִׁי
  choice: jiwaku
  alternative: nyawaku; diriku
  rationale: Konteks penyelamatan dari maut memungkinkan arti “nyawa”, tetapi puisi ini tidak membatasi נֶפֶשׁ pada kehidupan jasmani saja. “Jiwaku” mempertahankan keluasan dan ketegangan maknanya, dengan alternatif dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan tiga serangkai serta penghilangan verba pada unsur kedua dan ketiga dipertahankan agar kesejajaran puisi Ibrani tetap terasa.
