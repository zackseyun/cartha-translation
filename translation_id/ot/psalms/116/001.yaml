  text: Aku mengasihi TUHAN, sebab Dia mendengar suaraku dan permohonanku akan belas kasihan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: Aku mengasihi TUHAN
  rationale: Secara harfiah verba ini berarti “aku mengasihi.” Objeknya tidak dinyatakan langsung dalam klausa Ibrani, tetapi paling wajar dipahami sebagai יהוה dari klausa berikutnya; penyebutan “TUHAN” menghasilkan bahasa Indonesia yang jelas dan alami tanpa mengubah hubungan antarklausa.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini dapat berarti “sebab/karena” atau “bahwa.” Dalam konteks ini, “sebab” secara alami menyatakan alasan pemazmur mengasihi TUHAN, sambil tetap mempertahankan kaitan erat dengan tindakan-Nya mendengar.
- source_word: יִשְׁמַע
  choice: mendengar
  rationale: Bentuk imperfek Ibrani dapat mengungkapkan tindakan yang sedang atau lazim dialami, bukan hanya masa depan. Kala kini bahasa Indonesia sesuai dengan pengakuan pemazmur.
- source_word: תַּחֲנוּנָי
  choice: permohonanku memohon belas kasihan
  rationale: Nomina ini menunjuk pada permohonan sungguh-sungguh untuk belas kasihan atau kemurahan; frasa ini mempertahankan unsur permohonan sekaligus belas kasihan.
theological_decisions:
- issue: Objek dari “aku mengasihi” tidak tertulis secara eksplisit dalam teks Ibrani.
  choice: Menambahkan “TUHAN” sebagai objek tersurat dalam bahasa Indonesia.
  alternative: “Aku mengasihi, sebab TUHAN mendengar ...” atau “Aku suka bahwa TUHAN mendengar ...”
  rationale: Tafsiran paling alami ialah bahwa pemazmur mengasihi TUHAN. “Aku mengasihi” tanpa objek terasa tidak lengkap dalam bahasa Indonesia, sedangkan “aku suka bahwa” mengurangi kekuatan verba kasih dan secara teologis maupun leksikal kurang langsung.
- issue: Representasi nama ilahi יהוה.
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: “TUHAN” dalam huruf kapital mengikuti konvensi Alkitab bahasa Indonesia yang luas untuk Tetragramaton, mudah dipahami pembaca umum, dan tidak memaksakan rekonstruksi pelafalan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Urutan “suaraku, permohonanku” mempertahankan aposisi puitis teks Ibrani. Kapitalisasi “Dia” dipakai sebagai bentuk penghormatan yang lazim, tanpa menambah gelar teologis.
