id: PSA.116.18
reference: Psalms 116:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/018.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: id
  text: Aku akan memenuhi nazar-nazarku kepada Yahweh di hadapan seluruh umat-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku akan membayar nazar-nazarku kepada Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di depan” atau “di hadapan”; maksudnya, nazar itu dipenuhi secara terbuka dalam pandangan umat.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: nazar-nazarku
  rationale: Bentuk jamak נְדָרַי berarti nazar atau janji khidmat yang telah diikrarkan oleh penutur. Istilah Indonesia 'nazar' tepat dan tidak mempersempit maknanya menjadi persembahan tertentu.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang kepada-Nya nazar itu dipenuhi, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: אֲשַׁלֵּם
  choice: Aku akan memenuhi
  rationale: Dalam konteks nazar, bentuk piel dari שׁלם berarti membayar atau memenuhi nazar. 'Memenuhi' merupakan ungkapan Indonesia yang alami dan tidak memberi kesan bahwa tindakan itu semata-mata berupa pembayaran uang.
- source_word: נֶגְדָה־נָּא
  choice: di hadapan
  rationale: נֶגְדָה menyatakan posisi 'di depan' atau 'di hadapan'. Partikel נָא sulit diwakili secara tersendiri di sini dan kemungkinan memberi penegasan puitis; terjemahan utama tidak memaksakan arti temporal.
- source_word: לְכָל עַמּוֹ
  choice: seluruh umat-Nya
  rationale: Frasa ini melengkapi 'di hadapan' dan menunjukkan bahwa nazar dipenuhi secara terbuka di depan segenap umat milik Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Sifat publik pemenuhan nazar
  choice: di hadapan seluruh umat-Nya
  alternative: di depan seluruh umat-Nya
  rationale: 'Ungkapan ini mempertahankan arti spasial dan sosial נֶגְדָה: tindakan tersebut dilakukan secara terbuka dalam pandangan komunitas umat, tanpa menambahkan rincian liturgis yang tidak dinyatakan teks.'
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. 'Nazar' dipertahankan sebagai istilah umum yang dikenal dalam konteks keagamaan; 'memenuhi' dipilih agar makna idiomatis verba Ibrani jelas tanpa kesan terlalu moneter. Semua penanda catatan kaki ditempatkan dalam teks utama.
