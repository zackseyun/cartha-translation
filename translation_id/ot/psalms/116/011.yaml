lexical_decisions:
- source_word: אֲנִי אָמַרְתִּי
  choice: aku berkata
  rationale: Pronomina orang pertama dipertahankan dalam bentuk verba dan subjek eksplisit untuk mencerminkan penekanan Ibrani, sambil tetap alami dalam bahasa Indonesia.
- source_word: בְחָפְזִי
  choice: dalam kegelisahanku
  rationale: Ungkapan ini dapat menunjuk pada ketergesa-gesaan yang diliputi gejolak, rasa gentar, atau kepanikan. Dalam konteks kesesakan pemazmur, “kegelisahanku” menangkap keadaan emosional tanpa mempersempitnya menjadi kecepatan semata.
- source_word: כָּל הָאָדָם
  choice: setiap orang
  rationale: אָדָם digunakan secara generik dan kolektif bagi manusia. “Setiap orang” mempertahankan cakupan universal sekaligus terdengar alami dan inklusif dalam bahasa Indonesia modern.
- source_word: כֹּזֵב
  choice: adalah pendusta
  rationale: Partisip ini menggambarkan seseorang yang berdusta atau tidak dapat dipercaya. “Pendusta” mempertahankan kuatnya penilaian dalam teks, bukan sekadar menyatakan bahwa manusia dapat keliru.
theological_decisions:
- issue: Cakupan pernyataan tentang manusia
  choice: Setiap orang adalah pendusta
  alternative: Seluruh umat manusia tidak dapat dipercaya
  rationale: Terjemahan utama mempertahankan bentuk universal dan tajam dari ungkapan Ibrani tanpa menentukan apakah ini pernyataan doktrinal menyeluruh atau seruan yang lahir dari kegelisahan; konteks ujarannya tetap dibiarkan memberi ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Aku” sesuai dengan suara pribadi pemazmur; “pendusta” mempertahankan daya tuduh teks. Kedua penanda catatan kaki dicantumkan dalam teks utama.
