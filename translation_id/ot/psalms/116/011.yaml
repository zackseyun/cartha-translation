  text: Dalam kegelisahanku[a] aku berkata, “Setiap orang[b] adalah pendusta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam ketergesa-gesaanku” atau “dalam kepanikanku.” Ungkapan Ibrani ini dapat menyatakan ketergesa-gesaan yang disertai kegelisahan, rasa gentar, atau kepanikan.
