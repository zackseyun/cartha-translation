lexical_decisions:
- source_word: חַנּוּן
  choice: pengasih
  rationale: Kata sifat ini menggambarkan Yahweh sebagai pribadi yang menunjukkan kasih karunia dan kemurahan. “Pengasih” alami dalam bahasa Indonesia dan mempertahankan nuansa relasionalnya.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi diterjemahkan sebagai nama diri “Yahweh,” sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: צַדִּיק
  choice: benar
  rationale: Kata ini menyatakan kelurusan moral sekaligus keadilan. “Benar” mempertahankan keluasan maknanya, sedangkan “adil” dicantumkan sebagai alternatif.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk dengan akhiran orang pertama jamak diterjemahkan secara langsung untuk mempertahankan pengakuan komunal dan relasional dalam teks.
- source_word: מְרַחֵם
  choice: berbelaskasihan
  rationale: Partisipel dari רחם menggambarkan belas kasihan sebagai sifat atau tindakan yang berlangsung. “Berbelaskasihan” menyampaikan hal itu dengan wajar dan ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan makna צַדִּיק
  choice: benar
  alternative: adil
  rationale: “Benar” menjaga cakupan kelurusan moral yang lebih luas, tetapi konteks juga memungkinkan penekanan pada keadilan; karena itu alternatif tersebut dipertahankan dalam catatan kaki.
- issue: Sifat atau tindakan dalam מְרַחֵם
  choice: berbelaskasihan
  alternative: menunjukkan belas kasihan; penyayang
  rationale: Bentuk partisipel dapat dipahami sebagai sifat yang tetap maupun tindakan yang terus ditunjukkan. Terjemahan utama mempertahankan ketegangan itu tanpa membatasinya pada salah satu sisi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dengan “itu” mempertahankan penekanan predikatif pada sifat-sifat Yahweh, sedangkan titik koma mencerminkan dua klausa Ibrani yang erat berkaitan.
