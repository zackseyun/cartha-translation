  text: Because he has inclined his ear to me[a], I will call on him in my days.
translation:
  language: id
  text: Sebab Ia mencondongkan telinga-Nya kepadaku, sepanjang hidupku[a] aku akan berseru kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan pada hari-hariku aku akan berseru.” Maksudnya, pemazmur akan terus berseru kepada TUHAN sepanjang hidupnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan alasan bagi pernyataan pada ayat sebelumnya; “sebab” menyatakan hubungan kausal secara jelas dan wajar.
- source_word: הִטָּה
  choice: mencondongkan
  rationale: Bentuk dari נטה ini menggambarkan tindakan mengarahkan atau mencondongkan telinga untuk mendengarkan dengan penuh perhatian; metaforanya dipertahankan.
- source_word: אָזְנוֹ
  choice: telinga-Nya
  rationale: Nomina tunggal harfiah “telinganya” dipertahankan sebagai ungkapan perhatian dalam mendengarkan; kapitalisasi pronomina mengikuti konvensi hormat bahasa Indonesia bagi Allah.
- source_word: לִי
  choice: kepadaku
  rationale: Preposisi ini menunjukkan arah kepada penutur dan berpadu alami dengan ungkapan “mencondongkan telinga”.
- source_word: וּבְיָמַי
  choice: sepanjang hidupku
  rationale: Secara harfiah berarti “dan pada hari-hariku”; dalam konteks, ungkapan ini menunjukkan seluruh masa hidup pemazmur.
- source_word: אֶקְרָא
  choice: aku akan berseru kepada-Nya
  rationale: קרא dalam konteks doa berarti memanggil atau berseru kepada Allah. Objek tidak tertulis dalam klausa Ibrani, tetapi dipahami dari konteks dan dinyatakan agar alami dalam bahasa Indonesia.
