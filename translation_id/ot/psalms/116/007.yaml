source:
  edition: WLC
  text: שׁוּבִ֣י נַ֭פְשִׁ/י לִ/מְנוּחָ֑יְ/כִי כִּֽי יְ֝הוָ֗ה גָּמַ֥ל עָלָֽיְ/כִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/007.yaml
  text: Return[a], my soul, to your rest, for Yahweh has dealt bountifully with you.
translation:
  language: id
  text: Kembalilah, jiwaku, kepada ketenteramanmu, sebab Yahweh telah berbuat baik kepadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “telah bermurah hati kepadamu” atau “telah membalasmu dengan kebaikan.” Kata kerja Ibrani yang dipakai dapat berarti memperlakukan atau membalas seseorang; dalam konteks ini maknanya positif.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: Kembalilah
  rationale: Bentuk imperatif feminin tunggal dari שׁוב, ditujukan kepada נַפְשִׁי. Pilihan ini mempertahankan gagasan kembali kepada keadaan tenang yang sebelumnya dinikmati.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפשׁ dapat berarti jiwa, diri, atau hidup. Dalam seruan kepada diri sendiri ini, “jiwaku” alami dalam bahasa Indonesia dan mempertahankan daya introspektif ungkapan Ibrani.
- source_word: לִמְנוּחָיְכִי
  choice: kepada ketenteramanmu
  rationale: מנוחה menunjuk pada istirahat, keadaan tenteram, atau tempat beristirahat. “Ketenteramanmu” mempertahankan nuansa keadaan damai tanpa memaksakan pengertian tempat secara konkret.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi perintah sebelumnya; “sebab” sesuai dengan hubungan logis dan laras puitis ayat ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: גָּמַל עָלָיְכִי
  choice: telah berbuat baik kepadamu
  rationale: גמל dengan על dapat berarti memperlakukan, membalas, atau melimpahkan sesuatu kepada seseorang. Konteks mazmur syukur ini jelas positif; “telah berbuat baik kepadamu” alami dan tidak menentukan secara berlebihan apakah tindakan itu berupa balasan atau pemberian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Sifat tindakan Yahweh dalam גָּמַל עָלָיְכִי
  choice: telah berbuat baik kepadamu
  alternative: telah membalasmu dengan kebaikan atau telah melimpahkan kemurahan kepadamu
  rationale: Konteks menuntut makna positif, tetapi verba גמל sendiri dapat mencakup perlakuan, balasan, atau pemberian. Terjemahan utama mempertahankan keluasan ini dan catatan kaki menyajikan kemungkinan ungkapan lain.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan mudah dipahami. Sapaan langsung “jiwaku” dipertahankan tanpa menambahkan partikel vokatif. “Ketenteraman” dipilih agar mencakup gagasan istirahat atau ketenangan tanpa mengubahnya secara tegas menjadi tempat fisik.
