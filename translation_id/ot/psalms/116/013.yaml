  text: Aku akan mengangkat cawan keselamatan[a] dan berseru kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani memakai bentuk jamak: “keselamatan-keselamatan” atau “pembebasan-pembebasan”; kemungkinan merupakan bentuk jamak intensif atau puitis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: cawan
  rationale: Kata ini menunjuk pada wadah untuk minum. “Cawan” alami dalam ragam Alkitab Indonesia dan mempertahankan citra puitis tanpa mengharuskan makna liturgis tertentu.
- source_word: יְשׁוּעוֹת
  choice: keselamatan
  rationale: Bentuk Ibraninya jamak, tetapi dalam susunan puitis ini kemungkinan berfungsi sebagai jamak intensif atau merangkum berbagai tindakan penyelamatan. Bentuk tunggal “keselamatan” lebih alami dalam bahasa Indonesia; nuansa jumlah dipertahankan dalam catatan kaki.
- source_word: אֶשָּׂא
  choice: aku akan mengangkat
  rationale: Bentuk verba dari נשׂא dapat berarti mengangkat, membawa, atau menjunjung. Bersama “cawan”, “mengangkat” paling tepat mempertahankan tindakan dan citra puitisnya.
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: dan berseru kepada nama Yahweh
  rationale: Ungkapan קרא בשם menyatakan tindakan memanggil atau memohon kepada Tuhan. “Berseru kepada nama” merupakan ungkapan Indonesia yang alami dan mempertahankan unsur “nama” dalam teks sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri יהוה. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa jamak יְשׁוּעוֹת
  choice: keselamatan, dengan catatan kaki tentang bentuk jamak
  alternative: berbagai keselamatan atau pembebasan-pembebasan
  rationale: Bentuk jamak Ibrani perlu diakui, tetapi padanan jamak harfiah terdengar tidak wajar dalam bahasa Indonesia. Bentuk tunggal pada teks utama menjaga kelancaran, sedangkan catatan kaki mempertahankan ambiguitas antara jamak puitis/intensif dan beberapa tindakan pembebasan.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. “Aku” sesuai dengan suara pribadi pemazmur; “cawan” mempertahankan citra puisi Ibrani; struktur dua klausa dijaga tetap ringkas dan sejajar.
