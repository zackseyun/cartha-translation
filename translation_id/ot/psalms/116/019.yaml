  text: בְּ/חַצְר֤וֹת בֵּ֤ית יְהוָ֗ה בְּֽ/ת֘וֹכֵ֤/כִי יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/019.yaml
  text: in the courts of the house of Yahweh[a], in your midst, Jerusalem[b]. Praise Yah!
translation:
  language: id
  text: 'di pelataran-pelataran rumah Yahweh,

    di tengah-tengahmu, hai Yerusalem.

    Pujilah Yah![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani: “Pujilah Yah!” Ungkapan inilah yang menjadi asal kata “Haleluya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַצְרוֹת
  choice: di pelataran-pelataran
  rationale: Bentuk jamak חָצֵר menunjuk pada area-area terbuka yang dikelilingi bangunan dalam kompleks bait. “Pelataran-pelataran” alami dalam bahasa Indonesia dan mempertahankan bentuk jamaknya.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan langsung ungkapan Ibrani “rumah YHWH”; dalam konteks ini yang dimaksud ialah bait, tetapi “rumah” mempertahankan metafora sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: בְּתוֹכֵכִי
  choice: di tengah-tengahmu
  rationale: Akhiran orang kedua feminin tunggal dipertahankan karena Yerusalem disapa secara langsung sebagai sebuah kota yang dipersonifikasikan.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Mengikuti bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Imperatif jamak הַלְלוּ diterjemahkan secara langsung, sedangkan יָהּ dipertahankan sebagai bentuk singkat nama ilahi; ungkapan ini merupakan asal kata “Haleluya”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Penerjemahan יָהּ dalam seruan penutup
  choice: Yah
  alternative: TUHAN atau Haleluya
  rationale: “Yah” menjaga perbedaan bentuk antara יָהּ dan יְהוָה serta memperlihatkan arti unsur terakhir dalam seruan “Haleluya”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa liturgis. Sapaan “hai Yerusalem” membuat personifikasi serta bentuk orang kedua feminin tunggal dalam bahasa Ibrani jelas secara alami. Pemenggalan tiga baris mengikuti susunan gagasan ayat.
