  yaml_path: translation/ot/psalms/116/010.yaml
  text: 'I believed[b][a], therefore I spoke: “I am greatly afflicted.”'
translation:
  language: id
  text: 'Aku percaya,[a][b] maka aku berkata: “Aku sangat tertindas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebab/karena aku berkata”; partikel Ibrani כִּי dapat dipahami dengan lebih dari satu cara.
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku tetap percaya ketika aku berkata, ‘Aku sangat tertindas.’” Susunan kalimat Ibraninya ringkas dan dapat dipahami secara berbeda.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: Aku percaya
  rationale: Bentuk Hifil dari אמן menyatakan percaya atau menaruh kepercayaan. “Aku percaya” langsung, wajar dalam bahasa Indonesia, dan tidak mempersempit maknanya menjadi rumusan doktrinal tertentu.
- source_word: כִּי
  choice: maka
  rationale: Partikel כִּי memiliki beberapa kemungkinan fungsi. Dalam pembacaan utama, kata ini menghubungkan kepercayaan dengan tindakan berbicara sebagai akibatnya; “maka” mengungkapkan hubungan itu secara alami. Kemungkinan arti “sebab/karena” dipertahankan dalam catatan kaki.
- source_word: אֲדַבֵּר
  choice: aku berbicara
  rationale: Bentuk imperfek dapat menyatakan tindakan yang sedang, berulang, atau dipandang secara tidak terbatas oleh waktu. “Aku berbicara” mempertahankan aspek yang lebih terbuka daripada bentuk lampau Indonesia dan cocok dengan ungkapan puitis ini.
- source_word: אֲנִי
  choice: Aku
  rationale: Pronomina mandiri memberi penekanan pada pembicara. Pengulangan “Aku” dalam kutipan mempertahankan penekanan tersebut secara alami.
- source_word: עָנִיתִי
  choice: sangat menderita
  rationale: Kata ini menyatakan keadaan tertimpa kesusahan atau penderitaan. “Menderita” alami dan luas dalam bahasa Indonesia serta menghindari kesan bahwa penindasan oleh manusia secara khusus pasti dimaksudkan.
- source_word: מְאֹד
  choice: sangat
  rationale: Keterangan intensitas ini paling langsung dan alami diterjemahkan “sangat”.
theological_decisions:
- issue: Hubungan sintaksis antara percaya dan berbicara
  choice: 'Kepercayaan dipahami sebagai hal yang diikuti oleh tindakan berbicara, sedangkan klausa terakhir disajikan sebagai isi perkataan: “Aku percaya, maka aku berbicara, ‘Aku sangat menderita.’”'
  alternative: Ayat ini juga dapat dipahami, “Aku percaya, sebab aku berbicara,” atau “Aku tetap percaya ketika aku berkata, ‘Aku sangat menderita.’”
  rationale: Susunan Ibrani ringkas dan memungkinkan lebih dari satu hubungan antara klausa-klausanya. Teks utama memberikan alur yang jelas tanpa meniadakan pembacaan lain; ambiguitas yang nyata dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. “Maka” dipilih untuk alur utama yang alami, sedangkan “menderita” mempertahankan keluasan makna penderitaan tanpa menentukan penyebabnya. Tanda catatan kaki ditempatkan sesudah “percaya” karena kedua catatan menyangkut hubungan kata itu dengan klausa berikutnya.
