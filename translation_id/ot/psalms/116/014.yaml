base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/014.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: id
  text: Aku akan menunaikan nazar-nazarku kepada Yahweh sekarang, di hadapan seluruh umat-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku akan membayar nazar-nazarku kepada Yahweh.” Kata kerja Ibrani dapat berarti “membayar” dalam arti menunaikan apa yang telah dinazarkan.'
    reason: lexical_alternative
  - marker: b
    text: Partikel Ibrani yang diterjemahkan “sekarang” juga dapat berfungsi sebagai penegas, misalnya “sungguh” atau “memang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: nazar-nazarku
  rationale: Bentuk jamak נְדָרִים dengan akhiran orang pertama tunggal berarti nazar-nazar yang telah diikrarkan oleh pemazmur. 'Nazar' merupakan istilah Indonesia yang tepat dan lazim dalam konteks keagamaan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang kepadanya nazar dipenuhi, sedangkan nama perjanjian יְהוָה dipertahankan sebagai 'Yahweh'.
- source_word: אֲשַׁלֵּם
  choice: Aku akan memenuhi
  rationale: Bentuk piel dari שׁלם dalam konteks nazar berarti menunaikan atau menyelesaikan kewajiban yang telah dijanjikan. 'Memenuhi' terdengar alami dan mempertahankan kaitannya dengan nazar.
- source_word: נֶגְדָה
  choice: di hadapan
  rationale: Kata ini menyatakan keberadaan di depan atau dalam kehadiran pihak lain, sehingga menonjolkan sifat publik tindakan tersebut.
- source_word: נָא
  choice: tidak dinyatakan secara terpisah dalam teks utama
  rationale: Dalam konteks puitis ini נָא kemungkinan merupakan partikel penegas, meskipun dapat pula dipahami sebagai 'sekarang'. Bahasa Indonesia tidak memerlukan kata tersendiri agar kalimat tetap alami; nuansanya dicatat dalam catatan kaki.
- source_word: לְכָל עַמּוֹ
  choice: seluruh umat-Nya
  rationale: כָּל mencakup keseluruhan kelompok, dan עַמּוֹ berarti umat-Nya. Dalam konstruksi dengan נֶגְדָה, frasa ini menunjuk para saksi di hadapan siapa nazar itu dipenuhi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Transliterasi 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Sifat pemenuhan nazar
  choice: memenuhi nazar di hadapan umat
  alternative: membayar nazar kepada Yahweh
  rationale: Teks menggambarkan penunaian kewajiban nazar secara publik. Pilihan 'memenuhi' tidak menentukan bentuk ritual atau persembahan tertentu yang tidak disebutkan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan ejaan religius Indonesia. Susunan 'di hadapan seluruh umat-Nya' mempertahankan dimensi publik tanpa terasa kaku.
