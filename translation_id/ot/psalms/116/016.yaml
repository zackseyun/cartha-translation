  yaml_path: translation/ot/psalms/116/016.yaml
  text: Please[a], Yahweh, for I am your servant; I am your servant, the son of your maidservant[c][b]. You have loosed my bonds.
translation:
  language: id
  text: Ya, Yahweh, sesungguhnya aku hamba-Mu; aku hamba-Mu, anak laki-laki dari hamba perempuan-Mu.[a] Engkau telah melepaskan ikatan-ikatanku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak laki-laki dari hamba perempuan-Mu”; ungkapan ini dapat menekankan status pengabdian yang diwarisi melalui ibunya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Engkau telah membuka ikatan-ikatanku”; dalam konteks ini, artinya Engkau telah melepaskan atau membebaskan aku.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנָּה
  choice: Ya
  rationale: Partikel permohonan yang mengungkapkan seruan sungguh-sungguh; “Ya” alami dalam doa Indonesia yang khidmat tanpa menjadi terlalu kuno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: כִּי
  choice: sungguh
  rationale: Dalam konteks seruan ini, כִּי dapat memberi penegasan pada pengakuan pemazmur. Pilihan ini mempertahankan kemungkinan nuansa afirmatif tanpa memaksakan hubungan sebab-akibat yang kurang alami dalam bahasa Indonesia.
- source_word: עַבְדֶּךָ / עַבְדְּךָ
  choice: hamba-Mu
  rationale: “Hamba” menyampaikan kedudukan sebagai pelayan yang menjadi milik tuannya dan cocok dengan bahasa doa kepada Allah; nuansa perhambaan tetap tersirat.
- source_word: בֶּן אֲמָתֶךָ
  choice: anak dari hamba perempuan-Mu
  rationale: Mempertahankan bentuk genealogis dan pembedaan gender dalam bahasa Ibrani dengan ungkapan Indonesia yang jelas.
- source_word: פִּתַּחְתָּ
  choice: telah melepaskan
  rationale: Secara harfiah berarti “membuka,” tetapi bersama “ikatan” bermakna melonggarkan atau melepaskan; pilihan ini tetap mempertahankan citra ikatan.
- source_word: לְמוֹסֵרָי
  choice: ikatan-ikatanku
  rationale: Menunjuk pada belenggu atau pengikat. “Ikatan-ikatan” cukup luas untuk mempertahankan metafora sumber tanpa mempersempitnya menjadi rantai tertentu.
theological_decisions:
- issue: Sebutan status pemazmur di hadapan Allah
  choice: hamba
  alternative: budak
  rationale: Ayat ini menekankan kerendahan hati, kepunyaan, dan pengabdian turun-temurun kepada Yahweh. “Hamba” paling wajar dalam bahasa doa Indonesia, sementara kemungkinan nuansa status terikat dicatat dalam catatan kaki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Fungsi כִּי setelah permohonan אנה
  choice: sungguh
  alternative: sebab
  rationale: כִּי dapat dibaca sebagai penegas pengakuan atau sebagai pengantar alasan permohonan. Teks utama memakai nuansa penegasan yang alami, sedangkan kemungkinan kausal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi memakai huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia. Pengulangan “aku hamba-Mu” dipertahankan untuk mencerminkan penekanan puitis teks Ibrani.
