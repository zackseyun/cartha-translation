  yaml_path: translation/ot/psalms/116/017.yaml
  text: To you I will offer a sacrifice of thanksgiving[a], and I will call on the name of Yahweh.
translation:
  language: id
  text: Kepada-Mu aku akan mempersembahkan kurban syukur dan menyerukan nama Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: יהוה (YHWH), nama ilahi yang secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam bahasa Ibrani dan tradisi penerjemahannya.
lexical_decisions:
- source_word: לְךָ
  choice: Kepada-Mu
  rationale: Preposisi לְ dengan pronomina orang kedua tunggal menandai Allah sebagai pihak yang menerima persembahan; bentuk ini juga mempertahankan sapaan langsung.
- source_word: אֶזְבַּח
  choice: aku akan mempersembahkan
  rationale: Dalam konteks ibadah, זבח menunjuk pada tindakan mempersembahkan kurban. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi tindakan menyembelih saja.
- source_word: זֶבַח תּוֹדָה
  choice: kurban syukur
  rationale: Frasa konstruksi ini berarti kurban yang dipersembahkan sebagai ungkapan syukur. 'Kurban syukur' ringkas, jelas, dan mempertahankan unsur kurban serta ucapan syukur.
- source_word: וּבְשֵׁם ... אֶקְרָא
  choice: dan menyerukan nama ...
  rationale: Ungkapan קרא בשם menyatakan tindakan memanggil atau berseru dengan menyebut nama ilahi. 'Menyerukan nama' mempertahankan unsur 'nama' sekaligus memungkinkan nuansa doa atau permohonan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri dengan bentuk 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama tersebut, sedangkan catatan kaki memberi tahu pembaca tentang bentuk Ibrani dan tradisi penerjemahannya.
- issue: Makna קרא בשם יהוה
  choice: menyerukan nama Yahweh
  alternative: berseru kepada Yahweh; memanggil nama Yahweh
  rationale: Pilihan ini mempertahankan kata 'nama' dan nuansa pemanggilan atau permohonan tanpa membatasinya menjadi proklamasi semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada pronomina '-Mu' menandai sapaan langsung kepada Allah. Konjungsi kedua tidak mengulang 'aku akan' karena subjek dan aspek futur tetap jelas serta kalimat menjadi lebih alami.
