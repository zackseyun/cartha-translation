  text: מָֽה אָשִׁ֥יב לַ/יהוָ֑ה כָּֽל תַּגְמוּל֥וֹ/הִי עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/012.yaml
  text: What shall I return to Yahweh for all his benefits to me?[a]
translation:
  language: id
  text: Apa yang akan kuberikan kembali kepada Yahweh atas segala kebaikan-Nya kepadaku?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apa yang akan kubalaskan kepada Yahweh atas segala perlakuan-Nya terhadapku?” Kata Ibrani yang dipakai dapat berarti balasan, perlakuan, atau kebaikan yang diterima; konteks ucapan syukur mendukung terjemahan “kebaikan-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Apa
  rationale: Kata tanya ini secara langsung menanyakan sesuatu yang dapat diberikan sebagai tanggapan.
- source_word: אָשִׁיב
  choice: akan kuberikan kembali
  rationale: Bentuk hifil dari שוב berarti membawa atau memberikan kembali. Ungkapan ini mempertahankan gambaran timbal balik tanpa menyiratkan bahwa kebaikan Allah benar-benar dapat dilunasi.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima, sedangkan nama ilahi יהוה dialihaksarakan sebagai Yahweh.
- source_word: כָּל
  choice: segala
  rationale: Menyatakan keseluruhan tindakan baik Yahweh terhadap pemazmur dan terdengar alami sebelum nomina abstrak dalam bahasa Indonesia.
- source_word: תַּגְמוּלֹהִי
  choice: kebaikan-Nya
  rationale: Kata dari akar גמל dapat menunjuk pada perlakuan, balasan, atau manfaat. Dalam konteks syukur ini, maknanya positif; 'kebaikan-Nya' menyampaikan tindakan yang mendatangkan manfaat tanpa bahasa yang terlalu transaksional.
- source_word: עָלַי
  choice: kepadaku
  rationale: Dalam ungkapan ini, על menyatakan arah atau sasaran perlakuan Yahweh terhadap pemazmur; 'kepadaku' adalah padanan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Nuansa tanggapan manusia terhadap kebaikan Allah
  choice: akan kuberikan kembali
  alternative: akan kubalas
  rationale: '''Memberikan kembali'' mempertahankan arti konkret verba Ibrani sekaligus membiarkan ketegangan retoris ayat tetap ada. ''Membalas'' dapat terdengar seolah-olah kebaikan Allah bisa dilunasi secara setimpal.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat 'kuberi-' menjaga kelancaran puitis, sedangkan kapitalisasi '-Nya' mengikuti kebiasaan Indonesia untuk rujukan kepada Allah.
