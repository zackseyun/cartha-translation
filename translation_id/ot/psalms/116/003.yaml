source:
  edition: WLC
  text: אֲפָפ֤וּ/נִי חֶבְלֵי מָ֗וֶת וּ/מְצָרֵ֣י שְׁא֣וֹל מְצָא֑וּ/נִי צָרָ֖ה וְ/יָג֣וֹן אֶמְצָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/003.yaml
  text: The cords of death encircled me[a], and the distresses of Sheol found me; I found trouble and sorrow.
translation:
  language: id
  text: 'Tali-tali maut membelit aku,

    dan kesesakan Syeol[a] menemukan aku;

    kesusahan dan dukacita kutemukan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kubur” atau “dunia orang mati.” Ibrani: Syeol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: membelit aku
  rationale: Kata kerja ini menggambarkan keadaan dikelilingi atau dikepung. Bersama gambaran tali, “membelit aku” terdengar alami dalam bahasa Indonesia dan mempertahankan daya konkret metaforanya.
- source_word: חֶבְלֵי מָוֶת
  choice: tali-tali maut
  rationale: חֶבֶל dapat berarti tali. Bentuk ini mempertahankan metafora tentang kuasa maut yang mengikat tanpa mengubahnya menjadi jerat secara interpretatif.
- source_word: וּמְצָרֵי שְׁאוֹל
  choice: dan kesesakan Syeol
  rationale: מֵצַר menunjuk pada kesempitan, himpitan, atau kesesakan. “Kesesakan” menyampaikan tekanan yang menyesakkan dan tetap wajar dalam larik puitis Indonesia.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan keluasan konsep Ibrani tentang ranah orang mati dan tidak mempersempitnya menjadi sekadar kubur.
- source_word: מְצָאוּנִי
  choice: menemukan aku
  rationale: Terjemahan ini mempertahankan arti langsung kata kerja serta pengulangan akar מצא dengan אֶמְצָא pada akhir ayat.
- source_word: צָרָה
  choice: kesusahan
  rationale: “Kesusahan” secara alami menyampaikan kesulitan, malapetaka, atau keadaan tertekan tanpa mempersempit cakupan katanya.
- source_word: וְיָגוֹן
  choice: dan dukacita
  rationale: “Dukacita” mempertahankan nuansa kesedihan mendalam dan sesuai dengan ragam puitis yang bermartabat.
- source_word: אֶמְצָא
  choice: kutemukan
  rationale: Bentuk ini mempertahankan arti harfiah dan permainan pengulangan dengan “menemukan aku” dalam larik sebelumnya.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syeol
  alternative: kubur; dunia orang mati
  rationale: “Syeol” mempertahankan ambiguitas kosmologis istilah Ibrani dan tidak memaksakan pengertian yang lebih sempit. Alternatif yang mudah dipahami diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang lugas. Susunan larik mempertahankan paralelisme dan pengulangan “menemukan aku—kutemukan” dari teks Ibrani. Penanda catatan kaki ditempatkan langsung pada istilah “Syeol” yang dijelaskannya.
