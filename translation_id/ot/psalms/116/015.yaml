base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/015.yaml
  text: Precious in the eyes of Yahweh is the death of his faithful ones[a][b].
translation:
  language: id
  text: Kematian orang-orang yang setia kepada-Nya[b] berharga[a] di mata Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mahal”. Kata Ibrani ini juga dapat berarti “bernilai tinggi” atau “sangat berarti”.
    reason: lexical_alternative
  - marker: b
    text: “Orang-orang yang setia kepada-Nya” juga dapat diterjemahkan “orang-orang saleh-Nya” atau “orang-orang kudus-Nya”; istilah Ibraninya menunjuk pada orang-orang yang bercirikan kesetiaan perjanjian kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקָר
  choice: berharga
  rationale: Kata sifat ini dapat berarti berharga, bernilai tinggi, atau mahal. “Berharga” mempertahankan makna utamanya tanpa menyiratkan bahwa Yahweh bersukacita atas kematian; kematian umat-Nya dipandang sangat bernilai atau penting oleh-Nya.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan Ibrani ini secara harfiah berarti “di mata” dan menunjukkan penilaian dari sudut pandang seseorang. Ungkapan yang sama alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: הַמָּוְתָה
  choice: kematian
  rationale: Nomina tertentu ini menunjuk pada kematian orang-orang setia milik-Nya. Dalam bahasa Indonesia, bentuk tanpa kata sandang merupakan padanan yang alami.
- source_word: לַחֲסִידָיו
  choice: orang-orang yang setia kepada-Nya
  rationale: חָסִיד menunjuk pada orang yang bercirikan kesetiaan, kesalehan, dan loyalitas perjanjian kepada Allah. Pilihan ini jelas bagi pembaca modern serta menghindari konotasi gerejawi khusus dari istilah “orang kudus”.
theological_decisions:
- issue: Makna kematian orang benar di hadapan Yahweh
  choice: Ayat ini menyatakan bahwa kematian orang-orang yang setia kepada Yahweh berharga dalam penilaian-Nya.
  alternative: Kematian mereka mahal atau sangat berarti bagi Yahweh.
  rationale: יָקָר mencakup nuansa “berharga” dan “mahal”. Terjemahan utama tidak menafsirkan ayat ini sebagai kesenangan Allah atas kematian, tetapi juga tidak menghapus ketegangan maknanya; ayat itu menegaskan nilai dan bobot kematian umat-Nya di hadapan-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat alami dan khidmat. Metafora “di mata” dipertahankan karena jelas dalam bahasa Indonesia. Kapitalisasi “-Nya” menandai rujukan kepada Yahweh. Penanda catatan kaki ditempatkan sesudah unsur yang dijelaskannya.
