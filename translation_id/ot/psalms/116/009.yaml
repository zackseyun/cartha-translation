  yaml_path: translation/ot/psalms/116/009.yaml
  text: I will walk before Yahweh in the lands of the living[a].
translation:
  language: id
  text: Aku akan berjalan di hadapan Yahweh di negeri-negeri orang-orang hidup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan hidup di hadapan Yahweh di negeri orang-orang hidup.” Ungkapan Ibrani “berjalan di hadapan” juga dapat menyatakan cara seseorang menjalani hidup, dan bentuk jamak “negeri-negeri” dapat dipahami secara lebih umum sebagai “negeri” atau “ranah.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְהַלֵּךְ
  choice: Aku akan berjalan
  rationale: Bentuk Hitpael imperfek orang pertama tunggal dari הלך. Terjemahan ini mempertahankan gambaran konkret Ibrani sekaligus membiarkan nuansa menjalani hidup atau berperilaku tetap terbuka.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini menyatakan posisi atau relasi di depan seseorang dan secara alami juga dapat menyiratkan kehidupan yang dijalani dalam kehadiran Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: בְּאַרְצוֹת
  choice: di negeri-negeri
  rationale: Bentuk nomina ini jamak. Terjemahan jamak mempertahankan bentuk teks Ibrani, meskipun ungkapan tersebut dapat menunjuk secara umum pada negeri atau ranah kehidupan.
- source_word: הַחַיִּים
  choice: orang hidup
  rationale: Bentuk ini secara substantival menunjuk kepada mereka yang hidup. 'Orang hidup' terdengar alami dalam bahasa Indonesia dan mempertahankan kontras tersirat dengan dunia orang mati.
theological_decisions:
- issue: Apakah ayat ini terutama menyatakan kelangsungan hidup jasmani atau cara hidup di hadapan Allah
  choice: Mempertahankan idiom 'berjalan di hadapan Yahweh' tanpa membatasi maknanya
  alternative: Aku akan hidup di hadapan Yahweh di negeri orang hidup.
  rationale: Ungkapan Ibrani dapat mencakup hidup setelah diselamatkan dan menjalani kehidupan dalam kehadiran Allah. Idiom konkret dipertahankan agar ketegangan makna tersebut tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. 'Berjalan di hadapan' mempertahankan idiom sumber, sedangkan 'negeri-negeri orang hidup' sengaja mempertahankan bentuk jamak Ibrani meskipun agak tidak lazim dalam bahasa Indonesia.
