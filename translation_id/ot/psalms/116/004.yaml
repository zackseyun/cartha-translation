  text: 'Then I called on the name of the LORD: “Please, LORD, rescue my life!”'
translation:
  language: id
  text: Lalu aku berseru kepada nama TUHAN, “Aku mohon, TUHAN, luputkanlah nyawaku!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: Lalu aku berseru kepada nama TUHAN
  rationale: Ungkapan 'berseru kepada nama' mempertahankan idiom Ibrani tentang memohon kepada TUHAN. Bentuk imperfek naratif dipahami dalam rangkaian kesaksian pemazmur sebagai tindakan lampau.
- source_word: אָנָּה
  choice: Ya
  rationale: Partikel permohonan ini mengungkapkan desakan sopan; 'Ya TUHAN' terdengar alami dan khidmat dalam doa bahasa Indonesia tanpa memerlukan catatan kaki.
- source_word: מַלְּטָה
  choice: luputkanlah
  rationale: Bentuk imperatif piel meminta pembebasan atau penyelamatan dari bahaya; 'luputkanlah' mempertahankan daya permohonan langsung.
- source_word: נַפְשִׁי
  choice: nyawaku
  rationale: Dalam konteks ancaman maut, nefesh menunjuk pada diri atau hidup pemazmur, bukan semata-mata unsur rohani yang terpisah. 'Nyawaku' alami dalam permohonan untuk diselamatkan dari kematian.
theological_decisions:
- issue: Representasi nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: Memakai konvensi Alkitab Indonesia yang dikenal luas, dengan huruf kapital untuk membedakannya sebagai representasi tetragramaton, tanpa menetapkan pelafalan yang diperdebatkan.
- issue: Makna נַפְשִׁי
  choice: nyawaku
  alternative: jiwaku
  rationale: Konteks ayat 3–4 adalah bahaya maut; karena itu istilah tersebut menunjuk pada hidup/diri pemazmur. Pilihan ini menghindari pembacaan dualistis yang tidak dituntut teks.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Struktur doa langsung dipertahankan, sementara tanda baca dan kapitalisasi mengikuti kebiasaan penerbitan Alkitab Indonesia.
