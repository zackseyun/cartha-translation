  text: שֹׁמֵ֣ר פְּתָאיִ֣ם יְהֹוָ֑ה דַּ֝לּוֹתִ֗י וְ/לִ֣/י יְהוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/006.yaml
  text: Yahweh preserves the simple[a]; I was brought low[c][b], and he saved me.
translation:
  language: id
  text: Yahweh menjaga orang yang lugu[a]; aku menjadi lemah[b], dan Ia menyelamatkan aku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang sederhana,” “orang yang kurang berpengalaman,” atau “orang yang mudah diperdaya.” Istilah Ibrani menunjuk kepada orang yang lugu atau tidak waspada, bukan selalu orang yang bodoh secara moral.
    reason: lexical_alternative
  - marker: b
    text: Atau “aku direndahkan” atau “aku terpuruk.” Kata Ibrani dapat menggambarkan keadaan berkurang, dilemahkan, atau menjadi rendah.
    reason: lexical_alternative
  - marker: c
    text: Atau “Ia melepaskan aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: menjaga
  rationale: Partisipel dari שׁמר menyatakan tindakan menjaga atau melindungi yang berlangsung; “menjaga” alami dalam bahasa Indonesia dan tetap dekat dengan ungkapan Ibrani.
- source_word: פְּתָאיִם
  choice: orang yang lugu
  rationale: Kata ini menunjuk kepada orang yang sederhana, kurang berpengalaman, atau mudah diperdaya, bukan dengan sendirinya orang yang bodoh secara moral. “Orang yang lugu” menyampaikan kerentanan tersebut tanpa nada penghinaan yang terlalu kuat.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: דַּלּוֹתִי
  choice: ketika aku menjadi lemah
  rationale: Bentuk dari דלל dapat menggambarkan keadaan menjadi rendah, berkurang kekuatannya, atau lemah. Ungkapan ini mempertahankan keluasan makna tanpa membatasinya pada kemiskinan materi.
- source_word: וְלִי
  choice: Ia ... aku
  rationale: Unsur pronominal dengan ל menunjukkan bahwa Yahweh bertindak bagi atau demi pemazmur; dalam bahasa Indonesia maknanya terserap secara alami dalam klausa “Ia menyelamatkan aku”.
- source_word: יְהוֹשִׁיעַ
  choice: Ia menyelamatkan aku
  rationale: Bentuk kausatif dari ישׁע berarti menyelamatkan atau melepaskan dari bahaya. “Menyelamatkan aku” langsung, wajar, dan sesuai dengan konteks pertolongan pribadi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama diri tersebut alih-alih menggantinya dengan gelar.
- issue: Sifat orang yang dijaga Yahweh
  choice: orang yang lugu
  alternative: orang sederhana; orang yang kurang berpengalaman
  rationale: Istilah Ibrani menggambarkan keluguan dan kerentanan, bukan kejahatan atau kebodohan moral. Terjemahan tidak menambahkan penilaian teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat namun mudah dipahami. Susunan klausa dibuat alami, sedangkan ambiguitas דלותי dipertahankan melalui pilihan utama yang cukup luas dan catatan kaki.
