source:
  edition: WLC
  text: הִגִּ֣ידוּ הַ/שָּׁמַ֣יִם צִדְק֑/וֹ וְ/רָא֖וּ כָל הָ/עַמִּ֣ים כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/006.yaml
  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: id
  text: Langit menyatakan kebenaran-Nya[a], dan segala bangsa melihat kemuliaan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan-Nya.” Istilah Ibrani ini dapat mencakup kebenaran maupun keadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: menyatakan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyatakan. Dalam puisi ini, "menyatakan" ringkas, alami, dan cocok untuk kesaksian langit.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Dalam konteks puisi dan penampakan ilahi, שָׁמַיִם menunjuk pada langit sebagai bagian dari ciptaan yang menjadi saksi; "langit" merupakan padanan Indonesia yang alami dan tetap luhur.
- source_word: צִדְקוֹ
  choice: kebenaran-Nya
  rationale: צֶדֶק mencakup kelurusan moral dan keadilan. "Kebenaran-Nya" dipilih sebagai padanan utama yang lazim dalam bahasa Alkitab Indonesia, sedangkan nuansa "keadilan-Nya" dipertahankan dalam catatan kaki.
- source_word: וְרָאוּ
  choice: dan ... melihat
  rationale: Bentuk perfektif Ibrani dapat mengungkapkan peristiwa yang telah tampak atau gambaran puitis yang hidup. Kala kini "melihat" selaras dengan pernyataan puitis yang berlaku umum tanpa menutup aspek perfektifnya.
- source_word: כָל הָעַמִּים
  choice: segala bangsa
  rationale: Bentuk jamak עַמִּים merujuk pada berbagai kelompok manusia. "Segala bangsa" lebih idiomatis dalam bahasa Indonesia daripada "segala kaum" dan menyampaikan cakupan universal tanpa harus berarti negara politik modern.
- source_word: כְּבוֹדוֹ
  choice: kemuliaan-Nya
  rationale: כָּבוֹד ketika dikenakan kepada Allah lazim menunjuk pada kemegahan-Nya yang nyata. "Kemuliaan-Nya" adalah padanan Indonesia yang mapan dan sesuai dengan laras agung mazmur.
theological_decisions:
- issue: Cakupan makna צִדְקוֹ sebagai sifat dan tindakan moral Allah
  choice: kebenaran-Nya
  alternative: keadilan-Nya
  rationale: Istilah Ibrani dapat menonjolkan baik kelurusan moral maupun keadilan dalam tindakan dan penghakiman. Teks utama memakai "kebenaran-Nya", sementara catatan kaki menjaga nuansa yudisial yang juga sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. Kapital pada pronomina ilahi mengikuti kebiasaan terjemahan Alkitab Indonesia dan membantu memperjelas rujukan tanpa menambah gelar yang tidak terdapat dalam teks sumber.
