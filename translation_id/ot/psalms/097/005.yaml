source:
  edition: WLC
  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: id
  text: Gunung-gunung meleleh seperti lilin di hadapan[a] Yahweh[b], di hadapan Tuhan seluruh bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini berarti “dari hadapan (atau wajah)”; di sini menunjuk pada dampak kehadiran ilahi.
    reason: lexical_alternative
  - marker: b
    text: Yahweh adalah transliterasi nama ilahi יְהוָה (YHWH).
    reason: alternative_reading
lexical_decisions:
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak tentu ini menunjuk pada gunung-gunung sebagai bagian dari tatanan ciptaan; pengulangan kata benda merupakan bentuk jamak yang alami dalam bahasa Indonesia.
- source_word: כַּדּוֹנַג
  choice: seperti lilin
  rationale: Prefiks כְּ menyatakan perbandingan. Ungkapan ini mempertahankan gambaran puitis bahwa gunung-gunung kehilangan kekokohannya seperti lilin yang mencair.
- source_word: נָמַסּוּ
  choice: meleleh
  rationale: Kata kerja ini berarti mencair atau luluh. Bentuk kini dipakai untuk menghadirkan secara hidup kuasa penampakan ilahi dalam puisi, tanpa memaksakan urutan waktu lampau.
- source_word: מִלִּפְנֵי
  choice: di hadapan
  rationale: Idiom Ibrani ini secara harfiah berkaitan dengan berada atau bergerak ‘dari hadapan/wajah’ seseorang. ‘Di hadapan’ paling alami dalam bahasa Indonesia dan menyampaikan bahwa gunung-gunung meleleh karena kehadiran ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar, sehingga nama pribadi yang terdapat dalam teks Ibrani tetap terlihat.
- source_word: אֲדוֹן
  choice: Tuhan
  rationale: Gelar ini berarti tuan atau penguasa. ‘Tuhan’ mempertahankan ragam bahasa yang agung dan paralel puitis dengan nama Yahweh.
- source_word: כָּל הָאָרֶץ
  choice: seluruh bumi
  rationale: Rangkaian konstruksi ini paling langsung dipahami sebagai ‘Tuhan seluruh bumi’, dengan cakupan universal tanpa menambahkan kata depan yang tidak dinyatakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama tersebut dan membedakannya dari gelar אֲדוֹן pada baris berikutnya.
- issue: Aspek kata kerja נָמַסּוּ dalam puisi
  choice: meleleh
  alternative: telah meleleh atau luluh
  rationale: Bentuk perfektif Ibrani dapat menggambarkan peristiwa secara hidup dalam puisi teofanik. Bentuk kini bahasa Indonesia menjaga daya gambarnya tanpa memastikan bahwa tindakan itu hanya berlangsung pada masa lampau.
- issue: Hubungan אֲדוֹן dengan כָּל הָאָרֶץ
  choice: Tuhan seluruh bumi
  alternative: Penguasa atas seluruh bumi
  rationale: Terjemahan ini mempertahankan hubungan genitif yang ringkas dalam teks dan tidak menambahkan penafsiran mengenai jenis kekuasaan yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis yang ringkas. Pengulangan ‘di hadapan’ dipertahankan untuk mencerminkan paralelisme Ibrani, sedangkan ‘meleleh seperti lilin’ menjaga citra konkret dan mudah dipahami.
