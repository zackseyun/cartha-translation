  text: אֵ֭שׁ לְ/פָנָ֣י/ו תֵּלֵ֑ךְ וּ/תְלַהֵ֖ט סָבִ֣יב צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/003.yaml
  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: id
  text: Api berjalan di hadapan-Nya dan menghanguskan para lawan-Nya di segala penjuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “musuh-musuh-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ
  choice: Api
  rationale: Nomina ini berarti api; tanpa artikel dalam puisi Ibrani, bentuk alami dalam bahasa Indonesia ialah "Api".
- source_word: לְפָנָיו
  choice: di hadapan-Nya
  rationale: Ungkapan dengan kata "wajah/hadir" berarti di depan atau di hadapan seseorang; pilihan ini ringkas, puitis, dan bermartabat.
- source_word: תֵּלֵךְ
  choice: berjalan
  rationale: הלך lazimnya berarti pergi atau berjalan. Dalam personifikasi puitis api, "berjalan" alami dan mempertahankan citraan gerak teks sumber.
- source_word: וּתְלַהֵט
  choice: menghanguskan
  rationale: Bentuk verba dari להב menyatakan nyala atau panas yang membakar. "Menghanguskan" menyampaikan daya rusaknya tanpa harus menambahkan aspek ketuntasan secara eksplisit.
- source_word: סָבִיב
  choice: di sekeliling-Nya
  rationale: Adverbia ini menyatakan daerah di sekitar. Sufiks pada "lawan-lawan-Nya" sudah menandai pemilik, sehingga secara sintaksis סָבִיב paling wajar dibaca secara adverbial sebagai "di sekeliling-Nya" dalam konteks teofani.
- source_word: צָרָיו
  choice: lawan-lawan-Nya
  rationale: Kata ini menunjuk kepada orang-orang yang memusuhi atau menentang-Nya. "Lawan-lawan" mempertahankan nuansa pertentangan; "musuh-musuh" tetap merupakan padanan yang sah.
theological_decisions:
- issue: Rujukan sufiks orang ketiga tunggal maskulin dalam konteks teofani Mazmur 97
  choice: Memakai pronomina "-Nya" dan tidak menyisipkan nama TUHAN.
  alternative: Api berjalan di hadapan TUHAN dan menghanguskan lawan-lawan-Nya di sekeliling-Nya.
  rationale: Teks Ibrani memakai sufiks pronominal, sedangkan konteks langsung sudah menunjukkan rujukannya. Mempertahankan pronomina menjaga alur puisi dan tidak menambahkan nomina yang tidak terdapat dalam ayat ini.
- issue: Hubungan סָבִיב dengan tindakan pembakaran
  choice: Memahaminya sebagai keterangan tempat, "di sekeliling-Nya".
  alternative: Menghanguskan semua lawan-Nya / menghanguskan lawan-lawan-Nya dari segala arah.
  rationale: Teks menyatakan bahwa api menghanguskan para lawan di sekitar; terjemahan tidak perlu mengubahnya menjadi klaim bahwa setiap lawan tanpa kecuali dihanguskan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Huruf kapital pada sufiks pronominal dipakai untuk memperjelas bahwa rujukannya adalah Allah sesuai konteks, tanpa mengganti pronomina dengan nama ilahi.
