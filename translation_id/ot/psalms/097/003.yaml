  naturalness: '"Api berjalan di hadapan-Nya" dapat diterima sebagai personifikasi puitis yang setia pada verba Ibrani. "Para lawan-Nya" lebih alami dalam bahasa Indonesia modern daripada reduplikasi "lawan-lawan-Nya". "Di segala penjuru" merupakan ungkapan baku dan puitis untuk cakupan סָבִיב.'
  terminology: '"Menghanguskan" secara tepat menyampaikan daya membakar dari להב tanpa secara niscaya menambahkan hasil tuntas. "Lawan" mempertahankan nuansa pihak yang menentang; catatan "musuh-musuh-Nya" merupakan alternatif leksikal yang sah. Kapitalisasi -Nya konsisten dengan rujukan ilahi yang jelas dari konteks.'
