  text: א֭וֹר זָרֻ֣עַ לַ/צַּדִּ֑יק וּֽ/לְ/יִשְׁרֵי לֵ֥ב שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/011.yaml
  text: Light is sown for the righteous[a], and joy for the upright in heart.
translation:
  language: id
  text: Terang ditaburkan bagi orang benar[a], dan sukacita bagi orang yang tulus hati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Terang ditanam bagi orang benar.” Bahasa Ibrani mempertahankan metafora pertanian: terang digambarkan sebagai sesuatu yang ditaburkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: Terang
  rationale: Mempertahankan metafora puitis yang dapat mencakup berkat, keselamatan, atau kelepasan tanpa mempersempit maknanya.
- source_word: זָרֻעַ
  choice: ditaburkan
  rationale: Partisip pasif dari זרע secara harfiah menggambarkan tindakan menabur; pilihan ini mempertahankan metafora pertanian dalam teks Ibrani.
- source_word: לַצַּדִּיק
  choice: bagi orang benar
  rationale: Preposisi ל menyatakan peruntukan atau manfaat, sedangkan bentuk tunggal generik צַדִּיק diterjemahkan secara alami sebagai 'orang benar'.
- source_word: וּלְיִשְׁרֵי לֵב
  choice: dan sukacita bagi orang yang tulus hati
  rationale: Ungkapan יִשְׁרֵי לֵב menunjuk kepada mereka yang lurus atau tulus dalam batin. Susunan Indonesia disesuaikan secara alami sambil mempertahankan kesejajaran dengan bagian pertama.
- source_word: שִׂמְחָה
  choice: sukacita
  rationale: '''Sukacita'' merupakan padanan yang alami dan bermartabat serta sesuai dengan kesejajaran puitis bersama ''terang''.'
theological_decisions:
- issue: Makna metaforis 'terang'
  choice: Metafora 'Terang ditaburkan' dipertahankan tanpa ditafsirkan secara eksplisit sebagai keselamatan, kemakmuran, atau pembenaran.
  alternative: Terang tersedia bagi orang benar; kelepasan disediakan bagi orang benar.
  rationale: Teks puitis ini membiarkan cakupan metafora tetap luas. Terjemahan tidak seharusnya menyelesaikan ketegangan makna yang sengaja dibiarkan terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. 'Ditaburkan' sengaja dipertahankan meskipun metaforis agar citra asli tidak diratakan.
