  yaml_path: translation/ot/psalms/097/004.yaml
  text: His lightning lights up the world[a]; the earth sees and trembles.
translation:
  language: id
  text: Kilat-Nya menerangi dunia; bumi melihat dan gemetar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bumi melihat dan berguncang.” Kata kerja Ibrani dapat berarti gemetar, menggeliat, atau berguncang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאִירוּ
  choice: menerangi
  rationale: Bentuk Hifil menyatakan tindakan menyebabkan terang; bersama kilat sebagai subjek, “menerangi” menyampaikan makna kausatif secara alami.
- source_word: בְרָקָיו
  choice: kilat-Nya
  rationale: Nomina jamak bersufiks orang ketiga maskulin tunggal menunjuk pada kilat milik Allah. Dalam bahasa Indonesia, “kilat” lazim dipakai sebagai nomina kolektif tanpa harus menandai bentuk jamak.
- source_word: תֵּבֵל
  choice: dunia
  rationale: תֵּבֵל menunjuk pada dunia, khususnya dunia yang dihuni, dan dibedakan dari הָאָרֶץ pada klausa berikutnya.
- source_word: רָאֲתָה
  choice: melihatnya
  rationale: Bentuk qatal orang ketiga feminin tunggal secara harfiah berarti “melihat”. Akhiran “-nya” memperjelas bahwa yang dilihat bumi ialah penampakan kilat tersebut, tanpa mengubah personifikasi puitis.
- source_word: וַתָּחֵל
  choice: dan gemetar
  rationale: Kata kerja dari חול/חיל dapat menggambarkan gemetar, menggeliat, atau berguncang. “Gemetar” mempertahankan gambaran respons bumi tanpa membatasi makna pada gerak seismik.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam kesejajaran dengan תֵּבֵל dan konteks penampakan ilahi yang kosmis, kata ini menunjuk pada bumi, bukan sekadar suatu negeri.
theological_decisions:
- issue: Cakupan kosmis penampakan Allah
  choice: “dunia” dan “bumi” dipertahankan sebagai dua istilah yang saling melengkapi
  alternative: Menerjemahkan הָאָרֶץ sebagai “negeri” dan membatasi cakupannya secara lokal
  rationale: Kesejajaran puitis dan konteks teofani dalam mazmur mendukung cakupan universal, tanpa menambahkan pernyataan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. Personifikasi bumi dipertahankan. Kapital pada “-Nya” mengikuti kebiasaan ejaan religius Indonesia untuk rujukan kepada Allah.
