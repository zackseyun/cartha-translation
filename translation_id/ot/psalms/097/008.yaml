source:
  edition: WLC
  text: שָׁמְעָ֬ה וַ/תִּשְׂמַ֨ח צִיּ֗וֹן וַ֭/תָּגֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְמַ֖עַן מִשְׁפָּטֶ֣י/ךָ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/008.yaml
  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
translation:
  language: id
  text: 'Sion mendengar dan bersukacita;

    putri-putri Yehuda[a] bersorak-sorai

    karena keputusan-keputusan-Mu, Ya, Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kota-kota Yehuda” atau “desa-desa Yehuda.” Dalam bahasa Ibrani ungkapan ini secara harfiah berarti “putri-putri Yehuda,” suatu ungkapan puitis yang dapat menunjuk pada komunitas-komunitas di wilayah Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה
  choice: mendengar
  rationale: Bentuk Qal perfektif orang ketiga feminin tunggal dengan Sion sebagai subjek. Bentuk lampau Ibrani dipertahankan tanpa menambahkan objek yang tidak dinyatakan.
- source_word: וַתִּשְׂמַח
  choice: dan bersukacita
  rationale: Kata שׂמח menyatakan kegembiraan. 'Bersukacita' alami dan tetap dapat dibedakan dari verba kegembiraan yang lebih kuat pada baris berikutnya.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Nama tempat dipertahankan dalam bentuk transliterasi Indonesia yang lazim, tanpa menggantinya dengan Yerusalem atau umatnya.
- source_word: וַתָּגֵלְנָה
  choice: bersorak-sorai
  rationale: Kata גיל menyiratkan kegembiraan yang meluap; 'bersorak-sorai' menyampaikan intensitas itu dan tidak sekadar mengulang 'bersukacita'.
- source_word: בְּנוֹת יְהוּדָה
  choice: putri-putri Yehuda
  rationale: Ungkapan harfiahnya adalah 'putri-putri Yehuda'. Bentuk puitis ini dipertahankan dalam teks utama, sedangkan kemungkinan makna geografisnya dijelaskan dalam catatan kaki.
- source_word: לְמַעַן
  choice: karena
  rationale: Dalam konteks ini, לְמַעַן menyatakan alasan bagi sukacita tersebut; 'karena' adalah padanan kausal yang wajar dalam bahasa Indonesia.
- source_word: מִשְׁפָּטֶיךָ
  choice: keputusan-keputusan-Mu
  rationale: Bentuk jamak מִשְׁפָּטֶיךָ dapat menunjuk pada keputusan atau tindakan hukum ilahi. 'Keputusan-keputusan-Mu' mempertahankan bentuk jamak dan nuansa yudisial tanpa mempersempitnya menjadi hukum tertulis saja.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh'; partikel 'ya' menandai sapaan langsung yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: ya Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan nama itu, sementara 'ya' menandai fungsi vokatif dalam ayat ini.
- issue: Apakah בְּנוֹת יְהוּדָה harus dipahami secara harfiah atau sebagai ungkapan geografis
  choice: putri-putri Yehuda
  alternative: kota-kota Yehuda atau desa-desa Yehuda
  rationale: Bahasa Ibraninya secara harfiah berbunyi 'putri-putri Yehuda', tetapi dalam puisi ungkapan tersebut dapat menunjuk pada komunitas-komunitas di wilayah Yehuda. Teks utama mempertahankan citra puitis dan catatan kaki menjaga kemungkinan geografisnya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Paralelisme puitis serta dua kata berbeda untuk sukacita dipertahankan; susunan baris membantu pembacaan sebagai puisi.
