  text: יְהוָ֣ה מָ֭לָךְ תָּגֵ֣ל הָ/אָ֑רֶץ יִ֝שְׂמְח֗וּ אִיִּ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/001.yaml
  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
translation:
  language: id
  text: Yahweh memerintah! Biarlah bumi bersukacita; biarlah banyak pulau bergembira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wilayah pesisir.” Istilah Ibrani ini dapat merujuk pada pulau-pulau atau wilayah pesisir maritim yang jauh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi Allah dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: מָלָךְ
  choice: memerintah sebagai Raja
  rationale: Bentuk qatal ini dapat menyatakan keadaan sebagai raja atau penobatan, tetapi dalam seruan mazmur ini pilihan tersebut menyampaikan pemerintahan-Nya yang sedang berlaku tanpa memastikan nuansa bahwa Ia baru saja menjadi Raja.
- source_word: תָּגֵל
  choice: biarlah ... bersukacita
  rationale: Bentuk imperfek feminin tunggal yang mengacu pada “bumi” dipahami secara volitif dalam konteks puisi, yaitu sebagai ajakan untuk bersukacita.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Cakupan universal mazmur kerajaan ini, khususnya paralelnya dengan banyak wilayah pesisir, lebih mendukung “bumi” daripada “negeri” atau “tanah”.
- source_word: יִשְׂמְחוּ
  choice: biarlah ... bergembira
  rationale: Sejajar dengan תָּגֵל, bentuk ini dipahami sebagai ajakan. “Bergembira” mempertahankan kesejajaran tanpa pengulangan kata yang kaku.
- source_word: אִיִּים
  choice: wilayah pesisir
  rationale: Istilah Ibrani ini dapat menunjuk pada pulau-pulau maupun kawasan pantai atau negeri-negeri maritim; “wilayah pesisir” menyampaikan cakupan geografisnya secara alami dalam bahasa Indonesia.
- source_word: רַבִּים
  choice: banyak
  rationale: Padanan kuantitatif langsung dan wajar yang menerangkan “wilayah pesisir”.
theological_decisions:
- issue: Cakupan pernyataan tentang pemerintahan Yahweh
  choice: Pernyataan universal bahwa Yahweh kini memerintah sebagai Raja atas bumi
  alternative: 'Pernyataan yang terbatas pada tanah Israel, atau rumusan penobatan ingresif: “Yahweh telah menjadi Raja”'
  rationale: Kesejajaran antara “bumi” dan “banyak wilayah pesisir” menunjukkan cakupan global. “Memerintah sebagai Raja” mempertahankan pernyataan tentang pemerintahan ilahi tanpa memaksakan tafsiran bahwa penobatan baru saja terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Tanda seru menandai proklamasi pembuka, sedangkan dua klausa dengan “biarlah” mempertahankan daya ajakan dan paralelisme puisi Ibrani.
