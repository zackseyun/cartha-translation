  text: שִׂמְח֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
translation:
  language: id
  text: Bersukacitalah dalam Yahweh, hai orang-orang benar, dan bersyukurlah mengingat[a] kekudusan-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersyukurlah ketika kekudusan-Nya disebut.” Kata זֵכֶר dapat berarti ingatan, kenangan atau peringatan, maupun penyebutan.'
    reason: lexical_alternative
  - marker: b
    text: Banyak terjemahan memakai “nama-Nya yang kudus,” dipengaruhi oleh ungkapan serupa dalam Mazmur. Namun, teks Ibrani di sini secara harfiah berbunyi “kekudusan-Nya” dan tidak memuat kata “nama.”
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Bersukacitalah
  rationale: Bentuk imperatif jamak dari שׂמח menyerukan tanggapan penuh sukacita. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: צַדִּיקִים
  choice: hai orang-orang benar
  rationale: Kata benda/adjektiva jamak ini berfungsi sebagai sapaan kepada kelompok yang bercirikan kebenaran. Kata 'hai' memperjelas fungsi vokatifnya.
- source_word: בַּיהוָה
  choice: dalam Yahweh
  rationale: Preposisi ב dapat menandai lingkup atau sasaran sukacita. 'Dalam Yahweh' mempertahankan bentuk ungkapan Ibrani tanpa mempersempitnya menjadi semata-mata 'karena Yahweh'.
- source_word: יהוה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', sesuai dengan bentuk nama yang terdapat langsung dalam teks Ibrani.
- source_word: וְהוֹדוּ
  choice: dan bersyukurlah
  rationale: Imperatif jamak Hifil dari ידה dalam konteks mazmur paling wajar menyatakan ucapan syukur atau pujian. 'Bersyukurlah' ringkas, alami, dan mempertahankan bentuk perintah.
- source_word: לְזֵכֶר
  choice: ketika mengingat
  rationale: Nomina זֵכֶר dapat berarti ingatan, peringatan, atau penyebutan. Bentuk verbal 'ketika mengingat' menyampaikan makna utama secara alami dalam bahasa Indonesia, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: קָדְשׁוֹ
  choice: kekudusan-Nya
  rationale: Secara harfiah berarti 'kekudusan-Nya'. Terjemahan ini tidak menambahkan kata 'nama', yang tidak terdapat dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Apakah kata 'nama' perlu ditambahkan pada קָדְשׁוֹ
  choice: kekudusan-Nya
  alternative: nama-Nya yang kudus
  rationale: Walaupun ungkapan 'nama-Nya yang kudus' dikenal dari bagian-bagian mazmur yang serupa, ayat ini tidak memuat שֵׁם ('nama'). Karena itu, teks utama mempertahankan bentuk harfiahnya dan mencatat ungkapan tradisional sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan 'hai orang-orang benar' mempertahankan seruan langsung, sedangkan 'ketika mengingat' menghindari kekakuan ungkapan nominal tanpa menutupi rentang makna זֵכֶר.
