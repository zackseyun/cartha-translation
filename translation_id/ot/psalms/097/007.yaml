  text: יֵבֹ֤שׁוּ כָּל עֹ֬בְדֵי פֶ֗סֶל הַ/מִּֽתְהַלְלִ֥ים בָּ/אֱלִילִ֑ים הִשְׁתַּחֲווּ ל֝/וֹ כָּל אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: id
  text: 'Semua orang yang mengabdi kepada patung pahatan akan dipermalukan,

    semua yang bermegah karena berhala;

    bersujudlah kepada-Nya, hai semua ilah.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua makhluk surgawi” atau “semua malaikat”. Teks Ibrani berbunyi “semua ilah”, yang mungkin merupakan rujukan polemis kepada dewa-dewa bangsa-bangsa atau rujukan kepada makhluk-makhluk surgawi yang hadir di hadapan TUHAN.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: biarlah ... dipermalukan
  rationale: Kata kerja בוש menyatakan rasa malu atau kehinaan. Bentuk ini dalam konteks puitis dapat dipahami sebagai seruan; “biarlah ... dipermalukan” mempertahankan nuansa itu sekaligus menyiratkan kehinaan yang tampak di hadapan umum.
- source_word: עֹבְדֵי
  choice: orang yang mengabdi kepada
  rationale: Partisip dari עבד menunjuk kepada orang-orang yang melayani atau beribadah. “Mengabdi kepada” mempertahankan gagasan pelayanan, sedangkan konteks objek pemujaan memperjelas makna ibadahnya.
- source_word: פֶסֶל
  choice: patung pahatan
  rationale: פֶסֶל secara khusus menunjuk kepada patung atau gambar yang dibentuk dengan dipahat. Pilihan ini lebih tepat daripada istilah umum “berhala” dan tetap wajar dalam bahasa Indonesia.
- source_word: הַמִּתְהַלְלִים
  choice: yang bermegah
  rationale: Bentuk hitpael dari הלל di sini menyatakan tindakan membanggakan diri atau bermegah. “Bermegah” sesuai dengan gaya puisi yang khidmat dan tetap mudah dipahami.
- source_word: בָּאֱלִילִים
  choice: karena berhala
  rationale: אֱלִילִים menunjuk kepada berhala dan dapat mengandung nada merendahkan sebagai sesuatu yang sia-sia. Preposisi ב menandai hal yang menjadi dasar kebanggaan; “karena berhala” mengungkapkannya secara alami dalam bahasa Indonesia.
- source_word: הִשְׁתַּחֲווּ
  choice: bersujudlah
  rationale: Imperatif שׁחה menyatakan tindakan membungkuk atau merebahkan diri sebagai penghormatan. “Bersujudlah” mempertahankan unsur jasmani sekaligus makna pemujaannya.
- source_word: לוֹ
  choice: kepada-Nya
  rationale: Preposisi ל dengan pronomina paling langsung berarti “kepada-Nya”. Huruf kapital menandai bahwa pronomina ini merujuk kepada TUHAN dalam konteks mazmur.
- source_word: אֱלֹהִים
  choice: ilah
  rationale: Bentuk jamak אֱלֹהִים secara harfiah berarti “ilah-ilah”. Setelah kata “semua”, bahasa Indonesia tidak memerlukan pengulangan bentuk jamak. “Ilah” mempertahankan ungkapan Ibrani dan ketegangan mengenai apakah yang dimaksud adalah dewa-dewa bangsa lain atau makhluk surgawi.
theological_decisions:
- issue: Rujukan כָּל אֱלֹהִים
  choice: semua ilah
  alternative: semua makhluk surgawi; semua malaikat
  rationale: Teks Ibrani secara harfiah berbunyi “semua ilah”. Dalam konteks ini ungkapan tersebut dapat menjadi polemik terhadap dewa-dewa bangsa lain atau menunjuk kepada makhluk-makhluk surgawi di hadapan TUHAN. Teks utama mempertahankan ungkapan literal, sementara kemungkinan lain dicatat dalam catatan kaki agar ketegangan teologisnya tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan larik puitis yang ringkas dan khidmat. “Patung pahatan” membedakan פֶסֶל dari אֱלִילִים (“berhala”), sedangkan “bersujudlah” mempertahankan citra tindakan fisik dalam teks sumber.
