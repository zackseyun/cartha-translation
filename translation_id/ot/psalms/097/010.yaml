id: PSA.97.10
reference: Psalms 97:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: id
  text: Kalian yang mengasihi Yahweh, bencilah kejahatan! Ia menjaga hidup orang-orang yang setia kepada-Nya[a]; dari tangan orang-orang fasik Ia menyelamatkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwa orang-orang saleh-Nya.” Kata Ibrani nefasyot dapat berarti “hidup,” “nyawa,” “diri,” atau “jiwa”; kata khasidaw dapat diterjemahkan “orang-orang yang setia kepada-Nya,” “orang-orang saleh-Nya,” atau “orang-orang kudus-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: Kalian yang mengasihi Yahweh
  rationale: Frasa konstruksi ini secara harfiah menunjuk kepada orang-orang yang mengasihi Yahweh. Bentuk sapaan dengan “kalian” memperjelas fungsi vokatif dan sesuai dengan imperatif jamak yang menyusul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar, sehingga identitas personal dalam teks Ibrani tetap tampak.
- source_word: שִׂנְאוּ
  choice: bencilah
  rationale: Imperatif orang kedua jamak ini merupakan perintah langsung. “Bencilah” mempertahankan daya perintah dan tidak memperlunak maknanya.
- source_word: רָע
  choice: kejahatan
  rationale: Kata sifat tunggal ini dipakai secara substantival dan menunjuk kepada kejahatan sebagai kategori moral yang luas.
- source_word: שֹׁמֵר
  choice: Ia menjaga
  rationale: Partisip ini menggambarkan tindakan Yahweh yang menjadi ciri-Nya. “Menjaga” menyampaikan perlindungan yang selaras dengan klausa penyelamatan berikutnya.
- source_word: נַפְשׁוֹת
  choice: hidup
  rationale: Dalam konteks perlindungan dari orang fasik, bentuk jamak נֶפֶשׁ paling wajar menunjuk kepada hidup atau nyawa, bukan secara khusus unsur jiwa yang tak berjasad.
- source_word: חֲסִידָיו
  choice: orang-orang yang setia kepada-Nya
  rationale: Istilah ini menunjuk kepada mereka yang bercirikan kesetiaan dan kesalehan dalam hubungan dengan Allah. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan dimensi relasionalnya.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan harfiah Ibrani mempertahankan citra “tangan” sebagai kuasa atau kendali dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk substantif jamak ini menunjuk kepada orang-orang yang bersalah secara moral. “Fasik” merupakan padanan Alkitabiah Indonesia yang ringkas dan bermartabat.
- source_word: יַצִּילֵם
  choice: Ia menyelamatkan mereka
  rationale: Bentuk Hifil dari נצל menyatakan tindakan melepaskan atau menyelamatkan dari kuasa pihak lain; padanan ini alami dengan frasa “dari tangan”.
theological_decisions:
- issue: Makna נַפְשׁוֹת dalam konteks
  choice: hidup
  alternative: jiwa; nyawa; diri
  rationale: Konteks berbicara tentang penjagaan dan penyelamatan dari tangan orang fasik, sehingga makna konkret “hidup” paling sesuai. Pilihan ini tidak memasukkan pandangan antropologis yang tidak dinyatakan teks.
- issue: Terjemahan חֲסִידָיו
  choice: orang-orang yang setia kepada-Nya
  alternative: orang-orang saleh-Nya; orang-orang kudus-Nya; orang-orang yang dikasihi-Nya
  rationale: Kata ini membawa nuansa kesetiaan dan kesalehan dalam hubungan perjanjian. Terjemahan yang dipilih dapat dipahami pembaca modern tanpa membatasi istilah itu pada kategori gerejawi tertentu.
- issue: Rujukan subjek שֹׁמֵר dan יַצִּילֵם
  choice: Yahweh sebagai subjek tersirat, diterjemahkan “Ia”
  alternative: mengulang nama “Yahweh”
  rationale: Walaupun nama Yahweh tidak diulang dalam klausa-klausa ini, konteks dan bentuk maskulin tunggal menunjukkan bahwa Dialah yang menjaga dan menyelamatkan. Kata ganti mempertahankan kesinambungan alami tanpa menambah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “kalian” dipakai untuk menandai orang kedua jamak secara jelas; “bencilah” mempertahankan kekuatan imperatif. Paralelisme dan citra Ibrani “dari tangan” dipertahankan.
