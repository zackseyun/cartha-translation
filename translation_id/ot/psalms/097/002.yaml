source:
  edition: WLC
  text: עָנָ֣ן וַ/עֲרָפֶ֣ל סְבִיבָ֑י/ו צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט מְכ֣וֹן כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/002.yaml
  text: Clouds and thick darkness are around him[a]; righteousness and justice are the foundation of his throne.
translation:
  language: id
  text: Awan dan kegelapan pekat mengelilingi Dia[a]; kebenaran dan keadilan adalah dasar takhta-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Awan dan kesuraman ada di sekeliling-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנָן
  choice: awan
  rationale: Nomina tunggal ini dapat berfungsi secara kolektif dalam puisi. Bahasa Indonesia secara alami memakai “awan” tanpa penanda jumlah, sehingga bentuk dan citranya tetap terpelihara.
- source_word: וַעֲרָפֶל
  choice: dan kegelapan pekat
  rationale: עֲרָפֶל menunjuk pada kesuraman, awan gelap, atau kegelapan yang tebal, terutama dalam konteks penampakan ilahi. “Kegelapan pekat” mempertahankan bobot gambaran itu.
- source_word: סְבִיבָיו
  choice: mengelilingi Dia
  rationale: Secara harfiah berarti “di sekeliling-Nya.” Pemakaian verba “mengelilingi” menghasilkan kalimat Indonesia yang alami tanpa mengubah hubungan spasialnya.
- source_word: צֶדֶק
  choice: kebenaran
  rationale: Dalam pasangan dengan מִשְׁפָּט, “kebenaran” mempertahankan unsur kelurusan moral dan membedakannya dari keadilan yudisial.
- source_word: וּמִשְׁפָּט
  choice: dan keadilan
  rationale: מִשְׁפָּט dapat berarti keputusan hukum, penghakiman, atau keadilan. “Keadilan” paling sesuai dengan citra pemerintahan dan berpasangan alami dengan “kebenaran.”
- source_word: מְכוֹן
  choice: dasar
  rationale: Nomina ini menyatakan tempat yang kukuh, landasan, atau dasar. “Dasar” ringkas, alami, dan tepat dalam hubungan dengan takhta.
- source_word: כִּסְאוֹ
  choice: takhta-Nya
  rationale: Bentuk bersufiks ini berarti “takhta-Nya” dan melengkapi rantai konstruksi “dasar takhta-Nya.”
theological_decisions:
- issue: Gambaran teofani tentang ketersembunyian ilahi
  choice: Mempertahankan gambaran awan dan kegelapan pekat yang mengelilingi Allah.
  alternative: Menafsirkannya secara abstrak sebagai kemegahan atau misteri yang mengelilingi-Nya.
  rationale: Teks menyandingkan pemerintahan Allah dengan gambaran penampakan ilahi yang sekaligus menyatakan dan menyelubungi kehadiran-Nya. Ketegangan ini tidak dijelaskan secara parafrastis.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, lugas, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
