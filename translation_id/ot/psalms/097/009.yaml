  text: כִּֽי אַתָּ֤ה יְהוָ֗ה עֶלְי֥וֹן עַל כָּל הָ/אָ֑רֶץ מְאֹ֥ד נַ֝עֲלֵ֗יתָ עַל כָּל אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/009.yaml
  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
translation:
  language: id
  text: Sebab Engkau, ya Yahweh, adalah Yang Mahatinggi atas seluruh bumi; Engkau sangat ditinggikan di atas segala ilah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua makhluk ilahi” atau “semua makhluk surgawi.” Kata Ibrani elohim dapat menunjuk kepada ilah-ilah, makhluk ilahi, atau kuasa surgawi, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan pernyataan sebelumnya sebagai dasar atau alasannya; bentuk ini wajar dalam puisi Indonesia dan mempertahankan alur argumentatif.
- source_word: אַתָּה
  choice: Engkau
  rationale: Pronomina eksplisit dipertahankan untuk menonjolkan Yahweh sendiri sebagai pihak yang mahatinggi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga identitas personal dalam teks Ibrani tetap terlihat.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Ungkapan baku dan bermartabat yang menyatakan kedudukan tertinggi serta cocok sebagai predikat bagi Yahweh.
- source_word: עַל כָּל הָאָרֶץ
  choice: atas seluruh bumi
  rationale: Menyatakan supremasi atas segenap bumi; 'seluruh bumi' alami dalam bahasa Indonesia dan mencakup keseluruhan dunia.
- source_word: מְאֹד
  choice: sangat
  rationale: Mempertahankan fungsi adverbial yang menguatkan verba berikut tanpa menambahkan gagasan yang tidak tersurat.
- source_word: נַעֲלֵיתָ
  choice: Engkau sangat ditinggikan
  rationale: Bentuk pasif/resultatif dari עלה diterjemahkan secara dekat, menyatakan keadaan Yahweh yang berada pada kedudukan luhur.
- source_word: עַל כָּל אֱלֹהִים
  choice: di atas segala ilah
  rationale: '''Ilah'' mempertahankan bentuk jamak dan daya polemis teks, sambil tidak memastikan apakah acuannya dewa-dewa, makhluk ilahi, atau kuasa surgawi.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Nama diri dipertahankan melalui transliterasi agar tidak dilebur menjadi gelar.
- issue: Makna אֱלֹהִים pada klausa terakhir
  choice: segala ilah
  alternative: semua makhluk ilahi atau semua makhluk surgawi
  rationale: Pilihan ini mempertahankan makna jamak yang langsung dan ketegangan teologis teks tanpa menetapkan identitas para acuannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan 'Engkau' serta seruan 'ya Yahweh' mempertahankan nada ibadah yang khidmat; 'ilah' dipilih untuk membedakannya dari Allah sebagai nama/sebutan bagi Tuhan dalam pemakaian Indonesia.
