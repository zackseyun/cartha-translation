source:
  edition: WLC
  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: id
  text: Nantikanlah Yahweh; kuatlah, dan hendaklah hatimu menjadi teguh[a]. Ya, nantikanlah[b] Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan Ia akan meneguhkan hatimu.” Bentuk verba Ibrani dapat dipahami sebagai janji atau pernyataan tentang apa yang akan dilakukan Yahweh, bukan sebagai kelanjutan nasihat.
    reason: alternative_reading
  - marker: b
    text: “Nantikanlah” juga dapat diterjemahkan “berharaplah kepada”; kata Ibrani ini menyatakan penantian yang penuh harapan dan kepercayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: nantikanlah / ya, nantikanlah
  rationale: Bentuk piel imperatif dari קוה menyatakan penantian yang disertai harapan dan kepercayaan. “Nantikanlah” mempertahankan unsur menunggu dengan penuh pengharapan, sedangkan pengulangan pada akhir ayat dipertahankan sebagai penegasan puitis.
- source_word: אֶל
  choice: Yahweh sebagai objek langsung dari “nantikanlah”
  rationale: Dalam bahasa Indonesia, verba “menantikan” secara alami langsung diikuti objek; karena itu, makna arah pengharapan yang ditandai אֶל disampaikan tanpa preposisi tersendiri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam Tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: חֲזַק
  choice: kuatlah
  rationale: Imperatif ini merupakan seruan langsung agar pembaca tetap kuat, tanpa membatasi jenis kekuatan yang dimaksud.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: dan hendaklah hatimu teguh
  rationale: Terjemahan ini mempertahankan alur nasihat dalam rangkaian imperatif serta menyebut “hatimu” secara eksplisit. Bentuk verba juga dapat dipahami secara prediktif dengan subjek tersirat; kemungkinan itu dicatat dalam catatan kaki.
- source_word: לִבֶּךָ
  choice: hatimu
  rationale: “Hati” menunjuk pada batin, tekad, dan keberanian seseorang. Metafora sumber tetap jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama pribadi ilahi. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Daya sintaksis וְיַאֲמֵץ
  choice: 'Nasihat berdaya yusif: “dan hendaklah hatimu teguh”'
  alternative: 'Prediksi/janji: “dan Ia akan meneguhkan hatimu”'
  rationale: Konteks langsung berupa rangkaian seruan mendukung kelanjutan nasihat. Namun, bentuk verba orang ketiga maskulin tunggal memungkinkan pembacaan prediktif dengan Yahweh sebagai subjek tersirat, sehingga alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pengulangan imperatif dipertahankan, dan “Ya” menandai penegasan pada baris penutup tanpa menghilangkan kesejajaran Ibraninya.
