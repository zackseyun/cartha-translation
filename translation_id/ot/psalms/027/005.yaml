source:
  edition: WLC
  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: id
  text: Sebab pada hari malapetaka[a] Ia akan menyembunyikan aku dalam pondok-Nya[b]; Ia akan menyembunyikan aku di tempat tersembunyi dalam kemah-Nya; Ia akan mengangkat aku tinggi di atas batu karang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada hari kesusahan,” “pada hari kemalangan,” atau, lebih harfiah, “pada hari kejahatan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam naungan-Nya,” “dalam paviliun-Nya,” atau “dalam kemah suci-Nya.” Kata Ibrani ini menunjuk pada struktur perlindungan seperti pondok dan mungkin memiliki nuansa tempat kudus.
    reason: lexical_alternative
  - marker: c
    text: Atau “Ia akan menempatkan aku di tempat tinggi di atas batu karang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan dasar keyakinan pemazmur dalam konteks sebelumnya; “Sebab” mempertahankan hubungan penjelas tersebut.
- source_word: יִצְפְּנֵנִי
  choice: Ia akan menyembunyikan aku
  rationale: Bentuk dari צפן menyatakan tindakan menyembunyikan demi perlindungan; pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: בְּסֻכּוֹ
  choice: dalam pondok-Nya
  rationale: סֻכָּה menunjuk pada bangunan perlindungan seperti pondok atau naungan. “Pondok” mempertahankan gambaran konkretnya tanpa menjadikannya secara eksplisit istilah peribadatan.
- source_word: בְּיוֹם רָעָה
  choice: pada hari malapetaka
  rationale: Dalam konteks ini רָעָה menunjuk pada kesusahan atau bencana, bukan terutama kejahatan moral. “Hari malapetaka” menyampaikan ancaman berat dengan bahasa Indonesia yang wajar.
- source_word: יַסְתִּרֵנִי
  choice: Ia akan menempatkan aku tersembunyi
  rationale: Bentuk dari סתר kembali menyatakan penyembunyian. Ungkapan ini mempertahankan kesejajaran dengan verba sebelumnya tanpa menghasilkan pengulangan yang kaku.
- source_word: בְּסֵתֶר אָהֳלוֹ
  choice: di tempat rahasia dalam kemah-Nya
  rationale: סֵתֶר adalah tempat tersembunyi atau rahasia, sedangkan אֹהֶל secara konkret berarti kemah. Susunan ini mempertahankan citra ruang perlindungan milik Allah.
- source_word: בְּצוּר
  choice: di atas batu karang
  rationale: צוּר menunjuk pada batu besar atau tebing batu yang memberi gambaran tempat aman dan tinggi.
- source_word: יְרוֹמְמֵנִי
  choice: Ia akan mengangkat aku tinggi
  rationale: Verba רום berarti meninggikan atau mengangkat ke tempat tinggi; terjemahan ini mempertahankan citra vertikal penyelamatan dan keamanan.
theological_decisions:
- issue: Kemungkinan nuansa tempat kudus dalam סֻכּוֹ dan אָהֳלוֹ
  choice: Memakai “pondok-Nya” dan “kemah-Nya” sebagai gambaran konkret perlindungan Allah.
  alternative: Menerjemahkan dengan istilah yang secara eksplisit menunjuk pada Kemah Suci atau tempat ibadah.
  rationale: Kedua kata Ibrani adalah nomina umum yang dapat memiliki gema tempat kudus dalam konteks mazmur, tetapi ayat ini tidak mengharuskan pembaca membatasinya pada bangunan peribadatan resmi.
- issue: Makna רָעָה dalam frasa בְּיוֹם רָעָה
  choice: Memahaminya sebagai malapetaka atau kesusahan.
  alternative: Memahaminya sebagai kejahatan moral.
  rationale: Konteksnya adalah perlindungan pemazmur dari ancaman dan kesesakan, sehingga makna situasional berupa bencana atau kemalangan lebih sesuai.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Urutan keterangan waktu dipindahkan ke awal klausa agar alami dalam bahasa Indonesia, tanpa mengubah hubungan makna. Dua verba penyembunyian tetap dibedakan secara halus, dan citra pondok, kemah, serta batu karang dipertahankan.
