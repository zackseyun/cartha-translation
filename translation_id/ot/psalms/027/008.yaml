id: PSA.27.8
reference: Psalms 27:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/ךָ֤ אָמַ֣ר לִ֭בִּ/י בַּקְּשׁ֣וּ פָנָ֑/י אֶת פָּנֶ֖י/ךָ יְהוָ֣ה אֲבַקֵּֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: id
  text: Atas nama-Mu hatiku berkata[a], “Carilah wajah-Ku.” Wajah-Mu, ya Yahweh, kucari[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pembukaan bahasa Ibrani sulit dipahami. Ungkapan ini juga dapat diterjemahkan, “Kepada-Mu hatiku berkata,” atau, dengan memahami hubungan katanya sedikit berbeda, “Tentang Engkau hatiku berkata, ‘Carilah wajah-Nya.’”
    reason: alternative_reading
  - marker: b
    text: Atau “Hadirat-Mu, ya Yahweh, kucari.” Dalam bahasa Ibrani, “wajah” sering mengandung arti kehadiran pribadi.
    reason: lexical_alternative
  - marker: c
    text: Atau “akan kucari.” Kata kerja Ibraninya dapat menyatakan tekad pada masa kini atau maksud untuk masa mendatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: Atas nama-Mu
  rationale: Bentuk datif ini sulit ditafsirkan. Pilihan ini menyampaikan bahwa hati pemazmur menyuarakan panggilan yang berasal dari atau mewakili Yahweh, sambil mempertahankan kejanggalan puitis teks; kemungkinan konstruksi lain dicatat dalam catatan kaki.
- source_word: אָמַר לִבִּי
  choice: hatiku berkata
  rationale: Walaupun אָמַר berbentuk qatal, dalam puisi bentuk ini dapat menyatakan perkataan batin yang tetap berlangsung atau berlaku sekarang. Bentuk kini juga terdengar alami dalam bahasa Indonesia.
- source_word: בַּקְּשׁוּ
  choice: Carilah
  rationale: Imperatif jamak dari בקשׁ diterjemahkan sebagai perintah langsung. Bahasa Indonesia tidak menandai jumlah pada bentuk imperatif ini.
- source_word: פָנָי / פָּנֶיךָ
  choice: wajah-Ku / Wajah-Mu
  rationale: Terjemahan harfiah 'wajah' mempertahankan pengulangan kata Ibrani dan gambaran relasionalnya. Makna idiomatis 'hadirat' diberikan sebagai alternatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri Yahweh, bukan diganti dengan gelar TUHAN.
- source_word: אֲבַקֵּשׁ
  choice: kucari
  rationale: Bentuk imperfect orang pertama tunggal dapat menyatakan tekad kini maupun maksud mendatang. 'Kucari' cocok dengan jawaban langsung pemazmur, sedangkan nuansa mendatang dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan klausa pembuka לְךָ אָמַר לִבִּי
  choice: 'Hati pemazmur menyuarakan panggilan Yahweh: “Atas nama-Mu hatiku berkata, ‘Carilah wajah-Ku.’”'
  alternative: “Kepada-Mu hatiku berkata”; atau, dengan hubungan sintaksis yang sedikit berbeda, “Tentang Engkau hatiku berkata, ‘Carilah wajah-Nya.’”
  rationale: Sintaksis Ibraninya eliptis dan sungguh ambigu. Teks utama mempertahankan pembacaan Masoret bahwa panggilan Allah bergema dalam hati pemazmur, sedangkan pembacaan lain disajikan tanpa memaksakan satu penyelesaian.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. Transliterasi mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Arti teologis פָּנִים dalam tindakan mencari Allah
  choice: wajah
  alternative: hadirat
  rationale: '''Wajah'' mempertahankan citra dan pengulangan sumber, sementara ''hadirat'' mengungkapkan implikasi idiomatisnya. Catatan kaki menjaga kedua dimensi itu tanpa menyamakan keduanya secara mutlak.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapital pada pronomina yang merujuk kepada Allah dipakai demi kejelasan dalam dialog yang berganti persona. Bentuk ringkas 'kucari' menjaga irama dan penekanan objek di awal klausa.
