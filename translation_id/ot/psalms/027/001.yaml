base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: id
  text: 'Dari Daud.[a]


    Yahweh adalah terangku dan keselamatanku;

    siapakah yang akan kutakuti?

    Yahweh adalah benteng bagi hidupku;

    terhadap siapakah aku akan gentar?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Oleh Daud” atau “Untuk Daud”. Ungkapan Ibrani לְדָוִד dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Konstruksi לְדָוִד pada judul mazmur dapat menunjukkan kepengarangan, hubungan, atau peruntukan. “Dari Daud” alami sebagai judul singkat dalam bahasa Indonesia sambil tidak menegaskan kepengarangan secara mutlak; keragaman maknanya dijelaskan dalam catatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: אוֹרִי
  choice: terangku
  rationale: Metafora harfiah “terangku” jelas dan alami dalam bahasa Indonesia sehingga tidak perlu ditafsirkan menjadi tuntunan atau harapan.
- source_word: וְיִשְׁעִי
  choice: dan keselamatanku
  rationale: Kata יֵשַׁע menyatakan keselamatan atau pembebasan. “Keselamatanku” mempertahankan keluasan makna pertolongan dan keamanan.
- source_word: מִמִּי אִירָא
  choice: siapakah yang harus kutakuti?
  rationale: Pertanyaan retoris ini diungkapkan secara idiomatis dalam bahasa Indonesia. “Harus” menyampaikan nuansa modal dari bentuk imperfek tanpa mengubah keyakinan pemazmur.
- source_word: מָעוֹז חַיַּי
  choice: benteng hidupku
  rationale: מָעוֹז menunjuk pada tempat atau sumber kekuatan dan perlindungan. “Benteng hidupku” mempertahankan citra pertahanan serta hubungan konstruksi dengan “hidupku” secara ringkas dan puitis.
- source_word: מִמִּי אֶפְחָד
  choice: terhadap siapakah aku harus gentar?
  rationale: “Gentar” membedakan פחד dari kata “takut” pada baris sebelumnya dan dapat menyampaikan nuansa rasa ngeri atau gentar, sementara “terhadap” mencerminkan preposisi מן secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Hubungan Daud dengan mazmur dalam לְדָוִד
  choice: Dari Daud, dengan catatan mengenai ambiguitas
  alternative: Oleh Daud; Untuk Daud
  rationale: Preposisi לְ dalam judul mazmur dapat menandai kepengarangan, hubungan, atau peruntukan. Terjemahan utama dibuat ringkas, sedangkan catatan menjaga rentang kemungkinan sumber.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat dengan paralelisme puitis dipertahankan. Bentuk enklitik “-ku” menjaga keringkasan dan keintiman puisi. Nama Yahweh ditampilkan langsung sesuai teks sumber.
