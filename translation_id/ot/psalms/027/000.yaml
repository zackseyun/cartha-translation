  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: id
  text: 'Dari Daud.[a]


    Yahweh adalah terangku dan keselamatanku;

    siapakah yang harus kutakuti?

    Yahweh adalah benteng hidupku;

    terhadap siapakah aku harus gentar?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Oleh Daud” atau “Untuk Daud.” Dalam judul mazmur ini, frasa Ibrani לְדָוִד dapat menunjukkan kepengarangan atau hubungan dengan Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan pada judul mazmur ini dapat menyatakan kepengarangan atau hubungan dengan Daud. 'Dari Daud' alami dalam bahasa Indonesia sambil membiarkan cakupan relasinya dijelaskan dalam catatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan secara langsung sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: אוֹרִי
  choice: terangku
  rationale: Mempertahankan metafora Ibrani secara lugas dan alami.
- source_word: יִשְׁעִי
  choice: keselamatanku
  rationale: Menyampaikan tindakan atau keadaan penyelamatan dengan padanan teologis yang umum tanpa mempersempit maknanya.
- source_word: מָעוֹז חַיַּי
  choice: benteng hidupku
  rationale: מָעוֹז menunjuk tempat perlindungan atau pertahanan yang kuat; 'benteng' mempertahankan citra konkret dan hubungan konstruksi dengan 'hidupku'.
- source_word: אִירָא / אֶפְחָד
  choice: harus kutakuti / harus gentar
  rationale: Dua verba takut yang paralel diterjemahkan dengan variasi wajar, sambil mempertahankan dua pertanyaan retoris.
theological_decisions:
- issue: Hubungan Daud dengan mazmur dalam superskripsi
  choice: Dari Daud
  alternative: Oleh Daud; Untuk Daud; Mengenai Daud
  rationale: Preposisi לְ dapat menandai kepengarangan maupun asosiasi. Teks utama memakai bentuk Indonesia yang ringkas, sedangkan catatan mempertahankan ambiguitas historisnya.
- issue: Penggambaran Yahweh sebagai מָעוֹז חַיַּי
  choice: benteng hidupku
  alternative: perlindungan hidupku; kekuatan hidupku
  rationale: Pilihan ini tidak menafsirkan frasa sebagai keselamatan rohani saja, tetapi mempertahankan metafora perlindungan kuat yang mencakup seluruh hidup pemazmur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Paralelisme serta pertanyaan retoris dipertahankan; pronomina terikat seperti 'terangku' dan 'hidupku' menjaga keringkasan puisi Ibrani.
