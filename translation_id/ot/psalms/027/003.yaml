id: PSA.27.3
reference: Psalms 27:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם תַּחֲנֶ֬ה עָלַ֨/י מַחֲנֶה֮ לֹֽא יִירָ֪א לִ֫בִּ֥/י אִם תָּק֣וּם עָ֭לַ/י מִלְחָמָ֑ה בְּ֝/זֹ֗את אֲנִ֣י בוֹטֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: id
  text: Sekalipun suatu pasukan[b] berkemah melawan aku[a], hatiku tidak akan takut; sekalipun perang bangkit melawan aku, dalam keadaan ini pun aku tetap percaya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika suatu pasukan berkemah melawan aku … jika perang bangkit melawan aku.” Kata Ibrani אִם dapat menyatakan syarat (“jika”) atau konsesi (“sekalipun”); dalam konteks puitis ini, arti konsesif dinilai paling sesuai.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perkemahan”; dalam konteks ini yang dimaksud ialah pasukan bersenjata yang berkemah.
    reason: lexical_alternative
  - marker: c
    text: Atau, “dalam hal ini aku yakin” atau “meskipun demikian aku yakin.” Ungkapan Ibraninya dapat menekankan kepercayaan ataupun keyakinan di tengah ancaman.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: sekalipun
  rationale: 'Dalam paralelisme puitis ini, אִם paling wajar dipahami secara konsesif: ancaman itu tidak menggoyahkan keberanian dan kepercayaan pemazmur. Kemungkinan arti bersyarat tetap dicatat dalam catatan kaki.'
- source_word: תַּחֲנֶה
  choice: berkemah
  rationale: Mempertahankan gambaran militer dari akar חנה dan kaitannya dengan מַחֲנֶה dalam klausa yang sama.
- source_word: מַחֲנֶה
  choice: suatu pasukan
  rationale: Secara harfiah berarti 'perkemahan', tetapi dalam konteks permusuhan dan kesejajarannya dengan 'perang', kata ini secara metonimis menunjuk pada pasukan yang berkemah.
- source_word: לֹא יִירָא לִבִּי
  choice: hatiku tidak akan takut
  rationale: Mempertahankan 'hatiku' sebagai subjek eksplisit, alih-alih meratakannya menjadi 'aku tidak akan takut'.
- source_word: תָּקוּם
  choice: bangkit
  rationale: Menerjemahkan gambaran hidup dari קום secara langsung tanpa mengubahnya menjadi ungkapan yang lebih interpretatif seperti 'pecah'.
- source_word: מִלְחָמָה
  choice: perang
  rationale: Padanan langsung yang sesuai dengan peningkatan ancaman dari pasukan yang berkemah menuju konflik terbuka.
- source_word: בְּזֹאת
  choice: dalam keadaan ini pun
  rationale: Mempertahankan daya tunjuk 'ini' sambil menyampaikan bahwa kepercayaan berlanjut di tengah keadaan yang baru disebutkan.
- source_word: אֲנִי בוֹטֵחַ
  choice: aku tetap percaya
  rationale: בטח dapat menyatakan percaya atau merasa yakin. 'Tetap percaya' menonjolkan kepercayaan yang bertahan di tengah ancaman tanpa menambahkan objek yang tidak disebutkan dalam ayat.
theological_decisions:
- issue: Acuan בְּזֹאת pada akhir ayat
  choice: 'Dipahami sebagai menunjuk pada keadaan mengancam yang baru saja digambarkan: ''dalam keadaan ini pun aku tetap percaya.'''
  alternative: Dapat dipahami sebagai 'dalam hal ini aku yakin', 'meskipun demikian aku yakin', atau sebagai acuan tersirat kepada TUHAN dari konteks sebelumnya.
  rationale: Konteks terdekat mendukung acuan pada pasukan dan perang, tetapi teks Ibrani tetap ringkas dan tidak menyebut objek kepercayaan secara eksplisit. Terjemahan ini tidak menambahkan objek tersebut, sedangkan catatan kaki mempertahankan kemungkinan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan 'hatiku tidak akan takut' serta gambaran 'perang bangkit' dipertahankan untuk mencerminkan bentuk Ibrani, sementara 'suatu pasukan' dan 'dalam keadaan ini pun' dipilih agar tetap jelas bagi pembaca umum.
