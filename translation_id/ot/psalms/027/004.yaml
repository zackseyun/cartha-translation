source:
  edition: WLC
  text: אַחַ֤ת שָׁאַ֣לְתִּי מֵֽ/אֵת יְהוָה֮ אוֹתָ֪/הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣/י בְּ/בֵית יְ֭הוָה כָּל יְמֵ֣י חַיַּ֑/י לַ/חֲז֥וֹת בְּ/נֹֽעַם יְ֝הוָ֗ה וּ/לְ/בַקֵּ֥ר בְּ/הֵיכָלֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: id
  text: 'Satu hal telah kuminta dari Yahweh[a], itulah yang akan kucari: agar aku dapat tinggal di rumah Yahweh sepanjang hidupku, untuk memandang keelokan Yahweh[b] dan untuk menyelidiki[c] di bait-Nya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
  - marker: b
    text: Atau “kemolekan Yahweh” atau “kemurahan Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: Atau “mencari di bait-Nya” atau “merenung di bait-Nya”. Verba Ibraninya sulit dipastikan dan dapat menunjuk pada pencarian, penyelidikan, atau perenungan yang penuh perhatian di tempat kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת שָׁאַלְתִּי
  choice: Satu hal telah kuminta
  rationale: אַחַת dipakai secara substantival dan menekankan satu-satunya permohonan. Bentuk perfektif שָׁאַלְתִּי menyatakan permohonan yang telah disampaikan dan tetap relevan.
- source_word: מֵאֵת יְהוָה
  choice: kepada Yahweh
  rationale: Dalam konteks verba 'meminta', bahasa Indonesia secara alami memakai 'meminta kepada'. Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: itulah yang akan kucari
  rationale: Pronomina feminin merujuk kembali pada satu permohonan tadi dan memberi penekanan. Bentuk imperfektif menyampaikan tekad atau pencarian yang berlanjut.
- source_word: שִׁבְתִּי בְּבֵית יְהוָה
  choice: agar aku dapat tinggal di rumah Yahweh
  rationale: Konstruksi ini menyatakan isi atau tujuan permohonan. 'Tinggal' menyampaikan keberadaan yang menetap dengan lebih tepat daripada arti harfiah 'duduk'.
- source_word: כָּל יְמֵי חַיַּי
  choice: sepanjang hidupku
  rationale: Ungkapan Indonesia yang alami ini mempertahankan cakupan seluruh hari kehidupan pemazmur.
- source_word: לַחֲזוֹת בְּנֹעַם יְהוָה
  choice: untuk memandang keelokan Yahweh
  rationale: לַחֲזוֹת menunjuk pada tindakan memandang secara penuh perhatian. נֹעַם dapat berarti keelokan, kemolekan, kesenangan, atau kemurahan; 'keelokan' cocok dengan konteks perenungan ibadah tanpa menutup alternatifnya.
- source_word: וּלְבַקֵּר בְּהֵיכָלוֹ
  choice: dan mencari petunjuk di dalam bait-Nya
  rationale: Makna verba בּקר dalam konteks ini sulit dipastikan dan mungkin menunjuk pada pencarian atau penyelidikan penuh perhatian di tempat kudus. 'Mencari petunjuk' menghasilkan bahasa Indonesia yang wajar sambil mempertahankan gagasan datang ke bait untuk memperoleh pemahaman; alternatif dipertahankan dalam catatan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi, bukan gelar אֲדֹנָי. Transliterasi 'Yahweh' mempertahankan pembedaan itu; bentuk tradisional 'TUHAN' dicatat sebagai alternatif.
- issue: Nuansa נֹעַם יְהוָה
  choice: keelokan Yahweh
  alternative: kemolekan Yahweh; kemurahan Yahweh
  rationale: Kata נֹעַם memiliki rentang makna yang mencakup sifat menyenangkan, indah, atau penuh kemurahan. Konteks memandang di rumah Yahweh mendukung 'keelokan', tetapi tidak membenarkan penghapusan nuansa lain.
- issue: Makna tindakan וּלְבַקֵּר di bait
  choice: mencari petunjuk
  alternative: menyelidiki; merenung
  rationale: Verba ini sukar ditentukan secara pasti dalam konstruksi tersebut. Pilihan utama menyampaikan pencarian penuh perhatian di tempat kudus tanpa menetapkan suatu praktik atau doktrin khusus; ketidakpastian dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk enklitik 'kuminta' dan 'kucari' menjaga kelancaran puitis tanpa menjadi arkais. 'Bait' dipertahankan sebagai istilah yang lazim untuk tempat kudus, sedangkan ketidakpastian leksikal utama dijaga melalui catatan kaki.
