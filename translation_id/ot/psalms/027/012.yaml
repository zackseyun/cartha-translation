source:
  edition: WLC
  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: id
  text: Jangan serahkan aku kepada keinginan lawan-lawanku[a], sebab saksi-saksi dusta telah bangkit melawan aku dan mengembuskan kekerasan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada kehendak lawan-lawanku.” Kata Ibrani נֶפֶשׁ di sini kemungkinan berarti keinginan, nafsu, atau kehendak, bukan “jiwa” dalam arti sempit.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Ibrani pada bagian terakhir juga dapat dipahami, “dan seorang yang mengembuskan kekerasan.” Bentuk tunggal itu mungkin menggambarkan setiap saksi dusta atau menyebut seorang pelaku tersendiri.
    reason: textual_ambiguity
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: serahkan aku
  rationale: Dalam konstruksi dengan אַל, verba נתן menyatakan permohonan agar pemazmur tidak diserahkan ke dalam kuasa pihak lain. “Serahkan aku” alami dalam bahasa Indonesia dan mempertahankan gambaran penyerahan kepada musuh.
- source_word: בְּנֶפֶשׁ
  choice: kepada keinginan
  rationale: נֶפֶשׁ di sini paling mungkin berarti keinginan, nafsu, atau kehendak, bukan “jiwa” dalam arti sempit. Ungkapan ini menunjuk pada apa yang hendak dilakukan para lawan terhadap pemazmur.
- source_word: צָרָי
  choice: lawan-lawanku
  rationale: צַר menunjuk pada pihak yang memusuhi atau menindas. “Lawan-lawanku” cukup luas untuk mencakup konteks permusuhan dan tuduhan hukum.
- source_word: קָמוּ בִי
  choice: telah bangkit melawan aku
  rationale: קום dengan preposisi בְּ pada seseorang lazim berarti bangkit menentang orang itu. Bentuk “telah bangkit” mencerminkan tindakan yang sudah terjadi dan masih relevan.
- source_word: עֵדֵי שֶׁקֶר
  choice: saksi-saksi dusta
  rationale: Frasa konstruksi ini berarti para saksi yang memberi kesaksian palsu. “Saksi-saksi dusta” merupakan padanan yang jelas, ringkas, dan sesuai dengan suasana hukum.
- source_word: וִיפֵחַ חָמָס
  choice: dan mengembuskan kekerasan
  rationale: יפח menggambarkan tindakan mengembuskan atau mengeluarkan sesuatu melalui napas, sedangkan חָמָס berarti kekerasan atau kelaliman. Bahasa Indonesia tidak menandai jumlah pada verba, sehingga frasa ini dapat secara alami merujuk kembali kepada para saksi tanpa menghapus kemungkinan pembacaan singular pada bentuk Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Ungkapan puitis “mengembuskan kekerasan” dipertahankan agar metafora Ibraninya tetap terasa. Pengulangan “aku” dipilih alih-alih bentuk enklitik agar jelas dan sesuai dengan register mazmur.
