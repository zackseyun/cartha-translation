  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: id
  text: Jangan sembunyikan wajah-Mu dariku; jangan menolak hamba-Mu dalam murka. Engkau telah menjadi pertolonganku. Jangan membuang aku dan jangan meninggalkan aku, ya Allah keselamatanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ya Allah yang melepaskan aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: sembunyikan wajah-Mu dariku
  rationale: Mempertahankan gambaran harfiah tentang wajah Allah, yang secara idiomatis menyatakan perkenanan atau kehadiran-Nya, tanpa menghilangkan citra puitis Ibrani.
- source_word: תַּט בְּאַף עַבְדֶּךָ
  choice: menolak hamba-Mu dalam murka
  rationale: נטה pada konstruksi ini secara harfiah berkaitan dengan membelokkan atau menyisihkan; 'menolak' menyampaikan akibat relasionalnya secara alami, sedangkan בְּאַף dipertahankan sebagai 'dalam murka'.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Dalam doa kepada Allah, עבד berfungsi sebagai sebutan diri yang menyatakan kerendahan dan pengabdian; 'hamba' sesuai dengan ragam doa Indonesia dan konteks ini.
- source_word: עֶזְרָתִי הָיִיתָ
  choice: Engkaulah penolongku
  rationale: עזרה dapat menunjuk pada pertolongan; dalam konstruksi predikatif ini, 'penolongku' menghasilkan bahasa Indonesia yang ringkas dan alami serta menyatakan pengalaman akan pertolongan Allah.
- source_word: תִּטְּשֵׁנִי
  choice: membuang aku
  rationale: נטש menyatakan tindakan menelantarkan, menolak, atau membuang. 'Membuang aku' mempertahankan daya ungkap yang kuat dan tetap dibedakan dari עזב sesudahnya.
- source_word: תַּעַזְבֵנִי
  choice: meninggalkan aku
  rationale: עזב lazim berarti meninggalkan. Pilihan ini jelas dalam bahasa Indonesia modern dan mempertahankan pasangan dua permohonan yang berdekatan tanpa menyamakannya sepenuhnya.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: ya Allah keselamatanku
  rationale: Menerjemahkan konstruksi ini secara padat dan mempertahankan ישע sebagai 'keselamatan'; partikel 'ya' menandai sapaan langsung secara alami.
theological_decisions:
- issue: Bahasa antropomorfis dalam פָּנֶיךָ, 'wajah-Mu'
  choice: Mempertahankan 'wajah-Mu' dalam teks utama
  alternative: '''kehadiran-Mu'''
  rationale: Teks Ibrani secara eksplisit memakai 'wajah', gambaran alkitabiah tentang kehadiran atau perkenanan ilahi. Mempertahankannya menjaga tekstur puitis dan tidak menafsirkan metafora secara berlebihan.
- issue: Makna עבד dalam hubungan pemazmur dengan Allah
  choice: hamba-Mu
  alternative: budak-Mu
  rationale: Di sini penekanannya ialah kerendahan hati dan pengabdian dalam doa, bukan status hukum perbudakan; 'hamba' lebih tepat secara kontekstual dan wajar dalam bahasa Indonesia.
- issue: Rentang makna יִשְׁעִי
  choice: keselamatanku
  alternative: kelepasanku
  rationale: '''Keselamatan'' mempertahankan keluasan istilah ישע, yang dapat mencakup penyelamatan dan kelepasan, tanpa membatasinya pada satu bentuk bahaya tertentu.'
translation_notes:
  register: Bahasa doa yang modern, luhur, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Paralelisme permohonan Ibrani dipertahankan, dengan pembedaan antara 'membuang' dan 'meninggalkan'.
