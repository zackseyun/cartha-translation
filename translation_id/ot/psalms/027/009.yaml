  naturalness: Teks revisi tetap memakai bahasa Indonesia modern yang puitis dan wajar dalam ragam doa. “Telah menjadi pertolonganku” sedikit lebih formal daripada “penolongku,” tetapi alami dan lebih dekat dengan struktur serta makna Ibrani.
