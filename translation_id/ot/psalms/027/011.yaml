base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: id
  text: Ajarlah aku jalan-Mu, ya Yahweh, dan tuntunlah aku di jalan yang rata karena musuh-musuhku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena orang-orang yang mengawasiku dengan sikap bermusuhan.” Istilah Ibrani ini dapat menunjuk pada musuh, termasuk lawan yang mengintai atau menunggu kesempatan untuk menyerang pemazmur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Ajarlah aku
  rationale: Bentuk Hifil dari ירה bermakna mengajar atau memberi petunjuk. “Ajarlah aku” mempertahankan nuansa pembelajaran dan terdengar wajar dalam doa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: דַּרְכֶּךָ
  choice: jalan-Mu
  rationale: דֶּרֶךְ dapat menunjuk pada jalan, cara hidup, atau arah tindakan. “Jalan-Mu” mempertahankan citra konkret sekaligus kemungkinan makna moralnya.
- source_word: וּנְחֵנִי
  choice: dan tuntunlah aku
  rationale: נחה berarti memimpin atau menuntun. “Tuntunlah aku” alami dalam bahasa doa dan sesuai dengan gambaran perjalanan.
- source_word: בְּאֹרַח מִישׁוֹר
  choice: di jalan yang rata
  rationale: אֹרַח berarti jalan atau jalur, sedangkan מִישׁוֹר pada dasarnya menunjuk pada tanah yang rata dan dapat menyiratkan kelurusan. Terjemahan ini mempertahankan citra konkretnya tanpa menutup nuansa moral.
- source_word: לְמַעַן
  choice: karena
  rationale: Dalam konteks ini לְמַעַן memperkenalkan alasan permohonan pemazmur sehubungan dengan para lawannya. “Karena” ringkas dan alami.
- source_word: שׁוֹרְרָי
  choice: musuh-musuhku
  rationale: Istilah ini menunjuk pada para lawan yang bersikap bermusuhan, mungkin dengan nuansa mengawasi atau menanti kesempatan untuk mencelakakan. Padanan utama yang paling jelas ialah “musuh-musuhku”; nuansa khususnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Transliterasi “Yahweh” mempertahankan nama pribadi ilahi dalam teks Ibrani dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa jalan yang rata atau lurus
  choice: jalan yang rata
  alternative: jalan yang lurus; jalan yang benar
  rationale: “Rata” menjaga gambaran dasar מִישׁוֹר tentang medan yang rata, sambil membiarkan kemungkinan implikasi moral tetap terbuka dan tidak menafsirkannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang alami dan khidmat. Akhiran pronominal ilahi ditulis dengan huruf kapital sesuai konvensi Indonesia. Penanda catatan kaki ditempatkan setelah “musuh-musuhku”, yaitu unsur yang dijelaskan oleh catatan tersebut.
