source:
  edition: WLC
  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: id
  text: Dan sekarang kepalaku akan terangkat di atas musuh-musuhku yang mengelilingiku. Di kemah-Nya[a] aku akan mempersembahkan kurban dengan sorak-sorai[b]. Aku akan bernyanyi dan bermusik bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di kemahnya.” Kata ganti itu paling mungkin merujuk kepada Yahweh.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “kurban-kurban sorak-sorai.” Ungkapan Ibrani dapat menekankan sifat kurban itu atau sorak sukacita yang menyertainya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan kepada keyakinan pemazmur pada masa kini atau masa yang segera tiba; hubungan dengan konteks tetap alami tanpa harus menerjemahkan waw secara kaku.
- source_word: יָרוּם רֹאשִׁי
  choice: kepalaku akan terangkat
  rationale: Mempertahankan gambaran Ibrani tentang kehormatan, keberanian, dan pembenaran, serta nilai prospektif bentuk imperfek.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: mengatasi musuh-musuh yang mengelilingiku
  rationale: Kata 'mengatasi' menyampaikan kedudukan yang ditinggikan di atas para musuh, sedangkan klausa relatif menyatakan bahwa mereka berada di sekeliling pemazmur.
- source_word: וְאֶזְבְּחָה
  choice: aku akan mempersembahkan kurban
  rationale: Bentuk kohortatif menyatakan tekad. Ungkapan ini alami dalam bahasa Indonesia dan menghindari pengulangan janggal 'mengurbankan kurban'.
- source_word: בְאָהֳלוֹ
  choice: di dalam kemah-Nya
  rationale: Akhiran orang ketiga tunggal paling wajar merujuk kepada Yahweh; huruf kapital membantu menunjukkan referen ilahi tanpa mengganti citra kemah dengan istilah tradisional yang lebih khusus.
- source_word: זִבְחֵי תְרוּעָה
  choice: kurban dengan sorak-sorai
  rationale: Frasa konstruksi dapat menggambarkan sifat kurban atau seruan sukacita yang menyertainya. Pilihan ini alami dan mempertahankan unsur aklamasi yang terdengar.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: Aku akan bernyanyi dan bermusik
  rationale: Dua bentuk kohortatif menyatakan tekad memuji; 'bermusik' membedakan זמר dari שׁיר tanpa memastikan apakah alat musik digunakan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Mentransliterasikan nama perjanjian יהוה secara langsung dan memakai 'bagi' untuk menyatakan arah atau penerima pujian.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Referen akhiran pronominal dalam בְאָהֳלוֹ
  choice: kemah-Nya, yaitu kemah Yahweh
  alternative: kemahnya, yaitu kemah pemazmur
  rationale: Konteks kurban dan pujian kepada Yahweh membuat rujukan kepada tempat kudus Yahweh paling alami, meskipun bentuk gramatikalnya sendiri hanya menyatakan orang ketiga maskulin tunggal.
- issue: Hubungan genitif dalam זִבְחֵי תְרוּעָה
  choice: kurban dengan sorak-sorai
  alternative: kurban sorak-sorai; kurban yang bersifat sukacita
  rationale: Konstruksi Ibrani memungkinkan sorak sebagai ciri kurban atau aklamasi yang menyertainya; catatan kaki mempertahankan keluasan ini.
translation_notes:
  register: Bahasa Indonesia baku yang modern, khidmat, dan mudah dipahami. Citra konkret Ibrani dipertahankan, sedangkan susunan kalimat dibuat alami. Penulisan 'kemah-Nya' mengikuti kebiasaan Indonesia untuk referen ilahi, dan nama Yahweh dipertahankan.
