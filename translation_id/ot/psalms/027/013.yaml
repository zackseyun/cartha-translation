  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
translation:
  language: id
  text: Seandainya aku tidak percaya bahwa aku akan melihat kebaikan Yahweh di negeri orang hidup …[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani berbentuk eliptis: “Seandainya aku tidak percaya bahwa aku akan melihat kebaikan Yahweh di negeri orang hidup …” Akibat dari pengandaian itu tidak dinyatakan; maknanya lazim dipahami sebagai “aku pasti sudah putus asa” atau “aku pasti sudah patah semangat.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau, dengan melengkapi akibat yang tersirat: “Aku pasti sudah patah semangat, seandainya aku tidak percaya bahwa aku akan melihat kebaikan Yahweh di negeri orang hidup.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵא
  choice: seandainya ... tidak
  rationale: Partikel ini memperkenalkan syarat yang berlawanan dengan kenyataan. Bentuk “seandainya ... tidak” alami dalam bahasa Indonesia dan tetap memungkinkan akibat yang tidak disebutkan dalam teks Ibrani dibiarkan tersirat.
- source_word: הֶאֱמַנְתִּי
  choice: aku percaya
  rationale: Bentuk Hifil dari אמן di sini berarti percaya atau menaruh keyakinan. Dalam konstruksi pengandaian bahasa Indonesia, “aku percaya” lebih alami daripada bentuk lampau eksplisit, sebab kala lampau sudah tersirat oleh “seandainya” dan konteksnya.
- source_word: לִרְאוֹת
  choice: bahwa aku akan melihat
  rationale: Infinitif Ibrani secara harfiah berarti “untuk melihat”, tetapi setelah “percaya” bahasa Indonesia secara alami mengungkapkan isi kepercayaan itu dengan klausa “bahwa aku akan melihat”.
- source_word: בְּטוּב
  choice: kebaikan
  rationale: טוּב dapat menunjuk pada kebaikan, kelimpahan, atau hal-hal baik. “Kebaikan” mempertahankan keluasan makna dan tidak membatasinya pada berkat materi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: בְּאֶרֶץ חַיִּים
  choice: di negeri orang-orang hidup
  rationale: Ungkapan Ibrani ini menunjuk pada ranah kehidupan manusia, sebagai lawan kematian atau dunia orang mati. Pilihan ini mempertahankan citra “negeri” dalam teks sumber.
- source_word: '[apodosis tersirat sesudah לוּלֵא]'
  choice: tidak ditambahkan dalam teks utama
  rationale: Teks Ibrani tidak menyatakan akibat dari syarat tersebut. Elipsis dipertahankan dengan tanda elipsis dan dijelaskan dalam catatan kaki agar pembaca tidak mengira bahwa suatu akibat tertentu tertulis secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama diri ilahi; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Klausa akibat yang tidak dinyatakan dalam konstruksi eliptis
  choice: Mempertahankan elipsis dalam teks utama
  alternative: Menambahkan “aku pasti sudah putus asa” atau “aku pasti sudah tawar hati”
  rationale: Akibatnya memang dapat dipahami dari konteks, tetapi tidak tertulis dalam teks Ibrani. Mempertahankan elipsis menjaga ketegangan dan ketidaklengkapan sumber, sedangkan catatan kaki menjelaskan makna yang lazim dipahami.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan pengandaian dibuat alami, sementara elipsis mencolok dalam teks Ibrani dipertahankan dan diterangkan melalui catatan kaki.
