id: PSA.27.7
reference: Psalms 27:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁמַע יְהוָ֖ה קוֹלִ֥/י אֶקְרָ֗א וְ/חָנֵּ֥/נִי וַ/עֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: id
  text: Dengarlah, ya Yahweh, suaraku ketika aku berseru; bermurah hatilah kepadaku[a] dan jawablah aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kasihanilah aku” atau “tunjukkanlah perkenanan-Mu kepadaku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarlah
  rationale: Bentuk imperatif ini merupakan permohonan agar Yahweh mendengar dengan penuh perhatian. “Dengarlah” alami dalam bahasa doa Indonesia dan tetap mengikuti struktur Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan secara langsung sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: קוֹלִי
  choice: suaraku
  rationale: Terjemahan konkret ini mempertahankan ungkapan Ibrani “dengarlah suaraku” dan tidak meratakannya menjadi sekadar “dengarkanlah aku”.
- source_word: אֶקְרָא
  choice: ketika aku berseru
  rationale: Dalam konteks doa, קרא menyatakan tindakan memanggil atau berseru kepada Allah. “Berseru” menyampaikan urgensi tanpa menyiratkan tangisan emosional secara khusus.
- source_word: וְחָנֵּנִי
  choice: bermurah hatilah kepadaku
  rationale: Kata חנן meminta perkenanan atau kemurahan yang diberikan dengan anugerah. Pilihan ini lebih dekat pada nuansa leksikalnya daripada ungkapan yang hanya menekankan rasa iba.
- source_word: וַעֲנֵנִי
  choice: dan jawablah aku
  rationale: Imperatif dari ענה di sini berarti menjawab atau menanggapi doa; “jawablah aku” merupakan padanan langsung dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa permohonan חנן
  choice: bermurah hatilah kepadaku
  alternative: kasihanilah aku
  rationale: Pilihan utama mempertahankan gagasan perkenanan yang dianugerahkan tanpa meniadakan kemungkinan nuansa belas kasihan, yang dicatat sebagai alternatif.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Susunan “dengarlah ... suaraku” dipertahankan untuk menjaga kekonkretan ungkapan Ibrani, sedangkan “ketika aku berseru” memberi alur Indonesia yang alami.
