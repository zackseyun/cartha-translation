  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: id
  text: Ketika para pelaku kejahatan mendekat untuk melahap dagingku[a]—para lawanku dan musuhku—merekalah yang tersandung dan jatuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk memakan dagingku.” Ungkapan Ibrani ini merupakan gambaran tajam tentang serangan yang ganas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְרֹב
  choice: Ketika ... mendekat
  rationale: Infinitif konstruk dengan prefiks ב berfungsi secara temporal; bentuk ini alami dalam bahasa Indonesia dan mempertahankan gagasan mendekat.
- source_word: מְרֵעִים
  choice: para pelaku kejahatan
  rationale: Partisip ini menunjuk kepada orang-orang yang melakukan kejahatan; pilihan ini jelas, modern, dan tidak menambahkan gender.
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: untuk melahap dagingku
  rationale: Melahap mempertahankan citra serangan ganas dalam ungkapan Ibrani, sedangkan dagingku menjaga gambaran jasmaniah yang kuat.
- source_word: צָרַי וְאֹיְבַי לִי
  choice: para lawan dan musuhku
  rationale: Kedua nomina dipertahankan demi paralelisme. Unsur לִי yang menyatakan permusuhan sudah tersampaikan secara alami melalui bentuk posesif musuhku dan konteks, tanpa pengulangan 'terhadapku' yang kaku.
- source_word: הֵמָּה
  choice: merekalah
  rationale: 'Partikel -lah mencerminkan penekanan pada pronomina mandiri Ibrani: justru mereka yang mengalami kekalahan.'
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: tersandung dan jatuh
  rationale: Menerjemahkan kedua verba secara langsung serta mempertahankan urutan dan ambiguitas antara keruntuhan harfiah dan kekalahan.
