  yaml_path: translation/ot/psalms/027/010.yaml
  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: id
  text: Sebab ayahku dan ibuku telah meninggalkan aku, tetapi Yahweh akan menerima aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “akan mengumpulkan aku”; dapat juga diterjemahkan “akan menampung aku”. Kata Ibrani ini di sini menyampaikan penerimaan dan perlindungan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini paling wajar dipahami sebagai penghubung yang memberi dasar atau keadaan bagi keyakinan pemazmur dalam konteksnya, tanpa mengubahnya menjadi makna konsesif seperti “sekalipun”.
- source_word: אָבִי וְאִמִּי
  choice: ayah dan ibuku
  rationale: Ungkapan posesif diterjemahkan secara langsung dan alami dalam bahasa Indonesia; satu akhiran “-ku” pada unsur terakhir dapat mencakup kedua nomina dalam rangkaian ini.
- source_word: עֲזָבוּנִי
  choice: telah meninggalkan aku
  rationale: Kata עזב dapat berarti meninggalkan atau menelantarkan. “Telah meninggalkan aku” mempertahankan makna dasarnya dan bobot emosionalnya tanpa secara tidak perlu mempersempit bentuk pengabaian yang dimaksud.
- source_word: וַיהוָה
  choice: tetapi Yahweh
  rationale: 'Waw secara bentuk berarti “dan”, tetapi di sini hubungannya bersifat kontras: orang tua meninggalkan, sedangkan Yahweh menerima. “Tetapi” menyampaikan kontras itu secara alami.'
- source_word: יַאַסְפֵנִי
  choice: akan menyambut aku
  rationale: Akar אסף secara harfiah berarti mengumpulkan, tetapi dalam konteks pribadi ini menyatakan menerima seseorang ke dalam pemeliharaan dan perlindungan. “Menyambut aku” alami dalam bahasa Indonesia, sementara citra harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Nama perjanjian dipertahankan sebagai “Yahweh” sesuai konvensi proyek, tanpa menggantinya dengan gelar atau memilih bentuk alternatif yang kurang dekat dengan rekonstruksi umum nama Ibrani tersebut.
- issue: Sifat tindakan orang tua
  choice: telah meninggalkan aku
  alternative: sekalipun ayah dan ibuku meninggalkan aku; ayah dan ibuku telah menelantarkan aku
  rationale: Bentuk perfek Ibrani dipertahankan sebagai pernyataan yang dapat menunjuk pada pengalaman nyata atau keadaan yang dipandang telah terjadi. Terjemahan tidak mengubahnya menjadi kondisi hipotetis, dan tidak mempersempitnya secara teologis menjadi penelantaran tertentu.
- issue: Tindakan Yahweh dalam יַאַסְפֵנִי
  choice: akan menyambut aku
  alternative: akan menghimpun aku; akan menerima aku; akan menampung aku
  rationale: Pilihan ini mempertahankan gagasan penerimaan penuh perlindungan tanpa membatasi tindakan Yahweh pada pemberian tempat tinggal saja. Makna harfiah “mengumpulkan” tetap dicatat sebagai dasar metaforanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. “Ayah” dipilih daripada “bapa” untuk hubungan orang tua manusia dalam bahasa umum masa kini. Pronomina “aku” mempertahankan suara pribadi mazmur. Penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
