  text: תִּמְכֹּֽר עַמְּ/ךָ֥ בְ/לֹא ה֑וֹן וְ/לֹ֥א רִ֝בִּ֗יתָ בִּ/מְחִירֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/012.yaml
  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: id
  text: Engkau menjual umat-Mu tanpa mendapat apa-apa[a], dan tidak memperoleh keuntungan dari harga mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tanpa kekayaan” atau “tanpa harta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: Engkau menjual
  rationale: Bentuk Qal imperfek orang kedua maskulin tunggal ditujukan kepada Allah. Bahasa Indonesia tidak menandai kala pada verba, sehingga ungkapan ini secara alami mempertahankan kemungkinan tindakan kini yang hidup maupun tindakan lampau dalam konteks ratapan.
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: עַם menunjuk kepada suatu umat dalam hubungan kebangsaan dan perjanjian. “Umat-Mu” lebih jelas mempertahankan hubungan mereka dengan Allah daripada “bangsa-Mu”.
- source_word: בְלֹא הוֹן
  choice: tanpa mendapat apa-apa
  rationale: Secara harfiah frasa ini berarti “tanpa kekayaan/harta” dan menyatakan bahwa penjualan itu tidak mendatangkan hasil bernilai. Pilihan ini alami dalam bahasa Indonesia dan sesuai dengan konteks transaksi, sementara arti konkretnya dicatat dalam catatan kaki.
- source_word: רִבִּיתָ
  choice: tidak memperoleh keuntungan
  rationale: Bentuk Piel dari רבה secara harfiah berkaitan dengan memperbanyak atau menambah. Dalam konteks harga penjualan, frasa Indonesia ini menyampaikan bahwa Allah tidak menambah kekayaan atau memperoleh laba dari penjualan tersebut.
- source_word: בִּמְחִירֵיהֶם
  choice: dari harga mereka
  rationale: מְחִיר berarti harga atau harga jual, sedangkan ב dapat menunjukkan sarana atau sumber. “Dari harga mereka” alami dalam bahasa Indonesia dan tetap dekat dengan hubungan gramatikal Ibraninya.
theological_decisions:
- issue: Gambaran bahwa Allah menjual umat-Nya
  choice: Mempertahankan tuduhan langsung “Engkau menjual umat-Mu”
  alternative: Melunakkan menjadi bentuk pasif atau menyatakan bahwa Allah hanya membiarkan mereka dijual
  rationale: Teks Ibrani secara langsung menjadikan Allah subjek verba dan merupakan bahasa ratapan yang berani. Terjemahan tidak boleh meredakan ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Engkau” serta bentuk “-Mu” mempertahankan seruan langsung kepada Allah. Pengulangan gagasan hasil dan keuntungan dipertahankan karena mencerminkan paralelisme puisi Ibrani.
