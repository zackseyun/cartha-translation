  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: id
  text: Engkaulah Rajaku, ya Allah; perintahkanlah kemenangan bagi Yakub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perintahkanlah pembebasan bagi Yakub” atau “tetapkanlah keselamatan bagi Yakub.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Engkaulah
  rationale: Gabungan pronomina ini bersifat menegaskan. Bentuk Indonesia “Engkaulah” menyampaikan penekanan itu secara alami dan puitis.
- source_word: מַלְכִּי
  choice: Rajaku
  rationale: Nomina dengan sufiks orang pertama tunggal berarti “rajaku”; bentuk ini wajar sebagai gelar dalam sapaan langsung kepada Allah.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Dalam susunan ini אֱלֹהִים paling alami dipahami sebagai sapaan langsung. Partikel “ya” mempertahankan daya vokatif doa tersebut.
- source_word: צַוֵּה
  choice: perintahkanlah
  rationale: Imperatif piel dari צוה secara langsung berarti “perintahkanlah” atau “titahkanlah”. Pilihan ini mempertahankan gambaran bahwa kemenangan terjadi atas perintah Allah.
- source_word: יְשׁוּעוֹת
  choice: kemenangan-kemenangan
  rationale: Bentuk jamak ini secara leksikal menunjuk pada tindakan-tindakan penyelamatan atau pembebasan. Dalam konteks peperangan mazmur ini, “kemenangan-kemenangan” mengungkapkan hasil konkretnya sambil mempertahankan bentuk jamak.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama puitis umat perjanjian dipertahankan sebagaimana dalam teks Ibrani dan tidak diganti secara interpretatif dengan “Israel”.
theological_decisions:
- issue: Makna יְשׁוּעוֹת dalam konteks peperangan
  choice: kemenangan-kemenangan
  alternative: pembebasan-pembebasan; keselamatan-keselamatan
  rationale: Konteks terdekat berbicara tentang musuh dan pertempuran, sehingga tindakan penyelamatan yang dimaksud berwujud kemenangan bagi umat. Catatan kaki mempertahankan cakupan makna dasarnya.
- issue: Fungsi אֱלֹהִים dalam kalimat
  choice: 'sapaan langsung: “ya Allah”'
  alternative: aposisi “Rajaku, Allah” atau pernyataan “Rajaku adalah Allah”
  rationale: Sintaksis dan corak doa paling alami mendukung pembacaan vokatif, tanpa menghilangkan hubungan erat antara “Rajaku” dan “Allah”.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis. “Engkau” dipakai untuk sapaan langsung kepada Allah; “Engkaulah” mempertahankan penekanan Ibrani. Bentuk ulang pada “kemenangan-kemenangan” mempertahankan jamak eksplisit, meskipun agak lebih formal daripada ungkapan prosa sehari-hari.
