  text: אַף זָ֭נַחְתָּ וַ/תַּכְלִימֵ֑/נוּ וְ/לֹא תֵ֝צֵ֗א בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/009.yaml
  text: Yet you have rejected us and put us to shame[a], and you do not go out with our armies.
translation:
  language: id
  text: Namun Engkau telah menolak kami dan mempermalukan kami; Engkau tidak maju bersama pasukan kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Engkau tidak keluar bersama pasukan kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Namun
  rationale: Partikel ini menandai pertentangan tajam dengan pengakuan sebelumnya tentang pertolongan Allah. “Namun” menyampaikan peralihan wacana itu secara alami dalam bahasa Indonesia.
- source_word: זָנַחְתָּ
  choice: Engkau telah menolak
  rationale: Kata kerja זנח menyatakan tindakan menolak atau membuang. “Telah menolak” mempertahankan daya relasionalnya dan menunjukkan keadaan kini sebagai akibat tindakan tersebut.
- source_word: וַתַּכְלִימֵנוּ
  choice: dan mempermalukan kami
  rationale: Bentuk Hifil dari כלם menyatakan tindakan yang menyebabkan rasa malu atau kehinaan. “Mempermalukan kami” ringkas, wajar, dan tetap mempertahankan makna kausatifnya.
- source_word: וְלֹא תֵצֵא
  choice: Engkau tidak maju
  rationale: יצא secara dasar berarti “keluar”, tetapi dalam konteks pasukan yang pergi bertempur, “maju” menyampaikan nuansa militer secara alami tanpa menambahkan hasil pertempuran.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: bersama pasukan kami
  rationale: צָבָא di sini mengacu pada kekuatan militer. Preposisi ב dipahami secara asosiatif sebagai “bersama”; “pasukan kami” merupakan ungkapan Indonesia yang alami dan dapat berfungsi sebagai nomina kolektif meskipun bentuk Ibraninya jamak.
theological_decisions:
- issue: Gambaran tentang Allah yang tidak menyertai pasukan dalam pertempuran
  choice: Ayat diterjemahkan sebagai keluhan bahwa Allah tidak lagi maju menyertai pasukan Israel.
  alternative: Secara lebih harfiah, frasa itu dapat diterjemahkan “Engkau tidak keluar di tengah pasukan-pasukan kami.”
  rationale: Terjemahan ini mempertahankan ketegangan dalam ratapan pemazmur mengenai penolakan dan ketidakhadiran ilahi, tanpa menjelaskan sebabnya atau mengubahnya menjadi pernyataan doktrinal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai “Engkau”. Tanda titik koma mempertahankan hubungan erat antara penolakan, kehinaan, dan tidak hadirnya Allah bersama pasukan.
