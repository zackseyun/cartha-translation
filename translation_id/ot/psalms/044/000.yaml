lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia modern dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: לִבְנֵי
  choice: Dari keturunan
  rationale: Kata depan Ibrani ל dalam judul mazmur dapat menyatakan hubungan, peruntukan, atau kepengarangan. “Dari” cukup ringkas untuk teks utama, sedangkan kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Makna teknis istilah dalam judul mazmur ini tidak pasti. Transliterasi mempertahankan istilah Ibrani tanpa memastikan bahwa ini semata-mata nyanyian pengajaran atau perenungan.
