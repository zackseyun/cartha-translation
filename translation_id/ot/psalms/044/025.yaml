source:
  edition: WLC
  text: כִּ֤י שָׁ֣חָה לֶ/עָפָ֣ר נַפְשֵׁ֑/נוּ דָּבְקָ֖ה לָ/אָ֣רֶץ בִּטְנֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/025.yaml
  text: For our soul has sunk down to the dust[b][a]; our belly clings to the earth.
translation:
  language: id
  text: Sebab jiwa kami[a] telah terpuruk sampai ke debu[b]; perut kami melekat pada tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup kami” atau “diri kami sendiri”.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah tertunduk sampai ke debu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi permohonan dalam konteks sekitarnya; “Sebab” mempertahankan daya kausalnya secara wajar dalam bahasa Indonesia.
- source_word: שָׁחָה
  choice: telah terpuruk
  rationale: Kata kerja ini menggambarkan keadaan merunduk atau turun sangat rendah. “Telah terpuruk” menyampaikan kerendahan dan kehancuran yang tersirat, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לֶעָפָר
  choice: sampai ke debu
  rationale: עָפָר berarti “debu”; ungkapan ini mempertahankan citra kerendahan, penghinaan, dan kefanaan tanpa mengubahnya menjadi penjelasan abstrak.
- source_word: נַפְשֵׁנוּ
  choice: jiwa kami
  rationale: נֶפֶשׁ dapat menunjuk pada jiwa, hidup, atau diri seseorang. “Jiwa kami” mempertahankan bahasa antropologis dan puitis teks, sedangkan cakupan makna lainnya dicatat sebagai alternatif.
- source_word: דָּבְקָה
  choice: melekat
  rationale: Kata ini berarti menempel atau berpaut erat. “Melekat” alami dalam bahasa Indonesia dan mempertahankan gambaran tubuh yang rapat pada tanah.
- source_word: לָאָרֶץ
  choice: pada tanah
  rationale: Dalam konteks posisi tubuh yang tersungkur dan paralel dengan “debu”, “tanah” menyampaikan makna konkret אֶרֶץ secara alami.
- source_word: בִּטְנֵנוּ
  choice: perut kami
  rationale: בֶּטֶן secara langsung berarti perut atau bagian dalam tubuh. “Perut kami” mempertahankan gambaran jasmani yang jelas dan tidak menghaluskannya menjadi “tubuh kami”.
theological_decisions:
- issue: Cakupan antropologis נַפְשֵׁנוּ
  choice: jiwa kami
  alternative: hidup kami; diri kami sendiri
  rationale: Mazmur ini merupakan ratapan puitis, dan נֶפֶשׁ mencakup makna jiwa, hidup, dan diri. Terjemahan utama mempertahankan kedalaman serta ketegangan antropologis teks tanpa membatasinya hanya pada jiwa nonjasmani atau hanya pada kehidupan biologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan bermartabat. Paralelisme antara “jiwa kami” dan “perut kami”, serta antara “debu” dan “tanah”, dipertahankan. Tanda titik koma mencerminkan hubungan erat kedua larik.
