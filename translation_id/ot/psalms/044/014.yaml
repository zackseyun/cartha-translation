translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ratapan puitis. Sapaan ‘Engkau’ mempertahankan pembicaraan langsung kepada Allah. Paralelisme antara ‘bangsa-bangsa’ dan ‘kaum-kaum’ serta gambaran konkret gelengan kepala dipertahankan.
