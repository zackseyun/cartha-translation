  text: You make us a proverb among the nations[b][a], a shaking of the head among the peoples.
translation:
  language: id
  text: Engkau menjadikan kami peribahasa[a] di antara bangsa-bangsa, sasaran gelengan kepala[b] di antara suku-suku bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebutan yang bernada ejekan di antara bangsa-bangsa.” Kata Ibrani מָשָׁל dapat berarti peribahasa atau sebutan yang bernada ejekan.
    reason: lexical_alternative
  - marker: b
    text: Gelengan kepala merupakan gerakan yang menyatakan ejekan atau penghinaan.
    reason: cultural_note
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Engkau menjadikan kami
  rationale: 'Bentuk orang kedua tunggal menyapa Allah secara langsung. Kata kerja שׂים secara harfiah berarti ‘menaruh/menetapkan’, tetapi dalam konteks ini menyatakan hasil: Allah menjadikan mereka objek celaan.'
- source_word: מָשָׁל
  choice: buah bibir
  rationale: מָשָׁל dapat berarti peribahasa, ungkapan, atau sebutan bernada ejekan. ‘Buah bibir’ merupakan ungkapan Indonesia yang alami untuk orang yang terus diperbincangkan; konteks paralel gelengan kepala memperjelas nada penghinaan.
- source_word: בַּגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם menunjuk kepada bangsa-bangsa asing secara umum. Pilihan ini mempertahankan cakupan dan bentuk jamak sumber.
- source_word: מְנוֹד רֹאשׁ
  choice: sasaran gelengan kepala
  rationale: Frasa ini menggambarkan gerakan kepala sebagai tanda ejekan atau penghinaan. Penambahan ‘sasaran’ membuat hubungan idiomatisnya jelas dan alami dalam bahasa Indonesia tanpa menghilangkan gambaran konkretnya.
- source_word: בַּל אֻמִּים
  choice: di antara kaum-kaum
  rationale: אֻמִּים sejajar dengan גּוֹיִם dan berarti kelompok-kelompok manusia atau bangsa-bangsa. ‘Kaum-kaum’ mempertahankan variasi puitis antarkola.
