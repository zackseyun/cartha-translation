  text: אֱלֹהִ֤ים בְּ/אָזְנֵ֬י/נוּ שָׁמַ֗עְנוּ אֲבוֹתֵ֥י/נוּ סִפְּרוּ לָ֑/נוּ פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝/ימֵי/הֶ֗ם בִּ֣/ימֵי קֶֽדֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: id
  text: Ya Allah, dengan telinga kami sendiri kami telah mendengar; leluhur kami[b] telah menceritakan kepada kami perbuatan yang Kaulakukan pada zaman mereka, pada zaman dahulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Atau: "bapa-bapa kami"; Ibrani: "bapa-bapa kami."'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Nomina ini berfungsi sebagai sapaan langsung. Partikel “Ya” menandai vokatif secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: בְּאָזְנֵינוּ
  choice: dengan telinga kami sendiri
  rationale: Mempertahankan gambaran konkret bahwa mereka sungguh mendengar; “sendiri” membuat penekanan idiom Ibrani terasa alami dalam bahasa Indonesia.
- source_word: שָׁמַעְנוּ
  choice: kami telah mendengar
  rationale: Bentuk perfektif menyatakan tradisi yang telah diterima dan masih relevan bagi para pemazmur.
- source_word: אֲבוֹתֵינוּ
  choice: leluhur kami
  rationale: Dalam konteks pewarisan kisah dari generasi terdahulu, “leluhur” menyampaikan rujukan kolektif secara alami; secara harfiah bentuk Ibraninya berarti “bapa-bapa kami”.
- source_word: סִפְּרוּ לָנוּ
  choice: telah menceritakan kepada kami
  rationale: Kata kerja ini menunjuk pada penuturan atau pengisahan kembali, bukan sekadar pemberitahuan singkat.
- source_word: פֹּעַל פָּעַלְתָּ
  choice: perbuatan yang Kaulakukan
  rationale: Mempertahankan hubungan akar kata antara nomina dan verba sejauh dapat dilakukan secara alami, serta menyatakan satu tindakan atau karya ilahi secara kolektif.
- source_word: בִּימֵיהֶם
  choice: pada zaman mereka
  rationale: Ungkapan waktu ini merujuk pada masa hidup para leluhur.
- source_word: בִּימֵי קֶדֶם
  choice: pada zaman dahulu
  rationale: Mengungkapkan masa lampau yang jauh dengan diksi Indonesia yang alami dan tetap puitis.
theological_decisions:
- issue: Penandaan sapaan langsung kepada Allah
  choice: Ya Allah
  alternative: Allah,
  rationale: Teks Ibrani menempatkan nama ilahi sebagai vokatif tanpa partikel khusus. Bahasa Indonesia lazim memakai “Ya” untuk memperjelas sapaan, tanpa menambah isi teologis.
- issue: Cakupan אֲבוֹתֵינוּ dalam pewarisan tradisi
  choice: leluhur kami
  alternative: bapa-bapa kami
  rationale: Konteksnya adalah generasi pendahulu yang mewariskan kesaksian. “Leluhur” alami dalam bahasa Indonesia dan tidak menentukan lebih jauh siapa saja yang termasuk di dalamnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang puitis dan bermartabat. Paralelisme temporal dipertahankan melalui pengulangan “pada zaman”. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat dijelaskan dalam keputusan penerjemahan tanpa meninggalkan ambiguitas penting dalam teks utama.
