  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: id
  text: Tidakkah Allah akan menyelidiki hal ini? Sebab Dia mengetahui hal-hal yang tersembunyi dalam hati[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rahasia-rahasia hati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Tidakkah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya. “Tidakkah” mempertahankan bentuk tanya dan nada yang wajar serta bermartabat dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini berfungsi sebagai sebutan tunggal bagi Allah Israel. “Allah” adalah padanan baku dan alami dalam Alkitab bahasa Indonesia.
- source_word: יַחֲקָר
  choice: menyelidiki
  rationale: Kata kerja ini berarti mencari atau memeriksa secara mendalam. “Menyelidiki” menyampaikan ketelitian pencarian dan cocok dengan perkara yang sedang dibicarakan.
- source_word: זֹאת
  choice: hal ini
  rationale: Kata penunjuk ini merujuk kembali kepada perkara dalam konteks sebelumnya. “Hal ini” lebih alami daripada hanya “ini” tanpa mempersempit rujukannya.
- source_word: כִּי
  choice: Sebab
  rationale: Di sini kata ini memperkenalkan alasan yang mendukung pertanyaan retoris sebelumnya.
- source_word: יֹדֵעַ
  choice: mengetahui
  rationale: Partisip ini menyatakan pengetahuan Allah yang tetap atau menjadi ciri-Nya; bentuk kini bahasa Indonesia menyampaikan makna itu secara alami.
- source_word: תַּעֲלֻמוֹת
  choice: hal-hal yang tersembunyi
  rationale: Nomina jamak ini menunjuk pada perkara-perkara yang tersembunyi atau rahasia. Pilihan ini dekat dengan makna leksikal dan tetap alami; “rahasia-rahasia” dicantumkan sebagai alternatif.
- source_word: לֵב
  choice: hati
  rationale: Dalam antropologi Ibrani, “hati” mencakup pikiran, kehendak, niat, dan perasaan. Padanan ini mempertahankan gambaran serta keluasan ungkapan sumber.
theological_decisions:
- issue: Cakupan antropologis לֵב
  choice: hati
  alternative: pikiran; batin
  rationale: “Hati” mempertahankan idiom alkitabiah dan tidak mempersempit istilah Ibrani hanya pada daya pikir atau perasaan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pertanyaan retoris dipertahankan, sedangkan susunan frasa disesuaikan secukupnya agar alami tanpa menghilangkan ambiguitas istilah tentang batin manusia.
