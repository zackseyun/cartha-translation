translation:
  language: id
  text: Sepanjang hari, aibku ada di hadapanku, dan rasa malu yang tampak di wajahku menyelubungi aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, Ibrani berbunyi “rasa malu wajahku menyelubungi aku.” Frasa ini juga dapat diterjemahkan “rasa malu pada wajahku menyelubungi aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Sepanjang hari
  rationale: Ungkapan waktu ini secara alami menyatakan keadaan yang berlangsung sepanjang hari.
- source_word: כְּלִמָּתִי
  choice: kehinaanku
  rationale: Nomina ini menunjuk pada kehinaan atau aib yang dialami di hadapan orang lain; pilihan ini mempertahankan dimensi sosialnya dan membedakannya dari בֹשֶׁת.
- source_word: נֶגְדִּי
  choice: ada di hadapanku
  rationale: Preposisi ini menggambarkan sesuatu yang terus berada di depan atau dalam kesadaran si penutur.
- source_word: וּבֹשֶׁת
  choice: dan rasa malu
  rationale: בֹשֶׁת paling langsung menyatakan rasa malu dan membentuk kesejajaran dengan kehinaan pada baris sebelumnya.
- source_word: פָּנַי
  choice: pada wajahku
  rationale: Secara harfiah bentuknya berarti 'wajahku' dalam konstruksi 'rasa malu wajahku'; 'pada wajahku' menghasilkan bahasa Indonesia yang alami tanpa menghilangkan citra wajah.
- source_word: כִּסָּתְנִי
  choice: menyelubungi aku
  rationale: Verba כסה berarti menutupi atau menyelubungi. 'Menyelubungi' mempertahankan metafora rasa malu yang menutupi seluruh diri penutur.
