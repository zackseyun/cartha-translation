  terminology: “Aib” membedakan כְּלִמָּה dari בֹּשֶׁת (“rasa malu”). “Menyelubungi” tetap merupakan padanan puitis yang baik bagi כִּסָּתְנִי. Tidak ada istilah teologis khusus dalam ayat ini.
