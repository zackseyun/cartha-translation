  naturalness: Bahasa secara umum baku dan puitis. Namun, “menanam mereka” menimbulkan rujukan yang tidak wajar dalam bahasa Indonesia, dan “suku-suku bangsa” terasa lebih berat daripada “bangsa-bangsa” dalam paralelisme ini.
  terminology: “Bangsa-bangsa” cocok untuk גּוֹיִם maupun לְאֻמִּים sebagai variasi puitis tanpa membebani istilah kedua. “Menyuruh mereka pergi” lebih dekat dengan arti leksikal שלח daripada “mengusir” dan tidak memaksakan tingkat kekerasan tertentu.
