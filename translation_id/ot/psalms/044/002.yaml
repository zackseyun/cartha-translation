base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: id
  text: Engkau, dengan tangan-Mu, telah menghalau bangsa-bangsa, lalu menanam leluhur kami; Engkau telah menindas bangsa-bangsa dan menyuruh mereka pergi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau telah menindas bangsa-bangsa dan membuat leluhur kami menyebar,” dengan memahami kata “mereka” yang terakhir sebagai merujuk kepada leluhur Israel, bukan kepada bangsa-bangsa.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְךָ
  choice: dengan tangan-Mu
  rationale: Bentuk ini menyatakan tangan sebagai sarana atau kuasa Allah sekaligus mempertahankan gambaran konkret dalam bahasa Ibrani.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks penaklukan negeri, kata ini menunjuk kepada kelompok-kelompok bangsa yang mendiami negeri itu; pilihan ini wajar dan tidak memasukkan kontras teologis yang lebih kemudian.
- source_word: הוֹרַשְׁתָּ
  choice: menghalau
  rationale: Bentuk kausatif verba ini menyatakan tindakan membuat bangsa-bangsa kehilangan milik dan tempat mereka. 'Menghalau' menyampaikan pengusiran dalam konteks penaklukan secara alami.
- source_word: וַתִּטָּעֵם
  choice: dan menanam mereka
  rationale: Terjemahan ini mempertahankan metafora pertanian tentang Allah meneguhkan suatu umat di negeri itu. Rujukan pronomina—secara kontekstual leluhur Israel—tidak dibuat eksplisit karena juga tidak dinyatakan dalam teks Ibrani.
- source_word: תָּרַע
  choice: menindas
  rationale: Dalam bentuk Hifil, verba ini berarti berbuat buruk terhadap, mencelakakan, atau menimpakan penderitaan. 'Menindas' mengungkapkan tindakan merugikan tanpa menentukan caranya secara berlebihan.
- source_word: לְאֻמִּים
  choice: suku-suku bangsa
  rationale: Pilihan ini membedakannya dari גּוֹיִם dalam paralelisme puitis, sambil tetap menunjukkan kelompok-kelompok masyarakat atau bangsa.
- source_word: וַתְּשַׁלְּחֵם
  choice: dan mengusir mereka
  rationale: Verba שלח pada dasarnya berarti 'mengirim' atau 'menyuruh pergi'. Dalam rangkaian penaklukan ini, 'mengusir' menyampaikan tindakan menyuruh keluar dengan lebih alami, sedangkan kemungkinan bahwa pronomina merujuk kepada leluhur Israel dan berarti membuat mereka berkembang dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Rujukan akhiran pronominal pada 'menanam mereka' dan 'mengusir mereka'
  choice: Akhiran pertama dipahami merujuk kepada leluhur Israel, sedangkan akhiran terakhir merujuk kepada suku-suku bangsa yang ditindas.
  alternative: Kedua akhiran dapat dipahami merujuk kepada leluhur Israel, sehingga klausa terakhir berarti Allah membuat mereka menyebar atau berkembang.
  rationale: Puisi Ibrani ini padat dan tidak menyebut rujukan pronomina secara eksplisit. Konteks mendukung tindakan Allah menghalau bangsa-bangsa lalu meneguhkan Israel, sedangkan urutan klausa kedua secara alami menggambarkan penindasan dan pengusiran bangsa-bangsa. Karena rujukan terakhir tetap dapat diperdebatkan, kemungkinan lainnya dicatat tanpa meniadakan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan dengan sapaan ilahi 'Engkau' serta kapitalisasi pronomina hormat. Susunan paralel dan metafora 'menanam' dipertahankan, sementara istilah dibuat mudah dipahami pembaca umum.
