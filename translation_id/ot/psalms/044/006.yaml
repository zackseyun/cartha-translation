  text: כִּ֤י לֹ֣א בְ/קַשְׁתִּ֣/י אֶבְטָ֑ח וְ֝/חַרְבִּ֗/י לֹ֣א תוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/006.yaml
  text: For I do not trust in my bow[b][a], and my sword does not save me.
translation:
  language: id
  text: Sebab aku tidak mengandalkan busurku[a], dan pedangku tidak menyelamatkan aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab aku tidak akan mengandalkan busurku, dan pedangku tidak akan menyelamatkan aku.” Kedua bentuk imperfek Ibrani dapat dipahami dengan nuansa mendatang.
    reason: lexical_alternative
  - marker: b
    text: “Menyelamatkan aku” juga dapat diterjemahkan “memberi aku kemenangan” atau “melepaskan aku” dalam konteks peperangan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendasari pernyataan dalam konteks sekitarnya dan tetap alami dalam puisi Indonesia.
- source_word: בְקַשְׁתִּי
  choice: busurku
  rationale: קֶשֶׁת berarti senjata 'busur'; prefiks ב menyertai verba בטח sehingga diterjemahkan secara alami sebagai 'mengandalkan busurku'.
- source_word: אֶבְטָח
  choice: aku tidak mengandalkan
  rationale: Qal imperfek dari בטח berarti 'percaya kepada' atau 'mengandalkan'. Dalam konteks senjata, 'mengandalkan' terdengar alami dan menyatakan pola keyakinan umum; nuansa mendatang tetap dicatat dalam catatan kaki.
- source_word: וְחַרְבִּי
  choice: dan pedangku
  rationale: Terjemahan langsung yang mempertahankan konjungsi serta kesejajaran antara busur dan pedang.
- source_word: תוֹשִׁיעֵנִי
  choice: tidak menyelamatkan aku
  rationale: Bentuk Hifil dari ישׁע dapat berarti 'menyelamatkan', 'melepaskan', atau 'memberi kemenangan'. 'Menyelamatkan aku' mempertahankan keluasan makna Ibrani tanpa membatasi ungkapan ini pada kemenangan perang.
theological_decisions:
- issue: Makna bahasa keselamatan dalam konteks peperangan
  choice: menyelamatkan aku
  alternative: memberi aku kemenangan; melepaskan aku
  rationale: Konteks militer memungkinkan arti 'memberi kemenangan', tetapi 'menyelamatkan' menjaga jangkauan makna akar ישׁע dan tema ketergantungan kepada Allah tanpa mempersempitnya menjadi keberhasilan di medan perang.
- issue: Nuansa waktu kedua verba imperfek
  choice: 'bentuk kini atau kebiasaan: ''tidak mengandalkan'' dan ''tidak menyelamatkan'''
  alternative: 'bentuk mendatang: ''tidak akan mengandalkan'' dan ''tidak akan menyelamatkan'''
  rationale: Dalam konteks puisi, kedua imperfek dapat menyatakan sikap umum yang sedang berlaku, tetapi nuansa mendatang juga sah dan karena itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa terasa kuno. 'Mengandalkan' dipilih karena lebih wajar daripada 'percaya pada' ketika objeknya adalah senjata. Semua penanda catatan kaki dicantumkan dalam teks utama.
