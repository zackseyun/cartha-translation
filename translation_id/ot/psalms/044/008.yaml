  yaml_path: translation/ot/psalms/044/008.yaml
  text: In God we boast all day long[a], and we will give thanks to your name forever[b]. Selah
translation:
  language: id
  text: Dalam Allah kami bermegah sepanjang hari[a], dan kami akan mengucap syukur kepada nama-Mu untuk selama-lamanya[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam Allah kami memuji sepanjang hari” atau “dalam Allah kami bersukacita dengan bangga sepanjang hari.” Kata kerja Ibrani ini dapat berarti memuji atau bermegah dengan penuh sukacita, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan nama-Mu ... kami akan mengucap syukur”; “untuk selama-lamanya” menyatakan lamanya tindakan itu. Dalam Alkitab, “nama” Allah dapat menunjuk pada diri-Nya sebagaimana Ia menyatakan diri, termasuk karakter dan reputasi-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Dalam Allah
  rationale: 'Preposisi ב paling wajar menyatakan lingkup atau dasar kemegahan: Allah menjadi dasar sekaligus objek kemegahan itu, bukan sekadar sarana.'
- source_word: הִלַּלְנוּ
  choice: kami bermegah
  rationale: Bentuk piel dari הלל dapat berarti memuji, tetapi bersama בֵּאלֹהִים ungkapan ini secara idiomatis berarti bermegah atau bersukacita dengan bangga dalam Allah. Pilihan ini juga mempertahankan perbedaan nuansa dengan נוֹדֶה pada baris kedua.
- source_word: כָל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini menunjukkan kegiatan yang berlangsung terus selama hari itu; 'sepanjang hari' alami dalam bahasa Indonesia modern dan tetap mempertahankan gambaran waktunya.
- source_word: וְשִׁמְךָ
  choice: dan ... kepada nama-Mu
  rationale: Kata 'nama-Mu' merupakan objek dari tindakan mengucap syukur. Preposisi 'kepada' menghasilkan bahasa Indonesia yang alami sekaligus mempertahankan nama Allah sebagai sasaran pengakuan syukur.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan durasi tanpa akhir; bentuk tersebut jelas, lazim, dan bermartabat dalam bahasa Indonesia.
- source_word: נוֹדֶה
  choice: kami akan mengucap syukur
  rationale: Bentuk hiphil dari ידה lazim berarti mengucap syukur atau memuji. 'Mengucap syukur' mempertahankan nuansa pengakuan penuh terima kasih dan tidak mengulang gagasan 'bermegah' pada baris pertama. Bentuk imperfek diterjemahkan sebagai pernyataan berorientasi masa depan.
- source_word: סֶלָה
  choice: Sela
  rationale: Arti tepat istilah liturgis ini tidak pasti, sehingga ditransliterasikan dan tidak diterjemahkan secara spekulatif.
