translation:
  language: id
  text: 'karena suara orang yang mencela dan menghujat[a],

    karena musuh dan orang yang membalas dendam.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan mencaci.” Kata Ibrani ini dapat menunjuk pada ucapan yang sangat menghina, termasuk penghujatan.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari hadapan musuh dan orang yang membalas dendam”; dalam konteks ini ungkapan itu berarti “karena musuh dan orang yang membalas dendam.”
    reason: source_idiom
lexical_decisions:
- source_word: מִקּוֹל
  choice: karena suara
  rationale: Kata depan מִן dalam konteks ini menyatakan sebab, sedangkan 'suara' mempertahankan gambaran konkret dari קוֹל dan kesinambungan dengan ayat sebelumnya.
- source_word: מְחָרֵף
  choice: orang yang mencela
  rationale: Bentuk partisip ini menunjuk kepada pelaku yang melontarkan celaan atau penghinaan; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: וּמְגַדֵּף
  choice: dan menghujat
  rationale: גדף dapat menunjuk kepada ucapan kasar yang menghina dan, dalam pemakaian Alkitab, dapat bernuansa penghujatan terhadap Allah. 'Menghujat' mempertahankan daya teologis itu tanpa menentukan objek yang tidak disebutkan.
- source_word: מִפְּנֵי
  choice: karena
  rationale: Ungkapan yang secara harfiah berkaitan dengan 'muka/hadapan' ini berfungsi secara idiomatis untuk menyatakan sebab atau alasan dalam paralelisme ayat.
- source_word: אֹיֵב
  choice: musuh
  rationale: Pilihan ini mempertahankan bentuk tunggal Ibrani dan dapat dipahami secara representatif atau kolektif sesuai konteks.
- source_word: וּמִתְנַקֵּם
  choice: dan orang yang membalas dendam
  rationale: Partisip hitpael dari נקם menggambarkan seseorang yang melakukan pembalasan; bentuk verbal ini jelas dan alami serta mempertahankan unsur tindakan.
theological_decisions:
- issue: Apakah גדף harus diterjemahkan sebagai penghinaan umum atau penghujatan bernuansa religius
  choice: menghujat
  alternative: menghina atau mencaci
  rationale: Kata tersebut dapat berarti ucapan yang sangat menghina secara umum, tetapi dalam pemakaian Alkitab sering memuat nuansa penistaan terhadap Allah. 'Menghujat' menjaga kemungkinan teologis ini, sementara catatan kaki mempertahankan cakupan makna yang lebih umum.
- issue: Sasaran pembalasan dalam וּמִתְנַקֵּם
  choice: tidak dinyatakan
  alternative: menambahkan 'terhadap kami'
  rationale: Teks Ibrani menyebut pelaku pembalasan tanpa menyatakan objeknya. Terjemahan tidak menambahkan sasaran agar ketegangan dan keluasan ungkapan sumber tetap terpelihara.
translation_notes:
  register: Bahasa dibuat modern, bermartabat, dan mudah dipahami. Pengulangan 'karena' mempertahankan paralelisme Ibrani; susunan ini juga sengaja tetap berupa lanjutan kalimat dari ayat sebelumnya.
