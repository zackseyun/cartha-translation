lexical_decisions:
- source_word: ק֭וּמָֽה
  choice: Bangkitlah
  rationale: Imperatif Qal orang kedua maskulin tunggal dari קום menyampaikan seruan mendesak agar Allah bertindak. “Bangkitlah” alami, jelas, dan tetap mempertahankan gambaran serta daya imperatif teks Ibrani.
- source_word: עֶזְרָ֣תָה לָּ֑נוּ
  choice: menjadi pertolongan bagi kami
  rationale: עֶזְרָה adalah nomina “pertolongan/bantuan,” sedangkan לָנוּ menyatakan pertolongan yang diperuntukkan bagi kami. Bentuk ini mempertahankan konstruksi nominal yang tidak lazim tetapi bermakna, alih-alih langsung mengubahnya menjadi verba “tolonglah kami.”
- source_word: וּ֝פְדֵ֗נוּ
  choice: dan tebuslah kami
  rationale: Imperatif פדה dengan sufiks objek orang pertama jamak dapat menunjuk pada pembebasan melalui tebusan maupun tindakan penyelamatan yang menentukan. “Tebuslah” mempertahankan kedalaman makna pembebasan tanpa menetapkan mekanisme yang tidak disebutkan ayat.
- source_word: לְמַ֣עַן
  choice: demi
  rationale: לְמַעַן menandai dasar atau alasan permohonan. “Demi” ringkas dan wajar dalam bahasa Indonesia, serta menunjukkan bahwa tindakan penyelamatan dimohon berdasarkan kasih setia Allah.
- source_word: חַסְדֶּֽךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד memadukan kasih, kesetiaan, dan loyalitas relasional, sering dalam konteks perjanjian. “Kasih setia” adalah ungkapan Indonesia yang alami dan mempertahankan keluasan nuansa tersebut.
theological_decisions:
- issue: Apakah פדה harus diterjemahkan dengan istilah teologis yang khusus
  choice: tebuslah kami
  alternative: selamatkanlah kami; bebaskanlah kami
  rationale: “Tebuslah” mempertahankan nuansa khas פדה tentang pembebasan, tetapi tidak menambahkan rincian tentang harga atau cara penebusan yang tidak dinyatakan dalam ayat.
- issue: Cara mempertahankan nuansa perjanjian dalam חֶסֶד
  choice: kasih setia-Mu
  alternative: kasih perjanjian-Mu; belas kasih-Mu; kasih-Mu yang teguh
  rationale: “Kasih setia” menjaga ketegangan makna antara kasih, loyalitas, dan kesetiaan Allah tanpa membatasi kata itu hanya pada belas kasihan atau secara eksplisit menambahkan “perjanjian” ke dalam teks utama.
- issue: Hubungan sintaksis עֶזְרָה לָנוּ dengan imperatif קוּמָה
  choice: Bangkitlah menjadi pertolongan bagi kami
  alternative: Bangkitlah untuk menolong kami
  rationale: Terjemahan utama mempertahankan nomina “pertolongan” dan kemungkinan daya aposisional/predikatif frasa Ibrani. Alternatif verbal lebih idiomatis, tetapi mengurangi kejanggalan yang bermakna dalam bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang mendesak dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan “menjadi pertolongan bagi kami” sengaja mempertahankan bentuk nominal dan sedikit ketegangan sintaksis sumber, sementara catatan kaki menyediakan ungkapan yang lebih idiomatis.
