  yaml_path: translation/ot/psalms/044/005.yaml
  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: id
  text: Dengan-Mu kami memukul mundur lawan-lawan kami[a]; dengan nama-Mu[b] kami menginjak-injak mereka yang bangkit melawan kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “memukul mundur” secara harfiah berarti “menanduk” atau “menggempur dengan tanduk”; di sini kata itu dipakai secara kiasan untuk memukul atau mendorong mundur lawan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam nama-Mu.” “Nama” di sini menunjuk kepada identitas, kewibawaan, dan kuasa Allah yang dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: Dengan pertolongan-Mu
  rationale: Preposisi ב dengan pronomina orang kedua menyatakan sarana atau perantaraan. Ungkapan ini alami dalam bahasa Indonesia dan menegaskan ketergantungan pada Allah tanpa memberi kesan tempat.
- source_word: צָרֵינוּ
  choice: lawan-lawan kami
  rationale: צָר menunjuk kepada pihak yang memusuhi atau menindas. 'Lawan-lawan' jelas dan sesuai dengan konteks pertempuran.
- source_word: נְנַגֵּחַ
  choice: kami menanduk mundur
  rationale: Kata kerja נגח secara harfiah menggambarkan tindakan menanduk dengan tanduk. Pilihan ini mempertahankan metafora Ibrani yang kuat, sedangkan 'mundur' menyampaikan akibat berupa pemukulmunduran lawan.
- source_word: בְּשִׁמְךָ
  choice: dengan nama-Mu
  rationale: Ungkapan ini mempertahankan bentuk dan kesejajaran teks Ibrani. 'Nama' menunjuk kepada identitas, kewibawaan, dan kuasa Allah yang dinyatakan, bukan sekadar sebutan.
- source_word: נָבוּס
  choice: kami menginjak-injak
  rationale: בוס berarti menginjak atau menginjak-injak. Bentuk ulang memberikan gambaran tindakan yang kuat dan cocok dengan citra kemenangan dalam ayat ini.
- source_word: קָמֵינוּ
  choice: orang-orang yang bangkit melawan kami
  rationale: Partisipel dari קום secara harfiah menggambarkan mereka yang bangkit menentang. Klausa ini mempertahankan nuansa verbal sumber.
theological_decisions:
- issue: Peranan Allah dan umat dalam kemenangan perang
  choice: Allah ditampilkan sebagai sumber dan sarana penentu kemenangan, sementara umat tetap digambarkan bertindak dalam pertempuran.
  alternative: Menonjolkan tindakan militer manusia saja, atau memahami 'nama-Mu' sebagai formula ucapan yang bekerja secara otomatis.
  rationale: Dua frasa בְּךָ dan בְּשִׁמְךָ mengaitkan kemenangan dengan Allah, tetapi verba orang pertama jamak tetap menyatakan tindakan umat. Terjemahan mempertahankan ketegangan keduanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis dan bermartabat. Metafora tanduk dipertahankan karena nyata dalam sumber, lalu dijelaskan dalam catatan kaki. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
