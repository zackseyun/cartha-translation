    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Namun
  rationale: Dalam alur mazmur ini, partikel tersebut memperkenalkan keadaan yang berlawanan dengan pernyataan sebelumnya bahwa umat tidak meninggalkan jalan Allah. “Namun” mengungkapkan hubungan konsesif itu secara alami dalam bahasa Indonesia tanpa menghilangkan ketegangan teks.
- source_word: דִכִּיתָנוּ
  choice: Engkau telah meremukkan kami
  rationale: Kata kerja דכה menyatakan tindakan meremukkan, menghancurkan, atau merendahkan. “Meremukkan” mempertahankan kekuatan gambaran penderitaan tersebut.
- source_word: בִּמְקוֹם תַּנִּים
  choice: di tempat anjing hutan
  rationale: Dalam gambaran tempat sunyi dan tandus ini, תַּנִּים paling mungkin menunjuk kepada jakal atau anjing hutan. Susunan ini tetap dekat dengan bentuk Ibrani dan dapat dipahami pembaca modern.
- source_word: וַתְּכַס עָלֵינוּ
  choice: dan menyelimuti kami
  rationale: Kata כסה berarti menutupi. “Menyelimuti kami” terdengar alami serta mempertahankan metafora tentang kegelapan yang melingkupi umat.
- source_word: בְצַלְמָוֶת
  choice: dengan kelam pekat
  rationale: צַלְמָוֶת dapat dipahami sebagai kegelapan atau kekelaman yang sangat dalam. “Kelam pekat” menyampaikan daya puitis ungkapan itu tanpa memastikan bahwa kematian dirujuk secara langsung.
theological_decisions:
- issue: Makna צַלְמָוֶת
  choice: kelam pekat
  alternative: bayang-bayang maut
  rationale: Istilah ini dapat dipahami secara leksikal sebagai kegelapan yang sangat dalam atau secara tradisional sebagai “bayang-bayang maut”. Teks utama memakai ungkapan yang wajar dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan kemungkinan kaitannya dengan maut.
- issue: Hubungan כִּי dengan konteks sebelumnya
  choice: Namun
  alternative: Sebab; sungguh
  rationale: Pernyataan bahwa Allah meremukkan umat muncul sesudah pengakuan bahwa mereka tidak menyimpang dari jalan-Nya. Terjemahan konsesif mempertahankan ketegangan bahwa penderitaan itu terjadi sekalipun mereka mengaku setia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan “Engkau” mempertahankan seruan langsung kepada Allah. Pilihan “kelam pekat” menjaga suasana puisi ratapan, sedangkan dua catatan kaki mempertahankan alternatif leksikal utama.
