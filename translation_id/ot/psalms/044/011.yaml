id: PSA.44.11
reference: Psalms 44:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תִּ֭תְּנֵ/נוּ כְּ/צֹ֣אן מַאֲכָ֑ל וּ֝/בַ/גּוֹיִ֗ם זֵרִיתָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/011.yaml
  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: id
  text: Engkau menyerahkan kami seperti kawanan domba untuk dimakan, dan Engkau telah menyerakkan kami di antara bangsa-bangsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bangsa-bangsa” di sini berarti bangsa-bangsa asing yang di tengah-tengahnya Israel telah tercerai-berai.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: Engkau menyerahkan kami
  rationale: Bentuk dari נתן pada dasarnya berarti “memberikan/menempatkan”, tetapi dalam ratapan ini menyatakan tindakan menyerahkan umat kepada nasib yang bermusuhan. “Menyerahkan” mengungkapkan daya kontekstual itu secara alami dalam bahasa Indonesia.
- source_word: כְּצֹאן
  choice: seperti kawanan domba
  rationale: Prefiks כ menandai perbandingan. צאן merupakan nomina kolektif untuk ternak kecil, khususnya domba dan kambing; dalam gambaran ini “kawanan domba” paling alami dan sesuai konteks.
- source_word: מַאֲכָל
  choice: untuk dimakan
  rationale: Nomina ini berarti makanan atau sesuatu untuk dimakan, bukan secara khusus penyembelihan. Pilihan ini mempertahankan gambaran keras tentang umat sebagai mangsa tanpa menambahkan gagasan “dibantai” yang tidak dinyatakan oleh kata Ibrani tersebut.
- source_word: וּבַגּוֹיִם
  choice: dan ... di antara bangsa-bangsa
  rationale: גּוֹיִם di sini menunjuk kepada bangsa-bangsa asing tempat Israel tersebar. “Bangsa-bangsa” merupakan padanan Indonesia yang baku dan tidak membawa nuansa Perjanjian Baru yang mungkin muncul pada istilah lain.
- source_word: זֵרִיתָנוּ
  choice: Engkau telah menyerakkan kami
  rationale: Dari זרה, “menyerakkan/menampi”. Dalam konteks penyebaran umat di antara bangsa-bangsa, “menyerakkan” jelas sekaligus masih mempertahankan gema tindakan menyebarkan. Bentuk perfektif diterjemahkan “telah” untuk menyatakan tindakan yang sudah terjadi dan akibatnya masih dirasakan.
theological_decisions:
- issue: Metafora umat sebagai kawanan domba yang menjadi makanan
  choice: Gambaran “seperti kawanan domba untuk dimakan” dipertahankan tanpa diperhalus.
  alternative: “seperti kawanan domba untuk dibantai” atau “untuk dilahap”
  rationale: Ayat ini meratapi tindakan Allah yang membiarkan umat-Nya menjadi mangsa dan kemudian menyerakkan mereka. Terjemahan mempertahankan ketegangan dan kekerasan ratapan, tetapi tidak memasukkan gagasan penyembelihan yang lebih khusus daripada מַאֲכָל.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi “Engkau” dipakai untuk sapaan kepada Allah. Urutan klausa serta metafora sumber dipertahankan, dengan susunan yang alami bagi pembaca Indonesia.
