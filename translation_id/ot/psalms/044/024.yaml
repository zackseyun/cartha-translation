  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: id
  text: Mengapa Engkau menyembunyikan wajah-Mu dan melupakan penderitaan kami dan penindasan kami?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kehadiran-Mu.” Secara harfiah, bahasa Ibrani mengatakan “wajah-Mu,” suatu ungkapan yang lazim untuk perhatian yang penuh perkenanan atau kedekatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya alasan yang alami dalam bahasa Indonesia dan mempertahankan seruan langsung dalam ratapan.
- source_word: פָנֶיךָ
  choice: wajah-Mu
  rationale: Mempertahankan ungkapan harfiah dan puitis Ibrani yang menunjuk pada kehadiran, perhatian, atau perkenanan Allah.
- source_word: תַסְתִּיר
  choice: menyembunyikan
  rationale: Padanan langsung untuk bentuk kausatif סתר dan wajar digunakan bersama 'wajah-Mu'.
- source_word: תִּשְׁכַּח
  choice: melupakan
  rationale: Mempertahankan bahasa ratapan yang berani; tidak diperlemah menjadi 'mengabaikan'.
- source_word: עָנְיֵנוּ
  choice: penderitaan kami
  rationale: Padanan modern dan luas bagi kesengsaraan atau keadaan tertindas yang dialami umat.
- source_word: וְלַחֲצֵנוּ
  choice: serta penindasan kami
  rationale: לַחַץ dapat menyatakan tekanan atau kesesakan akibat pihak yang memusuhi; 'penindasan' menangkap dimensi eksternal tersebut.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah dalam 'wajah-Mu'
  choice: Mempertahankan ungkapan 'wajah-Mu'.
  alternative: kehadiran-Mu
  rationale: Bahasa tubuh yang relasional dalam teks Ibrani menyampaikan perhatian, kedekatan, dan perkenanan ilahi. Ungkapan itu dipertahankan agar daya puitis dan ketegangan teologis ratapan tidak diabstraksikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. 'Serta' dipakai untuk menghubungkan dua objek dari verba 'melupakan' dengan lancar tanpa mengubah hubungan sintaksis.
