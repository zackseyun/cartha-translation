id: PSA.44.17
reference: Psalms 44:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל זֹ֣את בָּ֭אַתְ/נוּ וְ/לֹ֣א שְׁכַחֲנ֑וּ/ךָ וְ/לֹֽא שִׁ֝קַּ֗רְנוּ בִּ/בְרִיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: id
  text: Semua ini telah menimpa kami, tetapi kami tidak melupakan Engkau dan tidak berlaku curang terhadap perjanjian-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak mengkhianati perjanjian-Mu.”'
    reason: Alternatif ini menonjolkan ketidaksetiaan perjanjian yang dapat tercakup dalam verba שׁקר, sedangkan teks utama mempertahankan nuansa tindakan curang atau palsu.
lexical_decisions:
- source_word: כָּל זֹאת
  choice: Semua ini
  rationale: Ungkapan rangkuman ini merujuk secara menyeluruh pada berbagai penderitaan yang telah disebutkan sebelumnya.
- source_word: בָּאַתְנוּ
  choice: telah menimpa kami
  rationale: Secara harfiah penderitaan itu 'datang kepada/atas kami'; 'menimpa kami' mempertahankan gambarannya sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וְלֹא
  choice: tetapi ... tidak
  rationale: Dalam konteks ini waw dengan penyangkalan menyatakan pertentangan antara penderitaan yang dialami dan kesetiaan yang tetap dipertahankan.
- source_word: שְׁכַחֲנוּךָ
  choice: kami tidak melupakan Engkau
  rationale: Menerjemahkan makna langsung kata kerja dan sufiks objek orang kedua tunggal yang menunjuk kepada Allah.
- source_word: שִׁקַּרְנוּ
  choice: tidak berlaku curang
  rationale: Dalam konteks perjanjian, verba ini menunjuk pada tindakan palsu, curang, atau tidak setia; pilihan ini lebih luas daripada sekadar 'berbohong'.
- source_word: בִּבְרִיתֶךָ
  choice: terhadap perjanjian-Mu
  rationale: Preposisi ב dengan שׁקר menandai ranah atau sasaran tindakan curang; 'terhadap' menghasilkan ungkapan Indonesia yang wajar tanpa mengubah 'perjanjian-Mu'.
theological_decisions:
- issue: Sifat pengakuan umat tentang ketidakbersalahan di tengah penderitaan
  choice: Ayat diterjemahkan sebagai pernyataan bahwa mereka tetap mengingat Allah dan tidak berlaku curang terhadap perjanjian-Nya.
  alternative: Memperluasnya menjadi pengakuan bahwa mereka sama sekali tidak berdosa di hadapan Allah.
  rationale: Teks hanya menyangkal dua bentuk ketidaksetiaan tertentu. Terjemahan mempertahankan batas klaim itu dan tidak menjadikannya pernyataan tentang ketidakberdosaan mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada “Engkau” dan sufiks “-Mu” dipakai untuk sapaan kepada Allah. Susunan kalimat menjaga kontras puitis tanpa terdengar kaku.
