  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: id
  text: Sebab, bukan dengan pedang mereka mereka memperoleh negeri itu, dan bukan lengan mereka yang menyelamatkan mereka, melainkan tangan kanan-Mu, lengan-Mu, dan cahaya wajah-Mu[a], karena Engkau berkenan kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cahaya hadirat-Mu”; bahasa Ibraninya secara harfiah berbunyi “cahaya wajah-Mu”, suatu gambaran tentang perkenanan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: memperoleh
  rationale: Dalam konteks perebutan wilayah, kata ini menyatakan bahwa mereka mendapatkan atau menguasai negeri itu. “Memperoleh” alami dalam bahasa Indonesia dan tidak membatasi maknanya pada warisan pasif.
- source_word: אָרֶץ
  choice: negeri itu
  rationale: Konteksnya menunjuk pada wilayah tertentu yang diperoleh umat, bukan bumi secara umum.
- source_word: זְרוֹעָם
  choice: lengan mereka sendiri
  rationale: Metafora tubuh dipertahankan agar kesejajaran dan pertentangannya dengan “lengan-Mu” tetap terasa. “Sendiri” memperjelas kontras sumber kekuatan tanpa menambah gagasan baru.
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: yang menyelamatkan mereka
  rationale: Mempertahankan arti dasar verba ‘menyelamatkan’ atau ‘melepaskan’, meskipun konteksnya adalah kemenangan militer.
- source_word: יְמִינְךָ
  choice: tangan kanan-Mu
  rationale: Mempertahankan gambaran Ibrani tentang tindakan dan kuasa Allah.
- source_word: זְרוֹעֲךָ
  choice: lengan-Mu
  rationale: Metafora asli dipertahankan dan dibuat sejajar dengan “lengan mereka sendiri”.
- source_word: אוֹר פָּנֶיךָ
  choice: cahaya wajah-Mu
  rationale: Terjemahan ini mempertahankan gambaran puitis tentang perkenanan dan kehadiran ilahi; maknanya tidak dipersempit menjadi satu penafsiran saja.
- source_word: רְצִיתָם
  choice: Engkau berkenan kepada mereka
  rationale: Ungkapan ini menyampaikan sikap perkenanan atau kesenangan Allah dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: כִּי ... כִּי
  choice: Sebab ... karena
  rationale: Kata pertama memperkenalkan penjelasan atas ayat sebelumnya, sedangkan kata terakhir menyatakan alasan tindakan Allah; pembedaan konjungsi membuat alurnya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Tindakan Allah dibandingkan kekuatan militer manusia
  choice: Ayat ini secara langsung mengontraskan pedang dan lengan umat dengan tangan kanan, lengan, dan cahaya wajah Allah.
  alternative: Menjadikannya pernyataan umum tentang ketergantungan manusia kepada Allah.
  rationale: Susunan konkret teks Ibrani dipertahankan tanpa memperluasnya menjadi rumusan doktrinal umum.
- issue: Makna אוֹר פָּנֶיךָ
  choice: Gambaran harfiah “cahaya wajah-Mu” dipertahankan dalam teks utama.
  alternative: “cahaya hadirat-Mu” atau “perkenanan-Mu”.
  rationale: Ungkapan Ibrani dapat menyiratkan perkenanan maupun kehadiran Allah. Gambaran aslinya mempertahankan keluasan makna itu.
- issue: Elipsis verba dalam klausa tentang tindakan Allah
  choice: Klausa diterjemahkan secara eliptis dengan “melainkan”, mengikuti bentuk puitis sumber.
  alternative: Menambahkan “yang melakukannya” atau mengulang verba sebelumnya.
  rationale: Teks Ibrani tidak menyebutkan verba dalam klausa ini. Elipsis masih jelas dan alami dalam bahasa Indonesia serta menghindari satu kata ganti yang harus merujuk kepada dua tindakan berbeda.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Kesejajaran antara pedang, lengan manusia, tangan kanan Allah, dan lengan Allah dipertahankan.
