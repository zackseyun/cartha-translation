  text: You have made us a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: id
  text: Engkau telah menjadikan kami bahan celaan bagi tetangga kami, bahan olok-olok dan ejekan[a] bagi orang-orang di sekeliling kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bahan tertawaan dan cemoohan.” Kedua kata Ibrani yang berpasangan ini menekankan penghinaan terbuka oleh orang-orang di sekitar kami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Engkau telah menjadikan kami
  rationale: Bentuk dari שׂים berarti ‘menaruh, menetapkan, menjadikan’. Dalam konteks ratapan ini, bentuk perfektif menyatakan keadaan yang telah dihasilkan oleh tindakan Allah.
- source_word: חֶרְפָּה
  choice: bahan celaan
  rationale: Kata ini menunjuk pada cela, kehinaan, atau keadaan menjadi sasaran penghinaan. ‘Bahan celaan’ alami dalam bahasa Indonesia dan mempertahankan dimensi sosialnya.
- source_word: לִשְׁכֵנֵינוּ
  choice: bagi tetangga-tetangga kami
  rationale: Preposisi ל menyatakan hubungan atau pihak yang memandang Israel sebagai celaan. Bentuk jamak ‘tetangga-tetangga’ mempertahankan rujukan kepada bangsa-bangsa yang berdekatan.
- source_word: לַעַג
  choice: olok-olok
  rationale: לַעַג mengacu pada tindakan mengejek atau menertawakan dengan hina. ‘Olok-olok’ jelas dan wajar dalam bahasa Indonesia modern.
- source_word: קֶלֶס
  choice: ejekan
  rationale: קֶלֶס berarti ejekan atau cemoohan. ‘Ejekan’ melengkapi ‘olok-olok’ dan mempertahankan penguatan melalui pasangan kata yang sejajar.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: bagi orang-orang di sekeliling kami
  rationale: Secara harfiah berarti ‘bagi mereka yang di sekitar kami’ dan dalam konteks merujuk pada bangsa-bangsa atau kelompok-kelompok di sekitar Israel. Terjemahan ini tetap luas tanpa menambahkan penentuan yang tidak dinyatakan.
