  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
translation:
  language: id
  text: Sebab Engkau telah menyelamatkan kami dari musuh-musuh kami dan telah mempermalukan orang-orang yang membenci kami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan dasar bagi pernyataan keyakinan dan pujian pada konteks sebelumnya; “Sebab” mempertahankan hubungan kausal secara alami.
- source_word: הוֹשַׁעְתָּנוּ
  choice: Engkaulah yang menyelamatkan kami
  rationale: Bentuk Hifil dari יָשַׁע menyatakan tindakan Allah yang menyelamatkan atau melepaskan. Konstruksi “Engkaulah yang” juga mengungkapkan penekanan pada subjek yang tersirat dalam bentuk Ibrani.
- source_word: מִצָּרֵינוּ
  choice: dari lawan-lawan kami
  rationale: צַר menunjuk kepada pihak yang memusuhi atau mendesak. “Lawan-lawan” cukup luas untuk mempertahankan makna itu dan sesuai dengan ragam mazmur.
- source_word: וּמְשַׂנְאֵינוּ
  choice: dan orang-orang yang membenci kami
  rationale: Bentuk partisip dari שָׂנֵא secara harfiah menunjuk kepada orang-orang yang sedang atau biasa membenci kami. Ungkapan ini alami dalam bahasa Indonesia dan tidak mereduksinya menjadi sekadar “musuh”.
- source_word: הֱבִישׁוֹתָ
  choice: mempermalukan
  rationale: Bentuk Hifil menyatakan tindakan menyebabkan malu atau aib; “mempermalukan” mempertahankan daya kausatifnya dengan ringkas.
