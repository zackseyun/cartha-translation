  source_fidelity: Teks utama dengan tepat mempertahankan kausatif תְּשִׁיבֵנוּ ('Engkau membuat kami mundur'), gerak mundur אָחוֹר, serta pembedaan antara צָר ('lawan') dan מְשַׂנְאֵינוּ ('orang-orang yang membenci kami'). Frasa 'dari hadapan lawan' merupakan pengungkapan yang dapat diterima untuk מִנִּי צָר dalam konteks kekalahan militer. Makna לָמוֹ sebagai keuntungan para pelaku juga dipertahankan.
