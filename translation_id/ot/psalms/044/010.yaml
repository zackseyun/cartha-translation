  text: תְּשִׁיבֵ֣/נוּ אָ֭חוֹר מִנִּי צָ֑ר וּ֝/מְשַׂנְאֵ֗י/נוּ שָׁ֣סוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/010.yaml
  text: You make us turn back from the foe[b][a], and those who hate us plunder for themselves.
translation:
  language: id
  text: Engkau membuat kami mundur dari hadapan lawan, dan orang-orang yang membenci kami mengambil jarahan bagi diri mereka sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan orang-orang yang membenci kami telah mengambil jarahan bagi diri mereka sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיבֵנוּ אָחוֹר
  choice: Engkau membuat kami mundur
  rationale: Bentuk Hifil dari שׁוב bersifat kausatif, sedangkan אָחוֹר menunjukkan gerak ke belakang. Dalam konteks pertempuran, frasa ini secara alami menyatakan bahwa Allah menyebabkan umat-Nya terdesak mundur.
- source_word: מִנִּי צָר
  choice: dari hadapan lawan
  rationale: Preposisi מן dapat menggambarkan gerak menjauh dari lawan. Ungkapan 'dari hadapan lawan' mempertahankan nuansa spasial dan suasana pertempuran; 'dari lawan' juga mungkin.
- source_word: מְשַׂנְאֵינוּ
  choice: orang-orang yang membenci kami
  rationale: Partisip ini diterjemahkan secara verbal agar tindakan membenci tetap nyata dan tidak disamakan begitu saja dengan צָר, 'lawan'.
- source_word: שָׁסוּ
  choice: menjarah
  rationale: Kata kerja ini berarti mengambil jarahan. Bentuk lampau Ibrani di dalam ratapan dapat disampaikan secara naratif dengan bentuk Indonesia yang tidak menandai kala secara morfologis.
- source_word: לָמוֹ
  choice: bagi diri mereka sendiri
  rationale: 'Bentuk pronominal ini paling wajar dipahami sebagai datif keuntungan: para pembenci mengambil jarahan untuk kepentingan mereka sendiri.'
theological_decisions:
- issue: Allah sebagai penyebab kemunduran Israel
  choice: 'Mempertahankan kausatif langsung: ''Engkau membuat kami mundur'''
  alternative: Kami mundur dari hadapan lawan
  rationale: Teks Ibrani secara eksplisit memakai bentuk kausatif dengan Allah sebagai subjek. Ketegangan teologis dalam ratapan tidak dilunakkan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. 'Lawan' dipilih untuk צָר, sedangkan ungkapan partisipial 'orang-orang yang membenci kami' dipertahankan agar paralelisme tidak diratakan. Penanda catatan kaki [a] muncul dalam teks utama.
