  text: ע֤וּרָ/ה לָ֖/מָּה תִישַׁ֥ן אֲדֹנָ֑/י הָ֝קִ֗יצָ/ה אַל תִּזְנַ֥ח לָ/נֶֽצַח׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: id
  text: Bangunlah! Mengapa Engkau tidur, ya Tuhan? Bangunlah! Janganlah menolak kami[a] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata kami tersirat dari konteks. Atau: membuang kami.'
    reason: Objek verba tidak disebutkan secara eksplisit dalam bahasa Ibrani; catatan ini menjelaskan objek tersirat dan mempertahankan alternatif leksikal yang wajar untuk זנח.
lexical_decisions:
- source_word: ע֤וּרָה
  choice: Bangunlah!
  rationale: Bentuk imperatif dari עור yang menyerukan agar bangun. Pilihan ini tegas, alami, dan mempertahankan keberanian seruan pemazmur kepada Allah.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya yang lazim untuk menyampaikan keluhan mengenai alasan atau sebab.
- source_word: תִישַׁן
  choice: Engkau tidur
  rationale: Bentuk imperfek dari ישׁן dalam pertanyaan retoris. Terjemahan ini mempertahankan gambaran antropomorfis dalam bahasa Ibrani tanpa melunakkannya.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: Gelar ilahi dalam sapaan langsung. Partikel 'ya' membuat bentuk vokatifnya alami dan jelas dalam bahasa Indonesia.
- source_word: הָקִיצָה
  choice: Bangkitlah!
  rationale: Imperatif dari קיץ/יקץ, verba lain yang berkaitan dengan terjaga atau bangun. 'Bangkitlah' menghindari pengulangan kaku sekaligus mempertahankan peningkatan desakan dalam paralelisme.
- source_word: אַל תִּזְנַח
  choice: Janganlah menolak kami
  rationale: זנח berarti menolak, membuang, atau meninggalkan. 'Menolak' jelas dalam bahasa Indonesia modern; objek 'kami' tidak dinyatakan secara eksplisit dalam frasa ini, tetapi tersirat kuat dari konteks keluhan komunal mazmur.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan waktu yang terus-menerus atau permanen. 'Untuk selama-lamanya' merupakan padanan Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah yang tidur dan harus bangun
  choice: Mempertahankan gambaran langsung tentang tidur dan bangun dalam teks utama
  alternative: Melunakkannya menjadi 'Mengapa Engkau seolah-olah tidak bertindak?'
  rationale: Bahasa Ibrani dengan berani menyapa Allah melalui gambaran tidur dan bangun. Terjemahan perlu mempertahankan ketegangan dalam ratapan ini dan tidak mengubahnya menjadi penjelasan teologis. Ayat ini mengungkapkan pengalaman pemazmur, bukan mengajarkan bahwa Allah secara harfiah tidur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas, mendesak, dan bermartabat. Kapitalisasi kata ganti 'Engkau' mengikuti kebiasaan teks keagamaan Indonesia saat menyapa Allah. Dua imperatif diterjemahkan dengan kata berbeda untuk mencerminkan dua verba Ibrani dan mempertahankan paralelisme yang meningkat.
