  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: id
  text: Sebab demi Engkau[a] kami dibunuh sepanjang hari; kami dianggap[b] seperti domba untuk disembelih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena Engkau” atau “oleh karena Engkau.” Ungkapan Ibrani ini dapat menyatakan penderitaan yang dialami dalam kaitan dengan Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “kami diperhitungkan sebagai domba untuk disembelih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi keluhan sebelumnya; “Sebab” mempertahankan hubungan wacananya secara alami.
- source_word: עָלֶיךָ
  choice: demi Engkau
  rationale: Ungkapan ini menyatakan bahwa penderitaan dialami dalam kaitan dengan Allah. “Demi Engkau” alami dalam bahasa Indonesia dan tidak secara tegas menjadikan Allah pelaku pembunuhan.
- source_word: הֹרַגְנוּ
  choice: kami dibunuh
  rationale: Walaupun bentuk Ibraninya perfektif, konteks ratapan dan keterangan durasi menyampaikan kenyataan yang berlangsung atau berulang; bentuk pasif “kami dibunuh” mempertahankan ketidakjelasan mengenai pelakunya.
- source_word: כָל הַיּוֹם
  choice: sepanjang hari
  rationale: Ini merupakan ungkapan Indonesia yang alami untuk durasi yang terus-menerus.
- source_word: נֶחְשַׁבְנוּ
  choice: kami dianggap
  rationale: “Dianggap” menyampaikan makna penilaian pasif secara jelas dan alami, tanpa kesan penghitungan angka.
- source_word: כְּצֹאן
  choice: seperti domba
  rationale: Kata pembanding Ibrani כְּ diterjemahkan secara alami sebagai “seperti”; bentuk kolektif Ibrani dinyatakan dengan “domba” dalam bahasa Indonesia.
- source_word: טִבְחָה
  choice: yang akan disembelih
  rationale: Frasa ini menyampaikan tujuan atau nasib domba secara wajar dan bermartabat dalam konteks ratapan.
theological_decisions:
- issue: Apakah penderitaan itu disebabkan langsung oleh Allah atau dialami karena hubungan dan kesetiaan umat kepada-Nya
  choice: “demi Engkau” menyatakan bahwa penderitaan dialami dalam kaitan dengan Allah tanpa menetapkan bahwa Allah adalah pelaku langsung pembunuhan itu.
  alternative: “karena Engkau” atau “oleh karena Engkau”
  rationale: Preposisi Ibrani memungkinkan nuansa sebab, acuan, atau kepentingan. Terjemahan utama mempertahankan ketegangan teologis tersebut tanpa mengubahnya menjadi tuduhan langsung maupun penjelasan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas dan bermartabat. Susunan paralel puisi Ibrani dipertahankan, sedangkan ungkapan tujuan pada bagian akhir dibuat alami bagi pembaca masa kini.
