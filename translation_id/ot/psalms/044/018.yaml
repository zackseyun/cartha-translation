base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: id
  text: Hati kami tidak berpaling ke belakang,[a] dan langkah kami tidak menyimpang dari jalan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hati kami tidak mundur, dan jejak langkah kami tidak berbelok dari jalan-Mu.”'
    reason: Alternatif leksikal yang mencerminkan kemungkinan padanan bagi נָסוֹג אָחוֹר, אֲשֻׁרֵינוּ, dan וַתֵּט.
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: berbalik mundur
  rationale: Gabungan kata kerja סוג dan keterangan אָחוֹר menyatakan gerak kembali atau mundur. Ungkapan ini mempertahankan metafora penarikan diri atau ketidaksetiaan dengan bahasa Indonesia yang wajar.
- source_word: לִבֵּנוּ
  choice: Hati kami
  rationale: Kata 'hati' menunjuk pada batin, kehendak, dan kesetiaan manusia. Bentuk tunggal kolektif Ibrani dipertahankan karena alami dalam bahasa Indonesia dan menjaga citra puitisnya.
- source_word: וַתֵּט
  choice: menyimpang
  rationale: Dalam gambaran mengenai jalan, נטה berarti berbelok atau menyimpang. 'Menyimpang' secara alami menyatakan gerak menjauh dari arah yang seharusnya tanpa menambahkan penafsiran moral yang tidak tersurat.
- source_word: אֲשֻׁרֵינוּ
  choice: langkah kami
  rationale: Kata ini merujuk pada langkah atau gerak perjalanan, bukan terutama anggota tubuh. 'Langkah' mempertahankan metafora kehidupan sebagai perjalanan.
- source_word: מִנִּי
  choice: dari
  rationale: Preposisi ini menandai pemisahan. Bersama 'menyimpang', kata 'dari' cukup jelas dan alami.
- source_word: אָרְחֶךָ
  choice: jalan-Mu
  rationale: אֹרַח berarti jalan atau lintasan dan di sini dapat menggambarkan arah hidup yang ditetapkan Allah. 'Jalan-Mu' merupakan ungkapan Indonesia yang alami serta mempertahankan metafora konkret dan kemungkinan makna kiasannya.
theological_decisions:
- issue: Metafora antropologis 'hati'
  choice: Mempertahankan 'hati' secara harfiah
  alternative: Menerjemahkannya secara interpretatif sebagai 'batin', 'pikiran', atau 'kesetiaan'
  rationale: Kata Ibrani mencakup kehendak, pikiran, dan kesetiaan batin. 'Hati' menjaga keluasan makna serta kesinambungan bahasa teologis dan puitis Alkitab.
- issue: Makna penyimpangan dari jalan Allah
  choice: Mempertahankan gambaran langkah yang menyimpang dari jalan Allah
  alternative: Menjelaskannya langsung sebagai ketidaktaatan atau kemurtadan
  rationale: Teks memakai metafora perjalanan dan tidak secara eksplisit memberi label teologis tertentu. Terjemahan ini membiarkan daya metafora dan ketegangan konteks tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda koma sebelum penanda catatan kaki menjaga marker tetap melekat pada frasa yang dijelaskan.
