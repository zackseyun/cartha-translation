  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: id
  text: Jika kami telah melupakan nama Allah kami dan telah menadahkan tangan kami kepada ilah asing—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ilah lain.” Kata Ibrani yang diterjemahkan “asing” dapat berarti “asing,” “aneh,” atau “dari luar”; dalam konteks ini, kata itu menunjuk kepada ilah yang tidak termasuk dalam ibadah perjanjian Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם שָׁכַחְנוּ
  choice: Jika kami telah melupakan
  rationale: Partikel kondisional dengan verba perfektum menyatakan pengandaian dalam pembelaan retrospektif. Bentuk “telah melupakan” alami dalam bahasa Indonesia dan mempertahankan nuansa tindakan yang dianggap sudah terjadi.
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: nama Allah kami
  rationale: “Nama” mempertahankan idiom Ibrani yang menunjuk pada identitas Allah sebagaimana dikenal dan diseru umat-Nya; bentuk posesif diterjemahkan langsung.
- source_word: וַנִּפְרֹשׂ כַּפֵּינוּ
  choice: dan menadahkan tangan kami
  rationale: Gabungan verba פרשׂ dan כַּף menggambarkan tangan yang dibentangkan atau ditadahkan dalam doa dan permohonan. “Menadahkan tangan” merupakan ungkapan Indonesia yang alami tanpa mengubah gerak konkret itu menjadi tafsiran eksplisit seperti “menyembah”.
- source_word: לְאֵל זָר
  choice: kepada ilah asing
  rationale: Preposisi לְ menyatakan arah tindakan, sedangkan זָר menunjuk pada ilah yang asing bagi ibadah perjanjian Israel. “Ilah” membedakannya dari sebutan “Allah” bagi Allah Israel dalam baris yang sama.
theological_decisions:
- issue: Gerak tangan yang berkaitan dengan penyembahan berhala
  choice: menadahkan tangan kami kepada ilah asing
  alternative: menyembah ilah asing
  rationale: Teks Ibrani menyebut gerak tangan dalam doa atau permohonan, bukan memakai verba eksplisit untuk “menyembah”. Terjemahan mempertahankan gambaran konkret dan implikasi penyembahannya tanpa mempersempit makna.
- issue: Makna זָר bagi ilah lain
  choice: ilah asing
  alternative: ilah yang bukan milik kami
  rationale: “Asing” mempertahankan kemungkinan nuansa “asing”, “dari luar”, atau “bukan bagian dari ibadah umat”, tanpa menambahkan penjelasan teologis ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Menadahkan tangan” dipilih sebagai padanan idiomatis bagi gerak tangan dalam doa; “ilah asing” mempertahankan kekhasan objek penyembahan yang bukan Allah Israel. Tanda pisah mempertahankan kalimat pengandaian yang berlanjut ke ayat berikutnya.
