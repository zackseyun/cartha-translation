  yaml_path: translation/ot/psalms/033/020.yaml
  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: id
  text: Jiwa kami[a] menanti-nantikan Yahweh; Dialah pertolongan kami dan perisai kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Jiwa kami menanti-nantikan Yahweh.” Kata “jiwa” di sini menyatakan diri atau batin seluruh umat secara kolektif, bukan hanya bagian manusia yang tidak berwujud.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: Jiwa kita
  rationale: Bentuk tunggal נֶפֶשׁ dengan akhiran orang pertama jamak menyatakan diri atau batin seluruh umat secara kolektif. “Jiwa kita” mempertahankan gambaran Ibrani tanpa membatasinya pada bagian tak berwujud dari manusia.
- source_word: חִכְּתָה
  choice: menanti-nantikan
  rationale: Kata kerja חכה menyatakan penantian yang disertai harapan. Reduplikasi dalam bahasa Indonesia menyampaikan penantian yang tekun dan penuh harap secara alami, sedangkan kala perfek Ibrani tidak perlu dibuat kaku menjadi “telah menanti” dalam konteks puitis ini.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Preposisi ל menandai Dia yang dinantikan; dalam bahasa Indonesia hubungan itu sudah dinyatakan secara idiomatis oleh verba “menanti-nantikan”. Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: עֶזְרֵנוּ
  choice: pertolongan kita
  rationale: Nomina עֵזֶר berarti pertolongan atau bantuan. Pilihan ini mempertahankan bentuk nominal abstrak dalam klausa predikatif, alih-alih mengubahnya menjadi “penolong kita”.
- source_word: וּמָגִנֵּנוּ
  choice: dan perisai kita
  rationale: מָגֵן secara konkret berarti “perisai”. Metafora perlindungan ini jelas dan wajar dalam bahasa Indonesia sehingga tidak perlu dijelaskan menjadi “pelindung”.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri הוּא memberi penegasan dalam klausa tanpa verba. “Dialah” menyampaikan penegasan tersebut secara alami tanpa menambahkan gagasan “satu-satunya”, yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton יהוה secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar atau memilih bentuk “Yehuwa” yang lebih jauh dari bukti pelafalan bahasa Ibrani.
- issue: Makna kolektif נַפְשֵׁנוּ
  choice: Jiwa kita
  alternative: Kita; hidup kita
  rationale: Ungkapan ini menunjuk pada diri batin atau keseluruhan diri umat secara kolektif, bukan semata-mata unsur tak berwujud. Terjemahan mempertahankan ketegangan antropologis dan citra puitis teks tanpa mendefinisikan hakikat “jiwa” secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. “Menanti-nantikan” memberi nuansa pengharapan yang tekun; “Dialah” mempertahankan penegasan pronomina Ibrani. Kapitalisasi pada “Dialah” mengikuti rujukan kepada Allah tanpa memakai bentuk arkais.
