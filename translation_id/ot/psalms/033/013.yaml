  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/013.yaml
  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: id
  text: Dari surga Yahweh memandang; Ia melihat semua anak-anak manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh umat manusia”; secara harfiah, “semua anak-anak manusia,” suatu ungkapan puitis untuk manusia secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Dari surga
  rationale: Preposisi מִן menyatakan asal atau titik pandang. Dalam bahasa Indonesia, “dari surga” alami dan tetap menyampaikan sudut pandang surgawi.
- source_word: הִבִּיט
  choice: memandang
  rationale: Bentuk Hifil dari נבט menyatakan tindakan mengarahkan pandangan. Kala kini cocok untuk pernyataan umum dalam puisi ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: רָאָה
  choice: Ia melihat
  rationale: ראה berarti “melihat.” Kala kini menyampaikan kebenaran umum dan selaras dengan verba sebelumnya.
- source_word: כָּל
  choice: semua
  rationale: כָּל dengan bentuk jamak konstruktus menunjuk pada keseluruhan secara kolektif.
- source_word: בְּנֵי הָאָדָם
  choice: anak manusia
  rationale: Ungkapan puitis Ibrani ini secara harfiah berbentuk “anak-anak manusia” dan secara kolektif mengacu kepada seluruh umat manusia. Bentuk “anak manusia” mempertahankan citra sumber dengan bahasa Indonesia yang ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; bentuk “Yahweh” mempertahankannya sebagai nama diri.
- issue: Cakupan בְּנֵי הָאָדָם
  choice: semua anak manusia
  alternative: seluruh umat manusia
  rationale: Teks utama mempertahankan ungkapan puitis sumber, sedangkan catatan menjelaskan bahwa acuannya bersifat kolektif dan mencakup seluruh manusia.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Paralelisme dua verba penglihatan dipertahankan dengan “memandang” dan “melihat”; kata ganti “Ia” memakai kapitalisasi penghormatan sesuai kelaziman religius Indonesia.
