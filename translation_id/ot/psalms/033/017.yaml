  yaml_path: translation/ot/psalms/033/017.yaml
  text: A horse is a false hope for deliverance[b][a], and by its great strength it cannot rescue.
translation:
  language: id
  text: Kuda adalah harapan palsu untuk keselamatan[a]; dengan kekuatannya yang besar, ia tidak dapat menyelamatkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan” atau “kemenangan”. Ungkapan Ibraninya padat dan secara harfiah dapat dipahami sebagai “Kuda adalah kepalsuan untuk keselamatan”, yakni kuda terbukti menipu atau sia-sia jika diandalkan sebagai sarana penyelamatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: harapan palsu
  rationale: Nomina ini secara harfiah berarti kepalsuan atau tipu daya. Dalam konstruksi dengan kuda sebagai sarana keselamatan, “harapan palsu” secara alami menyatakan bahwa mengandalkan kuda akan mengecewakan.
- source_word: הַסּוּס
  choice: Kuda
  rationale: Artikel Ibrani dapat menandai kelas secara umum. Bentuk tunggal tanpa artikel dalam bahasa Indonesia wajar untuk pernyataan hikmat tentang kuda sebagai sarana perang pada umumnya.
- source_word: לִתְשׁוּעָה
  choice: untuk keselamatan
  rationale: תְּשׁוּעָה dapat berarti keselamatan, pembebasan, atau kemenangan. “Keselamatan” mempertahankan keluasan istilah sumber, sementara catatan kaki menjelaskan kemungkinan nuansa kontekstualnya.
- source_word: וּבְרֹב חֵילוֹ
  choice: sekalipun tenaganya besar
  rationale: Secara harfiah frasa ini menunjuk pada besarnya kekuatan kuda. Hubungan konsesif tersirat oleh penyangkalan berikutnya dan diungkapkan secara alami dalam bahasa Indonesia dengan “sekalipun”.
- source_word: לֹא יְמַלֵּט
  choice: ia tidak dapat menyelamatkan
  rationale: Bentuk Piel dari מלט berarti melepaskan, meluputkan, atau menyelamatkan. “Tidak dapat menyelamatkan” menyampaikan ketidakmampuan kuda sebagai sarana keselamatan dalam konteks ini.
theological_decisions:
- issue: Cakupan makna תְּשׁוּעָה dalam konteks militer
  choice: keselamatan
  alternative: pembebasan atau kemenangan
  rationale: Teks tidak mengharuskan pembatasan pada satu nuansa saja. “Keselamatan” mempertahankan istilah yang luas tanpa menjadikannya secara khusus keselamatan rohani; alternatif kontekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme dipertahankan, sedangkan hubungan konsesif pada klausa kedua dibuat eksplisit agar alami dan jelas bagi pembaca umum.
