  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: id
  text: Yahweh[a] menggagalkan rancangan bangsa-bangsa; Dia menggagalkan rencana suku-suku bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH; juga ditransliterasikan “Yehovah” atau “Jehovah”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar. Bentuk ini lazim dan jelas dalam bahasa Indonesia modern.
- source_word: הֵפִיר
  choice: menggagalkan
  rationale: Bentuk Hifil dari פרר menyatakan tindakan membuat suatu rancangan tidak terlaksana; “menggagalkan” menyampaikan daya aktif verba itu secara alami.
- source_word: עֲצַת
  choice: rancangan
  rationale: עֵצָה dapat berarti nasihat, keputusan, atau rencana. Dalam konteks tindakan kolektif bangsa-bangsa, “rancangan” tepat dan menjaga kesejajaran puitis dengan “rencana” pada baris berikutnya.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Di sini istilah tersebut merujuk secara umum kepada bangsa-bangsa, bukan secara khusus kepada orang bukan Yahudi sebagai kategori keagamaan.
- source_word: הֵנִיא
  choice: menghalangi
  rationale: Verba ini menyatakan tindakan menghambat atau membelokkan sesuatu sehingga tidak mencapai tujuannya. “Menghalangi” mempertahankan makna itu tanpa menyamakan kedua verba paralel.
- source_word: מַחְשְׁבוֹת
  choice: rencana
  rationale: Walaupun dapat berarti pikiran atau maksud, dalam kesejajaran dengan עֲצַת kata ini menunjuk kepada rencana yang hendak dilaksanakan.
- source_word: עַמִּים
  choice: suku-suku bangsa
  rationale: Ungkapan ini mempertahankan perbedaan dari גּוֹיִם dan menyampaikan bentuk jamak kolektif עַמִּים secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi dalam teks utama, sementara catatan kaki mengakui bentuk alternatif yang dikenal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kesejajaran puisi dipertahankan melalui pasangan “menggagalkan/menghalangi” dan “rancangan/rencana”, sedangkan “bangsa-bangsa/suku-suku bangsa” mencerminkan perbedaan istilah Ibrani.
