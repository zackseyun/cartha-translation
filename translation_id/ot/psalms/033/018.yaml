  text: הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל יְרֵאָ֑י/ו לַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/018.yaml
  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: id
  text: Lihatlah, mata Yahweh tertuju kepada orang-orang yang takut kepada-Nya, kepada mereka yang menantikan[a] kasih setia-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengharapkan kasih setia-Nya.” Kata kerja Ibrani ini dapat berarti menanti maupun berharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel wacana ini mengarahkan perhatian sekaligus memberi penekanan. “Lihatlah” mempertahankan daya deiktis dan puitisnya tanpa mengubahnya menjadi kesimpulan seperti “sungguh”.
- source_word: עֵין
  choice: mata
  rationale: Terjemahan harfiah mempertahankan metafora antropomorfis yang jelas, yaitu perhatian dan pengawasan Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל
  choice: tertuju kepada
  rationale: Dalam ungkapan dengan “mata”, frasa ini secara alami menyatakan perhatian yang diarahkan kepada seseorang.
- source_word: יְרֵאָיו
  choice: orang-orang yang takut kepada-Nya
  rationale: Ungkapan ini mempertahankan makna takut yang bercorak hormat kepada Yahweh tanpa memperlemahnya menjadi sekadar penghormatan.
- source_word: לַמְיַחֲלִים
  choice: mereka yang menantikan
  rationale: Kata kerja יחל mencakup penantian penuh harap. “Menantikan” mempertahankan sikap menunggu yang berlangsung, sedangkan nuansa berharap dijelaskan dalam catatan kaki.
- source_word: לְחַסְדּוֹ
  choice: kasih setia-Nya
  rationale: “Kasih setia” menyampaikan kasih yang penuh kesetiaan dan kemurahan dalam חֶסֶד tanpa mempersempitnya hanya menjadi belas kasihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan fungsi nama tersebut.
- issue: Penerjemahan חֶסֶד
  choice: kasih setia
  alternative: belas kasihan atau kasih yang teguh
  rationale: “Kasih setia” mempertahankan perpaduan kasih, kemurahan, dan kesetiaan yang terkandung dalam istilah Ibrani ini.
- issue: Nuansa kata kerja יחל
  choice: menantikan, dengan alternatif “berharap” dalam catatan kaki
  alternative: berharap kepada
  rationale: Kata tersebut dapat menyatakan baik menunggu dengan penuh pengharapan maupun berharap. Terjemahan utama dan catatan kaki bersama-sama mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Bentuk “mata Yahweh” mempertahankan gambaran konkret teks Ibrani; “tertuju kepada” membuat idiom tersebut alami dalam bahasa Indonesia. Penanda catatan kaki ditempatkan pada “menantikan” karena alternatif leksikal menyangkut kata itu.
