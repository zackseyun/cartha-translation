base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/021.yaml
  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: id
  text: Sebab hati kita[b] bersukacita[a] dalam Dia, karena kita telah percaya kepada nama-Nya yang kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan bersukacita,” jika bentuk imperfek Ibrani dipahami sebagai masa depan, bukan keadaan yang berlangsung pada masa kini.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai bentuk tunggal, “hati kita,” sebagai ungkapan kolektif untuk kehidupan batin umat.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: כִּי pertama memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan kausal dan cocok dengan alur puisi.
- source_word: בּוֹ
  choice: di dalam Dia
  rationale: Pronomina maskulin tunggal ini dalam konteks merujuk kepada TUHAN. “Di dalam Dia” mempertahankan bentuk personal dan hubungan dengan sukacita.
- source_word: יִשְׂמַח
  choice: bersukacita
  rationale: Bentuk imperfek dapat menyatakan keadaan yang berlangsung atau masa depan yang diyakini. Teks utama memakai makna kini yang berkelanjutan, sedangkan kemungkinan futur dicatat dalam catatan kaki.
- source_word: לִבֵּנוּ
  choice: hati kita
  rationale: Bahasa Ibrani memakai bentuk tunggal dengan akhiran orang pertama jamak. Bentuk tunggal dipertahankan sebagai ungkapan kolektif bagi batin umat.
- source_word: כִּי
  choice: karena
  rationale: כִּי kedua menyatakan dasar bagi sukacita tersebut; “karena” membuat hubungan kausal itu jelas dalam bahasa Indonesia modern.
- source_word: בְשֵׁם
  choice: kepada nama
  rationale: Dengan verba בָּטַח, preposisi בְּ menandai sasaran kepercayaan. Ungkapan alami dalam bahasa Indonesia adalah “percaya kepada nama”.
- source_word: קָדְשׁוֹ
  choice: nama-Nya yang kudus
  rationale: קֹדֶשׁ menyatakan kekudusan; susunan “nama-Nya yang kudus” alami dalam bahasa Indonesia dan mempertahankan muatan teologis sumber.
- source_word: בָטָחְנוּ
  choice: kita telah percaya
  rationale: Bentuk perfektif menyatakan tindakan atau sikap percaya yang sudah teguh dan tetap relevan pada saat kini; “telah percaya” mempertahankan nuansa itu.
theological_decisions:
- issue: Rujukan pronomina maskulin tunggal pada בּוֹ dan קָדְשׁוֹ
  choice: Pronomina diterjemahkan sebagai “Dia” dan “-Nya”, merujuk kepada TUHAN dalam konteks terdekat.
  alternative: Menyebut “Allah” atau “TUHAN” secara eksplisit dalam ayat ini.
  rationale: Konteks mazmur menunjuk kepada TUHAN, tetapi ayat ini sendiri hanya memakai pronomina. Karena itu, terjemahan tidak menambahkan nama ilahi yang tidak dinyatakan secara eksplisit.
- issue: Nilai waktu/aspek יִשְׂמַח
  choice: 'Keadaan kini yang berkelanjutan: “bersukacita”.'
  alternative: 'Masa depan yang diyakini: “akan bersukacita”.'
  rationale: Imperfek puitis memungkinkan kedua pembacaan. Pengakuan dalam konteks mendukung keadaan kini, tetapi ketaksaan aslinya dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “hati kita” sengaja mempertahankan ungkapan kolektif Ibrani; kapitalisasi “Dia” dan “-Nya” mengikuti kebiasaan ejaan religius Indonesia tanpa menambahkan nama ilahi ke dalam teks.
