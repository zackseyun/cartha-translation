id: PSA.33.8
reference: Psalms 33:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: id
  text: Hendaklah seluruh bumi takut kepada Yahweh; hendaklah semua penduduk dunia gentar terhadap-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “takut terhadap-Nya” atau “gemetar di hadapan-Nya.” Kata kerja Ibrani mengandung nuansa rasa takut yang penuh hormat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ
  choice: hendaklah ... takut
  rationale: Bentuk imperfek Qal orang ketiga jamak berfungsi sebagai ajakan atau seruan. “Hendaklah ... takut” mempertahankan daya volitif serta cakupan makna takut yang disertai hormat.
- source_word: מֵיְהוָה
  choice: kepada Yahweh
  rationale: Preposisi מִן sesudah ירא secara idiomatis menandai pihak yang ditakuti. Dalam bahasa Indonesia, “takut kepada Yahweh” paling alami.
- source_word: כָּל הָאָרֶץ
  choice: seluruh bumi
  rationale: Paralelnya dengan seluruh penduduk dunia menunjukkan cakupan global, bukan suatu negeri tertentu.
- source_word: מִמֶּנּוּ
  choice: terhadap-Nya
  rationale: Dengan kata kerja גור, bentuk ini menandai Dia sebagai pihak yang menimbulkan kegentaran. “Terhadap-Nya” mempertahankan hubungan itu tanpa memaksakan nuansa ruang dari “di hadapan-Nya”.
- source_word: יָגוּרוּ
  choice: hendaklah ... gentar
  rationale: גור menyatakan rasa takut, gentar, atau ngeri. “Gentar” membedakannya dari ירא pada baris pertama sambil mempertahankan paralelisme dan nuansa takut penuh kekaguman.
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: semua penduduk dunia
  rationale: יֹשְׁבֵי berarti orang-orang yang mendiami, sedangkan תֵבֵל menunjuk pada dunia yang berpenghuni. Ungkapan ini alami dan mempertahankan cakupan universal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; transliterasi “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar umum “Tuhan”.
- issue: Nuansa takut kepada Allah
  choice: takut ... gentar
  alternative: hormat ... kagum
  rationale: Pilihan ini mempertahankan unsur takut yang nyata dalam kedua kata kerja Ibrani tanpa menghilangkan kemungkinan adanya rasa hormat dan kekaguman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan “hendaklah” mempertahankan kesejajaran kedua baris, sedangkan “takut” dan “gentar” mencerminkan dua kata kerja Ibrani yang berbeda.
