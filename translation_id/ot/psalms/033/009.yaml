  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
translation:
  language: id
  text: Sebab Dia berfirman, maka itu terjadi[a]; Dia memberi perintah, maka itu berdiri teguh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “maka jadilah”; ungkapan Ibraninya sangat ringkas: “dan itu ada/terjadi.”'
