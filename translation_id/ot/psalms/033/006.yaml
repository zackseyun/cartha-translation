  terminology: ‘Yahweh’ konsisten dengan kebijakan nama ilahi yang diberikan. ‘Firman’, ‘napas’, dan ‘mulut-Nya’ cocok dengan diksi puitis serta tidak memaksakan pembacaan Trinitarian. Catatan kaki mempertahankan ‘roh’ sebagai kemungkinan leksikal; keterangan ‘angin’ juga tepat.
