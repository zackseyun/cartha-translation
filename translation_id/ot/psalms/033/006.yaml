  text: בִּ/דְבַ֣ר יְ֭הוָה שָׁמַ֣יִם נַעֲשׂ֑וּ וּ/בְ/ר֥וּחַ פִּ֝֗י/ו כָּל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: id
  text: Oleh firman Yahweh langit dijadikan, dan segenap bala tentara langit dijadikan oleh napas dari mulut-Nya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh roh dari mulut-Nya”. Kata Ibrani yang dipakai dapat berarti “napas”, “angin”, atau “roh”.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּדְבַר
  choice: Oleh firman
  rationale: Preposisi ב menyatakan sarana. “Oleh firman” alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa langit dijadikan melalui firman Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” lazim dipakai secara kolektif untuk cakrawala atau ranah surgawi; bentuk “langit-langit” tidak tepat karena memiliki arti berbeda.
- source_word: נַעֲשׂוּ
  choice: dijadikan
  rationale: Menerjemahkan verba עשה secara langsung tanpa memperkuatnya menjadi istilah khusus “diciptakan” yang lebih dekat dengan ברא.
- source_word: וּבְרוּחַ
  choice: dan oleh napas
  rationale: Dalam kesejajaran dengan “firman” dan “mulut-Nya”, “napas” paling sesuai dengan gambaran puitis. Kemungkinan arti “roh” tetap dicatat dalam catatan kaki.
- source_word: פִּיו
  choice: dari mulut-Nya
  rationale: Ungkapan ini mempertahankan gambaran antropomorfis dan memperjelas hubungan alami antara napas dan mulut dalam bahasa Indonesia.
- source_word: כָּל־צְבָאָם
  choice: segenap bala tentaranya
  rationale: “Segenap” menyatakan keseluruhan, sedangkan “bala tentaranya” mempertahankan metafora צבא bagi himpunan benda-benda langit dan akhiran kepunyaan yang merujuk kepada langit.
theological_decisions:
- issue: Makna רוּחַ dalam penciptaan dan kemungkinan resonansi dengan Roh Allah
  choice: napas
  alternative: roh
  rationale: Kesejajaran langsung antara firman Yahweh dan napas dari mulut-Nya mendukung arti “napas” dalam teks utama. Namun, karena רוּחַ juga dapat berarti “roh” atau “angin”, kemungkinan teologis itu tidak disingkirkan dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan dua klausa yang sejajar dipertahankan. Kapitalisasi “-Nya” menandai rujukan kepada Allah sesuai kebiasaan luas dalam penerbitan Alkitab berbahasa Indonesia.
