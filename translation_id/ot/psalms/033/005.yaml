  text: אֹ֭הֵב צְדָקָ֣ה וּ/מִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: id
  text: Ia mencintai kebenaran dan keadilan; bumi penuh dengan kasih setia[a] Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kasih yang teguh.” Kata Ibrani ḥesed mencakup kasih, kesetiaan, dan loyalitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Ia mencintai
  rationale: Partisipel Qal maskulin tunggal menggambarkan sikap Yahweh yang tetap atau menjadi ciri-Nya. Bentuk verba kini dalam bahasa Indonesia menyampaikan makna habitual itu secara alami.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: Dalam pasangan dengan מִשְׁפָּט, kata ini menunjuk pada kelurusan atau apa yang benar, sehingga dibedakan dari keadilan dalam pelaksanaan hukum.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks ini, kata tersebut menunjuk pada tata tertib atau keputusan yang adil dalam arti etis yang luas.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini secara ringkas memadukan unsur kasih, kesetiaan, dan loyalitas yang terkandung dalam חֶסֶד, tanpa membatasi maknanya hanya pada belas kasihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri melalui transliterasi yang lazim, bukan diganti dengan gelar.
- source_word: מָלְאָה
  choice: penuh dengan
  rationale: 'Walaupun secara bentuk merupakan perfek orang ketiga feminin tunggal, dalam klausa ini kata tersebut menyatakan keadaan kini: bumi berada dalam keadaan penuh.'
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Konteks kosmis mazmur mendukung cakupan seluruh bumi, bukan wilayah atau negeri tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa חֶסֶד
  choice: kasih setia
  alternative: kasih yang teguh atau kasih perjanjian
  rationale: “Kasih setia” mempertahankan ketegangan makna antara kasih, keteguhan, dan loyalitas. Terjemahan ini tidak menjadikan unsur perjanjian—yang dapat tersirat—sebagai satu-satunya arti eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan dua klausa serta pasangan nomina “kebenaran dan keadilan” dipertahankan untuk mencerminkan kesejajaran dan kepadatan teks Ibrani.
