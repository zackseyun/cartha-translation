source:
  edition: WLC
  text: כִּֽי יָשָׁ֥ר דְּבַר יְהוָ֑ה וְ/כָל מַ֝עֲשֵׂ֗/הוּ בֶּ/אֱמוּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: id
  text: Sebab firman Yahweh itu benar[a], dan segala karya-Nya dikerjakan dengan setia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “lurus”; dapat juga diterjemahkan “tepat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan alasan bagi ajakan untuk memuji dalam konteks sebelumnya; “sebab” mempertahankan hubungan kausal dengan wajar dalam bahasa Indonesia.
- source_word: יָשָׁר
  choice: benar
  rationale: Dalam kaitannya dengan firman Yahweh, kata ini menyatakan kelurusan atau ketepatan moral. “Benar” lebih alami daripada “lurus” dalam bahasa Indonesia, sementara nuansa dasarnya dicatat dalam catatan kaki.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: דָּבָר di sini menunjuk pada perkataan atau pernyataan ilahi; “firman” merupakan padanan Indonesia yang alami dan bermartabat dalam konteks ini.
- source_word: וְכָל־מַעֲשֵׂהוּ
  choice: dan segala karya-Nya
  rationale: Bentuk Ibrani tunggal dapat dipahami secara kolektif sebagai keseluruhan tindakan atau pekerjaan Yahweh. “Segala karya-Nya” mengungkapkan cakupan menyeluruh secara alami.
- source_word: בֶּאֱמוּנָה
  choice: dikerjakan dengan setia
  rationale: אֱמוּנָה menyatakan kesetiaan, keteguhan, dan keterandalan. Bentuk “dengan setia” menghasilkan klausa Indonesia yang alami tanpa menghilangkan sifat kesetiaan yang mencirikan seluruh karya-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan bentuk tunggal מַעֲשֵׂהוּ
  choice: segala karya-Nya
  alternative: seluruh pekerjaan-Nya
  rationale: Walaupun nomina Ibraninya berbentuk tunggal, pemakaiannya bersifat kolektif dan mencakup semua tindakan Yahweh. Pilihan ini mempertahankan keluasan makna tanpa membatasi rujukannya pada satu tindakan.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Kapitalisasi pada pronomina “-Nya” mengikuti kebiasaan umum teks keagamaan Indonesia, sedangkan susunan dua klausa mempertahankan paralelisme ayat Ibrani.
