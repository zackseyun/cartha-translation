lexical_decisions:
- source_word: לְהַצִּיל
  choice: untuk melepaskan
  rationale: Infinitif Hifil dari נצל menyatakan tindakan membuat seseorang luput atau terbebas. “Melepaskan” sesuai dengan ragam puitis dan berpasangan secara alami dengan “dari maut”.
- source_word: מִמָּוֶת
  choice: dari maut
  rationale: Preposisi מן bersifat separatif. “Dari maut” mempertahankan ungkapan Ibrani yang ringkas dan bernuansa puitis.
- source_word: נַפְשָׁם
  choice: nyawa mereka
  rationale: נֶפֶשׁ dapat berarti jiwa, diri, atau hidup/nyawa. Dalam konteks penyelamatan dari maut, “nyawa mereka” alami dalam bahasa Indonesia dan tetap mempertahankan acuan pada kehidupan pribadi mereka; bentuk Ibrani adalah tunggal kolektif dengan sufiks orang ketiga jamak.
- source_word: וּלְחַיּוֹתָם
  choice: dan menjaga mereka tetap hidup
  rationale: Infinitif ini berarti memelihara atau mempertahankan agar tetap hidup. Pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: בָּרָעָב
  choice: pada masa kelaparan
  rationale: רָעָב di sini menunjuk pada keadaan kelaparan atau paceklik, bukan sekadar rasa lapar. “Pada masa kelaparan” mengungkapkan daya situasional preposisi ב secara alami.
