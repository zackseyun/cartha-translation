  text: עֲצַ֣ת יְ֭הוָה לְ/עוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗/וֹ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: id
  text: Maksud Yahweh[a] tetap teguh untuk selama-lamanya, rancangan hati-Nya dari generasi ke generasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nasihat” atau “keputusan”; “rancangan” juga dapat diterjemahkan “pikiran” atau “maksud”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: nasihat
  rationale: Kata ini mencakup nasihat, pertimbangan, atau maksud. “Nasihat” mempertahankan gambaran pertimbangan ilahi dan berpadanan secara wajar dengan “rancangan” pada baris berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; bentuk tersebut alami dan khidmat dalam bahasa Indonesia.
- source_word: תַּעֲמֹד
  choice: tetap teguh
  rationale: Bentuk verba menyatakan kebenaran yang terus berlaku. “Tetap teguh” menyampaikan gagasan berdiri kukuh dan bertahan.
- source_word: מַחְשְׁבוֹת
  choice: rancangan
  rationale: Dalam kesejajaran dengan עֲצַת, kata ini menunjuk pada pikiran yang bersifat sengaja atau bertujuan; “rancangan” menyampaikan maksud terarah tanpa meniadakan nuansa pikiran.
- source_word: לִבּוֹ
  choice: hati-Nya
  rationale: Mempertahankan ungkapan antropologis Ibrani, di mana hati merupakan pusat pikiran dan kehendak.
- source_word: לְדֹר וָדֹר
  choice: turun-temurun
  rationale: Ungkapan Indonesia ini secara alami menyampaikan kesinambungan dari satu generasi ke generasi berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kesejajaran dua larik dipertahankan, sementara “tetap teguh” dan “turun-temurun” dipilih agar jelas bagi pembaca umum.
