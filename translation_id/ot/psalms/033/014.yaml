  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: id
  text: Dari tempat kediaman-Nya Ia mengamati semua penduduk bumi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memandang dengan saksama” atau “memperhatikan.” Kata kerja Ibrani menunjukkan pengamatan yang penuh perhatian.
    reason: lexical_alternative
  - marker: b
    text: Atau “negeri” jika dipahami secara regional; di sini “bumi” dipilih karena konteksnya bersifat universal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: Dari tempat
  rationale: מָכוֹן menunjuk pada tempat yang tetap atau telah ditetapkan. Dalam gabungan dengan שִׁבְתּוֹ, 'tempat' menghasilkan bahasa Indonesia yang alami tanpa menghilangkan nuansa kediaman yang tetap.
- source_word: שִׁבְתּוֹ
  choice: kediaman-Nya
  rationale: Bentuk ini berasal dari ישׁב dan dengan sufiks berarti 'kediaman-Nya' atau 'tempat Ia berdiam'. Pilihan ini mempertahankan hubungan dengan מִמְּכוֹן secara ringkas dan wajar.
- source_word: הִשְׁגִּיחַ
  choice: Ia mengamati
  rationale: Bentuk Hifil dari שׁגח menyatakan tindakan memandang atau memperhatikan dengan saksama. 'Mengamati' menyampaikan perhatian yang disengaja tanpa menambahkan gagasan pengawasan yang bersifat menghukum.
- source_word: אֶל
  choice: (tercakup dalam konstruksi transitif 'mengamati')
  rationale: אֶל mengarahkan pandangan kepada objek. Dalam bahasa Indonesia, verba transitif 'mengamati' langsung diikuti objek sehingga preposisi tidak perlu dinyatakan tersendiri.
- source_word: כָּל
  choice: semua
  rationale: כָּל memiliki cakupan menyeluruh atas frasa jamak berikutnya; 'semua' merupakan padanan langsung dan alami.
- source_word: יֹשְׁבֵי
  choice: penduduk
  rationale: Partisipel substantival dari ישׁב secara harfiah berarti 'orang-orang yang tinggal'. 'Penduduk' menyampaikan makna kolektif itu secara alami.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Walaupun אֶרֶץ juga dapat berarti 'negeri', konteks frasa 'semua penduduk' dan cakupan universal mazmur ini mendukung 'bumi'.
theological_decisions:
- issue: Cakupan pengamatan Allah
  choice: 'cakupan universal: semua penduduk bumi'
  alternative: 'cakupan regional: semua penduduk negeri itu'
  rationale: Dalam konteks Mazmur 33, כָּל יֹשְׁבֵי הָאָרֶץ paling wajar menunjuk kepada seluruh umat manusia. Catatan kaki tetap mempertahankan kemungkinan leksikal regional dari אֶרֶץ.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan gerak dari tempat kediaman menuju objek pengamatan, sedangkan 'mengamati' dipilih agar nuansa perhatian aktif terdengar alami.
