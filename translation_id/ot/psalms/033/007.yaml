  text: כֹּנֵ֣ס כַּ֭/נֵּד מֵ֣י הַ/יָּ֑ם נֹתֵ֖ן בְּ/אֹצָר֣וֹת תְּהוֹמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: id
  text: Ia mengumpulkan air laut seperti timbunan[a]; Ia menaruh kedalaman-kedalaman[b] di dalam gudang-gudang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti gundukan”; sebagian orang memahaminya sebagai “seperti tembok” berdasarkan gambaran serupa tentang air di bagian lain.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Ibraninya jamak dan dapat menunjuk pada kedalaman-kedalaman samudra yang besar atau air purba yang dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: mengumpulkan
  rationale: Partisipel Qal dari כנס menggambarkan tindakan menghimpun atau mengumpulkan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gambaran puitis tindakan Allah.
- source_word: כַּנֵּד
  choice: seperti timbunan
  rationale: נֵד terutama menunjuk pada timbunan atau massa yang bertumpuk. 'Seperti timbunan' mempertahankan perbandingan konkret dalam teks tanpa menafsirkannya secara abstrak.
- source_word: מֵי הַיָּם
  choice: air laut
  rationale: Frasa konstruksi ini secara harfiah berarti 'air dari laut'. 'Air laut' merupakan ungkapan Indonesia yang ringkas, alami, dan tepat.
- source_word: נֹתֵן
  choice: menaruh
  rationale: Partisipel Qal dari נתן memiliki arti luas, antara lain menaruh atau menempatkan. 'Menaruh' jelas dan sepadan dengan kesederhanaan kata Ibraninya.
- source_word: בְּאֹצָרוֹת
  choice: di dalam gudang-gudang
  rationale: אֹצָר dapat berarti gudang, tempat penyimpanan, atau perbendaharaan. Bentuk jamak 'gudang-gudang' mempertahankan citra kosmologis konkret dan dapat dipahami pembaca modern.
- source_word: תְּהוֹמוֹת
  choice: samudra raya
  rationale: Bentuk jamak תְּהוֹמוֹת menunjuk pada kedalaman laut yang besar atau air purba yang dalam. 'Samudra raya' menyampaikan keluasan dan kedalaman itu secara alami; catatan kaki mempertahankan kemungkinan nuansa jamaknya.
theological_decisions:
- issue: Gambaran kosmologis tentang kedaulatan Allah atas laut
  choice: Mempertahankan citra puitis berupa timbunan dan gudang-gudang secara konkret.
  alternative: Mengabstraksikannya menjadi 'Ia mengendalikan laut' atau menaturalisasikannya menjadi pernyataan ilmiah.
  rationale: Teks Ibrani menyatakan kuasa Allah dalam mengatur air melalui dua gambaran puitis yang sejajar. Mempertahankan gambaran tersebut menjaga ketegangan dan daya puisi tanpa memaksakan kosmologi modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang tetap mudah dipahami. 'Ia' dipakai sebagai pronomina ilahi sesuai register Alkitab Indonesia yang bermartabat. Pengulangan 'Ia' mempertahankan kesejajaran dua klausa Ibrani.
