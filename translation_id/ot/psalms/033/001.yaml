lexical_decisions:
- source_word: רַנְּנוּ
  choice: Bersoraklah dengan sukacita
  rationale: Bentuk perintah jamak dari רנן menunjuk pada ungkapan sukacita yang nyaring. Frasa ini mempertahankan unsur suara dan kegembiraan, sedangkan “bersukacitalah” saja terlalu umum.
- source_word: צַדִּיקִים
  choice: hai orang-orang benar
  rationale: Kata ini berfungsi sebagai sapaan setelah bentuk perintah. “Hai orang-orang benar” menyatakan fungsi vokatifnya dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: בַּיהוָה
  choice: karena Yahweh
  rationale: Preposisi ב menempatkan Yahweh sebagai dasar, lingkup, atau sasaran sukacita. “Karena Yahweh” terdengar alami dalam bahasa Indonesia sambil menyampaikan bahwa Yahweh menjadi alasan sorak sukacita; kemungkinan “dalam Yahweh” dipertahankan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: לַיְשָׁרִים
  choice: bagi orang-orang yang tulus
  rationale: Preposisi ל menyatakan kesesuaian atau hubungan, sedangkan יְשָׁרִים menggambarkan orang yang lurus secara moral. “Bagi orang-orang yang tulus” alami dan tidak menambahkan unsur yang tidak dinyatakan.
- source_word: נָאוָה
  choice: pantas
  rationale: Kata ini dapat menyatakan sesuatu yang layak, elok, atau patut. “Pantas” paling langsung menyampaikan kesesuaian pujian bagi orang-orang yang tulus.
- source_word: תְהִלָּה
  choice: pujian
  rationale: Nomina ini berarti pujian atau ungkapan pujian. “Pujian” mempertahankan keluasan maknanya tanpa membatasinya menjadi jenis nyanyian tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama יהוה. Bentuk “Yahweh” mempertahankan nama ilahi tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan sukacita dengan Yahweh dalam בַּיהוָה
  choice: karena Yahweh
  alternative: dalam Yahweh; kepada Yahweh
  rationale: Preposisi Ibrani memungkinkan nuansa lingkup, dasar, atau sasaran. Teks utama memakai ungkapan Indonesia yang alami tanpa menutup kemungkinan nuansa “dalam Yahweh”, yang dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan “hai orang-orang benar” mempertahankan bentuk seruan puitis. Pengulangan “orang-orang” menjaga kesejajaran dua kelompok dalam baris Ibrani.
