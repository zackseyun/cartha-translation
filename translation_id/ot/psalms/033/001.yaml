  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: id
  text: Bersoraklah dalam Yahweh[a], hai orang-orang benar; pujian pantas[b] bagi orang-orang yang lurus.
  philosophy: optimal-equivalence
  footnotes:
