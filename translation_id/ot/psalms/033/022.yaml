  text: Kiranya kasih setia-Mu menyertai kami, ya TUHAN, sebagaimana kami berharap kepada-Mu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד menyatakan kasih yang teguh dan setia dalam relasi perjanjian; frasa baku ini mempertahankan kedua nuansa tersebut.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Nama ilahi tetragramaton disajikan menurut konvensi Alkitab bahasa Indonesia yang umum, dengan huruf kapital.
- source_word: עָלֵינוּ
  choice: menyertai kami
  rationale: Secara harfiah berarti 'atas kami'; dalam konteks permohonan agar kasih setia Allah hadir atau berlaku atas umat, 'menyertai kami' merupakan ungkapan Indonesia yang alami tanpa mengubah maksud.
- source_word: כַּאֲשֶׁר
  choice: sesuai dengan
  rationale: Menjaga hubungan korelatif atau ukuran antara kasih setia yang dimohon dan pengharapan umat, tanpa memperkuatnya menjadi hubungan sebab-akibat.
- source_word: יִחַלְנוּ לָךְ
  choice: pengharapan kami kepada-Mu
  rationale: Bentuk verba יחל menyatakan penantian penuh harap; nominalisasi ini alami dalam bahasa Indonesia dan tetap mempertahankan Allah sebagai tujuan pengharapan.
theological_decisions:
- issue: Hubungan antara kasih setia Allah dan pengharapan umat dalam כַּאֲשֶׁר
  choice: sesuai dengan pengharapan kami kepada-Mu
  alternative: sebab kami berharap kepada-Mu
  rationale: כַּאֲשֶׁר berarti 'sebagaimana/sesuai dengan', bukan secara eksplisit 'sebab'; pilihan ini mempertahankan ketegangan antara permohonan akan anugerah Allah dan pengharapan umat tanpa menjadikan pengharapan sebagai dasar jasa.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Bentuk doa 'Kiranya' mewakili יְהִי secara alami; pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
