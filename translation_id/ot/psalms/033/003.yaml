  text: שִֽׁירוּ ל֭/וֹ שִׁ֣יר חָדָ֑שׁ הֵיטִ֥יבוּ נַ֝גֵּ֗ן בִּ/תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/003.yaml
  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: id
  text: Nyanyikanlah bagi-Nya nyanyian baru; mainkanlah musik dengan terampil, diiringi sorak-sorai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan pekik sukacita” atau “dengan bunyi sangkakala.” Kata Ibrani תְּרוּעָה dapat menunjuk pada pekik kegembiraan, aklamasi nyaring, atau, dalam konteks tertentu, bunyi seperti tiupan sangkakala.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Nyanyikanlah
  rationale: Bentuk perintah jamak dari שׁיר secara langsung menyerukan tindakan bernyanyi; bentuk -lah wajar dan bermartabat dalam seruan puitis bahasa Indonesia.
- source_word: לוֹ
  choice: bagi-Nya
  rationale: Preposisi ל dengan sufiks orang ketiga tunggal maskulin menunjukkan bahwa nyanyian itu ditujukan kepada TUHAN dalam konteks mazmur. “Bagi-Nya” alami dalam bahasa Indonesia dan mempertahankan arah pujian tersebut.
- source_word: שִׁיר חָדָשׁ
  choice: nyanyian baru
  rationale: Padanan langsung yang mempertahankan ungkapan khas dalam mazmur serta resonansi ibadahnya.
- source_word: הֵיטִיבוּ
  choice: dengan terampil
  rationale: Hifil imperatif dari יטב berfungsi secara adverbial bersama נַגֵּן dan menyerukan permainan musik yang baik atau mahir; “dengan terampil” menyampaikan daya idiomatisnya.
- source_word: נַגֵּן
  choice: mainkanlah musik
  rationale: Kata נגן lazim menunjuk pada memainkan alat musik, terutama alat musik berdawai. “Mainkanlah musik” jelas dan alami tanpa menetapkan jenis alat tertentu.
- source_word: בִּתְרוּעָה
  choice: dengan sorak-sorai
  rationale: תְּרוּעָה dapat berarti pekik nyaring, aklamasi sukacita, atau bunyi seperti tiupan sangkakala. Dalam konteks pujian, “sorak-sorai” mempertahankan unsur nyaring dan meriah tanpa mempersempitnya pada alat musik tertentu.
theological_decisions:
- issue: Rujukan sufiks orang ketiga tunggal maskulin pada לוֹ
  choice: Kata ganti itu merujuk kepada TUHAN sebagai penerima pujian.
  alternative: Menerjemahkannya tanpa kapitalisasi sebagai “baginya”.
  rationale: Konteks langsung mazmur menunjukkan bahwa seruan pujian ditujukan kepada TUHAN. Kapitalisasi “-Nya” mengikuti kaidah penghormatan yang lazim dalam bahasa Indonesia tanpa menambahkan identitas lain yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan liturgis yang tetap mudah dipahami. Pengulangan “dengan” dipertahankan agar hubungan adverbial “dengan terampil” dan pengiring “dengan sorak-sorai” tetap jelas.
