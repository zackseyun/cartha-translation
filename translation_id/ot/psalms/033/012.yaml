reference: Psalms 33:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַשְׁרֵ֣י הַ֭/גּוֹי אֲשֶׁר יְהוָ֣ה אֱלֹהָ֑י/ו הָ/עָ֓ם בָּחַ֖ר לְ/נַחֲלָ֣ה לֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: id
  text: Berbahagialah[a] bangsa yang Allahnya ialah Yahweh, umat yang dipilih-Nya sebagai milik pusaka-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Sungguh mujur” atau “Diberkatilah.” Kata Ibrani אַשְׁרֵי menyatakan keadaan sejahtera karena perkenanan Allah, bukan hanya perasaan gembira.
    reason: lexical_alternative
  - marker: b
    text: Larik kedua kemungkinan besar terutama menunjuk kepada Israel sebagai umat yang dipilih Yahweh menjadi milik-Nya, tetapi teks Ibrani tetap memakai sebutan puitis “umat.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Ungkapan ucapan bahagia ini menyatakan keadaan sejahtera karena perkenanan Allah, bukan sekadar perasaan senang. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan nada liturgis mazmur.
- source_word: הַגּוֹי
  choice: bangsa
  rationale: גּוֹי menunjuk pada suatu kelompok bangsa sebagai kesatuan dan berpadanan secara puitis dengan הָעָם, “umat,” pada larik berikutnya.
- source_word: אֲשֶׁר
  choice: yang ... -nya
  rationale: Partikel relatif Ibrani paling alami dinyatakan melalui konstruksi Indonesia “bangsa yang Allahnya ...”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap terlihat.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Nomina dengan akhiran orang ketiga maskulin tunggal berarti “Allahnya,” dengan bangsa sebagai anteseden kolektif.
- source_word: הָעָם
  choice: umat
  rationale: Dalam konteks identitas komunal dan pilihan Allah, “umat” lebih alami dan bernuansa perjanjian daripada pengulangan “bangsa,” sekaligus mempertahankan kesejajaran puitis.
- source_word: בָּחַר
  choice: dipilih-Nya
  rationale: Bentuk perfektif menyatakan tindakan pilihan Allah yang sudah dilakukan dan statusnya tetap berlaku. Konstruksi pasif Indonesia menjaga “umat” sebagai fokus larik.
- source_word: לְנַחֲלָה לוֹ
  choice: sebagai milik pusaka-Nya
  rationale: Ungkapan ini menyampaikan bahwa umat itu dipilih menjadi bagian atau milik khusus Allah. “Milik pusaka” mempertahankan gema נַחֲלָה tanpa memberi kesan bahwa Allah mewarisinya karena kematian pihak lain.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Rujukan “bangsa” dan “umat”
  choice: Mempertahankan sebutan puitis tanpa menambahkan “Israel” dalam teks utama
  alternative: Menuliskan “Israel” secara eksplisit
  rationale: Konteks pilihan sebagai milik pusaka sangat mungkin menunjuk khususnya kepada Israel, tetapi teks Ibrani sendiri memakai istilah umum “bangsa” dan “umat.” Terjemahan mempertahankan ketegangan ini dan menjelaskannya dalam catatan kaki.
- issue: Makna umat sebagai נַחֲלָה bagi Allah
  choice: milik pusaka-Nya
  alternative: warisan-Nya
  rationale: “Milik pusaka” mempertahankan gagasan kepunyaan khusus yang dianugerahkan atau ditetapkan, tanpa konotasi modern bahwa Allah menerima warisan karena kematian seseorang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. “Berbahagialah” mempertahankan bentuk ucapan bahagia yang lazim; “umat” dan “milik pusaka” menjaga nuansa perjanjian tanpa memasukkan identitas yang tidak disebutkan secara eksplisit dalam teks utama.
