  text: הוֹד֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
translation:
  language: id
  text: Bersyukurlah kepada Yahweh dengan kecapi; mainkanlah musik bagi-Nya dengan harpa berdawai sepuluh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani nebel menunjuk suatu alat musik petik kuno; bentuk tepatnya tidak pasti dan dapat diterjemahkan “harpa”, “gambus”, atau “lira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Bersyukurlah
  rationale: Imperatif jamak Hifil dari ידה dalam konteks ibadah lazim menyatakan ajakan untuk mengucap syukur atau memuji; “bersyukurlah” mempertahankan nuansa liturgis yang lebih khusus.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: בְּכִנּוֹר
  choice: dengan kecapi
  rationale: כִּנּוֹר adalah alat musik petik kuno, umumnya dipahami sebagai sejenis lira; “kecapi” merupakan padanan Indonesia yang alami, meski bentuk tepat alat kunonya tidak sepenuhnya pasti.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: dengan harpa sepuluh tali[a]
  rationale: נֵבֶל menunjuk alat musik petik kuno yang berbeda dari כִּנּוֹר, sedangkan עָשׂוֹר menyatakan sepuluh tali. “Harpa sepuluh tali” menjaga pembedaan kedua alat musik dan mempertahankan jumlah talinya; ketidakpastian identifikasi dijelaskan dalam catatan kaki.
- source_word: זַמְּרוּ לוֹ
  choice: mainkanlah musik bagi-Nya
  rationale: Piel זמר dapat berarti bermusik atau menyanyikan pujian. Karena dua alat musik disebut secara langsung, ungkapan ini menyampaikan unsur musikal tanpa membatasi tindakan itu pada nyanyian saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dalam bentuk yang luas diterima dalam kajian modern tanpa menggantinya dengan gelar.
- issue: Cakupan makna זמר dalam konteks ibadah
  choice: mainkanlah musik bagi-Nya
  alternative: bermazmurlah bagi-Nya; nyanyikanlah pujian bagi-Nya
  rationale: Konteks alat musik mendukung tindakan bermusik, tetapi verba itu juga mengandung arah pujian kepada Allah. Terjemahan dipilih agar tidak menyempitkannya menjadi nyanyian semata.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk imperatif “Bersyukurlah” dan “mainkanlah” mencerminkan ajakan jamak dalam bahasa Ibrani, sementara kapitalisasi “-Nya” mengikuti kebiasaan ejaan religius Indonesia.
