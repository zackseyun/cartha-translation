source:
  edition: WLC
  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: id
  text: Raja tidak diselamatkan oleh pasukan yang besar[a]; seorang pejuang tidak diluputkan oleh kekuatan yang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh kekuatan yang besar”; kata Ibrani yang diterjemahkan “pasukan” juga dapat berarti kekuatan atau sumber daya militer secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: tidak
  rationale: 'Dengan subjek dan partisip sesudahnya, אֵין secara alami menyatakan penyangkalan: raja tidak diselamatkan.'
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Artikel tertentu dipertahankan melalui bentuk generik yang alami dalam bahasa Indonesia; ayat ini menyatakan kebenaran umum tentang raja.
- source_word: נוֹשָׁע
  choice: diselamatkan
  rationale: Partisip nifal dari ישׁע berarti diselamatkan atau dilepaskan; pilihan ini mempertahankan padanan utama istilah tersebut sekaligus cocok dengan konteks militer.
- source_word: בְּרָב חָיִל
  choice: oleh pasukan yang besar
  rationale: ב menyatakan sarana, רָב kelimpahan atau kebesaran, dan חָיִל dalam konteks kerajaan serta peperangan paling konkret menunjuk pada pasukan, meskipun dapat pula berarti kekuatan atau sumber daya militer.
- source_word: גִּבּוֹר
  choice: seorang pejuang
  rationale: Istilah ini menunjuk kepada orang yang perkasa atau gagah dalam pertempuran; 'pejuang' merupakan ungkapan modern yang wajar dan mempertahankan konteks militer.
- source_word: לֹא יִנָּצֵל
  choice: tidak diluputkan
  rationale: Nifal dari נצל berarti dilepaskan, diselamatkan, atau diluputkan. 'Diluputkan' membedakannya dari ישׁע pada baris pertama sambil mempertahankan paralelismenya.
- source_word: בְּרָב כֹּחַ
  choice: oleh kekuatan yang besar
  rationale: ב menyatakan sarana, sedangkan כֹּחַ menunjuk pada daya atau kekuatan; frasa ini menegaskan bahwa besarnya kekuatan bukan jaminan keselamatan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. Paralelisme kedua bagian dipertahankan; 'diselamatkan' dan 'diluputkan' mewakili dua verba Ibrani yang berbeda. Alternatif 'orang perkasa' untuk גִּבּוֹר tidak diberi catatan karena 'pejuang' menyampaikan makna kontekstual secara jelas tanpa menghilangkan unsur kegagahan.
