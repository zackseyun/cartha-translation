  text: when the Ziphites came and said to Saul[a], “Is not David hiding among us?”
translation:
  language: id
  text: ketika orang-orang Zif datang dan berkata kepada Saul, “Bukankah Daud sedang bersembunyi di antara kami[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersama kami.” Secara harfiah, bahasa Ibrani berbunyi “bersama kami”; “di antara kami” menyatakan bahwa Daud bersembunyi di wilayah atau lingkungan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: ketika ... datang
  rationale: Preposisi ב dengan infinitif konstruk בוא membentuk anak kalimat waktu; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan temporal teks Ibrani.
- source_word: הַזִּיפִים
  choice: orang-orang Zif
  rationale: Bentuk jamak gentilik ini menunjuk kepada penduduk Zif. 'Orang-orang Zif' lebih mudah dipahami dalam bahasa Indonesia daripada bentuk transliterasi gentilik yang tidak lazim.
- source_word: וַיֹּאמְרוּ
  choice: dan berkata
  rationale: Bentuk wayyiqtol dari אמר menyatakan urutan naratif sederhana; subjeknya sudah dinyatakan oleh 'orang-orang Zif'.
- source_word: לְשָׁאוּל
  choice: kepada Saul
  rationale: Preposisi ל menandai penerima perkataan; 'Saul' ialah bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel tanya ini mengharapkan jawaban yang membenarkan; 'Bukankah' mempertahankan bentuk dan daya retoris pertanyaan.
- source_word: דָוִד
  choice: Daud
  rationale: Bentuk nama yang mapan dan mudah dikenali dalam bahasa Indonesia.
- source_word: מִסְתַּתֵּר
  choice: sedang bersembunyi
  rationale: Partisipel Hitpael dari סתר menggambarkan tindakan refleksif yang sedang berlangsung; pilihan ini menyampaikan aspek progresif dengan alami.
- source_word: עִמָּנוּ
  choice: di antara kami
  rationale: Secara harfiah berarti 'bersama kami', tetapi dalam konteks Daud bersembunyi di wilayah atau lingkungan para penutur, 'di antara kami' menyampaikan maksudnya secara alami tanpa menyiratkan bahwa mereka berpihak kepadanya.
