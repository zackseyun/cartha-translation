  source_fidelity: 'Terjemahan mempertahankan dua klausa Ibrani dengan baik: הִנֵּה sebagai seruan puitis “Lihatlah,” אֱלֹהִים עֹזֵר לִי sebagai “Allah adalah penolongku,” dan konstruksi sulit אֲדֹנָי בְּסֹמְכֵי נַפְשִׁי sebagai hubungan asosiatif “Tuhan berada di antara orang-orang yang menopang hidupku.” Bentuk jamak סֹמְכֵי tetap tercermin. Catatan a secara tepat mencatat pembacaan alternatif yang menjadikan Tuhan penopang langsung, tanpa memaksakannya ke dalam teks utama. “Hidupku” merupakan padanan kontekstual yang baik untuk נַפְשִׁי.'
