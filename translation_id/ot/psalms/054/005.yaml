base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
translation:
  language: id
  text: Lihatlah, Allah adalah penolongku; Tuhan berada di antara orang-orang yang menopang hidupku[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tuhanlah yang menopang jiwaku” atau “Tuhan adalah penopang hidupku.” Ungkapan Ibrani yang diterjemahkan “berada di antara orang-orang yang menopang hidupku” sulit secara sintaksis; sebagian terjemahan memahaminya sebagai pernyataan bahwa Tuhan sendiri secara langsung menopang pemazmur.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani נֶפֶשׁ (nefesy) dapat berarti “hidup”, “diri”, atau “jiwa”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel penarik perhatian ini mengawali penegasan puitis. “Lihatlah” mempertahankan daya serunya tanpa mengubahnya menjadi sekadar penanda kepastian.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Sebutan umum bagi Allah, di sini sebagai subjek tunggal dari klausa.
- source_word: עֹזֵר לִי
  choice: adalah penolongku
  rationale: Partisipel Qal עֹזֵר berfungsi secara predikatif dan personal; לִי secara alami dinyatakan dengan akhiran posesif dalam bahasa Indonesia.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Gelar ilahi ini dibedakan dari nama ilahi YHWH dan diterjemahkan dengan bentuk baku “Tuhan”.
- source_word: בְּסֹמְכֵי
  choice: berada di antara orang-orang yang menopang
  rationale: Konstruksi preposisi בְּ dengan partisipel jamak berbentuk konstruk sulit secara sintaksis. Terjemahan ini mempertahankan kemungkinan makna asosiasi serta bentuk jamaknya, tanpa diam-diam menjadikan Tuhan satu-satunya pelaku langsung.
- source_word: נַפְשִׁי
  choice: hidupku
  rationale: Dalam konteks ancaman dan pemeliharaan, נֶפֶשׁ menunjuk pada hidup atau diri seseorang, bukan hanya unsur batin yang terpisah dari tubuh.
theological_decisions:
- issue: Hubungan Tuhan dengan בְּסֹמְכֵי נַפְשִׁי
  choice: Tuhan berada di antara orang-orang yang menopang hidupku
  alternative: Tuhanlah yang menopang hidupku
  rationale: Teks Masoret secara harfiah memakai preposisi dan partisipel jamak yang memungkinkan pengertian asosiasi, tetapi susunannya sulit. Teks utama mempertahankan ketegangan sintaksis itu, sementara pembacaan bahwa Tuhan sendiri adalah penopang langsung dicatat sebagai alternatif.
- issue: Makna antropologis נַפְשִׁי
  choice: hidupku
  alternative: jiwaku
  rationale: Konteksnya adalah pertolongan dan pemeliharaan di tengah bahaya. “Hidupku” menyampaikan cakupan נֶפֶשׁ tanpa memaksakan dikotomi tubuh dan jiwa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Lihatlah” mempertahankan seruan pembuka; “orang-orang yang menopang” menjaga bentuk jamak sumber. Penempatan catatan [b] langsung sesudah “hidupku” mengaitkannya dengan נֶפֶשׁ, sedangkan [a] menandai alternatif bagi keseluruhan klausa kedua.
