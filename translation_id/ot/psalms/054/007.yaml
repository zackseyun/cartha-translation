base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: id
  text: Aku akan mempersembahkan kurban sukarela kepada-Mu[a]; aku akan mengucap syukur kepada nama-Mu, ya Yahweh[b], sebab nama-Mu itu baik[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “dengan” atau “sebagai persembahan sukarela.” Ungkapan ini juga dapat dipahami lebih adverbial: “dengan sukarela aku akan mempersembahkan kurban kepada-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”; juga ditransliterasikan “Yahweh.”'
    reason: lexical_alternative
  - marker: c
    text: Ibrani hanya berbunyi, “sebab baik,” tanpa menyebutkan subjek. Ini dapat dipahami sebagai “sebab nama-Mu itu baik” atau “sebab Ia baik,” dengan rujukan langsung kepada Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: dengan persembahan sukarela
  rationale: Nomina נְדָבָה menunjuk pada persembahan yang diberikan secara sukarela. Ungkapan ini mempertahankan makna ibadah-kurban sekaligus membiarkan kemungkinan nuansa adverbial dijelaskan dalam catatan kaki.
- source_word: אֶזְבְּחָה
  choice: aku akan mempersembahkan kurban
  rationale: Bentuk dari זבח berarti mempersembahkan kurban. Terjemahan ini jelas dan wajar dalam bahasa Indonesia serta menghindari kesan bahwa pemazmur sendiri menjadi objek yang dikurbankan.
- source_word: לָּךְ
  choice: kepada-Mu
  rationale: Preposisi ל menandai pihak yang menerima atau menjadi tujuan persembahan.
- source_word: אוֹדֶה
  choice: aku akan mengucap syukur
  rationale: Bentuk Hifil dari ידה dalam konteks ibadah dapat berarti bersyukur atau memuji; 'mengucap syukur' sesuai dengan konstruksi yang menyebut nama Allah sebagai sasaran pengakuan syukur.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Teks secara eksplisit menyebut 'nama-Mu', suatu ungkapan yang menunjuk pada penyataan diri, karakter, dan reputasi Allah; unsur ini dipertahankan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh' agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi ucapan syukur.
- source_word: טוֹב
  choice: nama-Mu itu baik
  rationale: Bahasa Ibrani hanya berbunyi 'sebab baik' tanpa subjek eksplisit. Dalam teks utama, subjek dipulihkan dari anteceden terdekat, yaitu 'nama-Mu', sambil mencatat kemungkinan rujukan langsung kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar tradisional.
- issue: Subjek tersirat dalam כִּי טוֹב
  choice: nama-Mu itu baik
  alternative: Ia baik, yakni Yahweh baik
  rationale: Bahasa Ibrani tidak menyatakan subjek. 'Nama-Mu' adalah anteceden terdekat, tetapi struktur singkatnya juga memungkinkan sifat 'baik' dipahami sebagai merujuk langsung kepada Yahweh; ketegangan ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi memakai huruf kapital menurut kebiasaan ejaan religius Indonesia. Susunan klausa pertama dibuat alami dalam bahasa Indonesia sambil mempertahankan unsur persembahan sukarela dan tindakan mempersembahkan kurban.
