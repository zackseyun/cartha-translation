  text: אֱ֭לֹהִים שְׁמַ֣ע תְּפִלָּתִ֑/י הַ֝אֲזִ֗ינָ/ה לְ/אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/003.yaml
  text: God[a], hear my prayer; give ear to the words of my mouth.
translation:
  language: id
  text: 'Ya Allah, dengarlah doaku;

    dengarkanlah perkataan mulutku.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung dalam doa. Partikel “Ya” membuat fungsi vokatifnya jelas dan alami dalam bahasa Indonesia modern.
- source_word: שְׁמַע
  choice: dengarlah
  rationale: Imperatif ini meminta Allah bukan sekadar menangkap bunyi, melainkan menerima doa dengan penuh perhatian. “Dengarlah” mempertahankan ungkapan doa yang ringkas dan wajar.
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: Nomina תְּפִלָּה secara lazim berarti “doa”; akhiran orang pertama tunggal dinyatakan dengan “-ku”.
- source_word: הַאֲזִינָה
  choice: simaklah
  rationale: Imperatif ini mengandung gagasan memasang telinga atau mendengarkan dengan saksama. “Simaklah” menyampaikan perhatian yang sungguh-sungguh sekaligus membedakannya dari שְׁמַע pada baris pertama.
- source_word: לְאִמְרֵי
  choice: kata-kata
  rationale: Bentuk jamak konstruksi אִמְרֵי menunjuk pada ucapan-ucapan atau kata-kata. Dalam susunan Indonesia, relasinya dengan “mulutku” dinyatakan secara alami dengan “dari”.
- source_word: פִי
  choice: dari mulutku
  rationale: Secara harfiah berarti “mulutku.” Ungkapan ini mempertahankan gambaran konkret Ibrani, sementara “dari” menghasilkan frasa Indonesia yang alami tanpa mengubah rujukannya kepada ucapan pemazmur.
theological_decisions: []
translation_notes:
  register: Bahasa doa yang modern, ringkas, dan khidmat. Paralelisme kedua baris dipertahankan, dengan “dengarlah” dan “simaklah” untuk mencerminkan dua imperatif Ibrani yang berdekatan maknanya tetapi tidak identik.
