  text: 'For the choirmaster: with stringed instruments. A Maskil[b] of David[a].'
translation:
  language: id
  text: 'Untuk pemimpin musik: dengan alat musik petik. Maskil[b] Daud[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh Daud” atau “untuk Daud”; judul Ibrani ini dapat menunjukkan kepengarangan, peruntukan, atau hubungan dengan Daud.
    reason: alternative_reading
  - marker: b
    text: “Maskil” adalah istilah teknis Ibrani dalam judul mazmur. Kemungkinan besar istilah ini menunjukkan suatu jenis komposisi atau cara penyajian, tetapi makna tepatnya tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi penyajian musik. Ungkapan ini alami dalam bahasa Indonesia modern dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: בִּנְגִינֹת
  choice: dengan alat musik petik
  rationale: Istilah ini menunjuk pada iringan alat musik berdawai; 'alat musik petik' menyampaikan jenis alatnya secara jelas dan wajar dalam bahasa Indonesia.
- source_word: מַשְׂכִּיל
  choice: maskil
  rationale: Makna tepat istilah teknis dalam judul mazmur ini tidak pasti. Transliterasi mempertahankan ketidakpastian itu tanpa memilih secara spekulatif antara nyanyian pengajaran, perenungan, atau komposisi terampil.
- source_word: לְדָוִד
  choice: Daud
  rationale: Konstruksi 'maskil Daud' merupakan bentuk hubungan nomina yang ringkas dan dapat mencakup karya, kepunyaan, atau kaitan dengan Daud tanpa memastikan kepengarangan.
theological_decisions:
- issue: Makna keterangan לְדָוִד dalam judul mazmur
  choice: Daud
  alternative: oleh Daud; untuk Daud; milik Daud
  rationale: Preposisi Ibrani dapat menyatakan kepengarangan, peruntukan, kepunyaan, atau hubungan. Bentuk 'maskil Daud' mempertahankan keluwesan itu, sedangkan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. 'Pemimpin musik' dipilih sebagai ungkapan modern yang mudah dipahami; istilah teknis 'maskil' dipertahankan dan dijelaskan dalam catatan kaki.
