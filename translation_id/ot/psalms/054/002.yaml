  text: אֱ֭לֹהִים בְּ/שִׁמְ/ךָ֣ הוֹשִׁיעֵ֑/נִי וּ/בִ/גְבוּרָתְ/ךָ֥ תְדִינֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/002.yaml
  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: id
  text: Allah, selamatkanlah aku dengan nama-Mu, dan belalah perkaraku dengan keperkasaan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hakimilah aku” atau “nyatakanlah aku benar.” Kata kerja Ibrani ini dapat menunjuk pada tindakan menghakimi, membela perkara, atau memberikan keadilan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks doa, nomina ini berfungsi sebagai sapaan langsung. Bentuk alami dalam bahasa Indonesia adalah “Allah” tanpa menambahkan kata seru yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: בְּשִׁמְךָ
  choice: dengan nama-Mu
  rationale: Preposisi ב dipahami secara instrumental. “Nama” menunjuk pada pribadi, karakter, dan kewibawaan Allah yang dinyatakan, sementara ungkapan ringkas bahasa Ibrani tetap dipertahankan.
- source_word: הוֹשִׁיעֵנִי
  choice: selamatkanlah aku
  rationale: Bentuk Hifil dari ישׁע menyatakan permohonan agar dilepaskan atau diselamatkan. “Selamatkanlah aku” merupakan padanan langsung dan luas dalam konteks doa mazmur.
- source_word: וּבִגְבוּרָתְךָ
  choice: dan dengan keperkasaan-Mu
  rationale: גְּבוּרָה berarti kekuatan atau daya yang perkasa. “Keperkasaan” mempertahankan ragam puitis dan menyejajarkan fungsi instrumentalnya dengan “dengan nama-Mu”.
- source_word: תְדִינֵנִי
  choice: belalah perkaraku
  rationale: Kata kerja דין dapat berarti menghakimi atau menjalankan keadilan. Dalam permohonan menghadapi lawan, “belalah perkaraku” menyampaikan tindakan yudisial Allah demi si pemohon tanpa menghapus sepenuhnya latar pengadilan; alternatif yang lebih harfiah dicatat.
theological_decisions:
- issue: Makna permohonan דין dalam kaitannya dengan keadilan ilahi
  choice: belalah perkaraku
  alternative: hakimilah aku; nyatakanlah aku benar
  rationale: Konteksnya adalah permohonan agar Allah bertindak sebagai hakim yang adil terhadap para lawan, bukan sekadar melakukan penilaian netral. Pilihan ini mengungkapkan nuansa pembelaan yudisial tanpa memasukkan kerangka doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran -lah mempertahankan nada permohonan langsung; kapitalisasi pronomina ilahi mengikuti konvensi umum penerbitan Alkitab Indonesia.
