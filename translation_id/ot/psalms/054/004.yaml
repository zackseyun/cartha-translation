id: PSA.54.4
reference: Psalms 54:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: id
  text: Sebab orang-orang asing telah bangkit melawan aku,[a] dan orang-orang kejam berusaha mencabut nyawaku.[b] Mereka tidak menempatkan Allah di hadapan mereka. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang luar.” Kata Ibrani ini dapat menunjuk kepada orang yang asing, terasing, atau berasal dari luar; tidak harus berarti orang dari bangsa lain.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mencari nyawaku.” Maksudnya, mereka hendak mengambil nyawanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi permohonan dalam konteks sebelumnya dan mempertahankan hubungan kausal secara alami dalam bahasa Indonesia.
- source_word: זָרִים
  choice: orang-orang asing
  rationale: Mempertahankan arti orang yang asing, terasing, atau dari luar tanpa memastikan bahwa mereka berbeda bangsa; kemungkinan lain dijelaskan dalam catatan kaki.
- source_word: קָמוּ עָלַי
  choice: telah bangkit melawan aku
  rationale: Mempertahankan citra verba Ibrani sekaligus menyampaikan tindakan permusuhan.
- source_word: עָרִיצִים
  choice: orang-orang kejam
  rationale: Menyampaikan sifat bengis, menindas, dan tidak berbelaskasihan; 'kejam' lebih alami daripada terjemahan harfiah yang kaku.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: berusaha mencabut nyawaku
  rationale: Dalam konteks ancaman, נֶפֶשׁ menunjuk pada hidup sang pemazmur. Ungkapan ini secara alami menyatakan bahwa mereka hendak membunuhnya.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: Mereka tidak menempatkan Allah di hadapan mereka
  rationale: Mempertahankan metafora Ibrani tentang tidak menjadikan Allah sebagai pertimbangan di depan mata, tanpa menafsirkannya lebih jauh.
- source_word: סֶלָה
  choice: Sela
  rationale: Dipertahankan sebagai istilah liturgis atau musikal yang makna tepatnya tidak pasti, dengan ejaan Indonesia yang lazim.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ dalam konteks ancaman
  choice: nyawaku
  alternative: jiwaku
  rationale: Konteks menunjukkan bahwa para lawan mengincar hidup sang pemazmur, bukan terutama membahas jiwa sebagai unsur tak berwujud.
- issue: Makna tindakan tidak menempatkan Allah di hadapan mereka
  choice: Metafora dipertahankan secara langsung
  alternative: Mereka tidak memedulikan Allah
  rationale: 'Terjemahan langsung mempertahankan keluasan makna: para lawan tidak menjadikan Allah sebagai perhatian atau pertimbangan moral, tanpa membatasi teks pada satu penjelasan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang tetap dekat pada teks Ibrani. Bentuk 'melawan aku' dipilih untuk menjaga tekanan puitis, sedangkan 'mencabut nyawaku' dipakai sebagai ungkapan alami bagi ancaman pembunuhan.
