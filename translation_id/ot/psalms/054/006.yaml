source:
  edition: WLC
  text: ישוב הָ֭/רַע לְ/שֹׁרְרָ֑/י בַּ֝/אֲמִתְּ/ךָ֗ הַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/006.yaml
  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: id
  text: Biarlah kejahatan berbalik menimpa lawan-lawanku[a]; dalam kesetiaan-Mu[b], binasakanlah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kejahatan akan berbalik menimpa lawan-lawanku.” Verba pertama dapat dipahami sebagai pernyataan, bukan sebagai permohonan.
    reason: alternative_reading
  - marker: b
    text: Atau, “dalam kebenaran-Mu.” Kata Ibrani ini dapat berarti kebenaran, keterandalan, atau kesetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: Biarlah ... berbalik
  rationale: Bentuk imperfek Qal orang ketiga tunggal dari שוב dapat dipahami sebagai pernyataan tentang masa depan atau sebagai ungkapan kehendak. Karena ayat ini berupa doa dan diikuti bentuk imperatif, terjemahan utama mempertahankan nuansa permohonan.
- source_word: הָרַע
  choice: kejahatan
  rationale: רַע dapat menunjuk pada kejahatan, malapetaka, atau celaka. 'Kejahatan' mempertahankan keringkasan dan keluasan makna Ibrani, termasuk nuansa perbuatan jahat yang berbalik kepada pelakunya.
- source_word: לְשֹׁרְרָי
  choice: menimpa lawan-lawanku
  rationale: Kata ini menunjuk kepada pihak-pihak yang memusuhi pemazmur. 'Lawan-lawanku' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi musuh militer. 'Menimpa' menyampaikan arah prefiks ל secara wajar bersama kata 'berbalik'.
- source_word: בַּאֲמִתְּךָ
  choice: dalam kesetiaan-Mu
  rationale: אֱמֶת mencakup kebenaran, keterandalan, dan kesetiaan. Dalam seruan langsung kepada Allah agar bertindak, 'kesetiaan-Mu' menyampaikan keterandalan-Nya tanpa meniadakan kemungkinan arti 'kebenaran'.
- source_word: הַצְמִיתֵם
  choice: binasakanlah mereka
  rationale: Bentuk imperatif Hifil dengan sufiks orang ketiga jamak dari צמת berarti membinasakan, memusnahkan, atau mengakhiri keberadaan. 'Binasakanlah mereka' langsung, kuat, dan sepadan dengan daya imprekatoris teks.
theological_decisions:
- issue: Daya imprekatoris ayat
  choice: Menerjemahkannya sebagai permohonan agar Allah menjatuhkan hukuman
  alternative: 'Membaca verba pertama sebagai pernyataan: ''Kejahatan akan berbalik menimpa lawan-lawanku.'''
  rationale: Konteks doa dan imperatif pada verba terakhir mendukung nuansa permohonan, tetapi bentuk verba pertama tetap memungkinkan pembacaan indikatif. Alternatif itu dicatat agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan langsung. Bentuk 'binasakanlah' mempertahankan kekuatan teks tanpa eufemisme; sapaan ilahi ditandai dengan kapital pada sufiks '-Mu'.
