  source_fidelity: 'Terjemahan mempertahankan dua unsur sintaksis utama teks Ibrani: bentuk pertama yang wajar dibaca sebagai harapan/doa ("Biarlah ... berbalik") dan imperatif Hifil yang tegas pada penutup ("binasakanlah mereka"). "Kejahatan" secara sah mempertahankan keluasan רַע, yang dapat mencakup kejahatan maupun malapetaka, sementara catatan a dengan tepat melestarikan kemungkinan pembacaan indikatif. "Dalam kesetiaan-Mu" merupakan padanan yang baik untuk בַּאֲמִתְּךָ dan catatan b menjaga alternatif "kebenaran-Mu".'
