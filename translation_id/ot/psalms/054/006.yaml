  terminology: '"Lawan-lawanku" menyampaikan pihak yang memusuhi pemazmur tanpa membatasi konteks pada musuh militer. Kapitalisasi sufiks -Mu konsisten dengan sapaan kepada Allah dalam konvensi Alkitab Indonesia. Istilah "kesetiaan" dan "kebenaran" dalam catatan kaki mencerminkan rentang makna אֱמֶת secara memadai.'
