  text: כִּ֣י מִ/כָּל צָ֭רָה הִצִּילָ֑/נִי וּ֝/בְ/אֹיְבַ֗/י רָאֲתָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/008.yaml
  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: id
  text: Sebab Ia telah melepaskan aku dari segala kesesakan, dan mataku telah memandang musuh-musuhku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mataku telah melihat musuh-musuhku”; ungkapan ini mungkin menyiratkan kejatuhan mereka atau pembenaran pemazmur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan dasar bagi nazar dan pujian pada ayat sebelumnya; “sebab” mempertahankan hubungan penjelas tersebut secara alami.
- source_word: מִכָּל צָרָה
  choice: dari setiap kesesakan
  rationale: מִן dengan כָּל menyatakan pelepasan dari keseluruhan berbagai kesusahan. “Setiap kesesakan” mempertahankan daya distributif dan nuansa tekanan atau keadaan genting pada צָרָה.
- source_word: הִצִּילָנִי
  choice: Ia telah melepaskan aku
  rationale: Bentuk Hifil dari נצל berarti melepaskan atau menyelamatkan dari bahaya. Bentuk perfektif diterjemahkan sebagai tindakan yang telah terjadi dan tetap relevan bagi kesaksian pemazmur.
- source_word: וּבְאֹיְבַי
  choice: dan ... musuh-musuhku
  rationale: Dengan ראה, preposisi ב menandai pihak yang dipandang. Dalam bahasa Indonesia, objek verba “memandang” tidak memerlukan preposisi tambahan.
- source_word: רָאֲתָה עֵינִי
  choice: mataku telah memandang
  rationale: Subjek harfiahnya ialah “mataku”. Ungkapan ini dipertahankan demi citra Ibrani, sementara “memandang” menghasilkan susunan Indonesia yang wajar tanpa menambahkan gagasan kemenangan atau kehancuran musuh.
theological_decisions:
- issue: Makna pemazmur memandang musuh-musuhnya
  choice: Menyatakan bahwa mata pemazmur telah memandang musuh-musuhnya tanpa menyebut kekalahan, kehancuran, pembalasan, atau kemenangan.
  alternative: Mataku telah melihat kehancuran musuh-musuhku; aku memandang musuh-musuhku dengan kemenangan.
  rationale: Teks Ibrani hanya menyatakan bahwa mata pemazmur melihat atau memandang musuh-musuhnya. Konteks dapat menyiratkan pembenaran atau kejatuhan mereka, tetapi hal itu tidak disebutkan secara eksplisit; karena itu ketegangan tersebut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” merujuk kepada Allah sebagai subjek tersirat dari verba. Citra “mataku” dipertahankan karena jelas dan puitis dalam bahasa Indonesia.
