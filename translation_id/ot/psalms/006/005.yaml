lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi permohonan pada ayat sebelumnya dan terdengar alami dalam puisi Indonesia.
- source_word: אֵין
  choice: tidak ada
  rationale: Menyampaikan penyangkalan eksistensial Ibrani secara idiomatis.
- source_word: בַּמָּוֶת
  choice: dalam kematian
  rationale: Mempertahankan gambaran lokatif dan kesejajarannya dengan 'di dunia orang mati'.
- source_word: זִכְרֶךָ
  choice: yang mengingat Engkau
  rationale: Mengungkapkan זֵכֶר secara alami dalam bahasa Indonesia sambil mempertahankan kemungkinan makna tindakan mengenang atau menyebut Allah.
- source_word: בִּשְׁאוֹל
  choice: di dunia orang mati
  rationale: Mengomunikasikan konsep שְׁאוֹל kepada pembaca umum tanpa menyempitkannya menjadi kubur fisik atau memasukkan konsep akhirat yang lebih khusus.
- source_word: מִי
  choice: siapa
  rationale: Padanan langsung untuk kata tanya yang membentuk pertanyaan retoris.
- source_word: יוֹדֶה לָּךְ
  choice: akan mengucap syukur kepada-Mu
  rationale: Menampilkan arti umum bentuk Hifil ידה dalam konteks ibadah; 'memuji' tetap merupakan kemungkinan.
theological_decisions:
- issue: Makna שְׁאוֹל
  choice: dunia orang mati
  alternative: Syeol; kubur
  rationale: Pilihan ini menjaga rujukan pada ranah orang mati dalam pemikiran Ibrani tanpa menyamakannya secara sempit dengan kubur atau dengan konsep teologis lain.
- issue: Makna זִכְרֶךָ dalam kematian
  choice: tidak ada yang mengingat Engkau
  alternative: tidak ada penyebutan tentang Engkau
  rationale: Bahasa mazmur menyatakan sudut pandang ratapan mengenai tiadanya tindakan mengenang dan bersyukur di antara orang mati; terjemahan tidak mengubahnya menjadi pernyataan sistematis yang lebih luas tentang keadaan sesudah mati.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskannya.
