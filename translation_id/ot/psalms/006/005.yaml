  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: id
  text: Sebab dalam kematian tidak ada yang mengingat Engkau; di Syeol[a], siapa yang akan mengucap syukur kepada-Mu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Syeol; dapat juga diterjemahkan “kubur” atau “alam orang mati”.'
