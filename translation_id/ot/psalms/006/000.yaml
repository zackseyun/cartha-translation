  text: לַ/מְנַצֵּ֣חַ בִּ֭/נְגִינוֹת עַֽל הַ/שְּׁמִינִ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/000.yaml
  text: 'For the choirmaster: with stringed instruments, according to the Sheminith[a]. A psalm of David[b].'
translation:
  language: id
  text: 'Untuk pemimpin musik: dengan alat musik petik, menurut Syeminit[a]. Mazmur Daud[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Syeminit; mungkin berarti “yang kedelapan”, tata nada satu oktaf, atau alat musik berdawai delapan.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “mazmur oleh Daud” atau “mazmur untuk Daud”; bentuk Ibraninya dapat menunjukkan kepengarangan atau hubungan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, bentuk ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Pilihan ini jelas dalam bahasa Indonesia modern tanpa membatasi tugasnya hanya pada paduan suara.
- source_word: בִּנְגִינוֹת
  choice: dengan alat musik petik
  rationale: Istilah ini dalam konteks musikal merujuk pada musik atau instrumen berdawai. Frasa ini alami dalam bahasa Indonesia dan tidak menentukan jenis instrumen secara berlebihan.
- source_word: עַל
  choice: menurut
  rationale: Dalam judul mazmur, kata depan ini dapat memperkenalkan lagu, gaya, atau tata musikal. 'Menurut' mempertahankan sifat petunjuk pertunjukan tanpa memastikan bahwa yang dimaksud adalah sebuah instrumen.
- source_word: הַשְּׁמִינִית
  choice: Syeminit
  rationale: Acuan istilah teknis ini tidak pasti; mungkin berarti 'yang kedelapan', suatu tata nada satu oktaf, atau alat musik berdawai delapan. Transliterasi menghindari kepastian semu.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah padanan baku dan tepat bagi nyanyian yang terkait dengan pertunjukan musikal.
- source_word: לְדָוִד
  choice: Daud
  rationale: Konstruksi 'Mazmur Daud' dalam bahasa Indonesia dapat menyatakan kepengarangan ataupun hubungan dengan Daud, sehingga tidak mempersempit fungsi preposisi Ibrani לְ.
theological_decisions:
- issue: Kepengarangan atau hubungan yang dinyatakan oleh לְדָוִד
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud; Mazmur untuk Daud
  rationale: Preposisi Ibrani dapat menandai kepengarangan, peruntukan, kepemilikan, atau hubungan. Konstruksi genitif Indonesia mempertahankan ambiguitas itu, sedangkan 'oleh Daud' akan menegaskan kepengarangan secara lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas dengan gaya yang sesuai untuk judul musikal. Istilah teknis yang tidak pasti ditransliterasikan, sedangkan ambiguitas hubungan dengan Daud dipertahankan.
