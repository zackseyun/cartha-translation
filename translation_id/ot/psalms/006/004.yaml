  text: שׁוּבָ֣/ה יְ֭הוָה חַלְּצָ֣/ה נַפְשִׁ֑/י ה֝וֹשִׁיעֵ֗/נִי לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/004.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: id
  text: Kembalilah, ya TUHAN; lepaskanlah nyawaku; selamatkanlah aku karena kasih setia-Mu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבָה
  choice: Kembalilah
  rationale: Imperatif ini secara harfiah meminta TUHAN berbalik atau kembali mendekat; bentuk Indonesia ini mempertahankan seruan langsung tanpa menambahkan objek yang tidak tersurat.
- source_word: חַלְּצָה נַפְשִׁי
  choice: lepaskanlah nyawaku
  rationale: חַלֵּץ berarti melepaskan atau membebaskan dari bahaya, sedangkan נֶפֶשׁ di sini menunjuk pada hidup diri pemazmur yang terancam; 'nyawaku' lebih tepat daripada pengertian bagian manusia yang terpisah dari tubuh.
- source_word: הוֹשִׁיעֵנִי
  choice: selamatkanlah aku
  rationale: Bentuk imperatif dengan sufiks orang pertama tunggal menyatakan permohonan langsung agar pemazmur diselamatkan.
- source_word: לְמַעַן חַסְדֶּךָ
  choice: karena kasih setia-Mu
  rationale: לְמַעַן menyatakan dasar atau alasan permohonan, sementara חֶסֶד mencakup kasih yang teguh, setia, dan berkomitmen; 'kasih setia' merupakan padanan Indonesia yang ringkas dan mapan.
theological_decisions:
- issue: Dasar permohonan keselamatan
  choice: karena kasih setia-Mu
  alternative: demi kasih setia-Mu
  rationale: Ungkapan Ibrani menempatkan חֶסֶד TUHAN sebagai dasar permohonan, bukan kelayakan pemazmur. 'Karena' menyatakannya dengan alami tanpa menghilangkan nuansa tujuan yang juga mungkin ada pada לְמַעַן.
- issue: Makna נֶפֶשׁ
  choice: nyawaku
  alternative: jiwaku
  rationale: Dalam konteks ancaman maut pada mazmur ini, נֶפֶשׁ menunjuk pada hidup atau diri pemazmur, bukan secara khusus unsur nonjasmani. 'Nyawaku' mempertahankan konteks bahaya hidup.
translation_notes:
  register: Bahasa doa yang modern, lugas, dan khidmat. Partikel 'ya' mempertahankan seruan vokatif, sedangkan bentuk imperatif dengan '-lah' terdengar wajar dalam doa Indonesia. Kapitalisasi TUHAN mengikuti kebiasaan terjemahan Indonesia untuk nama perjanjian יהוה.
