id: PSA.6.8
reference: Psalms 6:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
translation:
  language: id
  text: Menjauhlah dariku, kamu semua yang melakukan kejahatan,[a] sebab Yahweh telah mendengar suara tangisku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “semua pelaku kefasikan” atau, secara lebih ringkas, “semua orang jahat.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “suara tangisku”; dapat juga dipahami sebagai “bunyi ratapanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: Menjauhlah dariku
  rationale: Imperatif jamak סוּרוּ menuntut agar para lawan pergi atau menyingkir. “Menjauhlah dariku” alami, tegas, dan mempertahankan unsur pemisahan pribadi dalam מִמֶּנִּי.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: kamu semua yang melakukan kejahatan
  rationale: Frasa konstruksi ini secara harfiah menunjuk kepada semua orang yang mengerjakan atau melakukan אָוֶן. Bentuk klausa ini mempertahankan gambaran tindakan sambil terdengar wajar dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya. “Sebab” sesuai dengan gaya puisi yang bermartabat dan tetap jelas.
- source_word: שָׁמַע
  choice: telah mendengar
  rationale: Bentuk perfektif menyatakan tindakan yang telah terjadi dengan dampak yang masih berlaku; “telah mendengar” menyampaikan keyakinan pemazmur itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
- source_word: קוֹל בִּכְיִי
  choice: suara tangisku
  rationale: קוֹל dapat berarti suara atau bunyi, sedangkan בִּכְיִי berarti tangisku atau ratapanku. “Suara tangisku” mempertahankan gambaran ratapan yang terdengar dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan “kamu semua” memperjelas bahwa imperatif Ibrani berbentuk jamak. Diksi mempertahankan gerak puitis dari perintah tegas menuju keyakinan bahwa ratapan pemazmur telah didengar.
