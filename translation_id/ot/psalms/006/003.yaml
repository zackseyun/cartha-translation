  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
translation:
  language: id
  text: Jiwaku[a] pun sangat terguncang[b]. Namun[c] Engkau, ya Yahweh[d]—sampai kapan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidupku” atau “diriku sendiri”.
    reason: lexical_alternative
  - marker: b
    text: Atau “sangat gentar” atau “sangat ketakutan”.
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “Dan Engkau”; “Namun” menyatakan peralihan tajam dalam ratapan.'
