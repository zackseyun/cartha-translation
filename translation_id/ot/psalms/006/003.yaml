lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: Jiwaku pun
  rationale: נֶפֶשׁ dapat menunjuk pada jiwa, hidup, atau diri seseorang. “Jiwaku” mempertahankan citra puitis dan kesejajarannya dengan penderitaan jasmani dalam konteks; וְ dinyatakan secara alami dengan “pun”.
- source_word: נִבְהֲלָה מְאֹד
  choice: sangat gentar
  rationale: Bentuk dari בהל menyatakan keguncangan, kegentaran, atau ketakutan yang mendalam, sedangkan מְאֹד memperkuatnya. “Sangat gentar” ringkas, wajar, dan mempertahankan intensitas ratapan.
- source_word: וְאַתָּה
  choice: Namun Engkau
  rationale: וְ secara bentuk berarti “dan”, tetapi di sini menandai peralihan tajam dari keadaan pemazmur kepada seruan langsung kepada Allah. “Namun” menyampaikan daya adversatif itu tanpa melengkapi kalimat yang sengaja terputus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: עַד מָתָי
  choice: sampai kapan?
  rationale: Ungkapan ratapan Ibrani ini secara idiomatis berarti “sampai kapan?” dan mempertahankan desakan emosional pertanyaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Kalimat eliptis setelah וְאַתָּה
  choice: 'Mempertahankan bentuk terputus: “Namun Engkau, ya Yahweh—sampai kapan?”'
  alternative: Melengkapinya, misalnya “Namun Engkau, ya Yahweh, sampai kapan akan membiarkannya?”
  rationale: Bahasa Ibrani tidak menyatakan tindakan yang diminta atau dipersoalkan. Mempertahankan elipsis menjaga ambiguitas dan ketegangan emosional-teologis dalam ratapan.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan corak puitis yang lugas dan khidmat. Kapitalisasi “Engkau” dipakai sebagai bentuk sapaan hormat kepada Allah. Tanda pisah mempertahankan jeda dan kalimat eliptis dalam bahasa Ibrani.
