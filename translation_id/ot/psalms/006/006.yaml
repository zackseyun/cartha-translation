  text: I am weary with my groaning[a]; every night I drench my bed[b]; with my tears I soak my couch.
translation:
  language: id
  text: Aku letih karena eranganku[a]; setiap malam kubanjiri tempat tidurku[b]; dengan air mataku kubasahi pembaringanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah menjadi letih oleh keluh kesahku.”
    reason: Bentuk verba dan preposisinya dapat diungkapkan sebagai keadaan sekarang atau sebagai keadaan yang telah timbul akibat keluh kesah berkepanjangan.
  - marker: b
    text: Secara harfiah, “kubuat tempat tidurku berenang”; ini adalah hiperbola puitis untuk membanjirinya dengan air mata.
    reason: Menjelaskan gambaran harfiah dari kata kerja Ibrani yang diterjemahkan secara idiomatis.
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Aku letih
  rationale: Bentuk perfektif menyatakan keadaan letih yang timbul dari penderitaan berkepanjangan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan daya ratapan.
- source_word: בְּאַנְחָתִי
  choice: karena eranganku
  rationale: Kata אַנְחָה mencakup erangan atau keluh kesah. 'Eranganku' mempertahankan gambaran jasmani dari ratapan, sedangkan 'karena' menyampaikan hubungan sebab yang wajar dalam konteks.
- source_word: אַשְׂחֶה
  choice: kubanjiri
  rationale: Bentuk Hifil secara harfiah menggambarkan tindakan membuat tempat tidur 'berenang'. 'Kubanjiri' mempertahankan hiperbola puitis tersebut dalam bahasa Indonesia yang alami.
- source_word: בְכָל לַיְלָה
  choice: setiap malam
  rationale: Frasa ini paling wajar menunjuk pada kejadian yang berulang dari malam ke malam, bukan hanya lamanya satu malam.
- source_word: מִטָּתִי
  choice: tempat tidurku
  rationale: מִטָּה adalah istilah umum untuk tempat tidur; padanan ini jelas dan alami bagi pembaca modern.
- source_word: בְּדִמְעָתִי
  choice: dengan air mataku
  rationale: 'Preposisi ב menandai sarana: air mata adalah cairan yang membasahi tempat berbaring.'
- source_word: עַרְשִׂי
  choice: pembaringanku
  rationale: עֶרֶשׂ menunjuk pada dipan atau tempat berbaring. 'Pembaringanku' mempertahankan variasi leksikal dari מִטָּה tanpa memakai istilah yang terasa asing.
- source_word: אַמְסֶה
  choice: kubasahi
  rationale: Secara dasar bentuk ini dapat berarti menyebabkan mencair atau larut; dalam konteks air mata, maksud figuratifnya ialah membasahi hingga kuyup. 'Kubasahi' jelas dan tidak berlebihan dalam bahasa Indonesia.
