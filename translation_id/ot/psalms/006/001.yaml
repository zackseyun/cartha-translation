id: PSA.6.1
reference: Psalms 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְֽהוָ֗ה אַל בְּ/אַפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וְֽ/אַל בַּ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: id
  text: Ya Yahweh, janganlah menegur aku dalam kemarahan-Mu, dan janganlah mendisiplinkan[a] aku dalam murka-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: menghajar; atau: mengoreksi.'
    reason: יסר memiliki rentang makna mendisiplinkan, menghajar, atau mengoreksi; padanan utama mempertahankan unsur pembinaan tanpa meniadakan kerasnya tindakan.
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”; “Ya” menandai sapaan langsung dalam doa.
- source_word: אַל ... תוֹכִיחֵנִי
  choice: janganlah menegur aku
  rationale: Partikel larangan אַל dan bentuk verba ini menyampaikan permohonan agar tidak ditegur; “janganlah” sesuai dengan ragam doa yang wajar dan bermartabat.
- source_word: בְּאַפְּךָ
  choice: dalam kemarahan-Mu
  rationale: אַף secara harfiah berarti “hidung”, tetapi secara idiomatis menunjuk pada kemarahan. Frasa “dalam kemarahan-Mu” mempertahankan hubungan preposisional teks Ibrani.
- source_word: וְאַל
  choice: dan janganlah
  rationale: Mempertahankan konjungsi dan susunan paralel kedua bagian ayat.
- source_word: תְיַסְּרֵנִי
  choice: mendisiplinkan aku
  rationale: Bentuk Piel dari יסר mencakup tindakan mendidik atau mengoreksi melalui disiplin. “Mendisiplinkan” tidak mempersempit maknanya menjadi hukuman semata.
- source_word: בַּחֲמָתְךָ
  choice: dalam murka-Mu
  rationale: חֵמָה menyatakan kemarahan yang membara atau murka. “Murka” mempertahankan bobot puitis dan membedakannya dari אַף pada baris pertama.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan teguran dan disiplin dengan kemarahan ilahi
  choice: Larangan melekat pada tindakan yang dilakukan “dalam kemarahan/murka”
  alternative: Memahami pemazmur sebagai menolak segala teguran dan disiplin
  rationale: Susunan Ibrani mengaitkan kedua tindakan dengan kemarahan dan murka. Terjemahan tidak menambahkan penjelasan teologis yang meniadakan kemungkinan teguran atau disiplin di luar keadaan tersebut.
- issue: Pembedaan אַף dan חֵמָה
  choice: kemarahan / murka
  alternative: murka / amarah; kemarahan / amarah
  rationale: Dua nomina yang berkaitan tetapi berbeda diterjemahkan dengan dua istilah agar paralelisme puitis dan peningkatan bobot pada חֵמָה tetap terasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk “janganlah” sesuai untuk permohonan doa, sedangkan kapitalisasi pada akhiran pronominal ilahi mengikuti kebiasaan hormat dalam penulisan Alkitab bahasa Indonesia.
