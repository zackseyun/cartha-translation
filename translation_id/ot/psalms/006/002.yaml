id: PSA.6.2
reference: Psalms 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: id
  text: 'Kasihanilah aku, ya Yahweh,

    sebab aku merana;[a]

    sembuhkanlah aku, ya Yahweh,

    sebab tulang-tulangku gemetar.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku lemah” atau “aku layu”; kata Ibraninya menggambarkan keadaan merosot, merana, atau kehilangan daya.
    reason: lexical_alternative
  - marker: b
    text: Atau “tulang-tulangku sangat terguncang” atau “tulang-tulangku diliputi kegentaran”; “tulang-tulang” dapat menggambarkan penderitaan jasmani atau keguncangan batin yang mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Kasihanilah aku
  rationale: Bentuk imperatif dari חנן memohon kemurahan atau belas kasih. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nada permohonan pribadi kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap dipertahankan.
- source_word: כִּי
  choice: sebab
  rationale: Di kedua bagiannya, כִּי menyatakan alasan yang mendasari permohonan pemazmur.
- source_word: אֻמְלַל
  choice: merana
  rationale: Kata ini menggambarkan keadaan lemah, layu, atau makin kehilangan daya. “Merana” mempertahankan kesan kemerosotan yang lebih kuat daripada sekadar “lemah” tanpa membatasi penyebabnya.
- source_word: רְפָאֵנִי
  choice: sembuhkanlah aku
  rationale: Kata kerja רפא secara langsung berarti menyembuhkan; terjemahan ini tetap dapat mencakup penderitaan jasmani maupun keadaan diri secara menyeluruh.
- source_word: נִבְהֲלוּ
  choice: gemetar
  rationale: Kata kerja בהל dapat menyatakan kegentaran, kepanikan, atau keadaan sangat terguncang. Bersama “tulang-tulangku”, “gemetar” menyampaikan dampak jasmani yang kuat dan tetap alami dalam bahasa Indonesia.
- source_word: עֲצָמָי
  choice: tulang-tulangku
  rationale: Terjemahan harfiah ini mempertahankan gambaran tubuh dalam puisi Ibrani, yang dapat menyatakan penderitaan jasmani sekaligus keguncangan batin yang mendalam.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut melalui transliterasi dan tidak menggantinya dengan gelar seperti “TUHAN”.
- issue: Cakupan penderitaan dalam ungkapan “tulang-tulangku gemetar”
  choice: Mempertahankan gambaran konkret tanpa menentukan bahwa penderitaan hanya jasmani atau hanya batin
  alternative: Menguraikannya sebagai “seluruh diriku sangat terguncang”
  rationale: Ungkapan Ibrani dapat menunjuk pada penderitaan tubuh dan keguncangan diri yang mendalam. Terjemahan konkret menjaga ambiguitas dan daya puitis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan dengan susunan paralel yang mengikuti teks Ibrani. Partikel “ya” menandai sapaan langsung secara wajar. Gambaran konkret “tulang-tulangku” dipertahankan, sedangkan catatan kaki menjelaskan rentang maknanya.
