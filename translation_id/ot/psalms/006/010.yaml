  text: Let all my enemies be ashamed and greatly terrified[a]; let them turn back and be ashamed in an instant.
translation:
  language: id
  text: Biarlah semua musuhku menjadi malu dan sangat gentar[a]; biarlah mereka berbalik dan menjadi malu dalam sekejap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dipermalukan dan sangat gentar ... kembali dan dipermalukan secara tiba-tiba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: biarlah ... dipermalukan
  rationale: Dalam konteks puitis yang bernuansa permohonan ini, bentuk imperfek paling wajar diterjemahkan sebagai harapan atau permohonan. Bentuk pasif 'dipermalukan' mempertahankan makna malu atau mendapat aib tanpa menentukan secara khusus bagaimana hal itu terjadi.
- source_word: וְיִבָּהֲלוּ מְאֹד
  choice: dan sangat ketakutan
  rationale: Kata בהל menyatakan rasa takut atau kegentaran yang mendadak, sedangkan מְאֹד memperkuatnya. 'Sangat ketakutan' alami dalam bahasa Indonesia dan mempertahankan daya emosional teks.
- source_word: כָּל אֹיְבָי
  choice: semua musuhku
  rationale: Ini merupakan padanan langsung dan alami bagi bentuk konstruksi dengan akhiran orang pertama tunggal.
- source_word: יָשֻׁבוּ
  choice: biarlah mereka mundur
  rationale: שׁוב berarti berbalik atau kembali. Dalam konteks para musuh, 'mundur' menyampaikan gerak berbalik tanpa menambahkan gambaran militer secara berlebihan.
- source_word: יֵבֹשׁוּ
  choice: dan dipermalukan
  rationale: Pengulangan akar בוש dipertahankan untuk menjaga penekanan dan kesejajaran puitis bahasa Ibrani.
- source_word: רָגַע
  choice: dalam sekejap
  rationale: Di sini kata tersebut berfungsi secara adverbial dan menunjukkan kemendadakan atau kesegeraan. 'Dalam sekejap' menyampaikan pembalikan yang tiba-tiba secara idiomatis.
