id: PSA.6.9
reference: Psalms 6:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׁמַ֣ע יְ֭הוָה תְּחִנָּתִ֑/י יְ֝הוָ֗ה תְּֽפִלָּתִ֥/י יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/009.yaml
  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
translation:
  language: id
  text: Yahweh telah mendengar permohonanku; Yahweh akan menerima doaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “akan mengambil doaku”; dalam konteks ini dapat berarti “akan menerima doaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: telah mendengar
  rationale: 'Bentuk qatal menyatakan tindakan yang sudah terjadi dan tetap relevan: pemazmur menyatakan keyakinan bahwa Yahweh telah mendengarnya.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankan bentuk nama diri dalam teks Ibrani.
- source_word: תְּחִנָּתִי
  choice: permohonanku
  rationale: Kata ini menunjuk pada permohonan sungguh-sungguh untuk belas kasihan atau pertolongan; 'permohonan' alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: Ini adalah istilah umum untuk doa. Pilihan ini juga mempertahankan pembedaan dengan תְּחִנָּה dalam baris sebelumnya.
- source_word: יִקָּח
  choice: akan menerima
  rationale: Bentuk yiqtol di sini menyatakan keyakinan tentang tindakan Yahweh. Verba לָקַח secara harfiah berarti 'mengambil', tetapi dengan objek 'doaku' paling wajar dipahami sebagai 'menerima'; pilihan ini tidak melangkah sejauh 'mengabulkan'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna penerimaan doa dalam יִקָּח
  choice: akan menerima doaku
  alternative: akan mengabulkan doaku
  rationale: '''Menerima'' menjaga cakupan verba Ibrani dan keyakinan pemazmur tanpa menyatakan secara lebih khusus bahwa jawaban yang diminta pasti diberikan.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Paralelisme dipertahankan dengan membedakan 'permohonanku' dari 'doaku'. Penanda catatan kaki ditempatkan setelah frasa yang diterangkannya.
