  text: עָֽשְׁשָׁ֣ה מִ/כַּ֣עַס עֵינִ֑/י עָֽ֝תְקָ֗ה בְּ/כָל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/007.yaml
  text: My eye has wasted away from grief[a]; it has grown old because of all my enemies.
translation:
  language: id
  text: Mataku melemah karena dukacita; menjadi tua karena semua musuhku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mataku meredup karena kekesalan; menjadi tua karena semua lawanku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: merana
  rationale: Kata kerja ini menggambarkan keadaan yang menyusut, melemah, atau rusak. Dalam ratapan ini, “merana” mempertahankan gambaran kemerosotan jasmani tanpa membatasinya hanya pada penglihatan yang menjadi kabur.
- source_word: מִכַּעַס
  choice: karena dukacita
  rationale: כַּעַס dapat berarti kekesalan, kepedihan, atau dukacita. Konteks ratapan pribadi mendukung “dukacita,” sementara kemungkinan nuansa kekesalan dicatat dalam catatan kaki.
- source_word: עֵינִי
  choice: mataku
  rationale: Bentuk Ibrani adalah tunggal dengan akhiran orang pertama. Bentuk tunggal dipertahankan secara alami dalam bahasa Indonesia.
- source_word: עָתְקָה
  choice: menjadi tua
  rationale: Kata ini menyatakan menjadi tua atau usang. “Menjadi tua” mempertahankan metafora Ibrani yang kuat dan tidak meratakannya menjadi sekadar “melemah.”
- source_word: בְּכָל
  choice: karena semua
  rationale: Dalam konstruksi ini, preposisi menyatakan para musuh sebagai penyebab atau pemicu keadaan tersebut; “karena semua” menyampaikan hubungan kausal dengan jelas.
- source_word: צוֹרְרָי
  choice: musuhku
  rationale: Bentuk partisip ini menunjuk kepada orang-orang yang memusuhi atau menghimpit pemazmur. “Musuhku” merupakan padanan Indonesia yang alami dan cukup kuat.
