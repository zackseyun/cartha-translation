translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “mataku” menjernihkan subjek klausa kedua yang tersirat dalam bahasa Ibrani, sedangkan ungkapan “menjadi tua” sengaja mempertahankan metafora sumber.
