  yaml_path: translation/ot/psalms/073/005.yaml
  text: They are not in the trouble of mortal man[a], and they are not plagued with mankind.
translation:
  language: id
  text: Mereka tidak mengalami kesusahan manusia fana,[a] dan mereka tidak ditimpa penderitaan bersama manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka tidak menanggung jerih payah manusia fana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲמַל
  choice: mengalami kesusahan
  rationale: עָמָל dapat berarti kesusahan, jerih payah, atau penderitaan. Dalam konteks kemudahan semu orang fasik, 'kesusahan' mencakup beban hidup dan kemalangan secara alami dalam bahasa Indonesia.
- source_word: אֱנוֹשׁ
  choice: manusia fana
  rationale: אֱנוֹשׁ dapat menonjolkan kelemahan dan kefanaan manusia; 'manusia fana' mempertahankan nuansa itu.
- source_word: אֵינֵמוֹ
  choice: mereka tidak mengalami
  rationale: Bentuk eksistensial negatif dengan sufiks orang ketiga jamak menyatakan bahwa kesusahan tersebut tidak menjadi bagian mereka. Ungkapan verbal ini alami dalam bahasa Indonesia.
- source_word: וְעִם
  choice: seperti
  rationale: Secara harfiah berarti 'dengan', tetapi dalam paralelisme ini menyatakan bahwa mereka tampaknya tidak turut mengalami nasib umum manusia; 'seperti' menyampaikan perbandingan tersebut secara alami.
- source_word: אָדָם
  choice: orang lain
  rationale: אָדָם di sini menunjuk manusia pada umumnya. Dalam kalimat Indonesia, 'orang lain' secara alami menyatakan kontras antara 'mereka' dan umat manusia selebihnya tanpa membatasi rujukan berdasarkan gender.
- source_word: יְנֻגָּעוּ
  choice: ditimpa penderitaan
  rationale: Bentuk pasif dari נגע berarti dipukul, ditimpa, atau disengsarakan. 'Ditimpa penderitaan' mempertahankan gagasan terkena kemalangan tanpa mempersempitnya menjadi penyakit tertentu.
