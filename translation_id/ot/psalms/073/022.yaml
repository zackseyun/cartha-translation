  text: Then I was senseless and did not know[a]; I was like a beast before you.
translation:
  language: id
  text: Aku bodoh dan tidak tahu; aku seperti binatang[a] bersama-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani memakai bentuk jamak, “binatang-binatang”; kemungkinan merupakan ungkapan intensif atau kolektif yang berarti “seperti binatang” atau “bersifat seperti binatang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ketika itu aku
  rationale: Waw menghubungkan pengakuan ini dengan kesadaran yang baru dinyatakan pada ayat sebelumnya. “Ketika itu” menyampaikan hubungan reflektif tersebut secara alami tanpa menjadikannya pertentangan yang tegas.
- source_word: בַעַר
  choice: tidak berakal
  rationale: Kata ini menggambarkan kebodohan yang menyerupai kebinatangan atau ketiadaan pengertian, bukan sekadar kurang informasi. “Tidak berakal” mempertahankan daya metaforanya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: וְלֹא אֵדָע
  choice: dan tidak tahu
  rationale: Terjemahan ini mempertahankan arti dasar ידע, “tahu,” sedangkan unsur ketidakmengertian yang lebih kuat sudah dinyatakan oleh “tidak berakal.”
- source_word: בְּהֵמוֹת
  choice: seperti binatang
  rationale: Bentuknya jamak, tetapi di sini kemungkinan berfungsi secara intensif atau kolektif untuk menggambarkan keadaan yang menyerupai binatang. Bentuk tunggal dalam perbandingan menghasilkan bahasa Indonesia yang alami.
- source_word: הָיִיתִי
  choice: aku seperti
  rationale: Secara harfiah berarti “aku adalah/aku berada.” Dalam konstruksi perbandingan ini, kopula tersebut diungkapkan secara alami bersama “seperti.”
- source_word: עִמָּךְ
  choice: di dekat-Mu
  rationale: עם pada dasarnya menyatakan kebersamaan atau kedekatan. “Di dekat-Mu” mempertahankan unsur berada bersama Allah sekaligus lebih alami daripada “bersama-Mu” setelah gambaran binatang, dan tidak mengubahnya menjadi sekadar “di hadapan-Mu.”
theological_decisions:
- issue: Daya gambaran binatang dalam pengakuan pemazmur kepada Allah
  choice: 'Perbandingan yang mengakui ketidakberakalan pemazmur: “aku seperti binatang di dekat-Mu.”'
  alternative: “Aku bagaikan hewan yang tidak berakal di hadapan-Mu.”
  rationale: Ayat ini merupakan pengakuan atas ketumpulan pengertian pemazmur, bukan pernyataan doktrinal menyeluruh tentang hakikat manusia. Pilihan ini mempertahankan kerendahan hati dan ketajaman metafora tanpa menambahkan penjelasan teologis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pengakuan yang lugas dan bermartabat. Kapital pada “-Mu” mengikuti kebiasaan penulisan rujukan kepada Allah. Tanda titik koma mempertahankan kesejajaran antara pengakuan ketidaktahuan dan gambaran kebinatangan.
