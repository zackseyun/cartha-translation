  text: For my heart was embittered[a], and my kidneys were pierced.
translation:
  language: id
  text: Sebab hatiku menjadi pahit, dan aku tertusuk di ginjalku[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batinku yang terdalam”; dalam ungkapan Ibrani, ginjal melambangkan perasaan atau kesadaran batin yang paling dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan atau dasar bagi pengakuan pemazmur dalam konteks sebelumnya; “Sebab” mempertahankan hubungan penjelas tersebut secara wajar dalam bahasa Indonesia.
- source_word: יִתְחַמֵּץ
  choice: menjadi pahit
  rationale: Bentuk ini secara harfiah menggambarkan hati yang menjadi masam atau berfermentasi, dan dalam konteks menyatakan kepahitan batin. “Menjadi pahit” mempertahankan metaforanya tanpa terdengar kaku.
- source_word: לְבָבִי
  choice: hatiku
  rationale: “Hati” merupakan padanan lazim bagi pusat pikiran, perasaan, dan diri batiniah dalam antropologi Ibrani.
- source_word: וְכִלְיוֹתַי
  choice: dan buah pinggangku
  rationale: כִּלְיָה secara konkret berarti “buah pinggang” dan secara kiasan menunjuk pada bagian batin yang terdalam. Istilah konkret dipertahankan dalam teks, sedangkan makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: אֶשְׁתּוֹנָן
  choice: terasa tertusuk
  rationale: Kata kerja langka ini menggambarkan pengalaman terkena sesuatu yang tajam atau menusuk. “Terasa tertusuk” mempertahankan gambaran jasmani sekaligus menghasilkan ungkapan Indonesia yang dapat dipahami.
