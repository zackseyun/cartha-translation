  text: וָֽ֭/אֲחַשְּׁבָ/ה לָ/דַ֣עַת זֹ֑את עָמָ֖ל היא בְ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/016.yaml
  text: But when I thought to understand this[a], it was trouble in my eyes.
translation:
  language: id
  text: Namun, ketika aku berusaha memahami hal ini, hal itu terasa berat bagiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Namun, ketika aku berpikir untuk mengetahui hal ini, itu merupakan jerih payah di mataku.”'
    reason: Menunjukkan alternatif leksikal yang lebih harfiah bagi חשׁב, ידע, עמל, dan idiom בְּעֵינַי.
lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  choice: Namun, ketika aku berusaha
  rationale: Bentuk dari חשׁב menyatakan tindakan memikirkan atau mempertimbangkan; bersama infinitif לָדַעַת, konteksnya menunjukkan upaya batin untuk memahami. Kata sambung ו diterjemahkan secara adversatif sebagai “Namun” sesuai pertentangan dalam alur mazmur.
- source_word: לָדַעַת
  choice: memahami
  rationale: ידע secara dasar berarti “mengetahui”, tetapi di sini menunjuk pada usaha menangkap makna persoalan yang sedang direnungkan; “memahami” paling alami dalam bahasa Indonesia.
- source_word: זֹאת
  choice: hal ini
  rationale: Kata tunjuk ini merujuk kembali kepada persoalan dalam konteks sebelumnya. “Hal ini” mempertahankan rujukan yang tersirat tanpa menjelaskannya secara berlebihan.
- source_word: עָמָל
  choice: berat
  rationale: עמל dapat berarti jerih payah, kesusahan, atau beban yang menyakitkan. Ungkapan “terasa berat” menyampaikan sulit dan meletihkannya pergumulan batin ini dalam bahasa Indonesia yang alami.
- source_word: הִיא
  choice: hal itu terasa
  rationale: Pronomina feminin ini merujuk kepada זֹאת dan berfungsi predikatif. “Hal itu terasa” menghubungkan penilaian tersebut secara alami dengan frasa berikutnya.
- source_word: בְעֵינָי
  choice: bagiku
  rationale: Secara harfiah berarti “di mataku”, tetapi sebagai idiom menyatakan penilaian atau pengalaman pribadi, sehingga “bagiku” lebih alami dalam bahasa Indonesia modern.
