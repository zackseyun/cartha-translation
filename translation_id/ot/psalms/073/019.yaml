lexical_decisions:
- source_word: אֵיךְ
  choice: Betapa
  rationale: Kata ini membuka seruan tentang pembalikan nasib yang mengejutkan, bukan pertanyaan yang meminta informasi.
- source_word: הָיוּ לְשַׁמָּה
  choice: mereka menjadi porak-poranda
  rationale: Konstruksi ini menyatakan perubahan keadaan menuju kehancuran. Ungkapan Indonesia ini alami dan mempertahankan daya seru ayat.
- source_word: כְרָגַע
  choice: dalam sekejap
  rationale: Ungkapan ini menunjukkan singkat dan mendadaknya kehancuran.
- source_word: סָפוּ
  choice: Mereka lenyap
  rationale: Verba ini menyatakan bahwa mereka berakhir atau musnah, tanpa menentukan cara terjadinya secara berlebihan.
- source_word: תַמּוּ
  choice: habis
  rationale: Kata ini memperkuat verba sebelumnya dengan menekankan ketuntasan dan akhir yang menyeluruh.
- source_word: מִן בַּלָּהוֹת
  choice: oleh berbagai kengerian
  rationale: מִן dipahami menyatakan sebab atau sarana, sedangkan bentuk jamak בַּלָּהוֹת menunjuk pada kengerian-kengerian yang dahsyat.
