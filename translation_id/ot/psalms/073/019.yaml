  text: How they became a desolation in a moment! They came to an end[b][a]; they were consumed by terrors.
translation:
  language: id
  text: Betapa mereka menjadi porak-poranda dalam sekejap![a] Mereka lenyap, habis oleh kengerian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat berarti bahwa mereka menjadi suatu kehancuran atau menjadi pemandangan yang mengerikan karena keruntuhan mereka.
