base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/002.yaml
  text: But as for me[a], my feet had almost stumbled; my steps had nearly slipped.
translation:
  language: id
  text: Tetapi aku—kakiku nyaris menyimpang; langkah-langkahku hampir tergelincir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “kakiku nyaris tergelincir; langkah-langkahku hampir kehilangan pijakan.” Paralelisme puisi Ibrani memungkinkan gambaran ketidakstabilan yang sedikit berbeda, tetapi saling bertumpang tindih.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Tetapi aku
  rationale: Kata penghubung dan pronomina mandiri menandai kontras dengan konteks sebelumnya sekaligus menegaskan si pembicara.
- source_word: כִּמְעַט
  choice: nyaris
  rationale: Adverbia ini menyatakan bahwa sesuatu hampir saja terjadi; “nyaris” alami dan ringkas dalam bahasa Indonesia.
- source_word: נטוי
  choice: goyah
  rationale: Bentuk dari נטה menggambarkan kaki yang hampir menyimpang atau kehilangan kestabilan. “Goyah” mempertahankan gambaran ketidakstabilan tanpa mempersempitnya menjadi penafsiran moral tertentu.
- source_word: רַגְלָי
  choice: kakiku
  rationale: Gambaran anggota tubuh dipertahankan. Bentuk “kakiku” wajar dalam bahasa Indonesia meskipun nomina Ibraninya berbentuk jamak.
- source_word: כְּאַיִן
  choice: hampir
  rationale: Ungkapan idiomatis ini berarti kurang lebih “nyaris” atau “hampir sama sekali”; “hampir” menyampaikan maksudnya secara alami.
- source_word: שפכה
  choice: tergelincir
  rationale: Walaupun arti dasarnya berkaitan dengan menumpahkan atau tercurah, bersama “langkah-langkah” verba ini secara puitis menggambarkan hilangnya pijakan.
- source_word: אֲשֻׁרָי
  choice: langkah-langkahku
  rationale: Nomina ini menunjuk pada langkah atau gerak berjalan; bentuk ulang terdengar alami dan mempertahankan metafora perjalanan hidup.
theological_decisions:
- issue: Bahasa metaforis tentang ketidakstabilan
  choice: Mempertahankan gambaran konkret kaki dan langkah yang goyah atau tergelincir tanpa menjelaskan penerapan rohaninya.
  alternative: Menerjemahkannya secara eksplisit sebagai hampir kehilangan iman atau hampir jatuh ke dalam dosa.
  rationale: Ayat ini dapat menyiratkan ketidakstabilan rohani atau moral, tetapi teks Ibrani tidak menentukan dengan tepat sifat kejatuhan yang nyaris terjadi. Metaforanya perlu dibiarkan terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Tanda pisah menonjolkan peralihan kontras pada “Tetapi aku,” sedangkan pasangan “kakiku” dan “langkah-langkahku” mempertahankan paralelisme Ibrani.
