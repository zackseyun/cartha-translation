  yaml_path: translation/ot/psalms/073/004.yaml
  text: For they have no pains until death, and their body is fat.
translation:
  language: id
  text: Sebab mereka tidak mengalami derita sampai mati[a], dan tubuh mereka gemuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani pada bagian ini sulit. Dapat juga diterjemahkan, “tidak ada derita pada saat kematian mereka”; kata yang diterjemahkan “derita” secara harfiah dapat berarti “ikatan” atau “belenggu.”
    reason: Menjaga ketidakpastian leksikal חַרְצֻבּוֹת dan kemungkinan hubungan לְמוֹתָם dengan kematian mereka.
lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: sakit
  rationale: Kata yang jarang ini secara harfiah dapat menunjuk pada ikatan atau belenggu, tetapi dalam konteks ini paling wajar dipahami sebagai rasa sakit atau penderitaan.
- source_word: לְמוֹתָם
  choice: sampai ajal mereka tiba
  rationale: Mempertahankan arah terjemahan ‘sampai kematian mereka’ dalam bahasa Indonesia yang alami, sambil mencatat bahwa konstruksi Ibraninya dapat pula dipahami berkaitan dengan keadaan pada saat kematian.
- source_word: בָרִיא
  choice: gemuk
  rationale: Kata ini dapat berarti sehat, kuat, atau gemuk; dalam gambaran kemakmuran orang fasik, ‘gemuk’ mempertahankan citra konkret teks.
- source_word: אוּלָם
  choice: tubuh mereka
  rationale: Dalam konteks ini kata tersebut dipahami sebagai kekuatan atau keadaan jasmani; ‘tubuh mereka’ menghasilkan ungkapan Indonesia yang jelas dan sejalan dengan paralelisme ayat.
theological_decisions:
- issue: Gambaran kemakmuran orang fasik
  choice: Pernyataan pemazmur dipertahankan sebagai pengamatan bahwa mereka bebas dari sakit hingga ajal dan bertubuh gemuk.
  alternative: Melunakkan pernyataan menjadi sekadar bahwa mereka tampak sehat.
  rationale: Ketegangan dengan pengalaman dan ajaran lain dalam Mazmur tidak diselesaikan secara diam-diam; ayat ini menyuarakan persepsi pemazmur dalam konteks keluhannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Ajal mereka tiba’ dipilih sebagai ungkapan alami untuk kematian, sedangkan ‘gemuk’ mempertahankan citra konkret kemakmuran jasmani.
