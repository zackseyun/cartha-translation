  text: אִם אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ הִנֵּ֤ה ד֭וֹר בָּנֶ֣י/ךָ בָגָֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: id
  text: Seandainya aku berkata, “Aku akan berbicara demikian,” sungguh, aku tentu telah mengkhianati angkatan anak-anak-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku tentu telah berlaku tidak setia terhadap angkatan anak-anak-Mu.”
    reason: Alternatif ini mempertahankan nuansa ketidaksetiaan relasional dalam בגד, bukan hanya tindakan pengkhianatan dalam arti yang lebih spesifik.
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Seandainya aku berkata
  rationale: אִם memperkenalkan syarat hipotetis, sedangkan bentuk perfektum אָמַרְתִּי dalam konteks ini menyatakan kemungkinan yang tidak diwujudkan. “Seandainya” menyampaikan nuansa kontrafaktual itu secara alami dalam bahasa Indonesia.
- source_word: אֲסַפְּרָה כְמוֹ
  choice: Aku akan berbicara demikian
  rationale: ספר dapat berarti menceritakan atau menyatakan. Bersama כְמוֹ, frasa ini menunjuk pada mengutarakan pandangan seperti yang baru dipaparkan; “berbicara demikian” mempertahankan rujukan tersebut tanpa mempersempitnya menjadi kisah atau laporan.
- source_word: הִנֵּה
  choice: sungguh
  rationale: Partikel ini menandai kesadaran yang tegas. “Sungguh” mempertahankan penekanannya dengan register Indonesia yang wajar dan bermartabat.
- source_word: דּוֹר בָּנֶיךָ
  choice: angkatan anak-anak-Mu
  rationale: דּוֹר berarti angkatan atau generasi. Bentuk maskulin jamak בָּנֶיךָ secara harfiah berarti “anak-anak lelaki-Mu,” tetapi dalam konteks ini menunjuk pada umat milik Allah secara kolektif; “anak-anak-Mu” menyampaikan cakupan itu.
- source_word: בָגָדְתִּי
  choice: aku telah mengkhianati
  rationale: בגד menyatakan tindakan khianat atau ketidaksetiaan relasional. “Mengkhianati” ringkas, kuat, dan sesuai dengan hubungan pemazmur terhadap umat Allah.
theological_decisions:
- issue: Rujukan “anak-anak-Mu”
  choice: Sapaan ditujukan kepada Allah dan merujuk pada umat yang menjadi milik-Nya secara kolektif.
  alternative: “anak-anak lelaki-Mu,” dengan pengungkapan maskulin yang lebih harfiah
  rationale: Akhiran orang kedua tunggal maskulin secara alami menunjuk kepada Allah. Dalam konteks mazmur, ungkapan tersebut mencakup komunitas umat-Nya dan tidak perlu dibatasi hanya kepada laki-laki.
- issue: Daya syarat dalam pernyataan pemazmur
  choice: 'Diterjemahkan sebagai keadaan kontrafaktual: pemazmur tidak jadi mengutarakan pandangan tersebut karena hal itu berarti mengkhianati umat Allah.'
  alternative: 'Syarat terbuka: “Jika aku berkata”'
  rationale: Rangkaian bentuk perfektum dan konteks perenungan mendukung pembacaan hipotetis yang tidak diwujudkan, tetapi terjemahan tetap tidak menentukan lebih jauh bagaimana pengkhianatan itu berlangsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Demikian” dipilih sebagai padanan alami bagi rujukan ke ucapan sebelumnya, sedangkan huruf kapital pada “-Mu” mengikuti kebiasaan penulisan sapaan kepada Allah.
