  yaml_path: translation/ot/psalms/073/006.yaml
  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: id
  text: Sebab itu, kesombongan melingkari mereka seperti kalung[a]; kekerasan menyelubungi mereka seperti pakaian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab itu, kesombongan adalah kalung mereka; kekerasan menyelubungi mereka seperti pakaian.”
    reason: Bentuk עֲנָקַתְמוֹ dapat dipahami secara nominal, “kalung mereka,” atau secara verbal, “melingkari/mengalungi mereka.”
lexical_decisions:
- source_word: לָכֵן
  choice: Sebab itu
  rationale: Penanda wacana ini menyatakan akibat dari gambaran pada ayat-ayat sebelumnya dan mempertahankan hubungan logis secara alami dalam bahasa Indonesia.
- source_word: עֲנָקַתְמוֹ
  choice: menjadi kalung mereka
  rationale: Bentuk dari ענק menggambarkan perhiasan leher atau kalung yang dikenakan mereka; ungkapan predikatif ini mempertahankan metafora Ibrani dengan ringkas.
- source_word: גַאֲוָה
  choice: kesombongan
  rationale: Dalam konteks kecaman moral ini, kata tersebut menunjuk pada keangkuhan atau kebanggaan diri yang tercela.
- source_word: יַעֲטָף
  choice: menyelubungi
  rationale: Kata kerja עטף menyatakan tindakan membungkus atau melingkupi; 'menyelubungi' mempertahankan citra sesuatu yang dikenakan sekaligus terdengar wajar.
- source_word: שִׁית
  choice: seperti pakaian
  rationale: Nomina ini menunjuk pada pakaian atau penutup. Penambahan 'seperti' membuat metafora pakaian jelas dan alami dalam bahasa Indonesia.
- source_word: חָמָס
  choice: kekerasan
  rationale: חָמָס lazim menunjuk pada kekerasan yang mengandung ketidakadilan dan kejahatan; 'kekerasan' merupakan padanan langsung dalam konteks ini.
- source_word: לָמוֹ
  choice: mereka
  rationale: Pronomina ini menunjuk kepada orang-orang fasik yang sedang digambarkan dan secara idiomatis menjadi sasaran penyelubungan dalam klausa Indonesia.
