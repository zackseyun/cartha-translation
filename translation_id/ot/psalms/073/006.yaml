  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme dua citra—kalung dan pakaian—dipertahankan, demikian pula gambaran bahwa kesombongan dan kekerasan dipamerkan sebagai sesuatu yang dikenakan.
