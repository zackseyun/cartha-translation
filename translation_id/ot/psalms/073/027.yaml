  text: כִּֽי הִנֵּ֣ה רְחֵקֶ֣י/ךָ יֹאבֵ֑דוּ הִ֝צְמַ֗תָּה כָּל זוֹנֶ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
translation:
  language: id
  text: Sebab lihatlah, mereka yang jauh dari-Mu akan binasa; Engkau membinasakan semua orang yang tidak setia kepada-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “semua orang yang melacurkan diri dengan menjauh dari-Mu,” sebuah metafora Ibrani untuk ketidaksetiaan rohani atau ketidaksetiaan terhadap perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan alasan bagi pernyataan sebelumnya dan mempertahankan hubungan kausal dalam konteks.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Partikel penunjuk ini mengarahkan perhatian dengan penekanan yang khidmat, tetapi tetap wajar dalam bahasa Indonesia modern.
- source_word: רְחֵקֶיךָ
  choice: mereka yang jauh dari-Mu
  rationale: Bentuk jamak substantival ini menunjuk kepada orang-orang yang dicirikan oleh jarak relasional dari Allah.
- source_word: יֹאבֵדוּ
  choice: akan binasa
  rationale: Bentuk dari אבד menyatakan kebinasaan atau kehancuran; bentuk mendatang sesuai dengan verba Ibrani dan paralelisme ayat.
- source_word: הִצְמַתָּה
  choice: Engkau membinasakan
  rationale: Bentuk hifil dari צמת berarti menyebabkan binasa atau mengakhiri. Kala perfektif dapat menyatakan kepastian atau kebenaran yang tegas; bentuk kini dalam bahasa Indonesia menjaga daya puitis tanpa memaksakan waktu lampau.
- source_word: כָּל
  choice: semua orang
  rationale: Mempertahankan cakupan menyeluruh sekaligus menghasilkan ungkapan Indonesia yang alami bagi acuan kepada manusia.
- source_word: זוֹנֶה
  choice: yang tidak setia
  rationale: Partisipel זנה dipakai secara metaforis untuk ketidaksetiaan rohani atau perjanjian. Pilihan ini menyampaikan makna utama dengan jelas, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: מִמֶּךָּ
  choice: kepada-Mu
  rationale: Bersama זנה, preposisi ini menandai pihak yang ditinggalkan atau dikhianati; idiom Indonesia yang alami ialah 'tidak setia kepada-Mu'.
theological_decisions:
- issue: Daya metaforis זנה dalam hubungan dengan Allah
  choice: Ketidaksetiaan rohani atau perjanjian
  alternative: Semua orang yang melacurkan diri dengan menjauh dari-Mu
  rationale: Dalam Alkitab Ibrani, זנה dapat menggambarkan kemurtadan atau pelanggaran kesetiaan kepada Allah. Konteks mazmur ini mempertentangkan jauh dari Allah dengan dekat kepada-Nya. Teks utama menyampaikan maksud metafora, sementara catatan kaki menjaga gambaran Ibraninya.
- issue: Aspek waktu הִצְמַתָּה
  choice: Engkau membinasakan
  alternative: Engkau telah membinasakan
  rationale: Perfektif Ibrani dapat menyajikan tindakan sebagai pasti atau tuntas, sementara baris paralelnya memakai bentuk yang lazim dipahami sebagai mendatang. Bentuk kini Indonesia mempertahankan ketegangan puitis tanpa membatasi makna pada peristiwa lampau.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina ilahi dipakai menurut kebiasaan penerbitan Alkitab bahasa Indonesia. 'Lihatlah' mempertahankan penekanan הִנֵּה tanpa memakai bentuk arkais.
