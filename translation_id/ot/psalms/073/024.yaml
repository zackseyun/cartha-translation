  text: בַּ/עֲצָתְ/ךָ֥ תַנְחֵ֑/נִי וְ֝/אַחַ֗ר כָּב֥וֹד תִּקָּחֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/024.yaml
  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: id
  text: Dengan nasihat-Mu Engkau menuntun aku, dan sesudah itu Engkau akan membawa aku ke dalam kemuliaan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan sesudah itu Engkau akan menerima aku dengan kehormatan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: Dengan nasihat-Mu
  rationale: עֵצָה berarti nasihat, pertimbangan, atau rencana; prefiks בְּ menyatakan sarana. Frasa ini alami dalam bahasa Indonesia dan menunjukkan bahwa nasihat Allah menjadi sarana tuntunan-Nya.
- source_word: תַנְחֵנִי
  choice: Engkau menuntun aku
  rationale: Bentuk Hifil dari נחה berarti memimpin atau menuntun. “Menuntun” selaras dengan gambaran pengarahan ilahi dan berterima dalam bahasa Indonesia modern.
- source_word: וְאַחַר
  choice: dan sesudah itu
  rationale: אַחַר dipakai secara temporal untuk menyatakan tahap yang mengikuti tuntunan sekarang. “Sesudah itu” mempertahankan urutan tersebut tanpa menentukan kapan atau bagaimana hal itu terjadi.
- source_word: כָּבוֹד
  choice: kemuliaan
  rationale: כָּבוֹד dapat berarti kemuliaan atau kehormatan. “Kemuliaan” mempertahankan nada luhur dan kemungkinan cakrawala eskatologis, sedangkan makna “kehormatan” dicatat sebagai alternatif.
- source_word: תִּקָּחֵנִי
  choice: Engkau akan mengangkat aku
  rationale: לקח pada dasarnya berarti mengambil dan dalam konteks tertentu dapat menyiratkan membawa atau menerima. “Mengangkat aku” cocok dengan konstruksi Indonesia “ke dalam kemuliaan”, tetapi tetap merupakan penafsiran kontekstual sehingga alternatif yang lebih dekat, “menerima aku dengan kehormatan”, disediakan dalam catatan.
theological_decisions:
- issue: Makna frasa וְאַחַר כָּבוֹד תִּקָּחֵנִי
  choice: “dan sesudah itu Engkau akan mengangkat aku ke dalam kemuliaan”
  alternative: “dan sesudah itu Engkau akan menerima aku dengan kehormatan”
  rationale: Ibrani ini sangat padat dan hubungan sintaksis כָּבוֹד dengan verba לקח tidak dinyatakan secara eksplisit. Teks utama mempertahankan kemungkinan bahwa pemazmur akan dibawa ke dalam kemuliaan, tetapi catatan menjaga pembacaan bahwa Allah akan menerimanya dengan kehormatan. Rumusan ini tidak menetapkan secara lebih rinci mekanisme atau waktu penggenapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghapus kepadatan dan ambiguitas frasa Ibrani pada bagian akhir.
