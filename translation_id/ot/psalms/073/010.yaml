  text: לָ/כֵ֤ן ישיב עַמּ֣/וֹ הֲלֹ֑ם וּ/מֵ֥י מָ֝לֵ֗א יִמָּ֥צוּ לָֽ/מוֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/010.yaml
  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
translation:
  language: id
  text: Karena itu, umatnya kembali ke sini[a], dan air yang berlimpah[b] dikuras oleh mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena itu, ia membawa umatnya kembali ke sini.” Verba Ibrani dapat dipahami secara intransitif, “kembali”, atau secara lebih transitif, “membawa kembali”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “air kepenuhan”; ungkapan ini kemungkinan berarti air yang berlimpah, tetapi gambarannya sulit dipastikan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “dan air dalam takaran penuh diperas bagi mereka.” Verba dan pronomina pada akhir baris sama-sama sulit; sebagian orang memahami baris ini sebagai pemberian bagian yang berlimpah kepada mereka, bukan air yang dikuras oleh mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Penanda wacana ini menyatakan akibat atau kesimpulan dari uraian sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: ישיב
  choice: kembali
  rationale: Bentuk Hifil dari שוב dapat dipahami secara transitif, ‘membawa kembali’, atau dengan nuansa intransitif, ‘kembali’. Dalam susunan ayat yang sulit ini, ‘kembali’ menghasilkan bahasa Indonesia yang wajar tanpa menambahkan objek yang tidak dinyatakan.
- source_word: עַמּוֹ
  choice: umatnya
  rationale: Kata ini memakai akhiran orang ketiga tunggal maskulin. ‘Umatnya’ mempertahankan ketidakjelasan mengenai siapa yang dirujuk oleh akhiran tersebut.
- source_word: הֲלֹם
  choice: ke sini
  rationale: Keterangan tempat ini berarti ‘ke sini/di sini’; konteks dengan verba gerak mendukung ‘ke sini’.
- source_word: וּמֵי מָלֵא
  choice: dan air yang berlimpah
  rationale: Ungkapan Ibrani secara harfiah mendekati ‘air kepenuhan/air yang penuh’. ‘Air yang berlimpah’ menyampaikan gambaran kelimpahan secara alami sambil mempertahankan citra air.
- source_word: יִמָּצוּ
  choice: dikuras
  rationale: Bentuk Nifal dari מצה mengandung arti diperas, dihabiskan, atau dikuras. ‘Dikuras’ mempertahankan bentuk pasif serta citra pengambilan cairan sampai habis.
- source_word: לָמוֹ
  choice: oleh mereka
  rationale: Preposisi dengan akhiran pronominal ini dapat berarti ‘oleh mereka’, ‘bagi mereka’, atau ‘kepada mereka’. Bersama verba pasif, ‘oleh mereka’ memberi susunan yang koheren, sementara kemungkinan lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan akhiran ‘-nya’ dalam ‘umatnya’
  choice: Dibiarkan ambigu dalam teks utama
  alternative: Dapat merujuk kepada umat orang fasik itu atau umat Allah
  rationale: Akhiran Ibrani tidak menyebutkan antesedennya secara eksplisit, dan sintaksis ayat ini sulit. Menentukan rujukannya akan menyelesaikan ketegangan tafsir yang tidak diselesaikan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Pilihan ‘umatnya’ mempertahankan ambiguitas rujukan, sedangkan ‘dikuras’ menjaga citra pasif yang sulit dalam bahasa sumber. Semua alternatif utama yang benar-benar ditopang oleh bahasa Ibrani dicatat tanpa memaksakan penyelesaian teologis.
