  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲנִ֤י קִֽרֲבַ֥ת אֱלֹהִ֗ים לִ֫/י ט֥וֹב שַׁתִּ֤י בַּ/אדֹנָ֣/י יְהֹוִ֣ה מַחְסִ֑/י לְ֝/סַפֵּ֗ר כָּל מַלְאֲכוֹתֶֽי/ךָ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/028.yaml
  text: But as for me[a], the nearness of God is good for me; I have made the Lord GOD my refuge, so that I may tell of all your works.
translation:
  language: id
  text: Namun bagiku, kedekatan Allah itu baik[a]; aku telah menjadikan Tuhan Yahweh tempat perlindunganku, supaya aku dapat menceritakan segala karya-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendekat kepada Allah itu baik bagiku.” Nomina Ibrani dapat dipahami sebagai kedekatan relasional dengan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun bagiku
  rationale: Konjungsi dan pronomina mandiri menandai penegasan yang berlawanan dengan nasib orang fasik dalam konteks sebelumnya. “Namun bagiku” mengungkapkan kontras itu secara alami dalam bahasa Indonesia.
- source_word: קִרֲבַת אֱלֹהִים
  choice: kedekatan Allah
  rationale: Nomina dalam konstruksi ini menyatakan kedekatan dan dapat menunjuk pada kedekatan Allah maupun kedekatan seseorang kepada Allah. Bentuk nominal dipertahankan agar ambiguitas relasional dalam bahasa Ibrani tidak dipersempit.
- source_word: לִי טוֹב
  choice: itu baik bagiku
  rationale: Konstruksi predikatif ini menyatakan kebaikan atau manfaat bagi pemazmur. “Baik bagiku” alami dan tetap dekat dengan susunan sumber.
- source_word: שַׁתִּי
  choice: aku telah menjadikan
  rationale: Verba שׁית berarti menaruh atau menetapkan; bersama “tempat perlindunganku,” ungkapan ini menyatakan tindakan sengaja untuk menaruh kepercayaan.
- source_word: בַּאדֹנָי יְהוִה
  choice: Tuhan Yahweh
  rationale: אֲדֹנָי adalah gelar “Tuhan,” sedangkan יהוה adalah nama ilahi. “Tuhan Yahweh” mempertahankan pembedaan gelar dan nama yang terdapat dalam teks Ibrani.
- source_word: מַחְסִי
  choice: tempat perlindunganku
  rationale: מַחְסֶה menunjuk pada tempat berlindung atau perlindungan. Pilihan ini jelas dan idiomatis dalam bahasa Indonesia.
- source_word: לְסַפֵּר
  choice: supaya aku dapat menceritakan
  rationale: Infinitif berawalan ל dapat mengungkapkan tujuan. “Supaya aku dapat menceritakan” menyampaikan fungsi tujuan itu dengan jelas.
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: segala karya-Mu
  rationale: כָּל mencakup keseluruhan, dan מְלָאכָה di sini menunjuk pada karya atau perbuatan Allah. “Segala karya-Mu” merupakan padanan langsung dan wajar.
theological_decisions:
- issue: Makna relasional קִרֲבַת אֱלֹהִים
  choice: kedekatan Allah itu baik bagiku
  alternative: mendekat kepada Allah itu baik bagiku
  rationale: Teks memakai nomina yang secara gramatikal tidak menentukan secara tegas arah relasi tersebut. Terjemahan utama mempertahankan ketegangan antara Allah yang dekat dan manusia yang dekat kepada Allah; alternatif yang lebih verbal dicatat dalam catatan kaki.
- issue: Penerjemahan אֲדֹנָי יְהוִה
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH
  rationale: Bentuk Ibrani memadukan gelar אֲדֹנָי dengan nama perjanjian יהוה. “Tuhan Yahweh” mempertahankan kedua unsur itu tanpa menghasilkan pengulangan “Tuhan TUHAN”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Struktur dibuat mudah dipahami pembaca umum, sementara bentuk nominal dan ambiguitas relasional teks Ibrani dipertahankan. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan editorial Indonesia.
