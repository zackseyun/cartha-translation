translation:
  language: id
  text: Mereka mengarahkan mulut mereka melawan langit[a], dan lidah mereka berjalan-jalan di bumi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di langit.” Preposisi Ibrani secara harfiah berarti “di/dalam,” tetapi konteksnya menunjukkan perkataan penuh tantangan yang diarahkan ke langit.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “lidah mereka berjalan di bumi.” Verba Ibrani secara harfiah berarti “berjalan/pergi”; “berjalan-jalan” mempertahankan personifikasi puitis serta gerak yang meluas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתּוּ
  choice: mengarahkan
  rationale: Kata ini pada dasarnya berarti ‘menaruh/menempatkan’. Bersama ‘mulut’ dan keterangan arah, ‘mengarahkan’ menghasilkan ungkapan Indonesia yang alami tanpa menjadikan verba itu sendiri lebih bermusuhan daripada teks sumber.
- source_word: בַשָּׁמַיִם
  choice: melawan langit
  rationale: Preposisi ב secara harfiah dapat diterjemahkan ‘di’, tetapi dalam konteks ini ungkapan tersebut menggambarkan perkataan angkuh yang menentang surga. ‘Langit’ wajar dalam bahasa Indonesia dan dapat mencakup bentuk jamak Ibrani sebagai keseluruhan bentangan surgawi.
- source_word: פִּיהֶם
  choice: mulut mereka
  rationale: Bentuk tunggal Ibrani berfungsi secara kolektif bagi kelompok itu. Bentuk tunggal tetap alami dalam ungkapan puitis Indonesia dan mempertahankan kesejajaran dengan ‘lidah mereka’.
- source_word: וּלְשׁוֹנָם
  choice: dan lidah mereka
  rationale: Bentuk tunggal kolektif dipertahankan untuk menjaga citra puitis dan paralelisme dengan ‘mulut mereka’.
- source_word: תִּהֲלַךְ
  choice: berkeliaran
  rationale: Verba הלך berarti ‘berjalan/pergi’. Dalam konteks perkataan yang angkuh dan tak terkendali, ‘berkeliaran’ menyampaikan gerak luas serta bebas tanpa memasukkan penafsiran doktrinal.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: ‘Bumi’ mempertahankan kontras kosmis dengan ‘langit’. Preposisi diterjemahkan ‘di’, yang alami dengan verba ‘berkeliaran’ dan dekat dengan bentuk Ibrani.
theological_decisions:
- issue: Arah atau lokasi perkataan terhadap langit
  choice: melawan langit
  alternative: di langit
  rationale: Konteks mazmur mendukung nuansa perkataan yang menantang surga, tetapi arti preposisi yang lebih harfiah tetap dicatat agar ambiguitas bahasa sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. ‘Mengarahkan mulut’ mempertahankan citra konkret Ibrani, sedangkan ‘berkeliaran’ memberi kelancaran alami sekaligus menjaga personifikasi lidah.
