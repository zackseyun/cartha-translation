  text: 'Lihatlah, inilah orang-orang fasik: mereka selalu hidup tenteram[a] dan makin kaya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aman selamanya” atau “hidup tenteram selamanya.” Frasa Ibraninya secara harfiah berarti “tenteram/aman untuk selama-lamanya,” suatu ungkapan tentang kemakmuran atau keamanan yang terus berlangsung.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah memperoleh kekayaan” atau “telah menambah harta.” Kata kerjanya dapat menekankan pencapaian, perolehan, ataupun pertambahan milik.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel penunjuk ini memberi penekanan dan mengajak pembaca memperhatikan kesimpulan pemazmur; “Lihatlah” alami dalam bahasa Indonesia modern.
- source_word: אֵלֶּה
  choice: begitulah
  rationale: Demonstratif ini menunjuk kembali kepada orang-orang yang baru digambarkan. Dalam kalimat simpulan bahasa Indonesia, “begitulah” lebih alami daripada terjemahan kaku “inilah mereka”.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Menunjukkan golongan orang yang secara moral bersalah; “orang-orang fasik” mempertahankan kategori khas sastra Mazmur tanpa mempersempitnya menjadi sekadar pelaku kejahatan tertentu.
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: mereka selalu hidup tenteram
  rationale: Ungkapan konstruksi ini secara harfiah menggabungkan keadaan tenteram/aman dengan kelanggengan. Pilihan ini menyampaikan kemakmuran dan ketenteraman yang tampaknya terus berlangsung tanpa menjadikannya pernyataan metafisik tentang kekekalan.
- source_word: הִשְׂגּוּ
  choice: makin
  rationale: Bentuk verba dapat menyatakan mencapai, memperoleh, atau bertambah. Bersama חָיִל dalam konteks kemakmuran, “makin” secara ringkas menyampaikan pertambahan atau penumpukan kekayaan.
- source_word: חָיִל
  choice: kaya
  rationale: Walaupun kata ini dapat berarti kekuatan, kemampuan, pasukan, atau harta, konteks iri terhadap kemakmuran orang fasik mendukung arti ekonomis. Bentuk predikatif “kaya” menghasilkan bahasa Indonesia yang wajar.
