  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: id
  text: Dagingku dan hatiku dapat melemah[a], tetapi Allah adalah batu karang hatiku[b] dan bagianku untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dagingku dan hatiku melemah,” atau “Dagingku dan hatiku habis lenyap.” Kata kerja Ibrani dapat menyatakan keadaan sekarang atau, secara lebih umum, menjadi habis, merana, atau berakhir.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kekuatan hatiku.” Secara lebih harfiah, bahasa Ibraninya berbunyi “batu karang hatiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: dapat melemah
  rationale: Kata kerja ini menyatakan keadaan menjadi habis, merana, atau gagal bertahan. Dalam pasangan “daging dan hati,” “dapat melemah” terdengar alami dalam bahasa Indonesia sekaligus mempertahankan cakupan umum dan kemungkinan yang terkandung dalam konteks.
- source_word: שְׁאֵרִי
  choice: dagingku
  rationale: Di sini kata tersebut menunjuk pada keberadaan jasmani pemazmur karena dipasangkan dengan “hatiku.” “Dagingku” mempertahankan gambaran konkret dan corak puitis Ibrani.
- source_word: לְבָבִי
  choice: hatiku
  rationale: Kata ini mencakup batin, pikiran, dan kehendak. “Hatiku” merupakan padanan Indonesia yang transparan dan memungkinkan pengulangannya tetap berfungsi sebagai penekanan puitis.
- source_word: צוּר
  choice: batu karang
  rationale: Makna konkretnya adalah batu besar atau batu karang, yang ketika dikenakan kepada Allah menggambarkan keteguhan dan keamanan. Metafora sumber dipertahankan dan tidak langsung diabstraksikan menjadi “kekuatan.”
- source_word: חֶלְקִי
  choice: bagianku
  rationale: Kata ini menggambarkan Allah sebagai bagian atau jatah yang menjadi milik pemazmur. “Bagianku” mempertahankan metafora tersebut tanpa menambahkan gagasan warisan yang tidak dinyatakan secara eksplisit.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini kata tersebut menunjuk kepada Allah Israel; “Allah” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. “Untuk selama-lamanya” jelas, puitis, dan sesuai dengan ragam mazmur.
theological_decisions:
- issue: Bahasa antropologis pada klausa pembuka
  choice: Daging dan hatiku dapat melemah
  alternative: Tubuh dan batinku dapat melemah; Daging dan hatiku habis lenyap
  rationale: Pilihan ini mempertahankan pasangan jasmani-batiniah dalam bahasa sumber tanpa mereduksinya menjadi kategori psikologis modern. Kata “dapat” menjaga keluasan aspek verba, yang dapat dibaca sebagai kemungkinan, pengalaman kini, atau kenyataan umum.
- issue: Metafora Allah sebagai צוּר
  choice: Allah adalah batu karang hatiku
  alternative: Allah adalah kekuatan hatiku
  rationale: Teks Ibrani memakai metafora konkret “batu karang.” Mempertahankannya menyampaikan keteguhan, keamanan, dan keandalan Allah tanpa membatasi gambaran itu hanya pada kekuatan.
- issue: Hubungan kontras antarklausa
  choice: tetapi
  alternative: dan
  rationale: Waw secara bentuk dapat berarti “dan,” tetapi hubungan makna di sini jelas mengontraskan kelemahan manusia dengan keteguhan Allah. “Tetapi” menyatakan hubungan wacana tersebut secara alami tanpa mengubah isi klausa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Pengulangan “hatiku” dan metafora “batu karang” dipertahankan untuk menjaga susunan serta daya ungkap teks Ibrani.
