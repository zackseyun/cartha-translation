id: PSA.73.1
reference: Psalms 73:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/001.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
translation:
  language: id
  text: 'Mazmur Asaf.[a]


    Sesungguhnya Allah baik kepada Israel, kepada orang-orang yang hatinya murni.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mazmur milik Asaf” atau “Mazmur untuk Asaf.”'
    reason: Kata depan Ibrani pada nama Asaf dapat menyatakan kepunyaan, hubungan, pengarang, atau peruntukan.
  - marker: b
    text: Frasa “kepada orang-orang yang hatinya murni” dapat dipahami sebagai penjelasan tentang Israel, tetapi juga dapat dibaca sebagai frasa sejajar.
    reason: Hubungan sintaksis antara kedua frasa dengan kata depan yang sama tidak dinyatakan secara eksplisit.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku dan tepat untuk jenis nyanyian dalam judul mazmur.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Bentuk ringkas "Mazmur Asaf" lazim dalam bahasa Indonesia dan tidak memaksakan apakah לְ menyatakan pengarang, kepunyaan, hubungan, atau peruntukan; alternatif eksplisit dicatat dalam catatan kaki.
- source_word: אַךְ
  choice: Sesungguhnya
  rationale: Di sini berfungsi sebagai penegasan yang membuka pokok utama mazmur; "sesungguhnya" menyampaikan afirmasi kuat tanpa memberinya nuansa pembatasan yang tidak pasti.
- source_word: טוֹב
  choice: baik
  rationale: Mempertahankan keluasan makna yang dapat mencakup sifat Allah dan tindakan-Nya yang penuh kebaikan.
- source_word: לְיִשְׂרָאֵל
  choice: kepada Israel
  rationale: Ungkapan "baik kepada" alami dalam bahasa Indonesia dan menyatakan hubungan atau manfaat yang ditandai oleh לְ.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk tunggal ini menunjuk kepada Allah Israel; "Allah" merupakan padanan Indonesia yang langsung dan baku.
- source_word: לְבָרֵי לֵבָב
  choice: kepada orang-orang yang hatinya murni
  rationale: Menyampaikan kemurnian batin secara alami. Pengulangan "kepada" mempertahankan kesejajaran kedua frasa לְ sekaligus membiarkan hubungan sintaksisnya tetap cukup terbuka.
theological_decisions:
- issue: Hubungan antara "Israel" dan "orang-orang yang hatinya murni"
  choice: Kedua frasa dipertahankan berdampingan dengan koma dan pengulangan "kepada", sehingga frasa kedua dapat dibaca sebagai penjelasan atau pengkhususan Israel.
  alternative: 'Membacanya sebagai dua kelompok yang sejajar: Israel dan, secara terpisah, orang-orang yang hatinya murni.'
  rationale: Puisi Ibrani mendukung pembacaan aposisional atau spesifikatif, tetapi bentuknya tidak menutup sepenuhnya pembacaan koordinatif. Terjemahan tidak menambahkan "yakni" atau "dan", sehingga ketegangan itu tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Diksi sederhana dipilih agar mudah dipahami, sementara susunan puitis dan ambiguitas hubungan antardua frasa terakhir tetap dipertahankan.
