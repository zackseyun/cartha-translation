  text: And they say[b][a], “How does God know? Is there knowledge in the Most High?”
translation:
  language: id
  text: Mereka berkata, “Bagaimana Allah tahu? Adakah pengetahuan pada Yang Mahatinggi?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Secara harfiah, “di dalam Yang Mahatinggi”; ungkapan ini menanyakan apakah Yang Mahatinggi mempunyai pengetahuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Mereka berkata
  rationale: Bentuk perfek Ibrani dalam uraian puitis ini dapat menggambarkan ucapan yang menjadi kebiasaan. Bentuk kini bahasa Indonesia, “berkata,” mempertahankan gambaran sikap yang berlangsung tanpa menutup kemungkinan makna lampau.
- source_word: אֵיכָה
  choice: Bagaimana
  rationale: Kata tanya ini berarti “bagaimana?” Terjemahan langsung mempertahankan ketajaman pertanyaan retoris tanpa menambahkan unsur modal seperti “mungkin” yang tidak dinyatakan secara eksplisit.
- source_word: יָדַע
  choice: tahu
  rationale: Kata kerja ini menyatakan tindakan mengetahui. “Tahu” merupakan padanan alami dan langsung dalam bahasa Indonesia serta menjaga kaitannya dengan kata benda “pengetahuan” pada baris berikutnya.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini merupakan sebutan umum bagi Allah, bukan nama diri “El”; “Allah” adalah padanan baku dan wajar dalam bahasa Indonesia.
- source_word: וְיֵשׁ
  choice: Adakah
  rationale: Partikel eksistensial diterjemahkan sebagai pertanyaan “Adakah ...?”, sesuai dengan struktur retoris Ibrani dan register puitis yang tetap mudah dipahami.
- source_word: דֵּעָה
  choice: pengetahuan
  rationale: Kata benda ini berarti pengetahuan atau pemahaman. “Pengetahuan” menjaga hubungan leksikal dengan “tahu” dalam pertanyaan sebelumnya.
- source_word: בְעֶלְיוֹן
  choice: pada Yang Mahatinggi
  rationale: עֶלְיוֹן adalah gelar ilahi “Yang Mahatinggi.” Preposisi בְ diterjemahkan secara wajar sebagai “pada,” sehingga pertanyaan itu menyatakan apakah pengetahuan terdapat atau dimiliki oleh Yang Mahatinggi tanpa mengubahnya menjadi pernyataan yang lebih interpretatif.
theological_decisions:
- issue: Penerjemahan gelar ilahi עֶלְיוֹן
  choice: Yang Mahatinggi
  alternative: Yang Maha Tinggi; Yang Tertinggi
  rationale: “Yang Mahatinggi” adalah gelar ilahi baku yang menekankan keunggulan dan kedaulatan Allah, tanpa memasukkan penafsiran teologis tambahan.
- issue: Bentuk pertanyaan tentang pengetahuan Allah
  choice: Adakah pengetahuan pada Yang Mahatinggi?
  alternative: Apakah Yang Mahatinggi memiliki pengetahuan?
  rationale: Pilihan ini mempertahankan bentuk eksistensial dan preposisi teks Ibrani. Alternatifnya lebih idiomatis, tetapi sedikit memperjelas relasi sebagai kepemilikan yang dalam teks sumber tetap dinyatakan secara lebih terbuka.
translation_notes:
  register: Bahasa Indonesia modern dengan register puitis yang bermartabat. “Adakah” dipilih untuk mencerminkan pertanyaan eksistensial Ibrani, sedangkan “pada Yang Mahatinggi” mempertahankan bentuk sumber sekaligus tetap dapat dipahami pembaca umum.
