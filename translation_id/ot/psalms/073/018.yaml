id: PSA.73.18
reference: Psalms 73:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֣ךְ בַּ֭/חֲלָקוֹת תָּשִׁ֣ית לָ֑/מוֹ הִ֝פַּלְתָּ֗/ם לְ/מַשּׁוּאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/018.yaml
  text: Surely you set them in slippery places[b][a]; you cast them down to ruin.
translation:
  language: id
  text: Sungguh, Engkau menempatkan mereka di tempat-tempat yang licin[a]; Engkau menjatuhkan mereka ke dalam kehancuran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di atas tanah yang licin”; secara harfiah, “di tempat-tempat yang mulus.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ke dalam keruntuhan” atau “ke dalam tempat-tempat yang porak-poranda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini menyatakan penegasan kuat dalam kesadaran pemazmur, bukan pembatasan seperti “hanya”.
- source_word: בַּחֲלָקוֹת
  choice: di tempat-tempat yang licin
  rationale: Secara harfiah berarti “di tempat-tempat yang mulus/licin”; dalam konteks kejatuhan, ungkapan ini menggambarkan pijakan yang berbahaya dan tidak mantap.
- source_word: תָּשִׁית לָמוֹ
  choice: Engkau menempatkan mereka
  rationale: Kata kerja שׁית berarti menaruh atau menempatkan. Bentuk orang kedua tunggal mempertahankan sapaan langsung kepada Allah, sedangkan לָמוֹ menunjuk kepada mereka.
- source_word: הִפַּלְתָּם
  choice: Engkau menjatuhkan mereka
  rationale: Bentuk kausatif dari נפל menyatakan tindakan menyebabkan mereka jatuh. “Menjatuhkan” menyampaikan daya kausatif itu secara alami dan langsung dalam bahasa Indonesia.
- source_word: לְמַשּׁוּאוֹת
  choice: ke dalam kehancuran
  rationale: Nomina jamak ini menunjuk pada kehancuran, keruntuhan, atau keadaan porak-poranda. “Ke dalam kehancuran” alami dalam bahasa Indonesia dan mempertahankan arah menuju akibat yang menghancurkan.
theological_decisions:
- issue: Peran langsung Allah dalam kejatuhan orang fasik
  choice: 'Kedua tindakan diterjemahkan dengan Allah sebagai pelaku langsung: “Engkau menempatkan” dan “Engkau menjatuhkan.”'
  alternative: Merumuskan kejatuhan sebagai akibat keadaan berbahaya tanpa menonjolkan tindakan langsung Allah.
  rationale: Kedua verba Ibrani berbentuk orang kedua tunggal dan ditujukan kepada Allah. Terjemahan tidak melunakkan atribusi penghakiman langsung kepada-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada “Engkau” mengikuti kebiasaan penghormatan dalam teks Alkitab Indonesia. Kesejajaran dua klausa dan tindakan ilahi yang langsung dipertahankan.
