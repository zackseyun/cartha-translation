translation:
  language: id
  text: Mereka mencemooh dan berbicara dengan jahat[a]; dari tempat tinggi mereka mengucapkan kata-kata penindasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka mengejek dan berbicara jahat; dengan angkuh mereka mengucapkan kata-kata penindasan.” Kata kerja pembuka dalam bahasa Ibrani sulit dipastikan artinya. Ungkapan “dari tempat tinggi” juga dapat menunjukkan cara bicara yang angkuh, bukan kedudukan atau lokasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  choice: mencemooh
  rationale: Bentuk Hifil ini sulit dan dipahami secara beragam. Dalam konteks perkataan orang fasik yang congkak, “mencemooh” secara wajar menyampaikan penghinaan yang merendahkan tanpa memilih tafsiran yang lebih spekulatif seperti “menjadi bejat”.
- source_word: וִידַבְּרוּ בְרָע
  choice: dan berbicara dengan niat jahat
  rationale: Frasa בְרָע dapat menerangkan cara atau isi perkataan. “Dengan niat jahat” merupakan ungkapan Indonesia yang alami dan mempertahankan unsur keburukan serta permusuhan dalam ucapan mereka.
- source_word: עֹשֶׁק
  choice: kata-kata penindasan
  rationale: Kata benda ini menunjuk pada penindasan atau pemerasan. Penambahan “kata-kata” membuat hubungannya dengan verba “mengucapkan” alami dalam bahasa Indonesia, tanpa mempersempit maknanya menjadi pemerasan finansial saja.
- source_word: מִמָּרוֹם
  choice: dari tempat tinggi
  rationale: Secara harfiah berarti “dari ketinggian/tempat tinggi.” Terjemahan ini mempertahankan citra Ibrani dan membiarkan catatan kaki menjelaskan kemungkinan bahwa frasa tersebut menggambarkan sikap bicara yang angkuh.
- source_word: יְדַבֵּרוּ
  choice: mereka mengucapkan
  rationale: Pengulangan verba berbicara dipertahankan secara semantis, sedangkan “mengucapkan” dipilih agar konstruksi dengan “kata-kata penindasan” terdengar alami.
