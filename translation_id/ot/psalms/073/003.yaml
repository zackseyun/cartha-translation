lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai alasan bagi pernyataan sebelumnya dan mempertahankan nuansa kausal teks Ibrani.
- source_word: קִנֵּאתִי
  choice: aku iri
  rationale: Mengungkapkan rasa iri terhadap keadaan orang lain secara alami dalam bahasa Indonesia; 'cemburu' dapat menyiratkan relasi posesif.
- source_word: בַּהוֹלְלִים
  choice: kepada orang-orang sombong
  rationale: Menangkap sikap angkuh atau suka membanggakan diri yang terkandung dalam הוֹלְלִים, dengan ungkapan yang jelas bagi pembaca modern.
- source_word: שְׁלוֹם
  choice: kedamaian
  rationale: Mempertahankan padanan langsung bagi שָׁלוֹם, sambil membiarkan catatan kaki menjelaskan nuansa kesejahteraan dan hidup tenteram dalam konteks ini.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Padanan baku dalam konteks mazmur dan sastra hikmat untuk kategori moral orang yang menentang jalan benar.
- source_word: אֶרְאֶה
  choice: ketika kulihat
  rationale: Bentuk ini menyatakan keadaan yang dilihat pemazmur sebagai pemicu rasa irinya; hubungan temporal dibuat alami tanpa mengubah maksud.
