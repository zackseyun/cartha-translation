  yaml_path: translation/ot/psalms/073/023.yaml
  text: Yet I am continually with you[a]; you have held my right hand.
translation:
  language: id
  text: Namun aku senantiasa bersama-Mu; Engkau telah memegang tangan kananku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Engkau telah menggenggam tangan kananku.” Verba Ibrani dapat menekankan tindakan menggenggam maupun dukungan yang dihasilkannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Kata sambung dan pronomina ini menyatakan kontras dengan kebingungan pemazmur sebelumnya; “Namun aku” menyampaikan daya adversatifnya secara wajar.
- source_word: תָמִיד
  choice: senantiasa
  rationale: Kata ini menunjukkan keberlangsungan yang terus-menerus; “senantiasa” alami, bermartabat, dan sesuai dengan nada reflektif mazmur.
- source_word: עִמָּךְ
  choice: bersama-Mu
  rationale: Preposisi עִם dengan sufiks orang kedua menyatakan kebersamaan atau kedekatan; “bersama-Mu” merupakan padanan langsung dan alami.
- source_word: אָחַזְתָּ
  choice: Engkau telah memegang
  rationale: Verba אָחַז berarti menggenggam atau memegang. Bentuk perfek dapat menunjuk tindakan yang telah terjadi dengan dampak yang masih berlangsung; “telah memegang” mempertahankan nuansa itu.
- source_word: בְּיַד יְמִינִי
  choice: tangan kananku
  rationale: Dengan verba אָחַז, frasa ini menunjuk bagian yang dipegang. Susunan idiomatis bahasa Indonesia menyerap preposisinya ke dalam konstruksi “memegang tangan kananku” dan mempertahankan gambaran konkret tangan kanan.
theological_decisions:
- issue: Aspek dan nuansa dukungan ilahi dalam verba perfek
  choice: Engkau telah memegang tangan kananku
  alternative: Engkau memegang tangan kananku; Engkau menggenggam tangan kananku
  rationale: Bentuk perfek Ibrani dapat menggambarkan tindakan yang telah terjadi tetapi tetap bermakna pada masa kini. Terjemahan ini mempertahankan hubungan antara tindakan Allah dan dukungan-Nya yang berkelanjutan tanpa membatasinya hanya pada masa lampau atau masa kini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti konvensi umum Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
