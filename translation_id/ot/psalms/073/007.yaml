  register: Bahasa Indonesia modern yang puitis dan bermartabat. Gambaran jasmani yang tajam dipertahankan, sedangkan pengulangan pada 'meluap-luap' dipakai secara idiomatis untuk menyatakan keadaan yang melampaui batas.
