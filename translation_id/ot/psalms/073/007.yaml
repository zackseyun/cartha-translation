source:
  edition: WLC
  text: יָ֭צָא מֵ/חֵ֣לֶב עֵינֵ֑/מוֹ עָ֝בְר֗וּ מַשְׂכִּיּ֥וֹת לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/007.yaml
  text: Their eyes bulge out from fatness[a]; the imaginations of their heart overflow.
translation:
  language: id
  text: Mata mereka menonjol karena kegemukan[a]; angan-angan hati mereka meluap-luap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mata mereka menonjol dari lemak; angan-angan hati mereka melampaui batas.”'
    reason: Alternatif ini mempertahankan secara lebih harfiah makna 'dari lemak' dan 'melampaui' serta ketaksaan gambaran puitis Ibrani.
lexical_decisions:
- source_word: יָצָא
  choice: menonjol
  rationale: Secara harfiah berarti 'keluar', tetapi bersama 'mata' ungkapan ini menggambarkan mata yang tampak menonjol; pilihan ini mempertahankan gambaran jasmani secara wajar dalam bahasa Indonesia.
- source_word: מֵחֵלֶב
  choice: karena kegemukan
  rationale: חֵלֶב secara konkret berarti 'lemak'. Dalam konteks ini, frasa tersebut menggambarkan kegemukan akibat kemakmuran berlebihan tanpa mereduksinya menjadi sekadar kekayaan.
- source_word: עֵינֵמוֹ
  choice: mata mereka
  rationale: Bentuk jamak dengan sufiks orang ketiga jamak diterjemahkan langsung dan alami.
- source_word: עָבְרוּ
  choice: meluap-luap
  rationale: Kata kerja dasarnya berarti 'melewati' atau 'melampaui'. Di sini bentuk ini menyatakan sesuatu yang melampaui batas; 'meluap-luap' menyampaikan kelimpahan berlebihan dan menjaga kesejajaran puitis.
- source_word: מַשְׂכִּיּוֹת
  choice: angan-angan
  rationale: Nomina ini dapat menunjuk pada gambaran, rancangan, atau bayangan batin. 'Angan-angan' mempertahankan makna konsepsi batin tanpa mempersempitnya menjadi pikiran biasa, berhala, atau rencana jahat.
- source_word: לֵבָב
  choice: hati mereka
  rationale: Walaupun nomina Ibrani berbentuk tunggal dan tidak memiliki sufiks tersendiri, konteks mengaitkannya dengan orang-orang fasik yang sedang dibicarakan. Bahasa Indonesia alami menggunakan 'hati mereka'.
theological_decisions: []
