  text: כַּ/חֲל֥וֹם מֵ/הָקִ֑יץ אֲ֝דֹנָ/י בָּ/עִ֤יר צַלְמָ֬/ם תִּבְזֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
translation:
  language: id
  text: Seperti mimpi ketika orang terbangun, ya Tuhan, ketika Engkau bangkit[a], Engkau akan memandang hina bayangan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meski kurang mungkin, “di kota Engkau akan memandang hina bayangan mereka.” Konsonan Ibrani dapat dibaca demikian, tetapi konteks sangat mendukung arti “ketika Engkau bangkit/terjaga.”
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Seperti mimpi
  rationale: Prefiks כַּ menandai perbandingan, sedangkan חֲלוֹם berarti “mimpi”; ungkapan ini mempertahankan simile secara alami.
- source_word: מֵהָקִיץ
  choice: ketika orang terbangun
  rationale: Berasal dari akar yang berarti “bangun/terjaga”; prefiks מֵ־ dapat menyatakan waktu. Bentuk umum “orang” sesuai dengan gambaran mimpi yang lenyap saat seseorang terbangun.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: Gelar ilahi ini digunakan sebagai sapaan langsung; partikel “ya” membuat fungsi vokatifnya jelas dan wajar dalam bahasa Indonesia.
- source_word: בָּעִיר
  choice: ketika Engkau bangkit
  rationale: Dalam konteks, bentuk ini paling mungkin dipahami secara verbal dari עור, “bangkit/terjaga,” dan berpadanan dengan tindakan terbangun pada baris sebelumnya. Pembacaan nominal “di kota” tetap dicatat dalam catatan kaki.
- source_word: צַלְמָם
  choice: bayangan mereka
  rationale: צֶלֶם dapat berarti “gambar, rupa, bayangan.” Dalam konteks kefanaan orang fasik dan perbandingan dengan mimpi, “bayangan” menyampaikan wujud yang tidak kukuh tanpa menghilangkan bahasa figuratif.
- source_word: תִּבְזֶה
  choice: Engkau akan memandang hina
  rationale: Kata kerja בזה berarti “menghina, memandang rendah.” Bentuk imperfek dipahami bernuansa mendatang sehubungan dengan saat Tuhan bangkit untuk bertindak.
theological_decisions:
- issue: Penafsiran בָּעִיר
  choice: 'Pembacaan verbal: “ketika Engkau bangkit”'
  alternative: 'Pembacaan lokatif: “di kota”'
  rationale: Perbandingan langsung dengan bangun dari mimpi dan kesejajaran puitis sangat mendukung pembacaan verbal. Namun, karena konsonan Ibrani memungkinkan pembacaan “di kota,” alternatif itu dipertahankan dalam catatan kaki.
- issue: Makna צַלְמָם
  choice: “bayangan mereka”
  alternative: “gambar mereka” atau “rupa mereka”
  rationale: “Bayangan” selaras dengan konteks mimpi dan kefanaan kemakmuran orang fasik, tetapi tetap mempertahankan ketidakpastian mengenai apakah yang dimaksud ialah rupa, penampakan, atau citra mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Engkau” dipakai untuk sapaan kepada Tuhan. Susunan puitis dan hubungan antara mimpi, terbangun, serta tindakan Tuhan dipertahankan.
