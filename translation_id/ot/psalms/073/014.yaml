  text: For I was afflicted all day long[b][a], and chastened every morning.
translation:
  language: id
  text: Sebab sepanjang hari aku tertimpa penderitaan[a], dan setiap pagi aku mendapat teguran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terpukul” atau “tertimpa tulah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dan teguran/koreksiku [ada] pada pagi-pagi”; maksudnya teguran atau disiplin yang berulang setiap pagi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי נָגוּעַ
  choice: aku tertimpa penderitaan
  rationale: Bentuk ini menyatakan keadaan sebagai orang yang terkena pukulan atau penderitaan. Ungkapan Indonesia ini alami dan tidak mempersempit maknanya menjadi penyakit tertentu.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini menekankan bahwa penderitaan berlangsung sepanjang hari.
- source_word: וְתוֹכַחְתִּי
  choice: dan ... aku mendapat teguran
  rationale: Secara harfiah berarti ‘dan teguranku/koreksiku’. Bentuk verbal dalam bahasa Indonesia menyampaikan pengalaman menerima koreksi dengan wajar, sekaligus mempertahankan cakupan makna yang dapat mencakup disiplin, bukan hanya ucapan.
- source_word: לַבְּקָרִים
  choice: setiap pagi
  rationale: Bentuk jamak ‘pagi-pagi’ dengan preposisi berfungsi distributif dan menunjukkan kejadian yang berulang.
theological_decisions:
- issue: Sifat penderitaan pemazmur
  choice: Bahasa umum tentang penderitaan dan teguran tanpa menentukan penyakit atau murka penghukuman
  alternative: Penyakit seperti tulah, hukuman fisik, atau teguran yang semata-mata lisan
  rationale: Kedua istilah Ibrani cukup luas. Terjemahan mempertahankan ketegangan antara penderitaan dan disiplin tanpa menjelaskan penyebab atau bentuknya secara lebih khusus daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. ‘Tertimpa penderitaan’ dipilih agar mudah dipahami tanpa membatasi penderitaan pada penyakit; ‘mendapat teguran’ mempertahankan kemungkinan makna koreksi atau disiplin.
