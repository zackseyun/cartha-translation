  text: מִי לִ֥/י בַ/שָּׁמָ֑יִם וְ֝/עִמְּ/ךָ֗ לֹא חָפַ֥צְתִּי בָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/025.yaml
  text: Whom have I in heaven but you? And besides you[a], I desire nothing on earth.
translation:
  language: id
  text: Siapakah yang kumiliki di surga selain Engkau? Selain Engkau[a], tidak ada yang kuinginkan di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Dan bersama Engkau aku tidak menginginkan apa pun di bumi.” Ungkapan Ibraninya eliptis; maksudnya ialah bahwa di luar Allah, pemazmur tidak menginginkan apa pun di bumi.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לִי
  choice: Siapakah yang kumiliki
  rationale: Ungkapan harfiahnya berarti “siapa bagiku/untukku,” tetapi dalam konteks ini menyatakan hubungan kepemilikan atau keberadaan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan pertanyaan retoris pemazmur.
- source_word: בַשָּׁמָיִם
  choice: di surga
  rationale: Bentuk Ibrani yang secara tata bahasa jamak menunjuk pada ranah surgawi; “di surga” merupakan padanan Indonesia yang alami dan membentuk kontras dengan “di bumi.”
- source_word: וְעִמְּךָ
  choice: Selain Engkau
  rationale: 'Secara harfiah berarti “dan bersama Engkau.” Dalam paralelisme puitis ini, ungkapan tersebut menyampaikan eksklusivitas: tidak ada sesuatu di bumi yang diinginkan pemazmur di samping Allah. Catatan kaki mempertahankan bentuk harfiah dan ambiguitas sintaksisnya.'
- source_word: לֹא חָפַצְתִּי
  choice: tidak ada yang kuinginkan
  rationale: Kata kerja חפץ dapat berarti menginginkan, menyukai, atau berkenan kepada. Dalam konteks ini “kuinginkan” menangkap arah kehendak pemazmur, sedangkan bentuk negatifnya diungkapkan secara idiomatis sebagai “tidak ada yang.” Bentuk perfektif dipahami sebagai sikap yang telah menetap dan masih berlaku.
- source_word: בָאָרֶץ
  choice: di bumi
  rationale: Menunjuk pada ranah duniawi sebagai pasangan yang berlawanan dengan surga; “di bumi” adalah ungkapan Indonesia yang jelas dan alami.
theological_decisions:
- issue: Makna klausa kedua yang eliptis
  choice: Keinginan eksklusif kepada Allah melebihi segala sesuatu di bumi
  alternative: “Bersama Engkau, aku tidak menginginkan apa pun di bumi”
  rationale: Susunan Ibraninya ringkas dan dapat dipahami secara lebih harfiah sebagai “bersama Engkau.” Terjemahan utama menyatakan daya eksklusif paralelisme tanpa menjadikannya klaim metafisis yang melampaui teks, sedangkan catatan kaki mempertahankan kemungkinan pembacaan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. “Kumiliki” dan “kuinginkan” mudah dipahami pembaca umum. Huruf kapital pada “Engkau” menandai sapaan kepada Allah sesuai kelaziman penulisan keagamaan Indonesia.
