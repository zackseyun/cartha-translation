  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַד אָ֭בוֹא אֶל מִקְדְּשֵׁי אֵ֑ל אָ֝בִ֗ינָה לְ/אַחֲרִיתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/017.yaml
  text: until I entered the sanctuaries of God[b][a]; then I understood their end.
translation:
  language: id
  text: sampai aku masuk ke tempat-tempat kudus Allah[a]; barulah aku memahami kesudahan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tempat kudus Allah." Bahasa Ibrani memakai bentuk jamak, "tempat-tempat kudus," yang dapat merujuk secara kolektif pada seluruh kawasan kudus Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau "nasib akhir mereka" atau "hasil akhir mereka." Ungkapan Ibrani menunjuk pada kesudahan atau hasil terakhir mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: sampai
  rationale: Menandai batas waktu kebingungan pemazmur dan mengantar pada titik balik dalam pemahamannya.
- source_word: אָבוֹא
  choice: aku masuk
  rationale: Dalam konstruksi dengan עַד, bentuk ini menunjuk pada saat pemazmur memasuki ruang kudus; bentuk lampau dipahami secara alami dari konteks naratif.
- source_word: אֶל
  choice: ke
  rationale: Bersama verba 'masuk', frasa 'masuk ke' merupakan ungkapan Indonesia yang alami untuk gerak menuju dan memasuki suatu tempat.
- source_word: מִקְדְּשֵׁי אֵל
  choice: tempat-tempat kudus Allah
  rationale: Nomina Ibrani berbentuk jamak konstruksi. Bentuk jamak dipertahankan secara transparan dan dapat dipahami sebagai kawasan-kawasan suci atau keseluruhan lingkungan kudus milik Allah.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל adalah sebutan bagi Tuhan dan paling wajar diterjemahkan 'Allah' dalam bahasa Indonesia.
- source_word: אָבִינָה
  choice: barulah aku memahami
  rationale: Verba dari בין menyatakan memperoleh pengertian atau daya membedakan. 'Barulah' mengungkapkan urutan sekaligus titik balik yang tersirat oleh susunan klausa.
- source_word: לְאַחֲרִיתָם
  choice: kesudahan mereka
  rationale: אַחֲרִית menunjuk pada akhir, nasib terakhir, atau hasil akhir. 'Kesudahan mereka' ringkas, bermartabat, dan mempertahankan tekanan pada nasib akhir tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: Apakah bentuk jamak מִקְדְּשֵׁי perlu dipertahankan atau dijadikan bentuk tunggal tradisional
  choice: tempat-tempat kudus Allah
  alternative: tempat kudus Allah
  rationale: Bentuk jamak dalam teks Ibrani dipertahankan sesuai prioritas sumber asli. Bentuk ini dapat merujuk secara kolektif pada kawasan kudus Allah dan tidak perlu dipersempit menjadi penafsiran doktrinal tertentu.
- issue: Cakupan makna לְאַחֲרִיתָם
  choice: kesudahan mereka
  alternative: nasib akhir mereka; hasil akhir mereka
  rationale: Terjemahan ini mempertahankan ketegangan antara akhir kehidupan, nasib terakhir, dan hasil akhir tindakan orang fasik, tanpa menetapkan salah satunya secara eksklusif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk jamak sumber dipertahankan, sedangkan 'barulah' menyampaikan titik balik pemahaman secara alami.
