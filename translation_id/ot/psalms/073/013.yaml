source:
  edition: WLC
  text: אַךְ רִ֭יק זִכִּ֣יתִי לְבָבִ֑/י וָ/אֶרְחַ֖ץ בְּ/נִקָּי֣וֹן כַּפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/013.yaml
  text: Surely in vain I have kept my heart pure[b][a], and washed my hands in innocence.
translation:
  language: id
  text: Sungguh, sia-sia aku menjaga hatiku tetap murni[a] dan membasuh tanganku dalam ketidakbersalahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memurnikan hatiku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membasuh tanganku dalam kebersihan”; gambaran ini menyatakan ketidakbersalahan atau kemurnian moral, bukan sekadar mencuci tangan secara jasmani.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini memberi penegasan pada kesimpulan getir pemazmur; “Sungguh” menyampaikan daya reflektif dan emfatisnya secara alami.
- source_word: רִיק
  choice: sia-sia
  rationale: Kata ini menyatakan tindakan yang tampaknya tidak menghasilkan manfaat atau tujuan; “sia-sia” merupakan padanan Indonesia yang idiomatis.
- source_word: זִכִּיתִי
  choice: aku menjaga ... tetap murni
  rationale: Bentuk verba ini dapat menunjuk pada memurnikan atau mempertahankan kemurnian. Bersama objek “hatiku,” ungkapan ini alami dan mempertahankan makna moralnya.
- source_word: לְבָבִי
  choice: hatiku
  rationale: “Hati” mempertahankan gambaran puitis Ibrani tentang pusat batin, kehendak, dan kehidupan moral manusia.
- source_word: וָאֶרְחַץ
  choice: dan membasuh
  rationale: “Membasuh” mempertahankan tindakan konkret dalam gambaran puitis serta paralelismenya dengan pemurnian hati.
- source_word: בְּנִקָּיוֹן
  choice: dalam ketidakbersalahan
  rationale: Kata ini mencakup kebersihan dan keadaan tidak bersalah. Dalam konteks etis ini, “ketidakbersalahan” menghindari kesan bahwa yang dimaksud hanya kebersihan jasmani.
- source_word: כַּפָּי
  choice: tanganku
  rationale: Secara harfiah bentuk ini berarti “telapak tanganku,” tetapi “tanganku” adalah ungkapan Indonesia yang alami dan mempertahankan citra tindakan moral.
theological_decisions:
- issue: Kemurnian moral atau ritual
  choice: Mempertahankan gambaran pembasuhan sebagai ungkapan ketidakbersalahan moral tanpa menghapus citra ritualnya.
  alternative: Memahami pembasuhan terutama sebagai tindakan kemurnian ritual.
  rationale: Pasangan “hati” dan “tangan” dalam konteks ratapan menunjukkan integritas batin dan perbuatan, tetapi terjemahan tetap mempertahankan metafora pembasuhan dan tidak mempersempitnya menjadi pernyataan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Susunan dua klausa dipertahankan untuk mencerminkan paralelisme Ibrani; kata ganti orang pertama memakai “aku,” sesuai ragam Mazmur.
