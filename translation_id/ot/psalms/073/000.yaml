id: PSA.73.0
reference: Psalms 73:0
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/000.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to the pure of heart.
translation:
  language: id
  text: 'Mazmur Asaf.[a]


    Sungguh, Allah baik kepada Israel,[b]

    kepada orang-orang yang murni hatinya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur tentang Asaf” atau “Mazmur untuk Asaf.”
    reason: Kata depan Ibrani pada nama Asaf dapat menyatakan kepengarangan, hubungan, atau peruntukan.
  - marker: b
    text: Atau “Hanya Allah yang baik kepada Israel.”
    reason: Partikel Ibrani yang diterjemahkan “Sungguh” juga dapat memiliki nuansa pembatasan, “hanya”.
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Mazmur Asaf
  rationale: Bentuk judul yang alami dan ringkas; לְ dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan, sehingga hubungan tepatnya dengan Asaf tidak diperjelas secara paksa.
- source_word: אַךְ
  choice: Sungguh
  rationale: Dalam konteks ini partikel tersebut menegaskan kesimpulan iman pemazmur, meskipun juga dapat dipahami sebagai pembatasan 'hanya'.
- source_word: לְבָרֵי לֵבָב
  choice: kepada orang-orang yang murni hatinya
  rationale: בַּר berarti bersih atau murni, sedangkan לֵבָב menunjuk batin atau hati; bentuk jamaknya diterjemahkan secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan ungkapan 'Israel' dan 'orang-orang yang murni hatinya'
  choice: Mempertahankan keduanya sebagai dua frasa sejajar tanpa menambahkan kata penghubung penafsir.
  alternative: 'Memahami frasa kedua secara eksplisit sebagai penjelasan yang membatasi Israel: ''yakni kepada orang Israel yang murni hatinya''.'
  rationale: Teks Ibrani memungkinkan frasa kedua menjelaskan atau mempersempit frasa pertama, tetapi tidak menyatakan hubungan itu secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pemenggalan baris membedakan judul dari isi ayat dan mempertahankan paralelisme puisi.
