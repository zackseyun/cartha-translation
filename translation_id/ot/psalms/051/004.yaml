  text: For I know my transgressions, and my sin is always before me.
translation:
  language: id
  text: Sebab aku mengetahui pelanggaran-pelanggaranku, dan dosaku selalu ada di hadapanku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi permohonan dalam konteks sekitarnya; “sebab” mempertahankan fungsi penjelasannya secara wajar dalam bahasa Indonesia.
- source_word: פְשָׁעַי
  choice: pelanggaran-pelanggaranku
  rationale: Bentuk jamak ini menunjuk pada tindakan melanggar atau memberontak terhadap Allah. “Pelanggaran” mempertahankan bobot moralnya tanpa mempersempit makna menjadi satu jenis kesalahan tertentu.
- source_word: אֲנִי אֵדָע
  choice: aku mengetahui
  rationale: Kata kerja ידע menyatakan pengenalan atau kesadaran pribadi. Pronomina eksplisit אֲנִי memberi penekanan pada pengakuan si pembicara; susunan “aku mengetahui” mempertahankannya tanpa penambahan tafsir seperti “mengakui”.
- source_word: וְחַטָּאתִי
  choice: dan dosaku
  rationale: Dalam konteks pengakuan ini, חַטָּאת berarti dosa, bukan kurban penghapus dosa. Bentuk tunggal dipertahankan sebagai fokus pada dosa yang terus hadir dalam kesadaran pemazmur.
- source_word: נֶגְדִּי
  choice: di hadapanku
  rationale: Ungkapan ini menggambarkan sesuatu yang berada di depan atau dalam pandangan seseorang. “Di hadapanku” mempertahankan metafora tersebut dan bernada wajar serta khidmat.
- source_word: תָמִיד
  choice: selalu
  rationale: Kata ini menyatakan keberlangsungan yang terus-menerus; “selalu” merupakan padanan langsung dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hubungan antara פְשָׁעַי (pelanggaran-pelanggaranku) dan חַטָּאתִי (dosaku)
  choice: Mempertahankan kedua istilah sebagai “pelanggaran-pelanggaranku” dan “dosaku”
  alternative: Menyamakan keduanya dengan satu istilah berulang, misalnya “dosa-dosaku” dan “dosaku”
  rationale: Bahasa Ibrani memakai dua istilah yang berkaitan tetapi berbeda. Mempertahankan pembedaan itu menjaga tekstur puitis dan bobot pengakuan tanpa meratakan nuansa teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Bentuk “aku” sesuai dengan tuturan doa pribadi dalam mazmur. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal utama yang perlu dijelaskan kepada pembaca.
