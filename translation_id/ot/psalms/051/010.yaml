id: PSA.51.10
reference: Psalms 51:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַסְתֵּ֣ר פָּ֭נֶי/ךָ מֵ/חֲטָאָ֑/י וְֽ/כָל עֲוֺ֖נֹתַ֣/י מְחֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/010.yaml
  text: Hide your face from my sins[b][a], and blot out all my iniquities.
translation:
  language: id
  text: Sembunyikanlah wajah-Mu dari dosa-dosaku, dan hapuskanlah[a] segala kesalahanku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seka bersih” atau “lenyapkan”.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kesalahan” juga dapat mencakup arti “rasa bersalah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: Sembunyikanlah
  rationale: Bentuk imperatif kausatif dari סתר dipertahankan sebagai permohonan langsung. Pilihan ini menjaga metafora konkret Ibrani, yakni agar Allah tidak memandang dosa pemazmur.
- source_word: פָּנֶיךָ
  choice: wajah-Mu
  rationale: פָּנִים secara harfiah berarti “wajah” dan di sini menggambarkan perhatian pribadi Allah. “Wajah-Mu” mempertahankan ungkapan antropomorfis sumber.
- source_word: מֵחֲטָאָי
  choice: dari dosa-dosaku
  rationale: חטא menunjuk pada dosa atau pelanggaran. Bentuk jamak dan preposisi מִן diterjemahkan langsung dan wajar dalam bahasa Indonesia.
- source_word: וְכָל
  choice: dan ... segala
  rationale: Terjemahan ini mempertahankan penghubung antarklausa dan penekanan pada keseluruhan kesalahan pemazmur.
- source_word: עֲוֹנֹתַי
  choice: kesalahanku
  rationale: עָוֹן dapat menunjuk pada perbuatan salah maupun kesalahan atau rasa bersalah yang melekat padanya. “Kesalahan” membedakannya dari חטא tanpa menetapkan perbedaan doktrinal yang terlalu teknis.
- source_word: מְחֵה
  choice: hapuskanlah
  rationale: Imperatif מחה berarti menghapus, menyeka, atau melenyapkan. “Hapuskanlah” alami dalam bahasa Indonesia dan mempertahankan gambaran penghapusan catatan atau noda.
theological_decisions:
- issue: Pembedaan dua istilah tentang dosa
  choice: חטא diterjemahkan “dosa”, sedangkan עָוֹן diterjemahkan “kesalahan”.
  alternative: Keduanya dapat diterjemahkan “dosa”; עָוֹן juga dapat diterjemahkan “rasa bersalah”.
  rationale: Teks Ibrani memakai dua kata berbeda dalam paralelisme. Pembedaan ini mempertahankan variasi dan intensifikasi puitis tanpa menjadikannya kategori doktrinal yang kaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran “-lah” mempertahankan bentuk permohonan imperatif, sedangkan “wajah-Mu” menjaga metafora konkret teks Ibrani.
