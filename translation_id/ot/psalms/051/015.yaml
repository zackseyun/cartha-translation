base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: id
  text: Bebaskanlah aku dari utang darah[a], ya Allah, Allah keselamatanku; lidahku akan bernyanyi nyaring tentang keadilan-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari penumpahan darah” atau “dari kesalahan karena menumpahkan darah”; secara harfiah, “dari darah-darah,” suatu ungkapan Ibrani yang sering menunjuk pada utang darah.
    reason: lexical_alternative
  - marker: b
    text: Atau “kebenaran-Mu.” Istilah Ibrani ini dapat mencakup baik kelurusan moral maupun keadilan dalam arti yudisial.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Bebaskanlah aku
  rationale: Bentuk imperatif dengan akhiran orang pertama tunggal ini memohon pelepasan. “Bebaskanlah aku” alami dalam bahasa Indonesia dan cocok dengan objek berupa utang darah.
- source_word: מִדָּמִים
  choice: dari utang darah
  rationale: Bentuk jamak דמים secara idiomatis dapat menunjuk pada penumpahan darah atau kesalahan yang timbul karenanya. Dalam konteks pengakuan dosa, “utang darah” mempertahankan unsur pertanggungjawaban atas darah yang tertumpah.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini merupakan sapaan langsung; partikel “ya” menandai vokatif secara wajar dan khidmat.
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  choice: Allah keselamatanku
  rationale: Frasa konstruksi Ibrani dipertahankan secara ringkas dan puitis, dengan keselamatan sebagai sesuatu yang berasal dari Allah.
- source_word: תְּרַנֵּן
  choice: akan bersorak menyanyikan
  rationale: Kata kerja ini menyatakan pujian vokal yang nyaring dan penuh sukacita. Gabungan ini mempertahankan unsur sorak dan nyanyian tanpa menjadikannya sekadar ucapan biasa.
- source_word: לְשׁוֹנִי
  choice: lidahku
  rationale: Terjemahan langsung mempertahankan gambaran puitis lidah sebagai alat pujian.
- source_word: צִדְקָתֶךָ
  choice: kebenaran-Mu
  rationale: צדקה mencakup kelurusan moral, tindakan benar, dan keadilan. “Kebenaran-Mu” merupakan padanan luas yang tidak membatasi maknanya hanya pada ranah pengadilan; nuansa keadilan dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna bentuk jamak דמים dalam pengakuan pemazmur
  choice: utang darah
  alternative: penumpahan darah; kesalahan karena menumpahkan darah
  rationale: Konteks pertobatan mendukung pengertian kesalahan atau pertanggungjawaban atas darah yang tertumpah, bukan hanya bahaya akibat kekerasan. Catatan kaki mempertahankan keluasan idiom Ibrani.
- issue: Nuansa צִדְקָתֶךָ
  choice: kebenaran-Mu
  alternative: keadilan-Mu
  rationale: Istilah Ibrani dapat mencakup kebenaran moral sekaligus keadilan yudisial, bahkan tindakan penyelamatan Allah. Teks utama memakai padanan yang luas, sementara nuansa yudisial dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan “ya Allah” serta bentuk “Bebaskanlah” menjaga kekhidmatan doa. Struktur sebab-hasil dipertegas dengan “maka,” sementara “lidahku” dipertahankan sebagai citraan asli.
