  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: id
  text: Terhadap-Mu—terhadap-Mu saja—aku telah berdosa[a], dan aku telah melakukan apa yang jahat di mata-Mu, sehingga Engkau terbukti benar dalam perkataan-Mu dan tidak bercela ketika Engkau menghakimi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Terhadap-Mu saja aku berdosa.” Susunan bahasa Ibrani menekankan Allah sebagai pihak yang dilanggar oleh dosa.
    reason: lexical_alternative
  - marker: b
    text: Atau, “supaya Engkau dinyatakan benar dalam perkataan-Mu dan murni ketika Engkau menghakimi.” Bahasa Ibrani dapat menyatakan tujuan atau hasil, dan kedua ungkapan terakhir dapat diterjemahkan dengan beberapa cara yang berdekatan.
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: Terhadap Engkau—hanya terhadap Engkau—
  rationale: Dalam konteks pengakuan dosa, לְ menunjuk kepada pihak yang dilanggar. Pengulangan dan tanda pisah mempertahankan penekanan Ibrani pada Allah sebagai pihak yang terutama ditentang.
- source_word: חָטָאתִי
  choice: aku telah berdosa
  rationale: Bentuk perfektif menyatakan tindakan yang telah terjadi dan kini diakui; bentuk 'telah berdosa' wajar dalam bahasa Indonesia.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: dan melakukan apa yang jahat di mata-Mu
  rationale: Adjektiva dengan artikel dipakai secara substantival, sedangkan 'di mata-Mu' mempertahankan gambaran dan ukuran penilaian Allah dalam idiom Ibrani.
- source_word: לְמַעַן
  choice: sehingga
  rationale: Kata ini dapat menyatakan tujuan atau hasil. 'Sehingga' menjaga hubungan antarklausa tanpa memaksakan bahwa dosa dilakukan dengan maksud membenarkan Allah.
- source_word: תִּצְדַּק בְּדָבְרֶךָ
  choice: Engkau terbukti benar dalam perkataan-Mu
  rationale: צדק dalam konteks forensik menyatakan berada atau terbukti di pihak yang benar. 'Perkataan-Mu' mempertahankan bentuk nominal Ibrani dengan ungkapan Indonesia yang alami.
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: tidak bercela ketika Engkau menghakimi
  rationale: זכה menyampaikan kemurnian atau kebebasan dari kesalahan, dan konstruksi בְּ + bentuk infinitif wajar dipahami secara temporal sebagai 'ketika Engkau menghakimi'.
theological_decisions:
- issue: Pernyataan mutlak bahwa dosa ditujukan hanya terhadap Allah meskipun ada manusia yang dirugikan
  choice: Mempertahankan 'Terhadap Engkau—hanya terhadap Engkau—' tanpa pelunakan
  alternative: '''Terutama terhadap Engkau'' atau ''lebih-lebih terhadap Engkau'''
  rationale: Teks Ibrani menyatakannya secara mutlak. Terjemahan mempertahankan ketegangan teologis itu dan tidak memasukkan penjelasan yang tidak terdapat dalam teks.
- issue: Nuansa forensik dalam pembenaran Allah
  choice: '''terbukti benar ... dan tidak bercela'''
  alternative: '''dibenarkan ... dan murni'' atau ''benar ... dan bersih'''
  rationale: Pilihan ini menyampaikan bahwa perkataan dan penghakiman Allah terbukti benar tanpa membebani teks dengan pengertian doktrinal tambahan.
- issue: Hubungan tujuan atau hasil yang ditandai לְמַעַן
  choice: '''sehingga'''
  alternative: '''supaya'''
  rationale: '''Sehingga'' mempertahankan kaitan logis sambil menghindari kesan bahwa pemazmur sengaja berdosa demi membuktikan kebenaran Allah; kemungkinan tujuan tetap dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur paralel dan penekanan tajam teks Ibrani dipertahankan tanpa menjadi kaku.
