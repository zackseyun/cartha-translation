  text: הֵיטִ֣יבָ/ה בִ֭/רְצוֹנְ/ךָ אֶת צִיּ֑וֹן תִּ֝בְנֶ֗ה חוֹמ֥וֹת יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: id
  text: Dalam perkenanan-Mu[a], berbuatlah baik kepada Sion; bangunlah tembok-tembok Yerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam kemurahan-Mu” atau “sesuai dengan kehendak-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks pemulihan, dapat juga diterjemahkan “bangunlah kembali tembok-tembok Yerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: berbuatlah baik
  rationale: Bentuk Hifil berupa permohonan dari יטב meminta Allah bertindak demi kebaikan Sion. Ungkapan ini langsung, wajar dalam bahasa Indonesia, dan tidak mempersempit makna menjadi sekadar kemakmuran.
- source_word: בִרְצוֹנְךָ
  choice: dalam perkenanan-Mu
  rationale: רָצוֹן dapat menunjuk pada perkenanan, kerelaan, atau kehendak. 'Dalam perkenanan-Mu' mempertahankan nuansa sikap baik Allah tanpa meniadakan unsur kehendak-Nya.
- source_word: אֶת צִיּוֹן
  choice: kepada Sion
  rationale: Penanda objek אֶת menandai Sion sebagai objek atau penerima tindakan baik yang dimohonkan. Preposisi 'kepada' diperlukan oleh ungkapan idiomatis Indonesia 'berbuat baik kepada'.
- source_word: תִּבְנֶה
  choice: bangunlah
  rationale: Bentuk Qal imperfek dalam rangkaian permohonan dipahami sebagai permohonan atau harapan. 'Bangunlah' mempertahankan makna dasar verba dan tidak memaksakan arti historis yang lebih khusus, yaitu 'bangunlah kembali'.
- source_word: חוֹמוֹת
  choice: tembok-tembok
  rationale: Bentuk jamak ini secara konkret merujuk pada tembok kota. Pengulangan nomina menandai jamak secara jelas dan tetap alami dalam konteks ini.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Bentuk baku nama tempat tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara perkenanan ilahi dan pemulihan
  choice: Ayat diterjemahkan sebagai doa agar perkenanan Allah terwujud dalam tindakan nyata bagi Sion dan pembangunan tembok-tembok Yerusalem.
  alternative: 'Makna yang terutama volisional: ''Sesuai dengan kehendak-Mu, berbuatlah baik kepada Sion.'''
  rationale: רָצוֹן mencakup medan makna perkenanan dan kehendak. Teks utama memakai 'perkenanan' untuk mempertahankan nuansa kemurahan ilahi dalam konteks doa, sedangkan catatan kaki menjaga kemungkinan makna 'kehendak'.
- issue: Apakah pembangunan berarti pembangunan kembali
  choice: Teks utama memakai 'bangunlah' tanpa secara eksplisit menambahkan gagasan 'kembali'.
  alternative: Bangunlah kembali tembok-tembok Yerusalem.
  rationale: תִּבְנֶה pada dirinya berarti 'engkau akan membangun' atau, dalam konteks permohonan, 'bangunlah'. Makna restoratif mungkin tersirat, tetapi tidak dinyatakan secara morfologis dan karena itu dipertahankan sebagai alternatif dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk imperatif 'berbuatlah' dan 'bangunlah' menyampaikan nada permohonan doa. Kapitalisasi pronomina untuk Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
