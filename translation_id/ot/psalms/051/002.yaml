base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: id
  text: 'Bermurah hatilah kepadaku[a], ya Allah,


    sesuai dengan kasih setia-Mu[b];


    sesuai dengan kelimpahan belas kasihan-Mu[c],


    hapuskanlah pelanggaran-pelanggaranku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kasihanilah aku, ya Allah.” Kata kerja Ibraninya dapat diterjemahkan dengan bahasa belas kasihan, tetapi teks utama membedakannya dari istilah-istilah tentang kasih setia dan belas kasihan yang muncul kemudian.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani khesed, yang sering menunjuk pada kasih yang teguh dan setia dalam ikatan perjanjian.
    reason: lexical_alternative
  - marker: c
    text: Atau “sesuai dengan besarnya/banyaknya belas kasihan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Bermurah hatilah kepadaku
  rationale: Bentuk imperatif חנן dengan akhiran orang pertama tunggal memohon kemurahan atau perkenanan. Ungkapan ini alami dalam bahasa Indonesia dan tetap membedakannya dari חֶסֶד serta רַחֲמִים yang muncul kemudian.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Sapaan langsung kepada Allah Israel; “Allah” merupakan padanan baku dan wajar dalam bahasa Indonesia.
- source_word: כְּחַסְדֶּךָ
  choice: sesuai dengan kasih setia-Mu
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh dalam hubungan perjanjian. “Kasih setia” mempertahankan kedua unsur utama tanpa memakai istilah teknis yang berlebihan; כְּ diterjemahkan “sesuai dengan”.
- source_word: כְּרֹב
  choice: sesuai dengan limpahnya
  rationale: רֹב dapat menyatakan kebesaran, banyaknya, atau kelimpahan. “Limpahnya” terdengar alami bersama “belas kasihan” dan mempertahankan gagasan kelimpahan.
- source_word: רַחֲמֶיךָ
  choice: belas kasihan-Mu
  rationale: Bentuk Ibrani ini secara morfologis jamak dan menyatakan belas kasih yang mendalam. Dalam bahasa Indonesia, “belas kasihan” lazim dipakai sebagai nomina tak terhitung; pemaksaan bentuk jamak akan terdengar tidak alami.
- source_word: מְחֵה
  choice: hapuskanlah
  rationale: מחה berarti menghapus, melenyapkan, atau menyeka. “Hapuskanlah” mempertahankan metafora penghilangan catatan kesalahan dan cocok dengan objek moral dalam ayat ini.
- source_word: פְשָׁעַי
  choice: pelanggaran-pelanggaranku
  rationale: פֶּשַׁע menunjuk pada pelanggaran atau pemberontakan terhadap kewenangan. “Pelanggaran-pelanggaranku” mempertahankan bentuk jamak serta bobot moral-hukumnya dalam konteks pengakuan dosa.
theological_decisions:
- issue: 'Penerjemahan rangkaian istilah terkait kemurahan dan belas kasih: חנן / חסד / רחמים'
  choice: 'Memakai tiga ungkapan yang berbeda: “Bermurah hatilah kepadaku,” “kasih setia-Mu,” dan “belas kasihan-Mu.”'
  alternative: Memakai kata “belas kasihan” atau “rahmat” untuk ketiga istilah tersebut.
  rationale: Bahasa Ibrani menumpuk istilah yang berhubungan tetapi tidak sama untuk menggambarkan kemurahan, kasih setia, dan belas kasih Allah. Pembedaan ini menjaga tekstur puisi serta ketegangan maknanya tanpa meratakan semuanya menjadi satu istilah teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan empat baris mempertahankan paralelisme puisi. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Bentuk “belas kasihan” dipertahankan sebagai ungkapan idiomatis Indonesia meskipun sumber Ibrani berbentuk jamak.
