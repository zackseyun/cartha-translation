id: PSA.51.12
reference: Psalms 51:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַל תַּשְׁלִיכֵ֥/נִי מִ/לְּ/פָנֶ֑י/ךָ וְ/ר֥וּחַ קָ֝דְשְׁ/ךָ֗ אַל תִּקַּ֥ח מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/012.yaml
  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: id
  text: Jangan membuang aku dari hadapan-Mu, dan jangan mengambil Roh Kudus-Mu[a] dariku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh kudus-Mu”; secara lebih harfiah, “roh kekudusan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: membuang aku
  rationale: Bentuk Hifil dari שׁלך menyatakan tindakan melemparkan atau membuang. “Membuang aku” mempertahankan daya ungkap permohonan ini dan terdengar alami dalam bahasa Indonesia.
- source_word: מִלְּפָנֶיךָ
  choice: dari hadapan-Mu
  rationale: Secara harfiah berkaitan dengan “wajah,” tetapi dalam ungkapan ini berarti berada di hadapan atau dalam hadirat Allah. “Dari hadapan-Mu” tetap dekat dengan bentuk Ibrani dan wajar dalam ragam doa.
- source_word: רוּחַ קָדְשְׁךָ
  choice: Roh Kudus-Mu
  rationale: Frasa konstruksi ini secara harfiah berarti “roh kekudusan-Mu” dan secara idiomatis dapat diterjemahkan “roh kudus-Mu.” Huruf kapital menunjukkan bahwa yang dimaksud adalah Roh milik Allah, sementara kemungkinan bentuk yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: תִּקַּח
  choice: mengambil
  rationale: לקח pada dasarnya berarti “mengambil.” Pilihan ini mempertahankan kelangsungan dan ketegasan permohonan Ibrani tanpa menambahkan penafsiran seperti “menarik kembali.”
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Ini adalah padanan langsung dan alami bagi bentuk preposisional yang berarti “dari aku.”
theological_decisions:
- issue: Kapitalisasi dan pemaknaan רוּחַ קָדְשְׁךָ
  choice: Roh Kudus-Mu
  alternative: roh kudus-Mu; roh kekudusan-Mu
  rationale: Dalam konteks doa ini, frasa tersebut menunjuk kepada Roh Allah sendiri. Kapitalisasi mencerminkan rujukan itu tanpa memperluas makna teks; bentuk yang tidak memakai kapital dan terjemahan yang lebih harfiah tetap dicatat untuk menjaga ambiguitas gramatikal dan transparansi.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Bentuk “hadapan-Mu” mempertahankan citra relasional teks Ibrani, sedangkan enklitik ilahi ditulis dengan huruf kapital sesuai kebiasaan ragam keagamaan Indonesia.
