  text: כִּ֤י לֹא תַחְפֹּ֣ץ זֶ֣בַח וְ/אֶתֵּ֑נָה ע֝וֹלָ֗ה לֹ֣א תִרְצֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/017.yaml
  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: id
  text: Sebab Engkau tidak menghendaki kurban; seandainya Engkau menghendakinya, tentu aku akan memberikannya. Engkau tidak berkenan kepada kurban bakaran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi pernyataan sebelumnya dan mempertahankan alur argumentatif mazmur secara alami dalam bahasa Indonesia.
- source_word: לֹא תַחְפֹּץ
  choice: tidak berkenan pada
  rationale: חפץ menyatakan kehendak yang disertai kesenangan atau perkenanan; ungkapan ini alami dan bermartabat dalam konteks ibadah.
- source_word: זֶבַח
  choice: kurban
  rationale: Istilah umum untuk persembahan sembelihan; 'kurban' merupakan padanan baku dan mudah dipahami tanpa mempersempit jenisnya secara berlebihan.
- source_word: וְאֶתֵּנָה
  choice: kalau tidak, tentu akan kuberikan
  rationale: 'Waw dipahami secara kontekstual sebagai akibat dari kondisi tersirat: seandainya Allah berkenan pada kurban, pemazmur akan memberikannya. Objek yang tersirat tetap dapat dipahami dari klausa sebelumnya.'
- source_word: עוֹלָה
  choice: kurban bakaran
  rationale: Padanan teknis yang lazim bagi persembahan yang dibakar seluruhnya, namun tetap alami bagi pembaca modern.
- source_word: לֹא תִרְצֶה
  choice: tidak menyukai
  rationale: רצה di sini menyatakan sikap menerima dengan perkenanan atau kesenangan. 'Tidak menyukai' mempertahankan kesejajaran dengan klausa pertama tanpa memakai kata yang sama.
theological_decisions:
- issue: Makna penolakan terhadap kurban
  choice: Ayat dibiarkan menyatakan bahwa Allah tidak berkenan pada kurban dalam keadaan pertobatan pemazmur ini, tanpa menambahkan pembatas ke dalam teks.
  alternative: Memahami ayat sebagai penolakan universal terhadap seluruh ibadah kurban, atau secara eksplisit menambahkan bahwa yang ditolak hanyalah kurban tanpa hati yang benar.
  rationale: Konteks Mazmur 51 dan kesaksian lebih luas Kitab Suci menunjukkan ketidakcukupan ritual tanpa hati yang benar, tetapi teks ayat ini sendiri berbicara secara tegas. Terjemahan mempertahankan ketegangan itu dan tidak menyelesaikannya dengan tambahan doktrinal.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada puitis dan khidmat. Bentuk 'kuberi' diperluas menjadi 'kuberikan' demi kejelasan, sedangkan 'kurban' mengikuti ejaan baku. Tanda pisah membantu menampilkan kondisi tersirat dalam klausa Ibrani.
