  text: אֲלַמְּדָ֣ה פֹשְׁעִ֣ים דְּרָכֶ֑י/ךָ וְ֝/חַטָּאִ֗ים אֵלֶ֥י/ךָ יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/014.yaml
  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: id
  text: Aku akan mengajarkan jalan-jalan-Mu kepada para pemberontak, dan orang-orang berdosa akan kembali kepada-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "akan berbalik kepada-Mu" atau "akan berpaling kembali kepada-Mu". Kata kerja Ibrani dapat menyatakan baik tindakan berbalik maupun kembali.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: Aku akan mengajarkan
  rationale: Bentuk Hifil orang pertama tunggal yang bernuansa kehendak atau tekad; bentuk masa depan dalam bahasa Indonesia secara alami menyampaikan maksud pemazmur setelah dipulihkan.
- source_word: פֹשְׁעִים
  choice: para pemberontak
  rationale: Kata ini menunjuk pada orang-orang yang dengan sengaja memberontak atau melanggar. 'Para pemberontak' mempertahankan daya moral dan relasionalnya serta membedakannya dari חַטָּאִים.
- source_word: דְּרָכֶיךָ
  choice: jalan-jalan-Mu
  rationale: Bentuk jamak dari 'jalan' merujuk pada cara, kehendak, atau pola tindakan Allah. Metafora sumber dipertahankan secara alami.
- source_word: חַטָּאִים
  choice: orang-orang berdosa
  rationale: Padanan modern dan jelas yang mempertahankan kategori moral serta kesejajarannya dengan 'para pemberontak'.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Preposisi menyatakan arah menuju Allah; bentuk ini alami dalam bahasa Indonesia dan tidak menambahkan unsur yang tidak dinyatakan tersendiri oleh preposisi.
- source_word: יָשׁוּבוּ
  choice: akan kembali
  rationale: שוב dapat berarti berbalik atau kembali. Dalam konteks pertobatan dan pemulihan mazmur ini, 'kembali' menyampaikan nuansa relasional tanpa mempersempitnya menjadi rumusan doktrinal tertentu.
theological_decisions:
- issue: Bahasa pertobatan dalam שוב
  choice: akan kembali kepada-Mu
  alternative: akan berbalik kepada-Mu; akan berpaling kembali kepada-Mu
  rationale: Kata Ibrani dapat menyatakan tindakan berbalik maupun kembali. Terjemahan utama memakai 'kembali' karena konteksnya adalah pemulihan hubungan dengan Allah, sementara catatan kaki mempertahankan kemungkinan leksikal lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Ungkapan 'jalan-jalan-Mu' mempertahankan metafora Ibrani, sedangkan 'para pemberontak' menjaga perbedaan nuansa dari 'orang-orang berdosa'.
