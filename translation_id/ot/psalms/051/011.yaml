  text: Create in me a clean heart[a], O God[b], and renew a steadfast spirit within me.
translation:
  language: id
  text: Ciptakanlah hati yang bersih[a] dalam diriku, ya Allah, dan perbaruilah roh yang teguh[b] di dalam batinku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hati yang murni.”
    reason: lexical_alternative
  - marker: b
    text: Atau “roh yang benar” atau “roh yang mantap”; kata Ibraninya juga mengandung gagasan tentang sesuatu yang kokoh atau tetap.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב (lev)
  choice: hati
  rationale: Dalam antropologi Ibrani, kata ini mencakup pusat pikiran, kehendak, dan perasaan. “Hati” merupakan padanan Indonesia yang alami dan tetap mempertahankan keluasan maknanya.
- source_word: טָהוֹר (tahor)
  choice: bersih
  rationale: Kata ini dapat berarti “bersih” atau “murni.” “Bersih” selaras dengan konteks pemazmur yang memohonkan pentahiran dan mempertahankan nuansa moral sekaligus ritual.
- source_word: בְּרָא (bera)
  choice: ciptakanlah
  rationale: Verba ini khas dipakai untuk tindakan penciptaan oleh Allah. Bentuk imperatif “ciptakanlah” mempertahankan daya permohonan langsung kepada Allah.
- source_word: לִי (li)
  choice: dalam diriku
  rationale: Secara harfiah berarti “bagiku/kepadaku,” tetapi dalam konteks penciptaan hati, “dalam diriku” menyampaikan secara alami bahwa perubahan yang dimohonkan bersifat batiniah.
- source_word: אֱלֹהִים (elohim)
  choice: ya Allah
  rationale: Konteks doa menunjukkan sapaan langsung. “Ya Allah” adalah bentuk vokatif yang alami dan khidmat dalam bahasa Indonesia.
- source_word: רוּחַ (ruakh)
  choice: roh
  rationale: “Roh” mempertahankan keluasan istilah Ibrani serta kesejajarannya dengan “hati,” tanpa mempersempitnya menjadi pikiran atau watak semata.
- source_word: נָכוֹן (nakhon)
  choice: teguh
  rationale: Adjektiva ini menunjuk pada sesuatu yang kokoh, mantap, atau tetap. “Teguh” menyampaikan kestabilan batin tanpa membatasi maknanya hanya pada kebenaran moral.
- source_word: חַדֵּשׁ (khaddesh)
  choice: perbaruilah
  rationale: Bentuk ini menyatakan permohonan agar Allah menjadikan baru atau memulihkan kembali. “Perbaruilah” alami dalam konteks pembaruan batin.
- source_word: בְּקִרְבִּי (beqirbi)
  choice: di dalam batinku
  rationale: Ungkapan ini secara harfiah menunjuk pada bagian terdalam seseorang. “Di dalam batinku” alami dan mempertahankan penekanan pada lokasi batiniah.
theological_decisions:
- issue: Makna נָכוֹן dalam frasa רוּחַ נָכוֹן
  choice: roh yang teguh
  alternative: roh yang benar; roh yang mantap
  rationale: Makna dasarnya paling wajar menunjuk pada keteguhan atau kemantapan. Pilihan “teguh” mempertahankan permohonan akan kesetiaan batin yang berkelanjutan tanpa meniadakan kemungkinan nuansa kelurusan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan khidmat. Bentuk “ciptakanlah” dan “perbaruilah” mempertahankan corak doa langsung. “Di dalam batinku” dipakai untuk menghindari pengulangan “dalam diriku” sekaligus menyampaikan kedalaman batin.
