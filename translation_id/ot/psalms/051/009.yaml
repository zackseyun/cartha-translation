  text: תַּ֭שְׁמִיעֵ/נִי שָׂשׂ֣וֹן וְ/שִׂמְחָ֑ה תָּ֝גֵ֗לְנָה עֲצָמ֥וֹת דִּכִּֽיתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: id
  text: Perdengarkanlah kepadaku kegirangan dan sukacita[a]; biarlah tulang-tulang[b] yang telah Kauremukkan[c] bersorak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Buatlah aku mendengar kegirangan dan sukacita.”'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani: “tulang-tulang”; konteks menunjukkan tulang-tulang pemazmur sendiri.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “Kaupatahkan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: Perdengarkanlah kepadaku
  rationale: Bentuk Hifil dengan akhiran orang pertama tunggal bersifat kausatif, yaitu ‘buatlah aku mendengar’. ‘Perdengarkanlah kepadaku’ mempertahankan daya kausatif dan nada permohonan secara wajar dalam bahasa Indonesia.
- source_word: שָׂשׂוֹן
  choice: kegirangan
  rationale: Kata ini menyatakan kegembiraan atau rasa girang yang kuat. ‘Kegirangan’ membentuk pasangan puitis yang alami dengan ‘sukacita’ tanpa mengulang kata yang sama.
- source_word: וְשִׂמְחָה
  choice: dan sukacita
  rationale: Kata ini lazim menyatakan sukacita atau kegembiraan. ‘Sukacita’ adalah padanan yang jelas, bermartabat, dan tetap membedakannya dari kata sebelumnya.
- source_word: תָּגֵלְנָה
  choice: biarlah ... bersorak
  rationale: Bentuk imperfek orang ketiga feminin jamak dapat mengungkapkan harapan atau permohonan dalam paralelisme puisi. ‘Biarlah ... bersorak’ mempertahankan nuansa volitif dan daya ekspresif kata גיל.
- source_word: עֲצָמוֹת
  choice: tulang-tulang
  rationale: Teks Ibrani secara harfiah hanya menyebut ‘tulang-tulang’ tanpa akhiran kepunyaan orang pertama. Terjemahan utama mempertahankan bentuk tersebut, sementara konteks menunjukkan bahwa yang dimaksud ialah tulang-tulang pemazmur.
- source_word: דִּכִּיתָ
  choice: telah Kauremukkan
  rationale: Bentuk perfek orang kedua maskulin tunggal dari דכה menggambarkan tindakan meremukkan atau menghancurkan. ‘Kauremukkan’ mempertahankan metafora penderitaan yang kuat serta sapaan langsung kepada Allah.
theological_decisions:
- issue: Penderitaan secara langsung dihubungkan dengan tindakan Allah
  choice: yang telah Kauremukkan
  alternative: yang telah diremukkan
  rationale: Kata kerja Ibrani berbentuk orang kedua tunggal dan secara langsung menyatakan bahwa Allah meremukkan tulang-tulang itu. Terjemahan mempertahankan ketegangan teologis ini dan tidak mengaburkan pelakunya dengan bentuk pasif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak doa puitis. Bentuk ‘Kauremukkan’ mempertahankan sapaan langsung kepada Allah, sedangkan ‘kegirangan dan sukacita’ menjaga pasangan sinonim dalam puisi Ibrani.
