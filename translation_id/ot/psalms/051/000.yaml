  language: id
  text: Untuk pemimpin musik[a]. Mazmur Daud[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kepada pemimpin musik.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Mazmur bagi Daud.” Ungkapan ini dapat menunjukkan kepengarangan, keterkaitan, kepemilikan, atau peruntukan; dapat juga diterjemahkan “Mazmur karya Daud” atau “Mazmur untuk Daud.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini dalam judul-judul mazmur menunjuk kepada orang yang memimpin atau mengawasi penyajian musik. Ungkapan ini alami dalam bahasa Indonesia modern dan tidak membatasi tugasnya hanya pada pemimpin paduan suara. Kata depan לַ diterjemahkan “untuk”, sesuai dengan fungsi judul, sementara “kepada” tetap mungkin.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah sebutan baku bagi jenis nyanyian yang kemungkinan disajikan dengan iringan musik. “Mazmur” tepat, ringkas, dan dikenal luas dalam bahasa Indonesia.
- source_word: לְדָוִד
  choice: Daud
  rationale: 'Dalam frasa “Mazmur Daud”, bentuk genitif bahasa Indonesia mempertahankan keluwesan hubungan yang dinyatakan oleh לְ: dapat merujuk pada kepengarangan, keterkaitan, kepemilikan, atau peruntukan, tanpa memaksakan salah satunya.'
theological_decisions:
- issue: Makna keterangan Daud dalam judul mazmur
  choice: Mazmur Daud
  alternative: Mazmur karya Daud; Mazmur untuk Daud
  rationale: Bahasa Ibrani tidak mengharuskan satu jenis hubungan tertentu antara mazmur ini dan Daud. “Mazmur Daud” mempertahankan ambiguitas tersebut, sedangkan “karya Daud” menegaskan kepengarangan dan “untuk Daud” menegaskan peruntukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan sesuai dengan gaya judul mazmur. “Pemimpin musik” dipilih daripada istilah lama “pemimpin biduan” agar mudah dipahami pembaca masa kini tanpa mempersempit peran itu menjadi pemimpin paduan suara.
