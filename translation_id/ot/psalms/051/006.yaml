  yaml_path: translation/ot/psalms/051/006.yaml
  text: Behold[a], in iniquity I was brought forth[c][b], and in sin my mother conceived me.
translation:
  language: id
  text: Sesungguhnya[a], dalam kesalahan aku dilahirkan[b][c], dan dalam dosa ibuku mengandung aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungguh” atau “Lihatlah”.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “aku dibawa keluar dalam kelahiran”; dapat juga diterjemahkan “aku lahir”.
    reason: lexical_alternative
  - marker: c
    text: Ayat ini sering dipahami sebagai pengakuan bahwa manusia berdosa sejak dikandung, atau sebagai bahasa puitis yang diperkuat dalam pertobatan. Teks Ibraninya sendiri tidak sepenuhnya menyelesaikan perdebatan tersebut dan tidak secara tegas menyatakan bahwa tindakan sang ibu adalah dosanya.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel ini menandai penegasan yang sungguh-sungguh. “Sesungguhnya” menyampaikan daya penegasannya secara alami dalam puisi Indonesia; kemungkinan “Sungguh” atau “Lihatlah” dicatat dalam catatan kaki.
- source_word: בְּעָוֹן
  choice: dalam kesalahan
  rationale: עָוֹן dapat menunjuk pada kesalahan, kebengkokan moral, atau keadaan bersalah. “Dalam kesalahan” mempertahankan preposisi Ibrani dan bobot moral katanya tanpa menentukan lebih jauh jenis atau sumber kesalahan tersebut.
- source_word: חוֹלָלְתִּי
  choice: aku dilahirkan
  rationale: Dalam bentuk dan konteks ini, verba חול/חיל menggambarkan seseorang yang dibawa keluar dalam proses kelahiran. Bentuk pasif “aku dilahirkan” mempertahankan citra kelahiran dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: וּבְחֵטְא
  choice: dan dalam dosa
  rationale: חֵטְא adalah istilah umum untuk dosa. Terjemahan ini mempertahankan preposisi serta kesejajaran puitis dengan “dalam kesalahan” tanpa menambahkan tafsiran doktrinal.
- source_word: יֶחֱמַתְנִי
  choice: mengandung aku
  rationale: Verba ini paling tepat dipahami sebagai tindakan mengandung dalam konteks ini. Pilihan tersebut sesuai dengan kesejajaran antara pembuahan atau kehamilan dan kelahiran.
- source_word: אִמִּי
  choice: ibuku
  rationale: Bentuk nomina dengan akhiran orang pertama tunggal diterjemahkan langsung dan alami sebagai “ibuku”.
theological_decisions:
- issue: Apakah ayat ini mengajarkan dosa pribadi sang ibu, keberdosaan pemazmur sejak pembuahan, atau memakai bahasa pertobatan yang hiperbolis
  choice: Menerjemahkan hubungan antara kelahiran, pembuahan, kesalahan, dan dosa secara langsung tanpa menentukan sistem teologis tertentu.
  alternative: Menafsirkannya secara khusus sebagai dosa dalam tindakan pembuahan, sebagai ajaran eksplisit tentang dosa asal, atau semata-mata sebagai hiperbola puitis.
  rationale: Teks Ibrani menghubungkan seluruh keberadaan pemazmur sejak dikandung dan dilahirkan dengan kesalahan serta dosa, tetapi tidak menjelaskan mekanisme atau rumusan doktrinal hubungan itu. Terjemahan karena itu mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. “Sesungguhnya” mempertahankan penegasan pembuka tanpa terasa terlalu kuno; susunan paralel “dalam kesalahan ... dan dalam dosa ...” dipertahankan untuk mencerminkan bentuk puisi Ibrani.
