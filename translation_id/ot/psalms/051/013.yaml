  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: id
  text: Kembalikanlah kepadaku sukacita karena keselamatan-Mu[c], dan biarlah roh yang rela[a] menopang aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh yang murah hati” atau “roh yang luhur.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menyangga aku.”
    reason: lexical_alternative
  - marker: c
    text: Atau “pembebasan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: Kembalikanlah
  rationale: Bentuk imperatif kausatif dari שוב meminta Allah membuat sesuatu yang pernah dialami kembali kepada pemazmur. “Kembalikanlah” alami dalam doa dan mempertahankan gagasan pemulihan keadaan sebelumnya.
- source_word: לִּי
  choice: kepadaku
  rationale: Preposisi dengan akhiran orang pertama tunggal menandai penerima dari tindakan pengembalian.
- source_word: שְׂשׂוֹן
  choice: sukacita
  rationale: Kata benda ini menyatakan kegembiraan atau kesukaan. “Sukacita” ringkas, wajar, dan sesuai dengan register doa puitis.
- source_word: יִשְׁעֶךָ
  choice: keselamatan-Mu
  rationale: Kata יֶשַׁע dapat berarti keselamatan atau pembebasan. “Keselamatan-Mu” menjaga keluasan makna pertolongan ilahi dalam konteks mazmur pertobatan, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: וְרוּחַ
  choice: dan ... roh
  rationale: Dalam konteks batiniah dan puitis ini, רוּחַ paling tepat diterjemahkan “roh,” tanpa menetapkan secara eksplisit apakah yang dimaksud adalah Roh Allah atau batin pemazmur.
- source_word: נְדִיבָה
  choice: rela
  rationale: Adjektiva ini dapat berarti rela, murah hati, atau luhur. “Rela” paling sesuai untuk menggambarkan kesiapan batin, sambil tetap mempertahankan alternatif leksikal dalam catatan kaki.
- source_word: תִסְמְכֵנִי
  choice: biarlah ... menopang aku
  rationale: Kata סמך berarti menopang, menyokong, atau menegakkan. Bentuk imperfek dalam paralel dengan imperatif pembuka berfungsi sebagai permohonan; “biarlah ... menopang aku” menyampaikan nuansa itu secara alami.
theological_decisions:
- issue: Makna “keselamatan-Mu” dalam mazmur pertobatan
  choice: keselamatan-Mu
  alternative: pembebasan-Mu
  rationale: Bahasa Ibrani mencakup keselamatan dan pembebasan. Pilihan utama mempertahankan keluasan teologis dalam konteks dosa, pentahiran, dan pembaruan tanpa memasukkan rincian doktrinal yang tidak dinyatakan ayat ini.
- issue: Identitas “roh yang rela”
  choice: roh yang rela
  alternative: roh yang murah hati; roh yang luhur
  rationale: Terjemahan tidak menentukan apakah roh itu Roh Allah atau batin pemazmur yang diperbarui. Ambiguitas asli dipertahankan, dan “rela” menyampaikan disposisi yang siap serta bebas merespons.
- issue: Peran gramatikal roh dalam klausa kedua
  choice: biarlah roh yang rela menopang aku
  alternative: topanglah aku dengan roh yang rela
  rationale: Susunan Ibrani memungkinkan “roh yang rela” dibaca sebagai subjek dari kata kerja “menopang.” Pilihan utama mengikuti struktur itu dan menghindari penetapan bahwa roh tersebut semata-mata alat yang diberikan kepada pemazmur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan mudah dipahami. Akhiran hormat ilahi ditulis dengan huruf kapital. Susunan klausa kedua mempertahankan kemungkinan bahwa “roh yang rela” adalah subjek penopang, tanpa memperjelas identitas roh tersebut melampaui teks Ibrani.
