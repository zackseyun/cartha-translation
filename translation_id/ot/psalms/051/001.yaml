  text: ketika Nabi Natan datang kepadanya, sesudah Daud menghampiri Batsyeba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “datang kepada Batsyeba”; dalam bahasa Ibrani, ungkapan ini merupakan idiom untuk berhubungan seksual.
