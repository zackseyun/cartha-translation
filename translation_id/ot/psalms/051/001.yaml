lexical_decisions:
- source_word: בְּבוֹא
  choice: ketika ... datang
  rationale: Preposisi ב dengan infinitif konstruk בוא membentuk anak kalimat waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan temporal.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Padanan alami bagi אֶל dengan sufiks orang ketiga maskulin tunggal, dengan arah tindakan tetap terpelihara.
- source_word: נָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Susunan gelar di depan nama merupakan bentuk Indonesia yang baku dan wajar untuk menyatakan Natan sebagai nabi tertentu yang dimaksud.
- source_word: כַּאֲשֶׁר
  choice: setelah
  rationale: Dalam konteks ini, kata tersebut memperkenalkan tindakan Daud yang mendahului kedatangan Natan; 'setelah' menyatakan urutannya dengan jelas.
- source_word: בָּא אֶל
  choice: datang kepada
  rationale: Terjemahan ini mempertahankan ungkapan halus Ibrani dan tidak diam-diam menggantinya dengan penjelasan eksplisit. Dalam konstruksi dengan seorang perempuan, ungkapan itu merupakan idiom untuk hubungan seksual, yang dijelaskan dalam catatan kaki.
- source_word: בַּת שָׁבַע
  choice: Batsyeba
  rationale: Transliterasi nama diri yang lazim dalam bahasa Indonesia.
