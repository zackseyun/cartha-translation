  text: אֲ֭דֹנָ/י שְׂפָתַ֣/י תִּפְתָּ֑ח וּ֝/פִ֗/י יַגִּ֥יד תְּהִלָּתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/016.yaml
  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: id
  text: Tuhan, bukalah bibirku, dan mulutku akan memberitakan pujian kepada-Mu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Gelar ilahi dalam sapaan langsung. “Tuhan” merupakan padanan alami dan baku dalam bahasa Indonesia tanpa menyamakannya dengan nama perjanjian YHWH.
- source_word: שְׂפָתַי
  choice: bibirku
  rationale: Mempertahankan gambaran konkret anggota tubuh dalam bentuk jamak Ibrani; bahasa Indonesia lazim memakai bentuk tak bertanda jamak untuk pasangan anggota tubuh yang sudah jelas dari konteks.
- source_word: תִּפְתָּח
  choice: bukalah
  rationale: Bentuk imperfek Qal dalam konteks doa berfungsi sebagai permohonan. Imperatif halus “bukalah” menyampaikan permohonan itu secara alami.
- source_word: וּפִי
  choice: dan mulutku
  rationale: Mempertahankan konjungsi sederhana serta paralelisme antara “bibirku” dan “mulutku”, tanpa menambahkan hubungan akibat yang tidak dinyatakan secara eksplisit.
- source_word: יַגִּיד
  choice: akan memberitakan
  rationale: Bentuk Hifil mengandung arti menyatakan atau memberitakan. “Akan memberitakan” menangkap tindakan yang menyusul ketika Tuhan membuka bibir pemazmur dan sesuai dengan konteks pujian.
- source_word: תְּהִלָּתֶךָ
  choice: pujian kepada-Mu
  rationale: Sufiks orang kedua dapat diungkapkan secara idiomatis sebagai sasaran pujian. “Pujian kepada-Mu” lebih jelas dalam bahasa Indonesia daripada “pujian-Mu”, yang dapat disalahpahami sebagai pujian yang Tuhan ucapkan.
theological_decisions:
- issue: Penerjemahan gelar ilahi dalam sapaan langsung
  choice: Tuhan
  alternative: Tuhanku
  rationale: אֲדֹנָי adalah gelar ilahi yang penuh hormat. “Tuhan” mempertahankan fungsi sapaan tanpa menambahkan unsur kepunyaan yang dapat terasa lebih tegas daripada bentuk gelar yang sudah membeku ini, dan tidak mencampurkannya dengan konvensi untuk nama YHWH.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan dua klausa dipertahankan untuk menjaga paralelisme puitis. Kapitalisasi pada “-Mu” mengikuti kebiasaan penulisan sapaan kepada Allah dalam terjemahan Alkitab bahasa Indonesia.
