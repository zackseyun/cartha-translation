  text: תְּחַטְּאֵ֣/נִי בְ/אֵז֣וֹב וְ/אֶטְהָ֑ר תְּ֝כַבְּסֵ֗/נִי וּ/מִ/שֶּׁ֥לֶג אַלְבִּֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/008.yaml
  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: id
  text: Sucikanlah aku dengan hisop[a], maka aku akan tahir; basuhlah aku, maka aku akan lebih putih daripada salju.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bersihkanlah aku dengan hisop.” Kata kerja Ibraninya berkaitan dengan bahasa dosa dan pentahiran serta membangkitkan gambaran pentahiran ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: Sucikanlah aku
  rationale: Bentuk Piel dari חטא di sini bermakna purgatif atau kausatif dalam konteks pentahiran, bukan ‘membuat aku berdosa’. ‘Sucikanlah aku’ alami dalam bahasa Indonesia dan tetap menyampaikan pelepasan dari dosa atau kenajisan.
- source_word: בְאֵזוֹב
  choice: dengan hisop
  rationale: Preposisi בְּ menyatakan sarana, sedangkan hisop mengacu pada tumbuhan atau alat yang dipakai dalam ritus pentahiran Israel. Terjemahan langsung ini mempertahankan gambaran ritualnya.
- source_word: וְאֶטְהָר
  choice: maka aku akan tahir
  rationale: טהר menunjuk pada keadaan bersih atau tahir, khususnya dalam konteks ritual dan moral. ‘Tahir’ mempertahankan nuansa kultis yang ditimbulkan oleh hisop, sementara ‘maka’ menyatakan hasil permohonan sebelumnya.
- source_word: תְּכַבְּסֵנִי
  choice: basuhlah aku
  rationale: כבס terutama berarti mencuci kain atau pakaian, tetapi di sini diterapkan secara puitis kepada pemazmur. ‘Basuhlah aku’ alami, bermartabat, dan mempertahankan metafora pencucian.
- source_word: וּמִשֶּׁלֶג
  choice: daripada salju
  rationale: מִן berfungsi secara komparatif dalam klausa ini, sehingga frasa tersebut berarti ‘daripada salju’, bukan sekadar ‘dari salju’.
- source_word: אַלְבִּין
  choice: aku akan lebih putih
  rationale: Bentuk Hifil dari לבן dalam konstruksi komparatif menyatakan hasil menjadi putih. Ungkapan ‘lebih putih daripada salju’ menyampaikan perbandingan Ibraninya secara alami.
theological_decisions:
- issue: Gambaran pentahiran ritual yang diterapkan pada dosa moral
  choice: Mempertahankan hisop dan bahasa ‘sucikan’ serta ‘tahir’.
  alternative: Membersihkan gambaran itu menjadi permohonan umum seperti ‘bersihkanlah aku’ tanpa nuansa ritual.
  rationale: Ayat ini memakai citra ritus pentahiran Israel untuk mengungkapkan permohonan agar dibersihkan dari dosa. Pilihan ini menjaga kaitan tersebut tanpa memasukkan rumusan doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. ‘Hisop’ dipertahankan sebagai istilah Alkitab yang diperlukan oleh citra ritual; ‘tahir’ dipakai untuk menjaga nuansa pentahiran, sedangkan ‘basuhlah’ mempertahankan metafora pencucian.
