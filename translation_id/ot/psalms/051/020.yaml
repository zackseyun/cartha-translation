  text: אָ֤ז תַּחְפֹּ֣ץ זִבְחֵי צֶ֭דֶק עוֹלָ֣ה וְ/כָלִ֑יל אָ֤ז יַעֲל֖וּ עַל מִזְבַּחֲ/ךָ֣ פָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/020.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
translation:
  language: id
  text: Maka Engkau akan berkenan pada kurban-kurban yang benar[a], pada kurban bakaran dan kurban yang dibakar seluruhnya[b]; maka lembu-lembu jantan akan dipersembahkan di atas mazbah-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban-kurban kebenaran.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kurban bakaran yang seluruhnya dibakar.” Bahasa Ibrani memakai dua istilah yang dapat dipahami sebagai dua sebutan yang berkoordinasi atau sebagai ungkapan kedua yang menjelaskan bahwa kurban bakaran itu dibakar seluruhnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: Engkau akan berkenan pada
  rationale: Kata חפץ menyatakan kesukaan atau perkenanan. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks ibadah yang kembali diterima.
- source_word: זִבְחֵי צֶדֶק
  choice: kurban-kurban yang benar
  rationale: Frasa konstruksi ini secara harfiah berarti 'kurban-kurban kebenaran'. Terjemahan utama menyampaikan bahwa kurban-kurban itu selaras dengan kebenaran tanpa membatasinya hanya pada ketepatan tata cara.
- source_word: עוֹלָה
  choice: kurban bakaran
  rationale: Ini adalah istilah baku bagi kurban yang dibakar di atas mazbah.
- source_word: וְכָלִיל
  choice: dan kurban yang dibakar seluruhnya
  rationale: כָלִיל menekankan keutuhan atau keseluruhan. Terjemahan ini mempertahankannya sebagai unsur tersendiri dan sekaligus menjelaskan sifat kurban tersebut.
- source_word: יַעֲלוּ
  choice: akan dipersembahkan
  rationale: Dalam konteks kurban, bentuk ini menggambarkan tindakan menaikkan atau mempersembahkan hewan di atas mazbah. Bentuk pasif alami dalam bahasa Indonesia tanpa menghilangkan makna kultisnya.
- source_word: מִזְבַּחֲךָ
  choice: mazbah-Mu
  rationale: Istilah 'mazbah' mempertahankan rujukan khusus kepada tempat mempersembahkan kurban kepada Allah; akhiran hormat '-Mu' menunjukkan sapaan langsung kepada-Nya.
- source_word: פָרִים
  choice: lembu-lembu jantan
  rationale: פָרִים menunjuk kepada lembu jantan yang dipakai sebagai hewan kurban.
- source_word: אָז ... אָז
  choice: Maka ... maka
  rationale: Pengulangan dipertahankan untuk mencerminkan urutan dan akibat yang ditekankan dalam bahasa Ibrani.
theological_decisions:
- issue: Hubungan kurban yang berkenan dalam ayat ini dengan penekanan sebelumnya pada hati yang remuk dan bertobat
  choice: Bahasa kurban yang konkret dipertahankan sebagai ibadah yang kembali berkenan kepada Allah.
  alternative: Memahami kurban hanya sebagai metafora bagi kesalehan batin, atau menganggap ayat ini sebagai penegasan ritual yang terlepas dari pertobatan.
  rationale: Teks menyebut kurban, kurban bakaran, lembu jantan, dan mazbah secara konkret. Terjemahan tidak meniadakan ketegangan dengan ayat-ayat sebelumnya dan tidak menentukan teori sejarah penyusunan mazmur.
- issue: Hubungan עוֹלָה dengan כָלִיל
  choice: 'Keduanya diterjemahkan sebagai dua ungkapan yang berkoordinasi: ''kurban bakaran dan kurban yang dibakar seluruhnya''.'
  alternative: 'Menggabungkannya menjadi satu ungkapan: ''kurban bakaran yang seluruhnya dibakar''.'
  rationale: Kata penghubung וְ memungkinkan pembacaan berkoordinasi, sedangkan kedekatan makna kedua istilah juga memungkinkan pembacaan penjelas. Teks utama mempertahankan bentuk koordinasinya dan catatan kaki menyebut alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kurban' dipilih menurut ejaan baku; 'mazbah' dipertahankan sebagai istilah ibadah yang dikenal luas. Susunan paralel 'Maka ... maka' mengikuti struktur puitis Ibrani.
