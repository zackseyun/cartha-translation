id: PSA.51.7
reference: Psalms 51:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵן אֱ֭מֶת חָפַ֣צְתָּ בַ/טֻּח֑וֹת וּ֝/בְ/סָתֻ֗ם חָכְמָ֥ה תוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], you desire truth in the inward parts[b], and in the hidden place you make wisdom known to me.
translation:
  language: id
  text: Sesungguhnya[a], Engkau menghendaki kebenaran dalam batin[b], dan dalam bagian yang tersembunyi Engkau memberitahukan hikmat kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungguh” atau “Memang”.
    reason: Menunjukkan alternatif bagi partikel penegas Ibrani.
  - marker: b
    text: Secara harfiah, “pada bagian-bagian dalam”; ungkapan ini menunjuk diri yang paling dalam. “Bagian yang tersembunyi” pada baris berikutnya juga dapat diterjemahkan “dalam tempat rahasia”.
    reason: Kedua ungkapan Ibrani bersifat puitis dan makna tepat gambaran bagian dalam atau tempat tersembunyinya tidak sepenuhnya pasti.
lexical_decisions:
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Menandai penegasan secara alami dalam bahasa Indonesia; mempertahankan daya penegas tanpa memakai seruan arkais seperti “lihatlah”.
- source_word: אֱמֶת
  choice: kebenaran
  rationale: Mencakup kebenaran, ketulusan, dan kesejatian moral yang dikehendaki Allah dalam diri manusia tanpa mempersempitnya menjadi satu konsep khusus.
- source_word: חָפַצְתָּ
  choice: Engkau menghendaki
  rationale: Mengungkapkan keinginan atau kesukaan Allah secara wajar dan bermartabat dalam konteks pengakuan dosa.
- source_word: בַטֻּחוֹת
  choice: dalam batin
  rationale: Menunjuk bagian terdalam atau tersembunyi dari diri seseorang. “Batin” alami dalam bahasa Indonesia, sementara ketidakpastian citra anatomis atau spasialnya dicatat dalam catatan kaki.
- source_word: וּבְסָתֻם
  choice: dan dalam bagian yang tersembunyi
  rationale: Mempertahankan gambaran sesuatu yang tertutup atau tersembunyi serta kesejajarannya dengan bagian batin, tanpa menentukan secara berlebihan bagian yang dimaksud.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan sesuai konteks untuk kebijaksanaan moral dan rohani yang berasal dari Allah.
- source_word: תוֹדִיעֵנִי
  choice: Engkau memberitahukan ... kepadaku
  rationale: Mencerminkan bentuk kausatif dari ידע, yaitu membuat seseorang mengetahui sesuatu. Ungkapan ini lebih dekat kepada bentuk Ibrani daripada “mengajariku”, tetapi tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat kebenaran batin yang dikehendaki Allah
  choice: Ayat diterjemahkan sebagai kehendak Allah akan kebenaran dalam diri manusia dan tindakan-Nya memberitahukan hikmat di bagian diri yang tersembunyi.
  alternative: Menafsirkan “kebenaran” secara khusus sebagai kesetiaan perjanjian, atau memahami ayat ini terutama sebagai kesadaran psikologis terhadap diri sendiri.
  rationale: Puisi Ibrani menyejajarkan kebenaran batin dengan hikmat yang Allah beritahukan dalam bagian tersembunyi. Terjemahan mempertahankan pengertian moral-rohani itu tanpa memasukkan kategori doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan sapaan ilahi “Engkau”. Susunan paralel Ibrani dipertahankan sejauh tetap jelas. Istilah “bagian yang tersembunyi” sengaja tidak diperjelas secara psikologis atau anatomis agar ambiguitas sumber tetap terjaga.
