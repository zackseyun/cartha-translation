  text: הרבה כַּבְּסֵ֣/נִי מֵ/עֲוֺנִ֑/י וּֽ/מֵ/חַטָּאתִ֥/י טַהֲרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/003.yaml
  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
translation:
  language: id
  text: Basuhlah aku sebersih-bersihnya dari kesalahanku[a], dan tahirkanlah aku dari dosaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk “kesalahan” ini juga dapat mencakup keadaan bersalah atau, menurut konteks, akibat atau hukuman atas kesalahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: sebersih-bersihnya
  rationale: Bentuk infinitif absolut dari רבה berfungsi memperkuat perintah berikutnya. Ungkapan Indonesia ini secara alami menyampaikan tingkat atau intensitas pembasuhan, tanpa menjadikannya secara eksplisit tindakan yang berulang-ulang.
- source_word: כַּבְּסֵנִי
  choice: Basuhlah aku
  rationale: Verba כבס terutama menggambarkan pencucian kain atau pakaian secara menyeluruh. 'Basuhlah aku' mempertahankan citra pencucian sekaligus terdengar wajar dan bermartabat dalam puisi doa.
- source_word: מֵעֲוֺנִי
  choice: dari kesalahanku
  rationale: עָוֹן dapat mencakup perbuatan bengkok atau salah, kesalahan yang melekat, dan akibat berupa kesalahan atau hukuman. 'Kesalahanku' cukup luas untuk mempertahankan rentang ini dan tetap dibedakan dari 'dosaku' pada baris sejajar.
- source_word: וּמֵחַטָּאתִי
  choice: dan ... dari dosaku
  rationale: חַטָּאת dalam konteks pengakuan ini paling langsung berarti 'dosa'. Pilihan ini mempertahankan istilah yang lazim serta kesejajarannya dengan עָוֹן.
- source_word: טַהֲרֵנִי
  choice: tahirkanlah aku
  rationale: טהר berarti menjadikan bersih atau tahir dan dapat membawa gema kemurnian ritual maupun moral. 'Tahirkanlah aku' mempertahankan keluasan itu lebih baik daripada sekadar 'bersihkanlah aku'.
theological_decisions:
- issue: Penerjemahan pasangan istilah pertobatan עָוֹן dan חַטָּאת
  choice: Memakai dua istilah berbeda, 'kesalahan' dan 'dosa'.
  alternative: Menerjemahkan עָוֹן sebagai 'hukuman', 'rasa bersalah', atau memakai 'dosa' bagi kedua istilah.
  rationale: Bahasa Ibrani memakai dua kata yang berhubungan tetapi tidak identik dalam paralelisme puitis. Mempertahankan perbedaannya menghindari perataan makna, sementara 'kesalahan' tidak membatasi עָוֹן hanya pada rasa bersalah subjektif atau akibat hukuman.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Bentuk 'basuhlah' dan 'tahirkanlah' dipilih untuk mempertahankan citra pembersihan serta gema ritual-moral; keduanya tetap dapat dipahami pembaca umum. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang dijelaskan.
