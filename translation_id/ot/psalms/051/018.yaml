source:
  edition: WLC
  text: זִֽבְחֵ֣י אֱלֹהִים֮ ר֪וּחַ נִשְׁבָּ֫רָ֥ה לֵב נִשְׁבָּ֥ר וְ/נִדְכֶּ֑ה אֱ֝לֹהִ֗ים לֹ֣א תִבְזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/018.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
translation:
  language: id
  text: Kurban-kurban bagi Allah ialah roh yang hancur[a]; hati yang hancur dan remuk[b], ya Allah, tidak akan Kaupandang hina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “roh yang remuk.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hati yang hancur dan penuh penyesalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: Kurban-kurban bagi Allah
  rationale: Mempertahankan bentuk jamak dan hubungan konstruksi Ibrani tanpa secara eksplisit menambahkan gagasan ‘yang dikehendaki’ atau ‘yang diterima’ Allah. Ungkapan ‘bagi Allah’ alami dalam bahasa Indonesia dan cukup terbuka terhadap nuansa milik, tujuan, atau penerimaan dalam konteks.
- source_word: רוּחַ נִשְׁבָּרָה
  choice: roh yang hancur
  rationale: רוּחַ diterjemahkan langsung sebagai ‘roh’, sedangkan bentuk pasif dari שׁבר menyatakan keadaan yang telah dihancurkan atau dipatahkan. ‘Hancur’ mempertahankan metafora konkret dan tetap alami.
- source_word: לֵב נִשְׁבָּר
  choice: hati yang hancur
  rationale: Terjemahan langsung yang mempertahankan pengulangan akar שׁבר dari frasa sebelumnya.
- source_word: וְנִדְכֶּה
  choice: dan remuk
  rationale: דכה menggambarkan sesuatu yang diremukkan atau ditekan hingga hancur. ‘Remuk’ mempertahankan citra konkret dan paralelismenya dengan ‘hancur’, tanpa langsung menafsirkannya sebagai penyesalan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku untuk אֱלֹהִים, baik dalam frasa konstruksi maupun sebagai sapaan langsung.
- source_word: לֹא תִבְזֶה
  choice: tidak akan Kaupandang hina
  rationale: בזה berarti memandang rendah, menghina, atau meremehkan. ‘Kaupandang hina’ merupakan ungkapan Indonesia yang alami dan mempertahankan makna penilaian penuh penghinaan.
theological_decisions:
- issue: Bahasa metaforis tentang kurban dalam konteks pertobatan
  choice: Ayat menyebut roh serta hati yang hancur dan remuk sebagai kurban bagi Allah, tanpa menambahkan bahwa semua kurban lahiriah ditiadakan.
  alternative: Menafsirkan ayat sebagai penghapusan seluruh sistem kurban, atau hanya sebagai gambaran tekanan batin tanpa pertobatan.
  rationale: Teks Ibrani menyamakan ‘kurban-kurban bagi Allah’ dengan keadaan batin yang disebutkan, tetapi ayat ini sendiri tidak memberikan pernyataan doktrinal lengkap mengenai berakhirnya kurban lahiriah. Metafora dan ketegangan teologisnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa dekat dengan paralelisme Ibrani, sementara ‘Kaupandang hina’ dipilih agar idiomatis. Semua penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
