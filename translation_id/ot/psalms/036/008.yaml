id: PSA.36.8
reference: Psalms 36:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִ֭רְוְיֻ/ן מִ/דֶּ֣שֶׁן בֵּיתֶ֑/ךָ וְ/נַ֖חַל עֲדָנֶ֣י/ךָ תַשְׁקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/008.yaml
  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: id
  text: Mereka dipuaskan dengan kelimpahan rumah-Mu[a], dan Engkau memberi mereka minum dari sungai kenikmatan-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka minum sampai puas dari kelimpahan rumah-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: “Kenikmatan-Mu” juga dapat diterjemahkan “kesenangan-Mu”; kata Ibraninya mungkin juga menggemakan nama Eden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיוּן
  choice: Mereka dipuaskan
  rationale: Bentuk Qal imperfek orang ketiga jamak dari רוה menyatakan keadaan menjadi puas atau kenyang secara berlimpah. Bentuk pasif alami dalam bahasa Indonesia mempertahankan nuansa hasil tanpa menghilangkan gambaran kepuasan.
- source_word: מִדֶּשֶׁן
  choice: dengan kelimpahan
  rationale: דֶּשֶׁן secara harfiah menunjuk pada lemak atau kekayaan dan secara kiasan pada kemakmuran serta kelimpahan. 'Kelimpahan' menyampaikan makna metaforisnya secara wajar dalam bahasa Indonesia modern.
- source_word: בֵּיתֶךָ
  choice: rumah-Mu
  rationale: Kata ini secara langsung berarti 'rumah' dengan akhiran orang kedua tunggal. Terjemahan ini mempertahankan keluasan gambaran tempat kediaman Allah tanpa mempersempitnya menjadi 'Bait Allah' atau 'rumah tangga'.
- source_word: וְנַחַל
  choice: dan ... dari sungai
  rationale: נַחַל dapat berarti aliran air, sungai kecil, atau wadi. Dalam puisi tentang pemberian ilahi yang berlimpah, 'sungai' paling jelas dan alami.
- source_word: עֲדָנֶיךָ
  choice: kenikmatan-Mu
  rationale: Bentuk jamak konstruksi dari עֵדֶן menyatakan kenikmatan, kesenangan, atau kemewahan. 'Kenikmatan-Mu' mempertahankan hubungan leksikal dengan rasa nikmat dan tidak menjadikan kemungkinan gema Eden sebagai arti eksplisit.
- source_word: תַשְׁקֵם
  choice: Engkau memberi mereka minum
  rationale: Bentuk Hifil dengan subjek orang kedua tunggal dan objek orang ketiga jamak berarti 'Engkau menyebabkan mereka minum' atau 'memberi mereka minum'. Pilihan ini alami dan tetap menegaskan tindakan Allah.
theological_decisions:
- issue: Gambaran 'rumah-Mu'
  choice: Mempertahankan 'rumah-Mu' tanpa menentukan Bait Allah atau kediaman surgawi
  alternative: Bait-Mu; rumah tangga-Mu; tempat kediaman-Mu
  rationale: Bahasa Ibrani mempertahankan gambaran puitis tentang kedekatan kepada Allah dan pemeliharaan dari rumah-Nya, tetapi tidak memaksa satu rujukan institusional atau eskatologis tertentu.
- issue: Kemungkinan gema Eden dalam עֲדָנֶיךָ
  choice: Menggunakan 'kenikmatan-Mu' dalam teks utama dan mencatat kemungkinan gema Eden
  alternative: kesenangan-Mu; kenikmatan seperti Eden
  rationale: Makna langsungnya adalah kenikmatan atau kesenangan. Hubungan bentuk katanya dengan Eden mungkin disengaja, tetapi tidak cukup pasti untuk dimasukkan secara eksplisit ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Struktur dua baris Ibrani dipertahankan dalam satu kalimat yang mengalir alami.
