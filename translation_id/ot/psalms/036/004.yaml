- from: Di tempat tidurnya ia merancang kejahatan; ia menempatkan dirinya pada jalan yang tidak baik; ia tidak menolak apa yang jahat.
  to: Di tempat tidurnya ia merancang kejahatan; ia meneguhkan diri pada jalan yang tidak baik; ia tidak menolak apa yang jahat.
  rationale: The revision changes only the middle clause, replacing a wooden literalism with natural modern Indonesian. “Meneguhkan diri” conveys the reflexive and resolute sense of the Hitpael verb while preserving the metaphorical “jalan yang tidak baik” and its non-good formulation in the Hebrew.
