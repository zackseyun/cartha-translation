  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: id
  text: Di tempat tidurnya ia merancang kejahatan; ia meneguhkan diri pada jalan yang tidak baik; ia tidak menolak apa yang jahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָוֶן
  choice: kejahatan
  rationale: Dalam konteks tindakan sengaja yang dirancang, kata ini menunjuk pada kejahatan atau kedurjanaan secara moral; “kejahatan” alami dan jelas dalam bahasa Indonesia modern.
- source_word: יַחְשֹׁב
  choice: merancang
  rationale: Kata kerja ini dapat berarti memikirkan, merencanakan, atau mereka-reka. Dengan objek “kejahatan” dan latar tempat tidur, “merancang” menyampaikan pemikiran yang disengaja.
- source_word: עַל מִשְׁכָּבוֹ
  choice: di tempat tidurnya
  rationale: Ungkapan lokatif ini mempertahankan gambaran orang yang merencanakan kejahatan ketika berada di tempat tidurnya.
- source_word: יִתְיַצֵּב
  choice: menempatkan dirinya
  rationale: Bentuk refleksif kata kerja ini berarti mengambil posisi atau menempatkan diri; pilihan ini mempertahankan unsur kesengajaan dan refleksivitas.
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: pada jalan yang tidak baik
  rationale: Terjemahan ini mempertahankan metafora “jalan” bagi perilaku serta bentuk negatif Ibrani tanpa mengubahnya menjadi “jalan yang jahat.”
- source_word: רָע
  choice: apa yang jahat
  rationale: Kata sifat substantival ini menunjuk pada hal yang jahat secara moral. “Apa yang jahat” jelas sebagai objek kata kerja dalam bahasa Indonesia.
- source_word: לֹא יִמְאָס
  choice: ia tidak menolak
  rationale: Kata kerja ini dapat berarti menolak, meremehkan, atau merasa jijik terhadap. “Tidak menolak” mempertahankan gagasan bahwa ia tidak menjauhkan diri dari kejahatan tanpa memperkuat nuansa emosional secara berlebihan.
