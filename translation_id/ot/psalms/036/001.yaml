translation:
  language: id
  text: 'Di dalam hatiku[a][b], pelanggaran berkata kepada orang fasik: tidak ada rasa takut akan Allah di hadapan matanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “di dalam hatiku”. Sejumlah versi kuno dan terjemahan modern membaca atau memperhalusnya menjadi “di dalam hatinya”.
    reason: alternative_reading
  - marker: b
    text: 'Atau, dengan mempertahankan bentuk nominal Ibrani: “Ucapan pelanggaran kepada orang fasik ada di dalam hatiku.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נְאֻם
  choice: berkata
  rationale: Kata benda ini memperkenalkan suatu pernyataan atau sabda yang berbobot. Bentuk verbal “berkata” terdengar alami dalam bahasa Indonesia dan mempertahankan personifikasi pelanggaran sebagai pihak yang menyampaikan pernyataan.
- source_word: פֶּשַׁע
  choice: pelanggaran
  rationale: Istilah ini menunjuk pada pemberontakan atau tindakan salah yang disengaja. “Pelanggaran” mempertahankan bobot moralnya tanpa mempersempitnya menjadi tindak pidana.
- source_word: לָרָשָׁע
  choice: kepada orang fasik
  rationale: Preposisi ל paling wajar dipahami sebagai penanda penerima perkataan. “Orang fasik” mempertahankan bentuk tunggal representatif dan merupakan ungkapan baku yang bermartabat.
- source_word: בְּקֶרֶב לִבִּי
  choice: di dalam hatiku
  rationale: Teks Masoret secara jelas memakai akhiran orang pertama tunggal, “hatiku”. Terjemahan mempertahankan bacaan yang sulit ini dan tidak menggantinya dengan “hatinya”.
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: tidak ada rasa takut akan Allah
  rationale: Ungkapan ini menyatakan takut, hormat, atau gentar kepada Allah. “Rasa takut akan Allah” mempertahankan keluasan makna itu dan merupakan ungkapan Indonesia yang lazim.
- source_word: לְנֶגֶד עֵינָיו
  choice: di depan matanya
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang sesuatu yang berada dalam pandangan atau pertimbangan seseorang.
theological_decisions:
- issue: Sudut pandang dalam bacaan Masoret לִבִּי (“hatiku”)
  choice: Mempertahankan “di dalam hatiku”, sementara orang fasik tetap menjadi acuan “matanya” pada klausa berikutnya.
  alternative: 'Membaca atau memperhalusnya menjadi “di dalam hatinya”, atau menerjemahkan secara tafsiran: “Dalam hatiku aku memahami tentang orang fasik.”'
  rationale: Teks Ibrani yang diterima mendukung orang pertama tunggal. Walaupun susunannya sulit, perubahan menjadi “hatinya” akan menghilangkan ketegangan asli dan bergantung pada koreksi teks atau pemulusan interpretatif.
- issue: Hubungan klausa “tidak ada rasa takut akan Allah” dengan ujaran pelanggaran
  choice: Menampilkannya sebagai isi perkataan pelanggaran dengan tanda petik.
  alternative: Membacanya sebagai komentar langsung pemazmur tanpa tanda petik.
  rationale: Tanda petik membuat hubungan sintaksis yang paling wajar terlihat, tetapi tidak menambahkan subjek atau penjelasan teologis yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pilihan “orang fasik” mempertahankan register mazmur, sedangkan “berkata” menghindari kekakuan “bersabda” bagi personifikasi pelanggaran. Susunan Ibrani yang sulit sengaja dipertahankan dan dijelaskan melalui catatan kaki.
