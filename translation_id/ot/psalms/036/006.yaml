  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: id
  text: Keadilan-Mu seperti gunung-gunung Allah[a]; keputusan-keputusan-Mu bagaikan samudra raya. Ya Yahweh, Engkau menyelamatkan manusia dan hewan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “gunung-gunung Allah” mungkin berarti “gunung-gunung yang perkasa” atau “gunung-gunung tertinggi.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Engkau menyelamatkan umat manusia dan binatang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: Kebenaran-Mu
  rationale: Kata ini mencakup apa yang benar dan adil, termasuk dimensi moral dan relasional. “Kebenaran” mempertahankan keluasan maknanya, sedangkan “keadilan” saja akan lebih sempit.
- source_word: כְּהַרְרֵי אֵל
  choice: seperti gunung-gunung Allah
  rationale: Terjemahan ini mempertahankan bentuk harfiah ungkapan Ibrani serta daya puitisnya. אֵל juga mungkin berfungsi secara idiomatis untuk menyatakan kebesaran atau tingkat tertinggi; kemungkinan itu dicatat dalam catatan kaki.
- source_word: מִשְׁפָּטֶךָ
  choice: keputusan-keputusan-Mu
  rationale: Bentuk ini menunjuk pada keputusan atau tindakan penghakiman Allah. Pilihan ini menjaga perbedaannya dari צִדְקָה dan terdengar lebih wajar dalam bahasa Indonesia modern daripada pengulangan “penghakiman-penghakiman”.
- source_word: תְּהוֹם רַבָּה
  choice: samudra raya
  rationale: Ungkapan ini menggambarkan kedalaman perairan yang amat besar dan tak terselami. “Samudra raya” mempertahankan citra puitis tanpa mempersempitnya menjadi jurang daratan.
- source_word: אָדָם
  choice: manusia
  rationale: Dalam pasangan dengan hewan, kata ini mengacu secara generik pada umat manusia, bukan khusus pada laki-laki. “Manusia” menyampaikan cakupan tersebut secara alami dalam bahasa Indonesia.
- source_word: וּבְהֵמָה
  choice: dan hewan
  rationale: Istilah ini dapat menunjuk pada binatang secara luas, kadang khususnya ternak. Dalam pasangan universal dengan manusia, “hewan” paling sesuai.
- source_word: תוֹשִׁיעַ
  choice: Engkau menyelamatkan
  rationale: Bentuk kausatif dari ישׁע dapat berarti menyelamatkan, melepaskan, atau memelihara. “Menyelamatkan” mempertahankan keluasan dan bobot teologisnya tanpa meniadakan nuansa pemeliharaan.
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar. Partikel “Ya” membuat sapaan langsung pada akhir ayat terdengar alami dan khidmat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Ya Yahweh
  alternative: Ya TUHAN
  rationale: Teks memakai nama pribadi ilahi secara langsung. “Yahweh” mempertahankan nama tersebut, sedangkan “Ya” menandai sapaan langsung secara alami.
- issue: Cakupan generik אָדָם
  choice: manusia
  alternative: umat manusia
  rationale: Konteks mempertentangkan manusia secara umum dengan hewan. “Manusia” mempertahankan bentuk ringkas dan generik tanpa membatasi rujukannya pada laki-laki.
- issue: Ungkapan כְּהַרְרֵי אֵל
  choice: gunung-gunung Allah
  alternative: gunung-gunung yang perkasa / gunung-gunung tertinggi
  rationale: Konstruksi ini sungguh dapat dibaca sebagai milik Allah atau sebagai idiom superlatif. Teks utama mempertahankan ambiguitas formal, dan catatan kaki menyajikan kemungkinan idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis dan khidmat. Paralelisme Ibrani dipertahankan, pronomina ilahi ditulis dengan huruf kapital, dan citra konkret sumber tidak dijelaskan secara berlebihan.
