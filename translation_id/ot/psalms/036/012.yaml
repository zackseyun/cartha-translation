  text: שָׁ֣ם נָ֭פְלוּ פֹּ֣עֲלֵי אָ֑וֶן דֹּ֝ח֗וּ וְ/לֹא יָ֥כְלוּ קֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/012.yaml
  text: There the workers of wickedness have fallen[b][a]; they are thrust down and cannot rise.
translation:
  language: id
  text: Di sanalah para pelaku kejahatan telah jatuh[a]; mereka dihempaskan dan tidak dapat bangkit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang-orang yang berbuat jahat" untuk "para pelaku kejahatan".
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Di sanalah
  rationale: Adverbia lokatif ini menunjuk dengan tegas kepada tempat atau keadaan kejatuhan orang fasik; partikel -lah memberi penekanan yang alami dalam bahasa Indonesia.
- source_word: נָפְלוּ
  choice: telah jatuh
  rationale: Bentuk perfektif menyatakan peristiwa yang sudah terjadi dengan akibat yang tetap nyata; 'telah jatuh' mempertahankan gambaran keruntuhan.
- source_word: פֹּעֲלֵי אָוֶן
  choice: para pelaku kejahatan
  rationale: Ungkapan ini secara harfiah berarti orang-orang yang melakukan kejahatan. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan unsur tindakan, bukan sekadar memberi label 'orang jahat'.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Dalam konteks ini kata tersebut terutama bermakna keburukan moral, meskipun juga dapat membawa nuansa kesusahan atau bencana yang ditimbulkan.
- source_word: דֹּחוּ
  choice: dihempaskan
  rationale: Bentuk ini menyampaikan tindakan pasif berupa penjatuhan atau penolakan dengan daya paksa, serta cocok dengan gambaran keruntuhan dalam baris puisi.
- source_word: וְלֹא יָכְלוּ קוּם
  choice: dan tidak dapat bangkit lagi
  rationale: Frasa ini menyatakan ketidakmampuan untuk berdiri kembali setelah dijatuhkan. 'Bangkit lagi' menjelaskan arah makna tanpa menghilangkan metafora kejatuhan.
