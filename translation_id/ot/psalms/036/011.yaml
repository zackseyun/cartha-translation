translation:
  language: id
  text: Janganlah kaki keangkuhan mendatangi aku[a], dan janganlah tangan orang-orang jahat mengusir aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “datang menimpa aku” atau “datang kepadaku.” Ungkapan Ibraninya secara harfiah berbunyi “janganlah kaki keangkuhan datang kepadaku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “membuat aku mengembara” atau “membuat aku melarikan diri.” Verba Ibrani ini dapat menyatakan tindakan memaksa seseorang pergi dari tempatnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: datang menyerang aku
  rationale: Secara harfiah berarti ‘datang kepadaku’, tetapi dengan ‘kaki keangkuhan’ sebagai subjek, konteksnya menunjukkan gerak maju yang mengancam. ‘Datang menyerang aku’ mengungkapkan nuansa permusuhan tanpa menghilangkan verba ‘datang’.
- source_word: רֶגֶל גַּאֲוָה
  choice: kaki keangkuhan
  rationale: Mempertahankan bentuk konkret-abstrak Ibrani, secara harfiah ‘kaki keangkuhan’, serta daya puitisnya. Terjemahan ‘kaki orang congkak’ mungkin, tetapi mengubah nomina abstrak menjadi sebutan bagi orang.
- source_word: יַד רְשָׁעִים
  choice: tangan orang-orang jahat
  rationale: ‘Tangan’ mempertahankan gambaran tentang kuasa atau tindakan, sedangkan bentuk jamak רְשָׁעִים diterjemahkan secara wajar dan mudah dipahami sebagai ‘orang-orang jahat’.
- source_word: תְּנִדֵנִי
  choice: mengusir aku
  rationale: Bentuk kausatif verba ini dapat berarti membuat seseorang berpindah, mengembara, atau melarikan diri. Dalam paralelisme dengan kaki dan tangan yang mengancam, ‘mengusir aku’ menyampaikan pemindahan paksa secara ringkas dan alami.
- source_word: אַל
  choice: Janganlah
  rationale: Partikel negatif dengan bentuk yusif menyatakan permohonan atau larangan dalam doa. ‘Janganlah’ sesuai dengan ragam puitis yang luhur namun tetap mudah dipahami.
