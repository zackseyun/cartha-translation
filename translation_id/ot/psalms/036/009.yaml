  text: כִּֽי עִ֭מְּ/ךָ מְק֣וֹר חַיִּ֑ים בְּ֝/אוֹרְ/ךָ֗ נִרְאֶה אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/009.yaml
  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: id
  text: Sebab pada-Mu ada mata air kehidupan[a]; dalam terang-Mu kita melihat terang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sumber kehidupan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “oleh terang-Mu kita melihat terang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau dasar bagi pujian pada konteks sebelumnya, sambil mempertahankan hubungan antarkalimat secara alami.
- source_word: עִמְּךָ
  choice: pada-Mu
  rationale: Dalam ungkapan kepemilikan atau ketersediaan seperti ini, ‘pada-Mu’ menyampaikan bahwa mata air kehidupan berada pada Allah dan berasal dari-Nya, tanpa mengubah metafora menjadi uraian abstrak.
- source_word: מְקוֹר
  choice: mata air
  rationale: Kata ini menunjuk pada mata air atau pangkal aliran. ‘Mata air’ merupakan gambaran konkret dan puitis yang alami dalam bahasa Indonesia.
- source_word: חַיִּים
  choice: kehidupan
  rationale: Walaupun bentuk Ibraninya jamak, kata ini lazim berfungsi sebagai nomina abstrak yang berarti ‘kehidupan’.
- source_word: בְּאוֹרְךָ
  choice: dalam terang-Mu
  rationale: Mempertahankan citra dan keluwesan preposisi Ibrani בְ; kemungkinan makna instrumental ‘oleh terang-Mu’ dicatat dalam catatan kaki.
- source_word: נִרְאֶה
  choice: kita melihat
  rationale: Bentuk ini menyatakan kebenaran umum dalam konteks puisi. ‘Kita melihat’ langsung, alami, dan mempertahankan sudut pandang orang pertama jamak.
- source_word: אוֹר
  choice: terang
  rationale: Pengulangan kata ‘terang’ mempertahankan permainan kata dan penekanan puitis teks Ibrani.
theological_decisions:
- issue: Daya metaforis gambaran kehidupan dan terang ilahi
  choice: Mempertahankan ungkapan ‘mata air kehidupan’ dan ‘dalam terang-Mu kita melihat terang’ tanpa penjelasan interpretatif.
  alternative: Menguraikannya sebagai ‘Engkaulah sumber segala kehidupan’ atau ‘oleh kebenaran-Mu kita memperoleh pengertian.’
  rationale: Teks menyampaikan teologi secara puitis dan terbuka. Mempertahankan metaforanya menghindari pembatasan makna pada satu tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapital pada akhiran pronomina yang merujuk kepada Allah mengikuti konvensi hormat yang lazim. Susunan paralel dan pengulangan ‘terang’ dipertahankan.
