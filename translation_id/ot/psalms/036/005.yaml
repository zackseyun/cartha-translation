  text: יְ֭הוָה בְּ/הַ/שָּׁמַ֣יִם חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ עַד שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/005.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
translation:
  language: id
  text: Ya, Yahweh, kasih setia-Mu ada di langit[a]; kesetiaan-Mu sampai ke awan-awan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih setia-Mu sampai ke langit”; ungkapan Ibrani dapat menyatakan jangkauan, bukan hanya lokasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”; partikel “Ya” menyampaikan sapaan langsung secara wajar dalam bahasa Indonesia.
- source_word: בְּהַשָּׁמַיִם
  choice: ada di langit
  rationale: Preposisi בְּ paling langsung dipahami secara lokatif, sedangkan “ada” ditambahkan karena klausa Ibrani tidak memiliki verba eksplisit. Kemungkinan makna sebagai batas jangkauan dipertahankan dalam catatan kaki.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד menunjuk pada kasih yang teguh dan loyal; “kasih setia” merupakan padanan Indonesia yang alami serta mempertahankan nuansa relasionalnya.
- source_word: אֱמוּנָתְךָ
  choice: kesetiaan-Mu
  rationale: אֱמוּנָה dalam kesejajaran dengan חֶסֶד menyatakan sifat dapat dipercaya dan setia.
- source_word: עַד
  choice: sampai ke
  rationale: Padanan ini menyatakan batas atau jangkauan secara alami tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: שְׁחָקִים
  choice: awan-awan
  rationale: Kata puitis ini dapat menunjuk pada awan atau langit tinggi; “awan-awan” mempertahankan gambaran konkret dan kesejajarannya dengan “langit”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan kasih setia dengan langit
  choice: kasih setia-Mu ada di langit
  alternative: kasih setia-Mu sampai ke langit
  rationale: בְּהַשָּׁמַיִם paling langsung bersifat lokatif, tetapi susunan puitis tanpa verba juga memungkinkan pengertian jangkauan. Ambiguitas ini tidak diselesaikan secara dogmatis dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Huruf kapital pada akhiran pronominal dalam “-Mu” mengikuti kebiasaan penulisan rujukan kepada Allah; kesejajaran dua larik dipertahankan dengan tanda titik koma.
