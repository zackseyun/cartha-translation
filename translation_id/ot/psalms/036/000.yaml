lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Bentuk ini menunjuk kepada orang yang memimpin atau mengawasi penyajian musik dalam ibadah. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan fungsi liturgisnya.
- source_word: לְעֶבֶד
  choice: hamba
  rationale: Dalam judul mazmur ini, kata tersebut merupakan sebutan kehormatan yang menyatakan pengabdian kepada Allah; 'hamba' lebih sesuai daripada istilah yang menonjolkan status perbudakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Kata depan Ibrani dalam judul mazmur menyatakan hubungan atau atribusi secara luas. 'Dari Daud' lebih terbuka daripada 'oleh Daud', yang secara tegas menetapkan kepengarangan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung, sehingga nama itu dipertahankan dalam bentuk 'Yahweh'.
- issue: Makna עֶבֶד sebagai gelar bagi Daud
  choice: hamba
  alternative: budak
  rationale: Dalam konteks judul ini, kata tersebut berfungsi sebagai gelar kehormatan bagi orang yang mengabdi kepada Yahweh, bukan terutama sebagai penekanan pada status sosial sebagai budak.
- issue: Cakupan atribusi לְדָוִד
  choice: Dari Daud
  alternative: Oleh Daud
  rationale: Pilihan utama mempertahankan keluasan makna kata depan Ibrani, yang dapat menunjuk pada kepengarangan, peruntukan, kepunyaan, atau hubungan dengan Daud tanpa memastikan salah satunya.
translation_notes:
  register: Judul diterjemahkan dengan bahasa Indonesia modern yang ringkas dan khidmat. Susunan 'Dari Daud, hamba Yahweh' mengungkapkan bahwa 'hamba Yahweh' menerangkan Daud, sedangkan catatan kaki mempertahankan ketidakpastian jenis atribusinya.
