  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: id
  text: Sebab ia menyanjung dirinya sendiri dalam pandangannya sendiri, sehingga ia tidak dapat menemukan dan membenci dosanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Sebab ia membuat licin bagi dirinya dalam pandangannya, untuk menemukan kesalahannya, untuk membenci.” Teks Ibrani sulit dipahami; maknanya tampaknya bahwa penyanjungan diri menghalanginya mengenali dan menolak dosanya.
    reason: Menjelaskan idiom הֶחֱלִיק dan mempertahankan ambiguitas sintaksis pada dua bentuk infinitif terakhir, tanpa menambahkan objek yang tidak terdapat dalam teks Ibrani.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan pada ayat sebelumnya dan mempertahankan alur argumentatif mazmur.
- source_word: הֶחֱלִיק אֵלָיו
  choice: ia ... menyanjung dirinya sendiri
  rationale: Secara harfiah verba ini berarti “membuat licin/halus”, tetapi dalam bentuk dan konteks ini merupakan ungkapan idiomatis tentang sanjungan yang diarahkan kepada diri sendiri.
- source_word: בְּעֵינָיו
  choice: dalam pandangannya
  rationale: Ungkapan ini mempertahankan idiom Ibrani mengenai penilaian seseorang menurut matanya sendiri tanpa membuat bahasa Indonesia terasa terlalu kaku.
- source_word: לִמְצֹא
  choice: menemukan
  rationale: Padanan langsung ini dapat menyatakan menyadari atau mengenali pelanggaran moral, sambil tetap dekat dengan gambaran bahasa sumber.
- source_word: עֲוֺנוֹ
  choice: dosanya
  rationale: עָוֹן menunjuk pada kesalahan atau kejahatan moral dan kadang juga akibat kesalahan itu. “Dosanya” jelas, bermartabat, dan alami bagi pembaca Indonesia.
- source_word: לִשְׂנֹא
  choice: dan membencinya
  rationale: Akhiran “-nya” membuat objek yang tersirat menjadi jelas, yakni dosa yang baru disebut, tanpa menambahkan gagasan baru.
- source_word: לִמְצֹא עֲוֺנוֹ לִשְׂנֹא
  choice: sehingga tidak menemukan dosanya dan membencinya
  rationale: Susunan Ibrani sangat padat dan sulit. Terjemahan ini menyampaikan bahwa penyanjungan diri menghalangi pengenalan serta penolakan terhadap dosa, sedangkan catatan kaki mempertahankan bentuk dan kemungkinan lain.
theological_decisions:
- issue: Makna moral-psikologis hubungan antara penyanjungan diri dan dosa
  choice: Penyanjungan diri membuat orang fasik tidak mengenali dan membenci dosanya sendiri.
  alternative: Ia membuat segala sesuatu tampak baik bagi dirinya sampai kesalahannya didapati sebagai sesuatu yang patut dibenci; atau, secara lebih formal, ia berbuat licin terhadap dirinya untuk menemukan kesalahannya, untuk membenci.
  rationale: Konteks langsung menggambarkan kebutaan moral orang fasik. Namun, karena sintaksis Ibrani memang sulit dan dapat disusun dengan cara lain, ketidakpastian itu dinyatakan dalam catatan kaki dan tidak diubah menjadi penegasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. “Menyanjung dirinya sendiri” menyampaikan idiom Ibrani secara alami, sedangkan “dalam pandangannya” mempertahankan citra bahasa sumber. Catatan kaki menampung bentuk harfiah dan kesulitan sintaksis tanpa membebani ayat utama.
