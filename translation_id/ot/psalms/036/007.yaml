base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/007.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
translation:
  language: id
  text: Betapa berharganya kasih setia-Mu[a], ya Allah! Dan umat manusia[b] berlindung di bawah naungan sayap-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ḥesed dapat mencakup kasih, kesetiaan, belas kasih, dan loyalitas dalam suatu hubungan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak manusia,” yaitu manusia pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: Betapa berharganya
  rationale: מַה berfungsi sebagai seruan kekaguman, bukan pertanyaan, sedangkan יָקָר menyatakan sesuatu yang sangat bernilai atau berharga.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: Ungkapan ini menangkap unsur kasih, kesetiaan, belas kasih, dan komitmen relasional dalam חֶסֶד tanpa membatasinya pada satu nuansa saja.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini merupakan sapaan langsung; partikel 'ya' menyampaikan fungsi vokatif secara wajar dalam bahasa Indonesia.
- source_word: וּבְנֵי אָדָם
  choice: Umat manusia
  rationale: Frasa Ibrani ini merujuk secara kolektif kepada manusia pada umumnya. 'Umat manusia' alami dalam bahasa Indonesia modern dan tidak menyiratkan hanya laki-laki.
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: di bawah naungan sayap-Mu
  rationale: '''Naungan'' menyampaikan bayang-bayang yang memberi perlindungan, sementara ''sayap-Mu'' mempertahankan citra puitis Ibrani.'
- source_word: יֶחֱסָיוּן
  choice: berlindung
  rationale: Verba חָסָה menyatakan tindakan mencari atau memperoleh perlindungan; 'berlindung' ringkas dan alami dalam konteks ini.
theological_decisions:
- issue: Cakupan וּבְנֵי אָדָם
  choice: Umat manusia
  alternative: anak-anak manusia
  rationale: Frasa tersebut bersifat kolektif dan mencakup manusia secara umum. Terjemahan utama dibuat alami dan tepat cakupan, sementara bentuk harfiahnya dicatat agar citra bahasa sumber tetap terlihat.
- issue: Nuansa חֶסֶד
  choice: kasih setia
  alternative: belas kasih; kasih perjanjian; kemurahan
  rationale: חֶסֶד memiliki rentang makna yang mencakup kasih, kesetiaan, belas kasih, dan loyalitas relasional. 'Kasih setia' mempertahankan keluasan teologis itu tanpa mengunci makna hanya pada belas kasih atau secara eksplisit menambahkan kata 'perjanjian'.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. 'Betapa' mempertahankan bentuk seruan, sedangkan 'di bawah naungan sayap-Mu' memakai ungkapan Indonesia yang alami sambil menjaga metafora perlindungan ilahi.
