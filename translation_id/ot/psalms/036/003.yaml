id: PSA.36.3
reference: Psalms 36:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דִּבְרֵי פִ֭י/ו אָ֣וֶן וּ/מִרְמָ֑ה חָדַ֖ל לְ/הַשְׂכִּ֣יל לְ/הֵיטִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/003.yaml
  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: id
  text: Kata-kata dari mulutnya adalah kejahatan dan tipu daya; ia telah berhenti bertindak bijaksana[a] dan berbuat baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia telah berhenti berlaku bijaksana dalam berbuat baik.” Kedua bentuk infinitif dalam bahasa Ibrani dapat dipahami sebagai dua pelengkap sejajar sesudah “telah berhenti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: Kata-kata dari mulutnya
  rationale: Mempertahankan bentuk jamak דִּבְרֵי dan gambaran konkret פִיו, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Dalam pasangan dengan מִרְמָה dan sebagai ciri perkataan, kata ini menyatakan keburukan moral, bukan sekadar kesusahan.
- source_word: וּמִרְמָה
  choice: dan tipu daya
  rationale: מִרְמָה menunjuk pada penipuan atau kelicikan; 'tipu daya' sesuai dengan konteks perkataan.
- source_word: חָדַל
  choice: ia telah berhenti
  rationale: Qal perfektum ini menyatakan penghentian atau ditinggalkannya suatu tindakan.
- source_word: לְהַשְׂכִּיל
  choice: bertindak bijaksana
  rationale: Bentuk Hifil dari שכל dalam konteks etis ini menunjuk pada kebijaksanaan praktis atau tindakan yang arif.
- source_word: לְהֵיטִיב
  choice: berbuat baik
  rationale: Bentuk Hifil dari יטב berarti melakukan yang baik atau bertindak dengan baik.
theological_decisions:
- issue: Hubungan dua infinitif לְהַשְׂכִּיל dan לְהֵיטִיב setelah חָדַל
  choice: 'Keduanya diterjemahkan sebagai dua pelengkap sejajar: ''bertindak bijaksana dan berbuat baik.'''
  alternative: '''berlaku bijaksana dalam berbuat baik'''
  rationale: Susunan Ibrani memungkinkan kedua infinitif dipahami sebagai pelengkap sejajar, tetapi juga dapat dipahami memiliki hubungan yang lebih erat. Teks utama menjaga kedua gagasan tanpa meleburkannya; catatan kaki mempertahankan ambiguitas sintaksis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Ungkapan konkret 'mulutnya' dipertahankan, sedangkan klausa akhir dibuat alami tanpa menghilangkan ambiguitas hubungan kedua infinitif Ibrani.
