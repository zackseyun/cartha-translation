  yaml_path: translation/ot/psalms/036/010.yaml
  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: id
  text: Teruskanlah kasih setia-Mu[a] kepada orang-orang yang mengenal-Mu, dan kebenaran-Mu[b] kepada orang-orang yang lurus hati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau «Ulurkanlah kasih setia-Mu» (secara harfiah, «Tariklah kasih setia-Mu»).
    reason: lexical_alternative
  - marker: b
    text: Atau «keadilan-Mu».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: Lanjutkanlah
  rationale: Kata perintah ini secara harfiah berarti ‘tariklah’ atau ‘ulurkanlah’. Dengan kasih setia sebagai objeknya, ‘lanjutkanlah’ secara wajar menyampaikan permohonan agar kasih setia Allah terus berlangsung.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד menunjuk pada kasih yang teguh, loyal, dan berakar dalam hubungan perjanjian; ‘kasih setia’ mempertahankan unsur kasih sekaligus kesetiaan.
- source_word: לְיֹדְעֶיךָ
  choice: kepada mereka yang mengenal-Mu
  rationale: Bentuk partisip ini berarti ‘mereka yang mengenal Engkau’. Ungkapan tersebut mempertahankan sifat relasional dari pengenalan akan Allah.
- source_word: וְצִדְקָתְךָ
  choice: dan kebenaran-Mu
  rationale: צְדָקָה dapat berarti ‘kebenaran’ atau ‘keadilan’. Dalam kesejajaran dengan kasih setia Allah, ‘kebenaran-Mu’ mempertahankan cakupan moral dan relasionalnya tanpa membatasinya pada tindakan hukum.
- source_word: לְיִשְׁרֵי לֵב
  choice: kepada mereka yang tulus hati
  rationale: Ungkapan Ibrani ini secara harfiah menunjuk kepada orang-orang yang ‘lurus hatinya’, yakni yang memiliki integritas batin. ‘Tulus hati’ alami dan mudah dipahami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan sifat-sifat Allah dalam kesejajaran puisi
  choice: Menerjemahkan חֶסֶד sebagai ‘kasih setia’ dan צְדָקָה sebagai ‘kebenaran’, tanpa memasukkan kategori doktrinal yang lebih belakangan.
  alternative: Menerjemahkan חֶסֶד sebagai ‘belas kasihan’ atau צְדָקָה sebagai ‘keadilan’.
  rationale: Ayat ini memohon agar kasih yang loyal dan kelurusan moral Allah terus dinyatakan kepada umat-Nya. Pilihan ini mempertahankan kesejajaran serta cakupan istilah Ibrani tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai huruf kapital. Susunan dua klausa dipertahankan untuk mencerminkan kesejajaran puisi Ibrani.
