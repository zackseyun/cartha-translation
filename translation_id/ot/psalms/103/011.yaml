  text: כִּ֤י כִ/גְבֹ֣הַּ שָׁ֭מַיִם עַל הָ/אָ֑רֶץ גָּבַ֥ר חַ֝סְדּ֗/וֹ עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: id
  text: Sebab setinggi langit di atas bumi, demikian besarnya kasih setia-Nya kepada orang-orang yang takut akan Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belas kasih-Nya” atau “kesetiaan perjanjian-Nya”; kata Ibrani חֶסֶד mencakup kasih yang teguh dan kesetiaan dalam suatu hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau penjelasan bagi pujian sebelumnya dan tetap wajar dalam puisi Indonesia.
- source_word: כִגְבֹהַּ שָׁמַיִם עַל הָאָרֶץ
  choice: setinggi langit di atas bumi
  rationale: Mengungkapkan perbandingan derajat secara alami sambil mempertahankan citra vertikal teks Ibrani.
- source_word: גָּבַר
  choice: demikian besarnya
  rationale: Dalam perbandingan ini, verba yang berarti menjadi kuat, unggul, atau perkasa menyatakan keluasan kasih Allah; ungkapan ini alami tanpa menambahkan gagasan konflik.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: Menjaga unsur kasih, kesetiaan, dan komitmen relasional yang terkandung dalam חֶסֶד.
- source_word: עַל יְרֵאָיו
  choice: kepada orang-orang yang takut akan Dia
  rationale: עַל menyatakan arah atau sasaran kasih-Nya, sedangkan יְרֵאָיו menunjuk kepada mereka yang dicirikan oleh rasa takut kepada-Nya; formulasi ini mempertahankan kekuatan leksikal sekaligus terdengar alami.
theological_decisions:
- issue: Makna חֶסֶד dalam mazmur tentang belas kasih dan kesetiaan TUHAN
  choice: kasih setia-Nya
  alternative: belas kasih-Nya; kesetiaan perjanjian-Nya
  rationale: “Kasih setia” mempertahankan baik dimensi kasih maupun kesetiaan tanpa membatasi istilah pada belas kasihan saja atau menjelaskan hubungan perjanjian secara lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan bermartabat. “Langit” dipakai secara kolektif dan alami dalam bahasa Indonesia. Penanda catatan kaki ditempatkan setelah kalimat yang memuat “kasih setia-Nya” agar tidak mengganggu alur perbandingan.
