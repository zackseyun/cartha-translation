  text: כִּי ה֖וּא יָדַ֣ע יִצְרֵ֑/נוּ זָ֝כ֗וּר כִּי עָפָ֥ר אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/014.yaml
  text: For he knows our frame[a]; he remembers that we are dust.
translation:
  language: id
  text: Sebab Ia tahu bagaimana kita dibentuk[a]; Ia ingat bahwa kita ini debu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bentukan kita”; kata Ibrani ini menunjuk pada sesuatu yang dibentuk atau bagaimana sesuatu dibentuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya; “Sebab” mempertahankan daya kausal sekaligus mengalir alami dalam bahasa Indonesia.
- source_word: הוּא
  choice: Ia
  rationale: Pronomina eksplisit dipertahankan; acuannya adalah Allah dalam konteks mazmur.
- source_word: יָדַע
  choice: tahu
  rationale: Bentuk perfektif menyatakan pengetahuan yang tetap dan berlaku kini; “tahu” merupakan padanan langsung dan alami.
- source_word: יִצְרֵנוּ
  choice: bagaimana kita dibentuk
  rationale: Nomina יֵצֶר menunjuk pada sesuatu yang dibentuk atau hasil pembentukan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fokus pada keadaan manusia sebagai ciptaan tanpa membatasinya hanya pada tubuh.
- source_word: זָכוּר
  choice: Ia ingat
  rationale: Walaupun bentuk Ibraninya secara formal bersifat partisipial/adjektival, dalam konteks bentuk itu menyatakan bahwa Allah tetap mengingat; klausa verbal ini jelas dan sejajar dengan “Ia tahu”.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang diingat Allah, bukan alasan baru.
- source_word: עָפָר
  choice: debu
  rationale: Padanan harfiah yang mempertahankan gema penciptaan serta gambaran kerapuhan dan kefanaan manusia.
- source_word: אֲנָחְנוּ
  choice: kita ini
  rationale: Pronomina inklusif “kita” sesuai dengan pembicara yang menyertakan dirinya; partikel “ini” membuat klausa nominal “kita ini debu” alami dan tegas dalam bahasa Indonesia.
theological_decisions:
- issue: Gambaran antropologis tentang kerapuhan manusia
  choice: kita ini debu
  alternative: kita hanyalah debu
  rationale: Pilihan ini mempertahankan gambaran Ibrani tentang kefanaan dan kelemahan makhluk tanpa menambahkan penekanan “hanyalah,” yang dapat terdengar merendahkan martabat manusia lebih jauh daripada teks sumber.
- issue: Cakupan יִצְרֵנוּ
  choice: bagaimana kita dibentuk
  alternative: susunan tubuh kita
  rationale: Teks menunjuk pada keadaan manusia sebagai sesuatu yang dibentuk. Pilihan ini tidak mempersempit maknanya menjadi anatomi atau tubuh saja dan tetap menyisakan keluasan antropologis ungkapan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dipakai untuk Allah sesuai konteks. Struktur paralel kedua klausa dipertahankan, dan tanda titik koma mencerminkan hubungan erat di antara keduanya.
