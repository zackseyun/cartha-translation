  terminology: “Pujilah,” “Yahweh,” “para malaikat-Nya,” dan “firman-Nya” sesuai register baku-khidmat. Catatan kaki perlu diselaraskan dengan teks yang direvisi dan menjelaskan bahwa bentuknya lebih harfiah, tanpa memaksakan pilihan antara ‘mendengar’ dan ‘menaati’.
