  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: id
  text: Pujilah Yahweh, hai para malaikat-Nya, yang perkasa dalam kekuatan, yang melaksanakan firman-Nya ketika mendengar suara-Nya saat Dia berfirman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang melaksanakan firman-Nya dengan mendengarkan suara firman-Nya.” Kata Ibrani yang diterjemahkan “mendengarkan” juga dapat mencakup makna menaati.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak dari ברך. Dalam seruan ibadah kepada Allah, bahasa Indonesia secara alami memakai “pujilah”; pilihan ini menyampaikan tindakan memberkati atau memuliakan Yahweh tanpa ungkapan janggal “berkatilah Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: מַלְאָכָיו
  choice: para malaikat-Nya
  rationale: Dalam konteks surgawi ini, מַלְאָך menunjuk kepada makhluk surgawi. “Para malaikat-Nya” merupakan padanan yang jelas dan alami.
- source_word: גִּבֹּרֵי כֹחַ
  choice: kalian yang perkasa dan kuat
  rationale: Frasa konstruksi ini menggambarkan para malaikat sebagai sosok yang memiliki kekuatan besar. Sapaan “kalian” memperjelas bahwa imperatif jamak ditujukan kepada mereka, sedangkan “perkasa dan kuat” mempertahankan penekanan puitis pada daya mereka.
- source_word: עֹשֵׂי דְבָרוֹ
  choice: yang melaksanakan firman-Nya
  rationale: Partisipel ini menyatakan tindakan khas para malaikat. “Melaksanakan” lebih alami daripada “melakukan firman” dan tidak mempersempit דָּבָר secara khusus menjadi “perintah”.
- source_word: לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: dengan menaati suara firman-Nya
  rationale: Ungkapan שׁמע בקול lazim mencakup mendengar dengan tanggapan berupa ketaatan. “Menaati” menyampaikan daya idiomatisnya, sementara “suara firman-Nya” mempertahankan citra pendengaran dan pengulangan דְבָרוֹ.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna שׁמע dalam ungkapan לִשְׁמֹעַ בְּקוֹל
  choice: menaati
  alternative: mendengarkan
  rationale: Konteks menggambarkan para malaikat sebagai pelaksana firman Allah, sehingga unsur ketaatan tersirat kuat. Namun, arti harfiah yang berkaitan dengan mendengar tetap dicatat agar ketegangan semantis tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis serta khidmat. Seruan langsung dipertahankan dengan “hai” dan “kalian”; pengulangan “firman-Nya” dipertahankan karena terdapat dalam teks Ibrani. Penanda catatan kaki [a] dicantumkan dalam teks utama.
