base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: id
  text: Sejauh timur dari barat, sejauh itu pula Dia telah menjauhkan[a] pelanggaran[b] kita dari kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menempatkan jauh-jauh”.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “pelanggaran” juga dapat berarti “pemberontakan” atau “kesalahan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: Sejauh
  rationale: Gabungan כ dan bentuk infinitif רְחֹק memperkenalkan perbandingan jarak atau tingkat. “Sejauh” menyampaikan daya perbandingan itu secara alami dan ringkas dalam bahasa Indonesia.
- source_word: מִזְרָח
  choice: timur
  rationale: Kata ini menunjuk arah atau tempat terbitnya matahari. Dalam pasangan arah “timur ... barat”, bahasa Indonesia tidak memerlukan kata sandang.
- source_word: מִמַּעֲרָב
  choice: dari barat
  rationale: Preposisi מִן menyatakan titik pembanding jarak. Pasangan “timur dari barat” mempertahankan gambaran jarak yang sangat jauh.
- source_word: הִרְחִיק
  choice: Dia telah menjauhkan
  rationale: Bentuk Hifil dari רחק berarti membuat menjadi jauh atau menempatkan jauh. “Telah menjauhkan” mempertahankan makna kausatif dan menyatakan tindakan yang sudah dilakukan.
- source_word: מִמֶּנּוּ
  choice: dari kita
  rationale: Akhiran pronominal orang pertama jamak secara eksplisit menyatakan bahwa pelanggaran itu dijauhkan dari komunitas yang sedang berbicara.
- source_word: פְּשָׁעֵינוּ
  choice: pelanggaran-pelanggaran kita
  rationale: פשע dapat berarti pelanggaran, pemberontakan, atau kesalahan yang disengaja. “Pelanggaran-pelanggaran” mempertahankan bobot moral kata sumber tanpa mempersempitnya menjadi satu jenis dosa tertentu.
theological_decisions:
- issue: Metafora ruang bagi pengampunan
  choice: 'Mempertahankan gambaran pemisahan sejauh timur dari barat: Allah telah menjauhkan pelanggaran umat-Nya dari mereka.'
  alternative: Mengungkapkannya secara umum sebagai pengampunan tanpa gambaran jarak.
  rationale: Teks Ibrani secara eksplisit menghubungkan jarak timur–barat dengan tindakan menjauhkan pelanggaran. Metafora itu dipertahankan agar penekanan pada keluasan atau ketuntasan tindakan Allah tidak hilang, tanpa menjelaskan mekanismenya melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Struktur paralel “Sejauh ... sejauh itu pula ...” mempertahankan perbandingan puitis Ibrani. Kata ganti “Dia” jelas dan wajar, sedangkan pengulangan “kita ... dari kita” sengaja dipertahankan karena terdapat dalam sumber dan menegaskan pemisahan pelanggaran dari umat.
