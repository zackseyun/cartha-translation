id: PSA.103.8
reference: Psalms 103:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַח֣וּם וְ/חַנּ֣וּן יְהוָ֑ה אֶ֖רֶךְ אַפַּ֣יִם וְ/רַב חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/008.yaml
  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
translation:
  language: id
  text: Yahweh itu penyayang[a] dan pengasih, lambat marah dan berlimpah kasih setia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penuh belas kasihan.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani חָסֶד sering menyatakan kasih yang teguh dan loyal, termasuk kesetiaan dalam hubungan perjanjian; dapat juga diterjemahkan “kasih yang teguh” atau “kesetiaan penuh kasih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: penyayang
  rationale: Adjektiva ini menyatakan belas kasihan yang mendalam. “Penyayang” alami dalam bahasa Indonesia modern dan tetap menggambarkan sifat pribadi Yahweh.
- source_word: חַנּוּן
  choice: pengasih
  rationale: Kata ini menunjuk pada kesediaan memberikan kemurahan atau anugerah. “Pengasih” membedakannya dari belas kasihan pada kata sebelumnya tanpa membuat ungkapan menjadi kaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lambat marah
  rationale: Ini adalah padanan idiomatis yang jelas bagi ungkapan Ibrani yang secara harfiah berarti “panjang hidung,” yakni tidak lekas murka.
- source_word: רַב
  choice: berlimpah
  rationale: Dalam konstruksi ini kata tersebut menyatakan kelimpahan; “berlimpah” ringkas dan alami.
- source_word: חָסֶד
  choice: kasih setia
  rationale: Ungkapan ini mempertahankan unsur kasih sekaligus kesetiaan yang teguh, termasuk nuansa relasional dan perjanjian, tanpa mempersempit maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; bentuk “Yahweh” mempertahankannya sebagai nama pribadi.
- issue: Cakupan makna חָסֶד
  choice: kasih setia
  alternative: kasih yang teguh, kasih perjanjian, atau kesetiaan penuh kasih
  rationale: “Kasih setia” menjaga ketegangan antara kasih, keteguhan, dan loyalitas relasional tanpa membatasi istilah itu hanya pada satu rumusan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel Ibrani dipertahankan, sedangkan idiom אֶרֶךְ אַפַּיִם dialihkan secara alami menjadi “lambat marah.”
