  yaml_path: translation/ot/psalms/103/001.yaml
  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: id
  text: 'Milik Daud.


    Pujilah Yahweh, hai jiwaku,

    dan segenap batinku[a], pujilah nama-Nya yang kudus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh bagian dalamku”; dapat juga berarti “seluruh keberadaan batinku”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Konstruksi לְ dengan nama Daud menyatakan kaitan dengan Daud tanpa memastikan apakah ia penulis, penerima, atau pokok mazmur. “Dari Daud” ringkas dan sesuai sebagai judul puitis, meski ambiguitas sumber tidak dapat dipertahankan sepenuhnya dalam bahasa Indonesia.
- source_word: בָּרֲכִי
  choice: Pujilah
  rationale: Bentuk piel dari ברך secara harfiah berarti “berkatilah”. Namun, ketika manusia diarahkan untuk memberkati Allah, bahasa Indonesia alami mengungkapkan tindakan penghormatan dan pemuliaan itu dengan “pujilah”; “berkatilah Yahweh” mudah disalahpahami sebagai pemberian berkat kepada Allah.
- source_word: נַפְשִׁי
  choice: hai jiwaku
  rationale: נפש di sini adalah diri batin yang disapa oleh pemazmur. “Hai jiwaku” mempertahankan bentuk sapaan diri dan gaya puitis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
- source_word: וְכָל־קְרָבַי
  choice: dan segenap batinku
  rationale: Bentuk jamak קְרָבַי secara harfiah menunjuk pada seluruh bagian dalam tubuh atau seluruh keberadaan batin. “Segenap batinku” alami, menyeluruh, dan tetap puitis.
- source_word: שֵׁם קָדְשׁוֹ
  choice: nama-Nya yang kudus
  rationale: Frasa konstruksi ini secara harfiah berarti “nama kekudusan-Nya”. Ungkapan idiomatis “nama-Nya yang kudus” mempertahankan baik unsur nama maupun kekudusan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar.
- issue: Makna tindakan manusia ‘memberkati’ Allah
  choice: Pujilah
  alternative: Berkatilah
  rationale: ברך tetap menyatakan tindakan memuliakan dan mengagungkan Allah, tetapi “pujilah” menyampaikan maksud tersebut secara wajar dalam bahasa Indonesia dan menghindari kesan bahwa manusia menganugerahkan berkat kepada Allah.
translation_notes:
  register: Bahasa puitis yang lugas dan khidmat. Paralelisme dipertahankan dengan pengulangan “pujilah”, yang tersirat pada baris kedua dalam teks Ibrani. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan hormat dalam bahasa Indonesia.
