  yaml_path: translation/ot/psalms/103/002.yaml
  text: Bless Yahweh[a], O my soul, and do not forget all his benefits.
translation:
  language: id
  text: Pujilah Yahweh, hai jiwaku, dan jangan lupakan segala kebaikan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “segala tindakan-Nya” atau “segala balasan-Nya”; kata Ibrani ini dapat menunjuk secara luas pada apa yang diterima seseorang dari pihak lain, tetapi konteks di sini mendukung arti positif: “kebaikan-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Pujilah
  rationale: Bentuk imperatif feminin tunggal dari ברך yang ditujukan kepada jiwa pemazmur. Dalam bahasa Indonesia, “pujilah” menyampaikan tindakan memberkati Allah secara alami dan jelas; “berkatilah” dapat terdengar seolah-olah manusia memberikan berkat kepada Allah.
- source_word: נַפְשִׁי
  choice: hai jiwaku
  rationale: נפש di sini adalah diri pemazmur yang disapa langsung. “Hai jiwaku” mempertahankan daya vokatif dan corak puitisnya.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, sehingga nama perjanjian itu tetap tampak sebagai nama diri.
- source_word: וְאַל תִּשְׁכְּחִי
  choice: dan jangan lupakan
  rationale: Mencerminkan koordinasi dengan וְ dan larangan dengan אַל serta bentuk orang kedua feminin tunggal, yang tetap menyapa jiwa pemazmur.
- source_word: כָּל
  choice: segala
  rationale: “Segala” mempertahankan cakupan menyeluruh dari כָּל dan mengalir alami sebelum nomina abstrak.
- source_word: גְּמוּלָיו
  choice: kebaikan-Nya
  rationale: גמול dapat berarti tindakan, balasan, atau manfaat yang diterima. Dalam konteks syukur dan daftar tindakan penuh anugerah pada ayat-ayat berikutnya, “kebaikan-Nya” menyampaikan makna positif secara alami tanpa menjadikannya transaksional.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi secara langsung tanpa menggantinya dengan gelar.
- issue: Makna tindakan manusia terhadap Allah dalam ברך
  choice: Pujilah
  alternative: Berkatilah
  rationale: Kata Ibrani secara leksikal berarti “memberkati”, tetapi ketika Allah menjadi objeknya, bahasa Indonesia modern paling alami mengungkapkan tindakan itu sebagai memuji. Pilihan ini tidak menyiratkan bahwa manusia menganugerahkan berkat kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan khidmat. Sapaan “hai jiwaku” mempertahankan personifikasi dan bentuk seruan, sedangkan kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
