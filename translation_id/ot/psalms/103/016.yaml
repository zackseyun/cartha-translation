lexical_decisions:
- source_word: כִּי
  choice: Ketika
  rationale: Dalam gambaran umum tentang bunga yang fana, partikel ini dapat memperkenalkan keadaan atau peristiwa yang menyebabkan bunga lenyap. 'Ketika' menghasilkan alur yang alami dalam bahasa Indonesia tanpa meniadakan hubungan penjelas dengan ayat sebelumnya.
- source_word: רוּחַ
  choice: angin
  rationale: Konteks rumput dan bunga pada ayat sebelumnya paling wajar menunjuk kepada angin, meskipun kata Ibrani ini juga dapat berarti 'napas' atau 'roh'.
- source_word: עָבְרָה בּוֹ
  choice: melintasinya
  rationale: Ungkapan ringkas ini mempertahankan gambaran angin yang lewat melintasi atau menerpa bunga. Akhiran pronominal diterjemahkan secara nonpersonal sesuai gambaran tumbuhan.
- source_word: וְאֵינֶנּוּ
  choice: lenyaplah ia
  rationale: Secara harfiah berarti 'dan ia tidak ada'; 'lenyaplah ia' menyampaikan akibat dalam konteks secara alami dan puitis.
- source_word: וְלֹא יַכִּירֶנּוּ עוֹד
  choice: dan tempatnya tidak mengenalinya lagi
  rationale: 'Mempertahankan personifikasi Ibrani: tempat bunga itu digambarkan tidak lagi mengenali bunga yang telah lenyap.'
- source_word: מְקוֹמוֹ
  choice: tempatnya
  rationale: Pilihan ini menjaga bentuk padat teks Ibrani serta hubungan dengan bunga atau rumput yang disebut sebelumnya.
