base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/019.yaml
  text: Yahweh has established his throne in the heavens[b][a], and his kingdom rules over all.
translation:
  language: id
  text: Yahweh telah menegakkan takhta-Nya di surga[a], dan kerajaan-Nya berkuasa atas segala sesuatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di langit.” Dalam bahasa Ibrani, kata untuk “langit” berbentuk jamak.
    reason: lexical_alternative
  - marker: b
    text: Atau, “pemerintahan-Nya berkuasa atas segala sesuatu” atau “kekuasaan-Nya sebagai Raja berlaku atas segala sesuatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang diwakili oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: בַּשָּׁמַיִם
  choice: di surga
  rationale: Dalam bahasa Indonesia modern, bentuk idiomatis ini menyampaikan ranah surgawi; bentuk Ibrani secara gramatikal berwujud jamak, yang dicatat dalam catatan kaki.
- source_word: הֵכִין
  choice: telah menegakkan
  rationale: Bentuk Hifil dari כון menyatakan tindakan membuat teguh atau menetapkan; 'menegakkan' alami dalam konteks takhta kerajaan dan mempertahankan aspek perfektif.
- source_word: כִּסְאוֹ
  choice: takhta-Nya
  rationale: Padanan baku untuk takhta kerajaan; huruf kapital pada pronomina mengikuti kebiasaan penghormatan dalam bahasa Indonesia.
- source_word: וּמַלְכוּתוֹ
  choice: dan kerajaan-Nya
  rationale: מַלְכוּת dapat berarti kerajaan, pemerintahan, atau kekuasaan sebagai raja. 'Kerajaan-Nya' paling alami dalam teks utama, sementara alternatif penting dicatat.
- source_word: בַּכֹּל
  choice: atas segala sesuatu
  rationale: Bersama verba משל, frasa ini menyatakan cakupan kekuasaan yang menyeluruh secara alami dalam bahasa Indonesia.
- source_word: מָשָׁלָה
  choice: berkuasa
  rationale: Walaupun bentuk Ibraninya perfektif, dalam pernyataan puitis ini maknanya bersifat statif atau umum dan menyatakan kekuasaan yang terus berlaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Nama perjanjian dipertahankan sebagai nama pribadi, tanpa menggantinya dengan sebuah gelar.
- issue: Cakupan makna מַלְכוּת
  choice: kerajaan-Nya
  alternative: pemerintahan-Nya atau kekuasaan-Nya sebagai Raja
  rationale: Kata Ibrani dapat menunjuk pada kerajaan, pemerintahan, atau kedudukan sebagai raja. Teks utama memakai ungkapan Indonesia yang alami, sedangkan ketegangan leksikalnya dipertahankan melalui catatan.
- issue: Aspek מָשָׁלָה dalam pernyataan tentang kedaulatan Allah
  choice: berkuasa
  alternative: telah berkuasa
  rationale: Perfektif Ibrani di sini dapat menyatakan keadaan yang tetap atau kebenaran umum, bukan hanya tindakan yang selesai pada masa lampau. Bentuk kini paling alami tanpa membatasi kedaulatan itu pada satu waktu.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. 'Menegakkan takhta' mempertahankan citra kerajaan, sedangkan 'berkuasa atas segala sesuatu' menyampaikan pernyataan universal secara jelas. Semua penanda catatan kaki dicantumkan dalam teks utama.
