  text: עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה וּ֝/מִשְׁפָּטִ֗ים לְ/כָל עֲשׁוּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/006.yaml
  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: id
  text: Yahweh melakukan perbuatan-perbuatan benar dan menegakkan keadilan bagi semua orang yang tertindas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh melakukan tindakan-tindakan benar dan memberikan keputusan-keputusan hukum bagi semua orang yang tertindas.”
    reason: Alternatif ini mempertahankan bentuk jamak kedua nomina Ibrani dan nuansa yudisial מִשְׁפָּטִים secara lebih eksplisit.
lexical_decisions:
- source_word: עֹשֵׂה
  choice: melakukan … dan menegakkan
  rationale: Partisipel Qal ini menggambarkan tindakan Yahweh yang menjadi ciri-Nya dan terus berlangsung. Verba disesuaikan secara alami dengan kedua objek dalam bahasa Indonesia.
- source_word: צְדָקוֹת
  choice: perbuatan-perbuatan benar
  rationale: Bentuk jamak dapat menunjuk pada tindakan nyata yang benar atau adil. Pilihan ini mempertahankan unsur tindakan dan membedakannya dari מִשְׁפָּטִים.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar seperti TUHAN.
- source_word: וּמִשְׁפָּטִים
  choice: dan menegakkan keadilan
  rationale: Dalam konteks ini bentuk jamak menunjuk secara kolektif pada tindakan atau keputusan hukum yang mewujudkan keadilan. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: לְכָל
  choice: bagi semua
  rationale: Preposisi לְ menandai pihak yang menerima manfaat, dan כָל mencakup seluruh kelompok.
- source_word: עֲשׁוּקִים
  choice: orang yang tertindas
  rationale: Partisipel pasif ini merujuk pada orang-orang yang mengalami penindasan, pemerasan, atau perlakuan sewenang-wenang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan antara צְדָקוֹת dan מִשְׁפָּטִים
  choice: perbuatan-perbuatan benar dan menegakkan keadilan
  alternative: kebenaran dan keputusan-keputusan hukum
  rationale: 'Kedua istilah yang berdekatan tetap dibedakan: yang pertama menekankan tindakan benar, sedangkan yang kedua menekankan pelaksanaan keadilan. Terjemahan tidak menyamakan keduanya secara penuh.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “menegakkan keadilan” dipilih agar hubungan tindakan Yahweh dengan kepentingan orang tertindas terdengar jelas dan alami.
