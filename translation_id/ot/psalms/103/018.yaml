lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: orang-orang yang memegang
  rationale: Partisipel שׁמר dapat berarti menjaga, memelihara, atau menaati. Dalam konteks perjanjian, 'memegang' secara alami menyatakan kesetiaan dan ketaatan berkelanjutan.
- source_word: בְרִיתוֹ
  choice: perjanjian-Nya
  rationale: בְּרִית adalah istilah baku untuk ikatan perjanjian Allah dengan umat-Nya; 'perjanjian' mempertahankan bobot relasional dan teologisnya.
- source_word: וּלְזֹכְרֵי
  choice: dan kepada orang-orang yang mengingat
  rationale: זכר menyatakan tindakan mengingat dengan perhatian yang nyata. Terjemahan 'mengingat' mempertahankan ungkapan sumber, sedangkan frasa berikutnya memperjelas bahwa ingatan itu menghasilkan tindakan.
- source_word: פִקֻּדָיו
  choice: titah-titah-Nya
  rationale: פִּקּוּדִים menunjuk pada ketetapan atau arahan yang dipercayakan dan wajib ditaati. 'Titah-titah' cukup khas untuk membedakannya dari istilah Taurat lain serta tetap mudah dipahami.
- source_word: לַעֲשׂוֹתָם
  choice: untuk melakukannya
  rationale: Infinitif dengan לְ menyatakan tujuan atau orientasi tindakan. 'Untuk melakukannya' alami dalam bahasa Indonesia dan mempertahankan hubungan langsung antara mengingat dan melaksanakan.
theological_decisions:
- issue: Daya etis kata 'mengingat' dalam hubungannya dengan titah Allah
  choice: '''mengingat titah-titah-Nya untuk melakukannya'''
  alternative: '''mengingat titah-titah-Nya, lalu melakukannya'''
  rationale: Susunan Ibrani menghubungkan ingatan dengan pelaksanaan tanpa menjadikannya dua tindakan yang terpisah secara tegas. Terjemahan ini mempertahankan ketaatan praktis yang dimaksud teks tanpa menambahkan kerangka teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk jamak ulang dipakai untuk mencerminkan partisipel jamak dan nomina jamak Ibrani. Akhiran pronominal '-Nya' memakai huruf kapital karena merujuk kepada Allah.
