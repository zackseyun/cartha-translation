  yaml_path: translation/ot/psalms/103/000.yaml
  text: Of David. Bless the LORD, O my soul, and all that is within me[a], bless his holy name.
translation:
  language: id
  text: 'Dari Daud.


    Pujilah TUHAN, hai jiwaku! Biarlah seluruh batinku[a] memuji nama-Nya yang kudus!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh bagian dalamku”; dapat juga berarti “seluruh keberadaan batinku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Konstruksi לְ pada judul mazmur dapat menandai kepengarangan, hubungan, atau peruntukan. 'Dari Daud' alami dalam bahasa Indonesia dan tidak mempersempitnya secara berlebihan.
- source_word: בָּרֲכִי
  choice: Pujilah
  rationale: Dalam seruan manusia kepada Allah, ברך secara idiomatis berarti memuji atau memberkati Allah; 'pujilah' merupakan ungkapan Indonesia yang paling alami dalam konteks ini.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפשׁ di sini menunjuk diri batin atau keseluruhan pribadi pemazmur yang diajak berbicara; 'jiwaku' mempertahankan gambaran puitis sumber.
- source_word: כָל־קְרָבַי
  choice: seluruh batinku
  rationale: Secara harfiah berarti 'seluruh bagian dalamku'; dalam konteks puitis, frasa ini mengacu pada seluruh keberadaan batin. 'Seluruh batinku' alami sekaligus mempertahankan citra internalnya.
- source_word: שֵׁם קָדְשׁוֹ
  choice: nama-Nya yang kudus
  rationale: Terjemahan langsung dan wajar yang mempertahankan hubungan posesif serta sifat kudus dari nama ilahi.
theological_decisions:
- issue: Penyajian tetragramaton יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: Memakai konvensi Alkitab bahasa Indonesia yang mapan untuk nama perjanjian ilahi, dengan huruf kapital untuk membedakannya dari gelar umum 'Tuhan'.
- issue: Subjek tersirat pada klausa kedua
  choice: Biarlah seluruh batinku memuji
  alternative: dan seluruh batinku, [pujilah]
  rationale: Teks Ibrani melanjutkan perintah pertama secara eliptis. Pengulangan verba secara eksplisit dalam bahasa Indonesia memperjelas sintaksis tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Sapaan 'hai jiwaku' mempertahankan apostrof puitis Ibrani, sedangkan pembagian judul dan isi menjaga kejelasan struktur.
