  yaml_path: translation/ot/psalms/103/010.yaml
  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: id
  text: Ia tidak memperlakukan kita setimpal dengan dosa-dosa kita[a], dan tidak membalas kita setimpal dengan kesalahan-kesalahan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia tidak berbuat kepada kita sebagaimana yang patut kita terima karena dosa-dosa kita, dan tidak membalas kita sebagaimana yang patut kita terima karena kesalahan-kesalahan kita.”'
    reason: Alternatif ini menyatakan bentuk perbandingan Ibrani secara lebih eksplisit, termasuk gagasan bahwa dosa dan kesalahan merupakan ukuran bagi perlakuan atau balasan yang patut diterima.
lexical_decisions:
- source_word: כַחֲטָאֵינוּ
  choice: setimpal dengan dosa-dosa kita
  rationale: Prefiks כ menyatakan perbandingan atau ukuran. Ungkapan “setimpal dengan” secara alami menyampaikan bahwa perlakuan Allah tidak sebanding dengan dosa yang dilakukan.
- source_word: עָשָׂה לָנוּ
  choice: memperlakukan kita
  rationale: Secara harfiah berarti “berbuat kepada kita”; dalam konteks ini, “memperlakukan kita” menyampaikan tindakan Allah terhadap umat dengan jelas dan wajar.
- source_word: וְלֹא
  choice: dan tidak
  rationale: Mempertahankan penghubung serta negasi pada larik kedua dan menghasilkan kesejajaran yang alami dalam bahasa Indonesia.
- source_word: כַעֲוֺנֹתֵינוּ
  choice: setimpal dengan kesalahan-kesalahan kita
  rationale: עָוֹן dapat menunjuk pada kesalahan, kebengkokan moral, atau kesalahan beserta tanggungannya. “Kesalahan-kesalahan” cukup luas dan tetap membedakannya dari חֲטָאִים, “dosa-dosa,” pada larik pertama.
- source_word: גָּמַל עָלֵינוּ
  choice: membalas kita
  rationale: גמל di sini menyatakan pemberian balasan sesuai perbuatan. “Membalas kita” jelas, mudah dipahami, dan tidak memberi kesan positif yang dapat muncul dari kata “mengganjar.”
- source_word: לֹא ... וְלֹא
  choice: tidak ... dan tidak
  rationale: Negasi berulang dipertahankan untuk menampilkan dua larik penyangkalan yang sejajar.
theological_decisions:
- issue: Pernyataan tentang belas kasihan Allah tanpa memasukkan teori tertentu mengenai pendamaian atau waktu penghakiman
  choice: Allah tidak memperlakukan atau membalas umat-Nya setimpal dengan dosa dan kesalahan mereka
  alternative: Membatasi pernyataan ini hanya pada hukuman selama hidup di dunia, atau memahaminya sebagai penyangkalan mutlak terhadap segala penghakiman ilahi
  rationale: Teks Ibrani berbicara secara umum tentang kemurahan Allah dalam perlakuan-Nya. Terjemahan tidak mempersempit maupun memperluas klaim ayat melampaui yang dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “Ia” mengikuti gaya sastra mazmur. Kesejajaran kedua larik dipertahankan, sementara “setimpal dengan” memperjelas gagasan ukuran atau proporsi tanpa menambahkan penafsiran doktrinal.
