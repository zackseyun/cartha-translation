lexical_decisions:
- source_word: הַסֹּלֵחַ
  choice: Dia yang mengampuni
  rationale: Partisip berartikel ini berfungsi secara substantival dan menggambarkan tindakan khas TUHAN. Frasa ini alami dalam bahasa Indonesia serta mempertahankan kesejajaran dengan klausa berikutnya.
- source_word: לְכָל
  choice: segala
  rationale: Dalam kedua klausa, 'segala' menyampaikan cakupan menyeluruh secara alami dan bermartabat.
- source_word: עֲוֺנֵכִי
  choice: kesalahanmu
  rationale: Kata עָוֹן dapat menunjuk pada kesalahan moral, dosa, kesalahan sebagai status bersalah, atau akibat yang ditanggung. 'Kesalahanmu' mempertahankan bobot moral tanpa membatasi maknanya hanya pada perbuatan atau hukumannya.
- source_word: הָרֹפֵא
  choice: yang menyembuhkan
  rationale: Seperti partisip pertama, bentuk ini menggambarkan tindakan khas TUHAN dan diterjemahkan dengan struktur relatif yang sejajar.
- source_word: תַּחֲלֻאָיִכִי
  choice: penyakitmu
  rationale: Nomina ini secara konkret berarti penyakit atau keadaan sakit. 'Penyakitmu' jelas, lazim, dan tidak meniadakan kemungkinan jangkauan puitis yang lebih luas.
theological_decisions:
- issue: Apakah bahasa penyembuhan harus dirohanikan dalam terjemahan
  choice: Mempertahankan ungkapan konkret 'menyembuhkan segala penyakitmu' tanpa membatasinya pada penyembuhan jasmani ataupun rohani.
  alternative: Menerjemahkannya sebagai penyembuhan penyakit rohani atau memakai istilah yang sengaja lebih metaforis.
  rationale: Bahasa Ibrani secara wajar menunjuk pada penyakit, sedangkan konteks puitis dapat mengundang penerapan yang lebih luas. Terjemahan tidak seharusnya menyelesaikan keterbukaan ini secara interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pengulangan 'segala' mempertahankan kesejajaran serta cakupan komprehensif kedua klausa; pronomina tunggal '-mu' mengikuti sapaan kepada diri pemazmur dalam konteks mazmur.
