  text: אֱ֭נוֹשׁ כֶּ/חָצִ֣יר יָמָ֑י/ו כְּ/צִ֥יץ הַ֝/שָּׂדֶ֗ה כֵּ֣ן יָצִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/015.yaml
  text: As for man[a], his days are like grass; he flourishes like a flower of the field.
translation:
  language: id
  text: Manusia—hari-harinya seperti rumput; seperti bunga di padang, demikianlah ia mekar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “demikianlah ia berbunga.” Kata kerja Ibrani ini menggambarkan bunga yang sedang mekar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Kata ini menunjuk kepada manusia sebagai makhluk yang lemah dan fana. “Manusia” wajar dalam bahasa Indonesia, mempertahankan acuan umum, dan tidak menambahkan unsur “fana” secara eksplisit karena kefanaan sudah tergambar melalui perumpamaan rumput dan bunga.
- source_word: כֶּחָצִיר
  choice: seperti rumput
  rationale: Prefiks כ menyatakan perbandingan; “seperti rumput” merupakan padanan Indonesia yang alami dan tepat.
- source_word: יָמָיו
  choice: hari-harinya
  rationale: Terjemahan langsung bentuk jamak dengan sufiks orang ketiga tunggal; ungkapan ini menunjuk kepada masa hidup manusia.
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: seperti bunga di padang
  rationale: צִיץ berarti bunga atau kuntum, sedangkan הַשָּׂדֶה menunjuk pada padang. “Bunga di padang” mempertahankan citra sumber tanpa mempersempitnya menjadi jenis bunga tertentu.
- source_word: כֵּן
  choice: demikianlah
  rationale: Padanan ini mempertahankan unsur eksplisit “begitu/demikian” yang menghubungkan manusia dengan gambaran bunga di padang.
- source_word: יָצִיץ
  choice: ia berkembang
  rationale: Verba ini menggambarkan tumbuh atau mekarnya bunga. “Berkembang” dapat berarti mekar dan juga dapat diterapkan secara puitis kepada manusia; catatan kaki menjelaskan citra harfiahnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Tanda pisah setelah “Manusia” mencerminkan penonjolan topik dalam susunan Ibrani. Kata ganti “ia” mempertahankan bentuk tunggal generik tanpa memakai bentuk bergender.
