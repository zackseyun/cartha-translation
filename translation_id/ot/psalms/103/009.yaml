  text: He will not contend forever[b][a], nor will he keep his anger for all time.
translation:
  language: id
  text: Ia tidak akan selamanya berbantah[a], dan tidak akan mendendam untuk selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berselisih” atau “berperkara.” Kata Ibrani ini dapat berarti berbantah, berselisih, atau mengajukan perkara.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini secara harfiah berarti “menyimpan” atau “menjaga”; dalam konteks ini dapat berarti menyimpan murka atau dendam.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  choice: terus-menerus
  rationale: Dalam konstruksi dengan לְ, נֶצַח menyatakan berlangsungnya sesuatu tanpa henti atau untuk waktu yang sangat panjang. “Terus-menerus” wajar dalam bahasa Indonesia dan membentuk kesejajaran makna dengan “untuk selama-lamanya” pada baris kedua tanpa pengulangan yang kaku.
- source_word: יָרִיב
  choice: menuntut
  rationale: Bentuk dari ריב dapat berarti berbantah, berperkara, atau mengajukan tuntutan. “Menuntut” mempertahankan nuansa perselisihan dan hukum tanpa mengharuskan gambaran ruang pengadilan secara harfiah.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: עוֹלָם menunjuk pada jangka waktu yang tidak terbatas atau berkepanjangan. Ungkapan ini alami dan bermartabat dalam puisi Indonesia serta sejalan dengan לָנֶצַח.
- source_word: יִטּוֹר
  choice: mendendam
  rationale: נטר pada dasarnya berarti menyimpan atau menjaga, tetapi ketika objeknya tersirat dalam konteks kemarahan, maknanya ialah menyimpan murka atau dendam. “Mendendam” menyampaikan idiom itu secara alami sambil tidak menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
theological_decisions:
- issue: Apakah objek dari tindakan menuntut dan menyimpan perlu dinyatakan secara eksplisit
  choice: Objek tetap tidak disebutkan, seperti dalam teks Ibrani; “mendendam” menyampaikan makna kontekstual tanpa menambahkan frasa “amarah-Nya”.
  alternative: Dia tidak akan terus-menerus menuntut, dan tidak akan menyimpan amarah-Nya untuk selama-lamanya.
  rationale: Konteks mazmur menunjuk pada murka Allah, tetapi ayat ini sendiri tidak menyebut objek setelah יִטּוֹר. Membiarkannya tersirat mempertahankan kepadatan puitis dan tidak membuat hal yang implisit menjadi eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. “Dia” merujuk kepada TUHAN dalam konteks mazmur. Dua keterangan waktu yang berbeda mempertahankan kesejajaran Ibrani tanpa pengulangan yang terasa kaku.
