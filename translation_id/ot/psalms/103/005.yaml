  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “perhiasanmu”. Frasa ini sulit; banyak orang memahaminya dalam arti “yang memuaskanmu dengan hal-hal baik sepanjang hidupmu”, sedangkan menurut tradisi penafsiran lain, “yang memuaskan mulutmu dengan kebaikan”.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani ini menamai burung pemangsa besar dan secara tradisional diterjemahkan “rajawali”; identifikasi zoologisnya tidak pasti dan mungkin menunjuk jenis burung nasar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  choice: yang memuaskanmu
  rationale: Partisipel Hifil dari שׂבע melanjutkan rangkaian tindakan TUHAN. “Memuaskan” menyatakan pemberian sampai berkecukupan; akhiran “-mu” mengungkapkan orang yang dipuaskan dalam keseluruhan frasa.
- source_word: בַּטּוֹב
  choice: dengan kebaikan
  rationale: טוֹב dipakai secara substantival. “Kebaikan” mempertahankan bentuk kolektif dan tidak membatasi pemberian itu pada benda-benda tertentu.
- source_word: עֶדְיֵךְ
  choice: -mu (dalam “memuaskanmu”)
  rationale: Bentuk Masoret secara biasa berarti “perhiasanmu”, tetapi frasa ini sulit. Terjemahan idiomatis menampilkan makna kontekstual bahwa orang yang disapa dipuaskan, sementara masalah tekstual dan tafsiran alternatif dipertahankan dalam catatan kaki.
- source_word: תִּתְחַדֵּשׁ
  choice: diperbarui
  rationale: Bentuk Hitpael imperfek dari חדש memiliki nuansa pasif-refleksif. “Diperbarui” alami dalam bahasa Indonesia dan tidak menentukan pelaku secara eksplisit.
- source_word: כַּנֶּשֶׁר
  choice: seperti rajawali
  rationale: נֶשֶׁר menunjuk burung pemangsa besar dan secara tradisional diterjemahkan “rajawali”; identifikasi zoologisnya dapat mencakup jenis burung nasar, sehingga alternatif dicatat.
- source_word: נְעוּרָיִכִי
  choice: masa mudamu
  rationale: Nomina abstrak berbentuk jamak dengan sufiks orang kedua feminin tunggal menyatakan masa muda atau daya hidup kaum muda. “Masa mudamu” mempertahankan ungkapan puitis tanpa mempersempitnya menjadi umur kronologis saja.
