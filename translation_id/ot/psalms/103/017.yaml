id: PSA.103.17
reference: Psalms 103:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/חֶ֤סֶד יְהוָ֨ה מֵ/עוֹלָ֣ם וְ/עַד ע֭וֹלָם עַל יְרֵאָ֑י/ו וְ֝/צִדְקָת֗/וֹ לִ/בְנֵ֥י בָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/017.yaml
  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: id
  text: Namun, kasih setia Yahweh terhadap orang-orang yang takut kepada-Nya berlangsung dari kekekalan sampai kekekalan, dan kebenaran-Nya juga sampai kepada anak cucu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחֶסֶד
  choice: Namun, kasih setia
  rationale: חֶסֶד menunjuk pada kasih yang teguh, setia, dan bercorak perjanjian. “Kasih setia” merupakan padanan Indonesia yang alami dan luas. Kata penghubung וְ diterjemahkan “Namun” untuk menyatakan kontras dengan singkatnya hidup manusia pada ayat sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: dari selama-lamanya sampai selama-lamanya
  rationale: Ungkapan berpasangan ini menyatakan rentang waktu tanpa batas ke kedua arah dan mempertahankan pengulangan puitis teks Ibrani.
- source_word: עַל
  choice: terhadap
  rationale: Dalam konteks ini עַל menandai orang-orang yang menjadi sasaran kasih setia Yahweh. “Terhadap” lebih wajar dalam bahasa Indonesia daripada terjemahan spasial “atas”.
- source_word: יְרֵאָיו
  choice: orang-orang yang takut kepada-Nya
  rationale: Padanan ini mempertahankan kata “takut” beserta nuansa hormat dan gentar di hadapan Allah, tanpa mempersempitnya menjadi sekadar rasa hormat.
- source_word: וְצִדְקָתוֹ
  choice: dan kebenaran-Nya
  rationale: צְדָקָה dapat menyatakan kebenaran atau keadilan. “Kebenaran” mempertahankan cakupan moral dan relasional yang lebih luas dalam paralel dengan kasih setia, sedangkan “keadilan” dicatat sebagai alternatif.
- source_word: לִבְנֵי בָנִים
  choice: sampai kepada anak cucu
  rationale: Ungkapan harfiah “anak-anak dari anak-anak” menyatakan kelanjutan antargenerasi. “Anak cucu” adalah ungkapan Indonesia yang alami dan tetap mempertahankan gambaran generasional.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Makna צְדָקָה dalam konteks puitis ini
  choice: kebenaran
  alternative: keadilan
  rationale: Dalam kesejajaran dengan kasih setia Yahweh dan jangkauannya lintas generasi, “kebenaran” menjaga makna yang lebih luas tentang kelurusan dan kesetiaan moral-Nya. “Keadilan” tetap merupakan kemungkinan leksikal yang sah dan karena itu dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa pertama disesuaikan agar hubungan antara kasih setia Yahweh dan orang-orang yang takut kepada-Nya terdengar alami, sementara kontras, pengulangan puitis, nama ilahi, dan ketegangan leksikal pada צְדָקָה tetap dipertahankan.
