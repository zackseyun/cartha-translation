id: PSA.103.7
reference: Psalms 103:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יוֹדִ֣יעַ דְּרָכָ֣י/ו לְ/מֹשֶׁ֑ה לִ/בְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/007.yaml
  text: He made his ways known to Moses[a], his deeds to the sons of Israel.
translation:
  language: id
  text: Ia memberitahukan jalan-jalan-Nya kepada Musa, perbuatan-perbuatan-Nya kepada bani Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak Israel” atau “umat Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדִיעַ
  choice: memberitahukan
  rationale: Bentuk Hifil dari ידע menyatakan tindakan menyebabkan orang mengetahui atau membuat sesuatu diketahui. 'Memberitahukan' alami dalam bahasa Indonesia dan mempertahankan makna kausatif.
- source_word: דְּרָכָיו
  choice: jalan-jalan-Nya
  rationale: Bentuk jamak ini secara harfiah berarti 'jalan-jalan-Nya' dan secara kiasan menunjuk pada cara atau pola tindakan Allah. Pilihan ini mempertahankan metafora Ibrani.
- source_word: לְמֹשֶׁה
  choice: kepada Musa
  rationale: Frasa berpreposisi ini menunjukkan Musa sebagai penerima pemberitahuan.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada bani Israel
  rationale: '''Bani Israel'' merupakan ungkapan Indonesia yang baku dan dikenal luas untuk kelompok keturunan Israel, serta tetap dekat dengan ungkapan Ibrani harfiah ''anak-anak lelaki Israel'' tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.'
- source_word: עֲלִילוֹתָיו
  choice: perbuatan-perbuatan-Nya
  rationale: Nomina ini berarti tindakan atau perbuatan. Terjemahan ini tidak menambahkan sifat 'perkasa' yang tidak dinyatakan secara eksplisit oleh katanya.
theological_decisions:
- issue: Cakupan ungkapan kolektif בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: anak-anak Israel; umat Israel
  rationale: Walaupun bentuk Ibraninya secara tata bahasa maskulin dan secara harfiah berarti 'anak-anak lelaki Israel', ungkapan tersebut merupakan sebutan kolektif bagi keturunan atau umat Israel. 'Bani Israel' mempertahankan idiom genealogis dan cakupan kolektifnya tanpa mempersempit rujukan kepada kaum laki-laki saja.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pengulangan 'jalan-jalan-Nya' dan 'perbuatan-perbuatan-Nya' mempertahankan bentuk jamak serta kesejajaran puisi Ibrani. Pronomina 'Ia' merujuk kepada TUHAN dalam konteks mazmur.
