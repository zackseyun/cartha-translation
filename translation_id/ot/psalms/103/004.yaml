lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: yang menebus
  rationale: Partisipel dari גאל menyatakan tindakan menebus atau membebaskan. 'Menebus' mempertahankan daya teologis dan nuansa penyelamatan tanpa mempersempitnya pada pranata penebus kerabat.
- source_word: מִשַּׁחַת
  choice: dari liang kubur
  rationale: שַׁחַת dapat berarti liang, kubur, atau kebinasaan. 'Liang kubur' alami dalam puisi Indonesia dan mempertahankan gambaran ancaman maut; alternatif yang lebih umum dicatat dalam catatan kaki.
- source_word: חַיָּיִכִי
  choice: hidupmu
  rationale: Bentuk Ibrani menunjuk pada kehidupan orang itu secara utuh. 'Hidupmu' alami dalam bahasa Indonesia dan tidak memasukkan gagasan jiwa tak berwujud yang tidak dituntut konteks.
- source_word: הַמְעַטְּרֵכִי
  choice: yang memahkotai engkau
  rationale: עטר berarti memahkotai atau mengelilingi sebagai bentuk penghormatan. 'Memahkotai' mempertahankan metafora penganugerahan kehormatan.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: חֶסֶד mencakup kasih yang teguh, loyal, dan berkomitmen. 'Kasih setia' merupakan padanan Indonesia yang jelas, wajar, dan kaya secara teologis tanpa terlalu menjelaskan.
- source_word: וְרַחֲמִים
  choice: dan belas kasihan
  rationale: רַחֲמִים menyatakan belas kasih yang mendalam dan dapat mencakup tindakan-tindakan kemurahan. Bentuk abstrak 'belas kasihan' paling alami dalam bahasa Indonesia, sementara kemungkinan 'rahmat' dicatat sebagai alternatif.
theological_decisions:
- issue: Cakupan gambaran penebusan
  choice: Pembebasan dari ancaman maut atau kehancuran yang dinyatakan secara puitis, tanpa dibatasi hanya pada penyelamatan jasmani ataupun keselamatan akhir.
  alternative: Secara khusus pembebasan dari kubur; atau keselamatan rohani secara luas.
  rationale: Bahasa puisi ini dapat mencakup penyelamatan hidup dari kebinasaan. Terjemahan mempertahankan keluasan itu dan tidak menetapkannya sebagai satu kategori doktrinal saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis dan khidmat. Pronomina 'engkau' mempertahankan sapaan tunggal yang sesuai bagi mazmur; 'hidupmu' dibuat rapat sebagai bentuk posesif alami.
