  text: כְּ/רַחֵ֣ם אָ֭ב עַל בָּנִ֑ים רִחַ֥ם יְ֝הוָ֗ה עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: id
  text: Seperti seorang ayah berbelas kasih kepada anak-anaknya,[a] demikianlah Yahweh berbelas kasih kepada orang-orang yang takut kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seperti seorang ayah menyayangi anak-anaknya, demikianlah Yahweh menyayangi orang-orang yang takut kepada-Nya.”
    reason: Alternatif leksikal; “menyayangi” menekankan kasih sayang dalam gambaran hubungan ayah dan anak, sedangkan “berbelas kasih” lebih langsung mencerminkan nuansa akar Ibrani רָחַם.
lexical_decisions:
- source_word: כְּרַחֵם
  choice: Seperti ... menyayangi
  rationale: Prefiks כְּ menyatakan perbandingan, sedangkan רחם menunjuk pada belas kasih yang dalam dan lembut. Dalam hubungan ayah-anak, 'menyayangi' terdengar alami dalam bahasa Indonesia dan tetap menyampaikan kehangatan belas kasih.
- source_word: אָב
  choice: seorang ayah
  rationale: Nomina tunggal ini bersifat umum, sehingga 'seorang ayah' sesuai dengan bentuk perbandingan yang menggambarkan kebenaran umum.
- source_word: עַל
  choice: menyayangi (objek langsung)
  rationale: Dengan verba רחם, עַל menandai sasaran belas kasih. Bahasa Indonesia secara alami memakai verba transitif 'menyayangi' tanpa menerjemahkan preposisi itu secara terpisah.
- source_word: בָּנִים
  choice: anak-anaknya
  rationale: Bentuk jamak maskulin ini dalam konteks keluarga merujuk secara umum kepada keturunan atau anak-anak. Akhiran '-nya' memperjelas hubungan mereka dengan ayah dalam perbandingan tersebut.
- source_word: רִחַם
  choice: menyayangi
  rationale: Pilihan yang sama dipertahankan pada kedua kemunculan akar רחם untuk menjaga pengulangan puitis. Bentuk kini menyampaikan kebenaran umum yang dinyatakan oleh ayat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: יְרֵאָיו
  choice: orang-orang yang takut kepada-Nya
  rationale: Bentuk ini menunjuk kepada mereka yang bercirikan takut akan Yahweh. 'Takut kepada-Nya' mempertahankan ungkapan langsung teks tanpa melunakkannya menjadi hanya 'menghormati'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi; 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Cakupan bahasa keluarga בָּנִים
  choice: anak-anaknya
  alternative: anak-anak lelakinya
  rationale: Dalam perbandingan ayah dan keturunannya, bentuk jamak maskulin ini bersifat generik. 'Anak-anaknya' mencakup rujukan yang dimaksud tanpa membatasi makna pada laki-laki.
- issue: Makna takut dalam יְרֵאָיו
  choice: takut kepada-Nya
  alternative: menghormati-Nya
  rationale: Kata 'takut' mempertahankan ketegangan teologis istilah Ibrani, yang dapat mencakup rasa gentar sekaligus hormat, tanpa menyempitkannya menjadi penghormatan semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur perbandingan serta pengulangan puitis akar רחם dipertahankan. Bentuk 'kepada-Nya' mengikuti ejaan hormat yang lazim untuk rujukan kepada Allah.
