base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: id
  text: Pujilah Yahweh[a], segala karya-Nya, di seluruh wilayah kekuasaan-Nya[b]. Pujilah Yahweh, hai jiwaku!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Berkatilah Yahweh.” Dalam konteks ini, kata Ibrani itu berarti memuji atau mengagungkan Dia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di segala tempat pemerintahan-Nya”; yakni, di mana pun kekuasaan-Nya berlaku.
    reason: clarification
lexical_decisions:
- source_word: בָּרֲכוּ / בָּרֲכִי
  choice: Pujilah
  rationale: Dalam seruan yang diarahkan kepada Allah, verba ברך secara idiomatis berarti memuji atau mengagungkan. “Pujilah” terdengar alami dalam bahasa Indonesia dan tetap mempertahankan pengulangan liturgis pada kedua klausa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: כָּל מַעֲשָׂיו
  choice: segala karya-Nya
  rationale: מַעֲשֶׂה mencakup secara luas segala sesuatu yang Allah kerjakan atau jadikan. “Karya” mempertahankan keluasan itu tanpa membatasinya hanya pada perbuatan atau benda ciptaan.
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: di segala tempat kekuasaan-Nya
  rationale: Mempertahankan unsur tempat dan gagasan pemerintahan atau kekuasaan Allah, sambil menyatakan bahwa seruan ini berlaku di mana pun pemerintahan-Nya menjangkau.
- source_word: נַפְשִׁי
  choice: hai jiwaku
  rationale: Bentuk sapaan kepada diri sendiri dipertahankan dengan partikel vokatif “hai”, sesuai dengan gaya puisi yang luhur tetapi tetap mudah dipahami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menyebut nama perjanjian Allah secara langsung; “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar umum.
- issue: Makna ברך ketika ciptaan atau jiwa diarahkan kepada Allah
  choice: Pujilah
  alternative: Berkatilah
  rationale: Allah bukan penerima berkat dalam arti memperoleh karunia dari pihak yang lebih tinggi. Dalam konteks ini, ברך menyatakan pujian dan pengagungan, sehingga “Pujilah” menyampaikan fungsi ungkapan itu secara alami tanpa menghilangkan alternatif harfiahnya.
translation_notes:
  register: Bahasa puitis, khidmat, dan modern. Sapaan “hai” mempertahankan bentuk vokatif mazmur, sedangkan pengulangan “Pujilah Yahweh” menjaga bingkai liturgis ayat dan keseluruhan mazmur.
