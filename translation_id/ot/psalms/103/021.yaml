id: PSA.103.21
reference: Psalms 103:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּרֲכ֣וּ יְ֭הוָה כָּל צְבָאָ֑י/ו מְ֝שָׁרְתָ֗י/ו עֹשֵׂ֥י רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: id
  text: Pujilah Yahweh, hai seluruh bala tentara-Nya[a], para pelayan-Nya[b] yang melaksanakan kehendak-Nya!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seluruh pasukan-Nya” atau “seluruh bala tentara surgawi-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hamba-hamba-Nya” atau “mereka yang melayani-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak dari ברך. Ketika manusia atau makhluk surgawi menjadi subjek dan Yahweh menjadi objek, bahasa Indonesia alami menyatakan tindakan ini dengan “pujilah”; makna seruan penghormatan kepada Allah tetap terpelihara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כָּל צְבָאָיו
  choice: seluruh bala tentara-Nya
  rationale: כָּל menyatakan keseluruhan, sedangkan צָבָא dapat berarti bala tentara atau pasukan. Konteks ayat sebelumnya mengarah kepada bala tentara surgawi, tetapi teks utama tidak mempersempitnya secara eksplisit.
- source_word: מְשָׁרְתָיו
  choice: para pelayan-Nya
  rationale: Partisip dari שׁרת menunjuk kepada mereka yang melayani dalam kapasitas resmi. “Para pelayan-Nya” alami dalam bahasa Indonesia dan tetap mencerminkan kedudukan pelayanan tersebut.
- source_word: עֹשֵׂי רְצוֹנוֹ
  choice: yang melaksanakan kehendak-Nya
  rationale: Partisip עֹשֵׂי diterjemahkan sebagai klausa relatif. “Melaksanakan kehendak-Nya” menyampaikan tindakan menaati dan menjalankan apa yang dikehendaki Allah.
theological_decisions:
- issue: Rujukan “bala tentara-Nya” dan “para pelayan-Nya”
  choice: Bahasa teks utama dibiarkan cukup luas, dengan konteks yang terutama menunjuk kepada makhluk surgawi atau para pelayan malaikat.
  alternative: Para pelayan Allah di bumi secara lebih umum.
  rationale: Mazmur 103:20 secara langsung menyapa para malaikat, sehingga ayat 21 kemungkinan besar meneruskan seruan kepada sidang surgawi. Namun, istilah Ibrani itu sendiri tidak diberi penjelasan pembatas dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. Partikel vokatif “hai” memperjelas bahwa ungkapan ini merupakan seruan langsung kepada bala tentara Yahweh. Huruf kapital pada pronomina ilahi mengikuti kebiasaan ejaan religius Indonesia.
