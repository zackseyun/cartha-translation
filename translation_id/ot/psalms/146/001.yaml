  text: הַֽלְלוּ יָ֡הּ הַלְלִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/001.yaml
  text: Praise Yah! Praise Yahweh[a], my soul!
translation:
  language: id
  text: Pujilah Yah[a]! Pujilah Yahweh, hai jiwaku!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Pujilah Yah.” Seruan ini secara tradisional sering dituliskan sebagai transliterasi “Haleluya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak dari הלל yang menyerukan seluruh umat untuk memuji. Bahasa Indonesia tidak menandai jumlah pada bentuk imperatif ini, sehingga konteks seruan bersama tetap dibiarkan tersirat.
- source_word: יָהּ
  choice: Yah
  rationale: Bentuk puitis singkat dari nama ilahi. Dipertahankan sebagai “Yah” agar dua kata Ibrani dalam seruan pembuka tetap terlihat dan tidak dilebur menjadi transliterasi “Haleluya”.
- source_word: הַלְלִי
  choice: Pujilah
  rationale: Bentuk imperatif feminin tunggal dari הלל, yang ditujukan langsung kepada jiwa pemazmur. Imperatif langsung mempertahankan sifat nasihat kepada diri sendiri.
- source_word: נַפְשִׁי
  choice: hai jiwaku
  rationale: Dalam sapaan diri khas mazmur, נפש menunjuk pada diri atau jiwa pemazmur. “Hai jiwaku” merupakan sapaan yang alami, jelas, dan bermartabat dalam bahasa Indonesia.
- source_word: אֶת
  choice: tidak diterjemahkan secara terpisah
  rationale: Penanda objek langsung dalam bahasa Ibrani; fungsinya sudah terwakili oleh susunan kalimat bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH diterjemahkan secara langsung sebagai “Yahweh”, bukan diganti dengan gelar “TUHAN”, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan יָהּ dan יְהוָה dalam ayat yang sama
  choice: יָהּ diterjemahkan “Yah” dan יְהוָה diterjemahkan “Yahweh”
  alternative: Menerjemahkan keduanya dengan “TUHAN”, atau memakai “Haleluya” untuk הַֽלְלוּ יָהּ
  rationale: Teks memakai bentuk singkat dan bentuk lengkap nama ilahi secara berurutan. Mempertahankan “Yah” dan “Yahweh” mencerminkan perbedaan bentuk dalam sumber tanpa menghapus hubungan keduanya.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan khidmat. Partikel vokatif “hai” memperjelas bahwa “jiwaku” sedang disapa langsung, sedangkan pengulangan “Pujilah” mempertahankan kesejajaran dan daya seru teks Ibrani.
