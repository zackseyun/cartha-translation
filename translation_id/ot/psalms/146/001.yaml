  source_fidelity: 'Teks Indonesia secara tepat mencerminkan dua seruan imperatif dalam Ibrani: seruan pembuka kepada banyak orang, “Pujilah Yah!”, lalu seruan kepada diri sendiri, “Pujilah Yahweh, hai jiwaku!” Pembedaan antara bentuk singkat יָהּ (Yah) dan nama ilahi lengkap יְהוָה (Yahweh) dipertahankan. Jumlah jamak pada imperatif pertama tidak dapat ditandai secara wajib dan alami dalam bahasa Indonesia tanpa tambahan yang tidak ada dalam sumber.'
