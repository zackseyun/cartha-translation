  text: עֹשֶׂ֤ה שָׁ֘מַ֤יִם וָ/אָ֗רֶץ אֶת הַ/יָּ֥ם וְ/אֶת כָּל אֲשֶׁר בָּ֑/ם הַ/שֹּׁמֵ֖ר אֱמֶ֣ת לְ/עוֹלָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/006.yaml
  text: who made heaven and earth[a], the sea and all that is in them, who keeps faith forever,
translation:
  language: id
  text: yang menjadikan langit dan bumi, laut dan segala yang ada di dalamnya; yang tetap setia untuk selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang memelihara kebenaran untuk selama-lamanya.” Kata Ibrani yang digunakan dapat berarti “kebenaran” atau “kesetiaan”; dalam konteks ini, “kesetiaan” menekankan bahwa Allah selalu dapat diandalkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: yang menjadikan
  rationale: Partisipel Qal melanjutkan gambaran tentang TUHAN pada ayat sebelumnya. Dalam bahasa Indonesia, bentuk relatif ini alami dan tetap dapat menunjuk kepada karya penciptaan-Nya.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: langit dan bumi
  rationale: Pasangan ini merupakan merisme baku bagi seluruh tatanan ciptaan; bentuk tunggal kolektif 'langit' lazim dan alami dalam bahasa Indonesia.
- source_word: אֶת הַיָּם
  choice: laut
  rationale: Nomina Ibrani berbentuk tunggal dan tertentu; 'laut' mempertahankan bentuk serta pola bahasa penciptaan dalam ayat ini.
- source_word: וְאֶת כָּל אֲשֶׁר בָּם
  choice: dan segala yang ada di dalamnya
  rationale: Ungkapan ini secara menyeluruh mencakup segala isi langit, bumi, dan laut. Pronomina '-nya' dapat merujuk secara kolektif kepada ketiganya.
- source_word: הַשֹּׁמֵר
  choice: yang tetap
  rationale: Dengan אֱמֶת, verba שמר menyatakan pemeliharaan atau kelanjutan sifat yang tidak berubah. 'Tetap' menghasilkan ungkapan Indonesia yang alami tanpa menghilangkan gagasan keteguhan.
- source_word: אֱמֶת
  choice: setia
  rationale: Dalam konteks ini אֱמֶת terutama menunjuk kepada keterandalan atau kesetiaan Allah, bukan sekadar kebenaran abstrak. Adjektiva 'setia' berpadu alami dengan 'tetap'.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir dan sesuai dengan ragam bahasa mazmur yang khidmat namun mudah dipahami.
theological_decisions:
- issue: Makna אֱמֶת sebagai sifat Allah
  choice: kesetiaan, diterjemahkan 'tetap setia'
  alternative: kebenaran, diterjemahkan 'memelihara kebenaran'
  rationale: Konstruksi שמר אֱמֶת dengan לְעוֹלָם menekankan keterandalan Allah yang terus berlangsung. Namun, karena אֱמֶת juga benar-benar dapat berarti 'kebenaran', kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Titik koma mempertahankan dua klausa partisipial yang sama-sama menggambarkan TUHAN. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
