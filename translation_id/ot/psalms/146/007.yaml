    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: menegakkan keadilan
  rationale: Gabungan kata ini menyatakan tindakan aktif dan berkelanjutan untuk mewujudkan keadilan; ungkapan ini alami dalam bahasa Indonesia dan lebih tepat daripada sekadar 'melakukan penghakiman'.
- source_word: לָעֲשׁוּקִים
  choice: bagi orang-orang tertindas
  rationale: Bentuk partisip pasif menunjuk kepada mereka yang mengalami penindasan; terjemahan ini mempertahankan daya sosial-etis teks.
- source_word: נֹתֵן לֶחֶם
  choice: memberikan roti
  rationale: Terjemahan langsung mempertahankan gambaran konkret roti tanpa memperluasnya menjadi 'makanan'.
- source_word: לָרְעֵבִים
  choice: kepada orang-orang lapar
  rationale: Adjektiva substantival ini menunjuk kepada orang yang lapar, dan frasa tersebut alami setelah 'memberikan roti'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: מַתִּיר
  choice: membebaskan
  rationale: Kata kerja ini secara harfiah berkaitan dengan melepaskan atau melonggarkan ikatan; 'membebaskan' menyampaikan hasil tindakannya secara alami.
- source_word: אֲסוּרִים
  choice: orang-orang yang terbelenggu
  rationale: Bentuk ini secara luas berarti mereka yang diikat atau dibelenggu; pilihan ini mempertahankan citra Ibrani dan tidak mempersempitnya hanya pada tahanan resmi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian Allah secara langsung; transliterasi mempertahankan fungsinya sebagai nama pribadi.
- issue: Cakupan אֲסוּרִים
  choice: orang-orang yang terbelenggu
  alternative: para tahanan
  rationale: Bahasa sumber dapat menunjuk kepada orang yang terikat atau tertawan secara lebih luas, sehingga terjemahan utama tidak membatasi rujukannya pada sistem penjara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur partisipial Ibrani dipertahankan melalui rangkaian klausa “yang ...”, sementara pilihan katanya tetap mudah dipahami pembaca umum.
