  text: who executes justice for the oppressed[a], who gives bread to the hungry[b]. Yahweh frees the prisoners.
translation:
  language: id
  text: yang menegakkan keadilan bagi orang-orang tertindas[a], yang memberikan roti kepada orang-orang lapar. Yahweh membebaskan orang-orang yang terbelenggu.[b]
  philosophy: optimal-equivalence
  footnotes:
