  yaml_path: translation/ot/psalms/146/009.yaml
  text: Yahweh watches over the sojourners[a]; he upholds the fatherless and the widow[b], but he twists the way of the wicked.
translation:
  language: id
  text: Yahweh menjaga para pendatang[a]; Ia menopang anak yatim dan janda, tetapi Ia membuat jalan orang-orang fasik menjadi bengkok[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing”; istilah Ibrani ini menunjuk orang yang bukan penduduk setempat dan tinggal di tengah masyarakat Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “Ia membengkokkan jalan orang-orang fasik” atau “Ia membawa jalan orang-orang fasik menuju kehancuran.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: שֹׁמֵר
  choice: menjaga
  rationale: Partisip Ibrani menyatakan tindakan perlindungan yang terus berlangsung; 'menjaga' alami dan jelas dalam bahasa Indonesia.
- source_word: גֵּרִים
  choice: para pendatang
  rationale: Menunjuk orang bukan pribumi yang tinggal di tengah masyarakat setempat dan rentan secara sosial; catatan kaki mempertahankan cakupan istilahnya.
- source_word: יָתוֹם וְאַלְמָנָה
  choice: anak yatim dan janda
  rationale: Mengikuti bentuk kolektif tunggal Ibrani dan ungkapan baku bagi kelompok yang rentan.
- source_word: יְעוֹדֵד
  choice: menopang
  rationale: Menyampaikan tindakan menguatkan dan mendukung mereka yang lemah.
- source_word: דֶרֶךְ רְשָׁעִים
  choice: jalan orang-orang fasik
  rationale: '''Jalan'' mempertahankan metafora tentang arah hidup atau perilaku, sedangkan ''orang-orang fasik'' menyatakan kategori moral kolektif.'
- source_word: יְעַוֵּת
  choice: membengkokkan
  rationale: Mempertahankan gambaran dasar verba עות, yaitu membuat bengkok atau memutarbalikkan, tanpa langsung menafsirkannya sebagai kebinasaan.
theological_decisions:
- issue: Gambaran penghakiman ilahi dalam klausa terakhir
  choice: Ia membengkokkan jalan orang-orang fasik
  alternative: Ia membuat jalan orang-orang fasik menuju kehancuran
  rationale: Terjemahan utama mempertahankan metafora Ibrani dan ketegangan mengenai bagaimana tindakan Yahweh menggagalkan jalan orang fasik, tanpa mereduksinya menjadi satu akibat tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. Kapitalisasi 'Ia' dipakai untuk rujukan kepada Yahweh. Penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
