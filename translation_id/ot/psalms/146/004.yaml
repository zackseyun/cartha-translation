  text: תֵּצֵ֣א ר֭וּח/וֹ יָשֻׁ֣ב לְ/אַדְמָת֑/וֹ בַּ/יּ֥וֹם הַ֝/ה֗וּא אָבְד֥וּ עֶשְׁתֹּנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/004.yaml
  text: His breath goes out[a]; he returns to his ground; on that very day his plans perish.
translation:
  language: id
  text: Napasnya keluar; ia kembali ke tanahnya; pada hari itu juga rencananya lenyap.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּצֵא
  choice: keluar
  rationale: Mempertahankan gambaran konkret verba יָצָא, yaitu keluarnya napas atau roh kehidupan pada saat kematian, tanpa menambahkan penafsiran.
- source_word: רוּחוֹ
  choice: napasnya
  rationale: Dalam konteks kematian dan kembalinya manusia ke tanah, רוּחַ dapat menunjuk pada napas yang menghidupkan. Pilihan ini mempertahankan gambaran konkret, sedangkan kemungkinan arti 'rohnya' dicatat dalam catatan kaki.
- source_word: יָשֻׁב
  choice: ia kembali
  rationale: Subjeknya secara wajar dipahami sebagai orang itu; 'kembali' menerjemahkan makna dasar שׁוּב dengan jelas dan alami.
- source_word: לְאַדְמָתוֹ
  choice: ke tanahnya
  rationale: אֲדָמָה berarti tanah atau bumi, dan akhiran pronominalnya dipertahankan dengan '-nya'. Pilihan ini tidak mengganti kata sumber dengan 'debu' dari ayat lain.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu juga
  rationale: Ungkapan ini menyatakan bahwa lenyapnya rencana manusia terjadi tepat pada hari kematiannya; 'juga' menyampaikan penekanan waktu secara alami dalam bahasa Indonesia.
- source_word: אָבְדוּ
  choice: lenyap
  rationale: Verba אָבַד di sini menyatakan bahwa rencana tersebut tidak lagi ada atau tidak dapat terlaksana. 'Lenyap' ringkas, wajar, dan sesuai dengan konteks kefanaan manusia.
- source_word: עֶשְׁתֹּנֹתָיו
  choice: rencananya
  rationale: Nomina langka ini dapat berarti pikiran, maksud, atau rancangan. 'Rencananya' paling sesuai dengan konteks tentang gagalnya tujuan manusia ketika ia mati; bahasa Indonesia tidak wajib menandai bentuk jamak secara morfologis.
theological_decisions:
- issue: Nuansa antropologis רוּחוֹ dalam konteks kematian
  choice: Diterjemahkan 'napasnya' dalam teks utama.
  alternative: '''rohnya'''
  rationale: '''Napasnya'' sesuai dengan gambaran konkret tentang berakhirnya kehidupan dan tidak memaksakan kesimpulan doktrinal tertentu mengenai keadaan sesudah kematian. Karena רוּחַ juga dapat berarti ''roh'', kemungkinan itu dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat ringkas dan bermartabat. Ungkapan 'napasnya keluar' sengaja mempertahankan citra bahasa Ibrani, sementara tanda baca memperjelas urutan kematian, kembali ke tanah, dan lenyapnya rencana.
