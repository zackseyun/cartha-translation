  text: Aku akan memuji Yahweh sepanjang hidupku[a]; aku akan menyanyikan pujian kepada Allahku selama aku hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, ungkapan Ibrani pada kedua baris berbunyi “dalam hidupku” dan “selama aku masih ada”; dalam konteks ini keduanya menyatakan durasi: “sepanjang hidupku” dan “selama aku hidup”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Aku akan memuji
  rationale: Bentuk orang pertama tunggal ini menyatakan tekad atau kehendak pada masa mendatang. “Aku akan memuji” menyampaikan komitmen pemazmur secara wajar tanpa menambahkan gagasan keberulangan yang tidak dinyatakan langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi yang terdapat dalam teks Ibrani tetap dipertahankan, bukan diganti dengan gelar.
- source_word: בְּחַיָּי
  choice: seumur hidupku
  rationale: Secara harfiah berarti “dalam hidupku”; dalam konteks puitis ini frasa tersebut menunjukkan seluruh jangka hidup pemazmur. “Seumur hidupku” alami dalam bahasa Indonesia dan mempertahankan makna duratifnya.
- source_word: אֲזַמְּרָה
  choice: aku akan bermazmur
  rationale: Kata kerja זמר menunjuk pada nyanyian atau permainan musik untuk memuji. “Bermazmur” mempertahankan unsur musikal sekaligus penyembahannya dan sesuai dengan ragam bahasa kitab Mazmur.
- source_word: לֵאלֹהַי
  choice: bagi Allahku
  rationale: Preposisi ל dengan kata kerja bernyanyi atau bermazmur secara alami menyatakan pihak yang menjadi tujuan pujian. “Bagi Allahku” merupakan ungkapan Indonesia yang wajar.
- source_word: בְּעוֹדִי
  choice: selama aku hidup
  rationale: עוֹד dengan akhiran orang pertama menyatakan keberlanjutan keberadaan pemazmur. “Selama aku hidup” mengungkapkan idiom durasi itu dengan jelas sambil membentuk kesejajaran dengan baris pertama.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama ilahi dalam teks sumber dan tidak menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pengulangan “aku akan” mempertahankan kesejajaran serta tekad yang tampak dalam dua bentuk verba Ibrani. “Bermazmur” dipilih karena konteks kitab dan nuansa pujian musikalnya, meskipun sedikit lebih berciri ragam Alkitab daripada “menyanyikan pujian”.
