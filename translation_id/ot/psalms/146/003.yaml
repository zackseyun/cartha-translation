base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/003.yaml
  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
translation:
  language: id
  text: Janganlah percaya kepada para bangsawan[a], kepada manusia fana[b] yang padanya tidak ada keselamatan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pemuka” atau “para penguasa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak manusia”; di sini maksudnya manusia biasa yang dapat mati, bukan gelar mesianik.'
    reason: idiom_clarification
  - marker: c
    text: 'Atau: “kelepasan” atau “pertolongan.”'
    reason: lexical_and_literal_alternative
lexical_decisions:
- source_word: אַל תִּבְטְחוּ
  choice: Janganlah percaya
  rationale: Partikel larangan אַל dengan bentuk verba ini menyatakan larangan langsung. “Janganlah percaya” alami dalam bahasa Indonesia dan mempertahankan bobot seruannya.
- source_word: בִנְדִיבִים
  choice: kepada para penguasa
  rationale: Kata נְדִיבִים dapat menunjuk kepada kaum bangsawan, pemuka, atau penguasa. Dalam konteks larangan mengandalkan manusia yang berkuasa, “para penguasa” menyampaikan fungsi sosial-politiknya dengan jelas.
- source_word: בְּבֶן אָדָם
  choice: kepada manusia fana
  rationale: Secara harfiah ungkapan ini berarti “kepada anak manusia”, tetapi di sini merupakan idiom bagi manusia biasa yang dapat mati, bukan gelar mesianik. “Manusia fana” menyampaikan maksud idiom tersebut secara alami sekaligus mempertahankan kontras dengan Allah.
- source_word: שֶׁאֵין לוֹ תְשׁוּעָה
  choice: yang tidak dapat memberikan keselamatan
  rationale: Ungkapan eksistensial ini secara harfiah menyatakan bahwa padanya tidak ada תְשׁוּעָה. Rumusan Indonesia ini secara alami menyampaikan bahwa manusia tidak memiliki kemampuan untuk menghasilkan penyelamatan, tanpa membatasi maknanya hanya pada bantuan sementara.
theological_decisions:
- issue: Makna ungkapan בְּבֶן אָדָם
  choice: manusia fana secara umum, bukan gelar mesianik
  alternative: “anak manusia” sebagai terjemahan harfiah
  rationale: Konteks mazmur membandingkan manusia yang akan mati dengan TUHAN sebagai satu-satunya sumber pertolongan yang dapat diandalkan. Tidak ada petunjuk bahwa ungkapan ini digunakan sebagai gelar mesianik.
- issue: Cakupan תְשׁוּעָה
  choice: keselamatan
  alternative: kelepasan atau pertolongan
  rationale: Kata ini dapat mencakup penyelamatan atau kelepasan konkret. “Keselamatan” mempertahankan keluasan makna dan kontras utama antara ketidakmampuan manusia dan kuasa Allah, sementara alternatif leksikal dicatat tanpa mempersempit teks.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Manusia fana” dipilih agar idiom Ibrani dipahami secara alami tanpa menimbulkan kesan bahwa frasa ini merupakan gelar khusus. Struktur paralel “kepada ... kepada ...” dipertahankan.
