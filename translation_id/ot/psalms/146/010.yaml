  text: יִמְלֹ֤ךְ יְהוָ֨ה לְ/עוֹלָ֗ם אֱלֹהַ֣יִ/ךְ צִ֭יּוֹן לְ/דֹ֥ר וָ/דֹ֗ר הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/010.yaml
  text: Yahweh will reign forever—your God[a], Zion, from generation to generation. Hallelujah!
translation:
  language: id
  text: Yahweh akan memerintah untuk selama-lamanya—Allahmu, hai Sion, dari generasi ke generasi. Haleluya![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Pujilah Yah!” Ungkapan ini ditransliterasikan di sini sebagai “Haleluya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְלֹךְ
  choice: akan memerintah
  rationale: Bentuk Qal imperfek orang ketiga tunggal dari מלך menyatakan pemerintahan Yahweh yang terus berlangsung dan, dalam pernyataan pujian ini, berorientasi ke masa depan. “Akan memerintah” mempertahankan daya verbalnya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Frasa ini menyatakan durasi yang tidak terbatas. “Untuk selama-lamanya” alami dalam bahasa Indonesia dan sesuai dengan konteks pemerintahan kekal.
- source_word: אֱלֹהַיִךְ
  choice: Allahmu
  rationale: Akhiran orang kedua feminin tunggal merujuk kepada Sion yang dipersonifikasikan dan disapa secara langsung. “Allahmu” mempertahankan bentuk posesif tunggal itu.
- source_word: צִיּוֹן
  choice: hai Sion
  rationale: Nama tempat ditulis menurut bentuk Indonesia yang mapan, “Sion”. Kata “hai” menyatakan fungsi vokatif yang tersirat dalam susunan Ibrani tanpa mengubah referennya.
- source_word: לְדֹר וָדֹר
  choice: dari generasi ke generasi
  rationale: Ungkapan Ibrani ini menunjuk pada kesinambungan sepanjang generasi-generasi yang berturut-turut. Terjemahan ini mempertahankan pengulangan dan cakupan waktunya.
- source_word: הַלְלוּ יָהּ
  choice: Haleluya!
  rationale: Ungkapan liturgis Ibrani ini diserap secara lazim dalam bahasa Indonesia sebagai “Haleluya”. Makna harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menggunakan nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Penerjemahan seruan הַלְלוּ יָהּ
  choice: Haleluya!
  alternative: Pujilah Yah!
  rationale: “Haleluya” mempertahankan bentuk seruan liturgis yang telah dikenal luas dalam bahasa Indonesia, sedangkan arti unsur-unsur Ibraninya tetap tersedia dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada pujian. Tanda pisah menandai aposisi “Allahmu, hai Sion”, sementara “hai” memperjelas bahwa Sion disapa secara langsung. Penanda catatan kaki ditempatkan setelah “Haleluya”, yaitu ungkapan yang dijelaskan oleh catatan tersebut.
