id: PSA.146.8
reference: Psalms 146:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֤ה פֹּ֘קֵ֤חַ עִוְרִ֗ים יְ֭הוָה זֹקֵ֣ף כְּפוּפִ֑ים יְ֝הוָ֗ה אֹהֵ֥ב צַדִּיקִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/008.yaml
  text: Yahweh opens the eyes of the blind[a]; Yahweh raises up those who are bowed down; Yahweh loves the righteous.
translation:
  language: id
  text: Yahweh membuka mata orang buta[a]; Yahweh menegakkan orang yang tertunduk; Yahweh mengasihi orang benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memberikan penglihatan kepada orang buta.” Secara harfiah bahasa Ibrani menyebut “membuka orang buta,” yakni membuka mata mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankan nama perjanjian, bukan menggantinya dengan gelar.
- source_word: פֹּקֵחַ עִוְרִים
  choice: membuka mata orang buta
  rationale: Secara harfiah bahasa Ibrani menyatakan 'membuka orang buta'; dalam bahasa Indonesia, penambahan 'mata' membuat gambaran konkret dan maknanya jelas tanpa mengubah maksud.
- source_word: זֹקֵף
  choice: menegakkan
  rationale: Kata ini menyatakan tindakan membuat tegak atau mengangkat; 'menegakkan' cocok dengan keadaan orang yang tertunduk dan tetap membuka kemungkinan makna fisik maupun pemulihan dari penindasan.
- source_word: כְּפוּפִים
  choice: orang yang tertunduk
  rationale: Mempertahankan gambaran orang yang membungkuk atau direndahkan tanpa membatasi penyebab keadaannya.
- source_word: אֹהֵב
  choice: mengasihi
  rationale: Padanan alami dan bermartabat untuk kasih Yahweh yang terus menjadi ciri tindakan-Nya.
- source_word: צַדִּיקִים
  choice: orang benar
  rationale: Adjektiva jamak yang berfungsi sebagai nomina; 'orang benar' merupakan padanan Indonesia yang baku dan transparan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Cakupan makna כְּפוּפִים
  choice: orang yang tertunduk
  alternative: orang yang membungkuk; orang yang tertekan
  rationale: Pilihan ini menjaga metafora sumber dan tidak memutuskan apakah keadaan itu terutama bersifat jasmani, sosial, atau batiniah.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. Pengulangan 'Yahweh' dipertahankan untuk mengikuti struktur tiga klausa dalam teks Ibrani.
