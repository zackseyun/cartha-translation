  yaml_path: translation/ot/psalms/146/005.yaml
  text: Blessed is the one whose help is the God of Jacob[a], whose hope is in Yahweh his God.
translation:
  language: id
  text: Berbahagialah orang yang Allah Yakub adalah penolongnya[a], yang harapannya tertuju kepada Yahweh, Allahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang penolongnya ialah Allah Yakub.”
    reason: Alternatif leksikal untuk susunan padat frasa Ibrani, yang menyatakan Allah Yakub sebagai pertolongan atau penolong orang itu.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk ucapan bahagia ini menyatakan keadaan yang patut disebut berbahagia, bukan sekadar perasaan senang. Pilihan ini juga mempertahankan nada khas mazmur.
- source_word: שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ
  choice: orang yang Allah Yakub menjadi penolongnya
  rationale: 'Susunan ini menyampaikan hubungan yang dinyatakan oleh frasa Ibrani: Allah Yakub adalah pertolongan atau penolong bagi orang tersebut. Bentuk ''menjadi penolongnya'' alami dalam bahasa Indonesia dan mempertahankan gelar perjanjian ''Allah Yakub''.'
- source_word: שִׂבְרוֹ
  choice: harapannya
  rationale: Nomina ini menunjuk pada harapan atau penantian penuh keyakinan. 'Harapannya' mempertahankan bentuk nominal dan kesejajaran dengan klausa sebelumnya.
- source_word: עַל
  choice: tertuju kepada
  rationale: Preposisi ini menandai pihak yang menjadi tumpuan harapan. 'Tertuju kepada' alami dalam bahasa Indonesia tanpa menghilangkan gagasan ketergantungan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Akhiran orang ketiga tunggal dipertahankan dan menyatakan hubungan pribadi orang yang berbahagia itu dengan Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; 'Yahweh' mempertahankan nama itu alih-alih menggantinya dengan sebuah gelar.
- issue: Subjek tersirat dalam ucapan bahagia
  choice: orang
  alternative: dia atau laki-laki
  rationale: Bahasa Ibrani tidak menyebut nomina seperti אִישׁ. 'Orang' mengungkapkan referen tunggal secara alami tanpa menambahkan pembatasan yang tidak terdapat dalam teks.
- issue: Hubungan antara Allah Yakub dan pertolongan
  choice: Allah Yakub menjadi penolongnya
  alternative: pertolongannya berasal dari Allah Yakub
  rationale: Pilihan utama menyatakan Allah sendiri sebagai penolong, sambil mempertahankan hubungan nominal dalam bahasa sumber. Catatan kaki mencatat cara lain yang wajar untuk memahami ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Bentuk 'Berbahagialah' mempertahankan gaya ucapan bahagia, sedangkan struktur dua klausa menjaga kesejajaran puisi Ibrani.
