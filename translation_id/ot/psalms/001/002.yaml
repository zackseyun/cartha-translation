  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: id
  text: Sebaliknya, kesukaannya ada pada Taurat[a] Yahweh, dan ia merenungkan Taurat-Nya[b] siang dan malam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengajaran Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “merenungkan” juga dapat menggambarkan tindakan menggumamkan atau melafalkan dengan suara lirih sambil merenung.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebaliknya
  rationale: Dalam rangkaian yang berlawanan dengan tiga penyangkalan pada ayat 1, ungkapan ini menyatakan kontras, bukan sebab. “Sebaliknya” alami dalam bahasa Indonesia dan menegaskan peralihan kepada perilaku orang benar.
- source_word: בְּתוֹרַת
  choice: ialah Taurat
  rationale: תּוֹרָה dapat berarti pengajaran atau petunjuk, tetapi di sini juga memiliki bobot sebagai penyataan perjanjian Yahweh. “Taurat” mempertahankan istilah alkitabiah yang dikenal, sedangkan cakupan “pengajaran” dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi Allah dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: חֶפְצוֹ
  choice: kesukaannya
  rationale: Kata ini menunjuk pada sesuatu yang disenangi atau menjadi kegembiraan seseorang. “Kesukaannya” menyampaikan orientasi batin tokoh terhadap Taurat Yahweh secara alami.
- source_word: וּבְתוֹרָתוֹ
  choice: dan Taurat-Nya
  rationale: Pronomina akhiran paling wajar merujuk kepada Yahweh. Pengulangan “Taurat” mempertahankan paralelisme Ibrani, dan kapital pada “-Nya” mengikuti kebiasaan Indonesia untuk rujukan kepada Allah.
- source_word: יֶהְגֶּה
  choice: ia renungkan
  rationale: הגה mencakup perenungan dan juga pengucapan lirih. “Renungkan” paling alami untuk keterlibatan batin yang terus-menerus dalam konteks hikmat, sementara nuansa pelafalan lirih dipertahankan dalam catatan kaki.
- source_word: יוֹמָם וָלָיְלָה
  choice: siang dan malam
  rationale: Ungkapan ini adalah merisme Ibrani yang menunjukkan kesinambungan. Terjemahan langsung “siang dan malam” alami dan tetap mempertahankan bentuk puitisnya.
theological_decisions:
- issue: Makna תּוֹרָה dalam mazmur hikmat
  choice: Taurat
  alternative: pengajaran atau petunjuk
  rationale: “Taurat” mempertahankan kaitan dengan penyataan perjanjian dan Kitab Suci tanpa membatasi istilah itu semata-mata pada peraturan hukum. Catatan kaki menjaga keluasan makna leksikalnya.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menggunakan nama ilahi secara langsung. “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Nuansa tindakan הגה
  choice: merenungkan
  alternative: menggumamkan atau melafalkan dengan suara lirih
  rationale: Konteks hikmat mendukung makna perenungan, tetapi kata Ibrani dapat melibatkan pengucapan lirih; kemungkinan itu tidak dihapus dan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan inversi “Taurat-Nya ia renungkan” dipilih untuk mempertahankan penekanan dan paralelisme puitis tanpa menjadi sulit dipahami.
