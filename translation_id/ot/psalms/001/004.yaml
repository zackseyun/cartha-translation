  text: לֹא כֵ֥ן הָ/רְשָׁעִ֑ים כִּ֥י אִם כַּ֝/מֹּ֗ץ אֲֽשֶׁר תִּדְּפֶ֥/נּוּ רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/004.yaml
  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
translation:
  language: id
  text: Tidak demikian orang-orang fasik; sebaliknya, mereka seperti sekam yang diterbangkan angin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dihalau angin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Tidak demikian
  rationale: Ungkapan eliptis ini mempertahankan kontras yang tegas dengan gambaran orang benar pada ayat sebelumnya tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: הָרְשָׁעִים
  choice: orang-orang fasik
  rationale: Dalam sastra hikmat, istilah ini menunjuk kepada orang yang hidup dalam kejahatan; 'fasik' merupakan padanan Indonesia yang baku dan sesuai dengan konteks moral ini.
- source_word: כִּי אִם
  choice: sebaliknya
  rationale: 'Gabungan ini memperkenalkan koreksi atau kontras kuat: keadaan orang fasik bukan seperti pohon yang subur, melainkan seperti sekam.'
- source_word: כַּמֹּץ
  choice: seperti sekam
  rationale: מֹץ adalah bagian ringan yang terpisah dari bulir saat penampian; 'sekam' mempertahankan metafora pertanian dan mudah dipahami.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif 'yang' secara alami mengaitkan sekam dengan tindakan angin.
- source_word: תִּדְּפֶנּוּ
  choice: diterbangkan
  rationale: Bentuk verba dari נדף menyatakan bahwa sekam didorong atau diterbangkan oleh angin. Bentuk pasif menghasilkan kalimat Indonesia yang alami sekaligus mempertahankan angin sebagai pelaku.
- source_word: רוּחַ
  choice: angin
  rationale: Dalam gambaran penampian ini, makna konkret 'angin' jelas dimaksudkan, bukan 'roh' atau 'napas'.
