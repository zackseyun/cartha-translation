source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: id
  text: Ia akan seperti pohon yang ditanam di tepi aliran air, yang menghasilkan buahnya pada musimnya dan yang daunnya tidak layu. Dalam segala yang dilakukannya, ia berhasil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Segala yang dilakukannya berhasil.” Dalam bahasa Ibrani, “segala yang dilakukannya” juga dapat dipahami sebagai subjek kata kerja terakhir.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Ia akan seperti
  rationale: Bentuk perfektum dengan waw dalam konteks puitis ini menyatakan hasil atau keadaan yang menyusul gambaran ayat sebelumnya; bentuk mendatang dipertahankan secara alami dalam bahasa Indonesia.
- source_word: כְּעֵץ
  choice: seperti pohon
  rationale: Prefiks כְּ menyatakan perbandingan; ungkapan ini merupakan bentuk perumpamaan yang alami dan langsung.
- source_word: שָׁתוּל
  choice: ditanam
  rationale: Partisip pasif ini menggambarkan pohon yang sengaja ditempatkan atau ditanam; 'ditanam' jelas dan tidak menambahkan gagasan pemindahan yang hanya tersirat dalam kemungkinan 'dipindahkan lalu ditanam'.
- source_word: עַל פַלְגֵי מָיִם
  choice: di tepi aliran air
  rationale: פַלְגֵי menunjuk pada aliran atau saluran air. 'Di tepi aliran air' mempertahankan gambaran letak pohon dekat sumber air dengan bahasa Indonesia yang alami.
- source_word: פִּרְיוֹ יִתֵּן
  choice: menghasilkan buahnya
  rationale: Secara harfiah frasa ini berarti 'memberikan buahnya'; 'menghasilkan buahnya' lebih wajar untuk pohon sambil mempertahankan sufiks milik.
- source_word: בְּעִתּוֹ
  choice: pada musimnya
  rationale: Dalam gambaran pertanian, עֵת menyatakan waktu atau musim yang tepat; 'pada musimnya' alami dan tepat konteks.
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: dan yang daunnya tidak layu
  rationale: Bentuk tunggal 'daun' bersifat kolektif dalam bahasa Ibrani; 'daunnya' dan 'tidak layu' mempertahankan citra tumbuhan secara langsung.
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ
  choice: Dalam segala yang dilakukannya, ia berhasil
  rationale: Susunan ini mengambil orang benar sebagai subjek tersirat verba terakhir dan tetap mencakup seluruh tindakannya. Kemungkinan bahwa 'segala yang dilakukannya' adalah subjek dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Subjek verba terakhir יַצְלִיחַ
  choice: 'Orang yang digambarkan dalam mazmur menjadi subjek: ''Dalam segala yang dilakukannya, ia berhasil.'''
  alternative: '''Segala yang dilakukannya berhasil.'''
  rationale: Sintaksis Ibrani memungkinkan subjek tersirat kembali kepada orang benar atau menjadikan 'segala yang dilakukannya' sebagai subjek verba. Bacaan personal mempertahankan fokus bait pada orang tersebut, sedangkan bacaan alternatif yang sah dipelihara dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'yang' menjaga hubungan relatif dengan pohon tetap jelas. Istilah 'aliran air' dipilih daripada 'saluran-saluran air' agar gambarnya alami tanpa menutup kemungkinan bahwa aliran itu merupakan saluran yang terarah.
