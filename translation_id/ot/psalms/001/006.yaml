id: PSA.1.6
reference: Psalms 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: id
  text: Sebab TUHAN mengenal jalan orang-orang benar[a], tetapi jalan orang-orang fasik akan binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperhatikan” atau “menjaga”; kata Ibrani yang diterjemahkan “mengenal” dapat menyiratkan perhatian relasional atau perkenanan, bukan sekadar mengetahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan alasan yang mendasari kontras sebelumnya dan mempertahankan hubungan penjelas antarayat secara alami dalam bahasa Indonesia.
- source_word: יוֹדֵעַ
  choice: mengenal
  rationale: Pilihan ini mempertahankan arti dasar ידע sekaligus, dalam konteksnya, memungkinkan nuansa pengenalan yang bersifat relasional, penuh perhatian, dan berkenan tanpa menjadikannya eksplisit secara berlebihan.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Bentuk huruf kapital mengikuti konvensi Alkitab bahasa Indonesia yang umum untuk menandai nama ilahi YHWH, serta terasa alami dan khidmat bagi pembaca modern.
- source_word: דֶּרֶךְ
  choice: jalan
  rationale: Kata ini mempertahankan metafora Ibrani dan mencakup cara hidup maupun arah serta kesudahannya; pengulangannya juga menjaga kesejajaran puitis.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva jamak ini dipakai sebagai nomina dan menunjuk kepada suatu golongan moral; bentuk ini jelas serta wajar dalam bahasa Indonesia.
- source_word: וְ
  choice: tetapi
  rationale: Walaupun secara bentuk dapat diterjemahkan 'dan', kesejajaran antarklausa menyatakan pertentangan, sehingga 'tetapi' menyampaikan relasinya dengan tepat.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Istilah ini menyampaikan kategori moral dalam sastra hikmat secara ringkas dan sesuai dengan ragam bahasa Alkitab Indonesia yang tetap dapat dipahami pembaca modern.
- source_word: תֹּאבֵד
  choice: akan binasa
  rationale: 'Bentuk ini mempertahankan makna intransitif אבד: jalan atau haluan orang fasik berakhir dalam kebinasaan, bukan secara eksplisit dibuat binasa oleh subjek yang disebutkan.'
theological_decisions:
- issue: Makna pengenalan TUHAN
  choice: Teks utama memakai 'mengenal', dengan catatan bahwa pengenalan itu dapat mencakup perhatian dan perkenanan relasional.
  alternative: TUHAN menjaga jalan orang-orang benar; TUHAN mengakui jalan orang-orang benar.
  rationale: ידע dalam konteks ini dapat menyiratkan lebih dari sekadar mengetahui fakta, tetapi terjemahan yang langsung memakai 'menjaga' atau 'mengawasi' akan mempersempit dan menafsirkan nuansanya. 'Mengenal' menjaga keluasan serta ketegangan makna teks.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. 'TUHAN' dipakai menurut konvensi umum untuk YHWH. Pengulangan 'jalan' dipertahankan demi metafora dan kesejajaran puitis; 'orang-orang fasik' mempertahankan ragam hikmat yang dignified tanpa menjadi sukar dipahami.
