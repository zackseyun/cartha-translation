id: PSA.1.1
reference: Psalms 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: id
  text: Berbahagialah[a] orang[b] yang tidak berjalan menurut nasihat orang-orang fasik, tidak berdiri di jalan orang-orang berdosa, dan tidak duduk di kalangan para pencemooh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Sungguh beruntunglah.” Ungkapan Ibrani ini menyatakan keadaan yang sungguh baik dan diberkati, bukan sekadar perasaan senang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “laki-laki itu”; bentuk maskulin tunggal ini mewakili pribadi teladan secara umum, bukan hanya laki-laki.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “di tempat duduk para pencemooh”; kata Ibrani yang dipakai juga dapat menunjuk pada pertemuan atau lingkungan orang-orang yang duduk bersama.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Ungkapan seruan ini memperkenalkan keadaan seseorang yang sungguh diberkati atau beruntung. “Berbahagialah” alami dalam bahasa Indonesia dan lebih luas daripada sekadar perasaan senang.
- source_word: הָאִישׁ
  choice: orang
  rationale: Nomina Ibrani ini berbentuk maskulin tunggal, tetapi dalam sastra hikmat menunjuk secara representatif kepada pribadi teladan. “Orang” menyampaikan cakupan umum itu secara alami dalam bahasa Indonesia; bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: הָלַךְ
  choice: berjalan
  rationale: Mempertahankan metafora perilaku serta urutan puitis berjalan–berdiri–duduk.
- source_word: בַּעֲצַת
  choice: menurut nasihat
  rationale: Preposisi dan nomina ini menyatakan bahwa seseorang mengarahkan perilakunya berdasarkan nasihat atau pertimbangan pihak lain. Frasa ini wajar dalam bahasa Indonesia.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Menggambarkan mereka yang bersalah atau jahat secara moral. “Fasik” merupakan padanan ringkas yang lazim dalam ragam Alkitab Indonesia tanpa mempersempitnya menjadi sekadar tidak religius.
- source_word: דֶרֶךְ
  choice: jalan
  rationale: Mempertahankan citra jalan yang juga dapat menyiratkan cara hidup, sesuai dengan gaya sastra hikmat.
- source_word: חַטָּאִים
  choice: orang-orang berdosa
  rationale: Padanan langsung bagi bentuk jamak substantival, jelas dan alami bagi pembaca Indonesia.
- source_word: עָמָד
  choice: berdiri
  rationale: Mempertahankan gambaran konkret dan tahap kedua dalam urutan puitis berjalan–berdiri–duduk.
- source_word: מוֹשַׁב
  choice: kalangan
  rationale: Nomina ini dapat berarti tempat duduk, pertemuan, atau lingkungan orang-orang yang duduk bersama. “Di kalangan” menghasilkan bahasa Indonesia yang alami sambil menyampaikan pergaulan menetap; citra harfiahnya dicatat sebagai alternatif.
- source_word: לֵצִים
  choice: para pencemooh
  rationale: Menunjuk kepada orang-orang yang mengejek atau mencemooh. “Pencemooh” jelas, bermartabat, dan sesuai dengan konteks hikmat.
- source_word: יָשָׁב
  choice: duduk
  rationale: Mempertahankan citra konkret dan melengkapi perkembangan puitis dari berjalan ke berdiri lalu duduk.
theological_decisions:
- issue: Maskulin tunggal yang berfungsi representatif dalam sastra hikmat
  choice: orang
  alternative: laki-laki itu
  rationale: Bentuk Ibrani memang maskulin tunggal, tetapi konteks amsal pembuka ini menggambarkan pribadi benar sebagai teladan umum, bukan membatasi ucapan kepada laki-laki. Terjemahan memakai “orang” untuk menyampaikan fungsi representatifnya dan mencantumkan bentuk harfiah dalam catatan kaki.
- issue: Makna אַשְׁרֵי sebagai ucapan bahagia
  choice: Berbahagialah
  alternative: Sungguh beruntunglah
  rationale: Ucapan ini menggambarkan keadaan baik dan patut disambut yang dialami orang tersebut, bukan hanya emosi sesaat. Pilihan utama mempertahankan bentuk ucapan bahagia yang dikenal tanpa menjelaskan sumber berkat secara lebih khusus daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Metafora serta perkembangan berjalan–berdiri–duduk dipertahankan, sedangkan ungkapan yang kaku disesuaikan secukupnya agar mudah dipahami pembaca umum.
