id: PSA.1.5
reference: Psalms 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל כֵּ֤ן לֹא יָקֻ֣מוּ רְ֭שָׁעִים בַּ/מִּשְׁפָּ֑ט וְ֝/חַטָּאִ֗ים בַּ/עֲדַ֥ת צַדִּיקִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: id
  text: Karena itu, orang-orang fasik tidak akan dapat berdiri dalam penghakiman[a], demikian pula orang-orang berdosa dalam perhimpunan orang-orang benar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam pengadilan.” Istilah Ibrani dapat menunjuk secara luas pada pemeriksaan atau perhitungan yudisial, baik dalam tatanan sekarang maupun pada penghakiman terakhir.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam jemaah orang-orang benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai kesimpulan logis dari gambaran tentang orang fasik dalam ayat-ayat sebelumnya dengan ungkapan Indonesia yang alami dan ringkas.
- source_word: יָקֻמוּ
  choice: tidak akan dapat berdiri
  rationale: Mempertahankan gambaran dasar verba קום, sekaligus menyampaikan nuansa bahwa mereka tidak sanggup bertahan atau memperoleh kedudukan ketika diperiksa. Verba ini juga dipahami berlaku secara eliptis pada klausa kedua.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Padanan lazim dalam sastra hikmat yang mempertahankan kategori moral, bukan membatasinya pada status bersalah secara hukum.
- source_word: בַּמִּשְׁפָּט
  choice: dalam penghakiman
  rationale: מִשְׁפָּט dapat menunjuk pada penghakiman, keputusan hukum, atau pelaksanaan keadilan. Pilihan ini mempertahankan nuansa yudisial tanpa menentukan waktunya.
- source_word: חַטָּאִים
  choice: orang-orang berdosa
  rationale: Padanan langsung bagi mereka yang dicirikan oleh dosa dan tetap sejajar dengan 'orang-orang fasik'.
- source_word: בַּעֲדַת
  choice: dalam perhimpunan
  rationale: עֵדָה menunjuk pada komunitas yang berhimpun. 'Perhimpunan' mempertahankan sifat korporatnya tanpa membatasi makna pada struktur keagamaan tertentu.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Padanan Indonesia yang alami dan lazim, yang mempertahankan kategori moral serta relasional dalam mazmur hikmat.
theological_decisions:
- issue: Cakupan 'penghakiman'
  choice: Diterjemahkan secara umum sebagai 'penghakiman' tanpa menentukan apakah yang dimaksud ialah pemeriksaan hukum dalam kehidupan sekarang, penghakiman terakhir, atau keduanya.
  alternative: Menafsirkannya secara khusus sebagai pengadilan duniawi atau sebagai penghakiman akhir eskatologis.
  rationale: Bahasa Ibrani memungkinkan cakupan yudisial yang luas. Terjemahan mempertahankan ketegangan tersebut dan tidak menetapkan waktu atau bentuk penghakiman yang tidak dinyatakan oleh teks.
- issue: Makna 'berdiri' dalam suasana penghakiman dan perhimpunan
  choice: Gambaran 'berdiri' dipertahankan dengan tambahan modal 'dapat' untuk menyatakan ketidakmampuan bertahan atau memperoleh kedudukan.
  alternative: Menerjemahkannya sebagai 'bertahan', 'bangkit', atau 'mendapat tempat'.
  rationale: Pilihan ini mempertahankan metafora Ibrani dan nuansa forensiknya tanpa mengubahnya menjadi penjelasan teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak dinyatakan untuk menjaga kesejajaran antarkelompok. 'Perhimpunan' dipilih sebagai istilah umum yang mudah dipahami dan tidak terlalu terikat pada tradisi gerejawi tertentu.
