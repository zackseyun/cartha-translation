  source_fidelity: 'Terjemahan setia pada struktur dan makna Ibrani: עַל־כֵּן diterjemahkan sebagai “Karena itu”; רְשָׁעִים dan חַטָּאִים tetap dibedakan sebagai “orang-orang fasik” dan “orang-orang berdosa”; dan paralelisme kedua klausa dipertahankan. “Tidak akan dapat berdiri” menjaga citra יָקֻמוּ dalam konteks penghakiman tanpa menetapkan secara sempit bahwa yang dimaksud hanya penghakiman akhir. Elipsis verba pada klausa kedua wajar dalam bahasa Indonesia dan sesuai dengan struktur Ibrani.'
