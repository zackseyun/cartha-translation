base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/001.yaml
  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
translation:
  language: id
  text: Hatiku teguh, ya Allah; aku akan bernyanyi dan memainkan musik, bahkan dengan kemuliaanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kemuliaanku”. Ungkapan puitis Ibrani ini mungkin menunjuk pada segenap keberadaan atau diri batin si pemazmur, bahkan mungkin pada lidah sebagai alat untuk memuji.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: teguh
  rationale: Kata ini menyatakan keadaan yang mantap, kokoh, atau siap. Dalam konteks tekad untuk memuji, “teguh” secara alami mencakup kemantapan batin dan ketetapan hati.
- source_word: לִבִּי
  choice: hatiku
  rationale: Dalam bahasa Ibrani, “hati” lazim menunjuk pada batin, kehendak, dan perasaan seseorang. Padanan langsung “hatiku” tetap wajar dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini merupakan sapaan langsung. Partikel “ya” menandai bentuk vokatif secara alami dan khidmat dalam bahasa Indonesia.
- source_word: אָשִׁירָה
  choice: aku hendak bernyanyi
  rationale: Bentuk kohortatif mengungkapkan kehendak atau tekad penutur. “Aku hendak” mempertahankan nuansa kemauan tanpa terdengar kuno.
- source_word: וַאֲזַמְּרָה
  choice: dan bermazmur
  rationale: Kata kerja זמר dalam bentuk piel merujuk pada bernyanyi atau memainkan musik sebagai pujian. “Bermazmur” sesuai dengan konteks kitab dan mempertahankan kesejajaran puitis dengan “bernyanyi”.
- source_word: אַף
  choice: bahkan
  rationale: Di sini kata tersebut memberi penegasan atau perluasan pada frasa penutup. “Bahkan” mempertahankan tekanan puitisnya.
- source_word: כְּבוֹדִי
  choice: kemuliaanku
  rationale: Arti harfiahnya adalah “kemuliaanku”. Dalam puisi Ibrani, ungkapan ini dapat menunjuk pada diri batin, seluruh keberadaan, atau mungkin lidah sebagai alat pujian. Teks utama mempertahankan metafora tersebut, sedangkan kemungkinan maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna כְּבוֹדִי dalam bahasa pujian puitis
  choice: kemuliaanku
  alternative: seluruh keberadaanku; jiwaku; lidahku
  rationale: Ungkapan Ibrani ini metaforis dan dapat ditafsirkan dengan beberapa cara. Terjemahan mempertahankan gambaran harfiahnya agar ambiguitas sumber tidak diselesaikan secara diam-diam, sambil mencantumkan kemungkinan penafsirannya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Bermazmur” dipertahankan sebagai istilah puitis yang lazim dalam konteks ibadah. Susunan frasa terakhir sengaja tetap agak tidak biasa untuk menjaga metafora dan ambiguitas teks Ibrani.
