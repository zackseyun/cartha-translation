  text: שִׁ֖יר מִזְמ֣וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/000.yaml
  text: A song, a psalm of David[a].
translation:
  language: id
  text: Nyanyian, mazmur Daud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mazmur oleh Daud” atau “mazmur untuk Daud”; kata Ibrani dapat menunjukkan kepengarangan, persembahan, atau keterkaitan.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר
  choice: nyanyian
  rationale: Kata benda ini secara umum berarti nyanyian. Dalam judul yang dipasangkan dengan מִזְמוֹר, padanan sederhana ini mempertahankan dua sebutan jenis karya tanpa mempersempitnya menjadi nyanyian pujian.
- source_word: מִזְמוֹר
  choice: mazmur
  rationale: Dalam judul-judul kitab Mazmur, istilah ini secara lazim dan tepat menunjuk pada gubahan liris yang berkaitan dengan musik; 'mazmur' mempertahankan istilah jenis karya yang sudah dikenal.
- source_word: לְדָוִד
  choice: Daud
  rationale: 'Dalam ungkapan judul ''mazmur Daud'', hubungan yang dinyatakan ל tetap cukup terbuka dalam bahasa Indonesia: dapat dipahami sebagai karya oleh Daud, untuk Daud, atau yang berkaitan dengannya. Catatan kaki menyatakan rentang makna itu secara eksplisit.'
theological_decisions:
- issue: Makna keterangan yang menghubungkan mazmur dengan Daud
  choice: Memakai ungkapan alami 'mazmur Daud' dan mempertahankan ketidakpastian hubungannya melalui catatan kaki.
  alternative: '''mazmur oleh Daud'' atau ''mazmur untuk Daud'''
  rationale: Kata depan ל dalam judul ini tidak mengharuskan penerjemah menetapkan secara khusus kepengarangan atau persembahan. Terjemahan tidak boleh membuat klaim historis yang lebih tegas daripada teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Susunan nominal tanpa kata kerja sesuai dengan bentuk singkat judul Ibrani dan terasa alami sebagai judul mazmur.
