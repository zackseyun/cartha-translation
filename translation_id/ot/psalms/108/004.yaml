  text: כִּֽי גָד֣וֹל מֵֽ/עַל שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/004.yaml
  text: For your steadfast love is great above the heavens[a], and your faithfulness reaches to the clouds.
translation:
  language: id
  text: Sebab kasih setia-Mu besar melampaui langit, dan kesetiaan-Mu[a] mencapai awan-awan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kebenaran-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi pujian dalam konteks dan tetap alami dalam bahasa Indonesia puitis.
- source_word: גָדוֹל מֵעַל שָׁמַיִם
  choice: besar melampaui langit
  rationale: Mempertahankan gagasan kebesaran yang melampaui ketinggian langit sekaligus menghasilkan ungkapan Indonesia yang alami.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: Menyampaikan kasih yang teguh, loyal, dan dapat diandalkan tanpa mempersempitnya secara eksplisit menjadi istilah teknis perjanjian.
- source_word: וְעַד
  choice: dan ... mencapai
  rationale: Kata kerja 'mencapai' disediakan dari paralelisme untuk menyatakan batas jangkauan secara wajar dalam bahasa Indonesia.
- source_word: שְׁחָקִים
  choice: awan-awan
  rationale: Mempertahankan citra konkret wilayah tinggi dalam puisi Ibrani.
- source_word: אֲמִתֶּךָ
  choice: kesetiaan-Mu
  rationale: Dalam kesejajaran dengan חֶסֶד, kata ini terutama menunjuk pada sifat Allah yang teguh dan dapat dipercaya; kemungkinan arti 'kebenaran' tetap dicatat.
theological_decisions:
- issue: Penerjemahan pasangan sifat ilahi חֶסֶד dan אֱמֶת
  choice: kasih setia dan kesetiaan
  alternative: belas kasih dan kebenaran
  rationale: Pilihan utama menyampaikan dimensi relasional dan keteguhan sifat Allah dalam paralelisme tanpa memasukkan rumusan doktrinal tambahan. Arti leksikal alternatif bagi אֱמֶת dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang sederhana dan bermartabat. Bentuk sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
