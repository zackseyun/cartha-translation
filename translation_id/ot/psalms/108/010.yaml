id: PSA.108.10
reference: Psalms 108:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מִבְצָ֑ר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/010.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b][c]
translation:
  language: id
  text: Siapa yang akan membawa aku ke kota berbenteng? Siapa yang akan menuntun aku sampai ke Edom?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara bentuk, kata Ibrani yang diterjemahkan “akan menuntun aku” adalah bentuk perfektif dan dapat diterjemahkan “telah menuntun aku”; di sini makna mendatang dipilih karena kesejajarannya dengan baris pertama.
    reason: lexical_alternative
  - marker: b
    text: “Kota berbenteng” mungkin menunjuk pada sebuah kubu pertahanan tertentu di Edom, yang secara tradisional sering dipahami sebagai Sela/Petra, tetapi teks Ibrani tidak menyebut nama kotanya.
    reason: cultural_note
lexical_decisions:
- source_word: מִי
  choice: Siapa
  rationale: Kata tanya yang membuka dua pertanyaan retoris; bentuk sederhana ini alami dan tepat dalam bahasa Indonesia.
- source_word: יֹבִלֵנִי
  choice: akan membawa aku
  rationale: Bentuk Hifil dari יבל menyatakan tindakan membawa atau menuntun seseorang; 'membawa aku' cocok dengan tujuan yang disebut sesudahnya.
- source_word: עִיר מִבְצָר
  choice: kota berbenteng
  rationale: Rangkaian konstruksi ini secara idiomatis berarti kota yang diperkuat dengan benteng. Bahasa Ibrani tidak memakai kata sandang, dan bahasa Indonesia tidak memerlukannya untuk tetap merujuk pada kota tertentu dalam konteks.
- source_word: נָחַנִי
  choice: akan menuntun aku
  rationale: Walaupun bentuknya secara morfologis perfektif, kesejajarannya dengan verba imperfektif pada baris pertama dan konteks permohonan mendukung makna prospektif/modal.
- source_word: עַד אֱדוֹם
  choice: sampai ke Edom
  rationale: עַד menandai batas atau jangkauan; 'sampai ke Edom' mempertahankan nuansa itu secara alami.
theological_decisions:
- issue: Nilai waktu/aspek נָחַנִי dalam baris kedua
  choice: akan menuntun aku
  alternative: telah menuntun aku
  rationale: Terjemahan futur mempertahankan paralelisme sinonim dengan יֹבִלֵנִי dan sesuai dengan pertanyaan yang mengharapkan pertolongan ke depan, sementara catatan kaki tetap menyatakan bentuk formal Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang lugas dan bermartabat. Pengulangan 'Siapa yang akan' mempertahankan paralelisme Ibrani; 'membawa aku' dan 'menuntun aku' menjaga perbedaan leksikal kedua verba.
