  text: So that your beloved ones may be rescued[a], save with your right hand and answer me.
translation:
  language: id
  text: Supaya orang-orang yang Engkau kasihi diselamatkan[a], selamatkanlah mereka dengan tangan kanan-Mu dan jawablah aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dilepaskan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Supaya
  rationale: Menandai tujuan atau hasil dan secara alami menghubungkan anak kalimat dalam bahasa Indonesia modern.
- source_word: יֵחָלְצוּן
  choice: diselamatkan
  rationale: Bentuk nifal dari חלץ di sini menyatakan pembebasan atau penyelamatan; bentuk pasif mempertahankan struktur Ibrani.
- source_word: יְדִידֶיךָ
  choice: orang-orang yang Kaukasihi
  rationale: Menyampaikan bentuk jamak dan nuansa kasih dengan bahasa Indonesia yang alami serta bermartabat.
- source_word: הוֹשִׁיעָה
  choice: selamatkanlah
  rationale: Imperatif dari ישׁע diterjemahkan secara ringkas dan mempertahankan kaitannya dengan gagasan penyelamatan pada klausa sebelumnya.
- source_word: יְמִינְךָ
  choice: dengan tangan kanan-Mu
  rationale: Mempertahankan gambaran tangan kanan sebagai sarana tindakan dan kuasa ilahi.
- source_word: וַעֲנֵנִי
  choice: dan jawablah aku
  rationale: Mempertahankan imperatif dengan akhiran orang pertama tunggal, tanpa menyelaraskannya dengan penerima manfaat yang berbentuk jamak.
theological_decisions:
- issue: Peralihan dari penerima manfaat jamak kepada pemohon tunggal
  choice: Mempertahankan “orang-orang yang Kaukasihi” lalu “jawablah aku”
  alternative: Menyelaraskan bagian akhir menjadi “jawablah kami”
  rationale: Teks Ibrani beralih dari kelompok yang dikasihi Allah kepada pemazmur sebagai individu. Peralihan ini dipertahankan agar ketegangan dalam teks sumber tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan khidmat. Kapitalisasi pronomina ilahi mengikuti gaya penerbitan Indonesia. Pengulangan akar makna keselamatan dipertahankan karena mencerminkan hubungan leksikal dan retoris antarklausa.
