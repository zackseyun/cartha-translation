  - severity: low
    issue: Pilihan “Kaukasihi” kurang natural dibanding “Engkau kasihi” dalam register baku yang dipilih.
    rationale: Keduanya mungkin, tetapi bentuk terpisah lebih lancar dan umum dalam gaya Alkitab Indonesia modern.
