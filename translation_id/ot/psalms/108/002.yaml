base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/002.yaml
  text: Awake[a], harp and lyre; I will awaken the dawn.
translation:
  language: id
  text: Bangunlah, hai harpa dan lira! Aku akan membangunkan fajar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Aku akan membangunkan pagi.” Ini adalah gambaran puitis tentang bangun sebelum fajar untuk memuji Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרָה
  choice: Bangunlah
  rationale: Bentuk imperatif ini merupakan seruan puitis kepada alat-alat musik. “Bangunlah” alami dalam bahasa Indonesia dan mempertahankan personifikasinya.
- source_word: הַנֵּבֶל
  choice: harpa
  rationale: Kata ini menunjuk pada alat musik berdawai. “Harpa” merupakan padanan modern yang mudah dipahami tanpa memakai istilah arkais.
- source_word: וְכִנּוֹר
  choice: dan lira
  rationale: כִּנּוֹר umumnya merujuk pada lira. Membedakannya dari נֵבֶל mempertahankan penyebutan dua alat musik yang berlainan.
- source_word: אָעִירָה
  choice: Aku akan membangunkan
  rationale: Bentuk orang pertama tunggal ini menyatakan tekad atau kehendak. “Akan membangunkan” mempertahankan gema akar kata עור yang juga dipakai dalam seruan pembuka.
- source_word: שָּׁחַר
  choice: fajar
  rationale: Kata ini berarti fajar atau waktu terbitnya pagi. “Fajar” ringkas, puitis, dan lazim dalam bahasa Indonesia.
