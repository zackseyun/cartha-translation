translation:
  language: id
  text: Tinggikanlah diri-Mu di atas langit[a], ya Allah, dan kemuliaan-Mu di atas seluruh bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bangkitlah di atas langit, ya Allah.”
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Ibrani, baris kedua secara harfiah berbunyi, “dan di atas seluruh bumi kemuliaan-Mu”; tidak ada verba yang dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּמָה
  choice: Tinggilah
  rationale: Bentuk perintah dari רום menyatakan permohonan agar Allah tinggi atau ditinggikan. “Tinggilah” mempertahankan bentuk langsung dan ringkas serta dapat memuat nuansa kedudukan maupun penghormatan.
- source_word: עַל שָׁמַיִם
  choice: mengatasi langit
  rationale: Dalam hubungan dengan verba רום, עַל menyatakan posisi yang lebih tinggi. “Mengatasi langit” mempertahankan gambaran vertikal dan bentuk jamak kolektif שָׁמַיִם secara alami dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini merupakan sapaan langsung; partikel “ya” menandai vokatif secara alami dan khidmat.
- source_word: וְעַל כָּל הָאָרֶץ
  choice: dan ... mengatasi seluruh bumi
  rationale: Frasa ini membentuk baris sejajar dengan klausa pertama. “Seluruh bumi” tepat dalam kesejajaran kosmis dengan langit.
- source_word: כְּבוֹדֶךָ
  choice: kemuliaan-Mu
  rationale: כָּבוֹד dalam konteks pujian kepada Allah menunjuk pada kemuliaan, keagungan, dan kehormatan-Nya; “kemuliaan-Mu” merupakan padanan Indonesia yang lazim dan tepat.
theological_decisions:
- issue: Verba yang tidak dinyatakan pada baris kedua
  choice: dan kemuliaan-Mu mengatasi seluruh bumi
  alternative: dan kiranya kemuliaan-Mu berada di atas seluruh bumi
  rationale: Bahasa Ibrani tidak memiliki verba eksplisit pada baris kedua. Terjemahan utama mempertahankan elipsis puitis dan membiarkan daya permohonan dari baris pertama berlaku secara sejajar, tanpa mengubahnya secara tegas menjadi pernyataan atau menambahkan penanda harapan.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan khidmat. Elipsis pada baris kedua dipertahankan agar dekat dengan bentuk Ibrani, sementara “mengatasi” digunakan secara konsisten untuk menonjolkan gambaran ketinggian.
