  yaml_path: translation/ot/psalms/108/003.yaml
  text: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
translation:
  language: id
  text: Aku akan bersyukur kepada-Mu di antara bangsa-bangsa[a], ya Yahweh[b], dan aku akan menyanyikan pujian kepada-Mu di antara suku-suku bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai dua ungkapan sejajar, yaitu “di antara bangsa-bangsa” dan “di antara suku-suku bangsa,” untuk menggambarkan khalayak internasional bagi pujian ini.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “aku akan bersyukur kepada-Mu” juga dapat diterjemahkan “aku akan memuji-Mu.”
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Aku akan bersyukur kepada-Mu
  rationale: Bentuk Hifil dari ידה dalam konteks mazmur menyatakan syukur atau pujian yang mengakui karya Allah. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan sasaran orang kedua.
- source_word: בָעַמִּים
  choice: di antara bangsa-bangsa
  rationale: Bentuk jamak עַמִּים menunjuk kepada berbagai bangsa atau kelompok masyarakat dan menegaskan ruang lingkup internasional pujian.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama pribadi Yahweh, bukan diganti dengan gelar; partikel 'ya' menandai sapaan langsung secara alami.
- source_word: וַאֲזַמֶּרְךָ
  choice: aku akan menyanyikan pujian bagi-Mu
  rationale: Bentuk Piel dari זמר mengandung unsur bernyanyi atau bermusik untuk memuji. Pilihan ini mempertahankan sisi musikal sekaligus doxologis.
- source_word: בַּל
  choice: di antara
  rationale: Dalam baris puitis ini בַּל berfungsi sebagai preposisi yang sejajar dengan בָ pada baris pertama; 'di antara' mempertahankan kesejajaran tersebut.
- source_word: אֻמִּים
  choice: suku-suku bangsa
  rationale: אֻמִּים berarti bangsa-bangsa atau kelompok-kelompok masyarakat. 'Suku-suku bangsa' membedakannya secara ringan dari עַמִּים tanpa menghilangkan paralelisme sinonim.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa אוֹדְךָ
  choice: Aku akan bersyukur kepada-Mu
  alternative: Aku akan memuji-Mu
  rationale: Kata ידה dalam bentuk Hifil dapat berarti mengucap syukur maupun memuji. Teks utama memakai nuansa syukur, sementara kemungkinan nuansa pujian dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Paralelisme puisi Ibrani dipertahankan dengan dua istilah yang berdekatan makna, sedangkan sapaan 'ya Yahweh' terdengar alami dalam konteks doa atau nyanyian.
