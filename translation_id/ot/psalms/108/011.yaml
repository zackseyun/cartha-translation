id: PSA.108.11
reference: Psalms 108:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/לֹֽא אֱלֹהִ֥ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/011.yaml
  text: Have you not rejected us[a], O God? And do you not go out with our armies?
translation:
  language: id
  text: Bukankah Engkau telah menolak kami[a], ya Allah? Bukankah Engkau, ya Allah, tidak maju bersama bala tentara kami?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuang kami.” Kata Ibrani yang dipakai dapat menyatakan penolakan yang keras.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel tanya retoris ini mengharapkan pengakuan atas kenyataan yang dikeluhkan; “Bukankah” mempertahankan daya retorisnya secara wajar dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini menunjuk kepada Allah Israel yang esa, sebagaimana tampak dari bentuk-bentuk verba tunggal; pengulangannya dipertahankan sebagai sapaan langsung.
- source_word: זְנַחְתָּנוּ
  choice: Engkau telah menolak kami
  rationale: Verba זנח menyatakan penolakan atau tindakan membuang. “Menolak kami” jelas, kuat, dan tidak memperlunak keluhan pemazmur.
- source_word: וְלֹא
  choice: Bukankah ... tidak
  rationale: Negasi pada klausa kedua tetap berada dalam lingkup pertanyaan retoris. Pemisahan menjadi pertanyaan kedua menghasilkan bahasa Indonesia yang lebih jelas tanpa mengubah hubungan koordinatifnya.
- source_word: תֵצֵא
  choice: maju
  rationale: Secara harfiah berarti “keluar”, tetapi dalam konteks peperangan menunjuk pada tindakan berangkat atau maju bersama pasukan. “Maju” menyampaikan idiom militer itu secara alami tanpa menambahkan gagasan bertempur yang tidak dinyatakan.
- source_word: בְּצִבְאֹתֵינוּ
  choice: bersama bala tentara kami
  rationale: צָבָא menunjuk pada pasukan atau tentara, sedangkan ב menyatakan penyertaan dalam konteks ini. “Bala tentara” mempertahankan nuansa militer dan bentuk kolektifnya.
theological_decisions:
- issue: Bahasa penolakan ilahi dalam ratapan
  choice: Pernyataan bahwa Allah telah “menolak kami” dipertahankan sebagai keluhan langsung.
  alternative: Memperlunaknya menjadi “meninggalkan kami” atau “tidak menyertai kami”.
  rationale: Bahasa Ibrani memakai זנח, kata yang kuat untuk penolakan. Terjemahan mempertahankan ketegangan teologis ratapan tanpa menjelaskan atau melunakkan tuduhan pemazmur.
- issue: Ketidakikutsertaan Allah bersama pasukan Israel
  choice: Klausa kedua diterjemahkan sebagai pertanyaan retoris bahwa Allah tidak maju bersama bala tentara mereka.
  alternative: Menerjemahkannya sebagai pernyataan biasa atau menyisipkan “tidak lagi”.
  rationale: Bentuk pertanyaan dari הֲלֹא wajar dipahami menaungi keluhan ayat ini, sedangkan “tidak lagi” akan menambahkan unsur waktu yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Dua klausa dijadikan dua pertanyaan retoris agar alur keluhan jelas; pengulangan sapaan “ya Allah” mempertahankan penekanan puitis teks Ibrani.
