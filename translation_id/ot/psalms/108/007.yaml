base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/007.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
translation:
  language: id
  text: Allah telah berfirman dalam kekudusan-Nya:[a] “Aku akan bersorak-sorai;[b] Aku akan membagi Sikhem dan mengukur Lembah Sukot.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat kudus-Nya” atau “demi kekudusan-Nya.” Ungkapan Ibrani ini dapat menunjuk pada kekudusan Allah atau pada tempat kudus yang berkaitan dengan-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku akan bergembira.” Kata Ibrani ini mengungkapkan kegembiraan yang meluap.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Kata kerja tunggal menunjukkan bahwa אֱלֹהִים di sini merujuk kepada Allah Israel; ‘Allah’ merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: דִּבֶּר
  choice: telah berfirman
  rationale: Bentuk perfektif melaporkan ucapan ilahi yang sudah disampaikan dan tetap relevan. ‘Berfirman’ sesuai untuk perkataan Allah, sedangkan ‘telah’ mempertahankan aspek selesai tanpa terasa kaku.
- source_word: בְּקָדְשׁוֹ
  choice: dalam kekudusan-Nya
  rationale: Ungkapan ini paling wajar dipahami sebagai lingkup atau sifat kudus yang menyertai firman Allah. Namun, קֹדֶשׁ juga dapat menunjuk pada tempat kudus; kemungkinan itu dicatat dalam catatan kaki.
- source_word: אֶעְלֹזָה
  choice: Aku akan bersorak-sorai
  rationale: Kata kerja ini menyatakan kegembiraan yang meluap dan bernada kemenangan. ‘Bersorak-sorai’ lebih alami bagi pembaca Indonesia daripada padanan yang terlalu abstrak.
- source_word: אֲחַלְּקָה
  choice: Aku akan membagi
  rationale: Dalam konteks wilayah, kata ini menggambarkan pembagian atau penjatahan tanah. ‘Membagi’ mempertahankan gambaran konkretnya dengan bahasa yang lugas.
- source_word: שְׁכֶם
  choice: Sikhem
  rationale: Nama tempat dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: dan Lembah Sukot
  rationale: Rangkaian konstruksi Ibrani secara alami menyatakan ‘Lembah Sukot’; kedua unsurnya merupakan nama geografis.
- source_word: אֲמַדֵּד
  choice: mengukur
  rationale: Bentuk intensif ini menggambarkan pengukuran wilayah, dengan implikasi penguasaan atau penetapan bagian. ‘Mengukur’ mempertahankan citra asli tanpa menambahkan tafsiran ke dalam teks utama.
theological_decisions:
- issue: Cakupan kutipan dan identitas penutur orang pertama
  choice: Teks utama menampilkan semua verba orang pertama sebagai firman Allah tentang kedaulatan-Nya atas wilayah tersebut.
  alternative: ‘Aku akan bersorak-sorai’ dapat dipahami sebagai tanggapan pemazmur, sedangkan firman langsung Allah dimulai dengan ‘Aku akan membagi Sikhem.’
  rationale: Sesudah formula ‘Allah telah berfirman’, pembacaan paling berkesinambungan menganggap seluruh pernyataan orang pertama sebagai firman langsung Allah. Namun, teks Ibrani tidak memakai tanda kutip dan memungkinkan peralihan penutur, sehingga alternatif tersebut dicatat.
- issue: Makna בְּקָדְשׁוֹ
  choice: dalam kekudusan-Nya
  alternative: di tempat kudus-Nya; demi kekudusan-Nya
  rationale: Nomina קֹדֶשׁ dapat menyatakan kekudusan sebagai sifat atau tempat kudus. Konteks puitis mendukung sifat ilahi, tetapi ambiguitas leksikalnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. ‘Bersorak-sorai’ mempertahankan semangat kemenangan, sedangkan ‘membagi’ dan ‘mengukur’ menjaga gambaran konkret tentang kedaulatan atas wilayah. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum bahasa Indonesia.
