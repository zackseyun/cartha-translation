  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/012.yaml
  text: Give us help against the adversary[b][a], for the salvation of man is vain.
translation:
  language: id
  text: Berilah kami pertolongan melawan musuh[a], sebab penyelamatan oleh manusia sia-sia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kesesakan,” jika צַר dipahami secara impersonal sebagai keadaan sulit, bukan secara personal sebagai musuh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “penyelamatan manusia sia-sia.” Dalam konteks ini, frasa tersebut menunjuk pada penyelamatan atau pertolongan yang berasal dari manusia.
    reason: clarification
lexical_decisions:
- source_word: הָבָה
  choice: Berilah
  rationale: Bentuk permohonan imperatif dalam doa; “Berilah” langsung, alami, dan tetap bermartabat.
- source_word: לָּנוּ
  choice: kami
  rationale: Objek penerima yang secara alami menyatu dalam frasa Indonesia “Berilah kami pertolongan”.
- source_word: עֶזְרַת
  choice: pertolongan
  rationale: Menyatakan bantuan atau pertolongan dan cocok dengan laras doa serta kesejajaran dengan תְּשׁוּעַת.
- source_word: מִצָּר
  choice: melawan lawan
  rationale: צַר dapat berarti lawan atau kesesakan. Konteks peperangan mendukung arti personal, sedangkan מִן setelah gagasan pertolongan diungkapkan secara idiomatis dengan “melawan”.
- source_word: וְשָׁוְא
  choice: sebab ... sia-sia
  rationale: שָׁוְא menyatakan kehampaan atau ketidakbergunaan. “Sebab” mengungkapkan hubungan alasan yang tersirat dalam konteks tanpa mengubah isi pernyataan.
- source_word: תְּשׁוּעַת
  choice: penyelamatan
  rationale: Dalam konteks ini menunjuk pada tindakan melepaskan atau menyelamatkan; “penyelamatan” menghindari penyempitan makna menjadi keselamatan rohani.
- source_word: אָדָם
  choice: manusia
  rationale: Kata ini dipakai secara generik bagi manusia; “manusia” alami dalam bahasa Indonesia dan tidak membatasi rujukan pada laki-laki.
theological_decisions:
- issue: Makna generik אָדָם dalam pernyataan tentang ketidakmampuan manusia
  choice: manusia
  alternative: umat manusia
  rationale: Bahasa Indonesia “manusia” secara wajar bersifat generik dan mempertahankan kontras antara pertolongan ilahi dan penyelamatan yang berasal dari manusia.
- issue: Cakupan תְּשׁוּעַת dalam konteks mazmur peperangan
  choice: penyelamatan
  alternative: kelepasan atau kemenangan
  rationale: Pilihan ini mempertahankan gagasan umum tentang penyelamatan tanpa memasukkan pembatasan doktrinal; konteks dapat mencakup kelepasan atau kemenangan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras doa puitis yang ringkas. Susunan dua bagian dipertahankan, dan ambiguitas צַר dicatat tanpa membebani teks utama.
