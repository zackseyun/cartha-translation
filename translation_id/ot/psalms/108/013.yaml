translation:
  language: id
  text: Dengan Allah, kita akan bertindak dengan gagah perkasa[a], dan Dialah yang akan menginjak-injak lawan-lawan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dengan Allah kita akan melakukan tindakan-tindakan perkasa”; ungkapan Ibrani ini dapat menekankan kekuatan, kegagahan, atau tindakan yang menghasilkan kemenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Bersama Allah
  rationale: Preposisi ב dapat menyatakan penyertaan sekaligus sarana. Pilihan ini alami dalam bahasa Indonesia dan menyatakan ketergantungan umat kepada Allah tanpa membatasi maknanya hanya pada perantaraan.
- source_word: נַעֲשֶׂה חָיִל
  choice: kita akan bertindak gagah perkasa
  rationale: Ungkapan Ibrani ini dapat menunjuk pada tindakan dengan kekuatan atau keberanian dan pada pencapaian kemenangan. Terjemahan ini mempertahankan unsur tindakan serta nuansa keberanian dalam konteks peperangan.
- source_word: וְהוּא
  choice: dan Dialah
  rationale: Kata penghubung menyatakan koordinasi, sedangkan pronomina eksplisit memberi penekanan pada Allah sebagai pelaku tindakan berikutnya.
- source_word: יָבוּס
  choice: akan menginjak-injak
  rationale: Kata בוס secara konkret berarti menginjak atau menginjak-injak. Pilihan ini mempertahankan gambaran kuat tentang penaklukan musuh.
- source_word: צָרֵינוּ
  choice: lawan-lawan kita
  rationale: Kata ini menunjuk kepada pihak-pihak yang memusuhi. 'Lawan-lawan' jelas dan wajar dalam bahasa Indonesia modern serta cocok dengan konteks konflik.
theological_decisions:
- issue: Peran manusia dan tindakan Allah dalam kemenangan
  choice: Umat bertindak gagah perkasa bersama Allah, sedangkan Allah sendiri menginjak-injak lawan mereka.
  alternative: Menampilkan kemenangan sebagai tindakan Allah saja dengan mengecilkan peran umat, atau sebagai prestasi manusia dengan Allah sekadar membantu.
  rationale: Teks Ibrani secara berurutan menyebut tindakan umat dalam ketergantungan kepada Allah dan tindakan tegas Allah sendiri. Terjemahan mempertahankan keduanya tanpa meleburkan atau mempertentangkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. 'Bertindak gagah perkasa' mempertahankan idiom tindakan dan keberanian, sedangkan 'menginjak-injak' menjaga gambaran militer yang konkret.
