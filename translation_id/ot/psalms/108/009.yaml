base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/009.yaml
  text: Moab is my washbasin[a]; on Edom I throw my sandal[c][b]; over Philistia I shout in triumph.
translation:
  language: id
  text: Moab adalah bejana pembasuhan-Ku[a]; ke atas Edom Kulemparkan sandal-Ku[b]; atas Filistia Aku bersorak.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belanga pembasuhan-Ku.” Gambaran Ibraninya ialah wadah yang dipakai untuk membasuh dan mengungkapkan penghinaan atau penaklukan Moab.
    reason: lexical_alternative
  - marker: b
    text: Atau “Kucampakkan alas kaki-Ku.” Tindakan ini kemungkinan melambangkan penguasaan atau klaim atas Edom.
    reason: lexical_alternative
  - marker: c
    text: Atau “atas Filistia Aku mengangkat seruan” atau “atas Filistia Aku berseru keras.” Kata kerja Ibraninya dapat menunjuk pada seruan sukacita ataupun seruan perang.
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: bejana pembasuhan-Ku
  rationale: סִיר menunjuk pada wadah atau bejana, sedangkan רַחְצִי menentukan fungsinya untuk membasuh. Pilihan ini mempertahankan gambaran konkret dan bernada merendahkan tanpa memakai istilah yang terlalu modern atau mempersempit bentuk wadahnya.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: Kulemparkan sandal-Ku
  rationale: Bentuk kausatif dari שלך menyatakan tindakan melemparkan, dan נַעַל adalah alas kaki; 'sandal' alami dalam konteks dunia Timur Dekat kuno. Gambaran konkret dipertahankan, sedangkan makna penguasaan tidak dimasukkan ke dalam teks utama.
- source_word: עַל / עֲלֵי
  choice: ke atas / atas
  rationale: Preposisi עַל memiliki rentang makna spasial dan dapat pula bernuansa permusuhan. 'Ke atas Edom' sesuai dengan gerakan melempar, sementara 'atas Filistia' mempertahankan arah atau sasaran seruan tanpa menghapus ambiguitas.
- source_word: אֶתְרוֹעָע
  choice: Aku bersorak penuh kemenangan
  rationale: Kata kerja ini menyatakan seruan keras yang dapat bersifat gembira ataupun perang. Konteks penaklukan mendukung nuansa kemenangan, tetapi catatan kaki tetap menyajikan kemungkinan 'pekik perang' atau seruan keras.
- source_word: פְלֶשֶׁת
  choice: Filistia
  rationale: Nama Ibrani ini menunjuk pada negeri atau wilayah Filistia, bukan secara langsung kepada orang Filistin.
- source_word: מוֹאָב / אֱדוֹם
  choice: Moab / Edom
  rationale: Bentuk nama baku dalam bahasa Indonesia dipertahankan.
theological_decisions:
- issue: Bahasa metaforis tentang penguasaan atas bangsa-bangsa musuh
  choice: Mempertahankan gambaran bejana pembasuhan, pelemparan sandal, dan sorak kemenangan.
  alternative: Memparafrasakannya secara langsung sebagai penghinaan, klaim kepemilikan, dan penaklukan politik.
  rationale: Puisi Ibrani menyampaikan penguasaan melalui gambaran konkret yang kuat. Menjelaskan seluruh simbolisme di dalam teks utama akan meratakan puisinya dan menghapus sebagian ambiguitas; karena itu, kemungkinan maknanya dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Bentuk pronominal ilahi memakai kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur tiga klausa dan metafora konkret teks Ibrani dipertahankan.
