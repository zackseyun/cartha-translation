  text: לִ֤/י גִלְעָ֨ד לִ֤/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹקְקִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
translation:
  language: id
  text: Gilead adalah milik-Ku; Manasye adalah milik-Ku; Efraim adalah benteng bagi kepala-Ku[a]; Yehuda adalah tongkat pemerintahan-Ku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Efraim adalah benteng kepala-Ku,” suatu gambaran puitis tentang kekuatan yang melindungi.
    reason: lexical_alternative
  - marker: b
    text: Atau “Yehuda adalah pemberi hukum-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: adalah milik-Ku
  rationale: Preposisi ל dengan akhiran orang pertama tunggal menyatakan kepemilikan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan deklarasi kepemilikan ilahi.
- source_word: גִלְעָד
  choice: Gilead
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Nama suku dan wilayah ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מָעוֹז
  choice: benteng
  rationale: Kata ini menunjuk pada tempat atau sumber perlindungan dan kekuatan; 'benteng' mempertahankan citra militer-politisnya.
- source_word: רֹאשִׁי
  choice: kepala-Ku
  rationale: Terjemahan harfiah ini mempertahankan citra puitis Ibrani tanpa mengubahnya secara interpretatif menjadi 'ketopong-Ku' atau ungkapan lain.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מְחֹקְקִי
  choice: tongkat pemerintahan-Ku
  rationale: Nomina ini dapat menunjuk kepada pembuat ketetapan/penguasa atau tongkat yang melambangkan wewenang. Dalam konteks puisi kerajaan, pilihan ini mempertahankan citra konkret sekaligus kaitannya dengan pemerintahan.
theological_decisions:
- issue: Citra pemerintahan Yehuda dalam מְחֹקְקִי
  choice: Yehuda adalah tongkat pemerintahan-Ku
  alternative: Yehuda adalah pemberi hukum-Ku
  rationale: Teks menggambarkan suku-suku Israel sebagai milik atau sarana pemerintahan ilahi. 'Tongkat pemerintahan-Ku' mempertahankan citra kerajaan dan tidak menyiratkan secara terlalu sempit bahwa Yehuda secara harfiah memberi hukum kepada Allah; kemungkinan makna personal 'pemberi hukum-Ku' dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada akhiran pronomina yang merujuk kepada Allah mengikuti kebiasaan ortografi Alkitab bahasa Indonesia. Susunan paralel dan citra tubuh dalam puisi Ibrani dipertahankan.
