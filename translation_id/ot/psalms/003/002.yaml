  yaml_path: translation/ot/psalms/003/002.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
translation:
  language: id
  text: Banyak orang berkata tentang diriku[a], “Tidak ada keselamatan[b] baginya dari Allah.” Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada jiwaku”; ungkapan Ibrani ini berarti “tentang diriku” atau “mengenai aku”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kelepasan”.
    reason: lexical_alternative
  - marker: c
    text: “Sela” tampaknya merupakan istilah musik atau liturgis; makna tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: Banyak orang
  rationale: Kata sifat jamak ini dipakai sebagai kata benda dan menunjuk kepada sejumlah besar orang. “Banyak orang” alami dan jelas dalam bahasa Indonesia.
- source_word: אֹמְרִים
  choice: terus berkata
  rationale: Bentuk partisip Ibrani menyatakan tindakan yang sedang berlangsung atau berulang. “Terus berkata” mempertahankan nuansa duratif itu.
- source_word: לְנַפְשִׁי
  choice: tentang diriku
  rationale: Secara harfiah berarti “kepada jiwaku”, tetapi נֶפֶשׁ di sini mewakili pribadi atau diri pemazmur. Dalam konteks kutipan yang menyebutnya sebagai “dia”, ungkapan ini paling wajar dipahami sebagai perkataan tentang dirinya.
- source_word: אֵין
  choice: Tidak ada
  rationale: Ini adalah bentuk penyangkalan eksistensial yang secara langsung dan alami diterjemahkan “tidak ada”.
- source_word: יְשׁוּעָתָה
  choice: keselamatan
  rationale: Nomina ini menunjuk pada tindakan menyelamatkan atau melepaskan dari bahaya. “Keselamatan” mempertahankan jangkauan makna konkret sekaligus bobot teologis istilah tersebut dalam Mazmur.
- source_word: לּוֹ
  choice: baginya
  rationale: Akhiran pronominal merujuk kepada pemazmur dalam orang ketiga di dalam ucapan para lawannya.
- source_word: בֵאלֹהִים
  choice: dalam Allah
  rationale: Terjemahan ini mempertahankan preposisi ב secara dekat tanpa memperluasnya secara interpretatif menjadi “dari Allah” atau “oleh Allah”.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak pasti. Transliterasi menghindari pemaksaan tafsiran seperti “jeda” atau “selingan”.
theological_decisions:
- issue: Apakah יְשׁוּעָה diterjemahkan dengan istilah umum untuk pelepasan atau dengan “keselamatan”
  choice: keselamatan
  alternative: penyelamatan; kelepasan; pertolongan
  rationale: Konteks mencakup penyelamatan konkret dari musuh, tetapi “keselamatan” juga mempertahankan gema teologis yang lebih luas tanpa mengharuskan makna rohani yang terpisah dari konteks.
- issue: Apakah לְנַפְשִׁי diterjemahkan secara harfiah atau idiomatis
  choice: tentang diriku
  alternative: kepada jiwaku
  rationale: Terjemahan harfiah dapat memberi kesan bahwa perkataan itu ditujukan kepada bagian batin pemazmur. Idiom Ibrani di sini menunjuk kepada dirinya sebagai pribadi, sementara penggunaan “baginya” dalam kutipan mendukung pengertian bahwa orang-orang itu berbicara tentang dia.
- issue: Cara mempertahankan hubungan keselamatan dengan Allah dalam בֵאלֹהִים
  choice: dalam Allah
  alternative: dari Allah; pada Allah
  rationale: '“Dalam Allah” mempertahankan bentuk preposisional teks dan ketegangannya: para lawan menyangkal adanya keselamatan baginya dalam hubungannya dengan Allah. “Dari Allah” lebih lancar, tetapi membuat sumber keselamatan lebih eksplisit daripada bentuk Ibraninya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas. “Diriku” dipilih agar lebih alami daripada “aku” setelah “tentang”, sedangkan “dalam Allah” sengaja mempertahankan ungkapan sumber yang agak padat. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
