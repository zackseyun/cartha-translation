revisions:
- from: Banyak orang terus berkata tentang diriku[a], “Tidak ada keselamatan[b] baginya dalam Allah.” Sela.[c]
  to: Banyak orang berkata tentang diriku[a], “Tidak ada keselamatan[b] baginya dari Allah.” Sela.[c]
  rationale: Revisi mengganti "dalam Allah" dengan "dari Allah" agar hubungan keselamatan dengan Allah tersampaikan secara jelas dan idiomatis dalam bahasa Indonesia, sesuai konteks tutur para lawan. Bentuk ini tidak menentukan mekanisme penyelamatan atau menambahkan doktrin. Nuansa partisip tidak perlu dieksplisitkan dengan "terus", karena "berkata" dalam konteks ini dapat menyatakan ujaran yang sedang/kerap terjadi. Catatan b diperbaiki agar memberi alternatif makna yang benar-benar berguna.
  reviewer_model: gpt-5.6-terra
