  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶקְרָ֑א וַ/יַּֽעֲנֵ֨/נִי מֵ/הַ֖ר קָדְשׁ֣/וֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/004.yaml
  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: id
  text: Dengan suaraku aku berseru kepada Yahweh, dan Ia menjawabku[a] dari gunung-Nya yang kudus[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan Ia telah menjawabku”; kata kerja Ibrani ini secara bentuk dapat dipahami sebagai bentuk lampau.
    reason: alternative_reading
  - marker: b
    text: Secara tradisional juga diterjemahkan “dari bukit-Nya yang kudus.” Kata Ibraninya pada dasarnya berarti “gunung” dan kemungkinan menunjuk kepada Sion.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: Dengan suaraku
  rationale: Secara harfiah berarti “suaraku.” Bentuk “dengan suaraku” mempertahankan penempatan unsur ini di awal baris serta nuansa instrumentalnya tanpa mengubahnya menjadi sekadar “dengan nyaring.”
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah seruan atau doa kepada Yahweh; “kepada” merupakan padanan Indonesia yang alami dan tepat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֶקְרָא
  choice: aku berseru
  rationale: Dalam konteks doa di tengah kesesakan, קרא bermakna memanggil atau berseru. “Berseru” menyampaikan intensitas konteks tanpa melebih-lebihkannya.
- source_word: וַיַּעֲנֵנִי
  choice: dan Ia menjawabku
  rationale: Bentuk Ibrani secara formal dapat dipahami sebagai lampau, tetapi dalam puisi dapat menyatakan tindakan yang hidup atau keyakinan yang berlaku. Bentuk kini dipakai dalam teks utama, sedangkan kemungkinan bentuk lampau dicatat dalam catatan kaki.
- source_word: מֵהַר קָדְשׁוֹ
  choice: dari gunung-Nya yang kudus
  rationale: הַר pada dasarnya berarti “gunung.” Bentuk ini lebih langsung mencerminkan leksim Ibrani daripada “bukit,” dan dalam konteks kemungkinan menunjuk kepada Sion.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna atau fungsi istilah ini tidak pasti; transliterasi menghindari penafsiran yang terlalu tegas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Nuansa aspek/waktu וַיַּעֲנֵנִי dalam puisi
  choice: 'bentuk kini: “Ia menjawabku”'
  alternative: 'bentuk lampau: “Ia menjawabku” atau “Ia telah menjawabku” dalam konteks lampau'
  rationale: Bentuk wayyiqtol mendukung pembacaan lampau, tetapi pemakaian puitis memungkinkan penyajian yang hidup atau bersifat umum. Teks utama mempertahankan kehadiran dan keyakinan pemazmur, sementara kemungkinan lampau dinyatakan dalam catatan kaki agar ketegangan aspek tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan awal “Dengan suaraku” sengaja mempertahankan penekanan puitis bahasa Ibrani. Kata ganti untuk Allah ditulis “Ia” dan akhiran posesif “-Nya” mengikuti kebiasaan ejaan religius Indonesia; “Sela” dipertahankan sebagai transliterasi.
