  text: I lay down and slept[a]; I awoke[b], because Yahweh sustains me.
translation:
  language: id
  text: 'Aku berbaring lalu tidur;

    aku terbangun, sebab Yahweh menopangku.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: Aku berbaring
  rationale: Bentuk ini menyatakan tindakan berbaring dan secara alami membuka urutan berbaring, tidur, lalu bangun.
- source_word: וָאִישָׁנָה
  choice: lalu tidur
  rationale: Kata kerja dari ישׁן berarti 'tidur'. 'Lalu' mengungkapkan urutan tindakan secara wajar dalam bahasa Indonesia tanpa menambah gagasan baru.
- source_word: הֱקִיצוֹתִי
  choice: aku terbangun
  rationale: Kata kerja קיץ berarti 'bangun/terjaga dari tidur'. 'Terbangun' bersifat intransitif dan sesuai dengan konteks pemazmur yang bangun setelah tidur.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan pemazmur dapat bangun dengan selamat. 'Sebab' mempertahankan hubungan kausal sekaligus cocok dengan ragam puitis yang tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: יִסְמְכֵנִי
  choice: menopangku
  rationale: Dari סמך, yang berarti 'menopang, menyokong, mempertahankan'. 'Menopangku' alami, ringkas, dan mempertahankan gambaran tentang dukungan Yahweh yang terus berlangsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Sifat tindakan ilahi dalam יִסְמְכֵנִי
  choice: menopangku
  alternative: menyokongku atau mempertahankan aku
  rationale: Pilihan ini tidak membatasi penopangan pada satu saat saja; bentuk verba dapat menyatakan dukungan ilahi yang sedang atau terus berlaku sebagai alasan pemazmur dapat tidur dan bangun.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. Paralel urutan tindakan dipertahankan dalam dua baris; pronomina enklitik pada 'menopangku' menjaga kelancaran dan kepadatan ayat.
