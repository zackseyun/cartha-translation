id: PSA.3.8
reference: Psalms 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לַ/יהוָ֥ה הַ/יְשׁוּעָ֑ה עַֽל עַמְּ/ךָ֖ בִרְכָתֶ֣/ךָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/008.yaml
  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
translation:
  language: id
  text: Keselamatan adalah milik Yahweh; berkat-Mu atas umat-Mu.[a] Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berkat-Mu ada atas umat-Mu.” Klausa Ibraninya tidak memiliki verba sehingga dapat dipahami sebagai pernyataan ataupun doa.
    reason: alternative_reading
  - marker: b
    text: “Sela” kemungkinan merupakan petunjuk liturgis atau musikal; arti tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: adalah milik Yahweh
  rationale: 'Prefiks ל dalam klausa tanpa verba ini menyatakan kepemilikan atau keterkaitan: keselamatan adalah milik Yahweh atau berasal dari-Nya. Ungkapan ini mempertahankan nama ilahi יהוה dan hubungan gramatikalnya.'
- source_word: הַיְשׁוּעָה
  choice: keselamatan
  rationale: Kata benda ini mencakup tindakan menyelamatkan, pembebasan, dan kemenangan. 'Keselamatan' alami dalam konteks doa serta tetap memuat cakupan teologis yang lebih luas.
- source_word: עַל
  choice: atas
  rationale: Dalam hubungannya dengan berkat dan umat, preposisi ini menggambarkan berkat yang berada atau dicurahkan atas mereka.
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: '''Umat-Mu'' menyampaikan hubungan komunal dan perjanjian antara Yahweh dengan umat yang menjadi milik-Nya; bentuk -Mu memakai huruf kapital karena merujuk kepada Allah.'
- source_word: בִרְכָתֶךָ
  choice: berkat-Mu
  rationale: ברכה secara langsung berarti 'berkat'. Pilihan ini lebih utuh daripada 'perkenanan' dan tidak mempersempit maknanya.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna istilah ini tidak pasti dan kemungkinan merupakan petunjuk liturgis atau musikal, sehingga ditransliterasikan, bukan diterjemahkan secara spekulatif.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Klausa kedua yang tidak memiliki verba
  choice: berkat-Mu atas umat-Mu
  alternative: kiranya berkat-Mu ada atas umat-Mu; berkat-Mu ada atas umat-Mu
  rationale: Bahasa Ibrani tidak menyatakan apakah klausa ini merupakan penegasan atau permohonan. Klausa nominal Indonesia mempertahankan ketegangan tersebut sejauh mungkin; catatan kaki menjelaskan kedua kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa kedua sengaja ringkas tanpa verba agar ambiguitas asli antara pernyataan dan permohonan tidak dihapus. 'Umat-Mu' dipilih daripada 'bangsa-Mu' karena lebih alami dalam konteks relasi perjanjian.
