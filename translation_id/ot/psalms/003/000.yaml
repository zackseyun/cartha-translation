  text: מִזְמ֥וֹר לְ/דָוִ֑ד בְּ֝/בָרְח֗/וֹ מִ/פְּנֵ֤י אַבְשָׁל֬וֹם בְּנֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/000.yaml
  text: A psalm of David[a], when he fled from Absalom his son.
translation:
  language: id
  text: Mazmur Daud[a], ketika ia melarikan diri dari Absalom, anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mazmur karya Daud” atau “mazmur untuk Daud”; judul dalam bahasa Ibrani dapat menunjukkan kepengarangan, peruntukan, atau keterkaitan.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku dalam bahasa Indonesia untuk jenis karya puisi-musik yang disebut dalam judul ini; lebih tepat dalam konteks kitab Mazmur daripada istilah umum seperti “nyanyian”.
- source_word: לְדָוִד
  choice: Daud
  rationale: Konstruksi “Mazmur Daud” alami dalam bahasa Indonesia dan tetap cukup terbuka terhadap makna kepengarangan, peruntukan, kepemilikan, atau keterkaitan yang dapat dinyatakan oleh preposisi Ibrani לְ.
- source_word: בְּבָרְחוֹ
  choice: ketika ia melarikan diri
  rationale: Preposisi בְּ dengan infinitif konstruk dan sufiks pronominal berfungsi temporal; ungkapan ini menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: מִפְּנֵי
  choice: dari
  rationale: Secara harfiah berarti “dari hadapan,” tetapi dalam konteks tindakan melarikan diri, padanan idiomatis yang alami adalah “dari.”
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama diri ditransliterasikan menurut bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Nomina dengan sufiks orang ketiga tunggal maskulin ini secara langsung menyatakan hubungan keluarga; “anaknya” merupakan padanan alami dan tepat.
theological_decisions:
- issue: Makna keterangan לְדָוִד dalam judul mazmur
  choice: Memakai “Mazmur Daud” tanpa secara tegas menetapkan kepengarangan.
  alternative: “Mazmur karya Daud” atau “Mazmur untuk Daud.”
  rationale: Dalam judul mazmur, preposisi Ibrani לְ dapat menunjukkan kepengarangan, peruntukan, kepemilikan, atau keterkaitan. Terjemahan utama mempertahankan keluasan makna tersebut dan tidak membuat klaim historis yang lebih tegas daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan “Absalom, anaknya” mempertahankan penekanan hubungan keluarga pada akhir judul, sedangkan “Mazmur Daud” mengikuti bentuk judul yang alami dan dikenal luas tanpa menutup ambiguitas bahasa Ibrani.
