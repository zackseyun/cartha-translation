id: PSA.3.1
reference: Psalms 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְ֭הוָה מָֽה רַבּ֣וּ צָרָ֑/י רַ֝בִּ֗ים קָמִ֥ים עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/001.yaml
  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: id
  text: Ya Yahweh, betapa banyak lawanku! Banyak orang bangkit melawan aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”; partikel “Ya” menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: מָה רַבּוּ
  choice: betapa banyak
  rationale: מָה bersifat eksklamatif di sini, dan bersama רַבּוּ menyatakan banyaknya lawan, bukan mengajukan pertanyaan.
- source_word: צָרָי
  choice: lawanku
  rationale: Kata ini menunjuk kepada pihak yang memusuhi atau menentang pemazmur; “lawan” mempertahankan cakupan tersebut tanpa mempersempitnya menjadi lawan militer.
- source_word: רַבִּים
  choice: Banyak orang
  rationale: Adjektiva ini dipakai secara substantival. Penambahan “orang” diperlukan agar ungkapannya alami dan jelas dalam bahasa Indonesia.
- source_word: קָמִים עָלָי
  choice: bangkit melawan aku
  rationale: Konstruksi קום dengan עַל menggambarkan tindakan bangkit atau berdiri secara bermusuhan terhadap seseorang; terjemahan ini mempertahankan gambaran tersebut tanpa mengartikannya secara lebih khusus sebagai serangan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan sapaan pembuka serta pengulangan gagasan “banyak” yang memberi tekanan puitis pada keluhan pemazmur.
