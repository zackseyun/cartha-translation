id: PSA.3.7
reference: Psalms 3:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: id
  text: Bangkitlah, ya Yahweh! Selamatkanlah aku, ya Allahku! Sebab Engkau telah memukul semua musuhku di rahang; Engkau telah mematahkan gigi orang-orang fasik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “rahang” juga dapat berarti “pipi”. Verba “telah memukul” dan “telah mematahkan” berbentuk perfektif; dalam puisi, bentuk ini juga dapat menggambarkan tindakan yang dipandang pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Bangkitlah
  rationale: Bentuk imperatif dari קום yang ditujukan kepada Allah; ungkapan ini wajar dalam bahasa Indonesia dan mempertahankan seruan kuat agar Allah bertindak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: הוֹשִׁיעֵנִי
  choice: Selamatkanlah aku
  rationale: Imperatif hifil dari ישׁע dengan sufiks orang pertama tunggal; pilihan ini mempertahankan arti luas berupa penyelamatan dari bahaya.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk berkepunyaan diterjemahkan secara langsung dan mempertahankan sifat pribadi seruan pemazmur.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan dasar atau alasan bagi permohonan yang mendahuluinya.
- source_word: הִכִּיתָ
  choice: Engkau telah memukul
  rationale: Bentuk perfektif diterjemahkan sebagai tindakan yang telah terjadi, tanpa melunakkan gambaran jasmaninya.
- source_word: אֶת כָּל אֹיְבַי
  choice: semua musuhku
  rationale: Terjemahan langsung yang alami bagi frasa objek tersebut.
- source_word: לֶחִי
  choice: pada rahang
  rationale: לֶחִי dapat berarti pipi atau rahang; 'rahang' cocok dengan gambaran paralel tentang gigi, sementara kemungkinan 'pipi' dicatat dalam catatan kaki.
- source_word: שִׁנֵּי רְשָׁעִים
  choice: gigi orang-orang fasik
  rationale: Mempertahankan gambaran konkret dan memahami bentuk jamak substantival רְשָׁעִים sebagai orang-orang yang fasik.
- source_word: שִׁבַּרְתָּ
  choice: Engkau telah mematahkan
  rationale: Bentuk perfektif dan citra penghancuran dipertahankan secara jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Aspek verba perfektif הִכִּיתָ dan שִׁבַּרְתָּ dalam konteks doa
  choice: 'Tindakan yang telah dilakukan: ''telah memukul ... telah mematahkan'''
  alternative: 'Tindakan yang diyakini atau menjadi ciri karya Allah: ''memukul ... mematahkan'''
  rationale: Bentuk Ibrani paling langsung menyatakan tindakan sempurna atau selesai, tetapi puisi dapat menggunakannya untuk tindakan yang dipandang pasti. Terjemahan utama mengikuti nilai perfektif, sedangkan keluwesan puitisnya dijelaskan dalam catatan kaki.
- issue: Gambaran kekerasan terhadap para musuh
  choice: Mempertahankan gambaran memukul rahang dan mematahkan gigi
  alternative: Memparafrasakannya secara abstrak sebagai mengalahkan orang fasik
  rationale: Teks Ibrani memakai citra tubuh yang konkret untuk menyatakan penghinaan dan pelumpuhan kekuatan orang fasik; citra tersebut tidak dilunakkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan kuat. Partikel “ya” menandai sapaan langsung, sedangkan citra tubuh yang tajam dipertahankan tanpa ungkapan arkais.
