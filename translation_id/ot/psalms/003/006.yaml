lexical_decisions:
- source_word: לֹא אִירָא
  choice: Aku tidak akan takut
  rationale: Bentuk imperfek orang pertama tunggal dengan negasi menyatakan keyakinan atau tekad untuk tidak takut; bentuk dengan 'akan' alami dalam konteks puisi ini.
- source_word: מֵרִבְבוֹת עָם
  choice: kepada puluhan ribu orang
  rationale: רְבָבוֹת adalah bentuk jamak yang menggambarkan jumlah sangat besar, secara harfiah kelipatan 'sepuluh ribu'. Setelah verba 'takut', prefiks מִן dialihkan secara idiomatis dengan 'kepada'.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini memperkenalkan klausa yang menerangkan kumpulan orang tersebut.
- source_word: סָבִיב שָׁתוּ עָלָי
  choice: mengepung aku dari segala penjuru
  rationale: Gabungan 'di sekeliling', verba 'menempatkan', dan עָלַי menggambarkan orang-orang yang mengambil posisi mengelilingi pemazmur; 'mengepung' menyampaikan gambaran spasial dan konteks permusuhan secara alami.
