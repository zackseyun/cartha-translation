base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: id
  text: Namun Engkau, ya Yahweh, adalah perisai di sekelilingku[a], kemuliaanku, dan Engkaulah yang mengangkat kepalaku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perisai bagiku” atau “perisai yang melindungiku”. Kata depan Ibrani dapat menyatakan perlindungan demi seseorang, meskipun di sini kemungkinan besar menggambarkan perlindungan yang mengelilingi.
    reason: lexical_alternative
  - marker: b
    text: “Mengangkat kepalaku” adalah ungkapan Ibrani yang dapat menggambarkan pemulihan martabat, keyakinan, atau pembenaran.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Namun Engkau
  rationale: Konjungsi yang diikuti kata ganti mandiri memberi pertentangan kuat dengan kesesakan pada ayat-ayat sebelumnya. “Namun Engkau” menyampaikan kontras itu sekaligus mempertahankan penekanan pada pribadi yang disapa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: מָגֵן בַּעֲדִי
  choice: perisai di sekelilingku
  rationale: מָגֵן berarti perisai, sedangkan בַּעֲדִי dapat menyatakan perlindungan bagi seseorang atau gambaran perlindungan yang mengelilinginya. Dalam konteks ini, “di sekelilingku” mempertahankan citra perlindungan secara alami dalam bahasa Indonesia.
- source_word: כְּבוֹדִי
  choice: kemuliaanku
  rationale: כָּבוֹד dapat berarti kemuliaan, kehormatan, atau martabat. “Kemuliaanku” mempertahankan ungkapan Ibrani yang padat tanpa membatasi maknanya pada satu penafsiran.
- source_word: וּמֵרִים רֹאשִׁי
  choice: dan Dia yang mengangkat kepalaku
  rationale: Bentuk partisip menunjukkan tindakan yang menjadi ciri pelakunya. Terjemahan ini mempertahankan citra konkret “mengangkat kepala” serta menyatakan Yahweh sebagai pelaku tindakan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: ya Yahweh
  alternative: ya TUHAN; ya Yehova
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi itu, sedangkan “ya” menandai sapaan secara wajar dalam bahasa Indonesia.
- issue: Makna idiom “mengangkat kepalaku”
  choice: Mempertahankan idiom harfiah dalam teks utama
  alternative: memulihkan kehormatanku; memberiku keberanian; membenarkan aku
  rationale: Citra Ibrani dapat mencakup pemulihan martabat, keyakinan, atau pembenaran. Mempertahankan ungkapan konkret menghindari penyempitan makna; penjelasan ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Huruf kapital pada “Engkau” dan “Dia” dipakai sebagai bentuk penghormatan kepada Allah. Susunan predikat dipertahankan ringkas agar kesejajaran puisi Ibrani tetap terasa.
