  terminology: “Yahweh,” “menjaga,” “mempertahankan hidupnya,” dan “keinginan musuh-musuhnya” tepat. “Disebut berbahagia” paling baik mencerminkan nuansa deklaratif verba Ibrani, sementara catatan kaki dapat mencatat alternatif “diberkati.”
