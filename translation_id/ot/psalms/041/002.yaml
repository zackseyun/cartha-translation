  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: id
  text: Yahweh akan menjaga dia dan mempertahankan hidupnya[a]; dia akan disebut berbahagia[b] di negeri, dan kiranya Engkau tidak menyerahkan dia kepada keinginan musuh-musuhnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membiarkan dia tetap hidup.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dia akan diberkati.” Kata Ibrani ini dapat berarti “menyebut berbahagia” atau, secara lebih umum, “memberkati.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kehendak musuh-musuhnya.” Secara harfiah, “ke dalam jiwa musuh-musuhnya”; dalam ungkapan ini, “jiwa” berarti keinginan atau kehendak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: יִשְׁמְרֵהוּ
  choice: akan menjaga dia
  rationale: Kata שׁמר berarti menjaga, melindungi, atau memelihara; pilihan ini alami dalam bahasa Indonesia dan tidak mengulang gagasan khusus tentang mempertahankan hidup pada verba berikutnya.
- source_word: וִיחַיֵּהוּ
  choice: dan mempertahankan hidupnya
  rationale: Bentuk piel dari חיה di sini menyatakan tindakan membiarkan atau menjaga seseorang tetap hidup. Ungkapan ini jelas dan menghindari pengulangan 'menjaga'.
- source_word: יאשר
  choice: dia akan diberkati
  rationale: Bentuk ini dapat dipahami sebagai pernyataan bahwa orang itu diberkati atau disebut berbahagia. Terjemahan utama mengikuti makna umum yang paling alami sambil mencatat nuansa alternatif.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: אֶרֶץ dapat berarti negeri, tanah, atau bumi. Dalam konteks kehidupan umat di wilayah mereka, 'negeri itu' merupakan padanan Indonesia yang alami tanpa memperluasnya menjadi seluruh bumi.
- source_word: וְאַל תִּתְּנֵהוּ
  choice: Kiranya Engkau tidak menyerahkan dia
  rationale: אַל dengan bentuk orang kedua menyatakan permohonan negatif kepada Yahweh. 'Kiranya' mempertahankan daya permohonan dan memperjelas peralihan dari penyebutan Yahweh dalam orang ketiga ke sapaan langsung.
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: kepada keinginan musuh-musuhnya
  rationale: נֶפֶשׁ dalam ungkapan ini menunjuk pada hasrat atau kehendak, bukan 'jiwa' sebagai unsur tak berwujud. Maksudnya ialah agar orang itu tidak diserahkan kepada apa yang dikehendaki para musuhnya.
theological_decisions:
- issue: Peralihan dari pernyataan tentang Yahweh ke permohonan langsung kepada-Nya
  choice: 'Klausa pertama diterjemahkan sebagai pernyataan orang ketiga, lalu klausa terakhir sebagai permohonan orang kedua: ''Kiranya Engkau tidak menyerahkan dia''.'
  alternative: 'Meratakan seluruh ayat menjadi pernyataan orang ketiga: ''dan Ia tidak akan menyerahkan dia''.'
  rationale: תִּתְּנֵהוּ berbentuk orang kedua tunggal maskulin dan secara alami menyapa Yahweh. Peralihan gramatikal dan ketegangan retoris dalam teks sumber perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang bermartabat dan mudah dipahami. Kapitalisasi 'Engkau' menandai sapaan langsung kepada Allah. Tanda titik sebelum permohonan terakhir membantu pembaca menangkap peralihan orang ketiga ke orang kedua yang memang terdapat dalam bahasa Ibrani.
