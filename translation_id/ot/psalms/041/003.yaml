  text: יְֽהוָ֗ה יִ֭סְעָדֶ/נּוּ עַל עֶ֣רֶשׂ דְּוָ֑י כָּל מִ֝שְׁכָּב֗/וֹ הָפַ֥כְתָּ בְ/חָלְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/003.yaml
  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
translation:
  language: id
  text: Yahweh akan menopang dia di ranjang sakitnya; dalam sakitnya, Engkau memulihkan seluruh tempat tidurnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau membalikkan seluruh tempat tidurnya dalam sakitnya.” Kata kerja Ibraninya secara harfiah berarti “membalikkan” atau “menjungkirbalikkan”; dalam konteks ini, ungkapan tersebut mungkin menggambarkan tindakan merawat atau memulihkan orang yang terbaring sakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: יִסְעָדֶנּוּ
  choice: akan menopang dia
  rationale: Kata kerja סעד menyatakan tindakan menopang atau menyokong seseorang dalam kelemahan; frasa ini alami dalam bahasa Indonesia dan sesuai dengan konteks penyakit.
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: di ranjang sakitnya
  rationale: Ungkapan ini secara harfiah menunjuk pada ranjang penyakit. 'Di ranjang sakitnya' mempertahankan gambaran tersebut dengan bahasa Indonesia yang wajar.
- source_word: כָּל מִשְׁכָּבוֹ
  choice: seluruh tempat tidurnya
  rationale: Kata כָּל mempertahankan cakupan menyeluruh, sedangkan מִשְׁכָּב menunjuk pada tempat berbaring. Pilihan ini juga membedakannya secara alami dari עֶרֶשׂ pada baris pertama.
- source_word: הָפַכְתָּ
  choice: Engkau memulihkan
  rationale: הפך secara dasar berarti membalik atau mengubah. Dalam konteks perawatan orang sakit, 'memulihkan' menyampaikan tindakan yang membawa perubahan baik tanpa meniadakan arti harfiahnya, yang dicatat dalam catatan kaki.
- source_word: בְחָלְיוֹ
  choice: dalam sakitnya
  rationale: Preposisi ב menyatakan keadaan atau situasi ketika tindakan berlangsung; terjemahan ini ringkas dan mempertahankan susunan puitis.
theological_decisions:
- issue: Peralihan sapaan dari orang ketiga kepada orang kedua
  choice: Mempertahankan peralihan dari 'Yahweh ... dia' menjadi sapaan langsung 'Engkau'.
  alternative: 'Menyeragamkan seluruh ayat menjadi orang ketiga: ''Ia memulihkan''.'
  rationale: Teks Ibrani beralih dari pembicaraan tentang Yahweh kepada sapaan langsung kepada-Nya. Peralihan ini merupakan bagian dari corak doa-puitis dan tidak perlu diratakan.
- issue: Makna tindakan הָפַכְתָּ terhadap tempat tidur orang sakit
  choice: Menerjemahkannya 'memulihkan' dalam teks utama sambil mencatat arti yang lebih harfiah.
  alternative: Menerjemahkannya secara langsung 'membalikkan seluruh tempat tidurnya'.
  rationale: Ungkapannya dapat menggambarkan perubahan atau penataan tempat tidur sebagai bentuk pemeliharaan, tetapi rincian idiomatisnya tidak sepenuhnya pasti. Catatan kaki menjaga ambiguitas leksikal itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Huruf kapital pada 'Engkau' menandai bahwa sapaan langsung ditujukan kepada Yahweh. Penanda catatan kaki [a] ditempatkan setelah klausa yang dijelaskannya.
