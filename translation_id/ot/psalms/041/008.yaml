  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: id
  text: “Sesuatu yang jahat[a] telah ditimpakan kepadanya; setelah ia terbaring, ia tidak akan bangun lagi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Suatu perkara keji melekat padanya,” atau, “Sebuah tuduhan jahat telah dikenakan kepadanya.” Ungkapan Ibraninya sulit dan dapat menunjuk pada penderitaan ganas ataupun tuduhan yang menghancurkan.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: sesuatu yang jahat
  rationale: Ungkapan Ibrani ini padat dan sulit; terjemahan ini mempertahankan kemungkinan bahwa yang dimaksud ialah penderitaan ganas ataupun tuduhan jahat tanpa memilih salah satunya.
- source_word: יָצוּק בּוֹ
  choice: telah ditimpakan kepadanya
  rationale: Kata kerja pasif יָצוּק secara harfiah dapat berarti 'dituangkan' atau 'dicurahkan', tetapi dalam ungkapan ini juga dapat menunjuk pada sesuatu yang dikenakan atau melekat. 'Ditimpakan' mempertahankan gambaran sesuatu yang mengenai orang itu dan terdengar alami dalam bahasa Indonesia.
- source_word: וַאֲשֶׁר שָׁכַב
  choice: setelah ia terbaring
  rationale: שָׁכַב berarti 'berbaring'. 'Terbaring' dapat menggambarkan keadaan sakit atau jatuh tanpa secara eksplisit menetapkan salah satu tafsiran.
- source_word: לֹא יוֹסִיף לָקוּם
  choice: ia tidak akan bangun lagi
  rationale: Ungkapan ini secara idiomatis menyatakan bahwa orang tersebut tidak akan kembali bangkit atau pulih; terjemahan langsung ini mempertahankan gambaran sumber.
theological_decisions:
- issue: Makna gambaran dalam baris pertama
  choice: Dibiarkan ambigu antara penderitaan ganas yang menimpa seseorang dan perkara atau tuduhan jahat yang dikenakan kepadanya.
  alternative: Penyakit keji melekat padanya; atau tuduhan jahat telah dikenakan kepadanya.
  rationale: Susunan Ibraninya sulit dan tidak memastikan apakah yang dibicarakan adalah penyakit, kutuk, atau tuduhan. Teks utama tidak mempersempit maknanya melampaui bukti sumber.
- issue: Makna 'tidak akan bangun lagi'
  choice: Mempertahankan gambaran bangun secara harfiah tanpa menyatakannya secara khusus sebagai kematian atau kegagalan untuk sembuh.
  alternative: Ia tidak akan sembuh lagi; atau ia akan mati.
  rationale: Konteks mungkin menyiratkan kematian atau ketidakpulihan, tetapi bahasa sumber tetap memakai gambaran berbaring dan bangun.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan khidmat. 'Terbaring' serta 'bangun lagi' mempertahankan citra konkret teks Ibrani, sedangkan catatan kaki menjelaskan ambiguitas ungkapan awal.
