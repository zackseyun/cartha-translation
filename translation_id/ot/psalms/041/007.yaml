  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
translation:
  language: id
  text: Bersama-sama semua orang yang membenci aku berbisik-bisik menentang aku[a]; terhadap aku mereka merancang kejahatan untuk mencelakakan aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tentang aku” pada kedua kemunculan ungkapan yang diterjemahkan “menentang aku” dan “terhadap aku”. Preposisi Ibrani dapat menunjukkan arah permusuhan atau pokok pembicaraan dan pemikiran; konteks mendukung arti permusuhan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “mereka merencanakan celaka bagiku” atau “mereka merancang yang jahat terhadap aku”. Ungkapan Ibrani menggabungkan verba berpikir atau merencanakan dengan kata “kejahatan”, sehingga menyatakan niat untuk mencelakakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Bersama-sama
  rationale: Kata keterangan ini menyatakan bahwa para pembenci bertindak secara kolektif atau seia sekata.
- source_word: עָלַי
  choice: menentang aku / terhadap aku
  rationale: Dalam konteks permusuhan, preposisi ini paling wajar menyatakan arah yang bermusuhan, walaupun dapat pula berarti 'tentang aku'.
- source_word: יִתְלַחֲשׁוּ
  choice: berbisik-bisik
  rationale: Bentuk verba ini menggambarkan mereka saling berbisik; pilihan ini mempertahankan gambaran konkret tanpa secara berlebihan menerjemahkannya sebagai persekongkolan resmi.
- source_word: כָּל שֹׂנְאָי
  choice: semua orang yang membenci aku
  rationale: Ungkapan ini mempertahankan daya verbal partisip Ibrani dan terdengar alami dalam bahasa Indonesia modern.
- source_word: יַחְשְׁבוּ
  choice: merancang
  rationale: Dalam rangkaian dengan 'kejahatan', verba ini menunjuk pada pemikiran atau perencanaan yang disengaja.
- source_word: רָעָה
  choice: kejahatan
  rationale: Pilihan ini mempertahankan keluasan makna moral dan maksud mencelakakan; 'malapetaka' atau 'celaka' juga mungkin menurut konteks.
- source_word: לִי
  choice: untuk menimpaku
  rationale: Ungkapan idiomatis ini menyampaikan bahwa kejahatan tersebut dirancang bagi si pemazmur sebagai sasaran, tanpa memberi kesan positif yang dapat timbul dari terjemahan harfiah 'bagiku'.
