  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: id
  text: Namun aku—dalam integritasku—Engkau telah menopang aku dan menempatkan aku di hadapan-Mu untuk selama-lamanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Kata sambung dan pronomina mandiri menandai peralihan yang bersifat kontras dengan konteks sebelumnya; 'Namun aku' menyatakannya secara alami dalam bahasa Indonesia.
- source_word: בְּתֻמִּי
  choice: dalam ketulusanku
  rationale: תֻּם menunjuk pada keutuhan moral, integritas, atau keadaan tidak bercela. 'Ketulusan' mempertahankan klaim moral pemazmur tanpa menyiratkan bahwa ia sama sekali tidak berdosa; preposisi ב diterjemahkan secara langsung dengan 'dalam'.
- source_word: תָּמַכְתָּ בִּי
  choice: Engkau menopang aku
  rationale: תמך dengan ב menyatakan tindakan menyokong atau memegang teguh seseorang. 'Menopang' alami dalam bahasa Indonesia dan mempertahankan nuansa penguatan serta pemeliharaan.
- source_word: וַתַּצִּיבֵנִי
  choice: dan Engkau menempatkan aku
  rationale: Bentuk Hifil dari נצב berarti membuat seseorang berdiri, menempatkan, atau menetapkan. 'Menempatkan aku' cukup langsung dan tidak menambahkan gagasan peneguhan yang tidak harus tersurat.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Secara harfiah berarti 'di depan wajah-Mu', sebuah idiom Ibrani untuk berada dalam hadirat seseorang. 'Di hadapan-Mu' mempertahankan citra relasional dalam ungkapan Indonesia yang wajar.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: עוֹלָם di sini menyatakan durasi yang tidak berakhir atau terus-menerus. 'Untuk selama-lamanya' sesuai dengan laras mazmur yang khidmat dan jelas bagi pembaca modern.
theological_decisions:
- issue: Makna pengakuan pemazmur tentang תֻּם
  choice: Ayat ini menyatakan ketulusan atau integritas pemazmur, bukan keadaan tanpa dosa secara mutlak ataupun jasa yang membeli pertolongan Allah.
  alternative: 'Istilah itu dapat dipahami sebagai keadaan tidak bercela, atau konstruksi ב dapat dibaca bernuansa sebab: ''karena ketulusanku.'''
  rationale: תֻּם mencakup integritas, keutuhan, dan keadaan tidak bercela. Terjemahan 'dalam ketulusanku' menjaga klaim moral teks serta ambiguitas fungsi preposisi tanpa mengubahnya menjadi ajaran tentang kesempurnaan tanpa dosa atau keselamatan berdasarkan jasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda pisah menegaskan peralihan kontras tanpa membuat susunan terasa kaku.
