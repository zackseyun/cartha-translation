  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: id
  text: Aku berkata, “Ya Yahweh, kasihanilah aku; sembuhkanlah jiwaku[a], karena aku telah berdosa terhadap-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pulihkanlah hidupku” atau “sembuhkanlah aku.” Kata Ibrani yang diterjemahkan “jiwaku” (nefesh) juga dapat berarti “nyawa,” “kehidupan,” atau “diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Adapun aku
  rationale: Pronomina mandiri ini memberi sedikit penekanan pada pemazmur. “Adapun aku” mempertahankan fungsi wacananya secara wajar dalam bahasa Indonesia.
- source_word: אָמַרְתִּי
  choice: aku berkata
  rationale: Bentuk perfektif orang pertama tunggal melaporkan perkataan pemazmur dan secara alami diterjemahkan dengan bentuk lampau yang dipahami dari konteks.
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”; partikel “Ya” menandai sapaan langsung dalam doa.
- source_word: חָנֵּנִי
  choice: kasihanilah aku
  rationale: Imperatif dari חנן memohon kemurahan atau belas kasihan. Ungkapan ini alami dalam doa bahasa Indonesia dan tidak membatasi permohonan pada rasa iba semata.
- source_word: רְפָאָה
  choice: sembuhkanlah
  rationale: Imperatif רפא secara langsung berarti menyembuhkan. Terjemahan ini mempertahankan metafora konkret tanpa menentukan apakah kesembuhan itu jasmani, batiniah, atau mencakup keduanya.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפש dapat berarti jiwa, nyawa, kehidupan, diri, atau orang seutuhnya. “Jiwaku” mempertahankan bentuk ungkapan Ibrani, sedangkan catatan kaki menjaga keluasan maknanya.
- source_word: כִּי
  choice: karena
  rationale: Di sini כִּי memperkenalkan alasan bagi permohonan pemazmur.
- source_word: חָטָאתִי
  choice: aku telah berdosa
  rationale: Bentuk perfektif menyatakan tindakan berdosa yang tetap relevan bagi pengakuan dan permohonan saat ini.
- source_word: לָךְ
  choice: terhadap-Mu
  rationale: Bersama kata kerja “berdosa”, preposisi ini menandai pihak yang dilanggar; “berdosa terhadap-Mu” menyampaikan pelanggaran relasional itu secara jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Ya Yahweh
  alternative: Ya TUHAN
  rationale: Teks memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi, sedangkan “Ya” menandai sapaan.
- issue: Cakupan frasa “sembuhkanlah jiwaku”
  choice: sembuhkanlah jiwaku
  alternative: sembuhkanlah aku; pulihkanlah hidupku
  rationale: Bahasa Ibrani dapat menunjuk pada batin, nyawa, kehidupan, atau diri seutuhnya. Teks utama mempertahankan ungkapan konkret dan catatan kaki menjaga keluasan antropologis serta teologisnya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Adapun aku” mempertahankan penekanan pronomina Ibrani; “kasihanilah aku” memakai ragam doa yang alami. Huruf kapital pada “-Mu” mengikuti kebiasaan ortografis penghormatan bagi sapaan kepada Allah.
