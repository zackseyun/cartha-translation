  text: For the choir director. A psalm of David[a].
translation:
  language: id
  text: Untuk pemimpin musik. Mazmur Daud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur oleh Daud” atau “Mazmur untuk Daud”; judul Ibrani ini dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, bentuk ini dengan prefiks ל menunjuk kepada orang yang memimpin atau mengawasi penyajian musik. Ungkapan ini alami dalam bahasa Indonesia modern dan tidak mempersempit maknanya hanya pada paduan suara.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku untuk jenis nyanyian ini, khususnya dalam judul kitab Mazmur.
- source_word: לְדָוִד
  choice: Daud
  rationale: Konstruksi ringkas “Mazmur Daud” mempertahankan keluwesan frasa Ibrani, yang dapat menyatakan kepengarangan, hubungan, kepemilikan, atau peruntukan, tanpa memaksakan salah satu tafsiran.
theological_decisions:
- issue: Makna keterangan yang menghubungkan mazmur dengan Daud
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud; Mazmur untuk Daud
  rationale: Prefiks ל dalam judul Ibrani mempunyai cakupan makna yang luas. Teks utama mempertahankan rumusan yang terbuka, sedangkan kemungkinan kepengarangan dan peruntukan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Pemimpin musik” dipilih daripada “pemimpin biduan” yang kini terasa kuno, serta daripada “pemimpin paduan suara” yang terlalu mempersempit cakupan istilah Ibrani.
