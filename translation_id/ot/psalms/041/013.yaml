base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/013.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: id
  text: Terpujilah Yahweh, Allah Israel, dari kekal sampai kekal.[a] Amin dan amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari kekekalan sampai kekekalan.” Ungkapan Ibrani ini menyatakan waktu tanpa batas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Dalam rumusan doksologi, bentuk pasif ini berfungsi sebagai seruan pujian. “Terpujilah” alami dalam bahasa Indonesia dan mempertahankan daya liturgisnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini secara langsung berarti Allah yang disembah dan dikenal oleh Israel; bentuk tanpa kata depan paling ringkas dan alami dalam doksologi Indonesia.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: dari kekal sampai kekal
  rationale: Ungkapan ini menyatakan rentang waktu yang tidak berbatas. Pilihan ini mempertahankan struktur “dari … sampai …” dan nada puitis sumber tanpa mempersempit עוֹלָם menjadi suatu zaman tertentu.
- source_word: אָמֵן וְאָמֵן
  choice: Amin dan amin
  rationale: Pengulangan penegasan liturgis dipertahankan secara eksplisit sebagai penutup yang kuat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. Transliterasi “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan waktu dalam מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: dari kekal sampai kekal
  alternative: dari zaman ke zaman; selama-lamanya
  rationale: Konteks doksologi menunjuk pada durasi tanpa batas. Bentuk yang dipilih menjaga citra temporal sumber, sedangkan catatan kaki menjelaskan jangkauannya tanpa memaksakan definisi filosofis tentang kekekalan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, agung, dan liturgis. Penanda catatan kaki ditempatkan sesudah frasa waktu yang diterangkannya.
