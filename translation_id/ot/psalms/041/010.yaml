id: PSA.41.10
reference: Psalms 41:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: id
  text: Tetapi Engkau, ya Yahweh, kasihanilah aku dan bangkitkanlah aku, supaya aku dapat membalas mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan aku akan membalas mereka.” Bentuk kohortatif Ibrani dapat dipahami sebagai tujuan atau hasil (“supaya aku dapat membalas mereka”), atau sebagai tekad yang menyusul setelah permohonan-permohonan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Tetapi Engkau
  rationale: Konjungsi yang diikuti pronomina mandiri menandai kontras dengan para musuh dan sahabat yang dibicarakan sebelumnya; bentuk ini menyampaikan daya adversatif secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: חָנֵּנִי
  choice: kasihanilah aku
  rationale: Verba חנן memohon belas kasih atau kemurahan hati. Ungkapan ini alami dalam doa bahasa Indonesia dan tetap mencakup tindakan memberi kemurahan.
- source_word: וַהֲקִימֵנִי
  choice: dan bangkitkanlah aku
  rationale: Bentuk Hifil dari קום secara konkret berarti menyebabkan seseorang bangkit atau berdiri; pilihan ini mempertahankan metafora yang dalam konteks mazmur dapat mencakup pemulihan dari sakit atau penindasan.
- source_word: וַאֲשַׁלְּמָה
  choice: supaya aku dapat membalas
  rationale: Bentuk Piel dari שלם menyatakan membalas atau memberi ganjaran. Kohortatif setelah permohonan dapat menyatakan tujuan atau hasil, tetapi juga mungkin merupakan tekad lanjutan; ambiguitas ini dicatat dalam catatan kaki.
- source_word: לָהֶם
  choice: mereka
  rationale: Preposisi ל menandai objek penerima; dalam bahasa Indonesia, 'membalas mereka' lebih alami daripada bentuk harfiah 'membalas kepada mereka'.
theological_decisions:
- issue: Apakah maksud pembalasan oleh pemazmur perlu diperhalus untuk menghindari nuansa kutukan atau penghukuman
  choice: mempertahankan 'membalas mereka'
  alternative: '''membela perkaraku terhadap mereka'' atau ''memperlakukan mereka setimpal dengan perbuatan mereka'''
  rationale: שלם di sini secara langsung menunjuk pada tindakan membalas atau memberi ganjaran. Memperhalusnya akan meredam ketegangan yudisial dalam teks, sedangkan ayat ini sendiri tidak menjelaskan bentuk pembalasan tersebut.
translation_notes:
  register: Bahasa doa yang modern, wajar, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum teks keagamaan Indonesia. Nama Yahweh dipertahankan, dan metafora konkret 'bangkitkanlah' tidak dijelaskan secara berlebihan.
