id: PSA.41.1
reference: Psalms 41:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֭שְׁרֵי מַשְׂכִּ֣יל אֶל דָּ֑ל בְּ/י֥וֹם רָ֝עָ֗ה יְֽמַלְּטֵ֥/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: id
  text: Berbahagialah orang yang memperhatikan orang miskin[a][b]; pada hari kesusahan[c], Yahweh akan menyelamatkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau ‘bertindak bijaksana terhadap orang miskin.’ Kata kerja Ibrani dapat berarti menunjukkan perhatian yang penuh pengertian dan kebijaksanaan.
    reason: lexical_alternative
  - marker: b
    text: Atau ‘orang lemah’ atau ‘orang berkekurangan.’
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, ‘pada hari yang jahat’; di sini kata ‘jahat’ menunjuk pada malapetaka atau kesusahan, bukan kejahatan moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk ini lazim dan bermartabat untuk ungkapan ucapan bahagia Ibrani, serta menyatakan keadaan yang diperkenan dan diberkati, bukan sekadar perasaan senang.
- source_word: מַשְׂכִּיל
  choice: yang memperhatikan
  rationale: Bentuk Hifil dari שׂכל di sini menyiratkan perhatian yang lahir dari pengertian dan kebijaksanaan. ‘Memperhatikan’ alami dalam bahasa Indonesia, sementara nuansa bertindak bijaksana dicatat dalam catatan kaki.
- source_word: אֶל
  choice: kepada, terserap dalam konstruksi ‘memperhatikan orang miskin’
  rationale: Preposisi ini menunjukkan arah perhatian kepada orang yang rentan; dalam bahasa Indonesia, maknanya sudah tercakup secara idiomatis oleh verba ‘memperhatikan’.
- source_word: דָּל
  choice: orang miskin
  rationale: Kata ini dapat menunjuk orang miskin, lemah, atau berkekurangan. ‘Orang miskin’ merupakan padanan langsung dan mudah dipahami, sedangkan cakupan makna lainnya dipertahankan dalam catatan kaki.
- source_word: בְּיוֹם רָעָה
  choice: pada hari kesusahan
  rationale: רָעָה dalam konteks ini menunjuk kemalangan atau bencana, bukan terutama kejahatan moral. ‘Hari kesusahan’ mempertahankan bentuk ungkapan Ibrani sekaligus menyampaikan maksudnya dengan jelas.
- source_word: יְמַלְּטֵהוּ
  choice: akan menyelamatkannya
  rationale: Bentuk Piel dari מלט menyatakan tindakan melepaskan atau menyelamatkan seseorang dari bahaya. Pilihan ini alami dan tetap memiliki bobot yang sesuai dengan janji dalam mazmur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Acuan tunggal representatif pada subjek dan sufiks objek
  choice: Mempertahankan bentuk tunggal melalui ‘orang yang …’ dan ‘-nya’
  alternative: Mengubahnya menjadi bentuk jamak, misalnya ‘orang-orang yang … mereka’
  rationale: Bahasa Ibrani memakai figur tunggal representatif dan sufiks maskulin tunggal. Bentuk Indonesia mempertahankan ketunggalan tanpa menyatakan bahwa prinsip ini hanya berlaku bagi laki-laki.
- issue: Janji penyelamatan sebagai pernyataan hikmat dalam mazmur
  choice: Menerjemahkan janji secara langsung tanpa membatasi atau memperluasnya
  alternative: Menjelaskannya sebagai jaminan kemakmuran mutlak atau melemahkannya menjadi sekadar kemungkinan umum
  rationale: Teks menyatakan bahwa Yahweh akan menyelamatkan orang tersebut. Terjemahan mempertahankan daya pernyataan itu tanpa memasukkan kerangka teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis-hikmat yang sederhana dan bermartabat. ‘Berbahagialah’ mempertahankan bentuk ucapan bahagia, sedangkan susunan klausa mengikuti gerak teks Ibrani tanpa terasa kaku.
