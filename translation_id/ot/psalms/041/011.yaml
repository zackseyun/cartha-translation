  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: id
  text: Dengan ini aku tahu bahwa Engkau berkenan kepadaku,[a] sebab musuhku tidak bersorak menang atasku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Engkau menyukaiku” atau “Engkau merasa senang terhadapku.” Kata Ibrani yang dipakai menyatakan rasa senang, kesukaan, atau perkenanan.
    reason: lexical_alternative
  - marker: b
    text: Atau “musuhku tidak berjaya atasku.” Kata Ibraninya secara lebih harfiah menggambarkan orang yang meneriakkan sorak kemenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Dari hal inilah
  rationale: Gabungan preposisi dan kata tunjuk ini menyatakan dasar atau bukti yang membuat pemazmur mengetahui sesuatu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa evidensialnya.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Walaupun bentuk Ibraninya perfektif, dalam konteks ini kata tersebut menyatakan pengetahuan yang kini dimiliki berdasarkan bukti yang disebutkan.
- source_word: חָפַצְתָּ בִּי
  choice: Engkau berkenan kepadaku
  rationale: Kata חפץ menyatakan rasa senang, kesukaan, atau perkenanan. 'Berkenan kepadaku' terdengar wajar dan bermartabat tanpa menambahkan gagasan teologis yang tidak dinyatakan teks.
- source_word: כִּי ... כִּי
  choice: bahwa ... sebab
  rationale: כִּי pertama memperkenalkan isi yang diketahui, sedangkan yang kedua memberikan alasan atau bukti bagi pengetahuan tersebut.
- source_word: לֹא יָרִיעַ
  choice: tidak bersorak menang
  rationale: Bentuk Hifil dari רוע menggambarkan seruan atau sorak kemenangan. Terjemahan ini mempertahankan gambaran bunyi yang lebih konkret daripada sekadar 'tidak menang'.
- source_word: אֹיְבִי
  choice: musuhku
  rationale: Mempertahankan bentuk tunggal dan akhiran orang pertama dari teks Ibrani.
- source_word: עָלָי
  choice: atasku
  rationale: Dalam konteks sorak kemenangan, עַל menyatakan kemenangan atau kejayaan atas seseorang.
theological_decisions:
- issue: Apakah kegagalan musuh untuk menang menyatakan pembenaran atau kelayakan pemazmur di hadapan Allah
  choice: Ayat ini menyajikan kegagalan musuh untuk bersorak menang sebagai bukti bahwa Allah berkenan kepada pemazmur.
  alternative: Ayat ini dapat dipahami lebih kuat sebagai pernyataan bahwa Allah membenarkan atau menyatakan pemazmur benar.
  rationale: Teks menghubungkan perkenanan Allah dengan tidak adanya sorak kemenangan musuh, tetapi tidak menjelaskan dasar perkenanan itu. Terjemahan mempertahankan hubungan tersebut tanpa memasukkan doktrin tentang jasa, pembenaran, atau keselamatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Bentuk tunggal 'musuhku' dan citra sorak kemenangan dipertahankan.
