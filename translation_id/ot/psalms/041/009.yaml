id: PSA.41.9
reference: Psalms 41:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּם אִ֤ישׁ שְׁלוֹמִ֨/י אֲשֶׁר בָּטַ֣חְתִּי ב֭/וֹ אוֹכֵ֣ל לַחְמִ֑/י הִגְדִּ֖יל עָלַ֣/י עָקֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[d][c][b], has lifted up his heel against me.
translation:
  language: id
  text: Bahkan sahabat dekatku[a], yang kupercayai, yang makan rotiku[b], telah mengangkat tumitnya melawan aku.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang kedamaianku,” suatu ungkapan bagi orang yang hidup damai denganku, yaitu sahabat dekat atau sekutu tepercaya.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang berbagi roti denganku.” Bahasa Ibrani secara harfiah berbunyi “yang makan rotiku,” yang menggambarkan persekutuan makan dan kepercayaan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “telah membesarkan tumit terhadapku,” suatu ungkapan Ibrani untuk tindakan khianat atau bermusuhan.
    reason: lexical_alternative
  - marker: d
    text: Dikutip dalam Yohanes 13:18 sehubungan dengan pengkhianatan Yudas terhadap Yesus.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: Bahkan
  rationale: 'Menandai tambahan yang menegaskan kejutan: bukan hanya musuh, melainkan bahkan orang yang sangat dekat.'
- source_word: אִישׁ שְׁלוֹמִי
  choice: sahabat dekatku
  rationale: Secara harfiah berarti “orang yang berdamai denganku/orang kedamaianku”; ungkapan ini menunjuk kepada sahabat atau sekutu tepercaya. Pilihan ini menyampaikan kedekatan relasi secara wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר בָּטַחְתִּי בוֹ
  choice: yang kupercayai
  rationale: Menyatakan kepercayaan pribadi yang ditaruh pemazmur kepada orang tersebut.
- source_word: אוֹכֵל לַחְמִי
  choice: yang makan rotiku
  rationale: Mempertahankan gambaran konkret dalam bahasa Ibrani tentang persekutuan makan, penerimaan, dan kepercayaan; bentuk partisip diterjemahkan secara alami sebagai klausa relatif.
- source_word: הִגְדִּיל עָלַי עָקֵב
  choice: telah mengangkat tumitnya melawan aku
  rationale: Mempertahankan citra “tumit” dan daya ungkapan pengkhianatan atau tindakan bermusuhan, sambil menerjemahkan עָלַי dengan makna adversatif “melawan aku”.
theological_decisions:
- issue: Gema mesianik atau tipologis dari bahasa pengkhianatan yang dikutip dalam Yohanes 13:18
  choice: Ayat diterjemahkan menurut konteks langsung mazmur tanpa memasukkan penafsiran mesianik secara eksplisit ke dalam teks utama.
  alternative: Menggunakan susunan kata yang lebih langsung dibentuk oleh tradisi kutipan Perjanjian Baru.
  rationale: Teks Ibrani mula-mula mengungkapkan pengkhianatan yang dialami pemazmur oleh sahabat tepercaya. Penggunaannya kemudian dalam Yohanes tetap dicatat, tetapi tidak dijadikan penafsiran yang mengendalikan teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Ungkapan konkret “makan rotiku” dan citra “mengangkat tumit” dipertahankan agar gambaran serta ketegangan teks Ibrani tidak diratakan; catatan kaki menjelaskan idiom yang mungkin tidak langsung dipahami pembaca masa kini.
