  text: 'My enemies say evil against me: “When will he die and his name perish?”[a][b]'
translation:
  language: id
  text: 'Musuh-musuhku berkata buruk tentang aku: “Kapan ia akan mati dan namanya lenyap?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengatakan hal-hal yang jahat terhadap aku.” Ungkapan Ibrani secara harfiah menyebut perkataan “yang jahat” terhadap pemazmur.
    reason: lexical_alternative
  - marker: b
    text: “Namanya lenyap” dapat berarti reputasinya atau ingatan tentang dirinya berakhir, bukan sekadar nama yang diucapkan tidak lagi dipakai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  choice: Musuh-musuhku
  rationale: Nomina jamak dengan sufiks orang pertama tunggal berarti secara langsung ‘musuh-musuhku’; pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan daya permusuhannya.
- source_word: יֹאמְרוּ
  choice: mengatakan
  rationale: Bentuk imperfek orang ketiga jamak dari אמר dalam konteks puitis dapat menyatakan tindakan kini atau kebiasaan; ‘mengatakan’ sesuai dengan pengantar ujaran bermusuhan yang menyusul.
- source_word: רַע לִי
  choice: yang jahat tentang aku
  rationale: רַע mempertahankan arti leksikal ‘jahat/buruk’, sedangkan לִי dalam konteks ujaran menunjukkan bahwa perkataan itu ditujukan kepada atau mengenai pemazmur. ‘Tentang aku’ terdengar wajar tanpa mempersempitnya hanya menjadi fitnah atau kutukan.
- source_word: מָתַי
  choice: Kapan
  rationale: Adverbia interogatif ini secara langsung berarti ‘kapan’; tidak perlu diperluas menjadi ‘berapa lama lagi’.
- source_word: יָמוּת
  choice: dia akan mati
  rationale: Imperfek orang ketiga tunggal dari מות sesudah ‘kapan’ paling alami dipahami sebagai masa mendatang. Terjemahan ini membiarkan keinginan jahat para musuh tersirat, tanpa mengubah bentuknya menjadi harapan eksplisit ‘semoga dia mati’.
- source_word: וְאָבַד שְׁמוֹ
  choice: dan namanya lenyap
  rationale: Teks secara harfiah menyebut ‘namanya’; ‘lenyap’ menyampaikan אבד secara alami. Ungkapan itu dapat mencakup hilangnya reputasi atau ingatan tentang orang tersebut, sehingga ‘nama’ dipertahankan dalam teks utama dan cakupannya dijelaskan dalam catatan.
