  text: וְ/אִם בָּ֤א לִ/רְא֨וֹת שָׁ֤וְא יְדַבֵּ֗ר לִבּ֗/וֹ יִקְבָּץ אָ֥וֶן ל֑/וֹ יֵצֵ֖א לַ/ח֣וּץ יְדַבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: id
  text: Dan jika ia datang untuk melihat aku[a], ia berbicara dusta[b]; hatinya menghimpun kejahatan dalam dirinya. Ia keluar[c], lalu mengatakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk melihat”; objek “aku” tersirat dari konteks.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini juga dapat berarti “kesia-siaan”, “kepalsuan”, atau “tipu daya”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ke luar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Dan jika
  rationale: Mempertahankan baik daya penghubung וְ dengan ayat sebelumnya maupun sifat bersyarat dari אִם.
- source_word: בָּא לִרְאוֹת
  choice: ia datang untuk melihat aku
  rationale: Menerjemahkan verba secara dekat; objek 'aku' tidak tertulis secara eksplisit dalam frasa Ibrani, tetapi jelas tersirat oleh konteks dan diperlukan agar kalimat Indonesia alami.
- source_word: שָׁוְא יְדַבֵּר
  choice: ia mengucapkan kepalsuan
  rationale: שָׁוְא dapat berarti kesia-siaan, kepalsuan, atau tipu daya. Dalam konteks ucapan seorang lawan yang tidak tulus, 'kepalsuan' mempertahankan keluasan makna tanpa membatasinya hanya pada satu dusta tertentu.
- source_word: לִבּוֹ יִקְבָּץ אָוֶן לוֹ
  choice: hatinya menghimpun kejahatan bagi dirinya
  rationale: Mempertahankan 'hati' sebagai pusat pikiran dan niat, gambaran tindakan menghimpun, serta pronomina לוֹ. 'Kejahatan' menyampaikan bobot moral אָוֶן, yang juga dapat mencakup niat mencelakakan atau kesusahan.
- source_word: יֵצֵא לַחוּץ
  choice: ketika ia keluar
  rationale: לַחוּץ secara harfiah menunjuk ke luar. Bahasa Indonesia tidak perlu menambahkan 'ke jalan'; hubungan waktunya dinyatakan secara alami dengan 'ketika'.
- source_word: יְדַבֵּר
  choice: ia mengatakannya
  rationale: Mempertahankan verba berbicara pada kemunculan kedua sambil menyatakan objek tersirat, yakni perkara jahat yang telah dihimpun dalam hati.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan perkembangan dari kunjungan yang tidak tulus, niat jahat di dalam hati, hingga ucapan di luar, tanpa memperjelas tempat sebagai 'jalan' ketika teks Ibrani hanya menyebut 'luar'.
