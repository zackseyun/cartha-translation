id: PSA.60.11
reference: Psalms 60:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/011.yaml
  text: Give us help against the adversary[c][b][a], for the salvation of man is vain.
translation:
  language: id
  text: Berilah kami pertolongan menghadapi musuh[a], sebab penyelamatan oleh manusia[b][c] sia-sia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kesesakan”; kata Ibrani צַר dapat berarti “kesesakan” atau “musuh/lawan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “keselamatan” atau “kemenangan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah “manusia” (אָדָם), yang di sini berarti umat manusia pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Berilah
  rationale: Bentuk permohonan yang secara idiomatis meminta Allah menyediakan sesuatu; “Berilah” langsung, wajar, dan sesuai dengan bahasa doa.
- source_word: לָּנוּ
  choice: kami
  rationale: Pronomina orang pertama jamak sebagai penerima permohonan; dalam konteks doa kepada Allah, bahasa Indonesia memakai “kami”.
- source_word: עֶזְרַת
  choice: pertolongan
  rationale: Bentuk konstruksi yang berarti bantuan atau pertolongan; “pertolongan” alami dan bermartabat dalam konteks doa.
- source_word: מִצָּר
  choice: menghadapi musuh
  rationale: צַר dapat berarti kesesakan atau musuh. Konteks peperangan dalam mazmur ini mendukung arti personal “musuh”; prefiks מִן diterjemahkan secara idiomatis sebagai “menghadapi” sesudah “pertolongan”.
- source_word: וְשָׁוְא
  choice: sebab ... sia-sia
  rationale: שָׁוְא menyatakan kehampaan atau kesia-siaan. Hubungan antarklausa dipahami sebagai alasan bagi permohonan sebelumnya, sehingga וְ dirender secara alami dengan “sebab”.
- source_word: תְּשׁוּעַת
  choice: penyelamatan
  rationale: Kata ini dapat menunjuk pada keselamatan, pembebasan, atau kemenangan. “Penyelamatan” dengan jelas menyatakan tindakan melepaskan dari bahaya dalam konteks konflik.
- source_word: אָדָם
  choice: manusia
  rationale: Di sini אָדָם menunjuk kepada umat manusia secara umum, yang pertolongannya dikontraskan dengan pertolongan Allah.
theological_decisions:
- issue: Pertolongan manusia dikontraskan dengan pertolongan Allah
  choice: Ayat ini menyatakan bahwa penyelamatan yang berasal dari manusia sia-sia dalam konteks bahaya yang sedang dihadapi.
  alternative: Pernyataan umum bahwa segala upaya manusia selalu sia-sia.
  rationale: Bahasa Ibrani mengontraskan permohonan akan pertolongan Allah dengan ketidakmemadaian penyelamatan manusia, tanpa memperluasnya menjadi pernyataan sistematis tentang semua usaha manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan bentuk doa yang lugas. “Menghadapi musuh” dipilih agar relasi idiomatis antara pertolongan dan ancaman jelas, sementara ambiguitas leksikal Ibrani dipertahankan dalam catatan kaki.
