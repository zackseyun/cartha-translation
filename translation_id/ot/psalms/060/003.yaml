lexical_decisions:
- source_word: הִרְאִיתָה
  choice: telah membuat ... mengalami
  rationale: Bentuk Hifil dari ראה secara harfiah berarti ‘membuat melihat’ atau ‘memperlihatkan’. Dalam konteks ini, ungkapan tersebut menyatakan bahwa Allah membuat umat-Nya mengalami keadaan yang berat; pilihan ini menyampaikan idiom Ibrani secara alami tanpa mengubah pelakunya.
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: עַם menunjuk kepada umat milik Allah. ‘Umat-Mu’ alami dalam konteks perjanjian dan mempertahankan akhiran posesif orang kedua.
- source_word: קָשָׁה
  choice: hal-hal yang berat
  rationale: Kata sifat ‘berat/keras/sukar’ dipakai secara substantival untuk pengalaman-pengalaman berat. Bentuk ini mempertahankan keluasan makna dan tidak membatasinya menjadi satu jenis penderitaan tertentu.
- source_word: הִשְׁקִיתָנוּ
  choice: telah membuat kami minum
  rationale: Bentuk Hifil dari שׁקה berarti ‘memberi minum’ atau ‘membuat minum’. ‘Membuat kami minum’ mempertahankan daya kausatif dan sifat pengalaman yang dikenakan kepada umat.
- source_word: יַיִן
  choice: anggur
  rationale: Makna lazimnya adalah ‘anggur’; di sini kata tersebut tetap diterjemahkan secara konkret agar metafora Ibraninya tidak diratakan menjadi uraian abstrak tentang penderitaan.
- source_word: תַּרְעֵלָה
  choice: yang membuat kami terhuyung-huyung
  rationale: Nomina ini menunjuk pada keadaan terhuyung, sempoyongan, atau kehilangan orientasi. Klausa relatif menghasilkan bahasa Indonesia yang wajar sekaligus mempertahankan akibat yang terkandung dalam gambaran anggur tersebut.
theological_decisions:
- issue: Daya metaforis gambaran anggur
  choice: Mempertahankan gambaran Allah membuat umat-Nya meminum anggur yang menyebabkan mereka terhuyung-huyung.
  alternative: Mengganti metafora itu dengan pernyataan langsung bahwa Allah mendatangkan penderitaan atau kebingungan.
  rationale: Kesejajaran dengan pengalaman berat mendukung pengertian metaforis tentang kesusahan dan kehilangan orientasi yang dikenakan Allah. Metafora dipertahankan agar unsur penghakiman maupun penderitaan tidak dipersempit atau dijelaskan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ‘Engkau telah membuat’ mengikuti kesejajaran Ibrani, sedangkan ‘mengalami’ dan klausa ‘yang membuat kami terhuyung-huyung’ menjadikan dua bentuk kausatifnya jelas bagi pembaca umum.
