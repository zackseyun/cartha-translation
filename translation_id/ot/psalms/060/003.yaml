  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: id
  text: Engkau telah membuat umat-Mu mengalami hal-hal yang berat; Engkau telah membuat kami minum anggur yang membuat kami terhuyung-huyung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “anggur keterhuyungan”; dapat juga dipahami sebagai anggur yang membuat orang sempoyongan atau kehilangan orientasi.'
