id: PSA.60.6
reference: Psalms 60:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶ֫עְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: id
  text: Allah telah berfirman dalam kekudusan-Nya[a], “Aku akan bersorak gembira[b]; Aku akan membagi-bagikan Sikhem dan mengukur Lembah Sukot.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tempat kudus-Nya,” atau “demi kekudusan-Nya.” Frasa Ibrani ini dapat menunjuk kepada kekudusan Allah sendiri atau kepada lingkup kehadiran-Nya yang kudus.
    reason: lexical_alternative
  - marker: b
    text: Sebagian orang memahami “Aku akan bersorak gembira” sebagai tanggapan pemazmur terhadap firman Allah, bukan sebagai bagian dari pernyataan Allah sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, verba tunggal דִּבֶּר menunjukkan bahwa yang dimaksud ialah Allah Israel yang esa. Dalam bahasa Indonesia, 'Allah' merupakan sebutan baku dan wajar.
- source_word: דִּבֶּר
  choice: telah berfirman
  rationale: Bentuk perfektif menyatakan tuturan ilahi yang sudah disampaikan dan tetap relevan. 'Berfirman' sesuai dengan ragam Alkitab Indonesia yang bermartabat tanpa terasa kuno.
- source_word: בְּקָדְשׁוֹ
  choice: dalam kekudusan-Nya
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang ringkas serta kemungkinan rujukan kepada kekudusan Allah, tanpa mempersempitnya menjadi tempat kudus; kemungkinan lain dicatat dalam catatan kaki.
- source_word: אֶעְלֹזָה
  choice: Aku akan bersorak gembira
  rationale: Verba ini mengungkapkan kegembiraan yang kuat dan penuh kemenangan. 'Bersorak gembira' alami bagi pembaca Indonesia dan lebih kuat daripada sekadar 'bersukacita'.
- source_word: אֲחַלְּקָה
  choice: Aku akan membagi-bagikan
  rationale: Dalam konteks penguasaan wilayah, verba ini menunjuk pada tindakan membagi atau membagikan tanah. Bentuk 'membagi-bagikan' menyampaikan nuansa pembagian wilayah.
- source_word: שְׁכֶם
  choice: Sikhem
  rationale: Nama tempat ini ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: Lembah Sukot
  rationale: Rangkaian konstruksi Ibrani menamai wilayah geografis yang berkaitan dengan Sukot. Bentuk ini jelas dan mempertahankan nama tempat.
- source_word: אֲמַדֵּד
  choice: mengukur
  rationale: Bentuk piel menggambarkan pengukuran wilayah, dengan kemungkinan implikasi penetapan atau pembagiannya. 'Mengukur' mempertahankan gambaran konkret sumber tanpa menambahkan makna yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Pergantian penutur dan cakupan kutipan
  choice: Seluruh rangkaian orang pertama sesudah pengantar diperlakukan sebagai perkataan langsung Allah, termasuk 'Aku akan bersorak gembira'.
  alternative: '''Aku akan bersorak gembira'' dapat dipahami sebagai tanggapan pemazmur terhadap firman Allah, sedangkan perkataan Allah dimulai dengan ''Aku akan membagi-bagikan Sikhem''.'
  rationale: Urutannya paling wajar dibaca sebagai pengantar kepada nubuat ilahi, dan verba orang pertama tentang pembagian serta pengukuran wilayah sesuai dengan pernyataan kedaulatan Allah. Namun, batas kutipan dalam teks Ibrani tidak ditandai, sehingga pembacaan alternatif tetap dicatat.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama tempat memakai bentuk yang lazim dalam tradisi Alkitab Indonesia: Sikhem dan Sukot. Tanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskannya agar tidak menimbulkan kekeliruan.'
