  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מָצ֑וֹר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/009.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a]
translation:
  language: id
  text: Siapa yang akan membawa aku ke kota berbenteng? Siapa yang akan menuntun aku sampai ke Edom?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa yang akan menuntun aku ke kota berbenteng? Siapa yang telah menuntun aku ke Edom?” Bentuk-bentuk kata kerja Ibrani memungkinkan nuansa aspek yang sedikit berbeda, tetapi teks utama mempertahankan paralelisme puitis sebagai dua pertanyaan yang mengarah ke masa depan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapa
  rationale: Kata ganti tanya yang membuka dua pertanyaan retoris; padanan langsung dan alami dalam bahasa Indonesia.
- source_word: יֹבִלֵנִי
  choice: akan membawa aku
  rationale: Bentuk Hifil dari יבל menyatakan tindakan menyebabkan seseorang pergi, yakni membawa atau memimpin. 'Membawa aku' menonjolkan tujuan yang disebut sesudahnya dan tetap mempertahankan daya retoris.
- source_word: עִיר מָצוֹר
  choice: kota berbenteng
  rationale: Frasa konstruksi yang menunjuk pada kota yang memiliki pertahanan kuat. 'Kota berbenteng' alami dan tepat, tanpa memberi kesan utama bahwa kota itu sedang dikepung.
- source_word: נָחַנִי
  choice: akan menuntun aku
  rationale: Berasal dari נחה, 'menuntun/membimbing'. Walaupun bentuknya dapat dipahami sebagai perfektif, paralelisme puisi mendukung pembacaan berorientasi ke depan dalam pertanyaan kedua.
- source_word: עַד אֱדוֹם
  choice: sampai ke Edom
  rationale: עַד menandai batas atau titik akhir. 'Sampai ke Edom' mencerminkan nuansa tersebut dengan bahasa Indonesia yang wajar.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nama diri dipertahankan dalam bentuk yang lazim dalam bahasa Indonesia.
