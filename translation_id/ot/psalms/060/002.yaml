  text: הִרְעַ֣שְׁתָּה אֶ֣רֶץ פְּצַמְתָּ֑/הּ רְפָ֖/ה שְׁבָרֶ֣י/הָ כִי מָֽטָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/002.yaml
  text: You have shaken the earth; you have split it open. Heal its fractures[a], for it is tottering.
translation:
  language: id
  text: Engkau telah mengguncangkan bumi dan membelahnya. Pulihkanlah retak-retaknya[a], sebab bumi itu terhuyung-huyung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “negeri” sebagai ganti “bumi”. Kata Ibrani אֶרֶץ dapat menunjuk kepada seluruh bumi ataupun suatu negeri tertentu; konteks puitis ini memungkinkan kedua nuansa tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: Engkau telah mengguncangkan
  rationale: Bentuk Hifil dari רָעַשׁ menyatakan tindakan menyebabkan bumi berguncang. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: אֶרֶץ
  choice: bumi
  rationale: אֶרֶץ dapat berarti seluruh bumi atau suatu negeri tertentu. 'Bumi' paling sesuai dengan gambaran gempa dalam baris ini, sementara kemungkinan rujukan kepada suatu negeri tetap dicatat dalam catatan kaki.
- source_word: פְּצַמְתָּהּ
  choice: membelahnya
  rationale: Kata kerja ini menggambarkan tindakan memecahkan atau membuat rekahan. 'Membelahnya' menyampaikan gambaran bumi yang terbelah tanpa mengulang gagasan 'retak' secara hambar.
- source_word: רְפָה
  choice: Pulihkanlah
  rationale: Imperatif ini berasal dari רָפָא, yang lazim berarti 'menyembuhkan'. Karena objeknya ialah retakan bumi, 'pulihkanlah' mempertahankan personifikasi sekaligus terdengar alami dan mencakup gagasan penyembuhan atau perbaikan.
- source_word: שְׁבָרֶיהָ
  choice: retak-retaknya
  rationale: שֶׁבֶר dapat menunjuk pada pecahan, rekahan, atau tempat yang jebol. 'Retak-retaknya' paling jelas menyatu dengan gambaran gempa dan bumi yang terbelah.
- source_word: כִי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi permohonan sebelumnya. 'Sebab' ringkas dan sesuai dengan ragam puitis yang bermartabat.
- source_word: מָטָה
  choice: terhuyung-huyung
  rationale: Kata kerja ini menyatakan keadaan miring, goyah, atau hampir roboh. 'Terhuyung-huyung' mempertahankan gambaran ketidakstabilan yang sedang berlangsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan 'bumi itu' pada klausa terakhir memperjelas acuan pronomina serta mempertahankan gerak gambaran dari guncangan menuju ketidakstabilan.
