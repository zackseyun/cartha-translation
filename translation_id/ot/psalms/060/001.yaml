    issue: '"barisan" is an added military specification'
    rationale: פְרַצְתָּנוּ has the people as its suffixed object and denotes breaking through/breaching or breaking them. "Barisan" is an interpretive expansion not explicit in the line and narrows the image unnecessarily.
  - severity: low
    issue: Footnote anchor placement
    rationale: The note gives an alternative for the final imperative, so its marker should immediately follow "Pulihkanlah" rather than follow the sentence-final punctuation.
