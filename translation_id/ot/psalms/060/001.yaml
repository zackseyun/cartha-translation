  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: id
  text: Ya Allah, Engkau telah menolak kami; Engkau telah menghancurkan kami; Engkau telah murka. Pulihkanlah[a] kami!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kembalilah kepada kami.” Ungkapan Ibrani dapat menunjuk pada pemulihan umat atau pada kembalinya Allah kepada mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Kata ini merupakan sapaan langsung kepada Allah Israel. Partikel “Ya” menyatakan fungsi vokatif secara wajar dan khidmat dalam bahasa Indonesia modern.
- source_word: זְנַחְתָּנוּ
  choice: Engkau telah menolak kami
  rationale: Verba זנח berarti menolak atau membuang. “Menolak kami” jelas, alami, dan mempertahankan bobot relasional dari ratapan ini.
- source_word: פְרַצְתָּנוּ
  choice: Engkau telah menerobos barisan kami
  rationale: Verba פרץ menggambarkan tindakan menerobos atau membuat celah. Karena objek langsungnya adalah umat dan konteks mazmur adalah kekalahan dalam perang, “barisan kami” menyatakan gambaran kolektif yang tersirat tanpa meratakan maknanya menjadi sekadar “menghancurkan kami.”
- source_word: אָ֝נַפְתָּ
  choice: Engkau telah murka
  rationale: Verba ini menyatakan kemarahan ilahi. “Murka” merupakan kata Indonesia yang alami dalam konteks khidmat dan mempertahankan kekuatan ungkapannya.
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: Pulihkanlah kami
  rationale: Bentuk dari שוב di sini dapat dipahami sebagai permohonan agar Allah memulihkan umat setelah penghukuman. Pilihan ini alami dalam bahasa Indonesia, sedangkan kemungkinan bahwa pemazmur memohon Allah kembali kepada mereka dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna permohonan penutup תְּשׁוֹבֵב לָנוּ
  choice: Permohonan agar Allah memulihkan umat-Nya
  alternative: “Kembalilah kepada kami,” yakni permohonan agar Allah sendiri kembali berpihak atau hadir bagi umat-Nya
  rationale: Ungkapan Ibrani memungkinkan nuansa pemulihan umat maupun kembalinya Allah kepada mereka. Teks utama menyampaikan alur ratapan menuju pemulihan, sementara catatan kaki mempertahankan ambiguitas relasional yang sungguh terdapat dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “Engkau telah” mempertahankan rangkaian tindakan ilahi dalam teks Ibrani. Ungkapan “menerobos barisan kami” menjaga citra militer berupa terobosan atau celah sambil tetap dapat dipahami pembaca umum.
