    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Bersama Allah
  rationale: Preposisi ב dapat menyatakan penyertaan erat maupun sarana. “Bersama Allah” alami dalam bahasa Indonesia dan mempertahankan ketergantungan umat kepada Allah tanpa membatasi maknanya hanya pada sarana.
- source_word: נַעֲשֶׂה חָיִל
  choice: kita akan bertindak gagah berani
  rationale: Gabungan עשה dan חַיִל merupakan ungkapan yang berarti menunjukkan keberanian atau melakukan perbuatan perkasa. Terjemahan ini menyampaikan daya idiomatisnya dengan bahasa Indonesia yang wajar.
- source_word: וְהוּא
  choice: dan Dia
  rationale: Kata sambung dan pronomina mandiri melanjutkan pernyataan sambil menegaskan bahwa Allah sendiri melakukan tindakan penentu.
- source_word: יָבוּס
  choice: akan menginjak-injak
  rationale: Kata kerja בוס menggambarkan tindakan menginjak atau menggilas dengan kaki. “Menginjak-injak” mempertahankan gambaran puitis-militer yang kuat tanpa menggantinya dengan tafsiran seperti “mengalahkan”.
- source_word: צָרֵינוּ
  choice: lawan-lawan kita
  rationale: Bentuk ini menunjuk kepada para seteru atau pihak yang memusuhi. “Lawan-lawan” jelas, alami, dan sesuai dengan konteks konflik, sedangkan “musuh-musuh” tetap dicatat sebagai alternatif.
theological_decisions:
- issue: Pelaku kemenangan
  choice: Ayat ini mempertahankan tindakan umat bersama Allah dan tindakan Allah sendiri yang menentukan kemenangan.
  alternative: Menonjolkan hanya usaha manusia atau hanya tindakan ilahi.
  rationale: Teks Ibrani secara eksplisit menyandingkan “kita akan bertindak” dengan “Dia akan menginjak-injak.” Terjemahan tidak meleburkan kedua pelaku itu menjadi satu.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Ungkapan “bertindak gagah berani” menyampaikan idiom Ibrani secara alami, sedangkan “menginjak-injak” mempertahankan gambaran konkret teks sumber. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
