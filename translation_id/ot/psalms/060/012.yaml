  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: id
  text: Dengan Allah kita akan bertindak gagah berani[a], dan Dia akan menginjak-injak lawan-lawan kita[b].
  philosophy: optimal-equivalence
  footnotes:
