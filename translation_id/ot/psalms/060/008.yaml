base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: id
  text: Moab adalah baskom-Ku untuk membasuh[a]; ke atas Edom Aku melemparkan sandal-Ku; hai Filistia, bersoraklah dalam kemenangan bagi-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “periuk/bejana untuk membasuh-Ku”; secara tradisional juga diterjemahkan “periuk pembasuhan-Ku”. Gambaran ini menyatakan penghinaan dan penaklukan.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Ibraninya sulit. Terjemahan mengikuti Teks Masoret sebagai perintah kepada Filistia. Menurut pembacaan tradisional lain, baris ini dapat diterjemahkan, “Atas Filistia Aku memekik dalam kemenangan.”
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: baskom pembasuhan-Ku
  rationale: סִיר menunjuk pada wadah atau bejana, sedangkan רַחְצִי menentukan fungsinya untuk membasuh. “Baskom pembasuhan” menghadirkan gambaran konkret dalam bahasa Indonesia modern dan mempertahankan metafora penghinaan serta penaklukan.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: Kulemparkan sandal-Ku
  rationale: Bentuk Hifil dari שלך berarti melemparkan, dan נַעַל adalah alas kaki. “Sandal” sesuai dengan latar dunia kuno, sedangkan “Kulemparkan” alami sekaligus tetap puitis.
- source_word: עַל אֱדוֹם
  choice: ke atas Edom
  rationale: עַל dipertahankan dalam arti spasial untuk menggambarkan sandal yang dilemparkan ke atas Edom sebagai lambang penguasaan.
- source_word: עָלַי פְּלֶשֶׁת
  choice: hai Filistia ... bagi-Ku
  rationale: Susunan Ibrani ini sulit. Terjemahan menampilkan Filistia sebagai pihak yang disapa oleh imperatif feminin tunggal dan mengungkapkan sufiks orang pertama melalui “bagi-Ku”, tanpa menutupi kesulitan teks.
- source_word: הִתְרֹעָעִי
  choice: bersoraklah dalam kemenangan
  rationale: Bentuk dari רוע menyatakan pekikan keras, yang dapat bernuansa kemenangan atau pertempuran. Ungkapan ini mempertahankan citra sorak kemenangan tanpa mempersempitnya menjadi pekik perang saja.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: Moab / Edom / Filistia
  rationale: Nama tempat dan bangsa ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia; “Filistia” menunjuk pada negeri atau wilayah, bukan langsung pada penduduknya.
theological_decisions:
- issue: Daya imperatif הִתְרֹעָעִי yang ditujukan kepada Filistia
  choice: 'Perintah ironis yang menandakan penaklukan: “hai Filistia, bersoraklah dalam kemenangan bagi-Ku”'
  alternative: “Atas Filistia Aku memekik dalam kemenangan,” dengan pembacaan ulang atau perubahan pemenggalan bentuk Ibrani
  rationale: Teks Masoret menunjuk pada imperatif feminin tunggal, yang secara gramatikal dapat menyapa Filistia sebagai negeri. Dalam konteks kemenangan atas bangsa-bangsa musuh, perintah itu paling wajar dipahami secara ironis sebagai tanda ketundukan Filistia. Catatan kaki mempertahankan pembacaan orang pertama yang tradisional sebagai kemungkinan.
translation_notes:
  register: Bahasa puitis, ringkas, dan bermartabat. Bentuk ilahi dengan akhiran “-Ku” dipertahankan. “Baskom” dipilih agar gambaran wadah pembasuhan segera dipahami pembaca modern, sementara catatan kaki mencantumkan padanan yang lebih harfiah dan tradisional.
