source:
  edition: WLC
  text: לִ֤/י גִלְעָ֨ד וְ/לִ֬/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹֽקְקִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: id
  text: Gilead milik-Ku, dan Manasye milik-Ku; Efraim adalah benteng bagi kepala-Ku[a]; Yehuda adalah tongkat kerajaan-Ku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “benteng kepala-Ku”; dapat juga dipahami sebagai “kekuatan kepala-Ku.”
    reason: Metafora dan hubungan konstruksi Ibrani dapat dipahami lebih dari satu cara.
  - marker: b
    text: Atau, “pemberi hukum-Ku” atau “tongkat penguasa-Ku.” Kata Ibrani ini dapat menunjuk kepada orang yang menetapkan keputusan atau kepada tongkat yang melambangkan kekuasaan.
    reason: Alternatif leksikal yang sungguh mungkin dalam bahasa sumber.
lexical_decisions:
- source_word: לִי
  choice: milik-Ku
  rationale: Bentuk preposisi dengan akhiran orang pertama tunggal menyatakan kepemilikan; ungkapan ini langsung dan alami dalam bahasa Indonesia.
- source_word: גִלְעָד
  choice: Gilead
  rationale: Nama tempat, ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Nama suku dan wilayah, memakai bentuk yang lazim dalam tradisi bahasa Indonesia.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Nama suku, ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: מָעוֹז
  choice: benteng
  rationale: Kata ini dapat menunjuk pada tempat atau sumber kekuatan dan perlindungan. 'Benteng' mempertahankan citra militer-politis dalam mazmur ini.
- source_word: רֹאשִׁי
  choice: kepala-Ku
  rationale: Terjemahan langsung mempertahankan metafora Ibrani tanpa menafsirkannya secara berlebihan sebagai keunggulan atau mahkota.
- source_word: מְחֹקְקִי
  choice: tongkat kerajaan-Ku
  rationale: Istilah ini dapat menunjuk kepada orang yang menetapkan keputusan ataupun tongkat yang melambangkan kewenangan. Dalam rangkaian citra wilayah, militer, dan pemerintahan, 'tongkat kerajaan-Ku' menyampaikan lambang kekuasaan dengan wajar.
theological_decisions:
- issue: Makna מְחֹקְקִי dalam citra kerajaan
  choice: tongkat kerajaan-Ku
  alternative: pemberi hukum-Ku; tongkat penguasa-Ku
  rationale: Terjemahan utama mempertahankan citra kewenangan kerajaan tanpa mempersempit maknanya menjadi jabatan legislatif. Kemungkinan bahwa kata itu menunjuk kepada orang yang menetapkan hukum tetap dicatat.
- issue: Hubungan metaforis antara Efraim dan kepala sang pembicara
  choice: benteng bagi kepala-Ku
  alternative: benteng kepala-Ku; kekuatan kepala-Ku
  rationale: Bentuk ini mempertahankan unsur 'benteng' dan 'kepala' sekaligus membuat hubungan perlindungannya dapat dipahami dalam bahasa Indonesia. Catatan kaki mempertahankan susunan Ibrani yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada akhiran pronominal menandai bahwa pembicara ilahi sedang berbicara. Citra tubuh, pertahanan, dan kerajaan dipertahankan, sementara hubungan sintaksis dibuat cukup alami bagi pembaca umum.
