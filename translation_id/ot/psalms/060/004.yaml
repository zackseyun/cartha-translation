  text: You have given a banner to those who fear you[a], to be raised up because of the truth[b]. Selah
translation:
  language: id
  text: Engkau telah memberikan panji kepada orang-orang yang takut kepada-Mu, supaya dikibarkan[a] karena kebenaran[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya diperlihatkan,” “supaya mereka berhimpun,” atau mungkin “supaya melarikan diri.” Kata kerja Ibraninya sulit dan diperdebatkan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani qoshet kemungkinan besar berarti “kebenaran” atau “sifat dapat dipercaya”; beberapa versi kuno dan penafsir memahami baris ini secara berbeda sehingga menghasilkan terjemahan seperti “karena busur.”
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Engkau telah memberikan
  rationale: Bentuk Qal perfek orang kedua maskulin tunggal ditujukan kepada Allah. Bentuk ini menyatakan tindakan yang telah selesai tetapi tetap relevan dalam konteks doa mazmur.
- source_word: לִירֵאֶיךָ
  choice: kepada orang-orang yang takut kepada-Mu
  rationale: Ungkapan ini secara alami menyatakan orang-orang yang menghormati Allah dengan gentar, bukan sekadar merasa ngeri.
- source_word: נֵס
  choice: panji
  rationale: Kata ini menunjuk pada panji atau tanda yang ditinggikan. 'Panji' mempertahankan citra publik atau militer dan sesuai dengan tindakan mengibarkannya.
- source_word: לְהִתְנוֹסֵס
  choice: supaya dikibarkan
  rationale: Infinitif ini sulit dan diperdebatkan. Dalam konteks נֵס ('panji'), pengertian pasif/refleksif sebagai sesuatu yang diangkat atau dikibarkan paling baik mempertahankan permainan citranya.
- source_word: מִפְּנֵי
  choice: karena
  rationale: 'Secara harfiah berkaitan dengan ''dari/di hadapan'', tetapi di sini paling wajar dipahami secara kausal: panji itu dikibarkan karena hal yang disebut sesudahnya.'
- source_word: קֹשֶׁט
  choice: kebenaran
  rationale: Bentuk puitis ini kemungkinan besar berarti 'kebenaran' atau 'kesetiaan pada kebenaran'. Tanpa artikel dalam bahasa Indonesia, 'kebenaran' terdengar alami dan tidak menambahkan ketentuan yang tidak ada dalam teks Ibrani.
- source_word: סֶלָה
  choice: Sela
  rationale: Dipertahankan sebagai transliterasi penanda liturgis atau musikal yang makna tepatnya tidak pasti, dengan ejaan yang lazim dalam Alkitab bahasa Indonesia.
