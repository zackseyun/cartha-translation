  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: id
  text: Bukankah Engkau, ya Allah, telah menolak kami[a] dan tidak maju[b] bersama pasukan kami, ya Allah?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: membuang kami.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “keluar”; dalam konteks ini maksudnya maju ke medan perang bersama pasukan.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Menyampaikan pertanyaan retoris yang mengharapkan pengakuan bahwa pernyataan itu benar, sekaligus mempertahankan cakupan pertanyaan atas kedua klausa.
- source_word: אַתָּה
  choice: Engkau
  rationale: Pronomina mandiri ini bersifat menegaskan; bentuk 'Engkau' wajar dalam sapaan langsung yang khidmat kepada Allah.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung dan diulang dalam bahasa Ibrani; pengulangannya dipertahankan.
- source_word: זְנַחְתָּנוּ
  choice: telah menolak kami
  rationale: זנח berarti menolak atau membuang. 'Telah menolak kami' jelas, alami, dan tidak melunakkan pernyataan langsung dalam ratapan ini.
- source_word: וְלֹא תֵצֵא
  choice: dan tidak maju
  rationale: Negasi tetap berada di bawah cakupan pertanyaan retoris pertama. Dalam konteks perang, 'maju' menyampaikan tindakan keluar menyertai pasukan dengan lebih alami daripada terjemahan harfiah 'keluar'.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: bersama pasukan-pasukan kami
  rationale: צבאות di sini menunjuk pada kekuatan-kekuatan militer Israel; bentuk jamak mempertahankan bentuk sumber, sedangkan 'bersama' menyatakan penyertaan dalam pertempuran.
theological_decisions:
- issue: Bahasa tentang penolakan oleh Allah dalam ratapan
  choice: Mempertahankan pernyataan langsung bahwa Allah telah menolak umat-Nya dan tidak maju bersama pasukan mereka.
  alternative: Melunakkan menjadi 'membiarkan kami ditolak' atau 'seolah-olah menolak kami'.
  rationale: Teks Ibrani secara langsung menghubungkan penolakan dan ketidakikutsertaan dalam pertempuran dengan Allah. Ketegangan teologis dalam ratapan harus dipertahankan, bukan dijelaskan atau dilunakkan.
- issue: Cakupan pertanyaan retoris
  choice: Membaca kedua klausa sebagai isi satu pertanyaan retoris yang diawali הֲלֹא.
  alternative: Membaca klausa kedua sebagai pernyataan terpisah atau permohonan negatif.
  rationale: Susunan Ibrani paling wajar mengoordinasikan 'telah menolak kami' dan 'tidak maju' di bawah pertanyaan retoris awal.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis tanpa bentuk arkais. Pengulangan sapaan 'ya Allah' dipertahankan karena terdapat dua kali dalam teks Ibrani. Bentuk 'pasukan-pasukan' mempertahankan jamak צבאות.
