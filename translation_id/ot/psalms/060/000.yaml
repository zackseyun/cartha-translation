base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: id
  text: Untuk pemimpin musik. Menurut “Bunga Bakung Kesaksian.”[a] Miktam[b] Daud,[c] untuk diajarkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dengan lagu ‘Bunga Bakung Kesaksian.’” Bahasa Ibrani tampaknya mempertahankan suatu judul musikal atau liturgis, tetapi arti tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: “Miktam” adalah istilah Ibrani bagi suatu jenis karya yang maknanya tidak pasti; mungkin istilah musikal atau sastra.
    reason: lexical_alternative
  - marker: c
    text: “Daud” dapat berarti “oleh Daud,” “untuk Daud,” atau menunjukkan kaitan dengan Daud; bentuk Ibraninya dapat menyatakan kepengarangan, hubungan, atau dedikasi.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, istilah ini menunjuk kepada pemimpin atau pengawas pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: עַל
  choice: Menurut
  rationale: Dalam judul mazmur, kata depan ini dapat memperkenalkan lagu, pola, atau latar musikal. “Menurut” mempertahankan sifat teknisnya tanpa memastikan bahwa ungkapan berikut adalah nama melodi.
- source_word: שׁוּשַׁן עֵדוּת
  choice: “Bunga Bakung Kesaksian”
  rationale: Ungkapan ini tampaknya merupakan judul musikal atau liturgis, tetapi rujukan tepatnya tidak diketahui. Terjemahan harfiah yang diberi tanda petik mempertahankan sifatnya sebagai judul.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Makna label jenis karya ini tidak pasti. Transliterasi menghindari terjemahan spekulatif seperti “nyanyian emas” atau “prasasti”.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam ungkapan “Miktam Daud,” bentuk Indonesia ini mempertahankan hubungan umum dengan Daud tanpa secara eksplisit memastikan kepengarangan, peruntukan, atau dedikasi.
- source_word: לְלַמֵּד
  choice: untuk diajarkan
  rationale: Bentuk infinitif ini menyatakan tujuan pengajaran. Bentuk pasif alami dalam konteks judul dan membiarkan terbuka siapa yang mengajar atau diajar.
theological_decisions:
- issue: Hubungan mazmur dengan Daud dalam לְדָוִד
  choice: Miktam Daud
  alternative: Miktam oleh Daud / Miktam untuk Daud
  rationale: Kata depan Ibrani לְ dapat menyatakan kepengarangan, hubungan, peruntukan, atau dedikasi. Teks utama tidak menetapkan salah satu kemungkinan tersebut secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Istilah teknis yang tidak pasti ditransliterasikan, sedangkan judul yang mungkin bersifat musikal diterjemahkan secara cukup harfiah. Draf hanya menerjemahkan teks WLC yang diberikan; keterangan historis mulai dari “ketika ia berperang...” tidak terdapat dalam cuplikan sumber tersebut dan karena itu tidak ditambahkan.
