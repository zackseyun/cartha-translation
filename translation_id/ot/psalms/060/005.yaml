  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: id
  text: Agar orang-orang yang Kaukasihi diluputkan, selamatkanlah dengan tangan kanan-Mu dan jawablah kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian pembacaan memahami permohonan terakhir sebagai “dan jawablah aku”, bukan “dan jawablah kami”.
