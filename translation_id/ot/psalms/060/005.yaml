lexical_decisions:
- source_word: לְמַעַן
  choice: Agar
  rationale: Menyatakan tujuan atau hasil yang dimaksud; “agar” alami dalam bahasa Indonesia dan mempertahankan daya purposifnya.
- source_word: יֵחָלְצוּן
  choice: diluputkan
  rationale: Bentuk nifal dari חלץ menyatakan tindakan ditarik keluar dari bahaya atau diselamatkan. “Diluputkan” mempertahankan gambaran pembebasan dari ancaman dan menghindari pengulangan langsung dengan הוֹשִׁיעָה.
- source_word: יְדִידֶיךָ
  choice: orang-orang yang Kaukasihi
  rationale: Bentuk jamak dengan sufiks orang kedua tunggal maskulin. Pilihan ini jelas menyatakan jamak serta nuansa kasih secara alami dalam bahasa Indonesia modern.
- source_word: הוֹשִׁיעָה
  choice: selamatkanlah
  rationale: Imperatif hifil dari ישׁע merupakan permohonan langsung agar Allah bertindak menyelamatkan; bentuk “-lah” sesuai dengan ragam doa yang wajar dan bermartabat.
- source_word: יְמִינְךָ
  choice: dengan tangan kanan-Mu
  rationale: Frasa ini menyatakan sarana tindakan penyelamatan sekaligus mempertahankan citra puitis tangan kanan sebagai kuasa Allah.
- source_word: וַעֲנֵנוּ
  choice: dan jawablah kami
  rationale: Teks sumber WLC yang diberikan memuat sufiks objek orang pertama jamak, sehingga diterjemahkan “kami”; bacaan tunggal dipertahankan dalam catatan kaki sebagai varian.
theological_decisions:
- issue: Gambaran tangan kanan Allah
  choice: Mempertahankan ungkapan “dengan tangan kanan-Mu”.
  alternative: Menguraikannya menjadi “dengan kuasa-Mu”.
  rationale: Citra antropomorfis tersebut penting secara puitis dan teologis sebagai lambang kuasa penyelamatan Allah, sehingga tidak diratakan menjadi ungkapan abstrak.
- issue: Sufiks objek pada permohonan terakhir
  choice: “jawablah kami”
  alternative: “jawablah aku”
  rationale: Teks WLC yang disediakan mendukung objek jamak dan sesuai dengan suara permohonan bersama dalam konteks mazmur. Bacaan tunggal dikenal dalam tradisi tekstual dan paralel, sehingga dicatat tanpa menggantikan teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. Kapitalisasi pada “Kaukasihi” dan “-Mu” dipakai sebagai penghormatan kepada Allah. Susunan kalimat mempertahankan gerak dari tujuan, permohonan penyelamatan, hingga permohonan jawaban.
