  yaml_path: translation/ot/psalms/030/006.yaml
  text: As for me[a], I said in my prosperity[b], “I will never be shaken.”
translation:
  language: id
  text: Dan aku berkata dalam ketenteramanku[a], “Aku tidak akan pernah goyah.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kesejahteraanku” atau “dalam rasa amanku.” Kata Ibrani ini dapat menunjuk pada keadaan hidup yang tenang dan aman, bukan hanya kemakmuran materi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Aku tidak akan goyah untuk selamanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Aku
  rationale: Pronomina mandiri memberi penekanan pada pembicara. Dalam bahasa Indonesia, “Aku” sudah alami dalam puisi orang pertama; nuansa penghubung וַ dipahami dari konteks dan tidak perlu dipaksakan menjadi “Dan aku”.
- source_word: אָמַרְתִּי
  choice: berkata
  rationale: Bentuk qatal menyatakan tindakan lampau dalam perenungan pemazmur; “berkata” mempertahankan bentuk sederhana tanpa mewajibkan nuansa lebih-dahulu.
- source_word: בְשַׁלְוִי
  choice: dalam ketenteramanku
  rationale: שַׁלְוָה menunjuk pada keadaan tenang, aman, dan sejahtera. “Ketenteraman” cukup luas untuk tidak membatasinya pada kemakmuran materi, sedangkan sufiks orang pertama dipertahankan dengan “-ku”.
- source_word: בַּל ... לְעוֹלָם
  choice: tidak akan pernah
  rationale: Partikel negatif puitis bersama keterangan waktu לְעוֹלָם menghasilkan penyangkalan kuat dan berkelanjutan; “tidak akan pernah” merupakan padanan Indonesia yang alami.
- source_word: אֶמּוֹט
  choice: goyah
  rationale: Bentuk dari מוט menyampaikan gambaran kehilangan kestabilan. “Goyah” alami dalam bahasa Indonesia serta mempertahankan metafora fisik dan batinnya.
