  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁמַע יְהוָ֥ה וְ/חָנֵּ֑/נִי יְ֝הוָה הֱֽיֵה עֹזֵ֥ר לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: id
  text: Dengarlah, ya Yahweh, dan bermurah hatilah kepadaku[a]; ya Yahweh, jadilah penolongku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasihanilah aku.” Kata kerja Ibrani ini dapat menyatakan kemurahan atau belas kasihan dalam permohonan akan pertolongan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarlah
  rationale: Bentuk imperatif orang kedua tunggal dari שׁמע. “Dengarlah” merupakan permohonan langsung yang wajar dalam bahasa doa dan tidak menambahkan objek yang dibiarkan tersirat dalam teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: וְחָנֵּנִי
  choice: dan bermurah hatilah kepadaku
  rationale: Imperatif חנן dengan sufiks orang pertama tunggal menyatakan pemberian kemurahan atau perkenanan. Ungkapan ini alami dalam bahasa Indonesia dan tetap membuka nuansa belas kasihan sebagai kemungkinan kontekstual.
- source_word: הֱיֵה
  choice: jadilah
  rationale: Imperatif היה di sini meminta Yahweh hadir atau bertindak dalam peran tertentu. “Jadilah” sesuai dengan konstruksi predikatif bahasa Indonesia.
- source_word: עֹזֵר לִי
  choice: penolongku
  rationale: Partisip aktif עזר dengan לִי menggambarkan pribadi yang menolong pemazmur. “Penolongku” ringkas, alami, dan mempertahankan sifat personal ungkapan itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan sebuah gelar.
- issue: Nuansa permohonan חנן
  choice: bermurah hatilah kepadaku
  alternative: kasihanilah aku
  rationale: Kata חנן dapat menekankan kemurahan atau perkenanan sekaligus mengandung nuansa belas kasihan dalam permohonan pertolongan. Teks utama memakai ungkapan yang dekat dengan makna dasarnya, sedangkan alternatif dicatat agar rentang maknanya tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Partikel vokatif “ya” mempertahankan sapaan doa, sedangkan pengulangan “ya Yahweh” mengikuti struktur dan penekanan teks Ibrani.
