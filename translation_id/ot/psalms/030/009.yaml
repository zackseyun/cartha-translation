  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַה בֶּ֥צַע בְּ/דָמִ/י֮ בְּ/רִדְתִּ֪/י אֶ֫ל שָׁ֥חַת הֲ/יוֹדְ/ךָ֥ עָפָ֑ר הֲ/יַגִּ֥יד אֲמִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: id
  text: Apa untungnya jika darahku tertumpah,[a] jika aku turun ke liang?[b] Akankah debu memuji-Mu? Akankah debu memberitakan kesetiaan-Mu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam darahku”; maksudnya dapat juga diterjemahkan, “jika aku mati.”
    reason: lexical_alternative
  - marker: b
    text: Atau “liang kubur.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kebenaran-Mu.” Kata Ibrani ini dapat berarti “kebenaran” atau “kesetiaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: Apa untungnya
  rationale: Ungkapan ini menanyakan manfaat atau keuntungan yang akan diperoleh; bentuk ini ringkas, alami, dan mempertahankan daya retoris bahasa Ibrani.
- source_word: בְּדָמִי
  choice: jika darahku tertumpah
  rationale: Secara harfiah berarti 'dalam/pada darahku' dan dalam konteks menunjuk pada kematian pemazmur. Ungkapan ini mempertahankan gambaran konkret tentang darah sambil menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: jika aku turun ke liang
  rationale: Pilihan ini mempertahankan gambaran gerak turun menuju tempat kematian dan menghindari penjelasan berlebihan di dalam teks utama.
- source_word: שָׁחַת
  choice: liang
  rationale: Kata ini dapat menunjuk pada liang, kubur, atau tempat kebinasaan. 'Liang' mempertahankan metafora Ibrani tentang turun menuju kematian, sedangkan 'kubur' dicatat sebagai alternatif.
- source_word: הֲיוֹדְךָ עָפָר
  choice: Akankah debu memuji-Mu?
  rationale: ידה dalam konteks ibadah kepada Allah paling alami diterjemahkan 'memuji'. 'Debu' dipertahankan sebagai gambaran konkret kefanaan manusia dan sebagai metonimia bagi orang mati.
- source_word: הֲיַגִּיד
  choice: Akankah debu memberitakan
  rationale: '''Memberitakan'' sesuai dengan tindakan menyatakan atau mengumumkan secara terbuka serta cocok dengan ragam puisi yang luhur.'
- source_word: אֲמִתֶּךָ
  choice: kesetiaan-Mu
  rationale: אמת dapat berarti kebenaran, keteguhan, atau kesetiaan. Dalam seruan kepada Allah ini, 'kesetiaan' menyampaikan sifat Allah yang dapat diandalkan tanpa meniadakan kemungkinan arti 'kebenaran'.
theological_decisions:
- issue: Apakah gambaran kematian harus dijelaskan secara langsung atau dipertahankan secara puitis
  choice: Mempertahankan gambaran konkret 'darah', 'liang', dan 'debu' dalam teks utama
  alternative: Menerjemahkannya secara lebih interpretatif sebagai 'kematian', 'kubur', dan 'orang mati'
  rationale: Argumen ayat ini ialah bahwa kematian pemazmur tidak menghasilkan pujian dan pemberitaan tentang Allah. Bahasa Ibrani menyatakannya melalui gambaran kefanaan yang kuat; mempertahankan gambaran itu menjaga ketegangan dan kekuatan puisinya.
- issue: Makna אֲמִתֶּךָ
  choice: kesetiaan-Mu
  alternative: kebenaran-Mu
  rationale: Keduanya termasuk dalam cakupan makna kata Ibrani. 'Kesetiaan' paling sesuai dengan seruan relasional kepada Allah di sini, sedangkan alternatifnya dicatat agar ambiguitas leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang wajar dan bermartabat. Pertanyaan retoris dipertahankan, sapaan kepada Allah memakai huruf kapital, dan pengulangan 'debu' digunakan untuk menjaga kejelasan serta paralelisme.
