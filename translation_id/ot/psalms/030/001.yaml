base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: id
  text: 'Aku akan meninggikan Engkau, ya Yahweh,

    sebab Engkau telah menarik aku ke atas[a]

    dan tidak membiarkan musuh-musuhku bersukacita atas aku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengangkat aku”; kata Ibrani ini secara harfiah membangkitkan gambaran menarik atau menimba sesuatu ke atas, seperti dari sumur.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: Aku akan meninggikan Engkau
  rationale: Bentuk dari רום menyatakan tindakan meninggikan atau memuliakan dalam pujian. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran vertikal teks Ibrani.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan pemazmur meninggikan Yahweh; 'sebab' jelas dan sesuai dengan laras puisi yang khidmat.
- source_word: דִלִּיתָנִי
  choice: Engkau telah menimba aku ke atas
  rationale: Kata דלה menggambarkan menarik atau menimba sesuatu ke atas, terutama dari sumur atau lubang. Pilihan ini mempertahankan metafora konkret yang lebih khusus daripada sekadar 'mengangkat'.
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: dan tidak membiarkan ... bersukacita
  rationale: Bentuk kausatif secara harfiah berkaitan dengan membuat bersukacita. Dalam konteks kemenangan musuh yang dicegah, 'tidak membiarkan' menyampaikan maksudnya secara alami tanpa mengubah hasil tindakan ilahi.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan alami bagi bentuk jamak posesif ini.
- source_word: לִי
  choice: atas diriku
  rationale: Preposisi ini menunjukkan kegembiraan musuh karena memperoleh keunggulan atas pemazmur; 'bersukacita atas diriku' mempertahankan relasi tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Transliterasi 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Gambaran penyelamatan dalam דִלִּיתָנִי
  choice: menimba aku ke atas
  alternative: mengangkat aku
  rationale: Teks membangkitkan gambaran seseorang yang ditarik ke atas seperti air dari sumur atau sesuatu dari lubang. Terjemahan utama mempertahankan metafora itu tanpa menentukan secara eksplisit bahwa sumur atau lubang tertentu dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. Kapitalisasi kata ganti yang merujuk kepada Allah dipakai sebagai konvensi penghormatan. Susunan tiga baris menjaga alur alasan pujian dan paralelisme ayat.
