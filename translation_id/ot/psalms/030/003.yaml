source:
  edition: WLC
  text: יְֽהוָ֗ה הֶֽעֱלִ֣יתָ מִן שְׁא֣וֹל נַפְשִׁ֑/י חִ֝יִּיתַ֗/נִי מ/יורדי בֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: id
  text: Ya, Yahweh, Engkau telah mengangkat nyawaku[b] dari Sheol[a]; Engkau telah memelihara aku tetap hidup, terpisah dari mereka yang turun ke liang kubur.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol adalah istilah Ibrani untuk dunia orang mati; dapat juga diterjemahkan “kubur”.
    reason: lexical_alternative
  - marker: b
    text: Atau “jiwaku” atau “diriku”.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan, “Engkau menghidupkan aku kembali dari antara mereka yang turun ke liang kubur,” atau, menurut pemahaman lain, “Engkau telah memelihara aku tetap hidup supaya aku tidak turun ke liang kubur.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, dengan partikel vokatif Indonesia yang alami dan khidmat.
- source_word: הֶעֱלִיתָ
  choice: Engkau telah mengangkat
  rationale: Menjaga citra gerak ke atas dalam bentuk kausatif, sebagai kebalikan dari turun ke dunia kematian.
- source_word: מִן שְׁאוֹל
  choice: dari dunia orang mati
  rationale: Menyampaikan makna Sheol secara langsung kepada pembaca Indonesia tanpa menyempitkannya menjadi kuburan fisik saja.
- source_word: נַפְשִׁי
  choice: nyawaku
  rationale: Dalam konteks ancaman kematian, נֶפֶשׁ paling alami menunjuk pada nyawa atau kehidupan si pemazmur, bukan istilah antropologis teknis.
- source_word: חִיִּיתַנִי
  choice: Engkau mempertahankan hidupku
  rationale: Piel חיה dapat menyatakan pemeliharaan atau pemulihan hidup; pilihan ini tidak memaksakan gagasan kebangkitan eksplisit.
- source_word: מִיּוֹרְדֵי בוֹר
  choice: di antara mereka yang turun ke liang kubur
  rationale: Mencerminkan konstruksi pemisahan dari kelompok orang yang sedang menuju kematian, sambil mempertahankan ambiguitas sintaksis dalam catatan kaki.
- source_word: בּוֹר
  choice: liang kubur
  rationale: Dalam paralelisme dengan Sheol, בור menggambarkan liang yang berkaitan dengan kematian; 'liang kubur' alami dalam puisi Indonesia dan tetap mempertahankan citra liang.
theological_decisions:
- issue: Apakah ayat ini menyatakan kebangkitan dari kematian atau penyelamatan dari ancaman kematian
  choice: Mempertahankan gambaran dunia orang mati dan liang kubur tanpa menyatakan kebangkitan secara eksplisit.
  alternative: Menerjemahkan seolah-olah pemazmur secara harfiah dibangkitkan dari antara orang mati.
  rationale: Bahasa Ibrani memungkinkan gambaran puitis tentang pemulihan dari keadaan nyaris mati maupun pemulihan hidup; terjemahan tidak boleh menetapkan doktrin yang lebih khusus daripada teks.
- issue: Rujukan נַפְשִׁי
  choice: nyawaku
  alternative: jiwaku atau diriku
  rationale: Konteks kematian mendukung makna 'nyawa', tetapi cakupan istilah Ibrani tetap dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Kapitalisasi pronomina ilahi dipakai sebagai konvensi hormat Indonesia. Pilihan 'dunia orang mati' menghindari transliterasi yang kurang dipahami pembaca umum, sedangkan catatan kaki tetap menyebut istilah sumber.
