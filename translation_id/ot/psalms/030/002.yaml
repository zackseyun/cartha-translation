  yaml_path: translation/ot/psalms/030/002.yaml
  text: O Yahweh my God[a], I cried out to you[c][b], and you healed me.
translation:
  language: id
  text: Ya Yahweh, Allahku,[a] aku berseru meminta pertolongan kepada-Mu,[b] dan Engkau telah menyembuhkan aku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”. Bentuk lain yang digunakan ialah “Yahweh” dan “Yehuwa”.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “aku berseru kepada-Mu”. Kata Ibraninya menyiratkan seruan untuk meminta pertolongan.'
    reason: lexical_alternative
  - marker: c
    text: “Menyembuhkan aku” dapat merujuk pada kesembuhan jasmani atau, dalam konteks ini, pada pemulihan atau kelepasan yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH secara langsung, sesuai bukti teks Ibrani dan tanpa menggantinya dengan gelar.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Bentuk dengan sufiks orang pertama tunggal berarti 'Allahku'; ungkapan ini alami dalam sapaan langsung berbahasa Indonesia.
- source_word: שִׁוַּעְתִּי
  choice: aku berseru meminta pertolongan
  rationale: Kata kerja שׁוע menyatakan seruan mendesak untuk memperoleh pertolongan; terjemahan ini mempertahankan baik intensitas maupun tujuannya.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Preposisi אֶל dengan sufiks orang kedua tunggal maskulin menunjukkan arah seruan kepada Allah.
- source_word: וַתִּרְפָּאֵנִי
  choice: dan Engkau menyembuhkan aku
  rationale: רפא pada dasarnya berarti 'menyembuhkan'. Pilihan ini tetap terbuka pada penyembuhan jasmani maupun pemulihan yang lebih luas dalam konteks mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi YHWH. Bentuk 'Yahweh' mempertahankan nama tersebut dan tidak mengubahnya menjadi gelar.
- issue: Cakupan makna רפא
  choice: menyembuhkan aku
  alternative: memulihkan aku; membuat aku sembuh
  rationale: '''Menyembuhkan'' paling dekat dengan nilai leksikal רפא dan tidak memastikan apakah yang dimaksud semata-mata kesembuhan fisik atau pemulihan/kelepasan yang lebih luas.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Partikel sapaan 'Ya' menandai vokatif; pronomina yang merujuk kepada Allah ditulis dengan huruf kapital menurut kelaziman ejaan religius Indonesia. Urutan penanda catatan kaki dibuat alfabetis dan ditempatkan tepat setelah unsur yang dijelaskan.
