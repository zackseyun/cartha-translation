  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְמַ֤עַן יְזַמֶּרְ/ךָ֣ כָ֭בוֹד וְ/לֹ֣א יִדֹּ֑ם יְהוָ֥ה אֱ֝לֹהַ֗/י לְ/עוֹלָ֥ם אוֹדֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/012.yaml
  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: id
  text: supaya kemuliaanku[a] menyanyikan pujian bagi-Mu dan tidak berdiam diri. Ya Yahweh, Allahku, aku akan bersyukur kepada-Mu selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya seluruh keberadaanku menyanyikan pujian bagi-Mu”; secara harfiah, “kemuliaanku”. Ungkapan puitis ini dapat menunjuk pada batin atau lidah pemazmur.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil dan terdengar alami dalam bahasa Indonesia modern.
- source_word: יְזַמֶּרְךָ
  choice: menyanyikan pujian bagi-Mu
  rationale: Bentuk piel dari זמר menyatakan tindakan bernyanyi atau bermusik dalam pujian; pilihan ini mempertahankan unsur musikal dan arah pujian kepada Allah.
- source_word: כָבוֹד
  choice: kemuliaanku
  rationale: Mempertahankan metafora harfiah Ibrani, dengan akhiran orang pertama tunggal yang dipahami dari konteks puitis. Kemungkinan makna idiomatis dijelaskan dalam catatan kaki.
- source_word: וְלֹא יִדֹּם
  choice: dan tidak berdiam diri
  rationale: Dalam pertentangan dengan menyanyikan pujian, דמם menunjuk pada sikap diam; frasa ini mempertahankan gambaran bahwa pujian tidak akan terhenti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Menyampaikan bentuk posesif orang pertama tunggal dan fungsi sapaan langsung secara ringkas.
- source_word: לְעוֹלָם
  choice: selama-lamanya
  rationale: Ungkapan Indonesia yang wajar dan khidmat untuk durasi yang terus berlangsung.
- source_word: אוֹדֶךָּ
  choice: aku akan bersyukur kepada-Mu
  rationale: Bentuk hiphil dari ידה dalam konteks mazmur syukur paling tepat menyatakan pemberian syukur yang ditujukan kepada Allah.
theological_decisions:
- issue: Makna כָבוֹד sebagai pelaku yang memuji
  choice: Mempertahankan metafora “kemuliaanku” dalam teks utama
  alternative: “seluruh keberadaanku”, “jiwaku”, atau “lidahku”
  rationale: Teks Ibrani memakai כָבוֹד, tetapi rujukan metaforisnya dalam puisi tidak pasti. Terjemahan utama mempertahankan ungkapan sumber, sedangkan penafsiran idiomatis disajikan sebagai alternatif dalam catatan kaki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: “Yahweh” mempertahankan kehadiran nama pribadi ilahi dalam teks sumber tanpa menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Metafora Ibrani yang tidak biasa dipertahankan dalam teks utama, sementara kemungkinan makna idiomatisnya diberikan dalam catatan kaki.
