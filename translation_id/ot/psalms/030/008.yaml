lexical_decisions:
- source_word: אֵלֶיךָ
  choice: Kepada-Mu
  rationale: Mempertahankan arah seruan kepada Allah serta bentuk orang kedua tunggal dengan gaya doa yang wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk menerjemahkan nama ilahi YHWH dengan huruf kapital.
- source_word: אֶקְרָא
  choice: aku berseru
  rationale: Kata kerja קרא dalam konteks doa berarti berseru atau memanggil kepada Allah.
- source_word: אֲדֹנָי
  choice: Tuhanku
  rationale: Bentuk Masoret אֲדֹנָי secara tradisional berarti 'Tuhan' sebagai sapaan ilahi; 'Tuhanku' mencerminkan unsur bentuk dan konteks sapaan tanpa menyamakannya secara grafis dengan YHWH.
- source_word: אֶתְחַנָּן
  choice: aku memohon belas kasihan
  rationale: Bentuk hitpael dari חנן menyatakan permohonan sungguh-sungguh akan kemurahan atau belas kasihan.
theological_decisions:
- issue: Pembedaan antara nama ilahi יהוה dan gelar אֲדֹנָי
  choice: TUHAN ... Tuhanku
  alternative: TUHAN ... Tuhan
  rationale: Pembedaan tipografis dan posesif mempertahankan dua bentuk Ibrani yang berbeda serta mengikuti bukti vokalisasi WLC, tanpa menambahkan penafsiran tentang pihak yang disapa.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Paralelisme kedua klausa dipertahankan, demikian pula peralihan dari 'berseru' ke permohonan belas kasihan.
