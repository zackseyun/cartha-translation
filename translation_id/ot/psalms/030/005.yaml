  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: id
  text: Sebab murka-Nya hanya sesaat, tetapi kehidupan ada dalam perkenanan-Nya. Tangisan singgah untuk bermalam pada petang hari[a], tetapi pada pagi hari terdengar sorak-sorai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangisan bermalam pada petang hari”; kata kerja Ibraninya berarti bermalam atau menumpang sebagai tamu.
    reason: lexical_alternative
  - marker: b
    text: Atau “nyanyian sukacita”; kata Ibraninya dapat berarti seruan gembira atau nyanyian riang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau dasar bagi pernyataan dalam konteks sebelumnya dan mengalir wajar dalam puisi Indonesia.
- source_word: רֶגַע בְּאַפּוֹ
  choice: murka-Nya hanya sesaat
  rationale: רֶגַע menunjukkan waktu yang sangat singkat, sedangkan אַף secara idiomatis berarti murka atau kemarahan. Susunan ini wajar dalam bahasa Indonesia dan mempertahankan klausa nominal Ibrani.
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: perkenanan-Nya mendatangkan kehidupan
  rationale: חַיִּים adalah nomina abstrak 'kehidupan', dan רָצוֹן berarti perkenanan atau kemurahan. Penambahan 'mendatangkan' membuat hubungan klausa yang tanpa verba itu jelas secara alami tanpa mempersempitnya secara teologis.
- source_word: בָּעֶרֶב
  choice: pada malam hari
  rationale: Secara harfiah menunjuk waktu petang, tetapi bersama verba 'bermalam' dan kontras dengan pagi, frasa ini secara kontekstual menggambarkan malam.
- source_word: יָלִין בֶּכִי
  choice: tangisan dapat bermalam
  rationale: יָלִין secara harfiah berarti menginap atau melewatkan malam. Personifikasi tangisan dipertahankan, dengan 'dapat' menyampaikan kemungkinan tanpa menjadikan dukacita permanen.
- source_word: רִנָּה
  choice: sorak-sorai
  rationale: Nomina ini menunjuk seruan nyaring sukacita atau nyanyian riang. 'Sorak-sorai' mempertahankan unsur vokal yang lebih spesifik daripada sekadar 'sukacita'.
theological_decisions:
- issue: Acuan akhiran pronominal pada 'murka-Nya' dan 'perkenanan-Nya'
  choice: Akhiran -Nya mengacu kepada TUHAN dalam konteks mazmur.
  alternative: Menyebut 'murka TUHAN' dan 'perkenanan TUHAN' secara eksplisit.
  rationale: Konteks mengidentifikasi acuannya sebagai TUHAN, tetapi penggunaan pronomina mempertahankan bentuk ringkas teks dan ketegangan antara murka ilahi yang nyata namun sesaat dan perkenanan-Nya yang memberi kehidupan.
- issue: Hubungan antara חַיִּים dan בִּרְצוֹנוֹ
  choice: perkenanan-Nya mendatangkan kehidupan
  alternative: kehidupan ada dalam perkenanan-Nya
  rationale: Klausa Ibrani tidak memiliki verba sehingga hubungan lokatif atau instrumental tetap terbuka. Rumusan ini alami dalam bahasa Indonesia, tetapi tidak menentukan mekanisme teologis secara lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Paralel malam–pagi dan personifikasi tangisan dipertahankan.
