  text: יְֽהוָ֗ה בִּ/רְצוֹנְ/ךָ֮ הֶעֱמַ֪דְתָּה לְֽ/הַרְרִ֫/י עֹ֥ז הִסְתַּ֥רְתָּ פָנֶ֗י/ךָ הָיִ֥יתִי נִבְהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/007.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
translation:
  language: id
  text: Ya Yahweh, karena perkenanan-Mu Engkau membuat gunungku berdiri kokoh[a]; ketika Engkau menyembunyikan wajah-Mu, aku menjadi gentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau menegakkan kekuatan bagi gunungku.” Susunan bahasa Ibraninya padat dan juga dapat dipahami sebagai gambaran kemakmuran, keamanan, atau kestabilan yang teguh.
    reason: Alternatif leksikal dan sintaksis untuk לְהַרְרִי עֹז.
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”; partikel “Ya” menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: בִּרְצוֹנְךָ
  choice: karena perkenanan-Mu
  rationale: רָצוֹן menyatakan perkenanan atau kemurahan hati. “Karena” menyampaikan fungsi instrumental-kausal dari prefiks ב dalam konteks ini.
- source_word: הֶעֱמַדְתָּה
  choice: Engkau membuat ... berdiri
  rationale: Bentuk Hifil dari עמד bersifat kausatif, yakni “membuat berdiri”; susunan ini mempertahankan daya verbal teks Ibrani.
- source_word: לְהַרְרִי עֹז
  choice: gunungku berdiri kokoh
  rationale: Terjemahan mempertahankan citra “gunungku” dan mengungkapkan עֹז secara predikatif sebagai “kokoh”, tanpa meniadakan kepadatan dan ambiguitas susunan Ibraninya.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: Engkau menyembunyikan wajah-Mu
  rationale: Ungkapan harfiah dipertahankan karena dapat dipahami dalam bahasa Indonesia dan penting sebagai gambaran puitis tentang ditariknya perkenanan atau kehadiran Allah.
- source_word: נִבְהָל
  choice: aku menjadi gentar
  rationale: Nifal בהל menyatakan keadaan terguncang, cemas, atau gentar. “Menjadi gentar” menyampaikan guncangan batin tanpa mempersempit maknanya menjadi ketakutan ekstrem.
theological_decisions:
- issue: Penerjemahan nama ilahi
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton יְהוָה secara langsung. Bentuk “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Penafsiran ungkapan “gunungku”
  choice: Mempertahankan citra “gunungku” dalam teks utama
  alternative: kemakmuranku; kubu pertahananku; kedudukanku yang aman
  rationale: Teks Ibrani menyebut “gunungku”, kemungkinan sebagai gambaran kestabilan atau keamanan. Citra sumber dipertahankan agar ketegangan puitisnya tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya Yahweh” serta kapitalisasi pronomina ilahi mengikuti kelaziman tulisan keagamaan Indonesia. Metafora Ibrani dipertahankan, sementara ungkapan yang tidak idiomatis dijadikan alami tanpa menghapus ambiguitasnya.
