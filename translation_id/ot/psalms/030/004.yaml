base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: id
  text: Nyanyikanlah pujian bagi Yahweh, hai orang-orang setia-Nya, dan bersyukurlah pada peringatan akan kekudusan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketika kekudusan-Nya disebut” atau “ketika mengingat kekudusan-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Nyanyikanlah pujian
  rationale: Bentuk perintah jamak dari זמר dalam konteks ibadah menyatakan tindakan bernyanyi atau bermusik untuk memuji; ungkapan ini mempertahankan unsur musikal dan pujian.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, sedangkan לְ menyatakan pihak yang menjadi tujuan pujian.
- source_word: חֲסִידָיו
  choice: umat-Nya yang setia
  rationale: חסיד menunjuk kepada orang yang dicirikan oleh kesetiaan dan kesalehan dalam hubungannya dengan Allah. “Umat-Nya yang setia” alami sebagai sapaan jamak dan tidak mempersempit artinya menjadi golongan keagamaan tertentu.
- source_word: וְהוֹדוּ
  choice: dan bersyukurlah
  rationale: Dalam konteks pujian, bentuk kausatif dari ידה lazim berarti mengucap syukur atau menyampaikan pujian; “bersyukurlah” sesuai dengan paralelisme ayat.
- source_word: לְזֵכֶר קָדְשׁוֹ
  choice: ketika mengingat kekudusan-Nya
  rationale: זֵכֶר dapat berarti ingatan, peringatan, atau penyebutan. Rumusan ini menyampaikan tindakan bersyukur sehubungan dengan mengingat kekudusan Allah tanpa menambahkan kata “nama”, yang tidak terdapat dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna חֲסִידָיו
  choice: umat-Nya yang setia
  alternative: orang-orang kudus-Nya; orang-orang saleh-Nya
  rationale: Pilihan utama menonjolkan kesetiaan relasional yang terkandung dalam חסיד dan menghindari kesan bahwa istilah ini menunjuk kepada suatu kategori gerejawi tertentu.
- issue: Rujukan לְזֵכֶר קָדְשׁוֹ
  choice: ketika mengingat kekudusan-Nya
  alternative: ketika kekudusan-Nya disebut; pada peringatan akan kekudusan-Nya
  rationale: Frasa Ibrani dapat berkaitan dengan ingatan ataupun penyebutan liturgis. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan mempertahankan kemungkinan makna lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis-liturgis. Partikel “hai” menandai sapaan langsung, sementara bentuk “-lah” mempertahankan daya perintah jamak secara wajar dalam bahasa Indonesia.
