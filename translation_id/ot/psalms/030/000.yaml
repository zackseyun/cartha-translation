translation:
  language: id
  text: Mazmur. Nyanyian untuk pentahbisan rumah[a]. Dari Daud.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah” atau “istana”; teks Ibrani hanya menyebut “rumah”.
