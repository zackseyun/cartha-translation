lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah ini menunjuk pada mazmur atau nyanyian yang berkaitan dengan musik; “mazmur” merupakan padanan baku dan wajar dalam judul-judul Mazmur.
- source_word: שִׁיר
  choice: Nyanyian
  rationale: Diterjemahkan secara tersendiri untuk mempertahankan dua penanda jenis sastra yang berdampingan dalam teks Ibrani.
- source_word: חֲנֻכַּת
  choice: untuk penahbisan
  rationale: Nomina ini berarti penahbisan atau peresmian. Preposisi “untuk” secara wajar menyatakan tujuan atau kesempatan pemakaian nyanyian ini.
- source_word: הַבַּיִת
  choice: rumah
  rationale: Makna leksikal dasarnya ialah “rumah”. Teks tidak menentukan apakah yang dimaksud ialah Bait Allah, istana, atau rumah dalam arti lain, sehingga ambiguitas dipertahankan.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Padanan ini mempertahankan keluwesan frasa Ibrani yang dapat menyatakan kepengarangan, keterkaitan, kepunyaan, atau peruntukan, tanpa mempersempitnya menjadi “oleh Daud”.
theological_decisions:
- issue: Rujukan “rumah” dalam judul
  choice: rumah
  alternative: Bait Allah; istana Daud
  rationale: Kata Ibrani בַּיִת bermakna luas dan judul ini tidak mengidentifikasi rujukannya secara pasti. Terjemahan utama mempertahankan keterbukaan tersebut.
- issue: Makna hubungan לְדָוִד
  choice: Dari Daud
  alternative: Oleh Daud; untuk Daud; milik Daud
  rationale: Preposisi Ibrani dapat menandai beberapa jenis hubungan. “Dari Daud” cukup alami dalam bahasa Indonesia sekaligus tidak memastikan kepengarangan secara lebih tegas daripada sumbernya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Struktur berupa tiga frasa pendek mengikuti sifat judul sebagai rangkaian keterangan. Semua penanda catatan kaki muncul dalam teks utama.
