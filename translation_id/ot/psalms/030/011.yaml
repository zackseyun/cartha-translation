translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Paralelisme antara kain kabung yang dilepaskan dan sukacita yang diikatkan dipertahankan, demikian pula frasa eksplisit “bagiku” dari teks Ibrani.
