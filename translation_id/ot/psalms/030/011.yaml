  text: הָפַ֣כְתָּ מִסְפְּדִ/י֮ לְ/מָח֪וֹל לִ֥/י פִּתַּ֥חְתָּ שַׂקִּ֑/י וַֽ/תְּאַזְּרֵ֥/נִי שִׂמְחָֽה׃
