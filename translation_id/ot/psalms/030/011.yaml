  text: You turned my mourning into dancing for me; you untied my sackcloth and clothed me with joy.
translation:
  language: id
  text: Engkau mengubah ratapanku menjadi tarian bagiku; Engkau melepaskan kain kabungku dan mengikat pinggangku dengan sukacita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: ratapanku
  rationale: Nomina ini menunjuk pada perkabungan atau ratapan; bentuk bersufiks orang pertama tunggal dipertahankan dengan “-ku”.
- source_word: לְמָחוֹל לִי
  choice: menjadi tarian bagiku
  rationale: מָחוֹל berarti tarian, dan לִי dipertahankan secara eksplisit sebagai “bagiku” agar unsur teks sumber tidak dihilangkan.
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: Engkau melepaskan kain kabungku
  rationale: פִּתַּחְתָּ secara harfiah berarti membuka atau melonggarkan; dalam hubungannya dengan kain kabung, “melepaskan” menyampaikan tindakan menanggalkannya secara alami tanpa kehilangan citra asli.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: dan mengikatkan sukacita padaku
  rationale: Kata kerja אָזַר berarti mengikat atau mengenakan di sekeliling tubuh. Terjemahan ini mempertahankan metafora bahwa sukacita dikenakan sebagai pengganti kain kabung.
