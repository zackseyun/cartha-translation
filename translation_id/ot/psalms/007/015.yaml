    rationale: Kata “mengorek” lazimnya mengacu pada mencungkil atau membersihkan dengan alat kecil dan kurang sesuai bagi penggalian sebuah lubang. “Menggalinya lebih dalam” menyampaikan perkembangan tindakan penggalian secara alami.
