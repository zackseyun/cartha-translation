  text: He dug a pit and hollowed it out[a], and he fell into the hole he made.
translation:
  language: id
  text: 'Ia menggali sebuah lubang dan menggalinya lebih dalam,

    lalu ia jatuh ke dalam lubang yang dibuatnya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בּוֹר
  choice: lubang
  rationale: Kata ini dapat berarti lubang atau sumur penampung. Dalam konteks perangkap dan paralelnya dengan שַׁחַת, istilah umum 'lubang' paling sesuai.
- source_word: כָּרָה
  choice: menggali
  rationale: Padanan langsung dan alami yang mempertahankan gambaran konkret tindakan menggali.
- source_word: וַיַּחְפְּרֵהוּ
  choice: dan mengoreknya lebih dalam
  rationale: חפר bertumpang tindih makna dengan כרה; ungkapan ini menyampaikan kelanjutan atau pengintensifan penggalian tanpa pengulangan yang kaku.
- source_word: וַיִּפֹּל
  choice: namun ia sendiri jatuh
  rationale: Bentuk naratif menyatakan akibat berikutnya. 'Namun' dan 'sendiri' membuat pembalikan ironis yang sudah tersirat dalam konteks menjadi alami dalam bahasa Indonesia tanpa mengubah pelakunya.
- source_word: שַׁחַת
  choice: liang
  rationale: Dalam konteks ini kata tersebut menunjuk pada rongga perangkap yang nyata. 'Liang' mempertahankan gambaran fisik sekaligus menghindari pengulangan 'lubang'.
- source_word: יִפְעָל
  choice: yang dibuatnya
  rationale: פעל adalah verba luas untuk mengerjakan atau membuat; di sini merujuk pada liang yang dihasilkan melalui penggalian.
