  verdict: revise
  source_fidelity: 'Draf menangkap urutan dasar dan gambaran konkret ayat dengan baik: seseorang menggali lubang, lalu jatuh ke dalam lubang hasil buatannya. Namun, “namun” dan terutama “sendiri” menambahkan penandaan kontras dan penegasan yang tidak dinyatakan secara eksplisit dalam teks Ibrani. Selain itu, “mengoreknya” kurang tepat untuk חפר dalam konteks penggalian lubang.'
  naturalness: Bahasa draf umumnya baku dan puitis. Akan tetapi, “mengoreknya lebih dalam” terdengar kurang lazim untuk tindakan menggali lubang; “menggalinya lebih dalam” lebih idiomatis dan jelas.
  terminology: “Lubang” merupakan padanan yang baik bagi בור dalam konteks ini. “Liang” dapat dipahami, tetapi “lubang” pada klausa akhir lebih alami dan secara jelas mempertahankan rujukan pada lubang yang telah digali. Tidak ada istilah teologis khusus dalam ayat ini.
