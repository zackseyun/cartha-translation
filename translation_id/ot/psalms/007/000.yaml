base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/000.yaml
  text: A Shiggaion of David[a], which he sang to Yahweh concerning the words of Cush, a Benjaminite.
translation:
  language: id
  text: Syigayon Daud[a], yang dinyanyikannya kepada Yahweh mengenai perkataan Kus, seorang dari suku Benyamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mungkin suatu istilah teknis musik atau puisi, misalnya “ratapan” atau “nyanyian liar”; istilah Ibrani Syigayon ini jarang muncul dan artinya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: Sigayon
  rationale: Istilah Ibrani ini sangat jarang dan makna tepatnya tidak pasti. Transliterasi mempertahankan kemungkinan bahwa ini adalah istilah teknis musik atau puisi tanpa menetapkan arti yang masih diperdebatkan.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam judul mazmur, ל dapat menandai kepengarangan, keterkaitan, atau peruntukan. Bentuk ringkas “Daud” dalam judul Indonesia mempertahankan keterbukaan nuansa itu.
- source_word: אֲשֶׁר שָׁר
  choice: yang dinyanyikannya
  rationale: Menyampaikan klausa relatif dan verba lampau שׁיר secara alami dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menunjukkan arah atau peruntukan nyanyian, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: עַל
  choice: mengenai
  rationale: Dalam judul mazmur, עַל dapat menunjukkan pokok atau peristiwa yang melatarbelakangi; “mengenai” tidak mempersempitnya menjadi hubungan sebab-akibat.
- source_word: דִּבְרֵי
  choice: perkataan
  rationale: דָּבָר dapat berarti perkataan, perkara, atau urusan. “Perkataan” paling dekat dengan bentuk jamak konstruksi di sini tanpa menambahkan gagasan seperti “tuduhan”.
- source_word: כּוּשׁ
  choice: Kus
  rationale: Nama orang ini dialihaksarakan menurut bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: בֶּן יְמִינִי
  choice: seorang dari suku Benyamin
  rationale: Ungkapan ini secara idiomatis menunjuk pada orang yang berasal dari suku Benyamin; terjemahan ini lebih jelas daripada bentuk harfiah “anak orang Benyamin”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian dan membedakannya dari gelar umum untuk Tuhan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat sebagai judul mazmur yang ringkas. Istilah langka “Sigayon” dipertahankan dan dijelaskan dalam catatan kaki; ambiguitas דִּבְרֵי dipertahankan dengan “perkataan”.
