  text: יִגְמָר נָ֬א רַ֨ע רְשָׁעִים֮ וּ/תְכוֹנֵ֪ן צַ֫דִּ֥יק וּ/בֹחֵ֣ן לִ֭בּ֗וֹת וּ/כְלָי֗וֹת אֱלֹהִ֥ים צַדִּֽיק־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: id
  text: 'Kiranya kejahatan orang-orang fasik berakhir,

    tetapi teguhkanlah orang benar,

    ya Allah yang adil,

    yang menguji hati dan batin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hati dan ginjal”; ungkapan Ibrani ini menunjuk pada kehidupan batin manusia yang paling dalam, termasuk pikiran, perasaan, dan dorongan.'
    reason: Mempertahankan padanan idiomatis dalam teks utama sambil menyatakan citra tubuh dalam bahasa Ibrani secara eksplisit.
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: Kiranya ... berakhir
  rationale: Jussif dengan partikel נָא menyatakan permohonan yang sungguh-sungguh; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nuansa permohonan.
- source_word: רַע רְשָׁעִים
  choice: kejahatan orang-orang fasik
  rationale: Mempertahankan pembedaan antara רַע sebagai kejahatan dan רְשָׁעִים sebagai orang-orang yang bersalah atau fasik.
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: tetapi teguhkanlah orang benar
  rationale: כונן dalam bentuk polel bermakna menegakkan, mengukuhkan, atau membuat kokoh; 'teguhkanlah' menyampaikan tindakan Allah dalam memantapkan orang benar.
- source_word: לִבּוֹת וּכְלָיוֹת
  choice: hati dan batin
  rationale: Pasangan idiomatis ini menunjuk keseluruhan kehidupan terdalam manusia—pikiran, kehendak, perasaan, dan dorongan tersembunyi. 'Batin' menerjemahkan fungsi metaforis כְּלָיוֹת secara wajar, dengan arti harfiah dicatat dalam catatan kaki.
- source_word: אֱלֹהִים צַדִּיק
  choice: Engkau, Allah yang benar
  rationale: Memahami frasa ini sebagai sapaan kepada Allah, selaras dengan alur doa. Kata 'Engkau' ditambahkan untuk menjadikan sapaan tersebut jelas dan alami tanpa mengubah rujukannya.
theological_decisions:
- issue: Cakupan sebutan צַדִּיק
  choice: '''Allah yang benar'' sebagai sapaan'
  alternative: '''Allah yang benar menguji hati dan batin'' sebagai pernyataan deskriptif'
  rationale: Urutan Ibrani memungkinkan frasa penutup dibaca sebagai sapaan atau pernyataan. Terjemahan mempertahankan alur permohonan langsung kepada Allah, sementara ambiguitas sintaksisnya diakui.
- issue: Makna antropologis כְּלָיוֹת
  choice: batin dalam teks utama, dengan 'ginjal' dalam catatan kaki
  alternative: ginjal dalam teks utama
  rationale: Dalam antropologi puitis Ibrani, ginjal dipandang sebagai pusat dorongan dan perasaan terdalam. 'Batin' menyampaikan referen metaforis kepada pembaca modern tanpa mengajarkan pembagian antropologis tertentu.
translation_notes:
  register: Bahasa puitis, khidmat, dan modern. Paralelisme ayat dipertahankan melalui pemenggalan baris; 'orang fasik' dan 'orang benar' digunakan sebagai istilah moral yang lazim dalam bahasa Alkitab Indonesia.
