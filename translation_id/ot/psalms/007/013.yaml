translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. ‘Dia’ dan akhiran ‘-Nya’ dipakai untuk rujukan ilahi secara wajar, tanpa menambahkan gelar yang tidak terdapat dalam teks. Penanda catatan kaki ditempatkan tepat setelah frasa yang memiliki ambiguitas leksikal.
