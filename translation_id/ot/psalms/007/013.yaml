  text: וְ֭/ל/וֹ הֵכִ֣ין כְּלֵי מָ֑וֶת חִ֝צָּ֗י/ו לְֽ/דֹלְקִ֥ים יִפְעָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/013.yaml
  text: And for him he has prepared weapons of death[a]; he makes his arrows fiery.
translation:
  language: id
  text: Untuk orang itu, Dia telah menyiapkan senjata maut; Dia membuat anak-anak panah-Nya menyala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia membuat anak-anak panah-Nya untuk para pengejar” atau “melawan para pengejar.” Kata Ibrani ini dapat dipahami berasal dari kata kerja yang berarti “mengejar,” bukan “membakar.” Teks utama mengikuti gambaran perang yang umum tentang anak panah berapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: Untuk orang itu
  rationale: 'Preposisi ל dengan akhiran orang ketiga tunggal paling wajar menyatakan sasaran: senjata disiapkan bagi orang fasik yang disebut dalam konteks sebelumnya. Ungkapan ini juga menghindari kesan bahwa orang fasik menyiapkan senjatanya sendiri.'
- source_word: הֵכִין
  choice: telah menyiapkan
  rationale: Bentuk Hifil dari כון berarti ‘menyiapkan’ atau ‘membuat siap’; bentuk perfektif Ibrani diterjemahkan sebagai tindakan yang sudah dilakukan dan tetap relevan.
- source_word: כְּלֵי מָוֶת
  choice: senjata maut
  rationale: כְּלִי dapat berarti alat, perlengkapan, atau senjata. Gambaran anak panah pada klausa berikutnya mendukung arti ‘senjata’, sedangkan konstruksi ‘maut’ mempertahankan daya puitis dan sifat mematikannya.
- source_word: חִצָּיו
  choice: anak-anak panah-Nya
  rationale: Terjemahan langsung nomina jamak dengan akhiran orang ketiga maskulin tunggal; dalam konteks, akhiran itu merujuk kepada Allah.
- source_word: לְדֹלְקִים
  choice: menyala
  rationale: דלק dapat berkaitan dengan pembakaran atau pengejaran. Dalam hubungan dengan anak panah, ‘menyala’ menghasilkan gambaran alami tentang panah berapi, sementara kemungkinan arti ‘para pengejar’ dipertahankan dalam catatan kaki.
- source_word: יִפְעָל
  choice: membuat
  rationale: פעל dalam bentuk Qal berarti ‘melakukan’, ‘membuat’, atau ‘mengerjakan’. Di sini ‘membuat ... menyala’ alami dalam bahasa Indonesia dan menyatakan tindakan terhadap anak-anak panah.
