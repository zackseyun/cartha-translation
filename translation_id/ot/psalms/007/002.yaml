translation:
  language: id
  text: Jangan sampai ia mengoyak nyawaku[a] seperti singa, mencabik-cabiknya tanpa ada yang menyelamatkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diriku”; kata Ibrani נַפְשִׁי di sini menunjuk pada nyawa atau diri pemazmur yang terancam.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: supaya jangan
  rationale: Mengungkapkan akibat yang ditakutkan atau hendak dihindari, selaras dengan fungsi klausa negatif dalam bahasa Ibrani.
- source_word: יִטְרֹף
  choice: menerkam
  rationale: Kata kerja טרף menggambarkan tindakan binatang pemangsa terhadap mangsanya; “menerkam” alami dalam bahasa Indonesia dan mempertahankan gambaran singa.
- source_word: כְּאַרְיֵה
  choice: seperti singa
  rationale: Awalan כְּ menyatakan perbandingan, yang secara wajar diterjemahkan “seperti”.
- source_word: נַפְשִׁי
  choice: nyawaku
  rationale: Dalam konteks ancaman maut, נֶפֶשׁ menunjuk pada hidup atau diri pemazmur, bukan secara khusus unsur rohani yang terpisah dari tubuh.
- source_word: פֹּרֵק
  choice: mencabik-cabiknya
  rationale: Partisipel ini melanjutkan dan memperkuat gambaran serangan singa. Bentuk ulang “mencabik-cabik” menyampaikan tindakan merobek hingga tercerai, sedangkan “-nya” merujuk kembali pada nyawa pemazmur.
- source_word: וְאֵין מַצִּיל
  choice: tanpa ada yang menyelamatkan
  rationale: Menyatakan tidak adanya siapa pun yang dapat melepaskan pemazmur dari bahaya; susunan ini alami dan tetap mempertahankan ketegasan ungkapan Ibrani.
