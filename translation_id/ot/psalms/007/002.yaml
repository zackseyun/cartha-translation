  register: Bahasa Indonesia baku modern dengan citra pemangsa yang hidup dan mudah dipahami. “Nyawaku” dipilih daripada “jiwaku” agar konteks ancaman fisik tidak disalahartikan secara sempit, sementara alternatif leksikal dipertahankan dalam catatan kaki.
