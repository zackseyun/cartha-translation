id: PSA.7.17
reference: Psalms 7:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: id
  text: Aku akan bersyukur kepada Yahweh sesuai dengan kebenaran-Nya[a], dan aku akan menyanyikan pujian bagi nama Yahweh Yang Mahatinggi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena keadilan-Nya” atau “sesuai dengan keadilan-Nya.” Istilah Ibrani dapat mengandung nuansa “kebenaran” maupun “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: Aku akan bersyukur
  rationale: Bentuk hifil dari ידה dalam konteks mazmur lazim menyatakan syukur atau pujian. Frasa ini alami dalam bahasa Indonesia dan mempertahankan nada ibadah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diteruskan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כְּצִדְקוֹ
  choice: sesuai dengan kebenaran-Nya
  rationale: Preposisi כְּ menyatakan kesesuaian atau tolok ukur. צֶדֶק mencakup kebenaran moral dan keadilan; 'kebenaran' dipakai dalam teks utama, sedangkan nuansa 'keadilan' dicatat sebagai alternatif.
- source_word: וַאֲזַמְּרָה
  choice: dan aku akan menyanyikan pujian
  rationale: Kata זמר dalam bentuk volitif menunjuk pada menyanyi atau bermusik sebagai pujian; terjemahan ini menyampaikan unsur nyanyian dan tujuan pemujaannya.
- source_word: שֵׁם
  choice: nama
  rationale: Terjemahan langsung ini mempertahankan gagasan identitas dan kemasyhuran ilahi tanpa mempersempit maknanya.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Sebagai gelar ilahi, bentuk ini alami dan bermartabat dalam bahasa Indonesia tanpa menambahkan kata 'Allah' yang tidak terdapat dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan sebuah gelar.
- issue: Makna צֶדֶק ketika dikenakan kepada Yahweh
  choice: kebenaran
  alternative: keadilan
  rationale: Istilah Ibrani ini dapat mencakup watak dan tindakan yang benar sekaligus adil. Teks utama mempertahankan cakupan moral yang luas melalui 'kebenaran', sementara nuansa yudisialnya dicatat dalam catatan kaki.
- issue: Hubungan semantis preposisi כְּ dengan צֶדֶק
  choice: sesuai dengan
  alternative: karena
  rationale: '''Sesuai dengan'' mengikuti nilai dasar preposisi sebagai kesesuaian atau tolok ukur. Pembacaan kausal tetap mungkin dalam konteks ucapan syukur dan karena itu dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pronomina orang pertama tunggal 'aku' sesuai dengan suara pribadi pemazmur; kapitalisasi '-Nya' mengikuti kebiasaan penghormatan dalam teks religius Indonesia.
