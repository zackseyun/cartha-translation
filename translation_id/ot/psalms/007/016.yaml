  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: id
  text: 'Kesusahannya kembali menimpa kepalanya[a],

    dan kekerasannya turun menimpa ubun-ubunnya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kejahatannya kembali menimpa kepalanya.” Kata Ibrani עָמָל dapat berarti kesusahan, kemalangan, kejahatan, atau perbuatan yang merugikan, sesuai konteks.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani קָדְקֹד menunjuk pada bagian paling atas atau puncak kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: kembali menimpa
  rationale: Bentuk ini menyatakan bahwa akibat perbuatan jahat berbalik kepada pelakunya; “kembali menimpa” alami dalam bahasa Indonesia dan selaras dengan gambaran pada kedua baris.
- source_word: עֲמָלוֹ
  choice: kesusahan yang dibuatnya
  rationale: עָמָל dapat berarti kesusahan, kejahatan, atau perbuatan merugikan. Dalam konteks pembalasan ini, frasa tersebut menunjuk pada kesusahan yang ditimbulkan pelaku, bukan kerja keras yang netral.
- source_word: בְרֹאשׁוֹ
  choice: menimpa kepalanya sendiri
  rationale: Ungkapan ini mempertahankan gambaran akibat yang berbalik mengenai kepala pelaku; “sendiri” memperjelas acuan refleksif yang wajar dalam bahasa Indonesia.
- source_word: קָדְקֳדוֹ
  choice: ubun-ubunnya
  rationale: קָדְקֹד menunjuk pada bagian paling atas atau puncak kepala. “Ubun-ubun” merupakan padanan Indonesia yang konkret dan puitis.
- source_word: חֲמָסוֹ
  choice: kekerasannya
  rationale: חָמָס lazim menunjuk pada kekerasan atau perbuatan zalim; “kekerasannya” mempertahankan arti langsung dan kepemilikan pelaku.
- source_word: יֵרֵד
  choice: turun menimpa
  rationale: Padanan ini mempertahankan gerak vertikal ירד sekaligus menghasilkan ungkapan Indonesia yang jelas ketika sesuatu turun ke atas kepala seseorang.
theological_decisions:
- issue: Gambaran pembalasan setimpal dalam keadilan puitis
  choice: Ayat ini menggambarkan kesusahan yang dibuat dan kekerasan orang fasik berbalik menimpa dirinya sendiri.
  alternative: Ayat dapat dipahami secara lebih umum sebagai kesusahan yang kembali kepada seseorang tanpa penekanan moral yang kuat.
  rationale: Paralel antara kesusahan yang kembali ke kepala dan kekerasan yang turun ke ubun-ubun kuat menyatakan akibat perbuatan jahat yang berbalik kepada pelakunya, tanpa menambahkan klaim doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Paralelisme kedua baris dan gambaran gerak berbalik serta turun dipertahankan; istilah “ubun-ubun” dipilih sebagai padanan alami dan konkret bagi puncak kepala.
