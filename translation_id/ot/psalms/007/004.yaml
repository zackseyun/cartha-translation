translation:
  language: id
  text: 'jika aku membalas orang yang hidup damai denganku dengan kejahatan,

    atau melucuti musuhku tanpa alasan[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “padahal aku menyelamatkan orang yang memusuhi aku tanpa alasan.” Kata Ibrani yang diterjemahkan “melucuti” juga lazim berarti “melepaskan” atau “menyelamatkan”; רֵיקָם juga dapat berarti “dengan tangan kosong.”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Memperkenalkan anak kalimat bersyarat dalam sumpah penyangkalan diri; “jika” merupakan padanan Indonesia yang alami dan tepat.
- source_word: גָּמַלְתִּי
  choice: aku membalas
  rationale: גמל di sini menyatakan tindakan memperlakukan atau membalas seseorang; “membalas” mempertahankan nuansa timbal balik dalam konteks kesalahan moral yang disangkal.
- source_word: שׁוֹלְמִי
  choice: orang yang hidup damai denganku
  rationale: Bentuk ini menunjuk kepada seseorang yang berada dalam hubungan damai dengan pemazmur. Ungkapan deskriptif ini lebih dekat dengan bahasa sumber daripada “sekutuku” atau “sahabatku”.
- source_word: רָע
  choice: dengan kejahatan
  rationale: Menunjuk pada hal buruk yang diberikan sebagai balasan. “Kejahatan” mempertahankan bobot moral kata Ibrani, sedangkan preposisi “dengan” menghasilkan susunan Indonesia yang wajar setelah “membalas”.
- source_word: וָאֲחַלְּצָה
  choice: atau menjarah
  rationale: חלץ lazimnya dapat berarti melepaskan atau menyelamatkan, tetapi juga dapat dipahami sebagai melucuti atau merampasi. Dalam protasis sumpah ini, arti negatif menjaga kesejajaran dengan perbuatan jahat pada baris pertama. “Menjarah” menyatakan tindakan mengambil secara tidak adil tanpa terlalu mempersempit objek rampasan.
- source_word: צוֹרְרִי
  choice: musuhku
  rationale: Partisip nominal ini menunjuk kepada orang yang memusuhi atau menentang pemazmur; “musuhku” jelas dan alami dalam bahasa Indonesia modern.
- source_word: רֵיקָם
  choice: tanpa alasan
  rationale: Adverbia ini dapat berarti sia-sia, dengan tangan kosong, atau tanpa sebab. Bersama tindakan bermusuhan, “tanpa alasan” menyatakan bahwa tindakan itu dilakukan tanpa dasar yang sah.
theological_decisions:
- issue: Makna וָאֲחַלְּצָה צוֹרְרִי רֵיקָם
  choice: 'Dibaca sebagai tindakan negatif yang sejajar: “atau menjarah musuhku tanpa alasan.”'
  alternative: 'Dibaca menurut arti umum חלץ sebagai tindakan positif: “padahal aku menyelamatkan orang yang memusuhi aku tanpa alasan,” atau “dan aku melepaskan musuhku dengan tangan kosong.”'
  rationale: Klausa Ibrani ini ambigu secara leksikal dan sintaksis. Arti negatif membuat kedua baris sama-sama menyebut kesalahan yang disangkal dalam sumpah, sedangkan arti umum verba tersebut menghasilkan tindakan penyelamatan yang perlu dipahami sebagai klausa konsesif atau sisipan. Teks utama mengikuti kesejajaran negatif, dan catatan kaki mempertahankan pembacaan penyelamatan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. “Orang yang hidup damai denganku” dipilih untuk ketepatan relasional, sementara tanda pisah mempertahankan bahwa kalimat bersyarat berlanjut ke ayat berikutnya.
