id: PSA.7.8
reference: Psalms 7:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָה֮ יָדִ֪ין עַ֫מִּ֥ים שָׁפְטֵ֥/נִי יְהוָ֑ה כְּ/צִדְקִ֖/י וּ/כְ/תֻמִּ֣/י עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: id
  text: Yahweh menghakimi bangsa-bangsa[a]. Hakimilah aku, ya Yahweh[b], sesuai dengan kebenaranku dan ketulusanku yang ada padaku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan menghakimi bangsa-bangsa.”'
    reason: Bentuk kata kerja Ibrani dapat dipahami sebagai tindakan umum/berkelanjutan atau sebagai tindakan yang akan datang.
  - marker: b
    text: Dalam konteks ini, “Hakimilah aku” juga dapat berarti “Berilah aku keadilan” atau “Nyatakanlah aku benar.”
    reason: Kata perintah yudisial ini dapat mengandung nuansa putusan yang membenarkan pihak yang memohon.
  - marker: c
    text: 'Secara harfiah: “yang di atasku”; maksudnya dapat pula dipahami sebagai ketulusan yang melekat padaku atau yang berkenaan denganku.'
    reason: Preposisi עַל mempertahankan gambaran yang tidak dapat dialihkan secara alami dan pasti ke dalam bahasa Indonesia.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar "TUHAN".
- source_word: יָדִין
  choice: menghakimi
  rationale: Bentuk imperfek puitis ini dapat menyatakan tindakan umum atau berkelanjutan; bentuk kini dalam bahasa Indonesia sesuai dengan seruan yang menyusul.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk kepada kelompok-kelompok manusia secara luas; "bangsa-bangsa" merupakan padanan Indonesia yang alami.
- source_word: שָׁפְטֵנִי
  choice: Hakimilah aku
  rationale: Imperatif ini secara langsung meminta Yahweh bertindak sebagai hakim. Dalam konteksnya, permohonan itu mengharapkan putusan yang membenarkan pemazmur, tetapi teks utama mempertahankan ungkapan yudisial yang lebih luas.
- source_word: כְּצִדְקִי
  choice: sesuai dengan kebenaranku
  rationale: Ungkapan ini mempertahankan klaim orang pertama dalam bahasa Ibrani dan tidak mempersempitnya menjadi sekadar "perkaraku yang benar".
- source_word: וּכְתֻמִּי
  choice: dan ketulusanku
  rationale: תֹּם menunjuk pada keutuhan watak, ketulusan, atau keadaan tidak bercela. "Ketulusan" alami dalam bahasa Indonesia dan tidak dengan sendirinya menyiratkan kesempurnaan tanpa dosa.
- source_word: עָלָי
  choice: yang ada padaku
  rationale: Padanan ini menyampaikan bahwa ketulusan tersebut melekat pada atau berkenaan dengan pemazmur, tanpa memakai ungkapan harfiah "di atasku" yang tidak alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah klaim pemazmur tentang kebenaran dan ketulusannya harus diperhalus agar tidak terkesan menyatakan bahwa ia sama sekali tanpa dosa
  choice: Mempertahankan klaim orang pertama secara langsung sebagai permohonan berdasarkan kebenaran dan ketulusannya
  alternative: Memparafrasakannya sebagai "ketidakbersalahanku dalam perkara ini" atau "perkaraku yang benar"
  rationale: Teks Ibrani secara eksplisit mengatakan "kebenaranku" dan "ketulusanku". Terjemahan tidak menyelesaikan ketegangan teologis itu dengan mempersempit klaimnya, meskipun konteks dapat menunjukkan suatu perkara tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel puisi dipertahankan. Bentuk “Hakimilah aku” dipilih karena langsung dan bernuansa yudisial, sedangkan catatan kaki menjelaskan kemungkinan makna putusan yang menguntungkan.
