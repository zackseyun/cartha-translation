id: PSA.7.7
reference: Psalms 7:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑/ךָּ וְ֝/עָלֶ֗י/הָ לַ/מָּר֥וֹם שֽׁוּבָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/007.yaml
  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: id
  text: Biarlah himpunan bangsa-bangsa mengelilingi-Mu, dan kembalilah ke tempat tinggi di atasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di atas mereka,” dengan memandang bangsa-bangsa yang berhimpun sebagai jamak.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: himpunan
  rationale: Kata ini menunjuk pada kelompok yang berhimpun. “Himpunan” alami dalam konteks puitis dan tidak membawa warna khusus kelembagaan agama.
- source_word: לְאֻמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk pada berbagai kelompok etnis atau bangsa. “Bangsa-bangsa” merupakan padanan Indonesia yang alami dan tetap mempertahankan kemajemukannya.
- source_word: תְּסוֹבְבֶךָּ
  choice: biarlah ... mengelilingi-Mu
  rationale: Bentuk verba paling tepat dipahami sebagai harapan atau permohonan, bukan sekadar pernyataan tentang masa depan; “mengelilingi” menyampaikan makna dasar סבב.
- source_word: וְעָלֶיהָ
  choice: di atasnya
  rationale: Pronomina Ibrani berbentuk feminin tunggal dan secara gramatikal merujuk kembali kepada “himpunan” sebagai keseluruhan kolektif. Bentuk tunggal dipertahankan agar rujukan formalnya tidak hilang.
- source_word: לַמָּרוֹם
  choice: ke tempat tinggi
  rationale: מָרוֹם berarti ketinggian atau tempat yang tinggi dan luhur. Padanan ini mempertahankan gambaran ruang sekaligus memungkinkan nuansa kedudukan yang mulia tanpa menambahkan gagasan “surga” atau “takhta” yang tidak eksplisit.
- source_word: שׁוּבָה
  choice: kembalilah
  rationale: Ini adalah bentuk imperatif dari שוב, “kembali/berbalik.” “Kembalilah” mempertahankan bentuk permohonan tanpa memperluasnya menjadi “bertakhtalah kembali.”
theological_decisions:
- issue: Apakah ayat ini menggambarkan penghakiman ilahi dari kedudukan luhur atau gerakan harfiah ke atas
  choice: Permohonan puitis agar Allah kembali ke tempat tinggi di atas himpunan bangsa-bangsa
  alternative: Permohonan agar Allah secara harfiah naik ke surga; atau pernyataan masa depan bahwa Ia akan kembali ke tempat tinggi
  rationale: Imperatif שׁוּבָה dan konteks mazmur mendukung pembacaan sebagai permohonan. Ungkapan “ke tempat tinggi” mempertahankan ketegangan antara gambaran ruang dan kedudukan pemerintahan/penghakiman tanpa menetapkan salah satunya secara dogmatis.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kapitalisasi pronomina “-Mu” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Allah. Urutan klausa dan bentuk permohonan dipertahankan dekat dengan teks Ibrani.
