  yaml_path: translation/ot/psalms/007/010.yaml
  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: id
  text: Allah adalah perisaiku[a], yang menyelamatkan orang-orang yang berhati lurus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perisaiku ada pada Allah.” Bahasa Ibrani sangat ringkas dan tidak memakai kata kerja eksplisit; hubungan tepat yang dinyatakan oleh preposisinya diperdebatkan.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנִּי
  choice: Perisaiku
  rationale: Nomina מָגֵן secara konkret berarti perisai. Bentuk ini mempertahankan gambaran puitis teks, bukan menggantinya dengan istilah abstrak seperti “perlindunganku”.
- source_word: עַל
  choice: ada pada
  rationale: Dalam ungkapan ringkas מָגִנִּי עַל אֱלֹהִים, preposisi ini menunjukkan bahwa pertahanan pemazmur berada atau bersandar pada Allah. “Ada pada” cukup alami dalam bahasa Indonesia dan tidak memaksakan tafsiran kepemilikan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, dalam konteks ini kata tersebut jelas menunjuk kepada Allah Israel yang esa.
- source_word: מוֹשִׁיעַ
  choice: yang menyelamatkan
  rationale: Partisip ini menggambarkan tindakan khas Allah. Klausa relatif Indonesia mempertahankan sifat deskriptifnya secara alami.
- source_word: יִשְׁרֵי לֵב
  choice: orang-orang yang berhati lurus
  rationale: Ungkapan ini menunjuk kepada mereka yang lurus dalam batin atau watak moral. “Berhati lurus” mempertahankan idiom tentang hati sekaligus terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan sintaksis pada bagian pertama ayat
  choice: “Perisaiku ada pada Allah”
  alternative: “Allah adalah perisaiku” atau terjemahan harfiah “Perisaiku di atas Allah”
  rationale: Bahasa Ibrani tidak memuat verba eksplisit dan susunannya padat. Terjemahan utama mempertahankan urutan serta metafora sumber sambil menyatakan bahwa pertahanan pemazmur terdapat pada Allah. Catatan kaki mencatat restrukturisasi yang lebih interpretatif tanpa menetapkannya sebagai satu-satunya kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Diksi “perisai” mempertahankan citraan konkret mazmur; “berhati lurus” dipilih agar idiom Ibrani tetap terasa namun mudah dipahami pembaca umum.
