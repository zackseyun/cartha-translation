translation:
  language: id
  text: Biarlah musuh mengejar nyawaku dan menyusul aku[a]; biarlah ia menginjak-injak aku hingga ke tanah dan membuat kemuliaanku berdiam dalam debu[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwaku” untuk “nyawaku” (נַפְשִׁי); istilah Ibrani ini dapat menunjuk pada diri, jiwa, atau nyawa sesuai konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “kehormatanku” atau “martabatku” untuk “kemuliaanku” (כְבוֹדִי).
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: Biarlah ... mengejar
  rationale: Bentuknya menyampaikan daya jusif atau kutukan diri dalam konteks sumpah bersyarat; “mengejar” mempertahankan arti lugas dan rangkaian tindakan musuh.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Nomina tunggal tanpa artikel ini dapat diterjemahkan secara alami sebagai “musuh”; bahasa Indonesia tidak memerlukan pembedaan artikel tentu dan tak tentu.
- source_word: נַפְשִׁי
  choice: nyawaku
  rationale: Dalam konteks pengejaran yang mengancam kehidupan, נֶפֶשׁ menunjuk pada nyawa atau kehidupan seseorang, bukan secara khusus jiwa tak berwujud.
- source_word: וְיַשֵּׂג
  choice: dan menyusul aku
  rationale: Verba ini berarti mencapai atau menyusul orang yang dikejar; objek orang pertama dinyatakan agar kalimat Indonesia jelas dan alami.
- source_word: וְיִרְמֹס
  choice: biarlah ia menginjak-injak
  rationale: Mengungkapkan tindakan menginjak atau meremukkan dengan kaki serta mempertahankan daya jusif pada klausa berikutnya.
- source_word: לָאָרֶץ
  choice: ke tanah
  rationale: Dalam gambaran penginjakan, “ke tanah” merupakan padanan alami bagi arah menuju bumi atau tanah.
- source_word: חַיָּי
  choice: hidupku
  rationale: Bentuk jamak חַיִּים dipakai secara idiomatis untuk kehidupan; “hidupku” mempertahankan pengulangan puitis tanpa terdengar kaku.
- source_word: וּכְבוֹדִי
  choice: kemuliaanku
  rationale: “Kemuliaanku” menjaga keluasan dan daya puitis כָּבוֹד, yang juga dapat menunjuk pada kehormatan atau martabat.
- source_word: לֶעָפָר
  choice: dalam debu
  rationale: Dengan verba “berdiam”, “dalam debu” alami dalam bahasa Indonesia dan mempertahankan citra penghinaan serta kematian.
- source_word: יַשְׁכֵּן
  choice: membuat ... berdiam
  rationale: Bentuk hifil bersifat kausatif, yakni membuat atau menyebabkan sesuatu berdiam; terjemahan ini mempertahankan keanehan puitis sumber.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah ini ditransliterasikan karena fungsi tepatnya tidak pasti; menerjemahkannya akan memberi kepastian yang tidak didukung teks.
theological_decisions:
- issue: Makna antropologis נַפְשִׁי
  choice: nyawaku
  alternative: jiwaku
  rationale: Konteks pengejaran, penyusulan, dan penginjakan menunjuk pada kehidupan pribadi secara konkret. “Nyawaku” tidak memasukkan pemisahan tubuh-jiwa yang tidak dituntut oleh bahasa Ibrani.
- issue: Makna כְבוֹדִי dalam penyebutan diri secara puitis
  choice: kemuliaanku
  alternative: kehormatanku atau martabatku
  rationale: Pilihan ini mempertahankan keluasan metaforis ungkapan Ibrani; alternatif yang lebih sempit dicatat tanpa memutuskan ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Paralelisme serta daya kutukan diri dipertahankan dengan pengulangan “biarlah”. Istilah “Sela” dipertahankan sebagai transliterasi tradisional.
