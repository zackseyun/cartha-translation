  text: הִנֵּ֥ה יְחַבֶּל אָ֑וֶן וְ/הָרָ֥ה עָ֝מָ֗ל וְ/יָ֣לַד שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/014.yaml
  text: 'Look: he labors with wickedness, conceives trouble, and gives birth to falsehood.[a]'
translation:
  language: id
  text: 'Lihatlah: ia bersusah payah dengan kejahatan, mengandung kesusahan, dan melahirkan dusta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani menumpuk gambaran bersusah payah, mengandung, dan melahirkan. Verba pertama juga dapat diterjemahkan “menggeliat kesakitan seperti orang bersalin”, sedangkan “kejahatan” dan “kesusahan” memiliki cakupan makna yang sebagian bertumpang tindih.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian kepada gambaran yang hidup; “Lihatlah” alami, langsung, dan tetap bernada luhur dalam bahasa Indonesia modern.
- source_word: יְחַבֶּל
  choice: bersusah payah dengan
  rationale: Dalam rangkaian kiasan kelahiran, verba ini dapat menggambarkan pergumulan atau rasa sakit ketika bersalin. Pilihan ini mempertahankan gagasan usaha yang berat tanpa memindahkan arti “mengandung” dari verba berikutnya.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Kata ini mencakup kesalahan moral sekaligus akibat buruk yang ditimbulkannya. “Kejahatan” membedakannya dari עָמָל sambil mempertahankan tanggung jawab moral pelakunya.
- source_word: הָרָה
  choice: mengandung
  rationale: Verba ini secara khusus menyatakan pembuahan atau kehamilan dan meneruskan gambaran reproduksi yang padat dalam bahasa Ibrani.
- source_word: עָמָל
  choice: kesusahan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada kesusahan atau malapetaka yang dihasilkan oleh tindakan jahat; pilihan ini juga mempertahankan sebagian tumpang tindih maknanya dengan אָוֶן.
- source_word: יָלַד שָׁקֶר
  choice: melahirkan dusta
  rationale: Ungkapan ini menuntaskan gambaran kelahiran. “Dusta” ringkas dan alami serta dapat menunjuk kepada kebohongan, kepalsuan, atau hasil yang menipu.
