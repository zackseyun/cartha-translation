source:
  edition: WLC
  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: id
  text: Allah adalah hakim yang adil,[a] dan Allah murka setiap hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah menghakimi orang benar.”'
    reason: Kemungkinan sintaksis lain memahami צַדִּיק sebagai objek dari partisipel שׁוֹפֵט, bukan sebagai sifat sang Hakim.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks mazmur ini, bentuk tersebut menunjuk kepada satu-satunya Allah dan bermakna tunggal.
- source_word: שׁוֹפֵט צַדִּיק
  choice: adalah hakim yang adil
  rationale: Partisipel שׁוֹפֵט dipahami secara substantival/predikatif, sedangkan צַדִּיק menerangkan sifat sang Hakim. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penegasan tentang keadilan Allah.
- source_word: וְאֵל
  choice: dan Allah
  rationale: אֵל meneruskan acuan kepada Allah dalam kesejajaran dengan אֱלֹהִים; kata sambung וְ diterjemahkan secara eksplisit.
- source_word: זֹעֵם
  choice: murka
  rationale: Partisipel ini menyatakan kemarahan atau kejengkelan ilahi yang berkelanjutan. 'Murka' merupakan istilah Indonesia yang wajar, bermartabat, dan sesuai untuk kemarahan Allah terhadap kejahatan.
- source_word: בְּכָל יוֹם
  choice: setiap hari
  rationale: Frasa ini paling alami menyatakan keberulangan dari hari ke hari, bukan semata-mata durasi sepanjang satu hari.
theological_decisions:
- issue: Bahasa tentang murka ilahi
  choice: Allah murka setiap hari
  alternative: Allah geram setiap hari
  rationale: Teks Ibrani secara terbuka mengaitkan murka yang berulang dengan Allah. Terjemahan tidak melunakkan ketegangan teologis itu; 'murka' juga lebih alami dan bermartabat daripada 'geram' dalam konteks ini.
- issue: Hubungan צַדִּיק dengan שׁוֹפֵט
  choice: hakim yang adil
  alternative: menghakimi orang benar
  rationale: Susunan tersebut paling mungkin menggambarkan Allah sebagai Hakim yang adil, tetapi secara gramatikal צַדִּיק juga dapat dipahami sebagai objek tunggal, yaitu 'orang benar'; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan 'Allah' dipertahankan untuk mencerminkan kesejajaran dua sebutan ilahi dalam teks Ibrani; 'murka' mempertahankan bobot moral dan teologis זֹעֵם tanpa parafrasa.
