  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: id
  text: Bangkitlah, ya Yahweh, dalam amarah-Mu; tegakkanlah diri-Mu menghadapi luapan murka musuh-musuhku; bangunlah demi aku; Engkau telah memerintahkan penghakiman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bangunlah demi aku untuk penghakiman yang telah Kauperintahkan.” Susunan Ibrani ringkas dan memungkinkan frasa “penghakiman yang telah Kauperintahkan” dipahami sebagai tujuan seruan sebelumnya.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Bangkitlah
  rationale: Imperatif קום yang ditujukan kepada Allah; “bangkitlah” alami, puitis, dan mempertahankan gambaran tindakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בְּאַפֶּךָ
  choice: dalam amarah-Mu
  rationale: אַף secara harfiah dapat berarti hidung, tetapi dalam idiom ini jelas menunjuk pada amarah.
- source_word: הִנָּשֵׂא
  choice: tegakkanlah diri-Mu
  rationale: Imperatif nifal dari נשׂא meneruskan gambaran Allah yang bangkit untuk bertindak; ungkapan ini mempertahankan nuansa refleksif tanpa terdengar janggal.
- source_word: בְּעַבְרוֹת צוֹרְרָי
  choice: menghadapi luapan murka musuh-musuhku
  rationale: Bentuk jamak עברות dapat menggambarkan luapan-luapan murka; preposisi ב dipahami secara kontekstual sebagai tindakan menghadapi permusuhan mereka.
- source_word: וְעוּרָה אֵלַי
  choice: bangunlah demi aku
  rationale: Mempertahankan bahasa antropomorfis עור, sedangkan אֵלַי dipahami secara benefaktif, yaitu bertindak demi pemazmur.
- source_word: מִשְׁפָּט צִוִּיתָ
  choice: untuk penghakiman yang telah Kauperintahkan
  rationale: Mempertahankan arti biasa צוה, “memerintahkan,” dan menghubungkan frasa ini sebagai tujuan seruan “bangunlah”; susunan Ibrani juga memungkinkan pembacaan sebagai klausa mandiri.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; transliterasi mempertahankan pembedaan antara nama tersebut dan gelar.
- issue: Imperatif antropomorfis kepada Allah
  choice: Mempertahankan “Bangkitlah ... tegakkanlah diri-Mu ... bangunlah”
  alternative: Memparafrasakan sebagai “bertindaklah” atau “campur tanganlah”
  rationale: Bahasa doa yang hidup dalam teks dipertahankan tanpa menyiratkan secara harfiah bahwa Allah tertidur atau tidak aktif.
- issue: Hubungan sintaksis מִשְׁפָּט צִוִּיתָ dengan seruan sebelumnya
  choice: “bangunlah demi aku untuk penghakiman yang telah Kauperintahkan”
  alternative: “bangunlah demi aku; Engkau telah memerintahkan penghakiman”
  rationale: Tanpa konjungsi, frasa nominal relatif yang menjadi tujuan seruan sebelumnya adalah pembacaan yang wajar, tetapi teks Ibrani ringkas sehingga kemungkinan klausa mandiri tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa puitis dan bermartabat. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan luas dalam teks keagamaan Indonesia; citra antropomorfis dan ketegangan sintaksis Ibrani dipertahankan.
