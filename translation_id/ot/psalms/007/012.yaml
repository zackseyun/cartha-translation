base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: id
  text: Jika ia tidak berbalik[a], ia akan mengasah pedangnya[b]; ia telah merentangkan busurnya dan menyiapkannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak bertobat.” Kata Ibrani ini berarti berbalik atau kembali dan dalam konteks ini dapat mengandung pengertian bertobat.
    reason: lexical_alternative
  - marker: b
    text: Pronomina dalam ayat ini mungkin mengacu kepada Allah, yang menyiapkan senjata penghukuman terhadap orang yang tidak berbalik, atau—meskipun kemungkinannya lebih kecil—kepada orang fasik yang menyiapkan senjatanya sendiri.
    reason: alternative_reading
  - marker: c
    text: Atau, “dan membuatnya siap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Jika ... tidak
  rationale: Mempertahankan bentuk syarat dalam bahasa Ibrani secara jelas dan alami dalam bahasa Indonesia.
- source_word: יָשׁוּב
  choice: berbalik
  rationale: Kata שׁוב pada dasarnya berarti berbalik atau kembali. Dalam konteks penghukuman, kata ini dapat menyiratkan pertobatan, tetapi 'berbalik' mempertahankan keluasan makna sumber.
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: dia akan mengasah pedangnya
  rationale: Mengungkapkan tindakan menajamkan pedang dengan istilah Indonesia modern dan langsung, sambil mempertahankan pronomina orang ketiga dari teks Ibrani.
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: dia telah merentangkan busurnya
  rationale: Dalam ungkapan tentang busur, דרך menunjuk pada tindakan melenturkan atau memasang busur agar siap digunakan. 'Merentangkan' menyampaikan gambaran persiapan senjata secara alami.
- source_word: וַיְכוֹנְנֶהָ
  choice: dan menyiapkannya
  rationale: Bentuk verba ini menyatakan membuat atau menempatkan sesuatu dalam keadaan siap; sufiks feminin merujuk kepada busur.
theological_decisions:
- issue: Acuan pronomina orang ketiga tunggal
  choice: Pronomina dibiarkan tanpa nama khusus; dalam konteks utama, pelaku yang menyiapkan senjata penghakiman kemungkinan adalah Allah.
  alternative: Seluruh pronomina dapat dipahami mengacu kepada orang fasik yang menyiapkan senjatanya sendiri.
  rationale: Konteks mazmur mendukung Allah sebagai Hakim yang menyiapkan senjata penghukuman jika orang fasik tidak berbalik. Namun, teks Ibrani hanya memakai bentuk orang ketiga dan memungkinkan pembacaan lain, sehingga terjemahan tidak menambahkan nama 'Allah' atau kapitalisasi yang akan menutup ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina ditulis dengan huruf kecil untuk mempertahankan ambiguitas asli mengenai pelakunya; bentuk verbal menjaga peralihan aspek dari tindakan yang akan dilakukan kepada persiapan yang sudah dilakukan.
