  text: יְהוָ֣ה אֱ֭לֹהַ/י בְּ/ךָ֣ חָסִ֑יתִי הוֹשִׁיעֵ֥/נִי מִ/כָּל רֹ֝דְפַ֗/י וְ/הַצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: id
  text: Ya Yahweh, Allahku, kepada-Mu aku berlindung.[a] Selamatkanlah aku dari semua orang yang mengejar aku, dan luputkanlah aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “aku telah berlindung.” Bentuk perfekt Ibrani dapat menyatakan tindakan berlindung yang telah dilakukan dan tetap berlaku dalam konteks doa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH secara langsung, sesuai bukti teks Ibrani dan kebijakan proyek.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk dengan sufiks orang pertama tunggal secara alami berarti “Allahku”; bersama Yahweh, frasa ini merupakan sapaan langsung.
- source_word: בְּךָ
  choice: kepada-Mu
  rationale: Dengan verba חסה, preposisi ב menyatakan pihak yang dijadikan tempat perlindungan. “Kepada-Mu aku berlindung” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “di dalam-Mu”.
- source_word: חָסִיתִי
  choice: aku berlindung
  rationale: Qal perfekt orang pertama tunggal dari חסה menyatakan mencari atau mendapatkan perlindungan. Dalam konteks doa, bentuk perfekt dapat mengungkapkan tindakan yang telah diambil dan tetap berlaku, yang secara alami dapat disampaikan dengan kala kini bahasa Indonesia.
- source_word: הוֹשִׁיעֵנִי
  choice: Selamatkanlah aku
  rationale: Imperatif Hifil dari ישׁע lazim berarti memohon keselamatan atau penyelamatan; bentuk -lah mempertahankan corak permohonan yang khidmat.
- source_word: מִכָּל רֹדְפַי
  choice: dari semua orang yang mengejar aku
  rationale: Partisip dengan sufiks orang pertama menunjukkan para pengejar yang tindakannya sedang berlangsung. Bentuk klausa ini jelas dan wajar bagi pembaca modern.
- source_word: וְהַצִּילֵנִי
  choice: dan lepaskanlah aku
  rationale: Imperatif Hifil dari נצל berarti melepaskan atau menyelamatkan dari bahaya. “Lepaskanlah” mempertahankan perbedaan leksikal dari הוֹשִׁיעֵנִי tanpa menambahkan gagasan yang tidak ada dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri dalam sapaan langsung. “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Aspek verba חָסִיתִי dalam konteks doa
  choice: aku berlindung
  alternative: aku telah berlindung
  rationale: Perfekt Ibrani dapat menyoroti tindakan berlindung yang sudah diambil dan masih berlaku. Bahasa Indonesia tidak menandai aspek ini secara wajib; bentuk kini mempertahankan daya doa tanpa menutup kemungkinan nuansa perfekt.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya Yahweh” menandai vokatif; kapitalisasi pronomina ilahi dipakai secara konsisten. Dua imperatif Ibrani dibedakan sebagai “Selamatkanlah” dan “lepaskanlah”.
