  text: Yahweh, Allahku, jika aku telah melakukan hal ini, jika ada ketidakadilan di kedua tanganku[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesalahan pada kedua tanganku”; ungkapan Ibrani ini dapat menunjuk pada kesalahan moral atau perbuatan yang membuat seseorang bersalah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, sesuai bentuk Ibrani dan tanpa menggantinya dengan gelar.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk dengan sufiks orang pertama tunggal berarti “Allahku”; dalam konteks ini merupakan sapaan langsung kepada Allah Israel.
- source_word: אִם
  choice: jika
  rationale: Memperkenalkan rangkaian pengandaian dalam pernyataan bersumpah tentang ketidakbersalahan pemazmur.
- source_word: עָשִׂיתִי זֹאת
  choice: aku telah melakukan hal ini
  rationale: Menerjemahkan verba perfek orang pertama tunggal beserta kata tunjuk; “telah melakukan” menghubungkan tindakan lampau dengan tuduhan yang sedang dihadapi.
- source_word: יֶשׁ
  choice: ada
  rationale: Padanan alami bagi partikel eksistensial Ibrani.
- source_word: עָוֶל
  choice: ketidakadilan
  rationale: Menjaga nuansa perbuatan salah, ketidakbenaran, atau penyimpangan moral sekaligus nada yudisial mazmur.
- source_word: בְּכַפָּי
  choice: di tanganku
  rationale: Mempertahankan gambaran harfiah “di telapak-tanganku” dalam bentuk Indonesia yang alami; ungkapan ini menunjuk pada kesalahan atau tindakan tercela yang menjadi tanggung jawab pelaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi “Yahweh” mempertahankan fungsinya sebagai nama tanpa mengubahnya menjadi gelar.
- issue: Makna moral עָוֶל בְּכַפָּי
  choice: ketidakadilan di tanganku
  alternative: kesalahan pada tanganku
  rationale: Pilihan utama mempertahankan citra tangan dan nuansa yudisial, tanpa membatasi ungkapan itu hanya pada satu jenis kesalahan moral.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Urutan sapaan serta pengulangan “jika” dipertahankan untuk menjaga struktur pengandaian dan ketegangan retoris teks Ibrani; tanda pisah menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
