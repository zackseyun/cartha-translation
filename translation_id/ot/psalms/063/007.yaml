source:
  edition: WLC
  text: כִּֽי הָיִ֣יתָ עֶזְרָ֣תָ/ה לִּ֑/י וּ/בְ/צֵ֖ל כְּנָפֶ֣י/ךָ אֲרַנֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/007.yaml
  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: id
  text: Sebab Engkau telah menjadi pertolonganku, dan dalam naungan sayap-Mu aku bersorak-sorai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku bernyanyi dengan sukacita.” Kata kerja Ibrani ini dapat menyatakan seruan nyaring penuh sukacita maupun nyanyian gembira.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan konteks sebelumnya sebagai alasan bagi tanggapan pemazmur; “sebab” mempertahankan hubungan kausal itu secara alami.
- source_word: הָיִיתָ
  choice: telah menjadi
  rationale: Bentuk qatal menunjuk pada pertolongan Allah yang sudah terbukti dan tetap bermakna bagi keadaan pemazmur sekarang.
- source_word: עֶזְרָתָה לִּי
  choice: pertolonganku
  rationale: Ungkapan ini menyatakan bahwa Allah telah menjadi pertolongan bagi pemazmur. Bentuk posesif alami dalam bahasa Indonesia mempertahankan daya relasionalnya.
- source_word: וּבְצֵל
  choice: dan dalam naungan
  rationale: “Naungan” menyampaikan bayang-bayang yang memberi perlindungan tanpa menghilangkan citra puitis Ibrani.
- source_word: כְּנָפֶיךָ
  choice: sayap-Mu
  rationale: Terjemahan harfiah ini mempertahankan metafora konkret tentang perlindungan ilahi.
- source_word: אֲרַנֵּן
  choice: aku bersorak-sorai
  rationale: Bentuk Piel dari רנן menyatakan seruan nyaring penuh sukacita dan dapat pula merujuk pada nyanyian gembira. “Bersorak-sorai” mempertahankan unsur suara dan kegembiraannya.
theological_decisions:
- issue: Metafora perlindungan ilahi
  choice: Mempertahankan ungkapan “dalam naungan sayap-Mu”.
  alternative: Menguraikannya sebagai “di bawah perlindungan-Mu”.
  rationale: Teks memakai gambaran puitis yang konkret untuk menggambarkan perlindungan Allah. Mempertahankan metafora menghindari pembatasan makna pada satu penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pronomina ilahi dipakai secara konsisten; metafora Ibrani dipertahankan tanpa dibuat kaku.
