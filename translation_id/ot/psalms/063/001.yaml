  text: אֱלֹהִ֤ים אֵלִ֥/י אַתָּ֗ה אֲֽשַׁחֲ֫רֶ֥/ךָּ צָמְאָ֬ה לְ/ךָ֨ נַפְשִׁ֗/י כָּמַ֣הּ לְ/ךָ֣ בְשָׂרִ֑/י בְּ/אֶֽרֶץ צִיָּ֖ה וְ/עָיֵ֣ף בְּלִי מָֽיִם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: id
  text: Allah, Engkaulah Allahku; aku mencari-Mu saat fajar.[a] Jiwaku haus akan Engkau, ragaku merindukan Engkau[b], di tanah yang kering dan letih, tanpa air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “aku mencari-Mu pagi-pagi”, “aku mencari-Mu dengan tekun”, atau, secara lebih interpretatif, “aku mencari-Mu dengan sungguh-sungguh”. Kata kerja Ibrani ini secara harfiah memberi gambaran mencari pada waktu fajar.
    reason: lexical_alternative
  - marker: b
    text: 'Tanda baca juga dapat dipahami demikian: “Jiwaku haus akan Engkau; ragaku merindukan Engkau di tanah yang kering dan letih, tanpa air.” Dalam pembacaan ini, keterangan tempat berkaitan khusus dengan kerinduan raga.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk jamak ini berfungsi sebagai sebutan tunggal bagi Allah. Sapaan langsung dipertahankan tanpa menambahkan kata seru “ya” yang tidak terdapat dalam teks Ibrani.
- source_word: אֵלִי אַתָּה
  choice: Engkaulah Allahku
  rationale: Pronomina mandiri אַתָּה memberi penekanan. Bentuk “Engkaulah” menyampaikan penegasan itu secara alami dalam bahasa Indonesia.
- source_word: אֲשַׁחֲרֶךָּ
  choice: aku mencari-Mu saat fajar
  rationale: Bentuk Piel dari שׁחר membangkitkan gambaran mencari pada waktu fajar. Terjemahan ini mempertahankan gambaran waktunya tanpa langsung menafsirkannya sebagai kesungguhan.
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: Jiwaku haus akan Engkau
  rationale: נפשׁ dapat berarti jiwa, hidup, diri, atau pribadi. “Jiwaku” mempertahankan pasangan puitis dengan “ragaku”, sedangkan verba haus diterjemahkan secara langsung.
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: ragaku merindukan Engkau
  rationale: בשר berarti daging atau tubuh jasmani. “Ragaku” mempertahankan dimensi jasmani dan kesejajaran puitis dengan “jiwaku”, tetapi lebih alami daripada “dagingku” dalam konteks ini. כָּמַהּ menyatakan kerinduan yang kuat.
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף
  choice: di negeri yang kering dan melelahkan
  rationale: צִיָּה menyatakan kekeringan, sedangkan עָיֵף menyatakan keletihan. “Melelahkan” menyampaikan dampak negeri tersebut secara alami, sekaligus mempertahankan unsur keletihan yang akan hilang jika diterjemahkan hanya sebagai “tandus”.
- source_word: בְּלִי מָיִם
  choice: tanpa air
  rationale: Terjemahan ringkas dan langsung bagi frasa privatif Ibrani.
theological_decisions:
- issue: Bahasa antropologis dalam pasangan נפשׁ dan בשר
  choice: Mempertahankan “jiwaku” dan “ragaku” sebagai dua segi puitis dari pribadi yang utuh
  alternative: Menerjemahkan keduanya secara lebih bebas sebagai “segenap diriku” dan “tubuhku”
  rationale: Penjajaran Ibrani mengungkapkan kerinduan batin sekaligus jasmani. Pilihan ini mempertahankan tekstur sastra dan teologisnya tanpa menetapkan dualisme jiwa-tubuh yang kaku.
- issue: Cakupan frasa “di negeri yang kering dan melelahkan”
  choice: Melalui tanda baca, frasa itu dibiarkan menerangkan keseluruhan ungkapan haus dan rindu
  alternative: Mengaitkannya hanya dengan “ragaku merindukan Engkau”
  rationale: Urutan Ibrani memungkinkan keterkaitan terdekat dengan klausa kedua, tetapi secara puitis frasa lokasi itu dapat menaungi kedua ungkapan kerinduan. Ambiguitas ini dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan tanpa ungkapan yang terlalu arkais. “Engkau” dan bentuk terikat “-Mu” dipilih untuk sapaan langsung yang khidmat serta konsisten. “Raga” menjaga kesejajaran dengan “jiwa” sambil tetap mudah dipahami oleh pembaca umum.
