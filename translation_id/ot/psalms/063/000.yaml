lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah teknis dalam judul mazmur; padanan tradisional ini tepat, ringkas, dan mudah dipahami.
- source_word: לְדָוִד
  choice: Daud
  rationale: Konstruksi “Mazmur Daud” mempertahankan keluwesan relasi yang ditandai לְ, tanpa membatasi maknanya hanya pada kepengarangan atau peruntukan.
- source_word: בִּהְיוֹתוֹ
  choice: ketika ia berada
  rationale: Ungkapan ini menerjemahkan konstruksi temporal secara alami dalam bahasa Indonesia.
- source_word: בְּמִדְבַּר
  choice: di padang belantara
  rationale: מִדְבָּר dapat menunjuk kawasan liar, stepa, atau gurun; “padang belantara” menjaga cakupan yang lebih luas daripada sekadar kondisi iklim gurun.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama wilayah dipertahankan dalam bentuk Indonesia yang lazim.
theological_decisions:
- issue: Makna judul yang mengaitkan mazmur dengan Daud
  choice: Mazmur Daud
  alternative: Mazmur karya Daud; Mazmur untuk Daud
  rationale: Preposisi לְ dalam judul mazmur dapat menyatakan kepengarangan, kepemilikan, peruntukan, atau hubungan. Teks utama tidak memaksakan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk judul dibuat alami, sementara ambiguitas Ibrani dan alternatif geografis dijelaskan melalui catatan kaki.
