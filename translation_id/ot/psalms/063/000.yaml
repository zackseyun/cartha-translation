  text: A psalm of David[a], when he was in the wilderness[b] of Judah.
translation:
  language: id
  text: Mazmur Daud[a], ketika ia berada di padang belantara[b] Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Mazmur karya Daud” atau “Mazmur untuk Daud”; judul Ibrani dapat menunjukkan kepengarangan, peruntukan, atau hubungan dengan Daud.
