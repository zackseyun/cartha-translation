  text: When I remember you on my bed, I meditate on you in the night watches.
translation:
  language: id
  text: Ketika aku mengingat Engkau di tempat tidurku, aku merenungkan Engkau pada waktu-waktu jaga malam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Ketika
  rationale: Walaupun bentuk dasarnya sering berarti 'jika', dalam konteks ini אִם memperkenalkan keadaan yang berulang atau bersifat temporal; 'ketika' menghasilkan bahasa Indonesia yang alami tanpa menjadikannya syarat hipotetis.
- source_word: יְצוּעָי
  choice: tempat tidurku
  rationale: Nomina ini menunjuk pada tempat pembaringan atau ranjang; 'tempat tidurku' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בְּאַשְׁמֻרוֹת
  choice: sepanjang giliran-giliran malam
  rationale: אַשְׁמֻרוֹת secara harfiah adalah bagian-bagian malam yang dibagi menurut giliran jaga. 'Sepanjang' menyampaikan aktivitas yang berlangsung pada bagian-bagian malam, sedangkan 'giliran-giliran malam' mempertahankan citra pembagian waktu malam.
- source_word: אֶהְגֶּה
  choice: aku merenungkan
  rationale: Kata הגה dapat mencakup bergumam, memperkatakan dengan lirih, atau merenungkan. Dalam konteks perenungan malam, 'merenungkan' menyampaikan makna utama dengan alami, tanpa menambahkan objek atau isi yang tidak disebutkan.
theological_decisions:
- issue: Hubungan antara mengingat Allah dan merenungkan-Nya
  choice: 'Mempertahankan dua tindakan yang berkaitan tetapi berbeda: ''mengingat'' dan ''merenungkan''.'
  alternative: Menyatukannya sebagai satu tindakan batin, misalnya 'aku terus memikirkan Engkau'.
  rationale: Teks Ibrani memakai dua verba berbeda, זכר dan הגה; mempertahankan keduanya menjaga gerak puitis dan nuansa rohaninya tanpa mempersempit makna.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi 'Engkau' dipakai sebagai penghormatan ketika merujuk kepada Allah. Pengulangan 'Engkau' dipertahankan sesuai paralelisme teks sumber.
