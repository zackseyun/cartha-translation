  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: id
  text: Demikianlah aku telah memandang-Mu di tempat kudus[a], untuk melihat kuasa-Mu dan kemuliaan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Demikianlah, di tempat kudus aku telah melihat-Mu.”'
    reason: Urutan frasa dan pilihan verba ini sama-sama dimungkinkan oleh bahasa Ibrani dan menonjolkan tempat terjadinya pengalaman tersebut.
lexical_decisions:
- source_word: כֵּן
  choice: Demikianlah
  rationale: Kata ini berfungsi secara adverbial sebagai “demikian/begitulah” dan menghubungkan kerinduan pemazmur dengan pengalamannya memandang Allah dalam ibadah, tanpa memperjelas hubungan logisnya secara berlebihan.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Dalam konteks ibadah, frasa ini paling wajar menunjuk pada tempat kudus atau tempat ibadah, meskipun קֹדֶשׁ juga dapat berarti “kekudusan” secara abstrak.
- source_word: חֲזִיתִיךָ
  choice: aku telah memandang-Mu
  rationale: חזה menyatakan tindakan melihat yang dapat mengandung unsur pengamatan atau perenungan. Bentuk perfektifnya diwakili dengan “telah”, sementara “memandang” mempertahankan nuansa yang lebih mendalam daripada sekadar melihat.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Infinitif ini menyatakan tujuan. Terjemahan harfiah “untuk melihat” juga mempertahankan pengulangan puitis dua verba penglihatan dalam bahasa sumber.
- source_word: עֻזְּךָ
  choice: kuasa-Mu
  rationale: עֹז dapat berarti kekuatan, keperkasaan, atau kuasa. “Kuasa” jelas dan alami ketika dipasangkan dengan kemuliaan Allah.
- source_word: וּכְבוֹדֶךָ
  choice: dan kemuliaan-Mu
  rationale: Dalam rujukan kepada Allah, כָּבוֹד paling tepat diterjemahkan “kemuliaan”, yang menyampaikan keagungan-Nya yang berbobot dan nyata.
theological_decisions:
- issue: Makna pemazmur memandang Allah di tempat kudus
  choice: Teks menyatakan secara langsung bahwa pemazmur telah memandang Allah di tempat kudus untuk melihat kuasa dan kemuliaan-Nya, tanpa menjelaskan hakikat pengalaman itu.
  alternative: Pernyataan ini dapat dipahami sebagai kenangan akan pengalaman ibadah atau sebagai pengalaman penglihatan yang lebih mistis.
  rationale: Bahasa Ibrani memakai verba penglihatan biasa dalam konteks tempat kudus. Terjemahan mempertahankan objek langsung “Engkau” dan ketegangan puitis-teologisnya, tanpa menyimpulkan bahwa pemazmur melihat hakikat ilahi secara langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Pengulangan “memandang” dan “melihat” dipertahankan karena mencerminkan dua verba penglihatan dalam teks Ibrani.
