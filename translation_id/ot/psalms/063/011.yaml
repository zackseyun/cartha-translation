  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: id
  text: Namun, raja akan bersukacita dalam Allah; setiap orang yang bersumpah demi Dia akan bermegah,[a] sebab mulut orang-orang yang berkata dusta akan dibungkam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan berbangga.” Kata Ibrani ini dapat berarti bermegah atau berbangga.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mulut orang-orang yang berkata dusta akan ditutup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Namun, raja
  rationale: Konjungsi וְ secara dasar berarti “dan”, tetapi di sini menandai kontras dengan nasib para penentang pada ayat sebelumnya; “Namun” menyampaikan alur itu secara alami.
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: akan bersukacita dalam Allah
  rationale: Bentuk imperfek menyatakan sukacita yang akan dialami, sedangkan ב menandai Allah sebagai objek atau dasar sukacita.
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: setiap orang yang bersumpah demi Dia
  rationale: Ungkapan partisipial ini menunjuk kepada setiap orang yang mengucapkan sumpah dengan memanggil Allah sebagai saksi; kata ganti paling wajar merujuk kepada Allah.
- source_word: יִתְהַלֵּל
  choice: akan bermegah
  rationale: Bentuk Hitpael dari הלל di sini berarti bermegah atau berbangga; “bermegah” mempertahankan nuansa kehormatan dan sukacita tanpa menyiratkan kesombongan semata.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya.
- source_word: יִסָּכֵר פִּי דֹבְרֵי שָׁקֶר
  choice: mulut orang-orang yang berkata dusta akan dibungkam
  rationale: Terjemahan ini mempertahankan gambaran tunggal kolektif “mulut” dalam bahasa Ibrani serta konstruksi verbal “berkata dusta”; “dibungkam” menyampaikan keadaan pasif tertutup atau terhenti secara alami.
theological_decisions:
- issue: Identitas “raja”
  choice: Mempertahankan sebutan “raja” tanpa penjelasan tambahan.
  alternative: Menentukan bahwa raja itu secara khusus adalah Daud atau menafsirkannya secara langsung sebagai raja Mesianik.
  rationale: Ayat menyebut “raja” tetapi tidak mengidentifikasinya lebih jauh dalam kalimat ini. Terjemahan tidak memasukkan penafsiran teologis yang melampaui teks.
- issue: Acuan kata ganti dalam בּוֹ
  choice: Kata “Dia” merujuk kepada Allah.
  alternative: Kata ganti itu merujuk kepada raja.
  rationale: Allah adalah anteseden eksplisit yang paling dekat, dan bersumpah demi Allah merupakan ungkapan alkitabiah yang lazim. Meskipun struktur gramatikal memungkinkan pertanyaan tentang acuannya, konteks paling kuat mendukung Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Namun” memperjelas kontras antarayat; “demi Dia” memakai huruf kapital karena acuannya dipahami sebagai Allah. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
