  source_fidelity: 'Teks Indonesia dengan akurat mencerminkan unsur-unsur Ibrani: כֵּן sebagai penghubung resultatif (“Demikianlah”), אֲבָרֶכְךָ sebagai “aku akan memberkati Engkau,” בְּחַיָּי dalam arti duratif (“seumur hidupku”), dan tindakan mengangkat tangan dalam nama Allah. Tidak ada penyempitan makna yang tidak perlu.'
