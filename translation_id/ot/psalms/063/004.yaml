  terminology: Kapitalisasi pronomina ilahi konsisten dengan register Alkitab Indonesia. “Dalam nama-Mu” mempertahankan keluasan fungsi בְּשִׁמְךָ tanpa memaksakan arti instrumental atau invokatif tertentu. Catatan kaki secara tepat menjelaskan alternatif “memuji Engkau” sambil menandai bentuk Ibrani yang lebih harfiah.
