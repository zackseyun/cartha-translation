source:
  edition: WLC
  text: כֵּ֣ן אֲבָרֶכְ/ךָ֣ בְ/חַיָּ֑/י בְּ֝/שִׁמְ/ךָ אֶשָּׂ֥א כַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: id
  text: Demikianlah aku akan memberkati Engkau seumur hidupku[a]; dalam nama-Mu aku akan mengangkat tanganku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memuji Engkau.” Secara lebih harfiah, bahasa Ibrani mengatakan “memberkati Engkau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Demikianlah
  rationale: Kata ini menghubungkan ikrar pemazmur dengan ayat sebelumnya dan menyatakan hasil atau tanggapan; “Demikianlah” alami dan cukup luhur dalam konteks puisi.
- source_word: אֲבָרֶכְךָ
  choice: aku akan memberkati Engkau
  rationale: Bentuk piel dari ברך secara langsung berarti “memberkati.” Ketika diarahkan kepada Allah, maknanya mendekati memuji, tetapi terjemahan utama mempertahankan ungkapan Ibrani yang khas.
- source_word: בְחַיָּי
  choice: seumur hidupku
  rationale: Secara harfiah “dalam hidupku,” tetapi dalam konteks ini frasa tersebut menyatakan durasi sepanjang hidup; “seumur hidupku” menyampaikan makna itu dengan ringkas dan alami.
- source_word: בְּשִׁמְךָ
  choice: dalam nama-Mu
  rationale: Preposisi ב dapat menunjukkan lingkup, dasar, atau penyeruan. “Dalam nama-Mu” mempertahankan keluasan makna tersebut tanpa menentukan satu nuansa saja.
- source_word: אֶשָּׂא
  choice: aku akan mengangkat
  rationale: נשא berarti mengangkat atau meninggikan; bersama “tangan,” kata ini menggambarkan sikap doa atau pujian.
- source_word: כַפָּי
  choice: tanganku
  rationale: כף secara khusus dapat berarti telapak tangan, tetapi dalam ungkapan ini bahasa Indonesia secara wajar memakai “tangan.” Bentuk Ibraninya berjumlah dua, sedangkan nomina Indonesia tanpa reduplikasi dapat mencakup kedua tangan.
theological_decisions:
- issue: Bahasa ibadah kepada Allah dalam ברך
  choice: Mempertahankan “memberkati Engkau” dalam teks utama.
  alternative: “memuji Engkau”
  rationale: Kata Ibraninya secara eksplisit adalah ברך. Walaupun “memuji” lebih lazim bagi pembaca Indonesia ketika tindakan diarahkan kepada Allah, pilihan itu lebih interpretatif; karena itu ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis-luhur. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Susunan paralel kedua klausa dipertahankan.
