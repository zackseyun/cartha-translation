  text: כְּמ֤וֹ חֵ֣לֶב וָ֭/דֶשֶׁן תִּשְׂבַּ֣ע נַפְשִׁ֑/י וְ/שִׂפְתֵ֥י רְ֝נָנ֗וֹת יְהַלֶּל פִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: id
  text: Jiwaku kenyang seperti oleh lemak dan makanan berlimpah[a]; dengan bibir yang bersorak-sorai mulutku memuji-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti dengan lemak dan kelimpahan.” Kedua kata ini membangkitkan gambaran makanan pilihan dan berlimpah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan bibir sorak-sorai,” atau “dengan bibir seruan sukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ
  choice: seperti menikmati
  rationale: Kata ini memperkenalkan perbandingan. Penambahan verba ‘menikmati’ membuat gambaran makanan wajar dalam bahasa Indonesia tanpa mengubah inti perbandingannya.
- source_word: חֵלֶב וָדֶשֶׁן
  choice: lemak dan santapan yang kaya
  rationale: ‘Lemak’ mempertahankan gambaran konkret חֵלֶב, sedangkan ‘santapan yang kaya’ mengungkapkan kelimpahan dan kemewahan yang terkandung dalam דֶּשֶׁן tanpa menghasilkan pasangan kata yang kaku.
- source_word: תִּשְׂבַּע
  choice: kenyang
  rationale: Pilihan ini mempertahankan metafora makan dan tidak memakai penanda waktu eksplisit, sehingga nuansa kini, kebiasaan, atau mendatang dari bentuk imperfek Ibrani tetap terbuka.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Dalam konteks kerinduan batin kepada Allah, ‘jiwaku’ merupakan padanan puitis yang alami, meskipun נֶפֶשׁ juga dapat menunjuk diri atau kehidupan seseorang.
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: dengan bibir yang bersorak-sorai
  rationale: Ungkapan ini mempertahankan citra ‘bibir’ dan unsur seruan sukacita dalam רְנָנוֹת; catatan kaki mencatat bentuk harfiahnya.
- source_word: יְהַלֶּל
  choice: memuji-Mu
  rationale: Objek tidak dinyatakan dalam klausa Ibrani, tetapi Allah jelas menjadi pihak yang disapa dalam konteks mazmur. Akhiran ‘-Mu’ membuat bahasa Indonesia alami.
- source_word: פִּי
  choice: mulutku
  rationale: Padanan konkret ini mempertahankan kesejajaran puitis antara mulut dan bibir.
theological_decisions:
- issue: Objek tersirat dari pujian
  choice: memuji-Mu
  alternative: memuji
  rationale: Teks Ibrani tidak menyebut objek secara eksplisit, tetapi konteks sapaan langsung kepada Allah membuat rujukannya jelas; penyebutan ‘-Mu’ tidak menambahkan klaim teologis baru.
- issue: Aspek bentuk imperfek puitis
  choice: 'Tidak memakai penanda waktu eksplisit: ‘kenyang’ dan ‘memuji’'
  alternative: ‘akan kenyang’ dan ‘akan memuji’, atau ‘dipuaskan’ dan ‘memuji’ dalam arti kini
  rationale: Imperfek Ibrani dapat menyatakan tindakan mendatang, berlangsung, atau kebiasaan. Bahasa Indonesia tanpa ‘akan’ mempertahankan sebagian keluwesan aspek tersebut.
translation_notes:
  register: Bahasa puitis modern dan bermartabat. ‘Santapan yang kaya’ dipakai agar citra kelimpahan makanan dapat dipahami pembaca masa kini, sementara ‘lemak’ mempertahankan gambaran konkret Ibrani. Susunan klausa dibuat alami dalam bahasa Indonesia tanpa menghapus kesejajaran antara jiwa, mulut, dan bibir.
