  text: They will be given over to the power of the sword[b][a]; they will become a portion for foxes.
translation:
  language: id
  text: Mereka akan diserahkan kepada pedang[b]; mereka akan menjadi jatah bagi rubah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jakal.” Kata Ibrani שֻׁעָלִים biasanya berarti rubah, tetapi sebagian memahaminya lebih luas sebagai hewan sejenis anjing dalam konteks medan pertempuran atau tempat tandus.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Mereka akan mencurahkan dia kepada/dengan perantaraan pedang.” Teks Ibrani memakai objek tunggal “dia” dalam klausa pertama, lalu subjek jamak “mereka” dalam klausa kedua; hubungan gramatikalnya sulit dipastikan.
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: mereka akan diserahkan
  rationale: Bentuk Ibrani secara harfiah menggambarkan tindakan ‘membuat dia mengalir/tercurah’ dan memuat objek tunggal ‘dia’, sedangkan klausa berikutnya memakai subjek jamak. Bentuk pasif ini menyampaikan akibat kematian oleh pedang secara wajar dalam bahasa Indonesia tanpa membuat ‘mereka’ seolah-olah menunjuk kepada para pelaku; bentuk harfiahnya dipertahankan dalam catatan.
- source_word: עַל יְדֵי חָרֶב
  choice: kepada kuasa pedang
  rationale: Ungkapan ini menyatakan penyerahan kepada daya atau kekuasaan pedang, bukan tangan secara harfiah. Pilihan ini alami dan tetap mempertahankan personifikasi puitis pedang.
- source_word: מְנָת
  choice: bagian
  rationale: Kata ini berarti bagian atau jatah yang diperuntukkan bagi seseorang atau sesuatu; ‘bagian’ jelas dan sesuai dengan gaya puisi.
- source_word: שֻׁעָלִים
  choice: rubah
  rationale: Makna leksikal lazimnya adalah rubah, tetapi istilah ini dapat dipahami lebih luas sebagai canid liar dan dalam konteks kematian atau kehancuran sering diterjemahkan ‘jakal’; alternatif itu dicatat.
- source_word: יִהְיוּ
  choice: mereka akan menjadi
  rationale: Dalam konteks ini, היה menyatakan keadaan yang dihasilkan sesudah kematian mereka, sehingga ‘akan menjadi’ lebih tepat daripada sekadar ‘akan ada’.
