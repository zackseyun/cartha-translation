  text: My soul clings to you[b][a]; your right hand upholds me.
translation:
  language: id
  text: Jiwaku melekat pada-Mu[a]; tangan kanan-Mu menopang aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Harfiah, “Jiwaku melekat di belakang-Mu.” Frasa Ibrani ini juga dapat menyatakan bahwa jiwaku mengikuti-Mu dari dekat atau berpaut erat kepada-Mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: melekat
  rationale: Kata דבק menyatakan keadaan menempel erat atau berpaut kuat. Bentuk lampau Ibrani di sini paling wajar dipahami sebagai keadaan yang sedang berlangsung dalam konteks puisi.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Kata נֶפֶשׁ dapat menunjuk pada jiwa, hidup, diri, atau seluruh pribadi. 'Jiwaku' mempertahankan ungkapan puitis dan kedalaman personal tanpa menetapkan doktrin antropologis tertentu.
- source_word: אַחֲרֶיךָ
  choice: pada-Mu
  rationale: Secara harfiah berarti 'di belakang-Mu' atau 'mengikuti-Mu'. Dalam konstruksi dengan דבק, 'melekat pada-Mu' merupakan ungkapan Indonesia yang alami, sedangkan citra mengikuti dari dekat dipertahankan dalam catatan kaki.
- source_word: בִּי
  choice: aku
  rationale: Preposisi ב dengan akhiran orang pertama berfungsi sebagai pelengkap personal bagi verba berikutnya; 'menopang aku' menyampaikan maknanya secara alami.
- source_word: תָּמְכָה
  choice: menopang
  rationale: Kata תמך berarti menyangga, menopang, atau meneguhkan. 'Menopang' mempertahankan gambaran konkret dan cocok dengan keadaan berkelanjutan dalam konteks.
- source_word: יְמִינֶךָ
  choice: tangan kanan-Mu
  rationale: Terjemahan harfiah ini mempertahankan gambaran konkret Alkitab tentang kekuatan, perlindungan, dan pertolongan Allah.
theological_decisions:
- issue: Nuansa antropologis נַפְשִׁי
  choice: jiwaku
  alternative: diriku; hidupku; aku
  rationale: '''Jiwaku'' mempertahankan bobot puitis dan rohani teks tanpa menyimpulkan bahwa ayat ini sedang mengajarkan pembagian teknis antara jiwa dan tubuh.'
- issue: Bahasa antropomorfis tentang tangan kanan Allah
  choice: tangan kanan-Mu
  alternative: kuasa-Mu; kekuatan-Mu
  rationale: Metafora konkret dalam bahasa Ibrani dipertahankan dan tidak diubah menjadi penafsiran abstrak.
- issue: Hubungan antara keterikatan dan tindakan mengikuti dalam דבק אחרי
  choice: melekat pada-Mu dengan alternatif harfiah dijelaskan dalam catatan kaki
  alternative: melekat mengikuti-Mu; mengikuti-Mu dengan erat
  rationale: Teks Ibrani memadukan verba 'melekat' dengan preposisi 'sesudah/di belakang'. Terjemahan utama dibuat alami dalam bahasa Indonesia, sementara ambiguitas antara keterikatan dan mengikuti dari dekat tetap tersedia bagi pembaca.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk sapaan ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Susunan dua klausa dan gambaran konkret bahasa Ibrani dipertahankan.
