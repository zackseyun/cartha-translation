  text: For your steadfast love is better than life[a]; my lips will praise you.
translation:
  language: id
  text: Sebab kasih setia-Mu[a] lebih baik daripada hidup; bibirku akan memuji-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih yang teguh” atau “kasih perjanjian.” Kata Ibrani חֶסֶד menunjuk pada kasih, kebaikan, dan kesetiaan yang teguh, sering kali dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pujian pada klausa berikutnya dan mempertahankan hubungan sebab-akibat secara alami dalam bahasa Indonesia.
- source_word: טוֹב ... מֵחַיִּים
  choice: lebih baik daripada hidup
  rationale: Adjektiva טוֹב bersama preposisi perbandingan מִן menyatakan perbandingan. Bentuk jamak חַיִּים secara idiomatis menunjuk pada hidup atau kehidupan.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: Ungkapan Indonesia ini mencakup kasih, kebaikan, dan kesetiaan yang terkandung dalam חֶסֶד tanpa membatasinya secara berlebihan pada satu nuansa.
- source_word: שְׂפָתַי
  choice: bibirku
  rationale: Citra tubuh yang konkret dalam puisi Ibrani dipertahankan, alih-alih diabstraksikan menjadi perkataan atau ucapan.
- source_word: יְשַׁבְּחוּנְךָ
  choice: akan memuji-Mu
  rationale: Bentuk piel dari שׁבח berarti memuji atau menyanjung; bentuk mendatang ini alami dan tetap membuka nuansa tekad dalam konteks.
theological_decisions:
- issue: Makna חֶסֶד dalam konteks penyembahan
  choice: kasih setia
  alternative: belas kasihan; kasih perjanjian; kemurahan
  rationale: Kasih setia menyampaikan kasih dan loyalitas Allah yang teguh tanpa menjadikan gagasan perjanjian—yang tersirat dalam banyak pemakaian kata ini—sebagai unsur eksplisit yang tidak dinyatakan langsung dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. Bentuk pronomina ilahi memakai huruf kapital sesuai kebiasaan penulisan religius Indonesia. Tanda catatan kaki ditempatkan sesudah klausa terkait.
