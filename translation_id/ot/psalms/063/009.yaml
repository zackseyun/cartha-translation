  source_fidelity: Frasa Ibrani menyatakan bahwa para lawan mengincar kehidupan pemazmur demi kebinasaannya, lalu akan masuk ke tempat-tempat/kedalaman bumi. Draf cukup dekat, tetapi “berusaha membinasakan” menggeser fokus dari tindakan mencari atau mengincar kepada upaya melakukan pembinasaan, dan “akan turun” lebih eksplisit daripada verba יָבֹאוּ (“akan datang/masuk”).
  naturalness: “Mengincar nyawaku untuk membinasakannya” adalah bahasa Indonesia baku yang jelas dan mempertahankan unsur pengejaran bermusuhan. “Akan masuk ke kedalaman bumi” juga puitis dan alami tanpa menambahkan arah gerak secara berlebihan.
  terminology: “Nyawa” tepat bagi נַפְשִׁי dalam konteks ancaman maut. “Kedalaman bumi” mempertahankan citra puitis tanpa menetapkannya sebagai istilah teknis untuk alam orang mati.
  issues:
