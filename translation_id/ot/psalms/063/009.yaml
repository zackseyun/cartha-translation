lexical_decisions:
- source_word: וְהֵמָּה
  choice: Namun mereka
  rationale: Kata ganti itu bersifat tegas, sedangkan waw paling wajar dipahami sebagai pertentangan dengan keyakinan pemazmur pada ayat sebelumnya.
- source_word: לְשׁוֹאָה יְבַקְשׁוּ נַפְשִׁי
  choice: yang berusaha membinasakan nyawaku
  rationale: נֶפֶשׁ di sini berarti nyawa atau kehidupan pemazmur, bukan jiwa sebagai unsur nonjasmani. Frasa tujuan dengan שׁוֹאָה menyatakan kehancuran yang mereka kehendaki; susunan ini alami dalam bahasa Indonesia tanpa menentukan cara pembinasaannya.
- source_word: יָבֹאוּ
  choice: akan turun
  rationale: Secara harfiah verba ini berarti 'akan datang/masuk', tetapi tujuan yang berada di bagian terdalam bumi menyiratkan gerak turun. Pilihan ini menghasilkan ungkapan Indonesia yang wajar sambil mempertahankan citra penurunan.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: ke bagian-bagian terdalam bumi
  rationale: Ungkapan ini menunjuk pada bagian bawah atau kedalaman bumi. Terjemahan tersebut mempertahankan gambaran puitis tanpa secara khusus menjadikannya istilah teknis bagi dunia orang mati.
theological_decisions:
- issue: Makna turun ke bagian-bagian terdalam bumi
  choice: Mempertahankannya sebagai gambaran puitis tentang kematian, kubur, atau direndahkan dalam penghukuman
  alternative: Memahaminya secara lebih harfiah sebagai bagian-bagian bawah bumi atau secara khusus sebagai dunia orang mati/Syeol
  rationale: Bahasa Ibrani memungkinkan nuansa-nuansa tersebut. Terjemahan tidak mengubahnya menjadi ajaran teknis tentang alam baka, sehingga ketegangan dan keluasan citranya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern, puitis namun mudah dipahami. 'Nyawaku' menyampaikan נַפְשִׁי secara konkret dalam konteks ancaman pembunuhan. Penanda catatan kaki [a] ditempatkan sesudah frasa yang diterangkannya.
