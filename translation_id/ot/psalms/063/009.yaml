translation:
  language: id
  text: Namun, mereka yang mengincar nyawaku untuk membinasakannya akan masuk ke kedalaman bumi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke bagian-bagian bawah bumi.”
