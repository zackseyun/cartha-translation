  text: Then they cried out to Yahweh in their trouble[a]; he delivered them from their distresses.
translation:
  language: id
  text: Lalu mereka berseru kepada Yahweh dalam kesesakan mereka; Ia melepaskan mereka dari berbagai himpitan yang mereka alami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari kesesakan mereka.” Teks Ibrani memakai bentuk jamak, yang dapat menunjuk pada berbagai tekanan atau kesusahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Lalu mereka berseru
  rationale: Bentuk wayyiqtol melanjutkan rangkaian peristiwa, sehingga “lalu” menyatakan urutan secara alami. “Berseru” menangkap permohonan mendesak dalam konteks kesesakan.
- source_word: אֶל־יְהוָה
  choice: kepada Yahweh
  rationale: אֶל menyatakan arah seruan, sedangkan nama ilahi יהוה dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: בַּצַּר לָהֶם
  choice: dalam kesesakan mereka
  rationale: צַר menunjuk pada keadaan sempit, susah, atau tertekan. “Dalam kesesakan mereka” ringkas, bermartabat, dan mempertahankan gambaran keadaan yang menekan.
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: dari segala himpitan mereka
  rationale: מְצוּקוֹת adalah bentuk jamak yang menggambarkan berbagai tekanan atau kesesakan. “Segala himpitan” menyampaikan kemajemukan itu secara lebih alami daripada pengulangan “himpitan-himpitan”.
- source_word: יַצִּילֵם
  choice: Dia melepaskan mereka
  rationale: Bentuk Hifil dari נצל berarti menyelamatkan, membebaskan, atau melepaskan dari bahaya. “Melepaskan” cocok dengan gambaran himpitan dan mengikuti urutan peristiwa lampau dalam syair.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi dalam teks tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Paralelisme antara “kesesakan” dan “segala himpitan” dipertahankan tanpa memakai bentuk jamak ulang yang terasa kaku.
