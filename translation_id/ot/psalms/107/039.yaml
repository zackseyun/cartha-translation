  text: Then they were diminished and brought low through oppression[a], calamity, and sorrow.
translation:
  language: id
  text: Kemudian mereka menjadi sedikit dan tertunduk karena penindasan[a], malapetaka, dan dukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kemudian mereka berkurang dan tertunduk akibat pengekangan, kemalangan, dan kesedihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: jumlah mereka berkurang
  rationale: Bentuk Qal wayyiqtol jamak dari מעט menyatakan menjadi sedikit atau berkurang. Pilihan ini menyampaikan pengurangan jumlah secara alami dalam bahasa Indonesia tanpa memaksakan nuansa pasif.
- source_word: וַיָּשֹׁחוּ
  choice: mereka direndahkan
  rationale: Kata ini menggambarkan keadaan membungkuk atau menjadi rendah. Dalam konteks kemerosotan dan penderitaan, 'direndahkan' mempertahankan nuansa keadaan sosial atau eksistensial tanpa membatasinya pada postur tubuh.
- source_word: מֵעֹצֶר
  choice: karena penindasan
  rationale: עֹצֶר dapat berarti pengekangan atau tekanan yang menindas, sedangkan מִן di sini wajar dipahami sebagai penyebab. 'Karena penindasan' jelas dan sesuai dengan konteks penderitaan.
- source_word: רָעָה
  choice: malapetaka
  rationale: Dalam konteks ini רָעָה menunjuk pada kesusahan atau bencana, bukan secara khusus kejahatan moral. 'Malapetaka' mempertahankan bobot puitis dan beratnya kemalangan.
- source_word: וְיָגוֹן
  choice: dan dukacita
  rationale: יָגוֹן berarti kesedihan atau dukacita. 'Dukacita' merupakan ungkapan Indonesia yang bermartabat dan cocok dengan larik puitis ini.
