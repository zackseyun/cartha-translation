  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם וּֽ֝/מִ/מְּצֽוּקֹתֵי/הֶ֗ם יוֹצִיאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/028.yaml
  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: id
  text: Lalu mereka berseru kepada Yahweh dalam kesesakan mereka, dan Ia membawa mereka keluar dari tekanan yang mereka alami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Lalu mereka berseru
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi dan pola berulang mazmur ini; “berseru” menyampaikan permohonan mendesak untuk pertolongan.
- source_word: אֶל־יְהוָה
  choice: kepada Yahweh
  rationale: אֶל menyatakan arah seruan, sedangkan nama perjanjian יהוה dipertahankan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: בַּצַּר לָהֶם
  choice: dalam kesesakan mereka
  rationale: Secara harfiah konstruksi ini berarti “dalam kesesakan bagi mereka”; ungkapan Indonesia yang wajar ialah “dalam kesesakan mereka”.
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  choice: dari himpitan-himpitan mereka
  rationale: מְצוּקוֹת adalah bentuk jamak yang menggambarkan tekanan, keadaan terjepit, atau kesesakan; “himpitan-himpitan” mempertahankan bentuk jamak serta citra konkret yang berbeda dari צַר.
- source_word: יוֹצִיאֵם
  choice: Ia membawa mereka keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar; pilihan ini mempertahankan gambaran konkret teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ia” memakai huruf kapital sebagai rujukan hormat kepada Allah. Kesejajaran antara “kesesakan” dan “himpitan-himpitan” dipertahankan tanpa menyamakan kedua istilah Ibrani.
