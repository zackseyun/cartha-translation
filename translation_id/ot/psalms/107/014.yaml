  yaml_path: translation/ot/psalms/107/014.yaml
  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
translation:
  language: id
  text: Ia membawa mereka keluar dari kegelapan dan bayang-bayang maut[a], lalu memutuskan belenggu mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kegelapan yang pekat.” Kata Ibrani צַלְמָוֶת dapat berarti bayang-bayang maut atau kegelapan yang sangat pekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: Ia membawa mereka keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar. Bentuk lampau dalam bahasa Indonesia sesuai dengan rangkaian tindakan penyelamatan yang dikisahkan dalam konteks mazmur ini.
- source_word: מֵחֹשֶׁךְ
  choice: dari kegelapan
  rationale: חֹשֶׁךְ adalah istilah umum untuk kegelapan, dan preposisi מִן secara langsung tercermin dalam kata 'dari'.
- source_word: וְצַלְמָוֶת
  choice: dan bayang-bayang maut
  rationale: צַלְמָוֶת dapat dipahami sebagai 'bayang-bayang maut' atau 'kegelapan yang pekat'. Pilihan utama mempertahankan gambaran bahaya maut yang wajar dalam konteks, sedangkan kemungkinan leksikal lainnya dicatat dalam catatan kaki.
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: belenggu mereka
  rationale: מוֹסְרוֹת menunjuk pada ikatan, belenggu, atau alat pengekang. 'Belenggu' alami dalam bahasa Indonesia dan cocok dengan gambaran pembebasan dari penjara.
- source_word: יְנַתֵּק
  choice: memutuskan
  rationale: Bentuk Piel dari נתק menyatakan pemisahan atau pemutusan dengan tenaga. 'Memutuskan belenggu' merupakan ungkapan Indonesia yang alami dan tetap menyampaikan tindakan pembebasan yang kuat.
theological_decisions:
- issue: Makna צַלְמָוֶת
  choice: bayang-bayang maut
  alternative: kegelapan yang pekat
  rationale: Kata ini dapat membangkitkan gambaran ancaman maut atau menunjuk pada kegelapan yang sangat pekat. Teks utama mempertahankan gambaran tradisional yang masih dapat dipertanggungjawabkan, sementara catatan kaki menjaga ambiguitas leksikalnya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa mengurangi kesejajaran dua tindakan ilahi: membawa keluar dan memutuskan belenggu.'
