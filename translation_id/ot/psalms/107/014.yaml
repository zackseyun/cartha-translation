  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan unsur-unsur Ibrani: יוֹצִיאֵם sebagai tindakan membawa keluar, מֵחֹשֶׁךְ sebagai ''dari kegelapan,'' צַלְמָוֶת sebagai ''bayang-bayang maut,'' serta וּמוֹסְרוֹתֵיהֶם יְנַתֵּק sebagai pemutusan belenggu mereka. Bentuk imperfek Ibrani dapat berfungsi dalam pengisahan puitis tindakan penyelamatan; bahasa Indonesia tidak menandai kala secara wajib, sehingga ''Ia membawa'' dan ''memutuskan'' tidak menambahkan kepastian kala yang tidak ada dalam bentuk Indonesia itu sendiri.'
