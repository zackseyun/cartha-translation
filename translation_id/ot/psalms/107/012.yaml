id: PSA.107.12
reference: Psalms 107:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּכְנַ֣ע בֶּ/עָמָ֣ל לִבָּ֑/ם כָּ֝שְׁל֗וּ וְ/אֵ֣ין עֹזֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/012.yaml
  text: So he humbled their heart with hard labor[a]; they stumbled[c][b], and there was no one to help.
translation:
  language: id
  text: Maka Ia merendahkan hati mereka dengan kerja berat[a]; mereka tersandung[b], dan tidak ada seorang pun yang menolong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui jerih payah” atau “dengan kesusahan”; kata Ibrani עָמָל dapat berarti pekerjaan yang membebani, jerih payah, atau kesengsaraan.
    reason: lexical_alternative
  - marker: b
    text: Atau “jatuh”; kata kerja Ibrani ini dapat menggambarkan tersandung maupun roboh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: Ia merendahkan
  rationale: Bentuk Hifil menyatakan tindakan kausatif, yaitu membuat rendah atau menundukkan. Subjek tersiratnya adalah Allah berdasarkan konteks, sedangkan “merendahkan” mempertahankan nuansa penghinaan atau penundukan tanpa mempersempit maknanya.
- source_word: בֶּעָמָל
  choice: dengan kerja berat
  rationale: עָמָל dapat berarti jerih payah, kesusahan, atau pekerjaan yang membebani. Dalam konteks penindasan dan pemenjaraan, “kerja berat” menyampaikan sarana konkret yang merendahkan mereka, sementara alternatif makna dicatat dalam catatan kaki.
- source_word: לִבָּם
  choice: hati mereka
  rationale: Bentuk Ibrani memakai kata “hati” tunggal dengan akhiran jamak secara kolektif. Ungkapan Indonesia “hati mereka” alami dan dapat menunjuk batin atau keberanian mereka sebagai kelompok.
- source_word: כָּשְׁלוּ
  choice: mereka tersandung
  rationale: כשל menggambarkan tersandung atau kehilangan pijakan dan dapat berujung pada jatuh. “Tersandung” mempertahankan gambaran verbal tanpa memastikan hasil yang lebih kuat.
- source_word: וְאֵין עֹזֵר
  choice: dan tidak ada seorang pun yang menolong
  rationale: Ungkapan ini menegaskan ketiadaan penolong. Terjemahan tersebut alami dalam bahasa Indonesia modern dan mempertahankan daya eksistensial konstruksi אֵין dengan partisip.
theological_decisions:
- issue: Subjek tersirat וַיַּכְנַע
  choice: Allah adalah subjek tersirat, diterjemahkan “Ia merendahkan”
  alternative: 'Bentuk pasif impersonal: “hati mereka direndahkan”'
  rationale: Konteks mazmur mengaitkan penderitaan dan pembebasan mereka dengan tindakan TUHAN. Mempertahankan verba aktif tunggal dengan subjek ilahi tersirat menjaga penekanan teologis itu tanpa menambahkan nama “TUHAN” yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. “Ia” memakai huruf kapital untuk memperjelas subjek ilahi yang tersirat dari konteks. Susunan dua klausa mempertahankan gerak puitis dari perendahan menuju ketidakberdayaan.
