  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: id
  text: Lalu mereka berseru kepada Yahweh[a] dalam kesesakan mereka; Ia menyelamatkan mereka dari himpitan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”, nama ilahi yang secara tradisional diterjemahkan “TUHAN”; dapat pula ditransliterasikan “Yahweh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Lalu mereka berseru
  rationale: Bentuk wayyiqtol melanjutkan urutan naratif sekaligus pola refrein mazmur; 'lalu' menyatakan kelanjutan itu secara alami, sedangkan 'berseru' menyampaikan seruan mendesak untuk meminta pertolongan.
- source_word: אֶל־יְהוָה
  choice: kepada Yahweh
  rationale: Preposisi אֶל menyatakan arah seruan, dan nama ilahi יהוה dipertahankan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: בַּצַּר לָהֶם
  choice: dalam kesesakan mereka
  rationale: Secara harfiah frasa ini berarti 'dalam kesesakan bagi mereka'. Bentuk posesif menghasilkan bahasa Indonesia yang wajar sambil mempertahankan keadaan genting yang dimaksud צַר.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: dari segala himpitan mereka
  rationale: '''Himpitan'' menyampaikan keadaan terjepit atau tekanan berat dan membedakannya dari צַר sebelumnya. Kata ''segala'' secara idiomatis menyatakan cakupan bentuk jamak tanpa mengubahnya menjadi satu kesulitan saja.'
- source_word: יוֹשִׁיעֵם
  choice: Ia menyelamatkan mereka
  rationale: Bentuk Hifil dari ישׁע berarti menyelamatkan atau melepaskan; 'menyelamatkan' alami dalam bahasa Indonesia dan mempertahankan nuansa tindakan penyelamatan ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar, sedangkan bentuk vokalisasi tepatnya tidak sepenuhnya pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Paralelisme antara 'kesesakan' dan 'segala himpitan' dipertahankan dengan dua istilah berbeda agar perbedaan leksikal Ibrani tetap terasa. Kapitalisasi 'Ia' mengikuti kebiasaan penghormatan yang masih mudah dipahami, tanpa menambahkan keterangan yang tidak terdapat dalam teks.
