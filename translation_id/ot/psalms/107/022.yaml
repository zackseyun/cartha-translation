  text: Let them offer sacrifices of thanksgiving[b][a], and recount his works with joyful singing.
translation:
  language: id
  text: Biarlah mereka mempersembahkan kurban syukur[a] dan menceritakan perbuatan-perbuatan-Nya dengan sorak-sorai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban-kurban ucapan syukur.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan nyanyian sukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: Biarlah mereka mempersembahkan
  rationale: Bentuk imperfek orang ketiga jamak dalam konteks ini menyatakan ajakan atau harapan. “Mempersembahkan” terdengar alami dalam bahasa Indonesia dan tetap mempertahankan konteks ibadah kurban.
- source_word: זִבְחֵי תוֹדָה
  choice: kurban syukur
  rationale: Frasa konstruksi ini menunjuk kepada kurban yang dipersembahkan sebagai ungkapan syukur. “Kurban syukur” ringkas, alami, dan cukup dekat dengan istilah kultis Ibrani.
- source_word: תוֹדָה
  choice: syukur
  rationale: Dalam konteks kurban, kata ini mengacu pada ucapan syukur atau persembahan syukur, bukan sekadar pujian secara umum.
- source_word: וִיסַפְּרוּ
  choice: dan menceritakan
  rationale: Bentuk piel dari ספר berarti menuturkan atau menceritakan. Pilihan ini alami bagi pembaca modern dan menyampaikan tindakan memberitakan karya Allah.
- source_word: מַעֲשָׂיו
  choice: perbuatan-perbuatan-Nya
  rationale: Kata ini berarti perbuatan, karya, atau tindakan. Bentuk ulang menyatakan jamak secara jelas dan cocok untuk tindakan-tindakan Allah.
- source_word: בְּרִנָּה
  choice: dengan sorak-sorai
  rationale: רִנָּה menunjuk pada seruan nyaring penuh sukacita, yang dapat berupa nyanyian. “Sorak-sorai” mempertahankan unsur bunyi dan kegembiraan tanpa membatasi maknanya hanya pada nyanyian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Biarlah” mempertahankan nuansa ajakan; “kurban” dipilih sebagai ejaan baku; akhiran hormat “-Nya” merujuk kepada Allah. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
