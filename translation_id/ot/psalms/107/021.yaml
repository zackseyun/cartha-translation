base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: id
  text: Biarlah mereka bersyukur kepada Yahweh atas kasih setia-Nya dan atas perbuatan-perbuatan-Nya yang ajaib[b] bagi umat manusia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak manusia,” yaitu manusia pada umumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan atas keajaiban-keajaiban-Nya” atau “dan atas karya-karya-Nya yang menakjubkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Biarlah mereka bersyukur
  rationale: Bentuk ini menyampaikan seruan jussif/jamak dalam refrein mazmur; dalam konteks tanggapan atas penyelamatan, ידה paling tepat berarti ‘bersyukur’.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima ucapan syukur, sedangkan nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’.
- source_word: חַסְדּוֹ
  choice: atas kasih setia-Nya
  rationale: חסד mencakup kasih, kebaikan, dan kesetiaan yang teguh. ‘Kasih setia’ merupakan padanan Indonesia yang alami dan mempertahankan kedua unsur utama itu.
- source_word: וְנִפְלְאוֹתָיו
  choice: dan atas perbuatan-perbuatan-Nya yang ajaib
  rationale: נפלאות menunjuk pada tindakan luar biasa yang membangkitkan rasa takjub; ‘perbuatan-perbuatan ... yang ajaib’ lebih konkret daripada sekadar ‘keajaiban-keajaiban’.
- source_word: לִבְנֵי אָדָם
  choice: bagi umat manusia
  rationale: Ungkapan harfiah ‘anak-anak manusia’ bersifat generik dan berarti manusia secara keseluruhan. ‘Umat manusia’ menyampaikan makna tersebut secara alami dalam bahasa Indonesia modern; ל dipahami sebagai penanda penerima/manfaat tindakan ajaib itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna generik אדם dalam ungkapan בני אדם
  choice: umat manusia
  alternative: anak-anak manusia; manusia
  rationale: Walaupun bentuk Ibraninya secara harfiah adalah ‘anak-anak manusia’, ungkapan itu bersifat generik. ‘Umat manusia’ mempertahankan cakupan universalnya tanpa menjadikannya khusus laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘Biarlah’ mempertahankan corak seruan mazmur; ‘kasih setia’ menjaga bobot teologis חסד, sedangkan ‘umat manusia’ mengungkapkan idiom Ibrani secara wajar dan inklusif.
