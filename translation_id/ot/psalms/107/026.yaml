  text: יַעֲל֣וּ שָׁ֭מַיִם יֵרְד֣וּ תְהוֹמ֑וֹת נַ֝פְשָׁ֗/ם בְּ/רָעָ֥ה תִתְמוֹגָֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/026.yaml
  text: They rose up to the heavens; they went down to the depths[a]. Their soul melted away in distress.
translation:
  language: id
  text: 'Mereka naik sampai ke langit,

    lalu turun ke kedalaman;

    jiwa mereka[a] luluh dalam kesesakan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “nyawa mereka luluh dalam malapetaka.” Kata נֶפֶשׁ dapat berarti “jiwa,” “nyawa,” atau “diri,” sedangkan רָעָה dapat berarti “kesusahan” atau “malapetaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ
  choice: naik
  rationale: Bentuk Qal imperfek orang ketiga jamak dari עלה menyatakan gerak ke atas; “naik” alami dan mempertahankan gerak puitis yang jelas.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” merupakan padanan idiomatis bagi bentuk Ibrani ini dan mempertahankan gambaran gelombang yang mengangkat mereka sangat tinggi.
- source_word: יֵרְדוּ
  choice: turun
  rationale: Bentuk Qal imperfek orang ketiga jamak dari ירד dipasangkan secara antitesis dengan “naik”; “turun” tidak menambahkan gagasan tenggelam yang tidak dinyatakan oleh verba itu sendiri.
- source_word: תְהוֹמוֹת
  choice: kedalaman
  rationale: Bentuk jamak dari תְּהוֹם menunjuk pada bagian-bagian laut yang amat dalam, khususnya palung gelombang dalam konteks badai. Bentuk tunggal kolektif “kedalaman” lebih alami daripada pengulangan bentuk jamak dalam bahasa Indonesia.
- source_word: נַפְשָׁם
  choice: jiwa mereka
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, diri, atau batin. “Jiwa mereka” mempertahankan keluasan makna dan gambaran puitis tentang batin yang runtuh karena ketakutan.
- source_word: בְּרָעָה
  choice: dalam kesesakan
  rationale: רָעָה di sini menunjuk pada keadaan buruk, kesusahan, atau malapetaka akibat badai, bukan kejahatan moral. “Dalam kesesakan” alami dalam puisi Indonesia dan mempertahankan konstruksi preposisional.
- source_word: תִתְמוֹגָג
  choice: luluh
  rationale: Bentuk dari מוג menggambarkan sesuatu yang melebur atau kehilangan keteguhan. “Luluh” mempertahankan metafora tersebut tanpa mereduksinya menjadi sekadar “takut” atau “kehilangan keberanian”.
theological_decisions: []
translation_notes:
  register: Diksi modern, ringkas, dan puitis. Paralel gerak naik-turun dipertahankan, demikian pula metafora jiwa yang luluh. Penanda catatan kaki ditempatkan langsung setelah frasa yang memiliki ambiguitas leksikal.
