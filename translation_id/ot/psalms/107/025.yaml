  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: id
  text: Sebab Ia berfirman dan membangkitkan angin badai[a]; angin itu mengangkat gelombang-gelombang laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Ia berfirman dan membuat angin badai bangkit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia berfirman
  rationale: אמר berarti “berkata/berbicara.” Karena subjek tersiratnya adalah Allah dalam konteks langsung, “berfirman” merupakan ungkapan Indonesia yang alami dan bermartabat tanpa memperkuatnya menjadi “memerintahkan.”
- source_word: וַיַּעֲמֵד
  choice: membangkitkan
  rationale: Bentuk kausatif dari עמד menyatakan bahwa Ia membuat angin badai bangkit. “Membangkitkan” mempertahankan daya kausatifnya dan lebih alami daripada terjemahan harfiah “membuat berdiri.”
- source_word: רוּחַ סְעָרָה
  choice: angin badai
  rationale: Frasa ini secara eksplisit menyebut angin yang bersifat dahsyat atau berbadai. “Angin badai” ringkas, jelas, dan dekat dengan gambaran Ibrani.
- source_word: וַתְּרוֹמֵם
  choice: angin itu meninggikan
  rationale: Kata kerja feminin tunggal ini selaras dengan רוּחַ, sehingga angin badai menjadi subjek. Pengulangan “angin itu” menghindari rujukan pronomina yang kabur dalam bahasa Indonesia.
- source_word: גַּלָּיו
  choice: gelombang-gelombang laut
  rationale: Akhiran orang ketiga maskulin tunggal paling wajar merujuk kepada laut yang disebut dalam konteks. Penyebutan “laut” membuat hubungan tersebut jelas dalam bahasa Indonesia tanpa menimbulkan kesan bahwa gelombang itu milik angin.
theological_decisions:
- issue: Subjek ilahi yang tersirat
  choice: “Ia” dipakai dengan huruf kapital untuk merujuk kepada TUHAN dalam konteks langsung.
  alternative: Terjemahan impersonal atau penyebutan ulang “TUHAN.”
  rationale: Bentuk verba mengandaikan subjek aktif, dan konteks ayat-ayat sekitarnya menunjuk kepada TUHAN. “Ia” menjaga alur teks tanpa menambahkan nama ilahi yang tidak tertulis dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Tanda titik koma mempertahankan kaitan erat antara tindakan Allah membangkitkan angin dan akibatnya pada gelombang. Penanda catatan kaki [a] terdapat dalam teks utama.
