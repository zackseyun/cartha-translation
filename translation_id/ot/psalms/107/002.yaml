id: PSA.107.2
reference: Psalms 107:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יֹ֭אמְרוּ גְּאוּלֵ֣י יְהוָ֑ה אֲשֶׁ֥ר גְּ֝אָלָ֗/ם מִ/יַּד צָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/002.yaml
  text: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
translation:
  language: id
  text: Biarlah orang-orang yang ditebus Yahweh berkata demikian, mereka yang telah ditebus-Nya dari tangan lawan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari tangan musuh” atau “dari tangan penindas.” Kata Ibrani ini dapat berarti lawan, musuh, atau penindas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: Biarlah ... berkata demikian
  rationale: Bentuk imperfek dalam konteks ajakan ini paling wajar dipahami secara volitif. “Berkata demikian” secara alami menunjuk kembali kepada pengakuan pada ayat sebelumnya tanpa menambahkan isi baru.
- source_word: גְּאוּלֵי
  choice: orang-orang yang ditebus
  rationale: Bentuk ini menunjuk kepada orang-orang yang telah mengalami tindakan penebusan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan hubungan leksikal dengan גְּאָלָם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֲשֶׁר
  choice: mereka yang
  rationale: Partikel relatif ini memperkenalkan klausa yang menjelaskan orang-orang yang ditebus. “Mereka yang” membuat hubungan tersebut jelas dan tetap wajar dalam bahasa Indonesia.
- source_word: גְּאָלָם
  choice: telah ditebus-Nya
  rationale: Bentuk perfektif menyatakan tindakan ilahi yang telah terlaksana. Pengulangan “ditebus” mempertahankan pengulangan akar גאל dalam teks Ibrani.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang pembebasan dari kuasa atau kendali seseorang dan masih mudah dipahami dalam bahasa Indonesia.
- source_word: צָר
  choice: lawan
  rationale: Nomina tunggal ini dapat menunjuk kepada pihak yang memusuhi atau menindas. “Lawan” mempertahankan keluasan makna itu, sedangkan kemungkinan “musuh” dan “penindas” dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Makna bahasa penebusan
  choice: ditebus
  alternative: dibebaskan atau ditebus dengan pembayaran
  rationale: Akar גאל muncul dua kali dan menekankan tindakan penyelamatan Yahweh. “Ditebus” mempertahankan gema teologis dan pengulangan teks tanpa membatasi tindakan itu pada transaksi pembayaran semata.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Struktur ajakan dipertahankan dengan “Biarlah”, metafora “dari tangan” dipertahankan, dan pengulangan akar penebusan dalam bahasa Ibrani dicerminkan dengan dua pemakaian “ditebus”.
