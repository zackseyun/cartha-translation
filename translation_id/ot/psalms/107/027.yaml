  text: They reel and stagger like a drunkard[a], and all their wisdom is swallowed up.
translation:
  language: id
  text: Mereka terhuyung-huyung dan sempoyongan seperti orang mabuk, dan segala kebijaksanaan mereka pun tertelan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala kecakapan mereka”; dalam konteks ini dapat menunjuk pada kecakapan praktis mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָח֣וֹגּוּ
  choice: terhuyung-huyung
  rationale: Dalam konteks badai, verba ini menggambarkan gerak yang tidak mantap; pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: וְיָנוּעוּ
  choice: dan sempoyongan
  rationale: Verba ini menyatakan gerak bergoyang atau limbung. Pilihan ini mempertahankan kesejajaran puitis dengan verba sebelumnya.
- source_word: כַּשִּׁכּוֹר
  choice: seperti orang mabuk
  rationale: Ungkapan ini mempertahankan perbandingan dengan seseorang yang kehilangan keseimbangan karena mabuk, serta terdengar alami dalam bahasa Indonesia modern.
- source_word: וְכָל
  choice: dan segala
  rationale: Kuantor ini mencakup seluruh kebijaksanaan atau kecakapan yang mereka miliki.
- source_word: חָכְמָתָם
  choice: kebijaksanaan mereka
  rationale: Pilihan ini mencerminkan arti dasar חָכְמָה dan tidak membatasi maknanya pada kepandaian berlayar, meskipun konteks menunjukkan kecakapan praktis.
- source_word: תִּתְבַּלָּע
  choice: lenyap
  rationale: Bentuk ini secara harfiah dapat berarti 'ditelan', tetapi dalam konteks menyatakan bahwa segala kebijaksanaan atau kecakapan mereka tidak lagi berguna. 'Lenyap' menyampaikan hasil metafora itu secara alami.
