  text: אֶ֣רֶץ פְּ֭רִי לִ/מְלֵחָ֑ה מֵ֝/רָעַ֗ת יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/034.yaml
  text: a fruitful land into a salt waste[a], because of the evil of those who dwell in it.
translation:
  language: id
  text: tanah yang subur menjadi tanah bergaram[a], karena kejahatan orang-orang yang tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi tanah asin”; gambaran Ibrani ini menyiratkan daerah tandus yang tidak produktif.
    reason: Alternatif leksikal bagi מְלֵחָה sekaligus penjelasan singkat mengenai implikasi citra garam.
lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: tanah yang subur
  rationale: Secara harfiah berarti ‘tanah buah/hasil’; dalam konstruksi ini ungkapan tersebut menunjuk pada tanah yang menghasilkan banyak tanaman. ‘Tanah yang subur’ alami dalam bahasa Indonesia dan mempertahankan gambaran pertaniannya.
- source_word: לִמְלֵחָה
  choice: menjadi tanah bergaram
  rationale: Prefiks ל menandai hasil perubahan, sedangkan מְלֵחָה menunjuk pada keadaan bergaram atau asin yang menyiratkan tanah tandus. Pilihan ini mempertahankan citra garam tanpa menggantikannya hanya dengan akibatnya, yaitu ketandusan.
- source_word: מֵרָעַת
  choice: karena kejahatan
  rationale: Preposisi מִן menyatakan sebab dalam konteks ini, dan רָעָה berarti kejahatan atau keburukan moral. ‘Karena kejahatan’ menyampaikan hubungan sebab secara jelas.
- source_word: יֹשְׁבֵי בָהּ
  choice: orang-orang yang tinggal di sana
  rationale: Partisipel יֹשְׁבֵי mempertahankan nuansa ‘mereka yang tinggal’, sementara בָהּ merujuk kembali kepada tanah tersebut. ‘Di sana’ lebih alami daripada ‘di dalamnya’ untuk suatu wilayah.
theological_decisions:
- issue: Penyebab tanah menjadi tandus
  choice: Perubahan tanah subur menjadi tanah bergaram terjadi karena kejahatan moral para penghuninya.
  alternative: Perubahan itu dipahami hanya sebagai peristiwa lingkungan atau sejarah tanpa hubungan moral.
  rationale: Frasa מֵרָעַת יֹשְׁבֵי בָהּ secara eksplisit menyatakan sebab moral. Terjemahan mempertahankan kaitan ini tanpa menambahkan penjelasan tentang cara atau pelaku penghukuman yang tidak disebutkan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. Fragmen ini sengaja diawali dengan huruf kecil karena secara sintaksis melanjutkan tindakan dari ayat sebelumnya. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
