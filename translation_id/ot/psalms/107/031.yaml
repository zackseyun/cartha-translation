base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: id
  text: Hendaklah mereka bersyukur kepada Yahweh[b] atas kasih setia-Nya dan perbuatan-perbuatan ajaib-Nya bagi umat manusia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak manusia.”
    reason: lexical_alternative
  - marker: b
    text: Nama ilahi Ibrani יהוה lazim ditransliterasikan “Yahweh”; dalam banyak terjemahan ditampilkan sebagai “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּ
  choice: Biarlah mereka bersyukur
  rationale: Bentuk hiphil imperfek yang berfungsi sebagai ajakan atau harapan dalam refrein mazmur; ungkapan ini menyampaikan daya hortatifnya secara wajar dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima ucapan syukur, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: חַסְדּוֹ
  choice: karena kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh; “kasih setia” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: וְנִפְלְאוֹתָיו
  choice: dan karena perbuatan-perbuatan-Nya yang ajaib
  rationale: נִפְלָאוֹת menunjuk kepada tindakan-tindakan luar biasa yang membangkitkan kekaguman. Pengulangan “karena” memperjelas hubungan sintaksis dalam bahasa Indonesia.
- source_word: לִבְנֵי אָדָם
  choice: bagi umat manusia
  rationale: Ungkapan harfiah “anak-anak manusia” memiliki makna kolektif, yaitu manusia pada umumnya. “Umat manusia” menyampaikan cakupan itu secara alami tanpa membatasi maknanya pada laki-laki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri, sementara kebiasaan menerjemahkannya sebagai “TUHAN” dicatat sebagai alternatif.
- issue: Cakupan ungkapan בְּנֵי אָדָם
  choice: umat manusia
  alternative: anak-anak manusia
  rationale: Walaupun bentuk Ibraninya secara harfiah berarti “anak-anak manusia,” ungkapan tersebut bersifat representatif dan kolektif. Padanan utama menyatakan makna kolektifnya, sedangkan bentuk harfiah dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada mazmur. “Biarlah” mempertahankan sifat ajakan, sedangkan “kasih setia” memakai istilah Alkitabiah yang tetap mudah dipahami. Penanda catatan [a] dan [b] ditempatkan sesudah frasa yang berkaitan.
