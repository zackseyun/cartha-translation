  yaml_path: translation/ot/psalms/107/033.yaml
  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: id
  text: Ia mengubah sungai-sungai menjadi padang gurun, dan mata-mata air menjadi tanah yang kering kerontang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kehausan”; yakni keadaan atau tempat yang kering dan tidak berair. Dapat juga diterjemahkan “tanah yang haus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: mengubah ... menjadi
  rationale: Verba שׂים pada dasarnya berarti 'menaruh, menempatkan, menjadikan'; dalam konteks perubahan keadaan ini, 'mengubah ... menjadi' menyampaikan makna idiomatisnya dengan alami.
- source_word: נְהָרוֹת
  choice: sungai-sungai
  rationale: Bentuk jamak ini secara langsung menunjuk pada sungai-sungai; pengulangan kata menyatakan jamak dengan jelas dalam bahasa Indonesia.
- source_word: לְמִדְבָּר
  choice: menjadi padang gurun
  rationale: מִדְבָּר dapat berarti daerah liar atau gurun. 'Padang gurun' alami dan mempertahankan gambaran wilayah luas yang gersang; prefiks לְ menyatakan keadaan hasil.
- source_word: וּמֹצָאֵי מַיִם
  choice: dan mata-mata air
  rationale: Secara harfiah מוֹצָאֵי berarti tempat keluar atau sumber; bersama מַיִם, ungkapan ini menunjuk pada tempat air memancar. 'Mata-mata air' mempertahankan bentuk jamak dan citra sumber air.
- source_word: לְצִמָּאוֹן
  choice: menjadi tanah yang tandus
  rationale: צִמָּאוֹן secara harfiah berarti 'kehausan' atau keadaan kering. Dalam paralelisme ini, 'tanah yang tandus' menyatakan keadaan tanpa air secara wajar, sementara catatan kaki mempertahankan gambaran harfiahnya.
