  text: יָשֵׂ֣ם מִ֭דְבָּר לַֽ/אֲגַם מַ֑יִם וְ/אֶ֥רֶץ צִ֝יָּ֗ה לְ/מֹצָ֥אֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/035.yaml
  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: id
  text: Ia mengubah padang gurun menjadi kolam air, dan tanah gersang menjadi mata-mata air.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשֵׂם
  choice: Ia mengubah
  rationale: Kata kerja שׂים pada dasarnya berarti ‘menaruh’, ‘menjadikan’, atau ‘menetapkan’. Dalam paralelisme puitis ini, perubahan padang gurun dan tanah gersang menjadi tempat berair paling alami dinyatakan dengan ‘mengubah ... menjadi’.
- source_word: מִדְבָּר
  choice: padang gurun
  rationale: מִדְבָּר menunjuk pada daerah liar, tandus, atau gurun. ‘Padang gurun’ merupakan ungkapan Indonesia yang alami dan tidak membatasi gambaran pada gurun berpasir.
- source_word: לַאֲגַם מַיִם
  choice: menjadi kolam air
  rationale: אֲגַם dapat berarti kolam, rawa, atau genangan berair. ‘Kolam air’ jelas dan mempertahankan kontras antara wilayah tandus dan kumpulan air yang menetap.
- source_word: וְאֶרֶץ צִיָּה
  choice: dan tanah gersang
  rationale: צִיָּה menggambarkan keadaan kering atau tandus. ‘Tanah gersang’ ringkas, puitis, dan lazim dalam bahasa Indonesia modern.
- source_word: לְמֹצָאֵי מָיִם
  choice: menjadi mata-mata air
  rationale: מוֹצָא adalah tempat keluarnya sesuatu dan dalam konteks air dapat menunjuk pada sumber atau mata air. Bentuk jamak Ibrani dipertahankan secara alami dengan ‘mata-mata air’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pronomina ‘Ia’ merujuk kepada TUHAN dari konteks mazmur. Paralelisme antara ‘padang gurun/kolam air’ dan ‘tanah gersang/mata-mata air’ dipertahankan tanpa menambahkan penafsiran teologis.
