  text: and gathered them from the lands[a], from the east and from the west[b], from the north and from the sea.
translation:
  language: id
  text: 'dan mengumpulkan mereka dari berbagai negeri,

    dari timur dan dari barat,

    dari utara dan dari laut.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan dari selatan”; teks Ibrani berbunyi “dan dari laut”. Dalam konteks tertentu, “laut” dapat berfungsi sebagai istilah arah, biasanya menunjuk ke barat, tetapi “barat” sudah disebut secara eksplisit di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  choice: dari berbagai negeri
  rationale: Bentuk jamak אֲרָצוֹת menunjuk pada banyak negeri atau wilayah. Ungkapan “berbagai negeri” alami dalam bahasa Indonesia dan mempertahankan cakupan jamaknya tanpa memberi kesan negara modern secara khusus.
- source_word: קִבְּצָם
  choice: mengumpulkan mereka
  rationale: Kata kerja קבץ berarti mengumpulkan atau menghimpun. “Mengumpulkan mereka” tepat untuk konteks umat yang dibawa pulang dari tempat-tempat yang tersebar.
- source_word: מִמִּזְרָח
  choice: dari timur
  rationale: מִזְרָח adalah arah timur, secara etimologis berkaitan dengan terbitnya matahari. Bentuk ringkas ini alami dalam rangkaian arah.
- source_word: וּמִמַּעֲרָב
  choice: dan dari barat
  rationale: מַעֲרָב menunjuk pada arah barat. Terjemahan ini menjaga kesejajaran dengan “dari timur”.
- source_word: מִצָּפוֹן
  choice: dari utara
  rationale: צָפוֹן adalah arah utara; padanan langsung ini mempertahankan susunan geografis teks.
- source_word: וּמִיָּם
  choice: dan dari laut
  rationale: Makna dasar יָם ialah “laut”. Walaupun kata ini kadang dipakai sebagai penunjuk arah barat, “barat” sudah disebut secara eksplisit dalam ayat ini. Terjemahan harfiah “laut” paling transparan, sedangkan kemungkinan arah selatan dicatat dalam catatan kaki.
