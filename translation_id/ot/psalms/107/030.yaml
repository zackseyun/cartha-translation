translation:
  language: id
  text: Mereka pun bersukacita karena laut menjadi tenang[a], lalu Ia menuntun mereka ke pelabuhan yang mereka dambakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka menjadi tenang”; bentuk jamak ini dapat dipahami sebagai merujuk kepada gelombang-gelombang pada ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini juga dapat diterjemahkan “tempat berlabuh” atau, secara lebih umum, “tempat tujuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Mereka pun bersukacita
  rationale: Kata שׂמח menyatakan sukacita; “pun” secara alami meneruskan urutan narasi yang ditandai waw pada bentuk wayyiqtol.
- source_word: כִּי
  choice: karena
  rationale: Di sini כִּי paling wajar menyatakan alasan mereka bersukacita, meskipun dapat pula dipahami sebagai pengantar isi atau waktu.
- source_word: יִשְׁתֹּקוּ
  choice: laut menjadi tenang
  rationale: Kata kerja שׁתק berarti menjadi diam atau tenang. Subjek gramatikalnya tidak disebut sebagai nomina; konteks badai dan gelombang pada ayat sebelumnya mendukung pengungkapan idiomatis “laut” dalam bahasa Indonesia. Ketidakharfiahan dan kemungkinan rujukannya dicatat dalam catatan kaki.
- source_word: וַיַּנְחֵם
  choice: lalu Ia menuntun mereka
  rationale: Kata נחה berarti menuntun atau memimpin. Subjek tunggal maskulin yang tersirat adalah Allah dalam konteks mazmur; “lalu” meneruskan alur narasi.
- source_word: מְחוֹז
  choice: pelabuhan
  rationale: Dalam konteks pelayaran, kata ini menunjuk tempat kedatangan atau pelabuhan. “Pelabuhan” jelas, alami, dan tetap mempertahankan gambaran maritim.
- source_word: חֶפְצָם
  choice: yang mereka dambakan
  rationale: Bentuk dari חפץ menyatakan keinginan atau kesukaan. Klausa relatif ini alami dalam bahasa Indonesia dan menyampaikan tujuan yang sangat diinginkan.
theological_decisions:
- issue: Subjek ilahi yang tersirat dalam וַיַּנְחֵם
  choice: “Ia” merujuk kepada Allah yang menuntun mereka.
  alternative: Bentuk pasif, “mereka dituntun.”
  rationale: Kata kerja Ibrani berbentuk orang ketiga maskulin tunggal, dan konteks menyatakan bahwa TUHAN bertindak setelah seruan para pelaut. Bentuk aktif mempertahankan pelaku personal tanpa menambahkan klaim teologis lain.
- issue: Subjek יִשְׁתֹּקוּ yang tidak dinyatakan secara eksplisit
  choice: Diterjemahkan secara kontekstual sebagai “laut menjadi tenang,” dengan catatan tentang bentuk harfiahnya.
  alternative: “mereka menjadi tenang,” yang dapat terdengar seolah-olah menunjuk kepada para pelaut.
  rationale: Bentuk verba adalah jamak maskulin dan dapat merujuk kembali kepada gelombang-gelombang pada ayat sebelumnya. Terjemahan utama menghindari ambiguitas pronominal yang menyesatkan dalam bahasa Indonesia, sementara catatan kaki mempertahankan data bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. “Bersukacita,” “menuntun,” dan “dambakan” menjaga martabat gaya mazmur tanpa terdengar kuno; “pelabuhan” mempertahankan latar pelayaran.
