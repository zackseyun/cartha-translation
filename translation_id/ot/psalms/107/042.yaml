  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: id
  text: Orang-orang yang hidup lurus melihat dan bersukacita, dan segala ketidakadilan menutup mulutnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nomina Ibrani untuk “ketidakadilan” berbentuk feminin tunggal dan dipersonifikasikan melalui ungkapan “mulutnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: melihat
  rationale: Bentuk imperfek Qal orang ketiga jamak dari ראה. Dalam rangkuman puitis ini, bentuk kini memberi nuansa umum tanpa menutup kemungkinan arah ke masa depan.
- source_word: יְשָׁרִים
  choice: orang-orang yang tulus
  rationale: Kata sifat jamak yang dipakai sebagai nomina menunjuk kepada orang yang lurus secara moral. 'Tulus' alami dalam bahasa Indonesia dan tidak menyamakannya begitu saja dengan istilah teknis lain untuk 'orang benar'.
- source_word: וְיִשְׂמָחוּ
  choice: dan bersukacita
  rationale: Bentuk imperfek Qal orang ketiga jamak dari שמח; pilihan ini mempertahankan daya perayaan aktif dan kesejajarannya dengan 'melihat'.
- source_word: וְכָל
  choice: dan segala
  rationale: Menerjemahkan konjungsi sederhana dan cakupan menyeluruh secara langsung; meskipun hubungan maknanya bernuansa kontras, teks Ibrani tidak memakai partikel adversatif.
- source_word: עַוְלָה
  choice: ketidakadilan
  rationale: Nomina abstrak ini berarti kesalahan, ketidakadilan, atau kefasikan. 'Ketidakadilan' mempertahankan subjek abstrak dan tidak mengubahnya menjadi 'orang fasik'.
- source_word: קָפְצָה
  choice: menutup
  rationale: Bentuk perfektif Qal feminin tunggal dari קפץ dalam ungkapan dengan 'mulut'. Bentuk kini selaras dengan sifat pepatah/rangkuman ayat ini.
- source_word: פִּיהָ
  choice: mulutnya
  rationale: Akhiran feminin tunggal merujuk kembali kepada עַוְלָה. Bahasa Indonesia tidak menandai gender pada pronomina, tetapi citra personifikasi tetap terpelihara melalui 'mulutnya'.
theological_decisions:
- issue: Personifikasi kejahatan atau ketidakadilan
  choice: Mempertahankan nomina abstrak 'ketidakadilan' sebagai sesuatu yang menutup mulutnya.
  alternative: Mengganti subjek dengan 'orang fasik' atau memakai istilah 'kefasikan'.
  rationale: Teks Ibrani memakai nomina abstrak feminin עַוְלָה, bukan nomina yang secara eksplisit menunjuk kepada sekelompok orang. Terjemahan ini menjaga personifikasi puitis dan tidak memasukkan subjek yang berbeda.
- issue: Nilai waktu bentuk-bentuk verba
  choice: 'Menggunakan bentuk kini yang bersifat umum: ''melihat'', ''bersukacita'', dan ''menutup''.'
  alternative: 'Menerjemahkan secara futur: ''akan melihat'', ''akan bersukacita'', dan ''akan menutup''.'
  rationale: Puisi ini dapat dibaca sebagai kesimpulan umum sekaligus pengharapan. Bahasa Indonesia tanpa penanda waktu eksplisit mempertahankan keluwesan itu dengan baik.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Susunan dua klausa dipertahankan untuk menjaga kesejajaran Ibrani; personifikasi pada klausa kedua tidak dijelaskan di dalam teks utama agar citranya tetap kuat.
