  yaml_path: translation/ot/psalms/107/004.yaml
  text: They wandered in the wilderness[a], in a desolate way; they found no city to dwell in.
translation:
  language: id
  text: Mereka mengembara di padang belantara, di jalan yang tandus; mereka tidak menemukan kota untuk didiami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעוּ
  choice: mengembara
  rationale: Kata kerja תעה menyatakan gerak tanpa arah atau tersesat. “Mengembara” secara alami menggambarkan perjalanan tanpa tujuan yang jelas tanpa menambahkan gagasan kesalahan moral.
- source_word: בַמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk pada wilayah liar, gersang, dan tidak berpenghuni. “Padang belantara” mempertahankan cakupan maknanya dan sesuai dengan ragam puitis Mazmur.
- source_word: בִּישִׁימוֹן דָּרֶךְ
  choice: di jalan yang tandus
  rationale: יְשִׁימוֹן menyatakan tempat tandus atau sunyi, sedangkan דֶּרֶךְ berarti jalan. Gabungan ini dapat dipahami sebagai jalan di kawasan tandus; terjemahan ini ringkas, alami, dan mempertahankan hubungan kedua unsur tersebut.
- source_word: עִיר מוֹשָׁב
  choice: kota untuk didiami
  rationale: Rangkaian ini menunjuk pada kota tempat tinggal atau permukiman. “Kota untuk didiami” mempertahankan ungkapan tujuan dalam bahasa Ibrani dan terdengar wajar dalam bahasa Indonesia.
- source_word: לֹא מָצָאוּ
  choice: mereka tidak menemukan
  rationale: Bentuk perfektum yang dinegasikan menyatakan secara langsung bahwa mereka gagal menemukan tempat tersebut.
