  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: id
  text: Biarlah mereka bersyukur kepada Yahweh karena kasih setia-Nya dan karena perbuatan-perbuatan-Nya yang ajaib bagi umat manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak manusia,” ungkapan Ibrani yang berarti manusia pada umumnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Biarlah mereka bersyukur
  rationale: Bentuk ini menyampaikan seruan Hifil dari ידה dalam refrein mazmur, yakni mengucapkan syukur atau pujian, tanpa mengubahnya menjadi pernyataan biasa.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menjadi tujuan ucapan syukur, sedangkan nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kebaikan, dan kesetiaan yang teguh. 'Kasih setia' merupakan padanan Indonesia yang alami dan mempertahankan keluasan maknanya.
- source_word: וְנִפְלְאוֹתָיו
  choice: dan karena perbuatan-perbuatan-Nya yang ajaib
  rationale: נִפְלָאוֹת menunjuk pada tindakan-tindakan luar biasa yang menimbulkan kekaguman. Kata 'karena' diulangi agar hubungan sintaksisnya dengan ungkapan bersyukur jelas dalam bahasa Indonesia.
- source_word: לִבְנֵי אָדָם
  choice: bagi umat manusia
  rationale: Ungkapan harfiah 'anak-anak manusia' merupakan idiom Ibrani yang secara kolektif menunjuk kepada manusia. 'Umat manusia' menyampaikan maksud itu secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi יהוה. Bentuk 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Cakupan בְּנֵי אָדָם
  choice: umat manusia
  alternative: anak-anak manusia
  rationale: Dalam konteks ini ungkapan tersebut bersifat generik dan mencakup seluruh manusia, bukan hanya laki-laki atau keturunan seseorang tertentu. Terjemahan utama menyatakan cakupannya, sedangkan catatan kaki mempertahankan citra Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis. Pengulangan 'karena' memperjelas dua alasan untuk bersyukur, sedangkan 'perbuatan-perbuatan-Nya yang ajaib' mempertahankan penekanan pada tindakan ilahi.
