base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/010.yaml
  text: Some sat in darkness and deep shadow[a], prisoners in affliction and irons,
translation:
  language: id
  text: Ada yang duduk dalam kegelapan dan kelam pekat[a], tertawan dalam kesengsaraan dan belenggu besi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bayang-bayang maut,” terjemahan tradisional untuk צַלְמָוֶת; kata Ibrani ini kemungkinan merujuk secara lebih luas pada kegelapan atau kemuraman yang sangat dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: Ada yang duduk
  rationale: Bentuk partisipel dari ישׁב menggambarkan orang-orang yang duduk atau tinggal dalam suatu keadaan. Klausa finit ini alami dalam bahasa Indonesia dan sesuai dengan pola mazmur yang mengisahkan beberapa kelompok orang.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Padanan langsung dan wajar untuk keadaan gelap, baik secara harfiah maupun kiasan.
- source_word: צַלְמָוֶת
  choice: kelam pekat
  rationale: Ungkapan ini menyampaikan kegelapan atau kemuraman yang sangat dalam tanpa secara tegas memasukkan unsur kematian, yang tidak pasti secara leksikal. Terjemahan tradisional dicantumkan dalam catatan kaki.
- source_word: אֲסִירֵי
  choice: tertawan
  rationale: Kata ini menunjuk kepada orang-orang yang terikat atau dipenjarakan. Bentuk predikatif ini mengalir alami setelah klausa pembuka.
- source_word: עֳנִי
  choice: kesengsaraan
  rationale: Dalam konteks penawanan, kata ini menunjuk pada keadaan menderita atau tertindas; 'kesengsaraan' mempertahankan cakupan yang lebih luas daripada kemiskinan saja.
- source_word: בַרְזֶל
  choice: belenggu besi
  rationale: Walaupun teks Ibrani secara harfiah menyebut 'besi', konteks penawanan memakainya secara metonimis untuk alat pengekang dari besi. 'Belenggu besi' jelas dan alami dalam bahasa Indonesia.
