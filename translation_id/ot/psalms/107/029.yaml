lexical_decisions:
- source_word: יָקֵם
  choice: membuat ... menjadi
  rationale: 'Bentuk Hifil dari קום di sini menyatakan sebab atau hasil: Ia menyebabkan badai masuk ke dalam keadaan teduh. Ungkapan ini mempertahankan daya kausatifnya dalam bahasa Indonesia yang wajar.'
- source_word: סְעָרָה
  choice: badai
  rationale: Kata ini menunjuk pada badai atau angin ribut, dan konteks mazmur ini jelas bersifat maritim. “Badai” merupakan padanan modern yang lugas.
- source_word: לִדְמָמָה
  choice: menjadi teduh
  rationale: Preposisi ל dengan דְּמָמָה menyatakan hasil, yakni masuk ke dalam keadaan hening atau tenang. Untuk badai di laut, “menjadi teduh” terdengar alami sekaligus mempertahankan gagasan perubahan keadaan.
- source_word: וַיֶּחֱשׁוּ
  choice: pun menjadi tenang
  rationale: Kata kerja ini menyatakan bahwa gelombang-gelombang itu menjadi diam atau tenang. “Menjadi tenang” jelas dan alami, sedangkan “pun” menghubungkan akibat lanjutan dengan klausa sebelumnya.
- source_word: גַּלֵּיהֶם
  choice: gelombang-gelombang mereka
  rationale: Akhiran Ibrani berbentuk orang ketiga jamak, secara harfiah “mereka”. Padanan ini mempertahankan bentuk sumber tanpa diam-diam menetapkan antesedennya.
