translation:
  language: id
  text: Ia membuat badai itu menjadi tenang, dan gelombang-gelombang mereka pun menjadi tenang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gelombang-gelombangnya”, jika akhiran itu dipahami mengacu pada laut atau air, bukan pada orang-orang di kapal.
