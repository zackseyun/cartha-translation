  text: Mereka melihat karya Yahweh dan keajaiban-Nya di laut dalam[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kedalaman laut.” Istilah Ibrani ini menunjuk pada perairan yang dalam, sesuai dengan latar pelayaran dalam mazmur ini.
