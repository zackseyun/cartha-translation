  naturalness: “Perbuatan-perbuatan” dan “keajaiban-keajaiban” dapat dipahami, tetapi pengulangan tersebut terasa berat dan kurang alami dalam prosa/puisi Indonesia modern. Nomina kolektif “karya” dan bentuk tak berulang “keajaiban” menyampaikan pluralitas Ibrani secara wajar. “Di laut dalam” idiomatis dalam konteks para pelaut dan tidak melampaui makna מצולה.
  terminology: “Yahweh” tepat untuk יהוה dan “keajaiban-Nya” secara baik mempertahankan נפלאותיו. “Karya Yahweh” merupakan padanan yang alami dan cukup luas untuk מעשי יהוה.
