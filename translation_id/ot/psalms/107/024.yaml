lexical_decisions:
- source_word: הֵמָּה
  choice: Merekalah
  rationale: Pronomina mandiri orang ketiga jamak ini bersifat menegaskan. Bentuk “merekalah” menyampaikan penekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: רָאוּ
  choice: melihat
  rationale: Bentuk Qal perfektif orang ketiga jamak dari ראה menceritakan pengalaman para pelaut; “melihat” sesuai dengan alur puitis dan tidak menambahkan nuansa yang tidak dinyatakan.
- source_word: מַעֲשֵׂי
  choice: perbuatan-perbuatan
  rationale: Bentuk jamak konstruksi dari מַעֲשֶׂה menunjuk pada tindakan-tindakan Yahweh. Pilihan ini luas, alami, dan berpasangan baik dengan “keajaiban-keajaiban”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi berupa Tetragramaton dialihaksarakan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: וְנִפְלְאוֹתָיו
  choice: dan keajaiban-keajaiban-Nya
  rationale: Nomina jamak dari פלא dengan sufiks orang ketiga maskulin tunggal menunjuk pada tindakan luar biasa yang menimbulkan kekaguman; sufiks kepunyaannya dipertahankan secara eksplisit.
- source_word: בִּמְצוּלָה
  choice: di laut dalam
  rationale: Nomina ini menunjuk pada kedalaman, terutama perairan dalam. Dalam konteks pelayaran mazmur ini, “di laut dalam” jelas dan alami tanpa mempersempit maknanya secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi itu alih-alih menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Bentuk “merekalah” mempertahankan penekanan pada הֵמָּה, sedangkan pengulangan jamak pada “perbuatan-perbuatan” dan “keajaiban-keajaiban” mencerminkan bentuk Ibrani tanpa menjadi tidak wajar.
