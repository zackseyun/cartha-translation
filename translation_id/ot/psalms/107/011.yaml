base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/011.yaml
  text: For they rebelled against the words of God and despised the counsel of the Most High[a].
translation:
  language: id
  text: Sebab mereka memberontak terhadap firman Allah dan menghina nasihat Yang Mahatinggi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab mereka menentang perkataan Allah dan menolak rencana Yang Mahatinggi.”
    reason: Alternatif ini mencerminkan kemungkinan padanan yang berbeda untuk הִמְרוּ (menentang), אִמְרֵי (perkataan), נָאָצוּ (menolak), dan cakupan עֵצָה sebagai rencana.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi keadaan atau penghukuman yang disebut sebelumnya dan tetap alami dalam alur puitis bahasa Indonesia.
- source_word: הִמְרוּ
  choice: memberontak terhadap
  rationale: Kata מרה menyatakan perlawanan atau pembangkangan; pilihan ini mempertahankan daya relasional dan moral tindakan tersebut.
- source_word: אִמְרֵי
  choice: firman
  rationale: Bentuk jamak konstruksi אמרה menunjuk pada perkataan-perkataan ilahi. 'Firman' merupakan padanan Indonesia yang alami dan bermartabat; bentuk kolektifnya tidak perlu dibuat jamak.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini adalah sebutan ilahi yang umum; 'Allah' adalah padanan baku dalam bahasa Indonesia tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: וַעֲצַת
  choice: dan nasihat
  rationale: עֵצָה dapat berarti nasihat, rencana, atau maksud. 'Nasihat' sesuai dengan paralelisme terhadap firman ilahi dan tidak mengkhususkan makna sebagai ketetapan tersembunyi.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Mempertahankan gelar ilahi dan nuansa keluhuran dengan bentuk yang mapan dalam bahasa Indonesia.
- source_word: נָאָצוּ
  choice: meremehkan
  rationale: נאץ menyatakan sikap menghina atau memandang dengan rendah. 'Meremehkan' alami dalam konteks nasihat, sementara catatan kaki mempertahankan alternatif yang lebih keras.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֵל dan עֶלְיוֹן dalam paralelisme
  choice: Allah ... Yang Mahatinggi
  alternative: Yang Perkasa ... Yang Luhur
  rationale: Pilihan ini mempertahankan perbedaan kedua sebutan ilahi dan nada luhur ayat tanpa memasukkan nuansa doktrinal tambahan.
- issue: Cakupan makna עֵצָה
  choice: nasihat
  alternative: rencana atau maksud
  rationale: Konteks paralel dengan firman Allah mendukung 'nasihat', tetapi istilah Ibrani juga dapat menunjuk pada rencana atau maksud; ketegangan leksikal ini dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan puitis secara wajar. Struktur paralel Ibrani dipertahankan; 'firman' digunakan secara kolektif, dan gelar 'Yang Mahatinggi' mempertahankan nada luhur.
