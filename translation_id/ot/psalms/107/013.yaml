  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: id
  text: Lalu mereka berseru kepada Yahweh dalam kesusahan mereka; Ia menyelamatkan mereka dari himpitan-himpitan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “himpitan-himpitan” juga dapat berarti “kesesakan-kesesakan” atau “keadaan-keadaan terjepit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Lalu mereka berseru
  rationale: Bentuk wayyiqtol melanjutkan alur kisah, sedangkan זעק menyatakan seruan kuat untuk meminta pertolongan. “Berseru” menyampaikan urgensi itu secara alami dalam bahasa Indonesia.
- source_word: אֶל־יְהוָה
  choice: kepada Yahweh
  rationale: אֶל menunjukkan arah seruan, dan nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: בַּצַּר לָהֶם
  choice: dalam kesusahan mereka
  rationale: צַר di sini menunjuk pada keadaan sulit atau tertekan. “Dalam kesusahan mereka” alami dalam bahasa Indonesia dan mempertahankan makna kolektif bentuk tunggal Ibrani.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: dari segala himpitan mereka
  rationale: Bentuk jamak מְצוּקוֹת menggambarkan berbagai keadaan yang menghimpit atau menyesakkan. “Segala himpitan mereka” mempertahankan nuansa jamak tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: יוֹשִׁיעֵם
  choice: Ia menyelamatkan mereka
  rationale: Bentuk Hifil dari ישׁע berarti menyelamatkan atau melepaskan dari bahaya. “Menyelamatkan” merupakan padanan langsung dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ia” dipakai sebagai pronomina yang wajar dalam ragam sastra-keagamaan; tanda titik koma mempertahankan hubungan erat antara seruan mereka dan tindakan penyelamatan Yahweh.
