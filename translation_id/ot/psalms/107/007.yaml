translation:
  language: id
  text: Ia menuntun mereka melalui jalan yang lurus untuk pergi ke sebuah kota untuk didiami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Ia menuntun mereka melalui jalan yang lurus untuk pergi ke sebuah kota hunian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: Ia menuntun mereka
  rationale: Bentuk Hifil dari דרך berarti memimpin atau menuntun seseorang menempuh jalan; “menuntun” alami dalam bahasa Indonesia dan mempertahankan nuansa pengarahan.
- source_word: בְּדֶרֶךְ יְשָׁרָה
  choice: melalui jalan yang lurus
  rationale: דֶּרֶךְ berarti jalan atau jalur, sedangkan יְשָׁרָה dalam konteks perjalanan paling konkret berarti lurus; “melalui” mengungkapkan sarana atau rute yang ditandai preposisi בְּ.
- source_word: לָלֶכֶת אֶל
  choice: menuju
  rationale: Infinitif הלך dengan אֶל menyatakan gerak dengan tujuan tertentu. “Menuju” menyampaikan maksud frasa itu secara wajar tanpa pengulangan yang kaku.
- source_word: עִיר מוֹשָׁב
  choice: kota tempat tinggal
  rationale: Frasa konstruksi ini secara harfiah adalah “kota kediaman/tempat tinggal” dan menunjuk kota yang dapat dihuni, sebagai kebalikan dari pengembaraan di padang belantara.
