    issue: Nuansa infinitif tujuan dan fungsi kota kurang eksplisit dalam teks utama.
    rationale: לָלֶכֶת אֶל menyatakan ‘untuk pergi ke’, sedangkan עִיר מוֹשָׁב menunjuk kota sebagai tempat hunian. “Menuju kota tempat tinggal” merangkum keduanya, tetapi dapat mengaburkan tujuan ‘pergi’ dan memberi kesan kota itu telah menjadi tempat tinggal mereka.
  - severity: low
    issue: Catatan kaki memakai “kota kediaman,” yang kurang lazim dan dapat bernuansa kediaman pribadi.
    rationale: Untuk alternatif yang lebih harfiah namun tetap wajar, “kota hunian” lebih dekat dengan konstruksi Ibrani dan tidak mengubah makna.
