id: PSA.107.15
reference: Psalms 107:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: id
  text: Biarlah mereka bersyukur kepada Yahweh karena kasih setia-Nya dan karena perbuatan-perbuatan-Nya yang ajaib bagi umat manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada anak-anak manusia”; dapat juga diterjemahkan “bagi manusia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Biarlah mereka bersyukur
  rationale: Bentuk jamak ini dalam refrein mazmur menyatakan ajakan. 'Biarlah mereka bersyukur' mempertahankan daya hortatif dan sesuai dengan makna ידה dalam konteks ini.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima ucapan syukur, sedangkan יהוה ditampilkan sebagai nama ilahi 'Yahweh'.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: '''Kasih setia'' secara ringkas menyampaikan unsur kasih, kebaikan, dan kesetiaan yang terkandung dalam חסד.'
- source_word: וְנִפְלְאוֹתָיו
  choice: dan karena perbuatan-perbuatan-Nya yang ajaib
  rationale: Nomina dari akar פלא menunjuk pada tindakan luar biasa. Frasa ini mempertahankan kesejajaran sebagai alasan kedua untuk bersyukur.
- source_word: לִבְנֵי אָדָם
  choice: bagi umat manusia
  rationale: Secara harfiah ungkapan ini berarti 'kepada anak-anak manusia', tetapi secara idiomatis menunjuk kepada manusia secara umum sebagai penerima perbuatan ajaib Yahweh. 'Bagi' menyatakan manfaat atau sasaran tindakan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan בני אדם
  choice: umat manusia
  alternative: anak-anak manusia; manusia
  rationale: Ungkapan Ibrani berbentuk maskulin secara gramatikal tetapi bersifat representatif dan mencakup manusia pada umumnya. Terjemahan ini mempertahankan cakupan universal tanpa memberi kesan hanya laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pengulangan 'karena' memperjelas bahwa kasih setia dan perbuatan ajaib sama-sama menjadi alasan untuk bersyukur. Bentuk hormat pada pronomina ilahi dipertahankan dengan huruf kapital.
