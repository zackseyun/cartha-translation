  source_fidelity: 'Terjemahan dengan tepat mencerminkan bentuk hortatif jamak יוֹדוּ melalui “Biarlah mereka bersyukur,” objek tidak langsung לַיהוָה melalui “kepada Yahweh,” serta dua dasar ucapan syukur yang sejajar: kasih setia-Nya dan perbuatan-perbuatan-Nya yang ajaib. “Bagi umat manusia” menyampaikan fungsi לִבְנֵי אָדָם sebagai sasaran/penerima tindakan ajaib Allah secara idiomatis dalam bahasa Indonesia.'
