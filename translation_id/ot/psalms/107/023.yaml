  yaml_path: translation/ot/psalms/107/023.yaml
  text: Those who go down to the sea in ships[a], doing business on great waters—
translation:
  language: id
  text: 'Orang-orang yang turun ke laut dengan kapal-kapal,

    yang bekerja di perairan luas[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang menjalankan usaha di perairan luas” atau “yang berdagang di perairan luas.” Ungkapan Ibraninya dapat menunjuk pada pekerjaan atau perdagangan yang dilakukan di laut lepas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרְדֵי
  choice: Orang-orang yang turun
  rationale: Partisipel Qal jamak dipakai secara substantival untuk menyebut sekelompok orang; bentuk ini mempertahankan gambaran Ibrani tentang mereka yang turun menuju laut.
- source_word: הַיָּם
  choice: ke laut
  rationale: Nomina berartikel ini menunjuk pada laut dalam pengertian maritim umum, bukan dengan pasti pada suatu laut bernama.
- source_word: בָּאֳנִיּוֹת
  choice: dengan kapal-kapal
  rationale: Preposisi ב dengan bentuk jamak אֳנִיּוֹת menyatakan sarana atau lingkungan pelayaran; 'dengan kapal-kapal' alami dalam bahasa Indonesia dan mempertahankan bentuk jamaknya.
- source_word: עֹשֵׂי מְלָאכָה
  choice: yang bekerja
  rationale: Gabungan partisipel עשה dan מְלָאכָה secara luas berarti melakukan pekerjaan. 'Yang bekerja' tidak mempersempitnya secara tidak perlu menjadi perdagangan saja.
- source_word: בְּמַיִם רַבִּים
  choice: di perairan luas
  rationale: Ungkapan puitis ini menggambarkan laut lepas. 'Perairan luas' alami dalam bahasa Indonesia serta menyampaikan cakupan רַבִּים tanpa memaksakan arti numerik 'banyak' atau arti intensif 'dahsyat'.
