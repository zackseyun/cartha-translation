translation:
  language: id
  text: Ia menumpahkan hinaan atas para bangsawan[a] dan membuat mereka mengembara di tanah tandus tanpa jalan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pangeran” atau “para pemimpin.” Kata Ibrani נְדִיבִים dapat merujuk pada bangsawan, pangeran, atau pemimpin terkemuka.'
    reason: lexical_alternative
