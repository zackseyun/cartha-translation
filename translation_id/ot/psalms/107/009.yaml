source:
  edition: WLC
  text: כִּי הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה וְ/נֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
translation:
  language: id
  text: Sebab Dia memuaskan jiwa[a] yang dahaga dan memenuhi jiwa yang lapar dengan apa yang baik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti “pribadi”, “diri”, atau “hidup”; kata ini sering menunjuk pada manusia seutuhnya, bukan hanya bagian nonjasmani.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dengan hal-hal yang baik” atau “dengan kebaikan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ajakan untuk bersyukur dalam konteks sebelumnya; “sebab” mempertahankan fungsi penjelasannya secara alami.
- source_word: הִשְׂבִּיעַ
  choice: memuaskan
  rationale: Bentuk Hifil dari שבע berarti membuat kenyang atau puas. “Memuaskan” cocok dengan kebutuhan yang digambarkan sebagai dahaga dan mempertahankan kesejajaran dengan tindakan memenuhi pada larik kedua.
- source_word: נֶפֶשׁ
  choice: jiwa
  rationale: Kata Ibrani ini dapat menunjuk pada diri atau pribadi seutuhnya, bukan hanya unsur nonjasmani. “Jiwa” mempertahankan bobot puitisnya, sementara catatan kaki menjelaskan keluasan maknanya.
- source_word: שֹׁקֵקָה
  choice: yang dahaga
  rationale: Partisip ini menggambarkan hasrat atau kerinduan yang kuat. Dalam konteks orang yang lapar dan haus serta dalam kesejajaran dengan רְעֵבָה, “yang dahaga” paling konkret dan alami.
- source_word: רְעֵבָה
  choice: yang lapar
  rationale: Terjemahan langsung yang jelas dan membentuk pasangan puitis alami dengan “yang dahaga”.
- source_word: מִלֵּא
  choice: memenuhi
  rationale: Bentuk Piel dari מלא menyatakan tindakan mengisi atau memenuhi. Pilihan ini mempertahankan citra Ibrani dan kesejajaran verbal ayat.
- source_word: טוֹב
  choice: apa yang baik
  rationale: Nomina/adjektiva substantival ini secara harfiah menunjuk pada yang baik. Ungkapan ini mempertahankan keluasannya tanpa membatasi maksudnya menjadi hanya benda-benda materi.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ
  choice: Diterjemahkan “jiwa” pada kedua larik
  alternative: pribadi; diri; hidup
  rationale: “Jiwa” mempertahankan gema puitis dan kedalaman kebutuhan manusia dalam ayat ini, tetapi tidak dimaksudkan untuk menetapkan pembagian teknis antara tubuh dan unsur nonjasmani. Catatan kaki menjaga keluasan makna Ibraninya.
- issue: Cakupan טוֹב
  choice: apa yang baik
  alternative: hal-hal yang baik; kebaikan
  rationale: Bentuk Ibrani dapat dipahami secara luas sebagai yang baik atau berbagai pemberian baik. Terjemahan utama tidak mempersempitnya menjadi kemakmuran material ataupun menjadikannya semata-mata kualitas abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan struktur dua larik yang sejajar. Kapitalisasi “Dia” mengikuti kebiasaan hormat yang lazim dalam terjemahan Alkitab bahasa Indonesia tanpa menambahkan sebutan ilahi yang tidak dinyatakan dalam teks Ibrani.
