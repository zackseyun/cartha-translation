  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
translation:
  language: id
  text: Biarlah mereka meninggikan Dia dalam perhimpunan umat[a], dan memuji Dia dalam sidang para tua-tua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jemaat.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, kata ini berkaitan dengan “duduk” atau “tempat duduk”; dalam konteks ini maksudnya sidang atau pertemuan resmi para tua-tua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: Biarlah mereka meninggikan Dia
  rationale: Bentuk dari רומם menyatakan tindakan meninggikan atau memuliakan seseorang. 'Meninggikan' mempertahankan citra sumber sekaligus menyampaikan penghormatan terbuka.
- source_word: בִּקְהַל עָם
  choice: dalam perhimpunan umat
  rationale: קהל menunjuk kepada kumpulan yang berhimpun, sedangkan עָם ialah umat atau rakyat. 'Perhimpunan umat' alami dalam konteks ibadah dan tidak membatasi ungkapan ini pada lembaga tertentu.
- source_word: וּבְמוֹשַׁב זְקֵנִים
  choice: dan ... dalam sidang para tua-tua
  rationale: מוֹשָׁב secara harfiah berkaitan dengan tempat duduk atau sesi orang-orang yang duduk, tetapi bersama זְקֵנִים menunjuk pada pertemuan para pemimpin masyarakat. 'Sidang para tua-tua' menyampaikan suasana resmi itu sambil mempertahankan jabatan sosial mereka.
- source_word: יְהַלְלוּהוּ
  choice: memuji Dia
  rationale: הלל dalam bentuk piel lazim berarti memuji; pilihan ini langsung, alami, dan sesuai dengan konteks pemujaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Umat' dipilih untuk עָם karena konteksnya adalah komunitas yang berkumpul; 'para tua-tua' mempertahankan sebutan Alkitabiah bagi pemimpin masyarakat tanpa mengartikannya sekadar sebagai orang lanjut usia.
