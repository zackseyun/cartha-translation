  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: id
  text: Orang-orang bebal menderita karena jalan pelanggaran mereka[a] dan karena kesalahan-kesalahan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dari jalan pelanggaran mereka”. Preposisi Ibrani dapat berarti “dari”, tetapi di sini tampaknya menyatakan sebab: “karena”.'
    reason: lexical_alternative
  - marker: b
    text: “Pelanggaran” juga dapat diterjemahkan “pemberontakan”; “kesalahan-kesalahan” juga dapat diterjemahkan “dosa-dosa” atau, bergantung pada konteks, “rasa bersalah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: orang-orang bebal
  rationale: Kata ini menunjuk kepada orang yang bodoh secara moral, bukan sekadar kurang cerdas. “Bebal” mempertahankan kategori moral dalam sastra hikmat dan tetap ringkas serta wajar dalam bahasa Indonesia.
- source_word: מִדֶּרֶךְ
  choice: karena jalan
  rationale: Preposisi מִן paling mungkin menyatakan sebab dalam konteks ini. “Jalan” dipertahankan karena דֶּרֶךְ dapat menggambarkan arah atau pola hidup seseorang.
- source_word: פִּשְׁעָם
  choice: pelanggaran mereka
  rationale: פֶּשַׁע mengandung gagasan pelanggaran, bahkan pemberontakan terhadap wewenang yang sah. “Pelanggaran” cukup luas dan tidak menutup nuansa pemberontakan.
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: dan karena kesalahan-kesalahan mereka
  rationale: Preposisi kedua juga dipahami secara kausal. עָוֹן dapat menunjuk pada perbuatan salah, kebersalahan, atau akibat kesalahan; bentuk jamaknya di sini paling alami diterjemahkan sebagai berbagai kesalahan mereka.
- source_word: יִתְעַנּוּ
  choice: menderita
  rationale: Bentuk Hitpael dari ענה di sini menyatakan keadaan tertindas atau mengalami penderitaan. “Menderita” alami dalam bahasa Indonesia dan sesuai dengan kisah lampau yang sedang dipaparkan mazmur ini.
theological_decisions:
- issue: Hubungan sebab-akibat antara dosa dan penderitaan
  choice: Ayat ini menyatakan bahwa kelompok tersebut menderita karena jalan pelanggaran dan kesalahan mereka.
  alternative: Preposisi Ibrani dapat diterjemahkan secara lebih harfiah dengan “dari”, sehingga hubungan sebab-akibatnya kurang dinyatakan secara eksplisit.
  rationale: Dalam konteks puitis ini, kedua pemakaian מִן paling mungkin bersifat kausal. Terjemahan tidak memperluas pernyataan khusus ayat ini menjadi ajaran bahwa semua penderitaan selalu disebabkan oleh dosa pribadi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Orang-orang bebal” dipilih untuk menghindari kesan bahwa yang dimaksud hanyalah kekurangan intelektual. Pengulangan “karena” mempertahankan dua frasa kausal yang sejajar dalam bahasa Ibrani.
