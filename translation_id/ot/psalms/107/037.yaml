  text: They sowed fields and planted vineyards[a], and produced the fruit of the harvest.
translation:
  language: id
  text: Mereka menabur di ladang-ladang dan menanam kebun-kebun anggur, lalu menghasilkan panen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan mereka menghasilkan buah dari hasil bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרְעוּ שָׂדוֹת
  choice: menabur di ladang-ladang
  rationale: Verba זרע berarti menabur benih. Dalam bahasa Indonesia, frasa berpreposisi ini lebih alami daripada terjemahan harfiah 'menabur ladang-ladang' dan tetap mempertahankan tindakan pertanian serta bentuk jamak שָׂדוֹת.
- source_word: וַיִּטְּעוּ כְרָמִים
  choice: menanam kebun-kebun anggur
  rationale: נטע lazim berarti menanam, sedangkan כֶּרֶם menunjuk pada kebun anggur, bukan hanya tanaman anggur secara individual.
- source_word: וַיַּעֲשׂוּ פְּרִי תְבוּאָה
  choice: lalu menghasilkan panen
  rationale: עשה secara harfiah berarti membuat atau menghasilkan. Gabungan פְּרִי תְבוּאָה menyatakan hasil pertanian, tetapi padanan kata demi kata akan janggal dan berulang dalam bahasa Indonesia. 'Menghasilkan panen' menyampaikan makna idiomatisnya, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis yang sederhana. Pengulangan bentuk jamak dipertahankan pada ladang dan kebun anggur, sedangkan ungkapan akhir dibuat idiomatis tanpa menambahkan gagasan kelimpahan yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
