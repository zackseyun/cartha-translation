  text: For he shattered the doors of bronze and cut through the bars of iron[a].
translation:
  language: id
  text: Sebab Dia telah menghancurkan pintu-pintu perunggu dan mematahkan palang-palang besi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “gerbang-gerbang perunggu.” Kata Ibrani tersebut secara lebih khusus berarti “pintu-pintu”, meskipun dalam konteks ini mungkin yang dimaksud adalah gerbang berkubu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mengungkapkan alasan bagi ajakan untuk bersyukur pada ayat sebelumnya dan mempertahankan fungsi penjelas dalam bahasa Indonesia yang alami.
- source_word: שִׁבַּר
  choice: telah menghancurkan
  rationale: Bentuk intensif verba ini menggambarkan tindakan meremukkan atau menghancurkan dengan kuat; pilihan ini menyampaikan kehancuran yang tegas.
- source_word: דַּלְתוֹת
  choice: pintu-pintu
  rationale: Makna leksikalnya ialah daun pintu atau pintu; dalam konteks ini mungkin yang dimaksud adalah pintu gerbang berkubu, tetapi terjemahan utama mempertahankan istilah sumber yang lebih khusus.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks benda logam pada zaman Alkitab, kata ini lazim menunjuk pada tembaga atau paduan tembaga; 'perunggu' merupakan padanan modern yang tepat dalam gambaran ini.
- source_word: בְרִיחֵי
  choice: palang-palang
  rationale: Menunjuk pada batang pengunci yang melintang untuk mengamankan pintu atau gerbang; 'palang' jelas dan alami dalam bahasa Indonesia.
- source_word: בַרְזֶל
  choice: besi
  rationale: Padanan langsung dan baku bagi nama logam tersebut.
- source_word: גִּדֵּעַ
  choice: mematahkan
  rationale: Verba ini berarti memotong, menebas, atau memutuskan. Bersama palang besi, 'mematahkan' menghasilkan ungkapan Indonesia yang alami dan tetap menggambarkan penghancuran penghalang secara tegas.
theological_decisions:
- issue: Rujukan subjek ilahi
  choice: Dia
  alternative: TUHAN
  rationale: Teks Ibrani memakai verba orang ketiga maskulin tunggal tanpa menyebutkan subjek secara eksplisit; subjeknya merujuk kembali kepada TUHAN dalam konteks. 'Dia' mempertahankan alur wacana dan tidak menambahkan nama ilahi ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Pengulangan jamak mempertahankan paralelisme Ibrani. Huruf kapital pada 'Dia' memperjelas rujukan kepada Allah tanpa mengganti pronomina sumber dengan nama ilahi.
