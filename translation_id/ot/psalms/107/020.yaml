  text: He sent his word and healed them[a], and delivered them from their pits.
translation:
  language: id
  text: Ia mengirimkan firman-Nya dan menyembuhkan mereka; Ia meluputkan mereka dari liang kubur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini dapat berarti liang, kubur, atau kehancuran/kebinasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: mengirimkan
  rationale: Bentuk Qal imperfek dipahami dalam rangkaian penceritaan puitis tentang tindakan TUHAN pada masa lampau; “mengirimkan” menyampaikan tindakan aktif dengan wajar dalam bahasa Indonesia.
- source_word: דְּבָרוֹ
  choice: firman-Nya
  rationale: דָּבָר berarti “perkataan/firman” dan di sini menunjuk pada ucapan Allah yang berdaya. “Firman-Nya” mempertahankan ungkapan ringkas tanpa menentukan bahwa yang dimaksud adalah sosok tertentu atau sekadar perintah.
- source_word: וְיִרְפָּאֵם
  choice: dan menyembuhkan mereka
  rationale: רפא dalam Qal secara langsung berarti “menyembuhkan”; akhiran objek jamak menunjuk kepada orang-orang yang menderita dalam konteks mazmur.
- source_word: וִימַלֵּט
  choice: Ia meluputkan mereka
  rationale: Bentuk Piel dari מלט menyatakan tindakan membuat seseorang lolos atau menyelamatkannya. “Meluputkan” cocok dengan bahaya maut dalam konteks dan tetap alami dalam ragam puitis yang bermartabat.
- source_word: מִשְּׁחִיתוֹתָם
  choice: dari liang kubur
  rationale: Nomina jamak ini dapat menunjuk pada liang atau kubur, sekaligus membawa gagasan kebinasaan. “Liang kubur” mengungkapkan ancaman maut secara alami dalam bahasa Indonesia; penjamakan dan akhiran kepunyaan Ibrani tidak dinyatakan secara kaku karena “liang-liang kubur mereka” akan terdengar seolah-olah kubur itu telah menjadi milik mereka.
theological_decisions:
- issue: Kemungkinan penafsiran teologis berlebihan atas “firman-Nya”
  choice: Mempertahankan “firman-Nya” sebagai ucapan Allah yang berdaya tanpa mengidentifikasikannya sebagai pribadi tertentu.
  alternative: Menerjemahkan “perintah-Nya” atau memahami “Firman” sebagai gelar personal.
  rationale: Ayat ini menyatakan bahwa Allah mengirimkan firman-Nya untuk menyembuhkan, tetapi tidak secara eksplisit membuat identifikasi kristologis atau hipostatis.
- issue: Citra penyelamatan dari מִשְּׁחִיתוֹתָם
  choice: Memakai “liang kubur” sambil mencatat cakupan makna lainnya.
  alternative: “kebinasaan mereka” atau “liang-liang mereka”.
  rationale: Konteks berbicara tentang orang sakit yang mendekati maut. Citra liang kubur mempertahankan bahasa konkret Ibrani tanpa menutup kemungkinan makna kehancuran atau kebinasaan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Titik koma menandai dua tindakan ilahi yang sejajar. Huruf kecil pada “firman” menghindari penetapan bahwa kata itu merupakan gelar pribadi, sedangkan sufiks “-Nya” mempertahankan rujukan kepada Allah.
