  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: id
  text: Namun, Ia menempatkan orang yang kekurangan di tempat tinggi, jauh dari kesengsaraan,[a] dan membuat keluarga mereka seperti kawanan domba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengangkat orang miskin keluar dari kesengsaraan”; bagian akhir juga dapat diterjemahkan “menjadikan keluarga-keluarga seperti kawanan domba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: menempatkan ... di tempat tinggi
  rationale: Kata kerja שׂגב menyatakan pengangkatan ke tempat tinggi yang juga menyiratkan keamanan atau perlindungan. Ungkapan ini mempertahankan gambaran konkret tersebut.
- source_word: אֶבְיוֹן
  choice: orang yang berkekurangan
  rationale: אֶבְיוֹן menunjuk kepada orang yang membutuhkan atau miskin. Pilihan ini alami dalam bahasa Indonesia modern dan tidak membatasi maknanya hanya pada kemiskinan materi.
- source_word: מֵעֹנִי
  choice: jauh dari kesengsaraan
  rationale: עֹנִי dapat berarti kesengsaraan, penderitaan, atau kemiskinan. Kata depan מִן menyatakan pemisahan, sehingga 'jauh dari' memperjelas bahwa orang itu dilepaskan dari keadaannya yang sengsara.
- source_word: וַיָּשֶׂם
  choice: membuat
  rationale: Dalam konstruksi dengan כְּ, kata שׂים menyatakan bahwa Allah menjadikan keluarga-keluarga itu seperti kawanan domba.
- source_word: כַּצֹּאן
  choice: seperti kawanan domba
  rationale: צֹאן merupakan nomina kolektif untuk ternak kecil, terutama domba dan kambing. 'Kawanan domba' mempertahankan gambaran pastoral serta kesan bertambah banyak dan terpelihara.
- source_word: מִשְׁפָּחוֹת
  choice: keluarga mereka
  rationale: Teks Ibrani secara harfiah hanya menyebut 'keluarga-keluarga'. Kata ganti 'mereka' disediakan secara idiomatis untuk menghubungkannya dengan orang yang berkekurangan tanpa mengubah maksud ayat.
theological_decisions:
- issue: Kata ganti milik yang tersirat pada מִשְׁפָּחוֹת
  choice: keluarga mereka
  alternative: keluarga-keluarga
  rationale: Bahasa Ibrani tidak mencantumkan akhiran kepunyaan, tetapi konteks menghubungkan keluarga-keluarga itu dengan orang yang berkekurangan. Penambahan 'mereka' membuat hubungan tersebut jelas dalam bahasa Indonesia tanpa memasukkan klaim teologis baru.
- issue: Gambaran pengangkatan dalam וַיְשַׂגֵּב
  choice: menempatkan ... di tempat tinggi, jauh dari kesengsaraan
  alternative: mengangkat ... keluar dari kesengsaraan
  rationale: Pilihan utama mempertahankan sekaligus gagasan ketinggian dan pemisahan dari kesengsaraan, tanpa memutuskan apakah tekanannya terutama pada peninggian kedudukan atau perlindungan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Kata ganti ilahi ditulis dengan huruf kapital mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Koma sebelum penanda catatan kaki mempertahankan keterbacaan kalimat.
