  yaml_path: translation/ot/psalms/107/018.yaml
  text: Their soul loathed all food[a], and they drew near to the gates of death.
translation:
  language: id
  text: Jiwa mereka muak terhadap segala makanan[a], dan mereka mendekati gerbang-gerbang maut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Selera makan mereka muak terhadap segala makanan,” atau secara sederhana, “Mereka muak terhadap segala makanan.” Kata Ibrani yang diterjemahkan “jiwa” (נַפְשָׁם) dapat menunjuk pada diri batin, kehidupan, atau selera makan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: segala makanan
  rationale: Frasa ini menyatakan keseluruhan makanan secara kolektif. 'Segala makanan' alami dalam bahasa Indonesia dan mempertahankan cakupan כָּל.
- source_word: תְּתַעֵב
  choice: muak terhadap
  rationale: Bentuk Piel menyatakan rasa jijik atau penolakan yang kuat. 'Muak terhadap' jelas dan alami dalam konteks orang sakit yang tidak tahan melihat atau menyantap makanan.
- source_word: נַפְשָׁם
  choice: jiwa mereka
  rationale: נֶפֶשׁ dapat menunjuk pada jiwa, diri, kehidupan, atau selera makan. 'Jiwa mereka' mempertahankan gambaran dan keluasan antropologis teks Ibrani, sementara catatan kaki menjelaskan nuansa kontekstualnya.
- source_word: וַיַּגִּיעוּ עַד
  choice: mereka mendekati
  rationale: Dalam konteks ini ungkapan tersebut menggambarkan sampainya mereka hingga dekat pada suatu batas, yakni ambang kematian, tanpa menyatakan bahwa mereka telah melewatinya.
- source_word: שַׁעֲרֵי מָוֶת
  choice: gerbang-gerbang maut
  rationale: Bentuk jamak konstruksi secara harfiah berarti 'gerbang-gerbang maut' dan menjadi metafora bagi ambang kematian. Bentuk ini mempertahankan citra serta jumlah gramatikal sumber.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks sakit parah
  choice: jiwa mereka
  alternative: diri mereka; selera makan mereka; mereka
  rationale: Teks memakai נֶפֶשׁ sebagai subjek, bukan sekadar pronomina. Terjemahan utama mempertahankan tekstur antropologisnya dan tidak membatasinya hanya pada selera fisik, sedangkan catatan kaki menjaga kemungkinan nuansa 'selera makan' dalam konteks.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. 'Maut' dipilih untuk menjaga warna puitis metafora, sedangkan 'gerbang-gerbang' mempertahankan bentuk jamak Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah frasa terkait.
