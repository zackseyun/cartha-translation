  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: id
  text: Ia memberkati mereka, dan mereka bertambah sangat banyak; Ia tidak membiarkan ternak mereka berkurang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ternak mereka tidak berkurang.” Kata kerja Ibrani berbentuk tunggal dan dapat dipahami dengan Allah sebagai subjek yang berlanjut (“Ia tidak membiarkan ...”) atau sebagai pernyataan hasil.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: Ia memberkati mereka
  rationale: Bentuk piel dari ברך dengan akhiran orang ketiga jamak menyatakan pemberian berkat atau kemakmuran. Subjek tunggal, yaitu Allah dalam konteks mazmur, dipertahankan dengan 'Ia'.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: sehingga mereka bertambah sangat banyak
  rationale: רבה menyatakan pertambahan jumlah dan מְאֹד memperkuat tingkat pertambahan itu. 'Bertambah sangat banyak' alami dalam bahasa Indonesia serta mempertahankan hubungan hasil yang tersirat dengan berkat sebelumnya.
- source_word: וּבְהֶמְתָּם
  choice: ternak mereka
  rationale: בְּהֵמָה di sini merupakan sebutan kolektif bagi hewan peliharaan yang menjadi milik atau sumber penghidupan; 'ternak' tepat dan tidak sesempit 'lembu'.
- source_word: לֹא יַמְעִיט
  choice: Ia tidak membiarkan ... berkurang
  rationale: Bentuk hiphil dari מעט bersifat kausatif, 'membuat sedikit' atau 'mengurangi'. Ungkapan ini menyampaikan secara idiomatis bahwa Allah tidak menyebabkan atau membiarkan ternak mereka menyusut, sambil mempertahankan subjek tunggal dari klausa sebelumnya.
theological_decisions:
- issue: Subjek klausa terakhir
  choice: 'Allah tetap menjadi subjek: ''Ia tidak membiarkan ternak mereka berkurang.'''
  alternative: '''Ternak mereka tidak berkurang.'''
  rationale: Kata kerja Ibrani berbentuk tunggal dan paling wajar dipahami dengan Allah sebagai kelanjutan subjek tunggal pada 'Ia memberkati mereka'. Namun, susunan Ibrani juga memungkinkan klausa terakhir dipahami sebagai pernyataan hasil; alternatif itu dicatat tanpa menghapus ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk rujukan ilahi, sedangkan 'ternak' mudah dipahami dan mencakup hewan peliharaan secara kolektif. Hubungan berkat dan pertambahan dinyatakan dengan 'sehingga' agar alami tanpa mengubah isi.
