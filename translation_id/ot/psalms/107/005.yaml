  yaml_path: translation/ot/psalms/107/005.yaml
  text: Hungry and thirsty[b][a], their soul fainted within them.
translation:
  language: id
  text: Mereka lapar dan haus; jiwa mereka[a] melemah di dalam diri mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyawa mereka” atau “mereka sendiri”; kata Ibrani nefesh dapat berarti jiwa, nyawa, atau diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵבִים
  choice: lapar
  rationale: Kata sifat ini secara langsung berarti ‘lapar’; pilihan ini tidak melebihkan intensitas menjadi ‘kelaparan’.
- source_word: גַּם
  choice: dan
  rationale: Di sini גַּם menghubungkan keadaan lapar dengan keadaan haus secara aditif. ‘Dan’ merupakan ungkapan Indonesia yang alami dalam pasangan ini, sedangkan ‘dan juga’ terasa kaku.
- source_word: צְמֵאִים
  choice: haus
  rationale: Padanan baku dan langsung untuk kata sifat yang berarti ‘haus’.
- source_word: נַפְשָׁם
  choice: jiwa mereka
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, atau diri. ‘Jiwa mereka’ mempertahankan gambaran antropologis Ibrani dan tidak menutup kemungkinan makna lainnya, yang dicatat dalam catatan kaki.
- source_word: בָּהֶם
  choice: di dalam diri mereka
  rationale: 'Frasa ini menyatakan lokasi batin: jiwa atau daya hidup mereka melemah dalam diri mereka sendiri.'
- source_word: תִּתְעַטָּף
  choice: merana
  rationale: Dalam konteks ini verba tersebut menggambarkan kekuatan batin yang menyusut atau menjadi lemah. ‘Merana’ menyampaikan keadaan melemah berkepanjangan akibat lapar dan haus tanpa menyiratkan bahwa mereka benar-benar kehilangan kesadaran.
