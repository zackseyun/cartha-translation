  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: id
  text: Di sana ia membuat orang-orang yang lapar menetap, dan mereka mendirikan sebuah kota untuk dihuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebuah kota sebagai tempat tinggal.”'
    reason: Alternatif ini menerjemahkan מוֹשָׁב dengan frasa nominal yang lebih formal.
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: ia menempatkan
  rationale: Bentuk Hifil dari ישׁב menyatakan tindakan kausatif, yaitu membuat orang menetap atau tinggal. “Menempatkan” terdengar alami dalam bahasa Indonesia dan, bersama konteksnya, menyiratkan bahwa mereka dibuat menetap di sana.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan langsung dan wajar bagi keterangan tempat ini.
- source_word: רְעֵבִים
  choice: orang-orang yang lapar
  rationale: Kata sifat ini dipakai secara substantival untuk menyebut sekelompok orang yang mengalami kelaparan.
- source_word: וַיְכוֹנְנוּ
  choice: mereka mendirikan
  rationale: Dalam kaitannya dengan sebuah kota, verba כון di sini menyatakan tindakan membentuk atau menegakkan suatu permukiman secara mantap. “Mendirikan” merupakan ungkapan Indonesia yang alami tanpa terlalu menentukan proses pembangunannya.
- source_word: עִיר
  choice: sebuah kota
  rationale: “Kota” adalah arti lazim עִיר dalam pemakaian Alkitab, sedangkan “sebuah” menandai nomina tak tentu secara alami dalam konteks ini.
- source_word: מוֹשָׁב
  choice: untuk dihuni
  rationale: מוֹשָׁב menunjuk pada tempat tinggal atau hunian. Dalam frasa עִיר מוֹשָׁב, “kota untuk dihuni” menyampaikan fungsi kota itu dengan bahasa Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Subjek tersirat dari verba tunggal וַיּוֹשֶׁב
  choice: Subjeknya dipahami sebagai Allah dari konteks dan diterjemahkan dengan “ia”.
  alternative: Subjek yang tidak ditentukan, seperti “seseorang menempatkan”.
  rationale: Ayat-ayat di sekitarnya menceritakan tindakan TUHAN, sehingga verba tunggal ini secara alami meneruskan subjek tersebut. Nama atau gelar ilahi tidak ditambahkan karena teks Ibrani ayat ini sendiri hanya menyiratkan subjeknya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti “ia” dipertahankan tanpa menambahkan nama ilahi yang tidak tertulis dalam ayat ini; huruf kecil mengikuti ejaan umum dan tidak menjadikan kapitalisasi kata ganti sebagai penanda teologis.
