  text: הֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: id
  text: Bersyukurlah kepada Yahweh, sebab Dia baik, sebab kasih setia-Nya[a] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasih-Nya yang setia untuk selama-lamanya.” Kata Ibrani חֶסֶד mencakup kasih, kesetiaan, dan loyalitas dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: Bersyukurlah
  rationale: Bentuk imperatif jamak Hifil dari ידה dalam konteks mazmur merupakan ajakan kepada umat untuk mengucap syukur; bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang dituju oleh ucapan syukur, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: כִּי
  choice: sebab
  rationale: Kedua kemunculannya memperkenalkan alasan bagi ajakan untuk bersyukur; pengulangan 'sebab' mempertahankan susunan dan daya retoris bahasa Ibrani.
- source_word: טוֹב
  choice: baik
  rationale: Padanan langsung ini mempertahankan cakupan luas sifat baik Allah, termasuk kebaikan moral dan kemurahan-Nya, tanpa mempersempit makna.
- source_word: לְעוֹלָם
  choice: kekal selama-lamanya
  rationale: Frasa ini menyatakan keberlangsungan tanpa akhir. Ungkapan Indonesia tersebut alami dalam ragam mazmur dan menyampaikan penegasan duratif teks.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד memadukan kasih, kesetiaan, dan loyalitas relasional atau perjanjian. 'Kasih setia' merupakan padanan Indonesia yang ringkas dan mempertahankan keluasan itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menyebut nama perjanjian ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Penerjemahan חֶסֶד
  choice: kasih setia
  alternative: kesetiaan pada perjanjian, belas kasih, atau kasih yang teguh
  rationale: '''Kasih setia'' menjaga perpaduan kasih dan loyalitas yang terkandung dalam istilah tersebut tanpa membatasinya hanya pada belas kasih atau aspek hukum perjanjian.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'sebab' mempertahankan paralelisme Ibrani; 'Dia' dan akhiran '-Nya' dikapitalisasi sesuai kebiasaan umum penulisan rujukan kepada Allah.
