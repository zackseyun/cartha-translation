source:
  edition: WLC
  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: id
  text: Nyanyikanlah pujian bagi Yahweh, yang berdiam di Sion[a]; beritakanlah perbuatan-perbuatan-Nya di antara bangsa-bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang bertakhta di Sion.”
    reason: Partisip יֹשֵׁב dapat berarti berdiam atau duduk; dalam konteks Yahweh di Sion, ungkapan ini juga dapat menyiratkan gambaran bertakhta sebagai Raja.
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Bernyanyilah memuji
  rationale: Bentuk perintah jamak dari זמר memadukan tindakan bernyanyi dengan tujuan memuji; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya musikal serta ibadahnya.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh” untuk mempertahankan nama perjanjian yang hadir secara langsung dalam teks Ibrani.
- source_word: יֹשֵׁב צִיּוֹן
  choice: yang berdiam di Sion
  rationale: Partisip יֹשֵׁב dapat menyatakan tinggal atau duduk/bertakhta. “Berdiam” mempertahankan gagasan kehadiran ilahi tanpa menetapkan secara berlebihan citra kerajaan yang hanya tersirat.
- source_word: הַגִּידוּ
  choice: beritakanlah
  rationale: Bentuk perintah Hifil ini menyerukan penyampaian secara terbuka. “Beritakanlah” terdengar wajar, bermartabat, dan lebih publik daripada sekadar “ceritakanlah”.
- source_word: בָעַמִּים
  choice: di antara bangsa-bangsa
  rationale: Preposisi ב paling alami diterjemahkan “di antara,” sedangkan bentuk jamak עַמִּים menunjuk pada berbagai kelompok bangsa.
- source_word: עֲלִילוֹתָיו
  choice: perbuatan-perbuatan-Nya
  rationale: Kata ini menunjuk pada tindakan atau perbuatan yang dilakukan-Nya. Bentuk ulang menyampaikan kemajemukan Ibrani tanpa menambahkan sifat “perkasa” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar, tanpa memasukkan bentuk vokalisasi alternatif ke dalam teks utama.
- issue: Nuansa יֹשֵׁב צִיּוֹן
  choice: yang berdiam di Sion
  alternative: yang bertakhta di Sion
  rationale: Frasa ini dapat menggambarkan kehadiran Yahweh di Sion sekaligus menyiratkan pemerintahan-Nya sebagai Raja. Teks utama memakai makna “berdiam,” sementara kemungkinan nuansa kerajaan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan bentuk perintah yang jelas. Kapitalisasi “-Nya” mengikuti kebiasaan hormat dalam penulisan religius Indonesia. Tanda titik koma mempertahankan kesejajaran dua seruan dalam ayat.
