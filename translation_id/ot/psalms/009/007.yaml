  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: id
  text: Namun Yahweh bertakhta[a] selama-lamanya; Ia telah menegakkan takhta-Nya untuk penghakiman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “duduk”. Dalam konteks ini, duduk di takhta menyatakan pemerintahan sebagai Raja.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Ia telah menyiapkan takhta-Nya untuk keadilan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Namun Yahweh
  rationale: Konjungsi waw dipahami secara adversatif berdasarkan kontras dengan kebinasaan orang fasik pada konteks sebelumnya. Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; pilihan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: יֵשֵׁב
  choice: bertakhta
  rationale: Secara harfiah berarti “duduk”, tetapi konteks takhta dan penghakiman memberi nuansa kerajaan. “Bertakhta” menyampaikan nuansa itu dengan wajar; arti harfiahnya dicatat dalam catatan kaki.
- source_word: כּוֹנֵן
  choice: telah menegakkan
  rationale: Bentuk polel menyatakan tindakan membuat kokoh atau menetapkan. “Telah menegakkan” mempertahankan gambaran takhta yang dibuat teguh dan tindakan yang sudah tuntas.
- source_word: לַמִּשְׁפָּט
  choice: untuk menghakimi
  rationale: מִשְׁפָּט dapat berarti penghakiman atau keadilan. Dalam hubungan dengan takhta sebagai tempat tindakan yudisial, bentuk verbal “untuk menghakimi” terdengar alami tanpa meniadakan alternatif “untuk keadilan”.
- source_word: כִּסְאוֹ
  choice: takhta-Nya
  rationale: Padanan langsung bagi nomina dengan sufiks posesif orang ketiga tunggal, merujuk kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Nuansa kerajaan dalam יֵשֵׁב
  choice: bertakhta
  alternative: duduk
  rationale: Penyebutan takhta dan penghakiman dalam klausa berikutnya menunjukkan suasana kerajaan-yudisial. “Bertakhta” membuat nuansa kontekstual itu jelas, sementara catatan kaki mempertahankan arti leksikal harfiahnya.
- issue: Cakupan makna מִשְׁפָּט
  choice: menghakimi
  alternative: menegakkan keadilan
  rationale: Makna yudisial paling dekat dengan gambaran takhta, tetapi istilah Ibrani juga dapat menunjuk pada keadilan; alternatif tersebut dicatat agar ketegangan semantis tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Kapitalisasi pronomina ilahi mengikuti gaya teks ini; tanda hubung pada “takhta-Nya” mengikuti kaidah EYD untuk bentuk terikat pada nama atau sebutan ilahi.
