  text: I will rejoice and exult in you[a]; I will sing praise to your name[b], Most High.
translation:
  language: id
  text: Aku hendak bersukacita dan bersorak gembira di dalam Engkau[a]; aku hendak menyanyikan pujian bagi nama-Mu, ya Yang Mahatinggi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena Engkau.”
    reason: lexical_alternative
  - marker: b
    text: “Yang Mahatinggi” adalah gelar bagi Allah.
