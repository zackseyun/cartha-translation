lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: Aku hendak bersukacita
  rationale: Kata שׂמח menyatakan kegembiraan atau sukacita. Bentuk orang pertama ini memiliki nuansa tekad atau kehendak, sehingga “hendak” lebih tepat daripada sekadar pernyataan keadaan.
- source_word: וְאֶעֶלְצָה
  choice: dan bersorak gembira
  rationale: Kata עלץ mengungkapkan kegembiraan yang meluap. “Bersorak gembira” membedakannya dari kata kerja sebelumnya dan tetap alami dalam bahasa Indonesia.
- source_word: בָךְ
  choice: dalam Engkau
  rationale: Preposisi ב di sini paling langsung menyatakan bahwa Allah menjadi pusat atau lingkup sukacita pemazmur. Ungkapan ini mempertahankan gambaran Ibrani tanpa mengubahnya menjadi hubungan sebab-akibat yang pasti.
- source_word: אֲזַמְּרָה
  choice: aku hendak menyanyikan pujian
  rationale: Dalam bentuk piel, זמר lazim berarti bernyanyi atau bermusik sebagai pujian. Terjemahan ini menyatakan daya pujiannya dengan jelas dan mempertahankan nuansa tekad.
- source_word: שִׁמְךָ
  choice: bagi nama-Mu
  rationale: Dengan kata kerja זמר, “bagi nama-Mu” merupakan ungkapan Indonesia yang wajar. Istilah “nama” dipertahankan karena menunjuk kepada pribadi dan kemasyhuran Allah tanpa perlu diperluas secara tafsiriah.
- source_word: עֶלְיוֹן
  choice: ya Yang Mahatinggi
  rationale: עֶלְיוֹן merupakan gelar ilahi yang berarti “Yang Mahatinggi” dan di sini berfungsi sebagai sapaan langsung. Partikel “ya” membuat fungsi sapaan itu jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna preposisi בָךְ sebagai pusat sukacita
  choice: dalam Engkau
  alternative: karena Engkau
  rationale: “Dalam Engkau” mempertahankan kemungkinan bahwa Allah adalah lingkup atau objek sukacita. “Karena Engkau” lebih idiomatis, tetapi dapat mempersempit maknanya menjadi sebab saja.
- issue: Penerjemahan gelar ilahi עֶלְיוֹן
  choice: ya Yang Mahatinggi
  alternative: Yang Mahatinggi
  rationale: Gelar ilahi dipertahankan tanpa penjelasan doktrinal tambahan. “Ya” menandai fungsi vokatif yang tersirat dalam konteks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan “aku hendak” mempertahankan kesejajaran serta nuansa tekad dalam kedua bentuk verba Ibrani. Kapitalisasi pada kata ganti ilahi dan gelar mengikuti kebiasaan umum penerbitan Alkitab berbahasa Indonesia.
