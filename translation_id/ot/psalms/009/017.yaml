  yaml_path: translation/ot/psalms/009/017.yaml
  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: id
  text: Orang-orang fasik akan kembali[a] ke Syeol[b]—semua bangsa yang melupakan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbalik ke Syeol.” Kata kerja Ibrani ini dapat berarti “kembali” atau “berbalik.”
    reason: lexical_alternative
  - marker: b
    text: Syeol adalah istilah Ibrani untuk alam orang mati; maknanya tidak sama persis dengan konsep “neraka” yang muncul kemudian dan lebih khusus.
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: akan kembali
  rationale: Bentuk Qal imperfek orang ketiga jamak dari שׁוב dapat berarti “kembali” atau “berbalik.” “Akan kembali” mempertahankan gambaran gerak menuju Syeol tanpa menafsirkannya sekadar sebagai kebinasaan kiasan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak substantival ini menunjuk kepada orang yang jahat secara moral. “Orang-orang fasik” merupakan ungkapan Indonesia yang jelas, wajar, dan tetap bermartabat.
- source_word: לִשְׁאוֹלָה
  choice: ke Syeol
  rationale: Syeol adalah istilah Ibrani bagi alam orang mati. Transliterasi mempertahankan konsep sumber dan menghindari penyempitan menjadi “kubur” atau penafsiran yang terlalu khusus sebagai “neraka.”
- source_word: כָּל גּוֹיִם
  choice: semua bangsa
  rationale: גּוֹיִם berarti bangsa-bangsa atau suku-suku bangsa. “Semua bangsa” menyampaikan cakupan menyeluruh כָּל tanpa memasukkan pertentangan Israel-bukan Israel yang tidak dinyatakan secara eksplisit.
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: yang melupakan Allah
  rationale: Frasa partisip konstruksi ini menggambarkan bangsa-bangsa berdasarkan ciri mereka. Klausa relatif “yang melupakan Allah” alami dalam bahasa Indonesia dan mempertahankan nuansa tindakan atau sikap yang menjadi kebiasaan.
theological_decisions:
- issue: Makna שְׁאוֹל dalam konteks penghakiman
  choice: Istilah ini ditransliterasikan sebagai “Syeol.”
  alternative: alam orang mati; kubur; neraka
  rationale: Walaupun ayat ini berbicara tentang nasib orang fasik, kata Ibraninya sendiri tidak harus berarti konsep “neraka” yang lebih khusus dalam perkembangan teologi kemudian. Transliterasi mempertahankan ketepatan dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Tanda pisah mempertahankan hubungan penjelas antara “orang-orang fasik” dan “semua bangsa yang melupakan Allah.”
