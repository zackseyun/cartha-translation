source:
  edition: WLC
  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: id
  text: Aku akan bersyukur kepada Yahweh dengan segenap hatiku; aku akan menceritakan segala perbuatan-Mu yang ajaib.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “segala keajaiban-Mu” atau “segala karya-Mu yang menakjubkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: Aku akan bersyukur
  rationale: Bentuk hiphil dari ידה dalam konteks ibadah menyatakan ucapan syukur atau pujian. “Bersyukur kepada” secara alami menonjolkan nuansa syukur tanpa meniadakan unsur pujian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: בְּכָל לִבִּי
  choice: dengan segenap hatiku
  rationale: Ungkapan ini mempertahankan gagasan pengabdian batin yang utuh dan terdengar alami serta bermartabat dalam bahasa Indonesia.
- source_word: אֲסַפְּרָה
  choice: aku akan menceritakan
  rationale: Kata kerja ספר di sini berarti menuturkan atau mengisahkan; “menceritakan” jelas dan alami bagi pembaca modern.
- source_word: כָּל
  choice: segenap / segala
  rationale: Daya cakup כָּל dipertahankan dalam kedua bagian ayat, dengan padanan idiomatis yang sesuai bagi “hati” dan “perbuatan”.
- source_word: נִפְלְאוֹתֶיךָ
  choice: segala perbuatan-Mu yang ajaib
  rationale: Bentuk jamak ini menunjuk pada tindakan-tindakan luar biasa yang membangkitkan kekaguman. Padanan ini mempertahankan baik unsur tindakan maupun keajaibannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan נִפְלְאוֹתֶיךָ
  choice: perbuatan-Mu yang ajaib
  alternative: keajaiban-keajaiban-Mu
  rationale: Pilihan utama menampilkan nuansa tindakan ilahi yang terkandung dalam konteks pemazmuran, sementara kemungkinan makna yang lebih ringkas dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi, khidmat, dan mudah dipahami. Huruf kapital pada “-Mu” mengikuti konvensi umum untuk rujukan kepada Allah.
