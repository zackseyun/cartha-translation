  text: כִּֽי עָ֭שִׂיתָ מִשְׁפָּטִ֣/י וְ/דִינִ֑/י יָשַׁ֥בְתָּ לְ֝/כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/004.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: id
  text: Sebab Engkau telah membela hakku dan perkaraku[a]; Engkau duduk di takhta, menghakimi dengan adil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menegakkan hakku dan perkaraku” atau “telah memenangkan hakku dan gugatanku.” Bahasa Ibrani memakai dua istilah hukum yang berpasangan untuk hak atau tuntutan yang dibenarkan dan perkara hukum.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai hakim yang adil.” Secara harfiah, bahasa Ibrani memakai kata benda “keadilan” dalam ungkapan “menghakimi dengan keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menunjukkan alasan bagi pujian dalam konteks sebelumnya dan mempertahankan hubungan sebab-akibat.
- source_word: עָשִׂיתָ
  choice: telah membela
  rationale: Secara harfiah berarti 'melakukan', tetapi bersama istilah hukum מִשְׁפָּט dan דִּין menyatakan tindakan menegakkan atau memenangkan hak seseorang. 'Membela' menyampaikan pemulihan hukum secara alami.
- source_word: מִשְׁפָּטִי
  choice: hakku
  rationale: Dalam konteks hukum, kata ini dapat menunjuk pada hak atau tuntutan yang adil milik pemazmur.
- source_word: וְדִינִי
  choice: dan perkaraku
  rationale: דִּין menunjuk pada perkara atau kasus hukum; pilihan ini mempertahankan pasangan istilah hukum tanpa meleburkan keduanya.
- source_word: יָשַׁבְתָּ לְכִסֵּא
  choice: Engkau duduk di takhta
  rationale: Mempertahankan gambaran Allah yang bertakhta sekaligus menjalankan fungsi pengadilan.
- source_word: שׁוֹפֵט
  choice: sebagai hakim
  rationale: Partisip ini menggambarkan peran Allah ketika duduk di takhta; bentuk nominal ini alami dalam bahasa Indonesia.
- source_word: צֶדֶק
  choice: yang adil
  rationale: Nomina 'kebenaran/keadilan' berfungsi secara adverbial atau menggambarkan hakim. Ungkapan ini menyampaikan bahwa penghakiman-Nya dilakukan dengan adil.
theological_decisions:
- issue: Gambaran pengadilan ilahi
  choice: Allah digambarkan sebagai hakim yang bertakhta dan membela hak serta perkara pemazmur.
  alternative: Allah secara umum bertindak demi kepentingan pemazmur.
  rationale: Gabungan מִשְׁפָּט, דִּין, takhta, dan hakim secara kuat membentuk latar pengadilan. Terjemahan mempertahankan gambaran itu tanpa menambahkan kategori doktrinal lain.
- issue: Hubungan צֶדֶק dengan שׁוֹפֵט
  choice: sebagai hakim yang adil
  alternative: menghakimi dengan adil
  rationale: Bahasa Ibrani memakai nomina 'keadilan/kebenaran' setelah partisip 'menghakimi'. Susunannya dapat dipahami secara adverbial; terjemahan utama memakai ungkapan Indonesia yang alami, sedangkan bentuk yang lebih verbal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti untuk Allah mengikuti gaya umum penerbitan Alkitab Indonesia. Istilah hukum dibuat jelas bagi pembaca umum, sementara alternatif yang lebih harfiah dipertahankan dalam catatan kaki.
