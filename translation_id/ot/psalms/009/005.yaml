  text: גָּעַ֣רְתָּ ג֭וֹיִם אִבַּ֣דְתָּ רָשָׁ֑ע שְׁמָ֥/ם מָ֝חִ֗יתָ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/005.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: id
  text: Engkau telah menghardik bangsa-bangsa; Engkau telah membinasakan orang fasik[a]; Engkau telah menghapus nama mereka[b] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “si fasik”; bentuk Ibraninya tunggal dan dapat dipahami sebagai seorang individu atau secara kolektif sebagai golongan orang fasik.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah “nama mereka”; dalam konteks ini, ungkapan tersebut menyiratkan lenyapnya ingatan tentang mereka atau kemasyhuran mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: Engkau telah menghardik
  rationale: Kata kerja גער menyatakan teguran keras yang berdaya dan berwibawa. “Menghardik” mempertahankan kekuatan tindakan itu dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks penghakiman mazmur ini, גוים menunjuk kepada bangsa-bangsa sebagai kelompok-kelompok manusia; terjemahan ini tidak memasukkan kontras keagamaan yang tidak dinyatakan dalam ayat.
- source_word: אִבַּדְתָּ
  choice: Engkau telah membinasakan
  rationale: Bentuk piel dari אבד menyatakan tindakan menyebabkan binasa atau menghancurkan. “Membinasakan” tepat untuk konteks penghakiman dan tetap wajar dalam register Alkitab Indonesia modern.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini dapat berfungsi secara generik atau kolektif. “Orang fasik” dapat menyatakan golongan secara generik tanpa meniadakan kemungkinan rujukan kepada seorang individu.
- source_word: שְׁמָם
  choice: nama mereka
  rationale: Terjemahan harfiah ini mempertahankan metafora Ibrani. Dalam konteks, “nama” juga mencakup ingatan atau kemasyhuran mereka, yang dijelaskan dalam catatan kaki.
- source_word: מָחִיתָ
  choice: Engkau telah menghapus
  rationale: מחה berarti menghapus atau melenyapkan, khususnya dari ingatan atau catatan. “Menghapus” mempertahankan gambaran konkret dan berpadu alami dengan “nama mereka”.
- source_word: לְעוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Ungkapan berpasangan ini menegaskan durasi tanpa akhir. “Untuk selama-lamanya” menyampaikan daya penegasan tersebut secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna kolektif atau individual dari רָשָׁע
  choice: 'Makna generik/kolektif: “orang fasik”'
  alternative: 'Makna individual: “si fasik” atau “orang fasik itu”'
  rationale: Nomina/adjektiva tunggal Ibrani dapat menunjuk kepada suatu golongan secara generik atau kepada seorang individu. Kesejajaran dengan “bangsa-bangsa” dan sufiks jamak pada “nama mereka” mendukung makna kolektif, tetapi ambiguitas asli tetap dicatat.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pengulangan “Engkau telah” mempertahankan susunan tindakan ilahi yang tegas dalam teks Ibrani. Tanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskan: רָשָׁע dan שְׁמָם.'
