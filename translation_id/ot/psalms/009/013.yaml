base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: id
  text: Kasihanilah aku[a], ya Yahweh; lihatlah penderitaanku akibat orang-orang yang membenci aku, Engkau yang mengangkat aku dari gerbang-gerbang maut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bermurah hatilah kepadaku.”'
    reason: lexical_alternative
  - marker: b
    text: “Gerbang-gerbang maut” adalah gambaran Ibrani tentang berada di ambang atau di bawah kuasa maut.
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: Kasihanilah aku
  rationale: Bentuk imperatif חנן dengan akhiran orang pertama tunggal memohon kemurahan atau belas kasihan. “Kasihanilah aku” merupakan ungkapan doa yang alami dalam bahasa Indonesia dan tetap menyampaikan permohonan akan kemurahan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: רְאֵה
  choice: lihatlah
  rationale: Imperatif ראה diterjemahkan secara langsung sebagai permohonan agar Yahweh memperhatikan keadaan pemazmur.
- source_word: עָנְיִי
  choice: penderitaanku
  rationale: עֳנִי mencakup kesengsaraan, penindasan, atau penderitaan. “Penderitaanku” alami bagi pembaca modern tanpa membatasi penderitaan itu pada segi fisik ataupun batin.
- source_word: מִשֹּׂנְאַי
  choice: akibat orang-orang yang membenci aku
  rationale: Preposisi מִן dipahami sebagai penanda sumber atau penyebab penderitaan. “Akibat” memperjelas hubungan itu dalam bahasa Indonesia tanpa menambahkan pelaku yang tidak tersirat dalam teks.
- source_word: מְרוֹמְמִי
  choice: Engkau yang mengangkat aku
  rationale: Partisipel Polel dari רום dengan akhiran orang pertama tunggal berfungsi sebagai sapaan kepada Yahweh, yakni Dia yang meninggikan atau mengangkat pemazmur.
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: dari pintu-pintu gerbang maut
  rationale: Terjemahan ini mempertahankan bentuk jamak dan gambaran konkret Ibrani tentang ambang atau kuasa maut, tanpa memasukkan “Syeol”, yang tidak terdapat dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Hubungan sintaksis מִשֹּׂנְאַי dengan עָנְיִי
  choice: “akibat orang-orang yang membenci aku” menerangkan sumber penderitaan
  alternative: 'Memisahkannya sebagai permohonan lain: “lihatlah penderitaanku; [lihatlah] orang-orang yang membenci aku”'
  rationale: Urutan dan konstruksi Ibrani paling wajar menunjukkan penderitaan yang timbul dari orang-orang yang membenci pemazmur; pilihan ini tidak menambahkan imperatif kedua.
- issue: Gambaran “pintu-pintu gerbang maut”
  choice: Mempertahankan metafora Ibrani
  alternative: Menjelaskannya dalam teks utama sebagai “ketika aku berada di ambang kematian”
  rationale: Metafora tersebut dapat menunjuk pada kedekatan dengan maut maupun kuasanya. Mempertahankannya menghindari penyempitan makna teologis dan puitis.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Sapaan “ya Yahweh” dan kapitalisasi “Engkau” mempertahankan nada doa; metafora puitis sumber dipertahankan, sedangkan hubungan penyebab penderitaan dibuat alami dalam bahasa Indonesia.
