  text: When my enemies turn back[a], they stumble and perish before you.
translation:
  language: id
  text: Ketika musuh-musuhku mundur, mereka tersandung dan binasa di hadapan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadirat-Mu”; secara harfiah, “dari hadapan/wajah-Mu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Ketika ... berbalik
  rationale: Preposisi ב dengan infinitif konstruk שׁוּב membentuk anak kalimat waktu. “Ketika ... berbalik” menyampaikan nilai temporalnya secara alami.
- source_word: אוֹיְבַי
  choice: musuh-musuhku
  rationale: Nomina אוֹיֵב dengan sufiks orang pertama tunggal secara langsung berarti “musuh-musuhku”.
- source_word: אָחוֹר
  choice: mundur
  rationale: Kata ini berfungsi secara adverbial bersama שׁוּב dan menunjukkan gerakan berbalik ke belakang atau mundur.
- source_word: יִכָּשְׁלוּ
  choice: mereka tersandung
  rationale: Bentuk Nifal dari כשל mempertahankan gambaran tersandung atau goyah tanpa langsung menyamakannya dengan kebinasaan akhir.
- source_word: וְיֹאבְדוּ
  choice: dan binasa
  rationale: Verba אבד dalam Qal dapat berarti binasa atau lenyap. “Binasa” cocok dengan paralelisme puitis dan tidak menentukan lebih jauh bentuk kehancurannya.
- source_word: מִפָּנֶיךָ
  choice: di hadapan-Mu
  rationale: Ungkapan ini secara harfiah berarti “dari hadapan/wajah-Mu” dan dapat menunjuk pada keruntuhan musuh di hadirat Allah. “Di hadapan-Mu” alami dalam bahasa Indonesia sambil mempertahankan daya relasional-spasialnya.
theological_decisions:
- issue: Peran ilahi dalam kebinasaan para musuh
  choice: Ayat menyatakan bahwa para musuh tersandung dan binasa di hadapan Allah tanpa menjelaskan lebih jauh mekanisme tindakan-Nya.
  alternative: Allah secara langsung membinasakan mereka, atau mereka runtuh semata-mata karena hadirat-Nya.
  rationale: Teks Ibrani hanya menyatakan bahwa mereka tersandung dan binasa “dari/di hadapan” Allah. Terjemahan mempertahankan daya teologis dan ketegangan itu tanpa menambahkan cara penghakiman yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pada “-Mu” mengikuti kebiasaan penghormatan kepada Allah. Ungkapan “berbalik mundur” mempertahankan kedua unsur Ibrani, sedangkan catatan kaki menjaga kemungkinan nuansa kausal atau kehadiran dalam מִפָּנֶיךָ.
