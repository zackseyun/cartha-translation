id: PSA.9.16
reference: Psalms 9:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: id
  text: Yahweh telah menyatakan diri-Nya[a]; Ia telah menjalankan penghakiman. Orang fasik terjerat oleh perbuatan tangannya sendiri. Higayon[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh dikenal; Ia telah menjalankan penghakiman.” Kata Ibrani נודע dapat dipahami sebagai keadaan pasif (“dikenal”) atau dalam arti resultatif/refleksif (“telah menyatakan diri-Nya”).
    reason: alternative_reading
  - marker: b
    text: '“Higayon” mungkin merupakan istilah musik atau liturgis. Kemungkinan lain: “perenungan” atau petunjuk musik seperti “musik yang bergema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נודע
  choice: telah menyatakan diri-Nya
  rationale: Bentuk nifal dapat dipahami secara pasif atau refleksif/resultatif. Pilihan ini menyampaikan bahwa Yahweh menjadi dikenal melalui tindakan penghakiman-Nya, sementara kemungkinan statif dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: מִשְׁפָּט עָשָׂה
  choice: telah menjalankan penghakiman
  rationale: Kolokasi ini menunjuk pada pelaksanaan tindakan yudisial; ungkapan Indonesia ini alami dan mempertahankan nuansa forensiknya.
- source_word: בפעל כפיו
  choice: oleh perbuatan tangannya sendiri
  rationale: Frasa ini menyatakan sarana yang menjerat orang fasik. Kata 'sendiri' memperjelas bahwa perbuatannya sendirilah yang menjadi penyebab kejatuhannya.
- source_word: נוקש
  choice: terjerat
  rationale: Pilihan ini mempertahankan metafora jerat sekaligus menyatakan keadaan orang fasik akibat perbuatannya.
- source_word: רשע
  choice: orang fasik
  rationale: Kata sifat tunggal yang berfungsi sebagai nomina diterjemahkan dengan bentuk tunggal representatif yang wajar dalam bahasa Indonesia.
- source_word: הגיון
  choice: Higayon
  rationale: Makna istilah ini tidak pasti dan kemungkinan merupakan petunjuk musik atau liturgis; transliterasi mencegah kepastian semu.
- source_word: סלה
  choice: Sela
  rationale: Istilah musik atau liturgis yang maknanya tidak pasti ini dipertahankan dalam bentuk transliterasi yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penyataan diri ilahi melalui penghakiman
  choice: Yahweh menjadi dikenal melalui pelaksanaan penghakiman-Nya.
  alternative: Yahweh dikenal; Ia telah menjalankan penghakiman.
  rationale: Teks Ibrani menghubungkan dikenalnya Yahweh dengan tindakan yudisial-Nya, tetapi bentuk נודע tetap memungkinkan pembacaan statif; ketegangan itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum tanpa menghilangkan istilah liturgis yang tidak pasti. Semua penanda catatan kaki dicantumkan dalam teks utama.
