lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, bentuk ini lazim berfungsi sebagai petunjuk pelaksanaan bagi orang yang memimpin musik. Ungkapan ini alami dalam bahasa Indonesia modern dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: עַלְמוּת לַבֵּן
  choice: menurut lagu “Kematian Sang Anak”
  rationale: Ungkapan Ibrani ini sangat tidak pasti, tetapi konteks judul mazmur mendukung pemahamannya sebagai petunjuk musik atau nama lagu. Kata “lagu” ditambahkan untuk memperjelas fungsi frasa, sedangkan terjemahan judul mengikuti kemungkinan arti מות dan בן; ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Kata ini menandai jenis nyanyian yang lazim disebut “mazmur” dalam bahasa Indonesia.
- source_word: לְדָוִד
  choice: Daud
  rationale: Konstruksi “Mazmur Daud” ringkas dan wajar serta tidak secara tegas membatasi hubungan dengan Daud hanya pada kepengarangan; ל dapat menyatakan kepunyaan, hubungan, peruntukan, atau kepengarangan.
