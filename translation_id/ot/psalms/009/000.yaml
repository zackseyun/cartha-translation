  text: 'Untuk pemimpin musik: menurut “Kematian Sang Anak.”[a] Mazmur Daud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani עַלְמוּת לַבֵּן (“Alamut Labben” dalam transliterasi) tidak pasti. Kemungkinan besar ini adalah petunjuk musik atau judul lagu; secara tradisional ungkapan ini juga dibiarkan tanpa diterjemahkan sebagai ungkapan yang menyerupai nama diri.
