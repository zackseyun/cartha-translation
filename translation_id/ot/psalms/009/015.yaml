  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: id
  text: 'Bangsa-bangsa telah tenggelam dalam lubang yang mereka buat;


    dalam jaring yang mereka sembunyikan, kaki mereka sendiri terjerat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk tunggal, “kaki mereka,” kemungkinan sebagai bentuk tunggal kolektif yang mengacu kepada bangsa-bangsa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ
  choice: telah terperosok
  rationale: Bentuk Qal perfektum ini menggambarkan bangsa-bangsa jatuh dan tenggelam ke dalam kehancuran. Dalam konteks lubang jebakan, “telah terperosok” menyampaikan gerak masuk ke dalam lubang secara alami tanpa menghilangkan citra kejatuhan.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Kata ini lazim menunjuk kepada bangsa-bangsa atau kelompok-kelompok bangsa; bentuk ulang merupakan padanan Indonesia yang wajar untuk jamak.
- source_word: בְּשַׁחַת
  choice: ke dalam lubang
  rationale: שַׁחַת menunjuk kepada lubang, sering kali lubang yang berfungsi sebagai jebakan. “Ke dalam” sesuai dengan verba gerak “terperosok” dan memperjelas hasil tindakannya.
- source_word: עָשׂוּ
  choice: yang mereka buat
  rationale: Verba umum עשה berarti membuat atau melakukan. “Mereka buat” mempertahankan ironi bahwa bangsa-bangsa jatuh ke dalam lubang buatan mereka sendiri.
- source_word: בְּרֶשֶׁת
  choice: dalam jaring
  rationale: רֶשֶׁת berarti jaring. Preposisi ב dipahami secara lokatif, selaras dengan kaki yang kemudian digambarkan terjerat di dalamnya.
- source_word: זוּ
  choice: yang
  rationale: זוּ berfungsi sebagai partikel relatif. “Yang” mempertahankan hubungan langsung antara jaring dan tindakan menyembunyikannya.
- source_word: טָמָנוּ
  choice: mereka sembunyikan
  rationale: Verba ini berarti menyembunyikan atau memasang secara tersembunyi, khususnya jebakan. Pilihan ini mempertahankan unsur kerahasiaan dalam tindakan mereka.
- source_word: נִלְכְּדָה
  choice: terjerat
  rationale: Bentuk Nifal perfektum menyatakan bahwa kaki itu telah tertangkap. “Terjerat” merupakan bentuk pasif-alamiah dalam bahasa Indonesia dan sangat sesuai dengan citra jaring.
- source_word: רַגְלָם
  choice: kaki mereka sendiri
  rationale: Teks Ibrani memakai bentuk tunggal “kaki mereka,” kemungkinan sebagai tunggal kolektif. Bahasa Indonesia dapat mempertahankan bentuk “kaki”; kata “sendiri” menonjolkan ironi refleksif tanpa mengubah acuan dasarnya.
