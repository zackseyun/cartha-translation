id: PSA.9.9
reference: Psalms 9:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וִ֘/יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַ/דָּ֑ךְ מִ֝שְׂגָּ֗ב לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/009.yaml
  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: id
  text: Yahweh akan menjadi benteng perlindungan[a] bagi orang yang tertindas[b], benteng perlindungan pada masa-masa kesesakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat perlindungan” atau “tempat perlindungan yang tinggi”; istilah Ibrani menunjuk pada tempat aman dan tinggi yang memberi perlindungan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang diremukkan” atau “orang yang diinjak-injak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: akan menjadi
  rationale: Bentuk היה dengan waw di sini dipahami secara deklaratif, bukan sebagai permohonan. Ungkapan “akan menjadi” mempertahankan nuansa prospektif yang mungkin dalam konteks mazmur sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tidak diganti dengan gelar.
- source_word: מִשְׂגָּב
  choice: benteng perlindungan
  rationale: Kata ini menunjuk pada tempat tinggi yang aman dan sukar dijangkau. “Benteng perlindungan” menyampaikan unsur keamanan dan pertahanan; pengulangannya dipertahankan demi penekanan puitis.
- source_word: לַדָּךְ
  choice: bagi orang yang tertindas
  rationale: דך menggambarkan orang yang diremukkan, ditindas, atau diinjak-injak. “Orang yang tertindas” jelas dan alami dalam bahasa Indonesia modern.
- source_word: לְעִתּוֹת
  choice: pada masa-masa
  rationale: Bentuk jamak dengan preposisi ל berfungsi secara temporal dan menunjuk pada berbagai waktu atau keadaan yang berulang.
- source_word: בַּצָּרָה
  choice: kesesakan
  rationale: צרה menunjuk pada kesusahan, tekanan, atau keadaan genting. “Kesesakan” mempertahankan intensitas maknanya dan sesuai dengan ragam bahasa mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama pribadi. Transliterasi “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Nilai verbal וִיהִי
  choice: 'deklarasi prospektif: “akan menjadi”'
  alternative: permohonan “kiranya menjadi” atau pernyataan kini/lampau “adalah/menjadi”
  rationale: Bentuk Ibrani dapat menimbulkan pertanyaan antara fungsi deklaratif dan volitif. Dalam alur pujian mazmur ini, pembacaan deklaratif dipilih; terjemahan tidak mengubahnya menjadi doa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa menjadi arkais. Pengulangan “benteng perlindungan” dipertahankan mengikuti paralelisme teks Ibrani.
