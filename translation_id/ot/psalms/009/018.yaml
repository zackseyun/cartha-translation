id: PSA.9.18
reference: Psalms 9:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: id
  text: Sebab orang yang berkekurangan tidak akan dilupakan untuk selamanya; harapan orang yang tertindas[a] tidak akan lenyap selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “orang yang rendah hati” atau “orang yang lemah lembut” (Ibrani: ענוים).'
    reason: lexical_alternative
  - marker: b
    text: Puisi Ibrani memakai dua ungkapan yang hampir sejajar, “untuk selamanya” dan “selama-lamanya,” untuk menegaskan bahwa orang yang berkekurangan tidak ditelantarkan secara permanen.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memberikan dasar atau kepastian bagi permohonan sebelumnya.
- source_word: לֹא
  choice: tidak
  rationale: Menyatakan penyangkalan pada klausa pertama; pada klausa kedua penyangkalan itu dilanjutkan secara eliptis dan dinyatakan kembali dalam bahasa Indonesia demi kejelasan.
- source_word: לָנֶצַח
  choice: untuk selamanya
  rationale: Ungkapan waktu yang menyatakan keadaan permanen; bentuk ini alami dalam bahasa Indonesia dan tetap dapat dibedakan secara halus dari ungkapan sejajar pada akhir ayat.
- source_word: יִשָּׁכַח
  choice: akan dilupakan
  rationale: Bentuk Nifal dipertahankan sebagai pasif, tanpa menjadikan Allah subjek eksplisit karena teks Ibrani tidak menyebutkan subjeknya.
- source_word: אֶבְיוֹן
  choice: orang yang berkekurangan
  rationale: Menunjuk kepada orang yang berada dalam kebutuhan atau kemiskinan. Pilihan ini alami dan tidak membatasi maknanya hanya pada satu bentuk kemiskinan.
- source_word: תִּקְוַת
  choice: harapan
  rationale: Bentuk konstruk diterjemahkan secara alami sebagai 'harapan orang yang ...'.
- source_word: ענוים
  choice: orang yang tertindas
  rationale: Dalam kesejajaran dengan אֶבְיוֹן, istilah ini terutama menyoroti keadaan sengsara atau tertindas, sambil tetap mengakui kemungkinan nuansa 'rendah hati' atau 'lemah lembut' melalui catatan kaki.
- source_word: תֹּאבַד
  choice: tidak akan lenyap
  rationale: אבד berarti binasa, hilang, atau lenyap. Untuk subjek 'harapan', 'lenyap' merupakan padanan Indonesia yang alami; kata 'tidak' disuplai dari penyangkalan yang berlanjut dari klausa pertama.
- source_word: לָעַד
  choice: selama-lamanya
  rationale: Merupakan ungkapan waktu yang hampir sinonim dengan לָנֶצַח dan memperkuat kepastian melalui kesejajaran puitis.
theological_decisions:
- issue: Pelaku tersirat dalam bentuk pasif 'akan dilupakan'
  choice: Mempertahankan bentuk pasif tanpa menyebut Allah sebagai subjek eksplisit.
  alternative: Allah tidak akan melupakan orang yang berkekurangan untuk selamanya.
  rationale: Konteks menyiratkan pemeliharaan Allah, tetapi bentuk Ibrani tidak menyebut-Nya sebagai subjek. Bentuk pasif menjaga susunan dan ketegangan puitis teks.
- issue: Makna ענוים
  choice: orang yang tertindas
  alternative: orang yang rendah hati; orang yang lemah lembut
  rationale: Istilah ini dapat menunjuk baik pada kerendahan hati maupun keadaan tertindas. Kesejajarannya dengan 'orang yang berkekurangan' menonjolkan dimensi penderitaan sosial, tanpa meniadakan kemungkinan makna etis yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Kesejajaran kedua klausa dipertahankan, demikian juga bentuk pasif dan dua ungkapan waktu yang hampir sinonim.
