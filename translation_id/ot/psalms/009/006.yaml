base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: id
  text: Musuh telah berakhir dalam kehancuran yang kekal[a]; kota-kota telah Kaucabut sampai ke akar-akarnya; bahkan kenangan tentang mereka pun telah musnah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hai musuh, kehancuran telah berakhir untuk selama-lamanya.” Bagian awal bahasa Ibrani dapat dipahami sebagai sapaan langsung, bukan sebagai pernyataan dengan “musuh” sebagai subjek.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: Musuh
  rationale: Bentuk dengan kata sandang paling wajar dipahami sebagai subjek kolektif, yaitu “musuh”; kemungkinan sebagai sapaan langsung dipertahankan dalam catatan kaki.
- source_word: תַּמּוּ
  choice: telah lenyap
  rationale: Verba תמם menyatakan berakhir atau habis sama sekali. “Telah lenyap” menyampaikan ketuntasan penghukuman secara alami dalam bahasa Indonesia dan sesuai dengan subjek kolektif.
- source_word: חֳרָבוֹת
  choice: reruntuhan
  rationale: Nomina ini menunjuk pada kehancuran atau keadaan menjadi reruntuhan; “reruntuhan” mempertahankan gambaran konkret kota atau kubu yang dihancurkan.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menegaskan sifat permanen dari kebinasaan musuh.
- source_word: וְעָרִים
  choice: kota-kota
  rationale: Makna lazim עִיר ialah kota, dan bentuk tanpa artikel di sini wajar diterjemahkan secara jamak.
- source_word: נָתַשְׁתָּ
  choice: telah Kaucabut sampai ke akar-akarnya
  rationale: נתשׁ menggambarkan pencabutan atau pembongkaran secara menyeluruh. Perluasan idiomatis ini mempertahankan metafora pencabutan sekaligus membuat penerapannya pada kota dapat dipahami dalam bahasa Indonesia.
- source_word: אָבַד
  choice: telah musnah
  rationale: Verba אבד menyatakan binasa atau hilang. “Telah musnah” sesuai dengan nada khidmat dan menegaskan hilangnya kenangan itu.
- source_word: זִכְרָם
  choice: kenangan akan mereka
  rationale: Frasa ini menunjuk pada apa yang masih diingat tentang mereka; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: הֵמָּה
  choice: bahkan
  rationale: Pronomina mandiri pada akhir ayat bersifat menegaskan. “Bahkan” secara idiomatis mengalihkan penekanan itu kepada lenyapnya kenangan akan mereka.
theological_decisions:
- issue: Konstruksi sintaksis klausa pembuka
  choice: Dibaca sebagai pernyataan bahwa musuh telah lenyap dalam reruntuhan yang berlangsung selama-lamanya.
  alternative: “Hai musuh, penghancuran telah berakhir untuk selama-lamanya.”
  rationale: Kata pertama dapat dipahami sebagai subjek kolektif, dan pembacaan ini selaras dengan rangkaian pernyataan penghakiman dalam ayat tersebut. Namun, bahasa Ibrani juga memungkinkan konstruksi sapaan langsung dengan חֳרָבוֹת sebagai subjek תַּמּוּ; karena itu alternatif tersebut tidak disingkirkan, melainkan dicatat.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. Kapitalisasi pada “Kau-” menandai bahwa sapaan orang kedua mengacu kepada Allah. Ungkapan “Kaucabut sampai ke akar-akarnya” sengaja mempertahankan metafora Ibrani tanpa menjadi terlalu harfiah atau kabur.
