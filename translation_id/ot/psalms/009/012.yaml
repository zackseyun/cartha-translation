id: PSA.9.12
reference: Psalms 9:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: id
  text: Sebab Dia yang menuntut pertanggungjawaban atas darah yang tertumpah mengingat mereka; Dia tidak melupakan jeritan orang-orang yang tertindas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang miskin” atau “orang-orang sengsara.” Istilah Ibrani ini dapat merujuk kepada mereka yang miskin, menderita, rendah hati, atau tertindas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya; “Sebab” sesuai dengan alur penjelasan mazmur.
- source_word: דֹרֵשׁ דָּמִים
  choice: Dia yang menuntut pertanggungjawaban atas darah yang tertumpah
  rationale: Ungkapan ini menggambarkan Allah yang mengusut dan menuntut pembalasan hukum atas penumpahan darah. Terjemahan ini menghindari kesan bahwa Allah sekadar mencari darah atau bahwa yang dimaksud pasti jabatan hukum teknis seorang penuntut balas.
- source_word: אוֹתָם
  choice: mereka
  rationale: Bentuk plural dipertahankan dan merujuk kepada kelompok orang yang menderita atau tertindas.
- source_word: זָכָר
  choice: mengingat
  rationale: Walaupun secara bentuk merupakan perfektif, dalam puisi ini kata tersebut menyatakan tindakan Allah yang khas dan terus berlaku.
- source_word: לֹא שָׁכַח
  choice: tidak melupakan
  rationale: Bentuk negatif ini sejajar dengan “mengingat” dan menyampaikan kebenaran yang terus berlaku.
- source_word: צַעֲקַת
  choice: jeritan
  rationale: “Jeritan” secara wajar menyampaikan seruan keras dari orang yang mengalami kesesakan dan memohon pertolongan.
- source_word: עניים
  choice: orang-orang yang tertindas
  rationale: Istilah Ibrani ini dapat menunjuk kepada orang miskin, sengsara, rendah hati, atau tertindas. Dalam konteks penumpahan darah dan tuntutan akan keadilan, “tertindas” menonjolkan penderitaan akibat ketidakadilan tanpa membatasinya pada kemiskinan ekonomi.
theological_decisions:
- issue: Keadilan ilahi dalam דֹרֵשׁ דָּמִים
  choice: Allah digambarkan mengusut penumpahan darah dan menuntut pertanggungjawaban atasnya.
  alternative: Allah hanya memperhatikan penumpahan darah, atau secara harfiah mencari darah.
  rationale: Idiom ini berbicara tentang penindakan terhadap utang darah dan pembunuhan yang salah. Rumusan tersebut mempertahankan dimensi moral dan penghakiman ilahi tanpa menyamakannya dengan jabatan hukum teknis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Frasa “menuntut pertanggungjawaban” dipilih demi kejelasan idiom hukum, sedangkan “darah yang tertumpah” mempertahankan citra konkret teks Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
