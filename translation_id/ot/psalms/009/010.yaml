  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: id
  text: Dan orang-orang yang mengenal nama-Mu[a] akan percaya kepada-Mu, sebab Engkau, ya Yahweh, tidak meninggalkan[b] orang-orang yang mencari-Mu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “mengenal nama-Mu” tidak hanya berarti mengetahui sebutan Allah, tetapi juga mengenal watak dan reputasi-Nya sebagaimana Ia menyatakan diri.
    reason: cultural_note
  - marker: b
    text: Atau “mengabaikan.”
    reason: lexical_alternative
  - marker: c
    text: Ibrani YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִבְטְחוּ
  choice: Dan ... akan percaya
  rationale: Bentuk Qal imperfek orang ketiga jamak dari בטח menyatakan kepercayaan atau kebergantungan yang mantap. Dalam konteks puisi ini, bentuk mendatang “akan percaya” wajar, sedangkan וְ diterjemahkan “Dan” untuk mempertahankan kaitannya dengan ayat sebelumnya.
- source_word: בְּךָ
  choice: kepada-Mu
  rationale: Dengan verba בטח, preposisi ב menandai pihak yang menjadi tumpuan kepercayaan. Ungkapan “percaya kepada-Mu” alami dalam bahasa Indonesia dan mempertahankan makna relasionalnya.
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: orang-orang yang mengenal nama-Mu
  rationale: Konstruksi partisipial ini menunjuk pada kelompok yang bercirikan pengenalan akan nama Allah. “Mengenal” lebih sesuai daripada sekadar “mengetahui” karena menyiratkan pengenalan yang bersifat relasional.
- source_word: שֵׁם
  choice: nama
  rationale: Kata ini dipertahankan secara formal. Dalam konteksnya, nama mencakup watak dan reputasi Allah yang dinyatakan, tetapi ungkapan ringkas dari teks sumber tetap dijaga dalam teks utama.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan dasar bagi kepercayaan yang baru disebutkan. “Sebab” jelas, ringkas, dan sesuai dengan ragam puisi yang bermartabat.
- source_word: לֹא עָזַבְתָּ
  choice: tidak meninggalkan
  rationale: Kata עזב dapat berarti meninggalkan, membiarkan, atau menelantarkan. Bentuk perfektum menyatakan tindakan Allah yang terbukti, sementara bahasa Indonesia tidak perlu membedakan secara morfologis antara lampau sederhana dan keadaan yang tetap relevan.
- source_word: דֹּרְשֶׁיךָ
  choice: orang-orang yang mencari-Mu
  rationale: Ketika objeknya Allah, דרש lazim menunjuk pada upaya mencari Dia dalam doa, ibadah, dan pengabdian. “Mencari-Mu” merupakan padanan yang alami tanpa mempersempit cakupannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Makna mengenal nama Allah
  choice: Mempertahankan ungkapan “mengenal nama-Mu” dan menjelaskan cakupan maknanya dalam catatan kaki.
  alternative: Menguraikannya dalam teks utama sebagai “mengenal watak-Mu.”
  rationale: Teks Ibrani secara eksplisit menyebut “nama”; mempertahankannya menjaga gema teologis dan puitis tanpa membatasi maknanya hanya pada salah satu aspek.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan Tetragramaton sebagai nama pribadi dan sebagai sapaan langsung. “Yahweh” mempertahankan pembedaan antara nama ilahi dan gelar umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti gerak puisi Ibrani, termasuk penghubung awal “Dan” dan sapaan “ya Yahweh” pada akhir ayat. Huruf kapital pada pronomina ilahi mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
