  to: Ia akan menghakimi dunia dengan keadilan; Ia akan mengadili bangsa-bangsa dengan adil.[a]
  rationale: Revisi terbatas pada penggantian “dengan kelurusan” menjadi “dengan adil” demi kelaziman bahasa Indonesia modern. Makna sumber—pengadilan yang lurus, setara, dan tidak memihak—tetap terjaga, sementara “kelurusan” dipertahankan sebagai alternatif leksikal dalam catatan kaki. Jangkar catatan kaki tetap melekat pada padanan מֵישָׁרִים.
