  text: וְ/ה֗וּא יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק יָדִ֥ין לְ֝אֻמִּ֗ים בְּ/מֵישָׁרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/008.yaml
  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: id
  text: Ia akan menghakimi dunia dengan keadilan; Ia akan mengadili bangsa-bangsa dengan adil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan kelurusan” atau “dengan tidak memihak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ia
  rationale: Pronomina ini meneruskan pemikiran sebelumnya dengan penekanan ringan pada subjek. Dalam konteks mazmur, rujukannya adalah TUHAN; bentuk ini alami dalam bahasa Indonesia tanpa melebihkan penekanan.
- source_word: יִשְׁפֹּט
  choice: akan menghakimi
  rationale: Kata kerja שׁפט lazim menyatakan tindakan menghakimi atau menjalankan peradilan. Bentuk futur mempertahankan arah deklaratif yiqtol dalam konteks ini tanpa menetapkan jadwal eskatologis tertentu.
- source_word: תֵּבֵל
  choice: dunia
  rationale: תֵּבֵל menunjuk kepada dunia, khususnya dunia yang berpenghuni, bukan semata-mata tanah secara fisik. 'Dunia' adalah padanan Indonesia yang alami dan cukup luas.
- source_word: בְּצֶדֶק
  choice: dengan keadilan
  rationale: צֶדֶק menyatakan tolok ukur atau cara penghakiman. Bentuk nomina 'keadilan' mempertahankan bobot moral istilah sumber.
- source_word: יָדִין
  choice: akan mengadili
  rationale: דין berarti mengadili atau melaksanakan keputusan hukum. 'Mengadili' mempertahankan paralelisme yudisial dengan שׁפט, sekaligus menghindari penyempitan makna menjadi pemerintahan umum saja.
- source_word: לְאֻמִּים
  choice: bangsa-bangsa
  rationale: לְאֻמִּים menunjuk kepada kelompok-kelompok bangsa atau umat manusia secara kolektif. 'Bangsa-bangsa' alami dan tidak harus dipahami sebagai negara-bangsa modern.
- source_word: בְּמֵישָׁרִים
  choice: dengan kelurusan
  rationale: מֵישָׁרִים mengandung gagasan kelurusan, kewajaran, dan keadilan yang tidak memihak. 'Dengan kelurusan' menjaga citra formal teks, sementara alternatif yang lebih idiomatis dicatat dalam catatan kaki.
theological_decisions:
- issue: Penghakiman ilahi atas seluruh umat manusia
  choice: Ayat ini menyatakan bahwa Allah akan menghakimi dunia dan bangsa-bangsa menurut keadilan dan kelurusan.
  alternative: Kata kerja puitisnya dapat dipahami sebagai tindakan yang akan datang atau sebagai cara Allah senantiasa memerintah dan menghakimi.
  rationale: Bentuk yiqtol dapat berorientasi ke masa depan atau menggambarkan tindakan khas. Terjemahan memakai bentuk 'akan' sesuai alur konteks, tetapi tidak menentukan apakah ini khusus penghakiman terakhir atau juga pemerintahan Allah yang berkelanjutan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan konsep yudisial dipertahankan karena kedua verba Ibrani berada dalam paralelisme. Penulisan 'Ia' mengikuti register religius Indonesia untuk rujukan kepada Allah.
