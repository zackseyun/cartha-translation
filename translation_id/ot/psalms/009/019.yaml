  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: id
  text: Bangkitlah, ya Yahweh! Jangan biarkan manusia[a] menang; biarlah bangsa-bangsa dihakimi di hadapan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “manusia fana”; kata Ibrani אֱנוֹשׁ sering menonjolkan kelemahan atau kefanaan manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Bangkitlah
  rationale: Bentuk imperatif dari קום yang ditujukan kepada Allah. “Bangkitlah” merupakan seruan puitis yang alami untuk memohon tindakan atau campur tangan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
- source_word: אַל יָעֹז
  choice: Jangan biarkan ... menang
  rationale: אַל memberi daya larangan atau permohonan negatif, sedangkan יָעֹז secara harfiah berkaitan dengan menjadi kuat. Dalam konteks ini, “jangan biarkan ... menang” menyampaikan permohonan agar manusia tidak berjaya melawan Allah.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Kata benda tunggal kolektif ini menunjuk kepada manusia dan sering menonjolkan kelemahan atau kefanaannya. “Manusia” mempertahankan cakupan representatifnya; nuansa kefanaan dicatat dalam catatan kaki.
- source_word: יִשָּׁפְטוּ
  choice: biarlah ... dihakimi
  rationale: 'Bentuk Nifal imperfek dengan daya jusif dari שפט paling wajar dipahami secara pasif: bangsa-bangsa diminta untuk berada di bawah penghakiman Allah.'
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Padanan lazim dan kontekstual bagi גוים dalam Mazmur, yang menunjuk kepada berbagai bangsa atau kelompok bangsa.
- source_word: עַל־פָּנֶיךָ
  choice: di hadapan-Mu
  rationale: Ungkapan ini secara harfiah berkaitan dengan berada “di depan wajah-Mu”; “di hadapan-Mu” mempertahankan makna kehadiran Allah, khususnya dalam suasana pengadilan.
theological_decisions:
- issue: Nuansa antropologis אֱנוֹשׁ
  choice: manusia
  alternative: manusia fana
  rationale: Teks mempertentangkan manusia yang lemah dengan kedaulatan Allah. “Manusia” alami dalam bahasa Indonesia dan mempertahankan penggunaan tunggal yang representatif, sedangkan kemungkinan penekanan pada kefanaan dipertahankan dalam catatan kaki.
- issue: Daya hukum יִשָּׁפְטוּ
  choice: biarlah bangsa-bangsa dihakimi
  alternative: biarlah bangsa-bangsa dibawa ke pengadilan
  rationale: Bentuk pasif Ibrani mendukung tindakan penghakiman tanpa menentukan lebih jauh prosesnya. Pilihan ini menjaga ketegangan teks dan tidak menambahkan rincian teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya doa puitis yang khidmat. Partikel “ya” menandai sapaan langsung kepada Yahweh, dan kapitalisasi “-Mu” mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah.
