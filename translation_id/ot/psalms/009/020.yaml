id: PSA.9.20
reference: Psalms 9:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁ֘יתָ֤/ה יְהוָ֨ה מוֹרָ֗ה לָ֫/הֶ֥ם יֵדְע֥וּ גוֹיִ֑ם אֱנ֖וֹשׁ הֵ֣מָּה סֶּֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/020.yaml
  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: id
  text: Datangkanlah ketakutan atas mereka, ya TUHAN; biarlah bangsa-bangsa tahu bahwa mereka hanyalah manusia. Sela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה ... מוֹרָה לָהֶם
  choice: Datangkanlah ketakutan atas mereka
  rationale: שִׁיתָה adalah bentuk permohonan tegas, sedangkan מוֹרָה paling wajar dipahami sebagai 'ketakutan/yang menakutkan'. Ungkapan ini mempertahankan arah לָהֶם tanpa membuat bahasa Indonesia terasa kaku.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH, dengan huruf kapital penuh.
- source_word: גוֹיִם
  choice: bangsa-bangsa
  rationale: Padanan alami bagi bentuk jamak yang menunjuk bangsa-bangsa non-Israel dalam konteks ini.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Menjaga penekanan pada kefanaan dan keterbatasan manusia tanpa menambahkan tafsiran ke dalam teks.
- source_word: סֶּלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal yang makna tepatnya tidak pasti dipertahankan sebagai transliterasi yang lazim.
theological_decisions:
- issue: Makna אֱנוֹשׁ הֵמָּה
  choice: mereka hanyalah manusia
  alternative: mereka itu manusia fana
  rationale: Kata אֱנוֹשׁ dapat menyoroti kelemahan atau kefanaan manusia. 'Hanyalah manusia' menyampaikan kontras dengan TUHAN sambil tidak mempersempit maknanya hanya pada kematian.
- issue: Makna מוֹרָה
  choice: ketakutan
  alternative: seorang yang menakutkan / kengerian
  rationale: Bentuk ini memiliki kesulitan leksikal dan dapat dipahami secara abstrak atau konkret. Dalam konteks permohonan agar bangsa-bangsa mengenali keterbatasannya, makna abstrak 'ketakutan' paling sesuai dan sejalan dengan tradisi tekstual utama.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, puitis, dan khidmat. Susunan paralel ayat dipertahankan; 'Sela' tidak dijelaskan di dalam teks karena maknanya tidak pasti.
