  text: so that I may recount all your praises in the gates of Daughter Zion[a]; I will rejoice in your salvation.
translation:
  language: id
  text: supaya aku dapat menceritakan segala pujian bagi-Mu di gerbang-gerbang Putri Sion; aku akan bersukacita dalam keselamatan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan-Mu” atau “penyelamatan-Mu.” Istilah Ibrani ini dapat menunjuk pada pertolongan dari bahaya yang sedang dihadapi maupun keselamatan dalam arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposifnya.
- source_word: אֲסַפְּרָה
  choice: aku dapat menceritakan
  rationale: Bentuk piel dari ספר menyatakan tindakan menceritakan atau memberitakan secara terperinci; bersama לְמַעַן, terjemahan ini membentuk klausa tujuan yang alami.
- source_word: כָּל תְּהִלָּתֶיךָ
  choice: segala pujian bagi-Mu
  rationale: כָּל mempertahankan cakupan menyeluruh, sedangkan bentuk jamak bersufiks תְּהִלָּתֶיךָ dipahami sebagai berbagai pujian yang ditujukan kepada Allah, tanpa membatasinya hanya pada perbuatan tertentu.
- source_word: בְּשַׁעֲרֵי
  choice: di gerbang-gerbang
  rationale: Mempertahankan bentuk jamak dan gambaran gerbang kota sebagai ruang publik untuk berkumpul serta memberitakan pujian.
- source_word: בַת צִיּוֹן
  choice: Putri Sion
  rationale: Mempertahankan personifikasi puitis Ibrani bagi Sion atau Yerusalem dengan ungkapan yang tetap dapat dipahami dalam bahasa Indonesia.
- source_word: אָגִילָה
  choice: aku akan bersukacita
  rationale: Kata גיל menyatakan kegembiraan yang meluap; “bersukacita” jelas, wajar, dan sesuai dengan ragam puitis yang bermartabat.
- source_word: בִּישׁוּעָתֶךָ
  choice: karena keselamatan dari-Mu
  rationale: ישועה dapat berarti penyelamatan dari bahaya langsung maupun keselamatan dalam arti lebih luas. “Keselamatan dari-Mu” mempertahankan kedua cakupan itu dan menjelaskan bahwa Allah adalah sumbernya; ב dipahami secara kausal dalam konteks sukacita.
theological_decisions:
- issue: Cakupan makna ישועה
  choice: keselamatan
  alternative: pembebasan atau penyelamatan
  rationale: “Keselamatan” mempertahankan keluasan teologis istilah Ibrani, sedangkan konteks mazmur juga memungkinkan pertolongan konkret dari bahaya. Kemungkinan yang lebih sempit dicatat tanpa meniadakan makna yang lebih luas.
- issue: Makna תְּהִלָּתֶיךָ
  choice: pujian bagi-Mu
  alternative: perbuatan-perbuatan-Mu yang terpuji
  rationale: Bentuk Ibrani dapat menunjuk pada pujian yang ditujukan kepada Allah atau pada hal-hal terpuji tentang Dia. Terjemahan utama tidak membatasi ungkapan itu pada perbuatan saja dan mempertahankan ketegangan puitisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan ilahi memakai bentuk “-Mu” sesuai konvensi ejaan Indonesia. “Putri Sion” dipertahankan sebagai personifikasi puitis, dan tanda catatan kaki ditempatkan langsung sesudah istilah “keselamatan dari-Mu” yang diterangkannya.
