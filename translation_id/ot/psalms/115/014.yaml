  text: May Yahweh give increase to you[b][a]—to you and to your children.
translation:
  language: id
  text: Kiranya Yahweh memberi pertambahan kepada kalian[a]—kepada kalian dan anak-anak kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau secara lebih harfiah: “Kiranya Yahweh menambahkan kepada kalian—kepada kalian dan anak-anak kalian.” Kata Ibrani yang digunakan dapat berarti “menambah” atau “memberi pertambahan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵף
  choice: membuat ... bertambah banyak
  rationale: Bentuk Hifil dari יסף berarti ‘menambah’ atau ‘membuat bertambah’. Dalam konteks berkat, ungkapan ini menyampaikan pertambahan secara alami dalam bahasa Indonesia tanpa menentukan secara sempit apa yang ditambahkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: עֲלֵיכֶם ... עֲלֵיכֶם
  choice: kalian—kalian
  rationale: Akhiran orang kedua jamak diterjemahkan dengan ‘kalian’. Pengulangan dalam bahasa Ibrani dipertahankan sebagai penegasan, dengan tanda pisah untuk menunjukkan bahwa bagian kedua menjabarkan bagian pertama.
- source_word: וְעַל בְּנֵיכֶם
  choice: dan anak-anak kalian
  rationale: בנים dalam konteks berkat keluarga secara wajar berarti ‘anak-anak’; terjemahan ini tidak membatasinya hanya pada anak laki-laki maupun memperluasnya secara eksplisit menjadi semua keturunan.
theological_decisions:
- issue: Daya volitif bentuk verba dalam konteks berkat
  choice: Kiranya Yahweh membuat ...
  alternative: Yahweh akan membuat ...
  rationale: Dalam rangkaian berkat pada ayat 12–15, bentuk verba paling wajar dipahami sebagai permohonan atau harapan, bukan semata-mata pernyataan tentang masa depan.
- issue: Cakupan pertambahan yang dimohonkan
  choice: membuat kalian bertambah banyak
  alternative: menambahkan berkat kepada kalian
  rationale: Teks Ibrani tidak menyebut objek seperti ‘berkat’. Rumusan terpilih mempertahankan gagasan pertambahan tanpa memasukkan objek yang tidak dinyatakan.
- issue: Nama perjanjian יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama pribadi ilahi yang terdapat dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Kalian’ dipakai karena sapaan Ibrani berbentuk jamak. Tanda pisah mempertahankan pengulangan penegas dalam teks Ibrani sekaligus membuat hubungannya jelas dalam bahasa Indonesia.
