id: PSA.115.10
reference: Psalms 115:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֵּ֣ית אַ֭הֲרֹן בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/010.yaml
  text: O house of Aaron[a], trust in Yahweh[b]; he is their help and their shield.
translation:
  language: id
  text: Hai kaum Harun[a], percayalah kepada Yahweh! Dialah pertolongan mereka dan perisai mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “rumah Harun,” yaitu keluarga atau garis keturunan imam Harun.'
    reason: Penjelasan idiom Ibrani.
  - marker: b
    text: Teks Ibrani beralih dari seruan langsung “percayalah” kepada bentuk orang ketiga, “pertolongan mereka dan perisai mereka.”
    reason: Menjelaskan peralihan pronomina yang sengaja dipertahankan.
lexical_decisions:
- source_word: בֵּית אַהֲרֹן
  choice: kaum Harun
  rationale: Secara harfiah berarti “rumah Harun” dan menunjuk kepada keluarga atau garis keturunan imam Harun. “Kaum Harun” mempertahankan nuansa kelompok keturunan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בִּטְחוּ
  choice: percayalah
  rationale: Bentuk imperatif jamak dari בטח menyampaikan seruan langsung agar mereka menaruh kepercayaan kepada Yahweh.
- source_word: בַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ב menandai pihak yang menjadi tumpuan kepercayaan. “Kepada” merupakan ungkapan Indonesia yang alami bersama “percaya,” sedangkan nama ilahi יְהוָה ditransliterasikan “Yahweh.”
- source_word: עֶזְרָם
  choice: pertolongan mereka
  rationale: Nomina עֵזֶר dengan sufiks orang ketiga jamak maskulin secara langsung berarti “pertolongan mereka.” Pilihan ini mempertahankan peralihan pronomina dalam teks Ibrani.
- source_word: וּמָגִנָּם
  choice: dan perisai mereka
  rationale: מָגֵן berarti “perisai.” Metafora konkret dipertahankan, bukan dijelaskan menjadi “pelindung.”
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri ini memberi penekanan dalam klausa tanpa verba. “Dialah” menyampaikan penekanan tersebut tanpa menambahkan gagasan eksklusif “hanya.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri dan sesuai dengan bukti bahasa sumber.
- issue: Peralihan dari sapaan orang kedua ke pernyataan orang ketiga
  choice: mereka
  alternative: kalian
  rationale: Walaupun perintah “percayalah” ditujukan langsung kepada kaum Harun, sufiks pada “pertolongan” dan “perisai” adalah orang ketiga jamak. Terjemahan mempertahankan peralihan gramatikal yang nyata ini dan tidak menyelaraskannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Sapaan “Hai” menandai vokatif puitis; “kaum Harun” menghindari terjemahan harfiah yang kaku; metafora “perisai” serta peralihan pronomina sumber dipertahankan.
