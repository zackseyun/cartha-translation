id: PSA.115.3
reference: Psalms 115:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וֵֽ/אלֹהֵ֥י/נוּ בַ/שָּׁמָ֑יִם כֹּ֭ל אֲשֶׁר חָפֵ֣ץ עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/003.yaml
  text: But our God is in the heavens[b][a]; he does all that he pleases.
translation:
  language: id
  text: Namun Allah kita ada di surga[a]; Ia melakukan segala yang dikehendaki-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di langit.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Ia melakukan apa pun yang disenangi-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהֵינוּ
  choice: Namun Allah kita
  rationale: Kata penghubung ו dipahami secara adversatif karena ayat ini membandingkan Allah yang hidup dengan berhala yang tidak berdaya. “Namun” menyampaikan kontras itu secara alami.
- source_word: בַשָּׁמַיִם
  choice: ada di surga
  rationale: Bentuk Ibrani שָׁמַיִם secara morfologis jamak dan secara harfiah dapat diterjemahkan “di langit,” tetapi dalam konteks tempat kediaman dan pemerintahan Allah, “di surga” adalah ungkapan Indonesia yang paling alami. Bentuk sumber dicatat dalam catatan kaki.
- source_word: כֹּל אֲשֶׁר
  choice: segala yang
  rationale: Ungkapan ini menyatakan cakupan menyeluruh dan tetap dekat dengan susunan Ibrani tanpa terdengar kaku dalam bahasa Indonesia.
- source_word: חָפֵץ
  choice: dikehendaki-Nya
  rationale: חפץ dapat mengungkapkan kehendak, keinginan, atau kesenangan. “Dikehendaki-Nya” alami dalam konteks tindakan Allah dan tidak menjadikannya istilah teknis yang lebih sempit daripada teks.
- source_word: עָשָׂה
  choice: Ia melakukan
  rationale: Walaupun bentuknya qatal, dalam konteks ini verba menyatakan kebenaran umum tentang tindakan Allah. Kala kini tersirat secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Kedaulatan dan kebebasan tindakan Allah
  choice: Ia melakukan segala yang dikehendaki-Nya
  alternative: Ia melakukan apa pun yang disenangi-Nya
  rationale: Rumusan utama menegaskan bahwa Allah bebas dan berkuasa untuk bertindak, berlawanan dengan berhala yang tidak mampu berbuat apa-apa. Catatan alternatif mempertahankan nuansa kesenangan atau kerelaan dalam חפץ tanpa membatasi ayat pada suatu sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” memperjelas kontras wacana; “Allah kita” mempertahankan kedekatan komunal; kapitalisasi “Ia” dan “-Nya” mengikuti kebiasaan penerbitan Alkitab berbahasa Indonesia.
