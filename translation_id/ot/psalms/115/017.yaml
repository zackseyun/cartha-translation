source:
  edition: WLC
  text: לֹ֣א הַ֭/מֵּתִים יְהַֽלְלוּ יָ֑הּ וְ֝/לֹ֗א כָּל יֹרְדֵ֥י דוּמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/017.yaml
  text: The dead do not praise Yah[b][a], nor do any who go down into silence.
translation:
  language: id
  text: Orang mati tidak memuji Yah, dan tidak seorang pun yang turun ke dalam kesunyian.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan tidak semua yang turun ke dalam kesunyian.” Dalam susunan negatif ini, kata Ibrani yang berarti “semua” mempunyai makna distributif, sehingga diterjemahkan “tidak seorang pun.”'
    reason: lexical_alternative
  - marker: b
    text: “Kesunyian” merupakan ungkapan puitis bagi keadaan atau ranah kematian; sebagian orang memahaminya secara lebih khusus sebagai “kubur” atau “dunia orang mati.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֵּתִים
  choice: Orang mati
  rationale: Bentuk ini merujuk secara umum kepada mereka yang telah mati. “Orang mati” alami dalam bahasa Indonesia dan tidak menambahkan penafsiran tentang keadaan mereka.
- source_word: יְהַלְלוּ
  choice: memuji
  rationale: Dalam bentuk piel, הלל lazim berarti “memuji,” khususnya dalam konteks ibadah, dan mempertahankan kaitannya dengan ungkapan pujian kepada Yah.
- source_word: יָהּ
  choice: Yah
  rationale: יָהּ adalah bentuk singkat puitis dari nama ilahi. Bentuk “Yah” mempertahankan perbedaannya dari bentuk lengkap יהוה tanpa menggantinya dengan gelar lain.
- source_word: כָּל
  choice: tidak seorang pun
  rationale: Di bawah penyangkalan וְלֹא, כָּל memiliki cakupan distributif. “Tidak seorang pun” menyampaikan makna itu secara alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יֹרְדֵי
  choice: yang turun
  rationale: Partisipel dari ירד menggambarkan mereka yang turun. “Yang turun” mempertahankan gambaran gerak dan sifat umum ungkapan tersebut.
- source_word: דוּמָה
  choice: kesunyian
  rationale: Kata ini menunjuk pada kesunyian atau keadaan sunyi dan di sini berfungsi sebagai gambaran puitis tentang kematian. “Kesunyian” mempertahankan metafora tanpa langsung menafsirkannya sebagai kubur atau dunia orang mati.
theological_decisions:
- issue: Apakah ayat ini harus diterjemahkan sebagai penyangkalan doktrinal terhadap segala pujian sesudah kematian atau sebagai bahasa puitis tentang kesunyian kematian
  choice: 'Mempertahankan pernyataan puitis: “Orang mati tidak memuji Yah, dan tidak seorang pun yang turun ke dalam kesunyian.”'
  alternative: Menafsirkan “kesunyian” secara langsung sebagai “kubur” atau “dunia orang mati” dalam teks utama.
  rationale: Mazmur ini mengontraskan para penyembah yang hidup dengan orang mati melalui gambaran puitis Ibrani. Terjemahan mempertahankan ketegangan itu tanpa menetapkan doktrin lengkap tentang keadaan sesudah kematian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara nama singkat ilahi “Yah” dan metafora “kesunyian” dipertahankan dari teks Ibrani.
