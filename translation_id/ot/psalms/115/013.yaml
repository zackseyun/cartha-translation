  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְ֭בָרֵךְ יִרְאֵ֣י יְהוָ֑ה הַ֝/קְּטַנִּ֗ים עִם הַ/גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/013.yaml
  text: He will bless those who fear Yahweh[a], the small together with the great.
translation:
  language: id
  text: Ia akan memberkati orang-orang yang takut akan Yahweh, yang kecil bersama dengan yang besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang rendah bersama dengan yang besar.” Bahasa Ibrani mempertentangkan orang-orang yang lebih kecil dan lebih besar secara luas, kemungkinan termasuk kedudukan sosial, bukan hanya ukuran atau usia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֵךְ
  choice: Ia akan memberkati
  rationale: Bentuk piel imperfek orang ketiga tunggal, dengan Allah sebagai subjek tersirat dari konteks. Bentuk futuratif menyampaikan jaminan deklaratif dalam mazmur ini.
- source_word: יִרְאֵי יְהוָה
  choice: orang-orang yang takut akan Yahweh
  rationale: Frasa partisip konstruksi yang berfungsi sebagai nomina. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna takut yang disertai hormat kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: הַקְּטַנִּים
  choice: yang kecil
  rationale: Substantivisasi kata sifat ini berlawanan dengan 'yang besar' dan dapat mencakup kedudukan, kepentingan, usia, atau ukuran tanpa membatasi maknanya pada salah satu kategori.
- source_word: עִם
  choice: bersama dengan
  rationale: Menyatakan penyertaan kedua kelompok secara jelas dan alami.
- source_word: הַגְּדֹלִים
  choice: yang besar
  rationale: Mempertahankan kesejajaran dengan 'yang kecil' serta keluasan makna yang mungkin mencakup orang berkedudukan atau terpandang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi Allah tanpa menggantinya dengan gelar.
- issue: Nuansa ירא dalam frasa יִרְאֵי יְהוָה
  choice: takut akan Yahweh
  alternative: menghormati Yahweh
  rationale: '''Takut akan'' mempertahankan ketegangan makna antara rasa gentar dan penghormatan saleh, sedangkan ''menghormati'' saja berpotensi memperlemah nuansanya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. Kata ganti 'Ia' merujuk kepada Allah sesuai konteks. Struktur paralel Ibrani dipertahankan tanpa mempersempit cakupan pasangan 'yang kecil' dan 'yang besar'.
