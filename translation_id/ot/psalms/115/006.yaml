  text: They have ears, but do not hear; noses, but do not smell.
translation:
  language: id
  text: Mereka mempunyai telinga, tetapi tidak mendengar; mereka mempunyai hidung, tetapi tidak mencium.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְנַיִם
  choice: telinga
  rationale: Bentuk dual yang menunjuk organ pendengaran. Dalam bahasa Indonesia, nomina 'telinga' tidak perlu diberi penanda jamak karena subjek jamak sudah jelas.
- source_word: לָהֶם
  choice: mereka mempunyai
  rationale: Preposisi ל dengan sufiks pronominal secara harfiah berarti 'pada mereka', tetapi di sini membentuk konstruksi kepemilikan. 'Mereka mempunyai' menyampaikan maknanya secara alami.
- source_word: יִשְׁמָעוּ
  choice: dapat mendengar
  rationale: Qal imperfek dari שׁמע dalam konteks ini menyatakan kemampuan mendengar yang tidak dimiliki berhala. Penambahan 'dapat' memperjelas kontras antara keberadaan organ dan ketiadaan fungsinya.
- source_word: אַף
  choice: hidung
  rationale: Dalam konteks anggota tubuh, אַף berarti 'hidung', bukan 'amarah'. Bentuk tunggal distributif alami diterjemahkan 'hidung' dalam bahasa Indonesia.
- source_word: יְרִיחוּן
  choice: dapat mencium
  rationale: Bentuk dari ריח menyatakan fungsi membaui atau mencium bau. 'Dapat mencium' mempertahankan kesejajaran dengan 'dapat mendengar' dan terdengar alami dalam bahasa Indonesia.
- source_word: וְלֹא
  choice: tetapi tidak
  rationale: Secara formal berarti 'dan tidak', tetapi kontras ironis antara memiliki organ dan tidak mampu menggunakannya paling alami dinyatakan dengan 'tetapi tidak'.
theological_decisions:
- issue: Gambaran antropomorfis tentang berhala
  choice: Mempertahankan gambaran konkret bahwa berhala mempunyai organ indra tetapi tidak memiliki kemampuan indrawi
  alternative: Menafsirkannya secara eksplisit sebagai ketidakberdayaan rohani berhala
  rationale: Teks Ibrani memakai citra anggota tubuh yang konkret sebagai polemik terhadap berhala. Terjemahan literal-alami mempertahankan daya retorisnya tanpa memasukkan penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan 'mereka mempunyai' dipertahankan untuk menampilkan kesejajaran klausa Ibrani dan menghindari frasa eliptis yang terasa kaku.
