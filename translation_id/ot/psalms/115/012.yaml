id: PSA.115.12
reference: Psalms 115:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָה֮ זְכָרָ֪/נוּ יְבָ֫רֵ֥ךְ יְ֭בָרֵךְ אֶת בֵּ֣ית יִשְׂרָאֵ֑ל יְ֝בָרֵ֗ךְ אֶת בֵּ֥ית אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/012.yaml
  text: Yahweh has remembered us[a]; he will bless; he will bless the house of Israel; he will bless the house of Aaron.
translation:
  language: id
  text: Yahweh telah mengingat kita[a]; Dia akan memberkati; Dia akan memberkati kaum Israel; Dia akan memberkati kaum Harun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah memperhatikan kita.”'
    reason: Alternatif ini mengungkapkan nuansa bahwa Yahweh tetap memedulikan atau menaruh perhatian kepada umat-Nya.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama perjanjian, bukan diganti dengan gelar seperti TUHAN.
- source_word: זְכָרָנוּ
  choice: telah mengingat kita
  rationale: Bentuk perfektum dengan akhiran orang pertama jamak menyatakan tindakan yang telah dilakukan. Terjemahan ini mempertahankan gambaran Ibrani secara langsung, sementara nuansa 'memperhatikan' dicatat sebagai alternatif.
- source_word: יְבָרֵךְ
  choice: Dia akan memberkati
  rationale: 'Bentuk imperfektum dipahami secara prediktif berdasarkan konteks: karena Yahweh telah mengingat umat-Nya, Dia akan memberkati. Pengulangannya dipertahankan sebagai penegasan puitis.'
- source_word: בֵּית יִשְׂרָאֵל
  choice: kaum Israel
  rationale: Kata 'kaum' menyampaikan makna kolektif dan kekeluargaan dari בֵּית secara alami dalam bahasa Indonesia tanpa menghilangkan struktur paralelnya.
- source_word: בֵּית אַהֲרֹן
  choice: kaum Harun
  rationale: Terjemahan ini sejajar dengan 'kaum Israel' dan tetap menunjuk pada garis keluarga imam keturunan Harun.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; bentuk 'Yahweh' mempertahankan nama perjanjian itu secara eksplisit.
- issue: Daya ujar יְבָרֵךְ
  choice: 'pernyataan masa depan: ''Dia akan memberkati'''
  alternative: 'permohonan: ''kiranya Dia memberkati'''
  rationale: Alur dari tindakan yang telah terjadi ('telah mengingat') menuju keyakinan akan berkat mendukung pembacaan prediktif, tanpa mengubah pengulangan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Dia' dipakai secara alami untuk merujuk kepada Yahweh. Tanda titik koma mempertahankan rangkaian dan pengulangan puitis teks Ibrani.
