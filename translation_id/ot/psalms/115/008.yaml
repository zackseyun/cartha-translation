  text: Those who make them become like them[b][a], as does everyone who trusts in them.
translation:
  language: id
  text: Orang-orang yang membuat berhala-berhala itu akan menjadi seperti berhala-berhala itu[a], begitu pula semua orang yang percaya kepada berhala-berhala itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani ini dapat diterjemahkan “akan ada/berada” atau “akan menjadi”; dalam konteks ini, “akan menjadi” menonjolkan keserupaan sebagai hasilnya. Berhala-berhala itu digambarkan dalam ayat-ayat sebelumnya sebagai tidak dapat berbicara, melihat, mendengar, atau bertindak.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: כְּמוֹהֶם
  choice: seperti berhala-berhala itu
  rationale: Bentuk כְּמוֹהֶם menyatakan perbandingan, ‘seperti mereka’. Penyebutan ‘berhala-berhala itu’ memperjelas rujukan pronomina dalam bahasa Indonesia berdasarkan ayat-ayat sebelumnya tanpa memperluas maknanya.
- source_word: יִהְיוּ
  choice: akan menjadi
  rationale: Bentuk imperfek היה dapat berarti ‘akan ada/menjadi’. Dengan pelengkap perbandingan, ‘akan menjadi’ secara alami menyampaikan keadaan yang dihasilkan, sementara alternatif ‘akan seperti’ tetap mungkin.
- source_word: עֹשֵׂיהֶם
  choice: orang-orang yang membuatnya
  rationale: Partisipel עשה dengan akhiran orang ketiga jamak menunjuk kepada para pembuat berhala. Bentuk ini wajar dan jelas dalam bahasa Indonesia modern.
- source_word: כֹּל אֲשֶׁר
  choice: setiap orang yang
  rationale: Ungkapan ini mencakup semua orang dalam kelompok yang disebut dan paling alami diterjemahkan ‘setiap orang yang’.
- source_word: בֹּטֵחַ בָּהֶם
  choice: percaya kepadanya
  rationale: בטח dengan preposisi ב menyatakan kepercayaan atau penyandaran diri kepada suatu objek. ‘Percaya kepada’ merupakan ungkapan Indonesia yang alami; akhiran jamak Ibrani merujuk secara kolektif kepada berhala-berhala.
theological_decisions:
- issue: Sifat keserupaan dengan berhala
  choice: Teks utama menyatakan bahwa para pembuat dan orang yang mempercayai berhala akan menjadi seperti berhala itu, tanpa menentukan seluruh dimensi keserupaan tersebut.
  alternative: Menjelaskan secara langsung bahwa mereka menjadi mati rasa secara rohani, bisu, buta, tuli, atau tidak berdaya.
  rationale: Bahasa Ibrani hanya menegaskan keserupaan. Konteks ayat-ayat sebelumnya menunjukkan ketidakberdayaan dan ketidakpekaan berhala, tetapi penjelasan itu lebih tepat ditempatkan dalam catatan kaki agar ketegangan teologis teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Berhala-berhala itu’ dipakai untuk memperjelas anteseden pronomina Ibrani; ‘kepadanya’ mempertahankan rujukan kolektif secara alami. Susunan ‘demikian juga’ menghubungkan kelompok kedua tanpa mengubah cakupan universal teks.
