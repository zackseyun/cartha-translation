  text: They have mouths, but they do not speak; eyes, but they do not see.
translation:
  language: id
  text: Mereka mempunyai mulut, tetapi tidak berbicara; mereka mempunyai mata, tetapi tidak melihat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּה
  choice: mulut
  rationale: Nomina Ibrani berbentuk tunggal, tetapi dipakai secara distributif bagi berhala-berhala yang dirujuk oleh pronomina jamak; bahasa Indonesia secara alami dapat memakai bentuk tak bertanda jumlah 'mulut' setelah 'mereka mempunyai'.
- source_word: לָהֶם
  choice: mereka mempunyai
  rationale: Preposisi ל dengan sufiks pronominal menyatakan kepunyaan secara idiomatis, secara harfiah 'pada mereka', sehingga 'mereka mempunyai' menyampaikan maksudnya dengan wajar.
- source_word: וְלֹא
  choice: tetapi tidak dapat
  rationale: Kombinasi konjungsi dan negasi menonjolkan pertentangan antara adanya anggota tubuh dan ketidakmampuannya menjalankan fungsi. 'Tetapi' menyampaikan daya adversatif itu, sedangkan 'tidak dapat' memperjelas ketidakmampuan yang dimaksud dalam konteks sindiran terhadap berhala.
- source_word: יְדַבֵּרוּ
  choice: berbicara
  rationale: Bentuk piel imperfek dari דבר menunjuk pada tindakan berbicara; 'berbicara' merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: עֵינַיִם
  choice: mata
  rationale: Padanan langsung bagi bentuk dual/jamak Ibrani; dalam bahasa Indonesia 'mata' tidak perlu diberi penanda jamak.
- source_word: יִרְאוּ
  choice: melihat
  rationale: Bentuk qal imperfek dari ראה berarti 'melihat' dan sesuai dengan gambaran ketidakmampuan indrawi yang sejajar dengan tidak berbicara.
theological_decisions:
- issue: Rujukan pronomina jamak
  choice: Pronomina diterjemahkan sebagai 'mereka', dengan merujuk kepada berhala-berhala dalam konteks sebelumnya.
  alternative: Mempertahankan susunan kepunyaan yang lebih harfiah, seperti 'Pada mereka ada mulut ... pada mereka ada mata ...'.
  rationale: Mazmur ini menyindir berhala dengan menggambarkan bagian tubuh yang mereka miliki namun tidak berfungsi. Bentuk 'mereka mempunyai ... tetapi tidak dapat ...' menyampaikan sindiran itu secara jelas tanpa menambahkan penafsiran doktrinal.
- issue: Nuansa negasi pada fungsi anggota tubuh
  choice: Menggunakan 'tidak dapat berbicara' dan 'tidak dapat melihat'.
  alternative: Menggunakan bentuk lebih formal-harfiah 'tidak berbicara' dan 'tidak melihat'.
  rationale: Dalam konteks benda mati berupa berhala, negasi Ibrani menyatakan bukan sekadar bahwa tindakan itu sedang tidak dilakukan, melainkan bahwa anggota tubuh tersebut tidak berfungsi. 'Tidak dapat' mengungkapkan implikasi kontekstual ini secara alami.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'mereka mempunyai' dipertahankan pada kedua baris untuk menghasilkan paralelisme yang jelas dan mudah dipahami.
