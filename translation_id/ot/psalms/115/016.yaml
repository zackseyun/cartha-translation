lexical_decisions:
- source_word: הַשָּׁמַיִם שָׁמַיִם
  choice: Langit, ya, langit
  rationale: Pengulangan kata שָׁמַיִם memberi penegasan dalam susunan topik-komentar. Partikel “ya” membuat pengulangan itu wajar dan puitis dalam bahasa Indonesia tanpa menghapus tekanannya.
- source_word: לַיהוָה
  choice: adalah milik Yahweh
  rationale: Preposisi לְ menyatakan kepunyaan atau sesuatu yang menjadi bagian seseorang; “milik Yahweh” menyampaikan makna itu secara alami. Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: וְהָאָרֶץ
  choice: tetapi bumi
  rationale: Walaupun וְ pada dasarnya dapat berarti “dan”, hubungan antitesis antara langit dan bumi paling jelas diungkapkan dengan “tetapi” dalam bahasa Indonesia.
- source_word: נָתַן
  choice: telah Ia berikan
  rationale: Bentuk perfektif menunjukkan tindakan yang telah dilakukan dengan keadaan hasil yang tetap relevan. Subjek “Ia” dipahami dari Yahweh pada klausa sebelumnya.
- source_word: לִבְנֵי אָדָם
  choice: kepada anak-anak manusia
  rationale: Terjemahan ini mempertahankan bentuk ungkapan Ibrani בְנֵי אָדָם, sementara catatan kaki menjelaskan bahwa maksudnya ialah manusia secara umum.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Cakupan ungkapan בְנֵי אָדָם
  choice: anak-anak manusia
  alternative: umat manusia
  rationale: Teks utama mempertahankan citra dan bentuk ungkapan sumber, tetapi catatan kaki menjaga pengertian generiknya agar tidak disalahpahami sebagai hanya keturunan laki-laki atau hanya kaum laki-laki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Pengulangan pada klausa pertama dipertahankan secara alami, sedangkan ungkapan sumber “anak-anak manusia” dijelaskan agar cakupan universalnya tetap jelas.
