  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹ֤א לָ֥/נוּ יְהוָ֗ה לֹ֫א לָ֥/נוּ כִּֽי לְ֭/שִׁמְ/ךָ תֵּ֣ן כָּב֑וֹד עַל חַ֝סְדְּ/ךָ֗ עַל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/001.yaml
  text: Not to us[a], O Yahweh, not to us, but to your name give glory, because of your steadfast love, because of your faithfulness.
translation:
  language: id
  text: 'Bukan kepada kami, ya Yahweh, bukan kepada kami,

    melainkan kepada nama-Mu berikanlah kemuliaan,

    karena kasih setia-Mu,

    karena kesetiaan-Mu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kebenaran-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH agar nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: לֹא לָנוּ ... לֹא לָנוּ
  choice: Bukan kepada kami ... bukan kepada kami
  rationale: Mempertahankan penyangkalan yang diulang dan kaitannya dengan permohonan agar kemuliaan diberikan kepada nama Yahweh, bukan kepada umat.
- source_word: תֵּן כָּבוֹד
  choice: berikanlah kemuliaan
  rationale: Menerjemahkan ungkapan Ibrani secara langsung sebagai permohonan agar kemuliaan diakui sebagai milik nama Allah.
- source_word: לְשִׁמְךָ
  choice: kepada nama-Mu
  rationale: Mempertahankan gambaran konkret 'nama', yang juga mencakup reputasi dan karakter yang dinyatakan.
- source_word: כִּי
  choice: melainkan
  rationale: Dalam susunan ini, partikel tersebut mengantar peralihan positif yang berlawanan dengan penyangkalan ganda sebelumnya.
- source_word: עַל
  choice: karena
  rationale: Menyatakan dasar permohonan secara alami dan ringkas dalam bahasa Indonesia modern.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: Menangkap kasih yang teguh, loyal, dan berciri perjanjian tanpa memakai istilah teknis denominasi.
- source_word: אֲמִתֶּךָ
  choice: kesetiaan-Mu
  rationale: Dalam pasangan dengan חֶסֶד, kata ini menekankan sifat dapat dipercaya dan keteguhan relasional; kemungkinan arti 'kebenaran' tetap dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Makna אֲמִתֶּךָ dalam pasangan dengan חַסְדְּךָ
  choice: kesetiaan-Mu
  alternative: kebenaran-Mu
  rationale: Konteks paralel menonjolkan keandalan dan keteguhan Allah, tetapi arti leksikal 'kebenaran' juga sah dan karena itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan puitis Ibrani serta susunan kontras dipertahankan; huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
