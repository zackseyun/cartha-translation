  yaml_path: translation/ot/psalms/115/007.yaml
  text: They have hands[a], but cannot feel; feet, but cannot walk[b]; they do not make a sound in their throat.
translation:
  language: id
  text: Mereka mempunyai tangan, tetapi tidak dapat meraba[a]; mereka mempunyai kaki, tetapi tidak dapat berjalan; mereka tidak mengeluarkan suara[b] dari tenggorokan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tetapi tidak menyentuh”; verba Ibrani dapat berarti meraba atau menyentuh.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka tidak bergumam”; verba Ibrani dapat merujuk pada ujaran atau gumaman pelan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵיהֶם
  choice: mereka mempunyai tangan
  rationale: Secara harfiah berarti “tangan mereka.” Bentuk “mereka mempunyai tangan” menyatakan klausa Ibrani tanpa verba secara alami dalam bahasa Indonesia dan mempertahankan kesejajaran puitis.
- source_word: יְמִישׁוּן
  choice: tidak dapat meraba
  rationale: Verba ini menunjuk pada tindakan meraba atau menyentuh dengan tangan. “Tidak dapat meraba” menonjolkan ketidakmampuan berhala dan sesuai dengan penyebutan tangan.
- source_word: רַגְלֵיהֶם
  choice: mempunyai kaki
  rationale: Secara harfiah berarti “kaki mereka.” Verba “mempunyai” diteruskan dari klausa sebelumnya agar ungkapannya ringkas dan paralel.
- source_word: יְהַלֵּכוּ
  choice: tidak dapat berjalan
  rationale: Bentuk Ibraninya secara formal berarti “tidak berjalan,” tetapi konteks ejekan terhadap berhala menunjukkan ketidakmampuan, yang dalam bahasa Indonesia wajar dinyatakan dengan “tidak dapat.”
- source_word: יֶהְגּוּ
  choice: tidak mengeluarkan suara
  rationale: Verba הגה dapat berarti mengeluarkan bunyi rendah, bergumam, atau bersuara. Pilihan ini mempertahankan cakupan makna umum tanpa menaikkannya menjadi kemampuan berbicara penuh.
- source_word: בִּגְרוֹנָם
  choice: dari tenggorokan mereka
  rationale: Nomina tersebut berarti “tenggorokan.” Preposisi dirender secara idiomatis sebagai asal keluarnya suara dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat ketidakmampuan berhala
  choice: 'Negasi pada tindakan tangan dan kaki dinyatakan sebagai ketidakmampuan: “tidak dapat meraba” dan “tidak dapat berjalan.”'
  alternative: 'Terjemahan lebih formal: “tidak meraba” dan “tidak berjalan.”'
  rationale: Konteks mazmur mengejek berhala sebagai benda yang tidak berdaya, bukan sekadar benda yang kebetulan sedang tidak bertindak. “Tidak dapat” menyampaikan daya pragmatis itu tanpa menambahkan gagasan teologis baru.
- issue: Cakupan יֶהְגּוּ
  choice: “tidak mengeluarkan suara” dengan alternatif “tidak bergumam” dalam catatan kaki.
  alternative: “tidak bergumam” dalam teks utama.
  rationale: Makna verba mencakup bunyi atau ujaran rendah. Teks utama menyampaikan ketidakmampuan vokal berhala dengan jelas, sedangkan catatan kaki menjaga nuansa leksikal yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan “mempunyai” dipahami pada klausa kedua untuk menjaga kepadatan paralelisme. “Tenggorokan” dipilih sebagai istilah umum dan alami.
