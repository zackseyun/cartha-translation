  text: Their idols are silver and gold[a], the work of human hands.
translation:
  language: id
  text: Berhala mereka ialah perak dan emas, buatan tangan manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “karya tangan manusia.”
