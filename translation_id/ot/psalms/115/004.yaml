lexical_decisions:
- source_word: עֲצַבֵּיהֶם
  choice: berhala-berhala mereka
  rationale: Dalam konteks polemik Mazmur 115, bentuk jamak dengan sufiks ini menunjuk kepada berhala atau patung sembahan mereka; “berhala-berhala” menyatakan acuannya dengan jelas.
- source_word: כֶּסֶף וְזָהָב
  choice: perak dan emas
  rationale: Kedua nomina menyebut bahan pembentuk berhala secara langsung. Frasa “terbuat dari” dipakai agar hubungan bahan tersebut alami dalam bahasa Indonesia.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: buatan tangan manusia
  rationale: Ungkapan ini mempertahankan gambaran konkret tentang tangan manusia sekaligus menyampaikan bahwa berhala itu merupakan hasil pekerjaan manusia.
theological_decisions:
- issue: Makna generik אָדָם dalam ungkapan יְדֵי אָדָם
  choice: tangan manusia
  alternative: tangan seorang laki-laki; tangan umat manusia
  rationale: אָדָם di sini bersifat generik dan mempertentangkan karya manusia dengan Allah, bukan menunjuk kepada seorang laki-laki tertentu. “Manusia” mempertahankan cakupan tersebut secara wajar.
- issue: Hubungan perak dan emas dengan berhala
  choice: terbuat dari perak dan emas
  alternative: adalah perak dan emas
  rationale: Bahasa Ibrani memakai klausa nominal, tetapi dalam bahasa Indonesia “terbuat dari” secara alami mengungkapkan bahwa perak dan emas adalah bahan berhala tanpa mengubah maksud ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pengulangan “berhala-berhala” mengikuti bentuk jamak Ibrani; “buatan tangan manusia” mempertahankan kontras konkret dan polemis ayat tanpa menambahkan penafsiran denominasi.
