  text: וַ/אֲנַ֤חְנוּ נְבָ֘רֵ֤ךְ יָ֗הּ מֵֽ/עַתָּ֥ה וְ/עַד עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/018.yaml
  text: But we will bless Yah from now and forever[b][a]. Praise Yah!
translation:
  language: id
  text: Tetapi kita akan mengagungkan Yah[a] mulai sekarang sampai selama-lamanya. Pujilah Yah![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yah” adalah bentuk singkat puitis nama ilahi dalam bahasa Ibrani; sebagian terjemahan secara tradisional menerjemahkannya sebagai “TUHAN.”
    reason: alternative_reading
  - marker: b
    text: Dalam bahasa Ibrani, ungkapan ini berarti “Pujilah Yah!” Ungkapan ini menjadi asal bentuk liturgis yang ditransliterasikan “Haleluya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Tetapi kita
  rationale: Kata sambung dan pronomina mandiri menandai kontras dengan orang-orang mati pada ayat sebelumnya. “Tetapi kita” menyampaikan kontras itu secara alami sambil mempertahankan subjek yang dinyatakan dengan tegas.
- source_word: נְבָרֵךְ
  choice: akan mengagungkan
  rationale: Bentuk piel imperfek orang pertama jamak menyatakan tekad yang berlanjut ke masa depan. Ketika Allah menjadi objek, בָּרַךְ berarti memberkati dalam arti memuji atau menghormati-Nya; “mengagungkan” alami dalam bahasa Indonesia dan tetap membedakannya dari הַלְלוּ, “pujilah,” pada akhir ayat.
- source_word: יָהּ
  choice: Yah
  rationale: Ini adalah bentuk singkat puitis nama ilahi, bukan bentuk lengkap יהוה. Transliterasi “Yah” mempertahankan perbedaan dalam teks sumber dan kaitannya dengan seruan penutup.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: mulai sekarang sampai selama-lamanya
  rationale: Ungkapan berpasangan ini menunjukkan rentang waktu dari saat sekarang tanpa akhir. Susunan ini jelas dan idiomatis dalam bahasa Indonesia modern.
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Imperatif jamak הַלְלוּ dan nama singkat יָהּ diterjemahkan secara transparan. Bentuk ini mempertahankan daya seruan liturgis sekaligus memperlihatkan arti ungkapan yang menjadi asal kata “Haleluya.”
theological_decisions:
- issue: Penerjemahan bentuk singkat puitis nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks Ibrani memakai יָהּ dua kali, bukan tetragramaton lengkap יהוה. “Yah” mempertahankan bentuk khusus yang dipakai sumber tanpa menyamarkannya di bawah padanan untuk bentuk lengkap nama ilahi.
- issue: Makna בָּרַךְ ketika Allah menjadi objek
  choice: mengagungkan
  alternative: memberkati
  rationale: Bahasa Ibrani dapat berbicara tentang manusia “memberkati” Allah dalam arti memuji dan menghormati-Nya. “Mengagungkan” menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia tanpa menyiratkan bahwa manusia menganugerahkan berkat kepada Allah, serta tidak menyamakan verba ini dengan הַלְלוּ pada klausa berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mengagungkan” dipilih agar tindakan manusia terhadap Allah dipahami secara alami, sedangkan “Pujilah Yah!” mempertahankan seruan langsung dan ritme liturgis penutup mazmur.
