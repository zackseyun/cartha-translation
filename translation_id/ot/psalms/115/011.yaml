source:
  edition: WLC
  text: יִרְאֵ֣י יְ֭הוָה בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/011.yaml
  text: You who fear Yahweh[a], trust in Yahweh; he is their help and their shield.
translation:
  language: id
  text: Kalian yang takut akan Yahweh[a], percayalah kepada Yahweh; Dialah pertolongan dan perisai mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang-orang yang takut akan Yahweh hendaklah percaya kepada Yahweh.” Partisipel bahasa Ibrani dapat dipahami sebagai sapaan langsung (“Kalian yang takut ...”) atau sebagai sebutan orang ketiga (“Orang-orang yang takut ...”).
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי
  choice: Kalian yang takut akan
  rationale: Partisipel konstruk jamak dari ירא dipakai secara substantival. Sapaan langsung dipilih karena diikuti imperatif jamak, tetapi kemungkinan pembacaan orang ketiga dipertahankan dalam catatan kaki.
- source_word: יְהוָה / בַיהוָה
  choice: Yahweh / kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”. Dengan verba “percaya”, preposisi ב diungkapkan secara idiomatis sebagai “kepada”; pengulangan nama dalam bahasa Ibrani tetap dipertahankan.
- source_word: בִּטְחוּ
  choice: percayalah
  rationale: Imperatif Qal jamak dari בטח diterjemahkan sebagai perintah yang langsung, alami, dan tetap memuat makna menaruh kepercayaan.
- source_word: עֶזְרָם
  choice: pertolongan mereka
  rationale: Nomina עזר dapat berarti “pertolongan” atau “penolong”. Bentuk abstrak “pertolongan” mempertahankan ungkapan predikatif dan sejajar dengan “perisai”.
- source_word: וּמָגִנָּם
  choice: dan perisai mereka
  rationale: Metafora konkret מגן, “perisai”, dipertahankan dan tidak digeneralisasi menjadi “pelindung”.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri ini bersifat menegaskan. “Dialah” menyampaikan penekanan tersebut secara ringkas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Peralihan dari sapaan orang kedua ke rujukan orang ketiga
  choice: “Kalian ... percayalah”; kemudian “mereka”
  alternative: 'Seluruh baris dibuat sebagai pernyataan orang ketiga: “Orang-orang ... hendaklah percaya”'
  rationale: Bahasa Ibrani memungkinkan יִרְאֵי dipahami sebagai sapaan langsung, sedangkan sufiks jamak pada “pertolongan mereka” dan “perisai mereka” berbentuk orang ketiga. Terjemahan utama mempertahankan ketegangan gramatikal ini dan tidak menyeragamkan semua pronomina.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Kalian” dipakai untuk menandai sapaan jamak secara jelas; “Dialah” mempertahankan penekanan pada הוּא. Penanda catatan kaki [a] dicantumkan dalam teks utama.
