id: PSA.115.9
reference: Psalms 115:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִ֭שְׂרָאֵל בְּטַ֣ח בַּ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/009.yaml
  text: Israel[a], trust in Yahweh; he is their help and their shield.
translation:
  language: id
  text: Israel, percayalah kepada Yahweh[a]; Dialah pertolongan dan perisai mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani yang digunakan di sini adalah YHWH.
    reason: Menjelaskan dasar bentuk “Yahweh” dalam teks sumber tanpa menggantinya dengan gelar.
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri bagi umat perjanjian; dalam ayat ini dipakai sebagai sapaan kepada umat secara kolektif.
- source_word: בְּטַח
  choice: percayalah
  rationale: Bentuk imperatif maskulin tunggal dari בטח, yang menyapa Israel sebagai satu kesatuan. Bentuk Indonesia ini menyampaikan perintah secara alami tanpa mengubahnya menjadi seruan berlindung.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ב menandai Yahweh sebagai sasaran kepercayaan. Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: עֶזְרָם
  choice: pertolongan mereka
  rationale: Kata benda עֵזֶר dengan akhiran orang ketiga jamak berarti “pertolongan mereka.” Pilihan ini mempertahankan bentuk kata benda dan tidak menafsirkannya menjadi “penolong.”
- source_word: וּמָגִנָּם
  choice: dan perisai mereka
  rationale: Metafora konkret “perisai” dipertahankan, bukan diratakan menjadi istilah abstrak seperti “pelindung.”
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri ini bersifat menegaskan. “Dialah” secara alami mempertahankan penekanan tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian dan membedakannya dari gelar umum “Tuhan.”
- issue: Peralihan dari sapaan kepada Israel ke pronomina orang ketiga jamak
  choice: mereka
  alternative: kalian; -mu
  rationale: Bahasa Ibrani mula-mula menyapa Israel secara kolektif dengan imperatif tunggal, lalu menyebut “pertolongan mereka” dan “perisai mereka.” Peralihan orang ini dipertahankan agar bentuk dan ketegangan retoris teks tidak diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Bentuk “percayalah kepada” dipilih sebagai ungkapan modern yang alami; titik koma mempertahankan hubungan erat antara perintah dan pengakuan berikutnya.
