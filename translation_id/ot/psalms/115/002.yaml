  yaml_path: translation/ot/psalms/115/002.yaml
  text: Why should the nations say[a], “Where now is their God?”
translation:
  language: id
  text: 'Mengapa bangsa-bangsa berkata,


    “Di manakah Allah mereka sekarang?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa ... sampai
  rationale: Memperkenalkan pertanyaan retoris yang menyatakan keberatan terhadap ejekan bangsa-bangsa; konstruksi 'Mengapa ... sampai' secara alami menyampaikan nuansa potensial dari bentuk imperfek.
- source_word: יֹאמְרוּ
  choice: berkata
  rationale: Bentuk Qal imperfek orang ketiga jamak dari אמר; dalam pertanyaan retoris ini dapat menunjuk pada ucapan yang mungkin atau berulang, bukan semata-mata masa depan.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Padanan langsung dan lazim untuk גּוֹיִם, yang di sini menunjuk kepada bangsa-bangsa asing tanpa memasukkan konotasi khusus dari istilah lain.
- source_word: אַיֵּה
  choice: Di manakah
  rationale: Kata tanya tempat; bentuk 'Di manakah' sesuai dengan ragam Indonesia yang modern dan bermartabat.
- source_word: נָא
  choice: sekarang
  rationale: Di sini partikel נָא menambahkan tekanan atau kesan mendesak dalam ejekan, bukan menyatakan permohonan sopan.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis dapat tampak jamak, konteksnya menunjuk kepada Allah Israel dalam arti tunggal.
theological_decisions:
- issue: Acuan אֱלֹהֵיהֶם
  choice: Allah mereka
  alternative: allah mereka
  rationale: Bangsa-bangsa sedang mengejek Israel dengan mempertanyakan kehadiran atau tindakan Allah Israel. Huruf kapital menandai bahwa acuannya adalah Allah Israel, tanpa menambahkan gagasan di luar teks.
- issue: Nuansa pertanyaan לָמָּה יֹאמְרוּ
  choice: Mengapa bangsa-bangsa sampai berkata
  alternative: Mengapa bangsa-bangsa berkata
  rationale: Pilihan utama mengungkapkan daya retoris dan keberatan pemazmur, tetapi bentuk Ibrani juga memungkinkan pembacaan sebagai pertanyaan lebih langsung tentang ucapan bangsa-bangsa.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan klausa ejekan dibuat idiomatis, dengan 'sekarang' ditempatkan pada akhir pertanyaan untuk mempertahankan tekanan נָא.
