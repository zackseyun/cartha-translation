  text: בְּרוּכִ֣ים אַ֭תֶּם לַ/יהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/015.yaml
  text: May you be blessed by Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: id
  text: Kiranya kalian diberkati oleh Yahweh[a], Pencipta langit dan bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, Ibraninya berbunyi, “diberkati kalian bagi/dari Yahweh.” Dalam konteks ini, frasa tersebut merupakan rumusan berkat; karena itu diterjemahkan “diberkati oleh Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכִים אַתֶּם
  choice: Kiranya kalian diberkati
  rationale: Partisipel pasif jamak בְּרוּכִים bersama pronomina jamak אַתֶּם membentuk pernyataan berkat tanpa verba finit. Dalam konteks ini, “kiranya ... diberkati” menyampaikan daya benediktifnya secara alami sekaligus mempertahankan bentuk pasif.
- source_word: לַיהוָה
  choice: oleh Yahweh
  rationale: Dalam rumusan berkat pasif ini, ל dipahami sebagai penanda sumber atau pelaku berkat. Nama perjanjian יהוה ditransliterasikan “Yahweh”.
- source_word: עֹשֵׂה
  choice: yang menjadikan
  rationale: Partisipel Qal dari עשה menerangkan Yahweh sebagai Dia yang membuat atau menjadikan. Klausa relatif ini lebih alami dalam bahasa Indonesia daripada gelar “Pembuat”, tanpa mengubah acuannya.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: langit dan bumi
  rationale: Pasangan ini merupakan merisme yang menunjuk pada seluruh ciptaan. “Langit dan bumi” adalah ungkapan baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya ujar rumusan berkat
  choice: Kiranya kalian diberkati
  alternative: Kalian diberkati
  rationale: Bahasa Ibrani dapat dibaca secara formal sebagai predikasi “diberkatilah/diberkati kalian”, tetapi konteks mazmur mendukung fungsi benediktif. “Kiranya” menyatakan fungsi itu tanpa menjadikannya perintah.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan khidmat. “Kalian” dipakai untuk menyatakan dengan jelas bahwa orang kedua berbentuk jamak; “kiranya” mempertahankan nuansa berkat yang formal tanpa terdengar usang.
