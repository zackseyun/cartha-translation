  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: id
  text: Ya Allah pembalas[a], ya TUHAN, ya Allah pembalas, bersinarlah[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Allah pembalasan-pembalasan.” Bentuk jamak Ibrani ini kemungkinan bersifat intensif dan menegaskan pembalasan ilahi.
    reason: lexical_alternative
  - marker: b
    text: Atau “tampillah” atau “nyatakanlah diri-Mu.” Kata Ibrani ini dapat menunjuk pada penampakan ilahi yang bercahaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Allah
  rationale: Dalam seruan langsung ini, אֵל berfungsi sebagai gelar bagi Allah; padanan alami dalam bahasa Indonesia ialah “Allah”.
- source_word: נְקָמוֹת
  choice: pembalas
  rationale: Bentuk jamak Ibrani menguatkan gagasan pembalasan ilahi. “Allah pembalas” terdengar alami sekaligus mempertahankan bahwa Allah melaksanakan pembalasan yang adil.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Bentuk “TUHAN” mengikuti konvensi Alkitab bahasa Indonesia untuk Nama ilahi YHWH dan membedakannya dari gelar Tuhan biasa.
- source_word: הוֹפִיעַ
  choice: nyatakanlah diri-Mu
  rationale: Imperatif Hifil ini meminta Allah tampil atau memperlihatkan diri-Nya. Pilihan ini mempertahankan nuansa manifestasi ilahi tanpa membatasi maknanya hanya pada cahaya.
theological_decisions:
- issue: Bahasa tentang pembalasan ilahi
  choice: Mempertahankan sebutan “Allah pembalas”
  alternative: Allah yang menegakkan keadilan
  rationale: Teks Ibrani secara eksplisit menghubungkan Allah dengan pembalasan. Menggantinya dengan “keadilan” akan melunakkan ketegangan teologis yang memang terdapat dalam teks.
- issue: Nuansa manifestasi dalam הוֹפִיעַ
  choice: “nyatakanlah diri-Mu” dengan alternatif harfiah dalam catatan
  alternative: “bersinarlah” atau “tampillah”
  rationale: Kata kerjanya dapat menunjuk pada penampakan ilahi yang bercahaya, tetapi unsur cahaya tidak harus dibuat eksklusif dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan puitis Ibrani dipertahankan; pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia.
