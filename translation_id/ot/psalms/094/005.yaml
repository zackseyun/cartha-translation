  text: O Yahweh[b][a], they crush your people and afflict your inheritance.
translation:
  language: id
  text: 'Mereka meremukkan[a] umat-Mu, ya Yahweh,

    dan menindas milik pusaka-Mu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka menindas umat-Mu.” Kata kerja Ibrani ini dapat menggambarkan penindasan yang meremukkan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “warisan-Mu.” Istilah Ibrani ini menunjuk pada warisan, pusaka, atau milik yang diberikan sebagai bagian seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: עַם menunjuk pada umat sebagai kelompok, dan dalam konteks ini pada umat yang menjadi milik Yahweh. 'Umat-Mu' alami dan tepat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'; partikel 'ya' menyatakan sapaan langsung yang tersirat oleh bentuk Ibrani.
- source_word: יְדַכְּאוּ
  choice: mereka meremukkan
  rationale: Bentuk Piel dari דכא menyampaikan tindakan menghancurkan atau menekan dengan keras. 'Meremukkan' mempertahankan gambaran kuat dalam teks.
- source_word: וְנַחֲלָתְךָ
  choice: dan milik pusaka-Mu
  rationale: נַחֲלָה dapat berarti warisan, pusaka, atau milik yang diperoleh sebagai bagian yang ditetapkan. 'Milik pusaka-Mu' cocok untuk umat yang merupakan kepunyaan khusus Yahweh.
- source_word: יְעַנּוּ
  choice: menindas
  rationale: Bentuk Piel dari ענה di sini berarti menindas atau menyengsarakan. 'Menindas' jelas, alami, dan membedakannya dari citra 'meremukkan' pada klausa pertama.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יהוה. Transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Identitas נַחֲלָה sebagai kepunyaan Yahweh
  choice: milik pusaka-Mu
  alternative: warisan-Mu
  rationale: Ungkapan ini mempertahankan gagasan bahwa umat merupakan bagian atau kepunyaan khusus Yahweh tanpa menentukan secara berlebihan bagaimana hubungan warisan itu dipahami.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Paralelisme dua klausa dipertahankan, dengan citra kuat 'meremukkan' pada klausa pertama dan tindakan 'menindas' pada klausa kedua. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia.
