  text: וַ/יְהִ֬י יְהוָ֣ה לִ֣/י לְ/מִשְׂגָּ֑ב וֵ֝/אלֹהַ֗/י לְ/צ֣וּר מַחְסִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/022.yaml
  text: But Yahweh has become my stronghold[a], and my God the rock of my refuge.
translation:
  language: id
  text: Namun, Yahweh telah menjadi bentengku[a], dan Allahku adalah gunung batu tempat perlindunganku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun, Yahweh menjadi bentengku.” Kata kerja Ibraninya dapat diterjemahkan sebagai bentuk lampau sederhana; “telah menjadi” menonjolkan hasil yang masih berlangsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: telah menjadi
  rationale: Bentuk wayyiqtol dari היה menyatakan peristiwa lampau; dalam konteks ini, “telah menjadi” secara alami menonjolkan hasil yang tetap berlaku bagi pemazmur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap terlihat dan tidak diganti dengan gelar.
- source_word: לִי לְמִשְׂגָּב
  choice: bentengku
  rationale: Ungkapan berpreposisi ini menyatakan relasi dan manfaat pribadi. “Bentengku” ringkas dan alami, serta mempertahankan gambaran tempat tinggi yang aman dan sukar dicapai.
- source_word: וֵאלֹהַי
  choice: dan Allahku
  rationale: Konjungsi dan nomina bersufiks orang pertama diterjemahkan langsung untuk mempertahankan pengakuan pribadi yang sejajar.
- source_word: לְצוּר מַחְסִי
  choice: adalah gunung batu tempat perlindunganku
  rationale: צוּר mempertahankan metafora batu karang atau gunung batu yang kokoh, sedangkan מַחְסִי menyatakan tempat berlindung milik pemazmur. Kopula “adalah” diperlukan agar kalimat Indonesia alami.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama יהוה secara langsung. “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Hubungan antara Allah dan metafora gunung batu
  choice: Allahku adalah gunung batu tempat perlindunganku
  alternative: Allahku menjadi gunung batu perlindunganku
  rationale: Bahasa Ibrani tidak mengulang verba pada klausa kedua, sehingga klausa tersebut paling wajar dipahami sebagai predikasi nominal yang sejajar. Terjemahan ini tidak memaksakan gagasan perubahan kedua yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Namun” menyampaikan kontras וַ dalam konteks mazmur. “Benteng” dipilih sebagai padanan alami bagi מִשְׂגָּב, sementara “gunung batu” mempertahankan metafora konkret צוּר dan membedakannya dari benteng pada baris pertama.
