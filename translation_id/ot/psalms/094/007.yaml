  text: וַ֭/יֹּ֣אמְרוּ לֹ֣א יִרְאֶה יָּ֑הּ וְ/לֹא יָ֝בִ֗ין אֱלֹהֵ֥י יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/007.yaml
  text: And they say[a], “Yah does not see, and the God of Jacob does not understand.”
translation:
  language: id
  text: Mereka berkata, “Yah[a] tidak melihat; Allah Yakub tidak memahami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Yah”, bentuk singkat puitis dari nama ilahi; bandingkan dengan bentuk nama perjanjian yang lebih umum, yang sering diterjemahkan “TUHAN”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mereka berkata
  rationale: Bentuk wayyiqtol secara formal dapat diterjemahkan sebagai lampau, tetapi dalam wacana puitis ini menyajikan ucapan khas orang fasik. Bahasa Indonesia tidak wajib menandai kala, sehingga “berkata” tetap alami dan tidak mempersempit waktunya.
- source_word: לֹא יִרְאֶה
  choice: tidak melihat
  rationale: Kata ראה di sini menunjuk pada persepsi melalui penglihatan, dengan implikasi bahwa Allah tidak mengamati kejahatan manusia. Terjemahan konkret ini mempertahankan metafora sumber.
- source_word: יָּהּ
  choice: Yah
  rationale: Ini adalah bentuk singkat puitis dari nama ilahi, bukan bentuk lengkap יהוה. Transliterasi “Yah” mempertahankan perbedaan tersebut.
- source_word: וְלֹא יָבִין
  choice: tidak memahami
  rationale: Kata בין berarti memahami atau menangkap dengan pengertian. “Memahami” merupakan padanan langsung dan alami tanpa mengubahnya menjadi sekadar “memperhatikan”.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Allah Yakub
  rationale: Frasa konstruksi ini adalah gelar yang menghubungkan Allah dengan Yakub. “Allah Yakub” merupakan ungkapan Indonesia yang ringkas, jelas, dan lazim bagi hubungan ini.
theological_decisions:
- issue: Penerjemahan bentuk singkat puitis nama ilahi יָּהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks Ibrani memakai יָּהּ, bukan יהוה. Mempertahankan “Yah” menghindari penyamaan diam-diam antara bentuk singkat puitis ini dan bentuk nama perjanjian yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. Tanda titik koma memperjelas paralelisme dua klausa tanpa menambahkan hubungan makna yang tidak ada dalam sumber.
