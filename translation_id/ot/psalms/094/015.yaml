  text: כִּֽי עַד צֶ֭דֶק יָשׁ֣וּב מִשְׁפָּ֑ט וְ֝/אַחֲרָ֗י/ו כָּל יִשְׁרֵי לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/015.yaml
  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: id
  text: Sebab keputusan hukum akan kembali kepada kebenaran[a], dan semua orang yang lurus hatinya akan mengikutinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keadilan akan kembali kepada kebenaran.” Kata Ibrani yang diterjemahkan “keputusan hukum” juga dapat berarti “penghakiman” atau “keadilan”, sedangkan kata yang diterjemahkan “kebenaran” juga dapat berarti “keadilan” atau “apa yang benar”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan sesudahnya semua orang yang lurus hati”; ungkapan ini dapat berarti bahwa mereka mengikutinya atau menyelaraskan diri dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan konteks sebelumnya sebagai dasar atau jaminan; bentuk ini alami dalam alur argumentatif mazmur.
- source_word: עַד צֶדֶק
  choice: kepada kebenaran
  rationale: Dengan יָשׁוּב, עַד menyatakan arah atau hasil. צֶדֶק menunjuk pada kelurusan moral sebagai patokan bagi keputusan hukum.
- source_word: יָשׁוּב
  choice: akan kembali
  rationale: Menerjemahkan makna lazim שוב secara langsung dan mempertahankan gambaran bahwa tatanan hukum yang benar akan dipulihkan.
- source_word: מִשְׁפָּט
  choice: keputusan hukum
  rationale: Istilah ini dapat berarti penghakiman, keadilan, atau keputusan hukum. Pilihan ini membedakannya dari צֶדֶק sekaligus cocok dengan gagasan bahwa suatu putusan kembali selaras dengan kebenaran.
- source_word: וְאַחֲרָיו
  choice: akan mengikutinya
  rationale: Secara harfiah berarti 'dan sesudahnya'. Bahasa Indonesia memerlukan predikat tersirat; sufiks maskulin tunggal paling dekat merujuk kepada מִשְׁפָּט.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: semua orang yang tulus hati
  rationale: Ungkapan Ibrani menggambarkan orang-orang yang batinnya lurus. 'Tulus hati' merupakan ungkapan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Hubungan antara מִשְׁפָּט dan צֶדֶק
  choice: Keputusan hukum akan kembali selaras dengan kebenaran.
  alternative: Keadilan akan kembali kepada kebenaran; atau penghakiman akan berlanjut sampai kebenaran tercapai.
  rationale: Susunan יָשׁוּב עַד paling wajar menyatakan gerak kembali menuju suatu patokan, tanpa memperluasnya menjadi klaim doktrinal yang tidak dinyatakan teks.
- issue: Rujukan sufiks dalam וְאַחֲרָיו
  choice: Sufiks dipahami merujuk kepada מִשְׁפָּט, sehingga orang yang tulus hati mengikutinya.
  alternative: Sufiks dapat dipahami lebih luas sebagai merujuk kepada kebenaran atau tatanan benar yang baru disebutkan.
  rationale: מִשְׁפָּט adalah anteseden maskulin tunggal terdekat, tetapi catatan kaki mempertahankan sifat ringkas dan kemungkinan cakupan yang lebih luas dalam bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang sederhana dan bermartabat. 'Keputusan hukum' dipakai untuk menjaga perbedaan leksikal antara מִשְׁפָּט dan צֶדֶק; alternatif penting dicatat tanpa menutup ambiguitas teks.
