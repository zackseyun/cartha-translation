  text: לְ/הַשְׁקִ֣יט ל֭/וֹ מִ֣/ימֵי רָ֑ע עַ֤ד יִכָּרֶ֖ה לָ/רָשָׁ֣ע שָֽׁחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/013.yaml
  text: to give him rest from days of trouble[b][a], until a pit is dug for the wicked.
translation:
  language: id
  text: untuk memberinya ketenangan dari hari-hari kesusahan,[a] sampai sebuah lubang digali bagi orang fasik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “dari hari-hari malapetaka.” Secara harfiah: “dari hari-hari kejahatan,” yaitu hari-hari yang ditandai kesusahan atau bencana.'
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “lubang” juga dapat menyiratkan kebinasaan atau kubur.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט לוֹ
  choice: untuk memberinya ketenangan
  rationale: Infinitif Hifil dari שׁקט menyatakan tindakan membuat seseorang tenang atau memberinya keadaan tenteram. Ungkapan ini juga mempertahankan hubungan tujuan dengan ayat sebelumnya.
- source_word: מִימֵי רָע
  choice: dari hari-hari kesusahan
  rationale: Secara harfiah berarti 'dari hari-hari kejahatan/keburukan', tetapi dalam konteks menunjuk pada masa yang ditandai kesusahan atau malapetaka.
- source_word: עַד
  choice: sampai
  rationale: Penanda temporal yang memperkenalkan batas waktu ketenangan tersebut.
- source_word: יִכָּרֶה
  choice: digali
  rationale: Bentuk Nifal imperfek dari כרה paling wajar dipahami sebagai pasif, yaitu sebuah lubang 'digali' atau disiapkan.
- source_word: לָרָשָׁע
  choice: bagi orang fasik
  rationale: Adjektiva tunggal yang dipakai sebagai nomina menunjuk kepada seorang fasik sebagai tipe atau wakil golongan.
- source_word: שָׁחַת
  choice: sebuah lubang
  rationale: Kata ini pada dasarnya berarti lubang, sering dengan nuansa kebinasaan atau kubur; terjemahan utama mempertahankan gambaran konkret dan catatan kaki menjelaskan nuansanya.
theological_decisions:
- issue: Sifat ketenangan yang diberikan kepada orang yang menderita
  choice: ketenangan dari masa kesusahan sampai hukuman menimpa orang fasik
  alternative: ketenangan batin di tengah kesusahan, atau perhentian eskatologis semata
  rationale: Susunan Ibrani menghubungkan tindakan mendidik pada ayat sebelumnya dengan ketenangan 'dari hari-hari kesusahan' hingga lubang digali bagi orang fasik. Terjemahan tidak mempersempit kemungkinan gema teologis yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ketenangan' dipilih agar dapat mencakup kelegaan maupun keadaan tenteram tanpa memastikan bahwa segala kesusahan langsung lenyap; 'orang fasik' mempertahankan ragam bahasa Alkitab yang lazim.
