  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַשְׁרֵ֤י הַ/גֶּ֣בֶר אֲשֶׁר תְּיַסְּרֶ֣/נּוּ יָּ֑הּ וּֽ/מִ/תּוֹרָתְ/ךָ֥ תְלַמְּדֶֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/012.yaml
  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
translation:
  language: id
  text: Berbahagialah[a] laki-laki[b] yang Kaudidik, ya Yah[c], dan Kauajari dari Taurat-Mu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat diterjemahkan “Betapa bahagianya” atau “Diberkatilah”; maknanya mencakup keadaan diberkati dan sejahtera, bukan sekadar perasaan senang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “laki-laki”; bentuk tunggal maskulin ini kemungkinan dipakai secara perwakilan bagi orang yang menerima didikan dan pengajaran Allah.
    reason: lexical_alternative
  - marker: c
    text: “Yah” adalah bentuk singkat puitis nama ilahi, berbeda dari bentuk lengkap YHWH yang lazim diterjemahkan “TUHAN”.
    reason: lexical_alternative
  - marker: d
    text: Atau “dari pengajaran-Mu”. Kata Ibrani torah dapat berarti hukum atau, secara lebih luas, pengajaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Rumus ucapan bahagia ini menyatakan keadaan diberkati, berbahagia, atau sejahtera; bentuk Indonesia ini alami, luhur, dan tidak membatasinya pada perasaan senang.
- source_word: הַגֶּבֶר
  choice: laki-laki
  rationale: Nomina Ibrani ini berbentuk maskulin tunggal dan secara leksikal menunjuk kepada seorang laki-laki, meskipun dalam konteks ini ia kemungkinan berfungsi sebagai sosok perwakilan.
- source_word: תְּיַסְּרֶנּוּ
  choice: yang Kaudidik
  rationale: Bentuk Piel dari יסר mengandung makna didikan yang mengoreksi atau mendisiplinkan; 'didik' mempertahankan tujuan pembentukan tanpa terdengar menghukum semata-mata.
- source_word: יָּהּ
  choice: ya Yah
  rationale: Teks memakai bentuk singkat puitis nama ilahi, יָהּ, bukan tetragramaton lengkap; 'Yah' mempertahankan perbedaan itu, sedangkan 'ya' menandai sapaan langsung.
- source_word: וּמִתּוֹרָתְךָ
  choice: dari Taurat-Mu
  rationale: Preposisi מִן diterjemahkan 'dari', dan תּוֹרָה dipertahankan sebagai 'Taurat', istilah Indonesia yang dikenal untuk hukum sekaligus pengajaran Allah.
- source_word: תְלַמְּדֶנּוּ
  choice: Kauajari
  rationale: Bentuk Piel dari למד berarti 'mengajar'. Objek tunggalnya tetap laki-laki yang disebut sebelumnya, dan struktur relatif tunggal Ibrani dipertahankan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk nama ilahi יָּהּ
  choice: Yah
  alternative: TUHAN
  rationale: Bentuk singkat puitis nama ilahi dibedakan dari YHWH lengkap agar bentuk sumber tidak diratakan.
- issue: Cakupan makna תּוֹרָה
  choice: Taurat
  alternative: pengajaran
  rationale: '''Taurat'' mempertahankan gema teologis yang mapan, sementara catatan kaki menyatakan bahwa kata Ibrani juga dapat berarti pengajaran secara lebih luas.'
- issue: Referen maskulin הַגֶּבֶר
  choice: laki-laki
  alternative: orang
  rationale: Bentuk maskulin tunggal dipertahankan dalam teks, tanpa menutup kemungkinan fungsi perwakilannya yang diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang bermartabat. Bentuk terikat 'Kau-' dan akhiran hormat '-Mu' dipakai secara konsisten untuk sapaan kepada Allah. Susunan satu klausa relatif dengan dua verba mengikuti struktur Ibrani sambil tetap alami dalam bahasa Indonesia.
