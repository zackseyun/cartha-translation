  text: יְֽהוָ֗ה יֹ֭דֵעַ מַחְשְׁב֣וֹת אָדָ֑ם כִּי הֵ֥מָּה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/011.yaml
  text: The LORD knows the thoughts of man, that they are vapor.
translation:
  language: id
  text: TUHAN mengetahui pikiran-pikiran manusia, bahwa semuanya itu hanyalah uap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kesia-siaan” atau “embusan napas.” Kata Ibrani ini menggambarkan sesuatu yang singkat, fana, atau tidak berbobot.'
    reason: Menjelaskan rentang makna הָבֶל, karena padanan utama 'uap' mempertahankan metafora tetapi tidak memuat seluruh nuansanya.
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mewakili nama ilahi YHWH sesuai konvensi Alkitab bahasa Indonesia yang dikenal luas, dengan huruf kapital untuk membedakannya dari gelar biasa.
- source_word: מַחְשְׁבוֹת אָדָם
  choice: pikiran-pikiran manusia
  rationale: Bentuk jamak מַחְשְׁבוֹת menunjuk pada berbagai pikiran, rancangan, atau pertimbangan; אָדָם di sini bersifat kolektif dan paling alami diterjemahkan 'manusia'.
- source_word: הֵמָּה
  choice: semuanya itu
  rationale: Kata ganti jamak ini merujuk kembali pada pikiran-pikiran manusia dan dibuat eksplisit agar hubungan antarklausa jelas dalam bahasa Indonesia.
- source_word: הָבֶל
  choice: uap
  rationale: Makna konkret dasarnya ialah embusan/uap yang cepat lenyap; pilihan ini mempertahankan citra kefanaan dan kesia-siaan tanpa langsung mereduksinya menjadi konsep abstrak.
theological_decisions:
- issue: Cakupan penilaian bahwa pikiran manusia adalah הבל
  choice: 'Mempertahankan pernyataan umum: ''semuanya itu hanyalah uap'''
  alternative: Menafsirkan secara lebih khusus sebagai 'sia-sia' atau 'tidak berguna'
  rationale: Teks Ibrani menyatakan הבל tanpa memperinci apakah tekanannya pada kefanaan, kekosongan, atau kesia-siaan. Citra 'uap' menjaga keluasan dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan paralelisme ringkas ayat Ibrani.
