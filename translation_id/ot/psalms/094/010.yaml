id: PSA.94.10
reference: Psalms 94:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/יֹסֵ֣ר גּ֭וֹיִם הֲ/לֹ֣א יוֹכִ֑יחַ הַֽ/מְלַמֵּ֖ד אָדָ֣ם דָּֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/010.yaml
  text: He who disciplines nations[a], will he not rebuke—he who teaches man knowledge?
translation:
  language: id
  text: Dia yang mendisiplinkan bangsa-bangsa, masakan tidak menegur—Dia yang mengajarkan pengetahuan kepada manusia[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani memakai אָדָם (’adam), bentuk tunggal yang di sini mewakili manusia pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵר
  choice: mendisiplinkan
  rationale: Kata dari akar יסר menyatakan tindakan mendidik melalui koreksi atau hajaran, bukan sekadar menghukum. “Mendisiplinkan” mempertahankan unsur koreksi dan kewibawaan.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks mazmur, גּוֹיִם menunjuk pada bangsa-bangsa atau kelompok-kelompok manusia secara luas, bukan secara khusus orang bukan Yahudi.
- source_word: יוֹכִיחַ
  choice: menegur
  rationale: Bentuk Hifil dari יכח di sini menyatakan teguran atau koreksi. “Menegur” alami dalam pertanyaan retoris ini dan sejajar dengan tindakan mendisiplinkan.
- source_word: הַמְלַמֵּד
  choice: Dia yang mengajarkan
  rationale: Partisipel ini berfungsi sebagai sebutan substantival bagi Allah. Bentuk tersebut mempertahankan kesejajaran dengan “Dia yang mendisiplinkan”.
- source_word: אָדָם
  choice: manusia
  rationale: Kata tunggal אָדָם dipakai secara representatif untuk umat manusia. “Manusia” menyampaikan cakupan generiknya secara alami dalam bahasa Indonesia tanpa mengubah rujukannya menjadi jamak eksplisit.
- source_word: דָּעַת
  choice: pengetahuan
  rationale: דָּעַת secara langsung berarti pengetahuan atau pengertian; “pengetahuan” merupakan padanan yang paling dekat dan cocok sebagai objek dari “mengajarkan”.
- source_word: הֲ...הֲלֹא
  choice: masakan tidak ...?
  rationale: Rangkaian partikel tanya ini membentuk pertanyaan retoris yang mengharapkan jawaban ya. “Masakan tidak” menyampaikan daya retoris itu secara wajar dan bermartabat.
theological_decisions:
- issue: Pemakaian generik אָדָם
  choice: manusia
  alternative: seorang manusia; umat manusia
  rationale: Ayat ini berbicara tentang manusia secara umum, tetapi teks Ibrani memakai bentuk tunggal representatif. “Manusia” mempertahankan bentuk dan cakupan generik itu secara alami.
- issue: Hubungan klausa terakhir dengan pertanyaan retoris
  choice: Mempertahankan “Dia yang mengajarkan pengetahuan kepada manusia” sebagai uraian tambahan tentang subjek yang menegur
  alternative: Menambahkan gagasan “masakan tidak mengetahui?”
  rationale: Teks Masoret tidak memuat verba “mengetahui” pada ayat ini. Tanda pisah mempertahankan konstruksi yang padat dan ketegangan sintaksisnya tanpa memasukkan predikat yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Ungkapan “masakan tidak” mempertahankan kekuatan pertanyaan retoris, sedangkan tanda pisah mencerminkan susunan Ibrani yang padat. Penanda catatan ditempatkan sesudah “manusia”, sesuai kata yang dijelaskan.
