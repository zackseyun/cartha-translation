translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Bentuk jamak pada ‘penghiburan-penghiburan-Mu’ sengaja dipertahankan meskipun agak lebih bertanda, karena jamak dalam teks Ibrani bermakna dan menyeimbangi banyaknya pikiran yang meresahkan.
