  yaml_path: translation/ot/psalms/094/019.yaml
  text: When my anxious thoughts are many within me[b][a], your consolations delight my soul.
translation:
  language: id
  text: Di tengah banyaknya pikiran yang meresahkan dalam batinku[a], penghiburan-Mu[b] menggembirakan jiwaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika pikiran-pikiran yang meresahkan banyak dalam batinku.” Nomina Ibraninya dapat menggambarkan pikiran yang gelisah, terbagi-bagi, atau bercabang-cabang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “penghiburan-Mu menyenangkan jiwaku.” Bahasa Ibraninya memakai bentuk jamak, yang dapat menunjuk pada banyak atau beragam penghiburan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב
  choice: ketika ... bertambah banyak
  rationale: Gabungan preposisi ב dengan רֹב menyatakan keadaan atau suasana ‘dalam banyaknya/ketika menjadi banyak’. Ungkapan temporal ini alami dalam bahasa Indonesia tanpa menghilangkan gagasan tentang jumlah yang besar.
- source_word: שַׂרְעַפַּי
  choice: pikiran-pikiranku yang menggelisahkan
  rationale: Nomina ini menunjuk pada pikiran batin yang meresahkan, bercabang, atau terbagi-bagi, bukan sekadar pikiran netral. Pilihan ini mempertahankan nuansa pergolakan batin.
- source_word: בְּקִרְבִּי
  choice: dalam batinku
  rationale: Frasa ini secara harfiah menunjuk pada bagian dalam diri. ‘Dalam batinku’ alami dan tepat untuk konteks pergumulan batin yang puitis.
- source_word: תַּנְחוּמֶיךָ
  choice: penghiburan-penghiburan-Mu
  rationale: Bentuk Ibraninya jamak. Pengulangan nomina dalam bahasa Indonesia mempertahankan kemajemukan itu dan dapat menyiratkan berbagai atau berulangnya penghiburan dari Allah.
- source_word: יְשַׁעַשְׁעוּ
  choice: menyenangkan
  rationale: Verba ini menyampaikan kesenangan yang menenteramkan atau menggembirakan. ‘Menyenangkan’ mempertahankan daya positifnya tanpa mereduksinya menjadi sekadar tindakan menghibur.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti hidup, diri, atau jiwa. Dalam puisi tentang pengalaman batin ini, ‘jiwaku’ mempertahankan cakupan personal dan ragam bahasa mazmur.
