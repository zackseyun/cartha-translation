base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/023.yaml
  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: id
  text: Ia akan mengembalikan kesalahan mereka ke atas mereka[a], dan dalam kejahatan mereka, Ia akan membinasakan mereka[b]; Yahweh, Allah kita, akan membinasakan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia telah mengembalikan kesalahan mereka ke atas mereka.” Dalam konteks puisi, verba Ibrani ini dapat dipahami dengan daya lampau ataupun berorientasi masa depan. Kata yang diterjemahkan “kesalahan” juga dapat berarti “kelaliman” atau “perbuatan jahat.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “karena kejahatan mereka Ia akan membinasakan mereka,” atau “melalui kejahatan mereka Ia akan membinasakan mereka.” Preposisi Ibrani dapat menyatakan keadaan, dasar, atau sarana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: Ia akan membalikkan
  rationale: Bentuk kausatif dari שוב menggambarkan tindakan membuat sesuatu kembali. Dalam konteks ini, kejahatan para pelaku dikembalikan kepada mereka sendiri. Kala mendatang selaras dengan dua bentuk יַצְמִיתֵם dan dengan pernyataan keyakinan akan penghakiman Allah.
- source_word: עֲלֵיהֶם אֶת־אוֹנָם
  choice: kejahatan mereka kepada mereka sendiri
  rationale: אוֹן di sini paling wajar menunjuk pada kejahatan atau perbuatan jahat yang kembali menimpa pelakunya. Ungkapan 'kepada mereka sendiri' menyampaikan עֲלֵיהֶם secara alami sekaligus mempertahankan gambaran pembalasan yang terkandung dalam bahasa Ibrani.
- source_word: וּבְרָעָתָם
  choice: dan dalam kejahatan mereka
  rationale: Terjemahan dekat ini mempertahankan keluwesan preposisi ב, yang dapat menyatakan keadaan, sarana, atau dasar, tanpa menetapkan satu tafsiran secara berlebihan.
- source_word: יַצְמִיתֵם
  choice: Ia akan membinasakan mereka
  rationale: צמת dalam bentuk Hifil berarti memusnahkan atau membinasakan. 'Membinasakan' bermartabat, kuat, dan alami dalam bahasa Indonesia. Pengulangannya dipertahankan sebagaimana dalam teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Padanan langsung untuk bentuk dengan sufiks orang pertama jamak, 'Allah kita'.
theological_decisions:
- issue: Aspek verba pembuka וַיָּשֶׁב dalam puisi
  choice: 'Pernyataan berorientasi masa depan: ''Ia akan membalikkan'''
  alternative: 'Bentuk lampau atau perfektif: ''Ia telah membalikkan'''
  rationale: Walaupun bentuknya secara morfologis wayyiqtol, pemakaiannya dalam puisi dapat bersifat nonnaratif. Dua verba imperfektif berikutnya dan konteks keyakinan akan keadilan ilahi mendukung pembacaan berorientasi masa depan, tetapi kemungkinan lampau dicatat.
- issue: Makna relasi ב dalam וּבְרָעָתָם
  choice: '''dalam kejahatan mereka'''
  alternative: '''karena kejahatan mereka'' atau ''melalui kejahatan mereka'''
  rationale: Terjemahan utama mempertahankan ketegangan apakah kejahatan mereka merupakan keadaan, dasar, atau sarana kebinasaan mereka.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama pribadi ilahi; transliterasi mempertahankan perbedaan antara nama tersebut dan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Ia' dipakai untuk Allah sesuai kebiasaan penulisan religius Indonesia. Struktur paralel dan pengulangan penutup dipertahankan untuk mencerminkan tekanan puitis teks Ibrani.
