id: PSA.94.16
reference: Psalms 94:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִֽי יָק֣וּם לִ֭/י עִם מְרֵעִ֑ים מִֽי יִתְיַצֵּ֥ב לִ֝/י עִם פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/016.yaml
  text: Who will rise up for me against evildoers? Who will stand for me against workers of iniquity?[a][b]
translation:
  language: id
  text: Siapa yang akan bangkit membela aku melawan para pelaku kejahatan? Siapa yang akan berdiri membela aku melawan orang-orang yang melakukan kefasikan?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani עִם biasanya berarti “dengan”, tetapi di sini diterjemahkan “melawan” karena konteksnya adalah konfrontasi dengan para pelaku kejahatan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang yang melakukan kejahatan” atau “para pelaku kelaliman”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapa
  rationale: Kata ganti tanya ini membuka kedua pertanyaan yang sejajar.
- source_word: יָקוּם
  choice: akan bangkit
  rationale: Bentuk imperfek Qal dari קום menggambarkan tindakan bangkit untuk menghadapi lawan; ungkapan ini mempertahankan gambaran hidup dari teks Ibrani.
- source_word: לִי
  choice: membela aku
  rationale: Preposisi לִי di sini menunjukkan tindakan demi kepentingan pemazmur. Dalam bahasa Indonesia, 'membela aku' menyampaikan fungsi keberpihakan itu secara alami.
- source_word: עִם
  choice: melawan
  rationale: Arti dasarnya 'dengan', tetapi dalam konteks konfrontatif ini hubungan yang dimaksud ialah berhadapan dengan pihak jahat.
- source_word: מְרֵעִים
  choice: para pelaku kejahatan
  rationale: Partisip ini menunjuk kepada orang-orang yang berbuat jahat; pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יִתְיַצֵּב
  choice: akan berdiri
  rationale: Bentuk Hitpael dari יצב berarti menempatkan diri atau berdiri teguh. 'Akan berdiri' mempertahankan kesejajaran dengan 'akan bangkit'.
- source_word: פֹּעֲלֵי אָוֶן
  choice: orang-orang yang melakukan kefasikan
  rationale: Frasa ini secara harfiah menunjuk kepada para pelaku אָוֶן. Bentuk verbal alami dalam bahasa Indonesia tetap menekankan kebiasaan melakukan kejahatan.
- source_word: אָוֶן
  choice: kefasikan
  rationale: Dalam konteks ini אָוֶן menyatakan keburukan atau kejahatan moral, meskipun cakupan katanya juga dapat mencakup kejahatan dan perbuatan mencelakakan.
theological_decisions: []
