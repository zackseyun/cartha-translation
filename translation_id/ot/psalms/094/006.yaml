  text: Mereka membunuh janda dan orang asing yang menetap[a]; mereka membunuh anak-anak yatim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penduduk asing.” Kata Ibrani גֵר menunjuk kepada orang dari luar yang tinggal menetap di tengah masyarakat.
    reason: lexical_alternative
  - marker: b
