lexical_decisions:
- source_word: אַלְמָנָה
  choice: janda
  rationale: Nomina tunggal ini dipakai secara generik untuk golongan yang rentan. Bahasa Indonesia dapat mempertahankan bentuk tunggal tanpa kata sandang.
- source_word: גֵר
  choice: pendatang
  rationale: Istilah ini menunjuk kepada orang bukan pribumi yang menetap di tengah masyarakat, bukan sekadar orang asing yang sedang lewat. “Pendatang” alami dalam bahasa Indonesia, sementara catatan kaki menjelaskan unsur menetapnya.
- source_word: יַהֲרֹגוּ
  choice: membunuh
  rationale: Padanan langsung dan wajar bagi verba umum yang berarti menyebabkan kematian.
- source_word: יְתוֹמִים
  choice: anak-anak yatim
  rationale: Bentuk Ibrani jamak merujuk secara khusus kepada anak-anak yang kehilangan ayah. “Anak-anak yatim” mempertahankan jumlah dan kekhususan itu secara alami.
- source_word: יְרַצֵּחוּ
  choice: membantai
  rationale: Verba רצח menyatakan pembunuhan yang salah atau melawan hukum. “Membantai” menyampaikan daya moral yang lebih keras dan membedakannya dari verba umum sebelumnya, tanpa memakai ungkapan hukum yang kaku.
