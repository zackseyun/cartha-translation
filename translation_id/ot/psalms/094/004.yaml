  text: They gush forth[a]; they speak arrogantly[b]; all the workers of wickedness boast.
translation:
  language: id
  text: Mereka menyemburkan kata-kata[a] dan berbicara dengan angkuh; semua pelaku kejahatan membanggakan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Mereka menyembur keluar”; “kata-kata” tersirat dari konteks ujaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבִּיעוּ
  choice: menyemburkan kata-kata
  rationale: Bentuk Hifil dari נבע menggambarkan sesuatu yang dibuat memancar atau mengalir keluar. Dalam konteks ujaran, “kata-kata” merupakan objek yang tersirat dan diperjelas oleh verba sejajar “berbicara”.
- source_word: יְדַבְּרוּ
  choice: berbicara
  rationale: Padanan netral dan alami untuk דבר yang mempertahankan kesejajaran dengan verba sebelumnya.
- source_word: עָתָק
  choice: dengan angkuh
  rationale: Kata ini menunjuk pada keangkuhan atau kelancangan, khususnya dalam perkataan. Bentuk adverbial ini alami sesudah “berbicara”.
- source_word: יִתְאַמְּרוּ
  choice: membanggakan diri
  rationale: Bentuk Hitpael menyatakan tindakan meninggikan atau membesarkan diri. “Membanggakan diri” menyampaikan nuansa refleksif dan kesombongan secara wajar dalam bahasa Indonesia.
- source_word: כָּל
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh dari kata Ibrani dan cocok dengan frasa jamak berikutnya.
- source_word: פֹּעֲלֵי אָוֶן
  choice: pelaku kejahatan
  rationale: Ungkapan ini secara harfiah berarti orang-orang yang melakukan kejahatan atau kefasikan. “Pelaku kejahatan” mempertahankan unsur tindakan sekaligus terdengar alami dalam bahasa Indonesia modern.
