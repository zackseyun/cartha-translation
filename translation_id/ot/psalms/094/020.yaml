  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: id
  text: Dapatkah takhta kehancuran[a] bersekutu dengan-Mu—takhta yang membentuk kesusahan melalui ketetapan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “takhta pembawa malapetaka” atau “takhta keruntuhan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membentuk kesusahan di atas ketetapan”; maksudnya mungkin menggunakan hukum atau keputusan sebagai sarana maupun dalih untuk mendatangkan penderitaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  choice: Dapatkah ... bersekutu dengan-Mu
  rationale: Bentuk tanya dari akar חבר menyatakan hubungan atau persekutuan. Dalam konteks takhta, “bersekutu” mempertahankan nuansa hubungan politik sekaligus pertanyaan retoris tentang ketidakselarasan dengan Allah.
- source_word: כִּסֵּא
  choice: takhta
  rationale: Makna lazimnya adalah takhta, yang di sini mewakili kekuasaan atau pemerintahan serta mempertahankan gambaran politik dan peradilan.
- source_word: הַוּוֹת
  choice: kehancuran
  rationale: Bentuk jamak ini dapat menunjuk pada malapetaka, tindakan merusak, atau rancangan yang membawa keruntuhan. “Kehancuran” mempertahankan daya rusaknya tanpa menyamakannya begitu saja dengan istilah umum “kejahatan”.
- source_word: יֹצֵר
  choice: membentuk
  rationale: Partisipel dari יצר secara konkret berarti membentuk atau menjadikan. Pilihan ini mempertahankan gambaran tentang penguasa yang secara aktif membentuk kesusahan melalui kebijakannya.
- source_word: עָמָל
  choice: kesusahan
  rationale: Kata ini dapat berarti kesusahan, penderitaan, jerih payah, atau penindasan. “Kesusahan” cukup luas untuk mempertahankan ambiguitas leksikal, sedangkan konteks pemerintahan lalim menyiratkan dampak yang menindas.
- source_word: עֲלֵי חֹק
  choice: melalui ketetapan
  rationale: Secara harfiah ungkapan ini berarti “di atas ketetapan/hukum”. “Melalui ketetapan” menyampaikan bahwa ketetapan dipakai sebagai sarana untuk menghasilkan kesusahan tanpa memastikan apakah hukum itu instrumen langsung atau sekadar kedok.
theological_decisions:
- issue: Hubungan Allah dengan kekuasaan yang merusak dan menyalahgunakan ketetapan
  choice: Mempertahankan pertanyaan retoris yang menyiratkan bahwa takhta semacam itu tidak dapat bersekutu dengan Allah.
  alternative: Memahaminya secara lebih umum sebagai pertanyaan apakah hakim yang tidak adil dapat duduk bersama Allah dalam penghakiman.
  rationale: Kata “takhta” dan bentuk interogatif berfokus pada keselarasan atau persekutuan suatu kekuasaan dengan Allah. Terjemahan tidak mengubah implikasi itu menjadi pernyataan dogmatis eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pertanyaan retoris serta metafora takhta dipertahankan. Kata “ketetapan” dipilih untuk register hukum yang alami; “melalui” menghindari penafsiran berlebihan atas preposisi Ibrani yang padat.
