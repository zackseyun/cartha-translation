  text: כִּ֤י לֹא יִטֹּ֣שׁ יְהוָ֣ה עַמּ֑/וֹ וְ֝/נַחֲלָת֗/וֹ לֹ֣א יַעֲזֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
translation:
  language: id
  text: Sebab Yahweh tidak akan membuang[a] umat-Nya; Ia tidak akan meninggalkan milik pusaka-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menolak” atau “meninggalkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “warisan-Nya” atau “kepunyaan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau dasar bagi pernyataan di sekitarnya; “Sebab” mempertahankan fungsi penghubung tersebut secara alami.
- source_word: יִטֹּשׁ
  choice: tidak akan membuang
  rationale: Verba נטשׁ dapat berarti membuang, menolak, atau meninggalkan. “Membuang” mempertahankan gambaran penolakan tegas dan membedakannya dari יַעֲזֹב pada baris kedua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Dalam konteks relasi perjanjian, עַם menunjuk kepada umat milik Yahweh; “umat-Nya” merupakan padanan Indonesia yang alami dan bernuansa religius tanpa menjadi usang.
- source_word: נַחֲלָתוֹ
  choice: milik pusaka-Nya
  rationale: נַחֲלָה mencakup warisan, pusaka, atau milik yang diperoleh sebagai bagian. “Milik pusaka-Nya” menjaga gambaran Israel sebagai milik yang menjadi bagian Yahweh sekaligus menghindari kesan bahwa Allah menerima warisan karena kematian pihak lain.
- source_word: יַעֲזֹב
  choice: tidak akan meninggalkan
  rationale: עזב berarti meninggalkan atau menelantarkan. “Meninggalkan” mempertahankan paralelisme dengan baris pertama tanpa menyamakan kedua verba Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Nuansa perjanjian dalam נַחֲלָתוֹ
  choice: milik pusaka-Nya
  alternative: warisan-Nya atau kepunyaan-Nya
  rationale: Pilihan ini mempertahankan metafora umat sebagai bagian atau pusaka Yahweh tanpa mempersempitnya menjadi sekadar kepemilikan dan tanpa memaksakan pengertian warisan modern akibat kematian.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penulisan religius Indonesia; bentuk enklitik “-Nya” menghasilkan ungkapan yang lancar. Paralelisme Ibrani dipertahankan dengan dua verba berbeda: “membuang” dan “meninggalkan”.'
