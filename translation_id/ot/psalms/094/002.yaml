id: PSA.94.2
reference: Psalms 94:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִ֭נָּשֵׂא שֹׁפֵ֣ט הָ/אָ֑רֶץ הָשֵׁ֥ב גְּ֝מ֗וּל עַל גֵּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: id
  text: Bangkitlah[a], ya Hakim bumi; berilah orang-orang sombong balasan yang patut mereka terima.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Angkatlah diri-Mu” atau “Tinggikanlah diri-Mu”; kata Ibrani ini secara lebih harfiah menyerukan agar Allah mengangkat diri atau meninggikan diri-Nya.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “kembalikanlah balasan kepada orang-orang sombong” atau “timpakanlah balasan atas orang-orang sombong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: Bangkitlah
  rationale: Bentuk perintah ini secara harfiah dapat berarti mengangkat diri atau meninggikan diri. Dalam konteks seruan agar Allah bertindak sebagai Hakim, “Bangkitlah” menyampaikan desakan untuk mulai bertindak secara alami dalam bahasa Indonesia, sementara nuansa harfiahnya dipertahankan dalam catatan kaki.
- source_word: שֹׁפֵט
  choice: Hakim
  rationale: Partisip ini dipakai secara substantif sebagai gelar bagi Allah. “Hakim” ringkas, wajar, dan mempertahankan gambaran pengadilan dalam ayat.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam sapaan puitis kepada Allah sebagai Hakim, “bumi” menyampaikan cakupan luas dengan lebih baik daripada “negeri”, yang dapat memberi kesan wilayah tertentu.
- source_word: הָשֵׁב גְּמוּל
  choice: berilah ... balasan yang patut mereka terima
  rationale: Gabungan ini secara harfiah berbicara tentang mengembalikan balasan atau ganjaran. Ungkapan pilihan menyampaikan makna pembalasan yang setimpal secara jelas dan alami tanpa menghilangkan unsur keadilan.
- source_word: עַל גֵּאִים
  choice: kepada orang-orang sombong
  rationale: Preposisi menandai sasaran balasan, sedangkan גֵּאִים menunjuk kepada orang yang angkuh secara moral. “Orang-orang sombong” merupakan padanan Indonesia yang langsung dan umum.
theological_decisions:
- issue: Sifat permohonan akan penghakiman ilahi
  choice: Seruan agar Allah, sebagai Hakim bumi, bangkit bertindak dan memberikan balasan yang setimpal kepada orang-orang sombong.
  alternative: Seruan terutama agar Allah meninggikan atau menyatakan keagungan diri-Nya, bukan agar Ia campur tangan sebagai Hakim.
  rationale: Dua bentuk perintah dan kosakata pengadilan—“Hakim” serta “balasan”—menunjukkan bahwa tindakan penghakiman adalah pokok permohonan. Terjemahan tidak memperluasnya menjadi pernyataan doktrinal di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Sapaan “ya Hakim bumi” mempertahankan gelar ilahi dan struktur seruan, sedangkan klausa kedua dibuat idiomatis agar mudah dipahami pembaca umum.
