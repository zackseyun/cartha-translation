  yaml_path: translation/ot/psalms/094/003.yaml
  text: How long[a], O Yahweh, shall the wicked[c][b], how long shall the wicked exult?
translation:
  language: id
  text: Sampai kapan, ya Yahweh, orang-orang fasik—sampai kapan orang-orang fasik bersukacita?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד מָתַי
  choice: Sampai kapan
  rationale: Ungkapan tanya tentang lamanya keadaan dalam keluhan atau doa; bentuk ini alami dalam bahasa Indonesia dan mempertahankan desakan pemazmur.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Nomina substantival jamak yang menunjuk kepada orang-orang yang bertindak jahat; pilihan ini ringkas, lazim dalam ragam Alkitab Indonesia, dan mempertahankan makna moralnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: יַעֲלֹזוּ
  choice: bersorak-sorai
  rationale: Kata kerja עלז menyatakan kegembiraan yang meluap atau penuh kemenangan; dalam konteks orang fasik, 'bersorak-sorai' menangkap kegembiraan mencolok itu tanpa menambahkan alasan yang tidak disebutkan.
- source_word: repetition of עַד מָתַי רְשָׁעִים
  choice: orang-orang fasik—sampai kapan orang-orang fasik
  rationale: Pengulangan sengaja dipertahankan sebagai penegasan puitis; tanda pisah menandai seruan pertama yang eliptis sebelum pertanyaan lengkap diulang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: ya Yahweh
  alternative: ya TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama itu, sedangkan partikel vokatif 'ya' menghasilkan sapaan yang alami dan khidmat dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan serta ketegangan retoris teks Ibrani dipertahankan; klausa pertama dibiarkan eliptis sebagaimana puisi sumber.
