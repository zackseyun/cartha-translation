  text: הֲ/נֹ֣טַֽע אֹ֭זֶן הֲ/לֹ֣א יִשְׁמָ֑ע אִֽם יֹ֥צֵֽר עַ֝֗יִן הֲ/לֹ֣א יַבִּֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: id
  text: Dia yang menanam telinga[a], masakan tidak mendengar? Dia yang membentuk mata[b], masakan tidak melihat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menanam telinga”; dapat juga dipahami sebagai “menempatkan telinga”. Kata Ibraninya memakai gambaran menanam yang hidup untuk tindakan Sang Pencipta.
    reason: lexical_alternative
  - marker: b
    text: Kata terakhir dapat diterjemahkan lebih harfiah sebagai “memandang” atau “mengamati”; dalam konteks ini maksudnya adalah kemampuan melihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: menanam
  rationale: Partisip Ibrani ini secara harfiah berarti 'menanam'. Pilihan ini mempertahankan gambaran penciptaan yang hidup dan tidak meratakannya menjadi sekadar 'membuat'.
- source_word: אֹזֶן
  choice: telinga
  rationale: Makna dasarnya adalah organ fisik 'telinga'. Bentuk tunggal dipertahankan sesuai teks Ibrani dan kesejajarannya dengan 'mata'.
- source_word: יִשְׁמָע
  choice: mendengar
  rationale: Dalam konteks ini kata kerja שמע menunjuk pada kemampuan mendengar, bukan terutama tindakan menyimak atau menaati.
- source_word: יֹצֵר
  choice: membentuk
  rationale: Partisip dari יצר menyatakan tindakan membentuk atau memberi rupa dengan sengaja, sehingga mempertahankan nuansa Sang Pencipta sebagai pembentuk.
- source_word: עַיִן
  choice: mata
  rationale: Makna leksikal dasarnya ialah organ fisik 'mata'. Bentuk tunggal dipertahankan demi kesejajaran puitis dengan 'telinga'.
- source_word: יַבִּיט
  choice: melihat
  rationale: נבט dapat berarti memandang atau mengamati, tetapi di sini menunjuk pada kemampuan melihat yang sejajar dengan kemampuan mendengar.
- source_word: הֲ...הֲלֹא
  choice: masakan tidak ...?
  rationale: Ungkapan ini menyampaikan pertanyaan retoris yang mengharapkan jawaban ya secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: אִם
  choice: Dia yang
  rationale: Dalam anggota paralel kedua, אִם berfungsi memperkenalkan pertanyaan retoris lanjutan. Pengulangan 'Dia yang' menghasilkan bahasa Indonesia yang jelas tanpa menjadikannya syarat hipotesis.
theological_decisions:
- issue: Bahasa antropomorfis tentang persepsi Allah
  choice: Mempertahankan pertanyaan retoris konkret yang bergerak dari Sang Pencipta kepada kemampuan ciptaan.
  alternative: Memparafrasakan ayat menjadi 'Dia yang memberi pendengaran dan penglihatan tentu mengetahui semuanya'.
  rationale: Teks berargumentasi bahwa Dia yang menciptakan kemampuan manusia untuk mendengar dan melihat tentu juga mempersepsi. Gambaran telinga dan mata dipertahankan tanpa penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Frasa 'masakan tidak' mempertahankan daya pertanyaan retoris. Bentuk tunggal 'telinga' dan 'mata' mengikuti kesejajaran teks Ibrani.
