  yaml_path: translation/ot/psalms/094/017.yaml
  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: id
  text: Seandainya Yahweh bukan penolongku, nyaris jiwaku[a] telah berdiam dalam kesunyian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyawaku”; kata Ibrani nefesy dapat menunjuk pada jiwa, diri, atau nyawa seseorang.
    reason: lexical_alternative
  - marker: b
    text: “Kesunyian” kemungkinan mengacu pada kesunyian kematian atau dunia orang mati.
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: Kalau ... tidak
  rationale: Partikel ini memperkenalkan keadaan berlawanan dengan kenyataan. Bentuk “Kalau ... tidak” menyampaikan syarat kontrafaktual secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: עֶזְרָתָה לִּי
  choice: menjadi penolongku
  rationale: Nomina “pertolongan” dengan konstruksi yang menunjuk kepada pemazmur menyatakan bahwa Yahweh adalah sumber pertolongannya. “Menjadi penolongku” alami dalam konstruksi kontrafaktual ini.
- source_word: כמעט
  choice: sudah hampir
  rationale: Kata ini menunjukkan bahwa hasil tersebut nyaris terjadi. Gabungan “sudah hampir” menyampaikan aspek hasil yang dekat dalam konteks kontrafaktual.
- source_word: שָׁכְנָה
  choice: berdiam
  rationale: Verba שׁכן berarti tinggal, menetap, atau berdiam. “Berdiam” mempertahankan gambaran puitis tentang menetap di dalam kesunyian.
- source_word: דוּמָה
  choice: kesunyian
  rationale: Nomina ini berarti kesunyian atau keadaan diam dan dalam Mazmur dapat mengisyaratkan kematian atau dunia orang mati. Teks utama mempertahankan makna leksikalnya.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפשׁ dapat menunjuk pada jiwa, diri, atau nyawa. “Jiwaku” mempertahankan ungkapan antropologis dan nuansa puitis Ibrani, sedangkan alternatif “nyawaku” dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah implikasi kematian atau dunia orang mati dalam דומה perlu dinyatakan secara eksplisit
  choice: Memakai “kesunyian” dalam teks utama
  alternative: kesunyian maut; dunia orang mati; kematian
  rationale: Konteks kemungkinan besar mengacu pada kematian, tetapi kata Ibraninya sendiri berarti “kesunyian”. Terjemahan utama mempertahankan ungkapan tersebut agar tidak menentukan implikasi teologis secara berlebihan, sementara catatan kaki menjelaskan kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan kondisi kontrafaktual, gambaran “berdiam”, dan ambiguitas antara jiwa, diri, serta nyawa.
