    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: bersekutu
  rationale: Kata kerja ini menggambarkan tindakan berkumpul sebagai kelompok dengan maksud bermusuhan. “Bersekutu” menyampaikan tindakan bersama yang terarah tanpa membatasi gambaran itu pada pasukan militer.
- source_word: עַל
  choice: untuk mencabut
  rationale: Dalam hubungan dengan נֶפֶשׁ dan konteks permusuhan, עַל menunjukkan sasaran serangan. Ungkapan “bersekutu untuk mencabut nyawa” mengungkapkan maksud bermusuhan secara wajar dalam bahasa Indonesia.
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Di sini נֶפֶשׁ menunjuk pada kehidupan konkret orang benar yang terancam, bukan unsur rohani yang terpisah dari tubuh. “Nyawa” juga selaras dengan gambaran darah pada baris kedua.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva tunggal ini dipakai sebagai nomina. “Orang benar” mempertahankan bentuk tunggal representatif dan terdengar alami dalam bahasa Indonesia.
- source_word: דָם
  choice: darahnya
  rationale: Pilihan ini mempertahankan citra konkret “darah” sambil membuat hubungan metonimis antara darah dan orang yang menjadi korban dapat dipahami dalam bahasa Indonesia.
- source_word: נָקִי
  choice: tidak bersalah
  rationale: Kata ini menyatakan bebas dari kesalahan atau tuduhan yang sah. “Tidak bersalah” paling tepat dalam konteks penghakiman.
- source_word: יַרְשִׁיעוּ
  choice: menghukum
  rationale: Bentuk Hifil dari רשע memiliki arti forensik menyatakan bersalah atau menjatuhkan hukuman. “Menghukum” ringkas dan alami, sementara nuansa harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Bentuk tunggal representatif צַדִּיק
  choice: orang benar
  alternative: orang yang benar itu; orang-orang benar
  rationale: Bahasa Ibrani memakai bentuk tunggal yang dapat mewakili suatu golongan. Terjemahan tunggal dipertahankan tanpa mengubahnya menjadi jamak atau membatasi rujukannya pada laki-laki tertentu.
- issue: Hubungan antara darah yang tidak bersalah dan penghukuman
  choice: menghukum orang yang darahnya tidak bersalah
  alternative: menyatakan darah yang tidak bersalah itu bersalah
  rationale: Darah berfungsi secara metonimis bagi orang yang nyawanya ditumpahkan. Susunan ini mempertahankan citra darah dan ketegangan forensik tanpa membuat kalimat utama menjadi tidak wajar dalam bahasa Indonesia; bentuk yang lebih harfiah disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Baris pertama dibuat idiomatis dengan “untuk mencabut nyawa,” sedangkan citra darah dan corak pengadilan pada baris kedua tetap dipertahankan. Kedua catatan kaki menjelaskan bentuk Ibrani yang lebih harfiah dan ambiguitasnya.
