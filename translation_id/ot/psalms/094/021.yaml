  text: They band together against the life of the righteous[b][a], and they condemn innocent blood.
translation:
  language: id
  text: Mereka bersekutu melawan nyawa orang benar[a], dan menyatakan bersalah darah yang tidak bersalah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mereka berkumpul sebagai gerombolan melawan nyawa orang benar.”'
    reason: lexical_alternative
  - marker: b
