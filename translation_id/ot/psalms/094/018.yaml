  text: אִם אָ֭מַרְתִּי מָ֣טָה רַגְלִ֑/י חַסְדְּ/ךָ֥ יְ֝הוָ֗ה יִסְעָדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/018.yaml
  text: When I said, “My foot is slipping,” your steadfast love, O LORD, upheld me.
translation:
  language: id
  text: Ketika aku berkata, “Kakiku tergelincir,” kasih setia-Mu, ya TUHAN, menopangku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Ketika
  rationale: Dalam konteks kesaksian tentang pertolongan yang telah dialami, partikel ini paling alami dipahami secara temporal, bukan sebagai syarat hipotetis.
- source_word: מָטָה רַגְלִי
  choice: Kakiku tergelincir
  rationale: Ungkapan ini menggambarkan hilangnya pijakan atau kestabilan; bentuk Indonesia ini mempertahankan metafora aslinya.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: Menyampaikan kasih yang teguh, setia, dan berkomitmen, yang terkandung dalam חֶסֶד.
- source_word: יִסְעָדֵנִי
  choice: menopangku
  rationale: Kata kerja ini berarti menyokong atau menahan agar seseorang tidak jatuh; 'menopangku' ringkas dan alami.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk menandai nama ilahi YHWH dengan huruf kapital.
theological_decisions:
- issue: Hubungan antara seruan pemazmur dan tindakan kasih setia Allah
  choice: Ketika aku berkata … menopangku
  alternative: Jika aku berkata … akan menopangku
  rationale: Bentuk temporal mempertahankan kesaksian pengalaman pemazmur tanpa mengubah ayat menjadi janji bersyarat atau pernyataan hipotetis.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan puitis; sapaan 'ya TUHAN' mempertahankan seruan langsung kepada Allah, sedangkan 'kasih setia-Mu' memakai istilah Alkitabiah yang tetap mudah dipahami.
