  text: בִּ֭ינוּ בֹּעֲרִ֣ים בָּ/עָ֑ם וּ֝/כְסִילִ֗ים מָתַ֥י תַּשְׂכִּֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/008.yaml
  text: Understand, you brutish among the people; and you fools, when will you become wise?
translation:
  language: id
  text: Mengertilah, hai orang-orang dungu di antara umat; hai orang-orang bodoh, kapankah kalian akan menjadi bijaksana?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: Mengertilah
  rationale: Imperatif jamak dari בין menyerukan agar para pendengar memahami atau menyadari; bentuk ini mempertahankan daya desaknya.
- source_word: בֹּעֲרִים
  choice: orang-orang dungu
  rationale: Istilah ini menggambarkan orang yang tidak berakal dan bersifat seperti binatang; 'dungu' menyampaikan celaan keras secara alami tanpa mempersempitnya menjadi sekadar kurang pengetahuan.
- source_word: בָּעָם
  choice: di antara bangsa ini
  rationale: Preposisi ב dengan עָם paling alami menunjukkan kelompok tempat orang-orang itu berada. 'Bangsa ini' membuat rujukan kolektifnya wajar dalam bahasa Indonesia tanpa menentukan identitas yang tidak dinyatakan dalam ayat.
- source_word: כְסִילִים
  choice: orang-orang bodoh
  rationale: Dalam kosakata hikmat, istilah ini menunjuk orang bodoh secara moral maupun intelektual; pilihan umum ini menjaga keluasan maknanya.
- source_word: תַּשְׂכִּילוּ
  choice: kalian akan menjadi bijaksana
  rationale: Bentuk Hifil dari שׂכל dalam konteks ini menyatakan memperoleh wawasan atau bertindak bijaksana. 'Menjadi bijaksana' mempertahankan pertanyaan retoris dan selaras dengan kontras terhadap kebodohan.
theological_decisions:
- issue: Sifat kebodohan para pendengar
  choice: 'Mempertahankan dua sebutan celaan yang berbeda: ''dungu'' dan ''bodoh''.'
  alternative: Menyamakan keduanya sebagai 'orang bodoh' atau menafsirkannya secara khusus sebagai kebutaan rohani.
  rationale: Teks Ibrani memakai dua leksem berbeda dan tidak secara eksplisit membatasi kebodohan itu pada kategori teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, tegas, dan bermartabat. Seruan langsung dipertahankan dengan 'hai', sedangkan 'kalian' memperjelas subjek jamak dalam pertanyaan tanpa mengubah makna.
