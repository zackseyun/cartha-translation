  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: id
  text: Mazmur Daud.[a] Yahweh[b] adalah gembalaku; aku tidak akan kekurangan apa pun.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur karya Daud,” “Mazmur untuk Daud,” atau “Mazmur yang berkaitan dengan Daud.” Ungkapan Ibrani לְדָוִד dapat menunjukkan kepengarangan, peruntukan, atau keterkaitan.
    reason: alternative_reading
  - marker: b
    text: Ibrani YHWH, nama Allah; secara tradisional sering diterjemahkan “TUHAN.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “aku tidak akan kekurangan.” Objeknya tidak dinyatakan dalam bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Padanan baku dan alami untuk nyanyian yang diiringi musik; sesuai fungsi judul kitab dan superskripsi.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam judul “Mazmur Daud,” konstruksi Indonesia secara alami menyatakan hubungan dengan Daud tanpa memaksakan apakah artinya karya Daud, untuk Daud, atau berkaitan dengan Daud; ambiguitas dijelaskan dalam catatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: רֹעִי
  choice: gembalaku
  rationale: Mempertahankan metafora langsung Ibrani dan sufiks orang pertama tunggal.
- source_word: לֹא אֶחְסָר
  choice: aku tidak akan kekurangan apa pun
  rationale: Menyampaikan makna dasar חָסֵר, yaitu mengalami kekurangan, dalam bahasa Indonesia yang alami; “apa pun” membuat objek tersiratnya jelas tanpa membatasi jenis kebutuhan.
theological_decisions:
- issue: Hubungan superskripsi dengan Daud
  choice: Mazmur Daud
  alternative: Mazmur karya Daud / Mazmur untuk Daud
  rationale: Preposisi לְ dapat menyatakan kepengarangan, peruntukan, atau keterkaitan. Teks utama mempertahankan rumusan tradisional yang ringkas, sedangkan catatan menjaga kemungkinan-kemungkinan tersebut.
- issue: Kala dan cakupan לֹא אֶחְסָר
  choice: aku tidak akan kekurangan apa pun
  alternative: aku tidak kekurangan apa pun
  rationale: Bentuk imperfek dapat menyatakan keadaan berkelanjutan atau orientasi ke depan. Pilihan ini mengikuti daya pernyataan ke depan tanpa menjadikannya klaim teologis yang lebih khusus daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Metafora gembala dipertahankan secara formal, sedangkan klausa penutup dibuat alami bagi pembaca umum. Penanda catatan ditempatkan langsung pada unsur yang dijelaskan.
