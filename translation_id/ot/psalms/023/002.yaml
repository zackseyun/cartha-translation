  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: id
  text: Di padang rumput yang segar Ia membaringkan aku; di dekat air yang menenteramkan[a] Ia menuntun aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “air yang tenang.” Ungkapan Ibrani menekankan air yang berkaitan dengan istirahat atau ketenteraman.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: di padang rumput yang segar
  rationale: נְאוֹת menunjuk pada tempat merumput atau beristirahat bagi kawanan, sedangkan דֶּשֶׁא berarti rumput atau tumbuhan yang segar. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran penggembalaan.
- source_word: יַרְבִּיצֵנִי
  choice: Ia membaringkan aku
  rationale: Bentuk Hifil dari רבץ bersifat kausatif, yakni menyebabkan seseorang berbaring. Pilihan ini mempertahankan tindakan konkret dan tidak mengubahnya menjadi gagasan abstrak tentang istirahat.
- source_word: עַל
  choice: di dekat
  rationale: Dalam konteks dituntun menuju air, preposisi ini menyatakan kedekatan. 'Di dekat' alami dalam bahasa Indonesia dan sesuai dengan gambaran pastoral.
- source_word: מֵי מְנֻחוֹת
  choice: air yang menenteramkan
  rationale: Secara harfiah frasa ini adalah 'air peristirahatan/ketenangan'. Pilihan ini menonjolkan hubungan מְנֻחוֹת dengan rasa tenteram dan istirahat tanpa membatasi maknanya hanya pada air yang tidak bergerak.
- source_word: יְנַהֲלֵנִי
  choice: Ia menuntun aku
  rationale: Bentuk Piel dari נהל berarti menuntun atau membimbing, sering dengan nuansa pemeliharaan. 'Menuntun' mempertahankan citra gembala secara alami.
theological_decisions:
- issue: Terjemahan tradisional 'air yang tenang' dibandingkan makna yang berpusat pada istirahat
  choice: air yang menenteramkan
  alternative: air yang tenang; air yang teduh
  rationale: מְנֻחוֹת menekankan istirahat, ketenteraman, atau tempat beristirahat dan tidak secara eksplisit hanya menyatakan bahwa air itu tidak bergerak. Catatan kaki mempertahankan alternatif tradisional yang masuk akal.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti gaya terbitan yang bermartabat tanpa menambahkan penafsiran. Paralelisme dua klausa Ibrani dipertahankan.
