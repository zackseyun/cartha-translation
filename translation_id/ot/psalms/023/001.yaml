  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: id
  text: 'Mazmur Daud[a].


    Yahweh[b] adalah gembalaku;

    aku tidak akan kekurangan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur oleh Daud” atau “Mazmur untuk Daud”; ungkapan Ibrani לְדָוִד dapat menunjukkan kepengarangan, peruntukan, kepemilikan, atau keterkaitan.
    reason: alternative_reading
  - marker: b
    text: Ibrani YHWH, nama ilahi yang dalam banyak terjemahan ditulis “TUHAN”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah ini merupakan label jenis sastra dalam judul mazmur; “mazmur” adalah padanan baku, jelas, dan sesuai dengan konteks kitab ini.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam frasa judul “Mazmur Daud”, bentuk ini mempertahankan hubungan mazmur dengan Daud tanpa memastikan apakah maksudnya ditulis oleh, dipersembahkan untuk, atau dikaitkan dengan Daud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: רֹעִי
  choice: gembalaku
  rationale: Bentuk dari רעה menunjuk kepada orang yang menggembalakan kawanan. “Gembalaku” merupakan ungkapan Indonesia yang alami dan mempertahankan metafora serta hubungan pribadi dalam teks.
- source_word: לֹא אֶחְסָר
  choice: aku tidak akan kekurangan
  rationale: Kata kerja חסר berarti kekurangan atau tidak mempunyai yang dibutuhkan. Bentuk ini mempertahankan orang pertama dan nuansa verbal yang dapat mengarah ke masa depan, tanpa menambahkan objek yang tidak dinyatakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama ilahi itu alih-alih menggantinya dengan sebuah gelar.
- issue: Makna לְדָוִד dalam judul mazmur
  choice: Mazmur Daud, dengan catatan mengenai keluasan maknanya
  alternative: Mazmur oleh Daud / Mazmur untuk Daud
  rationale: Preposisi לְ dalam judul mazmur dapat menyatakan kepengarangan, peruntukan, kepemilikan, atau keterkaitan. Terjemahan utama yang ringkas disertai catatan menjaga ambiguitas asli tanpa menetapkan satu tafsiran.
- issue: Cakupan pernyataan אֶחְסָר
  choice: aku tidak akan kekurangan
  alternative: aku tidak akan kekurangan apa pun
  rationale: Teks tidak menyebutkan objek secara eksplisit. Rumusan yang dipilih mempertahankan keluasan dan ketegangan metaforisnya tanpa menambahkan janji yang dirumuskan lebih mutlak daripada bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan puitis dua baris mempertahankan kesejajaran pernyataan, sedangkan “gembalaku” menjaga metafora yang akrab dan mudah dipahami.
