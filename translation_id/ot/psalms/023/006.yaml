id: PSA.23.6
reference: Psalms 23:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: id
  text: Sungguh, kebaikan dan kasih setia akan mengejar aku[a] sepanjang hidupku, dan aku akan tinggal[b] di rumah Yahweh sepanjang masa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “akan mengikuti aku.” Kata kerja Ibraninya lebih kuat, yaitu “mengejar,” sehingga menggambarkan kebaikan dan kasih setia Allah yang secara aktif menyusul pemazmur.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “aku akan kembali ke rumah Yahweh.” Vokalisasi teks Masoret mendukung “aku akan tinggal,” tetapi “kembali” merupakan pembacaan alternatif yang sudah lama dikenal.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “untuk panjangnya hari-hari”; dapat juga dipahami “selama-lamanya.” Ungkapan Ibrani ini menyatakan durasi yang berkelanjutan tanpa harus merinci batas akhirnya.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini menyatakan penegasan penuh keyakinan, bukan pembatasan; “Sungguh” alami dalam bahasa Indonesia dan sesuai dengan nada penutup mazmur.
- source_word: טוֹב
  choice: kebaikan
  rationale: Bentuk ini berfungsi seperti nomina abstrak dan sejajar dengan חֶסֶד, sehingga menunjuk pada pemeliharaan Allah yang mendatangkan kebaikan.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini mencakup kasih yang teguh, kesetiaan, dan komitmen relasional; “kasih setia” merupakan padanan Indonesia yang ringkas dan tidak mempersempitnya hanya menjadi belas kasihan.
- source_word: יִרְדְּפוּנִי
  choice: akan mengejar aku
  rationale: Kata kerja ini secara kuat berarti “mengejar,” bukan sekadar “mengikuti,” dan mempertahankan gambaran puitis bahwa kebaikan serta kasih setia secara aktif memburu pemazmur.
- source_word: כָּל יְמֵי חַיָּי
  choice: sepanjang hidupku
  rationale: Padanan idiomatis ini menyampaikan keseluruhan “semua hari kehidupanku” secara alami dalam bahasa Indonesia.
- source_word: וְשַׁבְתִּי
  choice: aku akan tinggal
  rationale: Vokalisasi Masoret paling wajar diturunkan dari ישׁב, “tinggal/diam.” Kemungkinan “kembali” dipertahankan dalam catatan kaki.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Terjemahan ini mempertahankan gambaran konkret rumah atau tempat kediaman ilahi dan memakai nama pribadi yang terdapat dalam teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga identitas nama dalam teks sumber tetap tampak.
- source_word: לְאֹרֶךְ יָמִים
  choice: sepanjang masa
  rationale: Ungkapan Indonesia ini menyampaikan durasi yang panjang dan berkelanjutan secara puitis tanpa secara mutlak menetapkan makna “selama-lamanya”; bentuk harfiah dan alternatifnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Durasi yang dimaksud oleh לְאֹרֶךְ יָמִים
  choice: sepanjang masa
  alternative: selama-lamanya; secara harfiah, “untuk panjangnya hari-hari”
  rationale: Teks dapat menunjuk pada persekutuan yang berlangsung lama atau terus-menerus dan kerap ditafsirkan sebagai kekal. Terjemahan utama mempertahankan keluasan puitisnya tanpa memaksakan durasi tanpa akhir.
- issue: Makna וְשַׁבְתִּי
  choice: aku akan tinggal
  alternative: aku akan kembali
  rationale: Vokalisasi Masoret mendukung makna “tinggal,” tetapi “kembali” merupakan pembacaan lama yang bermakna bagi gambaran ayat ini dan karena itu dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara citra “mengejar,” nama Yahweh, dan ketegangan mengenai tinggal/kembali serta lamanya waktu tetap dipertahankan.
