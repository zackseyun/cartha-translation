lexical_decisions:
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat menunjuk pada jiwa, hidup, atau diri seutuhnya. “Jiwaku” mempertahankan ungkapan puitis Ibrani, sedangkan keluasan maknanya dijelaskan dalam catatan kaki.
- source_word: יְשׁוֹבֵב
  choice: memulihkan
  rationale: Bentuk dari שוב ini dapat berarti mengembalikan, memulihkan, atau menghidupkan kembali. “Memulihkan” alami dalam bahasa Indonesia dan tetap membuka kemungkinan pemulihan tenaga, hidup, maupun keadaan diri.
- source_word: יַנְחֵנִי
  choice: Ia menuntun aku
  rationale: Bentuk kausatif dari נחה berarti menuntun atau membimbing. “Menuntun” konkret dan selaras dengan gambaran gembala dalam mazmur ini.
- source_word: בְמַעְגְּלֵי
  choice: di jalan-jalan
  rationale: מַעְגָּל menunjuk pada jalur, jejak, atau lintasan. “Jalan-jalan” merupakan padanan Indonesia yang alami dalam metafora perjalanan dan tuntunan.
- source_word: צֶדֶק
  choice: yang benar
  rationale: צֶדֶק mencakup kebenaran, keadilan, dan apa yang tepat atau benar. Dalam bahasa Indonesia, “jalan-jalan yang benar” terdengar alami serta dapat mencakup arah yang tepat dan perilaku yang benar.
- source_word: לְמַעַן
  choice: demi
  rationale: לְמַעַן menyatakan tujuan atau alasan. “Demi” secara ringkas menyampaikan bahwa tindakan Allah berkaitan dengan nama, kehormatan, dan sifat-Nya sendiri.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: שֵׁם secara harfiah berarti “nama” dan juga dapat merujuk pada reputasi atau watak. “Nama-Nya” mempertahankan bahasa dan resonansi teologis teks sumber.
theological_decisions:
- issue: Makna “memulihkan jiwaku”
  choice: Pemulihan menyeluruh atas hidup atau diri pemazmur di bawah pemeliharaan sang gembala, dinyatakan dengan ungkapan puitis “jiwaku”.
  alternative: “Menyegarkan hidupku”, “menghidupkan aku kembali”, atau “membawa aku kembali”.
  rationale: נֶפֶשׁ lebih luas daripada gagasan tentang bagian manusia yang tidak berwujud saja, sedangkan יְשׁוֹבֵב dapat menyatakan pemulihan, penyegaran, atau pengembalian. Terjemahan utama mempertahankan daya puitis tanpa menutup keluasan tersebut.
- issue: Makna “jalan-jalan yang benar”
  choice: Jalan yang sesuai dengan apa yang benar, termasuk arah hidup yang lurus secara moral di bawah tuntunan Allah.
  alternative: “Jalan-jalan kebenaran”, “jalan yang tepat”, atau “jalan-jalan keadilan”.
  rationale: צֶדֶק dapat menunjuk pada kebenaran, keadilan, atau ketepatan. Rumusan ini alami dalam bahasa Indonesia dan tidak membatasi frasa hanya pada rute yang aman ataupun hanya pada kategori moral abstrak.
- issue: Makna “demi nama-Nya”
  choice: Allah menuntun sesuai dengan dan demi kehormatan nama, watak, serta reputasi-Nya.
  alternative: “Karena nama-Nya” atau “demi reputasi-Nya”.
  rationale: Bahasa literal tentang nama dipertahankan karena penting dalam teologi Kitab Suci, sementara cakupan idiomatisnya diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Struktur paralel Ibrani dipertahankan, sementara “jalan-jalan yang benar” dipilih agar alami bagi pembaca umum.
