  text: Ia memulihkan jiwaku[a]; Ia menuntun aku di jalan-jalan kebenaran[b] demi nama-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia menyegarkan hidupku”, “Ia menghidupkan aku kembali”, atau “Ia membawa aku kembali”. Kata Ibrani yang diterjemahkan “jiwaku” dapat berarti seluruh diri atau hidup seseorang, bukan hanya bagian manusia yang tidak berwujud.
