  text: גַּ֤ם כִּֽי אֵלֵ֨ךְ בְּ/גֵ֪יא צַלְמָ֡וֶת לֹא אִ֘ירָ֤א רָ֗ע כִּי אַתָּ֥ה עִמָּדִ֑/י שִׁבְטְ/ךָ֥ וּ֝/מִשְׁעַנְתֶּ֗/ךָ הֵ֣מָּה יְנַֽחֲמֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: id
  text: Sekalipun aku berjalan melalui lembah kegelapan pekat[a], aku tidak takut bahaya, sebab Engkau menyertaiku; gada-Mu dan tongkat-Mu—keduanya menghiburku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lembah bayang-bayang maut.” Istilah Ibrani ini dapat berarti kegelapan yang sangat pekat, dengan kemungkinan nuansa kematian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  choice: Sekalipun
  rationale: Mengungkapkan hubungan konsesif secara alami dan puitis dalam bahasa Indonesia.
- source_word: אֵלֵךְ
  choice: aku berjalan
  rationale: Mempertahankan gambaran perjalanan dalam metafora penggembalaan serta nuansa tindakan yang nyata dan berkelanjutan.
- source_word: בְּגֵיא
  choice: melalui lembah
  rationale: Dengan verba gerak, 'melalui' menyampaikan pergerakan di dalam dan menembus lembah secara wajar.
- source_word: צַלְמָוֶת
  choice: gelap gulita
  rationale: Menyampaikan kegelapan yang sangat pekat tanpa membatasi makna pada kematian; nuansa kematian dipertahankan dalam catatan kaki.
- source_word: לֹא אִירָא רָע
  choice: aku tidak takut pada kejahatan
  rationale: Mempertahankan keluasan רָע, yang dapat mencakup kejahatan, malapetaka, bahaya, atau hal yang mencelakakan.
- source_word: כִּי אַתָּה עִמָּדִי
  choice: sebab Engkau menyertaiku
  rationale: Menyatakan alasan keberanian pemazmur dengan bahasa Indonesia yang ringkas dan bermartabat.
- source_word: שִׁבְטְךָ
  choice: gada-Mu
  rationale: Dalam konteks gembala, שֵׁבֶט menunjuk alat kokoh untuk perlindungan dan pengendalian; 'gada' membedakannya dengan tongkat penopang pada baris berikutnya.
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: dan tongkat-Mu
  rationale: Menunjuk tongkat yang menjadi penopang; pilihan ini alami dalam gambaran seorang gembala.
- source_word: הֵמָּה
  choice: keduanya
  rationale: Mempertahankan penekanan dari pronomina mandiri Ibrani bahwa gada dan tongkat itulah yang memberi penghiburan.
- source_word: יְנַחֲמֻנִי
  choice: menghibur aku
  rationale: Mencakup penghiburan dan peneguhan yang timbul dari kehadiran serta perlindungan sang Gembala.
theological_decisions:
- issue: Makna צַלְמָוֶת dalam ungkapan tradisional yang terkenal
  choice: gelap gulita
  alternative: bayang-bayang maut
  rationale: Makna leksikal utamanya dapat menunjuk kegelapan yang sangat pekat, dengan kemungkinan nuansa kematian. Teks utama tidak mempersempitnya hanya pada kematian, sedangkan terjemahan tradisional dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, alami, dan bermartabat. Kapitalisasi pada kata ganti yang merujuk kepada Allah mengikuti kelaziman luas dalam penerbitan Alkitab bahasa Indonesia. Tanda pisah dan 'keduanya' mempertahankan penekanan eksplisit dalam bahasa Ibrani.
