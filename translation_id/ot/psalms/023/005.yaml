base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: id
  text: Engkau menata meja di hadapanku, di depan mata musuh-musuhku; Engkau menyegarkan kepalaku dengan minyak[a]; cawanku melimpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau mengurapi kepalaku dengan minyak.” Secara harfiah, kata kerja Ibrani itu berkaitan dengan membuat kaya atau berlimpah; dalam konteks ini kata tersebut dapat menyatakan penyegaran atau penghormatan yang berlimpah dengan minyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: menata
  rationale: Kata kerja ערך berarti mengatur atau menata. Bersama objek 'hidangan', pilihan ini menggambarkan tindakan tuan rumah yang menyediakan dan menata jamuan, tanpa membatasi maknanya pada menyiapkan makanan saja.
- source_word: שֻׁלְחָן
  choice: hidangan
  rationale: Secara harfiah berarti 'meja', tetapi dalam konteks keramahtamahan menunjuk pada meja jamuan beserta sajian. 'Hidangan' menghasilkan ungkapan Indonesia yang alami dengan verba 'menata', sambil mempertahankan gambaran perjamuan.
- source_word: לְפָנַי
  choice: di hadapanku
  rationale: Mencerminkan arti harfiah 'di depanku/di hadapanku' dan mempertahankan kedekatan relasional dalam puisi.
- source_word: נֶגֶד צֹרְרָי
  choice: di depan mata musuh-musuhku
  rationale: נֶגֶד menyatakan posisi berhadapan atau di depan, sehingga para musuh digambarkan hadir dan menyaksikan. Ungkapan ini alami dalam bahasa Indonesia dan lebih konkret daripada sekadar 'di hadapan' yang akan berulang.
- source_word: דִּשַּׁנְתָּ
  choice: menyegarkan
  rationale: Bentuk piel dari דשׁן secara harfiah berkaitan dengan membuat subur, kaya, atau berlimpah. Dalam konteks kepala dan minyak, 'menyegarkan' menyampaikan perlakuan murah hati seorang tuan rumah tanpa memasukkan makna ritual atau kerajaan yang tidak dinyatakan secara eksplisit.
- source_word: בַשֶּׁמֶן רֹאשִׁי
  choice: kepalaku dengan minyak
  rationale: Mempertahankan unsur konkret 'kepala' dan 'minyak'; teks tidak secara khusus menyebut minyak zaitun.
- source_word: כּוֹסִי רְוָיָה
  choice: cawanku melimpah
  rationale: רְוָיָה menyatakan kejenuhan atau kelimpahan. Predikat 'melimpah' alami dalam puisi Indonesia dan mempertahankan gambaran cawan yang penuh berlimpah.
theological_decisions:
- issue: Gambaran minyak pada kepala dalam דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  choice: 'Diterjemahkan sebagai bahasa keramahtamahan: ''Engkau menyegarkan kepalaku dengan minyak.'''
  alternative: '''Engkau mengurapi kepalaku dengan minyak.'''
  rationale: Kata kerja Ibrani yang dipakai bukan kata lazim untuk 'mengurapi', melainkan דשׁן, yang menekankan kekayaan, kesegaran, atau perlakuan berlimpah. Pilihan ini menjaga gambaran jamuan tanpa menyisipkan klaim sakramental atau kerajaan; alternatif yang umum dicantumkan dalam catatan.
- issue: Aspek waktu dalam rangkaian puisi
  choice: 'Menggunakan kala kini yang tidak ditandai secara morfologis dalam bahasa Indonesia: ''menata'', ''menyegarkan'', ''melimpah''.'
  alternative: Bentuk perfektif seperti 'telah menyiapkan' dan 'telah mengurapi'.
  rationale: Bentuk-bentuk Ibrani dalam puisi dapat menggambarkan pemeliharaan TUHAN secara hidup dan langsung. Bahasa Indonesia tanpa penanda waktu eksplisit mempertahankan keluwesan aspek tersebut.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. 'Engkau' mempertahankan sapaan tunggal yang langsung kepada Allah. 'Cawan' dipilih untuk menjaga warna puisi dan gambaran perjamuan. Tanda titik koma mempertahankan tiga bagian paralel ayat.
