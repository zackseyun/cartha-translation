  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אַ֭שְׁרֵי כָּל יְרֵ֣א יְהוָ֑ה הַ֝/הֹלֵ֗ךְ בִּ/דְרָכָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/000.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: id
  text: Nyanyian ziarah. Berbahagialah setiap orang yang takut akan Yahweh[a], yang hidup menurut jalan-jalan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Betapa bahagianya setiap orang yang takut akan TUHAN.” Kata Ibrani אַשְׁרֵי dapat menunjuk pada keadaan bahagia, sejahtera, atau diberkati.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Secara harfiah berarti 'nyanyian kenaikan-kenaikan'; dalam konteks judul mazmur, ungkapan alami bahasa Indonesia ini menyampaikan kaitannya dengan perjalanan naik menuju Yerusalem tanpa memastikan latar yang tidak dinyatakan teks.
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Menyatakan keadaan bahagia, sejahtera, atau diberkati; bentuk ini alami dan bermartabat dalam pembukaan ucapan bahagia.
- source_word: יְרֵא
  choice: takut akan
  rationale: Mempertahankan ungkapan alkitabiah yang mencakup rasa gentar, hormat, dan ketundukan kepada Allah tanpa mereduksinya menjadi sekadar rasa hormat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat secara eksplisit dalam teks Ibrani.
- source_word: הַהֹלֵךְ בִּדְרָכָיו
  choice: yang hidup menurut jalan-jalan-Nya
  rationale: Kata 'berjalan' merupakan metafora perilaku hidup; 'hidup menurut' terdengar alami dalam bahasa Indonesia, sedangkan bentuk jamak 'jalan-jalan-Nya' dipertahankan.
theological_decisions:
- issue: Makna takut akan Yahweh
  choice: takut akan Yahweh
  alternative: menghormati Yahweh
  rationale: Pilihan ini mempertahankan keluasan dan ketegangan makna ירא, yang dapat mencakup ketakutan sekaligus penghormatan religius.
- issue: Representasi nama ilahi
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai tetragramaton יהוה; bentuk 'Yahweh' membuat nama diri tersebut tampak tanpa memasukkan kebiasaan penggantian liturgis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Nyanyian ziarah' dipilih sebagai judul yang mudah dipahami; 'jalan-jalan-Nya' mempertahankan citra dan bentuk jamak sumber. Penanda catatan kaki [a] ditempatkan langsung setelah 'Yahweh'.
