lexical_decisions:
- source_word: וּרְאֵה
  choice: Kiranya engkau melihat
  rationale: Bentuk imperatif dalam konteks mazmur berkat paling alami dipahami sebagai harapan atau doa. 'Kiranya' mempertahankan nuansa berkat, sedangkan unsur penghubung waw dapat tidak dinyatakan secara tersendiri dalam bahasa Indonesia.
- source_word: בָנִים לְבָנֶיךָ
  choice: anak-anak dari anak-anakmu
  rationale: Ungkapan Ibrani secara harfiah berarti 'anak-anak bagi anak-anakmu' dan menunjuk kepada keturunan generasi berikutnya. Bentuk ini tetap dekat dengan ungkapan sumber sekaligus dapat dipahami sebagai cucu-cucu.
- source_word: שָׁלוֹם
  choice: damai sejahtera
  rationale: Dalam bahasa Indonesia, 'damai sejahtera' merupakan padanan alami yang mencakup bukan hanya ketiadaan konflik, tetapi juga keselamatan, keutuhan, dan keadaan yang baik.
- source_word: עַל
  choice: atas
  rationale: Padanan ini mempertahankan gambaran berkat yang berada atau turun atas Israel dan sesuai dengan gaya ucapan berkat.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan sebagaimana terdapat dalam teks Ibrani tanpa perluasan interpretatif.
theological_decisions:
- issue: Cakupan berkat penutup
  choice: Israel
  alternative: umat yang beribadah secara umum atau gereja secara tipologis
  rationale: Teks Ibrani secara eksplisit menyebut Israel. Terjemahan mempertahankan rujukan historis-perjanjian itu tanpa memasukkan penerapan teologis yang lebih kemudian ke dalam teks utama.
- issue: Sifat klausa pembuka sebagai berkat
  choice: Kiranya engkau melihat
  alternative: Dan lihatlah; engkau akan melihat
  rationale: Konteks Mazmur 128 mendukung pembacaan sebagai doa atau harapan berkat. Terjemahan tidak mengubahnya menjadi perintah langsung atau kepastian prediktif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti tunggal 'engkau' dipakai karena sapaan Ibrani berbentuk tunggal. Tanda seru pada berkat penutup menegaskan sifat benediktif tanpa menambahkan isi teologis.
