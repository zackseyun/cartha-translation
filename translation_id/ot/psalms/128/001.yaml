  yaml_path: translation/ot/psalms/128/001.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: id
  text: 'Nyanyian Pendakian.


    Berbahagialah[a] setiap orang yang takut akan Yahweh,

    yang berjalan di jalan-jalan-Nya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sungguh bahagia setiap orang yang takut akan Yahweh.” Kata Ibrani אַשְׁרֵי menyatakan keadaan bahagia, sejahtera, atau diberkati.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Pendakian
  rationale: Mempertahankan gambaran konkret מַעֲלוֹת sebagai pendakian tanpa memastikan latar sejarahnya sebagai nyanyian ziarah.
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Mengungkapkan keadaan bahagia, sejahtera, dan diberkati dalam bentuk maklumat hikmat; lebih tepat daripada bentuk pasif yang menyiratkan tindakan pemberkatan secara eksplisit.
- source_word: כָּל יְרֵא
  choice: setiap orang yang takut
  rationale: Menyampaikan makna distributif dan inklusif dari bentuk tunggal representatif Ibrani tanpa membatasinya pada laki-laki.
- source_word: יְרֵא יְהוָה
  choice: yang takut akan Yahweh
  rationale: Mempertahankan ungkapan hikmat tentang rasa takut yang penuh hormat kepada Allah, tanpa melunakkannya menjadi sekadar menghormati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הַהֹלֵךְ
  choice: yang berjalan
  rationale: Mempertahankan metafora Ibrani tentang perilaku hidup alih-alih langsung menafsirkannya sebagai 'hidup' atau 'berperilaku'.
- source_word: בִּדְרָכָיו
  choice: di jalan-jalan-Nya
  rationale: Mempertahankan bentuk jamak dan metafora jalan yang menunjuk pada cara hidup yang dikehendaki Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama pribadi itu, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Cakupan gender dalam כָּל יְרֵא
  choice: setiap orang yang takut
  alternative: setiap laki-laki yang takut
  rationale: Partisip maskulin tunggal berfungsi secara generik dan representatif; 'setiap orang' menyampaikan cakupan yang dimaksud tanpa menambahkan pembatasan gender.
- issue: Makna rasa takut dalam יְרֵא יְהוָה
  choice: takut akan Yahweh
  alternative: menghormati Yahweh
  rationale: Pilihan ini menjaga bobot teologis dan rentang makna 'takut' yang mencakup kegentaran serta penghormatan, tanpa menyempitkannya menjadi rasa hormat saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan puitis dua baris dipertahankan; metafora 'berjalan di jalan-jalan-Nya' sengaja dijaga meskipun lebih bercorak sastra daripada percakapan sehari-hari.
