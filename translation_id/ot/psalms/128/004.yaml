  text: הִנֵּ֣ה כִי כֵ֭ן יְבֹ֥רַךְ גָּ֗בֶר יְרֵ֣א יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/004.yaml
  text: Behold[a], thus shall the man who fears Yahweh be blessed.
translation:
  language: id
  text: Lihatlah, demikianlah laki-laki[a] yang takut akan Yahweh akan diberkati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai kata maskulin “laki-laki”; dalam pernyataan umum ini, kata tersebut merujuk kepada orang yang dicirikan oleh sikap takut akan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda perhatian yang tegas dan bernuansa puitis tanpa memakai ungkapan yang usang.
- source_word: כִי כֵן
  choice: begitulah
  rationale: Menyatakan cara atau hasil yang ditunjukkan oleh ayat-ayat sebelumnya secara ringkas dan alami dalam bahasa Indonesia.
- source_word: יְבֹרַךְ
  choice: akan diberkati
  rationale: Bentuk Pual dari ברך bersifat pasif dan menyatakan bahwa orang tersebut menerima berkat; bentuk futurum cocok dengan nada pernyataan hikmat.
- source_word: גָּבֶר
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk maskulin konkret dalam bahasa Ibrani, sementara fungsi peribahasanya sebagai gambaran umum dijelaskan dalam catatan kaki.
- source_word: יְרֵא יְהוָה
  choice: yang takut akan Yahweh
  rationale: Mempertahankan ungkapan khas sastra hikmat mengenai takut kepada Allah dan menerjemahkan partisip sebagai ciri yang menetap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Maskulin generik גָּבֶר
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Pilihan ini mempertahankan bentuk maskulin sumber tanpa menutup fungsi peribahasanya; cakupan representatifnya diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan deklaratif. “Lihatlah” mempertahankan seruan perhatian, sedangkan “begitulah” secara alami menghubungkan ayat ini dengan gambaran berkat sebelumnya.
