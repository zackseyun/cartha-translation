  yaml_path: translation/ot/psalms/128/002.yaml
  text: For you will eat the labor of your hands[a]; blessed are you[b], and it will be well with you.
translation:
  language: id
  text: Engkau akan memakan hasil jerih payah tanganmu[a]; berbahagialah engkau[b], dan segala sesuatunya akan baik bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “jerih payah tanganmu.” Dalam konteks ini, yang dimaksud dapat berupa hasil yang diperoleh dari jerih payah itu.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “beruntunglah engkau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגִיעַ
  choice: hasil jerih payah
  rationale: Nomina ini dapat menunjuk pada jerih payah maupun hasil yang diperoleh darinya. Dalam konteks sesuatu yang dimakan, “hasil jerih payah” menyampaikan makna konkret secara alami tanpa menghilangkan unsur kerja keras.
- source_word: כַּפֶּיךָ
  choice: tanganmu
  rationale: Secara harfiah berarti “kedua telapak tanganmu,” tetapi dalam bahasa Indonesia “tanganmu” merupakan ungkapan alami untuk pekerjaan yang dilakukan sendiri.
- source_word: כִּי
  choice: akan
  rationale: Dalam susunan Ibrani, כִּי dapat dipahami sebagai penanda penegasan atau keadaan (“ketika”). Terjemahan ini menyatukannya dengan bentuk verba mendatang untuk menyatakan hasil yang diharapkan dalam konteks, tanpa menambahkan hubungan sebab-akibat yang terlalu tegas.
- source_word: תֹאכֵל
  choice: akan memakan
  rationale: Bentuk imperfek menyatakan apa yang akan dialami oleh orang yang takut akan TUHAN. Kata “memakan” mempertahankan gambaran konkret tentang menikmati nafkah yang dihasilkan.
- source_word: אַשְׁרֶיךָ
  choice: berbahagialah engkau
  rationale: Ungkapan ucapan bahagia ini menyatakan keadaan sejahtera dan patut dianggap beruntung, bukan semata-mata perasaan senang. “Berbahagialah” sesuai dengan ragam hikmat dan mazmur dalam bahasa Indonesia.
- source_word: וְטוֹב לָךְ
  choice: dan keadaanmu akan baik
  rationale: Frasa ini menyatakan bahwa segala sesuatu akan berlangsung baik bagi orang tersebut. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan cakupan kesejahteraan yang umum.
theological_decisions:
- issue: Ungkapan ucapan bahagia dalam konteks sastra hikmat
  choice: berbahagialah engkau
  alternative: beruntunglah engkau
  rationale: “Berbahagialah” mempertahankan bentuk ucapan bahagia yang lazim dalam Kitab Mazmur dan mencakup kesejahteraan yang lebih luas daripada emosi sesaat, tanpa menyatakan secara berlebihan bahwa kata itu secara langsung berarti tindakan memberkati.
- issue: Hubungan antara kerja dan kesejahteraan
  choice: Pernyataan bahwa orang itu menikmati hasil pekerjaannya dan keadaannya baik
  alternative: Janji kemakmuran material tanpa batas
  rationale: Ayat ini menggambarkan berkat berupa menikmati hasil jerih payah sendiri. Terjemahan tidak memperluasnya menjadi jaminan kekayaan atau kemakmuran material tanpa batas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk orang kedua tunggal “engkau” dipakai untuk mempertahankan sapaan langsung puitis. Gambaran “memakan” dan “tanganmu” dipertahankan, sedangkan “hasil” ditambahkan untuk menyampaikan secara alami kemungkinan makna produktif dari יְגִיעַ.
