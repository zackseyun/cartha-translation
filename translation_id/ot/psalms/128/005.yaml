  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְבָרֶכְ/ךָ֥ יְהוָ֗ה מִ/צִּ֫יּ֥וֹן וּ֭/רְאֵה בְּ/ט֣וּב יְרוּשָׁלִָ֑ם כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/005.yaml
  text: May Yahweh bless you from Zion[a], and may you see the prosperity of Jerusalem all the days of your life.
translation:
  language: id
  text: Kiranya Yahweh memberkati engkau dari Sion, dan kiranya engkau melihat kesejahteraan Yerusalem[a] sepanjang hidupmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebaikan Yerusalem” atau “keadaan baik Yerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Kiranya ... memberkati engkau
  rationale: Bentuk imperfek piel dengan akhiran orang kedua tunggal maskulin dipahami sebagai harapan atau berkat dalam konteks ini. Ungkapan “Kiranya ... memberkati engkau” mempertahankan daya benediktifnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi yang terdapat dalam teks Ibrani tetap tampak.
- source_word: מִצִּיּוֹן
  choice: dari Sion
  rationale: Preposisi מִן menyatakan sumber atau asal. “Dari Sion” secara langsung mempertahankan gambaran berkat yang datang dari Sion.
- source_word: וּרְאֵה
  choice: dan kiranya engkau melihat
  rationale: Imperatif ini mengikuti ungkapan berkat dan secara kontekstual melanjutkan harapan atau doa, bukan sekadar memberi perintah. Pengulangan “kiranya” membuat hubungan tersebut jelas dalam bahasa Indonesia.
- source_word: בְּטוּב
  choice: kesejahteraan
  rationale: טוּב dapat menunjuk pada kebaikan, keadaan baik, atau kesejahteraan. Dalam konteks berkat bagi Yerusalem, “kesejahteraan” menyampaikan keadaan baik kota itu tanpa mempersempitnya hanya pada kemakmuran materi.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Bentuk baku bahasa Indonesia untuk nama tempat tersebut.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: sepanjang hidupmu
  rationale: Ungkapan ini menyampaikan idiom Ibrani “seluruh hari-hari hidupmu” secara alami dan lengkap dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Berkat yang berasal “dari Sion”
  choice: Mempertahankan Sion sebagai sumber atau lokasi berkat tanpa penjelasan tambahan
  alternative: Menjabarkan Sion sebagai pusat bait Allah atau pusat mesianik
  rationale: Ayat menyatakan bahwa berkat datang dari Sion dan menghubungkannya dengan kesejahteraan Yerusalem, tetapi tidak secara eksplisit menguraikan makna teologis Sion lebih jauh.
- issue: Cakupan makna טוּב Yerusalem
  choice: kesejahteraan Yerusalem
  alternative: kebaikan Yerusalem atau keadaan baik Yerusalem
  rationale: “Kesejahteraan” sesuai dengan konteks berkat komunal, tetapi catatan kaki mempertahankan keluasan leksikal kata Ibrani agar maknanya tidak dibatasi secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada berkat. Kata ganti “engkau” dipakai karena sapaan Ibrani berbentuk tunggal dan sesuai dengan register puitis yang bermartabat. Penanda catatan kaki ditempatkan setelah seluruh kalimat karena catatan menjelaskan pilihan leksikal dalam klausa kedua.
