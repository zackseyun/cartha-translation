  text: אֶשְׁתְּ/ךָ֤ כְּ/גֶ֥פֶן פֹּרִיָּה֮ בְּ/יַרְכְּתֵ֪י בֵ֫יתֶ֥/ךָ בָּ֭נֶי/ךָ כִּ/שְׁתִלֵ֣י זֵיתִ֑ים סָ֝בִ֗יב לְ/שֻׁלְחָנֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/003.yaml
  text: Your wife will be like a fruitful vine in the recesses of your house[b][a]; your children will be like olive shoots around your table.
translation:
  language: id
  text: Istrimu seperti pohon anggur yang berbuah lebat di bagian dalam rumahmu[a]; anak-anak lelakimu[b] seperti tunas-tunas pohon zaitun di sekeliling mejamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “di bagian-bagian terdalam rumahmu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “anak-anakmu,” jika istilah maskulin ini dipahami mewakili keturunan secara umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתְּךָ
  choice: istrimu
  rationale: Dalam konteks keluarga, bentuk ini secara wajar berarti istri, bukan sekadar perempuan.
- source_word: כְּגֶפֶן פֹּרִיָּה
  choice: seperti pohon anggur yang berbuah lebat
  rationale: Awalan כ menyatakan perbandingan, dan frasa ini mempertahankan gambaran kesuburan serta hasil yang melimpah.
- source_word: בְּיַרְכְּתֵי בֵיתֶךָ
  choice: di bagian dalam rumahmu
  rationale: יַרְכְּתֵי menunjuk pada bagian yang jauh atau terdalam. Pilihan ini alami dalam bahasa Indonesia sambil mempertahankan nuansa ruang domestik bagian dalam.
- source_word: בָּנֶיךָ
  choice: anak-anak lelakimu
  rationale: Kata Ibrani ini berbentuk jamak maskulin dan secara langsung berarti anak-anak lelaki atau putra-putra; ungkapan yang dipilih jelas dan mudah dipahami.
- source_word: כִּשְׁתִלֵי זֵיתִים
  choice: seperti tunas-tunas pohon zaitun
  rationale: שְׁתִלֵי menggambarkan tanaman muda atau tunas yang ditanam; terjemahan ini menjaga citra pertumbuhan dan daya hidup.
- source_word: סָבִיב לְשֻׁלְחָנֶךָ
  choice: di sekeliling mejamu
  rationale: Terjemahan langsung dan alami untuk gambaran anak-anak yang mengelilingi meja keluarga.
theological_decisions:
- issue: Cakupan istilah keturunan maskulin
  choice: anak-anak lelakimu
  alternative: anak-anakmu
  rationale: Teks sumber memakai bentuk jamak maskulin yang secara khusus dapat berarti anak-anak lelaki. Teks utama mempertahankan penandaan gender itu, sedangkan catatan kaki menyatakan kemungkinan pemakaian representatif bagi anak-anak secara umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Klausa nominal Ibrani dipertahankan tanpa menambahkan penanda waktu “akan”; pengulangan “seperti” menjaga kesejajaran dua gambaran.
