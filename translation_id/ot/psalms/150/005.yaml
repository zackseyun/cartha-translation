  text: Praise him with sounding cymbals[b][a]; praise him with clashing cymbals.
translation:
  language: id
  text: Pujilah Dia dengan simbal yang berdentang[a]; pujilah Dia dengan simbal yang berdentang nyaring.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “simbal yang berbunyi nyaring.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “simbal-simbal teruah.” Kata Ibrani teruah dapat berarti pekik, tiupan, atau sorak kegembiraan; di sini kata itu kemungkinan menggambarkan bunyi simbal yang keras dan nyaring.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Pujilah Dia
  rationale: Bentuk imperatif jamak dari הלל dengan akhiran objek orang ketiga tunggal. Bahasa Indonesia tidak membedakan imperatif tunggal dan jamak secara morfologis; “Pujilah Dia” mempertahankan seruan langsung dan pengulangannya.
- source_word: בְצִלְצְלֵי
  choice: dengan simbal
  rationale: Preposisi ב berfungsi instrumental, yaitu menunjukkan alat yang dipakai untuk memuji. “Simbal” adalah nama alat musik yang jelas dan lazim dalam bahasa Indonesia modern.
- source_word: שָׁמַע
  choice: yang berdentang
  rationale: Dalam rangkaian ini, kata yang berkaitan dengan bunyi atau pendengaran menggambarkan simbal yang memperdengarkan bunyi. “Berdentang” wajar untuk bunyi logam dan tidak menentukan volumenya secara berlebihan.
- source_word: תְרוּעָה
  choice: yang berdentang riuh
  rationale: תְרוּעָה dapat menunjuk pada pekik, tiupan, atau sorak yang nyaring. Ketika menerangkan simbal, ungkapan ini paling alami dipahami sebagai bunyi benturan yang keras dan riuh, sambil tetap mempertahankan nuansa perayaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bernada puitis. Pengulangan “Pujilah Dia” serta kesejajaran kedua bagian dipertahankan. “Simbal” dipilih daripada istilah tradisional “ceracap” agar segera dipahami pembaca masa kini.
