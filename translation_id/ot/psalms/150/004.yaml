  text: הַֽ֭לְלוּ/הוּ בְ/תֹ֣ף וּ/מָח֑וֹל הַֽ֝לְל֗וּ/הוּ בְּ/מִנִּ֥ים וְ/עוּגָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/004.yaml
  text: Praise him with tambourine and dancing[b][a]; praise him with strings and pipe.
translation:
  language: id
  text: Pujilah Dia dengan rebana dan tarian; pujilah Dia dengan alat musik berdawai dan seruling.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suling buluh”. Secara tradisional diterjemahkan “organ”, tetapi kata Ibrani ini kemungkinan menunjuk pada sejenis alat musik tiup kuno, bukan organ berpapan tuts modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Pujilah Dia
  rationale: Bentuk imperatif jamak dari הלל dengan akhiran objek orang ketiga tunggal menyerukan umat untuk memuji Allah. Bahasa Indonesia tidak membedakan imperatif tunggal dan jamak dalam bentuk ini, tetapi objeknya dipertahankan secara jelas.
- source_word: בְתֹף
  choice: dengan rebana
  rationale: תֹף menunjuk pada alat perkusi genggam, kemungkinan besar gendang bingkai atau rebana. “Rebana” merupakan padanan modern yang mudah dipahami dan cukup spesifik.
- source_word: וּמָחוֹל
  choice: dan tarian
  rationale: מָחוֹל dapat berarti tarian atau kegiatan menari. “Tarian” alami dalam rangkaian sarana pujian dan mempertahankan bentuk nomina Ibrani.
- source_word: בְּמִנִּים
  choice: dengan alat musik berdawai
  rationale: מִנִּים menunjuk secara umum pada alat-alat musik berdawai. Padanan ini jelas bagi pembaca modern tanpa menentukan jenis alat tertentu.
- source_word: וְעוּגָב
  choice: dan seruling
  rationale: עוּגָב menunjuk pada alat musik tiup, kemungkinan pipa atau suling buluh. “Seruling” mudah dipahami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan ketidakpastian mengenai bentuk tepat alat kuno tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pengulangan “Pujilah Dia” mengikuti struktur paralel teks Ibrani; nama alat musik dipilih agar dapat dipahami pembaca umum tanpa memberikan kepastian berlebihan tentang alat kuno yang identitasnya tidak sepenuhnya diketahui.
