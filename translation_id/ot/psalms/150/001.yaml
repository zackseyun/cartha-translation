base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/001.yaml
  text: Praise Yah! Praise God in his sanctuary[c][b][a]; praise him in the expanse of his strength.
translation:
  language: id
  text: Pujilah Yah![a] Pujilah Allah di tempat kudus-Nya;[b] pujilah Dia di bentangan kekuatan-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani Yah, bentuk pendek nama ilahi; banyak terjemahan menerjemahkannya sebagai “TUHAN”.
    reason: alternative_reading
  - marker: b
    text: Atau “dalam kekudusan-Nya” atau “di tempat-Nya yang kudus”.
    reason: lexical_alternative
  - marker: c
    text: Atau “di cakrawala kekuatan-Nya” atau “di bentangan-Nya yang perkasa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak dari הלל yang berfungsi sebagai seruan liturgis. “Pujilah” alami, ringkas, dan mempertahankan daya seruan yang diulang.
- source_word: יָ֨הּ
  choice: Yah
  rationale: Ini bentuk pendek nama ilahi, bukan tetragramaton lengkap יהוה. “Yah” mempertahankan pembedaan leksikal dan nuansa seruan liturgis Ibrani.
- source_word: אֵ֥ל
  choice: Allah
  rationale: Di sini אֵל merupakan sebutan bagi Allah. “Allah” adalah padanan baku dan alami dalam bahasa Indonesia tanpa menambahkan gagasan seperti “Yang Mahakuasa” yang tidak dinyatakan oleh nomina tersebut.
- source_word: בְּ/קָדְשׁ֑/וֹ
  choice: di tempat kudus-Nya
  rationale: קדשׁ dapat berarti kekudusan atau tempat kudus. Paralelismenya dengan frasa lokatif berikutnya mendukung makna tempat; “tempat kudus-Nya” jelas dan tetap membuka cakupan yang lebih luas daripada istilah kelembagaan tertentu.
- source_word: הַֽ֝לְל֗וּ/הוּ
  choice: pujilah Dia
  rationale: Imperatif yang sama dengan sufiks objek orang ketiga tunggal maskulin; bahasa Indonesia memerlukan objek eksplisit, yaitu “Dia”.
- source_word: בִּ/רְקִ֥יעַ
  choice: di cakrawala
  rationale: רקיע menunjuk pada bentangan yang terbentang di atas. “Cakrawala” mempertahankan citra kosmis dan lebih wajar dalam bahasa Indonesia daripada transliterasi atau istilah teknis yang kaku.
- source_word: עֻזּֽ/וֹ
  choice: keperkasaan-Nya
  rationale: עז berarti kekuatan, keperkasaan, atau kedahsyatan. “Keperkasaan-Nya” alami dalam gaya puisi pujian dan mempertahankan hubungan genitif dengan “cakrawala” tanpa mengubahnya menjadi adjektiva.
theological_decisions:
- issue: Penerjemahan bentuk pendek nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks memakai bentuk pendek יָהּ, bukan יהוה. “Yah” mempertahankan pembedaan yang terdapat dalam bahasa Ibrani dan gema seruan liturgis halelu-Yah, sementara catatan kaki memberi padanan tradisional yang lazim.
- issue: Rujukan tempat dalam בְּקָדְשׁוֹ
  choice: di tempat kudus-Nya
  alternative: dalam kekudusan-Nya
  rationale: Nomina קדשׁ memang dapat menunjuk pada kekudusan atau tempat kudus. Paralelisme dengan “di cakrawala” lebih mendukung pembacaan lokatif, tetapi alternatif abstraknya tetap dicatat agar ambiguitas sumber tidak dihapus.
- issue: Hubungan genitif dalam רְקִיעַ עֻזּוֹ
  choice: cakrawala keperkasaan-Nya
  alternative: cakrawala-Nya yang perkasa
  rationale: Bentuk genitif Ibrani dapat dipahami sebagai cakrawala yang menyatakan atau memperlihatkan keperkasaan Allah, atau sebagai cakrawala yang perkasa. Terjemahan utama mempertahankan struktur nominal yang lebih dekat dengan sumber; alternatif dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “Pujilah” dipertahankan sebagai seruan liturgis. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda baca menempatkan catatan tepat sesudah unsur yang dijelaskannya.
