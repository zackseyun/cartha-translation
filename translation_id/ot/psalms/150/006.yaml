  text: כֹּ֣ל הַ֭/נְּשָׁמָה תְּהַלֵּ֥ל יָ֗הּ הַֽלְלוּ יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/006.yaml
  text: Let everything that has breath praise Yah[a]. Praise Yah!
translation:
  language: id
  text: Biarlah segala yang bernapas memuji Yah. Pujilah Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Haleluya!” Ungkapan Ibrani הַלְלוּ־יָהּ merupakan asal seruan liturgis “Haleluya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הַנְּשָׁמָה
  choice: segala yang bernapas
  rationale: Ungkapan ini secara alami menyatakan seluruh makhluk yang memiliki napas. Pilihan ini mempertahankan cakupan universal dan gambaran napas dalam bahasa Ibrani tanpa membatasinya pada ‘jiwa’ manusia.
- source_word: תְּהַלֵּל
  choice: biarlah ... memuji
  rationale: Bentuk imperfek di sini bernilai ajakan atau desakan. ‘Biarlah ... memuji’ menyampaikan daya jusifnya secara wajar dalam bahasa Indonesia.
- source_word: יָהּ
  choice: Yah
  rationale: Yah adalah bentuk puitis singkat dari nama ilahi; mempertahankannya menjaga bentuk khas yang benar-benar terdapat dalam teks Ibrani.
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Imperatif jamak הַלְלוּ diterjemahkan sebagai seruan langsung kepada umat, sedangkan nama ilahi sesudahnya menjadi objek pujian. Makna ungkapan diterjemahkan, bukan hanya dialihaksarakan.
theological_decisions:
- issue: Penerjemahan bentuk singkat nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks memakai bentuk puitis singkat יָהּ, bukan bentuk penuh יהוה. ‘Yah’ mempertahankan perbedaan leksikal itu tanpa menambahkan penafsiran denominasi tertentu.
- issue: Penerjemahan seruan liturgis הַלְלוּ־יָהּ
  choice: Pujilah Yah!
  alternative: Haleluya!
  rationale: Menerjemahkan unsur-unsurnya membuat makna perintah tersebut langsung dipahami pembaca. Bentuk liturgis yang lazim tetap dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, puitis, dan bermartabat. ‘Segala yang bernapas’ dipilih sebagai ungkapan alami untuk cakupan universal ayat ini; seruan penutup mempertahankan kekuatan imperatif teks Ibrani.
