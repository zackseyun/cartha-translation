base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/003.yaml
  text: Praise him with the blast of the trumpet[a]; praise him with harp and lyre.
translation:
  language: id
  text: Pujilah Dia dengan tiupan sangkakala[a]; pujilah Dia dengan gambus dan kecapi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan bunyi syofar”; syofar adalah alat tiup dari tanduk, sering kali tanduk domba jantan, yang digunakan dalam ibadah dan untuk memberi isyarat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ/הוּ
  choice: Pujilah Dia
  rationale: Bentuk imperatif jamak dari הלל dengan akhiran orang ketiga tunggal maskulin merupakan seruan langsung kepada umat untuk memuji Allah. Bentuk ini ringkas, alami, dan mempertahankan pengulangannya.
- source_word: בְּ/תֵקַע
  choice: dengan tiupan
  rationale: Nomina תֵּקַע menunjuk pada tindakan atau bunyi peniupan, khususnya bunyi alat tiup; 'tiupan' mempertahankan unsur bunyi/peristiwa, bukan hanya menyebut alatnya.
- source_word: שׁוֹפָר
  choice: sangkakala
  rationale: שׁוֹפָר ialah alat tiup dari tanduk yang dipakai dalam ibadah dan sebagai isyarat. 'Sangkakala' merupakan padanan Indonesia yang wajar dalam konteks puitis dan ibadah, sementara sifat khusus alat itu dijelaskan dalam catatan kaki.
- source_word: בְּ/נֵבֶל
  choice: dengan gambus
  rationale: נֵבֶל adalah alat musik berdawai. 'Gambus' membedakannya dari כִּנּוֹר dan mempertahankan pasangan dua jenis alat musik berdawai, tanpa memakai istilah arkais yang kurang dipahami.
- source_word: וְ/כִנּוֹר
  choice: dan kecapi
  rationale: כִּנּוֹר adalah alat musik berdawai lain. 'Kecapi' merupakan padanan Indonesia yang dikenal dan membedakannya dari נֵבֶל.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan khidmat. Pengulangan imperatif Ibrani dipertahankan. Nama dua alat musik berdawai diterjemahkan dengan dua istilah berbeda untuk menjaga pembedaan dalam teks sumber.
