    text: 'Atau “Pujilah Dia dalam/dengan tindakan-tindakan-Nya yang perkasa.” Preposisi Ibrani dapat diterjemahkan lebih harfiah demikian, tetapi di sini kemungkinan besar menyatakan dasar pujian: “karena.”'
    reason: lexical_alternative
  - marker: b
