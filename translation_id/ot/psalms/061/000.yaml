base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/000.yaml
  text: For the choir director; with stringed instruments. Of David[a].
translation:
  language: id
  text: Untuk pemimpin musik; dengan alat musik petik. Milik Daud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Oleh Daud” atau “Untuk Daud”; preposisi Ibrani ini dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Ungkapan ini jelas dalam bahasa Indonesia modern tanpa membatasi tugasnya hanya pada paduan suara.
- source_word: עַל נְגִינַת
  choice: dengan iringan alat musik petik
  rationale: Dalam konteks petunjuk musikal, עַל dapat memperkenalkan cara pengiringan, sedangkan נְגִינַת menunjuk pada musik atau permainan alat musik berdawai. Ungkapan ini menyampaikan fungsi musikalnya secara alami.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Konstruksi dengan לְ pada judul mazmur dapat menyatakan kepengarangan, peruntukan, kepemilikan, atau keterkaitan. 'Dari Daud' cukup alami sekaligus tidak menegaskan kepengarangan secara mutlak.
theological_decisions:
- issue: Makna preposisi לְ dalam keterangan Daud
  choice: Dari Daud
  alternative: '''Oleh Daud'', ''untuk Daud'', atau ''berkaitan dengan Daud'''
  rationale: Bahasa Ibrani tidak mengharuskan satu hubungan tertentu antara mazmur dan Daud. Terjemahan utama dan catatan kaki mempertahankan keluasan makna itu tanpa menetapkan kesimpulan historis-teologis yang lebih kuat daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. 'Pemimpin musik' dipilih daripada 'pemimpin paduan suara' karena cakupan istilah Ibraninya lebih luas. Tanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
