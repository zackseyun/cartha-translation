  text: So I will sing praise to your name forever[a], to fulfill my vows day by day.
translation:
  language: id
  text: Maka aku akan menyanyikan pujian bagi nama-Mu selama-lamanya, untuk menunaikan[a] nazar-nazarku hari demi hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membayar nazar-nazarku”. Kata kerja Ibrani ini, ketika digunakan untuk nazar, dapat berarti “membayar” atau, secara lebih luas, “menunaikan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Demikianlah
  rationale: Partikel ini menyatakan kesimpulan atau tekad yang bertolak dari doa dan keyakinan sebelumnya; “demikianlah” mempertahankan hubungan tersebut secara alami dan bermartabat.
- source_word: אֲזַמְּרָה
  choice: aku akan menyanyikan pujian
  rationale: Bentuk piel dari זמר lazim menunjuk pada bernyanyi atau bermusik sebagai pujian; frasa ini menyampaikan unsur nyanyian dan ibadah tanpa menambahkan objek yang tidak ada dalam teks.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Padanan langsung yang mempertahankan ungkapan Ibrani; “nama” juga dapat mencakup karakter dan reputasi Allah tanpa perlu dijabarkan dalam teks utama.
- source_word: לָעַד
  choice: untuk selama-lamanya
  rationale: Mengungkapkan keberlangsungan tanpa akhir dengan bahasa Indonesia yang wajar dalam ragam mazmur.
- source_word: לְשַׁלְּמִי
  choice: dan menunaikan
  rationale: Dalam konstruksi dengan nazar, bentuk piel שלם berarti membayar atau memenuhi kewajiban nazar. “Menunaikan” terdengar alami dalam bahasa Indonesia dan mempertahankan gagasan kewajiban yang diselesaikan; penghubung “dan” mengungkapkan kaitan tujuan/kelanjutan tindakan secara luwes.
- source_word: נְדָרַי
  choice: nazar-nazarku
  rationale: Bentuk Ibrani ini jamak. Reduplikasi mempertahankan jumlah jamak secara jelas, sedangkan akhiran “-ku” menyatakan kepunyaan orang pertama.
- source_word: יוֹם יוֹם
  choice: hari demi hari
  rationale: Pengulangan kata “hari” menyatakan keteraturan yang terus berlangsung; “hari demi hari” mempertahankan daya iteratif tersebut secara idiomatis.
