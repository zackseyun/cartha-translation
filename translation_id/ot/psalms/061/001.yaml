base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/001.yaml
  text: Hear my cry[a], O God; listen to my prayer.
translation:
  language: id
  text: Dengarlah seruanku[a], ya Allah; dengarkanlah doaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seruan nyaringku” atau “permohonanku.” Kata benda Ibrani ini dapat berarti seruan nyaring dan, dalam konteks tertentu, pekik sukacita atau nyanyian; di sini konteks doa lebih mendukung arti permohonan yang mendesak.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Dengarlah
  rationale: Imperatif Qal dari שׁמע yang ditujukan kepada Allah. Bentuk ini mempertahankan gambaran konkret tentang mendengar dan wajar dalam bahasa doa Indonesia.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Berfungsi sebagai sapaan langsung. Partikel “ya” menandai vokatif secara alami dan khidmat dalam bahasa Indonesia.
- source_word: רִנָּתִי
  choice: seruanku
  rationale: רִנָּה dapat menunjuk pada seruan nyaring, pekik, atau nyanyian. Dalam konteks doa dan permohonan agar Allah mendengar, “seruanku” mempertahankan nuansa permohonan mendesak tanpa membatasinya menjadi nyanyian.
- source_word: הַקְשִׁיבָה
  choice: perhatikanlah
  rationale: Imperatif Hifil dari קשׁב meminta pendengaran yang sungguh-sungguh atau penuh perhatian. “Perhatikanlah” mengungkapkan intensifikasi terhadap “Dengarlah” dan tetap alami dalam bahasa Indonesia modern.
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: Padanan langsung untuk istilah umum yang berarti doa; bentuk posesif terikat ringkas dan alami serta mempertahankan paralelisme dengan “seruanku”.
theological_decisions: []
