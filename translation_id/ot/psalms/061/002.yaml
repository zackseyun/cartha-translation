base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: id
  text: Dari ujung bumi aku berseru kepada-Mu ketika hatiku menjadi lemah[a]; tuntunlah aku ke batu karang yang lebih tinggi daripada aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika hatiku kewalahan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “yang terlalu tinggi bagiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: Dari ujung bumi
  rationale: קָצֶה menunjuk pada ujung atau batas terjauh. Ungkapan ini mempertahankan gambaran puitis tentang jarak dan keadaan yang ekstrem, sedangkan הָאָרֶץ dalam konteks ini paling wajar diterjemahkan sebagai “bumi”.
- source_word: אֵלֶיךָ אֶקְרָא
  choice: aku berseru kepada-Mu
  rationale: קרא dapat berarti memanggil atau berseru. “Berseru” menyampaikan urgensi doa dengan alami dalam bahasa Indonesia.
- source_word: בַּעֲטֹף לִבִּי
  choice: ketika hatiku menjadi lemah
  rationale: עטף dalam konstruksi ini menggambarkan melemahnya kekuatan batin atau keadaan kewalahan. Pilihan ini jelas dan alami tanpa mempersempit ungkapan pada satu jenis emosi.
- source_word: בְּצוּר
  choice: ke batu karang
  rationale: צוּר adalah batu besar atau batu karang yang secara puitis menyiratkan tempat kokoh dan aman. Gambaran konkretnya dipertahankan dan tidak diganti dengan penafsiran seperti “tempat perlindungan”.
- source_word: יָרוּם מִמֶּנִּי
  choice: yang lebih tinggi daripadaku
  rationale: Frasa ini secara langsung membandingkan ketinggian batu karang dengan pemazmur. Terjemahan ini mempertahankan bentuk perbandingan tanpa memastikan bahwa batu itu mustahil dicapai.
- source_word: תַנְחֵנִי
  choice: tuntunlah aku
  rationale: Bentuk Hifil dari נחה berarti memimpin atau menuntun. “Tuntunlah aku” cocok dengan nada permohonan dan ketergantungan dalam doa ini.
theological_decisions:
- issue: Daya metaforis “batu karang”
  choice: Mempertahankan “batu karang” sebagai gambaran konkret yang menyiratkan perlindungan kokoh.
  alternative: Menerjemahkannya secara eksplisit sebagai “tempat aman” atau “tempat perlindungan”.
  rationale: Teks Ibrani memakai metafora konkret צוּר. Mempertahankannya menjaga puisi dan resonansi teologisnya tanpa menjelaskan secara berlebihan siapa atau apa yang dilambangkan batu karang itu.
- issue: Arti perbandingan יָרוּם מִמֶּנִּי
  choice: “yang lebih tinggi daripadaku”
  alternative: “yang terlalu tinggi bagiku”
  rationale: Bahasa Ibrani secara harfiah menyatakan bahwa batu itu tinggi dibandingkan dengan pemazmur. Gagasan bahwa batu tersebut tidak terjangkau mungkin tersirat, tetapi tidak harus dipastikan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang puitis dan bermartabat. “Berseru” mempertahankan urgensi, “batu karang” menjaga metafora asli, dan bentuk sapaan “kepada-Mu” mengikuti kelaziman ejaan religius Indonesia.
