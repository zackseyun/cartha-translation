id: PSA.61.4
reference: Psalms 61:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָג֣וּרָה בְ֭/אָהָלְ/ךָ עוֹלָמִ֑ים אֶֽחֱסֶ֨ה בְ/סֵ֖תֶר כְּנָפֶ֣י/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/004.yaml
  text: Let me dwell in your tent forever[a]; let me take refuge in the shelter of your wings[b]. Selah
translation:
  language: id
  text: Biarlah[a] aku tinggal di kemah-Mu[b] untuk selama-lamanya; biarlah aku berlindung dalam naungan sayap-Mu. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani menyatakan keinginan atau tekad yang kuat; dapat juga diterjemahkan, “Aku akan tinggal” atau “Kiranya aku tinggal.”
    reason: lexical_alternative
  - marker: b
    text: “Kemah” mungkin mengacu pada tempat kudus atau kediaman Allah; terjemahan tradisional kadang memakai “Kemah Suci”.
    reason: cultural_note
lexical_decisions:
- source_word: אָגוּרָה
  choice: Biarlah aku tinggal
  rationale: Bentuk kohortatif orang pertama tunggal menyatakan keinginan atau tekad kuat. “Biarlah aku tinggal” mempertahankan nuansa kehendak itu dan terdengar alami dalam doa; arti dasar גור yang dapat berarti tinggal sebagai pendatang tidak perlu dibuat kaku di sini.
- source_word: בְּאָהָלְךָ
  choice: di kemah-Mu
  rationale: אָהֶל secara konkret berarti “kemah”. Pilihan ini mempertahankan metafora Ibrani dan tidak langsung mempersempitnya menjadi “Bait Suci” atau istilah keagamaan lain.
- source_word: עוֹלָמִים
  choice: untuk selama-lamanya
  rationale: Bentuk jamak idiomatis ini menegaskan jangka waktu yang tak berkesudahan. “Untuk selama-lamanya” merupakan ungkapan Indonesia yang wajar dan khidmat.
- source_word: אֶחֱסֶה
  choice: biarlah aku berlindung
  rationale: חסה berarti mencari atau mendapatkan perlindungan. Dalam kesejajaran dengan kohortatif pada baris pertama, “biarlah aku berlindung” menyampaikan nada permohonan, meskipun bentuk Ibraninya juga dapat dipahami sebagai pernyataan tekad atau masa depan.
- source_word: בְּסֵתֶר
  choice: dalam naungan
  rationale: סֵתֶר menunjuk pada tempat tersembunyi yang memberi perlindungan. Dalam gambaran sayap, “naungan” mengungkapkan unsur perlindungan dan perlindungan dari pandangan secara alami.
- source_word: כְּנָפֶיךָ
  choice: sayap-Mu
  rationale: Terjemahan langsung yang mempertahankan gambaran Allah sebagai pelindung tanpa menjelaskan identitas metaforanya secara berlebihan.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis atau musikal ini tidak pasti, sehingga ditransliterasikan sesuai kebiasaan penerjemahan Alkitab bahasa Indonesia.
theological_decisions:
- issue: Gambaran tempat kudus dalam “kemah-Mu”
  choice: Mempertahankan “kemah-Mu” sebagai metafora konkret.
  alternative: “Kemah Suci-Mu”, “tempat kudus-Mu”, atau “kediaman-Mu”
  rationale: Ungkapan ini mungkin membangkitkan bayangan tempat kudus atau hadirat Allah, tetapi teks memakai kata konkret “kemah”. Terjemahan tidak menentukan lebih jauh apakah yang dimaksud terutama tempat ibadah, hadirat Allah, atau kediaman surgawi.
- issue: Nuansa kehendak pada kedua klausa
  choice: Menggunakan “biarlah” pada kedua klausa, sambil mencatat kemungkinan tekad/pernyataan.
  alternative: “Aku akan tinggal ... aku akan berlindung”
  rationale: Klausa pertama jelas memakai kohortatif, sedangkan imperfek pada klausa kedua berdiri sejajar dengannya dan wajar dibaca dengan nuansa permohonan. Catatan kaki mempertahankan ketegangan antara permohonan dan tekad.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. “Sela” dipertahankan sebagai istilah yang tidak diterjemahkan.
