id: PSA.61.5
reference: Psalms 61:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֱ֭לֹהִים שָׁמַ֣עְתָּ לִ/נְדָרָ֑/י נָתַ֥תָּ יְ֝רֻשַּׁ֗ת יִרְאֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: id
  text: Sebab Engkau, ya Allah, telah mendengar nazar-nazarku; Engkau telah memberikan warisan orang-orang yang takut akan nama-Mu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga dipahami, “Engkau telah memberikan kepadaku warisan orang-orang yang takut akan nama-Mu.” Teks Ibrani tidak menyebutkan “kepadaku” secara eksplisit, tetapi penerima itu mungkin dipahami dari konteks.
    reason: alternative_reading
  - marker: b
    text: “Takut akan nama-Mu” berarti hidup dengan rasa gentar dan hormat kepada Allah.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan permohonan atau keyakinan sebelumnya dan memperkenalkan alasannya.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Bentuk orang kedua menunjukkan sapaan langsung; ungkapan ini wajar dan khidmat dalam bahasa doa Indonesia.
- source_word: שָׁמַעְתָּ לִנְדָרָי
  choice: telah mendengar nazar-nazarku
  rationale: Verba perfektif menyatakan tindakan yang sudah terjadi dan tetap relevan. Bentuk jamak נְדָרָי dipertahankan sebagai 'nazar-nazarku'; preposisi ל setelah 'mendengar' tidak perlu diterjemahkan secara terpisah dalam bahasa Indonesia.
- source_word: נָתַתָּ
  choice: telah memberikan
  rationale: Menyampaikan tindakan yang telah dilakukan dengan dampak yang masih berlaku, tanpa menambahkan penerima yang tidak dinyatakan dalam teks Ibrani.
- source_word: יְרֻשַּׁת
  choice: warisan
  rationale: Kata ini menunjuk pada milik yang diwarisi atau bagian pusaka. 'Warisan' jelas bagi pembaca modern dan tetap mempertahankan nuansa pemberian sebagai milik.
- source_word: יִרְאֵי שְׁמֶךָ
  choice: orang-orang yang takut akan nama-Mu
  rationale: Terjemahan ini mempertahankan bobot teologis ירא sekaligus memakai ungkapan Indonesia yang lazim untuk rasa gentar dan hormat kepada Allah.
theological_decisions:
- issue: Penerima dalam klausa נָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ
  choice: Engkau telah memberikan warisan orang-orang yang takut akan nama-Mu
  alternative: Engkau telah memberikan kepadaku warisan orang-orang yang takut akan nama-Mu
  rationale: Teks Ibrani tidak menyatakan objek tak langsung 'kepadaku'. Terjemahan utama tidak menambahkannya, sedangkan kemungkinan bahwa penerimanya dipahami dari konteks dicatat dalam catatan kaki.
- issue: Makna 'takut akan nama-Mu'
  choice: mempertahankan ungkapan 'takut akan nama-Mu'
  alternative: orang-orang yang menghormati nama-Mu
  rationale: Ungkapan Ibrani mencakup rasa gentar, hormat, dan ketaatan. Mempertahankan 'takut' menghindari pelemahan makna, sementara catatan menjelaskan maksud idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan hubungan sebab-akibat serta kesejajaran puisi Ibrani. Istilah 'nazar' dan 'warisan' dipilih karena dikenal luas dan cukup dekat dengan istilah sumber.
