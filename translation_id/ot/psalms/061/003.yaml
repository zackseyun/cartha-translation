lexical_decisions:
- source_word: מַחְסֶה
  choice: tempat perlindungan
  rationale: Menyampaikan makna tempat berlindung atau perlindungan secara alami dan jelas dalam bahasa Indonesia.
- source_word: מִגְדַּל עֹז
  choice: menara yang kuat
  rationale: Mempertahankan gambaran konkret menara sebagai benteng perlindungan; עֹז menyatakan kekuatan.
- source_word: מִפְּנֵי אוֹיֵב
  choice: terhadap musuh
  rationale: Dalam konteks perlindungan, frasa ini menggambarkan menara yang melindungi pemazmur dalam menghadapi musuh; bentuk tunggal kolektif 'musuh' dipertahankan.
theological_decisions:
- issue: Metafora Allah sebagai perlindungan dan menara
  choice: 'Metafora dipertahankan secara langsung: ''tempat perlindungan'' dan ''menara yang kuat''.'
  alternative: Menguraikannya sebagai 'Engkau melindungi aku dengan kuat'.
  rationale: Teks Ibrani memakai dua citra puitis yang kaya secara teologis dan tidak perlu dijelaskan secara parafrastis.
- issue: Relasi מִן dalam מִפְּנֵי אוֹיֵב
  choice: terhadap musuh
  alternative: dari hadapan musuh
  rationale: '''Terhadap musuh'' alami dalam bahasa Indonesia dan sesuai dengan fungsi menara sebagai pertahanan, tanpa menambahkan gagasan bahwa musuh telah disingkirkan.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi 'Engkau' dipakai untuk sapaan kepada Allah. Paralelisme puitis Ibrani dipertahankan dalam satu kalimat.
