  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: id
  text: Kiranya Engkau menambahkan hari-hari pada umur raja;[a] kiranya tahun-tahun hidupnya berlangsung dari generasi ke generasi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau akan menambahkan hari-hari pada umur raja; tahun-tahun hidupnya akan berlangsung dari generasi ke generasi.” Bentuk kata kerja Ibrani dapat dibaca sebagai pernyataan tentang masa depan, bukan sebagai permohonan.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “seperti generasi dan generasi”; ungkapan ini menyatakan keberlangsungan melintasi generasi-generasi yang berturut-turut.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: menambahkan hari-hari kepada umur raja
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang menambahkan hari kepada hari-hari raja. Terjemahan ini mempertahankan citra 'hari-hari' sambil memakai 'umur raja' agar maksud penambahan masa hidup jelas dan alami dalam bahasa Indonesia.
- source_word: תּוֹסִיף
  choice: Kiranya Engkau menambahkan
  rationale: Bentuk imperfek orang kedua tunggal dapat dipahami sebagai pernyataan masa depan atau permohonan. Dalam konteks doa mazmur ini, bentuk harapan 'Kiranya Engkau' paling sesuai, sedangkan kemungkinan futurum dicatat dalam catatan kaki.
- source_word: שְׁנוֹתָיו
  choice: tahun-tahun hidupnya
  rationale: Akhiran orang ketiga maskulin merujuk secara alami kepada raja. Penambahan 'hidup' memperjelas bahwa yang dimaksud ialah panjang usia, tanpa mengubah acuannya.
- source_word: כְּמוֹ דֹר וָדֹר
  choice: berlangsung turun-temurun
  rationale: דֹר וָדֹר secara harfiah 'generasi dan generasi' menyatakan kesinambungan sepanjang generasi-generasi berturut-turut. 'Turun-temurun' merupakan padanan Indonesia yang alami; 'berlangsung' melengkapi konstruksi nominal Ibrani menjadi kalimat yang wajar.
theological_decisions:
- issue: Apakah ayat ini merupakan permohonan atau pernyataan tentang masa depan raja
  choice: 'Diterjemahkan sebagai permohonan: ''Kiranya Engkau ...; kiranya ...'''
  alternative: 'Dapat diterjemahkan sebagai pernyataan: ''Engkau akan menambahkan ...; tahun-tahun hidupnya akan ...'''
  rationale: Bentuk verbal Ibrani memungkinkan kedua pembacaan. Konteks doa mendukung pembacaan sebagai permohonan, tetapi ambiguitas gramatikal dipertahankan melalui catatan kaki.
- issue: Cakupan ungkapan 'turun-temurun' bagi tahun-tahun raja
  choice: Metafora keberlangsungan lintas generasi dipertahankan tanpa menjelaskan identitas atau hakikat raja lebih lanjut
  alternative: Menafsirkannya secara eksplisit sebagai umur pribadi yang kekal atau sebagai kelangsungan dinasti
  rationale: Teks dapat menimbulkan ketegangan antara panjang umur seorang raja dan keberlangsungan melampaui satu generasi. Terjemahan tidak memilih penafsiran teologis atau dinastis tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Sapaan kepada Allah memakai 'Engkau'. Susunan puitis paralel dipertahankan, sementara idiom Ibrani dijernihkan secukupnya tanpa meniadakan ketegangan maknanya.
