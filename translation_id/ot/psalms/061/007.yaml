source:
  edition: WLC
  text: יֵשֵׁ֣ב ע֭וֹלָם לִ/פְנֵ֣י אֱלֹהִ֑ים חֶ֥סֶד וֶ֝/אֱמֶ֗ת מַ֣ן יִנְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: id
  text: Kiranya ia bersemayam di hadapan Allah untuk selama-lamanya.[a] Tetapkanlah kasih setia dan kebenaran[b] untuk menjaganya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kiranya ia tinggal di hadapan Allah untuk selama-lamanya.” Kata Ibrani yang dipakai dapat berarti “duduk”, “tinggal”, atau “menetap”; dalam konteks kerajaan ini, kata tersebut mungkin juga menyiratkan bahwa ia bertakhta.
    reason: lexical_alternative
  - marker: b
    text: “Kebenaran” juga dapat diterjemahkan “kesetiaan” di sini. Pasangan Ibrani “kasih setia dan kebenaran/kesetiaan” lazim menyatakan kasih perjanjian Allah dan keterandalan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Kiranya ia bersemayam
  rationale: Bentuk imperfek Qal dari ישב dapat berarti duduk, tinggal, atau menetap. Dalam mazmur kerajaan dan konteks doa ini, “bersemayam” secara alami menyiratkan kediaman sekaligus kedudukan raja, sedangkan “kiranya” menyampaikan daya harapan atau permohonan tanpa mengubahnya menjadi pernyataan masa depan yang pasti.
- source_word: עוֹלָם
  choice: untuk selama-lamanya
  rationale: עוֹלָם menyatakan keberlangsungan tanpa batas dalam konteks puitis ini; ungkapan Indonesia ini alami dan khidmat.
- source_word: לִפְנֵי אֱלֹהִים
  choice: di hadapan Allah
  rationale: Ungkapan ini mempertahankan arti berada atau memerintah dalam hadirat dan pengawasan Allah.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: חֶסֶד mencakup kasih yang teguh dan kesetiaan dalam hubungan perjanjian; “kasih setia” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: אֱמֶת
  choice: kebenaran
  rationale: אֱמֶת dapat berarti kebenaran, kesetiaan, atau keterandalan. “Kebenaran” mempertahankan arti leksikal yang langsung, sementara alternatif kontekstual “kesetiaan” dicatat dalam catatan kaki.
- source_word: מַן
  choice: Tetapkanlah
  rationale: Bentuk ini dipahami sebagai imperatif dari מנה, yakni permohonan agar Allah menetapkan atau menugaskan kasih setia dan kebenaran sebagai penjaga.
- source_word: יִנְצְרֻהוּ
  choice: untuk menjaganya
  rationale: נצר berarti menjaga, memelihara, atau melindungi. Bentuk verba jamak menggambarkan kasih setia dan kebenaran sebagai dua pelaku yang dipersonifikasikan untuk menjaga sang raja.
theological_decisions:
- issue: Daya bentuk imperfek dalam doa kerajaan
  choice: 'Diterjemahkan sebagai harapan atau permohonan: “Kiranya ia bersemayam”'
  alternative: 'Pernyataan masa depan: “Ia akan bersemayam”'
  rationale: Konteks di sekitarnya bersifat permohonan, dan klausa kedua memakai imperatif yang ditujukan kepada Allah. Namun, kemungkinan nuansa duduk atau tinggal tetap dicatat agar ambiguitas Ibrani tidak hilang.
- issue: Makna pasangan חֶסֶד וֶאֱמֶת
  choice: “kasih setia dan kebenaran” sebagai sifat ilahi yang dipersonifikasikan
  alternative: “kasih setia dan kesetiaan” atau “belas kasih dan kebenaran”
  rationale: Pasangan Ibrani ini sering menunjuk pada kasih perjanjian Allah dan keterandalan-Nya. Teks utama mempertahankan “kebenaran”, sedangkan “kesetiaan” diberikan sebagai alternatif yang kuat secara kontekstual.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Bersemayam” dipilih untuk nuansa kerajaan tanpa meniadakan arti tinggal atau menetap; alternatifnya dijelaskan dalam catatan kaki. Pronomina “ia” dan “-nya” dibiarkan merujuk kepada raja sesuai konteks mazmur.
