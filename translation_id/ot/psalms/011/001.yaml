base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: id
  text: 'Untuk pemimpin musik.[a] Dari Daud.


    Aku berlindung kepada TUHAN. Bagaimana mungkin kalian berkata kepadaku, “Larilah seperti burung ke gunungmu”?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk jabatan ini tidak pasti; dapat juga diterjemahkan “pemimpin pujian”.
    reason: Memberi tahu pembaca tentang ketidakpastian leksikal dalam judul mazmur tanpa membebani teks utama.
  - marker: b
    text: Bentuk Ibrani pada bagian akhir secara gramatikal sulit dan memuat bentuk jamak; terjemahan ini mengikuti pengertian tradisional sebagai seruan kepada pemazmur untuk melarikan diri seperti burung ke gunungnya.
    reason: Menjaga ketidakpastian bentuk sumber tanpa mengorbankan kelancaran pembacaan utama.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini muncul dalam judul mazmur dan kemungkinan menunjuk kepada orang yang memimpin pelaksanaan musik; makna jabatan tepatnya tidak pasti.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Mempertahankan hubungan umum dengan Daud tanpa mempersempit preposisi Ibrani menjadi klaim kepengarangan yang lebih tegas daripada sumbernya.
- source_word: בַּיהוָה חָסִיתִי
  choice: Aku berlindung kepada TUHAN
  rationale: Ungkapan idiomatis Indonesia yang alami untuk tindakan mencari dan menaruh perlindungan pada YHWH; nama ilahi ditampilkan menurut konvensi Indonesia sebagai TUHAN.
- source_word: לְנַפְשִׁי
  choice: kepadaku
  rationale: Secara harfiah 'kepada jiwaku', tetapi nefesh di sini berfungsi sebagai rujukan kepada diri orang itu sendiri; 'kepadaku' menyampaikan maksudnya secara alami.
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: Larilah ke gunungmu seperti burung!
  rationale: Mengikuti pengertian tradisional kalimat sebagai desakan untuk melarikan diri ke tempat aman, sambil memakai bentuk Indonesia yang tidak memaksakan jumlah gramatikal Ibrani yang sulit pada frasa ini.
theological_decisions:
- issue: Nama perjanjian יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: TUHAN adalah padanan baku dan bermartabat dalam Alkitab bahasa Indonesia; penulisan dengan huruf kapital membedakannya dari gelar umum tanpa menambahkan penafsiran teologis.
- issue: Arah perlindungan pemazmur
  choice: Aku berlindung kepada TUHAN
  alternative: Kepada TUHAN aku telah mencari perlindungan
  rationale: Bentuk ini mempertahankan pengakuan pribadi kepada YHWH dan tidak menentukan secara berlebihan apakah tindakan itu hanya lampau atau merupakan keadaan percaya yang berlanjut.
translation_notes:
  register: Bahasa modern, ringkas, dan bermartabat. Bentuk jamak pada 'kalian' mempertahankan תאמרו, sedangkan 'gunungmu' mengikuti pembacaan idiomatis tradisional dan membiarkan bahasa Indonesia tidak menegaskan jumlah pada bentuk perintah. Tanda seru ditempatkan di dalam kutipan dan tanda tanya menutup pertanyaan utama.
