  text: כִּ֤י הִנֵּ֪ה הָ/רְשָׁעִ֡ים יִדְרְכ֬וּ/ן קֶ֗שֶׁת כּוֹנְנ֣וּ חִצָּ֣/ם עַל יֶ֑תֶר לִ/יר֥וֹת בְּמוֹ אֹ֝֗פֶל לְ/יִשְׁרֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
translation:
  language: id
  text: Sebab, lihatlah, orang-orang fasik membentangkan busur; mereka telah memasang anak panah pada tali busur untuk memanah dalam kegelapan[a] orang-orang yang tulus hati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari dalam kegelapan.” Frasa Ibrani ini dapat menekankan keadaan gelap ketika serangan dilakukan atau tempat tersembunyi dari mana serangan itu dilancarkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan yang mendasari pernyataan sebelumnya dan mempertahankan hubungan argumentatif dengan ayat 1.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Partikel penunjuk ini menarik perhatian pada ancaman yang sedang dihadapi; bentuk ini hidup, wajar, dan tetap bermartabat dalam bahasa Indonesia.
- source_word: הָרְשָׁעִים
  choice: orang-orang fasik
  rationale: Menggambarkan para pelaku yang rusak secara moral, bukan sekadar orang yang dinyatakan bersalah secara hukum; istilah ini juga lazim dalam konteks Mazmur.
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: melenturkan busur
  rationale: Idiom Ibrani menggambarkan tindakan membengkokkan atau menyiapkan busur untuk digunakan; terjemahan ini mempertahankan gambaran konkretnya.
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: mereka telah memasang anak panah pada tali busur
  rationale: Menyampaikan persiapan yang disengaja dengan menempatkan anak panah pada tali; bentuk tunggal 'anak panah' mengikuti teks Ibrani.
- source_word: לִירוֹת
  choice: untuk memanah
  rationale: Infinitif ירה dipakai dalam arti memanah atau menembakkan anak panah; pilihan ini jelas dalam konteks busur tanpa kesan senjata api.
- source_word: בְּמוֹ אֹפֶל
  choice: dalam kegelapan
  rationale: Menggambarkan keadaan gelap atau serangan tersembunyi. Kemungkinan arti 'dari dalam kegelapan' dipertahankan dalam catatan kaki.
- source_word: לְיִשְׁרֵי לֵב
  choice: orang-orang yang tulus hati
  rationale: Ungkapan Ibrani menunjuk pada integritas batin dan kelurusan moral; pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur hati.
