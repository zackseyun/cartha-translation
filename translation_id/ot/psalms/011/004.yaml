id: PSA.11.4
reference: Psalms 11:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֤ה בְּֽ/הֵ֘יכַ֤ל קָדְשׁ֗/וֹ יְהוָה֮ בַּ/שָּׁמַ֪יִם כִּ֫סְא֥/וֹ עֵינָ֥י/ו יֶחֱז֑וּ עַפְעַפָּ֥י/ו יִ֝בְחֲנ֗וּ בְּנֵ֣י אָדָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: id
  text: Yahweh ada di bait-Nya yang kudus; Yahweh—takhta-Nya ada di surga. Mata-Nya memandang; kelopak mata-Nya menguji umat manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak manusia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: di bait-Nya yang kudus
  rationale: הֵיכָל dapat berarti istana atau bait; dalam konteks tempat kediaman kudus Yahweh dan kesejajarannya dengan takhta surgawi, 'bait' mempertahankan citra sakral tanpa memastikan bahwa yang dimaksud hanya bangunan di bumi.
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: takhta-Nya ada di surga
  rationale: Menyampaikan susunan topik khas Ibrani secara alami sambil mempertahankan penegasan lokasi takhta Yahweh.
- source_word: עֵינָיו יֶחֱזוּ
  choice: Mata-Nya memandang
  rationale: חזה berarti melihat atau memandang; 'memandang' cocok dengan ragam puisi yang bermartabat dan menyiratkan pengamatan tanpa menambahkan objek yang tidak dinyatakan.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: kelopak mata-Nya menguji
  rationale: Mempertahankan antropomorfisme harfiah 'kelopak mata' serta daya evaluatif בחן, yaitu menguji atau memeriksa.
- source_word: בְּנֵי אָדָם
  choice: umat manusia
  rationale: Ungkapan harfiah 'anak-anak manusia' berfungsi kolektif untuk manusia pada umumnya; 'umat manusia' menyampaikan cakupan itu secara wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Gambaran tempat kediaman ilahi
  choice: 'Mempertahankan kedua pernyataan: Yahweh berada di bait-Nya yang kudus dan takhta-Nya berada di surga.'
  alternative: Menafsirkan bait kudus hanya sebagai bait di bumi, atau menyamakannya sepenuhnya dengan surga.
  rationale: Teks Ibrani menempatkan kedua gambaran berdampingan. Terjemahan tidak meleburkan atau membatasi hubungan keduanya.
- issue: Makna kolektif בְּנֵי אָדָם
  choice: umat manusia
  alternative: anak-anak manusia; manusia
  rationale: Ungkapan ini merujuk secara umum kepada manusia, bukan hanya laki-laki; pilihan tersebut menjaga makna kolektif tanpa mengimpor pembatasan gender.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang lugas dan bermartabat. Pengulangan nama Yahweh, susunan topikal pada klausa kedua, serta citra antropomorfis mata dan kelopak mata dipertahankan.
