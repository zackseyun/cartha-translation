  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: id
  text: Jika dasar-dasar dihancurkan[a], apa yang dapat dilakukan orang benar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab dasar-dasar sedang diruntuhkan; apa yang telah dilakukan orang benar?” Bentuk bahasa Ibraninya memungkinkan terjemahan kata kerja terakhir yang lebih berorientasi pada masa lampau, meskipun menurut konteks ungkapan itu lazim dipahami sebagai “apa yang dapat dilakukan orang benar?”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam konteks pertanyaan retoris ini, partikel tersebut paling alami dipahami sebagai pengantar syarat, meskipun dapat pula berarti “sebab”.
- source_word: הַשָּׁתוֹת
  choice: dasar-dasar
  rationale: Mempertahankan gambaran konkret dalam bahasa Ibrani tanpa membatasi acuannya pada tatanan sosial, keadilan, atau tata moral tertentu.
- source_word: יֵהָרֵסוּן
  choice: dihancurkan
  rationale: Bentuk Nifal menyatakan makna pasif, yakni diruntuhkan atau dihancurkan.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Bentuk tunggal ini bersifat representatif; “orang benar” alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak ada dalam teks.
- source_word: מַה
  choice: apa
  rationale: Mengawali pertanyaan retoris secara langsung.
- source_word: פָּעָל
  choice: dapat dilakukan
  rationale: Secara bentuk merupakan qatal yang dapat diterjemahkan “telah dilakukan”, tetapi dalam konteks ini pertanyaan mengenai kemungkinan tindakan lebih alami; alternatif yang mempertahankan orientasi lampau dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan metaforis “dasar-dasar”
  choice: Mempertahankan metafora tanpa menentukan acuannya.
  alternative: Menafsirkannya secara khusus sebagai dasar masyarakat, keadilan, tata moral, atau tatanan perjanjian.
  rationale: Gambaran Ibraninya luas dan terbuka; penerjemahan tidak seharusnya menutup ketegangan penafsiran tersebut.
- issue: Nilai waktu dan modalitas פָּעָל
  choice: Menerjemahkan secara kontekstual sebagai “dapat dilakukan”.
  alternative: “Telah dilakukan orang benar?”
  rationale: Bentuk verbalnya secara formal mendukung pembacaan lampau, tetapi rangkaian pertanyaan retoris dalam konteks mazmur lazim dipahami sebagai pertanyaan tentang apa yang masih dapat dilakukan orang benar. Ambiguitas asli dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. Metafora asli dipertahankan, sedangkan susunan pertanyaan dibuat alami bagi pembaca umum.
