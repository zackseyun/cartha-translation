  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד בַּֽ/יהוָ֨ה חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְ/נַפְשִׁ֑/י נודו הַרְ/כֶ֥ם צִפּֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: id
  text: 'Untuk pemimpin musik. Dari Daud.[a]


    Kepada Yahweh aku berlindung. Bagaimana mungkin kalian berkata kepada jiwaku, “Mengungsilah ke gunung kalian, burung”?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat juga berarti “milik Daud,” “untuk Daud,” atau “tentang Daud.”
    reason: source_ambiguity
  - marker: b
    text: Bahasa Ibraninya sulit. Secara harfiah, teks Masoret berbunyi kira-kira, “Mengungsilah ke gunung kalian, burung.” Kata perintah dan “kalian” berbentuk jamak, sedangkan “burung” berbentuk tunggal. Ada yang memahami maksudnya sebagai “Mengungsilah seperti burung ke gunung kalian.”
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini menunjuk kepada orang yang memimpin atau mengarahkan pelaksanaan musik; terjemahan ini alami dalam bahasa Indonesia tanpa mempersempitnya menjadi jabatan denominasi tertentu.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan ini dapat menandai karya yang berasal dari, berkaitan dengan, atau dipersembahkan kepada Daud. “Dari Daud” ringkas dan tidak memaksakan arti kepengarangan secara berlebihan.
- source_word: בַּיהוָה חָסִיתִי
  choice: Kepada Yahweh aku berlindung
  rationale: Kata kerja bentuk perfektif menyatakan tindakan atau keadaan percaya yang telah diambil dan tetap berlaku; ungkapan Indonesia ini menyampaikan keyakinan tersebut dengan wajar. Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: לְנַפְשִׁי
  choice: kepada jiwaku
  rationale: Terjemahan formal ini mempertahankan נֶפֶשׁ, yang di sini dapat berfungsi sebagai cara menegaskan diri si pemazmur, yakni “kepadaku” atau “kepada diriku”.
- source_word: נוּדוּ הַרְכֶם צִפּוֹר
  choice: Mengungsilah ke gunung kalian, hai burung!
  rationale: Teks Masoret memuat perintah jamak, sufiks orang kedua jamak pada “gunung,” lalu kata tunggal “burung.” Terjemahan utama mempertahankan ketidakselarasan gramatikal dan citra sulit itu, alih-alih diam-diam menyelaraskannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri dalam teks sumber ditampilkan secara langsung; pilihan ini membedakannya dari gelar umum אֲדֹנָי tanpa memasukkan penafsiran denominasi.
- issue: Makna metafora perlindungan
  choice: Kepada Yahweh aku berlindung
  alternative: Aku percaya kepada Yahweh
  rationale: “Berlindung” mempertahankan citra konkret חָסָה dan ketegangan antara perlindungan ilahi dan nasihat manusia untuk melarikan diri.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. “Kepada jiwaku” sengaja dipertahankan untuk mencerminkan bentuk Ibrani, sementara tanda baca dan “hai” memperjelas kemungkinan pembacaan vokatif tanpa menghapus alternatif yang dicatat dalam catatan kaki.
