source:
  edition: WLC
  text: יְהוָה֮ צַדִּ֪יק יִ֫בְחָ֥ן וְ֭/רָשָׁע וְ/אֹהֵ֣ב חָמָ֑ס שָֽׂנְאָ֥ה נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/005.yaml
  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
translation:
  language: id
  text: Yahweh menguji orang benar, tetapi jiwa-Nya[a] membenci orang jahat dan orang yang mencintai kekerasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih lancar dapat diterjemahkan, “Ia membenci.” Ungkapan Ibrani “jiwa-Nya membenci” menegaskan kejijikan pribadi yang mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva substantival ini menunjuk secara umum kepada orang yang bercirikan kebenaran; bentuk tunggal generiknya tetap terpelihara dan wajar dalam bahasa Indonesia.
- source_word: יִבְחָן
  choice: menguji
  rationale: Kata kerja בחן menyatakan tindakan menguji atau memeriksa untuk menilai; 'menguji' ringkas dan tidak mempersempit maknanya menjadi sekadar mengamati atau menghukum.
- source_word: רָשָׁע
  choice: orang jahat
  rationale: Adjektiva substantival yang berlawanan dengan 'orang benar'; pilihan ini jelas dan alami bagi pembaca Indonesia modern.
- source_word: אֹהֵב חָמָס
  choice: orang yang mencintai kekerasan
  rationale: Bentuk partisip ini menggambarkan orang yang bercirikan kesukaan terhadap kekerasan; terjemahan tersebut mempertahankan daya habitualnya.
- source_word: חָמָס
  choice: kekerasan
  rationale: Dalam konteks ini kata tersebut menunjuk pada kekerasan atau kejahatan dengan unsur kekerasan; 'kekerasan' merupakan padanan langsung dan sesuai.
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: jiwa-Nya membenci
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah menyebut 'jiwa-Nya' dan menegaskan kebencian pribadi yang mendalam, tanpa meratakannya menjadi sekadar 'Ia membenci'.
theological_decisions:
- issue: Acuan dan daya ungkapan 'jiwa-Nya'
  choice: '''Jiwa-Nya'' mengacu kepada Yahweh sendiri dan menyatakan kejijikan pribadi yang mendalam.'
  alternative: Menerjemahkan secara lebih lancar sebagai 'Ia membenci'.
  rationale: Teks menghubungkan kebencian itu dengan נֶפֶשׁ Yahweh. Mempertahankan ungkapan tersebut menjaga kekuatan antropomorfis dan ketegangan teologis teks tanpa menjelaskan hakikat perasaan ilahi melampaui apa yang dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang jahat' dipilih daripada 'orang fasik' agar mudah dipahami pembaca umum, sedangkan 'jiwa-Nya' dipertahankan untuk menjaga kekuatan khas ungkapan Ibrani.
