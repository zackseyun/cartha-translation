  text: כִּֽי צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
translation:
  language: id
  text: Sebab Yahweh itu adil; Ia mengasihi perbuatan-perbuatan yang adil; orang-orang yang lurus akan memandang wajah-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meskipun kurang mungkin, “wajah-Nya memandang orang-orang yang lurus.” Susunan klausa terakhir dalam bahasa Ibrani telah dipahami dengan lebih dari satu cara.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “wajah-Nya.” Ungkapan ini juga dapat menyiratkan kehadiran atau perkenanan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” mempertahankan fungsi penjelasnya secara alami dalam bahasa Indonesia.
- source_word: צַדִּיק
  choice: benar
  rationale: Menggambarkan watak moral Yahweh. Pilihan ini juga mempertahankan kaitan akar katanya dengan צְדָקוֹת melalui pengulangan kata “benar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: צְדָקוֹת
  choice: perbuatan-perbuatan benar
  rationale: Bentuk jamak ini paling wajar menunjuk pada tindakan-tindakan konkret yang benar, bukan semata-mata sifat abstrak; ungkapan ini sekaligus mempertahankan hubungan leksikal dengan צַדִּיק.
- source_word: אָהֵב
  choice: mencintai
  rationale: Menyatakan sikap Yahweh yang tetap dan khas; “mencintai” merupakan padanan langsung yang alami.
- source_word: יָשָׁר
  choice: orang-orang yang tulus
  rationale: Kata sifat ini dipakai secara substantival bagi manusia yang lurus secara moral. Kata kerja jamak yang menyertainya mendukung pengertian jamak kolektif.
- source_word: יֶחֱזוּ
  choice: akan memandang
  rationale: Kata kerja ini berarti melihat atau memandang dan dapat menyiratkan penglihatan yang penuh perhatian; “akan memandang” mempertahankan nada puitis tanpa terdengar usang.
- source_word: פָנֵימוֹ
  choice: wajah-Nya
  rationale: Secara harfiah berarti “wajah-Nya”. Citra konkret ini dipertahankan dalam teks utama, sementara nuansa “kehadiran” atau “perkenanan” diterangkan dalam catatan kaki.
theological_decisions:
- issue: Subjek dan objek dalam klausa terakhir
  choice: orang-orang yang tulus akan memandang wajah-Nya
  alternative: wajah-Nya memandang orang yang tulus
  rationale: Kata kerja berbentuk jamak יֶחֱזוּ paling wajar menjadikan orang-orang yang tulus sebagai subjek, sedangkan “wajah-Nya” menjadi objek. Namun, susunan bahasa Ibrani telah dipahami dengan lebih dari satu cara, sehingga kemungkinan alternatif tetap dicatat.
- issue: Makna ungkapan “wajah-Nya”
  choice: mempertahankan ungkapan konkret “wajah-Nya”
  alternative: kehadiran-Nya atau perkenanan-Nya
  rationale: Teks Ibrani secara harfiah menyebut wajah. Makna kehadiran atau perkenanan mungkin tersirat, tetapi tidak dimasukkan langsung ke teks agar citra dan ketegangan teologis sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “benar” sengaja dipertahankan untuk mencerminkan permainan akar kata Ibrani, sedangkan “orang-orang yang tulus” dipilih agar makna moral dan bentuk jamak kata kerja jelas bagi pembaca umum.
