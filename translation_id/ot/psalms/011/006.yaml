base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: id
  text: Ia akan menghujani orang-orang fasik dengan jerat; api, belerang, dan angin panas yang menyengat akan menjadi jatah dalam cawan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַמְטֵר
  choice: akan menghujani
  rationale: Mempertahankan metafora verba Ibrani ‘menurunkan seperti hujan’ serta aspek tindakan yang akan dilakukan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Padanan baku dan bermartabat bagi mereka yang bersalah atau jahat dalam kerangka moral mazmur.
- source_word: פַּחִים
  choice: jerat
  rationale: Bentuk jamak dari פַּח paling lazim menunjuk perangkap atau jerat; ‘jerat’ alami dalam ragam puitis Indonesia dan tidak mempersempit jenis perangkap.
- source_word: אֵשׁ וְגָפְרִית
  choice: api, belerang
  rationale: Menerjemahkan kedua nomina secara langsung dan mempertahankan citra penghukuman.
- source_word: ר֥וּחַ זִלְעָפוֹת
  choice: angin yang membakar
  rationale: רוח berarti angin, sedangkan זלעפות menggambarkan panas yang menyengat atau membakar; frasa ini jelas dan alami.
- source_word: מְנָת כּוֹסָם
  choice: bagian dalam cawan mereka
  rationale: Mempertahankan idiom ‘bagian/porsi cawan’ tanpa mengubah metaforanya menjadi sekadar ‘nasib’.
theological_decisions:
- issue: Pelaku tersirat dalam יַמְטֵר
  choice: Ia
  alternative: TUHAN
  rationale: Ayat sebelumnya menyebut TUHAN sebagai subjek, tetapi ayat ini sendiri memakai verba orang ketiga tunggal tanpa menyebut nama; pronomina mempertahankan kesinambungan sekaligus bentuk sumber.
- issue: Metafora cawan sebagai jatah penghukuman
  choice: bagian dalam cawan mereka
  alternative: nasib yang menjadi bagian mereka
  rationale: Metafora cawan penting dalam bahasa Alkitab dan tidak perlu dijelaskan atau dihilangkan di dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan daftar hukuman dipertahankan, dengan tanda titik koma untuk mencerminkan peralihan dari tindakan menghujani jerat kepada isi bagian dalam cawan mereka.
