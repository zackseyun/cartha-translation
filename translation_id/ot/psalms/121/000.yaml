  text: שִׁ֗יר לַֽ/מַּ֫עֲל֥וֹת אֶשָּׂ֣א עֵ֭ינַ/י אֶל הֶ/הָרִ֑ים מֵ֝/אַ֗יִן יָבֹ֥א עֶזְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/000.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains; from where will my help come?
translation:
  language: id
  text: 'Nyanyian ziarah.[a]


    Aku mengangkat mataku ke gunung-gunung.[b]

    Dari manakah pertolonganku akan datang?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Nyanyian pendakian.” Ungkapan ini mungkin menunjuk pada perjalanan naik para peziarah ke Yerusalem.
    reason: lexical_and_cultural_clarification
  - marker: b
    text: Atau “bukit-bukit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר לַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Ungkapan ini adalah judul kelompok Mazmur 120–134. Terjemahan ini alami dalam bahasa Indonesia dan menyampaikan latar perjalanan naik menuju Yerusalem tanpa menutup arti harfiahnya; arti harfiah dicatat dalam catatan kaki.
- source_word: הֶהָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak dengan kata sandang diterjemahkan secara langsung. 'Bukit-bukit' tetap mungkin secara leksikal dan dicatat sebagai alternatif.
- source_word: מֵאַיִן
  choice: Dari manakah
  rationale: Mempertahankan bentuk pertanyaan sumber dan ketegangan mengenai asal pertolongan, tanpa mengubahnya menjadi pernyataan.
- source_word: יָבֹא עֶזְרִי
  choice: pertolonganku akan datang
  rationale: Mencerminkan verba 'datang' dan nuansa prospektif bentuk Ibrani dalam konteks pertanyaan.
theological_decisions:
- issue: Apakah gunung-gunung dipandang sebagai sumber pertolongan atau sekadar arah pandangan?
  choice: 'Teks dibiarkan sebagai pertanyaan terbuka: ''Dari manakah pertolonganku akan datang?'''
  alternative: Menggabungkannya menjadi pernyataan bahwa pertolongan datang dari gunung-gunung, atau menambahkan penyangkalan bahwa pertolongan tidak datang dari sana.
  rationale: Teks Ibrani sendiri tidak menjawab pertanyaan itu sampai ayat berikutnya; terjemahan tidak boleh mendahului atau meniadakan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Baris judul dipisahkan dari isi mazmur; susunan pertanyaan dipertahankan agar gerak puitis dan ambiguitas sumber tetap terasa.
