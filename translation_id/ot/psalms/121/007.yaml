lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Dalam bahasa Indonesia, bentuk baku dan lazim untuk nama ilahi YHWH dalam terjemahan Alkitab ialah “TUHAN”; kapitalisasi membedakannya dari sebutan umum “Tuhan” dan menghasilkan bahasa yang alami serta bermartabat.
- source_word: יִשְׁמָרְךָ / יִשְׁמֹר
  choice: akan menjaga
  rationale: Kata שׁמר berarti menjaga, melindungi, atau mengawasi. Pengulangan “menjaga” mempertahankan repetisi yang menjadi unsur gaya dan tema utama ayat ini.
- source_word: מִכָּל רָע
  choice: dari segala yang jahat
  rationale: Ungkapan ini mempertahankan keluasan רָע, yang dapat menunjuk pada kejahatan maupun hal buruk atau malapetaka, tanpa membatasinya hanya pada bahaya jasmani.
- source_word: נַפְשֶׁךָ
  choice: hidupmu
  rationale: Dalam konteks ini נֶפֶשׁ dapat berarti nyawa, kehidupan, atau diri seseorang. “Hidupmu” alami dalam bahasa Indonesia dan tidak memaksakan pengertian sempit tentang jiwa sebagai unsur tak berjasad.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: TUHAN
  alternative: Yahweh
  rationale: “TUHAN” merupakan konvensi baku yang mudah dikenali pembaca Alkitab Indonesia dan secara tipografis menandai nama YHWH, tanpa memakai bentuk pelafalan yang masih diperdebatkan.
- issue: Makna נַפְשֶׁךָ
  choice: hidupmu
  alternative: jiwamu
  rationale: Pilihan “hidupmu” mencakup pribadi atau kehidupan orang itu secara utuh dan menghindari penetapan dikotomi tubuh-jiwa yang tidak dituntut oleh kata Ibrani tersebut.
- issue: Cakupan רָע
  choice: segala yang jahat
  alternative: segala malapetaka
  rationale: Teks Ibrani dapat mencakup kejahatan moral maupun keburukan atau bahaya. Terjemahan utama mempertahankan keluasan itu, sedangkan catatan kaki menjelaskan alternatif kontekstualnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme serta pengulangan kata kerja Ibrani dipertahankan. Kata ganti “engkau” dipilih untuk register puitis Alkitabiah, sedangkan “Ia” dikapitalisasi menurut konvensi Indonesia bagi rujukan kepada Allah.
