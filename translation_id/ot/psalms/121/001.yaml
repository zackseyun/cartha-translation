source:
  edition: WLC
  text: שִׁ֗יר לַֽ/מַּ֫עֲל֥וֹת אֶשָּׂ֣א עֵ֭ינַ/י אֶל הֶ/הָרִ֑ים מֵ֝/אַ֗יִן יָבֹ֥א עֶזְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/001.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains— from where will my help come?
translation:
  language: id
  text: Nyanyian Pendakian. Aku mengangkat mataku ke gunung-gunung[a]—dari manakah pertolonganku akan datang?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukit-bukit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Nyanyian
  rationale: Menerjemahkan nomina yang berarti ‘nyanyian’ tanpa memasukkan label jenis sastra yang lebih khusus seperti ‘mazmur’.
- source_word: לַמַּעֲלוֹת
  choice: Pendakian
  rationale: Mempertahankan bentuk judul yang ringkas dan arti dasar jamak dari akar עלה, yakni gerak naik, tanpa memastikan apakah yang dimaksud ialah perjalanan ziarah, anak tangga liturgis, atau kenaikan dalam arti lain.
- source_word: אֶשָּׂא
  choice: Aku mengangkat
  rationale: Bentuk imperfek orang pertama tunggal di sini wajar dipahami sebagai tindakan yang digambarkan secara hidup; bentuk kini dalam bahasa Indonesia terasa alami dalam puisi.
- source_word: עֵינַי
  choice: mataku
  rationale: Padanan langsung bagi nomina dengan sufiks orang pertama tunggal.
- source_word: אֶל
  choice: ke
  rationale: Menjaga arah pandangan dengan ungkapan Indonesia yang alami.
- source_word: הֶהָרִים
  choice: gunung-gunung
  rationale: Padanan utama yang mempertahankan bobot citra הָרִים; kemungkinan ‘bukit-bukit’ dicatat tanpa menetapkan nilai simbolisnya.
- source_word: מֵאַיִן
  choice: dari manakah
  rationale: Ungkapan tanya baku dan alami yang menanyakan asal atau sumber pertolongan.
- source_word: יָבֹא
  choice: akan datang
  rationale: Menyampaikan daya prospektif bentuk imperfek dalam pertanyaan.
- source_word: עֶזְרִי
  choice: pertolonganku
  rationale: Padanan alami dan langsung yang tetap sederhana serta mempertahankan gema teologis kata עֵזֶר.
theological_decisions:
- issue: Apakah bagian kedua diterjemahkan sebagai pernyataan atau pertanyaan retoris
  choice: 'Diterjemahkan sebagai pertanyaan langsung: ‘dari manakah pertolonganku akan datang?’'
  alternative: Diterjemahkan sebagai pernyataan, misalnya ‘dari sanalah pertolonganku datang’.
  rationale: מֵאַיִן bersama יָבֹא paling alami membentuk pertanyaan. Pilihan ini mempertahankan ketegangan puitis yang baru dijawab dalam ayat berikutnya.
- issue: Makna simbolis gunung-gunung
  choice: Dibiarkan netral sebagai ‘gunung-gunung’.
  alternative: Menafsirkannya secara positif sebagai Sion atau secara negatif sebagai tempat bahaya maupun penyembahan palsu.
  rationale: Ayat ini tidak menjelaskan nilai simbolis gunung-gunung; terjemahan tidak boleh memasukkan penafsiran teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. ‘Nyanyian Pendakian’ sengaja mempertahankan keluasan makna judul Ibrani; tanda pisah menjaga hubungan puitis sekaligus ketegangan antara pandangan ke gunung-gunung dan pertanyaan tentang sumber pertolongan.
