base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/002.yaml
  text: My help comes from Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: id
  text: Pertolonganku berasal dari Yahweh[a], Pencipta langit dan bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Pertolonganku dari Yahweh.” Klausa pertama dalam bahasa Ibrani tidak memiliki verba finit yang tersurat; “berasal” ditambahkan agar ungkapannya alami dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: b
    text: Secara bentuk, kata Ibrani yang diterjemahkan “langit” adalah jamak. “Langit dan bumi” merupakan ungkapan yang alami dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶזְרִי
  choice: Pertolonganku
  rationale: Kata benda עֵזֶר berarti “pertolongan” atau “bantuan,” dengan sufiks orang pertama tunggal “-ku.” “Pertolonganku” alami, ringkas, dan sesuai dengan pengakuan pemazmur bahwa ia bergantung kepada Allah.
- source_word: מֵעִם
  choice: berasal dari
  rationale: Preposisi ini menunjukkan sumber dan secara harfiah bernuansa “dari sisi/dekat.” Karena klausa Ibrani tidak memiliki verba finit yang tersurat, “berasal dari” menyampaikan hubungan sumber secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh,” bukan diganti dengan sebuah gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: עֹשֵׂה
  choice: Pencipta
  rationale: Partisip Ibrani menggambarkan Yahweh sebagai Pribadi yang dicirikan oleh tindakan mencipta. “Pencipta” mempertahankan fungsi partisip yang menyerupai gelar dan lebih ringkas daripada “Dia yang menjadikan.”
- source_word: שָׁמַיִם
  choice: langit
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, “langit” merupakan padanan Indonesia yang alami dalam pasangan meristis “langit dan bumi,” yang mencakup seluruh ciptaan.
- source_word: וָאָרֶץ
  choice: dan bumi
  rationale: Dalam ungkapan “langit dan bumi,” אֶרֶץ menunjuk pada bumi atau dunia, bukan suatu negeri tertentu. “Dan bumi” menghasilkan ungkapan Indonesia yang lazim.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi tersebut tanpa menggantinya dengan gelar, sedangkan “Yehova” mencerminkan bentuk pelafalan yang lebih kemudian.
- issue: Daya aspek עֹשֵׂה dalam sebutan tentang penciptaan
  choice: Pencipta langit dan bumi
  alternative: yang menjadikan langit dan bumi; yang membuat langit dan bumi
  rationale: Partisip dapat menyatakan ciri atau identitas, bukan hanya tindakan lampau. “Pencipta” mempertahankan daya sebutan tersebut tanpa memaksa tafsiran waktu tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan khidmat. Susunan kalimat mempertahankan pengakuan pribadi pada awal ayat serta aposisi “Pencipta langit dan bumi.”
