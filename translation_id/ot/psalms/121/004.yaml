  text: Look[a], the keeper of Israel neither slumbers nor sleeps.
translation:
  language: id
  text: Sungguh,[a] Penjaga Israel tidak mengantuk ataupun tidur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lihatlah, Penjaga Israel tidak mengantuk dan tidak tidur.”'
    reason: Alternatif ini menerjemahkan הִנֵּה dengan daya penunjuk yang lebih langsung serta mempertahankan koordinasi dua negasi Ibrani secara lebih dekat.
lexical_decisions:
- source_word: הִנֵּה
  choice: Sungguh
  rationale: Partikel ini menarik perhatian sekaligus menegaskan pernyataan. “Sungguh” terdengar alami dan bermartabat dalam bahasa Indonesia modern tanpa memakai bentuk arkais.
- source_word: לֹא ... וְלֹא
  choice: tidak pernah ... ataupun ...
  rationale: Dua penyangkalan Ibrani disampaikan dengan pasangan idiomatis Indonesia yang menegaskan bahwa kedua keadaan itu sama-sama tidak pernah terjadi.
- source_word: יָנוּם
  choice: terlelap
  rationale: Kata ini menunjuk pada kantuk atau tidur ringan; “terlelap” mempertahankan perbedaannya dari kata biasa untuk tidur pada klausa berikutnya.
- source_word: יִישָׁן
  choice: tertidur
  rationale: Ini kata kerja umum untuk tidur. “Tertidur” alami dalam pasangan puitis dengan “terlelap” dan mempertahankan perkembangan dari kantuk menuju tidur.
- source_word: שֹׁמֵר
  choice: Penjaga
  rationale: Partisipel ini berfungsi sebagai nomina, yaitu dia yang menjaga. “Penjaga” ringkas dan mempertahankan kosakata berulang tentang penjagaan dalam mazmur ini; huruf kapital menandai gelar yang merujuk kepada Allah dalam konteks.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bentuk baku nama diri tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Gambaran antropomorfis tentang kewaspadaan Allah
  choice: Ungkapan puitis bahwa Penjaga Israel tidak pernah terlelap ataupun tertidur dipertahankan apa adanya.
  alternative: Menjelaskannya secara abstrak sebagai pernyataan bahwa Allah selalu waspada, atau memahaminya semata-mata sebagai klaim harfiah mengenai ketidakmampuan Allah untuk tidur.
  rationale: Pasangan puitis ini menyampaikan penjagaan yang tidak pernah terhenti. Terjemahan mempertahankan citra antropomorfis dan tidak mengubahnya menjadi rumusan filosofis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Struktur singkat mengikuti penegasan teks Ibrani, sedangkan “terlelap ... tertidur” menjaga perbedaan antara tidur ringan dan tidur biasa.
