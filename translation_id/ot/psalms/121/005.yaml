  yaml_path: translation/ot/psalms/121/005.yaml
  text: Yahweh is your keeper[a]; Yahweh is your shade at your right hand.
translation:
  language: id
  text: Yahweh adalah penjagamu; Yahweh adalah naunganmu di sebelah kananmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bayang-bayangmu.” Gambaran Ibraninya menunjukkan Yahweh sebagai naungan pelindung yang berada dekat di sisimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankan nama pribadi yang terdapat dalam teks Ibrani.
- source_word: שֹׁמְרֶךָ
  choice: penjagamu
  rationale: Bentuk partisipel שׁמר menggambarkan tindakan menjaga yang terus berlangsung. 'Penjagamu' mempertahankan bentuk nominal sekaligus kaitan leksikal dengan tema penjagaan yang berulang dalam Mazmur 121.
- source_word: צִלְּךָ
  choice: naungan
  rationale: צל secara harfiah berarti bayang-bayang atau tempat teduh. 'Naungan' secara alami menyampaikan gambaran perlindungan dari terik tanpa mengubah metafora menjadi istilah abstrak seperti 'perlindungan'.
- source_word: עַל יַד יְמִינֶךָ
  choice: di sebelah kananmu
  rationale: Ungkapan ini secara harfiah berkaitan dengan tangan kanan, tetapi dalam konteks posisi menyatakan kedekatan di sisi kanan. 'Di sebelah kananmu' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gambaran kedekatan pelindung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Metafora צל sebagai perlindungan ilahi
  choice: naungan
  alternative: bayang-bayang atau perlindungan
  rationale: '''Naungan'' mempertahankan metafora konkret tentang keteduhan yang melindungi, tanpa membatasi maknanya pada penjelasan teologis abstrak.'
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, puitis, dan mudah dipahami. Paralelisme dua klausa dipertahankan. Istilah 'penjagamu' dipilih demi kesinambungan tema mazmur, sedangkan 'naungan' menjaga metafora konkret teks Ibrani.
