  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַל יִתֵּ֣ן לַ/מּ֣וֹט רַגְלֶ֑/ךָ אַל יָ֝נ֗וּם שֹֽׁמְרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/003.yaml
  text: He will not let your foot slip[b][a]; your keeper will not slumber.
translation:
  language: id
  text: Ia tidak akan membiarkan kakimu goyah[a][b]; Penjagamu tidak akan terlelap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kiranya Ia tidak membiarkan kakimu goyah; kiranya Penjagamu tidak terlelap.” Bentuk-bentuk Ibraninya dapat dipahami sebagai harapan atau doa maupun sebagai jaminan.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “goyah” juga dapat berarti “tergelincir”, “terhuyung”, atau “bergeser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: tidak akan
  rationale: Dengan verba imperfek, אַל dapat bernuansa harapan atau doa, tetapi dalam konteks jaminan di mazmur ini, bentuk pernyataan negatif menyampaikan keyakinan dengan alami. Kemungkinan nuansa permohonan tetap dicatat dalam catatan kaki.
- source_word: יִתֵּן
  choice: membiarkan
  rationale: Walaupun נתן secara harfiah berarti ‘memberi’, dalam susunan ini maknanya adalah mengizinkan atau membiarkan sesuatu terjadi.
- source_word: לַמּוֹט
  choice: goyah
  rationale: 'מוֹט menggambarkan hilangnya kestabilan: goyah, tergelincir, terhuyung, atau bergeser. ‘Kakimu goyah’ alami dalam bahasa Indonesia dan mempertahankan metafora ketidakstabilan.'
- source_word: רַגְלֶךָ
  choice: kakimu
  rationale: Bentuk tunggal Ibrani dipertahankan dan ungkapan konkret tentang pijakan tetap terlihat.
- source_word: יָנוּם
  choice: terlelap
  rationale: נוּם menunjuk pada mengantuk atau tertidur ringan, bukan terutama tidur nyenyak. ‘Terlelap’ mempertahankan nada puitis dan kontras dengan ayat berikutnya.
- source_word: שֹׁמְרֶךָ
  choice: Penjagamu
  rationale: Berasal dari שׁמר, ‘menjaga, mengawasi, melindungi’. ‘Penjagamu’ ringkas dan mendukung pengulangan tema penjagaan dalam Mazmur 121.
theological_decisions:
- issue: Daya negatif Ibrani dengan verba imperfek
  choice: 'Jaminan deklaratif: ‘Ia tidak akan ... Penjagamu tidak akan ...’'
  alternative: 'Harapan atau doa: ‘Kiranya Ia tidak membiarkan ... kiranya Penjagamu tidak terlelap.’'
  rationale: Konteks mazmur menekankan keyakinan akan penjagaan TUHAN, sehingga pernyataan jaminan paling sesuai dengan alur wacana. Namun, bentuk Ibraninya juga dapat didengar sebagai harapan atau doa; ketegangan itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. ‘Ia’ serta ‘Penjagamu’ mempertahankan martabat dan keringkasan gaya mazmur; huruf kapital pada ‘Penjagamu’ menunjukkan bahwa sebutan itu merujuk kepada Allah dalam konteks ini.
