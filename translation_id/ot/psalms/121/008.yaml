id: PSA.121.8
reference: Psalms 121:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְֽהוָ֗ה יִשְׁמָר צֵאתְ/ךָ֥ וּ/בוֹאֶ֑/ךָ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/008.yaml
  text: Yahweh will keep your going out and your coming in from now on and forever[a][b].
translation:
  language: id
  text: Yahweh akan menjaga kepergianmu dan kedatanganmu, dari sekarang sampai selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluarmu dan masukmu”. Ungkapan Ibrani ini dapat merujuk secara luas pada seluruh gerak-gerik atau perjalanan hidup seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: יִשְׁמָר
  choice: akan menjaga
  rationale: Kata שׁמר berarti menjaga, melindungi, atau mengawasi; pilihan ini alami dalam bahasa Indonesia dan mempertahankan pengulangan gagasan penjagaan dalam Mazmur 121.
- source_word: צֵאתְךָ וּבוֹאֶךָ
  choice: kepergianmu dan kedatanganmu
  rationale: Mempertahankan pasangan konkret dalam bahasa Ibrani. Sebagai merisme, ungkapan ini dapat mencakup seluruh gerak-gerik atau perjalanan hidup seseorang.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: dari sekarang sampai selama-lamanya
  rationale: Mengungkapkan rentang waktu yang bermula sekarang dan berlanjut tanpa batas, sekaligus mempertahankan unsur עַד, 'sampai'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; bentuk Yahweh mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Cakupan ungkapan 'kepergian dan kedatangan'
  choice: Mempertahankan ungkapan konkret dengan penjelasan di catatan kaki
  alternative: seluruh perjalanan hidupmu
  rationale: Ungkapan Ibrani kemungkinan merupakan merisme yang menunjuk seluruh aktivitas atau perjalanan hidup, tetapi terjemahan utama tidak boleh menghapus citra maupun keluasan makna aslinya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Bentuk tunggal orang kedua dipertahankan melalui akhiran -mu. Tanda catatan kaki ditempatkan sesudah kalimat utama.
