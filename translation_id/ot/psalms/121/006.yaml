source:
  edition: WLC
  text: יוֹמָ֗ם הַ/שֶּׁ֥מֶשׁ לֹֽא יַכֶּ֗/כָּה וְ/יָרֵ֥חַ בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
translation:
  language: id
  text: Pada siang hari matahari tidak akan menghantammu[a][b], demikian juga bulan pada malam hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencelakakanmu.” Kata kerja Ibrani secara harfiah berarti “memukul” atau “menghantam,” tetapi dalam konteks ini dapat menunjuk pada akibat yang mencelakakan.
    reason: lexical_alternative
  - marker: b
    text: Pasangan “pada siang hari … pada malam hari” mengungkapkan perlindungan yang mencakup segala waktu. Matahari dan bulan dapat dipahami secara harfiah, secara kiasan, atau keduanya.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹמָם
  choice: Pada siang hari
  rationale: Ungkapan waktu adverbial yang alami dalam bahasa Indonesia dan membentuk kesejajaran dengan “pada malam hari”.
- source_word: הַשֶּׁמֶשׁ
  choice: matahari
  rationale: Padanan langsung bagi nomina tertentu dalam bahasa Ibrani; konteks bahasa Indonesia tidak memerlukan kata sandang.
- source_word: לֹא יַכֶּכָּה
  choice: tidak akan menghantammu
  rationale: Mempertahankan citra konkret verba נכה, “memukul” atau “menghantam,” sambil memakai bentuk yang wajar untuk gambaran puitis tentang matahari.
- source_word: וְיָרֵחַ
  choice: demikian juga bulan
  rationale: Konjungsi menghubungkan bulan dengan negasi pada klausa sebelumnya. Rumusan ini menyampaikan bahwa bulan pun tidak akan menghantam tanpa mengulang seluruh predikat.
- source_word: בַּלָּיְלָה
  choice: pada malam hari
  rationale: Padanan temporal yang alami dan sejajar dengan “pada siang hari”.
theological_decisions:
- issue: Sifat perlindungan yang dijanjikan
  choice: Mempertahankan gambaran konkret matahari dan bulan tanpa menentukan apakah maknanya harfiah, kiasan, atau keduanya.
  alternative: Menafsirkannya secara khusus sebagai perlindungan dari bahaya alam, sebagai perlindungan menyeluruh setiap saat, atau sebagai singgungan pada ketakutan kuno terhadap pengaruh bulan.
  rationale: Puisi ini memakai pasangan siang dan malam untuk menggambarkan cakupan perlindungan. Terjemahan utama mempertahankan ketegangan penafsiran tersebut, sedangkan catatan menjelaskan kemungkinan cakupannya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. Bentuk pronominal “-mu” menjaga keakraban sapaan orang kedua tunggal, sedangkan “menghantam” mempertahankan citra sumber tanpa memakai diksi arkais.
