  source_fidelity: Draf dengan tepat menangkap seruan kepada Allah untuk bergerak menuju kehancuran yang menetap serta tindakan merusak musuh di tempat kudus. Namun, “Arahkanlah langkah-Mu” melemahkan verba Ibrani הָרִימָה (“angkatlah/naikkanlah”) dan terutama menyatakan arah, bukan gerak maju yang hidup. “Reruntuhan yang berlangsung terus” juga kurang lazim dalam bahasa Indonesia untuk menggambarkan kehancuran yang telah lama bertahan.
  naturalness: “Langkahkanlah kaki-Mu” adalah ungkapan puitis yang lebih alami dalam bahasa Indonesia modern dan tetap menyampaikan gerak antropomorfis yang dimohonkan kepada Allah. “Reruntuhan yang sudah lama itu” secara idiomatis menyatakan reruntuhan yang berkepanjangan tanpa menyatakan bahwa kerusakan itu pasti abadi.
  terminology: “Tempat kudus” tepat untuk בַּקֹּדֶשׁ dan tidak terlalu mempersempit rujukannya. Kapitalisasi pronomina ilahi dipertahankan. Catatan kaki direvisi agar alternatif literal tidak memakai ungkapan “angkat kaki,” yang dalam bahasa Indonesia dapat berasosiasi dengan idiom ‘pergi’.
  issues:
