  yaml_path: translation/ot/psalms/074/003.yaml
  text: Lift up your steps to the perpetual ruins[a]; the enemy has devastated everything in the sanctuary.
translation:
  language: id
  text: Langkahkanlah kaki-Mu ke reruntuhan yang sudah lama itu[a]; musuh telah menghancurkan segala sesuatu di tempat kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Angkatlah langkah-Mu ke kehancuran yang berlangsung lama.” Bahasa Ibrani mempertahankan gambaran hidup tentang Allah yang bergerak menuju tempat kudus yang telah dirusak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִימָה
  choice: Arahkanlah
  rationale: Imperatif רום bersama 'langkah-Mu' merupakan seruan agar Allah bergerak menuju tempat yang hancur. 'Arahkanlah' mempertahankan gambaran gerak dengan bahasa Indonesia yang alami tanpa menambahkan gagasan tentang kecepatan.
- source_word: פְעָמֶיךָ
  choice: langkah-Mu
  rationale: פעם dapat menunjuk pada langkah atau pijakan kaki; 'langkah-Mu' mempertahankan citra antropomorfis yang ditujukan kepada Allah.
- source_word: לְמַשֻּׁאוֹת
  choice: ke reruntuhan
  rationale: Kata ini menunjuk pada kehancuran atau hasil penghancuran. 'Reruntuhan' alami dalam konteks tempat kudus yang telah dirusak.
- source_word: נֶצַח
  choice: yang berlangsung terus
  rationale: Dalam konstruksi ini נצח menggambarkan keadaan reruntuhan yang menetap atau berkepanjangan. Ungkapan ini mempertahankan durasi tanpa mengharuskan arti metafisis 'kekal'.
- source_word: כָּל
  choice: segala sesuatu
  rationale: Penggunaan komprehensif ini menekankan luasnya penghancuran oleh musuh.
- source_word: הֵרַע
  choice: telah menghancurkan
  rationale: Bentuk Hifil dari רעע di sini berarti mencelakakan, merusak, atau menghancurkan; konteks tempat kudus mendukung pilihan yang kuat ini.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Bentuk tunggal dapat mewakili pihak lawan secara kolektif; 'musuh' jelas dan alami.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: קֹדֶשׁ menunjuk pada kawasan suci, kemungkinan besar tempat kudus Bait Allah. 'Tempat kudus' mempertahankan cakupan istilah tanpa mempersempitnya secara berlebihan.
theological_decisions:
- issue: Seruan antropomorfis kepada Allah dalam imperatif pembuka
  choice: Mempertahankan gambaran konkret tentang langkah Allah dengan 'Arahkanlah langkah-Mu'.
  alternative: '''Datanglah'' atau ''Majulah menuju'''
  rationale: Teks Ibrani menggambarkan Allah seakan-akan melangkah menuju tempat kudus yang hancur. Terjemahan tidak menghapus citra puitis itu ataupun menambahkan unsur seperti kecepatan.
- issue: Durasi reruntuhan dalam נֶצַח
  choice: '''yang berlangsung terus'''
  alternative: '''abadi'' atau ''sejak dahulu'''
  rationale: נֶצַח dapat menekankan keadaan yang terus bertahan. Pilihan ini menjaga ratapan atas kehancuran berkepanjangan tanpa menetapkan bahwa reruntuhan itu secara harfiah tidak akan pernah berakhir.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Kapital pada pronomina '-Mu' mengikuti kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Allah. Tanda [a] dicantumkan langsung dalam teks.
