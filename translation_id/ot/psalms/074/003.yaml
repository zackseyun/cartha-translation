    rationale: Pilihan itu menyatakan pengarahaan, sedangkan seruan Ibrani memakai gambaran mengangkat langkah/kaki untuk datang atau maju. “Langkahkanlah kaki-Mu” mempertahankan gerak puitis secara lebih jelas dan alami.
  - severity: medium
    issue: Ungkapan “reruntuhan yang berlangsung terus” tidak idiomatis.
    rationale: Dalam bahasa Indonesia, sesuatu yang “berlangsung terus” biasanya suatu peristiwa atau proses. Untuk reruntuhan yang menetap dalam waktu lama, “reruntuhan yang sudah lama itu” lebih wajar dan tidak menambah klaim bahwa reruntuhan tersebut tidak akan berakhir.
  revised_text: Langkahkanlah kaki-Mu ke reruntuhan yang sudah lama itu[a]; musuh telah menghancurkan segala sesuatu di tempat kudus.
