  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף לָ/מָ֣ה אֱ֭לֹהִים זָנַ֣חְתָּ לָ/נֶ֑צַח יֶעְשַׁ֥ן אַ֝פְּ/ךָ֗ בְּ/צֹ֣אן מַרְעִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/001.yaml
  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: id
  text: 'Maskil[a] Asaf.


    Mengapa, ya Allah, Engkau menolak kami untuk selama-lamanya? Mengapa murka-Mu berasap terhadap kawanan domba di padang rumput-Mu?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maskil” adalah istilah teknis dalam judul mazmur; mungkin menunjuk pada karya untuk direnungkan atau untuk memberi pengajaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Istilah teknis dalam judul mazmur ini tidak pasti makna tepatnya. Transliterasi mempertahankan label jenis sastra tanpa menentukan secara berlebihan apakah mazmur ini terutama bersifat perenungan atau pengajaran.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Bentuk judul ringkas “Maskil Asaf” terdengar wajar dalam bahasa Indonesia dan tidak mempersempit fungsi לְ sebagai penanda kepengarangan, keterkaitan, kepunyaan, atau peruntukan.
- source_word: לָמָה
  choice: Mengapa
  rationale: Kata tanya langsung ini sesuai dengan gaya ratapan dan alami dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Konteks menunjukkan sapaan langsung kepada Allah; partikel “ya” menyampaikan fungsi vokatif secara alami dan khidmat.
- source_word: זָנַחְתָּ
  choice: Engkau menolak kami
  rationale: Verba ini berarti menolak atau membuang. Objek “kami” tidak dinyatakan secara terpisah dalam bentuk Ibrani yang tersedia, tetapi jelas tersirat oleh ratapan komunal dan diperlukan agar kalimat Indonesia lengkap.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Ungkapan ini mempertahankan daya retoris ratapan tentang penolakan yang dirasakan seolah-olah tidak akan berakhir.
- source_word: יֶעְשַׁן
  choice: berasap
  rationale: Pilihan ini mempertahankan gambaran konkret Ibrani tentang murka yang mengeluarkan asap, alih-alih meratakannya menjadi sekadar “berkobar”.
- source_word: אַפְּךָ
  choice: murka-Mu
  rationale: Secara idiomatis kata yang harfiah menunjuk hidung ini menyatakan kemarahan. “Murka” sesuai dengan konteks ilahi dan menjaga ragam bahasa yang khidmat.
- source_word: בְּצֹאן
  choice: terhadap kawanan domba
  rationale: “Kawanan domba” mempertahankan metafora pastoral sekaligus menyatakan umat sebagai satu kawanan; “terhadap” menyampaikan arah permusuhan murka itu.
- source_word: מַרְעִיתֶךָ
  choice: di padang rumput-Mu
  rationale: 'Frasa ini mempertahankan arti tempat penggembalaan dan menghasilkan ungkapan Indonesia yang alami: “kawanan domba di padang rumput-Mu.”'
theological_decisions:
- issue: Objek orang pertama jamak tidak dinyatakan secara eksplisit setelah זָנַחְתָּ dalam teks yang diberikan
  choice: menolak kami
  alternative: menolak [umat-Mu]
  rationale: Konteks ratapan komunal dan metafora kawanan pada klausa berikutnya membuat objek orang pertama jamak tersirat. “Kami” menyampaikan elipsis itu tanpa menambahkan identifikasi teologis yang lebih khusus seperti “umat-Mu”.
- issue: Hubungan Asaf dengan mazmur melalui prefiks לְ
  choice: Maskil Asaf
  alternative: Maskil karya Asaf / Maskil untuk Asaf
  rationale: Prefiks tersebut dapat menandai kepengarangan, keterkaitan, kepunyaan, atau peruntukan. Bentuk judul yang ringkas menjaga ketidakpastian itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Citra Ibrani “murka berasap” dan metafora pastoral dipertahankan. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia.
