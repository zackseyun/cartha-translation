  text: אַתָּ֣ה בָ֭קַעְתָּ מַעְיָ֣ן וָ/נָ֑חַל אַתָּ֥ה ה֝וֹבַ֗שְׁתָּ נַהֲר֥וֹת אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: id
  text: Engkaulah yang membelah mata air dan aliran sungai; Engkaulah yang mengeringkan sungai-sungai yang terus mengalir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: sungai-sungai yang deras.'
    reason: אֵיתָן dapat berarti tetap/permanen atau kuat/deras; alternatif ini menjaga kemungkinan makna leksikal yang lain.
lexical_decisions:
- source_word: בָקַעְתָּ
  choice: membelah
  rationale: Mempertahankan gambaran tindakan kuat berupa membelah atau membuka dengan paksa, sambil tetap alami dalam bahasa Indonesia.
- source_word: מַעְיָן
  choice: mata air
  rationale: Padanan langsung dan lazim untuk sumber air alami.
- source_word: נָחַל
  choice: aliran sungai
  rationale: Kata ini dapat menunjuk aliran air, sungai kecil, atau wadi. 'Aliran sungai' mudah dipahami pembaca Indonesia dan tidak mengharuskan alirannya selalu berair.
- source_word: נַהֲרוֹת אֵיתָן
  choice: sungai-sungai yang terus mengalir
  rationale: Dalam konteks sungai, אֵיתָן dapat menggambarkan aliran yang tetap atau abadi; terjemahan ini mempertahankan kontras dengan tindakan Allah yang mengeringkannya.
theological_decisions:
- issue: Acuan tindakan membelah dan mengeringkan air
  choice: Tidak mengidentifikasi peristiwa sejarah tertentu di dalam teks utama
  alternative: Menjelaskannya secara khusus sebagai penyeberangan Laut Teberau atau Sungai Yordan
  rationale: Ayat ini memakai bahasa puitis yang dapat membangkitkan beberapa tindakan Allah atas air; teks Ibrani sendiri tidak menyebut satu peristiwa secara eksplisit.
- issue: Makna אֵיתָן
  choice: yang terus mengalir
  alternative: yang deras atau yang kuat
  rationale: Kata tersebut memiliki rentang makna 'tetap, tahan lama, kuat'. Dalam konstruksi dengan sungai, kesinambungan aliran paling sesuai dengan kontras 'mengeringkan', tetapi ambiguitasnya dicatat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan 'Engkaulah' mempertahankan penekanan אַתָּה pada kedua klausa. Istilah teknis 'wadi' dihindari dalam teks utama demi keterbacaan umum.
