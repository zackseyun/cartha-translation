  yaml_path: translation/ot/psalms/074/019.yaml
  text: Do not give your dove to the ravenous beast; do not forget the lives of your afflicted ones forever.
translation:
  language: id
  text: Jangan serahkan nyawa merpati-Mu kepada binatang buas yang rakus; jangan lupakan nyawa orang-orang-Mu yang tertindas untuk selama-lamanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחַיַּת
  choice: kepada binatang buas yang rakus
  rationale: Secara harfiah berarti 'kepada binatang'; dalam konteks ancaman musuh, ungkapan ini menunjuk pada pemangsa yang ganas. 'Yang rakus' mempertahankan citra serangan tanpa menjadikan 'jiwa' sebagai objek binatang.
- source_word: נֶפֶשׁ תּוֹרֶךָ
  choice: merpati-Mu
  rationale: Susunan Ibrani secara harfiah dapat dibaca 'nyawa merpati-Mu', tetapi נֶפֶשׁ di sini idiomatis dan merpati melambangkan umat yang rapuh; bahasa Indonesia alami cukup memakai 'merpati-Mu'.
- source_word: חַיַּת עֲנִיֶּיךָ
  choice: nyawa orang-orang-Mu yang tertindas
  rationale: חַיַּת berkaitan dengan kehidupan/nyawa, sedangkan bentuk jamak עֲנִיֶּיךָ menunjuk kepada orang-orang milik Allah yang menderita atau tertindas. Bentuk 'nyawa' mempertahankan kesejajaran dengan klausa pertama.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Mengungkapkan durasi tanpa akhir dan mempertahankan nada permohonan mazmur.
theological_decisions:
- issue: Identitas 'merpati'
  choice: Mempertahankan metafora 'merpati-Mu' tanpa menjelaskannya di dalam ayat.
  alternative: Mengganti dengan 'umat-Mu'.
  rationale: Teks Ibrani memakai metafora yang sengaja menggambarkan kerentanan umat; penggantian dengan 'umat' akan menghilangkan citra puitis.
- issue: Makna חַיַּת pada klausa kedua
  choice: Menerjemahkannya sebagai 'nyawa' dalam bentuk kolektif yang mengacu pada banyak orang tertindas.
  alternative: Menerjemahkannya sebagai 'kehidupan' atau membaca kata itu sebagai 'kawanan'.
  rationale: Pilihan ini sesuai dengan paralelisme permohonan agar Allah tidak menyerahkan atau melupakan hidup umat-Nya, sambil mempertahankan bentuk jamak pada orang-orang yang tertindas.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Paralelisme dua larangan dipertahankan; metafora merpati dan binatang pemangsa tidak dinetralkan.
