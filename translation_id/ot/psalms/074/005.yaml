translation:
  language: id
  text: Ia dikenal seperti orang yang mengangkat kapak-kapak ke atas di dalam rimbunan pepohonan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia menjadi dikenal seperti orang yang membawa kapak-kapak ke atas di dalam rimbunan kayu.” Bahasa Ibrani ayat ini padat dan hubungan tepat antara pengangkatan kapak dengan rimbunan itu tidak sepenuhnya jelas.'
    reason: textual_difficulty
lexical_decisions:
- source_word: יִוָּדַע
  choice: Ia dikenal
  rationale: Bentuk Nifal imperfek orang ketiga maskulin tunggal dari ידע dipahami sebagai gambaran lampau dalam narasi puitis. Pronomina tunggal dipertahankan tanpa menentukan lebih jauh siapa rujukannya.
- source_word: כְּמֵבִיא
  choice: seperti orang yang mengayunkan
  rationale: כְּ menandai perbandingan, sedangkan partisipel Hifil dari בוא secara harfiah berkaitan dengan membawa atau menaikkan. Dalam gambaran penggunaan kapak, 'mengayunkan' menyampaikan gerakan ke atas secara alami tanpa mengubah citra dasarnya.
- source_word: לְמָעְלָה
  choice: tinggi-tinggi
  rationale: Ungkapan adverbial ini menunjukkan arah ke atas. 'Tinggi-tinggi' wajar dalam bahasa Indonesia untuk gerakan mengangkat atau mengayunkan kapak.
- source_word: בִּסֲבָךְ
  choice: di tengah belukar
  rationale: סבך menunjuk pada belukar atau pertumbuhan pepohonan yang rapat. Preposisi ב paling alami menyatakan tempat tindakan berlangsung, meskipun secara formal dapat pula dipahami sebagai arah gerakan.
- source_word: עֵץ
  choice: pepohonan
  rationale: Dalam gabungan dengan 'belukar', עץ lebih mungkin menunjuk pada pohon-pohon daripada bahan kayu. 'Belukar pepohonan' mempertahankan gambaran vegetasi yang rapat.
- source_word: קַרְדֻּמּוֹת
  choice: kapak
  rationale: Bentuk jamak ini menunjuk pada alat-alat penebang. Dalam bahasa Indonesia, 'kapak' dapat dipakai secara generik setelah verba tanpa harus diberi penanda jamak.
