  yaml_path: translation/ot/psalms/074/000.yaml
  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: id
  text: 'Nyanyian pengajaran[a] Asaf.


    Mengapa, ya Allah, Engkau menolak kami untuk selama-lamanya? Mengapa murka-Mu menyala terhadap kawanan domba di padang gembalaan-Mu?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini adalah istilah teknis dalam judul mazmur; mungkin menunjuk pada nyanyian yang bersifat merenungkan atau mengajar.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Nyanyian pengajaran
  rationale: Istilah teknis pada judul mazmur ini kemungkinan menunjuk pada karya yang memberi pengajaran atau perenungan. Terjemahan maknawi dipakai sambil mempertahankan ketidakpastiannya dalam catatan kaki.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Kata depan לְ dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan; bentuk Indonesia yang ringkas mempertahankan keterkaitan dengan Asaf tanpa mempersempitnya menjadi 'karya Asaf'.
- source_word: זָנַחְתָּ
  choice: Engkau menolak kami
  rationale: Kata kerja ini menyatakan penolakan atau penelantaran. Objek orang pertama jamak tersirat dari konteks kelanjutan mazmur dan dinyatakan dalam bahasa Indonesia agar kalimat alami.
- source_word: יֶעְשַׁן אַפְּךָ
  choice: murka-Mu berkobar seperti asap
  rationale: Secara harfiah, 'hidung/murka-Mu berasap'. Pilihan ini mempertahankan citra asap sekaligus menyampaikan idiom kemurkaan secara wajar.
- source_word: צֹאן מַרְעִיתֶךָ
  choice: kawanan domba gembalaan-Mu
  rationale: Mempertahankan metafora umat sebagai kawanan domba yang digembalakan Allah.
theological_decisions:
- issue: Pertanyaan tentang penolakan 'untuk selama-lamanya'
  choice: Mempertahankan bahasa ratapan sebagaimana diucapkan pemazmur, tanpa menjadikannya pernyataan doktrinal bahwa penolakan Allah benar-benar kekal.
  alternative: Menghaluskan menjadi 'begitu lama' atau 'seakan-akan untuk selamanya'.
  rationale: לָנֶצַח secara langsung berarti 'untuk selama-lamanya'; ketegangan retoris dan teologis ratapan perlu dipertahankan.
- issue: Hubungan Asaf dengan mazmur
  choice: Judul 'Asaf' dibiarkan tanpa menambahkan 'karya' atau 'untuk'.
  alternative: '''Mazmur pengajaran karya Asaf'' atau ''untuk Asaf''.'
  rationale: לְאָסָף memiliki cakupan relasi yang lebih luas daripada kepengarangan saja, sehingga terjemahan tidak seharusnya menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Sapaan 'ya Allah' dan kapitalisasi pronomina ilahi mengikuti register sastra keagamaan Indonesia. Citra gembalaan dan asap dipertahankan, sementara ungkapan Ibrani dibuat alami tanpa menghapus daya puitisnya.
