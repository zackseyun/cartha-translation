  source_fidelity: 'Terjemahan pada dasarnya mengikuti Ibrani dengan baik: pertanyaan ratapan, penolakan “untuk selama-lamanya”, dan metafora murka yang berasap dipertahankan. Namun, צֹאן מַרְעִיתֶךָ secara lebih tepat berarti kawanan domba yang berada di padang gembalaan-Mu, bukan “kawanan domba gembalaan-Mu,” yang dalam bahasa Indonesia terdengar rancu.'
  naturalness: Registernya khidmat dan modern. “Murka-Mu berkobar seperti asap” dapat dipahami, tetapi memadukan citra api “berkobar” dengan asap secara kurang langsung. “Murka-Mu menyala terhadap” adalah ungkapan Indonesia yang lebih alami dan tetap menyampaikan idiom Ibrani tentang murka yang berasap/menyala.
  terminology: “Nyanyian pengajaran” dengan catatan kaki cukup aman untuk מַשְׂכִּיל, karena catatan tersebut mempertahankan ketidakpastian istilah teknis. “Asaf” tanpa penambahan relasi kepengarangan juga tepat. Kapitalisasi pronomina ilahi sesuai register yang dipilih.
  issues:
