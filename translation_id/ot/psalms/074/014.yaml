base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: id
  text: Engkaulah yang meremukkan kepala-kepala Lewiatan; Engkau memberikannya sebagai makanan kepada makhluk-makhluk padang gurun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada para penghuni padang gurun.” Istilah Ibraninya sulit dan dapat menunjuk kepada manusia ataupun binatang liar yang hidup di daerah tandus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Pronomina yang dinyatakan secara tegas memberi penekanan; bentuk “Engkaulah” menyampaikan penegasan itu secara alami dalam bahasa Indonesia.
- source_word: רִצַּצְתָּ
  choice: meremukkan
  rationale: Kata kerja ini menyatakan tindakan memecahkan atau menghancurkan dengan keras; “meremukkan” mempertahankan daya ungkap puitisnya.
- source_word: רָאשֵׁי
  choice: kepala-kepala
  rationale: Nomina Ibrani berbentuk jamak konstruksi. Bentuk jamak dipertahankan agar gambaran puitis dalam teks tidak disederhanakan.
- source_word: לִוְיָתָן
  choice: Lewiatan
  rationale: Nama puitis ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, sehingga kaitannya dengan kemunculan lain dalam Alkitab tetap terpelihara.
- source_word: תִּתְּנֶנּוּ
  choice: Engkau memberikan dia
  rationale: Kata kerja נתן pada dasarnya berarti “memberikan”, dan sufiks maskulin tunggal merujuk kembali kepada Lewiatan. “Dia” mempertahankan personifikasi dalam gambaran puitis tersebut.
- source_word: מַאֲכָל
  choice: sebagai makanan
  rationale: Padanan ini menyampaikan fungsi predikatif kata tersebut secara alami sesudah “memberikan dia”.
- source_word: לְעָם לְצִיִּים
  choice: kepada makhluk-makhluk padang gurun
  rationale: Ungkapan Ibrani ini sulit dan dapat menunjuk kepada penghuni wilayah tandus, termasuk binatang liar. “Makhluk-makhluk padang gurun” sesuai dengan konteks pemberian sebagai makanan, sedangkan kemungkinan bahwa yang dimaksud ialah manusia penghuni gurun dicatat dalam catatan kaki.
theological_decisions:
- issue: Hakikat gambaran Lewiatan
  choice: Mempertahankan Lewiatan sebagai gambaran puitis-kosmis tanpa menentukan identitasnya lebih lanjut.
  alternative: Menafsirkannya secara khusus sebagai monster laut harfiah, Mesir, atau kuasa kekacauan.
  rationale: Teks menyatakan kemenangan Allah melalui gambaran puitis, tetapi tidak menjelaskan secara eksplisit apakah Lewiatan adalah makhluk harfiah, lambang historis, atau personifikasi kuasa kekacauan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan “Engkau” mempertahankan kesejajaran antarklausa, sedangkan “Engkaulah” menyampaikan penekanan pronomina pada awal ayat.
