  text: אַל יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם עָנִ֥י וְ֝/אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: id
  text: Jangan biarkan orang tertindas[a] kembali dalam keadaan dipermalukan[b]; biarlah orang miskin dan orang yang membutuhkan memuji nama-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang yang remuk” atau “orang yang terinjak-injak.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dengan malu.” Kata Ibraninya dapat mencakup penghinaan di depan umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Jangan biarkan
  rationale: Partikel negatif bersama bentuk imperfek menyatakan permohonan. Ungkapan ini menyampaikan larangan dalam doa secara alami dalam bahasa Indonesia.
- source_word: יָשֹׁב
  choice: kembali
  rationale: Kata kerja שׁוב berarti kembali atau berbalik. Pilihan ini mempertahankan keluasan maknanya tanpa menentukan secara khusus dari mana atau ke mana orang itu kembali.
- source_word: דַּךְ
  choice: orang tertindas
  rationale: Kata ini menunjuk kepada orang yang remuk, tertindas, atau terinjak. 'Orang tertindas' alami dalam bahasa Indonesia dan mempertahankan dimensi penderitaan serta tekanan sosial.
- source_word: נִכְלָם
  choice: dengan dipermalukan
  rationale: Bentuk pasif ini dapat berarti dibuat malu, dihina, atau dipermalukan. Pilihan ini menangkap kemungkinan adanya penghinaan terbuka, bukan hanya perasaan malu batiniah.
- source_word: עָנִי
  choice: orang miskin
  rationale: Dalam pasangan dengan אֶבְיוֹן, makna kemiskinan tampak menonjol, walaupun kata ini juga dapat berarti menderita atau direndahkan.
- source_word: אֶבְיוֹן
  choice: orang yang berkekurangan
  rationale: Kata ini menunjuk kepada orang yang membutuhkan atau sangat miskin. Pilihan ini membedakannya dari עָנִי sekaligus menghasilkan pasangan yang wajar dalam bahasa Indonesia.
- source_word: יְהַלְלוּ
  choice: biarlah ... memuji
  rationale: Bentuk imperfek bermakna volitif dalam konteks doa. 'Biarlah' mempertahankan daya permohonan dan kesejajarannya dengan klausa pertama.
- source_word: שְׁמֶךָ
  choice: nama-Mu
  rationale: Ungkapan Ibrani ini mengacu pada nama Allah, yang berkaitan dengan karakter dan reputasi-Nya. Bentuk harfiah tetap jelas dan penting secara teologis dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan klausa terakhir dengan permohonan sebelumnya
  choice: Diterjemahkan sebagai permohonan sejajar agar orang miskin dan berkekurangan memuji nama Allah.
  alternative: 'Klausa terakhir dapat dipahami lebih khusus sebagai hasil dari pertolongan Allah: setelah tidak pulang dengan malu, mereka akan memuji nama-Nya.'
  rationale: Urutan bentuk volitif Ibrani mendukung dua permohonan yang berkaitan, tetapi tidak menyatakan hubungan sebab-akibat secara eksplisit. Terjemahan mempertahankan hubungan itu tanpa mempertegas kausalitas yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur permohonan dipertahankan dengan 'Jangan biarkan' dan 'biarlah'. Kapitalisasi pronomina pada 'nama-Mu' mengikuti register Alkitab Indonesia yang lazim.
