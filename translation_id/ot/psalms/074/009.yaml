  text: אֽוֹתֹתֵ֗י/נוּ לֹ֥א רָ֫אִ֥ינוּ אֵֽין ע֥וֹד נָבִ֑יא וְ/לֹֽא אִ֝תָּ֗/נוּ יֹדֵ֥עַ עַד מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/009.yaml
  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: id
  text: Kami tidak melihat tanda-tanda kami[a]; tidak ada lagi nabi, dan tidak seorang pun di antara kami tahu sampai kapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “panji-panji kami” atau “lambang-lambang kami”; istilah Ibrani ini dapat menunjuk pada tanda atau lambang yang terlihat, tetapi acuan tepatnya tidak dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: tanda-tanda kami
  rationale: אוֹת secara umum berarti tanda, petunjuk, atau lambang. Pilihan ini mempertahankan keluasan makna dan tidak menentukan apakah yang dimaksud ialah tanda ilahi, lambang peribadatan, atau panji.
- source_word: לֹא רָאִינוּ
  choice: kami tidak melihat
  rationale: 'Bentuk perfektif dalam konteks ratapan ini menyatakan keadaan yang sedang dialami: tanda-tanda itu tidak tampak bagi umat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kelangsungan keluhan.'
- source_word: אֵין עוֹד
  choice: tidak ada lagi
  rationale: Ungkapan ini menyatakan bahwa sesuatu yang dahulu ada kini tidak ada atau tidak tersedia lagi.
- source_word: נָבִיא
  choice: nabi
  rationale: 'Padanan baku bagi נָבִיא. Bentuk tunggalnya bersifat generik: sama sekali tidak ada nabi.'
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: dan tidak seorang pun di antara kami tahu
  rationale: Susunan Ibrani yang eliptis ini secara idiomatis menunjuk pada ketiadaan siapa pun dalam komunitas yang memiliki pengetahuan tersebut.
- source_word: עַד מָה
  choice: sampai kapan
  rationale: Dalam ratapan, עַד מָה merupakan ungkapan idiomatis tentang lamanya keadaan yang menyusahkan dan paling alami diterjemahkan 'sampai kapan'.
theological_decisions:
- issue: Acuan 'tanda-tanda kami'
  choice: Ungkapan dipertahankan secara luas sebagai 'tanda-tanda kami'.
  alternative: panji-panji kami; lambang-lambang kami; tanda-tanda kehadiran Allah di antara kami
  rationale: Teks Ibrani tidak menjelaskan tanda apa yang dimaksud. Terjemahan yang luas mempertahankan ambiguitas itu dan tidak memasukkan rekonstruksi historis atau penafsiran teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tiga keluhan dipertahankan dengan tanda titik koma dan koma agar alur puisi tetap jelas. Penanda catatan kaki ditempatkan langsung setelah ungkapan yang diterangkannya.
