  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: id
  text: Perhatikanlah perjanjian itu[a], sebab tempat-tempat gelap di negeri[b] penuh dengan sarang-sarang kekerasan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perjanjian-Mu.” Teks Ibrani berbunyi “perjanjian itu,” tetapi konteksnya menunjuk kepada perjanjian Allah dengan umat-Nya.
    reason: alternative_reading
  - marker: b
    text: Atau “tempat-tempat gelap di bumi.” Kata Ibrani yang sama dapat berarti “negeri” atau “bumi,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: c
    text: Atau “kediaman-kediaman kekerasan” atau “tempat-tempat tinggal kekerasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: Perhatikanlah
  rationale: Imperatif ini memohon agar Allah mengarahkan perhatian-Nya kepada perjanjian. “Perhatikanlah” alami dalam bahasa Indonesia dan mempertahankan nada permohonan.
- source_word: לַבְּרִית
  choice: perjanjian itu
  rationale: Nomina Ibrani memakai kata sandang tertentu tanpa akhiran posesif. “Perjanjian itu” mempertahankan ketertentuan tersebut tanpa menambahkan “perjanjian-Mu” ke dalam teks utama.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi permohonan sebelumnya; “sebab” menyatakan hubungan kausal dengan jelas.
- source_word: מָלְאוּ
  choice: penuh dengan
  rationale: Bentuk perfektum menggambarkan keadaan yang telah terjadi dan kini berlaku. Ungkapan statif “penuh dengan” merupakan padanan Indonesia yang wajar.
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: tempat-tempat gelap di negeri ini
  rationale: Frasa konstruksi ini secara harfiah menunjuk pada tempat-tempat gelap dari negeri/bumi. Dalam konteks ratapan mengenai kehancuran Zion dan negeri umat, “negeri ini” menyampaikan acuan setempat secara alami, sementara catatan kaki mempertahankan kemungkinan “bumi”.
- source_word: נְאוֹת
  choice: tempat tinggal
  rationale: Kata ini dapat berarti tempat tinggal, kediaman, atau padang rumput. Bersama “kekerasan,” makna lokatif “tempat tinggal” dipertahankan tanpa menentukan secara berlebihan apakah yang dimaksud sarang para pelaku atau wilayah yang dicirikan oleh kekerasan.
- source_word: חָמָס
  choice: kekerasan
  rationale: Istilah ini lazim menunjuk pada kekerasan atau ketidakadilan yang kejam. “Kekerasan” adalah padanan langsung dan sesuai konteks.
theological_decisions:
- issue: Apakah perjanjian perlu dibuat secara eksplisit posesif
  choice: perjanjian itu
  alternative: perjanjian-Mu
  rationale: Teks Ibrani memakai kata sandang tertentu, bukan akhiran posesif. Konteks memang menunjuk kepada perjanjian Allah dengan umat-Nya, tetapi teks utama tidak menambahkan kepunyaan yang tidak dinyatakan secara eksplisit.
- issue: Cakupan אֶרֶץ
  choice: negeri ini
  alternative: bumi
  rationale: Konteks Mazmur 74 berpusat pada kehancuran tempat kudus dan negeri umat, sehingga pengertian lokal lebih mungkin. Namun, karena אֶרֶץ juga dapat berarti “bumi,” alternatif itu dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Imperatif dengan partikel -lah menjaga nada doa. Susunan kalimat dibuat jelas bagi pembaca umum sambil mempertahankan metafora ruang gelap dan tempat tinggal kekerasan serta ambiguitas perjanjian dan cakupan negeri/bumi.
