  text: אָמְר֣וּ בְ֭/לִבָּ/ם נִינָ֣/ם יָ֑חַד שָׂרְפ֖וּ כָל מוֹעֲדֵי אֵ֣ל בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: id
  text: Mereka berkata dalam hati, “Mari kita binasakan mereka semua sekaligus.”[a] Mereka membakar semua tempat pertemuan Allah di negeri itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “mari kita binasakan mereka” sulit dipastikan maknanya. Mungkin juga berarti “mari kita tindas mereka” atau “mari kita taklukkan mereka,” atau merupakan ungkapan lain tentang niat menghancurkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “semua tempat yang ditetapkan Allah.” Kata Ibraninya dapat menunjuk pada waktu atau tempat yang ditetapkan untuk pertemuan; secara tradisional ada yang menerjemahkannya “semua sinagoge Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ
  choice: berkata
  rationale: Bentuk Qal perfek orang ketiga jamak dari אמר menyampaikan tindakan musuh dalam alur puitis; bentuk lampau dipahami dari konteks tanpa perlu penanda waktu tambahan dalam bahasa Indonesia.
- source_word: בְלִבָּם
  choice: Dalam hati mereka
  rationale: Mempertahankan ungkapan Ibrani tentang perkataan batin atau niat tersembunyi, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: נִינָם
  choice: Mari kita binasakan mereka
  rationale: Bentuk Ibrani ini sangat sulit dan maknanya tidak pasti. Dalam konteks, bentuk tersebut paling mungkin mengungkapkan niat bermusuhan untuk menindas, menaklukkan, atau membinasakan; ketidakpastian ini dinyatakan dalam catatan kaki.
- source_word: יַחַד
  choice: semua sekaligus
  rationale: Mengungkapkan makna kebersamaan atau keseluruhan dari adverbia ini serta cakupan menyeluruh dari ancaman tersebut.
- source_word: שָׂרְפוּ
  choice: Mereka membakar
  rationale: Padanan langsung dan alami bagi Qal perfek orang ketiga jamak dari שרף.
- source_word: כָּל מוֹעֲדֵי אֵל
  choice: semua tempat pertemuan Allah
  rationale: Karena hal-hal ini dibakar dan berada di negeri itu, מוֹעֲדֵי paling mungkin merujuk pada tempat-tempat berkumpul yang dikhususkan bagi Allah. Pilihan ini tidak memasukkan istilah 'sinagoge' yang mungkin anakronistis.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Dalam konteks mazmur, frasa ini paling wajar menunjuk pada negeri yang sedang dibicarakan, bukan seluruh bumi.
theological_decisions:
- issue: Makna bentuk sulit נִינָם
  choice: 'Ungkapan niat menghancurkan: “Mari kita binasakan mereka”'
  alternative: “Mari kita tindas mereka”; “Mari kita taklukkan mereka”; atau analisis nominal dengan susunan kalimat berbeda
  rationale: Konteks menggambarkan tekad musuh untuk melakukan penghancuran menyeluruh, tetapi bentuk Ibraninya tidak pasti. Teks utama menyampaikan arah makna yang paling mungkin, sedangkan catatan kaki mempertahankan ambiguitas leksikal.
- issue: Makna מוֹעֲדֵי אֵל dalam konteks pembakaran
  choice: tempat-tempat pertemuan yang dikhususkan bagi Allah
  alternative: waktu atau hari raya yang ditetapkan Allah; perkumpulan Allah; sinagoge-sinagoge Allah
  rationale: Objek tersebut dapat dibakar dan disebut berada di negeri itu, sehingga arti tempat lebih sesuai. Terjemahan tidak mengunci teks pada lembaga sinagoge ataupun menghapus kemungkinan dasar bahwa מוֹעֵד dapat berarti sesuatu yang ditetapkan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “Dalam hati mereka berkata” mempertahankan citraan Ibrani. “Tempat pertemuan Allah” dipilih karena alami dan tidak anakronistis; kedua ketidakpastian utama dijelaskan melalui penanda catatan kaki yang hadir dalam teks.
