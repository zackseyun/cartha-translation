source:
  edition: WLC
  text: קוּמָ֣/ה אֱ֭לֹהִים רִיבָ֣/ה רִיבֶ֑/ךָ זְכֹ֥ר חֶרְפָּתְ/ךָ֥ מִנִּי נָ֝בָ֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: id
  text: Bangkitlah, ya Allah; belalah perkara-Mu.[a] Ingatlah penghinaan terhadap-Mu dari orang bebal[b] sepanjang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani memakai bahasa perselisihan hukum; dapat juga diterjemahkan “perjuangkanlah perkara-Mu.”
    reason: lexical_alternative
  - marker: b
    text: “Orang bebal” di sini berarti orang yang rusak secara moral atau tidak mengenal Allah, bukan sekadar orang yang kurang cerdas.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Bangkitlah
  rationale: Bentuk imperatif dari קום dengan ה paragogis menyampaikan seruan mendesak agar Allah bertindak. “Bangkitlah” wajar dalam bahasa Indonesia dan mempertahankan gambaran sumber.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Berfungsi sebagai sapaan langsung. Partikel “ya” menandai vokatif secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: רִיבָה רִיבֶךָ
  choice: belalah perkara-Mu
  rationale: Kata kerja dan nomina serumpun ini memakai bahasa perselisihan atau pengadilan. “Belalah perkara-Mu” mempertahankan metafora hukum tanpa menghasilkan pengulangan yang janggal dalam bahasa Indonesia.
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Imperatif ini meminta Allah memperhatikan dan kemudian bertindak, tetapi terjemahan tetap mempertahankan ungkapan sumber tanpa memperluasnya.
- source_word: חֶרְפָּתְךָ
  choice: penghinaan terhadap-Mu
  rationale: חֶרְפָּה dapat berarti celaan, cercaan, atau penghinaan. Dalam konteks ini sufiksnya paling alami dipahami sebagai penghinaan yang diarahkan kepada Allah.
- source_word: מִנִּי נָבָל
  choice: dari orang bebal
  rationale: מִנִּי menandai sumber penghinaan, sedangkan נָבָל menunjuk orang yang rusak secara moral atau tidak mengenal Allah, bukan sekadar orang yang kurang cerdas.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan temporal ini berarti berlangsung sepanjang hari atau terus-menerus. “Sepanjang hari” alami dan dekat dengan bentuk Ibrani.
theological_decisions:
- issue: Acuan “penghinaan terhadap-Mu”
  choice: Penghinaan yang diarahkan kepada Allah
  alternative: Penghinaan yang ditanggung umat Allah karena mereka adalah milik-Nya
  rationale: Sufiks pada חֶרְפָּתְךָ paling langsung menunjuk kepada penghinaan terhadap Allah dan sesuai dengan seruan agar Dia membela perkara-Nya. Namun, konteks mazmur juga menghubungkan penghinaan terhadap tempat kudus dan umat dengan Allah; terjemahan tidak menambahkan penjelasan doktrinal yang menutup hubungan perjanjian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang mendesak dan bermartabat. Metafora hukum dipertahankan, sedangkan susunan Ibrani disesuaikan secukupnya agar alami dan mudah dipahami.
