base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/007.yaml
  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
translation:
  language: id
  text: Mereka membakar tempat kudus-Mu[a]; mereka menajiskan tempat kediaman nama-Mu hingga ke tanah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mereka mengirimkan api ke tempat kudus-Mu.” Ungkapan Ibrani ini berarti bahwa mereka membakarnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau, dengan susunan yang lebih dekat pada bahasa Ibrani: “mereka menajiskan ke tanah tempat kediaman nama-Mu.” Frasa “tempat kediaman nama-Mu” menunjuk pada tempat yang dipilih Allah agar nama dan kehadiran-Nya dikenal.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: membakar
  rationale: Secara harfiah ungkapan ini berarti 'mengirimkan dengan/ke dalam api', tetapi dalam konteks ini merupakan ungkapan untuk membakar. 'Membakar' menyampaikan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: מִקְדָּשֶׁךָ
  choice: tempat kudus-Mu
  rationale: מִקְדָּשׁ berarti tempat yang kudus atau tempat suci. 'Tempat kudus' mempertahankan cakupan katanya tanpa langsung mempersempitnya menjadi 'Bait Allah'.
- source_word: לָאָרֶץ
  choice: sampai rata dengan tanah
  rationale: Dalam konteks penghancuran tempat ibadah, frasa ini menunjukkan penajisan yang berujung pada peruntuhan hingga ke tanah. Ungkapan Indonesia ini alami dan tetap mencerminkan gambaran Ibrani.
- source_word: חִלְּלוּ
  choice: menajiskan
  rationale: Bentuk piel dari חלל berarti memperlakukan sesuatu yang kudus sebagai tidak kudus, yakni menajiskan atau mencemarkan. 'Menajiskan' mempertahankan pertentangan antara kudus dan profan.
- source_word: מִשְׁכַּן
  choice: tempat kediaman
  rationale: Kata ini pada dasarnya berarti tempat tinggal atau kediaman. Pilihan ini mempertahankan citra kediaman dan tidak mengimpor istilah teknis 'Kemah Suci' ke dalam konteks penghancuran Bait Allah.
- source_word: שְׁמֶךָ
  choice: nama-Mu
  rationale: Frasa konstruksi Ibrani secara harfiah berbunyi 'tempat kediaman nama-Mu'. Mempertahankan 'nama-Mu' melestarikan ungkapan teologis tentang kehadiran Allah tanpa menyamakan Allah dengan bangunan itu.
theological_decisions:
- issue: Pembedaan מִקְדָּשׁ dan מִשְׁכַּן
  choice: tempat kudus dan tempat kediaman
  alternative: Bait Allah dan tempat suci
  rationale: Teks Ibrani memakai dua istilah berbeda tetapi berhubungan. Dua padanan yang berbeda mempertahankan paralelisme dan nuansa bahwa tempat itu kudus sekaligus merupakan kediaman nama Allah.
- issue: Ungkapan teologis 'tempat kediaman nama-Mu'
  choice: mempertahankan bentuk ungkapan Ibrani
  alternative: tempat kehadiran-Mu
  rationale: Ungkapan 'nama-Mu' menyatakan kehadiran Allah sambil menjaga ketegangan bahwa Allah sendiri tidak dibatasi oleh bangunan. Terjemahan tidak meratakan nuansa ini menjadi sekadar 'kediaman-Mu'.
- issue: Hubungan לָאָרֶץ dengan tindakan penajisan
  choice: dipahami sebagai kehancuran sampai rata dengan tanah
  alternative: menajiskannya ke tanah
  rationale: Susunan Ibrani dapat terdengar seolah-olah frasa itu menerangkan 'menajiskan', tetapi konteks pembakaran dan penghancuran mendukung hasil kehancuran sampai ke tanah. Catatan kaki mempertahankan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Diksi 'tempat kudus' dan 'tempat kediaman nama-Mu' mempertahankan perbedaan istilah serta citra teologis teks Ibrani; 'sampai rata dengan tanah' dipakai agar akibat penghancurannya jelas dan alami.
