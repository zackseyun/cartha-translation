  text: וֵ֭/אלֹהִים מַלְכִּ֣/י מִ/קֶּ֑דֶם פֹּעֵ֥ל יְ֝שׁוּע֗וֹת בְּ/קֶ֣רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/012.yaml
  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: id
  text: Namun Allah adalah Rajaku sejak dahulu kala, yang mengerjakan karya-karya keselamatan di tengah-tengah bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tengah-tengah negeri itu.” Kata Ibrani yang dipakai dapat menunjuk pada seluruh bumi atau pada suatu negeri atau wilayah tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  choice: Namun Allah
  rationale: Konjungsi waw dipahami secara adversatif dalam konteks, sehingga “Namun” mengungkapkan pertentangan antara kehancuran yang sedang dikeluhkan dan keyakinan tetap kepada Allah.
- source_word: מַלְכִּי
  choice: Rajaku
  rationale: Nomina dengan akhiran orang pertama tunggal berarti “rajaku”; huruf kapital menandai pemakaiannya sebagai gelar ilahi.
- source_word: מִקֶּדֶם
  choice: sejak dahulu kala
  rationale: Ungkapan ini menunjuk pada masa lampau yang jauh atau keadaan yang telah berlangsung lama, tanpa harus berarti sejak awal mutlak.
- source_word: פֹּעֵל
  choice: yang mengerjakan
  rationale: Partisipel menggambarkan tindakan Allah yang aktif dan khas; bentuk relatif menghasilkan susunan Indonesia yang alami.
- source_word: יְשׁוּעוֹת
  choice: karya-karya keselamatan
  rationale: Bentuk jamak menunjuk pada tindakan-tindakan penyelamatan yang berulang. “Karya-karya keselamatan” mempertahankan bentuk jamak dan gema teologis kata keselamatan.
- source_word: בְּקֶרֶב
  choice: di tengah
  rationale: Padanan ini mempertahankan arti spasial “di tengah-tengah” secara ringkas dan puitis.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Kata אֶרֶץ dapat berarti bumi atau negeri. “Bumi” dipilih karena sesuai dengan cakupan luas pernyataan tentang karya penyelamatan Allah, sambil mempertahankan alternatifnya dalam catatan kaki.
theological_decisions:
- issue: Cakupan karya-karya keselamatan Allah
  choice: bumi
  alternative: negeri itu
  rationale: Bahasa Ibrani tetap ambigu antara seluruh bumi dan suatu negeri tertentu. Konteks luas tentang pemerintahan dan perbuatan dahsyat Allah mendukung “bumi”, tetapi kemungkinan lokal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. “Sejak dahulu kala” mempertahankan nuansa mazmur, sedangkan “karya-karya keselamatan” menyampaikan bentuk jamak Ibrani dengan jelas bagi pembaca umum.
