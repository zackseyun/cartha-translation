source:
  edition: WLC
  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: id
  text: Engkaulah yang menetapkan[a] segala batas bumi; musim panas dan musim dingin—Engkaulah yang membentuk keduanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menentukan” atau “mengukuhkan” segala batas bumi.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadikan keduanya.” Kata “keduanya” merujuk kepada musim panas dan musim dingin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: menetapkan
  rationale: Bentuk Hifil dari נצב menyatakan tindakan membuat sesuatu berdiri atau berada pada tempatnya. “Menetapkan” menyampaikan tindakan penataan sekaligus keteguhannya dalam bahasa Indonesia yang wajar.
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: segala batas bumi
  rationale: גְּבוּלוֹת adalah bentuk jamak yang berarti batas-batas. Dalam konteks tatanan ciptaan yang juga menyebut musim, אָרֶץ paling tepat diterjemahkan “bumi,” bukan “negeri”; “batas” juga tidak menyiratkan perbatasan politik.
- source_word: קַיִץ וָחֹרֶף
  choice: musim panas dan musim dingin
  rationale: Pasangan istilah musim ini secara wajar diterjemahkan “musim panas dan musim dingin” dan bersama-sama menggambarkan tatanan musim sepanjang tahun.
- source_word: יְצַרְתָּם
  choice: membentuk keduanya
  rationale: יצר berarti membentuk atau menjadikan dengan gambaran pembentukan. Akhiran orang ketiga jamak merujuk secara paling wajar kepada dua musim yang baru disebut; “keduanya” memperjelas rujukan itu tanpa mengubah makna.
- source_word: אַתָּה ... אַתָּה
  choice: Engkaulah ... Engkaulah
  rationale: Pengulangan kata ganti Ibrani bersifat tegas. Bentuk “Engkaulah” pada kedua klausa mempertahankan penekanan pada tindakan langsung Allah serta menghasilkan ungkapan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Cakupan ungkapan penciptaan tentang “batas bumi”
  choice: Pernyataan kosmis tentang Allah yang menata dunia
  alternative: Rujukan kepada batas wilayah negeri atau bangsa
  rationale: Penyebutan musim panas dan musim dingin menempatkan ayat ini dalam konteks tatanan ciptaan, bukan geopolitik. Karena itu dipakai “batas bumi,” sambil tetap mempertahankan gambaran umum tentang batas-batas tanpa menjelaskan bentuk fisiknya secara berlebihan.
- issue: Rujukan akhiran jamak pada יְצַרְתָּם
  choice: Merujuk kepada musim panas dan musim dingin
  alternative: Merujuk secara lebih luas kepada unsur-unsur tatanan ciptaan yang disebut dalam konteks
  rationale: Dua musim merupakan anteseden terdekat dan membentuk pasangan gramatikal yang wajar bagi akhiran jamak. Terjemahan “keduanya” menyatakan hubungan ini, sedangkan catatan kaki mengakui unsur pembentukan dalam kata kerjanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara terkendali. “Engkaulah” mempertahankan penekanan ganda dalam teks Ibrani, sementara tanda pisah menandai kesejajaran antarklausa. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
