  text: Your adversaries roared in the midst of your appointed place[c][b][a]; they set up their own signs as signs.
translation:
  language: id
  text: Musuh-musuh-Mu mengaum di tengah tempat pertemuan-Mu[a]; mereka memasang lambang-lambang mereka sebagai tanda-tanda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tengah tempat yang Kautetapkan.” Kata Ibrani מוֹעֵד dapat berarti waktu yang ditetapkan, pertemuan, atau tempat pertemuan; dalam konteks ini kemungkinan besar yang dimaksud ialah tempat pertemuan kudus.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bahasa Ibrani mengulang kata “tanda”: “mereka memasang tanda-tanda mereka sebagai tanda-tanda.” Ungkapan ini mungkin menunjuk kepada lambang atau panji musuh yang dipasang sebagai tanda kekuasaan atau kemenangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲגוּ
  choice: mengaum
  rationale: Kata kerja ini terutama menggambarkan auman singa dan secara kiasan seruan keras yang mengancam; “mengaum” mempertahankan daya kebinatangan dan kekerasannya.
- source_word: צֹרְרֶיךָ
  choice: lawan-lawan-Mu
  rationale: Bentuk partisipial dari צרר menunjuk kepada pihak-pihak yang memusuhi; “lawan-lawan” alami dalam bahasa Indonesia dan cukup luas untuk konteks serangan serta penodaan tempat kudus.
- source_word: בְּקֶרֶב
  choice: di tengah
  rationale: Ungkapan ini menandai keberadaan di bagian dalam atau tengah suatu tempat.
- source_word: מוֹעֲדֶךָ
  choice: tempat pertemuan-Mu
  rationale: מוֹעֵד dapat berarti waktu yang ditetapkan, pertemuan, atau tempat pertemuan. Dalam konteks penyerbuan ruang kudus, pengertian lokatif-kultis paling wajar, tetapi catatan kaki mempertahankan keluasan maknanya.
- source_word: שָׂמוּ
  choice: memasang
  rationale: שׂים berarti menaruh atau menempatkan; “memasang” cocok dengan tindakan menampilkan lambang musuh di ruang yang direbut.
- source_word: אוֹתֹתָם
  choice: lambang-lambang mereka
  rationale: Kata ini secara harfiah berarti “tanda-tanda mereka”; “lambang-lambang” menyampaikan kemungkinan emblem atau panji milik musuh sambil menghindari pengulangan Indonesia yang janggal.
- source_word: אֹתוֹת
  choice: sebagai tanda
  rationale: Nomina “tanda” diulang dalam bahasa Ibrani. Pemakaian predikatif “sebagai tanda” mempertahankan unsur pengulangan semantis dan gagasan bahwa lambang musuh dijadikan penanda kekuasaan atau kemenangan.
theological_decisions:
- issue: Makna מוֹעֵד dalam ratapan tentang penodaan tempat kudus
  choice: 'pengertian lokatif-kultis: “tempat pertemuan”'
  alternative: “waktu yang ditetapkan” atau “pertemuan/perayaan”
  rationale: Konteks langsung menggambarkan musuh berada di dalam ruang kudus dan memasang tanda mereka. Karena itu, makna tempat paling sesuai, tanpa menyamakan istilah ini secara mutlak dengan bangunan tertentu.
- issue: Makna pemasangan tanda-tanda musuh
  choice: lambang musuh dijadikan tanda di tempat kudus
  alternative: panji militer sebagai tanda kemenangan atau penanda kepemilikan
  rationale: Teks tidak menjelaskan secara tegas jenis maupun fungsi tanda itu. Terjemahan mempertahankan ketidakpastian tersebut dan catatan hanya menyebut kemungkinan kontekstual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. “Mengaum” mempertahankan citra ancaman yang kuat, sedangkan “lambang-lambang ... sebagai tanda” menjaga permainan pengulangan Ibrani tanpa menghasilkan susunan yang terlalu janggal.
