  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: id
  text: Milik-Mulah siang; malam pun milik-Mu. Engkaulah yang menetapkan terang[a] dan matahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “benda penerang”; sebagian menafsirkannya sebagai bulan karena kesejajaran antara siang dan malam, tetapi teks Ibrani tidak secara eksplisit menyebut “bulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: milik-Mu
  rationale: Preposisi ל dengan akhiran orang kedua maskulin tunggal menyatakan kepunyaan; pengulangan “milik-Mu” mempertahankan penekanan Ibrani.
- source_word: יוֹם
  choice: siang
  rationale: Dalam pertentangan dengan לָיְלָה, “siang” lebih alami dan tepat daripada “hari,” yang juga dapat berarti satuan waktu 24 jam.
- source_word: אַף
  choice: pun
  rationale: 'Partikel ini menambahkan unsur kedua secara tegas: bukan hanya siang, malam pun milik Allah.'
- source_word: לָיְלָה
  choice: malam
  rationale: Padanan baku dan alami dalam antitesis dengan “siang.”
- source_word: אַתָּה
  choice: Engkaulah
  rationale: 'Pronomina eksplisit diberi bentuk emfatik untuk mempertahankan penekanan sumber: Allah sendiri yang menetapkannya.'
- source_word: הֲכִינוֹתָ
  choice: menetapkan
  rationale: Bentuk Hifil dari כון menyatakan membuat teguh, menata, atau menempatkan secara tetap; “menetapkan” cocok dengan konteks penataan kosmis.
- source_word: מָאוֹר
  choice: terang
  rationale: Kata ini dapat berarti terang atau benda penerang. “Terang” mempertahankan keluasan maknanya dan tidak menyisipkan “bulan,” yang tidak disebut secara eksplisit.
- source_word: וָשָׁמֶשׁ
  choice: dan matahari
  rationale: Padanan langsung bagi konjungsi dan nomina שֶׁמֶשׁ; dalam bahasa Indonesia nama benda langit ini alami tanpa artikel.
theological_decisions:
- issue: Makna מָאוֹר dalam hubungannya dengan שֶׁמֶשׁ
  choice: Diterjemahkan “terang” dan dibedakan dari “matahari.”
  alternative: “Bulan” berdasarkan kesejajaran siang/malam, atau “benda penerang.”
  rationale: Teks Ibrani tidak secara eksplisit mengatakan “bulan.” Pilihan “terang” menjaga data leksikal serta ambiguitas puitis tanpa menetapkan tafsiran kontekstual sebagai isi teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Susunan awal mempertahankan penekanan kepunyaan dalam kedua klausa, sedangkan “Engkaulah” mencerminkan penekanan pronomina eksplisit Ibrani.
