id: PSA.74.18
reference: Psalms 74:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זְכָר זֹ֗את א֭וֹיֵב חֵרֵ֣ף יְהוָ֑ה וְ/עַ֥ם נָ֝בָ֗ל נִֽאֲצ֥וּ שְׁמֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: id
  text: 'Ingatlah hal ini: musuh telah mencela Yahweh[a], dan bangsa yang bebal[b] telah menghina nama-Mu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menista” atau “telah mengejek” Yahweh.
    reason: lexical_alternative
  - marker: b
    text: “Bebal” di sini menunjuk pada kebodohan moral, bukan sekadar kurang cerdas; bandingkan orang “bebal” dalam Mazmur 14:1.
    reason: cross_reference
  - marker: c
    text: Atau “telah memperlakukan nama-Mu dengan hina”; mungkin juga “telah menghujat nama-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר זֹאת
  choice: Ingatlah hal ini
  rationale: Imperatif Qal זְכָר menyampaikan permohonan langsung kepada Allah, sedangkan זֹאת menunjuk pada penghinaan yang disebutkan. Ungkapan ini alami dalam doa bahasa Indonesia dan mempertahankan seruan agar Allah bertindak dengan mengingat perkara tersebut.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Nomina tunggal ini dapat menunjuk secara umum atau kolektif kepada pihak lawan. Bahasa Indonesia tidak memerlukan kata sandang, sehingga “musuh” mempertahankan ketidakpastian antara satu musuh dan musuh sebagai golongan.
- source_word: חֵרֵף
  choice: telah mencela
  rationale: Verba חרף mengandung makna celaan, ejekan, atau cercaan yang merendahkan. “Telah mencela” cukup luas untuk mempertahankan rentang maknanya dan sesuai dengan bentuk perfektif Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian yang terdapat langsung dalam teks tetap tampak.
- source_word: וְעַם
  choice: dan bangsa
  rationale: עַם menunjuk pada suatu kelompok manusia secara kolektif. “Bangsa” alami dalam konteks permusuhan antarkelompok dan tidak menentukan identitas yang tidak disebutkan teks.
- source_word: נָבָל
  choice: bebal
  rationale: Dalam puisi dan sastra hikmat, נָבָל biasanya menyatakan kebodohan moral dan rohani, bukan sekadar kurang cerdas. “Bebal” mempertahankan bobot moral itu tanpa mempersempitnya menjadi “fasik”.
- source_word: נִאֲצוּ
  choice: telah menghina
  rationale: נאץ menyatakan sikap meremehkan, menolak, atau memperlakukan dengan nista. “Telah menghina” kuat dan alami dengan objek “nama-Mu”, sementara kemungkinan “menghujat” dicatat sebagai alternatif yang lebih khusus.
- source_word: שְׁמֶךָ
  choice: nama-Mu
  rationale: Terjemahan harfiah “nama-Mu” mempertahankan ungkapan Ibrani, yang dapat mencakup nama, kehormatan, identitas, dan reputasi Allah tanpa menggantinya dengan satu penafsiran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Nuansa moral נָבָל
  choice: bebal
  alternative: bodoh; fasik; tidak berakal
  rationale: Kata ini mengandung kebodohan yang bersifat moral dan religius. “Bebal” menyampaikan bobot tersebut tanpa secara diam-diam menyamakannya sepenuhnya dengan kefasikan.
- issue: Kekuatan makna נִאֲצוּ terhadap nama Allah
  choice: telah menghina nama-Mu
  alternative: telah memperlakukan nama-Mu dengan hina; telah menghujat nama-Mu
  rationale: “Menghina” mempertahankan gagasan penghinaan dan sikap meremehkan. “Menghujat” mungkin sesuai, tetapi lebih khusus secara teologis daripada yang harus dinyatakan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras doa ratapan yang ringkas dan bermartabat. Bentuk “nama-Mu” mengikuti ejaan devosional yang lazim untuk sapaan kepada Allah. Paralelisme dua klausa Ibrani dipertahankan, dan istilah “bebal” dipilih untuk menjaga dimensi moral tanpa menambahkan label doktrinal.
