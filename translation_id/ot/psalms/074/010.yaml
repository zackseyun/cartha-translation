source:
  edition: WLC
  text: עַד מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְ/ךָ֣ לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: id
  text: Sampai kapan, ya Allah, lawan akan mencela? Akankah musuh menghina nama-Mu untuk selama-lamanya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Akankah musuh menghujat nama-Mu untuk selama-lamanya?”'
    reason: Alternatif leksikal untuk יְנָאֵץ; dalam konteks nama Allah, kata ini dapat menyatakan penghujatan atau penistaan.
lexical_decisions:
- source_word: עַד מָתַי
  choice: Sampai kapan
  rationale: Ungkapan tanya ratapan tentang keadaan yang berlangsung lama; bentuk ini alami dan langsung dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Konteks doa menuntut bentuk sapaan langsung; 'ya Allah' merupakan vokatif Indonesia yang alami dan khidmat.
- source_word: יְחָרֶף
  choice: mencela
  rationale: Bentuk Piel dari חרף menyatakan celaan atau ejekan yang menghina; 'mencela' mempertahankan cakupan umum tanpa mempersempitnya menjadi hujatan khusus kepada Allah.
- source_word: צָר
  choice: lawan
  rationale: צָר berarti pihak yang memusuhi atau menentang. 'Lawan' membedakannya dari אוֹיֵב dalam baris paralel tanpa menghilangkan kedekatan makna.
- source_word: יְנָאֵץ
  choice: menghina
  rationale: Bentuk Piel dari נאץ menyatakan perlakuan penuh penghinaan atau sikap meremehkan, khususnya terhadap Allah atau nama-Nya. 'Menghina' alami dan cukup luas untuk mempertahankan ambiguitas antara penghinaan verbal dan penistaan.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Padanan Indonesia yang lazim untuk אוֹיֵב dan tetap membedakannya secara leksikal dari צָר, 'lawan'.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Mempertahankan ungkapan eksplisit Ibrani yang mencakup kehormatan, reputasi, dan identitas Allah yang dinyatakan.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Menyampaikan gagasan waktu tanpa akhir sebagaimana dirasakan dalam ratapan, dengan register puitis dan khidmat.
theological_decisions:
- issue: Apakah penghinaan terhadap 'nama' Allah perlu dijelaskan sebagai penghujatan terhadap Allah sendiri
  choice: Mempertahankan 'nama-Mu' dalam teks utama
  alternative: Akankah musuh menghujat Engkau untuk selama-lamanya?
  rationale: Teks Ibrani secara eksplisit menyebut nama Allah. Bentuk literal ini menjaga kaitannya dengan kehormatan dan identitas Allah tanpa mereduksinya menjadi parafrasa.
- issue: Kekuatan teologis kata יְנָאֵץ
  choice: menghina dalam teks utama
  alternative: menghujat
  rationale: '''Menghina'' mempertahankan rentang makna tindakan meremehkan atau menista, sedangkan ''menghujat'' merupakan kemungkinan kontekstual yang lebih khusus dan dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ratapan yang puitis dan khidmat. Paralelisme antara 'lawan' dan 'musuh' dipertahankan, demikian pula peralihan dari pertanyaan 'Sampai kapan' ke pertanyaan tentang keadaan yang seolah-olah berlangsung selamanya.
