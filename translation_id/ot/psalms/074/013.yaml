source:
  edition: WLC
  text: אַתָּ֤ה פוֹרַ֣רְתָּ בְ/עָזְּ/ךָ֣ יָ֑ם שִׁבַּ֖רְתָּ רָאשֵׁ֥י תַ֝נִּינִ֗ים עַל הַ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/013.yaml
  text: You split the sea by your strength[b][a]; you shattered the heads of the sea monsters on the waters.
translation:
  language: id
  text: Engkaulah yang membelah laut dengan kekuatan-Mu[b]; Engkau menghancurkan kepala para makhluk laut[a] di atas air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “monster-monster laut”, “naga-naga”, atau “makhluk-makhluk laut yang besar”. Kata Ibrani tanninim dapat merujuk pada makhluk besar atau mengerikan yang menyerupai ular dan berkaitan dengan perairan.
    reason: lexical_alternative
  - marker: b
    text: Ayat ini mungkin menggemakan baik kemenangan Allah atas laut yang kacau dalam gambaran puitis maupun pembebasan umat-Nya di laut pada peristiwa keluaran.
    reason: cross_reference
lexical_decisions:
- source_word: פוֹרַרְתָּ
  choice: membelah
  rationale: Bentuk intensif verba פרר menyatakan tindakan memecah atau membelah. Dalam konteks laut, “membelah” alami dalam bahasa Indonesia dan mempertahankan daya tindakannya.
- source_word: בְעָזְּךָ
  choice: dengan kekuatan-Mu
  rationale: עֹז berarti kekuatan atau keperkasaan, sedangkan בְּ berfungsi instrumental. Pilihan ini jelas dan alami.
- source_word: יָם
  choice: laut
  rationale: Nomina Ibrani ini tidak berartikel. Bahasa Indonesia tidak memerlukan artikel; “laut” tetap memungkinkan gema peristiwa keluaran maupun gambaran laut purba.
- source_word: שִׁבַּרְתָּ
  choice: menghancurkan
  rationale: שׁבר berarti mematahkan atau meremukkan. “Menghancurkan” menyampaikan kekuatan tindakan dalam paralelisme puisi tanpa mengubah citranya.
- source_word: רָאשֵׁי
  choice: kepala-kepala
  rationale: Bentuk jamak konstruktus ini secara langsung menunjuk pada kepala-kepala. Pengulangan jamak dipertahankan karena menonjolkan citra puitis teks.
- source_word: תַנִּינִים
  choice: makhluk laut
  rationale: תַנִּינִים dapat menunjuk pada makhluk besar, menyerupai ular, atau mengerikan yang terkait dengan perairan. “Makhluk laut” mudah dipahami dan tidak terlalu menentukan apakah yang dimaksud naga, monster, atau hewan laut besar; alternatif dijelaskan dalam catatan.
- source_word: עַל הַמָּיִם
  choice: di atas air
  rationale: עַל paling langsung berarti “di atas/pada.” Terjemahan ini mempertahankan preposisi dan gambaran puitis Ibrani, alih-alih menghaluskannya menjadi “di dalam air.”
theological_decisions:
- issue: Sifat gambaran laut dan תַנִּינִים
  choice: Mempertahankan gambaran puitis-kosmis sambil membiarkan kemungkinan gema pembebasan di laut pada peristiwa keluaran tetap terbuka.
  alternative: Menafsirkannya semata-mata sebagai peristiwa keluaran, atau semata-mata sebagai bahasa pertarungan mitologis.
  rationale: Ayat ini dapat menggemakan kemenangan Allah atas laut yang kacau sekaligus pembebasan historis di laut. Terjemahan tidak boleh menutup salah satu kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Bentuk “Engkaulah” menegaskan kata ganti אַתָּה yang ditempatkan secara eksplisit di awal ayat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Semua penanda catatan kaki muncul dalam teks utama.
