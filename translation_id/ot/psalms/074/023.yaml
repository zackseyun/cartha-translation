  yaml_path: translation/ot/psalms/074/023.yaml
  text: Do not forget the voice of your enemies[a], the uproar of those who rise against you[b], which goes up continually.
translation:
  language: id
  text: Janganlah lupakan suara musuh-musuh-Mu[a], kegaduhan orang-orang yang bangkit melawan-Mu, yang senantiasa naik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bunyi musuh-musuh-Mu". Kata Ibrani qol dapat berarti suara, bunyi, atau kegaduhan, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau "kegaduhan orang-orang yang bangkit melawan-Mu senantiasa naik." Bahasa Ibrani dapat dibaca lebih ringkas tanpa kata penghubung "yang".
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁכַּח
  choice: Jangan lupakan
  rationale: Gabungan partikel larangan אַל dan verba שׁכח menyatakan permohonan langsung agar Allah tidak melupakan atau mengabaikan; bentuk ini alami dan tetap dekat dengan bahasa Ibrani.
- source_word: קוֹל
  choice: suara
  rationale: קוֹל dapat berarti suara maupun bunyi. 'Suara' mempertahankan arti dasarnya, sementara konteks tetap menunjukkan seruan gaduh para musuh.
- source_word: צֹרְרֶיךָ
  choice: musuh-musuh-Mu
  rationale: Bentuk partisipial jamak ini menunjuk kepada orang-orang yang memusuhi Allah; 'musuh-musuh-Mu' merupakan padanan langsung dan wajar.
- source_word: שְׁאוֹן
  choice: kegaduhan
  rationale: שְׁאוֹן menggambarkan bunyi keras dan hiruk-pikuk. 'Kegaduhan' menyampaikan unsur suara keras serta kekacauan.
- source_word: קָמֶיךָ
  choice: orang-orang yang bangkit melawan-Mu
  rationale: Terjemahan ini mempertahankan gambaran verbal קום, yaitu bangkit sebagai tindakan menentang, bukan sekadar menggantinya dengan nomina 'lawan'.
- source_word: עֹלֶה
  choice: membubung
  rationale: Partisipel עלה secara harfiah menggambarkan kegaduhan yang naik. 'Membubung' mempertahankan citra itu dengan ungkapan Indonesia yang alami untuk suara yang naik.
- source_word: תָמִיד
  choice: terus
  rationale: תָמִיד menyatakan keberlangsungan tanpa henti; 'terus' ringkas, alami, dan tepat dalam konstruksi ini.
