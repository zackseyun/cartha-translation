  text: And now they smash all its carved work together with hatchet and hammers[a][b].
translation:
  language: id
  text: Dan sekarang mereka menghantam semua ukirannya dengan kapak dan palu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan beliung dan martil”; kata-kata Ibrani menyebut alat pemotong dan pemukul tertentu, tetapi padanan modern yang tepat untuk masing-masing alat tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַת
  choice: Sekarang
  rationale: Gabungan konjungsi dan keterangan waktu menandai peralihan kepada adegan penghancuran saat ini; dalam bahasa Indonesia, “Sekarang” sudah menyampaikan peralihan itu secara alami tanpa harus menerjemahkan konjungsinya secara tersendiri.
- source_word: פִּתּוּחֶיהָ
  choice: ukirannya
  rationale: Kata ini menunjuk pada karya hias yang dipahat atau diukir, dengan sufiks feminin tunggal yang mengacu pada bangunan atau tempat kudus dalam konteks.
- source_word: יַחַד
  choice: semua
  rationale: Dalam konteks ini, adverbia tersebut menekankan keseluruhan karya ukiran sebagai sasaran penghancuran. “Semua” menyampaikan cakupan kolektifnya dengan alami dan menghindari kesan bahwa para pelaku bekerja ‘bersama-sama’.
- source_word: בְּכַשִּׁיל
  choice: dengan kapak
  rationale: Istilah ini menunjuk pada alat pemotong untuk pengerjaan kayu. “Kapak” merupakan padanan Indonesia yang jelas dan sesuai konteks, meskipun jenis alat tepatnya tidak pasti.
- source_word: וְכֵילַפּוֹת
  choice: dan palu
  rationale: Kata ini menunjuk pada alat-alat pemukul dan berbentuk jamak dalam bahasa Ibrani. Bahasa Indonesia lazim tidak menandai jamak setelah konteks alat yang bersifat umum; “palu” merupakan padanan modern yang paling mudah dipahami.
- source_word: יַהֲלֹמוּן
  choice: mereka hantam
  rationale: Verba ini berarti memukul atau menghantam. “Hantam” mempertahankan kekuatan tindakan penghancuran tanpa menambahkan akibat yang tidak dinyatakan secara eksplisit.
