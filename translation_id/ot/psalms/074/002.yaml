base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: id
  text: 'Ingatlah umat-Mu yang Kauperoleh sejak dahulu,[a]

    yang Kautebus sebagai suku yang menjadi milik pusaka-Mu—

    Gunung Sion ini, tempat Engkau berdiam.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “Kauperoleh” juga dapat berarti “Kaubeli” atau, dalam konteks tertentu, “Kauciptakan.”
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “Gunung Sion ini, yang di dalamnya Engkau berdiam.”'
    reason: literal_rendering
lexical_decisions:
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Bentuk imperatif yang menyampaikan permohonan langsung kepada Allah secara alami dalam doa ratapan.
- source_word: עֲדָתְךָ
  choice: umat-Mu
  rationale: Menunjuk kepada komunitas umat kepunyaan Allah; 'umat-Mu' lebih alami dalam bahasa Indonesia modern daripada 'jemaah-Mu' dan tetap mempertahankan makna kolektifnya.
- source_word: קָנִיתָ קֶּדֶם
  choice: yang Kauperoleh sejak dahulu
  rationale: קנה di sini paling mungkin berarti memperoleh atau menjadikan sebagai kepunyaan, sedangkan קדם menunjukkan masa lampau yang jauh. Pilihan ini tidak membatasi maknanya pada transaksi jual beli.
- source_word: גָּאַלְתָּ
  choice: yang Kautebus
  rationale: Mempertahankan makna pembebasan dan pengambilan kembali sebagai milik sendiri yang terkandung dalam גאל.
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: suku milik pusaka-Mu
  rationale: שֵׁבֶט paling sesuai dipahami sebagai kelompok umat dalam kesejajaran dengan 'umat-Mu', sementara נַחֲלָה menyatakan milik pusaka Allah.
- source_word: הַר צִיּוֹן זֶה
  choice: Gunung Sion ini
  rationale: Mempertahankan penunjuk זֶה secara langsung dan alami; frasa ini menjadi objek lain dari seruan 'Ingatlah'.
- source_word: שָׁכַנְתָּ בוֹ
  choice: tempat Engkau berdiam
  rationale: Ungkapan tempat yang alami dalam bahasa Indonesia dan tetap mempertahankan gagasan kehadiran Allah yang menetap di Sion.
theological_decisions:
- issue: Apakah קָנִיתָ menyatakan penciptaan atau pemerolehan umat sebagai kepunyaan Allah
  choice: pemerolehan umat sebagai kepunyaan Allah
  alternative: penciptaan atau pembentukan umat
  rationale: Kesejajarannya dengan tindakan menebus dan objeknya, yaitu umat Allah, lebih mendukung tindakan historis Allah mengambil Israel menjadi milik-Nya, tanpa meniadakan rentang makna leksikal kata tersebut.
- issue: Apakah שֵׁבֶט berarti suku, tongkat, atau tongkat kerajaan
  choice: suku
  alternative: tongkat atau tongkat kerajaan
  rationale: Konteksnya membicarakan umat yang diperoleh dan ditebus Allah, sehingga makna kelompok manusia paling sesuai. Kemungkinan makna benda tetap dicatat dalam catatan kaki.
- issue: Hubungan Gunung Sion dengan perintah זְכֹר
  choice: Gunung Sion dipahami sebagai objek tambahan dari permohonan 'Ingatlah'
  alternative: Gunung Sion dipahami sebagai aposisi langsung bagi suku milik pusaka Allah
  rationale: Jeda utama Masoret sesudah נַחֲלָתֶךָ dan susunan klausa berikutnya mendukung pembacaan Sion sebagai objek yang turut diminta untuk diingat. Pengulangan 'Ingatlah' dalam bahasa Indonesia memperjelas hubungan sintaksis yang tersirat tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Pengulangan 'Ingatlah' membuat struktur dua objek jelas bagi pembaca umum, sedangkan baris puitis mempertahankan kesejajaran mazmur.
