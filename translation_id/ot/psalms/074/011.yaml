base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/011.yaml
  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
translation:
  language: id
  text: Mengapa Engkau menahan tangan-Mu, tangan kanan-Mu? Keluarkanlah tangan kanan-Mu dari lipatan jubah-Mu dan binasakanlah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian terakhir berbunyi, “Dari dalam dada/pangkuan-Mu, habisilah.” Dalam bahasa Ibrani tidak ada verba eksplisit “keluarkanlah” dan tidak ada objek eksplisit bagi “habisilah”; “keluarkanlah tangan kanan-Mu” serta “mereka” dilengkapi dari gambaran dan konteks para musuh dalam mazmur ini.
    reason: Menjelaskan kepadatan susunan Ibrani, ragam makna חֵיק, serta verba gerak dan objek yang dilengkapi demi kejelasan bahasa Indonesia.
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya alasan yang lazim dan tepat untuk membuka seruan keluh kesah ini.
- source_word: תָשִׁיב
  choice: menarik kembali
  rationale: Bentuk Hifil dari שוב dengan 'tangan' sebagai objek menyatakan tindakan menarik atau menahan tangan agar tidak bertindak; 'menarik kembali' mempertahankan gambaran konkretnya.
- source_word: יָדְךָ וִימִינֶךָ
  choice: tangan-Mu, tangan kanan-Mu
  rationale: Gambaran harfiah dan kesejajaran puitis dipertahankan; tangan kanan menyiratkan kekuatan dan tindakan tegas tanpa perlu diparafrasakan.
- source_word: מִקֶּרֶב חֹוקֶךָ
  choice: dari lipatan jubah-Mu
  rationale: חֵיק dapat menunjuk dada, pangkuan, atau bagian dalam/lipatan pakaian tempat tangan disembunyikan. 'Lipatan jubah' membuat citra kuno ini jelas dan alami bagi pembaca Indonesia.
- source_word: כַלֵּה
  choice: habisilah mereka
  rationale: Imperatif Piel dari כלה berarti menghabiskan, mengakhiri, atau membinasakan. 'Habisilah' mempertahankan daya ungkap verba itu, sedangkan 'mereka' dilengkapi dari konteks para musuh dalam mazmur.
theological_decisions:
- issue: Objek tersirat pada imperatif terakhir
  choice: Objek 'mereka' dilengkapi sebagai rujukan kepada para musuh dalam konteks mazmur.
  alternative: Membiarkan verba tanpa objek atau memahaminya lebih umum sebagai mengakhiri ancaman.
  rationale: Teks Ibrani tidak menyebut objek secara eksplisit. Konteks dekat berbicara tentang musuh yang merusak tempat kudus dan mencela Allah, sehingga 'mereka' merupakan pelengkapan kontekstual minimal, tetapi ketidaktersuratannya tetap dijelaskan dalam catatan kaki.
- issue: Tindakan tangan yang berada di lipatan pakaian
  choice: Menambahkan 'Keluarkanlah tangan-Mu' untuk mengungkapkan gerak yang tersirat oleh frasa 'dari lipatan jubah-Mu'.
  alternative: Menerjemahkan secara sangat harfiah, 'Dari dalam dada/lipatan jubah-Mu, habisilah,' tanpa verba gerak tambahan.
  rationale: Susunan Ibrani sangat padat dan tidak memiliki verba eksplisit yang berarti 'keluarkanlah'. Dalam bahasa Indonesia, pelengkapan ini memperjelas citra tangan yang ditarik dan disimpan di dalam pakaian tanpa mengubah inti permohonan agar Allah bertindak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai huruf kapital. Citra tangan kanan serta tangan yang tersimpan dalam lipatan pakaian dipertahankan, tetapi diungkapkan secara alami agar mudah dipahami.
