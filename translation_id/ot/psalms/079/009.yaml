source:
  edition: WLC
  text: עָזְרֵ֤/נוּ אֱלֹ֘הֵ֤י יִשְׁעֵ֗/נוּ עַל דְּבַ֥ר כְּבֽוֹד שְׁמֶ֑/ךָ וְ/הַצִּילֵ֥/נוּ וְ/כַפֵּ֥ר עַל חַ֝טֹּאתֵ֗י/נוּ לְמַ֣עַן שְׁמֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: id
  text: Tolonglah kami, ya Allah keselamatan kami, demi kemuliaan nama-Mu[a]; lepaskanlah kami dan adakanlah pendamaian bagi dosa-dosa kami[b], demi nama-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karena kemuliaan nama-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “adakanlah pendamaian” mengandung gagasan pendamaian atau penghapusan kesalahan, bukan hanya pengampunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: Tolonglah kami
  rationale: Bentuk imperatif dengan sufiks orang pertama jamak; pilihan ini langsung, mendesak, dan wajar dalam doa bahasa Indonesia.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Allah keselamatan kami
  rationale: Mempertahankan susunan konstruksi Ibrani dan menyatakan Allah sebagai Allah yang berkaitan dengan serta menjadi sumber keselamatan umat-Nya, tanpa mempersempitnya menjadi satu tindakan penyelamatan tertentu.
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: demi kemuliaan nama-Mu
  rationale: Mengungkapkan dasar atau alasan permohonan dan tetap membedakan unsur 'kemuliaan' dan 'nama' dalam teks Ibrani.
- source_word: וְהַצִּילֵנוּ
  choice: lepaskanlah kami
  rationale: Menerjemahkan imperatif Hifil dari נצל sebagai permohonan agar dibebaskan atau diselamatkan dari bahaya, sekaligus menghindari pengulangan langsung dengan 'keselamatan'.
- source_word: וְכַפֵּר עַל
  choice: adakanlah pendamaian bagi
  rationale: Mempertahankan bobot bahasa pendamaian dari כפר dan tidak meratakannya menjadi pengampunan saja. Bentuk ini cukup jelas dalam bahasa Indonesia serta tidak menetapkan mekanisme pendamaian yang tidak disebutkan ayat.
- source_word: חַטֹּאתֵינוּ
  choice: dosa-dosa kami
  rationale: Mencerminkan nomina jamak dengan sufiks orang pertama jamak secara langsung.
- source_word: לְמַעַן שְׁמֶךָ
  choice: demi nama-Mu
  rationale: Ungkapan ringkas dan alami yang mempertahankan seruan kepada nama, kehormatan, dan reputasi Allah sebagai alasan tindakan-Nya.
theological_decisions:
- issue: Makna כפר dalam permohonan pengakuan dosa
  choice: adakanlah pendamaian bagi dosa-dosa kami
  alternative: ampunilah dosa-dosa kami
  rationale: Kata Ibrani כפר memuat gagasan pendamaian atau penghapusan kesalahan yang lebih luas daripada pengampunan semata. Terjemahan utama mempertahankan kedalaman itu tanpa memasukkan teori pendamaian tertentu.
- issue: Dasar pertolongan pada nama Allah
  choice: demi kemuliaan nama-Mu ... demi nama-Mu
  alternative: karena kemuliaan nama-Mu ... oleh karena nama-Mu
  rationale: Ayat ini memohon tindakan Allah berdasarkan nama dan kemuliaan-Nya, bukan jasa umat. Pengulangan kedua seruan dipertahankan sebagaimana dalam teks sumber.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Partikel “ya” menandai sapaan langsung kepada Allah. Bentuk imperatif berakhiran “-lah” mempertahankan nada permohonan yang sungguh-sungguh, sedangkan kapitalisasi “-Mu” mengikuti kebiasaan ejaan religius bahasa Indonesia.
