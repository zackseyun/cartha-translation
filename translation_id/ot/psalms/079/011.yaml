  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
translation:
  language: id
  text: Biarlah rintihan tawanan sampai ke hadapan-Mu; menurut kebesaran lengan-Mu, peliharalah hidup orang-orang yang menghadapi maut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak kematian,” sebuah ungkapan Ibrani bagi orang-orang yang berada di bawah ancaman maut atau dijatuhi hukuman mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: Biarlah ... sampai
  rationale: Bentuk imperfek Qal dipakai secara yusif dalam doa. “Biarlah ... sampai” menyampaikan permohonan agar rintihan itu mencapai hadirat Allah.
- source_word: לְפָנֶיךָ
  choice: ke hadapan-Mu
  rationale: Ungkapan Ibrani ini menunjuk pada datang ke hadirat seseorang; “ke hadapan-Mu” alami dan tetap mempertahankan gambaran relasional-spasialnya.
- source_word: אֶנְקַת אָסִיר
  choice: rintihan tawanan
  rationale: אֶנְקָה adalah rintihan atau keluhan yang terdengar, sedangkan אָסִיר ialah orang yang ditahan atau dibelenggu. “Tawanan” sesuai dengan konteks penindasan umat tanpa membatasi makna pada lembaga penjara modern.
- source_word: כְּגֹדֶל זְרוֹעֲךָ
  choice: sesuai dengan kebesaran lengan-Mu
  rationale: כְּ menyatakan ukuran atau patokan, dan “lengan” dipertahankan sebagai metafora konkret bagi kuasa Allah.
- source_word: הוֹתֵר
  choice: biarkanlah tetap hidup
  rationale: Imperatif Hifil dari יתר meminta Allah membuat mereka tetap tersisa, yakni tidak membiarkan mereka mati. Pilihan ini jelas dalam bahasa Indonesia dan mempertahankan nuansa ‘menyisakan hidup’.
- source_word: בְּנֵי תְמוּתָה
  choice: orang-orang yang ditentukan untuk mati
  rationale: Secara harfiah berarti “anak-anak kematian” dan menunjuk kepada orang yang berada di bawah ancaman, hukuman, atau ketentuan kematian. Terjemahan utama menyampaikan maksud idiomnya, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah בְּנֵי תְמוּתָה menyatakan ketetapan ilahi, hukuman manusia, atau keadaan terancam mati
  choice: orang-orang yang ditentukan untuk mati
  alternative: orang-orang yang terancam mati; anak-anak kematian
  rationale: Teks tidak menyebut siapa yang menentukan kematian mereka. Rumusan utama mempertahankan keadaan mereka sebagai orang yang diperuntukkan bagi kematian tanpa menetapkan pelakunya; catatan kaki menjaga idiom Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora “lengan-Mu” dipertahankan, sedangkan idiom “anak-anak kematian” dijelaskan melalui catatan kaki agar teks utama tetap mudah dipahami.
