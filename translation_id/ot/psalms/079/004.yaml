  text: הָיִ֣ינוּ חֶ֭רְפָּה לִ/שְׁכֵנֵ֑י/נוּ לַ֥עַג וָ֝/קֶ֗לֶס לִ/סְבִיבוֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/004.yaml
  text: We have become a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: id
  text: Kami telah menjadi cela bagi tetangga-tetangga kami, bahan ejekan dan cemoohan bagi orang-orang di sekeliling kami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִינוּ
  choice: Kami telah menjadi
  rationale: Bentuk Qal perfektif orang pertama jamak dari היה menyatakan perubahan yang menghasilkan keadaan kini; “telah menjadi” mempertahankan unsur peristiwa lampau dan keadaan yang masih berlangsung.
- source_word: חֶרְפָּה
  choice: cela
  rationale: Nomina ini menunjuk pada kehinaan publik atau keadaan sebagai sasaran penghinaan. “Cela” alami dalam ungkapan “menjadi cela” dan mempertahankan nuansa relasionalnya.
- source_word: לִשְׁכֵנֵינוּ
  choice: bagi tetangga-tetangga kami
  rationale: Preposisi ל menyatakan hubungan atau sudut pandang pihak yang memandang Israel sebagai cela. “Bagi” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “kepada”.
- source_word: לַעַג
  choice: bahan ejekan
  rationale: Nomina ini menunjuk pada ejekan yang merendahkan. “Bahan ejekan” dengan jelas menyatakan bahwa umat telah menjadi sasaran ejekan.
- source_word: קֶלֶס
  choice: cemoohan
  rationale: Kata ini berdekatan makna dengan לַעַג tetapi tidak perlu dilebur dengannya; “cemoohan” mempertahankan penumpukan puitis kosakata penghinaan.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: bagi orang-orang di sekeliling kami
  rationale: Ungkapan ini secara harfiah mengacu pada pihak-pihak di sekitar umat. Terjemahan ini alami dan mempertahankan cakupan yang lebih luas daripada “tetangga-tetangga” pada baris sebelumnya.
