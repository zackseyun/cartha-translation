translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme Ibrani dipertahankan melalui pasangan “cela” serta “bahan ejekan dan cemoohan”; tidak diperlukan catatan kaki karena perbedaan leksikal dapat disampaikan langsung secara alami.
