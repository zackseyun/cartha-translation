  text: לָ֤/מָּה יֹאמְר֣וּ הַ/גּוֹיִם֮ אַיֵּ֪ה אֱֽלֹהֵ֫י/הֶ֥ם יִוָּדַ֣ע ב/גיים לְ/עֵינֵ֑י/נוּ נִ֝קְמַ֗ת דַּֽם עֲבָדֶ֥י/ךָ הַ/שָּׁפֽוּךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: id
  text: Mengapa bangsa-bangsa berkata, “Di manakah Allah mereka?” Biarlah pembalasan atas darah hamba-hamba-Mu yang tertumpah diketahui di antara bangsa-bangsa di depan mata kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Biarlah diketahui di antara bangsa-bangsa, di depan mata kami: pembalasan atas darah hamba-hamba-Mu yang tertumpah.”'
    reason: Bahasa Ibrani memungkinkan pembacaan yang lebih longgar terhadap hubungan antara kata kerja pasif, frasa “di depan mata kami”, dan “pembalasan”.
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Mempertahankan bentuk pertanyaan retoris yang menyatakan protes terhadap ejekan bangsa-bangsa.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks Mazmur, istilah ini menunjuk kepada bangsa-bangsa asing; pilihan ini alami dan tidak memasukkan nuansa keagamaan yang lebih kemudian.
- source_word: אַיֵּה אֱלֹהֵיהֶם
  choice: Di manakah Allah mereka?
  rationale: Menyampaikan ejekan lokatif secara langsung dan tetap merujuk kepada Allah Israel.
- source_word: יִוָּדַע
  choice: dinyatakan
  rationale: Bentuk pasif Nifal dipertahankan, dengan makna bahwa tindakan pembalasan Allah dibuat nyata dan diketahui secara terbuka.
- source_word: בַגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: Preposisi ב dalam kaitannya dengan kelompok manusia paling alami menyatakan lingkungan tempat sesuatu diketahui.
- source_word: לְעֵינֵינוּ
  choice: di depan mata kami
  rationale: Ungkapan ini menekankan bahwa pemazmur memohon untuk menyaksikan sendiri pembelaan Allah.
- source_word: נִקְמַת
  choice: pembalasan
  rationale: Mempertahankan daya imprekatoris kata Ibrani tanpa melunakkannya menjadi sekadar 'keadilan', tetapi juga menghindari kesan dendam pribadi yang dapat ditimbulkan oleh 'balas dendam'.
- source_word: דַּם עֲבָדֶיךָ הַשָּׁפוּךְ
  choice: darah hamba-hamba-Mu yang tertumpah
  rationale: Mempertahankan gambaran harfiah tentang darah akibat kematian dengan kekerasan serta bentuk pasif partisipelnya.
theological_decisions:
- issue: Permohonan imprekatoris agar Allah membalas
  choice: Mempertahankan istilah 'pembalasan' sebagai tindakan Allah yang dimohonkan agar tampak secara terbuka.
  alternative: Mengganti dengan 'keadilan' atau sekadar mengatakan bahwa Allah membela hamba-hamba-Nya.
  rationale: Kata נְקָמָה secara eksplisit menyatakan pembalasan; pelunakan akan mengurangi ketegangan teologis dan daya permohonan dalam teks.
- issue: Hubungan sintaksis frasa 'di depan mata kami'
  choice: Mengaitkannya terutama dengan tindakan pembalasan yang dinyatakan di antara bangsa-bangsa.
  alternative: 'Membaca susunannya secara lebih longgar: ''Biarlah diketahui di antara bangsa-bangsa, di depan mata kami: pembalasan atas darah ...'''
  rationale: Urutan bahasa Ibrani memungkinkan kelonggaran tertentu, tetapi terjemahan utama menyampaikan dengan jelas bahwa pemazmur meminta agar pembalasan Allah menjadi nyata dan mereka sendiri menyaksikannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Bentuk 'hamba-hamba-Mu' mempertahankan relasi umat dengan Allah, sedangkan 'tertumpah' menjaga citra puitis darah yang dicurahkan tanpa menambahkan pelaku yang tidak disebutkan.
