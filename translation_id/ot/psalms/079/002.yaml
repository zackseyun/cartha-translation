  text: נָֽתְנ֡וּ אֶת נִבְלַ֬ת עֲבָדֶ֗י/ךָ מַ֭אֲכָל לְ/ע֣וֹף הַ/שָּׁמָ֑יִם בְּשַׂ֥ר חֲ֝סִידֶ֗י/ךָ לְ/חַיְת/וֹ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: id
  text: Mereka telah menyerahkan mayat hamba-hamba-Mu menjadi makanan bagi burung-burung di langit, dan daging orang-orang yang setia kepada-Mu[a] kepada binatang-binatang liar di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang kudus-Mu.” Kata Ibrani ini dapat menunjuk kepada orang-orang yang mengabdi kepada Allah dalam kesetiaan perjanjian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְנוּ
  choice: Mereka telah menyerahkan
  rationale: Bentuk Qal perfektif orang ketiga jamak menyatakan tindakan musuh yang telah selesai dan kini diratapi. 'Telah menyerahkan' terdengar alami dan mempertahankan kesan bahwa jasad-jasad itu dibiarkan menjadi mangsa.
- source_word: נִבְלַת עֲבָדֶיךָ
  choice: mayat hamba-hamba-Mu
  rationale: נְבֵלָה menunjuk pada mayat atau jasad yang tidak dikuburkan; 'mayat' jelas, lugas, dan mempertahankan gambaran penghinaan. עבד dalam hubungan dengan Allah secara wajar diterjemahkan 'hamba'.
- source_word: מַאֲכָל
  choice: menjadi makanan
  rationale: 'Dalam konstruksi dengan נתן, kata ini menyatakan tujuan atau hasil: mayat-mayat itu diserahkan sebagai makanan. ''Menjadi makanan'' merupakan ungkapan Indonesia yang alami.'
- source_word: לְעוֹף הַשָּׁמָיִם
  choice: bagi burung-burung di langit
  rationale: עוֹף bersifat kolektif dan dalam konteks ini paling alami diterjemahkan sebagai 'burung-burung'. הַשָּׁמַיִם secara idiomatis merujuk pada langit tempat burung terbang.
- source_word: בְּשַׂר
  choice: daging
  rationale: Terjemahan harfiah 'daging' mempertahankan gambaran fisik yang keras serta kesejajaran puitis dengan 'mayat'.
- source_word: חֲסִידֶיךָ
  choice: orang-orang yang setia kepada-Mu
  rationale: חסיד menunjuk pada orang yang bercirikan kesetiaan dan pengabdian dalam hubungan perjanjian dengan Allah. Pilihan ini jelas bagi pembaca modern tanpa memasukkan makna teknis gerejawi.
- source_word: לְחַיְתוֹ אָרֶץ
  choice: kepada binatang-binatang liar di bumi
  rationale: חַיְתוֹ־אָרֶץ menunjuk pada binatang darat, dalam konteks ini kemungkinan binatang liar pemakan bangkai. 'Binatang-binatang liar di bumi' alami dan menjaga kontras dengan burung-burung di langit.
theological_decisions:
- issue: Sebutan perjanjian חֲסִידֶיךָ
  choice: orang-orang yang setia kepada-Mu
  alternative: orang-orang kudus-Mu; orang-orang yang mengasihi-Mu dengan setia
  rationale: Istilah ini dapat menonjolkan kesetiaan, pengabdian, atau identitas orang yang berada dalam kasih setia perjanjian. Terjemahan utama mempertahankan unsur kesetiaan tanpa menjadikannya gelar doktrinal yang lebih belakangan; catatan kaki menjaga keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan bermartabat. Citra jasmani yang keras dalam teks Ibrani dipertahankan, tetapi susunan kalimat dibuat alami. Bentuk sapaan ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
