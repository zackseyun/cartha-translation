  yaml_path: translation/ot/psalms/079/003.yaml
  text: They have poured out their blood like water all around Jerusalem[a], and there is no one to bury them.
translation:
  language: id
  text: Mereka menumpahkan darah orang-orang itu seperti air di sekeliling Yerusalem, dan tidak ada seorang pun yang menguburkan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁפְכוּ
  choice: menumpahkan
  rationale: Bentuk Qal perfektif orang ketiga jamak dari שׁפך menyatakan tindakan menumpahkan atau mencurahkan. Dalam konteks darah, “menumpahkan” alami dalam bahasa Indonesia dan tetap mempertahankan gambaran cairan yang diperkuat oleh perbandingan “seperti air”.
- source_word: דָמָם
  choice: darah orang-orang itu
  rationale: Nomina דם dengan sufiks orang ketiga maskulin jamak secara harfiah berarti “darah mereka”. Karena pelaku pada “mereka menumpahkan” berbeda dari para korban yang darahnya ditumpahkan, “darah orang-orang itu” menghindari kerancuan rujukan yang akan timbul jika kedua unsur diterjemahkan “mereka”.
- source_word: כמים
  choice: seperti air
  rationale: Prefiks כ־ menandai perbandingan; “seperti air” merupakan ungkapan Indonesia yang langsung dan mempertahankan perumpamaan sumber.
- source_word: סביבות ירושלים
  choice: di sekeliling Yerusalem
  rationale: סביבות menunjuk pada kawasan yang mengitari suatu tempat. “Di sekeliling Yerusalem” menyampaikan lokasi dan keluasan adegan secara alami.
- source_word: ואין
  choice: dan tidak ada seorang pun
  rationale: אין adalah penyangkalan eksistensial. Susunan ini mempertahankan hubungan koordinatif dengan klausa sebelumnya dan menyatakan ketiadaan siapa pun yang melakukan penguburan.
- source_word: קובר
  choice: yang menguburkan mereka
  rationale: Partisipel קֹבֵר berarti seseorang yang menguburkan. Objek tidak dinyatakan dalam bahasa Ibrani tetapi jelas dari konteks, yaitu orang-orang yang terbunuh; bahasa Indonesia memerlukan objek agar kalimatnya alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. Diksi “menumpahkan” dipilih untuk menjaga citra darah yang tercurah seperti air. Rujukan pronominal diperjelas secukupnya tanpa menambah identitas korban yang tidak disebutkan dalam ayat.
