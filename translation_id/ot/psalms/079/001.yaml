id: PSA.79.1
reference: Psalms 79:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: id
  text: Mazmur Asaf. Ya Allah, bangsa-bangsa telah masuk ke dalam milik pusaka-Mu; mereka telah menajiskan bait-Mu yang kudus; mereka telah menjadikan Yerusalem timbunan puing[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “reruntuhan.”
    reason: Kata Ibrani dapat menunjuk pada timbunan puing atau, secara lebih umum, reruntuhan.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku dan tepat untuk jenis nyanyian dalam judul mazmur.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Bentuk judul “Mazmur Asaf” menyatakan hubungan mazmur ini dengan Asaf tanpa menentukan secara berlebihan apakah ia penulis, pemilik, atau penerimanya.
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Nomina ini berfungsi sebagai sapaan langsung; partikel “Ya” menyatakan fungsi vokatif secara alami dalam bahasa Indonesia.
- source_word: בָּאוּ גוֹיִם
  choice: bangsa-bangsa telah masuk
  rationale: “Bangsa-bangsa” menunjuk pada bangsa-bangsa asing, sedangkan “telah masuk” menyampaikan tindakan yang sudah terjadi dan masih menjadi keadaan yang diratapi.
- source_word: בְּנַחֲלָתֶךָ
  choice: ke dalam milik pusaka-Mu
  rationale: “Milik pusaka” mempertahankan nuansa kepunyaan perjanjian tanpa mempersempit acuannya hanya kepada tanah atau umat.
- source_word: טִמְּאוּ
  choice: telah menajiskan
  rationale: “Menajiskan” mempertahankan makna kenajisan ritual dan tindakan mencemarkan sesuatu yang kudus.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: bait-Mu yang kudus
  rationale: “Bait” menunjuk pada bangunan Bait Allah, dan bentuk ini menyampaikan konstruksi Ibrani secara wajar dalam bahasa Indonesia.
- source_word: שָׂמוּ
  choice: telah menjadikan
  rationale: Dalam konstruksi hasil dengan לְ, verba ini berarti membuat atau mengubah sesuatu menjadi keadaan tertentu.
- source_word: לְעִיִּים
  choice: timbunan-timbunan puing
  rationale: Bentuk jamak menunjuk pada gundukan atau timbunan reruntuhan; pilihan ini mempertahankan gambaran konkret serta kemajemukannya.
theological_decisions:
- issue: Cakupan “milik pusaka-Mu”
  choice: Mempertahankan ungkapan luas “milik pusaka-Mu”
  alternative: tanah-Mu; umat-Mu
  rationale: Teks Ibrani tidak secara eksplisit membatasi milik pusaka Allah pada tanah atau umat. Terjemahan yang luas mempertahankan gaung kepunyaan perjanjian dan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. “Bait” dipertahankan sebagai istilah lazim untuk Bait Allah; pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
