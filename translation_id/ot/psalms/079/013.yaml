  yaml_path: translation/ot/psalms/079/013.yaml
  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: id
  text: Namun kami, umat-Mu dan domba-domba di padang rumput-Mu,[a] akan bersyukur kepada-Mu selama-lamanya; turun-temurun kami akan menceritakan[b] pujian kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kawanan domba di padang rumput-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menyatakan” atau “menuturkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Namun kami
  rationale: Konjungsi yang diikuti kata ganti mandiri menonjolkan umat Allah sebagai kontras dengan bangsa-bangsa dan kehancuran yang disebut sebelumnya; “Namun kami” menyampaikan nuansa itu secara alami.
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: Ungkapan relasional yang lazim bagi Israel sebagai milik Allah; “umat-Mu” alami dan tepat dalam bahasa Indonesia.
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: dan kawanan domba di padang rumput-Mu
  rationale: 'Terjemahan ini mempertahankan gambaran pastoral: umat ialah kawanan domba yang dipelihara Allah di padang rumput-Nya.'
- source_word: נוֹדֶה לְּךָ
  choice: akan bersyukur kepada-Mu
  rationale: Bentuk Hifil dari ידה di sini menyatakan ucapan syukur atau pujian. “Bersyukur” menjaga pembedaan dengan תְּהִלָּתֶךָ pada klausa berikutnya.
- source_word: לְעוֹלָם
  choice: selama-lamanya
  rationale: Ungkapan Indonesia yang alami untuk waktu yang terus berlangsung dalam ikrar syukur ini.
- source_word: לְדֹר וָדֹר
  choice: turun-temurun
  rationale: Idiom ini menyatakan kesinambungan dari satu generasi ke generasi berikutnya; “turun-temurun” ringkas dan lazim.
- source_word: נְסַפֵּר
  choice: kami akan menceritakan
  rationale: Bentuk Piel dari ספר dapat berarti menceritakan, menuturkan, atau menyatakan. “Menceritakan” mempertahankan gagasan menuturkan pujian itu berulang kali kepada generasi berikutnya.
- source_word: תְּהִלָּתֶךָ
  choice: pujian bagi-Mu
  rationale: Nomina ini dapat menunjuk pada pujian yang ditujukan kepada Allah atau hal-hal terpuji tentang Dia. “Pujian bagi-Mu” alami dan tidak mempersempit maknanya menjadi perbuatan tertentu saja.
theological_decisions:
- issue: Metafora pastoral bagi umat perjanjian Allah
  choice: Mempertahankan gambaran secara eksplisit sebagai “kawanan domba di padang rumput-Mu”
  alternative: “kawanan-Mu” atau “domba-domba di padang rumput-Mu”
  rationale: Ayat ini menggambarkan komunitas penyembah sebagai umat milik Allah sekaligus kawanan di bawah pemeliharaan-Nya. Metafora dipertahankan tanpa memasukkan kesimpulan doktrinal yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Paralelisme antara bersyukur dan menceritakan pujian dipertahankan.
