source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: id
  text: 'Mazmur Asaf.


    Ya Allah, bangsa-bangsa telah masuk ke tanah pusaka-Mu;

    mereka telah menajiskan bait-Mu yang kudus;

    mereka telah menjadikan Yerusalem timbunan puing[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: reruntuhan.'
    reason: Menunjukkan padanan ringkas bagi bentuk jamak Ibrani yang secara konkret dapat berarti timbunan-timbunan puing atau reruntuhan.
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Mazmur Asaf
  rationale: Ungkapan judul ini diterjemahkan secara ringkas dan alami; לְ dapat menandai hubungan mazmur ini dengan Asaf tanpa memastikan apakah ia penulis, penerima, atau tokoh yang terkait dengannya.
- source_word: בְּנַחֲלָתֶךָ
  choice: ke tanah pusaka-Mu
  rationale: נַחֲלָה menunjuk pada milik pusaka yang Allah karuniakan dan miliki, dalam konteks ini terutama tanah umat-Nya. Penambahan 'tanah' membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: bait-Mu yang kudus
  rationale: הֵיכָל dalam konteks Yerusalem menunjuk pada bait Allah; konstruksi קָדְשֶׁךָ diungkapkan secara alami sebagai 'yang kudus' tanpa mengurangi hubungan kepemilikan pada akhiran 'Mu'.
- source_word: לְעִיִּים
  choice: timbunan puing
  rationale: Bentuk jamak עִיִּים menggambarkan Yerusalem sebagai tumpukan atau timbunan reruntuhan. 'Timbunan puing' mempertahankan gambaran konkret itu dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Cakupan 'tanah pusaka-Mu'
  choice: Mempertahankan bahwa pusaka itu milik Allah tanpa secara eksplisit menyamakannya hanya dengan tanah, umat, atau bait.
  alternative: Menerjemahkan sebagai 'milik pusaka-Mu' atau secara khusus 'negeri-Mu'.
  rationale: Konteks serbuan ke Yerusalem mendukung rujukan geografis, tetapi bahasa Ibrani tetap sarat makna perjanjian. 'Tanah pusaka-Mu' menjaga kedua unsur tersebut tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Sapaan 'Ya Allah' menyampaikan bentuk vokatif. Paralelisme tiga klausa dipertahankan dengan susunan baris puitis.
