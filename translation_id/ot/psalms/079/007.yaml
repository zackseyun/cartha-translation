  text: כִּ֭י אָכַ֣ל אֶֽת יַעֲקֹ֑ב וְֽ/אֶת נָוֵ֥/הוּ הֵשַֽׁמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/007.yaml
  text: For they have devoured Jacob and laid waste his dwelling place[a].
translation:
  language: id
  text: Sebab mereka telah melahap Yakub dan menghancurkan tempat kediamannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab mereka telah menghabiskan Yakub dan membuat tempat kediamannya menjadi sunyi.”
    reason: Alternatif leksikal yang lebih harfiah bagi אָכַל dan הֵשַׁמּוּ.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi permohonan atau penghukuman dalam konteks sebelumnya, sekaligus wajar dalam puisi Indonesia.
- source_word: אָכַל
  choice: telah melahap
  rationale: Mempertahankan metafora keras dari tindakan memakan atau menghabiskan oleh musuh, dengan daya ungkap lebih kuat daripada sekadar 'menghabiskan'.
- source_word: אֶת יַעֲקֹב
  choice: Yakub
  rationale: Mempertahankan nama puitis-perjanjian dalam teks Ibrani tanpa menafsirkannya secara eksplisit sebagai Israel atau keturunan Yakub.
- source_word: נָוֵהוּ
  choice: tempat kediamannya
  rationale: Mencakup arti tempat tinggal atau hunian dan tidak mempersempit rujukannya hanya kepada Bait Allah.
- source_word: הֵשַׁמּוּ
  choice: menghancurkan
  rationale: Mengungkapkan tindakan kausatif yang menjadikan tempat itu tandus atau rusak sama sekali dalam bahasa Indonesia yang alami dan kuat.
theological_decisions:
- issue: Rujukan akhiran 'miliknya' pada נָוֵהוּ
  choice: Dipahami secara luas sebagai tempat kediaman Yakub/Israel.
  alternative: Bait Allah secara khusus, atau negeri itu secara umum.
  rationale: Akhiran tersebut paling alami merujuk kembali kepada Yakub. Konteks mazmur memungkinkan kaitan dengan tempat kudus, tetapi klausa ini sendiri tidak menuntut pembatasan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang bermartabat. 'Melahap' mempertahankan kekerasan metafora asli; 'tempat kediamannya' menjaga keluasan rujukan.
