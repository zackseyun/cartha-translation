  text: עַד מָ֣ה יְ֭הוָה תֶּאֱנַ֣ף לָ/נֶ֑צַח תִּבְעַ֥ר כְּמוֹ אֵ֝֗שׁ קִנְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
translation:
  language: id
  text: Sampai kapan, ya Yahweh? Apakah Engkau akan murka selamanya? Apakah kecemburuan-Mu[a] akan menyala seperti api?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semangat-Mu.” Kata Ibrani קִנְאָה dapat berarti “kecemburuan” atau “semangat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָה
  choice: Sampai kapan
  rationale: Ungkapan ratapan yang menanyakan lamanya keadaan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan desakan pemazmur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: תֶּאֱנַף
  choice: murka
  rationale: Kata kerja אנף menyatakan kemarahan atau murka. 'Murka' sesuai dengan ragam bahasa ibadah yang tetap jelas bagi pembaca modern.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Dalam pertanyaan ratapan ini, istilah tersebut menyoroti kemungkinan bahwa murka Allah berlangsung tanpa akhir.
- source_word: תִּבְעַר
  choice: menyala
  rationale: Kata בער menggambarkan pembakaran; 'menyala' berpadu alami dengan perumpamaan api tanpa menambahkan gagasan membinasakan.
- source_word: כְּמוֹ אֵשׁ
  choice: seperti api
  rationale: Mempertahankan perumpamaan Ibrani secara langsung dan alami.
- source_word: קִנְאָתֶךָ
  choice: kecemburuan-Mu
  rationale: קִנְאָה dapat berarti kecemburuan atau semangat yang menyala. Dalam konteks murka ilahi, 'kecemburuan-Mu' mempertahankan nuansa relasional-perjanjian, sedangkan alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna קִנְאָה sebagai sifat ilahi
  choice: kecemburuan-Mu
  alternative: semangat-Mu yang menyala
  rationale: Istilah Ibrani mencakup kecemburuan dan semangat yang berkobar. Pilihan utama mempertahankan ketajaman nuansa relasional, sementara catatan kaki menjaga ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'ya Yahweh' dibuat alami dalam seruan langsung; huruf kapital pada pronomina ilahi mengikuti kebiasaan ragam keagamaan Indonesia.
