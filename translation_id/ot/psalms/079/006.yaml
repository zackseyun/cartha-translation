base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: id
  text: Curahkanlah murka-Mu atas bangsa-bangsa yang tidak mengenal Engkau[a], dan atas kerajaan-kerajaan yang tidak menyerukan nama-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang tidak mengakui Engkau.” Kata Ibrani untuk “mengenal” dapat menyiratkan pengenalan dan pengakuan relasional, bukan hanya pengetahuan intelektual.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang tidak memohon dengan menyebut nama-Mu.” Ungkapan Ibrani “menyerukan nama” menunjuk pada permohonan dalam doa atau ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: Curahkanlah
  rationale: Bentuk imperatif ini mempertahankan gambaran murka sebagai sesuatu yang dicurahkan, sekaligus terdengar alami dan khidmat dalam doa bahasa Indonesia.
- source_word: חֲמָתְךָ
  choice: murka-Mu
  rationale: חֵמָה menyatakan amarah yang menyala atau sangat kuat. 'Murka' tepat untuk amarah ilahi dalam ragam Alkitab yang tetap dipahami pembaca modern.
- source_word: אֶל הַגּוֹיִם
  choice: ke atas bangsa-bangsa
  rationale: Dalam konstruksi dengan 'curahkanlah', 'ke atas' menyampaikan sasaran pencurahan dan mempertahankan metafora Ibrani; גּוֹיִם di sini menunjuk bangsa-bangsa asing, tanpa perlu memakai istilah 'orang bukan Yahudi'.
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: yang tidak mengenal Engkau
  rationale: יָדַע dapat mencakup pengenalan relasional dan pengakuan, bukan sekadar pengetahuan intelektual. 'Mengenal Engkau' mempertahankan keluasan makna itu.
- source_word: מַמְלָכוֹת
  choice: kerajaan-kerajaan
  rationale: Padanan langsung yang mempertahankan kesejajaran puitis dengan 'bangsa-bangsa' serta rujukan kepada ranah-ranah politik.
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: yang tidak berseru kepada nama-Mu
  rationale: Ungkapan קרא בשם menunjuk pada seruan doa, permohonan, atau ibadah. 'Berseru kepada nama-Mu' mempertahankan idiom religius itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna 'mengenal' Allah oleh bangsa-bangsa
  choice: yang tidak mengenal Engkau
  alternative: yang tidak mengakui Engkau
  rationale: Teks Ibrani memakai יָדַע, yang dapat menyiratkan pengenalan relasional atau pengakuan. Terjemahan utama mempertahankan keluasan dan ketegangan teologis tersebut tanpa mempersempitnya menjadi pengakuan atau ibadah saja.
- issue: Makna berseru kepada nama Allah
  choice: berseru kepada nama-Mu
  alternative: memanggil nama-Mu; memohon dengan menyebut nama-Mu
  rationale: Ungkapan ini mencakup permohonan penuh doa dan ibadah. Bentuk idiomatis dipertahankan agar maknanya tidak dibatasi hanya pada penyebutan nama secara verbal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Bentuk 'Curahkanlah' cocok untuk permohonan langsung; pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskan.
