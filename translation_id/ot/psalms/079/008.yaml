base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: id
  text: Jangan perhitungkan kepada kami kesalahan-kesalahan terdahulu; kiranya belas kasihan-Mu segera datang menyongsong kami[a], sebab kami telah menjadi sangat lemah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “kesalahan-kesalahan terdahulu” juga dapat berarti “kesalahan nenek moyang kami” atau “kesalahan kami dahulu.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: Jangan perhitungkan terhadap kami
  rationale: Secara harfiah berarti 'jangan mengingat bagi/terhadap kami'. Dalam konteks kesalahan dan penghakiman, 'perhitungkan terhadap kami' menyampaikan daya merugikan yang tersirat secara alami dalam bahasa Indonesia.
- source_word: עֲוֺנֹת
  choice: kesalahan-kesalahan
  rationale: עָוֹן mencakup perbuatan salah sekaligus bobot kesalahan atau kebersalahannya. 'Kesalahan-kesalahan' mempertahankan unsur moral dan bentuk jamaknya tanpa diksi yang terlalu arkais.
- source_word: רִאשֹׁנִים
  choice: pada masa lampau
  rationale: Kata ini berarti 'terdahulu/yang dahulu'. Ungkapan temporal ini tidak memutuskan apakah yang dimaksud adalah kesalahan leluhur atau kesalahan mereka sendiri sebelumnya.
- source_word: מַהֵר
  choice: segera
  rationale: Menyampaikan desakan adverbial dengan bahasa Indonesia modern dan wajar.
- source_word: יְקַדְּמוּנוּ
  choice: datang menyongsong kami
  rationale: Berasal dari קדם, yaitu datang ke depan atau menemui. Pilihan ini mempertahankan gambaran belas kasihan Allah yang segera mencapai mereka.
- source_word: רַחֲמֶיךָ
  choice: belas kasihan-Mu
  rationale: Walaupun bentuk Ibraninya jamak, רַחֲמִים lazim berfungsi sebagai nomina abstrak. Bentuk tunggal kolektif 'belas kasihan' lebih alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi permohonan sebelumnya.
- source_word: דַלּוֹנוּ מְאֹד
  choice: kami telah menjadi sangat lemah
  rationale: Bentuk dari דלל menyatakan keadaan yang telah merosot, menipis kekuatannya, atau menjadi lemah. Terjemahan ini mempertahankan aspek resultatif tanpa memaksakan agen pasif yang tidak dinyatakan.
theological_decisions:
- issue: Rujukan 'kesalahan-kesalahan pada masa lampau'
  choice: Diterjemahkan sebagai ungkapan temporal tanpa menentukan pemilik kesalahan.
  alternative: Kesalahan nenek moyang kami; atau kesalahan kami dahulu.
  rationale: Bahasa Ibrani dapat menunjuk kepada kesalahan generasi terdahulu ataupun kesalahan mereka sendiri sebelumnya. Teks utama dan catatan kaki mempertahankan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Diksi dibuat mudah dipahami tanpa menghilangkan gambaran puitis atau ambiguitas temporal teks Ibrani.
