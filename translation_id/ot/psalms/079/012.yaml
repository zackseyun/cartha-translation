  yaml_path: translation/ot/psalms/079/012.yaml
  text: And repay to our neighbors sevenfold into their lap the reproach with which they reproached you[b][a], O Lord.
translation:
  language: id
  text: Kembalikanlah kepada para tetangga kami, tujuh kali lipat ke pangkuan mereka, celaan yang mereka lontarkan kepada-Mu, ya Tuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "ke pangkuan mereka". Ungkapan Ibrani ini menggambarkan celaan yang mereka tujukan kepada Tuhan kembali menimpa mereka sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָשֵׁב
  choice: Balaskanlah
  rationale: Bentuk imperatif Hifil dari שׁוב menyatakan tindakan membuat sesuatu kembali kepada pelakunya; dalam konteks permohonan penghukuman, 'balaskanlah' menyampaikan makna idiomatisnya secara alami.
- source_word: לִשְׁכֵנֵינוּ
  choice: kepada bangsa-bangsa di sekitar kami
  rationale: Secara leksikal berarti mereka yang tinggal berdekatan. Dalam ratapan nasional ini, yang dimaksud kemungkinan besar ialah bangsa-bangsa sekitar; frasa ini memperjelas acuan tanpa menyebut bangsa tertentu.
- source_word: שִׁבְעָתַיִם
  choice: tujuh kali lipat
  rationale: Bentuk ini berarti 'tujuh kali' atau 'tujuh kali lipat' dan dalam konteks puitis mengungkapkan pembalasan yang penuh atau sangat berat.
- source_word: אֶל חֵיקָם
  choice: ke pangkuan mereka
  rationale: חֵיק secara harfiah menunjuk pangkuan atau dada. Terjemahan ini mempertahankan gambaran Ibrani tentang celaan yang kembali dan diterima oleh pelakunya sendiri.
- source_word: חֶרְפָּתָם
  choice: segala celaan
  rationale: Nomina ini berarti celaan atau penghinaan mereka. 'Segala celaan' terdengar alami dalam bahasa Indonesia dan sesuai dengan klausa relatif yang menerangkan celaan tersebut.
- source_word: אֲשֶׁר חֵרְפוּךָ
  choice: yang mereka lontarkan kepada-Mu
  rationale: Ungkapan ini menyampaikan tindakan mencela Tuhan. Kata 'lontarkan' alami untuk celaan dalam bahasa Indonesia, walaupun hubungan akar kata antara nomina dan verba Ibrani tidak dapat dipertahankan sepenuhnya.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: אֲדֹנָי adalah sapaan ilahi 'Tuhan'; partikel 'ya' menandai sapaan langsung secara wajar dalam doa bahasa Indonesia.
theological_decisions:
- issue: Permohonan pembalasan dan kadar keliteralannya
  choice: Mempertahankan permohonan langsung agar Tuhan membalas tujuh kali lipat.
  alternative: Menghaluskannya menjadi permohonan umum agar Tuhan menegakkan keadilan.
  rationale: Teks Ibrani merupakan permohonan kutukan yang tegas. Terjemahan tidak mengurangi ketegangannya menjadi gagasan keadilan yang abstrak, tetapi tetap menempatkan tindakan pembalasan di tangan Tuhan.
translation_notes:
  register: Bahasa puitis-doawi yang modern dan bermartabat. 'Bangsa-bangsa di sekitar kami' mengikuti konteks ratapan nasional, sedangkan 'ke pangkuan mereka' sengaja mempertahankan metafora Ibrani. Penanda catatan kaki [a] ditempatkan dalam teks utama.
