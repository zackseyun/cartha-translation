  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
translation:
  language: id
  text: Kiranya Dia mengingat segala persembahanmu[a] dan menerima[b] kurban bakaranmu. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala persembahan sajianmu”; kata Ibrani minḥah dapat secara khusus berarti persembahan sajian, atau secara lebih luas berarti persembahan atau pemberian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membuat gemuk” atau “menganggap berlimpah”; ungkapan ini berarti menerima kurban itu dengan perkenanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכֹּר
  choice: Kiranya Dia mengingat
  rationale: Bentuk imperfek Qal orang ketiga maskulin tunggal berfungsi sebagai permohonan atau harapan dalam rumusan berkat; “kiranya” menyampaikan nuansa ini secara alami.
- source_word: כָּל
  choice: segala
  rationale: Mempertahankan cakupan menyeluruh dari kata Ibrani tanpa penambahan yang tidak perlu.
- source_word: מִנְחֹתֶךָ
  choice: persembahanmu
  rationale: מִנְחָה dapat berarti pemberian atau persembahan secara umum, dan dapat pula secara khusus menunjuk persembahan sajian; pilihan umum dipertahankan dalam teks, sedangkan arti khusus dicatat dalam catatan kaki.
- source_word: וְעוֹלָתְךָ
  choice: dan kurban bakaranmu
  rationale: עוֹלָה adalah istilah baku untuk kurban yang dibakar seluruhnya; “kurban bakaran” merupakan ungkapan kultis yang jelas dan lazim dalam bahasa Indonesia.
- source_word: יְדַשְּׁנֶה
  choice: menerima
  rationale: Bentuk Piel dari דשן secara harfiah berkaitan dengan kegemukan atau kelimpahan, tetapi dalam konteks kurban menjadi ungkapan idiomatis bagi penerimaan dengan perkenanan.
- source_word: סֶלָה
  choice: Sela
  rationale: Transliterasi dipertahankan karena fungsi tepat istilah ini tidak pasti; menerjemahkannya secara spesifik akan melampaui kepastian bukti.
theological_decisions:
- issue: Subjek tersirat dari kata kerja orang ketiga maskulin tunggal
  choice: 'Subjek ilahi dinyatakan dengan “Dia” dalam doa: “Kiranya Dia mengingat ... dan menerima ....”'
  alternative: Membiarkan pelaku ilahi sepenuhnya tersirat
  rationale: Dalam konteks Mazmur 20, umat memohon perkenanan Allah bagi raja. Bahasa Ibrani tidak menyebut subjek secara eksplisit pada ayat ini, tetapi konteks mengidentifikasinya sebagai Allah; penyebutan pronomina membuat bahasa Indonesia alami tanpa menambahkan klaim teologis baru.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan mudah dipahami. “Kiranya” mempertahankan bentuk permohonan, “kurban” mengikuti ejaan baku, dan “Sela” mempertahankan ketidakpastian istilah sumber. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
