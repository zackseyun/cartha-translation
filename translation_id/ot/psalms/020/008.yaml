  text: Mereka tertekuk lutut dan jatuh, tetapi kita bangkit dan berdiri tegak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, untuk kata kerja terakhir: “menegakkan diri”, “menjadi teguh”, atau “berdiri kokoh”.'
