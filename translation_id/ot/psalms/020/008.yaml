  verdict: revise
  source_fidelity: Klausa kedua secara tepat mempertahankan kontras kuat antara mereka dan kita, serta urutan ‘bangkit’ dan ‘berdiri tegak’. Namun, ‘tersungkur’ biasanya sudah menyatakan tindakan jatuh atau terhempas ke depan dalam bahasa Indonesia, sehingga pasangan ‘tersungkur dan jatuh’ cenderung bertumpang tindih dan kurang jelas merepresentasikan dua verba Ibrani, כָּרְעוּ (‘lutut tertekuk/merunduk’) dan נָפָלוּ (‘jatuh’).
  naturalness: ‘Mereka tertekuk lutut dan jatuh’ adalah ungkapan modern yang alami dalam konteks kekalahan atau keruntuhan. Ungkapan ini mempertahankan gerak fisik yang dibedakan dalam teks tanpa memberi kesan bahwa mereka sekadar sengaja bersujud.
  terminology: ‘Bangkit dan berdiri tegak’ cocok dengan קַמְנוּ וַנִּתְעוֹדָד dan mempertahankan citra pemulihan. Catatan kaki perlu menyajikan alternatif untuk verba terakhir sebagai kemungkinan leksikal, dengan bentuk Indonesia yang tidak secara tidak perlu mengubah nuansa refleksifnya menjadi pasif.
  issues:
  - severity: medium
    issue: ‘Tersungkur dan jatuh’ menumpangtindihkan dua tindakan.
    rationale: ‘Tersungkur’ dalam pemakaian Indonesia lazim sudah berarti jatuh atau terhempas (sering dengan posisi muka ke bawah), sedangkan Ibrani membedakan ‘lutut tertekuk/merunduk’ dari ‘jatuh’. ‘Tertekuk lutut dan jatuh’ lebih jelas menjaga paralelisme verba.
  - severity: low
    issue: Alternatif ‘dikuatkan’ pada catatan kaki berpotensi terdengar pasif.
    rationale: Verba Ibrani terakhir berbentuk refleksif dan dapat menyatakan menegakkan atau menguatkan diri. Alternatif yang lebih netral dan dekat dengan gambaran konteks ialah ‘menegakkan diri’.
  revised_text: Mereka tertekuk lutut dan jatuh, tetapi kita bangkit dan berdiri tegak.[a]
