lexical_decisions:
- source_word: הֵמָּה
  choice: Mereka
  rationale: Pronomina mandiri orang ketiga jamak memberi penekanan dan membentuk kontras dengan וַאֲנַחְנוּ, “kita”; dalam bahasa Indonesia, kontras itu tersampaikan secara alami melalui susunan kedua klausa.
- source_word: כָּרְעוּ
  choice: tersungkur
  rationale: Kata kerja ini menggambarkan lutut yang menekuk atau tubuh yang merendah. Dalam konteks kekalahan dan dalam pasangan dengan “jatuh”, “tersungkur” mempertahankan gambaran fisiknya secara wajar.
- source_word: וְנָפָלוּ
  choice: dan jatuh
  rationale: Terjemahan langsung ini mempertahankan koordinasi serta paralelisme puitis dengan tindakan tersungkur.
- source_word: וַאֲנַחְנוּ
  choice: tetapi kita
  rationale: Walaupun konjungsinya secara bentuk berarti “dan”, pertentangan antara “mereka” dan “kita” kuat; “tetapi” menyampaikan fungsi adversatif itu dengan alami.
- source_word: קַּמְנוּ
  choice: bangkit
  rationale: קום berarti bangkit atau berdiri. “Bangkit” membentuk kontras yang jelas dengan “jatuh” dan mengantar secara alami kepada tindakan berdiri tegak.
- source_word: וַנִּתְעוֹדָד
  choice: dan berdiri tegak
  rationale: Bentuk refleksif dari עודד dapat menyatakan memulihkan atau menguatkan diri dan kembali berdiri tegak. Pilihan ini mempertahankan citra pemulihan fisik setelah bangkit, sementara nuansa alternatif dicatat dalam catatan kaki.
