id: PSA.20.5
reference: Psalms 20:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נְרַנְּנָ֤ה בִּ֘/ישׁ֤וּעָתֶ֗/ךָ וּ/בְ/שֵֽׁם אֱלֹהֵ֥י/נוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל מִשְׁאֲלוֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: id
  text: Kami akan bersorak gembira atas keselamatanmu[a], dan dalam nama Allah kita, kami akan mengibarkan panji-panji[b]. Kiranya Yahweh memenuhi segala permintaanmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemenanganmu” atau “pembebasanmu.” Istilah Ibrani ini dapat menunjuk pada keselamatan dalam arti luas, termasuk pembebasan atau kemenangan militer.
    reason: lexical_alternative
  - marker: b
    text: Atau “kami akan mendirikan panji kami.” Kata kerja Ibrani ini kemungkinan menggambarkan tindakan mengangkat atau menampilkan panji dalam perayaan.
    reason: lexical_alternative
  - marker: c
    text: Atau “Yahweh akan memenuhi segala permintaanmu.” Bentuk Ibraninya dapat dipahami sebagai harapan atau doa maupun sebagai pernyataan masa depan, meskipun makna doa cocok dengan konteksnya.
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: kami akan bersorak gembira
  rationale: Bentuk dari רנן menyatakan luapan sukacita yang terdengar. Pilihan ini mempertahankan daya perayaan tanpa mempersempitnya menjadi nyanyian.
- source_word: בִּישׁוּעָתֶךָ
  choice: atas keselamatanmu
  rationale: יְשׁוּעָה mencakup keselamatan, pembebasan, dan kemenangan. 'Keselamatanmu' mempertahankan keluasan maknanya, sedangkan 'atas' menyampaikan alasan atau dasar sukacita secara alami dalam bahasa Indonesia.
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: dan dalam nama Allah kita
  rationale: Ungkapan ini mempertahankan idiom Ibrani tentang bertindak dan bermegah di bawah nama, kewenangan, dan identitas Allah.
- source_word: נִדְגֹּל
  choice: kami akan mengibarkan panji-panji
  rationale: Kata kerja דגל kemungkinan menggambarkan tindakan menampilkan atau meninggikan panji sebagai tanda perayaan. 'Mengibarkan panji-panji' jelas dan wajar dalam bahasa Indonesia.
- source_word: יְמַלֵּא
  choice: kiranya ... memenuhi
  rationale: Walaupun bentuknya imperfek, dalam konteks doa liturgis ini paling wajar dipahami sebagai harapan atau permohonan, bukan semata-mata pernyataan masa depan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan melalui transliterasi untuk mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: segala permintaanmu
  rationale: מִשְׁאֲלוֹת menunjuk pada hal-hal yang diminta. 'Segala permintaanmu' jelas, modern, dan sesuai dengan konteks doa.
theological_decisions:
- issue: Makna יְשׁוּעָה dalam mazmur kerajaan yang berlatar konflik
  choice: keselamatan
  alternative: kemenangan; pembebasan
  rationale: Konteks memungkinkan arti kemenangan militer, tetapi 'keselamatan' mempertahankan jangkauan semantis dan bobot teologis kata Ibrani tanpa meniadakan arti kemenangan atau pembebasan.
- issue: Daya bentuk imperfek יְמַלֵּא pada klausa terakhir
  choice: 'harapan atau doa: ''Kiranya Yahweh memenuhi'''
  alternative: 'pernyataan masa depan: ''Yahweh akan memenuhi'''
  rationale: Nada permohonan dalam mazmur ini mendukung pembacaan jusif, tetapi bentuk Ibraninya juga dapat dipahami sebagai pernyataan tentang masa depan; ketaksaan itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang tetap mudah dipahami. Pengulangan 'kami' mempertahankan subjek komunal pada kedua baris, sedangkan 'panji-panji' menjaga citra perayaan kerajaan atau militer.
