  text: יִֽתֶּן לְ/ךָ֥ כִ/לְבָבֶ֑/ךָ וְֽ/כָל עֲצָתְ/ךָ֥ יְמַלֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/004.yaml
  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: id
  text: Kiranya Ia mengabulkan keinginan hatimu dan memenuhi segala rencanamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: segala pertimbanganmu.'
    reason: עֵצָה dapat berarti rencana, pertimbangan, nasihat, atau maksud; dalam konteks ini “rencana” dipilih sebagai ungkapan utama yang paling alami.
lexical_decisions:
- source_word: יִתֶּן
  choice: Kiranya Dia mengaruniakan
  rationale: Bentuk yiqtol dalam rangkaian doa dan berkat Mazmur 20 paling wajar dipahami sebagai harapan atau permohonan. “Mengaruniakan” menyampaikan tindakan memberi dalam konteks permohonan tanpa mengubahnya menjadi pernyataan masa depan.
- source_word: לְךָ
  choice: kepadamu
  rationale: Menerjemahkan objek tak langsung secara langsung dan alami dalam bahasa Indonesia.
- source_word: כִלְבָבֶךָ
  choice: apa yang sesuai dengan isi hatimu
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang hati sebagai pusat keinginan, kehendak, dan niat. Kata “apa” ditambahkan secara idiomatis agar hubungan dengan verba “mengaruniakan” jelas dalam bahasa Indonesia.
- source_word: וְכָל
  choice: dan segala
  rationale: Menyampaikan cakupan menyeluruh dari וְכָל secara alami sebelum nomina kolektif.
- source_word: עֲצָתְךָ
  choice: rencanamu
  rationale: Dalam konteks doa bagi raja, עֵצָה dapat menunjuk pada rencana atau rancangan yang lahir dari pertimbangan. “Rencanamu” paling jelas bagi pembaca modern, sedangkan nuansa pertimbangan dipertahankan dalam catatan kaki.
- source_word: יְמַלֵּא
  choice: memenuhi
  rationale: Bentuk Piel dari מלא di sini berarti membawa sesuatu kepada pelaksanaan atau penggenapan penuh. “Memenuhi” sesuai dengan konteks doa agar rencana terlaksana.
theological_decisions:
- issue: Daya verbal dalam konteks berkat atau doa
  choice: 'Kedua verba diterjemahkan sebagai permohonan: “Kiranya Dia mengaruniakan ... dan memenuhi ...”'
  alternative: “Dia akan mengaruniakan ... dan memenuhi ...”
  rationale: Walaupun bentuk Ibraninya adalah yiqtol, konteks rangkaian permohonan dalam Mazmur 20 mendukung daya jusif atau harapan, bukan sekadar ramalan.
- issue: Makna “hati”
  choice: Mempertahankan “isi hatimu” sebagai ungkapan bagi keinginan, kehendak, atau niat batin
  alternative: Mengkhususkan maknanya menjadi “keinginanmu” atau “kehendakmu”
  rationale: Teks Ibrani memakai לֵבָב. Mempertahankan metafora hati menghindari pembatasan makna hanya pada emosi, pikiran, atau kemauan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. “Dia” mengacu kepada TUHAN dari konteks ayat-ayat sekitar. Susunan kalimat dibuat alami tanpa menghilangkan metafora Ibrani tentang hati.
