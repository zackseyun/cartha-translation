  yaml_path: translation/ot/psalms/020/000.yaml
  text: For the choirmaster. A psalm of David[a].
translation:
  language: id
  text: Untuk pemimpin musik. Mazmur Daud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur oleh Daud” atau “mazmur untuk Daud”; judul Ibrani dapat menunjukkan kepengarangan, kaitan, kepemilikan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, istilah ini berfungsi sebagai petunjuk bagi orang yang memimpin atau mengawasi pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia modern dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Kata ini menunjuk pada nyanyian yang diiringi musik dan, dalam konteks kitab ini, paling tepat diterjemahkan dengan istilah baku 'mazmur'.
- source_word: לְדָוִד
  choice: Daud
  rationale: Susunan 'Mazmur Daud' mempertahankan keluwesan hubungan yang dinyatakan oleh לְ, yang dapat menunjuk pada kepengarangan, kaitan, kepemilikan, atau peruntukan, tanpa memaksakan satu tafsiran.
theological_decisions:
- issue: Makna keterangan yang mengaitkan mazmur dengan Daud
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud; mazmur untuk Daud
  rationale: Kata depan Ibrani לְ tidak dengan sendirinya memastikan apakah Daud adalah pengarang, tokoh yang dikaitkan dengan mazmur, atau penerimanya. Teks utama mempertahankan ambiguitas itu, sedangkan kemungkinan yang lebih khusus dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk judul mazmur. 'Pemimpin musik' dipilih sebagai ungkapan modern yang mudah dipahami; penanda catatan kaki ditempatkan tepat sesudah 'Daud' karena catatan menjelaskan לְדָוִד.
