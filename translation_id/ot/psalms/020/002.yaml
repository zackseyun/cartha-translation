  text: יִשְׁלַֽח עֶזְרְ/ךָ֥ מִ/קֹּ֑דֶשׁ וּ֝/מִ/צִּיּ֗וֹן יִסְעָדֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/002.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: id
  text: Kiranya Ia mengirimkan pertolongan kepadamu dari tempat kudus[a] dan menopangmu[b] dari Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kekudusan” atau “dari tempat yang kudus”; di sini kemungkinan menunjuk pada tempat kudus Allah.
    reason: lexical_alternative
  - marker: b
    text: “Menopangmu” juga dapat diterjemahkan “mendukungmu” atau “menguatkanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Kiranya Ia mengirimkan
  rationale: Bentuk imperfek Qal orang ketiga tunggal maskulin dipahami sebagai harapan atau permohonan dalam konteks berkat dan doa mazmur ini, bukan sekadar pernyataan masa depan.
- source_word: עֶזְרְךָ
  choice: pertolongan kepadamu
  rationale: Nomina עֵזֶר dengan sufiks orang kedua tunggal maskulin secara harfiah dapat berarti 'pertolonganmu' atau 'pertolongan bagimu'; ungkapan 'mengirimkan pertolongan kepadamu' lebih alami dalam bahasa Indonesia dan mempertahankan penerimanya.
- source_word: מִקֹּדֶשׁ
  choice: dari tempat kudus
  rationale: קֹדֶשׁ dapat berarti kekudusan secara abstrak atau tempat yang kudus. Kesejajarannya dengan 'dari Sion' mendukung pengertian lokatif, tetapi terjemahan 'tempat kudus' tetap lebih dekat pada keluasan istilah Ibrani daripada mempersempitnya menjadi bangunan tertentu.
- source_word: וּמִצִּיּוֹן
  choice: dan ... dari Sion
  rationale: Kata sambung menghubungkan dua klausa sejajar, sedangkan nama tempat צִיּוֹן dipertahankan sebagai 'Sion'.
- source_word: יִסְעָדֶךָּ
  choice: menopangmu
  rationale: Bentuk imperfek Qal dari סעד dengan sufiks orang kedua tunggal maskulin bermakna menopang, mendukung, atau menguatkan. 'Menopangmu' alami, puitis, dan mempertahankan gambaran pemberian dukungan; dalam konteks ini verba turut berada di bawah nuansa harapan 'kiranya'.
theological_decisions:
- issue: Rujukan subjek tersirat
  choice: Menggunakan pronomina 'Ia', dengan rujukan yang dipahami dari konteks sebelumnya
  alternative: Menambahkan 'TUHAN' secara eksplisit
  rationale: Teks Ibrani ayat ini hanya memuat verba orang ketiga tunggal maskulin tanpa subjek eksplisit. Pronomina mempertahankan kesinambungan konteks tanpa menambahkan nama ilahi yang tidak tertulis dalam baris ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak doa yang khidmat dan puitis. 'Kiranya' menyatakan harapan untuk kedua verba sejajar. Kapitalisasi 'Ia' menandai rujukan kepada Allah menurut kebiasaan umum bahasa Indonesia, tanpa memasukkan nama ilahi ke dalam teks.
