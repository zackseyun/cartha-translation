translation:
  language: id
  text: Ada yang mengandalkan kereta dan ada yang mengandalkan kuda, tetapi kami menyebut nama TUHAN, Allah kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengingat nama TUHAN” atau “menyerukan nama TUHAN.” Dalam konteks ini juga dapat bernuansa “bermegah dalam nama TUHAN.”'
    reason: Menandai rentang makna נַזְכִּיר tanpa menentukan secara berlebihan apakah tindakan itu mengingat, menyebut, menyerukan, atau bermegah.
lexical_decisions:
- source_word: אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים
  choice: Ada yang mengandalkan kereta dan ada yang mengandalkan kuda
  rationale: Teks Ibrani secara harfiah berbunyi ‘yang ini dengan/pada kereta dan yang itu dengan/pada kuda’, dengan verba yang dilesapkan. ‘Mengandalkan’ menyatakan kontras kepercayaan yang tersirat tanpa membuat kalimat Indonesia terasa terpotong.
- source_word: נַזְכִּיר
  choice: kami mengingat
  rationale: Bentuk hifil dari זכר dapat berarti mengingat, menyebut, atau mempermaklumkan. ‘Mengingat’ mempertahankan hubungan paling langsung dengan akar katanya serta kontras antara sandaran bangsa-bangsa dan orientasi umat kepada Allah.
- source_word: בְּשֵׁם יְהוָה
  choice: nama TUHAN
  rationale: Preposisi בְּ diungkapkan secara alami melalui konstruksi ‘mengingat nama’. Nama perjanjian יהוה diterjemahkan ‘TUHAN’ menurut konvensi Alkitab bahasa Indonesia yang luas dikenal.
theological_decisions:
- issue: Makna tindakan umat dalam נַזְכִּיר
  choice: mengingat nama TUHAN
  alternative: menyebut/menyerukan nama TUHAN; bermegah dalam nama TUHAN
  rationale: Bahasa sumber memungkinkan nuansa mengingat, menyebut, atau memanggil nama ilahi. Teks utama mempertahankan makna dasar tanpa menyempitkannya menjadi tindakan doa tertentu atau menambahkan gagasan ‘bermegah’ yang terutama berasal dari kontras konteks.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis. Pengulangan ‘ada yang mengandalkan’ mempertahankan kesejajaran Ibrani, sedangkan ‘TUHAN’ memakai kapital untuk יהוה.
