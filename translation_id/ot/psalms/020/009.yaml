  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: id
  text: Ya, Yahweh[a], selamatkanlah! Kiranya raja menjawab kami pada hari kami berseru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ya, Yahweh, selamatkanlah raja; jawablah kami pada hari kami berseru,” atau mungkin, “Ya, Yahweh, selamatkanlah! Sang Raja menjawab kami pada hari kami berseru.” Susunan kalimat Ibrani sangat padat dan memungkinkan lebih dari satu pemahaman tentang “raja”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”; partikel “Ya” menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: הוֹשִׁיעָה
  choice: selamatkanlah!
  rationale: Bentuk imperatif dari ישׁע diterjemahkan sebagai permohonan langsung yang mencakup pembebasan maupun kemenangan tanpa mempersempit maknanya.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina umum berartikel ini secara harfiah berarti “raja”. Huruf kecil tidak memaksakan identifikasi dengan Allah dan sesuai dengan latar mazmur kerajaan, sementara kemungkinan tafsiran lain dicatat dalam catatan kaki.
- source_word: יַעֲנֵנוּ
  choice: Kiranya ... menjawab kami
  rationale: Bentuk imperfek dalam konteks doa dapat menyatakan harapan atau permohonan; “kiranya” mempertahankan nuansa tersebut.
- source_word: בְיוֹם
  choice: pada hari
  rationale: Ungkapan temporal Ibrani dipertahankan secara cukup dekat dan tetap dapat dipahami dalam bahasa Indonesia puitis.
- source_word: קָרְאֵנוּ
  choice: kami berseru
  rationale: קרא berarti memanggil atau berseru. Dalam konteks doa, “berseru” alami dan tidak memerlukan objek eksplisit.
theological_decisions:
- issue: Acuan dan fungsi sintaksis “raja”
  choice: Teks utama memahami “raja” sebagai subjek dari “menjawab kami”, terutama merujuk kepada raja manusia dalam latar mazmur kerajaan.
  alternative: 'Frasa itu dapat dipahami sebagai “Ya Yahweh, selamatkanlah raja; jawablah kami pada hari kami berseru,” atau sebagai sebutan bagi Allah: “Ya Yahweh, selamatkanlah! Sang Raja menjawab kami pada hari kami berseru.”'
  rationale: Sintaksis Ibrani sangat padat, dan hubungan הַמֶּלֶךְ dengan kata kerja di sekitarnya tidak sepenuhnya tegas. Latar mazmur mendukung raja manusia, tetapi kemungkinan lain sungguh terdapat dalam teks dan karena itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan puitis. “Pada hari kami berseru” mempertahankan idiom sumber, sedangkan huruf kecil pada “raja” menjaga agar identitas acuannya tidak diputuskan secara dogmatis dalam teks utama.
