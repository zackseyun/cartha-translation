id: PSA.20.1
reference: Psalms 20:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: id
  text: Kiranya Yahweh menjawabmu pada hari kesesakan; kiranya nama Allah Yakub melindungimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menempatkanmu dengan aman di tempat tinggi”; kata Ibrani ini menggambarkan seseorang yang ditempatkan di luar jangkauan bahaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: Kiranya ... menjawabmu
  rationale: Kata kerja ענה berarti “menjawab” atau “menanggapi.” Dalam konteks doa berkat ini, “kiranya” menyampaikan nuansa permohonan atau harapan dari bentuk verba Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: בְּיוֹם צָרָה
  choice: pada hari kesesakan
  rationale: Ungkapan temporal ini mempertahankan citra harfiah “hari” dan memakai “kesesakan” untuk צָרָה, yaitu keadaan tertekan, susah, atau terancam.
- source_word: יְשַׂגֶּבְךָ
  choice: melindungimu
  rationale: Dalam bentuk Piel, שׂגב menggambarkan penempatan seseorang di tempat tinggi yang tidak terjangkau, dan dengan demikian aman. “Melindungimu” menyampaikan fungsi idiomatisnya secara alami; citra tempat tinggi dipertahankan dalam catatan kaki.
- source_word: שֵׁם
  choice: nama
  rationale: Terjemahan langsung “nama” mempertahankan bahasa puitis dan makna teologisnya, yang dapat mencakup kewibawaan, reputasi, dan kehadiran yang diserukan tanpa membatasi maknanya pada salah satu unsur itu.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Allah Yakub
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan historis serta perjanjian yang terkandung dalam ungkapan Ibrani “Allah dari Yakub.”
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Daya verba dalam konteks doa berkat
  choice: Diterjemahkan sebagai harapan atau permohonan dengan “kiranya”
  alternative: 'Pernyataan masa depan: “Yahweh akan menjawabmu ... nama Allah Yakub akan melindungimu”'
  rationale: Konteks mazmur ini mendukung daya optatif atau jusif. “Kiranya” mempertahankan nada liturgis sebagai doa berkat tanpa mengubahnya menjadi ramalan pasti.
- issue: “Nama Allah Yakub” sebagai pelaku perlindungan
  choice: Mempertahankan “nama” sebagai subjek
  alternative: Allah Yakub melindungimu
  rationale: Teks Ibrani secara khusus menjadikan “nama” sebagai subjek. Mempertahankannya menjaga ungkapan puitis dan kemungkinan nuansa kewibawaan, reputasi, serta kehadiran ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa puitis. Bentuk enklitik “-mu” membuat kedua baris ringkas dan alami. “Kesesakan” dipilih untuk mempertahankan bobot puitis צָרָה, sedangkan metafora tempat tinggi pada שׂגב dijelaskan dalam catatan kaki agar teks utama tetap lancar.
