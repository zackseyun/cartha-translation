  text: עַתָּ֤ה יָדַ֗עְתִּי כִּ֤י הוֹשִׁ֥יעַ יְהוָ֗ה מְשִׁ֫יח֥/וֹ יַ֭עֲנֵ/הוּ מִ/שְּׁמֵ֣י קָדְשׁ֑/וֹ בִּ֝/גְבֻר֗וֹת יֵ֣שַׁע יְמִינֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: id
  text: Sekarang aku tahu bahwa TUHAN menyelamatkan orang yang diurapi-Nya. Ia akan menjawabnya dari surga-Nya yang kudus dengan tindakan-tindakan penyelamatan yang perkasa oleh tangan kanan-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Kata ini secara eksplisit menandai keadaan atau kesadaran pada saat kini dan patut dipertahankan.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama perjanjian ilahi, dengan huruf kapital.
- source_word: מְשִׁיחוֹ
  choice: orang yang diurapi-Nya
  rationale: Dalam konteks mazmur kerajaan, istilah ini menunjuk kepada raja yang diurapi TUHAN; terjemahan deskriptif mempertahankan makna dasarnya tanpa secara otomatis menjadikannya gelar khusus.
- source_word: יַעֲנֵהוּ
  choice: Ia akan menjawabnya
  rationale: Bentuk imperfek paling wajar menyatakan jawaban yang diyakini akan diberikan, selaras dengan peralihan dari pengakuan pengetahuan kepada harapan pasti.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: dengan perbuatan-perbuatan perkasa tangan kanan-Nya yang membawa keselamatan
  rationale: גְבֻרוֹת berbentuk jamak dan dapat menunjuk pada tindakan-tindakan atau manifestasi keperkasaan; frasa ini mempertahankan citra tangan kanan sebagai kuasa yang bertindak dan menghasilkan keselamatan.
theological_decisions:
- issue: Aspek verba הוֹשִׁיעַ dalam pernyataan keyakinan
  choice: menyelamatkan
  alternative: telah menyelamatkan / akan menyelamatkan
  rationale: Perfek Ibrani dapat menggambarkan tindakan yang telah terjadi atau kepastian tindakan ilahi. Bentuk kini bahasa Indonesia mempertahankan pernyataan umum dan penuh keyakinan tanpa memaksakan waktu lampau atau masa depan.
- issue: Identitas מְשִׁיחוֹ
  choice: orang yang diurapi-Nya
  alternative: Yang Diurapi-Nya / Mesias-Nya
  rationale: Konteks langsung adalah mazmur kerajaan dan kemungkinan besar merujuk kepada raja. Huruf kecil dan ungkapan deskriptif menjaga cakupan historis teks serta tidak menutup pembacaan mesianik yang lebih luas.
- issue: Subjek klausa יַעֲנֵהוּ
  choice: TUHAN, dinyatakan dengan kata ganti Ia
  alternative: surga-Nya atau tangan kanan-Nya sebagai subjek tersirat
  rationale: Kesinambungan sintaksis paling alami mempertahankan YHWH sebagai subjek yang menjawab orang yang diurapi-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme puitis dipertahankan dalam dua kalimat; bentuk “perbuatan-perbuatan perkasa” menjaga unsur jamak Ibrani, sedangkan “tangan kanan-Nya” mempertahankan metafora kuasa ilahi.
