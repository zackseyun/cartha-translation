    rationale: The source phrase בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ denotes mighty saving acts associated with YHWH’s right hand. Recasting it as acts of salvation performed by his right hand is clearer in Indonesian while retaining its plurality and imagery.
