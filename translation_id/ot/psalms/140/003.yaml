    text: “Sela” kemungkinan merupakan petunjuk liturgis atau musikal; makna tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: שָֽׁנֲנוּ
  choice: menajamkan
  rationale: Bentuk Piel dari שׁנן berarti ‘menajamkan’ atau ‘mengasah’. Pilihan ini mempertahankan gambaran metaforis tentang ucapan yang dibuat berbahaya dan melukai.
- source_word: לְשׁוֹנָם
  choice: lidah mereka
  rationale: Nomina Ibrani berbentuk tunggal dengan akhiran orang ketiga jamak. Bahasa Indonesia dapat mempertahankan bentuk tunggal kolektif ini secara alami.
- source_word: כְּמוֹ נָחָשׁ
  choice: seperti ular
  rationale: נָחָשׁ berarti ular. ‘Ular’ merupakan padanan modern yang alami dan tidak menambahkan asosiasi yang tidak dituntut oleh konteks.
- source_word: חֲמַת
  choice: bisa
  rationale: Dalam hubungan dengan ular, חֵמָה menunjuk pada racun atau bisa, bukan murka. ‘Bisa’ adalah istilah Indonesia yang paling tepat bagi racun ular.
- source_word: עַכְשׁוּב
  choice: ular berbisa
  rationale: Kata ini menunjuk pada sejenis ular berbisa, tetapi spesies tepatnya tidak pasti. Padanan generik ini menyampaikan makna pokok tanpa ketepatan zoologis yang tidak didukung teks.
- source_word: תַּחַת שְׂפָתֵימוֹ
  choice: ada di bawah bibir mereka
  rationale: תַּחַת berarti ‘di bawah’. Kata ‘ada’ melengkapi klausa nominal secara alami dan mempertahankan gambaran tentang ucapan mematikan yang tersembunyi.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak diketahui, mungkin suatu petunjuk liturgis atau musikal. Karena itu, istilah tersebut dialihaksarakan dan tidak ditafsirkan di dalam teks.
