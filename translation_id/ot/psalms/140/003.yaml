translation:
  language: id
  text: Mereka menajamkan lidah mereka seperti ular; bisa dari ular berbisa[a] ada di bawah bibir mereka. Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai menunjuk pada ular berbisa, tetapi spesies tepatnya tidak diketahui.
    reason: lexical_alternative
