  text: יְהֹוִ֣ה אֲ֭דֹנָ/י עֹ֣ז יְשׁוּעָתִ֑/י סַכֹּ֥תָה לְ֝/רֹאשִׁ֗/י בְּ/י֣וֹם נָֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/007.yaml
  text: O Yahweh[a], my Lord, the strength of my salvation, you have covered my head in the day of battle.
translation:
  language: id
  text: Ya Yahweh, Tuhanku, kekuatan keselamatanku, Engkau telah menaungi kepalaku pada hari pertempuran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada hari senjata,” yakni pada waktu konflik bersenjata. Kata Ibrani yang digunakan dapat berarti “senjata” atau “persenjataan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוִה
  choice: Yahweh
  rationale: Menerjemahkan nama ilahi YHWH sebagai nama diri “Yahweh”, dengan “Ya” untuk menandai sapaan langsung dalam doa.
- source_word: אֲדֹנָי
  choice: Tuhanku
  rationale: Bentuk ini menyertakan akhiran orang pertama tunggal, sehingga berarti “Tuhanku”; pilihan ini juga membedakannya dari nama Yahweh yang mendahuluinya.
- source_word: עֹז יְשׁוּעָתִי
  choice: kekuatan keselamatanku
  rationale: Mempertahankan hubungan genitif dalam bahasa Ibrani dan ungkapan puitis bahwa Tuhan adalah kekuatan dari keselamatan pemazmur.
- source_word: סַכֹּתָה
  choice: Engkau telah menaungi
  rationale: Kata kerja סכך dapat berarti menutupi, menaungi, atau melindungi. “Menaungi” mempertahankan gambaran konkret sekaligus menyampaikan perlindungan; bentuk perfektif diterjemahkan dengan “telah”.
- source_word: לְרֹאשִׁי
  choice: kepalaku
  rationale: Dalam konstruksi dengan “menaungi”, “kepalaku” merupakan ungkapan Indonesia yang alami dan mempertahankan gambaran perlindungan atas bagian tubuh yang rentan.
- source_word: בְּיוֹם נָשֶׁק
  choice: pada hari pertempuran
  rationale: Secara idiomatis menunjuk pada waktu konflik bersenjata. “Pertempuran” menyampaikan maksud konteks dengan jelas, sementara arti harfiah yang berkaitan dengan senjata dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan kekhususan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Hubungan עֹז dengan יְשׁוּעָתִי
  choice: kekuatan keselamatanku
  alternative: kekuatan yang menyelamatkan aku
  rationale: Pilihan utama mempertahankan kepadatan dan ambiguitas ungkapan puitis Ibrani, tanpa mempersempitnya menjadi tindakan penyelamatan saja.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan khidmat. Sapaan “Ya Yahweh, Tuhanku” mempertahankan dua sebutan ilahi yang berdampingan. Huruf kapital pada “Engkau” mengikuti register penghormatan yang lazim bagi Allah. Penanda catatan kaki ditempatkan sesudah “pertempuran” karena catatan menjelaskan kata נָשֶׁק.
