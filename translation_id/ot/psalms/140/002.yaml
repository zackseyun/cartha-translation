translation:
  language: id
  text: yang merancang berbagai kejahatan dalam hati mereka; setiap hari mereka mengobarkan peperangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap hari mereka berkumpul untuk bertempur” atau “setiap hari mereka memicu pertikaian.” Kata kerja Ibrani יָגוּרוּ di sini sulit ditafsirkan, dan konteks memungkinkan beberapa terjemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini melanjutkan gambaran tentang orang-orang jahat dari konteks sebelumnya; “yang” merupakan padanan alami dalam bahasa Indonesia.
- source_word: חָשְׁבוּ
  choice: merancang
  rationale: Kata kerja ini menunjuk pada pemikiran yang disengaja berupa perencanaan atau siasat, bukan sekadar kegiatan berpikir.
- source_word: רָעוֹת
  choice: berbagai kejahatan
  rationale: Bentuk jamaknya menunjuk pada hal-hal atau rencana-rencana jahat. “Berbagai kejahatan” mempertahankan nuansa jamak dalam ungkapan Indonesia yang alami.
- source_word: בְּלֵב
  choice: dalam hati
  rationale: Terjemahan ini mempertahankan istilah antropologis Ibrani “hati,” yang mencakup pusat pikiran, kehendak, dan niat, tanpa mempersempitnya menjadi “pikiran.”
- source_word: כָּל יוֹם
  choice: sepanjang hari
  rationale: Ungkapan temporal ini menekankan kegiatan yang berlangsung terus-menerus; “sepanjang hari” sesuai dengan bentuk puitis ayat.
- source_word: יָגוּרוּ
  choice: mengobarkan
  rationale: Kata kerja ini sulit ditafsirkan dalam konteks ini. “Mengobarkan” menyampaikan kemungkinan makna aktif berupa membangkitkan atau memicu peperangan, sekaligus menghasilkan ungkapan Indonesia yang wajar.
- source_word: מִלְחָמוֹת
  choice: peperangan
  rationale: Kata benda jamak ini berarti perang atau pertempuran. “Peperangan” mempertahankan kekuatan maknanya dan dapat menyatakan rangkaian atau berbagai tindakan perang.
