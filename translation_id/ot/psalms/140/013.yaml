source:
  edition: WLC
  text: אַ֣ךְ צַ֭דִּיקִים יוֹד֣וּ לִ/שְׁמֶ֑/ךָ יֵשְׁב֥וּ יְ֝שָׁרִ֗ים אֶת פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/013.yaml
  text: Surely the righteous will give thanks to your name[a]; the upright will dwell before your face.
translation:
  language: id
  text: Sungguh, orang-orang benar akan bersyukur kepada nama-Mu; orang-orang yang tulus akan tinggal di hadapan wajah-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “di hadirat-Mu.” Secara harfiah: “di hadapan wajah-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini menegaskan kesimpulan yang penuh keyakinan, bukan menyatakan pembatasan 'hanya'.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva jamak yang dipakai secara substantival; pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna etis serta relasionalnya.
- source_word: יוֹדוּ
  choice: akan bersyukur
  rationale: Bentuk Hifil dari ידה dalam konteks mazmur lazim menyatakan ucapan syukur atau pujian; 'bersyukur kepada nama-Mu' sesuai dengan konstruksi ayat.
- source_word: לִשְׁמֶךָ
  choice: kepada nama-Mu
  rationale: Preposisi ל menandai arah ucapan syukur, sementara 'nama-Mu' mempertahankan penekanan teks pada nama ilahi.
- source_word: יֵשְׁבוּ
  choice: akan tinggal
  rationale: ישׁב dapat berarti duduk atau tinggal; dalam konteks keberadaan yang berkelanjutan dekat dengan Allah, 'tinggal' paling tepat tanpa membatasi maknanya pada postur tubuh.
- source_word: יְשָׁרִים
  choice: orang-orang yang tulus
  rationale: Adjektiva jamak substantival ini menunjuk kepada orang yang lurus secara moral; 'tulus' merupakan ungkapan Indonesia yang alami dan jelas.
- source_word: אֶת פָּנֶיךָ
  choice: di hadapan wajah-Mu
  rationale: Mempertahankan citra konkret Ibrani tentang 'wajah' sekaligus memakai susunan bahasa Indonesia yang dapat dipahami.
theological_decisions:
- issue: Bahasa antropomorfis bagi kehadiran ilahi
  choice: di hadapan wajah-Mu
  alternative: di hadirat-Mu; di hadapan-Mu
  rationale: Teks Ibrani secara konkret menyebut 'wajah-Mu'. Citra ini dipertahankan agar tekstur puitis dan makna kedekatan dengan Allah tidak diam-diam diparafrasakan; padanan idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk jamak eksplisit dipakai untuk dua adjektiva substantival. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
