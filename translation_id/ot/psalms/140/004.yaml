  text: שָׁמְרֵ֤/נִי יְהוָ֨ה מִ֘/ידֵ֤י רָשָׁ֗ע מֵ/אִ֣ישׁ חֲמָסִ֣ים תִּנְצְרֵ֑/נִי אֲשֶׁ֥ר חָ֝שְׁב֗וּ לִ/דְח֥וֹת פְּעָמָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/004.yaml
  text: Keep me[a], O Yahweh, from the hands of the wicked; guard me from the violent man[b], who has planned to trip up my feet.
translation:
  language: id
  text: 'Jagalah aku, ya Yahweh, dari tangan orang fasik[a];

    lindungilah aku dari para pelaku kekerasan[b],

    yang telah merancang untuk menjatuhkan langkahku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari tangan seorang fasik.” Kata Ibrani yang diterjemahkan “orang fasik” berbentuk tunggal, tetapi dapat menunjuk kepada satu orang atau dipakai secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari seorang/orang yang berciri kekerasan.” Nomina Ibrani untuk “orang” berbentuk tunggal, tetapi kata kerja “telah merancang” berbentuk jamak; karena itu frasa ini dapat dipahami secara kolektif sebagai para pelaku kekerasan. Bagian akhir juga dapat diterjemahkan “yang telah merancang untuk menggulingkan langkahku.”
    reason: grammatical_and_lexical_ambiguity
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Jagalah aku
  rationale: Bentuk permohonan dari שׁמר meminta perlindungan. “Jagalah aku” alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan permohonan berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: מִידֵי רָשָׁע
  choice: dari tangan orang fasik
  rationale: Ungkapan “dari tangan” mempertahankan gambaran Ibrani tentang kuasa atau kendali yang mengancam. רָשָׁע berbentuk tunggal, tetapi dapat berfungsi secara umum atau kolektif.
- source_word: מֵאִישׁ חֲמָסִים
  choice: dari orang-orang yang melakukan kekerasan
  rationale: Secara bentuk אִישׁ tunggal, sedangkan חֲמָסִים menyatakan kekerasan secara intensif. Bentuk jamak dipakai dalam terjemahan karena klausa relatif berikutnya memakai verba jamak חָשְׁבוּ, sehingga kelompok pelaku tampaknya dimaksudkan; ketegangan bentuk sumber dicatat dalam catatan kaki.
- source_word: תִּנְצְרֵנִי
  choice: lindungilah aku
  rationale: נצר di sini merupakan permohonan perlindungan. “Lindungilah” membedakannya secara alami dari שׁמר tanpa menghilangkan paralelisme sinonim.
- source_word: חָשְׁבוּ
  choice: telah merancang
  rationale: Dalam konteks niat jahat, חשב berarti merancang atau merencanakan, bukan sekadar memikirkan. Verba Ibrani ini berbentuk jamak.
- source_word: לִדְחוֹת פְּעָמָי
  choice: untuk membuat langkah-langkahku goyah
  rationale: דחה dapat berarti mendorong, menyingkirkan, atau menjatuhkan; bersama פְּעָמָי, ungkapan ini menggambarkan upaya menggagalkan atau menjatuhkan perjalanan pemazmur. Pilihan ini mempertahankan citra langkah tanpa membatasinya hanya pada tersandung secara harfiah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: “Yahweh” mempertahankan nama pribadi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Ketidaksesuaian jumlah antara אִישׁ dan חָשְׁבוּ
  choice: Pelaku kekerasan diterjemahkan sebagai kelompok jamak
  alternative: “orang yang melakukan kekerasan—mereka telah merancang” atau bentuk tunggal seluruhnya
  rationale: Teks Ibrani memakai אִישׁ dalam bentuk tunggal, tetapi verba חָשְׁבוּ berbentuk jamak. Terjemahan utama mengikuti daya kolektif yang ditunjukkan oleh verba, sementara bentuk tunggal sumber dan kemungkinan pembacaannya dijelaskan dalam catatan kaki agar ambiguitas tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Paralelisme puisi dipertahankan dalam tiga baris. “Ya Yahweh” menyampaikan sapaan langsung; “tangan,” “langkah-langkah,” dan “goyah” mempertahankan citra konkret teks Ibrani tanpa menghasilkan ungkapan yang kaku.
