source:
  edition: WLC
  text: ידעת כִּֽי יַעֲשֶׂ֣ה יְ֭הוָה דִּ֣ין עָנִ֑י מִ֝שְׁפַּ֗ט אֶבְיֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/012.yaml
  text: I know that Yahweh will uphold the cause of the afflicted[b][a], and justice for the needy.
translation:
  language: id
  text: Aku tahu[a] bahwa Yahweh akan membela perkara orang yang tertindas[b] dan menegakkan keadilan bagi orang-orang yang membutuhkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku telah mengetahui”. Bentuk Ibraninya secara tradisional dipahami di sini sebagai pengakuan pemazmur, “Aku tahu”. Berdasarkan bentuk konsonantalnya, sebagian orang membacanya “Engkau tahu”.
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “akan melakukan perkara orang yang tertindas”; maksudnya, Yahweh akan bertindak untuk membela perkara hukum mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Aku tahu
  rationale: Walaupun bentuk konsonantal dan morfologisnya dapat dibaca sebagai orang kedua tunggal, konteks penutup mazmur secara tradisional dipahami sebagai pengakuan pemazmur. Bentuk kini “Aku tahu” menyampaikan keadaan mengetahui yang berkelanjutan, sementara kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang diketahui oleh pemazmur; “bahwa” merupakan penghubung pelengkap yang alami dalam bahasa Indonesia.
- source_word: יַעֲשֶׂה ... דִּין
  choice: akan membela perkara
  rationale: 'Secara harfiah berarti “akan melakukan perkara/kasus”, tetapi gabungan ini memiliki arti forensik: bertindak demi menegakkan atau membela perkara seseorang.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עָנִי
  choice: orang yang tertindas
  rationale: Dalam konteks kekerasan dan penindasan di mazmur ini, istilah tersebut menunjuk kepada orang yang menderita dan rentan, tidak terbatas pada kemiskinan ekonomi.
- source_word: מִשְׁפַּט
  choice: keadilan
  rationale: Di sini kata tersebut menunjuk kepada keputusan atau tindakan adil yang menjadi hak orang berkekurangan.
- source_word: אֶבְיוֹנִים
  choice: orang-orang yang berkekurangan
  rationale: Pilihan ini menyampaikan keadaan membutuhkan atau kekurangan dan mempertahankan bentuk jamak tanpa membatasinya secara mutlak pada kemiskinan materi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; “Yahweh” mempertahankannya sebagai nama perjanjian dan bukan menggantinya dengan gelar.
- issue: Subjek kata ידעת
  choice: Aku tahu
  alternative: Engkau tahu; Aku telah mengetahui
  rationale: Bentuk yang tertulis dapat dipahami secara morfologis sebagai “engkau tahu”, tetapi konteks penutup mazmur dan pemahaman tradisional mendukung pengakuan pemazmur, “Aku tahu”. Ketegangan tekstual ini tidak disembunyikan dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Ungkapan forensik Ibrani dibuat alami melalui “membela perkara”, sedangkan paralelisme dipertahankan dengan “menegakkan keadilan”. Pengulangan verba pada bagian kedua merupakan pelengkapan eliptis yang wajar dalam bahasa Indonesia.
