  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָמַ֣רְתִּי לַ֭/יהוָה אֵ֣לִ/י אָ֑תָּה הַאֲזִ֥ינָ/ה יְ֝הוָ֗ה ק֣וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/006.yaml
  text: I say to the LORD, “You are my God.” O LORD, listen to the voice of my pleas.
translation:
  language: id
  text: Aku berkata kepada TUHAN, “Engkaulah Allahku.” Ya TUHAN, dengarkanlah suara permohonanku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Aku berkata
  rationale: Bentuk qatal orang pertama tunggal secara formal berarti “aku berkata/telah berkata”. Konteks doa memungkinkan nuansa pernyataan kini, tetapi bahasa Indonesia alami dapat memakai “Aku berkata” tanpa menambahkan penanda waktu yang tidak ada.
- source_word: לַיהוָה
  choice: kepada TUHAN
  rationale: Preposisi ל menyatakan pihak yang dituju; nama ilahi יהוה ditampilkan menurut konvensi Indonesia yang lazim sebagai TUHAN.
- source_word: אֵלִי אָתָּה
  choice: Engkaulah Allahku
  rationale: Urutan Ibrani secara harfiah “Allahku, Engkau” bersifat emfatis. Partikel -lah mempertahankan penekanan itu secara alami.
- source_word: הַאֲזִינָה
  choice: dengarkanlah
  rationale: Imperatif ini meminta perhatian pendengaran yang sungguh-sungguh; “dengarkanlah” alami dan mempertahankan bentuk permohonan langsung.
- source_word: קוֹל תַּחֲנוּנָי
  choice: suara permohonanku
  rationale: Mempertahankan ungkapan konkret “suara” dan makna jamak/abstrak תַּחֲנוּנִים sebagai permohonan belas kasihan; dalam bahasa Indonesia bentuk tunggal kolektif terdengar paling wajar.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi Alkitab Indonesia yang luas dikenal tanpa memasukkan rekonstruksi pelafalan ke dalam teks utama.
- issue: Aspek waktu אָמַרְתִּי
  choice: Aku berkata
  alternative: Aku telah berkata atau Aku mengatakan
  rationale: Qatal dapat menunjuk ujaran yang telah diucapkan, sedangkan konteks mazmur memungkinkan deklarasi doa yang berlaku kini. Pilihan ini menjaga ketegangan aspek tanpa menegaskannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan “Engkau” dan partikel “-lah” mempertahankan register doa yang bermartabat serta penekanan teks Ibrani.
