  variant: modern standard Indonesian
source:
  edition: WLC
  text: ימיטו עֲלֵי/הֶ֗ם גֶּֽחָ֫לִ֥ים בָּ/אֵ֥שׁ יַפִּלֵ֑/ם בְּ֝/מַהֲמֹר֗וֹת בַּֽל יָקֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/010.yaml
  text: Let burning coals fall on them[a]; let him cast them into the fire, into deep pits[b], never to rise again.
translation:
  language: id
  text: Biarlah bara api berjatuhan menimpa mereka[a]; biarlah dia mencampakkan mereka ke dalam api, ke dalam lubang-lubang yang dalam[b], sehingga mereka tidak bangkit lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kiranya bara api dicurahkan ke atas mereka.” Verba Ibrani dapat berarti menyebabkan sesuatu jatuh atau tercurah seperti hujan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ke dalam jurang-jurang” atau “ke dalam kedalaman air.” Istilah Ibraninya langka, sehingga nuansa tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: ימיטו
  choice: Biarlah ... berjatuhan
  rationale: Bentuk hifil imperfek jamak ini bernuansa harapan atau permohonan penghukuman dan dapat menyatakan tindakan menyebabkan sesuatu jatuh atau tercurah. Ungkapan ini alami dalam bahasa Indonesia tanpa menentukan pelaku yang tidak disebutkan secara tegas.
- source_word: עֲלֵיהֶם
  choice: menimpa mereka
  rationale: על berarti ‘di atas/atas mereka’; bersama verba jatuh, ‘menimpa mereka’ menyampaikan arah dan dampaknya secara alami.
- source_word: גֶּחָלִים
  choice: bara api
  rationale: Kata ini menunjuk pada arang atau bara yang menyala. ‘Bara api’ mempertahankan gambaran panas dan penghukuman dalam konteks.
- source_word: בָּאֵשׁ
  choice: ke dalam api
  rationale: 'Dengan verba kausatif berikutnya, preposisi ini paling wajar dipahami secara direktif: mereka dicampakkan ke dalam api.'
- source_word: יַפִּלֵם
  choice: biarlah dia mencampakkan mereka
  rationale: Hifil imperfek orang ketiga tunggal dengan akhiran objek jamak berarti menyebabkan mereka jatuh. ‘Mencampakkan’ mempertahankan daya kausatif dan kerasnya gambaran, sedangkan ‘dia’ tidak secara eksplisit menamai pelaku.
- source_word: בְּמַהֲמֹרוֹת
  choice: ke dalam lubang-lubang yang dalam
  rationale: Istilah ini langka dan makna persisnya tidak pasti. Pilihan ini mempertahankan gambaran tempat dalam yang membawa kebinasaan tanpa memastikan bahwa yang dimaksud adalah kedalaman berair.
- source_word: בַּל
  choice: sehingga ... tidak
  rationale: Partikel negatif ini dapat menyatakan hasil atau tujuan. Susunan tersebut alami dalam bahasa Indonesia dan menghubungkan kejatuhan dengan ketidakmampuan untuk bangkit.
- source_word: יָקוּמוּ
  choice: bangkit lagi
  rationale: קום berarti bangkit, berdiri, atau muncul. Dalam konteks dicampakkan ke tempat yang dalam, ‘bangkit lagi’ menyatakan kejatuhan yang tidak dapat dipulihkan.
theological_decisions:
- issue: Bahasa kutukan/penghukuman dan pelaku tersirat pada verba tunggal
  choice: Mempertahankan ayat sebagai permohonan penghukuman dan memakai ‘dia’ tanpa secara eksplisit menambahkan nama Allah.
  alternative: Menyatakan pelaku secara langsung sebagai ‘Allah’, atau mengubahnya menjadi bentuk pasif ‘biarlah mereka dicampakkan’.
  rationale: Teks Ibrani beralih dari bentuk verbal jamak ke bentuk tunggal dan tidak menyebut subjek verba tunggal itu. Konteks sangat mungkin menyiratkan tindakan ilahi, tetapi terjemahan tidak perlu menyelesaikan ketakterusterangan tersebut dengan menambahkan nama yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Bara api berjatuhan menimpa’ mempertahankan daya gambar puisi, sedangkan ‘mencampakkan’ menyampaikan kerasnya permohonan penghukuman. Kata ganti ‘dia’ sengaja tidak dikapitalisasi agar identitas pelaku tidak dibuat lebih eksplisit daripada teks Ibrani.
