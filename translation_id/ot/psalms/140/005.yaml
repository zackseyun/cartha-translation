  text: טָֽמְנֽוּ גֵאִ֨ים פַּ֡ח לִ֗/י וַ/חֲבָלִ֗ים פָּ֣רְשׂוּ רֶ֭שֶׁת לְ/יַד מַעְגָּ֑ל מֹקְשִׁ֖ים שָֽׁתוּ לִ֣/י סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/005.yaml
  text: The proud have hidden a trap for me[a], and with cords they have spread a net beside the path; they have set snares for me[c][b]. Selah
translation:
  language: id
  text: Orang-orang congkak[a] telah menyembunyikan perangkap bagiku; dengan tali-tali mereka membentangkan jaring di sisi jalan[b]; mereka memasang jerat-jerat bagiku. Sela[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang sombong” atau “orang-orang angkuh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di samping jalur.”
    reason: lexical_alternative
  - marker: c
    text: “Sela” kemungkinan merupakan tanda liturgis atau musikal; makna tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: טָמְנוּ
  choice: telah menyembunyikan
  rationale: Kata kerja ini berarti menyembunyikan atau menaruh secara tersembunyi; pilihan ini mempertahankan gambaran perangkap yang disamarkan.
- source_word: גֵאִים
  choice: orang-orang congkak
  rationale: Bentuk ini menunjuk kepada orang yang tinggi hati atau angkuh. 'Orang-orang congkak' alami dalam bahasa Indonesia dan tidak menambahkan penandaan gender.
- source_word: פַּח
  choice: perangkap
  rationale: Kata ini menunjuk pada perangkap atau jerat. 'Perangkap' membedakannya secara wajar dari מֹקְשִׁים pada bagian akhir ayat.
- source_word: וַחֲבָלִים
  choice: dengan tali-tali
  rationale: חֲבָלִים berarti tali-tali. Dalam konteks ini frasa tersebut paling alami dipahami secara instrumental sebagai sarana untuk membentangkan jaring.
- source_word: פָּרְשׂוּ רֶשֶׁת
  choice: mereka membentangkan jaring
  rationale: Gabungan kata ini secara langsung menggambarkan tindakan membentangkan atau memasang sebuah jaring.
- source_word: לְיַד מַעְגָּל
  choice: di sisi jalan
  rationale: לְיַד berarti di sisi atau di samping, sedangkan מַעְגָּל menunjuk pada jalur atau jalan yang dilalui. Pilihan ini mempertahankan gambaran penyergapan di sepanjang rute pemazmur.
- source_word: מֹקְשִׁים
  choice: jerat-jerat
  rationale: Bentuk jamak ini berarti jerat atau perangkap. 'Jerat-jerat' mempertahankan bentuk jamak dan memberi variasi leksikal terhadap פַּח.
- source_word: שָׁתוּ
  choice: mereka memasang
  rationale: Kata kerja ini berarti menaruh atau menempatkan; 'memasang' merupakan padanan Indonesia yang alami ketika objeknya adalah jerat.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna istilah ini tidak pasti dan kemungkinan merupakan petunjuk liturgis atau musikal, sehingga ditransliterasikan alih-alih diterjemahkan secara spekulatif.
