id: PSA.140.8
reference: Psalms 140:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַל תִּתֵּ֣ן יְ֭הוָה מַאֲוַיֵּ֣י רָשָׁ֑ע זְמָמ֥/וֹ אַל תָּ֝פֵ֗ק יָר֥וּמוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/008.yaml
  text: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
translation:
  language: id
  text: Ya Yahweh, jangan kabulkan keinginan orang fasik; jangan biarkan siasatnya terlaksana[a], agar mereka tidak meninggikan diri[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jangan majukan siasatnya” atau “jangan wujudkan rencananya.” Kata kerja Ibrani dalam klausa ini sulit ditafsirkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “agar ia tidak meninggikan diri.” Teks Ibrani memakai kata kerja jamak (“mereka”), meskipun rujukan sebelumnya berbentuk tunggal.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar seperti “TUHAN”.
- source_word: מַאֲוַיֵּי
  choice: keinginan
  rationale: Kata ini menyatakan hasrat atau keinginan. “Keinginan” alami dalam bahasa Indonesia dan tidak memperkuat nuansa melebihi teks Ibrani.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuknya tunggal dan menunjuk kepada orang yang bertindak jahat. “Orang fasik” mempertahankan ketunggalan itu serta cocok dengan akhiran tunggal pada “siasatnya”.
- source_word: זְמָמוֹ
  choice: siasatnya
  rationale: Kata benda ini menunjuk pada rencana yang dalam konteks ini berniat jahat. “Siasat” menyampaikan nuansa buruk tersebut lebih tepat daripada “rencana” yang netral.
- source_word: תָּפֵק
  choice: biarkan ... terlaksana
  rationale: Kata kerja ini sulit ditafsirkan dalam konteks ini. Pilihan ini menyampaikan permohonan agar Yahweh tidak membuat atau membiarkan siasat orang fasik maju hingga terwujud, sambil mencatat alternatif dalam catatan kaki.
- source_word: יָרֻמוּ
  choice: mereka ... meninggikan diri
  rationale: Bentuk Masoretiknya jamak. Ungkapan Indonesia ini menyampaikan gagasan bahwa mereka naik dalam kesombongan atau keberhasilan dan mempertahankan peralihan dari orang fasik tunggal ke subjek jamak.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah ini dialihaksarakan karena arti dan fungsi tepatnya tidak pasti.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Nama diri ilahi dipertahankan secara transparan dan tidak diganti dengan sebuah gelar.
- issue: Peralihan jumlah dari “orang fasik/siasatnya” yang tunggal ke kata kerja jamak יָרֻמוּ
  choice: Mempertahankan bentuk jamak “mereka” dalam klausa terakhir
  alternative: 'Melancarkan jumlah menjadi tunggal: “agar ia tidak meninggikan diri”'
  rationale: Teks Ibrani beralih dari rujukan tunggal kepada kata kerja jamak. Terjemahan mempertahankan ketegangan ini karena bentuk jamak mungkin memperluas cakupan kepada orang fasik itu beserta para sekutunya atau kepada kaum fasik secara umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. “Ya Yahweh” mempertahankan sapaan langsung; “orang fasik” dan “siasat” merupakan kosakata umum yang tetap bermartabat. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
