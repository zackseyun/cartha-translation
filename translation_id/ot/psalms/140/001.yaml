source:
  edition: WLC
  text: חַלְּצֵ֣/נִי יְ֭הוָה מֵ/אָדָ֣ם רָ֑ע מֵ/אִ֖ישׁ חֲמָסִ֣ים תִּנְצְרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/001.yaml
  text: Rescue me[a], O Yahweh, from the evil man; guard me from the violent man.
translation:
  language: id
  text: Selamatkanlah aku[a], ya Yahweh, dari orang jahat; jagalah aku dari orang yang melakukan kekerasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lepaskanlah aku.”'
    reason: Alternatif leksikal yang sah bagi חַלְּצֵנִי; verba ini dapat berarti melepaskan atau menyelamatkan seseorang dari bahaya.
lexical_decisions:
- source_word: חַלְּצֵנִי
  choice: Lepaskanlah aku
  rationale: Bentuk Hifil imperatif dengan akhiran orang pertama tunggal ini berarti menarik keluar, melepaskan, atau menyelamatkan. 'Lepaskanlah aku' menyampaikan permohonan mendesak dan selaras dengan objek yang diperkenalkan oleh 'dari'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: מֵאָדָם רָע
  choice: dari orang jahat
  rationale: אָדָם dalam paralelisme dengan אִישׁ menunjuk kepada seorang lawan; bahasa Indonesia secara alami memakai 'orang' tanpa harus menambahkan penanda definit yang tidak gramatikal dalam bahasa Indonesia.
- source_word: מֵאִישׁ חֲמָסִים
  choice: dari orang yang melakukan kekerasan
  rationale: Ungkapan Ibrani harfiah 'orang kekerasan-kekerasan' memakai bentuk jamak intensif/abstrak. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa orang tersebut dicirikan oleh tindakan kekerasan.
- source_word: תִּנְצְרֵנִי
  choice: jagalah aku
  rationale: Kata נצר berarti menjaga, melindungi, atau memelihara. 'Jagalah aku' membedakannya dari permohonan pertama dan mempertahankan nuansa perlindungan berkelanjutan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Rujukan tunggal maskulin אָדָם dan אִישׁ
  choice: orang
  alternative: laki-laki
  rationale: Kedua nomina secara gramatikal maskulin, tetapi dalam konteks ini fokus semantisnya ialah seorang pelaku kejahatan dan kekerasan, bukan jenis kelaminnya. 'Orang' mempertahankan rujukan tunggal tanpa menambahkan penekanan gender yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel '-lah' mempertahankan nada permohonan puitis tanpa terdengar kuno; paralelisme dua klausa dijaga.
