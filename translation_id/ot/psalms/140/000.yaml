  yaml_path: translation/ot/psalms/140/000.yaml
  text: For the choirmaster. A psalm of David[a].
translation:
  language: id
  text: Untuk pemimpin musik. Mazmur Daud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Mazmur karya Daud” atau “Mazmur untuk Daud”; judul Ibrani dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern, sedangkan prefiks לַ־ diterjemahkan sebagai “untuk” sesuai konteks judul.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Kata ini merupakan penanda jenis karya berupa nyanyian yang diiringi musik; “mazmur” adalah padanan baku dan tepat dalam konteks Kitab Mazmur.
- source_word: לְדָוִד
  choice: Daud
  rationale: Frasa nominal “Mazmur Daud” mempertahankan keluwesan hubungan yang dinyatakan oleh לְ־, yang dapat menunjuk pada kepengarangan, keterkaitan, kepemilikan, atau peruntukan, tanpa memaksakan satu tafsiran.
theological_decisions:
- issue: Hubungan Daud dengan mazmur dalam judul
  choice: Mazmur Daud
  alternative: Mazmur karya Daud; Mazmur untuk Daud
  rationale: Bahasa Ibrani tidak mengharuskan keputusan bahwa frasa ini semata-mata menyatakan kepengarangan. Bentuk “Mazmur Daud” mempertahankan ungkapan tradisional sekaligus ambiguitas aslinya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Pemimpin musik” dipilih daripada istilah yang lebih lama seperti “pemimpin biduan” agar mudah dipahami pembaca masa kini. Penanda catatan kaki ditempatkan setelah “Daud” karena catatan menjelaskan frasa לְדָוִד.
