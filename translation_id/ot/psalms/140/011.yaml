  text: A man of tongue will not be established in the land[c][b][a]; evil will hunt down a man of violence to thrustings.
translation:
  language: id
  text: Seorang pemfitnah[a] tidak akan tetap teguh di negeri; kejahatan akan memburu orang yang melakukan kekerasan[c] sampai ia dijatuhkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang lidah”; dapat juga diterjemahkan “orang yang banyak bicara,” tetapi dalam konteks ini kemungkinan besar menunjuk pada pemfitnah.'
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani terakhir sulit dipahami. Secara lebih harfiah, “kepada/untuk dorongan-dorongan” atau “penjatuhan-penjatuhan”; dapat juga dipahami “dengan dorongan-dorongan berulang” atau “menuju kehancuran.”
    reason: textual_difficulty
  - marker: c
    text: 'Klausa ini juga dapat dianalisis sebagai: “orang jahat yang melakukan kekerasan—kiranya ia diburu.” Susunan Ibraninya sulit; terjemahan utama membaca “kejahatan” sebagai subjek yang dipersonifikasikan.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: אִישׁ לָשׁוֹן
  choice: orang yang tajam lidahnya
  rationale: Ungkapan harfiah 'orang lidah' menunjuk pada orang yang memakai perkataan secara jahat, kemungkinan pemfitnah. Pilihan ini mempertahankan citra lidah sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בַּל יִכּוֹן
  choice: tidak akan tetap teguh
  rationale: Bentuk Niphal dari כון menyatakan keadaan kokoh, mapan, atau bertahan; 'tetap teguh' menyampaikan kestabilan yang disangkal oleh partikel puitis בַּל.
- source_word: בָּאָרֶץ
  choice: di negeri ini
  rationale: אֶרֶץ dapat berarti negeri atau bumi. Konteks sosial mazmur mendukung 'negeri'; kata 'ini' membuat ungkapan Indonesia lebih alami tanpa memberi cakupan kosmis.
- source_word: אִישׁ חָמָס
  choice: orang yang suka melakukan kekerasan
  rationale: Secara harfiah 'orang kekerasan'; rumusan ini alami dan menunjukkan bahwa kekerasan menjadi ciri tindakannya.
- source_word: רָע
  choice: kejahatan
  rationale: Dibaca sebagai nomina abstrak yang dipersonifikasikan dan menjadi subjek יְצוּדֶנּוּ, bukan sebagai kata sifat bagi 'orang yang melakukan kekerasan'.
- source_word: יְצוּדֶנּוּ
  choice: akan memburu
  rationale: צוד berarti memburu atau menangkap sebagai buruan. Bentuk verba dapat dipahami sebagai prediksi, sementara personifikasi kejahatan dipertahankan.
- source_word: לְמַדְחֵפֹת
  choice: hingga ia terjungkal berulang kali
  rationale: Nomina jamak yang langka ini berkaitan dengan dorongan atau desakan. Terjemahan menyampaikan hasil berupa jatuh berulang kali, tetapi ketidakpastian frasa dijelaskan dalam catatan.
theological_decisions:
- issue: Hubungan sintaksis רָע dengan klausa kedua
  choice: Kejahatan dipersonifikasikan sebagai subjek yang memburu orang yang suka melakukan kekerasan.
  alternative: 'רָע menjadi kata sifat: ''orang jahat yang melakukan kekerasan—kiranya sesuatu memburunya.'''
  rationale: Urutan kata dan kesesuaian verba tunggal memungkinkan אִישׁ חָמָס sebagai objek yang didahulukan atau topik, sedangkan רָע menjadi subjek. Pembacaan ini juga menghasilkan personifikasi puitis yang kuat, tetapi alternatif sintaksis tetap dicatat.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Citra 'lidah' dipertahankan secara idiomatis; frasa Ibrani terakhir yang langka dibuat alami dalam teks utama, sementara arti harfiah dan alternatif sintaksis dicatat.
