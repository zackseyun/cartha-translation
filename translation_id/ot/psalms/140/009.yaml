  text: As for the head of those who surround me[b][a], let the trouble of their lips cover them.
translation:
  language: id
  text: Biarlah kepala orang-orang yang mengelilingi aku[a] ditutupi oleh kejahatan bibir mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah kepala orang-orang yang mengelilingi aku ditutupi oleh kejahatan bibir mereka.” Bahasa Ibraninya padat; “kepala” dapat dipahami secara kolektif, atau maksudnya dapat dipahami sebagai bentuk jamak, “kepala-kepala.”
    reason: alternative_reading
  - marker: b
    text: Kata yang diterjemahkan “kejahatan” juga dapat berarti “kesusahan,” “kemalangan,” atau “celaka,” dan di sini menunjuk pada dampak mencelakakan dari ucapan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: kepala
  rationale: Mempertahankan arti konkret bentuk tunggal Ibrani. Dalam ungkapan yang padat ini, bentuk tersebut dapat dipahami secara kolektif; kemungkinan bentuk jamak dijelaskan dalam catatan.
- source_word: מְסִבָּי
  choice: orang-orang yang mengelilingi aku
  rationale: Mengungkapkan pelaku jamak yang berada di sekeliling pemazmur tanpa menambahkan rincian seperti 'pengepung' atau 'musuh' yang tidak dinyatakan langsung oleh kata ini.
- source_word: עֲמַל
  choice: kesusahan
  rationale: Kata ini dapat menunjuk pada kesusahan, kejahatan, atau kerugian. Dalam kaitannya dengan bibir, yang dimaksud ialah akibat mencelakakan dari perkataan mereka.
- source_word: שְׂפָתֵימוֹ
  choice: bibir mereka sendiri
  rationale: Mempertahankan citraan tubuh yang konkret. Kata 'sendiri' memperjelas bahwa kesusahan itu berkaitan dengan ucapan mereka sendiri, tanpa mengubah hubungan konstruksi Ibrani.
- source_word: יכסומו
  choice: biarlah ... ditutupi
  rationale: Menerjemahkan verba sebagai permohonan atau kutukan dalam konteks doa mazmur, sambil mempertahankan gambaran dasar 'menutupi'.
theological_decisions:
- issue: Struktur klausa yang padat dan sifat permohonan penghukuman
  choice: 'Memahami ayat ini sebagai permohonan: ''Biarlah kepala ... ditutupi ...'''
  alternative: Menerjemahkannya sebagai pernyataan masa depan, 'Kesusahan akibat bibir mereka akan menutupi mereka,' atau mempertahankan kepala sebagai topik terpisah.
  rationale: Konteks mazmur mendukung nuansa optatif atau yusif. Bentuk pasif Indonesia menghasilkan kalimat alami sekaligus mempertahankan kepala sebagai sasaran penutupan.
- issue: Bentuk tunggal 'kepala' dengan kelompok jamak
  choice: Mempertahankan 'kepala' dalam bentuk tunggal sebagaimana teks konsonantal dan memahaminya secara kolektif.
  alternative: Menggunakan 'kepala-kepala' atau mengubah susunan menjadi 'Biarlah mereka ditutupi ...'.
  rationale: Teks Ibrani memang ringkas dan tidak sepenuhnya terang. Terjemahan utama mempertahankan ketegangannya, sedangkan alternatif jamak dicatat tanpa diam-diam membetulkan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Citra konkret 'kepala', 'bibir', dan 'ditutupi' dipertahankan. Susunan pasif dipilih agar hubungan antarbagiannya jelas dan wajar dalam bahasa Indonesia, sedangkan kepadatan serta kemungkinan alternatif teks Ibrani dijelaskan melalui catatan kaki.
