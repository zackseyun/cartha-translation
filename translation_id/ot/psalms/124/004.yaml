lexical_decisions:
- source_word: אֲזַי
  choice: maka
  rationale: Melanjutkan akibat pengandaian yang tidak terjadi dari ayat sebelumnya; “maka” alami dalam struktur bahasa Indonesia.
- source_word: הַמַּיִם
  choice: air bah
  rationale: Bentuk jamak puitis menunjuk pada air yang meluap dan mengancam; “air bah” mempertahankan citra bencana tanpa terdengar kaku.
- source_word: שְׁטָפוּנוּ
  choice: akan menghanyutkan kita
  rationale: Kata kerja ini menggambarkan air yang membanjiri atau menyeret; konteks ayat sebelumnya membuat bentuk ini bersifat pengandaian.
- source_word: נַחְלָה
  choice: arus deras
  rationale: Kata ini dapat berarti sungai atau aliran musiman; dalam gambaran bahaya air, “arus deras” menyampaikan gerak dan kekuatannya tanpa harus menentukan jenis alirannya.
- source_word: עָבַר עַל
  choice: akan melanda
  rationale: Secara harfiah berarti melewati atau melintas di atas; dalam konteks arus yang mengancam, “melanda” menghasilkan ungkapan Indonesia yang alami sekaligus mempertahankan citra air yang menerjang.
- source_word: נַפְשֵׁנוּ
  choice: hidup kita
  rationale: נֶפֶשׁ di sini merujuk pada nyawa atau diri seutuhnya, bukan secara khusus pada unsur nonjasmani; “hidup kita” wajar dalam bahasa Indonesia dan mempertahankan taruhan eksistensialnya.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks ancaman maut
  choice: hidup kita
  alternative: jiwa kita; kita
  rationale: Konteks tidak menuntut antropologi teknis. “Hidup kita” mempertahankan cakupan makna nyawa atau diri, sedangkan catatan kaki menyajikan alternatif formal dan idiomatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis dan citra banjir yang jelas. Pengulangan struktur dua klausa dipertahankan, sedangkan idiom Ibrani נֶפֶשׁ disampaikan secara alami dan dijelaskan melalui catatan kaki.
