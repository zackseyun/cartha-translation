id: PSA.124.8
reference: Psalms 124:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֶ֭זְרֵ/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/008.yaml
  text: Our help is in the name of Yahweh[a], maker of heaven and earth.
translation:
  language: id
  text: Pertolongan kita ada dalam nama Yahweh[a], yang menjadikan langit dan bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; nama ini biasanya dilafalkan “Yahweh”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan pelafalan yang digunakan dalam terjemahan.
lexical_decisions:
- source_word: עֶזְרֵנוּ
  choice: Pertolongan kita
  rationale: Nomina עֵזֶר dengan sufiks orang pertama jamak menunjuk pada pertolongan atau bantuan, bukan terutama pada pribadi 'penolong'.
- source_word: בְּשֵׁם
  choice: ada dalam nama
  rationale: Preposisi ב dengan שֵׁם menyatakan dasar atau lingkup kebergantungan dan seruan. Ungkapan ini mempertahankan daya perjanjian dan liturgis teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', sehingga nama pribadi dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
- source_word: עֹשֵׂה
  choice: yang menjadikan
  rationale: Partisipel Qal menerangkan Yahweh melalui tindakan-Nya. 'Yang menjadikan' terdengar alami dalam bahasa Indonesia dan tetap mencerminkan daya partisipial, tanpa membatasinya pada tindakan lampau semata.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: langit dan bumi
  rationale: Pasangan ini merupakan merisme baku yang mencakup seluruh ciptaan; 'langit dan bumi' adalah padanan Indonesia yang alami dan mapan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. 'Yahweh' mempertahankan nama ilahi alih-alih menggantinya dengan gelar, sementara catatan kaki menjelaskan bentuk Ibraninya.
- issue: Nuansa partisipel עֹשֵׂה
  choice: yang menjadikan
  alternative: pencipta; yang telah menjadikan
  rationale: Pilihan ini mempertahankan gambaran Yahweh berdasarkan karya penciptaan-Nya tanpa mengubah partisipel menjadi gelar formal atau secara tak perlu membatasi aspeknya sebagai tindakan lampau.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada liturgis. Susunan 'Pertolongan kita ada dalam nama' dipertahankan untuk mencerminkan ungkapan sumber, sedangkan 'yang menjadikan' dipilih agar alami dan tidak menjadikan partisipel itu gelar resmi.
