  yaml_path: translation/ot/psalms/124/002.yaml
  text: If Yahweh had not been for us when man rose up against us—[a]
translation:
  language: id
  text: Sekiranya Yahweh tidak berpihak kepada kita ketika manusia bangkit melawan kita—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sekiranya Yahweh tidak berada di pihak kita ketika manusia bangkit melawan kita.”
    reason: Alternatif idiomatis yang lebih dekat dengan ungkapan Ibrani bahwa Yahweh “ada bagi kita,” dengan nuansa dukungan atau keberpihakan.
lexical_decisions:
- source_word: לוּלֵי
  choice: sekiranya ... tidak
  rationale: Kata ini memperkenalkan syarat yang berlawanan dengan kenyataan. Bentuk “sekiranya ... tidak” alami dalam bahasa Indonesia dan mempertahankan klausa bersyarat yang berlanjut ke ayat berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: שֶׁהָיָה לָנוּ
  choice: berpihak kepada kita
  rationale: Secara harfiah ungkapan ini berarti “ada bagi kita”. Dalam konteks ancaman, “berpihak kepada kita” menyampaikan dukungan ilahi secara alami tanpa mempersempitnya menjadi satu tindakan tertentu.
- source_word: בְּקוּם
  choice: ketika ... bangkit
  rationale: Preposisi ב pada infinitif konstruk menandai waktu. Dalam konteks permusuhan, קום berarti bangkit untuk bertindak melawan pihak lain.
- source_word: עָלֵינוּ
  choice: melawan kita
  rationale: Dalam konteks tindakan bermusuhan, עַל memiliki daya adversatif, yang secara alami dinyatakan dengan “melawan”.
- source_word: אָדָם
  choice: manusia
  rationale: Bentuk tunggal ini dipakai secara kolektif atau generik bagi manusia sebagai pihak penyerang. “Manusia” mempertahankan bentuk kolektif tanpa memaksakan jumlah penyerang.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Makna dukungan dalam שֶׁהָיָה לָנוּ
  choice: berpihak kepada kita
  alternative: menyertai kita
  rationale: “Berpihak kepada kita” mempertahankan gagasan bahwa Yahweh berada bagi umat-Nya dalam menghadapi musuh. “Menyertai kita” juga mungkin, tetapi lebih menonjolkan kehadiran daripada dukungan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Tanda pisah mempertahankan struktur klausa bersyarat yang belum selesai dan berlanjut ke ayat berikutnya.
