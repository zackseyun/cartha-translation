id: PSA.124.7
reference: Psalms 124:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נַפְשֵׁ֗/נוּ כְּ/צִפּ֥וֹר נִמְלְטָה֮ מִ/פַּ֪ח י֫וֹקְשִׁ֥ים הַ/פַּ֥ח נִשְׁבָּ֗ר וַ/אֲנַ֥חְנוּ נִמְלָֽטְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/007.yaml
  text: Our soul has escaped like a bird from the snare of the fowlers[a]; the snare is broken[b], and we have escaped.
translation:
  language: id
  text: Jiwa kita[a] telah lolos seperti burung dari jerat para penangkap burung; jerat itu telah putus, dan kita pun lolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti “nyawa”, “diri”, atau pribadi seutuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: jiwa kita
  rationale: נֶפֶשׁ dapat menunjuk pada jiwa, nyawa, diri, atau pribadi seutuhnya. “Jiwa kita” mempertahankan bentuk puitis dan keluasan makna teks, sementara catatan kaki menjelaskan nuansa konkretnya dalam konteks penyelamatan.
- source_word: כְּצִפּוֹר
  choice: seperti burung
  rationale: צִפּוֹר adalah sebutan umum untuk burung, bukan jenis tertentu; terjemahan ini mempertahankan perumpamaan secara alami.
- source_word: נִמְלְטָה / נִמְלָטְנוּ
  choice: telah lolos / lolos
  rationale: Bentuk Niphal dari מלט menyatakan terlepas atau luput dari bahaya. “Lolos” sesuai dengan gambaran seekor burung yang terbebas dari jerat dan memungkinkan pengulangan Ibrani tetap terdengar.
- source_word: מִפַּח / הַפַּח
  choice: dari jerat / jerat itu
  rationale: פַּח menunjuk pada jerat atau perangkap, khususnya dalam konteks menangkap burung. Pengulangan “jerat” mempertahankan penekanan puitis teks Ibrani.
- source_word: יוֹקְשִׁים
  choice: para penangkap burung
  rationale: Partisip dari יקשׁ menunjuk kepada orang-orang yang memasang jerat. Dalam perumpamaan ini, “para penangkap burung” jelas dan wajar bagi pembaca Indonesia.
- source_word: נִשְׁבָּר
  choice: telah putus
  rationale: Kata ini berarti telah dipatahkan atau menjadi rusak. Untuk jerat, “telah putus” menggambarkan dengan alami bahwa alat itu tidak lagi dapat menahan mangsanya.
- source_word: וַאֲנַחְנוּ
  choice: dan kita pun
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan. Partikel “pun” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna antropologis נַפְשֵׁנוּ
  choice: Mempertahankan “jiwa kita” dengan penjelasan makna dalam catatan kaki
  alternative: “Nyawa kita” atau “diri kita”
  rationale: Pilihan ini tidak membatasi נֶפֶשׁ pada pengertian nyawa biologis ataupun menjadikannya istilah teknis tentang bagian tak berjasad dari manusia; ambiguitas asli tetap dipelihara.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Struktur paralel dan pengulangan kata “jerat” serta “lolos” dipertahankan; “kita pun” menandai penekanan pada pronomina eksplisit dalam bahasa Ibrani.
