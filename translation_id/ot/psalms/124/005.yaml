translation:
  language: id
  text: maka air yang angkuh itu tentu telah melanda jiwa kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “maka air yang ganas itu tentu telah melanda kami.” Kata Ibrani yang diterjemahkan “angkuh” dapat berarti “sombong,” “lancang,” atau “pongah”; ketika menerangkan air, kata ini secara metaforis menggambarkan kekuatan yang ganas dan sewenang-wenang. Ungkapan “jiwa kami” juga dapat berarti “kami” atau “nyawa kami.”
    reason: Mempertahankan metafora dan arti leksikal utama הַזֵּידוֹנִים dalam teks utama, sambil mencatat pembacaan kontekstual serta keluasan makna נַפְשֵׁנוּ.
lexical_decisions:
- source_word: אֲזַי
  choice: maka
  rationale: Adverbia temporal ini melanjutkan rangkaian akibat yang tidak terjadi dalam ayat-ayat sebelumnya; “maka” menghubungkannya secara alami dalam bahasa Indonesia.
- source_word: עָבַר עַל
  choice: telah melanda
  rationale: Secara harfiah berarti “melewati/melintas di atas,” tetapi dengan air sebagai subjek ungkapan “melanda” menyampaikan gerakan air yang menutupi dan mengancam tanpa menghilangkan citra banjir.
- source_word: נַפְשֵׁנוּ
  choice: jiwa kami
  rationale: Pilihan ini mempertahankan bentuk tunggal kolektif dan citra puitis נֶפֶשׁ, yang dapat menunjuk pada jiwa, nyawa, atau diri; kemungkinan makna idiomatis “kami” dicatat dalam catatan kaki.
- source_word: הַמַּיִם
  choice: air
  rationale: Bahasa Indonesia lazim memakai nomina massa tunggal “air” untuk arus atau banjir, meskipun bentuk Ibraninya morfologis jamak.
- source_word: הַזֵּידוֹנִים
  choice: yang mengganas
  rationale: Adjektiva ini secara leksikal berkaitan dengan keangkuhan, kelancangan, atau kesombongan. Ketika menerangkan air, “mengganas” mengungkapkan daya yang keras dan melampaui batas, sedangkan metafora yang lebih harfiah dipertahankan dalam catatan kaki.
