source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/000.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: id
  text: 'Nyanyian ziarah. Dari Daud.


    Sekiranya TUHAN tidak menyertai kita—biarlah Israel berkata—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Secara harfiah berarti 'nyanyian kenaikan'. Dalam konteks judul mazmur, ungkapan ini secara alami dipahami sebagai nyanyian yang dinyanyikan dalam perjalanan naik menuju Yerusalem.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Mempertahankan hubungan luas yang dinyatakan oleh preposisi לְ tanpa mempersempitnya secara pasti menjadi klaim kepengarangan.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Konvensi baku dan luas dalam Alkitab bahasa Indonesia untuk menandai nama ilahi YHWH, sekaligus membedakannya dari gelar umum 'Tuhan'.
- source_word: לוּלֵי ... שֶׁהָיָה לָנוּ
  choice: Sekiranya ... tidak menyertai kita
  rationale: Ungkapan bersyarat kontrafaktual ini secara harfiah menyatakan bahwa YHWH 'ada bagi kita'; 'menyertai kita' menyampaikan dukungan dan kehadiran-Nya tanpa secara eksplisit mempersempitnya menjadi 'berpihak kepada kita'.
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: biarlah Israel berkata
  rationale: Menangkap partikel permohonan atau desakan נָא dan bentuk ajakan kepada seluruh Israel untuk mengulangi pernyataan tersebut.
theological_decisions:
- issue: Makna הָיָה לָנוּ tentang hubungan TUHAN dengan Israel
  choice: menyertai kita
  alternative: berpihak kepada kita
  rationale: Pilihan utama menjaga cakupan ungkapan Ibrani, yang dapat menunjuk pada kehadiran, pertolongan, atau keberpihakan TUHAN. Alternatif lebih idiomatis tetapi lebih sempit.
- issue: Hubungan superskripsi לְדָוִד dengan Daud
  choice: Dari Daud
  alternative: Karangan Daud
  rationale: Preposisi Ibrani dapat menandai kepengarangan, keterkaitan, persembahan, atau koleksi. 'Dari Daud' tetap wajar dan tidak memaksakan satu analisis.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Tanda pisah mempertahankan kalimat bersyarat yang sengaja belum selesai dan berlanjut ke ayat berikutnya. Istilah 'Nyanyian ziarah' dipilih agar judul mudah dipahami pembaca modern tanpa kehilangan konteks perjalanan naik ke Yerusalem.
