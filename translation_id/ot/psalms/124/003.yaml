lexical_decisions:
- source_word: אֲזַי
  choice: maka
  rationale: Adverbia ini menandai akibat dalam rangkaian pengandaian ayat 2–5; “maka” menghubungkan konsekuensinya secara alami dalam bahasa Indonesia.
- source_word: חַיִּים
  choice: hidup-hidup
  rationale: Bentuk ini berfungsi secara adverbial dengan arti “dalam keadaan hidup”; ungkapan Indonesia “menelan ... hidup-hidup” mempertahankan gambaran yang kuat dan konkret.
- source_word: בְּלָעוּנוּ
  choice: mereka akan menelan kita
  rationale: Perfect Qal berada dalam konteks pengandaian yang dimulai pada ayat sebelumnya, sehingga diterjemahkan sebagai akibat yang tidak terjadi. “Menelan” mempertahankan metafora Ibrani.
- source_word: בַּחֲרוֹת
  choice: ketika ... menyala
  rationale: Infinitif konstruk dengan prefiks ב menyatakan keadaan temporal, secara harfiah “pada menyalanya”; “ketika ... menyala” alami dan tetap mempertahankan metafora api.
- source_word: אַפָּם
  choice: murka mereka
  rationale: אַף secara harfiah dapat berarti “hidung”, tetapi dalam ungkapan ini menunjuk pada kemarahan. “Murka” cocok dengan register mazmur dan menyampaikan intensitasnya tanpa menjadi usang.
- source_word: בָּנוּ
  choice: terhadap kita
  rationale: Dengan kata yang menyatakan kemarahan, preposisi ב menunjukkan sasaran kemarahan; “terhadap kita” merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Nilai kala בְּלָעוּנוּ dalam rangkaian pengandaian
  choice: akan menelan
  alternative: telah menelan / menelan
  rationale: Bentuk perfect Ibrani dapat dibaca sebagai lampau sederhana bila berdiri sendiri, tetapi konteks אִלּוּלֵי pada ayat 2 dan rangkaian ayat 2–5 mendukung akibat kontrafaktual. Catatan kaki mempertahankan kemungkinan gramatikal alternatif.
translation_notes:
