source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/001.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: id
  text: 'Nyanyian Pendakian.[a] Dari Daud.


    Seandainya Yahweh tidak berpihak kepada kita[b]—biarlah Israel sekarang berkata—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Nyanyian ziarah.” Arti tepat istilah Ibraninya tidak pasti; secara harfiah, “nyanyian pendakian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak ada bagi kita”; maksudnya, tidak mendukung atau membela kita.
    reason: idiom_clarification
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Pendakian
  rationale: Mempertahankan gambaran harfiah ‘pendakian’ dalam judul kumpulan mazmur ini tanpa memastikan apakah yang dimaksud ialah perjalanan ziarah, tangga, atau penggunaan liturgis.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan judul yang ringkas dan lazim; preposisi Ibrani לְ dapat menyatakan kepengarangan, kaitan, atau peruntukan, sehingga keputusan yang lebih khusus tidak dimasukkan ke dalam teks.
- source_word: לוּלֵי
  choice: Seandainya ... tidak
  rationale: Mengungkapkan syarat berlawanan dengan kenyataan dan membiarkan kalimat bersambung ke ayat berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: שֶׁהָיָה לָנוּ
  choice: tidak berpihak kepada kita
  rationale: Menyampaikan secara alami idiom Ibrani ‘tidak ada bagi kita’, yakni hadir untuk mendukung atau membela Israel.
- source_word: יֹאמַר נָא
  choice: biarlah ... sekarang berkata
  rationale: Mencerminkan bentuk ajakan dengan partikel נָא dan mempertahankan fungsi retorisnya.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mempertahankan nama umat dalam teks sumber tanpa parafrasa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; bentuk ‘Yahweh’ mempertahankan rujukan itu tanpa menggantinya dengan gelar.
- issue: Makna שֶׁהָיָה לָנוּ
  choice: tidak berpihak kepada kita
  alternative: tidak ada bagi kita; tidak menyertai kita
  rationale: ‘Berpihak kepada kita’ menyampaikan dukungan ilahi yang dimaksud oleh idiom tersebut dalam bahasa Indonesia yang wajar, sedangkan bentuk harfiahnya dicatat agar citra sumber tetap terlihat.
- issue: Hubungan Daud dengan mazmur dalam לְדָוִד
  choice: Dari Daud
  alternative: Oleh Daud; Untuk Daud; Mengenai Daud
  rationale: Preposisi לְ dalam judul mazmur tidak dengan sendirinya menetapkan hanya satu hubungan; terjemahan ringkas ini mengikuti bentuk judul tradisional tanpa memberi penjelasan dogmatis tentang kepengarangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah pada akhir ayat dipertahankan karena syarat berlawanan dengan kenyataan ini baru dilengkapi dalam ayat berikutnya.
