lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Dalam rumusan pujian kepada Allah, “Terpujilah” merupakan ungkapan bahasa Indonesia yang alami dan khidmat. Kata ini menyampaikan daya doksologis bentuk partisip pasif Ibrani, meskipun secara lebih harfiah dapat diterjemahkan “Diberkatilah”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama pribadi Allah dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: שֶׁלֹּא
  choice: yang tidak
  rationale: Frasa ini secara alami menghubungkan seruan pujian dengan tindakan Yahweh yang menjadi alasannya, tanpa memaksakan hubungan kausal yang lebih eksplisit.
- source_word: נְתָנָנוּ
  choice: menyerahkan kita
  rationale: Kata kerja נתן pada gambaran ancaman ini berarti memberikan atau membiarkan jatuh ke tangan pihak lain. “Menyerahkan” menyampaikan tindakan tersebut secara alami dalam bahasa Indonesia tanpa menghilangkan hasil penyelamatan yang sudah terjadi.
- source_word: טֶרֶף
  choice: sebagai mangsa
  rationale: Dalam hubungannya dengan “gigi mereka”, kata ini menggambarkan mangsa binatang buas, bukan sekadar jarahan atau makanan.
- source_word: לְשִׁנֵּיהֶם
  choice: kepada gigi mereka
  rationale: Terjemahan ini mempertahankan gambaran konkret tentang para musuh sebagai binatang pemangsa, alih-alih menjelaskannya menjadi ungkapan abstrak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Daya ungkapan בָּרוּךְ dalam pujian kepada Allah
  choice: Terpujilah
  alternative: Diberkatilah
  rationale: “Terpujilah” paling alami sebagai seruan doksologis dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah dan nuansa dasar bahasa Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan “sebagai mangsa kepada gigi mereka” sengaja mempertahankan metafora Ibrani yang tajam tentang musuh sebagai binatang buas.
