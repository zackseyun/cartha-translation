  yaml_path: translation/ot/psalms/124/006.yaml
  text: Blessed be Yahweh[a], who has not given us as prey to their teeth.
translation:
  language: id
  text: Diberkatilah Yahweh[a], yang tidak menyerahkan kita sebagai mangsa kepada gigi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Terpujilah Yahweh.” Rumusan berkat dalam bahasa Ibrani ini merupakan seruan doksologis.
