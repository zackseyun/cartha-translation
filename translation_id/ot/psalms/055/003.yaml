  source_fidelity: 'Terjemahan mengikuti struktur dan makna Ibrani dengan baik: dua frasa sebab dipertahankan, bentuk tunggal “musuh” dan “orang fasik” tidak diubah menjadi jamak, lalu bentuk jamak pada kata kerja (“mereka”) juga dipertahankan. “Menimpakan kesusahan kepadaku” menyampaikan היטil יָמִיטוּ serta objek אָוֶן secara tepat. “Dengan murka memusuhi aku” mencakup baik unsur amarah maupun permusuhan aktif dari יִשְׂטְמוּנִי.'
