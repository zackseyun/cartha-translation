  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: id
  text: karena suara musuh, karena tekanan orang fasik; sebab mereka menimpakan kesusahan kepadaku[a] dan dengan murka memusuhi aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menimpakan kejahatan kepadaku.” Kata Ibrani אָוֶן dapat berarti “kesusahan”, “malapetaka”, “kejahatan”, atau “kedurjanaan”, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל אוֹיֵב
  choice: karena suara musuh
  rationale: מִן dipahami secara kausal, sejajar dengan מִפְּנֵי. 'Suara' mempertahankan gambaran konkret bahasa Ibrani, sedangkan bentuk tunggal 'musuh' dipertahankan.
- source_word: מִפְּנֵי עָקַת רָשָׁע
  choice: karena tekanan orang fasik
  rationale: עָקָה menunjuk pada tekanan, kesesakan, atau penindasan. 'Tekanan' mempertahankan keluasan maknanya; רָשָׁע berbentuk tunggal dan diterjemahkan demikian.
- source_word: יָמִיטוּ עָלַי אָוֶן
  choice: mereka menimpakan kesusahan kepadaku
  rationale: Bentuk Hifil יָמִיטוּ menggambarkan sesuatu yang dibuat jatuh atau ditimpakan kepada pemazmur. אָוֶן di sini paling wajar menunjuk pada kesusahan atau malapetaka yang dikenakan kepadanya, tetapi dapat pula berarti kejahatan.
- source_word: וּבְאַף יִשְׂטְמוּנִי
  choice: dan dengan murka memusuhi aku
  rationale: אַף secara idiomatis berarti kemarahan atau murka. שׂטם menyatakan kebencian atau permusuhan yang aktif; 'memusuhi' mempertahankan nuansa itu tanpa sekadar menyatakan perasaan.
