  terminology: “Orang fasik” merupakan padanan yang mapan dan sesuai untuk רָשָׁע. “Kesusahan” adalah pilihan kontekstual yang baik untuk אָוֶן; catatan kaki dengan tepat mempertahankan kemungkinan “kejahatan” tanpa memaksakannya sebagai arti utama. “Murka” dan “memusuhi” memadai untuk אַף dan שׂטם.
