  text: הִ֭נֵּה אַרְחִ֣יק נְדֹ֑ד אָלִ֖ין בַּ/מִּדְבָּ֣ר סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/007.yaml
  text: Look[a], I would wander far away; I would lodge in the wilderness[c][b]. Selah
translation:
  language: id
  text: Sesungguhnya, aku hendak pergi mengembara jauh; aku hendak bermalam di padang belantara.[a] Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku hendak melarikan diri jauh-jauh; aku hendak menginap di padang belantara.” Bahasa Ibrani menggabungkan kata kerja yang berarti menjauh dengan bentuk kata dari akar yang dapat berarti mengembara atau melarikan diri.
    reason: lexical_alternative
  - marker: b
    text: “Sela” secara tradisional tidak diterjemahkan. Makna tepatnya tidak pasti; mungkin merupakan petunjuk musik atau liturgis.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Partikel ini menarik perhatian dan menegaskan pernyataan yang menyusul. 'Sesungguhnya' mempertahankan nuansa itu dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: אַרְחִיק נְדֹד
  choice: aku hendak pergi mengembara jauh
  rationale: Bentuk hiphil dari רחק menyatakan pergi atau menjauh, sedangkan infinitif נְדֹד memberi nuansa mengembara atau melarikan diri. Gabungan ini dipertahankan tanpa membatasi maknanya hanya pada pelarian.
- source_word: אָלִין
  choice: aku hendak bermalam
  rationale: Kata kerja לין/לון lazim berarti bermalam atau menginap. 'Bermalam' menyampaikan makna konkret dan alami dalam bahasa Indonesia.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר dapat menunjuk wilayah liar, stepa, atau gurun, bukan semata-mata gurun pasir. 'Padang belantara' mempertahankan cakupan makna tersebut.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna istilah ini tidak pasti; transliterasi mempertahankan bentuk tradisional tanpa menerka fungsi khususnya.
