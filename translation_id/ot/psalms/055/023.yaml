id: PSA.55.23
reference: Psalms 55:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/023.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: id
  text: Tetapi Engkau, ya Allah, akan menurunkan mereka ke lubang kebinasaan[a]. Orang-orang yang menumpahkan darah dan melakukan penipuan tidak akan mencapai separuh umur mereka[b]. Namun, aku akan percaya kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “lubang kehancuran”, “liang kubur”, atau “lubang kebusukan”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak akan membagi dua hari-hari mereka”; maksudnya, hidup mereka akan terputus sebelum waktunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה אֱלֹהִים
  choice: Tetapi Engkau, ya Allah
  rationale: Pronomina yang ditegaskan membentuk kontras antara tindakan Allah dan kepercayaan pemazmur. Partikel וְ diterjemahkan “Tetapi” sesuai fungsi kontrasnya, sedangkan “ya” membuat sapaan kepada Allah alami dalam bahasa Indonesia.
- source_word: תּוֹרִידֵם
  choice: akan menurunkan mereka
  rationale: Bentuk Hifil dari ירד menyatakan kausatif, yakni menyebabkan mereka turun. “Menurunkan mereka” mempertahankan daya kausatif tanpa menambahkan cara penghukuman yang tidak disebutkan.
- source_word: לִבְאֵר שַׁחַת
  choice: ke lubang kebinasaan
  rationale: בְּאֵר berarti lubang atau sumur, sedangkan שַׁחַת dapat menunjuk pada kebinasaan, kehancuran, liang, atau kebusukan. Pilihan ini mempertahankan gambaran lubang sekaligus akibatnya yang membinasakan.
- source_word: אַנְשֵׁי דָמִים וּמִרְמָה
  choice: Orang-orang yang menumpahkan darah dan melakukan penipuan
  rationale: Ungkapan harfiah “orang-orang darah dan tipu daya” merupakan idiom bagi orang yang melakukan kekerasan berdarah dan penipuan. Rumusan verbal ini alami dan jelas bagi pembaca Indonesia.
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: tidak akan mencapai separuh umur mereka
  rationale: חצה secara dasar berarti membagi menjadi dua. Dalam ungkapan ini, maksudnya ialah hidup mereka terputus sebelum mencapai separuh umur yang diharapkan; terjemahan ini mempertahankan citra “separuh” dan menyampaikan idiomnya dengan jelas.
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: Namun, aku akan percaya kepada-Mu
  rationale: 'Pronomina eksplisit אֲנִי menegaskan kontras: berbeda dari nasib orang fasik, pemazmur tetap menaruh kepercayaannya kepada Allah. Bentuk imperfek diterjemahkan “akan percaya” sebagai pernyataan tekad dan keyakinan.'
theological_decisions:
- issue: Makna gambaran “lubang kebinasaan”
  choice: Dipertahankan sebagai gambaran penghukuman ilahi yang berujung pada kematian atau kebinasaan, tanpa dijadikan istilah teknis bagi neraka.
  alternative: liang kubur; lubang kehancuran; lubang kebusukan
  rationale: Bahasa Ibrani mengandung gambaran yang kuat tetapi tidak menentukan satu konsep eskatologis teknis. Karena itu, terjemahan mempertahankan daya penghakimannya tanpa mempersempit makna secara doktrinal.
- issue: Pernyataan bahwa pelaku kekerasan dan penipuan tidak mencapai separuh umur
  choice: Diterjemahkan sebagai pemendekan hidup mereka dalam konteks penghakiman Allah.
  alternative: Dipahami secara sangat harfiah sebagai tidak membagi hari-hari mereka menjadi dua.
  rationale: Ungkapan Ibrani bersifat idiomatis dan menyatakan bahwa umur mereka akan terputus. Terjemahan tidak mengubahnya menjadi kaidah universal tentang usia kematian setiap orang fasik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Engkau” serta akhiran “-Mu” memakai huruf kapital sebagai konvensi penghormatan kepada Allah. Struktur kontras pada awal dan akhir ayat dipertahankan, sementara idiom Ibrani dijelaskan secara alami tanpa menghilangkan citra sumber.
