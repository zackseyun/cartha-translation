translation:
  language: id
  text: Kehancuran ada di tengah-tengahnya[a]; penindasan dan tipu daya tidak meninggalkan lapangan kotanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berbagai kejahatan yang mendatangkan kehancuran ada di tengah-tengahnya.” Kata benda Ibraninya berbentuk jamak, tetapi dapat dipahami secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “jalan-jalannya.” Istilah Ibrani ini dapat secara lebih khusus menunjuk pada lapangan atau ruang terbuka umum di dalam kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: Kehancuran
  rationale: Bentuk Ibrani ini jamak dan dapat menunjuk pada berbagai malapetaka atau kejahatan yang mendatangkan kehancuran. Nomina kolektif tunggal “kehancuran” terdengar alami dalam bahasa Indonesia dan mempertahankan gambaran kebobrokan yang merajalela di dalam kota.
- source_word: בְּקִרְבָּהּ
  choice: di tengah-tengahnya
  rationale: Secara harfiah berarti “di tengahnya.” Bentuk ini mempertahankan acuan pada kota yang dipersonifikasikan tanpa memaksakan pronomina bergender yang tidak alami dalam bahasa Indonesia.
- source_word: יָמִישׁ
  choice: tidak pernah meninggalkan
  rationale: Verba tunggal Ibrani menggambarkan penindasan dan tipu daya sebagai pasangan kolektif yang terus hadir. “Tidak pernah meninggalkan” menyampaikan keberlangsungan itu dengan wajar.
- source_word: מֵרְחֹבָהּ
  choice: lapangan kotanya
  rationale: רְחוֹב terutama dapat berarti ruang terbuka atau lapangan umum di dalam kota, bukan semata-mata jaringan jalan. “Lapangan kota” mempertahankan latar ruang publik perkotaan.
- source_word: תֹּךְ
  choice: penindasan
  rationale: Dalam konteks kejahatan sosial di ruang publik kota, kata ini dapat berarti penindasan atau pemerasan. “Penindasan” cukup luas, jelas, dan sesuai dengan konteks.
- source_word: וּמִרְמָה
  choice: dan tipu daya
  rationale: מִרְמָה mencakup penipuan, kelicikan, atau pengkhianatan. “Tipu daya” merupakan padanan Indonesia yang alami dan cocok berpasangan dengan “penindasan.”
