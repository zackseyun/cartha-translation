source:
  edition: WLC
  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: id
  text: Ia mengulurkan kedua tangannya melawan orang-orang yang hidup damai dengannya[a]; ia mencemarkan perjanjiannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melawan sahabat-sahabatnya” atau “melawan sekutu-sekutunya.” Ungkapan Ibrani menunjuk kepada orang-orang yang mempunyai hubungan damai dengannya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ia melanggar perjanjiannya.” Kata kerja Ibrani secara lebih harfiah berarti “mencemarkan” atau “memperlakukan sebagai sesuatu yang najis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח יָדָיו
  choice: mengulurkan kedua tangannya
  rationale: Ungkapan ini mempertahankan gambaran konkret tindakan mengulurkan tangan dengan maksud bermusuhan. Bentuk Ibrani memakai bentuk jamak ‘tangan-tangannya’; ‘kedua tangannya’ merupakan ungkapan Indonesia yang alami bagi tangan seorang manusia.
- source_word: בִּשְׁלֹמָיו
  choice: melawan orang-orang yang hidup damai dengannya
  rationale: שָׁלוֹם di sini menunjuk pada hubungan damai. Kata depan diterjemahkan ‘melawan’ karena konteks dan ungkapan mengulurkan tangan menyatakan tindakan bermusuhan.
- source_word: חִלֵּל
  choice: mencemarkan
  rationale: Bentuk piel dari חלל berarti memperlakukan sesuatu sebagai cemar atau tidak kudus. ‘Mencemarkan’ mempertahankan bobot moral-religiusnya tanpa terdengar terlalu teknis.
- source_word: בְּרִיתוֹ
  choice: perjanjiannya
  rationale: בְּרִית lazim berarti ‘perjanjian’. Akhiran orang ketiga dipertahankan, tanpa menentukan lebih jauh apakah ini perjanjian dengan Allah atau perjanjian antarmanusia.
theological_decisions:
- issue: Sifat perjanjian yang dimaksud
  choice: perjanjiannya
  alternative: kesepakatannya; ikatannya
  rationale: Konteks mengecam pengkhianatan seorang rekan, tetapi tidak secara tegas menyebut perjanjian ilahi. ‘Perjanjiannya’ mempertahankan bobot istilah perjanjian tanpa menambahkan rujukan teologis yang tidak dinyatakan.
- issue: Bobot moral kata חִלֵּל
  choice: mencemarkan
  alternative: melanggar
  rationale: ‘Mencemarkan’ menjaga nuansa memperlakukan sesuatu sebagai najis atau tidak kudus, sedangkan ‘melanggar’ menyampaikan akibat tindakannya dengan lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel ayat dipertahankan; titik koma menghubungkan tindakan bermusuhan dengan pengkhianatan perjanjian. Ungkapan ‘hidup damai dengannya’ dipilih agar relasi damai tetap jelas bagi pembaca umum.
