  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: id
  text: Allah akan mendengar dan merendahkan mereka—Dia yang bertakhta sejak dahulu kala (Sela). Mereka tidak mengalami perubahan dan tidak takut kepada Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁמַע
  choice: akan mendengar
  rationale: Bentuk imperfek Qal dapat menyatakan masa depan atau tindakan yang biasa terjadi; dalam konteks doa ini, bentuk masa depan mengungkapkan keyakinan pemazmur bahwa Allah akan bertindak.
- source_word: אֵל
  choice: Allah
  rationale: Sebutan ilahi yang umum dalam puisi Ibrani; “Allah” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: וְיַעֲנֵם
  choice: dan menjawab mereka
  rationale: Vokalisasi teks Masoret menunjuk pada verba Qal yang secara langsung berarti “menjawab mereka.” Dalam konteks ini jawaban Allah dapat berupa tindakan penghakiman, tetapi unsur itu tidak dibuat eksplisit dalam teks utama.
- source_word: וְיֹשֵׁב קֶדֶם
  choice: Dia yang bertakhta sejak dahulu kala
  rationale: Partisipel יֹשֵׁב dapat berarti duduk atau berdiam; ketika merujuk kepada Allah, “bertakhta” secara wajar menyampaikan nuansa pemerintahan-Nya. קֶדֶם menunjuk pada zaman lampau atau purbakala.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal yang makna tepatnya tidak pasti dipertahankan sebagai transliterasi yang lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: sebab mereka tidak mengalami perubahan nasib
  rationale: חֲלִיפוֹת dapat menunjuk pada perubahan, pergantian, atau pembalikan keadaan. “Perubahan nasib” menyampaikan kemungkinan bahwa hidup mereka tetap tenteram sehingga mereka menjadi lengah, tanpa menutup kemungkinan arti yang lebih umum.
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: dan tidak takut kepada Allah
  rationale: 'Bentuk perfektif Ibrani di sini paling alami dipahami sebagai keadaan atau sikap menetap: mereka tidak memiliki rasa takut dan hormat kepada Allah.'
theological_decisions:
- issue: Makna וְיַעֲנֵם dalam konteks penghakiman
  choice: Allah akan “menjawab mereka,” dengan kemungkinan bahwa jawaban itu berbentuk penghakiman
  alternative: Allah akan merendahkan atau menindas mereka
  rationale: Vokalisasi Masoret paling langsung mendukung “menjawab,” sedangkan konteks mengenai para pelaku kejahatan memungkinkan tindakan penghukuman. Teks utama mengikuti bentuk yang tervokalisasi dan catatan kaki mempertahankan kemungkinan yudisial.
- issue: Hubungan ketiadaan perubahan dengan tidak takut kepada Allah
  choice: Menyatakan bahwa mereka tidak mengalami perubahan nasib, tanpa menjelaskan hubungan sebab-akibat lebih jauh
  alternative: Menyatakan bahwa mereka tidak bertobat atau tidak berubah secara moral
  rationale: חֲלִיפוֹת biasanya menunjuk pada perubahan atau pembalikan, dan tidak secara eksplisit berarti pertobatan. Terjemahan mempertahankan ketegangan antara keadaan hidup yang stabil dan sikap tidak takut kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bertakhta” mempertahankan nuansa kerajaan dalam ungkapan puitis, sedangkan “sejak dahulu kala” tetap mudah dipahami. Tanda pisah menjaga sisipan mengenai Allah yang kekal serta jeda liturgis tanpa memecah ayat menjadi pernyataan yang tidak berkaitan.
