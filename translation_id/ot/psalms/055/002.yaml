  register: Bahasa Indonesia baku modern dengan nada doa yang mendesak dan bermartabat. Pengulangan 'aku' dipertahankan untuk kejelasan dan tekanan emosional; partikel '-lah' menyampaikan bentuk permohonan imperatif secara alami.
