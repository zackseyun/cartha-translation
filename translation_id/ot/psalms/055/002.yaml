  text: הַקְשִׁ֣יבָ/ה לִּ֣/י וַ/עֲנֵ֑/נִי אָרִ֖יד בְּ/שִׂיחִ֣/י וְ/אָהִֽימָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/002.yaml
  text: Pay attention to me and answer me[a]; I am restless in my complaint[b], and I moan.
translation:
  language: id
  text: Dengarkanlah aku dengan saksama dan jawablah aku. Aku gelisah[a] dalam keluh kesahku[b], dan aku mengerang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku mengembara dengan gelisah.” Kata kerja Ibrani ini dapat menggambarkan gerak tanpa ketenangan atau kegelisahan karena tekanan.
    reason: lexical_alternative
  - marker: b
    text: “Keluh kesah” juga dapat diterjemahkan “renungan” atau “permenungan”; konteks ratapan di sini mendukung arti keluhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Dengarkanlah ... dengan saksama
  rationale: Bentuk perintah dari קשׁב meminta tindakan mendengarkan dengan penuh perhatian. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan desakan permohonan tersebut.
- source_word: לִּי
  choice: aku
  rationale: Pronomina orang pertama tunggal menjadi sasaran tindakan mendengarkan; dalam susunan bahasa Indonesia, maknanya dinyatakan secara alami dengan 'Dengarkanlah aku'.
- source_word: וַעֲנֵנִי
  choice: dan jawablah aku
  rationale: Kata ענה di sini berarti menjawab atau menanggapi. 'Jawablah aku' langsung, alami, dan sesuai dengan konteks doa.
- source_word: אָרִיד
  choice: Aku gelisah
  rationale: Kata kerja ini menggambarkan kegelisahan atau gerak tanpa ketenangan di bawah tekanan. 'Aku gelisah' menyampaikan keadaan batin pemazmur tanpa menutup kemungkinan nuansa mengembara dengan resah, yang dicatat dalam catatan kaki.
- source_word: בְּשִׂיחִי
  choice: dalam keluh kesahku
  rationale: שׂיח dapat menunjuk pada renungan, percakapan batin, atau keluhan. Dalam konteks ratapan ini, 'keluh kesah' paling alami dan menonjolkan ucapan yang lahir dari kesusahan.
- source_word: וְאָהִימָה
  choice: dan aku mengerang
  rationale: המה dapat berarti mengeluarkan bunyi, bergumam, menggeram, atau mengerang. Dalam konteks ratapan, 'mengerang' mempertahankan gambaran penderitaan yang terdengar.
