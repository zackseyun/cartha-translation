source:
  edition: WLC
  text: הַשְׁלֵ֤ךְ עַל יְהוָ֨ה יְהָבְ/ךָ֮ וְ/ה֪וּא יְכַ֫לְכְּלֶ֥/ךָ לֹא יִתֵּ֖ן לְ/עוֹלָ֥ם מ֗וֹט לַ/צַּדִּֽיק־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: id
  text: Serahkanlah bebanmu kepada Yahweh[a], dan Dia akan menopangmu; Dia tidak akan pernah membiarkan orang benar[b] goyah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nasibmu”, “kekhawatiranmu”, atau mungkin “apa yang telah diberikan-Nya kepadamu”. Kata benda Ibrani ini langka dan dapat menunjuk lebih luas pada apa yang ditanggungkan kepada seseorang.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bentuk Ibraninya tunggal: “orang benar”; bentuk tunggal ini kemungkinan mewakili setiap orang yang benar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: Serahkanlah
  rationale: Bentuk imperatif dari שלך secara harfiah menggambarkan tindakan melemparkan sesuatu kepada pihak lain. Dalam bahasa Indonesia, “serahkanlah” terdengar alami dalam nasihat ini sambil tetap menyatakan pemindahan beban kepada Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: יְהָבְךָ
  choice: bebanmu
  rationale: Nomina langka ini menunjuk pada sesuatu yang ditanggungkan kepada seseorang. “Bebanmu” paling sesuai dengan janji bahwa Allah akan menopang, sementara kemungkinan arti lain dipertahankan dalam catatan kaki.
- source_word: יְכַלְכְּלֶךָ
  choice: Dia akan menopangmu
  rationale: Verba כלכל dapat berarti menopang, memelihara, atau menyediakan kebutuhan. “Menopangmu” mempertahankan citra dukungan yang selaras dengan konteks.
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: Dia tidak akan pernah membiarkan
  rationale: Gabungan negasi, נתן, dan לְעוֹלָם mengungkapkan bahwa Yahweh tidak akan mengizinkan keadaan berikutnya berlangsung; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: מוֹט
  choice: goyah
  rationale: Kata ini menyatakan ketidakstabilan, tergelincir, atau terhuyung. “Goyah” mempertahankan metafora tanpa mempersempitnya menjadi keruntuhan total.
- source_word: לַצַּדִּיק
  choice: orang benar
  rationale: Adjektiva tunggal dengan artikel dipakai secara substantival dan kemungkinan bersifat representatif. “Orang benar” adalah padanan Indonesia yang alami dan tidak menambahkan penandaan gender yang tidak diperlukan oleh bahasa sasaran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut secara langsung.
- issue: Cakupan janji bahwa orang benar tidak akan goyah
  choice: Mempertahankan metafora “goyah” tanpa menjelaskannya sebagai bebas dari segala penderitaan
  alternative: tidak akan jatuh atau mengalami kesusahan
  rationale: מוֹט menyatakan ketidakstabilan, tetapi ayat ini tidak merinci bahwa orang benar tidak pernah mengalami penderitaan. Terjemahan tidak boleh menyelesaikan ketegangan teologis itu secara berlebihan.
- issue: Daya representatif bentuk tunggal לַצַּדִּיק
  choice: orang benar
  alternative: laki-laki yang benar
  rationale: Bentuk Ibraninya maskulin tunggal, tetapi berfungsi sebagai sebutan kelas atau tipe orang. Bahasa Indonesia tidak menandai gender gramatikal pada “orang”, sehingga terjemahan ini menjaga bentuk tunggal dan daya representatif tanpa menambahkan jenis kelamin biologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ajakan yang khidmat. “Serahkanlah” dipilih karena lebih idiomatis daripada “lemparkanlah” dalam konteks pastoral, sedangkan “menopangmu” dan “goyah” mempertahankan citra utama teks Ibrani. Semua penanda catatan kaki muncul dalam teks utama.
