  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: id
  text: Petang, pagi, dan tengah hari aku mengeluh[a] dan merintih, dan Ia mendengar suaraku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “mengeluh” juga dapat berarti “berbicara,” “merenung,” atau “mengutarakan isi hati.” Dalam konteks ratapan ini, makna keluhan paling mungkin.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani hanya mengatakan “dan ia mendengar suaraku.” Subjeknya tersirat dan, menurut konteks, merujuk kepada Allah. Ungkapan ini juga dapat diterjemahkan “dan Ia akan mendengar suaraku.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: Petang, pagi, dan tengah hari
  rationale: Mempertahankan rangkaian sejajar tiga waktu dalam bahasa Ibrani dengan irama yang alami dalam bahasa Indonesia.
- source_word: אָשִׂיחָה
  choice: aku mengeluh
  rationale: Kata kerja שׂיח dapat berarti merenung, berbicara, atau menyampaikan keluhan. Dalam konteks mazmur ratapan dan bersama kata berikutnya, makna mengeluh paling sesuai tanpa meniadakan kemungkinan leksikal lain.
- source_word: וְאֶהֱמֶה
  choice: dan merintih
  rationale: Kata המה menggambarkan bunyi yang timbul dari kegelisahan atau kesusahan. 'Merintih' menyampaikan unsur suara dan ratapan secara wajar.
- source_word: וַיִּשְׁמַע
  choice: dan Ia mendengar
  rationale: Bentuk verbal dalam puisi ini dapat menyatakan tindakan yang diyakini atau berulang. Bentuk kini Indonesia cocok dengan pola doa yang berlangsung dan keyakinan bahwa Allah mendengar.
- source_word: קוֹלִי
  choice: suaraku
  rationale: Terjemahan langsung dan idiomatis yang mempertahankan sifat permohonan yang diucapkan.
theological_decisions:
- issue: Subjek tersirat pada וַיִּשְׁמַע
  choice: Ia, dengan rujukan kepada Allah dijelaskan dalam catatan kaki
  alternative: TUHAN mendengar suaraku
  rationale: Bahasa Ibrani hanya memuat subjek orang ketiga tunggal maskulin; konteks menunjukkan bahwa yang dimaksud adalah Allah, tetapi nama ilahi tidak disebut dalam ayat ini.
- issue: Nilai waktu וַיִּשְׁמַע
  choice: mendengar
  alternative: akan mendengar / lalu mendengar
  rationale: Ungkapan puitis dapat dipahami sebagai keyakinan kini atau tindakan yang berulang, sementara bentuk masa depan juga mungkin. Terjemahan utama mengikuti pembacaan kebiasaan/keyakinan dan mencatat alternatifnya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Deret waktu dibuat sejajar; pilihan 'mengeluh dan merintih' menjaga sifat ratapan yang terdengar tanpa memperberat gaya.
