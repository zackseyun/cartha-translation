base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: id
  text: Kacaukanlah mereka[a], ya Tuhan; pecahbelahkanlah bahasa mereka[b], sebab aku telah melihat kekerasan dan perselisihan di kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Telanlah mereka, ya Tuhan” atau “Binasakanlah mereka, ya Tuhan.” Kata Ibrani ini dapat berarti secara lebih harfiah “menelan” atau membinasakan, tetapi di sini mungkin menunjuk pada penggagalan rencana mereka melalui kekacauan.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah “pecahbelahkanlah lidah mereka”; yakni, kacaukan kemampuan mereka untuk berbicara bersama atau saling memahami.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: Kacaukanlah mereka
  rationale: Secara harfiah verba ini biasanya berarti “telanlah” atau “binasakanlah”, tetapi kesejajarannya dengan perintah untuk memecah-belah bahasa mereka mendukung pengertian menggagalkan kesepakatan dan rencana mereka dengan menimbulkan kekacauan. Kemungkinan makna harfiah tetap dicantumkan dalam catatan kaki.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: אֲדֹנָי adalah gelar ilahi “Tuhan”, bukan nama YHWH. Partikel “ya” membuat sapaan langsung ini wajar dan khidmat dalam bahasa Indonesia.
- source_word: פַּלַּג
  choice: pecah-belahlah
  rationale: Bentuk perintah ini berarti membagi atau memisahkan. “Pecah-belahlah” menyampaikan tindakan yang merusak kesatuan komunikasi dan sesuai dengan konteks permohonan pemazmur.
- source_word: לְשׁוֹנָם
  choice: bahasa mereka
  rationale: Secara harfiah berarti “lidah mereka”, tetapi לָשׁוֹן juga lazim menunjuk pada bahasa atau kemampuan berkomunikasi. “Bahasa mereka” jelas dan alami dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi permohonan sebelumnya. “Sebab” ringkas dan sesuai dengan ragam puisi yang khidmat.
- source_word: רָאִיתִי
  choice: aku telah melihat
  rationale: Bentuk perfek menyatakan pengamatan yang sudah dialami dan kini menjadi dasar permohonan pemazmur.
- source_word: חָמָס
  choice: kekerasan
  rationale: Kata ini menunjuk pada kekerasan, kebrutalan, atau kejahatan yang disertai kekerasan. “Kekerasan” merupakan padanan yang langsung dan kuat dalam konteks ini.
- source_word: וְרִיב
  choice: dan perselisihan
  rationale: רִיב dapat berarti pertengkaran, sengketa, atau perselisihan. “Perselisihan” alami dalam bahasa Indonesia dan berpasangan baik dengan “kekerasan”.
- source_word: בָּעִיר
  choice: di kota
  rationale: Frasa lokatif ini secara langsung berarti “di kota”. Konteks tidak mengharuskan penambahan penjelasan lain.
theological_decisions:
- issue: Makna perintah pembuka בַּלַּע dalam hubungannya dengan “pecah-belahlah bahasa mereka”
  choice: Menerjemahkannya sebagai permohonan agar para pelaku dikacaukan dan kesatuan rencana mereka digagalkan.
  alternative: “Telanlah mereka, ya Tuhan” atau “Binasakanlah mereka, ya Tuhan.”
  rationale: Makna dasar verba itu bersifat destruktif, tetapi kesejajaran langsung dengan pemecahan bahasa mendukung nuansa pengacauan komunikasi, yang mungkin menggemakan peristiwa Babel. Karena makna harfiah atau destruktif tetap mungkin, ketegangan tersebut dipertahankan melalui catatan kaki dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. Bentuk perintah dengan akhiran -lah mempertahankan nada doa yang mendesak. “Aku” dipakai sebagai suara pribadi pemazmur, sedangkan “ya Tuhan” mempertahankan sapaan langsung kepada Allah.
