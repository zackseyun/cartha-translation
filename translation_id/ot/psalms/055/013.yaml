  text: וְ/אַתָּ֣ה אֱנ֣וֹשׁ כְּ/עֶרְכִּ֑/י אַ֝לּוּפִ֗/י וּ/מְיֻדָּֽעִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/013.yaml
  text: But you—a man as my equal[a], my companion, and my familiar friend.
translation:
  language: id
  text: Namun engkau—seorang laki-laki yang setara denganku, sahabat dekatku[a] dan kawan karibku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembimbingku”; istilah Ibrani ini dapat menunjuk seorang rekan dekat atau orang yang memimpin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Namun engkau
  rationale: Kata penghubung dan kata ganti ini menandai kontras tajam dengan konteks sebelumnya. “Namun engkau” menyampaikan daya adversatif sekaligus mempertahankan sapaan langsung.
- source_word: אֱנוֹשׁ
  choice: seorang laki-laki
  rationale: Kata ini menunjuk manusia dan dapat menyiratkan kefanaan atau kelemahan. Dalam konteks ini acuannya adalah seorang rekan laki-laki, dan tekanannya terletak pada pengkhianatan orang yang dekat, bukan pada kefanaannya.
- source_word: כְּעֶרְכִּי
  choice: yang setara denganku
  rationale: Ungkapan dari עֵרֶךְ menyatakan kesetaraan atau kedudukan yang sebanding. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna relasionalnya.
- source_word: אַלּוּפִי
  choice: sahabat dekatku
  rationale: Istilah ini dapat berarti rekan akrab, sahabat, atau pemimpin/pembimbing. Dalam pasangan dengan “kawan karibku”, konteks terutama menekankan kedekatan hubungan tanpa menutup kemungkinan arti alternatif.
- source_word: וּמְיֻדָּעִי
  choice: dan kawan karibku
  rationale: Bentuk yang berasal dari ידע ini menunjuk seseorang yang dikenal secara dekat atau akrab. “Kawan karibku” menyampaikan keintiman hubungan dan daya emosional ratapan dengan wajar.
