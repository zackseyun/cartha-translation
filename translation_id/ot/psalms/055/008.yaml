  text: Aku hendak bergegas menuju tempat perlindungan bagi diriku dari angin yang mengamuk, dari badai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִישָׁה
  choice: Aku hendak bergegas
  rationale: Bentuk kohortatif dari חוּשׁ menyatakan dorongan, tekad, atau keinginan pribadi untuk bertindak dengan segera. “Hendak bergegas” mempertahankan nuansa volitif tanpa menjadikannya sekadar pernyataan masa depan.
- source_word: מִפְלָט לִי
  choice: ke tempat perlindungan
  rationale: מִפְלָט dapat menunjuk pada pelarian maupun tempat perlindungan, sedangkan לִי menandai kepentingan pribadi pemazmur. Dalam bahasa Indonesia, “ke tempat perlindungan” paling alami setelah “bergegas”; unsur pribadi sudah jelas melalui subjek “Aku” dan dijelaskan dalam catatan kaki.
- source_word: מֵרוּחַ
  choice: menjauh dari angin
  rationale: רוּחַ di sini berarti “angin,” bukan “roh,” karena dipasangkan dengan gambaran badai. “Menjauh dari” menyampaikan gerak menuju perlindungan dari ancaman tersebut secara alami.
- source_word: סֹעָה
  choice: yang mengamuk
  rationale: Partisip ini menggambarkan gerakan angin yang keras atau bergelora. “Yang mengamuk” menghasilkan gambaran kuat dan alami tanpa mengulang kata “badai.”
- source_word: מִסָּעַר
  choice: dari badai
  rationale: סַעַר berarti badai atau prahara. Preposisi “dari” diulang untuk mempertahankan kesejajaran ungkapan Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata “Aku” sesuai dengan suara pribadi dalam mazmur; “hendak bergegas” mempertahankan urgensi dan nuansa kehendak. Pengulangan “dari” dipertahankan demi kesejajaran puitis.
