  yaml_path: translation/ot/psalms/055/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[a] of David[b].'
translation:
  language: id
  text: 'Untuk pemimpin musik: dengan alat musik petik. Maskil[a] Daud[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mazmur pengajaran” atau “nyanyian perenungan”; arti tepat Maskil dalam judul-judul mazmur tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini dapat berarti “oleh Daud”, “untuk Daud”, “milik Daud”, atau menunjukkan keterkaitan dengan Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, bentuk ini menunjuk kepada pemimpin atau pengawas musik. Pilihan ini alami dalam bahasa Indonesia modern dan awalan ל diterjemahkan sebagai “untuk”.
- source_word: בִּנְגִינֹת
  choice: dengan alat musik petik
  rationale: Istilah ini dalam judul mazmur kemungkinan menunjuk pada iringan alat musik berdawai. “Alat musik petik” menyampaikan jenis instrumennya secara alami tanpa menentukan alat tertentu.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Makna tepat istilah teknis atau jenis nyanyian ini tidak pasti. Transliterasi mempertahankan ketidakpastian tersebut, sedangkan kemungkinan maknanya dijelaskan dalam catatan kaki.
- source_word: לְדָוִד
  choice: Daud
  rationale: Konstruksi Indonesia “Maskil Daud” mempertahankan hubungan umum dengan Daud tanpa secara tegas menetapkan apakah mazmur ini ditulis oleh, diperuntukkan bagi, atau dikaitkan dengan Daud.
theological_decisions:
- issue: Hubungan yang dinyatakan oleh לְדָוִד
  choice: Daud
  alternative: oleh Daud; untuk Daud; milik Daud
  rationale: Preposisi ל dalam judul mazmur dapat menunjukkan kepengarangan, peruntukan, kepemilikan, atau keterkaitan. Bentuk utama sengaja tidak mempersempitnya menjadi klaim kepengarangan langsung.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. “Pemimpin pujian” dipilih sebagai istilah liturgis yang mudah dipahami; “Maskil” dipertahankan sebagai istilah teknis karena maknanya tidak pasti.
