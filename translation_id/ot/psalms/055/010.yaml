  text: Day and night they go around her on her walls[b][a], and trouble and misery are within her.
translation:
  language: id
  text: Siang dan malam mereka mengelilinginya di atas tembok-temboknya[a]; kejahatan dan kesusahan[b] ada di tengah-tengahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengepungnya di atas tembok-temboknya.” Kata kerja Ibrani dapat menekankan gerakan mengitari maupun tindakan mengepung.
    reason: lexical_alternative
  - marker: b
    text: “Kejahatan dan kesusahan” juga dapat diterjemahkan “kefasikan dan penindasan” atau “malapetaka dan penderitaan”; kedua istilah Ibrani dapat menunjuk kepada kejahatan moral maupun penderitaan yang ditimbulkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: Siang dan malam
  rationale: Pasangan waktu idiomatis ini menyatakan kegiatan yang terus-menerus. Ungkapan ini alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: יְסוֹבְבֻהָ
  choice: mereka mengelilinginya
  rationale: Bentuk dari סבב dapat berarti bergerak mengitari atau mengepung. 'Mengelilinginya' mempertahankan unsur gerak dan tidak menentukan lebih jauh subjek jamak yang tersirat dari konteks.
- source_word: עַל חוֹמֹתֶיהָ
  choice: di atas tembok-temboknya
  rationale: עַל secara langsung berarti 'di atas/pada'. Bentuk jamak חוֹמֹת dipertahankan, sementara akhiran feminin merujuk kepada kota yang dipersonifikasikan.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Kata ini dapat menunjuk kepada kejahatan, kefasikan, atau kesusahan yang ditimbulkannya. Dalam gambaran keadaan moral di dalam kota, 'kejahatan' mempertahankan sisi moral istilah tersebut tanpa meniadakan akibat buruknya.
- source_word: עָמָל
  choice: kesusahan
  rationale: Kata ini mencakup kesusahan, penderitaan, jerih payah, atau penindasan. 'Kesusahan' membedakannya dari אָוֶן sekaligus mempertahankan cakupan antara tindakan yang menindas dan penderitaan yang dihasilkannya.
- source_word: בְּקִרְבָּהּ
  choice: ada di tengah-tengahnya
  rationale: Terjemahan ini mengikuti arti harfiah 'di tengahnya' dan mempertahankan personifikasi feminin kota melalui akhiran '-nya' yang alami dalam bahasa Indonesia.
