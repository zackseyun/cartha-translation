  text: Fear and trembling come upon me[a], and horror covers me.
translation:
  language: id
  text: Ketakutan dan kegentaran menimpa aku, dan kengerian menyelubungi aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאָה
  choice: ketakutan
  rationale: Nomina ini berarti rasa takut atau kedahsyatan; “ketakutan” merupakan padanan langsung dan alami dalam konteks ini.
- source_word: וָרַעַד
  choice: dan kegentaran
  rationale: Kata ini menunjuk pada gemetar fisik akibat rasa takut; “kegentaran” mempertahankan unsur jasmani sekaligus emosional dan berpasangan alami dengan “ketakutan”.
- source_word: יָבֹא בִי
  choice: menimpa aku
  rationale: Secara harfiah berarti “datang ke/dalam diriku”; “menimpa aku” menyampaikan pengalaman yang datang menguasai pemazmur dengan bahasa Indonesia yang wajar.
- source_word: וַתְכַסֵּנִי
  choice: dan menyelubungi aku
  rationale: Berasal dari verba “menutupi”; “menyelubungi” mempertahankan metafora sesuatu yang menutupi pemazmur dan terdengar lebih alami daripada “menutupi aku” dalam konteks emosi.
- source_word: פַּלָּצוּת
  choice: kengerian
  rationale: Nomina ini dapat berarti kengerian, kedahsyatan, atau keadaan menggigil; “kengerian” menangkap intensitasnya dan cocok dengan metafora menyelubungi.
