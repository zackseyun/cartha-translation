  text: אֲ֭נִי אֶל אֱלֹהִ֣ים אֶקְרָ֑א וַ֝/יהוָ֗ה יוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: id
  text: Adapun aku, aku berseru[a] kepada Allah, dan Yahweh akan menyelamatkan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “aku akan berseru.”'
    reason: Bentuk kata kerja Ibrani dapat menyatakan tindakan kini atau mendatang.
lexical_decisions:
- source_word: אֲנִי
  choice: Adapun aku
  rationale: Kata ganti mandiri ini ditempatkan di awal untuk memberi penekanan atau kontras. “Adapun aku” mempertahankan daya tersebut secara alami dalam bahasa Indonesia.
- source_word: אֶל־אֱלֹהִים
  choice: kepada Allah
  rationale: Preposisi אֶל menyatakan arah seruan, sedangkan אֱלֹהִים di sini menunjuk kepada Allah yang esa dan sejajar dengan Yahweh pada klausa berikutnya.
- source_word: אֶקְרָא
  choice: aku berseru
  rationale: Bentuk imperfek Qal orang pertama tunggal dapat bernuansa kini, berulang, atau mendatang. “Berseru” menyampaikan tindakan memanggil Allah dalam doa dan lebih sesuai dengan konteks keluhan daripada sekadar “memanggil”.
- source_word: וַיהוָה
  choice: dan Yahweh
  rationale: Konjungsi diterjemahkan secara aditif, dan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian itu tetap tampak.
- source_word: יוֹשִׁיעֵנִי
  choice: akan menyelamatkan aku
  rationale: Bentuk Hifil dari ישׁע berarti menyelamatkan atau melepaskan. Bentuk mendatang menyatakan keyakinan pemazmur bahwa Yahweh akan bertindak baginya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar atau memilih bentuk transliterasi sekunder.
- issue: Nuansa waktu אֶקְרָא
  choice: aku berseru
  alternative: aku akan berseru
  rationale: Imperfek Ibrani memungkinkan nuansa kini maupun mendatang. Terjemahan utama membacanya sebagai seruan pemazmur yang sedang atau biasa dilakukan, sementara kemungkinan mendatang dicatat tanpa menutup ambiguitas gramatikal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Adapun aku” mempertahankan penekanan pada kata ganti yang diletakkan di depan, sedangkan pengulangan “aku” diperlukan agar klausa Indonesia tetap lengkap dan jelas.
