source:
  edition: WLC
  text: ישימות עָלֵ֗י/מוֹ יֵרְד֣וּ שְׁא֣וֹל חַיִּ֑ים כִּֽי רָע֖וֹת בִּ/מְגוּרָ֣/ם בְּ/קִרְבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: id
  text: Biarlah maut menimpa mereka[a]; biarlah mereka turun hidup-hidup ke Syeol[b], sebab kejahatan ada di tempat kediaman mereka[c], di tengah-tengah mereka[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah kebinasaan menimpa mereka,” “Kiranya maut datang dengan tiba-tiba atas mereka,” atau ungkapan serupa. Kata pembuka dalam bahasa Ibrani sulit dipahami, sehingga nuansanya tidak pasti.
    reason: textual_variant
  - marker: b
    text: Syeol adalah istilah Ibrani untuk ranah orang mati; dapat juga diterjemahkan “dunia orang mati” atau “kubur.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “di tempat tinggal mereka” atau “dalam pengembaraan mereka.”
    reason: lexical_alternative
  - marker: d
    text: Atau, “di dalam diri mereka” atau “di antara mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: Biarlah maut menimpa
  rationale: Kata pembuka dalam bahasa Ibrani sulit dan bentuknya tidak pasti. Dalam paralelisme dengan turunnya mereka hidup-hidup ke Syeol, kutukan yang memohon agar maut menimpa mereka paling sesuai; ketidakpastian nuansanya dipertahankan dalam catatan kaki.
- source_word: עָלֵימוֹ
  choice: mereka
  rationale: Preposisi dengan sufiks orang ketiga jamak tercakup secara alami dalam ungkapan Indonesia 'menimpa mereka'.
- source_word: יֵרְדוּ
  choice: biarlah mereka turun
  rationale: Konteks kutukan mendukung daya yusif; 'turun' mempertahankan citra gerak ke bawah.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan istilah Ibrani bagi ranah orang mati tanpa menyempitkannya menjadi kubur atau memasukkan konsep neraka.
- source_word: חַיִּים
  choice: hidup-hidup
  rationale: 'Bentuk ini berfungsi secara adverbial: mereka turun ketika masih hidup. ''Hidup-hidup'' merupakan ungkapan Indonesia yang alami dan tegas.'
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi kutukan yang baru diucapkan.
- source_word: רָעוֹת
  choice: kejahatan
  rationale: Dalam konteks ini menunjuk pada keburukan moral secara kolektif, bukan sekadar malapetaka.
- source_word: בִּמְגוּרָם
  choice: di tempat kediaman mereka
  rationale: Dalam konteks ini kemungkinan besar menunjuk pada tempat tinggal atau hunian mereka; alternatif makna dicatat.
- source_word: בְּקִרְבָּם
  choice: di tengah-tengah mereka
  rationale: Menggambarkan kejahatan yang hadir dalam lingkungan mereka sambil tetap membuka kemungkinan nuansa 'di dalam diri mereka'.
theological_decisions:
- issue: Makna שְׁאוֹל dalam terjemahan
  choice: Mempertahankan istilah Ibrani 'Syeol' dalam teks utama
  alternative: dunia orang mati; kubur
  rationale: Syeol merupakan gambaran puitis dan teologis khas Kitab Suci Ibrani. Transliterasi menjaga keluasan maknanya dan tidak menyamakannya secara dini dengan konsep 'neraka'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'biarlah' mempertahankan nada kutukan puitis; 'hidup-hidup' memberi ungkapan alami bagi keadaan saat turun. Istilah 'Syeol' dipertahankan dan dijelaskan melalui catatan kaki.
