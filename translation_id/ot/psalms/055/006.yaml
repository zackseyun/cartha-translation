  text: Lalu aku berkata[a], “Siapakah yang akan memberiku sayap seperti merpati? Aku akan terbang dan menetap.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Ah, sekiranya aku mempunyai sayap seperti merpati! Aku akan terbang dan menetap.”
    reason: Ungkapan מִי יִתֶּן לִּי berbentuk pertanyaan, tetapi secara idiomatis menyatakan kerinduan atau harapan. Alternatif ini mempertahankan nuansa itu tanpa menambahkan arah penerbangan atau makna yang tidak dinyatakan oleh וְאֶשְׁכֹּנָה.
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan alur dan memperkenalkan ucapan pemazmur; “lalu” alami dalam bahasa Indonesia tanpa menambahkan penafsiran.
- source_word: מִי יִתֶּן לִּי
  choice: Siapakah yang akan memberiku
  rationale: Mempertahankan bentuk pertanyaan Ibrani yang secara idiomatis menyatakan kerinduan, alih-alih langsung mengubahnya menjadi seruan pengandaian.
- source_word: אֵבֶר
  choice: sayap
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini dapat dipahami secara kolektif sebagai alat untuk terbang; “sayap” dalam bahasa Indonesia juga tidak menandai jumlah secara wajib.
- source_word: כַיּוֹנָה
  choice: seperti merpati
  rationale: Menerjemahkan perbandingan dengan jelas dan alami.
- source_word: אָעוּפָה
  choice: Aku akan terbang
  rationale: Bentuk kohortatif mengungkapkan hasrat atau tekad. Dalam rangkaian ungkapan kerinduan ini, “aku akan terbang” mempertahankan citra dan daya ujar tanpa memasukkan arah yang tidak dinyatakan secara eksplisit.
- source_word: וְאֶשְׁכֹּנָה
  choice: dan tinggal di tempat lain
  rationale: שכן berarti tinggal, menetap, atau berdiam. Tambahan “di tempat lain” membuat tujuan pelarian tersirat dapat dipahami secara alami dalam bahasa Indonesia, sedangkan nuansa kontekstual ‘beristirahat’ dicatat sebagai alternatif.
