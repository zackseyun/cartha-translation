  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַאֲזִ֣ינָ/ה אֱ֭לֹהִים תְּפִלָּתִ֑/י וְ/אַל תִּ֝תְעַלַּ֗ם מִ/תְּחִנָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/001.yaml
  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: id
  text: Dengarkanlah doaku, ya Allah, dan janganlah menyembunyikan diri dari permohonanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "jangan abaikan permohonanku." Ungkapan Ibrani secara harfiah berarti "menyembunyikan diri," yaitu menolak untuk memperhatikan doa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Dengarkanlah
  rationale: Bentuk imperatif dari אזן meminta perhatian sungguh-sungguh. Bahasa Indonesia tidak lazim memakai idiom harfiah 'berilah telinga'; 'dengarkanlah' menyampaikan maknanya secara alami sekaligus mempertahankan nada permohonan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Sapaan langsung kepada Allah Israel. 'Allah' adalah padanan baku אֱלֹהִים dalam Alkitab bahasa Indonesia; nama perjanjian YHWH tidak muncul di sini.
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: תְּפִלָּה adalah istilah umum untuk doa, dan bentuk berakhiran orang pertama tunggal berarti 'doaku'.
- source_word: וְאַל
  choice: dan janganlah
  rationale: Konjungsi וְ menghubungkan kedua permohonan, sedangkan אַל menyatakan larangan atau permohonan negatif.
- source_word: תִּתְעַלַּם
  choice: menyembunyikan diri
  rationale: Bentuk refleksif verba עלם secara kiasan menggambarkan tindakan membuat diri tidak terlihat atau tidak dapat dijangkau. Pilihan ini mempertahankan citraan Ibrani tanpa menggantinya langsung dengan tafsiran 'mengabaikan'.
- source_word: מִתְּחִנָּתִי
  choice: dari permohonanku
  rationale: תְּחִנָּה menunjuk pada permohonan sungguh-sungguh untuk belas kasihan atau kemurahan. 'Permohonanku' alami dan bermartabat, sedangkan 'dari' mempertahankan prefiks מִן.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah yang 'menyembunyikan diri'
  choice: Pertahankan ungkapan 'menyembunyikan diri'.
  alternative: Jangan abaikan permohonanku.
  rationale: Metafora relasional dalam teks sumber sengaja dipertahankan; catatan kaki menjelaskan makna pragmatisnya tanpa meniadakan citraan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. Partikel -lah mempertahankan nuansa permohonan yang khidmat tanpa terdengar kuno. Susunan 'Dengarkanlah doaku, ya Allah' lebih alami daripada meniru urutan kata Ibrani secara kaku.
