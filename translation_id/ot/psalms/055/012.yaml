  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: id
  text: Sebab, bukan musuh yang mencela aku[a]—kalau demikian, aku dapat menanggungnya; bukan orang yang membenci aku yang meninggikan diri terhadap aku[b]—kalau demikian, aku dapat bersembunyi darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghina aku” atau “mencerca aku.” Kata kerja Ibrani ini menunjuk pada penghinaan verbal yang merendahkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membesarkan diri terhadap aku”; maksudnya, bertindak angkuh terhadap aku.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi keluhan dalam konteks; “Sebab” alami dalam puisi Indonesia dan mempertahankan hubungan wacananya.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Padanan baku dan jelas untuk lawan atau orang yang memusuhi.
- source_word: יְחָרְפֵנִי
  choice: mencela aku
  rationale: חרף menunjuk pada penghinaan atau cercaan verbal. “Mencela aku” bermartabat dan mudah dipahami, sedangkan alternatif yang lebih keras dicatat dalam catatan kaki.
- source_word: וְאֶשָּׂא
  choice: kalau demikian, aku dapat menanggungnya
  rationale: נשׂא di sini berarti menanggung atau bertahan menghadapi sesuatu. Ungkapan “kalau demikian” mengungkapkan hubungan pengandaian tersirat, dan “-nya” secara wajar merujuk pada celaan tersebut.
- source_word: מְשַׂנְאִי
  choice: orang yang membenci aku
  rationale: Bentuk partisipial menyatakan seseorang yang membenci pemazmur; frasa ini lebih alami daripada bentuk nominal harfiah seperti “pembenciku”.
- source_word: עָלַי
  choice: terhadap aku
  rationale: Dalam gabungan ini, preposisi menunjukkan tindakan bermusuhan yang diarahkan kepada pemazmur.
- source_word: הִגְדִּיל
  choice: meninggikan diri
  rationale: Bentuk Hifil dari גדל dalam konteks ini menggambarkan seseorang yang membesarkan atau meninggikan dirinya dengan angkuh terhadap orang lain. Pilihan ini mempertahankan citra Ibrani tanpa menjadi kaku.
- source_word: וְאֶסָּתֵר
  choice: kalau demikian, aku dapat bersembunyi
  rationale: Bentuk Nifal menyatakan menyembunyikan diri. Hubungan pengandaian yang sama seperti klausa sebelumnya dinyatakan secara alami dengan “kalau demikian”.
- source_word: מִמֶּנּוּ
  choice: darinya
  rationale: Padanan pronominal yang ringkas dan alami untuk “dari dia” dalam bahasa Indonesia modern.
