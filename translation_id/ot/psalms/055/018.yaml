  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: id
  text: Ia telah menebus jiwaku dalam damai dari pertempuran melawan aku,[a] sebab banyak orang bersamaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari pertempuran melawan aku, sebab banyak orang melawan aku.” Secara harfiah, klausa terakhir berbunyi, “sebab mereka bersama aku dalam jumlah banyak,” tetapi dalam konteks ini dapat dipahami sebagai merujuk pada banyak lawan.
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  choice: telah menebus
  rationale: Kata kerja ini menunjuk pada penebusan atau pembebasan melalui penyelamatan. 'Telah menebus' mempertahankan daya ungkap Ibrani dan bentuk tindakan yang sudah terlaksana.
- source_word: בְשָׁלוֹם
  choice: dalam damai
  rationale: Terjemahan langsung ini mempertahankan cakupan makna damai, keutuhan, dan kesejahteraan tanpa mempersempitnya menjadi sekadar keselamatan.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Mempertahankan ungkapan puitis Ibrani; dalam konteks ini kata tersebut juga dapat mencakup hidup atau diri seseorang.
- source_word: מִקֲּרָב לִי
  choice: dari pertempuran melawan aku
  rationale: קְרָב berarti pertempuran atau pertarungan, sedangkan לִי dipahami secara kontekstual sebagai arah permusuhan terhadap pemazmur.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya.
- source_word: בְרַבִּים הָיוּ עִמָּדִי
  choice: banyak orang menyertai aku
  rationale: Ungkapan ini mempertahankan arti lazim עִמָּדִי, 'bersamaku', dalam bahasa Indonesia yang alami, sambil membiarkan ketegangan konteks dijelaskan melalui catatan kaki.
theological_decisions:
- issue: Penafsiran klausa akhir בְרַבִּים הָיוּ עִמָּדִי
  choice: sebab banyak orang menyertai aku
  alternative: sebab banyak orang melawan aku
  rationale: עִמָּדִי secara paling langsung berarti 'bersamaku'. Namun, konteks konflik memungkinkan pemahaman idiomatis bahwa lawan pemazmur berjumlah banyak. Teks utama mempertahankan arti langsung dan ambiguitas sumber, sedangkan kemungkinan adversatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. 'Jiwaku' dan 'dalam damai' mempertahankan citra serta keluasan makna Ibrani; susunan klausa akhir dibuat alami tanpa meniadakan ambiguitas teks sumber.
