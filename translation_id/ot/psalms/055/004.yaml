translation_notes:
  register: Bahasa Indonesia modern dengan ragam puitis yang bermartabat. “Maut” dipilih untuk nada mazmur, sedangkan “telah menimpa aku” mengungkapkan idiom Ibrani secara alami. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
