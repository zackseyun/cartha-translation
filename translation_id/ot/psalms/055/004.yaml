  text: לִ֭בִּ/י יָחִ֣יל בְּ/קִרְבִּ֑/י וְ/אֵימ֥וֹת מָ֝֗וֶת נָפְל֥וּ עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/004.yaml
  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: id
  text: Hatiku menggeliat dalam diriku[a], dan kengerian maut telah menimpa aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hatiku gemetar dalam diriku” atau “Hatiku menderita dalam batinku.” Kata kerja Ibrani ini dapat berarti menggeliat, gemetar, atau berada dalam kesesakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: hatiku
  rationale: לֵב menunjuk pada hati sebagai pusat batin, pikiran, dan emosi. “Hatiku” alami dalam puisi ratapan dan mempertahankan daya jasmaniah ungkapan Ibrani.
- source_word: יָחִיל
  choice: menggeliat
  rationale: Bentuk dari חול/חיל dapat menyatakan menggeliat, gemetar, atau berada dalam kesesakan. “Menggeliat” mempertahankan gambaran gejolak batin yang kuat tanpa meniadakan kemungkinan makna lain, yang dicatat dalam catatan kaki.
- source_word: בְּקִרְבִּי
  choice: dalam diriku
  rationale: קֶרֶב dengan akhiran orang pertama menunjuk pada bagian dalam diri; “dalam diriku” merupakan padanan Indonesia yang jelas dan puitis.
- source_word: אֵימוֹת
  choice: kengerian
  rationale: Bentuk jamak אֵימוֹת menyatakan kedahsyatan atau rasa ngeri yang melanda. Dalam bahasa Indonesia, nomina kolektif “kengerian” terdengar alami dan tetap menyampaikan bobot rasa takut yang sangat kuat.
- source_word: מָוֶת
  choice: maut
  rationale: “Maut” mempertahankan hubungan genitif dalam ungkapan “kengerian maut” dan sesuai dengan ragam puisi yang luhur tanpa menentukan apakah maut dipersonifikasikan.
- source_word: נָפְלוּ
  choice: telah menimpa
  rationale: Secara harfiah verba ini berarti “telah jatuh,” tetapi bersama עָלַי bahasa Indonesia paling alami memakai “telah menimpa,” yang juga menyampaikan tindakan selesai dengan akibat yang masih dirasakan.
- source_word: עָלָי
  choice: aku
  rationale: Makna preposisional “atas/ke atasku” tercakup secara idiomatis dalam verba Indonesia “menimpa aku.”
