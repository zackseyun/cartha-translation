  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: id
  text: Kata-kata yang keluar dari mulutnya licin[a], tetapi hatinya adalah perang; perkataannya lebih lembut daripada minyak, tetapi perkataan itu adalah pedang-pedang terhunus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kata-kata yang menyanjung keluar dari mulutnya.” Ungkapan Ibrani ini langka dan mungkin lebih khusus menggambarkan tutur kata yang semanis mentega atau penuh sanjungan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “pedang-pedang yang tercabut dari sarungnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: Kata-kata dari mulutnya licin
  rationale: Ungkapan Ibrani ini langka dan secara harfiah bernuansa sesuatu yang licin atau seperti mentega. Terjemahan ini mempertahankan gambaran tentang tutur kata yang terdengar menyenangkan tetapi menipu.
- source_word: וּקֲרָב לִבּוֹ
  choice: tetapi hatinya adalah perang
  rationale: קרב adalah nomina, 'pertempuran/perang'. Metafora ringkas dan tajam dalam bahasa Ibrani dipertahankan, alih-alih dijelaskan menjadi sekadar 'ia bermusuhan dalam hati'.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: perkataannya lebih lembut daripada minyak
  rationale: Bentuk verba menyatakan kelembutan dan konstruksi מִן menyatakan perbandingan. 'Minyak' menerjemahkan שמן secara langsung tanpa mempersempitnya menjadi minyak zaitun.
- source_word: וְהֵמָּה פְתִחוֹת
  choice: tetapi semuanya adalah pedang terhunus
  rationale: Pronomina jamak menunjuk kembali kepada perkataan-perkataannya. פְתִחוֹת dipahami secara idiomatis sebagai senjata yang terbuka atau telah dicabut dari sarungnya; 'pedang terhunus' menyampaikan ancaman yang siap melukai.
