  text: גָּלְמִ֤/י רָ֘א֤וּ עֵינֶ֗י/ךָ וְ/עַֽל סִפְרְ/ךָ֮ כֻּלָּ֪/ם יִכָּ֫תֵ֥בוּ יָמִ֥ים יֻצָּ֑רוּ ו/לא אֶחָ֣ד בָּ/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/016.yaml
  text: Your eyes saw my unformed substance[a], and in your book they all were written—the days that were formed[c][b], when not one of them yet existed.
translation:
  language: id
  text: 'Mata-Mu melihat wujudku yang belum terbentuk[a];

    dalam kitab-Mu semuanya tertulis—

    hari-hari yang dibentuk[b],

    ketika belum satu pun ada.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bakal tubuhku” atau “wujudku yang belum selesai.” Kata Ibrani ini menunjuk pada sesuatu yang belum terbentuk sepenuhnya.
    reason: lexical_alternative
  - marker: b
    text: “Dibentuk” juga dapat diterjemahkan “dijadikan.” Terjemahan “ditetapkan” lebih bersifat tafsiran daripada makna dasar verba Ibraninya.
    reason: lexical_alternative
  - marker: c
    text: 'Susunan bahasa Ibrani pada bagian ini sangat padat dan sulit. Kemungkinan terjemahan lain: “semuanya tertulis dalam kitab-Mu; hari-hari itu dibentuk, padahal belum satu pun ada.”'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלְמִי
  choice: wujudku yang belum terbentuk
  rationale: גֹּלֶם menunjuk pada sesuatu yang masih belum selesai atau belum terbentuk. Pilihan ini mempertahankan gambaran Ibrani tanpa memasukkan istilah biologis modern yang terlalu khusus.
- source_word: רָאוּ עֵינֶיךָ
  choice: Mata-Mu melihat
  rationale: Terjemahan langsung dan alami dari verba qatal dengan 'mata-Mu' sebagai subjek; bentuk lampau dipahami dari konteks puisi.
- source_word: וְעַל סִפְרְךָ
  choice: dalam kitab-Mu
  rationale: Walaupun עַל secara harfiah sering berarti 'di atas', bersama 'kitab' maksud idiomatisnya ialah sesuatu yang dicatat di dalam kitab.
- source_word: כֻּלָּם יִכָּתֵבוּ
  choice: semuanya tertulis
  rationale: Mempertahankan ungkapan ringkas dan pasif dari bahasa Ibrani. 'Tertulis' juga menjaga gambaran konkret tentang kitab tanpa memperjelas secara berlebihan anteseden 'semuanya'.
- source_word: יָמִים יֻצָּרוּ
  choice: hari-hari yang dibentuk
  rationale: יָמִים paling wajar menjelaskan 'semuanya', sedangkan יֻצָּרוּ berarti 'dibentuk' atau 'dijadikan'. Susunan ini mempertahankan citra pembentukan dan tidak memperkuatnya menjadi 'ditetapkan'.
- source_word: וְלֹא אֶחָד בָּהֶם
  choice: ketika belum satu pun ada
  rationale: Klausa Ibrani bersifat eliptis. Terjemahan ini mengungkapkan secara wajar bahwa belum satu pun dari hari-hari itu ada, sambil mempertahankan daya temporal konteks.
theological_decisions:
- issue: Apakah יֻצָּרוּ harus diterjemahkan dengan istilah yang secara tegas menyatakan penetapan ilahi
  choice: dibentuk
  alternative: ditetapkan; dirancang
  rationale: Makna dasar יצר adalah membentuk atau menjadikan. Ayat ini menggambarkan pengetahuan dan maksud Allah sebelumnya, tetapi terjemahan tidak perlu menyelesaikan ketegangan teologis dengan memakai istilah doktrinal yang lebih kuat daripada verba Ibrani.
- issue: Apakah frasa 'bagiku' perlu ditambahkan pada hari-hari yang dibentuk
  choice: Tidak menambahkan 'bagiku' dalam teks utama
  alternative: hari-hari yang dibentuk bagiku
  rationale: Hari-hari itu jelas berkaitan dengan pemazmur dalam konteks, tetapi unsur 'bagiku' tidak dinyatakan secara eksplisit dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Kapitalisasi pronomina untuk Allah mengikuti kebiasaan Alkitab bahasa Indonesia. Larik-larik pendek mempertahankan kesejajaran puisi, sedangkan catatan kaki menjaga ambiguitas leksikal dan sintaksis teks Ibrani.
