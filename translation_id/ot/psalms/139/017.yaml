  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לִ֗/י מַה יָּקְר֣וּ רֵעֶ֣י/ךָ אֵ֑ל מֶ֥ה עָ֝צְמוּ רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/017.yaml
  text: And to me[a], how precious are your thoughts, O God[b]; how vast is the sum of them!
translation:
  language: id
  text: Dan bagiku, betapa berharganya pikiran-pikiran-Mu[a], ya Allah; betapa besar jumlahnya[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sahabat-sahabat-Mu” atau “orang-orang yang berharga bagi-Mu.” Bentuk Ibrani רֵעֶיךָ dapat dipahami demikian, tetapi konteks tentang menghitung dan jumlah yang sangat banyak dalam ayat 17–18 lebih mendukung “pikiran-pikiran-Mu.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah “kepala-kepalanya.” Di sini ungkapan itu kemungkinan berarti “jumlahnya” atau “seluruh totalnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי
  choice: Dan bagiku
  rationale: Mempertahankan daya penghubung וְ sekaligus sudut pandang pribadi yang ditegaskan oleh לִי, dengan ungkapan Indonesia yang wajar.
- source_word: מַה יָּקְרוּ
  choice: betapa berharganya
  rationale: מַה bersifat seruan, sedangkan יקר menyatakan nilai atau keberhargaan; terjemahan ini alami dan mempertahankan nada takjub.
- source_word: רֵעֶיךָ
  choice: pikiran-pikiran-Mu
  rationale: Bentuk ini dapat dipahami sebagai 'sahabat-sahabat-Mu' atau 'orang-orang yang Kaukasihi', tetapi konteks penghitungan dan banyaknya dalam ayat 17–18 lebih mendukung arti 'pikiran-pikiran-Mu'.
- source_word: אֵל
  choice: ya Allah
  rationale: Dipahami sebagai sapaan langsung kepada Allah; 'ya Allah' menyampaikan fungsi vokatif secara alami dalam bahasa Indonesia.
- source_word: מֶה עָצְמוּ
  choice: betapa besar
  rationale: Seruan מֶה dan verba עצם di sini menyatakan besarnya atau sangat banyaknya sesuatu, sesuai konteks tentang hal-hal yang tidak terhitung.
- source_word: רָאשֵׁיהֶם
  choice: jumlahnya
  rationale: Secara harfiah berarti 'kepala-kepalanya', tetapi dalam konteks ini kemungkinan merupakan ungkapan untuk jumlah atau keseluruhan total.
theological_decisions:
- issue: Makna רֵעֶיךָ dalam ayat ini
  choice: pikiran-pikiran-Mu
  alternative: sahabat-sahabat-Mu; orang-orang yang Kaukasihi
  rationale: Kelanjutan pada ayat 18 berbicara tentang usaha menghitungnya dan jumlah yang melampaui pasir. Hal itu lebih kuat mendukung pengertian abstrak berupa pikiran atau maksud Allah, tetapi kemungkinan pembacaan personal tetap dicatat agar ambiguitas Ibrani tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan penuh kekaguman. Bentuk ulang 'pikiran-pikiran' dipakai untuk menegaskan kemajemukan yang kemudian dihitung; akhiran hormat ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
