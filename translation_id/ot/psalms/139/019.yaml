id: PSA.139.19
reference: Psalms 139:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם תִּקְטֹ֖ל אֱל֥וֹהַּ רָשָׁ֑ע וְ/אַנְשֵׁ֥י דָ֝מִ֗ים ס֣וּרוּ מֶֽ/נִּי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/019.yaml
  text: If only you would kill the wicked[a], O God, and you men of blood, depart from me.
translation:
  language: id
  text: Sekiranya Engkau membunuh orang fasik, ya Allah! Hai orang-orang penumpah darah,[a] menjauhlah dariku!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang darah,” yaitu orang-orang yang melakukan kekerasan atau pembunuhan.
    reason: Menjelaskan idiom Ibrani sambil mempertahankan citra “darah” dalam teks utama.
lexical_decisions:
- source_word: אִם
  choice: Sekiranya
  rationale: Pada awal seruan ini, אִם menyatakan harapan, bukan syarat biasa. “Sekiranya” menyampaikan keinginan kuat secara alami dan bermartabat.
- source_word: תִּקְטֹל
  choice: Engkau membunuh
  rationale: Bentuk imperfek orang kedua tunggal, bersama אִם, mengungkapkan tindakan yang diharapkan dari Allah. “Membunuh” mempertahankan ketegasan kata Ibrani tanpa memperhalusnya.
- source_word: אֱלוֹהַּ
  choice: ya Allah
  rationale: Nomina ini berfungsi sebagai sapaan langsung. “Ya Allah” merupakan bentuk vokatif yang alami dalam bahasa Indonesia modern.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini dapat bersifat generik atau kolektif. “Orang fasik” mempertahankan bentuk tunggal generik dan istilah moral yang lazim dalam register Alkitab Indonesia.
- source_word: וְאַנְשֵׁי דָמִים
  choice: Hai orang-orang penumpah darah
  rationale: Ungkapan harfiah “orang-orang darah” adalah idiom bagi orang yang melakukan kekerasan atau pembunuhan. “Penumpah darah” mempertahankan citra darah sekaligus memperjelas maknanya; וְ dipahami sebagai penghubung menuju sapaan langsung dan tidak perlu diterjemahkan secara kaku sebagai “dan”.
- source_word: סוּרוּ
  choice: menjauhlah
  rationale: Imperatif jamak סור memerintahkan para pelaku kekerasan agar pergi dari pemazmur. “Menjauhlah” menyatu secara alami dengan “dariku” dan mempertahankan daya perintahnya.
- source_word: מֶנִּי
  choice: dariku
  rationale: Preposisi dengan sufiks orang pertama tunggal secara langsung berarti “dari aku”; dalam bahasa Indonesia alami menjadi “dariku”.
theological_decisions:
- issue: Apakah permohonan agar Allah membunuh orang fasik perlu diperhalus
  choice: Mempertahankan permohonan langsung agar Allah membunuh orang fasik
  alternative: Mengalihkannya menjadi ramalan penghukuman atau memakai ungkapan lebih lunak seperti “menindak”
  rationale: Teks Ibrani menyatakan harapan imprekatoris dengan jelas. Terjemahan mempertahankan ketegangan teologisnya dan tidak mengurangi kekuatan kata קטל.
- issue: Hubungan antara orang fasik dan orang-orang penumpah darah
  choice: Mempertahankan peralihan dari permohonan kepada Allah menjadi sapaan langsung kepada para penumpah darah
  alternative: Menjadikan seluruh baris sebagai satu permohonan kepada Allah untuk menyingkirkan kelompok tersebut
  rationale: Bentuk סוּרוּ adalah imperatif jamak yang ditujukan langsung kepada “orang-orang penumpah darah,” sehingga perubahan pihak yang disapa perlu tetap tampak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Seruan “Sekiranya” dan sapaan “ya Allah” mempertahankan nada doa puitis; “Hai” menandai perubahan sasaran sapaan dengan jelas. Tanda seru mencerminkan daya emosional dan imperatif ayat tanpa menambahkan isi.
