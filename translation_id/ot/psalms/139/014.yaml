id: PSA.139.14
reference: Psalms 139:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֽוֹדְ/ךָ֗ עַ֤ל כִּ֥י נוֹרָא֗וֹת נִ֫פְלֵ֥יתִי נִפְלָאִ֥ים מַעֲשֶׂ֑י/ךָ וְ֝/נַפְשִׁ֗/י יֹדַ֥עַת מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/014.yaml
  text: I praise you[a], because I am fearfully and wonderfully made; wonderful are your works[b], and my soul knows it very well.
translation:
  language: id
  text: Aku memuji-Mu, sebab aku dijadikan dengan dahsyat dan ajaib[a]; ajaiblah karya-karya-Mu, dan jiwaku[b] sungguh mengetahuinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “aku dijadikan dengan cara yang membangkitkan rasa gentar dan takjub.” Kata Ibrani ini menyatakan kekaguman penuh takzim, bukan sekadar ketakutan atau teror.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jiwaku”; dalam konteks ini dapat juga berarti “diriku sendiri” atau “batinku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹדְךָ
  choice: Aku memuji-Mu
  rationale: Bentuk Hifil dari ידה dapat berarti mengucap syukur atau memuji. Dalam konteks pujian kepada Allah atas karya penciptaan-Nya, “memuji” paling tepat menangkap daya doksologisnya.
- source_word: עַל כִּי
  choice: sebab
  rationale: Gabungan ini memperkenalkan alasan pemazmur memuji Allah; “sebab” menyampaikan hubungan kausal secara jelas dan puitis.
- source_word: נוֹרָאוֹת
  choice: dengan dahsyat
  rationale: Kata dari akar ירא menyatakan sesuatu yang membangkitkan rasa gentar penuh takzim atau kekaguman. “Dahsyat” mempertahankan daya ungkap tersebut, sementara catatan kaki mencegah pemahaman sebagai teror semata.
- source_word: נִפְלֵיתִי
  choice: aku dijadikan ... ajaib
  rationale: Bentuk Nifal orang pertama tunggal dari פלא menyatakan keadaan luar biasa atau menakjubkan. Berdasarkan konteks langsung tentang pembentukan pemazmur (ay. 13, 15–16), “dijadikan” disuplai agar ungkapannya alami dalam bahasa Indonesia, tanpa menghilangkan nuansa keajaiban.
- source_word: נִפְלָאִים
  choice: ajaiblah
  rationale: Kata ini menggambarkan karya Allah sebagai luar biasa atau menakjubkan. Bentuk predikat yang didahulukan mempertahankan penekanan dan susunan puitis Ibrani.
- source_word: מַעֲשֶׂיךָ
  choice: karya-karya-Mu
  rationale: מַעֲשֶׂה dapat menunjuk pada perbuatan, pekerjaan, atau sesuatu yang dibuat. “Karya-karya-Mu” cukup luas untuk mencakup pembentukan pemazmur dan karya Allah pada umumnya.
- source_word: וְנַפְשִׁי
  choice: dan jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, diri, kehidupan, atau batin. “Jiwaku” mempertahankan citra puitis, sedangkan catatan kaki menjaga keluasan maknanya.
- source_word: יֹדַעַת מְאֹד
  choice: sungguh mengetahuinya
  rationale: Verba feminin tunggal bersesuaian dengan נַפְשִׁי. Objeknya tersirat dari konteks; enklitik “-nya” menyatakan objek tersirat itu secara alami, dan “sungguh” menyampaikan intensitas מְאֹד.
theological_decisions:
- issue: Nuansa antropologis נֶפֶשׁ
  choice: “jiwaku” dalam teks utama, dengan catatan bahwa artinya juga dapat berupa “diriku sendiri” atau “batinku”
  alternative: “diriku sendiri” atau “batinku”
  rationale: Bahasa puisi mendukung “jiwaku”, tetapi kata Ibrani itu tidak dengan sendirinya mengharuskan dualisme tubuh-jiwa yang ketat. Catatan kaki mempertahankan cakupan maknanya.
- issue: Subjek sebagai hasil karya penciptaan Allah dalam נִפְלֵיתִי
  choice: “aku dijadikan”
  alternative: “aku menjadi ajaib” atau “aku dibedakan secara menakjubkan”
  rationale: Konteks Mazmur 139 membahas tindakan Allah membentuk pemazmur. Penambahan “dijadikan” menjadikan kalimat alami dan masuk akal dalam bahasa Indonesia, tetapi tetap merupakan penjelasan kontekstual atas verba yang secara harfiah menekankan keadaan luar biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapital pada enklitik “-Mu” mengikuti kebiasaan penghormatan kepada Allah. Susunan “ajaiblah karya-karya-Mu” dipertahankan untuk mencerminkan penekanan Ibrani. Ungkapan “dengan dahsyat dan ajaib” bernada luhur dan mudah dikenali, dengan catatan kaki untuk menjelaskan bahwa “dahsyat” di sini menunjuk pada rasa gentar penuh takzim.
