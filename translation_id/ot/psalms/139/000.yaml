  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר יְהוָ֥ה חֲ֝קַרְתַּ֗/נִי וַ/תֵּדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. Yahweh[b], you have searched me and known me.
translation:
  language: id
  text: Untuk pemimpin musik[a]. Dari Daud[b]. Mazmur. Yahweh, Engkau telah menyelidiki aku dan mengenal aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kepada pemimpin musik”; preposisi Ibrani dalam judul mazmur dapat menunjukkan arah atau peruntukan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Untuk Daud”; ungkapan Ibrani ini dapat menunjukkan kepengarangan, peruntukan, atau keterkaitan dengan Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: מְנַצֵּחַ dalam judul mazmur menunjuk kepada orang yang memimpin pelaksanaan musik; לְ diterjemahkan “untuk” sambil mengakui bahwa preposisi itu juga dapat berarti arah atau peruntukan.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan tradisional dan alami dalam bahasa Indonesia, tetapi konstruksi Ibrani dengan לְ tidak dengan sendirinya menetapkan jenis hubungan Daud dengan mazmur ini.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku bahasa Indonesia bagi nyanyian religius yang diiringi musik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar, sehingga pembedaan dalam teks sumber tetap terlihat.
- source_word: חֲקַרְתַּנִי
  choice: Engkau telah menyelidiki aku
  rationale: חקר menyatakan pemeriksaan atau penyelidikan yang saksama; bentuk perfek diterjemahkan dengan “telah”.
- source_word: וַתֵּדָע
  choice: dan mengenal aku
  rationale: ידע dalam konteks ini menyatakan pengenalan pribadi yang dihasilkan atau ditegaskan oleh penyelidikan; objek “aku” yang tersirat dari klausa sebelumnya dinyatakan agar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan Daud dengan mazmur dalam לְדָוִד
  choice: Dari Daud
  alternative: Untuk Daud / Mengenai Daud
  rationale: Teks utama memakai bentuk judul yang lazim, sedangkan catatan kaki mempertahankan ambiguitas sumber mengenai kepengarangan, peruntukan, atau keterkaitan.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri dipertahankan untuk mencerminkan bentuk sumber secara langsung tanpa mengubahnya menjadi gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Pemimpin musik” dipilih karena lebih tepat dan lebih luas daripada istilah yang secara khusus menyiratkan paduan suara. Sapaan “Engkau” mempertahankan bentuk tunggal dan register doa yang wajar.
