  text: even there your hand will lead me, and your right hand will hold me fast.
translation:
  language: id
  text: bahkan di sana tangan-Mu akan menuntun aku, dan tangan kanan-Mu akan memegang aku erat-erat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם שָׁם
  choice: bahkan di sana
  rationale: Menjaga daya penegasan גַּם dan acuan tempat שָׁם secara alami dalam bahasa Indonesia.
- source_word: תַנְחֵנִי
  choice: akan menuntun aku
  rationale: Bentuk ini menyatakan tindakan tangan Allah yang membimbing atau menuntun pemazmur; susunan dengan objek terpisah tetap jelas dan puitis.
- source_word: וְתֹאחֲזֵנִי
  choice: dan ... akan memegang aku erat-erat
  rationale: אחז berarti memegang atau menggenggam; dalam konteks ini, 'erat-erat' menyampaikan nuansa pegangan yang kokoh tanpa menambahkan gagasan teologis baru.
- source_word: יְמִינֶךָ
  choice: tangan kanan-Mu
  rationale: Mempertahankan citra antropomorfis dan simbolis Ibrani secara langsung.
theological_decisions:
- issue: Apakah pegangan tangan kanan Allah ditafsirkan secara khusus sebagai perlindungan, penguasaan, atau penahanan
  choice: Mempertahankan ungkapan konkret 'memegang aku erat-erat'
  alternative: melindungi aku / menguasai aku
  rationale: Teks sumber menggunakan citra memegang dan tidak secara eksplisit menentukan satu fungsi saja; terjemahan tidak menyelesaikan ketegangan itu secara denominatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Kapital pada pronomina posesif untuk Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia; pengulangan 'tangan' dipertahankan untuk menjaga paralelisme Ibrani.
