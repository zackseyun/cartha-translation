lexical_decisions:
- source_word: אֲשֶׁר
  choice: mereka yang
  rationale: Partikel relatif ini memperkenalkan gambaran tentang orang-orang fasik. Dalam bahasa Indonesia, “mereka yang” menyambungkan ayat ini secara wajar dengan konteks sebelumnya.
- source_word: יֹאמְרֻךָ
  choice: membicarakan Engkau
  rationale: Bentuk אמר dengan sufiks orang kedua maskulin tunggal dapat berarti berkata kepada atau berbicara mengenai Allah. Konteks permusuhan dan frasa berikutnya mendukung pengertian berbicara mengenai Allah.
- source_word: לִמְזִמָּה
  choice: dengan niat jahat
  rationale: מְזִמָּה dapat menunjuk pada rencana, siasat, atau maksud jahat. Pilihan ini menyampaikan unsur kesengajaan dan kejahatan secara alami.
- source_word: נָשֻׂא
  choice: menyebut
  rationale: Secara harfiah verba ini berarti “mengangkat” atau “membawa”. Dalam pembacaan idiomatis נשׂא + שׁוא dengan objek “nama” yang tersirat, “menyebut” adalah ungkapan Indonesia yang alami, tanpa menyamarkan kesulitan teks yang dijelaskan dalam catatan kaki.
- source_word: לַשָּׁוְא
  choice: dengan sia-sia
  rationale: שָׁוְא mencakup kesia-siaan, kepalsuan, dan kehampaan. “Dengan sia-sia” mempertahankan ungkapan yang dikenal serta memungkinkan nuansa penyalahgunaan dan kepalsuan.
- source_word: עָרֶיךָ
  choice: musuh-musuh-Mu
  rationale: Walaupun bentuk konsonantalnya sulit dan dapat tampak seperti “kota-kota-Mu”, konteks dan pemahaman puitis yang lazim mendukung arti “lawan-lawan-Mu” atau “musuh-musuh-Mu”.
theological_decisions:
- issue: Objek dan arti idiom dalam klausa terakhir
  choice: musuh-musuh-Mu menyebut nama-Mu dengan sia-sia
  alternative: 'musuh-musuh-Mu mengangkat Engkau untuk kepalsuan; atau: mereka mengangkat untuk kepalsuan—lawan-lawan-Mu'
  rationale: Sintaksis Ibrani klausa terakhir sulit. Terjemahan utama memahami נשׂא + שׁוא secara idiomatis dan melengkapi “nama”, yang tidak tertulis secara eksplisit, demi bahasa Indonesia yang alami. Karena pelengkapan itu interpretatif, alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Kapitalisasi pada pronomina yang merujuk kepada Allah mengikuti register Alkitab Indonesia yang umum. Tanda catatan kaki ditempatkan pada akhir klausa yang dijelaskannya.
