  text: mereka yang membicarakan Engkau dengan niat jahat; musuh-musuh-Mu menyebut nama-Mu dengan sia-sia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka mengangkat lawan-lawan-Mu untuk kepalsuan,” atau, “mereka mengangkat secara palsu—lawan-lawan-Mu.” Klausa terakhir dalam teks Ibrani sulit dipahami, dan kata “nama” tersirat, bukan tertulis secara eksplisit.'
