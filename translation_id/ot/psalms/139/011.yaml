  text: And I said[a], “Surely darkness will cover me[b], and the night will be light around me.”
translation:
  language: id
  text: Lalu aku berkata, “Pastilah kegelapan akan menyelubungi aku[a], dan malam akan terang di sekelilingku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan meliputi aku,” “akan menguasai aku,” atau “akan meremukkan aku.” Kata kerja Ibrani ini jarang dipakai, dan nuansanya yang tepat di sini diperdebatkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan malam adalah terang di sekelilingku.” Klausa Ibrani ini tidak memiliki kata kerja tersurat sehingga dapat dipahami sebagai keadaan sekarang atau keadaan yang akan datang, bergantung pada hubungannya dengan perkataan pemazmur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk waw + qatal orang pertama tunggal paling langsung menyatakan refleksi lampau. 'Lalu' mengungkapkan kesinambungan wacana secara alami tanpa mengubahnya menjadi kalimat bersyarat.
- source_word: אַךְ
  choice: Pastilah
  rationale: Partikel ini memberi penegasan pada pikiran pemazmur, bukan pembatasan; 'pastilah' merupakan ungkapan Indonesia yang alami untuk keyakinan tersebut.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Padanan baku yang mempertahankan citra dan kontras dengan terang.
- source_word: יְשׁוּפֵנִי
  choice: akan menyelubungi aku
  rationale: Verba שׁוף jarang dan nuansanya diperdebatkan. Dengan kegelapan sebagai subjek, 'menyelubungi' cocok dengan citra spasial dan konteks, sambil mempertahankan kemungkinan bahwa pemazmur membayangkan dirinya tertutup dari pandangan.
- source_word: וְלַיְלָה
  choice: dan malam
  rationale: Mempertahankan konjungsi sederhana dan kesejajaran kedua bagian ayat.
- source_word: אוֹר
  choice: akan menjadi terang
  rationale: Klausa Ibrani tidak memiliki verba tersurat. Bentuk mendatang sesuai dengan pernyataan yang diproyeksikan oleh pemazmur dan alami dalam bahasa Indonesia.
- source_word: בַּעֲדֵנִי
  choice: di sekelilingku
  rationale: Dalam konteks ini, preposisi paling wajar menggambarkan malam yang berada atau melingkupi di sekitar penutur.
theological_decisions:
- issue: Hubungan ucapan pemazmur dengan konteks sebelumnya
  choice: 'Diterjemahkan sebagai pernyataan lampau: ''Lalu aku berkata'''
  alternative: '''Jika aku berkata'''
  rationale: Bentuk Ibrani secara gramatikal adalah waw + qatal, bukan konstruksi bersyarat. Terjemahan tidak memasukkan hubungan bersyarat yang hanya disimpulkan dari konteks.
- issue: Waktu klausa nominal tentang malam dan terang
  choice: '''akan menjadi terang'''
  alternative: '''adalah terang'''
  rationale: Bahasa Ibrani membiarkan waktu klausa ini tidak tersurat. Bentuk mendatang dipilih agar sejajar dengan bayangan yang sedang diutarakan, sedangkan catatan kaki mempertahankan kemungkinan waktu kini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa menjadi arkais. 'Menyelubungi' mempertahankan citra kegelapan yang menutupi penutur; ambiguitas verba langka dan waktu klausa nominal dijelaskan dalam catatan kaki. Semua penanda catatan kaki terdapat dalam teks utama.
