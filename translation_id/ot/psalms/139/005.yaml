  yaml_path: translation/ot/psalms/139/005.yaml
  text: You hem me in behind and before[a], and lay your hand upon me.
translation:
  language: id
  text: Engkau mengurung aku dari belakang dan dari depan, dan Engkau menaruh tangan-Mu atasku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Engkau mengelilingi aku” atau “Engkau mengepung aku”; kata kerja Ibrani ini dapat bernuansa netral atau melindungi, tetapi juga dapat memberi kesan menekan dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחוֹר
  choice: dari belakang
  rationale: Dalam pasangan dengan קֶדֶם, kata ini berfungsi secara spasial. 'Dari belakang' alami dalam bahasa Indonesia dan mempertahankan gambaran posisi.
- source_word: קֶדֶם
  choice: dari depan
  rationale: Dalam pertentangan dengan אָחוֹר, maknanya paling tepat dipahami secara spasial sebagai 'di depan', bukan secara temporal atau geografis. Pengulangan 'dari' membuat cakupan tindakan lebih jelas.
- source_word: צַרְתָּנִי
  choice: mengurung aku
  rationale: Kata kerja ini menyatakan tindakan mengepung atau menutup dari sekeliling. 'Mengurung' mempertahankan kemungkinan nuansa perlindungan maupun tekanan tanpa memilih salah satunya secara tegas.
- source_word: וַתָּשֶׁת
  choice: menaruh
  rationale: Padanan alami bagi tindakan meletakkan atau menempatkan sesuatu, khususnya dalam ungkapan 'menaruh tangan'.
- source_word: עָלַי
  choice: ke atasku
  rationale: Menyatakan arah atau posisi tangan di atas pemazmur. Bentuk ini tetap puitis namun dapat dipahami pembaca modern.
- source_word: כַּפֶּךָ
  choice: tangan-Mu
  rationale: Walaupun כַּף dapat berarti 'telapak tangan', ungkapan Indonesia secara alami memakai 'tangan' dan tetap mempertahankan citra antropomorfis.
theological_decisions:
- issue: Apakah gambaran dalam ayat ini harus terdengar melindungi, membatasi, atau keduanya
  choice: Mempertahankan ambivalensi tindakan ilahi dengan kata 'mengurung'.
  alternative: Terjemahan yang secara tegas melindungi ('menjaga') atau secara tegas mengancam ('mengepung').
  rationale: Konteks Mazmur 139 menggambarkan pengetahuan dan kehadiran Allah sebagai intim sekaligus meliputi segala sesuatu dan berpotensi terasa menekan. Kata Ibrani צַרְתָּנִי memungkinkan ketegangan tersebut tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan 'dari belakang dan dari depan' mempertahankan pasangan spasial Ibrani; kapitalisasi pronomina ilahi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia.
