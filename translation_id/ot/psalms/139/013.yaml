source:
  edition: WLC
  text: כִּֽי אַ֭תָּה קָנִ֣יתָ כִלְיֹתָ֑/י תְּ֝סֻכֵּ֗/נִי בְּ/בֶ֣טֶן אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/013.yaml
  text: For you formed my inward parts[b][a]; you wove me together in my mother’s womb.
translation:
  language: id
  text: Sebab Engkaulah yang membentuk[a] bagian-bagian terdalam diriku[b]; Engkau merajut aku[c] dalam rahim ibuku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat berarti ‘memperoleh’ atau ‘memiliki’.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ‘ginjal-ginjalku’, ungkapan Ibrani bagi bagian batin yang paling dalam.
    reason: cultural_note
  - marker: c
    text: Atau ‘menaungi aku’; secara lebih harfiah, ‘menutupi aku’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi pujian pada konteks sebelumnya dan mempertahankan hubungan sebab-akibat dalam alur puisi.
- source_word: קָנִיתָ
  choice: membentuk
  rationale: Dalam konteks pembentukan sebelum lahir, pilihan ini menyampaikan tindakan kreatif Allah secara wajar dalam bahasa Indonesia. Namun, makna dasar verba ini juga dapat berupa ‘memperoleh’ atau ‘memiliki’, sehingga alternatif itu dicatat.
- source_word: כִלְיֹתָי
  choice: bagian-bagian terdalam diriku
  rationale: Secara harfiah berarti ‘ginjal-ginjalku’, ungkapan Ibrani bagi sisi batin manusia yang paling dalam. Terjemahan ini mempertahankan gagasan kedalaman batin tanpa menghasilkan ungkapan anatomis yang membingungkan pembaca modern.
- source_word: תְּסֻכֵּנִי
  choice: Engkau merajut aku
  rationale: Akar סכך pada dasarnya berkaitan dengan menutupi atau menaungi. Dalam konteks rahim, ‘merajut’ secara puitis dan alami menggambarkan pembentukan yang rumit, sementara arti yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: בְּבֶטֶן אִמִּי
  choice: dalam rahim ibuku
  rationale: Ungkapan Indonesia yang alami dan tepat untuk lokasi pembentukan yang dinyatakan dalam teks Ibrani.
theological_decisions:
- issue: Bahasa tentang pembentukan sebelum kelahiran tanpa memasukkan rumusan doktrinal yang muncul kemudian
  choice: Ayat diterjemahkan sebagai penegasan puitis bahwa Allah terlibat langsung dalam pembentukan pemazmur di dalam rahim.
  alternative: 'Terjemahan lebih harfiah: ‘Engkau memperoleh/memiliki ginjal-ginjalku; Engkau menutupi aku dalam rahim ibuku.’'
  rationale: Pilihan ini mempertahankan kuatnya tindakan ilahi dalam teks, tetapi tidak memperluas ayat menjadi pernyataan doktrinal yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Penggunaan ‘Engkau’ mempertahankan sapaan langsung kepada Allah. Struktur dua klausa dan paralelisme Ibrani dipertahankan, sedangkan istilah yang berpotensi membingungkan dijelaskan melalui catatan kaki.
