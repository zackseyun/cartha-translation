  yaml_path: translation/ot/psalms/139/023.yaml
  text: Search me[a], God, and know my heart; test me and know my anxious thoughts.
translation:
  language: id
  text: Selidikilah aku, ya Allah, dan kenalilah hatiku; ujilah aku dan kenalilah pikiran-pikiran gelisahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pikiran-pikiranku yang meresahkan” atau “pikiran-pikiranku yang terbagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָקְרֵנִי
  choice: Selidikilah aku
  rationale: Kata kerja חקר menyatakan penyelidikan yang mendalam dan menyeluruh. “Selidikilah aku” alami dalam doa dan mempertahankan gambaran pemeriksaan batin.
- source_word: אֵל
  choice: ya Allah
  rationale: אֵל adalah sebutan ilahi yang di sini berfungsi sebagai sapaan langsung. Partikel “ya” menyatakan fungsi vokatif itu secara wajar dalam bahasa Indonesia.
- source_word: וְדַע
  choice: dan kenalilah
  rationale: ידע dalam bentuk imperatif meminta Allah mengenal atau mengetahui sepenuhnya. “Kenalilah” sesuai dengan objek pribadi dan dipertahankan pada kedua kemunculannya demi kesejajaran puitis.
- source_word: לְבָבִי
  choice: hatiku
  rationale: לֵבָב menunjuk pada pusat kehidupan batin, termasuk pikiran dan kehendak. “Hati” adalah padanan puitis yang lazim dan cukup luas dalam bahasa Indonesia.
- source_word: בְּחָנֵנִי
  choice: ujilah aku
  rationale: בחן mengandung gagasan menguji atau menilai, kadang seperti menguji kemurnian logam. “Ujilah aku” ringkas dan membedakannya dari חקר, “selidikilah”.
- source_word: שַׂרְעַפָּי
  choice: pikiran-pikiranku yang menggelisahkan
  rationale: Bentuk puitis שַׂרְעַפִּים dapat menunjuk pada pikiran yang meresahkan, bercabang, atau terbagi. Pilihan ini menyampaikan kegelisahan tanpa menutup nuansa leksikal lainnya, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa antropologis tentang kehidupan batin
  choice: Mempertahankan “hati” dan “pikiran-pikiran yang menggelisahkan” sebagai dua ungkapan yang berbeda.
  alternative: Menyatukannya menjadi satu istilah psikologis seperti “batin” atau menerjemahkan “hati” sebagai “pikiran”.
  rationale: Teks Ibrani memakai dua istilah berbeda dalam kesejajaran. Mempertahankan keduanya menjaga kedalaman puisi dan tidak mereduksi antropologi ayat ini ke kategori psikologis modern.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Pengulangan “kenalilah” dipertahankan untuk mencerminkan struktur puitis Ibrani; “pikiran-pikiranku yang menggelisahkan” dipilih agar nuansa bentuk jamak dan kegelisahan batin tetap terasa.
