  text: פלאיה דַ֣עַת מִמֶּ֑/נִּי נִ֝שְׂגְּבָ֗ה לֹא א֥וּכַֽל לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/006.yaml
  text: Such knowledge is too wonderful for me[a]; it is too high—I cannot attain it.
translation:
  language: id
  text: Pengetahuan itu terlalu ajaib bagiku; terlalu tinggi—aku tidak sanggup mencapainya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פלאיה
  choice: terlalu ajaib
  rationale: Bentuk ini menyatakan sesuatu yang luar biasa dan melampaui kemampuan pemahaman pemazmur. Frasa ini mempertahankan nuansa kekaguman sekaligus ketakterjangkauan.
- source_word: דַעַת
  choice: pengetahuan
  rationale: Nomina ini secara langsung berarti 'pengetahuan' dan dalam konteks menunjuk pada pengetahuan Allah yang digambarkan dalam ayat-ayat sebelumnya.
- source_word: מִמֶּנִּי
  choice: bagiku
  rationale: Secara harfiah dapat berarti 'dariku' atau 'melebihi aku'; bersama 'terlalu ajaib', ungkapan 'bagiku' menyampaikan bahwa hal itu melampaui kapasitas pribadi pemazmur.
- source_word: נִשְׂגְּבָה
  choice: terlalu tinggi
  rationale: Pilihan ini mempertahankan metafora ketinggian dari akar שׂגב serta gagasan bahwa pengetahuan tersebut tidak terjangkau.
- source_word: לֹא אוּכַל
  choice: aku tidak sanggup
  rationale: Menyatakan ketidakmampuan orang pertama secara alami dan tegas dalam bahasa Indonesia.
- source_word: לָהּ
  choice: mencapainya
  rationale: Pronomina berpreposisi ini secara harfiah berarti 'kepadanya'. Kata kerja yang tersirat dilengkapi sebagai 'mencapai', sesuai metafora sesuatu yang terlalu tinggi dan tidak terjangkau.
