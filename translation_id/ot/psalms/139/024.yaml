  text: וּ/רְאֵ֗ה אִם דֶּֽרֶךְ עֹ֥צֶב בִּ֑/י וּ֝/נְחֵ֗/נִי בְּ/דֶ֣רֶךְ עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/024.yaml
  text: And see whether there is any grievous way in me[b][a], and lead me in the everlasting way.
translation:
  language: id
  text: Lihatlah apakah ada jalan yang menyakitkan dalam diriku[a], dan tuntunlah aku di jalan yang kekal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan yang mendukakan”, “jalan yang menyinggung”; mungkin juga “jalan penyembahan berhala”.
    reason: lexical_alternative
  - marker: b
    text: Atau “jalan purbakala” atau “jalan abadi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאֵה
  choice: Lihatlah
  rationale: Bentuk imperatif ini meneruskan permohonan langsung kepada Allah. “Lihatlah” ringkas, alami, dan mempertahankan daya ungkap teks Ibrani.
- source_word: אִם
  choice: apakah ada
  rationale: Dalam konteks ini, אִם memperkenalkan pertanyaan tidak langsung, bukan syarat. “Apakah ada” merupakan ungkapan Indonesia yang wajar.
- source_word: דֶּרֶךְ עֹצֶב
  choice: jalan yang mendukakan
  rationale: דֶּרֶךְ mempertahankan metafora tentang perilaku atau cara hidup, sedangkan עֹצֶב dapat menunjuk pada rasa sakit, dukacita, atau sesuatu yang menyakiti. Pilihan ini mempertahankan keluasan maknanya tanpa membatasinya pada kefasikan atau penyembahan berhala.
- source_word: בִּי
  choice: dalam diriku
  rationale: Ungkapan ini menyatakan keberadaan batiniah dan terdengar alami dalam doa berbahasa Indonesia.
- source_word: וּנְחֵנִי
  choice: dan tuntunlah aku
  rationale: Kata kerja נחה berarti menuntun atau membimbing. “Tuntunlah” sesuai dengan gambaran jalan dan nada doa.
- source_word: בְּדֶרֶךְ עוֹלָם
  choice: di jalan yang kekal
  rationale: Preposisi ב dipertahankan sebagai “di”, yaitu jalan atau lingkup kehidupan tempat pemazmur memohon untuk dituntun. עוֹלָם di sini paling wajar menyatakan keberlangsungan tanpa akhir, meskipun dapat pula merujuk pada zaman purbakala.
theological_decisions:
- issue: Makna דֶּרֶךְ עֹצֶב
  choice: jalan yang mendukakan
  alternative: jalan yang menyakitkan; jalan yang menyinggung; jalan penyembahan berhala
  rationale: Frasa Ibrani ini sulit dan memiliki rentang makna yang mencakup rasa sakit, bahaya, atau dukacita; kaitan dengan penyembahan berhala juga pernah diajukan. Teks utama mempertahankan makna moral yang luas dan tidak mengunci penafsiran pada penyembahan berhala.
- issue: Makna דֶּרֶךְ עוֹלָם
  choice: jalan yang kekal
  alternative: jalan purbakala; jalan abadi
  rationale: “Jalan yang kekal” mempertahankan kedalaman temporal עוֹלָם dan kontras dengan jalan yang mendukakan, tanpa menutup kemungkinan bahwa ungkapan itu berarti jalan yang sudah ada sejak dahulu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora “jalan” dipertahankan pada kedua bagian ayat agar kontras puitis dan etis teks Ibrani tetap jelas.
