base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/003.yaml
  text: You sift out my path and my lying down[a], and you are acquainted with all my ways.
translation:
  language: id
  text: Engkau menampi jalanku dan saat aku berbaring; dan Engkau mengenal baik segala jalanku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרְחִי
  choice: jalanku
  rationale: Kata אָרַח menunjuk pada jalan atau lintasan. “Jalanku” mempertahankan gambaran konkret dan dapat pula menyiratkan perjalanan hidup.
- source_word: רִבְעִי
  choice: saat aku berbaring
  rationale: Bentuk ini mengacu pada tindakan berbaring atau merebahkan diri. Ungkapan temporal ini alami dalam bahasa Indonesia dan tidak membatasi maknanya menjadi tempat tertentu.
- source_word: זֵרִיתָ
  choice: Engkau menampi
  rationale: Kata kerja זרה membawa gambaran menampi atau menghamburkan untuk memisahkan, dan dalam konteks ini menyatakan pemeriksaan yang cermat. “Menampi” mempertahankan metafora Ibrani.
- source_word: כָל־דְּרָכַי
  choice: segala jalanku
  rationale: כָל menegaskan keseluruhan, sedangkan דֶּרֶךְ dapat berarti jalan maupun cara hidup. “Segala jalanku” mempertahankan kedua kemungkinan itu.
- source_word: הִסְכַּנְתָּה
  choice: Kaukenal baik
  rationale: Dalam konteks ini bentuk Hifil dari סכן menyatakan keakraban atau pengenalan yang mendalam. “Kaukenal baik” alami, jelas, dan tidak menambahkan uraian doktrinal.
theological_decisions:
- issue: Gambaran antropomorfis tentang pengetahuan Allah
  choice: Mempertahankan metafora konkret “menampi” dan “jalan” sambil menyatakan pengenalan Allah secara alami.
  alternative: Meratakan metafora menjadi “menyelidiki” atau “mengetahui”.
  rationale: Puisi ini melukiskan pengenalan Allah yang menyeluruh melalui tindakan sehari-hari dan metafora penampian. Terjemahan mempertahankan daya gambarnya tanpa mengembangkannya menjadi rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Bentuk “Kaukenal” dipakai secara alami untuk paralelisme, sedangkan “menampi” mempertahankan citra sumber dan dijelaskan melalui catatan kaki.
