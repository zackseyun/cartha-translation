id: PSA.139.8
reference: Psalms 139:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם אֶסַּ֣ק שָׁ֭מַיִם שָׁ֣ם אָ֑תָּה וְ/אַצִּ֖יעָה שְּׁא֣וֹל הִנֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/008.yaml
  text: If I ascend to heaven[a], you are there; if I make my bed in Sheol, behold, you are there.
translation:
  language: id
  text: 'Jika aku naik ke langit, Engkau ada di sana;

    jika aku menghamparkan tempat tidurku di Syeol[a], lihatlah, Engkau ada di sana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubur”, “dunia orang mati”, atau “alam maut”. Kata Ibrani “Syeol” merujuk pada ranah atau tempat orang mati, bukan selalu “neraka” dalam pengertian yang berkembang kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Menandai keadaan hipotesis dan mempertahankan kesejajaran puitis kedua bagian ayat tanpa mengubahnya menjadi keterangan waktu.
- source_word: אֶסַּק
  choice: aku naik
  rationale: Menyampaikan gerak vertikal menuju langit dengan bahasa Indonesia yang alami dan jelas.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam pertentangan puitis dengan Syeol, 'langit' secara alami menunjuk ranah tertinggi tanpa memaksakan rincian kosmologis.
- source_word: שָׁם אָתָּה
  choice: Engkau ada di sana
  rationale: Mempertahankan keterangan tempat yang eksplisit dan sapaan langsung kepada Allah.
- source_word: וְאַצִּיעָה
  choice: jika aku menghamparkan tempat tidurku
  rationale: Bentuk verba menggambarkan tindakan membentangkan atau menyiapkan tempat tidur; ungkapan ini menjaga citra konkret teks Ibrani.
- source_word: שְּׁאוֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan konsep Ibrani tentang ranah orang mati dan menghindari penyamaan langsung dengan neraka dalam pengertian teologis yang lebih kemudian.
- source_word: הִנֶּךָּ
  choice: lihatlah, Engkau ada di sana
  rationale: Partikel penunjuk yang disertai akhiran orang kedua bersifat tegas; 'lihatlah' menjaga daya serunya, sedangkan 'ada di sana' mengungkapkan maksud yang tersirat dan menggemakan bagian pertama.
theological_decisions:
- issue: Pemaknaan שְּׁאוֹל dalam pernyataan puitis tentang kehadiran Allah
  choice: Syeol
  alternative: kubur; dunia orang mati; alam maut; neraka
  rationale: Istilah Ibrani ini tidak dengan sendirinya berarti tempat hukuman akhir. Transliterasi menjaga keluasan konsep aslinya dan pernyataan bahwa ranah kematian pun tidak berada di luar kehadiran Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan 'Engkau' mempertahankan bentuk orang kedua tunggal yang langsung dan sesuai dengan ragam khidmat. Penanda catatan kaki ditempatkan pada 'Syeol', istilah yang dijelaskannya.
