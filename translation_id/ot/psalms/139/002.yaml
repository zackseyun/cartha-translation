  text: You know my sitting down and my rising up[b][a]; you understand my thought from afar.
translation:
  language: id
  text: Engkau mengetahui saat aku duduk dan saat aku bangun; Engkau memahami pikiranku[a] dari jauh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “niatku” atau “maksudku”.
    reason: lexical_alternative
  - marker: b
    text: “Dari jauh” dapat menunjuk pada jarak ruang atau pada Allah yang mengenali pikiran itu jauh sebelum diungkapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: mengetahui
  rationale: Bentuk Qal perfek orang kedua tunggal maskulin dari ידע menyatakan pengetahuan Allah yang utuh dan terus berlaku dalam konteks ini. Bentuk kini bahasa Indonesia paling wajar untuk daya statifnya.
- source_word: שִׁבְתִּי
  choice: saat aku duduk
  rationale: Bentuk dari ישׁב dengan akhiran orang pertama tunggal menunjuk pada tindakan atau keadaan pemazmur ketika duduk. Ungkapan ini alami dalam bahasa Indonesia dan tetap berpasangan dengan 'saat aku bangun'.
- source_word: וְקוּמִי
  choice: dan saat aku bangun
  rationale: Bentuk dari קום dengan akhiran orang pertama tunggal berpasangan dengan 'saat aku duduk'. Pasangan ini dapat mencakup seluruh kegiatan sehari-hari tanpa perlu dijabarkan dalam terjemahan.
- source_word: בַּנְתָּה
  choice: memahami
  rationale: Bentuk Qal perfek orang kedua tunggal maskulin dari בין menyatakan pengertian yang menembus ke dalam. 'Memahami' membedakannya dari ידע, yang diterjemahkan 'mengetahui'.
- source_word: לְרֵעִי
  choice: pikiranku
  rationale: Nomina ini dalam konteks dapat berarti pikiran, niat, atau maksud. 'Pikiranku' merupakan padanan paling langsung, sedangkan alternatif leksikalnya dipertahankan dalam catatan kaki.
- source_word: מֵרָחוֹק
  choice: dari jauh
  rationale: Ungkapan ini secara harfiah berarti 'dari kejauhan/dari jauh'. Padanan 'dari jauh' mempertahankan citra Ibrani dan keterbukaannya terhadap nuansa jarak maupun pengenalan sebelum pikiran diungkapkan.
theological_decisions:
- issue: Cakupan pengetahuan Allah dalam ayat ini
  choice: Ayat ini menggambarkan pengetahuan Allah yang mendalam atas tindakan lahiriah dan pikiran batin pemazmur tanpa menetapkan suatu model filosofis tertentu tentang kemahatahuan.
  alternative: Menafsirkan 'dari jauh' secara khusus sebagai pengetahuan sebelumnya atas pikiran, atau membatasinya hanya pada jarak ruang.
  rationale: Teks Ibrani menegaskan pengetahuan ilahi yang menyeluruh secara pribadi, tetapi frasa מֵרָחוֹק tetap terbuka. Terjemahan tidak mempersempit ketegangan puitis dan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan ilahi 'Engkau'. Struktur paralel 'saat aku duduk dan saat aku bangun' dibuat alami bagi pembaca umum sambil mempertahankan pasangan puitis teks Ibrani. Diksi tetap khidmat tanpa menjadi arkais.
