  text: Even darkness is not dark to you[a]; the night shines like the day[b]; darkness is like light to you.
translation:
  language: id
  text: Bahkan kegelapan tidak gelap bagi-Mu[a]; malam bersinar seperti siang; kegelapan sama seperti terang bagi-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verba Ibrani ini secara bentuk bersifat kausatif, dengan arti dasar “menggelapkan.” Dalam konteks ini, klausa tersebut dapat diterjemahkan secara idiomatis sebagai “kegelapan tidak gelap bagi-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, klausa terakhir dapat diterjemahkan, “seperti kegelapan, demikian pula terang,” yang menyatakan bahwa kegelapan dan terang sama saja bagi Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Bahkan
  rationale: 'Menangkap daya penegasan dan konsesif: bahkan kegelapan pun tidak membatasi Allah.'
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Padanan baku dan netral yang mempertahankan pertentangan puitis dengan terang.
- source_word: לֹא יַחְשִׁיךְ מִמֶּךָ
  choice: tidak menjadi gelap bagi-Mu
  rationale: Menghasilkan bahasa Indonesia yang wajar sambil mempertahankan citra dan bentuk verbal akar חשׁך; tidak diperluas secara tafsiran menjadi 'tidak dapat menyembunyikan apa pun dari-Mu'.
- source_word: וְלַיְלָה כַּיּוֹם יָאִיר
  choice: malam bersinar seperti siang
  rationale: Mempertahankan subjek 'malam', perbandingan dengan siang, dan makna יָאִיר sebagai 'bersinar' dalam susunan Indonesia yang alami.
- source_word: כַּחֲשֵׁיכָה כָּאוֹרָה
  choice: bagi-Mu kegelapan sama seperti terang
  rationale: Mengungkapkan kesejajaran ringkas bahasa Ibrani secara jelas tanpa menghapus gagasan bahwa kegelapan dan terang setara di hadapan Allah.
theological_decisions:
- issue: Apakah implikasi bahwa kegelapan tidak dapat menyembunyikan sesuatu dari Allah perlu dinyatakan secara eksplisit
  choice: Metafora kegelapan yang tidak menjadi gelap bagi Allah dipertahankan.
  alternative: Kegelapan tidak dapat menyembunyikan apa pun dari-Mu.
  rationale: Alternatif itu menyatakan implikasi teologisnya dengan jelas, tetapi melampaui ungkapan sumber. Teks utama mempertahankan citra puitis dan ketegangan asli.
- issue: Cara memahami klausa terakhir yang sangat padat
  choice: bagi-Mu kegelapan sama seperti terang
  alternative: seperti kegelapan, demikian pula terang
  rationale: Pilihan utama menyatakan kesetaraan kegelapan dan terang dalam hubungan dengan Allah, sedangkan alternatif mempertahankan bentuk komparatif Ibrani dengan lebih harfiah tetapi kurang jelas dalam bahasa Indonesia.
