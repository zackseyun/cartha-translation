base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O Yahweh[b], you have searched me and known me.
translation:
  language: id
  text: 'Untuk pemimpin musik[a]. Dari Daud[b]. Mazmur.


    Yahweh, Engkau telah menyelidiki aku dan mengenal aku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kepada pemimpin musik”; kata depan Ibrani dalam judul mazmur dapat menunjukkan arah atau peruntukan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Untuk Daud” atau “Oleh Daud”; ungkapan Ibrani dapat menunjukkan kepengarangan, peruntukan, atau keterkaitan.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini dalam judul mazmur menunjuk kepada pemimpin atau pengawas pelaksanaan musik. Pilihan ini jelas dalam bahasa Indonesia modern tanpa membatasi tugasnya hanya pada paduan suara.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Kata depan ל dalam judul mazmur dapat menyatakan kepengarangan, peruntukan, atau hubungan. “Dari Daud” cukup alami dan tidak setegas “ditulis oleh Daud” dalam menetapkan kepengarangan.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Padanan baku dan mudah dipahami untuk nyanyian yang lazimnya diiringi alat musik petik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: חֲקַרְתַּנִי
  choice: Engkau telah menyelidiki aku
  rationale: Kata kerja ini menyatakan pemeriksaan atau penyelidikan yang saksama; bentuk perfektifnya secara alami dinyatakan dengan “telah”.
- source_word: וַתֵּדָע
  choice: dan mengenal aku
  rationale: ידע berarti mengetahui atau mengenal. Dalam rangkaian puitis ini, “mengenal aku” menyampaikan pengetahuan pribadi dan menyeluruh tanpa menambahkan objek atau nuansa yang tidak dinyatakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan sebuah gelar.
- issue: Hubungan Daud dengan mazmur dalam frasa לְדָוִד
  choice: Dari Daud
  alternative: Oleh Daud
  rationale: Kata depan Ibrani dapat menunjukkan kepengarangan, peruntukan, atau keterkaitan. “Dari Daud” beserta catatan kaki mempertahankan keluwesan judul tersebut dan tidak memastikan kepengarangan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” dipakai dalam sapaan langsung kepada Allah. Susunan pendek pada judul dipertahankan agar bentuk superskripsi Ibrani tetap terlihat, sedangkan “pemimpin musik” dipilih karena lebih luas dan lebih mudah dipahami daripada istilah yang khusus menunjuk pemimpin paduan suara.
