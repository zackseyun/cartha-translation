  yaml_path: translation/ot/psalms/139/021.yaml
  text: Do I not hate those who hate you, O LORD, and loathe those who rise up against you?
translation:
  language: id
  text: Bukankah aku membenci orang-orang yang membenci-Mu, ya TUHAN, dan merasa muak terhadap orang-orang yang bangkit melawan-Mu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַׂנְאֶיךָ / אֶשְׂנָא
  choice: orang-orang yang membenci-Mu / aku membenci
  rationale: Mempertahankan pengulangan akar שׂנא dan daya tegas kata ‘membenci’ tanpa memperhalus ketegangan dalam teks.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk menandai nama ilahi YHWH dengan huruf kapital.
- source_word: בִתְקוֹמְמֶיךָ
  choice: orang-orang yang bangkit melawan-Mu
  rationale: Menyampaikan bentuk partisipial yang menunjuk kepada mereka yang mengangkat diri atau memberontak melawan Allah.
- source_word: אֶתְקוֹטָט
  choice: merasa muak terhadap
  rationale: Mencerminkan rasa jijik atau kejengkelan mendalam yang dinyatakan verba ini dalam konteks paralelisme, bukan mengubahnya menjadi tindakan bertengkar.
theological_decisions:
- issue: Bahasa kebencian pemazmur terhadap musuh Allah
  choice: Mempertahankan kata ‘membenci’ secara langsung
  alternative: Menghaluskan menjadi ‘tidak menyukai’ atau ‘menolak’
  rationale: Teks Ibrani memakai akar שׂנא secara eksplisit; terjemahan tidak boleh meniadakan ketegangan moral dan teologis tersebut.
- issue: Nuansa אֶתְקוֹטָט pada baris kedua
  choice: merasa muak terhadap
  alternative: bertengkar dengan / menentang
  rationale: Dalam bentuk ini dan paralelismenya dengan ‘membenci’, verba tersebut paling wajar mengungkapkan kejijikan atau rasa muak yang mendalam, sambil tidak menambahkan gagasan tindakan kekerasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pertanyaan retoris ‘Bukankah’ mempertahankan struktur serta tekanan ayat Ibrani; pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
