  text: My frame was not hidden from you when I was made in secret[b][a], woven in the depths of the earth.
translation:
  language: id
  text: Tubuhku tidak tersembunyi dari-Mu ketika aku dijadikan secara tersembunyi,[b] dirajut di kedalaman bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bagian-bagian bumi yang paling bawah”. Ungkapan Ibrani ini merupakan gambaran puitis tentang pembentukan yang tersembunyi.
    reason: lexical_alternative
  - marker: b
    text: Atau “ketika aku dirajut di kedalaman bumi”.
    reason: previous_rendering
lexical_decisions:
- source_word: נִכְחַד
  choice: tidak tersembunyi
  rationale: Bentuk nifal dari כחד menyatakan keadaan tersembunyi atau terselubung. Ungkapan ini mempertahankan makna pasif dan cocok secara alami dengan “dari-Mu”.
- source_word: עָצְמִי
  choice: kerangka tubuhku
  rationale: Walaupun עֶצֶם sering berarti “tulang”, bentuk tunggal dalam konteks puitis ini menunjuk lebih luas kepada susunan jasmani pemazmur. “Kerangka tubuhku” mempertahankan gambaran tubuh tanpa membatasinya pada satu tulang.
- source_word: מִמֶּךָּ
  choice: dari-Mu
  rationale: Preposisi מן bersama pronomina ini secara wajar berarti “dari-Mu”; dengan “tersembunyi”, frasa tersebut menyatakan bahwa pembentukan pemazmur tidak luput dari Allah.
- source_word: אֲשֶׁר
  choice: ketika
  rationale: Partikel relatif ini di sini memperkenalkan keadaan waktu saat pemazmur dijadikan. “Ketika” menghasilkan hubungan yang jelas dan alami dalam bahasa Indonesia.
- source_word: עֻשֵּׂיתִי
  choice: aku dijadikan
  rationale: Bentuk pasif dari עשה bermakna umum “dibuat/dijadikan”. Pilihan ini lugas serta membiarkan kata kerja berikutnya menyampaikan gambaran kerajinan yang lebih khusus.
- source_word: בַסֵּתֶר
  choice: di tempat tersembunyi
  rationale: Frasa ini menunjuk kepada tempat atau keadaan yang tersembunyi. Terjemahan ini mempertahankan unsur lokatif yang mungkin terkandung dalam bentuk Ibrani tanpa menentukan tempat itu secara eksplisit.
- source_word: רֻקַּמְתִּי
  choice: dirajut
  rationale: Kata kerja רקם membangkitkan gambaran menyulam atau menenun secara rumit. “Dirajut” mempertahankan metafora karya tekstil yang cermat dalam bahasa Indonesia yang mudah dipahami.
- source_word: בְּתַחְתִּיּוֹת אָרֶץ
  choice: di kedalaman bumi
  rationale: Terjemahan ini mempertahankan citra ruang tersembunyi yang dalam dan puitis, tanpa mengubahnya menjadi pernyataan harfiah tentang lokasi pembentukan manusia.
theological_decisions:
- issue: Makna “kedalaman bumi”
  choice: Mempertahankan ungkapan tersebut sebagai metafora puitis tentang pembentukan manusia yang tersembunyi dan penuh misteri
  alternative: Memahaminya sebagai rujukan kosmologis atau bawah tanah secara lebih harfiah
  rationale: Dalam renungan Mazmur 139 mengenai pengetahuan Allah yang menyeluruh, ungkapan ini sejajar dengan “di tempat tersembunyi”. Teks utama mempertahankan gambarnya tanpa menetapkan secara dogmatis apakah rujukannya semata-mata rahim atau suatu gambaran kosmologis.
- issue: Hubungan antara dua klausa pembentukan
  choice: Klausa kedua diterjemahkan sebagai kelanjutan tanpa mengulang “ketika”
  alternative: “ketika aku dirajut di kedalaman bumi”
  rationale: Teks Ibrani menempatkan dua gambaran pembentukan secara berdampingan tanpa kata sambung sebelum klausa kedua. Susunan utama mempertahankan kesejajaran puitis dan menghindari kesan dua waktu yang terpisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk sapaan “-Mu” mengikuti register hormat yang lazim untuk Allah. Metafora kerajinan tekstil dan gambaran kedalaman bumi dipertahankan tanpa penjelasan doktrinal di dalam teks utama.
