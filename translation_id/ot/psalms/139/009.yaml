  text: If I take up the wings of the dawn[a], if I dwell in the farthest part of the sea,
translation:
  language: id
  text: Jika aku mengangkat sayap fajar, jika aku berdiam di ujung laut yang terjauh,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di barat yang paling jauh”; “laut” dapat mengandung nuansa arah barat dalam geografi puitis Ibrani.
    reason: Kata Ibrani יָם berarti ‘laut’, tetapi dalam puisi dapat pula menyiratkan arah barat.
lexical_decisions:
- source_word: אֶשָּׂא כַנְפֵי
  choice: aku terbang dengan sayap
  rationale: Secara harfiah frasa ini berarti ‘aku mengangkat/membawa sayap’. Dalam gambaran puitis ini, terjemahan idiomatis ‘terbang dengan sayap’ menyampaikan gerak cepat menuju tempat jauh sambil mempertahankan citra sayap.
- source_word: שָׁחַר
  choice: fajar
  rationale: Kata ini menunjuk pada fajar atau merekahnya pagi; ‘fajar’ alami, puitis, dan mempertahankan personifikasi dalam frasa ‘sayap fajar’.
- source_word: אֶשְׁכְּנָה
  choice: aku berdiam
  rationale: Bentuk dari שכן berarti tinggal, menetap, atau berdiam. ‘Berdiam’ sesuai dengan ragam puisi yang luhur dan tidak menyiratkan sekadar singgah.
- source_word: בְּאַחֲרִית
  choice: di ujung ... yang paling jauh
  rationale: Kata אַחֲרִית dapat berarti bagian akhir, ujung, atau batas terjauh. Dalam konteks ruang ini, pilihan tersebut menyatakan lokasi yang sangat jauh, bukan akhir secara waktu.
- source_word: יָם
  choice: laut
  rationale: Makna konkret יָם adalah ‘laut’, meskipun dalam geografi puitis Ibrani kata itu juga dapat mengandung arah barat. Makna konkret dipertahankan dalam teks utama dan nuansa arah dicatat dalam catatan kaki.
