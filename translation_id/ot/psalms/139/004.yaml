  text: כִּ֤י אֵ֣ין מִ֭לָּה בִּ/לְשׁוֹנִ֑/י הֵ֥ן יְ֝הוָ֗ה יָדַ֥עְתָּ כֻלָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/004.yaml
  text: For there is not a word on my tongue—behold[a], O Yahweh, you know it altogether.
translation:
  language: id
  text: Sebab tidak ada sepatah kata pun di lidahku[a]—sungguh[b], ya Yahweh, Engkau mengetahuinya sepenuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan ini dapat dipahami: “belum ada sepatah kata pun di lidahku.”'
    reason: Makna temporal tersirat oleh konteks, meskipun teks Ibrani secara harfiah menyatakan bahwa tidak ada kata di lidah pemazmur.
  - marker: b
    text: 'Atau: “lihatlah”.'
    reason: Partikel הֵן dapat berfungsi sebagai penegas (“sungguh”) atau sebagai seruan yang menarik perhatian (“lihatlah”).
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Partikel ini menghubungkan ayat dengan pemikiran sebelumnya sebagai penjelasan atau dasar, sehingga “Sebab” mempertahankan hubungan wacananya.
- source_word: אֵין מִלָּה
  choice: tidak ada sepatah kata pun
  rationale: אֵין adalah penyangkalan eksistensial, sedangkan מִלָּה berbentuk tunggal. Ungkapan “tidak ada sepatah kata pun” alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: בִּלְשׁוֹנִי
  choice: di lidahku
  rationale: Pilihan ini mempertahankan metafora jasmani bahasa Ibrani tentang perkataan yang berada pada atau siap diucapkan oleh lidah.
- source_word: הֵן
  choice: sungguh
  rationale: Partikel penarik perhatian dan penegas ini diterjemahkan dengan kata yang tetap khidmat namun alami dalam bahasa Indonesia; alternatif yang lebih visual dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: יָדַעְתָּ
  choice: Engkau mengetahui
  rationale: Bentuk perfektif Ibrani di sini menyatakan pengetahuan yang mantap dan menyeluruh; bentuk kini bahasa Indonesia paling alami untuk keadaan tersebut.
- source_word: כֻלָּהּ
  choice: sepenuhnya
  rationale: Kata ini menyatakan keseluruhan dan memakai sufiks feminin tunggal yang merujuk kepada מִלָּה, yaitu “kata”; “mengetahuinya sepenuhnya” menjaga rujukan tunggal dan gagasan pengetahuan yang tuntas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Apakah ketiadaan kata dinyatakan secara harfiah atau secara temporal
  choice: tidak ada sepatah kata pun di lidahku
  alternative: belum ada sepatah kata pun di lidahku
  rationale: Teks secara eksplisit memakai penyangkalan eksistensial אֵין dan tidak memiliki kata tersendiri yang berarti “belum”. Makna antisipatif sangat mungkin dalam konteks, tetapi dicatat sebagai kemungkinan agar ketegangan teks tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis tanpa menjadi arkais. “Sepatah kata pun” merupakan ungkapan alami bagi nomina tunggal yang dinafikan; metafora “di lidahku” dipertahankan. Sapaan “ya Yahweh” mempertahankan sifat langsung doa pemazmur.
