  text: תַּכְלִ֣ית שִׂנְאָ֣ה שְׂנֵאתִ֑י/ם לְ֝/אוֹיְבִ֗ים הָ֣יוּ לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/022.yaml
  text: I hate them with complete hatred[a]; they have become enemies to me.
translation:
  language: id
  text: Aku membenci mereka dengan kebencian yang tuntas[a]; mereka telah menjadi musuhku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kebencian yang mutlak” atau “dengan kebencian yang sempurna.”
    reason: Alternatif leksikal bagi תַּכְלִית, yang dapat menyatakan kelengkapan, tingkat paling penuh, atau kesempurnaan.
lexical_decisions:
- source_word: תַּכְלִית שִׂנְאָה
  choice: dengan kebencian sepenuhnya
  rationale: תַּכְלִית menyatakan batas akhir, kelengkapan, atau totalitas dan dalam konstruksi ini menguatkan שִׂנְאָה. Ungkapan ini mempertahankan bentuk nomina serta intensitas bahasa Ibrani dalam bahasa Indonesia yang wajar.
- source_word: שְׂנֵאתִים
  choice: Aku membenci mereka
  rationale: Bentuk Qal perfek orang pertama tunggal dengan sufiks orang ketiga jamak menyatakan sikap tegas pemazmur; kala kini paling alami dalam konteks puisi ini.
- source_word: לְאוֹיְבִים הָיוּ לִי
  choice: mereka telah menjadi musuhku
  rationale: Konstruksi היה + ל dapat menandai keadaan atau peran yang dihasilkan. 'Telah menjadi musuhku' menyampaikan nuansa resultatif dan hubungan permusuhan secara alami.
theological_decisions:
- issue: Kekuatan kecaman pemazmur
  choice: Mempertahankan bahasa kebencian pribadi yang kuat tanpa memperhalusnya.
  alternative: Aku menentang mereka sepenuhnya; aku menganggap mereka musuh.
  rationale: Teks Ibrani memakai akar kata 'membenci/kebencian' dua kali. Terjemahan perlu mempertahankan daya dan ketegangan teologis teks, bukan menggantinya dengan bahasa yang lebih lunak.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan khidmat. Pengulangan akar 'membenci/kebencian' sengaja dipertahankan untuk mencerminkan penekanan puitis Ibrani.
