base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/007.yaml
  text: Where can I go from your Spirit? Or where can I flee from your presence?[a]
translation:
  language: id
  text: Ke mana aku dapat pergi menjauh dari Roh-Mu? Atau ke mana aku dapat lari dari hadirat-Mu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ruakh juga dapat berarti “angin” atau “napas”; dalam konteks ini, makna “Roh” lebih sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֭נָה
  choice: Ke mana
  rationale: Kata tanya ini menanyakan arah atau tujuan; “ke mana” merupakan padanan alami dalam bahasa Indonesia modern.
- source_word: אֵלֵךְ
  choice: aku dapat pergi
  rationale: Bentuk imperfek orang pertama tunggal dari הלך berada dalam pertanyaan retoris tentang kemungkinan; “dapat pergi” menyampaikan maksud itu secara wajar.
- source_word: מֵ/רוּחֶךָ
  choice: menjauh dari Roh-Mu
  rationale: רוּחַ dapat berarti roh, angin, atau napas. Paralelnya dengan “hadirat-Mu” dan konteks kehadiran Allah yang tak terhindarkan mendukung “Roh-Mu.” Kata “menjauh” membuat fungsi preposisi מִן jelas dalam bahasa Indonesia.
- source_word: וְ/אָ֗נָה
  choice: Ke mana
  rationale: Pengulangan pertanyaan membentuk baris paralel. Dalam puisi Indonesia, mengulang “Ke mana” tanpa menerjemahkan waw secara tersendiri terdengar alami dan tidak mengubah hubungan antarklausa.
- source_word: מִ/פָּנֶ֥י/ךָ
  choice: dari hadirat-Mu
  rationale: פָּנִים secara harfiah berarti “wajah,” tetapi dalam ungkapan ini menunjuk pada kehadiran pribadi; “hadirat-Mu” mempertahankan nuansa hormat dan puitis.
- source_word: אֶבְרָֽח
  choice: aku dapat lari
  rationale: Bentuk imperfek orang pertama tunggal dari ברח berarti “lari/melarikan diri.” Dalam pertanyaan retoris, “dapat lari” mengungkapkan mustahilnya lolos tanpa mengganti verba dengan tafsiran “meloloskan diri.”
theological_decisions:
- issue: Apakah רוּחַ harus diterjemahkan secara impersonal (“angin/napas”) atau sebagai rujukan pribadi ilahi (“Roh”)
  choice: Roh-Mu
  alternative: angin-Mu atau napas-Mu
  rationale: Mazmur 139 menekankan pengetahuan dan kehadiran Allah yang tidak dapat dihindari. Kesejajaran dengan “hadirat-Mu” sangat mendukung rujukan kepada Roh Allah, sementara catatan kaki mempertahankan rentang makna leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Kesejajaran dua pertanyaan dipertahankan.
