  yaml_path: translation/ot/psalms/139/018.yaml
  text: If I were to count them[a], they would be more than the sand. When I awake[b], I am still with you.
translation:
  language: id
  text: Jika aku menghitung semuanya[a], jumlahnya akan melebihi butir-butir pasir. Ketika aku bangun[b], aku masih bersama-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sekiranya aku menghitung semuanya, jumlahnya lebih banyak daripada pasir.” Bahasa Ibrani sangat ringkas dan dapat disusun dengan beberapa cara dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: b
    text: Baris terakhir juga dapat diterjemahkan, “Aku bangun, dan aku masih bersama-Mu.” Bahasa Ibrani tidak menjelaskan secara tegas apakah tindakan bangun itu merupakan kebiasaan, kejadian lampau, atau bahasa kiasan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶסְּפְּרֵם
  choice: Jika aku menghitung semuanya
  rationale: Bentuk Qal imperfek orang pertama tunggal dengan akhiran orang ketiga jamak berarti secara harfiah ‘aku menghitung mereka’. Dalam konteks, klausa ini berfungsi wajar sebagai pengandaian. ‘Semuanya’ merujuk kembali tanpa mengulang secara eksplisit ‘pikiran-pikiran-Mu’ dari ayat sebelumnya.
- source_word: מֵחוֹל
  choice: daripada butir-butir pasir
  rationale: Kata חוֹל berarti ‘pasir’, dan prefiks מ־ menyatakan perbandingan. Ungkapan ‘butir-butir pasir’ membuat hal yang dihitung jelas dan alami dalam bahasa Indonesia tanpa mengubah gambaran dasarnya.
- source_word: יִרְבּוּן
  choice: jumlahnya akan melebihi
  rationale: Kata kerja רבה menyatakan menjadi banyak atau lebih banyak. Dalam susunan pengandaian ini, ‘jumlahnya akan melebihi’ menyampaikan bahwa semua itu lebih banyak daripada butir pasir.
- source_word: הֱקִיצֹתִי
  choice: Ketika aku terbangun
  rationale: Kata ini menyatakan bangun atau terjaga. Terjemahan berklausa waktu terdengar alami, tetapi tidak dimaksudkan untuk menetapkan apakah tindakan itu kebiasaan, kejadian lampau, atau bahasa kiasan.
- source_word: וְעוֹדִי
  choice: aku masih
  rationale: 'עוֹד dengan akhiran orang pertama tunggal menyatakan keadaan yang berlanjut: ‘aku masih’. Kopula tersirat disampaikan secara alami dalam bahasa Indonesia.'
- source_word: עִמָּךְ
  choice: bersama-Mu
  rationale: Preposisi עִם dengan akhiran orang kedua berarti ‘bersama-Mu’. Pilihan ini mempertahankan pernyataan langsung tentang keberadaan pemazmur bersama Allah tanpa memperluasnya menjadi gagasan teologis lain.
theological_decisions:
- issue: Acuan ‘semuanya’
  choice: Kata ini merujuk kembali kepada pikiran-pikiran Allah dalam ayat sebelumnya.
  alternative: Kata ini dapat dipahami lebih luas sebagai rangkuman karya atau maksud Allah yang menakjubkan.
  rationale: Konteks terdekat dalam Mazmur 139:17 menunjuk kepada pikiran-pikiran Allah. Teks utama tetap memakai kata pengganti dan tidak menyisipkan ‘pikiran-pikiran-Mu’, sehingga hubungan kontekstual dan keringkasan bahasa Ibrani dipertahankan.
- issue: Makna klausa terakhir
  choice: Pemazmur menyatakan bahwa ketika terbangun ia masih bersama Allah.
  alternative: Klausa itu dapat menggambarkan bangun dari tidur setelah merenungkan pikiran Allah; sebagian penafsir juga mendengar kemungkinan gema kebangkitan sesudah kematian, tetapi hal itu tidak dinyatakan secara tegas.
  rationale: Bahasa Ibrani menyatakan bahwa saat terbangun pemazmur masih bersama Allah. Terjemahan tidak memasukkan gagasan kebangkitan atau penjelasan lain yang tidak diwajibkan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang jelas dan bermartabat. Bentuk ‘bersama-Mu’ mengikuti kebiasaan ejaan religius Indonesia untuk sapaan kepada Allah. Struktur pengandaian dipertahankan secara alami, sementara ambiguitas waktu pada ‘terbangun’ dijelaskan dalam catatan kaki.
