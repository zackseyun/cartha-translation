  text: For this God is our God forever and ever; he will guide us beyond death.
translation:
  language: id
  text: Sebab Allah inilah Allah kita untuk selama-lamanya; Dialah yang akan menuntun kita sampai mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani pada akhir ayat ini sulit dipastikan. Harfiahnya dapat dipahami “atas/sampai kematian”; ada yang menerjemahkannya “melampaui kematian.” Sebagian juga menggabungkan huruf-hurufnya dan membacanya sebagai petunjuk musik, “menurut Alamot.”
    reason: Menjaga ambiguitas teks Ibrani dan mencatat pembacaan alternatif tanpa menjadikannya makna pasti dalam teks utama.
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים אֱלֹהֵינוּ
  choice: Sebab Allah inilah Allah kita
  rationale: Mempertahankan hubungan penjelas כִּי dan penegasan deiktis זֶה, sambil memakai susunan Indonesia yang alami dan khidmat.
- source_word: עוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan durasi tanpa akhir dari pasangan Ibrani tersebut.
- source_word: הוּא יְנַהֲגֵנוּ
  choice: Dialah yang akan menuntun kita
  rationale: Konstruksi fokus mempertahankan penekanan pada הוּא; 'menuntun' sesuai dengan makna verba נהג dalam konteks bimbingan.
- source_word: עַל־מוּת
  choice: melampaui kematian
  rationale: Mengikuti pemenggalan Masoret menjadi dua kata dan menyampaikan gagasan bahwa tuntunan Allah menjangkau melewati kematian, tanpa mengubahnya menjadi 'selamanya'.
theological_decisions:
- issue: Makna עַל־מוּת pada akhir ayat
  choice: melampaui kematian
  alternative: sampai mati; menurut Alamot
  rationale: Teks Masoret memberi עַל מוּת, yang secara leksikal dapat dipahami berkaitan dengan kematian, tetapi ungkapannya sulit dan telah ditafsirkan beragam. Terjemahan utama mengikuti pembacaan 'melampaui kematian' yang dipilih lapisan konsultasi, sementara catatan kaki mempertahankan ketidakpastian tekstual dan semantis.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan khidmat. Pengulangan 'Allah ... Allah kita' sengaja dipertahankan karena merupakan penegasan penting dalam teks Ibrani.
