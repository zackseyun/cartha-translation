translation:
  language: id
  text: Kegentaran mencengkeram mereka di sana, rasa sakit seperti pada perempuan yang sedang melahirkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka menggeliat seperti perempuan yang sedang melahirkan”; kata Ibrani חִיל dapat menekankan rasa sakit yang membuat tubuh menggeliat maupun derita yang ditimbulkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעָדָה
  choice: Gemetar
  rationale: Nomina ini menyatakan keadaan gemetar atau menggigil. “Gemetar” mempertahankan gambaran jasmani yang konkret dan berfungsi alami sebagai subjek kalimat.
- source_word: אֲחָזָתַם
  choice: mencengkeram mereka
  rationale: Berasal dari אחז, “memegang, menangkap, menguasai.” “Mencengkeram” menyampaikan daya yang mendadak dan kuat serta cocok dengan subjek “gemetar”.
- source_word: שָׁם
  choice: di sana
  rationale: Adverbia tempat ini diterjemahkan langsung untuk mempertahankan latar adegan yang hidup.
- source_word: חִיל
  choice: derita
  rationale: Kata ini dapat menunjuk pada rasa sakit yang menggeliat, nyeri persalinan, atau penderitaan berat. “Derita” mencakup dimensi jasmani dan batin, sedangkan perumpamaan berikutnya menjelaskan citra persalinannya.
- source_word: כַּיּוֹלֵדָה
  choice: seperti perempuan yang sedang melahirkan
  rationale: Frasa perbandingan dengan bentuk partisip dari ילד ini menunjuk kepada perempuan dalam proses persalinan. Pilihan ini jelas, alami, dan mempertahankan kekuatan perumpamaannya.
