  text: בְּ/ר֥וּחַ קָדִ֑ים תְּ֝שַׁבֵּ֗ר אֳנִיּ֥וֹת תַּרְשִֽׁישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: id
  text: Dengan angin timur Engkau menghancurkan kapal-kapal Tarsis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “kapal-kapal yang menuju Tarsis” atau “kapal-kapal jenis Tarsis”; ungkapan ini dapat menunjuk pada kapal niaga samudra yang diasosiasikan dengan Tarsis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רוּחַ קָדִים
  choice: Dengan angin timur
  rationale: רוּחַ dalam gabungan ini berarti angin, sedangkan קָדִים menunjuk pada arah timur dan secara idiomatis membentuk ungkapan 'angin timur'. Preposisi בְּ dipahami secara instrumental dan diterjemahkan 'dengan'.
- source_word: תְּשַׁבֵּר
  choice: Engkau menghancurkan
  rationale: Bentuk Piel dari שׁבר menyatakan tindakan memecahkan dengan kuat. 'Menghancurkan' alami dalam bahasa Indonesia dan menyampaikan daya rusak terhadap kapal; bentuk orang kedua tunggal dipertahankan sebagai sapaan langsung kepada Allah.
- source_word: אֳנִיּוֹת
  choice: kapal-kapal
  rationale: Bentuk jamak ini berarti kapal-kapal. Pengulangan kata merupakan penanda jamak yang jelas dan wajar dalam konteks ini.
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Nama diri ini ditransliterasikan dengan bentuk Indonesia yang lazim. Dalam gabungan 'kapal-kapal Tarsis', hubungan tepatnya tetap dapat berarti kapal yang berasal dari, menuju, atau diasosiasikan dengan Tarsis, bahkan jenis kapal niaga samudra.
theological_decisions:
- issue: Rujukan kata kerja orang kedua tunggal
  choice: 'Sapaan langsung kepada Allah: ''Engkau menghancurkan'''
  alternative: Pernyataan impersonal atau umum
  rationale: Bentuk Ibrani orang kedua maskulin tunggal paling wajar dipertahankan sebagai sapaan langsung kepada Allah dalam konteks mazmur, tanpa menambahkan penafsiran teologis lain.
translation_notes:
  register: Bahasa Indonesia baku modern, puitis tetapi mudah dipahami. Kapitalisasi 'Engkau' menandai sapaan kepada Allah sesuai kelaziman penerjemahan Alkitab Indonesia. Ambiguitas hubungan antara kapal-kapal dan Tarsis dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
