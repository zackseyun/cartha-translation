  text: שִׁ֤יתוּ לִבְּ/כֶ֨ם לְֽ/חֵילָ֗/ה פַּסְּג֥וּ אַרְמְנוֹתֶ֑י/הָ לְמַ֥עַן תְּ֝סַפְּר֗וּ לְ/ד֣וֹר אַחֲרֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/013.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: id
  text: Pusatkanlah hatimu pada tembok pertahanannya[a]; telusurilah kubu-kubunya[b], supaya kamu dapat menceritakannya kepada generasi mendatang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tembok luarnya”. Istilah Ibrani ini secara luas menunjuk pada bangunan pertahanan sebuah kota.
    reason: lexical_alternative
  - marker: b
    text: Atau “istana-istananya”. Kata Ibrani ini dapat berarti bangunan istana atau bangunan kokoh yang dibentengi; konteks peninjauan pertahanan kota mendukung terjemahan “kubu-kubunya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: Pusatkanlah hatimu
  rationale: Ungkapan harfiahnya adalah menaruh atau mengarahkan hati. Dalam bahasa Indonesia, 'pusatkanlah hatimu' mempertahankan gambaran hati sekaligus menyampaikan maksud memberi perhatian dengan sungguh-sungguh.
- source_word: לְחֵילָה
  choice: pada tembok pertahanannya
  rationale: חֵיל dalam gambaran sebuah kota menunjuk pada bangunan pertahanan, kemungkinan tembok luar atau kubu pertahanan. Pilihan ini jelas dan wajar bagi pembaca modern tanpa mempersempit rujukannya secara berlebihan.
- source_word: פַּסְּגוּ
  choice: telusurilah
  rationale: Kata kerja yang jarang ini, dalam konteks mengamati Sion, dapat menggambarkan bergerak melewati atau memeriksa bangunan-bangunannya. 'Telusurilah' mempertahankan unsur gerak sekaligus pengamatan saksama.
- source_word: אַרְמְנוֹתֶיהָ
  choice: kubu-kubunya
  rationale: אַרְמוֹן dapat menunjuk pada istana atau bangunan kokoh yang dibentengi. Karena konteksnya adalah peninjauan pertahanan kota, 'kubu-kubu' paling sesuai, sementara kemungkinan 'istana-istana' dicatat dalam catatan kaki.
- source_word: לְמַעַן תְּסַפְּרוּ
  choice: supaya kamu dapat menceritakannya
  rationale: לְמַעַן menyatakan tujuan, sedangkan bentuk piel ספר berarti menceritakan atau menuturkan. Akhiran '-nya' menyatakan secara alami isi yang tersirat, yaitu keadaan dan kemegahan kota yang baru diamati.
- source_word: לְדוֹר אַחֲרוֹן
  choice: kepada generasi mendatang
  rationale: Secara harfiah berarti kepada generasi yang kemudian atau belakangan. 'Generasi mendatang' merupakan ungkapan Indonesia yang alami dan mempertahankan gagasan pewarisan kesaksian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Bentuk imperatif jamak Ibrani diterjemahkan dengan bentuk Indonesia yang tidak menandai jumlah secara eksplisit, sebagaimana lazimnya. Pronomina feminin untuk Sion dinaturalisasi menjadi akhiran '-nya'.
