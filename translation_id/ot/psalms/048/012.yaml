  text: Walk around Zion and go around her[a]; count her towers.
translation:
  language: id
  text: Berjalanlah mengelilingi Sion dan kelilingilah dia[a]; hitunglah menara-menaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berjalanlah mengitari Sion dan kelilingilah dia.”
