lexical_decisions:
- source_word: סֹבּוּ
  choice: Berjalanlah mengelilingi
  rationale: Bentuk perintah jamak dari סבב mengajak para pendengar bergerak mengitari kota; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tindakan spasial yang konkret.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Nama diri ditransliterasikan; teks Ibrani hanya menyebut Sion, bukan Gunung Sion.
- source_word: וְהַקִּיפוּהָ
  choice: dan kelilingilah dia
  rationale: Bentuk perintah jamak dengan akhiran orang ketiga feminin tunggal menyatakan tindakan mengitari Sion. 'Dia' mempertahankan personifikasi feminin kota dan menghindari kesan permusuhan yang dapat muncul dari 'kepunglah'.
- source_word: סִפְרוּ
  choice: hitunglah
  rationale: Dalam konteks mengamati pertahanan kota, kata ini paling langsung menyatakan penghitungan menara, bukan penceritaan.
- source_word: מִגְדָּלֶיהָ
  choice: menara-menaranya
  rationale: Bentuk jamak dengan akhiran feminin tunggal merujuk kepada Sion. Bentuk '-nya' merupakan rujukan pronominal yang alami dalam bahasa Indonesia.
