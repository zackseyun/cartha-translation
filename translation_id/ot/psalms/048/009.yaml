source:
  edition: WLC
  text: דִּמִּ֣ינוּ אֱלֹהִ֣ים חַסְדֶּ֑/ךָ בְּ֝/קֶ֗רֶב הֵיכָלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/009.yaml
  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: id
  text: 'Kami merenungkan[a] kasih setia-Mu, ya Allah,

    di tengah bait-Mu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memikirkan dengan saksama” atau “mempertimbangkan.” Kata Ibrani ini dapat menyatakan tindakan memikirkan atau merenungkan sesuatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: Kami merenungkan
  rationale: Bentuk piel perfektum orang pertama jamak di sini paling wajar menyatakan tindakan memikirkan dengan saksama atau merenungkan. Pilihan ini alami dalam konteks ibadah dan tetap mempertahankan nuansa perenungan.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Dalam konteks ini kata tersebut berfungsi sebagai sapaan langsung. Partikel “ya” menandai bentuk vokatif secara alami dalam bahasa Indonesia.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד mencakup kasih yang teguh, loyal, dan berhubungan dengan kesetiaan perjanjian. “Kasih setia” mempertahankan keluasan makna itu tanpa menjadikannya istilah teknis.
- source_word: בְּקֶרֶב
  choice: di tengah
  rationale: Ungkapan ini menunjukkan keberadaan di bagian dalam atau di tengah suatu tempat dan sesuai dengan ragam puitis mazmur.
- source_word: הֵיכָלֶךָ
  choice: bait-Mu
  rationale: Walaupun הֵיכָל dapat berarti istana atau bait, konteks ibadah dalam mazmur ini menunjuk pada bait Allah. “Bait-Mu” alami dan khidmat dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חֶסֶד sebagai sifat Allah
  choice: kasih setia
  alternative: belas kasih; kasih perjanjian; kemurahan
  rationale: Pilihan ini mempertahankan unsur kasih dan kesetiaan yang teguh tanpa mempersempit maknanya hanya menjadi belas kasih atau memasukkan istilah teologis yang terlalu teknis.
- issue: Fungsi אֱלֹהִים sebagai sapaan atau penyebutan
  choice: 'Sapaan langsung: “ya Allah”'
  alternative: 'Penyebutan biasa: “Allah”'
  rationale: Susunan kalimat paling alami dipahami sebagai doa atau nyanyian yang ditujukan langsung kepada Allah. Penandaan vokatif memperjelas hal itu tanpa menambah isi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis dan khidmat. Bentuk “kasih setia-Mu” dan “bait-Mu” mempertahankan bobot bahasa ibadah tanpa menjadi arkais; pemenggalan baris mengikuti dua bagian utama ayat.
