source:
  edition: WLC
  text: אֱלֹהִ֥ים בְּ/אַרְמְנוֹתֶ֗י/הָ נוֹדַ֥ע לְ/מִשְׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/003.yaml
  text: God is known in her citadels as a stronghold[a][b].
translation:
  language: id
  text: Allah dikenal di benteng-bentengnya sebagai tempat perlindungan yang kokoh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di istana-istananya.” Istilah Ibrani ini dapat menunjuk pada kediaman megah atau bangunan berkubu; dalam konteks ini, keamanan kota mendukung terjemahan “benteng-benteng”.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai tempat berlindung” atau “sebagai kubu”. Kata Ibrani ini menggambarkan tempat tinggi dan aman yang memberikan perlindungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks mazmur ini, bentuk gramatikal yang tampak jamak berfungsi sebagai sebutan tunggal bagi Allah Israel; “Allah” adalah padanan Indonesia yang alami dan tepat.
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: di benteng-bentengnya
  rationale: אַרְמוֹן dapat menunjuk pada istana atau bangunan berkubu. Dalam konteks keamanan Sion, “benteng-benteng” menonjolkan pertahanan kota, sementara akhiran feminin tunggal diterjemahkan “-nya” dan mengacu pada kota itu.
- source_word: נוֹדַע
  choice: dikenal
  rationale: Bentuk Nifal dari ידע dapat menyatakan keadaan atau makna pasif, “dikenal”. Pilihan ini mempertahankan ungkapan Ibrani yang ringkas tanpa menambahkan gagasan refleksif secara eksplisit.
- source_word: לְמִשְׂגָּב
  choice: sebagai tempat perlindungan yang kokoh
  rationale: מִשְׂגָּב berarti tempat tinggi yang aman, dan secara kiasan tempat perlindungan atau kubu. Frasa ini alami dalam bahasa Indonesia serta mempertahankan citra keamanan dan perlindungan.
theological_decisions:
- issue: Acuan akhiran feminin pada “benteng-bentengnya”
  choice: Akhiran “-nya” mengacu pada Sion, yaitu kota yang dipuji dalam mazmur ini.
  alternative: Akhiran itu dapat dipahami lebih umum sebagai mengacu pada negeri atau komunitas.
  rationale: Konteks langsung Mazmur 48 berpusat pada Gunung Sion dan kota Allah, sehingga acuan kepada kota yang dipersonifikasikan paling sesuai.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Susunan kalimat mempertahankan keringkasan baris Ibrani; “tempat perlindungan yang kokoh” dipilih agar citra מִשְׂגָּב jelas bagi pembaca umum.
