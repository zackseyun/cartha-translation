  yaml_path: translation/ot/psalms/048/004.yaml
  text: For look, the kings assembled; they passed by together.
translation:
  language: id
  text: Sebab, lihatlah, raja-raja telah berkumpul; mereka lewat bersama-sama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai hubungan penjelasan dengan konteks sebelumnya; nilai kausalnya dipertahankan.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Mempertahankan seruan deiktis yang mengarahkan perhatian pembaca, dalam bentuk Indonesia yang wajar dan bermartabat.
- source_word: הַמְּלָכִים
  choice: raja-raja
  rationale: Padanan langsung bagi bentuk jamak dengan artikel tertentu; bahasa Indonesia tidak selalu perlu menyatakan ketakrifan secara terpisah.
- source_word: נוֹעֲדוּ
  choice: telah berkumpul
  rationale: Bentuk nifal dari יָעַד di sini menyatakan berhimpun atau bertemu; 'berkumpul' alami dan tidak menambahkan tujuan yang tidak dinyatakan.
- source_word: עָבְרוּ
  choice: maju
  rationale: Dalam konteks para raja yang berhimpun menghadapi Sion, verba 'melewati/menyeberang' secara idiomatis dapat menggambarkan gerak maju. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Menyatakan tindakan kolektif atau serentak para raja.
theological_decisions:
- issue: Arah dan maksud gerakan para raja
  choice: Tidak menyebut mereka menyerang atau mengepung
  alternative: mereka maju untuk menyerang bersama-sama
  rationale: Teks Ibrani hanya menyatakan bahwa mereka berhimpun dan bergerak bersama; maksud permusuhan tampak dari konteks, tetapi tidak perlu ditambahkan ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan dua klausa Ibrani dipertahankan, termasuk seruan “lihatlah” dan gerak kolektif para raja.
