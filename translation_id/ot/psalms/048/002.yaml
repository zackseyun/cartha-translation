source:
  edition: WLC
  text: יְפֵ֥ה נוֹף֮ מְשׂ֪וֹשׂ כָּל הָ֫/אָ֥רֶץ הַר צִ֭יּוֹן יַרְכְּתֵ֣י צָפ֑וֹן קִ֝רְיַ֗ת מֶ֣לֶךְ רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: id
  text: Indah menjulang, sukacita seluruh bumi, adalah Gunung Sion, di ujung utara,[a] kota Sang Raja Agung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di lereng-lereng utara”; secara harfiah, “di bagian-bagian paling jauh/sisi-sisi utara.” Frasa ini mungkin juga menggemakan gambaran gunung ilahi yang berkaitan dengan Zafon.
    reason: alternative_reading
lexical_decisions:
- source_word: יְפֵה נוֹף
  choice: Indah menjulang
  rationale: Gabungan ini menggambarkan keindahan Sion dalam ketinggian atau letaknya yang luhur. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan kesulitan makna נוֹף tanpa membuatnya terlalu teknis.
- source_word: מְשׂוֹשׂ כָּל הָאָרֶץ
  choice: sukacita seluruh bumi
  rationale: מְשׂוֹשׂ berarti sukacita atau kegirangan, sedangkan כָּל הָאָרֶץ di sini paling wajar dipahami dalam cakupan universal sebagai seluruh bumi.
- source_word: הַר צִיּוֹן
  choice: Gunung Sion
  rationale: Padanan baku dan jelas bagi nama tempat beserta kata benda geografisnya.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: di ujung utara
  rationale: יַרְכְּתֵי menunjuk bagian-bagian paling jauh atau sisi-sisi, dan צָפוֹן berarti utara serta mungkin juga menggemakan nama Zafon. Pilihan ini mempertahankan gambaran geografis tanpa menutup kemungkinan gaung puitis-kosmis.
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: kota Sang Raja Agung
  rationale: Rangkaian konstruksi ini berarti kota milik Raja yang agung. Kapitalisasi dan pemakaian 'Sang' secara alami menunjukkan bahwa sebutan tersebut menunjuk kepada Allah dalam konteks mazmur, tanpa menambahkan nama yang tidak dinyatakan.
theological_decisions:
- issue: Makna יַרְכְּתֵי צָפוֹן dalam hubungannya dengan Gunung Sion
  choice: di ujung utara
  alternative: di lereng-lereng utara; di pelosok Zafon
  rationale: Frasa Ibrani dapat dibaca sebagai keterangan topografis, tetapi mungkin pula menggemakan gambaran gunung ilahi yang berkaitan dengan Zafon. Teks utama mempertahankan ungkapan geografis yang cukup terbuka, sedangkan catatan kaki menyajikan kemungkinan lain.
- issue: Identitas מֶלֶךְ רָב
  choice: Sang Raja Agung
  alternative: seorang raja besar
  rationale: Dalam konteks pujian kepada kota Allah, frasa ini paling mungkin menunjuk kepada Allah sebagai Raja. Namun, terjemahan tetap berupa gelar sebagaimana teks sumber dan tidak menggantinya dengan nama ilahi.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, ringkas, dan bermartabat. Susunan aposisional ayat dipertahankan, sementara tanda baca membantu keterbacaan. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diperdebatkan.
