base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: id
  text: Besarlah Yahweh, dan sangat layak dipuji[a] di kota Allah kita, di gunung-Nya yang kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan sangat dipuji.” Partisip pasif Ibrani dapat diterjemahkan lebih harfiah sebagai “dipuji” atau secara idiomatis sebagai “layak dipuji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Besarlah
  rationale: Adjektiva predikatif yang membuka ayat; bentuk ini mempertahankan penekanan dan urutan puitis Ibrani tanpa membatasi maknanya hanya pada kuasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: וּמְהֻלָּל מְאֹד
  choice: dan sangat layak dipuji
  rationale: Partisip pasif dari הלל dapat menyatakan bahwa Yahweh dipuji atau patut dipuji. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan daya predikatifnya, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: di kota Allah kita
  rationale: בְּ menyatakan lokasi, sedangkan bentuk konstruksi dengan sufiks orang pertama jamak dipertahankan secara alami sebagai 'kota Allah kita'.
- source_word: הַר קָדְשׁוֹ
  choice: gunung-Nya yang kudus
  rationale: Frasa ini mengikuti 'kota Allah kita' sebagai keterangan puitis yang mengidentifikasi atau menjelaskan lokasi kudus tersebut; 'gunung' mempertahankan arti langsung הַר.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar seperti 'TUHAN'.
- issue: Daya makna partisip pasif מְהֻלָּל
  choice: layak dipuji
  alternative: dipuji
  rationale: Konteks pujian mendukung arti kepatutan atau kelayakan untuk dipuji, tetapi bentuk Ibraninya juga dapat dibaca sebagai keadaan faktual 'dipuji'; ambiguitas ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Inversi 'Besarlah Yahweh' mempertahankan penekanan puitis pada awal ayat. Tanda koma mempertahankan hubungan apposisi yang ringkas antara kota Allah dan gunung-Nya yang kudus.
