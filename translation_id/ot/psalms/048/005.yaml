  text: הֵ֣מָּה רָ֭אוּ כֵּ֣ן תָּמָ֑הוּ נִבְהֲל֥וּ נֶחְפָּֽזוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/005.yaml
  text: They saw[a], and so they were astonished; they were terrified; they fled in haste.
translation:
  language: id
  text: Mereka melihat, lalu tercengang; mereka ketakutan, lalu bergegas pergi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melarikan diri dengan tergesa-gesa.” Kata kerja Ibrani menunjukkan tindakan cepat dan mendesak, kemungkinan karena kepanikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Mereka
  rationale: Pronomina mandiri orang ketiga jamak ini memberi penekanan. Dalam bahasa Indonesia, “Mereka” sudah wajar dan memadai tanpa tambahan penegas.
- source_word: רָאוּ
  choice: melihat
  rationale: Bentuk qal dari ראה adalah kata umum untuk “melihat”. Objeknya tidak dinyatakan dalam teks Ibrani, sehingga terjemahan juga tidak menambahkannya.
- source_word: כֵּן
  choice: lalu
  rationale: Partikel ini menghubungkan apa yang mereka lihat dengan reaksi berikutnya. “Lalu” menyampaikan urutan sekaligus akibat secara alami dalam bahasa Indonesia.
- source_word: תָּמָהוּ
  choice: tercengang
  rationale: Bentuk qal dari תמה menyatakan rasa heran atau tercengang. Pilihan ini sesuai dengan reaksi mendadak dalam rangkaian ayat tanpa menentukan apakah rasa heran itu positif atau negatif.
- source_word: נִבְהֲלוּ
  choice: ketakutan
  rationale: Bentuk nifal dari בהל dapat berarti menjadi gentar, kalut, atau takut. “Ketakutan” mempertahankan intensitas rangkaian reaksi tersebut.
- source_word: נֶחְפָּזוּ
  choice: bergegas pergi
  rationale: Bentuk nifal dari חפז menyatakan gerakan tergesa-gesa di bawah tekanan. “Bergegas pergi” dekat dengan makna leksikal tanpa secara mutlak menetapkan bahwa kata kerjanya sendiri berarti “melarikan diri”; nuansa kepanikan dijelaskan dalam catatan kaki.
