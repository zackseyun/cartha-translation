  yaml_path: translation/ot/psalms/048/011.yaml
  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: id
  text: Biarlah Gunung Sion bersukacita; biarlah putri-putri Yehuda[a] bergembira karena penghakiman-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kota-kota/perkampungan Yehuda”; dalam bahasa puisi, “putri-putri” dapat merujuk pada kota atau permukiman yang bergantung pada suatu wilayah induk.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: biarlah ... bersukacita
  rationale: Bentuk imperfek Qal orang ketiga maskulin tunggal dapat bernuansa yusif dalam puisi; ungkapan ini mempertahankan dorongan perayaan.
- source_word: הַר צִיּוֹן
  choice: Gunung Sion
  rationale: Padanan Indonesia yang alami dan baku untuk frasa konstruksi dengan nama diri ini, sekaligus mempertahankan citra topografis.
- source_word: תָּגֵלְנָה
  choice: biarlah ... bergembira
  rationale: Bentuk imperfek Qal orang ketiga feminin jamak dari גיל menyatakan kegembiraan besar; pilihan ini menjaga kesejajaran dengan klausa pertama tanpa pengulangan kata yang kaku.
- source_word: בְּנוֹת יְהוּדָה
  choice: putri-putri Yehuda
  rationale: Terjemahan harfiah yang mempertahankan metafora puitis Ibrani; kemungkinan bahwa ungkapan ini menunjuk pada kota-kota atau permukiman Yehuda dicatat dalam catatan kaki.
- source_word: לְמַעַן
  choice: karena
  rationale: Dalam konteks ini kata tersebut memperkenalkan alasan bagi sukacita; 'karena' merupakan ungkapan kausal yang alami dalam bahasa Indonesia.
- source_word: מִשְׁפָּטֶיךָ
  choice: penghakiman-penghakiman-Mu
  rationale: Bentuk jamak dan sufiks orang kedua dipertahankan. Dalam konteks mazmur, istilah ini paling mungkin menunjuk pada tindakan-tindakan keputusan ilahi, bukan terutama ketetapan hukum.
theological_decisions:
- issue: Makna מִשְׁפָּטֶיךָ dalam konteks
  choice: penghakiman-penghakiman-Mu
  alternative: keadilan-Mu; ketetapan-ketetapan-Mu
  rationale: Konteks merayakan tindakan Allah sebagai Raja dan Hakim terhadap para lawan. Terjemahan ini mempertahankan penekanan tersebut tanpa menutup rentang makna yudisial kata Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan puitis. Kesejajaran dua klausa Ibrani dipertahankan melalui pola 'Biarlah ...; biarlah ...'. Metafora 'putri-putri Yehuda' dipertahankan dalam teks utama, dengan arti geografis alternatif dijelaskan dalam catatan kaki.
