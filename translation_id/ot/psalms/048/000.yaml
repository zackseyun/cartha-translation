lexical_decisions:
- source_word: שִׁיר
  choice: nyanyian
  rationale: Istilah ini merupakan kata Ibrani yang umum untuk nyanyian. Dalam judul mazmur, “nyanyian” alami dan tidak menambahkan nuansa yang tidak dinyatakan.
- source_word: מִזְמוֹר
  choice: mazmur
  rationale: Dalam judul kitab Mazmur, istilah ini adalah penanda jenis karya yang lazim diterjemahkan “mazmur”. Pembedaan antara שִׁיר dan מִזְמוֹר dipertahankan.
- source_word: לִבְנֵי
  choice: bani
  rationale: “Bani Korah” adalah ungkapan ringkas dan bermartabat bagi kelompok keturunan Korah. Hubungan yang ditandai oleh preposisi ל tidak diperinci dalam teks utama; kemungkinan arti “untuk” dicatat dalam catatan kaki.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ini ditransliterasikan dengan bentuk yang sudah lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Fungsi preposisi ל dalam frasa לִבְנֵי קֹרַח
  choice: Mazmur bani Korah
  alternative: Mazmur untuk bani Korah
  rationale: Preposisi Ibrani ל dalam judul mazmur dapat menunjukkan kepengarangan, keterkaitan, peruntukan, atau konteks pementasan. Teks utama tidak mempersempitnya menjadi satu fungsi tertentu, sedangkan kemungkinan arti “untuk” disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Bani Korah” dipakai sebagai sebutan kelompok yang mapan dan menghindari kesan bahwa yang dimaksud harus anak-anak kandung Korah. Dua penanda, “nyanyian” dan “mazmur”, tetap dipertahankan.
