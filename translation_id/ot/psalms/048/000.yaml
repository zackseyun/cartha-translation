  language: id
  text: Nyanyian. Mazmur bani Korah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mazmur untuk bani Korah.” Preposisi Ibrani dalam judul mazmur dapat menunjukkan keterkaitan, kepengarangan, peruntukan, atau konteks pementasan.'
