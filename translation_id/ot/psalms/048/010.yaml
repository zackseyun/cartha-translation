source:
  edition: WLC
  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: id
  text: Seperti nama-Mu, ya Allah, demikian pula pujian kepada-Mu sampai ke ujung-ujung bumi[a]; tangan kanan-Mu penuh dengan kebenaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pujian kepada-Mu meliputi ujung-ujung bumi.” Kata depan Ibrani secara harfiah berarti “di atas/atas” dan dapat diterjemahkan secara lebih formal.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “keadilan.” Kata Ibrani צֶדֶק dapat berarti kebenaran atau keadilan.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשִׁמְךָ ... כֵּן
  choice: Seperti nama-Mu ... demikian pula
  rationale: Mempertahankan pola perbandingan puitis Ibrani ‘seperti ... demikian’ tanpa menjelaskan ‘nama’ sebagai reputasi atau kemasyhuran.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Konteks menunjukkan sapaan langsung; partikel ‘ya’ menyatakan fungsi vokatif secara wajar dalam bahasa Indonesia.
- source_word: תְּהִלָּתְךָ
  choice: pujian kepada-Mu
  rationale: Menunjukkan pujian yang ditujukan kepada Allah dengan ungkapan Indonesia yang alami, sambil tetap mempertahankan gagasan dasar ‘pujian’.
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: sampai ke ujung-ujung bumi
  rationale: Walaupun עַל secara harfiah dapat berarti ‘di atas/atas’, dalam konteks ini frasa tersebut secara idiomatis menyatakan luasnya jangkauan pujian. Alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: צֶדֶק
  choice: kebenaran
  rationale: Istilah ini mencakup kebenaran moral dan keadilan. ‘Kebenaran’ dipakai dalam teks utama, sedangkan ‘keadilan’ dipertahankan sebagai alternatif.
- source_word: מָלְאָה יְמִינֶךָ
  choice: tangan kanan-Mu penuh dengan
  rationale: Menerjemahkan keadaan hasil yang dinyatakan oleh verba perfektum dan mempertahankan gambaran tangan kanan sebagai kuasa serta tindakan Allah.
theological_decisions:
- issue: Makna צֶדֶק dalam gambaran tangan kanan Allah
  choice: kebenaran
  alternative: keadilan
  rationale: Kata Ibrani ini dapat menunjuk pada kelurusan moral maupun pelaksanaan keadilan. Teks utama tidak memperluasnya secara doktrinal, dan nuansa yudisial dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pola perbandingan puisi Ibrani dipertahankan, sementara susunan klausa dibuat alami bagi pembaca umum. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
