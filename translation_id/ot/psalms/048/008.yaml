  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: id
  text: 'Seperti yang telah kami dengar, demikianlah yang telah kami lihat di kota Yahweh Semesta Alam, di kota Allah kami: Allah akan meneguhkan kota itu untuk selama-lamanya.[a] Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “akan meneguhkannya.” Akhiran feminin dalam bahasa Ibrani merujuk kepada “kota,” kata benda yang bergender feminin dan dapat dipersonifikasikan dalam puisi.
    reason: Menjelaskan bentuk pronominal Ibrani dan alasan teks utama menyebut ulang 'kota itu' dalam bahasa Indonesia.
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Seperti ... demikianlah
  rationale: Pasangan korelatif ini mempertahankan perbandingan tegas antara kabar yang didengar dan kenyataan yang dilihat, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: שָׁמַעְנוּ ... רָאִינוּ
  choice: telah kami dengar ... telah kami lihat
  rationale: Kedua verba perfektif diterjemahkan secara sejajar dengan 'telah' untuk menyatakan pengalaman yang sudah terjadi dan kini ditegaskan.
- source_word: בְּעִיר
  choice: di kota
  rationale: Menyampaikan fungsi lokatif preposisi בְּ secara langsung dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: צְבָאוֹת
  choice: Semesta Alam
  rationale: Dalam gelar ilahi yang mapan dalam bahasa Indonesia, ungkapan ini menyampaikan keluasan bala surgawi tanpa membatasi maknanya hanya pada pasukan manusia.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: Bentuk konstruk dengan akhiran orang pertama jamak diterjemahkan langsung dan ringkas.
- source_word: יְכוֹנְנֶהָ
  choice: akan meneguhkan kota itu
  rationale: Verba כון menyatakan tindakan membuat teguh atau kokoh. Penyebutan ulang 'kota itu' memperjelas rujukan akhiran feminin tanpa memaksakan personifikasi bergender yang tidak alami dalam bahasa Indonesia.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang alami untuk keberlangsungan tanpa akhir.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah Ibrani ini ditransliterasikan karena fungsi tepatnya tidak pasti.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Rujukan akhiran feminin pada יְכוֹנְנֶהָ
  choice: Allah akan meneguhkan kota itu
  alternative: Allah akan meneguhkannya; Allah akan meneguhkan dia
  rationale: Akhiran feminin tunggal paling alami merujuk kepada עִיר, 'kota', yang bergender feminin dalam bahasa Ibrani. Bahasa Indonesia tidak memberi gender gramatikal pada 'kota'; penyebutan ulang menjaga rujukannya dengan jelas tanpa menciptakan personifikasi yang lebih kuat daripada yang dituntut bahasa sasaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Struktur paralel ayat dipertahankan. Nama Yahweh digunakan secara langsung; 'Sela' dipertahankan sebagai transliterasi. Penempatan penanda catatan kaki mengikuti klausa yang dijelaskannya.
