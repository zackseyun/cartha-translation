  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: id
  text: Semuanya akan binasa, tetapi Engkau akan tetap ada; semuanya akan menjadi usang seperti pakaian. Seperti busana, Engkau akan mengganti mereka[a], lalu mereka akan berlalu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengubah mereka.” Kata Ibrani dapat berarti mengubah, menukar, atau mengganti, sesuai dengan kiasan tentang pakaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה יֹאבֵדוּ
  choice: Semuanya akan binasa
  rationale: Pronomina jamak menunjuk kembali kepada langit dan bumi dalam konteks sebelumnya. 'Binasa' menyampaikan אבד tanpa harus menyiratkan pemusnahan mutlak.
- source_word: וְאַתָּה תַעֲמֹד
  choice: tetapi Engkau akan tetap ada
  rationale: Kata sambung dipahami secara kontras. Secara harfiah עמד berarti 'berdiri', tetapi di sini menyatakan keberadaan yang terus bertahan, berlawanan dengan ciptaan yang binasa.
- source_word: וְכֻלָּם כַּבֶּגֶד יִבְלוּ
  choice: semuanya akan menjadi usang seperti pakaian
  rationale: בלה lazim menggambarkan pakaian yang menjadi usang; susunan ini mempertahankan kiasan dan terdengar alami dalam bahasa Indonesia.
- source_word: כַּלְּבוּשׁ תַּחֲלִיפֵם
  choice: Seperti busana, Engkau akan mengganti mereka
  rationale: Hifil חלף dapat berarti mengubah, menukar, atau mengganti. 'Mengganti' paling jelas mempertahankan gambaran seseorang mengganti pakaian, namun alternatif semantis dicatat.
- source_word: וְיַחֲלֹפוּ
  choice: lalu mereka akan berlalu
  rationale: Qal חלף menyatakan peralihan atau berlalunya sesuatu. 'Berlalu' mempertahankan hubungan leksikal dengan tindakan mengganti tanpa menentukan secara berlebihan bagaimana perubahan itu terjadi.
theological_decisions:
- issue: Kekekalan Allah dibandingkan dengan kefanaan ciptaan
  choice: Mengontraskan ciptaan yang binasa dan menjadi usang dengan Allah yang tetap ada.
  alternative: Menerjemahkan secara lebih harfiah, 'Engkau akan berdiri'.
  rationale: '''Tetap ada'' menyampaikan fungsi idiomatis תעמד dalam konteks ini tanpa memasukkan rumusan doktrinal yang lebih luas daripada yang dinyatakan ayat.'
- issue: Makna perubahan ciptaan dalam metafora pakaian
  choice: Engkau akan mengganti mereka
  alternative: Engkau akan mengubah mereka
  rationale: Teks dapat menunjuk pada penggantian atau perubahan. Pilihan 'mengganti' menghidupkan metafora pakaian, sementara catatan kaki menjaga alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi 'Engkau' menandai sapaan kepada Allah. Variasi 'pakaian' dan 'busana' mencerminkan dua istilah Ibrani yang bertumpang tindih serta menghindari pengulangan yang kaku.
