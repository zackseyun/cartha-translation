  yaml_path: translation/ot/psalms/102/021.yaml
  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
translation:
  language: id
  text: 'untuk memberitakan nama Yahweh di Sion,

    dan pujian-Nya di Yerusalem,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסַפֵּר
  choice: untuk memberitakan
  rationale: Infinitif dengan לְ menyatakan tujuan atau hasil dalam konteks ini. Bentuk piel dari ספר berarti menceritakan atau menyatakan; dengan objek 'nama Yahweh', 'memberitakan' secara alami menyampaikan tindakan pengumuman di muka umum.
- source_word: בְּצִיּוֹן
  choice: di Sion
  rationale: Preposisi בְּ dengan nama tempat paling wajar diterjemahkan 'di'; 'Sion' adalah bentuk baku dalam bahasa Indonesia.
- source_word: שֵׁם יְהוָה
  choice: nama Yahweh
  rationale: Terjemahan langsung ini mempertahankan keluasan makna 'nama' sebagai identitas dan reputasi yang dinyatakan, sekaligus mempertahankan nama ilahi.
- source_word: וּתְהִלָּתוֹ
  choice: dan pujian kepada-Nya
  rationale: תְּהִלָּה berarti 'pujian', sedangkan sufiks orang ketiga tunggal maskulin dapat menunjuk pada pujian milik-Nya, tentang Dia, atau yang ditujukan kepada-Nya. Dalam bahasa Indonesia, 'pujian kepada-Nya' paling alami dalam konstruksi eliptis yang mengikuti verba 'memberitakan', tanpa mengubahnya menjadi 'kemasyhuran'.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi בִּ paling alami diterjemahkan 'di' dengan nama kota; 'Yerusalem' adalah bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi dan tidak menggantinya dengan gelar.
- issue: Makna sufiks dalam וּתְהִלָּתוֹ
  choice: pujian kepada-Nya
  alternative: pujian-Nya; kemasyhuran-Nya
  rationale: Ungkapan Ibrani dapat dipahami sebagai pujian yang ditujukan kepada Yahweh atau pujian/kemasyhuran yang berkaitan dengan-Nya. Pilihan ini selaras dengan tindakan 'memberitakan' dan terdengar alami, tetapi tidak menambahkan konsep denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme puisi antara Sion dan Yerusalem dipertahankan dalam dua baris; koma akhir dipertahankan karena ayat ini melanjutkan kalimat dari konteks sekitarnya.
