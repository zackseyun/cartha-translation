  text: All day long my enemies reproach me[b][a]; those who mock me swear by me.
translation:
  language: id
  text: Sepanjang hari musuh-musuhku mencela aku; orang-orang yang mengolok-olok aku bersumpah demi aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bersumpah demi aku.” Ungkapan Ibrani ini sulit. Maksudnya mungkin mereka memakai pemazmur—nama atau keadaannya—dalam rumusan kutukan dalam sumpah mereka; mungkin juga, “bersumpah melawan aku.”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Sepanjang hari
  rationale: Ungkapan waktu idiomatis yang menyatakan tindakan berlangsung terus sepanjang hari.
- source_word: חֵרְפוּנִי
  choice: mencela aku
  rationale: Kata חרף menyatakan celaan atau penghinaan bernada merendahkan; 'mencela' alami dalam bahasa Indonesia dan tetap mempertahankan keluasan maknanya.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan alami untuk nomina jamak dengan akhiran kepunyaan orang pertama.
- source_word: מְהוֹלָלַי
  choice: orang-orang yang mengolok-olok aku
  rationale: Bentuk Ibrani ini sulit, tetapi dalam konteks menunjuk kepada orang-orang yang memperlakukan pemazmur dengan ejekan; terjemahan ini menyampaikan makna yang paling mungkin secara jelas.
- source_word: בִּי נִשְׁבָּעוּ
  choice: bersumpah dengan menyebut namaku
  rationale: Secara harfiah konstruksi ini berarti 'bersumpah demi/dengan aku'. Dalam konteks permusuhan, nama atau keadaan pemazmur tampaknya digunakan dalam rumusan sumpah bernada kutuk; 'dengan menyebut namaku' membuat rujukan itu alami tanpa menghapus ambiguitas, yang dijelaskan dalam catatan kaki.
