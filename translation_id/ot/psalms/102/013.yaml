base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: id
  text: Engkau akan bangkit dan berbelas kasih kepada Sion, sebab sudah waktunya Engkau menunjukkan kemurahan kepadanya[a], sebab waktu yang ditetapkan telah tiba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bermurah hati kepadanya” atau “menganugerahkan kemurahan kepadanya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “waktu yang sudah ditentukan telah tiba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקוּם
  choice: Engkau akan bangkit
  rationale: Bentuk imperfek qal orang kedua tunggal maskulin dari קום dipahami sebagai tindakan Allah yang akan datang. “Bangkit” mempertahankan gambaran antropomorfis yang hidup tanpa menjelaskannya secara berlebihan.
- source_word: תְּרַחֵם
  choice: berbelaskasihan
  rationale: Bentuk piel dari רחם menyatakan tindakan menunjukkan belas kasihan atau kasih sayang yang mendalam. “Berbelaskasihan” alami dan tepat dalam bahasa Indonesia serta tidak sekadar menyiratkan rasa iba pasif.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Nama tempat dipertahankan melalui bentuk transliterasi Indonesia. Walaupun Sion dapat merujuk secara metonimis kepada Yerusalem atau umat Allah, terjemahan utama mempertahankan nama yang disebut teks.
- source_word: כִּי
  choice: sebab; sungguh
  rationale: כִּי pertama memperkenalkan alasan bagi tindakan Allah, sehingga diterjemahkan “sebab”. Pada kemunculan kedua, partikel itu menegaskan bahwa saat tersebut sudah tiba; “sungguh” menyampaikan daya penegasnya dengan alami dan menghindari pengulangan “sebab” yang kaku.
- source_word: עֵת
  choice: sudah waktunya
  rationale: עֵת berarti “waktu”. Susunan “sudah waktunya” merupakan ungkapan Indonesia yang alami untuk menyatakan bahwa saat bagi tindakan tersebut kini telah tiba.
- source_word: לְחֶנְנָהּ
  choice: Engkau menunjukkan kemurahan kepadanya
  rationale: Infinitif konstruk חנן dengan prefiks ל dan sufiks feminin tunggal menyatakan tindakan bermurah hati kepada Sion. Subjek “Engkau” dinyatakan kembali agar hubungan gramatikalnya jelas dan alami dalam bahasa Indonesia.
- source_word: בָא
  choice: telah tiba
  rationale: Bentuk perfektif dari בוא menyatakan bahwa waktu yang dimaksud sudah datang. “Telah tiba” mempertahankan aspek kedatangan yang selesai dan relevan bagi keadaan sekarang.
- source_word: מוֹעֵד
  choice: waktu yang ditetapkan
  rationale: מוֹעֵד menunjuk pada waktu tertentu yang telah ditentukan atau ditetapkan. Pilihan ini mempertahankan gagasan penetapan tanpa menentukan secara eksplisit siapa yang menetapkannya.
theological_decisions:
- issue: Apakah Sion perlu diterjemahkan secara konkret atau ditafsirkan
  choice: Mempertahankan “Sion” sebagai nama objek belas kasihan Allah.
  alternative: Yerusalem; umat Allah
  rationale: Teks Ibrani secara langsung menyebut Sion. Kemungkinan makna metonimis atau teologis yang lebih luas dibiarkan muncul dari konteks dan tidak dimasukkan ke dalam terjemahan utama.
- issue: Apakah penetap waktu perlu disebut secara eksplisit
  choice: Menggunakan bentuk pasif “waktu yang ditetapkan” tanpa menambahkan pelaku.
  alternative: waktu yang ditetapkan Allah
  rationale: Konteks memungkinkan pemahaman bahwa Allah menetapkannya, tetapi teks ayat ini tidak menyatakan pelakunya secara eksplisit. Bentuk pasif menjaga ketegangan dan implikasi asli tanpa menambah informasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat tetapi mudah dipahami. Kata ganti “Engkau” menandai sapaan langsung kepada Allah. Tanda titik koma mempertahankan hubungan erat antara alasan dan penegasan bahwa waktu yang ditetapkan sudah tiba.
