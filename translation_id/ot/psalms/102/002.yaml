base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/002.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
translation:
  language: id
  text: Jangan sembunyikan wajah-Mu dariku pada hari kesesakanku.[a] Condongkanlah telinga-Mu kepadaku. Pada hari aku berseru, jawablah aku segera.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada hari kesesakan bagi/menimpaku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “segeralah menjawab aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: Jangan sembunyikan
  rationale: Partikel larangan אַל dan verba סתר menyatakan permohonan mendesak agar Allah tidak menyembunyikan diri-Nya.
- source_word: פָּנֶיךָ
  choice: wajah-Mu
  rationale: Mempertahankan gambaran konkret Ibrani; dalam idiom ini, wajah dapat menunjuk pada kehadiran atau perkenanan Allah.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Padanan alami bagi frasa preposisional yang menyatakan pemisahan.
- source_word: בְּיוֹם צַר לִי
  choice: pada hari aku dalam kesesakan
  rationale: Menjaga ungkapan temporal 'pada hari' dan menyampaikan secara alami keadaan kesesakan yang menimpa pemazmur.
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  choice: Condongkanlah telinga-Mu kepadaku
  rationale: Mempertahankan idiom antropomorfis dan citra puitis tentang perhatian Allah.
- source_word: בְּיוֹם אֶקְרָא
  choice: Pada hari aku berseru
  rationale: Menjaga pengulangan בְּיוֹם dan memakai 'berseru' untuk konteks doa ratapan yang mendesak.
- source_word: מַהֵר עֲנֵנִי
  choice: segeralah jawab aku
  rationale: מַהֵר dapat dipahami secara verbal sebagai desakan untuk segera bertindak; susunan ini alami dan kuat dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa antropomorfis bagi Allah ('wajah' dan 'telinga')
  choice: Mempertahankan gambaran konkret dalam teks utama
  alternative: Menafsirkan sebagai 'kehadiran-Mu' dan 'dengarkanlah aku'
  rationale: Bahasa tubuh dalam puisi Ibrani mengungkapkan perkenanan, kehadiran, dan perhatian Allah tanpa harus menyatakan bahwa Allah bertubuh.
- issue: Pengulangan frasa temporal בְּיוֹם
  choice: Mempertahankan 'pada hari' pada kedua klausa
  alternative: Mengalihkannya menjadi 'ketika aku dalam kesesakan' dan 'ketika aku berseru'
  rationale: Pengulangan tersebut merupakan bagian dari struktur dan desakan puitis ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'wajah-Mu' dan 'telinga-Mu' mempertahankan citra puisi Ibrani, sedangkan 'segeralah jawab aku' menyampaikan urgensi dengan wajar.
