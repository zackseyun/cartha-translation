  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: id
  text: 'karena amarah-Mu dan murka-Mu,

    sebab Engkau telah mengangkat aku,

    lalu mencampakkan aku.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: lalu melemparkan aku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: karena
  rationale: 'Dalam konstruksi ini, ungkapan tersebut menyatakan sebab, bukan tempat: keadaan pemazmur terjadi karena kemarahan Allah.'
- source_word: זַעַמְךָ
  choice: geram-Mu
  rationale: Kata 'geram' menyampaikan kemarahan yang kuat dan tetap membedakannya dari קֶצֶף dalam pasangan puitis ini.
- source_word: וְקִצְפֶּךָ
  choice: dan murka-Mu
  rationale: '''Murka'' merupakan padanan alami dan bermartabat bagi kemarahan hebat, serta mempertahankan dua istilah Ibrani yang berdekatan maknanya.'
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan penjelasan bagi keadaan pemazmur; 'sebab' mempertahankan hubungan penjelas itu secara alami.
- source_word: נְשָׂאתַנִי
  choice: Engkau telah mengangkat aku
  rationale: נשא dapat berarti mengangkat, membawa, atau menanggung. Dalam pasangan dengan tindakan melemparkan, 'mengangkat' mempertahankan gambaran konkret dan kontras puitisnya.
- source_word: וַתַּשְׁלִיכֵנִי
  choice: lalu mencampakkan aku
  rationale: שלך berarti melemparkan atau mencampakkan. 'Mencampakkan' menyampaikan tindakan keras sekaligus nuansa penolakan, sedangkan 'lalu' memperjelas urutan tindakan yang tersirat dalam bentuk naratif Ibrani.
theological_decisions:
- issue: Penggambaran kemarahan Allah
  choice: Mempertahankan dua istilah, 'geram-Mu dan murka-Mu', tanpa melunakkan keduanya.
  alternative: Menyatukan keduanya menjadi satu istilah umum seperti 'kemarahan-Mu'.
  rationale: Teks Ibrani memakai dua kata yang bertumpang tindih tetapi tidak identik. Terjemahan mempertahankan intensitas dan kesejajaran puitisnya tanpa menambahkan penjelasan doktrinal.
- issue: Tindakan Allah terhadap pemazmur
  choice: Mempertahankan gambaran langsung bahwa Allah mengangkat lalu mencampakkan pemazmur.
  alternative: Menafsirkannya secara tidak langsung sebagai sekadar perubahan keadaan atau perasaan pemazmur.
  rationale: Teks secara tegas menempatkan Allah sebagai pelaku kedua tindakan itu. Ketegangan teologis tersebut dipertahankan sebagaimana adanya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kapital pada pronomina yang merujuk kepada Allah mengikuti kelaziman gaya Alkitab bahasa Indonesia. Pemenggalan tiga baris menonjolkan hubungan sebab dan kontras antara 'mengangkat' dan 'mencampakkan'.
