  text: פָּ֭נָה אֶל תְּפִלַּ֣ת הָ/עַרְעָ֑ר וְ/לֹֽא בָ֝זָ֗ה אֶת תְּפִלָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/017.yaml
  text: He turned to the prayer of the destitute and did not despise their prayer[a].
translation:
  language: id
  text: Ia berpaling kepada doa orang yang papa[a] dan tidak memandang hina doa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang melarat,” “orang yang tidak berdaya.” Dalam konteks lain, kata Ibrani ini juga dapat menyebut sejenis semak gurun; gambaran itu mungkin melatarbelakangi keadaan orang yang seakan-akan tidak memiliki apa-apa atau hidup terasing di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנָה
  choice: berpaling kepada
  rationale: Mempertahankan gambaran konkret verba Ibrani ‘berpaling/menghadap kepada’ sekaligus menyampaikan bahwa Allah memberi perhatian kepada doa itu.
- source_word: תְּפִלַּת
  choice: doa
  rationale: Padanan langsung dan alami; pengulangannya pada akhir ayat dipertahankan sesuai teks Ibrani.
- source_word: הָעַרְעָר
  choice: orang yang papa
  rationale: Dalam konteks ini kata tersebut menunjuk kepada manusia yang serba kekurangan, telanjang dari pertolongan, atau terasing. ‘Orang yang papa’ alami dalam bahasa Indonesia dan mempertahankan keadaan kemelaratan tanpa mempersempitnya hanya pada kekurangan materi.
- source_word: בָזָה
  choice: memandang hina
  rationale: 'Menyampaikan daya emosional dan penilaian dari verba Ibrani: menganggap rendah atau memperlakukan dengan penghinaan.'
- source_word: תְּפִלָּתָם
  choice: doa mereka
  rationale: Akhiran Ibrani berbentuk jamak (‘mereka’), sedangkan kata bendanya tetap tunggal. Padanan ini mempertahankan peralihan dari sebutan kolektif tunggal kepada kelompok yang diwakilinya.
theological_decisions:
- issue: Makna antropologis עַרְעָר
  choice: orang yang papa sebagai sebutan kolektif bagi manusia yang tidak berdaya dan berkekurangan
  alternative: orang yang sendirian; orang yang digambarkan seperti semak gurun
  rationale: Penyebutan ‘doa mereka’ menunjukkan bahwa yang dimaksud adalah manusia, bukan tumbuhan secara harfiah. Namun, latar citra ketandusan atau keterasingan tetap dicatat tanpa menjadikannya tafsiran utama dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ungkapan ‘berpaling kepada’ mempertahankan citra Ibrani, sedangkan ‘memandang hina’ menyampaikan makna בזה dengan jelas. Bentuk tunggal ‘orang yang papa’ dipahami secara kolektif dan selaras dengan ‘mereka’ pada klausa berikutnya.
