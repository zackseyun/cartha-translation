translation:
  language: id
  text: Dahulu kala[a] Engkau meletakkan dasar bumi, dan langit adalah karya tangan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sejak dahulu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: Dahulu kala
  rationale: Keterangan waktu ini berarti ‘dahulu’ atau ‘sejak zaman lampau’. ‘Dahulu kala’ alami dalam bahasa Indonesia dan menegaskan waktu yang sangat lampau tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Paralelnya dengan ‘langit’ menunjukkan lingkup kosmis, sehingga ‘bumi’ lebih tepat daripada ‘negeri’ atau ‘tanah’.
- source_word: יָסַדְתָּ
  choice: Engkau meletakkan dasar
  rationale: Verba יסד menyatakan tindakan mendirikan atau meletakkan fondasi. Ungkapan ini mempertahankan citra dasar/fondasi yang terkandung dalam bahasa Ibrani dan terdengar wajar dalam puisi Indonesia.
- source_word: וּמַעֲשֵׂה
  choice: dan ... adalah karya
  rationale: Frasa nominal Ibrani diterjemahkan dengan kopula ‘adalah’ agar menjadi kalimat Indonesia yang lengkap dan alami.
- source_word: יָדֶיךָ
  choice: tangan-Mu
  rationale: Ungkapan antropomorfis tentang karya tangan Allah dipertahankan. Bahasa Indonesia lazim memakai bentuk kolektif tunggal ‘tangan-Mu’ dalam ungkapan ini meskipun bentuk Ibraninya merujuk pada kedua tangan.
- source_word: שָׁמָיִם
  choice: langit
  rationale: ‘Langit’ merupakan padanan Indonesia yang alami untuk שָׁמַיִם dan mempertahankan kesejajaran kosmis dengan ‘bumi’.
theological_decisions:
- issue: Bahasa penciptaan yang dikenakan langsung kepada Allah
  choice: 'Mempertahankan sapaan orang kedua secara langsung: Allah meletakkan dasar bumi, dan langit adalah karya tangan-Nya.'
  alternative: Melunakkan citra menjadi pernyataan tidak langsung bahwa bumi dan langit diciptakan Allah.
  rationale: Teks secara eksplisit menyatakan karya penciptaan Allah dalam bentuk doa kepada-Nya. Sapaan langsung dan citra antropomorfis ‘tangan-Mu’ dipertahankan tanpa mempersempit cakupan kosmisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pada ‘Engkau’ dan akhiran ‘-Mu’ menandai sapaan hormat kepada Allah. Susunan kalimat mempertahankan paralelisme antara bumi dan langit.
