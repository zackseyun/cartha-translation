  text: תִּכָּ֣תֶב זֹ֭את לְ/ד֣וֹר אַחֲר֑וֹן וְ/עַ֥ם נִ֝בְרָ֗א יְהַלֶּל יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/018.yaml
  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: id
  text: Hal ini akan dituliskan bagi generasi yang akan datang[a], dan suatu umat yang kelak diciptakan akan memuji Yah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bagi generasi terakhir.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Yah,” bentuk singkat dan puitis dari nama ilahi; banyak terjemahan mengalihkannya menjadi “TUHAN.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב זֹאת
  choice: Hal ini akan dituliskan
  rationale: Bentuk Nifal imperfek תִּכָּתֶב menyatakan tindakan pasif yang berorientasi ke depan, sedangkan זֹאת menunjuk pada kesaksian atau doa yang dibicarakan tanpa perlu menambahkan nomina penjelas.
- source_word: לְדוֹר אַחֲרוֹן
  choice: bagi generasi yang akan datang
  rationale: דּוֹר berarti “generasi,” dan אַחֲרוֹן dalam konteks ini paling wajar dipahami secara temporal sebagai generasi kemudian atau mendatang. Terjemahan ini tetap alami tanpa memaksakan makna eskatologis.
- source_word: וְעַם
  choice: dan suatu umat
  rationale: עַם berarti “umat” atau “bangsa.” Karena tidak memakai artikel dan menunjuk pada kelompok yang belum ada, “suatu umat” mempertahankan sifat tak tentu frasa Ibraninya.
- source_word: נִבְרָא
  choice: yang kelak diciptakan
  rationale: Partisip pasif dari ברא berarti “diciptakan.” Dalam kesejajaran dengan generasi mendatang, kata “kelak” menyampaikan orientasi prospektifnya secara alami.
- source_word: יְהַלֶּל
  choice: akan memuji
  rationale: Bentuk Piel imperfek dari הלל berarti “memuji”; bentuk masa depan sesuai dengan rangkaian pernyataan yang mengarah ke waktu mendatang.
- source_word: יָהּ
  choice: Yah
  rationale: Ini adalah bentuk singkat dan puitis dari nama ilahi, bukan bentuk lengkap יהוה. Transliterasi “Yah” mempertahankan perbedaan leksikal tersebut.
theological_decisions:
- issue: Makna temporal atau eskatologis אַחֲרוֹן
  choice: generasi yang akan datang
  alternative: generasi terakhir
  rationale: Konteks menekankan agar kesaksian tertulis tersedia bagi orang-orang pada masa depan. Namun, karena אַחֲרוֹן juga dapat berarti “terakhir,” kemungkinan itu dicatat tanpa dimasukkan secara paksa ke dalam teks utama.
- issue: Penerjemahan nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks sumber memakai bentuk pendek יָהּ. Mempertahankan “Yah” menghindari penyamaan diam-diam dengan bentuk lengkap יהוה dan menjaga corak puitis Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Hal ini” mempertahankan rujukan demonstratif yang luas; “suatu umat” menjaga ketaktentuan frasa sumber; “kelak” menyampaikan arah waktu tanpa membuat kalimat terasa kaku.
