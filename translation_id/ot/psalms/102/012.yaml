  text: וְ/אַתָּ֣ה יְ֭הוָה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וְ֝/זִכְרְ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: id
  text: Namun Engkau, ya Yahweh, bertakhta untuk selama-lamanya[a], dan ingatan akan Engkau dari generasi ke generasi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “duduk untuk selama-lamanya” atau “tetap ada untuk selama-lamanya.” Kata Ibrani ini secara harfiah berarti “duduk”, tetapi juga dapat menyatakan keberadaan yang tetap atau duduk sebagai raja.
    reason: lexical_alternative
  - marker: b
    text: Atau “peringatan akan Engkau” atau “kemasyhuran-Mu.” Kata Ibrani ini dapat berarti ingatan, peringatan, atau nama baik yang terus dikenang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Namun Engkau
  rationale: Konjungsi dan pronomina mandiri menandai kontras kuat dengan kefanaan pemazmur dalam konteks sebelumnya; “Namun Engkau” mengungkapkan daya adversatif itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan tanpa akhir dan membentuk kontras dengan kefanaan manusia.
- source_word: תֵּשֵׁב
  choice: bertakhta
  rationale: Secara harfiah verba ini berarti “duduk” dan dapat pula berarti menetap; dengan Yahweh sebagai subjek dalam konteks puitis, “bertakhta” menyampaikan nuansa kerajaan secara wajar.
- source_word: וְזִכְרְךָ
  choice: nama-Mu dikenang
  rationale: Nomina זֵכֶר dapat menunjuk pada ingatan, peringatan, atau nama yang terus disebut. Ungkapan Indonesia ini alami dan mempertahankan gagasan bahwa Yahweh terus diingat, tanpa membatasinya hanya pada ketenaran.
- source_word: לְדֹר וָדֹר
  choice: turun-temurun
  rationale: Idiom Indonesia ini secara ringkas dan alami menyatakan kesinambungan dari satu generasi ke generasi berikutnya.
theological_decisions:
- issue: Nuansa pemerintahan ilahi dalam תֵּשֵׁב
  choice: bertakhta untuk selama-lamanya
  alternative: duduk untuk selama-lamanya; tetap ada untuk selama-lamanya
  rationale: “Bertakhta” menyampaikan kemungkinan nuansa kerajaan dalam konteks mazmur, sedangkan catatan kaki mempertahankan arti harfiah dan kemungkinan makna keberlangsungan.
- issue: Makna זִכְרְךָ sebagai ingatan, peringatan, atau kemasyhuran
  choice: nama-Mu dikenang
  alternative: peringatan tentang-Mu; kemasyhuran-Mu; ingatan akan Engkau
  rationale: Pilihan utama dapat dipahami pembaca modern dan tidak menyempitkan kata itu menjadi kemasyhuran saja; rentang maknanya dicatat agar ketaksaan sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan khidmat. Kapitalisasi pronomina ilahi dipakai menurut kebiasaan editorial Indonesia. “Turun-temurun” dipilih sebagai padanan idiomatis bagi kesinambungan antargenerasi.
