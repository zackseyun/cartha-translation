  text: For he looked down from his holy height; the LORD gazed from heaven to earth,
translation:
  language: id
  text: Sebab Ia memandang ke bawah dari ketinggian-Nya yang kudus; TUHAN menatap dari langit ke bumi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁקִיף
  choice: memandang ke bawah
  rationale: Kata ini menyatakan tindakan melihat dari tempat yang tinggi ke bawah; pilihan ini mempertahankan arah pandangan yang tersirat dalam konteks.
- source_word: מְרוֹם קָדְשׁוֹ
  choice: tempat-Nya yang kudus
  rationale: Secara harfiah berarti 'ketinggian-Nya yang kudus'. Dalam bahasa Indonesia, 'tempat-Nya yang kudus' terdengar alami sambil tetap menunjuk tempat kediaman ilahi yang tinggi.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama perjanjian YHWH tanpa memasukkan pelafalan yang diperdebatkan.
- source_word: הִבִּיט
  choice: menatap
  rationale: Membedakannya dari verba pertama dan menyampaikan pandangan yang diarahkan dengan penuh perhatian.
- source_word: מִשָּׁמַיִם אֶל אֶרֶץ
  choice: dari langit ke bumi
  rationale: Mempertahankan susunan spasial dan preposisi sumber secara langsung serta alami.
theological_decisions:
- issue: Antropomorfisme ilahi dalam tindakan melihat
  choice: Mempertahankan ungkapan bahwa TUHAN memandang dan menatap
  alternative: Mengabstraksikannya menjadi 'TUHAN memperhatikan'
  rationale: Teks Ibrani memakai dua verba penglihatan yang konkret; gambaran puitisnya dipertahankan tanpa menjelaskan mekanisme pengetahuan ilahi.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme dua klausa serta perbedaan nuansa kedua verba penglihatan dipertahankan. Tanda koma akhir mengikuti kelanjutan sintaksis menuju ayat berikutnya.
