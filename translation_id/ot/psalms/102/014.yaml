  text: כִּֽי רָצ֣וּ עֲ֭בָדֶי/ךָ אֶת אֲבָנֶ֑י/הָ וְֽ/אֶת עֲפָרָ֥/הּ יְחֹנֵֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/014.yaml
  text: For your servants delight in her stones and show favor to her dust[a].
translation:
  language: id
  text: Sebab hamba-hamba-Mu menyukai batu-batunya dan menyayangi debunya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berkenan kepada batu-batunya dan berbelas kasihan terhadap debunya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat tersebut secara kausal dengan harapan atau permohonan sebelumnya, dan “Sebab” wajar dalam puisi Indonesia.
- source_word: רָצוּ
  choice: menyukai
  rationale: Bentuk ini menyatakan rasa senang dan sikap berkenan terhadap batu-batu Sion; “menyukai” mempertahankan kehangatan maknanya tanpa berlebihan.
- source_word: עֲבָדֶיךָ
  choice: hamba-hamba-Mu
  rationale: Dalam sapaan kepada Allah di Mazmur, “hamba” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: אֶת אֲבָנֶיהָ
  choice: batu-batunya
  rationale: Akhiran feminin merujuk kepada Sion. Bahasa Indonesia tidak memiliki pronomina posesif bergender, sehingga bentuk enklitik “-nya” menyampaikan rujukan itu secara alami.
- source_word: וְאֶת עֲפָרָהּ
  choice: dan ... debunya
  rationale: “Debu” mempertahankan citra harfiah עָפָר, yang dalam konteks juga dapat menyiratkan puing-puing kota yang hancur.
- source_word: יְחֹנֵנוּ
  choice: menyayangi
  rationale: Kata חנן dapat menyatakan kemurahan, belas kasihan, atau sikap berkenan. Dengan “debu” sebagai objek, “menyayangi” secara alami menggambarkan kasih para hamba kepada Sion bahkan dalam kehancurannya.
theological_decisions:
- issue: Personifikasi feminin Sion/Yerusalem
  choice: Rujukan kepada Sion dipertahankan melalui bentuk posesif “-nya” dan konteks puitis.
  alternative: Menambahkan kata “Sion” atau memakai ungkapan eksplisit seperti “batu-batu miliknya”.
  rationale: Bahasa Ibrani memakai akhiran feminin, tetapi bahasa Indonesia tidak menandai gender pada pronomina posesif. Bentuk “-nya” mempertahankan rujukan tanpa menambahkan unsur yang tidak dinyatakan dalam ayat.
- issue: Nuansa חנן terhadap debu Sion
  choice: Diterjemahkan “menyayangi”.
  alternative: “Mengasihani”, “berbelas kasihan kepada”, atau “berkenan kepada”.
  rationale: Pilihan ini mempertahankan keterikatan penuh kasih kepada reruntuhan Sion, sementara catatan kaki menjaga rentang makna kemurahan dan belas kasihan yang terdapat dalam kata sumber.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, ringkas, dan bermartabat. Kapitalisasi pada “-Mu” menandai sapaan kepada Allah sesuai kebiasaan penulisan Indonesia. Penanda catatan kaki ditempatkan langsung sesudah kalimat.
