lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Maka ... akan takut
  rationale: Bentuk Qal imperfek orang ketiga jamak dari ירא dapat berarti takut atau menaruh rasa hormat yang penuh gentar. Dalam konteks ayat sebelumnya, tindakan ini tampil sebagai akibat dari pemulihan Sion oleh Yahweh; karena itu וְ diterjemahkan secara kontekstual sebagai “maka” dan aspek mendatang dinyatakan dengan “akan”.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Kata jamak ini menunjuk pada bangsa-bangsa atau berbagai kelompok bangsa. Pilihan ini mempertahankan cakupan umum teks tanpa memasukkan kontras keagamaan yang tidak dinyatakan.
- source_word: אֶת שֵׁם יְהוָה
  choice: kepada nama Yahweh
  rationale: Partikel objek אֶת tidak diterjemahkan secara tersendiri. “Nama” dipertahankan karena dapat mencakup identitas dan reputasi yang dinyatakan, tanpa menjabarkan salah satu nuansanya dalam teks utama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: dan semua raja di bumi
  rationale: כָל dengan bentuk jamak konstruktus secara alami berarti “semua raja”. Ungkapan “di bumi” lebih wajar dalam bahasa Indonesia modern dan tetap menyampaikan cakupan para raja dunia.
- source_word: אֶת כְּבוֹדֶךָ
  choice: kepada kemuliaan-Mu
  rationale: כָּבוֹד dapat berarti kemuliaan, kehormatan, atau keagungan. “Kemuliaan” sesuai dengan konteks teologis dan puitis. Akhiran orang kedua tunggal maskulin dipertahankan sebagai sapaan langsung “-Mu” kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Nuansa ירא terhadap nama dan kemuliaan Allah
  choice: takut
  alternative: hormat; gentar penuh hormat
  rationale: “Takut” mempertahankan daya dasar verba Ibrani serta ketegangan antara rasa gentar dan penghormatan. Catatan kaki menunjukkan nuansa hormat tanpa mempersempit makna dalam teks utama.
- issue: Pelesapan verba pada klausa kedua
  choice: mengulangi “akan takut kepada”
  alternative: dan semua raja di bumi kepada kemuliaan-Mu
  rationale: Bahasa Ibrani membiarkan verba klausa pertama berlaku juga pada objek kedua. Pengulangan verba dalam bahasa Indonesia membuat hubungan sintaksis jelas tanpa mengubah maknanya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur paralel puisi dipertahankan, sedangkan verba yang dilesapkan dalam klausa Ibrani kedua diulangi agar kalimat Indonesia jelas. Kapitalisasi “-Mu” menandai sapaan langsung kepada Allah.
