  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: id
  text: Maka[a] bangsa-bangsa akan takut[b] akan nama Yahweh, dan semua raja di bumi akan takut akan kemuliaan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan bangsa-bangsa akan takut.” Kata penghubung Ibrani dapat diterjemahkan sederhana sebagai “dan”; “maka” memperjelas akibat yang tersirat dalam konteks.'
    reason: lexical_alternative
  - marker: b
