  text: untuk mendengar rintihan seorang tahanan, untuk membebaskan mereka yang ditentukan untuk mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak kematian”; dapat juga berarti “mereka yang terancam mati” atau “mereka yang dijatuhi hukuman mati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: untuk mendengar
  rationale: Infinitif konstruksi dengan prefiks ל menyatakan tujuan atau hasil dalam kalimat yang lebih luas; bentuk ini juga mempertahankan kesejajaran dengan לְפַתֵּחַ.
- source_word: אֶנְקַת
  choice: rintihan
  rationale: Kata ini menunjuk pada erangan atau keluhan akibat penderitaan; 'rintihan' alami dalam bahasa Indonesia dan tetap menyampaikan beratnya kesusahan.
- source_word: אָסִיר
  choice: orang yang terbelenggu
  rationale: Istilah ini menunjuk pada orang yang diikat atau dipenjarakan. 'Orang yang terbelenggu' mempertahankan gambaran keterikatan dan sesuai dengan konteks penawanan.
- source_word: לְפַתֵּחַ
  choice: untuk membebaskan
  rationale: Secara harfiah berarti 'membuka', tetapi dengan objek berupa orang yang menghadapi kematian, makna kontekstualnya ialah melepaskan atau membebaskan.
- source_word: בְּנֵי תְמוּתָה
  choice: mereka yang akan mati
  rationale: Ungkapan harfiah 'anak-anak kematian' merupakan idiom bagi orang-orang yang ditentukan atau terancam untuk mati. Terjemahan utama menyampaikan maknanya secara wajar, sedangkan gambaran Ibraninya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Apakah בְּנֵי תְמוּתָה secara khusus berarti terpidana mati atau lebih umum orang yang ditentukan untuk mati
  choice: mereka yang akan mati
  alternative: mereka yang dijatuhi hukuman mati
  rationale: Teks Ibrani menyatakan hubungan dengan kematian tanpa secara eksplisit menyebut vonis pengadilan. Pilihan utama mempertahankan keluasan makna; kemungkinan hukuman mati dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dua frasa infinitif diterjemahkan secara sejajar dengan 'untuk'. Idiom Ibrani pada frasa penutup disampaikan secara alami dalam teks utama dan dijelaskan dalam catatan kaki.
