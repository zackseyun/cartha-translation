  text: אֹמַ֗ר אֵלִ֗/י אַֽל תַּ֭עֲלֵ/נִי בַּ/חֲצִ֣י יָמָ֑/י בְּ/ד֖וֹר דּוֹרִ֣ים שְׁנוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: id
  text: Aku berkata, “Ya Allahku, janganlah mengambil aku[a] di tengah masa hidupku; tahun-tahun-Mu berlangsung dari generasi ke generasi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “janganlah mengangkat aku.” Dalam konteks ini, verba Ibrani tersebut kemungkinan berarti mengambil seseorang dari kehidupan sebelum waktunya.
    reason: lexical_alternative
  - marker: b
    text: Atau “sepanjang segala generasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Aku berkata
  rationale: Bentuk imperfek Qal orang pertama tunggal dapat menyatakan tindakan kini atau menjadi pengantar ujaran bernuansa lampau dalam puisi. “Aku berkata” merupakan pengantar ujaran yang wajar dan tetap mempertahankan keluwesan aspek Ibrani.
- source_word: אֵלִי
  choice: Ya Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal berarti “Allahku”; partikel “Ya” menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: אַל תַּעֲלֵנִי
  choice: janganlah mengambil aku
  rationale: אַל dengan bentuk verba ini menyatakan larangan atau permohonan. Secara harfiah verba Hifil dari עלה berarti “membawa/mengangkat naik,” tetapi dalam konteks masa hidup yang terpotong, ungkapan ini paling mungkin berarti mengambil seseorang dari kehidupan sebelum waktunya. “Mengambil aku” mempertahankan ungkapan tidak langsung tanpa menambahkan kata “nyawa” yang tidak eksplisit.
- source_word: בַּחֲצִי יָמָי
  choice: di tengah masa hidupku
  rationale: Secara harfiah, “pada separuh hari-hariku.” Pilihan ini menyampaikan metafora tentang kehidupan yang belum selesai dengan bahasa Indonesia yang alami.
- source_word: בְּדוֹר דּוֹרִים
  choice: dari generasi ke generasi
  rationale: Ungkapan Ibrani ini menyatakan kesinambungan melintasi generasi-generasi. Padanan ini alami serta mempertahankan bentuk idiomatisnya.
- source_word: שְׁנוֹתֶיךָ
  choice: tahun-tahun-Mu
  rationale: Nomina jamak dengan akhiran orang kedua maskulin tunggal secara langsung berarti “tahun-tahun-Mu,” yang mengontraskan keberadaan Allah dengan singkatnya hidup pemazmur.
theological_decisions:
- issue: Bahasa idiomatis mengenai kematian dalam doa
  choice: “janganlah mengambil aku”
  alternative: “janganlah mengangkat aku” atau “janganlah mengambil nyawaku”
  rationale: Konteks membandingkan hidup pemazmur yang terancam terpotong dengan tahun-tahun Allah yang melampaui segala generasi. Pilihan ini menyampaikan kemungkinan kuat bahwa yang dimaksud ialah kematian dini, tetapi tidak memperjelasnya secara berlebihan dengan menambahkan “nyawa”.
- issue: Kelangsungan tahun-tahun Allah
  choice: “tahun-tahun-Mu berlangsung dari generasi ke generasi”
  alternative: “tahun-tahun-Mu ada sepanjang segala generasi”
  rationale: Teks menegaskan kesinambungan keberadaan Allah tanpa menjelaskan lebih jauh sifat kekekalan-Nya; terjemahan mempertahankan kontras puitis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ya Allahku” digunakan sebagai sapaan doa; “di tengah masa hidupku” menghindari ungkapan kaku “di separuh hari-hariku” sambil mempertahankan gambaran hidup yang terpotong. Penulisan pronomina ilahi dengan huruf kapital mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
