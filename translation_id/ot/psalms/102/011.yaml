  yaml_path: translation/ot/psalms/102/011.yaml
  text: My days are like a lengthening shadow[a], and I wither away like grass.
translation:
  language: id
  text: Hari-hariku seperti bayang-bayang yang memanjang[a], dan aku layu seperti rumput.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bayang-bayang yang terbentang.” Gambaran Ibraninya kemungkinan menunjuk pada bayang-bayang senja yang semakin panjang, sehingga menyiratkan kemunduran dan kefanaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Hari-hariku
  rationale: Mempertahankan bentuk jamak dengan sufiks orang pertama serta gambaran Ibrani tentang hari-hari atau masa hidup pemazmur.
- source_word: כְּצֵל
  choice: seperti bayang-bayang
  rationale: Prefiks כְּ menyatakan perbandingan, sedangkan צֵל berarti bayang-bayang; padanan ini alami dan mempertahankan metafora kefanaan.
- source_word: נָטוּי
  choice: yang memanjang
  rationale: Bentuk dari נטה secara harfiah berarti terbentang atau terulur. Bersama 'bayang-bayang', kata ini kemungkinan menggambarkan bayang-bayang senja yang semakin panjang.
- source_word: וַאֲנִי
  choice: dan aku
  rationale: Menerjemahkan secara langsung konjungsi dan pronomina tanpa memperkuat hubungan menjadi pertentangan yang tidak dinyatakan secara eksplisit.
- source_word: כָּעֵשֶׂב
  choice: seperti rumput
  rationale: עֵשֶׂב dapat menunjuk pada rumput atau tumbuh-tumbuhan hijau; 'rumput' paling alami dalam gambaran puitis tentang kerapuhan.
- source_word: אִיבָשׁ
  choice: layu
  rationale: Kata kerja יבשׁ berarti menjadi kering atau layu. 'Layu' menyampaikan hilangnya daya hidup secara alami dalam kaitannya dengan rumput.
