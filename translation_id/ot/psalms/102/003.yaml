base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/003.yaml
  text: For my days vanish like smoke[a], and my bones burn like a hearth.
translation:
  language: id
  text: Sebab hari-hariku lenyap seperti asap, dan tulang-tulangku membara seperti perapian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tulang-tulangku hangus seperti puntung berapi,” “seperti tungku,” atau “seperti anglo.” Istilah Ibrani untuk benda atau tempat yang menyala ini langka; gambaran tepatnya tidak pasti, tetapi panas yang hebat jelas dimaksudkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau dasar bagi ratapan sebelumnya dan mempertahankan hubungan kausal secara wajar dalam puisi Indonesia.
- source_word: כָלוּ בְעָשָׁן יָמָי
  choice: hari-hariku lenyap seperti asap
  rationale: כָלוּ menyatakan habis atau berakhir; bersama gambaran asap, “lenyap” menyampaikan kesan hari-hari yang menghilang. בְ dipahami secara komparatif dalam konteks ini dan diterjemahkan “seperti” agar kiasannya jelas.
- source_word: וְעַצְמוֹתַי
  choice: dan tulang-tulangku
  rationale: Terjemahan langsung yang mempertahankan gambaran jasmani tentang penderitaan mendalam.
- source_word: נִחָרוּ
  choice: membara
  rationale: Kata kerja ini menggambarkan keadaan terbakar, terpanggang, atau menyala karena panas. “Membara” ringkas, hidup, dan cocok dengan gambaran panas hebat tanpa memastikan bahwa tulang-tulang itu hangus sepenuhnya.
- source_word: כְּמוֹ קֵד
  choice: seperti perapian
  rationale: כְּמוֹ adalah penanda perbandingan. קֵד merupakan istilah langka bagi benda atau tempat yang menyala atau sangat panas; “perapian” menghasilkan gambaran yang alami, sedangkan ketidakpastian rujukan tepatnya dipertahankan dalam catatan kaki.
