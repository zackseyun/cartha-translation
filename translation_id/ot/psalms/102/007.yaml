  yaml_path: translation/ot/psalms/102/007.yaml
  text: I lie awake and am like a solitary bird on a rooftop[a].
translation:
  language: id
  text: Aku tetap terjaga, seperti seekor burung yang sendirian di atas atap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti burung pipit yang sendirian di atas atap.” Kata Ibrani צִפּוֹר adalah sebutan umum untuk burung, meskipun secara tradisional kadang diterjemahkan lebih khusus sebagai “burung pipit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: Aku tetap terjaga
  rationale: Kata kerja שׁקד dapat menyatakan keadaan berjaga atau tidak tidur. Dalam konteks ratapan ini, “tetap terjaga” menyampaikan pengalaman tidak dapat tidur tanpa memberi kesan bahwa pemazmur sedang bertugas menjaga.
- source_word: וָאֶהְיֶה
  choice: dan menjadi
  rationale: Bentuk היה melanjutkan gambaran keadaan pemazmur. “Menjadi” mempertahankan unsur perubahan atau keadaan yang dihasilkan, sekaligus terdengar wajar dalam puisi Indonesia.
- source_word: כְּצִפּוֹר
  choice: seperti seekor burung
  rationale: צִפּוֹר merupakan sebutan umum bagi burung dan tidak harus berarti burung pipit. Pilihan umum ini mempertahankan keluasan makna Ibrani.
- source_word: בּוֹדֵד
  choice: yang sendirian
  rationale: בּוֹדֵד berarti sendiri atau terasing. “Yang sendirian” alami dalam bahasa Indonesia dan tidak menambahkan emosi subjektif yang lebih kuat seperti “kesepian”.
- source_word: עַל גָּג
  choice: di atas atap
  rationale: Ungkapan ini secara harfiah berarti “di atas atap” dan mempertahankan gambaran seekor burung yang terpencil di tempat terbuka.
