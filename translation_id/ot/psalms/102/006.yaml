translation:
  language: id
  text: Aku seperti burung hantu di gurun[a]; aku telah menjadi seperti burung hantu di antara reruntuhan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “burung pelikan di padang belantara.” Nama burung Ibrani קָאַת tidak pasti; terjemahan tradisional sering memakai “burung pelikan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “burung hantu kecil di antara reruntuhan.” Jenis burung yang dimaksud oleh כּוֹס tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּמִיתִי
  choice: Aku seperti
  rationale: Bentuk qal perfektif dari דמה menyatakan kemiripan. Ungkapan ini alami dalam puisi Indonesia, sementara nuansa keadaan yang telah tercapai tetap tersirat oleh konteks.
- source_word: לִקְאַת
  choice: burung hantu gurun
  rationale: Nama burung קָאַת tidak pasti. Dalam konteks tempat sunyi dan tandus, 'burung hantu gurun' menyampaikan gambaran burung penyendiri, tetapi alternatif tradisional dicatat dalam catatan kaki.
- source_word: מִדְבָּר
  choice: gurun
  rationale: מִדְבָּר menunjuk pada daerah terbuka yang tidak dibudidayakan; 'gurun' ringkas dan cocok dengan gambaran kesunyian ayat ini.
- source_word: הָיִיתִי
  choice: aku telah menjadi seperti
  rationale: Bentuk perfektif dari היה dapat menyatakan keadaan yang telah terjadi dan masih dirasakan. 'Telah menjadi seperti' mempertahankan nuansa resultatif serta variasi dalam paralelisme.
- source_word: כְּכוֹס
  choice: seperti burung hantu
  rationale: כּוֹס di sini adalah nama burung, bukan kata umum yang berarti 'cawan'. Jenis burungnya tidak dapat dipastikan, sehingga istilah umum dipakai dan ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: חֳרָבוֹת
  choice: di antara reruntuhan
  rationale: Bentuk jamak ini menunjuk pada tempat-tempat yang runtuh atau telantar. 'Di antara reruntuhan' menghasilkan gambaran tempat yang jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan lugas. Paralelisme Ibrani dipertahankan dengan variasi antara “Aku seperti” dan “aku telah menjadi seperti”; ketidakpastian kedua nama burung tidak diselesaikan secara dogmatis, melainkan dicatat dalam catatan kaki.
