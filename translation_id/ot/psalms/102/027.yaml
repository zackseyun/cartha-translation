source:
  edition: WLC
  text: וְ/אַתָּה ה֑וּא וּ֝/שְׁנוֹתֶ֗י/ךָ לֹ֣א יִתָּֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: But you are the same[a], and your years will not come to an end.
translation:
  language: id
  text: Namun, Engkau tetap sama[a], dan tahun-tahun-Mu tidak akan berakhir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Engkaulah Dia,” sebuah ungkapan yang dalam konteks ini berarti bahwa Engkau tetap sama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Namun, Engkau
  rationale: Konjungsi dan pronomina mandiri menandai pertentangan dengan ciptaan yang binasa dan berubah dalam konteks sebelumnya. “Namun” mengungkapkan daya adversatif itu secara alami dalam bahasa Indonesia.
- source_word: הוּא
  choice: tetap sama
  rationale: Secara harfiah berarti “Dia/yang itu,” dalam ungkapan אַתָּה־הוּא, “Engkaulah Dia.” Dalam konteks ini ungkapan tersebut menyatakan kesinambungan identitas Allah; “tetap sama” menyampaikan maksudnya secara alami tanpa memasukkan istilah filosofis tambahan.
- source_word: וּ/שְׁנוֹתֶיךָ
  choice: dan tahun-tahun-Mu
  rationale: שָׁנָה menunjuk pada tahun dalam arti waktu, dengan sufiks orang kedua tunggal maskulin. Bentuk ulang “tahun-tahun” mempertahankan bentuk jamaknya.
- source_word: לֹא
  choice: tidak akan
  rationale: Partikel ini menyangkal verba imperfek berikutnya. Dalam pernyataan puitis tentang keberadaan Allah yang terus berlangsung, bentuk futur “tidak akan” paling alami.
- source_word: יִתָּמּוּ
  choice: berakhir
  rationale: Bentuk Qal dari תמם di sini berarti selesai atau mencapai akhir. “Berakhir” jelas dan alami serta mempertahankan gagasan bahwa tahun-tahun Allah tidak pernah selesai.
theological_decisions:
- issue: Pengungkapan idiom אַתָּה הוּא dalam kaitannya dengan ketetapan identitas Allah
  choice: Engkau tetap sama
  alternative: Engkaulah Dia; Engkau sama
  rationale: Bahasa Ibrani secara harfiah berbunyi “Engkaulah Dia,” yang dalam konteks kontras dengan ciptaan yang berubah menyatakan bahwa identitas Allah terus tetap. “Tetap sama” menyampaikan daya ungkapan tersebut tanpa mengembangkan pernyataan itu menjadi rumusan filosofis yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. “Namun” menjaga kontras yang kuat, sedangkan “tetap sama” terdengar alami sekaligus mempertahankan ambiguitas idiom melalui catatan kaki.
