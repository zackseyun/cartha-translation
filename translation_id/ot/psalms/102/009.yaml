  text: For I have eaten ashes like bread[a], and mixed my drink with weeping.
translation:
  language: id
  text: 'Sebab aku telah makan abu seperti roti,

    dan mencampur minumanku dengan tangisan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencampur minumanku dengan air mata.” Secara harfiah teks Ibrani berbunyi “dengan tangisan,” yang dapat diungkapkan secara lebih konkret sebagai “dengan air mata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau dasar bagi ratapan dalam konteks sekitar; “Sebab” mempertahankan hubungan kausal dan cocok dengan ragam puitis Indonesia.
- source_word: אֵפֶר
  choice: abu
  rationale: “Abu” merupakan padanan alami dalam bahasa Indonesia dan mempertahankan gambaran perkabungan, penghinaan, serta kesedihan.
- source_word: כַּלֶּחֶם
  choice: seperti roti
  rationale: Prefiks כ menyatakan perbandingan; “seperti roti” mempertahankan simile secara jelas tanpa menafsirkannya secara berlebihan.
- source_word: אָכָלְתִּי
  choice: aku telah makan
  rationale: Bentuk qatal orang pertama tunggal melaporkan pengalaman pemazmur; “telah makan” menyampaikan tindakan yang sudah berlangsung dengan dampak pada keadaan ratapan kini.
- source_word: שִׁקֻּוַי
  choice: minumanku
  rationale: Dalam konteks ini kata tersebut menunjuk pada minuman biasa, bukan persembahan curahan; bentuk “minumanku” ringkas dan alami.
- source_word: בִּבְכִי
  choice: dengan tangisan
  rationale: Nomina ini secara harfiah berarti “tangisan”; frasa tersebut mempertahankan unsur pengalaman menangis, sedangkan “air mata” merupakan pengonkretan yang juga mungkin.
- source_word: מָסָכְתִּי
  choice: mencampur
  rationale: Verba ini berarti mencampur atau membaurkan cairan; “mencampur” adalah padanan modern dan wajar bagi gambaran minuman yang bercampur dengan tangisan.
theological_decisions: []
