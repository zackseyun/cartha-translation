  text: מִ/קּ֥וֹל אַנְחָתִ֑/י דָּבְקָ֥ה עַ֝צְמִ֗/י לִ/בְשָׂרִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/005.yaml
  text: From the sound of my groaning[b][a], my bones cling to my flesh.
translation:
  language: id
  text: Karena suara eranganku[a], tulang-tulangku melekat pada dagingku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dari suara eranganku”. Kata depan Ibrani dapat menyatakan sebab maupun sumber.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada kulitku”. Dalam konteks tubuh yang sangat kurus, kata Ibrani yang biasanya berarti “daging” dapat dipahami sebagai “kulit”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Karena suara
  rationale: מִן dapat menyatakan sebab maupun sumber. Dalam konteks ratapan ini, “karena” menyampaikan hubungan sebab secara alami, sedangkan “suara” mempertahankan unsur קוֹל.
- source_word: אַנְחָתִי
  choice: eranganku
  rationale: Kata ini menunjuk pada erangan atau keluhan yang lahir dari penderitaan; “erangan” sesuai dengan kuatnya ratapan dan gambaran jasmani ayat ini.
- source_word: דָּבְקָה
  choice: melekat
  rationale: דבק berarti melekat atau menempel erat. “Melekat” mempertahankan gambaran fisik yang hidup dan wajar dalam bahasa Indonesia modern.
- source_word: עַצְמִי
  choice: tulang-tulangku
  rationale: Bentuk tunggal Ibrani dapat berfungsi secara kolektif. Bentuk jamak merupakan ungkapan Indonesia yang alami untuk keseluruhan rangka tubuh.
- source_word: לִבְשָׂרִי
  choice: pada dagingku
  rationale: בָּשָׂר pada dasarnya berarti “daging”. Terjemahan ini mempertahankan kata konkret Ibrani, sementara kemungkinan makna kontekstual “kulit” dicatat agar gambaran tubuh yang sangat kurus tetap terbuka.
theological_decisions: []
translation_notes:
  register: Bahasa puitis yang lugas, khidmat, dan mudah dipahami. Susunan kalimat mempertahankan hubungan sebab yang paling mungkin tanpa menutup kemungkinan makna sumber, serta menjaga gambaran jasmani konkret dari teks Ibrani.
