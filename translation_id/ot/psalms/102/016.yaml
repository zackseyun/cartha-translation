  text: כִּֽי בָנָ֣ה יְהוָ֣ה צִיּ֑וֹן נִ֝רְאָ֗ה בִּ/כְבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/016.yaml
  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: id
  text: Sebab Yahweh telah membangun Sion; Ia telah menampakkan diri[a] dalam kemuliaan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia terlihat dalam kemuliaan-Nya” atau “Ia telah terlihat dalam kemuliaan-Nya.” Kata kerja Ibrani ini dapat berarti “menampakkan diri” atau “terlihat.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau dasar bagi pernyataan dalam konteks sekitarnya; “Sebab” mempertahankan fungsi penghubung tersebut secara alami dalam puisi Indonesia.
- source_word: בָנָה
  choice: telah membangun
  rationale: Bentuk qatal disajikan sebagai tindakan yang telah terlaksana. “Membangun” mengikuti kata Ibrani secara langsung tanpa menambahkan gagasan “kembali” yang tidak dinyatakan secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Nama tempat ini dipertahankan sebagai nama diri dan ditulis menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: נִרְאָה
  choice: telah menampakkan diri
  rationale: Bentuk Nifal dari ראה dapat menyatakan “menampakkan diri” atau “terlihat”. Pilihan utama menyampaikan manifestasi ilahi dan selaras dengan aspek tindakan sebelumnya, sementara kemungkinan pasif dipertahankan dalam catatan kaki.
- source_word: בִּכְבוֹדוֹ
  choice: dalam kemuliaan-Nya
  rationale: Ungkapan ini secara langsung menyatakan bahwa penampakan Yahweh berlangsung dalam kemuliaan-Nya; “kemuliaan” mempertahankan bobot makna כָּבוֹד.
theological_decisions:
- issue: Makna נִרְאָה sebagai penampakan diri atau keadaan terlihat
  choice: Ia telah menampakkan diri dalam kemuliaan-Nya
  alternative: Ia terlihat dalam kemuliaan-Nya / Ia telah terlihat dalam kemuliaan-Nya
  rationale: Bentuk Ibrani memungkinkan makna penampakan ilahi maupun bentuk pasif “terlihat”. Teks utama memakai ungkapan Indonesia yang alami untuk manifestasi ilahi, sedangkan catatan kaki mempertahankan ambiguitas gramatikal yang asli.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Huruf kapital pada “Ia” dan akhiran “-Nya” mengikuti kebiasaan penghormatan kepada Allah tanpa mengubah makna sumber.
