  text: תְּ֭פִלָּה לְ/עָנִ֣י כִֽי יַעֲטֹ֑ף וְ/לִ/פְנֵ֥י יְ֝הוָ֗ה יִשְׁפֹּ֥ךְ שִׂיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: id
  text: Doa seorang yang menderita ketika ia menjadi lemah[a] dan mencurahkan keluhannya[b] di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika ia diliputi tekanan” untuk “ketika ia menjadi lemah”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “renungannya” atau “ratapannya” untuk “keluhannya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Doa
  rationale: Pembukaan nominal khas judul mazmur; bahasa Indonesia tidak memerlukan artikel tak tentu.
- source_word: לְעָנִי
  choice: seorang yang tertindas
  rationale: Preposisi לְ menandai hubungan dalam judul, sedangkan עָנִי menunjuk kepada orang yang menderita, tertindas, atau miskin. Pilihan ini menjaga cakupan pengalaman tanpa mempersempitnya menjadi kemiskinan ekonomi.
- source_word: כִּי
  choice: ketika
  rationale: Dalam judul ini, כִּי memperkenalkan keadaan saat doa dipanjatkan; makna temporal paling sesuai dengan konteks.
- source_word: יַעֲטֹף
  choice: ia menjadi lemah
  rationale: Kata kerja ini dapat menggambarkan keadaan lemah, lesu, atau diliputi tekanan. Ungkapan ini wajar dalam bahasa Indonesia dan tidak menentukan nuansanya secara berlebihan.
- source_word: וְלִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan relasi 'di hadapan/dalam kehadiran', dan nama ilahi יהוה dipertahankan sebagai Yahweh.
- source_word: יִשְׁפֹּךְ
  choice: mencurahkan
  rationale: Mempertahankan metafora mencurahkan isi hati dalam doa dan terdengar alami dalam bahasa Indonesia.
- source_word: שִׂיחוֹ
  choice: keluhannya
  rationale: שִׂיחַ dapat berarti renungan, keluhan, atau ratapan. Dalam konteks penderitaan dan doa, 'keluhan' paling langsung menangkap nuansa ratapan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'seorang yang tertindas' tidak menambahkan penandaan gender yang tidak wajib dalam bahasa sasaran, sementara pronomina tunggal 'ia' menjaga acuan individual. Ambiguitas leksikal utama dicatat dalam catatan kaki.
