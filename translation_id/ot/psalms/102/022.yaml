  text: בְּ/הִקָּבֵ֣ץ עַמִּ֣ים יַחְדָּ֑ו וּ֝/מַמְלָכ֗וֹת לַ/עֲבֹ֥ד אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/022.yaml
  text: when peoples gather together[a], and kingdoms[c][b], to serve Yahweh—
translation:
  language: id
  text: ketika bangsa-bangsa dan kerajaan-kerajaan berkumpul bersama[a] untuk melayani[b] Yahweh—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika bangsa-bangsa dan kerajaan-kerajaan dikumpulkan bersama.” Bentuk Ibraninya dapat dipahami sebagai peristiwa berkumpul atau dikumpulkan.
    reason: lexical_alternative
  - marker: b
    text: “Melayani” juga dapat diterjemahkan “beribadah kepada” ketika Allah menjadi objeknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִקָּבֵץ
  choice: ketika ... berkumpul
  rationale: Gabungan ב dengan infinitif konstruk Nifal berfungsi temporal. Bentuk Indonesia aktif ‘berkumpul’ alami dan dapat menyatakan peristiwa kolektif tanpa menentukan pelaku yang mengumpulkan; kemungkinan pasif dicatat dalam catatan kaki.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk pada berbagai kelompok manusia secara kolektif. ‘Bangsa-bangsa’ merupakan padanan Indonesia yang alami dan tidak membatasinya pada negara modern.
- source_word: יַחְדָּו
  choice: bersama
  rationale: Kata keterangan ini menegaskan bahwa perhimpunan berlangsung secara bersama-sama.
- source_word: וּמַמְלָכוֹת
  choice: dan kerajaan-kerajaan
  rationale: Terjemahan ini mempertahankan bentuk jamak dan hubungan koordinatif dengan ‘bangsa-bangsa’.
- source_word: לַעֲבֹד
  choice: untuk melayani
  rationale: Kata kerja עבד pada dasarnya berarti melayani atau mengabdi; ketika objeknya Allah, maknanya dapat mencakup beribadah. Terjemahan utama mempertahankan keluasan makna kata sumber.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Penanda objek אֶת tidak diterjemahkan, sedangkan nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’ agar nama perjanjian dalam teks tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan makna עבד ketika Yahweh menjadi objek
  choice: melayani
  alternative: beribadah kepada
  rationale: ‘Melayani’ mempertahankan arti yang lebih luas, termasuk pengabdian dan pelayanan kepada Allah; nuansa ibadah dijelaskan sebagai alternatif.
- issue: Suara gramatikal בְּהִקָּבֵץ
  choice: berkumpul
  alternative: dikumpulkan
  rationale: Bentuk Nifal dapat dinyatakan secara pasif, tetapi bahasa Indonesia lazim memakai ‘berkumpul’ untuk peristiwa kolektif ini tanpa harus meniadakan kemungkinan bahwa Allah menghimpun mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘bangsa-bangsa dan kerajaan-kerajaan’ diperlakukan sebagai subjek majemuk agar kalimat alami dan hubungan kedua unsur dengan tindakan berkumpul tetap jelas. Tanda pisah pada akhir dipertahankan karena ayat ini melanjutkan kalimat dari konteks sekitarnya.
