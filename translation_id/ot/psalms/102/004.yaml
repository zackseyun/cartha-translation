  text: הוּכָּֽה כָ֭/עֵשֶׂב וַ/יִּבַ֣שׁ לִבִּ֑/י כִּֽי שָׁ֝כַ֗חְתִּי מֵ/אֲכֹ֥ל לַחְמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/004.yaml
  text: My heart is struck like grass and withered[c][b][a], for I forget to eat my bread.
translation:
  language: id
  text: Hatiku terpukul seperti rumput dan menjadi layu, sebab aku lupa makan rotiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rotiku” juga dapat berarti “makananku” secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּכָּה
  choice: terpukul
  rationale: Bentuk pasif dari נכה menyatakan keadaan akibat dipukul atau dihantam. “Terpukul” mempertahankan daya pasif dan gambaran penderitaan tanpa memakai ungkapan yang kuno.
- source_word: כָעֵשֶׂב
  choice: seperti rumput
  rationale: עֵשֶׂב lazim berarti rumput atau tumbuh-tumbuhan. “Seperti rumput” mempertahankan perumpamaan tentang kerapuhan dan kelayuan secara alami dalam bahasa Indonesia.
- source_word: וַיִּבַשׁ
  choice: dan menjadi layu
  rationale: יבש berarti menjadi kering atau layu. Dalam gambaran rumput, “menjadi layu” menyampaikan hilangnya kesegaran dan daya hidup dengan wajar.
- source_word: לִבִּי
  choice: hatiku
  rationale: לֵב menunjuk pada hati atau batin sebagai pusat kehidupan, pikiran, dan perasaan. “Hatiku” mempertahankan istilah puitis dan antropologis teks Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan atau bukti keadaan pemazmur. “Sebab” jelas, ringkas, dan sesuai dengan ragam puisi yang bermartabat.
- source_word: שָׁכַחְתִּי
  choice: aku lupa
  rationale: Bentuk perfektif Ibrani dapat menggambarkan tindakan yang telah terjadi dengan dampak kini atau keadaan yang berlangsung. Bahasa Indonesia “aku lupa” secara alami tidak memaksakan pembedaan aspek tersebut.
- source_word: מֵאֲכֹל
  choice: makan
  rationale: Secara harfiah konstruksi ini berarti “dari makan”, tetapi sesudah verba “lupa”, ungkapan Indonesia yang alami ialah “lupa makan”.
- source_word: לַחְמִי
  choice: rotiku
  rationale: לֶחֶם secara konkret berarti roti, tetapi dapat pula menunjuk pada makanan secara umum. “Rotiku” mempertahankan gambaran konkret dan tekstur puitis bahasa Ibrani.
theological_decisions:
- issue: Makna antropologis לֵב
  choice: Dipertahankan sebagai “hati” tanpa membatasinya hanya pada emosi.
  alternative: batinku
  rationale: Dalam bahasa Ibrani, לֵב dapat mencakup pikiran, kemauan, perasaan, dan daya hidup. “Hati” mempertahankan keluasan makna itu serta citra asli tanpa memasukkan penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan klausa mempertahankan hubungan dekat antara “seperti rumput” dan “terpukul”, sedangkan “menjadi layu” meneruskan gambaran rumput. Bentuk “aku lupa” sengaja dibiarkan tanpa penanda aspek tambahan karena bahasa Indonesia secara alami dapat mencakup keadaan yang sedang berlangsung maupun tindakan lampau yang dampaknya masih terasa.
