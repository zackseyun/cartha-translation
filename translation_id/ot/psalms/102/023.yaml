  text: עִנָּ֖ה בַ/דֶּ֥רֶךְ כח/ו קִצַּ֥ר יָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/023.yaml
  text: He afflicted my strength on the way[b][a]; he shortened my days.
translation:
  language: id
  text: Ia melemahkan kekuatannya[a] di jalan[b]; Ia memperpendek hari-hariku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “kekuatannya”; berdasarkan konteks orang pertama di sekitarnya, banyak orang memahaminya sebagai “kekuatanku”.
    reason: alternative_reading
  - marker: b
    text: Atau “dalam perjalanan hidup”; secara harfiah, “di jalan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  choice: melemahkan
  rationale: Bentuk Piel dari ענה dapat berarti menindas, merendahkan, atau melemahkan. Karena objeknya adalah “kekuatan”, “melemahkan” menyampaikan akibat tindakan itu secara alami dalam bahasa Indonesia tanpa menghilangkan bobot negatifnya.
- source_word: בַדֶּרֶךְ
  choice: di jalan
  rationale: Terjemahan ini mempertahankan gambaran harfiah bahasa Ibrani. Dalam konteks, ungkapan tersebut dapat menunjuk pada perjalanan atau rentang kehidupan.
- source_word: כחו
  choice: kekuatannya
  rationale: Teks konsonantal yang diberikan memakai akhiran orang ketiga tunggal maskulin, sehingga secara langsung berarti “kekuatannya”. Pergantian orang dengan “hari-hariku” dipertahankan, sedangkan bacaan yang sesuai konteks, “kekuatanku”, dicatat dalam catatan kaki.
- source_word: קִצַּר
  choice: memperpendek
  rationale: Kata kerja קצר berarti membuat pendek atau mempersingkat; “memperpendek” mempertahankan bentuk verbal dan paralelisme puisi.
- source_word: יָמָי
  choice: hari-hariku
  rationale: Bentuk ini secara langsung berarti “hari-hariku” dan secara puitis menunjuk pada lamanya hidup pemazmur.
theological_decisions:
- issue: Pergantian orang antara “kekuatannya” dan “hari-hariku”
  choice: Mempertahankan bentuk orang ketiga pada bagian pertama dan orang pertama pada bagian kedua
  alternative: Menyelaraskan keduanya menjadi “kekuatanku” dan “hari-hariku”
  rationale: Teks Ibrani yang diberikan mengandung pergantian orang yang nyata. Terjemahan utama tidak menyelaraskannya secara diam-diam; bacaan orang pertama yang lebih sesuai dengan konteks dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis. “Hari-hariku” dipertahankan sebagai ungkapan puitis untuk umur atau masa hidup. Huruf kapital pada “Ia” menunjukkan bahwa subjek tersirat dipahami sebagai Allah dari konteks, tanpa menambah nama ilahi yang tidak terdapat dalam ayat.
