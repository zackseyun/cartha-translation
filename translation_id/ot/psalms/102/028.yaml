  text: בְּנֵֽי עֲבָדֶ֥י/ךָ יִשְׁכּ֑וֹנוּ וְ֝/זַרְעָ֗/ם לְ/פָנֶ֥י/ךָ יִכּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/028.yaml
  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: id
  text: Anak-anak para hamba-Mu akan menetap[a], dan keturunan mereka akan diteguhkan di hadapan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Anak-anak lelaki para hamba-Mu akan tinggal, dan benih mereka akan diteguhkan di hadapan-Mu.”'
    reason: Alternatif yang lebih harfiah bagi בְּנֵי, יִשְׁכּוֹנוּ, dan זַרְעָם.
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן. Dalam konteks kesinambungan generasi, “anak-anak” alami dalam bahasa Indonesia dan tidak membatasi makna hanya pada laki-laki.
- source_word: עֲבָדֶיךָ
  choice: para hamba-Mu
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam sapaan mazmur kepada Allah, “hamba” paling sesuai dengan konteks dan ragam bahasa Indonesia yang bermartabat.
- source_word: יִשְׁכּוֹנוּ
  choice: akan menetap
  rationale: Kata שכן berarti tinggal, berdiam, atau menetap. “Menetap” menyampaikan kediaman yang berkelanjutan tanpa menambahkan gagasan “aman” yang tidak dinyatakan secara eksplisit.
- source_word: וְזַרְעָם
  choice: dan keturunan mereka
  rationale: זֶרַע secara harfiah berarti benih, tetapi sering dipakai secara kolektif untuk keturunan. “Keturunan” adalah padanan Indonesia yang alami dalam konteks ini.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Ungkapan ini secara harfiah berarti di depan wajah atau hadirat-Mu. “Di hadapan-Mu” mempertahankan bentuk dan nuansa kehadiran ilahi.
- source_word: יִכּוֹן
  choice: akan diteguhkan
  rationale: Bentuk nifal dari כון menyatakan keadaan dibuat teguh atau ditetapkan. “Akan diteguhkan” mempertahankan daya pasif/resultatifnya.
theological_decisions:
- issue: Apakah janji ini harus dibuat secara eksplisit bersifat kovenantal atau eskatologis
  choice: Mempertahankannya sebagai janji bahwa keturunan para hamba Allah akan terus menetap dan diteguhkan di hadapan-Nya.
  alternative: Menafsirkannya secara eksplisit sebagai janji kovenantal bagi garis keturunan Israel atau sebagai janji keselamatan akhir zaman.
  rationale: Ayat Ibrani menyatakan kesinambungan dan keteguhan keturunan di hadapan Allah, tetapi tidak menjelaskan kerangka atau cakrawala teologisnya secara lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia. Paralelisme antarbait dipertahankan.
