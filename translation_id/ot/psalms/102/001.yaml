id: PSA.102.1
reference: Psalms 102:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְ֭הוָה שִׁמְעָ֣/ה תְפִלָּתִ֑/י וְ֝/שַׁוְעָתִ֗/י אֵלֶ֥י/ךָ תָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/001.yaml
  text: O Yahweh[a], hear my prayer, and let my cry come to you.
translation:
  language: id
  text: 'Ya Yahweh[a], dengarkanlah doaku,

    dan biarlah seruanku sampai kepada-Mu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”. Nama ini juga dialihaksarakan “Yehuwa”.'
    reason: Menjelaskan nama ilahi dalam teks Ibrani, tradisi penerjemahannya, dan transliterasi alternatif tanpa menyebut bentuk yang telah digunakan dalam teks utama sebagai alternatif.
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”; partikel vokatif “Ya” membuat sapaan langsung itu alami dan khidmat dalam bahasa Indonesia.
- source_word: שִׁמְעָה
  choice: dengarkanlah
  rationale: Bentuk imperatif dipertahankan sebagai permohonan langsung. Akhiran “-lah” memberi nada permohonan yang wajar tanpa menghilangkan kekuatan perintah gramatikalnya.
- source_word: תְפִלָּתִי
  choice: doaku
  rationale: Padanan langsung dan lazim untuk nomina yang berarti doa dengan sufiks orang pertama tunggal.
- source_word: וְשַׁוְעָתִי
  choice: dan ... seruanku
  rationale: “Seruan” mempertahankan daya emosional שַׁוְעָה dan tidak menambahkan frasa “minta tolong” yang hanya tersirat dalam konteks.
- source_word: אֵלֶיךָ תָבֹוא
  choice: biarlah ... sampai kepada-Mu
  rationale: Imperfek dalam konteks ini menyatakan permohonan bernuansa jusif. “Sampai kepada-Mu” merupakan ungkapan Indonesia yang alami untuk gerak seruan menuju dan mencapai pihak yang dituju.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama pribadi YHWH, bukan gelar. Bentuk “Yahweh” mempertahankan nama itu dalam transliterasi yang umum tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan dua baris mempertahankan paralelisme puitis. Kapitalisasi pada “-Mu” mengikuti kebiasaan bahasa Indonesia untuk sapaan kepada Allah.
