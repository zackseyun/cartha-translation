  text: You will only look with your eyes and see the repayment of the wicked[a].
translation:
  language: id
  text: Engkau hanya akan memandang dengan matamu dan melihat balasan bagi orang-orang fasik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ganjaran bagi orang-orang fasik” atau “hukuman bagi orang-orang fasik.”
    reason: Alternatif leksikal bagi שִׁלֻּמַת, yang dapat menunjuk pada balasan setimpal, ganjaran, atau hukuman.
lexical_decisions:
- source_word: רַק
  choice: hanya
  rationale: 'Menandai pembatasan: orang yang disapa hanya menyaksikan kejadian itu, bukan mengalami nasib yang digambarkan.'
- source_word: בְּעֵינֶיךָ
  choice: dengan matamu
  rationale: Mempertahankan gambaran Ibrani tentang penyaksian secara langsung dan tetap wajar dalam bahasa Indonesia.
- source_word: תַבִּיט
  choice: akan memandang
  rationale: Bentuk Hifil dari נבט berarti memandang atau memperhatikan; pilihan ini membedakannya secara halus dari ראה yang menyusul.
- source_word: וְשִׁלֻּמַת
  choice: dan ... balasan yang diterima
  rationale: Nomina ini menunjuk pada balasan atau ganjaran setimpal. Penambahan 'yang diterima' menjelaskan hubungan konstruksi dengan orang-orang fasik tanpa membatasi maknanya menjadi hukuman semata.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Padanan baku dan bermartabat bagi kata sifat substantival jamak yang menunjuk kepada mereka yang jahat secara moral.
- source_word: תִּרְאֶה
  choice: akan ... melihat
  rationale: Makna lugas bentuk Qal dari ראה; bahasa Indonesia secara alami memakai satu penanda kala 'akan' untuk dua verba sejajar dalam klausa ini.
theological_decisions:
- issue: Sifat nasib orang-orang fasik
  choice: balasan yang diterima orang-orang fasik
  alternative: hukuman atas orang-orang fasik; ganjaran orang-orang fasik
  rationale: שִׁלֻּמָה mengandung gagasan pembalasan atau pemberian kembali yang setimpal, tetapi tidak menentukan secara sempit bentuk penghukuman. Terjemahan ini mempertahankan dimensi moral-yudisial tanpa memperjelasnya melebihi teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “Engkau” sesuai dengan sapaan tunggal dalam teks Ibrani. Susunan dua verba, “memandang” dan “melihat,” dipertahankan untuk mencerminkan paralelisme sumber.
