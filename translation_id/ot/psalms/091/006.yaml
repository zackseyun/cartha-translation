  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampar” untuk “wabah”; “kehancuran” juga mungkin berarti “bencana mematikan” atau “sampar yang mematikan”. Bahasa Ibrani memakai istilah-istilah puitis yang sejajar untuk ancaman yang membinasakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּבֶר
  choice: wabah
  rationale: Istilah ini lazim menunjuk pada wabah atau penyakit menular yang mematikan. “Wabah” jelas dan alami dalam bahasa Indonesia modern.
- source_word: בָּאֹפֶל
  choice: dalam kegelapan
  rationale: אֹפֶל menggambarkan kegelapan yang pekat atau suasana kelam; pilihan ini mempertahankan citra puitis tanpa mempersempit maknanya.
- source_word: יַהֲלֹךְ
  choice: berjalan
  rationale: Arti dasarnya ialah berjalan atau pergi. Terjemahan harfiah ini mempertahankan personifikasi puitis wabah.
- source_word: קֶּטֶב
  choice: kehancuran
  rationale: Kata ini dapat berarti kehancuran atau bencana mematikan, bahkan mungkin sampar. “Kehancuran” mempertahankan keluasan makna dan paralelisme puitis.
- source_word: יָשׁוּד
  choice: melanda
  rationale: Kata kerja ini menyatakan tindakan merusak atau membinasakan. “Melanda” terdengar alami bagi ancaman dahsyat dan tetap menyampaikan daya rusaknya.
- source_word: צָהֳרָיִם
  choice: pada tengah hari
  rationale: Makna langsungnya ialah tengah hari; pilihan ini mempertahankan kontras dengan kegelapan pada baris sebelumnya.
- source_word: מִן
  choice: bukan terhadap … bukan pula terhadap
  rationale: Secara harfiah berarti “dari”, tetapi kedua pemakaiannya meneruskan daftar hal yang tidak perlu ditakuti dalam ayat 5–6. Bentuk ini alami dalam konteks sintaksis Indonesia ketika ayat dibaca sebagai kelanjutan ayat sebelumnya.
