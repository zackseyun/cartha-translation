  yaml_path: translation/ot/psalms/091/005.yaml
  text: You will not fear the terror of the night[b][a], nor the arrow that flies by day.
translation:
  language: id
  text: Engkau tidak akan takut akan kengerian malam[a], atau akan anak panah yang terbang pada siang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kegentaran malam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: Engkau tidak akan takut
  rationale: Bentuk Qal imperfek orang kedua tunggal dengan לֹא paling wajar dipahami sebagai jaminan dalam konteks mazmur ini, bukan sebagai perintah langsung.
- source_word: פַּחַד
  choice: kedahsyatan
  rationale: Kata ini menunjuk pada sesuatu yang menimbulkan rasa gentar atau teror. 'Kedahsyatan' mempertahankan daya ancam nomina itu dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: לָיְלָה
  choice: malam
  rationale: Gabungan פַּחַד לָיְלָה diterjemahkan secara alami sebagai 'kedahsyatan malam', sekaligus mempertahankan kontras puitis dengan siang hari.
- source_word: חֵץ
  choice: anak panah
  rationale: Makna konkretnya adalah anak panah. Citra konkret ini dipertahankan tanpa menafsirkannya secara khusus sebagai lambang bahaya tertentu.
- source_word: יָעוּף
  choice: yang terbang
  rationale: Qal imperfek dari עוּף berarti 'terbang' dan secara alami menjadi klausa relatif yang menerangkan anak panah.
- source_word: יוֹמָם
  choice: pada siang hari
  rationale: Adverbia ini berarti pada waktu siang dan membentuk pasangan kontras dengan malam.
- source_word: מִן ... מִן
  choice: terhadap ... ataupun terhadap
  rationale: Preposisi berulang menandai hal-hal yang tidak akan ditakuti. 'Terhadap' menyampaikan hubungan itu secara alami dalam bahasa Indonesia tanpa pengulangan yang kaku.
theological_decisions:
- issue: Apakah ayat ini diterjemahkan sebagai perintah atau janji/jaminan
  choice: 'Jaminan: ''Engkau tidak akan takut'''
  alternative: 'Perintah: ''Jangan takut'''
  rationale: Bahasa Ibrani memakai לֹא dengan bentuk imperfek; dalam konteks puitis ini, bentuk tersebut paling alami mengungkapkan jaminan bagi orang yang berada dalam perlindungan Allah. Terjemahan ini tidak mengubahnya menjadi perintah yang tidak dituntut oleh bentuk teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan puitis tanpa menjadi arkais. Sapaan tunggal 'Engkau' mempertahankan orang kedua tunggal dalam bahasa Ibrani. Frasa 'anak panah' dipakai sebagai istilah Indonesia yang lazim, sedangkan susunan malam–siang mempertahankan kesejajaran puisi.
