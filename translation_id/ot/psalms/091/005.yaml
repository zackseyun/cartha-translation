  terminology: '"Kengerian" secara jelas menyampaikan teror/dread yang ditimbulkan ancaman. "Anak panah" tepat untuk חֵץ, dan "yang terbang pada siang hari" mempertahankan citra serta kontras waktu dalam teks Ibrani.'
