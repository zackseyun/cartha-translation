  text: יִפֹּ֤ל מִ/צִּדְּ/ךָ֨ אֶ֗לֶף וּ/רְבָבָ֥ה מִ/ימִינֶ֑/ךָ אֵ֝לֶ֗י/ךָ לֹ֣א יִגָּֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/007.yaml
  text: A thousand may fall at your side[a], and ten thousand at your right hand[b], but it will not come near you.
translation:
  language: id
  text: Seribu orang dapat rebah di sisimu[a], dan sepuluh ribu di sebelah kananmu, tetapi itu tidak akan mendekatimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seribu orang akan rebah di sisimu, dan sepuluh ribu di sebelah kananmu.” Bentuk kata kerja Ibrani dalam konteks puitis ini dapat menyatakan masa depan atau kemungkinan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak akan mendekatimu.” Subjeknya tidak dinyatakan dalam bahasa Ibrani; konteks menunjuk pada malapetaka yang mengancam.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפֹּל
  choice: dapat rebah
  rationale: Bentuk imperfek Qal dari נפל dapat bernuansa masa depan atau modal dalam puisi. 'Dapat rebah' mempertahankan kemungkinan yang hidup tanpa menetapkan futuritas secara mutlak.
- source_word: מִצִּדְּךָ
  choice: di sisimu
  rationale: Walaupun prefiksnya secara harfiah berarti 'dari', dalam gabungan ini ungkapan tersebut menunjukkan lokasi jatuhnya orang-orang relatif terhadap penerima sapaan.
- source_word: אֶלֶף
  choice: seribu orang
  rationale: Bilangan dipertahankan secara langsung; 'orang' ditambahkan secara wajar karena konteks menyiratkan mereka yang rebah.
- source_word: וּרְבָבָה
  choice: dan sepuluh ribu
  rationale: רְבָבָה lazim menunjuk sepuluh ribu dan menguatkan angka pada baris paralel sebelumnya.
- source_word: מִימִינֶךָ
  choice: di sebelah kananmu
  rationale: Mengungkapkan lokasi secara alami dalam bahasa Indonesia sambil mempertahankan citra spasial dan kesejajaran Ibrani.
- source_word: אֵלֶיךָ לֹא יִגָּשׁ
  choice: tidak akan mendekatimu
  rationale: נגשׁ dengan אֶל menyatakan gerak mendekati seseorang. Bentuk imperfek negatif paling alami diterjemahkan sebagai penegasan masa depan dalam klausa ini.
theological_decisions:
- issue: Subjek tersirat dalam klausa terakhir
  choice: malapetaka itu
  alternative: subjek netral 'itu', atau subjek lebih khusus seperti 'wabah'
  rationale: Bahasa Ibrani tidak menyatakan subjek verba tunggal יִגָּשׁ. Konteks mazmur menunjuk pada ancaman atau malapetaka, tetapi tidak mengharuskan satu bahaya tertentu. 'Malapetaka itu' membuat kalimat Indonesia jelas tanpa mempersempitnya menjadi wabah saja; catatan kaki mempertahankan ketidaktersuratan subjek dalam teks sumber.
- issue: Nuansa imperfek יִפֹּל
  choice: 'modal: ''dapat rebah'''
  alternative: 'futur: ''akan rebah'''
  rationale: Konteks puitis memungkinkan pembacaan modal maupun futur. Teks utama memakai nuansa modal, sementara alternatif futur dicatat agar ambiguitas asli tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Rebah' dipilih untuk mempertahankan daya puitis tanpa terdengar kuno; 'di sebelah kananmu' lebih alami daripada 'di tangan kananmu' untuk lokasi. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
