  text: עַל שַׁ֣חַל וָ/פֶ֣תֶן תִּדְרֹ֑ךְ תִּרְמֹ֖ס כְּפִ֣יר וְ/תַנִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: id
  text: Engkau akan menginjak singa dan kobra[b]; engkau akan menginjak-injak singa muda dan ular[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “naga.” Kata Ibrani ini dapat menunjuk pada reptil besar atau makhluk laut dalam konteks lain, tetapi “ular” paling sesuai dengan daftar binatang darat berbahaya di sini.'
    reason: alternative_reading
  - marker: b
    text: 'Secara tradisional: “ular asp”; istilah Ibraninya menunjuk pada ular yang sangat berbisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: atas (tersirat dalam verba “menginjak”)
  rationale: Preposisi ini menandai sasaran yang berada di bawah kaki. Dalam bahasa Indonesia, maknanya sudah tercakup secara alami dalam verba transitif “menginjak”.
- source_word: שַׁחַל
  choice: singa
  rationale: Istilah puitis untuk singa; “singa” menyampaikan makna dasarnya secara jelas tanpa menambahkan nuansa yang tidak wajib.
- source_word: פֶתֶן
  choice: ular tedung
  rationale: Menunjuk pada ular berbisa yang secara tradisional dipahami sebagai asp atau kobra. “Ular tedung” merupakan istilah Indonesia yang alami bagi kobra dan mempertahankan gambaran bahaya mematikan.
- source_word: תִּדְרֹךְ
  choice: engkau akan menginjak
  rationale: Bentuk imperfek Qal orang kedua maskulin tunggal dari דרך. “Menginjak” alami dalam bahasa Indonesia dan mempertahankan tindakan menapak di atas sesuatu.
- source_word: תִּרְמֹס
  choice: engkau akan menginjak-injak
  rationale: Bentuk imperfek Qal orang kedua maskulin tunggal dari רמס, yang lebih kuat daripada verba sebelumnya. Reduplikasi “menginjak-injak” menyampaikan tindakan menindas atau meremukkan dengan kaki dan menjaga peningkatan intensitas paralelisme.
- source_word: כְּפִיר
  choice: singa muda
  rationale: Menunjuk pada singa muda yang kuat, bukan semata-mata anak singa yang kecil.
- source_word: תַנִּין
  choice: ular besar
  rationale: Kata ini dapat menunjuk ular besar, naga, atau makhluk besar/laut menurut konteks. Dalam daftar binatang darat berbahaya di ayat ini, “ular besar” paling sesuai sekaligus mempertahankan unsur ukuran yang tidak selalu tampak dalam “ular” saja.
theological_decisions:
- issue: Apakah תַנִּין harus dipahami secara zoologis atau sebagai “naga”
  choice: ular besar
  alternative: naga
  rationale: Paralelisme dengan singa, ular tedung, dan singa muda mendukung pembacaan zoologis dalam konteks ini. Namun, karena istilah Ibrani juga dapat berarti “naga” atau makhluk besar dalam konteks lain dan tradisi terjemahan mempertahankan kemungkinan itu, alternatif tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa puitis yang lugas, bermartabat, dan mudah dipahami. Kata ganti “engkau” mempertahankan sapaan orang kedua tunggal. Pengulangan “menginjak” dan “menginjak-injak” menjaga paralelisme serta peningkatan daya tindakan dalam teks Ibrani.
