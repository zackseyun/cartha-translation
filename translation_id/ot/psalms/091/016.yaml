  yaml_path: translation/ot/psalms/091/016.yaml
  text: I will satisfy him with length of days[a], and I will show him my salvation.
translation:
  language: id
  text: Aku akan memuaskannya dengan umur panjang, dan Aku akan memperlihatkan kepadanya keselamatan-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pembebasan-Ku.” Istilah Ibrani ini dapat menunjuk pada penyelamatan dari bahaya maupun keselamatan dalam arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: umur panjang
  rationale: Ungkapan konstruksi ini secara harfiah berarti 'panjangnya hari-hari', tetapi 'umur panjang' menyampaikan idiom Ibrani itu secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: אַשְׂבִּיעֵהוּ
  choice: Aku akan memuaskan dia
  rationale: Bentuk hifil dari שׂבע berarti menyebabkan seseorang merasa puas atau kenyang. Pilihan ini mempertahankan orang tersebut sebagai objek langsung dan mengungkapkan kepuasan yang dianugerahkan Allah.
- source_word: וְאַרְאֵהוּ
  choice: Aku akan memperlihatkan kepadanya
  rationale: Bentuk hifil dari ראה berarti 'menyebabkan melihat' atau 'memperlihatkan'. Terjemahan ini mempertahankan tindakan dan prakarsa ilahi.
- source_word: בִּישׁוּעָתִי
  choice: keselamatan dari-Ku
  rationale: יְשׁוּעָה dapat berarti keselamatan maupun pembebasan. 'Keselamatan dari-Ku' terdengar lebih alami daripada 'keselamatan-Ku' untuk tindakan penyelamatan yang Allah nyatakan, sambil mempertahankan cakupan makna yang luas.
theological_decisions:
- issue: Cakupan makna יְשׁוּעָה dalam mazmur tentang perlindungan Allah
  choice: keselamatan dari-Ku
  alternative: pembebasan dari-Ku
  rationale: Istilah Ibrani ini dapat menunjuk pada pertolongan konkret dari bahaya sekaligus keselamatan dalam arti lebih luas. Teks utama mempertahankan keluasan itu tanpa meniadakan konteks pembebasan nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan dua tindakan ilahi yang sejajar; kapitalisasi 'Aku' mengikuti ujaran langsung Allah dalam konteks mazmur.
