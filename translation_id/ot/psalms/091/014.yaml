  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
translation:
  language: id
  text: “Karena ia berpaut kepada-Ku[a], Aku akan meluputkannya; Aku akan menempatkannya dengan aman di tempat tinggi[b], karena ia mengenal nama-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengasihi Aku” atau “menaruh kasihnya kepada-Ku.” Kata kerja Ibrani ini menyatakan keterikatan atau kelekatan yang kuat.
    reason: lexical_alternative
  - marker: b
    text: Atau “menempatkannya di tempat tinggi” atau “melindunginya.” Kata kerja Ibrani ini mengandung gambaran menempatkan seseorang di tempat tinggi yang aman dan sukar dijangkau.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: karena
  rationale: Pada kedua kemunculannya, kata ini menyatakan alasan bagi tindakan Allah dan diterjemahkan secara alami dengan hubungan sebab yang tetap jelas.
- source_word: בִי חָשַׁק
  choice: ia berpaut kepada-Ku
  rationale: Ungkapan ini menyatakan keterikatan, kasih, atau kelekatan yang kuat kepada Allah. “Berpaut” mempertahankan unsur keterikatan tanpa membatasinya pada perasaan semata.
- source_word: וַאֲפַלְּטֵהוּ
  choice: Aku akan meluputkannya
  rationale: Bentuk ini menyatakan tindakan Allah membebaskan orang tersebut dari bahaya. “Meluputkan” alami dalam konteks mazmur dan mempertahankan gagasan penyelamatan.
- source_word: אֲשַׂגְּבֵהוּ
  choice: Aku akan menempatkannya dengan aman di tempat tinggi
  rationale: Kata kerja ini menggambarkan penempatan pada ketinggian yang sukar dijangkau sehingga terlindung. Terjemahan ini mempertahankan metafora ketinggian sekaligus memperjelas unsur keamanannya.
- source_word: יָדַע
  choice: mengenal
  rationale: Kata ini menyatakan pengenalan pribadi dan relasional, bukan sekadar mengetahui suatu fakta.
- source_word: שְׁמִי
  choice: nama-Ku
  rationale: Ungkapan harfiah dipertahankan karena “nama” dapat mencakup pribadi dan karakter Allah yang dinyatakan tanpa perlu diperluas dalam teks utama.
theological_decisions:
- issue: Bahasa keterikatan kepada Allah dalam חָשַׁק
  choice: ia berpaut kepada-Ku
  alternative: ia mengasihi Aku; ia menaruh kasihnya kepada-Ku
  rationale: “Berpaut” menjaga keluasan makna Ibrani, yakni kasih dan keterikatan yang kuat, serta tidak mereduksinya menjadi emosi saja.
- issue: Metafora perlindungan dalam אֲשַׂגְּבֵהוּ
  choice: Aku akan menempatkannya dengan aman di tempat tinggi
  alternative: Aku akan melindunginya; Aku akan meninggikannya
  rationale: Pilihan ini mempertahankan gambaran puitis tentang keamanan melalui tempat tinggi yang tidak mudah dijangkau, alih-alih meratakannya menjadi istilah abstrak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pronomina ilahi menggunakan bentuk kapital. “Berpaut” dan metafora “tempat tinggi” dipertahankan agar citra serta ketegangan leksikal teks Ibrani tidak hilang.
