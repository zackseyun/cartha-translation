source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/009.yaml
  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: id
  text: Sebab Engkau, ya Yahweh, adalah tempat perlindunganku[a]; Engkau telah menjadikan Yang Mahatinggi tempat kediaman-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut pemahaman umum atas susunan bahasa Ibrani yang sulit ini: “Sebab engkau berkata, ‘Yahweh adalah tempat perlindunganku,’ dan menjadikan Yang Mahatinggi tempat kediamanmu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan daya kausal yang menghubungkan ayat ini dengan perlindungan dalam konteks sekitarnya; bentuk ini wajar dan bermartabat dalam puisi Indonesia.
- source_word: אַתָּה
  choice: Engkau
  rationale: Kata ganti orang kedua tunggal dipertahankan secara eksplisit demi penekanan; huruf kapital menandai rujukan kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: מַחְסִי
  choice: tempat perlindunganku
  rationale: מַחְסֶה menunjuk pada tempat berlindung atau perlindungan; pilihan ini jelas dan alami dalam konteks mazmur.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Menyampaikan gelar ilahi yang berarti 'Yang Paling Tinggi' dalam bentuk Indonesia yang lazim dan agung.
- source_word: שַׂמְתָּ
  choice: Engkau telah menjadikan
  rationale: Qal perfektum orang kedua maskulin tunggal dari שׂים; 'menjadikan ... tempat kediaman' menyampaikan fungsi hasilnya secara alami.
- source_word: מְעוֹנֶךָ
  choice: tempat kediaman-Mu
  rationale: מָעוֹן berarti kediaman atau tempat tinggal; pilihan ini membedakannya dari מַחְסֶה dan mempertahankan akhiran orang kedua tunggal.
theological_decisions:
- issue: Sintaks pembicara dan orang yang disapa dalam Mazmur 91:9
  choice: 'Menerjemahkan teks Masoret sebagaimana tertulis sebagai sapaan langsung: ''Sebab Engkau, ya Yahweh, adalah tempat perlindunganku; Engkau telah menjadikan Yang Mahatinggi tempat kediaman-Mu.'''
  alternative: “Sebab engkau berkata, ‘Yahweh adalah tempat perlindunganku,’ dan menjadikan Yang Mahatinggi tempat kediamanmu.”
  rationale: Teks Ibrani yang diberi tanda vokal tidak memiliki verba eksplisit 'berkata' dan beralih dari orang pertama ('perlindunganku') kepada orang kedua ('kediaman-Mu'). Teks utama mempertahankan susunan sulit ini tanpa menambahkan verba, sedangkan penafsiran umum yang menyuplai 'berkata' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang wajar. 'Engkau' dan akhiran '-Mu' dipakai untuk sapaan ilahi, sementara alternatif yang menyapa orang beriman memakai huruf kecil. Titik koma memperjelas dua klausa tanpa menghilangkan hubungan eratnya.
