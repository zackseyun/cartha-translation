  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽא תְאֻנֶּ֣ה אֵלֶ֣י/ךָ רָעָ֑ה וְ֝/נֶ֗גַע לֹא יִקְרַ֥ב בְּ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/010.yaml
  text: No harm will happen to you[b][a], and no plague will come near your tent.
translation:
  language: id
  text: Tidak ada malapetaka yang akan menimpa kamu,[a] dan tidak ada wabah yang akan mendekati kemahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tidak ada kejahatan yang akan menimpa kamu,” atau “Tidak ada bencana yang akan menimpa kamu.”'
    reason: lexical_alternative
  - marker: b
    text: “Kemah” juga dapat menyatakan tempat tinggal atau seisi rumah seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאֻנֶּה
  choice: akan menimpa
  rationale: Bentuk dari אנה menyatakan sesuatu yang terjadi atau menimpa seseorang. Dalam bahasa Indonesia, 'menimpa' alami dipadukan dengan 'malapetaka' dan mempertahankan arah kejadian kepada orang yang disapa.
- source_word: רָעָה
  choice: malapetaka
  rationale: Dalam konteks perlindungan ini, רָעָה menunjuk pada keburukan yang merugikan, bencana, atau celaka, bukan khususnya kejahatan moral. 'Malapetaka' menjaga bobot puitis dan makna ancaman yang serius.
- source_word: נֶגַע
  choice: wabah
  rationale: נֶגַע dapat berarti pukulan, penyakit, atau tulah. Dalam konteks Mazmur 91 tentang sampar dan bahaya mematikan, 'wabah' merupakan padanan yang jelas dan wajar, sementara catatan kaki mempertahankan cakupan yang lebih luas.
- source_word: יִקְרַב
  choice: akan mendekati
  rationale: Padanan ini mempertahankan gambaran ruang dari קרב dalam bentuk Qal serta terdengar alami dalam bahasa Indonesia.
- source_word: אָהֳלֶךָ
  choice: kemahmu
  rationale: Kata אָהֶל secara konkret berarti 'kemah'. Bentuk ini dipertahankan dalam teks utama, dengan kemungkinan makna yang lebih luas sebagai tempat tinggal dijelaskan dalam catatan kaki.
- source_word: אֵלֶיךָ
  choice: kamu
  rationale: Preposisi אֶל menunjukkan arah kepada orang yang disapa. Dalam konstruksi Indonesia 'menimpa kamu', arah tersebut tersampaikan secara idiomatis tanpa perlu menerjemahkan preposisinya secara terpisah.
theological_decisions:
- issue: Sifat janji perlindungan
  choice: Ayat diterjemahkan sebagai pernyataan puitis yang langsung dan tegas tentang perlindungan ilahi.
  alternative: Menjelaskannya dalam teks sebagai jaminan mutlak bahwa orang beriman tidak akan pernah mengalami penderitaan jasmani apa pun.
  rationale: Bahasa Ibrani menyampaikan janji itu secara langsung, tetapi tidak memuat penjelasan sistematis tentang penderitaan dan pemeliharaan Allah. Terjemahan mempertahankan kekuatan sekaligus ketegangan teologisnya tanpa menambahkan pembatasan atau pemutlakan interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel kedua klausa dipertahankan. 'Malapetaka' dipilih untuk nuansa puitis yang tetap mudah dimengerti; 'kemahmu' menjaga gambaran konkret bahasa Ibrani.
