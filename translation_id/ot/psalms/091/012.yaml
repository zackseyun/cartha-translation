  text: עַל כַּפַּ֥יִם יִשָּׂא֑וּ/נְ/ךָ פֶּן תִּגֹּ֖ף בָּ/אֶ֣בֶן רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/012.yaml
  text: On their hands they will carry you[b][a], lest you strike your foot against a stone.
translation:
  language: id
  text: Mereka akan membawamu di atas telapak tangan mereka[a], agar kakimu tidak terantuk batu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menopangmu” atau “mengangkatmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: di atas telapak tangan mereka
  rationale: Ungkapan ini mempertahankan gambaran konkret dalam bahasa Ibrani. Kata ganda כַּפַּיִם menunjuk pada kedua telapak tangan; kepemilikan oleh subjek tersirat dari konteks dan dinyatakan secara alami dalam bahasa Indonesia dengan “mereka”.
- source_word: יִשָּׂאוּנְךָ
  choice: mereka akan membawamu
  rationale: Kata kerja נָשָׂא dapat berarti mengangkat, membawa, atau menopang. “Membawamu” jelas dan alami, serta tidak menambahkan arah ke atas yang tidak diwajibkan oleh bentuk Ibraninya.
- source_word: פֶּן
  choice: agar ... tidak
  rationale: פֶּן memperkenalkan tujuan atau akibat negatif yang hendak dicegah. “Agar ... tidak” menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia modern.
- source_word: תִּגֹּף
  choice: terantuk
  rationale: Dalam konteks kaki yang mengenai batu, “terantuk” menyatakan benturan secara tepat tanpa menyiratkan bahwa orang itu pasti tersandung atau jatuh.
- source_word: בָּאֶבֶן
  choice: batu
  rationale: Preposisi Ibrani menyatakan benda yang terkena benturan. Dalam konstruksi Indonesia “terantuk batu,” preposisi tidak diperlukan, dan tanpa artikel kata “batu” tetap membiarkan nuansa generik atau tertentu terbuka.
- source_word: רַגְלֶךָ
  choice: kakimu
  rationale: Bentuk Ibrani tunggal dengan akhiran orang kedua tunggal paling langsung diterjemahkan “kakimu”.
theological_decisions:
- issue: Ungkapan tradisional dibandingkan dengan bahasa modern yang bersumber pada teks Ibrani
  choice: mereka akan membawamu di atas telapak tangan mereka
  alternative: mereka akan menatangmu dengan tangan mereka
  rationale: Pilihan utama mempertahankan keluasan makna נָשָׂא dan gambaran עַל כַּפַּיִם tanpa memakai ungkapan yang terlalu khusus atau bernuansa arkais. Tidak ada rincian teologis tambahan yang dimasukkan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan gambaran telapak tangan, bentuk tunggal “kaki,” dan tujuan perlindungan dalam teks Ibrani.
