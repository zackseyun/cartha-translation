  text: For he will command his angels concerning you[b][a], to guard you in all your ways.
translation:
  language: id
  text: Sebab Ia akan memerintahkan malaikat-malaikat-Nya[a] untuk menjagamu[b] di segala jalanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengenai engkau.” Susunan bahasa Ibrani ini dapat menyatakan manfaat maupun hal yang dirujuk.
    reason: lexical_alternative
  - marker: b
    text: Atau “memeliharamu” atau “mengawasimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang mendasari jaminan pada ayat sebelumnya; “Sebab” mempertahankan fungsi penjelasnya dan sesuai dengan alur puisi.
- source_word: מַלְאָכָיו
  choice: para malaikat-Nya
  rationale: Dalam konteks Mazmur 91, yang dimaksud ialah makhluk surgawi yang menjalankan perlindungan Allah. “Para malaikat-Nya” alami dalam bahasa Indonesia dan mempertahankan bentuk jamak serta akhiran kepunyaan.
- source_word: יְצַוֶּה
  choice: akan memerintahkan
  rationale: Bentuk piel menyatakan pemberian perintah atau penugasan. “Akan memerintahkan” langsung, jelas, dan mempertahankan kekuatan verba Ibrani.
- source_word: לָּךְ
  choice: tentang engkau
  rationale: Bersama verba צוה, frasa ini menunjuk kepada orang yang menjadi pokok atau kepentingan perintah, bukan penerima langsung perintah itu. “Tentang engkau” mempertahankan kemungkinan makna rujukan tanpa menutup nuansa manfaat.
- source_word: לִשְׁמָרְךָ
  choice: untuk menjagamu
  rationale: Infinitif שׁמר menyatakan tindakan menjaga, memelihara, atau mengawasi. “Menjagamu” alami dan menonjolkan perlindungan dalam konteks mazmur ini.
- source_word: בְּכָל
  choice: dalam segala
  rationale: Pilihan ini menyampaikan preposisi dan cakupan menyeluruh dari kata kuantitas tersebut dengan ungkapan Indonesia yang wajar.
- source_word: דְּרָכֶיךָ
  choice: jalanmu
  rationale: “Jalan” mempertahankan metafora Ibrani yang dapat menunjuk baik pada perjalanan harfiah maupun keseluruhan laku hidup. Makna jamaknya tercakup dalam frasa “segala jalanmu”.
theological_decisions:
- issue: Rujukan subjek tersirat pada verba orang ketiga tunggal maskulin
  choice: Subjeknya dipahami sebagai Allah, yang memerintahkan para malaikat-Nya demi perlindungan orang yang disapa.
  alternative: Membiarkan subjek sepenuhnya tidak teridentifikasi di luar bentuk pronomina.
  rationale: Konteks mazmur meneruskan gambaran perlindungan TUHAN, dan bentuk verba tunggal maskulin secara alami merujuk kembali kepada-Nya. Kata ganti “Ia” mempertahankan subjek pronominal tanpa menambahkan nama ilahi yang tidak terdapat secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. “Engkau” dipertahankan sebagai sapaan tunggal yang bermartabat; enklitik “-mu” dan “-Nya” menjaga kelancaran. Kapitalisasi “Ia” dan “-Nya” menandai rujukan kepada Allah sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
