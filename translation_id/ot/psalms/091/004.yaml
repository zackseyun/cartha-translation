base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: id
  text: Ia akan menudungi engkau dengan bulu sayap-Nya,[a] dan di bawah sayap-Nya engkau akan berlindung. Kesetiaan-Nya adalah perisai besar dan perisai kecil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia akan menutupi engkau dengan bulu-bulu-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “perisai kecil” tidak pasti; mungkin berarti “benteng pertahanan”. “Kesetiaan-Nya” juga dapat diterjemahkan “kebenaran-Nya”.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: dengan bulu kepak-Nya
  rationale: אֶבְרָה menunjuk pada bulu kepak atau bulu sayap burung. Pilihan ini mempertahankan gambaran induk burung dan lebih alami daripada istilah teknis yang kurang dikenal.
- source_word: יָסֶךְ
  choice: Ia akan menaungi
  rationale: Bentuk ini menyatakan tindakan menutupi demi melindungi. 'Menaungi' menyampaikan baik unsur penutupan maupun perlindungan dalam gambaran sayap burung.
- source_word: לָךְ
  choice: engkau
  rationale: Pronomina tunggal mempertahankan sapaan langsung kepada orang yang berlindung kepada Allah; bahasa Indonesia tidak perlu menandai gender gramatikal bentuk Ibrani.
- source_word: וְתַחַת כְּנָפָיו
  choice: dan di bawah sayap-Nya
  rationale: Terjemahan langsung dan alami yang meneruskan metafora perlindungan seekor burung.
- source_word: תֶּחְסֶה
  choice: engkau akan berlindung
  rationale: חסה berarti mencari atau mendapatkan perlindungan. 'Berlindung' ringkas, wajar, dan tidak menentukan secara berlebihan apakah tekanannya pada tindakan mencari atau keadaan aman yang dihasilkan.
- source_word: צִנָּה
  choice: perisai besar
  rationale: צִנָּה biasanya menunjuk pada perisai besar yang melindungi tubuh; unsur ukurannya layak dipertahankan untuk membedakannya dari istilah perlindungan berikutnya.
- source_word: וְסֹחֵרָה
  choice: dan perisai pelindung
  rationale: סֹחֵרָה adalah kata langka dan maknanya tidak pasti, tetapi konteksnya menunjuk pada perlindungan defensif yang menyertai צִנָּה. Ungkapan ini mempertahankan metafora tanpa memilih secara dogmatis antara perisai kecil, benteng, atau perlindungan yang mengelilingi.
- source_word: אֲמִתּוֹ
  choice: kesetiaan-Nya
  rationale: אֱמֶת dapat berarti kebenaran, kesetiaan, atau keterandalan. Dalam konteks perlindungan, 'kesetiaan-Nya' secara alami menyatakan sifat Allah yang dapat diandalkan, sementara kemungkinan 'kebenaran-Nya' dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna אֲמִתּוֹ sebagai dasar perlindungan Allah
  choice: kesetiaan-Nya
  alternative: kebenaran-Nya
  rationale: Keduanya dimungkinkan secara leksikal. 'Kesetiaan' paling sesuai dengan gambaran Allah sebagai pelindung yang dapat diandalkan, tanpa menambahkan gagasan teologis di luar teks; 'kebenaran' tetap dipertahankan sebagai alternatif.
- issue: Identifikasi dua perlengkapan pertahanan dalam צִנָּה וְסֹחֵרָה
  choice: perisai besar dan perisai pelindung
  alternative: perisai dan benteng pertahanan
  rationale: Kata kedua sangat jarang dan tidak pasti. Teks utama mempertahankan citra perlindungan militer, sedangkan catatan kaki menyatakan alternatif serta ketidakpastian leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Sapaan tunggal 'engkau' dipakai untuk mempertahankan kedekatan puisi mazmur. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia.
