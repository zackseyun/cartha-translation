id: PSA.91.15
reference: Psalms 91:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִקְרָאֵ֨/נִי וְֽ/אֶעֱנֵ֗/הוּ עִמּֽ/וֹ אָנֹכִ֥י בְ/צָרָ֑ה אֲ֝חַלְּצֵ֗/הוּ וַֽ/אֲכַבְּדֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/015.yaml
  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: id
  text: Ia akan berseru kepada-Ku, dan Aku akan menjawabnya; Aku bersamanya dalam kesesakan; Aku akan meluputkannya[a] dan menghormatinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyelamatkannya” atau “membebaskannya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “memuliakannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: Ia akan berseru kepada-Ku
  rationale: Dalam konteks doa, קרא dengan objek pribadi berarti berseru atau memanggil kepada seseorang. “Berseru kepada-Ku” alami dalam bahasa Indonesia dan mempertahankan nuansa permohonan kepada Allah.
- source_word: וְאֶעֱנֵהוּ
  choice: dan Aku akan menjawabnya
  rationale: ענה berarti menjawab atau menanggapi. “Menjawabnya” langsung, jelas, dan sejalan dengan tindakan berseru.
- source_word: עִמּוֹ אָנֹכִי
  choice: Aku bersamanya
  rationale: Susunan Ibrani menempatkan עִמּוֹ di depan untuk penekanan. “Aku bersamanya” mempertahankan pernyataan kehadiran ilahi secara alami tanpa menambahkan kata penegas yang tidak eksplisit.
- source_word: בְצָרָה
  choice: dalam kesesakan
  rationale: צָרָה menunjuk pada kesusahan, tekanan, atau keadaan genting. “Kesesakan” merupakan ungkapan Indonesia yang ringkas dan bermartabat serta mempertahankan bobot keadaan tersebut.
- source_word: אֲחַלְּצֵהוּ
  choice: Aku akan meluputkannya
  rationale: חלץ dalam bentuk Piel dapat berarti menarik keluar, membebaskan, atau menyelamatkan dari bahaya. “Meluputkannya” menyatakan tindakan penyelamatan dari keadaan genting tanpa mempersempit caranya.
- source_word: וַאֲכַבְּדֵהוּ
  choice: dan menghormatinya
  rationale: כבד dalam bentuk Piel berarti menghormati atau memuliakan. Karena objeknya adalah orang yang dilindungi, “menghormatinya” paling alami dalam bahasa Indonesia, sedangkan “memuliakannya” tetap merupakan alternatif leksikal yang sah.
theological_decisions:
- issue: Janji dalam perkataan ilahi tanpa menambahkan syarat yang tidak dinyatakan
  choice: 'Urutan tanggapan ilahi dinyatakan secara langsung: menjawab, hadir bersama, meluputkan, dan menghormati.'
  alternative: Menjadikan janji ini secara eksplisit bersyarat pada kesetiaan sebelumnya.
  rationale: Ayat Ibrani menyatakan tanggapan Allah kepada orang yang berseru kepada-Nya tanpa menambahkan syarat penjelas dalam ayat ini. Terjemahan mempertahankan janji sebagaimana dinyatakan dan tidak memasukkan batasan doktrinal dari luar teks.
- issue: Makna כבד ketika Allah menjadi pelaku dan manusia menjadi objek
  choice: menghormatinya
  alternative: memuliakannya
  rationale: Keduanya dimungkinkan secara leksikal. “Menghormatinya” menghindari kesan tafsiran yang terlalu tinggi, sedangkan alternatif dicatat agar keluasan makna kata sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapital pada pronomina yang merujuk kepada Allah mengikuti konvensi ejaan teks Alkitab Indonesia. Tanda [a] dan [b] ditempatkan tepat pada kata yang memiliki alternatif leksikal; ini juga membetulkan ketidakselarasan posisi penanda dalam lapisan konsultasi Inggris.
