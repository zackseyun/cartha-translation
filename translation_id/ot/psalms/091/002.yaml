  text: אֹמַ֗ר לַֽ֭/יהוָה מַחְסִ֣/י וּ/מְצוּדָתִ֑/י אֱ֝לֹהַ֗/י אֶבְטַח בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/002.yaml
  text: I say to Yahweh[a], “My refuge and my fortress, my God, in whom I trust.”
translation:
  language: id
  text: Aku berkata kepada Yahweh[a], “Tempat perlindunganku dan bentengku, Allahku, kepada-Nya aku percaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Aku berkata
  rationale: Bentuk imperfek Qal orang pertama tunggal dapat menyatakan tindakan kini atau berkelanjutan. Dalam pengakuan puitis ini, bentuk kini alami dalam bahasa Indonesia tanpa menambahkan makna masa depan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל paling wajar menandai pihak yang menjadi tujuan perkataan, yaitu 'kepada Yahweh'.
- source_word: יהוה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, selaras dengan bukti teks Ibrani dan lapisan konsultasi yang telah diaudit.
- source_word: מַחְסִי
  choice: tempat perlindunganku
  rationale: מַחְסֶה menunjuk tempat berlindung; ungkapan ini jelas dan alami bagi pembaca Indonesia.
- source_word: וּמְצוּדָתִי
  choice: dan bentengku
  rationale: מְצוּדָה menggambarkan kubu pertahanan yang kuat; 'benteng' mempertahankan citra perlindungan militer.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: 'Akhiran orang pertama tunggal menyatakan hubungan pribadi secara langsung: ''Allahku''.'
- source_word: אֶבְטַח
  choice: aku percaya
  rationale: Imperfek Qal dari בטח menyatakan kepercayaan atau rasa aman. Bentuk kini sesuai dengan pengakuan iman dalam konteks ini.
- source_word: בּוֹ
  choice: kepada-Nyalah
  rationale: Preposisi ב dengan akhiran orang ketiga maskulin tunggal menyatakan bahwa Allah adalah tumpuan kepercayaan. 'Kepada-Nyalah' alami dalam bahasa Indonesia dan penegasan '-lah' mencerminkan fokus pada sang rujukan tanpa mengubah makna.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian tersebut, sedangkan catatan kaki memberi tahu pembaca tentang bentuk Ibrani dan kebiasaan penerjemahan tradisional.
- issue: Aspek waktu pada אֹמַר dan אֶבְטַח
  choice: 'kini: ''Aku berkata'' dan ''aku percaya'''
  alternative: 'masa depan/modal: ''Aku akan berkata'' dan ''aku akan percaya'''
  rationale: Bentuk imperfek Ibrani memungkinkan nuansa kini, berkelanjutan, atau masa depan. Konteks pengakuan puitis mendukung bentuk kini, tetapi tidak dimaksudkan untuk menyangkal kemungkinan nuansa berkelanjutan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan aposisional 'Tempat perlindunganku dan bentengku, Allahku' dipertahankan agar daya pengakuan teks Ibrani tetap terasa.
