source:
  edition: WLC
  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: id
  text: Orang yang berdiam di tempat perlindungan Yang Mahatinggi[a][b] akan bermalam dalam naungan Yang Mahakuasa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dia yang berdiam.” Bentuk Ibraninya maskulin tunggal, tetapi dapat dipahami secara representatif.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tempat tersembunyi Yang Mahatinggi.”
    reason: lexical_alternative
  - marker: c
    text: Atau “akan tetap tinggal.” Kata kerja Ibraninya menyiratkan menginap pada malam hari dan, dalam arti yang lebih luas, tetap tinggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: orang yang berdiam
  rationale: Partisipel ini dipakai sebagai nomina dan menggambarkan seseorang yang menetap atau terus tinggal. “Berdiam” menyampaikan keadaan menetap dengan wajar dan puitis; “orang yang” mempertahankan acuan tunggal yang bersifat representatif tanpa menambahkan penandaan gender yang tidak terdapat dalam tata bahasa Indonesia.
- source_word: בְּסֵתֶר
  choice: di tempat perlindungan
  rationale: סֵתֶר dapat menunjuk tempat tersembunyi yang memberi perlindungan. Pilihan ini menyampaikan unsur aman dan terlindung secara jelas, sementara kemungkinan arti “tempat tersembunyi” dipertahankan dalam catatan kaki.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Gelar ilahi ini berarti “Yang Mahatinggi.” Bentuk tersebut sudah alami, transparan, dan agung dalam bahasa Indonesia.
- source_word: בְּצֵל
  choice: dalam naungan
  rationale: צֵל secara konkret berarti bayang-bayang atau keteduhan. “Dalam naungan” mempertahankan gambaran kedekatan dan perlindungan serta terdengar alami dalam puisi Indonesia.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Gelar ilahi שַׁדַּי diterjemahkan menurut makna tradisionalnya, bukan ditransliterasikan, sehingga kuasa Allah tersampaikan dengan jelas kepada pembaca modern.
- source_word: יִתְלוֹנָן
  choice: akan bermalam
  rationale: Kata kerja dari לון pada dasarnya berarti menginap atau bermalam, lalu dapat meluas menjadi tetap tinggal. “Akan bermalam” mempertahankan gambaran konkret sumber Ibrani.
theological_decisions:
- issue: Bentuk maskulin tunggal yang berfungsi representatif
  choice: orang yang berdiam
  alternative: dia yang berdiam; siapa yang berdiam
  rationale: Bahasa Ibrani memakai partisipel maskulin tunggal, tetapi dapat menunjuk secara representatif kepada siapa pun. Karena bahasa Indonesia tidak menandai gender pada “orang yang,” terjemahan ini tidak menambahkan gender yang tidak dapat dinyatakan secara alami, sekaligus mempertahankan acuan tunggal.
- issue: Penerjemahan gelar ilahi שַׁדַּי
  choice: Yang Mahakuasa
  alternative: Syaddai
  rationale: Menerjemahkan gelar ini membuat maknanya langsung dipahami dan tidak mengubahnya menjadi bentuk nama tanpa kebutuhan kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang bermartabat. Susunan dua baris paralel Ibrani dipertahankan dalam satu kalimat. “Berdiam,” “naungan,” serta gelar “Yang Mahatinggi” dan “Yang Mahakuasa” mudah dipahami tanpa kehilangan keagungan mazmur.
