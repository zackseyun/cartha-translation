id: PSA.91.3
reference: Psalms 91:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: id
  text: Sebab Dialah yang akan melepaskanmu dari jerat penangkap burung, dari wabah yang membinasakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “wabah kebinasaan” atau “wabah yang membawa malapetaka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan dasar bagi keyakinan pada ayat sebelumnya; “Sebab” mempertahankan hubungan penjelas tersebut secara wajar dalam bahasa Indonesia.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri ini memberi penekanan pada pelaku. Bentuk “Dialah” menyampaikan penekanan itu secara alami tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: יַצִּילְךָ
  choice: akan melepaskanmu
  rationale: Bentuk hifil dari נצל berarti menyelamatkan atau melepaskan seseorang dari bahaya. “Melepaskanmu” sangat sesuai dengan gambaran korban yang terjerat dan tetap dapat mencakup penyelamatan dari wabah.
- source_word: מִפַּח
  choice: dari jerat
  rationale: פַּח menunjuk pada jerat atau perangkap. “Jerat” mempertahankan gambaran alat penangkap burung dengan bahasa yang ringkas dan lazim.
- source_word: יָקוּשׁ
  choice: penangkap burung
  rationale: Kata ini menunjuk pada orang yang memasang jerat, khususnya untuk menangkap burung. Padanan ini jelas bagi pembaca modern dan tidak memerlukan istilah arkais.
- source_word: מִדֶּבֶר
  choice: dari wabah
  rationale: דֶּבֶר biasanya berarti wabah atau sampar, yaitu penyakit menular yang meluas dan berbahaya. “Wabah” merupakan padanan Indonesia modern yang alami.
- source_word: הַוּוֹת
  choice: yang membinasakan
  rationale: Bentuk ini menyatakan kebinasaan, kehancuran, atau malapetaka. Klausa pewatas ini menghasilkan bahasa Indonesia yang alami sambil mempertahankan daya rusaknya.
theological_decisions:
- issue: Sifat bahaya yang disebutkan
  choice: Mempertahankan jerat dan wabah sebagai bahaya konkret yang dalam puisi juga dapat mewakili ancaman secara lebih luas.
  alternative: Menafsirkan keduanya hanya sebagai bahaya jasmani harfiah atau hanya sebagai bahaya rohani metaforis.
  rationale: Bahasa Ibrani menyebut ancaman konkret, tetapi konteks puitis memungkinkan cakupan simbolis yang lebih luas. Terjemahan tidak membatasi daya gambarnya pada salah satu tafsiran saja.
- issue: Penekanan pada pelaku penyelamatan
  choice: Menggunakan “Dialah” untuk menyatakan penekanan pada Allah sebagai pelaku.
  alternative: Menggunakan “Dia” tanpa penekanan atau “Dia sendiri” dengan penekanan yang lebih eksplisit.
  rationale: Pronomina Ibrani yang berdiri sendiri memang menonjolkan subjek; “Dialah” menyampaikan hal itu secara tepat dan wajar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Penangkap burung” dipilih daripada istilah lama yang kurang mudah dipahami, sedangkan “jerat” menjaga citra konkret teks Ibrani.
