  text: I waited patiently for Yahweh[a], and he turned to me and heard my cry for help.
translation:
  language: id
  text: Aku sungguh-sungguh menantikan Yahweh[a]; Ia mencondongkan diri kepadaku dan mendengar seruanku meminta pertolongan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Menanti, aku menantikan Yahweh,” sebuah ungkapan Ibrani yang menegaskan penantian yang tekun atau penuh harap.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: Aku sungguh-sungguh menanti-nantikan
  rationale: Infinitif absolut yang diikuti verba finit dari קוה memberi penegasan pada tindakan menanti. Ungkapan ini mempertahankan intensitas dan nuansa penantian yang tekun dalam bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וַיֵּט אֵלַי
  choice: ia mencondongkan diri kepadaku
  rationale: נטה dengan אֵלַי menggambarkan Yahweh mengarahkan atau mencondongkan diri kepada pemazmur. Pilihan ini mempertahankan citra gerak dalam teks tanpa menyiratkan bahwa sebelumnya Allah berpaling.
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: שמע di sini menyatakan bahwa seruan pemazmur didengar dengan perhatian; “mendengar” merupakan padanan langsung dan alami.
- source_word: שַׁוְעָתִי
  choice: seruanku minta tolong
  rationale: שַׁוְעָה adalah seruan dalam kesesakan yang meminta pertolongan, bukan sekadar teriakan biasa.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna penegasan dalam קַוֺּה קִוִּיתִי
  choice: sungguh-sungguh menanti-nantikan
  alternative: dengan sabar menantikan atau dengan penuh harap menantikan
  rationale: Konstruksi Ibrani menegaskan tindakan menanti, tetapi tidak menetapkan secara eksklusif apakah tekanannya pada kesabaran atau pengharapan. Terjemahan utama mempertahankan intensitas tanpa menutup nuansa tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan “menanti-nantikan” dipadukan dengan “sungguh-sungguh” untuk membawa penegasan konstruksi Ibrani, sedangkan “mencondongkan diri” mempertahankan gambaran konkret verba נטה.
