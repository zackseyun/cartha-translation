source:
  edition: WLC
  text: בִּשַּׂ֤רְתִּי צֶ֨דֶק בְּ/קָ֘הָ֤ל רָ֗ב הִנֵּ֣ה שְׂ֭פָתַ/י לֹ֣א אֶכְלָ֑א יְ֝הוָ֗ה אַתָּ֥ה יָדָֽעְתָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: id
  text: Aku telah memberitakan kebenaran di tengah jemaah yang besar[a]. Lihatlah, aku tidak akan menahan bibirku[b]; Yahweh, Engkau tahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.” Kata Ibrani צֶדֶק dapat mengandung nuansa moral maupun hukum.
    reason: lexical_alternative
  - marker: b
    text: Atau “aku tidak akan membungkam bibirku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: Aku telah memberitakan
  rationale: Bentuk piel dari בּשׂר menyatakan penyampaian berita secara terbuka, sering kali berita baik. “Memberitakan” mempertahankan nuansa pewartaan tanpa menambahkan makna khusus yang tidak dinyatakan secara eksplisit.
- source_word: צֶדֶק
  choice: kebenaran
  rationale: צֶדֶק mencakup apa yang benar secara moral dan adil secara hukum. “Kebenaran” sesuai dengan konteks mazmur dan tetap membuka nuansa “keadilan,” yang dicatat dalam catatan kaki.
- source_word: בְּקָהָל רָב
  choice: di tengah jemaah yang besar
  rationale: קָהָל adalah umat atau kelompok yang berhimpun, sedangkan רָב menunjukkan besarnya perhimpunan itu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan latar pewartaan di muka umum.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: הִנֵּה menarik perhatian kepada pernyataan berikutnya. “Lihatlah” mempertahankan tekanan retoris dan ragam puitisnya.
- source_word: שְׂפָתַי לֹא אֶכְלָא
  choice: aku tidak menahan bibirku
  rationale: Terjemahan ini mempertahankan citra konkret “bibir” serta arti verba sebagai tidak mengekang atau tidak menahan ucapan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh,” bukan diganti dengan suatu gelar.
- source_word: יָדָעְתָּ
  choice: Engkau mengetahuinya
  rationale: Bentuk perfektif ini secara idiomatis menyatakan pengetahuan Yahweh yang sudah pasti dan tetap berlaku. Akhiran “-nya” membuat objek tersiratnya jelas tanpa membatasi apakah yang diketahui adalah tindakan atau ketulusan penutur.
theological_decisions:
- issue: Cakupan makna צֶדֶק
  choice: kebenaran
  alternative: keadilan
  rationale: Kata Ibrani ini dapat menunjuk pada kelurusan moral maupun keadilan. Teks utama memakai istilah yang lebih luas dalam konteks mazmur, sementara kemungkinan yudisialnya dipertahankan dalam catatan kaki.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi. Alih aksara “Yahweh” mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Pronomina “Engkau” dipakai dalam sapaan langsung kepada Yahweh. Citra tubuh “bibirku” dipertahankan dari teks Ibrani.
