source:
  edition: WLC
  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: id
  text: Sebab malapetaka yang tak terhitung banyaknya telah mengepung aku; kesalahan-kesalahanku telah menyusul aku, dan aku tidak sanggup melihat.[a] Jumlahnya lebih banyak daripada rambut di kepalaku, dan hatiku telah meninggalkan aku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kesalahan-kesalahanku” juga dapat diterjemahkan “dosa-dosaku” atau “kesalahanku”; kata Ibrani ini dapat mencakup perbuatan salah maupun keadaan atau beban kesalahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hatiku telah meninggalkan aku”; ungkapan ini dapat menyatakan hilangnya kekuatan atau keberanian.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi permohonan dalam konteks sekitarnya dan mempertahankan daya penjelas konjungsi Ibrani.
- source_word: אָפְפוּ עָלַי
  choice: telah mengepung aku
  rationale: Mempertahankan gambaran tentang sesuatu yang mengelilingi dan menghimpit dari segala sisi.
- source_word: רָעוֹת
  choice: malapetaka
  rationale: Dalam konteks ini bentuk jamak רָעוֹת menunjuk pada berbagai keburukan, kesusahan, atau bencana yang menimpa pemazmur. 'Malapetaka' menyampaikan kemalangan nyata tanpa menyamakannya dengan kesalahan moral pemazmur yang disebut sesudahnya.
- source_word: עַד אֵין מִסְפָּר
  choice: yang tak terhitung banyaknya
  rationale: Ungkapan idiomatis ini menyatakan jumlah yang tidak dapat dihitung; pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: הִשִּׂיגוּנִי
  choice: telah menyusul aku
  rationale: Mempertahankan citra pengejaran dalam verba yang berarti mencapai, menangkap, atau menyusul.
- source_word: עֲוֺנֹתַי
  choice: kesalahan-kesalahanku
  rationale: Kata עָוֹן dapat mencakup perbuatan salah sekaligus kesalahan atau beban akibatnya. 'Kesalahan-kesalahanku' menjaga bobot moral dan bentuk jamaknya tanpa mempersempitnya hanya pada hukuman.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: sehingga aku tidak mampu melihat
  rationale: Waw dapat dipahami sebagai akibat dalam rangkaian ini; terjemahan mempertahankan ketidakmampuan melihat tanpa menentukan apakah hal itu bersifat fisik atau kiasan.
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: Semuanya lebih banyak daripada rambut di kepalaku
  rationale: Konteks perbandingan dengan rambut menuntut pengertian jumlah yang amat besar. 'Semuanya' merujuk secara alami kepada kesalahan-kesalahan pada klausa sebelumnya.
- source_word: לִבִּי עֲזָבָנִי
  choice: hatiku telah meninggalkan aku
  rationale: Mengikuti metafora Ibrani secara dekat dan membiarkan cakupannya—hilangnya kekuatan, keberanian, atau keteguhan batin—tetap terbuka.
theological_decisions:
- issue: Apakah עֲוֺנֹתַי menunjuk pada dosa pemazmur sendiri, kesalahannya, atau akibat yang ditanggungnya
  choice: kesalahan-kesalahanku
  alternative: dosa-dosaku; kesalahanku; akibat dosa-dosaku
  rationale: Bentuk berakhiran posesif paling wajar mengacu pada kesalahan pemazmur sendiri, tetapi medan makna עָוֹן juga dapat meliputi keadaan bersalah dan bebannya. Pilihan ini mempertahankan pengakuan moral serta ketegangannya dengan malapetaka eksternal.
- issue: Makna metaforis לִבִּי עֲזָבָנִי
  choice: hatiku telah meninggalkan aku
  alternative: hatiku gagal menopang aku; keberanianku lenyap
  rationale: Terjemahan harfiah mempertahankan metafora dan tidak membatasi 'hati' hanya pada keberanian, emosi, atau daya hidup.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa dibuat mengalir secara alami, sementara citra pengepungan, pengejaran, rambut kepala, dan hati yang meninggalkan pemazmur dipertahankan. Penanda catatan kaki [a] ditempatkan langsung setelah klausa yang diterangkannya.
