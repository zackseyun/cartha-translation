translation:
  language: id
  text: Untuk pemimpin musik. Mazmur Daud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur karya Daud” atau “Mazmur untuk Daud”; judul Ibrani dapat menunjukkan kepengarangan, keterkaitan, kepunyaan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Frasa ini alami dalam bahasa Indonesia dan awalan ל־ dipertahankan dengan “untuk”.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam frasa “Mazmur Daud”, bentuk ini mempertahankan hubungan mazmur dengan Daud tanpa menegaskan secara mutlak bahwa Daud adalah penulisnya; catatan kaki menjelaskan kemungkinan maknanya.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Padanan baku dan jelas untuk sebutan jenis nyanyian yang memiliki kaitan dengan musik.
theological_decisions:
- issue: Makna keterangan yang menghubungkan mazmur dengan Daud
  choice: Mazmur Daud
  alternative: Mazmur karya Daud; Mazmur untuk Daud
  rationale: Kata depan ל־ dalam judul mazmur dapat menyatakan kepengarangan, keterkaitan, kepunyaan, atau peruntukan. Terjemahan utama tidak membatasi maknanya hanya pada klaim kepengarangan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk sebuah judul mazmur. “Pemimpin musik” dipilih karena lebih mudah dipahami pembaca masa kini daripada istilah tradisional “pemimpin biduan”.
