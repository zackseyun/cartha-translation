  text: זֶ֤בַח וּ/מִנְחָ֨ה לֹֽא חָפַ֗צְתָּ אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑/י עוֹלָ֥ה וַ֝/חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: id
  text: Kurban dan persembahan[a] tidak Kaukehendaki; telingaku telah Kaubuka[b]; kurban bakaran dan kurban penghapus dosa tidak Kauminta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus, “persembahan sajian” atau “persembahan bahan makanan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Kau telah menggali telinga bagiku,” kemungkinan suatu ungkapan tentang dimampukan untuk mendengar atau taat. Septuaginta, yang diikuti dalam Ibrani 10:5, berbunyi, “suatu tubuh telah Kausediakan bagiku.”
    reason: alternative_reading
lexical_decisions:
- source_word: זֶבַח
  choice: kurban
  rationale: Istilah umum dan alami untuk persembahan berupa hewan yang disembelih dalam konteks ibadah.
- source_word: מִנְחָה
  choice: persembahan
  rationale: Mempertahankan pasangan puitis yang alami dengan 'kurban'; arti yang lebih khusus, yakni persembahan sajian atau bahan makanan, dicatat dalam catatan kaki.
- source_word: חָפַצְתָּ
  choice: tidak Kaukehendaki
  rationale: Menyampaikan makna kehendak atau kesukaan tanpa mempersempitnya menjadi emosi semata.
- source_word: אָזְנַיִם כָּרִיתָ לִּי
  choice: telingaku telah Kaubuka
  rationale: Mengungkapkan secara alami idiom Ibrani yang secara harfiah berbunyi 'telinga telah Kaugali bagiku', dengan gagasan bahwa Allah memampukan pemazmur untuk mendengar dan menaati; citra harfiahnya tetap dicatat.
- source_word: עוֹלָה
  choice: kurban bakaran
  rationale: Padanan baku dan tepat bagi kurban yang seluruhnya dibakar.
- source_word: חֲטָאָה
  choice: kurban penghapus dosa
  rationale: Dalam kesejajaran kultis ini kata tersebut menunjuk kepada jenis kurban untuk dosa, bukan kepada dosa sebagai konsep abstrak.
- source_word: שָׁאָלְתָּ
  choice: tidak Kauminta
  rationale: Padanan langsung yang mempertahankan nuansa 'meminta' dan tidak memperkuatnya menjadi 'menuntut' atau 'mewajibkan'.
theological_decisions:
- issue: Hubungan teks Ibrani 'telinga telah Kaugali bagiku' dengan bentuk Septuaginta yang dikutip dalam Ibrani 10:5, 'suatu tubuh telah Kausediakan bagiku'
  choice: Teks utama mengikuti makna idiom teks Ibrani dengan 'telingaku telah Kaubuka', sambil mencatat bentuk harfiah Ibrani dan bentuk Yunani dalam catatan kaki.
  alternative: Secara harfiah, 'telinga telah Kaugali bagiku'; menurut Septuaginta dan Ibrani 10:5, 'suatu tubuh telah Kausediakan bagiku'.
  rationale: Mazmur diterjemahkan terutama dari teks Ibrani, bukan diselaraskan dengan bentuk kutipannya dalam Perjanjian Baru. Catatan kaki mempertahankan perbedaan tekstual dan ketegangan kanonik secara terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat 'Kau-' dipakai secara konsisten untuk sapaan kepada Allah. Susunan tiga klausa bertitik koma mempertahankan kesejajaran puitis ayat.
