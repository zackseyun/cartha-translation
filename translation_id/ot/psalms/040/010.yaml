id: PSA.40.10
reference: Psalms 40:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: id
  text: Aku tidak menyembunyikan kebenaran-Mu di dalam hatiku[a]; aku telah memberitakan kesetiaan-Mu dan keselamatan-Mu[b]. Aku tidak merahasiakan kasih setia-Mu[c] dan kebenaran-Mu dari jemaah yang besar[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan-Mu”. Kata Ibrani צְדָקָה dapat menunjuk pada kebenaran moral, keadilan, atau tindakan Allah yang membenarkan dan menyelamatkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “pembebasan-Mu”.
    reason: lexical_alternative
  - marker: c
    text: Atau “kasih perjanjian-Mu”.
    reason: lexical_alternative
  - marker: d
    text: Atau “di hadapan jemaah yang besar”. Susunan Ibraninya dapat menyoroti baik orang-orang yang darinya hal-hal itu tidak dirahasiakan maupun jemaah yang di hadapannya semuanya diberitakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: kebenaran-Mu
  rationale: צְדָקָה dapat menunjuk pada kebenaran moral, keadilan, atau tindakan Allah yang membenarkan dan menyelamatkan. “Kebenaran-Mu” mempertahankan keluasan makna itu, sedangkan kemungkinan “keadilan-Mu” dicatat dalam catatan kaki.
- source_word: כִסִּיתִי
  choice: menyembunyikan
  rationale: כסה secara harfiah berarti “menutupi”, tetapi bersama frasa “di dalam hatiku” bentuk idiomatis Indonesianya adalah “menyembunyikan”.
- source_word: בְּתוֹךְ לִבִּי
  choice: di dalam hatiku
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang menyimpan sesuatu secara batiniah dan tidak mengungkapkannya.
- source_word: אֱמוּנָתְךָ
  choice: kesetiaan-Mu
  rationale: אֱמוּנָה di sini menyatakan sifat Allah yang dapat dipercaya dan teguh, bukan iman sebagai tindakan percaya manusia.
- source_word: וּתְשׁוּעָתְךָ
  choice: dan keselamatan-Mu
  rationale: תְּשׁוּעָה mencakup keselamatan, pembebasan, atau kemenangan. “Keselamatan” cukup luas dan wajar dalam konteks kesaksian tentang pertolongan Allah.
- source_word: אָמָרְתִּי
  choice: aku telah memberitakan
  rationale: Walaupun אָמַר secara dasar berarti “berkata”, objek yang disebutkan dan konteks jemaah menunjukkan pernyataan terbuka; “memberitakan” menyampaikan daya proklamasi itu secara alami.
- source_word: כִחַדְתִּי
  choice: merahasiakan
  rationale: כחד berarti menyembunyikan atau menahan agar tidak diketahui. “Merahasiakan” membedakannya secara gaya dari כסה tanpa menghilangkan kesejajaran maknanya.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד memadukan kasih, loyalitas, dan komitmen relasional. “Kasih setia” merupakan padanan Indonesia yang alami dan mempertahankan kedua unsur utamanya.
- source_word: וַאֲמִתְּךָ
  choice: dan kebenaran-Mu
  rationale: אֱמֶת dapat berarti kebenaran, keteguhan, atau kesetiaan. “Kebenaran” menjaga pembedaan dari אֱמוּנָה yang sebelumnya diterjemahkan “kesetiaan”.
- source_word: לְקָהָל רָב
  choice: dari jemaah yang besar
  rationale: Sesudah verba “merahasiakan”, לְ secara alami menyatakan pihak yang darinya sesuatu tidak disembunyikan. “Jemaah yang besar” mempertahankan latar perhimpunan umum.
theological_decisions:
- issue: Pembedaan istilah perjanjian אֱמוּנָה dan אֱמֶת
  choice: Menerjemahkan אֱמוּנָתְךָ sebagai “kesetiaan-Mu” dan אֲמִתְּךָ sebagai “kebenaran-Mu”.
  alternative: Menerjemahkan keduanya dengan istilah yang bertumpang tindih, misalnya “kesetiaan”, atau membalik kedua padanan tersebut.
  rationale: Kedua istilah berkaitan tetapi tidak identik. Padanan berbeda mempertahankan susunan puitis atribut Allah tanpa menggabungkannya menjadi satu konsep.
- issue: Makna צְדָקָה dalam tindakan Allah
  choice: Memakai “kebenaran-Mu” dalam teks utama.
  alternative: Memakai “keadilan-Mu” atau ungkapan yang menekankan pembenaran dan pertolongan Allah.
  rationale: Istilah Ibrani dapat memuat dimensi moral maupun tindakan adil yang menyelamatkan. Teks utama memakai padanan luas, sementara catatan kaki mempertahankan alternatif yang sungguh mungkin.
- issue: Aspek verba sempurna Ibrani
  choice: Memakai “tidak menyembunyikan”, “telah memberitakan”, dan “tidak merahasiakan” secara idiomatis.
  alternative: Memakai bentuk lampau eksplisit secara konsisten, misalnya “tidak menyembunyikan dahulu” atau “sudah merahasiakan”.
  rationale: Bentuk sempurna Ibrani menggambarkan tindakan yang telah dilakukan dalam kesaksian pemazmur. Bahasa Indonesia tidak perlu menandai semua verba dengan “telah”; satu penanda pada pernyataan positif cukup memperjelas konteks tanpa membuat kalimat kaku.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. “Jemaah” dipilih untuk perhimpunan umat, sedangkan pasangan “menyembunyikan/merahasiakan” mempertahankan paralelisme tanpa terdengar berulang secara mekanis.
