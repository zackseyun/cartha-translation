base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: id
  text: Biarlah semua orang yang mencari Engkau bersukacita dan bergembira di dalam Engkau. Biarlah mereka yang mengasihi keselamatan-Mu[a] selalu berkata, “Biarlah Yahweh diagungkan!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan-Mu.” Kata Ibrani תְּשׁוּעָה dapat berarti “keselamatan” atau “pembebasan.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Biarlah Yahweh diagungkan!” Seruan ini mengungkapkan kerinduan agar kebesaran Yahweh diakui secara terbuka.'
    reason: lexical_clarification
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: biarlah ... bersukacita dan bergembira
  rationale: Kedua bentuk imperfek menyatakan harapan atau permohonan dalam konteks ini. Dua verba yang berbeda dipertahankan untuk menjaga paralelisme puitis Ibrani.
- source_word: בְּךָ
  choice: karena Engkau
  rationale: Preposisi בְּ dapat menandai dasar atau lingkup sukacita. 'Karena Engkau' menyampaikan bahwa Allah sendiri menjadi dasar sukacita dengan bahasa Indonesia yang alami.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: semua orang yang mencari Engkau
  rationale: Partisipel ini menunjuk kepada orang-orang yang bercirikan tindakan mencari Allah; frasa relatif ini jelas dan alami dalam bahasa Indonesia.
- source_word: יֹאמְרוּ תָמִיד
  choice: selalu berkata
  rationale: Gabungan bentuk imperfek dan תָמִיד menyatakan ucapan yang terus-menerus atau berulang.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: orang-orang yang mencintai keselamatan-Mu
  rationale: Partisipel substantival diterjemahkan sebagai kelompok orang, sedangkan 'keselamatan-Mu' mempertahankan keluasan makna תְּשׁוּעָה tanpa membatasinya pada satu bentuk pertolongan.
- source_word: יִגְדַּל יְהוָה
  choice: Biarlah Yahweh diagungkan!
  rationale: Bentuk יִגְדַּל paling tepat dipahami secara yusif sebagai seruan agar kebesaran Yahweh diakui dan dinyatakan, bukan sekadar pernyataan bahwa Ia besar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Makna תְּשׁוּעָה
  choice: keselamatan
  alternative: pembebasan
  rationale: '''Keselamatan'' dapat mencakup pertolongan konkret maupun makna penyelamatan yang lebih luas; catatan kaki mempertahankan kemungkinan terjemahan ''pembebasan''.'
- issue: Nuansa יִגְדַּל dalam seruan pujian
  choice: Biarlah Yahweh diagungkan!
  alternative: Yahweh itu besar!
  rationale: Bentuk Ibrani menyampaikan harapan atau seruan agar kebesaran Yahweh diakui. Terjemahan alternatif akan mengubahnya menjadi pernyataan biasa.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi menjaga pembedaan antara nama tersebut dan gelar umum bagi Tuhan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'Biarlah' mempertahankan corak doa, sedangkan pasangan 'bersukacita dan bergembira' menjaga kesejajaran puitis tanpa terasa kuno.
