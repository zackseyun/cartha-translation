id: PSA.40.11
reference: Psalms 40:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: id
  text: Engkau, ya Yahweh, tidak akan menahan belas kasihan-Mu dariku[a]; kasih setia-Mu dan kesetiaan-Mu[b] akan senantiasa menjaga aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah menahan belas kasihan-Mu dariku,” jika bentuk kata kerjanya dipahami sebagai permohonan dan bukan pernyataan keyakinan.
    reason: alternative_reading
  - marker: b
    text: Atau, “kebenaran-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: Engkau
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan pada pribadi yang disapa; “Engkau” mempertahankan penekanan itu dalam ragam yang khidmat dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: תִכְלָא
  choice: tidak akan menahan
  rationale: Kata kerja כלא di sini berarti menahan atau tidak memberikan. Bentuk yiqtol dapat dibaca sebagai pernyataan keyakinan tentang tindakan Yahweh, sedangkan kemungkinan nuansa permohonan dipertahankan dalam catatan kaki.
- source_word: רַחֲמֶיךָ
  choice: belas kasihan-Mu
  rationale: Bentuk jamak Ibrani menyatakan belas kasih yang mendalam; bahasa Indonesia lazim memakai nomina kolektif tunggal “belas kasihan” untuk gagasan ini.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Menerjemahkan preposisi מִן dengan akhiran orang pertama secara langsung dan alami sesudah kata “menahan”.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: “Kasih setia” mencakup unsur kebaikan, komitmen, dan kesetiaan relasional yang terkandung dalam חֶסֶד tanpa mempersempitnya menjadi istilah doktrinal tertentu.
- source_word: אֲמִתְּךָ
  choice: kesetiaan-Mu
  rationale: Dalam pasangan dengan חֶסֶד dan sebagai pelaku tindakan perlindungan, אֱמֶת paling alami menyatakan sifat dapat dipercaya atau kesetiaan; arti “kebenaran” tetap dicatat sebagai alternatif.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Adverbia ini menyampaikan keberlangsungan tindakan dengan ragam bahasa yang alami dan khidmat.
- source_word: יִצְּרוּנִי
  choice: akan menjaga aku
  rationale: Kata נצר bermakna menjaga, melindungi, atau memelihara. “Menjaga aku” mempertahankan gambaran perlindungannya, dan bentuk jamak sesuai dengan dua subjek, yaitu kasih setia dan kesetiaan Yahweh.
theological_decisions:
- issue: Cara menerjemahkan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian secara langsung; transliterasi “Yahweh” mempertahankan pembedaan nama itu tanpa menggantinya dengan gelar.
- issue: Nuansa bentuk תִכְלָא dalam konteks doa
  choice: 'Pernyataan keyakinan: “tidak akan menahan”'
  alternative: 'Permohonan: “janganlah menahan”'
  rationale: Bentuk yiqtol orang kedua dapat menyatakan keyakinan akan tindakan mendatang, tetapi konteks doa memungkinkan nuansa permohonan seperti jusif. Ambiguitas itu tidak diselesaikan secara dogmatis dan dicatat dalam catatan kaki.
- issue: Makna אֱמֶת dalam pasangan חֶסֶד וֶאֱמֶת
  choice: kesetiaan
  alternative: kebenaran
  rationale: Sebagai sifat Yahweh yang bersama kasih setia-Nya menjaga pemazmur, “kesetiaan” menonjolkan keterandalan relasional yang sesuai dengan konteks, sementara arti leksikal “kebenaran” tetap mungkin.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam khidmat namun mudah dipahami. Sapaan “ya Yahweh” dan pronomina ilahi berhuruf kapital mempertahankan nada doa. Susunan paralel puisi Ibrani dipertahankan, sedangkan ambiguitas utama pada bentuk yiqtol dan makna אֱמֶת dijelaskan melalui catatan kaki.
