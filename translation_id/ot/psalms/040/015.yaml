  text: Let those who say to me[a], “Aha[b], aha!” be appalled because of their shame.
translation:
  language: id
  text: Biarlah orang-orang yang berkata kepadaku, “Aha, aha!”[a] tercengang[b] karena[c] aib mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Seruan ini mengungkapkan ejekan atau kegembiraan atas kemalangan orang lain.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadi hancur,” “menjadi terpukul,” atau “menjadi tandus”; kata Ibrani ini dapat menunjuk pada kehancuran maupun ketercengangan yang hebat.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “pada tumit aib mereka,” sebuah ungkapan yang dapat menyatakan sebab atau akibat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: menjadi tercengang
  rationale: Bentuk Qal imperfek orang ketiga jamak dari שׁמם dapat menyatakan kehancuran, ketandusan, atau ketercengangan. Dalam konteks penghukuman terhadap orang yang mengejek, “menjadi tercengang” mempertahankan unsur keterkejutan yang menghancurkan tanpa mempersempit maknanya menjadi kehancuran fisik semata.
- source_word: עַל עֵקֶב
  choice: akibat
  rationale: Ungkapan ini secara harfiah berkaitan dengan sesuatu yang mengikuti pada ‘tumit’, tetapi di sini menyatakan akibat atau alasan. “Akibat” ringkas, alami, dan mempertahankan kemungkinan nuansa konsekuensial.
- source_word: בָּשְׁתָּם
  choice: aib mereka
  rationale: Kata ini menunjuk pada rasa malu, kehinaan, atau keadaan yang mempermalukan. “Aib mereka” secara alami menyampaikan kehinaan yang terbuka di hadapan orang lain.
- source_word: הָאֹמְרִים לִי
  choice: orang-orang yang berkata kepadaku
  rationale: Artikel dengan partisip berfungsi substantival dan paling alami diterjemahkan sebagai kelompok orang yang melakukan tindakan tersebut.
- source_word: הֶאָח הֶאָח
  choice: Aha! Aha!
  rationale: Seruan yang diulang ini menyatakan ejekan atau kegembiraan jahat atas kesusahan orang lain. Bentuk “Aha!” mempertahankan ciri seruan dan pengulangannya tanpa menambahkan isi yang tidak dinyatakan dalam bahasa Ibrani.
