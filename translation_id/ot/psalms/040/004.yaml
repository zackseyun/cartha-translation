  text: אַ֥שְֽׁרֵי הַ/גֶּ֗בֶר אֲשֶׁר שָׂ֣ם יְ֭הֹוָה מִבְטַח֑/וֹ וְֽ/לֹא פָנָ֥ה אֶל רְ֝הָבִ֗ים וְ/שָׂטֵ֥י כָזָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: id
  text: Berbahagialah[a] laki-laki[b] yang menaruh kepercayaannya kepada Yahweh dan tidak berpaling kepada orang-orang angkuh[c] ataupun kepada mereka yang menyimpang kepada dusta[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Diberkatilah.” Ungkapan Ibrani אַשְׁרֵי mencakup nuansa kebahagiaan dan keadaan yang diberkati.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk tunggal maskulin yang secara harfiah berarti “laki-laki”; dalam ucapan hikmat ini bentuk tersebut mempunyai daya perwakilan.
    reason: cultural_note
  - marker: c
    text: Atau “orang-orang sombong.” Kata Ibrani רְהָבִים di sini paling mungkin merupakan kata benda umum, bukan nama diri Rahab.
    reason: lexical_alternative
  - marker: d
    text: “Dusta” juga dapat diterjemahkan “kepalsuan” atau “penipuan.” Frasa ini dapat diungkapkan, “mereka yang menyimpang kepada kepalsuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk ungkapan ini menyatakan keadaan bahagia sekaligus berkat yang patut dipuji dalam sastra hikmat. “Berbahagialah” merupakan rumusan Indonesia yang alami dan bermartabat.
- source_word: הַגֶּבֶר
  choice: laki-laki
  rationale: Kata Ibrani ini berbentuk tunggal maskulin dan menunjuk kepada seorang laki-laki dewasa, tetapi di sini memiliki daya perwakilan dalam ucapan bahagia.
- source_word: שָׂם יְהוָה מִבְטַחוֹ
  choice: menaruh kepercayaannya kepada Yahweh
  rationale: Secara harfiah konstruksi ini berarti menjadikan atau menetapkan Yahweh sebagai tumpuan kepercayaannya. Ungkapan Indonesia yang dipilih menyampaikan maknanya dengan alami sambil mempertahankan nama ilahi.
- source_word: פָנָה אֶל
  choice: berpaling kepada
  rationale: Idiom ini menggambarkan tindakan mengarahkan diri kepada seseorang, dengan nuansa mencari dukungan, perhatian, atau kebergantungan.
- source_word: רְהָבִים
  choice: orang-orang angkuh
  rationale: Dalam bentuk jamak dan konteks ini, kata tersebut paling wajar dipahami sebagai sebutan bagi orang sombong atau angkuh, bukan nama diri Rahab.
- source_word: שָׂטֵי כָזָב
  choice: mereka yang menyimpang kepada kepalsuan
  rationale: Partisip שָׂטֵי mempertahankan gagasan berbelok atau menyimpang, sedangkan כָזָב menunjuk pada kepalsuan, dusta, atau penipuan. Terjemahan ini tidak mempersempit ungkapan menjadi kemurtadan secara khusus.
theological_decisions:
- issue: Bentuk maskulin tunggal yang bersifat representatif
  choice: laki-laki
  alternative: orang; siapa pun
  rationale: Teks sumber memakai גֶּבֶר, nomina maskulin tunggal. Terjemahan utama mempertahankan bentuk itu, sedangkan catatan menjelaskan bahwa ucapan hikmatnya mempunyai penerapan representatif.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks secara langsung memakai Tetragramaton. Bentuk “Yahweh” mempertahankan nama pribadi ilahi dan tidak menggantinya dengan gelar.
- issue: Identitas רְהָבִים
  choice: orang-orang angkuh
  alternative: orang-orang sombong; Rahab
  rationale: Bentuk jamaknya dan kesejajaran dengan penyimpangan kepada kepalsuan mendukung pemahaman sebagai kelompok orang angkuh. Namun, nuansa leksikal kesombongan tetap dicatat tanpa mengubahnya menjadi nama diri atau lambang tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis-hikmat yang tetap mudah dipahami. “Berbahagialah” mempertahankan bentuk ucapan bahagia yang lazim, sedangkan “menaruh kepercayaannya kepada” dipilih agar konstruksi Ibrani terdengar alami tanpa menghilangkan gagasan kebergantungan. Pengulangan “kepada” mempertahankan arah relasional kedua klausa.
