base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: id
  text: 'Ia menaruh nyanyian baru dalam mulutku,

    pujian bagi Allah kita.

    Banyak orang akan melihat dan takut[a],

    dan percaya kepada Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “merasa gentar dan kagum.” Kata Ibrani ini dapat menyatakan rasa takut, hormat, atau takjub.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia menaruh
  rationale: Dalam konstruksi dengan 'dalam mulutku', 'menaruh' mengungkapkan tindakan penempatan secara alami dan mempertahankan gambaran konkret bahasa Ibrani.
- source_word: בְּפִי
  choice: dalam mulutku
  rationale: Terjemahan langsung ini mempertahankan citraan tubuh dalam teks sumber; 'di bibirku' akan mengubah kata yang dipakai.
- source_word: שִׁיר חָדָשׁ
  choice: nyanyian baru
  rationale: Padanan yang wajar dan transparan untuk nyanyian pujian baru yang timbul dari karya penyelamatan Allah.
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: pujian bagi Allah kita
  rationale: Frasa ini berada sebagai aposisi yang menjelaskan sifat atau isi 'nyanyian baru'. 'Pujian bagi' alami dalam bahasa Indonesia dan tidak perlu menambahkan kata 'nyanyian' yang tidak diulang dalam bahasa Ibrani.
- source_word: יִרְאוּ רַבִּים
  choice: Banyak orang akan melihat
  rationale: Bentuk imperfek menyatakan hasil atau tanggapan yang akan terjadi; objek penglihatan tetap tersirat sebagaimana dalam bahasa Ibrani.
- source_word: וְיִירָאוּ
  choice: dan takut
  rationale: Kata kerja ירא mencakup takut, gentar, dan rasa hormat. 'Takut' mempertahankan bobot serta ketegangan semantisnya.
- source_word: וְיִבְטְחוּ
  choice: lalu percaya
  rationale: בטח berarti percaya atau mengandalkan. 'Lalu' menyampaikan urutan tanggapan secara alami tanpa menjadikannya hubungan sebab-akibat yang lebih tegas daripada teks.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Dengan verba 'percaya', preposisi בְּ secara alami dinyatakan sebagai 'kepada'; nama perjanjian יהוה ditransliterasikan 'Yahweh'.
theological_decisions:
- issue: Nuansa וְיִירָאוּ setelah menyaksikan karya Allah
  choice: takut
  alternative: merasa kagum; takut akan Dia
  rationale: '''Takut'' tidak melunakkan kata menjadi rasa kagum saja dan tetap membiarkan konteks menentukan perpaduan rasa gentar dan hormat.'
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan larik puitis yang ringkas. Citra 'dalam mulutku' dipertahankan, dan ambiguitas rasa takut/hormat dijelaskan tanpa diselesaikan secara sepihak.
