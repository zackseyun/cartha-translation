  text: רַבּ֤וֹת עָשִׂ֨יתָ אַתָּ֤ה יְהוָ֣ה אֱלֹהַ/י֮ נִֽפְלְאֹתֶ֥י/ךָ וּ/מַחְשְׁבֹתֶ֗י/ךָ אֵ֫לֵ֥י/נוּ אֵ֤ין עֲרֹ֬ךְ אֵלֶ֗י/ךָ אַגִּ֥ידָה וַ/אֲדַבֵּ֑רָה עָ֝צְמ֗וּ מִ/סַּפֵּֽר׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: id
  text: Engkau telah melakukan banyak hal, ya Yahweh, Allahku—keajaiban-Mu dan rencana-Mu bagi kami[a]. Tidak ada yang dapat dibandingkan dengan-Mu. Seandainya aku memberitakan dan membicarakannya, semuanya terlalu banyak untuk dihitung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pikiran-Mu terhadap kami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: Banyak yang telah Engkau lakukan
  rationale: Bentuk jamak רַבּוֹת menyatakan banyaknya tindakan Allah; 'yang' secara alami menampung objek tersirat tanpa mempersempitnya menjadi jenis perbuatan tertentu.
- source_word: יְהוָה אֱלֹהַי
  choice: ya Yahweh, Allahku
  rationale: Mempertahankan nama ilahi sebagai Yahweh dan konstruksi kepunyaan pribadi 'Allahku' dalam sapaan langsung.
- source_word: נִפְלְאֹתֶיךָ
  choice: keajaiban-keajaiban-Mu
  rationale: Menunjuk pada berbagai perbuatan ajaib Allah; bentuk ulang menyampaikan kemajemukan nomina Ibrani.
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: dan rencana-rencana-Mu bagi kami
  rationale: מַחְשָׁבוֹת dapat berarti pikiran, maksud, atau rencana. 'Rencana-rencana' menyampaikan unsur kesengajaan dalam konteks tindakan Allah, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: Tidak ada yang dapat dibandingkan dengan-Mu
  rationale: Menerjemahkan idiom tentang tiadanya sesuatu atau siapa pun yang sebanding dengan Allah tanpa menentukan referen lebih sempit daripada teks.
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: Sekiranya aku hendak memberitakan dan membicarakannya
  rationale: Dua bentuk kohortatif dipahami sebagai protasis bersifat kondisional yang mengantar pada ketidakmungkinan menghitung semuanya; 'memberitakan' dan 'membicarakan' mempertahankan dua verba.
- source_word: עָצְמוּ מִסַּפֵּר
  choice: semuanya terlalu banyak untuk dihitung
  rationale: Dalam konteks ini עָצְמוּ menyatakan jumlah yang melampaui kemampuan menghitung, sementara ספר dengan מן menyampaikan makna 'terlalu banyak untuk dihitung'.
theological_decisions:
- issue: Makna מַחְשְׁבוֹת Allah yang diarahkan kepada umat
  choice: rencana-rencana-Mu bagi kami
  alternative: pikiran-pikiran-Mu terhadap kami
  rationale: Pilihan utama menyatakan maksud Allah yang terarah kepada umat tanpa memasukkan sistem teologis tertentu tentang providensi atau predestinasi; catatan kaki mempertahankan kemungkinan leksikal yang lebih harfiah.
- issue: Referen dalam pernyataan ketakterbandingan
  choice: Tidak ada yang dapat dibandingkan dengan-Mu
  alternative: Tidak ada yang dapat disejajarkan dengan-Mu
  rationale: Rumusan ini menjaga pernyataan luas teks mengenai ketakterbandingan Yahweh tanpa menambahkan kategori atau lawan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Pronomina untuk Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Nama Yahweh dipertahankan. Tanda pisah membantu memperlihatkan bahwa 'keajaiban-keajaiban' dan 'rencana-rencana' menjabarkan banyaknya karya Allah.
