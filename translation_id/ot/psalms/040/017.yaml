  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: id
  text: 'Namun aku miskin dan berkekurangan;

    Tuhan memikirkan aku.[a]

    Engkaulah pertolonganku dan pembebasku;

    ya Allahku, jangan terlambat!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuhan memperhatikan aku” atau “Tuhan akan memikirkan aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Kata sambung dan pronomina mandiri menandai kontras dengan konteks sebelumnya; “Namun aku” menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: עָנִי וְאֶבְיוֹן
  choice: miskin dan berkekurangan
  rationale: 'Pilihan ini mempertahankan dua istilah yang bertumpang tindih tetapi tidak identik: keadaan rendah atau miskin dan keadaan membutuhkan pertolongan.'
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Ini adalah gelar ilahi Adonai, bukan nama YHWH; “Tuhan” merupakan padanan Indonesia yang tepat.
- source_word: יַחֲשָׁב לִי
  choice: memikirkan aku
  rationale: Ungkapan ini dapat berarti memikirkan, mengindahkan, atau memperhatikan seseorang. “Memikirkan aku” mempertahankan gambaran mental dan nuansa perhatian pribadi tanpa mempersempit maknanya.
- source_word: עֶזְרָתִי
  choice: pertolonganku
  rationale: Nomina ini berarti pertolongan atau bantuan; bentuk milik mempertahankan susunan puitis Ibrani.
- source_word: וּמְפַלְטִי
  choice: dan pembebasku
  rationale: Bentuk partisip dari פלט menunjuk kepada pribadi yang melepaskan atau membawa ke tempat aman; “pembebasku” ringkas dan sejajar dengan “pertolonganku”.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan; partikel “-lah” menyampaikan penekanan itu secara alami.
- source_word: אֱלֹהַי
  choice: ya Allahku
  rationale: Akhiran menyatakan hubungan milik, sedangkan “ya” membuat sapaan langsungnya jelas dan alami dalam bahasa Indonesia.
- source_word: אַל תְּאַחַר
  choice: jangan berlambat
  rationale: Larangan ini memohon tindakan segera; “jangan berlambat” mempertahankan urgensinya dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Tuanku
  rationale: Sumber memakai gelar ilahi Adonai, bukan YHWH. “Tuhan” mempertahankan fungsi gelar ilahi tanpa mencampurkannya dengan penandaan khusus bagi nama YHWH.
- issue: Makna יַחֲשָׁב לִי
  choice: Tuhan memikirkan aku
  alternative: Tuhan memperhatikan aku; Tuhan akan memikirkan aku
  rationale: Bahasa Ibrani memungkinkan nuansa pemikiran, perhatian, atau pertimbangan, dan bentuk verbalnya dapat dipahami secara kini atau mendatang. Teks utama mempertahankan gambaran langsung, sedangkan catatan kaki menjaga alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan dengan baris-baris pendek untuk mempertahankan paralelisme mazmur. Sapaan kepada Allah memakai “Engkau” dan “Allahku” secara hormat tanpa gaya yang usang.
