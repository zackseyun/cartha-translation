  text: לַֽ/עֲשֽׂוֹת רְצוֹנְ/ךָ֣ אֱלֹהַ֣/י חָפָ֑צְתִּי וְ֝/ת֥וֹרָתְ/ךָ֗ בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: id
  text: Aku senang melakukan kehendak-Mu, ya Allahku; Taurat-Mu[a] ada dalam batinku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ajaran-Mu.” Kata Ibrani torah dapat menunjuk pada pengajaran Allah secara luas, bukan hanya ketetapan hukum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: melakukan
  rationale: Infinitif dengan prefiks ל menyatakan isi dari kesenangan pemazmur. “Melakukan” merupakan padanan langsung dan wajar untuk עשה dalam hubungan dengan kehendak Allah.
- source_word: רְצוֹנְךָ
  choice: kehendak-Mu
  rationale: רָצוֹן dapat berarti kehendak, kesukaan, atau keinginan. Dalam gabungan dengan “melakukan”, “kehendak-Mu” paling alami dan mempertahankan unsur kemauan ilahi.
- source_word: אֱלֹהַי
  choice: ya Allahku
  rationale: Akhiran orang pertama tunggal menyatakan “Allahku”, sedangkan “ya” menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: חָפָצְתִּי
  choice: Aku senang
  rationale: חפץ mengungkapkan kesukaan, keinginan, atau rasa berkenan. “Aku senang” menyampaikan kerelaan yang disertai sukacita, bukan sekadar keinginan, dan tetap alami dalam bahasa Indonesia modern.
- source_word: וְתוֹרָתְךָ
  choice: Taurat-Mu
  rationale: תּוֹרָה dapat berarti hukum maupun ajaran. “Taurat-Mu” mempertahankan bobot perjanjian dan kaitan istilah ini dengan penyataan Allah, sementara catatan kaki menyimpan cakupan makna yang lebih luas, yaitu “ajaran-Mu”.
- source_word: בְּתוֹךְ
  choice: di dalam
  rationale: Ungkapan ini menunjukkan lokasi pada bagian terdalam; “di dalam” merupakan padanan yang langsung dan alami.
- source_word: מֵעָי
  choice: batinku
  rationale: מֵעֶה secara harfiah menunjuk organ-organ dalam, tetapi secara idiomatis menyatakan diri terdalam atau pusat perasaan. “Batinku” mempertahankan makna antropologis tersebut tanpa gambaran jasmani yang dapat mengganggu; “hatiku” akan lebih menafsirkan karena biasanya mewakili istilah Ibrani lain.
theological_decisions:
- issue: Penerjemahan תּוֹרָה dalam konteks pengabdian pribadi
  choice: Taurat-Mu
  alternative: ajaran-Mu
  rationale: “Taurat-Mu” mempertahankan gema perjanjian dan Kitab Suci yang penting dalam Mazmur. Namun, karena תּוֹרָה juga mencakup pengajaran Allah secara lebih luas dan bukan hanya ketetapan hukum, alternatif “ajaran-Mu” dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan “ya Allahku” mempertahankan sifat personal ayat. Tanda titik koma mencerminkan dua bagian paralel ayat. Penanda catatan kaki ditempatkan sesudah “Taurat-Mu”, yaitu kata yang memiliki alternatif leksikal.
