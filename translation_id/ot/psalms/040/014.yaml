base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: id
  text: Biarlah mereka yang memburu nyawaku[b] untuk melenyapkannya[a][c] dipermalukan dan dihina bersama-sama; biarlah mereka yang menginginkan celakaku mundur dan mendapat aib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk membinasakannya” atau “untuk menghabisinya”; verba Ibrani dapat berarti mengakhiri hidup pemazmur.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jiwaku”; dalam konteks ini kata Ibrani tersebut berarti nyawa atau hidup pemazmur.
    reason: lexical_alternative
  - marker: c
    text: 'Susunan lain yang mungkin: “mereka yang berusaha melenyapkan nyawaku.”'
    reason: previous_rendering
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: dipermalukan
  rationale: Kata בוש menyatakan mengalami malu. Bentuk ini menyampaikan daya permohonan atau kutukan dalam konteks tanpa mengharuskan bahwa verba Ibraninya berbentuk pasif.
- source_word: וְיַחְפְּרוּ
  choice: dan dihina
  rationale: חפר di sini menunjuk pada keadaan terhina atau mendapat malu dan memperkuat unsur pertama dalam kesejajaran puisi.
- source_word: יַחַד
  choice: bersama-sama
  rationale: Adverbia ini menunjukkan bahwa para lawan mengalami hal tersebut secara serentak atau sebagai satu kelompok.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: mereka yang memburu nyawaku
  rationale: Dalam konteks permusuhan, נפשׁ menunjuk pada nyawa atau hidup pemazmur. 'Memburu nyawaku' alami dalam bahasa Indonesia dan menyatakan maksud mematikan.
- source_word: לִסְפּוֹתָהּ
  choice: untuk melenyapkannya
  rationale: Verba ספה dapat berarti menghabisi, membinasakan, atau melenyapkan. Sufiks feminin tunggal paling wajar merujuk kembali kepada נפשׁ, yakni nyawa pemazmur.
- source_word: יִסֹּגוּ אָחוֹר
  choice: mundur
  rationale: Gabungan סוג dan אחור menyatakan gerak surut atau berbalik ke belakang; 'mundur' menyampaikannya secara ringkas dan alami.
- source_word: וְיִכָּלְמוּ
  choice: dan mendapat aib
  rationale: כלם menyatakan dipermalukan atau mendapat kehinaan. 'Mendapat aib' mempertahankan kesejajaran tentang rasa malu sekaligus membedakannya dari ungkapan pada baris pertama.
- source_word: חֲפֵצֵי רָעָתִי
  choice: mereka yang menginginkan celakaku
  rationale: חפץ dapat berarti menginginkan atau menyukai, sedangkan רעה di sini menunjuk pada malapetaka atau bahaya yang menimpa pemazmur, bukan kejahatan moral yang dilakukan olehnya.
theological_decisions:
- issue: Daya ujar bentuk-bentuk yiqtol dalam doa kutukan
  choice: Diterjemahkan dengan 'Biarlah' sebagai permohonan agar para musuh dipermalukan dan dipukul mundur.
  alternative: 'Menerjemahkannya sebagai pernyataan masa depan: ''Mereka akan ...''.'
  rationale: Konteks doa dan rangkaian bentuk verba mendukung nuansa kehendak atau permohonan, tetapi terjemahan tidak menentukan siapa pelaku langsung dari tindakan mempermalukan mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pilihan 'memburu nyawaku' mengungkapkan ancaman pembunuhan secara idiomatis, sedangkan rangkaian 'dipermalukan', 'dihina', dan 'mendapat aib' menjaga variasi dalam kesejajaran puitis.
