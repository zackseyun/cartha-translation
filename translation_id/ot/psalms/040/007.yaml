  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: id
  text: Lalu aku berkata[a], “Lihatlah, aku telah datang[b]; dalam gulungan kitab tertulis tentang aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tertulis untuk aku” atau “ditetapkan bagiku.” Ungkapan Ibrani ini dapat menunjuk pada apa yang ditulis mengenai pembicara atau pada apa yang ditentukan baginya.
    reason: alternative_reading
  - marker: b
    text: Bagian ini dikutip dalam Ibrani 10:7 dan dihubungkan dengan Mesias.
    reason: cross_reference
lexical_decisions:
- source_word: אָז
  choice: Lalu
  rationale: Menandai urutan dan tanggapan pemazmur terhadap konteks sebelumnya; “lalu” alami dalam bahasa Indonesia dan mempertahankan gerak wacananya.
- source_word: אָמַרְתִּי
  choice: aku berkata
  rationale: Padanan langsung untuk verba orang pertama tunggal dan cocok untuk mengantar ujaran langsung.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi partikel penunjuk yang menarik perhatian pada pernyataan berikutnya, dengan bahasa yang jelas bagi pembaca modern.
- source_word: בָאתִי
  choice: aku datang
  rationale: Dalam konteks ini bentuk perfektif menyatakan kedatangan atau tampilnya pembicara; bahasa Indonesia tidak memerlukan pembedaan eksplisit antara “datang” dan “telah datang”.
- source_word: בִּמְגִלַּת סֵפֶר
  choice: dalam gulungan kitab
  rationale: Mempertahankan gambaran konkret gulungan sebagai dokumen tertulis, tanpa meratakannya menjadi sekadar “kitab”.
- source_word: כָּתוּב
  choice: tertulis
  rationale: Menyampaikan keadaan pasif dari partisip Ibrani secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: עָלָי
  choice: tentang aku
  rationale: Makna paling langsung dalam konteks sesuatu yang tertulis adalah “mengenai aku”; kemungkinan arti “untuk aku” atau “ditetapkan bagiku” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna עָלָי dalam ayat yang kemudian dikutip secara mesianik dalam Ibrani 10
  choice: tentang aku
  alternative: untuk aku; ditetapkan bagiku
  rationale: Teks utama mempertahankan makna yang paling langsung dalam konteks mazmur tanpa memasukkan penerapan kristologis kemudian ke dalam terjemahan. Kemungkinan bahwa tulisan itu diperuntukkan atau ditetapkan bagi pembicara tetap dicatat sebagai ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan tetap mudah dipahami. Kata ganti “aku” mengikuti suara pribadi pemazmur. “Gulungan kitab” mempertahankan citra dokumen kuno, sedangkan “Lihat” menyampaikan penekanan הִנֵּה tanpa memakai bentuk arkais.
