  yaml_path: translation/ot/psalms/040/013.yaml
  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: id
  text: Berkenanlah, ya Yahweh, menyelamatkan aku; ya Yahweh, segeralah menolong aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְצֵה
  choice: Berkenanlah
  rationale: Imperatif רצה memohon kesediaan atau perkenanan Yahweh. “Berkenanlah” mempertahankan nuansa kehendak yang penuh kemurahan dan sesuai dengan ragam doa yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: לְהַצִּילֵנִי
  choice: untuk melepaskan aku
  rationale: Bentuk hiphil dari נצל dengan sufiks orang pertama tunggal berarti menyelamatkan atau melepaskan seseorang dari bahaya. “Melepaskan aku” alami dalam konteks permohonan ini dan tidak mempersempit maknanya secara teologis.
- source_word: לְעֶזְרָתִי
  choice: menolong aku
  rationale: Secara harfiah berarti “untuk pertolonganku”. Ungkapan “menolong aku” menyampaikan fungsi frasa itu secara alami dalam bahasa Indonesia modern.
- source_word: חוּשָׁה
  choice: segeralah
  rationale: Imperatif חושׁ menyatakan desakan agar bertindak cepat. “Segeralah” mempertahankan urgensi sekaligus cocok dengan ragam doa yang wajar dan bermartabat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Bentuk “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Paralelisme dua seruan “ya Yahweh” serta desakan pada bagian kedua dipertahankan. Tidak diperlukan catatan kaki karena pilihan utama dapat menyampaikan makna Ibrani secara jelas tanpa menghilangkan ambiguitas penting.
