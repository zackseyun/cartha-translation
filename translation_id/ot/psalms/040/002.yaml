  text: וַ/יַּעֲלֵ֤/נִי מִ/בּ֥וֹר שָׁאוֹן֮ מִ/טִּ֪יט הַ/יָּ֫וֵ֥ן וַ/יָּ֖קֶם עַל סֶ֥לַע רַגְלַ֗/י כּוֹנֵ֥ן אֲשֻׁרָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: id
  text: Ia mengangkat aku dari lubang yang bergemuruh[a], dari lumpur rawa; Ia menempatkan kakiku di atas batu karang dan meneguhkan langkah-langkahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lubang yang penuh kegaduhan/deru”; banyak terjemahan menafsirkan ungkapan ini sebagai “lubang kebinasaan” atau “lubang kehancuran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: Ia mengangkat aku
  rationale: Bentuk Hifil dari עלה berarti menyebabkan naik atau membawa naik; pilihan ini alami dalam bahasa Indonesia dan mempertahankan gambaran penyelamatan dari bawah.
- source_word: מִבּוֹר
  choice: dari lubang
  rationale: בּוֹר dapat berarti lubang, sumur tadah, atau tempat kurungan; 'lubang' mempertahankan cakupan makna yang luas dalam konteks puitis ini.
- source_word: שָׁאוֹן
  choice: yang bergemuruh
  rationale: שָׁאוֹן terutama menunjuk pada bunyi gaduh, deru, atau kegemparan. Bentuk verbal atributif ini lebih alami daripada 'lubang kegemparan' dan tidak menafsirkannya langsung sebagai kebinasaan.
- source_word: מִטִּיט הַיָּוֵן
  choice: dari lumpur yang dalam
  rationale: טִיט dan יָוֵן bersama-sama menggambarkan lumpur pekat atau rawa berlumpur yang membuat orang terbenam. 'Lumpur yang dalam' menyampaikan bahaya dan ketidakstabilannya tanpa pengulangan janggal.
- source_word: וַיָּקֶם עַל־סֶלַע רַגְלַי
  choice: Ia menempatkan kakiku di atas batu karang
  rationale: Hifil קום menyatakan membuat berdiri atau menempatkan dengan kokoh; סֶלַע adalah batu besar atau batu karang yang mengontraskan kestabilan dengan lumpur.
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: meneguhkan langkah-langkahku
  rationale: Polel כון berarti membuat teguh atau mantap, sedangkan אֲשֻׁרָי berarti langkah-langkahku. Ungkapan ini ringkas, puitis, dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah gambaran penyelamatan konkret harus ditafsirkan secara abstrak sebagai pembebasan rohani atau moral
  choice: Mempertahankan gambaran konkret berupa lubang, lumpur, kaki, batu karang, dan langkah
  alternative: Ia menyelamatkan aku dari kebinasaan dan membuat hidupku aman
  rationale: Bahasa Ibrani memakai citra fisik yang kuat dan membiarkan penerapan metaforisnya tetap terbuka; terjemahan tidak boleh menetapkan satu penafsiran teologis yang lebih sempit.
- issue: Makna שָׁאוֹן dalam frasa בּוֹר שָׁאוֹן
  choice: yang bergemuruh
  alternative: kebinasaan
  rationale: Makna leksikal dasarnya berkaitan dengan bunyi gaduh, deru, atau kegemparan. Pilihan utama menjaga keanehan citra sumber, sedangkan penafsiran 'kebinasaan' dicatat sebagai kemungkinan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pronomina ilahi ditulis dengan huruf kapital mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia, tanpa menambahkan gelar atau penafsiran denominatif.
