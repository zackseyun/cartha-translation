  yaml_path: translation/ot/psalms/113/007.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap.
translation:
  language: id
  text: 'Ia mengangkat orang miskin dari debu;

    Ia meninggikan orang yang membutuhkan dari timbunan abu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tumpukan sampah”. Kata Ibrani אַשְׁפֹּת menunjuk pada tempat abu dan barang buangan ditumpuk, sebagai gambaran keadaan yang sangat hina.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקִימִי
  choice: membangkitkan
  rationale: Bentuk partisipel Hifil dari קום menyatakan tindakan menyebabkan seseorang bangkit atau berdiri. “Membangkitkan” alami dalam bahasa Indonesia dan mempertahankan gerak dari keadaan rendah.
- source_word: מֵעָפָר
  choice: dari debu
  rationale: עָפָר berarti debu atau tanah gembur, sedangkan מִן menunjukkan asal. Ungkapan ini mempertahankan gambaran konkret tentang kehinaan dan kedudukan yang rendah.
- source_word: דָּל
  choice: orang miskin
  rationale: דָּל dapat menunjuk kepada orang miskin, lemah, atau rendah kedudukannya. “Orang miskin” jelas dan wajar, tanpa meniadakan nuansa kerentanan sosial.
- source_word: מֵאַשְׁפֹּת
  choice: dari timbunan abu
  rationale: אַשְׁפֹּת menunjuk pada tempat penumpukan abu atau barang buangan. “Timbunan abu” mempertahankan citra tradisional dan konkret, sementara kemungkinan makna tempat sampah dicatat dalam catatan kaki.
- source_word: יָרִים
  choice: mengangkat
  rationale: Bentuk Hifil dari רום berarti mengangkat atau meninggikan. “Mengangkat” membentuk kesejajaran puitis dengan “membangkitkan” tanpa lebih dahulu memperjelasnya sebagai peninggian status, yang dikembangkan dalam ayat berikutnya.
- source_word: אֶבְיוֹן
  choice: orang berkekurangan
  rationale: אֶבְיוֹן berarti orang yang membutuhkan, miskin, atau melarat. “Orang berkekurangan” membedakannya dari דָּל sambil mempertahankan tumpang tindih makna dalam kesejajaran puisi.
theological_decisions:
- issue: Gambaran antropologis dan pembalikan sosial
  choice: Mempertahankan bahasa konkret tentang Allah mengangkat orang miskin dan berkekurangan dari keadaan yang hina.
  alternative: Menafsirkannya secara umum sebagai kerendahan hati rohani dan peninggian ilahi.
  rationale: Teks Ibrani memakai gambaran material (“debu”, “timbunan abu”) dan kategori sosial (דָּל, אֶבְיוֹן). Terjemahan tidak merohanikan atau mempersempit gambaran tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan bentuk puitis yang ringkas dan bermartabat. Pengulangan “Ia” mempertahankan kesejajaran kedua larik dan memperjelas bahwa TUHAN dari konteks sebelumnya adalah pelakunya. Penanda catatan kaki ditempatkan sesudah “timbunan abu”, yaitu frasa yang dijelaskannya.
