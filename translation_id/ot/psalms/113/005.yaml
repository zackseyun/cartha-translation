lexical_decisions:
- source_word: מִי כַיהוָה
  choice: Siapakah yang seperti Yahweh
  rationale: Kata tanya מִי dan prefiks perbandingan כ membentuk pertanyaan retoris tentang ketakterbandingan Yahweh; kopula “yang” melahirkan ungkapan Indonesia yang alami.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk dengan sufiks orang pertama jamak berarti “Allah kita” dan menerangkan Yahweh.
- source_word: הַמַּגְבִּיהִי לָשָׁבֶת
  choice: yang bertakhta di tempat tinggi
  rationale: Ungkapan ini secara harfiah menggambarkan Dia yang meninggikan tempat duduk-Nya. “Bertakhta di tempat tinggi” mempertahankan citra kedudukan kerajaan dan keluhuran ilahi dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankan nama tersebut, sedangkan bentuk tradisional Indonesia ialah “TUHAN”.
- issue: Makna הַמַּגְבִּיהִי לָשָׁבֶת
  choice: bertakhta di tempat tinggi
  alternative: meninggikan diri untuk bersemayam
  rationale: Pilihan utama menyampaikan gambaran kedudukan tinggi tanpa menentukan secara berlebihan apakah bentuk kausatif itu refleksif atau menunjuk pada tempat duduk yang ditinggikan; alternatif mempertahankan struktur Ibrani dengan lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. “Bertakhta” dipilih untuk menjaga citra duduk dalam kedudukan kerajaan, sementara catatan kaki mempertahankan bentuk ungkapan Ibrani yang tidak biasa.
