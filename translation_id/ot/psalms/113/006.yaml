  text: הַֽ/מַּשְׁפִּילִ֥י לִ/רְא֑וֹת בַּ/שָּׁמַ֥יִם וּ/בָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/006.yaml
  text: who stoops down to look on the heavens and the earth[a].
translation:
  language: id
  text: yang membungkuk untuk melihat langit dan bumi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang merendahkan diri untuk memandang langit dan bumi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁפִּילִי
  choice: yang membungkuk
  rationale: Bentuk partisip Hifil dari שׁפל menggambarkan tindakan membuat diri rendah. Dalam konteks ketinggian Allah pada ayat sebelumnya, “membungkuk” mempertahankan gambaran puitis tentang Ia merendahkan diri tanpa menyiratkan kehinaan moral.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Infinitif konstruk dari ראה menyatakan tujuan; “untuk melihat” alami dalam bahasa Indonesia dan tetap dekat dengan makna sumber.
- source_word: בַּשָּׁמַיִם
  choice: langit
  rationale: שׁמים menunjuk pada ranah langit dan, dalam pasangan kosmis dengan bumi, paling alami diterjemahkan “langit” dalam bahasa Indonesia.
- source_word: וּבָאָרֶץ
  choice: dan bumi
  rationale: אָרֶץ merupakan pasangan terestrial bagi langit. Ungkapan “langit dan bumi” alami dan mempertahankan cakupan kosmis teks Ibrani.
theological_decisions:
- issue: Gambaran antropomorfis tentang ketinggian Allah dan tindakan-Nya merendah
  choice: Mempertahankan gambaran konkret dengan “membungkuk”.
  alternative: yang merendahkan diri untuk memandang
  rationale: Pilihan ini menjaga ketegangan puitis bahwa Allah yang mahatinggi membungkuk bahkan untuk melihat langit dan bumi, tanpa mengubahnya menjadi pernyataan abstrak seperti “memperhatikan”.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. Bentuk anak kalimat “yang …” dipertahankan karena ayat ini melanjutkan uraian tentang TUHAN dari konteks sebelumnya.
