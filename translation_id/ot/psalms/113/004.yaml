  text: רָ֖ם עַל כָּל גּוֹיִ֥ם יְהוָ֑ה עַ֖ל הַ/שָּׁמַ֣יִם כְּבוֹדֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/004.yaml
  text: Yahweh is high above all nations; his glory is above the heavens.
translation:
  language: id
  text: 'Yahweh tinggi di atas segala bangsa;

    kemuliaan-Nya di atas langit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָם
  choice: tinggi
  rationale: Kata sifat predikatif ini berarti ‘tinggi’ atau ‘ditinggikan’. ‘Tinggi’ alami dalam bahasa Indonesia dan mempertahankan gambaran vertikal yang disejajarkan dengan frasa berikutnya.
- source_word: עַל כָּל גּוֹיִם
  choice: di atas segala bangsa
  rationale: עַל di sini menyatakan ketinggian sekaligus keunggulan. Pilihan ini mempertahankan kesejajaran puitis dengan ‘mengatasi langit’ tanpa membatasinya hanya pada gagasan pemerintahan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עַל הַשָּׁמַיִם
  choice: mengatasi langit
  rationale: שָׁמַיִם dalam konteks puisi ini menunjuk pada langit atau alam surgawi. ‘Mengatasi langit’ menyampaikan bahwa kemuliaan Yahweh berada melampaui langit dan menghindari pengulangan yang kaku dalam bahasa Indonesia.
- source_word: כְּבוֹדוֹ
  choice: kemuliaan-Nya
  rationale: כָּבוֹד dapat berarti kemuliaan, kehormatan, atau keagungan. ‘Kemuliaan-Nya’ paling sesuai dengan konteks pujian dan tetap cukup luas secara makna.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. Susunan dua klausa dipertahankan untuk mencerminkan paralelisme Ibrani; ‘segala bangsa’ memberi nuansa mazmur yang luhur tetapi tetap mudah dipahami.
