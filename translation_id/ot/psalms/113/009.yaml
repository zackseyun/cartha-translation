- from: Ia memberi perempuan mandul sebuah rumah[a] dan menjadikannya ibu anak-anak yang bersukacita. Pujilah Yah![b]
  to: Ia membuat perempuan mandul menetap di rumah[a] sebagai ibu yang bersukacita atas anak-anaknya. Pujilah Yah![b]
  rationale: Revisi mengganti ungkapan yang berpotensi materialistik “memberi ... sebuah rumah” dengan “membuat ... menetap di rumah,” yang mencerminkan daya kausatif מוֹשִׁיבִי dan unsur “rumah” dalam teks. Frasa akhir ditata ulang agar “bersukacita” jelas menerangkan ibu, sambil mempertahankan hubungan puitis antara keibuan, anak-anak, dan sukacita. Penanda dan isi catatan kaki tetap selaras dengan kata yang dijelaskan.
