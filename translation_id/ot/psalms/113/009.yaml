  terminology: “Perempuan mandul,” “ibu,” dan “Pujilah Yah!” tepat untuk register dan istilah sumber. “Yah” mempertahankan bentuk pendek יָהּ, dan “Haleluya” tepat sebagai alternatif transliteratif dalam catatan kaki.
