  yaml_path: translation/ot/psalms/113/009.yaml
  text: He gives the barren woman a home[a], as a joyful mother of children[b]. Praise Yah!
translation:
  language: id
  text: Ia membuat perempuan mandul menetap di rumah[a] sebagai ibu yang bersukacita atas anak-anaknya. Pujilah Yah![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Ia membuat perempuan mandul tinggal di rumah.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini secara tradisional ditransliterasikan “Haleluya!”
    reason: alternative_reading
lexical_decisions:
- source_word: מֽוֹשִׁיבִי
  choice: Ia memberi ... sebuah rumah
  rationale: Bentuk partisip Hifil dari יׁשב menyatakan tindakan membuat seseorang tinggal atau menetap. Dalam bahasa Indonesia, ungkapan ini secara idiomatis menyampaikan bahwa Allah memberi tempat tinggal dan kedudukan dalam sebuah keluarga.
- source_word: עֲקֶרֶת
  choice: perempuan mandul
  rationale: Kata ini menunjuk kepada perempuan yang tidak mempunyai anak. Pilihan ini jelas, ringkas, dan sesuai dengan laras puitis tanpa memakai istilah medis yang terlalu klinis.
- source_word: הַבַּיִת
  choice: sebuah rumah
  rationale: Secara harfiah berarti 'rumah itu/rumah', tetapi dalam konteks ini mencakup gagasan tempat tinggal dan kehidupan rumah tangga. Bahasa Indonesia alami menggunakan 'sebuah rumah' untuk mengungkapkan pemberian tempat menetap.
- source_word: אֵם הַבָּנִים
  choice: ibu anak-anak
  rationale: בנים dapat berarti 'anak-anak lelaki' atau 'anak-anak' secara umum. Konteks menekankan perubahan dari kemandulan menjadi keibuan, bukan jenis kelamin anak-anak itu.
- source_word: שְׂמֵחָה
  choice: yang bersukacita
  rationale: Kata sifat ini menggambarkan sang ibu sebagai orang yang bergembira. 'Bersukacita' mempertahankan nada puitis dan luapan kegembiraannya.
- source_word: הַֽלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Ungkapan ini terdiri atas perintah jamak 'pujilah' dan bentuk singkat nama ilahi, Yah. Terjemahan ini mempertahankan bentuk dan daya ungkap bahasa Ibrani; 'Haleluya' merupakan transliterasi yang sudah lazim.
theological_decisions:
- issue: Penerjemahan bentuk singkat nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN; Haleluya
  rationale: Teks memakai bentuk singkat יָהּ, bukan tetragramaton יהוה. 'Yah' mempertahankan perbedaan bentuk tersebut, sedangkan 'Haleluya' dicantumkan sebagai bentuk liturgis tradisional.
- issue: Hubungan antara tindakan Allah, rumah, dan keibuan
  choice: Ia memberi ... sebuah rumah dan menjadikannya ibu anak-anak
  alternative: Ia membuat perempuan mandul tinggal di rumah sebagai ibu anak-anak
  rationale: Susunan Ibrani padat dan dapat dibaca sebagai satu gambaran tentang Allah yang menempatkan perempuan yang mandul dalam kehidupan rumah tangga sebagai ibu yang bersukacita. Rumusan ini menyampaikan kedua segi gambaran tanpa menentukan mekanismenya secara teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat dengan irama puitis yang ringkas. 'Mandul' dipertahankan sebagai istilah sastra yang langsung; 'bersukacita' menjaga nuansa pujian. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
