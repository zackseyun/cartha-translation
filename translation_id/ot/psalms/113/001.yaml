  text: הַ֥לְלוּ יָ֨הּ הַ֭לְלוּ עַבְדֵ֣י יְהוָ֑ה הַֽ֝לְלוּ אֶת שֵׁ֥ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
translation:
  language: id
  text: Pujilah Yah![a] Pujilah, hai hamba-hamba Yahweh; pujilah nama Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah berbunyi “Pujilah Yah,” dengan memakai bentuk pendek nama ilahi; dari ungkapan inilah berasal kata “Haleluya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak piel dari הלל, yaitu seruan langsung kepada sekelompok orang untuk memuji. “Pujilah” alami dalam bahasa Indonesia dan mempertahankan pengulangan imperatif dalam teks Ibrani.
- source_word: יָהּ
  choice: Yah
  rationale: Bentuk pendek nama ilahi. Transliterasi “Yah” mempertahankan perbedaannya dari יְהוָה yang muncul kemudian dan memperlihatkan unsur nama ilahi dalam seruan liturgis Ibrani.
- source_word: עַבְדֵי
  choice: hamba-hamba
  rationale: Bentuk jamak konstruksi dari עבד. “Hamba-hamba” mencakup gagasan orang-orang yang mengabdi dan menjadi milik tuannya, serta sesuai dengan sapaan kepada para penyembah dalam konteks mazmur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber diterjemahkan secara konsisten sebagai “Yahweh”, sambil tetap dibedakan dari bentuk pendek יָהּ, “Yah”.
- source_word: אֶת שֵׁם יְהוָה
  choice: nama Yahweh
  rationale: Ungkapan konstruksi Ibrani ini secara alami diterjemahkan “nama Yahweh” dan mempertahankan nama ilahi sebagai objek pujian.
theological_decisions:
- issue: Pembedaan יָהּ dan יְהוָה dalam ayat yang sama
  choice: Menerjemahkan יָהּ sebagai “Yah” dan יְהוָה sebagai “Yahweh”
  alternative: Menerjemahkan keduanya dengan gelar “TUHAN”, atau memakai bentuk “Yahweh” untuk keduanya
  rationale: Teks Ibrani sengaja memakai bentuk pendek dan bentuk lengkap nama ilahi. Pembedaan “Yah” dan “Yahweh” mempertahankan bentuk sumber tanpa mengaburkan hubungan keduanya.
- issue: Cakupan makna עֶבֶד dalam sapaan ibadah
  choice: hamba-hamba
  alternative: budak-budak atau pelayan-pelayan
  rationale: Istilah Ibrani dapat menunjuk pelayanan maupun status perhambaan. Dalam konteks seruan kepada para penyembah Yahweh, “hamba-hamba” mempertahankan kedua nuansa itu lebih baik dan tetap wajar serta bermartabat dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel sapaan “hai” membuat seruan kepada kelompok penyembah terdengar jelas dan alami. Pengulangan “pujilah” serta perbedaan antara “Yah” dan “Yahweh” dipertahankan.
