  text: לְ/הוֹשִׁיבִ֥י עִם נְדִיבִ֑ים עִ֝֗ם נְדִיבֵ֥י עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/008.yaml
  text: to seat him with nobles[b][a], with the nobles of his people.
translation:
  language: id
  text: untuk mendudukkan dia bersama para bangsawan[a], bersama para bangsawan dari umat-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pemuka” atau “para pangeran”; kata Ibrani ini menunjuk kepada orang-orang yang terpandang atau berkedudukan tinggi.'
    reason: lexical_alternative
  - marker: b
    text: Kata “-Nya” kemungkinan besar merujuk kepada TUHAN. Namun, secara tata bahasa, frasa ini juga dapat berarti “bersama para bangsawan dari bangsanya sendiri”, dengan “-nya” merujuk kepada orang miskin yang diangkat itu.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹשִׁיבִי
  choice: untuk mendudukkan dia
  rationale: Bentuk infinitif Hifil dari יׁשב menyatakan tujuan atau hasil dan mempertahankan makna kausatif, yaitu membuat orang miskin yang disebut pada ayat sebelumnya duduk pada kedudukan terhormat.
- source_word: עִם
  choice: bersama
  rationale: Kata ini secara langsung berarti 'dengan' atau 'bersama'. 'Bersama' alami dalam bahasa Indonesia dan mempertahankan gambaran duduk dalam persekutuan dengan orang-orang berkedudukan tinggi.
- source_word: נְדִיבִים / נְדִיבֵי
  choice: para bangsawan
  rationale: Dalam konteks kedudukan sosial, נָדִיב dapat menunjuk kepada orang terpandang atau berkedudukan tinggi. 'Para bangsawan' menyampaikan status tersebut tanpa secara khusus membatasi maknanya pada putra raja.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עַם berarti suatu umat atau kelompok bangsa. Dalam konteks mazmur tentang tindakan TUHAN, 'umat-Nya' merupakan ungkapan Indonesia yang wajar; huruf kapital menandai bahwa akhiran orang ketiga dipahami merujuk kepada TUHAN.
theological_decisions:
- issue: Rujukan akhiran 'nya' dalam עַמּוֹ
  choice: '''Nya'' dipahami merujuk kepada TUHAN: ''umat-Nya''.'
  alternative: '''nya'' dapat merujuk kepada orang miskin yang diangkat itu: ''bangsawan dari bangsanya sendiri''.'
  rationale: Secara tata bahasa, kedua rujukan mungkin. Namun, TUHAN adalah pelaku utama dalam rangkaian ayat 7–8 dan menjadi rujukan yang lebih mungkin dalam konteks. Kemungkinan lain tetap dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'bersama para bangsawan' dipertahankan untuk mencerminkan paralelisme dan penekanan teks Ibrani. Frasa ini meneruskan tujuan tindakan pada ayat sebelumnya, sehingga diawali dengan 'untuk'.
