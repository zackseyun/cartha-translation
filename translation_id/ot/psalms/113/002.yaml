  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהִ֤י שֵׁ֣ם יְהוָ֣ה מְבֹרָ֑ךְ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/002.yaml
  text: May the name of Yahweh be blessed from now and forever[a].
translation:
  language: id
  text: Kiranya nama Yahweh diberkati mulai sekarang dan selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah nama Yahweh diberkati.”
    reason: Alternatif ini mempertahankan kemungkinan nuansa seruan atau ajakan pada bentuk jussif יְהִי.
lexical_decisions:
- source_word: יְהִי
  choice: Kiranya ... diberkati
  rationale: Bentuk jussif Qal dari היה di sini menyatakan harapan atau seruan. “Kiranya” menyampaikan daya benediktif itu secara alami dalam bahasa Indonesia tanpa menjadikannya pernyataan indikatif biasa.
- source_word: שֵׁם
  choice: nama
  rationale: Padanan langsung ini mempertahankan pemakaian Ibrani yang menunjuk kepada pribadi dan reputasi sebagaimana diwakili oleh namanya, tanpa menambahkan penafsiran ke dalam teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: מְבֹרָךְ
  choice: diberkati
  rationale: Partisipel pasif dari ברך secara harfiah berarti “diberkati”. Pilihan ini mempertahankan bahasa berkat dalam mazmur; “dipuji” berkaitan secara kontekstual tetapi kurang tepat secara leksikal.
- source_word: מֵעַתָּה
  choice: mulai sekarang
  rationale: Ungkapan ini menunjuk kepada saat kini sebagai titik awal. “Mulai sekarang” alami dalam bahasa Indonesia dan mempertahankan daya temporalnya.
- source_word: וְעַד עוֹלָם
  choice: dan selama-lamanya
  rationale: Konstruksi ini menyatakan kelangsungan tanpa akhir. “Dan selama-lamanya” merupakan ungkapan Indonesia yang jelas, wajar, dan sesuai dengan gaya mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa; TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa jussif יְהִי
  choice: Kiranya nama Yahweh diberkati
  alternative: Biarlah nama Yahweh diberkati
  rationale: Bentuk Ibrani dapat dipahami sebagai harapan benediktif atau seruan. Teks utama memakai “kiranya” karena sesuai dengan nada berkat, sedangkan catatan kaki mempertahankan kemungkinan nuansa ajakan atau seruan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Ungkapan “selama-lamanya” dipilih karena alami dalam ragam puitis Alkitab tanpa terasa usang.
