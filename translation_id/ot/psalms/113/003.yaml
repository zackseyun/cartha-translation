  text: מִ/מִּזְרַח שֶׁ֥מֶשׁ עַד מְבוֹא֑/וֹ מְ֝הֻלָּ֗ל שֵׁ֣ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/003.yaml
  text: From the rising of the sun to its setting[b][a], the name of Yahweh is to be praised.
translation:
  language: id
  text: Dari terbitnya matahari sampai terbenamnya[a], nama Yahweh[b] patut dipuji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dari timur sampai ke barat”; secara harfiah, “dari terbitnya matahari sampai masuknya.”
    reason: lexical_alternative
  - marker: b
    text: Ibrani YHWH, yang secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: dari terbitnya matahari
  rationale: מִזְרַח dapat menunjuk pada timur atau terbitnya matahari. Bersama שֶׁמֶשׁ dan dalam kesejajaran dengan מְבוֹאוֹ, ungkapan temporal-kosmis ini paling wajar diterjemahkan sebagai “dari terbitnya matahari”.
- source_word: עַד מְבוֹאוֹ
  choice: sampai terbenamnya
  rationale: מְבוֹאוֹ secara harfiah berarti ‘sampai masuknya’, dengan akhiran orang ketiga tunggal yang merujuk pada matahari. “Sampai terbenamnya” menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: מְהֻלָּל
  choice: patut dipuji
  rationale: Partisipel pasif ini dapat berarti ‘dipuji’ atau ‘layak dipuji’. “Patut dipuji” mempertahankan daya pernyataan umum sekaligus nuansa ajakan tanpa mengubahnya menjadi perintah langsung.
- source_word: שֵׁם
  choice: nama
  rationale: Diterjemahkan secara langsung agar kekayaan maknanya—nama, reputasi, dan jati diri yang dinyatakan dalam penyembahan—tetap terbuka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi YHWH. “Yahweh” mempertahankannya sebagai nama diri, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Daya makna מְהֻלָּל
  choice: patut dipuji
  alternative: dipuji atau terpujilah
  rationale: Pilihan ini menjaga ketegangan antara pernyataan deskriptif dan tuntutan normatif. “Terpujilah” akan membuatnya terdengar lebih tegas sebagai seruan langsung daripada bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. Pasangan “terbitnya matahari—terbenamnya” mempertahankan merisme puitis Ibrani, sedangkan “patut dipuji” menyampaikan daya umum dan normatif partisipel pasif.
