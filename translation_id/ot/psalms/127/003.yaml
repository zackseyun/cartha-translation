source:
  edition: WLC
  text: הִנֵּ֤ה נַחֲלַ֣ת יְהוָ֣ה בָּנִ֑ים שָׂ֝כָ֗ר פְּרִ֣י הַ/בָּֽטֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/003.yaml
  text: Behold[a], children are a heritage from Yahweh, the fruit of the womb a reward.
translation:
  language: id
  text: Sungguh, anak-anak adalah warisan dari Yahweh[a]; buah kandungan adalah ganjaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anak-anak adalah warisan Yahweh.”
    reason: Frasa konstruksi Ibrani dapat dipahami sebagai penunjuk sumber ('warisan dari Yahweh') atau kepunyaan ('warisan Yahweh').
lexical_decisions:
- source_word: הִנֵּה
  choice: Sungguh
  rationale: Menandai seruan yang mengarahkan perhatian sekaligus menegaskan pernyataan; bentuk ini alami dan tetap puitis dalam bahasa Indonesia modern.
- source_word: נַחֲלַת יְהוָה
  choice: warisan dari Yahweh
  rationale: Frasa konstruksi ini dapat menyatakan sumber atau kepunyaan. Dalam kesejajaran dengan 'ganjaran', makna sumber—warisan yang berasal dari Yahweh—paling sesuai, sedangkan kemungkinan makna kepunyaan dipertahankan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בָּנִים
  choice: anak-anak
  rationale: Walaupun bentuk Ibraninya maskulin jamak, konteksnya menunjuk kepada keturunan secara umum, bukan hanya anak laki-laki.
- source_word: שָׂכָר
  choice: ganjaran
  rationale: Menyampaikan makna hadiah atau balasan positif dalam kesejajaran dengan 'warisan' tanpa sekuat 'upah' dalam menyiratkan transaksi kerja.
- source_word: פְּרִי הַבָּטֶן
  choice: buah kandungan
  rationale: Mempertahankan metafora Ibrani bagi keturunan dalam ungkapan puitis yang lazim dan mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna frasa konstruksi נַחֲלַת יְהוָה
  choice: anak-anak adalah warisan dari Yahweh
  alternative: anak-anak adalah milik pusaka Yahweh
  rationale: Kesejajaran dengan 'buah kandungan adalah ganjaran' mendukung pemahaman bahwa anak-anak merupakan pemberian yang berasal dari Yahweh. Namun, tata bahasa Ibrani juga memungkinkan makna bahwa anak-anak adalah kepunyaan atau milik pusaka Yahweh; ambiguitas itu dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas, khidmat, dan puitis. 'Sungguh' menghindari kekakuan 'Lihatlah', sementara 'buah kandungan' mempertahankan citraan asli. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang memiliki pembacaan alternatif.
