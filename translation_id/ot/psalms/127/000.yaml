  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/000.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor over it in vain. Unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: id
  text: 'Nyanyian ziarah. Dari Salomo.[a]


    Jika Yahweh tidak membangun sebuah rumah,[b]

    sia-sia para pembangunnya berjerih lelah membangunnya.


    Jika Yahweh tidak menjaga sebuah kota,

    sia-sia seorang penjaga berjaga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk Salomo,” “Mengenai Salomo,” atau “Milik Salomo.” Judul Ibrani dapat menunjukkan kepengarangan, peruntukan, atau keterkaitan.
    reason: alternative_reading
  - marker: b
    text: Dalam bahasa Ibrani, “rumah” juga dapat berarti “keluarga” atau “wangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Secara harfiah berarti “nyanyian pendakian.” Dalam konteks kumpulan Mazmur 120–134, “ziarah” menyampaikan secara alami kaitannya dengan perjalanan naik menuju Yerusalem, tanpa memastikan secara mutlak latar penggunaannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar umum “Tuhan”.
- source_word: בַיִת
  choice: rumah
  rationale: Padanan dasar dan konkret dalam konteks pembangunan; kemungkinan arti lebih luas seperti keluarga atau wangsa dipertahankan dalam catatan kaki.
- source_word: עָמְלוּ
  choice: bekerja keras
  rationale: Menangkap nuansa kerja berat atau jerih payah, bukan sekadar kegiatan bekerja.
- source_word: שָׁקַד
  choice: tetap berjaga
  rationale: Dalam konteks penjaga kota, kata ini menyatakan kewaspadaan dan tetap terjaga dengan tekun.
theological_decisions:
- issue: Hubungan frasa לִשְׁלֹמֹה dengan Salomo
  choice: Dari Salomo
  alternative: Untuk Salomo / Mengenai Salomo / Milik Salomo
  rationale: “Dari Salomo” merupakan pembacaan judul yang wajar, tetapi preposisi Ibrani tidak dengan sendirinya memastikan kepengarangan; alternatif dicatat agar ambiguitas asli tidak dihapus.
- issue: Cakupan makna “rumah”
  choice: rumah sebagai bangunan dalam teks utama
  alternative: keluarga atau wangsa
  rationale: Kesejajaran dengan kegiatan membangun mendukung arti bangunan, tetapi pemakaian Ibrani memungkinkan gema keluarga atau wangsa, yang dicatat tanpa menjadikannya tafsiran wajib.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur paralel kedua baris dipertahankan dengan pengulangan “Jika Yahweh tidak … sia-sialah …”. Istilah tradisional “nyanyian ziarah” dipilih demi keterpahaman, sementara nuansa harfiah pendakian dijelaskan dalam keputusan leksikal.
