id: PSA.127.2
reference: Psalms 127:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׁ֤וְא לָ/כֶ֨ם מַשְׁכִּ֪ימֵי ק֡וּם מְאַֽחֲרֵי שֶׁ֗בֶת אֹ֭כְלֵי לֶ֣חֶם הָ/עֲצָבִ֑ים כֵּ֤ן יִתֵּ֖ן לִֽ/ידִיד֣/וֹ שֵׁנָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/002.yaml
  text: It is in vain for you to rise early[a], to sit up late, eating the bread of toil; for he gives sleep to his beloved.
translation:
  language: id
  text: Sia-sialah kamu bangun pagi-pagi dan duduk sampai larut, sambil memakan roti jerih payah, sebab Ia memberikan tidur kepada orang yang dikasihi-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “demikianlah Ia memberi kepada orang yang dikasihi-Nya pada waktu tidur,” atau “Ia memberi kepada orang yang dikasihi-Nya sementara orang itu tidur.” Susunan bahasa Ibraninya padat dan dapat berarti bahwa Allah memberikan tidur itu sendiri atau bahwa Ia memberikan karunia-karunia-Nya bahkan ketika orang yang dikasihi-Nya sedang tidur.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁוְא
  choice: sia-sialah
  rationale: Menyatakan kesia-siaan atau tidak bergunanya usaha yang digambarkan, sekaligus mempertahankan penekanan predikatif pada awal ayat.
- source_word: מַשְׁכִּימֵי קוּם
  choice: bangun pagi-pagi
  rationale: Mengungkapkan tindakan bangun sangat pagi dengan ungkapan Indonesia yang alami.
- source_word: מְאַחֲרֵי שֶׁבֶת
  choice: duduk sampai larut
  rationale: Mempertahankan gambaran harfiah tentang duduk sekaligus menyampaikan maksud memperpanjang pekerjaan hingga larut; 'begadang' akan lebih interpretatif dan menghilangkan citra duduk.
- source_word: אֹכְלֵי לֶחֶם הָעֲצָבִים
  choice: sambil memakan roti jerih payah
  rationale: Mempertahankan metafora 'memakan roti' dan memakai 'jerih payah' untuk cakupan makna עֲצָבִים yang meliputi kerja berat, kepedihan, dan kecemasan tanpa membatasinya pada satu emosi.
- source_word: כֵּן
  choice: sebab
  rationale: Dalam konteks ini memperkenalkan dasar bagi pernyataan bahwa jerih payah yang cemas itu sia-sia. Pilihan ini menghasilkan hubungan logis yang jelas dalam bahasa Indonesia, sementara kemungkinan konstruksi lain pada seluruh klausa dijaga dalam catatan kaki.
- source_word: יִתֵּן
  choice: Ia memberikan
  rationale: Bentuk kini menyampaikan kebenaran umum; subjek tersirat merujuk kepada TUHAN dalam konteks mazmur.
- source_word: לִידִידוֹ
  choice: kepada orang yang dikasihi-Nya
  rationale: Mempertahankan bentuk tunggal dan nuansa kasih, dengan susunan yang alami dan jelas dalam bahasa Indonesia.
- source_word: שֵׁנָא
  choice: tidur
  rationale: Nomina ini secara langsung berarti 'tidur'. Dalam teks utama dipahami sebagai objek dari 'memberikan', sedangkan kemungkinan fungsi adverbialnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Sintaks padat כֵּן יִתֵּן לִידִידוֹ שֵׁנָא
  choice: sebab Ia memberikan tidur kepada orang yang dikasihi-Nya
  alternative: 'atau: “demikianlah Ia memberi kepada orang yang dikasihi-Nya pada waktu tidur,” atau “Ia memberi kepada orang yang dikasihi-Nya sementara orang itu tidur”'
  rationale: Bahasa Ibrani memungkinkan שֵׁנָא dipahami sebagai objek langsung ('memberikan tidur') atau secara adverbial ('memberi pada waktu tidur/sementara ia tidur'). Teks utama memakai pembacaan yang paling alami dan sesuai dengan kontras antara usaha yang mencemaskan dan pemberian Allah, tetapi catatan kaki mempertahankan ambiguitas aslinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'duduk sampai larut' sengaja mempertahankan citra Ibrani, sedangkan 'roti jerih payah' menjaga metafora sumber tanpa terdengar terlalu teknis. Huruf kapital pada 'Ia' dan enklitik '-Nya' menandai rujukan kepada Allah sesuai kebiasaan penulisan religius Indonesia.
