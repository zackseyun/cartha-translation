  naturalness: “Penjaga tetap terjaga” terdengar janggal dalam bahasa Indonesia modern dan dapat terbaca sekadar sebagai keadaan, bukan tindakan berjaga. “Penjaga berjaga-jaga dengan sia-sia” lebih alami dan mempertahankan pengulangan kesia-siaan.
  terminology: “Yahweh,” “rumah,” “kota,” dan “Salomo” tepat. “Nyanyian ziarah” dapat dipertahankan sebagai judul koleksi yang lazim; catatan kaki perlu menyebut alternatif harfiahnya tanpa mengunci penjelasan historis sebagai satu-satunya makna.
