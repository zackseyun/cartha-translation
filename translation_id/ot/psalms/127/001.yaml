  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/001.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor in vain; unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: id
  text: 'Nyanyian ziarah.[a] Dari Salomo.[b]


    Jika Yahweh tidak membangun rumah,[c]

    para pembangunnya bekerja keras dengan sia-sia;

    jika Yahweh tidak menjaga kota,

    penjaga berjaga-jaga dengan sia-sia.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Nyanyian Pendakian.” Ungkapan ini adalah judul kumpulan mazmur dan dapat dikaitkan dengan perjalanan naik para peziarah ke Yerusalem.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “Untuk Salomo” atau “Milik Salomo”; judul Ibrani dapat menunjukkan kepengarangan, peruntukan, kepemilikan, atau hubungan.
    reason: alternative_reading
  - marker: c
    text: Dalam pemakaian Ibrani, “rumah” juga dapat berarti rumah tangga, keluarga, atau wangsa.
    reason: lexical_alternative
  - marker: d
    text: Secara lebih harfiah, “penjaga berjaga-jaga dengan sia-sia.”
    reason: literal_rendering
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Ungkapan ini merupakan judul baku kumpulan Mazmur 120–134. 'Ziarah' menyampaikan konteks perjalanan naik menuju Yerusalem secara wajar dalam bahasa Indonesia, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: לִשְׁלֹמֹה
  choice: Dari Salomo
  rationale: Bentuk singkat yang lazim untuk judul mazmur. Karena preposisi לְ dapat menandai kepengarangan, peruntukan, kepemilikan, atau hubungan, kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: אִם ... לֹא
  choice: Jika bukan ... yang
  rationale: Konstruksi ini mengungkapkan syarat negatif secara alami dalam bahasa Indonesia sekaligus menonjolkan bahwa keberhasilan bergantung pada tindakan Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: יִבְנֶה בַיִת
  choice: membangun rumah itu
  rationale: Mempertahankan gambaran konkret tentang pembangunan rumah yang berpadanan dengan penjagaan kota. Kata 'rumah' dapat memiliki cakupan lebih luas, yang dicatat dalam catatan kaki.
- source_word: שָׁוְא
  choice: sia-sialah
  rationale: Menyampaikan kesia-siaan atau ketidakberhasilan usaha dan mengulang bentuk yang sama pada kedua larik untuk menjaga paralelisme.
- source_word: עָמְלוּ בֹנָיו בּוֹ
  choice: jerih payah para pembangunnya
  rationale: Ungkapan nominal ini secara alami menyampaikan kerja berat para pembangun dalam bahasa Indonesia. Unsur pronominal בּוֹ tersirat oleh 'para pembangunnya' dan dijelaskan secara harfiah dalam catatan kaki.
- source_word: יִשְׁמָר עִיר
  choice: menjaga kota itu
  rationale: Kata kerja שׁמר di sini menunjukkan penjagaan yang melindungi dan membentuk hubungan leksikal alami dengan 'penjaga'.
- source_word: שָׁקַד שׁוֹמֵר
  choice: penjaga tetap terjaga
  rationale: Mempertahankan gambaran harfiah tentang penjaga yang terus bangun dan waspada, serta menghasilkan permainan bunyi yang alami antara 'penjaga' dan 'terjaga'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan makna בַיִת
  choice: rumah
  alternative: rumah tangga atau wangsa
  rationale: Kesejajaran dengan kota dan penjaga mendukung gambaran konkret sebuah bangunan, tetapi kemungkinan makna keluarga atau wangsa tidak disingkirkan dan dicatat dalam catatan kaki.
- issue: Hubungan Salomo dengan mazmur dalam לִשְׁלֹמֹה
  choice: Dari Salomo
  alternative: Untuk Salomo atau Milik Salomo
  rationale: Preposisi Ibrani tidak dengan sendirinya memastikan apakah Salomo adalah pengarang, penerima, pemilik, atau tokoh yang dikaitkan dengan mazmur. Ambiguitas ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Paralelisme kedua bagian dipertahankan melalui pengulangan 'Jika bukan Yahweh yang ...' dan 'sia-sialah ...'. Pilihan 'penjaga tetap terjaga' menjaga gambaran kewaspadaan sekaligus terdengar alami.
