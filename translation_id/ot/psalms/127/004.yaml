  text: Like arrows in the hand of a warrior[a], so are the sons of one's youth.
translation:
  language: id
  text: Seperti anak-anak panah di tangan seorang prajurit, demikianlah anak-anak lelaki yang lahir pada masa muda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki dari masa muda”; maksudnya, anak-anak lelaki yang lahir ketika seseorang masih muda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/חִצִּים
  choice: Seperti anak-anak panah
  rationale: חִצִּים adalah bentuk jamak dari חֵץ, istilah biasa untuk anak panah; כְּ mempertahankan bentuk perbandingan dengan “seperti”.
- source_word: בְּ/יַד
  choice: di tangan
  rationale: Ungkapan ini secara harfiah dan idiomatis menunjuk pada anak panah yang berada dalam genggaman serta kendali seseorang.
- source_word: גִּבּוֹר
  choice: seorang prajurit
  rationale: Dalam gambaran peperangan dengan anak panah, גִּבּוֹר menunjuk pada orang kuat atau gagah yang berperang. “Prajurit” jelas dan alami dalam bahasa Indonesia tanpa konotasi feodal dari “kesatria” atau arti luas “pahlawan”.
- source_word: כֵּן
  choice: demikianlah
  rationale: כֵּן memperkenalkan sisi kedua perbandingan; “demikianlah” mempertahankan struktur amsal yang ringkas dan bermartabat.
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Bentuk jamak maskulin ini secara eksplisit berarti “anak-anak lelaki/putra-putra”; pilihan ini mempertahankan penandaan gender dalam teks Ibrani.
- source_word: הַ/נְּעוּרִים
  choice: yang lahir pada masa muda
  rationale: Secara leksikal berarti “masa muda”; dalam konstruksi ini ungkapan tersebut menunjuk pada anak-anak lelaki yang diperoleh atau dilahirkan ketika seseorang masih muda. “Yang lahir pada masa muda” menyampaikan maksud itu secara alami.
theological_decisions:
- issue: Cakupan gender dalam בְּנֵי הַנְּעוּרִים
  choice: anak-anak lelaki yang lahir pada masa muda
  alternative: anak-anak yang lahir pada masa muda
  rationale: Teks Ibrani memakai bentuk maskulin dan dalam konteks sosial mazmur ini kemungkinan memang menyoroti anak-anak lelaki. Terjemahan tidak memperluasnya secara diam-diam menjadi ungkapan netral gender.
- issue: Pemilik atau acuan “masa muda”
  choice: tidak menyebut pemilik secara eksplisit dalam teks utama
  alternative: anak-anak lelaki yang lahir pada masa mudanya
  rationale: Bahasa Ibrani tidak menyertakan pronomina posesif eksplisit. Susunan Indonesia mempertahankan keterbukaan gramatikal itu, sedangkan catatan menjelaskan makna idiomatis yang paling mungkin.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada amsal. Pengulangan “anak-anak” dalam “anak-anak panah” dan “anak-anak lelaki” wajar dalam bahasa Indonesia serta membantu mempertahankan kesejajaran puitis.
