  text: אַשְׁרֵ֤י הַ/גֶּ֗בֶר אֲשֶׁ֤ר מִלֵּ֥א אֶת אַשְׁפָּת֗/וֹ מֵ֫/הֶ֥ם לֹֽא יֵבֹ֑שׁוּ כִּֽי יְדַבְּר֖וּ אֶת אוֹיְבִ֣ים בַּ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/005.yaml
  text: Blessed is the man who fills his quiver with them[c][b][a]; they will not be put to shame when they speak with enemies in the gate.
translation:
  language: id
  text: Berbahagialah laki-laki yang mengisi penuh tabung panahnya dengan mereka. Mereka tidak akan dipermalukan[a] ketika berbicara dengan musuh-musuh[b] di pintu gerbang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka tidak akan mendapat malu.” Sebagian memahami subjeknya hanya sebagai sang ayah dan menerjemahkan, “ia tidak akan dipermalukan.” Kata kerja dalam bahasa Ibrani berbentuk jamak.
    reason: alternative_reading
  - marker: b
    text: Atau “ketika mereka menghadapi musuh-musuh dalam perdebatan” atau “ketika mereka mengajukan perkara melawan musuh-musuh.” Dalam konteks ini, kata kerja tersebut dapat bernuansa hukum atau pertentangan.
    reason: lexical_alternative
  - marker: c
    text: Pintu gerbang kota pada zaman dahulu merupakan tempat peradilan dan urusan kemasyarakatan.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk ini memperkenalkan ucapan bahagia atau berkat dengan nada hikmat yang luhur; lebih sesuai daripada ungkapan yang hanya menunjuk pada perasaan senang.
- source_word: הַגֶּבֶר
  choice: laki-laki
  rationale: Kata Ibrani ini maskulin dan dalam konteks menunjuk kepada ayah yang anak-anaknya digambarkan sebagai anak panah. Pilihan ini mempertahankan acuan gender teks sumber.
- source_word: מִלֵּא
  choice: memenuhi
  rationale: Verba ini menggambarkan tabung panah yang dibuat penuh. Bentuk kini cocok dengan sifat umum ucapan bahagia ini.
- source_word: אַשְׁפָּתוֹ
  choice: tabung panahnya
  rationale: Istilah ini menunjuk pada wadah untuk menyimpan anak panah. 'Tabung panah' jelas dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: מֵהֶם
  choice: dengan mereka
  rationale: Preposisi ini menyatakan isi tabung panah dan mengacu kembali kepada anak-anak yang disamakan dengan anak panah pada ayat sebelumnya. Terjemahan ini mempertahankan kaitan metaforis tersebut.
- source_word: לֹא יֵבֹשׁוּ
  choice: Mereka tidak akan dipermalukan
  rationale: Kata kerja ini dapat menyatakan dipermalukan atau mendapat malu di hadapan umum. Bentuk jamak dalam teks Ibrani dipertahankan.
- source_word: כִּי
  choice: ketika
  rationale: Dalam konteks ini, partikel tersebut memperkenalkan keadaan saat mereka tidak akan dipermalukan.
- source_word: יְדַבְּרוּ
  choice: berbicara
  rationale: Makna dasarnya adalah berbicara, tetapi dalam latar hukum atau perselisihan dapat berarti berdebat atau mengajukan perkara. Teks utama mempertahankan keluasan maknanya.
- source_word: אֶת אוֹיְבִים
  choice: dengan musuh-musuh
  rationale: Konstruksi ini menunjuk kepada pihak yang diajak bicara atau dihadapi. 'Dengan' tidak mempersempit maknanya menjadi satu jenis pertikaian tertentu.
- source_word: בַּשָּׁעַר
  choice: di pintu gerbang
  rationale: Pintu gerbang kota merupakan tempat urusan hukum dan kemasyarakatan dilakukan. Frasa ini mempertahankan latar budaya teks.
theological_decisions:
- issue: Bahasa representatif bergender
  choice: laki-laki
  alternative: orang; orang yang demikian
  rationale: Teks Ibrani secara gramatikal maskulin dan dalam konteks mengacu kepada seorang ayah. Terjemahan tidak menetralkan acuan itu.
- issue: Subjek jamak pada לֹא יֵבֹשׁוּ dan יְדַבְּרוּ
  choice: Mereka tidak akan dipermalukan ... ketika berbicara
  alternative: Ia tidak akan dipermalukan ... ketika berbicara
  rationale: Kedua verba dalam teks Masoret berbentuk jamak, yang mungkin mengacu kepada ayah bersama anak-anaknya atau kepada keluarga secara kolektif. Teks utama mempertahankan bentuk jamak dan tidak menyelesaikan ketegangan itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora tabung panah, acuan maskulin, bentuk verba jamak, serta kemungkinan nuansa hukum pada adegan di pintu gerbang.
