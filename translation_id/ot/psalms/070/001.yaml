  text: אֱלֹהִ֥ים לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָֽׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/001.yaml
  text: O God[a], deliver me; O Yahweh, hurry to help me.
translation:
  language: id
  text: Ya Allah, lepaskanlah aku! Ya Yahweh, segeralah menolong aku!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Kata ini merupakan sapaan langsung dalam doa. Partikel “Ya” menyatakan seruan secara alami dalam bahasa Indonesia.
- source_word: לְהַצִּילֵנִי
  choice: lepaskanlah aku
  rationale: Bentuk Hifil dari נצל memohon agar pemazmur dilepaskan atau diselamatkan dari bahaya. “Lepaskanlah aku” mempertahankan konteks pertolongan konkret tanpa mempersempitnya menjadi keselamatan rohani.
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Teks Ibrani memakai nama ilahi יהוה. Bentuk “Yahweh” mempertahankan nama diri itu, sedangkan “Ya” menandai sapaan langsung.
- source_word: לְעֶזְרָתִי
  choice: menolong aku
  rationale: Ungkapan dengan ל dan עֶזְרָה menyatakan tindakan datang untuk memberi pertolongan. Bentuk verbal ini paling alami dalam bahasa Indonesia modern.
- source_word: חוּשָׁה
  choice: segeralah
  rationale: Permohonan imperatif ini menekankan tindakan yang mendesak. “Segeralah” terdengar wajar dan bermartabat dalam doa.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Karena teks sumber secara langsung memakai nama diri יהוה, transliterasi “Yahweh” mempertahankan pembedaan antara nama ini dan gelar אֱלֹהִים (“Allah”) yang juga muncul dalam ayat yang sama.
translation_notes:
  register: Bahasa doa yang ringkas, mendesak, dan puitis. Pengulangan sapaan “Ya” mempertahankan struktur paralel Ibrani, sementara dua kalimat seru menyampaikan urgensi permohonan secara alami dalam bahasa Indonesia modern.
