base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: id
  text: Biarlah orang-orang yang mengincar nyawaku menjadi malu dan terhina[a]; biarlah orang-orang yang bergembira atas kecelakaanku mundur dan mendapat aib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “orang-orang yang mencari jiwaku.” Di sini “jiwa” (נפשׁ) merupakan ungkapan untuk nyawa atau diri seseorang, khususnya dalam konteks ancaman terhadap hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: mendapat malu
  rationale: Kata בוש menyatakan pengalaman dipermalukan atau mendapat malu; bentuk “biarlah” mempertahankan daya permohonan atau harapan dalam konteks mazmur.
- source_word: וְיַחְפְּרוּ
  choice: dan dipermalukan
  rationale: Kata חפר dalam bentuk ini menyatakan keadaan terhina atau dipermalukan. Pilihan ini mempertahankan penguatan dari verba sebelumnya tanpa meleburkan keduanya.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: orang-orang yang mengincar nyawaku
  rationale: נפשׁ di sini secara idiomatis menunjuk pada nyawa atau hidup pemazmur dalam konteks ancaman. “Mengincar nyawaku” alami dalam bahasa Indonesia dan menyampaikan maksud permusuhan.
- source_word: יִסֹּגוּ אָחוֹר
  choice: mundur
  rationale: Gabungan סוג dan אחור menyatakan berbalik atau mundur; “mundur” ringkas dan alami serta mempertahankan gambaran kekalahan.
- source_word: וְיִכָּלְמוּ
  choice: dan mendapat aib
  rationale: כלם berkaitan dengan malu, kehinaan, atau aib. “Mendapat aib” mempertahankan dimensi kehormatan publik dan menghindari pengulangan ungkapan yang sama.
- source_word: חֲפֵצֵי רָעָתִי
  choice: orang-orang yang senang melihat aku celaka
  rationale: חפץ dapat berarti menginginkan atau menyukai, sedangkan רעה dengan sufiks orang pertama menunjuk pada malapetaka yang menimpa pemazmur, bukan kejahatan moral miliknya. Frasa ini menyampaikan kesenangan jahat mereka secara alami.
theological_decisions:
- issue: Daya jusif/imprekatoris dalam rangkaian verba
  choice: Diterjemahkan sebagai permohonan atau harapan dengan “Biarlah ...”
  alternative: 'Diterjemahkan sebagai pernyataan masa depan: “Mereka akan ...”'
  rationale: Dalam konteks doa mazmur, bentuk-bentuk imperfek ini paling wajar berfungsi sebagai permohonan imprekatoris, bukan ramalan sederhana. “Biarlah” mempertahankan daya tersebut tanpa menambah kepastian yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. “Mengincar nyawaku” dipilih sebagai padanan idiomatis yang jelas, sedangkan rangkaian “mendapat malu,” “dipermalukan,” dan “mendapat aib” mempertahankan tiga istilah Ibrani yang saling berdekatan tanpa terdengar sepenuhnya berulang.
