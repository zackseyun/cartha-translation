base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: id
  text: Namun aku ini miskin dan berkekurangan; ya Allah, segeralah datang kepadaku.[a] Engkaulah pertolonganku dan pembebasku; ya Yahweh, jangan menunda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “bersegeralah kepadaku”; atau, “bersegeralah bagiku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku ini
  rationale: Konjungsi dan pronomina menandai peralihan kontras kepada keadaan pemazmur sendiri. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: עָנִי וְאֶבְיוֹן
  choice: miskin dan berkekurangan
  rationale: Pasangan istilah ini menggambarkan orang yang rendah keadaannya dan sangat membutuhkan pertolongan. Pilihan ini mempertahankan dua unsur tanpa pengulangan yang kaku.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung; partikel 'ya' menyampaikan bentuk vokatif secara wajar dalam bahasa Indonesia.
- source_word: חוּשָׁה לִי
  choice: segeralah datang kepadaku
  rationale: Imperatif menyatakan permohonan mendesak. Kata 'datang' tersirat agar konstruksi dengan 'kepadaku' alami dalam bahasa Indonesia, sedangkan kemungkinan arti 'bertindaklah segera bagiku' dicatat dalam catatan kaki.
- source_word: עֶזְרִי
  choice: pertolonganku
  rationale: Nomina עֵזֶר menunjuk pada pertolongan atau bantuan. Bentuk ini mempertahankan struktur predikatif teks dan selaras dengan nomina berikutnya.
- source_word: וּמְפַלְטִי
  choice: dan pembebasku
  rationale: Bentuk dari akar פלט menunjuk kepada pribadi yang membuat seseorang luput atau selamat. 'Pembebasku' ringkas dan mempertahankan nuansa penyelamatan.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Pronomina yang ditekankan paling alami diungkapkan dengan '-lah', sehingga penegasan bahwa Allah adalah pertolongan dan pembebas pemazmur tetap terdengar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri sebagaimana terdapat dalam teks Ibrani, bukan diganti dengan gelar.
- source_word: אַל תְּאַחַר
  choice: jangan berlambat
  rationale: Larangan ini memohon agar Allah tidak menunda tindakan. Pilihan tersebut alami, ringkas, dan mempertahankan nada mendesak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Identifikasi Allah sebagai pertolongan dan pembebas
  choice: Engkaulah pertolonganku dan pembebasku
  alternative: Engkaulah penolong dan penyelamatku
  rationale: 'Terjemahan utama mempertahankan perbedaan bentuk Ibrani: עֵזֶר adalah nomina abstrak ''pertolongan'', sedangkan מְפַלֵּט menunjuk kepada pelaku yang membebaskan. Ini juga menjaga ketegangan puitis tanpa menyeragamkan kedua sebutan.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan 'ya Allah' dan 'ya Yahweh' mempertahankan nada doa yang mendesak. Istilah 'berkekurangan' dipilih agar mudah dipahami tanpa menghilangkan kesejajaran puitis.
