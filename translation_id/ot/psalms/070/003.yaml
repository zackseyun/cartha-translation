lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Biarlah mereka mundur
  rationale: Bentuk Qal imperfek orang ketiga jamak dipakai dengan daya volitif atau kutukan. “Biarlah mereka mundur” mempertahankan seruan agar mereka menarik diri, tanpa mengubah bentuknya menjadi pasif.
- source_word: עַל עֵקֶב
  choice: karena
  rationale: Ungkapan ini menyatakan sebab atau akibat. “Karena” merupakan padanan Indonesia yang alami dan ringkas; terjemahan harfiah yang melibatkan “tumit” akan mengaburkan idiom Ibraninya.
- source_word: בָּשְׁתָּם
  choice: rasa malu mereka
  rationale: Kata ini berada dalam ranah makna malu, aib, atau kehinaan. “Rasa malu mereka” mempertahankan bentuk nomina dengan sufiks kepunyaan dan tetap alami dalam bahasa Indonesia.
- source_word: הָאֹמְרִים
  choice: mereka yang berkata
  rationale: Partisipel dengan kata sandang menunjuk pada kelompok yang dicirikan oleh ucapan tersebut. Susunan ini wajar dalam bahasa Indonesia dan mempertahankan fungsi deskriptifnya.
- source_word: הֶאָח הֶאָח
  choice: Aha, aha!
  rationale: Seruan berulang ini mengungkapkan ejekan atau kegembiraan jahat atas kemalangan orang lain. “Aha, aha!” mempertahankan bentuk seruan dan nada mencemoohnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata “mundur” dipilih untuk menyampaikan gerak berbalik atau menarik diri dalam konteks permohonan kutukan; catatan kaki mempertahankan kemungkinan “berbalik” serta nuansa “aib” pada frasa sebab-akibat.
