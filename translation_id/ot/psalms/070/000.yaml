  text: For the choirmaster. Of David. For remembrance[a].
translation:
  language: id
  text: Untuk pemimpin musik. Dari Daud. Untuk peringatan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mengingatkan,” “sebagai pengingat,” atau mungkin sebuah petunjuk liturgis yang berkaitan dengan peringatan.
