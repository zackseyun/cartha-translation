lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini dalam judul-judul mazmur menunjuk kepada seorang pemimpin atau pengarah dalam konteks musik. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan fungsi musikalnya; kata depan ל diterjemahkan dengan “untuk”.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Konstruksi ini dapat menyatakan karya, hubungan, kepemilikan, peruntukan, atau keterkaitan dengan Daud. “Dari Daud” tetap ringkas dan tidak setegas “karangan Daud” dalam menetapkan kepengarangan.
- source_word: לְהַזְכִּיר
  choice: Untuk mengingatkan
  rationale: Infinitif kausatif dari זכר berarti menyebabkan seseorang mengingat atau membawa sesuatu ke dalam ingatan. Terjemahan ini mempertahankan daya kausatif serta tidak menentukan siapa yang diingatkan atau apa yang diingat.
theological_decisions:
- issue: Fungsi istilah לְהַזְכִּיר dalam judul mazmur
  choice: 'Diterjemahkan secara netral sebagai tujuan: “Untuk mengingatkan”'
  alternative: “Untuk peringatan,” “Sebagai pengingat,” atau suatu petunjuk liturgis yang berkaitan dengan tindakan mengingat
  rationale: Teks Ibrani tidak menyebut siapa yang mengingat atau diingatkan, dan tidak memastikan apakah ungkapan ini berkaitan dengan persembahan peringatan atau fungsi liturgis lain. Terjemahan tidak menetapkan salah satu tafsiran teologis tersebut.
translation_notes:
  register: Bahasa judul dibuat ringkas, bermartabat, dan mudah dipahami. “Pemimpin musik” dipilih sebagai ungkapan modern; “Dari Daud” mempertahankan sebagian keluasan makna hubungan dengan Daud; penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
