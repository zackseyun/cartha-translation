id: PSA.70.4
reference: Psalms 70:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל אֱלֹהִ֑ים אֹ֝הֲבֵ֗י יְשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/004.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: id
  text: Biarlah semua orang yang mencari Engkau bersukacita dan bergembira di dalam Engkau; biarlah mereka yang mengasihi keselamatan-Mu[a] senantiasa berkata, “Biarlah Allah diagungkan!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan-Mu.” Kata Ibrani ini dapat berarti pertolongan dari kesesakan atau keselamatan dalam arti yang lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “Biarlah Allah ditinggikan!” atau “Kiranya Allah dinyatakan besar!” Bahasa Ibrani mengungkapkan harapan atau seruan mengenai kebesaran Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: bersukacita dan bergembira
  rationale: Dua verba yang berdekatan menyatakan sukacita dengan nuansa puitis yang saling menguatkan. Padanan yang berbeda mempertahankan paralelisme Ibrani tanpa terdengar kaku dalam bahasa Indonesia.
- source_word: בְּךָ
  choice: di dalam Engkau
  rationale: Preposisi בְּ di sini paling wajar menunjukkan pusat atau dasar sukacita. Ungkapan ini mempertahankan fokus langsung kepada Allah.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: semua orang yang mencari Engkau
  rationale: Konstruksi partisipial dengan כָּל menunjuk kepada seluruh kelompok yang dicirikan oleh tindakan mencari Allah.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: senantiasa berkata
  rationale: תָמִיד bersama bentuk imperfek menyampaikan tindakan yang terus atau berulang kali dilakukan.
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: mereka yang mengasihi keselamatan-Mu
  rationale: יְשׁוּעָה dapat menunjuk pada pembebasan konkret maupun keselamatan dalam arti luas. 'Keselamatan-Mu' mempertahankan keluasan makna tersebut.
- source_word: יִגְדַּל אֱלֹהִים
  choice: Biarlah Allah diagungkan!
  rationale: Bentuk imperfek ini berfungsi secara volitif sebagai seruan atau harapan mengenai kebesaran Allah, bukan sekadar pernyataan bahwa Allah besar.
theological_decisions:
- issue: Cakupan makna יְשׁוּעָה
  choice: keselamatan
  alternative: pembebasan
  rationale: '''Keselamatan'' dapat mencakup pertolongan dari kesesakan sekaligus makna teologis yang lebih luas, tanpa membatasi ayat pada salah satunya.'
- issue: Daya volitif יִגְדַּל אֱלֹהִים
  choice: Biarlah Allah diagungkan!
  alternative: Allah itu besar! / Biarlah Allah ditinggikan!
  rationale: Terjemahan ini mempertahankan fungsi klausa sebagai seruan atau harapan yang terus diucapkan, alih-alih mengubahnya menjadi pernyataan faktual semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Struktur berulang 'biarlah' mempertahankan nada doa serta paralelisme ayat.
