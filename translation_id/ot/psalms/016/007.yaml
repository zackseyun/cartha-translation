  text: אֲבָרֵ֗ךְ אֶת יְ֭הוָה אֲשֶׁ֣ר יְעָצָ֑/נִי אַף לֵ֝יל֗וֹת יִסְּר֥וּ/נִי כִלְיוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/007.yaml
  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: id
  text: Aku akan memuji Yahweh, yang menasihati aku; bahkan pada malam hari batinku mengajariku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ginjal-ginjalku mengajar aku.” Dalam bahasa Ibrani, ginjal dapat melambangkan diri yang paling dalam, termasuk suara hati dan emosi mendalam. Kata yang diterjemahkan “mengajariku” juga dapat berarti “menegur” atau “mendisiplinkan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: Aku akan memuji
  rationale: Bentuk piel dari ברך ketika Yahweh menjadi objek berarti memberkati dalam arti memuji atau mengagungkan. Dalam bahasa Indonesia, 'memuji' lebih alami daripada 'memberkati' untuk tindakan manusia kepada Allah, sedangkan bentuk imperfek mendukung pernyataan tekad 'akan memuji'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini memperkenalkan klausa yang menerangkan Yahweh.
- source_word: יְעָצָנִי
  choice: menasihati aku
  rationale: Kata יעץ berarti memberi nasihat atau pertimbangan. Bentuk imperfek di sini wajar dipahami sebagai tindakan yang berlangsung atau menjadi kebiasaan.
- source_word: אַף
  choice: bahkan
  rationale: 'Kata ini memberi penekanan tambahan: bimbingan itu dialami bahkan pada malam hari.'
- source_word: לֵילוֹת
  choice: pada malam hari
  rationale: Walaupun bentuk Ibraninya jamak, ungkapan Indonesia ini secara alami menyatakan waktu malam yang berulang.
- source_word: יִסְּרוּנִי
  choice: mengajar aku
  rationale: Kata יסר dapat berarti mendidik, mengajar, menegur, atau mendisiplinkan. 'Mengajar' sesuai dengan konteks perenungan batin, tanpa meniadakan nuansa pembentukan yang dijelaskan dalam catatan kaki.
- source_word: כִלְיוֹתָי
  choice: batinku
  rationale: Secara harfiah berarti 'ginjal-ginjalku', tetapi dalam antropologi Ibrani menunjuk pada bagian diri yang paling dalam, termasuk suara hati dan emosi mendalam. 'Batinku' menyampaikan fungsi metafora itu secara alami.
theological_decisions:
- issue: Metafora antropologis כִלְיוֹתָי
  choice: batinku
  alternative: ginjal-ginjalku; hatiku; pikiranku
  rationale: '''Batinku'' mempertahankan cakupan diri terdalam tanpa membuat pembaca modern salah memahami metafora jasmani. ''Hati'' dan ''pikiran'' terlalu mempersempit gambaran Ibrani.'
- issue: Pelaku pengajaran pada klausa kedua
  choice: Mempertahankan 'batinku' sebagai subjek gramatikal langsung
  alternative: Menjadikan Yahweh pelaku tersirat yang mengajar melalui batin
  rationale: Teks secara gramatikal menyatakan bahwa 'ginjal-ginjalku/batinku' mengajar aku. Terjemahan tidak secara diam-diam menyelesaikan hubungan teologis antara nasihat Yahweh dan perenungan batin.
- issue: Rentang makna יִסְּרוּנִי
  choice: mengajar aku
  alternative: menegur aku; mendisiplinkan aku
  rationale: Konteks mendukung pengajaran batin, tetapi akar kata dapat mencakup koreksi atau disiplin; kemungkinan itu dicatat agar ketegangan leksikal tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pronomina 'aku' mempertahankan suara pribadi mazmur. Tanda titik koma menjaga kesejajaran dua klausa puisi.
