id: PSA.16.2
reference: Psalms 16:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָמַ֣רְתְּ לַֽ֭/יהוָה אֲדֹנָ֣/י אָ֑תָּה ט֝וֹבָתִ֗/י בַּל עָלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: id
  text: Aku berkata kepada Yahweh, “Engkaulah Tuhanku; tidak ada kebaikan bagiku di luar Engkau.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “kebaikanku tidak melampaui Engkau,” yang menyatakan bahwa kebaikan pemazmur tidak berada di luar Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: Aku berkata
  rationale: Walaupun bentuk Masoretiknya secara formal tampak sebagai orang kedua feminin tunggal, konteks mazmur dan kesaksian versi-versi kuno mendukung pemahaman bahwa pemazmur berbicara dalam orang pertama.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang disapa, sedangkan nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
- source_word: אֲדֹנָי אָתָּה
  choice: Engkaulah Tuhanku
  rationale: אֲדֹנָי dengan akhiran orang pertama berarti 'Tuhanku'; pronomina eksplisit אָתָּה memberi penegasan, yang secara alami disampaikan dengan partikel -lah.
- source_word: טוֹבָתִי
  choice: kebaikan bagiku
  rationale: Nomina ini dapat menunjuk pada kebaikan, manfaat, atau kesejahteraan. 'Kebaikan bagiku' mempertahankan cakupan luasnya tanpa menyiratkan kebajikan moral milik pembicara.
- source_word: בַּל עָלֶיךָ
  choice: tidak ada ... di luar Engkau
  rationale: Ungkapan puitis yang padat ini menyatakan bahwa kebaikan sang pemazmur tidak melampaui atau berada terpisah dari Allah; terjemahan utama dibuat alami, sementara bentuk yang lebih harfiah dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Nama perjanjian dipertahankan sebagai nama diri Yahweh, bukan diganti dengan gelar.
- issue: Makna klausa penutup
  choice: tidak ada kebaikan bagiku di luar Engkau
  alternative: kebaikanku tidak melampaui Engkau
  rationale: Pilihan utama menyampaikan ketergantungan pemazmur kepada Allah dalam bahasa Indonesia yang wajar, sedangkan catatan kaki mempertahankan susunan Ibrani yang lebih formal dan ambiguitas idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. 'Engkau' serta bentuk posesif '-ku' mempertahankan corak doa langsung; 'Tuhan' dibedakan dari nama diri 'Yahweh'.
