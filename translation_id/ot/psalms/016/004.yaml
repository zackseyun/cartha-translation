  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: id
  text: Kesedihan mereka akan bertambah banyak—mereka yang bergegas mengejar ilah lain. Aku tidak akan mencurahkan persembahan curahan mereka yang berupa darah[b], dan tidak akan menyebut nama-nama mereka dengan bibirku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Atau: “persembahan curahan mereka dengan darah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: akan bertambah banyak
  rationale: Bentuk Qal imperfek dari רבה menyatakan pertambahan atau pelipatgandaan; bentuk ini menyampaikan akibat yang dinyatakan dalam baris puisi.
- source_word: עַצְּבוֹתָם
  choice: Kesedihan orang-orang
  rationale: Kata ini paling wajar dipahami sebagai kesedihan atau penderitaan yang dialami para pengejar ilah lain. Kemungkinan kaitannya dengan berhala tetap dicatat dalam catatan kaki.
- source_word: אַחֵר
  choice: ilah lain
  rationale: Secara harfiah berarti 'yang lain'. Konteks persembahan curahan dan penyebutan nama menunjukkan bahwa acuannya ialah ilah lain; kata 'ilah' dilengkapi demi kejelasan.
- source_word: מָהָרוּ
  choice: yang bergegas mengejar
  rationale: מהר lazimnya berarti bergegas atau bertindak cepat. Dalam konteks ini ungkapan tersebut menggambarkan pengejaran yang penuh gairah terhadap ilah lain.
- source_word: בַּל
  choice: tidak
  rationale: Partikel negatif puitis ini diterjemahkan dengan penyangkalan lugas pada kedua klausa.
- source_word: אַסִּיךְ
  choice: Aku tidak akan mencurahkan
  rationale: Bentuk Hifil dari נסך menunjuk pada tindakan mencurahkan cairan sebagai persembahan, sehingga citra ritualnya dipertahankan.
- source_word: נִסְכֵּיהֶם
  choice: persembahan curahan mereka
  rationale: Istilah ini menunjuk pada persembahan cair dalam ibadah. 'Persembahan curahan' jelas, cukup alami, dan mempertahankan tindakan ritual yang terkandung dalam istilah Ibrani.
- source_word: מִדָּם
  choice: yang berupa darah
  rationale: Preposisi מן dapat menyatakan bahan atau sumber. Ungkapan ini menyampaikan bahwa darah merupakan bahan persembahan tersebut; kemungkinan arti 'dengan darah' dicatat dalam catatan kaki.
- source_word: אֶשָּׂא
  choice: menyebut
  rationale: נשא bersama 'nama-nama' dan 'bibir' secara idiomatis berarti mengucapkan atau menyebut. Bahasa Indonesia alami lebih mengutamakan makna idiomatis daripada menerjemahkan citra 'mengangkat' secara kaku.
- source_word: שְׁמוֹתָם
  choice: nama-nama mereka
  rationale: Bentuk jamak dan pronomina dipertahankan. Acuannya kemungkinan besar nama ilah-ilah lain, tetapi teks tidak menjelaskannya secara mutlak.
- source_word: עַל שְׂפָתָי
  choice: dengan bibirku
  rationale: Ungkapan Ibrani ini merupakan idiom untuk pengucapan. 'Dengan bibirku' alami dalam bahasa Indonesia dan tetap mempertahankan gambaran bibir.
theological_decisions:
- issue: Objek tersirat sesudah אַחֵר
  choice: ilah lain
  alternative: yang lain
  rationale: Konteks ibadah, persembahan curahan, dan nama-nama mendukung acuan kepada ilah lain. Penambahan 'ilah' memperjelas objek tersirat tanpa memasukkan klaim teologis baru.
- issue: Makna עַצְּבוֹתָם
  choice: kesedihan
  alternative: berhala-berhala
  rationale: 'Sintaksis paling alami menyatakan akibat bagi orang yang mengejar ilah lain: kesedihan mereka bertambah. Karena bentuk Ibrani dapat dikaitkan dengan istilah berhala dalam konteks lain, kemungkinan itu dipertahankan dalam catatan kaki.'
- issue: Acuan 'nama-nama mereka'
  choice: dibiarkan dengan pronomina 'mereka'
  alternative: nama ilah-ilah itu
  rationale: Konteks cenderung menunjuk kepada nama ilah-ilah lain, tetapi pronomina Ibrani masih dapat dipahami berkaitan dengan para penyembah. Terjemahan tidak mempersempit ambiguitas tersebut secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Istilah 'ilah' dipakai untuk dewa yang disembah selain TUHAN, sedangkan 'persembahan curahan' mempertahankan istilah ritual secara mudah dipahami. Paralelisme penyangkalan dipertahankan tanpa membuat susunan kalimat terasa kaku.
