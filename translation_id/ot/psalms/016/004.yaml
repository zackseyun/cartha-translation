  to: Kesedihan mereka akan bertambah banyak—mereka yang bergegas mengejar ilah lain. Aku tidak akan mencurahkan persembahan curahan mereka yang berupa darah[b], dan tidak akan menyebut nama-nama mereka dengan bibirku.
