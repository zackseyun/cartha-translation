  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/000.yaml
  text: A miktam of David. Preserve me[a], God, for I take refuge in you.
translation:
  language: id
  text: 'Miktam[a] Daud.


    Jagalah aku, ya Allah, sebab kepada-Mu aku berlindung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani miktam, istilah dalam judul mazmur yang maknanya tidak pasti; mungkin menunjuk pada suatu jenis gubahan. Ada yang menerjemahkannya “mazmur” atau “nyanyian emas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Makna istilah teknis pada judul mazmur ini tidak pasti. Transliterasi mempertahankan ketidakpastian leksikal sumber tanpa secara spekulatif menerjemahkannya sebagai jenis syair tertentu.
- source_word: שָׁמְרֵנִי
  choice: Jagalah aku
  rationale: Imperatif dari שׁמר menyatakan permohonan agar Allah menjaga atau melindungi pemazmur; 'jagalah' alami dalam bahasa Indonesia dan tetap dekat dengan verba Ibrani.
- source_word: אֵל
  choice: ya Allah
  rationale: אֵל adalah sebutan bagi Allah. Partikel vokatif 'ya' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas sapaan langsung.
- source_word: חָסִיתִי
  choice: aku berlindung
  rationale: Bentuk perfektum dari חסה menyatakan tindakan mencari atau mendapatkan perlindungan. Dalam konteks doa ini, bentuk kini bahasa Indonesia menyampaikan keadaan kepercayaan yang sedang berlangsung tanpa menutup nuansa tindakan yang telah dilakukan.
- source_word: בָךְ
  choice: kepada-Mu
  rationale: Dengan verba 'berlindung', konstruksi Indonesia 'berlindung kepada' menyatakan bahwa Allah adalah tempat perlindungan; huruf kapital menandai rujukan kepada Allah sesuai kebiasaan ejaan religius Indonesia.
theological_decisions:
- issue: Hubungan alasan dalam כִּי חָסִיתִי בָךְ
  choice: sebab kepada-Mu aku berlindung
  alternative: karena aku telah berlindung kepada-Mu
  rationale: Terjemahan mempertahankan כִּי sebagai alasan bagi permohonan dan tidak menambahkan kesimpulan teologis di luar teks. Aspek perfektum Ibrani dibiarkan cukup terbuka melalui ungkapan idiomatis Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Superskripsi dipisahkan dari isi doa. Istilah teknis yang tidak pasti ditransliterasikan dan dijelaskan dalam catatan kaki; sapaan 'ya Allah' serta pronomina ilahi berhuruf kapital mengikuti kelaziman pembaca Indonesia.
