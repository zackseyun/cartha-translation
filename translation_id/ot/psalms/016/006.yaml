base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/006.yaml
  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
translation:
  language: id
  text: Garis-garis batas jatuh bagiku di tempat-tempat yang menyenangkan[a]; sungguh, warisanku indah bagiku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tali-tali pengukur jatuh bagiku di tempat-tempat yang menyenangkan.” Gambaran Ibraninya ialah tali yang dipakai untuk mengukur atau menandai bagian warisan yang diberikan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “warisanku menyenangkan bagiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  choice: tali-tali batas
  rationale: Kata ini dapat menunjuk pada tali pengukur atau garis batas yang menandai bagian tanah yang dibagikan. Pilihan ini mempertahankan gambaran konkret pembagian tanah.
- source_word: נָפְלוּ
  choice: jatuh
  rationale: Menerjemahkan verba secara dekat sambil mempertahankan ungkapan tentang bagian yang diperoleh melalui penetapan atau undian.
- source_word: לִי
  choice: bagiku
  rationale: Menyatakan hubungan kepentingan atau keuntungan pribadi secara alami dalam bahasa Indonesia.
- source_word: בַּנְּעִמִים
  choice: di tempat-tempat yang menyenangkan
  rationale: Bentuk jamak ini paling wajar dipahami secara lokatif dalam gambaran pembagian tanah, dengan nuansa menyenangkan atau elok.
- source_word: אַף
  choice: sungguh
  rationale: Menangkap fungsi penegasan yang menguatkan pernyataan sebelumnya, bukan sekadar penambahan.
- source_word: נַחֲלָת
  choice: warisanku
  rationale: Konteks dan paralelisme menyiratkan milik orang pertama. 'Warisan' mempertahankan bahasa konkret tentang bagian milik yang diberikan.
- source_word: שָׁפְרָה
  choice: indah
  rationale: Verba ini menyatakan keadaan elok, baik, atau menyenangkan; 'indah' mempertahankan penilaian positifnya dengan bahasa alami.
- source_word: עָלַי
  choice: bagiku
  rationale: Secara harfiah berarti 'atas diriku', tetapi dalam ungkapan ini menandai penilaian atau hubungan pribadi; 'indah bagiku' mempertahankan unsur subjektif tanpa menjadi janggal.
theological_decisions:
- issue: Gambaran pembagian tanah sebagai metafora bagi bagian yang diberikan Allah kepada pemazmur
  choice: Mempertahankan gambaran konkret tali batas dan warisan.
  alternative: Menggeneralisasikannya menjadi berkat-berkat atau nasib baik yang diterima pemazmur.
  rationale: Bahasa ayat ini bergaung dengan pembagian tanah warisan dan konteks TUHAN sebagai bagian pemazmur dalam ayat sebelumnya. Gambaran itu dipertahankan tanpa menentukan secara berlebihan apakah yang dimaksud tanah literal atau keseluruhan bagian pemberian Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Ungkapan 'tali-tali batas jatuh bagiku' sengaja mempertahankan citra Ibrani yang tidak sepenuhnya idiomatis, sementara catatan kaki menjelaskannya. Semua penanda catatan kaki muncul dalam teks utama.
