  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: id
  text: Sebab Engkau tidak akan meninggalkan jiwaku di Syeol, dan tidak akan membiarkan orang yang setia kepada-Mu[a] melihat liang kubur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang kudus-Mu.” Kata Ibrani ini dapat menunjuk pada orang yang setia, saleh, atau kudus.
    reason: lexical_alternative
  - marker: b
    text: Atau “pembusukan.” Septuaginta dan kutipan ayat ini dalam Perjanjian Baru memakai ungkapan yang menekankan pembusukan.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan alasan bagi keyakinan yang dinyatakan sebelumnya dan mengalir secara wajar dalam puisi Indonesia.
- source_word: לֹא תַעֲזֹב
  choice: tidak akan meninggalkan
  rationale: Menyampaikan arti dasar עזב, yaitu meninggalkan atau membiarkan, tanpa bahasa yang kuno.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפש dapat berarti jiwa, nyawa, diri, atau kehidupan. 'Jiwaku' mempertahankan ungkapan puitis Ibrani dan tidak mempersempitnya hanya pada keadaan jasmani.
- source_word: לִשְׁאוֹל
  choice: di Syeol
  rationale: Syeol adalah istilah Ibrani bagi alam orang mati, bukan sekadar satu kubur. Bentuk 'di' menyampaikan tujuan atau penyerahan ke dalam kuasa Syeol secara alami dalam konteks Indonesia.
- source_word: לֹא תִתֵּן
  choice: tidak akan membiarkan
  rationale: Walaupun נתן secara harfiah berarti 'memberikan', bersama infinitif kata ini secara idiomatis berarti mengizinkan atau membiarkan.
- source_word: חֲסִידְךָ
  choice: orang yang setia kepada-Mu
  rationale: חסיד menunjuk pada orang yang bercirikan kesetiaan, kesalehan, atau loyalitas dalam relasi dengan Allah. Pilihan ini mempertahankan nuansa relasional tanpa langsung menjadikannya gelar teknis.
- source_word: לִרְאוֹת
  choice: melihat
  rationale: Mempertahankan idiom Ibrani secara langsung; dalam konteks ini 'melihat' juga dapat menyiratkan mengalami.
- source_word: שָׁחַת
  choice: liang kubur
  rationale: Dalam paralelisme dengan Syeol, שחת paling wajar menunjuk pada liang atau lubang kematian. Ungkapan ini jelas dan puitis dalam bahasa Indonesia, sementara arti alternatif 'kebinasaan/pembusukan' dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna mesianik ayat ini dalam pemakaian Perjanjian Baru
  choice: Menerjemahkan menurut makna leksikal langsung teks Ibrani tanpa memasukkan penafsiran mesianik secara eksplisit ke dalam teks utama.
  alternative: Menerjemahkan חֲסִידְךָ sebagai 'Yang Kudus-Mu' dan שָׁחַת sebagai 'kebinasaan' atau 'pembusukan' agar lebih dekat dengan Septuaginta dan kutipan Perjanjian Baru.
  rationale: Ayat ini kemudian diterapkan kepada Mesias dalam Perjanjian Baru, tetapi teks utama perlu mewakili bentuk Ibraninya sendiri. Alternatif yang penting secara teologis dipertahankan dalam catatan kaki agar ketegangan antarteks tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi sapaan ilahi dipertahankan. 'Syeol' digunakan untuk menjaga konsep khas dunia teks Ibrani, sedangkan susunan kalimat dibuat alami bagi pembaca Indonesia. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskannya.
