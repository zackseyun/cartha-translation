source:
  edition: WLC
  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/001.yaml
  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: id
  text: Miktam[a] Daud. Jagalah aku, ya Allah, sebab aku berlindung kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani miktam, suatu judul mazmur yang maknanya tidak pasti; mungkin menunjuk pada suatu jenis gubahan. Ada yang menerjemahkannya “mazmur” atau “nyanyian emas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Makna istilah dalam judul mazmur ini tidak pasti. Transliterasi mempertahankan bentuk Ibraninya tanpa menetapkan arti yang masih diperdebatkan.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam judul mazmur, לְ dapat menyatakan kepengarangan, kepunyaan, hubungan, atau peruntukan. Bentuk ringkas “Miktam Daud” tetap alami dalam bahasa Indonesia dan tidak mempersempit hubungan itu menjadi “oleh Daud” saja.
- source_word: שָׁמְרֵנִי
  choice: Jagalah aku
  rationale: Imperatif dari שׁמר memohon pemeliharaan dan perlindungan. “Jagalah aku” alami sebagai doa serta cukup luas untuk mencakup penjagaan yang berkelanjutan.
- source_word: אֵל
  choice: ya Allah
  rationale: אֵל merupakan sebutan umum bagi Allah; partikel “ya” menyampaikan fungsi sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi permohonan sebelumnya. “Sebab” mempertahankan hubungan kausal tersebut.
- source_word: חָסִיתִי
  choice: aku berlindung
  rationale: Kata kerja חסה membawa gambaran mencari atau mendapatkan perlindungan. Bentuk kini “aku berlindung” mengungkapkan sikap bersandar yang telah menetap tanpa menghilangkan citra tempat perlindungan.
- source_word: בָךְ
  choice: kepada-Mu
  rationale: Dengan חסה, preposisi ב menandai pihak yang menjadi tempat perlindungan. Dalam bahasa Indonesia, “berlindung kepada-Mu” menyampaikan hubungan itu secara alami.
theological_decisions:
- issue: Makna judul מִכְתָּם
  choice: Ditransliterasikan sebagai “Miktam”
  alternative: Diterjemahkan sebagai “mazmur”, “nyanyian emas”, atau “tulisan”
  rationale: Arti tepat istilah ini tidak diketahui. Transliterasi menghindari kepastian semu dan mempertahankan ketegangan leksikal dalam sumber.
- issue: Hubungan לְדָוִד dengan komposisi
  choice: “Daud” tanpa memperjelasnya menjadi “oleh Daud”
  alternative: “oleh Daud”, “untuk Daud”, atau “milik Daud”
  rationale: Preposisi לְ dalam judul mazmur dapat menunjukkan beberapa jenis hubungan. Terjemahan tidak menetapkan kepengarangan secara lebih tegas daripada teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Jagalah aku” mempertahankan keluasan makna permohonan, sedangkan “aku berlindung” menjaga citra perlindungan dalam teks Ibrani. Huruf kapital pada pronomina ilahi mengikuti kebiasaan tulisan keagamaan Indonesia.
