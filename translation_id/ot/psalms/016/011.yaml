  text: תּֽוֹדִיעֵ/נִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת פָּנֶ֑י/ךָ נְעִמ֖וֹת בִּ/ימִינְ/ךָ֣ נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: id
  text: Engkau memberitahukan kepadaku jalan kehidupan[a]; di hadapan-Mu ada kelimpahan sukacita; di sebelah kanan-Mu ada kenikmatan untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bisa juga: “Engkau akan memberitahukan kepadaku jalan kehidupan.”'
    reason: aspectual_alternative
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: Engkau memberitahukan kepadaku
  rationale: Bentuk Hifil dari ידע dengan akhiran orang pertama tunggal berarti ‘membuat aku tahu’ atau ‘memberitahukan kepadaku’. Bentuk imperfek di sini dapat menyatakan keyakinan pada masa kini, meskipun nuansa masa depan tetap mungkin.
- source_word: אֹרַח חַיִּים
  choice: jalan kehidupan
  rationale: אֹרַח berarti jalan atau lintasan, sedangkan חַיִּים, walaupun berbentuk jamak, lazim berfungsi sebagai nomina abstrak ‘kehidupan’. Ungkapan ini mempertahankan metafora perjalanan menuju atau bercirikan kehidupan.
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: sukacita yang melimpah
  rationale: שֹׂבַע menyatakan kepenuhan, kelimpahan, atau rasa puas, dan שְׂמָחוֹת berbentuk jamak. Terjemahan ini menyampaikan intensitas serta kelimpahannya dalam bahasa Indonesia yang wajar.
- source_word: אֶת־פָּנֶיךָ
  choice: di hadapan-Mu
  rationale: Secara dekat ungkapan ini berkaitan dengan ‘wajah-Mu’, tetapi secara idiomatis menunjuk pada kehadiran langsung. ‘Di hadapan-Mu’ tetap dekat dengan citra Ibrani sekaligus dapat dipahami secara alami.
- source_word: נְעִמוֹת
  choice: kenikmatan
  rationale: Bentuk jamak substantival dari akar נעם menunjuk pada hal-hal yang menyenangkan atau nikmat. ‘Kenikmatan’ menyampaikan makna kolektifnya secara alami.
- source_word: בִּימִינְךָ
  choice: di sebelah kanan-Mu
  rationale: Frasa ini secara spasial berarti berada di sisi kanan Allah, suatu gambaran kedekatan dan perkenanan, tanpa perlu memperluas penafsirannya.
- source_word: נֶצַח
  choice: untuk selama-lamanya
  rationale: Dalam konteks ini נֶצַח menyatakan keberlangsungan tanpa akhir. Ungkapan Indonesia ini alami dan sesuai dengan gaya puitis mazmur.
theological_decisions:
- issue: Apakah אֶת־פָּנֶיךָ diterjemahkan secara harfiah sebagai ‘di depan wajah-Mu’ atau secara idiomatis sebagai kehadiran Allah
  choice: di hadapan-Mu
  alternative: dalam hadirat-Mu; di depan wajah-Mu
  rationale: ‘Di hadapan-Mu’ mempertahankan hubungan dengan citra wajah dalam bahasa Ibrani sekaligus menyampaikan makna idiomatis kehadiran tanpa menambahkan penafsiran teologis tertentu.
- issue: Apakah imperfek תּוֹדִיעֵנִי menyatakan masa kini atau masa depan
  choice: Engkau memberitahukan kepadaku
  alternative: Engkau akan memberitahukan kepadaku
  rationale: Konteks puisi memungkinkan pernyataan keyakinan pada masa kini maupun pengharapan ke depan. Teks utama memakai bentuk kini yang alami, sementara kemungkinan masa depan dicatat agar ambiguitas aspek Ibrani tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan bermartabat. Sapaan kepada Allah memakai huruf kapital sesuai kelaziman penulisan religius Indonesia. Paralelisme antarklausa dipertahankan, sementara ungkapan Ibrani dibuat cukup alami bagi pembaca umum.
