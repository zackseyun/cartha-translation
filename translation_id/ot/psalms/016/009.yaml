  terminology: “Kemuliaanku” dan “dagingku” adalah pilihan yang setia pada leksikon sumber dan menjaga hubungan leksikal dengan penggunaan kanonik kemudian tanpa memaksakan pembacaan tersebut. Catatan kaki secara tepat menyajikan alternatif idiomatis untuk כְּבוֹדִי dan alternatif “beristirahat” bagi יִשְׁכֹּן tanpa mengubah teks utama.
