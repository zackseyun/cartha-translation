  source_fidelity: 'Terjemahan mengikuti struktur dan makna teks Ibrani dengan baik: לָכֵן diterjemahkan secara inferensial (“Sebab itu”); hati bersukacita dan “kemuliaanku” bersorak mempertahankan paralelisme serta ambiguitas כְּבוֹדִי; dan “bahkan dagingku akan tinggal dengan aman” mencerminkan perluasan penegasan אַף, בְּשָׂרִי, dan יִשְׁכֹּן לָבֶטַח. Tidak ada penambahan tafsiran teologis ke dalam teks utama.'
