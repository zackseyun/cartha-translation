id: PSA.16.9
reference: Psalms 16:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָ/כֵ֤ן שָׂמַ֣ח לִ֭בִּ/י וַ/יָּ֣גֶל כְּבוֹדִ֑/י אַף בְּ֝שָׂרִ֗/י יִשְׁכֹּ֥ן לָ/בֶֽטַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/009.yaml
  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
translation:
  language: id
  text: Sebab itu hatiku bersukacita, dan kemuliaanku bersorak[a]; bahkan dagingku akan tinggal dengan aman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehormatanku” atau “seluruh diriku”; sebagian penafsir memahami “kemuliaanku” sebagai ungkapan bagi diri seseorang, sedangkan beberapa penafsir kuno menghubungkannya dengan lidah.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan beristirahat dengan tenteram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Sebab itu
  rationale: Menandai kesimpulan dari keyakinan pemazmur pada ayat-ayat sebelumnya dan terdengar alami dalam puisi Indonesia.
- source_word: שָׂמַח לִבִּי
  choice: hatiku bersukacita
  rationale: Mempertahankan gambaran hati sebagai pusat batin serta menyampaikan keadaan sukacita yang dihasilkan oleh keyakinan tersebut.
- source_word: וַיָּגֶל
  choice: bersorak
  rationale: Mengungkapkan sukacita yang kuat sekaligus menghindari pengulangan kata 'bersukacita' dalam baris sejajar.
- source_word: כְּבוֹדִי
  choice: kemuliaanku
  rationale: Merupakan padanan langsung bagi istilah Ibrani dan mempertahankan ambiguitas puitisnya tanpa mengubahnya diam-diam menjadi 'jiwaku', 'seluruh diriku', atau 'lidahku'.
- source_word: אַף
  choice: bahkan
  rationale: Menangkap perluasan yang menegaskan bahwa rasa aman mencakup pula keberadaan jasmani.
- source_word: בְּשָׂרִי
  choice: dagingku
  rationale: Mempertahankan citra konkret bahasa Ibrani dan kaitan antarteks; dalam konteks ini artinya diri jasmani, bukan tabiat berdosa.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: akan tinggal dengan aman
  rationale: Menerjemahkan verba 'tinggal/berdiam' dan keterangan keadaan aman secara langsung serta wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna כְּבוֹדִי dalam ungkapan puitis yang kemudian dikutip secara kristologis dalam Perjanjian Baru
  choice: kemuliaanku
  alternative: kehormatanku; seluruh diriku; lidahku
  rationale: Terjemahan harfiah menjaga keterbukaan makna ungkapan Ibrani dan hubungan leksikal dengan kutipan dalam Kisah Para Rasul 2, tanpa menetapkan satu tafsiran idiomatis sebagai teks utama.
- issue: Makna בְּשָׂרִי
  choice: dagingku
  alternative: tubuhku
  rationale: Pilihan ini menjaga citra sumber dan hubungan antarteks. Konteks menunjuk kepada keberadaan jasmani dan tidak memuat pengertian teologis tentang sifat berdosa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme dipertahankan melalui 'bersukacita' dan 'bersorak'. Istilah konkret 'kemuliaanku' dan 'dagingku' dipertahankan untuk transparansi terhadap teks Ibrani, dengan alternatif interpretatif ditempatkan dalam catatan kaki.
