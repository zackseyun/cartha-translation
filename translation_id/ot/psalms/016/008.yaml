  text: שִׁוִּ֬יתִי יְהוָ֣ה לְ/נֶגְדִּ֣/י תָמִ֑יד כִּ֥י מִֽ֝/ימִינִ֗/י בַּל אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/008.yaml
  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: id
  text: Aku senantiasa menempatkan Yahweh[a] di hadapanku; karena Ia berada di sebelah kananku, aku tidak akan goyah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang di sini ditransliterasikan “Yahweh”.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “aku tidak akan terguncang” atau “aku tidak akan bergeser.” Kata Ibraninya menggambarkan tidak kehilangan kestabilan atau tidak tersingkir dari kedudukan yang aman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: Aku ... menempatkan
  rationale: Bentuk Piel dari שׁוה menyatakan tindakan sengaja menempatkan atau menaruh. Dalam konteks ini, aspek tindakan yang telah menjadi sikap tetap diungkapkan secara alami bersama תָמִיד sebagai “Aku senantiasa menempatkan”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan tidak menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: לְנֶגְדִּי
  choice: di hadapanku
  rationale: Ungkapan ini berarti berada di depan atau dalam pandangan seseorang. “Di hadapanku” alami dalam laras mazmur serta mempertahankan citra ruang dan perhatian.
- source_word: תָמִיד
  choice: senantiasa
  rationale: Menyatakan kesinambungan atau ketetapan. “Senantiasa” ringkas, bermartabat, dan sesuai dengan laras puitis.
- source_word: כִּי
  choice: karena
  rationale: Di sini partikel tersebut paling wajar dipahami memperkenalkan alasan bagi keyakinan pemazmur.
- source_word: מִימִינִי
  choice: di sebelah kananku
  rationale: Mempertahankan gambaran posisi di sisi kanan, yang dalam konteks menyiratkan kehadiran dekat dan perlindungan, tanpa memasukkan penjelasan itu ke dalam teks utama.
- source_word: בַּל אֶמּוֹט
  choice: aku tidak akan goyah
  rationale: מוט menggambarkan kehilangan kestabilan, terhuyung, atau bergeser dari kedudukan yang aman. “Tidak akan goyah” mempertahankan makna harfiah sekaligus metaforis dalam bahasa Indonesia masa kini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi itu melalui transliterasi tanpa menggantinya dengan sebuah gelar.
- issue: Makna kehadiran di sebelah kanan
  choice: Mempertahankan citra “di sebelah kananku”
  alternative: Memperjelasnya sebagai “melindungi aku” atau “menopang aku”
  rationale: Citra Ibrani dapat menyiratkan perlindungan dan dukungan, tetapi teks menyatakannya secara spasial. Terjemahan tidak membatasi daya teologis gambaran itu pada satu penafsiran saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis yang sederhana dan bermartabat. “Senantiasa” menjaga irama mazmur; “di hadapanku” dan “di sebelah kananku” mempertahankan citra konkret teks Ibrani. Kata ganti “Ia” dipakai dengan hormat tanpa menambahkan unsur yang tidak dinyatakan sumber.
