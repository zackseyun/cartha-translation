  text: Yahweh adalah bagian warisanku dan pialaku[a]; Engkaulah yang memegang teguh undianku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Yahweh adalah bagianku dan pialaku.” Bahasa Ibrani menempatkan beberapa istilah yang berkaitan dengan bagian yang diterima secara berdekatan: “bagian,” “warisan,” dan “undi”; juga dipakai metafora “piala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi dalam bentuk transliterasi yang lazim, bukan menggantinya dengan gelar.
- source_word: מְנָת חֶלְקִי
  choice: bagian warisanku
  rationale: Ungkapan rangkap ini menyatukan gagasan bagian yang ditetapkan dan warisan. Pilihan ini mempertahankan gambaran pembagian milik tanpa menghasilkan frasa Indonesia yang terlalu kaku.
- source_word: וְכוֹסִי
  choice: dan pialaku
  rationale: Mempertahankan metafora konkret 'piala' sebagai sesuatu yang ditetapkan untuk dialami, tanpa menafsirkannya secara eksplisit dalam teks utama.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Bentuk berpartikel -lah mencerminkan penekanan pada pronomina eksplisit Ibrani dan sesuai dengan sapaan langsung kepada Allah.
- source_word: תּוֹמִיךְ
  choice: yang menjamin
  rationale: Dalam konteks pembagian warisan, verba ini menyatakan bahwa Yahweh memegang teguh atau memastikan apa yang menjadi bagian pemazmur. 'Menjamin' menyampaikan keamanan itu secara alami dalam bahasa Indonesia.
- source_word: גּוֹרָלִי
  choice: bagianku
  rationale: Mengacu pada bagian yang diperoleh melalui undian atau penetapan. 'Bagianku' alami dalam bahasa Indonesia dan tetap terkait dengan citra pembagian warisan; nuansa harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Yahweh sendiri sebagai bagian warisan pemazmur
  choice: Yahweh adalah bagian warisanku dan pialaku
  alternative: Yahweh adalah bagianku dan pialaku
  rationale: Terjemahan mempertahankan tumpang tindih metafora bagian, warisan, piala, dan undian, sehingga Yahweh tampil sebagai milik yang ditetapkan bagi pemazmur tanpa meratakan ketegangan puitisnya.
- issue: Peran Yahweh terhadap bagian yang ditetapkan
  choice: Engkaulah yang menjamin bagianku
  alternative: Engkau memegang teguh undianku
  rationale: Konteks memungkinkan makna memelihara, memegang teguh, atau menjamin hasil pembagian. Pilihan utama mengungkapkan bahwa Yahweh mengamankan bagian pemazmur tanpa menentukan apakah yang dimaksud terutama harta warisan atau nasib hidup.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. 'Piala' dipilih alih-alih 'cawan' untuk register mazmur yang bermartabat. Kapitalisasi 'Engkaulah' mengikuti kebiasaan penghormatan dalam sapaan langsung kepada Allah.
