lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: Adapun orang-orang kudus
  rationale: Prefiks ל dipahami sebagai penanda topik dalam konteks ini, bukan semata-mata datif. 'Orang-orang kudus' mempertahankan bentuk substantif dan tidak membatasi rujukannya dengan istilah teknis gerejawi.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: yang ada di negeri
  rationale: אֶרֶץ dapat berarti 'negeri' atau 'bumi'. 'Negeri' cocok bagi orang-orang yang hidup dalam ranah duniawi, sementara alternatif 'bumi' tetap dicatat.
- source_word: הֵמָּה
  choice: merekalah
  rationale: Pronomina mandiri yang bersifat menegaskan dinyatakan dengan 'merekalah'.
- source_word: וְאַדִּירֵי
  choice: orang-orang mulia
  rationale: אַדִּיר dapat menyatakan kemuliaan, keagungan, atau keunggulan. Dalam konteks ini, 'mulia' menyampaikan martabat tanpa menyiratkan kekuatan militer.
- source_word: כָּל חֶפְצִי
  choice: seluruh kesukaanku
  rationale: חֵפֶץ mencakup kesukaan, kesenangan, atau hasrat. 'Seluruh kesukaanku' mempertahankan intensitas כָּל dan penilaian penuh kasih pemazmur.
- source_word: בָם
  choice: yang menjadi ... kesukaanku
  rationale: Relasi ב dengan orang-orang tersebut diungkapkan secara alami dalam bahasa Indonesia melalui konstruksi 'yang menjadi seluruh kesukaanku', tanpa menghilangkan bahwa kesukaan pemazmur tertuju kepada mereka.
theological_decisions:
- issue: Identitas 'orang-orang kudus'
  choice: Dibiarkan sebagai sebutan bagi pribadi-pribadi kudus yang berada di negeri
  alternative: Makhluk-makhluk kudus surgawi atau orang-orang yang dikhususkan secara umum
  rationale: Keterangan 'yang ada di negeri' lebih wajar menunjuk kepada manusia di ranah duniawi, tetapi terjemahan tidak menambahkan sebutan seperti 'umat Allah' yang akan menutup kemungkinan nuansa lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Susunan 'Adapun ... merekalah ...' mempertahankan penonjolan topik dan penegasan teks Ibrani. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
