  text: Airnya bergemuruh dan berbuih; gunung-gunung berguncang ketika airnya bergelora.[a] Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung-gunung berguncang karena keangkuhannya” atau “pada saat airnya meninggi.” Kata benda Ibrani ini dapat berarti keagungan, keangkuhan, atau gelora/meningginya air; di sini gambaran fisik air yang bergelora dipilih.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהֱמוּ
  choice: bergemuruh
  rationale: Kata kerja המה menggambarkan bunyi gaduh yang kuat. “Bergemuruh” alami untuk air dan mempertahankan daya akustik gambaran Ibrani.
- source_word: יֶחְמְרוּ
  choice: berbuih
  rationale: Dalam konteks air yang bergejolak, חמר kemungkinan menunjuk pada air yang berkocak, keruh, atau berbuih. “Berbuih” menghasilkan gambaran fisik yang jelas dan berpasangan alami dengan “bergemuruh”.
- source_word: מֵימָיו
  choice: airnya
  rationale: Akhiran orang ketiga maskulin tunggal dipertahankan sebagai bentuk posesif “-nya”, dengan rujukan pada gambaran perairan dalam konteks sebelumnya.
- source_word: יִרְעֲשׁוּ
  choice: berguncang
  rationale: רעשׁ menyatakan guncangan kuat, termasuk guncangan seperti gempa. “Berguncang” sesuai dengan gunung sebagai subjek dan terdengar alami dalam bahasa Indonesia.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Bentuk ulang menyatakan jamak secara alami; konteks puitis tidak memerlukan penambahan kata sandang tersendiri dalam bahasa Indonesia.
- source_word: בְּגַאֲוָתוֹ
  choice: karena luapannya
  rationale: גאוה dapat berarti keagungan, kesombongan, atau kenaikan/luapan. Dalam gambaran air yang bergemuruh dan berbuih, “luapannya” paling jelas menyampaikan pengertian fisik tanpa meniadakan alternatif leksikal yang dicatat dalam catatan kaki.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah ini ditransliterasikan karena fungsi musikal atau liturgisnya tidak diketahui dengan pasti.
