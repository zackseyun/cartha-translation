  yaml_path: translation/ot/psalms/046/000.yaml
  text: For the choir director. Of the sons of Korah. According to Alamoth[a]. A song.
translation:
  language: id
  text: Untuk pemimpin musik. Dari bani Korah. Menurut Alamot[a]. Sebuah nyanyian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “menurut gadis-gadis,” yakni untuk suara perempuan atau suara tinggi; istilah Ibrani Alamot tampaknya merupakan petunjuk musik atau nama lagu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi penyajian musik. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern tanpa membatasi tugasnya hanya pada paduan suara.
- source_word: לִבְנֵי קֹרַח
  choice: Dari bani Korah
  rationale: Preposisi Ibrani dapat menandai hubungan, kepengarangan, atau penugasan. 'Dari bani Korah' mempertahankan hubungan umum itu dengan bentuk judul yang ringkas, tanpa menjelaskan peran mereka secara lebih khusus.
- source_word: עַל
  choice: Menurut
  rationale: Dalam judul musik, kata ini dapat memperkenalkan lagu, gaya, atau petunjuk penyajian. 'Menurut' mempertahankan fungsi teknis tersebut secara ringkas.
- source_word: עֲלָמוֹת
  choice: Alamot
  rationale: Makna istilah teknis ini tidak pasti; mungkin berkaitan dengan gadis-gadis, suara perempuan atau suara tinggi, ataupun nama lagu. Transliterasi menghindari kepastian semu.
- source_word: שִׁיר
  choice: Sebuah nyanyian
  rationale: Kata ini menyebut jenis gubahan. 'Sebuah nyanyian' alami sebagai label tersendiri dalam judul mazmur.
