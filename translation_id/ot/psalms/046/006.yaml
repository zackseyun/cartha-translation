id: PSA.46.6
reference: Psalms 46:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הָמ֣וּ ג֭וֹיִם מָ֣טוּ מַמְלָכ֑וֹת נָתַ֥ן בְּ֝/קוֹל֗/וֹ תָּמ֥וּג אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he uttered his voice, the earth melted.
translation:
  language: id
  text: Bangsa-bangsa bergolak[a], kerajaan-kerajaan goyah; Ia memperdengarkan suara-Nya, bumi pun meleleh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bangsa-bangsa gempar, kerajaan-kerajaan terguncang.”'
    reason: Alternatif ini menampilkan secara lebih eksplisit nuansa kegaduhan dan guncangan yang terkandung dalam kedua kata kerja Ibrani.
lexical_decisions:
- source_word: הָמוּ
  choice: bergolak
  rationale: Kata kerja ini menyatakan kegaduhan sekaligus gejolak. “Bergolak” mempertahankan gambaran kerusuhan bangsa-bangsa tanpa membatasinya hanya pada bunyi atau secara berlebihan menegaskan permusuhan.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada kelompok-kelompok politik dan sejajar dengan “kerajaan-kerajaan”; “bangsa-bangsa” merupakan padanan yang alami dan tidak memasukkan kontras Yahudi/non-Yahudi.
- source_word: מָטוּ
  choice: goyah
  rationale: Kata ini menggambarkan hilangnya kestabilan atau keadaan yang hampir runtuh. “Goyah” mempertahankan gambaran itu tanpa menafsirkannya sebagai keruntuhan yang sudah selesai.
- source_word: מַמְלָכוֹת
  choice: kerajaan-kerajaan
  rationale: Padanan langsung dan wajar bagi wilayah atau kekuasaan politik yang diperintah sebagai kerajaan.
- source_word: נָתַן בְּקוֹלוֹ
  choice: Ia memperdengarkan suara-Nya
  rationale: Ungkapan Ibrani secara harfiah berarti “Ia memberikan suara-Nya.” Terjemahan ini menyampaikan tindakan ilahi dalam ungkapan Indonesia yang alami sambil mempertahankan penekanan pada suara-Nya.
- source_word: תָּמוּג
  choice: meleleh
  rationale: Kata kerja ini dapat berarti meleleh, mencair, atau kehilangan kekukuhan. “Meleleh” mempertahankan citra puitis tentang bumi yang kehilangan keteguhannya ketika Allah bersuara.
- source_word: אָרֶץ
  choice: bumi
  rationale: Cakupan mazmur dan kesejajaran dengan bangsa-bangsa serta kerajaan-kerajaan mendukung pengertian universal “bumi,” bukan pengertian setempat “negeri.”
theological_decisions:
- issue: Subjek tersirat pada נָתַן
  choice: Ia, merujuk kepada Allah
  alternative: TUHAN, berdasarkan konteks sekitar
  rationale: Bahasa Ibrani hanya menyatakan subjek maskulin tunggal secara tersirat. “Ia” mempertahankan keringkasan teks dan membiarkan konteks mengenali subjek sebagai Allah, tanpa memasukkan nama ilahi yang tidak tertulis dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis yang bermartabat. Bentuk “Ia” dan “suara-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah, sedangkan “pun” memperjelas akibat langsung tanpa menambah hubungan teologis di luar teks.
