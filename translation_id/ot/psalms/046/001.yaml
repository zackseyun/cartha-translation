  text: אֱלֹהִ֣ים לָ֭/נוּ מַחֲסֶ֣ה וָ/עֹ֑ז עֶזְרָ֥ה בְ֝/צָר֗וֹת נִמְצָ֥א מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/001.yaml
  text: God is our refuge and strength[b][a], a very present help in troubles.
translation:
  language: id
  text: Allah adalah tempat perlindungan dan kekuatan bagi kita, pertolongan yang sungguh terbukti dalam kesesakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pertolongan dalam kesesakan, didapati dengan sangat.” Ungkapan Ibrani yang padat ini menyatakan bahwa dalam kesesakan Allah didapati atau terbukti sebagai pertolongan yang sungguh tersedia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, konstruksi ini menunjuk secara tunggal kepada Allah Israel; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: לָנוּ
  choice: bagi kita
  rationale: Preposisi לְ dengan akhiran orang pertama jamak secara langsung berarti “bagi kita” atau “untuk kita”; bentuk ini alami dalam struktur predikatif bahasa Indonesia.
- source_word: מַחֲסֶה
  choice: tempat perlindungan
  rationale: Kata ini menunjuk kepada tempat berlindung atau perlindungan yang memberi rasa aman; “tempat perlindungan” mempertahankan citra konkretnya.
- source_word: וָעֹז
  choice: dan kekuatan
  rationale: עֹז lazim berarti kekuatan atau keperkasaan. “Kekuatan” mempertahankan bentuk nomina abstrak dan berpasangan secara alami dengan “tempat perlindungan”.
- source_word: עֶזְרָה
  choice: pertolongan
  rationale: Nomina ini berarti pertolongan atau bantuan. “Pertolongan” alami dalam bahasa Indonesia dan tidak mengubahnya menjadi pelaku, seperti “penolong”.
- source_word: בְצָרוֹת
  choice: dalam kesesakan
  rationale: Bentuk jamak צָרוֹת menunjuk kepada berbagai keadaan terjepit atau penuh tekanan. Bahasa Indonesia lazim memakai nomina kolektif “kesesakan” tanpa harus menandai jamak secara eksplisit.
- source_word: נִמְצָא
  choice: terbukti
  rationale: Bentuk Niphal dari מצא secara harfiah dapat berarti “didapati” dan secara idiomatis “terbukti” atau “ternyata ada”. “Terbukti” menghasilkan bahasa Indonesia yang wajar tanpa menghilangkan gagasan bahwa pertolongan Allah dialami sebagai nyata.
- source_word: מְאֹד
  choice: sungguh
  rationale: Adverbia ini memberi penegasan kuat. “Sungguh” menyampaikan intensitas tersebut secara alami dan bermartabat dalam konteks puitis.
theological_decisions:
- issue: Struktur dan makna frasa penutup עֶזְרָה בְצָרוֹת נִמְצָא מְאֹד
  choice: pertolongan yang sungguh terbukti dalam kesesakan
  alternative: pertolongan dalam kesesakan, didapati dengan sangat
  rationale: Bahasa Ibrani ringkas dan secara harfiah terasa tidak lengkap dalam bahasa Indonesia. Terjemahan utama mempertahankan עֶזְרָה sebagai “pertolongan” dan נִמְצָא sebagai pengalaman bahwa pertolongan itu terbukti, tanpa secara sempit menetapkan apakah penekanannya terutama pada kehadiran, kesiapsediaan, atau keandalan Allah. Catatan kaki mempertahankan bentuk yang lebih harfiah dan menjelaskan rentang maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Susunan kalimat dibuat mudah dipahami dalam pembacaan umum, sementara ketegangan dalam frasa Ibrani terakhir dijaga melalui pilihan “terbukti” dan catatan kaki.
