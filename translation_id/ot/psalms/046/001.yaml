  terminology: “Allah,” “tempat perlindungan,” “kekuatan,” “pertolongan,” dan “kesesakan” konsisten dengan register Alkitab bahasa Indonesia yang modern dan standar. Istilah-istilah ini tidak memasukkan penegasan doktrinal di luar teks.
