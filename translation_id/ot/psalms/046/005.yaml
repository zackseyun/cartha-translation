  text: אֱלֹהִ֣ים בְּ֭/קִרְבָּ/הּ בַּל תִּמּ֑וֹט יַעְזְרֶ֥/הָ אֱ֝לֹהִ֗ים לִ/פְנ֥וֹת בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/005.yaml
  text: God is within her[a]; she will not be moved[c][b]. God will help her when morning dawns.
translation:
  language: id
  text: Allah ada di tengah-tengahnya[a]; ia tidak akan goyah[b]. Allah akan menolongnya ketika fajar menyingsing.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ada di dalamnya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak akan terguncang” atau “tidak akan terhuyung.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “pada beralihnya pagi”; maksudnya, saat fajar atau ketika pagi tiba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks mazmur ini, bentuk yang secara morfologis jamak tersebut jelas menunjuk kepada Allah Israel yang esa. Dalam bahasa Indonesia, “Allah” merupakan padanan baku dan alami.
- source_word: בְּקִרְבָּהּ
  choice: ada di tengah-tengahnya
  rationale: Frasa ini menyatakan kehadiran Allah di bagian dalam atau di tengah kota. “Ada di tengah-tengahnya” alami dalam bahasa Indonesia dan mempertahankan pronomina yang mengacu pada kota dalam konteks sebelumnya.
- source_word: בַּל
  choice: tidak
  rationale: Partikel puitis ini menegasikan verba berikutnya. “Tidak” mempertahankan makna tanpa menambahkan penekanan yang tidak dinyatakan secara eksplisit.
- source_word: תִּמּוֹט
  choice: akan goyah
  rationale: Bentuk Nifal dari מוט menggambarkan keadaan terguncang, terhuyung, atau kehilangan kestabilan. “Akan goyah” mempertahankan citra kestabilan kota dan terdengar wajar dalam puisi Indonesia.
- source_word: יַעְזְרֶהָ
  choice: akan menolongnya
  rationale: Bentuk imperfek ini menyatakan tindakan Allah yang akan terjadi atau yang kepastiannya ditegaskan. “Akan menolongnya” ringkas dan langsung.
- source_word: לִפְנוֹת בֹּקֶר
  choice: ketika fajar menyingsing
  rationale: Ungkapan Ibrani secara harfiah berkaitan dengan beralih atau munculnya pagi. “Ketika fajar menyingsing” menyampaikan waktu datangnya pagi secara alami sambil mempertahankan gambaran puitisnya.
theological_decisions:
- issue: Acuan sufiks dan pronomina tunggal feminin
  choice: Mempertahankan acuan pronominal kepada kota dengan “-nya” dan “ia”.
  alternative: Mengganti pronomina secara eksplisit dengan “kota itu” atau menafsirkannya sebagai komunitas umat Allah secara umum.
  rationale: Tata bahasa Ibrani menunjuk secara alami kepada kota Allah dalam konteks sebelumnya. Karena bahasa Indonesia tidak menandai gender pada pronomina, terjemahan mempertahankan acuan tersebut tanpa memasukkan penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Susunan klausa Ibrani dipertahankan, sedangkan ungkapan waktu diterjemahkan secara idiomatis. Pronomina tidak diperjelas menjadi “kota itu” agar hubungan dengan konteks dan kadar implisit teks sumber tetap terjaga.
