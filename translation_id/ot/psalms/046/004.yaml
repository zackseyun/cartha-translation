  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: id
  text: Sebuah sungai—aliran-alirannya menggembirakan kota Allah, tempat-tempat kediaman kudus Yang Mahatinggi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk jamak, “tempat-tempat kediaman”; bentuk itu mungkin menunjuk pada seluruh kawasan kudus atau berfungsi sebagai bentuk jamak intensif.
    reason: alternative_reading
lexical_decisions:
- source_word: נָהָר
  choice: Sebuah sungai
  rationale: Nomina ini tidak memakai artikel. Terjemahan takrif tak tentu mempertahankan bentuk pembukaan puitis Ibrani tanpa perlu menambahkan verba eksistensial.
- source_word: פְּלָגָיו
  choice: aliran-alirannya
  rationale: Bentuk jamak dengan sufiks orang ketiga maskulin tunggal merujuk kembali kepada sungai. 'Aliran-aliran' alami dalam bahasa Indonesia dan menyampaikan cabang-cabang aliran sungai.
- source_word: יְשַׂמְּחוּ
  choice: menggembirakan
  rationale: Bentuk Piel jamak menyatakan bahwa aliran-aliran itu menyebabkan kota bersukacita; 'menggembirakan' mempertahankan daya kausatif tersebut.
- source_word: עִיר אֱלֹהִים
  choice: kota Allah
  rationale: Ungkapan konstruksi ini secara langsung dan wajar diterjemahkan 'kota Allah'.
- source_word: קְדֹשׁ
  choice: kudus
  rationale: Dipahami secara atributif dalam frasa aposisional berikutnya, tanpa memaksakannya menjadi klausa tersendiri.
- source_word: מִשְׁכְּנֵי
  choice: tempat-tempat kediaman
  rationale: Bentuk Ibraninya jamak konstruksi. Bentuk jamak dipertahankan demi transparansi terhadap teks sumber, walaupun bentuk tunggal lebih lazim dalam bahasa Indonesia.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Gelar ilahi ini diterjemahkan dengan bentuk baku dan mudah dikenali dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah bentuk jamak מִשְׁכְּנֵי perlu diperhalus menjadi bentuk tunggal yang merujuk kepada tempat hadirat Allah di Sion
  choice: 'Mempertahankan bentuk jamak: ''tempat-tempat kediaman'''
  alternative: '''tempat kediaman'' atau ''tempat suci'''
  rationale: Teks Ibrani memakai bentuk jamak, yang mungkin bersifat intensif atau menunjuk pada kompleks kawasan kudus. Mempertahankan bentuk jamak menghindari penetapan tafsiran yang tidak dinyatakan secara eksplisit.
- issue: Hubungan frasa 'tempat-tempat kediaman kudus milik Yang Mahatinggi' dengan 'kota Allah'
  choice: Menyajikannya sebagai aposisi deskriptif setelah 'kota Allah'
  alternative: Memahaminya sebagai klausa terpisah atau mengubahnya menjadi 'tempat kudus kediaman Yang Mahatinggi'
  rationale: Susunan aposisional sesuai dengan puisi Ibrani dan mempertahankan hubungan sintaksis tanpa menambahkan kopula yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Tanda pisah mempertahankan pembukaan tanpa verba dalam teks Ibrani. Bentuk jamak yang agak tidak biasa sengaja dipertahankan dan dijelaskan dalam catatan kaki.
