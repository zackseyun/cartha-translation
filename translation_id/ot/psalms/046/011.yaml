source:
  edition: WLC
  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/011.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
translation:
  language: id
  text: Yahweh Bala Tentara menyertai kita[a]; Allah Yakub adalah benteng tinggi bagi kita[b]. Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yahweh semesta alam menyertai kita.” Kata Ibrani צְבָאוֹת mengacu pada pasukan atau bala tentara, sering kali dengan nuansa pasukan surgawi; secara tradisional ungkapan ini juga diterjemahkan “semesta alam”.
    reason: lexical_alternative
  - marker: b
    text: “Benteng tinggi” juga dapat diterjemahkan “tempat perlindungan” atau “kota benteng”. Kata Ibrani מִשְׂגָּב menunjuk pada tempat tinggi yang aman dan memberikan perlindungan.
    reason: lexical_alternative
  - marker: c
    text: “Sela” adalah istilah liturgis atau musikal Ibrani yang arti tepatnya tidak diketahui; karena itu istilah ini dibiarkan sebagai transliterasi.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar “TUHAN”, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: צְבָאוֹת
  choice: Bala Tentara
  rationale: Kata ini menunjuk pada pasukan atau bala tentara, kerap dengan nuansa pasukan surgawi. “Bala Tentara” mempertahankan gambaran militer dan lebih transparan daripada ungkapan tradisional “semesta alam”.
- source_word: עִמָּנוּ
  choice: menyertai kita
  rationale: Secara harfiah berarti “bersama kita”. Dalam bahasa Indonesia, “menyertai kita” mengungkapkan kehadiran yang melindungi secara alami tanpa mengubah inti maknanya.
- source_word: מִשְׂגָּב
  choice: benteng tinggi
  rationale: Kata ini menggambarkan tempat perlindungan yang aman dan tinggi atau berkubu. “Benteng tinggi” mempertahankan unsur perlindungan sekaligus ketinggian.
- source_word: לָנוּ
  choice: bagi kita
  rationale: 'Preposisi ל di sini menyatakan manfaat atau kepentingan: Allah menjadi benteng demi perlindungan kita.'
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Allah Yakub
  rationale: Bentuk konstruk Ibrani secara wajar diterjemahkan “Allah Yakub” dan mempertahankan identifikasi perjanjian tersebut.
- source_word: סֶלָה
  choice: Sela
  rationale: Karena arti tepat istilah liturgis atau musikal ini tidak pasti, istilah tersebut ditransliterasikan tanpa ditafsirkan secara spekulatif.
theological_decisions:
- issue: Penerjemahan gelar ilahi יְהוָה צְבָאוֹת
  choice: Yahweh Bala Tentara
  alternative: Yahweh semesta alam; TUHAN semesta alam
  rationale: Teks memakai nama pribadi ilahi יְהוָה dan kata צְבָאוֹת yang secara leksikal berarti bala tentara atau pasukan. Pilihan ini mempertahankan nama ilahi serta citra kekuasaan militer, tanpa menggantinya dengan gelar tradisional.
- issue: Makna מִשְׂגָּב
  choice: benteng tinggi bagi kita
  alternative: tempat perlindungan bagi kita; kota benteng kita
  rationale: “Benteng tinggi” menjaga metafora tempat aman yang tinggi dan berkubu, sedangkan “tempat perlindungan” berisiko meratakan unsur spasial dan pertahanannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dua klausa puitis dipertahankan, dengan kesejajaran antara kehadiran Yahweh dan perlindungan Allah Yakub. Bentuk “Sela” mengikuti ejaan Indonesia. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
