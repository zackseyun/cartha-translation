  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: id
  text: Yahweh, Allah bala tentara, menyertai kita; Allah Yakub adalah benteng yang kokoh bagi kita.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut ungkapan tradisional, “TUHAN semesta alam menyertai kita.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: צְבָאוֹת
  choice: Panglima Semesta
  rationale: Dalam rangkaian dengan יְהוָה, istilah ini membentuk gelar ilahi. 'Panglima Semesta' terdengar alami dalam bahasa Indonesia dan menyampaikan bahwa Yahweh memerintah bala tentara surgawi maupun segala kekuatan di alam semesta, tanpa memakai ungkapan 'TUHAN semesta alam' yang dapat mengaburkan unsur צְבָאוֹת.
- source_word: עִמָּנוּ
  choice: menyertai kita
  rationale: Mengungkapkan kehadiran yang berpihak, melindungi, dan menyertai umat; lebih alami dalam laras mazmur daripada terjemahan harfiah 'ada bersama kita'.
- source_word: מִשְׂגָּב
  choice: benteng perlindungan
  rationale: Kata ini menunjuk tempat tinggi yang aman atau kubu pertahanan. Ungkapan ini mempertahankan sekaligus gagasan perlindungan dan kekokohan.
- source_word: לָנוּ
  choice: bagi kita
  rationale: 'Preposisi ל dengan sufiks orang pertama jamak menyatakan hubungan atau manfaat: Allah menjadi benteng demi umat-Nya.'
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Allah Yakub
  rationale: Terjemahan langsung konstruksi kepunyaan yang mempertahankan kaitan perjanjian dengan Yakub sebagai leluhur Israel.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna atau fungsi teknis istilah ini tidak pasti; karena itu, transliterasi lebih tepat daripada terjemahan interpretatif.
theological_decisions:
- issue: Penerjemahan gelar יְהוָה צְבָאוֹת
  choice: Yahweh Panglima Semesta
  alternative: Yahweh Penguasa Bala Tentara; TUHAN semesta alam
  rationale: Pilihan ini mempertahankan nama pribadi Yahweh dan daya militer-kosmis צְבָאוֹת, tetapi menyatakannya sebagai gelar yang wajar dan bermartabat dalam bahasa Indonesia. Catatan kaki menyediakan padanan tradisional tanpa menjadikannya teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. Paralelisme dua klausa dipertahankan; tanda titik sebelum 'Sela' memberi jeda alami. Penanda catatan kaki [a] ditempatkan pada klausa yang memiliki padanan tradisional.
