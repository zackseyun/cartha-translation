  text: Therefore we will not fear though the earth changes[b][a], though the mountains slip into the heart of the seas.
translation:
  language: id
  text: Karena itu, kita tidak akan takut sekalipun bumi berubah[a], sekalipun gunung-gunung berguncang[b] di tengah lautan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sekalipun bumi berganti” atau “ketika bumi diubah.” Kata Ibrani ini dapat berarti berubah atau bertukar; dalam konteks ini, gambaran tersebut menunjukkan bumi kehilangan kestabilannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “sekalipun gunung-gunung goyah di tengah lautan.” Kata Ibrani ini dapat menggambarkan gunung-gunung yang terguncang, goyah, atau bergeser dari kestabilannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai kesimpulan dari pengakuan pada ayat sebelumnya bahwa Allah adalah tempat perlindungan dan kekuatan; ungkapan ini alami dan mempertahankan hubungan logisnya.
- source_word: לֹא נִירָא
  choice: kita tidak akan takut
  rationale: Bentuk imperfek orang pertama jamak mengungkapkan keyakinan atau ketetapan dalam konteks ini; bentuk futur mempertahankan nuansa tersebut.
- source_word: בְּהָמִיר
  choice: sekalipun ... berubah
  rationale: Infinitif dengan בְּ menyatakan keadaan atau waktu, sedangkan מוּר dapat berarti berubah atau ditukar. 'Berubah' dekat dengan makna leksikal dan, dalam gambaran kosmis ini, menyiratkan terguncangnya tatanan bumi tanpa mempersempit maknanya.
- source_word: אָרֶץ
  choice: bumi
  rationale: Konteks gunung dan lautan menunjukkan cakupan kosmis, sehingga 'bumi' lebih tepat daripada 'negeri' atau 'tanah'.
- source_word: וּבְמוֹט
  choice: sekalipun ... berguncang
  rationale: מוֹט menggambarkan hilangnya kestabilan—bergoyang, terguncang, atau bergeser. 'Berguncang' alami dalam bahasa Indonesia dan tidak memaksakan mekanisme gerak tertentu.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Mempertahankan bentuk jamak dan gambaran puitis sumber.
- source_word: בְּלֵב
  choice: ke tengah
  rationale: Secara harfiah 'ke dalam hati'; sebagai idiom ruang berarti bagian terdalam atau tengah. 'Ke tengah' mempertahankan arah gerak secara alami dalam bahasa Indonesia.
- source_word: יַמִּים
  choice: lautan
  rationale: Nomina Ibrani berbentuk jamak. 'Lautan' menyampaikan bentangan laut yang luas dan cocok dengan register puisi Indonesia.
