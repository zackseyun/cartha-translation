source:
  edition: WLC
  text: לְֽכוּ חֲ֭זוּ מִפְעֲל֣וֹת יְהוָ֑ה אֲשֶׁר שָׂ֖ם שַׁמּ֣וֹת בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/008.yaml
  text: Come, see the works of the LORD, who has set desolations in the earth.
translation:
  language: id
  text: Mari, lihatlah perbuatan-perbuatan TUHAN, yang telah mendatangkan kehancuran di bumi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  choice: Mari
  rationale: Bentuk imperatif jamak ini secara harfiah berarti 'pergilah', tetapi dalam ajakan yang diikuti חֲזוּ berfungsi alami sebagai undangan 'Mari' dalam bahasa Indonesia.
- source_word: חֲזוּ
  choice: lihatlah
  rationale: Imperatif jamak dari חזה mengajak para pendengar menyaksikan atau memperhatikan; 'lihatlah' mempertahankan bentuk perintah dengan bahasa yang wajar.
- source_word: מִפְעֲלוֹת
  choice: perbuatan-perbuatan
  rationale: Bentuk jamak ini menunjuk pada karya atau tindakan yang dilakukan TUHAN; terjemahan ini mempertahankan cakupan umum istilah sumber.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk menyatakan nama ilahi YHWH dengan huruf kapital, tanpa menambahkan penafsiran denominatif.
- source_word: שָׂם
  choice: telah mendatangkan
  rationale: Secara dasar berarti 'menaruh/menetapkan/menjadikan'. Dalam konstruksi dengan שַׁמּוֹת, 'mendatangkan kehancuran' menyampaikan tindakan kausatif secara alami tanpa menghapus bobot bahwa kehancuran itu dikaitkan langsung dengan tindakan TUHAN.
- source_word: שַׁמּוֹת
  choice: kehancuran
  rationale: Nomina jamak ini menyatakan keadaan atau hasil berupa tempat-tempat yang hancur dan tandus. Bahasa Indonesia lazim memakai nomina kolektif tunggal 'kehancuran'.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: אֶרֶץ dapat berarti 'bumi' atau 'negeri'. Cakupan mazmur yang luas mendukung 'bumi', sambil tetap mempertahankan kemungkinan rujukan umum pada dunia yang didiami.
theological_decisions:
- issue: TUHAN sebagai pelaku kehancuran
  choice: yang telah mendatangkan kehancuran
  alternative: yang telah membuat tempat-tempat tandus
  rationale: Klausa relatif אֲשֶׁר שָׂם mempertahankan TUHAN sebagai pelaku. Terjemahan tidak melunakkan ketegangan teologis dengan mengubah kehancuran menjadi akibat tanpa pelaku atau dengan menjadikannya sekadar izin pasif.
- issue: Cakupan בָּאָרֶץ
  choice: di bumi
  alternative: di negeri
  rationale: Konteks Mazmur 46 berbicara mengenai bangsa-bangsa dan bumi secara luas, sehingga 'di bumi' paling sesuai, meskipun leksem Ibrani sendiri dapat juga berarti 'negeri'.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk ajakan 'Mari, lihatlah' alami bagi pembaca umum; kapitalisasi 'TUHAN' mengikuti tradisi penerjemahan Indonesia untuk tetragramaton.
