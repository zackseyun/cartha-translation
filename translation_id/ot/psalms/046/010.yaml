id: PSA.46.10
reference: Psalms 46:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַרְפּ֣וּ וּ֭/דְעוּ כִּי אָנֹכִ֣י אֱלֹהִ֑ים אָר֥וּם בַּ֝/גּוֹיִ֗ם אָר֥וּם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/010.yaml
  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: id
  text: Berhentilah[a] dan ketahuilah bahwa Akulah Allah. Aku akan ditinggikan[b] di antara bangsa-bangsa; Aku akan ditinggikan di bumi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Diamlah,” “Lepaskanlah,” atau “Tenanglah”; kata perintah Ibrani ini dapat berarti mengendur, berhenti, atau melepaskan pegangan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “Aku ditinggikan.” Bentuk Ibraninya dapat dipahami dengan daya kini atau masa depan dalam konteks ini; hal yang sama berlaku pada pengulangan berikutnya.
    reason: alternative_reading
  - marker: c
    text: “Bumi” dapat juga diterjemahkan “negeri,” tetapi cakupan mazmur yang lebih luas mendukung pengertian global.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  choice: Berhentilah
  rationale: Bentuk perintah dari רפה berarti mengendur, melepaskan, atau berhenti. Dalam konteks pergolakan bangsa-bangsa, “Berhentilah” secara alami menyampaikan seruan untuk menghentikan perlawanan atau upaya manusia tanpa membatasinya menjadi sekadar keheningan batin.
- source_word: וּדְעוּ
  choice: dan ketahuilah
  rationale: ידע paling langsung berarti “mengetahui,” dengan kemungkinan nuansa mengakui atau menyadari. “Ketahuilah” mempertahankan bentuk perintah dan keluasan maknanya.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang harus diketahui; “bahwa” merupakan penghubung yang alami dalam bahasa Indonesia.
- source_word: אָנֹכִי אֱלֹהִים
  choice: Akulah Allah
  rationale: Bentuk “Akulah” secara alami mempertahankan penekanan pada pronomina אָנֹכִי tanpa menambahkan kata penegas yang tidak ada dalam teks.
- source_word: אָרוּם
  choice: Aku akan ditinggikan
  rationale: Bentuk imperfek Qal dari רום dapat menyatakan pengagungan yang pasti atau berdaya masa depan. “Akan ditinggikan” mempertahankan gambaran ketinggian dan sesuai dengan pernyataan kepastian dalam konteks.
- source_word: בַּגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם menunjuk kepada bangsa-bangsa sebagai kelompok-kelompok manusia atau politik. “Di antara bangsa-bangsa” alami dan mempertahankan cakupan universal mazmur.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: אֶרֶץ dapat berarti “negeri” atau “bumi.” Paralel dengan bangsa-bangsa mendukung cakupan global, sehingga “bumi” paling sesuai, sementara “di” mewakili preposisi Ibrani secara wajar.
theological_decisions:
- issue: Daya perintah הַרְפּוּ
  choice: Seruan untuk berhenti atau melepaskan upaya/perlawanan di hadapan kedaulatan Allah
  alternative: Seruan khusus untuk menghentikan peperangan, atau seruan batin untuk berdiam dalam perenungan
  rationale: Kata kerjanya sendiri mencakup gagasan mengendur, melepaskan, dan berhenti. Konteks mazmur menyoroti kekacauan serta bangsa-bangsa yang bergolak. “Berhentilah” tidak mempersempit perintah itu menjadi meditasi pribadi maupun tindakan militer saja.
- issue: Nilai kala/aspek אָרוּם
  choice: 'Kepastian pengagungan Allah dengan daya masa depan: “Aku akan ditinggikan”'
  alternative: 'Keadaan kini: “Aku ditinggikan” atau “Aku luhur”'
  rationale: Imperfek Ibrani memungkinkan nuansa masa depan atau pernyataan yang dipastikan. Terjemahan utama memakai bentuk masa depan, sedangkan catatan kaki mempertahankan kemungkinan bentuk kini agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. “Berhentilah” dipilih daripada ungkapan yang hanya menyiratkan kontemplasi pribadi. Penekanan אָנֹכִי disampaikan secara alami melalui “Akulah.” Paralelisme kedua baris dipertahankan dengan mengulang “Aku akan ditinggikan.”
