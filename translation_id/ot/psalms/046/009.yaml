  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: id
  text: Dia menghentikan peperangan sampai ke ujung bumi; Dia mematahkan busur dan memotong tombak hingga putus; Dia membakar pedati-pedati dengan api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kereta-kereta perang.” Kata Ibrani ini biasanya berarti pedati, kereta angkut, atau gerobak, tetapi konteks militer memungkinkan pengertian “kereta perang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּית מִלְחָמוֹת
  choice: menghentikan peperangan
  rationale: Bentuk kausatif מַשְׁבִּית menyatakan bahwa Dia menyebabkan peperangan berhenti. Ungkapan ini mempertahankan daya kausatifnya secara alami dalam bahasa Indonesia.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: sampai ke ujung bumi
  rationale: Terjemahan ini dekat dengan bentuk Ibrani yang tunggal dan tetap menyampaikan jangkauan sampai ke batas terjauh bumi.
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: mematahkan busur
  rationale: Kata kerja Piel יְשַׁבֵּר menggambarkan penghancuran busur; 'mematahkan' merupakan padanan yang langsung dan wajar.
- source_word: וְקִצֵּץ חֲנִית
  choice: memotong tombak hingga putus
  rationale: קִצֵּץ berarti memotong atau memenggal hingga terpisah. 'Hingga putus' menjelaskan hasil penghancuran tombak tanpa menambahkan jumlah potongan yang tidak dinyatakan teks.
- source_word: עֲגָלוֹת
  choice: kereta-kereta angkut
  rationale: Kata ini lazimnya menunjuk pada kereta angkut, pedati, atau gerobak, bukan istilah Ibrani yang biasa untuk kereta perang. 'Kereta angkut' mempertahankan arti leksikal sambil cocok dengan konteks perlengkapan perang.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: membakar ... dengan api
  rationale: Ungkapan ini mempertahankan gambaran konkret bahasa Ibrani dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna עֲגָלוֹת dalam konteks militer
  choice: kereta-kereta angkut
  alternative: kereta-kereta perang
  rationale: Tidak ada persoalan doktrinal yang dipertaruhkan. Teks memakai kata yang biasanya berarti kereta angkut atau pedati, bukan istilah umum untuk kereta perang. Karena konteksnya militer, kemungkinan 'kereta perang' dicatat dalam catatan kaki tanpa menggantikan arti leksikal utama.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Pengulangan 'Dia' mempertahankan penekanan puitis pada tindakan Allah, sedangkan tiga klausa sejajar menjaga irama ayat.
