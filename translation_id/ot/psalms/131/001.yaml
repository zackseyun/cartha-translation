  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לְ/דָ֫וִ֥ד יְהוָ֤ה לֹא גָבַ֣הּ לִ֭בִּ/י וְ/לֹא רָמ֣וּ עֵינַ֑/י וְ/לֹֽא הִלַּ֓כְתִּי בִּ/גְדֹל֖וֹת וּ/בְ/נִפְלָא֣וֹת מִמֶּֽ/נִּי׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/001.yaml
  text: 'A Song of Ascents[a]. Of David.

    Yahweh, my heart is not proud, and my eyes are not raised high[b]; I have not walked in things too great and too wondrous for me.'
translation:
  language: id
  text: 'Nyanyian Pendakian. Dari Daud.[a]


    Yahweh, hatiku tidak sombong,

    dan mataku tidak memandang dengan angkuh;

    aku tidak menyibukkan diri dengan perkara-perkara yang terlalu besar

    dan terlalu ajaib bagiku.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Oleh Daud” atau “Untuk Daud”; judul Ibrani ini dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: alternative_reading
  - marker: b
    text: Atau “yang melampaui diriku.” Ungkapan Ibrani ini menunjuk pada perkara-perkara yang melampaui tempat atau kemampuan yang semestinya bagi si pembicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Pendakian
  rationale: Mempertahankan arti dasar מַעֲלוֹת sebagai ‘pendakian’ dan fungsinya sebagai judul kumpulan mazmur, tanpa mempersempitnya menjadi nyanyian ziarah.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan ini cukup alami sebagai judul dalam bahasa Indonesia dan tidak secara tegas membatasi לְ pada kepengarangan saja; kemungkinan hubungan atau peruntukan dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: גָבַהּ לִבִּי
  choice: hatiku tidak sombong
  rationale: Ungkapan harfiah tentang hati yang ‘tinggi’ secara idiomatis menyatakan kesombongan; pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: רָמוּ עֵינַי
  choice: mataku tidak memandang tinggi
  rationale: Mempertahankan citra mata yang tinggi sekaligus menyiratkan sikap angkuh, tanpa mengganti citra itu sepenuhnya dengan tafsiran.
- source_word: הִלַּכְתִּי
  choice: aku tidak menyibukkan diri
  rationale: Dalam konteks ini הלך menunjuk pada keterlibatan atau perilaku seseorang. Terjemahan ini menyampaikan maksudnya secara alami karena ‘berjalan dalam perkara-perkara’ tidak idiomatis dalam bahasa Indonesia.
- source_word: בִּגְדֹלוֹת וּבְנִפְלָאוֹת
  choice: dengan perkara-perkara yang terlalu besar dan terlalu ajaib
  rationale: Bentuk jamak substantival menunjuk pada berbagai perkara; ‘terlalu’ memperoleh daya bandingnya dari מִמֶּנִּי dan menunjukkan bahwa perkara itu melampaui ukuran si pembicara.
- source_word: מִמֶּנִּי
  choice: bagiku
  rationale: Pilihan ini alami sesudah ‘terlalu besar’ dan ‘terlalu ajaib’, sambil mempertahankan kemungkinan makna bahwa perkara tersebut berada di luar tempat, ukuran, atau kemampuan si pembicara.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Hubungan Daud dengan mazmur dalam לְדָוִד
  choice: Dari Daud
  alternative: Oleh Daud; Untuk Daud; Milik Daud
  rationale: Preposisi לְ dalam judul mazmur dapat menunjukkan kepengarangan, hubungan, atau peruntukan. Teks utama dan catatan kaki tidak menetapkan salah satu kemungkinan secara mutlak.
- issue: Ruang lingkup perkara yang ‘terlalu besar dan terlalu ajaib’
  choice: Tidak diperjelas sebagai misteri ilahi atau ambisi sosial tertentu
  alternative: Menafsirkannya secara khusus sebagai rahasia Allah atau kedudukan yang terlalu tinggi
  rationale: Teks Ibrani membiarkan jenis perkaranya umum. Terjemahan mempertahankan keluasan dan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Paralelisme puitis dipertahankan melalui pemenggalan baris. ‘Memandang tinggi’ menjaga citra Ibrani, sedangkan ‘menyibukkan diri’ dipilih agar makna idiom הלך tetap alami dalam bahasa Indonesia.
