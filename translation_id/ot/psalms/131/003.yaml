  yaml_path: translation/ot/psalms/131/003.yaml
  text: Israel[a], hope in Yahweh from now and forever.
translation:
  language: id
  text: Israel, berharaplah kepada Yahweh mulai sekarang dan selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah Israel berharap kepada Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַחֵל
  choice: berharaplah
  rationale: Bentuk imperfek/jusif ini berfungsi sebagai ajakan. Bentuk imperatif bahasa Indonesia menyampaikan daya seruan secara alami, sementara 'berharap' mempertahankan unsur penantian penuh kepercayaan.
- source_word: יִשְׂרָאֵל
  choice: Hai Israel
  rationale: Nama umat perjanjian dipertahankan sebagai nama diri; partikel 'Hai' menandai sapaan langsung yang tersirat dalam pembacaan eksortatif.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini secara harfiah mengarah 'kepada'; bersama יחל, frasa tersebut menyatakan bahwa Yahweh adalah tujuan atau tumpuan pengharapan. 'Berharap kepada' alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: מֵעַתָּה
  choice: mulai sekarang
  rationale: Ungkapan ini secara alami menyatakan titik awal waktu dalam bahasa Indonesia modern.
- source_word: וְעַד עוֹלָם
  choice: dan selama-lamanya
  rationale: Ungkapan idiomatis ini menyatakan kelangsungan tanpa akhir; 'selama-lamanya' sesuai dengan ragam mazmur yang luhur namun tetap mudah dipahami.
theological_decisions:
- issue: Bentuk ajakan pada awal ayat
  choice: 'Sapaan langsung: ''Hai Israel, berharaplah kepada Yahweh'''
  alternative: '''Biarlah Israel berharap kepada Yahweh'''
  rationale: Bentuk Ibrani dapat dipahami sebagai jusif orang ketiga atau diwujudkan secara idiomatis sebagai seruan langsung kepada Israel. Teks utama memakai sapaan langsung agar alami dan kuat dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan kemungkinan bentuk jusif tanpa mengubah makna teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Hai' dipakai untuk memperjelas vokatif; 'selama-lamanya' mempertahankan corak puitis mazmur. Penanda catatan kaki ditempatkan sesudah kalimat yang diberi catatan.
