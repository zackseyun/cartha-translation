  text: A Song of Ascents[b][a]. Of David.
translation:
  language: id
  text: 'Nyanyian Ziarah. Dari Daud.[a]


    TUHAN, hatiku tidak tinggi hati,

    dan mataku tidak memandang dengan angkuh.

    Aku tidak menyibukkan diri dengan perkara-perkara besar

    atau dengan hal-hal yang terlalu ajaib bagiku.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Oleh Daud” atau “Untuk Daud”; keterangan Ibrani ini dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: alternative_reading
  - marker: b
    text: Atau “yang melampaui aku.” Ungkapan Ibrani ini merujuk pada perkara-perkara yang melampaui kedudukan atau kemampuan yang patut bagi penutur.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Ziarah
  rationale: Secara harfiah berarti “nyanyian pendakian”. Dalam konteks kumpulan Mazmur 120–134, ungkapan ini secara alami dipahami sebagai nyanyian yang berkaitan dengan perjalanan naik menuju Yerusalem, sehingga “Ziarah” menyampaikan fungsi judulnya dalam bahasa Indonesia modern.
- source_word: גָבַהּ לִבִּי
  choice: hatiku tidak tinggi
  rationale: Mempertahankan metafora Ibrani tentang hati yang “tinggi”, yakni sikap meninggikan diri, tanpa langsung menggantinya dengan istilah abstrak.
- source_word: רָמוּ עֵינַי
  choice: mataku tidak memandang dengan angkuh
  rationale: Sumber secara harfiah menyebut mata yang “tinggi”. Rumusan ini mempertahankan citra mata sekaligus menjelaskan makna sikap angkuh secara wajar dalam bahasa Indonesia.
- source_word: הִלַּכְתִּי בִּגְדֹלוֹת
  choice: Aku tidak mengejar perkara-perkara besar
  rationale: Kata kerjanya secara harfiah berarti “berjalan”, tetapi dengan preposisi ini menunjuk pada melibatkan atau menyibukkan diri dalam sesuatu. “Mengejar” menyampaikan tindakan mengarahkan diri kepada perkara besar tanpa mengubahnya menjadi klaim tentang pengetahuan semata.
- source_word: נִפְלָאוֹת מִמֶּנִּי
  choice: hal-hal yang terlalu ajaib bagiku
  rationale: Menjaga nuansa נִפְלָאוֹת sebagai hal yang luar biasa atau ajaib, sementara מִמֶּנִּי menunjukkan bahwa hal-hal itu melampaui kedudukan atau kemampuan penutur.
theological_decisions:
- issue: Makna לְדָוִד dalam keterangan mazmur
  choice: Dari Daud
  alternative: Oleh Daud / Untuk Daud
  rationale: Preposisi לְ dapat menyatakan kepengarangan, hubungan, atau peruntukan. Teks utama memakai bentuk Indonesia yang ringkas, sedangkan catatan kaki mempertahankan kemungkinan lain.
- issue: Sikap penutur terhadap “perkara-perkara besar” dan “hal-hal yang ajaib”
  choice: Tidak mengejar hal-hal yang melampaui dirinya
  alternative: Tidak memikirkan atau menyelidiki misteri ilahi
  rationale: Teks Ibrani tidak secara khusus mengidentifikasi hal-hal itu sebagai misteri teologis. Terjemahan tidak mempersempit cakupannya atau menyiratkan larangan terhadap penyelidikan.
translation_notes:
  register: Bahasa dibuat modern, khidmat, dan mudah dibaca. Baris-baris puitis mempertahankan kesejajaran antara hati, mata, dan tindakan. Bentuk “TUHAN” mewakili nama ilahi יהוה menurut kebiasaan penerjemahan Alkitab bahasa Indonesia.
