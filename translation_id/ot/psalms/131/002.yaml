  yaml_path: translation/ot/psalms/131/002.yaml
  text: Surely I have calmed and quieted my soul[a], like a weaned child with his mother[c][b]; like a weaned child is my soul within me.
translation:
  language: id
  text: Sungguh, aku telah menenangkan dan menenteramkan jiwaku[a], seperti anak yang disapih di dekat ibunya[b]; seperti anak yang disapih, demikianlah jiwaku dalam diriku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika aku tidak menata dan menenangkan jiwaku.” Ungkapan pembuka Ibrani ini merupakan bentuk penegasan idiomatis, yang di sini diterjemahkan “Sungguh.”
    reason: lexical_alternative
  - marker: b
    text: Gambarannya ialah seorang anak yang tidak lagi gelisah meminta disusui, tetapi beristirahat dengan tenang di dekat ibunya.
    reason: cultural_note
  - marker: c
    text: Secara lebih harfiah, “seperti anak yang disapih padaku, demikianlah jiwaku.” Ungkapan Ibraninya sulit; “dalam diriku” menyampaikan kemungkinan maknanya secara alami.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Sungguh
  rationale: Ungkapan ini berfungsi sebagai penegasan idiomatis, bukan sebagai syarat biasa. “Sungguh” menyampaikan kesaksian tegas pemazmur secara alami dalam bahasa Indonesia.
- source_word: שִׁוִּיתִי
  choice: aku telah menenangkan
  rationale: Dalam konteks ini, verba tersebut menggambarkan tindakan membawa batin ke keadaan rata, tenang, dan terkendali, bukan meratakan secara harfiah.
- source_word: וְדוֹמַמְתִּי
  choice: dan mendiamkan
  rationale: Verba ini berarti membuat diam atau hening. “Mendiamkan” mempertahankan unsur tindakan sengaja dan sejajar dengan “menenangkan”.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Di sini נֶפֶשׁ menunjuk pada diri atau kehidupan batin pemazmur. “Jiwaku” wajar dalam ragam mazmur Indonesia tanpa harus menyiratkan dualisme tubuh-jiwa yang teknis.
- source_word: כְּגָמֻל
  choice: seperti anak yang disapih
  rationale: Bentuk pasif ini menunjuk kepada anak yang telah disapih. Terjemahan ini mempertahankan gambaran konkret dan mudah dipahami.
- source_word: עֲלֵי אִמּוֹ
  choice: bersama ibunya
  rationale: Preposisi עַל di sini menggambarkan kedekatan anak yang beristirahat pada atau dekat ibunya. “Bersama ibunya” alami dalam bahasa Indonesia dan tidak menentukan posisi fisik secara berlebihan.
- source_word: כַּגָּמֻל עָלַי נַפְשִׁי
  choice: seperti anak yang disapih, demikianlah jiwaku dalam diriku
  rationale: Klausa ini mengulang perbandingan dan menggambarkan jiwa yang telah tenang dalam diri pemazmur. “Dalam diriku” menyampaikan makna yang paling mungkin secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Nuansa antropologis נַפְשִׁי
  choice: Diterjemahkan “jiwaku” sebagai diri batin pemazmur tanpa menetapkan dualisme tubuh-jiwa yang teknis.
  alternative: “diriku” atau “batinku”
  rationale: Ayat ini berbicara tentang keadaan batin dan sikap pemazmur. “Jiwaku” mempertahankan kedalaman dan ragam puitis Alkitab tanpa memasukkan rumusan antropologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, khidmat, dan mudah dipahami. Paralelisme serta pengulangan gambaran anak yang disapih dipertahankan. Istilah “jiwa” digunakan dalam arti diri batin, bukan sebagai pernyataan doktrinal teknis.
