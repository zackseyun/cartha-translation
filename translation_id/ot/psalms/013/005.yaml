  terminology: “Kasih setia” adalah padanan Indonesia yang mapan dan memadai untuk חֶסֶד. “Keselamatan” mempertahankan keluasan יְשׁוּעָה, sedangkan catatan kaki dengan tepat menyediakan “pembebasan” sebagai kemungkinan kontekstual. “Yahweh” konsisten dengan keputusan terminologis yang diberikan dan langsung merepresentasikan יהוה.
