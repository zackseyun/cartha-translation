source:
  edition: WLC
  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: id
  text: 'Namun aku percaya pada kasih setia-Mu;

    hatiku akan bersukacita atas keselamatan-Mu.[a]

    Aku hendak bernyanyi bagi Yahweh,

    sebab Ia telah berbuat baik kepadaku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pembebasan.” Kata Ibrani ini dapat menunjuk pada pertolongan dari kesesakan yang sedang dialami maupun keselamatan dalam arti yang lebih luas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Kata sambung dan pronomina yang ditegaskan menandai kontras dengan keluhan sebelumnya. “Namun aku” menyampaikan kontras itu secara alami dalam bahasa Indonesia modern.
- source_word: בְּחַסְדְּךָ
  choice: pada kasih setia-Mu
  rationale: חֶסֶד menunjuk pada kasih yang penuh kesetiaan dan kemurahan, kerap dalam konteks relasi perjanjian. “Kasih setia” mempertahankan unsur kasih sekaligus keteguhannya.
- source_word: בָטַחְתִּי
  choice: aku percaya
  rationale: Bentuk perfektif menyatakan kepercayaan yang telah teguh dan tetap relevan. Dalam bahasa Indonesia, “aku percaya” secara alami dapat menyatakan keadaan percaya yang menetap tanpa memaksakan penandaan waktu yang tidak idiomatis.
- source_word: יָגֵל לִבִּי
  choice: hatiku akan bersukacita
  rationale: Bentuk imperfektif mengarah pada sukacita yang dinantikan sebagai tanggapan atas penyelamatan Allah. “Hatiku” mempertahankan gambaran Ibrani tentang batin atau diri terdalam.
- source_word: בִּישׁוּעָתֶךָ
  choice: atas keselamatan-Mu
  rationale: יְשׁוּעָה dapat berarti keselamatan maupun pembebasan dari kesesakan. “Keselamatan” mempertahankan keluasan maknanya, sedangkan “atas” menyatakan dasar atau pokok sukacita secara wajar dalam bahasa Indonesia.
- source_word: אָשִׁירָה
  choice: Aku hendak bernyanyi
  rationale: Bentuk kohortatif menyatakan kehendak atau tekad. “Hendak bernyanyi” mempertahankan nuansa volisional itu dengan register yang wajar dan bermartabat.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” sehingga nama perjanjian dalam teks sumber tetap tampak. Preposisi ל־ diungkapkan dengan “bagi” sebagai penerima nyanyian.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan pemazmur bernyanyi. “Sebab” jelas, ringkas, dan sesuai dengan ragam puitis.
- source_word: גָמַל עָלָי
  choice: Ia telah berbuat baik kepadaku
  rationale: Ungkapan ini menyatakan tindakan yang penuh atau menguntungkan terhadap seseorang. “Berbuat baik kepadaku” alami dalam bahasa Indonesia dan menghindari kesan transaksional dari “memberi upah”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama, bukan menggantinya dengan gelar.
- issue: Cakupan makna יְשׁוּעָה
  choice: keselamatan
  alternative: pembebasan
  rationale: Istilah Ibrani ini dapat menunjuk pada pertolongan konkret dari kesesakan maupun keselamatan dalam arti yang lebih luas. Teks utama memakai “keselamatan,” sementara alternatif “pembebasan” dicatat agar keluasan dan ketegangan maknanya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang sederhana dan bermartabat. Paralelisme baris Ibrani dipertahankan. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
