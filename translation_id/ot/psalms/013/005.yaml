  source_fidelity: Terjemahan secara setia mencerminkan kontras וַאֲנִי (“Namun aku”), objek kepercayaan dalam חֶסֶד, sukacita yang diantisipasi dalam יָגֵל, dan alasan nyanyian pada klausa terakhir. “Atas keselamatan-Mu” merupakan pengungkapan Indonesia yang wajar bagi בִּישׁוּעָתֶךָ tanpa mempersempitnya hanya pada pembebasan langsung. “Telah berbuat baik kepadaku” menangkap perfektif גָמַל עָלַי dan makna benefaktifnya dengan baik.
