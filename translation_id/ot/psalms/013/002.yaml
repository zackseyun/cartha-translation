source:
  edition: WLC
  text: עַד אָ֨נָה אָשִׁ֪ית עֵצ֡וֹת בְּ/נַפְשִׁ֗/י יָג֣וֹן בִּ/לְבָבִ֣/י יוֹמָ֑ם עַד אָ֓נָה יָר֖וּם אֹיְבִ֣/י עָלָֽ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: id
  text: Berapa lama lagi aku harus menyusun berbagai rencana dalam diriku[a], dengan dukacita dalam hatiku sepanjang hari? Berapa lama lagi musuhku akan berjaya atas aku[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menaruh berbagai pertimbangan dalam jiwaku.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “menjadi tinggi di atasku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Berapa lama lagi
  rationale: Ungkapan ratapan yang diulang ini paling alami disampaikan dengan “Berapa lama lagi,” yang mempertahankan desakan emosionalnya.
- source_word: אָשִׁית עֵצוֹת
  choice: aku harus menyusun berbagai rencana
  rationale: Secara harfiah berarti menaruh atau menetapkan pertimbangan-pertimbangan. “Menyusun berbagai rencana” menyampaikan pergumulan batin untuk terus mencari jalan keluar tanpa menghilangkan bentuk jamaknya.
- source_word: בְּנַפְשִׁי
  choice: dalam diriku
  rationale: נֶפֶשׁ di sini menunjuk pada diri batin. “Dalam diriku” lebih alami dalam bahasa Indonesia modern daripada “dalam jiwaku,” sambil mempertahankan lokus perenungan internal.
- source_word: יָגוֹן בִּלְבָבִי
  choice: dukacita dalam hatiku
  rationale: “Dukacita” menyatakan kesedihan mendalam, sedangkan “hati” mempertahankan citra antropologis Ibrani.
- source_word: יוֹמָם
  choice: sepanjang hari
  rationale: Dalam konteks ini kata tersebut menyatakan lamanya dukacita pada siang hari; “sepanjang hari” menyampaikan keberlangsungannya dengan jelas.
- source_word: יָרוּם ... עָלָי
  choice: akan berjaya atas aku
  rationale: Ungkapan harfiahnya menggambarkan musuh sebagai tinggi di atas pemazmur. “Berjaya atas aku” mengungkapkan makna keunggulan atau kemenangan secara alami; metafora harfiahnya dicatat dalam catatan kaki.
- source_word: אֹיְבִי
  choice: musuhku
  rationale: Padanan langsung dan wajar bagi nomina tunggal dengan akhiran orang pertama.
theological_decisions: []
