  text: For the choir director. A psalm of David[a].
translation:
  language: id
  text: Untuk pemimpin musik. Mazmur Daud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur karya Daud” atau “Mazmur untuk Daud”; ungkapan Ibrani dalam judul mazmur dapat menunjukkan kepengarangan atau hubungan lain dengan Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. “Pemimpin musik” alami dalam bahasa Indonesia modern dan tidak membatasi tugasnya hanya pada paduan suara; prefiks לַ diterjemahkan “untuk” sesuai konteks judul.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah ini merupakan penanda jenis nyanyian yang lazim dan tepat diterjemahkan “mazmur” dalam konteks kitab ini.
- source_word: לְדָוִד
  choice: Daud
  rationale: Ungkapan ringkas “Mazmur Daud” wajar sebagai judul dalam bahasa Indonesia dan mempertahankan hubungan dengan Daud tanpa secara eksplisit membatasi hubungan itu hanya pada kepengarangan.
theological_decisions:
- issue: Makna לְדָוִד dalam judul mazmur
  choice: Mazmur Daud
  alternative: Mazmur karya Daud; Mazmur untuk Daud
  rationale: Preposisi לְ dalam judul mazmur dapat menyatakan kepengarangan, kepemilikan, hubungan, atau peruntukan. Teks utama memakai rumusan Indonesia yang ringkas, sedangkan catatan kaki mempertahankan kemungkinan-kemungkinan yang sungguh ada dalam bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Pemimpin musik” dipilih daripada istilah lama “pemimpin biduan” agar mudah dipahami pembaca masa kini. Penanda [a] ditempatkan sesudah “Daud” karena catatan menerangkan לְדָוִד.
