  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: id
  text: Pandanglah dan jawablah aku, ya Yahweh, Allahku! Terangilah mataku,[a] agar aku tidak tidur dalam kematian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “buatlah mataku bercahaya.” Gambaran ini dapat menunjuk pada pulihnya daya hidup, kejernihan, atau harapan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “agar aku tidak tidur kematian”; ungkapan ini juga dapat diterjemahkan “agar aku tidak tidur dalam kematian.” Metafora tidur bagi kematian dipertahankan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  choice: Pandanglah
  rationale: Bentuk imperatif ini memohon agar Allah mengarahkan perhatian-Nya kepada pemazmur. “Pandanglah” alami dalam doa dan mempertahankan gambaran tindakan melihat.
- source_word: עֲנֵנִי
  choice: jawablah aku
  rationale: Dalam konteks doa, ענה lazim berarti menjawab permohonan. Terjemahan ini mempertahankan seruan yang langsung dan pribadi tanpa menambahkan bahwa jawaban itu pasti menguntungkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Bentuk posesif diterjemahkan secara langsung dan mempertahankan kedekatan pribadi dalam seruan pemazmur.
- source_word: הָאִירָה עֵינַי
  choice: Terangilah mataku
  rationale: Ungkapan kausatif dan metafora tubuh dalam bahasa Ibrani dipertahankan. Maknanya dapat mencakup pemulihan daya hidup, kejernihan, atau harapan, sehingga tidak dipersempit menjadi satu tafsiran.
- source_word: פֶּן
  choice: supaya aku jangan
  rationale: Memperkenalkan akibat yang ditakuti. Bentuk ini lebih alami dalam bahasa Indonesia modern daripada padanan yang terlalu harfiah, sambil tetap menyampaikan maksud pencegahan.
- source_word: אִישַׁן הַמָּוֶת
  choice: aku tertidur dalam kematian
  rationale: Terjemahan ini mempertahankan metafora tidur bagi kematian dan kejanggalan puitis ungkapan Ibrani tanpa menambahkan kata benda kedua seperti “tidur kematian”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Makna metafora הָאִירָה עֵינַי
  choice: Metafora dipertahankan sebagai “Terangilah mataku”
  alternative: Pulihkanlah kekuatanku
  rationale: Gambaran itu dapat menunjuk pada daya hidup, kejernihan, atau harapan. Terjemahan tidak memilih hanya satu makna dan dengan demikian mempertahankan keluasan serta ketegangan puitis teks.
- issue: Hubungan antara tidur dan kematian
  choice: tertidur dalam kematian
  alternative: tidur kematian
  rationale: Bahasa Ibrani secara padat menghubungkan tidur dengan kematian. Pilihan ini mempertahankan metafora tersebut dalam ungkapan Indonesia yang dapat dipahami tanpa menjelaskan apakah kematian sendiri sedang didefinisikan sebagai tidur.
translation_notes:
  register: Bahasa doa puitis yang modern, langsung, dan khidmat. Partikel “ya” menandai sapaan, sedangkan bentuk imperatif berakhiran -lah mempertahankan nada permohonan yang sungguh-sungguh. Metafora mata yang diterangi dan kematian sebagai tidur dipertahankan.
