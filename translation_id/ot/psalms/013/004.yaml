  text: lest my enemy say[b][a], “I have overcome him,” and my adversaries rejoice because I am shaken.
translation:
  language: id
  text: Jangan sampai musuhku berkata, “Aku telah mengalahkan dia,”[a] dan lawan-lawanku bersukacita karena aku goyah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku telah menang atas dia.”
    reason: lexical_alternative
  - marker: b
    text: Atau “aku tergelincir” atau “aku terhuyung-huyung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Memperkenalkan hasil yang dikhawatirkan dan hendak dicegah; ungkapan ini alami dalam bahasa Indonesia serta mempertahankan daya negatif klausa Ibrani.
- source_word: יֹאמַר
  choice: berkata
  rationale: Padanan langsung dan wajar untuk verba אמר dalam konteks ucapan langsung.
- source_word: אֹיְבִי
  choice: musuhku
  rationale: Mempertahankan bentuk tunggal dengan sufiks orang pertama tunggal.
- source_word: יְכָלְתִּיו
  choice: Aku telah mengalahkan dia
  rationale: Verba יכל dengan subjek orang pertama tunggal dan objek orang ketiga maskulin tunggal menyatakan bahwa musuh membanggakan keberhasilannya atas pemazmur; 'mengalahkan' jelas tanpa menyiratkan pemusnahan total.
- source_word: צָרַי
  choice: lawan-lawanku
  rationale: Mempertahankan bentuk jamak dan membedakannya dari אֹיְבִי yang tunggal, sambil menyatakan pihak-pihak yang memusuhi pemazmur.
- source_word: יָגִילוּ
  choice: bersukacita
  rationale: Menyampaikan kegembiraan besar para lawan atas keadaan pemazmur dengan diksi yang alami dan bermartabat.
- source_word: כִּי
  choice: karena
  rationale: 'Menampilkan hubungan sebab: kegoyahan pemazmur menjadi alasan para lawan bersukacita.'
- source_word: אֶמּוֹט
  choice: aku goyah
  rationale: Bentuk dari מוט menyatakan kehilangan kestabilan atau keteguhan. 'Goyah' cukup luas untuk mencakup keadaan kiasan tanpa mengharuskan kejatuhan harfiah.
