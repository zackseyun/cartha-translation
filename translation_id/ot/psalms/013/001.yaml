source:
  edition: WLC
  text: עַד אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣/נִי נֶ֑צַח עַד אָ֓נָה תַּסְתִּ֖יר אֶת פָּנֶ֣י/ךָ מִמֶּֽ/נִּי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long[a], O Yahweh, will you forget me forever? How long will you hide your face from me?
translation:
  language: id
  text: Sampai kapan, ya Yahweh, Engkau akan melupakan aku—selama-lamanya? Sampai kapan Engkau akan menyembunyikan wajah-Mu[a] dariku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kehadiran-Mu.” Secara harfiah, “wajah-Mu”; ungkapan menyembunyikan wajah dapat menyiratkan penarikan kehadiran atau perkenanan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Sampai kapan
  rationale: Ungkapan tanya mengenai lamanya keadaan dalam puisi ratapan; padanan ini alami dalam bahasa Indonesia dan mempertahankan pengulangan seruan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: תִּשְׁכָּחֵנִי
  choice: Engkau akan melupakan aku
  rationale: Makna langsung verba שׁכח dengan objek orang pertama tunggal; bentuk imperfek dalam pertanyaan menyuarakan keadaan yang dirasakan terus berlangsung.
- source_word: נֶצַח
  choice: untuk selama-lamanya
  rationale: Mempertahankan daya emosional keluhan yang mempertentangkan pertanyaan 'sampai kapan' dengan kemungkinan ditinggalkan selamanya.
- source_word: תַּסְתִּיר
  choice: Engkau akan menyembunyikan
  rationale: Padanan langsung bentuk Hifil dari סתר ketika objeknya adalah 'wajah-Mu'.
- source_word: פָּנֶיךָ
  choice: wajah-Mu
  rationale: Mempertahankan gambaran konkret bahasa Ibrani; makna kehadiran atau perkenanan dijelaskan dalam catatan kaki.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Padanan Indonesia yang ringkas dan alami untuk frasa yang menyatakan pemisahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung; transliterasi mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Apakah פָּנֶיךָ ditafsirkan secara dinamis sebagai kehadiran atau perkenanan
  choice: Mempertahankan 'wajah-Mu' dalam teks utama
  alternative: kehadiran-Mu; perkenanan-Mu
  rationale: Ungkapan konkret itu dapat menyiratkan penarikan kehadiran atau perkenanan ilahi, tetapi menerjemahkannya secara interpretatif akan mempersempit keluasan gambaran puitis.
- issue: Hubungan נֶצַח dengan pertanyaan sebelumnya
  choice: 'Mempertahankannya sebagai kelanjutan retoris: ''melupakan aku—untuk selama-lamanya?'''
  alternative: 'Memisahkannya sebagai seruan tersendiri: ''Selama-lamanya?'''
  rationale: Urutan Ibrani mengaitkan kata tersebut dengan keluhan tentang dilupakan, sementara tanda pisah mempertahankan kejutan dan ketegangan retoris tanpa mengubahnya menjadi pernyataan datar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan puitis 'ya Yahweh'. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia. Tanda pisah mempertahankan ketegangan emosional antara 'sampai kapan' dan 'selama-lamanya'.
