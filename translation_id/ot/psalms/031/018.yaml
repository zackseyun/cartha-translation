  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַ/דֹּבְר֖וֹת עַל צַדִּ֥יק עָתָ֗ק בְּ/גַאֲוָ֥ה וָ/בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: id
  text: Biarlah bibir-bibir dusta dibungkam[a], yang berbicara lancang[c] melawan orang benar[b], dengan keangkuhan dan penghinaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi bisu”; kata kerja Ibrani dapat berarti menjadi diam atau dibuat bisu.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Ibraninya tunggal dan dapat menunjuk kepada seorang yang benar atau dipakai secara representatif.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani yang diterjemahkan “lancang” adalah nomina yang berarti “kelancangan” atau “keangkuhan,” dan di sini menerangkan cara mereka berbicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: Biarlah ... dibungkam
  rationale: Bentuk nifal imperfek yang berfungsi sebagai jusif menyatakan harapan atau permohonan agar bibir-bibir itu dibuat diam. “Biarlah ... dibungkam” mempertahankan daya imprekasi ayat ini secara alami dalam bahasa Indonesia.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: bibir-bibir dusta
  rationale: Frasa konstruksi ini secara harfiah berarti “bibir-bibir kedustaan.” “Bibir-bibir dusta” ringkas, puitis, dan mempertahankan metonimia untuk orang-orang yang mengucapkan dusta.
- source_word: הַדֹּבְרוֹת
  choice: yang berbicara
  rationale: Partisip feminin jamak ini bersesuaian dengan “bibir-bibir” dan berfungsi sebagai keterangan atributif.
- source_word: עַל צַדִּיק
  choice: melawan orang benar
  rationale: Preposisi עַל dalam konteks permusuhan verbal wajar diterjemahkan “melawan.” Bentuk tunggal צַדִּיק dipertahankan sebagai “orang benar,” tanpa menentukan apakah yang dimaksud satu individu tertentu atau sosok representatif.
- source_word: עָתָק
  choice: lancang
  rationale: Nomina ini menyatakan kelancangan, keangkuhan, atau perkataan yang kurang ajar. Pemakaian adverbial “berbicara lancang” mencerminkan fungsinya dalam kalimat sekaligus membedakannya dari גַאֲוָה.
- source_word: בְּגַאֲוָה
  choice: dengan keangkuhan
  rationale: Preposisi בְּ menyatakan cara atau sikap; “dengan keangkuhan” mempertahankan nuansa kesombongan yang kuat.
- source_word: וָבוּז
  choice: dan penghinaan
  rationale: בּוּז berarti penghinaan, rasa meremehkan, atau cemooh. “Penghinaan” sesuai dengan bentuk nominal dan berpasangan alami dengan “keangkuhan.”
theological_decisions:
- issue: Identitas צַדִּיק dalam bentuk tunggal
  choice: orang benar
  alternative: orang-orang benar / si orang benar
  rationale: Teks Ibrani memakai bentuk tunggal yang dapat menunjuk kepada seorang individu atau berfungsi secara representatif. Terjemahan “orang benar” mempertahankan ketegangan itu tanpa mengubahnya menjadi jamak atau memastikan identitas tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan puitis. Pengulangan “bibir-bibir” mempertahankan bentuk jamak dan citra konkret bahasa Ibrani; “lancang,” “keangkuhan,” dan “penghinaan” mempertahankan penumpukan istilah retoris tanpa menjadikannya terlalu tautologis.
