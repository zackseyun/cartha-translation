id: PSA.31.19
reference: Psalms 31:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מָ֤ה רַֽב טוּבְ/ךָ֮ אֲשֶׁר צָפַ֪נְתָּ לִּֽ/ירֵ֫אֶ֥י/ךָ פָּ֭עַלְתָּ לַ/חֹסִ֣ים בָּ֑/ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: id
  text: Betapa berlimpah kebaikan-Mu, yang telah Kausimpan bagi orang-orang yang takut kepada-Mu, yang telah Kauwujudkan bagi orang-orang yang berlindung kepada-Mu, di hadapan umat manusia[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak manusia”; maksudnya manusia pada umumnya.'
    reason: Menjelaskan bentuk harfiah dan cakupan kolektif ungkapan Ibrani בְּנֵי אָדָם.
lexical_decisions:
- source_word: מָה רַב
  choice: Betapa berlimpah
  rationale: Ungkapan seruan ini menyatakan kekaguman atas besarnya sekaligus melimpahnya sesuatu; “betapa berlimpah” mempertahankan kedua nuansa itu secara wajar dalam bahasa Indonesia.
- source_word: טוּבְךָ
  choice: kebaikan-Mu
  rationale: Kata ini dapat menunjuk pada sifat baik maupun segala pemberian baik dari Allah; “kebaikan-Mu” mempertahankan keluasan makna tersebut.
- source_word: צָפַנְתָּ
  choice: telah Kausimpan
  rationale: Verba ini menggambarkan sesuatu yang disimpan atau disediakan sebagai cadangan, bukan sekadar disembunyikan.
- source_word: לִירֵאֶיךָ
  choice: bagi orang-orang yang takut kepada-Mu
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani tentang sikap takut yang mencakup rasa gentar dan hormat kepada Allah tanpa mempersempitnya menjadi salah satu unsur saja.
- source_word: פָּעַלְתָּ
  choice: telah Kauwujudkan
  rationale: Verba ini berarti mengerjakan atau menghasilkan sesuatu. “Kauwujudkan” secara alami menyatakan bahwa kebaikan yang disimpan itu juga Allah nyatakan dalam tindakan.
- source_word: לַחֹסִים בָּךְ
  choice: bagi orang-orang yang berlindung kepada-Mu
  rationale: Pilihan ini mempertahankan gambaran konkret tentang mencari perlindungan, sedangkan kepercayaan kepada Allah tetap tersirat.
- source_word: נֶגֶד
  choice: di hadapan
  rationale: Ungkapan ini menunjukkan keterlihatan secara terbuka di depan pihak lain.
- source_word: בְּנֵי אָדָם
  choice: umat manusia
  rationale: Secara harfiah ungkapan ini berarti “anak-anak manusia,” tetapi dalam pemakaian Ibrani merupakan ungkapan kolektif bagi manusia pada umumnya. “Umat manusia” menyampaikan acuannya secara alami dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan ungkapan בְּנֵי אָדָם
  choice: umat manusia
  alternative: anak-anak manusia
  rationale: Ungkapan Ibrani ini merujuk secara representatif kepada manusia pada umumnya, bukan hanya anak laki-laki atau kelompok tertentu. Terjemahan utama menyampaikan cakupan tersebut, dan catatan kaki menjaga bentuk harfiahnya.
- issue: Hubungan frasa נֶגֶד בְּנֵי אָדָם
  choice: kebaikan itu diwujudkan secara terbuka di hadapan umat manusia
  alternative: orang-orang berlindung kepada Allah di hadapan umat manusia
  rationale: Posisi frasa memungkinkan kedekatan dengan klausa sebelumnya, tetapi dalam konteksnya frasa ini paling wajar menerangkan tindakan Allah yang mewujudkan kebaikan secara terbuka. Tanda koma mempertahankan kemungkinan hubungan sintaksis tanpa menjadikannya keterangan bagi tindakan berlindung saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat “Kausimpan” dan “Kauwujudkan” mengikuti ejaan baku; kapital pada pronomina ilahi dipakai secara konsisten. Struktur puitis dan nada seruan dipertahankan tanpa mengorbankan kejelasan.
