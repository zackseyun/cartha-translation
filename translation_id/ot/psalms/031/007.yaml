base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: id
  text: Aku akan bersorak dan bersukacita dalam kasih setia-Mu, karena Engkau telah melihat kesengsaraanku; Engkau telah mengetahui segala kesesakan jiwaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala kesesakan hidupku” atau “segala kesesakan diriku”; kata Ibrani nefesh dapat berarti “jiwa”, “hidup”, atau “diri”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה
  choice: Aku akan bersorak
  rationale: Bentuk kohortatif orang pertama tunggal dari גיל menyatakan tekad atau hasrat untuk bergembira dengan kuat. “Aku akan bersorak” alami dalam bahasa Indonesia dan mempertahankan daya puitisnya.
- source_word: וְאֶשְׂמְחָה
  choice: dan bersukacita
  rationale: Kata שמח dipasangkan dengan גיל sebagai penguatan puitis. Pasangan “bersorak dan bersukacita” mempertahankan dua unsur Ibrani tanpa pengulangan yang janggal.
- source_word: בְחַסְדֶּךָ
  choice: karena kasih setia-Mu
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan komitmen relasional. “Kasih setia” merupakan padanan Indonesia yang ringkas dan kaya makna; preposisi בְּ dalam konteks ini secara alami menyatakan dasar atau sebab sukacita.
- source_word: אֲשֶׁר
  choice: sebab
  rationale: Walaupun pada dasarnya merupakan partikel relatif, di sini אֲשֶׁר memperkenalkan alasan pemazmur bersukacita. “Sebab” mempertahankan hubungan kausal dengan register puitis yang wajar.
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: Engkau telah melihat kesengsaraanku
  rationale: עֳנִי menunjuk pada penderitaan, kemalangan, atau keadaan tertindas. “Kesengsaraan” sesuai dengan konteks ratapan dan tetap mudah dipahami.
- source_word: יָדַעְתָּ
  choice: Engkau telah mengenal
  rationale: יָדַע dapat menyatakan pengetahuan, pengakuan, atau perhatian relasional. “Mengenal” mempertahankan keluasan makna itu dan tidak mempersempitnya menjadi sekadar mengetahui fakta.
- source_word: בְצָרוֹת נַפְשִׁי
  choice: kesesakan-kesesakan jiwaku
  rationale: Bentuk jamak צָרוֹת dipertahankan melalui reduplikasi “kesesakan-kesesakan”, sedangkan נֶפֶשׁ diterjemahkan “jiwa” untuk menjaga ungkapan puitis dan kedalaman personalnya, sambil mengakui bahwa kata itu juga dapat berarti hidup atau diri.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam ratapan mazmur
  choice: jiwa
  alternative: hidup; diri
  rationale: “Jiwa” mempertahankan istilah tradisional dan dimensi batin-personal ungkapan tersebut tanpa harus menyiratkan dualisme teknis antara tubuh dan jiwa. Catatan kaki mengakui cakupan makna נֶפֶשׁ yang lebih luas.
- issue: Nuansa חֶסֶד
  choice: kasih setia
  alternative: belas kasih; kesetiaan perjanjian
  rationale: “Kasih setia” menjaga sekaligus unsur kasih dan keteguhan relasional tanpa memasukkan rumusan teologis yang lebih khusus daripada yang dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum teks Alkitab bahasa Indonesia. Bentuk jamak Ibrani pada צָרוֹת dipertahankan secara eksplisit.
