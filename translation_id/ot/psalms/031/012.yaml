  register: Bahasa Indonesia baku modern dengan irama puitis yang ringkas dan bermartabat. Idiom Ibrani מִלֵּב diterjemahkan menurut maknanya agar mudah dipahami, sedangkan ambiguitas אֹבֵד dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
