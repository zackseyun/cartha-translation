  text: נִ֭שְׁכַּחְתִּי כְּ/מֵ֣ת מִ/לֵּ֑ב הָ֝יִ֗יתִי כִּ/כְלִ֥י אֹבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/012.yaml
  text: I am forgotten like a dead man[a], out of mind[b]; I have become like a vessel that is lost.
translation:
  language: id
  text: Aku telah dilupakan seperti orang mati, hilang dari ingatan; aku telah menjadi seperti bejana yang binasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bejana yang hilang” atau “bejana yang rusak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: Aku telah dilupakan
  rationale: 'Bentuk nifal perfektum orang pertama tunggal menyatakan keadaan yang dihasilkan: pemazmur telah dilupakan. Bentuk ini alami dalam bahasa Indonesia dan tetap menunjukkan akibat yang berlangsung.'
- source_word: כְּמֵת
  choice: seperti orang mati
  rationale: Prefiks כְּ menyatakan perbandingan, sedangkan מֵת berbentuk tunggal. Pilihan ini mempertahankan citra personal tunggal dalam bahasa Indonesia yang wajar.
- source_word: מִלֵּב
  choice: hilang dari ingatan
  rationale: Secara harfiah berarti 'dari hati', tetapi לֵב dalam idiom Ibrani dapat menunjuk pada pikiran atau ingatan. Ungkapan ini menyampaikan maksud bahwa pemazmur tidak lagi diingat tanpa menerjemahkan idiom secara kaku.
- source_word: הָיִיתִי
  choice: aku telah menjadi
  rationale: Qal perfektum orang pertama tunggal dari היה di sini menyatakan keadaan yang telah terjadi dan kini dialami oleh pemazmur.
- source_word: כִּכְלִי
  choice: seperti bejana
  rationale: כְּלִי dapat berarti barang, perkakas, wadah, atau bejana. 'Bejana' mempertahankan keluasan citra benda yang dapat dipakai atau dibuang dan cocok dengan ragam puisi bermartabat.
- source_word: אֹבֵד
  choice: yang binasa
  rationale: Partisipel אבד dapat berarti hilang, rusak, musnah, atau sedang menuju kebinasaan. 'Yang binasa' mempertahankan daya verbal dan ambiguitas antara kerusakan, kehilangan, dan kehancuran; catatan kaki mencantumkan alternatif utama.
theological_decisions: []
