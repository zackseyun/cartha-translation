source:
  edition: WLC
  text: וַ/אֲנִ֤י עָלֶ֣י/ךָ בָטַ֣חְתִּי יְהוָ֑ה אָ֝מַ֗רְתִּי אֱלֹהַ֥/י אָֽתָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: id
  text: Namun aku percaya[a] kepada-Mu, ya Yahweh; aku berkata, “Engkaulah Allahku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun aku telah percaya kepada-Mu, ya Yahweh; aku telah berkata, ‘Engkaulah Allahku.’” Bentuk verba Ibrani dapat dipahami sebagai tindakan lampau atau keadaan yang telah dimulai dan tetap berlangsung; di sini diterjemahkan sebagai pernyataan kepercayaan dan pengakuan yang berlaku sekarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Konjungsi yang disertai kata ganti mandiri memberi penekanan dan pertentangan dengan keadaan sebelumnya. “Namun aku” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: עָלֶיךָ בָטַחְתִּי
  choice: aku percaya kepada-Mu
  rationale: Dengan verba בָּטַח, preposisi עַל menunjukkan bahwa Yahweh menjadi tumpuan kepercayaan. “Percaya kepada-Mu” merupakan ungkapan Indonesia yang alami untuk ketergantungan pribadi ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: אָמַרְתִּי
  choice: aku berkata
  rationale: Bentuk qatal dapat menunjuk pada pengakuan yang telah diucapkan dan tetap berlaku. Dalam konteks doa ini, bentuk kini “aku berkata” menghadirkan pengakuan pemazmur sebagai pernyataan yang sedang berlaku.
- source_word: אֱלֹהַי אָתָּה
  choice: Engkaulah Allahku
  rationale: Kata ganti mandiri אָתָּה bersifat tegas. Partikel “-lah” secara alami mempertahankan penekanan itu dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi tersebut tanpa menggantinya dengan gelar.
- issue: Aspek waktu pada בָטַחְתִּי dan אָמַרְתִּי
  choice: 'Pernyataan kini: “aku percaya” dan “aku berkata”'
  alternative: “aku telah percaya” dan “aku telah berkata”
  rationale: Bentuk qatal memungkinkan nuansa lampau atau perfektif, tetapi konteks doa menyajikan kepercayaan dan pengakuan sebagai sikap yang sedang berlaku. Catatan kaki mempertahankan kemungkinan gramatikal lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa menjadi arkais. “Namun aku” mempertahankan kontras dan penekanan; “Engkaulah” mempertahankan tekanan pada kata ganti Ibrani. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan hormat yang lazim dalam penerjemahan Alkitab bahasa Indonesia.
