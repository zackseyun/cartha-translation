id: PSA.31.9
reference: Psalms 31:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: id
  text: Kasihanilah aku, ya Yahweh, sebab aku dalam kesesakan; mataku merana karena dukacita[a], demikian juga jiwaku[b] dan perutku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mataku menjadi redup karena kepedihan” atau “mataku melemah karena kejengkelan.”'
    reason: lexical_alternative
  - marker: b
    text: “Jiwaku” juga dapat diterjemahkan “hidupku” atau “diriku.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “perutku”; kata Ibrani ini juga dapat menunjuk secara lebih luas pada bagian-bagian batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Kasihanilah aku
  rationale: Bentuk imperatif חנן memohon belas kasih atau kemurahan. Ungkapan ini alami dalam doa bahasa Indonesia dan mempertahankan nada permohonan pribadi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כִּי צַר לִי
  choice: sebab aku dalam kesesakan
  rationale: כִּי memperkenalkan alasan permohonan, sedangkan צַר לִי menyatakan keadaan terimpit atau menderita. 'Dalam kesesakan' sesuai dengan ragam mazmur ratapan.
- source_word: עָשְׁשָׁה
  choice: merana
  rationale: Kata kerja ini menggambarkan keadaan yang menyusut, melemah, atau gagal. 'Merana' menyampaikan kemunduran akibat penderitaan tanpa menentukan secara sempit apakah mata menjadi redup atau kehilangan daya.
- source_word: בְכַעַס
  choice: karena dukacita
  rationale: כַּעַס dapat menunjuk pada kejengkelan, kepedihan, atau dukacita. Dalam konteks ratapan ini, 'dukacita' menyampaikan penderitaan batin sambil mencatat kemungkinan lain dalam catatan kaki.
- source_word: עֵינִי
  choice: mataku
  rationale: Bentuk Ibrani tunggal dipertahankan; pemakaian kolektif 'mataku' tetap wajar dalam bahasa Indonesia puitis.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, atau diri. 'Jiwaku' mempertahankan keluasan antropologis dan kesejajaran puitisnya dengan bagian tubuh.
- source_word: וּבִטְנִי
  choice: dan perutku
  rationale: בֶּטֶן secara harfiah berarti perut dan dapat meluas kepada bagian batin. Terjemahan langsung mempertahankan gambaran jasmani yang konkret.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. Bentuk 'Yahweh' mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan antropologis נַפְשִׁי
  choice: jiwaku
  alternative: hidupku; diriku
  rationale: Dalam rangkaian 'mata—jiwa—perut', istilah ini dapat menunjuk pada diri atau daya hidup secara utuh. 'Jiwaku' mempertahankan ketegangan makna tanpa membatasinya pada pengertian biologis maupun pada bagian tak berjasad semata.
translation_notes:
  register: Bahasa Indonesia modern dengan ragam doa yang khidmat dan mudah dipahami. Titik koma mempertahankan hubungan antara permohonan dan uraian penderitaan; 'demikian juga' membuat elipsis kata kerja Ibrani terbaca alami tanpa menghilangkan kesejajaran puitis.
