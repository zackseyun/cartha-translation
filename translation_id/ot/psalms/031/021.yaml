id: PSA.31.21
reference: Psalms 31:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: id
  text: Terpujilah Yahweh, sebab Ia telah menyatakan kasih setia-Nya dengan ajaib kepadaku di kota berbenteng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kota yang terkepung”; ungkapan Ibrani ini dapat menunjuk pada kota berbenteng atau kota yang sedang dikepung.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Partisipel pasif ini membentuk seruan doksologis. “Terpujilah” merupakan ungkapan Indonesia yang alami dan khidmat ketika pujian diarahkan kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan secara langsung dalam teks Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi seruan pujian dan sesuai dengan gaya puitis yang tetap mudah dipahami.
- source_word: הִפְלִיא
  choice: menyatakan ... dengan ajaib
  rationale: Bentuk Hifil dari פלא mengungkapkan tindakan yang luar biasa atau menakjubkan. Dalam hubungannya dengan חַסְדּוֹ, frasa ini menyampaikan bahwa kasih setia itu diperlihatkan secara ajaib.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih yang teguh, kesetiaan, dan kemurahan dalam hubungan perjanjian; “kasih setia” mempertahankan keluasan makna itu tanpa menjadi arkais.
- source_word: לִי
  choice: kepadaku
  rationale: Menandai pemazmur sebagai penerima pribadi dari kasih setia yang dinyatakan.
- source_word: בְּעִיר מָצוֹר
  choice: di kota berbenteng
  rationale: Dalam konstruksi ini מָצוֹר dapat menunjuk pada pertahanan atau keadaan pengepungan. “Kota berbenteng” merupakan pembacaan langsung yang lazim, sedangkan kemungkinan “kota yang terkepung” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi “Yahweh” mempertahankan rujukan tersebut tanpa menggantinya dengan gelar.
- issue: Makna בְּעִיר מָצוֹר
  choice: di kota berbenteng
  alternative: di kota yang terkepung
  rationale: Ungkapan Ibrani memungkinkan kedua pengertian. Teks utama memakai arti tempat yang diperkuat, tetapi tidak menutup pembacaan yang menekankan keadaan terkepung; ambiguitasnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan bentuk pujian puitis, sedangkan “menyatakan ... dengan ajaib” menghindari ungkapan kaku dan tetap mencerminkan kekuatan verba Ibrani.
