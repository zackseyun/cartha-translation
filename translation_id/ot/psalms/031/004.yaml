  text: תּוֹצִיאֵ֗/נִי מֵ/רֶ֣שֶׁת ז֭וּ טָ֣מְנוּ לִ֑/י כִּֽי אַ֝תָּה מָֽעוּזִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/004.yaml
  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: id
  text: 'Keluarkanlah aku dari jaring yang mereka sembunyikan untukku,[a]

    sebab Engkaulah benteng perlindunganku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari jaring ini yang mereka sembunyikan untukku.” Bahasa Ibrani dapat dipahami dengan daya relatif (“jaring yang”) atau demonstratif (“jaring ini”). Dalam konteks ini, jaring tersebut merupakan perangkap tersembunyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: Keluarkanlah aku
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan seseorang keluar. Pilihan ini mempertahankan makna kausatif dan cocok sebagai permohonan langsung.
- source_word: מֵרֶשֶׁת
  choice: dari jaring
  rationale: רֶשֶׁת secara konkret berarti jaring dan secara kiasan dapat berfungsi sebagai perangkap. 'Jaring' mempertahankan gambaran asli tanpa menggantinya dengan penafsiran.
- source_word: זוּ
  choice: yang
  rationale: זוּ dapat memiliki daya relatif atau demonstratif dalam konteks ini. 'Yang' menghasilkan konstruksi Indonesia yang wajar dan mempertahankan kemungkinan pembacaan relatif.
- source_word: טָמְנוּ לִי
  choice: mereka sembunyikan untukku
  rationale: טמן berarti menyembunyikan atau menyimpan secara tersembunyi. Terjemahan ini mempertahankan tindakan menyembunyikan jaring, sedangkan maksud mencelakakan tetap tersirat oleh konteks.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi permohonan pemazmur.
- source_word: מָעוּזִּי
  choice: benteng perlindunganku
  rationale: מָעוֹז menunjuk pada tempat atau sumber kekuatan dan perlindungan. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan citra pertahanan yang melekat pada metafora tersebut.
theological_decisions:
- issue: Metafora perlindungan bagi Allah
  choice: Engkaulah benteng perlindunganku
  alternative: Engkaulah tempat perlindunganku; Engkaulah kubu pertahananku
  rationale: Teks menggambarkan Allah sebagai sumber kekuatan dan perlindungan. Pilihan ini mempertahankan citra benteng tanpa mempersempitnya menjadi klaim doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kapitalisasi 'Engkau' mengikuti kebiasaan teks Alkitab bahasa Indonesia ketika menyapa Allah. Susunan dua baris mempertahankan kesejajaran permohonan dan alasannya.
