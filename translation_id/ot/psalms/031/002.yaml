base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/002.yaml
  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
translation:
  language: id
  text: Condongkanlah telinga-Mu kepadaku; segeralah bebaskan aku. Jadilah bagiku gunung batu tempat perlindungan[a], rumah pertahanan[b] untuk menyelamatkan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “gunung batu yang kuat.” Kata Ibrani yang menyertai “gunung batu” dapat berarti perlindungan yang kuat atau kubu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kubu” atau “rumah yang sangat diperkuat.” Teks Ibrani mempertahankan gambaran rumah sambil menggambarkannya sebagai tempat berkubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה
  choice: Condongkanlah
  rationale: Bentuk perintah dari נטה bersama 'telinga' merupakan kiasan untuk mendengarkan dengan penuh perhatian. Pilihan ini mempertahankan gambaran konkret Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: אָזְנְךָ
  choice: telinga-Mu
  rationale: Nomina konkret tunggal dipertahankan sebagai bagian dari kiasan bahwa Allah mencondongkan telinga kepada pemazmur.
- source_word: מְהֵרָה
  choice: segeralah
  rationale: Mengungkapkan desakan agar tindakan dilakukan tanpa menunda, dengan bentuk Indonesia yang alami dan kuat.
- source_word: הַצִּילֵנִי
  choice: lepaskan aku
  rationale: נצל menunjuk pada tindakan melepaskan atau merenggut seseorang dari bahaya. 'Lepaskan aku' menyampaikan pembebasan mendesak sekaligus membedakannya dari ישׁע pada akhir ayat.
- source_word: הֱיֵה לִי
  choice: Jadilah bagiku
  rationale: Mempertahankan bentuk perintah היה dengan pronomina datif dan menyatakan permohonan relasional secara wajar dalam bahasa Indonesia.
- source_word: לְצוּר מָעוֹז
  choice: gunung batu tempat perlindungan
  rationale: צוּר adalah batu besar atau gunung batu, sedangkan מָעוֹז adalah tempat perlindungan atau pertahanan yang kuat. Frasa ini mempertahankan kedua unsur tanpa menghilangkan citra perlindungannya.
- source_word: לְבֵית מְצוּדוֹת
  choice: rumah benteng
  rationale: בֵּית mempertahankan citra 'rumah' atau tempat kediaman, sedangkan bentuk jamak מְצוּדוֹת menggambarkan pertahanan atau kubu yang kuat. 'Rumah benteng' ringkas, alami, dan menjaga kedua citra tersebut.
- source_word: לְהוֹשִׁיעֵנִי
  choice: untuk menyelamatkan aku
  rationale: Infinitif ישׁע menyatakan tujuan atau hasil. 'Untuk menyelamatkan aku' menerjemahkan relasi sintaksisnya secara langsung dan membedakannya secara leksikal dari נצל sebelumnya.
