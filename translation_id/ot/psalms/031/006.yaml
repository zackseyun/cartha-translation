id: PSA.31.6
reference: Psalms 31:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׂנֵ֗אתִי הַ/שֹּׁמְרִ֥ים הַבְלֵי שָׁ֑וְא וַ֝/אֲנִ֗י אֶל יְהוָ֥ה בָּטָֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/006.yaml
  text: I hate those who keep worthless idols[a], but as for me, I trust in Yahweh.
translation:
  language: id
  text: Aku membenci orang-orang yang berpegang pada berhala-berhala tak berguna[a], tetapi aku percaya kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang yang menjaga atau mengindahkan kesia-siaan yang hampa,” atau “orang-orang yang berpaut pada hal-hal sia-sia yang palsu.”
    reason: Alternatif ini mempertahankan arti dasar שׁמר serta ambiguitas ungkapan הַבְלֵי שָׁוְא, yang dapat menunjuk pada berhala atau secara lebih umum pada objek kepercayaan yang hampa dan palsu.
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Aku membenci
  rationale: Bentuk Qal perfektif orang pertama tunggal dapat menyatakan sikap yang telah mantap dan tetap berlaku; bentuk kini bahasa Indonesia menyampaikannya secara alami.
- source_word: הַשֹּׁמְרִים
  choice: orang-orang yang berpegang pada
  rationale: Kata שׁמר secara dasar berarti menjaga, memelihara, atau memperhatikan. Dengan objek berupa הַבְלֵי שָׁוְא, frasa ini menunjuk pada keterikatan atau kesetiaan kepada objek kepercayaan yang sia-sia; 'berpegang pada' tetap cukup dekat sekaligus wajar dalam bahasa Indonesia.
- source_word: הַבְלֵי שָׁוְא
  choice: berhala-berhala tak berguna
  rationale: Gabungan הבל dan שׁוא menyiratkan kehampaan, kesia-siaan, ketidakbergunaan, dan kepalsuan. Dalam pertentangannya dengan percaya kepada Yahweh, ungkapan ini kemungkinan menunjuk pada berhala, tetapi kemungkinan terjemahan yang lebih abstrak dipertahankan dalam catatan kaki.
- source_word: וַאֲנִי
  choice: tetapi aku
  rationale: Kata sambung bersama pronomina yang dinyatakan secara eksplisit menandai pertentangan tegas antara kelompok sebelumnya dan sikap pemazmur.
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: aku percaya kepada Yahweh
  rationale: Walaupun אֶל secara harfiah berarti 'kepada/menuju', konstruksi dengan בטח secara alami menyatakan penempatan kepercayaan kepada seseorang. Perfektif בָּטָחְתִּי menyatakan kepercayaan yang mantap dan dapat diterjemahkan dengan bentuk kini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Rujukan הַבְלֵי שָׁוְא
  choice: berhala-berhala tak berguna
  alternative: kesia-siaan yang hampa; hal-hal sia-sia yang palsu
  rationale: Konteks membandingkan keterikatan pada objek yang hampa dengan kepercayaan kepada Yahweh, sehingga rujukan kepada berhala sangat mungkin. Namun, karena ungkapan Ibraninya sendiri bersifat kiasan dan dapat dibaca lebih abstrak, alternatif itu dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. 'Aku' sesuai dengan suara pribadi pemazmur; susunan pertentangan dipadatkan agar alami tanpa menghilangkan penekanan pada subjek.
