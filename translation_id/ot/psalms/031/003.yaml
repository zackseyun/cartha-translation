  yaml_path: translation/ot/psalms/031/003.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: id
  text: Sebab[a] Engkaulah batu karangku dan bentengku; demi nama-Mu, Engkau akan menuntun dan membimbing aku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “Sebab” juga dapat memperkenalkan suatu penjelasan, dengan arti “karena” atau “sesungguhnya.”
    reason: lexical_alternative
  - marker: b
    text: 'Bentuk kedua verba Ibrani ini juga dapat dipahami sebagai permohonan: “tuntunlah dan bimbinglah aku.” Keduanya berdekatan makna dan membentuk paralelisme puitis.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar bagi permohonan dalam konteks. “Sebab” alami dalam puisi doa Indonesia dan tetap memungkinkan nuansa penjelasan.
- source_word: סַלְעִי
  choice: gunung batuku
  rationale: Nomina ini menunjuk pada batu besar atau tebing batu yang menjadi tempat perlindungan. “Gunung batuku” mempertahankan metafora perlindungan yang kokoh dalam ragam bahasa Alkitab Indonesia.
- source_word: מְצוּדָתִי
  choice: bentengku
  rationale: Kata ini berarti tempat berkubu atau pertahanan yang kuat. “Bentengku” jelas, ringkas, dan mempertahankan citra pertahanan.
- source_word: אָתָּה
  choice: Engkaulah
  rationale: Pronomina mandiri dalam bahasa Ibrani memberi penekanan. Partikel “-lah” menyampaikan penegasan itu secara alami dalam bahasa Indonesia.
- source_word: וּלְמַעַן שִׁמְךָ
  choice: demi nama-Mu
  rationale: Ungkapan ringkas ini mempertahankan idiom Ibrani yang mendasarkan tindakan Allah pada nama-Nya, tanpa mempersempitnya hanya menjadi reputasi.
- source_word: תַּנְחֵנִי
  choice: Engkau akan menuntun ... aku
  rationale: Bentuk hifil dari נחה berarti menuntun atau memandu. Bentuk belum rampung dipahami sebagai keyakinan akan tindakan Allah dalam konteks doa.
- source_word: וּתְנַהֲלֵנִי
  choice: dan membimbing aku
  rationale: Verba ini berdekatan makna dengan verba sebelumnya dan menyatakan tindakan memimpin atau membimbing. Pemilihan “membimbing” menjaga paralelisme tanpa melebur kedua verba menjadi satu.
theological_decisions:
- issue: Makna “demi nama-Mu”
  choice: Tindakan Allah dikaitkan dengan nama-Nya, yang mencakup karakter dan kehormatan-Nya sebagaimana dinyatakan-Nya, tanpa menambahkan uraian ke dalam teks.
  alternative: Menafsirkannya secara lebih sempit hanya sebagai reputasi Allah di hadapan pihak lain.
  rationale: Terjemahan mempertahankan idiom Ibrani dan keluasan maknanya, sehingga tidak memasukkan penafsiran teologis yang lebih sempit.
- issue: Daya bentuk verba תַּנְחֵנִי dan וּתְנַהֲלֵנִי
  choice: 'Keyakinan berorientasi ke depan: “Engkau akan menuntun dan membimbing aku.”'
  alternative: 'Permohonan: “tuntunlah dan bimbinglah aku”; atau tindakan kini/kebiasaan: “Engkau menuntun dan membimbing aku.”'
  rationale: Sesudah pengakuan “Engkaulah gunung batuku dan bentengku,” bentuk-bentuk belum rampung ini wajar dibaca sebagai pengharapan yang yakin. Karena bentuk Ibraninya juga dapat bernuansa permohonan dalam konteks doa, kemungkinan itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkaulah” mempertahankan penekanan pada pronomina Ibrani; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Dua verba dipertahankan untuk menjaga paralelisme puisi.
