id: PSA.31.5
reference: Psalms 31:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/יָדְ/ךָ֮ אַפְקִ֪יד ר֫וּחִ֥/י פָּדִ֖יתָה אוֹתִ֥/י יְהוָ֗ה אֵ֣ל אֱמֶֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: id
  text: Ke dalam tangan-Mu kuserahkan rohku; Engkau telah menebus aku, ya Yahweh, Allah yang benar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah yang setia.” Kata Ibrani ini dapat mengandung arti kebenaran, keterandalan, atau kesetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/יָדְ/ךָ
  choice: Ke dalam tangan-Mu
  rationale: Dengan verba penyerahan, בְּיָדְךָ secara idiomatis menyatakan arah sekaligus penempatan ke dalam kuasa dan pemeliharaan Allah.
- source_word: אַפְקִיד
  choice: kuserahkan
  rationale: Bentuk Hifil dari פקד di sini berarti memercayakan atau menyerahkan sesuatu kepada pemeliharaan pihak lain; 'kuserahkan' alami, ringkas, dan khidmat.
- source_word: רוּחִי
  choice: rohku
  rationale: רוּחַ dapat berarti roh, napas, atau angin. Dalam doa ini, 'rohku' paling tepat menyampaikan hidup atau diri pribadi yang dipercayakan kepada Allah tanpa mempersempitnya menjadi napas saja.
- source_word: פָּדִיתָה
  choice: Engkau telah menebus
  rationale: Perfek Ibrani menyatakan tindakan penebusan yang telah dilakukan dan tetap relevan bagi pemazmur; 'telah menebus' mempertahankan makna פדה dengan wajar dalam bahasa Indonesia.
- source_word: אוֹתִי
  choice: aku
  rationale: Pronomina objek langsung diterjemahkan secara lugas sebagai 'aku'.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai 'Yahweh'; partikel vokatif 'ya' menyampaikan sapaan langsung yang alami dan khidmat.
- source_word: אֵל אֱמֶת
  choice: Allah yang benar
  rationale: Frasa konstruksi ini secara alami dapat diterjemahkan 'Allah yang benar'. אֱמֶת mencakup kebenaran, keterandalan, dan kesetiaan; alternatif kontekstual dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: ya Yahweh
  alternative: ya TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung, sehingga transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Nuansa אֱמֶת dalam אֵל אֱמֶת
  choice: Allah yang benar
  alternative: Allah yang setia
  rationale: אֱמֶת dapat menunjuk pada kebenaran, keterandalan, atau kesetiaan. Teks utama mempertahankan unsur 'benar', sedangkan catatan kaki menjaga kemungkinan makna 'setia' tanpa menghapus keluasan semantisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Bentuk terikat 'kuserahkan' menjaga kelancaran dan keintiman orang pertama; kapitalisasi pronomina ilahi mengikuti gaya penghormatan yang lazim dalam penerbitan Alkitab Indonesia.
