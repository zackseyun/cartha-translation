  text: אֶֽהֱב֥וּ אֶת יְהוָ֗ה כָּֽל חֲסִ֫ידָ֥י/ו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה וּ/מְשַׁלֵּ֥ם עַל יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: id
  text: Kasihilah TUHAN, hai semua orang yang setia kepada-Nya![a] TUHAN menjaga orang-orang yang setia dan membalas dengan berlimpah orang yang bertindak dengan congkak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua orang kudus-Nya” atau “semua orang saleh-Nya.” Istilah Ibrani ini menunjuk kepada orang-orang yang bercirikan kesetiaan kepada TUHAN dalam hubungan perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Atau “membalas sepenuhnya” atau “membalas dengan berkelimpahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: Kasihilah
  rationale: Bentuk imperatif jamak dari אהב menyampaikan seruan langsung kepada komunitas; “kasihilah” alami, jelas, dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Nama ilahi tetragramaton diterjemahkan dengan bentuk baku “TUHAN”, sesuai konvensi Alkitab bahasa Indonesia dan tanpa memasukkan pengucapan yang diperdebatkan.
- source_word: כָּל חֲסִידָיו
  choice: semua orang yang setia kepada-Nya
  rationale: חסידיו menunjuk kepada orang-orang yang bercirikan kesetiaan dalam hubungan perjanjian. Ungkapan ini mempertahankan unsur kesetiaan relasional tanpa konotasi khusus yang dapat melekat pada “orang-orang kudus”.
- source_word: אֱמוּנִים
  choice: orang-orang yang setia
  rationale: Bentuk jamak substantival ini menunjuk kepada mereka yang teguh dan dapat dipercaya; “orang-orang yang setia” jelas serta sesuai dengan konteks perlindungan ilahi.
- source_word: נֹצֵר
  choice: menjaga
  rationale: נצר berarti menjaga atau memelihara dengan saksama. “Menjaga” menyampaikan perlindungan aktif TUHAN secara alami.
- source_word: וּמְשַׁלֵּם עַל יֶתֶר
  choice: tetapi membalas dengan berlimpah
  rationale: Piel משלם menyatakan pembalasan atau ganjaran, sedangkan על יתר menguatkan kadarnya. “Dengan berlimpah” mempertahankan nuansa intensif; “tetapi” mengungkapkan pertentangan kontekstual antara orang setia dan orang congkak.
- source_word: עֹשֵׂה גַאֲוָה
  choice: orang yang bertindak dengan congkak
  rationale: Secara harfiah, frasa ini berarti orang yang melakukan kecongkakan. Terjemahan ini alami dan mempertahankan fokus pada perilaku angkuh.
theological_decisions:
- issue: Identitas perjanjian dalam חֲסִידָיו
  choice: semua orang yang setia kepada-Nya
  alternative: semua orang kudus-Nya; semua orang saleh-Nya
  rationale: Pilihan ini menonjolkan kesetiaan relasional kepada TUHAN dan menghindari pemuatan arti gerejawi yang lebih kemudian ke dalam istilah Ibrani.
- issue: Perlindungan bagi yang setia dan pembalasan terhadap yang congkak
  choice: TUHAN menjaga orang-orang yang setia, tetapi membalas dengan berlimpah orang yang bertindak dengan congkak
  alternative: TUHAN memelihara orang yang setia dan membalas sepenuhnya orang yang berlaku sombong
  rationale: Rumusan ini mempertahankan penjajaran teologis dalam teks antara pemeliharaan ilahi dan penghukuman ilahi, tanpa melunakkan salah satunya. Kadar tepat על יתר tetap diberi ruang melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Sapaan “hai” mempertahankan seruan langsung mazmur, sementara struktur kalimat tetap mudah dipahami pembaca umum.
