  text: מִ/כָּל צֹרְרַ֨/י הָיִ֪יתִי חֶרְפָּ֡ה וְ/לִ/שֲׁכֵנַ֨/י מְאֹד֮ וּ/פַ֪חַד לִֽ/מְיֻדָּ֫עָ֥/י רֹאַ֥/י בַּ/ח֑וּץ נָדְד֥וּ מִמֶּֽ/נִּי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: id
  text: Oleh karena semua musuhku, aku telah menjadi celaan,[a] terutama bagi tetangga-tetanggaku, dan menjadi sesuatu yang menakutkan bagi kenalan-kenalanku; orang-orang yang melihatku di jalan,[b] menjauh dariku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Dari semua musuhku, aku telah menjadi celaan”; sebagian orang memahami frasa pembuka ini secara perbandingan: “Lebih daripada semua musuhku.”'
    reason: alternative_reading
  - marker: b
    text: Secara harfiah “di luar”; maksudnya ialah ketika ia terlihat di tempat umum.
    reason: cultural_note
  - marker: c
    text: Atau “lari dariku” atau “pergi meninggalkanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: Karena semua musuhku
  rationale: 'Preposisi מִן dalam konteks ini paling mungkin menyatakan sebab atau latar: musuh-musuh pemazmur menjadi penyebab ia dipandang hina. Ungkapan ini juga mempertahankan kemungkinan sumber tanpa memaksakan pembacaan komparatif.'
- source_word: הָיִיתִי חֶרְפָּה
  choice: aku telah menjadi celaan
  rationale: Bentuk הָיִיתִי dengan nomina menunjukkan keadaan yang telah timbul dan masih berpengaruh. 'Celaan' menyampaikan bahwa pemazmur menjadi sasaran penghinaan atau cemoohan.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: terutama bagi tetangga-tetanggaku
  rationale: מְאֹד menguatkan dampak celaan itu terhadap orang-orang terdekat di lingkungan pemazmur. 'Terutama' menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: dan menjadi sesuatu yang menakutkan bagi kenalan-kenalanku
  rationale: פַחַד berarti ketakutan atau kengerian. Susunan ini menyatakan bahwa pemazmur dipandang sebagai sesuatu yang menimbulkan rasa takut; מְיֻדָּעִים menunjuk kepada orang-orang yang mengenalnya, bukan harus sahabat dekat.
- source_word: רֹאַי בַּחוּץ
  choice: orang-orang yang melihatku di jalan
  rationale: בַּחוּץ secara harfiah berarti 'di luar', tetapi konteksnya adalah ruang publik. 'Di jalan' menyampaikan latar sosial tersebut secara wajar.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: menjauh dariku
  rationale: נָדַד dapat berarti pergi, mengembara, melarikan diri, atau menjauh. 'Menjauh' mempertahankan keluasan makna dan sesuai dengan gambaran penghindaran sosial tanpa melebihkan intensitasnya.
