translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Pengulangan 'menjadi' membuat hubungan predikatif Ibrani jelas, sedangkan 'sesuatu yang menakutkan' lebih alami daripada menyebut orang itu sendiri sebagai 'ketakutan'. Semua penanda catatan kaki dicantumkan dalam teks utama.
