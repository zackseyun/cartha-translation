  text: וְ/לֹ֣א הִ֭סְגַּרְתַּ/נִי בְּ/יַד אוֹיֵ֑ב הֶֽעֱמַ֖דְתָּ בַ/מֶּרְחָ֣ב רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/008.yaml
  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
translation:
  language: id
  text: dan Engkau tidak menyerahkan aku ke tangan musuh[a]; Engkau menempatkan kakiku di tempat yang lapang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke dalam kuasa musuh.”
    reason: lexical_alternative
  - marker: b
    text: “Tempat yang lapang” menggambarkan kebebasan, keamanan, dan kelegaan dari keadaan terkurung atau tertekan.
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: tidak menyerahkan aku
  rationale: Bentuk Hifil dari סגר dalam konteks ini berarti menyerahkan seseorang kepada kuasa pihak lain. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gagasan diserahkan kepada kendali musuh.
- source_word: בְּיַד
  choice: ke tangan
  rationale: Ungkapan Ibrani ini secara konkret memakai gambaran 'tangan' untuk menyatakan kuasa atau kendali. 'Ke tangan' mempertahankan citra tersebut dan lazim dipahami dalam bahasa Indonesia.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Nomina tunggal ini menunjuk kepada lawan yang bermusuhan dan dapat dipahami secara generik. Bahasa Indonesia tidak memerlukan kata sandang tertentu.
- source_word: הֶעֱמַדְתָּ
  choice: menempatkan
  rationale: Bentuk Hifil dari עמד berarti menyebabkan berdiri atau menaruh pada suatu posisi. 'Menempatkan' menyampaikan tindakan sengaja tanpa menjadi kaku.
- source_word: בַמֶּרְחָב
  choice: di tempat yang lapang
  rationale: מֶרְחָב menunjuk pada ruang luas atau terbuka sebagai lawan kesesakan dan kurungan. Terjemahan ini mempertahankan metafora sumber sekaligus terdengar alami.
- source_word: רַגְלָי
  choice: kakiku
  rationale: Bentuk Ibrani merujuk pada kaki si pembicara; bahasa Indonesia lazim memakai bentuk kolektif tunggal 'kaki' untuk sepasang kaki, sehingga 'kakiku' alami dan tidak mengubah makna.
- source_word: וְלֹא
  choice: dan ... tidak
  rationale: Konjungsi menghubungkan baris ini dengan konteks sebelumnya tanpa harus ditafsirkan secara adversatif. 'Dan ... tidak' paling dekat dengan struktur sumber.
