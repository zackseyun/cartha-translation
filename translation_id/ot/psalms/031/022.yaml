source:
  edition: WLC
  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: id
  text: Aku berkata dalam kepanikanku[a], “Aku sudah disingkirkan dari hadapan mata-Mu[b].” Namun, Engkau mendengar suara permohonanku ketika aku berseru kepada-Mu memohon pertolongan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam ketergesa-gesaanku.” Kata Ibrani ini dapat menyatakan ketergesa-gesaan, kegelisahan, atau kepanikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari pandangan-Mu.” Secara harfiah, “dari hadapan mata-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: dalam kepanikanku
  rationale: Kata חפז dapat menunjuk pada ketergesa-gesaan, kegelisahan, atau kepanikan. Dalam konteks ratapan ini, “dalam kepanikanku” menyampaikan keadaan batin yang tertekan, sementara kemungkinan arti “dalam ketergesa-gesaanku” dicatat dalam catatan kaki.
- source_word: נִגְרַזְתִּי
  choice: Aku telah terputus
  rationale: Bentuk Nifal dari גזר di sini menyatakan keadaan diputuskan atau disingkirkan. Bentuk “telah terputus” mempertahankan gambaran Ibrani dan menyampaikan kesimpulan yang dirasakan pemazmur ketika ia berbicara.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: dari hadapan mata-Mu
  rationale: Ungkapan ini secara harfiah berarti “dari depan/hadapan mata-Mu.” Terjemahan ini mempertahankan citra konkret bahasa Ibrani; padanan idiomatis “dari pandangan-Mu” diberikan dalam catatan kaki.
- source_word: אָכֵן
  choice: Meskipun demikian
  rationale: Dalam konteks ini אָכֵן menandai kontras tegas antara anggapan pemazmur bahwa ia telah terputus dan kenyataan bahwa Allah mendengar. “Meskipun demikian” mengungkapkan daya adversatif tersebut secara alami.
- source_word: קוֹל תַּחֲנוּנַי
  choice: suara permohonanku
  rationale: קוֹל berarti “suara,” sedangkan תַּחֲנוּנִים adalah permohonan akan belas kasihan atau kemurahan. Pilihan ini mempertahankan kedua unsur tanpa menggunakan bahasa yang usang.
- source_word: בְּשַׁוְּעִי
  choice: ketika aku berseru
  rationale: Bentuk ini menyatakan seruan minta pertolongan. “Ketika aku berseru” alami dalam bahasa Indonesia, dan nuansa meminta bantuan dibuat jelas oleh frasa berikutnya.
- source_word: אֵלֶיךָ
  choice: kepada-Mu meminta pertolongan
  rationale: אֶל sendiri berarti “kepada,” tetapi bersama שׁוע ungkapan itu berarti berseru kepada seseorang untuk meminta pertolongan. Penambahan “meminta pertolongan” menyatakan secara eksplisit makna yang sudah terkandung dalam verba Ibrani.
theological_decisions:
- issue: Perasaan ditinggalkan Allah dibandingkan kenyataan bahwa Allah mendengar
  choice: Ucapan pemazmur dipertahankan sebagai persepsinya saat panik—“Aku telah terputus dari hadapan mata-Mu”—lalu dikontraskan dengan kenyataan bahwa Allah mendengar.
  alternative: Menerjemahkan secara lebih interpretatif sebagai “Aku menyangka Engkau telah menolak aku.”
  rationale: Teks Ibrani memakai gambaran pengalaman relasional tanpa secara eksplisit menyatakan penolakan ilahi. Terjemahan ini menjaga ketegangan antara persepsi manusia dan tanggapan Allah, tanpa mengubahnya menjadi klaim teologis yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan citra konkret dan kontras emosional teks Ibrani sambil tetap mudah dipahami.
