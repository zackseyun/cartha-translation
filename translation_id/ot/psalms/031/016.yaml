source:
  edition: WLC
  text: הָאִ֣ירָ/ה פָ֭נֶי/ךָ עַל עַבְדֶּ֑/ךָ ה֖וֹשִׁיעֵ֣/נִי בְ/חַסְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/016.yaml
  text: Make your face shine on your servant[a]; save me in your steadfast love.
translation:
  language: id
  text: Buatlah wajah-Mu bersinar atas hamba-Mu; selamatkanlah aku dengan kasih setia-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh kasih setia-Mu” atau “sesuai dengan kasih setia-Mu.” Preposisi Ibrani di sini dapat dipahami dalam beberapa arti yang berdekatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה
  choice: Buatlah ... bersinar
  rationale: Bentuk imperatif hifil dari אור bersifat kausatif. Ungkapan ini mempertahankan permohonan agar Allah membuat wajah-Nya bersinar, sekaligus tetap jelas dalam bahasa Indonesia modern.
- source_word: פָנֶיךָ
  choice: wajah-Mu
  rationale: Terjemahan konkret ini mempertahankan gambaran Ibrani tentang wajah Allah yang bersinar sebagai tanda perkenanan-Nya, tanpa meratakannya menjadi sekadar 'hadirat'.
- source_word: עַל
  choice: atas
  rationale: Preposisi ini menunjukkan arah perkenanan Allah kepada hamba-Nya. 'Atas' mempertahankan bentuk gambaran sumber dan dapat dipahami dalam ragam doa yang bermartabat.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Dalam doa kepada Allah, 'hamba' menyampaikan hubungan pengabdian yang dimaksud tanpa menonjolkan konotasi perbudakan yang tidak menjadi fokus ayat ini.
- source_word: הוֹשִׁיעֵנִי
  choice: selamatkanlah aku
  rationale: Imperatif dengan sufiks orang pertama tunggal ini merupakan permohonan langsung untuk penyelamatan. Pilihan ini mencakup pelepasan dari bahaya dan resonansi teologis yang lebih luas.
- source_word: בְחַסְדֶּךָ
  choice: dengan kasih setia-Mu
  rationale: '''Kasih setia'' menyampaikan kekayaan makna חסד sebagai kasih yang teguh dan loyal. ''Dengan'' cukup alami dalam bahasa Indonesia serta membiarkan hubungan preposisionalnya tetap terbuka antara sarana, dasar, dan kesesuaian dengan kasih setia Allah.'
theological_decisions:
- issue: Penerjemahan חסד
  choice: kasih setia
  alternative: belas kasihan; kemurahan
  rationale: '''Kasih setia'' mempertahankan unsur kasih, keteguhan, dan loyalitas relasional yang terkandung dalam חסד, tanpa membatasinya pada rasa iba atau kebaikan hati semata.'
translation_notes:
  register: Bahasa doa yang modern dan bermartabat. Gambaran konkret 'wajah-Mu bersinar' dipertahankan meskipun sedikit lebih formal daripada ungkapan percakapan sehari-hari. Kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan ejaan Alkitab bahasa Indonesia.
