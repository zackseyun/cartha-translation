source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: id
  text: Ya, Yahweh, janganlah aku dipermalukan, sebab aku telah berseru kepada-Mu. Biarlah orang-orang fasik dipermalukan; biarlah mereka terdiam di Syeol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi tidak bergerak di Syeol,” atau “turun ke Syeol dalam keheningan.” Kata kerja Ibraninya dapat menunjuk pada keadaan diam atau tidak bergerak. “Syeol” adalah dunia orang mati, bukan selalu “neraka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Mempertahankan nama ilahi dalam bentuk Yahweh; partikel 'Ya' menyampaikan sapaan langsung secara wajar dan khidmat dalam bahasa Indonesia.
- source_word: אַל אֵבוֹשָׁה
  choice: jangan biarkan aku dipermalukan
  rationale: Menyampaikan permohonan negatif dan nuansa kehinaan publik dari akar בושׁ, bukan sekadar perasaan malu batin.
- source_word: כִּי קְרָאתִיךָ
  choice: sebab aku berseru kepada-Mu
  rationale: כִּי memberi alasan bagi permohonan, sedangkan קרא dengan objek ilahi secara idiomatis berarti berseru atau memohon kepada-Nya.
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: biarlah orang-orang fasik dipermalukan
  rationale: Bentuk ini menyatakan harapan atau permohonan; pengulangan 'dipermalukan' mempertahankan kesejajaran dengan permohonan sebelumnya.
- source_word: יִדְּמוּ
  choice: biarlah mereka terdiam
  rationale: Kata kerja ini dapat berarti menjadi diam atau tidak bergerak. 'Terdiam' mempertahankan nuansa keadaan tanpa menambahkan kausatif 'dibungkam'.
- source_word: לִשְׁאוֹל
  choice: di Syeol
  rationale: Transliterasi mempertahankan konsep Ibrani tentang dunia orang mati dan menghindari penyamaan langsung dengan neraka; preposisi diterjemahkan secara kontekstual sebagai lokasi keadaan diam.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi mempertahankan kekhususan nama tersebut.
- issue: Makna שְׁאוֹל
  choice: Syeol
  alternative: dunia orang mati
  rationale: Transliterasi menjaga kekhasan istilah dan tidak memasukkan gagasan teologis kemudian tentang neraka; penjelasan diberikan dalam catatan kaki.
- issue: Daya ungkap יִדְּמוּ
  choice: terdiam
  alternative: menjadi tidak bergerak / turun ke Syeol dalam keheningan
  rationale: Bahasa Ibrani memungkinkan nuansa diam maupun tidak bergerak. Teks utama memilih ungkapan alami yang tidak mengubahnya menjadi bentuk kausatif, sementara alternatif dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. 'Orang-orang fasik' dipilih sebagai padanan yang lazim dan jelas untuk רְשָׁעִים. Huruf kapital pada pronomina ilahi mengikuti kebiasaan ortografis religius Indonesia tanpa mengubah makna sumber.
