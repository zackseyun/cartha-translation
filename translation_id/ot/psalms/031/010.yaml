  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: id
  text: 'Sebab hidupku habis dalam dukacita,

    dan tahun-tahunku dalam keluh kesah;

    kekuatanku goyah[a] karena kesalahanku[b],

    dan tulang-tulangku melemah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani ini dapat berarti “tersandung” atau “terhuyung”; di sini dipakai sebagai kiasan.
    reason: lexical_alternative
  - marker: b
    text: Atau “karena rasa bersalahku” atau “karena akibat kesalahanku”; kata Ibrani dapat menunjuk pada kesalahan, keadaan bersalah, atau akibatnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi ratapan sebelumnya dan mempertahankan daya kausal teks Ibrani.
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: hidupku habis dalam dukacita
  rationale: כָלוּ menyatakan bahwa hidup terkuras atau mencapai akhirnya; bentuk jamak idiomatis חַיַּי diterjemahkan secara wajar sebagai bentuk tunggal ‘hidupku’, sedangkan בְיָגוֹן mempertahankan gambaran hidup yang dijalani dan dihabiskan dalam dukacita.
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: dan tahun-tahunku dalam keluh kesah
  rationale: Mempertahankan kesejajaran puitis dengan baris pertama. אֲנָחָה dapat berarti helaan napas berat atau erangan; ‘keluh kesah’ alami dalam bahasa Indonesia dan menyampaikan penderitaan yang terus-menerus.
- source_word: כָּשַׁל ... כֹחִי
  choice: kekuatanku goyah
  rationale: כָּשַׁל secara harfiah menggambarkan tersandung, terhuyung, atau gagal. ‘Goyah’ mempertahankan metafora ketidakstabilan sekaligus terdengar alami ketika dikenakan pada kekuatan seseorang.
- source_word: בַּעֲוֺנִי
  choice: karena kesalahanku
  rationale: עָוֹן dapat menunjuk pada perbuatan salah, kesalahan sebagai keadaan bersalah, atau akibatnya. ‘Kesalahanku’ mempertahankan dimensi moral tanpa mempersempit makna pada salah satu nuansa saja.
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: dan tulang-tulangku menjadi rapuh
  rationale: Mempertahankan citra tubuh dalam עֲצָמַי. עָשֵׁשׁוּ menyatakan menjadi lemah, merana, atau menyusut; ‘menjadi rapuh’ menyampaikan kemerosotan mendalam dengan bahasa Indonesia yang jelas.
theological_decisions:
- issue: Cakupan makna עָוֹן dalam pengakuan pemazmur
  choice: kesalahanku
  alternative: kejahatanku; rasa bersalahku; akibat kesalahanku
  rationale: Kata Ibrani dapat mencakup tindakan salah, keadaan bersalah, atau akibat kesalahan. Pilihan ini mempertahankan kaitan moral antara keadaan pemazmur dan kelemahannya tanpa menegaskan bahwa ayat ini secara khusus mengajarkan hukuman langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan larik puitis yang ringkas dan bermartabat. Kesejajaran puisi Ibrani dipertahankan, sementara ungkapan dibuat wajar bagi pembaca umum. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
