base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/013.yaml
  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: id
  text: Sebab aku mendengar bisik-bisik[a] dari banyak orang—kengerian di segala penjuru!—ketika mereka bersama-sama berunding melawan aku; mereka merencanakan untuk merenggut nyawaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “fitnah dari banyak orang.” Kata Ibrani ini dapat berarti bisik-bisik, kabar angin, atau perkataan yang memfitnah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan kesesakan pemazmur dalam konteks sekitarnya.
- source_word: שָׁמַעְתִּי
  choice: aku mendengar
  rationale: Bentuk perfektif Ibrani menyatakan tindakan mendengar yang telah dialami; bentuk Indonesia ini alami dan tidak memaksakan aspek yang tidak perlu.
- source_word: דִּבַּת רַבִּים
  choice: gunjingan banyak orang
  rationale: דִּבָּה dapat menunjuk pada kabar yang beredar, bisikan, atau perkataan yang mencemarkan nama. 'Gunjingan' mempertahankan nuansa pembicaraan bermusuhan tanpa membatasi maknanya hanya pada fitnah.
- source_word: מָגוֹר מִסָּבִיב
  choice: kegentaran dari segala penjuru
  rationale: Menyampaikan ungkapan ringkas tentang rasa takut atau ancaman yang mengepung dari segala arah, dengan diksi yang wajar dan bermartabat.
- source_word: בְּהִוָּסְדָם יַחַד
  choice: ketika mereka bersekongkol bersama-sama
  rationale: Bentuk ini menggambarkan perundingan atau permufakatan bersama dalam konteks yang jelas bermusuhan.
- source_word: עָלַי
  choice: melawan aku
  rationale: Konteks permusuhan memberi preposisi ini daya adversatif, bukan sekadar 'mengenai aku'.
- source_word: לָקַחַת נַפְשִׁי
  choice: untuk mencabut nyawaku
  rationale: נֶפֶשׁ di sini menunjuk pada hidup atau diri pemazmur yang terancam, bukan pada jiwa sebagai unsur abstrak yang terpisah.
- source_word: זָמָמוּ
  choice: mereka merancang
  rationale: Menunjukkan perencanaan yang sengaja dan bermusuhan; klausa mandiri juga mempertahankan struktur serta penekanan verba Ibrani.
