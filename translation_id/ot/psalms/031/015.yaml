translation:
  language: id
  text: Masa hidupku ada dalam tangan-Mu[a]; luputkanlah aku dari tangan musuh-musuhku dan dari orang-orang yang mengejar aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masa-masa yang telah ditetapkan bagiku” atau “keadaan-keadaanku.” Ungkapan Ibrani ini dapat merujuk secara luas pada berbagai masa dan peristiwa dalam kehidupan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: dalam tangan-Mu
  rationale: Mempertahankan metafora Ibrani tentang kuasa dan kendali sekaligus membentuk kesejajaran puitis dengan frasa “dari tangan musuh-musuhku”.
- source_word: עִתֹּתָי
  choice: masa-masaku
  rationale: Bentuk jamak ini dapat mencakup berbagai masa, musim, dan peristiwa dalam kehidupan pemazmur. Pilihan ini mempertahankan keluasan puitisnya tanpa mempersempitnya menjadi sekadar nasib atau keadaan.
- source_word: הַצִּילֵנִי
  choice: lepaskanlah aku
  rationale: Menyampaikan tindakan penyelamatan nyata dari ancaman para musuh dan pengejar dalam bahasa Indonesia yang wajar, tanpa memberi muatan teologis yang lebih luas daripada konteksnya.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Mempertahankan metafora sumber kuasa atau cengkeraman dan kontras yang disengaja dengan “dalam tangan-Mu” pada klausa pertama.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan lazim bagi pihak-pihak yang memusuhi pemazmur.
- source_word: וּמֵרֹדְפָי
  choice: dan dari orang-orang yang mengejar aku
  rationale: Mengungkapkan bentuk partisip Ibrani secara alami dan mempertahankan gambaran konkret tentang orang-orang yang sedang mengejar pemazmur.
theological_decisions:
- issue: Cakupan makna “masa-masaku”
  choice: Rujukan luas kepada berbagai masa dan keadaan hidup pemazmur yang berada dalam kuasa Allah
  alternative: nasibku; waktu-waktu yang ditetapkan bagiku saja
  rationale: Bahasa Ibrani bersifat luas secara puitis. Terjemahan tidak membatasinya pada gagasan nasib yang ketat ataupun hanya pada waktu-waktu tertentu yang telah ditetapkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pronomina “-Mu” menandai rujukan kepada Allah sesuai kelaziman penerbitan Alkitab Indonesia. Struktur metaforis “dalam tangan-Mu” dan “dari tangan musuh-musuhku” dipertahankan karena penting bagi kesejajaran ayat.
