base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: id
  text: 'Kepada-Mu, ya Yahweh, aku telah berlindung;

    janganlah aku dipermalukan selama-lamanya.

    Dalam kebenaran-Mu[a], selamatkanlah aku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dalam keadilan-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: Pada-Mu
  rationale: Ungkapan ini mempertahankan Yahweh sebagai tujuan dan tempat perlindungan secara metaforis, sekaligus terdengar alami dalam bahasa Indonesia; menerjemahkannya sebagai 'aku percaya kepada-Mu' akan mengaburkan gambaran perlindungan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar 'TUHAN'.
- source_word: חָסִיתִי
  choice: aku telah berlindung
  rationale: Bentuk qatal menunjukkan tindakan atau keadaan berlindung yang telah diteguhkan; bentuk ini juga mempertahankan citra konkret mencari perlindungan.
- source_word: אַל אֵבוֹשָׁה לְעוֹלָם
  choice: jangan biarkan aku dipermalukan selama-lamanya
  rationale: Merender permohonan negatif dan makna בוש sebagai mengalami kehinaan akibat harapan yang gagal, bukan sekadar merasa malu secara batin.
- source_word: בְּצִדְקָתְךָ
  choice: Dalam kebenaran-Mu
  rationale: Mempertahankan keluasan makna צְדָקָה sebagai sifat dan tindakan Allah yang benar. Preposisi ב tetap terbuka untuk dipahami sebagai dasar atau sarana penyelamatan.
- source_word: פַלְּטֵנִי
  choice: selamatkanlah aku
  rationale: Imperatif piel meminta tindakan penyelamatan yang aktif. 'Selamatkanlah aku' alami, jelas, dan tetap sesuai dengan ragam doa mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; mempertahankan 'Yahweh' membedakan nama pribadi ini dari gelar.
- issue: Makna צְדָקָה dalam kaitannya dengan tindakan penyelamatan Allah
  choice: kebenaran
  alternative: keadilan
  rationale: '''Kebenaran'' mempertahankan cakupan leksikal dan teologis yang luas, sedangkan ''keadilan'' merupakan nuansa sah yang dapat lebih menonjolkan tindakan mengadili dengan adil; alternatif itu dicatat tanpa menutup ambiguitas sumber.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'ya Yahweh' cocok untuk doa langsung; kapitalisasi pronomina ilahi mengikuti kelaziman ragam Alkitab Indonesia. Susunan baris mempertahankan paralelisme puisi tanpa membuat kalimat terasa kaku.
