  yaml_path: translation/ot/psalms/031/000.yaml
  text: For the choirmaster. A psalm of David[a].
translation:
  language: id
  text: Untuk pemimpin musik. Mazmur Daud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga berarti “mazmur karya Daud” atau “mazmur untuk Daud”; judul bahasa Ibrani dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini menunjuk kepada orang yang memimpin atau mengawasi penyajian musik. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan awalan ל sebagai “untuk” dalam konteks judul mazmur.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah istilah baku bagi nyanyian yang lazimnya berkaitan dengan iringan musik dan paling sesuai dengan genre kitab ini.
- source_word: לְדָוִד
  choice: Daud
  rationale: Ungkapan “Mazmur Daud” alami dan tradisional dalam bahasa Indonesia serta tidak membatasi hubungan dengan Daud hanya pada kepengarangan; bentuk Ibraninya juga dapat menyatakan kaitan, peruntukan, atau kepemilikan.
theological_decisions:
- issue: Nuansa keterangan yang mengaitkan mazmur dengan Daud
  choice: Mazmur Daud
  alternative: Mazmur karya Daud; Mazmur untuk Daud
  rationale: Kata depan לְ tidak memastikan satu jenis hubungan saja. “Mazmur Daud” mempertahankan keluwesan sumber, sedangkan “karya Daud” akan menegaskan kepengarangan secara lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Pemimpin musik” dipilih daripada istilah lama “pemimpin biduan” agar mudah dipahami pembaca masa kini. Penanda catatan kaki ditempatkan langsung setelah “Daud”, yaitu unsur yang dijelaskannya.
