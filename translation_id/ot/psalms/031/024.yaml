  text: חִ֭זְקוּ וְ/יַאֲמֵ֣ץ לְבַבְ/כֶ֑ם כָּל הַ֝/מְיַחֲלִ֗ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: id
  text: Kuatlah, dan biarlah hatimu teguh, semua orang yang menantikan[a] Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang berharap kepada Yahweh.” Partisipel Ibrani ini dapat mengandung makna menanti sekaligus berharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: Hendaklah kamu kuat
  rationale: Imperatif Qal jamak ini merupakan seruan agar para pendengar bersikap kuat. Bentuk ini mempertahankan daya perintah dan terdengar wajar dalam bahasa Indonesia.
- source_word: וְיַאֲמֵץ
  choice: dan hendaklah ... teguh
  rationale: Bentuk Hifil imperfek ini berfungsi sebagai ajakan atau harapan setelah imperatif. Ungkapan ini mempertahankan nuansa penguatan tanpa mengulang kata 'kuat' secara kaku.
- source_word: לְבַבְכֶם
  choice: hatimu
  rationale: Dalam konteks puisi ini, לֵבָב menunjuk pada batin sebagai pusat keberanian dan kemauan. 'Hati' adalah padanan Indonesia yang alami dan mudah dipahami.
- source_word: כָּל
  choice: semua orang
  rationale: Kuantor ini mencakup seluruh kelompok yang disapa.
- source_word: הַמְיַחֲלִים
  choice: yang menantikan
  rationale: Partisipel יחל mengandung gagasan menunggu dengan penuh pengharapan. 'Menantikan' mempertahankan citra menunggu, sedangkan nuansa 'berharap' dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Preposisi ל dengan יחל menandai pribadi yang dinantikan, dan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' untuk mempertahankan nama perjanjian dalam teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Pelaku atau sifat dalam וְיַאֲמֵץ לְבַבְכֶם
  choice: hendaklah hatimu teguh
  alternative: kiranya Ia meneguhkan hatimu
  rationale: Bentuk Ibrani dapat dipahami sebagai ungkapan jussif tentang keteguhan hati, sementara pembacaan dengan pelaku tersirat juga mungkin secara gramatikal. Teks utama mengikuti alur nasihat paralel tanpa memasukkan pelaku ilahi yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis-dignified. Pengulangan 'hendaklah' mempertahankan susunan nasihat Ibrani, sedangkan sapaan 'hai semua orang' menandai seruan langsung kepada seluruh komunitas.
