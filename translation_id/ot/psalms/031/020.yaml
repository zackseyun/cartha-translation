  naturalness: '"Dalam naungan hadirat-Mu" merupakan ungkapan puitis-baku yang alami dan tetap menyampaikan fungsi סֵתֶר. "Dalam tempat perlindungan" alami untuk סֻכָּה dalam konteks ini. "Perbantahan lidah" mempertahankan metafora puitis tanpa pluralisasi "lidah-lidah" yang janggal dalam bahasa Indonesia.'
