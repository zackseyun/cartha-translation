  text: תַּסְתִּירֵ֤/ם בְּ/סֵ֥תֶר פָּנֶי/ךָ֮ מֵֽ/רֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥/ם בְּ/סֻכָּ֗ה מֵ/רִ֥יב לְשֹׁנֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: id
  text: Engkau menyembunyikan mereka dalam naungan hadirat-Mu dari siasat manusia[a]; Engkau menyembunyikan mereka dalam tempat perlindungan dari perbantahan lidah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "rencana jahat manusia", "persekongkolan manusia", atau "komplotan manusia". Kata Ibrani yang diterjemahkan "siasat" langka dan mungkin menunjuk pada gabungan orang yang bermusuhan atau pada rencana mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "perbantahan lidah-lidah", yakni perkataan yang bermusuhan, menuduh, atau memfitnah.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: Engkau menyembunyikan mereka
  rationale: Bentuk kausatif dari סתר menyatakan tindakan membuat seseorang tersembunyi atau terlindung; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tindakan aktif Allah.
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: dalam lindungan hadirat-Mu
  rationale: סֵתֶר menunjuk tempat tersembunyi atau tempat perlindungan, sedangkan פָּנִים secara harfiah berarti 'wajah' tetapi di sini secara wajar menyatakan kehadiran. Terjemahan ini mempertahankan gagasan perlindungan sekaligus kedekatan dengan Allah.
- source_word: מֵרֻכְסֵי אִישׁ
  choice: dari persekongkolan manusia
  rationale: רֻכְסֵי adalah bentuk langka dan sulit yang dalam konteks ini tampaknya menunjuk pada gabungan atau rancangan manusia yang bermusuhan. 'Persekongkolan' menjaga nuansa tindakan bersama tanpa menutup kemungkinan arti 'rencana jahat' atau 'komplotan'.
- source_word: תִּצְפְּנֵם
  choice: Engkau menyembunyikan mereka
  rationale: צפן dapat berarti menyembunyikan, menyimpan, atau menjaga sesuatu tetap aman. Pengulangan 'menyembunyikan' dapat diterima dalam paralelisme puisi dan paling langsung menyampaikan perlindungan yang dimaksud.
- source_word: בְּסֻכָּה
  choice: di sebuah pondok perlindungan
  rationale: סֻכָּה secara konkret berarti pondok atau naungan sementara. Penambahan 'perlindungan' memperjelas fungsi pondok dalam konteks ini tanpa mengubah citra dasarnya.
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: dari pertengkaran lidah-lidah
  rationale: רִיב berarti pertengkaran, perselisihan, atau perbantahan, dan לְשֹׁנוֹת secara harfiah berarti 'lidah-lidah'. Citra puitis ini dipertahankan, sementara catatan kaki menjelaskan bahwa maksudnya ialah ujaran yang bermusuhan atau memfitnah.
theological_decisions:
- issue: Cakupan antropologis אִישׁ
  choice: manusia
  alternative: orang laki-laki; orang-orang
  rationale: Kata Ibrani berbentuk tunggal maskulin, tetapi di sini berfungsi sebagai sebutan representatif bagi manusia yang menyusun persekongkolan. 'Manusia' mempertahankan bentuk tunggal kolektif tanpa membatasi rujukannya secara tidak perlu kepada laki-laki.
- issue: Makna פָּנֶיךָ dalam gambaran perlindungan ilahi
  choice: hadirat-Mu
  alternative: wajah-Mu
  rationale: Arti harfiahnya adalah 'wajah-Mu', tetapi dalam konstruksi ini kata tersebut menunjuk pada kehadiran Allah. 'Hadirat-Mu' menyampaikan relasi dan kedekatan ilahi tanpa mengubah perlindungan menjadi konsep abstrak.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti register Alkitab bahasa Indonesia. Paralelisme kedua bagian dipertahankan, termasuk pengulangan verba 'menyembunyikan' dan metafora 'lidah-lidah'.
