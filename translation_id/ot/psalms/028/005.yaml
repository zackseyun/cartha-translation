source:
  edition: WLC
  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
translation:
  language: id
  text: Sebab mereka tidak memahami perbuatan Yahweh maupun karya tangan-Nya[a]; Dia akan meruntuhkan mereka dan tidak membangun mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab mereka tidak mengindahkan perbuatan Yahweh.”'
    reason: Konstruksi יָבִינוּ אֶל dapat menekankan pengertian atau perhatian/pertimbangan terhadap perbuatan Yahweh.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi permohonan atau penghukuman dalam konteks sebelumnya, sekaligus terdengar wajar dalam gaya mazmur.
- source_word: לֹא יָבִינוּ אֶל
  choice: mereka tidak memahami
  rationale: Kata kerja בין menyatakan pemahaman atau pengertian yang diarahkan kepada sesuatu; pilihan ini mempertahankan arti utama tanpa menerjemahkan preposisi אֶל secara kaku.
- source_word: פְּעֻלֹּת יְהוָה
  choice: perbuatan-perbuatan Yahweh
  rationale: Bentuk jamak menunjuk pada tindakan-tindakan Yahweh; 'perbuatan-perbuatan' jelas dan mempertahankan kesejajaran dengan frasa berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, alih-alih menggantinya dengan gelar.
- source_word: מַעֲשֵׂה יָדָיו
  choice: karya tangan-Nya
  rationale: Mempertahankan ungkapan antropomorfis Ibrani dan bentuk tunggal kolektif secara alami dalam bahasa Indonesia.
- source_word: יֶהֶרְסֵם
  choice: Dia akan meruntuhkan mereka
  rationale: Kata הרס memakai citra penghancuran bangunan; 'meruntuhkan' mempertahankan metafora yang berlawanan dengan בנה.
- source_word: וְלֹא יִבְנֵם
  choice: dan tidak akan membangun mereka kembali
  rationale: Kata בנה berarti 'membangun'. Dalam bahasa Indonesia, 'kembali' membuat antitesis sesudah 'meruntuhkan' lebih alami, tanpa mengubah hasil akhir yang dinyatakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Subjek tersirat pada יֶהֶרְסֵם
  choice: Dia, yaitu Yahweh
  alternative: Ungkapan impersonal
  rationale: Bentuk verba maskulin tunggal paling wajar kembali kepada Yahweh dalam klausa sebelumnya, tetapi teks tidak menambahkan gelar baru.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia. Citra meruntuhkan dan membangun dipertahankan.
