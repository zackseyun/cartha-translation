base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/009.yaml
  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: id
  text: Selamatkanlah umat-Mu dan berkatilah pusaka-Mu; gembalakanlah mereka[a] dan angkatlah mereka[b] selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berilah mereka makan”; kata Ibrani ini dapat berarti menggembalakan, termasuk memberi makan kawanan.
    reason: lexical_alternative
  - marker: b
    text: Atau “bawalah mereka”, “tanggunglah mereka”, atau “topanglah mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Selamatkanlah
  rationale: Bentuk imperatif yang ditujukan kepada Allah. Pilihan ini langsung, alami, dan mempertahankan daya makna pembebasan serta keselamatan.
- source_word: עַמֶּךָ
  choice: umat-Mu
  rationale: Menunjuk kepada bangsa atau umat yang menjadi milik Allah. Dalam konteks doa dan perjanjian, “umat-Mu” lebih alami daripada “bangsa-Mu”.
- source_word: בָרֵךְ
  choice: berkatilah
  rationale: Padanan langsung bagi imperatif dalam permohonan doa, dengan nada ibadah yang tetap terjaga.
- source_word: נַחֲלָתֶךָ
  choice: milik pusaka-Mu
  rationale: Mengungkapkan umat sebagai bagian atau kepunyaan yang diwariskan kepada Allah. “Milik pusaka” mempertahankan metafora perjanjian sekaligus terdengar wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: רְעֵם
  choice: gembalakanlah mereka
  rationale: Kata kerja ini mencakup seluruh pekerjaan seorang gembala, termasuk memberi makan, menuntun, dan menjaga; karena itu tidak dipersempit menjadi hanya “berilah mereka makan”.
- source_word: נַשְּׂאֵם
  choice: topanglah mereka
  rationale: Kata נשא dapat berarti mengangkat, menanggung, atau membawa. Dalam kesejajaran dengan tindakan menggembalakan, “topanglah” menyampaikan pemeliharaan yang berkelanjutan tanpa menutup alternatif leksikalnya, yang dicatat dalam catatan kaki.
- source_word: עַד הָעוֹלָם
  choice: selama-lamanya
  rationale: Padanan idiomatis yang mempertahankan gagasan tentang jangka waktu yang terus berlangsung tanpa akhir.
theological_decisions:
- issue: Metafora penggembalaan dalam רְעֵם
  choice: gembalakanlah mereka
  alternative: berilah mereka makan; peliharalah mereka seperti kawanan
  rationale: Kata Ibrani meliputi pemberian makan, tetapi cakupannya lebih luas, yakni seluruh tugas gembala. Pilihan ini menjaga gambaran tentang pemeliharaan dan kepemimpinan Allah tanpa memasukkan penafsiran doktrinal tambahan.
- issue: Identitas umat sebagai נַחֲלָתֶךָ
  choice: milik pusaka-Mu
  alternative: warisan-Mu; kepunyaan-Mu
  rationale: Ungkapan ini menggambarkan umat sebagai pusaka atau kepunyaan Allah. “Milik pusaka-Mu” mempertahankan bahasa perjanjian dan menghindari kesan bahwa Allah menerima harta warisan karena kematian pihak lain, sebagaimana dapat tersirat oleh kata “warisan” dalam pemakaian modern.
- issue: Makna tindakan ilahi dalam נַשְּׂאֵם
  choice: topanglah mereka
  alternative: angkatlah mereka; tanggunglah mereka; bawalah mereka
  rationale: Konteks penggembalaan mendukung nuansa pemeliharaan dan penanggungan, tetapi bentuk Ibraninya tetap memiliki keluasan makna. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan pilihan harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran hormat ilahi ditulis dengan huruf kapital. Susunan dua permohonan pada setiap bagian dipertahankan, demikian pula metafora umat sebagai milik pusaka dan kawanan yang dipelihara Allah.
