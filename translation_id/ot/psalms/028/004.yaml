  - severity: low
    issue: “Kejahatan tindakan mereka” kurang alami
    rationale: Kolokasi tersebut terdengar kaku. “Kejahatan perbuatan mereka” mempertahankan relasi “evil of their deeds” dan lebih lazim dalam register Alkitab Indonesia.
  - severity: low
    issue: “Ganjaran” berpotensi bernuansa positif
    rationale: Walaupun konteksnya negatif, “balasan” lebih netral untuk גְּמוּל dan lebih jelas menyampaikan pembalasan yudisial.
