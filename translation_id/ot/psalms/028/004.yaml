  text: תֶּן לָ/הֶ֣ם כְּ/פָעֳלָ/ם֮ וּ/כְ/רֹ֪עַ מַֽעַלְלֵ֫י/הֶ֥ם כְּ/מַעֲשֵׂ֣ה יְ֭דֵי/הֶם תֵּ֣ן לָ/הֶ֑ם הָשֵׁ֖ב גְּמוּלָ֣/ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: id
  text: Berilah kepada mereka sesuai dengan perbuatan mereka dan sesuai dengan kejahatan perbuatan mereka; sesuai dengan perbuatan tangan mereka, berilah kepada mereka; balaskanlah kepada mereka apa yang patut mereka terima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “Kembalikanlah kepada mereka balasan mereka.”'
    reason: Alternatif yang mempertahankan secara lebih dekat citra הָשֵׁב (“kembalikanlah”) dan pengulangan kata benda גְּמוּלָם (“balasan mereka”).
lexical_decisions:
- source_word: תֶּן לָהֶם
  choice: Balaslah mereka
  rationale: Dalam rangkaian permohonan pembalasan yang diakhiri הָשֵׁב גְּמוּלָם, נתן berarti memberikan kepada mereka akibat yang sepadan. 'Balaslah' menyampaikan maksud retributif secara alami tanpa menambah kadar hukuman.
- source_word: כְּפָעֳלָם
  choice: setimpal dengan perbuatan mereka
  rationale: כְּ menyatakan ukuran atau kesesuaian, sedangkan פֹּעַל menunjuk pada perbuatan. 'Setimpal dengan' mempertahankan gagasan pembalasan menurut perbuatan.
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: dan dengan kejahatan tindakan mereka
  rationale: רֹעַ adalah kejahatan atau keburukan, dan מַעֲלָלִים adalah tindakan atau perbuatan yang dalam konteks ini bernilai moral negatif.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: setimpal dengan pekerjaan tangan mereka
  rationale: Terjemahan ini mempertahankan citra konkret Ibrani tentang apa yang dikerjakan tangan mereka serta pengulangan pola ukurannya.
- source_word: הָשֵׁב
  choice: timpakanlah kepada mereka
  rationale: Bentuk kausatif שוב di sini meminta agar balasan dikembalikan atau dikenakan kepada pelaku. 'Timpakanlah kepada mereka' mengungkapkan arah pembalasan itu secara idiomatis.
- source_word: גְּמוּלָם
  choice: ganjaran yang patut mereka terima
  rationale: גְּמוּל menunjuk pada balasan atau ganjaran yang merupakan akibat perbuatan. Rumusan ini jelas dalam bahasa Indonesia modern dan tidak menentukan apakah ganjaran selalu positif atau negatif di luar konteks ini.
theological_decisions:
- issue: Bahasa kutukan dan pembalasan ilahi
  choice: Ayat diterjemahkan sebagai permohonan langsung agar Allah membalas mereka secara setimpal dengan perbuatan mereka.
  alternative: Melunakkan ayat menjadi pernyataan umum tentang akibat perbuatan, bukan permohonan pembalasan.
  rationale: Tiga bentuk imperatif, תֶּן, תֵּן, dan הָשֵׁב, menunjukkan doa atau permohonan yang tegas. Terjemahan mempertahankan ketegangan teologis ini tanpa memperkerasnya melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme serta citra 'pekerjaan tangan' dipertahankan; 'setimpal' memperjelas fungsi preposisi כְּ sebagai ukuran pembalasan.
