revisions:
- from: Balaslah mereka setimpal dengan perbuatan mereka dan dengan kejahatan tindakan mereka. Balaslah mereka setimpal dengan pekerjaan tangan mereka; timpakanlah kepada mereka ganjaran yang patut mereka terima.[a]
  to: Berilah kepada mereka sesuai dengan perbuatan mereka dan sesuai dengan kejahatan perbuatan mereka; sesuai dengan perbuatan tangan mereka, berilah kepada mereka; balaskanlah kepada mereka apa yang patut mereka terima.[a]
  rationale: Revisi ini meningkatkan kesepadanan dengan tiga imperatif Ibrani, memperbaiki keluwesan bahasa Indonesia, dan memakai “balasan” untuk menghindari nuansa positif yang mungkin timbul dari “ganjaran.” Permohonan tegas untuk pembalasan ilahi yang setimpal tetap dipertahankan tanpa intensifikasi.
