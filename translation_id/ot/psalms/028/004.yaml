  source_fidelity: Draf dengan tepat mempertahankan ketiga imperatif dan maksud pembalasan yang sepadan. Namun, “Balaslah mereka” kurang langsung mencerminkan תֶּן לָהֶם (“berilah kepada mereka”), dan “ganjaran” dalam pemakaian Indonesia dapat bernuansa positif. Revisi mempertahankan pengulangan ukuran “sesuai dengan/menurut” dan menyatakan גְּמוּלָם sebagai balasan yang patut diterima.
  naturalness: “Kejahatan tindakan mereka” agak kurang idiomatis dalam bahasa Indonesia baku. “Kejahatan perbuatan mereka” lebih dekat dengan struktur Ibrani, sedangkan “berilah kepada mereka” dan “balaskanlah kepada mereka” jelas serta khidmat.
  terminology: “Balasan” adalah istilah netral dan tepat untuk גְּמוּל dalam konteks penghakiman. “Apa yang patut mereka terima” menyampaikan gagasan ganjaran/balasan yang menjadi hak mereka tanpa menentukan bentuknya di luar konteks.
