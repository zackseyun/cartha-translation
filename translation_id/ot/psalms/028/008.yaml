base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
translation:
  language: id
  text: Yahweh adalah kekuatan bagi mereka, dan Dialah benteng keselamatan[a] bagi orang yang diurapi-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “benteng pembebasan” atau “benteng bagi tindakan-tindakan penyelamatan”; kata Ibraninya berbentuk jamak, secara harfiah “keselamatan-keselamatan.”
    reason: lexical_alternative
  - marker: b
    text: “Orang yang diurapi-Nya” juga dapat diterjemahkan “Mesias-Nya.” Dalam konteks ini, ungkapan tersebut kemungkinan pertama-tama menunjuk kepada raja yang diurapi Yahweh, tetapi tetap memungkinkan resonansi mesianik yang lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi dalam bentuk transliterasi, bukan menggantinya dengan gelar TUHAN.
- source_word: עֹז
  choice: kekuatan
  rationale: Menyampaikan arti dasar kekuatan atau keperkasaan dan membedakannya dari מָעוֹז yang muncul sesudahnya.
- source_word: לָמוֹ
  choice: bagi mereka
  rationale: Mempertahankan bentuk pronomina orang ketiga jamak dalam teks Ibrani tanpa menentukan secara eksplisit siapa yang dimaksud berdasarkan konteks.
- source_word: מָעוֹז
  choice: benteng
  rationale: Mengungkapkan gambaran tempat perlindungan yang kokoh dengan bahasa Indonesia yang wajar dan ringkas.
- source_word: יְשׁוּעוֹת
  choice: keselamatan
  rationale: Bentuk tunggal kolektif ini paling alami dalam bahasa Indonesia; bentuk jamak eksplisit dalam bahasa Ibrani dan kemungkinan nuansanya dijelaskan dalam catatan kaki.
- source_word: מְשִׁיחוֹ
  choice: orang yang diurapi-Nya
  rationale: Menerjemahkan istilah itu secara deskriptif sesuai konteks raja yang diurapi, sambil tidak meniadakan kemungkinan gema mesianik.
- source_word: הוּא
  choice: Dialah
  rationale: Bentuk ini mencerminkan penekanan pronomina mandiri dalam bahasa Ibrani dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah מְשִׁיחוֹ diterjemahkan sebagai gelar “Mesias-Nya” atau sebagai ungkapan deskriptif
  choice: orang yang diurapi-Nya
  alternative: Mesias-Nya
  rationale: Dalam konteks mazmur ini, istilah tersebut pertama-tama dapat menunjuk kepada raja yang diurapi Yahweh. Ungkapan deskriptif mempertahankan arti kontekstual tanpa menutup resonansi mesianik, yang dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Dialah” mempertahankan penekanan teks sumber, sedangkan “benteng keselamatan” menjaga citra perlindungan tanpa menghasilkan ungkapan yang kaku.
