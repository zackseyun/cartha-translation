  text: אַל תִּמְשְׁכֵ֣/נִי עִם רְשָׁעִים֮ וְ/עִם פֹּ֪עֲלֵ֫י אָ֥וֶן דֹּבְרֵ֣י שָׁ֭לוֹם עִם רֵֽעֵי/הֶ֑ם וְ֝/רָעָ֗ה בִּ/לְבָבָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: id
  text: Janganlah seret aku[a] bersama orang-orang fasik, bersama para pelaku kejahatan, yang mengucapkan kata-kata damai kepada sesama mereka[b], padahal kejahatan ada dalam hati mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Janganlah tarik aku bersama orang-orang fasik.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kawan-kawan mereka” atau “sahabat-sahabat mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: menyeret aku
  rationale: Kata kerja משׁך di sini menggambarkan tindakan membawa seseorang secara paksa bersama kelompok lain, kemungkinan ke dalam nasib yang sama. “Menyeret aku” mempertahankan daya permohonan negatif itu tanpa menjelaskan bentuk penghukuman secara berlebihan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Istilah ini menunjuk kepada orang-orang yang jahat secara moral. “Orang-orang fasik” merupakan padanan yang ringkas, bermartabat, dan lazim dalam konteks Mazmur.
- source_word: פֹּעֲלֵי אָוֶן
  choice: para pelaku kejahatan
  rationale: Ungkapan ini menunjuk kepada orang-orang yang aktif melakukan kejahatan. Padanan ini alami dalam bahasa Indonesia modern dan tetap mempertahankan unsur tindakan.
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: yang mengucapkan kata-kata damai
  rationale: Pilihan ini mempertahankan gambaran Ibrani tentang ucapan damai dan kontrasnya dengan kejahatan batin, tanpa menyimpulkannya hanya sebagai keramahan.
- source_word: רֵעֵיהֶם
  choice: sesama mereka
  rationale: רֵעַ dapat berarti sesama, kawan, atau sahabat. “Sesama mereka” cukup luas untuk konteks hubungan sosial ini dan tidak mengandaikan persahabatan yang sungguh-sungguh.
- source_word: רָעָה בִּלְבָבָם
  choice: kejahatan ada dalam hati mereka
  rationale: Terjemahan ini mempertahankan istilah “hati” sebagai pusat pikiran dan niat batin serta kontras antara ucapan lahiriah dan watak atau maksud di dalam.
theological_decisions:
- issue: Sifat permohonan pemazmur mengenai orang-orang fasik
  choice: Permohonan agar ia tidak dibawa bersama para pelaku kejahatan ke dalam kelompok atau nasib mereka
  alternative: Permohonan agar ia sekadar tidak meniru perilaku orang-orang fasik
  rationale: Gabungan “jangan menyeret aku” dan “bersama orang-orang fasik” paling wajar menunjuk pada tindakan dibawa bersama mereka, mungkin dalam penghukuman. Terjemahan tidak menyebut penghukuman secara eksplisit karena teks Ibrani membiarkan nasib tersebut tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel ayat dipertahankan, sedangkan “padahal” memperjelas kontras yang dinyatakan oleh וְ dalam konteks ini. Semua penanda catatan kaki dicantumkan dalam teks utama.
