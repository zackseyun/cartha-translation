  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: id
  text: Dengarkanlah suara permohonanku yang memohon belas kasihan ketika aku berseru kepada-Mu, ketika aku mengangkat tanganku ke arah ruang terdalam tempat kudus-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tempat kudus-Mu.” Kata Ibrani yang dipakai dapat secara lebih khusus menunjuk pada ruang bagian dalam atau ruang paling dalam dari tempat kudus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarkanlah
  rationale: Imperatif Qal orang kedua maskulin tunggal ini merupakan permohonan langsung kepada Allah. Bentuk ini wajar dalam bahasa doa Indonesia dan menyampaikan desakan.
- source_word: קוֹל תַּחֲנוּנַי
  choice: suara permohonanku memohon belas kasihan
  rationale: קוֹל mempertahankan gambaran konkret 'suara', sedangkan תַּחֲנוּנִים menunjuk pada permohonan sungguh-sungguh untuk memperoleh belas kasihan atau kemurahan.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: ketika aku berseru kepada-Mu
  rationale: Preposisi ב dengan infinitif konstruk berfungsi temporal. 'Berseru' mempertahankan intensitas שׁוע tanpa menambahkan maksud yang tidak dinyatakan.
- source_word: בְּנָשְׂאִי יָדַי
  choice: ketika aku mengangkat tanganku
  rationale: Konstruksi ini kembali bersifat temporal dan menggambarkan gerak tubuh dalam doa secara langsung. Bentuk Ibrani יָדַי secara gramatikal jamak, tetapi ungkapan Indonesia yang alami memakai bentuk kolektif 'tanganku'.
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: ke arah ruang terdalam tempat kudus-Mu
  rationale: דְּבִיר secara khusus menunjuk pada ruang dalam atau ruang paling dalam di tempat kudus. Terjemahan ini mempertahankan kekhususan spasialnya dalam bahasa Indonesia yang mudah dipahami.
theological_decisions:
- issue: Acuan kultis דְּבִיר קָדְשֶׁךָ
  choice: ruang terdalam tempat kudus-Mu
  alternative: tempat kudus-Mu; ruang mahakudus-Mu
  rationale: Ungkapan Ibrani menunjuk pada ruang suci bagian dalam yang dikaitkan dengan kehadiran Allah. 'Ruang terdalam tempat kudus-Mu' mempertahankan citra ruang tanpa menjadikannya istilah teknis denominasi tertentu; alternatif yang lebih umum dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Sapaan kepada Allah memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Pengulangan 'ketika' mempertahankan kesejajaran dua konstruksi temporal dalam bahasa Ibrani.
