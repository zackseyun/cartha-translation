source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: id
  text: Terpujilah Yahweh, sebab Dia telah mendengar seruanku memohon belas kasihan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “suara permohonanku akan belas kasihan.”'
    reason: Menunjukkan susunan harfiah קוֹל תַּחֲנוּנָי serta alternatif leksikal “suara” dan “permohonan”.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Bentuk partisip pasif ini dipakai sebagai seruan pujian. “Terpujilah” merupakan ungkapan doksologis yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan pemazmur memuji Yahweh.
- source_word: שָׁמַע
  choice: telah mendengar
  rationale: Bentuk perfektif menunjukkan tindakan yang sudah terjadi dan menjadi dasar pujian saat ini.
- source_word: קוֹל
  choice: seruanku
  rationale: קוֹל berarti suara atau bunyi; dalam konteks doa, “seruan” menyampaikan unsur suara secara alami tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: תַּחֲנוּנָי
  choice: memohon belas kasihan
  rationale: Nomina ini menunjuk pada permohonan sungguh-sungguh untuk memperoleh kemurahan atau belas kasihan. Bentuk verbal Indonesia menghasilkan kalimat yang jelas dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa pujian. Pronomina “Dia” dipakai agar rujukan kepada Yahweh jelas. Ungkapan “seruanku memohon belas kasihan” mempertahankan gagasan suara sekaligus isi permohonan tanpa kekakuan harfiah.
