  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: id
  text: 'Dari Daud.[a]


    Kepada-Mu aku berseru, ya Yahweh;


    batu karangku, janganlah menutup telinga terhadapku.


    Jangan sampai Engkau membisu terhadapku,


    sehingga aku menjadi seperti orang-orang yang turun ke liang kubur.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Milik Daud,” “untuk Daud,” atau “mengenai Daud.” Ungkapan Ibraninya menyatakan hubungan dengan Daud tanpa selalu menentukan jenis hubungan itu.
    reason: source_ambiguity
  - marker: b
    text: “Liang kubur” dapat menunjuk pada kubur atau dunia orang mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan judul ini secara tradisional mengaitkan mazmur dengan Daud, tetapi preposisi לְ dapat menyatakan hubungan yang lebih luas daripada kepengarangan; alternatif dicatat dalam catatan kaki.
- source_word: צוּרִי
  choice: Gunung batuku
  rationale: Metafora batu besar yang kokoh dipertahankan sebagai sapaan kepada Allah; bentuk posesif diterjemahkan secara alami.
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: janganlah menutup telinga terhadapku
  rationale: Kata kerja dapat menggambarkan sikap tidak mendengar atau berdiam diri. Pilihan ini mempertahankan perbedaan nuansa dengan kata kerja berikutnya, תֶּחֱשֶׁה, yang jelas menekankan kebisuan.
- source_word: תֶּחֱשֶׁה מִמֶּנִּי
  choice: Engkau membisu terhadapku
  rationale: Menyampaikan gagasan bahwa Allah tidak menjawab, sambil mempertahankan pengulangan retoris yang dekat dengan klausa sebelumnya.
- source_word: בוֹר
  choice: liang kubur
  rationale: Dalam konteks turun bersama orang mati, istilah ini menunjuk pada liang atau dunia orang mati. 'Liang kubur' alami dalam bahasa Indonesia, sementara cakupan maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna hubungan Daud dengan mazmur dalam superskripsi
  choice: Dari Daud
  alternative: Milik Daud; untuk Daud; mengenai Daud
  rationale: Teks Ibrani tidak memastikan apakah hubungan itu terutama kepengarangan, kepemilikan, peruntukan, atau keterkaitan; terjemahan utama mengikuti rumusan tradisional tanpa menjadikan salah satu penafsiran sebagai kepastian.
- issue: Akibat kebisuan Allah
  choice: Jangan sampai Engkau membisu terhadapku, sehingga aku menjadi seperti orang-orang yang turun ke liang kubur
  alternative: Jika Engkau membisu terhadapku, aku akan menjadi seperti orang-orang yang turun ke liang kubur
  rationale: Rumusan ini mempertahankan daya permohonan partikel פֶּן dan kaitan antara tidak adanya jawaban Allah dan keadaan pemazmur, tanpa menjelaskan secara berlebihan apakah kemiripan itu berarti kematian harfiah atau keadaan seperti orang mati.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Paralelisme puitis serta sapaan langsung kepada Yahweh dipertahankan. Dua kata kerja yang berdekatan dibedakan sebagai “menutup telinga” dan “membisu” agar nuansa tidak mendengar dan tidak menjawab tetap terasa tanpa menghapus tumpang tindih maknanya.
