  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: id
  text: 'Dari Daud.[a]


    Kepada-Mu, ya Yahweh, aku berseru. Batu karangku, janganlah Engkau tuli kepadaku; jangan sampai Engkau berdiam diri terhadapku dan aku menjadi seperti mereka yang turun ke liang.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk Daud” atau “Oleh Daud.” Hubungan yang dinyatakan oleh judul Ibrani ini dapat dipahami dengan lebih dari satu cara.
    reason: lexical_alternative
  - marker: b
    text: “Liang” dapat menunjuk pada kubur atau ranah orang mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan singkat ini mempertahankan ketaksaan לְ pada judul mazmur, yang dapat menunjuk pada asal, hubungan, kepengarangan, atau peruntukan, tanpa menambahkan kata “mazmur” yang tidak terdapat dalam teks.
- source_word: אֵלֶיךָ
  choice: Kepada-Mu
  rationale: Menyampaikan arah seruan secara langsung dan alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֶקְרָא
  choice: aku berseru
  rationale: Dalam konteks doa, “berseru” menyampaikan tindakan memanggil kepada Allah dengan lebih alami daripada “aku memanggil,” tanpa harus menambah intensitas yang berlebihan.
- source_word: צוּרִי
  choice: Gunung batuku
  rationale: Mempertahankan metafora konkret צוּר tentang kekokohan dan perlindungan. “Gunung batu” merupakan padanan Indonesia yang alami untuk formasi batu besar, bukan sekadar sebongkah batu.
- source_word: אַל תֶּחֱרַשׁ מִמֶּנִּי
  choice: janganlah tuli terhadapku
  rationale: חרשׁ dapat berarti tuli atau diam. Pilihan “tuli” membedakannya dari חשה pada klausa berikutnya dan mempertahankan permainan makna antara tidak mendengar dan tidak menjawab.
- source_word: פֶּן
  choice: jangan sampai
  rationale: Ungkapan ini secara alami memperkenalkan akibat yang ditakuti dalam bahasa Indonesia modern.
- source_word: תֶּחֱשֶׁה מִמֶּנִּי
  choice: Engkau berdiam diri terhadapku
  rationale: Menyampaikan חשה sebagai tidak memberikan jawaban, sambil mempertahankan arah relasional מִמֶּנִּי.
- source_word: וְנִמְשַׁלְתִּי
  choice: dan aku menjadi seperti
  rationale: Bentuk nifal di sini berarti menjadi atau dianggap serupa; ungkapan ini lugas dan mempertahankan hubungan akibat yang ditakuti.
- source_word: עִם יֹרְדֵי בוֹר
  choice: seperti mereka yang turun ke liang
  rationale: “Liang” mempertahankan citra konkret בור tanpa langsung membatasinya hanya pada kubur atau dunia orang mati; “seperti” diperlukan secara alami setelah “menjadi” dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna בור dalam gambaran kematian
  choice: liang
  alternative: liang kubur / dunia orang mati
  rationale: “Liang” mempertahankan metafora Ibrani dan keterbukaannya terhadap kubur maupun ranah kematian, sedangkan alternatif-alternatif tersebut menjelaskan salah satu implikasinya secara lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan tanpa menjadi arkais. Sapaan kepada Allah memakai kapital penghormatan. Tanda titik koma menjaga alur seruan dan permohonan, sedangkan pengulangan “terhadapku” mempertahankan kesejajaran Ibrani. Semua penanda catatan kaki muncul di dalam teks utama.
