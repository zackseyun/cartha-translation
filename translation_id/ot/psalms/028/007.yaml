source:
  edition: WLC
  text: יְהוָ֤ה עֻזִּ֥/י וּ/מָגִנִּ/י֮ בּ֤/וֹ בָטַ֥ח לִבִּ֗/י וְֽ/נֶ֫עֱזָ֥רְתִּי וַ/יַּעֲלֹ֥ז לִבִּ֑/י וּֽ/מִ/שִּׁירִ֥/י אֲהוֹדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: id
  text: Yahweh adalah kekuatanku dan perisaiku; kepada-Nya hatiku percaya, dan aku mendapat pertolongan. Hatiku pun bersukacita, dan dengan nyanyianku aku akan memuji Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku akan mengucap syukur kepada-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: עֻזִּי
  choice: kekuatanku
  rationale: Padanan langsung dan alami bagi nomina yang berarti kekuatan atau daya, serta cocok dengan kesejajaran 'perisaiku'.
- source_word: מָגִנִּי
  choice: perisaiku
  rationale: Mempertahankan metafora konkret מָגֵן, yaitu perisai, yang mudah dipahami dalam bahasa Indonesia.
- source_word: בּוֹ בָטַח לִבִּי
  choice: kepada-Nya hatiku percaya
  rationale: Dalam konstruksi dengan בטח, בּוֹ menyatakan pribadi yang menjadi sandaran kepercayaan. 'Kepada-Nya' alami dalam bahasa Indonesia, sedangkan bentuk perfek 'percaya' dapat menyatakan tindakan yang telah terjadi atau keadaan percaya dalam puisi.
- source_word: וְנֶעֱזָרְתִּי
  choice: dan aku mendapat pertolongan
  rationale: Nifal dari עזר menyatakan bahwa pemazmur ditolong. Ungkapan ini alami dan tidak menentukan pelaku secara eksplisit, sebagaimana teks sumber.
- source_word: וַיַּעֲלֹז לִבִּי
  choice: Hatiku pun bersukacita
  rationale: עלז mengungkapkan sukacita yang kuat. 'Bersukacita' bermartabat dan lazim; 'pun' menyampaikan hubungan hasil tanpa menambahkan hubungan logis yang terlalu kaku.
- source_word: וּמִשִּׁירִי
  choice: dan dengan nyanyianku
  rationale: 'Prefiks מִן di sini paling wajar dipahami sebagai sarana atau pengiring: pujian disampaikan dengan nyanyian.'
- source_word: אֲהוֹדֶנּוּ
  choice: aku akan memuji Dia
  rationale: Hifil ידה dapat berarti memuji atau mengucap syukur. Konteks nyanyian mendukung 'memuji', sementara kemungkinan 'mengucap syukur' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian secara langsung. Transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
- issue: Nuansa אֲהוֹדֶנּוּ
  choice: aku akan memuji Dia
  alternative: aku akan mengucap syukur kepada-Nya
  rationale: Kata kerja ידה mencakup pujian dan ucapan syukur. Konteks שִׁיר mendukung pujian, tetapi nuansa syukur tetap merupakan kemungkinan asli dan dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. Metafora 'perisai' serta ungkapan 'hati' dipertahankan. Kala verba Ibrani tidak dipaksakan menjadi sistem waktu yang kaku; urutan percaya, mendapat pertolongan, lalu bersukacita tetap jelas.
