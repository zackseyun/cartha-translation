  text: בָּרְכ֖וּ עַמִּ֥ים אֱלֹהֵ֑י/נוּ וְ֝/הַשְׁמִ֗יעוּ ק֣וֹל תְּהִלָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/008.yaml
  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: id
  text: Hai bangsa-bangsa, pujilah[a] Allah kami dan perdengarkanlah suara pujian-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “berkatilah.” Dalam konteks memberkati Allah, maksudnya ialah memuji Dia.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “suara pujian bagi-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרְכוּ
  choice: pujilah
  rationale: Bentuk imperatif jamak dari ברך. Ketika Allah menjadi objeknya, "pujilah" menyampaikan idiom Ibrani secara alami dalam bahasa Indonesia; arti harfiahnya, "berkatilah", dicatat dalam catatan kaki.
- source_word: עַמִּים
  choice: hai bangsa-bangsa
  rationale: Nomina jamak ini berfungsi sebagai sapaan kepada banyak kelompok bangsa; "hai bangsa-bangsa" mempertahankan bentuk vokatif dan cakupan kolektifnya.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: Akhiran orang pertama jamak berarti "Allah kami". Kata "kami" mempertahankan sudut pandang komunitas pemazmur yang sedang menyapa bangsa-bangsa.
- source_word: וְהַשְׁמִיעוּ
  choice: perdengarkanlah
  rationale: Bentuk Hifil imperatif dari שמע bersifat kausatif, yakni membuat sesuatu terdengar. "Perdengarkanlah" ringkas, wajar, dan mempertahankan daya perintah tersebut.
- source_word: קוֹל
  choice: suara
  rationale: קוֹל dapat berarti "suara" atau "bunyi"; dalam frasa tentang pujian, "suara" secara alami menunjuk pada ungkapan pujian yang terdengar.
- source_word: תְּהִלָּתוֹ
  choice: pujian bagi-Nya
  rationale: Akhiran orang ketiga tunggal pada "pujian" dapat menunjuk pada pujian yang berkaitan dengan atau ditujukan kepada Allah. "Pujian bagi-Nya" paling jelas dan alami dalam konteks, sedangkan bentuk lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Nuansa akhiran pronominal pada תְּהִלָּתוֹ
  choice: pujian bagi-Nya
  alternative: pujian-Nya
  rationale: Konteks seruan kepada bangsa-bangsa mendukung pengertian pujian yang ditujukan kepada Allah. Namun, karena konstruksi Ibraninya secara formal berbunyi "pujian-Nya" dan tidak menjelaskan hubungan itu secara penuh, bentuk harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, bersifat puitis dan khidmat tetapi tetap mudah dipahami. Sapaan "hai bangsa-bangsa" mempertahankan corak mazmur, sedangkan "perdengarkanlah" menjaga nuansa kausatif tanpa menjadi kaku.
