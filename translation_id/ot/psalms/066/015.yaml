  text: עֹ֘ל֤וֹת מֵחִ֣ים אַעֲלֶה לָּ֭/ךְ עִם קְטֹ֣רֶת אֵילִ֑ים אֶ֥עֱשֶֽׂה בָקָ֖ר עִם עַתּוּדִ֣ים סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: id
  text: Korban-korban bakaran dari hewan-hewan yang gemuk akan kupersembahkan kepada-Mu, beserta asap domba-domba jantan.[a] Aku akan mempersembahkan sapi beserta kambing-kambing jantan. Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani juga dapat dipahami sebagai “beserta bau domba-domba jantan”; kata yang dipakai dapat menunjuk pada asap atau bau yang timbul dari pembakaran korban.
    reason: lexical_alternative
  - marker: b
    text: “Sela” mungkin merupakan petunjuk musik atau liturgis, tetapi makna tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת
  choice: korban-korban bakaran
  rationale: Istilah baku untuk korban yang seluruhnya dibakar di atas mazbah; bentuk jamak dipertahankan.
- source_word: מֵחִים
  choice: ternak yang tambun
  rationale: Menunjuk pada hewan yang gemuk atau dipelihara dengan baik untuk korban yang bernilai; 'tambun' alami dan tidak menyiratkan jenis hewan tertentu.
- source_word: אַעֲלֶה לָךְ
  choice: akan kupersembahkan kepada-Mu
  rationale: Dalam konteks korban, bentuk Hifil dari עלה berarti mempersembahkan sebagai korban, secara harfiah membuatnya naik; sapaan langsung kepada Allah dipertahankan.
- source_word: עִם קְטֹרֶת אֵילִים
  choice: beserta asap domba-domba jantan
  rationale: קְטֹרֶת di sini dapat menunjuk pada asap atau bau yang timbul ketika korban dibakar; 'asap' menjaga citra pembakaran dan tidak memberi kesan bahwa domba itu adalah dupa.
- source_word: אֶעֱשֶׂה
  choice: Aku akan mempersembahkan
  rationale: עשה dapat dipakai secara idiomatis untuk melaksanakan atau mempersembahkan korban; pilihan ini jelas dan alami dalam bahasa Indonesia.
- source_word: בָקָר
  choice: lembu
  rationale: Nomina kolektif ini menunjuk pada ternak sapi; 'lembu' sesuai dengan laras persembahan tanpa mempersempitnya secara pasti menjadi sapi jantan.
- source_word: עַתּוּדִים
  choice: kambing-kambing jantan
  rationale: Kata ini secara khusus menunjuk pada kambing jantan, sehingga kekhususan leksikalnya dinyatakan dalam teks utama.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis atau musikal ini tidak pasti, sehingga ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna tindakan אֶעֱשֶׂה dalam konteks korban
  choice: Aku akan mempersembahkan
  alternative: Aku akan menyiapkan / melakukan
  rationale: Makna idiomatis yang paling mungkin adalah melaksanakan persembahan korban. Terjemahan ini tidak menentukan tata cara ritual lebih jauh daripada yang dinyatakan konteks.
- issue: Cakupan בָקָר
  choice: lembu
  alternative: lembu-lembu jantan
  rationale: Teks memakai sebutan kolektif bagi ternak sapi dan tidak secara eksplisit menentukan jenis kelaminnya; karena itu terjemahan tidak menambahkan 'jantan'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk enklitik pada “kupersembahkan” serta kapitalisasi “-Mu” mempertahankan sapaan langsung kepada Allah secara alami. Istilah korban dibuat jelas bagi pembaca umum tanpa menghapus citra asap, jenis hewan, atau ketidakpastian istilah “Sela”.
