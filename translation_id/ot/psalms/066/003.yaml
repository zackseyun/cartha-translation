  text: אִמְר֣וּ לֵ֭/אלֹהִים מַה נּוֹרָ֣א מַעֲשֶׂ֑י/ךָ בְּ/רֹ֥ב עֻ֝זְּ/ךָ֗ יְֽכַחֲשׁ֖וּ לְ/ךָ֣ אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: id
  text: Katakanlah kepada Allah, “Betapa dahsyat perbuatan-Mu! Karena besarnya kuasa-Mu, musuh-musuh-Mu akan berpura-pura tunduk kepada-Mu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tunduk kepada-Mu dengan terpaksa” atau “menyerah kepada-Mu dengan enggan.” Kata kerja Ibrani ini dapat menunjuk pada ketundukan yang pura-pura atau dipaksakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Katakanlah
  rationale: Imperatif jamak Qal dari אמר mengarahkan umat yang beribadah untuk berkata; bentuk bahasa Indonesia ini alami dan tetap dapat ditujukan kepada sekelompok orang.
- source_word: לֵאלֹהִים
  choice: kepada Allah
  rationale: Preposisi ל menandai Allah sebagai pihak yang disapa.
- source_word: מַה נּוֹרָא
  choice: Betapa dahsyat
  rationale: מַה bersifat seruan, sedangkan נוֹרָא menyatakan sesuatu yang menimbulkan rasa gentar dan takjub. 'Dahsyat' mempertahankan kedua nuansa itu dalam bahasa Indonesia modern.
- source_word: מַעֲשֶׂיךָ
  choice: perbuatan-perbuatan-Mu
  rationale: מַעֲשֶׂה menunjuk pada perbuatan atau karya; bentuk jamak eksplisit cocok dengan konteks pujian.
- source_word: בְּרֹב עֻזֶּךָ
  choice: Karena besarnya kekuatan-Mu
  rationale: בְּ dipahami menyatakan sebab atau dasar, רֹב berarti kebesaran atau kelimpahan, dan עֹז berarti kekuatan atau keperkasaan.
- source_word: יְכַחֲשׁוּ לְךָ
  choice: tunduk dengan terpaksa kepada-Mu
  rationale: Bentuk Piel dari כחש dengan ל dapat menggambarkan ketundukan yang dipaksakan, pura-pura, atau tidak tulus. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur keterpaksaan tanpa menghapus kemungkinan kepura-puraan, yang dicatat dalam catatan kaki.
- source_word: אֹיְבֶיךָ
  choice: musuh-musuh-Mu
  rationale: Padanan langsung bagi bentuk jamak אויב dengan sufiks orang kedua maskulin tunggal.
theological_decisions:
- issue: Sifat tanggapan para musuh kepada Allah
  choice: Ketundukan yang terpaksa dan tidak harus tulus
  alternative: Sekadar 'tunduk kepada-Mu' atau secara khusus 'berpura-pura tunduk kepada-Mu'
  rationale: כחש dalam bentuk ini dapat mengandung gagasan kepatuhan palsu atau ketundukan di bawah paksaan. Teks utama menonjolkan keterpaksaan, sedangkan catatan kaki mempertahankan cakupan makna kepura-puraan dan keengganan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. 'Dahsyat' dipilih untuk menyampaikan rasa takjub sekaligus gentar.
