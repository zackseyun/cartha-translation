  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: id
  text: Untuk pemimpin musik[a]. Sebuah nyanyian, sebuah mazmur. Bersoraklah kepada Allah, hai seluruh bumi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk pemimpin paduan suara” atau “Untuk pemimpin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Istilah ini menunjuk kepada orang yang memimpin atau mengawasi penyajian musik. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan fungsi musikal-liturgisnya.
- source_word: שִׁיר
  choice: Sebuah nyanyian
  rationale: Padanan langsung dan wajar untuk label jenis karya ini.
- source_word: מִזְמוֹר
  choice: sebuah mazmur
  rationale: Padanan baku bagi istilah teknis מִזְמוֹר. Kedua label, 'nyanyian' dan 'mazmur', dipertahankan karena keduanya terdapat dalam teks Ibrani.
- source_word: הָרִיעוּ
  choice: Bersoraklah
  rationale: Kata kerja ini menyatakan seruan keras yang lazimnya bernuansa sukacita atau kemenangan. 'Bersoraklah' menyampaikan daya vokal dan suasana perayaan tanpa ungkapan yang kaku.
- source_word: לֵאלֹהִים
  choice: bagi Allah
  rationale: Preposisi לְ menandai Allah sebagai tujuan atau penerima sorak-sorai. 'Bagi Allah' alami dalam seruan pujian bahasa Indonesia; 'kepada Allah' juga mungkin.
- source_word: כָּל הָאָרֶץ
  choice: hai seluruh bumi
  rationale: Dalam konteks panggilan pujian mazmur ini, הָאָרֶץ paling tepat dipahami secara universal sebagai bumi, bukan hanya suatu wilayah. Partikel vokatif 'hai' membuat pihak yang disapa jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan seruan dalam כָּל הָאָרֶץ
  choice: panggilan universal kepada seluruh bumi
  alternative: seruan kepada seluruh negeri atau ranah daratan
  rationale: Konteks pujian dalam mazmur mendukung cakupan universal. 'Seluruh bumi' mempertahankan keluasan seruan tanpa menambahkan gagasan yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Superskripsi dipertahankan sebagai dua label genre yang terpisah. Tanda seru menyampaikan bentuk imperatif dan karakter aklamatif ayat.
