  text: Sing the glory of his name[a]; make his praise glorious.
translation:
  language: id
  text: Nyanyikanlah kemuliaan nama-Nya; jadikanlah pujian-Nya mulia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “taruhlah kemuliaan pada pujian-Nya.” Ungkapan Ibrani ini memakai kata benda “kemuliaan” dalam idiom yang dapat juga diterjemahkan, “muliakanlah pujian-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Nyanyikanlah
  rationale: Bentuk perintah jamak dari זמר menyerukan pujian melalui nyanyian atau musik. “Nyanyikanlah” alami dan ringkas dalam bahasa Indonesia.
- source_word: כְבוֹד שְׁמוֹ
  choice: kemuliaan nama-Nya
  rationale: 'Terjemahan ini mempertahankan hubungan konstruksi Ibrani: kemuliaan atau kehormatan yang terkait dengan nama-Nya, bukan sekadar sifat “nama yang mulia”.'
- source_word: שִׂימוּ כָבוֹד תְּהִלָּתוֹ
  choice: muliakanlah Dia dengan puji-pujianmu
  rationale: Secara harfiah ungkapan ini berarti “taruhlah/jadikanlah kemuliaan pujian-Nya.” Rumusan Indonesia ini mengungkapkan seruan agar umat memberi kemuliaan kepada Allah melalui pujian, sambil mencatat bentuk yang lebih harfiah dalam catatan kaki.
theological_decisions:
- issue: Acuan sufiks pada תְּהִלָּתוֹ dan fungsi idiom שִׂימוּ כָבוֹד
  choice: muliakanlah Dia dengan puji-pujianmu
  alternative: jadikanlah pujian kepada-Nya mulia / berikanlah kemuliaan kepada pujian-Nya
  rationale: Bahasa Ibrani padat dan dapat dipahami sebagai membuat pujian kepada-Nya menjadi mulia atau memberi kemuliaan melalui pujian. Teks utama memilih ungkapan Indonesia yang alami tanpa menetapkan doktrin khusus; alternatif yang lebih harfiah dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Akhiran “-lah” mempertahankan nada seruan puitis; “nama-Nya” memakai kapitalisasi penghormatan yang lazim dalam penerbitan Alkitab berbahasa Indonesia.
