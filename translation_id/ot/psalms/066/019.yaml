lexical_decisions:
- source_word: אָכֵן
  choice: Sungguh
  rationale: Partikel ini menegaskan kepastian kesaksian pemazmur; “Sungguh” alami dan tetap mempertahankan daya penegasannya.
- source_word: שָׁמַע
  choice: telah mendengar
  rationale: Bentuk perfektif menyajikan tindakan itu sebagai sudah terlaksana, dengan relevansi bagi pengakuan pemazmur saat ini.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini berpadanan dengan verba tunggal dan dalam konteks ini menunjuk kepada Allah yang esa; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: הִקְשִׁיב
  choice: memperhatikan
  rationale: Bentuk Hifil dari קשׁב menyatakan tindakan mendengarkan dengan penuh perhatian. “Memperhatikan” membedakannya dari שָׁמַע dan menyampaikan unsur perhatian yang disengaja.
- source_word: בְּקוֹל
  choice: suara
  rationale: Frasa Ibrani secara harfiah memakai kata “suara/bunyi” dengan preposisi בְּ. Dalam konstruksi dengan הִקְשִׁיב, bahasa Indonesia secara alami dapat menyatakannya tanpa menerjemahkan preposisi secara tersendiri.
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: Padanan langsung dan alami bagi nomina dengan sufiks orang pertama tunggal, “doa saya/aku”.
