id: PSA.66.4
reference: Psalms 66:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל הָ/אָ֤רֶץ יִשְׁתַּחֲו֣וּ לְ֭/ךָ וִֽ/יזַמְּרוּ לָ֑/ךְ יְזַמְּר֖וּ שִׁמְ/ךָ֣ סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/004.yaml
  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: id
  text: 'Seluruh bumi akan bersujud kepada-Mu[a]

    dan menyanyikan pujian bagi-Mu;

    mereka akan menyanyikan pujian bagi nama-Mu.

    Sela[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah-Mu.” Kata kerja Ibrani ini dapat menunjuk pada tindakan bersujud sebagai bentuk penyembahan.
    reason: lexical_alternative
  - marker: b
    text: “Sela” tampaknya merupakan petunjuk musik atau liturgi; makna tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: Seluruh bumi
  rationale: Ungkapan ini bersifat menyeluruh dan, dalam konteks mazmur, menunjuk pada bumi beserta seluruh penghuninya, bukan hanya suatu negeri tertentu.
- source_word: יִשְׁתַּחֲווּ
  choice: akan bersujud
  rationale: Kata kerja Ibrani ini menggambarkan tindakan merendahkan diri atau bertelut sampai sujud di hadapan Allah. Pilihan ini mempertahankan gambaran jasmaninya sekaligus menyiratkan penyembahan.
- source_word: לְךָ / לָךְ
  choice: kepada-Mu / bagi-Mu
  rationale: Preposisi tersebut mengarahkan kedua tindakan kepada Allah. Bentuk Indonesia disesuaikan secara alami dengan masing-masing kata kerja tanpa mengubah acuannya.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: menyanyikan pujian
  rationale: Dalam konteks pujian kepada Allah, זמר berarti menyanyi atau bermusik sebagai pujian. Frasa ini jelas bagi pembaca modern dan mempertahankan pengulangan sumber.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Terjemahan langsung ini mempertahankan ungkapan alkitabiah yang dapat mencakup pribadi, sifat, dan kemasyhuran Allah tanpa mempersempit maknanya.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis atau musikal ini tidak pasti; karena itu istilah tersebut dipertahankan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Apakah יִשְׁתַּחֲווּ diterjemahkan dengan istilah abstrak untuk penyembahan atau dengan tindakan jasmani yang konkret
  choice: akan bersujud
  alternative: akan menyembah
  rationale: Kata Ibrani mencakup penyembahan melalui tindakan sujud. Terjemahan konkret mempertahankan citra sumber tanpa meniadakan makna penyembahannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “menyanyikan pujian” dipertahankan untuk mencerminkan struktur puisi Ibrani. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
