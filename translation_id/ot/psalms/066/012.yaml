  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: id
  text: Engkau membuat seorang manusia berkendara di atas kepala kami; kami melalui api dan air, namun Engkau membawa kami keluar ke dalam kelimpahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: seorang manusia
  rationale: Bentuk tunggal dipertahankan sesuai teks Masoret; אֱנוֹשׁ menekankan manusia fana tanpa menentukan identitasnya.
- source_word: הִרְכַּבְתָּ ... לְרֹאשֵׁנוּ
  choice: Engkau membiarkan ... melindas kepala kami
  rationale: Secara harfiah menggambarkan Allah membuat seseorang berkendara di atas kepala umat; 'melindas' menyampaikan citra penaklukan dan penghinaan secara alami dalam bahasa Indonesia.
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם
  choice: kami telah melewati api dan air
  rationale: Ungkapan kiasan tentang cobaan berat dipertahankan dengan citra sumber, tanpa dijelaskan dalam teks utama.
- source_word: לָרְוָיָה
  choice: menuju kelimpahan
  rationale: Kata ini menunjuk keadaan berlimpah atau penuh kelegaan; 'kelimpahan' mempertahankan keluasan maknanya tanpa mempersempitnya menjadi tempat tertentu.
theological_decisions:
- issue: Peranan Allah dalam penindasan umat
  choice: Engkau membiarkan seorang manusia melindas kepala kami
  alternative: Engkau membuat seorang manusia berkendara di atas kepala kami
  rationale: Bentuk kausatif Ibrani mengaitkan peristiwa itu dengan tindakan Allah. 'Membiarkan' menyatakan kedaulatan-Nya dalam ujian tanpa memaksakan bahwa Allah adalah pelaku langsung kekejaman, sambil tetap menjaga ketegangan teologis konteks.
- issue: Tujuan akhir לָרְוָיָה
  choice: menuju kelimpahan
  alternative: ke tempat yang lapang
  rationale: Makna dapat mencakup kelimpahan, kepuasan, dan kelegaan. Pilihan ini mengikuti pengertian leksikal utama tanpa menambahkan konsep keselamatan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralel 'api dan air' serta peralihan dari penindasan menuju kelimpahan dipertahankan. Huruf kapital pada kata ganti ilahi mengikuti konvensi umum terjemahan Alkitab bahasa Indonesia.
