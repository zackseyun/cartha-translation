  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: id
  text: Mari, dengarlah, hai semua orang yang takut akan Allah; aku akan menceritakan apa yang telah dilakukan-Nya bagi diriku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi jiwaku” atau “bagi hidupku.” Ibrani נפשׁ (nefesh), di sini dalam bentuk “nafshi” (“diriku”), dapat berarti “diri,” “jiwa,” atau “hidup/kehidupan,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Mari
  rationale: Secara harfiah verba ini berkaitan dengan pergi atau berjalan, tetapi dalam ajakan seperti ini berfungsi idiomatis untuk mengundang para pendengar. “Mari” paling alami dalam bahasa Indonesia.
- source_word: שִׁמְעוּ
  choice: dengarlah
  rationale: Bentuk imperatif dipertahankan dan menyatakan panggilan untuk mendengar dengan penuh perhatian.
- source_word: וַאֲסַפְּרָה
  choice: aku akan menceritakan
  rationale: Bentuk ini menyatakan niat pembicara untuk menuturkan kembali perbuatan Allah. “Menceritakan” merupakan padanan Indonesia yang alami bagi ספר dalam konteks ini.
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: hai semua orang yang takut akan Allah
  rationale: Ungkapan ini menunjuk kepada orang-orang yang hidup dalam rasa gentar, hormat, dan takzim kepada Allah. “Takut akan Allah” mempertahankan keluasan ungkapan Ibrani tanpa melemahkannya menjadi sekadar rasa hormat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: אֱלֹהִים adalah gelar ilahi, bukan nama perjanjian YHWH; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: אֲשֶׁר עָשָׂה
  choice: apa yang telah dilakukan-Nya
  rationale: Klausa relatif diterjemahkan secara alami, sedangkan “telah” menunjukkan tindakan yang sudah terjadi dan kini disaksikan oleh pemazmur.
- source_word: לְנַפְשִׁי
  choice: bagiku
  rationale: נֶפֶשׁ dapat menunjuk pada diri atau kehidupan seseorang, bukan selalu “jiwa” sebagai bagian tak berjasad. “Bagiku” alami dalam konteks kesaksian ini, sementara cakupan leksikal aslinya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna “takut akan Allah”
  choice: mempertahankan ungkapan “takut akan Allah”
  alternative: “menghormati Allah” atau “gentar ketakutan di hadapan Allah”
  rationale: Konstruksi Ibrani mencakup rasa gentar, takzim, dan ketaatan religius. Terjemahan tidak mempersempitnya menjadi penghormatan biasa ataupun teror semata.
- issue: Cakupan makna נֶפֶשׁ
  choice: “bagiku” dalam teks utama, dengan alternatif leksikal dalam catatan kaki
  alternative: “bagi jiwaku,” “bagi nyawaku,” atau “bagi diriku”
  rationale: Dalam konteks ini נֶפֶשׁ dapat menyatakan seluruh diri atau kehidupan pemazmur. “Bagiku” menghindari pemaksaan antropologi dualistis, sedangkan catatan kaki mempertahankan ambiguitas istilah Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Seruan “hai” mempertahankan sapaan langsung dalam puisi, sedangkan “Mari, dengarlah” menyampaikan dua imperatif Ibrani secara alami. Huruf kapital pada pronomina “-Nya” mengikuti kebiasaan penulisan religius Indonesia.
