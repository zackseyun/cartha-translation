id: PSA.66.6
reference: Psalms 66:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הָ֤פַךְ יָ֨ם לְֽ/יַבָּשָׁ֗ה בַּ֭/נָּהָר יַֽעַבְר֣וּ בְ/רָ֑גֶל שָׁ֝֗ם נִשְׂמְחָה בּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: id
  text: Ia mengubah laut menjadi tanah kering; mereka menyeberangi sungai dengan berjalan kaki.[a] Di sana, marilah kita bersukacita di dalam Dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini kemungkinan mengingat kembali penyeberangan laut pada waktu keluaran dan penyeberangan Sungai Yordan ketika Israel memasuki negeri itu.
    reason: cross_reference
  - marker: b
    text: Atau, “di sana kita bersukacita di dalam Dia.” Bentuk Ibraninya dapat dipahami sebagai pernyataan retrospektif, bukan sebagai ajakan.
    reason: alternative_reading
lexical_decisions:
- source_word: הָפַךְ
  choice: mengubah
  rationale: Kata kerja ini menyatakan perubahan keadaan. “Mengubah” alami dalam bahasa Indonesia dan mempertahankan gambaran laut yang dijadikan tanah kering.
- source_word: יָם
  choice: laut
  rationale: Padanan langsung yang tidak mempersempit rujukan menjadi nama laut tertentu, meskipun konteksnya mengingatkan pada peristiwa keluaran.
- source_word: לְיַבָּשָׁה
  choice: menjadi tanah kering
  rationale: Preposisi לְ bersama nomina יַבָּשָׁה menyatakan hasil perubahan, yaitu laut menjadi daratan atau tanah yang kering.
- source_word: בַּנָּהָר
  choice: sungai
  rationale: Nomina ini berarti “sungai”. Hubungan lokatifnya dinyatakan secara alami melalui verba Indonesia “menyeberangi”.
- source_word: יַעַבְרוּ
  choice: mereka menyeberangi
  rationale: Kata kerja עבר menyatakan gerak melintas atau menyeberang. Bentuk imperfek dipahami dalam pengisahan puitis tentang tindakan penyelamatan yang telah terjadi.
- source_word: בְרָגֶל
  choice: dengan berjalan kaki
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan bahwa mereka melintas dengan kaki, bukan dengan perahu, dan selaras dengan gambaran dasar sungai yang kering.
- source_word: שָׁם
  choice: di sana
  rationale: Adverbia tempat dipertahankan tanpa menentukan apakah yang dimaksud terutama lokasi historis atau peristiwa penyelamatan yang dikenang.
- source_word: נִשְׂמְחָה
  choice: marilah kita bersukacita
  rationale: Bentuk orang pertama jamak ini secara morfologis paling wajar dibaca sebagai kohortatif, yakni ajakan bersama. Kemungkinan pembacaan retrospektif tetap dicatat dalam catatan kaki.
- source_word: בּוֹ
  choice: di dalam Dia
  rationale: Pronomina maskulin tunggal paling mungkin merujuk kepada Allah dalam konteks mazmur. “Di dalam Dia” mempertahankan bentuk relasional bahasa Ibrani tanpa mengubahnya menjadi sekadar sebab kegembiraan.
theological_decisions:
- issue: Nilai waktu atau modal pada נִשְׂמְחָה
  choice: 'Ajakan: “marilah kita bersukacita”'
  alternative: 'Pernyataan retrospektif: “kita bersukacita” atau “kita telah bersukacita”'
  rationale: Bentuk Ibrani mendukung nuansa kohortatif, sedangkan alur yang mengenang karya Allah memungkinkan pemahaman retrospektif. Teks utama mengikuti bentuk gramatikal yang paling langsung, dan catatan kaki mempertahankan alternatifnya.
- issue: Identifikasi peristiwa laut dan sungai
  choice: Teks utama hanya menyebut “laut” dan “sungai”
  alternative: Menyebut secara eksplisit Laut Teberau/Laut Merah dan Sungai Yordan
  rationale: Bahasa Ibrani tidak memberikan nama diri dalam ayat ini. Catatan kaki dapat menjelaskan kemungkinan kuat bahwa kedua ungkapan itu mengenang keluaran dan penyeberangan Sungai Yordan tanpa memasukkannya ke dalam teks.
- issue: Rujukan pronomina בּוֹ
  choice: 'Dipahami merujuk kepada Allah: “di dalam Dia”'
  alternative: 'Dipahami merujuk kepada tempat atau peristiwa: “di dalamnya”'
  rationale: Bentuk maskulin tunggal dan konteks pujian kepada Allah mendukung rujukan personal, tetapi kemungkinan rujukan lain tidak sepenuhnya mustahil.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. “Ia” serta “Dia” mengikuti kebiasaan kapitalisasi rujukan kepada Allah. Susunan paralel dan citra konkret ayat dipertahankan, sementara ambiguitas bentuk akhir dijelaskan dalam catatan kaki.
