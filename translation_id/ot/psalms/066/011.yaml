  text: You brought us into the net[b][a]; you laid affliction on our loins.
translation:
  language: id
  text: Engkau membawa kami ke dalam jaring[a]; Engkau meletakkan beban yang menyesakkan pada pinggang kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke dalam perangkap” atau “ke dalam benteng”; kata Ibrani מְצוּדָה dapat menunjuk pada sarana penangkapan atau tempat perlindungan/penahanan.
    reason: lexical_alternative
  - marker: b
