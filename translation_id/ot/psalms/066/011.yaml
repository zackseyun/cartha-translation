lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: Engkau membawa kami
  rationale: Bentuk Hifil dari בוא dengan akhiran orang pertama jamak menyatakan bahwa Allah menyebabkan umat masuk; ungkapan ini alami sekaligus mempertahankan tindakan langsung Allah.
- source_word: בַמְּצוּדָה
  choice: ke dalam perangkap
  rationale: מְצוּדָה dapat menunjuk pada jaring, alat penangkap, perangkap, atau kubu. Dalam konteks pengujian dan keterkungkungan, 'perangkap' menyampaikan tempat atau sarana penangkapan secara alami dalam bahasa Indonesia; alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: שַׂמְתָּ
  choice: Engkau menaruh
  rationale: שׂים berarti menaruh, menempatkan, atau meletakkan. 'Menaruh' wajar untuk sesuatu yang dibebankan pada tubuh.
- source_word: מוּעָקָה
  choice: beban yang menyesakkan
  rationale: Kata benda ini menggambarkan tekanan, kesesakan, atau beban yang menghimpit. Frasa ini mempertahankan baik gambaran beban maupun pengalaman kesesakan.
- source_word: בְמָתְנֵינוּ
  choice: pada pinggang kami
  rationale: מָתְנַיִם menunjuk pada pinggang atau bagian tubuh sekitar pinggul. 'Pinggang' merupakan padanan Indonesia yang alami, bermartabat, dan cukup dekat dengan gambaran tubuh dalam teks Ibrani.
theological_decisions:
- issue: Tindakan Allah dalam gambaran penderitaan
  choice: Mempertahankan sapaan langsung kepada Allah sebagai pihak yang membawa umat ke dalam perangkap dan menaruh beban pada mereka
  alternative: Bentuk pasif yang mengaburkan pelaku, seperti 'kami masuk ke dalam perangkap' atau 'beban menimpa kami'
  rationale: Kedua verba Ibrani berbentuk orang kedua tunggal dan secara langsung mengaitkan keadaan pengujian ini dengan tindakan Allah. Ketegangan teologis tersebut tidak dilunakkan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kapitalisasi 'Engkau' menandai sapaan kepada Allah sesuai kebiasaan penulisan religius Indonesia. Paralelisme dua klausa dan tindakan langsung Allah dipertahankan.
