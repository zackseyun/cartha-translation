  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
translation:
  language: id
  text: Sebab Engkau telah menguji kami[a], ya Allah; Engkau telah memurnikan kami seperti perak dimurnikan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menguji kami untuk membuktikan kemurnian kami”; kata Ibrani ini dapat menekankan pengujian yang menunjukkan keaslian.
    reason: lexical_alternative
  - marker: b
    text: 'Gambaran ini berasal dari pengolahan logam: pengujian oleh Allah dibandingkan dengan pemurnian perak melalui api.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pujian dalam konteks sekitarnya; “Sebab” menyampaikan fungsi penjelasannya secara alami.
- source_word: בְחַנְתָּנוּ
  choice: Engkau telah menguji kami
  rationale: Verba בחן berarti menguji atau memeriksa, sering dengan tujuan membuktikan mutu atau keaslian. “Menguji” jelas dan selaras dengan gambaran pemurnian berikutnya.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Bentuk orang kedua dan konteks menunjukkan sapaan langsung; “ya Allah” merupakan bentuk vokatif yang alami dan khidmat dalam bahasa Indonesia.
- source_word: צְרַפְתָּנוּ
  choice: Engkau telah memurnikan kami
  rationale: Verba צרף merujuk pada pemurnian logam melalui panas. “Memurnikan” mempertahankan metafora metalurgi dan wajar dalam bahasa Indonesia.
- source_word: כִּצְרָף
  choice: seperti orang memurnikan
  rationale: Prefiks כ menyatakan perbandingan, sedangkan bentuk infinitif menggambarkan proses secara umum. Rumusan aktif generik ini alami dalam bahasa Indonesia tanpa menentukan pelaku tertentu.
- source_word: כָּסֶף
  choice: perak
  rationale: Merujuk secara harfiah pada logam mulia dalam perumpamaan pemurnian.
