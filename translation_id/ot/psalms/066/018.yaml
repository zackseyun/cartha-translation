  text: אָ֭וֶן אִם רָאִ֣יתִי בְ/לִבִּ֑/י לֹ֖א יִשְׁמַ֣ע אֲדֹנָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/018.yaml
  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: id
  text: Seandainya aku menyimpan kejahatan dalam hatiku,[a] Tuhan tidak akan mendengarkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jika aku memandang kejahatan dalam hatiku, Tuhan tidak akan mendengar.”
    reason: Alternatif ini mempertahankan arti yang lebih harfiah dari רָאִיתִי (“aku melihat/memandang”) dan שׁמע (“mendengar”).
lexical_decisions:
- source_word: אָוֶן
  choice: kejahatan
  rationale: Dalam konteks moral ini, אָוֶן menunjuk pada kejahatan atau perbuatan salah, bukan sekadar kesusahan. “Kejahatan” alami dalam bahasa Indonesia dan tetap cukup luas untuk mencakup nuansa istilah Ibrani.
- source_word: אִם
  choice: seandainya
  rationale: Partikel ini membuka syarat yang dipandang berlawanan dengan kenyataan dalam konteks kesaksian pemazmur. “Seandainya” menyampaikan hubungan bersyarat itu secara wajar dalam bahasa Indonesia.
- source_word: רָאִיתִי
  choice: aku memelihara
  rationale: Arti dasarnya ialah “aku melihat”, tetapi ungkapan melihat kejahatan di dalam hati menyiratkan memberi tempat atau persetujuan batin kepadanya. “Memelihara” menyampaikan sikap batin yang terus mempertahankan kejahatan tanpa mengubahnya menjadi sekadar kesadaran akan dosa.
- source_word: בְלִבִּי
  choice: di dalam hatiku
  rationale: Terjemahan ini mempertahankan gambaran hati sebagai pusat pikiran, kehendak, dan sikap batin.
- source_word: לֹא יִשְׁמַע
  choice: tidak akan mendengarkan
  rationale: שׁמע dapat berarti “mendengar” atau “mendengarkan”. Dalam konteks doa, “mendengarkan” menyatakan penerimaan yang penuh perhatian tanpa menambahkan gagasan eksplisit bahwa Tuhan pasti “menjawab”.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: אֲדֹנָי merupakan gelar ilahi yang lazim diterjemahkan “Tuhan”; dalam pemakaian ini bentuknya tidak perlu diterjemahkan sebagai milik, “Tuhanku”.
theological_decisions:
- issue: Apakah ungkapan “melihat kejahatan di dalam hati” diterjemahkan secara harfiah atau menurut makna idiomatisnya
  choice: Menerjemahkannya sebagai memelihara kejahatan di dalam hati
  alternative: Memandang kejahatan di dalam hati
  rationale: Ayat ini membicarakan kejahatan yang diberi tempat dan persetujuan batin, bukan sekadar pengenalan atau kesadaran bahwa dosa ada. Terjemahan utama menyampaikan daya moral idiom tersebut, sedangkan catatan kaki mempertahankan bentuk yang lebih dekat dengan kata-kata Ibraninya.
- issue: Apakah שׁמע diterjemahkan “mendengar”, “mendengarkan”, atau “menjawab”
  choice: mendengarkan
  alternative: mendengar
  rationale: “Mendengarkan” sesuai dengan konteks doa dan mengisyaratkan penerimaan yang penuh perhatian, tetapi tidak melampaui teks dengan menyatakan secara langsung bahwa Tuhan “menjawab”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara gambaran “hati” dan ketegangan antara arti harfiah serta idiomatis tetap dipertahankan.
