  text: מֹ֘שֵׁ֤ל בִּ/גְבוּרָת֨/וֹ עוֹלָ֗ם עֵ֭ינָי/ו בַּ/גּוֹיִ֣ם תִּצְפֶּ֑ינָה הַ/סּוֹרְרִ֓ים אַל ירימו לָ֣/מוֹ סֶֽלָה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
translation:
  language: id
  text: 'Dengan keperkasaan-Nya Ia memerintah untuk selama-lamanya;

    mata-Nya mengawasi bangsa-bangsa.

    Janganlah orang-orang yang memberontak meninggikan diri[a].

    Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Janganlah orang-orang yang memberontak mengangkat diri sendiri” atau “Janganlah orang-orang yang memberontak bangkit.” Kata kerja Ibrani dapat berarti mengangkat, bangkit, atau meninggikan diri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁל
  choice: Ia memerintah
  rationale: Partisipel Qal ini menyatakan tindakan Allah yang terus berlangsung. Bentuk verba finit terdengar alami dalam bahasa Indonesia tanpa menghilangkan nuansa keberlangsungan.
- source_word: בִּגְבוּרָתוֹ
  choice: Dengan keperkasaan-Nya
  rationale: גְּבוּרָה berarti kekuatan atau keperkasaan; preposisi ב dipahami secara instrumental, yakni pemerintahan itu dijalankan dengan kuasa-Nya.
- source_word: עוֹלָם
  choice: untuk selama-lamanya
  rationale: Dalam posisi adverbial ini, עוֹלָם menunjukkan durasi yang tidak berakhir. Ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: עֵינָיו
  choice: mata-Nya
  rationale: Citra antropomorfis dalam bahasa Ibrani dipertahankan untuk menjaga daya puitis dan gambaran tentang pengawasan ilahi.
- source_word: בַּגּוֹיִם
  choice: bangsa-bangsa
  rationale: גּוֹיִם di sini menunjuk kepada bangsa-bangsa secara umum, bukan secara khusus kepada kelompok non-Yahudi dalam pengertian teologis yang lebih kemudian.
- source_word: תִּצְפֶּינָה
  choice: mengawasi
  rationale: Verba צפה berarti mengamati atau berjaga-jaga. 'Mengawasi' menyampaikan perhatian yang terus-menerus dan cocok dengan subjek 'mata-Nya'.
- source_word: הַסּוֹרְרִים
  choice: orang-orang yang memberontak
  rationale: Partisipel dari סרר menunjuk kepada mereka yang membangkang atau memberontak. Frasa ini jelas bagi pembaca modern dan mempertahankan sikap moral yang dimaksud.
- source_word: אַל יָרִימוּ לָמוֹ
  choice: Janganlah ... meninggikan diri
  rationale: אַל dengan bentuk imperfek menyatakan larangan. רום dalam Hifil dapat berarti mengangkat atau meninggikan, sedangkan לָמוֹ mendukung pemahaman refleksif, yaitu meninggikan diri.
- source_word: סֶלָה
  choice: Sela
  rationale: Penanda liturgis atau musikal ini ditransliterasikan karena arti tepatnya tidak pasti dan tidak seharusnya diterjemahkan secara spekulatif.
theological_decisions:
- issue: Bahasa antropomorfis tentang pengamatan Allah
  choice: mata-Nya mengawasi bangsa-bangsa
  alternative: Ia mengawasi bangsa-bangsa
  rationale: Teks Ibrani secara eksplisit menyebut 'mata-Nya'. Citra itu dipertahankan tanpa menyiratkan bahwa Allah memiliki keterbatasan makhluk.
- issue: Makna larangan terhadap orang-orang yang memberontak
  choice: Janganlah orang-orang yang memberontak meninggikan diri
  alternative: Janganlah orang-orang yang memberontak bangkit
  rationale: לָמוֹ paling wajar dipahami memberi nuansa refleksif pada tindakan mengangkat atau meninggikan. Namun, karena רום juga dapat menunjuk pada tindakan bangkit, alternatif itu dicatat dalam catatan kaki agar ambiguitas leksikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang sederhana dan bermartabat. Susunan baris mempertahankan paralelisme mazmur. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penulisan religius bahasa Indonesia; 'Sela' dipertahankan sebagai transliterasi tradisional.
