  text: For the choir director[a]. A song, a psalm. Shout joyfully to God[b], all the earth.
translation:
  language: id
  text: 'Untuk pemimpin musik.[a] Nyanyian. Mazmur.


    Bersoraklah[b] kepada Allah, hai seluruh bumi!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Untuk pemimpin biduan” atau “Untuk pemimpin paduan suara.”'
