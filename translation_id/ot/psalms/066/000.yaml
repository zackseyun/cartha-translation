    text: 'Atau: “Angkatlah sorak kepada Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini menunjuk kepada orang yang memimpin atau mengarahkan pelaksanaan musik; pilihan ini alami dalam bahasa Indonesia modern sambil mempertahankan fungsi judul mazmur.
- source_word: שִׁיר מִזְמוֹר
  choice: Sebuah nyanyian, sebuah mazmur
  rationale: Kedua sebutan dipertahankan secara terpisah karena teks Ibrani memakai dua nomina yang berkaitan, bukan satu istilah gabungan.
- source_word: הָרִיעוּ
  choice: Bersoraklah
  rationale: Kata kerja ini berarti mengangkat seruan atau sorak dengan suara nyaring. Dalam konteks pujian kepada Allah, 'bersoraklah' menyampaikan daya imperatif dan nuansa sukacita tanpa menjadi kaku.
- source_word: לֵאלֹהִים
  choice: bagi Allah
  rationale: Preposisi ל dapat menyatakan arah atau sasaran seruan. 'Bagi Allah' mempertahankan Allah sebagai penerima sorak, sementara alternatif 'kepada Allah' juga mungkin.
- source_word: כָּל־הָאָרֶץ
  choice: hai seluruh bumi
  rationale: Frasa ini dipahami sebagai sapaan kepada seluruh bumi. Partikel 'hai' membuat fungsi vokatifnya jelas dan tetap bernada puitis.
theological_decisions:
- issue: Cakupan 'seluruh bumi'
  choice: Mempertahankan sapaan universal kepada 'seluruh bumi'
  alternative: Menafsirkan frasa itu secara eksplisit sebagai semua penduduk bumi
  rationale: Teks Ibrani secara harfiah menyapa seluruh bumi; personifikasi dan keluasan puitisnya tidak dipersempit atau dijelaskan di dalam teks utama.
translation_notes:
  register: Bahasa dibuat modern, jelas, dan bermartabat. Judul dipertahankan ringkas, sedangkan seruan utama memakai bentuk puitis yang mudah dipahami. Tanda [a] dan [b] ditempatkan langsung pada unsur yang dijelaskan.
