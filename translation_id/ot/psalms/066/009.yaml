source:
  edition: WLC
  text: הַ/שָּׂ֣ם נַ֭פְשֵׁ/נוּ בַּֽ/חַיִּ֑ים וְ/לֹֽא נָתַ֖ן לַ/מּ֣וֹט רַגְלֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/009.yaml
  text: the one who keeps our soul in life and has not allowed our feet to slip[a][b][c].
translation:
  language: id
  text: Dialah yang memelihara hidup kita dan tidak membiarkan kaki kita goyah.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dialah yang menempatkan hidup kita di antara orang-orang yang hidup.”'
    reason: lexical_alternative
  - marker: b
    text: “Hidup kita” dapat juga diterjemahkan “jiwa kita”, “nyawa kita”, atau “kita”.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “tidak membiarkan kaki kita tergelincir.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: yang memelihara
  rationale: Partisipel שׂוּם secara dasar berarti 'menaruh/menempatkan', tetapi dalam gabungan נַפְשֵׁנוּ בַּחַיִּים ungkapan ini menyatakan tindakan Allah mempertahankan kehidupan. 'Yang memelihara' menyampaikan daya preservatifnya secara alami.
- source_word: נַפְשֵׁנוּ
  choice: hidup kita
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, hidup, atau diri. Dalam konteks keberadaan בַּחַיִּים, arti 'hidup kita' paling jelas dan alami tanpa memaksakan pemisahan antropologis antara jiwa dan tubuh.
- source_word: בַּחַיִּים
  choice: tetap hidup (tercakup dalam 'memelihara hidup kita')
  rationale: Secara harfiah berarti 'dalam kehidupan' atau 'di antara orang-orang hidup'. Dalam bahasa Indonesia, keseluruhan frasa paling wajar diungkapkan sebagai 'memelihara hidup kita'.
- source_word: וְלֹא נָתַן
  choice: dan tidak membiarkan
  rationale: נָתַן dengan infinitif לַמּוֹט berfungsi idiomatis dengan arti tidak mengizinkan atau membiarkan sesuatu terjadi.
- source_word: לַמּוֹט
  choice: goyah
  rationale: מוֹט menyatakan ketidakstabilan, kegoyahan, atau tergelincir. Dengan 'kaki', 'goyah' mempertahankan citra konkret serta kemungkinan makna yang lebih luas daripada sekadar terpeleset.
- source_word: רַגְלֵנוּ
  choice: kaki kita
  rationale: Terjemahan langsung ini mempertahankan gambaran konkret Ibrani tentang kestabilan dan perlindungan.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks pemeliharaan ilahi
  choice: hidup kita
  alternative: jiwa kita; nyawa kita; kita
  rationale: Konteks menekankan dipertahankannya kehidupan, bukan menetapkan doktrin tertentu tentang susunan manusia. 'Hidup kita' mempertahankan keluasan makna kontekstual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan 'Dialah yang' mempertahankan fungsi partisipel substantival yang menunjuk kepada Allah. Terjemahan utama mengutamakan kewajaran Indonesia, sementara catatan kaki menjaga bentuk harfiah dan rentang leksikal teks Ibrani.
