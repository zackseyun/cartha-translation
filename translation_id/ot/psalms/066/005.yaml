  text: לְכ֣וּ וּ֭/רְאוּ מִפְעֲל֣וֹת אֱלֹהִ֑ים נוֹרָ֥א עֲ֝לִילָ֗ה עַל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/005.yaml
  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: id
  text: Mari, lihatlah perbuatan-perbuatan Allah; Ia dahsyat dalam tindakan-Nya terhadap umat manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak manusia.”'
    reason: Menjelaskan bentuk idiom Ibrani בְּנֵי אָדָם yang dalam konteks ini berarti umat manusia.
lexical_decisions:
- source_word: לְכוּ
  choice: Mari
  rationale: Imperatif jamak dari הלך berfungsi sebagai ajakan. Dalam bahasa Indonesia, “Mari” secara alami menyampaikan undangan kolektif tanpa memaksakan arti harfiah “pergilah”.
- source_word: וּרְאוּ
  choice: lihatlah
  rationale: Imperatif jamak dari ראה mengajak para pendengar mengamati karya Allah; “lihatlah” mempertahankan bentuk seruan.
- source_word: מִפְעֲלוֹת
  choice: perbuatan-perbuatan
  rationale: Bentuk jamak ini menunjuk pada hal-hal yang Allah kerjakan. “Perbuatan-perbuatan” cukup formal dan membedakannya dari עֲלִילָה pada klausa berikut.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah Israel dan tepat diterjemahkan dengan bentuk tunggal “Allah”.
- source_word: נוֹרָא
  choice: dahsyat
  rationale: Kata ini menggambarkan sesuatu yang membangkitkan rasa gentar dan takjub. “Dahsyat” menyampaikan kedua nuansa itu secara alami dan bermartabat.
- source_word: עֲלִילָה
  choice: tindakan-Nya
  rationale: Nomina tunggal yang bersifat kolektif atau abstrak ini mengacu pada kegiatan Allah. “Tindakan-Nya” alami dalam bahasa Indonesia dan menjaga pembedaan leksikal dari מִפְעֲלוֹת.
- source_word: עַל
  choice: terhadap
  rationale: Preposisi ini menandai sasaran tindakan Allah. “Terhadap” cukup luas untuk tidak menentukan apakah tindakan itu menguntungkan atau menghukum.
- source_word: בְּנֵי אָדָם
  choice: umat manusia
  rationale: Ungkapan Ibrani harfiah “anak-anak manusia/Adam” secara konvensional merujuk pada manusia secara umum. “Umat manusia” menyampaikan rujukan kolektif tersebut dengan wajar dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Arti ungkapan generik בְּנֵי אָדָם
  choice: umat manusia
  alternative: anak-anak manusia
  rationale: Ungkapan ini secara idiomatis mencakup manusia pada umumnya. Teks utama memakai padanan Indonesia yang jelas dan inklusif, sedangkan catatan kaki mempertahankan bentuk ungkapan Ibraninya agar hubungan dengan אדם tidak hilang.
- issue: Nuansa נוֹרָא
  choice: dahsyat
  alternative: menakutkan; membangkitkan rasa gentar
  rationale: Konteks pujian mengandung kekaguman sekaligus kegentaran. “Dahsyat” mempertahankan ketegangan itu tanpa membatasi kata tersebut pada rasa takut semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. “Mari, lihatlah” mempertahankan kekuatan ajakan puitis; “dahsyat” dipakai dalam arti yang membangkitkan takjub dan gentar, bukan sebagai ungkapan santai.
