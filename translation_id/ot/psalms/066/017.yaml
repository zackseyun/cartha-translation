source:
  edition: WLC
  text: אֵלָ֥י/ו פִּֽ/י קָרָ֑אתִי וְ֝/רוֹמַ֗ם תַּ֣חַת לְשׁוֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/017.yaml
  text: I cried out to him with my mouth[a], and praise was under my tongue.
translation:
  language: id
  text: 'Kepada-Nya aku berseru dengan mulutku,

    dan pujian ada di bawah lidahku.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan Dia ditinggikan oleh lidahku.” Bentuk Ibraninya dapat dipahami sebagai nomina yang berarti “pujian/pengagungan” atau sebagai bentuk verbal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלָיו
  choice: kepada-Nya
  rationale: Bentuk ini secara harfiah berarti ‘kepada dia’; huruf kapital pada pronomina memperjelas bahwa acuannya adalah Allah dalam konteks, tanpa mengganti pronomina Ibrani dengan nama ilahi.
- source_word: פִּי
  choice: dengan mulutku
  rationale: פֶּה berarti ‘mulut’. Preposisi ‘dengan’ membuat ungkapan ini wajar dalam bahasa Indonesia sambil mempertahankan gambaran konkret bahasa Ibrani.
- source_word: קָרָאתִי
  choice: aku berseru
  rationale: Dalam konteks doa, קרא menyatakan tindakan memanggil atau berseru dengan sungguh-sungguh. ‘Berseru’ alami dan tidak berlebihan.
- source_word: וְרוֹמַם
  choice: dan pujian
  rationale: Bentuk yang jarang ini dapat dipahami sebagai nomina yang menyatakan pengagungan atau pujian. ‘Pujian’ paling alami dalam konteks ibadah, sedangkan kemungkinan pembacaan verbal dipertahankan dalam catatan kaki.
- source_word: תַּחַת
  choice: di bawah
  rationale: Terjemahan ini mempertahankan arti dasar preposisi serta gambaran puitis tentang pujian yang siap diucapkan.
- source_word: לְשׁוֹנִי
  choice: lidahku
  rationale: Terjemahan harfiah ini mempertahankan citraan tubuh dalam puisi Ibrani dan menghindari pengabstrakan menjadi ‘ucapanku’.
theological_decisions:
- issue: Apakah וְרוֹמַם merupakan nomina ‘pujian/pengagungan’ atau bentuk verbal yang berarti ‘Dia ditinggikan’
  choice: 'Teks utama memakai pembacaan nominal: ‘dan pujian ada di bawah lidahku’.'
  alternative: ‘dan Dia ditinggikan oleh lidahku’.
  rationale: Bentuk Ibraninya langka dan memungkinkan lebih dari satu analisis. Pembacaan nominal mempertahankan paralelisme dan citraan ‘di bawah lidah’, sedangkan pembacaan verbal yang terdapat dalam tradisi penerjemahan tetap dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan dua baris mempertahankan paralelisme puisi. Ungkapan ‘di bawah lidahku’ sengaja dipertahankan sebagai citraan Ibrani, meskipun tidak lazim dalam prosa Indonesia.
