  text: Aku akan masuk ke rumah-Mu dengan kurban bakaran; aku akan menunaikan nazar-nazarku kepada-Mu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבוֹא
  choice: Aku akan datang
  rationale: Bentuk Qal imperfek orang pertama tunggal dari בוא menyatakan tindakan yang diniatkan atau akan dilakukan. 'Datang' mempertahankan arti dasarnya dan alami dengan frasa tujuan berikutnya.
- source_word: בֵיתְךָ
  choice: ke rumah-Mu
  rationale: Secara harfiah berarti 'rumah-Mu'. Dalam konteks mazmur, ungkapan ini menunjuk kepada tempat kudus Allah, tetapi kata konkret 'rumah' dipertahankan agar tafsir tidak dipersempit menjadi 'Bait Allah' dalam teks utama.
- source_word: בְעוֹלוֹת
  choice: dengan kurban-kurban bakaran
  rationale: עוֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya. Prefiks בְ menyatakan penyertaan, sehingga wajar diterjemahkan 'dengan'. Bentuk jamaknya dipertahankan.
- source_word: אֲשַׁלֵּם
  choice: aku akan memenuhi
  rationale: Bentuk Piel imperfek orang pertama tunggal dari שלם, dalam konstruksi dengan nazar, berarti menunaikan atau memenuhi kewajiban nazar. 'Memenuhi' jelas dan alami dalam bahasa Indonesia modern.
- source_word: לְךָ
  choice: kepada-Mu
  rationale: Preposisi לְ menandai pihak yang menjadi tujuan penunaian nazar; 'kepada-Mu' merupakan padanan alami.
- source_word: נְדָרָי
  choice: nazarku
  rationale: Nomina jamak dengan sufiks orang pertama tunggal berarti 'nazar-nazarku'. Dalam bahasa Indonesia, bentuk kolektif tunggal 'nazarku' lebih alami dan tidak menghilangkan kemungkinan bahwa yang dimaksud lebih dari satu nazar.
theological_decisions:
- issue: Apakah 'rumah-Mu' harus ditafsirkan secara eksplisit sebagai Bait Allah atau tempat kudus dalam teks utama
  choice: Mempertahankan 'rumah-Mu' dalam teks utama
  alternative: Bait-Mu; tempat kudus-Mu
  rationale: Teks Ibrani memakai kata 'rumah'. Konteks kurban bakaran memang menunjukkan tempat ibadah Allah, tetapi mempertahankan ungkapan sumber menjaga citra puitis dan menghindari penyempitan interpretatif yang tidak diwajibkan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. 'Kurban' dipilih sesuai ejaan baku modern; 'nazar' mempertahankan istilah religius yang umum dipahami.
