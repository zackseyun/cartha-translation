  text: which my lips uttered and my mouth spoke when I was in distress[a].
translation:
  language: id
  text: yang diucapkan oleh bibirku dan yang dikatakan oleh mulutku ketika aku dalam kesesakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang dibuka oleh bibirku.” Ungkapan Ibrani ini berarti berbicara atau mengucapkan kata-kata.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Memperkenalkan klausa relatif yang mengacu kepada nazar-nazar pada ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan kaitannya.
- source_word: פָּצוּ
  choice: diucapkan
  rationale: Secara harfiah berarti ‘dibuka’ dengan bibir sebagai subjek, tetapi merupakan ungkapan untuk mengucapkan kata-kata. Bentuk ini menyampaikan makna idiomatis tanpa menghilangkan citra bibir.
- source_word: שְׂפָתַי
  choice: bibirku
  rationale: Dipertahankan secara harfiah karena alami dalam puisi Indonesia dan menjaga kesejajaran dengan ‘mulutku’.
- source_word: וְדִבֶּר
  choice: dan dikatakan
  rationale: Menyatakan tindakan berbicara dan, bersama bentuk pasif pada larik pertama, mempertahankan susunan puitis dengan ‘bibirku’ dan ‘mulutku’ sebagai pelaku gramatikal.
- source_word: פִּי
  choice: mulutku
  rationale: Terjemahan harfiah yang mempertahankan paralelisme sinonim ‘bibirku / mulutku’.
- source_word: בַּצַּר לִי
  choice: ketika aku dalam kesesakan
  rationale: Mengungkapkan keadaan dan waktu kesulitan yang dialami pemazmur dengan bahasa Indonesia yang wajar dan bernuansa puitis.
