id: PSA.66.20
reference: Psalms 66:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: id
  text: Terpujilah Allah, yang tidak menolak doaku dan tidak menjauhkan kasih setia-Nya[a] dariku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belas kasih-Nya”, “kesetiaan perjanjian-Nya”, atau “kasih-Nya yang teguh”. Kata Ibrani חֶסֶד mencakup kasih yang setia dan teguh.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “yang tidak menyingkirkan doaku dan kasih setia-Nya dariku.” Bahasa Ibrani memakai satu kata kerja untuk kedua objek tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Bentuk partisip pasif ini berfungsi sebagai seruan pujian. “Terpujilah” merupakan ungkapan doksologis yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini kata tersebut menunjuk kepada Allah Israel sebagai sasaran pujian; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata ini paling wajar dipahami sebagai pengantar klausa relatif yang menerangkan Allah.
- source_word: לֹא הֵסִיר
  choice: tidak menolak … dan tidak menjauhkan
  rationale: 'Hifil dari סור berarti menyingkirkan atau menjauhkan. Karena dua objeknya menuntut kolokasi berbeda dalam bahasa Indonesia, ungkapan itu diterjemahkan secara distributif agar alami: doa “ditolak”, sedangkan kasih setia “dijauhkan” dari pemazmur.'
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: Padanan langsung dan alami bagi doa atau permohonan yang ditujukan kepada Allah.
- source_word: וְחַסְדּוֹ
  choice: dan … kasih setia-Nya
  rationale: Konjungsi וְ dipertahankan sebagai “dan”, sedangkan חֶסֶד diterjemahkan “kasih setia” untuk mencakup kasih, loyalitas, dan keteguhan relasionalnya.
- source_word: מֵאִתִּי
  choice: dariku
  rationale: Frasa preposisional ini menyatakan pemisahan dari penutur; “dariku” ringkas dan alami.
theological_decisions:
- issue: Makna חֶסֶד
  choice: kasih setia-Nya
  alternative: belas kasih-Nya; kesetiaan perjanjian-Nya; kasih-Nya yang teguh
  rationale: “Kasih setia” mempertahankan cakupan kasih yang disertai loyalitas dan keteguhan tanpa membatasi kata itu hanya pada perasaan ataupun menjadikan unsur perjanjian lebih eksplisit daripada teks.
- issue: Hubungan penolakan doa dan kasih setia Allah
  choice: Satu verba Ibrani diungkapkan secara distributif dengan dua verba Indonesia
  alternative: “yang tidak menyingkirkan doaku dan kasih setia-Nya dariku”
  rationale: Teks memuji Allah karena Ia tidak menyingkirkan doa pemazmur maupun kasih setia-Nya. Pemakaian “menolak” untuk doa dan “menjauhkan” untuk kasih setia memperjelas relasi kedua objek tanpa mengubah pernyataan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada pujian. Bentuk “Terpujilah” mempertahankan gaya doksologis mazmur, sedangkan struktur klausa dibuat alami bagi pembaca umum.
