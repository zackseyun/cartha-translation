source:
  edition: WLC
  text: וַ/יַּ֣ךְ גַּ֭פְנָ/ם וּ/תְאֵנָתָ֑/ם וַ֝/יְשַׁבֵּ֗ר עֵ֣ץ גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/033.yaml
  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: id
  text: Ia menghantam tanaman anggur dan pohon ara mereka, serta mematahkan pepohonan di wilayah mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: Ia menghantam
  rationale: Bentuk dari נכה menyatakan tindakan memukul atau menghantam. “Menghantam” mempertahankan daya tindakan yang keras dalam bahasa Indonesia modern.
- source_word: גַּפְנָם
  choice: tanaman anggur mereka
  rationale: גֶּפֶן berarti tanaman anggur. Bentuk tunggal Ibrani dapat dipahami secara kolektif; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: וּתְאֵנָתָם
  choice: dan pohon ara mereka
  rationale: תְּאֵנָה berarti pohon ara. Bentuk tunggal dengan sufiks berfungsi secara kolektif dalam konteks hasil pertanian mereka.
- source_word: וַיְשַׁבֵּר
  choice: serta mematahkan
  rationale: Bentuk Piel dari שׁבר menunjukkan tindakan merusak dengan mematahkan. “Mematahkan” tepat untuk pepohonan dan tetap kuat tanpa terdengar berlebihan.
- source_word: עֵץ
  choice: pepohonan
  rationale: עֵץ dapat berarti pohon atau kayu; konteks ini menunjuk pada pohon-pohon yang tumbuh, dan bentuk kolektif “pepohonan” mencerminkan pemakaiannya.
- source_word: גְּבוּלָם
  choice: di wilayah mereka
  rationale: גְּבוּל dapat berarti batas atau wilayah. Dengan pepohonan, “di wilayah mereka” menyampaikan lokasi secara alami tanpa membatasi makna hanya pada garis perbatasan.
theological_decisions:
- issue: Subjek tersirat pada kedua verba
  choice: Ia, yakni Allah menurut konteks mazmur
  alternative: Mengulang nama TUHAN atau menyebut Allah secara eksplisit
  rationale: Bahasa Ibrani memakai verba orang ketiga maskulin tunggal dengan subjek yang dipahami dari konteks. “Ia” mempertahankan kesinambungan narasi tanpa menambahkan nama ilahi yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme dua tindakan dipertahankan; bentuk kolektif Ibrani diterjemahkan secara alami sebagai tanaman dan pepohonan.
