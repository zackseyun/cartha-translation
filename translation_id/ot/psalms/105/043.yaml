  text: וַ/יּוֹצִ֣א עַמּ֣/וֹ בְ/שָׂשׂ֑וֹן בְּ֝/רִנָּ֗ה אֶת בְּחִירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/043.yaml
  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: id
  text: 'Maka Ia membawa umat-Nya keluar dengan sukacita,

    orang-orang yang dipilih-Nya[b] dengan sorak-sorai.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan nyanyian sukacita.” Istilah Ibrani ini dapat menunjuk kepada seruan gembira yang nyaring maupun nyanyian.
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang-orang terpilih-Nya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: Ia membawa ... keluar
  rationale: Bentuk Hifil dari יצא bersifat kausatif, yaitu ‘menyebabkan keluar’. Ungkapan ‘membawa ... keluar’ alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan peristiwa keluaran.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עַם menunjuk kepada suatu kelompok bangsa atau umat, dan dalam konteks ini kepada umat milik Allah. ‘Umat-Nya’ paling sesuai dengan konteks perjanjian dan gaya mazmur.
- source_word: בְשָׂשׂוֹן
  choice: dengan sukacita
  rationale: Nomina ini menyatakan kegembiraan atau sukacita. ‘Dengan sukacita’ ringkas, alami, dan mempertahankan fungsi adverbial frasa Ibrani.
- source_word: בְּרִנָּה
  choice: dengan sorak-sorai
  rationale: רִנָּה dapat menunjuk kepada seruan nyaring penuh kegembiraan maupun nyanyian sukacita. ‘Sorak-sorai’ mempertahankan unsur bunyi dan suasana perayaan tanpa membatasi maknanya hanya pada nyanyian.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai objek langsung dan tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tampak melalui susunan kalimat.
- source_word: בְּחִירָיו
  choice: orang-orang yang dipilih-Nya
  rationale: Bentuk ini berasal dari בחר, ‘memilih’, dan menunjuk kepada mereka yang dipilih Allah. Terjemahan ini transparan serta tidak memasukkan muatan doktrinal yang melampaui konteks keluaran.
theological_decisions:
- issue: Penerjemahan בְּחִירָיו
  choice: orang-orang yang dipilih-Nya
  alternative: orang-orang terpilih-Nya
  rationale: Teks Ibrani menyebut mereka yang dipilih Allah dan menyejajarkan mereka dengan ‘umat-Nya’. Rumusan verbal ini mempertahankan tindakan Allah sebagai pihak yang memilih tanpa menonjolkan perdebatan teologis yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang sederhana dan bermartabat. Paralelisme kedua baris dipertahankan, sementara ‘Maka’ menyampaikan kesinambungan naratif וַ secara alami.
