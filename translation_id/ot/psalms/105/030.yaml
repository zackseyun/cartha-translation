  text: Their land swarmed with frogs[a], even in the chambers of their kings.
translation:
  language: id
  text: Negeri mereka dipenuhi katak, bahkan di kamar-kamar raja-raja mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk jamak, “raja-raja mereka”; dalam kisah tulah di Keluaran digunakan bentuk tunggal, “rajanya.” Bentuk jamak di sini mungkin merupakan ungkapan puitis atau kolektif.
    reason: Menjelaskan bentuk jamak yang tidak biasa dan mencegah pembaca menganggapnya sebagai kesalahan atau harmonisasi dengan kisah Keluaran.
lexical_decisions:
- source_word: שָׁרַץ
  choice: berkerumun
  rationale: Kata kerja ini menggambarkan makhluk yang muncul atau bergerak dalam jumlah sangat banyak. Susunan “katak berkerumun” alami dalam bahasa Indonesia dan mempertahankan gambaran serbuan yang hidup.
- source_word: אַרְצָם
  choice: negeri mereka
  rationale: Bentuk ini secara langsung berarti “negeri/tanah mereka” dan dalam konteks menunjuk kepada Mesir. “Negeri” lebih alami untuk wilayah suatu bangsa.
- source_word: צְפַרְדְּעִים
  choice: katak
  rationale: Padanan baku dan langsung bagi nama hewan tersebut.
- source_word: בְּחַדְרֵי
  choice: sampai ke kamar-kamar
  rationale: Preposisi Ibrani pada dasarnya menyatakan tempat, “di kamar-kamar.” Penambahan “sampai ke” secara wajar menyampaikan perluasan serbuan itu hingga ruang-ruang dalam istana, sejalan dengan fungsi puitis frasa tersebut.
- source_word: מַלְכֵיהֶם
  choice: raja-raja mereka
  rationale: Bentuk Ibraninya jelas jamak dengan akhiran orang ketiga jamak. Bentuk jamak dipertahankan dan tidak diselaraskan dengan bentuk tunggal dalam kisah tulah di Keluaran.
theological_decisions:
- issue: Bentuk jamak “raja-raja mereka” dalam mazmur dibandingkan bentuk tunggal dalam kisah tulah Keluaran
  choice: Mempertahankan bentuk jamak “raja-raja mereka”
  alternative: Mengubahnya menjadi “raja mereka” agar selaras dengan kisah Keluaran
  rationale: Terjemahan mengikuti bentuk teks Ibrani mazmur dan membiarkan kemungkinan ungkapan puitis atau kolektif tetap terbuka tanpa memaksakan penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Berkerumun” mempertahankan daya gambar kata kerja Ibrani, sedangkan “kamar-kamar” mudah dipahami tanpa kehilangan nuansa ruang dalam kediaman kerajaan.
