  variant: modern standard Indonesian
source:
  edition: WLC
  text: זָכַ֣ר לְ/עוֹלָ֣ם בְּרִית֑/וֹ דָּבָ֥ר צִ֝וָּ֗ה לְ/אֶ֣לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/008.yaml
  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: id
  text: 'Ia mengingat perjanjian-Nya untuk selama-lamanya,

    firman yang diperintahkan-Nya bagi seribu generasi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “janji yang diperintahkan-Nya bagi seribu generasi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: Ia mengingat
  rationale: Bentuk perfektif dapat menunjuk tindakan lampau, tetapi dalam konteks pujian tentang kesetiaan Allah yang terus berlaku, bentuk kini bahasa Indonesia menyampaikan daya gnomic dan berkelanjutan dengan wajar.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Mengungkapkan durasi yang tidak berakhir dan sesuai dengan ragam bahasa Indonesia yang khidmat serta lazim dalam konteks perjanjian.
- source_word: בְּרִיתוֹ
  choice: perjanjian-Nya
  rationale: Perjanjian adalah padanan baku dan tepat untuk relasi perjanjian ilahi dalam konteks sejarah keselamatan.
- source_word: דָּבָר
  choice: firman
  rationale: Kata Ibrani ini luas maknanya, tetapi di sini menunjuk pada ucapan perjanjian Allah. 'Firman' mempertahankan kesejajaran puitis dan keterbukaan leksikal; 'janji' dicatat sebagai alternatif.
- source_word: צִוָּה
  choice: diperintahkan-Nya
  rationale: Mempertahankan arti langsung bentuk Piel dari צוה, sambil membiarkan nuansa penetapan ilahi tetap tersirat oleh konteks.
- source_word: לְאֶלֶף
  choice: bagi seribu
  rationale: Preposisi ל menandai jangkauan firman itu sampai kepada seribu generasi; 'bagi' terdengar alami tanpa mempersempitnya hanya menjadi durasi.
- source_word: דּוֹר
  choice: generasi
  rationale: Walaupun bentuk Ibraninya tunggal, sesudah bilangan kata ini berfungsi kolektif; bahasa Indonesia secara alami memakai bentuk yang sama tanpa penanda jamak.
theological_decisions:
- issue: Aspek tindakan Allah mengingat
  choice: Bentuk kini yang menyatakan kesetiaan perjanjian yang terus berlangsung
  alternative: Ia telah mengingat; Ia mengingat pada masa lampau
  rationale: Konteks mazmur memuji kesetiaan Allah yang tetap berlaku, bukan sekadar tindakan mengingat pada satu saat di masa lampau.
- issue: Makna דָּבָר dalam kesejajaran dengan perjanjian
  choice: Mempertahankan 'firman' dalam teks utama
  alternative: '''janji'''
  rationale: Istilah Ibrani bersifat luas dan menunjuk pada ucapan perjanjian Allah. 'Firman' menjaga transparansi leksikal dan ketegangan puitis, sedangkan penafsiran yang lebih khusus, 'janji', disediakan dalam catatan kaki.
- issue: Nuansa צִוָּה dalam konteks perjanjian
  choice: '''diperintahkan-Nya'''
  alternative: '''ditetapkan-Nya'''
  rationale: Terjemahan utama mempertahankan daya leksikal 'memerintahkan'; kemungkinan nuansa menetapkan atau mendekretkan tidak dijadikan eksplisit agar teks tidak ditafsirkan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dua baris mempertahankan kesejajaran puisi Ibrani. Pronomina ilahi ditulis dengan bentuk hormat yang lazim dalam penerbitan Alkitab bahasa Indonesia.
