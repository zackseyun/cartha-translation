  text: כִּֽי זָ֭כַר אֶת דְּבַ֣ר קָדְשׁ֑/וֹ אֶֽת אַבְרָהָ֥ם עַבְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/042.yaml
  text: For he remembered his holy word to Abraham his servant[a][b].
translation:
  language: id
  text: Sebab Ia mengingat firman-Nya yang kudus kepada Abraham, hamba-Nya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “Karena Ia mengingat firman-Nya yang kudus.”'
    reason: lexical_alternative
  - marker: b
    text: “Firman” di sini mengandung arti janji yang diucapkan Allah kepada Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi tindakan yang disebutkan sebelumnya. “Sebab” mempertahankan alur penjelasan mazmur dengan wajar dalam bahasa Indonesia.
- source_word: זָכַר
  choice: mengingat
  rationale: Kata kerja ini mempertahankan ungkapan Alkitab tentang Allah yang mengingat dan kemudian bertindak sesuai dengan perkataan-Nya, tanpa mempersempit maknanya menjadi ingatan mental semata atau langsung memparafrasakannya sebagai penggenapan.
- source_word: דְּבַר
  choice: firman
  rationale: Secara harfiah berarti “perkataan/firman”; dalam konteks ini firman tersebut merupakan janji Allah. “Firman” mempertahankan bentuk sumber sekaligus register yang sesuai ketika perkataan Allah dimaksudkan.
- source_word: קָדְשׁוֹ
  choice: -Nya yang kudus
  rationale: Ungkapan ini secara alami menerangkan firman sebagai milik Allah dan kudus. Bentuk “firman-Nya yang kudus” jelas dan wajar dalam bahasa Indonesia.
- source_word: אֶת אַבְרָהָם
  choice: kepada Abraham
  rationale: Bahasa Ibrani tidak memakai preposisi eksplisit di sini, tetapi konteks menghubungkan firman itu dengan Abraham sebagai penerimanya. “Kepada Abraham” menyatakan hubungan tersirat tersebut secara alami tanpa mengubah firman menjadi “janji” dalam teks utama.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam penyebutan Abraham sebagai orang yang mengabdi kepada Allah, “hamba” merupakan padanan yang wajar dan kontekstual; nuansa status budak tidak menjadi pokok ayat ini.
theological_decisions:
- issue: Daya perjanjian dalam tindakan Allah “mengingat”
  choice: Mempertahankan “mengingat” dalam teks utama.
  alternative: “menggenapi janji-Nya” atau “mengingat janji perjanjian-Nya”
  rationale: Kata זכר dapat menyiratkan tindakan setia berdasarkan janji atau perjanjian, tetapi teks secara langsung mengatakan bahwa Allah “mengingat”. Terjemahan tidak mengganti ungkapan itu dengan tafsiran tentang penggenapannya.
- issue: Hubungan antara “firman-Nya yang kudus” dan Abraham
  choice: “firman-Nya yang kudus kepada Abraham, hamba-Nya”
  alternative: “janji-Nya yang kudus kepada Abraham” atau konstruksi yang menjadikan Abraham objek kedua dari “mengingat”
  rationale: Penanda objek Ibrani sebelum Abraham memungkinkan struktur yang rapat dan tidak menyatakan preposisi secara eksplisit. Dalam konteks janji kepada leluhur, “kepada Abraham” paling alami dalam bahasa Indonesia, sementara catatan kaki menjelaskan daya makna “firman” sebagai janji.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Kalimat tetap dekat dengan struktur dan kosakata Ibrani, dengan penyesuaian relasi “kepada Abraham” agar terbaca alami.
