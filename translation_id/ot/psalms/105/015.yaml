  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַֽל תִּגְּע֥וּ בִ/מְשִׁיחָ֑/י וְ֝/לִ/נְבִיאַ/י אַל תָּרֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/015.yaml
  text: Do not touch my anointed ones[a], and do my prophets no harm.
translation:
  language: id
  text: “Jangan sentuh orang-orang yang Kuurapi[a], dan jangan berbuat jahat terhadap nabi-nabi-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang Kuurapi.” Kata Ibrani yang dipakai berkerabat dengan kata “Mesias”, tetapi di sini bentuknya jamak dan menunjuk kepada orang-orang yang dikhususkan oleh Allah, bukan secara khusus kepada Mesias yang tunggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: sentuh
  rationale: Kata נגע pada dasarnya berarti ‘menyentuh’ dan dalam larangan ini juga menyiratkan tindakan menyerang atau mencelakakan. ‘Sentuh’ mempertahankan ungkapan sumber tanpa membatasinya pada kekerasan fisik.
- source_word: בִמְשִׁיחָי
  choice: orang-orang yang Kuurapi
  rationale: 'Bentuk ini jamak dengan akhiran orang pertama tunggal: ‘orang-orang yang Kuurapi’. Ungkapan ini alami dalam bahasa Indonesia dan tidak mengesankan bahwa yang dimaksud ialah Mesias tunggal.'
- source_word: לִנְבִיאַי
  choice: nabi-nabi-Ku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal secara langsung berarti ‘nabi-nabi-Ku’.
- source_word: תָּרֵעוּ
  choice: berbuat jahat terhadap
  rationale: Dalam bentuk Hifil, רעע menyatakan berbuat jahat atau mendatangkan celaka. ‘Berbuat jahat terhadap’ mempertahankan nuansa moral dan kemungkinan tindakan yang merugikan.
- source_word: אַל
  choice: jangan
  rationale: אַל dengan bentuk verba tak sempurna menyatakan larangan; ‘jangan’ merupakan padanan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Pemaknaan מְשִׁיחַ dalam konteks jamak yang tidak secara khusus mesianik
  choice: orang-orang yang Kuurapi
  alternative: orang-orang yang diurapi-Ku; para mesias-Ku
  rationale: Bentuk Ibrani ini jamak dan menunjuk kepada orang-orang yang dikhususkan oleh Allah dalam konteks sejarah mazmur, bukan secara khusus kepada Mesias yang tunggal. Terjemahan ini mempertahankan makna pengurapan tanpa memasukkan kekhususan kristologis yang tidak dinyatakan oleh bentuk tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Kapitalisasi pada pronomina yang merujuk kepada Allah mengikuti kebiasaan baku penerbitan Alkitab Indonesia. Paralelisme kedua larangan dipertahankan.
