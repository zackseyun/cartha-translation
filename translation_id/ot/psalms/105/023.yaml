  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: id
  text: Kemudian Israel datang ke Mesir, dan Yakub tinggal sebagai orang asing[a] di negeri Ham.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetap sebagai pendatang”; kata Ibraninya menekankan bahwa ia tinggal di sana sebagai orang yang bukan penduduk asli.
    reason: lexical_alternative
  - marker: b
    text: “Negeri Ham” adalah sebutan puitis untuk Mesir.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian ... datang
  rationale: Bentuk wayyiqtol dari בוא melanjutkan urutan kisah. “Kemudian” menghasilkan alur naratif yang alami dalam bahasa Indonesia sambil mempertahankan makna berurutan.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan. Dalam paralelisme dengan “Yakub”, nama ini menunjuk kepada sang leluhur sekaligus memiliki nuansa representatif terhadap umatnya.
- source_word: מִצְרָיִם
  choice: Mesir
  rationale: Padanan baku bahasa Indonesia untuk nama tempat tersebut.
- source_word: וְיַעֲקֹב
  choice: dan Yakub
  rationale: Nama diri dipertahankan agar paralelisme puitis Israel–Yakub tidak diratakan menjadi satu nama atau kata ganti.
- source_word: גָּר
  choice: tinggal sebagai pendatang
  rationale: Kata גור menyatakan tinggal di suatu tempat sebagai orang yang bukan penduduk asli, sering kali dengan nuansa menetap sementara. Ungkapan ini alami dan jelas bagi pembaca Indonesia modern.
- source_word: בְּאֶרֶץ
  choice: di negeri
  rationale: אֶרֶץ di sini berarti negeri atau wilayah. “Di negeri Ham” merupakan susunan yang alami dalam bahasa Indonesia.
- source_word: חָם
  choice: Ham
  rationale: Nama diri ditransliterasikan dan ungkapan puitis “negeri Ham” dipertahankan, bukan diganti dengan “Mesir” dalam teks utama.
theological_decisions:
- issue: Apakah paralel puitis “Israel // Yakub” harus diratakan menjadi satu sebutan
  choice: Mempertahankan kedua nama dalam teks utama
  alternative: Menggunakan hanya “Yakub” atau hanya “Israel” pada kedua klausa
  rationale: Teks Ibrani sengaja memakai kedua nama dalam paralelisme. Mempertahankannya menjaga bentuk puitis dan kemungkinan nuansa representatif sang leluhur terhadap bangsa itu tanpa menambahkan klaim teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pendatang” dipilih karena mudah dipahami serta menyampaikan status bukan penduduk asli tanpa memakai istilah yang terlalu kuno. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
