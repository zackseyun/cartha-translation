translation:
  language: id
  text: Raja mengutus, lalu melepaskannya; penguasa bangsa-bangsa membebaskannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַח
  choice: mengutus orang
  rationale: Kata kerja Ibrani berarti ‘mengutus’ tetapi tidak menyebutkan apa atau siapa yang diutus. Bahasa Indonesia memerlukan pelengkap agar ungkapannya alami; ‘orang’ dipakai secara umum tanpa menentukan identitas utusan.
- source_word: מֶלֶךְ
  choice: Raja
  rationale: Walaupun tanpa kata sandang dalam puisi Ibrani, konteksnya menunjuk kepada raja Mesir yang membebaskan Yusuf; bentuk ini alami dan definit dalam konteks bahasa Indonesia.
- source_word: וַיַּתִּירֵהוּ
  choice: melepaskannya
  rationale: Kata ini menyatakan tindakan melepaskan atau membebaskan seseorang dari ikatan atau tahanan. ‘Melepaskannya’ mempertahankan citra dasar dan sesuai dengan konteks penjara.
- source_word: מֹשֵׁל עַמִּים
  choice: penguasa bangsa-bangsa
  rationale: מֹשֵׁל adalah bentuk partisipial yang berfungsi sebagai gelar, sedangkan עַמִּים berbentuk jamak. ‘Penguasa bangsa-bangsa’ mempertahankan kesejajaran puitis dengan ‘Raja’ dan makna kolektif jamaknya.
- source_word: וַיְפַתְּחֵהוּ
  choice: membebaskannya
  rationale: Secara dasar פתח berarti ‘membuka’, tetapi dengan objek manusia dalam konteks tahanan ungkapan ini menyatakan pembukaan belenggu atau penjara sehingga orang itu bebas. ‘Membebaskannya’ menyampaikan maksud idiom tersebut secara wajar.
