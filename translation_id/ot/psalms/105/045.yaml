  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: id
  text: supaya mereka memelihara ketetapan-Nya dan menaati hukum-hukum-Nya. Pujilah Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yah adalah bentuk singkat nama ilahi. Ungkapan Ibrani ini juga dikenal sebagai “Haleluya”, yang berarti “Pujilah Yah!”
    reason: Menjelaskan nama ilahi singkat dan padanan transliterasi yang lazim.
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksud secara alami dalam bahasa Indonesia.
- source_word: יִשְׁמְרוּ חֻקָּיו
  choice: mereka memelihara segala ketetapan-Nya
  rationale: Kata מ־ר (שמר) menyatakan tindakan menjaga dan memegang dengan setia, sedangkan חֻקִּים menunjuk pada ketetapan yang ditetapkan. Kata 'segala' menyampaikan bentuk jamak tanpa pengulangan yang kaku.
- source_word: וְתוֹרֹתָיו יִנְצֹרוּ
  choice: dan menaati hukum-hukum-Nya
  rationale: תּוֹרֹת dalam bentuk jamak dapat berarti hukum atau pengajaran. Dalam konteks perjanjian ini, 'hukum-hukum' wajar dan tepat; 'menaati' menyampaikan tindakan menjaga dengan saksama yang terkandung dalam נצר sekaligus mempertahankan variasi paralel.
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Menerjemahkan bentuk imperatif הַלְלוּ secara langsung dan mempertahankan יָהּ sebagai bentuk singkat nama ilahi, bukan menyamakannya tanpa penjelasan dengan bentuk lengkap YHWH.
theological_decisions:
- issue: Penerjemahan nama ilahi singkat יָהּ dalam seruan penutup
  choice: Pujilah Yah!
  alternative: Pujilah TUHAN!; Haleluya!
  rationale: Teks Ibrani memakai יָהּ, bentuk singkat nama ilahi. 'Pujilah Yah!' mempertahankan bentuk tersebut dan membuat unsur perintahnya tetap jelas; catatan kaki menjelaskan bentuk yang lebih dikenal pembaca.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan paralel Ibrani dipertahankan dengan dua verba berbeda, 'memelihara' dan 'menaati', tanpa membuat ungkapan terasa kaku.
