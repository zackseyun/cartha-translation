  yaml_path: translation/ot/psalms/105/007.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: id
  text: Dialah Yahweh, Allah kita[a]; keputusan-keputusan-Nya berlaku di seluruh bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; juga ditransliterasikan “Yehuwa” dan secara tradisional diganti dengan gelar “TUHAN”.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “ketetapan-ketetapan-Nya”, “penghakiman-Nya”, atau “keadilan-Nya”. Kata Ibrani מִשְׁפָּטָיו dapat menunjuk keputusan hukum, ketetapan, tindakan penghakiman, atau keadilan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri ini memberi penekanan. “Dialah” menyampaikan tekanan tersebut secara alami dalam bahasa Indonesia sekaligus melengkapi kopula yang tersirat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama diri dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk dengan akhiran orang pertama jamak berarti “Allah kita”; susunan ini alami dan khidmat dalam bahasa Indonesia.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh bumi
  rationale: Ungkapan ini bersifat lokatif dan, dalam cakupan mazmur ini, lebih tepat menunjuk seluruh bumi daripada suatu negeri tertentu.
- source_word: מִשְׁפָּטָיו
  choice: keputusan-keputusan-Nya
  rationale: Kata מִשְׁפָּטָיו dapat menunjuk keputusan hukum, ketetapan, tindakan penghakiman, atau keadilan-Nya. “Keputusan-keputusan-Nya” mempertahankan nuansa yudisial tanpa membatasinya pada peraturan tertulis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi YHWH. Bentuk “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehuwa” mencerminkan pelafalan tradisional alternatif.
- issue: Cakupan מִשְׁפָּטָיו
  choice: keputusan-keputusan-Nya
  alternative: ketetapan-ketetapan-Nya, penghakiman-Nya, atau keadilan-Nya
  rationale: Istilah Ibrani memiliki rentang makna yudisial yang luas. Pilihan utama tidak menyelesaikan secara berlebihan apakah yang dimaksud adalah keputusan, ketetapan, tindakan penghakiman, atau pelaksanaan keadilan.
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan khidmat. “Dialah” mempertahankan penekanan Ibrani; “berlaku di seluruh bumi” lebih alami daripada terjemahan statis “ada di seluruh bumi” serta tetap memungkinkan keputusan ilahi dipahami sebagai ketetapan yang berotoritas dan aktif.
