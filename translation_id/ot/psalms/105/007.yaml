  source_fidelity: Teks Indonesia menyampaikan penegasan הוּא melalui “Dialah,” mempertahankan nama ilahi יְהוָה sebagai “Yahweh,” dan menerjemahkan אֱלֹהֵינוּ dengan tepat sebagai “Allah kita.” “Keputusan-keputusan-Nya berlaku di seluruh bumi” secara wajar mengungkapkan מִשְׁפָּטָיו בְּכָל־הָאָרֶץ. Kata “berlaku” sedikit idiomatis-interpretatif dibanding konstruksi nominal Ibrani, tetapi tetap berada dalam rentang makna yang sah bagi keputusan atau ketetapan yudisial ilahi yang berjangkauan universal.
