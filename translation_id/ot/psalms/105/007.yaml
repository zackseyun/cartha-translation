  terminology: “Yahweh” konsisten dengan keputusan penerjemahan yang diberikan dan tidak menggantikannya dengan gelar. “Allah kita” merupakan padanan yang lazim dan tepat. Catatan b secara memadai menjaga keluasan semantis מִשְׁפָּטָיו, termasuk keputusan hukum, ketetapan, penghakiman, dan keadilan. Penanda catatan a dan b ditempatkan dengan jelas dan sesuai dengan materi yang dijelaskan.
