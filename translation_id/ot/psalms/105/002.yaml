  yaml_path: translation/ot/psalms/105/002.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous works.
translation:
  language: id
  text: Bernyanyilah bagi-Nya; nyanyikanlah puji-pujian bagi-Nya; ceritakanlah[a] segala perbuatan-Nya yang ajaib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “renungkanlah.” Kata Ibrani yang dipakai dapat berarti merenungkan ataupun membicarakan dan menceritakan. Dalam konteks pujian bersama ini, makna “ceritakanlah” lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Bernyanyilah
  rationale: Bentuk perintah jamak dari שׁיר secara langsung berarti menyanyi; bentuk ini alami dan mempertahankan seruan kepada seluruh umat.
- source_word: ל֭וֹ
  choice: bagi-Nya
  rationale: Preposisi ל dengan akhiran pronominal menunjukkan arah atau penerima nyanyian dan pujian; “bagi-Nya” merupakan ungkapan Indonesia yang alami.
- source_word: זַמְּרוּ
  choice: nyanyikanlah puji-pujian
  rationale: Dalam konteks ibadah, זמר menunjuk pada bermusik atau bernyanyi untuk memuji. Pilihan ini menyampaikan unsur pujian tanpa membatasi maknanya pada alat musik atau mazmur tertentu.
- source_word: שִׂיחוּ
  choice: ceritakanlah
  rationale: שׂיח dapat berarti merenungkan, membicarakan, atau menceritakan. Dalam rangkaian perintah pujian yang bersifat umum ini, “ceritakanlah” paling sesuai, sementara kemungkinan makna reflektif dipertahankan dalam catatan kaki.
- source_word: בְּ/כָל
  choice: segala
  rationale: Sesudah verba שׂיח, ב menandai pokok pembicaraan, sedangkan כָל memberi cakupan menyeluruh. Dalam bahasa Indonesia, hubungan itu tersampaikan secara alami tanpa menerjemahkan preposisinya secara tersendiri.
- source_word: נִפְלְאוֹתָֽי/ו
  choice: perbuatan-Nya yang ajaib
  rationale: Bentuk ini menunjuk pada tindakan-tindakan luar biasa yang membangkitkan kekaguman, khususnya karya ilahi; frasa ini mempertahankan baik unsur tindakan maupun keajaibannya.
