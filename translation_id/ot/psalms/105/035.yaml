base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/035.yaml
  text: It ate all the vegetation in their land[b][a], and it ate the fruit of their ground.
translation:
  language: id
  text: Kawanan itu memakan segala tumbuhan di negeri mereka[a], dan memakan hasil tanah mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala rumput di negeri mereka.” Kata Ibrani עֵשֶׂב dapat berarti rumput secara khusus atau tumbuh-tumbuhan secara lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “buah tanah mereka”; maksudnya dapat mencakup segala hasil tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: kawanan itu memakan
  rationale: Kata kerja berbentuk tunggal maskulin dan mengacu pada pelaku kolektif tunggal dalam konteks sebelumnya, yaitu kawanan belalang. Bahasa Indonesia tidak menandai gender pada subjek; penyebutan 'kawanan itu' memperjelas rujukan tanpa mengubah sifat kolektifnya. 'Memakan' mempertahankan gambaran konkret dari teks Ibrani.
- source_word: כָּל
  choice: segala
  rationale: Kata ini menyatakan keseluruhan. 'Segala' terdengar alami bersama nomina kolektif 'tumbuhan' dan mempertahankan cakupan total.
- source_word: עֵשֶׂב
  choice: tumbuhan
  rationale: Kata Ibrani ini dapat menunjuk secara khusus pada rumput atau secara lebih luas pada tumbuh-tumbuhan. Dalam konteks tulah belalang, 'tumbuhan' menyampaikan cakupan luas secara wajar dalam bahasa Indonesia modern.
- source_word: בְּאַרְצָם
  choice: di negeri mereka
  rationale: Preposisi ב menyatakan lokasi, sedangkan אֶרֶץ di sini menunjuk wilayah atau negeri. Pilihan ini juga membedakannya dari אֲדָמָה pada baris berikutnya.
- source_word: פְּרִי
  choice: hasil
  rationale: פְּרִי secara harfiah dapat berarti 'buah', tetapi dalam konteks pertanian juga mencakup hasil atau produksi tanah. 'Hasil tanah' alami dalam bahasa Indonesia dan tidak membatasi makna pada buah pohon.
- source_word: אַדְמָתָם
  choice: tanah mereka
  rationale: אֲדָמָה menunjuk tanah atau lahan yang menghasilkan tanaman. 'Tanah mereka' mempertahankan nuansa pertanian sekaligus membedakannya dari 'negeri mereka' pada klausa pertama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. Pengulangan 'memakan' dipertahankan untuk mencerminkan paralelisme dan pengulangan kata kerja Ibrani. 'Kawanan itu' memakai konteks ayat sebelumnya untuk membuat subjek tunggal kolektif dapat dipahami secara alami.
