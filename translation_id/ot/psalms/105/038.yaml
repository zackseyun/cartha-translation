  text: Bangsa Mesir bersukacita ketika orang Israel keluar, sebab rasa takut terhadap orang Israel telah melanda mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמַח
  choice: bersukacita
  rationale: Bentuk Qal perfektum menyatakan kegembiraan bangsa Mesir sebagai tanggapan atas keluarnya Israel. “Bersukacita” alami, bermartabat, dan cukup kuat tanpa melebih-lebihkan makna.
- source_word: מִצְרַיִם
  choice: Bangsa Mesir
  rationale: Nama Mesir di sini berfungsi sebagai sebutan kolektif bagi penduduknya. “Bangsa Mesir” mempertahankan pengertian kolektif sekaligus membuat rujukan kata ganti terakhir lebih jelas dalam bahasa Indonesia.
- source_word: בְּצֵאתָם
  choice: ketika orang Israel keluar
  rationale: 'Preposisi ב dengan infinitif konstruk יצא dan sufiks orang ketiga jamak menyatakan waktu: “ketika mereka keluar.” Rujukannya kepada orang Israel dibuat eksplisit berdasarkan konteks agar rangkaian kata ganti tidak membingungkan.'
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bangsa Mesir bersukacita. “Sebab” ringkas dan wajar dalam laras mazmur.
- source_word: נָפַל
  choice: telah melanda
  rationale: Secara harfiah berarti “jatuh,” tetapi bersama kata “rasa takut” ungkapan ini menyatakan bahwa ketakutan telah menguasai atau menimpa mereka. “Telah melanda” mempertahankan daya gambar sekaligus terdengar alami.
- source_word: פַּחְדָּם
  choice: rasa takut terhadap orang Israel
  rationale: פַּחַד menyatakan rasa takut atau kegentaran yang kuat. Sufiks jamaknya dipahami secara objektif, yaitu ketakutan yang disebabkan oleh orang Israel; rujukannya dibuat eksplisit demi kejelasan.
- source_word: עֲלֵיהֶם
  choice: mereka
  rationale: Sufiks ini merujuk kepada bangsa Mesir. Dalam ungkapan “telah melanda mereka,” hubungan yang dinyatakan oleh עַל tersampaikan secara idiomatis.
