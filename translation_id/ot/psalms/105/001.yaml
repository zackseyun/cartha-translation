  text: הוֹד֣וּ לַ֭/יהוָה קִרְא֣וּ בִּ/שְׁמ֑/וֹ הוֹדִ֥יעוּ בָ֝/עַמִּ֗ים עֲלִילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: id
  text: Bersyukurlah kepada Yahweh; panggillah nama-Nya; beritahukanlah perbuatan-perbuatan-Nya di antara bangsa-bangsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹדוּ
  choice: Bersyukurlah
  rationale: Bentuk imperatif jamak Hifil dari ידה dalam konteks mazmur lazim menyatakan ucapan syukur atau pujian. “Bersyukurlah” alami dalam bahasa Indonesia dan sesuai dengan pelengkap kepada Yahweh.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima ucapan syukur, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama perjanjian dalam teks sumber.
- source_word: קִרְאוּ בִּשְׁמוֹ
  choice: berserulah kepada nama-Nya
  rationale: Gabungan קרא dengan בְּשֵׁם dapat berarti berseru kepada atau memanggil nama seseorang. Pilihan ini mempertahankan nuansa doa dan ibadah serta tetap wajar dalam ragam Alkitab Indonesia.
- source_word: הוֹדִיעוּ
  choice: beritahukanlah
  rationale: Bentuk imperatif jamak Hifil dari ידע berarti menyebabkan orang mengetahui. “Beritahukanlah” mempertahankan daya kausatif itu secara ringkas dan alami.
- source_word: בָעַמִּים
  choice: di antara bangsa-bangsa
  rationale: Preposisi ב mendukung arti “di antara”, sementara bentuk jamak עַמִּים menunjuk kepada berbagai bangsa atau kelompok masyarakat.
- source_word: עֲלִילוֹתָיו
  choice: perbuatan-perbuatan-Nya
  rationale: Kata עֲלִילוֹת menunjuk pada tindakan atau perbuatan. Terjemahan ini tidak menambahkan sifat “perkasa” yang tidak dinyatakan secara leksikal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi, sedangkan “TUHAN” merupakan penggantian tradisional berdasarkan kebiasaan pembacaan.
- issue: Makna קִרְאוּ בִּשְׁמוֹ
  choice: berserulah kepada nama-Nya
  alternative: serukanlah nama-Nya
  rationale: Konstruksi קרא בְּשֵׁם dapat dipahami sebagai memohon atau berseru kepada nama ilahi, tetapi dalam konteks pewartaan juga dapat bernuansa menyerukan nama-Nya. Pilihan utama mempertahankan arti ibadah yang lazim tanpa meniadakan kemungkinan nuansa pewartaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif jamak Ibrani dinyatakan dengan akhiran -lah; paralelisme tiga perintah dipertahankan. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
