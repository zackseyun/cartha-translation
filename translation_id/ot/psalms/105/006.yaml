lexical_decisions:
- source_word: זֶרַע
  choice: keturunan
  rationale: Kata benda tunggal Ibrani ini dipakai secara kolektif untuk keturunan Abraham. “Keturunan” alami dalam bahasa Indonesia dan mempertahankan cakupan kolektifnya tanpa memberi kesan benih secara harfiah.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam konteks ini Abraham disebut sebagai hamba Allah. “Hamba” mempertahankan hubungan pengabdian dan merupakan sebutan yang wajar serta bermartabat.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk Ibraninya secara morfologis berarti “putra-putra/anak-anak lelaki,” tetapi dalam ungkapan silsilah dapat menunjuk kepada keturunan atau umat yang berasal dari Yakub. “Anak-anak Yakub” alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּחִירָיו
  choice: orang-orang pilihan-Nya
  rationale: Adjektiva jamak dengan sufiks ini menunjuk kepada mereka yang dipilih Allah. Ungkapan ini jelas dan tidak memasukkan muatan teologis tambahan.
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: keturunan Abraham // anak-anak Yakub
  rationale: Kedua ungkapan paralel dipertahankan secara terpisah agar identifikasi umat melalui garis para leluhur tetap tampak.
theological_decisions:
- issue: Acuan sufiks posesif pada “hamba-Nya” dan “orang-orang pilihan-Nya”
  choice: 'Kedua sufiks dipahami mengacu kepada Allah: Abraham adalah hamba Allah, dan anak-anak Yakub adalah orang-orang pilihan Allah.'
  alternative: Secara mekanis, sufiks dapat dikaitkan dengan tokoh bernama yang paling dekat, tetapi pembacaan itu kurang sesuai dengan konteks mazmur.
  rationale: Konteks perjanjian dalam mazmur dan pemakaian alkitabiah yang lebih luas mendukung Allah sebagai acuan kedua sufiks. Huruf kapital pada “-Nya” menyatakan pembacaan kontekstual ini.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan dua baris mempertahankan paralelisme Ibrani. Frasa-frasa nominal dibaca sebagai sapaan dalam rangkaian ajakan pada konteks sekitarnya, tanpa menambahkan kata seru yang tidak hadir dalam ayat ini.
