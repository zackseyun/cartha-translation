  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
translation:
  language: id
  text: Ia membuat umat-Nya bertambah banyak sekali[a] dan menjadikan mereka lebih kuat daripada lawan-lawan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat umat-Nya berkembang biak dengan sangat pesat.” Kata kerja Ibrani dapat menekankan keadaan berbuah atau pertambahan jumlah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menjadikannya lebih kuat daripada lawan-lawannya.” Dalam bahasa Ibrani, kata ganti tunggal mengacu kepada kata kolektif “umat-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּפֶר
  choice: membuat ... bertambah sangat banyak
  rationale: Bentuk Hifil dari פרה menyatakan tindakan menyebabkan berbuah, berkembang biak, atau bertambah. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan pertambahan jumlah umat Israel dalam konteksnya.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עַם menunjuk kepada suatu bangsa atau kelompok sebagai kesatuan. Dalam konteks hubungan Allah dengan Israel, “umat-Nya” merupakan padanan yang alami dan tepat.
- source_word: מְאֹד
  choice: sangat banyak
  rationale: מְאֹד menguatkan tingkat pertambahan. Dalam susunan bahasa Indonesia, maknanya dinyatakan secara alami bersama verba sebagai “bertambah sangat banyak”.
- source_word: וַיַּעֲצִמֵהוּ
  choice: menjadikan mereka lebih kuat
  rationale: Bentuk Hifil dari עצם berarti membuat kuat. Frasa מן sesudahnya memberi daya banding, sehingga “lebih kuat daripada” menyampaikan hubungan sintaksis tersebut. Kata ganti tunggal Ibrani mengacu kepada עַם sebagai nomina kolektif dan secara alami menjadi “mereka” dalam bahasa Indonesia.
- source_word: מִצָּרָיו
  choice: daripada lawan-lawan mereka
  rationale: צַר berarti lawan, musuh, atau pihak yang memusuhi dan menyesakkan. “Lawan-lawan” mempertahankan cakupan umum istilah Ibrani tanpa mempersempitnya hanya kepada penindasan tertentu.
theological_decisions:
- issue: Peralihan dari kata ganti tunggal kolektif ke bentuk jamak dalam bahasa Indonesia
  choice: Kata ganti tunggal Ibrani yang mengacu kepada “umat-Nya” diterjemahkan dengan “mereka”.
  alternative: 'Mempertahankan bentuk tunggal secara harfiah: “menjadikannya lebih kuat daripada lawan-lawannya”.'
  rationale: Bahasa Ibrani memperlakukan עַם sebagai satu kesatuan gramatikal, sedangkan bahasa Indonesia modern lebih alami memakai “mereka” ketika yang dimaksud ialah orang-orang dalam suatu umat. Pilihan ini bersifat kebahasaan dan tidak mengubah identitas kelompok tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Ia” dan “-Nya” dipakai untuk rujukan kepada Allah. Susunan kalimat mempertahankan dua tindakan ilahi yang sejajar, sementara kata ganti jamak dipakai agar rujukan kolektif terdengar alami.
