  text: He struck down every firstborn in their land[a], the firstfruits of all their strength.
translation:
  language: id
  text: 'Ia menewaskan setiap anak sulung di negeri mereka,


    buah pertama dari segala kekuatan mereka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang pertama dari seluruh kekuatan mereka.” Ungkapan Ibrani ini menyebut anak sulung sebagai hasil pertama, yakni perwujudan awal kekuatan atau daya menghasilkan keturunan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Ia membunuh
  rationale: Bentuk Hifil dari נכה berarti ‘memukul’ atau ‘menghantam’; dalam konteks tulah kematian anak sulung, ‘membunuh’ menyatakan hasil mematikan yang jelas dari konteks tanpa memakai ungkapan Indonesia yang janggal.
- source_word: כָּל בְּכוֹר
  choice: setiap anak sulung
  rationale: כָּל dengan nomina tunggal bersifat distributif, sehingga ‘setiap anak sulung’ alami dan tepat dalam bahasa Indonesia.
- source_word: בְּאַרְצָם
  choice: di negeri mereka
  rationale: אֶרֶץ dengan sufiks orang ketiga jamak berarti wilayah milik atau tempat kediaman mereka; ‘negeri’ sesuai dengan latar Mesir.
- source_word: רֵאשִׁית
  choice: yang pertama
  rationale: רֵאשִׁית menunjuk pada yang pertama atau permulaan. Pilihan ini mempertahankan hubungan paralel dengan ‘anak sulung’ tanpa memasukkan metafora hasil panen yang tidak eksplisit.
- source_word: לְכָל אוֹנָם
  choice: dari segala keperkasaan mereka
  rationale: לְ menyatakan hubungan, sedangkan אוֹן dapat berarti kekuatan, daya, atau kemampuan menghasilkan keturunan. ‘Keperkasaan’ cukup alami dan tetap membuka nuansa daya hidup serta kemampuan prokreatif.
theological_decisions:
- issue: Subjek tersirat verba
  choice: Ia, yaitu Allah dalam konteks
  alternative: TUHAN membunuh
  rationale: Bahasa Ibrani hanya menyatakan subjek orang ketiga tunggal yang merujuk kembali kepada Allah dalam konteks. ‘Ia’ mempertahankan kohesi itu tanpa menambahkan nama ilahi pada ayat ini.
- issue: Makna ungkapan רֵאשִׁית לְכָל אוֹנָם
  choice: yang pertama dari segala keperkasaan mereka
  alternative: buah pertama dari seluruh kekuatan mereka
  rationale: Ungkapan puitis ini menggambarkan anak sulung sebagai hasil atau wujud awal daya orang tua. Terjemahan utama mempertahankan ketegangan metaforisnya, sedangkan catatan menjelaskan nuansa prokreatif tanpa membatasinya secara dogmatis.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. ‘Membunuh’ dipilih karena konteks kematian anak sulung menjadikan akibat fatal verba tersebut eksplisit. Penanda catatan kaki [a] ditempatkan langsung sesudah klausa yang dijelaskannya.
