  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. “Ia berkata” dipilih daripada “Ia berfirman” agar makna leksikal אָמַר tidak diperluas, sedangkan konstruksi eliptis pada klausa kedua mempertahankan keringkasan paralel Ibrani.
