id: PSA.105.31
reference: Psalms 105:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֭מַר וַ/יָּבֹ֣א עָרֹ֑ב כִּ֝נִּ֗ים בְּ/כָל גְּבוּלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/031.yaml
  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
translation:
  language: id
  text: Ia berkata, maka datanglah kawanan lalat[a], dan agas[b] di seluruh wilayah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kawanan serangga”; dalam kisah tulah, kata Ibrani עָרֹב secara tradisional dipahami sebagai kawanan lalat, tetapi jenis serangga yang tepat tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “kutu” atau “nyamuk”; jenis serangga yang dimaksud oleh kata Ibrani כִּנִּים tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Ia berkata
  rationale: Kata kerja ini secara langsung berarti “berkata” atau “berbicara”. Pilihan ini mempertahankan rumusan singkat tentang ucapan Allah tanpa menafsirkannya secara lebih khusus sebagai perintah.
- source_word: וַיָּבֹא
  choice: maka datanglah
  rationale: Bentuk naratif dari בוא menyatakan datangnya tulah sebagai akibat ucapan sebelumnya. Susunan inversi “datanglah” juga sesuai dengan gaya puitis yang ringkas.
- source_word: עָרֹב
  choice: kawanan lalat
  rationale: Dalam kisah tulah, istilah ini secara tradisional dipahami sebagai kawanan serangga, lazimnya lalat. Jenis serangganya tidak sepenuhnya pasti, sehingga ketidakpastian itu dicatat dalam catatan kaki.
- source_word: כִּנִּים
  choice: agas
  rationale: Istilah ini menunjuk pada serangga kecil pengganggu atau penggigit, tetapi identifikasi tepatnya tidak pasti. “Agas” merupakan padanan Indonesia yang wajar tanpa memastikan jenis serangga secara berlebihan.
- source_word: בְּכָל
  choice: di seluruh
  rationale: Gabungan preposisi dan kata “seluruh” menyatakan penyebaran yang mencakup segenap kawasan.
- source_word: גְּבוּלָם
  choice: wilayah mereka
  rationale: Dalam konteks cakupan tulah, גְּבוּל menunjuk pada seluruh kawasan atau daerah kekuasaan mereka, bukan hanya garis perbatasannya.
theological_decisions: []
