  text: זִכְר֗וּ נִפְלְאוֹתָ֥י/ו אֲשֶׁר עָשָׂ֑ה מֹ֝פְתָ֗י/ו וּ/מִשְׁפְּטֵי פִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/005.yaml
  text: Remember the wonders that he has done[a], his signs and the judgments of his mouth[c][b],
translation:
  language: id
  text: Ingatlah perbuatan-perbuatan ajaib yang telah dilakukan-Nya[a], tanda-tanda-Nya[b], dan keputusan-keputusan yang diucapkan-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keajaiban-keajaiban yang telah dibuat-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mukjizat-mukjizat-Nya” atau “pertanda-pertanda-Nya.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “keputusan-keputusan mulut-Nya”; dapat juga diterjemahkan “penghakiman-penghakiman yang dinyatakan-Nya” atau “ketetapan-ketetapan dari mulut-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Ingatlah
  rationale: Imperatif jamak dari זכר. “Ingatlah” merupakan seruan langsung dan alami dalam bahasa Indonesia serta mencakup tindakan menghadirkan kembali dalam ingatan.
- source_word: נִפְלְאוֹתָיו
  choice: perbuatan-perbuatan ajaib yang telah dilakukan-Nya
  rationale: Nomina ini menunjuk pada tindakan luar biasa yang membangkitkan kekaguman. Dalam bahasa Indonesia, “perbuatan-perbuatan ajaib” lebih jelas daripada sekadar “keajaiban-keajaiban” dan menyatu secara alami dengan klausa relatif berikutnya.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dilakukan-Nya
  rationale: Klausa relatif ini menerangkan perbuatan-perbuatan ajaib tersebut. Bentuk “telah dilakukan-Nya” menunjukkan tindakan lampau yang tetap relevan dalam seruan untuk mengingat.
- source_word: מֹפְתָיו
  choice: tanda-tanda-Nya
  rationale: מוֹפֵת dapat berarti tanda, mukjizat, atau pertanda yang menunjukkan tindakan ilahi. “Tanda-tanda” mempertahankan cakupan maknanya tanpa membatasinya hanya pada mukjizat atau memberinya nuansa buruk.
- source_word: וּמִשְׁפְּטֵי פִיו
  choice: dan keputusan-keputusan yang diucapkan-Nya
  rationale: מִשְׁפָּט dapat menunjuk pada keputusan hukum, penghakiman, atau ketetapan. Ungkapan Indonesia ini menyampaikan bahwa keputusan tersebut keluar dari mulut-Nya sambil menghindari ungkapan harfiah “keputusan-keputusan mulut-Nya” yang terasa kaku.
- source_word: פִיו
  choice: yang diucapkan-Nya
  rationale: Metonimia “mulut-Nya” dialihkan secara alami menjadi tindakan mengucapkan. Bentuk harfiah dipertahankan sebagai alternatif dalam catatan kaki.
theological_decisions:
- issue: Hubungan antara נִפְלְאוֹת dan מֹפְתִים
  choice: 'Diterjemahkan sebagai dua kategori yang berbeda tetapi bertumpang tindih: “perbuatan-perbuatan ajaib” dan “tanda-tanda.”'
  alternative: “keajaiban-keajaiban” dan “mukjizat-mukjizat” atau “perbuatan-perbuatan menakjubkan” dan “pertanda-pertanda.”
  rationale: Ayat ini menumpuk istilah bagi karya Allah yang dahsyat tanpa menuntut pembedaan teknis yang kaku. Dua istilah Indonesia menjaga paralelisme dan perbedaan leksikal sumber.
- issue: Makna מִשְׁפְּטֵי פִיו
  choice: 'Keputusan-keputusan ilahi yang dinyatakan secara lisan: “keputusan-keputusan yang diucapkan-Nya.”'
  alternative: “penghakiman-penghakiman dari mulut-Nya” atau “ketetapan-ketetapan yang keluar dari mulut-Nya.”
  rationale: Konteks memungkinkan nuansa keputusan hukum, penghakiman, maupun ketetapan. Terjemahan utama tetap cukup terbuka dan tidak menentukan secara berlebihan jenis keputusan yang dimaksud; citra Ibrani dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Bentuk ulang dipakai untuk menyampaikan jamak Ibrani dengan jelas. Kapital pada enklitik -Nya menandai rujukan kepada Allah sesuai kebiasaan penerbitan Alkitab Indonesia.
