translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Para pembesar” dipilih daripada “para pangeran” agar cocok dengan lingkungan pejabat istana Mesir, sedangkan “para tetua” mempertahankan nuansa usia sekaligus kedudukan. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
