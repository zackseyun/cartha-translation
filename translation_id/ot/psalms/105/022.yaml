    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: untuk mengikat
  rationale: Infinitif konstruk dari אסר menyatakan tujuan atau hasil dalam hubungan dengan ayat sebelumnya. “Mengikat” mempertahankan gambaran dasar Ibrani tanpa mempersempit maknanya menjadi pemenjaraan atau pembelengguan secara harfiah.
- source_word: שָׂרָיו
  choice: para pembesarnya
  rationale: שַׂר dapat menunjuk kepada pangeran, kepala, atau pejabat. Dalam konteks istana Mesir, “para pembesar” terdengar alami dalam bahasa Indonesia dan mempertahankan nuansa pejabat tinggi tanpa menyiratkan bahwa mereka semua keturunan raja.
- source_word: בְּנַפְשׁוֹ
  choice: sesuka hatinya
  rationale: Secara harfiah berarti “dengan/menurut jiwanya”; נֶפֶשׁ di sini mengungkapkan kehendak atau keinginan. “Sesuka hatinya” menyampaikan idiom tersebut secara wajar sambil tetap mempertahankan rujukan pronomina yang tidak disebutkan ulang secara eksplisit.
- source_word: וּזְקֵנָיו
  choice: dan para tetuanya
  rationale: זָקֵן dapat berarti orang tua atau tua-tua yang berkedudukan. “Para tetua” mempertahankan unsur usia dan wibawa serta sesuai dengan konteks para pemimpin senior di istana.
- source_word: יְחַכֵּם
  choice: mengajarkan hikmat kepada
  rationale: Bentuk piel dari חכם dapat berarti membuat bijaksana atau mengajarkan hikmat. Pilihan ini menyatakan daya kausatif dan instruksionalnya dengan bahasa Indonesia yang jelas.
