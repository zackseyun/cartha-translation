  text: דִּרְשׁ֣וּ יְהוָ֣ה וְ/עֻזּ֑/וֹ בַּקְּשׁ֖וּ פָנָ֣י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/004.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: id
  text: Carilah Yahweh dan kekuatan-Nya; carilah wajah-Nya senantiasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “carilah hadirat-Nya senantiasa.” Secara harfiah, teks Ibrani berbunyi “carilah wajah-Nya senantiasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Carilah
  rationale: Bentuk imperatif jamak ini mengajak umat untuk berpaling kepada dan mencari Yahweh dengan sungguh-sungguh; “carilah” alami dalam bahasa Indonesia dan mempertahankan daya kehendak serta nuansa ibadahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi Allah dalam teks Ibrani tidak diganti dengan gelar.
- source_word: וְעֻזּוֹ
  choice: dan kekuatan-Nya
  rationale: עֹז berarti kekuatan, keperkasaan, atau kuasa. “Kekuatan-Nya” merupakan padanan langsung dan tetap mempertahankan sufiks pronominal orang ketiga.
- source_word: בַּקְּשׁוּ
  choice: carilah
  rationale: Imperatif jamak בקשׁ menyatakan pencarian yang aktif. Pengulangan “carilah” mempertahankan kesejajaran puitis kedua seruan Ibrani.
- source_word: פָנָיו
  choice: wajah-Nya
  rationale: Secara harfiah berarti “wajah-Nya” dan secara metonimis dapat menunjuk pada hadirat-Nya. Pilihan formal ini mempertahankan gambaran relasional dalam teks.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: תָּמִיד menyatakan kesinambungan atau keteraturan yang tetap. “Senantiasa” ringkas, wajar dalam ragam mazmur, dan tidak harus menyiratkan tindakan tanpa jeda secara mekanis.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan sebuah gelar.
- issue: Apakah פָנָיו diterjemahkan secara harfiah atau idiomatis
  choice: wajah-Nya
  alternative: hadirat-Nya
  rationale: Ungkapan Ibrani ini dapat berarti hadirat Allah, tetapi terjemahan “wajah-Nya” mempertahankan metafora antropomorfis dan daya relasionalnya. Makna idiomatis dicantumkan dalam catatan kaki tanpa meniadakan ketegangan ungkapan asli.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada luhur tanpa menjadi arkais. Bentuk “-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah. Kesejajaran kedua imperatif dipertahankan dengan pengulangan “carilah”.
