translation:
  language: id
  text: Ia mendatangkan kelaparan di negeri itu; Ia menghancurkan seluruh persediaan makanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap tongkat roti,” sebuah ungkapan Ibrani untuk seluruh persediaan atau penopang makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Ia mendatangkan
  rationale: Dengan רָעָב sebagai objek, קרא menyatakan tindakan memanggil atau menghadirkan kelaparan. “Mendatangkan” terdengar alami dalam bahasa Indonesia dan mempertahankan tindakan aktif Allah.
- source_word: רָעָב
  choice: kelaparan
  rationale: Dalam konteks ini kata tersebut menunjuk pada kelangkaan pangan yang melanda suatu negeri, bukan sekadar rasa lapar perseorangan.
- source_word: עַל הָאָרֶץ
  choice: atas negeri itu
  rationale: Konteks mazmur mengarah pada wilayah yang sedang dibicarakan, sehingga “negeri itu” lebih tepat daripada “bumi” yang dapat memberi kesan global.
- source_word: כָּל מַטֵּה לֶחֶם
  choice: setiap penopang berupa makanan
  rationale: Ungkapan harfiahnya adalah “setiap tongkat roti.” מַטֶּה menggambarkan sesuatu yang menopang kehidupan, sedangkan לֶחֶם di sini mewakili makanan. Pilihan ini mempertahankan citra penopang tanpa menghasilkan ungkapan Indonesia yang membingungkan.
- source_word: שָׁבָר
  choice: Ia mematahkan
  rationale: Arti dasar verba ini adalah “mematahkan.” Pilihan tersebut mempertahankan metafora penopang yang dipatahkan dan tindakan ilahi yang tegas.
theological_decisions:
- issue: Peran Allah dalam terjadinya kelaparan
  choice: 'Kedua verba diterjemahkan dengan Allah sebagai pelaku: “Ia mendatangkan ... Ia mematahkan.”'
  alternative: Menyajikan kelaparan dan terputusnya pangan sebagai peristiwa impersonal.
  rationale: Konteks mazmur sedang menceritakan tindakan-tindakan TUHAN, dan verba maskulin tunggal dalam ayat ini secara wajar meneruskan Dia sebagai subjek. Terjemahan mempertahankan peran ilahi tanpa menambahkan penjelasan tentang maksud-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” mengikuti gaya puitis naratif serta merujuk kepada Allah dari konteks. Metafora Ibrani dipertahankan dalam bentuk yang dapat dipahami, sementara bentuk harfiahnya dijelaskan dalam catatan kaki.
