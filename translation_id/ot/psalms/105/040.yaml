  text: שָׁאַ֣ל וַ/יָּבֵ֣א שְׂלָ֑ו וְ/לֶ֥חֶם שָׁ֝מַ֗יִם יַשְׂבִּיעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/040.yaml
  text: They asked[a], and he brought quail[b]; he satisfied them with the bread of heaven.
translation:
  language: id
  text: Mereka meminta[a], lalu Ia mendatangkan burung puyuh; Ia mengenyangkan mereka dengan roti dari langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, verbanya berbentuk tunggal, secara harfiah, “ia meminta.” Maksudnya kemungkinan besar umat Israel secara kolektif.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאַל
  choice: Mereka meminta
  rationale: Bentuk tertulisnya adalah verba perfektum orang ketiga tunggal maskulin, secara harfiah 'ia meminta'. Namun, konteks menunjuk kepada umat Israel secara kolektif, dan akhiran objek jamak pada יַשְׂבִּיעֵם mendukung pemahaman jamak. Bentuk tunggal Ibrani dipertahankan dalam catatan kaki.
- source_word: וַיָּבֵא
  choice: lalu Ia mendatangkan
  rationale: Bentuk hifil dari בוא menyatakan tindakan menyebabkan sesuatu datang. 'Mendatangkan' mempertahankan daya kausatif dan wajar untuk tindakan Allah menghadirkan burung puyuh.
- source_word: שְׂלָו
  choice: burung puyuh
  rationale: Makna leksikal bakunya adalah burung puyuh, sesuai dengan kisah pemeliharaan Allah di padang gurun.
- source_word: לֶחֶם שָׁמַיִם
  choice: roti dari langit
  rationale: Frasa konstruksi ini secara harfiah dapat dipahami sebagai 'roti langit/roti dari langit'. Dalam bahasa Indonesia, 'roti dari langit' secara alami menyampaikan hubungan asal tanpa menghilangkan corak puitis.
- source_word: יַשְׂבִּיעֵם
  choice: Ia mengenyangkan mereka
  rationale: Bentuk hifil dari שׂבע berarti membuat kenyang atau memuaskan. 'Mengenyangkan' secara tepat menyatakan pemberian makanan sampai cukup dan cocok dengan objek jamak.
theological_decisions:
- issue: Subjek verba pembuka שָׁאַל
  choice: 'Dipahami secara kolektif sebagai umat Israel: ''Mereka meminta.'''
  alternative: '''Ia meminta,'' mengikuti bentuk gramatikal tunggal secara lebih harfiah; subjeknya mungkin Israel sebagai satu kesatuan atau seorang wakil.'
  rationale: Konteks mazmur menceritakan tindakan Allah bagi Israel di padang gurun, sedangkan akhiran objek jamak dalam 'mengenyangkan mereka' mendukung rujukan kepada umat. Terjemahan utama memakai bentuk jamak agar makna naratif jelas, tetapi ketegangan dengan bentuk tunggal sumber dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. Kapitalisasi 'Ia' menandai Allah sebagai subjek tersirat tanpa menambahkan nama yang tidak terdapat dalam ayat. Penanda catatan kaki [a] ditempatkan langsung setelah klausa terkait.
