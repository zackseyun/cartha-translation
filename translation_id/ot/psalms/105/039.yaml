  text: He spread out a cloud as a covering[a], and fire to give light by night.
translation:
  language: id
  text: Ia membentangkan awan sebagai penutup[a], dan api untuk memberi terang pada malam hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk menjadi penutup”, “sebagai tirai”, atau “sebagai penyekat”. Kata Ibrani ini dapat menunjuk pada penutup atau tirai yang berfungsi sebagai pelindung atau penyekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַשׂ
  choice: membentangkan
  rationale: Kata kerja ini berarti membentangkan atau menghamparkan; “membentangkan” mempertahankan gambaran awan yang ditempatkan meluas di atas umat.
- source_word: עָנָן
  choice: awan
  rationale: Padanan langsung dan alami; dalam konteksnya menunjuk pada awan dalam perjalanan di padang gurun.
- source_word: לְמָסָךְ
  choice: sebagai tudung
  rationale: מָסָךְ dapat berarti penutup, tirai, atau penyekat. “Sebagai tudung” menyampaikan fungsi menaungi tanpa mempersempit gambaran menjadi unsur arsitektural tertentu.
- source_word: וְאֵשׁ
  choice: dan api
  rationale: Terjemahan harfiah mempertahankan kesejajaran puitis antara awan dan api serta tidak menambahkan sebutan “tiang” yang tidak terdapat dalam ayat ini.
- source_word: לְהָאִיר
  choice: untuk menerangi
  rationale: Bentuk infinitif menyatakan tujuan atau fungsi; “untuk menerangi” alami dalam bahasa Indonesia dan sesuai dengan peran api.
- source_word: לָיְלָה
  choice: malam
  rationale: Dalam konstruksi ini, “menerangi malam” merupakan ungkapan Indonesia yang ringkas dan alami untuk tindakan memberi terang pada waktu malam.
theological_decisions:
- issue: Subjek tersirat dari kata kerja
  choice: Ia, yaitu Allah dalam konteks mazmur
  alternative: TUHAN
  rationale: Bahasa Ibrani memakai subjek orang ketiga maskulin tunggal yang diteruskan dari konteks. “Ia” mempertahankan alur wacana tanpa mengganti subjek tersirat dengan nama ilahi yang tidak tertulis dalam ayat ini.
- issue: Gambaran penampakan ilahi di padang gurun
  choice: Mempertahankan gambaran awan dan api secara harfiah tanpa penjelasan tambahan
  alternative: Menyebutnya secara eksplisit sebagai tiang awan dan tiang api
  rationale: Ayat ini menggemakan kisah Keluaran, tetapi teks hanya menyebut awan dan api beserta fungsinya. Terjemahan tidak menambahkan “tiang” ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. “Tudung” dipilih untuk mempertahankan gambaran pelindung yang konkret, dengan kemungkinan makna lain dijelaskan dalam catatan kaki.
