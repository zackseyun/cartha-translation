id: PSA.105.17
reference: Psalms 105:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׁלַ֣ח לִ/פְנֵי/הֶ֣ם אִ֑ישׁ לְ֝/עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a servant.
translation:
  language: id
  text: Ia mengutus seorang laki-laki mendahului mereka[a]; Yusuf dijual sebagai budak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di depan mereka” atau “di hadapan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: mengutus
  rationale: Bentuk Qal perfek orang ketiga maskulin tunggal dengan Allah sebagai subjek tersirat dari konteks. “Mengutus” wajar untuk tindakan Allah yang mengirim seseorang dengan tujuan tertentu.
- source_word: לִפְנֵיהֶם
  choice: mendahului mereka
  rationale: Secara harfiah berarti “di hadapan/di depan mereka”; dalam konteks ini ungkapan tersebut menunjukkan bahwa Yusuf dikirim lebih dahulu daripada mereka.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina tunggal maskulin ini dipertahankan secara eksplisit, bukan digeneralisasi menjadi “seseorang”.
- source_word: לְעֶבֶד
  choice: sebagai budak
  rationale: Prefiks לְ menyatakan keadaan atau hasil. Karena Yusuf dijual dan kehilangan kebebasannya, “budak” lebih tepat daripada “pelayan”.
- source_word: נִמְכַּר
  choice: dijual
  rationale: 'Bentuk Nifal perfek maskulin tunggal dari מכר menyatakan tindakan pasif: Yusuf dijual.'
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan עֶבֶד dalam kisah penjualan Yusuf
  choice: budak
  alternative: pelayan
  rationale: Kata עֶבֶד dapat berarti pelayan atau budak, tetapi verba “dijual” menonjolkan status keterikatan dan hilangnya kebebasan Yusuf. Karena itu, “budak” paling tepat tanpa melunakkan keadaan yang digambarkan.
- issue: Peran Allah dalam penjualan Yusuf
  choice: “Mengutus” dipertahankan berdampingan dengan “dijual” tanpa menjelaskan hubungan kausalnya
  alternative: Menambahkan bahwa Allah menyebabkan atau sekadar memanfaatkan penjualan itu
  rationale: Ayat ini secara teologis menyandingkan pengutusan oleh Allah dengan tindakan manusia menjual Yusuf. Terjemahan tidak boleh menyelesaikan ketegangan itu dengan penjelasan yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda titik koma mempertahankan hubungan erat antara pengutusan laki-laki itu dan pengenalannya sebagai Yusuf. Penanda catatan kaki [a] ditempatkan langsung setelah frasa terkait.
