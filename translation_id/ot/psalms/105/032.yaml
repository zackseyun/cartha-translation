  variant: modern standard Indonesian
source:
  edition: WLC
  text: נָתַ֣ן גִּשְׁמֵי/הֶ֣ם בָּרָ֑ד אֵ֖שׁ לֶהָב֣וֹת בְּ/אַרְצָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/032.yaml
  text: He gave them hail for rain[a], and flaming fire in their land.
translation:
  language: id
  text: 'Ia menjadikan hujan mereka hujan es,

    dan api yang menyala-nyala[a] di negeri mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kilat” atau “sambaran api”; secara harfiah, ungkapan Ibrani ini berbunyi “api nyala-nyala” atau “api yang menyala-nyala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: menjadikan
  rationale: Secara umum verba ini berarti ‘memberi’, tetapi dalam susunan puitis נָתַן ... בָּרָד, ‘menjadikan’ secara alami menyampaikan bahwa Allah mengubah atau mengganti hujan mereka dengan hujan es tanpa menambahkan gagasan ‘mengirim’ yang tidak dinyatakan langsung.
- source_word: גִּשְׁמֵיהֶם
  choice: hujan mereka
  rationale: Bentuk ini secara eksplisit memuat sufiks ‘mereka’. Mempertahankannya menampilkan gambaran bahwa hujan yang biasanya turun di negeri mereka dijadikan hujan es.
- source_word: בָּרָד
  choice: hujan es
  rationale: Ini adalah padanan baku dan jelas dalam bahasa Indonesia untuk בָּרָד.
- source_word: אֵשׁ לֶהָבוֹת
  choice: api yang menyala-nyala
  rationale: Ungkapan Ibrani menggabungkan ‘api’ dan ‘nyala-nyala api’. Pilihan ini mempertahankan penegasan puitisnya dalam bahasa Indonesia yang alami tanpa mempersempit maknanya menjadi ‘kilat’.
- source_word: בְּאַרְצָם
  choice: di negeri mereka
  rationale: Preposisi בְּ diterjemahkan secara langsung sebagai ‘di’, dan ‘negeri mereka’ mempertahankan sufiks posesif yang merujuk kepada Mesir dalam konteks mazmur.
theological_decisions:
- issue: Hakikat אֵשׁ לֶהָבוֹת dalam konteks tulah
  choice: api yang menyala-nyala
  alternative: kilat atau sambaran api
  rationale: Kisah tulah dalam Keluaran memungkinkan gambaran kilat, tetapi ungkapan Ibraninya sendiri menyebut ‘api’ dan ‘nyala-nyala’. Teks utama mempertahankan gambaran yang lebih luas, sedangkan kemungkinan kontekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan dua baris mempertahankan kesejajaran puisi Ibrani. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya, yaitu ‘api yang menyala-nyala’.
