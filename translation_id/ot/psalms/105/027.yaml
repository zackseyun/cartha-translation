  text: שָֽׂמוּ בָ֭/ם דִּבְרֵ֣י אֹתוֹתָ֑י/ו וּ֝/מֹפְתִ֗ים בְּ/אֶ֣רֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/027.yaml
  text: They performed among them the words of his signs[c][b][a], and wonders in the land of Ham.
translation:
  language: id
  text: Mereka melakukan di tengah-tengah mereka perkara-perkara tanda-tanda-Nya[a] dan keajaiban-keajaiban di tanah Ham.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “perkataan-perkataan tanda-tanda-Nya.” Kata Ibrani untuk “perkataan-perkataan” juga dapat berarti “perkara-perkara”.'
    reason: lexical_alternative
  - marker: b
    text: “Tanah Ham” adalah sebutan puitis bagi Mesir.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  choice: melakukan
  rationale: Secara dasar berarti “menaruh/menempatkan”, tetapi bersama tanda-tanda dan keajaiban ungkapan ini menunjuk pada pelaksanaan atau pengadaan tanda-tanda tersebut. “Melakukan” wajar dalam bahasa Indonesia dan sesuai dengan konteks Musa dan Harun.
- source_word: בָם
  choice: di tengah-tengah mereka
  rationale: Pronomina jamak ini mengacu kepada orang Mesir; preposisi ב menyatakan bahwa tanda-tanda itu terjadi di antara mereka.
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: tanda-tanda-Nya
  rationale: Ungkapan Ibraninya secara harfiah tidak lazim, “perkataan-perkataan/perkara-perkara tanda-tanda-Nya”. Dalam konteks, ungkapan itu menunjuk pada tanda-tanda yang dilaksanakan; bentuk harfiahnya dipertahankan dalam catatan kaki agar kejanggalan dan kemungkinan makna sumber tetap terlihat.
- source_word: וּמֹפְתִים
  choice: dan berbagai keajaiban
  rationale: מוֹפֵת menunjuk pada perbuatan luar biasa yang menimbulkan rasa takjub dan lazim berpasangan dengan “tanda”. “Keajaiban” tidak membatasi maknanya hanya pada satu kategori teknis.
- source_word: בְּאֶרֶץ חָם
  choice: di tanah Ham
  rationale: Mempertahankan sebutan puitis Ibrani bagi Mesir, alih-alih langsung menggantinya dengan “Mesir”.
theological_decisions:
- issue: Makna ungkapan דִּבְרֵי אֹתוֹתָיו
  choice: Mengungkapkan makna kontekstual sebagai “tanda-tanda-Nya” dalam teks utama dan mencatat bentuk harfiahnya
  alternative: “perkataan-perkataan tanda-tanda-Nya” atau “perkara-perkara tanda-tanda-Nya”
  rationale: Terjemahan harfiah sangat janggal dalam bahasa Indonesia dan dapat memberi kesan bahwa tanda-tanda itu berbicara. Namun, karena דִּבְרֵי benar-benar terdapat dalam teks Ibrani dan dapat berarti “perkataan” maupun “perkara”, bentuk dan ambiguitasnya dicatat tanpa menetapkan tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sementara ungkapan Ibrani yang tidak lazim dijelaskan dalam catatan kaki. Kapital pada akhiran “-Nya” menandai rujukan kepada Allah sesuai kebiasaan ejaan Alkitab bahasa Indonesia.
