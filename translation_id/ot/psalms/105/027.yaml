  source_fidelity: Teks utama mengalihkan דִּבְרֵי (“perkataan-perkataan; perkara-perkara”) sepenuhnya menjadi “tanda-tanda-Nya”. Catatan kaki mencatat unsur itu, tetapi penghilangan dari teks utama mengurangi bentuk dan nuansa ungkapan Ibrani yang sengaja tidak lazim. Revisi mempertahankan unsur tersebut dengan “perkara-perkara”, yang sesuai dengan pemakaian kontekstualnya tanpa memaksakan arti “perkataan” yang janggal.
  naturalness: “Di tengah-tengah mereka” dan “tanah Ham” baku serta jelas. “Berbagai keajaiban” menambahkan nuansa distributif yang tidak dinyatakan secara khusus oleh bentuk jamak Ibrani; “keajaiban-keajaiban” mempertahankan jamak sumber. Susunan revisi tetap dapat dibaca dalam register Alkitab Indonesia modern, meskipun “perkara-perkara tanda-tanda-Nya” memang mencerminkan ungkapan sumber yang tidak biasa dan dijelaskan dalam catatan.
  terminology: “Tanda-tanda” untuk אֹתוֹת dan “keajaiban-keajaiban” untuk מוֹפְתִים mempertahankan pasangan istilah yang lazim. “Tanah Ham” dipertahankan sebagai nama puitis bagi Mesir dan diberi catatan. Kapitalisasi -Nya konsisten dengan konvensi Alkitab Indonesia.
