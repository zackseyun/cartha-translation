  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: id
  text: Ia membawa mereka keluar dengan perak dan emas, dan di antara suku-suku Israel tidak ada seorang pun yang tersandung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak ada seorang pun yang lemah di antara suku-suku Israel.” Partisip Ibrani ini dapat berarti tersandung, terhuyung, atau lemah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: Ia membawa mereka keluar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan atau membawa seseorang keluar. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan tindakan ilahi dalam konteks keluaran.
- source_word: בְּכֶסֶף וְזָהָב
  choice: dengan perak dan emas
  rationale: 'Preposisi ב menyatakan penyertaan: mereka keluar dengan memiliki perak dan emas. Terjemahan ini tidak menambahkan gagasan bahwa mereka sarat dengan barang-barang tersebut.'
- source_word: וְאֵין
  choice: dan ... tidak ada seorang pun
  rationale: Bentuk eksistensial אין secara alami menyatakan bahwa tidak terdapat seorang pun dengan keadaan yang disebut sesudahnya.
- source_word: בִּשְׁבָטָיו
  choice: di antara suku-sukunya
  rationale: שֵׁבֶט berarti 'suku' dalam konteks ini. Akhiran orang ketiga tunggal dipertahankan melalui '-nya', dengan Israel dipandang sebagai satu kesatuan kolektif.
- source_word: כּוֹשֵׁל
  choice: yang tersandung
  rationale: Partisip dari כשל dapat menggambarkan orang yang tersandung, terhuyung, atau lemah. 'Yang tersandung' mempertahankan gambaran verbal konkret tanpa meniadakan kemungkinan makna kelemahan.
theological_decisions:
- issue: Rujukan akhiran tunggal pada בִּשְׁבָטָיו
  choice: Mempertahankan bentuk tunggal kolektif melalui 'suku-sukunya', yang merujuk pada Israel/Yakub sebagai satu kesatuan.
  alternative: '''suku-suku mereka'', yang secara eksplisit menyesuaikan kepemilikan dengan kelompok orang yang disebut sebelumnya.'
  rationale: Teks Ibrani memakai akhiran maskulin tunggal. Bentuk '-nya' mengikuti bentuk sumber dan memungkinkan Israel dipahami secara kolektif tanpa memasukkan implikasi doktrinal tambahan.
- issue: Makna כּוֹשֵׁל
  choice: Memakai gambaran konkret 'yang tersandung'.
  alternative: '''yang lemah'' atau ''yang terhuyung''.'
  rationale: Kata ini mencakup tindakan tersandung atau terhuyung serta keadaan lemah. Teks utama mempertahankan gambarannya, sedangkan catatan kaki menjaga alternatif leksikal yang relevan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang tetap jelas. 'Suku-sukunya' mempertahankan akhiran tunggal kolektif Ibrani, sedangkan catatan kaki menjaga rentang makna כּוֹשֵׁל.
