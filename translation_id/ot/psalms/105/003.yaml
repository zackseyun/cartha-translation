  text: הִֽ֭תְהַלְלוּ בְּ/שֵׁ֣ם קָדְשׁ֑/וֹ יִ֝שְׂמַ֗ח לֵ֤ב מְבַקְשֵׁ֬י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/003.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: id
  text: Bermegahlah dalam nama-Nya yang kudus[a]; biarlah hati orang-orang yang mencari Yahweh bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bersukarialah dalam nama-Nya yang kudus.” Kata kerja Ibrani ini dapat berarti beria-ria atau menjadikan sesuatu sebagai dasar kebanggaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Bermegahlah
  rationale: Bentuk imperatif jamak hitpael dari הלל di sini menyatakan beria-ria atau menjadikan seseorang/sesuatu sebagai dasar kebanggaan. “Bermegahlah” mempertahankan nuansa refleksif dan cocok dengan objek perjanjian, yaitu nama-Nya yang kudus.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: dalam nama-Nya yang kudus
  rationale: Preposisi ב diterjemahkan secara wajar sebagai “dalam”. Ungkapan “nama-Nya” dipertahankan karena menunjuk pada nama sekaligus karakter dan reputasi yang dinyatakan-Nya, tanpa menguraikan maknanya di dalam teks.
- source_word: יִשְׂמַח
  choice: biarlah ... bersukacita
  rationale: Walaupun secara morfologis merupakan bentuk imperfek orang ketiga tunggal, dalam konteks puitis ini bentuk tersebut paling wajar dipahami sebagai harapan atau ajakan, sejajar dengan imperatif sebelumnya.
- source_word: לֵב
  choice: hati
  rationale: Bentuk tunggal kolektif dipertahankan. Dalam bahasa Indonesia, “hati orang-orang” alami dan mencakup batin atau pusat kehendak, bukan hanya perasaan.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: orang-orang yang mencari Yahweh
  rationale: Partisipel dalam bentuk konstruksi menggambarkan orang-orang yang dicirikan oleh tindakan terus mencari Yahweh. Susunan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan merupakan transliterasi ilmiah yang umum tanpa menggantinya dengan gelar.
- issue: Nuansa positif dari tindakan bermegah
  choice: Bermegah dalam nama-Nya yang kudus
  alternative: Membanggakan diri atau bersukaria dalam nama-Nya yang kudus
  rationale: Dalam konteks pujian, dasar kemegahan bukan diri manusia, melainkan nama Allah. Terjemahan ini mempertahankan ketegangan leksikal kata Ibrani tanpa memberinya konotasi kesombongan diri.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Bentuk “nama-Nya” mengikuti konvensi penghormatan dalam tulisan keagamaan Indonesia; “hati orang-orang” mempertahankan bentuk kolektif Ibrani secara alami.
