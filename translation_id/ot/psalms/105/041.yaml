  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: id
  text: Ia membuka batu cadas, lalu air memancar keluar; air itu mengalir melalui tempat-tempat gersang seperti sungai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bagian akhirnya berbunyi, “air itu mengalir di tempat-tempat gersang—sungai.” Kata “seperti” tidak tersurat dalam bahasa Ibrani; kata “sungai” dapat dipahami secara predikatif atau aposisional.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: membuka
  rationale: Makna dasarnya adalah ‘membuka’. Pilihan ini mempertahankan gambaran Ibrani tanpa memperkuatnya menjadi ‘membelah’ atau ‘memecahkan’.
- source_word: צוּר
  choice: batu cadas
  rationale: Kata ini menunjuk pada batu besar atau cadas. Bahasa Indonesia tidak memiliki artikel tertentu, tetapi konteks tetap mengarahkan pembaca kepada batu yang dikenal dalam kisah perjalanan Israel di padang gurun.
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: lalu air memancar keluar
  rationale: Verba ini menggambarkan air yang mengalir atau keluar. ‘Memancar keluar’ menyampaikan kemunculan air dari batu secara hidup dan wajar dalam bahasa Indonesia, tanpa menentukan mekanisme yang tidak dinyatakan teks.
- source_word: הָלְכוּ
  choice: air itu mengalir
  rationale: Secara harfiah berarti ‘mereka berjalan/pergi’, dengan ‘air’ sebagai subjek gramatikal jamak dalam bahasa Ibrani. Dalam bahasa Indonesia, pengulangan ‘air itu’ memperjelas acuan dan ‘mengalir’ menyampaikan gerak air secara alami.
- source_word: בַּצִּיּוֹת
  choice: melalui tempat-tempat gersang
  rationale: Nomina ini berarti kawasan-kawasan kering atau gersang. ‘Melalui’ sesuai dengan gambaran air yang bergerak melintasi kawasan tersebut, sedangkan ‘tempat-tempat gersang’ tidak mempersempit artinya menjadi gurun tertentu.
- source_word: נָהָר
  choice: seperti sungai
  rationale: Kata ‘sungai’ berdiri tanpa penanda perbandingan dalam bahasa Ibrani dan dapat dipahami secara predikatif atau aposisional. Penambahan ‘seperti’ menghasilkan perbandingan yang alami dalam bahasa Indonesia; bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan kepada pemeliharaan Allah bagi Israel di padang gurun
  choice: Menerjemahkannya sebagai uraian historis-puitis tentang Allah yang mendatangkan air dari batu bagi Israel.
  alternative: Memahaminya terutama sebagai metafora umum tentang pemeliharaan ilahi.
  rationale: Mazmur ini menuturkan kembali sejarah Israel. Karena itu, peristiwa di padang gurun menjadi makna utama, sementara makna teologis yang lebih luas dibiarkan tersirat.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Paralelisme puitis dipertahankan dengan dua klausa yang dipisahkan tanda titik koma; pengulangan ‘air itu’ memperjelas subjek tanpa meniru bentuk jamak gramatikal bahasa Ibrani secara kaku.
