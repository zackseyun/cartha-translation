  text: עַד עֵ֥ת בֹּֽא דְבָר֑/וֹ אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: id
  text: Sampai saat perkataannya menjadi kenyataan,[a] firman Yahweh menguji dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Perkataannya'' mungkin merujuk pada perkataan atau ramalan Yusuf yang kemudian menjadi kenyataan; sebagian orang memahaminya sebagai firman Allah mengenai Yusuf.'
    reason: alternative_reading
  - marker: b
    text: Atau, "firman Yahweh memurnikan dia." Kata Ibrani yang digunakan menggambarkan logam yang dimurnikan, dan secara kiasan berarti diuji atau dibuktikan mutunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד עֵת
  choice: Sampai saat
  rationale: Ungkapan temporal ini menunjukkan berlangsungnya keadaan hingga suatu waktu tertentu, tanpa harus menambahkan gagasan 'yang ditetapkan' yang tidak dinyatakan secara eksplisit.
- source_word: בֹּא
  choice: menjadi kenyataan
  rationale: Secara harfiah berarti 'datang', tetapi dengan subjek 'perkataan' konteksnya menunjuk pada perkataan yang terlaksana atau terbukti benar. Ungkapan ini alami dalam bahasa Indonesia.
- source_word: דְבָרוֹ
  choice: perkataannya
  rationale: Mempertahankan sufiks orang ketiga yang ambigu. Dalam konteks, ini kemungkinan besar perkataan atau ramalan Yusuf, tetapi dapat pula dipahami sebagai firman Allah mengenai Yusuf.
- source_word: אִמְרַת יְהוָה
  choice: firman Yahweh
  rationale: אִמְרָה menunjuk pada ucapan atau firman; nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' agar nama pribadi dalam teks sumber tetap terlihat.
- source_word: צְרָפָתְהוּ
  choice: menguji dia
  rationale: Kata kerja צרף secara harfiah menggambarkan pemurnian logam dan secara metaforis berarti menguji atau membuktikan mutu seseorang. 'Menguji' menyampaikan maknanya dengan jelas, sedangkan citra pemurnian dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Rujukan sufiks pada דְבָרוֹ ('perkataannya')
  choice: Dibiarkan dalam teks sebagai 'perkataannya', yang dalam konteks paling mungkin merujuk pada perkataan atau ramalan Yusuf.
  alternative: Firman Allah mengenai Yusuf.
  rationale: Bentuk Ibraninya tidak secara eksplisit menetapkan pemilik perkataan itu. Terjemahan utama mempertahankan ambiguitas gramatikal, dan catatan kaki menyajikan kedua pemahaman tanpa menetapkan salah satunya secara dogmatis.
- issue: Hubungan firman Yahweh dengan penderitaan Yusuf
  choice: Firman Yahweh 'menguji' Yusuf.
  alternative: Firman Yahweh 'memurnikan' Yusuf.
  rationale: Metafora pemurnian dapat menggambarkan ujian yang membuktikan atau membentuk mutu seseorang. Teks utama memakai istilah yang mudah dipahami, sementara citra sumber dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. 'Menjadi kenyataan' dipilih agar idiom perkataan yang 'datang' dipahami secara alami. 'Firman' digunakan khusus pada klausa kedua untuk אִמְרַת יְהוָה, sedangkan 'perkataan' pada klausa pertama membantu mempertahankan pembedaan leksikal dan ambiguitas rujukannya.
