  source_fidelity: 'Teks Indonesia dengan tepat mengikuti struktur dan makna Ibrani: Allah berbicara, belalang datang, kemudian disebut יֶלֶק dalam jumlah tak terhitung. “Belalang” wajar untuk nomina kolektif אַרְבֶּה, sedangkan “belalang pelahap” mempertahankan sifat pemakan/pemusnah tanaman dari יֶלֶק tanpa terlalu memastikan tahap hidup atau spesiesnya.'
