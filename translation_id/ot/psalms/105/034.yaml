  yaml_path: translation/ot/psalms/105/034.yaml
  text: He spoke[a], and locusts came—young locusts without number.
translation:
  language: id
  text: Ia berfirman, lalu datanglah belalang dan belalang pelahap yang tak terhitung banyaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Istilah Ibrani יֶלֶק menunjuk pada serangga pemakan tanaman, kemungkinan belalang pada tahap pertumbuhan atau dari jenis tertentu. Terjemahan lain: “belalang muda”; terjemahan lama kadang-kadang memakai “ulat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Ia berfirman
  rationale: Kata kerja ini berarti berkata atau berbicara. Dalam konteks tindakan Allah, “berfirman” alami dan bermartabat, sekaligus tidak menambahkan nuansa eksplisit “memerintahkan” yang tidak dinyatakan oleh bentuk Ibrani.
- source_word: וַיָּבֹא
  choice: lalu datanglah
  rationale: Bentuk naratif dari בוא menyatakan datangnya tulah. “Lalu datanglah” mempertahankan urutan tindakan dan cocok dengan gaya puitis.
- source_word: אַרְבֶּה
  choice: belalang
  rationale: Walaupun bentuknya tunggal, kata ini berfungsi sebagai nomina kolektif yang mengacu pada kawanan belalang.
- source_word: יֶלֶק
  choice: belalang pelahap
  rationale: Istilah ini menunjuk pada serangga pemakan tanaman yang terkait dengan tulah belalang, mungkin tahap atau jenis belalang tertentu. “Belalang pelahap” mempertahankan hubungan leksikal dengan tindakan melahap tanpa memastikan tahap pertumbuhannya.
- source_word: וְאֵין מִסְפָּר
  choice: yang tak terhitung banyaknya
  rationale: Ungkapan harfiahnya menyatakan bahwa tidak ada bilangannya; pilihan ini menyampaikan idiom tersebut secara alami dan puitis dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas. “Ia” merujuk kepada Allah dari konteks mazmur; “berfirman” dipakai secara wajar untuk perkataan Allah. Penanda catatan kaki ditempatkan setelah seluruh klausa yang dijelaskannya.
