  text: שָׁ֭לַח מֹשֶׁ֣ה עַבְדּ֑/וֹ אַ֝הֲרֹ֗ן אֲשֶׁ֣ר בָּֽחַר בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/026.yaml
  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: id
  text: Ia mengutus Musa, hamba-Nya, dan Harun yang telah dipilih-Nya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang dipilih-Nya.” Kata kerja Ibrani dapat diterjemahkan sebagai bentuk lampau sederhana; “telah dipilih-Nya” memperjelas bahwa Harun dipilih sebelum ia diutus.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: Ia mengutus
  rationale: Bentuk Qal perfektum orang ketiga tunggal maskulin dari שלח menyatakan tindakan mengutus. Subjeknya tersirat dan, berdasarkan konteks mazmur, merujuk kepada Allah; “Ia mengutus” mempertahankan alur Ibrani tanpa menambahkan nama ilahi yang tidak tertulis dalam ayat ini.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Menggunakan bentuk baku nama ini dalam tradisi dan bahasa Indonesia modern.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: עֶבֶד dengan sufiks orang ketiga tunggal maskulin dapat berarti hamba atau budak. Dalam konteks kehormatan dan pelayanan Musa kepada Allah, “hamba-Nya” paling tepat dan alami.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Menggunakan bentuk baku nama ini dalam bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini memperkenalkan klausa yang menerangkan Harun; “yang” merupakan padanan Indonesia yang alami.
- source_word: בָּחַר בּוֹ
  choice: yang telah dipilih-Nya
  rationale: בחר dengan preposisi ב menyatakan pemilihan seseorang, dan sufiks pada בו merujuk kepada Harun. Bentuk pasif Indonesia dengan sufiks pelaku “-Nya” terdengar alami, sedangkan “telah” menyatakan bahwa pemilihan itu mendahului pengutusan.
theological_decisions:
- issue: Subjek tersirat pada kata kerja
  choice: Menggunakan “Ia” dengan rujukan kepada Allah, tanpa mengulang “TUHAN”.
  alternative: Menambahkan subjek eksplisit “TUHAN”.
  rationale: Teks Ibrani hanya memuat subjek orang ketiga tunggal yang dipahami dari konteks. “Ia” mempertahankan kesinambungan wacana dan tidak menambahkan nomina ilahi yang tidak terdapat dalam ayat.
- issue: Hubungan Musa dan Harun sebagai objek pengutusan
  choice: Menambahkan “dan” untuk menghubungkan Musa dan Harun sebagai dua orang yang diutus.
  alternative: 'Mempertahankan penjajaran tanpa konjungsi: “Musa, hamba-Nya, Harun …”.'
  rationale: Teks Ibrani menjajarkan kedua nama tanpa konjungsi. Dalam bahasa Indonesia, “dan” diperlukan agar daftar dua objek itu jelas dan alami tanpa mengubah siapa yang diutus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “-Nya” mengikuti kebiasaan Indonesia ketika pronomina merujuk kepada Allah. Susunan kalimat dibuat alami dengan tetap mempertahankan subjek tersirat, gelar kehormatan Musa, dan urutan tindakan dalam teks Ibrani.
