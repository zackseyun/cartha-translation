  text: הָפַ֣ךְ לִ֭בָּ/ם לִ/שְׂנֹ֣א עַמּ֑/וֹ לְ֝/הִתְנַכֵּ֗ל בַּ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/025.yaml
  text: He turned their heart to hate his people[b][a], to deal deceitfully with his servants.
translation:
  language: id
  text: Ia mengubah hati mereka sehingga mereka membenci umat-Nya dan bertindak licik terhadap hamba-hamba-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk membenci umat-Nya dan memperdaya hamba-hamba-Nya.”'
    reason: Bahasa Ibrani memungkinkan infinitif tersebut dipahami sebagai tujuan, dan לְהִתְנַכֵּל juga dapat berarti bertindak dengan tipu muslihat atau memperdaya.
lexical_decisions:
- source_word: הָפַךְ
  choice: mengubah
  rationale: Kata kerja ini berarti membalikkan atau mengubah. Dalam kaitannya dengan hati dan dua bentuk infinitif berikutnya, “mengubah” menyampaikan tindakan ilahi secara langsung dan alami dalam bahasa Indonesia.
- source_word: לִבָּם
  choice: hati mereka
  rationale: Bentuk Ibraninya memakai nomina tunggal dengan akhiran jamak, suatu ungkapan kolektif. Bahasa Indonesia secara alami mempertahankan bentuk “hati mereka” tanpa harus mengubahnya menjadi jamak.
- source_word: לִשְׂנֹא
  choice: sehingga mereka membenci
  rationale: Infinitif ini dapat menyatakan hasil atau tujuan. “Sehingga mereka membenci” memperjelas hubungan sintaksis dengan perubahan hati, tanpa menentukan bahwa hasil adalah satu-satunya kemungkinan semantis.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עם menunjuk kepada suatu kelompok bangsa, dan dalam konteks ini kepada Israel sebagai umat milik TUHAN. “Umat-Nya” adalah padanan Indonesia yang alami dan sesuai konteks perjanjian.
- source_word: לְהִתְנַכֵּל
  choice: bertindak licik terhadap
  rationale: Bentuk hitpael dari נכל mengandung gagasan bertindak dengan kelicikan, tipu muslihat, atau siasat jahat. “Bertindak licik terhadap” mempertahankan unsur permusuhan dan kelicikannya.
- source_word: בַּעֲבָדָיו
  choice: terhadap hamba-hamba-Nya
  rationale: Preposisi ב setelah verba ini menyatakan sasaran tindakan, sehingga “terhadap” idiomatis dalam bahasa Indonesia. עבד diterjemahkan “hamba” karena konteks menekankan Israel sebagai para hamba Allah, bukan status perbudakan mereka.
theological_decisions:
- issue: Tindakan ilahi dalam perubahan sikap hati Mesir
  choice: Mempertahankan pernyataan langsung “Ia mengubah hati mereka”
  alternative: “Ia membiarkan hati mereka berubah” atau bentuk pasif “Hati mereka berubah”
  rationale: Teks Ibrani memakai verba aktif orang ketiga tunggal, dengan Allah sebagai subjek tersirat dari konteks. Terjemahan tidak melunakkan tindakan ilahi dan tetap mempertahankan ketegangan antara kedaulatan Allah dan permusuhan manusia.
- issue: Hubungan infinitif לִשְׂנֹא dengan verba utama
  choice: 'Menerjemahkannya sebagai hasil: “sehingga mereka membenci”'
  alternative: 'Menerjemahkannya sebagai tujuan: “untuk membenci”'
  rationale: Konstruksi Ibrani dapat mengandung nuansa hasil atau tujuan. Dalam bahasa Indonesia, “sehingga” paling alami setelah “mengubah hati mereka”, tetapi catatan kaki mempertahankan kemungkinan tujuan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Bentuk kolektif Ibrani “hati mereka” dipertahankan secara alami.
