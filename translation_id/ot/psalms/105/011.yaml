  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: id
  text: dengan berkata, “Kepadamu akan Kuberikan tanah Kanaan, bagian[a] warisan kalian[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tali pengukur warisan kalian”; kata Ibrani untuk “tali” dapat digunakan secara kiasan untuk bagian tanah yang ditetapkan.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani beralih dari “kepadamu” dalam bentuk tunggal ke “kalian” dalam bentuk jamak, kemungkinan karena Abraham disapa sebagai wakil keturunannya.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: firman-Nya
  rationale: Bentuk infinitif ini memperkenalkan kutipan janji ilahi yang melanjutkan ayat sebelumnya. Dalam konteks mazmur ini, “firman-Nya” merupakan penghubung yang alami dan bermartabat.
- source_word: לְךָ
  choice: kepadamu
  rationale: Bentuk orang kedua maskulin tunggal dipertahankan untuk sapaan langsung kepada Abraham.
- source_word: אֶתֵּן
  choice: akan Kuberikan
  rationale: Bentuk imperfek orang pertama tunggal menyatakan janji yang berorientasi ke masa depan. Kapitalisasi pada “Ku-” menandai bahwa pembicaranya adalah Allah.
- source_word: אֶרֶץ כְּנָעַן
  choice: tanah Kanaan
  rationale: Frasa ini menunjuk wilayah Kanaan; “tanah Kanaan” jelas dan lazim dalam bahasa Indonesia modern.
- source_word: חֶבֶל
  choice: bagian
  rationale: Secara harfiah kata ini dapat berarti tali pengukur, tetapi dalam konteks pembagian tanah menunjuk pada bagian atau jatah tanah yang ditetapkan.
- source_word: נַחֲלַתְכֶם
  choice: yang menjadi milik pusaka kalian
  rationale: “Milik pusaka” mempertahankan nuansa kepemilikan yang diwariskan atau dianugerahkan, sedangkan “kalian” secara eksplisit mempertahankan akhiran orang kedua jamak dalam bahasa Ibrani.
theological_decisions:
- issue: Peralihan dari sapaan tunggal kepada bentuk kepunyaan jamak dalam janji
  choice: Mempertahankan “kepadamu” (tunggal dalam sumber) dan “kalian” (jamak) tanpa menyelaraskannya
  alternative: Menggunakan “kepadamu ... milik pusakamu” atau menjelaskan langsung “milik pusaka keturunanmu”
  rationale: Teks Ibrani beralih dari sapaan tunggal kepada Abraham ke bentuk kepunyaan jamak, kemungkinan dengan Abraham sebagai wakil keturunannya. Terjemahan mempertahankan ketegangan ini dan tidak menambahkan penafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Susunan aposisional dipertahankan tanpa menambahkan kata “sebagai”. Perbedaan tunggal-jamak dalam bahasa sumber dibuat nyata melalui catatan kaki dan pilihan “kalian”.
