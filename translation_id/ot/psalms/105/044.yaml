  source_fidelity: 'Draf pada dasarnya mengikuti dua klausa Ibrani dengan baik: Allah memberi negeri-negeri, lalu umat itu mewarisi/mengambil milik jerih payah pihak lain. Namun, “hasil jerih payah” memilih perluasan metonimis עָמָל sebagai teks utama, padahal kata Ibrani itu sendiri terutama berarti kerja keras/jerih payah. Selain itu, “suku-suku bangsa” mempersempit לְאֻמִּים menjadi subkelompok etnis, sementara istilah itu secara lebih umum berarti bangsa-bangsa/kaum-kaum.'
  naturalness: Susunan kalimatnya alami dan baku. “Negeri-negeri milik bangsa-bangsa” dapat dipahami, tetapi “negeri-negeri bangsa-bangsa” lebih langsung dan cukup menyatakan hubungan konstruksi Ibrani. Pengulangan “bangsa-bangsa” dalam ayat yang singkat tetap alami dan lebih tepat daripada membedakan istilah dengan nuansa yang tidak dituntut sumber.
  terminology: “Mewarisi” merupakan pilihan yang baik untuk יִירָשׁוּ dan mempertahankan nuansa penerimaan melalui pemberian Allah. “Jerih payah” paling dekat dengan עָמָל; kemungkinan makna hasil dari kerja itu sebaiknya ditempatkan dalam catatan kaki sebagai alternatif. “Bangsa-bangsa” sesuai untuk baik גּוֹיִם maupun לְאֻמִּים tanpa memasukkan pembatasan “suku.”
  issues:
