base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
translation:
  language: id
  text: Ia memberikan kepada mereka negeri-negeri bangsa-bangsa, dan mereka mewarisi jerih payah bangsa-bangsa itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hasil jerih payah bangsa-bangsa itu.” Kata Ibrani yang digunakan dapat menunjuk pada jerih payah itu sendiri atau pada hasil yang diperoleh melalui jerih payah tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia memberikan
  rationale: Bentuk Qal wayyiqtol dari נתן menyatakan tindakan lampau dalam alur kisah. Kata ganti “Ia” merujuk kepada TUHAN dari konteks mazmur.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Akhiran pronominal orang ketiga jamak berfungsi sebagai objek tak langsung dan secara alami diterjemahkan “kepada mereka”.
- source_word: אַרְצוֹת גּוֹיִם
  choice: negeri-negeri milik bangsa-bangsa
  rationale: “Negeri-negeri” mempertahankan bentuk jamak אַרְצוֹת, sedangkan “milik” memperjelas hubungan konstruksi secara alami dalam bahasa Indonesia. גּוֹיִם di sini menunjuk pada bangsa-bangsa dalam konteks wilayah, bukan secara khusus kategori keagamaan.
- source_word: וַעֲמַל
  choice: hasil jerih payah
  rationale: עָמָל dapat menunjuk pada jerih payah itu sendiri atau, secara metonimis, hasil yang diperoleh darinya. “Hasil jerih payah” menghasilkan kalimat Indonesia yang alami bersama verba “mewarisi”, sementara ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: לְאֻמִּים
  choice: suku-suku bangsa
  rationale: לְאֻמִּים menunjuk pada kelompok-kelompok masyarakat atau bangsa. Pilihan ini membedakannya dari גּוֹיִם pada klausa pertama tanpa mengubah makna kolektifnya.
- source_word: יִירָשׁוּ
  choice: mereka mewarisi
  rationale: Bentuk Qal dari ירש dapat berarti mewarisi, memiliki, atau mengambil alih. “Mewarisi” sesuai dengan konteks pemberian ilahi dan tetap berada dalam cakupan makna kata Ibrani.
theological_decisions:
- issue: Nuansa pemberian ilahi dalam ירש
  choice: mereka mewarisi
  alternative: mereka mengambil alih / menguasai
  rationale: Konteks menyatakan bahwa Allah memberikan negeri-negeri itu kepada umat-Nya. “Mewarisi” mempertahankan nuansa bahwa kepemilikan tersebut diterima sebagai pemberian, tanpa menyangkal bahwa ירש juga dapat menyatakan tindakan mengambil alih atau menguasai.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan bentuk jamak dipertahankan bila penting bagi teks sumber, sedangkan hubungan konstruksi diperjelas dengan “milik”. Catatan kaki mempertahankan keluasan makna עָמָל yang tidak dapat seluruhnya ditampilkan dalam satu frasa utama.
