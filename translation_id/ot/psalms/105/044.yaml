    issue: Teks utama menerjemahkan עָמָל sebagai “hasil jerih payah.”
    rationale: Pilihan ini sah sebagai kemungkinan kontekstual, tetapi menghilangkan arti dasar “jerih payah/kerja keras” dari teks utama. Karena makna leksikalnya terbuka, arti dasar sebaiknya dipertahankan dan perluasan metonimis dicatat sebagai alternatif.
  - severity: low
    issue: לְאֻמִּים diterjemahkan “suku-suku bangsa.”
    rationale: Istilah Ibrani ini menunjuk bangsa-bangsa atau kaum-kaum secara umum; “suku-suku” dapat mengesankan unit yang lebih sempit. Tidak perlu memaksakan pembedaan terminologis dari גּוֹיִם dalam bahasa Indonesia.
  - severity: low
    issue: Catatan kaki menyebut “Secara harfiah” sementara teks utama sudah memakai “hasil jerih payah.”
    rationale: Catatan tersebut menjadi lebih jelas bila teks utama memakai “jerih payah” dan catatan kaki menyajikan “hasil jerih payah” sebagai terjemahan alternatif.
