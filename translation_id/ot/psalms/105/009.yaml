  text: אֲשֶׁ֣ר כָּ֭רַת אֶת אַבְרָהָ֑ם וּ/שְׁב֖וּעָת֣/וֹ לְ/יִשְׂחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/009.yaml
  text: which he made with Abraham[a], and his oath to Isaac,
translation:
  language: id
  text: yang dibuat-Nya dengan Abraham[a], dan sumpah-Nya kepada Ishak,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “yang dipotong-Nya dengan Abraham,” suatu ungkapan untuk membuat perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata relatif ini menghubungkan ayat dengan “perjanjian” pada ayat sebelumnya; “yang” mempertahankan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: כָּרַת
  choice: dibuat-Nya
  rationale: Dalam konteks perjanjian, כָּרַת merupakan bagian dari ungkapan harfiah “memotong perjanjian.” Karena objek “perjanjian” tersirat dari ayat sebelumnya, “dibuat-Nya” menyampaikan makna idiomatisnya dengan wajar.
- source_word: אֶת אַבְרָהָם
  choice: dengan Abraham
  rationale: אֶת menandai Abraham sebagai objek dalam konstruksi Ibrani, tetapi bahasa Indonesia secara alami menyatakan relasi pihak dalam pembuatan perjanjian dengan preposisi “dengan.”
- source_word: וּשְׁבוּעָתוֹ
  choice: dan sumpah-Nya
  rationale: Terjemahan ini mempertahankan bentuk nomina שְׁבוּעָה dan sufiks orang ketiga maskulin tunggal yang merujuk kepada Allah.
- source_word: לְיִשְׂחָק
  choice: kepada Ishak
  rationale: Preposisi לְ menandai orang yang menjadi tujuan atau penerima sumpah; “kepada Ishak” merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Kata “perjanjian” tersirat dari ayat sebelumnya
  choice: yang dibuat-Nya dengan Abraham
  alternative: yang dipotong-Nya dengan Abraham; yang dibuat-Nya kepada Abraham
  rationale: Teks Ibrani tidak mengulangi kata “perjanjian,” tetapi membawanya dari ayat sebelumnya. Terjemahan ini mempertahankan keterkaitan itu tanpa memasukkan ungkapan harfiah yang tidak alami dalam bahasa Indonesia atau mengubah relasi perjanjian menjadi sekadar pernyataan satu arah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina terikat “-Nya” memperjelas bahwa pelakunya adalah Allah. Tanda koma dipertahankan karena ayat ini merupakan lanjutan sintaksis dari ayat sebelumnya dan berlanjut ke ayat berikutnya.
