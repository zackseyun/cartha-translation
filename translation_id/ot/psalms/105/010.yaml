id: PSA.105.10
reference: Psalms 105:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּֽעֲמִידֶ֣/הָ לְ/יַעֲקֹ֣ב לְ/חֹ֑ק לְ֝/יִשְׂרָאֵ֗ל בְּרִ֣ית עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/010.yaml
  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
translation:
  language: id
  text: Ia menetapkannya bagi Yakub sebagai ketetapan[a], bagi Israel sebagai perjanjian untuk selama-lamanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meneguhkannya ... sebagai suatu ketetapan.” Kata kerja Ibrani dapat berarti membuat sesuatu berdiri teguh, menetapkan, atau meneguhkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai perjanjian kekal” atau “sebagai perjanjian yang tetap berlaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Ia menetapkannya
  rationale: Bentuk Hifil dari עמד berarti membuat sesuatu berdiri teguh, sehingga dalam konteks janji perjanjian dapat diterjemahkan 'menetapkan' atau 'meneguhkan'. 'Menetapkannya' alami dalam bahasa Indonesia dan mempertahankan daya kausatif serta nuansa pengukuhan.
- source_word: לְיַעֲקֹב
  choice: bagi Yakub
  rationale: Preposisi לְ menandai penerima atau pihak yang mendapat manfaat. 'Bagi Yakub' terdengar alami dalam bahasa Indonesia.
- source_word: לְחֹק
  choice: sebagai ketetapan
  rationale: חֹק menunjuk pada sesuatu yang ditentukan atau ditetapkan. 'Ketetapan' mempertahankan nuansa resmi dan legal dalam konteks perjanjian.
- source_word: לְיִשְׂרָאֵל
  choice: bagi Israel
  rationale: Sejajar dengan 'bagi Yakub' dan mempertahankan kesejajaran puisi Ibrani.
- source_word: בְּרִית עוֹלָם
  choice: sebagai perjanjian untuk selama-lamanya
  rationale: בְּרִית adalah istilah baku untuk perjanjian, sedangkan עוֹלָם di sini menyatakan keberlangsungan tanpa batas yang dipandang. Ungkapan ini jelas, alami, dan tetap menjaga bobot teologis teks.
theological_decisions:
- issue: Acuan akhiran feminin pada וַיַּעֲמִידֶהָ
  choice: Diterjemahkan dengan akhiran '-nya' tanpa menentukan secara lebih sempit apakah acuannya adalah perjanjian, firman yang diperintahkan, atau sumpah dalam konteks sebelumnya.
  alternative: Menyebut secara eksplisit 'janji itu' atau 'sumpah itu'.
  rationale: Konteks dekat menyebut perjanjian, firman, dan sumpah Allah. Bentuk '-nya' mempertahankan rujukan anaforis dan ambiguitas asli tanpa memaksakan satu nomina tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kesejajaran 'bagi Yakub ... bagi Israel' dipertahankan, sedangkan susunan kalimat dibuat alami bagi pembaca umum.
