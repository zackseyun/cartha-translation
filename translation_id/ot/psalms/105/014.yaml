  text: לֹֽא הִנִּ֣יחַ אָדָ֣ם לְ/עָשְׁקָ֑/ם וַ/יּ֖וֹכַח עֲלֵי/הֶ֣ם מְלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/014.yaml
  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
translation:
  language: id
  text: Ia tidak membiarkan seorang pun menindas mereka; Ia menegur raja-raja demi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena mereka” atau “mengenai mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנִּיחַ
  choice: membiarkan
  rationale: Dalam bentuk kausatif dan diikuti infinitif, kata ini menyatakan bahwa Allah tidak mengizinkan tindakan itu terjadi. “Membiarkan” alami dalam bahasa Indonesia dan cocok dengan konstruksi “menindas mereka”.
- source_word: אָדָם
  choice: seorang pun
  rationale: Nomina tunggal ini dipakai secara generik untuk siapa saja. Dalam kalimat negatif, “seorang pun” menyampaikan cakupan universalnya secara alami tanpa membatasi rujukan pada laki-laki.
- source_word: לְעָשְׁקָם
  choice: menindas mereka
  rationale: Kata עשׁק mencakup tindakan menekan, memperlakukan secara tidak adil, atau memeras. “Menindas” mempertahankan daya maknanya yang luas dalam konteks perlakuan bermusuhan.
- source_word: וַיּוֹכַח
  choice: Ia menegur
  rationale: Dalam konteks ini יכח menyatakan teguran atau kecaman terhadap para penguasa. “Menegur” ringkas, kuat, dan wajar dalam bahasa Indonesia.
- source_word: עֲלֵיהֶם
  choice: demi mereka
  rationale: Preposisi על dengan sufiks di sini menunjukkan bahwa teguran itu dilakukan berkenaan dengan atau untuk kepentingan para leluhur tersebut. “Demi mereka” wajar dan mempertahankan nuansa relasional, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Nomina ini secara langsung berarti para raja; tidak perlu diperluas menjadi istilah yang lebih umum seperti “penguasa-penguasa”.
