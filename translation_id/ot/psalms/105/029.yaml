  text: He turned their waters to blood and caused their fish to die[a].
translation:
  language: id
  text: Ia mengubah perairan mereka menjadi darah dan menyebabkan ikan-ikan mereka mati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפַךְ
  choice: mengubah
  rationale: Dalam konteks tulah, verba ini menyatakan perubahan keadaan; “mengubah” alami dalam bahasa Indonesia dan tetap dekat dengan makna Ibrani.
- source_word: מֵימֵיהֶם
  choice: perairan mereka
  rationale: Bentuk jamak merujuk secara kolektif pada sumber atau badan air milik mereka; “perairan” mempertahankan cakupan jamak dengan ungkapan Indonesia yang wajar.
- source_word: לְדָם
  choice: menjadi darah
  rationale: Preposisi לְ menandai keadaan hasil; konstruksi Indonesia “mengubah ... menjadi ...” menyatakannya secara alami.
- source_word: וַיָּמֶת
  choice: dan menyebabkan ... mati
  rationale: Bentuk Hifil bersifat kausatif, sehingga “menyebabkan ... mati” mempertahankan nuansa bahwa tindakan-Nya mendatangkan kematian ikan.
- source_word: דְּגָתָם
  choice: ikan-ikan mereka
  rationale: Nomina ini menunjuk ikan secara kolektif; bentuk ulang jelas dan alami untuk menyatakan kumpulan ikan dalam bahasa Indonesia.
