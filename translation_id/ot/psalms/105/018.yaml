translation:
  language: id
  text: 'Mereka menghimpit kakinya dengan belenggu;

    jiwanya masuk ke dalam besi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini sulit. Secara harfiah, “jiwanya masuk ke dalam besi.” Kata yang diterjemahkan “jiwa” juga dapat menunjuk pada diri atau orang seutuhnya dan, dalam konteks ini, mungkin pada leher atau tenggorokan. Jadi, baris ini dapat berarti bahwa lehernya dipasangi kerah atau rantai besi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנּוּ
  choice: Mereka menyiksa
  rationale: Bentuk Piel dari ענה menyatakan tindakan menindas atau menyengsarakan. Dalam konteks pemenjaraan Yusuf, “menyiksa” menyampaikan penderitaan yang dikenakan kepadanya tanpa menentukan siapa para pelakunya selain subjek jamak tak tentu dalam bahasa Ibrani.
- source_word: בַכֶּבֶל
  choice: dengan belenggu
  rationale: כבל berarti belenggu atau rantai pengekang. Preposisi ב di sini paling wajar dipahami sebagai alat yang digunakan untuk menyiksa atau mengekang.
- source_word: רַגְלָיו
  choice: kakinya
  rationale: Kata ini secara langsung menunjuk pada kedua kaki Yusuf dan sesuai dengan gambaran pembelengguan.
- source_word: בַּרְזֶל
  choice: ke dalam besi
  rationale: בַּרְזֶל secara harfiah berarti “besi”. Teks tidak secara eksplisit menyebut kerah atau rantai, sehingga unsur “besi” dipertahankan dalam teks utama.
- source_word: בָּאָה
  choice: masuk
  rationale: Bentuk feminin tunggal dari בוא sesuai secara gramatikal dengan נַפְשׁוֹ sebagai subjek. Karena itu, susunannya dipahami sebagai “jiwanya masuk”, bukan “besi mendatangi jiwanya”.
- source_word: נַפְשׁוֹ
  choice: jiwanya
  rationale: נפש dapat berarti jiwa, nyawa, diri, atau orang seutuhnya, dan dalam konteks tertentu berkaitan dengan leher atau tenggorokan. “Jiwanya” mempertahankan citra puitis serta ketegangan leksikal teks Ibrani; kemungkinan makna konkretnya dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas. Paralelisme dua larik dipertahankan. Ungkapan yang tidak biasa “jiwanya masuk ke dalam besi” sengaja dipertahankan karena mengikuti tata bahasa dan citra teks Ibrani, sedangkan penafsiran yang lebih konkret ditempatkan dalam catatan kaki.
