translation:
  language: id
  text: Mereka mengembara dari bangsa ke bangsa[a], dari satu kerajaan ke bangsa lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka berpindah-pindah dari bangsa ke bangsa, dari satu kerajaan ke bangsa lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: mereka mengembara
  rationale: Bentuk hitpael dari הלך dalam konteks ini menyatakan pergerakan berulang atau berpindah-pindah, bukan satu perjalanan langsung. “Mengembara” menyampaikan nuansa itu secara alami dalam bahasa Indonesia.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: dari bangsa ke bangsa
  rationale: גּוֹי menunjuk pada bangsa atau kelompok etnis. Ungkapan ini mempertahankan pengulangan dan pola ringkas bahasa Ibrani.
- source_word: מִמַּמְלָכָה
  choice: dari satu kerajaan
  rationale: Walaupun tidak ada kata bilangan eksplisit dalam bahasa Ibrani, “satu” membuat pola korelatif “dari satu ... kepada ... lain” jelas dan wajar dalam bahasa Indonesia.
- source_word: אֶל עַם אַחֵר
  choice: kepada bangsa lain
  rationale: עַם berarti suatu bangsa atau kelompok masyarakat, sedangkan אַחֵר berarti “lain”. Pilihan ini alami dalam bahasa Indonesia, meskipun sebagian tumpang tindih dengan terjemahan גּוֹי.
