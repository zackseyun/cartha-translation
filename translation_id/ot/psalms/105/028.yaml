base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: id
  text: Ia mengirimkan kegelapan dan membuatnya menjadi gelap, dan mereka tidak memberontak terhadap firman-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan mereka tidak memberontak terhadap firman-firman-Nya/perintah-Nya.” Bentuk Ibrani secara gramatikal adalah jamak, tetapi dapat dipahami secara kolektif. Subjek “mereka” tidak disebutkan secara eksplisit dalam bahasa Ibrani; sebagian memahaminya sebagai orang Mesir, sedangkan yang lain sebagai Musa dan Harun.
    reason: Mencatat kemungkinan makna kolektif atau jamak dari דבריו serta mempertahankan ketidakjelasan acuan subjek jamak.
lexical_decisions:
- source_word: שָׁלַח
  choice: mengirim
  rationale: Padanan alami bagi verba umum yang berarti mengutus atau mengirim; dalam konteks ini objeknya adalah kegelapan.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Makna langsung nomina tersebut dan istilah yang wajar dalam konteks tulah kegelapan.
- source_word: וַיַּחְשִׁךְ
  choice: menjadikan negeri itu gelap
  rationale: Mempertahankan daya kausatif verba. 'Negeri itu' merupakan pelengkap tersirat yang dibuat eksplisit secara minimal agar kalimat Indonesia alami dalam konteks tulah atas Mesir.
- source_word: וְלֹא
  choice: dan ... tidak
  rationale: Mempertahankan koordinasi sederhana dalam bahasa Ibrani tanpa menambahkan kontras yang lebih kuat.
- source_word: מָרוּ
  choice: memberontak
  rationale: Menyampaikan makna ketidaktaatan atau perlawanan yang terkandung dalam מרה tanpa mempersempitnya menjadi sekadar penolakan.
- source_word: אֶת־דבריו
  choice: terhadap firman-firman-Nya
  rationale: Bentuk tertulisnya berpengertian jamak, 'firman-firman-Nya'; konstruksi dengan מרה secara idiomatis dinyatakan 'memberontak terhadap'.
theological_decisions:
- issue: Acuan subjek tersirat dalam מָרוּ ('mereka tidak memberontak')
  choice: Mempertahankan kata ganti jamak 'mereka' tanpa menyebut siapa yang dimaksud.
  alternative: Menentukan mereka sebagai orang Mesir, atau sebagai Musa dan Harun.
  rationale: Teks Ibrani tidak menyatakan subjek jamak itu secara eksplisit, dan konteks memungkinkan lebih dari satu penafsiran. Terjemahan tidak boleh menutup ambiguitas tersebut.
- issue: Bilangan pada דבריו
  choice: firman-firman-Nya
  alternative: firman-Nya atau perintah-Nya
  rationale: Bentuk Masoret yang tertulis adalah jamak, tetapi secara semantis dapat dipahami secara kolektif atau sebagai perintah ilahi. Teks utama mengikuti bentuk jamak, sedangkan kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Kapitalisasi pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Ungkapan 'negeri itu' ditambahkan sebagai objek kontekstual tersirat agar konstruksi kausatif terbaca alami.
