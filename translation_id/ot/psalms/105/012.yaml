  text: When they were few in number[a], very few, and sojourners in it,
translation:
  language: id
  text: Ketika mereka sedikit jumlahnya, sangat sedikit, dan tinggal sebagai orang asing[a] di negeri itu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pendatang". Istilah Ibrani ini menunjuk orang yang tinggal sebagai orang asing atau penghuni sementara di negeri yang bukan miliknya.
    reason: Menjelaskan nuansa גָּרִים dan menyediakan padanan leksikal alternatif tanpa menghilangkan kelancaran teks utama.
lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: Ketika ... mereka
  rationale: Preposisi ב dengan infinitif konstruk היה dan sufiks orang ketiga jamak membentuk klausa temporal; susunan ini menyampaikan makna tersebut secara alami dalam bahasa Indonesia.
- source_word: מְתֵי מִסְפָּר
  choice: jumlah mereka hanya sedikit
  rationale: Ungkapan Ibrani ini berarti kelompok yang kecil dan dapat dihitung. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada kecilnya jumlah mereka.
- source_word: כִּמְעַט
  choice: sangat sedikit
  rationale: Dalam konteks ini kata tersebut memperkuat gagasan sebelumnya bahwa jumlah mereka kecil.
- source_word: וְגָרִים
  choice: dan mereka tinggal sebagai pendatang
  rationale: Bentuk dari גור menunjuk pada orang yang menetap sebagai orang asing atau penghuni sementara di tanah yang bukan miliknya; frasa verbal ini lebih alami daripada sebutan yang kaku.
- source_word: בָּהּ
  choice: di negeri itu
  rationale: Sufiks feminin tunggal merujuk pada negeri yang disebut dalam konteks. Referennya dibuat eksplisit agar jelas dalam bahasa Indonesia tanpa mengubah maksud.
