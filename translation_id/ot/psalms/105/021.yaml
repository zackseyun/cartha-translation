  yaml_path: translation/ot/psalms/105/021.yaml
  text: He made him lord of his house[a], and ruler over all his possessions.
translation:
  language: id
  text: Ia mengangkatnya menjadi tuan atas rumahnya[a] dan penguasa atas segala miliknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menetapkan dia sebagai kepala rumah tangganya dan penguasa atas semua yang dimilikinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמוֹ
  choice: Ia mengangkatnya menjadi
  rationale: Bentuk Qal perfektum dari שׂים/שׂוּם dengan sufiks objek orang ketiga tunggal berarti ‘ia menempatkan/menetapkan dia’. Dalam konstruksi dengan gelar jabatan, ‘mengangkatnya menjadi’ menyampaikan makna penetapan secara alami dalam bahasa Indonesia.
- source_word: אָדוֹן
  choice: tuan
  rationale: Kata ini menunjuk kepada orang yang memiliki wewenang atas suatu rumah atau rumah tangga. ‘Tuan’ mempertahankan nuansa kedudukan dan sejajar dengan ‘penguasa’ pada baris berikutnya.
- source_word: לְבֵיתוֹ
  choice: atas rumahnya
  rationale: Preposisi ל dalam konteks pengangkatan dapat menunjukkan lingkup kewenangan. ‘Atas rumahnya’ menyatakan bahwa rumah atau rumah tangga itu berada di bawah wewenangnya tanpa mempersempit maknanya hanya pada bangunan.
- source_word: וּמֹשֵׁל
  choice: dan penguasa
  rationale: Partisipel dari משל menunjuk kepada orang yang memerintah atau berkuasa. ‘Penguasa’ membentuk kesejajaran yang jelas dengan ‘tuan’.
- source_word: בְּכָל
  choice: atas segala
  rationale: Bersama משל, preposisi ב menandai lingkup atau objek kekuasaan. ‘Atas segala’ merupakan ungkapan Indonesia yang alami untuk menyatakan kewenangan menyeluruh.
- source_word: קִנְיָנוֹ
  choice: miliknya
  rationale: קִנְיָן berarti harta, properti, atau sesuatu yang dimiliki. ‘Segala miliknya’ bersifat luas, jelas, dan alami serta mencakup seluruh harta yang berada di bawah pengelolaan Yusuf.
