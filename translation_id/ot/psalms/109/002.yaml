  text: For the mouth of the wicked and the mouth of deceit have opened against me[b][a]; they have spoken to me with a lying tongue.
translation:
  language: id
  text: Sebab mulut orang fasik dan mulut penuh tipu daya telah terbuka terhadapku; mereka berbicara kepadaku dengan lidah dusta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara harfiah, “mereka berbicara dengan aku dengan lidah dusta.” Dalam konteks ini, ungkapan Ibrani tersebut kemungkinan berarti bahwa perkataan dusta itu ditujukan kepada pemazmur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi kausal yang memberikan alasan bagi permohonan pemazmur dalam konteks sekitarnya.
- source_word: פִי רָשָׁע
  choice: mulut orang fasik
  rationale: Frasa konstruksi ini secara harfiah berarti mulut milik seorang yang fasik; bentuk tunggal substantival dipertahankan tanpa menambahkan keterangan yang tidak ada dalam sumber.
- source_word: וּפִי מִרְמָה
  choice: dan mulut penuh tipu daya
  rationale: Pengulangan kata 'mulut' dipertahankan demi kesejajaran Ibrani, sedangkan 'penuh tipu daya' menyampaikan fungsi idiomatis מִרְמָה secara alami dalam bahasa Indonesia.
- source_word: עָלַי פָּתָחוּ
  choice: telah terbuka untuk melawan aku
  rationale: Ungkapan membuka mulut dalam konteks permusuhan menyatakan serangan verbal terhadap pemazmur; bentuk perfektum diterjemahkan sebagai tindakan yang sudah terjadi dan masih relevan.
- source_word: דִּבְּרוּ אִתִּי
  choice: mereka berbicara kepadaku
  rationale: Dalam konteks ini אִתִּי paling wajar dipahami sebagai ujaran yang ditujukan kepada pemazmur, meskipun secara bentuk juga dapat berarti 'dengan aku'.
- source_word: לְשׁוֹן שָׁקֶר
  choice: dengan lidah dusta
  rationale: Citra konkret 'lidah' dipertahankan, dan 'dusta' menyampaikan שָׁקֶר secara ringkas serta bermartabat.
