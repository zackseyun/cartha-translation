  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר אֱלֹהֵ֥י תְ֝הִלָּתִ֗/י אַֽל תֶּחֱרַֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: id
  text: 'Untuk pemimpin pujian. Mazmur Daud.[a]


    Ya Allah, yang kupuji, janganlah berdiam diri.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur oleh Daud,” “untuk Daud,” atau “tentang Daud”; keterangan pembuka dalam bahasa Ibrani dapat dipahami dengan beberapa cara.
    reason: alternative_reading
  - marker: b
    text: Atau “janganlah tetap diam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik; terjemahan ini alami dalam bahasa Indonesia tanpa mempersempitnya secara pasti menjadi pemimpin paduan suara.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Ya Allah, yang kupuji
  rationale: Ungkapan harfiah 'Allah pujianku' secara idiomatis menyatakan bahwa Allah adalah Dia yang dipuji pemazmur.
- source_word: אַל־תֶּחֱרַשׁ
  choice: janganlah berdiam diri
  rationale: Kata kerja ini dapat berarti diam atau tidak bertindak/menjawab; 'berdiam diri' mempertahankan keluasan maknanya.
theological_decisions:
- issue: Hubungan לְדָוִד dengan Daud
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud / untuk Daud / tentang Daud
  rationale: Formula tradisional yang ringkas dipertahankan, tetapi catatan kaki mengakui bahwa preposisi Ibrani tidak menentukan satu hubungan saja.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Judul mazmur dibuat ringkas; sapaan dan permohonan dipertahankan sebagai satu baris puitis. Semua penanda catatan kaki tercantum dalam teks utama.
