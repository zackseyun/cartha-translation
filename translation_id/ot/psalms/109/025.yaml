translation:
  language: id
  text: Aku telah menjadi celaan bagi mereka; saat mereka melihat aku, mereka menggelengkan kepala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: telah menjadi
  rationale: Bentuk qatal orang pertama tunggal dari היה menyatakan keadaan yang telah dialami pemazmur; “telah menjadi” alami dalam bahasa Indonesia dan tidak memaksakan batas waktu yang terlalu sempit.
- source_word: חֶרְפָּה
  choice: celaan
  rationale: Kata ini menunjuk pada keadaan menjadi sasaran penghinaan atau cemoohan. “Celaan” ringkas, bermartabat, dan sesuai dengan konstruksi “menjadi ... bagi mereka”.
- source_word: יִרְאוּנִי
  choice: ketika melihat aku
  rationale: Bentuk verba dengan sufiks objek berarti “mereka melihat aku.” Hubungan waktunya dengan tindakan berikutnya dinyatakan secara alami dengan “ketika,” sebagaimana alur paralel ayat.
- source_word: יְנִיעוּן רֹאשָׁם
  choice: mereka menggeleng-gelengkan kepala
  rationale: Ungkapan idiomatis ini menggambarkan gerakan kepala sebagai tanda ejekan atau penghinaan. Padanan Indonesia mempertahankan tindakan konkret tanpa menambahkan penafsiran emosional ke dalam teks utama.
