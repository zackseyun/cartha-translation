translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina “aku” dan “mereka” mempertahankan sudut pandang personal mazmur; idiom gerakan kepala diterjemahkan secara alami tanpa memperjelas secara berlebihan makna simbolisnya.
