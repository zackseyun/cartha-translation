  text: בִּ֭רְכַּ/י כָּשְׁל֣וּ מִ/צּ֑וֹם וּ֝/בְשָׂרִ֗/י כָּחַ֥שׁ מִ/שָּֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/024.yaml
  text: My knees give way from fasting[a], and my flesh grows lean from lack of fat.
translation:
  language: id
  text: Lututku goyah karena berpuasa, dan tubuhku menjadi kurus karena kehilangan lemak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dagingku menjadi kurus tanpa lemak.” Ungkapan Ibrani ini menggambarkan tubuh yang kehilangan lemak, yaitu menjadi sangat kurus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּי
  choice: Lututku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal secara alami diterjemahkan sebagai bagian tubuh kolektif, “lututku”.
- source_word: כָּשְׁלוּ
  choice: goyah
  rationale: Kata kerja ini menggambarkan keadaan tersandung atau terhuyung; untuk lutut yang melemah, “goyah” menyampaikan ketidakmampuan menopang tubuh tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: מִצּוֹם
  choice: karena berpuasa
  rationale: Preposisi מִן menyatakan sebab dalam konteks ini; ungkapan tersebut berarti kelemahan itu terjadi akibat puasa.
- source_word: וּבְשָׂרִי
  choice: dan tubuhku
  rationale: בשר secara harfiah berarti “daging,” tetapi dalam gambaran keadaan jasmani seseorang, “tubuhku” lebih wajar dan jelas dalam bahasa Indonesia modern.
- source_word: כָּחַשׁ
  choice: menjadi kurus
  rationale: Kata kerja ini berarti menjadi kurus, susut, atau merana; “menjadi kurus” mempertahankan gambaran konkret tentang penyusutan tubuh.
- source_word: מִשָּׁמֶן
  choice: karena kehilangan lemak
  rationale: Frasa Ibrani yang padat ini menunjuk pada hilangnya atau tidak adanya lemak tubuh sebagai tanda kekurusan; terjemahan ini membuat idiomnya dapat dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Goyah” mempertahankan citra lutut yang gagal menopang tubuh, sedangkan “tubuhku” menghindari kekakuan ungkapan “dagingku” dalam pemakaian Indonesia masa kini. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
