  yaml_path: translation/ot/psalms/109/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: id
  text: 'Untuk pemimpin musik. Mazmur Daud.[a]


    Ya Allah, pujianku, janganlah berdiam diri.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Judul Ibrani juga dapat dipahami sebagai “mazmur karya Daud”, “untuk Daud”, atau “bagi Daud”; hubungannya dengan Daud tidak dinyatakan secara tegas.
    reason: alternative_reading
  - marker: b
    text: Atau “jangan tetap diam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada pemimpin atau pengarah musik. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan fungsi liturgisnya.
- source_word: לְדָוִד
  choice: Mazmur Daud
  rationale: Ungkapan judul yang lazim dan ringkas dalam bahasa Indonesia, tetapi penanda catatan kaki mempertahankan keluwesan preposisi Ibrani mengenai kepengarangan, peruntukan, atau keterkaitan.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Padanan baku bagi label jenis nyanyian מִזְמוֹר.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Ya Allah, yang kupuji
  rationale: Konstruksi harfiah 'Allah pujianku' kurang alami dan dapat kabur dalam bahasa Indonesia. Padanan ini menyampaikan bahwa Allah adalah sasaran pujian pemazmur tanpa menambah gagasan teologis lain.
- source_word: אַל תֶּחֱרַשׁ
  choice: janganlah berdiam diri
  rationale: Larangan atau permohonan mendesak ini memohon agar Allah tidak tetap diam atau tidak menanggapi; 'berdiam diri' merupakan ungkapan Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Makna לְדָוִד dalam judul mazmur
  choice: Mazmur Daud, disertai catatan tentang ambiguitas
  alternative: Mazmur karya Daud; untuk Daud; bagi Daud
  rationale: Preposisi לְ dapat menandai kepengarangan, peruntukan, atau keterkaitan. Teks utama memakai bentuk judul Indonesia yang alami, sedangkan catatan kaki mencegahnya dipahami sebagai penetapan kepengarangan yang lebih tegas daripada bahasa Ibrani.
- issue: Relasi Allah dengan תְהִלָּתִי
  choice: Ya Allah, yang kupuji
  alternative: Ya Allah pujianku; ya Allah, sumber pujianku
  rationale: Bahasa sumber padat dan dapat dipahami sebagai Allah yang menjadi sasaran pujian pemazmur. Terjemahan ini tidak memasukkan gagasan 'sumber pujian' yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Judul dibuat ringkas sesuai konvensi mazmur Indonesia; ambiguitas bahasa Ibrani dijaga melalui catatan kaki. Semua penanda catatan kaki muncul dalam teks utama.
