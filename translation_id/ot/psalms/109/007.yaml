  yaml_path: translation/ot/psalms/109/007.yaml
  text: When he is judged[a], let him come out guilty[b], and let his prayer become sin.
translation:
  language: id
  text: Ketika ia diadili, biarlah ia dinyatakan bersalah[a], dan biarlah doanya menjadi dosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “biarlah ia keluar sebagai orang jahat.” Kata Ibrani רָשָׁע dapat berarti “jahat”, tetapi dalam konteks pengadilan ini kemungkinan besar berarti “bersalah”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “biarlah doanya dianggap sebagai dosa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  choice: Ketika ia diadili
  rationale: Preposisi ב dengan infinitif konstruk Nifal dari שׁפט dan sufiks orang ketiga tunggal maskulin menyatakan waktu serta mempertahankan nuansa pasif dan yudisial.
- source_word: יֵצֵא רָשָׁע
  choice: biarlah ia dinyatakan bersalah
  rationale: Secara harfiah, יֵצֵא berarti 'keluar', tetapi dalam konteks pengadilan frasa ini menunjuk pada hasil perkara. רָשָׁע di sini paling wajar menyatakan putusan 'bersalah', dan bentuk 'biarlah' mempertahankan daya permohonan atau kutukan.
- source_word: וּתְפִלָּתוֹ
  choice: dan biarlah doanya
  rationale: תְּפִלָּה berarti 'doa'. 'Biarlah' disisipkan secara wajar dalam bahasa Indonesia untuk meneruskan daya permohonan pada klausa sejajar.
- source_word: תִּהְיֶה לַחֲטָאָה
  choice: dianggap sebagai dosa
  rationale: Konstruksi היה dengan ל dapat menyatakan hasil atau kedudukan. Dalam konteks ini, 'dianggap sebagai dosa' menyampaikan bahwa doanya sendiri diperhitungkan sebagai dosa, tanpa menyiratkan perubahan hakikat secara harfiah.
theological_decisions:
- issue: Daya bentuk verbal dalam konteks mazmur kutukan
  choice: 'Diterjemahkan sebagai permohonan: “biarlah ... biarlah ...”'
  alternative: 'Diterjemahkan sebagai ramalan masa depan: “ia akan ... doanya akan ...”'
  rationale: Rangkaian dalam Mazmur 109 paling mungkin mengungkapkan permohonan pemazmur mengenai penghakiman atas lawannya. Bentuk 'biarlah' mempertahankan daya tersebut tanpa menjadikannya pernyataan kepastian masa depan.
- issue: Makna רָשָׁע dalam suasana pengadilan
  choice: bersalah
  alternative: jahat
  rationale: Walaupun kata itu sering menggambarkan orang jahat, konteks שׁפט mendukung pengertian forensik, yakni menerima putusan bersalah. Alternatif leksikal tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Ungkapan yudisial dibuat jelas bagi pembaca umum, sementara arti harfiah dan alternatif leksikal dipertahankan melalui catatan kaki.
