  text: וְֽ֭/יֵדְעוּ כִּי יָ֣דְ/ךָ זֹּ֑את אַתָּ֖ה יְהוָ֣ה עֲשִׂיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/027.yaml
  text: Let them know that this is your hand; you[a], O Yahweh, have done it.
translation:
  language: id
  text: Biarlah mereka tahu[a] bahwa ini adalah tangan-Mu; Engkau, ya Yahweh, telah melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Semoga mereka tahu” atau “Dan biarlah mereka tahu”; dalam konteks ini, kata kerja Ibrani mengandung makna harapan atau permohonan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Biarlah mereka tahu
  rationale: Bentuk imperfek Qal orang ketiga jamak dengan kata penghubung memiliki daya jusif dalam konteks ini, yakni mengungkapkan permohonan atau harapan pemazmur.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang harus mereka ketahui, bukan alasan bagi klausa sebelumnya.
- source_word: יָדְךָ זֹּאת
  choice: hal ini berasal dari tangan-Mu
  rationale: Ungkapan ini mempertahankan metafora 'tangan' sebagai lambang tindakan dan kuasa ilahi, sambil menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: אַתָּה
  choice: Engkau
  rationale: Kata ganti mandiri ini memberi penekanan pada pelaku; penekanan dipertahankan dengan subjek eksplisit sebelum nama ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: עֲשִׂיתָהּ
  choice: telah melakukannya
  rationale: Kata kerja עשה dengan sufiks feminin merujuk kembali kepada tindakan atau hal yang disebutkan; terjemahan ini mempertahankan makna tindakan dan penyebab ilahi tanpa mempersempitnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Tangan Allah sebagai gambaran tindakan ilahi
  choice: hal ini berasal dari tangan-Mu
  alternative: ini adalah kuasa-Mu atau ini adalah perbuatan-Mu
  rationale: Pilihan ini mempertahankan metafora Ibrani tentang 'tangan' dan tidak membatasi maknanya hanya pada kuasa atau karya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk 'tangan-Mu' mempertahankan metafora sumber, sedangkan susunan 'berasal dari tangan-Mu' menghindari ungkapan harfiah yang kaku. Kapitalisasi kata ganti ilahi mengikuti gaya religius Indonesia.
