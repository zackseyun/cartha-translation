  text: יִלְבְּשׁ֣וּ שׂוֹטְנַ֣/י כְּלִמָּ֑ה וְ/יַעֲט֖וּ כַ/מְעִ֣יל בָּשְׁתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/029.yaml
  text: May my accusers be clothed with disgrace[a], and wrap themselves in their shame like a robe.
translation:
  language: id
  text: Biarlah para pendakwaku mengenakan aib[a], dan menyelubungi diri dalam rasa malu mereka, seperti dalam jubah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para lawanku.” Kata Ibrani ini dapat berarti lawan secara umum atau pendakwa dalam arti hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִלְבְּשׁוּ
  choice: Biarlah ... berpakaian
  rationale: Bentuk imperfek Qal orang ketiga jamak dipahami secara yusif dalam konteks doa kutukan ini. 'Biarlah' menyatakan permohonan, sedangkan 'berpakaian' mempertahankan citra pakaian yang diikuti nomina 'kehinaan'.
- source_word: שׂוֹטְנַי
  choice: para pendakwaku
  rationale: Partisip jamak dari שׂטן dengan sufiks orang pertama tunggal menunjuk kepada orang-orang yang bertindak sebagai lawan atau pendakwa. 'Para pendakwaku' sesuai dengan nuansa hukum dalam konteks Mazmur 109, sambil tetap membuka alternatif makna yang dicatat dalam catatan kaki.
- source_word: כְּלִמָּה
  choice: kehinaan
  rationale: Nomina ini menunjuk pada aib, kehinaan, atau hilangnya kehormatan di hadapan umum. 'Kehinaan' alami dalam ungkapan 'berpakaian kehinaan' dan membedakannya dari בָּשְׁתָּם.
- source_word: וְיַעֲטוּ
  choice: dan menyelubungi diri
  rationale: Bentuk ini menggambarkan tindakan membungkus atau menutupi diri. 'Menyelubungi diri' mempertahankan nuansa refleksif serta citra seseorang yang tertutup pakaian luar.
- source_word: כַמְעִיל
  choice: seperti dengan jubah
  rationale: מְעִיל adalah pakaian luar atau jubah. Frasa 'seperti dengan jubah' mempertahankan fungsi komparatif dan hubungan instrumental citra tersebut dengan tindakan menyelubungi diri.
- source_word: בָּשְׁתָּם
  choice: rasa malu mereka
  rationale: Nomina ini dengan sufiks orang ketiga jamak berarti rasa malu atau aib mereka. 'Rasa malu mereka' langsung dan membedakannya secara wajar dari כְּלִמָּה yang diterjemahkan 'kehinaan'.
theological_decisions:
- issue: Modus verbal dalam mazmur kutukan
  choice: 'Imperfek diterjemahkan sebagai permohonan atau harapan: ''Biarlah ... berpakaian ... dan menyelubungi diri ....'''
  alternative: 'Ramalan masa depan: ''Para pendakwaku akan berpakaian ... dan akan menyelubungi diri ....'''
  rationale: Dalam rangkaian permohonan Mazmur 109, kedua bentuk imperfek paling wajar berfungsi secara yusif. Terjemahan dengan 'Biarlah' mempertahankan bentuk doa pemazmur dan tidak mengubahnya menjadi ramalan tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Citra pakaian dipertahankan melalui 'berpakaian', 'menyelubungi diri', dan 'jubah'. Istilah 'pendakwa' dipilih karena konteks hukum, sedangkan cakupan yang lebih umum dicatat dalam catatan kaki.
