  text: א֘וֹדֶ֤ה יְהוָ֣ה מְאֹ֣ד בְּ/פִ֑/י וּ/בְ/ת֖וֹךְ רַבִּ֣ים אֲהַֽלְלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/030.yaml
  text: I will give great thanks to Yahweh with my mouth[b][a]; in the midst of many I will praise him.
translation:
  language: id
  text: Aku akan sangat bersyukur kepada Yahweh dengan mulutku; di tengah orang banyak[a] aku akan memuji Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tengah banyak orang”; ungkapan ini menggambarkan pujian yang disampaikan secara terbuka di antara orang banyak.
    reason: cultural_note
lexical_decisions:
- source_word: א֘וֹדֶ֤ה
  choice: aku akan bersyukur
  rationale: Bentuk Hifil dari ידה dalam konteks ibadah mazmur menyatakan ucapan syukur atau pujian. “Bersyukur” sesuai dengan konteks dan tetap berbeda dari kata “memuji” pada baris kedua.
- source_word: יְהוָ֣ה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama perjanjian yang terdapat langsung dalam teks Ibrani tetap tampak.
- source_word: מְאֹ֣ד
  choice: sangat
  rationale: Kata ini berfungsi sebagai penguat adverbial. “Sangat” menyampaikan intensitasnya secara lugas dan alami dalam bahasa Indonesia.
- source_word: בְּ/פִ֑/י
  choice: dengan mulutku
  rationale: Preposisi ב menandai sarana, sedangkan “mulutku” mempertahankan gambaran jasmani yang konkret dalam teks Ibrani.
- source_word: וּ/בְ/ת֖וֹךְ רַבִּ֣ים
  choice: di tengah orang banyak
  rationale: Terjemahan ini mempertahankan arti ruang dan suasana komunal tanpa menambahkan gagasan “jemaah” atau “perhimpunan” yang tidak dinyatakan secara eksplisit.
- source_word: אֲהַֽלְלֶֽ/נּוּ
  choice: aku akan memuji Dia
  rationale: Bentuk Piel dari הלל berarti “memuji”; akhiran orang ketiga tunggal maskulin merujuk kembali kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi ilahi, sedangkan “TUHAN” merupakan penggantian tradisional berdasarkan kebiasaan pembacaan.
- issue: Rujukan akhiran pronominal pada אֲהַלְלֶנּוּ
  choice: Dia, yaitu Yahweh
  alternative: dia tanpa kapitalisasi
  rationale: Akhiran maskulin tunggal secara gramatikal merujuk kepada Yahweh yang disebut sebelumnya. Kapitalisasi membantu pembaca Indonesia mengenali rujukan tersebut tanpa menambah gelar atau penafsiran lain.
translation_notes:
  register: Bahasa dibuat puitis, lugas, dan bermartabat. Susunan paralel Ibrani dipertahankan, demikian juga ungkapan konkret “dengan mulutku”. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
