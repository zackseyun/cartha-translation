  yaml_path: translation/ot/psalms/109/018.yaml
  text: He clothed himself with cursing as his garment[a]; it came into his inward parts like water[c][b], and like oil into his bones.
translation:
  language: id
  text: Ia mengenakan kutukan seperti pakaiannya[a]; kutukan itu masuk seperti air ke dalam tubuhnya[b], dan seperti minyak ke dalam tulang-tulangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia mengenakan kutukan bagaikan jubahnya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ke dalam dirinya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְבַּשׁ
  choice: dipakainya
  rationale: Kata kerja לָבַשׁ berarti memakai atau mengenakan pakaian. Bentuk ini mempertahankan gambaran bahwa orang itu sendiri menjadikan kutukan seperti sesuatu yang dikenakannya.
- source_word: קְלָלָה
  choice: kutukan
  rationale: Nomina ini dapat menunjuk pada kutukan maupun tindakan mengutuk. Dalam bahasa Indonesia, “kutukan” paling alami sebagai pokok yang kemudian masuk ke dalam dirinya, sementara kemungkinan makna “kata-kata kutuk” dicatat dalam catatan kaki.
- source_word: כְּמַדּוֹ
  choice: seperti pakaian
  rationale: מַד menunjuk pada pakaian atau jubah. “Seperti pakaian” menjaga perumpamaan secara alami tanpa mempersempit jenis pakaian.
- source_word: וַתָּבֹא
  choice: masuk
  rationale: Kata kerja feminin tunggal ini merujuk kembali kepada “kutukan”. “Masuk” menyampaikan gerak ke bagian dalam yang dituntut oleh dua frasa berikutnya.
- source_word: כַמַּיִם
  choice: seperti air
  rationale: Perumpamaan langsung dipertahankan dan menggambarkan daya tembus yang menyeluruh.
- source_word: בְּקִרְבּוֹ
  choice: ke dalam batinnya
  rationale: קֶרֶב dapat berarti bagian dalam tubuh, batin, atau bagian terdalam. “Batin” mempertahankan keluasan makna ragawi dan batiniah; kemungkinan yang lebih anatomis dicatat dalam catatan kaki.
- source_word: וְכַשֶּׁמֶן
  choice: dan seperti minyak
  rationale: Konjungsi dan perumpamaan dipertahankan secara langsung; dalam konteks ini minyak menggambarkan peresapan mendalam.
- source_word: בְּעַצְמוֹתָיו
  choice: ke dalam tulang-tulangnya
  rationale: Preposisi ב dapat berarti “di” atau “ke dalam”. Karena mengikuti kata kerja gerak “masuk” dan sejajar dengan “ke dalam batinnya”, bentuk “ke dalam” paling sesuai.
theological_decisions:
- issue: Gambaran kutukan dan pelakunya
  choice: Ayat menggambarkan orang itu sendiri memakai kutukan, lalu kutukan tersebut masuk ke dalam dirinya.
  alternative: Menyatakan secara eksplisit bahwa Allah langsung mengenakan kutukan itu kepadanya.
  rationale: Teks Ibrani menyoroti tindakan orang tersebut dan akibat yang dialaminya, tetapi tidak menyebutkan secara eksplisit dalam ayat ini siapa yang menyebabkan kutukan itu masuk. Terjemahan tidak menambahkan mekanisme teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa puitis yang lugas dan bermartabat. Susunan pasif “Kutukan dipakainya” menonjolkan kutukan sebagai tema dan mempertahankan peralihan yang jelas kepada “kutukan itu” pada klausa berikutnya.
