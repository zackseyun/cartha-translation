  text: May his posterity be cut off[a]; in the next generation may their name be blotted out.
translation:
  language: id
  text: Biarlah keturunannya dilenyapkan[a]; dalam generasi berikutnya, biarlah nama mereka dihapuskan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Biarlah akhirnya mengalami kemusnahan.” Kata Ibrani אַחֲרִית dapat berarti “akhir” atau “masa depan,” tetapi konteks di sini mendukung arti “keturunan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Biarlah ...
  rationale: Bentuk yiqtol jusif dari היה menyatakan harapan atau kutukan; “Biarlah” mempertahankan daya volitifnya secara wajar dalam bahasa Indonesia.
- source_word: אַחֲרִיתוֹ
  choice: keturunannya
  rationale: אַחֲרִית dapat berarti “akhir,” “masa depan,” atau kelanjutan seseorang. Paralel dengan generasi berikutnya dan nama “mereka” mendukung pengertian garis keturunan.
- source_word: לְהַכְרִית
  choice: dilenyapkan
  rationale: Infinitif konstruk כרת dengan ל menyatakan hasil atau tujuan. Bentuk pasif ini menyampaikan pemutusan atau pemusnahan secara alami tanpa mengurangi ketegasan teks.
- source_word: בְּדוֹר אַחֵר
  choice: dalam generasi berikutnya
  rationale: Ungkapan ini menunjuk pada generasi lain yang menyusul; “generasi berikutnya” paling jelas dalam konteks kelanjutan garis keluarga.
- source_word: יִמַּח
  choice: biarlah ... dihapuskan
  rationale: Bentuk Nifal dari מחה berarti dihapus atau dilenyapkan, khususnya ketika objeknya nama atau ingatan.
- source_word: שְׁמָם
  choice: nama mereka
  rationale: Akhiran jamak Ibrani berarti “mereka” dan merujuk kepada keturunan sebagai kelompok; pergeseran dari tunggal ke jamak dipertahankan.
theological_decisions:
- issue: Daya kutukan dalam ayat
  choice: Mempertahankan bentuk permohonan atau kutukan terhadap garis keturunan orang fasik
  alternative: Mengalihkannya menjadi ramalan netral mengenai masa depannya
  rationale: Bentuk jusif dan konteks Mazmur 109 menunjukkan seruan agar penghakiman terjadi, bukan sekadar pernyataan tentang masa depan. Ketegangan dan kerasnya ungkapan tidak diperhalus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Biarlah” mempertahankan corak doa kutukan, sedangkan “dilenyapkan” dan “dihapuskan” menjaga paralelisme tanpa terdengar arkais.
