translation:
  language: id
  text: Biarlah anak-anak lelakinya menjadi yatim[a], dan istrinya menjadi janda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “anak-anak yang kehilangan ayah.” Dalam konteks ini, istilah Ibrani tersebut menunjuk pada anak-anak tanpa ayah, sebagaimana ditegaskan oleh paralelnya: “istrinya menjadi janda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Biarlah ... menjadi
  rationale: Bentuk verba dalam konteks mazmur kutukan ini paling wajar dipahami sebagai jusif atau permohonan, bukan sekadar pernyataan tentang masa depan.
- source_word: בָנָיו
  choice: anak-anak lelakinya
  rationale: Bentuk jamak בֵּן dengan sufiks orang ketiga maskulin tunggal secara khusus berarti anak-anak lelaki miliknya; pilihan ini mempertahankan kekhususan gender teks sumber.
- source_word: יְתוֹמִים
  choice: yatim
  rationale: Istilah ini menunjuk kepada anak yang kehilangan ayah. Dalam bahasa Indonesia, 'yatim' tepat dan selaras dengan pasangan paralelnya, yakni sang istri menjadi janda.
- source_word: וְאִשְׁתּוֹ
  choice: dan istrinya
  rationale: Dalam konteks ini אִשָּׁה dengan sufiks jelas berarti 'istrinya'; konjungsi וְ diterjemahkan langsung sebagai 'dan'.
- source_word: אַלְמָנָה
  choice: janda
  rationale: Nomina ini secara langsung berarti perempuan yang suaminya telah meninggal; 'menjadi janda' merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Nuansa kutukan atau permohonan dalam mazmur
  choice: 'Diterjemahkan sebagai harapan atau permohonan: “Biarlah anak-anak lelakinya menjadi yatim, dan istrinya menjadi janda.”'
  alternative: 'Pembacaan futur prediktif: “Anak-anak lelakinya akan menjadi yatim, dan istrinya akan menjadi janda.”'
  rationale: Bentuk verbal dan konteks sastra Mazmur 109 mendukung nuansa jusif atau imprekasi. Terjemahan ini mempertahankan ketegangan retoris teks tanpa melunakkannya menjadi deskripsi biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan khidmat. 'Biarlah' mempertahankan nada imprekasi; 'anak-anak lelaki' menjaga kekhususan bentuk Ibrani; 'yatim' alami bagi pembaca Indonesia dan tepat dalam konteks.
