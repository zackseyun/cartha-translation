  yaml_path: translation/ot/psalms/109/028.yaml
  text: They may curse[a], but you will bless. They rise up and are put to shame[b], but your servant will rejoice.
translation:
  language: id
  text: Biarlah mereka mengutuk[a], tetapi Engkau akan memberkati. Mereka bangkit, lalu dipermalukan[b], tetapi hamba-Mu akan bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mereka boleh saja mengutuk, tetapi Engkau akan memberkati.” Bentuk kata kerja Ibrani dapat dipahami secara permisif atau yusif.
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “Mereka bangkit, lalu dipermalukan.” Kata “bangkit” mungkin menyiratkan tindakan bermusuhan, tetapi teks tidak secara khusus mengatakan bahwa mereka menyerang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַֽלְלוּ
  choice: Biarlah mereka mengutuk
  rationale: Bentuk piel imperfek orang ketiga jamak dapat menyatakan tindakan mendatang, kebiasaan, atau nuansa yusif/permisif. Dalam pertentangan dengan tindakan Allah yang memberkati, “Biarlah mereka mengutuk” mempertahankan nuansa permisif yang wajar, sementara alternatif dicatat dalam catatan kaki.
- source_word: הֵמָּה
  choice: mereka
  rationale: Pronomina mandiri ini menegaskan dan mempertentangkan para lawan dengan Allah. Dalam bahasa Indonesia, subjek eksplisit “mereka” sudah menyampaikan kontras itu secara alami.
- source_word: וְ/אַתָּה
  choice: tetapi Engkau
  rationale: Walaupun waw secara harfiah berarti “dan”, hubungan antarklausa jelas bersifat kontras. “Tetapi” menyampaikan fungsi adversatifnya dengan alami; “Engkau” memakai huruf kapital karena merujuk kepada Allah.
- source_word: תְבָ֫רֵךְ
  choice: akan memberkati
  rationale: Piel imperfek orang kedua tunggal dari ברך menyatakan tindakan Allah yang berlawanan dengan kutukan para musuh. Bentuk “akan memberkati” mempertahankan alur prospektif ayat.
- source_word: קָ֤מוּ
  choice: Mereka bangkit
  rationale: Qal perfek orang ketiga jamak dari קום secara langsung berarti bangkit atau berdiri. Konteks mungkin menyiratkan tindakan bermusuhan, tetapi terjemahan tidak menambahkan gagasan menyerang yang tidak dinyatakan secara eksplisit.
- source_word: וַ/יֵּבֹ֗שׁוּ
  choice: lalu dipermalukan
  rationale: בוש dapat menunjuk pada rasa malu atau keadaan mendapat aib. Bentuk “dipermalukan” menonjolkan hasil berupa kehinaan terbuka yang sesuai dengan konteks, sedangkan “lalu” menyampaikan rangkaian naratif dari waw-konsekutif tanpa memaksakan waktu lampau dalam bahasa Indonesia.
- source_word: וְֽ/עַבְדְּ/ךָ֥
  choice: tetapi hamba-Mu
  rationale: Frasa ini berarti “hamba-Mu”. Konjungsi diterjemahkan secara adversatif karena sukacita sang hamba dipertentangkan dengan kehinaan para lawan.
- source_word: יִשְׂמָֽח
  choice: akan bersukacita
  rationale: Qal imperfek dari שמח menyatakan kegembiraan. “Akan bersukacita” sesuai dengan alur prospektif dan menjadi padanan puitis bagi kehinaan para lawan.
theological_decisions:
- issue: Rujukan “hamba-Mu”
  choice: Pembicara menyebut dirinya sendiri dengan rendah hati di hadapan Allah sebagai “hamba-Mu”.
  alternative: Sosok hamba benar yang lebih umum.
  rationale: Dalam konteks langsung mazmur, ungkapan ini berfungsi sebagai sebutan diri pemazmur dalam doa, bukan sebagai gelar mesianik tersendiri. Terjemahan mempertahankan makna langsung tanpa memasukkan penafsiran kristologis yang tidak dituntut oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pronomina bagi Allah ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur kontras kutuk/berkat dan malu/sukacita dipertahankan, demikian pula ambiguitas daya kata kerja pembuka melalui catatan kaki.
