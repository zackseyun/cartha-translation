source:
  edition: WLC
  text: יְנַקֵּ֣שׁ נ֭וֹשֶׁה לְ/כָל אֲשֶׁר ל֑/וֹ וְ/יָבֹ֖זּוּ זָרִ֣ים יְגִיעֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/011.yaml
  text: May a creditor seize all that belongs to him[a], and may strangers plunder the fruit of his labor.
translation:
  language: id
  text: Biarlah kreditur menyita segala miliknya[a], dan biarlah orang-orang asing menjarah hasil jerih payahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjerat”; kata Ibrani ini dapat berarti memasang jerat atau menangkap, tetapi di sini tampaknya menggambarkan kreditur yang menuntut dan mengambil harta miliknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַקֵּשׁ
  choice: menyita
  rationale: Dalam bentuk Piel, verba ini dapat berarti memasang jerat atau menangkap. Bersama נוֹשֶׁה dan objek 'segala miliknya', konteksnya menunjuk pada pemberi pinjaman yang menjerat atau mengambil harta; 'menyita' menyampaikan tindakan ekonomi itu secara wajar dalam bahasa Indonesia modern.
- source_word: נוֹשֶׁה
  choice: pemberi pinjaman
  rationale: Kata ini menunjuk kepada orang yang memberi pinjaman dan menagih pelunasannya. 'Pemberi pinjaman' jelas bagi pembaca umum dan tidak mempersempit makna menjadi lembaga tertentu.
- source_word: לְכָל אֲשֶׁר לוֹ
  choice: segala miliknya
  rationale: Ungkapan ini mencakup semua yang menjadi kepunyaannya. 'Segala miliknya' ringkas, alami, dan mempertahankan daya posesif teks.
- source_word: וְיָבֹזּוּ
  choice: menjarah
  rationale: Verba בזז menyatakan pengambilan rampasan secara paksa. 'Menjarah' mempertahankan nuansa keras dan predatorisnya.
- source_word: זָרִים
  choice: orang-orang asing
  rationale: Istilah ini menunjuk kepada orang-orang di luar lingkaran keluarga atau komunitas, tanpa harus berarti warga bangsa lain. 'Orang-orang asing' menjaga keluasan tersebut.
- source_word: יְגִיעוֹ
  choice: hasil jerih payahnya
  rationale: יְגִיעַ dapat menunjuk pada hasil atau perolehan dari kerja berat, bukan hanya kegiatan bekerja. 'Hasil jerih payahnya' menyatakan produk kerja sekaligus mempertahankan nuansa susah payah.
theological_decisions:
- issue: Daya jusif dalam kutukan atau permohonan
  choice: 'Kedua verba diterjemahkan sebagai harapan atau permohonan: ''Biarlah ... menyita ... dan biarlah ... menjarah ...''.'
  alternative: 'Bentuk futur deklaratif: ''Pemberi pinjaman akan menyita ... dan orang-orang asing akan menjarah ...''.'
  rationale: Dalam rangkaian kutukan Mazmur 109, bentuk yiqtol paling tepat dipahami sebagai jusif, yaitu harapan atau permohonan, bukan sekadar ramalan masa depan. 'Biarlah' mempertahankan daya kutukan itu tanpa mengubahnya menjadi pernyataan kepastian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan paralel dipertahankan melalui pengulangan 'biarlah'. 'Pemberi pinjaman' dipilih daripada istilah teknis 'kreditur' agar mudah dipahami pembaca umum, sedangkan 'menyita' dan 'menjarah' mempertahankan intensitas gambaran asli.
