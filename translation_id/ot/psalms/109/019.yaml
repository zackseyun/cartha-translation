  text: תְּהִי ל֭/וֹ כְּ/בֶ֣גֶד יַעְטֶ֑ה וּ֝/לְ/מֵ֗זַח תָּמִ֥יד יַחְגְּרֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/019.yaml
  text: May it be like a garment that he wraps around himself[a], and like a belt that he always girds on.
translation:
  language: id
  text: Biarlah itu baginya seperti pakaian yang dikenakannya[a], dan seperti ikat pinggang yang selalu diikatkannya di pinggang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti pakaian yang dipakainya untuk menyelubungi diri.”'
    reason: Alternatif ini menampilkan lebih jelas nuansa יעטה sebagai tindakan membungkus atau menyelubungi diri.
lexical_decisions:
- source_word: תְּהִי
  choice: Biarlah itu
  rationale: Bentuk jussif feminin tunggal menyatakan harapan atau kutukan dalam konteks mazmur ini; “Biarlah” mempertahankan daya volitifnya, bukan menjadikannya sekadar ramalan.
- source_word: ל֭וֹ
  choice: baginya
  rationale: Preposisi dengan sufiks orang ketiga menunjukkan hubungan dengan orang yang menjadi sasaran kutukan; “baginya” menyatakannya secara ringkas dan wajar.
- source_word: כְּבֶגֶד
  choice: seperti pakaian
  rationale: בגד adalah istilah umum untuk pakaian; pilihan ini mempertahankan metafora tanpa menentukan jenis pakaian tertentu.
- source_word: יַעְטֶה
  choice: yang dikenakannya
  rationale: Verba ini dapat berarti mengenakan, menyelubungi, atau menutupi diri dengan pakaian. “Dikenakannya” alami dalam bahasa Indonesia dan tetap menyampaikan tindakan berpakaian.
- source_word: וּלְמֵזַח
  choice: dan seperti ikat pinggang
  rationale: מזח menunjuk pada benda yang dililitkan atau diikat pada tubuh, seperti ikat pinggang atau selempang. “Ikat pinggang” jelas bagi pembaca modern dan sesuai dengan verba berikutnya.
- source_word: תָּמִיד
  choice: selalu
  rationale: Adverbia ini menyatakan keberlangsungan atau kebiasaan terus-menerus; “selalu” mempertahankan arti itu secara alami.
- source_word: יַחְגְּרֶהָ
  choice: yang selalu diikatkannya
  rationale: חגר secara khusus menggambarkan mengikat atau mengenakan sesuatu di pinggang. Bentuk bersufiks feminin merujuk kembali pada hal yang disamakan dengan ikat pinggang; “diikatkannya” mempertahankan gambaran tindakan tersebut.
theological_decisions:
- issue: Daya jussif dalam konteks kutukan
  choice: 'Diterjemahkan sebagai harapan atau permohonan: “Biarlah itu ...”'
  alternative: 'Diterjemahkan sebagai pernyataan masa depan: “Itu akan ...”'
  rationale: Bentuk verba Ibrani dan konteks imprekasi Mazmur 109 mendukung suatu keinginan akan penghakiman, bukan sekadar prediksi. Terjemahan ini mempertahankan retorika teks tanpa menambahkan penafsiran doktrinal.
- issue: Rujukan kata “itu”
  choice: Mempertahankan pronomina netral “itu” tanpa menjelaskan ulang apa yang dirujuk
  alternative: Menggantinya dengan “kutukan itu” berdasarkan konteks ayat sebelumnya
  rationale: Bentuk feminin tunggal merujuk pada unsur sebelumnya, tetapi ayat ini sendiri memakai rujukan pronominal. “Itu” mempertahankan keterkaitan konteks tanpa memasukkan nomina penjelas ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ikat pinggang” dipilih daripada istilah yang lebih arkais, sedangkan “diikatkannya” mempertahankan gambaran konkret verba Ibrani.
