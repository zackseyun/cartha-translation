  text: זֹ֤את פְּעֻלַּ֣ת שֹׂ֭טְנַ/י מֵ/אֵ֣ת יְהוָ֑ה וְ/הַ/דֹּבְרִ֥ים רָ֝֗ע עַל נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/020.yaml
  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
translation:
  language: id
  text: Inilah ganjaran dari Yahweh[a] bagi para pendakwaku, dan bagi orang-orang yang berkata jahat terhadapku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Inilah balasan dari Yahweh bagi para lawanku.” Kata Ibrani yang diterjemahkan “ganjaran” dapat berarti “pekerjaan,” “perbuatan,” atau, dalam konteks ini, “balasan”; “para pendakwaku” juga dapat diterjemahkan “para lawanku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “terhadap jiwaku.” Di sini “jiwa” dapat berarti “hidup” atau “diriku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Inilah
  rationale: Kata tunjuk feminin tunggal ini memperkenalkan pernyataan dengan kopula tersirat; “Inilah” merupakan ungkapan Indonesia yang alami dan tegas.
- source_word: פְּעֻלַּת
  choice: ganjaran
  rationale: Secara dasar berarti “pekerjaan” atau “perbuatan,” tetapi dalam konteks ini menunjuk pada apa yang diberikan atau didatangkan Yahweh kepada para penentang sebagai balasan.
- source_word: שֹׂטְנַי
  choice: para pendakwaku
  rationale: Bentuk ini menyebut orang yang menentang atau mendakwa. Konteks mazmur yang menonjolkan tuduhan dan perkataan bermusuhan mendukung “para pendakwaku,” sementara arti lebih luas dicatat dalam catatan kaki.
- source_word: מֵאֵת
  choice: dari
  rationale: Preposisi ini menyatakan sumber atau pelaku; “dari” mempertahankan bentuk ringkas teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar.
- source_word: וְהַדֹּבְרִים
  choice: dan bagi orang-orang yang berkata
  rationale: Konjungsi וְ diterjemahkan secara eksplisit. Pengulangan “bagi” membuat hubungan kedua kelompok dengan “ganjaran” jelas dalam bahasa Indonesia tanpa memastikan apakah keduanya kelompok terpisah atau uraian lebih lanjut tentang kelompok yang sama.
- source_word: רָע
  choice: jahat
  rationale: Kata ini mempertahankan bobot moral dari רָע ketika menjadi isi atau sifat perkataan.
- source_word: עַל נַפְשִׁי
  choice: tentang hidupku
  rationale: נֶפֶשׁ dapat menunjuk pada jiwa, diri, atau hidup seseorang. Dalam konteks permusuhan ini, “hidupku” menyampaikan ancaman pribadi secara konkret, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan antara “para pendakwaku” dan “orang-orang yang berkata jahat”
  choice: Mempertahankan keduanya dengan kata sambung “dan”
  alternative: Membaca kelompok kedua sebagai penjelasan yang sepenuhnya identik dengan kelompok pertama
  rationale: Konjungsi Ibrani dapat menghubungkan kelompok tambahan atau memperinci kelompok sebelumnya. Terjemahan dengan “dan” menjaga kelonggaran hubungan itu tanpa menyatukan atau memisahkan keduanya secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. “Ganjaran” dipilih karena alami dalam konteks pembalasan dan tetap cukup formal; “pendakwa” mempertahankan nuansa tuduhan verbal yang menonjol dalam mazmur ini.
