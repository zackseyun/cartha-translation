base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/031.yaml
  text: For he stands at the right hand of the poor[b][a], to save him from those who judge his soul.
translation:
  language: id
  text: Sebab Dia berdiri di sebelah kanan orang miskin untuk menyelamatkan dia dari orang-orang yang menghakimi dia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para hakimnya”; bentuk Ibrani dapat menunjuk kepada orang-orang yang bertindak sebagai hakim atas dia atau, secara lebih luas, kepada mereka yang menjatuhkan penghakiman terhadapnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “hidupnya” atau “jiwanya”; kata Ibrani nefesy dapat berarti diri, hidup, atau jiwa, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pujian dan keyakinan pada ayat sebelumnya; “sebab” mempertahankan hubungan penjelas itu secara alami.
- source_word: יַעֲמֹד
  choice: Dia berdiri
  rationale: Bentuk imperfek dapat menyatakan tindakan yang menjadi ciri atau kepastian. Bentuk kini dalam bahasa Indonesia menyampaikan kehadiran-Nya sebagai pelindung tanpa membatasi makna pada masa depan.
- source_word: לִימִין
  choice: di sebelah kanan
  rationale: Ungkapan ini mempertahankan gambaran posisi pendampingan, pembelaan, dan perlindungan.
- source_word: אֶבְיוֹן
  choice: orang yang berkekurangan
  rationale: Istilah ini menunjuk kepada orang miskin atau membutuhkan pertolongan dan menekankan kerentanannya. Pilihan ini alami serta tidak membatasi makna hanya pada kemiskinan materi.
- source_word: לְהוֹשִׁיעַ
  choice: untuk menyelamatkannya
  rationale: Infinitif ini menyatakan tujuan dan mencakup penyelamatan atau pembebasan, termasuk dalam keadaan hukum yang mengancam.
- source_word: מִשֹּׁפְטֵי
  choice: dari orang-orang yang menghakimi
  rationale: Partisipel jamak ini dapat menunjuk kepada para hakim atau, secara lebih luas, pihak yang menjatuhkan penghakiman. Terjemahan ini mempertahankan keluasan tersebut.
- source_word: נַפְשׁוֹ
  choice: dirinya
  rationale: Dalam konteks ini נֶפֶשׁ dapat menunjuk kepada diri atau hidup seseorang. “Dirinya” wajar dalam bahasa Indonesia dan tidak mempersempitnya menjadi unsur nonjasmani saja.
theological_decisions:
- issue: Cakupan antropologis נֶפֶשׁ
  choice: dirinya
  alternative: nyawanya; jiwanya
  rationale: Konteksnya adalah penyelamatan seseorang dari penghakiman yang bermusuhan. Kata Ibrani dapat berarti diri, hidup, atau jiwa; teks utama memakai bentuk yang luas, sementara catatan kaki mempertahankan alternatif yang sungguh mungkin.
- issue: Identitas subjek tersirat pada יַעֲמֹד
  choice: Dia
  alternative: TUHAN
  rationale: Subjek verba tersirat dan merujuk kepada TUHAN dalam konteks sebelumnya. Kata ganti mempertahankan bentuk sumber tanpa menambahkan nama ilahi ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur puitis dipertahankan secara ringkas; metafora “di sebelah kanan” tetap hadir, sedangkan ambiguitas hukum dan antropologis dijelaskan tanpa diputuskan secara dogmatis.
