lexical_decisions:
- source_word: דִבְרֵי שִׂנְאָה
  choice: kata-kata penuh kebencian
  rationale: Frasa ini secara harfiah berarti ‘kata-kata kebencian’. Bentuk ‘penuh kebencian’ mempertahankan makna ujaran yang didorong oleh kebencian sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: סְבָבוּנִי
  choice: mengepung aku
  rationale: Kata kerja סבב menggambarkan tindakan mengelilingi atau mengepung. ‘Mengepung’ mempertahankan citra ancaman yang kuat dan selaras dengan gambaran pertempuran pada klausa berikutnya.
- source_word: וַיִּלָּחֲמוּנִי
  choice: mereka memerangi aku
  rationale: Kata kerja לחם dalam bentuk ini berarti bertempur atau melawan. ‘Memerangi aku’ mempertahankan citra konflik yang kuat serta konstruksi objek langsung pada teks Ibrani.
- source_word: חִנָּם
  choice: tanpa alasan
  rationale: Adverbia ini menunjukkan bahwa permusuhan tersebut tidak memiliki alasan atau dasar yang sah. ‘Tanpa alasan’ jelas dan wajar bagi pembaca modern.
