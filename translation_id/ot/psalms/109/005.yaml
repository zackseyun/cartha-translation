translation:
  language: id
  text: Mereka membalas kebaikan dengan kejahatan[a], dan kasihku dengan kebencian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka menimpakan kejahatan kepadaku sebagai ganti kebaikan.” Kata kerja Ibraninya secara harfiah berarti “menaruh” atau “menempatkan,” tetapi di sini kemungkinan bermakna memberikan sesuatu sebagai balasan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ עָלַי
  choice: Mereka membalas ...-ku dengan
  rationale: Secara harfiah berarti “mereka menaruh/menempatkan atas aku,” tetapi bersama dua frasa תַּחַת, ungkapan ini menyatakan pertukaran atau balasan. “Membalas ... dengan” menyampaikan makna tersebut secara alami dalam bahasa Indonesia.
- source_word: רָעָה
  choice: kejahatan
  rationale: Pilihan ini mempertahankan bobot moral dan cakupan luas kata Ibrani, bukan mempersempitnya hanya menjadi kerugian atau celaka.
- source_word: תַּחַת
  choice: dengan
  rationale: Dalam susunan idiomatis “membalas X dengan Y,” kata ini menyatakan sesuatu yang diberikan sebagai ganti atau balasan atas hal lain.
- source_word: טוֹבָה
  choice: kebaikanku
  rationale: Kata Ibrani berarti “kebaikan/hal yang baik.” Akhiran orang pertama tersirat dari konstruksi konteks dalam terjemahan idiomatis; “kebaikanku” juga menjaga kesejajaran dengan “kasihku.”
- source_word: וְשִׂנְאָה
  choice: dan ... kebencian
  rationale: Nomina abstrak “kebencian” mempertahankan bentuk dan kesejajaran puitis dengan “kasihku.”
- source_word: אַהֲבָתִי
  choice: kasihku
  rationale: Menerjemahkan secara langsung nomina אַהֲבָה dengan akhiran orang pertama, tanpa menambahkan penjelasan bahwa kasih itu ditunjukkan melalui tindakan.
