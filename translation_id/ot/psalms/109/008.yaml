  yaml_path: translation/ot/psalms/109/008.yaml
  text: May his days be few[a]; may another take his office.
translation:
  language: id
  text: Biarlah umurnya pendek; biarlah orang lain mengambil jabatannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tugas pengawasannya,” “tanggung jawabnya,” atau “kedudukannya.” Istilah Ibrani ini menunjuk pada tanggung jawab yang dipercayakan atau peran yang ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Biarlah ... sedikit
  rationale: Bentuk ini menyampaikan daya jusif atau kutukan dalam konteks, bukan sekadar pernyataan tentang masa depan.
- source_word: יָמָיו
  choice: hari-harinya
  rationale: Terjemahan langsung dari bentuk jamak dengan akhiran orang ketiga tunggal; dalam konteks, ini menunjuk pada lamanya hidup orang tersebut.
- source_word: מְעַטִּים
  choice: sedikit
  rationale: Kata ini secara langsung menyatakan bahwa jumlah hari itu sedikit; singkat merupakan makna yang tersirat.
- source_word: פְּקֻדָּתוֹ
  choice: jabatannya
  rationale: Kata Ibrani ini dapat menunjuk pada tanggung jawab, tugas pengawasan, kedudukan, atau peran yang dipercayakan. 'Jabatan' wajar dalam bahasa Indonesia dan tidak dengan sendirinya membatasi maknanya pada jabatan gerejawi.
- source_word: יִקַּח
  choice: biarlah ... mengambil
  rationale: Walaupun bentuknya imperfek, kesejajarannya dengan klausa pertama memberinya daya jusif; 'biarlah' mempertahankan nuansa permohonan atau kutukan itu.
- source_word: אַחֵר
  choice: orang lain
  rationale: Ungkapan ini merupakan padanan Indonesia yang langsung dan alami untuk pihak lain yang mengambil peran tersebut.
theological_decisions:
- issue: Makna פְּקֻדָּתוֹ dalam ayat yang kemudian dikutip dalam Kisah Para Rasul 1:20
  choice: jabatannya
  alternative: tugas pengawasannya, tanggung jawabnya, atau kedudukannya
  rationale: '''Jabatan'' mempertahankan gagasan tentang peran atau tanggung jawab yang dipercayakan dan cocok dengan penggunaan ayat ini kemudian, tanpa memasukkan arti teknis jabatan gerejawi ke dalam mazmur.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada imprekatoris yang khidmat. Pengulangan 'biarlah' mempertahankan kesejajaran kedua klausa dan daya jusif teks Ibrani.
