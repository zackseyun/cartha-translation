  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִהְי֣וּ נֶֽגֶד יְהוָ֣ה תָּמִ֑יד וְ/יַכְרֵ֖ת מֵ/אֶ֣רֶץ זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
translation:
  language: id
  text: Kiranya mereka senantiasa berada di hadapan Yahweh, dan kiranya Ia melenyapkan ingatan akan mereka dari bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari negeri”; kata Ibrani אֶרֶץ dapat berarti “bumi” atau “negeri”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Kiranya mereka ... berada
  rationale: Bentuk imperfek Qal orang ketiga jamak dipahami secara yusif dalam konteks doa kutukan; “kiranya” menyampaikan nuansa permohonan atau harapan, bukan sekadar pernyataan masa depan.
- source_word: נֶגֶד
  choice: di hadapan
  rationale: Ungkapan ini menyatakan keberadaan di depan atau dalam hadirat seseorang; “di hadapan” alami dalam bahasa Indonesia dan mempertahankan nuansa relasional serta penghakiman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Kata ini menyatakan keberlangsungan tanpa henti; “senantiasa” sesuai dengan nada mazmur yang khidmat.
- source_word: וְיַכְרֵת
  choice: dan kiranya Ia melenyapkan
  rationale: Imperfek Hifil orang ketiga tunggal dipahami sebagai yusif yang meneruskan corak doa kutukan. “Melenyapkan” menyampaikan hasil idiom “memotong” dalam arti menghapuskan sampai tiada.
- source_word: מֵאֶרֶץ
  choice: dari bumi
  rationale: אֶרֶץ dapat berarti “bumi” atau “negeri”. Dalam ungkapan tentang lenyapnya ingatan, “bumi” menyampaikan cakupan yang luas, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: זִכְרָם
  choice: ingatan akan mereka
  rationale: Frasa ini menunjuk pada kenangan atau peringatan mengenai mereka. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan idiom tentang lenyapnya ingatan.
theological_decisions:
- issue: Daya yusif dan kutukan dalam kedua klausa
  choice: Kedua verba diterjemahkan sebagai permohonan atau harapan dengan “kiranya”.
  alternative: 'Menerjemahkannya sebagai pernyataan masa depan: “Mereka akan ... dan Ia akan ...”.'
  rationale: Konteksnya adalah doa kutukan, dan bentuk imperfek Ibrani secara wajar dapat memiliki daya yusif. Terjemahan ini mempertahankan retorika serta ketegangan teologis teks tanpa melunakkannya menjadi prediksi biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Senantiasa” mempertahankan nada puitis tanpa terasa usang. Penanda catatan kaki ditempatkan sesudah “bumi”, yakni pada kata yang memiliki alternatif leksikal.
