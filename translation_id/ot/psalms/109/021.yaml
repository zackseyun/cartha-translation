  text: וְ/אַתָּ֤ה יְה֘וִ֤ה אֲדֹנָ֗/י עֲֽשֵׂה אִ֭תִּ/י לְמַ֣עַן שְׁמֶ֑/ךָ כִּי ט֥וֹב חַ֝סְדְּ/ךָ֗ הַצִּילֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/021.yaml
  text: But you[a], O Lord Yahweh, deal with me for your name’s sake; because your steadfast love is good[d][c][b], deliver me.
translation:
  language: id
  text: Tetapi Engkau, ya TUHAN, Tuhanku[a], bertindaklah bagiku[b] demi nama-Mu. Sebab kasih setia-Mu baik[c], bebaskanlah aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai dua sebutan ilahi secara berurutan: YHWH dan Adonai. Dalam terjemahan ini keduanya dirender “TUHAN, Tuhanku.”'
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “perlakukanlah aku” atau “bertindaklah terhadapku.”
    reason: lexical_alternative
  - marker: c
    text: “Kasih setia” menerjemahkan kata Ibrani ḥesed, yang dapat mencakup kasih, kemurahan, kesetiaan, dan loyalitas dalam ikatan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Tetapi Engkau
  rationale: Kata penghubung dan pronomina yang ditegaskan menandai kontras dengan para lawan yang dibicarakan dalam konteks sebelumnya.
- source_word: יְהוָה אֲדֹנָי
  choice: ya TUHAN, Tuhanku
  rationale: 'Mempertahankan dua sebutan ilahi yang berurutan: nama ilahi YHWH dan gelar Adonai, tanpa meleburkannya menjadi satu sebutan.'
- source_word: עֲשֵׂה אִתִּי
  choice: bertindaklah bagiku
  rationale: Secara harfiah berarti kira-kira 'lakukanlah terhadap/bersamaku', tetapi dalam doa ini merupakan permohonan agar Allah campur tangan bagi pemazmur. Pilihan ini tetap cukup terbuka dan tidak merinci tindakan yang diminta.
- source_word: לְמַעַן שְׁמֶךָ
  choice: demi nama-Mu
  rationale: Ungkapan ringkas dan alami dalam bahasa Indonesia yang mempertahankan permohonan berdasarkan nama, yakni nama baik dan karakter Allah.
- source_word: כִּי טוֹב חַסְדְּךָ
  choice: Karena kasih setia-Mu itu baik
  rationale: כִּי dipahami secara kausal, טוֹב dipertahankan dengan arti dasarnya 'baik', dan חֶסֶד diterjemahkan sebagai kasih yang teguh serta setia.
- source_word: הַצִּילֵנִי
  choice: lepaskanlah aku
  rationale: Bentuk kausatif dari נצל meminta pembebasan dari bahaya atau kuasa musuh; 'lepaskanlah aku' sesuai dengan konteks dan ragam mazmur.
theological_decisions:
- issue: Dua sebutan ilahi יְהוָה אֲדֹנָי
  choice: ya TUHAN, Tuhanku
  alternative: ya Yahweh, Tuhanku; ya Tuhan ALLAH
  rationale: Teks Masoret memuat nama ilahi dan gelar yang berbeda secara berurutan. Terjemahan mempertahankan keduanya dan menggunakan konvensi Indonesia 'TUHAN' untuk YHWH, sedangkan bentuk kedua menyatakan sapaan pribadi 'Tuhanku'.
- issue: Arah tindakan dalam עֲשֵׂה אִתִּי
  choice: bertindaklah bagiku
  alternative: perlakukanlah aku; lakukanlah bagiku; bertindaklah terhadapku
  rationale: Konteks permohonan dan klausa tentang kasih setia mengarah pada tindakan yang menguntungkan pemazmur, tetapi bahasa sumber sendiri luas. Rumusan ini menyampaikan arah permohonan tanpa menentukan bentuk pertolongan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang khidmat tetapi mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam teks keagamaan Indonesia. Pemenggalan menjadi dua kalimat menjaga hubungan sebab-akibat sambil menghasilkan sintaksis Indonesia yang alami.
