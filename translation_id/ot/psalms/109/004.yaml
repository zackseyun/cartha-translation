  text: In return for my love[a], they accuse me, but I am prayer.
translation:
  language: id
  text: Sebagai balasan atas kasihku, mereka menuduh aku, tetapi aku adalah doa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “tetapi aku berdoa” atau “tetapi aku seorang pendoa.” Secara harfiah, teks Ibrani berbunyi, “tetapi aku adalah doa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Sebagai balasan atas
  rationale: Kata ini menyatakan pertukaran atau balasan, bukan makna tempat 'di bawah'. Frasa ini mempertahankan ironi bahwa kasih dibalas dengan permusuhan.
- source_word: אַהֲבָתִי
  choice: kasihku
  rationale: Bentuk ini secara langsung berarti 'kasihku' dan mempertahankan hubungan leksikal dengan istilah umum Alkitab untuk kasih.
- source_word: יִשְׂטְנוּנִי
  choice: mereka mendakwa aku
  rationale: Verba dari akar שטן berarti bertindak sebagai lawan atau pendakwa. 'Mendakwa' mempertahankan nuansa adversarial dan kemungkinan forensiknya.
- source_word: וַאֲנִי
  choice: tetapi aku
  rationale: Walaupun ו secara formal dapat berarti 'dan', konteks menunjukkan pertentangan antara tindakan mereka dan sikap pemazmur.
- source_word: תְפִלָּה
  choice: doa
  rationale: Teks Ibrani memakai klausa nominal yang padat, secara harfiah 'aku [adalah] doa'. Mempertahankan nomina menjaga daya ungkap dan ambiguitas aslinya.
theological_decisions:
- issue: Daya ungkap klausa tanpa verba וַאֲנִי תְפִלָּה
  choice: tetapi aku adalah doa
  alternative: tetapi aku berdoa; tetapi aku seorang yang tekun berdoa
  rationale: Terjemahan utama mempertahankan ungkapan nominal yang mencolok dan tidak menentukan secara diam-diam apakah maksudnya tindakan berdoa atau watak sebagai orang yang berdoa. Alternatif yang lebih eksplisit dicantumkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Ungkapan 'aku adalah doa' sengaja dipertahankan karena kepadatan puitisnya; catatan kaki membantu pembaca memahami kemungkinan maksud tanpa menghapus ambiguitas teks.
