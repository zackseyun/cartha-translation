  text: Sebab aku miskin dan berkekurangan, dan hatiku terluka[a] di dalam diriku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tertikam” atau “terluka parah”. Kata kerja Ibrani ini dapat menggambarkan keadaan tertikam, terluka, atau mengalami luka yang mematikan.
