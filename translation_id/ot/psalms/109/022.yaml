lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan yang mendasari permohonan dalam konteks dan mempertahankan hubungan antarkalimat secara wajar.
- source_word: עָנִי
  choice: miskin
  rationale: Kata ini dapat menunjuk pada orang miskin, tertindas, atau sengsara. Dalam pasangan dengan אֶבְיוֹן, “miskin” mempertahankan makna kekurangan dan keadaan tertekan tanpa mempersempitnya secara berlebihan.
- source_word: אֶבְיוֹן
  choice: berkekurangan
  rationale: Mengungkapkan keadaan membutuhkan pertolongan dan membedakannya dari עָנִי, sekaligus menghasilkan pasangan yang alami dalam bahasa Indonesia.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina mandiri ini bersifat eksplisit dan memberi penekanan pada keadaan pemazmur; bentuk “aku” sesuai dengan tuturan doa pribadi.
- source_word: לִבִּי
  choice: hatiku
  rationale: Mempertahankan citra Ibrani tentang hati sebagai pusat kehidupan batin, termasuk perasaan, pikiran, dan kehendak.
- source_word: חָלַל
  choice: terluka
  rationale: Dalam konteks ini kata tersebut menggambarkan luka batin yang berat. “Terluka” alami dalam bahasa Indonesia dan tidak menutup kemungkinan nuansa tertikam atau terpukul secara mematikan.
- source_word: בְּקִרְבִּי
  choice: di dalam diriku
  rationale: Menyatakan lokasi batiniah secara eksplisit dan mempertahankan ungkapan sumber, meskipun “hatiku” sendiri sudah menyiratkan keadaan batin.
