  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
translation:
  language: id
  text: Kiranya kesalahan[a] para leluhurnya[b] diingat di hadapan Yahweh, dan dosa ibunya jangan dihapuskan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kejahatan” atau “tanggungan akibat dosanya.” Kata Ibrani עָוֹן dapat menunjuk pada perbuatan salah, kesalahan, atau tanggungan yang timbul dari dosa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapa-bapanya”; dapat berarti para pendahulu laki-laki atau para leluhur.
    reason: lexical_alternative
  - marker: c
    text: Atau “jangan dilenyapkan.” Kata Ibrani ini menggambarkan tindakan menghapus atau melenyapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  choice: kiranya ... tetap diingat
  rationale: Bentuk Nifal imperfek berfungsi sebagai ungkapan harapan dalam konteks kutukan. Bentuk pasif “diingat” mempertahankan bentuk Ibrani, sedangkan “kiranya” menyampaikan nuansa jusif; “tetap” membuat maksud berlanjutnya ingatan selaras dengan paralel bahwa dosa tidak dihapuskan.
- source_word: עֲוֺן
  choice: kesalahan
  rationale: עָוֹן dapat menunjuk pada perbuatan salah, kesalahan moral, atau tanggungan akibat dosa. “Kesalahan” merupakan padanan Indonesia yang alami dan cukup luas, sementara catatan kaki mempertahankan rentang maknanya.
- source_word: אֲבֹתָיו
  choice: para leluhurnya
  rationale: Secara harfiah berarti “bapa-bapanya,” tetapi dalam konteks ini menunjuk kepada para pendahulu dalam garis keluarga. “Para leluhurnya” jelas dan alami dalam bahasa Indonesia modern tanpa membatasi rujukan hanya kepada ayah kandung.
- source_word: אֶל יְהוָה
  choice: di hadapan Yahweh
  rationale: Dengan verba “mengingat,” אֶל menyatakan bahwa perkara itu tetap berada dalam ingatan atau perhatian Yahweh. “Di hadapan” mempertahankan nuansa kehadiran dan pertanggungjawaban.
- source_word: וְחַטַּאת
  choice: dan dosa
  rationale: חַטָּאת di sini berarti dosa, bukan kurban penghapus dosa, dan berparalel dengan עָוֹן.
- source_word: אִמּוֹ
  choice: ibunya
  rationale: Padanan langsung dan alami bagi bentuk nomina dengan akhiran kepunyaan orang ketiga maskulin tunggal.
- source_word: אַל תִּמָּח
  choice: jangan dihapuskan
  rationale: אַל dengan bentuk imperfek menyatakan harapan atau larangan negatif. Bentuk pasif “dihapuskan” mempertahankan citra penghapusan dari suatu catatan dan paralelnya dengan “diingat”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Tanggungan antargenerasi dalam bahasa kutukan mazmur
  choice: Mempertahankan permohonan agar kesalahan para leluhur diingat
  alternative: Menafsirkan ulang sebagai akibat dosa leluhur yang hanya dialami tokoh itu
  rationale: Ayat ini berbentuk permohonan kutukan dan secara eksplisit menyebut kesalahan para leluhur serta dosa ibu. Terjemahan mempertahankan ketegangan teologis tersebut tanpa menerangkan atau melunakkannya di dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan paralel antara “diingat” dan “jangan dihapuskan” dipertahankan. “Para leluhur” dipilih agar ungkapan jamak Ibrani mudah dipahami, dengan bentuk harfiahnya dijelaskan dalam catatan kaki.
