  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to put them to death.
translation:
  language: id
  text: sebab ia tidak ingat untuk menunjukkan kebaikan[a], malah mengejar orang yang miskin dan berkekurangan, serta orang yang remuk hati[b], untuk membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk berbuat baik” atau “untuk menunjukkan belas kasihan.” Kata Ibrani חֶסֶד juga dapat berarti kasih yang teguh atau kesetiaan dalam ikatan perjanjian; di sini kata itu menunjuk pada kebaikan nyata terhadap orang-orang rentan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seorang miskin dan berkekurangan, dan seorang yang remuk hati.” Bentuk tunggal ini kemungkinan bersifat representatif, yaitu menggambarkan jenis orang yang menjadi sasaran pengejarannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: sebab
  rationale: Ungkapan ini memperkenalkan alasan bagi hukuman dalam konteks sekitarnya; “sebab” mempertahankan hubungan kausal secara wajar dan bermartabat.
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  choice: tidak ingat untuk menunjukkan kasih setia
  rationale: זָכַר dengan infinitif menyatakan kegagalan mengingat sesuatu sehingga melakukannya. חֶסֶד mencakup kebaikan, belas kasihan, dan kesetiaan dalam relasi; “kasih setia” mempertahankan keluasan maknanya, dengan alternatif kontekstual dijelaskan dalam catatan.
- source_word: וַיִּרְדֹּף
  choice: malah mengejar
  rationale: Kata kerja ini secara harfiah berarti mengejar. “Malah” menyatakan pertentangan kontekstual antara tidak menunjukkan kasih setia dan secara aktif memburu orang rentan, tanpa mengubah citra verba sumber.
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  choice: orang yang miskin dan berkekurangan
  rationale: אִישׁ berbentuk tunggal dan kemungkinan bersifat representatif. “Orang” mempertahankan ketunggalan semantis secara alami, sedangkan “miskin dan berkekurangan” menyampaikan dua istilah kerentanan yang berpasangan.
- source_word: וְנִכְאֵה לֵבָב
  choice: serta yang remuk hati
  rationale: נִכְאֵה menunjuk pada keadaan tertindih atau remuk; bersama לֵבָב, frasa ini menggambarkan kehancuran batin. “Remuk hati” mempertahankan citra sumber dan tetap mudah dipahami.
- source_word: לְמוֹתֵת
  choice: untuk membunuh mereka
  rationale: Infinitif ini menyatakan tujuan atau hasil mematikan dari pengejaran. “Membunuh” langsung dan alami dalam bahasa Indonesia; “mereka” merujuk secara kolektif kepada orang-orang rentan yang digambarkan oleh bentuk tunggal representatif.
