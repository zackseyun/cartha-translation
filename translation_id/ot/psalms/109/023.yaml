  text: Like a shadow when it lengthens[a], I am gone[c][b]; I am shaken off like a locust.
translation:
  language: id
  text: Seperti bayang-bayang yang memanjang[a], aku berlalu[b]; aku dihalau seperti belalang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika ia beralih” atau “ketika ia merentang”; kata kerja Ibrani dapat menggambarkan bayang-bayang yang memanjang atau beralih menjelang petang.
    reason: lexical_alternative
  - marker: b
    text: Atau “aku lenyap” atau “aku pergi”; secara harfiah, bahasa Ibrani memakai bentuk dari kata kerja “pergi/berjalan”, yang di sini dipakai secara puitis untuk menyatakan pergi atau lenyap.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani biasanya berarti “belalang”; dalam konteks tertentu kata ini dapat menunjuk secara khusus pada belalang yang berkawanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֵל
  choice: Seperti bayang-bayang
  rationale: Prefiks כְּ menyatakan perbandingan, sedangkan צֵל berarti “bayang-bayang”. Bentuk ini mempertahankan perumpamaan Ibrani secara alami dalam bahasa Indonesia.
- source_word: כִּנְטוֹתוֹ
  choice: yang memanjang
  rationale: Berasal dari נטה, yang dapat berarti “merentang”, “memanjang”, “condong”, atau “beralih”. Dalam gambaran bayang-bayang, “memanjang” menyampaikan geraknya menjelang petang tanpa menutup kemungkinan nuansa beralih atau menyusut.
- source_word: נֶהֱלָכְתִּי
  choice: aku berlalu
  rationale: Bentuk Nifal dari הלך secara harfiah berhubungan dengan pergi atau berjalan, tetapi dalam konteks puitis ini menyatakan lenyap atau lewatnya kehidupan. “Aku berlalu” mempertahankan citra kefanaan dan kedekatannya dengan verba sumber.
- source_word: נִנְעַרְתִּי
  choice: aku dikebaskan
  rationale: Bentuk Nifal dari נער berarti diguncang, dikibaskan, atau dilepaskan dengan mengguncang. “Dikebaskan” mempertahankan gambaran pasif tentang sesuatu yang dengan mudah disingkirkan.
- source_word: כָּאַרְבֶּה
  choice: seperti belalang
  rationale: אַרְבֶּה biasanya menunjuk pada belalang, khususnya jenis yang dapat berkawanan. “Belalang” merupakan padanan Indonesia yang wajar dan tidak memaksakan spesies yang lebih khusus daripada konteks.
