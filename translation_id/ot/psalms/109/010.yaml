  text: May his children wander about and beg[a]; may they seek from their ruins.
translation:
  language: id
  text: Biarlah anak-anaknya terus mengembara dan mengemis; biarlah mereka mencari-cari dari reruntuhan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mencari-cari jauh dari reruntuhan mereka.” Kata depan Ibrani dapat menunjukkan asal atau pemisahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֹועַ יָנוּעוּ
  choice: terus mengembara
  rationale: Gabungan infinitif absolut dan bentuk imperfek menegaskan tindakan נוע. Dalam konteks kutukan berbentuk harapan, “biarlah ... terus mengembara” menyampaikan daya intensif dan nuansa yusif secara alami.
- source_word: בָנָיו
  choice: anak-anaknya
  rationale: בנים dapat berarti “anak-anak lelaki” atau “anak-anak” secara umum. Konteks ini tidak menuntut pembatasan pada jenis kelamin tertentu.
- source_word: וְשִׁאֵלוּ
  choice: dan mengemis
  rationale: Walaupun שאל lazimnya berarti “meminta”, konteks pengembaraan dan kehancuran mendukung arti meminta sedekah atau mengemis.
- source_word: וְדָרְשׁוּ
  choice: biarlah mereka mencari-cari
  rationale: דרש berarti mencari atau menyelidiki. “Mencari-cari” mempertahankan ketiadaan objek yang dinyatakan dalam bahasa Ibrani dan terdengar wajar dalam bahasa Indonesia.
- source_word: מֵחָרְבוֹתֵיהֶם
  choice: di antara reruntuhan mereka
  rationale: חרבות menunjuk pada reruntuhan atau tempat-tempat yang telah hancur. מן dapat dipahami sebagai sumber atau sebagai pemisahan; dalam konteks ini, “di antara reruntuhan mereka” menyampaikan pencarian yang berlangsung dari lingkungan reruntuhan tanpa menambahkan objek yang tidak disebutkan.
theological_decisions: []
