  text: עָ֭זְרֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י ה֭וֹשִׁיעֵ֣/נִי כְ/חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/026.yaml
  text: Help me[a], O Yahweh my God; save me according to your steadfast love.
translation:
  language: id
  text: Tolonglah aku, ya Yahweh, Allahku; selamatkanlah aku sesuai dengan kasih setia-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “selamatkanlah aku selaras dengan kesetiaan-Mu pada perjanjian.” Kata Ibrani חֶסֶד menunjuk pada kasih yang loyal dan teguh serta dapat mengandung nuansa perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנִי
  choice: Tolonglah aku
  rationale: Bentuk imperatif עזר dengan akhiran orang pertama tunggal menyampaikan permohonan langsung dan mendesak. “Tolonglah aku” alami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal menjadi sapaan pribadi yang beraposisi dengan “Yahweh”.
- source_word: הוֹשִׁיעֵנִי
  choice: selamatkanlah aku
  rationale: Imperatif kausatif dari ישׁע dengan akhiran orang pertama tunggal. Pilihan ini mempertahankan makna luas penyelamatan atau pembebasan oleh Allah.
- source_word: כְחַסְדֶּךָ
  choice: sesuai dengan kasih setia-Mu
  rationale: Preposisi כְּ menunjukkan patokan atau ukuran, sedangkan חֶסֶד mencakup kasih yang teguh dan loyal, sering dengan nuansa relasi perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi mempertahankannya sebagai nama pribadi.
- issue: Nuansa חֶסֶד
  choice: kasih setia
  alternative: kesetiaan pada perjanjian
  rationale: “Kasih setia” mempertahankan cakupan kasih, loyalitas, dan keteguhan tanpa membatasi istilah itu hanya pada satu penafsiran teologis; nuansa perjanjiannya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel “ya” menandai sapaan langsung, sedangkan akhiran “-lah” mempertahankan bentuk permohonan yang sungguh-sungguh tanpa terdengar kaku.
