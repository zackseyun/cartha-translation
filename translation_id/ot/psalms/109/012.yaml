  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
translation:
  language: id
  text: Janganlah ada seorang pun yang mengulurkan kebaikan kepadanya[a], dan janganlah ada seorang pun yang menunjukkan belas kasih kepada anak-anaknya yang yatim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang meneruskan kebaikan kepadanya.” Ungkapan Ibrani secara harfiah berbicara tentang “mengulurkan” kebaikan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “anak-anak yatimnya.” Kata Ibrani sering kali menunjuk secara khusus kepada anak yang kehilangan ayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹש׵ךְ
  choice: terus menunjukkan
  rationale: Partisipel dari משׁךְ secara harfiah berarti 'menarik/mengulurkan'; bersama חָסֶד, ungkapan ini menyatakan tindakan meneruskan atau memperpanjang kebaikan kepada seseorang.
- source_word: חָסֶד
  choice: kasih setia
  rationale: חָסֶד dapat mencakup kebaikan, belas kasihan, dan kesetiaan. 'Kasih setia' mempertahankan keluasan nuansa itu tanpa membatasi maknanya hanya pada perasaan iba.
- source_word: חוֹנֵן
  choice: mengasihani
  rationale: Dalam konteks anak-anak yatim yang rentan, חנן menunjuk pada pemberian belas kasih atau kemurahan; 'mengasihani' alami dalam bahasa Indonesia dan mempertahankan daya permohonannya.
- source_word: יְתוֹמָיו
  choice: anak-anaknya yang telah menjadi yatim
  rationale: יָתוֹם menunjuk pada anak yatim, sering kali khususnya anak yang kehilangan ayah. Bentuk bersufiks berarti 'anak-anak yatimnya'; ungkapan ini memperjelas bahwa mereka menjadi yatim karena kehilangan orang yang dibicarakan.
- source_word: אַל יְהִי
  choice: Janganlah ada seorang pun
  rationale: Konstruksi yusif negatif ini menyatakan harapan atau permohonan agar tidak ada orang yang melakukan tindakan tersebut, bukan sekadar ramalan.
theological_decisions:
- issue: Mempertahankan kekuatan permohonan kutukan
  choice: 'Menerjemahkan kedua klausa sebagai permohonan langsung: ''Janganlah ada seorang pun...'''
  alternative: 'Mengubahnya menjadi pernyataan masa depan: ''Tidak akan ada seorang pun...'''
  rationale: Bentuk yusif Ibrani menyampaikan harapan atau seruan langsung. Terjemahan tidak melunakkan ketegangan teologis mazmur kutukan menjadi ramalan deskriptif.
- issue: Nuansa חָסֶד dalam tindakan manusia
  choice: kasih setia
  alternative: kebaikan; belas kasihan
  rationale: Istilah Ibrani tetap dapat memuat unsur kebaikan penuh kesetiaan sekalipun pelakunya manusia. Catatan kaki mempertahankan alternatif yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'janganlah ada seorang pun' mempertahankan kesejajaran dan tekanan retoris teks Ibrani; bentuk kutukan tidak diperhalus.
