  text: וַ/יֶּאֱהַ֣ב קְ֭לָלָה וַ/תְּבוֹאֵ֑/הוּ וְֽ/לֹא חָפֵ֥ץ בִּ֝/בְרָכָ֗ה וַ/תִּרְחַ֥ק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/017.yaml
  text: He loved cursing[a], and it came upon him; he did not delight in blessing[b], and it was far from him.
translation:
  language: id
  text: Ia mencintai kutuk[a], maka kutuk itu menimpanya; ia tidak menyukai berkat[b], maka berkat itu menjauh darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu kutuk.” Kata benda Ibrani ini dapat menunjuk pada kutuk sebagai suatu hal secara umum atau pada satu kutuk tertentu.
    reason: lexical_alternative
  - marker: b
    text: Atau “ia tidak berkenan pada berkat” atau “ia tidak bersukacita dalam berkat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: ia mencintai
  rationale: Bentuk Qal wayyiqtol dari אהב menyatakan kasih, kesukaan, atau hasrat; “mencintai” mempertahankan daya kehendak dan kontras afektif dengan klausa berikutnya.
- source_word: קְלָלָה
  choice: kutuk
  rationale: Nomina ini dapat menunjuk pada tindakan atau ranah mengutuk maupun suatu kutuk tertentu. “Kutuk” dalam bahasa Indonesia dapat mempertahankan keluasan tersebut.
- source_word: וַתְּבוֹאֵהוּ
  choice: maka kutuk itu menimpanya
  rationale: Secara harfiah kutuk itu “datang kepadanya”; “menimpanya” secara alami menyampaikan datangnya akibat buruk. Subjek diulang agar rujukannya jelas dalam bahasa Indonesia.
- source_word: וְלֹא חָפֵץ
  choice: ia tidak menyukai
  rationale: חפץ mencakup keinginan, kesukaan, dan kesenangan. “Tidak menyukai” alami dan mempertahankan kontras dengan “mencintai” tanpa memperkuatnya secara berlebihan.
- source_word: בִּבְרָכָה
  choice: berkat
  rationale: Nomina ini berpasangan secara antitetis dengan קְלָלָה dan paling wajar diterjemahkan sebagai kategori umum “berkat”.
- source_word: וַתִּרְחַק מִמֶּנּוּ
  choice: maka berkat itu menjauh darinya
  rationale: רחק berarti menjadi atau berada jauh. “Menjauh darinya” mempertahankan gerak/resultativitas bentuk wayyiqtol tanpa menambahkan gagasan durasi. Subjek diulang demi kejelasan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan lugas. Paralel antitetis antara “kutuk” dan “berkat” dipertahankan; pengulangan kedua nomina memperjelas rujukan pronominal yang ditandai oleh bentuk feminin dalam bahasa Ibrani.
