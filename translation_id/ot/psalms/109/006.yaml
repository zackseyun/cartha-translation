base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/006.yaml
  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
translation:
  language: id
  text: Angkatlah seorang fasik sebagai penguasanya, dan biarlah seorang pendakwa berdiri di sebelah kanannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pendakwa” juga dapat berarti “lawan” atau “penentang”; dalam konteks tertentu kata itu dapat dipahami sebagai nama diri “Satan”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְקֵד
  choice: Tempatkanlah ... untuk berkuasa
  rationale: Bentuk imperatif Hifil dari פקד menyatakan tindakan menempatkan atau mengangkat seseorang atas orang lain. Ungkapan ini mempertahankan daya imperatif sekaligus memperjelas hubungan kewenangan dalam bahasa Indonesia alami.
- source_word: עָלָיו
  choice: atas dia
  rationale: Dengan פקד, preposisi על secara wajar menandai orang yang berada di bawah kuasa pihak yang ditempatkan; karena itu makna 'atas dia' dipertahankan, bukan 'melawan dia'.
- source_word: רָשָׁע
  choice: seorang yang fasik
  rationale: Kata ini menunjuk kepada orang yang jahat atau bersalah secara moral. 'Seorang yang fasik' merupakan ungkapan Alkitabiah yang tetap jelas dalam bahasa Indonesia modern.
- source_word: שָׂטָן
  choice: seorang pendakwa
  rationale: Dalam konteks bernuansa pengadilan ini, שָׂטָן paling langsung berfungsi sebagai nomina umum bagi orang yang menuduh. Pilihan ini tidak mengharuskan pembacaan sebagai nama diri, tetapi kemungkinan itu dicatat dalam catatan kaki.
- source_word: יַעֲמֹד
  choice: biarlah ... berdiri
  rationale: Bentuk imperfek sesudah imperatif memiliki nuansa yusif, yaitu harapan atau seruan. 'Biarlah ... berdiri' mempertahankan nuansa kutukan permohonan tersebut.
- source_word: עַל יְמִינוֹ
  choice: di sebelah kanannya
  rationale: Ungkapan ini menunjukkan posisi di sisi kanan seseorang, di sini kemungkinan dalam suasana hukum. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan gambaran posisi aslinya.
theological_decisions:
- issue: Apakah שָׂטָן merupakan nama diri 'Iblis/Satan' atau nomina umum
  choice: 'Nomina umum: ''seorang pendakwa'''
  alternative: '''Satan'' atau ''seorang lawan'''
  rationale: Teks Ibrani tidak mengharuskan nama diri, sedangkan konteks ayat berikutnya bernuansa pengadilan dan mendukung arti orang yang mendakwa. Catatan kaki mempertahankan kemungkinan tradisional 'Satan' serta arti umum lainnya tanpa memaksakan identifikasi demonologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan puitis serta daya imperatif dipertahankan. 'Di sebelah kanannya' dipilih agar idiom posisi hukum dapat dipahami pembaca umum.
