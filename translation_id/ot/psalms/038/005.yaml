  text: My wounds stink and fester because of my foolishness[a].
translation:
  language: id
  text: Luka-lukaku berbau busuk dan membusuk karena kebodohanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bilur-bilurku menjadi busuk dan membusuk akibat kebodohanku.”
    reason: Alternatif ini mempertahankan kemungkinan bahwa חַבּוּרֹת berarti “bilur-bilur” dan menerjemahkan dua verba pertama dengan ungkapan yang lebih dekat pada bentuk leksikalnya.
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: berbau busuk
  rationale: Bentuk Hifil dari באש menyatakan menjadi atau menimbulkan bau yang menjijikkan. Frasa ini alami dalam bahasa Indonesia dan mempertahankan gambaran fisik yang kuat.
- source_word: נָמַקּוּ
  choice: bernanah
  rationale: Kata kerja ini berarti membusuk, melapuk, atau merana. Dalam konteks luka, 'bernanah' menyampaikan kerusakan luka secara wajar, meskipun 'membusuk' merupakan alternatif yang lebih harfiah.
- source_word: חַבּוּרֹתַי
  choice: luka-lukaku
  rationale: Nomina ini dapat berarti luka, bilur, atau memar. Kata 'luka-lukaku' paling sesuai dengan predikat berbau busuk dan mengalami pembusukan.
- source_word: מִפְּנֵי
  choice: karena
  rationale: Preposisi ini di sini menyatakan sebab; 'karena' mengungkapkan hubungan kausal dengan jelas dan ringkas.
- source_word: אִוַּלְתִּי
  choice: kebodohanku
  rationale: Nomina ini menunjuk pada kebodohan atau tindakan bodoh dengan nuansa moral. 'Kebodohanku' jelas, modern, dan mempertahankan pengakuan diri pemazmur.
theological_decisions:
- issue: Hubungan sebab antara keadaan luka dan kebodohan pemazmur
  choice: karena kebodohanku
  alternative: akibat kebodohanku
  rationale: Teks Ibrani secara langsung mengaitkan keadaan pemazmur dengan kebodohannya sendiri. Terjemahan mempertahankan hubungan moral-kausal ini tanpa menjadikannya pernyataan umum mengenai sebab semua penderitaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Pengulangan jamak 'luka-lukaku' mempertahankan bentuk jamak sumber; gambaran fisik yang keras tidak diperhalus.
