  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: id
  text: Orang-orang yang mengasihiku dan sahabat-sahabatku berdiri jauh dari penderitaanku[a][b]; orang-orang dekatku[c] berdiri dari jauh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyakitku”, “pukulan yang menimpaku”, atau “lukaku”. Kata Ibrani ini dapat menunjuk pada pukulan, penyakit, atau luka.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “berdiri di hadapan penderitaanku” atau “berdiri berseberangan dengan penderitaanku”. Dalam konteks ini ungkapan tersebut dapat menyiratkan bahwa mereka berdiri terpisah atau menjaga jarak.
    reason: source_ambiguity
  - marker: c
    text: Atau “kerabatku”. Kata Ibrani ini dapat berarti orang yang dekat atau kerabat dekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבַי
  choice: orang-orang yang mengasihiku
  rationale: Bentuk partisip dengan akhiran orang pertama tunggal menunjuk kepada orang-orang yang mengasihi pemazmur. Ungkapan ini alami dalam bahasa Indonesia dan tidak menimbulkan kesan romantis yang tidak diperlukan.
- source_word: וְרֵעַי
  choice: dan sahabat-sahabatku
  rationale: רֵעַ dapat berarti sahabat, teman, atau rekan. 'Sahabat-sahabatku' sesuai dengan kesejajaran bersama orang-orang yang mengasihi pemazmur dan menonjolkan kedekatan pribadi.
- source_word: מִנֶּגֶד
  choice: jauh dari
  rationale: Secara leksikal נֶגֶד dapat berarti 'di hadapan' atau 'berseberangan dengan', tetapi dalam konteks penarikan diri secara sosial, frasa ini menyatakan bahwa mereka mengambil posisi terpisah atau berjarak. 'Jauh dari' menyampaikan adegan itu secara alami, sementara arti spasial yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: נִגְעִי
  choice: penderitaanku
  rationale: נֶגַע dapat menunjuk pada pukulan, luka, atau penyakit. 'Penderitaanku' cukup luas untuk mempertahankan ketidakpastian jenis kesusahan jasmani dalam konteks mazmur ini.
- source_word: יַעֲמֹדוּ
  choice: berdiri
  rationale: עמד menggambarkan tindakan mengambil atau mempertahankan posisi. 'Berdiri' mempertahankan gambaran spasial teks Ibrani.
- source_word: וּקְרוֹבַי
  choice: orang-orang dekatku
  rationale: קָרוֹב dapat menunjuk kepada kerabat dekat ataupun orang yang mempunyai hubungan dekat. 'Orang-orang dekatku' mempertahankan keluasan makna itu tanpa menetapkannya hanya sebagai keluarga.
- source_word: מֵרָחֹק
  choice: jauh-jauh
  rationale: Frasa ini dengan jelas menyatakan jarak. Pengulangan 'jauh-jauh' alami dalam puisi Indonesia dan menegaskan bahwa mereka menjaga jarak.
- source_word: עָמָדוּ
  choice: berdiri
  rationale: Walaupun bentuk Ibraninya perfektif, klausa kedua sejajar dengan klausa pertama dan melukiskan satu adegan yang sedang berlangsung; bentuk kini tanpa penanda waktu alami dalam bahasa Indonesia.
