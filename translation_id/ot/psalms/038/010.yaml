  yaml_path: translation/ot/psalms/038/010.yaml
  text: My heart throbs[a]; my strength has left me[b], and the light of my eyes—even they are not with me.
translation:
  language: id
  text: Jantungku berdebar-debar; kekuatanku telah meninggalkanku, dan cahaya mataku pun tidak menyertaiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “cahaya mataku” dapat merujuk pada penglihatan itu sendiri atau pada sinar dan daya hidup yang terpancar dari mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: jantungku
  rationale: Dalam konteks penderitaan jasmani dan kata berikutnya yang menggambarkan gerak atau denyutan yang tidak tenang, “jantungku” menyampaikan organ yang berdebar dengan lebih alami daripada “hatiku” dalam bahasa Indonesia.
- source_word: סְחַרְחַר
  choice: berdebar-debar
  rationale: Bentuk ini menggambarkan keadaan bergolak atau berputar; dalam hubungannya dengan jantung, “berdebar-debar” menyampaikan denyutan yang tidak tenang secara alami tanpa membuat diagnosis medis.
- source_word: עֲזָבַנִי כֹחִי
  choice: kekuatanku telah meninggalkanku
  rationale: Terjemahan ini mempertahankan personifikasi Ibrani bahwa kekuatan telah “meninggalkan” pemazmur, sekaligus tetap jelas dalam bahasa Indonesia.
- source_word: וְאוֹר עֵינַי
  choice: dan cahaya mataku
  rationale: Ungkapan puitis Ibrani dipertahankan karena dapat menunjuk pada penglihatan ataupun sinar dan daya hidup yang tampak pada mata.
- source_word: גַּם הֵם אֵין אִתִּי
  choice: pun tidak lagi menyertaiku
  rationale: “Pun” mempertahankan penekanan גַּם, sedangkan “tidak lagi menyertaiku” mengungkapkan אֵין אִתִּי secara wajar. Kata ganti jamak Ibrani tidak dinyatakan tersendiri agar tidak menimbulkan ketidakselarasan dengan frasa Indonesia “cahaya mataku” yang berinti tunggal.
