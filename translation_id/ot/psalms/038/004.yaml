lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang memberikan alasan bagi keluhan pemazmur dan mengalir alami dalam puisi Indonesia.
- source_word: עֲוֺנֹתַי
  choice: kesalahan-kesalahanku
  rationale: Menyatakan pelanggaran moral pemazmur dalam bahasa Indonesia yang wajar, sambil mempertahankan kemungkinan makna 'kesalahan yang mendatangkan rasa bersalah atau hukuman' dalam catatan kaki.
- source_word: עָבְרוּ רֹאשִׁי
  choice: telah melampaui kepalaku
  rationale: Mempertahankan gambaran konkret dalam bahasa Ibrani tentang sesuatu yang naik atau lewat hingga berada di atas kepala, tanpa menggantinya dengan tafsiran abstrak seperti 'menguasai aku'.
- source_word: כְּמַשָּׂא כָבֵד
  choice: seperti beban berat
  rationale: Padanan alami yang menjaga metafora fisik dari suatu muatan yang berat.
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: semuanya terlalu berat bagiku
  rationale: Mempertahankan permainan akar kata כבד dan menyampaikan bahwa kesalahan-kesalahan itu melampaui kemampuan pemazmur untuk menanggungnya.
theological_decisions:
- issue: Rentang makna עָוֹן dalam konteks pengakuan dosa
  choice: Kesalahan-kesalahanku, terutama menunjuk pada pelanggaran moral pemazmur
  alternative: Rasa bersalahku atau akibat hukuman dari kesalahanku
  rationale: Konteks menggambarkan pelanggaran pemazmur sebagai beban yang menenggelamkan dan tak tertanggungkan. Karena עָוֹן dapat menunjuk baik pada kesalahan maupun keadaan atau akibat kesalahan itu, teks utama memakai istilah yang berfokus pada pelanggaran, sedangkan catatan kaki mempertahankan cakupan lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan struktur paralel yang tetap jelas bagi pembaca umum. Metafora kepala yang dilampaui dan beban berat dipertahankan dari teks Ibrani.
