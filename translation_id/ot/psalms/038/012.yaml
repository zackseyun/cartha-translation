base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: id
  text: 'Orang-orang yang mengincar nyawaku[a] memasang jerat[b],

    dan orang-orang yang mengupayakan celakaku membicarakan kehancuran[c];

    sepanjang hari mereka menggumamkan tipu daya[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang mencari jiwaku.” Dalam konteks ini, ungkapan itu berarti orang-orang yang mengincar nyawa pemazmur.
    reason: lexical_alternative
  - marker: b
    text: Atau “memasang perangkap” atau “menaruh jerat.” Kata kerja Ibrani ini menggambarkan tindakan memasang jerat untuk menangkap.
    reason: lexical_alternative
  - marker: c
    text: Atau “membicarakan malapetaka” atau “mengucapkan hal-hal yang membawa kehancuran.”
    reason: lexical_alternative
  - marker: d
    text: Kata Ibrani yang diterjemahkan “menggumamkan” juga dapat berarti “merenungkan” atau “mengucapkan dengan suara rendah”; konteksnya menggambarkan ujaran penuh tipu daya yang terus berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: memasang jerat
  rationale: Kata kerja נקשׁ menggambarkan tindakan memasang jerat atau perangkap. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran penyergapan.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: orang-orang yang mengincar nyawaku
  rationale: Dalam konteks permusuhan, נֶפֶשׁ yang menjadi sasaran pencarian menunjuk pada nyawa atau kehidupan seseorang. 'Mengincar nyawaku' menyampaikan ancaman maut secara wajar.
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: orang-orang yang menghendaki celakaku
  rationale: Frasa ini menunjuk pada orang yang mengupayakan atau menginginkan kemalangan bagi pemazmur. 'Menghendaki celakaku' mempertahankan maksud jahat yang bersifat pribadi.
- source_word: דִּבְּרוּ הַוּוֹת
  choice: membicarakan kehancuran
  rationale: הַוּוֹת dapat menunjuk pada kehancuran, malapetaka, atau hal-hal yang merusak. Pilihan ini menjaga keluasan makna tanpa secara tegas mengubah ucapan itu menjadi rencana atau ancaman.
- source_word: וּמִרְמוֹת
  choice: tipu daya
  rationale: מִרְמוֹת adalah bentuk jamak yang menunjuk pada berbagai bentuk penipuan atau kelicikan; 'tipu daya' berfungsi secara kolektif dan alami dalam bahasa Indonesia.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Padanan Indonesia yang alami untuk ungkapan waktu ini dan menyampaikan kegiatan yang berlangsung terus-menerus.
- source_word: יֶהְגּוּ
  choice: menggumamkan
  rationale: הגה dapat berarti menggumam, melafalkan dengan suara rendah, atau merenungkan. Dalam konteks 'tipu daya', 'menggumamkan' mempertahankan unsur ujaran tanpa mempersempitnya menjadi tindakan menyusun siasat.
