lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: Orang-orang yang membalas
  rationale: Bentuk partisipel dari שלם menunjuk kepada orang-orang yang memberikan sesuatu sebagai balasan; 'membalas' mempertahankan nuansa timbal balik dan alami dalam bahasa Indonesia.
- source_word: רָעָה תַּחַת טוֹבָה
  choice: kebaikan dengan kejahatan
  rationale: Ungkapan ini menyatakan pertukaran yang berlawanan secara moral. Susunan Indonesia 'membalas kebaikan dengan kejahatan' paling alami sekaligus mempertahankan kontras antara רָעָה dan טוֹבָה.
- source_word: יִשְׂטְנוּנִי
  choice: memusuhi aku
  rationale: Kata kerja dari שטן berarti bertindak sebagai lawan atau musuh. 'Memusuhi aku' menyampaikan permusuhan aktif tanpa mempersempitnya menjadi tuduhan hukum.
- source_word: תַּחַת
  choice: karena
  rationale: Pada klausa kedua, kata ini secara harfiah menyatakan tindakan sebagai dasar atau balasan bagi permusuhan mereka. 'Karena' mengungkapkan hubungan logis itu secara wajar, sementara nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: רְדָפִי טוֹב
  choice: aku mengejar apa yang baik
  rationale: רדף menyatakan pengejaran aktif, sedangkan טוֹב digunakan secara substantival. Terjemahan ini mempertahankan citra mengejar dan menjelaskan objeknya secara alami.
theological_decisions:
- issue: Daya makna תַּחַת dalam klausa kedua
  choice: karena aku mengejar apa yang baik
  alternative: sebagai balasan karena aku mengejar yang baik; sebagai balasan atas tindakanku mengejar yang baik
  rationale: Bahasa Ibrani secara padat menggambarkan permusuhan mereka sebagai balasan atas pengejaran sang pemazmur terhadap kebaikan. Terjemahan utama memakai hubungan kausal yang alami, sedangkan catatan kaki mempertahankan bentuk dan nuansa balasan dari teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. 'Memusuhi' dipilih daripada 'menentang' untuk mempertahankan daya permusuhan שטן, dan 'mengejar' mempertahankan metafora aktif dari רדף.
