translation:
  language: id
  text: Orang-orang yang membalas kebaikan dengan kejahatan memusuhi aku[a], karena aku mengejar apa yang baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “mereka memusuhi aku sebagai balasan atas usahaku mengejar yang baik.”
