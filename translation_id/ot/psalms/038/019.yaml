  text: And my enemies are alive and strong[a], and those who hate me falsely are many.
translation:
  language: id
  text: Musuh-musuhku hidup dan kuat; orang-orang yang membenci aku secara palsu semakin banyak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa alasan.” Kata Ibrani שָׁקֶר secara harfiah berarti “dusta” atau “kepalsuan” dan dapat menggambarkan kepalsuan kebencian mereka ataupun kenyataan bahwa kebencian itu tidak berdasar.
