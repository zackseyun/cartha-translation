lexical_decisions:
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan alami untuk musuh atau lawan pribadi.
- source_word: חַיִּים
  choice: hidup
  rationale: Mempertahankan arti dasar adjektiva Ibrani dan kontras tersirat dengan keadaan pemazmur yang lemah.
- source_word: עָצֵמוּ
  choice: bertambah kuat
  rationale: Bentuk verba menyatakan menjadi kuat atau perkasa; pilihan ini mempertahankan unsur perkembangan keadaan.
- source_word: רַבּוּ
  choice: semakin banyak
  rationale: Menyampaikan makna menjadi banyak atau bertambah jumlahnya secara alami dalam bahasa Indonesia.
- source_word: שֹׂנְאַי
  choice: orang-orang yang membenci aku
  rationale: Mempertahankan daya verbal bentuk partisipial, bukan menyamakannya begitu saja dengan kata 'musuh'.
- source_word: שָׁקֶר
  choice: secara dusta
  rationale: Menjaga arti leksikal 'dusta/kepalsuan' dan membiarkan terbuka apakah kebencian mereka bersifat palsu atau tidak beralasan.
