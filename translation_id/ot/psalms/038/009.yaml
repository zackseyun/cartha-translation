id: PSA.38.9
reference: Psalms 38:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: id
  text: Tuhan, segala kerinduanku[a] ada di hadapan-Mu, dan rintihanku[b] tidak tersembunyi dari-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala keinginanku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “keluh kesahku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Sapaan langsung kepada Allah yang menerjemahkan gelar אֲדֹנָי, bukan nama ilahi YHWH.
- source_word: נֶגְדְּךָ
  choice: di hadapan-Mu
  rationale: Ungkapan alami dan bermartabat yang menyatakan bahwa kerinduan pemazmur terbuka dalam pandangan dan hadirat Allah.
- source_word: כָל
  choice: segala
  rationale: 'Mempertahankan cakupan menyeluruh: tidak ada bagian dari kerinduan pemazmur yang berada di luar pengetahuan Allah.'
- source_word: תַּאֲוָתִי
  choice: kerinduanku
  rationale: Dalam konteks ratapan, kata ini menunjuk pada hasrat atau kerinduan yang mendalam, bukan nafsu indrawi. Alternatif yang lebih umum dicantumkan dalam catatan kaki.
- source_word: וְאַנְחָתִי
  choice: dan rintihanku
  rationale: Menggambarkan ungkapan penderitaan yang dalam, baik terdengar maupun batiniah, tanpa menggeser maknanya menjadi keluhan berupa tuduhan.
- source_word: מִמְּךָ
  choice: dari-Mu
  rationale: Dengan verba pasif 'tersembunyi', preposisi ini menandai pihak yang darinya sesuatu dapat disembunyikan.
- source_word: לֹא נִסְתָּרָה
  choice: tidak tersembunyi
  rationale: Mempertahankan keadaan pasif dalam bentuk Niphal dan pengakuan langsung bahwa rintihan itu terbuka bagi Allah.
theological_decisions:
- issue: Sapaan ilahi memakai אֲדֹנָי, bukan nama YHWH
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks sumber memakai gelar אֲדֹנָי. Karena itu, terjemahan tidak menggunakan konvensi huruf kapital penuh yang lazim dikhususkan bagi tetragramaton YHWH.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang wajar dan bermartabat. Bentuk sapaan pronominal kepada Allah ditulis dengan huruf kapital sesuai konvensi umum penerbitan Alkitab Indonesia.
