  text: I am bent and bowed down very low[a]; all day long I go about mourning.
translation:
  language: id
  text: Aku terbungkuk dan merunduk sangat rendah; sepanjang hari aku berjalan dalam kemuraman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dengan muram" atau "sambil berkabung"; kata Ibrani ini dapat menggambarkan kegelapan, kemuraman, maupun perkabungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲוֵיתִי
  choice: Aku terbungkuk
  rationale: Bentuk dari עוה menyatakan keadaan bengkok, terpilin, atau membungkuk. 'Terbungkuk' alami dalam bahasa Indonesia dan, bersama verba berikutnya, menggambarkan keruntuhan jasmani serta batin tanpa menentukan penyebabnya.
- source_word: שַׁחֹתִי
  choice: dan sangat merunduk
  rationale: Bentuk dari שחח berarti membungkuk atau menjadi rendah. 'Merunduk' mempertahankan kesejajaran dan penguatan terhadap 'terbungkuk'; bentuk perfek dipahami sebagai keadaan yang sedang dialami dalam ratapan.
- source_word: עַד מְאֹד
  choice: sangat
  rationale: Frasa ini sangat menguatkan keadaan merunduk. Penempatan 'sangat' menghasilkan bahasa Indonesia yang wajar tanpa menghilangkan intensitas teks Ibrani.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan Indonesia modern dan idiomatis untuk durasi yang terus-menerus selama seluruh hari.
- source_word: קֹדֵר
  choice: dengan muram
  rationale: Partisip dari קדר dapat menyatakan keadaan gelap, suram, muram, atau berkabung. 'Dengan muram' mempertahankan citra kegelapan sekaligus keadaan emosional dan tidak mempersempit artinya hanya kepada tindakan berkabung.
- source_word: הִלָּכְתִּי
  choice: aku berjalan
  rationale: הלך secara dasar berarti berjalan atau pergi. 'Aku berjalan' mempertahankan citra gerak konkret dan dalam konteks ini juga dapat menunjukkan cara pemazmur menjalani harinya.
