  text: כִּֽי אֲ֭נִי לְ/צֶ֣לַע נָכ֑וֹן וּ/מַכְאוֹבִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/017.yaml
  text: For I am ready to fall, and my pain is always before me.
translation:
  language: id
  text: 'Sebab aku siap untuk jatuh,

    dan rasa sakitku selalu ada di hadapanku.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְצֶלַע
  choice: hampir jatuh
  rationale: Dalam konstruksi נָכוֹן לְצֶלַע, kata ini menunjuk pada keadaan terancam jatuh atau roboh. 'Hampir jatuh' menyampaikan bahaya yang sudah dekat secara alami dalam bahasa Indonesia tanpa mempersempitnya menjadi sekadar tersandung.
- source_word: נָכוֹן
  choice: hampir
  rationale: Secara harfiah berarti 'siap/ditetapkan'; bersama לְצֶלַע ungkapan ini menyatakan bahwa kejatuhan sudah mengancam. 'Hampir' merupakan padanan idiomatis yang jelas dalam konteks ratapan ini.
- source_word: מַכְאוֹבִי
  choice: rasa sakitku
  rationale: Bentuk tunggal dengan sufiks orang pertama dapat menunjuk pada rasa sakit atau penderitaan. 'Rasa sakitku' mempertahankan nuansa pengalaman personal dan selaras dengan konteks penderitaan jasmani dalam mazmur.
- source_word: נֶגְדִּי תָמִיד
  choice: selalu ada di hadapanku
  rationale: Menerjemahkan unsur 'di hadapanku' dan 'senantiasa' secara langsung, sambil memakai susunan Indonesia yang wajar.
theological_decisions:
- issue: Sifat kejatuhan yang dimaksud
  choice: jatuh
  alternative: tersandung; menjadi timpang
  rationale: Bahasa Ibrani memungkinkan citra kehilangan pijakan atau roboh tanpa menentukan apakah kejatuhan itu jasmani, sosial, atau metaforis. 'Jatuh' mempertahankan keluasan tersebut dan tidak memaksakan penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme dua baris dipertahankan; tidak diperlukan catatan kaki karena ambiguitas utama dapat dijaga dalam teks utama.
