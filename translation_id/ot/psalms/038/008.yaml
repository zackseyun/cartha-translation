  text: I am faint and utterly crushed; I roar because of the groaning of my heart.
translation:
  language: id
  text: Aku lemah dan remuk sekali; aku mengaum karena erangan hatiku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְפוּג֣וֹתִי
  choice: Aku lemah
  rationale: Bentuk ini menyatakan keadaan lesu, lunglai, atau kehilangan daya; 'lemah' menyampaikannya secara alami tanpa mempersempitnya menjadi pingsan.
- source_word: וְנִדְכֵּ֣יתִי עַד־מְאֹ֑ד
  choice: dan remuk sekali
  rationale: '''Remuk'' mempertahankan daya metaforis נִדְכֵּיתִי, sedangkan עַד־מְאֹד dinyatakan dengan ''sekali''.'
- source_word: שָׁ֝אַ֗גְתִּי
  choice: aku mengaum
  rationale: Kata kerja ini secara kuat berarti mengaum atau meraung seperti singa, bukan sekadar mengerang; 'mengaum' mempertahankan intensitas citra sumber.
- source_word: מִֽנַּהֲמַ֥ת לִבִּֽי
  choice: karena erangan hatiku
  rationale: Preposisi מִן di sini paling alami menyatakan sebab, dan נַהֲמַת menunjuk pada erangan atau gemuruh batin yang berasal dari hati.
theological_decisions:
- issue: Hubungan antara auman pemazmur dan suara batinnya
  choice: aku mengaum karena erangan hatiku
  alternative: aku meraung karena gejolak hatiku
  rationale: Terjemahan mempertahankan pembedaan dalam teks antara teriakan keras pemazmur (שׁאג) dan erangan batin hatinya (נהמה), tanpa menafsirkan keadaan itu sebagai doktrin atau pengalaman rohani tertentu.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, puitis, dan bermartabat. Paralelisme serta intensitas emosional teks Ibrani dipertahankan; titik koma memisahkan keadaan pemazmur dari luapan suaranya.
