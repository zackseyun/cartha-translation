  text: ח֥וּשָׁ/ה לְ/עֶזְרָתִ֑/י אֲ֝דֹנָ֗/י תְּשׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/022.yaml
  text: Hurry to help me[a], Lord[b], my salvation.
translation:
  language: id
  text: Segeralah menolong aku, ya Tuhan, keselamatanku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּשָׁה
  choice: Segeralah
  rationale: Bentuk imperatif ini menyatakan permohonan mendesak agar Tuhan bertindak cepat; “segeralah” alami, ringkas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: לְעֶזְרָתִי
  choice: menolong aku
  rationale: Secara harfiah berarti “untuk pertolonganku”; ungkapan verbal “menolong aku” menyampaikan maksudnya secara alami tanpa menghilangkan arah permohonan.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: אֲדֹנָי merupakan gelar ilahi baku “Tuhan”; partikel vokatif “ya” memperjelas bahwa pemazmur sedang menyapa Tuhan secara langsung.
- source_word: תְּשׁוּעָתִי
  choice: keselamatanku
  rationale: Kata benda ini berarti keselamatan atau pembebasan. “Keselamatanku” mempertahankan bentuk nomina, hubungan posesif, dan keluasan makna istilah Ibrani.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: ya Tuhan
  alternative: ya Tuhanku
  rationale: Dalam pemakaian ini אֲדֹנָי berfungsi sebagai gelar ilahi baku. “Ya Tuhan” mempertahankan sapaan langsung tanpa menonjolkan unsur posesif yang tidak harus dipahami secara produktif dalam bentuk tersebut.
- issue: Makna תְּשׁוּעָתִי
  choice: keselamatanku
  alternative: pembebasanku
  rationale: “Keselamatanku” mempertahankan keluasan istilah yang dapat mencakup penyelamatan atau pembebasan, tanpa mempersempitnya pada satu jenis bahaya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, ringkas, dan bernada doa. Susunan akhir mempertahankan aposisi padat dalam bahasa Ibrani: Tuhan disebut sebagai “keselamatanku”.'
