  text: כִּֽי חִ֭צֶּי/ךָ נִ֣חֲתוּ בִ֑/י וַ/תִּנְחַ֖ת עָלַ֣/י יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/002.yaml
  text: For your arrows have sunk into me[b][a], and your hand has come down on me.
translation:
  language: id
  text: Sebab anak-anak panah-Mu telah menancap dalam diriku,[a] dan tangan-Mu telah turun menimpa aku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah menembus aku” atau “telah menghantam aku.” Kata kerja Ibraninya secara lebih harfiah berarti “telah turun”; di sini kata itu menggambarkan anak panah yang masuk dan tertancap pada pemazmur.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tangan-Mu.” Ini adalah gambaran Ibrani tentang tindakan atau kuasa Allah, di sini dialami sebagai tekanan penderitaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan yang mendasari keluhan dan mempertahankan hubungan kausal dengan konteks sebelumnya.
- source_word: חִצֶּיךָ
  choice: anak-anak panah-Mu
  rationale: Mempertahankan metafora konkret tentang serangan atau penderitaan yang berasal dari Allah.
- source_word: נִחֲתוּ בִי
  choice: telah menancap dalam diriku
  rationale: Verba נחת pada dasarnya menggambarkan gerakan turun; bersama gambaran anak panah dan preposisi ב, ungkapan ini secara alami menyatakan anak panah yang masuk lalu tertancap. Pilihan ini mempertahankan gambaran tanpa sekadar menggantinya dengan makna abstrak seperti 'menyakiti'.
- source_word: וַתִּנְחַת עָלַי
  choice: telah turun menimpa aku
  rationale: Mempertahankan gerak ke bawah dari akar נחת serta tekanan yang tersirat oleh tangan yang datang ke atas pemazmur.
- source_word: יָדֶךָ
  choice: tangan-Mu
  rationale: Menerjemahkan gambaran antropomorfis Ibrani secara langsung tanpa menguraikannya sebagai kuasa, hukuman, atau disiplin.
theological_decisions:
- issue: Bahasa antropomorfis bagi tindakan Allah
  choice: Mempertahankan 'tangan-Mu' secara harfiah
  alternative: kuasa-Mu; hukuman-Mu
  rationale: Teks Ibrani memakai citra tubuh yang konkret. Terjemahan tidak menentukan apakah tangan itu secara khusus menunjuk pada kuasa, hukuman, atau disiplin, sehingga ketegangan penafsirannya tetap terjaga.
- issue: Sifat penderitaan yang digambarkan oleh anak panah
  choice: Mempertahankan metafora anak panah yang menancap
  alternative: Engkau telah menyakiti atau menghukum aku
  rationale: Teks tidak menjelaskan metafora itu menjadi kategori teologis tertentu; karena itu gambaran aslinya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Bentuk 'anak-anak panah' mempertahankan jamak Ibrani; akhiran hormat ilahi ditulis dengan huruf kapital. Pengulangan arah ke bawah dari akar נחת dipertahankan melalui 'menancap' pada baris pertama dan 'turun menimpa' pada baris kedua.
