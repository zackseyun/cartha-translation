  text: יְֽהוָ֗ה אַל בְּ/קֶצְפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וּֽ/בַ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], nor discipline me in your wrath.
translation:
  language: id
  text: Ya Yahweh[a], janganlah menegur aku[b] dalam murka-Mu, dan janganlah menghajar aku[c] dalam amarah-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber.
  - marker: b
    text: 'Atau: mengoreksi aku.'
    reason: יכח dapat berarti menegur, menyatakan kesalahan, atau mengoreksi.
  - marker: c
    text: 'Atau: mendisiplin aku.'
    reason: יסר dapat menunjuk pada disiplin atau didikan melalui koreksi; “menghajar” merupakan padanan yang lebih kuat dalam konteks ini.
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”; partikel seru “Ya” menyampaikan sapaan langsung dalam doa secara alami dalam bahasa Indonesia.
- source_word: אַל
  choice: janganlah
  rationale: Partikel larangan ini mengawali permohonan negatif. “Janganlah” sesuai dengan ragam doa yang wajar dan bermartabat.
- source_word: בְּקֶצְפְּךָ
  choice: dalam murka-Mu
  rationale: קֶצֶף menyatakan kemarahan atau kemurkaan, khususnya ketidaksenangan ilahi. “Murka” mempertahankan bobot ungkapannya dan preposisi ב diterjemahkan “dalam”.
- source_word: תוֹכִיחֵנִי
  choice: menegur aku
  rationale: Bentuk Hifil dari יכח di sini berarti menegur, menyatakan kesalahan, atau mengoreksi. “Menegur aku” alami dan tetap mempertahankan unsur korektif.
- source_word: וּבַחֲמָתְךָ
  choice: dan ... dalam amarah-Mu
  rationale: חֵמָה berarti amarah atau murka yang menyala. “Amarah” membedakannya secara halus dari קֶצֶף tanpa memaksakan perbedaan makna yang terlalu tajam; ו diterjemahkan “dan”, sementara larangan kedua dinyatakan kembali demi kejelasan bahasa Indonesia.
- source_word: תְיַסְּרֵנִי
  choice: mendisiplinkan aku
  rationale: Bentuk Piel dari יסר menunjuk pada tindakan mendidik atau mengoreksi melalui disiplin. “Mendisiplinkan” jelas dalam bahasa Indonesia modern dan tidak menyempitkan artinya menjadi hukuman semata.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Hubungan antara teguran, disiplin, dan murka Allah
  choice: Mempertahankan dua permohonan paralel tanpa menyiratkan bahwa pemazmur menolak segala teguran atau disiplin
  alternative: Menerjemahkan seolah-olah pemazmur meminta agar sama sekali tidak ditegur atau didisiplinkan
  rationale: 'Frasa “dalam murka-Mu” dan “dalam amarah-Mu” menerangkan tindakan-tindakan tersebut. Terjemahan mempertahankan ketegangan teks: permohonan diarahkan pada teguran dan disiplin yang berlangsung dalam murka, tanpa menambahkan penjelasan teologis yang tidak tersurat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. Pengulangan “janganlah” membuat cakupan larangan jelas serta mempertahankan kesejajaran puisi Ibrani. Kapital pada pronomina ilahi mengikuti kebiasaan ejaan religius bahasa Indonesia.
