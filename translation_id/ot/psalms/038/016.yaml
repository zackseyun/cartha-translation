source:
  edition: WLC
  text: כִּֽי אָ֭מַרְתִּי פֶּן יִשְׂמְחוּ לִ֑/י בְּ/מ֥וֹט רַ֝גְלִ֗/י עָלַ֥/י הִגְדִּֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/016.yaml
  text: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
translation:
  language: id
  text: Sebab aku berkata, “Jangan sampai mereka bergembira karena aku; ketika kakiku goyah, mereka menyombongkan diri terhadap aku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Menyatakan hal yang dikhawatirkan dan hendak dicegah; mempertahankan nuansa preventif Ibrani tanpa mengubahnya menjadi akibat yang pasti.
- source_word: יִשְׂמְחוּ לִי
  choice: mereka bergembira karena aku
  rationale: Preposisi לִי dalam konteks permusuhan menyatakan kegembiraan atas kemalangan pemazmur; frasa ini alami dalam bahasa Indonesia dan tidak menambah gagasan yang tidak tersurat.
- source_word: בְּמוֹט רַגְלִי
  choice: ketika kakiku goyah
  rationale: מוֹט menunjuk pada keadaan tergelincir, terhuyung, atau kehilangan kestabilan; 'goyah' mempertahankan kemungkinan makna harfiah sekaligus metaforis.
- source_word: עָלַי הִגְדִּילוּ
  choice: mereka menyombongkan diri terhadap aku
  rationale: Secara harfiah berarti 'membesarkan diri atas/terhadap aku'; pilihan ini menyampaikan sikap meninggikan diri dan kemenangan angkuh terhadap pemazmur.
theological_decisions:
- issue: Hubungan פֶּן dengan ucapan pemazmur
  choice: 'Diterjemahkan sebagai kekhawatiran yang hendak dicegah: ''Jangan sampai''.'
  alternative: '''Kalau tidak, mereka akan bergembira'''
  rationale: פֶּן lazim memperkenalkan akibat yang ditakuti ('supaya jangan/jangan sampai'), bukan sekadar konsekuensi alternatif. Terjemahan ini menjaga ketegangan doa pemazmur tanpa memastikan bahwa musuh pasti akan bersukacita.
- issue: Makna kegoyahan kaki
  choice: 'Dipertahankan sebagai gambaran terbuka: ''kakiku goyah''.'
  alternative: '''aku jatuh dalam dosa'' atau ''aku ditimpa bencana'''
  rationale: Teks tidak menetapkan apakah kegoyahan itu moral, jasmani, atau keadaan hidup; terjemahan tidak boleh mempersempit ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel puisi dipertahankan, sementara tanda petik menandai isi perkataan batin pemazmur.
