  yaml_path: translation/ot/psalms/038/014.yaml
  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: id
  text: Aku menjadi seperti orang yang tidak mendengar, dan dalam mulutnya tidak ada sanggahan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “teguran”, “argumen”, atau “jawaban”. Kata Ibrani ini dapat menunjuk pada koreksi lisan atau tanggapan yang membantah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Aku menjadi
  rationale: Bentuk wayyiqtol orang pertama tunggal dari היה dapat berarti ‘aku menjadi’ atau ‘aku ada’. ‘Aku menjadi’ mempertahankan perkembangan perbandingan dalam konteks tanpa menambahkan nuansa pertentangan.
- source_word: כְּאִישׁ
  choice: seperti orang
  rationale: אִישׁ menunjuk pada seorang manusia laki-laki, tetapi dalam perbandingan representatif ini bahasa Indonesia secara alami memakai ‘orang’; identitas penutur sebagai laki-laki tetap jelas dari konteks mazmur.
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: yang tidak mendengar
  rationale: שׁמע dapat berarti ‘mendengar’ atau ‘mendengarkan’. ‘Tidak mendengar’ merupakan padanan langsung dan tidak menambahkan ketidakmampuan yang tidak dinyatakan teks.
- source_word: וְאֵין בְּפִיו
  choice: dan dalam mulutnya tidak ada
  rationale: Terjemahan ini mempertahankan konstruksi eksistensial אֵין, konjungsi ‘dan’, serta metafora jasmani ‘dalam mulutnya’ sebagai tempat perkataan.
- source_word: תּוֹכָחוֹת
  choice: sanggahan
  rationale: Dalam konteks penutur yang tidak menanggapi para penuduh, bentuk jamak ini paling alami menunjuk pada tanggapan verbal yang membantah. Maknanya juga dapat mencakup teguran, argumen, atau jawaban, sehingga alternatif tersebut dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. Metafora ‘dalam mulutnya’ dipertahankan, sementara ‘sanggahan’ menyampaikan makna respons verbal dalam konteks tuduhan.
