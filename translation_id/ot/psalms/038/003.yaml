  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: id
  text: Tidak ada bagian tubuhku yang sehat karena murka-Mu[a]; tidak ada ketenteraman[b] dalam tulang-tulangku karena dosaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “amarah-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kesejahteraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: yang sehat
  rationale: Kata ini menunjuk pada keadaan utuh atau sehat. Dalam ratapan tentang penderitaan jasmani, ungkapan “tidak ada yang sehat” menyampaikan bahwa seluruh tubuh pemazmur telah terdampak tanpa menjadikannya istilah medis yang terlalu khusus.
- source_word: בִּבְשָׂרִי
  choice: dalam tubuhku
  rationale: Secara harfiah berarti “dalam dagingku,” tetapi dalam bahasa Indonesia modern “tubuhku” lebih alami untuk menunjuk keberadaan jasmani dan menghindari kesan daging sebagai bahan makanan.
- source_word: מִפְּנֵי
  choice: karena
  rationale: Dalam kedua klausa, preposisi ini menyatakan sebab. “Karena” adalah padanan Indonesia yang langsung dan alami.
- source_word: זַעְמֶךָ
  choice: murka-Mu
  rationale: Kata Ibrani ini menyatakan kemarahan yang kuat. “Murka-Mu” mempertahankan bobot ketidaksenangan ilahi dalam ragam bahasa yang wajar dan bermartabat.
- source_word: שָׁלוֹם
  choice: ketenteraman
  rationale: Dalam konteks penderitaan yang terasa sampai ke tulang, שָׁלוֹם menunjuk pada keadaan damai, utuh, dan sejahtera. “Ketenteraman” terdengar lebih alami daripada “damai” di dalam tulang, sedangkan alternatif kontekstual dipertahankan dalam catatan kaki.
- source_word: בַּעֲצָמַי
  choice: dalam tulang-tulangku
  rationale: Terjemahan konkret ini mempertahankan gambaran puitis Ibrani tentang penderitaan yang meresap sampai ke bagian tubuh yang paling dalam.
- source_word: חַטָּאתִי
  choice: dosaku
  rationale: Kata benda ini menunjuk pada dosa pemazmur sendiri sebagai sebab penderitaannya; “dosaku” merupakan padanan yang lugas dan alami.
theological_decisions:
- issue: Hubungan antara murka Allah, dosa pemazmur, dan penderitaannya
  choice: Ayat ini menyatakan secara langsung bahwa penderitaan jasmani pemazmur terjadi karena murka Allah dan karena dosanya sendiri, tanpa menjelaskan lebih lanjut mekanisme hubungan itu.
  alternative: Bahasa ini dapat dipahami sebagai gambaran puitis tentang keterasingan yang dirasakan pemazmur, bukan sebagai pernyataan doktrinal menyeluruh mengenai penyebab semua penderitaan.
  rationale: Kedua keterangan sebab diterjemahkan apa adanya. Terjemahan tidak melunakkan murka ilahi atau dosa pribadi dan tidak mengubah ratapan ini menjadi ajaran umum bahwa setiap penderitaan disebabkan oleh dosa tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Tubuhku” dipilih daripada “dagingku” demi kejelasan alami, sedangkan “tulang-tulangku” dipertahankan untuk menjaga citraan konkret teks Ibrani. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
