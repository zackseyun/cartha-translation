  text: כִּֽי כְ֭סָלַ/י מָלְא֣וּ נִקְלֶ֑ה וְ/אֵ֥ין מְ֝תֹ֗ם בִּ/בְשָׂרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/007.yaml
  text: For my loins are filled with burning[b][a], and there is no soundness in my flesh.
translation:
  language: id
  text: Sebab pinggangku[a] penuh dengan rasa terbakar[b], dan tidak ada bagian yang sehat pada tubuhku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “panggulku” atau “sisi tubuhku”; istilah Ibrani menunjuk kawasan pinggang dan bagian tengah tubuh.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini sulit dipastikan; mungkin juga berarti “radang” atau “panas yang membakar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi keluhan pemazmur dan mempertahankan hubungan penjelas dengan konteks.
- source_word: כְסָלַי
  choice: pinggangku
  rationale: Istilah Ibrani menunjuk kawasan pinggang, panggul, atau sisi tubuh. “Pinggangku” alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi organ tertentu.
- source_word: מָלְאוּ
  choice: penuh dengan
  rationale: Menyampaikan keadaan penuh yang dinyatakan bentuk qal dan berpadu secara alami dengan frasa berikutnya.
- source_word: נִקְלֶה
  choice: rasa terbakar
  rationale: Kata yang sulit ini dalam konteks penderitaan jasmani kemungkinan menunjuk rasa panas membakar atau peradangan. Terjemahan ini tidak menambahkan “luka” yang tidak dinyatakan secara eksplisit.
- source_word: וְאֵין מְתֹם
  choice: dan tidak ada bagian yang sehat
  rationale: מְתֹם menyatakan keutuhan atau kesehatan jasmani. Ungkapan ini merupakan bahasa Indonesia alami yang menyampaikan tidak adanya kesehatan pada tubuh.
- source_word: בִּבְשָׂרִי
  choice: pada tubuhku
  rationale: בָּשָׂר di sini menunjuk tubuh jasmani. “Tubuhku” menghindari kesan bahwa hanya jaringan daging yang dimaksud dan terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna בְּשָׂרִי dalam konteks penderitaan pemazmur
  choice: tubuh jasmani secara harfiah
  alternative: dagingku
  rationale: Paralel dengan kawasan pinggang dan ketiadaan kesehatan menunjukkan penderitaan fisik, bukan penggunaan metaforis atau pengertian teologis khusus tentang “daging”.
- issue: Sifat penderitaan yang dinyatakan נִקְלֶה
  choice: rasa terbakar, dengan ketidakpastian leksikal dipertahankan dalam catatan kaki
  alternative: radang; panas membakar; luka-luka yang membakar; kehinaan
  rationale: Konteks mendukung penyakit jasmani, tetapi bentuk tepat penderitaannya tidak pasti. Teks utama tidak menambahkan luka atau diagnosis medis yang tidak eksplisit dalam bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel ayat dipertahankan, sedangkan ungkapan “tidak ada bagian yang sehat pada tubuhku” dipilih agar jelas dan alami bagi pembaca umum.
