  yaml_path: translation/ot/psalms/038/013.yaml
  text: But I[a], like a deaf man, do not hear; and like a mute man[b], I do not open my mouth.
translation:
  language: id
  text: Namun aku, seperti orang tuli, tidak mendengar; dan seperti orang bisu—ia tidak membuka mulutnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani beralih dari orang pertama (“aku ... tidak mendengar”) ke orang ketiga (“ia tidak membuka mulutnya”), mungkin sebagai kelanjutan perumpamaan tentang orang bisu. Terjemahan lain: “dan seperti orang bisu, aku tidak membuka mulutku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Kata penghubung bersama kata ganti menandai pertentangan dengan para penuduh dalam konteks sebelumnya; “Namun aku” mengungkapkannya secara wajar dalam bahasa Indonesia.
- source_word: כְחֵרֵשׁ
  choice: seperti orang tuli
  rationale: Awalan כְּ menyatakan perbandingan, sedangkan חֵרֵשׁ menunjuk kepada orang tuli; terjemahan ini mempertahankan perumpamaan tunggalnya.
- source_word: לֹא אֶשְׁמָע
  choice: tidak mendengar
  rationale: Kata שׁמע dalam bentuk qal pada dasarnya berarti “mendengar”. Ungkapan indrawi dipertahankan tanpa menutup implikasi bahwa pemazmur tidak menanggapi tuduhan.
- source_word: וּכְאִלֵּם
  choice: dan seperti orang bisu
  rationale: אִלֵּם berarti orang yang bisu dan membentuk kesejajaran dengan “orang tuli”; pilihan ini ringkas dan mempertahankan gambaran fisiknya.
- source_word: לֹא יִפְתַּח פִּיו
  choice: ia tidak membuka mulutnya
  rationale: Teks Ibrani memakai verba orang ketiga tunggal serta akhiran “mulutnya”. Terjemahan ini mempertahankan idiom dan peralihan persona yang terdapat dalam teks sumber.
theological_decisions:
- issue: Peralihan dari orang pertama ke orang ketiga pada baris kedua
  choice: Mempertahankan “ia tidak membuka mulutnya” sebagai kelanjutan perumpamaan tentang orang bisu
  alternative: “aku tidak membuka mulutku”
  rationale: Bentuk gramatikal Ibrani secara eksplisit adalah orang ketiga tunggal, walaupun kesejajaran dan maksud keseluruhan dapat dipahami sebagai tindakan pemazmur sendiri. Tanda pisah membantu menunjukkan bahwa klausa tersebut menerangkan orang bisu tanpa menghapus ketegangan gramatikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “orang tuli” dan “orang bisu” mempertahankan gambaran konkret teks sumber; tanda pisah menandai klausa penjelas sekaligus membuat peralihan persona lebih mudah diikuti.
