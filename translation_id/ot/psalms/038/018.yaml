  text: כִּֽי עֲוֺנִ֥/י אַגִּ֑יד אֶ֝דְאַ֗ג מֵֽ/חַטָּאתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/018.yaml
  text: For I confess my iniquity[b][a]; I am anxious because of my sin.
translation:
  language: id
  text: Sebab aku mengakui kesalahanku[a]; aku gelisah[b] karena dosaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyatakan kesalahanku.” Kata kerja Ibrani secara harfiah berarti “memberitahukan” atau “menyatakan”; “mengakui” mencerminkan konteks penyesalan.
    reason: lexical_alternative
  - marker: b
    text: Atau “cemas” atau “gundah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan tersebut secara wajar dalam bahasa Indonesia.
- source_word: עֲוֺנִי
  choice: kesalahanku
  rationale: עָוֹן dapat menunjuk pada perbuatan salah maupun kesalahan yang ditanggung. “Kesalahanku” mempertahankan bobot moralnya tanpa memaksakan hanya salah satu nuansa itu.
- source_word: אַגִּיד
  choice: aku mengakui
  rationale: Bentuk Hifil dari נגד secara harfiah berarti “memberitahukan” atau “menyatakan.” Karena objeknya adalah kesalahan pribadi dalam konteks penyesalan, “mengakui” menyampaikan maksudnya secara alami, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אֶדְאַג
  choice: aku gelisah
  rationale: דאג menyatakan kecemasan, keprihatinan, atau kegundahan batin. “Aku gelisah” terdengar alami dan mempertahankan tekanan emosional tanpa memperjelas penyebabnya melebihi teks.
- source_word: מֵחַטָּאתִי
  choice: karena dosaku
  rationale: 'Preposisi מִן di sini paling wajar menyatakan sebab atau alasan: kegelisahan pemazmur timbul berkenaan dengan dosanya.'
- source_word: חַטָּאתִי
  choice: dosaku
  rationale: חַטָּאת adalah istilah umum untuk dosa; “dosaku” merupakan padanan langsung dan jelas.
theological_decisions:
- issue: Hubungan antara pengakuan kesalahan dan kegelisahan batin dalam mazmur penyesalan
  choice: Ayat ini diterjemahkan sebagai pengakuan pribadi atas kesalahan dan kegelisahan karena dosa, tanpa menambahkan uraian doktrinal lebih lanjut tentang pertobatan.
  alternative: אַגִּיד dapat diterjemahkan secara lebih netral sebagai “aku menyatakan” atau “aku memberitahukan,” sehingga tidak secara eksplisit menyebut tindakan itu sebagai pengakuan dosa.
  rationale: Teks Ibrani menyatakan bahwa pemazmur membuat kesalahannya diketahui dan merasa gelisah karena dosanya. “Mengakui” sesuai dengan konteks penyesalan, tetapi catatan kaki mempertahankan arti leksikal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Susunan dua klausa paralel dipertahankan; istilah yang dipilih mudah dipahami pembaca umum tanpa menghilangkan nuansa pengakuan dan kegelisahan dalam teks Ibrani.
