  text: אַל תַּֽעַזְבֵ֥/נִי יְהוָ֑ה אֱ֝לֹהַ֗/י אַל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: id
  text: Jangan tinggalkan aku, ya Yahweh, Allahku; jangan jauh dariku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל
  choice: Jangan
  rationale: Partikel negatif dengan bentuk yiqtol menyatakan permohonan langsung; “jangan” alami dan tidak menambahkan penekanan.
- source_word: תַּעַזְבֵנִי
  choice: tinggalkan aku
  rationale: Kata עזב berarti meninggalkan atau menelantarkan. “Tinggalkan aku” mempertahankan seruan ratapan dan terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal berarti “Allahku” dan mempertahankan seruan pribadi pemazmur.
- source_word: תִּרְחַק
  choice: jauh
  rationale: Kata רחק menyatakan keadaan atau menjadi jauh. Dalam konstruksi negatif ini, “jangan jauh” ringkas, puitis, dan tidak menafsirkan tindakan menjauh secara berlebihan.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Preposisi מִן dengan akhiran orang pertama tunggal secara alami diterjemahkan “dariku” setelah “jauh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, langsung, dan bermartabat, dengan kesejajaran dua permohonan dalam ratapan Ibrani dipertahankan. Sapaan “ya Yahweh, Allahku” alami untuk doa dan menjaga hubungan sintaksis nama ilahi dengan “Allahku”.
