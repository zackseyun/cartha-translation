  text: כִּֽי לְ/ךָ֣ יְהוָ֣ה הוֹחָ֑לְתִּי אַתָּ֥ה תַ֝עֲנֶ֗ה אֲדֹנָ֥/י אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/015.yaml
  text: For I wait for you[a], O Yahweh; you will answer[c][b], O Lord my God.
translation:
  language: id
  text: Sebab kepada-Mulah aku berharap[a], ya Yahweh; Engkaulah yang akan menjawab[b], ya Tuhan, Allahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “aku telah berharap kepada-Mu” atau “aku menanti-Mu dengan penuh harap.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “akan menanggapi.” Bahasa Ibrani tidak menyebutkan objeknya secara tersurat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar bagi pernyataan dalam konteks sekitarnya. “Sebab” mempertahankan hubungan kausal tanpa membuatnya lebih tegas daripada bahasa Ibrani.
- source_word: לְךָ
  choice: Engkau
  rationale: Dengan verba יחל, preposisi לְ menandai pribadi yang dinantikan atau kepada siapa harapan diarahkan. Dalam bahasa Indonesia, objek langsung sesudah “menanti-nantikan” paling alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: הוֹחָלְתִּי
  choice: aku menanti-nantikan
  rationale: Bentuk Hifil dari יחל mencakup makna menanti dengan harapan atau berharap. “Menanti-nantikan” menyampaikan penantian yang penuh harap dan menjadi ungkapan Indonesia yang alami.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Pronomina mandiri ini bersifat emfatis. Partikel “-lah” menyampaikan penekanan tersebut secara alami.
- source_word: תַעֲנֶה
  choice: akan menjawab
  rationale: Verba ענה berarti menjawab atau menanggapi. Objek tidak disebutkan dalam teks Ibrani, sehingga tidak ditambahkan “aku” atau “doaku”.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Dalam sapaan kepada Allah, אֲדֹנָי berfungsi sebagai gelar ilahi dan secara alami diterjemahkan “Tuhan”.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Akhiran orang pertama tunggal dipertahankan dalam bentuk Indonesia yang langsung dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi YHWH secara langsung. Transliterasi “Yahweh” mempertahankan perbedaan antara nama itu dan gelar אֲדֹנָי (“Tuhan”) yang juga muncul dalam ayat ini.
- issue: Kepastian jawaban Allah
  choice: Engkaulah yang akan menjawab
  alternative: Engkaulah yang menjawab
  rationale: Bentuk imperfek dapat menunjuk pada tindakan yang diharapkan atau akan terjadi. “Akan menjawab” sesuai dengan penantian pemazmur, sedangkan “Engkaulah” mempertahankan penekanan pada Allah tanpa menambahkan objek yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan hormat. “Menanti-nantikan” dipilih untuk memadukan nuansa menunggu dan berharap; “Engkaulah” mempertahankan penekanan pronomina Ibrani. Sapaan “ya” dipakai untuk menandai vokatif secara alami.
