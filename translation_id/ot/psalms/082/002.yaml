  text: How long will you judge unjustly and show partiality to the wicked? Selah[a]
translation:
  language: id
  text: Sampai kapan kalian menghakimi secara tidak adil dan memihak orang-orang fasik? Sela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani secara harfiah: “mengangkat wajah orang-orang fasik,” sebuah ungkapan yang berarti memihak atau menunjukkan keberpihakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Sampai kapan
  rationale: Ungkapan tanya waktu yang alami dalam bahasa Indonesia dan mempertahankan nada teguran terhadap tindakan yang terus berlangsung.
- source_word: תִּשְׁפְּטוּ
  choice: kamu akan menghakimi
  rationale: Bentuk imperfek orang kedua jamak dipahami dalam pertanyaan retoris mengenai tindakan yang masih berlangsung; 'akan menghakimi' mempertahankan bentuk pertanyaan 'sampai kapan' tanpa membatasi tindakan itu pada masa depan.
- source_word: עָוֶל
  choice: dengan tidak adil
  rationale: Nomina ini berfungsi secara adverbial dan menunjuk pada ketidakadilan dalam pelaksanaan penghakiman.
- source_word: וּפְנֵי ... תִּשְׂאוּ
  choice: dan memihak kepada
  rationale: Secara harfiah berarti 'mengangkat wajah', tetapi sebagai idiom yudisial menyatakan pemberian perlakuan istimewa atau keberpihakan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Mempertahankan kategori etis jamak dalam teks tanpa mempersempitnya hanya kepada orang yang telah dinyatakan bersalah secara hukum.
- source_word: סֶלָה
  choice: Sela
  rationale: Ditransliterasikan karena arti dan fungsi istilah musik atau liturgis ini tidak pasti.
theological_decisions:
- issue: Idiom yudisial tentang keberpihakan kepada orang fasik
  choice: memihak kepada orang-orang fasik
  alternative: mengangkat wajah orang-orang fasik
  rationale: Terjemahan idiomatis menyampaikan kecaman terhadap penghakiman yang berat sebelah dengan jelas, tanpa menambahkan klaim doktrinal yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'kamu' dipakai sebagai bentuk orang kedua jamak yang alami dalam konteks teguran; bentuk 'orang-orang fasik' mempertahankan jumlah jamak. Istilah 'Sela' dipertahankan sebagai transliterasi tradisional.
