  text: אֲֽנִי אָ֭מַרְתִּי אֱלֹהִ֣ים אַתֶּ֑ם וּ/בְנֵ֖י עֶלְי֣וֹן כֻּלְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/006.yaml
  text: I said, “You are gods, and all of you are sons of the Most High.”
translation:
  language: id
  text: Aku telah berfirman, “Kalian adalah ilah-ilah, dan kalian semua adalah anak-anak Yang Mahatinggi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי אָמַרְתִּי
  choice: Aku telah berfirman
  rationale: Bentuk perfektif אָמַרְתִּי menyatakan ujaran yang telah disampaikan. Karena pembicaranya adalah Allah dalam konteks mazmur, ‘berfirman’ wajar dan bermartabat dalam bahasa Indonesia.
- source_word: אֱלֹהִים אַתֶּם
  choice: Kalian adalah allah
  rationale: Mempertahankan predikasi langsung dan ketegangan istilah אֱלֹהִים tanpa menafsirkannya menjadi ‘hakim’ atau ‘penguasa’. Huruf kecil membedakan sebutan bagi pihak yang disapa dari Allah Yang Mahatinggi.
- source_word: וּבְנֵי עֶלְיוֹן
  choice: dan ... anak-anak Yang Mahatinggi
  rationale: וּ diterjemahkan eksplisit sebagai ‘dan’; בְנֵי dipertahankan sebagai ungkapan relasional ‘anak-anak’, sedangkan עֶלְיוֹן diterjemahkan dengan gelar lazim ‘Yang Mahatinggi’.
- source_word: כֻּלְּכֶם
  choice: kalian semua
  rationale: Menjaga penekanan bahwa pernyataan itu berlaku kepada seluruh kelompok yang disapa.
theological_decisions:
- issue: Identitas pihak yang disebut אֱלֹהִים
  choice: allah
  alternative: hakim; makhluk ilahi; para penguasa
  rationale: Ayat ini sendiri tidak secara eksplisit menetapkan identitas mereka. Terjemahan literal mempertahankan ambiguitas dan ketegangan teologis teks, alih-alih memilih satu tafsiran.
- issue: Makna ‘anak-anak Yang Mahatinggi’
  choice: anak-anak Yang Mahatinggi
  alternative: keturunan Yang Mahatinggi; makhluk-makhluk milik Yang Mahatinggi
  rationale: Ungkapan sumber dipertahankan secara formal agar relasi yang dimaksud tidak dipersempit secara interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. ‘Kalian’ dipakai untuk menandai orang kedua jamak secara jelas; tanda kutip mempertahankan bentuk ujaran langsung.
