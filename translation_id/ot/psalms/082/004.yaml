  text: פַּלְּטוּ דַ֥ל וְ/אֶבְי֑וֹן מִ/יַּ֖ד רְשָׁעִ֣ים הַצִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/004.yaml
  text: Rescue the poor and needy[a]; deliver them from the hand of the wicked.
translation:
  language: id
  text: Selamatkanlah orang miskin dan orang yang berkekurangan[a]; lepaskanlah mereka dari tangan orang-orang fasik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang lemah dan orang yang berkekurangan.” Kata Ibrani דַל dapat berarti “miskin” atau “lemah” dan menekankan kerentanan, bukan hanya kemiskinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  choice: Selamatkanlah
  rationale: Bentuk perintah jamak dari פלט menyerukan tindakan aktif untuk membawa pihak yang terancam ke tempat aman. Pilihan ini alami dalam bahasa Indonesia dan menyampaikan desakan dalam konteks pengadilan.
- source_word: דַל
  choice: orang miskin
  rationale: דַל dapat menunjuk kepada orang miskin, lemah, atau tidak berdaya secara sosial. Dalam pasangan dengan אֶבְיוֹן dan konteks keadilan, “orang miskin” menonjolkan kerentanan sosial-ekonominya tanpa meniadakan nuansa kelemahan.
- source_word: אֶבְיוֹן
  choice: orang berkekurangan
  rationale: Kata ini lazim menunjuk kepada orang yang kekurangan atau melarat. “Orang berkekurangan” mempertahankan pembedaan dari דַל dan terdengar wajar serta bermartabat dalam bahasa Indonesia modern.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan harfiah ini menggambarkan kuasa atau kendali pihak fasik. Citra sumber tetap jelas dalam bahasa Indonesia.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak ini menunjuk kepada para pelaku yang bersalah secara moral. “Orang-orang fasik” ringkas, tidak menambahkan gender, dan mempertahankan bobot etis istilah Ibrani.
- source_word: הַצִּילוּ
  choice: lepaskanlah
  rationale: Bentuk perintah jamak dari נצל menyatakan pembebasan dari bahaya atau kuasa musuh. “Lepaskanlah” membedakannya dari perintah pertama sekaligus menjaga kesejajaran puitis.
theological_decisions:
- issue: Penerjemahan dua perintah yang sejajar tanpa meratakan daya puisi Ibrani
  choice: 'Memakai dua perintah yang terkoordinasi: “Selamatkanlah ...; lepaskanlah ...”'
  alternative: Menggabungkannya menjadi satu perintah, misalnya “Selamatkanlah orang miskin dan orang berkekurangan dari tangan orang-orang fasik.”
  rationale: Teks Ibrani memakai dua kata kerja perintah yang sejajar untuk memperkuat seruan membela pihak rentan. Mempertahankan keduanya menjaga desakan moral dan bentuk puitis ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel “-lah” mempertahankan nada perintah yang tegas tanpa terdengar kasar; citra “dari tangan” dipertahankan karena tetap mudah dipahami.
