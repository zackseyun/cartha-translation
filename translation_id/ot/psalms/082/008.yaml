id: PSA.82.8
reference: Psalms 82:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: קוּמָ֣/ה אֱ֭לֹהִים שָׁפְטָ֣/ה הָ/אָ֑רֶץ כִּֽי אַתָּ֥ה תִ֝נְחַ֗ל בְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/008.yaml
  text: Rise up[a], O God; judge the earth[b], for you will inherit all the nations.
translation:
  language: id
  text: Bangkitlah, ya Allah, hakimilah bumi, sebab Engkaulah yang akan mewarisi segala bangsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkaulah yang akan memiliki segala bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Bangkitlah
  rationale: Imperatif yang mendesak Allah untuk bertindak; bentuk ini alami dalam bahasa doa Indonesia dan tetap bernada luhur.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini merupakan sapaan langsung kepada satu pribadi, sebagaimana ditunjukkan oleh imperatif dan pronomina tunggal.
- source_word: שָׁפְטָה
  choice: hakimilah
  rationale: Mempertahankan cakupan yudisial sekaligus kerajaan dari akar שׁפט tanpa membatasinya hanya pada pemerintahan atau pembelaan.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Kesejajarannya dengan segala bangsa menunjukkan cakupan global, bukan tanah atau negeri tertentu.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan dasar bagi permohonan sebelumnya secara jelas dan wajar dalam bahasa Indonesia.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Partikel -lah menyampaikan penekanan pronomina eksplisit dalam bahasa Ibrani sekaligus mempertahankan sapaan langsung yang khidmat.
- source_word: תִנְחַל
  choice: akan mewarisi
  rationale: Mempertahankan makna menerima atau memiliki sebagai warisan, termasuk nuansa kepemilikan yang sah, tanpa meratakannya menjadi sekadar 'memiliki'.
- source_word: בְּכָל הַגּוֹיִם
  choice: segala bangsa
  rationale: Dengan נחל, frasa ini paling wajar dipahami secara idiomatis sebagai cakupan atau objek warisan; bentuk jamak kolektifnya dipertahankan.
theological_decisions:
- issue: Makna hubungan Allah dengan bangsa-bangsa dalam תִנְחַל בְּכָל הַגּוֹיִם
  choice: Engkaulah yang akan mewarisi segala bangsa
  alternative: segala bangsa adalah milik-Mu
  rationale: Terjemahan ini mempertahankan gambaran warisan dan klaim Allah yang universal atas bangsa-bangsa, tanpa mengubahnya menjadi pernyataan kepemilikan abstrak.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Sapaan “ya Allah” serta pronomina “Engkau” sesuai dengan laras doa; susunan kalimat mempertahankan urgensi permohonan dan penekanan pada Allah.
