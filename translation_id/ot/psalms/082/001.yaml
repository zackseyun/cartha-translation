id: PSA.82.1
reference: Psalms 82:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/001.yaml
  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: id
  text: Mazmur Asaf. Allah berdiri dalam majelis ilahi; di tengah para ilah[a] Ia menghakimi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “makhluk-makhluk ilahi.” Sebagian orang memahami “para ilah” di sini sebagai hakim atau penguasa manusia.
    reason: Menjelaskan kemungkinan makna אֱלֹהִים yang kedua tanpa meniadakan ketaksaan dan perbedaan penafsiran.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku dan tepat dalam bahasa Indonesia untuk judul jenis nyanyian ini.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Konstruksi ini menyatakan hubungan dengan Asaf tanpa menentukan secara tegas apakah ia penulis, pemilik, atau pihak yang menerima mazmur tersebut; bentuk judul yang ringkas mempertahankan ketaksaan itu secara alami.
- source_word: אֱלֹהִים (pertama)
  choice: Allah
  rationale: Partisip dan verba yang menyertainya berbentuk tunggal, sehingga kata ini menunjuk kepada Allah sebagai subjek tunggal.
- source_word: נִצָּב
  choice: berdiri
  rationale: Menggambarkan Allah berdiri dalam suasana persidangan tanpa menambahkan penafsiran yang tidak dinyatakan oleh teks.
- source_word: בַּעֲדַת אֵל
  choice: dalam majelis ilahi
  rationale: עֵדָה menunjuk kepada kumpulan yang bersidang, sedangkan אֵל mencirikan majelis itu sebagai ilahi. 'Majelis ilahi' alami dalam bahasa Indonesia dan sesuai dengan latar peradilan surgawi yang mungkin dimaksud.
- source_word: בְּקֶרֶב
  choice: di tengah
  rationale: Mempertahankan gambaran posisi Allah di antara anggota kelompok tersebut.
- source_word: אֱלֹהִים (kedua)
  choice: para ilah
  rationale: Pemakaian kedua menunjuk kepada kelompok jamak yang di tengahnya Allah berdiri dan yang dihakimi-Nya. 'Para ilah' merupakan padanan leksikal langsung, sementara kemungkinan rujukannya dijelaskan dalam catatan kaki.
- source_word: יִשְׁפֹּט
  choice: Ia menghakimi
  rationale: Verba שפט bersifat yudisial dalam konteks ini; 'menghakimi' secara ringkas mempertahankan suasana pengadilan.
theological_decisions:
- issue: Rujukan אֱלֹהִים yang kedua
  choice: para ilah
  alternative: makhluk-makhluk ilahi; hakim atau penguasa manusia
  rationale: Tata bahasa membedakan Allah sebagai subjek tunggal dari kelompok jamak yang di tengahnya Ia berdiri. Konteks majelis ilahi mendukung rujukan kepada makhluk-makhluk surgawi, tetapi teks juga pernah dipahami sebagai merujuk kepada hakim atau penguasa manusia. Terjemahan utama mempertahankan daya leksikal dan ketegangan teks, sedangkan catatan kaki menyajikan kemungkinan lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Majelis' mempertahankan gagasan kumpulan yang bersidang, sedangkan 'para ilah' sengaja dipertahankan dalam teks utama agar ketegangan teologis sumber tidak diselesaikan secara diam-diam. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya.
