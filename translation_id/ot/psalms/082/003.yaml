  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: id
  text: Berilah keadilan kepada orang lemah dan anak yatim; belalah hak orang tertindas dan orang miskin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ
  choice: Belalah hak
  rationale: Imperatif dari שׁפט dalam konteks pengadilan dan kepemimpinan berarti menjalankan penghakiman yang adil atau membela hak; ungkapan ini lebih alami daripada terjemahan harfiah 'hakimilah'.
- source_word: דַל
  choice: orang lemah
  rationale: Menunjuk orang yang tidak berdaya atau berkedudukan rendah; 'orang lemah' mempertahankan cakupan sosialnya tanpa membatasinya hanya pada kemiskinan materi.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Padanan Indonesia yang lazim untuk anak yang kehilangan ayah atau perlindungan orang tua dalam konteks sosial Israel kuno.
- source_word: עָנִי
  choice: orang tertindas
  rationale: Kata ini dapat berarti sengsara, tertindas, atau miskin; 'tertindas' membedakannya dari רָשׁ pada baris yang sama dan menonjolkan kerentanannya.
- source_word: רָשׁ
  choice: orang miskin
  rationale: Menunjuk orang yang kekurangan secara ekonomi; diterjemahkan langsung sebagai 'orang miskin'.
- source_word: הַצְדִּיקוּ
  choice: nyatakanlah keadilan bagi
  rationale: Bentuk kausatif dari צדק dalam ranah hukum berarti menyatakan benar, membenarkan, atau memberi putusan yang adil. Rumusan ini menjaga nuansa forensik tanpa menyiratkan bahwa semua tuntutan pihak tersebut otomatis benar.
theological_decisions:
- issue: Makna perintah yudisial dalam שִׁפְטוּ dan הַצְדִּיקוּ
  choice: Mengungkapkannya sebagai pembelaan hak dan pemberian keputusan adil bagi kelompok rentan.
  alternative: Hakimilah orang lemah dan anak yatim; benarkanlah orang tertindas dan orang miskin.
  rationale: Terjemahan yang dipilih menyampaikan fungsi hakim/penguasa yang dituntut teks, sambil menghindari kesan bahwa kelompok rentan menjadi objek penghukuman atau dinyatakan benar tanpa proses keadilan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Paralelisme dua bagian dipertahankan, dengan istilah yang mudah dipahami pembaca umum.
