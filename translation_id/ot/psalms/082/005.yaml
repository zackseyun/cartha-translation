  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
translation:
  language: id
  text: Mereka tidak tahu dan tidak mengerti; mereka berjalan ke sana kemari dalam kegelapan; semua dasar-dasar bumi[b] terguncang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “goyah” atau “bergeser” untuk “terguncang”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dasar-dasar negeri”, jika אָרֶץ dipahami dalam arti yang lebih setempat.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: mereka tidak tahu
  rationale: Bentuk Qal dari ידע lazim berarti “tahu” atau “mengenal”. Dalam kesejajaran puitis ini, bentuk perfektif menyatakan keadaan ketidaktahuan yang sedang berlangsung.
- source_word: וְלֹא יָבִינוּ
  choice: dan tidak mengerti
  rationale: Bentuk Hifil dari בין berarti “mengerti” atau “memahami dengan membedakan”. “Mengerti” terdengar alami dan mempertahankan kesejajaran dengan “tahu”.
- source_word: בַּחֲשֵׁכָה
  choice: dalam kegelapan
  rationale: Frasa berpreposisi ini bersifat lokatif dan juga mempertahankan citra puitis tentang ketidaktahuan serta kesesatan.
- source_word: יִתְהַלָּכוּ
  choice: mereka berjalan ke sana kemari
  rationale: Bentuk Hitpael dari הלך dapat menggambarkan gerak yang berulang atau berkelanjutan. “Berjalan ke sana kemari” menyampaikan nuansa tersebut tanpa menjelaskan citranya secara berlebihan.
- source_word: יִמּוֹטוּ
  choice: terguncang
  rationale: Bentuk Nifal dari מוט menyatakan keadaan tergoyahkan, bergeser, atau menjadi tidak stabil. “Terguncang” mempertahankan gambaran ketidakstabilan tanpa memastikan bahwa keruntuhan telah terjadi.
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: semua dasar bumi
  rationale: מוֹסְדֵי berarti “dasar-dasar” atau “fondasi-fondasi”, sedangkan אָרֶץ dapat berarti “bumi” atau “negeri”. Dalam gambaran puitis yang luas ini, “bumi” paling tepat, sementara kemungkinan makna lokal dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan אָרֶץ dan gambaran terguncangnya tatanan dunia
  choice: bumi
  alternative: negeri
  rationale: Konteks Mazmur 82 menghubungkan ketidakadilan para penguasa dengan ketidakstabilan yang luas. “Bumi” mempertahankan daya jangkau kosmis dari gambaran itu tanpa menambahkan penafsiran di luar teks, sedangkan arti lokal “negeri” tetap diakui sebagai kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang lugas dan bermartabat. Kesejajaran antara “tidak tahu” dan “tidak mengerti” dipertahankan, demikian pula metafora berjalan dalam kegelapan dan terguncangnya dasar bumi.
