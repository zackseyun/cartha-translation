  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: id
  text: Namun, kalian akan mati seperti manusia[a] dan jatuh seperti salah seorang penguasa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti Adam,” jika frasa ini dipahami sebagai rujukan kepada manusia pertama, bukan kepada manusia pada umumnya.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “pembesar”; kata Ibrani ini juga dapat berarti pejabat tinggi atau pangeran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Namun
  rationale: Menandai peralihan yang tegas dan kontras dari kedudukan luhur yang disebutkan sebelumnya kepada hukuman berupa kematian.
- source_word: כְּאָדָם
  choice: seperti manusia
  rationale: אָדָם di sini paling wajar dipahami secara kolektif sebagai manusia biasa yang fana. Terjemahan ini tetap alami dalam bahasa Indonesia, sementara kemungkinan nama diri 'Adam' dicatat dalam catatan kaki.
- source_word: תְּמוּתוּן
  choice: kalian akan mati
  rationale: Bentuk orang kedua jamak menyatakan kematian yang akan dialami semua pihak yang sedang disapa; 'kalian' mempertahankan kemajemukan itu secara jelas.
- source_word: וּכְאַחַד
  choice: dan ... seperti salah seorang
  rationale: Menyampaikan perbandingan dengan satu anggota dari kelompok yang disebut sesudahnya.
- source_word: הַשָּׂרִים
  choice: penguasa
  rationale: שָׂרִים dapat menunjuk para penguasa, pembesar, atau pejabat tinggi. 'Penguasa' paling sesuai dengan konteks mazmur tentang para pemegang wewenang yang dihakimi.
- source_word: תִּפֹּלוּ
  choice: jatuh
  rationale: Mempertahankan metafora Ibrani tentang keruntuhan atau kebinasaan di bawah penghakiman.
theological_decisions:
- issue: Makna אָדָם dalam כְּאָדָם
  choice: manusia secara umum
  alternative: Adam, manusia pertama
  rationale: Konteks membandingkan mereka yang disebut 'allah' dan 'anak-anak Yang Mahatinggi' dengan kefanaan manusia biasa. Namun, bentuk Ibrani juga dapat dibaca sebagai nama diri Adam, sehingga kemungkinan itu tidak disingkirkan dan dicatat dalam catatan kaki.
- issue: Identitas הַשָּׂרִים
  choice: penguasa
  alternative: pembesar atau pangeran
  rationale: Istilah Ibrani memiliki cakupan makna yang mencakup penguasa dan pejabat tinggi. Pilihan ini tidak menetapkan secara lebih khusus jabatan atau identitas mereka.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan tetap bermartabat. 'Kalian' dipakai untuk memperjelas bentuk sapaan jamak dalam bahasa Ibrani; tanda baca dibuat alami tanpa koma yang tidak diperlukan sebelum 'dan'.
