  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/000.yaml
  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
translation:
  language: id
  text: Mazmur Asaf. Allah berdiri dalam sidang Allah; di tengah para allah[a] Ia menghakimi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk-makhluk ilahi.” Sebagian orang memahami “para allah” di sini sebagai hakim atau penguasa manusia.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Mazmur Asaf
  rationale: Ungkapan judul Ibrani dapat menunjukkan mazmur karya, milik, atau untuk Asaf; bentuk ringkas ini mempertahankan keluwesan hubungan tersebut.
- source_word: בַּעֲדַת־אֵל
  choice: dalam sidang Allah
  rationale: Menerjemahkan עֲדָה sebagai 'sidang' dan אֵל sebagai 'Allah', sambil mempertahankan gambaran perhimpunan surgawi tanpa menambahkan penafsiran.
- source_word: אֱלֹהִים
  choice: Allah / para allah
  rationale: Kemunculan pertama merujuk kepada Allah sebagai subjek tunggal, sedangkan kemunculan kedua berbentuk jamak dalam konteks 'di tengah'; perbedaan kapitalisasi dan penambahan 'para' menyatakan fungsi yang berbeda itu secara wajar dalam bahasa Indonesia.
- source_word: יִשְׁפֹּט
  choice: Ia menghakimi
  rationale: Bentuk verba ini menyatakan tindakan mengadili atau menjatuhkan keputusan; 'menghakimi' mempertahankan nuansa yudisial dan subjek tunggalnya.
theological_decisions:
- issue: Identitas אֱלֹהִים pada frasa 'di tengah para allah'
  choice: para allah
  alternative: makhluk-makhluk ilahi; hakim atau penguasa manusia
  rationale: Terjemahan utama mempertahankan istilah Ibrani yang sama dan ketegangan teologis dalam adegan sidang tersebut. Catatan kaki menyajikan penafsiran utama lainnya tanpa menetapkan salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan khidmat. Kapitalisasi membedakan Allah sebagai subjek tunggal dari 'para allah' dalam sidang, tanpa menghapus ambiguitas mengenai identitas mereka.
