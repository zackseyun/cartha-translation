base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/002.yaml
  text: I pour out my complaint before him[b][a]; I declare my distress before him.
translation:
  language: id
  text: Aku mencurahkan keluhanku di hadapan-Nya[a]; aku menyatakan kesesakanku di hadapan-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “renunganku” atau “buah pikiranku” untuk “keluhanku” (Ibrani שִׂיחִי); dalam konteks ratapan ini, maknanya kemungkinan besar adalah keluhan yang diucapkan, bukan perenungan batin.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesusahanku” atau “penderitaanku” untuk “kesesakanku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁפֹּךְ
  choice: Aku mencurahkan
  rationale: Bentuk qal dari שׁפך berarti ‘mencurahkan’. Ungkapan ini mempertahankan gambaran Ibrani tentang mengungkapkan isi hati dengan leluasa dan terdengar alami dalam konteks doa.
- source_word: לְפָנָיו
  choice: di hadapan-Nya
  rationale: Secara harfiah berarti ‘di depan wajah-Nya’ atau ‘di hadirat-Nya’. ‘Di hadapan-Nya’ mempertahankan nuansa kehadiran dan relasi; pengulangannya dipertahankan sesuai paralelisme Ibrani.
- source_word: שִׂיחִי
  choice: keluhanku
  rationale: שִׂיחַ dapat berarti renungan, buah pikiran, atau keluhan. Dalam konteks ratapan ini, ketika dipasangkan dengan ‘kesesakanku’, ‘keluhanku’ paling tepat menyampaikan ratapan yang diucapkan tanpa meniadakan alternatif leksikalnya.
- source_word: צָרָתִי
  choice: kesesakanku
  rationale: צָרָה menunjuk pada kesesakan, kesusahan, atau penderitaan. ‘Kesesakanku’ ringkas, wajar dalam bahasa doa, dan mempertahankan daya emosional istilah tersebut tanpa membatasinya hanya pada penderitaan lahiriah.
- source_word: אַגִּיד
  choice: aku menyatakan
  rationale: Bentuk hiphil dari נגד berarti memberitahukan atau menyatakan. ‘Menyatakan’ menjaga nada yang sengaja dan khidmat, sekaligus tetap mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan mudah dipahami. Paralelisme serta pengulangan ‘di hadapan-Nya’ dipertahankan. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskannya.
