  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶזְעָ֑ק ק֝וֹלִ֗/י אֶל יְהוָ֥ה אֶתְחַנָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/001.yaml
  text: With my voice I cry out to Yahweh[c][b][a]; with my voice I plead to Yahweh for mercy.
translation:
  language: id
  text: Dengan suaraku aku berseru kepada Yahweh; dengan suaraku aku memohon belas kasihan kepada Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dengan suaraku aku berseru kepada Yahweh; dengan suaraku aku memohon kepada Yahweh agar berbelas kasihan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹלִי
  choice: dengan suaraku
  rationale: Secara harfiah berarti “suaraku”. Frasa “dengan suaraku” mempertahankan penonjolan dan pengulangan konkret dalam paralelisme Ibrani; ungkapan yang lebih idiomatis seperti “dengan lantang” akan menghilangkan pengulangan leksikal itu.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menyatakan arah seruan dan permohonan kepada Yahweh; “kepada” alami dalam bahasa Indonesia untuk kedua verba tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: אֶזְעָק
  choice: aku berseru
  rationale: Bentuk dari זעק menyatakan seruan kuat untuk meminta pertolongan. “Berseru” menyampaikan tindakan vokal dan intensitasnya secara wajar dalam ragam mazmur.
- source_word: אֶתְחַנָּן
  choice: aku memohon belas kasihan
  rationale: Bentuk hitpael dari חנן menyatakan permohonan sungguh-sungguh akan kemurahan atau belas kasihan. Pilihan ini jelas bagi pembaca modern dan tetap membawa gagasan memohon perkenanan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan sebuah gelar.
- issue: Objek tersirat dalam אֶתְחַנָּן
  choice: memohon belas kasihan
  alternative: memohon
  rationale: Verba ini secara leksikal mengandung gagasan meminta perkenanan atau belas kasihan, meskipun bahasa Ibrani tidak menyatakan objek terpisah. Terjemahan mengeksplisitkan muatan verba tanpa menentukan bentuk pertolongan yang diminta.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Urutan “dengan suaraku” serta pengulangannya dipertahankan untuk mencerminkan penekanan dan paralelisme Ibrani. Pronomina “aku” sesuai dengan suara pribadi pemazmur.
