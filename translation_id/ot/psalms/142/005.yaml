source:
  edition: WLC
  text: זָעַ֥קְתִּי אֵלֶ֗י/ךָ יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑/י חֶ֝לְקִ֗/י בְּ/אֶ֣רֶץ הַֽ/חַיִּים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/005.yaml
  text: I cried out to you[a], O Yahweh; I said, “You are my refuge, my portion in the land of the living.”
translation:
  language: id
  text: 'Aku berseru kepada-Mu, ya Yahweh;

    aku berkata, “Engkaulah tempat perlindunganku,

    bagianku di negeri orang-orang hidup.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָעַקְתִּי
  choice: Aku berseru
  rationale: Kata kerja ini menyatakan seruan kuat, khususnya permohonan pertolongan; “berseru” alami dan tetap mempertahankan intensitasnya.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Menunjukkan arah seruan kepada Allah; bentuk pronomina ini jelas dan wajar dalam doa langsung.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks Ibrani; partikel “ya” membuat sapaan langsung terdengar alami dalam bahasa Indonesia.
- source_word: אָמַרְתִּי
  choice: aku berkata
  rationale: Menerjemahkan verba umum אמר secara langsung dan mempertahankan urutan tindakan dalam puisi.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Bentuk dengan -lah mencerminkan penekanan pada pronomina Ibrani dan menghasilkan pengakuan langsung yang alami.
- source_word: מַחְסִי
  choice: tempat perlindunganku
  rationale: Menyampaikan tempat berlindung dari bahaya secara jelas dan lebih alami daripada sekadar “perlindunganku” dalam predikasi ini.
- source_word: חֶלְקִי
  choice: bagianku
  rationale: Mempertahankan gambaran tentang bagian atau jatah yang menjadi milik pemazmur tanpa mempersempitnya menjadi “warisan”.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: di negeri orang-orang hidup
  rationale: Mempertahankan ungkapan konkret Ibrani tentang ranah kehidupan di dunia, sebagai lawan kematian atau dunia orang mati.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Makna חֶלְקִי ketika Allah menjadi bagiannya
  choice: bagianku
  alternative: warisanku
  rationale: “Bagianku” menjaga keluasan metafora Ibrani mengenai jatah atau milik yang dianugerahkan dan tidak secara diam-diam membatasinya pada konsep warisan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Paralelisme puitis dipertahankan dalam tiga baris; “Engkaulah” menandai penekanan tanpa membuat kalimat terasa kaku.
