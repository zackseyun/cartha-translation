  text: Maskil[a] Daud[b], ketika ia berada di dalam gua. Doa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani Maskil, istilah teknis dalam judul mazmur; mungkin menunjukkan karya perenungan atau pengajaran.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga berarti “oleh Daud”, “untuk Daud”, atau “milik Daud”; bentuk Ibraninya dapat menyatakan kepengarangan, peruntukan, atau keterkaitan.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: nyanyian Maskil
  rationale: מַשְׂכִּיל adalah istilah teknis dalam judul mazmur yang arti tepatnya tidak pasti. Transliterasi “Maskil” mempertahankan istilah Ibrani tanpa memaksakan tafsiran; penambahan “nyanyian” membuat fungsi judulnya jelas dan alami dalam bahasa Indonesia.
- source_word: לְדָוִד
  choice: Daud
  rationale: Konstruksi ringkas “Maskil Daud” tetap wajar sebagai judul bahasa Indonesia dan tidak membatasi לְ pada kepengarangan saja; hubungannya dengan Daud dijelaskan dalam catatan kaki.
- source_word: בִּהְיוֹתוֹ
  choice: ketika ia berada
  rationale: Gabungan בְּ dengan infinitif konstruktus היה dan sufiks pronominal menyatakan waktu. “Ketika ia berada” merupakan padanan alami dan jelas.
- source_word: בַמְּעָרָה
  choice: di dalam gua
  rationale: Artikel tentu pada bentuk Ibrani menunjuk pada gua tertentu yang dipahami dalam konteks tradisi, meskipun judul ini tidak menyebut gua yang mana. Bahasa Indonesia lazim tidak memerlukan kata sandang khusus untuk menyatakan ketentuan tersebut.
- source_word: תְפִלָּה
  choice: Sebuah doa
  rationale: Nomina ini berfungsi sebagai label jenis atau judul tambahan. Kalimat pendek tersendiri mempertahankan susunan dan penekanannya dalam judul Ibrani.
