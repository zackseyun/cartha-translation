  variant: modern standard Indonesian
source:
  edition: WLC
  text: ה֘וֹצִ֤יאָ/ה מִ/מַּסְגֵּ֨ר נַפְשִׁ/י֮ לְ/הוֹד֪וֹת אֶת שְׁ֫מֶ֥/ךָ בִּ֭/י יַכְתִּ֣רוּ צַדִּיקִ֑ים כִּ֖י תִגְמֹ֣ל עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Bring my soul out of prison[a], so that I may give thanks to your name; the righteous will gather around me, for you will deal bountifully with me.
translation:
  language: id
  text: Keluarkanlah jiwaku dari penjara, supaya aku mengucap syukur kepada nama-Mu; orang-orang benar akan berkumpul di sekelilingku[a], sebab Engkau akan berbuat baik kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang benar akan mengelilingi aku.” Kata kerja Ibrani ini juga dapat dipahami, secara kurang lazim, sebagai “orang-orang benar akan memahkotai diri karena aku” atau “akan bermegah karena aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיאָה
  choice: Keluarkanlah
  rationale: Bentuk imperatif Hifil dari יצא menyatakan permohonan agar Allah menyebabkan pemazmur keluar; bentuk ini langsung dan wajar dalam bahasa Indonesia.
- source_word: מִמַּסְגֵּר
  choice: dari penjara
  rationale: מַסְגֵּר menunjuk pada tempat kurungan atau penjara; 'penjara' merupakan padanan modern yang jelas tanpa menentukan apakah ungkapan ini harfiah atau kiasan.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, diri, atau hidup. 'Jiwaku' mempertahankan ungkapan Ibrani dan cakupan seluruh pribadi tanpa mereduksinya menjadi pelepasan jasmani semata.
- source_word: לְהוֹדוֹת אֶת שְׁמֶךָ
  choice: supaya aku mengucap syukur kepada nama-Mu
  rationale: Infinitif ini menyatakan tujuan; ידה dalam Hifil lazim berarti mengucap syukur atau memuji. Penyebutan 'nama-Mu' dipertahankan sebagai objek ungkapan Ibrani.
- source_word: בִּי יַכְתִּרוּ צַדִּיקִים
  choice: orang-orang benar akan berkumpul di sekelilingku
  rationale: כּתר dalam Hifil dapat dipahami sebagai mengelilingi. 'Berkumpul di sekelilingku' menyampaikan gambaran komunitas orang benar yang mengitari pemazmur setelah pembebasannya, sementara ketidakpastian leksikal dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi tanggapan orang-orang benar dan pengharapan pemazmur.
- source_word: תִגְמֹל עָלָי
  choice: Engkau akan berbuat baik kepadaku
  rationale: גמל dengan על dapat berarti memperlakukan atau membalas seseorang. Dalam konteks permohonan pembebasan, ungkapan ini menyampaikan tindakan baik Allah tanpa memaksakan gagasan pahala berdasarkan jasa.
theological_decisions:
- issue: Apakah klausa terakhir menyatakan balasan berdasarkan jasa
  choice: Tindakan baik Allah kepada pemazmur
  alternative: Allah akan membalas pemazmur menurut jasanya
  rationale: Konteks ratapan dan permohonan pembebasan mendukung pengharapan akan kebaikan Allah, tetapi kata גמל tetap memiliki nuansa memperlakukan atau membalas; terjemahan tidak memasukkan ajaran tentang jasa yang tidak dituntut teks.
- issue: Apakah 'penjara' harus dipahami secara harfiah atau kiasan
  choice: Ambiguitas dipertahankan
  alternative: Menafsirkannya secara khusus sebagai penjara fisik atau kesesakan batin
  rationale: Teks memakai istilah konkret 'penjara', tetapi konteks tidak mengharuskan penerjemah menentukan hanya satu jenis kurungan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'nama-Mu' mengikuti konvensi penulisan religius Indonesia. Susunan kalimat mempertahankan gerak permohonan, tujuan, tanggapan komunitas, dan alasannya.
