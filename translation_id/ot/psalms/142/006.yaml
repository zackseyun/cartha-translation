  text: הַקְשִׁ֤יבָ/ה אֶֽל רִנָּתִ/י֮ כִּֽי דַלּ֪וֹתִ֫י מְאֹ֥ד הַצִּילֵ֥/נִי מֵ/רֹדְפַ֑/י כִּ֖י אָמְצ֣וּ מִמֶּֽ/נִּי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/006.yaml
  text: Attend to my cry[a], for I am brought very low; deliver me from my pursuers[c][b], for they are stronger than I.
translation:
  language: id
  text: Dengarkanlah seruanku[a], sebab aku sudah menjadi sangat lemah[b]. Selamatkanlah aku dari orang-orang yang mengejarku[c], sebab mereka lebih kuat daripada aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Perhatikanlah seruanku.” Kata Ibrani ini menyatakan mendengarkan dengan penuh perhatian.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “aku telah menjadi sangat terpuruk” atau “aku telah dibawa sangat rendah.” Ungkapan Ibrani ini menyatakan kemerosotan atau kelemahan yang parah.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “dari para pengejarku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Dengarkanlah
  rationale: Bentuk imperatif ini meminta pendengaran yang sungguh-sungguh dan penuh perhatian. Dalam bahasa Indonesia modern, “Dengarkanlah” menyampaikan permohonan itu secara alami dan khidmat.
- source_word: רִנָּתִי
  choice: seruanku
  rationale: Dalam konteks ratapan, רִנָּה menunjuk pada seruan nyaring untuk meminta pertolongan, bukan nyanyian sukacita.
- source_word: כִּי דַלּוֹתִי מְאֹד
  choice: sebab aku sudah menjadi sangat lemah
  rationale: דַלּוֹתִי menyatakan keadaan yang telah merosot atau menjadi lemah; “sudah menjadi sangat lemah” mempertahankan nuansa resultatif tanpa membuat bahasa Indonesia terasa kaku.
- source_word: הַצִּילֵנִי
  choice: Lepaskanlah aku
  rationale: Bentuk ini menyatakan permohonan agar dibebaskan atau diselamatkan dari ancaman konkret. “Lepaskanlah aku” menjaga fokus pada pembebasan dari para pengejar.
- source_word: מֵרֹדְפַי
  choice: dari orang-orang yang mengejarku
  rationale: Partisipel רדף secara langsung menunjuk pada mereka yang mengejar pemazmur. Bentuk frasa ini lebih alami bagi pembaca Indonesia daripada nomina “para pengejarku”.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: sebab mereka lebih kuat daripada aku
  rationale: מִמֶּנִּי memberi arti perbandingan pada verba kekuatan, sehingga klausa ini secara wajar berarti bahwa para pengejar lebih kuat daripada pemazmur.
theological_decisions:
- issue: Kemungkinan makna teologis yang lebih luas dari verba penyelamatan
  choice: Lepaskanlah aku
  alternative: Selamatkanlah aku; luputkanlah aku
  rationale: Konteks menyebut ancaman konkret dari orang-orang yang mengejar pemazmur. Pilihan ini mempertahankan pembebasan dari bahaya tersebut tanpa mempersempit atau memperluasnya menjadi rumusan doktrinal tentang keselamatan.
- issue: Nuansa keadaan pemazmur dalam דַלּוֹתִי
  choice: aku sudah menjadi sangat lemah
  alternative: aku telah dibawa sangat rendah; keadaanku sangat terpuruk
  rationale: Bentuk Ibrani dapat menyatakan telah menjadi lemah, berkurang, atau sangat direndahkan. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Akhiran -lah mempertahankan nada permohonan doa tanpa terdengar kuno. Susunan klausa sebab dipertahankan agar alur ratapan dan alasan bagi kedua permohonan tetap jelas.
