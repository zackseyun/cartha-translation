base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/003.yaml
  text: When my spirit grows faint within me[a], you know my path. On the way where I walk[b], they have hidden a trap for me.
translation:
  language: id
  text: Ketika rohku semakin lemah dalam diriku[a], Engkau mengetahui jalanku. Di jalan yang kutempuh, mereka telah menyembunyikan perangkap[b] untukku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ketika rohku tertekan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “jerat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הִתְעַטֵּף
  choice: ketika ... menjadi lemah
  rationale: Preposisi ב pada bentuk infinitif membentuk anak kalimat waktu. Verba ini dapat menyatakan menjadi lemah, merana, atau diliputi tekanan; ‘menjadi lemah’ alami dan tidak mempersempit maknanya secara berlebihan.
- source_word: רוּחִי
  choice: rohku
  rationale: רוּחַ di sini menunjuk pada hidup batin pemazmur yang sedang tertekan, bukan angin harfiah. ‘Rohku’ mempertahankan istilah sumber dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: עָלַי
  choice: di dalam diriku
  rationale: Secara harfiah berarti ‘atas/padaku’, tetapi dalam ungkapan tentang roh yang melemah, bahasa Indonesia secara alami menyatakan keruntuhan batin sebagai sesuatu yang terjadi ‘di dalam diriku’.
- source_word: יָדַעְתָּ
  choice: Engkau mengetahui
  rationale: Bentuk qatal dalam puisi dapat menyatakan keadaan yang berlaku kini. Pilihan ini menegaskan pengetahuan Allah pada saat pemazmur tertekan tanpa menambahkan klaim di luar teks.
- source_word: נְתִיבָתִי
  choice: jalanku
  rationale: Nomina ini berarti jalan, lintasan, atau arah perjalanan. ‘Jalanku’ ringkas dan mempertahankan metafora perjalanan hidup.
- source_word: בְּאֹרַח
  choice: di jalan
  rationale: Ungkapan ini menunjuk pada jalan atau lintasan. ‘Di jalan’ alami dan mempertahankan gambaran perjalanan.
- source_word: זוּ
  choice: yang
  rationale: זוּ berfungsi sebagai unsur relatif yang menerangkan ‘jalan’; dalam bahasa Indonesia, konstruksi ‘jalan yang kutempuh’ paling alami.
- source_word: אֲהַלֵּךְ
  choice: kutempuh
  rationale: הלך menyatakan gerak atau perjalanan yang sedang dijalani. ‘Kutempuh’ mempertahankan metafora berjalan sekaligus lebih idiomatis daripada ‘aku berjalan’ setelah kata ‘jalan’.
- source_word: טָמְנוּ
  choice: mereka telah menyembunyikan
  rationale: Verba ini berarti menyembunyikan atau memasang secara tersembunyi, khususnya perangkap. ‘Telah menyembunyikan’ menyampaikan tindakan yang sudah dilakukan dan masih mengancam pemazmur.
- source_word: פַח
  choice: perangkap
  rationale: פַח berarti perangkap atau jerat. ‘Perangkap’ merupakan istilah modern yang luas dan mudah dipahami; ‘jerat’ dicatat sebagai padanan alternatif.
- source_word: לִי
  choice: bagiku
  rationale: Preposisi ini menandai pemazmur sebagai sasaran perangkap. ‘Bagiku’ mempertahankan bentuk ringkas teks sumber tanpa menambahkan tindakan jatuh ke dalamnya.
theological_decisions:
- issue: Pengetahuan Allah tentang jalan pemazmur
  choice: Engkau mengetahui jalanku
  alternative: Engkau telah mengetahui jalanku
  rationale: Bentuk lampau Ibrani dalam puisi dapat berfungsi secara statif. Terjemahan kini mempertahankan penekanan bahwa Allah mengetahui keadaan dan jalan pemazmur saat ia berdoa, tanpa memperluas pernyataan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Huruf kapital pada ‘Engkau’ mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk sapaan kepada Allah. Metafora jalan dan perangkap dipertahankan, sedangkan susunan kalimat dibuat alami bagi pembaca masa kini.
