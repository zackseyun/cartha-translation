  text: הַבֵּ֤יט יָמִ֨ין וּ/רְאֵה֮ וְ/אֵֽין לִ֪/י מַ֫כִּ֥יר אָבַ֣ד מָנ֣וֹס מִמֶּ֑/נִּי אֵ֖ין דּוֹרֵ֣שׁ לְ/נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/004.yaml
  text: 'Look to the right and see: there is no one who recognizes me[a]; refuge has perished from me[b]; no one seeks my life.'
translation:
  language: id
  text: 'Pandanglah ke kanan dan lihatlah: tidak ada seorang pun yang mengenaliku; tempat berlindung telah lenyap dariku[a]; tidak ada seorang pun yang memedulikan hidupku[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan pelarian telah lenyap dariku”; kata Ibrani ini dapat berarti tempat maupun sarana untuk melarikan diri.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “mencari hidupku”; atau “mencari jiwaku.” Dalam konteks ini, ungkapan itu berarti menaruh perhatian pada hidup atau diri pemazmur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּיט
  choice: Pandanglah
  rationale: Bentuk imperatif ini menyerukan pengamatan secara langsung. “Pandanglah” mempertahankan nada mendesak dan puitis.
- source_word: יָמִין
  choice: ke kanan
  rationale: Menunjuk sisi kanan, tempat seorang pendukung atau pembela dapat berdiri, tanpa menjadikan implikasi kontekstual itu eksplisit dalam teks.
- source_word: וּרְאֵה
  choice: dan lihatlah
  rationale: Imperatif kedua dipertahankan agar penegasan berpasangan dalam bahasa Ibrani tetap terdengar.
- source_word: מַכִּיר
  choice: yang mengenaliku
  rationale: Partisip ini dapat berarti mengenali atau mengakui seseorang. “Mengenaliku” alami dalam bahasa Indonesia dan dalam konteks ini menyiratkan tidak adanya orang yang mengakui hubungan atau keberpihakan kepadanya.
- source_word: אָבַד
  choice: telah lenyap
  rationale: Kata kerja ini menyatakan bahwa sesuatu telah hilang atau tidak ada lagi. “Telah lenyap” mempertahankan ketegasan ratapan tanpa ungkapan Indonesia yang janggal seperti “telah binasa” untuk tempat perlindungan.
- source_word: מָנוֹס
  choice: tempat berlindung
  rationale: Nomina ini dapat menunjuk tempat atau sarana untuk melarikan diri. “Tempat berlindung” paling alami dalam konteks ratapan, sementara kemungkinan “jalan pelarian” dicatat dalam catatan kaki.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Menerjemahkan secara langsung preposisi מן dengan akhiran orang pertama dan menggambarkan bahwa perlindungan telah hilang dari jangkauan atau kepunyaan pemazmur.
- source_word: דּוֹרֵשׁ
  choice: memedulikan
  rationale: Secara dasar berarti mencari atau menanyakan, tetapi dengan לְנַפְשִׁי dalam ratapan ini menyatakan perhatian terhadap keadaan dan keselamatan pemazmur. Terjemahan harfiah “mencari hidupku” dalam bahasa Indonesia mudah disalahartikan sebagai hendak membunuhnya.
- source_word: לְנַפְשִׁי
  choice: hidupku
  rationale: נפש di sini paling wajar menunjuk hidup atau diri pemazmur, bukan secara khusus unsur batin yang terpisah dari tubuh.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks ratapan
  choice: hidupku
  alternative: jiwaku; diriku
  rationale: Konteksnya adalah keterasingan serta ketiadaan perlindungan, sehingga kata ini terutama menunjuk hidup atau diri pemazmur. Pilihan ini tidak memasukkan pembedaan antropologis yang tidak dituntut oleh teks.
- issue: Nuansa דּוֹרֵשׁ לְנַפְשִׁי
  choice: memedulikan hidupku
  alternative: mencari hidupku; menanyakan tentang diriku
  rationale: Ungkapan Ibrani tetap mengandung gagasan mencari atau menanyakan keadaan seseorang, yang dalam konteks menyatakan kepedulian. Bahasa utama menyampaikan makna kontekstual, sedangkan catatan kaki mempertahankan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas dan bermartabat. Pengulangan imperatif dipertahankan untuk mencerminkan paralelisme Ibrani. Semua penanda catatan kaki ditempatkan pada bagian teks yang benar-benar dijelaskannya.
