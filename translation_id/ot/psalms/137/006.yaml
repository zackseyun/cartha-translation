  text: תִּדְבַּ֥ק לְשׁוֹנִ֨/י לְ/חִכִּ/י֮ אִם לֹ֪א אֶ֫זְכְּרֵ֥/כִי אִם לֹ֣א אַ֭עֲלֶה אֶת יְרוּשָׁלִַ֑ם עַ֝֗ל רֹ֣אשׁ שִׂמְחָתִֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/006.yaml
  text: May my tongue cling to the roof of my mouth if I do not remember you[b][a], if I do not exalt Jerusalem above my highest joy.
translation:
  language: id
  text: Biarlah lidahku melekat pada langit-langit mulutku jika aku tidak mengingat engkau, jika aku tidak menempatkan Yerusalem di atas segala sukacitaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas kepala sukacitaku,” yaitu sebagai sukacitaku yang terutama.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְבַּק
  choice: Biarlah ... melekat
  rationale: Bentuk ini menyampaikan konteks sumpah yang berisi kutukan atas diri sendiri. “Melekat” mempertahankan gambaran fisik dari akar דבק secara wajar dan bermartabat.
- source_word: לְשׁוֹנִי
  choice: lidahku
  rationale: Istilah anatomis ini diterjemahkan langsung karena hilangnya kemampuan berbicara merupakan inti gambaran sumpah tersebut.
- source_word: לְחִכִּי
  choice: pada langit-langit mulutku
  rationale: חֵךְ berarti langit-langit mulut atau palatum. Pilihan ini konkret dan lebih mudah dipahami pembaca umum daripada istilah teknis “palatum”.
- source_word: אִם לֹא
  choice: jika aku tidak
  rationale: Mempertahankan susunan syarat dalam bahasa Ibrani dan kaitannya dengan kutukan atas diri sendiri.
- source_word: אֶזְכְּרֵכִי
  choice: aku tidak mengingat engkau
  rationale: זכר berarti “mengingat”; akhiran feminin tunggal merujuk secara alami kepada Yerusalem yang disapa langsung.
- source_word: אַעֲלֶה אֶת יְרוּשָׁלִַם
  choice: aku tidak menempatkan Yerusalem
  rationale: Bentuk Hifil dari עלה secara harfiah berarti “membuat naik,” tetapi bersama עַל רֹאשׁ menyatakan pemberian kedudukan yang paling utama. “Menempatkan” mempertahankan gagasan peringkat tanpa membuat tindakan fisik yang tidak dimaksudkan.
- source_word: עַל רֹאשׁ שִׂמְחָתִי
  choice: di atas segala sukacitaku
  rationale: Ungkapan harfiahnya, “di atas kepala sukacitaku,” menyatakan bahwa Yerusalem harus mendapat tempat melebihi setiap sukacita lain. Terjemahan ini alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan akhiran feminin tunggal pada אֶזְכְּרֵכִי
  choice: “Engkau” merujuk kepada Yerusalem yang dipersonifikasikan dan disapa langsung.
  alternative: Acuannya dapat disebut Sion atau kota itu secara lebih umum dalam sapaan puitis.
  rationale: Yerusalem merupakan acuan yang paling alami dalam konteks mazmur, dan bentuk feminin akhiran tersebut sesuai dengan gender gramatikal nama kota. Sapaan langsung dipertahankan tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Bentuk “Biarlah” mempertahankan daya sumpah, sedangkan gambaran tubuh dan sapaan langsung kepada Yerusalem dipertahankan. Penanda catatan kaki [a] tercantum dalam teks utama.
