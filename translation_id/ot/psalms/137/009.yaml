  - severity: low
    issue: “menghempaskan ... ke batu cadas”
    rationale: Dalam bahasa Indonesia, “membanting ... pada batu cadas” lebih idiomatis untuk tindakan membenturkan sesuatu dengan keras pada permukaan dan lebih dekat dengan fungsi אֶל dalam konstruksi ini.
