  source_fidelity: Teks Ibrani menyatakan secara langsung, “Berbahagialah orang yang memegang/meraih lalu membanting anak-anakmu yang masih sangat kecil pada batu cadas.” Draf mempertahankan subjek, dua tindakan kekerasan, objek dengan sufiks orang kedua feminin, dan sasaran benturan. Namun, “menangkap” lebih lazim berarti menangkap atau menawan, bukan mengambil pegangan/meraih (אחז), dan “menghempaskan ... ke” kurang setepat konstruksi benturan “pada.”
  naturalness: Register draf sudah lugas dan khidmat. “Memegang dan membanting ... pada batu cadas” lebih alami serta lebih jelas menyatakan bahwa batu cadas merupakan permukaan benturan.
  terminology: “Berbahagialah” merupakan padanan yang baik untuk אַשְׁרֵי. “Anak-anakmu yang masih sangat kecil” mempertahankan cakupan עֹלָלַיִךְ tanpa membatasinya hanya pada bayi. Catatan alternatif “bayi-bayimu” tetap tepat.
