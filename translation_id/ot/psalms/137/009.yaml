  text: Blessed is the one who seizes and dashes your little ones against the rock[a].
translation:
  language: id
  text: Berbahagialah orang yang memegang dan membanting anak-anakmu yang masih sangat kecil pada batu cadas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bayi-bayimu.” Kata Ibrani ini merujuk kepada anak-anak yang masih sangat kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Ungkapan ini menyatakan penilaian atau seruan tentang keadaan yang diberkati. Bentuk yang lugas dan khidmat ini mempertahankan ketegangan etis dalam konteks mazmur ratapan dan pembalasan.
- source_word: שֶׁיֹּאחֵז
  choice: orang yang menangkap
  rationale: Partikel relatif dan verba menunjuk kepada pelaku tindakan. 'Menangkap' alami dalam bahasa Indonesia dan menyampaikan tindakan memegang secara paksa.
- source_word: וְנִפֵּץ
  choice: dan menghempaskan
  rationale: Verba ini menggambarkan tindakan membenturkan dengan keras hingga remuk. 'Menghempaskan ... ke' mempertahankan kekerasan gambaran tanpa memperhalusnya.
- source_word: עֹלָלַיִךְ
  choice: anak-anakmu yang masih kecil
  rationale: Nomina ini merujuk kepada anak-anak yang sangat muda. Pilihan ini alami, menyatakan usia muda, dan tidak mempersempit maknanya secara pasti hanya kepada bayi.
- source_word: אֶל הַסָּלַע
  choice: ke batu cadas
  rationale: Dalam konstruksi dengan verba benturan keras, 'ke' menyatakan arah sekaligus titik benturan. 'Batu cadas' menangkap makna סֶלַע sebagai batu besar atau cadas.
theological_decisions:
- issue: Daya etis dan teologis אַשְׁרֵי dalam konteks mazmur kutukan
  choice: Menerjemahkannya secara langsung sebagai 'Berbahagialah' tanpa memperhalus atau memberi penilaian moral tambahan.
  alternative: '''Beruntunglah'' atau perumusan yang mengurangi bobot pernyataan tersebut.'
  rationale: Teks Ibrani dengan tegas menyatakan אַשְׁרֵי dalam seruan pembalasan terhadap Babel. Terjemahan perlu mempertahankan ketegangan retoris dan teologis itu, bukan menyelesaikannya melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia modern yang lugas, khidmat, dan dapat dipahami pembaca umum. Kekerasan gambaran sumber dipertahankan tanpa eufemisme; penanda catatan kaki [a] ditempatkan dalam teks utama.
