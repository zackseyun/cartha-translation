  text: אֵ֗יךְ נָשִׁ֥יר אֶת שִׁיר יְהוָ֑ה עַ֝֗ל אַדְמַ֥ת נֵכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/004.yaml
  text: How can we sing the song of Yahweh on foreign soil?[a][b]
translation:
  language: id
  text: Bagaimana mungkin kita menyanyikan nyanyian Yahweh[a] di tanah asing?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “nyanyian YHWH”; secara tradisional diterjemahkan “nyanyian TUHAN.”'
    reason: alternative_reading
  - marker: b
    text: Atau “di negeri asing.” Secara harfiah, bahasa Ibrani mengatakan “di atas/pada tanah asing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Bagaimana mungkin
  rationale: Kata tanya ini menanyakan cara, tetapi dalam konteks ratapan mengandung pertanyaan retoris tentang kemungkinan atau kepatutan. “Bagaimana mungkin” menyampaikan daya emosional itu secara alami dalam bahasa Indonesia.
- source_word: נָשִׁיר
  choice: kita menyanyikan
  rationale: Bentuk Qal imperfek orang pertama jamak dari נָשַׁר, “menyanyi.” Sesudah “bagaimana mungkin,” bentuk “kita menyanyikan” merupakan susunan Indonesia yang alami.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung bahasa Ibrani ini tidak memiliki padanan tersendiri yang diperlukan dalam bahasa Indonesia.
- source_word: שִׁיר
  choice: nyanyian
  rationale: Dalam rangkaian konstruksi שִׁיר יְהוָה, kata ini menunjuk pada nyanyian yang khas bagi atau ditujukan kepada Yahweh. “Nyanyian Yahweh” mempertahankan bentuk ringkas dan hubungan konstruksi tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: עַל
  choice: di
  rationale: Secara harfiah berarti “di atas/pada.” Dalam bahasa Indonesia, “di tanah asing” merupakan ungkapan lokatif yang alami tanpa menghilangkan gambaran tanah.
- source_word: אַדְמַת
  choice: tanah
  rationale: Kata אֲדָמָה menunjuk pada tanah atau bumi. “Tanah” mempertahankan gambaran konkret sumber dan lebih alami daripada “permukaan tanah” dalam konteks ini.
- source_word: נֵכָר
  choice: asing
  rationale: Menunjuk pada sesuatu yang berasal dari atau menjadi milik bangsa lain. “Asing” adalah padanan modern yang jelas dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi YHWH secara langsung. “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” adalah penggantian tradisional dengan sebuah gelar.
- issue: Hubungan genitif dalam שִׁיר יְהוָה
  choice: nyanyian Yahweh
  alternative: nyanyian bagi Yahweh
  rationale: Konstruksi Ibrani dapat mencakup nyanyian yang menjadi ciri ibadah kepada Yahweh atau ditujukan kepada-Nya. Bentuk “nyanyian Yahweh” mempertahankan keluasan hubungan itu dan tidak mempersempitnya menjadi tujuan saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang khidmat. “Bagaimana mungkin” mempertahankan kekuatan pertanyaan retoris, sedangkan “tanah asing” menjaga citraan konkret teks Ibrani.
