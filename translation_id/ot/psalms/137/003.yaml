  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
translation:
  language: id
  text: 'Sebab di sana para penawan kami meminta nyanyian dari kami, dan para penindas kami[a] meminta kegembiraan: “Nyanyikanlah untuk kami salah satu nyanyian Sion.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pengejek kami”; istilah Ibraninya jarang dipakai dan dapat menekankan penindasan yang kejam atau ejekan yang merendahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi ayat sebelumnya dan mempertahankan hubungan kausal dalam alur mazmur.
- source_word: שָׁם
  choice: di sana
  rationale: Merujuk secara lokatif kepada tempat pembuangan yang disebut dalam konteks.
- source_word: שְׁאֵלוּנוּ
  choice: meminta dari kami
  rationale: Mengungkapkan tindakan meminta sesuatu dari para tawanan; bentuk ini juga memungkinkan objek permintaan mengikuti secara alami.
- source_word: שׁוֹבֵינוּ
  choice: para penawan kami
  rationale: Berasal dari akar yang berarti membawa atau menawan; pilihan ini tepat dan ringkas.
- source_word: דִּבְרֵי שִׁיר
  choice: syair nyanyian
  rationale: Mewakili ungkapan harfiah 'kata-kata nyanyian' dalam bahasa Indonesia yang lebih alami, dengan penekanan pada kata-kata yang dinyanyikan.
- source_word: וְתוֹלָלֵינוּ
  choice: dan para penyiksa kami
  rationale: Istilah Ibrani ini jarang dan tidak pasti; 'para penyiksa' menangkap perlakuan bermusuhan dalam konteks ratapan tanpa menghilangkan alternatif ejekan yang dicatat dalam catatan kaki.
- source_word: שִׂמְחָה
  choice: kegembiraan
  rationale: Mengacu pada sukacita atau kemeriahan yang dituntut oleh para penawan sebagai hiburan.
- source_word: שִׁירוּ לָנוּ
  choice: Nyanyikanlah bagi kami
  rationale: Imperatif jamak dengan ל menyatakan pertunjukan demi para pendengar; 'bagi kami' mempertahankan nuansa tersebut.
- source_word: מִשִּׁיר צִיּוֹן
  choice: salah satu nyanyian Sion
  rationale: 'Preposisi מִן bersifat partitif: mereka meminta satu nyanyian dari kumpulan nyanyian yang berkaitan dengan Sion.'
