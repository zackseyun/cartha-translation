  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִֽם אֶשְׁכָּחֵ֥/ךְ יְֽרוּשָׁלִָ֗ם תִּשְׁכַּ֥ח יְמִינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/005.yaml
  text: If I forget you[a], Jerusalem, may my right hand forget.
translation:
  language: id
  text: Jika aku melupakan engkau, Yerusalem, biarlah tangan kananku lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mengungkapkan maksudnya secara lebih lengkap, “biarlah tangan kananku melupakan keterampilannya.” Bahasa Ibrani di sini eliptis; pengertian yang lebih lengkap ini disimpulkan dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Membuka pernyataan bersyarat yang berfungsi sebagai sumpah; “Jika” merupakan padanan langsung dan alami dalam bahasa Indonesia.
- source_word: אֶשְׁכָּחֵךְ
  choice: aku melupakan engkau
  rationale: Bentuk Qal imperfek orang pertama tunggal dengan sufiks orang kedua feminin tunggal; mempertahankan sapaan langsung kepada Yerusalem. “Engkau” dipilih untuk ragam puitis yang bermartabat.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Nama tempat baku dalam bahasa Indonesia dan berfungsi sebagai sapaan langsung.
- source_word: תִּשְׁכַּח
  choice: biarlah ... lupa
  rationale: Bentuk imperfek orang ketiga feminin tunggal dipakai dengan daya jusif dalam kutuk diri yang menyertai sumpah. “Biarlah” menyampaikan daya tersebut secara alami tanpa mengubah keaktifan verba.
- source_word: יְמִינִי
  choice: tangan kananku
  rationale: יָמִין di sini secara wajar berarti tangan kanan, yakni alat untuk melakukan keterampilan dalam konteks nyanyian dan permainan musik.
theological_decisions:
- issue: Kutuk diri eliptis pada bagian kedua ayat
  choice: biarlah tangan kananku lupa
  alternative: biarlah tangan kananku melupakan keterampilannya
  rationale: Teks Masoret secara harfiah dan ringkas menyatakan bahwa tangan kanan ‘lupa’ tanpa menyebut objek. Terjemahan utama mempertahankan elipsis dan ketegangan teks, sedangkan makna kontekstual yang lebih eksplisit dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Penggunaan “aku/engkau” sesuai dengan tuturan mazmur dan mempertahankan sapaan pribadi kepada Yerusalem. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
