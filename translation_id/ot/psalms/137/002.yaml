lexical_decisions:
- source_word: עַל
  choice: pada
  rationale: Menunjukkan letak alat musik yang digantung pada pohon; 'pada' alami dalam bahasa Indonesia.
- source_word: עֲרָבִים
  choice: pohon-pohon poplar
  rationale: Istilah Ibrani ini dapat menunjuk pada pohon jenis dedalu atau poplar. 'Poplar' mungkin lebih sesuai dengan latar Mesopotamia, sementara alternatif tradisional 'dedalu' dipertahankan dalam catatan kaki.
- source_word: בְּתוֹכָהּ
  choice: di tengahnya
  rationale: Mempertahankan sufiks feminin tunggal yang secara alami mengacu pada Babel dalam ayat sebelumnya tanpa menambahkan rujukan yang tidak dinyatakan secara eksplisit.
- source_word: תָּלִינוּ
  choice: kami menggantungkan
  rationale: Menerjemahkan secara langsung verba Qal perfektum orang pertama jamak dari תלה dan menyampaikan tindakan menaruh alat-alat musik itu dalam suasana dukacita.
- source_word: כִּנֹּרוֹתֵינוּ
  choice: kecapi kami
  rationale: כִּנּוֹר adalah alat musik petik kuno, kemungkinan sejenis lira. 'Kecapi' lebih mudah dipahami pembaca Indonesia, sedangkan 'lira' dicantumkan sebagai alternatif yang lebih teknis.
