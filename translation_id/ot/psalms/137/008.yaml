  text: Daughter Babylon[a], devastated one[b], blessed is the one who repays you with the recompense you dealt to us.
translation:
  language: id
  text: Putri Babel[a], engkau yang diluluhlantakkan[b], berbahagialah orang yang membalasmu setimpal dengan apa yang telah kaulakukan terhadap kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Putri dari Babel”; ungkapan Ibrani ini mempersonifikasikan Babel sebagai seorang putri, yakni sebuah kota.
    reason: lexical_alternative
  - marker: b
    text: Atau “engkau yang dihancurkan” atau “engkau yang dijarah”; istilah Ibrani ini dapat menekankan kehancuran yang telah dialami ataupun kehancuran yang akan menimpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת בָּבֶל
  choice: Putri Babel
  rationale: Ungkapan konstruksi ini mempersonifikasikan kota dan penduduk Babel sebagai seorang putri. Bentuk ringkas “Putri Babel” mempertahankan citra puitis Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: הַשְּׁדוּדָה
  choice: engkau yang diluluhlantakkan
  rationale: Partisip pasif feminin dari שׁדד menggambarkan sosok yang dihancurkan atau dijarah. “Diluluhlantakkan” menyampaikan kuatnya kehancuran tanpa menjadikan orientasi waktunya eksplisit; kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: אַשְׁרֵי
  choice: berbahagialah orang
  rationale: Ungkapan ini adalah rumusan ucapan bahagia yang lazim dalam Mazmur. “Berbahagialah” mempertahankan nada luhur dan daya deklaratifnya, bukan sekadar menyatakan perasaan senang.
- source_word: שֶׁיְשַׁלֶּם לָךְ
  choice: yang membalas kepadamu
  rationale: Dalam konteks ini, verba שׁלם menyatakan pembayaran kembali atau pembalasan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gagasan timbal balik yang bersifat yudisial.
- source_word: אֶת גְּמוּלֵךְ
  choice: setimpal
  rationale: גְּמוּל menunjuk pada balasan atau ganjaran. “Setimpal” menyampaikan bahwa Babel menerima kembali perlakuan yang sepadan dengan tindakannya.
- source_word: שֶׁגָּמַלְתְּ לָנוּ
  choice: dengan apa yang kauperbuat kepada kami
  rationale: גמל dapat berarti memperlakukan atau berbuat terhadap seseorang, dengan nilai moral ditentukan oleh konteks. Frasa ini terdengar alami dan tidak menambahkan rincian kekerasan yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Ucapan bahagia bagi orang yang membalas Babel
  choice: Mempertahankan ucapan “berbahagialah” sebagaimana dinyatakan teks, tanpa melunakkannya menjadi sekadar ramalan.
  alternative: Mengalihkannya menjadi prediksi masa depan atau memparafrasakannya agar tuntutan pembalasan terasa lebih ringan.
  rationale: Teks Ibrani benar-benar memakai rumusan ucapan bahagia bagi orang yang membalas Babel secara setimpal. Terjemahan perlu mempertahankan ketegangan antara ratapan, keadilan pembalasan, dan kerasnya doa kutukan tanpa menyelesaikan atau menutupinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan sesuai laras Mazmur. Bentuk “kauperbuat” menjaga kelancaran baris puitis, sedangkan “setimpal” menyampaikan hubungan pembalasan secara alami tanpa mengurangi kerasnya ucapan kutukan.
