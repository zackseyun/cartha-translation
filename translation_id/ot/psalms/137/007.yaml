  text: זְכֹ֤ר יְהוָ֨ה לִ/בְנֵ֬י אֱד֗וֹם אֵת֮ י֤וֹם יְֽרוּשָׁ֫לִָ֥ם הָ֭/אֹ֣מְרִים עָ֤רוּ עָ֑רוּ עַ֝֗ד הַ/יְס֥וֹד בָּֽ/הּ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/007.yaml
  text: Remember[a], O Yahweh, against the sons of Edom the day of Jerusalem, those who were saying, “Lay it bare, lay it bare[b], down to its foundation!”
translation:
  language: id
  text: Ingatlah, ya Yahweh, bani Edom pada hari Yerusalem, mereka yang berkata, “Bongkarlah, bongkarlah sampai ke fondasinya!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Imperatif orang kedua tunggal yang ditujukan kepada Yahweh. Bentuk ini alami dalam ratapan dan tetap membiarkan frasa berikutnya menyampaikan daya adversatif atau yudisial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: לִבְנֵי אֱדוֹם
  choice: terhadap bani Edom
  rationale: Preposisi ל dalam konteks permohonan penghukuman ini bersifat adversatif. 'Bani Edom' mempertahankan ungkapan kebangsaan-kekeluargaan Ibrani secara wajar dalam bahasa Indonesia.
- source_word: אֵת יוֹם יְרוּשָׁלִָם
  choice: hari Yerusalem
  rationale: Mempertahankan ungkapan Ibrani yang ringkas dan ambigu; konteks menunjukkan hari malapetaka atau kejatuhan kota itu tanpa menambahkannya ke teks utama.
- source_word: הָאֹמְרִים
  choice: mereka yang berkata
  rationale: Mengidentifikasi bani Edom melalui seruan mereka. Bahasa Indonesia tidak perlu memaksakan aspek progresif yang terdengar kaku.
- source_word: עָרוּ עָרוּ
  choice: Bongkarlah, bongkarlah
  rationale: Imperatif berulang dari ערה menggambarkan penelanjangan atau pembongkaran menyeluruh. 'Bongkarlah' alami untuk kota dan tidak sekuat interpretasi khusus 'ratakanlah'.
- source_word: עַד הַיְסוֹד בָּהּ
  choice: sampai ke dasarnya
  rationale: Menyampaikan penghancuran hingga tingkat fondasi sambil mempertahankan bentuk tunggal dan menghasilkan frasa Indonesia yang idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Daya permohonan זְכֹר ... לִבְנֵי אֱדוֹם
  choice: Ingatlah ... terhadap bani Edom
  alternative: Perhitungkanlah kepada bani Edom
  rationale: Pilihan utama mempertahankan idiom 'mengingat' dan membiarkan implikasi penghakiman muncul dari konteks, tanpa memperjelasnya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Seruan berulang dipertahankan untuk menjaga tekanan puitis. Ungkapan ringkas 'hari Yerusalem' sengaja dipertahankan dalam teks utama, dengan penjelasan di catatan kaki.
