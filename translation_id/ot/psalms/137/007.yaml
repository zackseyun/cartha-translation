- from: Ingatlah, ya Yahweh, terhadap bani Edom, hari Yerusalem[a], mereka yang berkata, “Bongkarlah, bongkarlah[b] sampai ke dasarnya!”
  to: Ingatlah, ya Yahweh, bani Edom pada hari Yerusalem, mereka yang berkata, “Bongkarlah, bongkarlah sampai ke fondasinya!”
  rationale: Revisi memperbaiki keterbacaan sintaksis dengan menandai “hari Yerusalem” sebagai keterangan waktu, tanpa menguraikan malapetaka Yerusalem dalam teks utama. “Fondasinya” menggantikan “dasarnya” agar makna הַיְסוֹד tetap spesifik. Catatan kaki diselaraskan dengan pilihan leksikal yang lebih alami dalam bahasa Indonesia.
