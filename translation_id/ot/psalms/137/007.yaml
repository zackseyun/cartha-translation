review_pass:
  verdict: revise
  source_fidelity: Teks utama mempertahankan nama Yahweh, ungkapan ringkas “hari Yerusalem,” pengulangan imperatif, dan cakupan penghancuran hingga fondasi. Namun, “terhadap bani Edom, hari Yerusalem” tidak membentuk hubungan sintaktis yang jelas dalam bahasa Indonesia; preposisi adversatif itu perlu ditautkan dengan frasa waktu tanpa mengubah implikasi penghakiman yang tersirat dalam bahasa Ibrani.
  naturalness: “Ingatlah ... terhadap bani Edom, hari Yerusalem” terdengar tidak baku dan sukar dipahami. “Pada hari Yerusalem” mempertahankan ungkapan sumber yang sengaja padat, sementara “sampai ke fondasinya” lebih tepat dan idiomatis daripada “sampai ke dasarnya” untuk הַיְסוֹד.
  terminology: “Yahweh” tepat. “Bani Edom” dapat dipertahankan sebagai padanan formal dan masih dapat dipahami dalam register khidmat. “Bongkarlah” dapat dipakai untuk seruan terhadap kota, tetapi catatan kaki sebaiknya tidak menjadikan “telanjangilah” sebagai alternatif utama yang alami dalam bahasa Indonesia; “singkapkanlah” lebih jelas untuk nuansa leksikal, dengan “ratakanlah” sebagai alternatif yang berorientasi hasil.
  issues:
  - severity: medium
    issue: Hubungan “terhadap bani Edom, hari Yerusalem” tidak jelas secara sintaktis.
    rationale: לִבְנֵי אֱדוֹם menyatakan sasaran permohonan yang bernuansa adversatif, sedangkan אֵת יוֹם יְרוּשָׁלִָם adalah objek/hal yang diingat. Dalam bahasa Indonesia, penambahan “pada” membuat hubungan temporal dapat dipahami tanpa menambahkan “kejatuhan” ke teks utama.
  - severity: low
    issue: “sampai ke dasarnya” kurang spesifik untuk הַיְסוֹד.
    rationale: הַיְסוֹד merujuk pada fondasi. “Sampai ke fondasinya” menyampaikan makna ini dengan lebih tepat dan tetap idiomatis.
  - severity: low
    issue: Alternatif catatan kaki “Telanjangilah” tidak alami untuk penghancuran sebuah kota.
    rationale: Akar ערה memiliki nuansa menyingkapkan/menelanjangi, tetapi “singkapkanlah” lebih dapat dipahami dalam bahasa Indonesia; “ratakanlah” dapat tetap dicatat sebagai padanan hasil yang lebih interpretatif.
  revised_text: Ingatlah, ya Yahweh, bani Edom pada hari Yerusalem, mereka yang berkata, “Bongkarlah, bongkarlah sampai ke fondasinya!”
