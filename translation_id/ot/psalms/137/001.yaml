source:
  edition: WLC
  text: עַ֥ל נַהֲר֨וֹת בָּבֶ֗ל שָׁ֣ם יָ֭שַׁבְנוּ גַּם בָּכִ֑ינוּ בְּ֝/זָכְרֵ֗/נוּ אֶת צִיּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/001.yaml
  text: By the rivers of Babylon[a], there we sat down[b]; we also wept when we remembered Zion.
translation:
  language: id
  text: Di tepi sungai-sungai Babel[a], di sanalah kami duduk[b]; kami pun menangis ketika mengingat Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Di tepi aliran-aliran air Babel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di sanalah kami duduk dan menangis ketika mengingat Sion.” Dalam bahasa Ibrani terdapat juga partikel tambahan yang dapat berarti “pun”, “juga”, atau “bahkan” sebelum kata “menangis”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: di tepi
  rationale: Dalam frasa tempat bersama sungai-sungai, preposisi ini menyatakan lokasi di dekat atau di sisi; “di tepi” alami dalam bahasa Indonesia dan tidak memberi kesan berada di atas air.
- source_word: נַהֲרוֹת
  choice: sungai-sungai
  rationale: Bentuk jamak נָהָר lazimnya berarti sungai; pengulangan nomina merupakan bentuk jamak baku yang jelas dalam bahasa Indonesia.
- source_word: בָּבֶל
  choice: Babel
  rationale: “Babel” adalah bentuk nama tempat yang mapan dalam tradisi dan bahasa Alkitab Indonesia untuk Babilonia kuno.
- source_word: שָׁם
  choice: di sanalah
  rationale: 'Partikel -lah mempertahankan penekanan deiktis שָׁם: mereka berada di sana, di Babel, bukan di Sion.'
- source_word: יָשַׁבְנוּ
  choice: kami duduk
  rationale: Dalam adegan ratapan di tepi sungai, makna “duduk” lebih langsung daripada “tinggal”; bahasa Indonesia tidak memerlukan tambahan “turun” untuk menggambarkan tindakan ini.
- source_word: גַּם
  choice: pun
  rationale: '“Pun” mempertahankan daya tambah atau penegasan גַּם secara alami: selain duduk, mereka juga menangis.'
- source_word: בָּכִינוּ
  choice: kami menangis
  rationale: Kata kerja ini menyatakan tangisan atau ratapan; “menangis” alami, khidmat, dan mudah dipahami.
- source_word: בְּזָכְרֵנוּ
  choice: ketika mengingat
  rationale: Preposisi ב pada infinitif konstruk dapat berfungsi temporal; “ketika mengingat” mempertahankan hubungan waktu tanpa memaksakan bahwa ingatan itu semata-mata penyebab tangisan.
- source_word: אֶת צִיּוֹן
  choice: Sion
  rationale: Penanda objek אֶת tidak diterjemahkan, sedangkan nama צִיּוֹן dipertahankan sebagai “Sion” agar nama dan gema puitis-teologisnya tidak diratakan menjadi “Yerusalem”.
theological_decisions:
- issue: Penerjemahan צִיּוֹן
  choice: Sion
  alternative: Yerusalem
  rationale: Teks secara khusus menyebut Sion. Mempertahankan nama itu menjaga acuan kepada kota perjanjian beserta resonansi puitisnya tanpa menafsirkannya secara lebih umum sebagai Yerusalem.
- issue: Hubungan גַּם dengan tindakan duduk dan menangis
  choice: kami duduk; kami pun menangis
  alternative: kami duduk dan menangis
  rationale: Susunan ini mempertahankan partikel tambahan גַּם dan jeda puitis antara kedua tindakan, tetapi tidak menentukan secara berlebihan apakah גַּם terutama bersifat tambahan atau penegasan.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan “di” serta bentuk “di sanalah” mempertahankan penekanan tempat dalam puisi Ibrani. Tanda titik koma memberi jeda ratapan yang wajar sambil menjaga hubungan erat antara duduk, menangis, dan mengingat Sion.
