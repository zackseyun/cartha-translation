id: PSA.59.12
reference: Psalms 59:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חַטַּאת פִּ֗י/מוֹ דְּֽבַר שְׂפָ֫תֵ֥י/מוֹ וְ/יִלָּכְד֥וּ בִ/גְאוֹנָ֑/ם וּ/מֵ/אָלָ֖ה וּ/מִ/כַּ֣חַשׁ יְסַפֵּֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: id
  text: Dosa mulut mereka adalah perkataan bibir mereka[a]; biarlah mereka terjerat dalam keangkuhan mereka[b], karena kutukan dan dusta yang mereka tuturkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan pembagian kalimat lain: “Karena dosa mulut mereka, yaitu perkataan bibir mereka, biarlah mereka terjerat dalam keangkuhan mereka, juga karena kutukan dan dusta yang mereka tuturkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “oleh keangkuhan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: dosa
  rationale: Dalam konteks ini kata tersebut menunjuk pada kesalahan moral yang terungkap melalui ucapan, bukan persembahan penghapus dosa.
- source_word: פִּימוֹ
  choice: mulut mereka
  rationale: Bentuk tunggal dengan akhiran jamak dipertahankan sebagai ungkapan kolektif dan berpasangan secara puitis dengan “bibir mereka”.
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: perkataan bibir mereka
  rationale: Terjemahan ini mempertahankan gambaran konkret mulut dan bibir serta susunan puitis bahasa Ibrani.
- source_word: וְיִלָּכְדוּ
  choice: biarlah mereka terjerat
  rationale: Bentuk imperfek Nifal berfungsi sebagai permohonan atau harapan dalam konteks mazmur ini; “terjerat” menyampaikan gagasan tertangkap dalam perangkap secara alami.
- source_word: בִגְאוֹנָם
  choice: dalam keangkuhan mereka
  rationale: גָּאוֹן di sini menunjuk pada kesombongan atau pengagungan diri. Preposisi בְּ dipertahankan dengan “dalam”, sementara kemungkinan makna instrumental dicatat dalam catatan kaki.
- source_word: מֵאָלָה
  choice: karena kutukan
  rationale: 'Preposisi מִן dipahami secara kausal sesudah ungkapan harapan: mereka terjerat akibat ucapan yang mengandung kutukan.'
- source_word: מִכַּחַשׁ
  choice: dan dusta
  rationale: כַּחַשׁ berarti kepalsuan, dusta, atau penipuan; “dusta” ringkas dan selaras dengan “kutukan”.
- source_word: יְסַפֵּרוּ
  choice: yang mereka tuturkan
  rationale: Dalam konteks ucapan, ספר berarti menceritakan atau mengucapkan. “Tuturkan” dapat berlaku secara alami bagi kutukan maupun dusta.
theological_decisions:
- issue: Hubungan sintaksis antara dosa ucapan, permohonan agar musuh terjerat, dan alasan pada akhir ayat
  choice: Teks utama membaca klausa pertama sebagai pernyataan nominal dan frasa terakhir sebagai alasan mereka terjerat.
  alternative: Seluruh unsur mengenai dosa mulut, perkataan bibir, kutukan, dan dusta dapat dibaca sebagai alasan bagi permohonan agar mereka terjerat.
  rationale: Bahasa Ibrani yang padat tidak menyatakan kopula dan memungkinkan pembagian serta hubungan klausa yang berbeda; ambiguitas ini dipertahankan melalui catatan kaki tanpa menetapkan implikasi teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Istilah konkret “mulut” dan “bibir” dipertahankan, sedangkan “tuturkan” dipilih agar bermartabat dan dapat mencakup kutukan maupun dusta.
