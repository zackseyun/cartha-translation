  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: id
  text: Ya, Kekuatanku, aku akan bermazmur kepada-Mu, sebab Allah adalah bentengku, Allah kasih setiaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allahku yang penuh kasih setia” atau “Allah yang menunjukkan kasih setia kepadaku.” Secara harfiah: “Allah kasih setiaku.”'
    reason: Ungkapan Ibrani אֱלֹהֵי חַסְדִּי bersifat padat dan memungkinkan beberapa hubungan makna.
lexical_decisions:
- source_word: עֻזִּי
  choice: Kekuatanku
  rationale: Bentuk ini berarti ‘kekuatanku’ dan dalam konteks puitis berfungsi sebagai sapaan langsung kepada Allah. Bahasa Indonesia tidak memerlukan kata seru tambahan untuk menandai sapaan itu.
- source_word: אֵלֶיךָ
  choice: bagi-Mu
  rationale: Preposisi אֶל menyatakan arah kepada Allah. Bersama kata kerja ‘bermazmur’, ‘bagi-Mu’ terdengar alami dalam bahasa Indonesia dan tetap menunjukkan bahwa nyanyian itu ditujukan kepada-Nya.
- source_word: אֲזַמֵּרָה
  choice: aku akan bermazmur
  rationale: Bentuk piel dari זמר dalam Mazmur biasanya berarti menyanyi atau bermusik untuk memuji. ‘Bermazmur’ ringkas, lazim dalam ragam Alkitab Indonesia, dan mencakup nuansa pujian bermusik.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan pemazmur bernyanyi; ‘sebab’ mempertahankan hubungan kausal dengan jelas dan puitis.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuknya secara morfologis jamak, di sini kata tersebut menunjuk kepada Allah Israel dengan makna tunggal.
- source_word: מִשְׂגַּבִּי
  choice: bentengku
  rationale: מִשְׂגָּב menunjuk pada tempat tinggi yang aman dan terlindung. ‘Bentengku’ menyampaikan perlindungan serta kekokohan secara alami.
- source_word: אֱלֹהֵי חַסְדִּי
  choice: Allah kasih setiaku
  rationale: Rangkaian konstruksi ini secara harfiah adalah ‘Allah kasih setiaku’. Bentuk padat itu dipertahankan agar hubungan antara Allah, pemazmur, dan חֶסֶד tidak dipersempit menjadi satu tafsiran.
theological_decisions:
- issue: Makna חַסְדִּי dalam hubungannya dengan Allah
  choice: Allah kasih setiaku
  alternative: Allahku yang penuh kasih setia; Allah yang menunjukkan kasih setia kepadaku
  rationale: Ungkapan Ibrani yang padat dapat menggambarkan kasih setia Allah kepada pemazmur atau Allah sebagai sumber dan perwujudan kasih setia itu. Teks utama mempertahankan ketegangan maknanya, sedangkan catatan kaki memberi kemungkinan penjelasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. ‘Bermazmur’ dipilih karena tetap mudah dikenali sekaligus menjaga nuansa pujian bermusik. Struktur ‘Allah kasih setiaku’ sengaja agak padat untuk mencerminkan ungkapan Ibrani dan dijelaskan melalui catatan kaki.
