base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/014.yaml
  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: id
  text: Mereka kembali pada waktu petang; mereka menggeram seperti anjing dan berkeliaran mengelilingi kota.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: Mereka kembali
  rationale: Verba שׁוב pada dasarnya berarti kembali. Bentuk ini ringkas dan mempertahankan gambaran tindakan yang berulang tanpa menambahkan motif.
- source_word: לָעֶרֶב
  choice: pada waktu petang
  rationale: עֶרֶב menunjuk pada petang atau senja. Frasa ini alami dalam bahasa Indonesia dan tetap mempertahankan latar waktunya.
- source_word: יֶהֱמוּ
  choice: mereka menggeram
  rationale: Verba המה dapat menggambarkan bunyi keras, raungan, atau geraman. Dalam perbandingan langsung dengan anjing, 'menggeram' secara wajar mempertahankan citra ancaman.
- source_word: כַכָּלֶב
  choice: seperti anjing
  rationale: Bahasa Ibrani memakai bentuk tunggal generik dalam perbandingan. Bahasa Indonesia juga dapat memakai 'anjing' secara generik dengan subjek jamak tanpa terasa janggal.
- source_word: וִיסוֹבְבוּ
  choice: dan berkeliaran mengelilingi
  rationale: סבב berarti bergerak berkeliling atau mengitari. Gabungan ini mempertahankan gerak berputar di sekitar kota serta nuansa berkeliaran dalam konteks kawanan anjing.
- source_word: עִיר
  choice: kota
  rationale: Walaupun tanpa artikel dalam bahasa Ibrani, konteks menunjukkan kota yang sudah dikenal. Bahasa Indonesia tidak memerlukan penanda definit eksplisit di sini.
