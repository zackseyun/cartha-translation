  text: כַּלֵּ֥ה בְ/חֵמָה֮ כַּלֵּ֪ה וְֽ/אֵ֫ינֵ֥/מוֹ וְֽ/יֵדְע֗וּ כִּֽי אֱ֭לֹהִים מֹשֵׁ֣ל בְּ/יַעֲקֹ֑ב לְ/אַפְסֵ֖י הָ/אָ֣רֶץ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/013.yaml
  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
translation:
  language: id
  text: Binasakanlah mereka dalam murka[a]; binasakanlah mereka sampai mereka tidak ada lagi, agar mereka mengetahui bahwa Allah memerintah di Yakub sampai ke ujung-ujung bumi[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Habisi mereka dalam murka; habisi mereka, sehingga mereka tidak ada lagi.” Bahasa Ibraninya dapat diterjemahkan secara lebih padat dan harfiah.
    reason: lexical_alternative
  - marker: b
    text: “Yakub” menunjuk kepada Israel. Frasa Ibraninya secara harfiah berarti “di dalam Yakub”; sebagian menerjemahkannya “atas Yakub.”
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: כַּלֵּה
  choice: binasakanlah
  rationale: Imperatif Piel dari כלה berarti membawa sesuatu sampai habis atau berakhir, termasuk dengan membinasakannya. “Binasakanlah” menyampaikan kerasnya permohonan ini secara wajar dalam bahasa Indonesia; pengulangannya dipertahankan.
- source_word: בְחֵמָה
  choice: dalam murka-Mu
  rationale: חֵמָה menunjuk pada amarah yang menyala atau murka. Akhiran “-Mu” tidak tertulis pada nomina Ibrani, tetapi pelaku yang disapa adalah Allah; bentuk ini membuat hubungan tersebut alami dalam bahasa Indonesia tanpa mengurangi daya ungkapnya.
- source_word: וְאֵינֵמוֹ
  choice: sampai mereka tidak ada lagi
  rationale: Ungkapan ini secara harfiah berarti “dan mereka tidak ada.” Dalam rangkaian imperatif, “sampai mereka tidak ada lagi” secara alami menyatakan hasil akhir yang dimohonkan tanpa melunakkan kebinasaan total.
- source_word: וְיֵדְעוּ
  choice: supaya mereka mengetahui
  rationale: Bentuk waw + imperfek sesudah permohonan dapat menyatakan tujuan atau hasil. “Supaya mereka mengetahui” mempertahankan hubungan itu, sementara bentuk Ibraninya juga dapat dipahami lebih berurutan sebagai “dan biarlah mereka mengetahui.”
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks mazmur ini, kata tersebut merujuk kepada Allah Israel; “Allah” adalah padanan baku dan langsung dalam bahasa Indonesia.
- source_word: מֹשֵׁל
  choice: berkuasa
  rationale: Partisipel ini menyatakan pemerintahan atau kekuasaan yang berlangsung. “Berkuasa” alami dalam bahasa Indonesia dan tetap memuat gagasan kedaulatan aktif.
- source_word: בְּיַעֲקֹב
  choice: di tengah umat Yakub
  rationale: Preposisi ב secara dasar berarti “di/dalam.” “Di tengah umat Yakub” mempertahankan lokus pemerintahan Allah dan memperjelas bahwa “Yakub” di sini menunjuk kepada umat yang berasal dari Yakub, tanpa menggantinya dengan “Israel.”
- source_word: לְאַפְסֵי הָאָרֶץ
  choice: sampai ke ujung-ujung bumi
  rationale: Ini adalah ungkapan bagi jangkauan paling jauh di bumi. Padanan Indonesia ini akurat, lazim, dan puitis.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis atau musikal ini tidak pasti; karena itu istilahnya ditransliterasikan, bukan diterjemahkan secara spekulatif.
theological_decisions:
- issue: Permohonan agar para musuh dibinasakan sepenuhnya
  choice: Mempertahankan permohonan langsung dan berulang agar mereka dibinasakan sampai tidak ada lagi.
  alternative: Melunakkan permohonan menjadi sekadar menahan, mengalahkan, atau menghentikan mereka.
  rationale: Teks Ibrani mengulang imperatif כַּלֵּה dan menyebut keadaan ketika mereka “tidak ada lagi.” Kekerasan bahasa mazmur tidak boleh disamarkan.
- issue: Kekuasaan Allah dalam kaitannya dengan Yakub dan seluruh bumi
  choice: Mempertahankan baik kekuasaan Allah di tengah umat Yakub maupun jangkauan sampai ke ujung-ujung bumi.
  alternative: Membatasi pernyataan hanya pada Israel, atau menghapus acuan khusus kepada Yakub demi pernyataan yang sepenuhnya universal.
  rationale: Ayat ini menempatkan kekuasaan Allah dalam hubungan khusus dengan Yakub sekaligus memberi pernyataan itu cakrawala sedunia. Ketegangan antara yang khusus dan yang universal dipertahankan.
- issue: Fungsi וְיֵדְעוּ
  choice: 'Menerjemahkannya sebagai tujuan atau hasil: “supaya mereka mengetahui.”'
  alternative: 'Menerjemahkannya secara koordinatif atau yusif: “dan biarlah mereka mengetahui,” atau sebagai akibat sederhana: “maka mereka akan mengetahui.”'
  rationale: Dalam konteks permohonan ini, waw + imperfek dapat menyatakan tujuan atau hasil dari tindakan yang dimohonkan. Pilihan utama alami dalam bahasa Indonesia, sementara alternatifnya dicatat karena bentuk Ibraninya tidak sepenuhnya menutup kemungkinan itu.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan langsung. Imperatif berakhiran “-lah” mempertahankan bentuk doa yang mendesak. “Sela” dipertahankan sebagai istilah yang maknanya tidak pasti. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
