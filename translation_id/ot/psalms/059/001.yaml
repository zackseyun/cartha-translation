  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י אֱלֹהָ֑/י מִּ/מִתְקוֹמְמַ֥/י תְּשַׂגְּבֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/001.yaml
  text: Deliver me from my enemies[a], my God[b]; set me on high above those who rise up against me.
translation:
  language: id
  text: Bebaskanlah aku dari musuh-musuhku, ya Allahku; tempatkanlah aku di tempat yang tinggi, jauh dari orang-orang yang bangkit melawan aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Lepaskanlah aku
  rationale: Bentuk imperatif Hifil dari נצל dengan akhiran orang pertama tunggal menyatakan permohonan agar dibebaskan atau diselamatkan dari bahaya. “Lepaskanlah aku” wajar dalam bahasa Indonesia dan tidak menambahkan nuansa teologis yang tidak dituntut konteks.
- source_word: מֵאֹיְבַי
  choice: dari musuh-musuhku
  rationale: אֹיֵב adalah sebutan umum untuk musuh, sedangkan מִן menyatakan pemisahan atau pembebasan dari mereka.
- source_word: אֱלֹהָי
  choice: ya Allahku
  rationale: Sapaan langsung dengan akhiran posesif orang pertama tunggal dipertahankan sebagai seruan pribadi yang alami dalam bahasa Indonesia.
- source_word: מִּמִתְקוֹמְמַי
  choice: jauh dari orang-orang yang bangkit melawan aku
  rationale: Bentuk partisip dari קום menunjuk kepada orang-orang yang bangkit atau menempatkan diri untuk menentang pemazmur. Frasa “jauh dari” menghubungkannya secara alami dengan gambaran perlindungan melalui penempatan di tempat tinggi.
- source_word: תְּשַׂגְּבֵנִי
  choice: tempatkanlah aku di tempat tinggi
  rationale: Bentuk Piel dari שׂגב dalam permohonan ini dapat berarti menjadikan tinggi atau tidak terjangkau, dan dengan demikian melindungi. Terjemahan ini mempertahankan gambaran konkret tempat tinggi tanpa menambahkan keterangan yang berlebihan.
theological_decisions:
- issue: Sapaan ilahi אֱלֹהָי
  choice: ya Allahku
  alternative: Tuhanku
  rationale: “Allahku” menerjemahkan אֱלֹהָי secara langsung dan mempertahankan unsur kepunyaan pribadi tanpa mengganti gelar ilahi dengan istilah lain.
- issue: Hubungan antara שׂגב dan para penentang
  choice: tempatkanlah aku di tempat tinggi, jauh dari orang-orang yang bangkit melawan aku
  alternative: lindungilah aku dari orang-orang yang bangkit melawan aku
  rationale: Pilihan utama mempertahankan metafora Ibrani tentang dibuat tinggi atau tidak terjangkau, sekaligus menyampaikan fungsi perlindungannya tanpa menghapus citra puitis.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Bentuk permohonan “-lah” menjaga nada doa, sedangkan susunan paralel kedua klausa mengikuti gerak puisi Ibrani dari pembebasan menuju perlindungan di tempat tinggi.
