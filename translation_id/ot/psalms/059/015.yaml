  text: הֵ֭מָּה ינועו/ן לֶ/אֱכֹ֑ל אִם לֹ֥א יִ֝שְׂבְּע֗וּ וַ/יָּלִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/015.yaml
  text: They wander about for food[a]; if they are not satisfied[b], they spend the night.
translation:
  language: id
  text: Mereka berkeliaran mencari makanan; jika tidak kenyang, mereka bermalam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka menggeram.” Kata Ibrani ini dapat dipahami sebagai “bermalam” atau sebagai “menggerutu/menggeram”; arti kedua sesuai dengan gambaran anjing-anjing yang lapar dalam konteks mazmur ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Mereka
  rationale: Pronomina mandiri orang ketiga jamak memberi penegasan atau kontras; “Mereka” tetap alami dalam bahasa Indonesia dan cukup menyampaikan subjek.
- source_word: ינועון
  choice: berkeliaran
  rationale: Bentuk dari נוּעַ menggambarkan gerak ke sana kemari. Dalam gambaran para musuh seperti anjing lapar, “berkeliaran” menyampaikan gerak tanpa arah untuk mencari makanan tanpa menambahkan gagasan sempoyongan.
- source_word: לֶאֱכֹל
  choice: mencari makanan
  rationale: Secara harfiah berarti “untuk makan”. Dalam hubungan dengan “berkeliaran”, ungkapan tujuan yang alami dalam bahasa Indonesia ialah “mencari makanan”.
- source_word: אִם לֹא יִשְׂבְּעוּ
  choice: jika tidak kenyang
  rationale: אִם לֹא membentuk syarat, sedangkan שׂבע dalam konteks makanan berarti menjadi kenyang atau puas. “Tidak kenyang” mempertahankan citra kelaparan secara konkret.
- source_word: וַיָּלִינוּ
  choice: mereka bermalam
  rationale: Bentuk ini paling langsung dapat dipahami dari לוּן/לִין, “bermalam, menginap”. Namun, kemungkinan hubungan dengan akar yang berarti “menggerutu/menggeram” relevan dalam konteks anjing dan dicatat dalam catatan kaki.
