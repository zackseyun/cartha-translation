  text: O my strength[a], I will watch for you[c][b], for God is my stronghold.
translation:
  language: id
  text: Kekuatannya[a]—aku akan berjaga menantikan-Mu[b], sebab Allah adalah bentengku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut penafsiran tradisional yang umum: “Ya kekuatanku, aku akan berjaga menantikan-Mu.” Sebagian orang juga membaca kata kerjanya sebagai “aku akan bernyanyi”.'
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “kepada-Mu aku akan berjaga”. Ungkapan ini juga dapat dipahami sebagai “aku akan berjaga-jaga” atau “aku akan menunggu-Mu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזּוֹ
  choice: Kekuatannya
  rationale: Bentuk WLC memakai akhiran orang ketiga maskulin tunggal, sehingga secara langsung berarti “kekuatannya”. Ungkapan ini memang terasa mendadak, tetapi ketegangan teks dipertahankan dan pembacaan vokatif yang lazim dicatat dalam catatan kaki.
- source_word: אֵלֶיךָ
  choice: menantikan-Mu
  rationale: Preposisi אֶל menunjukkan arah kepada Allah. Dalam gabungan dengan verba berikutnya, bahasa Indonesia yang wajar mengungkapkan arah perhatian dan pengharapan itu dengan “menantikan-Mu”.
- source_word: אֶשְׁמֹרָה
  choice: aku akan berjaga
  rationale: Verba שׁמר pada dasarnya berarti menjaga atau berjaga. Bentuk kohortatif/futur dipertahankan dengan “aku akan”, sedangkan konteks penantian kepada Allah dinyatakan bersama pelengkapnya.
- source_word: כִּי
  choice: sebab
  rationale: 'Kata ini memperkenalkan alasan pemazmur berjaga dan menanti: Allah adalah tempat perlindungannya.'
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk tersebut menunjuk kepada Allah Israel dan berfungsi secara tunggal.
- source_word: מִשְׂגַּבִּי
  choice: bentengku
  rationale: Kata ini menggambarkan tempat tinggi dan kokoh yang memberi keamanan; “bentengku” mempertahankan citra perlindungan yang kuat dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah עֻזּוֹ harus dibaca sebagai bentuk orang ketiga, “kekuatannya”, atau sebagai sapaan kepada Allah, “ya Kekuatanku”
  choice: Kekuatannya
  alternative: Ya Kekuatanku
  rationale: Teks WLC yang diberikan secara eksplisit diberi vokalisasi dengan akhiran orang ketiga maskulin tunggal. Teks utama mengikuti bentuk itu tanpa menghilangkan kesulitannya, sedangkan pembacaan vokatif tradisional yang didukung konteks disediakan dalam catatan kaki.
- issue: Nuansa אֶשְׁמֹרָה dengan אֵלֶיךָ
  choice: aku akan berjaga menantikan-Mu
  alternative: kepada-Mu aku akan berjaga; aku akan mengawasi-Mu
  rationale: Gabungan ini dapat menyatakan tindakan berjaga, mengamati, atau menunggu dengan penuh harap. Pilihan utama mempertahankan unsur berjaga sekaligus menghasilkan bahasa Indonesia yang wajar tanpa membatasi maknanya pada penantian pasif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas. Bentuk “-Mu” dan “Allah” mempertahankan sapaan hormat kepada Allah. Tanda pisah mempertahankan keterputusan sintaksis pada awal baris Ibrani, sementara catatan kaki menjelaskan dua ambiguitas utama.
