base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: id
  text: 'Namun aku akan menyanyikan kekuatan-Mu;

    aku akan menyanyikan dengan lantang kasih setia-Mu pada pagi hari,[a][b]

    sebab Engkau telah menjadi benteng bagiku

    serta tempat perlindungan pada hari kesesakanku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada pagi hari aku akan bersorak karena kasih setia-Mu.” Kata kerjanya dapat menekankan seruan sukacita maupun nyanyian yang lantang.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani hesed, yang mencakup kasih, kesetiaan, dan komitmen teguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Kata penghubung dan pronomina mandiri menandai kontras dengan para musuh dalam konteks sebelumnya; “Namun aku” mengungkapkan kontras itu secara alami.
- source_word: אָשִׁיר
  choice: akan menyanyikan
  rationale: Bentuk imperfek orang pertama tunggal menyatakan tekad atau tindakan mendatang pemazmur.
- source_word: עֻזֶּךָ
  choice: kekuatan-Mu
  rationale: עֹז menunjuk pada kekuatan atau keperkasaan, di sini terutama kuasa Allah yang melindungi.
- source_word: וַאֲרַנֵּן
  choice: aku akan bersorak menyanyikan
  rationale: רנן dapat menyatakan nyanyian pujian yang lantang dan penuh sukacita. Ungkapan ini mempertahankan unsur nyanyian sekaligus luapan kegembiraannya.
- source_word: לַבֹּקֶר
  choice: pada pagi hari
  rationale: Frasa ini berfungsi secara temporal dan secara alami berhubungan dengan konteks malam dan pagi dalam mazmur ini.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan komitmen teguh Allah; “kasih setia” menjaga keluasan makna itu dalam bahasa Indonesia yang lazim.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan pemazmur memuji Allah.
- source_word: הָיִיתָ
  choice: Engkau telah menjadi
  rationale: Bentuk perfektif menunjuk pada pengalaman perlindungan Allah yang sudah terbukti dan tetap relevan bagi pemazmur.
- source_word: מִשְׂגָּב
  choice: benteng
  rationale: Kata ini menunjuk pada tempat tinggi yang aman atau kubu perlindungan; “benteng” menyampaikan citra keamanan secara ringkas dan wajar.
- source_word: וּמָנוֹס
  choice: serta tempat perlindungan
  rationale: מָנוֹס ialah tempat yang dituju seseorang ketika melarikan diri demi keselamatan; terjemahan ini jelas dan membedakannya secara cukup dari “benteng”.
- source_word: בְּיוֹם צַר לִי
  choice: pada hari aku terdesak
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang “hari” kesulitan sekaligus mengungkapkan bahwa kesesakan itu dialami secara pribadi.
theological_decisions:
- issue: Pemaknaan חֶסֶד dalam pujian atas pertolongan Allah
  choice: kasih setia-Mu
  alternative: belas kasih-Mu; kasih perjanjian-Mu
  rationale: “Kasih setia” memuat kasih dan loyalitas Allah yang teguh tanpa membatasi kata itu hanya pada belas kasihan atau memasukkan istilah teologis yang lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa menjadi arkais. Paralelisme Ibrani dipertahankan dalam empat baris; pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
