  yaml_path: translation/ot/psalms/059/003.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: id
  text: Sebab lihatlah, mereka mengintai nyawaku; orang-orang kuat berkumpul melawan aku, bukan karena pelanggaranku atau dosaku, ya TUHAN.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Mempertahankan penanda perhatian yang menekankan keadaan mendesak di hadapan pemazmur.
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: mereka mengadang untuk merenggut nyawaku
  rationale: Kata kerja menggambarkan tindakan mengintai atau memasang jebakan, sedangkan נֶפֶשׁ dalam konteks ancaman maut secara alami merujuk pada nyawa.
- source_word: יָגוּרוּ עָלַי
  choice: berkumpul melawan aku
  rationale: Mengikuti makna berkumpul atau berhimpun dengan nuansa permusuhan yang ditandai oleh עָלַי.
- source_word: עַזִּים
  choice: orang-orang kuat
  rationale: Menjaga arti dasar 'kuat/perkasa'; dalam konteks ini istilah tersebut menunjuk kepada para penyerang yang tangguh.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang lazim untuk Nama ilahi.
theological_decisions:
- issue: Pernyataan pemazmur tentang tidak adanya pelanggaran atau dosa
  choice: bukan karena pelanggaran atau dosaku
  alternative: meskipun aku tidak melakukan pelanggaran atau dosa
  rationale: Susunan Ibrani secara ringkas menyangkal bahwa serangan itu disebabkan oleh pelanggaran atau dosa pemazmur, tanpa mengubahnya menjadi klaim umum bahwa ia sama sekali tanpa dosa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Seruan pembuka serta pengulangan 'pelanggaran atau dosa' dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
