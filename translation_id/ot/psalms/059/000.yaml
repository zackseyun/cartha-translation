  naturalness: Bahasa draft baku dan mudah dipahami. “Untuk pemimpin musik” lebih tepat dan lebih netral daripada “pemimpin pujian,” yang dalam pemakaian modern dapat menyiratkan peran liturgis yang lebih khusus. Dengan koma setelah klausa “ketika,” hubungan antara pengutusan dan pengawasan tetap jelas tanpa “lalu” yang kurang diperlukan.
  terminology: Istilah “miktam” sebaiknya tetap ditransliterasikan dan diberi catatan tersendiri. “Jangan Musnahkan” dapat dipertahankan sebagai judul/petunjuk musikal yang kemungkinan besar adalah nama lagu. “Milik Daud” menjaga keluwesan hubungan yang ditandai לְ lebih baik daripada “karya Daud.”
