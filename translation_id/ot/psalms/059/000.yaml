- from: Untuk pemimpin pujian. Menurut lagu “Jangan Musnahkan”. Mazmur miktam karya Daud[a], ketika Saul mengutus orang-orang, lalu mereka mengawasi rumah itu untuk membunuhnya.
  to: Untuk pemimpin musik. Menurut lagu “Jangan Musnahkan”[a]. Milik Daud[b]. Miktam[c], ketika Saul mengutus orang-orang, mereka mengawasi rumah itu untuk membunuhnya.
  rationale: 'Revisi mengganti “karya Daud” dengan “Milik Daud” untuk tidak menetapkan kepengarangan sebagai satu-satunya arti, memakai “pemimpin musik” sebagai padanan yang lebih tepat bagi fungsi musikal, dan memisahkan catatan kaki bagi judul lagu, hubungan Daud, serta istilah miktam. Klausa historis dipertahankan setia pada teks: “orang-orang” dijelaskan oleh verba jamak berikutnya, sedangkan “rumah itu” dan pronomina “-nya” tidak ditambah dengan identifikasi yang tidak tertulis.'
