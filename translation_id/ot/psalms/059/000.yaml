  text: לַ/מְנַצֵּ֣חַ אַל תַּשְׁחֵת֮ לְ/דָוִ֪ד מִ֫כְתָּ֥ם בִּ/שְׁלֹ֥חַ שָׁא֑וּל וַֽ/יִּשְׁמְר֥וּ אֶת הַ֝/בַּ֗יִת לַ/הֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/000.yaml
  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: id
  text: Untuk pemimpin musik. Menurut lagu “Jangan Musnahkan”[a]. Milik Daud[b]. Miktam[c], ketika Saul mengutus orang-orang, mereka mengawasi rumah itu untuk membunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jangan Musnahkan” kemungkinan adalah nama lagu atau petunjuk musikal dalam judul mazmur.
    reason: cultural_note
  - marker: b
    text: Atau, “untuk Daud.” Dalam judul mazmur, ungkapan Ibrani ini dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: lexical_alternative
  - marker: c
    text: Arti istilah “miktam” tidak diketahui dengan pasti; karena itu istilah ini ditransliterasikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Rumus judul mazmur yang ditujukan kepada pemimpin musik. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: אַל־תַּשְׁחֵת
  choice: Menurut lagu “Jangan Musnahkan”
  rationale: Kemungkinan besar merupakan nama lagu atau petunjuk musikal. Kata “Menurut lagu” memperjelas fungsi judul itu tanpa memasukkannya ke dalam isi mazmur.
- source_word: לְדָוִד
  choice: karya Daud
  rationale: Dalam judul mazmur, לְ dapat menyatakan kepengarangan, hubungan, atau peruntukan. Terjemahan utama memakai ungkapan Indonesia yang wajar, sementara catatan kaki mempertahankan ambiguitas bentuk Ibraninya.
- source_word: מִכְתָּם
  choice: miktam
  rationale: Makna istilah teknis ini tidak pasti; transliterasi menghindari terjemahan spekulatif.
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: ketika Saul mengutus orang-orang
  rationale: ב dengan infinitif menyatakan waktu. Kata “orang-orang” tidak tertulis secara eksplisit, tetapi secara wajar disimpulkan dari verba jamak berikutnya.
- source_word: וַיִּשְׁמְרוּ
  choice: lalu mereka mengawasi
  rationale: Dalam konteks tujuan membunuh Daud, שׁמר menunjuk pada pengintaian atau pengawasan, bukan penjagaan untuk melindungi. “Lalu” mencerminkan kelanjutan naratif.
- source_word: אֶת־הַבַּיִת
  choice: rumah itu
  rationale: Teks menyebut rumah tertentu tanpa kata ganti kepunyaan; “rumah itu” mempertahankan bentuk tersebut secara alami.
- source_word: לַהֲמִיתוֹ
  choice: untuk membunuhnya
  rationale: Infinitif tujuan dengan sufiks orang ketiga tunggal maskulin diterjemahkan langsung dan alami.
theological_decisions:
- issue: Hubungan Daud dengan mazmur dalam לְדָוִד
  choice: karya Daud, dengan catatan tentang kemungkinan arti lain
  alternative: untuk Daud / mengenai Daud
  rationale: Terjemahan utama dibuat lancar bagi pembaca Indonesia, tetapi catatan menjaga keluasan makna preposisi Ibrani dan tidak menjadikan kepengarangan satu-satunya kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Judul lagu diberi tanda petik; istilah teknis Ibrani “miktam” dipertahankan. Kata “orang-orang” ditambahkan demi kejelasan berdasarkan verba jamak, tanpa mengubah pelaku yang tersirat.
