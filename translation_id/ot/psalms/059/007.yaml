  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: id
  text: Lihatlah, mulut mereka meluapkan; pedang ada pada bibir mereka, sebab mereka berkata, “Siapa yang mendengar?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Siapa yang mendengar?” Objeknya tidak disebutkan dalam bahasa Ibrani, sehingga pernyataan angkuh itu tetap terbuka.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel penarik perhatian ini dipertahankan secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יַבִּיעוּן
  choice: mereka menyemburkan kata-kata
  rationale: Bentuk kausatif dari נבע menggambarkan sesuatu yang memancar atau meluap. Penambahan 'kata-kata' menjadikan ungkapan ini alami dalam bahasa Indonesia tanpa menjadikan 'pedang' sebagai objek verba.
- source_word: בְּפִיהֶם
  choice: dari mulut mereka
  rationale: Walaupun preposisinya secara harfiah dapat berarti 'di/dengan', verba yang menggambarkan semburan menuntut ungkapan sumber yang alami, yaitu 'dari mulut mereka'.
- source_word: חֲרָבוֹת בְּשִׂפְתוֹתֵיהֶם
  choice: pedang ada pada bibir mereka
  rationale: Metafora 'pedang' dipertahankan dan ditempatkan bersama frasa 'pada bibir mereka', sesuai susunan serta paralelisme Ibrani.
- source_word: כִּי
  choice: sebab mereka berkata
  rationale: Kata 'sebab' mempertahankan hubungan alasan; 'mereka berkata' ditambahkan secara implisit untuk memperkenalkan pertanyaan langsung secara alami.
- source_word: מִי שֹׁמֵעַ
  choice: Siapa yang mendengar?
  rationale: Bentuk partisipial diterjemahkan dengan kala kini yang ringkas. Objek pendengaran tidak ditambahkan agar keterbukaan retoris teks tetap terjaga.
theological_decisions:
- issue: Objek yang tidak dinyatakan dalam pertanyaan retoris
  choice: “Siapa yang mendengar?”
  alternative: “Siapa yang mendengar kami?” atau “Siapa yang mendengarnya?”
  rationale: 'Teks Ibrani tidak menyebutkan objek. Membiarkannya tidak dinyatakan mempertahankan keangkuhan dan ketegangan teologisnya: mereka berbicara seolah-olah tidak ada siapa pun—termasuk Allah—yang mendengar, tanpa membuat rujukan itu eksplisit.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Metafora pedang dipertahankan, sedangkan citra verba נבע disampaikan dengan 'menyemburkan'. Penanda catatan kaki [a] ditempatkan setelah pertanyaan yang dijelaskannya.
