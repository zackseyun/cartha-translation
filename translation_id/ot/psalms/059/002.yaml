  text: הַ֭צִּילֵ/נִי מִ/פֹּ֣עֲלֵי אָ֑וֶן וּֽ/מֵ/אַנְשֵׁ֥י דָ֝מִ֗ים הוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/002.yaml
  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: id
  text: Lepaskanlah aku dari para pelaku kejahatan, dan selamatkanlah aku dari para penumpah darah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang-orang darah,” yaitu orang-orang yang menumpahkan darah atau bersalah atas pertumpahan darah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Lepaskanlah aku
  rationale: Bentuk imperatif נצל memohon pembebasan dari bahaya; “lepaskanlah aku” alami dalam bahasa Indonesia dan mempertahankan nuansa dilepaskan dari kuasa para musuh.
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: dari para pelaku kejahatan
  rationale: Ungkapan ini secara dekat berarti “dari para pelaku/pengerja kejahatan.” “Para pelaku kejahatan” mempertahankan konstruksi partisipial Ibrani sekaligus terdengar wajar dan jelas.
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: dan dari para penumpah darah
  rationale: Secara harfiah ungkapan Ibrani ini adalah “orang-orang darah”; bentuk jamak דָמִים secara idiomatis menunjuk pada pertumpahan darah atau kesalahan karena menumpahkan darah. “Para penumpah darah” mempertahankan gambaran darah tanpa menghasilkan frasa Indonesia yang janggal.
- source_word: הוֹשִׁיעֵנִי
  choice: selamatkanlah aku
  rationale: Imperatif ישׁע merupakan permohonan keselamatan atau penyelamatan. Dalam konteks ancaman dari musuh, “selamatkanlah aku” merupakan padanan Indonesia yang langsung dan tidak mempersempit maknanya menjadi kemenangan militer.
theological_decisions:
- issue: Ungkapan idiomatis אַנְשֵׁי דָמִים
  choice: para penumpah darah
  alternative: orang-orang yang haus darah; orang-orang berdarah
  rationale: “Para penumpah darah” menyampaikan bahwa lawan-lawan ini melakukan atau bersalah atas pertumpahan darah. Pilihan ini tidak membatasi makna hanya pada hasrat membunuh, sedangkan terjemahan harfiah “orang-orang berdarah” tidak jelas dalam bahasa Indonesia.
- issue: Bentuk maskulin אַנְשֵׁי
  choice: para penumpah darah
  alternative: laki-laki penumpah darah
  rationale: Kata Ibrani berbentuk maskulin, tetapi dalam bahasa Indonesia “para penumpah darah” dapat merujuk secara alami kepada kelompok lawan yang dimaksud tanpa menambahkan penegasan jenis kelamin yang tidak diperlukan oleh konteks ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. Pengulangan “aku” mempertahankan dua permohonan sejajar dalam teks Ibrani; “para pelaku kejahatan” dan “para penumpah darah” ringkas, jelas, serta tetap dekat dengan citra sumber.
