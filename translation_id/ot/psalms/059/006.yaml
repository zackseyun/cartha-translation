  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: id
  text: Mereka kembali saat petang; mereka menggeram seperti anjing dan berkeliling kota.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: mereka kembali
  rationale: Bentuk Qal imperfek orang ketiga jamak dari שוב menyatakan kembali atau datang kembali; 'kembali' langsung dan wajar dalam penggambaran gerak musuh yang berulang.
- source_word: לָעֶרֶב
  choice: pada waktu petang
  rationale: Preposisi ל dengan עֶרֶב menandai waktu. 'Pada waktu petang' jelas, alami, dan mempertahankan latar waktu dalam puisi.
- source_word: יֶהֱמוּ
  choice: mereka menggeram
  rationale: Verba המה dapat menunjuk pada bunyi keras seperti gemuruh atau raungan. Dalam perbandingan dengan anjing, 'menggeram' menyampaikan bunyi hewani yang mengancam tanpa menentukan secara berlebihan bahwa bunyinya lolongan.
- source_word: כַכָּלֶב
  choice: seperti anjing
  rationale: 'Nomina tunggal setelah כ bersifat generik atau kolektif. Bahasa Indonesia secara alami dapat mempertahankan bentuk tanpa penanda jamak: ''seperti anjing''.'
- source_word: וִיסוֹבְבוּ
  choice: dan berkeliaran mengelilingi
  rationale: Verba סבב berarti bergerak berkeliling atau mengitari. Gabungan ini menyampaikan gerak tanpa tujuan tetap sekaligus unsur mengitari, tanpa menambahkan gagasan bahwa kota sedang dikepung.
- source_word: עִיר
  choice: kota
  rationale: Walaupun tanpa artikel dalam bahasa Ibrani, konteks menunjuk pada kota tertentu. Bahasa Indonesia tidak memerlukan artikel definit untuk membuat rujukan itu wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Paralelisme puitis dipertahankan dengan dua klausa yang dipisahkan titik koma. Tidak diperlukan catatan kaki karena alternatif leksikal tidak mengubah makna secara signifikan dan ambiguitas bunyi pada המה dijaga melalui pilihan 'menggeram' yang kontekstual.
