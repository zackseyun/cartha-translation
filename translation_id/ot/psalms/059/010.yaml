  text: The God of his steadfast love will go before me[b][a]; God will let me look on my enemies.
translation:
  language: id
  text: Allah yang penuh kasih setia akan mendahului aku[a]; Allah akan membiarkan aku melihat musuh-musuhku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Allah dari kasih setia-Nya akan mendahului aku.” Menurut vokalisasi atau tradisi pembacaan lain: “Allahku, dalam kasih setia-Nya, akan mendahului aku” atau “Allahku yang penuh kasih setia akan mendahului aku.” “Kasih setia” menerjemahkan kata Ibrani hesed, yang dapat mencakup kasih yang teguh, kesetiaan, dan belas kasihan.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי חסד/ו
  choice: Allah yang penuh kasih setia
  rationale: Rangkaian bentuk konstruk אֱלֹהֵי dengan חַסְדּוֹ secara harfiah sulit dan dapat dipahami sebagai “Allah dari kasih setia-Nya.” Dalam bahasa Indonesia, “Allah yang penuh kasih setia” menyampaikan sifat ilahi yang dimaksud secara alami; sufiks orang ketiga tersirat dalam kasih setia yang adalah milik-Nya, sementara kemungkinan pembacaan lain dicatat dalam catatan kaki.
- source_word: יְקַדְּמֵנִי
  choice: akan mendahului aku
  rationale: Bentuk piel dari קדם dapat berarti datang menemui, berada di depan, atau mendahului. “Akan mendahului aku” mempertahankan daya spasial-temporal dan gagasan pertolongan Allah yang datang lebih dahulu.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Pengulangan nomina ilahi dipertahankan, bukan diganti dengan kata ganti, agar penekanan Ibrani tetap terasa.
- source_word: יַרְאֵנִי
  choice: akan membiarkan aku melihat
  rationale: Bentuk hifil dari ראה bersifat kausatif atau permisif, yakni “membuat/membiarkan melihat.” Ungkapan ini dipertahankan tanpa secara langsung menambahkan gagasan kemenangan.
- source_word: בְשֹׁרְרָי
  choice: kekalahan musuh-musuhku
  rationale: שׁורר menunjuk kepada pihak yang memusuhi. Preposisi בְּ bersama verba “melihat” membentuk idiom melihat apa yang terjadi atas musuh; “kekalahan” membuat idiom itu wajar dalam bahasa Indonesia, meski unsur tersebut tersirat dan bukan nomina eksplisit dalam bahasa Ibrani.
theological_decisions:
- issue: Sufiks pronominal pada חַסְדּוֹ dan hubungan konstruk dengan אֱלֹהֵי
  choice: Allah yang penuh kasih setia
  alternative: Allah dari kasih setia-Nya; atau, menurut vokalisasi/tradisi pembacaan lain, “Allahku, dalam kasih setia-Nya” maupun “Allahku yang penuh kasih setia”
  rationale: Teks WLC memiliki sufiks orang ketiga tunggal maskulin, tetapi konstruksinya tidak lazim. Teks utama mengikuti bukti Masoretik tanpa mengubahnya menjadi sufiks orang pertama, sedangkan pembacaan tradisional lain dipertahankan dalam catatan kaki.
- issue: Makna idiomatis יַרְאֵנִי בְשֹׁרְרָי
  choice: membiarkan aku melihat kekalahan musuh-musuhku
  alternative: membiarkan aku melihat apa yang terjadi atas musuh-musuhku
  rationale: Dalam konteks permusuhan, konstruksi ini menyiratkan bahwa pemazmur akan menyaksikan jatuhnya para lawan. “Kekalahan” menghasilkan bahasa Indonesia yang jelas, tetapi tidak diperluas menjadi pembalasan atau pemusnahan agar kandungan teologis tidak dilebihkan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Allah” dipakai bagi אֱלֹהִים, “kasih setia” mempertahankan istilah Alkitabiah yang masih mudah dipahami, dan pengulangan “Allah” mengikuti penekanan teks Ibrani. Penanda catatan kaki [a] dicantumkan dalam teks utama.
