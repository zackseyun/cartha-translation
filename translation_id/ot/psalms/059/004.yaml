  text: בְּֽלִי עָ֭וֺן יְרוּצ֣וּ/ן וְ/יִכּוֹנָ֑נוּ ע֖וּרָ/ה לִ/קְרָאתִ֣/י וּ/רְאֵה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/004.yaml
  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: id
  text: Tanpa kesalahan di pihakku, mereka berlari dan mengambil posisi[a]. Bangunlah untuk menemuiku dan lihatlah!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka bergegas dan bersiap-siap.” Kata kerja kedua dapat berarti mengambil posisi atau mempersiapkan diri untuk bertindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: Bukan karena aku bersalah
  rationale: Ungkapan ini secara harfiah menyatakan ketiadaan kesalahan. Dalam konteks keluhan pemazmur, maksudnya ialah bahwa serangan mereka bukan disebabkan oleh kesalahannya; bentuk ini menyampaikan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: יְרוּצוּן
  choice: mereka berlari
  rationale: Mempertahankan gambaran konkret verba רוץ, yang juga dapat mengandung nuansa bergegas.
- source_word: וְיִכּוֹנָנוּ
  choice: dan mengambil posisi
  rationale: Bentuk dari כון menggambarkan mereka menempatkan atau memantapkan diri, kemungkinan untuk bertindak. 'Mengambil posisi' mempertahankan gambaran konkret tanpa secara khusus menambahkan gagasan serangan yang tidak dinyatakan.
- source_word: עוּרָה
  choice: Bangunlah
  rationale: Imperatif ini mempertahankan metafora puitis yang mendesak Allah beralih dari keadaan seolah-olah tidak bertindak menjadi bertindak.
- source_word: לִקְרָאתִי
  choice: untuk menemuiku
  rationale: Menerjemahkan idiom secara dekat dan membiarkan konteks menunjukkan bahwa pemazmur meminta Allah datang menolongnya.
- source_word: וּרְאֵה
  choice: dan lihatlah
  rationale: Padanan langsung yang mempertahankan bentuk imperatif dan kepadatan baris Ibrani.
theological_decisions:
- issue: Imperatif antropomorfis yang ditujukan kepada Allah
  choice: Mempertahankan metafora 'Bangunlah'
  alternative: Bertindaklah; Bangkitlah
  rationale: Bahasa doa dalam mazmur menggambarkan Allah seolah-olah tidur atau tidak bertindak. Metafora ini perlu dipertahankan demi daya puitis dan ketegangan teologis ratapan, tanpa menyiratkan bahwa Allah benar-benar tidur.
- issue: Ketidakbersalahan pemazmur sebagai alasan serangan
  choice: Bukan karena aku bersalah
  alternative: Tanpa kesalahan; Meskipun aku tidak bersalah
  rationale: Konteks langsung mengaitkan עָוֺן dengan pemazmur, tetapi bahasa Indonesia memerlukan hubungan yang lebih jelas agar frasa itu tidak keliru dipahami sebagai pernyataan bahwa para penyerang tidak bersalah.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. Seruan 'Bangunlah' sengaja dipertahankan sebagai metafora doa. Tanda seru mencerminkan desakan dua imperatif penutup.
