id: PSA.59.11
reference: Psalms 59:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: id
  text: Janganlah membunuh mereka, supaya umatku tidak lupa. Buatlah mereka mengembara[a] dengan kuasa-Mu[b], dan jatuhkanlah mereka, ya Tuhan, perisai kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “guncangkanlah mereka” atau “buatlah mereka terhuyung-huyung”; verba Ibrani ini dapat menunjuk pada gerakan tanpa ketenangan atau keadaan tidak stabil.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dengan kekuatan-Mu”; kata Ibrani ini dapat berarti kekuatan, kuasa, atau kekuatan militer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵמוֹ
  choice: Janganlah membunuh mereka
  rationale: Partikel larangan אַל dengan bentuk verba berikutnya menyatakan larangan. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: supaya umatku tidak lupa
  rationale: פֶּן memperkenalkan akibat yang hendak dicegah. Bentuk 'supaya ... tidak' menyampaikan maksud itu secara alami tanpa menghilangkan nuansa kekhawatiran.
- source_word: הֲנִיעֵמוֹ
  choice: Buatlah mereka mengembara
  rationale: Bentuk kausatif verba ini menunjuk pada gerakan tanpa ketenangan atau ketidakstabilan. 'Mengembara' cocok dengan gambaran penghukuman yang berlangsung, sementara kemungkinan 'mengguncangkan' atau 'membuat terhuyung-huyung' dicatat dalam catatan kaki.
- source_word: בְחֵילְךָ
  choice: dengan kuasa-Mu
  rationale: חַיִל dapat berarti kekuatan, kuasa, atau kekuatan militer. Dalam sapaan kepada Allah, 'kuasa-Mu' paling wajar dan mempertahankan fungsi instrumental preposisinya.
- source_word: וְהוֹרִידֵמוֹ
  choice: dan jatuhkanlah mereka
  rationale: Bentuk kausatif dari ירד berarti menyebabkan turun. 'Jatuhkanlah' mempertahankan metafora merendahkan atau menaklukkan tanpa menentukan caranya.
- source_word: מָגִנֵּנוּ
  choice: perisai kami
  rationale: Makna harfiahnya adalah 'perisai', sebuah metafora mazmur yang lazim bagi perlindungan Allah dan patut dipertahankan.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: Ini adalah gelar ilahi dalam sapaan langsung, bukan Tetragramaton. Partikel 'ya' menandai bentuk vokatif secara alami.
theological_decisions:
- issue: Sifat penghukuman yang dimohonkan
  choice: Pemazmur memohon agar musuh tidak langsung dibunuh, tetapi dibuat mengembara dan dijatuhkan sehingga umat tidak lupa.
  alternative: Permohonan itu dapat dipahami secara lebih umum sebagai permintaan agar mereka diguncangkan atau dibuat terhuyung-huyung lalu direndahkan.
  rationale: Urutan 'janganlah membunuh ... buatlah ... mengembara ... jatuhkanlah' mempertahankan ketegangan antara tidak membinasakan mereka seketika dan tetap menjatuhkan penghukuman yang nyata, tanpa menentukan bentuk penghukuman lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk perintah dengan -lah sesuai dengan corak doa tanpa terasa kuno. Penulisan 'Tuhan' membedakan אֲדֹנָי dari Tetragramaton. Penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkannya; ini membetulkan ketidaksesuaian posisi penanda dalam lapisan konsultasi bahasa Inggris.
