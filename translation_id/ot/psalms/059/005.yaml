language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: id
  text: 'Tetapi Engkau, ya Yahweh, Allah semesta alam, Allah Israel,

    bangunlah untuk menghukum[a] segala bangsa!

    Janganlah bermurah hati kepada siapa pun yang berkhianat dan berbuat jahat![b]

    Sela.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bangunlah untuk mendatangi, memperhatikan, atau meminta pertanggungjawaban segala bangsa." Kata Ibrani פקד dapat berarti "mendatangi", "memperhatikan", "meminta pertanggungjawaban", atau "menghukum", bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau "Janganlah berbelas kasihan kepada siapa pun yang berkhianat dan berbuat jahat." Kata Ibrani חנן secara harfiah berarti "bermurah hati" atau "menunjukkan perkenanan."
    reason: lexical_alternative
  - marker: c
    text: '"Sela" mungkin merupakan petunjuk musik atau liturgis; arti tepatnya tidak diketahui.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks Ibrani tetap tampak dan tidak dilebur menjadi gelar.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Allah Semesta Alam
  rationale: Ungkapan ini merupakan gelar ilahi yang secara harfiah berkaitan dengan pasukan-pasukan. Padanan Indonesia yang mapan ini mempertahankan keagungan gelar tanpa membatasi acuannya hanya pada pasukan manusia atau makhluk surgawi.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi Ibrani diterjemahkan langsung sebagai gelar perjanjian.
- source_word: הָקִיצָה
  choice: bangunlah
  rationale: Bentuk perintah ini mempertahankan metafora pemazmur yang menyerukan agar Allah bangun dan bertindak.
- source_word: לִפְקֹד
  choice: untuk menghukum
  rationale: Dalam konteks permohonan penghakiman dan seruan agar kemurahan tidak diberikan kepada pelaku kejahatan, makna yudisial 'menghukum' paling sesuai, sementara keluasan makna katanya dicatat dalam catatan kaki.
- source_word: כָּל הַגּוֹיִם
  choice: segala bangsa
  rationale: גּוֹיִם menunjuk pada bangsa-bangsa secara kolektif; padanan ini tidak memasukkan pembedaan teologis yang lebih belakangan antara orang Yahudi dan non-Yahudi.
- source_word: אַל תָּחֹן
  choice: janganlah bermurah hati
  rationale: Padanan ini mempertahankan gagasan dasar חנן, yaitu menunjukkan kemurahan atau perkenanan, dan tetap alami dalam konteks doa penghakiman.
- source_word: בֹּגְדֵי אָוֶן
  choice: para pengkhianat yang berbuat jahat
  rationale: 'Frasa ini mempertahankan dua unsur Ibrani: tindakan tidak setia atau berkhianat dan kejahatan.'
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal yang maknanya tidak pasti ini dipertahankan melalui transliterasi.
theological_decisions:
- issue: Cakupan כָּל הַגּוֹיִם dalam doa yang memohon penghakiman
  choice: segala bangsa
  alternative: semua orang bukan Yahudi
  rationale: Teks menyerukan penghakiman Allah atas bangsa-bangsa secara luas. 'Segala bangsa' mempertahankan cakupan kolektif-politisnya tanpa memasukkan polemik etnis atau kategori teologis yang tidak dinyatakan.
- issue: Kekuatan yudisial לִפְקֹד
  choice: untuk menghukum
  alternative: untuk mendatangi atau meminta pertanggungjawaban
  rationale: Konteks mendukung tindakan penghakiman, tetapi catatan kaki mempertahankan rentang makna kata Ibrani dan tidak menyembunyikan ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan seruan puitis dipertahankan, dengan bentuk 'bangunlah' untuk menjaga metafora asli. Istilah yang terlalu teknis atau bernuansa denominasi dihindari.
