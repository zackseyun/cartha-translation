source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה תִּשְׂחַק לָ֑/מוֹ תִּ֝לְעַ֗ג לְ/כָל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: id
  text: Tetapi Engkau[a], ya Yahweh, menertawakan mereka; Engkau mengolok-olok semua bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun Engkau, ya Yahweh, menertawakan mereka; Engkau mencemooh semua bangsa.”'
    reason: 'Alternatif leksikal: וְ dapat bernuansa “namun”, dan לעג juga dapat diterjemahkan “mencemooh”.'
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Tetapi Engkau
  rationale: Konjungsi וְ bersama pronomina mandiri אַתָּה menandai peralihan yang kontras dengan tindakan musuh dalam konteks sebelumnya. “Tetapi Engkau” menyampaikan daya adversatif itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: תִּשְׂחַק לָמוֹ
  choice: menertawakan mereka
  rationale: Kata kerja שׂחק berarti “tertawa”, dan לָמוֹ menunjukkan pihak yang menjadi sasaran. “Menertawakan mereka” mempertahankan gambaran konkret teks Ibrani.
- source_word: תִּלְעַג
  choice: mengolok-olok
  rationale: Kata kerja לעג menyatakan ejekan atau cemoohan. “Mengolok-olok” jelas, wajar, dan cukup kuat dalam bahasa Indonesia modern.
- source_word: לְ/כָל גּוֹיִם
  choice: semua bangsa
  rationale: גּוֹיִם di sini berarti bangsa-bangsa secara luas, bukan istilah teknis yang harus diterjemahkan “orang bukan Yahudi”. Bentuk “semua bangsa” menyampaikan cakupan menyeluruh secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Gambaran Allah yang tertawa dan mengejek bangsa-bangsa
  choice: Mempertahankan bahasa antropomorfis yang langsung
  alternative: Menafsirkan sebagai sekadar tidak takut atau menghakimi
  rationale: Kedua kata kerja Ibrani secara eksplisit menggambarkan Yahweh tertawa dan mengolok-olok. Terjemahan tidak melunakkan atau memperluas gambaran teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Engkau” dipakai untuk sapaan langsung kepada Allah, sedangkan nama “Yahweh” dipertahankan. Paralelisme dua klausa Ibrani dijaga dengan tanda titik koma.
