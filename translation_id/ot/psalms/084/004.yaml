  yaml_path: translation/ot/psalms/084/004.yaml
  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: id
  text: Berbahagialah orang-orang yang tinggal di rumah-Mu[a]; mereka akan terus memuji Engkau. Sela[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumah-Mu” kemungkinan mengacu pada tempat kudus atau bait Allah.
    reason: cultural_note
  - marker: b
    text: “Sela” adalah istilah liturgis atau musikal Ibrani yang maknanya tidak pasti; secara tradisional istilah ini tidak diterjemahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk seruan jamak ini memperkenalkan ucapan bahagia. “Berbahagialah” alami dalam bahasa Indonesia Alkitabiah modern dan mempertahankan nada luhur tanpa membatasinya pada perasaan subjektif semata.
- source_word: יוֹשְׁבֵי
  choice: orang-orang yang tinggal
  rationale: Partisip dari ישׁב di sini menunjuk pada menetap atau berdiam, bukan sekadar duduk. Pilihan ini menyampaikan tindakan yang berlangsung.
- source_word: בֵיתֶךָ
  choice: di rumah-Mu
  rationale: Secara harfiah berarti “rumah-Mu”. Dalam konteks mazmur, ungkapan ini kemungkinan menunjuk pada tempat kudus atau bait Allah, tetapi kata “rumah” mempertahankan citra dan keluasan makna bahasa Ibrani.
- source_word: עוֹד
  choice: terus
  rationale: Adverbia ini menyatakan kelanjutan. “Terus” terdengar alami dan, bersama bentuk verba berikutnya, memungkinkan nuansa berkelanjutan tanpa memaksakan arti “senantiasa”.
- source_word: יְהַלְלוּךָ
  choice: mereka akan ... memuji Engkau
  rationale: Bentuk imperfek dapat menyatakan tindakan mendatang atau kebiasaan. “Akan ... memuji” mempertahankan kemungkinan nuansa mendatang, sedangkan “terus” menyampaikan keberlanjutannya.
- source_word: סֶּלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis atau musikal Ibrani ini tidak pasti, sehingga ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia dan tidak diberi tafsiran khusus dalam teks utama.
theological_decisions:
- issue: Acuan “rumah-Mu”
  choice: Mempertahankan “rumah-Mu” dalam teks utama.
  alternative: bait-Mu / tempat kudus-Mu
  rationale: Ungkapan itu kemungkinan mengacu pada tempat kudus atau bait Allah, tetapi terjemahan harfiah mempertahankan citra puitis dan tidak mempersempit rujukan melebihi bunyi teks Ibrani.
- issue: Nilai waktu atau aspek יְהַלְלוּךָ
  choice: “mereka akan terus memuji Engkau”
  alternative: “mereka terus memuji Engkau”
  rationale: Imperfek Ibrani dapat bersifat mendatang atau habitual. Terjemahan utama mempertahankan nuansa mendatang sekaligus menyatakan keberlanjutan melalui עוֹד, tanpa meniadakan kemungkinan pembacaan habitual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “rumah-Mu” mempertahankan metafora sumber; “Engkau” dipakai untuk sapaan langsung kepada Allah sesuai register puitis-liturgis. Semua penanda catatan kaki ditempatkan pada unsur yang diterangkannya.
