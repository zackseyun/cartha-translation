base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: id
  text: Pandanglah perisai kami[a], ya Allah, dan tataplah wajah orang yang Kauurapi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelindung kami.” Secara harfiah, bahasa Ibrani berbunyi “perisai kami,” sebuah metafora puitis yang dapat menunjuk kepada Allah sebagai pelindung atau kepada raja.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang yang diurapi-Mu.” Kata Ibrani ini berakar pada kata yang juga mendasari istilah “Mesias”; di sini kemungkinan pertama-tama yang dimaksud adalah raja keturunan Daud, meskipun gema mesianik yang lebih luas tetap mungkin.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: perisai kami
  rationale: Mempertahankan metafora konkret Ibrani tanpa menentukan apakah yang dimaksud adalah Allah sebagai pelindung atau raja.
- source_word: רְאֵה
  choice: pandanglah
  rationale: Imperatif ini memohon perhatian Allah yang penuh perkenanan; “pandanglah” alami dalam doa puitis dan lebih dari sekadar melihat.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Partikel “ya” menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: וְהַבֵּט
  choice: dan tataplah
  rationale: Kata kerja ini menyatakan pandangan yang diarahkan dengan penuh perhatian; pilihan ini juga mempertahankan variasi dengan verba sebelumnya.
- source_word: פְּנֵי
  choice: wajah
  rationale: Mempertahankan citra harfiah Ibrani dan nuansa relasionalnya.
- source_word: מְשִׁיחֶךָ
  choice: orang yang Kauurapi
  rationale: Menyampaikan arti “orang yang diurapi-Mu” secara alami tanpa menjadikannya gelar tetap “Mesias” atau menentukan identitasnya melampaui konteks.
theological_decisions:
- issue: Acuan “perisai kami”
  choice: Metafora “perisai kami” dipertahankan tanpa menentukan acuannya.
  alternative: “pelindung kami,” atau menafsirkannya secara eksplisit sebagai Allah maupun raja.
  rationale: Bahasa Ibrani memungkinkan ambiguitas dan mungkin sengaja menyandingkan “perisai kami” dengan “orang yang Kauurapi.”
- issue: Acuan מְשִׁיחֶךָ
  choice: “orang yang Kauurapi” tanpa kapitalisasi gelar.
  alternative: “Mesias-Mu” atau “yang Kauurapi.”
  rationale: Dalam latar langsung mazmur, ungkapan ini kemungkinan pertama-tama menunjuk kepada raja keturunan Daud. Terjemahan “Mesias” dalam teks utama akan mempersempit makna secara teologis, meskipun hubungan leksikalnya patut dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras doa yang puitis dan bermartabat. “Kauurapi” ditulis serangkai sesuai kaidah pronomina terikat; pengulangan verba Ibrani dibedakan secara alami sebagai “pandanglah” dan “tataplah.”
