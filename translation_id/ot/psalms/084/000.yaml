  text: 'For the choir director: according to the Gittith[c][b][a]. A psalm of the sons of Korah.'
translation:
  language: id
  text: 'Untuk pemimpin musik: menurut Gitit.[a][c] Mazmur bani Korah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Gitit. Istilah ini mungkin menunjuk pada gaya musik, nama lagu, atau alat musik, tetapi makna tepatnya tidak pasti.'
    reason: lexical_alternative
  - marker: b
    text: Atau, “Mazmur untuk bani Korah.” Kata depan Ibrani dapat menyatakan kepengarangan, keterkaitan, atau peruntukan dalam judul mazmur.
    reason: alternative_reading
  - marker: c
    text: Atau, “Dengan Gitit.” Hubungan yang dinyatakan oleh kata depan Ibrani tidak pasti.
    reason: previous_rendering
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, bentuk ini menunjuk kepada orang yang memimpin atau mengawasi pertunjukan musik. Pilihan ini jelas, alami, dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: עַל
  choice: Menurut
  rationale: Dalam petunjuk musik pada judul mazmur, kata depan ini dapat memperkenalkan lagu, gaya, atau alat musik. “Menurut” mempertahankan ketidakpastian itu tanpa menentukan salah satunya.
- source_word: הַגִּתִּית
  choice: Gitit
  rationale: Rujukan istilah ini tidak pasti; mungkin nama lagu, gaya musik, atau alat musik. Transliterasi menghindari penafsiran yang terlalu spesifik.
- source_word: לִבְנֵי קֹרַח
  choice: bani Korah
  rationale: Ungkapan ringkas ini mempertahankan kaitan mazmur dengan kelompok keturunan Korah tanpa memastikan apakah mereka penulis, penerima, atau pihak yang dikaitkan dengannya.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah istilah jenis sastra yang lazim bagi nyanyian yang berkaitan dengan iringan musik.
