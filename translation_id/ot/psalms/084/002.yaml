id: PSA.84.2
reference: Psalms 84:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נִכְסְפָ֬ה וְ/גַם כָּלְתָ֨ה נַפְשִׁ/י֮ לְ/חַצְר֪וֹת יְה֫וָ֥ה לִבִּ֥/י וּ/בְשָׂרִ֑/י יְ֝רַנְּנ֗וּ אֶ֣ל אֵֽל חָֽי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/002.yaml
  text: My soul longs—indeed[a], it even faints—for the courts of Yahweh; my heart and my flesh cry out to the living God.
translation:
  language: id
  text: Jiwaku rindu, bahkan merana, akan pelataran-pelataran Yahweh; hati dan ragaku bersorak[a] kepada Allah yang hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berseru nyaring.” Kata Ibrani ini biasanya menunjuk pada seruan yang bergema, sering kali sebagai ungkapan sukacita.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְסְפָה
  choice: rindu
  rationale: Kata kerja ini menyatakan kerinduan yang kuat. “Rindu” alami dalam bahasa Indonesia dan intensitasnya diperkuat oleh kata kerja berikutnya.
- source_word: וְגַם
  choice: bahkan
  rationale: Gabungan ini memperkuat dan memuncakkan pernyataan berikutnya, bukan sekadar menambahkan tindakan sejajar.
- source_word: כָּלְתָה
  choice: merana
  rationale: Dalam konteks kerinduan, kata ini menggambarkan diri yang seakan habis atau melemah karena hasrat yang mendalam. “Merana” mempertahankan daya emosionalnya tanpa menjadikannya pingsan secara harfiah.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: “Jiwa” merupakan padanan langsung dan wajar bagi diri batin yang merindukan, sementara baris berikutnya melengkapinya dengan hati dan raga.
- source_word: לְחַצְרוֹת
  choice: akan pelataran-pelataran
  rationale: Bentuk jamak ini menunjuk pada pelataran kompleks tempat kudus. Ungkapan “rindu akan” menyampaikan arah kerinduan secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לִבִּי
  choice: hatiku
  rationale: “Hati” mempertahankan gambaran Ibrani tentang pusat hasrat dan kehidupan batin.
- source_word: וּבְשָׂרִי
  choice: dan ragaku
  rationale: “Raga” menyampaikan aspek jasmani dalam pasangan “hati dan daging/tubuh” dengan bahasa Indonesia yang alami dan puitis, tanpa menghilangkan kontras batin-jasmani.
- source_word: יְרַנְּנוּ
  choice: bersorak
  rationale: Kata kerja ini lazim menyatakan seruan nyaring, terutama sorak sukacita. “Bersorak” mempertahankan unsur vokal dan nuansa sukacita, sementara kemungkinan makna yang lebih umum dicatat dalam catatan kaki.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini secara langsung menandai arah seruan kepada Allah; “kepada” lebih setia daripada menjadikannya objek yang dicari.
- source_word: אֵל חָי
  choice: Allah yang hidup
  rationale: Ungkapan ini merupakan sebutan definit bagi Allah Israel dalam konteks mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Nuansa seruan dalam יְרַנְּנוּ
  choice: bersorak
  alternative: berseru nyaring
  rationale: Akar רנן biasanya mengandung nuansa seruan sukacita, tetapi dapat menonjolkan bunyi seruan yang nyaring. Teks utama mempertahankan nuansa sukacita, sedangkan catatan kaki menjaga keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. “Hati dan ragaku” mempertahankan pasangan batin-jasmani secara alami; tanda baca mengikuti gerak paralel puisi Ibrani.
