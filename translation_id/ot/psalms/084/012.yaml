  text: יְהוָ֥ה צְבָא֑וֹת אַֽשְׁרֵ֥י אָ֝דָ֗ם בֹּטֵ֥חַ בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/012.yaml
  text: O Yahweh of hosts[b][a], blessed is the man who trusts in you.
translation:
  language: id
  text: Ya Yahweh, yang berkuasa atas bala tentara[a], berbahagialah[b] orang[c] yang percaya kepada-Mu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Yahweh atas bala tentara.” “Bala tentara” dapat mencakup pasukan surgawi maupun duniawi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sungguh beruntunglah” atau “betapa bahagianya.”'
    reason: lexical_alternative
  - marker: c
    text: Ibrani memakai kata tunggal yang berarti “orang” atau “manusia”; yang dimaksud ialah siapa pun yang percaya kepada Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar TUHAN.
- source_word: צְבָאוֹת
  choice: Penguasa bala tentara
  rationale: Ungkapan ini mempertahankan gambaran bala tentara dalam gelar Ibrani, sambil membuat hubungan konstruksi tersebut wajar dan jelas dalam bahasa Indonesia.
- source_word: אַשְׁרֵי
  choice: berbahagialah
  rationale: Bentuk seruan ini menyatakan keadaan yang patut disebut bahagia atau beruntung; 'berbahagialah' sesuai dengan corak mazmur hikmat dan tidak harus berarti tindakan pasif 'diberkati'.
- source_word: אָדָם
  choice: orang
  rationale: Nomina tunggal ini merujuk secara representatif kepada seorang manusia, tanpa secara khusus membatasi maknanya pada laki-laki.
- source_word: בֹּטֵחַ
  choice: yang percaya
  rationale: Partisip ini menggambarkan sikap atau tindakan yang menjadi ciri orang tersebut. 'Percaya' merupakan padanan Indonesia yang alami bagi tindakan menaruh kepercayaan.
- source_word: בָּךְ
  choice: kepada-Mu
  rationale: Dalam bahasa Indonesia, 'percaya kepada-Mu' adalah konstruksi idiomatis untuk kepercayaan yang diarahkan kepada pribadi yang sedang disapa.
theological_decisions:
- issue: Gelar ilahi יְהוָה צְבָאוֹת
  choice: Ya Yahweh, Penguasa bala tentara
  alternative: Ya Yahweh semesta alam
  rationale: Pilihan utama mempertahankan nama Yahweh dan citra צְבָאוֹת sebagai bala tentara. Kata 'Penguasa' menjelaskan hubungan gelar itu secara alami tanpa mengubahnya menjadi sebutan 'Yang Mahakuasa'. Partikel 'Ya' menandai sapaan langsung yang tersirat oleh bentuk orang kedua pada akhir ayat.
- issue: Cakupan אָדָם
  choice: orang
  alternative: manusia
  rationale: Kata Ibrani tunggal ini bersifat generik. 'Orang' mempertahankan acuan individual tanpa menyiratkan bahwa janji tersebut hanya berlaku bagi laki-laki.
- issue: Nuansa אַשְׁרֵי
  choice: berbahagialah
  alternative: sungguh beruntunglah
  rationale: Ungkapan ini adalah seruan tentang keadaan baik orang yang percaya kepada Yahweh, bukan penjelasan mekanis tentang bagaimana berkat diberikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Tanda seru mencerminkan sifat ayat ini sebagai seruan pemazmur. Huruf kapital pada “-Mu” mengikuti kebiasaan penerbitan rohani Indonesia untuk sapaan kepada Allah.
