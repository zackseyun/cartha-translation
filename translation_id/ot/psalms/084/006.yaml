  text: עֹבְרֵ֤י בְּ/עֵ֣מֶק הַ֭/בָּכָא מַעְיָ֣ן יְשִׁית֑וּ/הוּ גַּם בְּ֝רָכ֗וֹת יַעְטֶ֥ה מוֹרֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
translation:
  language: id
  text: Ketika melintasi Lembah Baka[a], mereka menjadikannya mata air; bahkan hujan awal[b] menyelubungi lembah itu dengan berkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baka mungkin menggemakan kata Ibrani yang berkaitan dengan “tangisan”; karena itu, frasa ini juga dapat dipahami sebagai “Lembah Tangisan.” Ada pula yang mengaitkannya dengan sejenis pohon balsam.
    reason: alternative_reading
  - marker: b
    text: Atau “hujan musim gugur,” yaitu hujan yang mulai turun pada awal musim hujan. Kata Ibrani ini juga dapat berarti “pengajar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי בְּעֵמֶק
  choice: Ketika melintasi Lembah
  rationale: Partisipel jamak עֹבְרֵי menunjuk kepada orang-orang yang sedang melintas, sedangkan בְּ bersama verba gerak paling alami dinyatakan sebagai gerakan melintasi suatu tempat. Subjek “mereka” dipahami dari konteks para peziarah.
- source_word: הַבָּכָא
  choice: Baka
  rationale: Istilah ini dapat berfungsi sebagai nama tempat sekaligus membangkitkan kaitan bunyi dengan kata Ibrani untuk tangisan. Transliterasi mempertahankan ambiguitas tersebut, sedangkan kemungkinan maknanya dijelaskan dalam catatan kaki.
- source_word: מַעְיָן
  choice: mata air
  rationale: Kata ini menunjuk pada sumber atau pancaran air. “Mata air” merupakan padanan Indonesia yang jelas, alami, dan sesuai dengan gambaran puisi.
- source_word: יְשִׁיתוּהוּ
  choice: mereka menjadikannya
  rationale: Bentuk dari שׁית berarti menaruh, menetapkan, atau menjadikan. Sufiks orang ketiga maskulin tunggal mengacu pada lembah, sehingga frasa ini menyatakan bahwa mereka menjadikannya mata air.
- source_word: גַּם
  choice: bahkan
  rationale: Partikel ini menambahkan pernyataan yang menguatkan atau mencapai klimaks dalam perkembangan gambaran puitis.
- source_word: בְּרָכוֹת
  choice: dengan berkat
  rationale: Bentuk ini secara wajar berarti “berkat-berkat.” Bahasa Indonesia dapat memakai bentuk kolektif tunggal “berkat” secara alami, sambil mempertahankan gambaran bahwa hujan membawa karunia yang menghidupkan.
- source_word: יַעְטֶה
  choice: menyelubungi
  rationale: Verba ini menyampaikan tindakan menutupi, menyelubungi, atau mengenakan sesuatu. “Menyelubungi” mempertahankan metafora puitisnya.
- source_word: מוֹרֶה
  choice: hujan awal
  rationale: Dalam konteks gambaran air dan kesuburan, kata ini paling mungkin menunjuk pada hujan musim awal, yakni hujan yang mulai turun pada musim gugur. Namun, bentuk yang sama juga dapat berarti “pengajar,” sehingga alternatif itu dicatat.
theological_decisions:
- issue: Apakah הַבָּכָא diterjemahkan maknanya atau ditransliterasikan sebagai nama tempat
  choice: Memakai nama “Baka” dalam teks utama
  alternative: “Lembah Tangisan” atau kemungkinan kaitan dengan pohon balsam
  rationale: Bentuk tersebut secara alami dapat dibaca sebagai nama tempat, tetapi mungkin sengaja menggemakan gagasan tangisan. Transliterasi tidak menutup salah satu nuansa itu.
- issue: Makna מוֹרֶה
  choice: Menerjemahkannya sebagai “hujan awal”
  alternative: “pengajar”
  rationale: Konteks mata air, hujan, dan berkat mendukung arti hujan musiman. Karena kata Ibrani yang sama juga dapat berarti “pengajar,” ambiguitas leksikal itu tetap disampaikan melalui catatan kaki.
- issue: Objek tersirat dari יַעְטֶה
  choice: Menjelaskannya sebagai “lembah itu”
  alternative: Membiarkan objek verba “menyelubungi” tidak dinyatakan
  rationale: Bahasa Ibrani memungkinkan objek dipahami dari konteks, sedangkan bahasa Indonesia memerlukan ungkapan yang lebih lengkap agar kalimat alami. Lembah merupakan acuan kontekstual yang paling dekat dan sesuai dengan gambaran hujan yang menutupinya dengan berkat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang tetap mudah dipahami. Susunan klausa dibuat alami tanpa menghilangkan gerak peziarahan, perubahan lembah menjadi sumber air, dan berkat yang dibawa hujan. Istilah ambigu dipertahankan atau dijelaskan dalam catatan kaki.
