id: PSA.84.1
reference: Psalms 84:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: id
  text: Betapa indahnya tempat-tempat kediaman-Mu[a], ya Yahweh semesta alam!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Betapa dikasihinya tempat-tempat kediaman-Mu” atau “Betapa menyenangkannya tempat-tempat kediaman-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Betapa
  rationale: מַה berfungsi sebagai pembuka seruan, bukan pertanyaan. “Betapa” menyampaikan daya puitis dan intensitasnya secara alami dalam bahasa Indonesia.
- source_word: יְּדִידוֹת
  choice: indahnya
  rationale: Bentuk ini menyatakan bahwa tempat-tempat tersebut elok, menyenangkan, atau dikasihi. “Indah” paling alami dalam seruan puitis bahasa Indonesia, sedangkan kemungkinan makna “dikasihi” dan “menyenangkan” dipertahankan dalam catatan kaki.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: tempat-tempat kediaman-Mu
  rationale: Pilihan ini mempertahankan bentuk jamak dan gagasan dasar tentang tempat Allah berdiam, tanpa mempersempitnya hanya kepada Kemah Suci Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: צְבָאוֹת
  choice: semesta alam
  rationale: Dalam gelar ilahi, צְבָאוֹת mencakup bala tentara atau bala-bala surgawi dan kuasa kosmis. “Semesta alam” merupakan ungkapan Indonesia yang alami, khidmat, dan cukup luas, tanpa menyiratkan hanya pasukan manusia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: ya Yahweh
  alternative: ya TUHAN; ya Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi. “Yahweh” mempertahankan nama tersebut, sedangkan “ya” secara alami menandai sapaan langsung.
- issue: Penerjemahan gelar יְהוָה צְבָאוֹת
  choice: Yahweh semesta alam
  alternative: Yahweh bala tentara; Yahweh bala semesta
  rationale: Pilihan ini mempertahankan keluasan gelar dan terdengar alami dalam bahasa Indonesia. Alternatif yang memakai “bala tentara” lebih harfiah, tetapi dapat dipahami terlalu sempit sebagai pasukan militer manusia.
translation_notes:
  register: Bahasa puitis, khidmat, dan mudah dipahami. Bentuk jamak sumber dipertahankan dalam “tempat-tempat kediaman-Mu”; kapitalisasi akhiran pronomina menghormati rujukan kepada Allah.
