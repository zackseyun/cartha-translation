id: PSA.84.11
reference: Psalms 84:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י שֶׁ֨מֶשׁ וּ/מָגֵן֮ יְהוָ֪ה אֱלֹ֫הִ֥ים חֵ֣ן וְ֭/כָבוֹד יִתֵּ֣ן יְהוָ֑ה לֹ֥א יִמְנַע ט֝֗וֹב לַֽ/הֹלְכִ֥ים בְּ/תָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: id
  text: Sebab Yahweh Allah adalah matahari dan perisai; Yahweh memberikan kemurahan dan kehormatan.[a] Ia tidak menahan apa yang baik dari mereka yang berjalan tanpa cela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kasih karunia dan kemuliaan.”
    reason: lexical_alternative
  - marker: b
    text: “Tanpa cela” di sini berarti hidup dengan integritas, tulus, atau lurus hati, bukan sama sekali tidak berdosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya dan berfungsi alami dalam alur mazmur.
- source_word: שֶׁמֶשׁ
  choice: matahari
  rationale: Metafora Ibrani dipertahankan secara langsung, tanpa ditafsirkan menjadi sekadar 'terang'.
- source_word: וּמָגֵן
  choice: dan perisai
  rationale: Metafora perlindungan ilahi dipertahankan sebagaimana dalam teks sumber.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהִים diterjemahkan 'Allah' sebagai aposisi.
- source_word: חֵן
  choice: kemurahan
  rationale: Dalam konteks pemberian ilahi, 'kemurahan' menyampaikan perkenanan yang dianugerahkan tanpa memasukkan nuansa teologis yang lebih khusus.
- source_word: וְכָבוֹד
  choice: dan kehormatan
  rationale: Karena hal ini diberikan kepada umat, 'kehormatan' secara alami menyatakan martabat yang dianugerahkan; kemungkinan 'kemuliaan' dicatat dalam catatan kaki.
- source_word: יִתֵּן
  choice: memberikan
  rationale: Bentuk imperfek menyatakan tindakan khas atau kebenaran umum, sehingga bentuk kini bahasa Indonesia paling sesuai.
- source_word: לֹא יִמְנַע
  choice: tidak menahan
  rationale: Terjemahan ini mempertahankan makna dasar verba, yakni tidak menyimpan atau menghalangi pemberian.
- source_word: טוֹב
  choice: apa yang baik
  rationale: Ungkapan ini mengungkapkan penggunaan substantival kata 'baik' secara alami dalam bahasa Indonesia.
- source_word: לַהֹלְכִים
  choice: dari mereka yang berjalan
  rationale: Metafora 'berjalan' untuk cara hidup dipertahankan karena tetap dapat dipahami dalam bahasa Indonesia.
- source_word: בְּתָמִים
  choice: tanpa cela
  rationale: Ungkapan ini menyatakan keutuhan, ketulusan, atau integritas hidup, bukan kesempurnaan mutlak tanpa dosa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankan nama tersebut dan membedakannya dari gelar.
- issue: Kemungkinan בְּתָמִים dipahami sebagai kesempurnaan tanpa dosa
  choice: tanpa cela
  alternative: dengan tulus; dengan integritas; dengan lurus hati
  rationale: Istilah Ibrani menunjuk pada keutuhan dan integritas dalam cara hidup. Catatan kaki mencegah pembaca mengartikannya sebagai klaim bahwa seseorang sama sekali tidak berdosa.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Paralelisme serta metafora puitis 'matahari', 'perisai', dan 'berjalan' dipertahankan. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
