  text: אַשְׁרֵ֣י אָ֭דָם עֽוֹז ל֥/וֹ בָ֑/ךְ מְ֝סִלּ֗וֹת בִּ/לְבָבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/005.yaml
  text: Blessed is the man whose strength is in you[b][a], in whose heart are the highways.
translation:
  language: id
  text: Berbahagialah orang yang kekuatannya ada di dalam Engkau, yang dalam hatinya ada jalan-jalan raya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam hati mereka ada jalan-jalan raya.” Sufiks Ibrani pada “hati mereka” berbentuk jamak, meskipun ayat ini diawali dengan kata “orang” dalam bentuk tunggal.
    reason: lexical_alternative
  - marker: b
    text: “Jalan-jalan raya” kemungkinan besar merujuk pada jalan-jalan ziarah menuju kediaman Allah, tetapi “menuju Sion” tidak dinyatakan secara eksplisit dalam ayat ini.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk jamak ini berfungsi sebagai ungkapan tetap dalam ucapan bahagia. “Berbahagialah” alami, luhur, dan sesuai dengan nomina tunggal yang mengikutinya.
- source_word: אָדָם
  choice: orang
  rationale: Nomina ini tunggal dan generik, menunjuk kepada siapa pun yang memiliki sifat tersebut. Dalam bahasa Indonesia, “orang” mempertahankan cakupan generiknya tanpa menambahkan penandaan gender yang tidak diperlukan oleh pemakaian modern.
- source_word: עֹז
  choice: kekuatan
  rationale: Dalam konteks ini kata tersebut menunjuk pada daya atau kekuatan yang ditemukan dalam Allah, bukan terutama benteng atau tempat perlindungan.
- source_word: לוֹ ... בָךְ
  choice: yang kekuatannya ada di dalam Engkau
  rationale: Secara harfiah konstruksi itu menyatakan bahwa kekuatan 'baginya' berada 'di dalam Engkau'. Bentuk relatif ini wajar dalam bahasa Indonesia dan tetap mempertahankan daya metaforis preposisi ב.
- source_word: מְסִלּוֹת
  choice: jalan-jalan raya
  rationale: Kata ini menunjuk pada jalan yang ditinggikan atau jalan raya. Konteks mazmur mengisyaratkan jalan ziarah, tetapi tujuan jalan itu tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: בִּלְבָבָם
  choice: yang dalam hatinya ada
  rationale: Teks Ibrani memiliki sufiks orang ketiga jamak, secara harfiah 'dalam hati mereka', setelah אָדָם yang tunggal. Teks utama mempertahankan kelancaran struktur ucapan bahagia dalam bahasa Indonesia, sedangkan pergeseran jumlah dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan generik אָדָם
  choice: orang
  alternative: laki-laki itu / manusia
  rationale: אָדָם di sini bersifat tunggal tetapi representatif. “Orang” menyampaikan cakupan umum secara tepat dan alami dalam bahasa Indonesia tanpa mempersempitnya kepada laki-laki.
- issue: Tujuan yang tersirat dari מְסִלּוֹת
  choice: jalan-jalan raya
  alternative: jalan-jalan raya menuju Sion / jalan-jalan ziarah
  rationale: Konteks Mazmur 84 mendukung gambaran perjalanan ziarah menuju kediaman Allah, tetapi ayat ini sendiri tidak menyebut Sion atau tujuan lain. Karena itu, tujuan tersebut tidak dimasukkan ke dalam teks utama.
- issue: Pergeseran tunggal-jamak pada בִּלְבָבָם
  choice: yang dalam hatinya ada
  alternative: dalam hati mereka ada
  rationale: Bahasa Ibrani beralih dari אָדָם tunggal kepada sufiks jamak 'mereka'. Teks utama memakai konstruksi tunggal yang alami, tetapi bentuk jamak sumber dipertahankan sebagai alternatif eksplisit dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Sapaan kepada Allah ditulis “Engkau”. Susunan klausa dibuat alami bagi pembaca umum sambil mempertahankan metafora jalan raya dalam hati serta mencatat ketidakselarasan jumlah dalam bahasa Ibrani.
