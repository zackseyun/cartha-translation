base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/007.yaml
  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: id
  text: Mereka berjalan dari kekuatan menuju kekuatan[a]; setiap orang menghadap Allah di Sion.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari pasukan menuju pasukan” atau “dari kemenangan menuju kemenangan”; kata Ibrani yang diterjemahkan “kekuatan” juga dapat berarti keperkasaan atau pasukan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menampakkan diri kepada Allah”; dalam konteks ini kemungkinan berarti hadir menghadap Allah dalam ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: Mereka berjalan
  rationale: Bentuk Qal imperfek orang ketiga jamak dari הלך menyatakan gerak yang berlangsung. “Berjalan” alami dalam konteks perjalanan ziarah tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: מֵחַיִל אֶל חָיִל
  choice: dari kekuatan menuju kekuatan
  rationale: חַיִל memiliki cakupan makna yang luas, termasuk kekuatan, keperkasaan, pasukan, dan keberhasilan. Dalam konteks ziarah, ungkapan ini paling wajar menggambarkan kekuatan yang terus diperbarui, sambil tetap mempertahankan bentuk pengulangan Ibrani.
- source_word: יֵרָאֶה
  choice: menghadap
  rationale: Bentuk Nifal imperfek orang ketiga tunggal dari ראה dalam konteks ibadah atau ziarah dapat berarti menampakkan atau menghadirkan diri. “Menghadap” menyampaikan tindakan hadir di hadapan Allah secara alami dalam bahasa Indonesia.
- source_word: אֶל אֱלֹהִים
  choice: Allah
  rationale: Preposisi אֶל secara harfiah berarti “kepada/menuju”, tetapi bersama verba יֵרָאֶה membentuk gagasan hadir menghadap Allah; hubungan preposisional itu tercakup secara idiomatis dalam verba “menghadap”.
- source_word: בְצִיּוֹן
  choice: di Sion
  rationale: Nama tempat dipertahankan sebagai “Sion”; preposisi בְ paling alami diterjemahkan “di” untuk lokasi tempat kudus.
- source_word: יֵרָאֶה (bentuk tunggal dalam konteks jamak)
  choice: setiap orang menghadap
  rationale: 'Verba tunggal setelah subjek jamak sebelumnya paling baik dipertahankan sebagai bentuk distributif: masing-masing peziarah menghadap Allah.'
theological_decisions:
- issue: Makna idiomatis hadir di hadapan Allah
  choice: Ayat ini menggambarkan setiap peziarah hadir menghadap Allah di Sion.
  alternative: Teks dapat dipahami secara lebih pasif sebagai “terlihat oleh Allah di Sion” atau lebih harfiah sebagai “tampak kepada Allah”.
  rationale: Dalam konteks ziarah dan ibadah, bentuk Nifal dari ראה lazim menyatakan tindakan hadir atau menampakkan diri di hadapan Allah. Terjemahan “menghadap” menyampaikan idiom tersebut tanpa menambahkan ajaran tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan “kekuatan menuju kekuatan” mempertahankan corak ungkapan Ibrani, sedangkan “menghadap Allah” membuat idiom peribadatan jelas bagi pembaca umum.
