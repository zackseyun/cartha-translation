  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּם צִפּ֨וֹר מָ֪צְאָה בַ֡יִת וּ/דְר֤וֹר קֵ֥ן לָ/הּ֮ אֲשֶׁר שָׁ֪תָה אֶפְרֹ֫חֶ֥י/הָ אֶֽת מִ֭זְבְּחוֹתֶי/ךָ יְהוָ֣ה צְבָא֑וֹת מַ֝לְכִּ֗/י וֵ/אלֹהָֽ/י־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: id
  text: Bahkan burung pipit telah menemukan tempat tinggal, dan burung layang-layang telah menemukan sarangnya sendiri, tempat ia menaruh anak-anaknya[a]—di dekat mezbah-mezbah-Mu[b], ya Yahweh, Allah segala bala tentara[c], Rajaku dan Allahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat ia telah menaruh anak-anaknya.” Kata kerja Ibrani dapat dipahami sebagai tindakan yang telah selesai, bukan hanya sebagai gambaran umum tentang fungsi sarang.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “pada mezbah-mezbah-Mu.” Susunan bahasa Ibrani padat dan mungkin menunjuk pada kedekatan atau posisi di sisi mezbah-mezbah, bukan bahwa sarang itu tepat di atasnya.
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional, “TUHAN semesta alam.” Gelar Ibrani ini menunjuk pada bala tentara atau pasukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Bahkan
  rationale: Menangkap tekanan puitis bahwa burung kecil pun memperoleh tempat di dekat kediaman Allah.
- source_word: צִפּוֹר
  choice: burung pipit
  rationale: Kata ini dapat berarti burung kecil secara umum, tetapi 'burung pipit' merupakan padanan tradisional yang masuk akal dan berpasangan alami dengan burung layang-layang.
- source_word: מָצְאָה בַיִת
  choice: telah menemukan tempat tinggal
  rationale: Menyampaikan tindakan yang telah terjadi beserta hasilnya; 'tempat tinggal' lebih idiomatis dalam konteks burung daripada 'rumah'.
- source_word: דְּרוֹר
  choice: burung layang-layang
  rationale: Identifikasi yang umum dan dapat dipertanggungjawabkan, meski nama spesies tepatnya tidak sepenuhnya pasti.
- source_word: קֵן לָהּ
  choice: sebuah sarang baginya
  rationale: Mempertahankan datif yang menyatakan kepentingan atau kepemilikan tanpa membuat bahasa Indonesia menjadi terlalu kaku.
- source_word: אֲשֶׁר שָׁתָה אֶפְרֹחֶיהָ
  choice: tempat ia menaruh anak-anaknya
  rationale: שׁתה berarti menaruh atau menempatkan; bentuk perfektifnya paling langsung disampaikan sebagai tindakan nyata, sementara klausa relatif tetap dapat menggambarkan fungsi sarang.
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: dekat mezbah-mezbah-Mu
  rationale: Susunan Ibrani sangat padat. 'Dekat' menghindari gambaran bahwa sarang secara harfiah berada di atas permukaan mezbah, sekaligus mempertahankan kedekatan dengan tempat kudus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: צְבָאוֹת
  choice: semesta tentara
  rationale: Ungkapan Indonesia yang jelas untuk banyak bala tentara dan tetap mempertahankan daya agung serta militer dari gelar Ibrani.
- source_word: מַלְכִּי וֵאלֹהָי
  choice: Rajaku dan Allahku
  rationale: Mempertahankan pengakuan pribadi dan sapaan langsung kepada Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankan statusnya sebagai nama diri.
- issue: Makna צְבָאוֹת dalam gelar ilahi
  choice: semesta tentara
  alternative: segala bala tentara atau bala semesta
  rationale: Menjaga arti konkret bala-bala tentara serta nuansa kedaulatan ilahi tanpa memakai istilah lama yang kurang transparan.
- issue: Hubungan sarang dengan mezbah-mezbah
  choice: dekat mezbah-mezbah-Mu
  alternative: pada mezbah-mezbah-Mu
  rationale: Konstruksi Ibrani dapat memberi gambaran keterkaitan langsung, tetapi konteks memungkinkan makna kedekatan. Pilihan utama menghindari kesan bahwa burung bersarang tepat di atas mezbah; alternatif literal dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan ilahi memakai huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Tanda pisah mempertahankan peralihan dari gambaran burung kepada seruan langsung kepada Yahweh.
