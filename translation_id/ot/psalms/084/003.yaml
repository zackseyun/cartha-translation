    rationale: Konstruksi ini terdengar terpotong dan tidak jelas hubungan sintaktisnya. “Yahweh, Allah segala bala tentara” menyatakan hubungan genitif yang dimaksud oleh יְהוָה צְבָאוֹת dan mempertahankan nuansa militer.
  - severity: low
