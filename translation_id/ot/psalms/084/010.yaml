  text: כִּ֤י טֽוֹב י֥וֹם בַּ/חֲצֵרֶ֗י/ךָ מֵ֫/אָ֥לֶף בָּחַ֗רְתִּי הִ֭סְתּוֹפֵף בְּ/בֵ֣ית אֱלֹהַ֑/י מִ֝/דּ֗וּר בְּ/אָהֳלֵי רֶֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: id
  text: Sebab satu hari di pelataran-Mu lebih baik daripada seribu[a]. Aku lebih memilih berdiri di ambang pintu[b] rumah Allahku daripada tinggal di kemah-kemah kejahatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daripada seribu.” Sebagian terjemahan menambahkan “hari” atau “di tempat lain,” tetapi kata-kata itu tidak terdapat dalam teks Ibrani.
    reason: alternative_reading
  - marker: b
    text: Atau, “aku telah memilih berada di ambang pintu rumah Allahku”; menurut terjemahan tradisional, “aku lebih suka menjadi penjaga pintu di rumah Allahku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: lebih baik
  rationale: Dalam konstruksi perbandingan dengan מֵאָלֶף, bentuk komparatif ini paling alami dalam bahasa Indonesia.
- source_word: בַּחֲצֵרֶיךָ
  choice: di pelataran-Mu
  rationale: חָצֵר menunjuk pada pelataran atau halaman; bentuk tunggal kolektif bahasa Indonesia secara alami mewakili bentuk jamak Ibrani dalam konteks tempat kudus.
- source_word: מֵאָלֶף
  choice: daripada seribu
  rationale: Teks Ibrani hanya menyebut 'daripada seribu' tanpa menyatakan 'hari' atau 'di tempat lain'; elipsis itu dipertahankan.
- source_word: בָּחַרְתִּי
  choice: Aku lebih memilih
  rationale: Bentuk perfektif secara harfiah berarti 'aku telah memilih', tetapi dalam perbandingan puitis ini menyatakan pilihan atau preferensi.
- source_word: הִסְתּוֹפֵף
  choice: berdiri di ambang pintu
  rationale: Kata ini menggambarkan mengambil tempat yang rendah di ambang, bukan secara tegas menjabat sebagai penjaga pintu.
- source_word: בְּבֵית אֱלֹהַי
  choice: di rumah Allahku
  rationale: Terjemahan langsung yang mempertahankan gambaran rumah sebagai tempat kudus tanpa mempersempitnya menjadi 'Bait Allah'.
- source_word: מִדּוּר
  choice: daripada tinggal
  rationale: Infinitif ini menyatakan keadaan menetap dan membentuk sisi kedua dari perbandingan.
- source_word: בְּאָהֳלֵי רֶשַׁע
  choice: di kemah-kemah kejahatan
  rationale: Bentuk jamak 'kemah-kemah' dan nomina abstrak רֶשַׁע dipertahankan, sehingga penekanannya tetap pada watak moral tempat itu, bukan secara eksplisit pada identitas para penghuninya.
theological_decisions:
- issue: Bahasa tempat kudus
  choice: pelataran-Mu / rumah Allahku
  alternative: halaman-Mu / Bait Allahku
  rationale: Pilihan ini mempertahankan gambaran konkret tentang kedekatan dengan tempat kediaman Allah tanpa menentukan bangunan atau tahap sejarahnya secara lebih sempit daripada teks Ibrani.
- issue: Status orang di ambang pintu
  choice: berdiri di ambang pintu
  alternative: menjadi penjaga pintu
  rationale: Teks menekankan kerendahan tempat di rumah Allah; menerjemahkannya sebagai jabatan resmi 'penjaga pintu' akan menyelesaikan ketidakpastian leksikal secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan sapaan ilahi berhuruf kapital. Struktur perbandingan dan elipsis Ibrani dipertahankan sejauh tetap dapat dipahami; istilah denominatif dan jabatan yang tidak dinyatakan tegas dalam sumber dihindari.
