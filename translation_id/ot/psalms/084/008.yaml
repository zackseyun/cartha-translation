  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְ֭בָאוֹת שִׁמְעָ֣/ה תְפִלָּתִ֑/י הַאֲזִ֨ינָ/ה אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/008.yaml
  text: O Yahweh God of hosts[a], hear my prayer; give ear, O God of Jacob[b]. Selah
translation:
  language: id
  text: Ya Yahweh[a], Allah bala tentara, dengarkanlah doaku; simaklah, ya Allah Yakub. Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani יהוה (YHWH); dalam banyak terjemahan secara tradisional ditulis “TUHAN”.
    reason: alternative_reading
  - marker: b
    text: “Sela” adalah istilah liturgis atau musikal Ibrani yang artinya tidak pasti; mungkin menandai jeda atau selingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH agar nama pribadi yang terdapat dalam teks Ibrani tetap tampak, bukan menggantinya dengan gelar.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Allah bala tentara
  rationale: Mempertahankan gelar ilahi yang menunjuk kepada Allah sebagai Allah atas bala tentara atau segala pasukan, tanpa mempersempitnya hanya kepada pasukan manusia atau pasukan surgawi.
- source_word: שִׁמְעָה
  choice: dengarkanlah
  rationale: Imperatif ini merupakan permohonan langsung agar Allah mendengar doa pemazmur; bentuk dengan -lah wajar dan khidmat dalam bahasa Indonesia.
- source_word: תְפִלָּתִי
  choice: doaku
  rationale: Menerjemahkan nomina dengan sufiks orang pertama tunggal secara ringkas dan alami.
- source_word: הַאֲזִינָה
  choice: perhatikanlah
  rationale: Membedakannya dari שִׁמְעָה sambil menyampaikan seruan agar Allah menyimak dengan sungguh-sungguh; ungkapan harfiah 'berilah telinga' kurang alami dalam bahasa Indonesia modern.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Allah Yakub
  rationale: Menerjemahkan frasa konstruksi yang menyatakan hubungan Allah dengan Yakub/Israel secara langsung dan lazim.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna dan fungsi istilah liturgis atau musikal ini tidak pasti, sehingga transliterasi mempertahankan unsur teks tanpa menetapkan tafsiran spekulatif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian YHWH secara langsung. Bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar, sementara catatan kaki memberitahukan tradisi penerjemahan lain.
- issue: Cakupan צְבָאוֹת dalam gelar ilahi
  choice: bala tentara
  alternative: pasukan-pasukan; semesta alam
  rationale: Istilah Ibrani dapat mencakup bala tentara atau pasukan tanpa menjelaskan secara eksplisit apakah yang dimaksud pasukan Israel, pasukan surgawi, atau seluruh kekuatan kosmis. Terjemahan ini mempertahankan keluasan tersebut.
- issue: Perlakuan terhadap סֶלָה
  choice: Sela
  alternative: jeda; selingan
  rationale: Karena arti tepat istilah ini diperdebatkan, transliterasi menjaga ketidakpastian asli dan tidak memasukkan fungsi liturgis tertentu ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel -lah mempertahankan nada permohonan puitis. Paralelisme dua seruan dijaga dengan 'dengarkanlah' dan 'perhatikanlah', sedangkan sapaan berulang diterjemahkan dengan 'ya'.
