base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: id
  text: Aku mengenal setiap burung di pegunungan, dan makhluk di padang ada bersama-Ku.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk yang bergerak di padang” atau “satwa liar di padang”; arti kata Ibrani זִיז tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “adalah milik-Ku”; bahasa Ibraninya secara lebih harfiah berbunyi “bersama-Ku.”
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Aku mengenal
  rationale: Bentuk perfektif dari ידע dapat menyatakan keadaan yang tetap pada masa kini. Dalam konteks ini, ungkapan tersebut menegaskan pengetahuan Allah yang menyeluruh; “Aku mengenal” terdengar alami dan tetap mempertahankan nuansa relasional yang mungkin terkandung dalam kata itu.
- source_word: כָּל עוֹף
  choice: setiap burung
  rationale: כָּל dengan nomina tunggal kolektif menyampaikan cakupan menyeluruh. “Setiap burung” secara alami menonjolkan bahwa tidak seekor pun luput dari pengetahuan Allah.
- source_word: הָרִים
  choice: di pegunungan
  rationale: Bentuk jamak ini menunjuk pada gunung-gunung atau daerah pegunungan. Frasa “di pegunungan” lebih wajar dalam bahasa Indonesia ketika menerangkan habitat burung.
- source_word: וְזִיז שָׂדַי
  choice: dan segala makhluk di padang
  rationale: זִיז adalah kata yang sulit dan mungkin menunjuk pada sesuatu yang bergerak atau satwa liar. “Segala makhluk” menjaga keluasan maknanya tanpa menentukan jenis makhluk secara berlebihan, sedangkan “di padang” menerjemahkan שָׂדַי secara puitis dan alami.
- source_word: עִמָּדִי
  choice: ada bersama-Ku
  rationale: Ungkapan ini secara harfiah berarti “bersama-Ku” atau “di sisi-Ku.” Penambahan “ada” menghasilkan kalimat Indonesia yang alami sambil mempertahankan ungkapan Ibrani dan tidak mengubah implikasi kepemilikan menjadi pernyataan eksplisit.
theological_decisions:
- issue: Implikasi kepemilikan ilahi dalam עִמָּדִי
  choice: Mempertahankan ungkapan “ada bersama-Ku.”
  alternative: “adalah milik-Ku”
  rationale: Konteks mazmur menegaskan pengetahuan dan kedaulatan Allah atas ciptaan, sehingga ungkapan ini dapat menyiratkan kepemilikan. Namun, teks Ibrani secara langsung mengatakan “bersama-Ku,” bukan “milik-Ku”; terjemahan mempertahankan rumusan itu dan membiarkan implikasinya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang sederhana dan bermartabat. “Aku” dan enklitik “-Ku” digunakan sebagai ujaran langsung Allah. Ungkapan yang sulit tidak diperinci melebihi bukti leksikal, dan alternatif penting dicatat dalam catatan kaki.
