id: PSA.50.2
reference: Psalms 50:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/צִּיּ֥וֹן מִכְלַל יֹ֗פִי אֱלֹהִ֥ים הוֹפִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/002.yaml
  text: From Zion[a], the perfection of beauty, God shines forth.
translation:
  language: id
  text: Dari Sion, puncak keindahan, Allah tampil bersinar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dari Sion, puncak keindahan, Allah telah tampil bersinar”; atau “Dari Sion, dalam keindahan yang sempurna, Allah tampil bersinar.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִ/צִּיּוֹן
  choice: Dari Sion
  rationale: Preposisi מִן menunjukkan sumber atau asal; “dari Sion” merupakan padanan Indonesia yang alami dan tepat.
- source_word: מִכְלַל יֹפִי
  choice: puncak keindahan
  rationale: Ungkapan konstruksi ini menyatakan kelengkapan atau perwujudan tertinggi dari keindahan. “Puncak keindahan” puitis, jelas, dan secara alami menerangkan Sion.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Kata ini bersifat tunggal dalam konteks karena diikuti verba tunggal; padanan baku Alkitab bahasa Indonesia adalah “Allah”.
- source_word: הוֹפִיעַ
  choice: tampil bersinar
  rationale: Bentuk Hifil dari יפע dapat berarti tampil atau menyatakan diri dengan cahaya dan kemegahan. “Tampil bersinar” mempertahankan unsur penampakan sekaligus citra sinarnya; bentuk perfektif Ibrani dapat pula dipahami sebagai tindakan yang telah terjadi.
theological_decisions:
- issue: Hubungan frasa “puncak keindahan” dengan Sion atau Allah
  choice: Frasa itu diperlakukan sebagai aposisi yang menerangkan Sion.
  alternative: Frasa itu dapat dibaca secara adverbial sebagai cara Allah tampil, yakni “dalam keindahan yang sempurna”, atau sebagai gambaran yang lebih langsung tentang Allah.
  rationale: Urutan sintaksis Ibrani paling wajar menempatkan מִכְלַל יֹפִי sebagai aposisi bagi Sion, tetapi kemungkinan lain dipertahankan dalam catatan kaki.
- issue: Aspek waktu הוֹפִיעַ
  choice: Diterjemahkan dengan kala kini puitis, “tampil bersinar”.
  alternative: “telah tampil bersinar” atau “telah menampakkan diri dalam kemegahan”.
  rationale: Perfek Ibrani memungkinkan pembacaan lampau/perfektif, sedangkan kala kini puitis menyampaikan adegan secara hidup tanpa meniadakan alternatif tersebut.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. “Puncak keindahan” dipilih agar ungkapan Ibrani terdengar alami bagi pembaca umum, sementara “tampil bersinar” mempertahankan perpaduan makna penampakan dan pancaran cahaya.
