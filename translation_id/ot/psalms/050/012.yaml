id: PSA.50.12
reference: Psalms 50:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם אֶ֭רְעַב לֹא אֹ֣מַר לָ֑/ךְ כִּי לִ֥/י תֵ֝בֵ֗ל וּ/מְלֹאָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: id
  text: Sekiranya Aku lapar, tidak akan Kukatakan kepadamu, sebab dunia beserta segala isinya adalah milik-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: dunia dan kepenuhannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: Sekiranya Aku lapar
  rationale: אִם dengan bentuk imperfek memperkenalkan keadaan hipotetis. “Sekiranya” menyampaikan nuansa pengandaian retoris secara alami dan bermartabat tanpa menyatakan bahwa Allah benar-benar lapar.
- source_word: לֹא אֹמַר לָךְ
  choice: tidak akan Kukatakan kepadamu
  rationale: אמר secara dasar berarti “mengatakan”; bentuk ini dalam rangkaian syarat menyatakan akibat hipotetis. Susunan tersebut alami dalam bahasa Indonesia dan mempertahankan bentuk langsung teks Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: כִּי di sini memperkenalkan alasan bagi pernyataan sebelumnya.
- source_word: לִי
  choice: adalah milik-Ku
  rationale: Frasa berpreposisi ini menyatakan kepemilikan. Bentuk predikatif “adalah milik-Ku” jelas dan wajar dalam bahasa Indonesia.
- source_word: תֵבֵל
  choice: dunia
  rationale: תֵבֵל menunjuk pada dunia, khususnya dunia yang dihuni atau tertata. “Dunia” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: וּמְלֹאָהּ
  choice: beserta segala isinya
  rationale: Secara harfiah ungkapan ini berarti “dan kepenuhannya,” yakni segala yang memenuhi atau terkandung di dalam dunia. “Beserta segala isinya” mengungkapkan maksud idiom Ibrani dengan jelas.
theological_decisions:
- issue: Kemandirian Allah dalam konteks persembahan korban
  choice: Ayat diterjemahkan sebagai pengandaian retoris yang menegaskan bahwa Allah tidak bergantung pada manusia untuk menyediakan makanan bagi-Nya.
  alternative: Jika Aku lapar, Aku tidak akan mengatakannya kepadamu.
  rationale: Konteks menolak anggapan bahwa korban diperlukan untuk memenuhi kebutuhan Allah. “Sekiranya” mempertahankan sifat hipotetis pernyataan itu tanpa menambahkan istilah teologis yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Ungkapan “segala isinya” dipilih agar citra Ibrani מְלֹאָהּ dapat dipahami pembaca umum, sementara bentuk harfiahnya dicatat dalam catatan kaki.
