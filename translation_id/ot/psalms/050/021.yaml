reference: Psalms 50:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: id
  text: Hal-hal ini kaulakukan, dan Aku tetap diam. Engkau menyangka bahwa Aku benar-benar sama seperti engkau.[a] Aku akan menegur engkau dan memaparkan perkara itu di depan matamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahwa Aku akan menjadi seperti engkau.” Susunan bahasa Ibrani memungkinkan anggapan yang keliru itu diungkapkan dengan sedikit nuansa futuris atau modal.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “menyusunnya di depan matamu.” Kata kerja Ibrani dapat berarti “menata”, “menyusun”, atau “memaparkan”, sedangkan objeknya tidak disebutkan secara tersurat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: Hal-hal ini kaulakukan
  rationale: Bentuk penunjuk jamak merujuk kembali kepada pelanggaran-pelanggaran yang baru disebutkan. “Hal-hal ini” mempertahankan daya rujuk tersebut dalam bahasa Indonesia yang alami.
- source_word: וְהֶחֱרַשְׁתִּי
  choice: dan Aku tetap diam
  rationale: Bentuk perfektif orang pertama tunggal dari חרשׁ menyatakan bahwa Allah tidak segera menanggapi perbuatan itu. “Tetap diam” menyampaikan keberlangsungan sikap diam tanpa menafsirkannya sebagai persetujuan.
- source_word: דִּמִּיתָ
  choice: Engkau menyangka
  rationale: Dalam konteks ini דמה menunjuk pada anggapan atau perkiraan dalam pikiran. “Menyangka” secara alami mengisyaratkan bahwa anggapan tersebut keliru.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: bahwa Aku benar-benar sama seperti engkau
  rationale: Rangkaian infinitif dan imperfek menekankan isi anggapan yang salah. “Benar-benar sama” mempertahankan penekanannya, sedangkan catatan kaki menjaga kemungkinan nuansa modal atau futuris.
- source_word: אוֹכִיחֲךָ
  choice: Aku akan menegur engkau
  rationale: Bentuk Hifil dari יכח dalam konteks dakwaan moral dapat berarti menegur, membuktikan kesalahan, atau menggugat. “Menegur” jelas dan berbobot tanpa mempersempitnya menjadi istilah hukum teknis.
- source_word: וְאֶעֶרְכָה
  choice: dan memaparkan perkara itu
  rationale: ערך pada dasarnya berarti menata atau menyusun. Dalam konteks teguran, objek yang tidak dinyatakan paling wajar dipahami sebagai perkara atau dakwaan yang dipaparkan secara teratur; catatan kaki mempertahankan keliteralan dan ketidakpastian objeknya.
- source_word: לְעֵינֶיךָ
  choice: di depan matamu
  rationale: Ungkapan ini dipertahankan secara konkret dan idiomatis untuk menyatakan bahwa perkara tersebut akan ditunjukkan secara terbuka dan tak terbantahkan kepada orang yang ditegur.
theological_decisions:
- issue: Sikap diam Allah dan teguran-Nya
  choice: Sikap diam Allah dinyatakan tanpa disebut sebagai persetujuan, lalu diikuti teguran dan pemaparan perkara.
  alternative: Bagian akhir dapat diterjemahkan lebih netral, “Aku akan menegur engkau dan menyusunnya di depan matamu.”
  rationale: Konteksnya bersifat dakwaan moral, tetapi terjemahan tidak secara eksplisit menambahkan bahwa sikap diam itu adalah kesabaran atau penangguhan hukuman. Dengan demikian, hubungan antara sikap diam dan teguran tetap dapat dipahami dari teks tanpa dipaksakan secara doktrinal.
- issue: Anggapan bahwa Allah sama dengan pelaku
  choice: “Aku benar-benar sama seperti engkau” mempertahankan penekanan pada kesamaan yang dibayangkan.
  alternative: “Aku akan menjadi seperti engkau” mempertahankan nuansa modal atau futuris dari אֶהְיֶה.
  rationale: Susunan Ibrani memungkinkan isi anggapan diungkapkan sebagai keadaan atau kemungkinan. Teks utama memakai ungkapan Indonesia yang paling alami, sementara catatan kaki mempertahankan alternatif yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” dipakai untuk mempertahankan nada langsung dan serius; “Aku” memakai huruf kapital karena pembicara adalah Allah. Diksi hukum tidak dibuat terlalu teknis agar ketegangan antara teguran moral dan gambaran pengadilan tetap terjaga.
