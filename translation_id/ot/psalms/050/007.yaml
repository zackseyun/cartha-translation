lexical_decisions:
- source_word: שִׁמְעָה
  choice: Dengarlah
  rationale: Bentuk imperatif ini menyerukan pendengaran yang sungguh-sungguh. “Dengarlah” mempertahankan nada khidmat, perjanjian, dan pengadilan.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Nomina dengan sufiks orang pertama tunggal ini merupakan sebutan relasional dalam konteks perjanjian. “Umat-Ku” alami dan lazim dalam bahasa Indonesia.
- source_word: וַאֲדַבֵּרָה
  choice: dan Aku akan berbicara
  rationale: Bentuk kohortatif orang pertama sesudah imperatif menyatakan kehendak atau tindakan yang segera menyusul. Ungkapan ini jelas dan tetap mempertahankan ketegasan penutur.
- source_word: יִשְׂרָאֵל
  choice: hai Israel
  rationale: Nama diri dipertahankan, sedangkan “hai” menandai sapaan langsung secara alami dan khidmat.
- source_word: וְאָעִידָה בָּךְ
  choice: Aku akan memberi kesaksian terhadapmu
  rationale: Bentuk Hifil dari עוד di sini memiliki daya hukum atau yudisial. “Memberi kesaksian terhadapmu” mempertahankan citra persidangan tanpa mempersempitnya sekadar menjadi peringatan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, maknanya tunggal di sini dan menunjuk kepada Sang Penutur. “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruksi dengan sufiks orang kedua tunggal ini mengungkapkan hubungan perjanjian secara langsung.
- source_word: אָנֹכִי
  choice: Akulah
  rationale: Pronomina mandiri ini memberi penekanan pada identitas Sang Penutur. Partikel “-lah” secara alami menyampaikan penekanan tersebut dalam klausa nominal bahasa Indonesia.
theological_decisions:
- issue: Identifikasi diri ilahi אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  choice: Akulah Allah, Allahmu
  alternative: Allah, Allahmu, itulah Aku
  rationale: Teks Ibrani merupakan klausa nominal dengan pronomina yang ditekankan. “Akulah Allah, Allahmu” mempertahankan penegasan identitas sekaligus tuntutan relasi perjanjian tanpa menambahkan rumusan teologis lain.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Sapaan “hai” mempertahankan bentuk vokatif, kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia, dan istilah hukum dipertahankan karena penting bagi gambaran sidang dalam konteks mazmur.
