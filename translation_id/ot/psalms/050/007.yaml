base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
translation:
  language: id
  text: 'Dengarlah, hai umat-Ku, dan Aku akan berbicara; hai Israel, Aku akan bersaksi melawanmu[a]: Akulah Allah, Allahmu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan menjadi saksi terhadapmu.” Kata kerja Ibrani ini memiliki nuansa kesaksian hukum.
