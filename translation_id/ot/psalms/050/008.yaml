  text: לֹ֣א עַל זְ֭בָחֶי/ךָ אוֹכִיחֶ֑/ךָ וְ/עוֹלֹתֶ֖י/ךָ לְ/נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/008.yaml
  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: id
  text: Bukan karena kurban-kurbanmu Aku menegur engkau,[a] dan kurban-kurban bakaranmu senantiasa ada di hadapan-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bukan mengenai kurban-kurbanmu Aku menegur engkau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא עַל
  choice: Bukan karena
  rationale: Dalam kaitannya dengan verba 'menegur', frasa ini menyatakan dasar atau alasan teguran. Susunan 'Bukan karena ... Aku menegur' alami dalam bahasa Indonesia dan mempertahankan fokus Ibrani.
- source_word: זְבָחֶיךָ
  choice: kurban-kurbanmu
  rationale: זֶבַח merupakan istilah umum bagi kurban, sering kali kurban hewan; 'kurban-kurbanmu' mempertahankan cakupan umum tanpa mempersempit jenisnya.
- source_word: אוֹכִיחֶךָ
  choice: Aku menegur engkau
  rationale: Bentuk Hifil dari יכח di sini menyatakan teguran atau celaan, bukan semata-mata dakwaan hukum. 'Menegur' jelas dan sesuai dengan sapaan ilahi.
- source_word: וְעוֹלֹתֶיךָ
  choice: dan kurban-kurban bakaranmu
  rationale: עוֹלָה adalah istilah teknis bagi kurban yang dibakar seluruhnya. 'Kurban bakaran' merupakan padanan ringkas dan lazim.
- source_word: לְנֶגְדִּי
  choice: di hadapan-Ku
  rationale: Frasa ini menunjukkan keberadaan dalam pandangan atau kehadiran Allah. 'Di hadapan-Ku' alami sekaligus mempertahankan nuansa relasional dan peribadatan.
- source_word: תָמִיד
  choice: senantiasa
  rationale: Kata ini menyatakan keberlangsungan atau keteraturan yang terus-menerus; 'senantiasa' sesuai dengan register mazmur yang bermartabat.
theological_decisions:
- issue: Makna ayat dalam hubungannya dengan sistem kurban Israel
  choice: Ayat ini menyangkal bahwa Allah menegur umat karena kekurangan kurban.
  alternative: Ayat ini menolak semua kurban sebagai sesuatu yang pada hakikatnya tidak sah.
  rationale: Klausa kedua menyatakan bahwa kurban bakaran mereka senantiasa ada di hadapan Allah. Jadi, yang dipersoalkan bukan tidak adanya ritual, melainkan perkara yang lebih mendalam dan dijelaskan dalam konteks berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Inversi ringan 'Bukan karena ... Aku menegur' mempertahankan penekanan teks Ibrani. Bentuk 'engkau' dipakai untuk sapaan tunggal, sedangkan kapitalisasi pronomina ilahi mengikuti konvensi penerbitan Alkitab Indonesia.
