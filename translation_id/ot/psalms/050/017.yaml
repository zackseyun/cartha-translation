id: PSA.50.17
reference: Psalms 50:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֭/אַתָּה שָׂנֵ֣אתָ מוּסָ֑ר וַ/תַּשְׁלֵ֖ךְ דְּבָרַ֣/י אַחֲרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/017.yaml
  text: For you hate discipline[b][a], and you cast my words behind you.
translation:
  language: id
  text: Sebab[a] engkau membenci didikan[b] dan mencampakkan kata-kata-Ku ke belakangmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Namun engkau membenci didikan.” Kata penghubung Ibrani dapat dipahami sebagai penjelasan lanjutan atau sebagai pertentangan.
    reason: lexical_alternative
  - marker: b
    text: “Didikan” juga dapat diterjemahkan “pengajaran,” “koreksi,” atau “teguran.” Kata Ibrani musar mencakup pengajaran yang bersifat memperbaiki dan membentuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Sebab engkau
  rationale: Kata ganti orang kedua dinyatakan secara tegas, sedangkan וְ dapat menghubungkan tuduhan ini dengan ayat sebelumnya secara menjelaskan atau mempertentangkan. “Sebab engkau” mengalir alami dalam konteks, sementara kemungkinan adversatif dipertahankan dalam catatan kaki.
- source_word: שָׂנֵאתָ
  choice: membenci
  rationale: Bentuk perfektum Qal orang kedua tunggal maskulin menyatakan sikap yang mencirikan orang yang ditegur; bentuk kini bahasa Indonesia paling alami untuk tuduhan ini.
- source_word: מוּסָר
  choice: didikan
  rationale: Kata ini mencakup pengajaran yang membentuk melalui teguran dan koreksi. “Didikan” mempertahankan cakupan moral-formatifnya tanpa membatasinya hanya pada hukuman.
- source_word: וַתַּשְׁלֵךְ
  choice: mencampakkan
  rationale: Pilihan ini mempertahankan gambaran konkret tindakan melempar atau membuang sekaligus menyampaikan penolakan yang tersirat dalam konteks.
- source_word: דְּבָרַי
  choice: kata-kata-Ku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal diterjemahkan langsung dan alami, tanpa mempersempitnya menjadi perintah atau pengajaran saja.
- source_word: אַחֲרֶיךָ
  choice: ke belakangmu
  rationale: 'Terjemahan ini mempertahankan metafora Ibrani secara langsung: kata-kata Allah dicampakkan ke belakang, yakni disingkirkan dan diabaikan.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mencampakkan ... ke belakangmu” mempertahankan citra puitis sumber, sedangkan “kata-kata-Ku” lebih wajar dalam pemakaian modern daripada penggandaan “perkataan-perkataan-Ku”.
