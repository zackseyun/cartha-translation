  text: בִּֽינוּ נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ פֶּן אֶ֝טְרֹ֗ף וְ/אֵ֣ין מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: id
  text: Camkanlah ini, hai orang-orang yang melupakan Allah, supaya jangan Aku mencabik-cabik kamu tanpa ada yang menyelamatkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “supaya jangan Aku mencabik, dan tidak ada yang menyelamatkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּֽינוּ נָ֣א זֹ֭את
  choice: Camkanlah ini
  rationale: Bentuk imperatif jamak dari בין menyerukan pengertian dan perhatian yang sungguh-sungguh; partikel נָא menambah desakan. 'Camkanlah' menyampaikan keduanya secara alami dan khidmat tanpa menambahkan objek tafsiran.
- source_word: שֹׁכְחֵ֣י אֱל֑וֹהַּ
  choice: hai orang-orang yang melupakan Allah
  rationale: Partisipel ini dipakai secara vokatif dan menggambarkan mereka berdasarkan sikap yang terus mencirikan mereka. 'Melupakan Allah' mempertahankan ungkapan sumber tanpa mengubahnya menjadi sekadar kelupaan sesaat.
- source_word: פֶּן
  choice: supaya jangan
  rationale: Partikel ini memperkenalkan akibat negatif yang diperingatkan. 'Supaya jangan' alami dalam bahasa Indonesia dan tetap mempertahankan hubungan peringatan, bukan menyatakannya sebagai kepastian tanpa syarat.
- source_word: אֶ֝טְרֹ֗ף
  choice: Aku mencabik-cabik kamu
  rationale: Kata טרף menggambarkan tindakan mencabik seperti pemangsa. Objek 'kamu' tersirat oleh sapaan sebelumnya dan perlu dinyatakan agar kalimat Indonesia jelas; metafora penghakiman yang keras tetap dipertahankan.
- source_word: וְ/אֵ֣ין מַצִּֽיל
  choice: tanpa ada yang menyelamatkan
  rationale: Negasi eksistensial dengan partisipel Hifil menyatakan tidak adanya seorang penyelamat atau pelepas. Susunan ini ringkas, alami, dan tidak mempersempit maknanya pada jenis pertolongan tertentu.
theological_decisions:
- issue: Gambaran penghakiman ilahi dalam אֶטְרֹף
  choice: 'Mempertahankan metafora pemangsa secara langsung: ''Aku mencabik-cabik kamu.'''
  alternative: Melunakkan menjadi 'Aku membinasakan kamu' atau 'Aku menerkam kamu'.
  rationale: Bahasa Ibrani sengaja memakai gambaran mencabik mangsa yang keras. Mempertahankannya menjaga bobot ancaman dan ketegangan teologis teks tanpa melunakkan penghakiman Allah.
- issue: Hubungan sintaksis וְאֵין מַצִּיל
  choice: 'Menghubungkannya dengan ancaman sebagai keadaan yang menyertainya: ''tanpa ada yang menyelamatkan.'''
  alternative: 'Terjemahan lebih harfiah: ''dan tidak ada yang menyelamatkan.'''
  rationale: Kedua bentuk menyampaikan ketiadaan penyelamat. 'Tanpa ada' lebih alami dalam bahasa Indonesia, sedangkan catatan kaki menjaga bentuk koordinatif Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan langsung. 'Camkanlah' dipilih untuk menggabungkan seruan memahami dan desakan נָא; 'hai' mempertahankan fungsi sapaan tanpa terdengar terlalu sehari-hari. Huruf kapital pada 'Aku' menandai bahwa penuturnya adalah Allah menurut konteks mazmur.
