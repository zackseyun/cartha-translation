  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה דִּבֶּ֥ר וַ/יִּקְרָא אָ֑רֶץ מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: id
  text: Mazmur Asaf. Yang Perkasa,[a] Allah, Yahweh, telah berfirman dan memanggil bumi, dari terbitnya matahari sampai terbenamnya matahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah, Allah, Yahweh.” Sebagian orang memahami sebutan-sebutan ilahi pada awal kalimat ini secara berbeda, termasuk “Allah segala allah, Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku dan alami dalam bahasa Indonesia untuk judul jenis nyanyian ini.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Dalam judul mazmur, ל dapat menunjukkan kepengarangan, kepemilikan, peruntukan, atau keterkaitan; bentuk ringkas “Mazmur Asaf” mempertahankan ketidakpastian hubungan itu secara wajar.
- source_word: אֵל
  choice: Yang Mahakuasa
  rationale: Membedakannya dari אֱלֹהִים dan mempertahankan daya retoris rangkaian tiga sebutan ilahi, tanpa melebur semuanya menjadi “Allah”.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Nama ilahi serta verba tunggal menunjukkan bahwa yang dimaksud ialah Allah Israel, bukan para allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasi nama diri ilahi mempertahankan perbedaannya dari gelar “Tuhan”.
- source_word: דִּבֶּר
  choice: telah berfirman
  rationale: Bentuk perfektif menyatakan tindakan yang sudah dilakukan; “berfirman” sesuai dengan register khidmat untuk perkataan ilahi.
- source_word: וַיִּקְרָא
  choice: dan memanggil
  rationale: Menyampaikan tindakan lanjutan sesudah berfirman, sekaligus membiarkan nuansa memanggil atau menghimpun tanpa mempersempitnya menjadi tafsiran yudisial tertentu.
- source_word: אָרֶץ
  choice: bumi
  rationale: Cakupan dari terbit sampai terbenamnya matahari bersifat menyeluruh, sehingga “bumi” lebih tepat daripada “negeri”.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: dari tempat matahari terbit
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan citra matahari terbit, bukan sekadar arah timur.
- source_word: עַד מְבֹאוֹ
  choice: sampai tempatnya terbenam
  rationale: Sufiksnya mengacu kepada matahari; frasa ini mempertahankan gambaran puitis dan merisme yang menyatakan seluruh bentangan bumi.
theological_decisions:
- issue: Pemaknaan rangkaian אֵל אֱלֹהִים יְהוָה
  choice: Yang Mahakuasa, Allah, Yahweh
  alternative: Allah, Allah, Yahweh; atau Allah segala allah, Yahweh
  rationale: Teks Ibrani menempatkan tiga sebutan ilahi secara berurutan. Terjemahan utama membedakan אֵל dari אֱלֹהִים untuk menjaga bobot retorisnya, tetapi catatan kaki mempertahankan kemungkinan bahwa dua kata pertama dipahami secara berbeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan puitis dipertahankan tanpa menjadi kaku; koma sesudah penanda catatan kaki membantu memperjelas bahwa tiga sebutan ilahi merujuk kepada satu pribadi.
