  terminology: “Yahweh” secara tepat mempertahankan nama ilahi יהוה, dan “Allah” tepat untuk אֱלֹהִים dalam konteks tunggal ini. “Yang Perkasa” lebih dekat dengan אֵל daripada “Yang Mahakuasa,” tanpa memaksakan konotasi gelar tertentu.
