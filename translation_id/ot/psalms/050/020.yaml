  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau” mempertahankan sapaan tunggal langsung dalam teguran ilahi. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
