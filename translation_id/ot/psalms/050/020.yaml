  text: You sit and speak against your brother[a]; you slander your own mother's son.
translation:
  language: id
  text: Engkau duduk dan berbicara menentang saudaramu; engkau melontarkan cela terhadap anak ibumu sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “engkau memberikan cela terhadap anak ibumu.” Kata Ibrani דֹּפִי dapat berarti cela, tuduhan, atau ucapan yang merusak nama baik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּשֵׁב
  choice: Engkau duduk
  rationale: Mempertahankan gambaran konkret dan daya retoris verba ישׁב dalam bentuk imperfek, yang di sini melukiskan tindakan yang biasa atau disengaja.
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: berbicara menentang saudaramu
  rationale: Dalam konteks ucapan bermusuhan, ב dengan דבר dapat menyatakan sasaran yang dilawan; pilihan ini juga selaras dengan baris paralelnya.
- source_word: בְּבֶן אִמְּךָ
  choice: anak ibumu sendiri
  rationale: Ungkapan ini dipertahankan secara dekat untuk menonjolkan ikatan keluarga yang sangat dekat, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: תִּתֶּן דֹּפִי
  choice: memfitnah
  rationale: Secara harfiah berarti 'memberikan/menimpakan דֹּפִי', tetapi sebagai idiom menunjuk pada peletakan cela, tuduhan, atau ucapan yang merusak nama baik; 'memfitnah' menyampaikan fungsi ungkapan itu secara wajar.
theological_decisions: []
