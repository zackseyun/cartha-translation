  text: יִקְרָ֣א אֶל הַ/שָּׁמַ֣יִם מֵ/עָ֑ל וְ/אֶל הָ֝/אָ֗רֶץ לָ/דִ֥ין עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: id
  text: 'Ia memanggil[a] langit di atas dan bumi untuk menghakimi umat-Nya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia memanggil langit di atas dan bumi untuk hadir.” Kata kerjanya dapat menyatakan pemanggilan untuk hadir, terutama dalam suasana pengadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָא
  choice: Ia memanggil
  rationale: Bentuk Qal imperfek orang ketiga maskulin tunggal dari קרא dapat berarti “memanggil” atau “memanggil untuk hadir”. “Memanggil” alami dalam bahasa Indonesia dan tetap membuka nuansa pemanggilan resmi dalam konteks pengadilan.
- source_word: אֶל הַשָּׁמַיִם
  choice: langit
  rationale: Preposisi אֶל menandai sasaran panggilan. שׁמים berbentuk jamak dalam bahasa Ibrani, tetapi padanan idiomatis bahasa Indonesia adalah “langit”; dalam pasangan dengan bumi, cakupannya bersifat kosmis.
- source_word: מֵעָל
  choice: di atas
  rationale: Ungkapan ini berfungsi secara adverbial untuk menunjukkan kedudukan langit di atas, tanpa menekankan gerak atau asal sebagaimana “dari atas”.
- source_word: וְאֶל הָאָרֶץ
  choice: dan bumi
  rationale: Konjungsi dan preposisi menghubungkan sasaran kedua. Dalam paralel dengan langit, הָאָרֶץ berarti bumi, bukan sebidang tanah atau negeri.
- source_word: לָדִין
  choice: untuk menghakimi
  rationale: Infinitif construct dengan ל menyatakan tujuan. “Untuk menghakimi” menyampaikan hubungan tujuan dengan ringkas dan alami.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עם dengan sufiks posesif menyatakan umat milik-Nya dalam konteks relasional-perjanjian. “Umat-Nya” lebih tepat daripada “bangsa-Nya” dan mengikuti ejaan hormat baku untuk rujukan kepada Allah.
theological_decisions:
- issue: Identitas subjek tersirat
  choice: Memakai pronomina “Ia” tanpa menambahkan nama Allah
  alternative: Menuliskan “Allah memanggil”
  rationale: Kata kerja Ibrani memiliki subjek maskulin tunggal yang tersirat, sedangkan nama Allah tidak disebutkan secara eksplisit dalam ayat ini. “Ia” mempertahankan alur wacana dan tidak menambahkan unsur yang hanya diperoleh dari konteks.
- issue: Peran langit dan bumi dalam adegan pengadilan
  choice: Mempertahankan ungkapan umum “memanggil”, dengan alternatif “memanggil ... untuk hadir” dalam catatan kaki
  alternative: Menerjemahkan langsung sebagai pemanggilan saksi-saksi pengadilan
  rationale: Konteks mendukung nuansa pemanggilan resmi, tetapi ayat ini tidak secara eksplisit menyebut langit dan bumi sebagai saksi. Terjemahan utama mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap jelas bagi pembaca umum. “Ia” menjaga subjek tersirat, sedangkan “umat-Nya” mempertahankan nuansa relasional. Tanda titik dua dipertahankan karena ayat ini mengantar pada kelanjutan tuturan.
