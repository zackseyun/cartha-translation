  text: אִסְפוּ לִ֥/י חֲסִידָ֑/י כֹּרְתֵ֖י בְרִיתִ֣/י עֲלֵי זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/005.yaml
  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: id
  text: “Kumpulkanlah kepada-Ku orang-orang-Ku yang setia, yang mengikat perjanjian-Ku melalui kurban.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang memotong perjanjian-Ku di atas/dengan kurban.”'
    reason: Menampilkan idiom Ibrani כרת ברית serta mempertahankan ketaksaan preposisi על, sementara teks utama menerjemahkannya secara idiomatis.
lexical_decisions:
- source_word: אִסְפוּ
  choice: Kumpulkanlah
  rationale: Bentuk imperatif jamak dari אסף. Pilihan ini mempertahankan seruan langsung kepada para pelaksana yang harus menghimpun umat.
- source_word: לִי
  choice: kepada-Ku
  rationale: Dalam konteks sidang ilahi, ל dengan akhiran orang pertama tunggal paling wajar menyatakan bahwa mereka dikumpulkan menghadap Allah.
- source_word: חֲסִידָי
  choice: orang-orang-Ku yang setia
  rationale: חסיד menunjuk kepada orang yang memiliki kesetiaan dan kesalehan dalam hubungan perjanjian. Ungkapan ini alami dalam bahasa Indonesia dan menghindari asosiasi teknis yang dapat timbul dari istilah seperti 'orang kudus'.
- source_word: כֹּרְתֵי בְרִיתִי
  choice: yang mengikat perjanjian dengan-Ku
  rationale: Secara harfiah ungkapan Ibrani berarti 'yang memotong perjanjian-Ku'. 'Mengikat perjanjian dengan-Ku' menyampaikan idiom tersebut secara wajar sekaligus mempertahankan relasi antara Allah dan umat-Nya; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: עֲלֵי זָבַח
  choice: melalui kurban
  rationale: על menghubungkan pengikatan perjanjian itu dengan ritus kurban. 'Melalui kurban' menyatakan hubungan sarana atau ritual tanpa memaksakan gambaran spasial yang kurang jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חֲסִידָי dalam konteks perjanjian
  choice: orang-orang-Ku yang setia
  alternative: orang-orang kudus-Ku; orang-orang saleh-Ku
  rationale: Pilihan ini menonjolkan kesetiaan relasional kepada Allah dalam perjanjian tanpa memasukkan pengertian gerejawi yang berkembang kemudian.
- issue: Pelaku dan arah frasa כֹּרְתֵי בְרִיתִי
  choice: yang mengikat perjanjian dengan-Ku
  alternative: yang mengadakan perjanjian-Ku; yang memotong perjanjian-Ku
  rationale: Genitif dengan akhiran orang pertama dapat diterjemahkan secara idiomatis sebagai perjanjian yang diikat dengan Allah. Rumusan ini tidak menentukan secara berlebihan pihak yang memprakarsai perjanjian, sedangkan bentuk harfiahnya tetap tersedia dalam catatan kaki.
- issue: Hubungan kurban dengan perjanjian
  choice: melalui kurban
  alternative: di atas kurban; dengan kurban
  rationale: Teks mengaitkan pengikatan perjanjian dengan kurban, tetapi tidak menguraikan mekanisme teologisnya. 'Melalui' mempertahankan kaitan ritual tersebut tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran hormat pada 'kepada-Ku' dan 'orang-orang-Ku' mengikuti kebiasaan penulisan rujukan kepada Allah. Istilah 'kurban' dipilih sebagai bentuk baku untuk persembahan sembelihan.
