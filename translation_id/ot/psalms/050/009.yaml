  text: Aku tidak akan mengambil sapi jantan dari rumahmu, ataupun kambing-kambing jantan dari kandang-kandangmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אֶקַּח
  choice: Aku tidak akan mengambil
  rationale: Bentuk imperfek Qal orang pertama tunggal dengan לֹא menyatakan tindakan yang dinafikan dalam deklarasi ilahi; bentuk futuratif ini alami dalam bahasa Indonesia.
- source_word: מִבֵּיתְךָ
  choice: dari rumahmu
  rationale: בַּיִת secara konkret berarti rumah dan di sini menunjuk pada tempat atau milik orang yang beribadah, bukan anggota keluarganya.
- source_word: פָר
  choice: sapi jantan
  rationale: פָר menunjuk pada sapi jantan, khususnya dalam konteks korban; pilihan ini tepat dan mudah dipahami.
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: dari kandang-kandangmu
  rationale: מִכְלָאָה adalah tempat berpagar untuk ternak. Bentuk jamak sumber dipertahankan secara wajar.
- source_word: עַתּוּדִים
  choice: kambing jantan
  rationale: עַתּוּדִים secara khusus menunjuk pada kambing-kambing jantan; makna gendernya dipertahankan langsung dalam teks.
