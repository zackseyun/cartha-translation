  variant: modern standard Indonesian
source:
  edition: WLC
  text: זְבַ֣ח לֵ/אלֹהִ֣ים תּוֹדָ֑ה וְ/שַׁלֵּ֖ם לְ/עֶלְי֣וֹן נְדָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/014.yaml
  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: id
  text: Persembahkanlah kurban ucapan syukur kepada Allah[a], dan tunaikanlah nazarmu kepada Yang Mahatinggi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Persembahkanlah ucapan syukur kepada Allah sebagai kurban”; kata Ibrani תּוֹדָה dapat berarti “ucapan syukur” atau “persembahan syukur” dalam konteks pengurbanan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבַח
  choice: Persembahkanlah
  rationale: Bentuk imperatif dari זבח menyuruh orang mempersembahkan kurban. “Persembahkanlah” alami dalam bahasa Indonesia dan mempertahankan konteks ibadah serta pengurbanan.
- source_word: לֵאלֹהִים
  choice: kepada Allah
  rationale: Preposisi ל menandai Allah sebagai penerima persembahan. “Kepada Allah” merupakan ungkapan Indonesia yang langsung dan wajar.
- source_word: תּוֹדָה
  choice: kurban ucapan syukur
  rationale: תּוֹדָה dapat berarti ucapan syukur atau persembahan syukur. Pilihan ini mempertahankan baik dimensi pengurbanan maupun ungkapan syukur tanpa terlalu membatasi maknanya pada satu kategori ritual teknis.
- source_word: וְשַׁלֵּם
  choice: dan tunaikanlah
  rationale: Imperatif dari שלם di sini berarti membayar atau memenuhi kewajiban nazar. “Tunaikanlah” adalah pasangan kata yang alami untuk “nazar” dan mempertahankan kekuatan kewajibannya.
- source_word: לְעֶלְיוֹן
  choice: kepada Yang Mahatinggi
  rationale: עֶלְיוֹן adalah gelar ilahi yang berarti “Yang Mahatinggi”. Gelar ini diterjemahkan, bukan ditransliterasikan, agar maknanya langsung dipahami.
- source_word: נְדָרֶיךָ
  choice: nazarmu
  rationale: Bentuk jamak dengan akhiran orang kedua tunggal maskulin. Dalam bahasa Indonesia, “nazarmu” secara alami dapat mencakup satu atau beberapa nazar dan menyampaikan kewajiban pribadi orang yang disapa.
theological_decisions:
- issue: Ungkapan kultis yang menggabungkan זבח dan תּוֹדָה
  choice: kurban ucapan syukur
  alternative: “ucapan syukur” atau “persembahan syukur”
  rationale: Bahasa Ibrani dapat menunjuk pada ucapan syukur yang dipersembahkan sebagai kurban atau pada suatu persembahan syukur. Teks utama mempertahankan kedua dimensi itu, sedangkan catatan kaki menyatakan alternatif leksikalnya.
- issue: Gelar ilahi עֶלְיוֹן
  choice: Yang Mahatinggi
  alternative: “Elyon”
  rationale: Kata ini berfungsi sebagai gelar ilahi yang bermakna jelas dan karena itu diterjemahkan agar dapat dipahami pembaca tanpa menjadikannya seolah-olah nama diri yang tidak diterjemahkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif “persembahkanlah” dan “tunaikanlah” mempertahankan nada seruan langsung; “nazar” dipilih sebagai istilah umum yang tepat untuk janji khidmat kepada Allah.
