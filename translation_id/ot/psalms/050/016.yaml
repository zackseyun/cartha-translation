  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: id
  text: Namun, kepada orang fasik Allah berfirman, “Apa hakmu untuk menuturkan ketetapan-ketetapan-Ku dan menyebut perjanjian-Ku dengan mulutmu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Secara harfiah: “mengangkat perjanjian-Ku di atas mulutmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: Namun, kepada orang fasik
  rationale: Kata penghubung וְ menyatakan kontras dengan konteks sebelumnya, sedangkan רָשָׁע menunjuk pada kategori moral. “Namun, kepada orang fasik” menyampaikan pertentangan itu secara alami tanpa membatasinya pada makna forensik “orang bersalah”.
- source_word: אָמַר אֱלֹהִים
  choice: Allah berfirman
  rationale: Bentuk qatal dalam pengantar tuturan langsung puitis dapat menyajikan ucapan ilahi yang sedang dihadirkan. “Berfirman” merupakan ungkapan Indonesia yang wajar dan bermartabat untuk tuturan Allah.
- source_word: מַה לְּךָ
  choice: Apa hakmu
  rationale: Idiom ini merupakan tantangan terhadap kelayakan atau dasar seseorang untuk bertindak, bukan sekadar pertanyaan informatif. “Apa hakmu” menyampaikan teguran tersebut secara ringkas.
- source_word: לְסַפֵּר
  choice: menuturkan
  rationale: Dalam konteks ini סָפַר berarti melafalkan atau menyampaikan ketetapan Allah. “Menuturkan” mempertahankan nuansa pengucapan yang disengaja dengan ragam bahasa yang alami dan bermartabat.
- source_word: חֻקָּי
  choice: ketetapan-ketetapan-Ku
  rationale: חֹק menunjuk pada ketentuan atau peraturan yang ditetapkan. “Ketetapan” mempertahankan nuansa hukum-perjanjian dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: וַתִּשָּׂא
  choice: dan membawa
  rationale: נָשָׂא secara dasar berarti mengangkat, membawa, atau menanggung. “Membawa” mempertahankan citra Ibrani dalam ungkapan mengenai perjanjian yang berada di bibir, tanpa mengubahnya menjadi sekadar “menyebut”.
- source_word: בְרִיתִי
  choice: perjanjian-Ku
  rationale: בְּרִית adalah istilah utama bagi ikatan perjanjian dan diterjemahkan dengan padanan baku “perjanjian” untuk menjaga bobot teologis dan kanonisnya.
- source_word: עֲלֵי פִיךָ
  choice: di bibirmu
  rationale: Secara harfiah frasa ini berarti “di atas mulutmu”. “Di bibirmu” mempertahankan citra pengucapan sambil terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat teguran kepada orang fasik
  choice: Ayat ini mempertanyakan hak atau kelayakan moral orang fasik untuk menuturkan ketetapan dan perjanjian Allah.
  alternative: Ayat ini merupakan larangan mutlak bagi orang fasik untuk menyebut perjanjian Allah dalam keadaan apa pun.
  rationale: Idiom מַה לְּךָ menantang dasar atau kelayakan orang tersebut. Dalam konteks mazmur, tekanannya terletak pada kemunafikan dan ketidakselarasan hidup dengan perjanjian, bukan pada pelarangan setiap penyebutan tentang Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan orang kedua tunggal dipertahankan melalui bentuk “-mu”. Paralelisme kedua tindakan dijaga, sementara citra konkret “membawa ... di bibirmu” dipertahankan agar ketegangan puitis teks Ibrani tidak hilang.
