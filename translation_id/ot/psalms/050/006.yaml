lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: memberitakan
  rationale: Bentuk Hifil dari נגד menyatakan tindakan membuat sesuatu diketahui secara terbuka; “memberitakan” alami dalam bahasa Indonesia dan mempertahankan nuansa proklamasi.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Bentuk jamak Ibrani ini lazim berfungsi sebagai nomina kolektif. “Langit” merupakan padanan Indonesia yang alami dan tetap sesuai dengan gaya puitis.
- source_word: צִדְקוֹ
  choice: kebenaran-Nya
  rationale: צדק dapat menunjuk pada kebenaran moral maupun keadilan. “Kebenaran-Nya” mempertahankan cakupan makna yang lebih luas, sedangkan “keadilan-Nya” dicatat sebagai alternatif kontekstual.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” menyampaikan hubungan kausal itu dengan ringkas dan bermartabat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, predikat dan pronomina menunjukkan bahwa maknanya tunggal.
- source_word: שֹׁפֵט הוּא
  choice: sendirilah hakim
  rationale: Partisipel שֹׁפֵט berfungsi sebagai predikat nominal, sedangkan הוּא memberi penegasan. Konstruksi “sendirilah hakim” mempertahankan keduanya secara alami tanpa menambahkan kata sandang tertentu.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis ini tidak pasti; transliterasi tradisional menghindari kepastian semu.
theological_decisions:
- issue: Makna צדק dalam kaitannya dengan penghakiman ilahi
  choice: kebenaran-Nya
  alternative: keadilan-Nya
  rationale: Ayat ini menghubungkan peran Allah sebagai hakim dengan kesaksian langit. “Kebenaran-Nya” mempertahankan dimensi moral yang luas, tetapi “keadilan-Nya” tetap mungkin karena konteks penghakiman.
translation_notes:
  register: Bahasa Indonesia baku, puitis, ringkas, dan mudah dipahami. Partikel “-lah” mempertahankan penekanan pronomina Ibrani; “hakim” ditulis sebagai nomina umum, bukan gelar yang ditambahkan oleh penerjemah.
