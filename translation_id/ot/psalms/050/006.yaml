  text: And the heavens declare his righteousness[a], for God himself is judge. Selah
translation:
  language: id
  text: Dan langit memberitakan kebenaran-Nya[a], sebab Allah sendiri adalah hakim. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan-Nya.”
