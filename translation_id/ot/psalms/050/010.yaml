  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי לִ֥/י כָל חַיְת/וֹ יָ֑עַר בְּ֝הֵמ֗וֹת בְּ/הַרְרֵי אָֽלֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: id
  text: Sebab setiap binatang liar di hutan adalah milik-Ku, demikian juga ternak di seribu bukit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “binatang-binatang di seribu gunung.” Kata Ibrani yang diterjemahkan “ternak” dapat berarti hewan besar atau binatang secara umum, dan kata yang diterjemahkan “bukit” juga dapat berarti “gunung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan alasan bagi pernyataan sebelumnya; “sebab” alami dan jelas dalam konteks.
- source_word: לִי
  choice: adalah milik-Ku
  rationale: Frasa berpreposisi ini menyatakan kepemilikan Allah. Bentuk predikatif tersebut wajar dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: כָל חַיְתוֹ יָעַר
  choice: setiap binatang liar di hutan
  rationale: כָל di depan nomina kolektif tunggal memiliki daya distributif, sedangkan חַיְתוֹ יָעַר menunjuk pada satwa yang hidup di hutan.
- source_word: בְּהֵמוֹת
  choice: ternak
  rationale: Istilah ini dapat menunjuk pada hewan besar atau binatang secara umum, tetapi dalam kesejajaran dengan binatang liar di hutan, “ternak” secara alami menyampaikan kategori hewan yang melengkapi gambaran tersebut tanpa membatasinya secara zoologis hanya pada sapi.
- source_word: בְּהַרְרֵי אָלֶף
  choice: di seribu bukit
  rationale: Terjemahan ini mempertahankan angka Ibrani dan gambaran puitis tempat hewan-hewan itu berada. “Bukit” menghasilkan ungkapan Indonesia yang alami, sementara “gunung” tetap merupakan kemungkinan leksikal.
theological_decisions:
- issue: Cakupan gambaran kepemilikan ilahi
  choice: Ayat ini menyatakan kepemilikan Allah atas binatang liar dan ternak melalui gambaran puitis yang luas.
  alternative: Membacanya sebagai jumlah harfiah ternak yang berada tepat di seribu bukit.
  rationale: Angka “seribu” dan pasangan binatang hutan dengan ternak menyampaikan kelimpahan serta cakupan kepemilikan Allah. Terjemahan mempertahankan gambaran sumber tanpa mengubah angka itu menjadi parafrasa seperti “tak terhitung”.
- issue: Hubungan antara kedua bagian baris
  choice: Kata “demikian juga” memperjelas bahwa kepemilikan yang dinyatakan pada bagian pertama berlaku pula pada ternak di seribu bukit.
  alternative: Mempertahankan penjajaran tanpa penghubung, yang dapat dibaca sebagai aposisi.
  rationale: Bahasa Ibrani dapat menjajarkan kedua frasa secara puitis dengan predikat kepemilikan tersirat pada bagian kedua. Dalam bahasa Indonesia, “demikian juga” membuat hubungan itu jelas tanpa menambahkan klaim baru.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Huruf kapital pada “-Ku” mengikuti konvensi umum untuk rujukan kepada Allah. Struktur dibuat mudah dipahami dalam pembacaan lisan tanpa menghilangkan kesejajaran puisi Ibrani.
