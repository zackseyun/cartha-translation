  text: הַֽ֭/אוֹכַל בְּשַׂ֣ר אַבִּירִ֑ים וְ/דַ֖ם עַתּוּדִ֣ים אֶשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/013.yaml
  text: Do I eat the flesh of bulls[a], or drink the blood of goats?
translation:
  language: id
  text: Apakah Aku memakan daging lembu jantan atau meminum darah kambing jantan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹכַל
  choice: Apakah Aku memakan
  rationale: Partikel tanya הֲ dengan bentuk imperfek orang pertama tunggal dari אכל membentuk pertanyaan retoris. Pola “Apakah Aku memakan” menyampaikan bentuk itu secara wajar dalam bahasa Indonesia.
- source_word: בְּשַׂר אַבִּירִים
  choice: daging lembu jantan
  rationale: בָּשָׂר berarti “daging,” sedangkan אַבִּירִים secara harfiah dapat berarti “yang kuat-kuat,” tetapi dalam konteks kurban menunjuk kepada ternak jantan yang kuat, yakni lembu jantan.
- source_word: וְדַם
  choice: atau ... darah
  rationale: וְ pada dasarnya berarti “dan,” tetapi dalam satu pertanyaan retoris dengan dua tindakan sejajar, “atau” merupakan penghubung bahasa Indonesia yang alami dan mempertahankan maksud hubungan antarklausa.
- source_word: עַתּוּדִים
  choice: kambing jantan
  rationale: עַתּוּדִים secara khusus menunjuk kepada kambing jantan. Unsur jenis kelamin dinyatakan langsung agar ketepatan leksikal terjaga tanpa memerlukan catatan kaki.
- source_word: אֶשְׁתֶּה
  choice: meminum
  rationale: Bentuk imperfek orang pertama tunggal dari שתה melanjutkan pertanyaan retoris pada klausa pertama. “Meminum” sejajar secara alami dengan “memakan.”
theological_decisions:
- issue: Bahasa antropomorfis mengenai Allah dan persembahan kurban
  choice: Mempertahankan pertanyaan retoris konkret tentang memakan daging dan meminum darah
  alternative: Memparafrasakannya sebagai “Apakah Aku membutuhkan kurbanmu?”
  rationale: Ayat ini menyangkal bahwa Allah bergantung pada kurban sebagai makanan atau minuman. Gambaran konkret dalam bahasa Ibrani dipertahankan agar daya retoris dan ketegangan teologis teks tidak dilunakkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “Aku” memakai huruf kapital karena penuturnya adalah Allah. Istilah “lembu jantan” dan “kambing jantan” dipilih agar konkret, mudah dipahami, dan tepat dalam konteks kurban.
