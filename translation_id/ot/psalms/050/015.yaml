  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: id
  text: Berserulah kepada-Ku pada waktu kesesakan; Aku akan menyelamatkanmu, dan engkau akan menghormati Aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memuliakan Aku.” Kata kerja Ibrani ini dapat berarti “menghormati” atau “memuliakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: Berserulah kepada-Ku
  rationale: Bentuk imperatif קרא dengan sufiks objek di sini berarti memanggil atau berseru kepada Allah untuk meminta pertolongan. “Berserulah kepada-Ku” alami dalam bahasa Indonesia dan mempertahankan daya seru teks.
- source_word: בְּיוֹם צָרָה
  choice: pada waktu kesesakan
  rationale: Ungkapan Ibrani harfiah “pada hari kesesakan” berfungsi sebagai keterangan waktu. “Pada waktu kesesakan” menyampaikan maknanya secara wajar dalam bahasa Indonesia tanpa membatasi kesesakan pada satu hari kalender.
- source_word: אֲחַלֶּצְךָ
  choice: Aku akan melepaskanmu
  rationale: Bentuk Piel dari חלץ berarti melepaskan atau menyelamatkan seseorang dari bahaya. “Melepaskanmu” ringkas, puitis, dan mempertahankan gambaran pembebasan.
- source_word: וּתְכַבְּדֵנִי
  choice: dan engkau akan menghormati Aku
  rationale: Bentuk Piel dari כבד dapat berarti menghormati atau memuliakan. “Menghormati Aku” mempertahankan arti luas pemberian hormat kepada Allah sebagai tanggapan atas pembebasan, sedangkan alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Tanggapan manusia sesudah pembebasan ilahi
  choice: dan engkau akan menghormati Aku
  alternative: dan engkau akan memuliakan Aku
  rationale: Teks menyatakan bahwa orang yang dilepaskan akan memberikan kepada Allah kehormatan yang patut. “Menghormati” mempertahankan cakupan makna כבד tanpa mempersempitnya hanya pada ungkapan pujian atau ibadah, sementara “memuliakan” tetap merupakan terjemahan yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Engkau” dipakai untuk mempertahankan register mazmur yang khidmat; rujukan kepada Allah ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
