translation:
  language: id
  text: Jika engkau melihat seorang pencuri, engkau menyukainya[a], dan bagianmu adalah bersama para pezina.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “engkau menyetujuinya” atau “engkau menerimanya dengan senang hati.” Kata kerja Ibrani dapat menyatakan rasa senang, penerimaan, atau persetujuan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagianmu bersama para pezina,” suatu ungkapan yang menyiratkan bahwa engkau berpihak kepada mereka atau turut berada dalam pergaulan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan bentuk syarat atau penggambaran kasus dalam bahasa Ibrani; dalam konteks ini dipakai secara retoris untuk menuduh perilaku yang lazim dilakukan.
- source_word: רָאִיתָ
  choice: engkau melihat
  rationale: Bentuk Qal perfek orang kedua tunggal maskulin. Dalam konstruksi bersyarat bahasa Indonesia, bentuk kini yang tidak bertanda waktu terdengar alami dan tetap mencakup tindakan yang digambarkan.
- source_word: גַנָּב
  choice: seorang pencuri
  rationale: Padanan langsung dan alami untuk orang yang mencuri.
- source_word: וַתִּרֶץ
  choice: engkau berkenan
  rationale: Kata kerja רצה dapat menyatakan rasa senang, penerimaan, atau persetujuan. 'Berkenan' mempertahankan inti makna itu tanpa membatasi maksudnya hanya pada pergaulan atau kerja sama.
- source_word: עִמּוֹ
  choice: kepadanya
  rationale: Dalam gabungan dengan 'berkenan', bahasa Indonesia secara alami memakai 'kepada'; hubungan dengan pencuri tetap dinyatakan tanpa menambahkan gagasan yang tidak eksplisit.
- source_word: מְנָאֲפִים
  choice: para pezina
  rationale: Partisip yang dipakai sebagai nomina menunjuk kepada orang-orang yang melakukan zina; 'para pezina' ringkas dan tepat.
- source_word: חֶלְקֶךָ
  choice: bagianmu
  rationale: Mempertahankan metafora Ibrani tentang bagian atau jatah, yang dalam konteks menyiratkan keberpihakan atau keterlibatan dengan kelompok tersebut.
