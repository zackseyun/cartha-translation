  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: id
  text: Orang yang mempersembahkan kurban syukur memuliakan Aku,[a] dan kepada orang yang menata jalan hidupnya[b] akan Kuperlihatkan keselamatan Allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban ucapan syukur.” Kata Ibrani תּוֹדָה menunjuk pada ucapan syukur yang dinyatakan dalam bentuk persembahan korban.
    reason: lexical_alternative
  - marker: b
    text: Atau “menata jalannya,” “menata perilakunya,” atau “mempersiapkan jalan.” Ungkapan Ibraninya ringkas dan dapat dipahami sebagai menata hidup dengan benar.
    reason: alternative_reading
  - marker: c
    text: Atau “pembebasan Allah” atau “kemenangan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ תּוֹדָה
  choice: orang yang mempersembahkan kurban syukur
  rationale: Partisipel Qal dipahami secara substantival. Dalam konteks ibadah korban, תּוֹדָה menunjuk pada ucapan syukur yang diwujudkan sebagai persembahan; “kurban syukur” mempertahankan unsur korban dan syukur secara alami dalam bahasa Indonesia.
- source_word: יְכַבְּדָנְנִי
  choice: memuliakan Aku
  rationale: Bentuk Piel dari כבד berarti menghormati atau memuliakan. “Memuliakan Aku” merupakan ungkapan yang wajar dan khidmat dalam konteks hubungan manusia dengan Allah.
- source_word: וְשָׂם דֶּרֶךְ
  choice: dan kepada orang yang menata jalan hidupnya
  rationale: Ungkapan Ibrani ini ringkas dan dapat berarti menata jalan atau perilaku. “Jalan hidupnya” mempertahankan metafora דֶּרֶךְ sambil menjelaskan bahwa yang dimaksud kemungkinan besar adalah cara hidup.
- source_word: אַרְאֶנּוּ
  choice: akan Kuperlihatkan
  rationale: Bentuk Hifil dari ראה berarti menyebabkan seseorang melihat atau memperlihatkan. Akhiran orang ketiga tunggal merujuk kepada orang yang menata jalan hidupnya.
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: keselamatan dari Allah
  rationale: יֵשַׁע dapat berarti keselamatan, pembebasan, atau kemenangan. Dalam ungkapan ini, genitif sumber—“keselamatan dari Allah”—terdengar alami dan menghindari kesan bahwa Allah adalah pihak yang diselamatkan.
theological_decisions:
- issue: Makna וְשָׂם דֶּרֶךְ
  choice: Janji ditujukan kepada orang yang menata jalan hidupnya.
  alternative: “orang yang mempersiapkan jalan” atau, secara lebih harfiah, “orang yang menata jalan”
  rationale: Konstruksi Ibrani bersifat padat dan agak ambigu. Terjemahan utama menyampaikan pembacaan etis yang paling mungkin tanpa menjadikannya klaim teologis yang lebih kuat daripada teks.
- issue: Hubungan יֵשַׁע dengan אֱלֹהִים
  choice: keselamatan dari Allah
  alternative: “keselamatan Allah,” “pembebasan Allah,” atau “kemenangan Allah”
  rationale: Ungkapan tersebut dapat dipahami sebagai keselamatan yang Allah berikan. Pilihan “dari Allah” mengungkapkan sumbernya dengan jelas, sedangkan catatan kaki mempertahankan keluasan makna יֵשַׁע.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Kapitalisasi “Aku” mengikuti rujukan kepada Allah. Metafora “jalan” dipertahankan sebagai “jalan hidup” agar dapat dipahami pembaca umum tanpa menghapus ambiguitas sumber; alternatifnya dicatat dalam catatan kaki.
