reference: Psalms 50:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יָ֤בֹ֥א אֱלֹהֵ֗י/נוּ וְֽ/אַל יֶ֫חֱרַ֥שׁ אֵשׁ לְ/פָנָ֥י/ו תֹּאכֵ֑ל וּ֝/סְבִיבָ֗י/ו נִשְׂעֲרָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: id
  text: Allah kita datang dan tidak berdiam diri.[a] Api melalap di hadapan-Nya, dan di sekeliling-Nya badai mengamuk dengan dahsyat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah kita akan datang dan tidak akan berdiam diri.” Bentuk-bentuk imperfek Ibrani dalam konteks puitis ini juga dapat dipahami dengan makna mendatang. Ungkapan kedua secara lebih harfiah juga dapat dibaca, “janganlah Ia berdiam diri.”
    reason: alternative_reading
  - marker: b
    text: Atau, “keadaan di sekeliling-Nya sangat bergelora,” atau, “di sekeliling-Nya badai berkecamuk hebat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: datang
  rationale: Bentuk imperfek Qal dapat menyatakan tindakan kini secara puitis atau tindakan mendatang. Bentuk kini mempertahankan daya hadir dan kejelasan gambaran teofani dalam mazmur.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Menerjemahkan nomina dengan sufiks orang pertama jamak secara langsung dan alami dalam bahasa Indonesia.
- source_word: וְאַל יֶחֱרַשׁ
  choice: dan tidak berdiam diri
  rationale: Dalam rangkaian puitis ini, אַל dengan bentuk imperfek dipahami sebagai penegasan bahwa kedatangan Allah tidak berlangsung dalam keheningan. Ungkapan 'berdiam diri' mempertahankan makna חרשׁ tanpa mempersempitnya menjadi sekadar tidak berbicara.
- source_word: אֵשׁ לְפָנָיו תֹאכֵל
  choice: Api melalap di hadapan-Nya
  rationale: Kata אכל dengan api sebagai subjek berarti melalap atau menghanguskan. 'Di hadapan-Nya' mempertahankan gambaran spasial dari לְפָנָיו.
- source_word: וּסְבִיבָיו
  choice: dan di sekeliling-Nya
  rationale: Padanan langsung dan wajar yang mempertahankan posisi badai mengitari Allah.
- source_word: נִשְׂעֲרָה מְאֹד
  choice: badai mengamuk dengan dahsyat
  rationale: Bentuk Nifal dari שער menggambarkan keadaan yang bergelora atau mengamuk seperti badai, sedangkan מְאֹד menguatkan intensitasnya. Bahasa Indonesia memerlukan subjek eksplisit, sehingga 'badai' menyatakan gambaran yang tersirat tanpa mengubah adegan.
theological_decisions:
- issue: Ayat menggambarkan penampakan Allah dalam penghakiman tanpa menetapkan kerangka kristologis atau denominasi tertentu.
  choice: Mempertahankan gambaran langsung tentang Allah yang datang, tidak berdiam diri, disertai api dan badai.
  alternative: Menyatakannya secara eksplisit sebagai nubuat mengenai penghakiman terakhir.
  rationale: Teks Ibrani sendiri menampilkan teofani dengan api dan badai, tetapi tidak menjelaskan identitas atau tahap penghakiman lebih lanjut; terjemahan tidak boleh menambahkan penafsiran doktrinal tersebut.
- issue: Daya waktu bentuk imperfek dan nuansa אַל יֶחֱרַשׁ.
  choice: 'Menggunakan bentuk kini yang hidup: ''datang dan tidak berdiam diri'', dengan alternatif mendatang dalam catatan kaki.'
  alternative: Allah kita akan datang dan tidak akan berdiam diri; atau, Allah kita datang—janganlah Ia berdiam diri.
  rationale: Puisi Ibrani memungkinkan daya kini yang dramatis maupun daya mendatang. Pembacaan sebagai penegasan paling sesuai dengan alur gambaran, tetapi ambiguitas bentuknya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat ringkas untuk mempertahankan gerak puitis dan kedahsyatan teofani. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan penulisan religius Indonesia.
