base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: id
  text: Mazmur Asaf. Allah, Allah, Yahweh,[a] telah berfirman dan memanggil bumi dari tempat matahari terbit sampai tempat matahari terbenam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah, Allah, TUHAN”; sebagian orang memahami rangkaian gelar ilahi pada awal ayat ini secara berbeda, termasuk, “Allah segala allah, Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Mazmur Asaf
  rationale: Ungkapan judul Ibrani dipertahankan secara ringkas dan alami; preposisi לְ dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan, sehingga rumusan ini tidak mempersempit maknanya.
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Allah, Allah, Yahweh
  rationale: Mencerminkan urutan tiga sebutan ilahi dalam teks Masoret tanpa secara diam-diam menyelesaikan hubungan sintaksis yang memang dapat dipahami dengan beberapa cara.
- source_word: דִּבֶּר וַיִּקְרָא אָרֶץ
  choice: telah berfirman dan memanggil bumi
  rationale: Menerjemahkan kedua verba secara langsung; 'berfirman' sesuai dengan register tindakan ilahi, sedangkan 'memanggil bumi' mempertahankan bumi sebagai objek panggilan.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: dari tempat matahari terbit sampai ke tempatnya terbenam
  rationale: Ungkapan idiomatis ini menyatakan bentangan seluruh bumi dari timur hingga barat, tetapi citra mataharinya dipertahankan.
theological_decisions:
- issue: Hubungan antara אֵל, אֱלֹהִים, dan יהוה
  choice: Allah, Allah, Yahweh
  alternative: Allah segala allah, Yahweh; atau Allah, Allah, TUHAN
  rationale: Bentuk Ibrani memungkinkan lebih dari satu analisis. Teks utama mengikuti pembacaan koordinatif yang dekat dengan urutan sumber, sementara catatan kaki menjaga alternatif genitif dan padanan gelar tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'. Pengulangan 'Allah, Allah' sengaja dipertahankan karena mencerminkan bentuk sumber dan ambiguitasnya dijelaskan dalam catatan kaki.
