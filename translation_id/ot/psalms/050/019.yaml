base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/019.yaml
  text: You let your mouth loose for evil[b][a], and your tongue frames deceit.
translation:
  language: id
  text: 'Mulutmu kaulepaskan untuk kejahatan,[a]

    dan lidahmu kautautkan pada tipu daya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaubiarkan mulutmu bebas untuk melakukan kejahatan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “lidahmu merangkai tipu daya.” Secara harfiah, kata kerjanya menggambarkan tindakan menautkan atau melekatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיךָ
  choice: mulutmu
  rationale: Mempertahankan gambaran anggota tubuh yang secara idiomatis menunjuk pada ucapan, sekaligus menjaga kesejajaran dengan 'lidahmu'.
- source_word: שָׁלַחְתָּ
  choice: kaulepaskan
  rationale: Kata kerja ini secara dasar berarti 'mengirim' atau 'mengulurkan'; bersama 'mulutmu', bentuk ini menggambarkan pemberian kebebasan kepada ucapan untuk bergerak menuju kejahatan.
- source_word: בְרָעָה
  choice: untuk kejahatan
  rationale: Preposisi ב dapat menyatakan arah atau ranah. 'Untuk kejahatan' mempertahankan bobot moral istilah רָעָה tanpa membatasinya hanya pada akibat yang merugikan.
- source_word: וּלְשׁוֹנְךָ
  choice: dan lidahmu
  rationale: Terjemahan harfiah ini mempertahankan citraan puitis dan kesejajarannya dengan 'mulutmu'.
- source_word: תַּצְמִיד
  choice: kautautkan pada
  rationale: Bentuk Hifil dari צמד menyatakan tindakan menyebabkan sesuatu bergabung, melekat, atau berpasangan. 'Kautautkan pada' mempertahankan citra keterikatan aktif tanpa mengubahnya menjadi sekadar tindakan menyusun kata.
- source_word: מִרְמָה
  choice: tipu daya
  rationale: '''Tipu daya'' adalah padanan Indonesia yang luas dan wajar untuk kebohongan atau kelicikan dalam konteks ucapan.'
