  text: עַמְּ/ךָ֣ נְדָבֹת֮ בְּ/י֪וֹם חֵ֫ילֶ֥/ךָ בְּֽ/הַדְרֵי קֹ֭דֶשׁ מֵ/רֶ֣חֶם מִשְׁחָ֑ר לְ֝/ךָ֗ טַ֣ל יַלְדֻתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/003.yaml
  text: Your people will offer themselves freely on the day of your power[a], in holy splendor; from the womb of the dawn[c][b], to you belongs the dew of your youth.
translation:
  language: id
  text: Umatmu akan mempersembahkan diri dengan sukarela pada hari kuasamu[a], dalam semarak kekudusan[b]. Dari rahim fajar, milikmulah embun masa mudamu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada hari kekuatanmu” atau “pada hari bala tentaramu”. Kata Ibrani yang dipakai dapat berarti kuasa, kekuatan, atau kekuatan militer. Ungkapan sebelumnya secara harfiah berbunyi “umatmu adalah persembahan-persembahan sukarela”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam perhiasan kudus”, “dalam kemegahan kekudusan”, atau mungkin “dengan pakaian kudus”.
    reason: lexical_alternative
  - marker: c
    text: Baris terakhir ini sulit ditafsirkan. Mungkin maksudnya, “orang-orang mudamu bagimu bagaikan embun dari rahim fajar,” atau baris itu mungkin berbicara tentang kesegaran masa mudamu.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמְּךָ
  choice: umatmu
  rationale: עַם pada dasarnya berarti umat atau rakyat. Konteksnya mengandung nuansa peperangan, tetapi tidak mengharuskan arti yang lebih sempit seperti “pasukanmu”.
- source_word: נְדָבֹת
  choice: akan mempersembahkan diri dengan sukarela
  rationale: Kata benda jamak ini secara harfiah menunjuk pada persembahan sukarela. Ketika diterapkan secara predikatif kepada “umatmu”, ungkapan verbal ini menyampaikan bahwa mereka datang atau menyerahkan diri dengan rela.
- source_word: בְּיוֹם חֵילֶךָ
  choice: pada hari kuasamu
  rationale: בְּיוֹם adalah ungkapan waktu, sedangkan חַיִל dapat berarti kekuatan, kuasa, bala tentara, atau daya tempur. “Kuasa” mempertahankan cakupan yang luas tanpa meniadakan nuansa militer konteksnya.
- source_word: בְּהַדְרֵי קֹדֶשׁ
  choice: dalam semarak kekudusan
  rationale: Frasa puitis ini dapat menggambarkan kemegahan yang kudus, perhiasan suci, atau pakaian kudus. Pilihan ini menjaga citra keindahan dan kekudusan tanpa mempersempitnya menjadi pakaian tertentu.
- source_word: מֵרֶחֶם מִשְׁחָר
  choice: dari rahim fajar
  rationale: Terjemahan ini mempertahankan metafora asal-usul dari “rahim” serta gambaran fajar yang melahirkan embun.
- source_word: לְךָ טַל יַלְדֻתֶיךָ
  choice: milikmulah embun masa mudamu
  rationale: Bahasa Ibrani sangat ringkas. “Milikmulah” menyatakan hubungan kepunyaan yang tersirat dalam לְךָ, sementara “masa mudamu” mempertahankan ketaksaan יַלְדֻתֶיךָ antara kemudaan, daya muda, dan kelompok orang muda.
theological_decisions:
- issue: Makna klausa terakhir tentang “embun masa mudamu”
  choice: Mempertahankan gambaran puitis tentang embun dan masa muda tanpa menjelaskan siapa atau apa yang dimaksud secara pasti.
  alternative: Klausa itu dapat menggambarkan orang-orang muda sang raja yang segar atau banyak seperti embun; dapat pula dipahami sebagai kesegaran dan daya masa mudanya, dan secara tradisional pernah dihubungkan dengan gambaran kelahiran mesianik.
  rationale: Teks Ibrani padat dan terkenal sulit. Terjemahan utama tidak memasukkan kesimpulan kristologis atau dogmatis tertentu, tetapi juga tidak menutup kemungkinan pembacaan mesianik dalam konteks mazmur secara keseluruhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis dan bermartabat. Susunan “milikmulah” sengaja dipertahankan untuk meniru keringkasan dan penekanan puisi Ibrani, sedangkan catatan kaki menjelaskan pilihan-pilihan leksikal utama tanpa menyelesaikan ketaksaan teks secara sepihak.
