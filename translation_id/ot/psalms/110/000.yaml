  yaml_path: translation/ot/psalms/110/000.yaml
  text: Of David[a]. A psalm. Yahweh says to my Lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: id
  text: 'Mazmur Daud.[a]


    Demikianlah firman TUHAN kepada tuanku:[b]

    “Duduklah di sebelah kanan-Ku

    sampai Aku menjadikan musuh-musuhmu

    tumpuan kakimu.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur untuk Daud.” Ungkapan Ibrani dapat menunjukkan kepengarangan, peruntukan, atau keterkaitan dengan Daud.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai nama ilahi YHWH untuk “TUHAN”, tetapi adoni, “tuanku”, untuk pihak yang diajak bicara.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini juga dapat disampaikan secara lebih interpretatif sebagai “di bawah kakimu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  choice: Mazmur Daud
  rationale: Ungkapan judul ini paling alami dipahami sebagai mazmur yang dikaitkan dengan Daud, sambil mempertahankan kemungkinan lain dalam catatan kaki.
- source_word: נְאֻם
  choice: Demikianlah firman
  rationale: Kata ini memperkenalkan pernyataan atau sabda yang khidmat; pilihan ini lebih kuat daripada sekadar 'berkata' tanpa membuat gaya Indonesianya kaku.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Huruf kapital membedakan nama ilahi YHWH dari sebutan 'tuanku' yang menyusul, sesuai konvensi Alkitab bahasa Indonesia yang luas dikenal.
- source_word: לַאדֹנִי
  choice: kepada tuanku
  rationale: Bentuk adoni berarti 'tuanku' dan berbeda secara leksikal dari nama ilahi YHWH; huruf kecil mempertahankan perbedaan tersebut.
- source_word: שֵׁב לִימִינִי
  choice: Duduklah di sebelah kanan-Ku
  rationale: Menerjemahkan gambaran kedudukan di sisi kanan secara langsung dan alami.
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: tumpuan kakimu
  rationale: Mempertahankan metafora konkret 'tumpuan kaki' daripada menafsirkannya secara lebih bebas sebagai 'di bawah kakimu'.
theological_decisions:
- issue: Identitas pihak yang disebut 'tuanku'
  choice: Mempertahankan sebutan 'tuanku' tanpa menjelaskan identitasnya di dalam teks.
  alternative: Menuliskan 'Tuhanku' atau langsung mengidentifikasinya sebagai Mesias.
  rationale: Teks Ibrani membedakan YHWH dari adoni, tetapi tidak secara eksplisit memberi identitas lengkap kepada pihak kedua dalam ayat ini; terjemahan tidak boleh menutup ketegangan penafsirannya.
- issue: Hubungan kepengarangan dalam judul
  choice: Mazmur Daud, dengan catatan tentang kemungkinan makna lain.
  alternative: Mazmur karya Daud atau Mazmur untuk Daud.
  rationale: Preposisi le dalam judul mazmur dapat menunjukkan kepengarangan, keterkaitan, peruntukan, atau kumpulan; bentuk ringkas dalam teks dan catatan kaki menjaga ambiguitas yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan puitis dipertahankan tanpa memakai kosakata arkais. Kapitalisasi “TUHAN” dan “-Ku” mengikuti konvensi yang mudah dikenali, sedangkan “tuanku” tetap berhuruf kecil untuk mencerminkan perbedaan leksikal dalam bahasa Ibrani.
