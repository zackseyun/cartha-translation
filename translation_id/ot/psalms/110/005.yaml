id: PSA.110.5
reference: Psalms 110:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲדֹנָ֥/י עַל יְמִֽינְ/ךָ֑ מָחַ֖ץ בְּ/יוֹם אַפּ֣/וֹ מְלָכִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/005.yaml
  text: The Lord is at your right hand[a]; he will shatter kings on the day of his wrath.
translation:
  language: id
  text: Tuhan berada di sebelah kananmu[a]; Ia akan meremukkan raja-raja pada hari murka-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tuan di sebelah kananmu” dapat merujuk kepada raja/Mesias yang dibicarakan dalam mazmur ini; yang lain memahami “Tuhan” di sini sebagai Allah yang bertindak dalam penghakiman.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Bentuk ini dibaca ʾAdonai, bukan nama ilahi YHWH. “Tuhan” mempertahankan gelar tersebut tanpa secara eksplisit menentukan apakah yang dimaksud adalah Allah atau sosok penguasa yang disapa dalam mazmur ini.
- source_word: עַל יְמִינְךָ
  choice: di sebelah kananmu
  rationale: Ungkapan ini menyatakan posisi di sisi kanan. Bentuk Indonesia ini alami sekaligus mempertahankan gambaran konkret tentang kedudukan, dukungan, kehormatan, atau kuasa.
- source_word: מָחַץ
  choice: akan meremukkan
  rationale: Kata kerja ini berarti menghantam, meremukkan, atau menghancurkan. Bentuk perfektif Ibrani dapat dibaca sebagai tindakan yang sudah terjadi atau sebagai kepastian profetis; bentuk mendatang sesuai dengan rangkaian penghakiman dalam konteks ini.
- source_word: בְּיוֹם אַפּוֹ
  choice: pada hari murka-Nya
  rationale: Terjemahan ini mempertahankan ungkapan waktu “pada hari” dan mengungkapkan idiom אַף sebagai murka yang kuat dalam konteks penghakiman.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Kata benda jamak ini secara langsung menunjuk kepada para raja sebagai sasaran kekalahan dalam penghakiman.
theological_decisions:
- issue: Rujukan אֲדֹנָי dalam Mazmur 110:5
  choice: Menerjemahkannya secara netral sebagai “Tuhan” dan menjelaskan ambiguitasnya dalam catatan kaki.
  alternative: Memahaminya secara khusus sebagai Allah yang menghakimi, atau sebagai tuan/raja-Mesias di sebelah kanan pihak yang disapa.
  rationale: Teks memakai אֲדֹנָי, bukan YHWH, dan susunan mazmur memungkinkan lebih dari satu pemahaman mengenai subjek ayat ini. Terjemahan utama tidak memutuskan persoalan tersebut secara doktrinal.
- issue: Kala/aspek מָחַץ
  choice: “akan meremukkan”
  alternative: “telah meremukkan” atau “meremukkan”
  rationale: Perfektif Ibrani dapat menampilkan tindakan sebagai tuntas atau pasti. Dalam rangkaian penghakiman puitis ayat ini, bentuk mendatang alami dalam bahasa Indonesia, meskipun nuansa kepastian tindakan tetap penting.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ia” dan akhiran “-Nya” dikapitalisasi menurut kebiasaan penerbitan Alkitab Indonesia, tanpa dimaksudkan untuk meniadakan ambiguitas rujukan yang dijelaskan dalam catatan kaki.
