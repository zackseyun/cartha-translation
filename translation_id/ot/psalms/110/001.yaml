  yaml_path: translation/ot/psalms/110/001.yaml
  text: Of David[a]. A psalm. Yahweh says to my lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: id
  text: 'Dari Daud. Mazmur.


    Yahweh berfirman kepada tuanku,[a] “Duduklah di sebelah kanan-Ku sampai Aku menjadikan musuh-musuhmu tumpuan kakimu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani membedakan Yahweh, nama Allah, dari “tuanku,” sebuah gelar kehormatan. Gelar itu sendiri tidak secara eksplisit menyebut identitas sosok tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Tentang Daud
  rationale: Prefiks ל dalam judul mazmur dapat menyatakan kepengarangan, kepemilikan, peruntukan, atau hubungan. “Tentang Daud” mempertahankan sebagian keterbukaan itu tanpa memastikan bahwa Daud adalah penulisnya.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Padanan baku dan wajar dalam bahasa Indonesia untuk penanda jenis syair ini.
- source_word: נְאֻם
  choice: berfirman
  rationale: Kata ini memperkenalkan ucapan ilahi yang khidmat. “Berfirman” alami ketika subjeknya Yahweh dan lebih mencerminkan bobot formula tersebut daripada sekadar “berkata,” meskipun nuansa deklarasi resmi tetap dimungkinkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar, sehingga perbedaannya dari אֲדֹנִי terlihat jelas.
- source_word: לַאדֹנִי
  choice: kepada tuanku
  rationale: Bentuk אֲדֹנִי berarti “tuanku” atau “majikanku.” “Tuanku” mempertahankan sapaan kehormatan sekaligus membedakannya dari nama Yahweh.
- source_word: שֵׁב
  choice: Duduklah
  rationale: Bentuk imperatif diterjemahkan secara langsung dan alami; konteks di sebelah kanan memberi nuansa penobatan atau kedudukan terhormat.
- source_word: לִימִינִי
  choice: di sebelah kanan-Ku
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan citra kedudukan kehormatan di sisi kanan.
- source_word: עַד
  choice: sampai
  rationale: Penanda waktu ini mempertahankan arah tindakan menuju saat Yahweh menundukkan musuh-musuh sang tuan, tanpa menyimpulkan apa yang terjadi sesudahnya.
- source_word: אָשִׁית
  choice: Aku menjadikan
  rationale: Dalam konstruksi dengan “tumpuan kaki,” verba שׁית secara resultatif paling alami diterjemahkan “menjadikan,” bukan hanya “menaruh.”
- source_word: אֹיְבֶיךָ
  choice: musuh-musuhmu
  rationale: Padanan langsung bagi bentuk jamak dengan akhiran orang kedua tunggal maskulin.
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: tumpuan kakimu
  rationale: Ungkapan ringkas dan idiomatis dalam bahasa Indonesia yang mempertahankan gambaran kerajaan tentang musuh yang ditaklukkan, tanpa menambahkan kata “di bawah” yang tidak dinyatakan secara eksplisit oleh preposisi Ibrani.
theological_decisions:
- issue: Pembedaan antara יְהוָה dan אֲדֹנִי dalam ayat yang memiliki arti mesianik
  choice: “Yahweh berfirman kepada tuanku”
  alternative: “TUHAN berfirman kepada Tuhanku” atau “Yahweh berfirman kepada Tuhanku”
  rationale: Teks Ibrani membedakan nama ilahi Yahweh dari gelar kehormatan “tuanku.” Perbedaan itu harus tampak dalam terjemahan, khususnya karena ayat ini kemudian digunakan secara mesianik. Kapitalisasi “Tuanku” dapat memasukkan kesimpulan kristologis kemudian ke dalam bentuk teks Ibrani.
- issue: Identitas sosok yang disebut “tuanku”
  choice: Mempertahankan gelar umum “tuanku” tanpa mengidentifikasi sosok tersebut dalam teks utama
  alternative: Mengidentifikasinya secara tipografis atau eksplisit sebagai Mesias
  rationale: אֲדֹנִי adalah gelar kehormatan, bukan nama diri. Terjemahan mempertahankan ketegangan antara makna langsung bentuk Ibrani dan penggunaan mesianiknya dalam konteks kanonik.
- issue: Daya temporal עַד
  choice: “sampai”
  alternative: “hingga” atau ungkapan yang menyiratkan bahwa kedudukan itu berakhir sesudah musuh ditaklukkan
  rationale: “Sampai” menerjemahkan batas waktu yang disebutkan tanpa menyatakan bahwa duduk di sebelah kanan pasti berakhir setelah tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Nama “Yahweh” dipertahankan; “tuanku” ditulis dengan huruf kecil untuk tidak memasukkan penafsiran mesianik melalui kapitalisasi. Akhiran pronominal untuk Allah pada “kanan-Ku” memakai huruf kapital menurut kebiasaan ejaan religius Indonesia, sedangkan “-mu” yang mengacu kepada sosok kedua tetap huruf kecil.
