base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/002.yaml
  text: 'Yahweh sends forth from Zion the scepter of your strength: rule in the midst of your enemies[a][b][c].'
translation:
  language: id
  text: Yahweh mengirimkan dari Sion tongkat kekuasaanmu. Berkuasalah di tengah-tengah musuh-musuhmu!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה
  choice: tongkat kerajaan
  rationale: מַטֶּה dapat berarti tongkat, batang, atau tongkat kerajaan. Dalam mazmur kerajaan ini, “tongkat kerajaan” paling jelas menyampaikan lambang konkret kekuasaan raja.
- source_word: עֻזְּךָ
  choice: yang menyatakan kekuatanmu
  rationale: עֹז berarti kekuatan atau keperkasaan. Ungkapan ini mempertahankan gagasan bahwa tongkat kerajaan tersebut mencerminkan atau mewujudkan kekuatan orang yang disapa, sekaligus menghindari frasa Indonesia yang kaku “tongkat kekuatanmu”.
- source_word: יִשְׁלַח
  choice: akan mengulurkan
  rationale: Kata kerja שׁלח pada dasarnya berarti mengirim atau mengutus. Dalam konteks tongkat kerajaan yang bergerak keluar dari Sion, “mengulurkan” menyampaikan gambaran itu secara alami dalam bahasa Indonesia, meskipun merupakan terjemahan kontekstual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: מִצִּיּוֹן
  choice: dari Sion
  rationale: Terjemahan langsung untuk keterangan sumber atau tempat asal, dengan nama Sion dipertahankan.
- source_word: רְדֵה
  choice: Berkuasalah
  rationale: Bentuk imperatif dari רדה menyatakan tindakan memerintah atau menjalankan kekuasaan. “Berkuasalah” alami dan kuat dalam konteks kerajaan.
- source_word: בְּקֶרֶב
  choice: di tengah-tengah
  rationale: Frasa ini secara harfiah berarti “di tengah” dan mempertahankan gambaran bahwa sang raja berkuasa sementara dikelilingi para musuh.
- source_word: אֹיְבֶיךָ
  choice: musuh-musuhmu
  rationale: Menerjemahkan nomina jamak dengan sufiks orang kedua tunggal maskulin secara langsung dan alami.
theological_decisions:
- issue: Gambaran kerajaan dan mesianik dalam Mazmur 110
  choice: Mempertahankan bahasa kerajaan tanpa secara eksplisit mengidentifikasi tokoh yang disapa sebagai Mesias dalam teks ayat.
  alternative: Menjadikan rujukan mesianik eksplisit, atau mengaburkan gambaran penobatan dan pemerintahan raja.
  rationale: Teks Ibrani menggambarkan seorang penguasa yang menerima dukungan Yahweh dan diperintahkan untuk berkuasa. Terjemahan ini membiarkan makna kerajaan langsung dan pemaknaan mesianik yang lebih luas tetap terbuka tanpa memasukkan kesimpulan teologis ke dalam ayat.
- issue: Arah tindakan dalam יִשְׁלַח יְהוָה
  choice: Yahweh dipertahankan sebagai subjek yang mengulurkan tongkat kerajaan dari Sion.
  alternative: Membuat tongkat sebagai subjek atau menghilangkan pelaku ilahi melalui bentuk pasif.
  rationale: Susunan gramatikal Ibrani menyatakan bahwa Yahweh adalah pelaku, sementara tongkat kerajaan adalah objek yang dikirim atau diulurkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Urutan “Dari Sion” menonjolkan sumber tindakan sebagaimana dalam puisi Ibrani. “Tongkat kerajaan yang menyatakan kekuatanmu” dipilih untuk menjaga citra konkret dan hubungan dengan kekuatan sang raja tanpa menghasilkan konstruksi Indonesia yang terlalu kaku.
