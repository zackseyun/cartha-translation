source:
  edition: WLC
  text: נִשְׁבַּ֤ע יְהוָ֨ה וְ/לֹ֥א יִנָּחֵ֗ם אַתָּֽה כֹהֵ֥ן לְ/עוֹלָ֑ם עַל דִּ֝בְרָתִ֗י מַלְכִּי צֶֽדֶק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/004.yaml
  text: 'Yahweh has sworn and will not change his mind: “You are a priest forever after the manner of Melchizedek.”[a]'
translation:
  language: id
  text: 'Yahweh telah bersumpah dan tidak akan berubah pikiran-Nya: “Engkau adalah imam untuk selama-lamanya menurut pola Melkisedek.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “menurut firman-Ku, Melkisedek” atau “berdasarkan ketetapan-Ku, Melkisedek.” Frasa Ibraninya sulit dan juga dapat dipahami sebagai “menurut pola Melkisedek.”
    reason: Mempertahankan ketidakpastian sintaksis dan makna frasa עַל דִּבְרָתִי מַלְכִּי־צֶדֶק.
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: telah bersumpah
  rationale: Bentuk perfektif menyatakan sumpah ilahi yang sungguh-sungguh dan telah diucapkan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan kekuatan tindakan bersumpah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar, sehingga rujukan perjanjian dalam teks Ibrani tetap terlihat.
- source_word: וְלֹא יִנָּחֵם
  choice: dan tidak akan berubah pikiran-Nya
  rationale: Bentuk Nifal dari נחם di sini menyatakan bahwa Yahweh tidak akan menarik kembali atau menyesali sumpah-Nya. Ungkapan ini jelas dalam bahasa Indonesia modern tanpa menyiratkan pertobatan moral.
- source_word: כֹהֵן
  choice: imam
  rationale: Istilah ini menunjuk pada jabatan keimaman. Bahasa Indonesia tidak memakai kata sandang tak tentu, sehingga cukup diterjemahkan 'imam'.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Mengungkapkan keberlangsungan yang tidak berakhir dalam konteks sumpah ini dengan ungkapan Indonesia yang wajar dan khidmat.
- source_word: עַל דִּבְרָתִי
  choice: menurut pola
  rationale: Frasa Ibrani ini sulit dan dapat dipahami sebagai acuan kepada pola atau corak keimaman Melkisedek. Pilihan ini alami dalam bahasa Indonesia, sedangkan kemungkinan yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: מַלְכִּי־צֶדֶק
  choice: Melkisedek
  rationale: Nama diri ini ditransliterasikan memakai bentuk yang telah mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Makna frasa sulit עַל דִּבְרָתִי מַלְכִּי־צֶדֶק
  choice: menurut pola Melkisedek
  alternative: menurut firman-Ku, Melkisedek; berdasarkan ketetapan-Ku, Melkisedek
  rationale: Sintaksis frasa Ibrani ini tidak pasti. Teks utama menyampaikan pemahaman kuno bahwa Melkisedek menjadi pola keimaman, tetapi catatan kaki mempertahankan kemungkinan bahwa frasa tersebut merujuk pada firman atau ketetapan ilahi dan bahwa 'Melkisedek' merupakan sapaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan langsung 'Engkau' mempertahankan bentuk orang kedua tunggal. Akhiran hormat pada 'pikiran-Nya' memperjelas bahwa subjeknya Yahweh tanpa menambah penafsiran kristologis pada pihak yang disapa.
