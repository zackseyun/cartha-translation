  text: מִ֭/נַּחַל בַּ/דֶּ֣רֶךְ יִשְׁתֶּ֑ה עַל כֵּ֝֗ן יָרִ֥ים רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/007.yaml
  text: He will drink from the brook by the way[b][a]; therefore he will lift up his head.
translation:
  language: id
  text: Ia akan minum dari sungai kecil dalam perjalanan[a]; karena itu, ia akan mengangkat kepalanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aliran air” atau “wadi”. Kata Ibrani נחל dapat menunjuk pada sungai kecil, alur sungai, atau aliran air musiman.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “mengangkat kepalanya” dapat menyiratkan kekuatan yang pulih, keyakinan, martabat, atau ditinggikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנַּחַל
  choice: dari sungai kecil
  rationale: נחל dapat menunjuk pada sungai kecil, aliran air, palung sungai, atau aliran musiman. “Sungai kecil” mudah dipahami dan mempertahankan gambaran tentang air yang diminum dalam perjalanan.
- source_word: בַּדֶּרֶךְ
  choice: dalam perjalanan
  rationale: דרך berarti jalan atau perjalanan. Dalam konteks ini, “dalam perjalanan” secara alami menyampaikan bahwa tindakan minum itu terjadi ketika ia sedang menempuh perjalanan.
- source_word: יִשְׁתֶּה
  choice: ia akan minum
  rationale: Bentuk imperfek dapat menyatakan tindakan mendatang atau kebiasaan. Rangkaian tindakan dalam mazmur ini mendukung bentuk mendatang tanpa menutup sepenuhnya nuansa puitisnya.
- source_word: עַל־כֵּן
  choice: karena itu
  rationale: Ungkapan ini menandai akibat atau konsekuensi dan menghubungkan tindakan minum dengan tindakan mengangkat kepala.
- source_word: יָרִים רֹאשׁ
  choice: ia akan mengangkat kepalanya
  rationale: Terjemahan ini mempertahankan citra Ibrani yang dapat menyiratkan pulihnya kekuatan, keyakinan, kehormatan, atau peninggian, tanpa mempersempitnya menjadi satu tafsiran.
theological_decisions:
- issue: Acuan subjek maskulin tunggal dalam mazmur kerajaan ini
  choice: Memakai kata ganti tunggal “ia” tanpa menyebut identitas acuannya.
  alternative: Mengidentifikasinya secara eksplisit sebagai raja keturunan Daud, raja-imam, atau Mesias.
  rationale: Teks Ibrani memakai subjek maskulin tunggal yang tidak disebutkan namanya dalam ayat ini. Terjemahan tidak memasukkan identifikasi kristologis atau historis tertentu ke dalam teks, sehingga ketegangan dan keluasan pembacaan kanonik tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis yang ringkas. “Dalam perjalanan” dipilih agar alami bagi pembaca masa kini, sedangkan citra “mengangkat kepalanya” dipertahankan karena membawa beberapa kemungkinan makna yang sah.
