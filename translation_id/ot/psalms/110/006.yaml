  text: He will judge among the nations[a]; he will fill them with corpses[d][c][b]; he will crush the head over a broad land.
translation:
  language: id
  text: Ia akan menghakimi di antara bangsa-bangsa[a]; Ia akan memenuhi dengan mayat[d]; Ia akan meremukkan kepala[b] di negeri yang luas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terhadap bangsa-bangsa.”
