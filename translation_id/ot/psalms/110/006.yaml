lexical_decisions:
- source_word: יָדִין
  choice: Ia akan menghakimi
  rationale: Bentuk imperfek Qal orang ketiga tunggal menyatakan tindakan yang akan dilakukan dalam konteks puitis ini. ‘Menghakimi’ mempertahankan unsur pengadilan tanpa mempersempitnya menjadi penghukuman militer saja.
- source_word: בַּגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם berarti ‘bangsa-bangsa’; preposisi ב paling wajar dipahami sebagai tindakan penghakiman yang berlangsung di tengah mereka, meskipun nuansa ‘terhadap’ juga mungkin.
- source_word: מָלֵא גְוִיּוֹת
  choice: Ia akan memenuhi tempat itu dengan mayat
  rationale: Bahasa Ibrani sangat ringkas dan tidak menyebut objek yang dipenuhi. ‘Tempat itu’ ditambahkan untuk menghasilkan bahasa Indonesia yang wajar tanpa menentukan apakah yang dimaksud ialah negeri-negeri, medan pertempuran, atau bumi.
- source_word: גְוִיּוֹת
  choice: mayat
  rationale: Kata ini menunjuk kepada tubuh-tubuh yang sudah mati. ‘Mayat’ mempertahankan kekerasan gambaran medan perang.
- source_word: מָחַץ
  choice: Ia akan meremukkan
  rationale: Kata kerja ini menggambarkan pukulan keras yang menghancurkan atau meremukkan; pilihan ini jelas, kuat, dan alami dalam bahasa Indonesia modern.
- source_word: רֹאשׁ
  choice: kepala
  rationale: Bentuk tunggal konkret dalam teks dipertahankan. Kata itu dapat dipahami secara kolektif atau sebagai seorang pemimpin, tetapi tafsiran tersebut tidak dimasukkan ke dalam teks utama.
- source_word: עַל אֶרֶץ רַבָּה
  choice: di negeri yang luas
  rationale: עַל dalam susunan ini dapat menunjukkan lokasi atau cakupan, sedangkan אֶרֶץ dapat berarti ‘negeri’ atau ‘bumi’. Terjemahan ini mempertahankan bentuk tunggal dan tidak langsung memberi cakupan universal.
theological_decisions:
- issue: Cakupan dan rujukan kata tunggal רֹאשׁ dalam mazmur kerajaan yang juga dibaca secara mesianik
  choice: Mempertahankan kata konkret tunggal ‘kepala’ tanpa mengidentifikasi siapa yang dimaksud
  alternative: ‘seorang pemimpin’, ‘para kepala’, atau satu musuh utama tertentu
  rationale: Teks Ibrani tidak secara eksplisit mengidentifikasi kepala itu. Mempertahankan bentuk tunggal menjaga ketegangan teologis dan kemungkinan makna kolektif, representatif, atau individual.
- issue: Cakupan אֶרֶץ pada klausa terakhir
  choice: ‘negeri’ dalam teks utama
  alternative: ‘bumi’
  rationale: אֶרֶץ dapat menunjuk wilayah tertentu ataupun seluruh bumi. Gambaran perang dalam konteks ini memungkinkan keduanya, sehingga pilihan yang kurang memperluas cakupan dipakai dalam teks utama dan pilihan lainnya dicatat.
- issue: Objek tersirat dari מָלֵא
  choice: Menambahkan ‘tempat itu’ sebagai pelengkap netral
  alternative: ‘bangsa-bangsa itu’, ‘negeri itu’, atau membiarkan objek tidak disebut
  rationale: Bahasa Ibrani tidak menyatakan objek secara eksplisit. ‘Tempat itu’ membuat kalimat Indonesia dapat dipahami tanpa memastikan rujukan yang tidak dipastikan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tiga klausa serta gambaran keras teks dipertahankan. Huruf kapital pada ‘Ia’ mengikuti register Alkitab Indonesia yang lazim untuk rujukan ilahi, tanpa menambahkan identifikasi yang tidak dinyatakan dalam ayat.
