source:
  edition: WLC
  text: נָ֭שָׂאתָ עֲוֺ֣ן עַמֶּ֑/ךָ כִּסִּ֖יתָ כָל חַטָּאתָ֣/ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/002.yaml
  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
translation:
  language: id
  text: Engkau telah mengampuni kesalahan umat-Mu[a]; Engkau telah menutupi segala dosa mereka[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Engkau telah mengangkat,” “menanggung,” atau “membawa pergi kesalahan umat-Mu.” Ungkapan Ibrani ini menyatakan pengampunan melalui gambaran tentang mengangkat atau membawa pergi kesalahan.
    reason: lexical_alternative
  - marker: b
    text: Atau “semua dosa mereka.” Bahasa Ibrani memakai nomina tunggal dengan sufiks jamak, yang dapat diterjemahkan secara kolektif sebagai “dosa mereka” atau secara distributif sebagai “semua dosa mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: נָשָׂאתָ
  choice: telah mengampuni
  rationale: Secara harfiah verba ini berarti 'mengangkat, membawa, menanggung', tetapi bersama עָוֹן membentuk ungkapan yang menyatakan pengampunan atau penyingkiran kesalahan. 'Mengampuni' menyampaikan makna idiomatisnya secara wajar dalam bahasa Indonesia; citra harfiahnya dicatat dalam catatan kaki.
- source_word: עֲוֺן
  choice: kesalahan
  rationale: Kata ini dapat menunjuk pada kejahatan, kesalahan, rasa bersalah, atau akibat kesalahan. 'Kesalahan' mempertahankan bobot moralnya dan membedakannya secara wajar dari חַטָּאת pada baris berikutnya.
- source_word: עַמֶּךָ
  choice: umat-Mu
  rationale: Dalam konteks relasi perjanjian dengan Allah, 'umat-Mu' merupakan padanan Indonesia yang alami bagi עַם dengan sufiks orang kedua tunggal.
- source_word: כִּסִּיתָ
  choice: telah menutupi
  rationale: Padanan ini mempertahankan metafora konkret 'menutupi' yang dalam konteks ini menyatakan pengampunan, tanpa menggantinya dengan penjelasan teologis.
- source_word: כָל
  choice: segala
  rationale: '''Segala'' alami bersama nomina kolektif ''dosa'' dan menyampaikan cakupan menyeluruh dari כָל.'
- source_word: חַטָּאתָם
  choice: dosa mereka
  rationale: Bentuk Ibraninya adalah nomina tunggal dengan sufiks jamak dan dapat dipahami secara kolektif. 'Dosa mereka' mempertahankan bentuk kolektif itu; 'dosa-dosa mereka' juga mungkin.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak pasti, sehingga ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia dan tidak diberi tafsiran seperti 'jeda'.
theological_decisions:
- issue: Ungkapan pengampunan נָשָׂא עָוֹן
  choice: Engkau telah mengampuni kesalahan umat-Mu
  alternative: Engkau telah mengangkat / menanggung / membawa pergi kesalahan umat-Mu
  rationale: Terjemahan utama menyampaikan fungsi idiomatis ungkapan itu sebagai tindakan pengampunan Allah, sedangkan catatan kaki mempertahankan citra Ibrani tentang mengangkat atau membawa kesalahan.
- issue: Bentuk tunggal kolektif חַטָּאתָם
  choice: segala dosa mereka
  alternative: segala dosa-dosa mereka
  rationale: Nomina Ibrani berbentuk tunggal dengan sufiks jamak dan dapat berfungsi secara kolektif. Bahasa Indonesia secara alami memakai 'dosa mereka' sebagai kolektif, sementara bentuk distributif 'dosa-dosa mereka' tetap dicatat sebagai kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan sapaan ilahi 'Engkau' serta kapitalisasi pronomina '-Mu'. Aspek perfektif verba Ibrani dinyatakan dengan 'telah'. Metafora 'menutupi' dan istilah liturgis yang tidak pasti 'Sela' dipertahankan.
