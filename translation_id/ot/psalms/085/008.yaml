source:
  edition: WLC
  text: אֶשְׁמְעָ֗ה מַה יְדַבֵּר֮ הָ/אֵ֪ל יְה֫וָ֥ה כִּ֤י יְדַבֵּ֬ר שָׁל֗וֹם אֶל עַמּ֥/וֹ וְ/אֶל חֲסִידָ֑י/ו וְֽ/אַל יָשׁ֥וּבוּ לְ/כִסְלָֽה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: id
  text: Aku hendak mendengarkan apa yang akan dikatakan Allah, Yahweh, sebab Ia akan menyampaikan damai kepada umat-Nya dan kepada orang-orang yang setia kepada-Nya[a]; tetapi janganlah mereka kembali kepada kebodohan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang kudus-Nya” atau “orang-orang saleh-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kebodohan.” Sebagian kecil penafsiran memahami kata terakhir sebagai “kepercayaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: Aku hendak mendengarkan
  rationale: Bentuk kohortatif menyatakan tekad atau niat pemazmur; frasa ini alami dalam bahasa Indonesia dan mempertahankan nuansa volitif.
- source_word: מַה יְדַבֵּר
  choice: apa yang akan difirmankan
  rationale: Bentuk imperfek menunjuk pada apa yang akan Allah ucapkan; 'difirmankan' sesuai dengan register khidmat untuk perkataan ilahi.
- source_word: הָאֵל יְהוָה
  choice: Allah, Yahweh
  rationale: Mempertahankan baik sebutan אֵל maupun nama ilahi יהוה tanpa meleburkan keduanya.
- source_word: כִּי יְדַבֵּר שָׁלוֹם
  choice: sebab ia akan menyatakan damai
  rationale: כִּי dipahami sebagai penjelasan bagi tekad untuk mendengarkan. Ungkapan Ibrani harfiah 'berbicara damai' dialihkan secara wajar menjadi 'menyatakan damai' sambil mempertahankan שָׁלוֹם sebagai 'damai'.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Dalam konteks hubungan Allah dengan Israel, 'umat-Nya' merupakan padanan kolektif yang alami dan bermartabat.
- source_word: חֲסִידָיו
  choice: orang-orang-Nya yang setia
  rationale: חסיד menunjuk pada mereka yang bercirikan kesetiaan atau kesalehan dalam relasi perjanjian; pilihan ini tidak memasukkan makna teknis gerejawi.
- source_word: וְאַל יָשׁוּבוּ
  choice: tetapi janganlah mereka kembali
  rationale: אַל dengan imperfek menyatakan larangan atau imbauan. 'Tetapi' menampilkan ketegangan antara pemberitaan damai dan peringatan agar tidak kembali menyimpang.
- source_word: לְכִסְלָה
  choice: kepada kebodohan
  rationale: Makna lazim כִּסְלָה ialah kebodohan atau tindakan bodoh; alternatif 'kepercayaan diri' kurang mungkin dalam konteks ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar 'Allah'.
- issue: Makna חֲסִידָיו
  choice: orang-orang-Nya yang setia
  alternative: orang-orang kudus-Nya; orang-orang saleh-Nya
  rationale: Pilihan ini mempertahankan dimensi kesetiaan relasional tanpa mempersempitnya menjadi kategori gerejawi yang lebih kemudian.
- issue: Daya klausa terakhir
  choice: 'larangan atau imbauan: ''janganlah mereka kembali kepada kebodohan'''
  alternative: 'pernyataan: ''mereka tidak akan kembali kepada kebodohan'''
  rationale: Konstruksi אַל dengan imperfek sangat mendukung daya prohibitif/jusif, sehingga janji damai tetap berdampingan dengan peringatan moral.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pronomina ilahi memakai huruf kecil ketika berdiri sendiri ('ia') dan bentuk terikat hormat pada 'umat-Nya' serta 'orang-orang-Nya'. Struktur puisi dipertahankan dalam satu ayat dengan kontras yang jelas.
