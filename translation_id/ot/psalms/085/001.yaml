source:
  edition: WLC
  text: רָצִ֣יתָ יְהוָ֣ה אַרְצֶ֑/ךָ שַׁ֝֗בְתָּ שבות יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: id
  text: Engkau telah berkenan kepada tanah-Mu, ya Yahweh; Engkau telah memulihkan keadaan Yakub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau telah mengembalikan penawanan Yakub” atau “Engkau telah memulihkan para tawanan Yakub.” Ungkapan Ibrani ini dapat berarti pemulihan dari pembuangan atau pembalikan keadaan secara lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: telah berkenan kepada
  rationale: Dalam bentuk Qal, רצה menyatakan sikap berkenan atau menunjukkan kemurahan kepada sesuatu. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa perkenanan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אַרְצֶךָ
  choice: negeri-Mu
  rationale: אֶרֶץ di sini menunjuk pada negeri milik Yahweh dalam hubungan-Nya dengan umat-Nya, kemungkinan besar tanah Israel. 'Negeri-Mu' lebih alami daripada 'tanah-Mu' dalam konteks geografis dan tidak harus bermakna negara modern.
- source_word: שַׁבְתָּ
  choice: telah memulihkan
  rationale: Bersama kata berikutnya, שוב membentuk ungkapan yang menyatakan pemulihan atau pembalikan keadaan; 'memulihkan' menyampaikan makna idiomatisnya dengan jelas.
- source_word: שבות
  choice: keadaan
  rationale: Dalam ungkapan שׁוּב שְׁבוּת, kata ini dapat menunjuk pada pemulihan nasib atau keadaan secara luas, sekaligus dapat membangkitkan gambaran kembalinya para tawanan. 'Keadaan' menghindari pembatasan makna hanya pada pembuangan.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama ini dipertahankan sebagaimana tertulis dalam bahasa Ibrani; dalam konteks puitis ini, Yakub merujuk secara kolektif kepada umat Israel.
theological_decisions:
- issue: Makna ungkapan שׁוּב שְׁבוּת יַעֲקֹב
  choice: Engkau telah memulihkan keadaan Yakub
  alternative: Engkau telah membawa kembali orang-orang Yakub yang tertawan / Engkau telah memulihkan Yakub dari penawanan
  rationale: Ungkapan Ibrani ini dapat menyatakan pembalikan keadaan secara umum ataupun pemulangan dari penawanan. Teks utama mempertahankan cakupan yang lebih luas, sedangkan kemungkinan nuansa pembuangan dipelihara dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan langsung kepada Allah memakai 'Engkau' dan akhiran hormat '-Mu'. Susunan dua klausa dipertahankan secara ringkas untuk menjaga kesejajaran puisi Ibrani.
