source:
  edition: WLC
  text: אָסַ֥פְתָּ כָל עֶבְרָתֶ֑/ךָ הֱ֝שִׁיב֗וֹתָ מֵ/חֲר֥וֹן אַפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/003.yaml
  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: id
  text: Engkau telah menarik kembali seluruh murka-Mu; Engkau telah berpaling dari[a] amarah-Mu yang menyala-nyala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Engkau telah menyurutkan amarah-Mu yang menyala-nyala.”'
    reason: Alternatif ini mencerminkan daya kausatif bentuk Hifil הֱשִׁיבוֹתָ secara lebih langsung.
lexical_decisions:
- source_word: אָסַפְתָּ
  choice: telah menarik kembali
  rationale: Dalam konteks murka Allah, אָסַף menyatakan tindakan menyingkirkan atau menarik kembali. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran bahwa murka itu tidak lagi dicurahkan.
- source_word: כָל
  choice: seluruh
  rationale: 'Menyatakan kelengkapan: seluruh murka itu ditarik kembali.'
- source_word: עֶבְרָתֶךָ
  choice: murka-Mu
  rationale: עֶבְרָה berarti murka atau amarah yang meluap. “Murka” sesuai dengan ragam mazmur yang luhur dan tetap mudah dipahami.
- source_word: הֱשִׁיבוֹתָ
  choice: telah berpaling
  rationale: Bentuk kausatif dari שׁוּב dengan מִן dapat menyatakan berbalik atau berpaling dari sesuatu. Dalam bahasa Indonesia, “berpaling dari” mengungkapkan idiom ini secara alami tanpa menafsirkannya sebagai perubahan batin.
- source_word: מֵחֲרוֹן
  choice: dari ... yang menyala-nyala
  rationale: חָרוֹן menggambarkan panas atau nyala yang menjadi kiasan bagi kedahsyatan amarah. Bentuk ini mempertahankan citra termal Ibrani.
- source_word: אַפֶּךָ
  choice: amarah-Mu
  rationale: אַף secara harfiah berarti “hidung”, tetapi dalam ungkapan ini bermakna amarah. Arti kiasannya diterjemahkan secara alami, sementara unsur panas dipertahankan melalui “menyala-nyala”.
theological_decisions:
- issue: Bahasa antropomorfis tentang murka Allah
  choice: Mempertahankan gambaran amarah yang menyala-nyala
  alternative: Melunakkan menjadi “amarah-Mu yang dahsyat” atau “Engkau meredakan amarah-Mu”
  rationale: Teks Ibrani memakai citra panas yang kuat bagi amarah Allah. Terjemahan mempertahankan gambaran tersebut tanpa mengubahnya menjadi pernyataan doktrinal yang lebih abstrak.
- issue: Arah tindakan pada הֱשִׁיבוֹתָ מֵחֲרוֹן
  choice: Engkau telah berpaling dari amarah-Mu yang menyala-nyala
  alternative: Engkau telah menyurutkan amarah-Mu yang menyala-nyala
  rationale: Konstruksi Ibrani dapat dipahami sebagai Allah berbalik atau berpaling dari amarah-Nya, sedangkan alternatif kausatif menonjolkan bahwa Ia membuat amarah itu surut. Teks utama menjaga ungkapan arah gerak dan catatan kaki mencatat alternatif yang wajar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme dua klausa dipertahankan; “murka” dan “amarah” menghindari pengulangan kaku sekaligus mencerminkan dua istilah Ibrani yang berbeda.
