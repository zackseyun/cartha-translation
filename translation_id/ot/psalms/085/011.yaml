source:
  edition: WLC
  text: אֱ֭מֶת מֵ/אֶ֣רֶץ תִּצְמָ֑ח וְ֝/צֶ֗דֶק מִ/שָּׁמַ֥יִם נִשְׁקָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: id
  text: Kebenaran akan tumbuh dari bumi[a], dan keadilan akan memandang ke bawah dari surga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kesetiaan akan tumbuh dari bumi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kebenaran moral akan memandang ke bawah dari surga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: kebenaran
  rationale: Kata ini dapat berarti kebenaran, kesetiaan, atau sifat dapat dipercaya. Dalam kesejajaran puitis dengan צֶדֶק, “kebenaran” secara alami mempertahankan gambaran tentang suatu kebajikan abstrak, sementara kemungkinan “kesetiaan” dicatat dalam catatan kaki.
- source_word: מֵאֶרֶץ
  choice: dari bumi
  rationale: אֶרֶץ dapat berarti bumi atau negeri. Kontras vertikal dengan “dari surga” mendukung “bumi” dan mempertahankan simetri puitis antara yang di bawah dan yang di atas.
- source_word: תִּצְמָח
  choice: akan tumbuh
  rationale: Verba צמח menggambarkan tumbuh atau bertunas seperti tanaman. “Akan tumbuh” jelas dan alami dalam bahasa Indonesia serta mempertahankan metafora kehidupan yang muncul dari tanah.
- source_word: צֶדֶק
  choice: keadilan
  rationale: צֶדֶק mencakup keadilan dan kebenaran moral. Dalam bahasa Indonesia modern, “keadilan” membedakannya dengan jelas dari אֱמֶת yang diterjemahkan “kebenaran”; kemungkinan “kebenaran moral” tetap dicatat dalam catatan kaki.
- source_word: מִשָּׁמַיִם
  choice: dari surga
  rationale: שָׁמַיִם dapat menunjuk pada langit atau surga. “Surga” mempertahankan daya puitis-teologis dan membentuk pasangan vertikal yang alami dengan “bumi”.
- source_word: נִשְׁקָף
  choice: akan memandang
  rationale: Bentuk Niphal dari שׁקף menggambarkan tindakan memandang keluar atau ke bawah dari tempat tinggi. Karena arah dari atas sudah dinyatakan oleh “dari surga,” “akan memandang” alami dan tetap mempertahankan personifikasi.
theological_decisions:
- issue: Makna צֶדֶק sebagai keadilan atau kebenaran moral
  choice: keadilan
  alternative: kebenaran moral
  rationale: Kedua makna didukung oleh istilah Ibrani. “Keadilan” menghasilkan pasangan kebajikan yang jelas dengan “kebenaran” dan sesuai dengan pemakaian Indonesia modern, tanpa meniadakan nuansa moral yang dicatat sebagai alternatif.
- issue: Makna אֱמֶת sebagai kebenaran atau kesetiaan
  choice: kebenaran
  alternative: kesetiaan
  rationale: Konteks puitis memungkinkan keduanya. Teks utama memakai “kebenaran” sebagai padanan luas dan alami, sedangkan “kesetiaan” dipertahankan dalam catatan kaki agar ambiguitas leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan dua klausa mempertahankan kesejajaran bumi–surga serta personifikasi kedua kebajikan. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
