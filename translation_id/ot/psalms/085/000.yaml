base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/000.yaml
  text: For the choir director[a]. Of the sons of Korah[b]. A psalm.
translation:
  language: id
  text: Untuk pemimpin musik[a]. Dari bani Korah[b]. Mazmur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Untuk pemimpin nyanyian” atau “Untuk pemimpin paduan suara.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Untuk bani Korah.” Kata depan Ibrani dapat menunjukkan kepengarangan, keterkaitan, kepemilikan, atau peruntukan dalam judul mazmur.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, istilah ini menunjuk kepada orang yang bertanggung jawab memimpin atau mengarahkan penyajian musik. Ungkapan ini alami dalam bahasa Indonesia modern, sedangkan prefiks ל diterjemahkan “untuk” tanpa mempersempit fungsi jabatan itu menjadi pemimpin paduan suara saja.
- source_word: לִבְנֵי
  choice: Dari bani
  rationale: Kata depan ל dapat menyatakan kepengarangan, keterkaitan, kepemilikan, atau peruntukan. “Dari bani” merupakan rumusan judul yang ringkas dan tetap cukup terbuka mengenai hubungan mazmur ini dengan kelompok keturunan Korah.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan menurut bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah ini merupakan penanda jenis karya berupa nyanyian yang berkaitan dengan iringan musik; “Mazmur” adalah padanan baku dan mudah dipahami dalam bahasa Indonesia.
