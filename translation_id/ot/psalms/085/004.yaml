  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: id
  text: Pulihkanlah kami[a], ya Allah, keselamatan kami; singkirkanlah murka-Mu dari kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kembalikanlah kami, ya Allah, keselamatan kami.” Kata kerja Ibrani ini secara lebih harfiah berarti “sebabkanlah kami kembali.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: Pulihkanlah kami
  rationale: Bentuk imperatif Hifil dengan akhiran orang pertama jamak secara harfiah meminta Allah menyebabkan umat-Nya kembali. Dalam konteks mazmur ini, “pulihkanlah kami” secara alami mencakup kembalinya umat kepada keadaan berkenan di hadapan Allah tanpa membatasi permohonan itu hanya pada pertobatan batin.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: ya Allah yang menyelamatkan kami
  rationale: Frasa konstruksi ini secara harfiah berarti “Allah keselamatan kami.” Bentuk relatif yang dipilih lebih wajar dalam bahasa Indonesia modern dan tetap menegaskan bahwa Allah adalah pelaku dan sumber keselamatan umat.
- source_word: וְהָפֵר
  choice: akhirilah
  rationale: Imperatif Hifil dari פרר dapat berarti membatalkan, menggagalkan, atau menyebabkan sesuatu berhenti. Dengan murka sebagai objek, “akhirilah” menyampaikan permohonan agar murka itu tidak berlanjut.
- source_word: כַּעַסְךָ
  choice: murka-Mu
  rationale: Kata benda ini menyatakan kemarahan atau kejengkelan. “Murka” sesuai dengan konteks kemarahan ilahi serta mempertahankan ragam yang khidmat dan mudah dipahami.
- source_word: עִמָּנוּ
  choice: terhadap kami
  rationale: Walaupun preposisi עם biasanya berarti “dengan,” dalam hubungan dengan murka ilahi ungkapan Indonesia yang alami ialah “murka terhadap kami.” Pilihan ini menyampaikan relasi yang dimaksud tanpa menghasilkan frasa “murka bersama kami” yang menyesatkan.
theological_decisions:
- issue: Apakah permohonan pembuka terutama menunjuk pada pertobatan moral atau pemulihan umat oleh Allah
  choice: Pulihkanlah kami
  alternative: Bawalah kami kembali
  rationale: Konteksnya adalah permohonan agar perkenanan Allah kembali sesudah murka, sehingga “pulihkanlah” tepat sebagai teks utama. Catatan kaki mempertahankan arti harfiah yang menonjolkan tindakan Allah menyebabkan umat kembali, tanpa meniadakan kemungkinan nuansa pertobatan.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan langsung. Sapaan “ya Allah” memperjelas vokatif; tanda titik koma menjaga kesejajaran dua permohonan imperatif. Bentuk pronomina ilahi memakai huruf kapital sesuai kebiasaan umum penerbitan Alkitab berbahasa Indonesia.
