translation:
  language: id
  text: Keadilan akan berjalan di hadapan-Nya dan membuat jalan bagi langkah-langkah-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani pada bagian akhir juga dapat dipahami, “dan menjadikan langkah-langkah-Nya sebagai jalan.”
    reason: Susunan וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו tidak lazim dan memungkinkan hubungan sintaksis alternatif; catatan ini mempertahankan ambiguitas teks Ibrani.
lexical_decisions:
- source_word: צֶדֶק
  choice: Kebenaran
  rationale: Mewakili nomina Ibrani yang mencakup kelurusan dan keadilan; dalam konteks puitis ini dipersonifikasikan sebagai sesuatu yang berjalan di hadapan Allah.
- source_word: לְפָנָיו
  choice: di hadapan-Nya
  rationale: Terjemahan langsung dan alami untuk ungkapan 'di depan-Nya/sebelum-Nya', dengan rujukan kepada Allah dari konteks mazmur.
- source_word: יְהַלֵּךְ
  choice: akan berjalan
  rationale: Mempertahankan gambaran gerak aktif dan bentuk imperfek yang di sini paling wajar dipahami sebagai tindakan mendatang.
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: dan menyiapkan jalan bagi langkah-langkah-Nya
  rationale: Mengikuti pemahaman sintaksis bahwa kebenaran menyediakan atau menetapkan jalan untuk langkah-Nya, sambil mempertahankan citra puitis perjalanan.
theological_decisions:
- issue: Rujukan pronomina orang ketiga tunggal
  choice: Kapitalisasi '-Nya' sebagai rujukan kepada Allah
  alternative: Huruf kecil '-nya' atau menganggap rujukannya ambigu
  rationale: Konteks langsung Mazmur 85:12-13 berbicara tentang TUHAN, sehingga rujukan kepada Allah sangat kuat; kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk pronomina ilahi tanpa menambahkan nama yang tidak ada dalam ayat.
- issue: Subjek verba kedua וְיָשֵׂם
  choice: '''Kebenaran'' tetap menjadi subjek: ''menyiapkan jalan'''
  alternative: Allah menjadi subjek, atau menerjemahkan 'menjadikan langkah-langkah-Nya suatu jalan'
  rationale: Subjek eksplisit terdekat adalah 'kebenaran', dan pembacaan ini menghasilkan rangkaian puitis yang koheren. Namun, konstruksi Ibrani ayat kedua tidak sepenuhnya pasti, sehingga alternatif dicatat.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. 'Menyiapkan jalan' dipilih sebagai ungkapan alami, sedangkan 'langkah-langkah-Nya' mempertahankan citra konkret teks Ibrani.
