  text: הַרְאֵ֣/נוּ יְהוָ֣ה חַסְדֶּ֑/ךָ וְ֝/יֶשְׁעֲ/ךָ֗ תִּתֶּן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/007.yaml
  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
translation:
  language: id
  text: Perlihatkanlah kepada kami kasih setia-Mu[a], ya Yahweh, dan berikanlah kepada kami keselamatan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Buatlah kami melihat kasih setia-Mu, ya Yahweh, dan berikanlah kepada kami keselamatan-Mu.”
    reason: Alternatif ini mencerminkan secara lebih harfiah bentuk kausatif הַרְאֵנוּ, ‘buatlah kami melihat’.
lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: Perlihatkanlah kepada kami
  rationale: Bentuk imperatif Hifil dari ראה dengan akhiran orang pertama jamak secara harfiah berarti ‘buatlah kami melihat’. ‘Perlihatkanlah kepada kami’ mempertahankan daya perintah sekaligus terdengar alami sebagai permohonan dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks sumber tetap dipertahankan.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: חסד mencakup kasih, kebaikan, dan kesetiaan yang teguh dalam hubungan perjanjian. ‘Kasih setia’ merupakan ungkapan Indonesia yang alami dan mempertahankan perpaduan kasih serta loyalitas tersebut.
- source_word: וְיֶשְׁעֲךָ
  choice: dan keselamatan-Mu
  rationale: ישע dapat menunjuk pada keselamatan atau pembebasan. ‘Keselamatan-Mu’ mempertahankan cakupan luas pertolongan ilahi dan bentuk posesif teks Ibrani.
- source_word: תִּתֶּן לָנוּ
  choice: berikanlah kepada kami
  rationale: נתן dengan objek tak langsung berarti ‘berikan kepada kami’. Terjemahan ini langsung, wajar, dan mempertahankan bentuk permohonan kepada Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. ‘Yahweh’ mempertahankan nama tersebut melalui transliterasi tanpa menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Partikel ‘-lah’ mempertahankan nuansa permohonan, sedangkan ‘ya Yahweh’ menandai sapaan langsung secara alami.
