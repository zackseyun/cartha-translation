source:
  edition: WLC
  text: הֲֽ/לֹא אַ֭תָּה תָּשׁ֣וּב תְּחַיֵּ֑/נוּ וְ֝/עַמְּ/ךָ֗ יִשְׂמְחוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/006.yaml
  text: Will you not return and revive us[b][a], so that your people may rejoice in you?
translation:
  language: id
  text: Bukankah Engkau akan kembali[a] dan menghidupkan kami lagi[b], supaya umat-Mu bersukacita dalam Engkau?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbalik kembali” atau “berpaling lagi.” Kata kerja Ibrani ini dapat berarti kembali atau berbalik; di sini kemungkinan menunjuk kepada Allah yang kembali berpaling kepada umat-Nya dengan perkenanan.
    reason: lexical_alternative
  - marker: b
    text: Atau “membuat kami hidup kembali” atau “memulihkan hidup kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah ... akan
  rationale: Bentuk ini mempertahankan pertanyaan retoris yang mengharapkan jawaban positif sekaligus menyampaikan permohonan penuh harap secara wajar dalam bahasa Indonesia.
- source_word: תָּשׁוּב
  choice: kembali
  rationale: Kata Ibrani שׁוב berarti kembali atau berbalik. Pilihan ini mempertahankan metafora tanpa menambahkan objek atau menjelaskan bahwa Allah kembali menunjukkan perkenanan, meskipun hal itu mungkin tersirat oleh konteks.
- source_word: תְּחַיֵּנוּ
  choice: menghidupkan kami lagi
  rationale: Bentuk piel dari חיה menyatakan tindakan membuat hidup atau memulihkan kehidupan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencakup pemulihan umat secara luas, bukan hanya kehidupan jasmani atau pembaruan rohani.
- source_word: וְעַמְּךָ
  choice: supaya umat-Mu
  rationale: Kata penghubung dipahami dalam hubungan tujuan atau hasil dengan permohonan sebelumnya. 'Umat-Mu' mempertahankan bahasa relasional-perjanjian dalam teks.
- source_word: יִשְׂמְחוּ
  choice: bersukacita
  rationale: Bentuk imperfek dalam konteks ini menyatakan hasil atau tujuan yang diharapkan. Dengan 'supaya', pilihan ini menyampaikan nuansa tersebut secara alami.
- source_word: בָךְ
  choice: dalam Engkau
  rationale: Preposisi ב menunjuk kepada Allah sebagai pusat atau objek sukacita. 'Dalam Engkau' mempertahankan ungkapan teks dan tidak mempersempitnya menjadi sekadar penyebab sukacita.
theological_decisions:
- issue: Apakah tindakan Allah 'kembali' perlu dijelaskan sebagai kembali kepada umat-Nya dalam perkenanan
  choice: Mempertahankan kata 'kembali' tanpa tambahan objek atau penjelasan dalam teks utama
  alternative: '''berpaling kembali kepada kami'' atau ''kembali menunjukkan perkenanan'''
  rationale: Teks Ibrani tidak secara tersurat menyebut 'kepada kami' atau 'dalam perkenanan'. Konteks mendukung pengertian itu, tetapi terjemahan utama mempertahankan keluasan dan metafora aslinya.
- issue: Apakah 'menghidupkan kami lagi' hanya berarti pembaruan rohani atau pemulihan kehidupan umat secara lebih luas
  choice: Menggunakan ungkapan luas 'menghidupkan kami lagi'
  alternative: '''memulihkan kehidupan bangsa kami'' atau ''memperbarui kami secara rohani'''
  rationale: Konteks mazmur berbicara tentang pemulihan bersama setelah penghukuman, tetapi ungkapan Ibraninya tidak membatasi tindakan itu pada ranah rohani, jasmani, atau politik saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa yang khidmat. Kapitalisasi kata ganti ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan bentuk pertanyaan retoris serta hubungan tujuan melalui 'supaya'.
