  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: id
  text: Sungguh, keselamatan-Nya[a] dekat dengan orang-orang yang takut kepada-Nya, agar kemuliaan[b] berdiam di negeri kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelepasan-Nya”.
    reason: lexical_alternative
  - marker: b
    text: “Kemuliaan” dapat menunjuk pada kehadiran Allah yang nyata atau pada kehormatan yang dipulihkan di negeri kita.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini berfungsi menegaskan pernyataan, bukan membatasi. “Sungguh” menyampaikan penegasan itu secara alami dalam bahasa Indonesia.
- source_word: קָרוֹב
  choice: dekat dengan
  rationale: Kata sifat ini menyatakan kedekatan. Bentuk “dekat dengan” alami ketika diikuti orang-orang yang menerima atau mengalami keselamatan.
- source_word: לִירֵאָיו
  choice: orang-orang yang takut kepada-Nya
  rationale: Ungkapan ini menunjuk kepada mereka yang dicirikan oleh takut akan Allah. “Takut kepada-Nya” mempertahankan bobot religius-perjanjian tanpa mempersempitnya menjadi sekadar rasa hormat.
- source_word: יִשְׁעוֹ
  choice: keselamatan-Nya
  rationale: Nomina ini dapat berarti keselamatan atau kelepasan; akhiran pronominal orang ketiga dipertahankan secara langsung dengan “-Nya”.
- source_word: לִשְׁכֹּן
  choice: agar ... berdiam
  rationale: Infinitif dengan לְ di sini menyatakan tujuan atau hasil. “Agar ... berdiam” mempertahankan hubungan tersebut dan citra menetap dalam teks Ibrani.
- source_word: כָּבוֹד
  choice: kemuliaan
  rationale: “Kemuliaan” mempertahankan keluasan makna dan bobot puitis kata Ibrani tanpa menetapkan apakah yang dimaksud khususnya kehadiran Allah atau kehormatan yang dipulihkan.
- source_word: בְּאַרְצֵנוּ
  choice: di negeri kita
  rationale: Dalam konteks ini אֶרֶץ menunjuk pada negeri umat, bukan seluruh bumi; “negeri kita” merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Acuan כָּבוֹד (“kemuliaan”)
  choice: Diterjemahkan secara terbuka sebagai “kemuliaan”.
  alternative: Kemuliaan atau kehadiran Allah yang nyata; atau kehormatan yang dipulihkan bagi negeri itu.
  rationale: Teks Ibrani tidak menyebutkan acuan kata ini secara eksplisit. Terjemahan utama mempertahankan ketegangan dan daya evokatif tersebut tanpa memilih satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
