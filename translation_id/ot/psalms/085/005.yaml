  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: id
  text: Akankah Engkau murka terhadap kami untuk selama-lamanya? Akankah Engkau memperpanjang murka-Mu dari generasi ke generasi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menarik” atau “mengulur murka-Mu” sampai generasi demi generasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Partikel tanya הַ bersama לְעוֹלָם membentuk pertanyaan retoris tentang keberlangsungan tanpa akhir; frasa ini alami dan khidmat dalam bahasa Indonesia.
- source_word: תֶּאֱנַף
  choice: Akankah Engkau murka
  rationale: Kata kerja אנף menyatakan kemarahan. 'Murka' mempertahankan bobot bahasa tentang kemarahan ilahi tanpa melunakkannya.
- source_word: בָּנוּ
  choice: terhadap kami
  rationale: Preposisi ב dengan אנף menandai pihak yang menjadi sasaran kemarahan; 'terhadap kami' merupakan padanan Indonesia yang alami dan tidak perlu menyiratkan kebersamaan.
- source_word: תִּמְשֹׁךְ
  choice: memperpanjang
  rationale: משך secara harfiah berarti menarik atau mengulurkan; bersama 'murka', maknanya ialah membuatnya berlangsung lebih lama.
- source_word: אַפְּךָ
  choice: murka-Mu
  rationale: אַף secara harfiah berarti 'hidung', tetapi secara idiomatis menunjuk pada kemarahan; 'murka-Mu' menyampaikan makna idiom tersebut secara langsung.
- source_word: לְדֹר וָדֹר
  choice: turun-temurun
  rationale: Ungkapan Ibrani ini menunjuk pada kesinambungan dari satu generasi ke generasi berikutnya; 'turun-temurun' ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa antropopatik tentang murka Allah
  choice: Mempertahankan sebutan langsung 'murka' bagi kemarahan Allah.
  alternative: Menggunakan 'tidak berkenan' atau 'menentang' yang lebih lunak.
  rationale: Teks Ibrani secara eksplisit berbicara tentang kemarahan ilahi dan keberlangsungannya. Terjemahan mempertahankan ketegangan teologis ratapan itu tanpa menghaluskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi memakai huruf kapital. 'Murka' dipilih untuk mempertahankan intensitas teks, sedangkan 'memperpanjang' menyampaikan idiom Ibrani secara wajar. Penanda catatan kaki [a] dicantumkan dalam teks utama.
