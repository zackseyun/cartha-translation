source:
  edition: WLC
  text: חֶֽסֶד וֶ/אֱמֶ֥ת נִפְגָּ֑שׁוּ צֶ֖דֶק וְ/שָׁל֣וֹם נָשָֽׁקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/010.yaml
  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: id
  text: Kasih setia dan kebenaran[a] telah bertemu; keadilan[b] dan damai telah berciuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan” untuk אֱמֶת.
    reason: lexical_alternative
  - marker: b
    text: Atau “kebenaran” untuk צֶדֶק.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini menyampaikan kasih yang teguh dan loyal dalam hubungan, bukan sekadar perasaan kasih atau belas kasihan.
- source_word: אֱמֶת
  choice: kebenaran
  rationale: Kata Ibrani ini dapat berarti kebenaran, kesetiaan, atau keadaan dapat dipercaya. “Kebenaran” mempertahankan keluasan maknanya, sedangkan “kesetiaan” dicatat sebagai alternatif.
- source_word: נִפְגָּשׁוּ
  choice: telah bertemu
  rationale: Bentuk Niphal perfek jamak menggambarkan pertemuan dua sifat yang dipersonifikasikan; bentuk ini mempertahankan aspek rampung dan citra puisinya.
- source_word: צֶדֶק
  choice: keadilan
  rationale: Dalam pasangan puitis ini, “keadilan” menyampaikan dimensi etis צדק dengan jelas dan sekaligus menghindari pengulangan “kebenaran”; alternatif “kebenaran” tetap dicatat.
- source_word: שָׁלוֹם
  choice: damai
  rationale: “Damai” merupakan padanan Indonesia yang alami dan mudah dipahami, walaupun kata Ibraninya juga dapat mencakup keutuhan dan kesejahteraan.
- source_word: נָשָׁקוּ
  choice: telah berciuman
  rationale: Terjemahan harfiah ini mempertahankan personifikasi dan citra puitis yang kuat, tanpa melemahkannya menjadi sekadar “menyatu” atau “selaras”.
theological_decisions:
- issue: Personifikasi sifat-sifat relasional dan moral
  choice: 'Mempertahankan personifikasi secara langsung: “telah bertemu” dan “telah berciuman”'
  alternative: Memparafrasakannya sebagai “menyatu dengan harmonis” atau “didamaikan”
  rationale: Teks Ibrani menggambarkan sifat-sifat tersebut sebagai pelaku. Mempertahankan gambaran itu menjaga ketegangan puitis dan teologis tanpa memasukkan penafsiran doktrinal yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan dua klausa paralel dipertahankan; istilah abstrak dibiarkan sebagai tokoh yang bertemu dan berciuman.
