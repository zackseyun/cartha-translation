  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּם יְ֭הוָה יִתֵּ֣ן הַ/טּ֑וֹב וְ֝/אַרְצֵ֗/נוּ תִּתֵּ֥ן יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/012.yaml
  text: Indeed[a], Yahweh will give what is good, and our land will yield its produce.
translation:
  language: id
  text: Sungguh, Yahweh akan memberikan apa yang baik[a], dan tanah kita akan memberikan hasilnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebaikan” atau “hal-hal yang baik.” Ungkapan Ibrani ini luas dan dalam konteksnya dapat mencakup kebaikan moral maupun material.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Sungguh
  rationale: Dalam konteks puitis ini, partikel גַּם menguatkan kepastian pernyataan, bukan sekadar menambahkan gagasan; “Sungguh” menyampaikan daya penegasannya secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: יִתֵּן
  choice: akan memberikan
  rationale: Bentuk imperfek menyatakan tindakan yang diharapkan atau dipastikan akan terjadi dalam rangkaian janji berkat di mazmur ini.
- source_word: הַטּוֹב
  choice: apa yang baik
  rationale: Ungkapan berartikel ini dapat menunjuk pada kebaikan secara luas maupun berbagai hal yang baik; terjemahan ini tidak membatasinya hanya pada berkat material.
- source_word: וְאַרְצֵנוּ
  choice: dan tanah kita
  rationale: Dalam konteks hasil bumi, אֶרֶץ menunjuk pada tanah milik umat yang menghasilkan tanaman; “tanah kita” mempertahankan kaitan pertaniannya.
- source_word: תִּתֵּן
  choice: akan memberikan
  rationale: Pengulangan verba נתן dipertahankan karena wajar dalam bahasa Indonesia dan mencerminkan kesejajaran antara pemberian Yahweh dan pemberian tanah.
- source_word: יְבוּלָהּ
  choice: hasilnya
  rationale: יְבוּל menunjuk pada hasil atau panen yang dikeluarkan tanah; “hasilnya” jelas dan cukup luas tanpa mempersempitnya pada satu jenis tanaman.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama ilahi itu alih-alih menggantinya dengan gelar.
- issue: Cakupan הַטּוֹב
  choice: apa yang baik
  alternative: kebaikan atau hal-hal yang baik
  rationale: Ungkapan Ibrani dapat mencakup kebaikan moral maupun berkat konkret. Terjemahan utama menjaga keluasan itu tanpa memutuskan bahwa maknanya hanya material.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. Pengulangan “memberikan” dipertahankan untuk mencerminkan kesejajaran Ibrani, sedangkan “tanah kita” menonjolkan konteks hasil bumi.
