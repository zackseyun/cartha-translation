id: PSA.45.17
reference: Psalms 45:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: id
  text: Aku akan membuat namamu dikenang dalam setiap generasi[a]; karena itu bangsa-bangsa akan memuji engkau[b] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku akan menyebut namamu” atau “Aku akan mengingat namamu.” Kata kerja Ibrani berbentuk kausatif dan menyiratkan tindakan aktif untuk memperingati atau membuat nama itu terus diingat.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan mengucap syukur kepadamu.” Kata kerja Ibrani dapat menyatakan pujian ataupun ucapan syukur dalam konteks ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: Aku akan membuat ... dikenang
  rationale: Bentuk Hifil dari זכר menonjolkan tindakan aktif untuk membuat nama itu terus diingat atau diperingati, bukan sekadar mengingatnya dalam batin.
- source_word: שִׁמְךָ
  choice: namamu
  rationale: Terjemahan langsung dan wajar; dalam konteks puitis ini, “nama” juga mencakup kemasyhuran dan identitas yang dikenang.
- source_word: בְּכָל דֹּר וָדֹר
  choice: dalam setiap generasi
  rationale: Ungkapan Ibrani yang secara harfiah mengulang “generasi” menyatakan keberlanjutan dari satu generasi ke generasi berikutnya; bentuk ini mempertahankan nuansa distributifnya.
- source_word: עַל כֵּן
  choice: karena itu
  rationale: Menandai akibat atau kesimpulan dari tindakan membuat nama itu dikenang.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak menunjuk kepada banyak kelompok bangsa; “bangsa-bangsa” lebih alami dalam bahasa Indonesia daripada “kaum-kaum” dan mempertahankan cakupan jamaknya.
- source_word: יְהוֹדֻךָ
  choice: akan memuji engkau
  rationale: Dalam Mazmur, Hifil dari ידה dapat menyatakan pujian maupun ucapan syukur. “Memuji” paling sesuai dengan konteks kemasyhuran raja, sementara kemungkinan “mengucap syukur” dicatat dalam catatan kaki.
- source_word: לְעוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Ungkapan berpasangan ini menegaskan keberlangsungan tanpa akhir; pilihan ini alami, puitis, dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan kata ganti orang kedua dalam mazmur pernikahan kerajaan ini
  choice: Mempertahankan sapaan langsung “-mu/engkau” tanpa menentukan identitasnya lebih lanjut
  alternative: Sapaan kepada raja keturunan Daud; atau sapaan tipologis/mesianis yang pada akhirnya digenapi dalam Mesias
  rationale: Ayat ini sendiri menyapa tokoh tersebut secara langsung, tetapi tidak mengharuskan terjemahan menentukan apakah rujukannya hanya kepada raja historis atau juga memiliki makna mesianis. Terjemahan mempertahankan keterbukaan tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. “Engkau” dipakai untuk mempertahankan sapaan langsung yang khidmat, sedangkan susunan kalimat tetap jelas bagi pembaca umum. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
