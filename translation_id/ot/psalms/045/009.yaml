  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: id
  text: Putri-putri raja ada di antara para perempuanmu yang terhormat[a]; di sebelah kananmu berdiri sang permaisuri, berhiaskan emas Ofir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara orang-orangmu yang berharga” atau “di antara para perempuan bangsawanmu.” Frasa Ibraninya sulit.
    reason: lexical_alternative
  - marker: b
    text: “Emas Ofir” adalah emas bermutu tinggi yang dikaitkan dengan Ofir, sebuah tempat yang dalam Perjanjian Lama terkenal karena kekayaan dan emasnya.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: Putri-putri raja
  rationale: Mempertahankan gambaran konkret dan bentuk konstruksi Ibrani, alih-alih meringkasnya menjadi hanya 'para putri'.
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: di antara perempuan-perempuanmu yang terhormat
  rationale: Frasa Ibrani ini sulit. Pilihan ini memahami bentuk dari akar יקר sebagai sebutan bagi orang-orang yang berharga atau terhormat dalam lingkungan tokoh yang disapa, sesuai konteks para perempuan istana.
- source_word: נִצְּבָה
  choice: berdiri
  rationale: Bentuk Nifal menggambarkan permaisuri yang telah mengambil tempat dan kini berdiri dalam adegan istana; bentuk kini alami dalam puisi Indonesia.
- source_word: שֵׁגַל
  choice: sang permaisuri
  rationale: Kata ini menunjuk kepada istri atau pendamping utama raja. 'Permaisuri' tepat dalam konteks kerajaan dan lebih khusus daripada 'ratu'.
- source_word: לִימִינְךָ
  choice: di sebelah kananmu
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan posisi kehormatan dalam gambaran istana.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: berhiaskan emas Ofir
  rationale: כֶּתֶם berarti emas bermutu tinggi, sedangkan Ofir menunjukkan asal yang termasyhur. 'Berhiaskan' menyampaikan fungsi preposisi ב dalam konteks pakaian atau perhiasan tanpa menentukan bentuk perhiasannya.
