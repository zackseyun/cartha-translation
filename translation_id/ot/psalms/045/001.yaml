  text: רָ֘חַ֤שׁ לִבִּ֨/י דָּ֘בָ֤ר ט֗וֹב אֹמֵ֣ר אָ֭נִי מַעֲשַׂ֣/י לְ/מֶ֑לֶךְ לְ֝שׁוֹנִ֗/י עֵ֤ט סוֹפֵ֬ר מָהִֽיר׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: id
  text: Hatiku meluap dengan perkataan yang baik[a]. Aku berkata, “Karyaku bagi raja[b].” Lidahku adalah pena seorang juru tulis yang terampil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tema yang indah” atau “perkara yang mulia.” Ungkapan Ibrani ini dapat menunjuk pada perkataan itu sendiri ataupun pokok yang sedang diungkapkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “tentang raja” atau “kepada raja.” Kata depan Ibrani ini dapat menyatakan peruntukan, pokok pembicaraan, atau arah sapaan.
    reason: lexical_alternative
  - marker: c
    text: Atau “yang cekatan” atau “yang siap.” Kata Ibrani ini dapat menekankan kecepatan atau kesiapan, selain kemahiran yang diperoleh melalui latihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחַשׁ
  choice: meluap
  rationale: Kata kerja ini menggambarkan gerak batin yang menggelegak atau melimpah lalu keluar menjadi ucapan; “meluap” mempertahankan citra puitis itu secara alami.
- source_word: לִבִּי
  choice: hatiku
  rationale: Mempertahankan gambaran hati sebagai pusat pikiran dan perasaan.
- source_word: דָּבָר טוֹב
  choice: perkataan yang baik
  rationale: Pilihan ini dekat dengan bentuk Ibrani dan tetap wajar dalam bahasa Indonesia, sementara kemungkinan makna “tema yang indah” atau “perkara yang mulia” dicatat dalam catatan kaki.
- source_word: אֹמֵר אֲנִי
  choice: Aku berkata
  rationale: Padanan langsung dan alami yang tidak mempersempit maknanya menjadi pembacaan atau deklamasi resmi.
- source_word: מַעֲשַׂי
  choice: karyaku
  rationale: Dalam konteks syair, kata ini kemungkinan menunjuk pada hasil ciptaan atau gubahan pemazmur; “karya” mempertahankan keluasan maknanya tanpa mengharuskan “puisi” atau “perbuatan”.
- source_word: לְמֶלֶךְ
  choice: bagi raja
  rationale: Secara alami menyatakan peruntukan atau persembahan karya tersebut, sambil mempertahankan kemungkinan hubungan lain dalam catatan kaki.
- source_word: לְשׁוֹנִי
  choice: lidahku
  rationale: Metafora anggota tubuh dipertahankan dan tidak diratakan menjadi “ucapanku” atau “kata-kataku”.
- source_word: עֵט
  choice: pena
  rationale: Padanan modern yang jelas bagi alat tulis dan cocok dengan metafora puitis.
- source_word: סוֹפֵר
  choice: juru tulis
  rationale: Menunjukkan seorang penulis terlatih dalam lingkungan kuno dan lebih tepat secara historis daripada sekadar “penulis”.
- source_word: מָהִיר
  choice: terampil
  rationale: Dalam konteks seorang juru tulis, kata sifat ini dapat menyiratkan kecekatan, kesiapan, dan kemahiran; “terampil” menghasilkan ungkapan Indonesia yang alami, dengan nuansa alternatif dicatat dalam catatan kaki.
