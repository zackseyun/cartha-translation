  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: id
  text: Putra-putramu akan menggantikan nenek moyangmu; engkau akan mengangkat mereka menjadi para penguasa di seluruh bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di seluruh negeri.” Kata Ibrani אֶרֶץ dapat berarti “bumi” atau “negeri,” bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: menggantikan
  rationale: Dalam konteks ini תַּחַת menyatakan pergantian atau suksesi, bukan posisi secara ruang. Bentuk verbal “menggantikan” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: אֲבֹתֶיךָ
  choice: nenek moyangmu
  rationale: Secara harfiah berarti “ayah-ayahmu,” tetapi dalam konteks dinasti menunjuk kepada para leluhur. “Nenek moyangmu” alami dan mempertahankan makna garis keturunan.
- source_word: בָנֶיךָ
  choice: putra-putramu
  rationale: Kata Ibrani ini berbentuk jamak maskulin dan dalam konteks kerajaan menunjuk kepada para ahli waris laki-laki. “Putra-putramu” mempertahankan kekhususan tersebut serta laras yang bermartabat.
- source_word: תְּשִׁיתֵמוֹ
  choice: engkau akan mengangkat mereka
  rationale: Kata kerja שׁית pada dasarnya berarti menaruh atau menempatkan. Dalam konteks pemberian jabatan pemerintahan, “mengangkat” menyampaikan daya idiomatisnya tanpa menambah gagasan yang asing.
- source_word: לְשָׂרִים
  choice: menjadi para penguasa
  rationale: שָׂרִים dapat berarti para pemimpin, pembesar, atau penguasa. “Para penguasa” cocok dengan konteks kerajaan dan tidak mempersempitnya menjadi gelar kebangsawanan tertentu.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh bumi
  rationale: אֶרֶץ dapat berarti “bumi” atau “negeri.” Cakupan luas bahasa kerajaan dalam mazmur ini mendukung “bumi,” sementara kemungkinan “negeri” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Cakupan הָאָרֶץ dalam konteks kerajaan yang juga memiliki sejarah penafsiran mesianik
  choice: bumi
  alternative: negeri
  rationale: “Bumi” sesuai dengan cakupan agung dan luas mazmur ini, tetapi kata Ibraninya sendiri tidak meniadakan arti “negeri.” Catatan kaki mempertahankan ambiguitas itu tanpa memaksakan pembacaan doktrinal kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa diubah secara wajar menjadi “Putra-putramu akan menggantikan nenek moyangmu” agar gagasan suksesi jelas tanpa menghasilkan ungkapan Indonesia yang kaku.
