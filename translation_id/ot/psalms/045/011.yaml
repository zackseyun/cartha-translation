  text: וְ/יִתְאָ֣ו הַ/מֶּ֣לֶךְ יָפְיֵ֑/ךְ כִּי ה֥וּא אֲ֝דֹנַ֗יִ/ךְ וְ/הִשְׁתַּֽחֲוִי לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/011.yaml
  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
translation:
  language: id
  text: Raja akan menginginkan kecantikanmu[a], sebab dialah tuanmu; sujudlah kepadanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Semoga raja menginginkan kecantikanmu.” Bentuk Ibraninya dapat dipahami sebagai pernyataan masa depan atau sebagai harapan dengan daya volitif.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “berilah hormat kepadanya”; kata kerjanya dapat menunjuk pada tindakan bersujud penuh hormat di hadapan pihak yang lebih tinggi, baik dalam konteks kerajaan maupun keagamaan. Sebagian menerjemahkannya “sembahlah dia.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: akan menginginkan
  rationale: Bentuk imperfek Hitpael orang ketiga tunggal maskulin dari אוה paling langsung dipahami sebagai pernyataan masa depan dalam konteks ini. Ungkapan ini juga mungkin mengandung daya volitif, sehingga kemungkinan tersebut dicatat dalam catatan kaki.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina definit yang secara langsung berarti “raja”; kapitalisasi di awal kalimat tidak menyiratkan gelar ilahi.
- source_word: יָפְיֵךְ
  choice: kecantikanmu
  rationale: Bentuk dengan sufiks orang kedua tunggal feminin ini menunjuk pada keelokan atau daya tarik perempuan; “kecantikanmu” alami dan tepat dalam konteks syair pernikahan.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah berikutnya dan mempertahankan hubungan kausal dalam larik puisi.
- source_word: הוּא
  choice: dialah
  rationale: Pronomina mandiri memberi penekanan; “dialah” mempertahankan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: אֲדֹנַיִךְ
  choice: tuanmu
  rationale: Berasal dari אָדוֹן dengan sufiks feminin tunggal. “Tuanmu” mempertahankan gelar relasional bagi raja tanpa mengubahnya menjadi nama atau gelar ilahi.
- source_word: וְהִשְׁתַּחֲוִי
  choice: sujudlah
  rationale: Kata kerja שׁחה menggambarkan tindakan merendahkan diri atau bersujud di hadapan pihak yang dihormati. “Sujudlah” mempertahankan gerak tubuh itu tanpa dengan sendirinya menetapkan apakah konteksnya istana atau ibadah.
- source_word: לוֹ
  choice: kepadanya
  rationale: Preposisi dengan sufiks orang ketiga tunggal maskulin, yang secara alami diterjemahkan “kepadanya”.
theological_decisions:
- issue: Apakah וְהִשְׁתַּחֲוִי לוֹ harus diterjemahkan dengan istilah yang secara tegas menyatakan ibadah religius
  choice: sujudlah kepadanya
  alternative: berilah hormat kepadanya; sembahlah dia
  rationale: Mazmur 45 berlatar pernikahan kerajaan, sedangkan kata kerja Ibrani ini dapat dipakai baik untuk penghormatan kepada penguasa manusia maupun untuk penyembahan kepada Allah. Terjemahan utama mempertahankan tindakan bersujud dan membiarkan ketegangan konteks itu tetap terbuka.
- issue: Apakah וְיִתְאָו merupakan prediksi atau ungkapan harapan/kehendak
  choice: Raja akan menginginkan
  alternative: Semoga raja menginginkan
  rationale: Bentuk imperfek secara wajar dapat dibaca sebagai masa depan, tetapi dalam rangkaian nasihat kepada mempelai perempuan mungkin juga bernuansa volitif. Bacaan masa depan dipakai dalam teks utama, sedangkan kemungkinan lainnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang ringkas. “Dialah” menjaga penekanan pronomina Ibrani. “Sujudlah” dipilih untuk mempertahankan gambaran tindakan jasmani sekaligus menghindari penetapan dini bahwa penghormatan itu semata-mata bersifat istana atau religius.
