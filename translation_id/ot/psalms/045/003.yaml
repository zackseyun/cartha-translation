  text: Strap your sword on your thigh[a], mighty warrior[b], in your splendor and your majesty.
translation:
  language: id
  text: Ikatkanlah pedangmu pada pahamu,[a] hai kesatria perkasa, dalam kemegahan dan keagunganmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Ikatlah pedangmu pada pahamu.” Dapat juga diungkapkan: “Kenakanlah pedangmu pada pahamu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani tidak menyatakan secara eksplisit hubungan frasa terakhir dengan perintah sebelumnya. Frasa itu juga dapat dipahami secara aposisional: “hai kesatria perkasa—kemegahanmu dan keagunganmu!”'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲגוֹר
  choice: Ikatkanlah
  rationale: Bentuk imperatif dari חגר menyatakan tindakan mengikat atau memasang perlengkapan pada tubuh. “Ikatkanlah” konkret, wajar dalam bahasa Indonesia modern, dan sesuai dengan tindakan memasang pedang.
- source_word: חַרְבְּךָ
  choice: pedangmu
  rationale: Objek langsung dengan akhiran orang kedua maskulin tunggal; secara langsung berarti pedang milik orang yang disapa.
- source_word: עַל יָרֵךְ
  choice: pada pahamu
  rationale: Mempertahankan gambaran spasial Ibrani bahwa pedang dikenakan pada paha. Ungkapan “di pinggangmu” lebih lazim, tetapi kurang tepat terhadap יָרֵךְ.
- source_word: גִּבּוֹר
  choice: kesatria perkasa
  rationale: Dipakai sebagai sapaan kepada tokoh kerajaan yang tampil sebagai pejuang. “Kesatria perkasa” menyampaikan daya tempur dan mempertahankan nada puisi yang luhur tanpa menjadikannya gelar teologis khusus.
- source_word: הוֹדְךָ
  choice: kemegahanmu
  rationale: הוֹד dalam konteks kerajaan menunjuk pada kemegahan, semarak, atau kemuliaan. “Kemegahan” cocok dengan citra kebesaran raja dan berpasangan alami dengan “keagungan”.
- source_word: וַהֲדָרֶךָ
  choice: dan keagunganmu
  rationale: הדר dapat berarti keagungan, keelokan, atau semarak. “Keagungan” mempertahankan laras kerajaan dan membedakannya dari הוֹד.
theological_decisions:
- issue: Sapaan kerajaan dan kemungkinan pembacaan mesianik dalam Mazmur 45
  choice: Menerjemahkan ayat ini sebagai sapaan langsung kepada seorang raja-pejuang tanpa menyatakan identitas mesianik secara eksplisit.
  alternative: Menambahkan sebutan atau rumusan yang secara eksplisit mengidentifikasi tokoh tersebut sebagai Mesias.
  rationale: Teks Ibrani ayat ini sendiri menyapa tokoh kerajaan sebagai גִּבּוֹר. Terjemahan mempertahankan makna langsung itu dan membiarkan hubungan tipologis atau mesianik ditentukan oleh konteks kanonis dan penafsiran pembaca.
- issue: Hubungan sintaksis הוֹדְךָ וַהֲדָרֶךָ dengan perintah sebelumnya
  choice: Memakai “dalam kemegahan dan keagunganmu” sebagai keterangan yang menyertai tindakan sang kesatria.
  alternative: 'Memahami kedua nomina itu secara aposisional atau sebagai seruan tersendiri: “kemegahanmu dan keagunganmu!”'
  rationale: Bahasa Ibrani tidak mencantumkan preposisi secara eksplisit sehingga hubungan sintaksisnya padat dan puitis. Bacaan keterangan menghasilkan bahasa Indonesia yang alami, sedangkan kemungkinan aposisional tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern dengan laras puitis dan bermartabat. Bentuk “kesatria” mengikuti ejaan baku. Penerjemahan mempertahankan gambaran konkret pedang pada paha serta kesejajaran dua istilah kebesaran kerajaan.
