  variant: modern standard Indonesian
source:
  edition: WLC
  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: id
  text: Mereka akan diantar dengan sukacita dan sorak-sorai; mereka akan masuk ke istana raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “istana” juga dapat berarti “balai” atau, dalam konteks lain, “bait”. Di sini, “istana” paling sesuai dengan latar pernikahan kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: mereka akan diantar
  rationale: Bentuk Hofal imperfek orang ketiga feminin jamak dari יבל menyatakan tindakan pasif, yaitu ‘dibawa’ atau ‘dituntun’. ‘Diantar’ terdengar alami dalam konteks arak-arakan pernikahan dan tetap mempertahankan nuansa pergerakan menuju istana.
- source_word: בִּשְׂמָחֹת
  choice: dengan sukacita
  rationale: Preposisi ב dengan bentuk jamak שְׂמָחוֹת menyatakan cara atau suasana yang menyertai arak-arakan. ‘Dengan sukacita’ menyampaikan makna kolektif bentuk jamak itu secara wajar dalam bahasa Indonesia.
- source_word: וָגִיל
  choice: dan sorak-sorai
  rationale: גיל menunjuk pada kegembiraan yang meluap atau penuh kemenangan. ‘Sorak-sorai’ membedakannya dari שְׂמָחוֹת sekaligus mempertahankan pasangan ungkapan perayaan.
- source_word: תְּבֹאֶינָה
  choice: mereka akan masuk
  rationale: Bentuk Qal imperfek orang ketiga feminin jamak dari בוא, ketika diikuti tempat berupa bangunan, secara alami berarti ‘masuk’.
- source_word: בְּהֵיכַל
  choice: ke istana
  rationale: הֵיכָל dapat berarti ‘istana’, ‘balai’, atau ‘bait’. Dalam latar pernikahan kerajaan Mazmur 45, ‘istana’ paling sesuai dengan konteks langsung.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Dalam rangkaian konstruksi בְּהֵיכַל מֶלֶךְ, konteks menunjuk kepada raja tertentu dalam mazmur ini. Bahasa Indonesia secara alami mengungkapkannya sebagai ‘istana raja’ tanpa perlu kata sandang.
theological_decisions:
- issue: Acuan verba feminin jamak
  choice: Kata ganti ‘mereka’ dibiarkan menunjuk kepada rombongan perempuan dalam arak-arakan pengantin berdasarkan konteks terdekat, tanpa memperinci lebih jauh.
  alternative: Menafsirkannya secara lebih umum sebagai para perempuan dalam arak-arakan.
  rationale: Bentuk-bentuk verba Ibrani adalah feminin jamak, dan ayat sebelumnya memberikan konteks rombongan pengantin. Terjemahan tidak menambahkan identitas yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Diantar’ memberi nuansa arak-arakan tanpa terlalu menafsirkan, sedangkan ‘sukacita dan sorak-sorai’ mempertahankan dua istilah kegembiraan yang berdekatan tetapi berbeda.
