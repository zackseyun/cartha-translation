  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
translation:
  language: id
  text: 'Untuk pemimpin musik: menurut “Bunga Bakung.”[a] Dari bani Korah.[b] Sebuah Maskil.[c] Nyanyian cinta.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani Syosyanim, secara harfiah berarti “bunga-bunga bakung”; di sini mungkin merupakan nama lagu atau petunjuk musikal.
    reason: lexical_alternative
  - marker: b
    text: Atau “Untuk bani Korah” atau “Oleh bani Korah.” Hubungan yang dinyatakan oleh kata depan Ibrani tidak dapat dipastikan.
    reason: ambiguity
  - marker: c
    text: Maskil adalah istilah teknis dalam judul mazmur; mungkin menunjuk pada karya untuk direnungkan atau yang bersifat mengajar.
    reason: lexical_alternative
  - marker: d
    text: Secara lebih harfiah, “nyanyian cinta-cinta” atau “nyanyian berbagai kasih”; mungkin juga dipahami sebagai “nyanyian cinta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: עַל שֹׁשַׁנִּים
  choice: menurut “Bunga Bakung”
  rationale: עַל dalam judul musikal dapat memperkenalkan lagu, laras, cara penyajian, atau instrumen, sedangkan שֹׁשַׁנִּים secara harfiah berarti bunga-bunga bakung. Tanda kutip mempertahankan kemungkinan bahwa ini nama lagu atau petunjuk musikal.
- source_word: לִבְנֵי קֹרַח
  choice: Dari bani Korah
  rationale: Kata depan ל dapat menyatakan kepengarangan, peruntukan, atau hubungan. 'Dari' cukup luwes dalam judul dan tidak memastikan salah satu kemungkinan tersebut.
- source_word: מַשְׂכִּיל
  choice: Sebuah Maskil
  rationale: Ini istilah teknis dalam judul mazmur yang arti tepatnya tidak pasti. Transliterasi menghindari kepastian semu seperti 'pengajaran' atau 'perenungan'.
- source_word: שִׁיר יְדִידֹת
  choice: Nyanyian tentang cinta kasih
  rationale: שִׁיר berarti nyanyian, sedangkan bentuk jamak יְדִידֹת berkaitan dengan cinta atau kasih. Ungkapan Indonesia ini alami, sementara bentuk jamak dan kemungkinan analisis lain dijelaskan dalam catatan.
