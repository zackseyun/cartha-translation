  text: All glorious is the king’s daughter within[b][a]; her clothing is of woven gold.
translation:
  language: id
  text: Kemuliaan putri raja itu seluruhnya ada di dalam[a]; pakaiannya terbuat dari tenunan emas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Putri raja itu seluruhnya mulia di dalam.” “Di dalam” mungkin menunjuk pada bagian dalam istana atau kamar, atau pada kemuliaan batiniahnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “pakaiannya dihiasi tatahan emas” atau “disulam dengan emas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: penuh kemuliaan
  rationale: כָּל berfungsi secara intensif bersama כְּבוּדָּה. Ungkapan “penuh kemuliaan” menyampaikan kemegahan yang menyeluruh secara alami dalam bahasa Indonesia.
- source_word: בַת מֶלֶךְ
  choice: putri raja
  rationale: Mempertahankan ungkapan Ibrani dan latar istana, tanpa menggantinya dengan gelar yang lebih interpretatif seperti “sang putri”.
- source_word: פְּנִימָה
  choice: di dalam
  rationale: Terjemahan ini mempertahankan ambiguitas apakah yang dimaksud ialah tempat di bagian dalam istana atau kemuliaan batiniah sang putri.
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: terbuat dari tenunan emas
  rationale: מִשְׁבְּצוֹת dapat menunjuk pada hasil kerajinan berpola, tenunan, sulaman, atau tatahan. Dalam konteks pakaian, “tenunan emas” merupakan ungkapan alami tanpa mengunci makna pada perhiasan.
- source_word: לְבוּשָׁהּ
  choice: pakaiannya
  rationale: Kata ini menunjuk pada apa yang dikenakannya secara umum; “pakaiannya” alami dan tidak mempersempitnya menjadi satu jenis jubah tertentu.
theological_decisions:
- issue: Kemungkinan makna batiniah atau lokasi dari פְּנִימָה
  choice: Mempertahankan “di dalam” dalam teks utama
  alternative: “dalam batinnya” atau “di dalam istana/kamar”
  rationale: Teks Ibrani tidak memastikan apakah frasa ini menggambarkan keelokan batiniah atau keberadaan putri di ruang dalam; terjemahan tidak seharusnya menyelesaikan ketegangan itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan predikatif dibuat alami, sedangkan “di dalam” sengaja dipertahankan agar ambiguitas sumber tetap terlihat.
