  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: id
  text: Engkau mengasihi kebenaran dan membenci kejahatan. Karena itu, Allah, Allahmu,[a] telah mengurapi engkau dengan minyak sukacita melebihi rekan-rekanmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena itu, ya Allah, Allahmu telah mengurapi engkau dengan minyak sukacita melebihi rekan-rekanmu.” Kata “Allah” yang pertama dapat dipahami sebagai sapaan, bukan sebagai subjek verba.
    reason: alternative_reading
  - marker: b
    text: Dikutip dalam Ibrani 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Engkau mencintai
  rationale: Bentuk Qal perfektif orang kedua maskulin tunggal menyatakan sikap yang mantap dari orang yang disapa. Bentuk kini bahasa Indonesia menyampaikan sifat yang terus berlaku secara alami.
- source_word: צֶּדֶק
  choice: kebenaran
  rationale: Kata ini menunjuk pada apa yang benar, adil, dan selaras dengan tatanan moral. “Kebenaran” mempertahankan keluasan maknanya, tanpa membatasinya hanya pada pelaksanaan keadilan hukum.
- source_word: וַתִּשְׂנָא
  choice: dan membenci
  rationale: Terjemahan koordinatif mempertahankan kesejajaran puitis dengan “mencintai” serta sapaan orang kedua.
- source_word: רֶשַׁע
  choice: kefasikan
  rationale: Istilah ini menunjuk pada kejahatan atau perilaku yang bersalah secara moral. “Kefasikan” mempertahankan bobot etisnya dan membentuk kontras yang jelas dengan “kebenaran”.
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Ungkapan ini memperkenalkan akibat atau alasan yang ditarik dari kecintaan kepada kebenaran dan kebencian terhadap kefasikan.
- source_word: מְשָׁחֲךָ
  choice: telah mengurapi engkau
  rationale: Bentuk Qal perfektif dengan akhiran orang kedua diterjemahkan sebagai tindakan yang telah dilakukan. “Mengurapi” mempertahankan latar kerajaan dan pengkhususan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam teks utama, אֱלֹהִים pertama dipahami sebagai subjek verba “telah mengurapi”. Kemungkinan bahwa kata ini merupakan sapaan dipertahankan dalam catatan kaki.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: 'Bentuk dengan akhiran orang kedua tunggal diterjemahkan langsung dan dipahami sebagai aposisi yang menjelaskan subjek: “Allah, Allahmu”.'
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: minyak sukacita
  rationale: Rangkaian konstruksi ini menyatakan minyak yang berkaitan dengan kegembiraan atau perayaan. Ungkapan “minyak sukacita” alami, mudah dipahami, dan tetap puitis.
- source_word: מֵחֲבֵרֶיךָ
  choice: melebihi rekan-rekanmu
  rationale: Preposisi מִן menyatakan perbandingan. “Melebihi” menyampaikan kedudukan atau perlakuan yang melampaui orang-orang yang terkait dengan tokoh yang disapa.
theological_decisions:
- issue: Fungsi sintaksis אֱלֹהִים pertama dalam frasa אֱלֹהִים אֱלֹהֶיךָ
  choice: 'Dipahami sebagai subjek: “Allah, Allahmu, telah mengurapi engkau.”'
  alternative: 'Dipahami sebagai vokatif: “Karena itu, ya Allah, Allahmu telah mengurapi engkau.”'
  rationale: Bahasa Ibrani memungkinkan kedua pembacaan. Teks utama memilih pembacaan subjek karena membentuk klausa verbal yang langsung dan alami, sedangkan pembacaan vokatif dicatat agar ketegangan sintaksis dan teologis yang asli tidak dihilangkan.
- issue: Hubungan ayat ini dengan Ibrani 1:9
  choice: Terjemahan Mazmur ditentukan pertama-tama dari teks Ibrani, dengan rujukan silang dicatat.
  alternative: Menyesuaikan teks utama secara langsung dengan cara ayat ini digunakan dalam Ibrani 1:9.
  rationale: Rujukan Perjanjian Baru penting bagi pembaca, tetapi tidak boleh secara diam-diam meniadakan ambiguitas sintaksis yang terdapat dalam teks Ibrani Mazmur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Mencintai” dan “sukacita” dipilih agar jelas bagi pembaca umum, sedangkan “kefasikan” mempertahankan bobot moral dari kontras Ibrani. Tanda baca membagi kalimat untuk keterbacaan tanpa mengubah hubungan sebab-akibat.
