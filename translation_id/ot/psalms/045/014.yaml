  text: לִ/רְקָמוֹת֮ תּוּבַ֪ל לַ֫/מֶּ֥לֶךְ בְּתוּל֣וֹת אַ֭חֲרֶי/הָ רֵעוֹתֶ֑י/הָ מ֖וּבָא֣וֹת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/014.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: id
  text: Dengan pakaian bersulam ia diantar kepada raja[a]; para perawan yang mengikutinya, sahabat-sahabatnya[b], dibawa kepadamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dengan sulaman ia dibawa kepada raja.”'
    reason: lexical_alternative
  - marker: b
    text: Istilah yang diterjemahkan “para perawan” juga dapat diterjemahkan “gadis-gadis”, tetapi kata Ibraninya secara lebih khusus menunjuk perempuan yang belum menikah.
    reason: lexical_alternative
  - marker: c
    text: “Kepadamu” mengikuti bentuk feminin tunggal dalam teks Ibrani, yang tampaknya beralih untuk menyapa mempelai perempuan secara langsung. Sejumlah terjemahan menghaluskannya sehingga mengacu kepada raja.
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: Dengan pakaian bersulam
  rationale: Bentuk ini menunjuk pada sulaman atau kain berhias. Kata 'pakaian' ditambahkan secara wajar berdasarkan konteks busana dan arak-arakan pengantin.
- source_word: תּוּבַל
  choice: ia diantar
  rationale: Bentuk pasif dari יבל berarti dibawa atau dituntun. 'Diantar' mempertahankan kepasifan sekaligus terdengar alami dalam konteks arak-arakan resmi.
- source_word: לַמֶּלֶךְ
  choice: kepada raja
  rationale: Preposisi ל menyatakan arah atau tujuan; 'kepada raja' merupakan padanan langsung dan alami.
- source_word: בְּתוּלוֹת
  choice: para perawan
  rationale: Istilah ini secara lebih khusus menunjuk perempuan muda yang belum menikah dan, dalam konteks ini, para pengiring pengantin.
- source_word: אַחֲרֶיהָ
  choice: yang mengikutinya
  rationale: Secara harfiah berarti 'di belakangnya' atau 'sesudahnya'; dalam arak-arakan, 'yang mengikutinya' lebih alami tanpa mengubah hubungan spasialnya.
- source_word: רֵעוֹתֶיהָ
  choice: sahabat-sahabatnya
  rationale: Kata ini menyatakan para sahabat atau teman perempuan. Pilihan ini mempertahankan hubungan personal tanpa menetapkan peran resmi yang tidak dinyatakan.
- source_word: מוּבָאוֹת
  choice: dibawa
  rationale: Partisipel pasif feminin jamak dari בוא menerangkan para perawan atau sahabat tersebut. 'Dibawa' menyampaikan gerak pasif secara langsung.
- source_word: לָךְ
  choice: kepadamu
  rationale: Akhiran pronominalnya adalah orang kedua feminin tunggal. 'Kepadamu' mempertahankan peralihan sapaan langsung kepada mempelai perempuan.
theological_decisions:
- issue: Peralihan penerima sapaan pada לָךְ
  choice: Mempertahankan orang kedua feminin tunggal sebagai 'kepadamu'.
  alternative: Menghaluskannya menjadi 'kepadanya', 'kepada raja', atau 'bersamanya'.
  rationale: Teks Masoret memiliki akhiran orang kedua feminin tunggal, sehingga terjadi peralihan puitis dari penyebutan mempelai perempuan dalam orang ketiga menjadi sapaan langsung kepadanya. Ketegangan gramatikal ini dipertahankan dan tidak diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara bentuk pasif, gambaran arak-arakan, dan peralihan sapaan feminin pada akhir ayat tetap dipertahankan.
