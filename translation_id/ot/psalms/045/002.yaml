source:
  edition: WLC
  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: id
  text: Engkau lebih indah daripada anak-anak manusia[a]; kemurahan tercurah pada bibirmu[b]; sebab itu Allah telah memberkatimu untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lebih indah daripada anak-anak manusia.” Ungkapan puitis ini membandingkan raja dengan manusia lainnya.
    reason: cultural_note
  - marker: b
    text: Atau “perkenanan,” “pesona,” atau “anugerah.” Dalam kaitannya dengan bibir, kata ini dapat menunjuk pada tutur yang penuh kemurahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: Engkau terelok
  rationale: Bentuk puitis-intensif dari יפה menyatakan keelokan yang melampaui. "Terelok" mempertahankan daya puisi dan perbandingan tersirat tanpa membatasi maknanya hanya pada ketampanan fisik.
- source_word: מִבְּנֵי אָדָם
  choice: di antara anak-anak manusia
  rationale: Ungkapan harfiah "anak-anak manusia" menunjuk kepada manusia lain. Dalam bahasa Indonesia, "terelok di antara" menyampaikan perbandingan secara alami sekaligus mempertahankan idiom puitis Ibrani.
- source_word: הוּצַק
  choice: tercurah
  rationale: Bentuk pasif dari יצק berarti dituangkan atau dicurahkan. "Tercurah" mempertahankan gambaran kelimpahan dan sesuai dengan gaya puisi.
- source_word: חֵן
  choice: kemurahan
  rationale: חֵן dapat berarti perkenanan, keelokan, pesona, atau sifat penuh kasih. Bersama "bibirmu", kata ini terutama menggambarkan tutur yang penuh kemurahan, tetapi tetap menyisakan nuansa perkenanan dan daya tarik.
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: pada bibirmu
  rationale: Meskipun preposisinya dapat berarti "di/dengan", "pada bibirmu" merupakan padanan Indonesia yang wajar bagi metafora sesuatu yang dicurahkan ke atas bibir.
- source_word: עַל כֵּן
  choice: sebab itu
  rationale: Penghubung ini menyatakan kesimpulan atau alasan. "Sebab itu" alami, jelas, dan tetap bernada luhur.
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: Allah telah memberkatimu
  rationale: Verba perfek dengan sufiks orang kedua tunggal maskulin paling wajar dibaca dengan אֱלֹהִים sebagai subjek. Bentuk "telah memberkati" menyatakan tindakan yang sudah terjadi beserta hasilnya yang tetap berlaku.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. "Untuk selama-lamanya" cocok dengan gaya mazmur yang luhur dan mudah dipahami.
theological_decisions:
- issue: Apakah אֱלֹהִים merupakan subjek ("Allah telah memberkatimu") atau sapaan ("ya Allah")?
  choice: 'אֱלֹהִים diterjemahkan sebagai subjek: "Allah telah memberkatimu".'
  alternative: 'Membacanya sebagai sapaan: "sebab itu, ya Allah, Ia telah memberkatimu", biasanya dengan unsur yang dipahami atau diselaraskan dengan ayat berikutnya.'
  rationale: Struktur klausa ayat ini paling langsung menempatkan אֱלֹהִים sebagai subjek verba. Terjemahan tidak memasukkan kata-kata dari ayat berikutnya dan tidak memaksakan penafsiran kristologis tertentu, sehingga ketegangan teologis dalam konteks mazmur tetap terpelihara.
- issue: Cakupan makna חֵן pada bibir sang raja
  choice: kemurahan
  alternative: anugerah, perkenanan, pesona, atau tutur yang menawan
  rationale: Dalam kaitannya dengan bibir, "kemurahan" dapat menunjuk kepada kualitas tutur yang ramah dan penuh kasih, sambil tetap mempertahankan nuansa perkenanan. Catatan kaki mengakui keluasan makna Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan register puitis dan luhur. Pronomina "Engkau" dipakai karena tuturan langsung kepada raja dalam puisi, sedangkan "Allah" mengikuti penggunaan Indonesia yang umum. Susunan paralel dan metafora pencurahan dipertahankan.
