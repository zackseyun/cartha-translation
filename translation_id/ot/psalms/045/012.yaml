  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: id
  text: Dan Putri Tirus akan datang membawa pemberian[a]; orang-orang kaya di antara rakyat akan memohon perkenananmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “upeti” atau “persembahan”; kata Ibrani מִנְחָה dapat berarti pemberian, upeti, atau persembahan sesuai konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memohon wajahmu”; ungkapan Ibrani ini berarti memohon atau mencari perkenanan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת צֹר
  choice: Putri Tirus
  rationale: Ungkapan harfiah 'anak perempuan Tirus' mempersonifikasikan kota atau penduduk Tirus. 'Putri Tirus' mempertahankan gambaran Ibrani secara wajar dalam bahasa Indonesia; waw dapat berfungsi sebagai penghubung dalam rangkaian puisi dan tidak harus diterjemahkan tersendiri.
- source_word: בְּמִנְחָה
  choice: membawa pemberian
  rationale: מִנְחָה dapat berarti pemberian, upeti, atau persembahan. Dalam konteks kerajaan, 'pemberian' paling netral, sedangkan 'membawa' mengungkapkan fungsi preposisi בְ secara alami.
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: akan memohon perkenananmu
  rationale: Secara harfiah ungkapan ini menyebut 'wajahmu', tetapi konstruksi idiomatisnya berarti memohon atau mencari perkenanan seseorang. Pilihan ini juga mempertahankan sapaan orang kedua tunggal feminin melalui akhiran '-mu'.
- source_word: עֲשִׁירֵי עָם
  choice: orang-orang kaya di antara bangsa itu
  rationale: Frasa konstruksi ini menunjuk kepada kaum kaya dari suatu bangsa atau masyarakat. 'Bangsa itu' secara wajar merujuk kepada Tirus dalam baris yang sama, tetapi tetap tidak menentukan bahwa mereka hanya para penguasa.
