  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: id
  text: Takhta-Mu[a], ya Allah, kekal selama-lamanya; tongkat kerajaan-Mu adalah tongkat keadilan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Takhta-Mu adalah Allah untuk selama-lamanya,” atau, “Takhta ilahi-Mu kekal selama-lamanya.” Susunan bahasa Ibrani diperdebatkan; teks utama mengikuti pembacaan sebagai sapaan langsung.
    reason: alternative_reading
  - marker: b
    text: Atau, “tongkat keadilan adalah tongkat kerajaan-Mu.”
    reason: alternative_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: Takhta-Mu
  rationale: כִּסֵּא menunjuk pada takhta atau tempat duduk seorang penguasa. Dalam mazmur kerajaan ini, “takhta” merupakan padanan Indonesia yang alami dan tepat.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: אֱלֹהִים paling wajar dipahami sebagai sapaan langsung dalam konteks ini. Partikel “ya” menandai bentuk vokatif secara alami dalam bahasa Indonesia, sementara kemungkinan sintaksis lain dicatat dalam catatan kaki.
- source_word: עוֹלָם וָעֶד
  choice: kekal selama-lamanya
  rationale: Ungkapan berpasangan ini menyatakan keberlangsungan tanpa akhir dengan tekanan puitis. “Kekal selama-lamanya” mempertahankan penegasan tersebut dalam bahasa Indonesia yang bermartabat dan mudah dipahami.
- source_word: שֵׁבֶט
  choice: tongkat
  rationale: Dalam konteks kerajaan, שֵׁבֶט adalah tongkat yang melambangkan wewenang raja. “Tongkat kerajaan” menyampaikan fungsi simbolis ini tanpa memakai istilah asing.
- source_word: מִישֹׁר
  choice: keadilan
  rationale: מִישֹׁר secara harfiah berkaitan dengan kelurusan dan dalam konteks etis menyatakan kelurusan atau keadilan. “Keadilan” paling alami dalam hubungan dengan pelaksanaan kekuasaan kerajaan, tanpa membatasi maknanya pada prosedur hukum semata.
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: tongkat kerajaan-Mu
  rationale: Padanan ini mempertahankan hubungan konstruksi Ibrani antara tongkat kekuasaan dan kerajaan milik pihak yang disapa.
theological_decisions:
- issue: Fungsi sintaksis dan teologis אֱלֹהִים pada bagian pertama ayat
  choice: 'Sapaan langsung: “Takhta-Mu, ya Allah, kekal selama-lamanya”'
  alternative: “Takhta-Mu adalah Allah untuk selama-lamanya” atau “Takhta ilahi-Mu kekal selama-lamanya”
  rationale: Pembacaan vokatif paling alami dalam alur sapaan mazmur dan memiliki dukungan kuat dalam penerimaan kuno. Namun, susunan Ibraninya telah dipahami dengan lebih dari satu cara; karena itu, alternatif yang sungguh mungkin dipertahankan dalam catatan kaki agar ketegangan teks tidak dihilangkan.
- issue: Susunan klausa nominal שֵׁבֶט מִישֹׁר שֵׁבֶט מַלְכוּתֶךָ
  choice: “tongkat kerajaan-Mu adalah tongkat keadilan”
  alternative: “tongkat keadilan adalah tongkat kerajaan-Mu”
  rationale: Frasa definit “tongkat kerajaan-Mu” paling wajar diperlakukan sebagai subjek, sedangkan “tongkat keadilan” sebagai predikat. Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan makna klausa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. Kapitalisasi pronomina “-Mu” mengikuti kebiasaan teks keagamaan Indonesia untuk pihak ilahi. Pengulangan “tongkat” dipertahankan karena merupakan ciri paralelisme dan penekanan teks sumber.
