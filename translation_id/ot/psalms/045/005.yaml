source:
  edition: WLC
  text: חִצֶּ֗י/ךָ שְׁנ֫וּנִ֥ים עַ֭מִּים תַּחְתֶּ֣י/ךָ יִפְּל֑וּ בְּ֝/לֵ֗ב אוֹיְבֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/005.yaml
  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: id
  text: Anak-anak panahmu tajam[a]; bangsa-bangsa jatuh di bawahmu; anak-anak panah itu tertancap di jantung musuh-musuh raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Anak-anak panahmu tajam—bangsa-bangsa jatuh di bawahmu—di jantung musuh-musuh raja.” Susunan bahasa Ibrani sangat padat dan puitis.
    reason: Alternatif yang lebih harfiah mempertahankan sintaksis Ibrani yang eliptis dan ambiguitas hubungan antarfrasa.
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: anak-anak panahmu
  rationale: Bentuk jamak חֵץ dengan akhiran orang kedua tunggal maskulin berarti ‘anak-anak panahmu’; ini padanan Indonesia modern yang langsung dan alami.
- source_word: שְׁנוּנִים
  choice: tajam
  rationale: Bentuk ini menyatakan keadaan diasah atau tajam. Predikat ‘tajam’ ringkas dan wajar dalam puisi Indonesia.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak עַם menunjuk kepada sejumlah kelompok bangsa atau masyarakat. ‘Bangsa-bangsa’ mempertahankan bentuk jamak dan sesuai dengan konteks mazmur kerajaan.
- source_word: תַּחְתֶּיךָ
  choice: di bawahmu
  rationale: Secara langsung berarti ‘di bawah engkau’. Ungkapan ini mempertahankan gambaran penaklukan tanpa menambahkan ‘kekuasaan’ atau ‘kaki’, yang tidak disebutkan dalam teks.
- source_word: יִפְּלוּ
  choice: jatuh
  rationale: Imperfek orang ketiga jamak dari נפל dapat bernuansa kini yang hidup atau masa depan. ‘Jatuh’ mempertahankan daya langsung puisi dan tidak memaksakan penanda waktu.
- source_word: בְּלֵב
  choice: terancap di jantung
  rationale: Secara harfiah berarti ‘di dalam jantung/hati’. Karena sintaksis Ibrani sangat padat, ‘terancap’ menyatakan secara alami keberadaan anak panah di dalam sasaran sambil mempertahankan citra konkret.
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: musuh-musuh raja
  rationale: Rangkaian konstruksi ini secara langsung berarti ‘musuh-musuh raja’. Kata ‘raja’ dipertahankan dan tidak diselaraskan menjadi ‘musuh-musuhmu’.
theological_decisions:
- issue: Rujukan ‘raja’ dalam mazmur kerajaan yang dapat dibaca secara mesianik
  choice: Mempertahankan sebutan langsung ‘raja’ tanpa mengidentifikasikannya secara eksplisit sebagai Mesias dalam terjemahan.
  alternative: Menerjemahkan atau memperluasnya dengan identifikasi mesianik yang eksplisit.
  rationale: Teks Ibrani hanya mengatakan ‘raja’. Terjemahan mempertahankan cakrawala historis-puitis dan ketegangan teologisnya, sehingga pembacaan tipologis atau mesianik tetap menjadi ranah penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan utama dibuat cukup alami bagi pembaca umum, sedangkan catatan kaki mempertahankan bentuk harfiah yang sangat padat. ‘Jantung’ dipilih untuk citra jasmani dalam konteks anak panah; ‘di bawahmu’ sengaja dipertahankan agar tidak menambahkan unsur yang tidak terdapat dalam sumber.
