source:
  edition: WLC
  text: וַ/הֲדָ֬רְ/ךָ֨ צְלַ֬ח רְכַ֗ב עַֽל דְּבַר אֱ֭מֶת וְ/עַנְוָה צֶ֑דֶק וְ/תוֹרְ/ךָ֖ נוֹרָא֣וֹת יְמִינֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: id
  text: Dalam keagunganmu, berkendaralah maju dengan jaya demi kebenaran, kelemahlembutan, dan keadilan.[a] Biarlah tangan kananmu mengajarkan kepadamu hal-hal yang dahsyat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “demi kebenaran dan keadilan yang disertai kerendahan hati.” Ungkapan Ibraninya padat dan dapat dipahami sebagai rangkaian unsur sejajar atau sebagai frasa yang saling menerangkan.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “Tangan kananmu akan mengajarkan kepadamu hal-hal yang menggentarkan.”'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: Dalam keagunganmu
  rationale: הָדָר menyatakan keagungan, semarak, atau kemuliaan. Ungkapan berpreposisi ini menghubungkan keagungan sang raja dengan gerak maju yang diperintahkan, tanpa harus menerjemahkan waw secara terpisah.
- source_word: צְלַח רְכַב
  choice: berkendaralah maju dengan jaya
  rationale: צְלַח dapat berarti berhasil, maju, atau berjaya, sedangkan רְכַב berarti berkendara atau menunggang. Gabungan ini mempertahankan gambaran raja-pejuang yang bergerak maju dengan keberhasilan.
- source_word: עַל דְּבַר אֱמֶת
  choice: demi kebenaran
  rationale: דְּבַר di sini dapat menunjuk pada perkara atau kepentingan. Dalam konteks kerajaan dan perjuangan, 'demi kebenaran' secara wajar menyampaikan tindakan atas nama atau untuk kepentingan kebenaran.
- source_word: וְעַנְוָה צֶדֶק
  choice: kelemahlembutan, dan keadilan
  rationale: Frasa Ibrani ini padat dan hubungan kedua nomina tidak sepenuhnya jelas. Membacanya sebagai unsur-unsur sejajar menjaga kedua istilah secara terbuka; kemungkinan bahwa צֶדֶק menerangkan atau terkait lebih erat dengan עַנְוָה dicatat dalam catatan kaki.
- source_word: וְתוֹרְךָ
  choice: Biarlah ... mengajarkan kepadamu
  rationale: Bentuk Hifil dari ירה berarti mengajar, menunjukkan, atau memberi petunjuk. Bentuk feminin tunggal sesuai dengan subjek berikutnya, 'tangan kananmu'; bentuk 'biarlah' mempertahankan nuansa volitif yang mungkin dalam rangkaian puitis ini.
- source_word: נוֹרָאוֹת
  choice: hal-hal yang dahsyat
  rationale: Bentuk dari ירא menunjuk pada hal-hal yang membangkitkan rasa takut, gentar, atau takjub. 'Dahsyat' mempertahankan perpaduan antara kegentaran dan keagungan tanpa menambahkan kata 'perbuatan' yang tidak dinyatakan secara eksplisit.
- source_word: יְמִינֶךָ
  choice: tangan kananmu
  rationale: Diterjemahkan secara harfiah untuk mempertahankan citra puitis tentang kuasa, kecakapan, dan tindakan kemenangan.
theological_decisions:
- issue: Gambaran raja-pejuang dalam mazmur yang kemudian dibaca secara mesianik
  choice: Mempertahankan sapaan langsung kepada raja dan citra berkendara maju tanpa memasukkan sebutan mesianik secara eksplisit.
  alternative: Merumuskan ayat ini dengan acuan langsung kepada Mesias.
  rationale: Teks ayat berbicara kepada seorang raja dalam puisi kerajaan. Terjemahan mempertahankan makna historis-sastrawinya sambil tetap terbuka bagi pembacaan kanonis dan mesianik.
- issue: Hubungan sintaksis עַנְוָה צֶדֶק
  choice: 'Menerjemahkan keduanya sebagai unsur sejajar: ''kelemahlembutan, dan keadilan''.'
  alternative: Menerjemahkan sebagai satu frasa terpadu, misalnya 'keadilan yang disertai kerendahan hati'.
  rationale: Susunan Ibrani sangat ringkas dan ambigu. Bacaan sejajar mempertahankan kedua gagasan tanpa memaksakan hubungan atributif, sementara alternatif dicatat agar ketegangan sintaksis tidak hilang.
- issue: Nuansa וְתוֹרְךָ
  choice: Menggunakan bentuk volitif, 'Biarlah tangan kananmu mengajarkan kepadamu'.
  alternative: Menggunakan pernyataan masa depan, 'Tangan kananmu akan mengajarkan kepadamu'.
  rationale: Rangkaian imperatif memungkinkan nuansa volitif, tetapi bentuk Ibraninya juga dapat dipahami sebagai pernyataan. Kedua kemungkinan dipertahankan melalui teks utama dan catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Keagungan', 'berkendara maju dengan jaya', dan 'tangan kananmu' mempertahankan suasana kerajaan serta citra peperangan. 'Kelemahlembutan' dipilih daripada 'kerendahan hati' dalam teks utama agar mencakup nuansa עַנְוָה tanpa mempersempitnya, sedangkan 'hal-hal yang dahsyat' menjaga unsur takjub sekaligus gentar.
