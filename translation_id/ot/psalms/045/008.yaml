  text: מֹר וַ/אֲהָל֣וֹת קְ֭צִיעוֹת כָּל בִּגְדֹתֶ֑י/ךָ מִֽן הֵ֥יכְלֵי שֵׁ֝֗ן מִנִּ֥י שִׂמְּחֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: id
  text: Semua pakaianmu harum oleh mur, gaharu, dan kasia; dari istana-istana gading[a], alat-alat musik petik[b] telah membuatmu bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa ini dapat diterjemahkan “dari istana-istana gading,” “keluar dari istana-istana gading,” atau “oleh karena istana-istana gading.”
    reason: alternative_reading
  - marker: b
    text: Teks Ibrani tidak menyebutkan subjek dari “telah membuatmu bersukacita.” Kemungkinannya antara lain musik, para pemusik, atau—menurut tafsiran tradisional—alat-alat musik petik.
    reason: alternative_reading
lexical_decisions:
- source_word: מֹר
  choice: mur
  rationale: Padanan baku untuk damar aromatik yang digunakan sebagai wewangian.
- source_word: וַאֲהָלוֹת
  choice: gaharu
  rationale: Yang dimaksud ialah kayu harum, bukan tanaman lidah buaya modern; “gaharu” menyampaikan rujukan aromatiknya dengan jelas dalam bahasa Indonesia.
- source_word: קְצִיעוֹת
  choice: kulit kayu manis
  rationale: Merujuk pada cassia, yaitu kulit kayu aromatik sejenis kayu manis; padanan ini lebih mudah dipahami daripada transliterasi “kasia”.
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: Semua pakaianmu semerbak
  rationale: Klausa Ibrani tidak memakai verba dan menjajarkan rempah-rempah dengan seluruh pakaian sang raja. “Semerbak” secara wajar menyatakan bahwa pakaian itu dipenuhi keharuman tersebut tanpa menyiratkan bahwa pakaian terbuat dari rempah-rempah.
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: dari istana-istana berhiaskan gading
  rationale: Dalam konteks kerajaan, הֵיכָל paling tepat berarti istana atau balairung, sedangkan שֵׁן secara idiomatis menunjuk pada gading. “Berhiaskan” menghindari kesan bahwa seluruh istana terbuat dari gading.
- source_word: מִנִּי
  choice: dari
  rationale: Preposisi ini sulit, tetapi paling wajar dipahami bersama frasa sebelumnya sebagai penanda asal atau tempat datangnya kegembiraan.
- source_word: שִׂמְּחוּךָ
  choice: telah membuatmu bersukacita
  rationale: Bentuk Piel perfektum orang ketiga jamak dengan akhiran orang kedua maskulin tunggal berarti “mereka telah membuatmu bersukacita.”
- source_word: implicit subject of שִׂמְּחוּךָ
  choice: alat-alat musik petik
  rationale: Teks Ibrani tidak menyatakan subjek jamak verba tersebut. Alat musik petik merupakan tafsiran tradisional yang sesuai dengan suasana perayaan, tetapi ketidakpastian tetap dinyatakan dalam catatan kaki.
theological_decisions:
- issue: Latar kerajaan dan kemungkinan pembacaan mesianik Mazmur 45
  choice: Menerjemahkan ayat menurut latar langsungnya sebagai perayaan kerajaan tanpa menambahkan sebutan mesianik.
  alternative: Memakai ungkapan yang secara eksplisit mengarahkan ayat ini kepada Mesias berdasarkan pembacaan kanonis kemudian.
  rationale: Ayat ini sendiri menggambarkan kemewahan dan sukacita di lingkungan istana. Kemungkinan pemaknaan tipologis atau mesianik tidak boleh disisipkan ke dalam kata-kata yang tidak dinyatakan oleh teks Ibrani.
- issue: Subjek yang tidak dinyatakan pada שִׂמְּחוּךָ
  choice: Memakai “alat-alat musik petik” dalam teks dan menandai ketidakpastiannya dengan catatan kaki.
  alternative: Memakai “musik,” “para pemusik,” atau mempertahankan subjek yang sepenuhnya tak disebutkan.
  rationale: Verba Ibrani menuntut subjek jamak, tetapi subjek itu tidak tertulis. Pilihan tradisional sesuai dengan konteks pesta kerajaan, sedangkan catatan kaki mencegah tafsiran tersebut dianggap eksplisit dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Istilah konkret dan lazim dipilih untuk bahan-bahan aromatik, sementara ketidakjelasan sintaksis Ibrani dipertahankan melalui catatan kaki.
