base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/010.yaml
  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: id
  text: Dengarlah, hai putri, dan lihatlah; condongkanlah telingamu, dan lupakanlah bangsamu serta keluarga ayahmu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “rumah ayahmu.” Ungkapan ini berarti rumah tangga atau keluarga asal dari pihak ayah.'
    reason: idiom_clarification
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Dengarlah
  rationale: Bentuk perintah feminin tunggal dari שׁמע. Pilihan ini menyampaikan ajakan untuk mendengarkan dengan sungguh-sungguh secara alami dalam bahasa Indonesia.
- source_word: בַת
  choice: hai putri
  rationale: Sapaan langsung kepada seorang perempuan. 'Putri' cocok dengan konteks pengantin kerajaan, sedangkan 'hai' menandai vokatif secara jelas dan tetap bermartabat.
- source_word: וּרְאִי
  choice: dan lihatlah
  rationale: Bentuk perintah feminin tunggal dari ראה; terjemahan langsung ini mempertahankan urutan perintah dalam bahasa Ibrani.
- source_word: וְהַטִּי אָזְנֵךְ
  choice: arahkanlah telingamu
  rationale: Ungkapan harfiah tentang mencondongkan atau mengarahkan telinga untuk mendengarkan dengan penuh perhatian. Pilihan ini mempertahankan citra Ibrani tanpa terdengar terlalu usang.
- source_word: וְשִׁכְחִי
  choice: dan lupakanlah
  rationale: Makna leksikal langsung dari שכח dipertahankan dan tidak diperhalus menjadi 'tinggalkanlah'; konteksnya menyiratkan perubahan kesetiaan yang tegas.
- source_word: עַמֵּךְ
  choice: bangsamu
  rationale: עם di sini menunjuk kelompok asal etnis atau sosial sang putri. 'Bangsamu' lebih tepat daripada 'umatmu' dalam konteks kerajaan dan pernikahan.
- source_word: וּבֵית אָבִיךְ
  choice: serta keluarga ayahmu
  rationale: בית אב adalah ungkapan bagi rumah tangga atau keluarga pihak ayah, bukan semata-mata bangunan. Terjemahan ini menyampaikan makna sosial-kekeluargaan secara alami.
theological_decisions:
- issue: Daya desakan kepada pengantin perempuan
  choice: Nas ini disajikan sebagai seruan langsung agar sang pengantin mengalihkan kesetiaan utamanya dari bangsa dan keluarga asal kepada pernikahan kerajaan.
  alternative: Seruan bergaya hikmat yang bersifat umum untuk memperhatikan nasihat, tanpa penekanan pada peralihan kesetiaan.
  rationale: Rangkaian bentuk perintah memuncak pada perintah untuk melupakan bangsa dan keluarga ayahnya. Terjemahan mempertahankan ketegasan itu tanpa memasukkan penafsiran doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Pengulangan akhiran -lah mempertahankan rangkaian perintah Ibrani; 'hai putri' menandai sapaan puitis tanpa gaya yang terlalu arkais. Penanda catatan kaki [a] ditempatkan sesudah frasa yang dijelaskannya.
