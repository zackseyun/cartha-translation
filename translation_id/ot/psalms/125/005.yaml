source:
  edition: WLC
  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/005.yaml
  text: But as for those who turn aside to their crooked ways[a], Yahweh will lead them away with the workers of iniquity[c][b]. Peace be upon Israel.
translation:
  language: id
  text: Tetapi mereka yang menyimpang ke jalan-jalan mereka yang bengkok[a], Yahweh akan membawa mereka pergi bersama para pelaku kejahatan[b]. Damai sejahtera atas Israel![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “ke jalan-jalan mereka yang berliku-liku” atau “ke jalan-jalan mereka yang sesat.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Yahweh akan menggiring mereka bersama orang-orang yang berbuat jahat.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “Damai sejahtera atas Israel”—sebuah berkat atau doa singkat bagi kesejahteraan Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַמַּטִּים
  choice: Tetapi mereka yang menyimpang
  rationale: Partisipel dari נטה menyatakan tindakan berbelok atau menyimpang. Kata hubung וְ dipahami secara adversatif karena ayat ini mengontraskan kelompok tersebut dengan orang-orang lurus pada ayat sebelumnya.
- source_word: עַקַלְקַלּוֹתָם
  choice: ke jalan mereka yang berliku-liku
  rationale: Bentuk ini menunjuk pada jalan atau perilaku yang bengkok dan sesat. Ungkapan tersebut mempertahankan metafora perjalanan sekaligus makna moralnya.
- source_word: יוֹלִיכֵם
  choice: akan dibawa pergi
  rationale: Bentuk Hifil dari הלך berarti menyebabkan pergi atau membawa. Bentuk pasif Indonesia memungkinkan Yahweh tetap tampil sebagai pelaku eksplisit dan menyampaikan nuansa penyingkiran dalam penghukuman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh agar nama pribadi dalam teks sumber tetap terlihat dan tidak diganti dengan gelar.
- source_word: אֶת
  choice: bersama
  rationale: Dalam konstruksi ini אֶת berfungsi secara asosiatif, bukan sebagai penanda objek langsung, sehingga menyatakan bahwa mereka dibawa pergi bersama kelompok pelaku kejahatan.
- source_word: פֹּעֲלֵי הָאָוֶן
  choice: para pelaku kejahatan
  rationale: Ungkapan harfiahnya adalah orang-orang yang mengerjakan kejahatan atau kefasikan. 'Para pelaku kejahatan' alami dalam bahasa Indonesia dan mempertahankan penekanan pada perbuatan mereka.
- source_word: שָׁלוֹם
  choice: Damai sejahtera
  rationale: שָׁלוֹם mencakup damai, kesejahteraan, dan keutuhan. 'Damai sejahtera' merupakan ungkapan Indonesia yang alami dan cukup luas untuk membawa cakupan makna tersebut.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi עַל dipertahankan secara dekat dalam rumusan berkat yang singkat, 'Damai sejahtera atas Israel!'
theological_decisions:
- issue: Daya ungkapan penutup שָׁלוֹם עַל יִשְׂרָאֵל
  choice: 'Dipertahankan sebagai ungkapan berkat atau doa yang ringkas: ''Damai sejahtera atas Israel!'''
  alternative: 'Pernyataan nominal: ''Damai sejahtera ada atas Israel.'''
  rationale: Bahasa Ibrani tidak memiliki verba dalam klausa ini. Rumusan tanpa verba mempertahankan keringkasan dan keterbukaan antara berkat, doa, dan seruan liturgis tanpa menetapkan kala yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan kalimat tetap dekat dengan gerak teks Ibrani, sedangkan pilihan 'para pelaku kejahatan' dan 'damai sejahtera' dibuat alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan pada frasa yang dijelaskannya.
