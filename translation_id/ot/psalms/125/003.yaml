  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י לֹ֪א יָנ֡וּחַ שֵׁ֤בֶט הָ/רֶ֗שַׁע עַל֮ גּוֹרַ֪ל הַֽ/צַּדִּ֫יקִ֥ים לְמַ֡עַן לֹא יִשְׁלְח֖וּ הַ/צַּדִּיקִ֨ים בְּ/עַוְלָ֬תָ/ה יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/003.yaml
  text: For the scepter of wickedness will not rest on the lot of the righteous[c][b][a], lest the righteous stretch out their hands to wrongdoing.
translation:
  language: id
  text: Sebab tongkat kekuasaan fasik[a] tidak akan tetap berada atas bagian milik orang-orang benar,[b] agar orang-orang benar tidak mengulurkan tangan mereka pada kejahatan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tongkat kekuasaan orang-orang fasik.” Susunan Ibraninya dapat menunjuk pada kefasikan sebagai sifat kekuasaan itu atau pada orang-orang fasik yang memegangnya.
    reason: lexical_alternative
  - marker: b
    text: “Bagian milik” menerjemahkan kata yang juga dapat berarti “undi,” “bagian,” atau “milik pusaka,” yaitu jatah yang ditetapkan bagi orang-orang benar.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “mengulurkan tangan mereka dalam/pada ketidakadilan.” Idiom Ibrani ini berarti terlibat dalam perbuatan jahat atau tidak adil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang mendasari keyakinan pada ayat sebelumnya; “sebab” menyatakan hubungan wacana itu secara alami.
- source_word: יָנוּחַ
  choice: tidak akan terus berada
  rationale: Verba ini berarti beristirahat, menetap, atau tetap berada. Ungkapan ini menunjukkan bahwa kekuasaan fasik tidak akan berlangsung permanen, tanpa menyangkal bahwa penindasan dapat terjadi untuk sementara.
- source_word: שֵׁבֶט
  choice: tongkat kekuasaan
  rationale: Secara konkret berarti tongkat, tetapi dalam konteks ini melambangkan pemerintahan atau dominasi. “Tongkat kekuasaan” mempertahankan gambaran tersebut sekaligus jelas bagi pembaca modern.
- source_word: הָרֶשַׁע
  choice: kefasikan
  rationale: Nomina Ibrani ini dapat menunjuk pada sifat fasik maupun orang fasik yang memegang kekuasaan. Teks utama mempertahankan bentuk abstrak, sedangkan kemungkinan personal dicatat dalam catatan kaki.
- source_word: גּוֹרַל
  choice: bagian yang diundikan
  rationale: Kata ini secara harfiah berkaitan dengan undi dan secara metonimis berarti bagian atau milik pusaka yang ditetapkan. Pilihan ini mempertahankan kedua unsur itu dengan bahasa Indonesia yang dapat dipahami.
- source_word: הַצַּדִּיקִים
  choice: orang-orang benar
  rationale: Padanan baku bagi bentuk jamak substantival ini, dengan cakupan moral dan relasionalnya tetap terjaga.
- source_word: לְמַעַן לֹא
  choice: supaya ... tidak
  rationale: 'Menyatakan tujuan atau pencegahan: kekuasaan fasik tidak dibiarkan menetap agar orang benar tidak terdorong melakukan kejahatan.'
- source_word: יִשְׁלְחוּ ... יְדֵיהֶם
  choice: mengulurkan tangan mereka
  rationale: Mempertahankan idiom konkret Ibrani tentang mengulurkan tangan, yang dalam konteks berarti mulai terlibat dalam suatu perbuatan.
- source_word: בְּעַוְלָתָה
  choice: untuk melakukan kejahatan
  rationale: Nomina ini dapat berarti kejahatan, ketidakadilan, atau kelaliman. Dalam idiom Indonesia, frasa ini dengan jelas menyampaikan keterlibatan aktif tanpa mempersempit maknanya hanya pada ketidakadilan sosial.
theological_decisions:
- issue: Sifat janji tentang kekuasaan fasik atas orang-orang benar
  choice: Ayat ini menyatakan bahwa dominasi fasik tidak akan menetap secara permanen atas bagian orang-orang benar.
  alternative: Orang fasik sama sekali tidak pernah berkuasa atau menindas orang-orang benar.
  rationale: Makna יָנוּחַ berkisar pada beristirahat, menetap, atau tetap berada. Karena itu, ayat ini membatasi lamanya dominasi fasik dan tidak meniadakan kemungkinan penderitaan sementara. Anak kalimat tujuan juga menunjukkan bahwa penindasan tersebut dibatasi agar orang benar tidak terdorong kepada kejahatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tongkat kekuasaan” mempertahankan metafora pemerintahan tanpa terdengar terlalu arkais; “terus berada” mengungkapkan ketidakpermanenan dominasi fasik; dan idiom tangan tetap dipertahankan lalu diperjelas oleh komplemen verbal serta catatan kaki.
