source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/001.yaml
  text: A Song of Ascents. Those who trust in Yahweh are like Mount Zion[a], which cannot be shaken, but remains forever.
translation:
  language: id
  text: 'Nyanyian Kenaikan. Orang-orang yang percaya kepada Yahweh seperti Gunung Sion: gunung itu tidak akan goyah[a], tetap selama-lamanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tidak akan bergeser.'
    reason: Alternatif leksikal yang lebih harfiah bagi לֹא יִמּוֹט; kata kerja itu dapat menggambarkan sesuatu yang tidak dipindahkan atau diguncangkan dari kedudukannya.
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Kenaikan
  rationale: Mempertahankan arti dasar מַעֲלוֹת dan sebutan sastra tradisional bagi Mazmur 120–134 tanpa mempersempitnya secara pasti menjadi nyanyian peziarah.
- source_word: הַבֹּטְחִים
  choice: Orang-orang yang percaya
  rationale: Partisipel ini menunjuk pada golongan orang yang terus dicirikan oleh kepercayaan; bentuk ini wajar dalam bahasa Indonesia dan mempertahankan sifat umumnya.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ב menandai pihak yang menjadi sandaran kepercayaan; dalam bahasa Indonesia ungkapan yang alami ialah 'percaya kepada'. Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: כְּהַר צִיּוֹן
  choice: seperti Gunung Sion
  rationale: כְּ menyatakan perbandingan, sedangkan 'Gunung Sion' merupakan bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: לֹא יִמּוֹט
  choice: tidak akan goyah
  rationale: Bentuk Nifal dari מוֹט menyatakan tidak terguncang, tidak bergeser, atau tidak terhuyung; 'tidak akan goyah' mempertahankan citra kestabilan secara alami.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: tetap untuk selama-lamanya
  rationale: יָשַׁב dapat berarti duduk, berdiam, atau tetap berada. Dalam konteks kestabilan gunung, 'tetap' menyampaikan keberlangsungan tanpa memaksakan arti harfiah 'duduk'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Rujukan verba tunggal לֹא יִמּוֹט dan יֵשֵׁב
  choice: Dibuat eksplisit sebagai 'gunung itu'
  alternative: Membiarkan subjek tersirat setelah perbandingan
  rationale: Kedua verba Ibrani berbentuk tunggal dan paling langsung merujuk kepada Gunung Sion, bukan kepada bentuk jamak 'orang-orang'. Pengulangan 'gunung itu' menjernihkan tata bahasa tanpa mengubah inti perbandingan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Tanda titik dua mempertahankan gerak paralel puisi Ibrani, sementara 'gunung itu' memperjelas peralihan dari subjek jamak kepada verba tunggal. Ungkapan 'Nyanyian Kenaikan' sengaja tidak diperluas menjadi 'nyanyian ziarah' karena latar tepat superskripsi ini tidak dinyatakan oleh ayat.
