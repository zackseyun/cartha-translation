  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/000.yaml
  text: 'A Song of Ascents[a]. Those who trust in Yahweh are like Mount Zion: it will not be shaken; it abides forever.'
translation:
  language: id
  text: 'Nyanyian ziarah.[a] Orang-orang yang percaya kepada Yahweh seperti Gunung Sion: gunung itu tidak akan goyah[b] dan tetap ada untuk selama-lamanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Nyanyian kenaikan” atau “Nyanyian pendakian.”
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih harfiah, “tidak akan dipindahkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Secara harfiah berarti ‘nyanyian kenaikan/pendakian’. Dalam konteks judul kumpulan mazmur ini, ‘ziarah’ menyampaikan kemungkinan bahwa nyanyian tersebut dinyanyikan dalam perjalanan naik ke Yerusalem, sambil mempertahankan catatan mengenai bentuk harfiahnya.
- source_word: הַבֹּטְחִים
  choice: Orang-orang yang percaya
  rationale: Partisipel jamak ini menunjuk kepada mereka yang menaruh kepercayaan atau rasa aman pada Yahweh; ‘percaya kepada’ merupakan ungkapan Indonesia yang alami.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, agar bentuk nama dalam teks sumber tetap tampak.
- source_word: לֹא יִמּוֹט
  choice: tidak akan goyah
  rationale: Kata kerja ini dapat berarti digerakkan, bergeser, atau terguncang. ‘Tidak akan goyah’ alami dalam bahasa Indonesia dan sesuai dengan gambaran Gunung Sion yang kokoh.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: tetap teguh untuk selama-lamanya
  rationale: Secara harfiah, frasa ini menyatakan bahwa Gunung Sion ‘tinggal/berdiam untuk selama-lamanya’. Dalam konteks kestabilan gunung, ‘tetap teguh’ menyampaikan keberlangsungan yang dimaksud tanpa menghilangkan penekanan durasinya.
theological_decisions:
- issue: Acuan verba tunggal pada perbandingan dengan Gunung Sion
  choice: gunung itu tidak akan goyah dan tetap teguh
  alternative: mereka tidak akan goyah dan tetap teguh
  rationale: Bentuk verba Ibrani tunggal paling langsung mengacu kepada Gunung Sion sebagai unsur pembanding, meskipun sifat kokohnya secara implisit berlaku bagi orang-orang yang percaya kepada Yahweh.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Tanda titik dua mempertahankan hubungan perbandingan, sedangkan pengulangan ‘gunung itu’ memperjelas acuan verba tunggal dalam bahasa Indonesia.
