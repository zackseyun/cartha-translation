id: PSA.125.4
reference: Psalms 125:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵיטִ֣יבָ/ה יְ֭הוָה לַ/טּוֹבִ֑ים וְ֝/לִֽ/ישָׁרִ֗ים בְּ/לִבּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/004.yaml
  text: Do good[a], O Yahweh, to the good[b], and to the upright in heart.
translation:
  language: id
  text: Berbuatlah baik, ya Yahweh, kepada orang-orang yang baik, dan kepada mereka yang tulus hatinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: Berbuatlah baik
  rationale: Bentuk imperatif hifil dari יטב merupakan permohonan agar Yahweh berbuat baik atau memperlakukan dengan baik. Pilihan ini mempertahankan daya verbal serta hubungan leksikal dengan טּוֹבִים.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לַטּוֹבִים
  choice: kepada orang-orang yang baik
  rationale: Adjektiva טוֹב dipakai secara substantival untuk menyebut orang-orang baik. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan kata 'baik' pada klausa pertama.
- source_word: וְלִישָׁרִים
  choice: dan kepada mereka yang tulus
  rationale: יָשָׁר menunjuk pada kelurusan atau integritas moral. Dalam konstruksi dengan 'hatinya', 'tulus' menyampaikan integritas batin secara alami tanpa mengubahnya menjadi kategori teologis teknis.
- source_word: בְּלִבּוֹתָם
  choice: hatinya
  rationale: Secara harfiah berarti 'dalam hati mereka'. Bentuk distributif tunggal dalam bahasa Indonesia menghasilkan ungkapan 'mereka yang tulus hatinya', yang alami dan tetap menekankan integritas batin.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi mempertahankan nama diri yang terdapat dalam sumber.
- issue: Gambaran moral para penerima kebaikan
  choice: orang-orang yang baik ... mereka yang tulus hatinya
  alternative: orang benar ... orang yang lurus hati
  rationale: Teks menyajikan dua gambaran moral yang sejajar. Terjemahan mempertahankan perbedaan kosakata טוֹב dan יָשָׁר serta penekanan pada integritas batin, tanpa memasukkan pembedaan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Seruan 'ya Yahweh' mempertahankan sapaan langsung. Kesejajaran antarklausa dijaga, sementara 'mereka yang tulus hatinya' dipilih agar idiom Ibrani terdengar alami bagi pembaca Indonesia.
