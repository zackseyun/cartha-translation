id: PSA.125.2
reference: Psalms 125:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְֽרוּשָׁלִַ֗ם הָרִים֮ סָבִ֪יב לָ֥/הּ וַ֭/יהוָה סָבִ֣יב לְ/עַמּ֑/וֹ מֵ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/002.yaml
  text: As the mountains surround Jerusalem[a], so Yahweh surrounds his people from now and forever.
translation:
  language: id
  text: Seperti gunung-gunung mengelilingi Yerusalem,[a] demikianlah Yahweh mengelilingi umat-Nya, dari sekarang sampai selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Yerusalem—gunung-gunung ada di sekelilingnya; dan Yahweh ada di sekeliling umat-Nya, dari sekarang sampai selama-lamanya.”
    reason: Menunjukkan susunan nominal dan fungsi penghubung yang lebih formal dalam teks Ibrani.
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Menggunakan bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak הַר dapat berarti gunung atau bukit; 'gunung-gunung' mempertahankan gambaran topografis dan perlindungan yang kokoh.
- source_word: סָבִיב לָהּ
  choice: mengelilingi Yerusalem
  rationale: Ungkapan סָבִיב לְ menyatakan keberadaan di sekeliling; akhiran feminin merujuk kepada kota Yerusalem. Pengulangan nama kota lebih alami daripada pronomina feminin dalam bahasa Indonesia.
- source_word: וַיהוָה
  choice: demikianlah Yahweh
  rationale: 'Waw dipahami secara komparatif berdasarkan kesejajaran puitis: sebagaimana gunung-gunung mengelilingi Yerusalem, demikian pula Yahweh mengelilingi umat-Nya.'
- source_word: סָבִיב לְעַמּוֹ
  choice: mengelilingi umat-Nya
  rationale: Mengulang citra utama klausa pertama dan mempertahankan kesejajaran puitis serta nuansa perlindungan.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: '''Umat-Nya'' adalah ungkapan Indonesia yang alami untuk umat milik Yahweh dan mempertahankan makna relasionalnya.'
- source_word: מֵעַתָּה
  choice: dari sekarang
  rationale: Padanan langsung dan alami untuk titik waktu kini yang berlanjut ke depan.
- source_word: וְעַד עוֹלָם
  choice: sampai selama-lamanya
  rationale: Ungkapan Indonesia yang wajar untuk durasi tanpa akhir; bersama 'dari sekarang' membentuk rentang waktu yang jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Fungsi kata sambung waw sebelum יְהוָה
  choice: dipahami secara komparatif dan diterjemahkan 'demikianlah Yahweh'
  alternative: 'penghubung sederhana: ''dan Yahweh'''
  rationale: Walaupun waw lazim berarti 'dan', struktur paralel ayat ini membentuk perbandingan. 'Demikianlah' mengungkapkan hubungan analogis yang tersirat tanpa mengubah citra sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk 'mengelilingi' mempertahankan pengulangan sumber serta menyampaikan perlindungan tanpa menambah kata 'melindungi'. Kapitalisasi pronomina pada 'umat-Nya' mengikuti kebiasaan hormat dalam bahasa Indonesia.
