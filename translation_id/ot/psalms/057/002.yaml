id: PSA.57.2
reference: Psalms 57:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶ֭קְרָא לֵֽ/אלֹהִ֣ים עֶלְי֑וֹן לָ֝/אֵ֗ל גֹּמֵ֥ר עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/002.yaml
  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: id
  text: 'Aku berseru kepada Allah Yang Mahatinggi,

    kepada Allah yang menyelesaikan apa yang menyangkut diriku.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang menggenapi tujuan-Nya bagiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקְרָא
  choice: Aku berseru
  rationale: Bentuk imperfek Qal orang pertama tunggal dari קרא dapat menyatakan tindakan kini atau mendatang. Dalam konteks doa mazmur, “Aku berseru” terdengar alami dan menyampaikan seruan kepada Allah tanpa menambahkan intensitas berlebihan.
- source_word: לֵאלֹהִים עֶלְיוֹן
  choice: kepada Allah Yang Mahatinggi
  rationale: אֱלֹהִים merujuk kepada Allah Israel dalam arti tunggal, sedangkan עֶלְיוֹן adalah gelar ilahi “Yang Mahatinggi”. Bentuk ini alami dan mapan dalam bahasa Indonesia.
- source_word: לָאֵל
  choice: kepada Allah
  rationale: אֵל merupakan sebutan Semitik umum bagi Allah. Pengulangan “kepada Allah” mempertahankan paralelisme Ibrani dan tidak memperlakukannya sebagai nama diri.
- source_word: גֹמֵר
  choice: yang menyelesaikan
  rationale: Partisipel dari גמר berarti menyelesaikan atau membawa sampai tuntas. Terjemahan langsung ini menjaga keterbukaan objek tindakan yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: עָלָי
  choice: apa yang menyangkut diriku
  rationale: Dengan גמר, preposisi עַל bersufiks ini dapat berarti sesuatu yang berkenaan dengan atau dilakukan bagi pemazmur. Ungkapan ini mempertahankan cakupan idiom Ibrani tanpa secara eksplisit menambahkan kata “rencana” atau “tujuan”.
theological_decisions:
- issue: Makna גֹמֵר עָלָי
  choice: Allah menyelesaikan apa yang menyangkut diri pemazmur
  alternative: Allah menggenapi tujuan-Nya bagiku
  rationale: Teks Ibrani tidak menyebutkan secara eksplisit “tujuan-Nya”. Terjemahan utama mempertahankan ambiguitas tentang apa yang Allah selesaikan, sedangkan catatan kaki memberi padanan dinamis yang masuk akal secara kontekstual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme dua baris dipertahankan. “Aku” sesuai dengan suara doa pribadi dalam mazmur; “Yang Mahatinggi” ditulis sebagai gelar ilahi.
