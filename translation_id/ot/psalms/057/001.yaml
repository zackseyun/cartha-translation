  text: חָנֵּ֤/נִי אֱלֹהִ֨ים חָנֵּ֗/נִי כִּ֥י בְ/ךָ֮ חָסָ֪יָה נַ֫פְשִׁ֥/י וּ/בְ/צֵֽל כְּנָפֶ֥י/ךָ אֶחְסֶ֑ה עַ֝֗ד יַעֲבֹ֥ר הַוּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: id
  text: 'Kasihanilah aku, ya Allah, kasihanilah aku,

    sebab kepada-Mu jiwaku berlindung[a].

    Di bawah naungan sayap-Mu aku akan berlindung

    sampai malapetaka berlalu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyawaku berlindung kepada-Mu,” “diriku berlindung kepada-Mu,” atau cukup “aku berlindung kepada-Mu.” Kata Ibrani נַפְשִׁי dapat berarti “jiwaku,” “nyawaku,” atau “diriku.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, kata Ibraninya berbentuk jamak: “malapetaka-malapetaka” atau “bencana-bencana”; kemungkinan merupakan ungkapan kolektif untuk berbagai bahaya yang membawa kehancuran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Kasihanilah aku
  rationale: Bentuk imperatif dari חנן dengan sufiks orang pertama tunggal memohon kemurahan atau belas kasihan Allah. “Kasihanilah aku” merupakan ungkapan doa yang alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi istilah teologis teknis.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk sebutan ilahi ini ketika dipakai sebagai sapaan langsung.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bagi permohonan sebelumnya dan mempertahankan hubungan kausal secara ringkas serta puitis.
- source_word: בְךָ
  choice: kepada-Mu
  rationale: Dengan verba חסה, preposisi ב menunjuk kepada pribadi yang dijadikan tempat perlindungan. “Berlindung kepada-Mu” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “di dalam-Mu”.
- source_word: חָסָיָה נַפְשִׁי
  choice: jiwaku berlindung
  rationale: נפש dapat berarti jiwa, nyawa, atau diri. Ungkapan ini mempertahankan citra puitis Ibrani, sedangkan bentuk perfek menyatakan kepercayaan yang telah diteguhkan dan kini berlaku.
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: Di bawah naungan sayap-Mu
  rationale: “Naungan” menyampaikan fungsi perlindungan dari צל secara alami, sementara “sayap-Mu” mempertahankan metafora puitis dan tidak menggantinya dengan penjelasan abstrak.
- source_word: אֶחְסֶה
  choice: aku akan berlindung
  rationale: Bentuk imperfek orang pertama tunggal menyatakan tindakan yang berlanjut atau berorientasi ke depan, sekaligus mempertahankan perkembangan dari kepercayaan yang sudah ada menuju perlindungan yang terus dicari.
- source_word: עַד יַעֲבֹר
  choice: sampai ... berlalu
  rationale: Menyampaikan batas waktu perlindungan dan gambaran bahaya yang bergerak lewat secara wajar dalam bahasa Indonesia.
- source_word: הַוּוֹת
  choice: malapetaka
  rationale: Nomina jamak ini menunjuk pada kejadian-kejadian yang membawa kehancuran. Bentuk kolektif “malapetaka” alami dalam bahasa Indonesia; nuansa jamaknya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Nuansa antropologis נַפְשִׁי
  choice: jiwaku
  alternative: nyawaku; diriku; aku
  rationale: Istilah Ibrani dapat menunjuk pada seluruh diri atau kehidupan seseorang, bukan dengan sendirinya pada jiwa tak berjasad menurut pengertian filosofis tertentu. “Jiwaku” mempertahankan ungkapan puitis tanpa menetapkan antropologi yang lebih sempit; cakupan maknanya dijelaskan dalam catatan kaki.
- issue: Gambaran perlindungan dalam “naungan sayap-Mu”
  choice: Metafora dipertahankan secara langsung
  alternative: Dijelaskan sebagai “perlindungan-Mu”
  rationale: Mempertahankan gambaran sayap menjaga kekuatan puisi dan bahasa antropomorfis teks tanpa mengubahnya menjadi pernyataan doktrinal atau uraian abstrak.
translation_notes:
  register: Bahasa doa puitis yang modern, khidmat, dan mudah dipahami. Sapaan “ya Allah” memperjelas vokatif. Kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan ejaan religius bahasa Indonesia. Pemenggalan baris mempertahankan paralelisme antara tindakan jiwa yang berlindung dan tekad untuk terus berlindung.
