base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: id
  text: Jiwaku berada di tengah-tengah singa; aku berbaring di antara mereka yang membara[a]—anak-anak manusia[b], yang gigi mereka adalah tombak dan anak panah, dan lidah mereka adalah pedang tajam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mereka yang menyala-nyala” atau “orang-orang yang bernyala”; ungkapan ini menggambarkan keganasan para musuh.
    reason: lexical_alternative
  - marker: b
    text: 'Secara idiomatis: “manusia” atau “orang-orang”; secara harfiah ungkapan Ibraninya berarti “anak-anak manusia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Jiwaku
  rationale: Mempertahankan gambaran puitis נֶפֶשׁ, yang di sini dapat menunjuk pada jiwa, diri, atau hidup pemazmur yang terancam.
- source_word: בְּתוֹךְ לְבָאִם
  choice: di tengah-tengah singa
  rationale: Mempertahankan gambaran singa dan kesan bahwa pemazmur dikelilingi bahaya, tanpa menentukan apakah singa itu harfiah atau metaforis.
- source_word: אֶשְׁכְּבָה
  choice: aku berbaring
  rationale: Menerjemahkan tindakan konkret verba שׁכב secara langsung dan tetap alami dalam puisi Indonesia.
- source_word: לֹהֲטִים
  choice: mereka yang membara
  rationale: Menjaga citra panas atau nyala serta sifat permusuhan para lawan tanpa mempersempitnya menjadi sekadar amarah atau tindakan melahap.
- source_word: בְּנֵי אָדָם
  choice: anak-anak manusia
  rationale: Mempertahankan bentuk ungkapan Ibrani yang ditandai secara puitis; catatan kaki memberikan padanan Indonesia yang lebih idiomatis.
- source_word: שִׁנֵּיהֶם חֲנִית וְחִצִּים
  choice: gigi mereka tombak dan anak panah
  rationale: Mempertahankan metafora langsung tentang gigi sebagai senjata. Bentuk kolektif bahasa Indonesia menghindari ketidakalamian akibat perbedaan jumlah antara חֲנִית dan חִצִּים.
- source_word: וּלְשׁוֹנָם חֶרֶב חַדָּה
  choice: dan lidah mereka pedang tajam
  rationale: Mempertahankan metafora langsung untuk ucapan yang menghancurkan, dengan susunan nominal yang ringkas dan puitis.
theological_decisions:
- issue: Apakah gambaran singa dan senjata harus ditafsirkan secara harfiah atau metaforis
  choice: Mempertahankan seluruh gambaran sebagai bahasa puitis tentang ancaman tanpa menjelaskan sifatnya di dalam teks.
  alternative: Menafsirkan singa secara harfiah lalu manusia sebagai ancaman lain, atau memparafrasakan semuanya sebagai musuh manusia yang ganas.
  rationale: Ayat bergerak dari gambaran singa kepada anak-anak manusia dan senjata; terjemahan sebaiknya menjaga pelapisan serta ketegangan ini.
- issue: Cara menerjemahkan בְּנֵי אָדָם
  choice: anak-anak manusia
  alternative: manusia; orang-orang; kaum lelaki
  rationale: Ungkapan utama mempertahankan bentuk puitis bahasa Ibrani. Karena bahasa Indonesia tidak menandai gender gramatikal seperti bahasa Inggris, catatan kaki menjelaskan makna idiomatisnya tanpa memaksakan pembatasan yang tidak pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan bermartabat. Metafora Ibrani dipertahankan secara padat; tanda pisah menandai aposisi yang menjelaskan bahwa pihak yang membara itu adalah manusia.
