translation:
  language: id
  text: Bangunlah, kemuliaanku![a] Bangunlah, harpa dan lira![b] Aku akan membangunkan fajar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “jiwaku” atau “seluruh diriku.” Secara harfiah: “kemuliaanku,” sebuah sebutan puitis bagi diri sendiri.'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani menyebut dua alat musik petik kuno; padanan tepatnya dengan alat musik modern tidak diketahui dengan pasti.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: Bangunlah!
  rationale: Bentuk imperatif dari עור yang merupakan seruan langsung untuk bangun. “Bangunlah” alami dalam bahasa Indonesia sekaligus mempertahankan nada puitis dan agung.
- source_word: כְבוֹדִי
  choice: kemuliaanku
  rationale: Secara harfiah berarti “kemuliaanku.” Dalam puisi Ibrani ungkapan ini dapat menjadi sebutan puitis bagi diri batin atau seluruh diri pemazmur. Terjemahan harfiah dipertahankan agar metafora dan ambiguitas sumber tidak hilang; kemungkinan maknanya dijelaskan dalam catatan kaki.
- source_word: הַנֵּבֶל
  choice: gambus
  rationale: Menunjuk pada alat musik petik kuno yang identifikasi tepatnya tidak pasti. “Gambus” memberi padanan Indonesia yang mudah dipahami untuk alat musik petik dan membedakannya dari כִנּוֹר, tanpa menyatakan bahwa bentuk instrumennya sama persis.
- source_word: כִנּוֹר
  choice: kecapi
  rationale: Menunjuk pada alat musik petik kuno. “Kecapi” merupakan padanan yang dikenal pembaca Indonesia dan membentuk pasangan puitis yang wajar dengan “gambus”; ketidakpastian padanan modern dijelaskan dalam catatan kaki.
- source_word: אָעִירָה
  choice: Aku akan membangunkan
  rationale: Bentuk hifil dari עור menyampaikan arti kausatif. “Aku akan membangunkan” mempertahankan gambaran bahwa pujian pemazmur secara puitis membangunkan fajar.
- source_word: שָּׁחַר
  choice: fajar
  rationale: Berarti fajar atau saat menyingsingnya hari. “Fajar” ringkas, puitis, dan cocok dengan personifikasi melalui verba “membangunkan.”
