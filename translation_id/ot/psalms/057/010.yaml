  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: id
  text: 'Sebab kasih setia-Mu besar hingga ke langit,

    dan kesetiaan-Mu hingga ke awan-awan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab kasih setia-Mu besar hingga ke langit, dan kebenaran-Mu hingga ke awan-awan.” Ungkapan ini juga dapat dipahami: “Kasih setia-Mu setinggi langit, dan kesetiaan-Mu sampai ke awan-awan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi pujian dalam konteks sebelumnya dan mempertahankan hubungan kausal secara alami.
- source_word: גָדֹל
  choice: begitu besar
  rationale: Mengungkapkan besarnya sifat Allah dengan bahasa puitis yang wajar; 'begitu' membantu menyampaikan intensitas dalam konstruksi Indonesia.
- source_word: עַד
  choice: hingga ke
  rationale: Menandai jangkauan atau batas yang dibayangkan secara vertikal, sambil tetap alami dalam bahasa Indonesia.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam puisi Ibrani menunjuk pada bentangan langit di atas; bentuk tunggal kolektif merupakan ungkapan Indonesia yang paling alami.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: Mencakup kasih, kemurahan, dan loyalitas yang teguh tanpa membatasi istilah itu hanya pada satu nuansa.
- source_word: וְעַד
  choice: dan ... hingga ke
  rationale: Mempertahankan kesejajaran dan pengulangan preposisi dalam kedua larik Ibrani.
- source_word: שְׁחָקִים
  choice: awan-awan
  rationale: Memberikan gambaran konkret yang sesuai dengan penggunaan puitis kata tersebut dan sejajar dengan 'langit'.
- source_word: אֲמִתֶּךָ
  choice: kesetiaan-Mu
  rationale: Dalam pasangan dengan חֶסֶד, kata ini terutama menyatakan keterandalan dan keteguhan Allah, meski secara leksikal juga dapat berarti 'kebenaran'.
theological_decisions:
- issue: Penerjemahan pasangan sifat Allah חֶסֶד dan אֱמֶת
  choice: '''kasih setia'' dan ''kesetiaan'''
  alternative: '''kasih setia'' dan ''kebenaran'''
  rationale: Dalam kesejajaran puitis ini, kedua istilah memuji kasih loyal dan keterandalan Allah. Namun, kemungkinan makna 'kebenaran' untuk אֱמֶת tetap dicatat agar ketegangan leksikal tidak dihapus.
- issue: Cakupan gambaran עַד
  choice: hingga ke langit ... hingga ke awan-awan
  alternative: setinggi langit ... sampai ke awan-awan
  rationale: Terjemahan utama mempertahankan gambaran jangkauan tanpa mengubahnya secara eksplisit menjadi perbandingan tinggi; alternatif yang lebih idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kesejajaran kedua larik dipertahankan, dan bentuk sapaan ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
