lexical_decisions:
- source_word: נָכוֹן
  choice: teguh
  rationale: Kata ini menyatakan keadaan yang kokoh, mantap, atau telah ditetapkan. Dalam konteks keyakinan dan tekad untuk memuji Allah, “teguh” secara alami mempertahankan gagasan kestabilan batin.
- source_word: לִבִּי
  choice: hatiku
  rationale: “Hati” mempertahankan gambaran Ibrani tentang pusat batin manusia, termasuk kehendak dan perasaannya.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Bentuk ini merupakan sapaan langsung; partikel “ya” menandai sapaan tersebut secara alami dan khidmat dalam bahasa Indonesia.
- source_word: אָשִׁירָה
  choice: aku hendak bernyanyi
  rationale: Bentuk kohortatif mengungkapkan kehendak atau tekad. “Aku hendak bernyanyi” menyampaikan nuansa itu dengan bahasa Indonesia yang wajar.
- source_word: וַאֲזַמֵּרָה
  choice: dan melantunkan pujian
  rationale: Kata kerja זמר dalam bentuk piel dapat berarti bermusik atau menyanyikan pujian. “Melantunkan pujian” membedakannya dari kata kerja “bernyanyi” sebelumnya sambil mempertahankan konteks pujian.
