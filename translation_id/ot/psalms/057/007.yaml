  text: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
translation:
  language: id
  text: Hatiku teguh[a], ya Allah, hatiku teguh. Aku akan bernyanyi dan bermusik[b].
  philosophy: optimal-equivalence
  footnotes:
