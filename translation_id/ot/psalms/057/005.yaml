  text: ר֣וּמָ/ה עַל הַ/שָּׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/005.yaml
  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: id
  text: Tinggikanlah diri-Mu di atas langit, ya Allah; biarlah kemuliaan-Mu ada di atas seluruh bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kemuliaan-Mu ada di atas seluruh bumi.” Baris kedua dalam bahasa Ibrani tidak memiliki verba, sehingga dapat dibaca sebagai doa atau harapan maupun sebagai pernyataan.
    reason: alternative_reading
lexical_decisions:
- source_word: רוּמָה
  choice: Tinggikanlah diri-Mu
  rationale: Bentuk perintah dari רום menyerukan agar Allah tampil dalam keluhuran-Nya. Ungkapan refleksif ini alami dalam bahasa Indonesia dan menghindari kesan bahwa Allah ditinggikan oleh pelaku yang tidak disebutkan.
- source_word: עַל הַשָּׁמַיִם
  choice: di atas langit
  rationale: עַל menyatakan ketinggian atau keunggulan, sedangkan bentuk jamak Ibrani הַשָּׁמַיִם secara wajar diterjemahkan dengan nomina kolektif Indonesia “langit”.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Sapaan langsung dipertahankan dengan penanda vokatif “ya”, yang alami dan khidmat dalam bahasa Indonesia.
- source_word: עַל כָּל הָאָרֶץ
  choice: mengatasi seluruh bumi
  rationale: Dalam baris puitis ini עַל dapat menyatakan kedudukan di atas atau jangkauan yang menaungi. “Mengatasi seluruh bumi” mempertahankan kesejajaran dengan baris pertama serta nuansa keunggulan universal.
- source_word: כְּבוֹדֶךָ
  choice: kemuliaan-Mu
  rationale: כבוד ketika merujuk kepada Allah menunjuk pada kemuliaan dan keagungan-Nya yang nyata; “kemuliaan-Mu” merupakan padanan Indonesia yang jelas dan mapan.
theological_decisions:
- issue: Apakah baris kedua yang tanpa verba harus dipahami sebagai permohonan atau pernyataan
  choice: biarlah kemuliaan-Mu mengatasi seluruh bumi
  alternative: kemuliaan-Mu mengatasi seluruh bumi
  rationale: Kesejajaran dengan bentuk perintah pada baris pertama mendukung pembacaan sebagai doa atau harapan. Namun, karena bahasa Ibrani tidak menyertakan verba pada baris kedua, kemungkinan pembacaan sebagai pernyataan tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis. Huruf kapital pada pronomina ilahi mengikuti gaya penghormatan yang lazim. Tanda titik koma mempertahankan kesejajaran dua baris Ibrani.
