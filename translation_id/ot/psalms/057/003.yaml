  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: id
  text: Ia akan mengirim dari surga dan menyelamatkan aku; Ia mencela orang yang memburu aku.[a] Sela. Allah akan mengirim kasih setia-Nya dan kesetiaan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang memburu aku mencela aku.” Frasa Ibrani ini juga dapat dipahami, lebih bebas, sebagai “Ia menyelamatkan aku dari celaan orang yang memburu aku.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Ia akan mengirim
  rationale: Bentuk imperfek Qal 3ms menyatakan keyakinan puitis tentang tindakan Allah yang akan datang; objek yang dikirim dibiarkan tersirat seperti dalam bahasa Ibrani.
- source_word: מִשָּׁמַיִם
  choice: dari surga
  rationale: Ungkapan ini menunjuk pada sumber campur tangan ilahi; bentuk tunggal 'surga' alami dalam bahasa Indonesia.
- source_word: וְיוֹשִׁיעֵנִי
  choice: dan menyelamatkan aku
  rationale: Bentuk Hifil dari ישׁע dengan sufiks orang pertama berarti Allah menyebabkan pemazmur selamat; 'menyelamatkan' mempertahankan cakupan maknanya.
- source_word: חֵרֵף
  choice: Ia akan mempermalukan
  rationale: Bentuk perfektif ini secara leksikal berkaitan dengan mencela atau menista, tetapi dalam susunan puitis yang padat dapat dipahami sebagai tindakan Allah yang membuat pengejar mendapat cela; alternatif sintaksis dicatat dalam catatan kaki.
- source_word: שֹׁאֲפִי
  choice: orang yang memburu aku
  rationale: Partisip dari שאף secara harfiah menggambarkan orang yang terengah-engah mengejar atau bernafsu menerkam. 'Memburu aku' menyampaikan pengejaran bermusuhan secara alami tanpa mengunci gambaran pada tindakan menelan.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah teknis mazmur ini dipertahankan sebagai transliterasi karena fungsi tepatnya tidak pasti.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku bagi sebutan ilahi ini dalam konteks monoteistis.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חסד memadukan kasih, kemurahan, dan loyalitas yang teguh; 'kasih setia' merupakan ungkapan Indonesia yang ringkas dan mapan.
- source_word: וַאֲמִתּוֹ
  choice: dan kesetiaan-Nya
  rationale: Dalam pasangan dengan חסד, אמת terutama menekankan keterandalan dan kesetiaan Allah.
theological_decisions:
- issue: Hubungan sintaksis חֵרֵף שֹׁאֲפִי
  choice: 'Allah menjadi subjek tersirat: ''Ia akan mempermalukan orang yang memburu aku.'''
  alternative: 'Pengejar menjadi subjek: ''orang yang memburu aku mencela aku''; atau konstruksi eliptis: ''Ia menyelamatkan aku dari celaan orang yang memburu aku.'''
  rationale: Bahasa Ibrani sangat padat dan memungkinkan beberapa pembagian sintaksis. Bacaan utama mengikuti alur tindakan ilahi—mengirim, menyelamatkan, lalu mempermalukan musuh—namun ambiguitas yang nyata dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Istilah 'Sela' dipertahankan tanpa penjelasan spekulatif.
