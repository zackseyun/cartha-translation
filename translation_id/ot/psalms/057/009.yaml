  yaml_path: translation/ot/psalms/057/009.yaml
  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: id
  text: Aku akan mengucap syukur kepada-Mu di antara bangsa-bangsa[a], Tuhan; aku akan menyanyikan pujian kepada-Mu di antara bangsa-bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan memuji-Mu di antara bangsa-bangsa.” Kata kerja Ibrani dapat berarti mengucap syukur atau memuji; “mengucap syukur” dipilih untuk mempertahankan perbedaannya dari “menyanyikan pujian” pada baris berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Aku akan bersyukur kepada-Mu
  rationale: Bentuk hifil dari ידה dapat berarti mengucap syukur atau memuji. Dalam paralelisme dengan אֲזַמֶּרְךָ, 'bersyukur' mempertahankan nuansa tersendiri tanpa mengulang gagasan 'bermazmur'.
- source_word: בָעַמִּים
  choice: di antara bangsa-bangsa
  rationale: Bentuk jamak עַמִּים menunjuk pada berbagai kelompok bangsa; bentuk jamak dipertahankan secara alami dalam bahasa Indonesia.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Ini adalah gelar ilahi אֲדֹנָי, bukan nama perjanjian יהוה; 'Tuhan' merupakan padanan gelar yang wajar dan bermartabat.
- source_word: אֲזַמֶּרְךָ
  choice: aku akan bermazmur bagi-Mu
  rationale: Bentuk piel dari זמר dalam konteks mazmur berarti menyanyi atau memainkan musik sebagai pujian. 'Bermazmur' mengungkapkan unsur nyanyian dan pujian dengan ringkas.
- source_word: בַּל
  choice: di antara
  rationale: Dalam baris puitis ini בַּל berfungsi sebagai bentuk preposisional puitis yang sejajar dengan ב pada baris pertama.
- source_word: אֻמִּים
  choice: suku-suku bangsa
  rationale: אֻמִּים berarti bangsa-bangsa atau kelompok-kelompok masyarakat. 'Suku-suku bangsa' membedakannya dari עַמִּים sekaligus mempertahankan paralelisme sinonim.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Ya Tuhan
  rationale: Teks memakai gelar ilahi, bukan Tetragramaton. 'Tuhan' mempertahankan pembedaan itu; daya vokatif sudah jelas dari sapaan langsung sehingga partikel 'Ya' tidak wajib ditambahkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Tanda titik koma mempertahankan kesejajaran kedua baris puisi.
