  text: לַ/מְנַצֵּ֣חַ אַל תַּ֭שְׁחֵת לְ/דָוִ֣ד מִכְתָּ֑ם בְּ/בָרְח֥/וֹ מִ/פְּנֵי שָׁ֝א֗וּל בַּ/מְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: id
  text: 'Untuk pemimpin musik: “Jangan Musnahkan.”[a] Dari Daud.[b] Sebuah miktam,[c] ketika ia melarikan diri dari Saul di dalam gua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mungkin merupakan nama lagu, nama nada, atau refrein.
    reason: alternative_reading
  - marker: b
    text: Ungkapan Ibrani dapat juga dipahami sebagai “oleh Daud”, “untuk Daud”, atau “milik Daud”.
    reason: source_ambiguity
  - marker: c
    text: Arti kata Ibrani miktam tidak pasti; karena itu kata tersebut dialihaksarakan, bukan diterjemahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengarahkan penyajian musik. Pilihan ini jelas dalam bahasa Indonesia modern tanpa mempersempitnya menjadi jabatan tertentu.
- source_word: אַל תַּשְׁחֵת
  choice: “Jangan Musnahkan”
  rationale: Ungkapan ini kemungkinan besar berfungsi sebagai judul, nama lagu, atau petunjuk nada; tanda petik menandai fungsi tersebut sambil tetap menerjemahkan arti harfiahnya.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Preposisi Ibrani dapat menyatakan kepengarangan, hubungan, kepemilikan, atau peruntukan. 'Dari Daud' adalah bentuk judul yang alami dan tidak menegaskan 'ditulis oleh' secara berlebihan.
- source_word: מִכְתָּם
  choice: miktam
  rationale: Makna istilah jenis karya ini tidak pasti. Transliterasi mempertahankan data teks tanpa memasukkan tafsiran spekulatif.
- source_word: בְּבָרְחוֹ
  choice: ketika ia melarikan diri
  rationale: Infinitif dengan prefiks בְּ menyatakan keadaan waktu; terjemahan ini alami dan tepat dalam bahasa Indonesia.
- source_word: מִפְּנֵי שָׁאוּל
  choice: dari Saul
  rationale: Secara harfiah idiom ini berarti 'dari hadapan Saul', tetapi dalam konteks melarikan diri, 'dari Saul' menyampaikan maknanya secara wajar.
- source_word: בַּמְּעָרָה
  choice: di dalam gua
  rationale: Preposisi בְּ di sini paling wajar menyatakan lokasi. Bentuk definit dalam bahasa Ibrani diterjemahkan secara alami sebagai 'gua' tanpa memaksakan gua tertentu yang harus sudah diketahui pembaca.
theological_decisions:
- issue: Fungsi keseluruhan ayat
  choice: Menyajikannya sebagai judul atau keterangan pembuka mazmur
  alternative: Memperlakukan sebagian ungkapan, khususnya 'Jangan Musnahkan', sebagai bagian dari syair utama
  rationale: 'Seluruh unsur ayat merupakan formula yang lazim dalam judul mazmur: arahan musik, kemungkinan nama lagu, kaitan dengan Daud, istilah jenis karya, dan latar sejarah.'
- issue: Sifat kaitan לְדָוִד dengan Daud
  choice: Dari Daud, dengan catatan yang mempertahankan keluasan makna
  alternative: Oleh Daud; Untuk Daud; Milik Daud
  rationale: Bentuk Ibrani tidak dengan sendirinya memastikan apakah hubungannya adalah kepengarangan, peruntukan, atau kepemilikan, sehingga terjemahan tidak boleh menutup ambiguitas itu.
- issue: Arti מִכְתָּם
  choice: Mempertahankan transliterasi 'miktam'
  alternative: prasasti; mazmur emas; nyanyian rahasia
  rationale: Arti istilah tersebut diperdebatkan. Transliterasi menghindari pemastian makna yang tidak didukung cukup kuat oleh bukti bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Struktur judul dipertahankan dalam beberapa frasa pendek agar fungsi superskripsi terlihat jelas. Tanda koma sebelum 'di dalam gua' mencerminkan keterangan lokasi yang terpisah tanpa menambahkan hubungan sintaksis yang tidak dinyatakan teks.
