  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: id
  text: 'Tinggikanlah diri-Mu di atas langit, ya Allah;

    biarlah kemuliaan-Mu ada di atas seluruh bumi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kemuliaan-Mu di atas seluruh bumi.” Baris kedua dalam bahasa Ibrani tidak memiliki kata kerja yang tersurat; “ada” dipahami dari konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Tinggikanlah diri-Mu
  rationale: Bentuk perintah yang ditujukan kepada Allah menyampaikan permohonan agar Dia dinyatakan tinggi dan luhur. Ungkapan refleksif ini alami dalam bahasa Indonesia dan mempertahankan daya perintah dalam doa.
- source_word: עַל
  choice: mengatasi
  rationale: Dalam kesejajaran dengan langit dan seluruh bumi, kata ini menyatakan ketinggian sekaligus keunggulan. “Mengatasi” mempertahankan kedua nuansa itu dan dapat digunakan secara alami pada kedua baris.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Bentuk Ibrani ini lazim menunjuk pada bentangan langit atau kawasan surgawi. Bahasa Indonesia secara idiomatis memakai bentuk tunggal kolektif “langit”.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung. Partikel “ya” menandai sapaan doa secara alami dan bermartabat.
- source_word: כָּל הָאָרֶץ
  choice: seluruh bumi
  rationale: Konteks kosmis yang disejajarkan dengan langit menuntut makna “bumi,” bukan “negeri.” “Seluruh bumi” menyampaikan cakupan total frasa tersebut.
- source_word: כְּבוֹדֶךָ
  choice: kemuliaan-Mu
  rationale: Ketika merujuk kepada Allah, כבוד menyatakan kemuliaan atau keagungan-Nya yang nyata. “Kemuliaan-Mu” adalah padanan Indonesia yang jelas dan mapan.
theological_decisions:
- issue: Baris kedua bahasa Ibrani tidak memiliki verba finit yang tersurat
  choice: biarlah kemuliaan-Mu mengatasi seluruh bumi
  alternative: kemuliaan-Mu mengatasi seluruh bumi
  rationale: Memasok “biarlah” meneruskan daya permohonan dari baris pertama dan menjaga kesejajaran puitis. Namun, karena teks Ibrani juga memungkinkan baris kedua dibaca sebagai pernyataan, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Sapaan “ya Allah” serta paralelisme dua baris mempertahankan corak doa. Kapital pada pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia tanpa menambahkan penafsiran denominatif.
