  variant: modern standard Indonesian
source:
  edition: WLC
  text: רֶ֤שֶׁת הֵכִ֣ינוּ לִ/פְעָמַ/י֮ כָּפַ֪ף נַ֫פְשִׁ֥/י כָּר֣וּ לְ/פָנַ֣/י שִׁיחָ֑ה נָפְל֖וּ בְ/תוֹכָ֣/הּ סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down; they dug a pit before me; they fell into the midst of it[d][c][b]. Selah
translation:
  language: id
  text: Mereka memasang jaring bagi langkah-langkahku[a]; jiwaku tertunduk[b]; mereka menggali lubang di hadapanku; mereka jatuh ke tengahnya[c]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perangkap bagi langkah-langkahku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “jiwaku tertunduk”; “jiwaku” juga dapat berarti “aku” atau “hidupku.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “mereka jatuh di tengahnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶשֶׁת
  choice: jaring
  rationale: Menunjuk pada jaring untuk menangkap; pilihan konkret ini mempertahankan gambaran perangkap.
- source_word: הֵכִינוּ
  choice: memasang
  rationale: Secara leksikal berarti menyiapkan atau membuat siap; bersama 'jaring', 'memasang' merupakan ungkapan Indonesia yang alami dan tetap menyatakan tindakan sengaja.
- source_word: לִפְעָמַי
  choice: bagi langkah-langkahku
  rationale: פעם di sini merujuk pada langkah atau pijakan; bentuk jamak dan gambaran gerak dipertahankan.
- source_word: כָּפַף נַפְשִׁי
  choice: jiwaku tertunduk
  rationale: Mempertahankan ungkapan antropologis dan citra membungkuk dalam bahasa puitis, tanpa mempersempit נפשׁ menjadi satu pengertian saja.
- source_word: כָּרוּ
  choice: menggali
  rationale: Padanan langsung bagi tindakan menggali lubang.
- source_word: לְפָנַי
  choice: di hadapanku
  rationale: Menyatakan lokasi di depan pemazmur dalam ragam puitis yang wajar.
- source_word: שִׁיחָה
  choice: lubang
  rationale: Menunjuk pada lubang atau liang yang berfungsi sebagai perangkap; 'lubang' alami dan tidak menambahkan rincian yang tidak eksplisit.
- source_word: נָפְלוּ בְתוֹכָהּ
  choice: mereka sendiri jatuh ke tengahnya
  rationale: Arah masuk dipahami secara alami dari verba 'jatuh' dan konteks lubang; 'sendiri' menonjolkan pembalikan ironis yang tersirat oleh pelaku yang sama, bukan mengubah rujukannya.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna istilah liturgis atau musikal ini tidak pasti, sehingga ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Rujukan subjek pada נָפְלוּ
  choice: '''mereka'' dipertahankan sebagai para musuh yang memasang perangkap'
  alternative: Mengubahnya menjadi akibat impersonal atau menyebut campur tangan Allah
  rationale: Teks Ibrani hanya menyatakan bahwa 'mereka jatuh'; pembalikan terhadap para pembuat perangkap dipertahankan tanpa menambahkan pelaku ilahi yang tidak disebutkan.
- issue: Makna נַפְשִׁי
  choice: '''jiwaku'''
  alternative: '''aku'' atau ''hidupku'''
  rationale: Pilihan ini menjaga keluasan makna נפשׁ dan ketegangan puitis teks, tanpa menetapkan antropologi denominatif tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Paralelisme antarbait dipertahankan; tanda titik memisahkan keadaan pemazmur dari gambaran lubang tanpa menghilangkan hubungan puitisnya. Semua penanda catatan kaki ditempatkan langsung pada unsur terkait.
