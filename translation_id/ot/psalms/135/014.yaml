  text: כִּֽי יָדִ֣ין יְהוָ֣ה עַמּ֑/וֹ וְ/עַל עֲ֝בָדָ֗י/ו יִתְנֶחָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/014.yaml
  text: For Yahweh will vindicate his people[b][a], and he will have compassion on his servants.
translation:
  language: id
  text: Sebab Yahweh akan membela umat-Nya[a] dan berbelas kasihan kepada hamba-hamba-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan menghakimi umat-Nya.” Kata Ibrani ini dapat berarti “menghakimi”, tetapi di sini kemungkinan berarti mengadili perkara mereka demi kepentingan mereka, yakni membela mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “akan mengurungkan niat mengenai hamba-hamba-Nya.” Kata Ibrani ini juga dapat menyatakan tindakan mereda atau tergerak oleh rasa iba.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar bagi pernyataan sebelumnya; “sebab” alami dalam alur argumentasi mazmur.
- source_word: יָדִין
  choice: akan membela
  rationale: דין pada dasarnya berarti menghakimi atau menjalankan pengadilan, tetapi dalam konteks ini menunjuk pada tindakan mengadili demi kepentingan umat-Nya, yakni membela atau membenarkan perkara mereka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Dalam konteks perjanjian dan ibadah, “umat-Nya” merupakan padanan kolektif yang alami dan bermartabat.
- source_word: וְעַל
  choice: kepada
  rationale: Dengan יִתְנֶחָם, preposisi עַל menyatakan arah belas kasihan atau perhatian terhadap para hamba.
- source_word: עֲבָדָיו
  choice: hamba-hamba-Nya
  rationale: עבד dapat berarti budak atau hamba; untuk orang-orang yang mengabdi kepada Yahweh dalam mazmur ini, “hamba-hamba” paling sesuai dengan konteks.
- source_word: יִתְנֶחָם
  choice: berbelas kasihan
  rationale: Bentuk Nifal dari נחם dapat berarti merasa iba atau berbalik dari tindakan yang direncanakan. Dalam paralelisme ini, “berbelas kasihan” menyampaikan kemurahan Yahweh dengan jelas, sementara alternatif “mengurungkan niat” dicatat.
theological_decisions:
- issue: Bahasa antropopatik dalam יִתְנֶחָם
  choice: berbelas kasihan
  alternative: mengurungkan niat mengenai hamba-hamba-Nya
  rationale: Pilihan utama menyampaikan gerak kemurahan ilahi dalam konteks tanpa menyiratkan bahwa Allah bertobat dari kesalahan moral. Catatan kaki mempertahankan kemungkinan leksikal bahwa kata itu menggambarkan tindakan mereda atau mengurungkan tindakan.
- issue: Arti yudisial יָדִין terhadap umat Yahweh
  choice: membela umat-Nya
  alternative: menghakimi umat-Nya
  rationale: Konteks dan paralel dengan belas kasihan mendukung keputusan yang berpihak kepada umat. Namun, arti umum “menghakimi” tetap sah dan dicatat agar keluasan kata Ibrani tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapital pada pronomina yang merujuk kepada Yahweh mengikuti kebiasaan terjemahan Alkitab Indonesia. Susunan dibuat alami tanpa menghapus ambiguitas kedua verba utama; kedua alternatif penting dipertahankan dalam catatan kaki.
