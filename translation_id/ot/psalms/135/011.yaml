base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/011.yaml
  text: to Sihon king of the Amorites, and to Og king of Bashan, and to all the kingdoms of Canaan.
translation:
  language: id
  text: Sihon, raja orang Amori, dan Og, raja Basan, serta semua kerajaan Kanaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: Sihon
  rationale: Preposisi לְ menghubungkan daftar ini dengan tindakan pada ayat sebelumnya. Dalam bahasa Indonesia, mengulanginya secara mandiri tanpa konteks akan terasa janggal, sehingga hubungan sintaksis dibiarkan ditentukan oleh kesinambungan kalimat.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: raja orang Amori
  rationale: Bentuk nisbah berartikel menunjuk kepada kelompok etnis Amori; 'orang Amori' merupakan ungkapan Indonesia yang alami.
- source_word: וּלְעוֹג
  choice: Og
  rationale: Konjungsi diterjemahkan melalui susunan daftar dengan koma dan 'dan' pada unsur terakhir; preposisi לְ tetap tersirat dari konstruksi yang berlanjut dari ayat sebelumnya.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: raja Basan
  rationale: Frasa konstruksi menyatakan Og sebagai raja atas wilayah Basan; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: וּלְכֹל מַמְלְכוֹת
  choice: dan semua kerajaan
  rationale: כֹל menyatakan keseluruhan kumpulan kerajaan, sedangkan מַמְלְכוֹת adalah bentuk jamak 'kerajaan'.
- source_word: כְּנָעַן
  choice: Kanaan
  rationale: Nama tempat dialihaksarakan sesuai bentuk yang lazim dalam bahasa Indonesia.
