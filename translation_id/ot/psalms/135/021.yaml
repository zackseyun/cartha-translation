  text: בָּ֘ר֤וּךְ יְהוָ֨ה מִ/צִּיּ֗וֹן שֹׁ֘כֵ֤ן יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/021.yaml
  text: Blessed be Yahweh from Zion[a], who dwells in Jerusalem. Hallelujah!
translation:
  language: id
  text: Terpujilah Yahweh dari Sion, yang berdiam di Yerusalem. Haleluya![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “Haleluya” berarti “Pujilah Yah!” “Yah” adalah bentuk singkat dari nama Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Partisipel pasif ini dipakai dalam rumusan pujian kepada Allah. “Terpujilah” menyampaikan daya liturgis dan doksologisnya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: מִצִּיּוֹן
  choice: dari Sion
  rationale: Preposisi מִן pada bentuk ini paling langsung menyatakan Sion sebagai tempat asal pujian; makna dasarnya “dari” dipertahankan.
- source_word: שֹׁכֵן
  choice: yang berdiam
  rationale: Partisipel Qal dari שכן berarti tinggal atau berdiam. Frasa relatif ini alami dalam bahasa Indonesia dan tidak menambahkan gambaran “bertakhta” yang tidak dinyatakan oleh katanya.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: הַלְלוּ יָהּ
  choice: Haleluya!
  rationale: Seruan liturgis ini telah diserap secara luas ke dalam bahasa Indonesia; arti unsur-unsur Ibraninya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan frasa שֹׁכֵן יְרוּשָׁלִָם dengan Yahweh
  choice: yang berdiam di Yerusalem
  alternative: Dia yang berdiam di Yerusalem; yang bertakhta di Yerusalem
  rationale: Partisipel itu menjelaskan Yahweh sebagai yang berdiam di Yerusalem. Terjemahan ini mempertahankan hubungan sintaktis tersebut tanpa memasukkan citra kerajaan yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan liturgis. “Terpujilah” dipilih sebagai ungkapan doksologis yang alami; susunan “dari Sion” mempertahankan arah preposisi Ibrani. Penanda catatan kaki ditempatkan sesudah kata yang dijelaskannya.
