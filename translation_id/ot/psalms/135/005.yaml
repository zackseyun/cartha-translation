base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/005.yaml
  text: For I know that Yahweh is great[b][a], and our Lord is above all gods.
translation:
  language: id
  text: Sebab aku tahu bahwa Yahweh[b] itu besar, dan Tuhan kita melebihi segala ilah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tuhan kita lebih besar daripada segala ilah.” Ungkapan perbandingan Ibrani secara harfiah berbunyi “dari segala ilah” dan menyatakan keunggulan atas mereka.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” menerjemahkan nama ilahi YHWH; “Tuhan kita” menerjemahkan kata Ibrani lain yang berarti tuan atau penguasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi pertama memberi alasan bagi pujian dalam konteksnya; “Sebab” menyampaikan fungsi penjelas itu secara wajar.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk perfektif menyatakan pengetahuan pemazmur yang telah mantap; bentuk kini dalam bahasa Indonesia menyampaikan keadaan hasilnya secara alami.
- source_word: כִּי
  choice: bahwa
  rationale: Kemunculan kedua memperkenalkan isi yang diketahui pemazmur.
- source_word: גָדוֹל
  choice: besar
  rationale: Adjektiva predikatif ini menyatakan kebesaran Yahweh secara mutlak dan tetap selaras dengan perbandingan pada klausa berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֲדֹנֵינוּ
  choice: Tuhan kita
  rationale: Nomina ini berarti tuan atau penguasa dengan akhiran orang pertama jamak; “Tuhan kita” mempertahankan martabat gelarnya dan membedakannya dari nama Yahweh.
- source_word: מִכָּל
  choice: melebihi segala
  rationale: Preposisi מִן di sini menandai perbandingan atau keunggulan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna superioritas.
- source_word: אֱלֹהִים
  choice: ilah
  rationale: Dalam konteks jamak dan perbandingan ini, kata tersebut menunjuk kepada dewa-dewa atau sosok yang dipandang ilahi; “ilah” mempertahankan bentuk polemis tanpa menyelesaikan status ontologis mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan perbedaan antara nama itu dan gelar אֲדֹנֵינוּ pada klausa berikutnya.
- issue: Makna אֱלֹהִים dalam frasa terakhir
  choice: segala ilah
  alternative: semua makhluk ilahi atau semua dewa
  rationale: Pilihan ini mencerminkan bentuk jamak dan daya polemis teks, tetapi tidak menambahkan keputusan metafisik mengenai hakikat para ilah tersebut.
- issue: Hubungan גָדוֹל dengan frasa perbandingan
  choice: “besar” sebagai pernyataan mutlak, lalu “melebihi” pada klausa kedua
  alternative: “lebih besar daripada segala ilah”
  rationale: 'Susunan ini mengikuti pembagian klausa Ibrani: kebesaran Yahweh dinyatakan terlebih dahulu, kemudian keunggulan Tuhan kita atas segala ilah. Catatan kaki mencatat kemungkinan pembacaan perbandingan yang lebih rapat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “aku” mengikuti suara pribadi pemazmur. “Ilah” dipilih agar berbeda dari “Allah” sebagai sebutan bagi Tuhan dan agar kemajemukan serta ketegangan polemis teks tetap terlihat.
