  yaml_path: translation/ot/psalms/135/019.yaml
  text: House of Israel[a], bless Yahweh; house of Aaron, bless Yahweh.
translation:
  language: id
  text: Hai kaum Israel, berkatilah Yahweh[a]; hai kaum Harun, berkatilah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk Ibrani nama ilahi dan tradisi penerjemahannya.
lexical_decisions:
- source_word: בֵּית יִשְׂרָאֵל
  choice: kaum Israel
  rationale: Secara harfiah berarti ‘rumah Israel’, tetapi dalam konteks sapaan kolektif ungkapan ini menunjuk kepada umat atau kaum Israel. ‘Kaum Israel’ alami dalam bahasa Indonesia dan tetap sejajar dengan ‘kaum Harun’.
- source_word: בָּרֲכוּ
  choice: berkatilah
  rationale: Bentuk imperatif jamak dari ברך. ‘Berkatilah’ mempertahankan makna dasar dan ungkapan doksologis Ibrani; ‘pujilah’ mungkin lebih langsung dipahami, tetapi mempersempit cakupan katanya.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: אֶת menandai objek langsung, sedangkan יְהוָה adalah nama ilahi YHWH. Transliterasi ‘Yahweh’ mempertahankan nama perjanjian yang terdapat dalam teks Ibrani.
- source_word: בֵּית אַהֲרֹן
  choice: kaum Harun
  rationale: Ungkapan konstruksi ini secara harfiah berarti ‘rumah Harun’ dan mengacu pada keluarga atau garis keturunan imam Harun. ‘Kaum Harun’ mempertahankan sifat kolektif serta paralelismenya dengan ‘kaum Israel’ tanpa menjelaskan lebih daripada teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama ilahi, sedangkan ‘TUHAN’ mengikuti tradisi penggantian dalam pembacaan dan ‘Yehuwa’ mencerminkan bentuk transliterasi tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis. Partikel sapaan ‘Hai’ memperjelas bahwa kedua kelompok sedang disapa, sementara pengulangan dan paralelisme ayat dipertahankan.
