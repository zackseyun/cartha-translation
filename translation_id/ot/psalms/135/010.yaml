  text: who struck many nations and killed mighty kings[b][a],
translation:
  language: id
  text: "yang memukul banyak bangsa\n dan membunuh raja-raja yang perkasa."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: yang memukul
  rationale: Partikel relatif שֶׁ dipertahankan dengan “yang,” sehingga klausa ini tetap terhubung dengan TUHAN dalam ayat sebelumnya. Kata kerja נכה diterjemahkan secara langsung sebagai “memukul”; konteks sejarah-militer menyampaikan akibat destruktifnya tanpa perlu menambahkan unsur yang tidak tersurat.
- source_word: גּוֹיִם רַבִּים
  choice: banyak bangsa
  rationale: גּוֹיִם berarti bangsa-bangsa atau kelompok-kelompok bangsa, sedangkan רַבִּים menyatakan jumlah yang banyak. “Banyak bangsa” alami dan tepat dalam bahasa Indonesia.
- source_word: וְ/הָרַג
  choice: dan membunuh
  rationale: הרג berarti membunuh. Bentuk ini jelas, modern, dan mempertahankan kesejajaran tindakan dalam puisi.
- source_word: מְלָכִים עֲצוּמִים
  choice: raja-raja yang perkasa
  rationale: מְלָכִים adalah bentuk jamak “raja,” sedangkan עֲצוּמִים menyatakan kekuatan atau keperkasaan. “Yang perkasa” mempertahankan nada puitis yang luhur tanpa menjadi arkais.
theological_decisions:
- issue: Kesinambungan klausa relatif dengan ayat sebelumnya
  choice: Memulai dengan “yang,” sebagai klausa dependen yang melanjutkan gambaran tentang TUHAN.
  alternative: “Dia memukul banyak bangsa dan membunuh raja-raja yang perkasa.”
  rationale: Awalan שֶׁ pada הִכָּה menandai klausa relatif. Mempertahankannya mencerminkan sintaksis Ibrani dan susunan pujian yang berlanjut dari ayat sebelumnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kesejajaran puitis antara “memukul banyak bangsa” dan “membunuh raja-raja yang perkasa” dipertahankan. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting dalam bahasa sasaran.
