  text: הַ֥לְלוּ יָ֨הּ הַֽ֭לְלוּ אֶת שֵׁ֣ם יְהוָ֑ה הַֽ֝לְלוּ עַבְדֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/001.yaml
  text: Praise Yah! Praise the name of Yahweh[a]; praise, O servants of Yahweh[b],
translation:
  language: id
  text: Pujilah Yah![a] Pujilah nama Yahweh; pujilah, hai hamba-hamba Yahweh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Halelu-Yah, secara harfiah, “Pujilah Yah.” “Yah” adalah bentuk singkat dari nama Yahweh.'
    reason: Menjelaskan ungkapan liturgis Ibrani dan hubungan antara bentuk singkat יָהּ dengan nama lengkap יְהוָה.
lexical_decisions:
- source_word: הַלְלוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak piel dari הלל merupakan seruan langsung kepada umat untuk memuji. “Pujilah” alami dan tepat dalam bahasa Indonesia.
- source_word: יָהּ
  choice: Yah
  rationale: Bentuk singkat dan puitis dari nama ilahi dipertahankan sebagai “Yah” agar perbedaannya dari bentuk lengkap יְהוָה dalam baris berikutnya tetap terlihat.
- source_word: אֶת שֵׁם יְהוָה
  choice: nama Yahweh
  rationale: Frasa ini secara langsung menempatkan nama ilahi sebagai objek pujian; susunan “nama Yahweh” jelas dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: עַבְדֵי
  choice: hamba-hamba
  rationale: Dalam konteks seruan ibadah ini, kata tersebut menunjuk kepada orang-orang yang mengabdi kepada Yahweh. “Hamba-hamba” lebih sesuai daripada istilah yang menonjolkan status perbudakan.
theological_decisions:
- issue: Pembedaan bentuk nama ilahi יָהּ dan יְהוָה dalam ayat yang sama
  choice: Menerjemahkan יָהּ sebagai “Yah” dan יְהוָה sebagai “Yahweh”
  alternative: Menyamakan keduanya sebagai “TUHAN” atau “Yahweh”
  rationale: Teks Ibrani sengaja memakai bentuk singkat puitis “Yah” pada seruan pembuka dan bentuk lengkap “Yahweh” sesudahnya. Pembedaan itu dipertahankan tanpa menyelesaikannya menjadi satu bentuk.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan “pujilah” serta sapaan “hai” mempertahankan irama seruan ibadah. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
