  text: וְ/נָתַ֣ן אַרְצָ֣/ם נַחֲלָ֑ה נַ֝חֲלָ֗ה לְ/יִשְׂרָאֵ֥ל עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/012.yaml
  text: And he gave their land as an inheritance[a], an inheritance to Israel his people.
translation:
  language: id
  text: Ia memberikan negeri mereka sebagai warisan[a], warisan bagi Israel, umat-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai milik pusaka”; bahasa Ibrani mengulangi kata “warisan” untuk penegasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Ia memberikan
  rationale: Bentuk Qal dengan waw meneruskan rangkaian tindakan lampau dalam pujian. Subjek orang ketiga tunggal dipahami dari konteks, sedangkan konjungsi tidak perlu diterjemahkan secara kaku karena ayat Indonesia tetap mengalir alami.
- source_word: אַרְצָם
  choice: negeri mereka
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau wilayah. Di sini akhiran orang ketiga jamak merujuk pada bangsa dan raja yang dikalahkan dalam konteks sebelumnya; 'negeri mereka' paling alami untuk wilayah yang mereka kuasai.
- source_word: נַחֲלָה
  choice: sebagai warisan
  rationale: 'Kemunculan pertama berfungsi sebagai keterangan hasil sesudah נתן: negeri itu diberikan sebagai warisan. ''Warisan'' mempertahankan nuansa milik pusaka dan pembagian tanah.'
- source_word: נַחֲלָה
  choice: warisan
  rationale: Kemunculan kedua mengulangi kata yang sama untuk penegasan puitis. Pengulangan dipertahankan dan tidak diperhalus menjadi satu penyebutan saja.
- source_word: לְיִשְׂרָאֵל
  choice: kepada Israel
  rationale: Preposisi לְ menandai penerima atau pihak yang memperoleh manfaat; 'kepada Israel' merupakan padanan langsung dan alami.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עַם menunjuk pada suatu bangsa atau umat, dan dalam hubungan Israel dengan Allah, 'umat-Nya' menyampaikan hubungan tersebut secara ringkas serta wajar.
theological_decisions:
- issue: Pengulangan puitis נַחֲלָה
  choice: 'Mempertahankan pengulangan dalam teks utama: ''sebagai warisan, warisan'''
  alternative: Meringkasnya menjadi satu kali penyebutan demi kelancaran bahasa Indonesia
  rationale: Teks Ibrani sengaja mengulang nomina itu sebagai penegasan. Mempertahankannya menjaga bobot puitis dan makna pemberian tanah sebagai milik pusaka tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Negeri' dipilih daripada 'tanah' agar rujukan pada wilayah bangsa-bangsa terdengar alami. Pengulangan yang agak tidak biasa dipertahankan karena merupakan ciri puitis sumber. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
