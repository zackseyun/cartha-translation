  yaml_path: translation/ot/psalms/135/013.yaml
  text: Yahweh, your name endures forever; Yahweh, your renown[a] endures from generation to generation.
translation:
  language: id
  text: Yahweh, nama-Mu tetap selama-lamanya; Yahweh, kemasyhuran-Mu[a] tetap dari generasi ke generasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kenangan akan Engkau” atau “peringatan untuk mengenang Engkau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan Tetragramaton sebagai nama pribadi Allah dan mempertahankan sapaan langsung yang diulang dalam puisi Ibrani.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Mempertahankan keluasan makna kata Ibrani, yang dapat menunjuk pada nama ilahi sekaligus nama baik yang terkait dengannya.
- source_word: לְעוֹלָם
  choice: tetap untuk selama-lamanya
  rationale: Klausa Ibrani tidak memiliki verba tersurat; “tetap” secara wajar menyatakan keberlangsungan yang tersirat oleh ungkapan waktunya.
- source_word: זִכְרְךָ
  choice: kemasyhuran-Mu
  rationale: Dalam kesejajaran dengan “nama-Mu” dan dalam konteks keberlangsungan lintas generasi, kata ini menunjuk pada nama atau reputasi Yahweh yang terus dikenang. Alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: לְדֹר וָדֹר
  choice: dari generasi ke generasi
  rationale: Mencerminkan secara langsung ungkapan Ibrani tentang keberlangsungan dari satu generasi kepada generasi berikutnya dan mempertahankan kesejajaran puitis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks menyebut Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Makna זִכְרְךָ dalam kesejajaran dengan nama ilahi
  choice: kemasyhuran-Mu
  alternative: kenangan akan Engkau; peringatan tentang Engkau
  rationale: Pilihan utama menyampaikan reputasi Allah yang terus dikenang tanpa meniadakan kemungkinan arti lebih harfiah, yang dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “Yahweh” serta kesejajaran kedua klausa dipertahankan; verba “tetap” ditambahkan secara wajar untuk mengungkapkan keberlangsungan yang tersirat dalam dua klausa nominal Ibrani.
