  text: who stand in the house of Yahweh[b][a], in the courts of the house of our God.
translation:
  language: id
  text: Hai kamu yang berdiri di rumah Yahweh[a], di pelataran-pelataran rumah Allah kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Rumah Yahweh" dan "rumah Allah kita" di sini menunjuk pada Bait Suci beserta kawasannya.'
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁעֹמְדִים
  choice: hai kamu yang berdiri
  rationale: Partikel relatif dengan bentuk partisip melanjutkan sapaan dari ayat sebelumnya. Dalam bahasa Indonesia, penambahan 'hai kamu' membuat hubungan sintaksis itu alami, sementara 'yang berdiri' mempertahankan nuansa keadaan atau tugas yang berlangsung.
- source_word: בְּבֵית
  choice: di rumah
  rationale: בַּיִת secara harfiah berarti 'rumah' dan dalam konteks ini menunjuk pada Bait Suci beserta kawasannya. 'Di rumah' mempertahankan ungkapan Ibrani dan kesejajaran puisinya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: בְּחַצְרוֹת
  choice: di pelataran
  rationale: Bentuk jamak חֲצֵרוֹת menunjuk pada pelataran-pelataran dalam kompleks Bait Suci. Bahasa Indonesia lazim memakai bentuk tunggal kolektif 'pelataran' dalam frasa ini; kemungkinan bentuk jamak dijelaskan dalam catatan kaki.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: rumah Allah kita
  rationale: Terjemahan ini mempertahankan pengulangan 'rumah' dan bentuk kepunyaan komunal 'Allah kita', sesuai dengan kesejajaran teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama pribadi ilahi secara langsung. Bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar, sedangkan 'Yehova' tidak dipilih karena mencerminkan pembacaan hibrida yang lebih kemudian.
- issue: Makna 'rumah Yahweh'
  choice: Mempertahankan ungkapan 'rumah Yahweh' dengan penjelasan catatan kaki
  alternative: Bait Suci Yahweh
  rationale: Ungkapan harfiah mempertahankan citra dan pengulangan puitis Ibrani, sementara catatan menjelaskan bahwa yang dimaksud ialah Bait Suci dan kawasannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Susunan kalimat sengaja melanjutkan sapaan pada ayat sebelumnya. 'Pelataran' dipakai secara kolektif agar alami, dan bentuk jamak harfiahnya dicatat.
