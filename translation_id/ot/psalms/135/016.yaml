  edition: WLC
  text: פֶּֽה לָ֭/הֶם וְ/לֹ֣א יְדַבֵּ֑רוּ עֵינַ֥יִם לָ֝/הֶ֗ם וְ/לֹ֣א יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/016.yaml
  text: They have mouths[a], but do not speak; they have eyes, but do not see.
translation:
  language: id
  text: Mereka mempunyai mulut[a], tetapi tidak berbicara; mereka mempunyai mata, tetapi tidak melihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai konstruksi “mulut ada pada mereka … mata ada pada mereka,” yaitu ungkapan kepunyaan yang berarti bahwa mereka mempunyai mulut dan mata.
    reason: Menjelaskan konstruksi kepunyaan Ibrani dan bentuk tunggal distributif pada kata “mulut”.
lexical_decisions:
- source_word: פֶּה
  choice: mulut
  rationale: Kata Ibrani ini berbentuk tunggal, tetapi dipakai secara distributif bagi berhala-berhala yang dirujuk oleh bentuk jamak לָהֶם. Dalam bahasa Indonesia, “mereka mempunyai mulut” secara alami berarti masing-masing mempunyai mulut, sehingga bentuk ulang “mulut-mulut” tidak diperlukan.
- source_word: לָהֶם
  choice: mereka mempunyai
  rationale: Secara harfiah berarti “pada mereka” atau “bagi mereka”, tetapi di sini merupakan konstruksi kepunyaan. “Mereka mempunyai” menyampaikan maknanya dengan wajar dalam bahasa Indonesia.
- source_word: יְדַבֵּרוּ
  choice: tidak berbicara
  rationale: Bentuk verba ini berarti “berbicara”, dengan negasi langsung. Terjemahan tidak mengubahnya menjadi “tidak dapat berbicara”, sebab unsur ketidakmampuan tersirat dari konteks, bukan dinyatakan dengan verba modal.
- source_word: עֵינַיִם
  choice: mata
  rationale: Padanan langsung dan alami. Dalam bahasa Indonesia, “mereka mempunyai mata” sudah dapat dipahami secara distributif tanpa pengulangan kata.
- source_word: יִרְאוּ
  choice: tidak melihat
  rationale: Verba ראה dalam bentuk qal lazim berarti “melihat”. Negasi sederhana dipertahankan, tanpa memperluasnya menjadi “tidak dapat melihat” atau “tidak memahami”.
theological_decisions:
- issue: Gambaran antropomorfis tentang berhala
  choice: Mempertahankan gambaran konkret bahwa berhala mempunyai mulut dan mata, tetapi tidak berbicara atau melihat.
  alternative: 'Menambahkan unsur kemampuan: “tidak dapat berbicara” dan “tidak dapat melihat”.'
  rationale: Ayat ini mengejek berhala melalui anggota tubuh yang tidak berfungsi. Terjemahan mempertahankan pernyataan konkret dan negasi sederhana dalam teks Ibrani tanpa menambahkan penjelasan teologis ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Pengulangan “mereka mempunyai” mempertahankan kesejajaran antarklausa serta nuansa retoris teks Ibrani.
