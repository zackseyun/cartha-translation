base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/006.yaml
  text: Yahweh does whatever he pleases[a], in heaven and on earth[c][b], in the seas and all the depths.
translation:
  language: id
  text: Yahweh melakukan segala yang dikehendaki-Nya di langit dan di bumi, di lautan dan di segala kedalaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala perairan dalam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Apa pun yang
  rationale: Ungkapan ini menyatakan cakupan menyeluruh dan diterjemahkan secara alami dalam bahasa Indonesia tanpa mengurangi sifat komprehensifnya.
- source_word: חָפֵץ
  choice: kehendaki
  rationale: Kata ini dapat berarti berkenan, menginginkan, atau menghendaki. Dalam konteks tindakan berdaulat Yahweh, 'kehendaki' secara alami mencakup keinginan dan maksud tanpa menambahkan gagasan bahwa tindakan itu sewenang-wenang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: עָשָׂה
  choice: dilakukan-Nya
  rationale: Bentuk qatal dapat dibaca sebagai pernyataan umum tentang tindakan Yahweh. Susunan ini menghasilkan ungkapan Indonesia yang wajar dan mempertahankan fokus pada apa pun yang dikehendaki-Nya.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: di langit dan di bumi
  rationale: Pasangan ini menyatakan cakupan kosmis. 'Langit' merupakan padanan kolektif yang alami bagi bentuk jamak Ibrani, sedangkan 'di bumi' mengikuti idiom Indonesia.
- source_word: בַּיַּמִּים
  choice: di laut-laut
  rationale: Bentuk jamak sumber dipertahankan agar paralelisme dan cakupan berbagai perairan tetap terlihat.
- source_word: וְכָל תְּהוֹמוֹת
  choice: dan di segala samudra raya
  rationale: תְּהוֹמוֹת menunjuk pada perairan dalam atau kedalaman samudra. 'Samudra raya' mempertahankan citra puitis mengenai perairan kedalaman tanpa membatasinya hanya pada dasar laut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Aspek עָשָׂה dalam pernyataan umum
  choice: dilakukan-Nya
  alternative: telah dilakukan-Nya
  rationale: Konteks menyatakan kebenaran umum mengenai kebebasan dan kuasa tindakan Yahweh. Bentuk tanpa penanda waktu eksplisit tetap terbuka secara aspektual dan wajar dalam bahasa Indonesia, sedangkan 'telah' akan menekankan hasil lampau.
- issue: Makna תְּהוֹמוֹת
  choice: samudra raya
  alternative: kedalaman-kedalaman atau perairan dalam
  rationale: Pilihan ini menyampaikan wilayah perairan yang sangat dalam dan bercitra kosmis, tetapi catatan kaki mempertahankan kemungkinan padanan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan puitis Ibrani dipertahankan melalui rangkaian wilayah 'di langit ... di bumi ... di laut-laut ...'. Partikel -Nya mengacu kepada Yahweh dan ditulis sesuai kaidah ejaan Indonesia.
