base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/007.yaml
  text: He makes clouds rise from the ends of the earth[a]; he makes lightning for the rain[c][b]; he brings out the wind from his storehouses.
translation:
  language: id
  text: Dia membuat awan[a] naik dari ujung-ujung bumi[b]; Dia membuat kilat menyertai hujan; Dia mengeluarkan angin dari gudang-gudang-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “uap” atau “kabut.” Kata Ibrani ini dapat menunjuk pada uap atau kabut yang naik, tetapi “awan” paling sesuai dengan konteks badai.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari ujung bumi.” Bentuk tunggal dalam bahasa Ibrani dapat menyatakan batas-batas bumi secara kolektif.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “dari perbendaharaan-Nya.” Gambarannya ialah Allah menyimpan dan mengeluarkan angin menurut kehendak-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה
  choice: membuat ... naik
  rationale: Bentuk partisip Hifil dari עלה menyatakan tindakan kausatif. Ungkapan ini mempertahankan makna tersebut secara wajar dalam bahasa Indonesia.
- source_word: נְשִׂאִים
  choice: awan
  rationale: Kata ini dapat merujuk pada uap atau kabut yang naik, tetapi dalam rangkaian cuaca yang menyebut hujan, kilat, dan angin, 'awan' paling jelas dan alami.
- source_word: מִקְצֵה הָאָרֶץ
  choice: dari ujung-ujung bumi
  rationale: Walaupun 'ujung' berbentuk tunggal dalam bahasa Ibrani, ungkapan ini dapat menyatakan batas-batas bumi secara kolektif. Bentuk jamak idiomatis dalam bahasa Indonesia menyampaikan cakupan itu.
- source_word: בְּרָקִים
  choice: kilat
  rationale: Bahasa Ibrani memakai bentuk jamak, tetapi 'kilat' secara idiomatis dapat menjadi nomina tak terhitung dalam bahasa Indonesia.
- source_word: לַמָּטָר
  choice: menyertai hujan
  rationale: Preposisi ל menyatakan hubungan kilat dengan hujan. 'Menyertai hujan' terdengar alami tanpa menentukan hubungan sebab-akibat yang tidak dinyatakan dengan tegas oleh teks.
- source_word: עָשָׂה
  choice: membuat
  rationale: Meskipun berbentuk qatal, dalam puisi ini kata tersebut menggambarkan tindakan khas Allah dalam mengatur ciptaan dan paling tepat dinyatakan dengan kala kini generik.
- source_word: מוֹצֵא
  choice: mengeluarkan
  rationale: Partisip Hifil dari יצא bersifat kausatif dan menggambarkan Allah mengeluarkan atau melepaskan angin dari tempat penyimpanannya.
- source_word: רוּחַ
  choice: angin
  rationale: Konteks meteorologis—awan, hujan, dan kilat—menuntut arti 'angin', bukan 'roh' atau 'napas'.
- source_word: מֵאֹצְרוֹתָיו
  choice: dari perbendaharaan-Nya
  rationale: Kata אוצר dapat berarti tempat penyimpanan atau perbendaharaan. Pilihan ini mempertahankan gambaran puitis tentang angin yang disimpan dan dikeluarkan atas kehendak Allah.
theological_decisions:
- issue: Tindakan ilahi sebagai peristiwa lampau atau kegiatan khas yang terus berlaku
  choice: 'Memakai bentuk kini generik: ''membuat'' dan ''mengeluarkan''.'
  alternative: 'Memakai bentuk lampau: ''telah membuat'' dan ''telah mengeluarkan''.'
  rationale: Konteks himne memuji pemerintahan Allah atas ciptaan sebagai kegiatan khas-Nya. Bentuk kini generik selaras dengan partisip-partisip Ibrani di sekitarnya tanpa menyangkal tindakan Allah pada masa lampau.
- issue: Hubungan antara kilat dan hujan
  choice: Menerjemahkan לַמָּטָר sebagai 'menyertai hujan'.
  alternative: '''untuk hujan'' atau ''bersama hujan''.'
  rationale: Pilihan ini mempertahankan hubungan meteorologis dalam teks tanpa menyatakan bahwa kilat menyebabkan hujan atau bahwa hujan merupakan tujuan kilat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan tiga klausa sejajar. Pronomina 'Dia' dipakai agar jelas bagi pembaca umum; akhiran hormat '-Nya' dipertahankan. Tanda titik koma mempertahankan irama dan kesejajaran puisi Ibrani.
