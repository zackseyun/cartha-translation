source:
  edition: WLC
  text: עֲצַבֵּ֣י הַ֭/גּוֹיִם כֶּ֣סֶף וְ/זָהָ֑ב מַ֝עֲשֵׂ֗ה יְדֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/015.yaml
  text: The idols of the nations are silver and gold[b][a], the work of human hands.
translation:
  language: id
  text: 'Berhala bangsa-bangsa[a] terbuat dari perak dan emas,

    hasil karya tangan manusia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Patung-patung bangsa-bangsa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַבֵּי
  choice: berhala
  rationale: Dalam konteks polemik terhadap sembahan bangsa-bangsa, kata ini menunjuk pada patung yang dijadikan objek penyembahan, sehingga “berhala” lebih tepat daripada istilah netral “patung”.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini merujuk pada bangsa-bangsa atau kelompok-kelompok di luar Israel; “bangsa-bangsa” alami dan sesuai konteks Mazmur.
- source_word: כֶּסֶף וְזָהָב
  choice: perak dan emas
  rationale: Terjemahan langsung yang mempertahankan keterangan mengenai bahan pembuat berhala.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: hasil karya tangan manusia
  rationale: Ungkapan ini mempertahankan gambaran konkret tentang tangan serta menekankan bahwa berhala itu dibuat oleh manusia. “Manusia” menyampaikan arti generik אָדָם tanpa memberi kesan rujukan khusus kepada laki-laki.
theological_decisions:
- issue: Arti generik אָדָם dalam kontras antara berhala dan Allah
  choice: manusia
  alternative: orang; umat manusia
  rationale: Kata אָדָם di sini merujuk pada manusia secara umum sebagai pembuat berhala. “Manusia” paling wajar dan mempertahankan kontras teologis antara benda buatan manusia dan Allah yang hidup.
- issue: Penyebutan benda sembahan bangsa-bangsa
  choice: berhala
  alternative: patung
  rationale: Konteksnya bukan sekadar karya seni atau gambar netral, melainkan benda yang disembah. Namun, alternatif leksikal “patung” tetap dicatat karena kata sumber dapat menunjuk pada citra atau patung.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan dua baris mengikuti paralelisme puitis ayat. “Terbuat dari” dipakai untuk mengungkapkan klausa nominal Ibrani secara alami, sedangkan “hasil karya tangan manusia” mempertahankan citra dan tekanan teks sumber.
