source:
  edition: WLC
  text: כִּֽי יַעֲקֹ֗ב בָּחַ֣ר ל֣/וֹ יָ֑הּ יִ֝שְׂרָאֵ֗ל לִ/סְגֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/004.yaml
  text: For Yah has chosen Jacob for himself[a], Israel as his treasured possession.
translation:
  language: id
  text: Sebab Yah[a] telah memilih Yakub bagi diri-Nya, Israel menjadi milik kesayangan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Yah,” bentuk pendek nama ilahi.'
    reason: Menjelaskan bentuk khusus nama ilahi yang terdapat dalam teks sumber.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan alasan bagi pujian atau ajakan dalam konteks sekitarnya.
- source_word: בָּחַר
  choice: telah memilih
  rationale: Bentuk ini menyatakan tindakan pemilihan yang sudah terjadi dan tetap bermakna bagi keadaan sekarang.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Bentuk baku bahasa Indonesia; di sini nama itu juga menunjuk kepada umat Israel.
- source_word: לּוֹ
  choice: bagi diri-Nya
  rationale: Mengungkapkan makna kepentingan dan kepemilikan khusus secara wajar tanpa menghilangkan daya refleksif frasa Ibrani.
- source_word: יָהּ
  choice: Yah
  rationale: Teks sumber memakai bentuk pendek nama ilahi; mempertahankannya menjaga ketepatan bentuk dan ciri puitis ayat.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama baku, sejajar dengan 'Yakub' sebagai sebutan bagi umat perjanjian.
- source_word: לִסְגֻלָּתוֹ
  choice: menjadi milik kesayangan-Nya
  rationale: סְגֻלָּה menunjuk pada milik khusus yang sangat dihargai, sedangkan לְ dapat menyatakan hasil atau tujuan pemilihan.
theological_decisions:
- issue: Bentuk pendek nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Karena teks Ibrani secara khusus memakai יָהּ, bukan bentuk lengkap tetragramaton, 'Yah' dipertahankan dalam teks utama agar bentuk sumber dan nilai puitisnya terlihat; catatan kaki menjelaskannya tanpa menetapkan pelafalan bentuk lengkap nama ilahi.
- issue: Hubungan Yakub dan Israel
  choice: Dipertahankan sebagai dua unsur paralel tanpa kata penjelas tambahan
  alternative: Yakub, yaitu Israel
  rationale: Puisi Ibrani menempatkan kedua nama secara paralel untuk umat yang sama, tetapi tidak memakai penanda eksplisit 'yaitu'; terjemahan tidak menambahkan penafsiran tersebut.
- issue: Makna סְגֻלָּה
  choice: milik kesayangan-Nya
  alternative: harta milik-Nya yang istimewa
  rationale: Pilihan ini mempertahankan unsur kepemilikan khusus sekaligus nilai tinggi atau kasih terhadap milik itu, tanpa membatasi istilah pada satu konstruksi teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis sederhana. Kapital pada akhiran pronomina dalam “diri-Nya” dan “kesayangan-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah dalam bahasa Indonesia.
