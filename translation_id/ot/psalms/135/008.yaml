  language: id
  text: 'yang membunuh semua anak sulung Mesir,

    dari manusia sampai hewan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: yang membunuh
  rationale: Partikel relatif yang diikuti bentuk Hifil perfektum dari נכה meneruskan uraian tentang TUHAN. Dalam konteks kematian anak-anak sulung, verba ini bersifat mematikan; “membunuh” menyampaikan makna tersebut secara alami dan jelas dalam bahasa Indonesia.
- source_word: בְּכוֹרֵי
  choice: semua anak sulung
  rationale: Bentuk jamak konstruksi בכור menunjuk secara kolektif kepada anak-anak sulung. Kata “semua” membuat cakupan jamaknya alami dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: מִצְרָיִם
  choice: di Mesir
  rationale: Walaupun secara bentuk merupakan hubungan konstruksi, ungkapan Indonesia “anak sulung di Mesir” secara alami mencakup manusia dan hewan yang berada di Mesir serta sesuai dengan konteks tulah.
- source_word: מֵ/אָדָם
  choice: dari manusia
  rationale: אָדָם di sini berlawanan dengan hewan dan karena itu menunjuk kepada golongan manusia secara umum, bukan khusus laki-laki.
- source_word: עַד
  choice: sampai
  rationale: Dalam pasangan מִן...עַד, “dari ... sampai ...” menyatakan rentang yang menyeluruh secara wajar dalam bahasa Indonesia.
- source_word: בְּהֵמָה
  choice: hewan
  rationale: בְּהֵמָה menunjuk kepada binatang, sering terutama hewan ternak. “Hewan” mempertahankan keluasan istilah dalam mazmur dan membentuk kontras alami dengan manusia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Susunan dua baris mempertahankan gerak paralel ayat Ibrani. Makna mematikan dari נכה dibuat eksplisit melalui “membunuh”; tidak diperlukan catatan kaki karena konteks menentukannya dengan jelas.
