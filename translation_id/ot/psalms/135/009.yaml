  text: שָׁלַ֤ח אֹת֣וֹת וּ֭/מֹפְתִים בְּ/תוֹכֵ֣/כִי מִצְרָ֑יִם בְּ֝/פַרְעֹ֗ה וּ/בְ/כָל עֲבָדָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/009.yaml
  text: He sent signs and wonders into your midst[a], O Egypt[b], against Pharaoh and against all his servants.
translation:
  language: id
  text: Ia mengirim tanda-tanda dan perbuatan-perbuatan ajaib ke tengah-tengahmu, hai Mesir,[a] terhadap Firaun dan terhadap semua hambanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tengah-tengahmu, hai Mesir.” Bahasa Ibrani menyapa Mesir secara langsung dengan sufiks feminin tunggal sehingga bangsa itu dipersonifikasikan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “atas Firaun dan atas semua hambanya.” Dalam konteks ini, preposisi Ibrani tersebut menunjukkan bahwa merekalah sasaran tanda-tanda dan perbuatan-perbuatan ajaib itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: Ia mengirim
  rationale: Bentuk Qal perfektum orang ketiga maskulin tunggal; subjek tersiratnya adalah TUHAN dari konteks. “Mengirim” mempertahankan makna dasar verba secara alami.
- source_word: אֹתוֹת וּמֹפְתִים
  choice: tanda-tanda dan perbuatan-perbuatan ajaib
  rationale: Mempertahankan pasangan istilah Ibrani yang lazim. “Perbuatan-perbuatan ajaib” menyampaikan hal-hal yang menimbulkan rasa takjub tanpa membatasi מֹפְתִים hanya pada satu kategori mukjizat.
- source_word: בְּתוֹכֵכִי מִצְרָיִם
  choice: ke tengah-tengahmu, hai Mesir
  rationale: Sufiks feminin tunggal menyapa Mesir secara langsung sebagai bangsa yang dipersonifikasikan. Dalam konteks pengiriman tanda-tanda, “ke tengah-tengahmu” merupakan ungkapan Indonesia yang alami, sementara “hai Mesir” memperjelas sapaan.
- source_word: בְּפַרְעֹה
  choice: terhadap Firaun
  rationale: Preposisi ב menandai sasaran atau pihak yang terkena tanda-tanda tersebut. “Terhadap” mempertahankan nuansa sasaran tanpa memaksakan arti spasial “di atas”.
- source_word: וּבְכָל עֲבָדָיו
  choice: dan terhadap semua hambanya
  rationale: עֲבָדָיו dapat mencakup hamba, pelayan, atau pejabat Firaun. “Hambanya” adalah pilihan luas dan sesuai dengan latar istana, tanpa mempersempitnya menjadi pejabat saja.
theological_decisions: []
