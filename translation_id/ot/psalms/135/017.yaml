  text: They have ears[a], but they do not hear; indeed, there is no breath in their mouths.
translation:
  language: id
  text: Mereka mempunyai telinga, tetapi tidak mendengar; bahkan, tidak ada napas dalam mulut mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani רוּחַ juga dapat berarti “roh”. Dalam konteks berhala yang tidak bernyawa dan frasa “dalam mulut mereka”, “napas” lebih sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנַיִם לָהֶם
  choice: Mereka mempunyai telinga
  rationale: Konstruksi kepunyaan tanpa verba, secara harfiah 'telinga ada pada mereka', diterjemahkan dengan susunan kepunyaan yang alami dalam bahasa Indonesia.
- source_word: וְלֹא יַאֲזִינוּ
  choice: tetapi tidak dapat mendengar
  rationale: Konjungsi menandai pertentangan antara adanya telinga dan ketidakmampuan berhala untuk mendengar. Bentuk Hifil dari אזן bermakna memasang telinga atau mendengarkan; dalam konteks berhala yang tak berfungsi, 'tidak dapat mendengar' menyampaikan maksudnya secara alami.
- source_word: אַף
  choice: bahkan
  rationale: 'Partikel ini memperkuat dan meningkatkan pernyataan berikutnya: berhala bukan hanya tidak mendengar, melainkan sama sekali tidak bernapas.'
- source_word: אֵין יֶשׁ רוּחַ
  choice: tidak ada napas
  rationale: Ungkapan eksistensial ini menyangkal adanya רוּחַ. Dalam konteks anggota tubuh berhala dan frasa 'di dalam mulut mereka', 'napas' paling sesuai dengan gambaran konkret tentang benda yang tidak bernyawa.
- source_word: בְּפִיהֶם
  choice: di dalam mulut mereka
  rationale: Terjemahan langsung yang mempertahankan bentuk jamak dan gambaran jasmani dalam sindiran terhadap berhala.
theological_decisions:
- issue: Makna רוּחַ dalam konteks polemik terhadap berhala
  choice: napas
  alternative: roh
  rationale: Ayat ini menggambarkan organ jasmani yang tidak berfungsi dan memuncak pada ketiadaan napas di dalam mulut berhala. 'Napas' mempertahankan penekanan konkret bahwa berhala tidak bernyawa, sementara kemungkinan leksikal 'roh' dicatat tanpa menjadikannya tafsiran utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya bermartabat dan mudah dipahami. 'Mempunyai' dipilih untuk konstruksi kepunyaan; 'bahkan' menjaga peningkatan retoris. Penanda catatan kaki ditempatkan setelah klausa yang memuat kata 'napas'.
