  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
translation:
  language: id
  text: Pujilah Yah[a], sebab Yahweh itu baik; nyanyikanlah pujian bagi nama-Nya, sebab nama-Nya itu indah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Yah”, bentuk singkat nama ilahi; berbeda dari “Yahweh” yang muncul sesudahnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sebab Ia indah” atau “sebab Ia menyenangkan”, jika kata sifat terakhir dipahami sebagai keterangan tentang Yahweh, bukan tentang nama-Nya.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak dari הלל merupakan seruan liturgis langsung. “Pujilah” alami dalam bahasa Indonesia modern dan mempertahankan daya ajak teks.
- source_word: יָהּ
  choice: Yah
  rationale: Ini adalah bentuk singkat nama ilahi, berbeda dari יְהוָה pada klausa berikutnya. Transliterasi “Yah” mempertahankan pembedaan tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah untuk memuji; “sebab” ringkas, wajar, dan sesuai dengan gaya puisi yang bermartabat.
- source_word: טוֹב
  choice: baik
  rationale: Padanan luas dan langsung yang mencakup kebaikan moral serta kemurahan Yahweh tanpa mempersempit maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar tetap tampil sebagai nama pribadi dan tetap dibedakan dari bentuk singkat יָהּ.
- source_word: זַמְּרוּ
  choice: nyanyikanlah pujian
  rationale: Imperatif jamak dari זמר mengacu pada pujian musikal. Ungkapan ini menyampaikan unsur nyanyian dan pujian secara alami.
- source_word: לִשְׁמוֹ
  choice: bagi nama-Nya
  rationale: Preposisi ל menandai arah atau sasaran pujian. “Bagi nama-Nya” mempertahankan ungkapan Ibrani sambil tetap alami dalam konteks ibadah.
- source_word: נָעִים
  choice: menyenangkan
  rationale: Adjektiva ini berarti menyenangkan, indah, atau elok. “Menyenangkan” merupakan padanan langsung, sementara rujukannya yang tidak dinyatakan secara eksplisit dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Pembedaan יָהּ dan יְהוָה dalam ayat yang sama
  choice: Menerjemahkannya secara berbeda sebagai “Yah” dan “Yahweh”
  alternative: Menerjemahkan keduanya sebagai “TUHAN”
  rationale: Teks Ibrani sengaja memakai bentuk singkat dan bentuk penuh nama ilahi. Mempertahankan keduanya menghindari pengaburan perbedaan leksikal.
- issue: Subjek tersirat dari נָעִים
  choice: Memahami sifat “menyenangkan” sebagai merujuk pada tindakan menyanyikan pujian
  alternative: 'Memahaminya sebagai keterangan tentang Yahweh: “sebab Ia menyenangkan/indah”'
  rationale: Bahasa Ibrani tidak menyatakan subjek adjektiva ini secara eksplisit. Teks utama mengikuti hubungan yang paling alami dengan perintah untuk menyanyi, sedangkan kemungkinan bahwa adjektiva itu menerangkan Yahweh dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme serta dua imperatif dipertahankan. Nama ilahi ditransliterasikan sebagai “Yah” dan “Yahweh”; kapitalisasi pronomina ilahi mengikuti kebiasaan umum bahasa Indonesia.
