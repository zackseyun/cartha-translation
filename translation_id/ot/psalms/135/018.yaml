  yaml_path: translation/ot/psalms/135/018.yaml
  text: Those who make them will become like them[a], everyone who trusts in them.
translation:
  language: id
  text: Orang-orang yang membuat berhala-berhala itu akan menjadi seperti berhala-berhala itu[a], demikian juga setiap orang yang percaya kepada berhala-berhala itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan seperti berhala-berhala itu.” Kata kerja Ibrani dapat diterjemahkan “akan menjadi” atau “akan [seperti]”; teks utama menonjolkan nuansa hasil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ/הֶם
  choice: seperti berhala-berhala itu
  rationale: Preposisi perbandingan dengan sufiks orang ketiga jamak menyatakan kemiripan dengan berhala-berhala yang baru saja disebut. Penyebutan ulang acuannya menghindari kesan bahwa kata ganti itu merujuk kepada manusia.
- source_word: יִהְיוּ
  choice: akan menjadi
  rationale: Kata kerja היה dapat berarti 'ada/menjadi'. Dalam konteks ini, 'akan menjadi' menyampaikan nuansa hasil tanpa menjelaskan secara berlebihan dalam hal apa para pembuat berhala menyerupai berhala mereka.
- source_word: עֹשֵׂיהֶם
  choice: orang-orang yang membuat berhala-berhala itu
  rationale: Partisipel עשה dengan sufiks jamak menunjuk kepada para pembuat berhala. Bentuk ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: כֹּל אֲשֶׁר
  choice: setiap orang yang
  rationale: Ungkapan ini mencakup semua orang dalam kelompok yang dimaksud; 'setiap orang yang' mempertahankan cakupan universalnya.
- source_word: בֹּטֵחַ בָּהֶם
  choice: percaya kepada berhala-berhala itu
  rationale: בטח dengan preposisi ב menyatakan kepercayaan atau kebergantungan kepada sesuatu. 'Percaya kepada' merupakan ungkapan Indonesia yang langsung dan wajar, sedangkan pengulangan acuan menghindari ambiguitas pronominal.
theological_decisions:
- issue: Makna menjadi seperti berhala
  choice: Ayat menyatakan bahwa pembuat berhala dan orang yang memercayainya akan menyerupai berhala itu, tanpa merinci bentuk kemiripannya.
  alternative: Mereka menjadi tidak peka secara rohani atau tidak berdaya seperti berhala.
  rationale: Teks Ibrani hanya menegaskan kemiripan dan tidak menentukan mekanisme ataupun sifat tepatnya. Terjemahan mempertahankan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan frasa 'berhala-berhala itu' dipertahankan demi kejelasan acuan, karena kata ganti 'mereka' dalam bahasa Indonesia lazimnya dipahami sebagai manusia. 'Demikian juga' memperjelas bahwa klausa terakhir termasuk dalam pernyataan yang sama tanpa menambahkan penafsiran tentang sifat kemiripan tersebut.
