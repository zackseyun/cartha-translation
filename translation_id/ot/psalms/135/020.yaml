id: PSA.135.20
reference: Psalms 135:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֵּ֣ית הַ֭/לֵּוִי בָּרֲכ֣וּ אֶת יְהוָ֑ה יִֽרְאֵ֥י יְ֝הוָ֗ה בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/020.yaml
  text: House of Levi[a], bless Yahweh; you who fear Yahweh[b], bless Yahweh.
translation:
  language: id
  text: Hai kaum Lewi[a], pujilah Yahweh! Hai orang-orang yang takut akan Yahweh[b], pujilah Yahweh!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “rumah Lewi,” yaitu garis keturunan atau komunitas Lewi sebagai satu kelompok.'
    reason: cultural_note
  - marker: b
    text: 'Dapat juga diterjemahkan: “mereka yang takut akan Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַלֵּוִי
  choice: kaum Lewi
  rationale: Secara harfiah frasa konstruksi ini berarti “rumah Lewi,” tetapi dalam rangkaian seruan liturgis ini menunjuk secara kolektif kepada garis keturunan atau komunitas Lewi. “Kaum Lewi” alami dalam bahasa Indonesia modern dan mempertahankan makna korporatnya.
- source_word: בָּרֲכוּ
  choice: pujilah
  rationale: Dalam konteks ibadah, imperatif ברך ketika manusia menjadi pelaku dan Yahweh menjadi objek berarti mengagungkan atau memuji Allah. “Pujilah” menyampaikan maksud itu secara alami dan tidak menimbulkan kesan bahwa manusia menganugerahkan berkat kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh,” bukan diganti dengan gelar.
- source_word: יִרְאֵי יְהוָה
  choice: orang-orang yang takut akan Yahweh
  rationale: Frasa partisipial ini menyebut kelompok yang dicirikan oleh rasa takut dan hormat kepada Yahweh. Bentuk dengan “orang-orang” mempertahankan kemungkinan bahwa ungkapan ini merupakan penyebutan kelompok, sedangkan partikel vokatif “Hai” menyesuaikannya dengan imperatif yang menyusul.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Makna takut dalam יִרְאֵי יְהוָה
  choice: takut akan Yahweh
  alternative: hormat kepada Yahweh
  rationale: “Takut akan” mempertahankan cakupan teologis ירא, yang dapat mencakup rasa gentar, hormat, dan kesalehan, tanpa mempersempitnya hanya menjadi penghormatan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan bercorak liturgis. Pengulangan seruan dipertahankan; “Hai” memperjelas sapaan langsung. Tanda seru mencerminkan daya imperatif dan pola pujian mazmur.
