  text: שְׂרֻפָ֣ה בָ/אֵ֣שׁ כְּסוּחָ֑ה מִ/גַּעֲרַ֖ת פָּנֶ֣י/ךָ יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/016.yaml
  text: Burned with fire, cut down—at the rebuke of your face they perish.
translation:
  language: id
  text: Terbakar oleh api, ditebang—oleh teguran dari hadirat-Mu mereka binasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂרֻפָה בָאֵשׁ
  choice: Terbakar oleh api
  rationale: Partisip pasif feminin diterjemahkan secara ringkas dengan mempertahankan gambaran pembakaran; nomina feminin yang dirujuk tersirat dari konteks sebelumnya.
- source_word: כְּסוּחָה
  choice: ditebang
  rationale: Partisip pasif ini menggambarkan tanaman atau pokok anggur yang dipotong hingga roboh; 'ditebang' alami dalam konteks metafora kebun anggur.
- source_word: מִגַּעֲרַת פָּנֶיךָ
  choice: oleh hardikan wajah-Mu
  rationale: Mempertahankan ungkapan antropomorfis dan konstruksi sumber secara dekat. Preposisi מִן di sini menyatakan sebab atau sarana.
- source_word: יֹאבֵדוּ
  choice: mereka binasa
  rationale: Bentuk jamak dipertahankan meskipun dua partisip sebelumnya feminin tunggal; pergeseran jumlah yang terdapat dalam teks sumber tidak diselaraskan secara diam-diam.
theological_decisions:
- issue: Ungkapan antropomorfis 'hardikan wajah-Mu'
  choice: Dipertahankan secara harfiah
  alternative: oleh hardikan-Mu
  rationale: Teks Ibrani secara eksplisit menyebut 'wajah-Mu'; mempertahankannya menjaga kekuatan puitis serta tidak menghapus ketegangan ungkapan sumber.
- issue: Pergeseran dari bentuk feminin tunggal ke verba jamak
  choice: Terbakar oleh api, ditebang—... mereka binasa
  alternative: Ia terbakar oleh api dan ditebang; oleh hardikan-Mu ia binasa
  rationale: Pergeseran gramatikal dalam sumber mungkin bergerak dari pokok anggur sebagai kesatuan kepada unsur-unsurnya atau para musuh yang tersirat. Terjemahan tidak memilih satu penjelasan teologis atau referensial secara paksa.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Konstruksi tanpa subjek eksplisit pada dua klausa pertama meniru kepadatan puisi Ibrani dan mempertahankan rujukan yang tersirat dari konteks. Tanda pisah menampilkan hubungan kuat antara kehancuran dan hardikan ilahi.
