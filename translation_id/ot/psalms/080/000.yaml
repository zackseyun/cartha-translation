lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Menunjukkan orang yang mengawasi pelaksanaan musik; ungkapan ini wajar dalam bahasa Indonesia dan mempertahankan fungsi liturgisnya.
- source_word: אֶל
  choice: menurut lagu
  rationale: Dalam judul mazmur, preposisi ini kemungkinan memperkenalkan nada atau pola musik. Penambahan 'lagu' memperjelas fungsi idiomatis tanpa memastikan hal yang tidak diketahui.
- source_word: שֹׁשַׁנִּים
  choice: “Bunga Bakung”
  rationale: Secara harfiah berarti bunga-bunga bakung, tetapi di sini kemungkinan merupakan nama lagu atau petunjuk musik; tanda kutip menandai fungsi tersebut.
- source_word: עֵדוּת
  choice: Suatu kesaksian
  rationale: Menerjemahkan arti dasarnya secara transparan sambil membiarkan hubungannya dengan petunjuk musik sebelumnya tetap ambigu.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Dalam konstruksi 'Mazmur Asaf', bentuk ini mempertahankan atribusi yang dapat menyatakan kepengarangan, hubungan, atau keanggotaan koleksi.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Padanan baku dan alami bagi jenis nyanyian yang ditandai oleh istilah Ibrani ini.
