  yaml_path: translation/ot/psalms/080/002.yaml
  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
translation:
  language: id
  text: Di hadapan Efraim, Benyamin, dan Manasye, bangkitkanlah keperkasaan-Mu[b] dan datanglah[a] untuk menyelamatkan kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pergilah demi keselamatan kami.” Kata kerja Ibraninya secara harfiah berarti “pergi/berjalan,” tetapi dalam konteks ini merupakan permohonan agar Allah datang bertindak demi umat-Nya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kekuatan-Mu” atau “kuasa-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: Di hadapan
  rationale: Ungkapan ini mempertahankan gambaran spasial bahwa Allah tampil atau bergerak di depan ketiga suku tersebut, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: Efraim, Benyamin, dan Manasye
  rationale: Nama-nama suku ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia; rangkaian waw disampaikan dengan tanda koma dan 'dan' agar alami.
- source_word: עוֹרְרָה
  choice: bangkitkanlah
  rationale: Bentuk permohonan imperatif ini berarti membangunkan atau menggerakkan sesuatu agar bertindak; 'bangkitkanlah' mempertahankan metaforanya dan cocok dengan objek 'keperkasaan-Mu'.
- source_word: אֶת גְּבוּרָתֶךָ
  choice: keperkasaan-Mu
  rationale: גְּבוּרָה menunjuk pada kekuatan atau kuasa yang perkasa. 'Keperkasaan' memberi ragam doa yang luhur tanpa mempersempit maknanya.
- source_word: וּלְכָה
  choice: dan datanglah
  rationale: Secara leksikal verba ini berarti 'pergi/berjalan', tetapi dalam permohonan kepada Allah konteksnya adalah gerak menuju umat untuk menolong; 'datanglah' menyampaikan maksud kontekstual itu. Makna harfiahnya dicatat dalam catatan kaki.
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: untuk menyelamatkan kami
  rationale: Konstruksi ini secara harfiah mengarah pada 'untuk keselamatan bagi kami'; bentuk verbal Indonesia menyampaikan tujuan tindakan secara alami tanpa menambah isi teologis.
theological_decisions:
- issue: Arah gerak tindakan ilahi dalam permohonan
  choice: datanglah untuk menyelamatkan kami
  alternative: pergilah demi keselamatan kami
  rationale: Konteks doa memohon Allah hadir dan bertindak bagi umat-Nya, sehingga 'datanglah' alami dalam bahasa sasaran. Namun, karena verba Ibraninya secara harfiah berarti 'pergi/berjalan', alternatif itu dipertahankan dalam catatan kaki agar ketegangan leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa doa yang modern, wajar, dan bermartabat. Akhiran hormat ilahi ditulis dengan huruf kapital. Penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskan dan semuanya muncul dalam teks utama.
