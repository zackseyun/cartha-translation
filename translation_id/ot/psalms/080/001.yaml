source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: id
  text: 'Gembala Israel, dengarkanlah,

    Engkau yang menuntun Yusuf seperti kawanan domba;

    Engkau yang bertakhta di atas kerub-kerub[a],

    bersinarlah!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang bersemayam di antara kerub-kerub.” Secara harfiah, bahasa Ibraninya menyebut Dia sebagai “yang duduk/bersemayam” dalam hubungan dengan kerub-kerub, tanpa menyatakan hubungan ruang secara eksplisit. Ungkapan ini menggambarkan hadirat Allah sebagai Raja.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעֵה יִשְׂרָאֵל
  choice: Gembala Israel
  rationale: Partisipel רֹעֵה dipakai sebagai sapaan dan gelar ilahi. “Gembala Israel” mempertahankan metafora pastoral secara alami dan ringkas.
- source_word: הַאֲזִינָה
  choice: dengarkanlah
  rationale: Imperatif ini meminta perhatian saksama. “Dengarkanlah” merupakan padanan Indonesia modern yang wajar, bermartabat, dan lebih alami daripada terjemahan harfiah “berilah telinga”.
- source_word: נֹהֵג
  choice: menuntun
  rationale: Dalam gambaran penggembalaan, “menuntun” menyampaikan pengarahan aktif tanpa kesan keras yang dapat timbul dari “menggiring”.
- source_word: כַּצֹּאן
  choice: seperti kawanan domba
  rationale: צֹאן adalah nomina kolektif bagi ternak kecil. “Kawanan domba” mempertahankan pengertian kolektif dan memperjelas citra pastoral.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Nama pribadi dipertahankan sebagaimana teks Ibrani, meskipun dalam konteks ini kemungkinan besar merupakan sebutan metonimis bagi umat Israel, khususnya suku-suku utara.
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: Engkau yang bertakhta di atas kerub-kerub
  rationale: יֹשֵׁב dalam citra kerajaan ilahi menyatakan keberadaan di takhta, bukan sekadar duduk. “Di atas” menjaga gambaran hadirat kerajaan Allah tanpa mempersempit hubungan ruang menjadi hanya “di antara”.
- source_word: הוֹפִיעָה
  choice: bersinarlah
  rationale: Imperatif Hifil ini dalam konteks penampakan ilahi menunjuk pada tampilnya Allah dalam kemegahan bercahaya. “Bersinarlah” mempertahankan unsur cahaya dan manifestasi secara puitis.
theological_decisions:
- issue: Gambaran Allah bertakhta sehubungan dengan kerub-kerub
  choice: bertakhta di atas kerub-kerub
  alternative: bersemayam di antara kerub-kerub; duduk di atas kerub-kerub
  rationale: Ungkapan ini membangkitkan gambaran tabut sebagai takhta ilahi. “Bertakhta” menangkap daya kerajaan ungkapan tersebut, sedangkan “di atas” cukup luas untuk tidak menetapkan secara berlebihan posisi ruang yang dimaksud.
- issue: Cakupan nama “Yusuf”
  choice: Nama “Yusuf” dipertahankan dalam teks utama
  alternative: Israel; suku-suku utara
  rationale: Teks sumber memakai nama יוֹסֵף. Penafsirannya sebagai sebutan bagi Israel atau terutama kerajaan utara tidak dimasukkan ke dalam teks utama agar ambiguitas historis-puitis tetap terpelihara.
translation_notes:
  register: Puisi doa dengan ragam Indonesia modern yang luhur namun mudah dipahami. Pembagian baris mengikuti dua seruan sejajar yang ditandai oleh struktur Masoretik. Sapaan “Engkau” dipakai untuk menjaga kejelasan dan kekhidmatan.
