source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָאוֹת֮ שֽׁ֫וּב נָ֥א הַבֵּ֣ט מִ/שָּׁמַ֣יִם וּ/רְאֵ֑ה וּ֝/פְקֹ֗ד גֶּ֣פֶן זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: id
  text: Ya Allah Penguasa bala tentara, kembalilah kiranya; pandanglah dari surga dan lihatlah, serta perhatikanlah pohon anggur ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kunjungilah pohon anggur ini.” Kata Ibrani yang digunakan dapat berarti “mengunjungi,” “memperhatikan,” “memelihara,” atau “memeriksa”; di sini maksudnya adalah agar Allah bertindak demi kebaikan pohon anggur itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Ya Allah Penguasa bala tentara
  rationale: Sapaan ini mempertahankan gambaran Allah sebagai penguasa bala tentara surgawi. Bentuk dengan 'Penguasa' lebih alami dalam bahasa Indonesia daripada konstruksi harfiah 'Allah bala tentara', tanpa mengubahnya menjadi gelar yang lebih interpretatif seperti 'Yang Mahakuasa'.
- source_word: שׁוּב נָא
  choice: kembalilah kiranya
  rationale: שׁוּב menyatakan permohonan agar Allah kembali atau berpaling lagi kepada umat-Nya, sedangkan נָא memberi nuansa permohonan. 'Kiranya' mempertahankan nada doa yang khidmat dan wajar.
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: pandanglah dari surga
  rationale: הבט mengacu pada tindakan memandang dengan perhatian. 'Dari surga' mempertahankan titik pandang teks tanpa harus menambahkan kata 'ke bawah', yang sudah tersirat.
- source_word: וּרְאֵה
  choice: dan lihatlah
  rationale: Imperatif sederhana ini dipertahankan sebagai unsur tersendiri dalam rangkaian puitis, meskipun maknanya berdekatan dengan 'pandanglah'.
- source_word: וּפְקֹד
  choice: serta perhatikanlah
  rationale: פקד dapat berarti mengunjungi, memperhatikan, memelihara, atau memeriksa. Dalam doa bagi pohon anggur ini, 'perhatikanlah' memungkinkan makna campur tangan demi kesejahteraannya tanpa mempersempit cakupan kata tersebut.
- source_word: גֶּפֶן זֹאת
  choice: pohon anggur ini
  rationale: גפן berbentuk tunggal dan menunjuk pada tanaman anggur, bukan kebun anggur. 'Pohon anggur' adalah ungkapan Indonesia yang alami dan mempertahankan metafora tunggal itu.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֱלֹהִים צְבָאוֹת
  choice: Allah Penguasa bala tentara
  alternative: Allah Yang Mahakuasa
  rationale: Pilihan utama mempertahankan citra bala tentara surgawi dan pemerintahan Allah atas mereka. Alternatif 'Yang Mahakuasa' menyampaikan kuasa Allah, tetapi menghilangkan citra militer-kosmis yang nyata dalam bahasa Ibrani.
- issue: Arah tindakan dalam וּפְקֹד
  choice: perhatikanlah
  alternative: kunjungilah
  rationale: Konteks ratapan mengharapkan tindakan Allah demi pemulihan pohon anggur. 'Perhatikanlah' mempertahankan orientasi yang menguntungkan tanpa menjadikan satu nuansa leksikal sebagai satu-satunya makna.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Sapaan 'Ya' menandai vokatif secara alami; 'kiranya' menjaga nada permohonan puitis. Rangkaian imperatif dan metafora pohon anggur dipertahankan.
