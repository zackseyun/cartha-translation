  text: לָ֭/מָּה פָּרַ֣צְתָּ גְדֵרֶ֑י/הָ וְ֝/אָר֗וּ/הָ כָּל עֹ֥בְרֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/012.yaml
  text: Why have you broken down its walls[b][a], so that all who pass by the way pluck its fruit?
translation:
  language: id
  text: Mengapa Engkau merobohkan pagar-pagarnya[a], sehingga semua orang yang lewat di jalan memetik buahnya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tembok-tembok pelindungnya” atau “pagar semaknya”; kata Ibrani menunjuk pada pembatas yang melindungi kebun anggur.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “memetiknya.” Yang dimaksud ialah memetik hasil pokok anggur; dapat juga diterjemahkan “memungut hasilnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya ini memperkenalkan keluhan yang ditujukan langsung kepada Allah; “Mengapa” merupakan padanan Indonesia yang alami dan tepat.
- source_word: פָּרַצְתָּ
  choice: Engkau merobohkan
  rationale: Kata kerja פרץ berarti menerobos atau membuat bobol. Dalam gambaran kebun anggur, “merobohkan” secara alami menyatakan bahwa pelindungnya dibuka atau dirusak.
- source_word: גְדֵרֶיהָ
  choice: pagar-pagarnya
  rationale: גדר menunjuk pada pagar, tembok, atau pagar semak yang mengelilingi dan melindungi kebun anggur. “Pagar-pagarnya” mempertahankan gambaran kebun dan bentuk jamaknya.
- source_word: וְאָרוּהָ
  choice: sehingga ... memetik buahnya
  rationale: ארה berarti memetik atau mengumpulkan hasil tanaman. Bahasa Indonesia memerlukan objek yang lebih jelas; “buahnya” menyatakan hasil pokok anggur yang tersirat tanpa mengubah metafora.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: semua orang yang lewat di jalan
  rationale: Padanan ini menyampaikan secara alami makna harfiah “semua orang yang melewati jalan” dan mempertahankan cakupan menyeluruh kata כָּל.
theological_decisions:
- issue: Rujukan akhiran feminin tunggal
  choice: Mempertahankan rujukannya pada pokok anggur atau kebun anggur melalui bentuk “-nya”
  alternative: Mengganti metafora itu dengan penyebutan langsung Israel
  rationale: Dalam konteks terdekat, Israel digambarkan sebagai pokok anggur yang dibawa keluar dari Mesir. Terjemahan mempertahankan metafora tersebut dan tidak menguraikannya menjadi pernyataan prosa langsung tentang Israel.
- issue: Hubungan antara perobohan pagar dan tindakan orang yang lewat
  choice: Menggunakan “sehingga” untuk menyatakan akibat
  alternative: 'Menerjemahkan secara koordinatif: “dan semua orang ...”'
  rationale: Konjungsi Ibrani dapat tetap bersifat koordinatif, tetapi dalam konteks ini tindakan orang yang lewat merupakan akibat nyata dari pagar yang dirobohkan. “Sehingga” mengungkapkan hubungan wacana itu secara alami tanpa menambahkan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. “Engkau” mempertahankan sapaan langsung kepada Allah; huruf kapital mengikuti kebiasaan ejaan religius Indonesia. Pengulangan “pagar-pagarnya” mempertahankan bentuk jamak Ibrani dan tetap wajar dalam konteks puisi.
