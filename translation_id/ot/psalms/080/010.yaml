  text: The mountains were covered by its shade[a], and its branches were like the cedars of God.
translation:
  language: id
  text: Gunung-gunung tertutup oleh naungannya, dan cabang-cabangnya menutupi pohon-pohon aras Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pohon-pohon aras yang perkasa.” Ungkapan Ibrani “pohon-pohon aras Allah” dapat menjadi idiom yang menyatakan kebesaran atau kemegahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּסּוּ
  choice: tertutupi
  rationale: Bentuk Qal perfektif orang ketiga jamak dari כסה. Dalam susunan Ibrani, gunung-gunung menjadi subjek yang tertutupi naungan pohon anggur; bentuk pasif ini alami dalam bahasa Indonesia.
- source_word: הָרִים
  choice: Gunung-gunung
  rationale: Nomina jamak dengan artikel; pengulangan nomina menyatakan bentuk jamak secara jelas dan wajar dalam bahasa Indonesia.
- source_word: צִלָּהּ
  choice: naungannya
  rationale: צל dapat berarti bayang-bayang atau naungan. Dalam gambaran pohon anggur yang merambat luas, 'naungan' paling alami dan tetap menyampaikan tutupan yang dihasilkannya.
- source_word: וַעֲנָפֶיהָ
  choice: dan cabang-cabangnya
  rationale: ענף menunjuk pada cabang atau dahan. 'Cabang-cabang' mudah dipahami dan mempertahankan gambaran tumbuhan.
- source_word: אַרְזֵי אֵל
  choice: pohon-pohon aras Allah
  rationale: Terjemahan ini mempertahankan konstruksi harfiah 'aras Allah' dan tidak menutup kemungkinan bahwa ungkapan tersebut merupakan idiom untuk pohon aras yang luar biasa besar atau megah.
theological_decisions:
- issue: Makna אֵל dalam frasa אַרְזֵי אֵל
  choice: Mempertahankan ungkapan 'pohon-pohon aras Allah' dalam teks utama
  alternative: '''pohon-pohon aras yang perkasa'' atau ''pohon-pohon aras yang megah'''
  rationale: Istilah ilahi dalam konstruksi Ibrani dapat menyatakan kebesaran sebagai bentuk superlatif, tetapi juga dapat mempertahankan hubungan langsung dengan Allah. Terjemahan utama menjaga ketegangan ini, sedangkan catatan kaki menjelaskan kemungkinan idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. 'Naungan' dipilih daripada 'bayang-bayang' agar cocok dengan citra pohon anggur yang menaungi wilayah luas; pengulangan jamak dipertahankan demi kejelasan.
