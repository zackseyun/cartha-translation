source:
  edition: WLC
  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/019.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
translation:
  language: id
  text: Ya Yahweh, Allah bala tentara[a], pulihkanlah kami[b]; buatlah wajah-Mu bersinar, supaya kami diselamatkan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Allah pasukan-pasukan”; gelar ini dapat menunjuk pada bala tentara surgawi.
    reason: lexical_clarification
  - marker: b
    text: Dapat juga diterjemahkan “buatlah kami berbalik” atau “bawalah kami kembali.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “maka kami akan diselamatkan.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi secara langsung, sesuai bentuk Ibrani dan tanpa menggantinya dengan gelar.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam rangkaian sapaan kepada YHWH, kata ini berfungsi sebagai sebutan umum bagi Allah.
- source_word: צְבָאוֹת
  choice: bala tentara
  rationale: Bentuk jamak ini menunjuk pada kumpulan pasukan atau bala tentara. Pilihan ini mempertahankan citra sumber dan tidak mempersempitnya secara pasti hanya kepada pasukan manusia atau pasukan surgawi.
- source_word: הֲשִׁיבֵנוּ
  choice: pulihkanlah kami
  rationale: Bentuk kausatif dari שוב dapat berarti membuat kembali, membawa kembali, atau memulihkan. Dalam refrein Mazmur 80, 'pulihkanlah kami' menyampaikan permohonan agar keadaan umat dipulihkan sambil mempertahankan kemungkinan nuansa pertobatan atau pengembalian.
- source_word: הָאֵר
  choice: buatlah ... bersinar
  rationale: Imperatif hifil dari אור memiliki daya kausatif, yaitu 'buatlah bersinar'; ungkapan ini mempertahankan daya tersebut dalam bahasa Indonesia yang jelas.
- source_word: פָּנֶיךָ
  choice: wajah-Mu ... atas kami
  rationale: Kata konkret 'wajah' dipertahankan. Frasa 'atas kami' menyatakan arah sinarnya secara wajar dalam bahasa Indonesia tanpa mengganti citra wajah dengan tafsiran abstrak seperti 'hadirat' atau 'perkenanan'.
- source_word: וְנִוָּשֵׁעָה
  choice: maka kami akan diselamatkan
  rationale: Bentuk nifal orang pertama jamak menyatakan bahwa umat menerima tindakan penyelamatan. Setelah dua imperatif, waw dapat menyampaikan hasil; 'maka' mempertahankan hubungan hasil itu tanpa menjadikannya pernyataan yang terlepas dari permohonan.
theological_decisions:
- issue: Makna gelar יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Ya Yahweh, Allah bala tentara
  alternative: Ya Yahweh, Allah semesta alam
  rationale: Terjemahan utama mempertahankan nama ilahi dan gambaran 'pasukan-pasukan' dalam צְבָאוֹת. Catatan kaki mengakui bahwa gelar itu dapat dipahami sebagai bala tentara surgawi tanpa menetapkan cakupannya secara sempit.
- issue: Daya הֲשִׁיבֵנוּ dalam refrein
  choice: pulihkanlah kami
  alternative: buatlah kami berbalik; bawalah kami kembali
  rationale: Konteks memungkinkan pemulihan keadaan umat sekaligus gerak kembali kepada Allah. Terjemahan utama memakai ungkapan Indonesia yang mencakup pemulihan, sedangkan catatan menjaga alternatif leksikal yang asli.
- issue: Hubungan וְנִוָּשֵׁעָה dengan permohonan sebelumnya
  choice: maka kami akan diselamatkan
  alternative: supaya kami diselamatkan
  rationale: Rangkaian ini dapat dibaca sebagai hasil atau tujuan sesudah imperatif. 'Maka' mempertahankan hasil yang diharapkan, sementara catatan kaki mencatat bacaan tujuan agar ketegangan sintaksis tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya” serta sufiks hormat “-Mu” sesuai dengan doa langsung kepada Allah. Istilah “bala tentara” dipertahankan karena masih dapat dipahami dan lebih dekat pada citra Ibrani daripada “semesta alam”.
