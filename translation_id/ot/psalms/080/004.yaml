  text: יְהוָ֣ה אֱלֹהִ֣ים צְבָא֑וֹת עַד מָתַ֥י עָ֝שַׁ֗נְתָּ בִּ/תְפִלַּ֥ת עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: id
  text: Ya Yahweh, Allah semesta alam, berapa lama lagi Engkau murka terhadap doa umat-Mu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Engkau berasap terhadap doa umat-Mu.” Kata Ibrani itu menggambarkan kemurkaan seperti asap yang mengepul.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Allah semesta alam
  rationale: Ungkapan baku dan bermartabat dalam bahasa Indonesia untuk gelar ilahi ini; mencakup gagasan bahwa segala bala tentara atau kuasa berada di bawah pemerintahan-Nya tanpa mempersempit acuannya.
- source_word: עַד מָתַי
  choice: berapa lama lagi
  rationale: Ungkapan ratapan yang alami dalam bahasa Indonesia dan menyampaikan desakan pertanyaan Ibrani.
- source_word: עָשַׁנְתָּ
  choice: Engkau murka
  rationale: Secara harfiah verba ini menggambarkan berasap atau mengepul sebagai kiasan kemurkaan. Dalam bahasa Indonesia, menerjemahkan langsung 'berasap terhadap doa' tidak alami dan dapat mengaburkan maksud; citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: בִּתְפִלַּת
  choice: terhadap doa
  rationale: 'Preposisi ב dalam konteks verba kemurkaan dipahami secara adversatif atau relasional: kemurkaan diarahkan terhadap atau berkenaan dengan doa itu.'
- source_word: עַמֶּךָ
  choice: umat-Mu
  rationale: Menyampaikan hubungan komunal-perjanjian secara alami dalam konteks ibadah dan mazmur.
theological_decisions:
- issue: Penerjemahan gelar יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Ya Yahweh, Allah semesta alam
  alternative: Ya Yahweh, Allah bala tentara
  rationale: Nama Yahweh dipertahankan, sedangkan gelar צְבָאוֹת diterjemahkan dengan ungkapan Indonesia yang mapan dan tidak menentukan secara berlebihan apakah bala tentara duniawi atau surgawi yang dimaksud.
- issue: Kiasan asap dalam עָשַׁנְתָּ
  choice: Engkau murka, dengan penjelasan citra asap dalam catatan kaki
  alternative: Engkau berasap terhadap doa umat-Mu
  rationale: Pilihan utama menjaga kejelasan dan kewajaran bahasa Indonesia, sementara catatan kaki mempertahankan citra puitis Ibrani dan kemungkinan terjemahan yang lebih harfiah tanpa menghapus ketegangan bahwa kemurkaan ilahi tertuju pada doa umat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Sapaan “Ya” menandai vokatif; kapitalisasi pronomina ilahi mengikuti kelaziman religius Indonesia. Citra harfiah yang sulit dipahami dalam teks utama dijelaskan pada catatan kaki.
