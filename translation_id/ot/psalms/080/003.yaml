  text: אֱלֹהִ֥ים הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/003.yaml
  text: God[a], restore us, and make your face shine[c][b], that we may be saved.
translation:
  language: id
  text: Ya Allah, pulihkanlah kami[a], dan buatlah wajah-Mu bersinar[b], agar kami diselamatkan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bawalah kami kembali” atau “buatlah kami berbalik.” Kata kerja Ibrani ini dapat berarti menyebabkan seseorang kembali atau berbalik.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “buatlah wajah-Mu bersinar.” Ini adalah gambaran perkenanan dan kehadiran Allah; bandingkan Bilangan 6:25.
    reason: cross_reference
  - marker: c
    text: Atau “dan kami akan diselamatkan.” Bentuk Ibraninya dapat dipahami sebagai hasil yang dimohonkan maupun hasil yang dinyatakan dengan yakin.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Kata ini menunjuk kepada Allah Israel dan berfungsi sebagai sapaan langsung. Partikel “Ya” ditambahkan secara wajar dalam bahasa Indonesia untuk menandai bentuk vokatif tanpa mengubah referennya.
- source_word: הֲשִׁיבֵנוּ
  choice: pulihkanlah kami
  rationale: Bentuk Hifil dari שוב secara harfiah menyatakan tindakan menyebabkan kembali atau berbalik. Dalam konteks refrein mazmur ini, “pulihkanlah kami” secara alami mencakup pemulihan hubungan dan keadaan, sementara kemungkinan arti “bawalah kami kembali” atau “buatlah kami berbalik” dipertahankan dalam catatan.
- source_word: וְהָאֵר פָּנֶיךָ
  choice: sinarilah kami dengan wajah-Mu
  rationale: Ungkapan ini mempertahankan citra wajah ilahi yang bersinar sekaligus menghasilkan bahasa Indonesia yang alami. Bentuk Hifil imperatif menyatakan tindakan membuat atau membiarkan wajah bersinar; konstruksi Indonesia ini menyampaikan bahwa sinar wajah Allah tertuju kepada umat.
- source_word: וְנִוָּשֵׁעָה
  choice: maka kami akan diselamatkan
  rationale: Bentuk Nifal orang pertama jamak menyatakan hasil yang diharapkan setelah permohonan sebelumnya. “Maka” menghubungkan keselamatan dengan tindakan Allah, sedangkan “akan diselamatkan” mempertahankan bentuk pasif dan dapat menyuarakan baik harapan dalam doa maupun keyakinan akan hasilnya.
theological_decisions:
- issue: Nuansa volitif pada וְנִוָּשֵׁעָה dan hubungannya dengan dua imperatif sebelumnya
  choice: maka kami akan diselamatkan
  alternative: supaya kami diselamatkan
  rationale: Bahasa Ibrani memungkinkan klausa ini didengar sebagai hasil yang dimohonkan ataupun sebagai pernyataan yakin mengenai hasilnya. Terjemahan utama memakai konstruksi hasil yang wajar dalam bahasa Indonesia, sementara catatan mempertahankan pembacaan tujuan atau permohonan.
- issue: Citra wajah Allah yang bersinar
  choice: mempertahankan kata “wajah” dan gambaran sinarnya
  alternative: curahkanlah perkenanan-Mu atau hadirkanlah diri-Mu
  rationale: Metafora sumber menyatakan perkenanan dan kehadiran ilahi serta menggemakan berkat imam dalam Bilangan 6:25. Menggantinya dengan makna tafsiran akan menghilangkan citra dan kaitan antarteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Ya Allah” dan akhiran imperatif “-lah” sesuai untuk doa. Pilihan “wajah-Mu” mempertahankan metafora Ibrani, dan kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
