  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: id
  text: Maka kami tidak akan berbalik dari-Mu; hidupkanlah kami[a], dan kami akan berseru kepada nama-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidupkanlah kami kembali”; ungkapan Ibrani ini juga dapat berarti “peliharalah kami tetap hidup” atau “berilah kami hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Maka ... tidak
  rationale: Konjungsi dengan negasi menyatakan akibat dari permohonan sebelumnya; “maka” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: נָסוֹג
  choice: berbalik
  rationale: Bentuk ini berarti mundur atau berbalik. “Berbalik dari-Mu” jelas dan mempertahankan nuansa kesetiaan tanpa memasukkan gagasan yang lebih sempit seperti kemurtadan.
- source_word: מִמֶּךָּ
  choice: dari-Mu
  rationale: Preposisi מן dengan akhiran orang kedua maskulin tunggal menyatakan pemisahan dan secara alami mengikuti “berbalik”.
- source_word: תְּחַיֵּנוּ
  choice: hidupkanlah kami
  rationale: Bentuk Piel dari חיה dapat berarti memberi hidup, menghidupkan kembali, atau memelihara tetap hidup. “Hidupkanlah kami” mempertahankan daya kausatif dan keluasan maknanya.
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: maka kami akan berseru kepada nama-Mu
  rationale: קרא dengan בְּשֵׁם dalam konteks ini menyatakan pemanggilan atau permohonan kepada Allah. “Berseru kepada nama-Mu” alami, khidmat, dan mempertahankan nuansa doa serta ibadah.
theological_decisions:
- issue: Makna permohonan agar diberi hidup
  choice: Permohonan agar Allah menghidupkan atau memulihkan umat sehingga mereka tetap setia dan berseru kepada-Nya.
  alternative: Permohonan yang lebih sempit untuk kebangunan rohani, atau permohonan yang lebih luas agar dipelihara tetap hidup.
  rationale: חיה dalam bentuk Piel mencakup menghidupkan kembali, memberi hidup, atau memelihara kehidupan. Teks utama dan catatan kaki mempertahankan keluasan serta ketegangan makna ini.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk “-Mu” mempertahankan sapaan langsung kepada Allah; struktur dua klausa dan hubungan akibat dijaga tanpa menambah penafsiran denominatif.
