id: PSA.80.13
reference: Psalms 80:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְכַרְסְמֶ֣/נָּֽה חֲזִ֣יר מִ/יָּ֑ וְ/זִ֖יז שָׂדַ֣י יִרְעֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/013.yaml
  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
translation:
  language: id
  text: Babi hutan dari rimba menggerogotinya[a], dan binatang liar di padang[b] memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merusaknya dengan memakannya.” Kata kerja Ibrani yang jarang dipakai ini menggambarkan kegiatan makan yang merusak.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “makhluk-makhluk yang bergerak di padang.” Kata Ibrani yang dipakai di sini tidak umum dan menunjuk kepada binatang atau makhluk hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: menggerogotinya
  rationale: Kata kerja כרסם yang jarang dipakai menggambarkan tindakan makan yang merusak atau mengikis. “Menggerogotinya” mempertahankan gambaran seekor binatang yang memakan sekaligus merusak pohon anggur itu.
- source_word: חֲזִיר
  choice: babi hutan
  rationale: חֲזִיר berarti babi; keterangan bahwa binatang itu berasal dari rimba menunjukkan babi liar. “Babi hutan” adalah sebutan Indonesia yang alami dan tepat.
- source_word: מִיָּעַר
  choice: dari rimba
  rationale: Kata depan מִן menyatakan asal. “Dari rimba” mempertahankan gambaran kawasan berhutan serta menghindari pengulangan yang janggal dalam frasa “babi hutan dari hutan”.
- source_word: זִיז שָׂדַי
  choice: binatang liar di padang
  rationale: זִיז adalah kata benda yang tidak umum untuk makhluk hidup yang bergerak, khususnya binatang liar. Dalam gabungan dengan שָׂדַי, terjemahan ini alami dan mempertahankan latar padang terbuka.
- source_word: יִרְעֶנָּה
  choice: memakannya
  rationale: רעה pada bentuk Qal dapat berarti merumput atau mencari makan. Dengan pohon anggur sebagai objek, “memakannya” mengungkapkan bahwa binatang-binatang itu menjadikannya makanan tanpa membatasi tindakan tersebut pada merumput.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. “Rimba” dipilih agar ungkapan tetap alami sesudah “babi hutan”; akhiran “-nya” pada kedua verba merujuk kepada pohon anggur dalam konteks sebelumnya.
