  text: גֶּ֭פֶן מִ/מִּצְרַ֣יִם תַּסִּ֑יעַ תְּגָרֵ֥שׁ גּ֝וֹיִ֗ם וַ/תִּטָּעֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/008.yaml
  text: You brought a vine out of Egypt[b][a]; you drove out nations and planted it.
translation:
  language: id
  text: Engkau memindahkan pohon anggur dari Mesir[a]; Engkau menghalau bangsa-bangsa lalu menanamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa pohon anggur keluar dari Mesir,” “membuat pohon anggur berangkat dari Mesir,” atau “mencabut pohon anggur dari Mesir.” Kata kerja Ibrani dapat berarti membuat sesuatu berangkat atau mencabut dan memindahkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּפֶן
  choice: pohon anggur
  rationale: Kata ini berarti tanaman anggur dan di sini menjadi metafora bagi Israel. ‘Pohon anggur’ adalah ungkapan Indonesia yang alami dan tetap mempertahankan metaforanya.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Preposisi menandai asal; ‘dari Mesir’ menyampaikan gerakan keluar dari Mesir secara wajar dalam bahasa Indonesia.
- source_word: תַּסִּיעַ
  choice: Engkau memindahkan
  rationale: Bentuk Hifil dari נסע dapat berarti membuat berangkat, mencabut, atau memindahkan. Dalam gambaran tanaman anggur yang kemudian ditanam, ‘memindahkan’ mempertahankan unsur perpindahan tanpa memastikan apakah tindakan mencabut ditekankan.
- source_word: תְּגָרֵשׁ
  choice: Engkau menghalau
  rationale: Bentuk Piel dari גרש berarti mengusir atau menghalau. ‘Menghalau’ kuat, alami, dan sesuai dengan konteks bangsa-bangsa yang dikeluarkan dari negeri itu.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks penaklukan negeri, bentuk jamak ini paling tepat diterjemahkan ‘bangsa-bangsa’; ‘orang-orang bukan Yahudi’ akan memasukkan kontras teologis yang tidak diperlukan.
- source_word: וַתִּטָּעֶהָ
  choice: lalu menanamnya
  rationale: Kata kerja berarti ‘dan Engkau menanamnya’; akhiran mengacu pada גֶּפֶן yang secara gramatikal feminin. Bahasa Indonesia memakai ‘-nya’ secara alami tanpa menambahkan personifikasi.
theological_decisions:
- issue: Identitas metaforis pohon anggur
  choice: Metafora ‘pohon anggur’ dipertahankan dalam teks utama.
  alternative: Mengganti metafora dengan ‘Israel’.
  rationale: Teks Ibrani menyebut Israel melalui metafora pohon anggur. Menuliskan ‘Israel’ dalam teks utama akan mengubah penafsiran menjadi terjemahan eksplisit.
- issue: Ambiguitas tindakan תַּסִּיעַ
  choice: Diterjemahkan ‘memindahkan’, dengan alternatif dijelaskan dalam catatan.
  alternative: ‘membawa keluar’, ‘membuat berangkat’, atau ‘mencabut’.
  rationale: Kata Ibrani dapat menggambarkan tindakan membuat berangkat maupun mencabut dan memindahkan tanaman. ‘Memindahkan’ sesuai dengan keseluruhan citra transplantasi, sedangkan catatan menjaga rentang maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Kapitalisasi ‘Engkau’ mengikuti sapaan langsung kepada Allah. Metafora tanaman anggur dipertahankan; hubungan antarklausa dibuat alami dengan ‘lalu’.
