source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/007.yaml
  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: id
  text: Ya Allah Semesta Alam, pulihkanlah kami[a]; buatlah wajah-Mu bersinar[b], dan kami akan diselamatkan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “bawalah kami kembali” atau “buatlah kami berbalik.” Kata kerja Ibrani ini dapat menyatakan tindakan kembali maupun pemulihan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “wajah-Mu.” Ungkapan ini menunjuk pada kehadiran Allah yang penuh perkenanan.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “kami akan dilepaskan.” Kata Ibrani ini dapat menunjuk secara luas pada pertolongan, pembebasan, atau keselamatan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Ya Allah Semesta Alam
  rationale: Frasa ini merupakan sapaan langsung dan gelar ilahi. Partikel “Ya” menyatakan fungsi vokatif secara wajar dalam bahasa Indonesia, sedangkan “Semesta Alam” mempertahankan keluasan צְבָאוֹת sebagai seluruh bala atau kuasa di bawah pemerintahan Allah tanpa membatasinya pada tentara manusia.
- source_word: הֲשִׁיבֵנוּ
  choice: pulihkanlah kami
  rationale: Bentuk kausatif dari שוב dapat berarti menyebabkan kembali atau memulihkan. “Pulihkanlah kami” alami dalam konteks ratapan ini serta tidak mempersempit pemulihan itu menjadi kepulangan geografis, pertobatan, atau pembaruan perjanjian saja.
- source_word: וְהָאֵר פָּנֶיךָ
  choice: buatlah wajah-Mu bersinar
  rationale: Terjemahan ini mempertahankan bentuk kausatif dari אור dan gambaran konkret “wajah-Mu”. Ungkapan tersebut menunjuk pada kehadiran dan perkenanan Allah, tetapi makna kiasannya tidak menggantikan gambaran Ibrani dalam teks utama.
- source_word: וְנִוָּשֵׁעָה
  choice: dan kami akan diselamatkan
  rationale: Bentuk nifal dari ישׁע menyatakan hasil berupa penyelamatan atau pembebasan. “Diselamatkan” mempertahankan cakupan maknanya yang luas tanpa menentukan apakah yang dimaksud hanya pertolongan historis atau keselamatan dalam arti yang lebih luas.
theological_decisions:
- issue: Makna gelar אֱלֹהִים צְבָאוֹת
  choice: Ya Allah Semesta Alam
  alternative: Ya Allah bala tentara
  rationale: “Semesta Alam” merupakan gelar ilahi yang wajar dan luas dalam bahasa Indonesia serta menyatakan kedaulatan Allah atas segala kuasa. Alternatif “bala tentara” lebih harfiah dalam satu sisi makna, tetapi dapat disalahpahami sebagai tentara manusia saja.
- issue: Cakupan keselamatan dalam וְנִוָּשֵׁעָה
  choice: kami akan diselamatkan
  alternative: kami akan dilepaskan
  rationale: Kata Ibrani dapat mencakup pertolongan, pembebasan, dan keselamatan. Pilihan utama mempertahankan gema teologisnya tanpa meniadakan kemungkinan bahwa yang dimaksud ialah pembebasan nyata dalam sejarah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk permohonan dengan akhiran -lah sesuai dengan register doa. Kapitalisasi pada “Allah Semesta Alam” memperlakukan frasa itu sebagai gelar ilahi; “-Mu” mengikuti konvensi ejaan Indonesia untuk sapaan kepada Allah.
