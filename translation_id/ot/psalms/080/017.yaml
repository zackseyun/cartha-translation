  text: תְּֽהִי יָ֭דְ/ךָ עַל אִ֣ישׁ יְמִינֶ֑/ךָ עַל בֶּן אָ֝דָ֗ם אִמַּ֥צְתָּ לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/017.yaml
  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
translation:
  language: id
  text: Kiranya tangan-Mu ada di atas orang yang di sebelah kanan-Mu[a], di atas anak manusia[b] yang telah Kaukuatkan bagi diri-Mu sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Harfiah, “orang tangan kanan-Mu.” Ungkapan Ibrani ini dapat berarti “orang yang di sebelah kanan-Mu” dan dapat menunjuk kepada orang yang secara khusus diperkenan, didukung, atau ditempatkan di sebelah kanan Allah.
    reason: lexical_alternative
  - marker: b
    text: “Anak manusia” dapat berarti sekadar “manusia”, meskipun dalam konteks Alkitab ungkapan ini juga dapat memiliki gema kerajaan atau mesianik.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי
  choice: Kiranya ... ada
  rationale: Bentuk jusif menyatakan doa atau harapan. “Kiranya” mempertahankan daya permohonan dan sesuai dengan ragam puisi doa yang luhur.
- source_word: יָדְךָ
  choice: tangan-Mu
  rationale: Metafora konkret “tangan” dipertahankan sehingga dapat menyiratkan kuasa, perlindungan, atau dukungan tanpa membatasi maknanya pada salah satu tafsiran.
- source_word: עַל
  choice: di atas
  rationale: Padanan ini mempertahankan gambaran tangan yang berada atas seseorang. Dalam konteks doa, ungkapan itu menyiratkan tindakan dan dukungan ilahi.
- source_word: אִישׁ יְמִינֶךָ
  choice: orang yang di sebelah kanan-Mu
  rationale: Ungkapan ini cukup alami dalam bahasa Indonesia dan mempertahankan hubungan orang tersebut dengan tangan kanan Allah, tanpa memastikan apakah yang dimaksud terutama kedudukan, perkenanan, atau dukungan.
- source_word: בֶּן אָדָם
  choice: anak manusia
  rationale: Padanan ini mempertahankan bentuk tunggal, bahasa puitis, dan kemungkinan gema kerajaan atau mesianik, tetapi tetap dapat berarti seorang manusia biasa.
- source_word: אִמַּצְתָּ
  choice: telah Kaukuatkan
  rationale: Bentuk piel dari אמץ menyatakan tindakan membuat kuat atau meneguhkan. “Telah Kaukuatkan” mencerminkan tindakan yang sudah dilakukan beserta hasilnya.
- source_word: לָּךְ
  choice: bagi diri-Mu sendiri
  rationale: Padanan ini menampilkan nuansa tujuan atau peruntukan bagi Allah yang terkandung dalam preposisi bersufiks tersebut.
theological_decisions:
- issue: Apakah “orang yang di sebelah kanan-Mu” dan “anak manusia” harus diterjemahkan secara eksplisit sebagai gelar Mesias
  choice: Dipertahankan sebagai bahasa puitis tentang seorang manusia tanpa kapitalisasi atau penjelasan mesianik dalam teks utama
  alternative: Menafsirkannya secara eksplisit sebagai Mesias, raja keturunan Daud, atau Israel secara kolektif
  rationale: Bahasa Ibrani memungkinkan pembacaan kerajaan, kolektif, atau mesianik dalam konteks kanonik yang lebih luas, tetapi ayat ini sendiri tidak mengharuskan penerjemah memilih salah satunya. Ambiguitas dan ketegangan teologisnya karena itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. Bentuk “tangan-Mu” dan “anak manusia” dipertahankan untuk menjaga citra konkret serta ambiguitas sumber; “Kaukuatkan” dipilih agar kalimat tetap ringkas dan alami.
