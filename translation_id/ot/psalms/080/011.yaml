  text: It sent out its branches as far as the sea[b][a], and its shoots to the River.
translation:
  language: id
  text: Ia mengulurkan cabang-cabangnya sampai ke laut[a], dan tunas-tunasnya sampai ke Sungai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dahan-dahannya.” Istilah Ibrani untuk “cabang-cabangnya” tidak lazim di sini dan dapat menunjuk secara lebih umum pada pertumbuhan pokok anggur yang menjalar.
    reason: lexical_alternative
  - marker: b
    text: “Sungai” kemungkinan besar merujuk pada Sungai Efrat dan menggemakan gambaran tentang wilayah Israel yang membentang dari laut sampai ke Sungai itu.
    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: Ia menjulurkan
  rationale: Bentuk piel שלח menggambarkan pokok anggur yang mengembangkan pertumbuhannya. 'Menjulurkan' alami dalam bahasa Indonesia dan mempertahankan gambaran gerak meluas.
- source_word: קְצִירֶהָ
  choice: cabang-cabangnya
  rationale: Istilah yang tidak lazim ini, dalam konteks puisi tentang pokok anggur, menunjuk pada pertumbuhan yang dikeluarkannya. 'Cabang-cabang' sesuai dengan paralelisme dan mudah dipahami, sambil mengakui kemungkinan makna yang lebih umum dalam catatan kaki.
- source_word: עַד יָם
  choice: sampai ke laut
  rationale: עַד menyatakan batas jangkauan. Frasa ini menyampaikan perluasan sampai laut tanpa menentukan secara eksplisit laut mana yang dimaksud.
- source_word: וְאֶל נָהָר
  choice: dan ... sampai ke Sungai
  rationale: Dalam ungkapan batas wilayah Alkitab, נָהָר dengan konteks ini kemungkinan menunjuk pada Sungai Efrat. Huruf kapital menandai rujukan geografis khusus, sedangkan catatan kaki mempertahankan sifat inferensial identifikasi tersebut.
- source_word: יוֹנְקוֹתֶיהָ
  choice: tunas-tunasnya
  rationale: Kata ini menunjuk pada pertumbuhan muda atau ranting baru. 'Tunas-tunas' merupakan padanan Indonesia yang alami dan cocok dengan metafora pokok anggur.
theological_decisions:
- issue: Cakupan wilayah yang dilambangkan oleh laut dan Sungai
  choice: Teks utama mempertahankan ungkapan puitis 'laut' dan 'Sungai'.
  alternative: Menuliskan 'Laut Tengah' dan 'Sungai Efrat' langsung dalam teks.
  rationale: Bahasa Ibrani tidak menyebut nama keduanya secara eksplisit. Identifikasi geografis yang mungkin disampaikan dalam catatan agar teks tidak menutup ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang jelas dan bermartabat. Pronomina 'Ia' merujuk pada pokok anggur yang dipersonifikasikan dalam konteks; pengulangan 'sampai ke' mempertahankan kesejajaran dua bagian ayat.
