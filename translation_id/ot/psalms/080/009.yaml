translation:
  language: id
  text: Engkau membersihkan lahan di hadapannya[a]; ia pun berakar[b] dan memenuhi negeri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Engkau menyediakan tempat baginya.” Ungkapan Ibrani dapat berarti menyingkirkan penghalang atau menyiapkan ruang di hadapan pokok anggur itu.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani mengulang kata kerja dan kata benda yang berkaitan dengan “akar”; ungkapan ini berarti bahwa tanaman itu berakar dan menjadi mantap.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “bumi.” Kata Ibrani dapat menunjuk pada suatu negeri atau pada bumi secara lebih luas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: Engkau membersihkan lahan baginya
  rationale: Ungkapan ini menggambarkan tindakan menyingkirkan penghalang atau menyediakan tempat bagi pokok anggur. Terjemahan ini alami dalam metafora pertanian dan tetap mempertahankan tindakan Allah sebagai subjek.
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: ia pun berakar
  rationale: Bahasa Ibrani memakai pengulangan seakar, secara harfiah kira-kira 'ia mengakarkan akar-akarnya'. 'Berakar' menyampaikan hasilnya secara alami tanpa menambahkan penegas seperti 'dalam' atau 'kuat' yang tidak dinyatakan secara eksplisit.
- source_word: וַתְּמַלֵּא
  choice: memenuhi
  rationale: Mempertahankan arti dasar verba מלא dan gambaran pertumbuhan pokok anggur yang meluas hingga menempati wilayah tersebut.
- source_word: אָרֶץ
  choice: negeri
  rationale: Dalam konteks mazmur tentang pokok anggur yang melambangkan Israel, 'negeri' paling mungkin menunjuk pada wilayah yang didiaminya, tetapi kemungkinan arti yang lebih luas dicatat dalam catatan kaki.
theological_decisions:
- issue: Identitas pokok anggur
  choice: Mempertahankan kata ganti 'ia' tanpa menjelaskan pokok anggur itu sebagai Israel dalam teks ayat.
  alternative: Mengganti metafora dengan penyebutan langsung 'Israel'.
  rationale: Konteks mazmur menjelaskan referennya, tetapi ayat ini sendiri meneruskan metafora pokok anggur. Mempertahankan metafora menghindari penjelasan teologis yang tidak dinyatakan langsung pada baris ini.
- issue: Cakupan אָרֶץ
  choice: negeri
  alternative: bumi
  rationale: Konteks mendukung cakupan setempat, tetapi polisemi kata Ibrani tetap diakui dalam catatan kaki agar kemungkinan cakupan yang lebih luas tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Kata ganti 'ia' mempertahankan personifikasi gramatikal pokok anggur tanpa menguraikan metaforanya.
