translation:
  language: id
  text: Engkau telah memberi mereka makan roti air mata dan memberi mereka minum air mata dalam takaran besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibrani ini dapat dipahami sebagai “air mata menurut takaran shalish” atau “dalam takaran tiga kali lipat.” Kata Ibrani terakhir tampaknya menunjuk pada suatu takaran besar, tetapi makna tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: Engkau telah memberi mereka makan
  rationale: Bentuk Hifil dari אכל dengan akhiran orang ketiga jamak menyatakan tindakan kausatif, yaitu memberi mereka makan. Bentuk perfek diterjemahkan dengan 'telah' untuk menunjukkan tindakan yang sudah terjadi dan tetap relevan dalam seruan pemazmur.
- source_word: לֶחֶם דִּמְעָה
  choice: roti air mata
  rationale: Terjemahan ini mempertahankan metafora Ibrani yang tajam dan kesejajaran puitis, tanpa menggeneralisasi לֶחֶם menjadi sekadar 'makanan'.
- source_word: וַתַּשְׁקֵמוֹ
  choice: dan memberi mereka minum
  rationale: Bentuk Hifil dari שׁקה berarti memberi atau membuat minum. 'Memberi mereka minum' alami dalam bahasa Indonesia dan selaras dengan baris sebelumnya.
- source_word: בִּדְמָעוֹת
  choice: air mata
  rationale: Dalam konstruksi dengan verba 'memberi minum', kata ini menyatakan apa yang diminum; bahasa Indonesia secara alami tidak memerlukan terjemahan terpisah untuk preposisi בְּ.
- source_word: שָׁלִישׁ
  choice: dalam takaran besar
  rationale: Istilah ini merupakan sebutan takaran yang makna tepatnya tidak pasti. Pilihan ini menyampaikan jumlah yang melimpah tanpa mengklaim nilai teknis tertentu; kemungkinan harfiahnya dicatat dalam catatan kaki.
