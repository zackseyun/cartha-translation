  text: תְּשִׂימֵ֣/נוּ מָ֭דוֹן לִ/שְׁכֵנֵ֑י/נוּ וְ֝/אֹיְבֵ֗י/נוּ יִלְעֲגוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/006.yaml
  text: You make us a cause of strife to our neighbors, and our enemies mock them.
translation:
  language: id
  text: Engkau menjadikan kami pokok pertengkaran bagi tetangga-tetangga kami, dan musuh-musuh kami mengejek mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka”; yang dimaksud tampaknya tetangga-tetangga kami. Sebagian terjemahan memakai “kami” berdasarkan konteks.
    reason: Menjelaskan rujukan pronomina yang sukar dan mempertahankan ketegangan antara bentuk Teks Masoret dan bacaan kontekstual.
lexical_decisions:
- source_word: מָדוֹן (madon)
  choice: pokok pertengkaran
  rationale: Kata ini menunjuk pada pertengkaran atau perselisihan; konstruksi dengan תְּשִׂימֵנוּ menyatakan bahwa umat dijadikan penyebab atau pokok pertengkaran bagi para tetangga mereka.
- source_word: לִשְׁכֵנֵינוּ (lishkhenenu)
  choice: bagi tetangga-tetangga kami
  rationale: Mempertahankan arti konkret שָׁכֵן sebagai orang-orang atau bangsa-bangsa yang tinggal berdekatan.
- source_word: יִלְעֲגוּ לָמוֹ (yil'agu lamo)
  choice: mengejek mereka
  rationale: לָמוֹ secara bentuk berarti 'mereka'; pilihan ini mempertahankan rujukan pronominal Teks Masoret yang sulit alih-alih diam-diam menggantinya dengan 'kami'.
theological_decisions:
- issue: Rujukan pronomina לָמוֹ pada akhir ayat
  choice: mereka
  alternative: kami
  rationale: Teks Masoret memakai pronomina orang ketiga jamak, sehingga terjemahan utama mempertahankan 'mereka'. Walaupun 'kami' terasa lebih lancar dalam konteks dan muncul sebagai penafsiran tekstual, perubahan itu tidak dinyatakan oleh bentuk Ibrani yang tersedia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ungkapan “pokok pertengkaran” alami bagi pembaca umum serta tetap dekat dengan metafora sumber; pengulangan “tetangga-tetangga” dan “musuh-musuh” mempertahankan bentuk jamak.
