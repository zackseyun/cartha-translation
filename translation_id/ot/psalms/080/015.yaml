  text: וְ֭/כַנָּה אֲשֶׁר נָטְעָ֣ה יְמִינֶ֑/ךָ וְ/עַל בֵּ֝֗ן אִמַּ֥צְתָּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/015.yaml
  text: and the stock that your right hand planted[b][a], and the son whom you made strong for yourself—
translation:
  language: id
  text: 'dan pokok angur[a] yang ditanam oleh tangan kanan-Mu,

    dan anak[b] yang Engkau kuatkan bagi diri-Mu sendiri—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tunas”, “cabang”, atau “pangkal batang”. Kata Ibrani ini langka dan muncul di sini dalam gambaran pokok anggur.
    reason: lexical_alternative
  - marker: b
    text: Atau “cabang”. Teks Ibrani secara harfiah berbunyi “anak”, tetapi sebagian orang memahaminya secara metaforis dalam gambaran kebun anggur atau secara korporat sebagai Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: כַנָּה
  choice: pokok anggur
  rationale: Nomina langka ini muncul dalam gambaran kebun anggur pada mazmur ini. “Pokok anggur” mempertahankan gambaran tumbuhan tanpa menentukan secara sempit apakah yang dimaksud ialah tunas, cabang, atau pangkal batang.
- source_word: נָטְעָה
  choice: ditanam
  rationale: Kata kerja ini lazim berarti “menanam” dan secara alami mempertahankan gambaran pertanian dalam konteks.
- source_word: יְמִינֶךָ
  choice: tangan kanan-Mu
  rationale: Terjemahan harfiah ini mempertahankan gambaran antropomorfis tentang tindakan dan kuasa Allah, alih-alih menggantinya dengan kata abstrak seperti “kuasa”.
- source_word: וְעַל
  choice: dan
  rationale: Dalam susunan puitis ini, frasa tersebut menghubungkan unsur paralel berikutnya. “Dan” menghasilkan koordinasi yang jelas dan wajar dalam bahasa Indonesia.
- source_word: בֵּן
  choice: anak
  rationale: Makna leksikal langsungnya adalah “anak”. Pilihan ini mempertahankan personifikasi atau metafora korporat dalam teks dan tidak diam-diam mengubahnya menjadi istilah botani.
- source_word: אִמַּצְתָּה
  choice: Engkau kuatkan
  rationale: Bentuk intensif-kausatif kata kerja ini menyatakan tindakan membuat kuat atau meneguhkan. “Engkau kuatkan” alami dalam bahasa Indonesia dan mempertahankan tindakan langsung Allah.
- source_word: לָּךְ
  choice: bagi diri-Mu sendiri
  rationale: Ungkapan ini menampilkan nuansa kepentingan atau tujuan bagi Allah sendiri, bukan sekadar hubungan umum “bagi-Mu”.
theological_decisions:
- issue: Identitas “anak” dalam metafora pokok anggur
  choice: Mempertahankan kata “anak” dalam teks utama tanpa menentukan rujukan mesianik.
  alternative: Memahaminya sebagai “cabang”, sebagai Israel secara korporat, atau secara tipologis/mesianik.
  rationale: Konteks terdekat menggambarkan Israel sebagai pokok anggur, tetapi teks Ibrani memakai kata biasa untuk “anak”. Terjemahan mempertahankan ketegangan itu dan tidak membatasi kemungkinan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Bentuk sapaan ilahi memakai huruf kapital. Tanda pisah pada akhir ayat mempertahankan kesinambungan sintaksis dan puitis dengan konteks.
