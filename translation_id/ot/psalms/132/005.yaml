  text: until I find a place for Yahweh[a], a dwelling place for the Mighty One of Jacob.
translation:
  language: id
  text: sampai aku menemukan tempat bagi Yahweh, tempat-tempat kediaman[a] bagi Yang Perkasa dari Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kediaman-kediaman”; secara lebih tradisional, “kemah-kemah suci”. Kata benda Ibraninya berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֶמְצָא
  choice: sampai aku menemukan
  rationale: עַד menandai batas waktu sumpah dalam ayat sebelumnya, sedangkan bentuk imperfek אֶמְצָא menyatakan tindakan yang hendak dilakukan pemazmur.
- source_word: מָקוֹם לַיהוָה
  choice: tempat bagi Yahweh
  rationale: מָקוֹם berarti tempat atau lokasi; preposisi ל menyatakan tempat yang diperuntukkan bagi Yahweh.
- source_word: מִשְׁכָּנוֹת
  choice: tempat-tempat kediaman
  rationale: Bentuk Ibrani ini jamak. Terjemahan mempertahankan jumlah tersebut dan memakai ungkapan modern yang lebih jelas daripada istilah tradisional 'kemah-kemah suci'.
- source_word: לַאֲבִיר יַעֲקֹב
  choice: bagi Yang Mahakuat, Allah Yakub
  rationale: אֲבִיר adalah gelar ilahi yang berarti Yang Kuat/Mahakuat; tambahan 'Allah' membuat hubungan dengan Yakub jelas dan alami dalam bahasa Indonesia tanpa mengubah rujukannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan mengikuti lapisan konsultasi yang telah diselaraskan.
- issue: Makna bentuk jamak מִשְׁכָּנוֹת
  choice: mempertahankan bentuk jamak 'tempat-tempat kediaman'
  alternative: tempat kediaman
  rationale: Bentuk sumber secara morfologis jamak. Walaupun konteks dapat dipahami secara kolektif sebagai satu kediaman, terjemahan utama tidak menyelesaikan ketegangan jumlah itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan paralel Ibrani dipertahankan; koma sebelum gelar kedua membantu keterbacaan. Penanda catatan kaki [a] ditempatkan sesudah klausa yang memuat istilah terkait.
