  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
translation:
  language: id
  text: Di sana Aku akan menumbuhkan tanduk bagi Daud[a]; Aku telah menyiapkan pelita bagi orang yang Kuurapi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku akan membuat tanduk tumbuh bagi Daud.” “Tanduk” adalah gambaran Ibrani untuk kekuatan atau kuasa kerajaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “bagi Mesias-Ku.” Ungkapan Ibrani berarti “orang yang Kuurapi”; di sini pertama-tama merujuk kepada raja dari garis Daud, dengan kemungkinan gema mesianik yang lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Di sana
  rationale: Keterangan tempat ini menunjuk kembali kepada Sion dalam konteks langsung dan mempertahankan penekanan ruang dalam teks Ibrani.
- source_word: אַצְמִיחַ
  choice: Aku akan menumbuhkan
  rationale: Bentuk kausatif dari צמח berarti menyebabkan sesuatu bertunas atau tumbuh. 'Menumbuhkan' alami dalam bahasa Indonesia dan tetap mempertahankan metafora pertumbuhan.
- source_word: קֶרֶן
  choice: tanduk
  rationale: Arti harfiahnya ialah 'tanduk', gambaran Ibrani yang lazim untuk kekuatan dan kuasa kerajaan. Citra konkret dipertahankan, sedangkan makna kiasannya dijelaskan dalam catatan kaki.
- source_word: לְדָוִד
  choice: bagi Daud
  rationale: Preposisi ל menyatakan kepentingan atau peruntukan. Terjemahan ini akurat tanpa menambahkan 'keturunan' atau 'dinasti' yang tidak dinyatakan secara eksplisit.
- source_word: עָרַכְתִּי
  choice: Aku telah menyiapkan
  rationale: Kata ערך dapat berarti menata, mengatur, atau menyiapkan. 'Menyiapkan' wajar dengan objek 'pelita' dan sesuai dengan pernyataan tentang penyediaan ilahi.
- source_word: נֵר
  choice: pelita
  rationale: נֵר secara konkret berarti pelita. Istilah ini mempertahankan citra tentang terang dan kesinambungan pemerintahan tanpa menguraikan metaforanya di dalam teks utama.
- source_word: לִמְשִׁיחִי
  choice: bagi orang yang Kuurapi
  rationale: מָשִׁיחַ berarti orang yang diurapi. Ungkapan Indonesia ini jelas, alami, dan mempertahankan kepunyaan orang pertama dalam bentuk Ibrani tanpa langsung menjadikannya gelar teknis 'Mesias'.
theological_decisions:
- issue: Pemaknaan מְשִׁיחִי dalam konteks kerajaan Daud
  choice: orang yang Kuurapi
  alternative: Mesias-Ku
  rationale: Dalam konteks mazmur tentang Daud dan Sion, rujukan terdekatnya ialah raja dari garis Daud sebagai orang yang diurapi TUHAN. Terjemahan utama mempertahankan makna leksikal dan konteks kerajaan, sementara catatan kaki membiarkan kemungkinan gema mesianik yang lebih luas tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora konkret 'tanduk' dan 'pelita' dipertahankan agar citra puitis Ibrani tidak diratakan. Kapitalisasi 'Aku' dan 'Kuurapi' menandai bahwa penuturnya adalah Allah sesuai konteks.
