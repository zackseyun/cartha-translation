  text: כִּֽי בָחַ֣ר יְהוָ֣ה בְּ/צִיּ֑וֹן אִ֝וָּ֗/הּ לְ/מוֹשָׁ֥ב לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/013.yaml
  text: For Yahweh has chosen Zion[a]; he has desired it for his dwelling place.
translation:
  language: id
  text: Sebab Yahweh telah memilih Sion; Ia menginginkannya sebagai tempat kediaman-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan alasan bagi penegasan sebelumnya dan mempertahankan hubungan argumentatif dalam konteks mazmur.
- source_word: בָחַר
  choice: telah memilih
  rationale: Bentuk ini menyatakan tindakan memilih yang sudah terjadi dan tetap bermakna dalam konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּצִיּוֹן
  choice: Sion
  rationale: Dengan verba 'memilih', preposisi ב menandai objek yang dipilih; bahasa Indonesia alami memakai objek langsung.
- source_word: אִוָּהּ
  choice: menginginkannya
  rationale: Verba אוה menyatakan keinginan atau kerinduan. Pronomina -nya merujuk kepada Sion tanpa memaksakan personifikasi feminin yang tidak ditandai secara gramatikal dalam bahasa Indonesia.
- source_word: לְמוֹשָׁב לוֹ
  choice: sebagai tempat kediaman-Nya
  rationale: Frasa ini menyatakan tujuan Sion dipilih, yakni menjadi tempat kediaman bagi Yahweh; bentuk posesif menghasilkan ungkapan Indonesia yang alami dan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi nama tersebut.
- issue: Rujukan sufiks feminin pada Sion
  choice: -nya dalam 'menginginkannya'
  alternative: dia sebagai personifikasi feminin
  rationale: Sufiks Ibrani feminin merujuk kepada Sion, tetapi bahasa Indonesia tidak membedakan gender gramatikal pada pronomina. '-nya' mempertahankan rujukannya tanpa menambah personifikasi yang tidak wajib.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. Huruf kapital pada “Ia” dan “-Nya” mengikuti kebiasaan penghormatan yang lazim dalam penerbitan Alkitab bahasa Indonesia.
