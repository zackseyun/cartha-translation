source:
  edition: WLC
  text: זֹאת מְנוּחָתִ֥/י עֲדֵי עַ֑ד פֹּֽה אֵ֝שֵׁ֗ב כִּ֣י אִוִּתִֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/014.yaml
  text: This is my resting place forever; here I will dwell[a], for I have desired it.
translation:
  language: id
  text: “Inilah tempat perhentian-Ku untuk selama-lamanya; di sinilah Aku akan berdiam, sebab Aku mendambakannya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akhiran feminin dalam bahasa Ibrani dapat menunjuk kepada Sion yang dipersonifikasikan, atau kepada tempat perhentian itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Inilah
  rationale: Kata tunjuk feminin tunggal ini menunjuk kepada Sion atau tempat perhentian yang baru disebut. “Inilah” menyampaikan penunjukan yang langsung dan alami dalam bahasa Indonesia.
- source_word: מְנוּחָתִי
  choice: tempat perhentian-Ku
  rationale: Dalam konteks lokatif yang dilanjutkan dengan “di sinilah”, מְנוּחָה paling tepat dipahami sebagai tempat untuk menetap dan beristirahat, bukan sekadar keadaan abstrak berupa istirahat.
- source_word: עֲדֵי עַד
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; bentuk ini wajar dan bermartabat dalam bahasa Indonesia.
- source_word: פֹּה
  choice: di sinilah
  rationale: Adverbia tempat ini menegaskan lokasi yang ditunjuk. Bentuk “di sinilah” mempertahankan tekanan deiktis Ibrani dan selaras dengan “Inilah” pada awal ayat.
- source_word: אֵשֵׁב
  choice: Aku akan berdiam
  rationale: Walaupun ישׁב secara harfiah dapat berarti “duduk”, dalam konteks penetapan kediaman ilahi di Sion maknanya adalah tinggal atau berdiam. “Berdiam” mempertahankan nuansa menetap.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi tindakan Allah untuk berdiam di sana.
- source_word: אִוִּתִיהָ
  choice: Aku mendambakannya
  rationale: Verba אוה menyatakan hasrat atau kerinduan yang kuat. “Mendambakan” lebih tepat daripada “memilih”, yang akan menambahkan gagasan pemilihan yang tidak dinyatakan langsung oleh leksem tersebut. Akhiran “-nya” memungkinkan rujukan kepada Sion maupun tempat itu tanpa menghapus ambiguitas rujukannya.
theological_decisions:
- issue: Rujukan akhiran feminin tunggal dalam אִוִּתִיהָ
  choice: Memakai “-nya” dan menjelaskan ambiguitasnya dalam catatan kaki.
  alternative: Memakai “dia” untuk menonjolkan personifikasi feminin Sion.
  rationale: Akhiran Ibrani paling mungkin menunjuk kepada Sion yang dipersonifikasikan sebagai perempuan, tetapi secara gramatikal juga dapat menunjuk kepada מְנוּחָה, “tempat perhentian”, yang juga feminin. Bahasa Indonesia tidak membedakan gender pada pronomina; “-nya” menghasilkan ungkapan yang alami sekaligus membiarkan kedua kemungkinan rujukan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapital pada pronomina yang merujuk kepada Allah mengikuti gaya teks Alkitab Indonesia yang umum. Pengulangan “Inilah … di sinilah” mempertahankan penekanan lokasi dalam teks Ibrani.
