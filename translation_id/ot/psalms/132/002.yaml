id: PSA.132.2
reference: Psalms 132:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁ֣ר נִ֭שְׁבַּע לַ/יהוָ֑ה נָ֝דַ֗ר לַ/אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/002.yaml
  text: who swore to Yahweh and vowed to the Mighty One of Jacob:[a]
translation:
  language: id
  text: 'yang bersumpah kepada Yahweh[a] dan bernazar kepada Yang Mahakuat dari Yakub:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (יהוה), nama ilahi yang di sini ditulis “Yahweh”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini merujuk kembali kepada Daud dalam ayat 1; “yang” merupakan bentuk alami dalam bahasa Indonesia.
- source_word: נִשְׁבַּע
  choice: bersumpah
  rationale: Bentuk Nifal dari שׁבע berarti bersumpah atau mengangkat sumpah; “bersumpah” ringkas dan tetap menyampaikan sifatnya yang khidmat.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menjadi tujuan sumpah, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama khusus dalam teks sumber tetap terlihat.
- source_word: נָדַר
  choice: bernazar
  rationale: Kata נדר menyatakan tindakan mengucapkan nazar; “bernazar” tepat, alami, dan mempertahankan kesejajaran dengan “bersumpah”.
- source_word: לַאֲבִיר
  choice: kepada Yang Mahakuat
  rationale: אֲבִיר dipakai sebagai gelar ilahi yang berarti sosok yang kuat atau perkasa. “Yang Mahakuat” mempertahankan fungsi gelar dan ragam bahasa yang luhur.
- source_word: יַעֲקֹב
  choice: dari Yakub
  rationale: Nama ini melengkapi gelar ilahi “Yang Mahakuat dari Yakub”; “Yakub” adalah bentuk nama yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama khusus יהוה. Bentuk “Yahweh” mempertahankan nama perjanjian tersebut tanpa menggantinya dengan gelar, sementara catatan kaki menjelaskan bentuk sumbernya.
- issue: Makna gelar אֲבִיר יַעֲקֹב
  choice: Yang Mahakuat dari Yakub
  alternative: Yang Perkasa dari Yakub
  rationale: Pilihan ini mempertahankan gelar ilahi dan hubungan genitif dalam teks tanpa menambahkan penafsiran tentang cakupan atau sifat hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Bentuk klausa relatif serta tanda titik dua dipertahankan karena ayat ini melanjutkan kalimat dari ayat sebelumnya dan mengantar kepada isi nazar pada ayat berikutnya.
