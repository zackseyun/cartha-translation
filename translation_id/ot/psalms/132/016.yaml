  text: And I will clothe her priests with salvation[b][a], and her faithful ones will shout for joy.
translation:
  language: id
  text: Aku akan mengenakan keselamatan pada para imamnya, dan orang-orang setianya[a] akan bersorak-sorai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang-orang salehnya" atau "orang-orang kudusnya"; istilah Ibrani ini menunjuk kepada orang-orang yang ditandai oleh kesetiaan pada perjanjian dan pengabdian kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan Ibrani menegaskan kata kerjanya secara harfiah: "bersorak, mereka akan bersorak," yaitu mereka akan bersorak atau bernyanyi dengan sukacita yang besar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֲנֶיהָ
  choice: para imamnya
  rationale: Nomina dengan akhiran orang ketiga feminin tunggal merujuk kepada Sion yang dipersonifikasikan; bahasa Indonesia secara alami memakai bentuk netral 'para imamnya'.
- source_word: אַלְבִּישׁ
  choice: Aku akan mengenakan
  rationale: Bentuk Hifil orang pertama tunggal berarti 'membuat berpakaian/mengenakan' dan mempertahankan metafora pakaian dengan Allah sebagai pembicara.
- source_word: יֶשַׁע
  choice: keselamatan
  rationale: Kata ini mencakup keselamatan, pembebasan, dan kemenangan; 'keselamatan' mempertahankan keluasan makna serta cocok sebagai sesuatu yang dikenakan secara metaforis.
- source_word: חֲסִידֶיהָ
  choice: orang-orangnya yang setia
  rationale: חסיד menunjuk kepada orang yang bercirikan kesetiaan perjanjian dan pengabdian; pilihan ini mudah dipahami tanpa memasukkan konotasi gerejawi yang lebih kemudian.
- source_word: רַנֵּן יְרַנֵּנוּ
  choice: akan bersorak-sorai
  rationale: Infinitif absolut yang diikuti verba seakar memberi penegasan. Reduplikasi 'bersorak-sorai' menyampaikan sukacita vokal yang kuat secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חֲסִידֶיהָ dalam konteks ibadah dan perjanjian
  choice: orang-orangnya yang setia
  alternative: orang-orang salehnya; orang-orang kudusnya
  rationale: Terjemahan ini mempertahankan gagasan kesetiaan dan pengabdian dalam hubungan perjanjian tanpa membatasi istilah itu pada kategori gerejawi tertentu.
- issue: Cakupan makna יֶשַׁע
  choice: keselamatan
  alternative: pembebasan; kemenangan
  rationale: '''Keselamatan'' cukup luas untuk memuat pertolongan, pembebasan, dan kemenangan dari Allah tanpa menentukan satu nuansa saja.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Metafora 'mengenakan keselamatan' dipertahankan, sedangkan intensifikasi Ibrani disampaikan dengan bentuk idiomatis 'bersorak-sorai'. Semua penanda catatan kaki muncul dalam teks utama.
