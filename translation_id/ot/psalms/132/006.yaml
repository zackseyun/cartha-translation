  text: הִנֵּֽה שְׁמַֽעֲנ֥וּ/הָ בְ/אֶפְרָ֑תָה מְ֝צָאנ֗וּ/הָ בִּ/שְׂדֵי יָֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/006.yaml
  text: Look, we heard of it in Ephrathah; we found it in the fields of Jaar.
translation:
  language: id
  text: Lihat, kami mendengar tentangnya di Efrata; kami menemukannya di padang-padang Yaar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yaar” dapat dipahami sebagai nama tempat; kata Ibrani ya'ar juga berarti “hutan”, sehingga frasa ini secara harfiah dapat dibaca “di padang-padang hutan”.
    reason: Menjaga pembacaan nama tempat yang dipakai dalam teks utama sambil mengungkap ambiguitas leksikal sumber.
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan penanda perhatian yang kuat dan langsung dalam bahasa Indonesia modern.
- source_word: שְׁמַעֲנוּהָ
  choice: kami mendengar tentangnya
  rationale: Pronomina feminin tunggal dipertahankan secara netral sebagai “-nya”; objek yang dirujuk tidak dijelaskan secara eksplisit dalam ayat ini.
- source_word: בְאֶפְרָתָה
  choice: di Efrata
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: מְצָאנוּהָ
  choice: kami menemukannya
  rationale: Menerjemahkan verba dan pronomina objek secara langsung tanpa menetapkan referennya.
- source_word: בִּשְׂדֵי־יָעַר
  choice: di padang-padang Yaar
  rationale: Bentuk jamak שְׂדֵי dipertahankan, sedangkan יָעַר diperlakukan sebagai nama diri sebagaimana ditunjukkan konteks dan tradisi tekstual; ambiguitas leksikalnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Referen pronomina feminin tunggal pada “mendengar tentangnya” dan “menemukannya”
  choice: Tidak menyebut referen secara eksplisit
  alternative: Menambahkan “tabut itu” atau “tempatnya”
  rationale: Teks Ibrani hanya memakai sufiks pronominal feminin; menyebut tabut atau tempat akan menafsirkan ambiguitas yang sungguh ada dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Penanda perhatian “Lihat” dipilih alih-alih bentuk yang lebih arkais. Agar semua penanda catatan kaki tampil dalam teks utama, penanda [a] ditempatkan sesudah “Yaar”.
