  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/001.yaml
  text: A Song of Ascents[a]. Remember, O Yahweh[b], for David all his affliction.
translation:
  language: id
  text: Nyanyian Pendakian[a]. Ingatlah, ya Yahweh, demi Daud[b], segala penderitaannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Nyanyian Pendakian-pendakian.” Ungkapan Ibrani ini dapat berkaitan dengan perjalanan naik untuk berziarah, dengan anak tangga, atau dengan jenis “kenaikan” lain.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengenai Daud” atau “untuk Daud.” Preposisi Ibraninya dapat menunjukkan kepentingan ataupun acuan.
    reason: lexical_alternative
  - marker: c
    text: Atau “segala kesusahannya” atau “segala kehinaannya.” Kata Ibrani ini dapat mencakup penderitaan, kesukaran, atau keadaan direndahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Pendakian
  rationale: Menerjemahkan judul kumpulan secara dekat dengan bentuk Ibrani tanpa memastikan apakah latarnya adalah perjalanan ziarah, anak tangga, atau jenis kenaikan lain.
- source_word: זְכוֹר
  choice: Ingatlah
  rationale: Bentuk imperatif ini merupakan permohonan kepada Allah; 'ingatlah' mempertahankan daya doa perjanjian tanpa menambahkan arti tindakan yang menguntungkan secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks, bukan menggantinya dengan gelar.
- source_word: לְדָוִד
  choice: demi Daud
  rationale: Preposisi לְ dapat menunjukkan kepentingan atau acuan. 'Demi Daud' wajar dalam doa bahasa Indonesia dan mempertahankan gagasan bahwa permohonan diajukan berkenaan dengan atau untuk kepentingan Daud.
- source_word: עֻנּוֹתוֹ
  choice: segala penderitaannya
  rationale: Kata ini mencakup penderitaan, kesusahan, atau keadaan direndahkan. 'Penderitaan' mempertahankan cakupan yang luas dan sesuai dengan bentuk pronominal Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Hubungan לְדָוִד dengan permohonan untuk mengingat
  choice: demi Daud
  alternative: mengenai Daud; untuk Daud; akan Daud
  rationale: Ungkapan ini mempertahankan kemungkinan makna kepentingan/acuan tanpa mengubahnya menjadi pernyataan pasti bahwa mazmur ditulis oleh atau untuk Daud.
- issue: Cakupan עֻנּוֹתוֹ
  choice: segala penderitaannya
  alternative: segala kesusahannya; segala kehinaannya; segala penyangkalan dirinya
  rationale: Pilihan yang luas ini tidak membatasi pengalaman Daud hanya pada kehinaan atau praktik penyangkalan diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa yang khidmat. Sapaan 'ya Yahweh' alami dalam register ibadah; struktur ayat tetap dekat dengan susunan Ibrani tanpa menjadi kaku.
