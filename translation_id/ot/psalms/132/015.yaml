  text: צֵ֭ידָ/הּ בָּרֵ֣ךְ אֲבָרֵ֑ךְ אֶ֝בְיוֹנֶ֗י/הָ אַשְׂבִּ֥יעַֽ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/015.yaml
  text: I will surely bless her provisions[a]; I will satisfy her poor with bread.
translation:
  language: id
  text: Aku pasti akan memberkati persediaannya[a]; Aku akan mengenyangkan orang-orang miskinnya dengan roti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makanannya” atau “bekalnya”; istilah Ibrani ini dapat menunjuk pada persediaan pangan sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֵידָהּ
  choice: persediaan makanannya
  rationale: Kata צֵיד dapat menunjuk pada bekal, makanan, atau persediaan pangan. Dalam konteks Sion sebagai kota, frasa ini secara alami menyampaikan persediaan makanan miliknya tanpa nuansa berburu.
- source_word: בָּרֵךְ אֲבָרֵךְ
  choice: Aku pasti akan memberkati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian atau intensitas tindakan; 'pasti akan memberkati' mempertahankan penekanan itu dalam bahasa Indonesia yang wajar.
- source_word: אֶבְיוֹנֶיהָ
  choice: orang-orang miskinnya
  rationale: אֶבְיוֹן menunjuk kepada orang miskin atau berkekurangan. Bentuk jamak 'orang-orang miskinnya' jelas dan alami, sedangkan sufiks feminin merujuk kepada Sion.
- source_word: אַשְׂבִּיעַ
  choice: Aku akan mengenyangkan
  rationale: Bentuk Hifil dari שׂבע berarti membuat kenyang atau puas. 'Mengenyangkan' cocok dengan objek konkret 'roti' dan menyampaikan kecukupan pangan.
- source_word: לָחֶם
  choice: dengan roti
  rationale: Teks Ibrani secara khusus memakai 'roti'; mempertahankannya menjaga gambaran konkret dan tidak menggeneralisasikannya menjadi sekadar 'makanan'.
theological_decisions:
- issue: Rujukan sufiks feminin
  choice: Sufiks pada 'persediaan makanannya' dan 'orang-orang miskinnya' merujuk kepada Sion/Yerusalem.
  alternative: Sufiks dapat dipahami secara lebih umum sebagai merujuk kepada tempat kediaman TUHAN.
  rationale: Dalam konteks langsung Mazmur 132:13–14, anteseden feminin tunggal yang paling alami adalah Sion. Bentuk '-nya' mempertahankan personifikasi puitis tanpa menambahkan klaim teologis.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi 'Aku' mencerminkan bahwa penuturnya adalah TUHAN dalam konteks. Paralelisme dua klausa dipertahankan, dan penekanan gramatikal Ibrani dinyatakan dengan 'pasti'.
