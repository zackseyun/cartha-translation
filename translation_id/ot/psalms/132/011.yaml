  text: נִשְׁבַּֽע יְהוָ֨ה לְ/דָוִ֡ד אֱמֶת֮ לֹֽא יָשׁ֪וּב מִ֫מֶּ֥/נָּה מִ/פְּרִ֥י בִטְנְ/ךָ֑ אָ֝שִׁ֗ית לְ/כִסֵּא לָֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/011.yaml
  text: 'Yahweh swore to David a sure oath[b][a]; he will not turn back from it: “From the fruit of your womb I will set one on your throne.”'
translation:
  language: id
  text: 'Yahweh telah bersumpah kepada Daud dengan sumpah yang teguh[a]; Ia tidak akan menariknya kembali: “Salah seorang dari keturunanmu[b] akan Kududukkan di atas takhtamu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kebenaran”; kata Ibrani ini menekankan bahwa sumpah tersebut pasti dan dapat dipercaya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari buah kandunganmu”, yaitu seorang keturunan Daud sendiri. Bandingkan 2 Samuel 7:12 dan Kisah Para Rasul 2:30.
    reason: cross_reference
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: telah bersumpah
  rationale: Bentuk Nifal dari שבע menyatakan tindakan mengucapkan sumpah. Bentuk perfektif Ibrani cocok diungkapkan dengan “telah bersumpah” sebagai pernyataan puitis tentang tindakan yang sudah ditetapkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama pribadi dalam teks Ibrani.
- source_word: אֱמֶת
  choice: dengan sumpah yang teguh
  rationale: Secara harfiah berarti “kebenaran”, tetapi di sini berdiri dekat dengan pernyataan sumpah dan menekankan kepastian serta keterandalannya. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan citra sumpah.
- source_word: לֹא יָשׁוּב מִמֶּנָּה
  choice: Ia tidak akan menariknya kembali
  rationale: שוב dengan מן menyatakan berbalik atau menarik diri dari sesuatu. Dalam konteks janji, “menariknya kembali” menyampaikan maksudnya secara jelas; pronomina merujuk pada sumpah tersebut.
- source_word: מִפְּרִי בִטְנְךָ
  choice: Salah seorang dari keturunanmu
  rationale: Ungkapan harfiahnya ialah “dari buah kandunganmu” dan menunjuk pada keturunan biologis Daud. Bentuk “salah seorang dari keturunanmu” alami, jelas, dan selaras dengan verba tunggal tersirat dalam janji penobatan.
- source_word: אָשִׁית
  choice: akan Kududukkan
  rationale: שׁית berarti menaruh, menempatkan, atau menetapkan. Bersama “takhta”, “Kududukkan” secara idiomatis menggambarkan tindakan menempatkan seseorang sebagai raja tanpa harus menambahkan penafsiran mesianik.
- source_word: לְכִסֵּא לָךְ
  choice: di atas takhtamu
  rationale: Rangkaian preposisional ini dalam konteks perjanjian kerajaan paling alami menunjuk pada takhta milik Daud. “Di atas takhtamu” merupakan bahasa Indonesia yang wajar untuk penobatan dan mempertahankan sapaan langsung kepada Daud.
theological_decisions:
- issue: Cakupan mesianik dan perjanjian dari janji kepada Daud
  choice: Teks utama menyatakan janji tentang seorang keturunan biologis Daud yang akan menduduki takhtanya, tanpa secara eksplisit mengidentifikasinya sebagai Mesias.
  alternative: Menerjemahkan ayat dengan istilah yang secara langsung menyatakan penggenapan mesianik.
  rationale: Pada tingkat historis-sastrawi, ayat ini mengungkapkan janji dinasti kepada Daud. Pemakaian kanonik selanjutnya dapat memberi cakupan mesianik, tetapi identifikasi itu tidak perlu dimasukkan ke dalam wording ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur sumpah dan ujaran langsung dipertahankan, sedangkan idiom anatomi Ibrani dijelaskan melalui catatan kaki agar teks utama mudah dipahami pembaca umum.
