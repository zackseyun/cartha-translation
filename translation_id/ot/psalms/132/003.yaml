base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/003.yaml
  text: Surely I will not enter the tent of my house[b][a]; surely I will not go up onto the bed of my couch—
translation:
  language: id
  text: 'Sungguh, aku tidak akan masuk ke dalam kemah rumahku[a],

    sungguh, aku tidak akan naik ke ranjang peraduanku[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani memakai rumus sumpah dengan kata “jika”: “Jika aku masuk ... jika aku naik ...,” yang dalam konteks ini berarti “Sungguh, aku tidak akan masuk ... sungguh, aku tidak akan naik ....”'
    reason: lexical_alternative
  - marker: b
    text: Atau “ranjang tempat peristirahatanku.” Bahasa Ibrani memakai dua istilah yang artinya berdekatan untuk tempat berbaring.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: sungguh ... tidak akan
  rationale: 'Dalam konteks sumpah yang berlanjut dari ayat sebelumnya, אִם merupakan rumus sumpah eliptis: secara harfiah ''jika aku ...'', tetapi maksudnya ialah penegasan bahwa tindakan itu tidak akan dilakukan. Ungkapan ini mempertahankan daya sumpah dengan bahasa Indonesia yang jelas.'
- source_word: אָבֹא
  choice: aku tidak akan masuk
  rationale: Bentuk imperfek orang pertama tunggal dari בוא menunjuk pada tindakan yang ditolak dalam nazar; 'masuk' wajar digunakan dengan kemah atau rumah.
- source_word: בְּאֹהֶל בֵּיתִי
  choice: ke dalam kemah rumahku
  rationale: Terjemahan ini mempertahankan citra konkret אֹהֶל ('kemah') dan hubungan konstruksi dengan בֵּיתִי ('rumahku'), tanpa menyederhanakannya menjadi 'rumah' saja.
- source_word: אֶעֱלֶה עַל
  choice: aku tidak akan naik ke atas
  rationale: עלה berarti 'naik', dan עַל menandai tempat yang dituju. Ungkapan ini mempertahankan gerak spasial dalam bahasa sumber.
- source_word: עֶרֶשׂ יְצוּעָי
  choice: tempat tidur peraduanku
  rationale: Kedua nomina merupakan istilah berdekatan untuk tempat berbaring. 'Tempat tidur' dan 'peraduan' menjaga pasangan puitis tersebut tanpa meleburkannya menjadi satu istilah.
theological_decisions:
- issue: Daya rumus sumpah אִם yang eliptis
  choice: 'Dinyatakan sebagai penyangkalan tegas: ''Sungguh, aku tidak akan ...'''
  alternative: 'Diterjemahkan secara harfiah: ''Jika aku ...'''
  rationale: Ayat sebelumnya memperkenalkan sumpah, sedangkan klausa akibat kutuk tidak dinyatakan. Terjemahan idiomatis menyampaikan fungsi sumpah tanpa menambahkan isi kutuk yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan 'sungguh, aku tidak akan' mempertahankan kesejajaran serta daya nazar; 'kemah rumahku' dan 'tempat tidur peraduanku' sengaja menjaga kepadatan metaforis bahasa Ibrani.
