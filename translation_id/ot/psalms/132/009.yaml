  text: May your priests be clothed with righteousness[c][b][a], and may your faithful ones shout for joy.
translation:
  language: id
  text: Kiranya para imam-Mu mengenakan kebenaran[a], dan kiranya orang-orang yang setia kepada-Mu[b] bersorak-sorai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “keadilan.” Kata Ibrani צֶדֶק dapat memuat nuansa moral maupun hukum.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang saleh-Mu” atau “orang-orang yang mengabdi kepada-Mu.” Kata Ibrani ini menunjuk kepada orang-orang yang bercirikan kesetiaan dan pengabdian dalam relasi perjanjian.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “bernyanyi dengan gembira.” Kata kerja Ibrani ini menyatakan luapan kegembiraan dengan suara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֶיךָ
  choice: para imam-Mu
  rationale: כֹּהֵן secara langsung berarti imam; bentuk jamak dan akhiran orang kedua tunggal dipertahankan. Pilihan ini juga menjaga latar ibadah dan tempat kudus dalam mazmur.
- source_word: יִלְבְּשׁוּ
  choice: berpakaian
  rationale: Kata לבשׁ memakai gambaran mengenakan pakaian. 'Berpakaian kebenaran' terdengar alami dalam bahasa Indonesia sekaligus mempertahankan metafora sumber.
- source_word: צֶדֶק
  choice: kebenaran
  rationale: צֶדֶק dapat mencakup kelurusan moral dan keadilan. 'Kebenaran' paling wajar dalam metafora pakaian ini, sementara kemungkinan 'keadilan' dicatat dalam catatan kaki.
- source_word: וַחֲסִידֶיךָ
  choice: orang-orang yang setia kepada-Mu
  rationale: חָסִיד menunjuk kepada orang yang bercirikan kesetiaan dan pengabdian dalam relasi perjanjian. Ungkapan ini jelas bagi pembaca modern dan tidak memasukkan nuansa gerejawi yang lebih kemudian dari istilah seperti 'orang kudus'.
- source_word: יְרַנֵּנוּ
  choice: bersorak-sorai
  rationale: Bentuk Piel dari רנן menyatakan kegembiraan yang diluapkan dengan suara. 'Bersorak-sorai' menangkap daya jubilannya tanpa membatasi tindakan itu hanya pada nyanyian.
theological_decisions:
- issue: Daya volitif verba imperfek dalam konteks doa
  choice: Diterjemahkan sebagai permohonan dengan 'Kiranya ... dan kiranya ...'
  alternative: Para imam-Mu akan berpakaian ... dan orang-orang yang setia kepada-Mu akan bersorak-sorai.
  rationale: Dalam konteks Mazmur 132, baris ini berfungsi sebagai permohonan, bukan sekadar ramalan. 'Kiranya' menyampaikan nuansa jusif/doa secara alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada akhiran pronominal ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Struktur paralel dan metafora pakaian dipertahankan, sedangkan pengulangan 'kiranya' memperjelas sifat permohonan kedua klausa.
