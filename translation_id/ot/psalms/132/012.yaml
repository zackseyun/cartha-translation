  text: If your sons keep my covenant and my testimonies that I will teach them[a], then their sons also will sit on your throne forever.
translation:
  language: id
  text: Jika putra-putramu menaati perjanjian-Ku dan peringatan-peringatan-Ku yang akan Kuajarkan kepada mereka,[a] maka putra-putra mereka juga akan duduk di atas takhtamu selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kesaksian-kesaksian-Ku” atau “ketetapan-ketetapan-Ku” untuk “peringatan-peringatan-Ku.”'
    reason: Alternatif leksikal bagi וְעֵדֹתַי, yang dapat mengacu pada kesaksian atau ketentuan ilahi dalam perjanjian.
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan kondisi nyata yang dinyatakan oleh teks Ibrani.
- source_word: יִשְׁמְרוּ
  choice: menaati
  rationale: Dalam konteks perjanjian, שׁמר berarti memegang dan menjalankan dengan setia; 'menaati' paling alami dalam bahasa Indonesia modern.
- source_word: בָנֶיךָ
  choice: anak-anakmu
  rationale: Konteksnya ialah putra-putra Daud sebagai penerus dinasti; bahasa Indonesia lazim memakai 'anak-anak' tanpa penandaan gender, sementara konteks takhta memperjelas maksudnya.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: Padanan baku dan jelas bagi istilah perjanjian בְּרִית.
- source_word: וְעֵדֹתַי
  choice: dan ketetapan-ketetapan-Ku
  rationale: עֵדוֹת menunjuk pada ketentuan ilahi yang mengikat sebagai kesaksian perjanjian; 'ketetapan-ketetapan' alami dan dapat dipahami pembaca Indonesia.
- source_word: זוֹ אֲלַמְּדֵם
  choice: yang akan Kuajarkan kepada mereka
  rationale: Menghubungkan klausa relatif dengan ketetapan-ketetapan dan mempertahankan nuansa tindakan Allah dalam konteks bersyarat.
- source_word: גַּם בְּנֵיהֶם
  choice: maka anak-anak mereka juga
  rationale: '''Juga'' mempertahankan daya aditif גַּם, sedangkan ''maka'' membuat hubungan akibat dari kondisi jelas secara alami.'
- source_word: עֲדֵי עַד
  choice: untuk selama-lamanya
  rationale: Ungkapan idiomatis Indonesia yang menyampaikan keberlangsungan tanpa akhir.
- source_word: יֵשְׁבוּ לְכִסֵּא לָךְ
  choice: akan duduk di atas takhtamu
  rationale: Mempertahankan gambaran harfiah tentang duduk di takhta, yang dalam konteks berarti memerintah sebagai penerus kerajaan.
theological_decisions:
- issue: Syarat dalam janji dinasti Daud
  choice: 'Ayat ini diterjemahkan sebagai kondisi nyata: kelanjutan keturunan di atas takhta bergantung pada ketaatan mereka kepada perjanjian dan ketetapan Allah.'
  alternative: Menganggap kondisi tersebut hanya retoris atau menundukkannya pada pemahaman bahwa janji itu tanpa syarat.
  rationale: Struktur אִם ... גַּם menyatakan hubungan bersyarat. Terjemahan mempertahankan ketegangan teologis itu tanpa menyelaraskannya secara diam-diam dengan bagian Alkitab lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Konstruksi bersyarat dibuat eksplisit dengan 'Jika ... maka', tanpa menghilangkan ketegangan teologis teks.
