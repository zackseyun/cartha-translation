  text: קוּמָ֣/ה יְ֭הוָה לִ/מְנוּחָתֶ֑/ךָ אַ֝תָּ֗ה וַ/אֲר֥וֹן עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/008.yaml
  text: Arise[a], O Yahweh, to your resting place[b], you and the ark of your strength.
translation:
  language: id
  text: Bangkitlah, ya Yahweh, ke tempat perhentian-Mu[a], Engkau dan tabut kekuatan-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke perhentian-Mu.” Istilah Ibrani dapat menunjuk pada perhentian sebagai keadaan atau pada tempat perhentian; di sini kemungkinan besar yang dimaksud ialah tempat Yahweh menetapkan kehadiran-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau “tabut keperkasaan-Mu” atau “tabut yang menyatakan kuasa-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Bangkitlah
  rationale: Bentuk imperatif dari קום yang ditujukan kepada Yahweh. “Bangkitlah” mempertahankan nada liturgis yang luhur serta panggilan agar Allah bertindak atau mengambil tempat-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap dipertahankan, bukan diganti dengan gelar.
- source_word: לִמְנוּחָתֶךָ
  choice: menuju tempat perhentian-Mu
  rationale: מְנוּחָה dapat berarti keadaan istirahat atau tempat perhentian. Dengan adanya tabut dan konteks tempat kudus, frasa ini paling wajar menunjuk pada tempat kehadiran Yahweh yang menetap, tetapi alternatif abstraknya tetap dicatat.
- source_word: אַתָּה
  choice: Engkau
  rationale: Pronomina mandiri dalam bahasa Ibrani dinyatakan secara eksplisit dan dipertahankan untuk penekanan serta koordinasi dengan tabut.
- source_word: וַאֲרוֹן
  choice: dan tabut
  rationale: Dalam konteks ibadah Israel, אֲרוֹן merujuk pada tabut yang dikaitkan dengan kehadiran Yahweh; “tabut” adalah padanan Indonesia yang baku dan alami.
- source_word: עֻזֶּךָ
  choice: kekuatan-Mu
  rationale: עֹז berarti kekuatan, keperkasaan, atau kuasa. “Kekuatan-Mu” mempertahankan konstruksi genitif Ibrani yang padat tanpa mengubahnya menjadi parafrasa penafsiran.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna “tabut kekuatan-Mu”
  choice: Mempertahankan ungkapan genitif sebagai “tabut kekuatan-Mu”
  alternative: tabut keperkasaan-Mu; tabut yang menyatakan kuasa-Mu
  rationale: Ungkapan itu mengaitkan tabut dengan kehadiran Yahweh yang penuh kuasa. Bentuk harfiah mempertahankan kepadatan puitis dan ketegangan teologis teks tanpa menjelaskan hubungan tersebut secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “ya Yahweh” serta imperatif “Bangkitlah” menjaga corak mazmur liturgis. Kapitalisasi pada akhiran pronominal ilahi mengikuti kebiasaan tulisan rohani Indonesia tanpa menambahkan unsur yang tidak terdapat dalam sumber.
