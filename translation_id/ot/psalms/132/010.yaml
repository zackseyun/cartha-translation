lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Demi
  rationale: Ungkapan ini menyatakan dasar atau kepentingan permohonan. “Demi” alami dalam bahasa doa Indonesia dan mempertahankan seruan yang didasarkan pada Daud.
- source_word: דָּוִד
  choice: Daud
  rationale: Nama diri menggunakan bentuk baku dalam Alkitab bahasa Indonesia.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Dalam konteks doa dan perjanjian kerajaan, “hamba” menyampaikan ketundukan serta merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: אַל
  choice: janganlah
  rationale: Partikel negatif ini membentuk larangan atau permohonan negatif; “janganlah” sesuai dengan ragam doa yang bermartabat.
- source_word: תָּשֵׁב פְּנֵי
  choice: menolak
  rationale: Secara harfiah ungkapan ini berarti “memalingkan wajah,” tetapi secara idiomatis menyatakan penolakan. “Menolak” menghasilkan bahasa Indonesia yang jelas, sementara gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: מְשִׁיחֶךָ
  choice: orang yang Kauurapi
  rationale: Bentuk ini mempertahankan arti dasar “orang yang diurapi” dan gema kerajaan maupun mesianiknya tanpa langsung membatasi rujukan pada gelar Mesias.
theological_decisions:
- issue: Apakah מְשִׁיחֶךָ harus diterjemahkan sebagai gelar mesianik
  choice: orang yang Kauurapi
  alternative: Mesias-Mu
  rationale: Konteks langsung berbicara tentang Daud dan penguasa dari garis Daud. Terjemahan utama mempertahankan istilah kerajaan Ibrani tanpa memaksakan identifikasi kristologis langsung, sedangkan kemungkinan pembacaan mesianik kanonik dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Demi” dan “janganlah” mempertahankan nada permohonan puitis; bentuk sapaan ilahi ditulis dengan kapital sesuai kebiasaan Indonesia. Penanda catatan ditempatkan sesudah frasa yang diterangkan.
