  text: Demi Daud, hamba-Mu, janganlah memalingkan wajah orang yang Kauurapi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah menolak orang yang Kauurapi.” Secara harfiah, “janganlah memalingkan wajah orang yang Kauurapi.”
