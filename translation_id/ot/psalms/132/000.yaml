source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/000.yaml
  text: A Song of Ascents[a]. Remember, Yahweh[b], for David all his affliction.
translation:
  language: id
  text: 'Nyanyian ziarah.


    Ingatlah, ya Yahweh, akan Daud[a] dan segala penderitaannya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi Daud” atau “mengenai Daud.” Preposisi Ibrani dapat dipahami dalam beberapa cara.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesusahannya” atau “segala perendahannya.” Kata Ibrani dapat menunjuk pada penderitaan, kesukaran, atau keadaan direndahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Ungkapan ini secara harfiah berkaitan dengan 'pendakian', tetapi sebagai judul mazmur secara wajar menunjuk pada nyanyian yang dinyanyikan dalam perjalanan naik menuju Yerusalem.
- source_word: זְכוֹר
  choice: Ingatlah
  rationale: Mempertahankan bentuk imperatif Ibrani yang ditujukan kepada Yahweh.
- source_word: לְדָוִד
  choice: akan Daud
  rationale: Preposisi לְ dapat berarti 'bagi', 'mengenai', atau 'demi'. Dalam konstruksi dengan 'ingatlah', 'akan Daud' alami dalam bahasa Indonesia dan tetap membuka makna mengingat Daud beserta keadaannya.
- source_word: עֻנּוֹתוֹ
  choice: penderitaannya
  rationale: Kata ini mencakup kesusahan, penderitaan, dan keadaan direndahkan; 'penderitaan' menyampaikan cakupan itu secara ringkas dan bermartabat.
theological_decisions:
- issue: Makna permohonan agar Yahweh mengingat Daud
  choice: Tidak dijelaskan sebagai mengingat jasa atau mengabulkan demi Daud
  alternative: Terjemahan seperti 'ingatlah segala jasa Daud' atau 'demi Daud'
  rationale: Teks Ibrani hanya meminta Yahweh mengingat Daud dan seluruh penderitaannya; hubungan teologis yang lebih khusus tidak boleh dimasukkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh'. Judul dipisahkan dari isi ayat agar fungsi superskripsi terlihat jelas.
