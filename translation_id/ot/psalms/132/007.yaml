translation:
  language: id
  text: Mari kita masuk ke tempat-tempat kediaman-Nya; mari kita sujud[a] di tumpuan kaki-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mari kita menyembah di tumpuan kaki-Nya.” Kata Ibrani secara lebih harfiah menggambarkan tindakan sujud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹאָה
  choice: Mari kita masuk
  rationale: Bentuk kohortatif orang pertama jamak dari בוא menyatakan ajakan bersama. Dalam konteks bergerak menuju lalu memasuki kediaman, “Mari kita masuk” alami dan mempertahankan kemungkinan makna “masuk” yang ada pada verba ini.
- source_word: לְמִשְׁכְּנוֹתָיו
  choice: ke tempat-tempat kediaman-Nya
  rationale: Bentuk Ibrani ini jamak dan memakai sufiks orang ketiga tunggal maskulin. Bentuk jamak dipertahankan, sedangkan “tempat-tempat kediaman” lebih mudah dipahami dalam bahasa Indonesia modern daripada istilah khusus seperti “kemah-kemah suci”.
- source_word: נִשְׁתַּחֲוֶה
  choice: mari kita sujud
  rationale: Verba שׁחה menunjuk pada tindakan membungkukkan atau merendahkan diri dengan hormat. “Sujud” mempertahankan unsur sikap tubuh dan penghormatan tanpa memperluasnya menjadi istilah umum “menyembah”.
- source_word: לַהֲדֹם רַגְלָיו
  choice: di tumpuan kaki-Nya
  rationale: Ungkapan harfiah “tumpuan kaki-Nya” wajar dalam bahasa Indonesia. Prefiks ל dipahami secara lokatif dalam konteks tindakan sujud.
theological_decisions:
- issue: Acuan sufiks orang ketiga tunggal pada “kediaman-Nya” dan “kaki-Nya”
  choice: Mempertahankan pronomina “-Nya” tanpa menyebut acuan secara eksplisit
  alternative: Menentukan TUHAN atau tabut sebagai acuan khusus
  rationale: Konteks Mazmur 132 menjalin tema kediaman TUHAN, Sion, dan tabut. Teks Ibrani hanya memakai pronomina di ayat ini, sehingga terjemahan tidak menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dibaca. Pengulangan “mari kita” mempertahankan kesejajaran dua bentuk ajakan dalam bahasa Ibrani. Kapitalisasi “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia tanpa memperjelas acuan pronomina di dalam teks.
