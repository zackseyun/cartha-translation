  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
translation:
  language: id
  text: Aku akan mengenakan rasa malu pada musuh-musuhnya, tetapi di atasnya mahkotanya akan berbunga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mahkotanya akan berkembang.” Kata kerja Ibrani menggambarkan sesuatu yang bertunas atau berbunga, sedangkan kata bendanya dapat berarti mahkota atau diadem kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבָיו
  choice: musuh-musuhnya
  rationale: Bentuk jamak dengan akhiran orang ketiga tunggal; padanan ini alami dan langsung dalam bahasa Indonesia.
- source_word: אַלְבִּישׁ
  choice: Aku akan mengenakan
  rationale: Bentuk Hifil orang pertama tunggal menyatakan tindakan membuat seseorang berpakaian; pilihan ini mempertahankan pelaku ilahi dan metafora pakaian.
- source_word: בֹּשֶׁת
  choice: kehinaan
  rationale: Nomina ini dapat berarti rasa malu atau aib/kehinaan. 'Kehinaan' cocok sebagai sesuatu yang secara metaforis dikenakan kepada musuh.
- source_word: וְעָלָיו
  choice: tetapi di atas kepalanya
  rationale: Kata penghubung menyatakan kontras. 'Di atas kepalanya' membuat lokasi mahkota alami dalam bahasa Indonesia tanpa menghilangkan gambaran preposisional.
- source_word: יָצִיץ
  choice: akan berkembang
  rationale: Verba ini menggambarkan bertunas atau berbunga dan, secara kiasan, berkembang. Pilihan ini mempertahankan gambaran pertumbuhan yang tidak biasa ketika mahkota menjadi subjek.
- source_word: נִזְרוֹ
  choice: mahkotanya
  rationale: Dalam konteks mazmur kerajaan, נזר paling wajar menunjuk pada mahkota atau diadem, bukan tindakan pentahbisan.
theological_decisions:
- issue: Gambaran kerajaan dari נִזְרוֹ dalam mazmur Daud dan Sion
  choice: mahkotanya
  alternative: pentahbisannya
  rationale: Konteks janji kepada keturunan Daud mendukung arti kerajaan, tetapi terjemahan tidak memperjelasnya menjadi klaim mesianik tertentu yang tidak dinyatakan secara eksplisit oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora mengenakan kehinaan serta gambaran mahkota yang tumbuh dipertahankan; frasa 'di atas kepalanya' dipakai agar acuannya jelas dan alami.
