  text: I will not give sleep to my eyes[a], nor slumber to my eyelids—
translation:
  language: id
  text: aku tidak akan membiarkan mataku tidur[a], ataupun kelopak mataku terlelap—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “Jika aku memberi tidur kepada mataku, lelap kepada kelopak mataku”—sebuah rumusan seperti sumpah yang bermakna “aku tidak akan membiarkan …”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: tidak akan
  rationale: Dalam konteks sumpah, אִם mengawali rumusan eliptis yang menyatakan tekad kuat, bukan syarat biasa. Bahasa Indonesia alami menyampaikan dayanya dengan negasi “tidak akan”; bentuk harfiah dijelaskan dalam catatan kaki.
- source_word: אֶתֵּן
  choice: membiarkan
  rationale: Makna dasarnya ialah “memberi”, tetapi dalam kolokasi Indonesia, “membiarkan mataku tidur” lebih alami daripada “memberi tidur kepada mataku” dan tetap mempertahankan gambaran bahwa pemazmur menolak memberi kesempatan untuk tidur.
- source_word: שְׁנַת
  choice: tidur
  rationale: Nomina ini berarti “tidur”; bentuk verbal “tidur” menghasilkan ungkapan Indonesia yang wajar bersama “membiarkan”.
- source_word: לְעֵינָי
  choice: mataku
  rationale: Preposisi ל menandai penerima dalam konstruksi Ibrani. Dengan verba Indonesia “membiarkan”, hubungan itu secara alami dinyatakan langsung sebagai “mataku”.
- source_word: לְעַפְעַפַּי
  choice: kelopak mataku
  rationale: עפעף berarti “kelopak mata”. Ungkapan ini mempertahankan citra anggota tubuh dan kesejajaran puitis dengan “mataku”.
- source_word: תְּנוּמָה
  choice: terlelap
  rationale: Kata ini menunjuk pada tidur atau lelap. “Terlelap” membedakannya dari שְׁנַת dan mempertahankan variasi dalam paralelisme tanpa memakai kata Indonesia yang terlalu arkais.
theological_decisions:
- issue: Daya rumusan sumpah eliptis dengan אִם
  choice: 'Dinyatakan sebagai tekad negatif: “aku tidak akan”'
  alternative: 'Diterjemahkan secara harfiah: “jika aku membiarkan ...” dengan kutuk yang tersirat'
  rationale: Rumusan Ibrani mengandung sumpah yang akibat buruknya tidak diucapkan. Terjemahan negatif menyampaikan fungsi ayat secara jelas tanpa menambahkan isi kutuk yang tidak terdapat dalam teks, sedangkan bentuk harfiahnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Huruf awal “aku” dibuat kecil karena ayat ini melanjutkan kalimat dan sumpah dari ayat sebelumnya; tanda pisah di akhir mempertahankan kesinambungan ke ayat berikutnya.
