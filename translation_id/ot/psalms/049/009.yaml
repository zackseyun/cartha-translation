translation:
  language: id
  text: supaya ia tetap hidup untuk selama-lamanya dan tidak melihat liang kebinasaan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubur” atau “kerusakan.”
