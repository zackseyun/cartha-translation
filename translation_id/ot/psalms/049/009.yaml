lexical_decisions:
- source_word: וִיחִי
  choice: supaya ia ... hidup
  rationale: Bentuk imperfek/jusif Qal orang ketiga tunggal dari חיה melanjutkan pemikiran baris sebelumnya dan menyatakan hasil atau tujuan yang tidak mungkin dicapai. “Supaya ia ... hidup” mempertahankan hubungan sintaksis itu secara alami dalam bahasa Indonesia.
- source_word: עוֹד
  choice: tetap
  rationale: Dalam konteks ini עוֹד menyatakan kelanjutan hidup. “Tetap” menyampaikan keberlangsungan tersebut dengan wajar.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Gabungan ל dengan נצח menyatakan keberlangsungan tanpa akhir. Ungkapan ini alami, bermartabat, dan mempertahankan daya temporal teks Ibrani.
- source_word: לֹא
  choice: tidak
  rationale: Kata penyangkalan ini secara langsung menyangkal verba berikutnya.
- source_word: יִרְאֶה
  choice: melihat
  rationale: ראה pada dasarnya berarti “melihat” dan dalam konteks kematian dapat bermakna mengalami. Terjemahan harfiah ini mempertahankan idiom dan keluasan metaforanya.
- source_word: הַשָּׁחַת
  choice: liang kebinasaan
  rationale: Dalam puisi tentang kematian, שחת dapat menunjuk pada liang, kubur, kebinasaan, atau kerusakan. “Liang kebinasaan” mempertahankan citra konkret sebuah liang sekaligus nuansa kehancuran tanpa membatasinya hanya pada makam fisik atau pembusukan.
theological_decisions:
- issue: Makna שחת dalam konteks kematian
  choice: liang kebinasaan
  alternative: kubur; kebinasaan; kerusakan
  rationale: Ayat ini berbicara tentang ketidakmungkinan manusia menjamin kelanjutan hidup tanpa akhir dan lolos dari kematian. “Liang kebinasaan” mempertahankan keluasan citra Ibrani yang mencakup kubur, kehancuran, dan keadaan menuju kematian; alternatif leksikal dicatat dalam catatan kaki agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. Frasa ini sengaja berbentuk lanjutan dari ayat sebelumnya. Huruf kecil pada “liang kebinasaan” menghindari kesan bahwa istilah tersebut adalah nama diri, sementara citra puitis Ibraninya tetap dipertahankan.
