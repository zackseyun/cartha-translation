  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: id
  text: Namun manusia dalam kehormatan tidak bertahan[a]; ia disamakan dengan binatang yang binasa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak bermalam.” Ungkapan ini menyatakan bahwa manusia tidak terus atau tidak tetap berada dalam kehormatan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “binatang yang dimusnahkan.” Kata kerja terakhir secara tradisional dipahami di sini sebagai menunjuk kepada kebinasaan.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: manusia
  rationale: Kata ini dapat menunjuk kepada seorang manusia secara representatif ataupun umat manusia secara umum. Bahasa Indonesia 'manusia' mempertahankan keluasan makna tersebut secara alami.
- source_word: בִּיקָר
  choice: dalam kemuliaannya
  rationale: יָקָר menyatakan kehormatan, nilai tinggi, atau kemegahan. 'Kemuliaannya' sesuai dengan konteks status dan martabat manusia, tanpa mempersempitnya menjadi kekayaan semata.
- source_word: בַּל יָלִין
  choice: tidak bertahan
  rationale: Secara harfiah ungkapan ini berarti 'tidak bermalam'. Dalam konteks hikmat ini, ungkapan tersebut menyatakan bahwa manusia tidak terus berada dalam keadaan mulia.
- source_word: נִמְשַׁל
  choice: ia sama seperti
  rationale: Bentuk Nifal dari משל menyatakan perbandingan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan hubungan perbandingan itu.
- source_word: כַּבְּהֵמוֹת
  choice: seperti binatang
  rationale: בְּהֵמוֹת menunjuk secara umum kepada binatang. 'Binatang' merupakan padanan modern dan wajar dalam bahasa Indonesia.
- source_word: נִדְמוּ
  choice: yang binasa
  rationale: Dalam konteks kefanaan pada mazmur ini, bentuk tersebut secara tradisional dipahami sebagai 'binasa' atau 'dimusnahkan'. 'Yang binasa' menghasilkan perbandingan yang jelas tanpa mengulang gagasan נִמְשַׁל.
theological_decisions:
- issue: Apakah ayat ini menyatakan hilangnya kehormatan atau kefanaan manusia secara lebih luas
  choice: Mempertahankan ungkapan umum 'tidak bertahan' dan perbandingan dengan binatang yang binasa
  alternative: Menafsirkan secara eksplisit sebagai 'tidak hidup selamanya dalam kemuliaan'
  rationale: Teks menghubungkan keadaan mulia dengan ketidakbertahanan dan kebinasaan, tetapi tidak menjabarkan hubungan itu secara dogmatis. Terjemahan tidak menambahkan penjelasan teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Namun' mempertahankan kontras pembuka; susunan kalimat dibuat alami tanpa menghilangkan gambaran konkret yang dijelaskan dalam catatan kaki.
