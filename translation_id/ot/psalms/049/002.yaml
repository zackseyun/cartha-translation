lexical_decisions:
- source_word: גַּם ... גַּם
  choice: baik ... maupun
  rationale: Pengulangan גַּם mencakup kedua kelompok; pasangan “baik ... maupun” menyampaikan daya distributif itu secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי אָדָם
  choice: rakyat biasa
  rationale: Dalam pasangan dengan בְּנֵי אִישׁ, ungkapan ini berfungsi sebagai sebutan idiomatis bagi orang berstatus sosial rendah atau biasa, bukan sebagai ungkapan keturunan secara harfiah.
- source_word: בְּנֵי אִישׁ
  choice: orang terpandang
  rationale: Dalam kontras dengan בְּנֵי אָדָם, ungkapan ini menunjuk kepada orang yang berkedudukan atau berstatus sosial tinggi. “Orang terpandang” alami dan tidak membatasi makna hanya pada kaum bangsawan.
- source_word: יַחַד
  choice: bersama-sama
  rationale: Kata ini menyatakan bahwa seluruh kelompok tersebut dihimpun atau disapa secara serentak. Penempatannya pada akhir larik menghasilkan susunan Indonesia yang alami.
- source_word: עָשִׁיר
  choice: kaya
  rationale: Padanan Indonesia yang langsung dan lazim dalam kontras sosial-ekonomi.
- source_word: וְאֶבְיוֹן
  choice: dan miskin
  rationale: Dalam pasangan dengan “kaya”, “miskin” merupakan padanan paling jelas dan idiomatis; makna “berkekurangan” tetap tercakup.
