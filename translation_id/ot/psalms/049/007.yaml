  text: אָ֗ח לֹא פָדֹ֣ה יִפְדֶּ֣ה אִ֑ישׁ לֹא יִתֵּ֖ן לֵ/אלֹהִ֣ים כָּפְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/007.yaml
  text: Surely no man can redeem a brother[a], or give to God his ransom—
translation:
  language: id
  text: 'Sungguh, tidak seorang pun dapat menebus saudaranya[a]

    atau memberikan kepada Allah harga tebusannya—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seorang saudara sama sekali tidak dapat menebus siapa pun atau memberikan kepada Allah harga tebusannya.”
    reason: Susunan frasa Ibrani pada awal ayat diperdebatkan. Terjemahan utama memahami אִישׁ sebagai subjek dan אָח sebagai objek yang didahulukan; alternatif ini memahami אָח sebagai subjek yang ditekankan.
lexical_decisions:
- source_word: אָח
  choice: saudaranya
  rationale: Kata אָח secara harfiah berarti “saudara”. Dalam susunan kalimat ini, kata tersebut paling wajar dipahami sebagai objek yang ditempatkan di depan untuk penekanan. Bentuk posesif dalam bahasa Indonesia menyampaikan hubungan yang tersirat tanpa membatasinya hanya pada saudara kandung.
- source_word: פָדֹה יִפְדֶּה
  choice: dapat menebus
  rationale: Gabungan infinitif absolut dan bentuk imperfek menegaskan tindakan itu; bersama לֹא, ungkapan ini menyatakan ketidakmungkinan mutlak. “Tidak ... dapat menebus” menyampaikan daya tersebut secara alami dalam bahasa Indonesia.
- source_word: אִישׁ
  choice: tidak seorang pun
  rationale: אִישׁ secara leksikal berarti “orang/laki-laki”, tetapi di sini berfungsi secara representatif dan tidak membatasi pernyataan pada jenis kelamin tertentu. “Tidak seorang pun” adalah padanan Indonesia yang alami dan tepat dalam konteks universal ini.
- source_word: לֵאלֹהִים
  choice: kepada Allah
  rationale: Dalam konteks mazmur ini אֱלֹהִים merujuk kepada Allah yang esa, bukan kepada para ilah.
- source_word: כָּפְרוֹ
  choice: tebusan bagi orang itu
  rationale: כֹּפֶר adalah harga tebusan atau pembayaran untuk membebaskan seseorang. Sufiks orang ketiga tunggal dapat merujuk kepada orang yang hendak ditebus; “bagi orang itu” menjernihkan rujukannya tanpa memasukkan gagasan kurban pendamaian yang tidak dinyatakan secara khusus di sini.
theological_decisions:
- issue: Makna כֹּפֶר dalam hubungannya dengan Allah
  choice: tebusan yang diberikan kepada Allah bagi nyawa orang lain
  alternative: harga pendamaian kepada Allah atau harga pembebasan secara umum
  rationale: Konteks menyatakan bahwa manusia tidak mampu memperoleh pembebasan dari kematian dengan membayar Allah. “Tebusan” mempertahankan gambaran harga pembebasan tanpa mengembangkan teologi kurban melampaui isi ayat.
- issue: Cakupan אִישׁ
  choice: pernyataan universal tentang ketidakmampuan manusia
  alternative: rujukan khusus kepada seorang laki-laki
  rationale: Walaupun nomina Ibrani berbentuk maskulin tunggal, pemakaiannya di sini representatif bagi manusia; terjemahan Indonesia mempertahankan cakupan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Sungguh” mempertahankan nuansa penegasan pada awal klausa; tanda pisah mempertahankan kalimat yang berlanjut ke ayat berikutnya.
