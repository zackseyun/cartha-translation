id: PSA.49.15
reference: Psalms 49:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
translation:
  language: id
  text: Namun Allah akan menebus hidupku dari tangan dunia orang mati[a], sebab Ia akan mengambil aku[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol adalah istilah Ibrani untuk dunia orang mati; dapat juga diterjemahkan “kubur” atau “alam orang mati.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sebab Ia akan menerima aku.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Partikel ini menandai pertentangan dengan nasib orang berharta dan manusia fana dalam konteks sebelumnya. “Namun” menyampaikan daya adversatifnya secara alami dan bermartabat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam klausa ini kata tersebut merujuk secara tunggal kepada Allah Israel; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: יִפְדֶּה
  choice: akan menebus
  rationale: Kata פדה menyatakan pembebasan atau penebusan dari kuasa atau keadaan tertentu. “Menebus” mempertahankan makna pembebasan sekaligus gema teologisnya tanpa memperjelas mekanisme yang tidak disebutkan teks.
- source_word: נַפְשִׁי
  choice: hidupku
  rationale: Dalam konteks Ibrani, נפש kerap menunjuk pada kehidupan atau diri seseorang secara utuh, bukan semata-mata jiwa tak berwujud. “Hidupku” sesuai dengan konteks kematian dan pembebasan.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan harfiahnya adalah “dari tangan,” dengan arti kuasa atau cengkeraman. Citra tangan dipertahankan karena masih jelas dalam bahasa Indonesia.
- source_word: שְׁאוֹל
  choice: dunia orang mati
  rationale: שְׁאוֹל menunjuk pada ranah orang mati. Padanan deskriptif ini lebih mudah dipahami pembaca Indonesia daripada transliterasi “Sheol” dan tidak menyempitkannya menjadi liang kubur saja.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memberikan dasar atau penjelasan bagi keyakinan pada klausa sebelumnya; “sebab” ringkas dan sesuai dengan larik puitis.
- source_word: יִקָּחֵנִי
  choice: Ia akan mengambil aku
  rationale: לקח pada dasarnya berarti “mengambil” dan dalam tindakan ilahi dapat menyiratkan menerima seseorang kepada-Nya. Terjemahan ini mempertahankan keluasan makna teks; alternatif “menerima aku” dicatat dalam catatan kaki.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah teknis puitis atau musikal ini tidak pasti maknanya. Bentuk transliterasi tradisional Indonesia menghindari kepastian semu.
theological_decisions:
- issue: Makna נַפְשִׁי dalam kaitannya dengan kematian dan pembebasan
  choice: Diterjemahkan “hidupku,” bukan “jiwaku.”
  alternative: “jiwaku” atau “diriku”
  rationale: Pilihan ini tidak memasukkan dualisme tubuh-jiwa yang lebih sempit ke dalam puisi Ibrani, tempat נפש sering menunjuk pada kehidupan atau pribadi secara utuh.
- issue: Hakikat pembebasan dari dunia orang mati
  choice: 'Bahasanya dibiarkan luas: Allah akan menebus hidup pemazmur dari tangan dunia orang mati dan mengambilnya.'
  alternative: Menyatakannya secara eksplisit sebagai kebangkitan, kehidupan setelah kematian, atau sekadar luput dari kematian dini.
  rationale: Teks menyatakan keyakinan akan pembebasan ilahi, tetapi tidak menerangkan bentuknya secara sistematis. Terjemahan mempertahankan ketegangan antara kemungkinan-kemungkinan tersebut.
- issue: Makna tindakan Allah dalam יִקָּחֵנִי
  choice: “Ia akan mengambil aku”
  alternative: “Ia akan menerima aku” atau “Ia akan mengangkat aku”
  rationale: Padanan yang lebih harfiah menjaga kemungkinan makna menerima kepada diri-Nya tanpa menjadikannya eksplisit melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan “mengambil aku” dipertahankan untuk kedekatan dengan teks Ibrani dan untuk menjaga ambiguitas teologis, meskipun “mengambilku” lebih lazim dalam prosa sehari-hari. Semua penanda catatan kaki dicantumkan dalam teks utama.
