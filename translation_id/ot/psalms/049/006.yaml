  text: הַ/בֹּטְחִ֥ים עַל חֵילָ֑/ם וּ/בְ/רֹ֥ב עָ֝שְׁרָ֗/ם יִתְהַלָּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/006.yaml
  text: those who trust in their wealth and boast in the abundance of their riches—[a][b]
translation:
  language: id
  text: orang-orang yang mengandalkan kekayaan mereka dan membanggakan harta mereka yang berlimpah—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bermegah karena harta mereka yang berlimpah.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani חַיִל juga dapat berarti “kekuatan” atau “sumber daya”, tetapi di sini kesejajarannya dengan “harta” menunjukkan kekayaan material.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: orang-orang yang mengandalkan
  rationale: Partisipel Qal maskulin jamak dengan artikel berfungsi substantival. Bentuk ini menggambarkan orang-orang yang secara khas menaruh kepercayaan; “mengandalkan” alami dalam bahasa Indonesia dan sesuai dengan objek berupa kekayaan.
- source_word: עַל
  choice: pada (tersirat dalam konstruksi “mengandalkan”)
  rationale: Dengan בּטח, preposisi ini menandai objek tempat kepercayaan atau ketergantungan ditaruh. Dalam bahasa Indonesia, maknanya paling alami diungkapkan langsung oleh verba transitif “mengandalkan” tanpa preposisi terpisah.
- source_word: חֵילָם
  choice: kekayaan mereka
  rationale: חַיִל dapat berarti kekuatan, pasukan, kemampuan, atau sumber daya/kekayaan. Paralelismenya dengan עֹשֶׁר dalam baris berikut menunjukkan makna material di sini.
- source_word: וּבְרֹב
  choice: dan ... yang berlimpah
  rationale: רֹב menyatakan jumlah atau kelimpahan yang besar. Konstruksi adjektival “yang berlimpah” menyampaikan makna itu secara alami sambil mempertahankan paralelisme puisi.
- source_word: עָשְׁרָם
  choice: harta mereka
  rationale: עֹשֶׁר berarti kekayaan atau harta. “Harta” dipilih untuk membedakannya dari חֵילָם tanpa menghilangkan kesejajaran makna material.
- source_word: יִתְהַלָּלוּ
  choice: membanggakan
  rationale: Bentuk Hitpael dari הלל di sini berarti bermegah atau membanggakan diri karena sesuatu. “Membanggakan” jelas dan wajar bagi pembaca modern, sedangkan “bermegah” tetap dicatat sebagai alternatif.
