  text: וְ֭/יֵקַר פִּדְי֥וֹן נַפְשָׁ֗/ם וְ/חָדַ֥ל לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/008.yaml
  text: For the ransom of their life is costly[a], and it ceases forever[b],
translation:
  language: id
  text: Sebab tebusan nyawa mereka[b] mahal, dan upaya itu terhenti untuk selamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dan ia berhenti untuk selamanya.” Klausa Ibrani ini sangat ringkas dan subjeknya tidak dinyatakan; maksudnya dapat juga bahwa tebusan itu tidak akan pernah mencukupi atau bahwa usaha membayarnya harus ditinggalkan untuk selamanya.
    reason: alternative_reading
  - marker: b
    text: Atau “hidup mereka” atau “jiwa mereka.” Kata Ibrani nefesh di sini dapat menunjuk pada nyawa, hidup, atau diri seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵקַר
  choice: begitu mahal
  rationale: Akar יקר menyatakan sesuatu yang bernilai tinggi atau mahal. Dalam konteks harga pembebasan, “begitu mahal” menyampaikan bahwa harga itu berada di luar kemampuan manusia, tanpa mengubahnya menjadi pernyataan eksplisit tentang nilai moral.
- source_word: פִּדְיוֹן
  choice: tebusan
  rationale: Kata ini menunjuk pada harga yang dibayar untuk membebaskan seseorang. “Tebusan” mempertahankan gambaran transaksional dan lazim dipahami dalam bahasa Indonesia.
- source_word: נַפְשָׁם
  choice: nyawa mereka
  rationale: נפש di sini menunjuk pada hidup atau diri orang yang terancam kematian. “Nyawa” lebih tepat dalam konteks penebusan dari maut daripada “jiwa,” yang dapat memberi kesan bagian nonjasmani manusia.
- source_word: וְחָדַל
  choice: sehingga orang harus berhenti berusaha
  rationale: חדל pada dasarnya berarti berhenti atau tidak melanjutkan. Klausa Ibrani sangat ringkas dan subjeknya tidak dinyatakan; terjemahan ini menghubungkannya secara wajar dengan usaha manusia untuk membayar tebusan dalam konteks sebelumnya, sambil mencatat alternatif yang lebih harfiah.
- source_word: לְעוֹלָם
  choice: untuk selamanya
  rationale: Frasa ini menyatakan keberlangsungan tanpa batas. “Untuk selamanya” mempertahankan bentuk positif bahasa Ibrani dan daya tekan permanennya.
theological_decisions:
- issue: Makna נפש dalam konteks tebusan dan kematian
  choice: nyawa
  alternative: jiwa atau hidup
  rationale: Mazmur ini membahas ketidakmampuan manusia menebus sesamanya dari kematian. “Nyawa” cocok dengan konteks tersebut dan tidak memasukkan pandangan antropologis yang tidak diwajibkan oleh kata Ibraninya.
- issue: Subjek dan arti klausa eliptis וְחָדַל לְעוֹלָם
  choice: orang harus berhenti berusaha untuk selamanya
  alternative: tebusan itu berhenti untuk selamanya; tebusan itu tidak akan pernah mencukupi
  rationale: Bahasa Ibraninya tidak menyebutkan subjek חדל dan dapat dipahami sebagai berhentinya usaha membayar tebusan atau kegagalan tebusan itu sendiri. Teks utama dibuat alami berdasarkan alur ayat 8–9, sedangkan ketidakpastian asli dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. “Begitu mahal, sehingga” memperjelas hubungan logis yang tersirat oleh konteks, sementara catatan kaki menjaga keringkasan dan ambiguitas klausa Ibrani kedua.
