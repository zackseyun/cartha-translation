  yaml_path: translation/ot/psalms/049/018.yaml
  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: id
  text: Sebab semasa hidupnya ia menganggap dirinya berbahagia[a], dan orang memujimu ketika engkau mendatangkan kebaikan bagi dirimu sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “jiwanya memberkati dirinya semasa hidupnya”; atau: “ia menyebut dirinya diberkati selama ia hidup.”'
    reason: Menjelaskan idiom נַפְשׁוֹ ... יְבָרֵךְ, yang dapat diterjemahkan dengan mempertahankan kata “jiwa” atau diungkapkan secara refleksif sebagai penilaian orang itu terhadap dirinya sendiri.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya dalam alur argumentasi mazmur.
- source_word: נַפְשׁוֹ ... יְבָרֵךְ
  choice: ia menganggap dirinya berbahagia
  rationale: נֶפֶשׁ di sini secara idiomatis menunjuk kepada diri orang itu, sedangkan ברך dalam konstruksi ini paling mungkin menyatakan bahwa ia memandang dirinya sendiri sebagai orang yang diberkati atau berbahagia. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan nuansa refleksif.
- source_word: בְּחַיָּיו
  choice: semasa hidupnya
  rationale: Frasa ini menyatakan rentang waktu selama orang tersebut hidup.
- source_word: וְיוֹדֻךָ
  choice: dan orang memujimu
  rationale: Bentuk jamak tanpa subjek tersurat dipahami secara generik sebagai orang-orang. ידה di sini paling sesuai berarti memuji dalam konteks persetujuan sosial terhadap kemakmuran seseorang.
- source_word: כִּי
  choice: ketika
  rationale: Dalam klausa kedua, kata ini menyatakan keadaan atau waktu ketika pujian diberikan.
- source_word: תֵיטִיב לָךְ
  choice: engkau mendatangkan kebaikan bagi dirimu sendiri
  rationale: Terjemahan ini mempertahankan unsur tindakan dalam bentuk Hifil יטב dan datif refleksif לָךְ, sekaligus membiarkan terbuka apakah yang dimaksud terutama keberhasilan, kemakmuran, atau tindakan yang menguntungkan diri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pergantian dari orang ketiga (“ia”) ke orang kedua (“engkau”) dipertahankan karena terdapat dalam teks Ibrani. Ungkapan “mendatangkan kebaikan bagi dirimu sendiri” sengaja mempertahankan keluasan makna תֵיטִיב לָךְ dan tidak membatasinya hanya pada kemakmuran materi.
