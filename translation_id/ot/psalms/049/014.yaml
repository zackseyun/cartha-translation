id: PSA.49.14
reference: Psalms 49:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/צֹּ֤אן לִֽ/שְׁא֣וֹל שַׁתּוּ֮ מָ֤וֶת יִ֫רְעֵ֥/ם וַ/יִּרְדּ֘וּ בָ֤/ם יְשָׁרִ֨ים לַ/בֹּ֗קֶר ו/ציר/ם לְ/בַלּ֥וֹת שְׁא֗וֹל מִ/זְּבֻ֥ל לֽ/וֹ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: id
  text: Seperti sekawanan domba, mereka ditetapkan bagi Syeol[a]; maut akan menggembalakan mereka. Orang-orang yang lurus akan berkuasa atas mereka pada pagi hari. Rupa mereka akan binasa; Syeol menjadi tempat tinggalnya[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Syeol adalah alam orang mati; maknanya lebih luas daripada sekadar kubur.
    reason: cultural_note
  - marker: b
    text: Teks Ibrani dalam bagian ini sulit. “Rupa mereka” dapat juga dipahami sebagai “batu karang mereka” atau “kekuatan mereka.”
    reason: lexical_alternative
  - marker: c
    text: 'Bagian akhir teks Ibrani sulit. Secara harfiah dapat dipahami, “Syeol menjadi tempat tinggalnya.” Kemungkinan lain: “rupa mereka akan binasa di Syeol, jauh dari kediaman yang megah,” atau “Syeol akan menghabiskan mereka dari kediamannya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: Seperti kawanan domba
  rationale: צֹאן adalah nomina kolektif bagi domba atau ternak kecil; ungkapan ini mempertahankan gambaran sekawanan yang digiring.
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: mereka ditetapkan bagi Syeol
  rationale: שׁית berarti menaruh atau menetapkan, sedangkan ל menandai tujuan atau peruntukan. 'Ditetapkan bagi' menyampaikan nasib yang menanti mereka tanpa menyempitkan Syeol menjadi kubur fisik.
- source_word: מָוֶת יִרְעֵם
  choice: maut akan menggembalakan mereka
  rationale: רעה berarti menggembalakan. Terjemahan ini mempertahankan personifikasi maut dan ironi dalam metafora kawanan domba.
- source_word: וַיִּרְדּוּ בָם יְשָׁרִים
  choice: Orang-orang yang lurus hati akan berkuasa atas mereka
  rationale: יְשָׁרִים menunjuk kepada orang-orang yang lurus, sedangkan bentuk verba tersebut paling wajar dipahami sebagai berkuasa atau memerintah atas mereka.
- source_word: לַבֹּקֶר
  choice: pada pagi hari
  rationale: Frasa temporal ini diterjemahkan secara langsung tanpa menetapkan apakah pagi di sini bersifat harfiah atau melambangkan pembalikan keadaan.
- source_word: וְצוּרָם
  choice: Rupa mereka
  rationale: Teks Ibrani sulit. Dalam konteks pelapukan, 'rupa mereka' menghasilkan pengertian yang koheren, tetapi kemungkinan arti 'batu karang/kekuatan mereka' tetap dicatat.
- source_word: לְבַלּוֹת
  choice: akan hancur
  rationale: Infinitif dari בלה menyatakan menjadi aus, lapuk, atau musnah. 'Akan hancur' alami dalam bahasa Indonesia dan sesuai dengan konteks kematian.
- source_word: מִזְּבֻל לוֹ
  choice: jauh dari kediaman mereka yang megah
  rationale: זְבֻל dapat berarti kediaman tinggi atau megah, tetapi konstruksi dan rujukan pronominanya sulit. Terjemahan ini mempertahankan kontras dengan keadaan mereka di Syeol sembari menandai ketidakpastian dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan שְׁאוֹל
  choice: Syeol
  alternative: alam orang mati; kubur
  rationale: Istilah Ibrani ini lebih luas daripada kubur fisik. Transliterasi mempertahankan konsep sumber dan menghindari pemaksaan suatu sistem eskatologis tertentu.
- issue: Makna 'pagi hari'
  choice: Dibiarkan sebagai ungkapan temporal yang terbuka
  alternative: Dijelaskan sebagai kebangkitan atau penghakiman terakhir
  rationale: Ayat tidak secara eksplisit mengidentifikasi pagi tersebut; terjemahan tidak boleh menutup ketegangan teologisnya.
- issue: Kuasa orang-orang lurus atas mereka
  choice: akan berkuasa atas mereka
  alternative: akan menginjak-injak mereka
  rationale: Makna dominasi paling sesuai secara leksikal dan tidak menentukan bentuk atau tahap eskatologis dari pembalikan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Syeol' dipertahankan sebagai transliterasi istilah Ibrani. Metafora kawanan dan maut sebagai gembala dipertahankan secara formal, sedangkan sintaksis bagian akhir disusun secara alami dan ketidakpastiannya dijelaskan dalam catatan kaki.
