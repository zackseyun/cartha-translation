source:
  edition: WLC
  text: אַל תִּ֭ירָא כִּֽי יַעֲשִׁ֣ר אִ֑ישׁ כִּֽי יִ֝רְבֶּה כְּב֣וֹד בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/016.yaml
  text: Do not fear when a man becomes rich[a], when the glory of his house increases;
translation:
  language: id
  text: Jangan takut ketika seseorang menjadi kaya, ketika kemuliaan rumahnya[a] bertambah;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumah tangganya”; kata Ibrani untuk “rumah” juga dapat merujuk pada keluarga atau harta milik, bukan hanya bangunan tempat tinggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: אַל dengan bentuk imperfek menyatakan larangan; “Jangan takut” merupakan padanan Indonesia yang ringkas, alami, dan tetap puitis.
- source_word: כִּי
  choice: ketika
  rationale: Dalam kedua kemunculannya, כִּי memperkenalkan keadaan yang tidak boleh menimbulkan ketakutan, sehingga “ketika” lebih tepat daripada hubungan sebab-akibat “karena”.
- source_word: יַעֲשִׁר
  choice: menjadi kaya
  rationale: 'Bentuk Hifil dari עשר di sini berfungsi intransitif dan menyatakan perubahan keadaan: seseorang menjadi kaya.'
- source_word: אִישׁ
  choice: seseorang
  rationale: אִישׁ dipakai secara umum bagi seorang manusia. Bahasa Indonesia tidak perlu menandai gender di sini; “seseorang” mempertahankan makna generiknya dengan wajar.
- source_word: יִרְבֶּה
  choice: bertambah
  rationale: רבה berarti menjadi banyak atau meningkat. Dengan כָּבוֹד sebagai subjek, “bertambah” jelas dan idiomatis.
- source_word: כְּבוֹד
  choice: kemuliaan
  rationale: כָּבוֹד dapat menunjuk pada kemuliaan, kehormatan, kemegahan, atau kelimpahan. “Kemuliaan” mempertahankan keluasan metafora Ibrani tanpa menyempitkannya hanya menjadi kekayaan materi.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: בַּיִת secara harfiah berarti “rumah”, tetapi juga dapat mencakup rumah tangga, keluarga, atau harta milik. “Rumahnya” mempertahankan gambaran Ibrani, sementara catatan kaki menjelaskan cakupan maknanya.
