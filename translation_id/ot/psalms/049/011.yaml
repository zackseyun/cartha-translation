    rationale: קִרְבָּם dalam konteks ini memperkenalkan isi batin/pikiran. Bahasa Indonesia memerlukan penghubung seperti “Dalam batin mereka ada pikiran bahwa” agar hubungan sintaksis dan makna jelas.
  - severity: low
    issue: “Tempat-tempat kediaman” dan “tanah-tanah” kurang alami dalam ragam Indonesia baku modern.
    rationale: “Tempat tinggal” dan “tanah” dapat menyatakan bentuk jamak/kolektif dalam bahasa Indonesia tanpa reduplikasi yang kaku, sambil tetap mempertahankan makna sumber.
