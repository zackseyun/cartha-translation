  verdict: revise
  source_fidelity: Teks utama mengikuti pembacaan Masoret קִרְבָּם sebagai batin/pikiran mereka, bukan varian “kubur mereka,” dan dengan tepat menyatakan anggapan mereka bahwa rumah serta tempat tinggal mereka akan bertahan. Klausa terakhir juga tepat dipahami sebagai penamaan tanah atau wilayah menurut nama mereka.
  naturalness: “Dalam hati mereka” sebagai pembuka merupakan fragmen yang kurang jelas dalam bahasa Indonesia modern karena yang dimaksud ialah isi pikiran mereka. “Tanah-tanah” dan “tempat-tempat kediaman” juga terasa terlalu harfiah dan kurang luwes. Revisi mempertahankan kesejajaran puitis sambil memakai ungkapan baku yang lebih alami.
  terminology: “Batin” dan “pikiran” menyampaikan קִרְבָּם tanpa mengubahnya menjadi istilah teologis. “Tempat tinggal” merupakan padanan modern yang wajar bagi מִשְׁכְּנֹתָם. “Menurut nama mereka sendiri” secara idiomatis menyampaikan penamaan tanah berdasarkan nama pemiliknya.
