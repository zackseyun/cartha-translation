revisions:
- from: Dalam hati mereka, rumah-rumah mereka akan tetap ada untuk selamanya[a], dan tempat-tempat kediaman mereka turun-temurun; mereka menamai tanah-tanah dengan nama mereka sendiri.[b]
  to: Dalam batin mereka ada pikiran bahwa rumah mereka akan tetap ada untuk selamanya[a], tempat tinggal mereka turun-temurun; mereka menamai tanah menurut nama mereka sendiri.[b]
  rationale: Revisi memperjelas bahwa dua klausa pertama mengungkapkan anggapan batin orang-orang tersebut, bukan pernyataan narator tentang rumah mereka. Diksi juga dilunakkan ke bahasa Indonesia modern yang lebih idiomatis. Catatan a tetap menjaga pembacaan alternatif “kubur,” sedangkan catatan b tetap mencatat bentuk harfiah yang janggal dan menjelaskan pengertiannya.
