base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/011.yaml
  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: id
  text: Dalam batin mereka ada pikiran bahwa rumah mereka akan tetap ada untuk selamanya[a], tempat tinggal mereka turun-temurun; mereka menamai tanah menurut nama mereka sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut pemahaman tekstual alternatif: “Kubur mereka adalah rumah mereka untuk selamanya, tempat tinggal mereka turun-temurun.”'
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “mereka memanggil dengan nama-nama mereka atas tanah-tanah.” Maksudnya ialah bahwa mereka menamai tanah atau wilayah milik menurut nama mereka sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  choice: Dalam hati mereka
  rationale: Secara harfiah menunjuk pada bagian batin mereka. Dalam klausa tanpa verba ini, ungkapan tersebut secara alami menyatakan pikiran atau keyakinan batin mereka, tanpa mengubah teks utama WLC menjadi bacaan alternatif 'kubur mereka'.
- source_word: בָּתֵּימוֹ
  choice: rumah-rumah mereka
  rationale: בַּיִת dalam bentuk jamak ini berarti rumah-rumah mereka dan sejajar dengan 'tempat-tempat kediaman mereka'.
- source_word: לְעוֹלָם
  choice: akan tetap ada untuk selamanya
  rationale: Ungkapan ini menyatakan kelanggengan. Kata-kata 'akan tetap ada' melengkapi klausa Ibrani yang tidak memiliki verba agar wajar dalam bahasa Indonesia.
- source_word: מִשְׁכְּנֹתָם
  choice: tempat-tempat kediaman mereka
  rationale: Pilihan ini mempertahankan arti umum sebagai tempat tinggal serta kesejajarannya dengan 'rumah-rumah mereka'.
- source_word: לְדֹר וָדֹר
  choice: turun-temurun
  rationale: Ini adalah padanan idiomatis dan ringkas bagi ungkapan yang secara harfiah berarti 'dari generasi ke generasi'.
- source_word: קָרְאוּ
  choice: mereka menamai
  rationale: Dalam konteks pemberian nama pada tanah atau milik, arti 'menamai' lebih alami dan tepat daripada sekadar 'memanggil'.
- source_word: בִשְׁמוֹתָם
  choice: dengan nama mereka sendiri
  rationale: Preposisi ב menunjukkan bahwa nama mereka dipakai untuk menamai tanah; kata 'sendiri' memperjelas sifat refleksif yang tersirat oleh konteks.
- source_word: עֲלֵי אֲדָמוֹת
  choice: tanah-tanah
  rationale: Bentuk jamak אֲדָמוֹת di sini menunjuk pada bidang-bidang tanah atau wilayah milik. 'Tanah-tanah' mempertahankan gambaran konkret dan bentuk jamaknya.
