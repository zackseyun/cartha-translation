  yaml_path: translation/ot/psalms/049/019.yaml
  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
translation:
  language: id
  text: Ia akan pergi kepada kaum leluhurnya[a]; mereka tidak akan pernah lagi melihat terang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani memuat pergeseran persona dan jumlah: verba pembuka tertulis sebagai orang kedua maskulin tunggal, “engkau akan pergi,” sedangkan verba berikutnya berbentuk orang ketiga jamak, “mereka akan melihat.” Konteks memungkinkan “ia” pada klausa pertama, tetapi bentuk Ibrani tetap memperlihatkan pergeseran sudut pandang.'
    reason: alternative_reading
  - marker: b
    text: “Melihat terang” adalah ungkapan Ibrani untuk mengalami kehidupan; di sini maksudnya mereka tidak akan lagi mengalami kehidupan di dunia ini.
    reason: cultural_note
lexical_decisions:
- source_word: תָּבוֹא
  choice: Ia akan pergi
  rationale: Bentuk tertulisnya secara morfologis adalah qal imperfek orang kedua maskulin tunggal, tetapi konteks melanjutkan nasib orang kaya dari ayat sebelumnya. Teks utama memakai orang ketiga agar alur wacananya wajar, sementara catatan kaki mempertahankan ketegangan bentuk Ibraninya.
- source_word: עַד דּוֹר
  choice: kepada angkatan
  rationale: עַד di sini menyatakan tujuan atau batas gerak, sedangkan דּוֹר secara harfiah berarti 'angkatan/generasi' dan dalam konteks menunjuk kepada kelompok para leluhur yang telah meninggal.
- source_word: אֲבוֹתָיו
  choice: leluhurnya
  rationale: Secara harfiah berarti 'bapa-bapanya', tetapi dalam konteks kematian, bahasa Indonesia modern secara alami memakai 'leluhur' untuk para pendahulu dalam garis keluarga.
- source_word: עַד נֵצַח לֹא
  choice: tidak akan pernah lagi
  rationale: Gabungan ungkapan ini dengan verba berikutnya menyatakan bahwa peristiwa itu tidak akan terulang untuk selamanya; 'tidak akan pernah lagi' menyampaikan daya ungkap tersebut secara alami.
- source_word: יִרְאוּ אוֹר
  choice: mereka ... melihat terang
  rationale: Verba יִרְאוּ berbentuk orang ketiga maskulin jamak dan dipertahankan sebagai 'mereka'. 'Melihat terang' menjaga citra Ibrani yang secara idiomatis berkaitan dengan mengalami kehidupan.
theological_decisions:
- issue: Pergeseran persona dan jumlah dalam ayat
  choice: Klausa pertama diterjemahkan dengan subjek tunggal orang ketiga ('Ia'), sedangkan klausa kedua mempertahankan bentuk jamak ('mereka').
  alternative: Bentuk pembuka dapat diterjemahkan secara morfologis sebagai 'Engkau akan pergi', atau kedua klausa dapat diseragamkan menjadi tunggal.
  rationale: תָּבוֹא tertulis sebagai orang kedua maskulin tunggal, sedangkan יִרְאוּ adalah orang ketiga maskulin jamak. Konteks mendukung acuan orang ketiga pada orang kaya, tetapi bentuk yang diwariskan memuat ketegangan persona/jumlah. Teks utama mengikuti alur konteks pada klausa pertama dan mempertahankan bentuk jamak pada klausa kedua; catatan kaki menjelaskan pergeseran itu tanpa meniadakannya.
- issue: Makna 'melihat terang'
  choice: Citra harfiah dipertahankan dalam teks utama.
  alternative: Maknanya dapat dijelaskan langsung sebagai 'kembali mengalami kehidupan di dunia ini'.
  rationale: Ungkapan Ibrani menghubungkan terang dengan kehidupan. Mempertahankan metaforanya menjaga daya puitis dan tidak mempersempit kemungkinan nuansa, sementara catatan kaki membantu pembaca memahami idiom tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Angkatan leluhurnya' mempertahankan unsur דּוֹר sekaligus menyampaikan bahwa orang itu bergabung dengan para pendahulunya yang telah mati. Semua penanda catatan kaki dicantumkan dalam teks utama.
