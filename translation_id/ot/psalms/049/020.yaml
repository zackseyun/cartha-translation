  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: id
  text: Manusia yang berada dalam kehormatan tetapi tidak memiliki pengertian sama seperti binatang yang binasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sama seperti binatang; manusia itu menjadi serupa dengan binatang-binatang itu,” jika verba terakhir dipahami bermakna “menjadi serupa” dan bukan “binasa”.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: Manusia
  rationale: Nomina tunggal ini dipakai secara umum dan bersifat pepatah; “manusia” alami dalam bahasa Indonesia dan mencakup umat manusia tanpa menghilangkan daya ungkapnya.
- source_word: בִּיקָר
  choice: yang terhormat
  rationale: Frasa ini menunjuk pada keadaan bermartabat, terhormat, atau berkedudukan tinggi. Bentuk ini menghasilkan kontras yang jelas dengan ketiadaan pengertian.
- source_word: וְלֹא יָבִין
  choice: tetapi tidak berpengertian
  rationale: Verba בין menyatakan pengertian atau daya membedakan. “Tetapi” mengungkapkan pertentangan kontekstual dengan kehormatan manusia.
- source_word: נִמְשַׁל
  choice: sama seperti
  rationale: Bentuk Nifal dari משל di sini menyatakan disamakan atau dibandingkan; “sama seperti” merupakan ungkapan Indonesia yang alami dan puitis.
- source_word: כַּבְּהֵמוֹת
  choice: binatang
  rationale: בְּהֵמוֹת di sini mengacu secara luas pada hewan, bukan hanya ternak. “Binatang” paling wajar dalam bahasa Indonesia modern.
- source_word: נִדְמוּ
  choice: yang binasa
  rationale: Dalam konteks refrein dan tema kefanaan mazmur ini, bentuk tersebut lazim dipahami sebagai kebinasaan. Kemungkinan makna “menjadi serupa” tetap dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna verba terakhir נִדְמוּ
  choice: Dipahami sebagai “binasa” dan menerangkan binatang.
  alternative: Dipahami sebagai “menjadi sama dengan mereka” atau “menyerupai mereka”.
  rationale: Bacaan “binasa” selaras dengan penekanan mazmur bahwa kehormatan manusia tidak dapat mencegah kematian. Karena bentuk Ibraninya dapat dianalisis sebagai pernyataan keserupaan, kemungkinan itu tidak dihapus, melainkan dicatat.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, bermartabat, dan bernuansa pepatah. Pengulangan bunyi serta struktur perbandingan dipertahankan sejauh alami dalam bahasa sasaran.
