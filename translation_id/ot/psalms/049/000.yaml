  language: id
  text: Untuk pemimpin musik[a]. Dari bani Korah[b]. Mazmur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kepada pemimpin musik.” Preposisi Ibrani dalam judul mazmur dapat diterjemahkan dengan kedua cara tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau “Untuk” atau “Oleh bani Korah.” Judul ini tampaknya menunjukkan hubungan dengan kelompok bani Korah, tanpa memastikan apakah yang dimaksud ialah kepengarangan, pelaksanaan, atau pengumpulan.
