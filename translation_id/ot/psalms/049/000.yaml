lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul-judul mazmur, istilah ini menunjuk kepada orang yang memimpin pelaksanaan musik atau nyanyian. Ungkapan ini alami dalam bahasa Indonesia dan preposisi ל diterjemahkan tanpa memastikan apakah maksudnya penyerahan atau peruntukan.
- source_word: לִבְנֵי
  choice: Dari bani
  rationale: Preposisi ל dalam judul mazmur dapat menyatakan hubungan, kepunyaan, peruntukan, atau atribusi. 'Dari bani Korah' mempertahankan hubungan umum itu tanpa secara tegas menetapkan kepengarangan.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah ini adalah penanda jenis nyanyian yang diiringi musik; 'mazmur' merupakan padanan baku dan tepat dalam bahasa Indonesia.
