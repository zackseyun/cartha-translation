  text: I will incline my ear to a proverb[c][b][a]; I will open my riddle with the lyre.
translation:
  language: id
  text: Aku akan mencondongkan telingaku kepada suatu peribahasa[a]; aku akan membuka teka-tekiku dengan lira[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perumpamaan” atau “perkataan hikmat.” Kata Ibrani מָשָׁל dapat merujuk pada peribahasa, perumpamaan, atau ungkapan hikmat.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada lira”; secara tradisional, “dengan kecapi.” Kata Ibrani כִּנּוֹר menunjuk pada alat musik petik sejenis lira.
    reason: lexical_alternative
  - marker: c
    text: Atau “ucapan gelapku” atau “enigmak(u).” Kata Ibrani חִידָה dapat berarti teka-teki atau ucapan yang penuh rahasia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַטֶּה
  choice: mencondongkan
  rationale: Bentuk Hifil dari נטה menyatakan tindakan mengarahkan atau mencondongkan. Bersama objek 'telingaku', pilihan ini mempertahankan gambaran Ibrani tentang menyimak dengan sengaja.
- source_word: לְמָשָׁל
  choice: kepada perkataan hikmat
  rationale: מָשָׁל dapat berarti peribahasa, perumpamaan, atau perkataan hikmat. Dalam konteks mazmur hikmat, 'perkataan hikmat' cukup luas untuk menjaga rentang maknanya dan terdengar alami dalam bahasa Indonesia.
- source_word: אָזְנִי
  choice: telingaku
  rationale: Bentuk Ibrani tunggal dengan akhiran orang pertama tunggal dipertahankan secara langsung.
- source_word: אֶפְתַּח
  choice: mengungkapkan
  rationale: פתח secara harfiah berarti 'membuka'. Dalam bahasa Indonesia, 'mengungkapkan' secara alami membawa metafora membuka sesuatu yang tersembunyi tanpa membatasi maknanya menjadi sekadar menjelaskan.
- source_word: בְּכִנּוֹר
  choice: dengan kecapi
  rationale: כִּנּוֹר adalah alat musik petik sejenis lira. 'Kecapi' merupakan padanan Indonesia yang mudah dipahami, sedangkan catatan kaki menjelaskan jenis instrumennya dengan lebih tepat.
- source_word: חִידָתִי
  choice: teka-tekiku
  rationale: חִידָה menunjuk pada teka-teki atau perkataan penuh rahasia yang memerlukan pemahaman. 'Teka-teki' mempertahankan unsur enigmatisnya dalam bahasa Indonesia modern.
