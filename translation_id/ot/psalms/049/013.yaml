  yaml_path: translation/ot/psalms/049/013.yaml
  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
translation:
  language: id
  text: Inilah jalan mereka—kebodohan mereka; namun orang-orang yang datang sesudah mereka menyukai ucapan mereka.[a] Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “namun keturunan mereka menyukai apa yang mereka sendiri katakan.” Bahasa Ibrani tidak memastikan apakah “ucapan mereka” mengacu pada orang-orang terdahulu atau pada mereka yang datang kemudian.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶה דַרְכָּם
  choice: Inilah jalan mereka
  rationale: Ungkapan penunjuk ini merangkum cara hidup yang digambarkan sebelumnya. “Jalan” mempertahankan metafora Ibrani sekaligus makna etisnya.
- source_word: כֵּסֶל לָמוֹ
  choice: kebodohan mereka
  rationale: כֶּסֶל di sini paling wajar menyatakan kebodohan. Susunan Ibrani yang padat disampaikan sebagai aposisi agar alami dalam bahasa Indonesia tanpa menghilangkan penilaian pemazmur.
- source_word: וְאַחֲרֵיהֶם
  choice: namun orang-orang yang datang sesudah mereka
  rationale: Frasa ini dapat menunjuk kepada orang-orang yang hidup kemudian atau mengikuti teladan mereka, dan tidak harus dibatasi pada keturunan biologis. “Namun” menampilkan kontras ironis dalam konteks.
- source_word: בְּפִיהֶם יִרְצוּ
  choice: menyukai ucapan mereka
  rationale: Secara harfiah frasa ini memuat “mulut mereka” dan verba yang berarti berkenan, menyukai, atau menerima. “Ucapan mereka” mengungkapkan metonimia “mulut” secara wajar dalam bahasa Indonesia.
- source_word: סֶלָה
  choice: Sela
  rationale: Transliterasi tradisional dipertahankan karena fungsi tepat istilah liturgis atau musikal ini tidak pasti.
theological_decisions:
- issue: Acuan וְאַחֲרֵיהֶם dan pronomina dalam בְּפִיהֶם
  choice: Orang-orang yang datang sesudah mereka menyukai ucapan kelompok yang digambarkan sebelumnya.
  alternative: Keturunan atau para penerus mereka menyukai ucapan mereka sendiri.
  rationale: Bahasa Ibrani memungkinkan perbedaan acuan pronomina dan tidak memastikan bahwa kelompok kemudian adalah keturunan biologis. Teks utama mengikuti alur kritik terhadap orang yang meneruskan serta membenarkan cara hidup para pendahulunya, sedangkan kemungkinan lain dicatat tanpa menutup ambiguitas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda pisah mempertahankan kepadatan serta hubungan aposisional baris Ibrani; “ucapan” dipilih sebagai padanan alami bagi metonimia “mulut”.
