  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: id
  text: Mengapa aku harus takut pada hari-hari malapetaka, ketika kejahatan yang mengikuti langkahku[a] mengelilingi aku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ketika kejahatan tumitku mengelilingi aku.” Ungkapan Ibraninya tidak pasti; ini dapat berarti kejahatan yang mengikuti dari dekat, kejahatan orang-orang yang mengejar atau hendak menjatuhkan aku, atau kesalahanku sendiri yang terus mengikuti aku.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: Mengapa aku harus takut
  rationale: Pertanyaan retoris dengan bentuk imperfek paling alami diungkapkan demikian dalam bahasa Indonesia, tanpa menjadikannya sekadar pertanyaan tentang masa depan.
- source_word: בִּימֵי רָע
  choice: pada hari-hari malapetaka
  rationale: Kata רָע dapat menunjuk pada kejahatan maupun keadaan buruk atau bencana. Dalam konstruksi temporal ini, 'hari-hari malapetaka' menyampaikan masa kesusahan secara alami tanpa mempersempit penyebabnya.
- source_word: עֲוֹן
  choice: kejahatan
  rationale: עָוֹן mencakup perbuatan jahat, kesalahan, dan akibat kesalahan. 'Kejahatan' mempertahankan bobot moralnya dan cocok dengan sesuatu yang mengancam pemazmur.
- source_word: עֲקֵבַי
  choice: yang mengikuti langkahku
  rationale: Secara harfiah bentuk ini berarti 'tumit-tumitku', tetapi ungkapannya sulit dan mungkin menggambarkan kejahatan yang berada di tumit atau mengikuti dari dekat. Pilihan ini mempertahankan citra pengejaran tanpa secara pasti mengubahnya menjadi sebutan bagi para pengejar.
- source_word: יְסוּבֵּנִי
  choice: mengelilingi aku
  rationale: Bentuk dari סבב berarti mengelilingi atau mengepung; bentuk tunggalnya sesuai dengan subjek 'kejahatan'.
theological_decisions:
- issue: Makna ungkapan sulit עֲוֹן עֲקֵבַי
  choice: kejahatan yang mengikuti langkahku
  alternative: kejahatan para pengejarku; kesalahan pada tumitku; kesalahanku sendiri yang mengikuti aku
  rationale: Bahasa Ibrani secara harfiah menyebut 'kejahatan tumit-tumitku' dan tidak secara eksplisit mengatakan 'para pengejar'. Teks utama memakai ungkapan Indonesia yang tetap terbuka terhadap gambaran sesuatu yang mengikuti dari dekat, sedangkan catatan kaki mempertahankan kemungkinan harfiah dan tafsiran utama lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. 'Aku' dipertahankan sebagai suara pribadi pemazmur; susunan kalimat menjaga pertanyaan retoris dan ketegangan ungkapan Ibrani yang ambigu.
