lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Dengarlah
  rationale: Imperatif jamak ini menyerukan agar semua orang mendengar dengan sungguh-sungguh; bentuk -lah mempertahankan daya seru puitisnya.
- source_word: זֹאת
  choice: ini
  rationale: Kata penunjuk ini merujuk pada pengajaran atau pernyataan yang segera disampaikan pemazmur.
- source_word: כָּל הָעַמִּים
  choice: hai segala bangsa
  rationale: Bentuk jamak עַמִּים menunjuk pada berbagai kelompok manusia. 'Segala bangsa' merupakan ungkapan Indonesia yang alami dan mempertahankan cakupan universalnya.
- source_word: הַאֲזִינוּ
  choice: pasanglah telinga
  rationale: Imperatif ini meminta perhatian dalam mendengar. Ungkapan tersebut mempertahankan citra telinga dan paralelisme puitis dengan 'Dengarlah'.
- source_word: כָּל יֹשְׁבֵי
  choice: semua penghuni
  rationale: Konstruksi partisipial ini berarti semua orang yang tinggal atau berdiam di suatu tempat; 'semua penghuni' ringkas dan idiomatis.
- source_word: חָלֶד
  choice: dunia
  rationale: Dalam seruan universal ini, חָלֶד menunjuk pada ranah kehidupan manusia atau dunia yang didiami. 'Dunia' paling alami dalam konteks ini, sementara kemungkinan 'bumi' dicatat dalam catatan kaki.
