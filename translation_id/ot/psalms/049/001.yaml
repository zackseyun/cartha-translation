  yaml_path: translation/ot/psalms/049/001.yaml
  text: Hear this[a], all peoples; give ear, all inhabitants of the world,
translation:
  language: id
  text: 'Dengarlah ini, wahai semua bangsa;

    pasanglah telinga, wahai semua penghuni dunia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bumi.” Kata Ibrani חָלֶד dapat merujuk pada dunia tempat manusia hidup atau pada bumi.
