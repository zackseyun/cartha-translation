  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: id
  text: Sebab ia melihat bahwa orang-orang bijak pun mati; orang bodoh dan orang dungu sama-sama binasa, dan mereka meninggalkan kekayaan mereka kepada orang lain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memberi alasan atau penjelasan bagi perenungan sebelumnya.
- source_word: יִרְאֶה
  choice: ia melihat
  rationale: Bentuk orang ketiga tunggal dipertahankan; kala kini menyampaikan pengamatan yang bersifat umum.
- source_word: חֲכָמִים יָמוּתוּ
  choice: orang-orang bijak pun mati
  rationale: Bentuk jamak menunjuk golongan orang bijak. Partikel 'pun' secara alami menegaskan bahwa bahkan mereka mengalami nasib yang sama, sesuai alur konteks, tanpa mengubah proposisi dasarnya.
- source_word: יַחַד
  choice: sama-sama
  rationale: Dalam konteks ini menekankan kesamaan nasib, bukan keharusan bahwa kematian terjadi pada saat yang persis bersamaan.
- source_word: כְּסִיל
  choice: orang bodoh
  rationale: Istilah hikmat bagi orang yang bodoh secara nalar dan moral; 'orang bodoh' adalah padanan Indonesia yang langsung dan wajar.
- source_word: בַעַר
  choice: orang dungu
  rationale: Menggambarkan orang yang tidak berakal atau tumpul seperti binatang; 'orang dungu' menyampaikan ketumpulan tersebut dengan bahasa modern dan bermartabat.
- source_word: יֹאבֵדוּ
  choice: binasa
  rationale: Mempertahankan daya kata אבד yang menyatakan kebinasaan atau lenyapnya seseorang, lebih kuat daripada sekadar 'mati'.
- source_word: וְעָזְבוּ
  choice: lalu meninggalkan
  rationale: Menyatakan bahwa sesudah binasa mereka meninggalkan milik mereka; 'lalu' membuat urutan gagasan alami dalam bahasa Indonesia.
- source_word: לַאֲחֵרִים
  choice: kepada orang lain
  rationale: Mencerminkan bentuk jamak tak tentu tanpa mempersempit makna menjadi 'orang asing'.
- source_word: חֵילָם
  choice: kekayaan mereka
  rationale: Dalam konteks kematian dan harta yang ditinggalkan, חֵיל paling jelas berarti kekayaan atau sumber daya milik mereka.
theological_decisions:
- issue: Bentuk maskulin pada חֲכָמִים, כְּסִיל, dan בַעַר
  choice: orang-orang bijak ... orang bodoh dan orang dungu
  alternative: laki-laki bijak ... laki-laki bodoh dan laki-laki yang seperti binatang
  rationale: Bahasa Ibrani memakai bentuk maskulin sebagai tipe manusia yang representatif. Bahasa Indonesia tidak menandai gender pada kata-kata ini, sehingga penambahan 'laki-laki' akan mempersempit cakupan yang tidak dituntut konteks.
- issue: Hubungan יַחַד dengan kedua tipe orang
  choice: orang bodoh dan orang dungu sama-sama binasa
  alternative: orang bodoh dan orang dungu binasa bersama-sama
  rationale: '''Sama-sama'' menjaga tekanan pada nasib yang setara dan menghindari kesan bahwa mereka harus binasa serentak.'
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Struktur puitis Ibrani dipertahankan melalui kesejajaran 'mati' dan 'binasa', dengan susunan yang tetap mudah dipahami pembaca umum.
