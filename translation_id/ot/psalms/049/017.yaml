  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[c][b][a]; his glory will not go down after him.
translation:
  language: id
  text: Sebab pada saat ia mati, ia tidak akan membawa apa pun[a]; kemuliaannya[b] tidak akan turun menyusulnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia tidak akan membawa satu pun darinya”; secara harfiah: “ia tidak akan mengambil seluruhnya/semuanya.”'
    reason: lexical_alternative
  - marker: b
    text: “Kemuliaannya” juga dapat berarti kehormatan, semarak, kekayaan, atau kedudukannya.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “turun menyusulnya” kemungkinan merujuk pada kematian, kubur, atau dunia orang mati, tetapi bahasa Ibrani tidak menyebutkan tujuannya secara eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau penjelasan bagi perenungan sebelumnya dan sesuai dengan alur argumentasi mazmur.
- source_word: בְמוֹתוֹ
  choice: pada saat ia mati
  rationale: Preposisi ב pada kata 'kematian' dengan sufiks orang ketiga maskulin tunggal berfungsi temporal; ungkapan ini alami dalam bahasa Indonesia.
- source_word: יִקַּח הַכֹּל
  choice: ia tidak akan membawa apa pun
  rationale: Secara harfiah berbunyi 'ia tidak akan mengambil seluruhnya/semuanya'; dalam konteks kematian dan harta benda, 'membawa apa pun' menyampaikan maksud secara wajar tanpa menyiratkan bahwa seseorang biasanya membawa semuanya.
- source_word: יֵרֵד
  choice: akan turun
  rationale: Mempertahankan gambaran konkret verba ירד tanpa menentukan tujuan penurunan yang tidak disebutkan dalam bahasa Ibrani.
- source_word: אַחֲרָיו
  choice: mengikutinya
  rationale: Dalam konteks ini, maknanya ialah kemuliaan itu tidak pergi turun sesudah atau mengikuti orang tersebut ketika ia mati.
- source_word: כְּבוֹדוֹ
  choice: kemuliaannya
  rationale: Menjaga keluasan makna כבוד, yang dapat mencakup kehormatan, semarak, kekayaan, dan status duniawi.
theological_decisions:
- issue: Tujuan penurunan sesudah kematian
  choice: Mempertahankan gambaran 'turun' tanpa menyebut dunia orang mati atau kubur dalam teks utama.
  alternative: Kemuliaannya tidak akan turun bersamanya ke dunia orang mati / tidak akan mengikutinya ke kubur.
  rationale: Bahasa Ibrani membangkitkan gambaran kematian, penguburan, atau dunia orang mati, tetapi tidak menyatakan tujuannya secara eksplisit. Terjemahan tidak menambahkan kepastian teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang bermartabat namun mudah dipahami. Susunan klausa dan citra 'turun' dipertahankan, sedangkan ungkapan kepemilikan dibuat idiomatis dalam konteks kematian.
