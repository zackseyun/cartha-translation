  text: My mouth will speak wisdom[a], and the meditation of my heart will be understanding.
translation:
  language: id
  text: Mulutku akan mengucapkan hikmat, dan renungan hatiku akan mengungkapkan pengertian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, kata yang diterjemahkan “hikmat” dan “pengertian” berbentuk jamak, tetapi kemungkinan berfungsi sebagai kata benda abstrak.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Mulutku
  rationale: Mempertahankan gambaran konkret Ibrani tentang perkataan yang keluar dari mulut; ungkapan ini alami dalam bahasa Indonesia.
- source_word: יְדַבֵּר
  choice: akan mengucapkan
  rationale: Bentuk imperfek menyatakan niat atau pernyataan yang berorientasi ke depan. 'Mengucapkan' berpadu alami dengan subjek 'mulutku'.
- source_word: חָכְמוֹת
  choice: hikmat
  rationale: Walaupun berbentuk jamak, kata ini kemungkinan merupakan jamak abstrak; bentuk tunggal 'hikmat' paling alami dan mempertahankan istilah khas sastra hikmat.
- source_word: הָגוּת
  choice: renungan
  rationale: Menunjuk pada kegiatan batin berupa perenungan atau pemikiran mendalam. 'Renungan' alami serta mempertahankan kaitannya dengan hati sebagai pusat pikiran batin.
- source_word: לִבִּי
  choice: hatiku
  rationale: Mempertahankan metafora Ibrani tentang hati sebagai pusat pikiran dan pertimbangan batin.
- source_word: תְבוּנוֹת
  choice: pengertian
  rationale: Bentuk jamaknya kemungkinan berfungsi sebagai nomina abstrak. 'Pengertian' menyampaikan kemampuan memahami dan menjaga kesejajaran dengan 'hikmat'.
theological_decisions:
- issue: Hubungan sintaksis antara 'renungan hatiku' dan 'pengertian'
  choice: akan menghasilkan pengertian
  alternative: adalah pengertian
  rationale: Teks Ibrani tidak memiliki verba eksplisit pada bagian kedua. 'Akan menghasilkan' membuat kesejajaran verbal dengan bagian pertama dapat dipahami dalam bahasa Indonesia tanpa mengubahnya menjadi definisi ontologis yang tegas; namun elipsis aslinya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran puisi dipertahankan, sementara elipsis pada baris kedua dilengkapi secara wajar agar jelas bagi pembaca umum.
