  text: הַ/יָּ֣ם רָ֭אָה וַ/יָּנֹ֑ס הַ֝/יַּרְדֵּ֗ן יִסֹּ֥ב לְ/אָחֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/003.yaml
  text: The sea saw and fled[b][a]; the Jordan turned back.
translation:
  language: id
  text: Laut melihat lalu melarikan diri;[a] Sungai Yordan berbalik arah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini secara puitis mengacu pada terbelahnya laut ketika Israel keluar dari Mesir dan pada terhentinya aliran Sungai Yordan pada zaman Yosua.
    reason: cross_reference
  - marker: b
    text: Atau “berbalik mundur.” Ungkapan Ibraninya secara harfiah berarti “berbalik ke belakang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: Laut
  rationale: Nomina tentu yang berarti ‘laut’. Tidak diperjelas menjadi ‘Laut Merah’ karena teks Ibrani sendiri tidak menyebutkannya.
- source_word: רָאָה
  choice: melihat
  rationale: Padanan langsung yang mempertahankan personifikasi puitis serta objek yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: וַיָּנֹס
  choice: lalu melarikan diri
  rationale: Verba נוס berarti ‘melarikan diri’. Ungkapan ini mempertahankan gambaran yang hidup tentang laut yang berlaku seperti makhluk bernyawa.
- source_word: הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama sungai ini dinyatakan secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: יִסֹּב
  choice: berbalik
  rationale: Dalam konteks ini סבב menyatakan gerakan berbalik atau kembali ke arah semula.
- source_word: לְאָחוֹר
  choice: ke belakang
  rationale: Menerjemahkan secara eksplisit ungkapan arah yang secara harfiah berarti ‘ke belakang’.
theological_decisions:
- issue: Kiasan historis-puitis
  choice: Mempertahankan personifikasi laut dan Sungai Yordan tanpa menyebut peristiwa Keluaran dan penyeberangan Yordan secara eksplisit dalam teks utama.
  alternative: Laut melihatnya lalu melarikan diri; Sungai Yordan berbalik.
  rationale: Objek verba ‘melihat’ tidak dinyatakan dalam ayat Ibrani. Menambahkan ‘-nya’, ‘itu’, atau ‘Dia’ akan menutup ambiguitas yang sengaja dibiarkan oleh puisi dan konteksnya.
translation_notes:
  register: Bahasa puitis yang ringkas, modern, dan bermartabat. Susunan paralel dipertahankan, demikian pula personifikasi alam. Penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskan.
