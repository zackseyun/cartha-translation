  text: בְּ/צֵ֣את יִ֭שְׂרָאֵל מִ/מִּצְרָ֑יִם בֵּ֥ית יַ֝עֲקֹ֗ב מֵ/עַ֥ם לֹעֵֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/001.yaml
  text: When Israel went out from Egypt[a], the house of Jacob from a people of strange speech,
translation:
  language: id
  text: 'Ketika Israel keluar dari Mesir,

    keturunan Yakub keluar dari bangsa yang berbahasa asing.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari bangsa yang bahasanya asing bagi mereka.” Bahasa Ibrani menggambarkan bangsa itu sebagai penutur bahasa yang asing atau tidak dipahami oleh Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/צֵאת
  choice: Ketika ... keluar
  rationale: Preposisi ב dengan infinitif konstruk יצא membentuk anak kalimat temporal. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna waktunya.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bentuk baku nama bangsa dan umat perjanjian itu dalam bahasa Indonesia.
- source_word: מִ/מִּצְרָיִם
  choice: dari Mesir
  rationale: Preposisi מן menunjukkan asal atau pemisahan; 'dari Mesir' ringkas dan alami setelah verba 'keluar'.
- source_word: בֵּית יַעֲקֹב
  choice: kaum keturunan Yakub
  rationale: Ungkapan Ibrani ini menunjuk kepada umat yang berasal dari Yakub. 'Kaum keturunan Yakub' menyampaikan maknanya dengan jelas dan tetap mempertahankan corak puitis.
- source_word: מֵ/עַם
  choice: meninggalkan bangsa
  rationale: Preposisi מן kembali menunjukkan pemisahan. Verba 'meninggalkan' dinyatakan pada baris kedua agar hubungan sintaksisnya jelas dan alami dalam bahasa Indonesia.
- source_word: לֹעֵז
  choice: yang berbahasa asing
  rationale: Istilah ini menggambarkan orang yang memakai bahasa asing atau tidak dapat dipahami dari sudut pandang Israel. Pilihan ini mempertahankan unsur kebahasaan tanpa memberi nada penghinaan etnis.
theological_decisions:
- issue: Hubungan kedua baris paralel
  choice: 'Baris kedua dipertahankan sebagai pengungkapan ulang secara paralel: ''kaum keturunan Yakub'' sejajar dengan ''Israel'', dan ''meninggalkan bangsa yang berbahasa asing'' sejajar dengan ''keluar dari Mesir''.'
  alternative: Memperlakukan baris kedua hanya sebagai aposisi dan mempertahankan elipsis verba secara ketat.
  rationale: Puisi Ibrani lazim memakai paralelisme sinonim. Penambahan verba 'meninggalkan' membuat hubungan yang tersirat dalam bahasa Ibrani jelas dalam bahasa Indonesia tanpa mengubah isinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan dua baris mempertahankan paralelisme Ibrani, sedangkan 'kaum keturunan Yakub' dipilih agar idiom בֵּית יַעֲקֹב mudah dipahami pembaca umum.
