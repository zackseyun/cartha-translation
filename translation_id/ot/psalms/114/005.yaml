lexical_decisions:
- source_word: מַה לְּךָ
  choice: Ada apa denganmu
  rationale: Ungkapan Ibrani ini secara harfiah berarti 'apa denganmu' dan menyampaikan pertanyaan retoris bernada heran. 'Ada apa denganmu' mempertahankan sapaan langsung dan wajar dalam bahasa Indonesia modern.
- source_word: הַיָּם
  choice: hai laut
  rationale: Nomina ini berarti 'laut'. Partikel 'hai' menandai sapaan langsung dan mempertahankan personifikasi puitis.
- source_word: כִּי
  choice: sehingga
  rationale: Di sini כִּי menghubungkan pertanyaan retoris dengan tindakan yang mengherankan. 'Sehingga' menghasilkan konstruksi Indonesia yang alami tanpa mereduksinya menjadi pertanyaan sebab sederhana 'mengapa'.
- source_word: תָנוּס
  choice: engkau melarikan diri
  rationale: Bentuk dari נוּס berarti 'melarikan diri'. Pilihan ini langsung dan mempertahankan personifikasi laut.
- source_word: הַיַּרְדֵּן
  choice: Hai Yordan
  rationale: Nama diri Yordan diperlakukan sebagai sapaan langsung, sejajar dengan sapaan kepada laut.
- source_word: תִּסֹּב
  choice: engkau berbalik
  rationale: Dalam konteks ini verba tersebut menyatakan perubahan arah atau berbalik. Terjemahan ini ringkas dan sesuai dengan paralelisme ayat.
- source_word: לְאָחוֹר
  choice: ke belakang
  rationale: Adverbia ini berarti 'ke belakang' atau 'mundur'; bentuk eksplisit ini menjaga gambaran arah dalam teks Ibrani.
