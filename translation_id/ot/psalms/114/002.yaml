source:
  edition: WLC
  text: הָיְתָ֣ה יְהוּדָ֣ה לְ/קָדְשׁ֑/וֹ יִ֝שְׂרָאֵ֗ל מַמְשְׁלוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/002.yaml
  text: Judah became his sanctuary[c][b][a], Israel his dominion.
translation:
  language: id
  text: Yehuda menjadi tempat kudus-Nya[a][b], Israel wilayah kekuasaan-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “adalah tempat kudus-Nya.” Kata kerja Ibrani dapat menyatakan keadaan (“adalah”) atau peralihan (“menjadi”).
    reason: lexical_alternative
  - marker: b
    text: Atau “kekudusan-Nya.” Istilah Ibrani dapat berarti kekudusan atau tempat yang kudus; di sini makna konkret cocok dengan kesejajarannya dengan “wilayah kekuasaan-Nya.”
    reason: lexical_alternative
  - marker: c
    text: Atau “pemerintahan-Nya” atau “kekuasaan-Nya.” Kata benda Ibrani berbentuk jamak, tetapi di sini kemungkinan menyatakan gagasan abstrak atau keluasan ranah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: menjadi
  rationale: 'Dalam rangkaian historis mazmur ini, kata kerja היה paling wajar menyatakan peralihan atau hasil: ketika Israel keluar dari Mesir, Yehuda menjadi tempat kudus Allah. Namun, arti statif “adalah” tetap mungkin dan dicatat dalam catatan kaki.'
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama baku dalam bahasa Indonesia bagi suku atau wilayah Yehuda.
- source_word: לְקָדְשׁוֹ
  choice: tempat kudus-Nya
  rationale: קֹדֶשׁ dapat menunjuk pada kekudusan atau pada tempat yang kudus. Makna konkret “tempat kudus” sesuai dengan kesejajaran puitisnya dengan wilayah kekuasaan Allah.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama baku bagi umat atau bangsa Israel; dipertahankan tersendiri agar kesejajaran Yehuda–Israel tidak diratakan.
- source_word: מַמְשְׁלוֹתָיו
  choice: wilayah kekuasaan-Nya
  rationale: Kata benda dari משל dapat berarti pemerintahan, kekuasaan, atau ranah tempat kekuasaan dijalankan. Walaupun bentuk Ibraninya jamak, di sini bentuk itu kemungkinan menyatakan gagasan abstrak atau keluasan ranah; bentuk tunggal alami dalam bahasa Indonesia dan selaras dengan “tempat kudus-Nya”.
theological_decisions:
- issue: Acuan akhiran orang ketiga maskulin tunggal dalam “tempat kudus-Nya” dan “wilayah kekuasaan-Nya”
  choice: Akhiran “-Nya” mengacu kepada Allah/TUHAN.
  alternative: Acuannya dapat dibiarkan tersirat dan dipahami hanya dari konteks mazmur.
  rationale: Dalam konteks keluarnya Israel dari Mesir, kedua akhiran kepunyaan itu secara alami mengacu kepada Allah Israel. Bahasa Indonesia memerlukan bentuk kepunyaan yang nyata; “-Nya” mempertahankan keringkasan bahasa Ibrani tanpa menambahkan nama ilahi ke dalam ayat.
- issue: Kesejajaran Yehuda dan Israel
  choice: Kedua nama dipertahankan secara terpisah.
  alternative: Keduanya dapat dilebur menjadi satu sebutan kolektif, misalnya umat atau kerajaan Allah.
  rationale: Puisi Ibrani dengan sengaja menyejajarkan Yehuda dan Israel. Mempertahankan keduanya menjaga bentuk sastra dan menghindari pemasukan tafsir teologis tertentu mengenai hubungan kedua nama itu.
translation_notes:
  register: Bahasa Indonesia modern, baku, ringkas, dan puitis. “Tempat kudus” serta “wilayah kekuasaan” mudah dipahami pembaca umum sekaligus mempertahankan kesejajaran konkret-abstrak dalam teks Ibrani. Huruf kapital pada “-Nya” mengikuti kebiasaan ejaan religius bahasa Indonesia untuk acuan kepada Allah.
