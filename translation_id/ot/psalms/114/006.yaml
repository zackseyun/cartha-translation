  text: הֶֽ֭/הָרִים תִּרְקְד֣וּ כְ/אֵילִ֑ים גְּ֝בָע֗וֹת כִּ/בְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/006.yaml
  text: O mountains[a], why do you skip like rams, O hills[b], like lambs of the flock?
translation:
  language: id
  text: Hai gunung-gunung, mengapa kalian melompat-lompat[a] seperti domba-domba jantan, hai bukit-bukit, seperti anak-anak domba[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat diterjemahkan “melonjak-lonjak” atau “menari-nari.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak kawanan,” suatu ungkapan untuk domba-domba muda atau anak-anak domba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: Hai gunung-gunung
  rationale: Nomina ini berarti “gunung-gunung” dan dalam konteksnya merupakan sapaan puitis yang melanjutkan pertanyaan pada ayat sebelumnya. “Hai” menyatakan fungsi vokatif secara wajar dalam bahasa Indonesia.
- source_word: תִּרְקְדוּ
  choice: kalian melompat-lompat
  rationale: Kata kerja רָקַד dapat berarti melompat-lompat, melonjak, atau menari. “Melompat-lompat” mempertahankan gerak lincah yang sesuai dengan perbandingan kepada domba.
- source_word: כְאֵילִים
  choice: seperti domba-domba jantan
  rationale: אֵילִים dalam konteks kawanan paling langsung menunjuk kepada domba jantan. Bentuk ulang menyampaikan makna jamak secara jelas dan alami.
- source_word: גְּבָעוֹת
  choice: hai bukit-bukit
  rationale: Nomina ini berarti “bukit-bukit.” Penambahan “hai” mempertahankan sapaan puitis yang sejajar dengan gunung-gunung.
- source_word: כִּבְנֵי צֹאן
  choice: seperti anak-anak domba
  rationale: Secara harfiah ungkapan ini berarti “seperti anak-anak kawanan,” yaitu domba-domba muda atau anak-anak domba. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan citra kawanan domba melalui konteks baris.
theological_decisions: []
