  register: Bahasa puitis modern dan bermartabat. Kata ganti “kalian” dipakai karena gunung-gunung disapa dalam bentuk jamak. Pertanyaan “mengapa” diteruskan dari ayat sebelumnya agar hubungan sintaksis dan sapaan retorisnya jelas dalam bahasa Indonesia.
