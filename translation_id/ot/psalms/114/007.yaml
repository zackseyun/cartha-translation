  text: מִ/לִּ/פְנֵ֣י אָ֭דוֹן ח֣וּלִי אָ֑רֶץ מִ֝/לִּ/פְנֵ֗י אֱל֣וֹהַּ יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/007.yaml
  text: Tremble[a], O earth, before the Lord, before the God of Jacob,
translation:
  language: id
  text: Gemetarlah[a], hai bumi, di hadapan Tuhan, di hadapan Allah Yakub!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Menggeliatlah, hai bumi,” untuk mempertahankan gambaran yang lebih kuat tentang guncangan seperti kejang dalam kata kerja Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini secara harfiah menunjuk pada muka atau kehadiran seseorang. “Di hadapan” alami dalam bahasa Indonesia dan menyampaikan bahwa bumi gemetar karena berada dalam kehadiran-Nya.
- source_word: אָדוֹן
  choice: Tuhan
  rationale: Kata Ibrani ini berarti “tuan/penguasa” dan di sini menjadi gelar bagi Allah Israel. “Tuhan” mempertahankan gelar tersebut tanpa menyamakannya dengan nama ilahi YHWH, yang lazim ditulis “TUHAN”.
- source_word: חוּלִי
  choice: Gemetarlah
  rationale: Bentuk perintah feminin tunggal ini ditujukan langsung kepada bumi. Kata kerjanya dapat menggambarkan gemetar, menggeliat, atau guncangan hebat; “Gemetarlah” paling alami sebagai seruan puitis sambil tetap menyampaikan keguncangan.
- source_word: אָרֶץ
  choice: hai bumi
  rationale: Walaupun dapat berarti “negeri,” cakupan puitis mazmur dan sapaan langsung mendukung “bumi.” Partikel “hai” menandai sapaan dengan jelas dalam bahasa Indonesia.
- source_word: אֱלוֹהַּ יַעֲקֹב
  choice: Allah Yakub
  rationale: Frasa konstruksi ini mengidentifikasi Allah yang berelasi dengan Yakub. “Allah Yakub” merupakan bentuk Indonesia yang ringkas, alami, dan setia pada susunan sumber.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Membedakan אָדוֹן dari nama ilahi YHWH
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Ibrani memakai gelar אָדוֹן, bukan nama יְהוָה. Karena itu, “Tuhan” mempertahankan gelar yang benar, sedangkan “TUHAN” dapat keliru menyiratkan bahwa nama YHWH terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan “di hadapan” dipertahankan untuk mencerminkan paralelisme Ibrani; tanda seru menegaskan bentuk seruan imperatif.
