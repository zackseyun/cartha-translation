lexical_decisions:
- source_word: הַהֹפְכִי
  choice: yang mengubah
  rationale: Partisipel Hifil dari הפך meneruskan subjek ilahi yang tersirat dari ayat sebelumnya. Bentuk Indonesia “yang mengubah” mempertahankan daya relatif-partisipial serta dapat merujuk pada tindakan yang dikenang tanpa memaksakan penandaan waktu yang tidak terdapat dalam bahasa Ibrani.
- source_word: הַצּוּר
  choice: gunung batu
  rationale: צוּר menunjuk pada batu besar atau massa batuan. “Gunung batu” merupakan ungkapan Indonesia yang wajar untuk massa batu yang besar dan membedakannya dari חַלָּמִישׁ pada baris sejajar.
- source_word: אֲגַם מָיִם
  choice: kolam air
  rationale: אֲגַם menunjuk pada badan air yang tenang. “Kolam air” mempertahankan penyebutan מָיִם dan sesuai dengan gambaran puitis.
- source_word: חַלָּמִישׁ
  choice: batu keras
  rationale: חַלָּמִישׁ dapat berarti batu api atau batu yang sangat keras. “Batu keras” alami bagi pembaca Indonesia dan mempertahankan penekanan pada kerasnya batu tanpa memberi kesan benda kecil untuk menyalakan api.
- source_word: לְמַעְיְנוֹ מָיִם
  choice: menjadi mata air
  rationale: מַעְיָן berarti mata air; prefiks לְ menandai hasil perubahan, sejajar dengan klausa pertama. Bentuk tunggal dipertahankan.
theological_decisions:
- issue: Subjek ilahi tersirat yang diteruskan dari ayat sebelumnya
  choice: Mempertahankan klausa relatif “yang mengubah” tanpa mengulang “Allah”
  alternative: “Ia mengubah gunung batu menjadi kolam air …”
  rationale: Bahasa Ibrani melanjutkan keterangan tentang Allah Yakub dalam ayat 7. Klausa relatif mempertahankan hubungan puitis dan struktur sumber tanpa menambahkan subjek eksplisit.
- issue: Aspek partisipel הַהֹפְכִי
  choice: “yang mengubah” dengan bentuk waktu yang tidak ditandai
  alternative: “yang telah mengubah” atau “yang menjadikan”
  rationale: Partisipel Ibrani dapat menggambarkan tindakan khas maupun tindakan masa lampau yang sedang dikenang. Bahasa Indonesia tidak wajib menandai kala, sehingga ambiguitas sumber dapat dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Paralelisme dua bagian dipertahankan; “gunung batu” dan “batu keras” membedakan kedua istilah Ibrani, sedangkan pengulangan “air” menjaga gema bunyi dan makna sumber.
