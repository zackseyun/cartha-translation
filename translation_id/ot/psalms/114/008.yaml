  text: yang mengubah batu menjadi kolam air[a], batu yang keras menjadi mata air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang telah mengubah batu menjadi kolam air.” Bahasa Ibrani memakai bentuk partisipel; dalam konteks mazmur ini, bentuk itu juga dapat dipahami sebagai mengenang perbuatan Allah di padang gurun.'
