  text: הֶֽ֭/הָרִים רָקְד֣וּ כְ/אֵילִ֑ים גְּ֝בָע֗וֹת כִּ/בְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/004.yaml
  text: The mountains skipped like rams[a], the hills like lambs of the flock.
translation:
  language: id
  text: 'Gunung-gunung melompat-lompat seperti domba jantan,

    bukit-bukit seperti anak-anak domba.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “seperti anak-anak kawanan,” yaitu domba-domba muda atau anak-anak domba.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak dengan artikel menunjuk pada gunung-gunung dalam gambaran ini; dalam bahasa Indonesia, penyebutan jamak sudah wajar tanpa padanan artikel tertentu.
- source_word: רָקְדוּ
  choice: melompat-lompat
  rationale: Kata kerja ini menggambarkan gerakan melonjak atau menari dengan lincah. 'Melompat-lompat' selaras dengan perbandingan terhadap domba dan mempertahankan personifikasi puitis.
- source_word: כְאֵילִים
  choice: seperti domba jantan
  rationale: אֵילִים dalam konteks kawanan merujuk pada domba jantan dewasa. Pilihan ini tepat secara leksikal dan mudah dipahami.
- source_word: גְּבָעוֹת
  choice: bukit-bukit
  rationale: Bentuk jamak diterjemahkan secara alami sebagai 'bukit-bukit' dan mempertahankan kesejajaran dengan 'gunung-gunung'.
- source_word: כִּבְנֵי צֹאן
  choice: seperti anak-anak domba
  rationale: Secara harfiah ungkapan ini berarti 'seperti anak-anak kawanan', yakni hewan-hewan muda dari kawanan domba. 'Anak-anak domba' menyampaikan maksud idiomatisnya secara alami sambil mempertahankan gambaran Ibrani; nuansa harfiahnya dicatat dalam catatan kaki.
