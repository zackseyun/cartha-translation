base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: id
  text: 'Nyatakanlah mereka bersalah, ya Allah;

    biarlah mereka jatuh oleh rencana mereka sendiri.[a]

    Usirlah mereka[b] karena banyaknya pelanggaran mereka,

    sebab mereka telah memberontak terhadap-Mu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara harfiah: “biarlah mereka jatuh dari rencana-rencana mereka”; yakni, biarlah rencana mereka sendiri gagal dan mendatangkan kehancuran.'
    reason: lexical_alternative
  - marker: b
    text: “Usirlah” juga dapat diterjemahkan “buanglah” atau “singkirkanlah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: Nyatakanlah mereka bersalah
  rationale: Bentuk imperatif hifil dengan akhiran orang ketiga jamak meminta Allah menyatakan atau memperlakukan mereka sebagai pihak yang bersalah. Pilihan ini mempertahankan nuansa hukum tanpa menentukan bentuk hukuman selanjutnya.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Sapaan langsung dalam doa diterjemahkan dengan bentuk vokatif yang alami dan khidmat dalam bahasa Indonesia.
- source_word: יִפְּלוּ
  choice: biarlah mereka jatuh
  rationale: Bentuk imperfek yang berfungsi seperti jusif menyampaikan permohonan agar penghakiman terjadi, bukan sekadar ramalan.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: oleh rencana mereka sendiri
  rationale: Kata benda ini menunjuk pada rencana atau siasat, sedangkan preposisi מִן dapat menyatakan sarana, sebab, atau gerak menjauh. Teks utama mengungkapkan ironi bahwa rencana mereka sendiri menjadi penyebab kejatuhan mereka; alternatif yang mempertahankan arti 'dari' dicatat dalam catatan kaki.
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: karena banyaknya pelanggaran mereka
  rationale: Preposisi בְּ bersama רֹב paling wajar dipahami secara kausal di sini. פֶּשַׁע mengandung gagasan pelanggaran dan pemberontakan; 'pelanggaran' mempertahankan bobot moral sekaligus menghindari pengulangan dengan klausa terakhir.
- source_word: הַדִּיחֵמוֹ
  choice: Usirlah mereka
  rationale: Imperatif hifil dari נדח berarti menyebabkan seseorang terusir, tersingkir, atau dibuang. 'Usirlah' ringkas, kuat, dan alami dalam konteks permohonan penghakiman.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan dasar bagi permohonan sebelumnya.
- source_word: מָרוּ בָךְ
  choice: mereka telah memberontak terhadap-Mu
  rationale: מרה dengan בְּ menyatakan pemberontakan terhadap seseorang. Terjemahan ini langsung dan mempertahankan dimensi relasional serta teologis dari pelanggaran mereka.
theological_decisions:
- issue: Bahasa doa yang memohon penghakiman
  choice: Mempertahankan permohonan langsung agar Allah menyatakan mereka bersalah, menjatuhkan mereka, dan mengusir mereka.
  alternative: Mengubah rangkaian itu menjadi ramalan tentang apa yang akan terjadi kepada mereka atau melunakkannya menjadi permohonan umum akan keadilan.
  rationale: Bahasa Ibrani memakai imperatif dan bentuk menyerupai jusif dalam sapaan langsung kepada Allah. Mempertahankan bentuk permohonan mencerminkan makna tekstual dan tidak menghilangkan ketegangan teologis mazmur ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan register doa yang khidmat dan lugas. Pemenggalan baris mempertahankan kesejajaran puisi. Bentuk “terhadap-Mu” menandai sapaan langsung kepada Allah tanpa menambah gelar atau tafsiran denominatif.
