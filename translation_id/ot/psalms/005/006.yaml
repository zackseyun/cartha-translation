  text: תְּאַבֵּד֮ דֹּבְרֵ֪י כָ֫זָ֥ב אִישׁ דָּמִ֥ים וּ/מִרְמָ֗ה יְתָ֘עֵ֥ב יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/006.yaml
  text: You destroy those who speak lies[b][a]; Yahweh abhors a man of bloodshed and deceit.
translation:
  language: id
  text: Engkau membinasakan orang-orang yang berkata dusta[a]; Yahweh membenci orang yang melakukan penumpahan darah dan tipu daya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau akan membinasakan orang-orang yang berkata dusta.” Kata kerja Ibraninya dapat dipahami sebagai tindakan mendatang atau sebagai pernyataan umum tentang tindakan Allah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang yang penuh darah dan tipu daya.” Ungkapan Ibrani ini menunjuk pada orang yang dicirikan oleh penumpahan darah dan kelicikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: Engkau membinasakan
  rationale: Bentuk Piel orang kedua maskulin tunggal menyatakan bahwa Allah menyebabkan kebinasaan. Bentuk kini cocok sebagai pernyataan umum dalam konteks ini, tetapi nuansa mendatang tetap mungkin dan dicatat dalam catatan kaki.
- source_word: דֹּבְרֵי כָזָב
  choice: orang-orang yang berkata dusta
  rationale: Mempertahankan unsur verbal dari frasa harfiah 'para penutur kepalsuan' dalam bahasa Indonesia yang alami.
- source_word: אִישׁ דָּמִים
  choice: orang yang melakukan penumpahan darah
  rationale: Idiom Ibrani harfiah 'orang darah-darah' menunjuk pada orang yang dicirikan oleh kekerasan atau pertumpahan darah; pilihan ini tidak mempersempit makna hanya kepada pembunuh.
- source_word: וּמִרְמָה
  choice: dan tipu daya
  rationale: מִרְמָה mencakup penipuan atau kelicikan; 'tipu daya' alami dan cukup luas dalam konteks puitis ini.
- source_word: יְתָעֵב
  choice: membenci
  rationale: Piel תעב menyatakan penolakan moral yang kuat. 'Membenci' jelas dan wajar bagi pembaca modern, sementara makna rasa jijik atau muak dicatat sebagai kemungkinan nuansa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Aspek waktu תְּאַבֵּד
  choice: Engkau membinasakan
  alternative: Engkau akan membinasakan
  rationale: Bentuk Ibrani dapat dipahami sebagai tindakan Allah yang berlaku umum atau sebagai tindakan mendatang. Teks utama memakai pernyataan umum tanpa meniadakan bacaan futuris.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama pribadi ilahi; transliterasi mempertahankan nama tersebut.
- issue: Idiom maskulin tunggal אִישׁ דָּמִים וּמִרְמָה
  choice: orang yang melakukan penumpahan darah dan tipu daya
  alternative: seorang lelaki penumpah darah dan penipu
  rationale: Dalam frasa idiomatis ini, אִישׁ membentuk gambaran tentang orang yang dicirikan oleh dua kejahatan. Bahasa Indonesia 'orang yang' mempertahankan bentuk tunggal dan sifat personal tanpa menghasilkan ungkapan yang kaku atau secara tak berdasar membatasi acuan kepada laki-laki biologis.
- issue: Intensitas יְתָעֵב
  choice: membenci
  alternative: merasa jijik terhadap
  rationale: '''Membenci'' menyampaikan penolakan moral yang kuat dengan bahasa Alkitabiah Indonesia yang alami; alternatif lebih menonjolkan nuansa rasa muak.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis yang lugas dan bermartabat. Sapaan 'Engkau' mempertahankan orang kedua tunggal kepada Allah. Paralelisme kedua klausa dijaga, dan penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
