source:
  edition: WLC
  text: יְֽהוָ֗ה בֹּ֭קֶר תִּשְׁמַ֣ע קוֹלִ֑/י בֹּ֥קֶר אֶֽעֱרָךְ לְ֝/ךָ֗ וַ/אֲצַפֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: id
  text: Yahweh, pada pagi hari Engkau mendengar suaraku; pada pagi hari aku menyampaikan permohonanku di hadapan-Mu[a] dan menanti dengan penuh harap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku menata bagi-Mu” atau “aku mengatur untuk-Mu.” Dalam konteks doa, ungkapan ini dapat berarti menyusun atau menyajikan doa/permohonan kepada Allah. Objeknya tidak disebutkan dalam teks Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan aku mengamati dengan penuh harap.” Kata Ibrani ini dapat berarti mengamati, menunggu, atau memandang ke depan dengan penuh harap.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: בֹּקֶר
  choice: pada pagi hari
  rationale: Nomina waktu ini berfungsi secara adverbial. Pengulangannya dipertahankan untuk menjaga penekanan puitis ayat.
- source_word: תִּשְׁמַע
  choice: Engkau mendengar
  rationale: Bentuk imperfek dapat menyatakan tindakan kini yang diyakini atau kebiasaan, bukan hanya masa depan. Bentuk kini mempertahankan keyakinan pemazmur tanpa mempersempitnya menjadi prediksi.
- source_word: קוֹלִי
  choice: suaraku
  rationale: Padanan langsung yang tidak memperkuat makna menjadi 'seruanku' tanpa keharusan dari konteks.
- source_word: אֶעֱרָךְ
  choice: aku menyampaikan permohonanku
  rationale: Secara leksikal berarti mengatur atau menata, tetapi objeknya tidak dinyatakan. Dalam konteks doa, ungkapan ini secara alami menunjuk pada penyajian doa atau permohonan; catatan kaki mempertahankan ungkapan yang lebih harfiah dan ketidakjelasan objeknya.
- source_word: לְךָ
  choice: di hadapan-Mu
  rationale: Secara formal berarti 'kepada-Mu' atau 'bagi-Mu'; bersama verba ערך, 'di hadapan-Mu' mengungkapkan tindakan menyajikan sesuatu di hadapan Allah secara wajar dalam bahasa Indonesia.
- source_word: וַאֲצַפֶּה
  choice: dan menanti dengan penuh harap
  rationale: Verba צפה mencakup mengamati, menunggu, atau memandang dengan harapan. Dalam konteks sesudah berdoa, pilihan ini menyampaikan penantian yang penuh pengharapan; nuansa 'mengamati' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama pribadi yang dinyatakan kepada Israel dan tidak menggantinya dengan sebuah gelar.
- issue: Objek tersirat dari אֶעֱרָךְ
  choice: permohonanku
  alternative: sesuatunya / doaku
  rationale: Objek verba tidak tertulis dalam bahasa Ibrani. Konteks sangat mungkin menunjuk pada doa atau permohonan pemazmur, tetapi catatan kaki menjaga keterbukaan bentuk sumber agar objek tersirat itu tidak dianggap eksplisit dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai kapital kehormatan. Kesejajaran melalui pengulangan 'pada pagi hari' dipertahankan, sedangkan dua ungkapan Ibrani yang padat dijelaskan tanpa menghilangkan alternatif leksikalnya.
