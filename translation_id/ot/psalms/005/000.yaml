base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/000.yaml
  text: 'For the choirmaster: according to the flutes[a]. A psalm of David[b].'
translation:
  language: id
  text: 'Untuk pemimpin musik: menurut permainan seruling[a]. Mazmur Daud[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “menurut alat-alat musik tiup”. Istilah Ibraninya mungkin merupakan petunjuk musik teknis dan secara tradisional juga dialihaksarakan sebagai “Nehilot”.
    reason: lexical_alternative
  - marker: b
    text: Judul “Mazmur Daud” dapat menunjukkan kepengarangan, persembahan, kepemilikan, atau kaitannya dengan kumpulan mazmur Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, bentuk ini menunjuk kepada orang yang bertanggung jawab memimpin atau mengarahkan penyajian musik. Ungkapan ini alami dalam bahasa Indonesia dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: אֶל
  choice: menurut
  rationale: Dalam petunjuk musik pada judul mazmur, kata ini dapat memperkenalkan cara, lagu, atau perangkat penyajian. 'Menurut' mempertahankan fungsi teknis itu tanpa memastikan hubungan yang lebih sempit.
- source_word: הַנְּחִילוֹת
  choice: permainan seruling
  rationale: Istilah teknis yang tidak pasti ini secara tradisional dipahami berkaitan dengan seruling atau alat musik tiup. 'Permainan seruling' menghasilkan petunjuk musik yang wajar, sementara ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah istilah baku untuk nyanyian ibadah yang kemungkinan disertai alat musik dan merupakan padanan yang mapan dalam konteks kitab Mazmur.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam frasa 'Mazmur Daud', susunan nomina bahasa Indonesia dapat mempertahankan cakupan makna lamed Ibrani—karya, milik, persembahan, atau kaitan dengan Daud—tanpa secara tegas menyatakan kepengarangan.
theological_decisions:
- issue: Hubungan Daud dengan mazmur
  choice: Mazmur Daud
  alternative: Mazmur karya Daud
  rationale: Bahasa sumber tidak harus semata-mata menyatakan kepengarangan. Bentuk yang dipilih mempertahankan kemungkinan kepengarangan, persembahan, kepemilikan, atau hubungan dengan kumpulan Daud.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. 'Pemimpin musik' dipilih karena mudah dipahami pembaca modern; 'Mazmur Daud' mengikuti bentuk judul yang alami sekaligus tidak menghilangkan ambiguitas bahasa Ibrani.
