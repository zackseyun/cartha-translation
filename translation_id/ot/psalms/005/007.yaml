  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: id
  text: Namun aku, oleh kelimpahan kasih setia-Mu, akan masuk ke rumah-Mu; aku akan sujud menghadap bait-Mu yang kudus dengan rasa takut kepada-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan hormat kepada-Mu” atau “dengan gentar kepada-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Konjungsi dan pronomina mandiri menandai kontras dengan orang-orang fasik pada ayat-ayat sebelumnya; ungkapan ini alami dan ringkas dalam bahasa Indonesia.
- source_word: בְּרֹב חַסְדְּךָ
  choice: karena kasih setia-Mu yang berlimpah
  rationale: ב dapat menyatakan dasar atau alasan, sedangkan חֶסֶד menunjuk pada kasih yang teguh dan setia. Susunan ini menyampaikan bahwa kasih setia Allah menjadi dasar pemazmur datang.
- source_word: אָבוֹא בֵיתֶךָ
  choice: akan masuk ke rumah-Mu
  rationale: Bentuk imperfek menyatakan tekad atau pengharapan, dan 'masuk ke' sesuai dengan gerak menuju rumah Allah sambil mempertahankan arti harfiah בַּיִת.
- source_word: אֶשְׁתַּחֲוֶה
  choice: aku akan sujud
  rationale: Kata kerja ini menggambarkan tindakan membungkuk atau merebahkan diri dalam penyembahan; 'sujud' mempertahankan unsur jasmaninya.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: menghadap bait-Mu yang kudus
  rationale: אֶל bersifat terarah, sedangkan הֵיכַל dalam konteks kediaman Allah berarti bait. 'Menghadap' alami untuk tindakan sujud ke arah tempat kudus.
- source_word: בְּיִרְאָתֶךָ
  choice: dengan takut akan Engkau
  rationale: Terjemahan ini mempertahankan bobot יִרְאָה sebagai rasa takut yang kudus, yang sekaligus mencakup hormat dan gentar.
theological_decisions:
- issue: Makna חֶסֶד sebagai dasar untuk mendekat kepada Allah
  choice: kasih setia-Mu yang berlimpah
  alternative: kesetiaan perjanjian-Mu yang berlimpah; belas kasihan-Mu yang besar
  rationale: '''Kasih setia'' mempertahankan dimensi kasih dan keteguhan tanpa mempersempit kata itu hanya pada belas kasihan atau menjadikan unsur perjanjian lebih eksplisit daripada teks.'
- issue: Nuansa יִרְאָה dalam ibadah
  choice: dengan takut akan Engkau
  alternative: dengan hormat kepada-Mu; dengan gentar akan Engkau
  rationale: Pilihan utama mempertahankan ketegangan antara rasa takut, hormat, dan kekaguman di hadapan Allah, tanpa melunakkannya menjadi kesopanan belaka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital mengikuti konvensi umum Alkitab bahasa Indonesia. 'Bait' dipertahankan untuk membedakannya dari 'rumah' pada klausa sebelumnya.
