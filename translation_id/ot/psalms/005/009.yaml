  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: id
  text: Sebab dalam mulut mereka tidak ada yang dapat dipercaya[a]; batin mereka adalah kehancuran[b]. Kerongkongan mereka adalah kubur terbuka; dengan lidah mereka, mereka berkata manis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bentuk pada awal ayat dapat diterjemahkan, “dalam mulutnya.”
    reason: alternative_reading
  - marker: b
    text: Atau “batin mereka adalah kebinasaan” atau “hati mereka adalah kehancuran”; kata Ibrani juga dapat menyiratkan rancangan-rancangan yang merusak.
    reason: lexical_alternative
  - marker: c
    text: Atau “mereka menyanjung dengan lidah mereka”; secara harfiah, “mereka membuat licin [lidah mereka].”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi permohonan atau penghakiman pada konteks sebelumnya dan mempertahankan hubungan logis ayat.
- source_word: אֵין בְּפִיהוּ נְכוֹנָה
  choice: tidak ada yang dapat dipercaya dalam mulut mereka
  rationale: נְכוֹנָה menunjuk pada sesuatu yang teguh, benar, atau dapat diandalkan; dalam konteks perkataan menipu, frasa ini secara alami menyatakan bahwa ucapan mereka sama sekali tidak dapat dipercaya. Rujukan jamak mengikuti konteks sufiks-sufiks jamak selanjutnya.
- source_word: קִרְבָּם
  choice: batin mereka
  rationale: Mengungkapkan bagian atau keberadaan terdalam tanpa mempersempit maknanya khusus menjadi hati, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: הַוּוֹת
  choice: penuh kehancuran
  rationale: Bentuk jamak ini dapat menunjuk pada kehancuran, malapetaka, atau rancangan-rancangan yang merusak. 'Penuh kehancuran' mempertahankan daya predikatif dan nuansa batin yang sarat daya rusak.
- source_word: קֶבֶר פָּתוּחַ גְּרוֹנָם
  choice: Kerongkongan mereka seperti kubur terbuka
  rationale: Mempertahankan gambaran konkret tentang organ bicara sebagai sumber ucapan yang mematikan dan busuk. Kata 'seperti' membuat metafora nominal Ibrani alami dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: לְשׁוֹנָם יַחֲלִיקוּן
  choice: dengan lidah, mereka merayu
  rationale: Hifil חלק secara harfiah berkaitan dengan membuat licin dan dalam konteks ujaran berarti berkata muluk atau merayu secara menipu. 'Merayu' menjaga unsur ucapan manis yang bermaksud menyesatkan.
theological_decisions:
- issue: Metafora antropologis קִרְבָּם
  choice: batin mereka
  alternative: hati mereka; bagian dalam mereka
  rationale: Ayat menghubungkan kebobrokan terdalam dengan perkataan. 'Batin' mempertahankan cakupan keberadaan dalam tanpa membatasinya pada satu kemampuan tertentu.
- issue: Jumlah pada בְּפִיהוּ dalam konteks
  choice: mulut mereka
  alternative: mulutnya
  rationale: Bentuk tersebut secara ketat dapat dipahami sebagai tunggal, tetapi sufiks-sufiks berikutnya jamak dan keseluruhan ayat membicarakan orang fasik secara kolektif. Rujukan jamak menghasilkan kesinambungan alami sambil mencatat bentuk tunggal dalam catatan kaki.
- issue: Daya metafora kubur terbuka
  choice: seperti kubur terbuka
  alternative: adalah kubur terbuka
  rationale: Perbandingan eksplisit dalam bahasa Indonesia menyampaikan metafora Ibrani secara alami tanpa menafsirkan citranya lebih jauh sebagai doktrin antropologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan struktur yang mudah dipahami. Istilah konkret 'mulut', 'kerongkongan', 'kubur', dan 'lidah' dipertahankan untuk menjaga rangkaian citra tubuh dan ujaran dalam teks Ibrani. Semua penanda catatan kaki ditempatkan pada klausa terkait.
