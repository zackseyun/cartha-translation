  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: id
  text: Tetapi biarlah semua orang yang berlindung kepada-Mu bersukacita; biarlah mereka bersorak-sorai untuk selama-lamanya.[a] Kiranya Engkau menaungi mereka,[b] dan biarlah orang-orang yang mengasihi nama-Mu bersukacita di dalam-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bernyanyi riang untuk selama-lamanya”. Kata kerja Ibrani ini dapat menunjuk pada seruan kegembiraan yang nyaring dan dapat mencakup nyanyian.
    reason: lexical_alternative
  - marker: b
    text: Atau “menutupi mereka” atau “melindungi mereka”. Gambaran dalam bahasa Ibrani adalah penutupan yang memberi perlindungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: biarlah ... bersukacita
  rationale: Bentuk imperfek Qal orang ketiga jamak dapat menyatakan harapan atau permohonan dalam konteks doa ini. “Biarlah ... bersukacita” mempertahankan nuansa volitif tersebut.
- source_word: חוֹסֵי בָךְ
  choice: semua orang yang berlindung kepada-Mu
  rationale: Partisipel חָסָה menggambarkan tindakan mencari perlindungan, bukan sekadar rasa percaya dalam batin. “Berlindung kepada-Mu” mempertahankan gambaran konkretnya.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menunjukkan jangka waktu yang terus berlangsung; pilihan tersebut alami dalam puisi religius Indonesia dan mempertahankan cakupan durasinya.
- source_word: יְרַנֵּנוּ
  choice: biarlah mereka bersorak-sorai
  rationale: Bentuk Piel dari רנן menunjuk pada seruan kegembiraan yang nyaring dan dapat pula mencakup nyanyian. “Bersorak-sorai” mempertahankan luapan vokal yang kuat tanpa membatasinya hanya pada nyanyian.
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: Kiranya Engkau menaungi mereka
  rationale: Bentuk Hifil dari סכך menyampaikan gambaran menutupi atau menaungi demi melindungi. “Menaungi” mempertahankan baik citra penutupan maupun fungsi perlindungannya.
- source_word: וְיַעְלְצוּ בְךָ
  choice: biarlah ... bersukaria dalam Engkau
  rationale: עלץ menyatakan kegembiraan yang meluap, lebih kuat daripada kegembiraan biasa. “Dalam Engkau” mempertahankan preposisi ב dan menjadikan Allah pusat atau lingkup sukacita itu.
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: orang-orang yang mengasihi nama-Mu
  rationale: Teks Ibrani secara eksplisit menyebut “nama-Mu”, yang menunjuk pada pribadi Allah sebagaimana Dia menyatakan diri, termasuk watak dan nama baik-Nya. Ungkapan ini tidak diratakan menjadi sekadar “mengasihi-Mu”.
theological_decisions:
- issue: Permohonan atau prediksi dalam rangkaian bentuk imperfek
  choice: 'Bentuk-bentuk tersebut diterjemahkan sebagai doa atau harapan: “biarlah” dan “kiranya”.'
  alternative: 'Menerjemahkannya sebagai pernyataan masa depan: “mereka akan bersukacita ... akan bersorak-sorai ... akan bersukaria”.'
  rationale: Dalam konteks doa mazmur, bentuk-bentuk ini secara wajar memiliki daya volitif atau yusif. Terjemahan sebagai permohonan mempertahankan fungsi puitis dan liturgisnya tanpa meniadakan bahwa bentuk Ibraninya juga dapat terdengar seperti keyakinan akan apa yang terjadi.
- issue: Makna bersukaria “dalam” Allah
  choice: Mempertahankan ungkapan “bersukaria dalam Engkau”.
  alternative: “Bersukaria karena Engkau” atau “bersukaria atas pertolongan-Mu”.
  rationale: Preposisi בְּ pada בְךָ sengaja dipertahankan agar Allah sendiri tetap menjadi pusat atau lingkup sukacita, tanpa mempersempit sebab sukacita itu hanya kepada satu tindakan ilahi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan umum penerbitan Alkitab Indonesia. “Bersorak-sorai”, “menaungi”, dan “bersukaria” dipilih sebagai kosakata yang mudah dipahami sekaligus mempertahankan kekuatan citra dan kesejajaran puisi Ibrani.
