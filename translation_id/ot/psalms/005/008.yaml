source:
  edition: WLC
  text: יְהוָ֤ה נְחֵ֬/נִי בְ/צִדְקָתֶ֗/ךָ לְמַ֥עַן שׁוֹרְרָ֑/י הושר לְ/פָנַ֣/י דַּרְכֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: id
  text: Ya, Yahweh, tuntunlah aku dalam keadilan-Mu karena musuh-musuhku[a]; luruskanlah jalan-Mu di hadapanku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena orang-orang yang mengintai aku”; istilah Ibraninya dapat menunjuk kepada lawan yang mengawasi dengan niat jahat.
    reason: lexical_alternative
  - marker: b
    text: Atau “ratakanlah jalan-Mu di hadapanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi diterjemahkan langsung sebagai “Yahweh”; partikel “Ya” menyatakan sapaan secara alami dan khidmat dalam bahasa Indonesia.
- source_word: נְחֵנִי
  choice: tuntunlah aku
  rationale: Bentuk dari נחה berarti memimpin atau menuntun. “Tuntunlah aku” alami dalam konteks doa dan menyiratkan pengarahan yang berkelanjutan.
- source_word: בְצִדְקָתֶךָ
  choice: dalam kebenaran-Mu
  rationale: Mempertahankan kemungkinan nuansa lingkup atau standar dari preposisi ב serta arti moral-perjanjian yang luas dari צְדָקָה.
- source_word: לְמַעַן
  choice: karena
  rationale: Dalam konteks ini memperkenalkan keadaan yang mendorong permohonan pemazmur, yakni ancaman para lawan.
- source_word: שׁוֹרְרָי
  choice: orang-orang yang memusuhi aku
  rationale: Menyampaikan arti lawan yang bersikap bermusuhan tanpa menghapus kemungkinan nuansa orang-orang yang mengawasi atau mengintai dengan niat jahat.
- source_word: הושר
  choice: luruskanlah
  rationale: Bentuk kausatif dari ישר dapat berarti membuat lurus atau rata; “luruskanlah” mempertahankan metafora jalan dan cocok dengan דַּרְכֶּךָ.
- source_word: לְפָנַי
  choice: di hadapanku
  rationale: Padanan Indonesia yang wajar untuk ungkapan lokasi di depan pemazmur.
- source_word: דַּרְכֶּךָ
  choice: jalan-Mu
  rationale: Mempertahankan bentuk tunggal dan cakupan metaforisnya sebagai jalan, cara hidup, atau kehendak Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna צְדָקָה dalam ayat ini
  choice: kebenaran
  alternative: keadilan
  rationale: Permohonan ini terutama meminta tuntunan yang selaras dengan kelurusan watak dan kehendak Allah. “Kebenaran” mempertahankan cakupan moral dan perjanjian yang lebih luas, sedangkan “keadilan” dapat terdengar terbatas pada tindakan yudisial.
- issue: Metafora הושר דַּרְכֶּךָ
  choice: luruskanlah jalan-Mu
  alternative: ratakanlah jalan-Mu
  rationale: Kata kerja kausatif itu memungkinkan arti “membuat lurus” maupun “membuat rata”. Teks utama mempertahankan gambaran arah yang lurus, sementara alternatif kerataan dicatat tanpa meniadakan ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang khidmat dan mudah dipahami. Akhiran -lah mempertahankan nada permohonan, sedangkan kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan ortografis Alkitab bahasa Indonesia.
