  text: The boastful will not stand before your eyes[b][a]; you hate all workers of wickedness.
translation:
  language: id
  text: Orang-orang yang membanggakan diri[a] tidak akan berdiri di hadapan-Mu; Engkau membenci semua pelaku kejahatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang sombong,” “orang-orang bodoh,” atau “orang-orang kurang ajar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “semua orang yang berbuat jahat” atau “semua pelaku kefasikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: akan dapat berdiri
  rationale: Bentuk Hitpael dari יצב menyatakan mengambil posisi atau berdiri di hadapan seseorang. Dalam konteks hadirat dan penghakiman Allah, frasa ini secara wajar menyiratkan bahwa mereka tidak dapat bertahan di hadapan-Nya.
- source_word: הוֹלְלִים
  choice: orang-orang yang sombong
  rationale: Partisip ini menunjuk pada orang yang membanggakan diri, congkak, atau kurang ajar. 'Orang-orang yang sombong' alami dalam bahasa Indonesia dan mempertahankan penilaian moral dalam paralelisme ayat.
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: di hadapan-Mu
  rationale: Secara harfiah ungkapan ini berarti 'di depan mata-Mu', tetapi secara idiomatis menunjuk pada pandangan atau hadirat Allah. 'Di hadapan-Mu' jelas, wajar, dan tetap mempertahankan dimensi kehadiran ilahi.
- source_word: שָׂנֵאתָ
  choice: Engkau membenci
  rationale: Kata kerja ini secara langsung berarti 'membenci'. Terjemahan tidak melunakkannya menjadi sekadar 'menentang' atau 'menolak'.
- source_word: פֹּעֲלֵי אָוֶן
  choice: semua orang yang melakukan kejahatan
  rationale: Ungkapan konstruksi ini secara harfiah menunjuk pada para pelaku atau pekerja אָוֶן. Terjemahan ini mempertahankan unsur tindakan berulang dan daya moral 'kejahatan' dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Bahasa tentang kebencian Allah
  choice: Mempertahankan pernyataan langsung, 'Engkau membenci semua orang yang melakukan kejahatan.'
  alternative: Melunakkan menjadi 'Engkau menentang' atau 'Engkau menolak semua orang yang melakukan kejahatan.'
  rationale: Bahasa Ibrani dengan tegas memakai שָׂנֵאתָ, 'Engkau membenci', dan objeknya adalah para pelaku kejahatan. Ketegangan teologis ini dipertahankan tanpa pelunakan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ilahi memakai kapital penghormatan. 'Di hadapan-Mu' dipilih sebagai ungkapan idiomatis; 'akan dapat berdiri' mengungkapkan ketidakmampuan bertahan dalam hadirat Allah.
