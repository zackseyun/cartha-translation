id: PSA.5.4
reference: Psalms 5:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י לֹ֤א אֵֽל חָפֵ֘ץ רֶ֥שַׁע אָ֑תָּה לֹ֖א יְגֻרְ/ךָ֣ רָֽע׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: id
  text: Sebab Engkau bukanlah Allah yang berkenan pada kefasikan; kejahatan tidak dapat tinggal bersama-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang jahat tidak dapat tinggal bersama-Mu” atau “orang yang berbuat jahat tidak dapat tinggal bersama-Mu.”
    reason: Bahasa Ibrani רָע dapat menunjuk kepada kejahatan secara abstrak atau kepada orang jahat.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi permohonan pada ayat sebelumnya dan mempertahankan alur argumentasi mazmur.
- source_word: אֵל
  choice: Allah
  rationale: Dalam sapaan langsung ini, kata tersebut merujuk kepada Allah; “Allah” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: חָפֵץ
  choice: berkenan pada
  rationale: Mengungkapkan kesukaan atau penerimaan, bukan sekadar kehendak; frasa ini terdengar wajar dan bermartabat dalam konteks tentang sikap Allah terhadap kefasikan.
- source_word: רֶשַׁע
  choice: kefasikan
  rationale: Nomina abstrak ini menunjuk pada kejahatan atau perbuatan yang secara moral bersalah; “kefasikan” mempertahankan bobot moralnya dan cocok dengan ragam bahasa mazmur.
- source_word: יְגֻרְךָ
  choice: tidak dapat tinggal bersama-Mu
  rationale: Bentuk dari גור menyatakan tinggal atau menumpang sebagai pendatang/tamu. Dalam konteks ini, ungkapan tersebut menyatakan ketidakmungkinan atau penolakan untuk menetap dekat dengan Allah, bukan sekadar ramalan tentang masa depan.
- source_word: רָע
  choice: kejahatan
  rationale: Bentuk ini dapat dipahami secara abstrak sebagai “kejahatan” atau secara personal sebagai “orang jahat”. Padanan abstrak mempertahankan kesejajaran ringkas dengan “kefasikan”, sedangkan kemungkinan personal dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah רָע harus dipahami secara abstrak sebagai “kejahatan” atau secara personal sebagai “orang jahat”
  choice: kejahatan
  alternative: orang jahat; orang yang berbuat jahat
  rationale: Bahasa Ibrani memungkinkan pembacaan abstrak maupun personal. Kesejajaran langsung dengan רֶשַׁע (“kefasikan”) mendukung rumusan abstrak, sementara ayat berikutnya secara eksplisit beralih kepada para pelaku kejahatan. Catatan kaki mempertahankan ambiguitas sumber tanpa memaksakan salah satu pembacaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa menjadi arkais. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum Alkitab bahasa Indonesia. “Bersama-Mu” dipilih agar dapat dipahami pembaca umum, meskipun verba Ibraninya secara lebih harfiah menggambarkan tinggal atau menumpang sebagai tamu.
