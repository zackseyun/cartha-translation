id: PSA.5.1
reference: Psalms 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲמָרַ֖/י הַאֲזִ֥ינָ/ה יְהוָ֗ה בִּ֣ינָ/ה הֲגִֽיגִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/001.yaml
  text: Give ear to my words[a], O Yahweh; understand my groaning.
translation:
  language: id
  text: Dengarkanlah kata-kataku, ya Yahweh; pahamilah rintihanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “renunganku” atau “gumamanku.” Istilah Ibrani ini dapat menunjuk pada perenungan batin maupun ujaran lirih; di sini diterjemahkan “rintihanku” sesuai dengan konteks ratapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: kata-kataku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal ini secara langsung menunjuk pada perkataan pemazmur; “kata-kataku” alami dan setia pada bentuk sumber.
- source_word: הַאֲזִינָה
  choice: Dengarkanlah
  rationale: Kata perintah dari אזן meminta perhatian sungguh-sungguh. “Dengarkanlah” menyampaikan permohonan doa dengan wajar dalam bahasa Indonesia modern tanpa mempertahankan idiom tubuh secara kaku.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”; partikel vokatif “ya” menyatakan sapaan langsung dalam doa.
- source_word: בִּינָה
  choice: pahamilah
  rationale: Kata perintah dari בין meminta agar sesuatu ditangkap dengan pengertian, bukan sekadar didengar; “pahamilah” mempertahankan nuansa kognitif itu.
- source_word: הֲגִיגִי
  choice: rintihanku
  rationale: Istilah ini dapat menunjuk pada renungan batin atau ujaran lirih. Dalam konteks ratapan, “rintihanku” mengungkapkan ujaran batin yang penuh kesesakan, sementara keluasan maknanya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: ya Yahweh
  alternative: ya TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama itu, sedangkan “ya” menandai sapaan tanpa mengubahnya menjadi gelar.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Akhiran -lah mempertahankan nada permohonan yang sungguh-sungguh, bukan perintah kasar.
