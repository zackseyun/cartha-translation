  yaml_path: translation/ot/psalms/005/002.yaml
  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: id
  text: Dengarkanlah seruanku memohon pertolongan, Rajaku dan Allahku, sebab kepada-Mulah aku berdoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku akan berdoa.” Bentuk Ibraninya dapat menyatakan tindakan sekarang, yang berkelanjutan, atau yang akan datang, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Perhatikanlah
  rationale: Bentuk imperatif dari קשׁב meminta pendengaran yang sungguh-sungguh dan penuh perhatian. “Perhatikanlah” menyampaikan daya permohonan itu secara alami dalam bahasa Indonesia modern.
- source_word: לְקוֹל
  choice: suara
  rationale: קוֹל berarti “suara” atau “bunyi.” Bersama שַׁוְעִי, pilihan ini mempertahankan susunan Ibrani “suara seruanku” tanpa menambahkan makna yang tidak ada.
- source_word: שַׁוְעִי
  choice: seruanku minta tolong
  rationale: שַׁוְעָה menunjuk pada seruan dalam kesusahan untuk meminta pertolongan, bukan sekadar teriakan. Ungkapan ini jelas dan alami bagi pembaca Indonesia.
- source_word: מַלְכִּי
  choice: Rajaku
  rationale: Kata ini adalah gelar sapaan dengan akhiran orang pertama tunggal. Huruf kapital mengikuti kebiasaan bahasa Indonesia untuk gelar ilahi dalam sapaan langsung.
- source_word: וֵאלֹהָי
  choice: dan Allahku
  rationale: Terjemahan langsung gelar ilahi dengan akhiran orang pertama tunggal; bentuk “Allahku” alami dalam doa dan mempertahankan hubungan pribadi yang dinyatakan teks.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi permohonan sebelumnya. “Sebab” ringkas, jelas, dan sesuai dengan ragam doa yang bermartabat.
- source_word: אֵלֶיךָ
  choice: kepada-Mulah
  rationale: Preposisi ini menunjukkan arah doa kepada Allah. Partikel penegas “-lah” mencerminkan penempatan אֵלֶיךָ yang menonjol dan menghasilkan ungkapan Indonesia yang alami.
- source_word: אֶתְפַּלָּל
  choice: aku berdoa
  rationale: Bentuk Hitpael imperfek orang pertama tunggal dari פלל dapat menyatakan tindakan kini, berkelanjutan, kebiasaan, atau masa depan menurut konteks. “Aku berdoa” cocok dengan permohonan yang sedang diucapkan dan tidak memaksakan penandaan waktu dalam bahasa Indonesia.
theological_decisions:
- issue: Sapaan ilahi dengan gelar kerajaan
  choice: ya Rajaku dan Allahku
  alternative: Rajaku dan Allahku
  rationale: Teks menyapa Allah secara langsung dengan dua gelar, yaitu Raja dan Allah. Partikel vokatif “ya” menjadikan sapaan itu jelas dan alami tanpa menambahkan klaim teologis di luar teks.
- issue: Aspek atau waktu אֶתְפַּלָּל
  choice: aku berdoa
  alternative: aku akan berdoa
  rationale: Imperfek Ibrani dapat dibaca sebagai tindakan kini atau yang berlanjut maupun sebagai tindakan mendatang. Konteks permohonan langsung mendukung “aku berdoa,” sedangkan kemungkinan nuansa mendatang dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat dengan nada doa langsung. Susunan “suara seruanku minta tolong” mempertahankan unsur קוֹל sekaligus menjelaskan sifat seruan itu. Kapitalisasi pada “Rajaku,” “Allahku,” dan “-Mu” mengikuti kebiasaan ejaan untuk penyebutan dan sapaan kepada Allah.
