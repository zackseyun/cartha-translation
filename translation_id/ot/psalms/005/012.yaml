source:
  edition: WLC
  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: id
  text: Sebab Engkau memberkati orang benar, ya Yahweh; Engkau mengelilinginya dengan perkenanan seperti perisai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau memahkotainya dengan perkenanan seperti perisai.” Kata kerja Ibrani dapat berarti “memahkotai” atau “mengelilingi”; gambaran perisai mendukung arti mengelilingi untuk melindungi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menyatakan dasar bagi keyakinan atau permohonan sebelumnya dan mempertahankan fungsi kausal-penjelasnya.
- source_word: תְּבָרֵךְ
  choice: memberkati
  rationale: Bentuk imperfek menyatakan tindakan ilahi yang menjadi kebiasaan atau diyakini pasti; bentuk kini bahasa Indonesia menyampaikannya secara alami.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva tunggal yang dipakai secara substantival menunjuk kepada pribadi benar sebagai wakil suatu golongan; 'orang benar' alami dan tidak membatasi rujukan kepada tokoh tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: כַּצִּנָּה
  choice: seperti dengan perisai
  rationale: Prefiks כ menyatakan perbandingan, sedangkan צִנָּה menunjuk pada perisai, sering kali perisai besar; tambahan 'dengan' membuat gambaran perlindungan alami dalam bahasa Indonesia.
- source_word: רָצוֹן
  choice: dengan perkenanan
  rationale: Dalam konteks ini menunjuk pada sikap berkenan Allah yang menjadi sarana perlindungan bagi orang benar.
- source_word: תַּעְטְרֶנּוּ
  choice: Engkau mengelilinginya
  rationale: Kata kerja ini dapat berarti 'memahkotai' atau 'mengelilingi'. Gambaran perisai mendukung nuansa mengelilingi secara protektif, sementara alternatif leksikal dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Hubungan perkenanan Allah dengan gambaran perisai
  choice: Perkenanan menjadi sarana Allah mengelilingi orang benar secara protektif
  alternative: Allah memahkotai orang benar dengan perkenanan seperti dengan perisai
  rationale: Susunan Ibrani memungkinkan nuansa 'memahkotai' maupun 'mengelilingi'. Terjemahan utama mengikuti daya gambar perisai tanpa menghapus alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'Engkau' mempertahankan acuan tunggal kepada Allah; struktur kalimat dibuat jelas bagi pembaca umum sambil menjaga citra puitis perisai.
