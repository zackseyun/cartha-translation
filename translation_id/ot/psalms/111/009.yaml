  text: He sent redemption to his people[a]; he has commanded his covenant forever[b]. Holy and awesome is his name.
translation:
  language: id
  text: Ia mengirimkan penebusan kepada umat-Nya; Ia menetapkan perjanjian-Nya untuk selama-lamanya.[a] Kudus dan dahsyat[b] nama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Ia memerintahkan perjanjian-Nya untuk selama-lamanya.” Verba Ibrani juga dapat berarti menetapkan atau menitahkan dengan wewenang.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menggentarkan,” “patut ditakuti,” atau “membangkitkan rasa gentar dan kagum.” Kata Ibrani ini menekankan rasa takut penuh hormat sekaligus kekaguman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּת
  choice: penebusan
  rationale: Kata ini menunjuk pada pembebasan yang dikerjakan melalui pembayaran atau tindakan penyelamatan. “Penebusan” mempertahankan keluasan makna dan bobot teologisnya.
- source_word: שָׁלַח
  choice: mengirimkan
  rationale: Padanan ini mempertahankan gambaran konkret bahwa Allah memprakarsai dan mengarahkan penebusan kepada umat-Nya.
- source_word: לְעַמּוֹ
  choice: kepada umat-Nya
  rationale: Preposisi לְ paling langsung menandai penerima atau arah; “kepada umat-Nya” mempertahankan bentuk itu secara alami.
- source_word: צִוָּה
  choice: menetapkan
  rationale: Dalam hubungan dengan “perjanjian,” “menetapkan” menyampaikan tindakan berwenang yang dinyatakan oleh verba “memerintahkan” tanpa menghasilkan ungkapan Indonesia yang janggal. Arti harfiahnya dicatat dalam catatan kaki.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini secara alami menyampaikan keberlangsungan yang tidak terbatas dalam bahasa Indonesia.
- source_word: בְּרִיתוֹ
  choice: perjanjian-Nya
  rationale: “Perjanjian” merupakan padanan baku yang mempertahankan dimensi relasional dan pengikatan dari istilah Ibrani.
- source_word: קָדוֹשׁ
  choice: kudus
  rationale: Padanan baku dan tepat bagi sifat nama Allah.
- source_word: וְנוֹרָא
  choice: dan dahsyat
  rationale: “Dahsyat” menyampaikan keagungan yang membangkitkan rasa gentar, bukan sekadar sesuatu yang mengagumkan. Nuansa alternatif dijelaskan dalam catatan kaki.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Terjemahan harfiah dipertahankan karena dalam bahasa pujian Ibrani nama Allah menyatakan karakter dan reputasi-Nya yang diwahyukan.
theological_decisions:
- issue: Daya verba צִוָּה ketika dihubungkan dengan perjanjian
  choice: Ia menetapkan perjanjian-Nya
  alternative: Ia memerintahkan perjanjian-Nya
  rationale: Verba Ibrani secara dasar berarti “memerintahkan,” tetapi dalam konstruksi ini menyatakan tindakan berwenang Allah terhadap perjanjian-Nya. “Menetapkan” lebih wajar dalam bahasa Indonesia dan tidak menentukan mekanisme teologis lebih jauh; bentuk yang lebih harfiah tetap dicatat.
- issue: Makna וְנוֹרָא sebagai sifat nama Allah
  choice: dahsyat
  alternative: menggentarkan; patut ditakuti; membangkitkan rasa gentar dan kagum
  rationale: Teks menggabungkan keagungan dengan rasa takut yang penuh hormat. “Dahsyat” mempertahankan kedua sisi tersebut lebih baik daripada “mengagumkan” saja, sementara catatan kaki menjaga keluasan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan predikatif “Kudus dan dahsyat nama-Nya” untuk mempertahankan penekanan serta kesejajaran puisi Ibrani. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
