translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Semuanya” mempertahankan rujukan jamak kepada titah-titah pada ayat sebelumnya. Tanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
