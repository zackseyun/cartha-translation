  text: They are established forever and ever[b][a], done in truth and uprightness.
translation:
  language: id
  text: Semua itu diteguhkan untuk seterusnya dan selama-lamanya,[a] dilakukan dalam kebenaran[b] dan kelurusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditopang untuk seterusnya dan selama-lamanya”; partisip Ibrani dapat menekankan bahwa semuanya ditopang atau dibuat kokoh.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam kesetiaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְמוּכִים
  choice: diteguhkan
  rationale: Partisip pasif dari סמך menyatakan bahwa semuanya ditopang atau dibuat kokoh. Dalam konteks titah-titah Allah pada ayat sebelumnya, “diteguhkan” menyampaikan kekokohan yang tetap dan alami dalam bahasa Indonesia.
- source_word: לָעַד לְעוֹלָם
  choice: untuk seterusnya dan selama-lamanya
  rationale: Dua ungkapan durasi ini bertumpang tindih dan bersama-sama menegaskan sifat kekal. Terjemahan ini mempertahankan pengulangan penegas dalam bahasa Ibrani tanpa terdengar terlalu janggal.
- source_word: עֲשׂוּיִם
  choice: dilaksanakan
  rationale: Partisip pasif dari עשה dapat berarti dibuat, dilakukan, atau dilaksanakan. Karena acuannya adalah titah-titah Allah, “dilaksanakan” merupakan ungkapan Indonesia yang wajar sambil mempertahankan bentuk pasif.
- source_word: בֶּאֱמֶת
  choice: dalam kesetiaan
  rationale: אֱמֶת mencakup kebenaran, keandalan, dan kesetiaan. Dalam gambaran tentang ketetapan Allah, “kesetiaan” menonjolkan sifat dapat dipercaya, sementara alternatif “kebenaran” dicatat dalam catatan kaki.
- source_word: וְיָשָׁר
  choice: dan kelurusan
  rationale: יָשָׁר secara harfiah berarti lurus, benar, atau jujur. Bentuk nomina “kelurusan” sejajar dengan “kesetiaan” dan mempertahankan kualitas moral yang dimaksud.
