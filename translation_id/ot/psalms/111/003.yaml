translation:
  language: id
  text: 'Perbuatan-Nya agung dan megah,

    dan kebenaran-Nya tetap untuk selama-lamanya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keadilan-Nya tetap untuk selama-lamanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: keagungan
  rationale: Dalam pasangan puitis dengan הָדָר, kata ini menyatakan kebesaran yang luhur; “keagungan” alami dan bermartabat dalam bahasa Indonesia.
- source_word: הָדָר
  choice: kemegahan
  rationale: Kata ini menunjuk pada kemuliaan atau keelokan yang mengesankan. “Kemegahan” mempertahankan kesejajaran puitis tanpa meleburkannya dengan הוֹד.
- source_word: פָּעֳלוֹ
  choice: perbuatan-Nya
  rationale: Bentuk tunggal ini dapat merujuk secara kolektif pada karya atau tindakan Allah. “Perbuatan-Nya” sesuai dengan konteks pujian atas tindakan-tindakan-Nya.
- source_word: צִדְקָתוֹ
  choice: kebenaran-Nya
  rationale: צְדָקָה mencakup kelurusan moral, kebenaran, dan keadilan. “Kebenaran-Nya” merupakan padanan luas yang wajar, sedangkan “keadilan-Nya” dicatat sebagai alternatif.
- source_word: עֹמֶדֶת
  choice: tetap
  rationale: Partisipel dari עמד secara harfiah menggambarkan sesuatu yang berdiri, dan di sini menyatakan keberlangsungan; “tetap” menyampaikan makna itu secara alami.
- source_word: לָעַד
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; bentuk tersebut jelas, puitis, dan lazim dalam bahasa Indonesia Alkitabiah modern.
theological_decisions:
- issue: Makna צִדְקָתוֹ sebagai sifat Allah yang terus berlaku
  choice: kebenaran-Nya
  alternative: keadilan-Nya
  rationale: Istilah Ibrani ini dapat menunjuk pada kebenaran atau keadilan. Konteksnya memuji perbuatan dan kelurusan Allah secara luas, bukan secara khusus tindakan penghakiman, sehingga “kebenaran-Nya” dipakai dalam teks dan “keadilan-Nya” dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat, tetapi tetap mudah dipahami. Susunan kalimat menampilkan pasangan sinonim Ibrani dan mempertahankan ambiguitas צְדָקָה melalui catatan kaki.
