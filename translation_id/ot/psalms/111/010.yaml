source:
  edition: WLC
  text: רֵ֘אשִׁ֤ית חָכְמָ֨ה יִרְאַ֬ת יְהוָ֗ה שֵׂ֣כֶל ט֭וֹב לְ/כָל עֹשֵׂי/הֶ֑ם תְּ֝הִלָּת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/010.yaml
  text: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[c][b]. His praise stands forever.
translation:
  language: id
  text: Takut akan Yahweh adalah awal hikmat. Semua orang yang melakukannya memiliki pemahaman yang baik[a]. Pujian-Nya bertahan selama-lamanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua orang yang melakukan mereka.” Objek jamak itu tidak disebutkan secara langsung; mungkin menunjuk kepada ketetapan-ketetapan Yahweh dalam mazmur ini atau kepada praktik takut akan Dia.
    reason: Menjelaskan akhiran objek jamak Ibrani yang tidak memiliki anteseden eksplisit dan menjaga ambiguitas rujukannya.
  - marker: b
    text: Atau, “Pujian-Nya tetap untuk selama-lamanya.”
    reason: Memberikan padanan yang lebih dekat dengan gambaran kata kerja Ibrani, ‘berdiri/tetap’.
lexical_decisions:
- source_word: רֵאשִׁית
  choice: awal
  rationale: Dalam rangkaian dengan חָכְמָה, kata ini menunjuk pada permulaan atau dasar hikmat. “Awal” alami dalam bahasa Indonesia dan tidak membatasi maknanya pada urutan waktu semata.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Istilah baku dalam sastra hikmat untuk kecakapan moral dan praktis dalam menjalani hidup, bukan sekadar pengetahuan.
- source_word: יִרְאַת יְהוָה
  choice: takut akan Yahweh
  rationale: “Takut” mempertahankan bobot kata Ibrani yang mencakup rasa gentar, takzim, dan hormat, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: שֵׂכֶל טוֹב
  choice: pemahaman yang baik
  rationale: שֵׂכֶל menyatakan pengertian, wawasan, atau pertimbangan yang sehat; terjemahan ini mempertahankan unsur kognitif sekaligus moral dari ungkapan tersebut.
- source_word: לְכָל עֹשֵׂיהֶם
  choice: dimiliki semua orang yang melakukan semuanya itu
  rationale: Preposisi לְ dinyatakan secara idiomatis dengan “dimiliki”, sedangkan akhiran jamak pada עֹשֵׂיהֶם dipertahankan melalui “semuanya itu” tanpa menetapkan secara tegas objek tersiratnya.
- source_word: תְּהִלָּתוֹ
  choice: Pujian-Nya
  rationale: Akhiran orang ketiga tunggal paling wajar merujuk kepada Yahweh. Bentuk ini tetap dapat mencakup pujian yang ditujukan kepada-Nya maupun kemasyhuran atau kelayakan-Nya untuk dipuji.
- source_word: עֹמֶדֶת לָעַד
  choice: bertahan selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan yang tetap. “Bertahan selama-lamanya” alami dalam bahasa Indonesia sambil mempertahankan gagasan keteguhan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna יִרְאַת dalam ungkapan hikmat
  choice: takut akan Yahweh
  alternative: hormat kepada Yahweh
  rationale: Kata “takut” tidak dilunakkan menjadi sekadar rasa hormat karena ungkapan Ibrani mencakup ketakutan yang penuh takzim dan mempunyai bobot teologis yang lebih kuat.
- issue: Objek tersirat dalam עֹשֵׂיהֶם
  choice: semuanya itu, dengan penjelasan dalam catatan kaki
  alternative: melakukannya
  rationale: Akhiran Ibrani berbentuk jamak, tetapi tidak memiliki anteseden jamak yang disebutkan secara langsung dalam ayat ini. Terjemahan mempertahankan bentuk jamak dan catatan kaki menjaga ketidakpastian apakah rujukannya adalah ketetapan-ketetapan Yahweh atau praktik takut kepada-Nya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Susunan kalimat dibuat singkat untuk mempertahankan gaya aforistik ayat hikmat. Kata “hikmat” dan ungkapan “takut akan” dipertahankan karena sudah mapan dan membawa bobot makna sumber.
