id: PSA.111.7
reference: Psalms 111:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַעֲשֵׂ֣י יָ֭דָי/ו אֱמֶ֣ת וּ/מִשְׁפָּ֑ט נֶ֝אֱמָנִ֗ים כָּל פִּקּוּדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/007.yaml
  text: The works of his hands are truth and justice[b][a]; all his precepts are trustworthy.
translation:
  language: id
  text: Perbuatan tangan-Nya adalah kebenaran dan keadilan[a]; segala titah-Nya dapat dipercaya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan dan keadilan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “segala petunjuk-Nya teguh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂי
  choice: Perbuatan
  rationale: Bentuk jamak konstruktus ini menunjuk pada segala sesuatu yang dilakukan atau dihasilkan. “Perbuatan” alami dalam bahasa Indonesia dan mempertahankan penekanan pada tindakan.
- source_word: יָדָיו
  choice: tangan-Nya
  rationale: Terjemahan langsung yang mempertahankan gambaran puitis Ibrani tentang tangan sebagai pelaku atau sarana tindakan.
- source_word: אֱמֶת
  choice: kebenaran
  rationale: Kata ini mencakup kebenaran, keteguhan, dan kesetiaan. “Kebenaran” mempertahankan bentuk nominal dan kesejajarannya dengan “keadilan”, tanpa menyamakan maknanya dengan נֶאֱמָנִים pada bagian berikutnya.
- source_word: וּמִשְׁפָּט
  choice: dan keadilan
  rationale: Dalam pasangan sifat abstrak ini, “keadilan” lebih alami daripada “penghakiman” dan menyampaikan mutu benar serta adil dari perbuatan Allah.
- source_word: נֶאֱמָנִים
  choice: dapat dipercaya
  rationale: Ungkapan predikatif ini menyatakan bahwa titah-titah tersebut teguh dan andal. “Dapat dipercaya” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: כָּל
  choice: segala
  rationale: Mempertahankan cakupan menyeluruh dari kata Ibrani; “segala” mengalir alami sebelum nomina kolektif jamak.
- source_word: פִּקּוּדָיו
  choice: titah-Nya
  rationale: Dalam Mazmur, kata ini menunjuk pada ketetapan atau perintah yang Allah berikan. “Titah” mempertahankan daya hukum-etis dan kewibawaannya tanpa menjadi terlalu teknis.
theological_decisions:
- issue: Apakah אֱמֶת diterjemahkan sebagai “kebenaran” atau “kesetiaan” ketika menggambarkan perbuatan Allah
  choice: kebenaran
  alternative: kesetiaan; keteguhan
  rationale: “Kebenaran” mempertahankan keluasan makna dan kesejajaran puitis dengan “keadilan”, sedangkan klausa berikutnya sudah mengungkapkan sifat dapat dipercaya melalui נֶאֱמָנִים. Alternatif yang sah dicatat tanpa menutup ambiguitas leksikal.
- issue: Apakah פִּקּוּדָיו diterjemahkan dengan istilah umum atau istilah yang mempertahankan daya perintah
  choice: titah-Nya
  alternative: petunjuk-Nya; ketetapan-Nya
  rationale: “Titah” mempertahankan unsur kewibawaan dan nuansa hukum-perjanjian dalam istilah Mazmur ini, sementara “petunjuk” merupakan kemungkinan yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan dua klausa yang mengikuti kesejajaran Ibrani. Akhiran pronominal ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia.
