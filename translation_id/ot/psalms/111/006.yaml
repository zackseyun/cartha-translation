source:
  edition: WLC
  text: כֹּ֣חַ מַ֭עֲשָׂי/ו הִגִּ֣יד לְ/עַמּ֑/וֹ לָ/תֵ֥ת לָ֝/הֶ֗ם נַחֲלַ֥ת גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/006.yaml
  text: He has declared to his people the power of his works[a], in giving them the inheritance of the nations.
translation:
  language: id
  text: Ia telah menyatakan kepada umat-Nya kuasa perbuatan-perbuatan-Nya[a] dengan memberikan kepada mereka milik pusaka bangsa-bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia telah menyatakan kepada umat-Nya kuasa perbuatan-perbuatan-Nya untuk memberikan kepada mereka milik pusaka bangsa-bangsa.” Infinitif Ibrani dapat dipahami sebagai menyatakan tujuan, bukan sarana atau hasil.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּחַ
  choice: kuasa
  rationale: Kata ini menyatakan kekuatan atau kuasa; “kuasa” cocok dengan tindakan-tindakan Allah yang perkasa dan wajar dalam bahasa Indonesia.
- source_word: מַעֲשָׂיו
  choice: perbuatan-perbuatan-Nya
  rationale: Bentuk ini merujuk pada pekerjaan atau tindakan-Nya. “Perbuatan-perbuatan-Nya” mempertahankan gagasan jamak dan konteks pujian atas tindakan Allah.
- source_word: הִגִּיד
  choice: telah menyatakan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyatakan; pilihan ini mempertahankan nada deklaratif mazmur.
- source_word: לְעַמּוֹ
  choice: kepada umat-Nya
  rationale: Preposisi ל berfungsi sebagai penanda penerima tidak langsung; עַם dalam konteks relasi perjanjian diterjemahkan secara alami sebagai “umat”.
- source_word: לָתֵת
  choice: dengan memberikan
  rationale: 'Infinitif dengan ל dapat menyatakan sarana/hasil ataupun tujuan. Teks utama memakai nuansa sarana: pemberian milik pusaka memperlihatkan kuasa perbuatan-Nya.'
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Kata ganti ini merujuk kembali kepada umat-Nya dan dipertahankan secara eksplisit.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: נַחֲלָה berarti warisan, milik pusaka, atau bagian kepunyaan. “Milik pusaka” sesuai dengan konteks tanah yang dianugerahkan dan dengan konstruksi yang diikuti “bangsa-bangsa”.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Di sini istilah tersebut menunjuk pada bangsa-bangsa lain yang wilayahnya diberikan kepada Israel; “bangsa-bangsa” tepat dan tidak membawa nuansa Perjanjian Baru yang tidak perlu.
theological_decisions:
- issue: Hubungan klausa infinitif לָתֵת לָהֶם נַחֲלַת גּוֹיִם dengan klausa utama
  choice: 'Nuansa sarana/hasil: Allah menyatakan kuasa perbuatan-Nya dengan memberikan milik pusaka bangsa-bangsa kepada umat-Nya.'
  alternative: 'Nuansa tujuan: Allah menyatakan kuasa perbuatan-Nya kepada umat-Nya untuk memberikan kepada mereka milik pusaka bangsa-bangsa.'
  rationale: Infinitif Ibrani dengan ל dapat mengungkapkan tujuan, hasil, atau sarana. Konteksnya mendukung pemberian tanah sebagai peragaan kuasa Allah, tetapi kemungkinan nuansa tujuan tetap dicatat agar ambiguitas asli tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti ilahi mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia. “Milik pusaka” mempertahankan corak perjanjian dan tanah tanpa menjadi terlalu teknis.
