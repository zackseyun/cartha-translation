  terminology: '"Umat-Nya", "kuasa", dan "milik pusaka" sesuai register Alkitab Indonesia dan konteks perjanjian. Kapitalisasi kata ganti ilahi konsisten. "Bangsa-bangsa" tepat untuk גּוֹיִם.'
