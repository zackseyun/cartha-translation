  yaml_path: translation/ot/psalms/111/002.yaml
  text: Great are the works of the LORD, studied by all who delight in them.
translation:
  language: id
  text: Agunglah karya-karya TUHAN, ditelaah oleh semua orang yang menyenangi karya-karya itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּדֹלִים
  choice: Agunglah
  rationale: Menyampaikan kebesaran dan kemuliaan karya-karya TUHAN dalam bentuk puitis yang wajar dalam bahasa Indonesia.
- source_word: מַעֲשֵׂי
  choice: karya-karya
  rationale: Mencakup segala perbuatan atau hasil pekerjaan TUHAN dan sesuai dengan konteks pujian.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi penerjemahan Alkitab bahasa Indonesia untuk Tetragramaton.
- source_word: דְּרוּשִׁים
  choice: ditelaah
  rationale: Partisip pasif ini dapat berarti dicari, diselidiki, atau dipelajari dengan saksama; 'ditelaah' mempertahankan gagasan penyelidikan penuh perhatian.
- source_word: חֶפְצֵיהֶם
  choice: yang menyenangi karya-karya itu
  rationale: Kata חפץ menyatakan kesukaan atau kegembiraan terhadap sesuatu. Pengulangan 'karya-karya itu' memperjelas acuan sufiks jamak tanpa mengubah maknanya.
theological_decisions:
- issue: Acuan sufiks jamak pada חֶפְצֵיהֶם
  choice: karya-karya TUHAN
  alternative: TUHAN sendiri
  rationale: Bentuk jamak sufiksnya paling alami mengacu kembali kepada 'karya-karya' yang juga jamak, bukan kepada nama ilahi yang tunggal.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Susunan predikat di depan ('Agunglah') mempertahankan penekanan awal teks Ibrani; 'ditelaah' tetap mudah dipahami sekaligus mencerminkan penyelidikan yang saksama.
