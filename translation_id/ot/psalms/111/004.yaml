  text: זֵ֣כֶר עָ֭שָׂה לְ/נִפְלְאֹתָ֑י/ו חַנּ֖וּן וְ/רַח֣וּם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/004.yaml
  text: He has caused his wondrous works to be remembered[a]; Yahweh is gracious and compassionate.
translation:
  language: id
  text: Ia membuat perbuatan-perbuatan-Nya yang ajaib tetap dikenang[a]; Yahweh itu pengasih dan penyayang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia membuat suatu peringatan bagi perbuatan-perbuatan-Nya yang ajaib.”
    reason: Alternatif leksikal untuk זֵכֶר עָשָׂה, yang dapat diterjemahkan secara lebih harfiah sebagai pembuatan suatu peringatan.
lexical_decisions:
- source_word: זֵכֶר
  choice: tetap dikenang
  rationale: Nomina ini berarti ‘ingatan’ atau ‘peringatan’. Dalam konstruksi dengan עָשָׂה dan לְנִפְלְאוֹתָיו, ungkapan verbal ‘membuat ... tetap dikenang’ menyampaikan secara alami bahwa karya-karya Allah memperoleh ingatan yang bertahan lama, sambil mempertahankan alternatif harfiah dalam catatan kaki.
- source_word: עָשָׂה
  choice: membuat
  rationale: Arti dasarnya ialah ‘membuat’ atau ‘melakukan’. Bersama זֵכֶר, ‘membuat ... tetap dikenang’ merupakan ungkapan Indonesia yang alami dan mencerminkan daya kausatif dari keseluruhan konstruksi tanpa melebihkan arti verba itu sendiri.
- source_word: לְנִפְלְאֹתָיו
  choice: perbuatan-perbuatan-Nya yang ajaib
  rationale: Bentuk ini menunjuk pada tindakan-tindakan luar biasa milik-Nya. Terjemahan ini mempertahankan rujukan konkret kepada karya Allah, bukan sekadar rasa takjub yang abstrak.
- source_word: חַנּוּן
  choice: pengasih
  rationale: Adjektiva ini menggambarkan kesediaan Allah untuk memberikan kasih karunia dan kemurahan. ‘Pengasih’ ringkas, wajar, dan serasi dengan pasangan istilah berikutnya.
- source_word: וְרַחוּם
  choice: dan penyayang
  rationale: רַחוּם menyatakan belas kasih yang mendalam. ‘Penyayang’ membedakannya secara wajar dari חַנּוּן dan mempertahankan nuansa afektifnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Subjek verba עָשָׂה
  choice: Kata ganti ‘Ia’ merujuk kepada Yahweh, yang disebut pada klausa terakhir
  alternative: 'Pembacaan impersonal: ‘Suatu peringatan dibuat bagi perbuatan-perbuatan-Nya yang ajaib’'
  rationale: Verba maskulin tunggal tidak menyebut subjek secara eksplisit, tetapi nama Yahweh pada klausa terakhir secara alami mengidentifikasi pelaku dalam baris ini. Kata ‘Ia’ menjaga kesinambungan dan keterbacaan tanpa menambahkan pelaku lain.
- issue: Makna konstruksi זֵכֶר עָשָׂה
  choice: Ia membuat perbuatan-perbuatan-Nya yang ajaib tetap dikenang
  alternative: Ia membuat suatu peringatan bagi perbuatan-perbuatan-Nya yang ajaib
  rationale: Konstruksi Ibrani dapat dipahami sebagai menyebabkan karya-karya itu terus diingat atau sebagai membuat suatu peringatan. Teks utama memakai bentuk verbal yang lebih alami dalam bahasa Indonesia, sedangkan kemungkinan nominal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ulang ‘perbuatan-perbuatan’ memperjelas jamak Ibrani; kapitalisasi ‘-Nya’ mengikuti kebiasaan Indonesia untuk rujukan kepada Allah. Partikel ‘itu’ membuat predikasi adjektival pada klausa kedua terdengar alami tanpa mengubah tekanannya.
