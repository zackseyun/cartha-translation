base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/001.yaml
  text: Praise Yah! I will give thanks to Yahweh with my whole heart[b][a], in the council of the upright and in the congregation.
translation:
  language: id
  text: Pujilah Yah![a] Aku akan bersyukur kepada Yahweh dengan segenap hatiku, dalam majelis orang-orang benar[b] dan dalam jemaat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Haleluya” atau “Pujilah TUHAN.” Teks memakai “Pujilah Yah,” dengan bentuk singkat nama ilahi.'
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam persekutuan orang-orang benar.” Kata Ibrani untuk “majelis” dapat berarti majelis, lingkaran akrab, atau perhimpunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Bentuk ini mempertahankan seruan imperatif jamak dan bentuk singkat nama ilahi, serta membedakannya dari יְהוָה pada klausa berikutnya.
- source_word: אוֹדֶה
  choice: Aku akan bersyukur
  rationale: Dalam konteks mazmur pujian, bentuk ini menyatakan tekad pribadi untuk mengucapkan syukur kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri dan dibedakan dari bentuk singkat יָהּ, “Yah,” yang muncul sebelumnya.
- source_word: בְּכָל לֵבָב
  choice: dengan segenap hatiku
  rationale: Ungkapan ini menyampaikan pengabdian batin yang utuh dan terdengar alami dalam bahasa Indonesia modern.
- source_word: בְּסוֹד
  choice: dalam persekutuan
  rationale: סוֹד dapat menunjuk pada lingkaran akrab, majelis, atau perhimpunan. “Persekutuan” cocok dengan konteks ibadah sekaligus tetap dibedakan dari עֵדָה.
- source_word: יְשָׁרִים
  choice: orang-orang yang lurus
  rationale: Ungkapan ini mempertahankan gambaran moral Ibrani tentang orang-orang yang hidup lurus tanpa mempersempitnya hanya menjadi kejujuran verbal.
- source_word: וְעֵדָה
  choice: dan dalam jemaat
  rationale: עֵדָה menunjuk pada komunitas yang berhimpun; “jemaat” alami dalam konteks ibadah dan tidak disamakan dengan סוֹד.
theological_decisions:
- issue: Penerjemahan יָהּ dan יְהוָה dalam ayat yang sama
  choice: יָהּ diterjemahkan “Yah” dan יְהוָה ditransliterasikan “Yahweh”
  alternative: Keduanya diterjemahkan “TUHAN,” atau יָהּ ditransliterasikan dalam seruan “Haleluya” sementara יְהוָה diterjemahkan “TUHAN”
  rationale: Pilihan ini mempertahankan perbedaan nyata antara bentuk singkat nama ilahi dan Tetragramaton dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Segenap hatiku” mempertahankan ungkapan ibadah yang lazim; “persekutuan” dan “jemaat” menjaga pembedaan dua istilah Ibrani bagi kelompok yang berhimpun.
