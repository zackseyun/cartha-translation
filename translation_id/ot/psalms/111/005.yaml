  text: He has given food to those who fear him[a]; he will remember his covenant forever.
translation:
  language: id
  text: Ia telah memberikan makanan kepada orang-orang yang takut akan Dia[a]; Ia akan mengingat perjanjian-Nya selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mangsa”; istilah Ibrani ini dapat berarti mangsa atau makanan yang diperoleh sebagai hasil buruan, tetapi di sini kemungkinan besar berarti makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶף
  choice: makanan
  rationale: Kata ini dapat berarti mangsa atau makanan yang diperoleh sebagai mangsa, tetapi dalam konteks kemurahan Allah kepada orang yang takut akan Dia, “makanan” menyampaikan makna konkret secara alami tanpa menambahkan gambaran perburuan.
- source_word: נָתַן
  choice: memberikan
  rationale: Bentuk perfektif menyatakan tindakan yang telah dilakukan. Dalam puisi ini, bentuk kini bahasa Indonesia dapat menyatakan tindakan pemberian Allah sebagai kenyataan yang terbukti dan berpola, tanpa harus menambahkan penanda waktu yang tidak ada dalam teks.
- source_word: לִירֵאָיו
  choice: kepada orang-orang yang takut akan Dia
  rationale: Ungkapan ini menunjuk kepada mereka yang dicirikan oleh rasa takut dan hormat kepada Allah. “Takut akan Dia” mempertahankan bobot istilah Ibrani dan merupakan ungkapan Indonesia yang wajar dalam konteks Alkitab.
- source_word: יִזְכֹּר
  choice: Ia akan mengingat
  rationale: Bentuk imperfektif dapat dipahami sebagai pernyataan masa depan, khususnya bersama “untuk selama-lamanya”. Terjemahan ini mempertahankan idiom bahwa Allah mengingat perjanjian-Nya, yang dalam konteks Alkitab mencakup tindakan sesuai dengan perjanjian itu.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini secara alami menyatakan keberlangsungan tanpa akhir dalam konteks kesetiaan terhadap perjanjian.
- source_word: בְּרִיתוֹ
  choice: perjanjian-Nya
  rationale: “Perjanjian” adalah padanan baku dan tepat bagi hubungan serta komitmen yang ditetapkan Allah; akhiran “-Nya” mewakili pronomina milik dalam teks Ibrani.
theological_decisions:
- issue: Makna Allah “mengingat” perjanjian
  choice: Mempertahankan “Ia akan mengingat perjanjian-Nya” sebagai idiom kesetiaan perjanjian yang terwujud dalam tindakan
  alternative: “Ia mengingat perjanjian-Nya” sebagai pernyataan umum yang tak dibatasi waktu
  rationale: Dalam bahasa Ibrani Alkitab, Allah mengingat perjanjian bukan sekadar mengingat secara mental, melainkan bertindak sesuai dengannya. Kata “mengingat” tetap dipertahankan agar idiom asli dan ketegangan teologisnya tidak diparafrasakan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab Indonesia. Struktur dua klausa dan kesejajaran puisi dipertahankan.
