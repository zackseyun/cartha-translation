id: PSA.93.4
reference: Psalms 93:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/קֹּל֨וֹת מַ֤יִם רַבִּ֗ים אַדִּירִ֣ים מִשְׁבְּרֵי יָ֑ם אַדִּ֖יר בַּ/מָּר֣וֹם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: id
  text: Lebih perkasa daripada deru air yang besar[a], daripada deburan ombak laut yang dahsyat, Yahweh[b] di tempat tinggi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "suara banyak air."'
    reason: Alternatif leksikal untuk קֹלוֹת מַיִם רַבִּים; "deru" menerjemahkan citra bunyi air secara idiomatis.
  - marker: b
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan "TUHAN."'
    reason: Menjelaskan bentuk nama ilahi dan kebiasaan penerjemahan tradisional.
lexical_decisions:
- source_word: מִקֹּלוֹת
  choice: daripada gemuruh
  rationale: מִן berfungsi sebagai pembanding, sedangkan bentuk jamak קֹלוֹת menggambarkan bunyi keras air. “Gemuruh” alami dalam bahasa Indonesia dan mempertahankan citra auditif.
- source_word: מַיִם רַבִּים
  choice: air yang besar
  rationale: Ungkapan ini menunjuk pada massa air yang luas dan kuat. “Air yang besar” mempertahankan keluasan makna Ibrani tanpa membatasinya menjadi jenis perairan tertentu.
- source_word: אַדִּירִים
  choice: perkasa
  rationale: Bentuk jamak ini menerangkan gelombang laut dan menonjolkan kekuatannya. “Perkasa” menyampaikan daya serta kedahsyatan unsur alam.
- source_word: מִשְׁבְּרֵי יָם
  choice: gelombang laut
  rationale: מִשְׁבָּר menunjuk pada ombak yang pecah atau menerjang. “Gelombang laut” jelas dan wajar bagi pembaca Indonesia; sifat “perkasa” menyampaikan daya gelombang tersebut.
- source_word: אַדִּיר
  choice: agung
  rationale: Ketika dikenakan kepada Yahweh, kata ini memadukan kebesaran, kemuliaan, dan kuasa. “Agung” cocok dengan konteks kerajaan mazmur serta membentuk perbandingan yang jelas.
- source_word: בַּמָּרוֹם
  choice: di tempat tinggi
  rationale: Terjemahan ini mempertahankan gambaran ketinggian dan keluhuran tanpa mempersempit acuannya secara eksplisit menjadi surga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
theological_decisions:
- issue: Daya komparatif frasa-frasa yang diawali מִן
  choice: Yahweh dinyatakan lebih agung daripada gemuruh air dan gelombang laut.
  alternative: Baris pertama dapat dibaca sebagai seruan mengenai kuatnya air dan gelombang, lalu diikuti pernyataan tersendiri bahwa Yahweh agung di tempat tinggi.
  rationale: Pengulangan מִן paling wajar membentuk perbandingan, tetapi susunan puitis Ibrani memungkinkan pembacaan yang lebih longgar; kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung. Transliterasi mempertahankan nama itu, sementara bentuk tradisional Indonesia dicatat untuk membantu pembaca.
translation_notes:
  register: Bahasa puitis modern dan bermartabat. “Gemuruh” menghidupkan citra bunyi, sedangkan pasangan “perkasa/agung” membedakan kekuatan laut dari keagungan Yahweh tanpa menghilangkan hubungan leksikal kata Ibrani yang sama.
