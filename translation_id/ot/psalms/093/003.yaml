  text: נָשְׂא֤וּ נְהָר֨וֹת יְֽהוָ֗ה נָשְׂא֣וּ נְהָר֣וֹת קוֹלָ֑/ם יִשְׂא֖וּ נְהָר֣וֹת דָּכְיָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
translation:
  language: id
  text: 'Sungai-sungai[a] telah meninggi, ya Yahweh;

    sungai-sungai telah mengangkat suaranya;

    sungai-sungai mengangkat gelombang-gelombangnya yang mengempas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banjir-banjir.” Kata Ibrani ini biasanya berarti “sungai-sungai,” tetapi dalam konteks ini dapat dipahami sebagai luapan air yang dahsyat.
    reason: lexical_alternative
  - marker: b
    text: Atau “hempasannya” atau “deburannya.” Kata Ibrani pada bagian ini langka dan menggambarkan daya air yang menghantam atau pecah bergelora.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: telah meninggi / meninggikan
  rationale: Kata kerja נשׂא berarti mengangkat, membawa, atau meninggikan. Pada baris pertama objeknya tidak disebutkan, sehingga “telah meninggi” secara alami menggambarkan naiknya air. Pada dua baris berikutnya, bentuk transitif “meninggikan” mempertahankan pengulangan Ibrani. Dua bentuk perfektif diterjemahkan “telah,” sedangkan bentuk imperfektif terakhir diterjemahkan sebagai kala kini yang hidup dan klimaktis.
- source_word: נְהָרוֹת
  choice: sungai-sungai
  rationale: Makna biasa nomina ini adalah “sungai-sungai.” Pilihan “banjir” mungkin menonjolkan air yang kacau, tetapi konteks sudah menyampaikan kedahsyatan air tanpa menggeser arti leksikal dasarnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi “Yahweh,” dan partikel “ya” menandai sapaan langsung dalam bahasa Indonesia.
- source_word: קוֹלָם
  choice: suaranya
  rationale: קוֹל dapat berarti suara atau bunyi. “Suaranya” mempertahankan personifikasi puitis sungai-sungai yang bersuara.
- source_word: דָּכְיָם
  choice: gelombangnya yang mengempas
  rationale: Nomina langka ini menunjuk pada hempasan, deburan, atau gelombang yang menghantam. Ungkapan ini menyampaikan kekuatan air secara jelas sekaligus mempertahankan citra konkret.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh, dalam sapaan “ya Yahweh”
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi dalam sapaan langsung. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Pengulangan “sungai-sungai” dan “meninggi/meninggikan” dipertahankan untuk mencerminkan paralelisme serta gerak klimaktis teks Ibrani.
