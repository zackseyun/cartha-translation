base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: id
  text: 'Kesaksian-Mu sungguh dapat dipercaya;

    pantaslah kekudusan bagi rumah-Mu,

    ya Yahweh, sepanjang masa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk panjangnya hari-hari”; juga dapat diterjemahkan “selama-lamanya.”
    reason: Menjelaskan bentuk Ibrani לְאֹרֶךְ יָמִים secara lebih tepat serta nilai idiomatisnya.
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: kesaksian-kesaksian-Mu
  rationale: Bentuk jamak עֵדוֹת menunjuk pada kesaksian atau pernyataan ilahi, khususnya dalam konteks perjanjian. Pilihan ini mempertahankan citra dasarnya tanpa mempersempit makna menjadi ketetapan hukum saja.
- source_word: נֶאֶמְנוּ מְאֹד
  choice: sungguh dapat dipercaya
  rationale: Bentuk Nifal dari אמן menyatakan keteguhan dan keterandalan; מְאֹד berfungsi sebagai penguat. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: לְבֵיתְךָ
  choice: bagi rumah-Mu
  rationale: בַּיִת secara harfiah berarti rumah dan dalam konteks ini dapat menunjuk pada tempat kudus atau bait Allah. 'Rumah-Mu' mempertahankan citra Ibraninya.
- source_word: נַאֲוָה קֹדֶשׁ
  choice: kekudusan patut
  rationale: נַאֲוָה menyatakan sesuatu yang pantas, layak, atau selaras; קֹדֶשׁ adalah kekudusan. Susunan Indonesia ini menyampaikan bahwa kekudusan merupakan sifat yang selayaknya melekat pada rumah Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: לְאֹרֶךְ יָמִים
  choice: sepanjang masa
  rationale: Secara harfiah ungkapan ini berarti 'sepanjang hari-hari' dan secara idiomatis menyatakan kelangsungan yang tidak berakhir. 'Sepanjang masa' menyampaikan maknanya secara wajar sambil tetap dekat dengan citra durasi panjang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi ilahi. Transliterasi 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan waktu לְאֹרֶךְ יָמִים
  choice: sepanjang masa
  alternative: selama-lamanya; sepanjang hari-hari
  rationale: Ungkapan Ibrani dapat dipahami secara idiomatis sebagai durasi kekal, sedangkan bentuk harfiahnya menggambarkan panjangnya hari-hari. Terjemahan utama memakai ungkapan Indonesia yang alami, dan bentuk harfiahnya dicatat dalam catatan kaki.
- issue: Hubungan sintaksis nama Yahweh dengan klausa terakhir
  choice: ya Yahweh sebagai sapaan dalam klausa tentang rumah-Mu
  alternative: Yahweh sebagai awal pernyataan berikutnya
  rationale: Aksen Masoret dan alur kalimat mendukung pembacaan nama ilahi sebagai sapaan, tetapi posisi katanya tetap memiliki sedikit keluwesan. Terjemahan mempertahankan sapaan itu tanpa menjadikannya subjek klausa baru.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ulang 'kesaksian-kesaksian' mempertahankan jamak sumber; 'patut bagi' dipilih untuk nada puitis yang tetap mudah dipahami. Baris puisi mengikuti dua pernyataan utama dan klausa penutup.
