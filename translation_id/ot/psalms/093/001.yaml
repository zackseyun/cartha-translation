id: PSA.93.1
reference: Psalms 93:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: id
  text: Yahweh memerintah[a]; Ia berbalut keagungan. Yahweh berbalut kekuatan; Ia mengikatkan kekuatan itu di pinggang-Nya[b]. Sungguh, dunia berdiri teguh; tidak akan goyah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yahweh telah menjadi Raja.” Bentuk Ibraninya dapat bernuansa permulaan pemerintahan, tetapi dalam konteks ini kemungkinan besar memaklumkan pemerintahan-Nya yang sedang berlangsung.'
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, Ia telah mengikat pinggang-Nya sendiri. Gambarannya ialah mengenakan kekuatan seperti ikat pinggang atau perlengkapan seorang pejuang.
    reason: cultural_note
  - marker: c
    text: 'Atau: “dunia yang didiami telah ditegakkan dengan kokoh; tidak akan terhuyung.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: מָלָךְ
  choice: memerintah
  rationale: Dalam mazmur kerajaan ini, bentuk qatal paling wajar menyatakan pemerintahan Yahweh sebagai kenyataan kini; kemungkinan nuansa ingresif dicatat dalam catatan kaki.
- source_word: גֵּאוּת
  choice: keagungan
  rationale: Dalam rujukan kepada Yahweh, kata ini menyatakan kemuliaan dan kebesaran luhur, bukan kesombongan negatif.
- source_word: לָבֵשׁ
  choice: berbalut
  rationale: Menjaga metafora pakaian dan pengulangan puitis, sekaligus terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: עֹז
  choice: kekuatan
  rationale: Padanan langsung dan mudah dipahami yang sesuai dengan gambaran kerajaan dan kesiapan bertindak.
- source_word: הִתְאַזָּר
  choice: telah mengikatkannya pada pinggang-Nya
  rationale: Menyatakan tindakan refleksif mengikat kekuatan seperti ikat pinggang atau perlengkapan, dengan pronomina yang merujuk pada 'kekuatan'.
- source_word: אַף
  choice: Sungguh
  rationale: Menangkap fungsi penegasan yang menghubungkan pemerintahan Yahweh dengan keteguhan dunia.
- source_word: תִּכּוֹן
  choice: berdiri teguh
  rationale: Mengungkapkan keadaan telah ditegakkan dengan kokoh secara alami dalam bahasa Indonesia.
- source_word: תֵּבֵל
  choice: dunia
  rationale: Merujuk pada dunia yang teratur dan didiami; 'dunia' merupakan padanan ringkas dan alami.
- source_word: בַּל תִּמּוֹט
  choice: tidak akan goyah
  rationale: Menyampaikan ketidakstabilan atau keguncangan yang disangkal oleh ungkapan Ibrani secara idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi.
- issue: Aspek מָלָךְ dalam mazmur kerajaan
  choice: memerintah
  alternative: telah menjadi Raja
  rationale: Konteks terutama memaklumkan pemerintahan Yahweh sebagai kenyataan kini, tetapi bentuk Ibraninya juga dapat dipahami secara ingresif; ambiguitas itu dipertahankan melalui catatan kaki.
- issue: Hubungan עֹז dengan verba di sekitarnya
  choice: Yahweh berbalut kekuatan; Ia telah mengikatkannya pada pinggang-Nya
  alternative: Yahweh berbalut dan mengikatkan kekuatan pada pinggang-Nya
  rationale: Urutan ini mengikuti aksen dan susunan Masoret dengan mengaitkan 'kekuatan' pertama-tama pada 'berbalut', sambil membiarkan tindakan mengikat diri mengambil objeknya dari klausa sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan khidmat. Paralelisme, pengulangan nama Yahweh, metafora pakaian dan ikat pinggang, serta peralihan menuju keteguhan dunia dipertahankan tanpa membuat struktur ayat terasa kaku.
