id: PSA.93.2
reference: Psalms 93:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נָכ֣וֹן כִּסְאֲ/ךָ֣ מֵ/אָ֑ז מֵֽ/עוֹלָ֣ם אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/002.yaml
  text: Your throne is established from of old[a]; you are from everlasting.
translation:
  language: id
  text: Takhta-Mu teguh sejak dahulu kala[a]; Engkau ada sejak kekekalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Takhta-Mu teguh sejak zaman purba; Engkau ada dari kekal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: teguh
  rationale: Bentuk ini menyatakan keadaan yang kokoh atau mantap. “Teguh” menerjemahkan nuansa statif secara langsung tanpa mengharuskan gagasan tentang suatu tindakan pendirian pada masa tertentu.
- source_word: כִּסְאֲךָ
  choice: Takhta-Mu
  rationale: כִּסֵּא berarti “takhta,” dan akhiran orang kedua maskulin tunggal diterjemahkan dengan “-Mu.”
- source_word: מֵאָז
  choice: sejak dahulu kala
  rationale: Dalam konteks puitis ini, ungkapan tersebut menunjuk pada masa lampau yang sangat jauh. “Sejak dahulu kala” alami dalam bahasa Indonesia dan tetap membedakannya dari מֵעוֹלָם pada klausa berikutnya.
- source_word: מֵעוֹלָם
  choice: sejak kekekalan
  rationale: Dalam rujukannya kepada Allah, עוֹלָם menyatakan masa lampau tanpa batas. “Sejak kekekalan” mempertahankan bobot temporal dan teologisnya tanpa menambahkan istilah metafisis di luar teks.
- source_word: אָתָּה
  choice: Engkau ada
  rationale: Pronomina mandiri ini berfungsi sebagai predikat bersama frasa temporal yang mendahuluinya. Kata “ada” ditambahkan agar hubungan predikatif itu jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa temporal tentang keberadaan Allah
  choice: Engkau ada sejak kekekalan
  alternative: Engkau ada dari kekal
  rationale: Terjemahan ini menegaskan keberadaan Allah yang melampaui masa lampau tanpa batas, tetapi tidak memperluas pernyataan ayat menjadi rumusan metafisis yang lebih teknis.
- issue: Keadaan takhta Allah
  choice: Takhta-Mu teguh
  alternative: Takhta-Mu telah ditegakkan
  rationale: Bahasa Ibrani terutama menyoroti keadaan takhta yang kokoh. Pilihan “teguh” tidak memaksakan pertanyaan apakah bentuk itu harus dipahami sebagai tindakan pasif pada suatu saat atau sebagai keadaan yang tetap.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Kapitalisasi pada “-Mu” dan “Engkau” mengikuti register Alkitab Indonesia yang lazim. Paralelisme dua ungkapan waktu dipertahankan, dengan perbedaan antara masa purba dan kekekalan tetap terlihat.
