source:
  edition: WLC
  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
translation:
  language: id
  text: Engkau menyembunyikan wajah-Mu[a], mereka menjadi gentar; Engkau mengambil napas mereka[b], mereka mati dan kembali ke debu mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hadirat-Mu.” Dalam bahasa Ibrani, “wajah-Mu” merupakan ungkapan yang lazim untuk kehadiran atau perkenanan pribadi.
    reason: lexical_alternative
  - marker: b
    text: Atau “roh mereka.” Kata Ibrani רוּחַ dapat berarti “napas,” “angin,” atau “roh”; konteks kematian dan kembali ke debu di sini lebih mendukung “napas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר
  choice: menyembunyikan
  rationale: Bentuk Hifil dari סתר berarti menyembunyikan atau menutupi; padanan ini alami dan mempertahankan gambaran relasional dalam bahasa Ibrani.
- source_word: פָּנֶיךָ
  choice: wajah-Mu
  rationale: Secara harfiah berarti 'wajah-Mu'. Ungkapan konkret ini dipertahankan karena jelas dan puitis, sementara makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: יִבָּהֵלוּן
  choice: menjadi gentar
  rationale: Bentuk Nifal dari בהל menyatakan kegemparan, ketakutan, atau kecemasan yang kuat. 'Menjadi gentar' terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: תֹּסֵף
  choice: mengambil
  rationale: Kata אסף dapat berarti mengumpulkan, menarik, atau mengambil. Dengan 'napas mereka' sebagai objek, 'mengambil' menyampaikan tindakan Allah menarik kembali daya hidup tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: רוּחָם
  choice: napas mereka
  rationale: רוּחַ dapat berarti napas, angin, atau roh. Dalam kesejajaran dengan kematian dan kembali menjadi debu, 'napas' paling sesuai, tetapi kemungkinan 'roh' tetap dicatat.
- source_word: יִגְוָעוּן
  choice: mereka mati
  rationale: גוע berarti mengembuskan napas terakhir, binasa, atau mati. 'Mati' merupakan padanan modern yang paling jelas.
- source_word: עֲפָרָם
  choice: debu mereka
  rationale: Akhiran pronominal Ibrani secara eksplisit berarti 'mereka'. Terjemahan ini mempertahankan bentuk yang agak mencolok dalam teks sumber dan kaitannya dengan kefanaan makhluk.
- source_word: יְשׁוּבוּן
  choice: kembali
  rationale: שוב berarti kembali; padanan ini alami dalam ungkapan tentang kembali menjadi debu.
theological_decisions:
- issue: Makna רוּחָם dalam konteks penciptaan dan kematian
  choice: napas mereka
  alternative: roh mereka
  rationale: Konteks menggambarkan makhluk kehilangan daya hidup, mati, dan kembali menjadi debu. 'Napas' paling langsung menyatakan ketergantungan hidup kepada Allah tanpa menetapkan suatu antropologi tentang roh yang terpisah.
- issue: Bahasa antropomorfis tentang wajah Allah
  choice: wajah-Mu
  alternative: hadirat-Mu
  rationale: Gambaran Ibrani dipertahankan agar daya puitis dan ketegangan teologisnya tidak diratakan menjadi ungkapan abstrak. Makna idiomatis berupa kehadiran atau perkenanan dijelaskan dalam catatan.
- issue: Makna bentuk posesif עֲפָרָם
  choice: debu mereka
  alternative: debu
  rationale: Teks Ibrani menyatakan 'debu mereka'. Walaupun 'kembali menjadi debu' lebih lazim dalam bahasa Indonesia, bentuk posesif dipertahankan demi kesetiaan pada teks dan gema asal-usul serta kefanaan makhluk.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme antarklausa dipertahankan; pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab berbahasa Indonesia.
