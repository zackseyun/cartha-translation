  text: אָשִׁ֣ירָה לַ/יהוָ֣ה בְּ/חַיָּ֑/י אֲזַמְּרָ֖ה לֵ/אלֹהַ֣/י בְּ/עוֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/033.yaml
  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: id
  text: Aku hendak bernyanyi bagi Yahweh sepanjang hidupku; aku hendak bermazmur bagi Allahku selama aku masih ada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “selama aku masih hidup.” Ungkapan Ibrani ini dapat menunjuk pada keberadaan yang terus berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁירָה
  choice: Aku hendak bernyanyi
  rationale: Bentuk kohortatif orang pertama tunggal menyatakan tekad atau niat. “Hendak bernyanyi” menyampaikan nuansa volitif itu secara alami dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menunjukkan arah atau penerima pujian. Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: בְּחַיָּי
  choice: sepanjang hidupku
  rationale: Secara harfiah berarti “dalam hidupku”, tetapi dalam konteks ini menyatakan rentang waktu selama pemazmur hidup.
- source_word: אֲזַמְּרָה
  choice: aku hendak bermazmur
  rationale: Bentuk Piel kohortatif dari זמר menunjuk pada menyanyikan atau memainkan pujian. “Bermazmur” mempertahankan unsur musikal dan membedakannya dari שׁיר pada baris pertama.
- source_word: לֵאלֹהַי
  choice: bagi Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal menyatakan relasi posesif, “Allahku”, sedangkan ל menandai arah pujian.
- source_word: בְּעוֹדִי
  choice: selama aku masih ada
  rationale: Ungkapan ini menyatakan keberadaan yang masih berlanjut. Terjemahan ini mempertahankan variasi terhadap “sepanjang hidupku” tanpa menggunakan ungkapan Indonesia yang kuno atau terlalu filosofis.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Cakupan makna בְּעוֹדִי
  choice: selama aku masih ada
  alternative: selama aku masih hidup
  rationale: Pilihan utama mempertahankan kemungkinan makna keberadaan yang berlanjut sekaligus menjaga variasi paralel dengan בְּחַיָּי. Alternatifnya lebih idiomatis, tetapi menyamakan kedua ungkapan Ibrani.
translation_notes:
  register: Bahasa puitis yang modern dan khidmat. “Hendak” menyatakan tekad pemazmur, sedangkan “bermazmur” mempertahankan perbedaan leksikal antara dua kata kerja musikal dalam teks Ibrani.
