  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: id
  text: Dia menumbuhkan rumput bagi ternak dan tumbuh-tumbuhan bagi kerja manusia, untuk menghasilkan roti dari bumi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: Dia menumbuhkan
  rationale: 'Bentuk partisip Hifil dari צמח menyatakan kausasi: Allah menyebabkan tumbuhnya tumbuh-tumbuhan. Verba Indonesia “menumbuhkan” mempertahankan daya kausatif itu secara alami.'
- source_word: חָצִיר
  choice: rumput
  rationale: Dalam konteks makanan bagi hewan, kata ini menunjuk pada vegetasi pakan; “rumput” jelas dan wajar dalam bahasa Indonesia.
- source_word: לַבְּהֵמָה
  choice: bagi ternak
  rationale: בְּהֵמָה di sini paling mungkin menunjuk secara kolektif pada hewan peliharaan yang merumput. “Ternak” lebih tepat dan alami daripada istilah luas seperti “binatang”.
- source_word: וְעֵשֶׂב
  choice: dan tanaman
  rationale: עֵשֶׂב mencakup tumbuh-tumbuhan yang berguna bagi manusia dan tidak terbatas pada rempah atau herba; “tanaman” sesuai dengan konteks pengusahaan.
- source_word: לַעֲבֹדַת הָאָדָם
  choice: untuk diusahakan manusia
  rationale: עֲבֹדָה dapat berarti pekerjaan, pelayanan, atau pengusahaan. Dalam konteks hasil bumi, “diusahakan” menyampaikan keterlibatan kerja manusia tanpa membatasi secara sempit pada satu kegiatan pertanian.
- source_word: הָאָדָם
  choice: manusia
  rationale: אָדָם dipakai secara generik untuk umat manusia, bukan untuk seorang laki-laki tertentu. “Manusia” mempertahankan cakupan representatif tersebut secara tepat dalam bahasa Indonesia.
- source_word: לְהוֹצִיא
  choice: untuk menghasilkan
  rationale: Infinitif ini dapat menyatakan tujuan atau hasil. “Untuk menghasilkan” alami dalam konteks pertanian dan tidak menambahkan subjek yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: לֶחֶם
  choice: roti
  rationale: Makna leksikal langsung לֶחֶם adalah “roti”; meskipun dapat berarti makanan secara umum, gambaran pertanian mendukung terjemahan konkret ini.
- source_word: מִן הָאָרֶץ
  choice: dari bumi
  rationale: אֶרֶץ menunjuk pada bumi atau tanah sebagai sumber hasil. “Dari bumi” setia pada cakupan puitis ungkapan tersebut.
theological_decisions:
- issue: Makna generik הָאָדָם
  choice: manusia
  alternative: umat manusia
  rationale: Kata benda tunggal ini bersifat generik dan mencakup manusia secara keseluruhan. Bahasa Indonesia tidak memerlukan bentuk maskulin untuk mempertahankan fungsi representatifnya.
- issue: Hubungan tanaman dengan עֲבֹדַת manusia
  choice: untuk diusahakan manusia
  alternative: untuk pekerjaan manusia; untuk keperluan manusia
  rationale: Frasa Ibrani padat dan dapat menekankan kerja/pengusahaan manusia atau manfaat tanaman bagi manusia. Teks utama memilih ungkapan yang cocok dengan konteks pertanian, sedangkan catatan mempertahankan keluasan leksikalnya.
- issue: Subjek tersirat pada לְהוֹצִיא
  choice: tidak menyebutkan subjek secara eksplisit
  alternative: agar manusia menghasilkan; sehingga Dia menghasilkan
  rationale: Bahasa Ibrani tidak mengulang subjek infinitif. Rumusan “untuk menghasilkan” menjaga keterbukaan hubungan sintaksis antara karya Allah, pengusahaan manusia, dan hasil bumi.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. “Dia” mempertahankan subjek ilahi dari konteks mazmur; “ternak” dan “tanaman” dipilih agar mudah dipahami pembaca umum. Struktur akhir sengaja tidak memasukkan subjek baru pada “menghasilkan” supaya ambiguitas sintaksis bahasa Ibrani tetap terjaga.
