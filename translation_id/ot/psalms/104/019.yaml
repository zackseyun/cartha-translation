  text: עָשָׂ֣ה יָ֭רֵחַ לְ/מוֹעֲדִ֑ים שֶׁ֝֗מֶשׁ יָדַ֥ע מְבוֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/019.yaml
  text: He made the moon for appointed times[a]; the sun knows its setting.
translation:
  language: id
  text: Ia menjadikan bulan untuk waktu-waktu yang ditetapkan[a]; matahari tahu saat terbenamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “musim-musim” atau “hari-hari raya”; kata Ibrani ini dapat merujuk pada waktu-waktu yang tetap atau ditentukan, termasuk waktu perayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: menjadikan
  rationale: Bentuk Qal ini lazim berarti ‘membuat’ atau ‘menjadikan’. Subjeknya, yaitu Allah, tersirat dari konteks; ‘menjadikan’ menyatakan tindakan penciptaan tanpa menafsirkan verba ini sebagai ‘menetapkan’.
- source_word: יָרֵחַ
  choice: bulan
  rationale: Padanan langsung dan alami bagi benda langit yang dimaksud.
- source_word: לְמוֹעֲדִים
  choice: untuk waktu-waktu yang ditetapkan
  rationale: מוֹעֵד dapat menunjuk pada waktu yang tetap atau ditentukan, musim, maupun hari raya. Ungkapan ini mempertahankan keluasan maknanya dalam konteks keteraturan ciptaan.
- source_word: שֶׁמֶשׁ
  choice: matahari
  rationale: Padanan baku dalam bahasa Indonesia.
- source_word: יָדַע
  choice: tahu
  rationale: Terjemahan langsung yang mempertahankan personifikasi puitis matahari, alih-alih mengubahnya menjadi uraian fungsi semata.
- source_word: מְבוֹאוֹ
  choice: saat terbenamnya
  rationale: Secara harfiah berkaitan dengan masuk atau tempat masuk; ketika merujuk pada matahari, makna idiomatisnya adalah terbenam. Penambahan ‘saat’ menghasilkan bahasa Indonesia yang alami dan menonjolkan dimensi waktu dalam paralelisme ayat.
theological_decisions:
- issue: Cakupan makna מוֹעֲדִים dalam konteks penciptaan
  choice: waktu-waktu yang ditetapkan
  alternative: musim-musim; hari-hari raya
  rationale: Ayat ini menggambarkan Allah menata benda-benda langit. Bulan menandai berbagai waktu tetap, yang dapat mencakup musim serta tanggal perayaan. Terjemahan yang luas menghindari pembatasan makna hanya pada gejala musim atau kalender ibadah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Personifikasi pada klausa kedua dipertahankan. Pronomina ‘Ia’ mengikuti konteks mazmur yang menunjuk kepada Allah tanpa menambahkan nama ilahi yang tidak muncul dalam ayat ini.
