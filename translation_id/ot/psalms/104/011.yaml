  text: יַ֭שְׁקוּ כָּל חַיְת֣/וֹ שָׂדָ֑י יִשְׁבְּר֖וּ פְרָאִ֣ים צְמָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/011.yaml
  text: All the beasts of the field drink from them[b][a]; the wild donkeys quench their thirst.
translation:
  language: id
  text: Semua binatang liar di padang minum dari aliran-aliran itu; keledai-keledai liar memuaskan dahaga mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַשְׁקוּ
  choice: minum dari aliran-aliran itu
  rationale: 'Bentuk Hifil secara harfiah dapat berarti ‘memberi minum’ atau ‘menyediakan air’. Karena subjek tersiratnya adalah aliran air pada ayat sebelumnya, bahasa Indonesia alami mengungkapkan hasilnya dari sudut hewan: mereka ‘minum dari aliran-aliran itu’. Acuan jamak dijelaskan dari konteks ayat 10.'
- source_word: כָּל
  choice: Semua
  rationale: Menyampaikan cakupan kolektif seluruh kelompok dengan wajar dalam bahasa Indonesia.
- source_word: חַיְתוֹ שָׂדָי
  choice: binatang liar di padang
  rationale: Frasa konstruksi ini menunjuk kepada makhluk-makhluk liar yang hidup di daerah terbuka. ‘Binatang liar di padang’ jelas, alami, dan mempertahankan latar ruangnya.
- source_word: יִשְׁבְּרוּ
  choice: melepaskan
  rationale: Dengan ‘dahaga’ sebagai objek, verba ini merupakan ungkapan idiomatis untuk memuaskan atau menghilangkan rasa haus. ‘Melepaskan dahaga’ adalah ungkapan Indonesia yang alami dan konkret.
- source_word: פְרָאִים
  choice: keledai-keledai liar
  rationale: Menunjuk kepada keledai liar/onager. ‘Keledai-keledai liar’ mudah dipahami pembaca umum dan tidak memakai istilah zoologis teknis.
- source_word: צְמָאָם
  choice: dahaga mereka
  rationale: Nomina abstrak dengan sufiks orang ketiga jamak; ‘dahaga mereka’ mempertahankan makna dan memberi corak puitis yang tetap mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan jamak pada ‘aliran-aliran’ dan ‘keledai-keledai’ dipakai agar rujukan kontekstual serta kelompok hewan tetap jelas. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan perbedaan makna yang penting bagi pembaca.
