source:
  edition: WLC
  text: יְהִ֤י כְב֣וֹד יְהוָ֣ה לְ/עוֹלָ֑ם יִשְׂמַ֖ח יְהוָ֣ה בְּ/מַעֲשָֽׂי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/031.yaml
  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: id
  text: Kiranya kemuliaan Yahweh tetap selama-lamanya; kiranya Yahweh bersukacita dalam karya-karya-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “bersukacita atas karya-karya-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Kiranya ... tetap
  rationale: Bentuk yiqtol yang berfungsi sebagai jusif menyatakan harapan atau doa. Dalam bahasa Indonesia, “kiranya ... tetap” menyampaikan nuansa itu secara alami ketika dipadukan dengan לְעוֹלָם.
- source_word: כְבוֹד
  choice: kemuliaan
  rationale: “Kemuliaan” merupakan padanan baku dan wajar bagi כָּבוֹד dalam konteks pujian, mencakup kehormatan, keagungan, dan semarak ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: לְעוֹלָם
  choice: selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; “selama-lamanya” alami dalam bahasa Indonesia dan sesuai dengan laras puitis mazmur.
- source_word: יִשְׂמַח
  choice: kiranya ... bersukacita
  rationale: Bentuk ini sejajar dengan jusif pada klausa pertama dan menyampaikan harapan. “Bersukacita” mempertahankan kekuatan serta nuansa puitis verba שׂמח.
- source_word: בְּמַעֲשָׂיו
  choice: atas segala karya-Nya
  rationale: Dalam konteks Mazmur 104, מַעֲשֶׂה menunjuk pada karya-karya ciptaan Allah. “Bersukacita atas” adalah ungkapan Indonesia yang alami bagi relasi yang dinyatakan oleh preposisi בְּ; “segala” menyatakan cakupan bentuk jamak dalam konteks seluruh ciptaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” adalah penggantian tradisional dengan sebuah gelar.
- issue: Relasi Yahweh dengan karya-karya-Nya dalam בְּמַעֲשָׂיו
  choice: bersukacita atas segala karya-Nya
  alternative: bersukacita dalam karya-karya-Nya
  rationale: Preposisi בְּ dapat menyatakan ranah atau objek sukacita. Pilihan “atas” terdengar alami dalam bahasa Indonesia tanpa menentukan lebih jauh apakah sukacita itu dipahami sebagai ‘di dalam’ atau ‘mengenai’ ciptaan; alternatif yang lebih harfiah dicatat.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bernada doa. Pengulangan “kiranya” mempertahankan kesejajaran kedua klausa Ibrani. Kapital pada akhiran pronominal “-Nya” mengikuti kebiasaan penulisan Indonesia ketika merujuk kepada Allah.
