source:
  edition: WLC
  text: תְּשַׁלַּ֣ח ר֭וּחֲ/ךָ יִבָּרֵא֑וּ/ן וּ֝/תְחַדֵּ֗שׁ פְּנֵ֣י אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: id
  text: Ketika Engkau mengutus Roh-Mu[a], mereka diciptakan[b], dan Engkau membarui permukaan tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “napas-Mu” atau “angin-Mu”; kata Ibrani רוּחַ dapat mengandung ketiga arti itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “Engkau mengutus Roh-Mu, mereka diciptakan.”
    reason: previous_rendering
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: mengutus
  rationale: Bentuk Piel dari שׁלח berarti ‘mengirim’ atau ‘mengutus’. ‘Mengutus’ secara wajar menyatakan tindakan aktif Allah tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: רוּחֲךָ
  choice: Roh-Mu
  rationale: רוּחַ dapat berarti ‘roh’, ‘napas’, atau ‘angin’. Dalam konteks penciptaan dan pembaruan ini, ‘Roh-Mu’ paling sesuai dengan tindakan Allah yang memberi kehidupan, sementara keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: יִבָּרֵאוּן
  choice: mereka diciptakan
  rationale: Bentuk Nifal dari ברא menyatakan arti pasif, yaitu ‘diciptakan’. Terjemahan ini tidak memasukkan gagasan ‘diciptakan kembali’, sebab pembaruan baru dinyatakan dalam klausa berikutnya.
- source_word: וּתְחַדֵּשׁ
  choice: dan Engkau membarui
  rationale: Bentuk Piel dari חדשׁ berarti ‘membarui’ atau ‘menjadikan baru’. ‘Membarui’ mempertahankan gagasan pemulihan tanpa menyiratkan penggantian total; kata penghubung ‘dan’ juga dipertahankan.
- source_word: פְּנֵי
  choice: permukaan
  rationale: Secara harfiah kata ini berarti ‘wajah/muka’, tetapi dalam gabungan dengan ‘tanah’, ‘permukaan’ merupakan ungkapan Indonesia yang alami dan tetap menyampaikan gambaran spasial teks Ibrani.
- source_word: אֲדָמָה
  choice: tanah
  rationale: אֲדָמָה menunjuk pada tanah atau bumi sebagai lahan. ‘Tanah’ membedakannya dari istilah kosmis yang lebih luas, אֶרֶץ.
theological_decisions:
- issue: Makna רוּחַ dalam konteks penciptaan
  choice: Roh-Mu
  alternative: napas-Mu atau angin-Mu
  rationale: ‘Roh-Mu’ mempertahankan bobot teologis tindakan Allah yang menciptakan dan memberi kehidupan. Namun, karena kata Ibrani yang sama juga dapat berarti ‘napas’ atau ‘angin’, kemungkinan-kemungkinan itu dicantumkan agar ketegangan leksikal teks tidak dihapus.
- issue: Hubungan sintaksis antara pengutusan Roh dan penciptaan
  choice: Ketika Engkau mengutus Roh-Mu, mereka diciptakan
  alternative: Engkau mengutus Roh-Mu, mereka diciptakan
  rationale: Kata ‘ketika’ menghasilkan kalimat Indonesia yang alami dan memperjelas hubungan erat antara kedua tindakan tanpa menyatakan mekanisme teologis yang lebih terperinci daripada teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Sapaan kepada Allah memakai ‘Engkau’ dan akhiran ‘-Mu’. ‘Permukaan tanah’ dipilih daripada bentuk harfiah ‘muka tanah’ agar alami bagi pembaca masa kini tanpa memperluas אֲדָמָה menjadi seluruh bumi.
