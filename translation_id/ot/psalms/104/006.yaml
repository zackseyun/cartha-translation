source:
  edition: WLC
  text: תְּ֭הוֹם כַּ/לְּב֣וּשׁ כִּסִּית֑/וֹ עַל הָ֝רִ֗ים יַֽעַמְדוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/006.yaml
  text: You covered it with the deep as with a garment[a]; the waters stood above the mountains.
translation:
  language: id
  text: Engkau menutupinya dengan samudra, seperti dengan pakaian[a]; air berdiri di atas gunung-gunung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “samudra dalam” atau “samudra purba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם
  choice: samudra raya
  rationale: Kata ini menunjuk pada perairan dalam atau samudra purba. “Samudra raya” mempertahankan citra perairan kosmis tanpa menjadikannya istilah mitologis.
- source_word: כַּ/לְּבוּשׁ
  choice: seperti dengan pakaian
  rationale: Prefiks כַּ menandai perbandingan, sedangkan לְבוּשׁ berarti pakaian. Bentuk ini mempertahankan hubungan dengan verba “menyelubungi” dan simile Ibrani.
- source_word: כִּסִּיתוֹ
  choice: Engkau menyelubunginya
  rationale: Bentuk verba adalah orang kedua maskulin tunggal dengan sufiks objek orang ketiga maskulin tunggal. “Engkau” mempertahankan sapaan langsung kepada TUHAN; “menyelubungi” mengungkapkan tindakan menutupi seperti dengan pakaian.
- source_word: עַל
  choice: di atas
  rationale: Dalam konteks ini kata tersebut menyatakan posisi air lebih tinggi daripada atau berada di atas gunung-gunung.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Makna lazimnya adalah gunung; bentuk ulang menyampaikan jamak secara alami dalam bahasa Indonesia.
- source_word: יַעַמְדוּ
  choice: berdiri
  rationale: Verba עמד secara harfiah berarti berdiri. Pilihan ini mempertahankan gambaran puitis yang hidup dan tidak menyederhanakannya menjadi sekadar “berada”.
- source_word: מָיִם
  choice: air
  rationale: מָיִם merupakan bentuk gramatikal jamak, tetapi nomina massa “air” adalah ungkapan alami dalam bahasa Indonesia dan tetap merujuk pada perairan yang baru disebut.
theological_decisions:
- issue: Sapaan dan persona verba
  choice: 'Sapaan langsung kepada Allah: “Engkau menyelubunginya”'
  alternative: 'Narasi orang ketiga: “Dia menyelubunginya”'
  rationale: Morfologi Ibrani jelas memakai orang kedua maskulin tunggal, dan konteks mazmur menyapa TUHAN secara langsung. Persona kedua dipertahankan agar struktur pujian langsung tidak berubah.
- issue: Rujukan sufiks objek “-nya”
  choice: Mempertahankan pronomina “-nya” tanpa menjelaskan acuannya di dalam ayat
  alternative: Mengganti pronomina dengan “bumi”
  rationale: Teks Ibrani memakai sufiks pronominal yang acuannya diperoleh dari konteks sebelumnya. Menambahkan “bumi” akan memperjelas secara interpretatif, tetapi mengurangi kesinambungan pronominal dan sedikit melampaui bentuk ayat.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. “Engkau” sesuai dengan sapaan langsung yang khidmat; “samudra raya” menjaga keluasan citra kosmis. Penanda catatan kaki [a] ditempatkan langsung setelah frasa terkait.
