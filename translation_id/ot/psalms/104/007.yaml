  yaml_path: translation/ot/psalms/104/007.yaml
  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
translation:
  language: id
  text: Oleh hardikan-Mu mereka melarikan diri; oleh suara guruh-Mu mereka bergegas pergi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: hardikan-Mu
  rationale: Kata גְּעָרָה menunjuk pada teguran keras yang berdaya memerintah. “Hardikan-Mu” alami dalam bahasa Indonesia dan mempertahankan kekuatan ucapan ilahi terhadap ciptaan.
- source_word: יְנוּסוּן
  choice: mereka melarikan diri
  rationale: Bentuk dari נוּס berarti lari atau melarikan diri. Ungkapan ini menyampaikan gerak menjauh dengan segera dan sesuai dengan air sebagai subjek tersirat dari konteks sebelumnya.
- source_word: קוֹל
  choice: suara
  rationale: Dalam rangkaian dengan רַעַם, קוֹל paling wajar diterjemahkan “suara”, sehingga frasa itu berbunyi alami sebagai “suara guruh-Mu”.
- source_word: רַעַמְךָ
  choice: guruh-Mu
  rationale: רַעַם berarti guruh atau guntur. “Guruh-Mu” mempertahankan citra puitis bunyi badai sebagai pernyataan kuasa Allah.
- source_word: יֵחָפֵזוּן
  choice: mereka bergegas pergi
  rationale: Bentuk dari חפז menyatakan gerakan yang tergesa-gesa, dan dapat pula mengandung nuansa gentar. “Bergegas pergi” mempertahankan geraknya tanpa memastikan nuansa kepanikan yang tidak harus dinyatakan.
- source_word: מִן ... מִן
  choice: oleh ... oleh
  rationale: Walaupun מִן secara dasar berarti “dari”, dalam paralelisme ini kata tersebut menandai sebab atau daya yang membuat air mundur. “Oleh” ringkas, alami, dan mempertahankan hubungan kausal kedua baris.
theological_decisions:
- issue: Rujukan kata kerja jamak “mereka melarikan diri” dan “mereka bergegas pergi”
  choice: Subjek dibiarkan tersirat sebagai “mereka”, merujuk kepada air dalam konteks sebelumnya.
  alternative: 'Menjadikan subjek eksplisit: “air itu melarikan diri”.'
  rationale: Teks Ibrani tidak menyebut ulang subjek dalam ayat ini. Mempertahankan pronomina menjaga kesinambungan dan kepadatan puitis tanpa menambahkan nomina yang tidak terdapat dalam baris tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan ilahi memakai bentuk terikat berhuruf kapital (-Mu). Paralelisme kedua klausa dipertahankan, demikian pula perbedaan antara “melarikan diri” dan “bergegas pergi”.
