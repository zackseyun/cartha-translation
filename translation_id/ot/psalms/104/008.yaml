  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: id
  text: Gunung-gunung naik[a] dan lembah-lembah turun ke tempat yang telah Kautetapkan bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut susunan lain yang juga mungkin dalam puisi Ibrani: “Air naik melintasi gunung-gunung dan turun ke lembah-lembah, menuju tempat yang telah Kautetapkan bagi mereka.” Dalam pembacaan ini, air dipahami sebagai subjek yang tersirat.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ הָרִים
  choice: Gunung-gunung naik
  rationale: Bentuk verba dan nomina Ibrani memungkinkan gunung-gunung menjadi subjek. Pilihan ini mempertahankan gambaran puitis tentang permukaan bumi yang terangkat tanpa menambahkan unsur yang tidak tersurat.
- source_word: יֵרְדוּ בְקָעוֹת
  choice: lembah-lembah turun
  rationale: Paralel dengan klausa pertama dan secara formal mempertahankan verba 'turun'. Ungkapan ini menggambarkan lembah yang menjadi rendah serta tidak mempersempit makna menjadi proses geologis tertentu.
- source_word: אֶל מְקוֹם
  choice: ke tempat
  rationale: Menyatakan arah atau tujuan sebagaimana preposisi אֶל; anak kalimat berikutnya membuat tempat itu spesifik.
- source_word: זֶה יָסַדְתָּ
  choice: yang telah Kautetapkan
  rationale: זֶה berfungsi secara referensial dalam konstruksi puitis ini, sedangkan יסד menyatakan tindakan menetapkan atau meletakkan dasar. 'Kautetapkan' alami dalam bahasa Indonesia dan sesuai dengan konteks penataan ciptaan.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Mempertahankan sufiks pronominal jamak maskulin dan tidak secara diam-diam menentukan apakah acuannya adalah bentuk-bentuk muka bumi atau air yang tersirat.
theological_decisions:
- issue: Subjek dalam baris puisi Ibrani
  choice: 'Gunung-gunung dan lembah-lembah dipahami sebagai subjek verba: gunung naik dan lembah turun.'
  alternative: 'Air dipahami sebagai subjek tersirat: air naik melintasi gunung-gunung dan turun ke lembah-lembah.'
  rationale: Teks Ibrani yang diberi tanda vokal dapat dibaca dengan 'gunung-gunung' dan 'lembah-lembah' sebagai subjek, menghasilkan gambaran koheren mengenai penataan muka bumi. Namun, konteks ayat-ayat sekitar membicarakan surutnya air, sehingga pembacaan alternatif tetap sungguh masuk akal dan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, ringkas, dan bermartabat. Kapitalisasi pada 'Kau-' menandai sapaan langsung kepada Allah menurut kebiasaan ejaan Alkitab Indonesia. Ambiguitas sintaksis Ibrani dipertahankan melalui catatan kaki.
