  text: יִתַּ֤מּוּ חַטָּאִ֨ים מִן הָ/אָ֡רֶץ וּ/רְשָׁעִ֤ים ע֤וֹד אֵינָ֗/ם בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֗ה הַֽלְלוּ יָֽהּ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: id
  text: Biarlah orang-orang berdosa lenyap dari bumi,[a] dan orang-orang fasik tidak ada lagi. Pujilah Yahweh, hai jiwaku. Haleluya![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Biarlah orang-orang berdosa berakhir dari bumi.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Pujilah Yah!” “Yah” adalah bentuk singkat nama Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: biarlah ... lenyap
  rationale: Bentuk imperfek Qal dari תמם di sini menyatakan harapan agar mereka berakhir atau tidak ada lagi. “Biarlah ... lenyap” alami dalam bahasa Indonesia, mempertahankan daya optatif, dan tidak menentukan cara pelenyapan itu.
- source_word: חַטָּאִים
  choice: orang-orang berdosa
  rationale: Nomina/adjektiva substantival jamak ini menunjuk kepada orang yang berdosa, bukan kepada dosa sebagai gagasan abstrak.
- source_word: מִן הָאָרֶץ
  choice: dari bumi
  rationale: Dalam cakrawala penciptaan Mazmur 104, אֶרֶץ paling tepat dipahami sebagai bumi, bukan sebatas suatu negeri.
- source_word: וּרְשָׁעִים
  choice: dan orang-orang fasik
  rationale: “Orang-orang fasik” merupakan padanan baku dan jelas bagi bentuk substantival jamak yang menunjuk kepada mereka yang jahat secara moral.
- source_word: עוֹד אֵינָם
  choice: tidak ada lagi
  rationale: Ungkapan ini menyatakan berakhirnya keberadaan atau kehadiran dan dapat diterjemahkan secara ringkas serta puitis demikian.
- source_word: בָּרֲכִי נַפְשִׁי
  choice: Pujilah ... hai jiwaku
  rationale: Ketika Allah menjadi objek, ברך menyatakan pemberian pujian atau berkat kepada-Nya. “Pujilah” lebih alami dan langsung dipahami dalam bahasa Indonesia, sedangkan “hai jiwaku” mempertahankan seruan kepada diri sendiri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diteruskan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הַלְלוּ יָהּ
  choice: Haleluya!
  rationale: Bentuk liturgis yang telah mapan dalam bahasa Indonesia ini meneruskan seruan Ibrani “Pujilah Yah!”; makna harfiahnya dijelaskan dalam catatan.
theological_decisions:
- issue: Apakah ayat ini mengharapkan berakhirnya dosa atau lenyapnya para pendosa
  choice: Teks menyebut orang-orang berdosa dan orang-orang fasik sebagai pihak yang diharapkan lenyap dari bumi.
  alternative: Kiranya dosa atau kefasikan saja yang lenyap dari bumi.
  rationale: חַטָּאִים dan רְשָׁעִים merupakan sebutan personal. Terjemahan tidak mengalihkan ketegangan imprekatoris teks kepada gagasan abstrak tentang berakhirnya dosa.
- issue: Kadar kepastian atau perintah dalam יִתַּמּוּ
  choice: 'Diterjemahkan sebagai harapan: “Biarlah ... lenyap.”'
  alternative: Pernyataan kepastian “akan lenyap” atau perintah langsung agar mereka dibinasakan.
  rationale: Konteks mendukung nuansa optatif/jusif. Bentuk ini mempertahankan harapan atau doa tanpa mengubahnya menjadi ramalan pasti maupun perintah eksplisit kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Diksi “lenyap” menghindari ungkapan tidak alami “diselesaikan dari bumi” sekaligus mempertahankan arti berakhirnya keberadaan mereka. “Orang-orang” digunakan untuk memperjelas bahwa kedua istilah moral itu menunjuk kepada manusia.
