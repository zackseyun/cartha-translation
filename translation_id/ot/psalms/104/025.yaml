lexical_decisions:
- source_word: זֶה הַיָּם
  choice: Lihatlah laut itu
  rationale: Ungkapan deiktis ini menunjuk kepada laut sebagai objek kekaguman. 'Lihatlah laut itu' alami dalam puisi Indonesia dan mempertahankan daya tunjuk זֶה tanpa menjadikannya sekadar pernyataan keberadaan.
- source_word: גָּדוֹל
  choice: besar
  rationale: Padanan langsung yang sesuai dengan ukuran laut dan tetap bernada puitis.
- source_word: וּרְחַב יָדַיִם
  choice: dan terbentang luas
  rationale: Secara harfiah ungkapan ini memakai bentuk dual 'tangan', tetapi merupakan idiom tentang keluasan ke berbagai arah. Terjemahan ini menyampaikan citra bentangan luas dalam bahasa Indonesia yang wajar.
- source_word: שָׁם
  choice: Di sanalah
  rationale: Menunjuk kembali secara tegas kepada laut yang baru disebut dan mempertahankan penekanan lokatif.
- source_word: רֶמֶשׂ
  choice: makhluk yang berkerumun
  rationale: Nomina kolektif ini merujuk pada makhluk-makhluk yang bergerak atau berkeriapan dalam jumlah besar; dalam konteks laut, 'berkerumun' menyampaikan kesan kelimpahannya tanpa membatasinya pada binatang darat yang merayap.
- source_word: וְאֵין מִסְפָּר
  choice: tanpa terhitung banyaknya
  rationale: Menyampaikan idiom Ibrani bahwa jumlahnya tidak dapat dihitung dengan ungkapan Indonesia yang alami.
- source_word: חַיּוֹת
  choice: makhluk hidup
  rationale: Padanan luas yang tidak mempersempit cakupan kepada jenis hewan tertentu.
- source_word: קְטַנּוֹת עִם גְּדֹלוֹת
  choice: yang kecil maupun yang besar
  rationale: Menjaga pasangan ukuran yang inklusif dan menyampaikan fungsi עִם secara alami dalam bahasa Indonesia.
