    rationale: “Luas kedua tangannya” dapat terbaca sebagai frasa Indonesia yang merujuk pada tangan suatu pelaku. Penjelasan bahwa “tangan” berbentuk ganda dalam idiom Ibrani membuat fungsi idiomatiknya lebih terang.
