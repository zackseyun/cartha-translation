  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
translation:
  language: id
  text: Lihatlah laut itu, besar dan terbentang luas[a]. Di sana ada makhluk-makhluk yang bergerak, tak terbilang banyaknya—makhluk hidup, yang kecil maupun yang besar.
  philosophy: optimal-equivalence
