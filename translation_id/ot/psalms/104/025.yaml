  - severity: low
    issue: Klausa lokatif tanpa predikat eksplisit
    rationale: “Di sanalah makhluk ...” bersifat eliptis. Penambahan “ada” menghasilkan susunan Indonesia yang lebih alami dan tetap menerjemahkan lokatif שָׁם.
