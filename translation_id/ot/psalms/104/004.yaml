  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/004.yaml
  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: id
  text: Ia menjadikan para utusan-Nya angin[a][b], para pelayan-Nya api yang menyala-nyala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menjadikan angin sebagai utusan-Nya, dan nyala api sebagai pelayan-Nya.”
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “angin” juga dapat berarti “roh”. Karena itu, terjemahan tradisional berbunyi, “Ia menjadikan malaikat-malaikat-Nya roh-roh, dan para pelayan-Nya nyala api.” Ibrani 1:7 mengikuti pemahaman tradisional ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: menjadikan
  rationale: Partisipel עשה menggambarkan tindakan khas Allah. 'Menjadikan' mempertahankan daya verbal dan cocok dengan susunan objek-pelengkap dalam baris ini.
- source_word: מַלְאָכָיו
  choice: para utusan-Nya
  rationale: מלאך dapat berarti 'utusan' atau 'malaikat'. 'Para utusan-Nya' mempertahankan arti leksikal yang luas tanpa langsung menentukan bahwa yang dimaksud ialah makhluk surgawi.
- source_word: רוּחוֹת
  choice: angin
  rationale: רוּח dapat berarti 'angin', 'napas', atau 'roh'. Dalam kidung penciptaan Mazmur 104 dan kesejajarannya dengan api, 'angin' paling sesuai dengan gambaran kekuatan alam, sementara kemungkinan 'roh' dicatat dalam catatan kaki.
- source_word: מְשָׁרְתָיו
  choice: para pelayan-Nya
  rationale: Bentuk ini menunjuk kepada mereka yang melayani atau menghadiri. 'Para pelayan-Nya' alami dalam bahasa Indonesia dan mempertahankan nuansa pelayanan.
- source_word: אֵשׁ
  choice: api
  rationale: Kata ini secara langsung berarti 'api' dan dipertahankan untuk menjaga gambaran unsur alam.
- source_word: לֹהֵט
  choice: yang menyala-nyala
  rationale: Bentuk ini menggambarkan api yang berkobar atau menyala. Ungkapan 'yang menyala-nyala' jelas, hidup, dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah ayat ini berbicara tentang malaikat/roh atau tentang utusan/angin sebagai alat Allah
  choice: Ia menjadikan para utusan-Nya angin, para pelayan-Nya api yang menyala-nyala.
  alternative: 'Ia menjadikan malaikat-malaikat-Nya roh-roh, dan para pelayan-Nya nyala api; atau: Ia menjadikan angin sebagai utusan-Nya dan nyala api sebagai pelayan-Nya.'
  rationale: Sintaksis Ibrani serta rentang makna מלאך dan רוח memungkinkan beberapa pemahaman. Konteks penciptaan dalam Mazmur 104 mendukung 'utusan' dan 'angin', tetapi ambiguitas yang asli dan pembacaan tradisional yang tercermin dalam Ibrani 1:7 tetap disajikan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Ia' dipakai secara alami untuk merujuk kepada Allah; bentuk hormat dipertahankan melalui sufiks '-Nya'. Pengulangan 'menyala-nyala' menjaga daya gambar tanpa terdengar teknis.
