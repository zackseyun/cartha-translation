  text: He looks at the earth[a], and it trembles; he touches the mountains, and they smoke.
translation:
  language: id
  text: Ia memandang bumi[a], dan bumi pun gemetar; Ia menyentuh gunung-gunung, dan gunung-gunung itu berasap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Dia yang memandang bumi, dan bumi gemetar; Ia menyentuh gunung-gunung, dan gunung-gunung itu berasap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבִּיט
  choice: Ia memandang
  rationale: Bentuk partisipel Hifil dari נבט secara harfiah menggambarkan Allah sebagai “Dia yang memandang.” Dalam bahasa Indonesia, klausa verbal “Ia memandang” lebih alami dan tetap mempertahankan tindakan yang hidup; bentuk yang lebih formal dicatat dalam catatan kaki.
- source_word: לָאָרֶץ
  choice: bumi
  rationale: אֶרֶץ dapat berarti “tanah” atau “bumi.” Konteks penciptaan yang bersifat kosmis dalam Mazmur 104 mendukung “bumi.”
- source_word: וַתִּרְעָד
  choice: dan bumi pun gemetar
  rationale: Kata רעד menyatakan gemetar atau berguncang. Pengulangan “bumi” memperjelas subjek dalam bahasa Indonesia, sedangkan “pun” menandai tanggapan langsung bumi terhadap pandangan Allah tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
- source_word: יִגַּע
  choice: Ia menyentuh
  rationale: נגע pada dasarnya berarti “menyentuh” atau “mencapai hingga menyentuh.” Pilihan ini mempertahankan gambaran bahwa sentuhan Allah saja membuat gunung-gunung berasap.
- source_word: בֶּהָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak הָרִים secara lazim berarti “gunung-gunung,” sesuai dengan kekuatan gambaran puitis ayat ini.
- source_word: וְיֶעֱשָׁנוּ
  choice: dan semuanya berasap
  rationale: Kata kerja jamak dari עשׁן berarti “berasap” atau “mengeluarkan asap” dan merujuk kembali kepada gunung-gunung. “Semuanya” mengungkapkan rujukan jamak itu secara alami tanpa mengulang nomina.
theological_decisions:
- issue: Subjek ilahi yang tersirat dalam klausa partisipel
  choice: Menggunakan “Ia” dengan rujukan kepada Allah dalam konteks mazmur.
  alternative: “Dia yang memandang bumi, dan bumi gemetar; Ia menyentuh gunung-gunung, dan semuanya berasap.”
  rationale: Teks Ibrani membuka ayat dengan bentuk partisipel substantival, “Dia yang memandang.” Konteks dengan jelas menunjuk kepada Allah, sehingga “Ia memandang” alami dalam bahasa Indonesia dan tidak menambahkan identitas yang asing dari konteks. Bentuk formal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kata ganti “Ia” menjaga register yang khidmat tanpa memakai kapitalisasi kehormatan yang tidak terdapat dalam teks sumber. Paralelisme kedua bagian ayat dipertahankan.
