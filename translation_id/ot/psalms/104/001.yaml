  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: id
  text: Pujilah Yahweh, hai jiwaku! Yahweh, Allahku, Engkau sungguh agung; Engkau mengenakan semarak dan keagungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Pujilah
  rationale: Dalam seruan kepada diri sendiri untuk menyembah Allah, bentuk imperatif ברך paling alami diterjemahkan “Pujilah” dalam bahasa Indonesia; ini menyampaikan tindakan memberkati nama Allah tanpa menimbulkan kesan bahwa manusia menganugerahkan berkat kepada-Nya.
- source_word: נַפְשִׁי
  choice: hai jiwaku
  rationale: Mempertahankan sapaan langsung pemazmur kepada batinnya sendiri. “Hai” memberi penanda vokatif yang wajar dalam puisi Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH agar nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Menyampaikan אֱלוֹהַּ dengan akhiran kepunyaan orang pertama secara ringkas dan alami.
- source_word: גָּדַלְתָּ מְּאֹד
  choice: Engkau sungguh agung
  rationale: Bentuk perfektif גָּדַלְתָּ berfungsi statif dalam konteks pujian. “Sungguh” menyampaikan intensitas מְאֹד, sedangkan “agung” lebih alami bagi kebesaran ilahi daripada “besar” secara harfiah.
- source_word: הוֹד וְהָדָר
  choice: semarak dan keagungan
  rationale: Pasangan kata ini menggambarkan kemegahan ilahi yang tampak dan bersifat kerajaan. Dua unsur dipertahankan sebagai ungkapan yang saling melengkapi.
- source_word: לָבָשְׁתָּ
  choice: Engkau mengenakan ... sebagai pakaian
  rationale: Mempertahankan metafora berpakaian dan nilai perfektif verba. Tambahan “sebagai pakaian” membuat gambaran tersebut jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan selaras dengan bukti sumber serta kebijakan yang diberikan.
- issue: Makna manusia ‘memberkati’ Allah
  choice: Pujilah
  alternative: Berkatilah
  rationale: ברך memang secara leksikal berarti “memberkati”, tetapi ketika Allah menjadi objeknya, maksudnya adalah memuji atau mengagungkan-Nya. “Pujilah” menyampaikan fungsi ibadah itu secara alami tanpa menyiratkan bahwa manusia memberikan berkat kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Kapitalisasi kata ganti ilahi dipakai sebagai konvensi penghormatan bahasa Indonesia, bukan untuk menambahkan pembedaan yang tidak ada dalam bahasa Ibrani.
