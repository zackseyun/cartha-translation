lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: Di atasnya
  rationale: Preposisi עַל dengan akhiran orang ketiga jamak menunjuk pada mata air atau aliran air dalam ayat sebelumnya. “Di atasnya” alami dalam bahasa Indonesia dan mempertahankan hubungan spasial tanpa mempersempitnya menjadi sekadar “di dekatnya”.
- source_word: עוֹף הַשָּׁמַיִם
  choice: burung-burung di langit
  rationale: עוֹף adalah nomina kolektif bagi makhluk terbang, dan konteksnya jelas menunjuk pada burung. Ungkapan “di langit” menyampaikan hubungan dengan הַשָּׁמַיִם secara alami dalam bahasa Indonesia modern.
- source_word: יִשְׁכּוֹן
  choice: berdiam
  rationale: Kata kerja שׁכן berarti tinggal, menetap, atau berdiam. “Berdiam” mempertahankan nuansa puitis tentang tempat hidup tanpa menambahkan gagasan bersarang yang tidak dinyatakan secara eksplisit.
- source_word: מִבֵּין
  choice: dari antara
  rationale: Frasa ini menunjukkan asal suara dari tengah-tengah unsur yang disebut sesudahnya. “Dari antara” tepat sekaligus alami.
- source_word: עֳפָאיִם
  choice: ranting-ranting
  rationale: Nomina jamak yang langka ini tampaknya mengacu pada ranting, dahan, atau dedaunan. “Ranting-ranting” jelas dalam konteks burung yang bersuara dari vegetasi, sementara ketidakpastian leksikal dipertahankan dalam catatan kaki.
- source_word: יִתְּנוּ קוֹל
  choice: mereka memperdengarkan suaranya
  rationale: Secara harfiah idiom ini berarti “memberikan suara.” Terjemahan ini mempertahankan gambaran puitis dan tidak mempersempitnya menjadi “berkicau” atau “bernyanyi,” meskipun suara burung mungkin dimaksudkan.
