translation:
  language: id
  text: Di atasnya burung-burung di langit berdiam; dari antara ranting-ranting[a] mereka mengeluarkan suara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dedaunan” atau “dahan-dahan.” Kata benda Ibrani ini jarang dipakai dan mungkin secara luas menunjuk pada ranting-ranting yang berdaun.
