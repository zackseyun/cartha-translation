  text: שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּ/ן לִ֝וְיָתָ֗ן זֶֽה יָצַ֥רְתָּ לְ/שַֽׂחֶק בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/026.yaml
  text: There the ships move about[a], and Leviathan, which you formed to play in it.
translation:
  language: id
  text: Di sana kapal-kapal hilir mudik, dan Lewiatan yang Kaubentuk agar ia bermain di dalamnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lewiatan, yang Kaubentuk untuk bermain dengannya.” Sebagian orang memahami frasa terakhir sebagai Allah bermain dengan Lewiatan, bukan Lewiatan bermain di dalam laut.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Di sana
  rationale: Keterangan tempat ini merujuk kembali kepada laut pada ayat sebelumnya; bentuk ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: אֳנִיּוֹת
  choice: kapal-kapal
  rationale: Bentuk ulang menyatakan kapal sebagai kelompok umum yang melintasi laut tersebut tanpa perlu menambahkan kata sandang yang tidak dimiliki bahasa Indonesia.
- source_word: יְהַלֵּכוּן
  choice: hilir mudik
  rationale: Bentuk imperfek dari הלך menggambarkan gerak yang berlangsung atau berulang. 'Hilir mudik' menyampaikan gerak kapal ke sana kemari secara alami dan puitis.
- source_word: לִוְיָתָן
  choice: Lewiatan
  rationale: Nama atau sebutan makhluk laut ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia agar daya puitis dan kaitan antarteksnya tetap terpelihara.
- source_word: זֶה
  choice: yang
  rationale: Walaupun secara harfiah berarti 'ini', dalam konstruksi ini kata tersebut paling alami dinyatakan sebagai penghubung klausa relatif yang menerangkan Lewiatan.
- source_word: יָצַרְתָּ
  choice: Kaubentuk
  rationale: Kata יצר menekankan tindakan membentuk atau menjadikan dengan sengaja; 'Kaubentuk' mempertahankan nuansa konkret itu dan menyatakan subjek orang kedua tunggal.
- source_word: לְשַׂחֶק
  choice: untuk bermain
  rationale: Infinitif ini menggambarkan kegiatan bermain atau bersenda; 'bermain' merupakan padanan modern yang jelas dan mempertahankan gambaran puitisnya.
- source_word: בּוֹ
  choice: di dalamnya
  rationale: Akhiran pronomina maskulin tunggal paling wajar merujuk kepada laut dalam konteks sebelumnya dan menyatakannya sebagai tempat Lewiatan bermain. Bentuk pronominal dipertahankan agar tidak terlalu memperjelas teks sumber.
theological_decisions:
- issue: Acuan בּוֹ sesudah לְשַׂחֶק
  choice: Lewiatan dibentuk untuk bermain di dalam laut
  alternative: Lewiatan dibentuk untuk diajak bermain oleh Allah
  rationale: 'Laut pada ayat sebelumnya merupakan acuan kontekstual terdekat: kapal-kapal bergerak di sana dan Lewiatan bermain di dalamnya. Namun, konstruksi Ibrani memungkinkan frasa terakhir dipahami sebagai Allah bermain dengan Lewiatan; kemungkinan lama ini dipertahankan dalam catatan kaki tanpa dimasukkan secara diam-diam ke dalam teks utama.'
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan mudah dipahami. 'Hilir mudik' memberi kesan gerak berulang tanpa istilah bahari yang kurang umum. Kapitalisasi pronomina ilahi pada 'Kaubentuk' dan alternatif 'Kauajak' mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia; nama makhluk itu ditulis 'Lewiatan'.
