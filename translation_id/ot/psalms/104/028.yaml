  yaml_path: translation/ot/psalms/104/028.yaml
  text: You give to them[a], and they gather it; you open your hand, and they are filled with good.
translation:
  language: id
  text: Engkau memberikannya kepada mereka, mereka memungutnya; Engkau membuka tangan-Mu, dan mereka kenyang dengan yang baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka puas dengan yang baik.”'
    reason: Alternatif leksikal untuk יִשְׂבְּעוּן טוֹב; verba ini dapat menyatakan kenyang atau puas, sedangkan טוֹב digunakan secara substantival.
lexical_decisions:
- source_word: תִּתֵּן לָהֶם
  choice: Engkau memberikannya kepada mereka
  rationale: Bentuk orang kedua tunggal menyapa Allah. Akhiran -nya melengkapi verba transitif secara wajar dalam bahasa Indonesia dan merujuk pada apa yang Allah berikan, yang kemudian mereka pungut.
- source_word: יִלְקֹטוּן
  choice: mereka memungutnya
  rationale: לקט berarti mengumpulkan atau memungut. 'Memungutnya' alami dalam konteks makhluk menerima persediaan yang Allah berikan dan tidak membatasi gambaran pada kegiatan pertanian.
- source_word: תִּפְתַּח יָדְךָ
  choice: Engkau membuka tangan-Mu
  rationale: Mempertahankan gambaran antropomorfis yang konkret tentang pemeliharaan Allah; unsur 'lebar-lebar' tidak ditambahkan karena tidak tersurat.
- source_word: יִשְׂבְּעוּן
  choice: mereka dikenyangkan
  rationale: שבע menyatakan keadaan menjadi kenyang atau puas. Bentuk pasif ini mempertahankan kaitan implisit bahwa pemberian Allah membuat mereka kenyang.
- source_word: טוֹב
  choice: dengan yang baik
  rationale: טוב dipakai secara substantival. 'Yang baik' mempertahankan kekompakan dan keluasan ungkapan Ibrani tanpa secara wajib mengubahnya menjadi benda-benda jamak.
theological_decisions:
- issue: Bahasa antropomorfis tentang pemeliharaan Allah
  choice: Mempertahankan ungkapan harfiah 'Engkau membuka tangan-Mu'
  alternative: Engkau menyediakan dengan murah hati
  rationale: Gambaran tangan yang terbuka merupakan bagian penting dari puisi dan teologi mazmur ini; parafrasa abstrak akan menghilangkan citra sumber.
- issue: Arti שבע dengan טוב
  choice: mereka dikenyangkan dengan yang baik
  alternative: mereka dipuaskan dengan hal-hal yang baik
  rationale: Terjemahan utama mempertahankan citra konkret tentang makanan dan kecukupan sekaligus membiarkan טוב tetap luas; alternatif yang lebih idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda titik koma mempertahankan kesejajaran dua bagian ayat.
