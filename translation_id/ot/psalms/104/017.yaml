translation:
  language: id
  text: Di sanalah burung-burung membuat sarangnya; bangau mempunyai rumahnya di pohon-pohon cemara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon-pohon sanobar,” “pohon-pohon juniper,” atau jenis konifer lainnya; spesies yang dimaksud oleh kata Ibrani ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר שָׁם
  choice: Di sanalah
  rationale: Gabungan ungkapan relatif dan penunjuk tempat ini merujuk kepada pepohonan pada ayat sebelumnya. Karena ayat disajikan tersendiri, “Di sanalah” mempertahankan hubungan lokatif secara alami tanpa menghilangkan unsur שָׁם.
- source_word: צִפֳּרִים
  choice: burung-burung
  rationale: Kata ini merupakan sebutan umum bagi burung; bentuk ulang lazim dalam bahasa Indonesia untuk menyatakan jamak generik.
- source_word: יְקַנֵּנוּ
  choice: membuat sarangnya
  rationale: Bentuk verba dari קנן berarti membuat sarang atau bersarang. Ungkapan ini alami dan mempertahankan tindakan membangun atau menempati sarang.
- source_word: חֲסִידָה
  choice: burung ranggung
  rationale: Nama Indonesia baku bagi stork (famili Ciconiidae), dan lebih tepat daripada “bangau,” yang dalam pemakaian umum dapat menunjuk kelompok burung lain.
- source_word: בְּרוֹשִׁים
  choice: pohon-pohon sanobar
  rationale: Istilah Ibrani ini menunjuk sejenis pohon konifer, tetapi spesies tepatnya tidak pasti. “Sanobar” merupakan padanan Indonesia yang bermartabat dan cukup luas, sementara ketidakpastian jenisnya dijelaskan dalam catatan kaki.
- source_word: בֵּיתָהּ
  choice: bersarang di
  rationale: Secara harfiah berarti “rumahnya.” Dalam konteks tempat tinggal burung, “bersarang di” menyampaikan makna idiomatis dengan jelas, meski metafora rumah tidak dipertahankan secara harfiah.
