  text: יִ֭שְׂבְּעוּ עֲצֵ֣י יְהוָ֑ה אַֽרְזֵ֥י לְ֝בָנ֗וֹן אֲשֶׁ֣ר נָטָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/016.yaml
  text: The trees of Yahweh are satisfied[a], the cedars of Lebanon that he planted,
translation:
  language: id
  text: 'Pohon-pohon Yahweh kenyang[a],

    pohon-pohon aras Lebanon yang ditanam-Nya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terpuaskan” atau “mendapat pasokan sepenuhnya.” Kata Ibrani ini menyatakan keadaan menjadi kenyang atau tercukupi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: mendapat air sampai puas
  rationale: Bentuk Qal dari שבע berarti menjadi kenyang atau mendapat pasokan sepenuhnya. Dalam konteks ayat 13–16, yang dibicarakan ialah pepohonan yang menerima air dari hujan; ungkapan ini menyatakan kelimpahan tersebut secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa pohon memiliki kepuasan batin.
- source_word: עֲצֵי יְהוָה
  choice: pohon-pohon Yahweh
  rationale: Frasa konstruksi ini dipertahankan secara langsung. Genitifnya dapat menyiratkan pohon-pohon yang menjadi milik Yahweh, berasal dari-Nya, atau luar biasa megah; terjemahan tidak mempersempitnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai Yahweh, bukan diganti dengan sebuah gelar.
- source_word: אַרְזֵי לְבָנוֹן
  choice: pohon-pohon aras Lebanon
  rationale: Frasa ini mengkhususkan pohon-pohon pada baris pertama. 'Pohon aras' adalah padanan Indonesia yang jelas untuk אֶרֶז, sedangkan Lebanon dipertahankan sebagai nama tempat.
- source_word: אֲשֶׁר נָטָע
  choice: yang ditanam-Nya
  rationale: Klausa relatif menerangkan pohon-pohon aras. Subjek maskulin tunggal yang tersirat mengacu kepada Yahweh; bentuk pasif berpronomina dalam bahasa Indonesia mengungkapkan hubungan itu dengan ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama diri ilahi. Bentuk 'Yahweh' mempertahankannya sebagai nama dan mengikuti transliterasi ilmiah yang lazim tanpa menggantinya dengan gelar.
- issue: Makna frasa עֲצֵי יְהוָה
  choice: pohon-pohon Yahweh
  alternative: pohon-pohon milik Yahweh atau pohon-pohon yang megah
  rationale: Hubungan konstruksi Ibrani tidak menjelaskan secara eksplisit apakah yang ditekankan ialah kepemilikan, asal-usul ilahi, atau keagungan. Terjemahan formal ini mempertahankan keluasan maknanya.
translation_notes:
  register: Puisi modern yang bermartabat dan mudah dipahami. Pemenggalan dua baris memperlihatkan bahwa 'pohon-pohon aras Lebanon' menjelaskan 'pohon-pohon Yahweh'. Ungkapan 'mendapat air sampai puas' dibuat eksplisit berdasarkan konteks terdekat tentang air yang diberikan Allah, sementara catatan kaki mempertahankan gambaran harfiah kata Ibraninya.
