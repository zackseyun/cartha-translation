  text: יֵצֵ֣א אָדָ֣ם לְ/פָעֳל֑/וֹ וְֽ/לַ/עֲבֹ֖דָת֣/וֹ עֲדֵי עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/023.yaml
  text: Man goes out to his work and to his labor until evening[a][b].
translation:
  language: id
  text: Manusia[a] keluar untuk bekerja dan berjerih lelah sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang digunakan berbentuk tunggal dan dapat berarti manusia secara umum atau seorang manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצֵא
  choice: keluar
  rationale: Bentuk Qal imperfek orang ketiga tunggal dari יצא menyatakan tindakan yang lazim dalam rangkaian puitis ini. “Keluar” mempertahankan gagasan bergerak ke luar untuk memulai kegiatan pada siang hari.
- source_word: אָדָם
  choice: Manusia
  rationale: Dalam konteks ini, bentuk tunggal אָדָם mewakili manusia secara umum, berlawanan dengan binatang yang aktif pada malam hari. “Manusia” alami dalam bahasa Indonesia dan tetap dapat berfungsi sebagai nomina kolektif tunggal.
- source_word: לְפָעֳלוֹ
  choice: untuk bekerja
  rationale: פֹּעַל berarti pekerjaan, perbuatan, atau kegiatan. Setelah יצא, preposisi לְ menyatakan tujuan. Bentuk verbal “untuk bekerja” lebih wajar dalam bahasa Indonesia daripada “keluar kepada pekerjaannya” tanpa mengubah makna.
- source_word: וְלַעֲבֹדָתוֹ
  choice: dan berjerih lelah
  rationale: עֲבֹדָה dapat berarti pekerjaan, pelayanan, atau jerih payah. Dalam pasangan puitis dengan פֹּעַל, “berjerih lelah” mempertahankan tumpang tindih makna sekaligus memberi tekanan pada usaha dalam pekerjaan sehari-hari.
- source_word: עֲדֵי עָרֶב
  choice: sampai petang
  rationale: עֲדֵי adalah bentuk puitis yang berarti “sampai”, sedangkan עָרֶב berarti petang. Ungkapan ini menyatakan batas waktu pekerjaan pada siang hari.
theological_decisions:
- issue: Makna generik atau individual dari אָדָם
  choice: Manusia
  alternative: Seorang manusia / orang itu
  rationale: Konteks menggambarkan pola umum kehidupan manusia dalam tatanan ciptaan. Namun, karena bentuk Ibraninya tunggal dan secara leksikal juga dapat menunjuk seorang manusia, kemungkinan itu dicatat tanpa memaksakan salah satu arti individual tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Paralelisme dua istilah pekerjaan dipertahankan melalui pasangan “bekerja” dan “berjerih lelah”, sedangkan bentuk verbal dipilih agar kalimat tidak kaku.
