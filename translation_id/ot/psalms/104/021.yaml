- source_word: שֹׁאֲגִים לַטָּרֶף
  choice: mengaum mencari mangsa
  rationale: לַטָּרֶף menyatakan sasaran atau tujuan auman; 'mencari mangsa' menyampaikan maknanya secara wajar tanpa menambah gagasan bahwa mangsa itu telah diperoleh.
- source_word: וּלְבַקֵּשׁ מֵאֵל אָכְלָם
  choice: dan memohon makanan mereka dari Allah
  rationale: בקש dengan sumber yang ditandai מֵאֵל dipahami sebagai meminta atau memohon dari Allah; bentuk infinitif berkoordinasi dengan tindakan sebelumnya dan dipertahankan dengan 'dan'.
theological_decisions:
- issue: Allah sebagai sumber makanan bagi binatang liar
  choice: memohon makanan mereka dari Allah
  alternative: mencari makanan mereka dari Allah
  rationale: Terjemahan ini mempertahankan gambaran puitis bahwa auman singa merupakan permohonan yang tertuju kepada Allah, tanpa menjelaskan mekanisme providensi lebih jauh.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis; pengulangan jamak pada 'singa-singa' sesuai pemakaian baku, sedangkan 'mengaum' merupakan padanan alami bagi suara singa.
