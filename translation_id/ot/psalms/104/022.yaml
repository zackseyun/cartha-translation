  yaml_path: translation/ot/psalms/104/022.yaml
  text: The sun rises[b][a]; they gather themselves and lie down in their dens.
translation:
  language: id
  text: Matahari terbit; mereka pun menyingkir[a] dan berbaring di sarang mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkumpul,” “dikumpulkan,” atau “mundur.” Kata kerja Ibrani ini dapat dipahami secara pasif (“dikumpulkan”) atau secara refleksif/intransitif (“berkumpul” atau “menarik diri”).
    reason: lexical_alternative
  - marker: b
    text: Atau “tempat persembunyian mereka” atau “kediaman mereka.” Kata Ibrani ini berarti tempat tinggal; konteks binatang di sini mendukung terjemahan “sarang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרַח
  choice: terbit
  rationale: Bentuk Qal imperfek orang ketiga feminin tunggal dari זרח, dengan “matahari” sebagai subjek, menunjuk pada terbitnya matahari. “Terbit” merupakan ungkapan Indonesia yang alami dalam urutan waktu ini.
- source_word: הַשֶּׁמֶשׁ
  choice: matahari
  rationale: Kata benda definit yang secara langsung berarti “matahari”; dalam bahasa Indonesia tidak memerlukan kata sandang tersendiri.
- source_word: יֵאָסֵפוּן
  choice: mereka pun menyingkir
  rationale: Bentuk Nifal imperfek orang ketiga jamak dari אסף dapat berarti “dikumpulkan,” “berkumpul,” atau secara kontekstual “menarik diri/menyingkir.” Dalam konteks singa-singa malam yang kembali ketika matahari terbit, “menyingkir” alami dan tidak menyiratkan adanya pelaku luar; ambiguitas bentuk Ibrani dipertahankan dalam catatan kaki.
- source_word: וְאֶל
  choice: dan ... di
  rationale: Secara harfiah berarti “dan ke/menuju.” Gerak menuju tempat tinggal sudah tersirat dalam “menyingkir,” sedangkan “berbaring di” menghasilkan susunan bahasa Indonesia yang alami.
- source_word: מְעוֹנֹתָם
  choice: sarang mereka
  rationale: מָעוֹן berarti tempat tinggal atau kediaman. Dalam konteks binatang, “sarang” merupakan padanan yang alami dan mudah dipahami, meskipun kata Ibraninya sendiri lebih umum.
- source_word: יִרְבָּצוּן
  choice: berbaring
  rationale: Bentuk Qal imperfek orang ketiga jamak dari רבץ lazim menggambarkan binatang yang berbaring atau mendekam. “Berbaring” jelas dan sesuai dengan gambaran mereka menetap pada siang hari.
