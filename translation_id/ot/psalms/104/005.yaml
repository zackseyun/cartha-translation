lexical_decisions:
- source_word: יָסַד
  choice: meletakkan dasar
  rationale: Ungkapan ini mempertahankan citra arsitektural verba Ibrani yang berarti mendirikan atau menetapkan dengan dasar, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: אֶרֶץ
  choice: bumi
  rationale: Dalam konteks mazmur penciptaan ini, acuan global 'bumi' lebih sesuai daripada 'tanah'.
- source_word: עַל
  choice: di atas
  rationale: Preposisi ini menyatakan letak atau penopangan dalam gambaran arsitektural ayat tersebut.
- source_word: מְכוֹנֶיהָ
  choice: fondasi-fondasinya
  rationale: Nomina ini dapat menunjuk pada dasar, alas, atau tempat penopang yang tetap. Bentuk jamak dipertahankan untuk mencerminkan teks Ibrani.
- source_word: בַּל תִּמּוֹט
  choice: tidak akan terguncang
  rationale: Bentuk pasif verba מוט menyatakan bahwa sesuatu tidak digerakkan, digoyahkan, atau dibuat tidak stabil; 'terguncang' mempertahankan citra kestabilannya.
- source_word: עוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Ungkapan berpasangan ini menegaskan durasi tanpa akhir; padanan Indonesia ini menyampaikan daya penekanannya secara wajar.
theological_decisions:
- issue: Bahasa kosmologis dalam puisi penciptaan
  choice: Mempertahankan gambaran arsitektural bahwa bumi diletakkan di atas fondasi-fondasinya dan tidak akan terguncang.
  alternative: Ia menetapkan bumi dengan kokoh sehingga tidak dapat bergerak.
  rationale: Teks memakai bahasa puitis tentang kestabilan bumi. Terjemahan tidak mengubahnya menjadi uraian ilmiah modern atau memasukkan kerangka doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pronomina 'Ia' mempertahankan rujukan kepada TUHAN dari konteks. Pengulangan 'bumi' pada klausa kedua dipakai agar subjeknya jelas dan alami dalam bahasa Indonesia.
