  yaml_path: translation/ot/psalms/104/002.yaml
  text: covering yourself with light as with a garment[a], stretching out the heavens like a curtain.
translation:
  language: id
  text: 'yang mengenakan terang seperti pakaian,

    yang membentangkan langit seperti tirai[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti kain tenda.” Kata Ibrani ini dapat merujuk pada lembaran kain yang digunakan sebagai bagian dari tenda atau Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹטֶה
  choice: mengenakan
  rationale: Partisipel Qal ini menggambarkan tindakan puitis Allah memakai atau menyelubungi diri-Nya. “Mengenakan” alami dalam bahasa Indonesia bersama objek “terang” dan tidak mengulang kata “pakaian” secara janggal.
- source_word: אוֹר
  choice: terang
  rationale: Nomina ini secara langsung berarti “terang”, yang dalam metafora ini dikenakan Allah; tidak perlu ditafsirkan menjadi “kemegahan” atau konsep abstrak lain.
- source_word: כַשַּׂלְמָה
  choice: seperti pakaian
  rationale: שַׂלְמָה berarti pakaian atau jubah. “Pakaian” mempertahankan cakupan umum istilah Ibrani tanpa mempersempitnya menjadi jenis pakaian tertentu.
- source_word: נוֹטֶה
  choice: membentangkan
  rationale: Partisipel Qal dari נטה menyatakan tindakan merentangkan atau membentangkan. “Membentangkan” wajar untuk gambaran kosmis tentang langit sebagai kain lebar.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Bentuk Ibrani ini dapat menunjuk kepada langit atau segala langit. Dalam bahasa Indonesia, “langit” paling alami dan tetap mempertahankan cakupan kosmis dalam konteks mazmur penciptaan.
- source_word: כַיְרִיעָה
  choice: seperti tirai
  rationale: יְרִיעָה menunjuk pada lembaran kain, khususnya tirai atau kain tenda. “Tirai” menghasilkan gambaran yang ringkas dan puitis, sedangkan nuansa tenda dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Penggambaran antropomorfis tentang Allah yang mengenakan terang dan membentangkan langit
  choice: Mempertahankan metafora puitis secara langsung
  alternative: Memparafrasakannya sebagai Allah yang dikelilingi terang atau yang menyatakan kemegahan-Nya
  rationale: Teks Ibrani memakai gambaran konkret untuk melukiskan keagungan dan kuasa penciptaan Allah. Terjemahan langsung mempertahankan daya puitis dan tidak memasukkan penjelasan teologis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Bentuk “yang mengenakan … yang membentangkan” mempertahankan struktur partisipial Ibrani serta hubungannya sebagai kelanjutan deskripsi dari ayat sebelumnya.
