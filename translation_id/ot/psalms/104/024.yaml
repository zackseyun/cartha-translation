id: PSA.104.24
reference: Psalms 104:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מָֽה רַבּ֬וּ מַעֲשֶׂ֨י/ךָ יְֽהוָ֗ה כֻּ֭לָּ/ם בְּ/חָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝/אָ֗רֶץ קִנְיָנֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: id
  text: Betapa banyak karya-Mu, ya Yahweh! Semuanya Kaubuat dengan hikmat; bumi penuh dengan milik-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "makhluk ciptaan-Mu" atau "segala yang menjadi kepunyaan-Mu". Kata Ibrani ini dapat menunjuk pada apa yang dimiliki atau diperoleh seseorang; dalam konteks ini, kata tersebut mungkin merujuk secara luas pada segala sesuatu yang telah Allah jadikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: Betapa banyak
  rationale: Ungkapan seruan ini menekankan banyaknya dan beragamnya karya Allah; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nada kekaguman.
- source_word: מַעֲשֶׂיךָ
  choice: karya-Mu
  rationale: Dalam konteks mazmur penciptaan, 'karya' mencakup segala sesuatu yang Yahweh kerjakan dan jadikan, serta lebih tepat daripada 'perbuatan' yang dapat terdengar terutama sebagai tindakan historis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: כֻּלָּם בְּחָכְמָה עָשִׂיתָ
  choice: Semuanya Kaubuat dengan hikmat
  rationale: Susunan ini mempertahankan cakupan menyeluruh כֻּלָּם dan nomina חָכְמָה, sekaligus terdengar wajar serta puitis dalam bahasa Indonesia.
- source_word: מָלְאָה הָאָרֶץ
  choice: bumi penuh dengan
  rationale: Bentuk perfek menyatakan keadaan hasil yang kini berlaku; 'bumi' sesuai dengan cakupan kosmis mazmur ini.
- source_word: קִנְיָנֶךָ
  choice: milik-Mu
  rationale: Nomina ini pada dasarnya menunjuk kepada sesuatu yang diperoleh atau dimiliki. 'Milik-Mu' mempertahankan unsur kepemilikan tanpa mempersempitnya hanya menjadi makhluk hidup; catatan kaki menjelaskan kemungkinan kontekstualnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan קִנְיָנֶךָ dalam konteks penciptaan
  choice: milik-Mu
  alternative: makhluk ciptaan-Mu; segala yang Kauperoleh
  rationale: '''Milik-Mu'' menjaga arti leksikal kepemilikan atau pemerolehan dan membiarkan terbuka apakah yang dimaksud secara khusus ialah makhluk ciptaan atau secara luas segala sesuatu yang menjadi kepunyaan Allah.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Bentuk terikat pronominal pada 'karya-Mu', 'Kaubuat', dan 'milik-Mu' mengikuti ejaan baku serta menjaga sapaan langsung kepada Allah.
