  text: הַ֥/מְקָרֶֽה בַ/מַּ֗יִם עֲֽלִיּ֫וֹתָ֥י/ו הַ/שָּׂם עָבִ֥ים רְכוּב֑/וֹ הַֽ֝/מְהַלֵּ֗ךְ עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/003.yaml
  text: who lays the beams of his upper chambers on the waters[a], who makes the clouds his chariot, who walks on the wings of the wind.
translation:
  language: id
  text: yang memasang balok-balok kamar-kamar atas-Nya di atas air, yang menjadikan awan-awan sebagai kereta-Nya, yang berjalan di atas sayap-sayap angin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh”; kata Ibrani רוּחַ dapat berarti angin, napas, atau roh. Di sini “angin” lebih sesuai dengan gambaran alam dalam konteksnya.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְקָרֶה
  choice: yang memasang balok-balok
  rationale: Bentuk partisipel dari קרה menggambarkan tindakan memasang balok atau membuat atap. Pilihan ini mempertahankan gambaran bangunan secara konkret dan tetap wajar dalam bahasa Indonesia.
- source_word: בַמַּיִם
  choice: di atas air
  rationale: Preposisi ב memiliki cakupan makna yang luas. Dalam gambaran arsitektural kosmis ini, 'di atas air' paling jelas menyampaikan letak kamar-kamar atas tersebut.
- source_word: עֲלִיּוֹתָיו
  choice: kamar-kamar atas-Nya
  rationale: Kata ini menunjuk pada ruang atau kamar di bagian atas sebuah bangunan. Bentuk jamak dipertahankan, begitu pula sufiks milik orang ketiga tunggal yang merujuk kepada Allah.
- source_word: הַשָּׂם
  choice: yang menjadikan
  rationale: שׂים berarti menaruh, menetapkan, atau menjadikan. Dengan awan sebagai objek dan kereta sebagai predikat, 'menjadikan' terdengar paling alami.
- source_word: עָבִים
  choice: awan-awan
  rationale: Kata ini menunjuk pada awan atau kumpulan awan, sering kali awan tebal. Bentuk jamak Indonesia mempertahankan bentuk Ibrani tanpa menambahkan sifat yang tidak wajib.
- source_word: רְכוּבוֹ
  choice: sebagai kereta-Nya
  rationale: Nomina ini mengacu pada kendaraan tunggangan, terutama kereta. Kata 'sebagai' membuat konstruksi predikatifnya jelas dan alami dalam bahasa Indonesia.
- source_word: הַמְהַלֵּךְ
  choice: yang berjalan
  rationale: Partisipel הלך secara harfiah menggambarkan berjalan atau bergerak. 'Berjalan' mempertahankan personifikasi puitis yang hidup.
- source_word: עַל כַּנְפֵי
  choice: di atas sayap-sayap
  rationale: עַל berarti 'di atas/pada', sedangkan כַּנְפֵי secara konkret berarti 'sayap-sayap'. Terjemahan ini mempertahankan metafora kecepatan dan gerak.
- source_word: רוּחַ
  choice: angin
  rationale: רוּחַ dapat berarti angin, napas, atau roh. Gambaran awan, kereta, dan sayap dalam konteks ini sangat mendukung makna meteorologis 'angin', sementara kemungkinan 'roh' dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna רוּחַ pada klausa terakhir
  choice: angin
  alternative: roh atau Roh
  rationale: Konteks puitis tentang air, awan, kereta, dan sayap lebih kuat mendukung unsur alam berupa angin. Namun, keluasan makna kata Ibrani tidak dihapuskan; alternatifnya disampaikan dalam catatan kaki tanpa memaksakan rujukan doktrinal tertentu.
translation_notes:
  register: Bahasa puitis, khidmat, dan modern. Pengulangan 'yang' mempertahankan struktur partisipial Ibrani dan irama paralel ayat. Bentuk 'kamar-kamar atas-Nya', 'kereta-Nya', dan 'sayap-sayap angin' menjaga gambaran arsitektural serta kosmis tanpa memperjelasnya secara berlebihan.
