  text: All of them wait for you to give them their food in its time[a][b].
translation:
  language: id
  text: Mereka semua menanti-nantikan[a] Engkau, agar Engkau memberi mereka makanan pada waktunya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memandang kepada-Mu dengan penuh harap” atau “berharap kepada-Mu.”
