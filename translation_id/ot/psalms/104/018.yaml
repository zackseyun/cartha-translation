  yaml_path: translation/ot/psalms/104/018.yaml
  text: The high mountains are for the wild goats[b][a]; the rocks are a refuge for the rock badgers.
translation:
  language: id
  text: Gunung-gunung tinggi menjadi tempat bagi kambing gunung liar[a]; batu-batu cadas menjadi tempat perlindungan bagi hiraks[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ibeks.”
    reason: lexical_alternative
  - marker: b
    text: Hiraks adalah mamalia kecil penghuni daerah berbatu; dahulu istilah ini kadang diterjemahkan dengan nama hewan lain yang kurang tepat.
    reason: lexical_clarification
lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: gunung-gunung tinggi
  rationale: Bentuk ini menerjemahkan nomina jamak הָרִים dan adjektiva הַגְּבֹהִים secara langsung, alami, dan sesuai dengan gambaran habitat pegunungan.
- source_word: לַיְּעֵלִים
  choice: bagi kambing gunung liar
  rationale: יָעֵל menunjuk pada kambing liar pegunungan, khususnya ibeks. Ungkapan ini mudah dipahami pembaca umum, sedangkan nama yang lebih khusus dicantumkan dalam catatan kaki.
- source_word: סְלָעִים
  choice: batu-batu cadas
  rationale: סֶלַע menunjuk pada batu atau bentukan batu yang terjal. 'Batu-batu cadas' menyampaikan habitat berbatu dengan lebih jelas daripada sekadar 'batu-batu' tanpa mempersempitnya menjadi tebing.
- source_word: מַחְסֶה
  choice: tempat perlindungan
  rationale: Nomina ini berarti tempat berlindung atau perlindungan. Pilihan tersebut alami dalam bahasa Indonesia dan mempertahankan gagasan keamanan fisik.
- source_word: לַשְׁפַנִּים
  choice: bagi hiraks
  rationale: שָׁפָן adalah mamalia kecil penghuni daerah berbatu yang lazim diidentifikasi sebagai hiraks, bukan kelinci atau luak. Istilah zoologis ini menghindari identifikasi yang menyesatkan.
