translation:
  language: id
  text: Ia mengalirkan mata-mata air di lembah-lembah[a]; mata-mata air itu mengalir di antara gunung-gunung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di wadi-wadi” atau “di jurang-jurang”; kata Ibrani ini dapat menunjuk pada alur sungai musiman yang biasanya kering, atau pada lembah yang berkaitan dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: Ia mengalirkan
  rationale: Partisipel Hifil menggambarkan tindakan pemeliharaan Allah yang berlangsung. Dalam konteks air, 'mengalirkan' secara alami menyampaikan tindakan membuat atau membiarkan mata air mengalir, tanpa mempertahankan kekakuan harfiah 'mengutus'.
- source_word: מַעְיָנִים
  choice: mata-mata air
  rationale: מַעְיָן menunjuk pada mata air atau sumber air alami. Bentuk ulang menandai jamak secara jelas dalam bahasa Indonesia.
- source_word: בַּנְּחָלִים
  choice: ke lembah-lembah
  rationale: נַחַל dapat berarti wadi, dasar aliran musiman, jurang, atau lembah yang terkait dengannya. 'Lembah-lembah' mudah dipahami dan sesuai dengan gambaran topografis, sedangkan alternatif yang lebih khusus dicatat dalam catatan kaki.
- source_word: בֵּין
  choice: di antara
  rationale: Preposisi ini menunjukkan lokasi atau lintasan di antara gunung-gunung.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: הָרִים lazim berarti gunung-gunung atau perbukitan; 'gunung-gunung' cocok dengan skala gambaran himne penciptaan ini.
- source_word: יְהַלֵּכוּן
  choice: airnya mengalir
  rationale: Bentuk dari הלך secara harfiah berarti 'berjalan/pergi', tetapi ketika mengacu pada air, 'mengalir' merupakan padanan Indonesia yang wajar. Subjek eksplisit 'airnya' menghindari ketidakjelasan rujukan pronomina.
theological_decisions:
- issue: Subjek tersirat pada partisipel הַמְשַׁלֵּחַ
  choice: '''Ia'' merujuk kepada Allah'
  alternative: 'Terjemahan partisipial: ''Dia yang mengalirkan'''
  rationale: Konteks mazmur menyebut tindakan Allah dalam menata dan memelihara ciptaan. Kalimat verbal dengan 'Ia' alami dalam bahasa Indonesia dan mempertahankan rujukan kontekstual tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Repetisi 'mengalirkan ... mengalir' mencerminkan hubungan tindakan Allah dan gerak air, sementara 'airnya' memperjelas subjek klausa kedua.
