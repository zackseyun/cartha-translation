  text: תָּֽשֶׁת חֹ֭שֶׁךְ וִ֣/יהִי לָ֑יְלָה בּֽ/וֹ תִ֝רְמֹ֗שׂ כָּל חַיְת/וֹ יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/020.yaml
  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
translation:
  language: id
  text: Engkau mendatangkan kegelapan, lalu malam pun tiba; pada waktu itulah segala binatang hutan berkeliaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bergerak ke sana kemari” atau “merayap”; kata Ibraninya dapat menggambarkan berbagai jenis gerak binatang pada malam hari dan tidak harus berarti mencari mangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  choice: Engkau mendatangkan
  rationale: Bentuk orang kedua tunggal ini menyapa Allah dan menyatakan tindakan-Nya menempatkan atau menghadirkan kegelapan. “Mendatangkan” alami dalam bahasa Indonesia untuk datangnya gelap serta tetap mempertahankan peran aktif Allah.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Padanan baku yang di sini menunjuk pada datangnya gelap dalam tatanan ciptaan.
- source_word: וִיהִי לָיְלָה
  choice: lalu malam pun tiba
  rationale: Ungkapan ini menyatakan hasil atau peralihan keadaan sesudah Allah mendatangkan kegelapan. “Malam pun tiba” lebih alami daripada terjemahan harfiah “dan jadilah malam” tanpa mengubah hubungan antarklausa.
- source_word: בּוֹ
  choice: pada waktu itulah
  rationale: Akhiran pronominalnya merujuk pada malam. Dalam bahasa Indonesia, ungkapan temporal ini lebih wajar daripada “di dalamnya” dan menyampaikan bahwa gerak binatang terjadi pada malam hari.
- source_word: תִרְמֹשׂ
  choice: berkeliaran
  rationale: Kata רמשׂ menggambarkan makhluk yang bergerak ke sana kemari atau merayap. “Berkeliaran” sesuai dengan gerak binatang hutan pada malam hari tanpa membatasi maknanya hanya pada perburuan.
- source_word: כָּל חַיְתוֹ יָעַר
  choice: segala binatang hutan
  rationale: Frasa konstruk ini secara kolektif berarti semua binatang yang hidup di hutan. “Segala binatang hutan” alami, jelas, dan tetap bernuansa puitis.
theological_decisions:
- issue: Peran ilahi dalam penataan ciptaan
  choice: Allah secara aktif mendatangkan kegelapan, lalu malam tiba.
  alternative: Allah hanya mengizinkan kegelapan dan malam terjadi.
  rationale: Kata kerja orang kedua tunggal secara langsung mengaitkan tindakan itu dengan Allah. Terjemahan mempertahankan peran aktif tersebut tanpa menambahkan uraian filosofis tentang sebab-akibat.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Susunan kalimat mempertahankan sapaan langsung kepada Allah, hubungan hasil antara kegelapan dan malam, serta gerak kolektif binatang hutan. Penanda catatan kaki [a] ditempatkan tepat setelah kata yang dijelaskan.
