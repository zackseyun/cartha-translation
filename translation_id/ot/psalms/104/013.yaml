  text: מַשְׁקֶ֣ה הָ֭רִים מֵ/עֲלִיּוֹתָ֑י/ו מִ/פְּרִ֥י מַ֝עֲשֶׂ֗י/ךָ תִּשְׂבַּ֥ע הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/013.yaml
  text: He waters the mountains from his upper chambers[a]; the earth is satisfied with the fruit of your works.
translation:
  language: id
  text: Ia menyirami gunung-gunung dari kamar-kamar atas-Nya; bumi kenyang oleh hasil karya-Mu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bumi kenyang dari hasil karya-Mu.” Kata depan Ibrani dapat menyatakan sumber maupun sarana.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁקֶה
  choice: Ia mengairi
  rationale: Partisipel Hifil dari שׁקה menyatakan tindakan kausatif, yakni memberi air. Bentuk verba finit dengan subjek ilahi tersirat wajar dalam bahasa Indonesia.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Makna lazim הָרִים adalah gunung-gunung; konteks mazmur penciptaan tidak menuntut arti yang lebih sempit seperti bukit-bukit.
- source_word: מֵעֲלִיּוֹתָיו
  choice: dari kamar-kamar atas-Nya
  rationale: עֲלִיּוֹת menunjuk kamar atau ruang di bagian atas. Pilihan ini mempertahankan citra arsitektural kosmis serta akhiran milik orang ketiga.
- source_word: מִפְּרִי
  choice: dengan hasil
  rationale: מִן dapat menyatakan sumber ataupun sarana. 'Dengan hasil' alami dalam klausa ini dan memandang hasil pekerjaan Allah sebagai sarana yang mengenyangkan bumi; kemungkinan makna sumber dicatat dalam catatan kaki.
- source_word: מַעֲשֶׂיךָ
  choice: pekerjaan-Mu
  rationale: Istilah ini mencakup karya atau tindakan Allah dan mempertahankan sapaan orang kedua yang terdapat dalam teks Ibrani.
- source_word: תִּשְׂבַּע
  choice: dikenyangkan
  rationale: שׂבע menyatakan menjadi kenyang atau mendapat kepuasan penuh. Bentuk pasif bahasa Indonesia menyampaikan bahwa bumi menerima kelimpahan dari karya Allah.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam konteks mazmur penciptaan, cakupan global 'bumi' lebih sesuai daripada 'negeri' atau 'tanah'.
theological_decisions:
- issue: Subjek ilahi yang tersirat
  choice: Ia mengairi
  alternative: yang mengairi
  rationale: Teks Ibrani memakai partisipel tanpa menyebut subjek secara eksplisit dalam ayat ini, tetapi konteks sebelumnya dengan jelas menunjuk kepada Allah. 'Ia' membuat kalimat Indonesia lengkap tanpa menambahkan klaim teologis baru.
- issue: Peralihan dari orang ketiga ke orang kedua
  choice: atas-Nya ... pekerjaan-Mu
  alternative: atas-Mu ... pekerjaan-Mu
  rationale: Teks Masoret dengan sengaja atau secara puitis beralih dari akhiran orang ketiga pada עֲלִיּוֹתָיו ke orang kedua pada מַעֲשֶׂיךָ. Terjemahan mempertahankan ketegangan gramatikal ini dan tidak menyeragamkannya.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Citra kamar-kamar atas dipertahankan, demikian pula peralihan pronomina orang ketiga ke orang kedua dalam teks sumber.
