  rationale: Revisi mengganti bentuk pasif ‘dikenyangkan’ dengan predikasi intransitif ‘kenyang’ untuk mencerminkan bentuk Qal Ibrani, dan memakai ‘menyirami’ yang lebih alami. Citra kosmis, makna hasil karya, serta peralihan pronomina orang ketiga ke orang kedua tetap dipertahankan. Catatan kaki tetap berjangkar pada frasa yang ditentukan dan menjelaskan alternatif sumber/sarana.
