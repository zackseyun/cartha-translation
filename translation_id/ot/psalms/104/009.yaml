id: PSA.104.9
reference: Psalms 104:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גְּֽבוּל שַׂ֭מְתָּ בַּל יַֽעֲבֹר֑וּ/ן בַּל יְ֝שׁוּב֗וּ/ן לְ/כַסּ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: id
  text: Engkau menetapkan batas yang tidak boleh mereka lewati[a]; mereka tidak akan kembali menutupi bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “garis batas” atau “perbatasan.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, air itu tidak akan kembali menutupi bumi.
    reason: cross_reference
lexical_decisions:
- source_word: גְּבוּל
  choice: batas
  rationale: Kata ini menunjuk pada batas tetap yang ditetapkan bagi air; “batas” alami dan tepat dalam bahasa Indonesia.
- source_word: שַׂמְתָּ
  choice: Engkau menetapkan
  rationale: Bentuk dari שׂוּם berarti menaruh atau menetapkan; bersama “batas”, “menetapkan” mengungkapkan tindakan yang berdaya tetap.
- source_word: בַּל
  choice: tidak boleh / tidak akan
  rationale: Partikel ini meniadakan verba imperfek. Pada klausa pertama, “tidak boleh” menyatakan pembatasan; pada klausa kedua, “tidak akan” menyatakan hasil tetap dari ketetapan Allah.
- source_word: יַעֲבֹרוּן
  choice: mereka lewati
  rationale: Verba עבר berarti melewati atau melampaui; “melewati batas” merupakan ungkapan Indonesia yang jelas dan idiomatis.
- source_word: יְשׁוּבוּן
  choice: mereka tidak akan kembali
  rationale: Verba שוב berarti kembali. Terjemahan ini mempertahankan gagasan bahwa air tidak kembali menutupi bumi.
- source_word: לְכַסּוֹת
  choice: menutupi
  rationale: Infinitif כסה secara langsung berarti menutupi. Pilihan ini mempertahankan citra sumber tanpa mempersempitnya menjadi “membanjiri”.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam konteks kosmis mazmur penciptaan ini, “bumi” lebih sesuai daripada “tanah”.
theological_decisions:
- issue: Acuan verba jamak
  choice: Kata ganti “mereka” mengacu pada air yang dibatasi oleh ketetapan Allah.
  alternative: Bentuk jamak dapat dipahami secara lebih umum sebagai air kekacauan atau air laut.
  rationale: Konteks langsung berbicara tentang air yang surut dan diberi batas. Terjemahan mempertahankan kata ganti jamak tanpa menambahkan “air” ke dalam teks utama.
- issue: Nuansa penyangkalan pada dua klausa
  choice: Klausa pertama diterjemahkan sebagai larangan atau batas (“tidak boleh”), sedangkan klausa kedua sebagai akibat yang pasti (“tidak akan”).
  alternative: Keduanya dapat diterjemahkan secara seragam dengan “tidak dapat” atau “jangan sampai”.
  rationale: Perbedaan ini menghasilkan bahasa Indonesia yang alami sambil mempertahankan ketegangan antara batas yang Allah tetapkan dan hasilnya yang tetap.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan klausa mengikuti paralelisme Ibrani, sedangkan pilihan “menetapkan batas” dan “melewati” dibuat idiomatis bagi pembaca umum.
