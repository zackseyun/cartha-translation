  text: וְ/יַ֤יִן יְשַׂמַּ֬ח לְֽבַב אֱנ֗וֹשׁ לְ/הַצְהִ֣יל פָּנִ֣ים מִ/שָּׁ֑מֶן וְ֝/לֶ֗חֶם לְֽבַב אֱנ֥וֹשׁ יִסְעָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: id
  text: dan anggur menggembirakan hati manusia[a], minyak membuat wajah berseri, dan roti menguatkan hati manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani “hati manusia fana.” Bentuk tunggal di sini mewakili manusia pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַיִן
  choice: dan anggur
  rationale: Kata benda ini menunjuk pada anggur sebagai minuman secara umum; konjungsi וְ diterjemahkan “dan” untuk mempertahankan kesinambungan puitis.
- source_word: יְשַׂמַּח
  choice: menggembirakan
  rationale: Bentuk piel dari שׂמח menyatakan tindakan menyebabkan kegembiraan; “menggembirakan” alami dalam bahasa Indonesia dan mempertahankan nuansa kausatif.
- source_word: לְבַב אֱנוֹשׁ
  choice: hati manusia
  rationale: לְבַב menunjuk pada pusat kehidupan batin, sedangkan אֱנוֹשׁ adalah manusia fana dalam arti umum. “Hati manusia” mempertahankan bentuk tunggal representatif tanpa menyiratkan bahwa yang dimaksud hanya laki-laki.
- source_word: לְהַצְהִיל פָּנִים
  choice: membuat wajah berseri
  rationale: Infinitif hifil menyatakan hasil atau tujuan berupa wajah yang menjadi cerah atau berseri; ungkapan ini alami dan puitis dalam bahasa Indonesia modern.
- source_word: מִשָּׁמֶן
  choice: lebih daripada minyak
  rationale: Preposisi מִן dapat menyatakan perbandingan, sehingga klausa ini dapat dipahami bahwa anggur membuat wajah lebih berseri daripada minyak. Ambiguitas makna sarana, “dengan minyak,” dipertahankan dalam catatan kaki.
- source_word: וְלֶחֶם
  choice: dan roti
  rationale: לֶחֶם secara langsung berarti “roti,” makanan pokok dalam gambaran puitis ini; tidak perlu diperluas menjadi “makanan.”
- source_word: יִסְעָד
  choice: menopang
  rationale: סעד berarti menopang, menyokong, atau mempertahankan kekuatan. “Menopang” mempertahankan metafora Ibrani yang menghubungkan roti dengan hati manusia.
theological_decisions:
- issue: Cakupan אֱנוֹשׁ dalam bentuk tunggal
  choice: manusia
  alternative: orang / manusia fana
  rationale: Di sini אֱנוֹשׁ adalah bentuk tunggal representatif yang mencakup umat manusia, bukan seorang laki-laki tertentu. “Manusia” menyampaikan cakupan tersebut secara tepat dalam bahasa Indonesia.
- issue: Hubungan anggur, wajah, dan minyak
  choice: anggur membuat wajah berseri lebih daripada minyak
  alternative: wajah dibuat berseri dengan minyak
  rationale: מִן memungkinkan pembacaan komparatif maupun instrumental/sumber. Teks utama mengikuti pembacaan komparatif yang koheren, sedangkan pembacaan alternatif dicatat tanpa menghapus ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan tiga unsur—anggur, minyak, dan roti—serta pengulangan “hati manusia” dipertahankan. Istilah “menopang” sengaja mempertahankan metafora sumber meskipun “menguatkan” lebih idiomatis.
