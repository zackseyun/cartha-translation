  text: יֶעֱרַ֣ב עָלָ֣י/ו שִׂיחִ֑/י אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/034.yaml
  text: May my meditation be pleasing to him[a]; I will rejoice in Yahweh.
translation:
  language: id
  text: Kiranya renunganku berkenan kepada-Nya[a]; aku akan bersukacita dalam Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kiranya renunganku menyenangkan bagi-Nya” atau “terasa manis bagi-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעֱרַב
  choice: menyenangkan hati-Nya
  rationale: Dalam bentuk Qal, verba ini dapat berarti ‘terasa manis’, ‘menyenangkan’, atau ‘berkenan’. Ungkapan ‘menyenangkan hati-Nya’ alami dalam bahasa Indonesia dan menyampaikan harapan agar renungan pemazmur diterima dengan senang oleh Allah.
- source_word: עָלָיו
  choice: hati-Nya
  rationale: Dengan verba ערב, preposisi עַל menandai pihak yang merasakan kesenangan. Terjemahan idiomatis ‘menyenangkan hati-Nya’ menyampaikan relasi tersebut; sufiks orang ketiga tunggal maskulin mengacu kepada Allah.
- source_word: שִׂיחִי
  choice: renunganku
  rationale: Nomina שִׂיחַ dapat menunjuk pada renungan, perenungan, atau tuturan. Dalam konteks pujian mazmur ini, ‘renunganku’ paling wajar tanpa mempersempitnya menjadi keluhan.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina mandiri memberi sedikit penegasan pada subjek. ‘Aku’ mempertahankan bentuk puitis yang wajar; penegasan tambahan seperti ‘aku sendiri’ akan terasa berlebihan dalam konteks ini.
- source_word: אֶשְׂמַח
  choice: akan bersukacita
  rationale: Bentuk imperfek dapat menyatakan tekad atau sikap yang berkelanjutan. ‘Akan bersukacita’ mempertahankan nuansa tekad itu dalam bahasa Indonesia alami.
- source_word: בַּיהוָה
  choice: dalam Yahweh
  rationale: Preposisi בְּ menandai Dia yang menjadi dasar atau sasaran sukacita, sehingga ‘dalam Yahweh’ mempertahankan ungkapan sumber sekaligus tetap dapat dipahami. Nama ilahi יהוה ditransliterasikan ‘Yahweh’.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu dan sesuai dengan lapisan konsultasi yang diberikan tanpa memasukkan tafsiran denominasi tertentu.
- issue: Arah permohonan pada baris pertama
  choice: renungan pemazmur kiranya menyenangkan Allah
  alternative: renungan itu kiranya terasa manis bagi Allah; kiranya renungan itu berkenan kepada-Nya
  rationale: Konstruksi יֶעֱרַב עָלָיו dapat menyatakan sesuatu yang manis, menyenangkan, atau berkenan bagi seseorang. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan ragam nuansa leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. ‘Kiranya’ mempertahankan nuansa harapan/doa; ‘aku’ sesuai dengan suara pribadi pemazmur. Kapitalisasi ‘-Nya’ memperjelas bahwa rujukannya adalah Allah.
