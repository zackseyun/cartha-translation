id: PSA.99.1
reference: Psalms 99:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ יִרְגְּז֣וּ עַמִּ֑ים יֹשֵׁ֥ב כְּ֝רוּבִ֗ים תָּנ֥וּט הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: id
  text: Yahweh memerintah[a]; biarlah bangsa-bangsa gemetar. Ia bertakhta di atas kerubim[b]; biarlah bumi berguncang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bangsa-bangsa gemetar ... bumi berguncang.” Verba imperfek Ibrani juga dapat dibaca sebagai pernyataan indikatif, bukan sebagai ungkapan volitif.
    reason: alternative_reading
  - marker: b
    text: “Bertakhta di atas kerubim” juga dapat diterjemahkan “bertakhta di antara kerubim” atau “duduk bertakhta di atas kerubim.” Ungkapan Ibrani ini merupakan gelar kerajaan yang berkaitan dengan bait suci bagi Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai Yahweh, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: מָלָךְ
  choice: memerintah
  rationale: Dalam seruan puitis ini, bentuk qatal menyatakan pemerintahan Yahweh sebagai kenyataan kini; “memerintah” alami dalam bahasa Indonesia dan tidak memaksakan arti ingresif “telah menjadi raja”.
- source_word: יִרְגְּזוּ
  choice: biarlah ... gemetar
  rationale: Imperfek ini dapat berdaya volitif dalam puisi. “Gemetar” menyampaikan keguncangan bangsa-bangsa di hadapan Raja ilahi, sedangkan kemungkinan pembacaan indikatif dicatat dalam catatan kaki.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak kolektif menunjuk kepada berbagai kelompok bangsa; “bangsa-bangsa” merupakan ungkapan Indonesia yang alami dan jelas.
- source_word: יֹשֵׁב כְּרוּבִים
  choice: Ia bertakhta di atas kerubim
  rationale: Partisip יֹשֵׁב dalam ungkapan kerajaan-bait suci ini mengandung gagasan duduk sebagai raja. “Bertakhta” menyampaikan daya idiomatisnya, sedangkan “di atas” tidak mempersempit relasi ruang menjadi hanya “di antara”.
- source_word: כְּרוּבִים
  choice: kerubim
  rationale: “Kerubim” adalah transliterasi yang lazim dalam bahasa Indonesia bagi makhluk surgawi ini dan mempertahankan ragam bahasa Alkitab yang bermartabat.
- source_word: תָּנוּט
  choice: biarlah bumi berguncang
  rationale: Kata kerja ini berarti bergoyang, terhuyung, atau berguncang. Bentuk volitif menjaga kesejajaran dengan “biarlah bangsa-bangsa gemetar”; kemungkinan indikatif tetap dicatat.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Konteks mazmur penobatan ini bersifat universal, sehingga “bumi” lebih tepat daripada “negeri”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Daya verba imperfek יִרְגְּזוּ dan תָּנוּט
  choice: 'Volitif: “biarlah bangsa-bangsa gemetar ... biarlah bumi berguncang”'
  alternative: 'Indikatif: “bangsa-bangsa gemetar ... bumi berguncang”'
  rationale: Dalam puisi Ibrani, kedua bentuk ini dapat dipahami sebagai tanggapan volitif terhadap pemerintahan Yahweh atau sebagai pernyataan tentang akibatnya. Teks utama memakai daya volitif, sementara ambiguitas yang nyata dipertahankan melalui catatan kaki.
- issue: Relasi Yahweh dengan kerubim dalam יֹשֵׁב כְּרוּבִים
  choice: bertakhta di atas kerubim
  alternative: bertakhta di antara kerubim
  rationale: Ungkapan ini adalah gelar kerajaan dan bait suci. “Di atas” sesuai dengan gambaran takhta tanpa menutup kemungkinan pemahaman “di antara”, yang dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur puitis dua bagian serta kesejajaran antara bangsa-bangsa dan bumi dipertahankan. “Bertakhta” dipilih daripada terjemahan harfiah “duduk” untuk menyampaikan citra kerajaan secara alami.
