  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ֭/הִֽשְׁתַּחֲווּ לְ/הַ֣ר קָדְשׁ֑/וֹ כִּֽי קָ֝ד֗וֹשׁ יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/009.yaml
  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: id
  text: Agungkanlah Yahweh, Allah kita, dan sujudlah ke arah gunung-Nya yang kudus,[a] sebab Yahweh, Allah kita, kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “sembahlah di gunung-Nya yang kudus.” Kata kerja Ibraninya dapat berarti bersujud maupun menyembah, dan preposisinya dapat dipahami sebagai “di” atau “ke arah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Agungkanlah
  rationale: Bentuk perintah jamak dari רום menyerukan agar umat meninggikan atau memuliakan Allah. “Agungkanlah” alami dalam bahasa Indonesia dan menyampaikan makna meninggikan kehormatan-Nya tanpa kesan mengangkat secara fisik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk אֱלֹהִים dengan akhiran orang pertama jamak secara langsung berarti “Allah kita”.
- source_word: וְהִשְׁתַּחֲווּ
  choice: dan sujudlah
  rationale: Kata kerja שׁחה menunjuk pada tindakan membungkuk atau merebahkan diri dan, dalam konteks ini, merupakan tindakan penyembahan. “Sujudlah” mempertahankan gambaran jasmaninya sekaligus wajar sebagai bahasa ibadah.
- source_word: לְהַר קָדְשׁוֹ
  choice: menghadap gunung-Nya yang kudus
  rationale: Preposisi לְ dapat menyatakan arah atau hubungan tempat. “Menghadap” mempertahankan nuansa arah tanpa menyiratkan bahwa gunung itu sendiri menjadi objek penyembahan; kemungkinan arti “di” dicatat dalam catatan kaki.
- source_word: כִּי
  choice: Sebab
  rationale: כִּי memperkenalkan alasan bagi kedua perintah sebelumnya. “Sebab” jelas, alami, dan sesuai dengan ragam puisi yang bermartabat.
- source_word: קָדוֹשׁ
  choice: kudus
  rationale: “Kudus” adalah padanan baku dan tepat bagi קָדוֹשׁ serta mempertahankan tema utama mazmur ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Apakah הִשְׁתַּחֲווּ diterjemahkan sebagai tindakan jasmani atau istilah umum untuk penyembahan
  choice: sujudlah
  alternative: sembahlah; rebahkanlah dirimu
  rationale: Kata Ibrani itu dapat menyatakan tindakan bersujud maupun penyembahan yang diwujudkan melalui tindakan tersebut. “Sujudlah” mempertahankan citra konkretnya tanpa meniadakan makna ibadah.
- issue: Hubungan preposisi לְ dengan gunung yang kudus
  choice: menghadap gunung-Nya yang kudus
  alternative: di gunung-Nya yang kudus; ke arah gunung-Nya yang kudus
  rationale: Konstruksi Ibrani dapat dipahami secara lokatif atau terarah. Teks utama memakai ungkapan arah yang alami dan tidak menjadikan gunung sebagai objek penyembahan, sementara kemungkinan lokatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. Bentuk “Agungkanlah” dan “sujudlah” mempertahankan daya seruan dari dua imperatif jamak Ibrani. Pengulangan “Yahweh, Allah kita” dipertahankan sesuai struktur dan penekanan ayat.
