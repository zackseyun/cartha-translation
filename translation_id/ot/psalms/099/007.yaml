  terminology: “Ketetapan” secara baik membedakan חֹק yang tunggal dari עֵדֹתָיו yang jamak. “Kesaksian-kesaksian-Nya” mempertahankan istilah yang berbeda bagi עֵדֹתָיו tanpa menggesernya menjadi gagasan peringatan atau ancaman.
