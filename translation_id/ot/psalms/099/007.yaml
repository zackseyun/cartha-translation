  text: בְּ/עַמּ֣וּד עָ֭נָן יְדַבֵּ֣ר אֲלֵי/הֶ֑ם שָׁמְר֥וּ עֵ֝דֹתָ֗י/ו וְ/חֹ֣ק נָֽתַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/007.yaml
  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: id
  text: Di dalam tiang awan Ia berbicara kepada mereka;[a] mereka menaati kesaksian-kesaksian-Nya dan ketetapan yang diberikan-Nya kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari tiang awan Ia berbicara kepada mereka.” Preposisi Ibrani dapat dipahami secara lokatif (“di dalam”) atau sebagai penanda sumber/perantaraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: Di dalam tiang awan
  rationale: Preposisi בְּ dapat dipahami secara lokatif atau instrumental. Pilihan lokatif ini alami dalam bahasa Indonesia dan mempertahankan gambaran bahwa Allah berbicara dari dalam tiang awan; alternatifnya dicatat dalam catatan kaki.
- source_word: יְדַבֵּר
  choice: Ia berbicara
  rationale: Bentuk yiqtol dapat menyatakan tindakan berulang atau kebiasaan, tetapi dalam konteks puitis-historis ini bentuk lampau Indonesia merangkum tindakan Allah terhadap tokoh-tokoh pada ayat sebelumnya tanpa memaksakan aspek yang lebih khusus.
- source_word: אֲלֵיהֶם
  choice: kepada mereka
  rationale: Frasa ini secara langsung menunjuk kepada tokoh-tokoh yang disebut dalam ayat sebelumnya, sementara bentuk pronominalnya dipertahankan.
- source_word: שָׁמְרוּ
  choice: mereka menaati
  rationale: Dalam konteks perjanjian, שׁמר berarti memelihara atau menuruti. 'Menaati' menyampaikan tindakan patuh secara alami dan jelas bagi pembaca Indonesia modern.
- source_word: עֵדֹתָיו
  choice: peringatan-peringatan-Nya
  rationale: עֵדוֹת menunjuk pada kesaksian atau ketentuan ilahi yang menjadi pengingat dan tuntutan perjanjian. 'Peringatan-peringatan' merupakan padanan Indonesia yang wajar serta tetap dibedakan dari חֹק.
- source_word: וְחֹק
  choice: dan ketetapan
  rationale: חֹק adalah ketentuan yang ditetapkan atau aturan tetap. Bentuk tunggal Ibrani dipertahankan dan dibedakan dari עֵדֹתָיו yang mendahuluinya.
- source_word: נָתַן לָמוֹ
  choice: yang diberikan-Nya kepada mereka
  rationale: Klausa ini paling alami menerangkan 'ketetapan'. Bentuk pasif relatif menghasilkan susunan Indonesia yang lancar tanpa mengubah Allah sebagai pelaku pemberian.
theological_decisions:
- issue: Rujukan 'Ia' dan 'mereka'
  choice: '''Ia'' merujuk kepada TUHAN, sedangkan ''mereka'' terutama merujuk kepada Musa, Harun, dan Samuel yang disebut pada ayat sebelumnya.'
  alternative: '''Mereka'' dapat dipahami lebih luas sebagai Israel yang diwakili oleh tokoh-tokoh tersebut.'
  rationale: Konteks terdekat dalam Mazmur 99:6 menyebut Musa, Harun, dan Samuel. Terjemahan mempertahankan kata ganti dan tidak memperluas rujukannya di dalam teks, sehingga alur puitis dan kemungkinan representatifnya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda catatan kaki ditempatkan tepat sesudah klausa yang diterangkannya.
