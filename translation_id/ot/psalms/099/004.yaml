  source_fidelity: Frasa pembuka Ibrani sangat padat dan memungkinkan lebih dari satu analisis. Terjemahan harfiah "Kekuatan Sang Raja mencintai keadilan" tidak dapat berfungsi wajar dalam bahasa Indonesia, karena "kekuatan" menjadi subjek yang mencintai. Bacaan idiomatis "Sang Raja yang perkasa mencintai keadilan" merupakan penafsiran yang sah dan perlu diberi catatan tentang kepadatan sintaksisnya. בְּיַעֲקֹב secara langsung adalah "di Yakub"; "di antara keturunan Yakub" menambahkan "keturunan" dan mengubah nama puitis itu menjadi penjelasan genealogi.
