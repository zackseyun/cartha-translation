  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
translation:
  language: id
  text: Sang Raja yang perkasa mencintai keadilan[a]; Engkau telah menegakkan keadilan yang benar[b]; Engkau telah melakukan keadilan dan kebenaran di Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, pembukaan bahasa Ibrani berbunyi seperti “kekuatan raja” dan sangat padat. Frasa ini dapat dipahami dengan lebih dari satu cara, misalnya, “Raja dalam kekuatan-Nya mencintai keadilan.”
    reason: alternative_reading
  - marker: b
    text: Atau, “kelurusan” atau “keadilan yang tidak memihak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֹז
  choice: Kekuatan
  rationale: עֹז berarti kekuatan atau keperkasaan. Bentuk nomina dipertahankan karena pembukaan Ibrani sengaja padat dan dapat ditafsirkan dengan beberapa cara.
- source_word: מֶלֶךְ
  choice: Sang Raja
  rationale: מֶלֶךְ berarti raja; sebutan ini menunjuk kepada Allah dalam konteks mazmur dan diterjemahkan secara hormat serta alami dalam bahasa Indonesia.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks pemerintahan ilahi, מִשְׁפָּט menunjuk pada tata pemerintahan dan tindakan mengadili yang adil, bukan hanya putusan hukum.
- source_word: אָהֵב
  choice: mencintai
  rationale: Bentuk qatal menyatakan sifat yang tetap dalam puisi ini; kala kini Indonesia menyampaikan makna umum tersebut.
- source_word: אַתָּה
  choice: Engkau
  rationale: Kata ganti orang kedua dipertahankan karena dinyatakan secara eksplisit dan emfatis dalam sapaan langsung kepada Allah.
- source_word: כּוֹנַנְתָּ
  choice: telah menegakkan
  rationale: Verba ini berarti menetapkan, mengokohkan, atau menegakkan; pilihan ini alami untuk sesuatu yang dibuat teguh dan terus berlaku.
- source_word: מֵישָׁרִים
  choice: kelurusan
  rationale: Nomina ini menunjuk pada apa yang lurus, benar, atau setara dalam arti etis dan yudisial; 'kelurusan' mempertahankan citra dasar katanya.
- source_word: וּצְדָקָה
  choice: dan kebenaran
  rationale: צְדָקָה berarti kebenaran atau keadilan moral. 'Kebenaran' membedakannya dari מִשְׁפָּט sambil mempertahankan pasangan konsep Ibrani.
- source_word: בְּיַעֲקֹב
  choice: di antara keturunan Yakub
  rationale: Yakub di sini merupakan nama perjanjian kolektif bagi umat Israel. Ungkapan Indonesia ini menyampaikan lokus tindakan di tengah umat tanpa mengganti nama puitis Yakub.
- source_word: עָשִׂיתָ
  choice: telah melaksanakan
  rationale: עָשָׂה secara luas berarti melakukan atau mengerjakan; 'melaksanakan' cocok dengan objek keadilan dan kebenaran serta terdengar alami.
theological_decisions:
- issue: Penafsiran frasa pembuka yang padat וְעֹז מֶלֶךְ
  choice: Kekuatan Sang Raja mencintai keadilan
  alternative: Sang Raja yang perkasa mencintai keadilan; Raja dalam kekuatan-Nya mencintai keadilan
  rationale: Susunan Ibrani secara harfiah menempatkan 'kekuatan' sebagai nomina yang berkaitan dengan 'raja', tetapi sintaksisnya padat dan tidak tunggal. Teks utama mempertahankan bentuk serta ketegangannya; catatan kaki memberikan bacaan Indonesia yang lebih idiomatis tanpa menetapkannya sebagai satu-satunya tafsiran.
- issue: Rujukan kolektif nama Yakub
  choice: di antara keturunan Yakub
  alternative: di Yakub; di tengah Yakub; di Israel
  rationale: Nama Yakub dipertahankan untuk menjaga bahasa puitis dan perjanjian, sedangkan 'keturunan' menjelaskan fungsi kolektifnya dalam bahasa Indonesia tanpa menggantinya dengan Israel.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang bermartabat. Kapitalisasi 'Sang Raja' dan 'Engkau' menandai sapaan hormat kepada Allah tanpa menambahkan gelar teologis. Tanda titik koma mempertahankan tiga klausa paralel dalam ayat.
