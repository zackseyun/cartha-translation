  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְֽ֭/הִשְׁתַּחֲווּ לַ/הֲדֹ֥ם רַגְלָ֗י/ו קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: id
  text: Tinggikanlah TUHAN, Allah kita, dan sujudlah di hadapan tumpuan kaki-Nya[a][b]; Dia kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kepada tumpuan kaki-Nya.” Kata depan Ibrani yang dipakai di sini dapat menyatakan arah atau lokasi dalam konteks penyembahan.
    reason: lexical_alternative
  - marker: b
    text: “Tumpuan kaki-Nya” dapat merujuk pada tempat Allah bertakhta di bumi, misalnya tabut perjanjian atau tempat kudus, tetapi ayat ini tidak menyebutkannya secara tegas.
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Tinggikanlah
  rationale: Imperatif jamak dari רום yang menyerukan umat untuk meninggikan atau memuliakan Allah. “Tinggikanlah” mempertahankan metafora sumber dan tetap wajar dalam ragam mazmur Indonesia.
- source_word: יְהוָ֤ה
  choice: TUHAN
  rationale: Nama ilahi tetragramaton diterjemahkan menurut konvensi Alkitab bahasa Indonesia yang mapan, dengan huruf kapital untuk membedakannya dari gelar biasa.
- source_word: אֱלֹהֵ֗ינוּ
  choice: Allah kita
  rationale: Bentuk dengan sufiks orang pertama jamak berarti “Allah kita” dan mempertahankan unsur komunalnya.
- source_word: וְהִשְׁתַּחֲווּ
  choice: dan sujudlah
  rationale: Kata kerja ini menyatakan tindakan membungkuk atau merebahkan diri sebagai penghormatan. “Sujudlah” mempertahankan tindakan jasmani sekaligus nuansa ibadah.
- source_word: לַהֲדֹ֥ם רַגְלָ֗יו
  choice: di hadapan tumpuan kaki-Nya
  rationale: הֲדֹם רַגְלָיו secara harfiah adalah “tumpuan kaki-Nya.” Dalam konteks penyembahan, ל dapat menunjukkan arah atau lokasi; “di hadapan” alami dalam bahasa Indonesia dan menghindari kesan bahwa tumpuan kaki itu sendiri menjadi objek penyembahan.
- source_word: קָד֥וֹשׁ הֽוּא
  choice: Dia kudus
  rationale: Klausa predikatif ini secara alami diterjemahkan “Dia kudus,” dengan tetap mempertahankan pernyataan ringkas yang menjadi dasar seruan sebelumnya.
theological_decisions:
- issue: Rujukan “tumpuan kaki-Nya”
  choice: Mempertahankan ungkapan metaforis tanpa menentukan rujukannya dalam teks utama.
  alternative: Menafsirkannya secara khusus sebagai tabut perjanjian, tempat kudus, Sion, atau bumi.
  rationale: Ayat ini tidak secara eksplisit mengidentifikasi tumpuan kaki tersebut. Terjemahan literal menjaga keluasan citra dan tidak memaksakan satu penafsiran teologis.
- issue: Alasan bagi seruan untuk meninggikan dan sujud
  choice: Menerjemahkan קָדוֹשׁ הוּא sebagai “Dia kudus.”
  alternative: “Kuduslah Dia.”
  rationale: Keduanya mungkin secara makna, tetapi “Dia kudus” lebih alami dalam bahasa Indonesia modern dan tetap menyatakan kekudusan Allah sebagai dasar penyembahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan khidmat. Bentuk “sujudlah” mempertahankan gambaran tindakan jasmani, sedangkan “tumpuan kaki-Nya” menjaga metafora Ibrani. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskan.
