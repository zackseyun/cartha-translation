  text: יְהוָ֣ה אֱלֹהֵי/נוּ֮ אַתָּ֪ה עֲנִ֫יתָ֥/ם אֵ֣ל נֹ֭שֵׂא הָיִ֣יתָ לָ/הֶ֑ם וְ֝/נֹקֵ֗ם עַל עֲלִילוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: id
  text: Ya Yahweh, Allah kami, Engkau menjawab mereka. Engkau adalah Allah yang mengampuni mereka[a], namun pembalas atas perbuatan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah yang mengangkat [kesalahan] mereka.” Partisip Ibrani ini dapat menyatakan pengampunan dengan gambaran mengangkat atau menanggung kesalahan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang menuntut pembalasan atas tindakan mereka.” Bentuk Ibrani ini dapat dipahami secara nominal, “pembalas atas perbuatan mereka,” atau secara lebih verbal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai transliterasi “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: Bentuk dengan akhiran orang pertama jamak berarti “Allah kami” dan di sini berfungsi sebagai sapaan bersama nama Yahweh.
- source_word: אַתָּה עֲנִיתָם
  choice: Engkau menjawab mereka
  rationale: Pronomina eksplisit אַתָּה memberi penegasan, sedangkan ענה dalam konteks doa dan seruan berarti “menjawab”.
- source_word: אֵל נֹשֵׂא הָיִיתָ לָהֶם
  choice: Engkau adalah Allah yang mengampuni mereka
  rationale: Partisip נֹשֵׂא secara harfiah berkaitan dengan mengangkat atau menanggung, tetapi dalam hubungan dengan kesalahan dapat berarti mengampuni dengan menyingkirkan tanggungan kesalahan. Susunan Indonesia ini menyampaikan fungsi idiomatisnya secara alami.
- source_word: וְנֹקֵם
  choice: tetapi juga membalas
  rationale: Partisip dari נקם menyatakan tindakan membalas atau menuntut pembalasan. “Tetapi juga” mengungkapkan pertentangan kontekstual dengan pengampunan tanpa menghapus kenyataan bahwa keduanya dinyatakan tentang Allah.
- source_word: עַל עֲלִילוֹתָם
  choice: perbuatan mereka
  rationale: עֲלִילוֹת berarti tindakan atau perbuatan. Pilihan netral “perbuatan” tidak menambahkan nuansa “jahat” yang tidak dinyatakan secara leksikal, sementara konteks pembalasan menunjukkan bahwa tindakan itu mendatangkan hukuman.
theological_decisions:
- issue: Pengampunan ilahi berdampingan dengan pembalasan atas perbuatan
  choice: Teks menyatakan bahwa Allah mengampuni mereka, tetapi juga membalas perbuatan mereka.
  alternative: Menafsirkan bahwa pengampunan meniadakan semua disiplin atau akibat; atau bahwa pembalasan hanya ditujukan kepada pihak lain.
  rationale: Bahasa Ibrani mempertahankan kedua kenyataan itu dalam satu pernyataan. Terjemahan tidak menentukan lebih jauh siapa tepatnya yang mengalami akibat atau bagaimana pengampunan dan pembalasan itu saling berkaitan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ya” menandai sapaan; “Engkau” mempertahankan register doa yang wajar. Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
