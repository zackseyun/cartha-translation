translation:
  language: id
  text: Biarlah mereka memuji nama-Mu yang besar dan dahsyat[a][b]; kuduslah Dia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: ‘menggentarkan’ atau ‘membangkitkan rasa takjub’; kata Ibrani ini menggambarkan sesuatu yang menimbulkan rasa gentar dan takjub yang penuh hormat.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: ‘Biarlah mereka bersyukur kepada nama-Mu’; kata kerja Ibrani dapat berarti ‘bersyukur’ atau ‘memuji’, tetapi ‘memuji’ paling sesuai dalam konteks ini.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: ‘nama itu kudus’. Dalam bahasa Ibrani, ‘nama’ berjenis maskulin sehingga kata ganti ini secara gramatikal dapat merujuk kepadanya; dalam konteks mazmur, klausa tersebut terutama menegaskan bahwa TUHAN itu kudus.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יוֹדוּ
  choice: Biarlah mereka memuji
  rationale: Bentuk imperfek Hifil orang ketiga jamak dari ידה dapat berarti ‘bersyukur’, ‘memuji’, atau ‘mengakui’. Dengan ‘nama-Mu’ sebagai objek dalam konteks mazmur ini, ‘memuji’ paling alami; ‘biarlah’ menyampaikan nuansa jusif tanpa mengubahnya menjadi pernyataan masa depan.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Mempertahankan idiom Ibrani ‘nama’, yang di sini juga mencakup kemasyhuran dan sifat Allah yang dinyatakan.
- source_word: גָּדוֹל
  choice: besar
  rationale: Padanan langsung dan wajar yang mempertahankan hubungan leksikal dengan penggunaan kata ‘besar’ di bagian lain.
- source_word: וְנוֹרָא
  choice: dan dahsyat
  rationale: Kata ini menggambarkan sesuatu yang membangkitkan rasa gentar sekaligus takjub. ‘Dahsyat’ mempertahankan sisi rasa takut yang hormat lebih baik daripada padanan yang hanya menekankan kekaguman.
- source_word: קָדוֹשׁ
  choice: kuduslah
  rationale: ‘Kudus’ mempertahankan daya teologis dan liturgis istilah tersebut; partikel -lah membantu mempertahankan susunan predikat yang ditekankan.
- source_word: הוּא
  choice: Dia
  rationale: Kata ganti mandiri ini menegaskan subjek. Huruf kapital menunjukkan bahwa rujukan kontekstualnya adalah TUHAN, tanpa menambahkan nama ilahi yang tidak tertulis dalam ayat ini.
theological_decisions:
- issue: Rujukan הוּא dalam klausa terakhir
  choice: ‘kuduslah Dia’, dengan kata ganti merujuk kepada TUHAN
  alternative: ‘nama itu kudus’ atau ‘sebab nama itu kudus’
  rationale: Dalam Mazmur 99, klausa ini berfungsi sebagai seruan berulang tentang kekudusan TUHAN. Namun, karena שֵׁם (‘nama’) berjenis maskulin dalam bahasa Ibrani, hubungan gramatikal dengan ‘nama’ tetap mungkin dan dicatat dalam catatan kaki.
- issue: Hubungan logis antara kedua klausa
  choice: Dipisahkan dengan titik koma tanpa menambahkan kata penghubung sebab-akibat
  alternative: Menambahkan ‘sebab’
  rationale: Teks Ibrani menempatkan kedua klausa secara berdampingan tanpa konjungsi kausal. Titik koma mempertahankan kepadatan dan ketegangan sintaksis sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa liturgis tanpa menjadi arkais. Bentuk ‘nama-Mu’ mengikuti kebiasaan penghormatan kepada Allah. Susunan ‘kuduslah Dia’ sengaja mempertahankan penekanan dan sifat aklamatif klausa Ibrani.
