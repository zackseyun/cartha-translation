  text: יְ֭הוָה בְּ/צִיּ֣וֹן גָּד֑וֹל וְ/רָ֥ם ה֝֗וּא עַל כָּל הָֽ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/002.yaml
  text: Yahweh is great in Zion[a], and he is exalted above all the peoples.
translation:
  language: id
  text: Yahweh agung di Sion, dan Ia tinggi di atas segala bangsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בְּצִיּוֹן
  choice: di Sion
  rationale: Preposisi בְּ menyatakan lokasi; “di Sion” merupakan ungkapan Indonesia yang alami dan sesuai dengan konteks kehadiran serta pemerintahan Yahweh.
- source_word: גָּדוֹל
  choice: agung
  rationale: Dalam bahasa pujian, “agung” menyampaikan kebesaran dan keluhuran tanpa membatasinya hanya pada kekuatan.
- source_word: וְרָם הוּא
  choice: dan Ia ditinggikan
  rationale: רָם menyatakan kedudukan yang tinggi atau luhur, sedangkan הוּא memberi penegasan pada subjek. Susunan ini mempertahankan makna predikatif dalam bahasa Indonesia yang wajar.
- source_word: עַל כָּל הָעַמִּים
  choice: di atas semua bangsa
  rationale: עַל bersama רָם menyatakan keunggulan atau keluhuran di atas pihak lain. עַמִּים merujuk pada kelompok-kelompok manusia; “semua bangsa” adalah padanan Indonesia yang alami dan luas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa atau TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Makna keluhuran Yahweh atas bangsa-bangsa
  choice: ditinggikan di atas semua bangsa
  alternative: tinggi mengatasi semua bangsa
  rationale: Pilihan ini mempertahankan citra vertikal dan pernyataan supremasi dalam רָם ... עַל tanpa mempersempitnya menjadi kuasa politik semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada pujian yang khidmat. “Agung” dipilih agar puitis tetapi tetap mudah dipahami; “Ia” mempertahankan rujukan yang jelas dan penegasan terhadap Yahweh.
