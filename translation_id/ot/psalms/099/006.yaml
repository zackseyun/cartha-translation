  text: מֹ֘שֶׁ֤ה וְ/אַהֲרֹ֨ן בְּֽ/כֹהֲנָ֗י/ו וּ֭/שְׁמוּאֵל בְּ/קֹרְאֵ֣י שְׁמ֑/וֹ קֹרִ֥אים אֶל יְ֝הוָ֗ה וְ/ה֣וּא יַעֲנֵֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: id
  text: Musa dan Harun termasuk di antara para imam-Nya[a], dan Samuel termasuk di antara orang-orang yang menyerukan nama-Nya. Mereka berseru kepada Yahweh, dan Ia menjawab mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di antara imam-imam-Nya.” Frasa ini menggolongkan Musa dan Harun di antara imam-imam Yahweh.
    reason: lexical_syntactic_clarification
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: termasuk di antara para imam-Nya
  rationale: 'Preposisi ב pada bentuk jamak ini paling wajar dipahami secara partitif: Musa dan Harun digolongkan di antara para imam Allah. Kata kerja “termasuk” disuplai agar klausa alami dalam bahasa Indonesia, sedangkan “imam” mempertahankan arti lazim כֹּהֵן.'
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: termasuk di antara orang-orang yang berseru kepada nama-Nya
  rationale: Frasa partisipial ini sejajar dengan “di antara para imam-Nya” dan menggolongkan Samuel bersama mereka yang memanggil nama Allah dalam doa atau ibadah. “Berseru kepada nama-Nya” mempertahankan ungkapan Ibrani tanpa mereduksinya menjadi sekadar “kepada-Nya”.
- source_word: קֹרִאים אֶל
  choice: mereka berseru kepada
  rationale: Ungkapan ini melanjutkan tindakan tokoh-tokoh yang baru disebut. “Berseru kepada” mencakup doa atau permohonan tanpa mengharuskan konteks keadaan terdesak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: יַעֲנֵם
  choice: Ia menjawab mereka
  rationale: Bentuk imperfek dipahami sebagai tindakan lampau yang bersifat ringkasan atau berulang dalam konteks pengenangan tokoh-tokoh tersebut. Terjemahan ini tetap ringkas dan alami.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Teks Ibrani secara eksplisit menyebut “nama-Nya”, sebuah ungkapan penting untuk doa dan ibadah, sehingga tidak diganti hanya dengan kata ganti “Dia”.
theological_decisions:
- issue: Penggolongan Musa dan Harun sebagai imam tanpa menghapus ketegangan mengenai perbedaan peran mereka
  choice: Musa dan Harun termasuk di antara para imam-Nya
  alternative: Musa dan Harun adalah imam-imam-Nya
  rationale: Bentuk partitif “di antara” mempertahankan cara mazmur menggolongkan Musa dan Harun, tetapi tidak menyatakan bahwa jabatan keimaman Musa identik dalam segala hal dengan jabatan Harun.
- issue: Hubungan Samuel dengan orang-orang yang memanggil nama Allah
  choice: Samuel termasuk di antara orang-orang yang berseru kepada nama-Nya
  alternative: Samuel menyerukan nama-Nya
  rationale: Konstruksi Ibrani bersifat penggolongan dan sejajar dengan klausa sebelumnya. Terjemahan terpilih menjaga kesejajaran itu serta nuansa doa atau permohonan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Berseru kepada” dipilih sebagai ungkapan doa yang mudah dipahami; nama ilahi “Yahweh” dipertahankan. Kata ganti yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab berbahasa Indonesia.
