language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֤רֶם קֶ֨רֶן לְ/עַמּ֡/וֹ תְּהִלָּ֤ה לְֽ/כָל חֲסִידָ֗י/ו לִ/בְנֵ֣י יִ֭שְׂרָאֵל עַֽם קְרֹב֗/וֹ הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/014.yaml
  text: And he has raised up a horn for his people[a], praise for all his faithful ones, for the sons of Israel, the people near to him[d][c][b]. Praise Yah!
translation:
  language: id
  text: Ia telah meninggikan tanduk[b] bagi umat-Nya[a]—suatu pujian bagi semua orang yang setia kepada-Nya, bagi anak-anak Israel,[c] umat yang dekat dengan-Nya. Pujilah Yah![d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sintaks Ibrani setelah “meninggikan tanduk bagi umat-Nya” sangat padat. “Suatu pujian” dapat dipahami sebagai keterangan bagi tanduk itu atau sebagai hasil dari tindakan Allah tersebut.
    reason: alternative_reading
  - marker: b
    text: “Tanduk” adalah metafora Ibrani bagi kekuatan, kehormatan, atau kuasa yang ditinggikan.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “putra-putra Israel”; frasa ini merupakan sebutan bagi keturunan atau umat Israel.
    reason: lexical_alternative
  - marker: d
    text: “Pujilah Yah” adalah arti ungkapan liturgis “Haleluya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: Ia telah meninggikan
  rationale: Bentuk dari רום menyatakan tindakan meninggikan. Bentuk perfektif dalam rangkuman pujian ini wajar diterjemahkan dengan aspek sudah terjadi, tanpa menghilangkan citra pengangkatan.
- source_word: קֶרֶן
  choice: tanduk
  rationale: Makna harfiahnya adalah 'tanduk', metafora Ibrani bagi kekuatan, kehormatan, atau kuasa yang ditinggikan. Citra puitis dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: לְעַמּוֹ
  choice: bagi umat-Nya
  rationale: עַם menunjuk kepada suatu umat dalam hubungan komunal dan perjanjian. 'Umat-Nya' alami dalam bahasa Indonesia dan mempertahankan akhiran posesif.
- source_word: תְּהִלָּה
  choice: suatu pujian
  rationale: תְּהִלָּה berarti 'pujian'. Ungkapan ini dibiarkan berhubungan secara longgar dengan klausa sebelumnya karena sintaks Ibraninya padat dan dapat dipahami secara apositif atau sebagai hasil.
- source_word: לְכָל חֲסִידָיו
  choice: bagi semua orang yang setia kepada-Nya
  rationale: חֲסִידָיו menunjuk kepada orang-orang yang bercirikan kesetiaan atau pengabdian kepada Allah. Pilihan ini menyampaikan hubungan tersebut tanpa konotasi gerejawi khusus dari istilah seperti 'orang kudus'.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi anak-anak Israel
  rationale: Secara harfiah berarti 'bagi anak-anak lelaki Israel', tetapi dalam pemakaian ini merupakan sebutan korporat bagi keturunan atau umat Israel. 'Anak-anak Israel' mempertahankan idiom kekerabatan tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: עַם קְרֹבוֹ
  choice: umat yang dekat dengan-Nya
  rationale: קְרֹבוֹ menyatakan kedekatan dengan Allah, kemungkinan dalam arti relasional, perjanjian, dan ibadah. Terjemahan ini mempertahankan citra kedekatan tanpa menggantinya dengan tafsiran seperti 'terpilih' atau 'terkasih'.
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Ungkapan ini terdiri dari perintah jamak 'pujilah' dan bentuk pendek nama ilahi, יָהּ. Terjemahan langsung mempertahankan baik arti maupun bentuk nama yang dipakai sumber.
theological_decisions:
- issue: Makna metaforis קֶרֶן
  choice: tanduk
  alternative: kekuatan; kejayaan; kuasa
  rationale: Metafora sumber dipertahankan agar pembaca tetap menjumpai keluasan maknanya—kekuatan, kehormatan, dan kuasa yang ditinggikan—tanpa mengunci teks pada satu penafsiran.
- issue: Hubungan sintaksis תְּהִלָּה dengan klausa sebelumnya
  choice: suatu pujian, ditempatkan secara apositif setelah tanda pisah
  alternative: menjadikan pengangkatan tanduk itu menghasilkan pujian; atau memahami 'pujian' sebagai keterangan lebih lanjut tentang tanduk
  rationale: Teks Ibrani sangat padat dan tidak menyatakan hubungan tersebut secara eksplisit. Tanda pisah menjaga hubungan dekat sekaligus membiarkan nuansa apositif atau resultatif tetap terbuka.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: putra-putra Israel; keturunan Israel; umat Israel
  rationale: Walaupun bentuk Ibraninya maskulin jamak, frasa ini adalah sebutan korporat. Bahasa Indonesia 'anak-anak Israel' cukup dekat dengan bentuk sumber dan tidak mempersempit rujukannya hanya kepada laki-laki.
- issue: Penerjemahan bentuk pendek nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN; Haleluya
  rationale: Sumber secara khusus memakai bentuk pendek יָהּ. 'Yah' mempertahankan bentuk itu dan membuat arti seruan liturgisnya transparan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Metafora 'tanduk' serta nama pendek 'Yah' dipertahankan dari teks Ibrani; tanda pisah membantu menyajikan sintaks sumber yang padat tanpa menyelesaikan ambiguitasnya secara berlebihan.
