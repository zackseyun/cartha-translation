  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהַלְל֤וּ אֶת שֵׁ֬ם יְהוָ֗ה כִּֽי נִשְׂגָּ֣ב שְׁמ֣/וֹ לְ/בַדּ֑/וֹ ה֝וֹד֗/וֹ עַל אֶ֥רֶץ וְ/שָׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/013.yaml
  text: Let them praise the name of Yahweh[a], for his name alone is exalted; his majesty is above earth and heaven.
translation:
  language: id
  text: Biarlah mereka memuji nama Yahweh, sebab hanya nama-Nya yang luhur; keagungan-Nya[a] melampaui bumi dan langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kemegahan-Nya” atau “kemuliaan-Nya.”'
    reason: הוֹד memiliki rentang makna yang mencakup keagungan, kemegahan, dan kemuliaan.
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Biarlah mereka memuji
  rationale: Bentuk imperfek orang ketiga jamak berfungsi sebagai ajakan dalam rangkaian seruan pujian; “Biarlah mereka memuji” menyampaikan daya jussifnya secara alami.
- source_word: שֵׁם יְהוָה
  choice: nama Yahweh
  rationale: “Nama” dipertahankan karena penting dalam ungkapan puitis dan teologis Ibrani, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” alih-alih diganti dengan gelar.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi seruan untuk memuji.
- source_word: נִשְׂגָּב שְׁמוֹ לְבַדּוֹ
  choice: hanya nama-Nya yang luhur
  rationale: “Luhur” mengungkapkan keadaan ditinggikan atau berada tinggi tanpa menyiratkan pelaku tertentu; “hanya” mempertahankan penekanan eksklusif לְבַדּוֹ pada nama-Nya.
- source_word: הוֹדוֹ
  choice: keagungan-Nya
  rationale: הוֹד menunjuk pada kemegahan, semarak, atau kemuliaan yang agung. “Keagungan” sesuai dengan konteks pujian dan mudah dipahami.
- source_word: עַל אֶרֶץ וְשָׁמָיִם
  choice: melampaui bumi dan langit
  rationale: עַל di sini menyatakan ketinggian atau keunggulan atas bumi dan langit. “Melampaui” menyampaikan gambaran puitis itu dengan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Subjek yang secara eksklusif luhur
  choice: hanya nama-Nya yang luhur
  alternative: hanya Dia yang luhur
  rationale: Teks Ibrani secara eksplisit menyebut שְׁמוֹ (“nama-Nya”); terjemahan mempertahankan fokus itu dan tidak mengalihkannya kepada “Dia” meskipun maknanya berkaitan erat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang sederhana dan bermartabat. Susunan paralel Ibrani dipertahankan sejauh tetap alami, dan penanda catatan kaki [a] ditempatkan tepat sesudah kata yang dijelaskannya.
