id: PSA.148.1
reference: Psalms 148:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽלְל֣וּ אֶת יְ֭הוָה מִן הַ/שָּׁמַ֑יִם הַֽ֝לְל֗וּ/הוּ בַּ/מְּרוֹמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/001.yaml
  text: Praise Yah! Praise Yahweh from the heavens[a]; praise him in the heights.
translation:
  language: id
  text: Pujilah Yah![a] Pujilah Yahweh dari langit; pujilah Dia di tempat-tempat tinggi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, halelu-Yah, secara harfiah “Pujilah Yah”; dari ungkapan inilah berasal kata “Haleluya”.
    reason: Menjelaskan bentuk Ibrani dan hubungan antara seruan yang diterjemahkan dengan istilah liturgis yang dikenal luas.
lexical_decisions:
- source_word: הַלְלוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak Piel dari הלל, yaitu seruan langsung kepada banyak pihak untuk memuji. “Pujilah” jelas, alami, dan mempertahankan daya perintahnya.
- source_word: יָהּ
  choice: Yah
  rationale: Bentuk puitis pendek dari nama ilahi. Transliterasi “Yah” mempertahankan perbedaannya dari bentuk lengkap יְהוָה yang muncul sesudahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan nama perjanjian dengan transliterasi yang lazim dan membedakannya dari bentuk pendek יָהּ.
- source_word: מִן הַשָּׁמַיִם
  choice: dari langit
  rationale: Preposisi מִן menyatakan asal atau titik tempat seruan pujian itu disampaikan. “Langit” dalam bahasa Indonesia dapat berfungsi kolektif dan menyampaikan ruang surgawi tanpa ungkapan jamak yang kaku.
- source_word: הַלְלוּהוּ
  choice: pujilah Dia
  rationale: Akhiran pronominal orang ketiga maskulin tunggal merujuk kembali kepada Yahweh. “Dia” mempertahankan rujukan pronominal itu tanpa mengulang nama ilahi.
- source_word: בַּמְּרוֹמִים
  choice: di tempat-tempat tinggi
  rationale: Bentuk jamak מְרוֹמִים menunjuk pada ketinggian atau tempat-tempat yang tinggi. Pilihan ini mempertahankan gambaran ruang yang ditinggikan tanpa mempersempitnya menjadi “surga tertinggi”.
theological_decisions:
- issue: Pembedaan יָהּ dan יְהוָה dalam ayat yang sama
  choice: Menerjemahkan יָהּ sebagai “Yah” dan יְהוָה sebagai “Yahweh”
  alternative: Menerjemahkan keduanya dengan sebutan yang sama, misalnya “TUHAN”
  rationale: Teks Ibrani sengaja memakai bentuk pendek dan bentuk lengkap secara berdampingan. Mempertahankan “Yah” dan “Yahweh” menjaga perbedaan leksikal tersebut serta kaitan liturgis ungkapan pertama dengan “Haleluya”.
- issue: Arah frasa מִן הַשָּׁמַיִם
  choice: “dari langit”
  alternative: “di langit”
  rationale: Arti dasar מִן adalah “dari”. Walaupun konteks dapat dipahami sebagai pemanggilan para penghuni langit, terjemahan tidak mengubah preposisi menjadi penanda lokasi dan dengan demikian mempertahankan kemungkinan nuansa asal seruan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan imperatif dipertahankan untuk menjaga irama seruan puitis. Tanda seru menegaskan nada ajakan yang kuat; huruf kapital pada “Dia” mengikuti gaya hormat bagi rujukan kepada Allah.
