  yaml_path: translation/ot/psalms/148/006.yaml
  text: And he established them forever and ever; he gave a decree[a], and it will not pass away.
translation:
  language: id
  text: Ia menegakkan mereka untuk seterusnya dan selama-lamanya; Ia memberikan ketetapan[a], dan ketetapan itu tidak akan berlalu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia memberikan ketetapan, dan mereka tidak melampauinya,” atau “tidak ada yang melampauinya.” Klausa terakhir dalam bahasa Ibrani dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידֵם
  choice: Ia menegakkan mereka
  rationale: Bentuk Hifil dari עמד dengan akhiran orang ketiga jamak menyatakan tindakan menyebabkan mereka berdiri atau menjadi teguh. “Menegakkan” mempertahankan nuansa kausatif dan cocok dengan gambaran kestabilan ciptaan.
- source_word: לָעַד לְעוֹלָם
  choice: untuk seterusnya dan selama-lamanya
  rationale: Kedua ungkapan waktu ini bersama-sama menegaskan keberlangsungan tanpa akhir. Padanan ini mempertahankan penguatan dalam bahasa Ibrani sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: חָק
  choice: suatu ketetapan
  rationale: Kata ini dapat menunjuk pada ketetapan, batas yang ditentukan, atau tatanan yang tetap. “Ketetapan” cukup luas untuk mencakup nuansa hukum ilahi dan keteraturan ciptaan tanpa mempersempitnya.
- source_word: נָתַן
  choice: memberikan
  rationale: Arti dasarnya ialah “memberi”. Terjemahan ini mempertahankan ungkapan Ibrani bahwa Allah memberikan suatu ketetapan, meskipun “menetapkan” juga mungkin secara idiomatis.
- source_word: וְלֹא יַעֲבוֹר
  choice: dan ketetapan itu tidak akan berlalu
  rationale: עבר dapat berarti berlalu, melampaui, atau melanggar. Teks utama memahami subjek tunggalnya sebagai ketetapan yang tetap berlaku; pengulangan “ketetapan itu” membuat rujukannya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek dan arti וְלֹא יַעֲבוֹר
  choice: Ketetapan itu sendiri tidak akan berlalu.
  alternative: Makhluk-makhluk itu tidak melampaui ketetapan tersebut, atau tidak ada yang melampauinya.
  rationale: Bahasa Ibrani tidak menyatakan objek dan memungkinkan lebih dari satu pemahaman atas subjek klausa terakhir. Teks utama mengikuti pembacaan bahwa ketetapan Allah tetap berlaku, sedangkan pembacaan lain dipertahankan dalam catatan kaki agar ketaksaan aslinya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “Ia” mengikuti register Alkitab yang lazim. Ungkapan durasi dibuat idiomatis tanpa menghilangkan penegasan ganda dari teks Ibrani; ketaksaan klausa terakhir dijaga melalui catatan kaki.
