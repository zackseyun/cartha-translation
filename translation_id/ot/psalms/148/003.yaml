  text: הַֽ֭לְלוּ/הוּ שֶׁ֣מֶשׁ וְ/יָרֵ֑חַ הַ֝לְל֗וּ/הוּ כָּל כּ֥וֹכְבֵי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/003.yaml
  text: Praise him[a], sun and moon; praise him, all shining stars.
translation:
  language: id
  text: Pujilah Dia, matahari dan bulan; pujilah Dia, segala bintang yang bercahaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “segala bintang cahaya.”
    reason: Menunjukkan bentuk konstruksi puitis Ibrani כּוֹכְבֵי אוֹר yang diterjemahkan secara lebih alami sebagai 'bintang yang bercahaya'.
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Pujilah Dia
  rationale: Bentuk imperatif jamak dari הלל dengan akhiran objek orang ketiga tunggal. Terjemahan ini mempertahankan seruan langsung kepada benda-benda langit dan pengulangan puitisnya.
- source_word: שֶׁמֶשׁ
  choice: matahari
  rationale: Padanan leksikal baku dan alami dalam bahasa Indonesia.
- source_word: וְיָרֵחַ
  choice: dan bulan
  rationale: Padanan leksikal baku dengan kata penghubung Ibrani tetap dipertahankan.
- source_word: כָּל
  choice: segala
  rationale: Kuantor kolektif yang mencakup seluruh kelompok bintang; 'segala' sesuai dengan laras puitis mazmur.
- source_word: כּוֹכְבֵי אוֹר
  choice: bintang yang bercahaya
  rationale: Ungkapan konstruksi harfiah 'bintang-bintang cahaya' secara alami menyatakan bintang-bintang yang memancarkan atau memiliki cahaya. Bentuk relatif ini jelas dan puitis dalam bahasa Indonesia tanpa menghilangkan citra cahaya.
theological_decisions:
- issue: Personifikasi benda-benda langit dalam pujian
  choice: Mempertahankan perintah langsung kepada matahari, bulan, dan bintang-bintang untuk memuji Allah.
  alternative: Mengubahnya menjadi pernyataan penjelas bahwa ciptaan menyatakan pujian.
  rationale: Teks Ibrani memakai imperatif orang kedua jamak yang ditujukan langsung kepada benda-benda langit. Bentuk ini mempertahankan personifikasi puitis dan panggilan agar seluruh ciptaan memuji Allah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan 'Pujilah Dia' serta sapaan langsung kepada benda-benda langit dipertahankan untuk menjaga struktur dan daya puitis ayat.
