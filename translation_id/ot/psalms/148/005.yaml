  text: יְֽ֭הַֽלְלוּ אֶת שֵׁ֣ם יְהוָ֑ה כִּ֤י ה֭וּא צִוָּ֣ה וְ/נִבְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/005.yaml
  text: Let them praise the name of Yahweh[a], for he commanded, and they were created.
translation:
  language: id
  text: Biarlah mereka memuji nama Yahweh[a], karena Dia memberi perintah, dan mereka diciptakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH.” Nama ini secara tradisional diterjemahkan “TUHAN.”'
    reason: Menjelaskan bentuk Ibrani nama ilahi dan tradisi penerjemahannya tanpa menyebut bentuk yang dipakai dalam teks utama sebagai sekadar alternatif.
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Biarlah mereka memuji
  rationale: Bentuk piel imperfek yang berfungsi sebagai jusif dalam konteks himne ini menyatakan ajakan; ungkapan ini menyampaikan daya ajakan tersebut secara alami dalam bahasa Indonesia.
- source_word: אֶת שֵׁם
  choice: nama
  rationale: Mempertahankan ungkapan Ibrani 'memuji nama' yang menunjuk pada identitas dan kemasyhuran Allah tanpa memparafrasakannya secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi ajakan untuk memuji.
- source_word: הוּא
  choice: Dia
  rationale: Pronomina eksplisit ini merujuk kepada Yahweh; huruf kapital digunakan menurut kelaziman bahasa Indonesia bagi pronomina yang mengacu kepada Allah.
- source_word: צִוָּה
  choice: memberi perintah
  rationale: Menyatakan tindakan mengeluarkan perintah dan terdengar alami dalam susunan bahasa Indonesia, tanpa menambahkan objek yang tidak disebutkan.
- source_word: וְנִבְרָאוּ
  choice: dan mereka pun tercipta
  rationale: Bentuk nifal perfektif jamak dipertahankan sebagai hasil pasif/intransitif dari perintah penciptaan; 'pun' secara alami menandai akibat langsung tanpa mengubah makna.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi, sementara catatan kaki memberitahukan tradisi penerjemahan lain tanpa menetapkan suatu kekhasan denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis sederhana. 'Biarlah' mempertahankan nuansa ajakan himne; 'mereka pun tercipta' menjaga hubungan ringkas antara perintah Allah dan terjadinya penciptaan.
