lexical_decisions:
- source_word: הַחַיָּה
  choice: binatang liar
  rationale: Kata ini lazim menunjuk pada binatang liar dan di sini dikontraskan dengan בְּהֵמָה, yaitu hewan piaraan atau ternak.
- source_word: וְכָל בְּהֵמָה
  choice: dan segala ternak
  rationale: בְּהֵמָה dalam pasangan ini menunjuk pada hewan piaraan; 'ternak' mempertahankan kontras dengan binatang liar, sedangkan 'segala' menerjemahkan כָּל.
- source_word: רֶמֶשׂ
  choice: binatang melata
  rationale: Istilah ini mencakup makhluk yang bergerak dengan merayap atau melata tanpa mempersempitnya pada kelompok zoologis tertentu.
- source_word: וְצִפּוֹר כָּנָף
  choice: dan burung bersayap
  rationale: Frasa Ibrani secara harfiah mengaitkan burung dengan sayap; terjemahan ini ringkas, alami, dan mempertahankan citra sumber.
