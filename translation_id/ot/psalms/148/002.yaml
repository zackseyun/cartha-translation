  text: הַֽלְל֥וּ/הוּ כָל מַלְאָכָ֑י/ו הַֽ֝לְל֗וּ/הוּ כָּל צבא/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/002.yaml
  text: Praise him[a], all his angels; praise him, all his hosts.
translation:
  language: id
  text: Pujilah Dia, semua malaikat-Nya; pujilah Dia, seluruh bala tentara-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh bala tentara surgawi-Nya” atau “seluruh pasukan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Pujilah Dia
  rationale: Bentuk imperatif jamak dari הלל dengan sufiks orang ketiga tunggal maskulin. Pilihan ini mempertahankan perintah langsung kepada banyak makhluk surgawi dalam bahasa Indonesia yang alami.
- source_word: כָל
  choice: semua / seluruh
  rationale: Keduanya menyampaikan cakupan menyeluruh. 'Semua' alami sebelum nomina yang dapat dihitung, sedangkan 'seluruh' lebih luwes dalam frasa kolektif 'seluruh bala tentara-Nya'.
- source_word: מַלְאָכָיו
  choice: malaikat-Nya
  rationale: Dalam konteks pujian surgawi, מַלְאָכִים menunjuk kepada makhluk surgawi, bukan utusan manusia; 'malaikat' merupakan padanan Indonesia yang baku dan tepat.
- source_word: צְבָאוֹ
  choice: bala tentara-Nya
  rationale: צָבָא dapat berarti pasukan atau bala tentara. Dalam kesejajaran dengan para malaikat dan konteks kosmis, ungkapan ini menunjuk pada bala tentara surgawi milik Allah, sambil mempertahankan citra kolektif dan militernya.
theological_decisions:
- issue: Rujukan sufiks pronominal ('Dia' dan '-Nya')
  choice: Merujuk kepada TUHAN yang dipuji di seluruh mazmur ini.
  alternative: Menambahkan nama 'TUHAN' secara eksplisit dalam ayat ini.
  rationale: Ayat 1 telah menetapkan TUHAN sebagai pihak yang dipuji; ayat 2 melanjutkan seruan itu dengan pronomina sebagaimana teks Ibrani, tanpa perluasan doktrinal.
- issue: Identitas צְבָאוֹ
  choice: Dipertahankan sebagai kelompok kolektif 'bala tentara-Nya'.
  alternative: Diperjelas menjadi 'bala tentara surgawi-Nya'.
  rationale: Konteks memang bersifat surgawi, tetapi kata 'surgawi' tidak dinyatakan secara eksplisit dalam frasa Ibrani ini. Terjemahan utama mempertahankan keluasan ungkapan sumber, sedangkan penjelasan konteks diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan puitis. Partikel vokatif 'hai' membuat sasaran perintah jamak eksplisit dan menjaga irama paralel. Huruf kapital pada 'Dia' dan sufiks '-Nya' mengikuti kebiasaan ejaan religius Indonesia untuk rujukan kepada Allah.
