  text: הַֽלְל֣וּ אֶת יְ֭הוָה מִן הָ/אָ֑רֶץ תַּ֝נִּינִ֗ים וְ/כָל תְּהֹמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/007.yaml
  text: Praise Yahweh from the earth[b][a], sea creatures and all deeps.
translation:
  language: id
  text: Pujilah Yahweh dari bumi, hai makhluk-makhluk laut[a] dan segala kedalaman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “monster laut” atau “naga”. Kata Ibrani tanninim dapat merujuk pada makhluk besar yang menyerupai ular atau berkaitan dengan laut.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “segala kedalaman”; ungkapan Ibrani ini membangkitkan gambaran perairan yang dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְל֣וּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak dari הלל; “Pujilah” merupakan seruan langsung dan wajar dalam gaya mazmur Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה alih-alih menggantinya dengan gelar.
- source_word: מִן הָאָרֶץ
  choice: dari bumi
  rationale: Dalam konteks kosmis Mazmur 148, אֶרֶץ menunjuk pada ranah bumi yang berlawanan dengan langit, bukan suatu negeri tertentu.
- source_word: תַּנִּינִים
  choice: makhluk-makhluk laut
  rationale: Istilah ini dapat menunjuk pada makhluk besar, menyerupai ular, atau mengerikan yang berkaitan dengan laut. Pilihan ini alami bagi pembaca modern tanpa meniadakan alternatif leksikal yang dicatat dalam catatan kaki.
- source_word: תְּהֹמוֹת
  choice: samudra raya
  rationale: Bentuk jamak תהום menggambarkan perairan dalam atau kedalaman samudra. “Samudra raya” mempertahankan citra perairan kosmis dalam bahasa Indonesia yang puitis dan mudah dipahami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama pribadi tersebut dan tidak menggantinya dengan gelar.
- issue: Nuansa תַּנִּינִים sebagai makhluk biasa atau monster laut
  choice: makhluk-makhluk laut dalam teks utama, dengan alternatif dalam catatan kaki
  alternative: monster-monster laut atau naga-naga
  rationale: Kata Ibrani memiliki rentang makna yang dapat membangkitkan citra makhluk laut besar atau mengerikan. Teks utama dibuat jelas dan alami, sementara ketegangan citranya dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kata seru “hai” memperjelas bahwa makhluk laut dan samudra raya disapa untuk memuji, sebagaimana tersirat oleh susunan Ibrani.
