    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרִים
  choice: para pemuda
  rationale: Kata ini menunjuk kepada laki-laki muda, biasanya dalam masa kuat atau prima. "Para pemuda" alami dalam bahasa Indonesia dan mempertahankan rujukan khusus laki-laki.
- source_word: וְגַם
  choice: dan
  rationale: Dalam daftar puitis yang ringkas ini, partikel penambah tersebut secara alami tercakup dalam penghubung "dan".
- source_word: בְּתוּלוֹת
  choice: para perempuan muda
  rationale: Istilah ini dapat secara khusus berarti perempuan muda yang belum menikah atau perawan, tetapi dalam daftar kelompok berdasarkan usia dan jenis kelamin ini, "para perempuan muda" menyampaikan rujukan utamanya secara alami; arti yang lebih khusus dicatat dalam catatan kaki.
- source_word: זְקֵנִים
  choice: orang-orang tua
  rationale: Dalam rangkaian kelompok usia ini, kata tersebut menunjuk kepada laki-laki berusia lanjut, bukan terutama pemegang jabatan sebagai tua-tua. Bentuk ini alami dalam bahasa Indonesia, meskipun penandaan gendernya lebih tersirat daripada dalam bahasa Ibrani.
- source_word: עִם
  choice: bersama
  rationale: Pilihan ringkas ini mempertahankan pengelompokan orang-orang tua dan anak-anak lelaki, sejajar dengan pasangan sebelumnya.
- source_word: נְעָרִים
  choice: anak-anak lelaki
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada laki-laki yang lebih muda dan berkontras dengan para pemuda pada awal ayat. Pilihan ini mempertahankan jenis kelamin dan perbedaan usia, sementara cakupan usia yang lebih luas dicatat dalam catatan kaki.
