translation:
  language: id
  text: para pemuda dan para perempuan muda[a], para lelaki tua bersama anak-anak lelaki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para perawan”. Kata Ibrani ini dapat secara khusus menunjuk kepada perempuan muda yang masih perawan atau belum menikah.
    reason: lexical_alternative
  - marker: b
