lexical_decisions:
- source_word: מַלְכֵי אֶרֶץ
  choice: raja-raja bumi
  rationale: Bentuk jamak konstruksi ini menyebut para raja yang berada dan berkuasa di bumi; ungkapan tanpa kata sandang cocok dengan rangkaian puitis ayat ini.
- source_word: וְכָל לְאֻמִּים
  choice: dan segala bangsa
  rationale: לְאֻמִּים menunjuk kepada kelompok-kelompok manusia atau bangsa-bangsa. 'Segala bangsa' alami dalam bahasa Indonesia dan mempertahankan cakupan menyeluruh כָל.
- source_word: שָׂרִים
  choice: para pembesar
  rationale: Kata ini menunjuk kepada pemimpin atau pejabat berkedudukan tinggi. 'Para pembesar' mempertahankan ragam bahasa yang luhur tanpa membatasi maknanya pada pangeran berdarah kerajaan.
- source_word: וְכָל שֹׁפְטֵי אָרֶץ
  choice: dan semua hakim di bumi
  rationale: שֹׁפְטֵי secara langsung berarti 'hakim-hakim'. Frasa 'di bumi' menyampaikan hubungan konstruksi secara alami dalam bahasa Indonesia dan selaras dengan cakupan universal mazmur.
theological_decisions:
- issue: Cakupan אֶרֶץ dalam daftar pujian
  choice: bumi
  alternative: negeri
  rationale: Konteks Mazmur 148 memanggil seluruh ciptaan untuk memuji, sehingga arti universal 'bumi' lebih sesuai daripada arti lokal 'negeri', sambil tetap mencatat kemungkinan leksikal tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Paralelisme antarkelompok dipertahankan, dengan 'para pembesar' sebagai padanan luas bagi pejabat tinggi dan tanpa memasukkan gagasan tentang garis keturunan kerajaan.
