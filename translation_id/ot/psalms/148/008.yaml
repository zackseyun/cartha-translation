  text: אֵ֣שׁ וּ֭/בָרָד שֶׁ֣לֶג וְ/קִיט֑וֹר ר֥וּחַ סְ֝עָרָ֗ה עֹשָׂ֥ה דְבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/008.yaml
  text: fire and hail[a], snow and vapor, stormy wind doing his word[c][b],
translation:
  language: id
  text: api dan hujan es, salju dan uap[a], angin badai yang melaksanakan firman-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “asap” atau “kabut.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang menjalankan perintah-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ
  choice: api
  rationale: Padanan langsung dan alami untuk אֵשׁ dalam daftar unsur ciptaan.
- source_word: וּבָרָד
  choice: dan hujan es
  rationale: בָּרָד berarti hujan es; waw diterjemahkan sebagai penghubung 'dan'.
- source_word: שֶׁלֶג
  choice: salju
  rationale: Padanan baku untuk istilah meteorologis ini.
- source_word: וְקִיטוֹר
  choice: dan uap
  rationale: קִיטוֹר dapat berarti uap, asap, atau kabut. 'Uap' menjaga cakupan meteorologis konteks tanpa mengkhususkannya sebagai hasil pembakaran.
- source_word: רוּחַ סְעָרָה
  choice: angin badai
  rationale: Ungkapan alami dalam bahasa Indonesia yang mempertahankan unsur 'angin' dan sifat badai.
- source_word: עֹשָׂה
  choice: yang melaksanakan
  rationale: Partisip Ibrani menggambarkan angin badai yang menjalankan atau mewujudkan apa yang Allah firmankan. 'Melaksanakan' lebih alami daripada terjemahan harfiah 'melakukan' dalam bahasa Indonesia.
- source_word: דְבָרוֹ
  choice: firman-Nya
  rationale: דָּבָר pada dasarnya berarti perkataan atau firman, tetapi dalam konteks ini berfungsi sebagai perintah ilahi. 'Firman-Nya' mempertahankan bentuk leksikal sambil tetap alami.
theological_decisions:
- issue: Rujukan akhiran orang ketiga tunggal maskulin pada דְבָרוֹ
  choice: firman-Nya, dengan -Nya merujuk kepada Allah
  alternative: perintah-Nya
  rationale: Konteks mazmur menyebut berbagai ciptaan yang dipanggil untuk memuji Allah dan bertindak sesuai dengan ucapan-Nya. Kapitalisasi -Nya mengikuti kaidah bahasa Indonesia untuk rujukan kepada Allah, bukan penambahan makna pada teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Susunan daftar dipertahankan, sedangkan frasa penutup dibuat idiomatis tanpa menghilangkan hubungan leksikal antara tindakan angin badai dan firman Allah.
