translation:
  language: id
  text: 'gunung-gunung dan semua bukit,

    pohon buah-buahan[a] dan semua pohon aras,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon-pohon yang berbuah.” Frasa Ibraninya secara harfiah berarti “pohon buah” dan digunakan secara kolektif di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak הָרִים berarti gunung-gunung. Kata sandang Ibrani tidak perlu dinyatakan secara kaku dalam daftar puitis bahasa Indonesia.
- source_word: וְכָל גְּבָעוֹת
  choice: dan semua bukit
  rationale: כָּל berarti semua, sedangkan גְּבָעוֹת menunjuk pada bukit-bukit, membentuk pasangan topografis dengan gunung-gunung.
- source_word: עֵץ פְּרִי
  choice: pohon buah-buahan
  rationale: Frasa konstruksi ini secara harfiah berarti 'pohon buah' dan dipakai secara kolektif. 'Pohon buah-buahan' merupakan ungkapan Indonesia yang alami untuk kategori tersebut.
- source_word: וְכָל אֲרָזִים
  choice: dan semua pohon aras
  rationale: אֲרָזִים berarti pohon-pohon aras. Penyebutan 'pohon' membuat nama jenis ini jelas dan alami bagi pembaca Indonesia.
