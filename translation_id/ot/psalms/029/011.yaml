base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: id
  text: Yahweh memberikan kekuatan kepada umat-Nya; Yahweh memberkati umat-Nya dengan damai sejahtera[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh akan memberikan kekuatan kepada umat-Nya; Yahweh akan memberkati umat-Nya dengan damai sejahtera.” Verba imperfek Ibrani juga dapat dipahami dengan makna masa depan.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani syalom yang diterjemahkan “damai sejahtera” juga mencakup keutuhan dan kesejahteraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: עֹז
  choice: kekuatan
  rationale: Padanan alami bagi daya atau keperkasaan yang Yahweh berikan kepada umat-Nya.
- source_word: לְעַמּוֹ
  choice: kepada umat-Nya
  rationale: Preposisi ל menandai penerima pemberian; 'kepada' menyampaikan fungsi objek tak langsung dengan jelas.
- source_word: יִתֵּן
  choice: memberikan
  rationale: Bentuk imperfek dipahami sebagai tindakan khas atau deklaratif dalam penutup puitis ini, sambil mempertahankan kemungkinan makna masa depan dalam catatan kaki.
- source_word: יְבָרֵךְ
  choice: memberkati
  rationale: Sejajar dengan יִתֵּן dan dibaca sebagai pernyataan yakin tentang tindakan Yahweh, bukan secara pasti sebagai permohonan.
- source_word: אֶת עַמּוֹ
  choice: umat-Nya
  rationale: Mengulang ungkapan tersebut mempertahankan kesejajaran Ibrani.
- source_word: בַשָּׁלוֹם
  choice: dengan damai sejahtera
  rationale: '''Damai sejahtera'' merupakan ungkapan Indonesia yang wajar dan mencakup inti makna שָׁלוֹם berupa kedamaian, keutuhan, dan kesejahteraan.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa; TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Aspek verba imperfek יִתֵּן dan יְבָרֵךְ
  choice: 'Kini deklaratif atau kebiasaan: ''memberikan ... memberkati'''
  alternative: 'Masa depan: ''akan memberikan ... akan memberkati''; kemungkinan optatif: ''kiranya ...'''
  rationale: Dalam penutup puitis ini, bentuk-bentuk tersebut dapat menyatakan tindakan Yahweh yang khas dan pasti. Kemungkinan daya masa depan tetap dicatat, sementara bacaan optatif tidak dipilih karena konteks juga mendukung deklarasi.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan dua klausa dan pengulangan 'umat-Nya' mempertahankan paralelisme puitis Ibrani.
