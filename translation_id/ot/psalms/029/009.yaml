base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: id
  text: Suara TUHAN membuat rusa-rusa betina melahirkan[a] dan melucuti hutan-hutan hingga gundul, dan di dalam bait-Nya[b] semuanya berkata, “Kemuliaan!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat rusa-rusa betina menggeliat” atau “menyebabkan rusa-rusa betina menggeliat dalam sakit bersalin.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “bait” juga dapat berarti “istana.”
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: Suara TUHAN
  rationale: Frasa konstruksi diterjemahkan secara langsung. Nama ilahi יהוה ditampilkan menurut kebiasaan Alkitab bahasa Indonesia sebagai “TUHAN” dengan huruf kapital.
- source_word: יְחוֹלֵ֣ל
  choice: membuat ... melahirkan
  rationale: Dalam hubungan dengan rusa betina, verba חול dapat menggambarkan geliat sakit bersalin dan, secara idiomatis, tindakan melahirkan. Pilihan ini alami dalam bahasa Indonesia, sedangkan nuansa alternatif dipertahankan dalam catatan kaki.
- source_word: אַיָּלוֹת֮
  choice: rusa betina
  rationale: Bentuk Ibrani merujuk kepada rusa-rusa betina; penyebutan jenis kelamin dipertahankan karena berkaitan langsung dengan gambaran persalinan.
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: dan menggunduli hutan-hutan
  rationale: חשׂף berarti menyingkapkan atau membuat telanjang. “Menggunduli” menyampaikan secara hidup bahwa badai melucuti hutan hingga terbuka.
- source_word: וּבְהֵיכָלוֹ
  choice: di dalam bait-Nya
  rationale: הֵיכָל dapat berarti bait atau istana. Dalam suasana pemujaan mazmur ini, “bait” sesuai, tetapi kemungkinan “istana” tetap dicatat.
- source_word: כֻּלּוֹ אֹמֵר
  choice: semuanya berkata
  rationale: Bentuk kolektif/distributif diterjemahkan secara alami. “Berkata” dekat dengan arti dasar אמר tanpa menambahkan intensitas yang tidak dinyatakan secara eksplisit.
- source_word: כָּבֽוֹד
  choice: Kemuliaan!
  rationale: Seruan satu kata mempertahankan bentuk ringkas aklamasi Ibrani dan makna כבוד dalam konteks pujian.
theological_decisions:
- issue: Makna הֵיכָל sebagai tempat TUHAN
  choice: bait
  alternative: istana
  rationale: Konteks aklamasi “Kemuliaan!” mendukung tempat ibadah ilahi, tetapi istilah Ibrani juga dapat menunjuk istana kerajaan. Alternatif itu dipertahankan agar citra TUHAN sebagai Raja tidak disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan dua dampak suara TUHAN dan berakhir dengan aklamasi singkat. “Hutan-hutan” mempertahankan bentuk jamak sumber; kapitalisasi “bait-Nya” mengikuti kebiasaan penghormatan dalam bahasa Indonesia.
