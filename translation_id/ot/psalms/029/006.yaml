  text: וַ/יַּרְקִידֵ֥/ם כְּמוֹ עֵ֑גֶל לְבָנ֥וֹן וְ֝/שִׂרְיֹ֗ן כְּמ֣וֹ בֶן רְאֵמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/006.yaml
  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
translation:
  language: id
  text: Ia membuat Lebanon melonjak-lonjak seperti anak sapi, dan Sirion[a] seperti anak lembu liar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sirion adalah nama lain untuk Gunung Hermon.
    reason: cross_reference
  - marker: b
    text: 'Secara harfiah: “seperti anak dari lembu-lembu liar,” suatu ungkapan untuk anak lembu liar. Dapat juga diterjemahkan “seperti lembu muda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: Ia membuat ... melonjak-lonjak
  rationale: Bentuk Hifil dari רקד bersifat kausatif, ‘membuat melonjak/menari’. Pengulangan ‘melonjak-lonjak’ menyampaikan gerak lincah yang tergambar dalam perbandingan dengan anak sapi, sementara akhiran objek jamak dijabarkan oleh nama Lebanon dan Sirion dalam paralelisme puisi.
- source_word: כְּמוֹ עֵגֶל
  choice: seperti anak sapi
  rationale: עֵגֶל secara wajar menunjuk pada anak sapi atau lembu muda; ‘anak sapi’ alami dalam bahasa Indonesia dan cocok dengan gambaran gerak yang lincah.
- source_word: לְבָנוֹן
  choice: Lebanon
  rationale: Nama tempat dipertahankan sebagai Lebanon.
- source_word: וְשִׂרְיֹן
  choice: dan Sirion
  rationale: Teks Ibrani memakai nama Sirion, bukan Hermon. Nama ini dipertahankan, sedangkan identifikasinya dengan Gunung Hermon dijelaskan dalam catatan kaki.
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: seperti anak lembu liar
  rationale: בֶן dipakai secara idiomatis untuk keturunan atau anak, sedangkan רְאֵם paling mungkin menunjuk pada lembu liar. Ungkapan ini menyampaikan arti zoologis dan nuansa kemudaan secara alami.
theological_decisions: []
