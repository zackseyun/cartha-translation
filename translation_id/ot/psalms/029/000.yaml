base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/000.yaml
  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: id
  text: Mazmur Daud. Berikanlah kepada Yahweh, hai anak-anak ilahi; berikanlah kepada Yahweh kemuliaan dan kekuatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak para ilah.” Ungkapan Ibrani ini juga dapat dipahami sebagai “anak-anak Allah,” “anak-anak para perkasa,” atau “makhluk-makhluk surgawi”; kemungkinan besar yang dimaksud ialah anggota sidang surgawi.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Mazmur Daud
  rationale: Ungkapan judul ini secara alami menyatakan mazmur yang berkaitan dengan Daud; bahasa sumber tidak menentukan secara tegas apakah artinya karya Daud, untuk Daud, atau mengenai Daud.
- source_word: הָבוּ לַיהוָה
  choice: Akuilah bahwa ... adalah milik Yahweh
  rationale: Imperatif הָבוּ dengan ל di sini berarti mengakui atau menyatakan sebagai milik seseorang, bukan menyerahkan sesuatu yang sebelumnya tidak dimilikinya. Rumusan ini menyampaikan idiom tersebut secara wajar dalam bahasa Indonesia.
- source_word: בְּנֵי אֵלִים
  choice: anak-anak ilahi
  rationale: Pilihan ini mempertahankan bentuk kiasan 'anak-anak' dan nuansa ranah ilahi tanpa memastikan apakah אֵלִים harus dipahami sebagai Allah, para ilah, yang perkasa, atau makhluk surgawi.
- source_word: כָּבוֹד וָעֹז
  choice: kemuliaan dan kekuatan
  rationale: Padanan langsung dan lazim untuk kedua nomina Ibrani serta mempertahankan pasangan puitisnya.
theological_decisions:
- issue: Identitas בְּנֵי אֵלִים
  choice: anak-anak ilahi
  alternative: anak-anak Allah; makhluk-makhluk surgawi; anak-anak para perkasa
  rationale: Bahasa Ibrani memungkinkan beberapa pemahaman, meskipun konteks mazmur sangat mungkin menunjuk kepada anggota sidang surgawi. Teks utama tidak memaksakan satu identifikasi teologis, dan catatan kaki menjelaskan alternatifnya.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi nama pribadi mempertahankan pembedaan dalam bahasa sumber antara יהוה dan gelar seperti אֲדֹנָי.
translation_notes:
  register: Bahasa modern, khidmat, dan mudah dipahami. Pengulangan imperatif dipertahankan untuk mencerminkan struktur puitis Ibrani. Sapaan ditempatkan di antara dua klausa berulang sebagaimana dalam sumber.
