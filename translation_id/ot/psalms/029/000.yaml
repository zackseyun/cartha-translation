  naturalness: '"Berikanlah kepada Yahweh" merupakan padanan yang jelas dan wajar dalam register mazmur untuk idiom הָבוּ לַיהוָה. Bentuk ini mempertahankan pengulangan puitis tanpa parafrasa penjelas di dalam teks utama.'
