id: PSA.29.3
reference: Psalms 29:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ק֥וֹל יְהוָ֗ה עַל הַ֫/מָּ֥יִם אֵֽל הַ/כָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל מַ֥יִם רַבִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: id
  text: Suara Yahweh terdengar di atas perairan; Allah yang penuh kemuliaan[a] mengguntur; Yahweh berada di atas perairan yang luas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Allah kemuliaan”; dapat juga diterjemahkan “Allah yang mulia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל
  choice: suara
  rationale: Mempertahankan gambaran puitis tentang guruh sebagai suara pribadi Yahweh, bukan sekadar bunyi alam.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: עַל הַמָּיִם
  choice: di atas perairan
  rationale: Mengungkapkan posisi di atas bentangan air secara alami dalam bahasa Indonesia dan sesuai dengan gambaran badai dalam mazmur ini.
- source_word: אֵל הַכָּבוֹד
  choice: Allah yang penuh kemuliaan
  rationale: Menghasilkan bahasa Indonesia yang alami sambil mempertahankan hubungan Allah dengan kemuliaan dalam frasa konstruksi Ibrani.
- source_word: הִרְעִים
  choice: mengguntur
  rationale: Kata kerja ini secara khusus menyatakan tindakan mengguntur; bentuk kini memberi daya hidup pada penggambaran puitis.
- source_word: מַיִם רַבִּים
  choice: perairan yang luas
  rationale: Dalam ungkapan puitis Ibrani, frasa ini menunjuk pada bentangan air yang besar atau luas; terjemahan ini lebih alami daripada 'banyak air'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian itu secara langsung; transliterasi mempertahankan fungsinya sebagai nama pribadi.
- issue: Guruh digambarkan sebagai suara Allah
  choice: Mempertahankan 'suara' dan 'mengguntur' sebagai gambaran puitis yang saling berkaitan
  alternative: Melebur keduanya menjadi 'guntur Yahweh'
  rationale: Susunan Ibrani sengaja mempertahankan baik suara Yahweh maupun tindakan Allah mengguntur; terjemahan tidak mereduksinya menjadi keterangan cuaca biasa.
- issue: Klausa terakhir tidak memiliki kata kerja tersurat
  choice: Menambahkan 'berada' untuk memperjelas klausa mandiri
  alternative: Yahweh di atas perairan yang luas
  rationale: Kata kerja keadaan tersirat dalam klausa nominal Ibrani. Penambahannya membuat tiga klausa paralel lebih jelas dalam bahasa Indonesia tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Tiga klausa paralel dipertahankan dengan tanda titik koma; kosakata 'perairan' menghindari ungkapan kaku 'banyak air'.
