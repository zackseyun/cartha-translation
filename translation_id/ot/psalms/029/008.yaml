  text: ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: id
  text: Suara Yahweh mengguncangkan padang belantara[a]; Yahweh mengguncangkan padang belantara Kadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat padang belantara menggeliat” atau “membuat padang belantara gemetar.”
    reason: Alternatif leksikal ini mempertahankan rentang makna bentuk Hifil יָחִיל, yang dapat menggambarkan gerakan menggeliat, gemetar, atau berguncang.
lexical_decisions:
- source_word: ק֣וֹל
  choice: suara
  rationale: Dalam Mazmur 29, frasa berulang קוֹל יְהוָה berfungsi sebagai refrein puitis. “Suara” mempertahankan sifat personal dan daya sastranya, bukan sekadar bunyi yang impersonal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi Allah dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: יָחִיל
  choice: mengguncangkan
  rationale: Bentuk Hifil dari חול dapat berarti menyebabkan sesuatu menggeliat, gemetar, atau berguncang. “Mengguncangkan” alami dalam bahasa Indonesia, kuat secara puitis, dan sesuai dengan padang belantara sebagai objek langsung.
- source_word: מִדְבָּר
  choice: padang belantara
  rationale: “Padang belantara” mencakup wilayah liar, tandus, dan tidak dibudidayakan, sehingga tidak mempersempit makna menjadi gurun pasir semata.
- source_word: מִדְבַּר קָדֵשׁ
  choice: padang belantara Kades
  rationale: Frasa konstruksi Ibrani menunjuk pada padang belantara yang berkaitan dengan Kades. Nama tempat קָדֵשׁ ditransliterasikan sebagai “Kades”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama pribadi tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan struktur Ibrani dipertahankan sebagai refrein, sedangkan tanda titik koma mencerminkan paralelisme kedua klausa.
