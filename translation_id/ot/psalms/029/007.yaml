source:
  edition: WLC
  text: קוֹל יְהוָ֥ה חֹצֵ֗ב לַהֲב֥וֹת אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/007.yaml
  text: The voice of Yahweh hews out flames of fire[a].
translation:
  language: id
  text: Suara Yahweh membelah nyala-nyala api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kilatan-kilatan api”, kemungkinan merujuk pada kilat dalam gambaran penampakan Yahweh di tengah badai dalam mazmur ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: suara
  rationale: Kata ini dapat berarti 'suara' atau 'bunyi'. Dalam pengulangan puitis Mazmur 29, 'suara' mempertahankan gambaran badai sebagai ucapan Yahweh yang berkuasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: חֹצֵב
  choice: membelah
  rationale: Partisip Ibrani ini menggambarkan tindakan memahat, menetak, atau membelah. 'Membelah' mempertahankan daya konkret ungkapan itu dan cocok dengan gambaran kilat yang menyambar.
- source_word: לַהֲבוֹת
  choice: nyala-nyala
  rationale: Bentuk jamak ini secara langsung menunjuk pada nyala atau lidah api; pengulangan 'nyala-nyala' menyatakan kemajemukan dengan alami dalam bahasa Indonesia.
- source_word: אֵשׁ
  choice: api
  rationale: Makna dasarnya adalah 'api'; bersama לַהֲבוֹת, kata ini membentuk ungkapan puitis 'nyala-nyala api'.
theological_decisions:
- issue: Gambaran badai dan tindakan ilahi tanpa mengubah puisi menjadi uraian meteorologis
  choice: membelah nyala-nyala api
  alternative: memancarkan kilatan api / membelah kilat
  rationale: Teks utama mempertahankan citra konkret dan agensi suara Yahweh, sedangkan kemungkinan bahwa ungkapan itu merujuk pada kilat dijelaskan dalam catatan kaki tanpa dipastikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. 'Membelah' dipilih daripada 'memahat' karena lebih alami untuk gambaran nyala atau kilat, sambil tetap mempertahankan kekuatan verba Ibrani.
