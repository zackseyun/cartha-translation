source:
  edition: WLC
  text: יְ֭הוָה לַ/מַּבּ֣וּל יָשָׁ֑ב וַ/יֵּ֥שֶׁב יְ֝הוָ֗ה מֶ֣לֶךְ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/010.yaml
  text: Yahweh sat enthroned over the flood[a]; Yahweh sits enthroned as King forever.
translation:
  language: id
  text: Yahweh bertakhta di atas air bah[a]; Yahweh bertakhta sebagai Raja untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Air Bah,” yang secara khusus merujuk pada air bah pada zaman Nuh.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama diri dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: לַמַּבּוּל
  choice: di atas air bah
  rationale: מַבּוּל berarti banjir besar atau air bah dan dapat mengacu secara khusus pada air bah purba. Prefiks ל dipahami secara lokatif dalam gambaran pemerintahan ilahi; “di atas” menyampaikan kedaulatan Yahweh atas air bah tanpa menutup kemungkinan adanya acuan khusus kepada peristiwa pada zaman Nuh.
- source_word: יָשָׁב
  choice: bertakhta
  rationale: Makna dasarnya ialah “duduk” atau “berdiam”, tetapi konteks kerajaan dan kesejajarannya dengan “Raja” memberi nuansa duduk di takhta. “Bertakhta” menyampaikan nuansa kerajaan itu secara alami dalam bahasa Indonesia.
- source_word: וַיֵּשֶׁב
  choice: bertakhta
  rationale: Bentuk ini melanjutkan pernyataan sebelumnya dan, bersama “untuk selama-lamanya”, menggambarkan pemerintahan Yahweh yang tetap berlangsung. Bahasa Indonesia tidak wajib menandai perbedaan kala secara morfologis, sehingga “bertakhta” dapat mencakup kesinambungan tersebut.
- source_word: מֶלֶךְ
  choice: sebagai Raja
  rationale: Kata ini menyatakan kedudukan kerajaan Yahweh. “Sebagai Raja” alami dalam bahasa Indonesia dan mempertahankan klaim eksplisit bahwa Yahweh memerintah.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir; padanan ini jelas, lazim, dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah מַבּוּל menunjuk secara khusus pada Air Bah pada zaman Nuh atau pada banjir/air kacau secara umum
  choice: Teks utama memakai “air bah” dengan huruf kecil tanpa menyebut Nuh.
  alternative: “Air Bah,” yakni peristiwa air bah pada zaman Nuh.
  rationale: Dalam pemakaian Alkitab, מַבּוּל sangat kuat terkait dengan air bah purba, tetapi ayat ini tidak menyebut Nuh secara eksplisit dan konteks Mazmur 29 menggambarkan badai serta kuasa Yahweh atas air. Terjemahan utama mempertahankan keterbukaan ini, sedangkan catatan kaki menjelaskan kemungkinan acuan khususnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bertakhta” dipilih untuk mempertahankan citra duduk kerajaan secara ringkas dan alami. Pengulangan “Yahweh bertakhta” mengikuti kesejajaran puitis teks Ibrani.
