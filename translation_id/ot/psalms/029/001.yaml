id: PSA.29.1
reference: Psalms 29:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: id
  text: 'Mazmur Daud.


    Berikanlah kepada Yahweh, hai anak-anak Allah[a],

    berikanlah kepada Yahweh kemuliaan dan kekuatan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk-makhluk surgawi” atau “anak-anak para ilah.” Ungkapan Ibrani ini kemungkinan menunjuk kepada para anggota sidang surgawi.
    reason: Menjaga ketaksaan leksikal dan latar gambaran surgawi dalam frasa בְּנֵי אֵלִים.
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Mazmur Daud
  rationale: Bentuk judul yang alami dan lazim dalam bahasa Indonesia. Susunan ini tidak secara tegas membatasi לְ pada arti kepengarangan saja, sehingga hubungan mazmur dengan Daud tetap cukup terbuka.
- source_word: הָבוּ
  choice: Berikanlah
  rationale: Imperatif ini secara harfiah berarti 'berikanlah', tetapi dalam konteks pujian bermakna mengakui atau menyatakan bahwa kemuliaan dan kekuatan adalah milik Yahweh. Pilihan ini mempertahankan pengulangan dan bentuk puitis Ibrani tanpa parafrasa panjang.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: בְּנֵי אֵלִים
  choice: hai anak-anak Allah
  rationale: Terjemahan ini mempertahankan citra hubungan 'anak-anak' dalam bahasa Ibrani. Karena frasa tersebut kemungkinan menunjuk kepada anggota sidang surgawi dan bentuk אֵלִים dapat dipahami dengan beberapa cara, alternatif dijelaskan dalam catatan kaki.
- source_word: כָּבוֹד וָעֹז
  choice: kemuliaan dan kekuatan
  rationale: '''Kemuliaan'' merupakan padanan baku כָּבוֹד dalam konteks keagungan ilahi, sedangkan ''kekuatan'' menyampaikan arti עֹז secara alami.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama ilahi secara langsung; 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar umum.
- issue: Identitas בְּנֵי אֵלִים
  choice: anak-anak Allah
  alternative: makhluk-makhluk surgawi; anak-anak para ilah
  rationale: Teks utama mempertahankan citra Ibrani tanpa mengganti kelompok tersebut dengan tafsiran eksplisit. Catatan kaki menjelaskan bahwa ungkapan itu kemungkinan mengacu pada anggota sidang surgawi serta mempertahankan kemungkinan bentuk plural אֵלִים.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan imperatif dipertahankan demi struktur serta daya puitis ayat. Partikel vokatif 'hai' menandai sapaan langsung dengan jelas.
