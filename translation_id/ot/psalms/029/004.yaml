  text: קוֹל יְהוָ֥ה בַּ/כֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּ/הָדָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/004.yaml
  text: The voice of Yahweh is powerful[b][a]; the voice of Yahweh is majestic.
translation:
  language: id
  text: Suara Yahweh penuh kuasa[a]; suara Yahweh penuh keagungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Suara Yahweh berkuasa; suara Yahweh agung.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: suara
  rationale: Kata ini dapat berarti 'suara' atau 'bunyi'. Dalam rumusan berulang mazmur ini, 'suara' mempertahankan sifat pribadi dan aktif dari ucapan Yahweh yang menggelegar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: בַּכֹּחַ
  choice: penuh kuasa
  rationale: Frasa dengan preposisi ב dapat dipahami secara deskriptif sebagai suara yang bercirikan kuasa atau secara lebih harfiah 'dengan kuasa'. 'Penuh kuasa' alami dalam bahasa Indonesia dan mempertahankan bentuk nominal serta kesejajaran puisi.
- source_word: הָדָר
  choice: keagungan
  rationale: Kata ini menyatakan keagungan, semarak, atau kemegahan. 'Keagungan' sesuai dengan suasana kerajaan dan teofanik mazmur serta sejajar dengan 'kuasa'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi YHWH secara langsung. Bentuk 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Hubungan preposisional dalam בַּכֹּחַ dan בֶּהָדָר
  choice: penuh kuasa; penuh keagungan
  alternative: dengan kuasa; dengan keagungan
  rationale: Ungkapan ini dapat dibaca secara deskriptif atau lebih harfiah sebagai frasa berpreposisi. Terjemahan utama memakai bahasa Indonesia yang alami tanpa menutup kemungkinan struktur alternatif, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan lugas. Pengulangan 'suara Yahweh' serta kesejajaran antara 'kuasa' dan 'keagungan' dipertahankan.
