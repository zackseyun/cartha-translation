source:
  edition: WLC
  text: הָב֣וּ לַֽ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ הִשְׁתַּחֲו֥וּ לַ֝/יהוָ֗ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: id
  text: Berikanlah kepada Yahweh kemuliaan nama-Nya; sembahlah Yahweh dalam semarak kekudusan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam keindahan kekudusan”; mungkin juga, “dengan pakaian kudus.”
    reason: Frasa Ibrani ini dapat dipahami secara abstrak sebagai semarak atau keindahan kekudusan, atau secara konkret sebagai busana kudus dalam ibadah.
lexical_decisions:
- source_word: הָבוּ
  choice: Berikanlah
  rationale: Bentuk perintah jamak ini secara harfiah berarti “berikanlah” dan dalam rumusan mazmur ini mengajak umat mempersembahkan atau mengakui kemuliaan bagi Yahweh. Pilihan ini mempertahankan citra Ibrani tanpa mengacu pada pemberian benda secara fisik.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima, sedangkan nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama perjanjian dalam teks tetap tampak.
- source_word: כְּבוֹד שְׁמוֹ
  choice: kemuliaan nama-Nya
  rationale: Terjemahan ini mengikuti susunan konstruksi Ibrani secara dekat dan tidak menambahkan gagasan “yang layak bagi” meskipun gagasan itu tersirat dalam konteks.
- source_word: הִשְׁתַּחֲווּ
  choice: sembahlah
  rationale: Kata kerja ini secara konkret berarti membungkuk atau bersujud, tetapi ketika diarahkan kepada Yahweh kata tersebut menyatakan tindakan penyembahan. “Sembahlah” alami dan jelas dalam bahasa Indonesia modern.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: dalam semarak kekudusan
  rationale: הָדָר dapat berarti semarak, keindahan, atau keagungan, sedangkan קֹדֶשׁ berarti kekudusan atau sesuatu yang kudus. Ungkapan ini mempertahankan bentuk puitis dan tidak memutuskan apakah yang dimaksud terutama sifat kekudusan atau busana ibadah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna בְּהַדְרַת קֹדֶשׁ
  choice: dalam semarak kekudusan
  alternative: dalam keindahan kekudusan; dengan pakaian kudus
  rationale: Frasa Ibrani dapat menunjuk pada keindahan atau keagungan yang kudus, tetapi mungkin juga pada busana upacara yang kudus. Teks utama mempertahankan ambiguitas puitis, sedangkan catatan kaki mencatat kemungkinan konkret.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan khidmat. Bentuk “-lah” mempertahankan daya perintah liturgis. Huruf kapital pada “-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah dalam bahasa Indonesia.
