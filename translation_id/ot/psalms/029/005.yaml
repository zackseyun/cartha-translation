base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: id
  text: Suara Yahweh[a] mematahkan pohon-pohon aras; Yahweh meremukkan[b] pohon-pohon aras Lebanon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bunyi Yahweh.” Kata Ibrani qol dapat berarti “suara” atau “bunyi”; “suara” dipilih untuk mempertahankan gambaran berulang dalam mazmur ini tentang suara Yahweh yang personal dan menggelegar.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani mengulang akar kata yang sama, yaitu “mematahkan”, dalam kedua klausa. “Meremukkan” pada klausa kedua menyampaikan peningkatan puitis.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: Suara Yahweh
  rationale: קוֹל dapat berarti ‘suara’ atau ‘bunyi’. ‘Suara’ mempertahankan gambaran berulang dalam mazmur ini tentang sabda Yahweh yang personal dan menggelegar.
- source_word: שֹׁבֵר
  choice: mematahkan
  rationale: Partisipel Qal berfungsi secara verbal untuk tindakan yang hidup atau khas. ‘Mematahkan’ alami dalam bahasa Indonesia dan tepat untuk daya yang membelah atau merusak batang pohon.
- source_word: אֲרָזִים
  choice: pohon-pohon aras
  rationale: Bentuk jamak menunjuk pada pohon aras secara umum. Penyebutan ‘pohon-pohon’ membantu pembaca Indonesia mengenali aras sebagai jenis pohon.
- source_word: וַיְשַׁבֵּר
  choice: meremukkan
  rationale: Kata Ibrani mengulang akar שבר dari klausa pertama. Pilihan ‘meremukkan’ menyampaikan peningkatan puitis tanpa mengubah tindakan paralelnya menjadi bentuk lampau.
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: pohon-pohon aras Lebanon
  rationale: Frasa konstruksi ini menunjuk pada pohon aras termasyhur yang berasal dari atau terkait dengan Lebanon; bentuk ini ringkas dan alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, sehingga nama perjanjian itu dipertahankan dan tidak diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama pribadi Allah sebagaimana terdapat dalam sumber Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang lugas dan bermartabat. Paralelisme dipertahankan, sedangkan variasi verba Indonesia menyampaikan intensifikasi pada klausa kedua.
