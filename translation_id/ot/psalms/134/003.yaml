  yaml_path: translation/ot/psalms/134/003.yaml
  text: May Yahweh bless you from Zion[c][b][a], maker of heaven and earth.
translation:
  language: id
  text: Kiranya Yahweh memberkati engkau[a] dari Sion, Pencipta langit dan bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk kata kerja Ibrani ini juga dapat diterjemahkan “Yahweh akan memberkati engkau”, tetapi dalam konteks ucapan berkat ini, “Kiranya ... memberkati” lebih sesuai.
    reason: alternative_reading
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Kiranya ... memberkati engkau
  rationale: Bentuk Piel imperfek dengan akhiran orang kedua tunggal maskulin paling wajar dipahami sebagai harapan atau berkat dalam konteks penutup mazmur ini. “Kiranya” menyampaikan daya optatif tersebut secara alami dan khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: מִצִּיּוֹן
  choice: dari Sion
  rationale: Preposisi מִן menyatakan sumber atau asal berkat.
- source_word: עֹשֵׂה
  choice: Dia yang menjadikan
  rationale: Partisipel Qal berfungsi sebagai sebutan deskriptif yang mengidentifikasi Yahweh sebagai Pencipta. Klausa relatif ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan aposisionalnya.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: langit dan bumi
  rationale: Pasangan ini merupakan merisme yang menunjuk pada seluruh ciptaan; “langit dan bumi” adalah ungkapan Indonesia yang baku dan alami.
theological_decisions:
- issue: Daya bentuk imperfek pembuka dalam ucapan berkat
  choice: 'Harapan/optatif: “Kiranya Yahweh memberkati engkau”'
  alternative: 'Pernyataan masa depan: “Yahweh akan memberkati engkau”'
  rationale: Konteks liturgis dan benediktif Mazmur 134 mendukung pemahaman sebagai doa atau harapan, tanpa meniadakan bahwa secara bentuk imperfek dapat dipahami secara lain.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; transliterasi mempertahankan nama perjanjian itu sebagai nama pribadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” dipakai karena sapaan Ibrani berbentuk orang kedua tunggal dan sesuai dengan register mazmur. Kapitalisasi “Dia” membantu memperjelas bahwa klausa aposisional merujuk kepada Yahweh.
