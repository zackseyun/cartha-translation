id: PSA.134.0
reference: Psalms 134:0
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/000.yaml
  text: A Song of Ascents. Behold, bless the LORD, all you servants of the LORD, who stand in the house of the LORD by night!
translation:
  language: id
  text: Nyanyian ziarah.[a] Lihatlah,[b] pujilah TUHAN, hai semua hamba TUHAN, yang berdiri di rumah TUHAN[c] pada malam hari!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Nyanyian pendakian.” Ungkapan ini mungkin menunjuk pada nyanyian yang dinyanyikan para peziarah ketika naik ke Yerusalem.
    reason: lexical_alternative
  - marker: b
    text: Atau “Perhatikanlah.”
    reason: lexical_alternative
  - marker: c
    text: “Rumah TUHAN” mengacu pada bait atau tempat kudus TUHAN.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Ungkapan judul ini secara harfiah berkaitan dengan 'pendakian'; dalam konteks kumpulan mazmur ini, 'nyanyian ziarah' menyampaikan kemungkinan pemakaiannya oleh para peziarah yang naik ke Yerusalem dengan bahasa Indonesia yang alami.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan seruan pembuka yang menarik perhatian, tanpa melemahkannya menjadi sekadar kata penghubung.
- source_word: בָּרֲכוּ אֶת־יְהוָה
  choice: pujilah TUHAN
  rationale: Kata kerja בּרך secara dasar berarti 'memberkati', tetapi ketika manusia menjadikan Allah sebagai objek, bahasa Indonesia alami menyatakan tindakan itu sebagai 'memuji'; nuansa harfiahnya dicatat dalam keputusan teologis.
- source_word: הָעֹמְדִים
  choice: yang berdiri
  rationale: Menerjemahkan gambaran konkret para pelayan yang sedang berdiri untuk melayani di tempat kudus.
- source_word: בַּלֵּילוֹת
  choice: pada malam hari
  rationale: Bentuk jamak Ibrani dipakai secara idiomatis untuk waktu atau giliran pelayanan malam; terjemahan ini alami dan tidak menambahkan rincian yang tidak dinyatakan.
theological_decisions:
- issue: Makna tindakan בּרך ketika TUHAN menjadi objek
  choice: pujilah TUHAN
  alternative: berkatilah TUHAN
  rationale: Kedua ungkapan mencerminkan cakupan kata Ibrani. 'Pujilah' lebih jelas dan wajar bagi pembaca Indonesia ketika manusia berbicara kepada Allah, sementara tidak meniadakan gagasan penghormatan dan pengagungan yang terkandung dalam 'memberkati'.
- issue: Identitas 'rumah TUHAN'
  choice: Mempertahankan ungkapan 'rumah TUHAN' dalam teks dan menjelaskan rujukannya dalam catatan kaki
  alternative: Mengganti langsung dengan 'Bait TUHAN' atau 'tempat kudus TUHAN'
  rationale: Bentuk metaforis sumber dipertahankan, sedangkan catatan membantu pembaca memahami bahwa yang dimaksud ialah tempat suci atau bait Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “hai” mempertahankan nada seruan puitis, sedangkan susunan kalimat dibuat langsung dan mudah dipahami.
