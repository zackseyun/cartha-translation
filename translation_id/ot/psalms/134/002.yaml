  verdict: revise
  source_fidelity: 'Teks Ibrani memuat dua imperatif jamak: “angkatlah” dan “berkatilah,” dengan objek “tangan kalian” serta nama ilahi Yahweh. “Dalam kekudusan” merupakan pembacaan kualitatif yang mungkin untuk קֹדֶשׁ, sementara kemungkinan tempat/arah tempat kudus patut tetap dicatat. Namun, ketika ברך diarahkan kepada Allah, “berkatilah Yahweh” dalam bahasa Indonesia mudah disalahpahami sebagai manusia memberikan berkat kepada Allah dan tidak menyampaikan fungsi doxologisnya dengan alami.'
  naturalness: “Angkatlah tangan kalian” baku dan jelas untuk sapaan jamak, walaupun “kalian” sedikit kurang liturgis daripada bentuk yang lebih tradisional. Perbaikan utama diperlukan pada “berkatilah Yahweh”; “pujilah Yahweh” adalah padanan idiomatis modern yang tepat dalam konteks seruan ibadah.
  terminology: Nama Yahweh dipertahankan. “Kekudusan” sesuai untuk pembacaan utama yang dipilih dan alternatif “tempat kudus” tetap disediakan dalam catatan kaki. “Pujilah” pada teks utama merepresentasikan penggunaan doxologis ברך tanpa menimbulkan kesan bahwa manusia menganugerahkan berkat kepada Allah.
  issues:
