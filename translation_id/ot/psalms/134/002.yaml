    rationale: Walaupun “memberkati” sangat harfiah untuk ברך, dalam pemakaian Indonesia modern verba ini umumnya menyatakan Allah atau pihak berotoritas memberikan berkat kepada manusia. Dalam konteks pujian kepada Allah, “pujilah” menyampaikan daya ilokusi Ibrani secara alami dan jelas.
