source:
  edition: WLC
  text: שְׂאֽוּ יְדֵ/כֶ֥ם קֹ֑דֶשׁ וּ֝/בָרֲכוּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/002.yaml
  text: Lift up your hands to the holy place and bless Yahweh[a].
translation:
  language: id
  text: Angkatlah tangan kalian dalam kekudusan[a] dan pujilah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke arah tempat kudus” atau “di tempat kudus.” Kata Ibrani קֹדֶשׁ dapat berarti “kekudusan” atau “tempat kudus.”
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאוּ
  choice: Angkatlah
  rationale: Bentuk imperatif jamak dari נשׂא yang menyerukan tindakan fisik yang disengaja; pilihan ini konkret, wajar, dan tidak menambahkan tafsiran.
- source_word: יְדֵיכֶם
  choice: tangan kalian
  rationale: Objek dari perintah tersebut. 'Kalian' menyatakan dengan jelas bahwa sapaan Ibrani berbentuk jamak.
- source_word: קֹדֶשׁ
  choice: dalam kekudusan
  rationale: Nomina קֹדֶשׁ tanpa preposisi dapat dipahami secara kualitatif sebagai sikap ibadah yang kudus, tetapi juga dapat menunjuk pada tempat kudus. Teks utama mempertahankan pengertian kualitatif, sedangkan kemungkinan lokatif dicatat dalam catatan kaki.
- source_word: וּבָרֲכוּ
  choice: dan berkatilah
  rationale: Imperatif jamak ברך. 'Berkatilah' mempertahankan padanan leksikal dan bobot teologis tindakan memberkati Allah; 'pujilah' lebih idiomatis, tetapi lebih sempit dan interpretatif.
- source_word: אֶת
  choice: '[penanda objek, tidak diterjemahkan]'
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan tersendiri yang perlu dinyatakan dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Makna קֹדֶשׁ dalam frasa שְׂאוּ יְדֵיכֶם קֹדֶשׁ
  choice: 'Kualitatif/adverbial: ''dalam kekudusan'''
  alternative: 'Lokatif atau direktif: ''di tempat kudus'' atau ''ke arah tempat kudus'''
  rationale: Konteks ibadah di bait Allah memungkinkan rujukan kepada tempat kudus, tetapi tidak adanya preposisi juga mendukung pengertian kualitatif tentang ibadah yang kudus. Ketegangan ini dipertahankan dengan bacaan utama dan alternatif dalam catatan kaki.
- issue: Arti tindakan ברך ketika diarahkan kepada Allah
  choice: '''berkatilah'''
  alternative: '''pujilah'''
  rationale: Bahasa Indonesia sehari-hari lebih lazim memakai 'memuji' untuk tindakan kepada Allah, tetapi 'memberkati' mempertahankan ungkapan Ibrani yang menyatakan penghormatan dan pujian kepada-Nya tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' memperjelas sapaan jamak; bentuk imperatif dengan -lah menjaga nada seruan liturgis. Susunan kalimat mengikuti paralelisme ringkas teks Ibrani.
