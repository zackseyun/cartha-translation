  source_fidelity: 'Teks Indonesia dengan setia mencerminkan struktur dan makna Ibrani: superskripsi dipertahankan, הִנֵּה diterjemahkan sebagai seruan perhatian, imperatif plural ditujukan kepada para hamba Yahweh, dan partisipel ''yang berdiri'' serta keterangan waktu malam tetap terwakili. ''Pujilah'' merupakan padanan Indonesia yang wajar dan tepat secara pragmatis untuk בָּרֲכוּ ketika objeknya Yahweh.'
