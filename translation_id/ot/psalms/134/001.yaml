id: PSA.134.1
reference: Psalms 134:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/001.yaml
  text: A Song of Ascents[a]. Behold, bless Yahweh, all you servants of Yahweh[b], who stand in the house of Yahweh by night.
translation:
  language: id
  text: Nyanyian Pendakian. Lihatlah[a], pujilah Yahweh, hai semua hamba Yahweh, yang berdiri di rumah Yahweh[b] pada malam hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Perhatikanlah” atau “Camkanlah.”
    reason: lexical_alternative
  - marker: b
    text: “Rumah Yahweh” di sini merujuk pada tempat suci Bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Pendakian
  rationale: Mempertahankan judul kumpulan mazmur secara cukup formal tanpa mempersempitnya menjadi nyanyian ziarah, salah satu kemungkinan penafsiran.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Menyampaikan fungsi partikel sebagai seruan untuk menarik perhatian dalam bahasa Indonesia yang alami dan tetap bernada puitis.
- source_word: בָּרֲכוּ
  choice: pujilah
  rationale: Ketika יהוה menjadi objek, ברך merupakan seruan liturgis untuk memuji atau mengagungkan Allah. 'Berkatilah Yahweh' lebih harfiah, tetapi dalam bahasa Indonesia modern mudah disalahpahami seolah-olah manusia memberikan berkat kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan mempertahankan rujukan perjanjian yang khusus.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: hai semua hamba Yahweh
  rationale: Kata 'hai' memperjelas sapaan langsung yang tersirat oleh bentuk perintah; 'hamba' sesuai dengan konteks pelayanan di tempat ibadah.
- source_word: הָעֹמְדִים
  choice: yang berdiri
  rationale: Mempertahankan gambaran konkret partisipel Ibrani dan tidak menggantinya dengan penafsiran 'yang melayani'.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani secara transparan; dalam konteks ini rumah Yahweh adalah tempat suci Bait Allah.
- source_word: בַּלֵּילוֹת
  choice: pada malam hari
  rationale: Ungkapan idiomatis Indonesia yang menyampaikan keterangan waktu dari bentuk jamak Ibrani tanpa menghasilkan frasa kaku 'pada malam-malam'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi dan tidak mengubahnya menjadi gelar.
- issue: Makna ברך ketika ditujukan kepada Allah
  choice: pujilah
  alternative: berkatilah
  rationale: Pilihan ini mengungkapkan tindakan liturgis manusia terhadap Allah secara alami dalam bahasa Indonesia, tanpa menyiratkan bahwa manusia menganugerahkan berkat kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur seruan puitis dipertahankan, sementara ungkapan yang berpotensi kaku disesuaikan secara idiomatis. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
