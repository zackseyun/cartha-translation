  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: id
  text: '“Karena kekerasan terhadap orang miskin,

    karena erangan orang yang berkekurangan,

    sekarang Aku akan bangkit,” firman Yahweh.

    “Aku akan menempatkan dia di tempat aman yang didambakannya.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Klausa terakhir dalam bahasa Ibrani sulit dan diperdebatkan. Secara sangat harfiah: “Aku akan menempatkan dalam keselamatan; ia mengembuskan napas kepadanya/untuknya.” Salah satu pemahaman kontekstual ialah, “Aku akan menempatkan dia di tempat aman yang didambakannya.” Yang lain memahaminya kira-kira, “Aku akan menempatkan dia di tempat aman dari orang yang mendengus terhadapnya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: Karena orang miskin ditindas
  rationale: מִן dipahami sebagai penanda sebab, sedangkan שֹׁד menunjuk pada kekerasan yang merusak, penjarahan, atau penindasan. Bentuk pasif ini alami dalam bahasa Indonesia dan menyatakan penderitaan orang miskin tanpa mempersempitnya hanya pada perampasan harta.
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: karena orang berkekurangan mengerang
  rationale: 'Ungkapan kedua sejajar dengan yang pertama: מִן kembali menyatakan sebab, אָנָקָה adalah erangan akibat kesusahan, dan אֶבְיוֹנִים menekankan mereka yang berada dalam kebutuhan.'
- source_word: עַתָּה אָקוּם
  choice: sekarang Aku akan bangkit
  rationale: Terjemahan ini mempertahankan penanda waktu yang mendesak serta gambaran antropomorfis tentang Yahweh yang bangkit untuk bertindak.
- source_word: יֹאמַר יְהוָה
  choice: firman Yahweh
  rationale: Rumus ujaran ini diterjemahkan dengan ungkapan Indonesia yang wajar dan khidmat, sementara nama ilahi יהוה dipertahankan sebagai Yahweh.
- source_word: אָשִׁית בְּיֵשַׁע
  choice: Aku akan menempatkan dia di tempat aman
  rationale: שׂים berarti menaruh atau menempatkan, sedangkan יֵשַׁע di sini secara konkret dapat menunjuk pada keadaan atau tempat aman sebagai hasil penyelamatan. Objek 'dia' dipasok dari konteks dan kemungkinan rujukan לוֹ.
- source_word: יָפִיחַ לוֹ
  choice: yang dirindukannya
  rationale: Klausa Ibrani ini sulit. Pilihan utama memahami הפיח sebagai terengah-engah atau mendambakan sesuatu dan לוֹ sebagai rujukan kepada orang tertindas. Ambiguitas tekstualnya tidak disembunyikan, tetapi dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יהוה. Bentuk 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Identitas orang yang ditempatkan dalam keselamatan
  choice: dipahami sebagai orang miskin atau berkekurangan yang tertindas
  alternative: objek dibiarkan tidak dinyatakan secara eksplisit
  rationale: Bahasa Indonesia memerlukan objek agar kalimatnya jelas dan alami. Konteks paling dekat menunjuk kepada orang tertindas, tetapi catatan kaki mengakui sulitnya susunan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puisi yang khidmat. Paralelisme dua baris pertama dipertahankan, begitu pula citra Yahweh yang 'bangkit'. Huruf kapital pada 'Aku' menandai pembicara ilahi sesuai kebiasaan penerbitan Alkitab Indonesia. Penanda catatan kaki ditempatkan pada klausa yang benar-benar dipersoalkan.
