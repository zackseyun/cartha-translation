  text: שָׁ֤וְא יְֽדַבְּרוּ֮ אִ֤ישׁ אֶת רֵ֫עֵ֥/הוּ שְׂפַ֥ת חֲלָק֑וֹת בְּ/לֵ֖ב וָ/לֵ֣ב יְדַבֵּֽרוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/002.yaml
  text: They speak emptiness[a], each man to his neighbor; with flattering lips[b], with a double heart they speak.
translation:
  language: id
  text: Mereka berbicara tentang yang hampa[a], masing-masing kepada sesamanya; dengan bibir licin[b], dengan hati mendua[c] mereka berbicara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepalsuan”; kata Ibrani ini mencakup apa yang hampa, palsu, atau tidak bernilai.
    reason: lexical_alternative
  - marker: b
    text: Atau “bibir yang menyanjung”; secara harfiah, “bibir yang halus/licin”, yakni perkataan muluk yang menipu.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dengan hati dan hati”, ungkapan untuk niat yang bercabang atau penuh kepura-puraan.
    reason: idiom_explanation
lexical_decisions:
- source_word: שָׁוְא
  choice: kesia-siaan
  rationale: Kata ini dapat menunjuk pada sesuatu yang hampa, palsu, atau tidak bernilai. “Kesia-siaan” mempertahankan keluasan maknanya tanpa membatasinya hanya pada dusta faktual.
- source_word: יְדַבְּרוּ / יְדַבֵּרוּ
  choice: mereka ucapkan / mereka berbicara
  rationale: Kedua bentuk berasal dari verba דבר, “berbicara”. Variasi alami dalam bahasa Indonesia mempertahankan pengulangan gagasan berbicara tanpa menghasilkan kalimat yang kaku.
- source_word: אִישׁ אֶת רֵעֵהוּ
  choice: setiap orang kepada sesamanya
  rationale: אִישׁ dipakai secara distributif, sedangkan רֵעֵהוּ berarti sesama, rekan, atau orang dekatnya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan dimensi sosial ayat tersebut.
- source_word: שְׂפַת חֲלָקוֹת
  choice: dengan bibir licin
  rationale: Secara harfiah frasa ini menggambarkan bibir yang halus atau licin, yakni tutur kata yang muluk dan menyanjung untuk menipu. “Bibir licin” mempertahankan citra Ibraninya.
- source_word: בְּלֵב וָלֵב
  choice: dengan hati mendua
  rationale: Ungkapan harfiahnya adalah “dengan hati dan hati” dan menyatakan niat batin yang bercabang atau penuh kepura-puraan. “Hati mendua” menyampaikan idiom itu secara ringkas sambil mempertahankan citra hati.
theological_decisions:
- issue: Sifat ucapan yang dikecam
  choice: Tidak mempersempit שָׁוְא menjadi “dusta” saja
  alternative: “Kebohongan” atau “dusta”
  rationale: Konteks memang menyoroti penipuan, tetapi kata Ibraninya juga mencakup kehampaan dan ketidakberhargaan. Terjemahan yang lebih luas menjaga ketegangan semantis tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Susunan awal “Kesia-siaan mereka ucapkan” mempertahankan penekanan puitis pada objek ucapan; “sesamanya”, “bibir licin”, dan “hati mendua” tetap mudah dipahami pembaca umum.
