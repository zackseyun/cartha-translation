id: PSA.12.3
reference: Psalms 12:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יַכְרֵ֣ת יְ֭הוָה כָּל שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/003.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
translation:
  language: id
  text: Kiranya Yahweh melenyapkan semua bibir yang berkata manis[a], lidah yang mengatakan hal-hal besar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bibir yang licin”; maksudnya ialah tutur kata halus dan manis yang menyanjung atau memperdaya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hal-hal besar”; dalam konteks ini, yang dimaksud ialah klaim atau perkataan yang membual dan congkak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: kiranya ... melenyapkan
  rationale: Bentuk Hifil imperfek dari כרת secara harfiah menggambarkan tindakan memotong atau menyingkirkan. Dalam konteks mazmur ini, bentuk tersebut wajar dipahami sebagai permohonan atau kutukan puitis. “Melenyapkan” mempertahankan daya ungkapnya tanpa menimbulkan gambaran janggal tentang memotong bibir secara harfiah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: כָּל שִׂפְתֵי חֲלָקוֹת
  choice: semua bibir yang berkata manis
  rationale: Ungkapan harfiahnya adalah “semua bibir kelicinan/kemulusan”. Dalam bahasa Indonesia, “bibir yang berkata manis” menyampaikan gambaran perkataan halus yang menyanjung atau memperdaya, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: לָשׁוֹן
  choice: lidah
  rationale: Nomina tunggal dipertahankan untuk menjaga gambaran puitis dan personifikasi dalam bahasa Ibrani.
- source_word: מְדַבֶּרֶת
  choice: yang mengatakan
  rationale: Partisip feminin yang menerangkan “lidah” diterjemahkan secara alami sebagai klausa relatif.
- source_word: גְּדֹלוֹת
  choice: hal-hal besar
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang sengaja ringkas dan dapat berarti klaim-klaim besar; nuansa kesombongannya dijelaskan dalam catatan kaki tanpa dimasukkan secara paksa ke dalam teks utama.
theological_decisions:
- issue: Daya ungkap permohonan penghakiman
  choice: Kiranya Yahweh melenyapkan
  alternative: Yahweh akan melenyapkan
  rationale: Imperfek Ibrani dalam konteks ini paling wajar dibaca sebagai permohonan atau kutukan puitis, tetapi bentuknya juga dapat dipahami sebagai pernyataan tentang tindakan yang akan datang. Terjemahan utama mengikuti alur doa mazmur tanpa mengurangi kerasnya penghakiman.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama ilahi secara langsung; karena itu nama tersebut ditransliterasikan sebagai “Yahweh” dan tidak diganti dengan gelar.
- issue: Makna גְּדֹלוֹת dalam ucapan orang fasik
  choice: hal-hal besar
  alternative: kata-kata sombong
  rationale: Ungkapan harfiah dibiarkan tetap terbuka dalam teks utama. Konteks menunjukkan klaim yang congkak atau membual, tetapi makna itu diterangkan dalam catatan kaki agar ketegangan antara ungkapan harfiah dan maksud kontekstual tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan puitis dengan “bibir” dan “lidah” dipertahankan. Kata “kiranya” menandai permohonan mazmur, sedangkan “melenyapkan” menjaga kerasnya citra כרת tanpa menghasilkan ungkapan Indonesia yang terlalu harfiah dan janggal.
