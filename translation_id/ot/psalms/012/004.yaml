  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁ֤ר אָֽמְר֨וּ לִ/לְשֹׁנֵ֣/נוּ נַ֭גְבִּיר שְׂפָתֵ֣י/נוּ אִתָּ֑/נוּ מִ֖י אָד֣וֹן לָֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/004.yaml
  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: id
  text: yang berkata, “Dengan lidah kami, kami akan menang[a]; bibir kami milik kami sendiri[b]—siapakah tuan atas kami[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kami akan menjadi kuat” atau “kami akan mengungguli.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bibir kami bersama kami”; dapat juga dipahami “bibir kami berpihak kepada kami.”
    reason: lexical_alternative
  - marker: c
    text: Atau “siapakah penguasa atas kami?”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: yang berkata
  rationale: Partikel relatif menghubungkan ayat ini dengan orang-orang fasik pada ayat sebelumnya. Bentuk perfek di sini menggambarkan ucapan yang menjadi ciri sikap mereka, sehingga bentuk Indonesia “berkata” sesuai.
- source_word: לִלְשֹׁנֵנוּ
  choice: Dengan lidah kami
  rationale: 'Prefiks ל dipahami secara instrumental: lidah atau perkataan menjadi sarana untuk memperoleh kemenangan. Citra konkret “lidah” dipertahankan.'
- source_word: נַגְבִּיר
  choice: kami akan menang
  rationale: Bentuk hifil dari גבר menyatakan menunjukkan kekuatan atau mengungguli. Dalam konteks kesombongan lewat perkataan, “akan menang” menyampaikan maksudnya secara alami tanpa menentukan jenis kemenangan secara lebih khusus.
- source_word: שְׂפָתֵינוּ אִתָּנוּ
  choice: bibir kami milik kami sendiri
  rationale: Ungkapan harfiahnya “bibir kami bersama kami.” Dalam konteks penolakan terhadap penguasa, ungkapan ini paling alami dipahami sebagai klaim bahwa mereka bebas menguasai perkataan mereka sendiri. Citra “bibir” tetap dipertahankan, sedangkan kemungkinan nuansa lain dicatat dalam catatan kaki.
- source_word: מִי אָדוֹן לָנוּ
  choice: siapakah tuan atas kami?
  rationale: אָדוֹן adalah tuan atau penguasa, bukan nama ilahi. Frasa ini menyuarakan penolakan terhadap siapa pun yang mengaku berwenang atas mereka.
theological_decisions:
- issue: Apakah אָדוֹן merujuk khusus kepada Allah atau kepada penguasa secara umum
  choice: tuan
  alternative: penguasa
  rationale: Teks memakai nomina umum אָדוֹן, bukan nama YHWH. “Tuan” mempertahankan gagasan kewenangan personal tanpa menjadikan kata itu gelar ilahi secara eksplisit.
- issue: Makna klaim שְׂפָתֵינוּ אִתָּנוּ
  choice: bibir kami milik kami sendiri
  alternative: bibir kami berpihak kepada kami / bibir kami bersama kami
  rationale: Konteks mendukung kesombongan akan otonomi dalam berbicara, tetapi bentuk Ibrani tetap dapat menonjolkan bahwa bibir mereka “bersama” atau “di pihak” mereka. Ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Paralelisme “lidah” dan “bibir” dipertahankan. “Milik kami sendiri” dipilih agar klaim otonomi mereka jelas bagi pembaca modern, sementara bentuk dan kemungkinan makna ungkapan Ibrani dicatat.
