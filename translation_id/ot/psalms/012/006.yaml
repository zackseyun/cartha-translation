base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: id
  text: 'Perkataan Yahweh adalah perkataan yang murni,

    seperti perak yang dimurnikan dalam wadah peleburan[a] di atas tanah[b],

    perak yang dimurnikan tujuh kali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam tanur” atau “dalam kowi.” Istilah Ibraninya langka dan rujukan tepatnya tidak pasti, tetapi konteksnya jelas berkaitan dengan pemurnian logam.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “di atas tanah.” Frasa ini mungkin menerangkan lokasi atau tempat berlangsungnya pemurnian; nuansa tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: perkataan-perkataan / perkataan
  rationale: Nomina yang diulang ini menunjuk pada ucapan atau kata-kata. Pengulangan dipertahankan untuk mencerminkan penegasan puitis Ibrani tanpa mempersempit maknanya menjadi hanya 'janji'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: טְהֹרוֹת
  choice: murni
  rationale: Kata sifat ini menyatakan kemurnian dan cocok dengan sifat perkataan Yahweh sekaligus gambaran pemurnian logam yang mengikutinya.
- source_word: כֶּסֶף
  choice: perak
  rationale: Nomina ini secara langsung menunjuk pada logam perak dalam perumpamaan.
- source_word: צָרוּף
  choice: yang dimurnikan
  rationale: Bentuk pasif ini menggambarkan logam yang telah menjalani proses pemurnian; pilihan ini alami dalam bahasa Indonesia dan mempertahankan citra metalurgis.
- source_word: בַּעֲלִיל
  choice: dalam wadah peleburan
  rationale: Istilah langka ini tampaknya menunjuk pada alat atau tempat untuk memurnikan logam, tetapi rujukan tepatnya tidak pasti; karena itu pilihan utama dibuat jelas namun disertai catatan kaki.
- source_word: לָאָרֶץ
  choice: di atas tanah
  rationale: Terjemahan yang cukup harfiah ini mempertahankan ungkapan Ibrani dan tidak memutuskan secara berlebihan hubungan sintaksis atau nuansa tepatnya.
- source_word: מְזֻקָּק
  choice: yang dimurnikan
  rationale: Partisipel ini melanjutkan dan menguatkan gambaran metalurgis. Pengulangan 'dimurnikan' mencerminkan tumpang tindih leksikal dan penekanan teks.
- source_word: שִׁבְעָתָיִם
  choice: tujuh kali
  rationale: Ungkapan adverbial ini menyatakan pemurnian berulang; dalam idiom Ibrani, angka tujuh juga menyiratkan ketuntasan.
theological_decisions:
- issue: Sifat kemurnian perkataan Yahweh
  choice: Ayat ini menyatakan bahwa perkataan Yahweh sepenuhnya murni dan dapat diandalkan melalui gambaran perak yang dimurnikan berulang kali.
  alternative: Membatasinya hanya pada kemurnian moral, atau memperluasnya menjadi rumusan doktrinal tertentu mengenai pelestarian teks pada masa kemudian.
  rationale: Teks Ibrani sendiri memakai perbandingan metalurgis untuk menegaskan kemurnian perkataan Yahweh. Terjemahan mempertahankan klaim puitis itu tanpa memasukkan sistem teologis yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan puitis digunakan tanpa menjadi arkais. Susunan tiga baris mempertahankan alur paralel dan gambaran pemurnian. Nama 'Yahweh' dipertahankan, dan ketidakpastian dua ungkapan Ibrani dijelaskan dalam catatan kaki.
