source:
  edition: WLC
  text: אַתָּֽה יְהוָ֥ה תִּשְׁמְרֵ֑/ם תִּצְּרֶ֓/נּוּ מִן הַ/דּ֖וֹר ז֣וּ לְ/עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: id
  text: Engkau, ya Yahweh, akan menjaga mereka; Engkau akan melindungi dia[a] dari angkatan ini untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani beralih dari bentuk jamak (“menjaga mereka”) ke bentuk tunggal (“melindungi dia”). Sejumlah terjemahan menyelaraskannya menjadi “melindungi mereka”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: Engkau
  rationale: Kata ganti orang kedua tunggal disebutkan secara eksplisit dan diletakkan di depan untuk penekanan; bahasa Indonesia mempertahankannya dengan “Engkau” pada awal ayat.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”; partikel vokatif “ya” menghasilkan sapaan yang alami dan khidmat.
- source_word: תִּשְׁמְרֵם
  choice: akan menjaga mereka
  rationale: Kata kerja שׁמר menyatakan tindakan menjaga atau memelihara, sedangkan akhiran orang ketiga jamak dipertahankan sebagai “mereka”.
- source_word: תִּצְּרֶנּוּ
  choice: akan melindungi dia
  rationale: Kata kerja נצר berarti menjaga atau melindungi. Bentuk Masoretik memiliki akhiran orang ketiga laki-laki tunggal, sehingga peralihan dari “mereka” ke “dia” dipertahankan dan tidak diselaraskan secara diam-diam.
- source_word: מִן־הַדּוֹר זוּ
  choice: dari angkatan ini
  rationale: מִן digunakan dalam arti pemisahan atau perlindungan dari sesuatu, dan דור secara langsung berarti “angkatan/generasi”; “angkatan ini” sesuai dengan ragam mazmur yang khidmat namun tetap mudah dipahami.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini secara idiomatis menyatakan keberlangsungan tanpa akhir; “untuk selama-lamanya” alami dalam bahasa puisi dan doa Indonesia.
theological_decisions:
- issue: Peralihan jumlah pada objek kedua kata kerja
  choice: Mempertahankan teks Masoretik sebagai “menjaga mereka … melindungi dia”
  alternative: Menyelaraskan keduanya menjadi “menjaga mereka … melindungi mereka”, atau menafsirkan bentuk kedua sebagai “melindungi kami”
  rationale: Teks Masoretik beralih dari akhiran jamak pada kata kerja pertama ke akhiran tunggal pada kata kerja kedua. Terjemahan utama mempertahankan ketegangan gramatikal ini tanpa menentukan apakah “dia” menunjuk kepada seorang wakil tertentu atau kepada setiap orang dalam kelompok tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. Kapitalisasi “Engkau” mengikuti kebiasaan bahasa keagamaan Indonesia ketika menyapa Allah. Dua kata kerja yang berdekatan dibedakan sebagai “menjaga” dan “melindungi” untuk mempertahankan kesejajaran tanpa terdengar kaku.
