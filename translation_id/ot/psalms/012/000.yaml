  text: 'For the choirmaster: according to The Eighth[a]. A psalm of David[b].'
translation:
  language: id
  text: 'Untuk pemimpin musik: menurut “Yang Kedelapan”[a]. Mazmur Daud[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Yang Kedelapan; mungkin suatu sebutan musik atau liturgi yang mengacu pada lagu, alat musik, atau susunan oktaf. Secara tradisional ditransliterasikan Syeminit.'
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “mazmur karya Daud”, “mazmur untuk Daud”, atau “mazmur milik Daud”; bahasa Ibraninya tidak menjelaskan secara pasti hubungan Daud dengan mazmur ini.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia modern dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: עַל
  choice: menurut
  rationale: Dalam judul mazmur, kata depan ini dapat memperkenalkan lagu, cara, atau latar musikal. “Menurut” mempertahankan hubungan fungsional itu tanpa menentukan secara pasti apa yang dimaksud.
- source_word: הַשְּׁמִינִית
  choice: “Yang Kedelapan”
  rationale: Secara harfiah berarti “yang kedelapan” dan tampaknya merupakan sebutan musikal atau liturgis. Diterjemahkan, bukan ditransliterasikan, agar makna leksikalnya tetap terlihat; tanda petik menandainya sebagai sebutan.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah padanan baku dan tepat bagi penanda jenis nyanyian Ibrani tersebut.
- source_word: לְדָוִד
  choice: Mazmur Daud
  rationale: Susunan nomina bahasa Indonesia ini ringkas dan mempertahankan keterbukaan hubungan mazmur tersebut dengan Daud, tanpa secara tegas menetapkan kepengarangan, peruntukan, atau kepemilikan.
theological_decisions:
- issue: Hubungan Daud dengan mazmur yang dinyatakan oleh לְדָוִד
  choice: Mazmur Daud
  alternative: Mazmur karya Daud; mazmur untuk Daud; mazmur milik Daud
  rationale: Konstruksi Ibrani tidak menentukan hanya satu jenis hubungan. Rumusan “Mazmur Daud” mempertahankan ambiguitas sumber dan tidak memutuskan persoalan kepengarangan melampaui bukti teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Pemimpin musik” dipilih daripada istilah lama “pemimpin biduan”. Kapitalisasi dan tanda petik pada “Yang Kedelapan” menunjukkan bahwa ungkapan itu berfungsi sebagai sebutan, sementara catatan kaki menjaga ketidakpastian maknanya.
