translation:
  language: id
  text: Orang fasik berjalan di segala penjuru[a], ketika yang hina ditinggikan di antara anak-anak manusia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Orang fasik berkeliaran di segala penjuru.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “di antara umat manusia.” Ungkapan Ibraninya secara harfiah berbunyi “di antara anak-anak manusia” dan mengacu kepada manusia pada umumnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: di mana-mana
  rationale: Kata keterangan ini menyatakan gerak atau keberadaan di sekeliling. Dalam konteks ini, “di mana-mana” menyampaikan luasnya ruang gerak orang fasik secara alami dalam bahasa Indonesia.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Bentuk jamak substantival ini menunjuk kepada orang-orang yang berlaku jahat. “Orang fasik” ringkas, lazim dalam ragam Alkitab bahasa Indonesia, dan tidak menambahkan penanda gender yang tidak dituntut teks.
- source_word: יִתְהַלָּכוּן
  choice: berjalan ke sana kemari
  rationale: Bentuk Hitpael dari הלך menggambarkan kegiatan berjalan atau bergerak berkeliling. Pilihan ini mempertahankan citra dasar berjalan tanpa memperkuatnya menjadi tindakan mengendap atau mencari mangsa.
- source_word: כְּרֻם
  choice: ketika ... dijunjung tinggi
  rationale: Susunan ini sulit dan dapat bernuansa waktu atau keadaan. “Ketika” menyatakan keadaan yang menyertai kebebasan orang fasik bergerak tanpa menutup kemungkinan hubungan kontekstual yang lebih longgar.
- source_word: זֻלּוּת
  choice: kehinaan
  rationale: Nomina ini menunjuk pada sesuatu yang rendah, tidak berharga, atau tercela. “Kehinaan” mempertahankan cakupan maknanya dan cocok dengan gambaran bahwa hal yang hina justru ditinggikan.
- source_word: לִבְנֵי אָדָם
  choice: di antara anak-anak manusia
  rationale: Ungkapan harfiahnya adalah “bagi/di antara anak-anak manusia” dan mengacu secara umum kepada umat manusia. Bentuk yang dekat dengan idiom Ibrani dipertahankan dalam teks utama, sedangkan ungkapan Indonesia yang lebih idiomatis dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan antropologis לִבְנֵי אָדָם
  choice: di antara anak-anak manusia
  alternative: di antara umat manusia
  rationale: Ungkapan Ibrani berbentuk maskulin tetapi berfungsi secara generik untuk manusia. Teks utama mempertahankan bentuk ungkapan sumber tanpa membatasi acuannya hanya kepada laki-laki; catatan kaki menjelaskan padanan idiomatisnya.
- issue: Hubungan sintaksis כְּרֻם dengan klausa utama
  choice: ketika kehinaan dijunjung tinggi
  alternative: sementara kehinaan dijunjung tinggi
  rationale: Preposisi כ pada bentuk ini dapat menyatakan keadaan waktu atau keadaan penyerta. “Ketika” memberi kalimat Indonesia yang jelas sambil tetap membiarkan hubungan tersebut bersifat situasional, bukan menyatakan sebab secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan awal “Di mana-mana” mengikuti penekanan adverbia Ibrani. “Berjalan ke sana kemari” mempertahankan citra gerak dalam teks sumber, sedangkan alternatif yang lebih tajam ditempatkan dalam catatan kaki.
