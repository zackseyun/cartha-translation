source:
  edition: WLC
  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: id
  text: Selamatkanlah, ya Yahweh, sebab orang saleh sudah tiada[a]; sebab orang-orang yang setia telah lenyap dari antara umat manusia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang saleh sudah tidak ada lagi.” Bentuk tunggal Ibraninya juga dapat dipahami secara kolektif.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari antara anak-anak manusia,” yakni dari tengah masyarakat manusia.'
    reason: cultural_note
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Selamatkanlah
  rationale: Bentuk imperatif dari ישׁע yang ditujukan kepada Allah. Pilihan ini mempertahankan seruan doa yang mendesak tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: כִּי
  choice: sebab
  rationale: Kedua kemunculannya memperkenalkan alasan bagi permohonan pemazmur; pengulangan dipertahankan untuk menjaga kesejajaran puisi.
- source_word: גָמַר
  choice: sudah tiada
  rationale: Kata kerja ini menyatakan bahwa sesuatu telah berakhir atau tidak ada lagi. Dalam konteks orang saleh yang hilang dari masyarakat, 'sudah tiada' alami dan tetap kuat.
- source_word: חָסִיד
  choice: orang saleh
  rationale: Bentuk tunggal ini menunjuk kepada orang yang bercirikan kesetiaan kepada Allah dan kesalehan. Bahasa Indonesia dapat memakai bentuk tunggal secara representatif tanpa harus membatasinya pada satu individu tertentu.
- source_word: פַסּוּ
  choice: telah lenyap
  rationale: Bentuk jamak ini menggambarkan orang-orang yang tidak lagi dijumpai; 'telah lenyap' mempertahankan daya puitis keluhan tersebut.
- source_word: אֱמוּנִים
  choice: orang-orang yang setia
  rationale: Bentuk jamak ini mengacu pada mereka yang bercirikan kesetiaan atau dapat dipercaya. Pilihan ini jelas dan wajar bagi pembaca Indonesia.
- source_word: מִבְּנֵי אָדָם
  choice: dari antara umat manusia
  rationale: Ungkapan harfiah 'dari antara anak-anak manusia/Adam' merupakan idiom bagi masyarakat manusia. Terjemahan ini menyampaikan maknanya secara alami tanpa membatasi rujukannya pada laki-laki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian sebagai nama pribadi.
- issue: Makna kolektif bentuk tunggal חָסִיד
  choice: orang saleh
  alternative: orang-orang saleh atau orang setia
  rationale: Bentuk tunggal Ibrani dipertahankan, tetapi dalam konteks paralel dengan אֱמוּנִים bentuk itu dapat berfungsi secara representatif atau kolektif. Catatan kaki menjaga kemungkinan bahwa yang dimaksud ialah satu orang saleh.
- issue: Cakupan בְּנֵי אָדָם
  choice: umat manusia
  alternative: anak-anak manusia atau kaum lelaki
  rationale: Idiom tersebut merujuk kepada komunitas manusia secara umum. 'Umat manusia' menyampaikan cakupan antropologisnya tanpa menambahkan pembatasan gender yang tidak dituntut oleh idiom itu.
translation_notes:
  register: Bahasa doa-puisi yang ringkas, modern, dan bermartabat. Pengulangan 'sebab' mempertahankan struktur Ibrani, sedangkan 'orang saleh' dan 'orang-orang yang setia' menjaga kesejajaran tunggal-jamak dalam sumber.
