id: PSA.67.4
reference: Psalms 67:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִֽשְׂמְח֥וּ וִֽ/ירַנְּנ֗וּ לְאֻ֫מִּ֥ים כִּֽי תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר וּ/לְאֻמִּ֓ים בָּ/אָ֖רֶץ תַּנְחֵ֣/ם סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: id
  text: Kiranya bangsa-bangsa bersukacita dan bersorak gembira[a], sebab Engkau menghakimi suku-suku bangsa dengan adil dan menuntun bangsa-bangsa di bumi[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bernyanyi dengan gembira.” Kata Ibraninya dapat menunjuk pada nyanyian riang atau seruan sukacita yang nyaring.
    reason: lexical_alternative
  - marker: b
    text: Atau “di negeri”, jika אֶרֶץ dipahami secara lebih lokal. Di sini diterjemahkan “di bumi” karena cakupan mazmur ini bersifat universal.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Kiranya ... bersukacita
  rationale: Bentuk imperfek Qal orang ketiga jamak paling wajar dipahami secara yusif dalam konteks pujian ini. “Kiranya” mempertahankan nuansa harapan atau ajakan tanpa mengubahnya menjadi pernyataan masa depan yang tegas.
- source_word: וִירַנְּנוּ
  choice: dan bersorak gembira
  rationale: Bentuk Piel dari רנן menunjuk pada ungkapan sukacita yang nyaring, baik berupa nyanyian maupun seruan. “Bersorak gembira” alami dalam bahasa Indonesia dan mempertahankan unsur vokalnya; kemungkinan “bernyanyi dengan gembira” dicatat dalam catatan kaki.
- source_word: לְאֻמִּים
  choice: bangsa-bangsa
  rationale: Kata ini dapat berarti bangsa-bangsa atau kelompok-kelompok masyarakat. “Bangsa-bangsa” sesuai dengan cakupan internasional mazmur dan dipakai konsisten pada kemunculan keduanya.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi sukacita bangsa-bangsa. “Sebab” ringkas, jelas, dan sesuai dengan ragam puisi yang luhur.
- source_word: תִשְׁפֹּט
  choice: Engkau menghakimi
  rationale: Makna dasar שׁפט dipertahankan sebagai tindakan menghakimi, bukan diperluas menjadi “memerintah”. Bentuk imperfek dapat bersifat akan datang atau kebiasaan; bentuk kini dalam bahasa Indonesia memungkinkan tindakan khas Allah menjadi dasar pujian tanpa menegaskan waktu secara berlebihan.
- source_word: עַמִּים
  choice: suku-suku bangsa
  rationale: Pilihan ini membedakannya dari לְאֻמִּים dan menyampaikan kelompok-kelompok masyarakat atau etnis yang menjadi objek penghakiman Allah.
- source_word: מִישׁוֹר
  choice: dengan adil
  rationale: Nomina ini mengandung gagasan kelurusan, kerataan, dan secara etis keadilan. “Dengan adil” merupakan ungkapan Indonesia yang alami dalam konteks penghakiman.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: Dalam mazmur yang berulang kali berbicara tentang seluruh bangsa, אֶרֶץ paling tepat dipahami secara global. Namun kemungkinan lokal “di negeri” tetap dicatat.
- source_word: תַּנְחֵם
  choice: menuntun
  rationale: Bentuk Hifil dari נחה berarti memimpin atau menuntun. “Menuntun” menyampaikan pengarahan aktif Allah tanpa membatasi tindakan itu pada perpindahan fisik.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis ini ditransliterasikan karena arti dan fungsi tepatnya tidak pasti; terjemahan tafsiran tidak dipaksakan.
theological_decisions:
- issue: Cakupan אֶרֶץ
  choice: bumi secara global
  alternative: negeri secara lokal
  rationale: Cakupan Mazmur 67 bersifat universal, dengan penekanan pada berbagai suku bangsa dan bangsa. Karena itu, “bumi” paling sesuai, sementara kemungkinan “negeri” dipertahankan dalam catatan kaki.
- issue: Aspek verba-verba imperfek
  choice: harapan/yusif pada verba pembuka dan tindakan khas atau berkelanjutan pada verba berikutnya
  alternative: 'pernyataan masa depan: bangsa-bangsa akan bersukacita karena Allah akan menghakimi dan menuntun'
  rationale: Konteks liturgis mendukung pembacaan verba pembuka sebagai seruan atau harapan. Verba berikutnya dapat menggambarkan tindakan khas Allah, tetapi bahasa sumber juga memungkinkan nuansa masa depan; terjemahan tidak menambahkan penanda waktu yang akan menutup ketegangan tersebut.
- issue: Sifat pemerintahan Allah atas bangsa-bangsa
  choice: menghakimi dengan adil dan menuntun
  alternative: memerintah bangsa-bangsa dengan adil
  rationale: Terjemahan mempertahankan dua verba sumber secara terpisah dan tidak melebur keduanya menjadi istilah teologis yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang luhur tetapi mudah dipahami. Kapitalisasi “Engkau” mengikuti sapaan kepada Allah. “Kiranya” mempertahankan daya yusif; “suku-suku bangsa” membedakan עַמִּים dari לְאֻמִּים; dan “Sela” dipertahankan sebagai transliterasi tradisional.
