source:
  edition: WLC
  text: יוֹד֖וּ/ךָ עַמִּ֥ים אֱלֹהִ֑ים י֝וֹד֗וּ/ךָ עַמִּ֥ים כֻּלָּֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/003.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: id
  text: Kiranya bangsa-bangsa memuji Engkau[a], ya Allah[b]; kiranya segala bangsa memuji Engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah bangsa-bangsa memuji Engkau,” atau, “Bangsa-bangsa akan memuji Engkau.” Bentuk kata kerja Ibrani dapat menyatakan harapan atau doa, atau—meskipun kurang mungkin dalam konteks ini—masa depan.
    reason: alternative_reading
  - marker: b
    text: “Bangsa-bangsa” merujuk kepada berbagai kelompok bangsa atau suku secara bersama-sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: kiranya ... memuji Engkau
  rationale: Bentuk Hifil dari ידה dalam konteks mazmur berarti ‘memuji’ atau ‘mengucap syukur’. Dalam refrein doa ini, ‘kiranya’ menyampaikan daya volitif bentuk imperfek tanpa menjadikannya kepastian tentang masa depan.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk pada beragam kelompok manusia. ‘Bangsa-bangsa’ alami dalam bahasa Indonesia dan tidak harus dibatasi pada negara sebagai kesatuan politik.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini merupakan sapaan langsung; partikel ‘ya’ menandai fungsi vokatif secara wajar dan khidmat.
- source_word: כֻּלָּם
  choice: segala bangsa
  rationale: Ungkapan ini menyampaikan cakupan total ‘mereka semua’ sekaligus mempertahankan kesejajaran dan kelancaran larik puitis.
theological_decisions:
- issue: Daya volitif dari kata kerja yang diulang dalam refrein pujian
  choice: 'Diterjemahkan sebagai permohonan: ‘Kiranya bangsa-bangsa memuji Engkau’'
  alternative: ‘Bangsa-bangsa akan memuji Engkau’
  rationale: Secara morfologis, bentuk Ibrani dapat dibaca sebagai imperfek, tetapi dalam konteks liturgisnya paling wajar berfungsi sebagai harapan atau doa. Terjemahan utama mempertahankan nada tersebut, sedangkan kemungkinan futur dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. ‘Kiranya’ dipilih untuk nada doa; ‘Engkau’ mempertahankan sapaan langsung kepada Allah. Pengulangan sumber dipertahankan.
