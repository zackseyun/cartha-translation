lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang bertanggung jawab memimpin atau mengarahkan penyajian musik. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan fungsi liturgis-musikalnya.
- source_word: בִּנְגִינֹת
  choice: dengan alat-alat musik petik
  rationale: Kata ini dalam judul musikal merujuk pada musik atau alat musik berdawai. 'Alat-alat musik petik' mudah dipahami pembaca umum, sementara preposisi בְּ diterjemahkan 'dengan'; kemungkinan 'pada' dicatat dalam catatan kaki.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah sebutan baku bagi jenis syair atau nyanyian ibadah tersebut dan mempertahankan label genre Ibraninya.
- source_word: שִׁיר
  choice: Nyanyian
  rationale: Istilah ini merupakan sebutan genre yang langsung. Diterjemahkan tersendiri agar dua sebutan Ibrani, מִזְמוֹר dan שִׁיר, tidak dilebur.
