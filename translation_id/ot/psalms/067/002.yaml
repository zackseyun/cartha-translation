  text: 'agar jalan-Mu dikenal di bumi[a],

    dan keselamatan-Mu[b] di antara segala bangsa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di negeri,” jika yang dimaksud adalah wilayah setempat. Namun, kesejajarannya dengan “di antara segala bangsa” lebih mendukung arti yang luas, yaitu “di bumi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pembebasan-Mu.” Istilah Ibrani ini dapat menunjuk pada tindakan membebaskan maupun keselamatan dalam arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: agar ... dikenal
  rationale: Infinitif konstruk dengan prefiks ל menyatakan tujuan dalam kesinambungan dengan doa pada ayat sebelumnya. Bentuk pasif ini alami dalam bahasa Indonesia dan mempertahankan maksud purposif teks.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: אֶרֶץ dapat berarti 'tanah/negeri' atau 'bumi'. Kesejajarannya dengan 'di antara segala bangsa' mendukung cakupan universal, tetapi alternatif lokal tetap dicatat.
- source_word: דַּרְכֶּךָ
  choice: jalan-Mu
  rationale: Pilihan ini mempertahankan metafora Ibrani yang dapat menunjuk pada jalan, tindakan, atau cara Allah berurusan dengan manusia.
- source_word: בְּכָל גּוֹיִם
  choice: di antara segala bangsa
  rationale: גּוֹיִם menunjuk pada bangsa-bangsa secara kolektif, sedangkan בְּ dalam konteks ini paling alami dinyatakan sebagai 'di antara'.
- source_word: יְשׁוּעָתֶךָ
  choice: keselamatan-Mu
  rationale: יְשׁוּעָה mencakup penyelamatan atau pembebasan oleh Allah. 'Keselamatan' mempertahankan keluasan maknanya tanpa membatasinya pada rumusan teologis yang lebih kemudian.
theological_decisions:
- issue: Cakupan אֶרֶץ dalam mazmur tentang penyembahan universal
  choice: '''bumi'' dalam arti universal'
  alternative: '''negeri'' dalam arti lokal'
  rationale: Kesejajaran dengan 'di antara segala bangsa' menunjukkan cakrawala sedunia, tanpa memasukkan klaim doktrinal yang melampaui teks.
- issue: Cakupan makna יְשׁוּעָה
  choice: keselamatan
  alternative: pembebasan atau kemenangan
  rationale: '''Keselamatan'' cukup luas untuk mencakup tindakan Allah yang menyelamatkan, sementara kemungkinan makna konkret ''pembebasan'' tetap dinyatakan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dua baris mempertahankan kesejajaran puisi Ibrani; unsur verbal pada baris kedua dibiarkan tersirat sebagaimana dalam sumber, tetapi hubungan antarbagiannya diperjelas secara alami dengan 'dan'.
