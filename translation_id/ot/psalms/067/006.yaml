id: PSA.67.6
reference: Psalms 67:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑/הּ יְ֝בָרְכֵ֗/נוּ אֱלֹהִ֥ים אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: id
  text: Bumi telah memberikan hasilnya[a]; Allah, Allah kita, memberkati kita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Negeri telah memberikan hasilnya.” Kata Ibrani אֶרֶץ dapat berarti “bumi” atau “negeri/tanah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kiranya Allah, Allah kita, memberkati kita,” atau “Allah, Allah kita, akan memberkati kita.” Dalam konteks ini, bentuk verba Ibrani dapat dipahami sebagai pernyataan masa kini, harapan atau permohonan, maupun masa depan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: bumi
  rationale: Dalam cakupan universal mazmur ini, “bumi” lebih sesuai daripada “negeri” atau “tanah,” meskipun kata Ibrani tersebut dapat memiliki kedua arti itu.
- source_word: נָתְנָה
  choice: telah memberikan
  rationale: Mempertahankan makna dasar verba “memberikan” dan nuansa hasil yang sudah terwujud; ungkapan ini tetap wajar dengan objek pertanian “hasilnya.”
- source_word: יְבוּלָהּ
  choice: hasilnya
  rationale: Istilah umum dan alami untuk hasil pertanian, tanpa mempersempit maknanya menjadi masa atau kegiatan panen.
- source_word: יְבָרְכֵנוּ
  choice: memberkati kita
  rationale: Bentuk imperfek Ibrani dapat menyatakan keadaan kini, harapan, atau masa depan. Bacaan indikatif dipakai dalam teks utama sebagai pernyataan penuh keyakinan, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku bagi sebutan ilahi ini ketika merujuk kepada Allah Israel.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Menerjemahkan bentuk dengan akhiran orang pertama jamak secara langsung dan mempertahankan penekanan dalam pengulangan “Allah, Allah kita.”
theological_decisions:
- issue: Daya atau modus verba imperfek יְבָרְכֵנוּ
  choice: 'indikatif masa kini: “memberkati kita”'
  alternative: 'jussif/doa: “kiranya ... memberkati kita”; atau masa depan: “akan memberkati kita”'
  rationale: Konteks memungkinkan lebih dari satu pembacaan. Pernyataan sebelumnya tentang hasil bumi mendukung afirmasi berkat yang sedang nyata, tetapi kemungkinan doa dan masa depan tetap dipertahankan dalam catatan kaki agar ketegangan teks Ibrani tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “Allah, Allah kita” dipertahankan untuk mencerminkan pengulangan dan penekanan dalam bahasa Ibrani.
