id: PSA.67.1
reference: Psalms 67:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: id
  text: Kiranya Allah bermurah hati kepada kita dan memberkati kita; kiranya wajah-Nya bersinar atas kita.[a][b] Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani yang diterjemahkan “atas kita” berarti “bersama kita”; dalam ungkapan ini, maksudnya ialah wajah Allah bersinar dengan perkenanan kepada umat-Nya.
    reason: lexical_alternative
  - marker: b
    text: Baris ini menggemakan berkat imam dalam Bilangan 6:24–26, khususnya, “TUHAN menyinari engkau dengan wajah-Nya.”
    reason: cross_reference
  - marker: c
    text: “Sela” mungkin merupakan petunjuk liturgis atau musikal; makna tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba-verba tunggal dan konteksnya menunjukkan Allah Israel yang esa; dalam bahasa Indonesia, padanannya adalah “Allah”.
- source_word: יְחָנֵּנוּ
  choice: bermurah hati kepada kita
  rationale: Dalam konteks doa, bentuk dari חנן memohon kemurahan dan perkenanan ilahi. Ungkapan ini alami dalam bahasa Indonesia serta tidak mempersempit maknanya menjadi belas kasihan saja.
- source_word: וִיבָרְכֵנוּ
  choice: dan memberkati kita
  rationale: ברך adalah verba baku untuk tindakan memberkati; padanan langsung ini tepat dan wajar.
- source_word: יָאֵר
  choice: kiranya ... bersinar
  rationale: Bentuk Hifil dari אור secara harfiah dapat berarti “membuat bersinar,” tetapi bersama “wajah-Nya” ungkapan “kiranya wajah-Nya bersinar” lebih alami dan tetap mempertahankan citra teks sumber.
- source_word: פָּנָיו
  choice: wajah-Nya
  rationale: Padanan harfiahnya adalah “wajah-Nya.” Citra konkret ini dipertahankan karena penting bagi ungkapan berkat dan kaitannya dengan Bilangan 6:24–26.
- source_word: אִתָּנוּ
  choice: atas kita
  rationale: Kata depan ini secara harfiah berarti “bersama kita,” tetapi dalam ungkapan tentang wajah yang bersinar, “atas kita” menyampaikan arah perkenanan ilahi dengan lebih alami. Arti harfiahnya dicatat dalam catatan kaki.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna persis istilah ini tidak pasti dan kemungkinan merupakan petunjuk liturgis atau musikal; karena itu, istilah tersebut ditransliterasikan, bukan ditafsirkan secara spekulatif.
theological_decisions:
- issue: Daya volitif rangkaian verba
  choice: Diterjemahkan sebagai doa atau harapan dengan “Kiranya ...”
  alternative: Pembacaan indikatif seperti “Allah bermurah hati kepada kita dan memberkati kita”
  rationale: Dalam konteks berkat mazmur, bentuk-bentuk verbal ini paling wajar berfungsi sebagai permohonan. “Kiranya” mengungkapkan daya jussif atau optatif tanpa mengubahnya menjadi pernyataan fakta.
- issue: Gema berkat imam
  choice: Mempertahankan gambaran wajah Allah yang bersinar
  alternative: Menguraikannya menjadi “memandang kita dengan perkenanan”
  rationale: Ayat ini jelas menggemakan Bilangan 6:24–26. Gambaran asli dipertahankan agar hubungan antarteks dan ketegangan puitisnya tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur doa dipertahankan dengan “Kiranya,” sedangkan citra konkret “wajah-Nya bersinar” dipertahankan demi kesetiaan puitis dan hubungan antarteks.
