  text: יְבָרְכֵ֥/נוּ אֱלֹהִ֑ים וְ/יִֽירְא֥וּ אֹ֝ת֗/וֹ כָּל אַפְסֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/007.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: id
  text: Allah akan memberkati kita, dan segala ujung bumi akan takut kepada-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan menghormati-Nya dengan takzim” atau “akan gentar di hadapan-Nya.” Kata kerja Ibrani yang dipakai dapat mencakup rasa takut sekaligus hormat dan takzim kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: akan memberkati kita
  rationale: Bentuk Piel dengan akhiran orang pertama jamak berarti ‘memberkati kita’. Dalam penutup mazmur ini, bentuk imperfek paling wajar menyatakan keyakinan akan tindakan mendatang atau hasil yang pasti, meskipun nuansa permohonan ‘kiranya memberkati kita’ tetap mungkin.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, rujukannya tunggal. ‘Allah’ merupakan padanan baku dan alami dalam bahasa Indonesia untuk sebutan ini.
- source_word: וְיִירְאוּ
  choice: dan ... akan takut
  rationale: Dalam hubungan dengan Allah, verba ירא mencakup rasa takut, hormat, dan gentar penuh takzim. ‘Takut’ mempertahankan keluasan serta bobot istilah Ibrani itu, sementara nuansa lain dijelaskan dalam catatan kaki.
- source_word: אֹתוֹ
  choice: kepada-Nya
  rationale: Pronomina ini merujuk kepada Allah sebagai pribadi tunggal. Konstruksi Indonesia ‘takut kepada-Nya’ lebih alami daripada terjemahan harfiah dengan objek langsung.
- source_word: כָּל
  choice: seluruh
  rationale: Dengan frasa kolektif berikutnya, כָּל menyatakan keseluruhan. ‘Seluruh’ menghasilkan ungkapan Indonesia yang alami.
- source_word: אַפְסֵי אָרֶץ
  choice: ujung bumi
  rationale: Frasa konstruksi ini merupakan ungkapan puitis bagi bagian-bagian dunia yang paling jauh. ‘Ujung bumi’ mempertahankan citra dan kepekatan teks sumber.
theological_decisions:
- issue: Makna ירא dalam hubungan dengan Allah
  choice: takut kepada-Nya
  alternative: menghormati-Nya; gentar penuh takzim kepada-Nya
  rationale: Terjemahan ‘takut’ mempertahankan ketegangan makna yang mencakup rasa gentar, penghormatan, ketakziman, dan ketundukan, tanpa mempersempitnya menjadi sekadar rasa hormat.
- issue: Nuansa bentuk imperfek יְבָרְכֵנוּ
  choice: Allah akan memberkati kita
  alternative: Kiranya Allah memberkati kita
  rationale: Sebagai baris penutup mazmur, kalimat ini paling alami dibaca sebagai pernyataan keyakinan yang diikuti akibat universal. Namun, bentuk Ibraninya juga dapat dipahami bernuansa permohonan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan kalimat mempertahankan paralelisme serta nada penutup yang penuh keyakinan. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
