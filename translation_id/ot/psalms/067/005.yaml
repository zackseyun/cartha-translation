  text: יוֹד֖וּ/ךָ עַמִּ֥ים אֱלֹהִ֑ים י֝וֹד֗וּ/ךָ עַמִּ֥ים כֻּלָּֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/005.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: id
  text: Kiranya bangsa-bangsa memuji-Mu[a][b], ya Allah; kiranya semua bangsa memuji-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bangsa-bangsa akan memuji-Mu, ya Allah; semua bangsa akan memuji-Mu.”
    reason: alternative_reading
  - marker: b
    text: Kata kerja Ibrani juga dapat berarti “bersyukur kepada-Mu”, tetapi dalam refrein puitis ini “memuji-Mu” paling tepat menyampaikan makna ibadahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: kiranya ... memuji-Mu
  rationale: Bentuk Hifil dari ידה dalam Mazmur lazim menyatakan pujian atau syukur kepada Allah dalam ibadah bersama. “Memuji-Mu” paling tepat menyampaikan daya liturgis ayat ini, sedangkan “kiranya” mengungkapkan nuansa harapan atau permohonan.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk pada banyak kelompok manusia. “Bangsa-bangsa” alami dalam puisi Indonesia dan mempertahankan cakupan universal mazmur.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung. Partikel “ya” menyatakan bentuk vokatif secara alami dan khidmat dalam bahasa Indonesia.
- source_word: כֻּלָּם
  choice: semua bangsa
  rationale: Kata ini menegaskan keseluruhan bangsa-bangsa yang telah disebut. “Semua bangsa” ringkas, jelas, dan menyampaikan cakupan menyeluruh.
theological_decisions:
- issue: Modus dan fungsi wacana klausa yang diulang
  choice: 'Diterjemahkan sebagai harapan atau permohonan: “Kiranya bangsa-bangsa memuji-Mu”'
  alternative: “Bangsa-bangsa akan memuji-Mu”
  rationale: Bentuk Ibrani dapat dipahami sebagai indikatif, tetapi dalam refrein mazmur yang bernada doa, arti volitif paling wajar. Kemungkinan arti prediktif tetap dicatat agar ambiguitas sumber tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis dan khidmat. “Kiranya” mempertahankan nada doa tanpa terdengar usang; pengulangan sengaja dipertahankan sebagai ciri refrein.
