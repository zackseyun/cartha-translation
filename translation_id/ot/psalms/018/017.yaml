source:
  edition: WLC
  text: יַצִּילֵ֗/נִי מֵ/אֹיְבִ֥/י עָ֑ז וּ֝/מִ/שֹּׂנְאַ֗/י כִּֽי אָמְצ֥וּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/017.yaml
  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: id
  text: Ia melepaskan aku dari musuhku yang kuat[a], dan dari orang-orang yang membenci aku[b], sebab mereka lebih kuat daripada aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia menyelamatkan aku,” jika bentuk imperfek puitis ini dipahami bernuansa kini.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani untuk “musuhku” berbentuk tunggal, sedangkan frasa berikutnya, “orang-orang yang membenci aku,” berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Ia melepaskan aku
  rationale: Bentuk Hifil dari נצל berarti ‘melepaskan, menyelamatkan’. Bentuk imperfek puitis ini dipahami sebagai tindakan lampau karena konteks mazmur sedang menceritakan pertolongan Allah yang telah terjadi.
- source_word: מֵאֹיְבִי
  choice: dari musuhku
  rationale: Nomina Ibrani berbentuk tunggal dengan akhiran orang pertama tunggal; bentuk tunggal dipertahankan.
- source_word: עָז
  choice: yang kuat
  rationale: Adjektiva ini berarti ‘kuat, perkasa’; klausa relatif singkat menghasilkan ungkapan Indonesia yang alami.
- source_word: וּמִשֹּׂנְאַי
  choice: dan dari orang-orang yang membenci aku
  rationale: Partisipel jamak dari שׂנא dengan akhiran orang pertama tunggal secara harfiah menunjuk kepada ‘mereka yang membenci aku’; klausa relatif mempertahankan jumlah jamak dan sifat permusuhan yang berkelanjutan.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan mengapa pemazmur memerlukan pelepasan.
- source_word: אָמְצוּ מִמֶּנִּי
  choice: mereka lebih kuat daripada aku
  rationale: אָמְצוּ berarti ‘menjadi kuat’, sedangkan מִמֶּנִּי menyatakan perbandingan; terjemahan ini mempertahankan secara langsung bahwa para lawan melampaui kekuatan pemazmur.
theological_decisions:
- issue: Aspek waktu verba pembuka dalam puisi Ibrani
  choice: 'Tindakan lampau: ‘Ia melepaskan aku’'
  alternative: 'Nuansa kini atau kebiasaan: ‘Ia melepaskan/menyelamatkan aku’'
  rationale: Bagian mazmur ini menceritakan tindakan pertolongan TUHAN sebagai peristiwa yang telah terjadi. Namun, karena bentuk imperfek puitis dapat memiliki nuansa kini, kemungkinan itu dicatat dalam catatan kaki tanpa memaksakan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa terasa usang. ‘Ia’ dipakai sesuai gaya naratif mazmur; ‘melepaskan’ mempertahankan citra pembebasan dari bahaya. Struktur tunggal lalu jamak dalam teks Ibrani sengaja dipertahankan.
