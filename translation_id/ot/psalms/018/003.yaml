id: PSA.18.3
reference: Psalms 18:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּ/מִן אֹ֝יְבַ֗/י אִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: id
  text: Aku berseru kepada Yahweh[a], yang layak dipuji, dan aku diselamatkan dari musuh-musuhku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai nama ilahi YHWH.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan, “aku akan diselamatkan dari musuh-musuhku.” Kata kerja Ibrani ini juga dapat dipahami dengan makna mendatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: layak dipuji
  rationale: Partisipel pasif dari הלל dipakai secara predikatif untuk Yahweh. Frasa ini menyampaikan nuansa evaluatif bahwa Ia patut menerima pujian, bukan sekadar sedang dipuji.
- source_word: אֶקְרָא
  choice: aku berseru kepada
  rationale: Dalam konstruksi dengan nama ilahi, קרא menyatakan tindakan memanggil atau memohon kepada Allah. 'Berseru kepada' alami dalam bahasa Indonesia dan sesuai dengan konteks doa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh' agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: וּמִן
  choice: dan ... dari
  rationale: Gabungan konjungsi dan preposisi menghubungkan tindakan berseru dengan keselamatan dari musuh tanpa harus menambahkan hubungan sebab-akibat yang lebih tegas daripada teks Ibrani.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan jelas bagi bentuk jamak אויב dengan sufiks orang pertama tunggal.
- source_word: אִוָּשֵׁעַ
  choice: aku diselamatkan
  rationale: Bentuk nifal imperfek dari ישׁע dapat mengungkapkan hasil yang diyakini atau tindakan pada masa mendatang. Bentuk kini/resultatif dipilih untuk menyampaikan pengakuan penuh keyakinan dalam puisi ini, sementara kemungkinan makna mendatang dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Aspek אִוָּשֵׁעַ dan hubungannya dengan seruan kepada Yahweh
  choice: aku diselamatkan
  alternative: aku akan diselamatkan; aku dilepaskan
  rationale: Imperfek Ibrani di sini dapat dibaca sebagai pernyataan umum/resultatif ataupun berorientasi ke masa depan. Terjemahan utama menyatakan keyakinan pemazmur tanpa meniadakan kemungkinan nuansa mendatang, yang disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan hubungan antarklausa serta ambiguitas aspek kata kerja Ibrani.
