  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: id
  text: Aku tidak bercela[a] di hadapan-Nya,[b] dan aku menjaga diriku dari kesalahanku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utuh”, “tulus”, atau “berintegritas”; “tidak bercela” di sini menunjuk pada integritas, bukan dengan sendirinya keadaan mutlak tanpa dosa.
    reason: lexical_alternative
  - marker: b
    text: 'Kata ganti “-Nya” mengacu kepada TUHAN dalam konteks ayat-ayat di sekitarnya. Secara harfiah: “dengan-Nya”.'
    reason: cross_reference
  - marker: c
    text: Atau “dari kejahatanku”, “dari dosaku”, atau “dari kesalahan yang kutanggung”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Aku hidup
  rationale: Bentuk wayyiqtol orang pertama tunggal dari היה menyatakan keadaan dalam rangkaian lampau. Dalam bahasa Indonesia, “aku hidup” berpadu secara alami dengan sifat moral תָמִים tanpa mengubahnya menjadi klaim tentang keadaan tanpa dosa.
- source_word: תָמִים
  choice: tidak bercela
  rationale: Dalam konteks moral, תָמִים menunjuk pada keutuhan atau integritas hidup. “Tidak bercela” mempertahankan kuatnya pernyataan Ibrani tanpa dengan sendirinya berarti kesempurnaan mutlak tanpa dosa.
- source_word: עִמּוֹ
  choice: di hadapan-Nya
  rationale: Secara harfiah berarti “dengan dia/Nya”, tetapi dalam ungkapan tentang integritas terhadap Allah, “di hadapan-Nya” lebih alami dalam bahasa Indonesia dan sesuai dengan relasi yang dimaksud. Pronomina tetap dipertahankan; acuannya adalah TUHAN dalam konteks sekitar.
- source_word: וָאֶשְׁתַּמֵּר
  choice: aku menjaga diriku
  rationale: Bentuk Hitpael dari שמר bernuansa refleksif, yakni menjaga atau mengawasi diri sendiri. Terjemahan ini mempertahankan unsur kewaspadaan aktif sang pemazmur.
- source_word: מֵעֲוֺנִי
  choice: dari kesalahanku
  rationale: עָוֹן dapat berarti kesalahan, kejahatan, atau kesalahan yang mendatangkan hukuman. “Kesalahanku” mempertahankan akhiran orang pertama tunggal dan cukup luas untuk menampung nuansa tindakan salah maupun keadaan bersalah.
theological_decisions:
- issue: Makna “tidak bercela” bagi keadaan moral manusia
  choice: Ungkapan ini menyatakan integritas atau keutuhan hidup di hadapan Allah, bukan secara niscaya kesempurnaan mutlak tanpa dosa.
  alternative: Memahaminya sebagai klaim bahwa pemazmur sama sekali tidak berdosa.
  rationale: Konteks mazmur menekankan kelurusan perilaku dan pembenaran sang pemazmur. Terjemahan mempertahankan pernyataan moral yang kuat tanpa memasukkan doktrin kesempurnaan tanpa dosa yang tidak dinyatakan secara eksplisit.
- issue: Acuan pronomina עִמּוֹ
  choice: Mempertahankan pronomina “-Nya” dan menjelaskan bahwa acuannya adalah TUHAN.
  alternative: Mengganti pronomina langsung dengan nama “TUHAN”.
  rationale: Teks Ibrani memakai pronomina, sedangkan konteks sekitar menjelaskan acuannya. Bentuk terjemahan mempertahankan struktur tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. “Aku” sesuai dengan suara pribadi pemazmur. Kapitalisasi “-Nya” memperjelas acuan ilahi tanpa mengganti pronomina asli dengan nama ilahi.
