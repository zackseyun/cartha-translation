  yaml_path: translation/ot/psalms/018/028.yaml
  text: For you light my lamp[b][a]; Yahweh my God lights up my darkness.
translation:
  language: id
  text: 'Sebab Engkau menyalakan pelitaku;[a]

    Yahweh, Allahku, menerangi kegelapanku.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat pelitaku bersinar.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “kegelapanku” dapat merujuk pada kesesakan, bahaya, atau kemuraman.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau dasar bagi pujian dan keyakinan dalam konteksnya; “Sebab” alami dalam puisi Indonesia dan mempertahankan hubungan logisnya.
- source_word: תָּאִיר
  choice: menyalakan
  rationale: Bentuk Hifil dari אור menyatakan tindakan memberi terang atau membuat bercahaya. Bersama “pelitaku”, “menyalakan” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan makna kausatif.
- source_word: נֵרִי
  choice: pelitaku
  rationale: נֵר secara konkret berarti pelita atau lampu. “Pelitaku” mempertahankan metafora puitis kuno dan cocok dengan konteks mazmur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal diterjemahkan secara langsung dan wajar sebagai “Allahku”.
- source_word: יַגִּיהַּ
  choice: menerangi
  rationale: Kata kerja ini menyatakan membuat terang atau bercahaya. “Menerangi” jelas, puitis, dan mempertahankan kesejajaran dengan tindakan menyalakan pelita.
- source_word: חָשְׁכִּי
  choice: kegelapanku
  rationale: Nomina dengan akhiran orang pertama diterjemahkan secara harfiah untuk mempertahankan metafora yang dapat mencakup kesesakan, bahaya, atau kemuraman tanpa membatasi maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehovah” mencerminkan pelafalan tradisional yang berbeda.
- issue: Cakupan metafora “kegelapanku”
  choice: Mempertahankan metafora tanpa penafsiran khusus
  alternative: kesesakanku; bahaya yang mengelilingiku; kemuramanku
  rationale: Konteks memungkinkan kegelapan menunjuk pada kesesakan, bahaya, atau kemuraman. Terjemahan literal mempertahankan keluasan dan ketegangan puitis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. Kapitalisasi kata ganti “Engkau” menandai sapaan kepada Allah sesuai kebiasaan penulisan Indonesia. Pemenggalan dua baris mempertahankan paralelisme puisi Ibrani.
