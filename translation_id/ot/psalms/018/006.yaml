id: PSA.18.6
reference: Psalms 18:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/צַּר לִ֤/י אֶֽקְרָ֣א יְהוָה֮ וְ/אֶל אֱלֹהַ֪/י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵ/הֵיכָל֣/וֹ קוֹלִ֑/י וְ֝/שַׁוְעָתִ֗/י לְ/פָנָ֤י/ו תָּב֬וֹא בְ/אָזְנָֽי/ו־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: id
  text: Dalam kesesakanku aku berseru kepada Yahweh, dan kepada Allahku aku berteriak minta tolong. Dari bait-Nya[b] Ia mendengar suaraku[a], dan jeritanku di hadapan-Nya sampai ke telinga-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari bait-Nya Ia akan mendengar suaraku.” Bentuk imperfek Ibrani dapat dipahami dengan makna masa depan; demikian pula bagian akhir ayat dapat diterjemahkan, “jeritanku ... akan sampai ke telinga-Nya.”
    reason: alternative_reading
  - marker: b
    text: “Bait” juga dapat diterjemahkan “istana” atau “tempat kudus”; kata Ibraninya dapat menunjuk pada kediaman seorang raja atau kediaman Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Dalam kesesakanku
  rationale: Ungkapan ini menyatakan keadaan terimpit atau tertimpa kesusahan; akhiran makna personal pada לִי diungkapkan secara alami dengan bentuk posesif Indonesia.
- source_word: אֶקְרָא יְהוָה
  choice: aku berseru kepada Yahweh
  rationale: קרא dengan nama ilahi menyatakan seruan atau permohonan kepada-Nya; 'berseru kepada' alami dan tetap kuat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama pribadi ilahi dipertahankan sebagai transliterasi, bukan diganti dengan gelar.
- source_word: וְאֶל־אֱלֹהַי אֲשַׁוֵּעַ
  choice: dan kepada Allahku aku berteriak minta tolong
  rationale: שׁוע dalam bentuk Piel menyatakan teriakan memohon pertolongan; pilihan ini membuat unsur permintaan bantuan jelas.
- source_word: יִשְׁמַע
  choice: Ia mendengar
  rationale: Imperfek Ibrani dalam puisi dapat menyatakan kini yang hidup, kebiasaan, atau masa depan. Teks utama memakai kini yang hidup, sementara kemungkinan masa depan dicatat.
- source_word: מֵהֵיכָלוֹ
  choice: Dari bait-Nya
  rationale: הֵיכָל dapat berarti bait, istana, atau tempat kudus. 'Bait-Nya' ringkas, bermartabat, dan lazim bagi kediaman Allah tanpa menentukan apakah yang dimaksud bait duniawi atau surgawi.
- source_word: וְשַׁוְעָתִי לְפָנָיו
  choice: dan jeritanku di hadapan-Nya
  rationale: שַׁוְעָה adalah jeritan meminta pertolongan dan לְפָנָיו secara harfiah menunjuk pada hadapan atau kehadiran-Nya.
- source_word: תָּבוֹא בְאָזְנָיו
  choice: sampai ke telinga-Nya
  rationale: Terjemahan ini mempertahankan gambaran antropomorfis bahwa jeritan itu mencapai telinga Allah, sekaligus terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Nilai waktu imperfek יִשְׁמַע dan תָּבוֹא
  choice: 'Kini yang hidup: ''Ia mendengar'' dan ''sampai'''
  alternative: 'Masa depan: ''Ia akan mendengar'' dan ''akan sampai'''
  rationale: Bentuk imperfek dalam puisi Ibrani memungkinkan kedua pembacaan. Teks utama memilih kesaksian yang hidup tanpa menutup kemungkinan daya masa depan, yang dicatat dalam catatan kaki.
- issue: Lokasi הֵיכָל Allah
  choice: bait-Nya
  alternative: istana-Nya atau tempat kudus-Nya
  rationale: Kata Ibrani memiliki rentang makna tersebut dan konteks tidak mengharuskan penentuan lebih lanjut antara kediaman rajawi dan tempat kudus Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Paralelisme seruan dan jeritan dipertahankan, begitu pula gambaran konkret tentang telinga Allah. Penanda catatan kaki ditempatkan pada klausa yang relevan.
