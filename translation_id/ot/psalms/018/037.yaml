base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: id
  text: Aku mengejar musuh-musuhku dan menyusul mereka; aku tidak berbalik sampai mereka binasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “sampai kebinasaan mereka tuntas.”'
    reason: Menunjukkan kemungkinan terjemahan yang lebih harfiah bagi כַּלּוֹתָם, yang menyatakan kebinasaan atau kehancuran mereka sampai tuntas.
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: Aku mengejar
  rationale: Bentuk imperfek Qal orang pertama tunggal dipahami sebagai tindakan lampau dalam konteks kemenangan puitis. “Mengejar” wajar untuk pengejaran militer.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan lazim bagi nomina dengan sufiks orang pertama tunggal.
- source_word: וְאַשִּׂיגֵם
  choice: dan menyusul mereka
  rationale: Bentuk Hifil dari נשׂג dalam konteks pengejaran berarti mencapai atau menyusul pihak yang dikejar. “Menyusul” mempertahankan gambaran pengejaran tanpa menambahkan tindakan penangkapan.
- source_word: וְלֹא אָשׁוּב
  choice: aku tidak berbalik
  rationale: Dalam konteks ini שוב menyatakan berbalik atau menghentikan pengejaran, bukan sekadar pulang.
- source_word: עַד כַּלּוֹתָם
  choice: sampai mereka habis
  rationale: Ungkapan ini menandai titik akhir berupa kehancuran atau berakhirnya para musuh. “Mereka habis” mempertahankan daya ungkap kekalahan total sekaligus tidak menentukan pelaku secara lebih tegas daripada bahasa Ibrani.
theological_decisions:
- issue: Kekerasan dan pelaku yang tersirat dalam frasa penutup
  choice: sampai mereka habis
  alternative: sampai aku membinasakan mereka sama sekali; sampai mereka dilenyapkan
  rationale: Mazmur ini menggambarkan kemenangan militer yang dimampukan Allah. Terjemahan tidak melunakkan kekalahan total para musuh, tetapi juga tidak menyisipkan pelaku eksplisit yang tidak dinyatakan dalam konstruksi Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan puitis. Titik koma mempertahankan kesejajaran dua klausa. Ungkapan “mereka habis” mudah dipahami, tetap bermartabat dalam konteks puisi perang, dan menjaga ketidakjelasan pelaku dalam frasa terakhir.
