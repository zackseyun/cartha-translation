  yaml_path: translation/ot/psalms/018/025.yaml
  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: id
  text: Kepada orang yang setia, Engkau menyatakan diri-Mu setia[a]; kepada laki-laki yang tak bercela, Engkau menyatakan diri-Mu tak bercela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kepada orang yang loyal/saleh, Engkau menyatakan diri-Mu loyal.” Bahasa Ibrani memakai kata-kata dari akar yang sama (חסד), sehingga menekankan kesetiaan perjanjian yang bersesuaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  choice: orang yang setia
  rationale: Kata ini menunjuk kepada orang yang bercirikan kesetiaan, kesalehan, atau kasih setia dalam hubungan perjanjian. Pilihan “orang yang setia” alami dalam bahasa Indonesia dan memungkinkan pengulangan akar kata dengan verba berikutnya tetap terdengar.
- source_word: תִּתְחַסָּד
  choice: Engkau menunjukkan diri-Mu setia
  rationale: Bentuk hitpael mendukung makna refleksif, yaitu Allah memperlihatkan diri-Nya sebagai pihak yang setia. Ungkapan ini mempertahankan hubungan timbal balik dan permainan kata dengan חָסִיד tanpa mempersempit maknanya menjadi belas kasihan saja.
- source_word: גְּבַר
  choice: laki-laki
  rationale: Nomina maskulin tunggal ini berarti laki-laki, kadang dengan nuansa kekuatan. “Laki-laki” mempertahankan kekhususan gender teks sumber, sedangkan nuansa kekuatan tidak cukup menonjol untuk diterjemahkan sebagai “orang kuat”.
- source_word: תָּמִים
  choice: tak bercela
  rationale: Dalam konteks etis, kata ini menyatakan keutuhan atau integritas yang tampak sebagai keadaan tak bercela. Pilihan ini jelas, wajar, dan sesuai dengan paralelisme ayat.
- source_word: תִּתַּמָּם
  choice: Engkau menunjukkan diri-Mu tak bercela
  rationale: Verba dari akar תמם menggemakan תָּמִים. Terjemahan ini mempertahankan bentuk refleksif dan korespondensi leksikal, tanpa memakai “sempurna” yang dapat mengalihkan perhatian kepada kesempurnaan metafisis.
theological_decisions:
- issue: Gambaran timbal balik tentang sikap Allah terhadap karakter manusia
  choice: Ayat diterjemahkan sebagai Allah yang menunjukkan diri-Nya setia dan tak bercela dalam hubungan yang sesuai dengan manusia tersebut.
  alternative: “Kepada orang yang setia, Engkau berlaku setia; kepada laki-laki yang tak bercela, Engkau berlaku tanpa cela.”
  rationale: Bentuk verba Ibrani mendukung ungkapan refleksif “menunjukkan diri-Mu”. Terjemahan ini mempertahankan ketegangan puitis tentang hubungan timbal balik tanpa menyiratkan bahwa hakikat moral Allah berubah karena perilaku manusia.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan ilahi ditulis dengan kapitalisasi hormat. Pengulangan “setia” dan “tak bercela” sengaja dipertahankan untuk mencerminkan pasangan kata serumpun dan paralelisme puisi Ibrani.
