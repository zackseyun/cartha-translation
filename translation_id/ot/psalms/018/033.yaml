  text: מְשַׁוֶּ֣ה רַ֭גְלַ/י כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּ֝מֹתַ֗/י יַעֲמִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/033.yaml
  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: id
  text: Ia menjadikan kakiku seperti kaki rusa betina[a] dan membuat aku berdiri di tempat-tempat tinggiku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti rusa-rusa betina.” Bahasa Ibrani menyebut rusa betina; gambaran ini membangkitkan gerakan yang cepat dan pijakan yang mantap.
    reason: lexical_alternative
  - marker: b
    text: Atau “di ketinggian-ketinggianku.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: membuat ... seperti
  rationale: Bentuk Piel dari שׁוה di sini menyatakan tindakan menjadikan serupa; konstruksi 'membuat ... seperti' alami dalam bahasa Indonesia dan mempertahankan perbandingan teks Ibrani.
- source_word: רַגְלַי
  choice: kakiku
  rationale: רֶגֶל berarti kaki; bentuk dengan sufiks orang pertama tunggal diterjemahkan secara langsung sebagai 'kakiku'.
- source_word: כָּאַיָּלוֹת
  choice: seperti kaki rusa betina
  rationale: אַיָּלוֹת adalah bentuk jamak feminin yang menunjuk pada rusa betina. Penambahan 'kaki' sesudah 'seperti' memperjelas perbandingan yang tersirat—kaki pemazmur seperti kaki rusa betina—tanpa mengubah gambaran tentang kelincahan dan kemantapan pijakan.
- source_word: וְעַל
  choice: dan ... di
  rationale: Gabungan konjungsi dan preposisi ini menghubungkan klausa kedua serta menunjukkan lokasi. 'Di' terdengar alami dengan 'tempat-tempat tinggi'.
- source_word: בָּמוֹתַי
  choice: tempat-tempat tinggiku
  rationale: בָּמוֹת adalah bentuk jamak dan memiliki sufiks orang pertama tunggal. Terjemahan ini mempertahankan bentuk jamak, unsur kepunyaan, dan gambaran tempat tinggi tanpa memberinya arti kultis.
- source_word: יַעֲמִידֵנִי
  choice: menegakkan aku
  rationale: Bentuk Hifil dari עמד berarti menyebabkan seseorang berdiri atau menempatkannya dalam posisi berdiri. 'Menegakkan aku' mempertahankan makna kausatif tanpa menambahkan gagasan 'aman' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Gambaran metaforis tentang kelincahan dan kedudukan di tempat tinggi
  choice: Mempertahankan gambaran kaki rusa betina dan tindakan Allah menegakkan pemazmur di tempat-tempat tingginya.
  alternative: Menjelaskan gambaran itu sebagai Allah memberi kelincahan, keamanan, atau kemenangan militer.
  rationale: Konteks mazmur berkaitan dengan pembebasan dan peperangan, tetapi ayat ini sendiri memakai bahasa puitis. Terjemahan tidak membatasi metafora pada satu penafsiran atau menambahkan keamanan secara eksplisit.
- issue: Makna sufiks pada בָּמוֹתַי
  choice: tempat-tempat tinggiku
  alternative: tempat-tempat tinggi atau ketinggian-ketinggianku
  rationale: Sufiks orang pertama dipertahankan karena terdapat dalam teks Ibrani. Maknanya dapat mencakup medan tinggi yang dikuasai atau dilalui pemazmur, tetapi terjemahan tidak menentukan implikasinya lebih lanjut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Ia' mengikuti rujukan kepada Allah dalam konteks, sedangkan 'menegakkan' menjaga bentuk kausatif dan menghindari penambahan makna 'aman'. Semua penanda catatan kaki ditempatkan dalam teks utama.
