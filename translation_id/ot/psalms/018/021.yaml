  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: id
  text: Sebab aku telah menaati jalan-jalan Yahweh dan tidak secara fasik meninggalkan Allahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan tidak berbuat fasik dengan menjauh dari Allahku.” Secara harfiah, kata kerjanya berarti “berbuat fasik”; frasa berikutnya menyatakan pemisahan dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan alasan bagi pernyataan sebelumnya; “Sebab” sesuai dengan alur argumentasi mazmur.
- source_word: שָׁמַרְתִּי
  choice: aku telah menuruti
  rationale: Dalam konteks jalan hidup yang ditetapkan Allah, שׁמר berarti memelihara atau menaati. “Menuruti” terdengar alami dalam bahasa Indonesia dan mempertahankan nuansa ketaatan.
- source_word: דַּרְכֵי
  choice: jalan-jalan
  rationale: Bentuk jamak ini menunjuk pada pola atau cara hidup yang dikehendaki Yahweh, bukan semata-mata jalan harfiah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: רָשַׁעְתִּי
  choice: berbuat fasik
  rationale: Kata kerja ini berarti bertindak jahat atau fasik. Pilihan ini mempertahankan penilaian moral yang kuat dalam teks Ibrani.
- source_word: מֵאֱלֹהָי
  choice: dengan menjauh dari Allahku
  rationale: Preposisi מִן menyatakan gerak atau pemisahan “dari”; dalam hubungan dengan רשע, frasa ini menggambarkan tindakan fasik berupa menjauh dari Allah.
theological_decisions:
- issue: Klaim pemazmur tentang kebenaran dirinya
  choice: Diterjemahkan sebagai klaim kesetiaan dalam menaati jalan Yahweh dan tidak menjauh dari Allah dengan fasik.
  alternative: Menerjemahkannya sebagai pernyataan mutlak bahwa pemazmur sama sekali tidak berdosa.
  rationale: Teks menyatakan integritas dan kesetiaan yang kuat, tetapi tidak secara langsung mengajarkan ketidakberdosaan mutlak. Terjemahan mempertahankan ketegangan itu tanpa melemahkan klaim pemazmur.
- issue: Hubungan sintaksis רָשַׁעְתִּי dengan מֵאֱלֹהָי
  choice: “tidak berbuat fasik dengan menjauh dari Allahku”
  alternative: “tidak dengan fasik meninggalkan Allahku”
  rationale: Bahasa Ibrani dapat dipahami secara lebih harfiah sebagai “bertindak fasik” disertai frasa pemisahan “dari Allahku,” atau secara terpadu sebagai “menjauh dengan fasik.” Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki menjaga alternatif tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aku” mempertahankan suara pribadi pemazmur; “jalan-jalan” mempertahankan metafora Ibrani, sedangkan “menuruti” memperjelas makna ketaatan secara alami.
