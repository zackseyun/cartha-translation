base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/007.yaml
  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: id
  text: 'Lalu bumi bergolak dan berguncang;

    dasar-dasar gunung gemetar dan bergolak,

    sebab murka-Nya menyala.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab Ia murka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: bergolak
  rationale: Kata געשׁ menggambarkan gerakan hebat atau gejolak. “Bergolak” mempertahankan daya hidup gambaran puitis dan membedakannya dari רעשׁ.
- source_word: וַתִּרְעַשׁ
  choice: berguncang
  rationale: Kata רעשׁ lazim menunjuk pada guncangan seperti gempa. “Berguncang” alami bagi subjek “bumi” dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam konteks penampakan ilahi yang bersifat kosmis, “bumi” lebih tepat daripada “negeri” atau “tanah”.
- source_word: מוֹסְדֵי הָרִים
  choice: dasar-dasar gunung
  rationale: Ungkapan ini menunjuk pada bagian penopang paling bawah dari gunung. “Dasar-dasar gunung” jelas dan tetap puitis dalam bahasa Indonesia.
- source_word: יִרְגָּזוּ
  choice: gemetar
  rationale: Kata רגז menyatakan getaran atau kegelisahan hebat. “Gemetar” mempertahankan personifikasi puitis terhadap dasar-dasar gunung.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: bergolak
  rationale: Bentuk ini mengulang akar געשׁ dari awal ayat dan menguatkan gambaran gejolak. Pengulangan “bergolak” mempertahankan hubungan puitis tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi pergolakan kosmis. “Sebab” ringkas, alami, dan sesuai dengan laras puisi.
- source_word: חָרָה לוֹ
  choice: murka-Nya menyala
  rationale: Idiom Ibrani ini secara harfiah menggambarkan sesuatu yang menyala pada-Nya dan secara konvensional menyatakan murka. “Murka-Nya menyala” mempertahankan metafora api sekaligus menjelaskan maknanya.
theological_decisions:
- issue: Penggambaran antropopatik tentang murka ilahi
  choice: sebab murka-Nya menyala
  alternative: sebab Ia murka
  rationale: Terjemahan utama mempertahankan metafora Ibrani tentang murka yang menyala tanpa mengurangi kenyataan murka Allah atau menjadikannya sekadar emosi manusia. Alternatif idiomatis dicatat agar maknanya tetap jelas.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. Susunan tiga baris mempertahankan paralelisme Ibrani; pengulangan “bergolak” mencerminkan pengulangan akar געשׁ. Huruf kapital pada “-Nya” mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Allah.
