  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: id
  text: Engkau meluputkan aku dari pertikaian rakyat;[a] Engkau menjadikan aku kepala bangsa-bangsa;[b] suatu bangsa yang tidak kukenal melayani aku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari perselisihan rakyat” atau “dari perbantahan rakyat.” Kata Ibrani dapat merujuk pada pertikaian, perselisihan, atau perbantahan. Dalam teks paralelnya, 2 Samuel 22:44, berbunyi “pertikaian bangsaku.”'
    reason: lexical_and_parallel_textual_note
  - marker: b
    text: 'Atau: “pemimpin bangsa-bangsa.” “Kepala” merupakan metafora Ibrani untuk pemimpin atau penguasa.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “akan melayani aku.” Bentuk kata kerja Ibrani dapat menyatakan tindakan yang menyusul atau berkelanjutan.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: Engkau meluputkan aku
  rationale: Bentuk piel dari פלט menyatakan tindakan aktif melepaskan atau menyelamatkan. “Meluputkan” alami dalam puisi doa dan mempertahankan gambaran pembebasan dari bahaya.
- source_word: מֵרִיבֵי עָם
  choice: dari pertikaian bangsaku
  rationale: רִיב mencakup pertikaian, perselisihan, atau perbantahan. Dalam teks Masoret, עָם tidak memakai sufiks orang pertama, tetapi konteks paralel 2 Samuel 22:44 dan tradisi pembacaan memungkinkan pemahaman “bangsaku”; karena itu ambiguitas dicatat dalam catatan kaki.
- source_word: תְּשִׂימֵנִי
  choice: Engkau menjadikan aku
  rationale: שׂים secara harfiah berarti menaruh atau menempatkan, tetapi dengan pelengkap jabatan לְרֹאשׁ, “menjadikan” merupakan ungkapan Indonesia yang wajar dan tepat.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: kepala bangsa-bangsa
  rationale: רֹאשׁ mempertahankan metafora Ibrani “kepala” untuk pemimpin atau penguasa; גּוֹיִם berarti kelompok-kelompok politik, yaitu bangsa-bangsa, tanpa memasukkan pembedaan teologis yang lebih kemudian.
- source_word: עַם לֹא יָדַעְתִּי
  choice: bangsa yang tidak kukenal
  rationale: עַם adalah nomina kolektif tunggal yang tak tentu. Perfek יָדַעְתִּי dalam klausa relatif menyatakan tidak adanya hubungan atau pengenalan sebelumnya; bahasa Indonesia secara alami memakai “tidak kukenal”.
- source_word: יַעַבְדוּנִי
  choice: melayani aku
  rationale: עבד berarti melayani atau mengabdi. Bentuk imperfek dapat menyatakan tindakan kini, berulang, atau mendatang; bentuk Indonesia tanpa penanda waktu mempertahankan keluasan tersebut.
theological_decisions:
- issue: Cakupan גּוֹיִם dan עַם dalam mazmur kerajaan
  choice: Diterjemahkan dengan istilah politik-kolektif “bangsa-bangsa” dan “bangsa”.
  alternative: Menerjemahkan גּוֹיִם sebagai “bangsa-bangsa bukan Yahudi”.
  rationale: Ayat ini menggambarkan pengangkatan raja atas kelompok-kelompok asing. “Bangsa-bangsa” mencerminkan cakupan teks tanpa memasukkan kategori etnis-teologis yang tidak dinyatakan di sini.
- issue: Nilai waktu יַעַבְדוּנִי
  choice: Memakai “melayani aku” tanpa penanda waktu eksplisit.
  alternative: “akan melayani aku”.
  rationale: Imperfek Ibrani dapat dipahami sebagai tindakan yang menyusul ataupun keadaan yang berciri tetap. Bahasa Indonesia memungkinkan ambiguitas itu dipertahankan tanpa memaksakan kala mendatang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi “Engkau” menandai sapaan langsung kepada Allah. Metafora “kepala” dipertahankan, sedangkan susunan klausa dibuat alami bagi pembaca Indonesia. Semua penanda catatan kaki ditempatkan dalam teks utama.
