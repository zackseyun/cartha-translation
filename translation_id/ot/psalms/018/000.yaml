base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: id
  text: Untuk pemimpin musik. Dari Daud, hamba Yahweh[a], yang mengucapkan kata-kata nyanyian ini kepada Yahweh pada hari ketika Yahweh melepaskannya dari tangan semua musuhnya dan dari tangan Saul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “hamba” juga dapat berarti “budak”; di sini kata itu dipakai sebagai gelar kehormatan bagi Daud dalam hubungannya dengan Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari tangan semua musuhnya dan dari tangan Saul”; “tangan” merupakan ungkapan bagi kuasa atau kendali seseorang.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Istilah ini menunjuk kepada orang yang memimpin pelaksanaan musik atau nyanyian. Pilihan ini alami dalam bahasa Indonesia dan cukup mempertahankan fungsi liturgisnya tanpa membatasi perannya hanya pada paduan suara.
- source_word: לְעֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam judul kehormatan bagi Daud ini, 'hamba' paling sesuai dengan konteks dan ragam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi berhuruf empat dialihaksarakan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְדָוִד
  choice: Mazmur Daud
  rationale: Dalam judul mazmur, konstruksi ini menandai hubungan Daud dengan mazmur tersebut dan secara wajar dapat dinyatakan sebagai 'Mazmur Daud', tanpa menjabarkan lebih jauh jenis hubungannya.
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: yang menyampaikan perkataan nyanyian ini kepada Yahweh
  rationale: Mencerminkan tindakan Daud mengucapkan isi nyanyian itu kepada Yahweh dengan susunan yang alami dan bermartabat.
- source_word: בְּיוֹם הִצִּיל
  choice: ketika ... melepaskannya
  rationale: Ungkapan waktu Ibrani tidak harus menunjuk satu hari kalender tertentu; 'ketika' menyampaikan hubungan waktunya secara alami. נצל di sini berarti membebaskan dari bahaya atau kekuasaan lawan.
- source_word: מִכַּף ... וּמִיַּד
  choice: dari kuasa ... dan dari kuasa
  rationale: Secara harfiah kedua ungkapan menyebut 'tangan', tetapi dalam konteks ini merupakan idiom bagi kuasa atau kendali. Terjemahan maknawi menghindari ungkapan Indonesia yang kaku sambil mempertahankan paralelismenya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi. 'Yahweh' mempertahankan nama tersebut dan merupakan alih aksara ilmiah yang lazim.
- issue: Makna status עֶבֶד bagi Daud
  choice: hamba
  alternative: budak
  rationale: Kata sumber mencakup kedua makna, tetapi di sini berfungsi sebagai sebutan kehormatan yang menyatakan pengabdian Daud kepada Yahweh. Catatan kaki tetap mempertahankan kemungkinan leksikal 'budak'.
- issue: Hubungan לְדָוִד dengan mazmur
  choice: Mazmur Daud
  alternative: Untuk Daud atau milik Daud
  rationale: Preposisi לְ dapat menandai kepengarangan, kepemilikan, persembahan, atau hubungan. Rumusan tradisional dan alami ini mempertahankan asosiasi dengan Daud tanpa menguraikan hubungan itu secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat. Judul dipertahankan ringkas; idiom Ibrani dijelaskan dalam catatan kaki. Semua penanda catatan kaki ditempatkan pada bagian teks yang relevan.
