  yaml_path: translation/ot/psalms/018/045.yaml
  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
translation:
  language: id
  text: Orang-orang asing[a] menjadi layu dan keluar dengan gemetar[b] dari kubu-kubu mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak orang asing”; ungkapan ini dapat juga diterjemahkan “orang-orang asing”.'
    reason: lexical_alternative
  - marker: b
    text: Verba Ibrani yang diterjemahkan “keluar dengan gemetar” jarang dipakai dan maknanya tidak pasti; kemungkinan lain ialah “keluar dengan merendah” atau “keluar dengan langkah timpang”.
    reason: lexical_alternative
  - marker: c
    text: “Kubu-kubu” dapat juga diterjemahkan “benteng-benteng” atau, secara lebih umum, “tempat-tempat tertutup”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: orang-orang asing
  rationale: Ungkapan Ibrani ini secara harfiah berbunyi ‘anak-anak keasingan/orang asing’, tetapi sebagai idiom menunjuk kepada orang-orang asing. Terjemahan ini menyampaikan maknanya secara alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יִבֹּלוּ
  choice: menjadi layu
  rationale: Bentuk Qal dari נבל biasanya berarti ‘layu, merana, memudar’. Ungkapan ‘menjadi layu’ mempertahankan gambaran puitis tentang musuh yang kehilangan daya tanpa memindahkan unsur kegentaran dari verba berikutnya.
- source_word: וְיַחְרְגוּ
  choice: keluar dengan gemetar
  rationale: Verba חרג jarang dipakai dan maknanya tidak sepenuhnya pasti. Dalam konteks militer-puitis ini, verba tersebut kemungkinan menggambarkan orang yang keluar dalam ketakutan atau keguncangan; ketidakpastiannya dipertahankan dalam catatan kaki.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: dari kubu-kubu mereka
  rationale: Nomina ini menunjuk pada tempat tertutup atau terkurung. Dalam konteks musuh yang ditaklukkan, ‘kubu-kubu’ secara alami menyampaikan tempat pertahanan, tanpa mengunci maknanya pada penjara.
