translation:
  language: id
  text: Aku meremukkan mereka hingga halus seperti debu di hadapan angin[a][b]; seperti lumpur di jalan-jalan, Aku membuang mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku menggiling mereka seperti debu di hadapan angin.” Kata kerja Ibrani dapat berarti menggiling atau menghancurkan sampai halus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di atas permukaan angin,” suatu ungkapan Ibrani yang menggambarkan debu yang dibawa atau dihamburkan angin.
    reason: lexical_alternative
  - marker: c
    text: Atau, “seperti lumpur di jalan-jalan, Aku mengosongkan mereka” atau “Aku menumpahkan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Aku meremukkan mereka hingga menjadi
  rationale: Bentuk Qal dari שׁחק dengan akhiran orang ketiga jamak menyatakan tindakan menghancurkan atau menggiling sampai halus. ‘Meremukkan ... hingga menjadi’ menyampaikan hasil penghancuran itu secara alami dalam bahasa Indonesia tanpa menghilangkan gambaran debu.
- source_word: כְּעָפָר
  choice: seperti debu
  rationale: עָפָר lazim berarti debu atau tanah gembur. ‘Debu’ paling sesuai dengan gambaran musuh yang telah diremukkan hingga halus.
- source_word: עַל־פְּנֵי רוּחַ
  choice: yang diterbangkan angin
  rationale: Ungkapan harfiahnya, ‘di atas permukaan angin,’ menggambarkan debu yang dibawa atau dihamburkan angin. Bentuk ini mengungkapkan maksud idiom Ibrani secara jelas dan alami.
- source_word: כְּטִיט חוּצוֹת
  choice: seperti lumpur di jalan-jalan
  rationale: טִיט berarti lumpur atau tanah becek, sedangkan חוּצוֹת menunjuk pada jalan-jalan atau tempat-tempat terbuka. Terjemahan ini mempertahankan gambaran kehinaan dan penginjakan.
- source_word: אֲרִיקֵם
  choice: aku menumpahkan mereka
  rationale: Bentuk Hifil dari ריק berarti mengosongkan atau menumpahkan. ‘Menumpahkan mereka’ mempertahankan metafora cairan dan selaras dengan gambaran lumpur.
