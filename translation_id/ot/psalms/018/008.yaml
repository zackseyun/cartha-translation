base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: id
  text: Asap membubung dari lubang hidung-Nya[a], dan dari mulut-Nya keluar api yang melalap; bara menyala dari-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam murka-Nya.” Kata Ibrani אַף dapat berarti “hidung/lubang hidung” atau, sebagai ungkapan, “murka.” Di sini, kesejajarannya dengan “dari mulut-Nya” mendukung gambaran konkret.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: membubung
  rationale: Verba Qal ini berarti ‘naik’. Untuk asap, ‘membubung’ menyampaikan gerak ke atas secara alami dan puitis.
- source_word: עָשָׁן
  choice: asap
  rationale: Padanan langsung yang sesuai dengan gambaran teofani dalam ayat ini.
- source_word: בְּאַפּוֹ
  choice: dari lubang hidung-Nya
  rationale: אַף dapat berarti ‘hidung/lubang hidung’ atau secara idiomatis ‘murka’. Kesejajarannya dengan ‘dari mulut-Nya’ mendukung gambaran tubuh yang konkret; ‘dari’ menyatakan sumber asap secara alami dalam bahasa Indonesia.
- source_word: וְאֵשׁ
  choice: dan api
  rationale: Padanan langsung yang mempertahankan kesejajaran antarklausa.
- source_word: מִפִּיו
  choice: dari mulut-Nya
  rationale: Padanan langsung yang mempertahankan gambaran antropomorfis dalam puisi teofani ini.
- source_word: תֹּאכֵל
  choice: melalap
  rationale: Bentuk verbal ini secara harfiah berarti ‘memakan’ dan dalam konteks api berarti ‘melalap’. Pilihan ini mempertahankan daya aktif verba Ibrani, bukan mengubahnya menjadi kata sifat.
- source_word: גֶּחָלִים
  choice: bara
  rationale: Kata ini menunjuk pada arang atau bara yang sedang menyala; ‘bara’ ringkas dan alami dalam puisi Indonesia.
- source_word: בָּעֲרוּ
  choice: menyala
  rationale: Verba ini menyatakan keadaan terbakar atau berkobar. ‘Menyala’ tepat bagi bara dan tidak menambahkan intensitas yang tidak wajib.
- source_word: מִמֶּנּוּ
  choice: dari-Nya
  rationale: Preposisi מִן dengan pronomina paling langsung berarti ‘dari Dia’. Bentuk ini mempertahankan gambaran bahwa bara berasal dari hadirat-Nya tanpa memperinci mekanismenya.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah dalam mazmur teofani
  choice: Mempertahankan gambaran konkret ‘lubang hidung-Nya’ dan ‘mulut-Nya’
  alternative: Menafsirkan אַף secara idiomatis sebagai ‘murka-Nya’ dan mengabstrakkan gambaran tubuh
  rationale: Puisi ini dengan sengaja menggambarkan penampakan ilahi melalui citra tubuh. Kesejajaran antara hidung dan mulut menguatkan pembacaan konkret, sedangkan catatan kaki tetap mempertahankan kemungkinan makna ‘murka’.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Bentuk pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman ejaan religius Indonesia. Susunan tiga klausa dipertahankan untuk menjaga gerak dan kesejajaran puisi Ibrani.
