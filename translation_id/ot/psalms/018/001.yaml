lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol dengan אמר melanjutkan tuturan dari judul mazmur dalam teks Ibrani. Terjemahan eksplisit mempertahankan susunan WLC tanpa menyesuaikannya dengan tradisi penomoran ayat lain.
- source_word: אֶרְחָמְךָ
  choice: Aku mengasihi-Mu
  rationale: Kata kerja רחם mengandung nuansa belas kasih dan kasih sayang yang lembut. Ketika ditujukan kepada Allah, 'mengasihi' menyampaikan maksud devosional secara alami tanpa menyiratkan bahwa pemazmur mengasihani Allah; nuansa leksikalnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: חִזְקִי
  choice: kekuatanku
  rationale: Nomina dengan sufiks orang pertama tunggal ini secara alami menyatakan bahwa Yahweh adalah kekuatan atau sumber daya pemazmur; 'kekuatanku' ringkas, wajar, dan dekat dengan bentuk sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Daya makna רחם ketika ditujukan kepada Allah
  choice: Aku mengasihi-Mu
  alternative: Aku menyayangi-Mu dengan lembut / Aku berbelas kasih kepada-Mu
  rationale: Makna dasarnya berkaitan dengan belas kasih atau kasih sayang yang lembut, tetapi dalam sapaan kepada Allah ungkapan ini menyatakan kasih yang mendalam, bukan rasa iba. Terjemahan utama dibuat idiomatis, sedangkan ketegangan leksikal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan khidmat. Bentuk 'ia' mempertahankan subjek orang ketiga dalam formula pengantar, sedangkan sapaan langsung memakai 'Aku' dan '-Mu'. Partikel 'ya' membuat vokatif alami dalam bahasa Indonesia.
