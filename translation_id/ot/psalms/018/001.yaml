  text: Dan ia berkata[a], “Aku mengasihi-Mu, ya Yahweh, kekuatanku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini mengandung nuansa kasih sayang yang lembut dan juga dapat dikaitkan dengan belas kasih. Dalam konteks ini, kata itu mengungkapkan kasih yang mendalam kepada Yahweh.
