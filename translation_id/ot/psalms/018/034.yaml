  yaml_path: translation/ot/psalms/018/034.yaml
  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: id
  text: Ia melatih tanganku untuk berperang, dan lenganku sanggup menekukkan busur perunggu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “busur perunggu ditekukkan oleh lenganku.” Klausa Ibrani ini sulit dan dapat dipahami dalam arti pasif.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: melatih
  rationale: Partisipel dari למד dapat berarti ‘mengajar’ atau ‘melatih’. Dalam konteks perang, ‘melatih’ secara alami menyatakan pembekalan keterampilan praktis.
- source_word: יָדַי
  choice: tanganku
  rationale: Bentuk Ibrani secara harfiah berarti ‘kedua tanganku’ atau ‘tangan-tanganku’; bahasa Indonesia lazim memakai bentuk tunggal kolektif ‘tanganku’ untuk anggota tubuh berpasangan.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: מלחמה berarti perang atau pertempuran. Frasa verbal ‘untuk berperang’ alami sesudah ‘melatih tanganku’ dan mempertahankan konteks militer.
- source_word: וְנִחֲתָה
  choice: mampu melenturkan
  rationale: Bentuk dan konstruksi klausa ini sulit. Terjemahan ini mengungkapkan kemampuan yang dihasilkan oleh pembekalan ilahi sambil menempatkan terjemahan pasif yang lebih formal dalam catatan kaki.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: busur perunggu
  rationale: קשת adalah busur sebagai senjata, sedangkan נחושה menunjuk pada tembaga atau perunggu; ‘perunggu’ sesuai dengan gambaran senjata yang sangat kuat.
- source_word: זְרוֹעֹתָי
  choice: lenganku
  rationale: Bentuk Ibrani jamak dipertahankan secara idiomatis dengan bentuk tunggal kolektif Indonesia ‘lenganku’, yang wajar untuk anggota tubuh berpasangan.
theological_decisions:
- issue: Penafsiran klausa sulit וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי
  choice: lenganku mampu melenturkan busur perunggu
  alternative: busur perunggu dilenturkan oleh lenganku
  rationale: Bacaan utama menyampaikan kemampuan yang dikaruniakan Allah dan cocok dengan paralelisme tentang persiapan untuk berperang. Namun, karena susunan Ibraninya padat dan secara formal dapat dipahami sebagai pasif, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. ‘Ia’ mempertahankan subjek ilahi dari konteks tanpa menambahkan nama; ‘melenturkan’ dipilih karena lebih tepat bagi tindakan menarik busur yang sangat kuat daripada sekadar ‘membengkokkan’.
