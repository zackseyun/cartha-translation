  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: id
  text: Terhadap orang yang murni, Engkau menunjukkan diri-Mu murni, dan terhadap orang yang bengkok, Engkau menunjukkan diri-Mu berliku-liku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Engkau menunjukkan diri-Mu cerdik” atau “Engkau mengakali orang yang bengkok.” Bahasa Ibrani memakai permainan kata timbal balik: Allah menghadapi orang bengkok dengan cara yang menandingi dan menggagalkan kebengkokan mereka, bukan berarti Ia menjadi bengkok secara moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: orang yang murni
  rationale: Kata sifat ini menyatakan kemurnian atau kebersihan moral. Pilihan “murni” alami dalam bahasa Indonesia dan mempertahankan permainan akar kata dengan verba berikutnya.
- source_word: תִּתְבָּרָר
  choice: Engkau menunjukkan diri-Mu murni
  rationale: 'Bentuk hitpael dari ברר di sini bersifat refleksif atau resultatif: Allah menyatakan diri-Nya sebagai murni dalam hubungan-Nya dengan orang yang murni. Ungkapan ini juga mempertahankan pengulangan puitis murni/murni.'
- source_word: עִקֵּשׁ
  choice: orang yang bengkok
  rationale: Kata ini menggambarkan pribadi yang menyimpang atau bengkok secara moral. “Bengkok” mempertahankan metafora jasmani yang dipakai untuk watak moral.
- source_word: תִּתְפַּתָּל
  choice: Engkau menunjukkan diri-Mu berliku-liku
  rationale: Bentuk hitpael dari פתל menggambarkan tindakan yang memutar atau berliku sebagai tanggapan terhadap orang bengkok. “Berliku-liku” menjaga kesejajaran dan daya kejut teks Ibrani tanpa langsung menyamakan Allah dengan kebengkokan moral.
theological_decisions:
- issue: Gambaran antropomorfis tentang tanggapan Allah kepada orang bengkok
  choice: Mempertahankan ungkapan kuat “Engkau menunjukkan diri-Mu berliku-liku” dalam teks utama.
  alternative: Engkau menunjukkan diri-Mu cerdik; Engkau memperdaya orang yang bengkok
  rationale: 'Ayat ini memakai timbal balik puitis: Allah memperlakukan manusia dengan cara yang sepadan dengan watak mereka sekaligus menggagalkan kebengkokan mereka. Terjemahan yang lebih lunak akan mengurangi kesejajaran sengaja antara murni/murni dan bengkok/berliku-liku. Catatan kaki mencegah ungkapan ini dipahami sebagai kebengkokan moral dalam diri Allah.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis. Sapaan ilahi memakai huruf kapital. Pasangan “murni/murni” dan “bengkok/berliku-liku” mempertahankan kesejajaran, metafora, serta ketegangan teologis teks sumber.
