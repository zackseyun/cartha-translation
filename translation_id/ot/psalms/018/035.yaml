base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/035.yaml
  text: You gave me the shield of your salvation[a], and your right hand supported me, and your humility made me great.
translation:
  language: id
  text: Engkau memberiku perisai keselamatan-Mu; tangan kanan-Mu menopang aku, dan kerendahan hati-Mu[a] membuatku besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kelembutan-Mu.” Kata Ibrani yang dipakai dapat berarti kerendahan hati, kelemahlembutan, atau kelembutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Engkau memberiku
  rationale: Bentuk wayyiqtol Qal dari נתן menyatakan tindakan lampau dalam syair ucapan syukur. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan Allah sebagai pelaku.
- source_word: מָגֵן יִשְׁעֶךָ
  choice: perisai keselamatan-Mu
  rationale: Frasa konstruksi ini dipertahankan secara dekat untuk menjaga citra perisai dan cakupan makna יֵשַׁע, yang dapat menunjuk pada keselamatan maupun pembebasan.
- source_word: וִימִינְךָ
  choice: tangan kanan-Mu
  rationale: Terjemahan harfiah mempertahankan gambaran Ibrani tentang kekuatan dan pertolongan aktif Allah.
- source_word: תִסְעָדֵנִי
  choice: menopang aku
  rationale: Kata סעד berarti menopang atau menyokong. 'Menopang aku' jelas, wajar, dan sesuai dengan paralelisme pertolongan ilahi.
- source_word: וְעַנְוַתְךָ
  choice: kerendahan hati-Mu
  rationale: Kata ini dapat menyatakan kerendahan hati, kelemahlembutan, atau kelembutan. Pilihan utama mempertahankan ungkapan sumber yang mengejutkan mengenai Allah, tanpa meredakan ketegangan teologisnya.
- source_word: תַרְבֵּנִי
  choice: membuat aku besar
  rationale: Bentuk Hifil dari רבה berarti membuat besar atau memperbesar. Terjemahan ini dekat dengan teks dan tidak mempersempit maknanya menjadi sekadar meninggikan kedudukan.
theological_decisions:
- issue: Penyifatan וְעַנְוַתְךָ kepada Allah
  choice: kerendahan hati-Mu
  alternative: kelembutan-Mu
  rationale: Bahasa Ibrani memungkinkan kedua pengertian tersebut. Teks utama mempertahankan gagasan yang mencolok tentang kerendahan hati Allah—Allah merendahkan diri untuk menolong pemazmur—sedangkan alternatif yang sah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pronomina ilahi memakai huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Citra konkret 'perisai' dan 'tangan kanan' dipertahankan.
