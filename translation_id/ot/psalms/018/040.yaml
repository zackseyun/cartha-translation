  yaml_path: translation/ot/psalms/018/040.yaml
  text: You gave me the backs of my enemies[a]; I destroyed those who hated me.
translation:
  language: id
  text: Engkau membuat musuh-musuhku berbalik dan melarikan diri[a]; aku membinasakan orang-orang yang membenciku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Engkau memberikan kepadaku tengkuk musuh-musuhku,” sebuah ungkapan yang menggambarkan musuh berbalik dalam pelarian atau kekalahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan alami bagi אֹיֵב dengan akhiran orang pertama tunggal dan mempertahankan makna permusuhan.
- source_word: נָתַתָּה לִּי
  choice: Engkau membuat ... membelakangiku
  rationale: Secara harfiah berarti 'Engkau memberikan kepadaku', tetapi bersama עֹרֶף membentuk ungkapan tentang musuh yang berbalik melarikan diri; terjemahan ini menyampaikan fungsi idiom tersebut secara alami.
- source_word: עֹרֶף
  choice: berbalik membelakangiku
  rationale: עֹרֶף secara harfiah berarti 'tengkuk' atau 'belakang leher'. Dalam konteks ini gambarnya ialah musuh yang membelakangi pemazmur karena dipukul mundur.
- source_word: וּמְשַׂנְאַי
  choice: orang-orang yang membenci aku
  rationale: Mewakili bentuk partisipel dari שׂנא beserta akhiran orang pertama tunggal secara jelas dan wajar dalam bahasa Indonesia.
- source_word: אַצְמִיתֵם
  choice: aku membinasakan
  rationale: Bentuk hifil dari צמת menyatakan tindakan menyebabkan binasa atau memusnahkan; 'membinasakan' mempertahankan kekuatan verba tanpa menambah unsur yang tidak ada.
theological_decisions:
- issue: Gambaran idiomatis עֹרֶף tentang kekalahan musuh
  choice: Dinyatakan sebagai 'membuat musuh-musuhku berbalik membelakangiku', dengan catatan tentang gambaran harfiahnya.
  alternative: Engkau menyerahkan tengkuk musuh-musuhku kepadaku.
  rationale: Ungkapan Ibrani menggambarkan musuh yang berbalik dalam pelarian atau kekalahan. Terjemahan utama menjelaskan daya idiomnya, sedangkan catatan kaki mempertahankan citra konkret dan ambiguitas leksikal teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'Engkau' mempertahankan sapaan langsung kepada Allah tanpa menambahkan nama atau sebutan yang tidak terdapat dalam ayat.
