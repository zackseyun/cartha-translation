  source_fidelity: 'Teks Ibrani menyatakan, secara harfiah, bahwa lawan diberi “tengkuk” kepada pemazmur—citra musuh yang berbalik dalam pelarian atau kekalahan—lalu pemazmur membinasakan mereka yang membencinya. Terjemahan utama sebaiknya menyampaikan fungsi idiom ini tanpa mengubah relasi tindakan: Engkau sebagai subjek, musuh sebagai pihak yang melarikan diri, dan aku sebagai subjek verba kedua.'
