  text: Dari sinar di hadapan-Nya, awan-awan-Nya berlalu—hujan es dan bara api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “awan-awan-Nya yang tebal berlalu; hujan es dan bara api.” Bahasa Ibraninya padat dan sangat puitis, sehingga gambaran badainya dapat diungkapkan dengan susunan yang sedikit berbeda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Dari cahaya terang
  rationale: 'נֹגַהּ menyatakan cahaya atau sinar terang; frasa ini alami dalam bahasa Indonesia dan prefiks מִן dipertahankan sebagai penanda asal: “dari”.'
- source_word: נֶגְדּוֹ
  choice: di hadapan-Nya
  rationale: נֶגֶד dengan sufiks orang ketiga maskulin tunggal bermakna “di hadapan-Nya” atau “di depan-Nya”; pilihan ini mempertahankan nuansa ruang secara wajar.
- source_word: עָבָיו
  choice: awan-awan-Nya
  rationale: Kata ini menunjuk pada gumpalan awan atau awan tebal. “Awan-awan-Nya” mempertahankan sufiks kepunyaan dan keringkasan puisi tanpa menambahkan tafsiran.
- source_word: עָבְרוּ
  choice: berlalu
  rationale: Bentuk Qal jamak dari עבר dapat berarti lewat, melintas, atau berlalu. “Berlalu” cocok dengan gerak awan dan tidak menentukan arah secara berlebihan.
- source_word: בָּרָד
  choice: hujan es
  rationale: Padanan meteorologis baku dan jelas dalam bahasa Indonesia.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: dan bara api
  rationale: Frasa konstruksi ini secara harfiah berarti “bara-bara api”; “bara api” alami, ringkas, dan mempertahankan gambaran puitisnya.
theological_decisions:
- issue: Gambaran puitis teofani dalam badai
  choice: Mempertahankan gambaran sebagai pelukisan penampakan ilahi tanpa mereduksinya menjadi metafora belaka atau memperluasnya menjadi pernyataan doktrinal.
  alternative: Menafsirkannya semata-mata sebagai bahasa kiasan untuk kemenangan militer, atau menjelaskannya secara eksplisit sebagai mukjizat meteorologis harfiah.
  rationale: Ayat ini menggunakan puisi badai yang padat untuk menggambarkan tampilnya TUHAN. Terjemahan mempertahankan ketegangan antara gambaran harfiah dan kiasan tanpa memutuskannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Tanda pisah mempertahankan kepadatan serta peralihan tajam dalam baris Ibrani; kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
