  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: id
  text: Yahweh memperlakukan aku sesuai dengan kebenaranku[a]; sesuai dengan kebersihan tanganku[b], Ia memberi balasan kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yahweh memberi aku ganjaran sesuai dengan kebenaranku.”'
    reason: lexical_alternative
  - marker: b
    text: “Kebersihan tanganku” adalah ungkapan Ibrani bagi perilaku yang tidak bersalah atau lurus.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: memperlakukan aku
  rationale: Kata גמל dapat berarti memperlakukan seseorang sesuai dengan perbuatannya, termasuk memberi ganjaran. Pilihan ini mempertahankan keluasan maknanya, sedangkan kesejajaran dengan klausa kedua menunjukkan pembalasan yang positif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: כְּצִדְקִי
  choice: sesuai dengan kebenaranku
  rationale: צדק di sini menunjuk pada kelurusan atau perilaku benar pemazmur dalam konteksnya. Frasa ini dipertahankan secara langsung agar ketegangan teologis teks tidak dihilangkan.
- source_word: כְּבֹר יָדַי
  choice: sesuai dengan kebersihan tanganku
  rationale: Terjemahan konkret ini mempertahankan gambaran Ibrani tentang tangan yang bersih sebagai ungkapan bagi perilaku yang tidak bersalah atau lurus.
- source_word: יָשִׁיב לִי
  choice: Ia membalas kepadaku
  rationale: Bentuk kausatif שוב dalam ungkapan ini menyampaikan pembalasan atau pemberian kembali yang sepadan dengan perilaku seseorang, serta mengimbangi klausa pertama.
theological_decisions:
- issue: Pernyataan “kebenaranku” dapat disalahpahami sebagai kesempurnaan tanpa dosa atau keselamatan karena jasa.
  choice: 'Mempertahankan klaim orang pertama secara lugas: “kebenaranku”.'
  alternative: ketidakbersalahanku; perkaraku yang benar
  rationale: Teks Ibrani secara eksplisit memakai bentuk posesif orang pertama. Dalam konteks mazmur, klaim ini menyangkut integritas dan pembenaran pemazmur dalam perkara yang dihadapi, tanpa harus diubah untuk meniadakan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan kesejajaran antarklausa dipertahankan. Kata ganti bagi Yahweh ditulis “Ia” sesuai gaya hormat, tanpa mengubah makna sumber.
