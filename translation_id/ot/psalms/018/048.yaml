  text: מְפַלְּטִ֗/י מֵ/אֹ֫יְבָ֥/י אַ֣ף מִן קָ֭מַ/י תְּרוֹמְמֵ֑/נִי מֵ/אִ֥ישׁ חָ֝מָ֗ס תַּצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/048.yaml
  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: id
  text: Engkaulah yang meluputkan aku dari musuh-musuhku[a]; bahkan Engkau mengangkat aku lebih tinggi daripada mereka yang bangkit melawan aku[b]; Engkau menyelamatkan aku dari orang yang melakukan kekerasan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Penyelamatku dari musuh-musuhku.” Bentuk Ibraninya adalah partisip yang dipakai sebagai sebutan bagi Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Engkau meninggikan aku di atas mereka yang bangkit melawan aku.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dari seorang laki-laki/orang kekerasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: Engkaulah yang meluputkan aku
  rationale: Bentuk partisip dengan akhiran orang pertama tunggal berfungsi sebagai sebutan bagi Allah. Ungkapan ini mempertahankan sifat partisipialnya sekaligus membuat sapaan langsung terasa alami dalam bahasa Indonesia.
- source_word: מֵאֹיְבַי
  choice: dari musuh-musuhku
  rationale: Menerjemahkan secara langsung preposisi, nomina jamak, dan akhiran orang pertama tunggal.
- source_word: אַף
  choice: bahkan
  rationale: Kata ini memberi penegasan dan peningkatan pada klausa berikutnya, bukan sekadar menghubungkannya.
- source_word: מִן קָמַי
  choice: lebih tinggi daripada mereka yang bangkit melawan aku
  rationale: Bentuk partisip jamak קום menunjuk kepada para lawan yang bangkit menentang pemazmur. Bersama kata kerja רום, preposisi מן paling wajar dipahami secara komparatif.
- source_word: תְּרוֹמְמֵנִי
  choice: Engkau mengangkat aku lebih tinggi
  rationale: Mempertahankan gambaran vertikal dari akar רום serta menyatakan tindakan Allah meninggikan pemazmur di atas para lawannya.
- source_word: מֵאִישׁ חָמָס
  choice: dari orang yang melakukan kekerasan
  rationale: Ungkapan ini mempertahankan acuan tunggal dan makna חָמָס sebagai kekerasan atau tindakan aniaya tanpa memakai susunan harfiah yang kaku dalam bahasa Indonesia.
- source_word: תַּצִּילֵנִי
  choice: Engkau menyelamatkan aku
  rationale: נצל berarti melepaskan atau menyelamatkan dari bahaya. Pilihan ini tetap membedakannya secara leksikal dari פלט yang diterjemahkan 'meluputkan'.
theological_decisions:
- issue: Acuan dan bentuk sapaan pada partisip pembuka ayat
  choice: 'Ayat ini menyapa Allah secara langsung: ''Engkaulah yang meluputkan aku ... Engkau mengangkat ... Engkau menyelamatkan.'''
  alternative: Partisip pembuka dapat dihaluskan menjadi klausa relatif yang dihubungkan dengan ayat sebelumnya.
  rationale: Bahasa Ibrani secara wajar bergerak dari partisip substantival sebagai sebutan bagi Allah ke kata-kata kerja orang kedua. Sapaan langsung mempertahankan susunan puitis itu.
- issue: Penerjemahan אִישׁ dalam ungkapan אִישׁ חָמָס
  choice: orang yang melakukan kekerasan
  alternative: laki-laki yang melakukan kekerasan; pelaku kekerasan
  rationale: Dalam konteks ini אִישׁ menunjuk kepada seorang penindas tunggal. 'Orang' merupakan padanan Indonesia yang alami dan tidak menghapus ketunggalannya, sedangkan 'laki-laki' akan memberi penekanan gender yang tidak diperlukan oleh maksud ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi kata ganti bagi Allah dipakai secara konsisten dalam ayat ini. Pilihan 'meluputkan' dan 'menyelamatkan' mempertahankan perbedaan dua verba Ibrani tanpa menghasilkan ungkapan yang sukar dipahami.
