  text: I crush them[a], and they cannot rise[b]; they fall beneath my feet.
translation:
  language: id
  text: Aku meremukkan mereka[a], dan mereka tidak dapat bangkit[b]; mereka jatuh di bawah kakiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghancurkan mereka” atau “memukul mereka hingga roboh”; kata Ibrani ini menggambarkan tindakan meremukkan dengan keras dalam pertempuran.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka tidak dapat berdiri”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: Aku meremukkan mereka
  rationale: Kata kerja מחץ menyatakan tindakan menghancurkan atau meremukkan dengan keras dalam pertempuran. “Meremukkan” mempertahankan daya kekerasan gambaran Ibrani dan terdengar wajar dalam bahasa Indonesia.
- source_word: וְלֹא יֻכְלוּ
  choice: sehingga mereka tidak sanggup
  rationale: Secara bentuk berarti “dan mereka tidak mampu”. Dalam konteks akibat dari tindakan sebelumnya, “sehingga” menyampaikan hubungan kalimat secara alami tanpa mengubah maknanya.
- source_word: קוּם
  choice: bangkit
  rationale: קוּם dapat berarti bangkit atau berdiri. “Bangkit” mempertahankan gambaran orang yang telah dijatuhkan dan tidak mampu bangun kembali.
- source_word: יִפְּלוּ
  choice: mereka jatuh
  rationale: Terjemahan langsung dari נפל yang mempertahankan paralelisme tindakan dan akibat dalam baris puitis.
- source_word: תַּחַת רַגְלָי
  choice: di bawah kakiku
  rationale: Ungkapan ruang yang harfiah dan alami dalam bahasa Indonesia serta mempertahankan gambaran kekalahan total.
theological_decisions:
- issue: Gambaran kekerasan dalam pertempuran pada mazmur kerajaan
  choice: Mempertahankan bahasa perang orang pertama tanpa memperhalusnya
  alternative: Menggunakan ungkapan yang kurang keras seperti “mengalahkan” atau “menundukkan”
  rationale: Teks Ibrani secara jelas memakai gambaran meremukkan dan jatuh. Kekuatan bahasa sumber perlu dipertahankan tanpa memasukkan penilaian teologis tambahan atau mengaburkan konteks peperangan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan register puitis yang lugas dan bermartabat. Pronomina “Aku” sesuai dengan suara orang pertama dalam mazmur; gambaran perang dipertahankan secara konkret.
