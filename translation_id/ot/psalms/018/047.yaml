  text: the God who gives vengeance to me and subdues peoples under me[a][b].
translation:
  language: id
  text: Allah yang mengadakan pembalasan[a] bagiku dan menundukkan[b] bangsa-bangsa di bawahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tindakan-tindakan pembalasan”; kata Ibrani yang digunakan berbentuk jamak dengan makna abstrak atau intensif.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja ini secara tradisional dipahami sebagai “menundukkan” atau “membawa ke bawah kekuasaan”, bukan “berbicara”, meskipun bentuknya berkaitan dengan kata kerja Ibrani yang umum untuk “berbicara”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Allah
  rationale: Kata sandang tertentu melekat pada אֵל, tetapi dalam bahasa Indonesia nama ilahi “Allah” secara alami sudah tentu; bentuk seperti “sang Allah” akan terasa tidak wajar dalam konteks ini.
- source_word: הַנּוֹתֵן
  choice: yang memberikan
  rationale: Partisipel ini menerangkan Allah sebagai pelaku yang terus dikenali melalui tindakan tersebut. Klausa relatif “yang memberikan” alami dalam bahasa Indonesia dan mempertahankan bentuk deskriptif sumber.
- source_word: נְקָמוֹת
  choice: pembalasan
  rationale: Nomina Ibrani berbentuk jamak, tetapi dapat berfungsi secara abstrak atau intensif. Bentuk tunggal kolektif “pembalasan” paling alami dalam bahasa Indonesia tanpa melemahkan makna tindakan membalas.
- source_word: לִי
  choice: kepadaku
  rationale: Preposisi לְ menandai penerima atau pihak yang memperoleh manfaat. “Kepadaku” mempertahankan susunan metaforis teks, walaupun nuansa “bagiku” juga mungkin.
- source_word: וַיַּדְבֵּר
  choice: dan menundukkan
  rationale: Dalam bentuk dan konteks kemenangan kerajaan ini, verba tersebut bermakna membawa ke bawah kuasa atau menaklukkan, bukan “berbicara”. Bentuk kini sesuai dengan rangkaian deskriptif mengenai Allah dalam ayat ini.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak עַמִּים menunjuk kepada berbagai kelompok bangsa. “Bangsa-bangsa” merupakan padanan Indonesia yang alami dan mempertahankan kemajemukannya.
- source_word: תַּחְתָּי
  choice: di bawahku
  rationale: Terjemahan ini mempertahankan metafora ruang dalam bahasa Ibrani; dalam konteks verba “menundukkan”, makna ketundukan politis atau militer sudah jelas.
theological_decisions:
- issue: Bahasa tentang pembalasan ilahi
  choice: Mempertahankan “pembalasan” sebagai tindakan retributif Allah yang diberikan kepada atau dilakukan demi pemazmur.
  alternative: Pembelaan atau pemulihan hak
  rationale: נְקָמוֹת secara langsung menyatakan pembalasan atau tindakan-tindakan membalas. Padanan yang lebih lunak akan mengurangi daya ungkap teks. Terjemahan tidak menambahkan penjelasan doktrinal tentang sifat atau batas pembalasan tersebut.
- issue: Hubungan tindakan Allah dengan kemenangan raja
  choice: Mempertahankan gambaran bahwa Allah menundukkan bangsa-bangsa di bawah pemazmur.
  alternative: Menafsirkan ungkapan secara rohani atau universal
  rationale: Teks memakai bahasa konkret tentang bangsa-bangsa yang ditempatkan di bawah pemazmur. Terjemahan mempertahankan latar kemenangan kerajaan tanpa memperluasnya menjadi klaim teologis yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. “Allah” dipakai secara alami tanpa menerjemahkan kata sandang Ibrani secara kaku. Susunan paralel dipertahankan, begitu pula metafora “di bawahku”. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
