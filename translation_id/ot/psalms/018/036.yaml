translation:
  language: id
  text: Engkau memberi tempat yang lapang bagi langkahku[a], dan pergelangan kakiku tidak goyah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Engkau melapangkan langkahku di bawahku.” Ungkapan Ibrani ini menggambarkan Allah memberi ruang yang luas dan pijakan yang aman bagi pemazmur.
    reason: idiomatic_rendering
  - marker: b
    text: Atau, “pergelangan kakiku tidak tergelincir.” Dalam ungkapan yang lebih umum, maksudnya dapat dinyatakan sebagai “kakiku tidak tergelincir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: Engkau melapangkan
  rationale: Bentuk kausatif dari רחב berarti membuat lebar atau lapang. “Melapangkan” mempertahankan gagasan pemberian ruang yang luas dan wajar dalam bahasa Indonesia.
- source_word: צַעֲדִי
  choice: langkahku
  rationale: Nomina ini berbentuk tunggal dengan sufiks orang pertama dan berarti “langkahku” atau “jejak langkahku”. Pilihan ini mempertahankan objek dan citra teks Ibrani tanpa menggantinya dengan “tanah” atau “jalan”.
- source_word: תַחְתָּי
  choice: di bawahku
  rationale: Preposisi ini secara spasial berarti “di bawahku”. Ungkapan tersebut dipertahankan agar gambaran Ibrani tentang ruang dan pijakan tidak hilang.
- source_word: וְלֹא מָעֲדוּ
  choice: dan ... tidak tergelincir
  rationale: Konstruksi ini merupakan klausa koordinatif dengan negasi. Verba מעד menggambarkan tergelincir, goyah, atau kehilangan pijakan.
- source_word: קַרְסֻלָּי
  choice: pergelangan kakiku
  rationale: Nomina ini menunjuk secara khusus pada pergelangan kaki atau tulang pergelangan kaki; terjemahan spesifik mempertahankan citra tubuh yang hidup.
