  text: יְקַדְּמ֥וּ/נִי בְ/יוֹם אֵידִ֑/י וַֽ/יְהִי יְהוָ֖ה לְ/מִשְׁעָ֣ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/018.yaml
  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: id
  text: Mereka menghadang aku pada hari malapetakaku[a], tetapi Yahweh adalah penopangku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mereka mendatangi aku” atau “Mereka menemui aku” pada hari malapetakaku.
    reason: Alternatif leksikal bagi יְקַדְּמוּנִי, yang pada dasarnya dapat berarti mendatangi atau menemui, sementara konteksnya menunjukkan nuansa permusuhan.
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: Mereka menghadang aku
  rationale: Bentuk Piel dari קדם dengan akhiran orang pertama tunggal berarti mereka mendatangi atau menemui aku. Dalam konteks bermusuhan, “menghadang” menyampaikan pertemuan yang bersifat menentang tanpa mempersempitnya menjadi serangan militer tertentu.
- source_word: בְיוֹם אֵידִי
  choice: pada hari malapetakaku
  rationale: Frasa temporal בְּיוֹם diterjemahkan secara alami sebagai “pada hari”, sedangkan אֵידִי menunjuk pada malapetaka atau bencana yang menimpa pemazmur.
- source_word: וַיְהִי
  choice: tetapi ... menjadi
  rationale: Kata penghubung diterjemahkan secara adversatif untuk menampilkan kontras dengan tindakan para musuh; היה tetap dipertahankan dengan makna “menjadi”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: לְמִשְׁעָן לִי
  choice: menjadi penopangku
  rationale: מִשְׁעָן adalah sesuatu yang dijadikan sandaran atau penopang. Bentuk dengan לִי dinyatakan secara idiomatis dalam bahasa Indonesia melalui akhiran posesif “-ku”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi; “Yahweh” mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan mudah dipahami. “Malapetaka” mempertahankan bobot puitis אֵיד, sedangkan “penopangku” menjaga metafora tentang sesuatu atau seseorang yang menjadi sandaran.
