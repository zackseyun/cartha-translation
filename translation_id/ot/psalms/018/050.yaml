id: PSA.18.50
reference: Psalms 18:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: id
  text: Ia memberikan kemenangan-kemenangan besar kepada raja-Nya[a] dan menunjukkan kasih setia kepada orang yang diurapi-Nya[b], kepada Daud dan keturunannya[c] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia adalah menara keselamatan bagi raja-Nya.” Bentuk Ibrani pada awal ayat ini sulit secara tekstual dan sintaksis. Bacaan yang sangat dekat dalam 2 Samuel 22:51 berarti, “Ia membesarkan keselamatan-keselamatan raja-Nya.”
    reason: textual_variant
  - marker: b
    text: “Orang yang diurapi-Nya” juga dapat diterjemahkan “Mesias-Nya”. Di sini ungkapan itu secara langsung merujuk kepada Daud atau raja dari garis Daud, tetapi juga mengandung gaung mesianik yang lebih luas.
    reason: alternative_reading
  - marker: c
    text: Kata Ibrani yang diterjemahkan “keturunannya” berbentuk tunggal dan bermakna kolektif. Kata itu dapat menunjuk kepada seluruh garis keturunan Daud dan, dalam konteks kanonis, juga membuka kemungkinan pembacaan mesianik.
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדל יְשׁוּעוֹת
  choice: memberikan kemenangan-kemenangan besar
  rationale: Bentuk מגדל dalam teks Masoret sulit secara tekstual dan sintaksis. Dengan mempertimbangkan bacaan sejajar dalam 2 Samuel 22:51, frasa ini dipahami sebagai tindakan Allah membesarkan atau mengaruniakan kemenangan kepada raja-Nya. Bentuk ulang “kemenangan-kemenangan” mempertahankan jamak Ibrani yang menunjuk pada tindakan penyelamatan yang berulang.
- source_word: מַלְכּוֹ
  choice: raja-Nya
  rationale: Menerjemahkan bentuk dengan sufiks orang ketiga maskulin tunggal secara langsung serta mempertahankan hubungan Allah dengan raja yang ditetapkan-Nya.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: dan menunjukkan kasih setia
  rationale: “Kasih setia” merupakan padanan Indonesia yang alami dan berbobot untuk חֶסֶד, termasuk nuansa kesetiaan dalam hubungan perjanjian.
- source_word: לִמְשִׁיחוֹ
  choice: kepada orang yang diurapi-Nya
  rationale: Dalam konteks langsung, istilah ini menunjuk kepada Daud sebagai raja yang diurapi. Terjemahan ini tetap memungkinkan gaung mesianik tanpa langsung membatasi maknanya pada gelar “Mesias”.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Nama pribadi dialihaksarakan dalam bentuk Indonesia yang lazim.
- source_word: וּלְזַרְעוֹ
  choice: dan keturunannya
  rationale: “Keturunannya” alami dalam bahasa Indonesia dan dapat merujuk secara kolektif kepada garis keturunan Daud tanpa menentukan apakah yang dimaksud hanya dinasti secara keseluruhan atau juga seorang keturunan tertentu.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Padanan idiomatis yang jelas dan wajar untuk durasi yang tidak berakhir.
theological_decisions:
- issue: Gaung mesianik מְשִׁיחוֹ dalam mazmur kerajaan Daud
  choice: orang yang diurapi-Nya
  alternative: Mesias-Nya
  rationale: Daud adalah rujukan historis langsung, tetapi istilah Ibrani yang sama juga mendasari gelar “Mesias”. Bacaan utama mempertahankan konteks historis, sedangkan catatan kaki menjaga gaung mesianiknya.
- issue: Cakupan זַרְעוֹ
  choice: keturunannya
  alternative: benihnya; garis keturunannya
  rationale: Nomina Ibrani berbentuk tunggal tetapi bermakna kolektif. Terjemahan tidak mempersempitnya hanya kepada seluruh dinasti ataupun hanya kepada satu keturunan mesianik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran pronominal ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan paralel ayat dipertahankan, sementara kesulitan tekstual dan ambiguitas teologis dijelaskan dalam catatan kaki.
