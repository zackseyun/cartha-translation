source:
  edition: WLC
  text: חַי יְ֭הוָה וּ/בָר֣וּךְ צוּרִ֑/י וְ֝/יָר֗וּם אֱלוֹהֵ֥י יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: id
  text: Yahweh hidup! Terpujilah batu karangku, dan ditinggikanlah Allah keselamatanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan biarlah Allah keselamatanku ditinggikan,” atau “dan Allah keselamatanku ditinggikan.”
    reason: Bentuk Ibrani וְיָרוּם dapat dipahami secara volitif/aklamatif atau secara deklaratif.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Yahweh hidup!
  rationale: חַי berfungsi sebagai predikat yang menyatakan bahwa Yahweh hidup dan nyata. Bentuk seruan ini sesuai dengan konteks pujian dan tidak menambahkan nuansa sumpah yang tidak dituntut oleh konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: וּבָרוּךְ
  choice: Terpujilah
  rationale: Dalam konteks doksologi, bentuk ini menyatakan seruan pujian. “Terpujilah” terdengar alami, khidmat, dan mempertahankan daya aklamatifnya.
- source_word: צוּרִי
  choice: batu karangku
  rationale: צוּר menunjuk pada batu besar atau cadas dan dipakai sebagai metafora bagi Allah sebagai pelindung yang kokoh. “Batu karangku” mempertahankan metafora tersebut secara alami dalam bahasa Indonesia.
- source_word: וְיָרוּם
  choice: dan ditinggikanlah
  rationale: Walaupun secara morfologis merupakan bentuk imperfek, dalam kesejajaran pujian ini bentuk tersebut paling wajar dipahami secara aklamatif atau menyerupai yusif. “Ditinggikanlah” mempertahankan kesejajarannya dengan “Terpujilah” tanpa menutup kemungkinan pembacaan deklaratif.
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: Allah keselamatanku
  rationale: Ungkapan konstruksi Ibrani dipertahankan secara ringkas sebagai “Allah keselamatanku,” yang menyatakan Allah sebagai sumber keselamatan atau pembebasan pemazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan sebuah gelar.
- issue: Daya וְיָרוּם dalam konteks pujian
  choice: 'aklamatif/yusif: “dan ditinggikanlah”'
  alternative: 'deklaratif: “dan Allah keselamatanku ditinggikan”; volitif eksplisit: “dan biarlah Allah keselamatanku ditinggikan”'
  rationale: Bentuk imperfek Ibrani dapat dipahami sebagai pernyataan, harapan, atau aklamasi. Kesejajaran dengan “Terpujilah” mendukung bentuk aklamatif, sedangkan catatan kaki mempertahankan kemungkinan lain.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. Tanda seru sesudah “Yahweh hidup” menandai aklamasi. Metafora “batu karangku” dipertahankan, dan pola “Terpujilah … ditinggikanlah …” menjaga kesejajaran puisi Ibrani.
