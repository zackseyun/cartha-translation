  text: כִּֽי אַ֭תָּה עַם עָנִ֣י תוֹשִׁ֑יעַ וְ/עֵינַ֖יִם רָמ֣וֹת תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/027.yaml
  text: For you save an afflicted people[b][a], but haughty eyes you bring low.
translation:
  language: id
  text: Sebab Engkau menyelamatkan umat yang tertindas[a], tetapi mata yang angkuh[b] Kaurendahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang miskin”, “yang menderita”, atau “yang rendah hati”. Istilah Ibraninya dapat menunjuk pada kemiskinan, penderitaan, atau keadaan rendah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mata yang tinggi”, suatu ungkapan Ibrani untuk keangkuhan atau kesombongan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: אַתָּה
  choice: Engkau
  rationale: Pronomina orang kedua tunggal ini menunjuk kepada Allah. “Engkau” sesuai dengan ragam bahasa Alkitab Indonesia yang modern dan bermartabat.
- source_word: עַם
  choice: umat
  rationale: Nomina kolektif ini menunjuk kepada sekelompok orang. “Umat” alami dalam konteks sapaan kepada Allah dan tidak memberi kesan politis sekuat “bangsa”.
- source_word: עָנִי
  choice: yang tertindas
  rationale: Istilah ini dapat menunjuk pada kemiskinan, penderitaan, atau kerendahan. “Yang tertindas” menonjolkan keadaan sengsara yang darinya Allah menyelamatkan, tanpa membatasinya pada kemiskinan ekonomi.
- source_word: תוֹשִׁיעַ
  choice: menyelamatkan
  rationale: Bentuk kausatif dari ישׁע berarti menyelamatkan atau melepaskan. “Menyelamatkan” ringkas, alami, dan mempertahankan keluasan makna pertolongan ilahi.
- source_word: וְעֵינַיִם רָמוֹת
  choice: tetapi mata yang angkuh
  rationale: Walaupun וְ secara bentuk berarti “dan”, paralelismenya menyatakan pertentangan, sehingga “tetapi” tepat. Gambaran “mata” dipertahankan, sedangkan רָמוֹת dinyatakan sebagai “angkuh” agar makna idiomatisnya jelas.
- source_word: תַּשְׁפִּיל
  choice: Kaurendahkan
  rationale: Bentuk kausatif dari שׁפל berarti membuat rendah atau merendahkan. “Kaurendahkan” mempertahankan antitesis dengan mata yang tinggi atau angkuh.
theological_decisions:
- issue: Cakupan makna עָנִי
  choice: umat yang tertindas
  alternative: umat yang miskin; umat yang rendah hati; umat yang menderita
  rationale: Konteks berbicara tentang tindakan Allah menyelamatkan mereka yang berada dalam keadaan rendah dan merendahkan yang angkuh. Pilihan ini mempertahankan tema pembebasan dari kesengsaraan tanpa mempersempit maknanya menjadi kemiskinan ekonomi atau menjadikannya semata-mata sifat batin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan puitis serta pertentangan antara umat yang tertindas dan mata yang angkuh dipertahankan. Kapitalisasi “Engkau” dan bentuk terikat “Kau-” mengikuti kebiasaan penghormatan kepada Allah dalam teks Alkitab bahasa Indonesia.
