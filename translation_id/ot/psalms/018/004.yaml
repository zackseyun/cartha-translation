source:
  edition: WLC
  text: אֲפָפ֥וּ/נִי חֶבְלֵי מָ֑וֶת וְֽ/נַחֲלֵ֖י בְלִיַּ֣עַל יְבַֽעֲתֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/004.yaml
  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: id
  text: 'Tali-tali maut membelit aku,

    dan arus deras kehancuran[a] menggentarkan aku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “kehancuran” juga dapat berarti “kebejatan” atau “kejahatan”; jika dipahami sebagai nama diri, terjemahannya ialah “Belial”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: membelit aku
  rationale: Kata kerja אפף berarti mengelilingi atau mengepung. Bersama gambaran tali, “membelit aku” menyampaikan baik tindakan mengelilingi maupun ancaman ikatan secara alami dalam bahasa Indonesia.
- source_word: חֶבְלֵי
  choice: tali-tali
  rationale: חבל secara konkret berarti tali. Bentuk jamak dipertahankan untuk menjaga gambaran puitis Ibrani tanpa mengubahnya menjadi tafsiran seperti “jerat” atau “kesakitan”.
- source_word: מָוֶת
  choice: maut
  rationale: “Maut” adalah padanan puitis yang lazim dan bermartabat bagi מָוֶת serta sesuai dengan ragam mazmur.
- source_word: נַחֲלֵי
  choice: arus deras
  rationale: נחל dapat menunjuk pada alur sungai, sungai musiman, atau aliran deras. “Arus deras” menonjolkan kekuatan air yang mengancam dan terdengar alami dalam puisi Indonesia.
- source_word: בְלִיַּעַל
  choice: kehancuran
  rationale: Dalam konteks ini בְלִיַּעַל paling mungkin merupakan nomina umum yang menggambarkan kuasa yang mencelakakan atau menghancurkan, bukan nama diri. “Kehancuran” menyampaikan daya rusaknya secara jelas; kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: יְבַעֲתוּנִי
  choice: menggentarkan aku
  rationale: בעת menyatakan rasa takut atau kengerian yang mendadak dan kuat. “Menggentarkan aku” mempertahankan intensitasnya dalam bahasa Indonesia yang puitis tetapi tetap mudah dipahami.
theological_decisions:
- issue: Apakah בְלִיַּעַל merupakan nama diri “Belial” atau nomina umum
  choice: 'Nomina umum: “kehancuran”'
  alternative: “Kebejatan”, “kejahatan”, atau nama diri “Belial”
  rationale: Pemakaian dalam puisi Ibrani ini tidak menuntut personifikasi yang berkembang kemudian. Terjemahan sebagai nomina umum menghindari memasukkan sosok teologis yang tidak dinyatakan secara pasti, sementara catatan kaki mempertahankan ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern dengan ragam puitis yang bermartabat. Paralelisme kedua baris dan dua gambaran bahaya—tali yang membelit serta arus deras yang menakutkan—dipertahankan. “Maut” dipilih untuk nuansa mazmur, sedangkan struktur kalimat tetap jelas bagi pembaca umum.
