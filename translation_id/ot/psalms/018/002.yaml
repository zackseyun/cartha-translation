base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: id
  text: Yahweh adalah tebing batuku, bentengku, dan pembebasku; Allahku, batu karangku—kepada-Nya aku berlindung—perisaiku, tanduk keselamatanku[a], dan kubu pertahananku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tanduk” adalah lambang kekuatan dan kuasa penyelamatan yang membawa kemenangan.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: סַלְעִי
  choice: bukit batuku
  rationale: Menunjukkan tebing atau bukit batu dan membedakannya dari צוּרִי yang muncul kemudian.
- source_word: מְצוּדָתִי
  choice: bentengku
  rationale: Mengungkapkan tempat berkubu yang memberi perlindungan.
- source_word: מְפַלְטִי
  choice: pembebasku
  rationale: Bentuk partisip ini menunjuk kepada pribadi yang meluputkan atau membebaskan.
- source_word: אֵלִי
  choice: Allahku
  rationale: Padanan langsung dan wajar bagi sebutan ilahi dengan akhiran orang pertama.
- source_word: צוּרִי
  choice: gunung batuku
  rationale: Mempertahankan metafora batu yang kukuh sekaligus membedakannya dari סַלְעִי.
- source_word: אֶחֱסֶה בּוֹ
  choice: tempat aku berlindung
  rationale: Menyampaikan tindakan mencari perlindungan kepada Allah secara alami dalam bahasa Indonesia.
- source_word: מָגִנִּי
  choice: perisaiku
  rationale: Mempertahankan metafora perlindungan dalam peperangan.
- source_word: קֶרֶן יִשְׁעִי
  choice: tanduk keselamatanku
  rationale: Mempertahankan metafora Ibrani tentang kekuatan dan kuasa penyelamatan yang menang.
- source_word: מִשְׂגַּבִּי
  choice: kubu pertahananku
  rationale: Menggambarkan tempat tinggi dan aman, serta tetap dibedakan dari מְצוּדָתִי.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; bentuk Yahweh mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Rangkaian metafora perlindungan yang berbeda
  choice: Membedakan bukit batu, benteng, gunung batu, perisai, tanduk, dan kubu pertahanan
  alternative: Menyeragamkan beberapa istilah menjadi batu atau benteng
  rationale: Bahasa Ibrani sengaja menumpuk citra-citra perlindungan yang berkerabat tetapi berbeda; variasinya perlu dipertahankan.
- issue: Metafora קֶרֶן יִשְׁעִי
  choice: tanduk keselamatanku
  alternative: kekuatan yang menyelamatkanku
  rationale: Terjemahan formal mempertahankan citra konkret dan ketegangan puitis, dengan catatan yang menerangkan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Susunan paralel serta akhiran posesif dipertahankan untuk mencerminkan kepadatan puisi Ibrani; tanda titik koma membantu memperjelas rangkaian metafora.
