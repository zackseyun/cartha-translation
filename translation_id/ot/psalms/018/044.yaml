base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/044.yaml
  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
translation:
  language: id
  text: Begitu mendengar, mereka menaati aku; orang-orang asing berpura-pura tunduk kepadaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang asing menyerah kepadaku dengan gentar,” atau “orang-orang asing menyatakan kesetiaan semu kepadaku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: Begitu mendengar
  rationale: Ungkapan harfiah ‘pada pendengaran telinga’ menyatakan tanggapan segera setelah mendengar. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan unsur mendengar tanpa ungkapan harfiah yang janggal.
- source_word: יִשָּׁמְעוּ לִי
  choice: mereka menaati aku
  rationale: Kata שׁמע dengan ל di sini paling mungkin berarti mendengarkan dalam arti menaati, sesuai konteks kemenangan raja dan kesejajarannya dengan ketundukan bangsa asing.
- source_word: בְּנֵי נֵכָר
  choice: orang-orang asing
  rationale: Ungkapan harfiah ‘anak-anak keasingan/negeri asing’ merupakan idiom bagi orang atau bangsa asing. ‘Orang-orang asing’ jelas dan wajar dalam bahasa Indonesia.
- source_word: יְכַחֲשׁוּ לִי
  choice: berpura-pura tunduk kepadaku
  rationale: Bentuk piel dari כחש dapat menunjukkan penipuan atau penyangkalan dan, dalam konteks penaklukan, ketundukan yang terpaksa atau tidak tulus. Terjemahan ini mempertahankan nuansa kesetiaan semu tanpa membatasi maknanya pada tindakan berbohong secara verbal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Paralelisme antara ketaatan pada baris pertama dan ketundukan semu pada baris kedua dipertahankan. Kata ganti ‘aku’ mengikuti suara penutur mazmur.
