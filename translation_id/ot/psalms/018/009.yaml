lexical_decisions:
- source_word: וַיֵּט
  choice: menekukkan
  rationale: Kata kerja נטה dapat berarti membentangkan, mencondongkan, atau membungkukkan. Dengan langit sebagai objek dalam gambaran teofani ini, “menekukkan” mempertahankan citra bahwa Allah melengkungkan langit ke bawah ketika Ia turun.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Bentuk Ibrani ini lazim menunjuk pada langit atau cakrawala. “Langit” alami dalam bahasa Indonesia dan tetap mempertahankan cakupan kosmisnya.
- source_word: וַיֵּרַד
  choice: lalu turun
  rationale: ירד menyatakan gerak turun. “Lalu turun” jelas, alami, dan mempertahankan urutan tindakan dalam puisi.
- source_word: וַעֲרָפֶל
  choice: kelam pekat
  rationale: עֲרָפֶל menunjuk pada kegelapan atau kekelaman yang tebal dan dapat pula dipahami sebagai awan gelap. “Kelam pekat” mempertahankan suasana teofani tanpa memastikan bahwa yang dimaksud adalah awan.
- source_word: תַּחַת
  choice: di bawah
  rationale: Padanan spasial langsung dan alami untuk תַּחַת.
- source_word: רַגְלָיו
  choice: kaki-Nya
  rationale: Secara harfiah berarti “kaki-Nya”. Bentuk konkret ini dipertahankan dan tidak ditafsirkan sebagai jejak kaki atau tumpuan kaki.
theological_decisions:
- issue: Gambaran teofani yang antropomorfis
  choice: Mempertahankan gambaran konkret bahwa Allah menekukkan langit, turun, dan memiliki kelam pekat di bawah kaki-Nya.
  alternative: Melunakkan gambaran menjadi parafrasa abstrak tentang campur tangan ilahi.
  rationale: Puisi Ibrani sengaja memakai citra antropomorfis yang kuat. Terjemahan mempertahankan ketegangan dan daya gambarnya tanpa mengubahnya menjadi penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. “Ia” dan enklitik hormat “-Nya” merujuk kepada Allah; susunan kalimat tetap ringkas agar paralelisme dan gerak dramatis ayat terpelihara.
