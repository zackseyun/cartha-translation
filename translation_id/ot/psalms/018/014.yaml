  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: id
  text: Ia melepaskan anak-anak panah-Nya dan mencerai-beraikan mereka; Ia memperbanyak kilat[a] dan mengacaukan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan kilat yang berlimpah Ia mengacaukan mereka,” atau “dengan banyak kilat Ia mengacaukan mereka.” Kata Ibrani yang diterjemahkan “Ia memperbanyak” juga dapat dipahami sebagai keterangan kelimpahan, “banyak” atau “dengan berlimpah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ia melepaskan
  rationale: Kata kerja שׁלח berarti mengirim atau melepaskan. Dalam gambaran peperangan ini, “melepaskan” secara alami menggambarkan anak panah yang dilontarkan tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: חִצָּיו
  choice: anak-anak panah-Nya
  rationale: Bentuk jamak חֵץ dengan akhiran orang ketiga tunggal maskulin berarti “anak-anak panah-Nya” dan merujuk kepada senjata Sang Pejuang ilahi.
- source_word: וַיְפִיצֵם
  choice: dan mencerai-beraikan mereka
  rationale: Kata kerja ini berarti menceraiberaikan atau menyebarkan. Akhiran objek jamak paling wajar merujuk kepada para musuh yang tersirat dari konteks sekitar.
- source_word: וּבְרָקִים רָב
  choice: Ia melontarkan kilat bertubi-tubi
  rationale: בְרָקִים berarti kilat-kilat, sedangkan רָב menyatakan jumlah atau kelimpahan. “Bertubi-tubi” menyampaikan banyaknya kilat secara puitis dan alami; “melontarkan” melengkapi verba yang tersirat dalam kesejajaran dengan tindakan melepaskan anak panah.
- source_word: וַיְהֻמֵּם
  choice: dan mengacaukan mereka
  rationale: המם menggambarkan tindakan membuat pihak lawan kacau, bingung, atau panik dalam pertempuran. “Mengacaukan” mempertahankan cakupan makna itu tanpa menyatakan bahwa mereka dimusnahkan.
theological_decisions:
- issue: Rujukan akhiran objek jamak dalam “mencerai-beraikan mereka” dan “mengacaukan mereka”
  choice: Keduanya merujuk kepada para musuh Daud yang dipahami dari konteks.
  alternative: Akhiran tersebut dapat dianggap merujuk kepada anak panah atau kilat yang disebarkan ke berbagai arah.
  rationale: Dalam gambaran TUHAN sebagai Pejuang ilahi, anak panah dan kilat merupakan sarana yang menceraiberaikan dan mengacaukan para musuh. Makna המם dalam konteks pertempuran juga mendukung rujukan kepada orang-orang, bukan kepada senjata.
- issue: Fungsi רָב setelah “kilat”
  choice: 'Dipahami sebagai keterangan kelimpahan: kilat datang bertubi-tubi.'
  alternative: 'Dipahami secara verbal: “Ia memperbanyak kilat.”'
  rationale: Bentuk Ibrani ringkas dan secara sintaksis dapat dipahami sebagai penanda banyaknya kilat. Terjemahan utama mempertahankan efek puitisnya dalam bahasa Indonesia, sedangkan alternatif verbal dicatat agar ketegangan gramatikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. “Mencerai-beraikan” mempertahankan citra pertempuran, sedangkan “kilat bertubi-tubi” lebih alami daripada ungkapan harfiah “memperbanyak kilat” dan tetap menandai kelimpahan dalam teks Ibrani.
