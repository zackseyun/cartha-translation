  text: He sent from on high[a]; he took me; he drew me out of many waters.
translation:
  language: id
  text: Ia mengulurkan tangan dari tempat tinggi dan mengambil aku; Ia menarik aku keluar dari air yang banyak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “air yang banyak” menggambarkan bahaya besar yang meliputi seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח מִמָּרוֹם
  choice: mengulurkan tangan dari tempat tinggi
  rationale: Secara harfiah verba berarti ‘mengirimkan/mengulurkan’. Dalam konteks penyelamatan, ungkapan Indonesia ini menyampaikan tindakan menjangkau dari atas dengan wajar. Kata ‘tangan’ tersirat oleh tindakan meraih, tetapi tidak dinyatakan dalam bahasa Ibrani.
- source_word: יִקָּחֵנִי
  choice: meraih aku
  rationale: Verba dasarnya berarti ‘mengambil’. ‘Meraih aku’ secara alami menggambarkan tindakan penyelamatan yang mengikuti penguluran dari tempat tinggi, tanpa nuansa keras seperti ‘mencengkeram’.
- source_word: יַמְשֵׁנִי
  choice: menarik aku keluar
  rationale: Bentuk kausatif verba ini berarti menarik atau mengangkat keluar, khususnya dari air. Pilihan ini jelas dan tetap dekat dengan gambaran sumber.
- source_word: מִמַּיִם רַבִּים
  choice: dari limpahan air yang besar
  rationale: Secara harfiah berarti ‘dari air yang banyak’. ‘Limpahan air yang besar’ mempertahankan citra air yang melimpah dan mengancam dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Apakah מִמָּרוֹם perlu dijelaskan secara eksplisit sebagai surga
  choice: dari tempat tinggi
  alternative: dari surga
  rationale: Teks Ibrani menyebut ‘tempat tinggi/ketinggian’, bukan secara eksplisit ‘surga’. Terjemahan ini mempertahankan gambaran dan keterbukaan maknanya.
- issue: Apakah gambaran air perlu diubah menjadi bahaya secara langsung
  choice: mempertahankan gambaran limpahan air
  alternative: dari bahaya besar
  rationale: Air yang banyak berfungsi sebagai gambaran bahaya yang meliputi pemazmur. Mempertahankan metafora sumber menghindari penafsiran yang terlalu eksplisit.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Klausa pertama dibuat idiomatis dengan ‘mengulurkan tangan’; catatan keputusan leksikal menjelaskan bahwa ‘tangan’ tersirat, bukan tertulis secara eksplisit dalam sumber.
