id: PSA.18.5
reference: Psalms 18:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חֶבְלֵ֣י שְׁא֣וֹל סְבָב֑וּ/נִי קִ֝דְּמ֗וּ/נִי מ֣וֹקְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/005.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: id
  text: Tali-tali dunia orang mati mengelilingi aku; jerat-jerat maut menghadang aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menemui aku” atau “datang menghadapi aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: tali-tali
  rationale: Mempertahankan gambaran puitis tentang ikatan atau belitan tanpa menafsirkannya sebagai rasa sakit melahirkan.
- source_word: שְׁאוֹל
  choice: dunia orang mati
  rationale: Ungkapan ini menyampaikan ranah kematian yang dimaksud oleh istilah Ibrani tanpa menyempitkannya menjadi kubur jasmani atau memberinya muatan doktrinal tertentu.
- source_word: סְבָבוּנִי
  choice: mengelilingi aku
  rationale: Padanan langsung dan wajar bagi tindakan mengepung atau mengitari.
- source_word: קִדְּמוּנִי
  choice: menghadang aku
  rationale: Dalam konteks ancaman, kata ini menyatakan bahwa jerat-jerat itu datang menemui atau menghadapi pemazmur; 'menghadang' mempertahankan daya ancam puisinya.
- source_word: מוֹקְשֵׁי
  choice: jerat-jerat
  rationale: Mengungkapkan alat perangkap dan membentuk kesejajaran puitis yang kuat dengan 'tali-tali'.
- source_word: מָוֶת
  choice: maut
  rationale: '''Maut'' merupakan padanan puitis yang alami dalam bahasa Indonesia dan mempertahankan kesan kematian sebagai kuasa yang mengancam.'
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: dunia orang mati
  alternative: Syeol; kubur
  rationale: '''Dunia orang mati'' mempertahankan cakupan istilah sebagai ranah kematian serta pembedaan puitisnya dari ''maut'', tanpa mengharuskan pembaca memahami transliterasi yang kurang lazim.'
- issue: Nuansa קִדְּמוּנִי
  choice: menghadang aku
  alternative: menemui aku; datang menghadapi aku
  rationale: Konteks jerat maut mendukung nuansa perjumpaan yang mengancam, tetapi catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah dan netral.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Pengulangan bentuk jamak 'tali-tali' dan 'jerat-jerat' mempertahankan intensitas serta kesejajaran teks Ibrani; susunan 'mengelilingi aku' dipilih demi irama puisi.
