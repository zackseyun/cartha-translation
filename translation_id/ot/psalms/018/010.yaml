  text: And he rode on a cherub and flew[b][a]; he sped on the wings of the wind.
translation:
  language: id
  text: 'Ia menunggangi kerub lalu terbang;

    Ia melesat[a] di atas sayap-sayap angin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menukik” atau “menyambar.” Kata Ibrani ini langka dan tampaknya menggambarkan gerakan cepat di udara; sebagian kecil penafsiran menghubungkannya dengan makna “terlihat” atau “tampak.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “angin” juga dapat berarti “napas” atau “roh”; dalam gambaran badai ini, “angin” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: menunggangi
  rationale: Bentuk Qal wayyiqtol dari רכב menyatakan tindakan menaiki atau menunggang. “Menunggangi” secara alami mempertahankan gambaran konkret kerub sebagai tunggangan.
- source_word: עַל
  choice: di atas
  rationale: Preposisi עַל menunjukkan posisi atau tumpuan. Dalam baris pertama maknanya sudah tersirat dalam verba “menunggangi”; dalam baris kedua diterjemahkan langsung sebagai “di atas”.
- source_word: כְּרוּב
  choice: kerub
  rationale: Nomina tunggal ini menunjuk kepada kerub, makhluk surgawi yang berkaitan dengan takhta ilahi. Istilah baku “kerub” mempertahankan citra teks tanpa menafsirkannya sebagai awan atau lambang lain.
- source_word: וַיָּעֹף
  choice: lalu terbang
  rationale: Verba עוף berarti “terbang.” “Lalu” menyampaikan urutan naratif wayyiqtol dengan wajar dalam bahasa Indonesia.
- source_word: וַיֵּדֶא
  choice: melesat
  rationale: Verba langka ini paling mungkin menggambarkan gerakan cepat di udara dan sejajar dengan “terbang.” “Melesat” menyampaikan kecepatannya tanpa menentukan secara berlebihan apakah gerakannya menukik atau menyambar.
- source_word: כַּנְפֵי
  choice: sayap-sayap
  rationale: Bentuk jamak konstruktus dari כָּנָף secara harfiah berarti “sayap-sayap.” Bentuk ini mempertahankan metafora puitis Ibrani.
- source_word: רוּחַ
  choice: angin
  rationale: Walaupun רוּחַ juga dapat berarti “napas” atau “roh,” konteks penampakan ilahi dalam badai paling kuat mendukung arti “angin.”
theological_decisions:
- issue: Hakikat gambaran kerub
  choice: Mempertahankan gambaran konkret bahwa Allah menunggangi kerub.
  alternative: Menafsirkan kerub sebagai kiasan bagi awan badai atau bala tentara surgawi.
  rationale: Teks Ibrani menyajikan citra teofani ini secara langsung tanpa menjelaskan kerub sebagai lambang sesuatu yang lain. Terjemahan tidak mendemitologisasi atau mempersempit gambaran tersebut.
- issue: Makna רוּחַ dalam frasa penutup
  choice: Menerjemahkannya sebagai “angin” dalam teks utama.
  alternative: “roh” atau “napas”
  rationale: Gambaran badai di konteks terdekat mendukung “angin,” sementara catatan kaki tetap menunjukkan keluasan makna leksikal kata Ibrani itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Paralelisme dua baris dipertahankan; “kerub” digunakan sebagai istilah teologis yang sudah mapan, sedangkan “melesat” menjaga daya gerak citra aslinya.
