  text: For all his judgments were before me[a], and I did not put away his statutes from me.
translation:
  language: id
  text: Sebab segala hukum-Nya ada di hadapanku, dan aku tidak menyingkirkan ketetapan-Nya dariku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku tidak menyimpang dari ketetapan-Nya.” Kata kerja Ibrani ini dapat dipahami sebagai menyingkirkan ketetapan itu dari diri sendiri atau sebagai menyimpang darinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang memberikan alasan bagi pernyataan sebelumnya.
- source_word: כָל מִשְׁפָּטָיו
  choice: segala ketetapan hukum-Nya
  rationale: מִשְׁפָּט dapat menunjuk pada keputusan hukum, peraturan, atau ketetapan; frasa ini mempertahankan nuansa hukum dan perjanjian dalam bahasa Indonesia yang wajar.
- source_word: לְנֶגְדִּי
  choice: ada di hadapanku
  rationale: Mengungkapkan gambaran bahwa ketetapan-ketetapan itu selalu diperhatikan atau dipandang oleh pemazmur tanpa menambahkan unsur waktu yang tidak dinyatakan secara eksplisit.
- source_word: וְחֻקֹּתָיו
  choice: dan ... ketetapan-ketetapan-Nya
  rationale: חֻקּוֹת menunjuk pada ketentuan atau perintah yang telah ditetapkan; bentuk jamak diungkapkan secara eksplisit.
- source_word: לֹא אָסִיר
  choice: aku tidak menyingkirkan
  rationale: Bentuk Hifil dipahami secara transitif, yaitu tidak membuang atau menjauhkan ketetapan-ketetapan itu dari diri sendiri.
- source_word: מֶנִּי
  choice: dari diriku
  rationale: Mempertahankan frasa preposisional Ibrani serta mendukung pengertian transitif dari kata kerja.
