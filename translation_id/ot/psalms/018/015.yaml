id: PSA.18.15
reference: Psalms 18:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֤רָא֨וּ אֲפִ֥יקֵי מַ֗יִם וַֽ/יִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִ/גַּעֲרָ֣תְ/ךָ֣ יְהוָ֑ה מִ֝/נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: id
  text: 'Lalu alur-alur air terlihat[a],

    dan fondasi-fondasi dunia tersingkap[b]

    oleh hardikan-Mu, ya Yahweh,

    oleh embusan napas dari lubang hidung-Mu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dasar-dasar sungai” atau “saluran-saluran air.”
    reason: lexical_alternative
  - marker: b
    text: Atau “fondasi-fondasi bumi.”
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “oleh napas angin/roh dari lubang hidung-Mu”; ungkapan ini merupakan gambaran antropomorfis yang hidup tentang dahsyatnya embusan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: terlihat
  rationale: Bentuk Nifal dari ראה menyatakan bahwa sesuatu menjadi tampak atau terlihat. Pilihan ini mempertahankan nuansa pasif dan gambaran puitis tentang apa yang sebelumnya tersembunyi.
- source_word: אֲפִיקֵי מַיִם
  choice: alur-alur air
  rationale: אֲפִיקִים dapat menunjuk pada alur, palung, dasar sungai, atau saluran air. 'Alur-alur air' dekat dengan bentuk Ibrani, wajar dalam bahasa Indonesia, dan tidak mempersempit maknanya hanya pada sungai.
- source_word: וַיִּגָּלוּ
  choice: tersingkap
  rationale: Bentuk Nifal dari גלה di sini menggambarkan sesuatu yang terbuka atau menjadi telanjang. 'Tersingkap' menyampaikan penyingkapan mendadak dalam gambaran kosmis ayat ini.
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: fondasi-fondasi dunia
  rationale: מוֹסְדוֹת berarti dasar atau fondasi, sedangkan תֵּבֵל menunjuk pada dunia atau bumi sebagai tatanan yang dihuni. 'Dunia' mempertahankan cakupan puitisnya.
- source_word: מִגַּעֲרָתְךָ
  choice: oleh hardikan-Mu
  rationale: Kata depan מִן dapat menyatakan sumber atau sebab. 'Oleh' menyampaikan bahwa hardikan ilahi menyebabkan penyingkapan tersebut, sedangkan 'hardikan' mempertahankan daya teguran keras dalam גְּעָרָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai 'Yahweh' agar nama pribadi dalam teks sumber tetap tampak dan tidak diganti dengan sebuah gelar.
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: oleh embusan napas dari lubang hidung-Mu
  rationale: Frasa ini secara harfiah menumpuk kata-kata yang berkaitan dengan napas, angin, atau roh dan menyebut hidung atau lubang hidung. Terjemahan ini mempertahankan gambaran antropomorfis tentang embusan ilahi yang dahsyat tanpa mengubahnya menjadi sekadar 'amarah'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama pribadi יהוה. Bentuk 'Yahweh' mempertahankan fungsi nama itu dan membedakannya dari gelar umum bagi Tuhan.
- issue: Gambaran antropomorfis dalam מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: mempertahankan gambaran napas dan lubang hidung
  alternative: menafsirkannya sebagai murka-Mu
  rationale: Walaupun אַף juga dapat berkaitan dengan kemarahan, susunan lengkap frasa ini melukiskan napas yang keluar dari lubang hidung. Mempertahankan citra tersebut menjaga ketegangan dan kekuatan bahasa puisi teofani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan baris puitis. Diksi 'tersingkap', 'hardikan', dan 'embusan' dipilih karena bermartabat tetapi tetap mudah dipahami. Pengulangan jamak pada 'alur-alur' dan 'fondasi-fondasi' mempertahankan bentuk jamak sumber Ibrani.
