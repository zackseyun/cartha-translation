  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּרְעֵ֬ם בַּ/שָּׁמַ֨יִם יְֽהוָ֗ה וְ֭/עֶלְיוֹן יִתֵּ֣ן קֹל֑/וֹ בָּ֝רָ֗ד וְ/גַֽחֲלֵי אֵֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: id
  text: Yahweh mengguntur di langit, dan Yang Mahatinggi memperdengarkan suara-Nya[a]—hujan es dan bara api.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memberikan suara-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “es dan bara api.” Teks Ibrani menyajikan ungkapan ini tanpa verba tersurat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: mengguntur
  rationale: Dalam konteks penampakan ilahi melalui badai, verba רעם menyatakan bunyi guruh. “Mengguntur” mempertahankan tindakan aktif dan paralelnya dengan suara Yang Mahatinggi.
- source_word: בַּשָּׁמַיִם
  choice: di langit
  rationale: Walaupun bentuk Ibraninya jamak, שׁמים lazim menunjuk bentangan langit. “Di langit” alami dalam bahasa Indonesia modern dan tetap sesuai dengan larik puitis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: וְעֶלְיוֹן
  choice: dan Yang Mahatinggi
  rationale: עֶלְיוֹן berfungsi sebagai gelar ilahi; “Yang Mahatinggi” merupakan padanan Indonesia yang mapan dan tepat.
- source_word: יִתֵּן קֹלוֹ
  choice: memperdengarkan suara-Nya
  rationale: Idiom ini secara harfiah berarti “memberikan suara-Nya”. Padanan “memperdengarkan suara-Nya” menyampaikan maksud idiom dengan alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בָּרָד
  choice: hujan es
  rationale: Nomina tunggal ini dapat bermakna kolektif. “Hujan es” adalah ungkapan Indonesia yang alami dan tidak memaksakan gambaran butiran tertentu.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: dan bara api
  rationale: Padanan ini mempertahankan citra puitis yang konkret tanpa menentukan apakah yang dimaksud ialah kilat, api meteorik, atau lambang penghukuman.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama יהוה secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Hubungan “hujan es dan bara api” dengan klausa sebelumnya
  choice: Dipertahankan sebagai rangkaian eliptis setelah tanda pisah
  alternative: Menambahkan verba tersirat seperti “mengirimkan” atau menjadikannya klausa terpisah
  rationale: Teks Ibrani tidak memiliki verba finit untuk unsur-unsur badai ini. Tanda pisah mempertahankan susunan puitis yang mendadak tanpa menambahkan tindakan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. “Mengguntur” dipilih untuk kekuatan gambaran badai, sedangkan “memperdengarkan suara-Nya” membuat idiom Ibrani jelas bagi pembaca umum. Semua penanda catatan kaki muncul dalam teks utama.
