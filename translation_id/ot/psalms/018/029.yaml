  text: כִּֽי בְ֭/ךָ אָרֻ֣ץ גְּד֑וּד וּ֝/בֵֽ/אלֹהַ֗/י אֲדַלֶּג שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/029.yaml
  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: id
  text: Sebab, dengan-Mu aku dapat menerjang pasukan[a], dan dengan Allahku aku dapat melompati tembok[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berlari menghadapi gerombolan penyerbu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “melompati tembok pertahanan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pujian dan kesaksian dalam konteks sekitarnya.
- source_word: בְךָ
  choice: dengan pertolongan-Mu
  rationale: Preposisi ב menyatakan sarana atau perantaraan. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan bahwa Allah memampukan pemazmur tanpa menambah gagasan yang asing.
- source_word: אָרֻץ
  choice: aku dapat menyerbu
  rationale: Berasal dari רוץ, 'berlari'; dalam konteks militer, tindakan berlari itu merupakan gerak menyerang. Kata 'dapat' menyatakan kemampuan yang diberikan Allah sebagaimana tersirat oleh konstruksi ayat.
- source_word: גְּדוּד
  choice: sepasukan musuh
  rationale: גְּדוּד dapat berarti pasukan, gerombolan, atau kelompok penyerbu. 'Sepasukan musuh' menjaga gambaran militer dan menjelaskan bahwa kelompok itu menjadi sasaran serbuan.
- source_word: וּבֵאלֹהַי
  choice: dan dengan pertolongan Allahku
  rationale: Mempertahankan kesejajaran dengan klausa pertama serta pengakuan pribadi 'Allahku'.
- source_word: אֲדַלֶּג
  choice: aku dapat melompati
  rationale: Berasal dari דלג, 'melompat' atau 'meloncat'; bentuk ini mempertahankan gambaran hidup tentang mengatasi pertahanan dengan kemampuan dari Allah.
- source_word: שׁוּר
  choice: tembok
  rationale: שׁוּר menunjuk pada tembok, khususnya tembok pertahanan; 'tembok' adalah padanan Indonesia yang lugas, sedangkan 'benteng pertahanan' merupakan kemungkinan kontekstual.
theological_decisions:
- issue: Sifat gambaran militer dalam ayat
  choice: Mempertahankan gambaran militer konkret sebagai kesaksian tentang pertolongan Allah.
  alternative: Menggeneralisasikannya menjadi kemampuan mengatasi berbagai rintangan hidup.
  rationale: Teks Ibrani memakai istilah militer yang nyata, yaitu גְּדוּד dan שׁוּר. Terjemahan tidak merohanikan gambaran itu, tetapi tetap memungkinkan pembaca melihat penerapannya yang lebih luas.
- issue: Cara menyatakan peran Allah dalam tindakan pemazmur
  choice: Menerjemahkan ב sebagai 'dengan pertolongan' dan mempertahankan 'aku dapat'.
  alternative: Menerjemahkan secara lebih harfiah sebagai 'dengan-Mu aku menyerbu' atau 'melalui-Mu aku berlari'.
  rationale: Pilihan ini menyampaikan fungsi instrumental ב secara alami dalam bahasa Indonesia, tanpa menyatakan bahwa Allah sendiri melakukan tindakan militer tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'dengan pertolongan' mempertahankan paralelisme Ibrani secara alami; citra militer tetap konkret. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
