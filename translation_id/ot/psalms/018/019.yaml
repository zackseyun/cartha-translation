source:
  edition: WLC
  text: וַ/יּוֹצִיאֵ֥/נִי לַ/מֶּרְחָ֑ב יְ֝חַלְּצֵ֗/נִי כִּ֘י חָ֥פֵֽץ בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/019.yaml
  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
translation:
  language: id
  text: Ia membawa aku keluar ke tempat yang lapang[a]; Ia menyelamatkan aku[b], karena Ia berkenan kepadaku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ke tempat terbuka" atau "ke tempat yang luas." Gambaran Ibrani mempertentangkan keadaan terimpit dengan kebebasan dan keamanan.
    reason: lexical_alternative
  - marker: b
    text: Atau "Ia melepaskan aku."
    reason: lexical_alternative
  - marker: c
    text: Atau "karena Ia menyukai aku" atau "karena Ia bersukacita atasku."
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Ia membawa aku keluar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan seseorang keluar. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gambaran pembebasan.
- source_word: לַמֶּרְחָב
  choice: ke tempat yang lapang
  rationale: מֶרְחָב menunjuk pada keluasan atau ruang terbuka, yang secara kiasan berlawanan dengan keadaan terimpit dan menyiratkan kebebasan serta keamanan.
- source_word: יְחַלְּצֵנִי
  choice: Ia menyelamatkan aku
  rationale: Bentuk Piel dari חלץ dapat berarti menarik keluar, melepaskan, atau menyelamatkan. Pilihan ini jelas bagi pembaca modern dan sesuai dengan paralelisme ayat.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi tindakan penyelamatan dan paling alami diterjemahkan dengan hubungan sebab yang jelas.
- source_word: חָפֵץ בִּי
  choice: Ia berkenan kepadaku
  rationale: Ungkapan חפץ ב menyatakan kesukaan, kerelaan, atau perkenanan terhadap seseorang. 'Berkenan kepadaku' terdengar wajar dan bermartabat tanpa menentukan dasar perkenanan tersebut.
theological_decisions:
- issue: Sifat perkenanan ilahi dalam klausa terakhir
  choice: karena Ia berkenan kepadaku
  alternative: karena Ia bersukacita atasku; karena Ia menyukai aku
  rationale: Teks Ibrani menyatakan perkenanan Allah sebagai alasan penyelamatan, tetapi tidak menjelaskan apakah perkenanan itu didasarkan pada jasa, relasi perjanjian, pilihan, atau anugerah. Terjemahan mempertahankan keterbukaan teologis ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Susunan dua klausa paralel dipertahankan, dan ungkapan ruang yang lapang tetap konkret agar citra Ibraninya tidak hilang.
