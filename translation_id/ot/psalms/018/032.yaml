  text: הָ֭/אֵל הַ/מְאַזְּרֵ֣/נִי חָ֑יִל וַ/יִּתֵּ֖ן תָּמִ֣ים דַּרְכִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: id
  text: Allah yang memperlengkapi aku dengan kekuatan[a] dan menjadikan jalanku tak bercela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membekali aku dengan keperkasaan.” Secara harfiah, Ibrani memakai gambaran mengikatkan atau mengenakan ikat pinggang dengan kekuatan.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadikan jalanku utuh,” “sempurna,” atau “lengkap.” Kata Ibrani ini dapat menyatakan keutuhan, integritas, atau keadaan tak bercela.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Allah
  rationale: Dalam bahasa Indonesia, “Allah” adalah padanan alami dan bermartabat untuk sebutan bagi Tuhan Israel. Kata sandang Ibrani tidak perlu diterjemahkan secara terpisah karena bentuk seperti “Sang Allah” terdengar tidak alami dalam konteks ini.
- source_word: הַמְאַזְּרֵנִי
  choice: yang memperlengkapi aku
  rationale: Verba אזר secara konkret berarti mengikatkan ikat pinggang sebagai persiapan untuk bertindak. “Memperlengkapi aku” menyampaikan fungsi metafora itu secara alami dalam bahasa Indonesia, sementara gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: חָיִל
  choice: dengan kekuatan
  rationale: חיל dapat berarti kekuatan, keperkasaan, atau keberanian. “Kekuatan” paling sesuai dengan tindakan Allah yang memampukan pemazmur dan merupakan kolokasi Indonesia yang wajar setelah “memperlengkapi”.
- source_word: וַיִּתֵּן
  choice: dan menjadikan
  rationale: Walaupun נתן biasanya berarti “memberi”, konstruksi ini menyatakan hasil pada “jalanku”; “menjadikan” menyampaikan fungsi idiomatis tersebut dengan jelas.
- source_word: תָּמִים
  choice: utuh
  rationale: תמים mencakup keutuhan, kelengkapan, integritas, dan keadaan tak bercela. “Utuh” mempertahankan keluasan makna dasarnya serta menghindari kesan kesempurnaan mutlak.
- source_word: דַּרְכִּי
  choice: jalanku
  rationale: “Jalan” mempertahankan metafora דרך yang dapat menunjuk pada lintasan hidup, perilaku, atau perjalanan pemazmur.
theological_decisions:
- issue: Makna תמים ketika menerangkan jalan pemazmur
  choice: utuh
  alternative: tak bercela; sempurna; lengkap
  rationale: Teks dapat menunjuk pada jalan yang lengkap, berintegritas, atau tak bercela. “Utuh” tidak mengubah pernyataan ini menjadi klaim eksplisit tentang kesempurnaan moral tanpa dosa, tetapi tetap mempertahankan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Pilihan “memperlengkapi” mengutamakan kejelasan fungsional, sedangkan metafora konkret Ibrani dipertahankan dalam catatan kaki. Semua penanda catatan kaki muncul dalam teks utama.
