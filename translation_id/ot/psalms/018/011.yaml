  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: id
  text: Ia menjadikan kegelapan tempat persembunyian-Nya[a]; di sekeliling-Nya ada tempat bernaung-Nya[b]—air yang gelap[c], awan-awan tebal di langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat rahasia-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pondok-Nya” atau “naungan-Nya.”
    reason: lexical_alternative
  - marker: c
