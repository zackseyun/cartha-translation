base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/031.yaml
  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: id
  text: Sebab siapakah Allah selain Yahweh? Dan siapakah batu karang selain Allah kita?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam kedua bagian, ungkapan Ibrani dapat juga diterjemahkan “di luar Yahweh” dan “kecuali Allah kita”; keduanya menegaskan bahwa tidak ada yang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan alasan yang mendasari pujian sebelumnya; “sebab” mempertahankan hubungan logis itu secara alami.
- source_word: מִי
  choice: siapakah
  rationale: Kata tanya ini membentuk pertanyaan retoris yang menegaskan bahwa tidak ada yang sebanding dengan Allah.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Bentuk tunggal ini menunjuk kepada Allah yang sejati dalam pernyataan eksklusif, sehingga diterjemahkan dengan nama umum “Allah”.
- source_word: מִבַּלְעֲדֵי
  choice: selain
  rationale: 'Ungkapan ini menyatakan pengecualian atau eksklusivitas: tidak ada Allah selain Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וּמִי
  choice: Dan siapakah
  rationale: Kata sambung mempertahankan kesejajaran dan hubungan erat antara kedua pertanyaan retoris.
- source_word: צוּר
  choice: batu karang
  rationale: Pilihan ini mempertahankan metafora Ibrani tentang kekuatan, kestabilan, dan perlindungan dalam ungkapan yang alami dalam bahasa Indonesia.
- source_word: זוּלָתִי
  choice: selain
  rationale: Istilah pengecualian ini sejajar dengan מִבַּלְעֲדֵי dan menyatakan bahwa tidak ada batu karang lain yang sebanding.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Akhiran orang pertama jamak dipertahankan untuk menyampaikan dimensi komunal dan relasional teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Metafora צוּר bagi Allah
  choice: batu karang
  alternative: gunung batu atau tempat perlindungan
  rationale: “Batu karang” mempertahankan metafora konkret dalam bahasa sumber, sedangkan “tempat perlindungan” akan menafsirkan maknanya dan menghilangkan citranya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan pertanyaan retoris serta paralelisme Ibrani dipertahankan. “Batu karang” dipilih agar metafora tetap jelas dan mudah dipahami.
