  text: יְשַׁוְּע֥וּ וְ/אֵין מוֹשִׁ֑יעַ עַל יְ֝הוָ֗ה וְ/לֹ֣א עָנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/041.yaml
  text: They cried for help, but there was no savior; to the LORD, but he did not answer them.
translation:
  language: id
  text: Mereka berseru meminta pertolongan, tetapi tidak ada penyelamat; mereka berseru kepada TUHAN, tetapi Ia tidak menjawab mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: berseru meminta pertolongan
  rationale: Bentuk ini menyatakan seruan untuk mendapatkan pertolongan; ungkapan Indonesia tersebut alami dan mempertahankan tindakan memohon bantuan.
- source_word: מוֹשִׁיעַ
  choice: penyelamat
  rationale: Partisip ini secara harfiah menunjuk kepada pihak yang menyelamatkan; 'penyelamat' mempertahankan padanan nominal sumber serta kontras dengan seruan mereka.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk menyatakan nama ilahi YHWH dengan huruf kapital.
- source_word: עָנָם
  choice: menjawab mereka
  rationale: Menerjemahkan verba 'menjawab' dengan objek pronominal jamak secara langsung.
theological_decisions:
- issue: Identitas 'penyelamat' dalam klausa pertama
  choice: Tidak memperjelas identitasnya; memakai 'tidak ada penyelamat'.
  alternative: Tidak ada seorang pun yang menyelamatkan mereka.
  rationale: Teks Ibrani memakai bentuk nominal/partisip tanpa menentukan identitas penyelamat; terjemahan mempertahankan bentuk dan keterbukaan itu.
- issue: Subjek implisit pada 'tidak menjawab'
  choice: Memakai 'Ia' yang merujuk kepada TUHAN.
  alternative: TUHAN tidak menjawab mereka.
  rationale: Subjek verba Ibrani tersirat dan secara gramatikal merujuk kepada YHWH; pronomina mempertahankan alur kalimat tanpa menambahkan tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'mereka berseru' pada klausa kedua ditambahkan secara idiomatis untuk menjelaskan konstruksi eliptis Ibrani tanpa mengubah hubungan maknanya.
