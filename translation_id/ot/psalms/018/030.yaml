id: PSA.18.30
reference: Psalms 18:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: id
  text: Adapun Allah, jalan-Nya sempurna; firman Yahweh teruji[a]; Dia adalah perisai bagi semua orang yang berlindung kepada-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dimurnikan” atau “terbukti murni”. Kata Ibraninya menggambarkan logam yang diuji dan dimurnikan dalam api, sehingga menekankan kemurnian firman Yahweh yang telah terbukti.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang percaya kepada-Nya”. Secara lebih harfiah, kata Ibraninya berarti mencari perlindungan, sehingga mempertahankan gambaran Allah sebagai pelindung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Adapun Allah
  rationale: Kata sandang dan posisi awal klausa menonjolkan Allah sebagai topik. “Adapun Allah” menyampaikan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: תָּמִים דַּרְכּוֹ
  choice: jalan-Nya sempurna
  rationale: תָּמִים menyatakan keutuhan dan ketiadaan cacat. “Sempurna” alami ketika menerangkan jalan atau cara Allah bertindak dan tidak membatasi maknanya pada ketidakbersalahan moral saja.
- source_word: אִמְרַת יְהוָה
  choice: firman Yahweh
  rationale: אִמְרָה berarti perkataan atau firman, sedangkan יְהוָה adalah nama ilahi. “Firman Yahweh” mempertahankan baik makna ujaran maupun nama pribadi dalam teks sumber.
- source_word: צְרוּפָה
  choice: teruji
  rationale: Bentuk dari צרף membangkitkan gambaran logam yang diuji dan dimurnikan melalui peleburan. “Teruji” terdengar alami untuk firman dan menyatakan kemurnian yang telah terbukti; gambaran metalurginya dijelaskan dalam catatan kaki.
- source_word: מָגֵן הוּא
  choice: Dia adalah perisai
  rationale: מָגֵן secara harfiah berarti “perisai”. Metafora perlindungan dipertahankan, dan pronomina mandiri הוּא diterjemahkan sebagai subjek eksplisit.
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: bagi semua orang yang berlindung kepada-Nya
  rationale: חסה berarti mencari atau memperoleh perlindungan. “Berlindung kepada-Nya” mempertahankan gambaran Allah sebagai tempat perlindungan, bukan meratakannya menjadi konsep abstrak “percaya”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama ilahi itu alih-alih menggantinya dengan gelar, tanpa menambahkan penafsiran denominasi.
- issue: Makna kesempurnaan jalan Allah
  choice: sempurna
  alternative: tidak bercela; utuh
  rationale: תָּמִים dapat menunjuk pada keutuhan, kesempurnaan, atau keadaan tanpa cacat. “Sempurna” menjaga cakupan maknanya tanpa mempersempit pernyataan hanya pada kategori moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “Adapun Allah” mempertahankan penonjolan topik dalam bahasa Ibrani; metafora “perisai” dan “berlindung” dipertahankan agar kesatuan gambaran perlindungannya tetap jelas.
