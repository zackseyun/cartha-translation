  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: id
  text: Yahweh memberi balasan kepadaku sesuai dengan kebenaranku, sesuai dengan kebersihan tanganku di hadapan mata-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kebersihan tangan” adalah ungkapan Ibrani untuk perilaku yang tidak bersalah atau lurus. Kata yang diterjemahkan “memberi balasan” juga dapat berarti “mengembalikan” atau “memberi ganjaran”, yakni memberikan sesuatu yang sepadan dengan perilaku seseorang.
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: membalas
  rationale: Bentuk Hifil dari שׁוב dengan לִי menyatakan pemberian kembali atau balasan yang sepadan dengan perilaku. “Membalas” alami dalam bahasa Indonesia dan tidak mempersempit makna hanya menjadi pemberian upah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap dipertahankan.
- source_word: לִי
  choice: aku
  rationale: Dengan verba “membalas”, pronomina objek langsung “aku” merupakan ungkapan Indonesia yang alami bagi konstruksi Ibrani dengan ל.
- source_word: כְצִדְקִי
  choice: sesuai dengan kebenaranku
  rationale: Prefiks כ menyatakan ukuran atau kesesuaian, sedangkan צֶדֶק di sini menunjuk pada kebenaran atau kelurusan hidup pemazmur. Pilihan ini mempertahankan klaim teks secara langsung.
- source_word: כְּבֹר
  choice: sesuai dengan kebersihan
  rationale: בֹּר berarti kebersihan atau kemurnian. “Kebersihan” mempertahankan gambaran konkret yang berpasangan dengan “tanganku”.
- source_word: יָדַי
  choice: tanganku
  rationale: Ungkapan “kebersihan tanganku” mempertahankan metafora Ibrani tentang perilaku yang tidak bersalah atau lurus.
- source_word: לְנֶגֶד
  choice: di depan
  rationale: לְנֶגֶד berarti “di hadapan”, “di depan”, atau “dalam pandangan”. “Di depan” memungkinkan ungkapan konkret “mata-Nya” tetap dipertahankan.
- source_word: עֵינָיו
  choice: mata-Nya
  rationale: Terjemahan harfiah ini mempertahankan penggambaran antropomorfis teks Ibrani, bukan mengabstraksikannya menjadi sekadar “pandangan-Nya”.
theological_decisions:
- issue: Apakah pengakuan pemazmur mengenai kebenarannya sendiri perlu diperhalus
  choice: Mempertahankan pernyataan langsung bahwa Yahweh membalas sesuai dengan kebenaran pemazmur dan kebersihan tangannya
  alternative: Menafsirkan secara eksplisit sebagai kesetiaan pada perjanjian atau ketidakbersalahan yang hanya berkaitan dengan perkara tertentu
  rationale: Teks Ibrani secara tegas mengatakan “kebenaranku” dan “kebersihan tanganku”. Terjemahan tidak boleh menghilangkan ketegangan teologis ini atau memasukkan pembatasan yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Metafora konkret dan klaim teologis teks dipertahankan; satu catatan kaki menjelaskan idiom Ibrani serta cakupan makna verba.
