  text: You equipped me with strength for battle[b][a]; you subdued those who rose against me beneath me.
translation:
  language: id
  text: Engkau memperlengkapi aku dengan kekuatan untuk berperang; Engkau menundukkan orang-orang yang bangkit melawan aku di bawahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Engkau mengikatkan kekuatan padaku untuk perang; Engkau membuat orang-orang yang bangkit melawan aku bertekuk di bawahku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: Engkau memperlengkapi aku
  rationale: Kata אזר secara harfiah berkaitan dengan mengikatkan perlengkapan pada pinggang, lalu bermakna mempersiapkan atau memperlengkapi. 'Memperlengkapi' alami dalam bahasa Indonesia modern dan tetap cocok dengan objek 'kekuatan'.
- source_word: חַיִל
  choice: dengan kekuatan
  rationale: Dalam konteks peperangan, חַיִל menunjuk pada kekuatan atau kemampuan tempur, bukan pasukan sebagai kelompok.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Ungkapan ini menyatakan tujuan, yakni untuk perang atau pertempuran. Bentuk verbal 'untuk berperang' lebih alami dalam bahasa Indonesia.
- source_word: תַּכְרִיעַ
  choice: Engkau menundukkan
  rationale: Bentuk kausatif dari כרע berarti membuat seseorang membungkuk, bertekuk, atau jatuh. 'Menundukkan' mempertahankan citra sekaligus menyampaikan kekalahan musuh secara wajar.
- source_word: קָמַי
  choice: orang-orang yang bangkit melawan aku
  rationale: Terjemahan ini mempertahankan gambaran verbal dari קום, yaitu orang-orang yang bangkit dengan sikap memusuhi.
- source_word: תַּחְתָּי
  choice: ke bawah kakiku
  rationale: Secara harfiah berarti 'di bawahku'. Dalam bahasa Indonesia, 'ke bawah kakiku' memperjelas gambaran penaklukan yang dihasilkan verba kausatif, tanpa mengubah maksudnya.
