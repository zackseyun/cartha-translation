source:
  edition: WLC
  text: עַל כֵּ֤ן אוֹדְ/ךָ֖ בַ/גּוֹיִ֥ם יְהוָ֑ה וּ/לְ/שִׁמְ/ךָ֥ אֲזַמֵּֽרָה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/049.yaml
  text: Therefore I will give thanks to you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: id
  text: Karena itu, aku akan bersyukur kepada-Mu di antara bangsa-bangsa[a], ya Yahweh, dan aku akan menyanyikan pujian bagi nama-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “bangsa-bangsa”; dapat juga dipahami sebagai “bangsa-bangsa bukan Yahudi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Ungkapan ini menyatakan kesimpulan atau akibat berdasarkan konteks sebelumnya; “Karena itu” alami dalam bahasa Indonesia dan mempertahankan daya inferensialnya.
- source_word: אוֹדְךָ
  choice: aku akan bersyukur kepada-Mu
  rationale: Bentuk hifil dari ידה dalam konteks mazmur lazim menyatakan ucapan syukur atau pujian. Pilihan ini mempertahankan nuansa syukur dan sufiks persona yang ditujukan kepada Yahweh.
- source_word: בַגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם berarti bangsa-bangsa atau kelompok-kelompok bangsa. Pilihan ini mempertahankan cakupan internasional tanpa memasukkan nuansa keagamaan yang lebih sempit ke dalam teks utama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וּלְשִׁמְךָ
  choice: dan bagi nama-Mu
  rationale: Preposisi ל dengan “nama” berkaitan dengan tindakan menyanyikan pujian. “Bagi nama-Mu” merupakan ungkapan Indonesia yang alami dan tetap dekat dengan konstruksi sumber.
- source_word: אֲזַמֵּרָה
  choice: aku akan menyanyikan pujian
  rationale: Bentuk piel dari זמר menyatakan bernyanyi atau bermusik sebagai pujian. Pilihan ini mengungkapkan sifat pujian dari tindakan tersebut dan menjaga kesejajarannya dengan ucapan syukur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama, bukan menggantinya dengan gelar.
- issue: Cakupan makna גּוֹיִם
  choice: bangsa-bangsa
  alternative: bangsa-bangsa bukan Yahudi
  rationale: Makna dasarnya adalah bangsa-bangsa. Alternatif “bangsa-bangsa bukan Yahudi” mungkin dalam konteks tertentu, tetapi dapat mempersempit atau memberi warna teologis yang tidak wajib dalam konteks Mazmur ini; karena itu alternatif tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti untuk Allah ditulis dengan huruf kapital menurut kebiasaan penulisan religius Indonesia. Struktur puitis dan kesejajaran dua tindakan—bersyukur dan menyanyikan pujian—dipertahankan.
