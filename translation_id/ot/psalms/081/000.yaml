base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/000.yaml
  text: 'For the choir director: according to the Gittith[a]. Of Asaph.'
translation:
  language: id
  text: 'Untuk pemimpin musik: menurut Gitit[a]. Mazmur Asaf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani Gitit. Istilah ini mungkin menunjuk pada pola musik, alat musik, atau nama lagu, tetapi makna tepatnya tidak diketahui; mungkin juga berkaitan dengan Gat.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, bentuk ini menunjuk kepada orang yang memimpin atau mengawasi penyajian musik. Ungkapan ini alami dalam bahasa Indonesia modern tanpa membatasi tugasnya hanya pada paduan suara.
- source_word: עַל
  choice: menurut
  rationale: Dalam konteks petunjuk musik, kata ini dapat memperkenalkan lagu, alat musik, atau pola penyajian; “menurut” mempertahankan hubungan tersebut tanpa menentukan referennya.
- source_word: הַגִּתִּית
  choice: Gitit
  rationale: Makna tepat istilah musik ini tidak diketahui. Transliterasi menghindari penafsiran yang terlalu pasti sebagai alat musik, nama lagu, atau sesuatu yang berkaitan dengan Gat.
- source_word: לְאָסָף
  choice: Mazmur Asaf
  rationale: Prefiks לְ dapat menyatakan karya, kepunyaan, hubungan, atau peruntukan. Rumusan judul yang alami ini tetap tidak secara tegas memaksakan pengertian kepengarangan, meskipun asosiasi dengan Asaf jelas.
theological_decisions:
- issue: Hubungan mazmur dengan Asaf
  choice: Mazmur Asaf
  alternative: Oleh Asaf / Untuk Asaf
  rationale: Bahasa sumber tidak memastikan apakah Asaf adalah pengarang, penerima, atau tokoh yang terkait dengan koleksi tersebut. Pilihan ini mempertahankan keluasan hubungan itu dalam bentuk judul Indonesia yang wajar.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan layak sebagai judul mazmur. “Pemimpin pujian” dipilih karena mudah dipahami pembaca umum; istilah teknis “Gitit” dipertahankan dan dijelaskan dalam catatan kaki.
