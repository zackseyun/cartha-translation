  text: שְׁמַ֣ע עַ֭מִּ/י וְ/אָעִ֣ידָה בָּ֑/ךְ יִ֝שְׂרָאֵ֗ל אִם תִּֽשְׁמַֽע לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/008.yaml
  text: Hear[a], my people, and I will testify against you; O Israel[b], if you would listen to me!
translation:
  language: id
  text: Dengarlah, umat-Ku, dan Aku akan bersaksi terhadapmu[a]; hai Israel, sekiranya engkau mau mendengarkan Aku![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku akan memperingatkan engkau,” atau “Aku akan memberi kesaksian kepadamu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan Ibrani ini juga dapat diterjemahkan lebih tegas sebagai suatu harapan: “Oh, kiranya engkau mendengarkan Aku!”'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarlah
  rationale: Bentuk imperatif tunggal maskulin dari שׁמע. “Dengarlah” menyampaikan panggilan langsung dan memungkinkan pengulangan akar yang sama dalam תִּשְׁמַע tetap terasa melalui “mendengarkan”.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Sapaan perjanjian yang lazim. “Umat-Ku” alami dalam bahasa Indonesia Alkitabiah-modern dan mempertahankan daya relasional serta teologisnya.
- source_word: וְאָעִידָה בָּךְ
  choice: dan Aku akan bersaksi terhadapmu
  rationale: Bentuk hifil dari עוד bersama preposisi בְּ dapat menyatakan pemberian kesaksian yang bersifat menegur atau melawan pihak yang disapa. “Bersaksi terhadapmu” mempertahankan nuansa yudisial tanpa menutup kemungkinan makna peringatan.
- source_word: יִשְׂרָאֵל
  choice: hai Israel
  rationale: Nama ini berfungsi sebagai vokatif. “Hai Israel” mempertahankan sapaan langsung dan corak puitis dengan bahasa Indonesia yang wajar.
- source_word: אִם
  choice: sekiranya
  rationale: Dalam konteks puitis ini אִם dapat menyatakan syarat atau harapan yang kuat. “Sekiranya” mempertahankan bentuk yang dekat dengan syarat sekaligus terdengar sebagai kerinduan, tanpa mengubahnya secara tegas menjadi seruan “seandainya saja”.
- source_word: תִּשְׁמַע לִי
  choice: engkau mau mendengarkan Aku
  rationale: שׁמע dengan לְ berarti mendengarkan atau mengindahkan seseorang. “Mau mendengarkan Aku” menyampaikan nada permohonan/harapan dan mempertahankan orang kedua tunggal dari teks Ibrani.
theological_decisions:
- issue: Daya ungkapan אִם תִּשְׁמַע לִי
  choice: sekiranya engkau mau mendengarkan Aku!
  alternative: oh, kiranya engkau mendengarkan Aku! / jika engkau mau mendengarkan Aku
  rationale: 'אִם dapat berfungsi sebagai pengandaian maupun sebagai ungkapan harapan dalam puisi. “Sekiranya” menjaga ketegangan itu: kalimat terdengar sebagai seruan penuh kerinduan, tetapi bentuk kondisionalnya tidak dihapus.'
- issue: Arah kesaksian dalam וְאָעִידָה בָּךְ
  choice: Aku akan bersaksi terhadapmu
  alternative: Aku akan memperingatkan engkau / Aku akan memberi kesaksian kepadamu
  rationale: Konstruksi עוד dengan בְּ dalam konteks teguran ilahi dapat memiliki daya adversatif atau yudisial. Terjemahan utama mempertahankan nuansa tersebut, sementara catatan kaki mengakui cakupan leksikal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Bentuk tunggal “engkau” dipertahankan sesuai morfologi Ibrani, meskipun yang disapa adalah umat Israel secara kolektif.
