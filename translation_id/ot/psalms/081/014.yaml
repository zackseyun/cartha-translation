  text: In a little while I would subdue their enemies[b][a], and turn my hand against their adversaries.
translation:
  language: id
  text: Dalam waktu singkat Aku tentu akan menundukkan musuh-musuh mereka[a] dan mengarahkan kembali tangan-Ku kepada para lawan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Segera Aku akan menundukkan musuh-musuh mereka.” Ungkapan Ibrani ini dapat menyatakan waktu yang dekat; arti “hampir” lebih kecil kemungkinannya dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Aku akan membalikkan tangan-Ku atas para lawan mereka,” suatu ungkapan untuk mengarahkan kuasa dalam penghakiman terhadap mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: Dalam waktu singkat
  rationale: Ungkapan ini paling wajar dipahami secara temporal sebagai tindakan yang segera atau terjadi sesudah waktu yang singkat; pilihan ini tetap mempertahankan nuansa waktu tanpa membacanya sebagai tingkat ('hampir').
- source_word: אוֹיְבֵיהֶם
  choice: musuh-musuh mereka
  rationale: Padanan Indonesia yang jelas dan lazim bagi pihak yang memusuhi dalam konteks pertentangan.
- source_word: אַכְנִיעַ
  choice: Aku akan menundukkan
  rationale: Bentuk kausatif dari כנע menyatakan membuat pihak lain tunduk atau takluk. 'Menundukkan' mempertahankan cakupan tersebut tanpa menentukan cara kekalahannya.
- source_word: וְעַל
  choice: dan ... melawan
  rationale: Dalam ungkapan tentang membalikkan tangan, 'melawan' secara alami menyampaikan arah tindakan yang bermusuhan.
- source_word: צָרֵיהֶם
  choice: para lawan mereka
  rationale: Padanan ini mempertahankan pembedaan leksikal dari 'musuh-musuh' sambil menyampaikan pihak-pihak yang menentang atau menghimpit mereka.
- source_word: אָשִׁיב יָדִי
  choice: membalikkan tangan-Ku
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tangan Allah yang diarahkan kembali untuk bertindak terhadap para lawan.
theological_decisions:
- issue: Modalitas tindakan ilahi dalam konteks syarat pada ayat sebelumnya
  choice: Memakai 'akan' dalam konstruksi konteks bersyarat
  alternative: Memakai bentuk eksplisit 'tentulah Aku akan' atau 'Aku akan ... seandainya'
  rationale: Bahasa Ibrani memakai bentuk imperfek, sedangkan daya bersyarat muncul dari konteks sebelumnya. Terjemahan utama tidak menambahkan penanda yang tidak dinyatakan dalam ayat ini, tetapi hubungan kontekstual tetap memungkinkan pembacaan sebagai akibat yang akan terjadi andaikata Israel mendengarkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penulisan Alkitab Indonesia. Metafora 'tangan' dipertahankan, dengan maknanya dijelaskan dalam catatan kaki.
