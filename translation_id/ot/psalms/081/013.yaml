  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
translation:
  language: id
  text: Sekiranya umat-Ku mau mendengarkan Aku, sekiranya Israel mau hidup menurut jalan-jalan-Ku![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Andaikata umat-Ku mau mendengarkan Aku, andaikata Israel mau hidup menurut jalan-jalan-Ku!”
    reason: Mencatat alternatif pengungkapan bahasa Indonesia bagi seruan optatif לוּ, tanpa mengubahnya menjadi syarat biasa.
lexical_decisions:
- source_word: לוּ
  choice: Sekiranya
  rationale: Partikel ini mengungkapkan harapan yang kuat sekaligus keluhan, bukan sekadar syarat biasa; pengulangan “sekiranya” menyampaikan daya optatifnya secara alami dalam bahasa Indonesia.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Bentuk dengan akhiran orang pertama tunggal menyatakan kepunyaan. “Umat-Ku” alami dalam konteks hubungan perjanjian antara Allah dan Israel.
- source_word: שֹׁמֵעַ לִי
  choice: mau mendengarkan Aku
  rationale: Kata שׁמע dengan ל menunjuk pada mendengar dengan perhatian dan ketaatan, bukan hanya menangkap bunyi. “Mau” turut menyampaikan nuansa harapan dari לוּ.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan dalam bentuk transliterasi baku bahasa Indonesia.
- source_word: בִּדְרָכַי
  choice: menurut jalan-jalan-Ku
  rationale: Ungkapan ini menunjuk pada pola hidup atau perilaku yang sesuai dengan kehendak Allah; “menurut” membuat hubungan tersebut jelas tanpa menghilangkan metafora jalan.
- source_word: יְהַלֵּכוּ
  choice: mau hidup
  rationale: Secara harfiah berarti “berjalan,” tetapi dalam konteks ini merupakan metafora bagi perilaku hidup yang berkelanjutan. “Hidup menurut jalan-jalan-Ku” lebih alami dalam bahasa Indonesia sambil mempertahankan citra jalan.
theological_decisions:
- issue: Harapan optatif atau syarat
  choice: 'Ayat diterjemahkan sebagai keluhan dan harapan ilahi: “Sekiranya ... mau ...”'
  alternative: Jika umat-Ku mendengarkan Aku, jika Israel berjalan di jalan-jalan-Ku.
  rationale: Dalam konteks ini לוּ paling wajar menyatakan dambaan yang bernada sedih. Namun, karena bentuknya juga dapat dipahami secara kondisional, kemungkinan itu dicatat dalam catatan kaki agar ketegangan teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina ilahi mengikuti gaya penerbitan Alkitab Indonesia. Pengulangan “sekiranya” mempertahankan kesejajaran puitis; “hidup menurut jalan-jalan-Ku” terdengar alami sekaligus menjaga metafora Ibrani.
