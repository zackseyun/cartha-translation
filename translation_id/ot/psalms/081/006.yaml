  text: I removed the burden from his shoulder[c][b][a]; his hands passed away from the basket.
translation:
  language: id
  text: Aku menyingkirkan beban dari bahunya; tangannya terbebas dari keranjang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “periuk” atau “belanga”; kata Ibrani ini langka dan benda yang dimaksud tidak dapat dipastikan.
