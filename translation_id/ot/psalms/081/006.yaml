lexical_decisions:
- source_word: הֲסִירוֹתִי
  choice: Aku membebaskan
  rationale: Bentuk Hifil perfektum orang pertama tunggal menyatakan tindakan menyingkirkan atau melepaskan. Dalam bahasa Indonesia, “membebaskan” secara alami menyampaikan bahwa Allah melepaskan bahu dari beban kerja paksa.
- source_word: מִסֵּבֶל
  choice: dari beban
  rationale: סֵבֶל berarti beban atau muatan; “beban” paling wajar dalam hubungan dengan bahu.
- source_word: שִׁכְמוֹ
  choice: bahunya
  rationale: שׁכם secara harfiah berarti “bahu”; bentuk tunggal dan pronomina orang ketiga tunggal dipertahankan.
- source_word: כַּפָּיו
  choice: tangannya
  rationale: כף secara leksikal dapat berarti telapak tangan, tetapi “tangan” merupakan padanan idiomatis dalam konteks kerja.
- source_word: מִדּוּד
  choice: dari keranjang
  rationale: דּוּד adalah nomina langka yang biasanya dapat menunjuk periuk atau belanga. Dalam paralelisme tentang kerja paksa, “keranjang” masuk akal sebagai wadah angkut, tetapi ketidakpastian rujukannya dipertahankan dalam catatan kaki.
- source_word: תַּעֲבֹרְנָה
  choice: terbebas
  rationale: Bentuk Qal imperfek feminin jamak dari עבר secara harfiah menyatakan tangan-tangan itu berlalu atau menjauh dari benda tersebut. “Terbebas” menyampaikan hasil kontekstualnya dengan wajar tanpa ungkapan Indonesia yang janggal.
