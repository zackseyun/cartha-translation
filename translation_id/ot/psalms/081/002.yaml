  text: שְֽׂאוּ זִ֭מְרָה וּ/תְנוּ תֹ֑ף כִּנּ֖וֹר נָעִ֣ים עִם נָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/002.yaml
  text: Raise a song and sound the tambourine[c][b][a], the pleasant lyre with the harp.
translation:
  language: id
  text: Angkatlah nyanyian[a] dan bunyikanlah rebana[b], lira yang merdu bersama harpa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Angkatlah melodi” atau “Lantunkanlah nyanyian.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani תֹף menunjuk pada alat perkusi berupa gendang bingkai, yang sering diterjemahkan “tamborin” atau “rebana.”
    reason: cultural_note
  - marker: c
    text: Perbedaan tepat antara alat musik petik Ibrani כִּנּוֹר dan נָבֶל tidak diketahui dengan pasti. כִּנּוֹר kemungkinan sejenis lira; untuk נָבֶל, padanan seperti “harpa” atau “lute” juga diusulkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Angkatlah
  rationale: Imperatif jamak dari נשׂא. Ungkapan ini mengajak orang memulai atau melantunkan musik; ‘angkatlah’ mempertahankan citra teks Ibrani dan tetap wajar dalam ragam puitis Indonesia.
- source_word: זִמְרָה
  choice: nyanyian
  rationale: Menunjuk pada nyanyian atau musik pujian. ‘Nyanyian’ alami dalam konteks mazmur dan tidak mempersempit makna menjadi jenis komposisi tertentu.
- source_word: וּתְנוּ
  choice: bunyikanlah
  rationale: Secara harfiah berarti ‘berikanlah’, tetapi ketika diikuti תֹף maksudnya menghasilkan bunyi alat itu. ‘Bunyikanlah’ menyampaikan makna idiomatis tanpa menentukan teknik pukulan secara berlebihan.
- source_word: תֹף
  choice: rebana
  rationale: Alat perkusi berupa gendang bingkai. ‘Rebana’ adalah padanan Indonesia modern yang mudah dipahami dan secara bentuk lebih dekat daripada istilah arkais.
- source_word: כִּנּוֹר
  choice: kecapi
  rationale: Alat musik petik kuno sejenis lira. ‘Kecapi’ dipakai sebagai padanan umum yang alami, sementara ketidakpastian identifikasi tepatnya dijelaskan dalam catatan kaki.
- source_word: נָעִים
  choice: yang merdu
  rationale: Berarti menyenangkan atau sedap. Dalam konteks alat musik, ‘yang merdu’ secara alami menggambarkan bunyinya.
- source_word: עִם
  choice: bersama
  rationale: Menyatakan penyertaan atau permainan serentak antara kedua alat musik.
- source_word: נָבֶל
  choice: gambus
  rationale: Alat musik petik yang berbeda dari כִּנּוֹר. ‘Gambus’ memberi pembedaan yang jelas dalam bahasa Indonesia, tetapi hanya merupakan padanan perkiraan bagi alat kuno tersebut.
