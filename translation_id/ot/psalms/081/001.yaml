base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/001.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
translation:
  language: id
  text: Bernyanyilah dengan sukacita bagi Allah, kekuatan kita; bersoraklah nyaring[a] bagi Allah Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersoraklah.” Kata kerja ini dapat menunjuk pada seruan aklamasi yang keras, kadang-kadang seperti bunyi sangkakala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Bernyanyilah dengan sukacita
  rationale: Bentuk perintah jamak dari רנן menyatakan pujian vokal yang penuh kegembiraan. Pilihan ini mempertahankan unsur nyanyian dan sukacita dalam bahasa Indonesia yang alami.
- source_word: לֵאלֹהִים
  choice: bagi Allah
  rationale: Preposisi ל menandai pihak yang menjadi tujuan pujian. Dalam konteks ini אֱלֹהִים jelas menunjuk kepada Allah Israel dalam arti tunggal.
- source_word: עוּזֵּנוּ
  choice: kekuatan kita
  rationale: Kata עֹז/עוֹז berarti kekuatan atau keperkasaan. Terjemahan langsung ini tidak menambahkan gagasan khusus seperti perlindungan yang tidak dinyatakan secara eksplisit.
- source_word: הָרִיעוּ
  choice: bersoraklah nyaring
  rationale: Bentuk perintah jamak Hifil dari רוע/ריע menunjuk pada seruan aklamasi yang keras. Ungkapan ini membedakannya dari perintah untuk bernyanyi pada baris pertama.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: bagi Allah Yakub
  rationale: Bentuk konstruksi אֱלֹהֵי berarti 'Allah dari/milik Yakub'. Dalam pemakaian Alkitab bahasa Indonesia, 'Allah Yakub' merupakan ungkapan alami dan tetap dekat dengan bentuk Ibrani.
theological_decisions:
- issue: Makna אֱלֹהִים dalam kedua baris
  choice: Allah / Allah Yakub
  alternative: allah-allah
  rationale: Walaupun bentuk katanya secara morfologis dapat tampak jamak, konteks mazmur perjanjian ini dan kesejajaran dengan 'Allah Yakub' menunjukkan satu Allah, yaitu Allah Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk perintah jamak Ibrani diterjemahkan dengan bentuk perintah umum bahasa Indonesia. Tanda titik koma mempertahankan kesejajaran dua seruan dalam ayat.
