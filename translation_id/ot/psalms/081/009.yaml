  text: You must have no foreign god among you, and you must not bow down to an alien god[a].
translation:
  language: id
  text: Jangan ada ilah asing di antaramu, dan jangan bersujud kepada ilah lain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai dua kata yang berdekatan maknanya untuk ilah yang berada di luar ibadah Israel: “asing” dan “lain” atau “asing.” Variasi ini mencerminkan paralelisme puisi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיֶה
  choice: Jangan ada
  rationale: Dengan לֹא dalam sapaan perjanjian ini, bentuk tersebut menyatakan larangan, bukan ramalan. Ungkapan ini alami dan tegas dalam bahasa Indonesia modern.
- source_word: בְךָ
  choice: di antaramu
  rationale: Israel disapa secara kolektif dengan bentuk tunggal. 'Di antaramu' menyampaikan keberadaan dalam komunitas tanpa memberi kesan bahwa yang dimaksud hanya keadaan batin seseorang.
- source_word: אֵל
  choice: ilah
  rationale: Dalam konteks larangan penyembahan, kata ini menunjuk kepada suatu dewa. 'Ilah' mempertahankan nuansa religius dan membedakannya dari nama atau sebutan bagi Allah Israel.
- source_word: זָר
  choice: asing
  rationale: Kata sifat ini menggambarkan ilah yang berada di luar ibadah Israel yang ditetapkan.
- source_word: תִשְׁתַּחֲוֶה
  choice: sujud menyembah
  rationale: Kata Ibrani ini dapat menunjuk tindakan membungkuk atau bersujud; dalam konteks ilah, 'sujud menyembah' menjelaskan bahwa tindakan tersebut merupakan ibadah.
- source_word: לְאֵל
  choice: kepada ilah
  rationale: Preposisi לְ secara alami diterjemahkan 'kepada' bersama ungkapan 'sujud menyembah'.
- source_word: נֵכָר
  choice: dari bangsa lain
  rationale: Pilihan ini mempertahankan variasi puitis terhadap זָר dan menyampaikan gagasan tentang sesuatu yang berasal dari luar komunitas Israel.
theological_decisions:
- issue: Subjek yang disapa berbentuk tunggal secara gramatikal tetapi merujuk kepada Israel secara kolektif
  choice: Menggunakan bentuk '-mu' dalam 'di antaramu' tanpa mempersempit sapaan kepada individu
  alternative: di dalam dirimu
  rationale: Bahasa Ibrani lazim menyapa Israel sebagai satu kesatuan. 'Di antaramu' menyampaikan makna kolektif dengan wajar dalam bahasa Indonesia.
- issue: Hubungan antara kedua sebutan bagi ilah yang dilarang
  choice: Memakai 'ilah asing' dan 'ilah dari bangsa lain' sebagai ungkapan yang berdekatan maknanya tetapi tidak identik
  alternative: Mengulang 'ilah asing' pada kedua baris
  rationale: Teks Ibrani memakai dua kata yang berkerabat makna dalam paralelisme puitis. Variasi terjemahan mempertahankan bentuk itu tanpa menciptakan dua kategori ilah yang berbeda.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Larangan dinyatakan langsung dengan 'jangan'; 'sujud menyembah' dipilih agar tindakan fisik dan makna ibadahnya sama-sama jelas.
