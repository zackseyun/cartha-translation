  variant: modern standard Indonesian
source:
  edition: WLC
  text: תִּקְע֣וּ בַ/חֹ֣דֶשׁ שׁוֹפָ֑ר בַּ֝/כֵּ֗סֶה לְ/י֣וֹם חַגֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: id
  text: Tiuplah sangkakala pada bulan baru, pada bulan purnama[a], pada hari raya kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada bulan yang tertutup” atau “pada waktu yang ditetapkan”. Arti istilah Ibrani כֵּסֶה diperdebatkan. “Bulan purnama” dipilih di sini karena sesuai dengan kesejajaran kalender bersama “bulan baru” dan dengan konteks hari raya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Tiuplah
  rationale: Bentuk imperatif jamak Qal dari תקע; dalam konteks sangkakala berarti meniup atau membunyikannya. “Tiuplah” alami dan mempertahankan daya perintah.
- source_word: בַחֹדֶשׁ
  choice: pada bulan baru
  rationale: חֹדֶשׁ dapat berarti “bulan” atau “bulan baru”. Dalam konteks kalender perayaan dan sejajar dengan כֵּסֶה, “bulan baru” paling sesuai.
- source_word: שׁוֹפָר
  choice: sangkakala
  rationale: שׁוֹפָר menunjuk tanduk yang ditiup sebagai alat pemberi tanda, khususnya dalam ibadah. “Sangkakala” merupakan padanan Alkitabiah yang jelas dan bermartabat dalam bahasa Indonesia tanpa transliterasi yang tidak perlu.
- source_word: בַּכֵּסֶה
  choice: pada bulan purnama
  rationale: Arti כֵּסֶה diperdebatkan. “Bulan purnama” dipilih karena membentuk kesejajaran kalender dengan “bulan baru” dan cocok dengan latar hari raya; alternatif dipertahankan dalam catatan kaki.
- source_word: לְיוֹם
  choice: pada hari
  rationale: Dalam konteks ini לְ dengan יוֹם menyatakan hubungan waktu dengan hari perayaan. “Pada hari” merupakan ungkapan Indonesia yang alami.
- source_word: חַגֵּנוּ
  choice: hari raya kita
  rationale: חַג berarti perayaan atau hari raya, sering kali perayaan ziarah. “Hari raya kita” alami, mudah dipahami, dan mempertahankan unsur komunal pada sufiks orang pertama jamak.
theological_decisions:
- issue: Makna בַּכֵּסֶה dalam rujukan kalender perayaan
  choice: pada bulan purnama
  alternative: pada bulan yang tertutup; pada waktu yang ditetapkan
  rationale: Ini terutama persoalan leksikal dan kontekstual, bukan penetapan doktrin. Dalam kesejajaran dengan “bulan baru” dan sehubungan dengan hari raya Israel, “bulan purnama” paling mungkin menyatakan acuan kalender. Karena istilah Ibraninya benar-benar diperdebatkan, alternatifnya dicatat agar ambiguitas tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan liturgis yang tetap mudah dipahami. Imperatif dipertahankan secara langsung; susunan tiga frasa waktu mengikuti gerak paralel ayat Ibrani.
