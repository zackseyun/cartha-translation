  text: But he would feed him with the finest wheat[b][a], and with honey from the rock I would satisfy you.
translation:
  language: id
  text: Tetapi Ia akan memberi makan kepadanya[b] dengan gandum terbaik[a], dan Aku akan mengenyangkanmu dengan madu dari batu karang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lemak gandum”; ungkapan Ibrani ini berarti gandum yang paling kaya atau paling baik.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani beralih persona: “Ia akan memberi makan kepadanya ... Aku akan mengenyangkanmu.” Bentuk tunggal ini kemungkinan menunjuk kepada Israel sebagai satu umat.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּאֲכִילֵהוּ
  choice: Ia akan memberi dia makan
  rationale: Bentuk Hifil dari אכל berarti ‘memberi makan’. Dalam konteks syarat yang tidak terwujud pada ayat sebelumnya, bentuk ini paling wajar dipahami bermakna modal atau bersyarat, ‘akan memberi makan’. Objek orang ketiga tunggal dipertahankan sebagai ‘dia’.
- source_word: מֵחֵלֶב חִטָּה
  choice: gandum terbaik
  rationale: חֵלֶב secara harfiah berarti ‘lemak’, tetapi ketika dipakai untuk hasil bumi menunjuk pada bagian yang paling kaya atau paling bermutu. ‘Gandum terbaik’ menyampaikan idiom itu secara alami dalam bahasa Indonesia.
- source_word: וּמִצּוּר
  choice: dan dengan madu dari batu karang
  rationale: צוּר berarti batu besar atau batu karang. Ungkapan konkret ini dipertahankan sebagai gambaran kelimpahan yang datang dari tempat yang tidak terduga.
- source_word: דְּבַשׁ
  choice: madu
  rationale: Padanan langsung dan lazim yang sesuai dengan konteks.
- source_word: אַשְׂבִּיעֶךָ
  choice: Aku akan mengenyangkanmu
  rationale: Bentuk Hifil dari שבע berarti membuat kenyang atau memuaskan sampai penuh. Subjek orang pertama dan objek orang kedua tunggal dipertahankan, termasuk peralihan persona dalam teks Ibrani.
theological_decisions:
- issue: Peralihan persona dalam ayat
  choice: Mempertahankan peralihan dari orang ketiga tunggal (‘Ia ... dia’) kepada orang pertama yang menyapa orang kedua tunggal (‘Aku ... -mu’).
  alternative: Menyelaraskan seluruh ayat menjadi ‘Aku akan memberimu makan ... dan mengenyangkanmu’.
  rationale: Teks Masoret memang memuat peralihan persona yang mencolok. Mempertahankannya menghormati bentuk puisi Ibrani dan tidak memasukkan harmonisasi yang tidak dituntut oleh teks. Kata ganti tunggal kemungkinan menunjuk kepada Israel sebagai satu umat.
- issue: Gambaran kelimpahan
  choice: Mempertahankan gambaran konkret ‘gandum terbaik’ dan ‘madu dari batu karang’.
  alternative: Menafsirkan ‘batu karang’ secara eksplisit sebagai Allah dalam teks utama.
  rationale: Ayat ini menggambarkan penyediaan ilahi secara puitis. Terjemahan mempertahankan gambarnya tanpa mengubahnya menjadi tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan persona yang tidak biasa sengaja dipertahankan karena terdapat dalam teks Ibrani; tanda titik koma membantu pembaca mengikuti peralihannya. Huruf kapital pada ‘Ia’ dan ‘Aku’ menandai bahwa pembicara dan pelaku dalam konteks adalah Allah.
