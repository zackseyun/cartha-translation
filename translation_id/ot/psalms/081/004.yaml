source:
  edition: WLC
  text: כִּ֤י חֹ֣ק לְ/יִשְׂרָאֵ֣ל ה֑וּא מִ֝שְׁפָּ֗ט לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: id
  text: Sebab, hal itu adalah ketetapan bagi Israel, peraturan dari Allah Yakub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “peraturan bagi Allah Yakub.” Preposisi Ibrani dapat diterjemahkan secara lebih formal demikian, tetapi teks utama mencerminkan kemungkinan makna asal atau kewenangan dalam konteks ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah perayaan pada ayat sebelumnya; “Sebab” menyampaikan fungsi penjelas tersebut secara alami.
- source_word: חֹק
  choice: ketetapan
  rationale: Istilah ini menunjuk pada sesuatu yang ditetapkan oleh pihak berwenang; “ketetapan” mempertahankan nuansa hukum-perjanjian tanpa terdengar terlalu teknis.
- source_word: לְיִשְׂרָאֵל
  choice: bagi Israel
  rationale: 'Preposisi ל menyatakan hubungan atau keberlakuan: ketetapan itu berlaku bagi Israel.'
- source_word: הוּא
  choice: hal itu adalah
  rationale: Pronomina ini merujuk kembali pada perayaan yang diperintahkan dalam konteks sebelumnya, bukan kepada seseorang.
- source_word: מִשְׁפָּט
  choice: peraturan
  rationale: Dalam kesejajaran dengan חֹק, kata ini menyatakan ketentuan yang berwibawa, bukan tindakan penghakiman; “peraturan” juga membedakannya dari “ketetapan”.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: dari Allah Yakub
  rationale: 'Dalam konteks ini, ל paling wajar dipahami sebagai hubungan asal atau kewenangan: peraturan tersebut berasal dari Allah Yakub. Bentuk “dari” lebih jelas daripada konstruksi posesif “peraturan Allah Yakub”.'
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi dialihaksarakan menurut bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara חֹק dan מִשְׁפָּט
  choice: Menerjemahkannya secara berbeda sebagai “ketetapan” dan “peraturan”.
  alternative: Menyatukan keduanya menjadi satu gagasan hukum atau memakai dua sinonim lain.
  rationale: Teks Ibrani memakai dua istilah hukum yang berhubungan tetapi berbeda dalam kesejajaran puitis. Mempertahankan keduanya menjaga bobot perjanjian dan liturgis ayat ini tanpa memaksakan perbedaan teknis.
- issue: Makna preposisi ל dalam לֵאלֹהֵי יַעֲקֹב
  choice: Menyatakan hubungan asal atau kewenangan dengan “dari Allah Yakub”.
  alternative: “bagi Allah Yakub”
  rationale: Terjemahan “bagi” mungkin secara gramatikal, tetapi dapat menyiratkan bahwa Allah adalah penerima manfaat. “Dari” lebih wajar menyatakan bahwa peraturan itu berasal dari atau ditetapkan oleh Allah, sedangkan alternatif formal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “hal itu adalah” memperjelas rujukan pronomina Ibrani kepada perayaan yang diperintahkan sebelumnya. Dua istilah hukum dipertahankan secara berbeda untuk mencerminkan kesejajaran teks sumber.
