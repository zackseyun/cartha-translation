translation:
  language: id
  text: Maka Aku menyerahkan mereka kepada kedegilan hati mereka[a]; mereka pun berjalan menurut rencana mereka sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani memakai bentuk tunggal, “Aku menyerahkannya,” yang merujuk kepada Israel sebagai satu umat. “Kedegilan” juga dapat diterjemahkan “kekerasan” atau “kemauan keras.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mereka menuruti pertimbangan mereka sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: Maka Aku membiarkan mereka
  rationale: Bentuk Hifil dari שלח dengan sufiks orang ketiga tunggal maskulin secara harfiah merujuk kepada Israel sebagai satu umat, tetapi dalam bahasa Indonesia pronomina objek tidak membedakan jumlah. Dalam konteks penghukuman, ungkapan ini menyatakan bahwa Allah melepaskan atau menyerahkan umat itu kepada kecenderungan mereka sendiri; 'membiarkan mereka' menyampaikan makna tersebut secara alami tanpa menambahkan objek yang tidak tampak.
- source_word: בִּשְׁרִירוּת לִבָּם
  choice: mengikuti kekerasan hati mereka
  rationale: שְׁרִירוּת menunjuk pada kekerasan, kedegilan, atau kemauan diri yang membandel. 'Kekerasan hati' merupakan ungkapan Indonesia yang alami dan bermuatan moral, sedangkan 'mengikuti' menyatakan bahwa mereka dibiarkan menuruti kecenderungan batin itu.
- source_word: יֵלְכוּ
  choice: mereka berjalan
  rationale: הלך dapat berarti berjalan secara harfiah maupun menjalani pola hidup. 'Berjalan' mempertahankan metafora etis teks Ibrani dan tetap mudah dipahami.
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: menurut rencana mereka sendiri
  rationale: מוֹעֵצָה mencakup nasihat, pertimbangan, atau rencana. Dalam konteks ini, 'rencana' paling alami; 'sendiri' menonjolkan bahwa mereka mengikuti pertimbangan mereka, bukan kehendak Allah.
theological_decisions:
- issue: Tindakan ilahi sebagai penghukuman
  choice: Menerjemahkan sebagai 'Aku membiarkan mereka mengikuti'
  alternative: '''Aku menyerahkan mereka kepada'' atau ''Aku menyuruhnya pergi'''
  rationale: Konteks menggambarkan penghukuman dengan cara Allah membiarkan umat yang tidak taat menuruti kekerasan hati mereka. Pilihan ini mempertahankan daya yudisialnya tanpa memasukkan rumusan teologis yang melampaui ayat.
- issue: Peralihan bentuk tunggal kolektif ke bentuk jamak
  choice: Memakai 'mereka' secara alami dalam bahasa Indonesia dan menjelaskan bentuk Ibraninya dalam catatan
  alternative: Memaksakan 'dia' pada klausa pertama lalu 'mereka' pada klausa kedua
  rationale: Sufiks objek Ibrani berbentuk tunggal dan memandang Israel sebagai satu kesatuan, lalu kata kerja berikutnya berbentuk jamak. Karena pronomina objek Indonesia 'mereka' tidak memiliki bentuk kolektif tunggal yang wajar untuk Israel dalam konteks ini, terjemahan utama dibuat alami dan ciri sumber dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'berjalan' dipertahankan, sedangkan konstruksi klausa pertama dibuat idiomatis. Semua penanda catatan kaki terdapat dalam teks utama.
