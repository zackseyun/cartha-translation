base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/005.yaml
  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: id
  text: Ia menetapkannya sebagai kesaksian di kalangan Yusuf[a] ketika ia keluar melintasi negeri Mesir.[b] Aku mendengar bahasa yang tidak kukenal:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama “Yusuf” kemungkinan mewakili umat Israel dalam konteks keluaran ini, meskipun dapat pula menunjuk secara lebih khusus kepada keturunan Yusuf.
    reason: cross_reference
  - marker: b
    text: Atau “ketika ia keluar melawan negeri Mesir.” Preposisi Ibrani dapat berarti “melintasi/di atas” atau “melawan” dalam konteks ini.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini dapat dipahami sebagai “Aku mendengar” dalam kisah lampau atau “Aku sedang mendengar” dalam adegan puitis kini; bentuk bahasa Indonesia “Aku mendengar” mempertahankan kemungkinan keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: kesaksian
  rationale: Kata ini pada dasarnya menunjuk pada kesaksian atau sesuatu yang menjadi saksi, meskipun dalam konteks hukum dan ibadah dapat bernuansa ketetapan. “Kesaksian” mempertahankan arti leksikalnya tanpa mempersempitnya menjadi “peraturan”.
- source_word: בִּיהוֹסֵף
  choice: di antara kaum Yusuf
  rationale: Nama Yusuf dipertahankan, sedangkan “kaum” membuat pemakaian metonimis nama leluhur bagi kelompok keturunannya dapat dipahami secara wajar dalam bahasa Indonesia. Preposisi ב diterjemahkan dengan “di antara” sesuai konteks komunal.
- source_word: שָׂמוֹ
  choice: Ia menetapkannya
  rationale: Verba שׂים berarti menaruh, menempatkan, atau menetapkan. “Menetapkannya” alami dengan pelengkap “sebagai kesaksian” dan menyampaikan tindakan pemberlakuan.
- source_word: בְּצֵאתוֹ
  choice: ketika ia keluar
  rationale: Infinitif dengan prefiks ב menyatakan waktu. Pronomina orang ketiga tetap dipertahankan agar rujukannya—Allah atau Yusuf/Israel—tidak dipastikan melampaui teks Ibrani.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: melintasi negeri Mesir
  rationale: Preposisi עַל dapat berarti di atas, melintasi, atau melawan. “Melintasi” mempertahankan gambaran gerak tanpa langsung memastikan nuansa permusuhan; kemungkinan “melawan” dicatat dalam catatan kaki.
- source_word: שְׂפַת
  choice: bahasa
  rationale: Secara harfiah berarti “bibir”, tetapi secara idiomatis menunjuk pada bahasa atau tutur. “Bahasa” paling jelas dan alami dalam konteks ini.
- source_word: לֹא יָדַעְתִּי
  choice: yang tidak kukenal
  rationale: Bentuk perfektif menyatakan bahwa bahasa itu tidak dikenal oleh penutur. Ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan pembedaan antara lampau sederhana dan pluperfek.
- source_word: אֶשְׁמָע
  choice: Aku mendengar
  rationale: Bentuk imperfektif puitis ini dapat dipahami sebagai peristiwa lampau atau tindakan kini. Bentuk “mendengar” dalam bahasa Indonesia tidak menandai waktu secara morfologis, sehingga ambiguitas temporal Ibrani tetap terpelihara.
theological_decisions:
- issue: Rujukan nama “Yusuf”
  choice: Nama Yusuf dipertahankan dan dipahami secara metonimis melalui ungkapan “kaum Yusuf”.
  alternative: Mengganti “Yusuf” dengan “Israel”, atau memahaminya secara lebih sempit sebagai suku-suku utara/Efraim.
  rationale: Teks Ibrani secara eksplisit menyebut Yusuf. Mempertahankan nama itu menghormati bentuk sumber, sementara “kaum” membuat fungsi kolektifnya jelas tanpa menggantinya dengan tafsiran.
- issue: Rujukan pronomina dalam “ketika ia keluar”
  choice: Pronomina “ia” dibiarkan tanpa penjelasan identitas.
  alternative: Menentukan bahwa yang keluar adalah Allah, Yusuf, atau Israel.
  rationale: Akhiran orang ketiga tunggal dalam bahasa Ibrani tidak dengan sendirinya memastikan rujukan. Huruf kecil pada “ia” membantu menghindari penetapan rujukan secara tipografis.
- issue: Peralihan penutur pada baris terakhir
  choice: Orang pertama dipertahankan tanpa menambahkan identitas penutur.
  alternative: Menjelaskan bahwa yang berbicara adalah Allah atau pemazmur.
  rationale: Mazmur beralih kepada ujaran orang pertama, tetapi ayat ini tidak menyebut penuturnya secara eksplisit. Terjemahan mempertahankan peralihan dan ketegangan puitis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. Struktur orang ketiga lalu orang pertama dipertahankan. Kapitalisasi tidak dipakai untuk pronomina kedua kemunculan agar rujukan yang ambigu tidak dipastikan sebagai Allah.
