id: PSA.81.15
reference: Psalms 81:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מְשַׂנְאֵ֣י יְ֭הוָה יְכַֽחֲשׁוּ ל֑/וֹ וִ/יהִ֖י עִתָּ֣/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/015.yaml
  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
translation:
  language: id
  text: Orang-orang yang membenci Yahweh akan berpura-pura tunduk kepada-Nya[a], dan masa mereka akan berlangsung selamanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan tunduk kepada-Nya dengan terpaksa,” “akan berpura-pura taat kepada-Nya,” atau “akan meringkuk ketakutan di hadapan-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “masa mereka untuk selamanya.” Ini dapat merujuk pada waktu yang ditetapkan bagi mereka, nasib mereka, atau masa hukuman mereka yang berlangsung tanpa batas.
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  choice: orang-orang yang membenci
  rationale: Partisipel ini berfungsi sebagai nomina kelompok. Pilihan ini alami dalam bahasa Indonesia dan tetap menunjukkan ciri yang melekat pada kelompok tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, sesuai bentuk Ibrani dan kebijakan proyek.
- source_word: יְכַחֲשׁוּ לוֹ
  choice: akan berpura-pura tunduk kepada-Nya
  rationale: Dalam bentuk piel dengan ל, כחשׁ dapat menyatakan ketundukan yang terpaksa atau tidak tulus. Ungkapan ini menyampaikan unsur kepatuhan semu dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: וִיהִי
  choice: akan berlangsung
  rationale: Bentuk imperfek dalam rangkaian puitis diungkapkan secara idiomatis sebagai keadaan yang akan berlanjut; pilihan ini juga menyatu alami dengan kata 'masa'.
- source_word: עִתָּם
  choice: masa mereka
  rationale: עת pada dasarnya berarti 'waktu' atau 'masa'. Terjemahan ini mempertahankan ketaksaan teks mengenai apakah yang dimaksud ialah jangka waktu, nasib, atau masa hukuman mereka.
- source_word: לְעוֹלָם
  choice: selamanya
  rationale: Padanan ringkas dan lazim untuk makna keberlangsungan tanpa batas yang dinyatakan oleh לְעוֹלָם dalam konteks puitis.
theological_decisions:
- issue: Makna klausa וִיהִי עִתָּם לְעוֹלָם
  choice: masa mereka akan berlangsung selamanya
  alternative: hukuman mereka akan berlangsung selamanya; nasib mereka akan tetap untuk selamanya
  rationale: Klausa Ibrani ini sangat ringkas dan tidak menjelaskan secara tegas apa yang tercakup dalam 'masa mereka'. Konteks mendukung nuansa negatif, tetapi teks tidak secara eksplisit menyebut hukuman. Karena itu, terjemahan utama mempertahankan ketaksaan tersebut dan tidak memasukkan kesimpulan teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan kesejajaran puitis serta ketaksaan klausa terakhir. Kata ganti hormat bagi Allah ditulis dengan huruf kapital.
