  text: וְ/לֹא שָׁמַ֣ע עַמִּ֣/י לְ/קוֹלִ֑/י וְ֝/יִשְׂרָאֵ֗ל לֹא אָ֥בָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/011.yaml
  text: But my people did not listen to my voice[a], and Israel was not willing to obey me.
translation:
  language: id
  text: 'Namun umat-Ku tidak mendengarkan suara-Ku,

    dan Israel tidak bersedia taat kepada-Ku.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “umat-Ku tidak mau mendengarkan suara-Ku, dan Israel tidak mau menurut kepada-Ku.” Kata kerja Ibrani pada baris kedua menyatakan kemauan atau persetujuan; dalam konteks ini juga dapat diterjemahkan “Israel menolak Aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Namun ... tidak
  rationale: Konjungsi dan negasi menyatakan pertentangan dengan seruan serta janji ilahi sebelumnya. “Namun” menyampaikan daya adversatif itu secara alami.
- source_word: שָׁמַע
  choice: mendengarkan
  rationale: שׁמע dapat berarti mendengar, mendengarkan, atau menaati. Bersama “suara-Ku”, “mendengarkan” mempertahankan ungkapan sumber tanpa menyamakan kedua baris.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Bentuk dengan akhiran orang pertama tunggal ini menunjuk kepada umat milik Allah dan mempertahankan nuansa perjanjian dalam bahasa Indonesia yang wajar.
- source_word: לְקוֹלִי
  choice: suara-Ku
  rationale: קוֹל secara langsung berarti “suara”; pilihan ini mempertahankan sifat personal dan relasional ungkapan Ibrani.
- source_word: וְיִשְׂרָאֵל
  choice: dan Israel
  rationale: Konjungsi dipertahankan untuk menjaga kesejajaran puitis antara “umat-Ku” dan “Israel”.
- source_word: לֹא אָבָה
  choice: tidak bersedia
  rationale: אבה menyatakan kemauan atau persetujuan. “Tidak bersedia” mempertahankan unsur ketidakmauan tanpa memperkerasnya menjadi “menolak”.
- source_word: לִי
  choice: taat kepada-Ku
  rationale: Sesudah אבה, preposisi dengan pronomina ini eliptis jika diterjemahkan secara harfiah. “Taat kepada-Ku” menyatakan implikasi kontekstualnya, sementara catatan kaki mempertahankan alternatif yang lebih harfiah.
theological_decisions:
- issue: Identifikasi Israel sebagai umat Allah dalam hubungan perjanjian
  choice: Mempertahankan “umat-Ku” dan “Israel” sebagai dua unsur sejajar.
  alternative: Menggabungkannya menjadi “umat-Ku, Israel”.
  rationale: Teks Ibrani menyajikan dua sebutan dalam dua baris sejajar. Mempertahankan keduanya menjaga struktur puisi dan penekanan perjanjian.
- issue: Makna ketidakbersediaan Israel dalam אבה לִי
  choice: “tidak bersedia taat kepada-Ku” dalam teks utama.
  alternative: “tidak mau menerima-Ku”, “tidak berkenan kepada-Ku”, atau “menolak Aku”.
  rationale: Konteks suara Allah yang tidak didengarkan mendukung nuansa ketaatan, tetapi konstruksi Ibrani tetap menyimpan keluasan makna kemauan atau persetujuan; karena itu alternatif dicatat dan tidak dijadikan kepastian tunggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Umat-Ku” dipilih daripada “bangsa-Ku” untuk nuansa relasi perjanjian; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Pemenggalan dua baris mempertahankan paralelisme puisi.
