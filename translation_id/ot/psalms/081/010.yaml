id: PSA.81.10
reference: Psalms 81:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָנֹכִ֨י יְה֘וָ֤ה אֱלֹהֶ֗י/ךָ הַֽ֭/מַּעַלְ/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַרְחֶב פִּ֝֗י/ךָ וַ/אֲמַלְאֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: id
  text: Akulah Yahweh, Allahmu, yang membawa engkau keluar dari negeri Mesir. Bukalah mulutmu lebar-lebar, maka Aku akan mengisinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bukalah mulutmu lebar-lebar supaya Aku mengisinya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Akulah
  rationale: Pronomina mandiri ini bersifat emfatis; bentuk “Akulah” secara alami menonjolkan identitas pembicara dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan sufiks orang kedua tunggal menyatakan hubungan langsung dengan umat yang disapa.
- source_word: הַמַּעַלְךָ
  choice: yang membawa engkau keluar
  rationale: Bentuk Hifil dari עלה menunjuk pada tindakan Yahweh membawa Israel keluar dari Mesir. “Membawa engkau keluar” merupakan ungkapan Indonesia yang alami bagi peristiwa eksodus, meskipun unsur harfiah ‘naik’ tidak dinyatakan tersendiri.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari negeri Mesir
  rationale: Merupakan rumusan eksodus yang lazim; “negeri Mesir” alami dan tetap mewakili אֶרֶץ dalam konteks ini.
- source_word: הַרְחֶב פִּיךָ
  choice: Bukalah mulutmu lebar-lebar
  rationale: Imperatif Hifil bersama “mulutmu” secara idiomatis berarti membuka mulut selebar mungkin.
- source_word: וַאֲמַלְאֵהוּ
  choice: maka Aku akan mengisinya
  rationale: Sufiks objek merujuk kembali kepada mulut. “Maka” menyampaikan hasil atau janji yang mengikuti perintah, sementara kemungkinan nuansa tujuan dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan antara perintah dan tindakan ilahi dalam וַאֲמַלְאֵהוּ
  choice: maka Aku akan mengisinya
  alternative: supaya Aku mengisinya
  rationale: Konstruksi dapat dipahami sebagai hasil atau janji sesudah perintah, tetapi nuansa tujuan juga mungkin; alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan orang kedua tunggal diterjemahkan dengan “engkau” untuk mempertahankan sifat langsung dan puitis; bentuk “Akulah” menjaga penekanan pada identitas Yahweh.
