  text: בַּ/צָּרָ֥ה קָרָ֗אתָ וָ/אֲחַ֫לְּצֶ֥/ךָּ אֶ֭עֶנְ/ךָ בְּ/סֵ֣תֶר רַ֑עַם אֶבְחָֽנְ/ךָ֨ עַל מֵ֖י מְרִיבָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: id
  text: Dalam kesesakan engkau berseru, dan Aku menyelamatkanmu; Aku menjawabmu di tempat tersembunyi dalam guruh[a]; Aku mengujimu di perairan Meriba[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dari tempat tersembunyi dalam guruh”. Gambaran Ibrani ini mungkin menunjuk pada kehadiran Allah yang terselubung dalam badai.
    reason: lexical_alternative
  - marker: b
    text: Meriba mengingatkan pada peristiwa di padang gurun ketika Israel berbantah mengenai air (Kel. 17:1–7; Bil. 20:1–13).
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: Dalam kesesakan
  rationale: צָרָה menunjuk pada kesusahan, tekanan, atau keadaan genting. “Dalam kesesakan” ringkas, bermartabat, dan mempertahankan daya situasional frasa Ibrani.
- source_word: קָרָאתָ
  choice: engkau berseru
  rationale: Dalam konteks ini קרא berarti memanggil atau berseru meminta pertolongan. “Berseru” menyampaikan intensitas konteks tanpa menambahkan objek yang tidak dinyatakan dalam teks.
- source_word: וָאֲחַלְּצֶךָּ
  choice: lalu Aku menyelamatkanmu
  rationale: Bentuk Hifil חלץ berarti melepaskan, membebaskan, atau menyelamatkan. “Menyelamatkanmu” alami dalam bahasa Indonesia dan sesuai dengan konteks pembebasan Israel.
- source_word: אֶעֶנְךָ
  choice: Aku menjawabmu
  rationale: ענה di sini adalah verba umum untuk menjawab atau menanggapi. Terjemahan langsung ini mempertahankan hubungan orang pertama dan kedua dalam ujaran ilahi.
- source_word: בְּסֵתֶר רַעַם
  choice: di tempat tersembunyi dalam guruh
  rationale: סֵתֶר dapat berarti tempat tersembunyi, persembunyian, atau tempat rahasia. Rumusan ini mempertahankan citra kehadiran yang terselubung dalam badai serta menerjemahkan בְּ secara lokatif tanpa menetapkan rujukannya hanya kepada Sinai.
- source_word: אֶבְחָנְךָ
  choice: Aku mengujimu
  rationale: בחן berarti menguji atau memeriksa untuk mengetahui atau membuktikan mutu. “Mengujimu” merupakan padanan Indonesia yang langsung dan tidak menentukan apakah ujian itu semata-mata bersifat menghukum.
- source_word: עַל מֵי מְרִיבָה
  choice: di perairan Meriba
  rationale: עַל dapat berfungsi secara lokatif, sedangkan מֵי menunjuk pada air atau perairan. “Di perairan Meriba” alami dan mempertahankan Meriba sebagai nama tempat.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis ini tidak pasti; transliterasi mempertahankan penanda Ibrani tanpa menerka fungsinya.
theological_decisions:
- issue: Tempat dan arah jawaban ilahi dalam frasa בְּסֵתֶר רַעַם
  choice: “Aku menjawabmu di tempat tersembunyi dalam guruh” mempertahankan gambaran kehadiran Allah yang terselubung dalam guruh.
  alternative: “Aku menjawabmu dari tempat tersembunyi dalam guruh” atau mengartikannya secara khusus sebagai penampakan Allah di Sinai.
  rationale: Preposisi בְּ secara langsung mendukung arti “di/dalam”, tetapi dalam konteks verba “menjawab” dapat dipahami sebagai sumber jawaban. Rujukan historisnya juga mungkin menggemakan Sinai atau penampakan dalam badai, tetapi teks tidak menyatakannya secara khusus.
- issue: Sifat pengujian di Meriba
  choice: Diterjemahkan secara netral sebagai “Aku mengujimu”.
  alternative: Menjelaskannya sebagai hukuman, pencobaan, atau pembuktian ketaatan secara khusus.
  rationale: בחן menyatakan tindakan menguji, tetapi ayat ini tidak merinci sifat atau hasil ujian tersebut. Terjemahan tidak menyelesaikan ketegangan teologis itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pronomina “Aku” dan “engkau” mempertahankan ujaran langsung Allah kepada Israel. Nama מְרִיבָה ditransliterasikan sebagai “Meriba”, dan סֶלָה sebagai “Sela”. Penanda catatan kaki ditempatkan tepat pada frasa yang diterangkannya.
