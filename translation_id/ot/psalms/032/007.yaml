id: PSA.32.7
reference: Psalms 32:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַתָּ֤ה סֵ֥תֶר לִ/י֮ מִ/צַּ֪ר תִּ֫צְּרֵ֥/נִי רָנֵּ֥י פַלֵּ֑ט תְּס֖וֹבְבֵ֣/נִי סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: id
  text: Engkaulah tempat persembunyianku; Engkau menjaga aku dari kesesakan; Engkau mengelilingi aku dengan sorak-sorai pembebasan.[a] Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyanyian pembebasan” atau “seruan nyaring tentang pertolongan.”
    reason: lexical_alternative
  - marker: b
    text: “Sela” kemungkinan merupakan tanda musik atau liturgis; makna tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: tempat persembunyianku
  rationale: Kata benda ini menunjuk pada tempat untuk bersembunyi atau memperoleh perlindungan. Bentuk posesif alami dalam bahasa Indonesia mempertahankan metafora bahwa Allah sendiri menjadi tempat aman bagi pemazmur.
- source_word: מִצַּר
  choice: dari kesesakan
  rationale: צַר dapat berarti kesesakan, kesulitan, atau keadaan terjepit. 'Kesesakan' mempertahankan keluasan maknanya tanpa secara khusus menunjuk kepada seorang musuh.
- source_word: תִּצְּרֵנִי
  choice: Engkau menjaga aku
  rationale: Bentuk dari נצר berarti menjaga, memelihara, atau melindungi. 'Menjaga' jelas dan langsung serta sesuai dengan gambaran Allah sebagai tempat persembunyian.
- source_word: רָנֵּי
  choice: sorak-sorai
  rationale: Bentuk jamak konstruksi ini merujuk pada seruan nyaring yang lazimnya penuh sukacita. 'Sorak-sorai' menyampaikan daya bunyi dan kegembiraannya tanpa membatasinya hanya sebagai nyanyian.
- source_word: פַלֵּט
  choice: pembebasan
  rationale: Bentuk dari פלט menyatakan tindakan atau keadaan dilepaskan, diluputkan, atau diselamatkan. 'Pembebasan' dapat berpadu secara alami dengan 'sorak-sorai' dan tidak memasukkan pengertian teologis yang lebih khusus daripada teks.
- source_word: תְּסוֹבְבֵנִי
  choice: Engkau mengelilingi aku
  rationale: Bentuk dari סבב berarti mengelilingi atau melingkupi. Terjemahan ini mempertahankan citra puitis bahwa pemazmur dikelilingi oleh sorak-sorai pembebasan.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak pasti. Karena itu, istilah tersebut dialihaksarakan alih-alih ditafsirkan sebagai 'jeda' atau 'selingan'.
theological_decisions:
- issue: Sifat dan sumber 'sorak-sorai pembebasan' yang mengelilingi pemazmur
  choice: Frasa diterjemahkan secara padat sebagai 'sorak-sorai pembebasan' tanpa menentukan siapa yang bersorak.
  alternative: nyanyian pembebasan; seruan nyaring tentang pertolongan
  rationale: Konstruksi Ibrani רָנֵּי פַלֵּט memungkinkan beberapa padanan yang berdekatan. Terjemahan ini mempertahankan daya puitis dan ambiguitas tentang apakah sorak-sorai itu berasal dari Allah, para penyembah, atau pemazmur sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Pengulangan 'Engkau' mempertahankan sapaan langsung dan kesejajaran tiga klausa Ibrani. Istilah 'Sela' dipertahankan sebagai transliterasi.
