revisions:
- from: Janganlah seperti kuda atau bagal yang tidak berakal, yang perlengkapannya berupa besi kekang dan tali kendali untuk menahannya; kalau tidak, ia tidak akan mendekat kepadamu.[a]
  to: Janganlah menjadi seperti kuda atau bagal yang tidak mempunyai pengertian, yang perlengkapannya berupa mata kekang dan tali kendali untuk menahannya; kalau tidak, ia tidak akan mendekat kepadamu.[a]
  rationale: Revisi menambahkan “menjadi” untuk kelengkapan dan keluwesan larangan dalam bahasa Indonesia, mengganti “tidak berakal” dengan padanan yang lebih dekat kepada makna ‘tanpa pengertian,’ memperjelas istilah alat kekang, dan menetralkan uraian alternatif dalam catatan kaki. Pembacaan utama serta ambiguitas klausa penutup tetap dipertahankan.
