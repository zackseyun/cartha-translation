base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: id
  text: Janganlah menjadi seperti kuda atau bagal yang tidak mempunyai pengertian, yang perlengkapannya berupa mata kekang dan tali kendali untuk menahannya; kalau tidak, ia tidak akan mendekat kepadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya ia tidak mendekat kepadamu.” Klausa terakhir dalam bahasa Ibrani sulit dan dapat dipahami sebagai hewan yang tidak mau mendekat jika tidak dikendalikan, atau sebagai hewan yang perlu dikendalikan agar tidak mendekat.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Janganlah
  rationale: Bentuk larangan ini ditujukan kepada lebih dari satu orang. Dalam bahasa Indonesia, subjek dapat dilesapkan secara wajar setelah “janganlah”, sehingga larangan tetap langsung tanpa memaksakan pronomina yang kaku.
- source_word: כְּסוּס כְּפֶרֶד
  choice: seperti kuda atau bagal
  rationale: Kedua perbandingan dengan כ diterjemahkan secara langsung. “Bagal” adalah padanan baku dan mudah dipahami untuk פֶרֶד.
- source_word: אֵין הָבִין
  choice: yang tidak berakal
  rationale: Ungkapan ini menyatakan tidak adanya pengertian atau daya memahami. “Tidak berakal” alami dalam perbandingan dengan hewan dan tetap mempertahankan sisi moral-intelektualnya.
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: besi kekang dan tali kendali
  rationale: מֶתֶג menunjuk pada alat di mulut hewan, sedangkan רֶסֶן adalah perlengkapan untuk mengendalikan atau menuntunnya. Padanan ini membedakan kedua benda dengan jelas dalam bahasa Indonesia modern.
- source_word: עֶדְיוֹ
  choice: perlengkapannya berupa
  rationale: Kata ini biasanya berkaitan dengan perhiasan atau sesuatu yang dikenakan, tetapi dalam konteks hewan menunjuk pada perlengkapan yang dipasang padanya. Terjemahan ini mempertahankan gambaran konkret tanpa menyebut bagian tubuh yang tidak ada dalam teks Ibrani.
- source_word: לִבְלֹם
  choice: untuk menahannya
  rationale: Kata kerja בלם berarti menahan atau mengendalikan. “Menahannya” sesuai dengan fungsi besi kekang dan tali kendali serta tetap cukup harfiah.
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: kalau tidak, ia tidak akan mendekat kepadamu
  rationale: Klausa Ibrani ini sulit secara sintaksis. Pilihan utama memahaminya sebagai hewan yang tidak mau mendekat tanpa dikendalikan. Bentuk tunggal dipertahankan sesuai gambaran hewan tunggal dalam klausa tersebut.
theological_decisions:
- issue: Arah makna klausa penutup yang ambigu
  choice: kalau tidak, ia tidak akan mendekat kepadamu
  alternative: supaya ia tidak mendekat kepadamu
  rationale: 'Susunan Ibrani memungkinkan dua arah pemahaman: hewan perlu dikendalikan agar mau mendekat, atau dikendalikan supaya tidak mendekat atau menyerbu. Teks utama mengikuti pembacaan pertama, sedangkan pembacaan kedua dipertahankan dalam catatan kaki tanpa menyelesaikan ambiguitas secara dogmatis.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum, sementara gambaran perlengkapan hewan dan ambiguitas klausa terakhir dipertahankan.
