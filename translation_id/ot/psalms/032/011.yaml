id: PSA.32.11
reference: Psalms 32:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
translation:
  language: id
  text: Bersukacitalah dalam Yahweh dan bergembiralah, hai orang-orang benar; bersoraklah[a], kamu semua yang hatinya lurus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bernyanyilah dengan sukacita.” Kata kerja Ibrani ini dapat menunjuk pada seruan sukacita yang nyaring, baik diteriakkan maupun dinyanyikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Bersukacitalah
  rationale: Bentuk imperatif jamak dari שׂמח menyerukan sukacita. Pilihan ini mempertahankan daya perintah dan dapat dibedakan secara wajar dari וְגִילוּ.
- source_word: בַיהוָה
  choice: dalam Yahweh
  rationale: Preposisi ב dapat menandai lingkup atau sasaran sukacita; 'dalam Yahweh' mempertahankan ungkapan Ibrani tanpa mereduksinya menjadi sekadar 'karena Yahweh'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', sehingga nama pribadi dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
- source_word: וְגִילוּ
  choice: dan bergembiralah
  rationale: Imperatif jamak dari גיל menyatakan kegembiraan yang meluap. 'Bergembiralah' alami dalam bahasa Indonesia dan membedakannya dari שִׂמְחוּ.
- source_word: צַדִּיקִים
  choice: hai orang-orang benar
  rationale: Kata ini berfungsi sebagai sapaan kepada kelompok yang menerima perintah. Partikel 'hai' menandai sapaan secara jelas dan bermartabat.
- source_word: וְהַרְנִינוּ
  choice: bersoraklah
  rationale: Bentuk Hifil imperatif jamak dari רנן menunjuk pada seruan sukacita yang nyaring; konteksnya tidak memastikan apakah seruan itu diteriakkan atau dinyanyikan.
- source_word: כָּל
  choice: kamu semua
  rationale: Menyatakan keseluruhan kelompok yang disapa; susunan ini alami dalam bahasa Indonesia dan mempertahankan daya sapaan langsung.
- source_word: יִשְׁרֵי לֵב
  choice: yang hatinya lurus
  rationale: Ungkapan Ibrani ini menggambarkan kelurusan batin atau integritas moral. Terjemahan ini mempertahankan citra 'hati' dan 'lurus' tanpa mempersempit maknanya menjadi ketulusan saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankannya sebagai nama, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Makna keberadaan sukacita בַיהוָה
  choice: dalam Yahweh
  alternative: karena Yahweh
  rationale: Preposisi ב memungkinkan nuansa lingkup maupun sasaran. 'Dalam Yahweh' menjaga keluasan relasi tersebut dan tidak membatasi alasan sukacita pada hubungan sebab-akibat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme tiga imperatif dipertahankan dengan pilihan kata yang berbeda tetapi saling berdekatan maknanya. Sapaan 'hai orang-orang benar' memperjelas fungsi vokatif, sedangkan 'yang hatinya lurus' mempertahankan metafora Ibrani mengenai integritas batin.
