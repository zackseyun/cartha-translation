  text: אַ֥שְֽׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣/וֹ עָוֺ֑ן וְ/אֵ֖ין בְּ/רוּח֣/וֹ רְמִיָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: id
  text: Berbahagialah orang[a] yang kepadanya TUHAN tidak memperhitungkan kesalahan[b], dan yang dalam rohnya tidak ada tipu daya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “manusia”. Kata Ibrani yang dipakai berbentuk tunggal dan di sini bermakna generik.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani dapat berarti “kesalahan”, “dosa”, atau “tanggungan kesalahan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Ungkapan berbentuk jamak ini berfungsi sebagai seruan makarisma. “Berbahagialah” alami dalam bahasa Indonesia, tetap khidmat, dan tidak membatasi maknanya pada perasaan senang.
- source_word: אָדָם
  choice: orang
  rationale: Kata benda tunggal ini menunjuk kepada seorang manusia secara representatif dan generik. “Orang” mempertahankan ketunggalan tanpa memberi kesan bahwa maknanya hanya mencakup laki-laki.
- source_word: יַחְשֹׁב ... לֹו
  choice: yang kepadanya ... tidak memperhitungkan
  rationale: Konstruksi חָשַׁב dengan objek tak langsung mempertahankan gambaran perhitungan atau pembukuan. “Memperhitungkan” jelas dalam bahasa Indonesia dan tidak memasukkan rumusan teologis yang lebih teknis.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Nama ilahi tetragramaton diterjemahkan menurut kebiasaan Alkitab bahasa Indonesia dengan huruf kapital, sejalan dengan tradisi pembacaan penuh hormat.
- source_word: עָוֹן
  choice: kesalahan
  rationale: Istilah ini dapat menunjuk kepada perbuatan bengkok atau berdosa, kesalahan, maupun kesalahan yang menimbulkan tanggungan. “Kesalahan” cukup luas untuk mempertahankan hubungan antara pelanggaran moral dan tanggungannya dalam metafora perhitungan.
- source_word: וְאֵין
  choice: dan ... tidak ada
  rationale: Negasi eksistensial Ibrani diterjemahkan secara langsung dan alami sebagai “tidak ada”.
- source_word: בְּרוּחוֹ
  choice: dalam rohnya
  rationale: Frasa ini menunjuk pada batin atau disposisi orang tersebut; bentuk posesif tunggal dipertahankan.
- source_word: רְמִיָּה
  choice: tipu daya
  rationale: Kata ini menyatakan penipuan atau kepalsuan. “Tipu daya” adalah ungkapan Indonesia yang lazim, jelas, dan sesuai dengan konteks kejujuran batin di hadapan Allah.
theological_decisions:
- issue: Cakupan generik אָדָם
  choice: orang
  alternative: laki-laki / manusia
  rationale: Bentuk Ibrani tunggal bersifat generik, bukan membatasi ucapan bahagia ini hanya kepada laki-laki. “Orang” menyampaikan rujukan individual sekaligus cakupan umum.
- issue: Metafora forensik atau pembukuan tentang tidak diperhitungkannya kesalahan
  choice: TUHAN tidak memperhitungkan kesalahan kepadanya
  alternative: TUHAN tidak menanggungkan dosa kepadanya / TUHAN tidak memperhitungkan dosa kepadanya
  rationale: Terjemahan ini mempertahankan metafora חָשַׁב tanpa mengubahnya menjadi pernyataan sistematis yang lebih khusus. Ambiguitas עָוֹן antara pelanggaran dan tanggungan kesalahan dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan relatif “yang kepadanya TUHAN tidak memperhitungkan” mempertahankan relasi gramatikal serta metafora sumber dengan tetap dapat dipahami pembaca umum.
