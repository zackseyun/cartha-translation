  text: עַל זֹ֡את יִתְפַּלֵּ֬ל כָּל חָסִ֨יד אֵלֶי/ךָ֮ לְ/עֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭/שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗י/ו לֹ֣א יַגִּֽיעוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: id
  text: Karena itu, hendaklah setiap orang yang setia berdoa kepada-Mu selagi Engkau dapat ditemui[a]. Sesungguhnya, ketika banjir besar melanda[b], air itu tidak akan mencapai dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada waktu Engkau dapat ditemukan.” Secara harfiah, “pada waktu menemukan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam luapan banyak air.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Karena itu
  rationale: Menghubungkan ayat ini secara inferensial dengan pengakuan dan pengampunan dalam konteks sebelumnya.
- source_word: יִתְפַּלֵּל
  choice: hendaklah ... berdoa
  rationale: Bentuk imperfek dipahami bernuansa ajakan atau anjuran dalam konteks ini.
- source_word: כָּל חָסִיד
  choice: setiap orang yang setia
  rationale: חָסִיד menunjuk kepada orang yang bercirikan kesetiaan dan kesalehan; pilihan ini wajar dalam bahasa Indonesia dan tidak memakai istilah gerejawi yang lebih sempit.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Mempertahankan arah doa kepada pihak kedua tanpa menambahkan sebutan yang tidak eksplisit dalam teks.
- source_word: לְעֵת מְצֹא
  choice: pada waktu Engkau dapat ditemui
  rationale: Ungkapan ringkas Ibrani dipahami dengan arti pasif, yaitu waktu ketika Allah dapat ditemui, sambil mempertahankan ketidaklangsungan ungkapan sumber.
- source_word: רַק
  choice: Sesungguhnya
  rationale: Partikel ini dipahami sebagai penegasan keyakinan, bukan pembatasan bermakna 'hanya'.
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: ketika banjir besar melanda
  rationale: Menyampaikan secara alami gambaran aliran deras dari banyak air yang mengancam dan melanda.
- source_word: אֵלָיו לֹא יַגִּיעוּ
  choice: airnya tidak akan mencapai dia
  rationale: Subjek jamak tersirat dikemukakan sebagai air banjir agar rujukannya jelas dalam bahasa Indonesia, sedangkan pronomina tunggal tetap menunjuk kepada orang setia tersebut.
theological_decisions:
- issue: Rujukan janji perlindungan
  choice: Air banjir tidak mencapai orang setia yang berdoa
  alternative: Air dipahami secara harfiah, atau pronomina dianggap menunjuk kepada Allah
  rationale: Sintaksis paling wajar menghubungkan אֵלָיו dengan orang setia dalam klausa sebelumnya. Terjemahan mempertahankan citra banjir dan tidak menentukan apakah citra itu semata-mata harfiah atau metafora kesesakan maupun penghakiman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina ilahi dipakai menurut kebiasaan penerbitan Alkitab Indonesia; struktur dibuat mudah dipahami tanpa menghapus citra air bah dari teks Ibrani.
