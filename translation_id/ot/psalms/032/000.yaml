  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: id
  text: Dari Daud. Sebuah Maskil[a]. Berbahagialah orang yang pelanggarannya diampuni[b], yang dosanya ditutupi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Maskil, istilah pada judul mazmur yang arti tepatnya tidak pasti; mungkin suatu gubahan pengajaran atau perenungan.'
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “diangkat” atau “dibawa pergi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan pada judul mazmur ini secara alami diterjemahkan “Dari Daud”; preposisi לְ dapat menyatakan hubungan dengan Daud tanpa menjelaskan lebih jauh jenis hubungan tersebut.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Istilah teknis dalam judul mazmur ini dipertahankan sebagai transliterasi karena arti tepat dan fungsi genrenya tidak pasti; kemungkinan maknanya dijelaskan dalam catatan kaki.
- source_word: אַשְׁרֵי
  choice: Berbahagialah orang yang
  rationale: Bentuk seruan ini menyatakan keadaan yang patut disebut bahagia; tambahan “orang yang” diperlukan agar konstruksinya alami dalam bahasa Indonesia.
- source_word: נְשׂוּי פֶּשַׁע
  choice: pelanggarannya diampuni
  rationale: Secara harfiah pelanggaran itu “diangkat” atau “dibawa pergi”; “diampuni” menyampaikan makna idiomatisnya, sementara gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: כְּסוּי חֲטָאָה
  choice: dosanya ditutupi
  rationale: Terjemahan formal ini mempertahankan metafora Ibrani tentang dosa yang ditutupi dan paralelismenya dengan pelanggaran yang diampuni.
theological_decisions:
- issue: Makna pengampunan dalam נְשׂוּי
  choice: diampuni
  alternative: diangkat / dibawa pergi
  rationale: “Diampuni” merupakan makna idiomatis dalam konteks ini, tetapi catatan kaki mempertahankan citra Ibraninya agar nuansa teologis tidak hilang.
- issue: Hubungan Daud dengan mazmur dalam לְדָוִד
  choice: Dari Daud
  alternative: Milik Daud / Untuk Daud
  rationale: Terjemahan ini mengikuti pemahaman tradisional yang wajar tanpa menambahkan klaim rinci tentang proses penyusunan; ambiguitas preposisinya dicatat dalam pertimbangan leksikal.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Istilah teknis “Maskil” dipertahankan karena tidak ada padanan yang pasti. Paralelisme puitis antara “pelanggaran” dan “dosa,” serta antara “diampuni” dan “ditutupi,” dipelihara.
