  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: id
  text: 'Dari Daud. Maskil.[a]


    Berbahagialah orang yang pelanggarannya diampuni,[b]

    yang dosanya ditutupi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani “Maskil” dalam judul mazmur; arti tepatnya tidak pasti. Mungkin menunjuk pada nyanyian pengajaran atau perenungan.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “diangkat” atau “dibawa pergi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Kata depan ל dalam judul mazmur dapat menyatakan kepengarangan, hubungan, atau peruntukan. “Dari Daud” alami dalam bahasa Indonesia dan tidak mempersempitnya secara tegas menjadi “oleh” atau “untuk”.
- source_word: מַשְׂכִּיל
  choice: Nyanyian Maskil
  rationale: Arti dan fungsi tepat istilah judul ini tidak pasti. Transliterasi “Maskil” mempertahankan ketidakpastian tersebut, sedangkan “nyanyian” membantu pembaca mengenalinya sebagai keterangan jenis karya.
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Ungkapan ini menyatakan keadaan yang patut disebut bahagia atau diberkati. “Berbahagialah” merupakan bentuk puitis yang alami dan bermuatan lebih luas daripada sekadar perasaan senang.
- source_word: נְשׂוּי
  choice: diampuni
  rationale: Bentuk pasif dari נשׂא secara harfiah menggambarkan pelanggaran yang “diangkat” atau “dibawa pergi”; dalam hubungan dengan pelanggaran, makna idiomatisnya ialah diampuni. Citra harfiahnya dicatat dalam catatan kaki.
- source_word: פֶּשַׁע
  choice: pelanggaran
  rationale: Kata ini menyiratkan pelanggaran yang disengaja dan dapat bernuansa pemberontakan. “Pelanggaran” mempertahankan pembedaan leksikalnya dari “dosa” pada baris sejajar tanpa terlalu menafsirkan.
- source_word: כְּסוּי
  choice: ditutupi
  rationale: Terjemahan ini mempertahankan metafora pasif dari כסה serta kesejajaran puitis dengan “diampuni”.
- source_word: חֲטָאָה
  choice: dosa
  rationale: Dalam kesejajaran dengan pelanggaran moral, kata ini jelas menunjuk pada dosa, bukan persembahan penghapus dosa.
theological_decisions:
- issue: Subjek tunggal representatif dalam ucapan bahagia
  choice: Berbahagialah orang yang...
  alternative: Berbahagialah mereka yang...
  rationale: Bentuk Ibrani אַשְׁרֵי bersifat idiomatis, sedangkan partisip-partisip berikutnya berbentuk tunggal. “Orang yang” mempertahankan subjek tunggal representatif tanpa memberi gender yang tidak dituntut teks.
- issue: Penanganan istilah judul מַשְׂכִּיל
  choice: Mempertahankan “Maskil” dalam teks utama
  alternative: Nyanyian pengajaran; nyanyian perenungan
  rationale: Makna teknis istilah ini tidak pasti. Transliterasi menghindari penetapan fungsi didaktis atau kontemplatif yang belum dapat dipastikan.
- issue: Metafora pengampunan pada נְשׂוּי
  choice: diampuni dalam teks, dengan citra harfiah di catatan kaki
  alternative: diangkat; dibawa pergi
  rationale: Dalam konteks ini “diampuni” menyampaikan makna idiomatis dengan jelas, sementara catatan kaki menjaga citra bahwa kesalahan diangkat atau dibawa pergi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan puitis dua baris. “Berbahagialah” mempertahankan corak ucapan bahagia; istilah teknis yang tidak pasti ditransliterasikan dan dijelaskan dalam catatan kaki. Semua penanda catatan kaki muncul dalam teks utama.
