source:
  edition: WLC
  text: חַטָּאתִ֨/י אוֹדִ֪יעֲ/ךָ֡ וַ/עֲוֺ֘נִ֤/י לֹֽא כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַ/י לַ/יהוָ֑ה וְ/אַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣/י סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: id
  text: Aku memberitahukan dosaku kepada-Mu dan tidak menutupi kesalahanku. Aku berkata, “Aku akan mengakui pelanggaran-pelanggaranku kepada Yahweh,” dan Engkau mengampuni kesalahan karena dosaku.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Engkau mengangkat” atau “Engkau menanggung kesalahan karena dosaku”; kata kerjanya menggambarkan penyingkiran suatu beban dan dalam konteks ini berarti “mengampuni”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאתִי
  choice: dosaku
  rationale: חַטָּאת lazim berarti dosa; bentuk bersufiks orang pertama tunggal berarti “dosaku” dan tetap membedakannya dari עָוֹן serta פֶּשַׁע.
- source_word: אוֹדִיעֲךָ
  choice: aku memberitahukan ... kepada-Mu
  rationale: Bentuk hifil dari ידע secara harfiah berarti membuat sesuatu diketahui; “memberitahukan” mempertahankan nuansa kausatif dalam bahasa Indonesia yang alami.
- source_word: עֲוֺנִי
  choice: kesalahanku
  rationale: עָוֹן dapat menunjuk pada kesalahan, kebengkokan moral, atau tanggungan kesalahan. “Kesalahan” wajar dalam bahasa Indonesia dan tetap berbeda dari “dosa” serta “pelanggaran” dalam rangkaian istilah ayat ini.
- source_word: לֹא כִסִּיתִי
  choice: tidak menutupi
  rationale: כסה berarti menutupi. Terjemahan ini mempertahankan metafora sumber, alih-alih langsung menafsirkannya sebagai “menyembunyikan”.
- source_word: אוֹדֶה
  choice: aku akan mengakui
  rationale: Dalam konteks objek berupa pelanggaran, hifil ידה menyatakan pengakuan dosa, bukan ucapan syukur.
- source_word: עֲלֵי פְשָׁעַי
  choice: pelanggaran-pelanggaranku
  rationale: פֶּשַׁע menandakan pelanggaran atau pemberontakan. Preposisi עַל secara idiomatis menandai perkara yang diakui dan tidak perlu diterjemahkan terpisah.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama ilahi dalam teks sumber tetap tampak.
- source_word: נָשָׂאתָ
  choice: Engkau mengampuni
  rationale: נשא secara leksikal berarti mengangkat atau menanggung, tetapi dengan kesalahan sebagai objek verba ini secara idiomatis menyatakan pengampunan. Citra harfiahnya dijelaskan dalam catatan kaki.
- source_word: עֲוֺן חַטָּאתִי
  choice: kesalahan karena dosaku
  rationale: 'Rangkaian konstruksi Ibrani tetap dibuat berlapis dan dapat dipahami secara alami: kesalahan atau tanggungan yang timbul dari dosa, tanpa meratakannya menjadi sekadar “dosaku”.'
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak pasti; transliterasi menghindari penafsiran spekulatif seperti “jeda” atau “selingan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Metafora נָשָׂאתָ עֲוֹן
  choice: mengampuni dalam teks utama, dengan citra harfiah dalam catatan kaki
  alternative: mengangkat kesalahan; menanggung kesalahan
  rationale: Dalam konstruksi ini makna idiomatisnya ialah mengampuni. Namun, karena verba itu juga membayangkan pengangkatan atau penanggungan beban, ambiguitas leksikalnya dipertahankan dalam catatan.
- issue: Hubungan עֲוֹן dan חַטָּאת dalam frasa konstruksi
  choice: kesalahan karena dosaku
  alternative: kesalahan dosaku; tanggungan dosaku
  rationale: Terjemahan ini mempertahankan ungkapan berlapis pada teks Ibrani sambil menghindari frasa Indonesia yang terlalu janggal. “Kesalahan” tetap dapat mencakup perbuatan salah maupun tanggungannya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kata ganti untuk Allah ditulis dengan huruf kapital. Tiga istilah dosa dalam bahasa Ibrani dibedakan sebagai “dosa”, “kesalahan”, dan “pelanggaran”. Ejaan “Sela” mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia tanpa memberi arti yang belum pasti.
