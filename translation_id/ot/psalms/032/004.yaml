  text: כִּ֤י יוֹמָ֣ם וָ/לַיְלָה֮ תִּכְבַּ֥ד עָלַ֗/י יָ֫דֶ֥/ךָ נֶהְפַּ֥ךְ לְשַׁדִּ֑/י בְּ/חַרְבֹ֖נֵי קַ֣יִץ סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/004.yaml
  text: For day and night your hand was heavy upon me[a]; my vitality was dried up as by the heat of summer[b]. Selah
translation:
  language: id
  text: Sebab siang dan malam tangan-Mu menindihku; daya hidupku[a] mengering oleh terik musim panas[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cairan tubuhku” atau “sari hidupku”.
    reason: Istilah Ibrani dapat menunjuk secara harfiah pada kelembapan atau sari tubuh, dan secara kiasan pada vitalitas.
  - marker: b
    text: Atau “dalam kekeringan musim panas”.
    reason: Frasa Ibrani dapat menggambarkan panas yang mengeringkan ataupun kekeringan pada musim panas.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi pernyataan sebelumnya dan mempertahankan hubungan penjelas dalam konteks mazmur.
- source_word: יוֹמָם וָלַיְלָה
  choice: siang dan malam
  rationale: Merisme yang menyatakan berlangsungnya keadaan itu terus-menerus; ungkapan ini alami dalam bahasa Indonesia.
- source_word: תִּכְבַּד ... יָדֶךָ
  choice: tangan-Mu menekan aku dengan berat
  rationale: Mempertahankan gambaran konkret tentang tangan Allah yang terasa berat, sambil mengungkapkan tekanannya secara wajar dalam bahasa Indonesia.
- source_word: עָלַי
  choice: aku
  rationale: Objek tekanan dinyatakan secara langsung dalam susunan Indonesia tanpa mengubah makna bahwa tangan itu berada dengan berat atas pemazmur.
- source_word: נֶהְפַּךְ
  choice: mengering
  rationale: Secara harfiah berarti 'berubah' atau 'berbalik', tetapi bersama לְשַׁדִּי dan gambaran musim panas, hasil perubahan itu adalah keadaan yang kering dan terkuras.
- source_word: לְשַׁדִּי
  choice: daya hidupku
  rationale: Istilah ini dapat menunjuk pada cairan atau sari tubuh dan secara kiasan pada vitalitas; 'daya hidupku' jelas, alami, dan mempertahankan citra kekuatan hidup yang terkuras.
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: seperti oleh terik musim panas
  rationale: חרבון menyiratkan panas yang mengeringkan atau kekeringan. Pilihan ini menjaga gambaran pengeringan oleh panas musim panas tanpa memaksakan satu rincian citra.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal Ibrani yang makna tepatnya tidak pasti dipertahankan dalam bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Peran Allah dalam penderitaan pemazmur
  choice: Tangan Allah dinyatakan menekan pemazmur dengan berat.
  alternative: Penderitaan umum tanpa peran ilahi yang eksplisit, atau penghukuman ilahi yang dirumuskan secara doktrinal lebih tegas.
  rationale: Teks Ibrani secara langsung menyebut 'tangan-Mu', sehingga peran ilahi harus dipertahankan. Namun, ayat ini tidak menjelaskan mekanisme atau cakupan penghukuman itu, jadi terjemahan tidak menambahkan rumusan teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora tangan ilahi serta citra daya hidup yang mengering dipertahankan, sedangkan bentuk 'Sela' dibiarkan tanpa diterjemahkan karena makna teknisnya tidak pasti.
