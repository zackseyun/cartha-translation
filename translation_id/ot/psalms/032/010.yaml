  text: רַבִּ֥ים מַכְאוֹבִ֗ים לָ/רָ֫שָׁ֥ע וְ/הַ/בּוֹטֵ֥חַ בַּ/יהוָ֑ה חֶ֝֗סֶד יְסוֹבְבֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: id
  text: Banyak penderitaan menimpa orang fasik[a], tetapi kasih setia mengelilingi orang yang percaya kepada Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Banyak penderitaan bagi orang fasik.” Kata Ibrani yang diterjemahkan “penderitaan” juga dapat berarti rasa sakit atau dukacita.
    reason: lexical_alternative
  - marker: b
    text: Nama Ibrani יהוה (YHWH), yang secara tradisional diterjemahkan “TUHAN”.
    reason: divine_name
lexical_decisions:
- source_word: רַבִּים מַכְאוֹבִים
  choice: Banyak penderitaan
  rationale: Mempertahankan penempatan kata kuantitatif di depan. מַכְאוֹבִים dapat mencakup rasa sakit, dukacita, dan berbagai bentuk penderitaan; 'penderitaan' cukup luas dan wajar dalam bahasa Indonesia.
- source_word: לָרָשָׁע
  choice: menimpa orang fasik
  rationale: Preposisi ל menyatakan hubungan atau sasaran. Dalam predikasi tanpa verba ini, 'menimpa' menghasilkan bahasa Indonesia alami tanpa menentukan secara khusus siapa penyebab penderitaan itu.
- source_word: וְהַבּוֹטֵחַ
  choice: tetapi ... orang yang percaya
  rationale: Partisipel tersebut dipakai secara substantival. 'Tetapi' menyampaikan pertentangan yang jelas antara orang fasik dan orang yang mengandalkan Yahweh.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Dengan verba בטח, bahasa Indonesia lazim memakai 'percaya kepada'. Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini mempertahankan unsur kasih, kesetiaan, dan kemurahan yang terkandung dalam חֶסֶד tanpa membatasinya hanya pada salah satu nuansa.
- source_word: יְסוֹבְבֶנּוּ
  choice: mengelilingi
  rationale: Verba ini berarti mengitari atau mengelilingi. Akhiran orang ketiga tunggal merujuk kepada orang yang percaya kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi tersebut, sedangkan 'TUHAN' mengikuti tradisi penggantian gelar.
- issue: Cakupan חֶסֶד
  choice: kasih setia
  alternative: belas kasihan; kasih perjanjian
  rationale: '''Kasih setia'' menjaga keluasan makna yang meliputi kasih, loyalitas, dan kemurahan tanpa secara eksplisit memasukkan kata ''perjanjian'' yang tidak muncul dalam ayat.'
- issue: Bentuk tunggal generik רָשָׁע dan הַבּוֹטֵחַ
  choice: orang fasik; orang yang percaya
  alternative: si fasik; siapa yang percaya
  rationale: Kedua bentuk tunggal dipahami secara representatif. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi rujukannya pada seorang laki-laki tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis secara sederhana. Paralelisme kontras dipertahankan; istilah 'orang fasik', 'kasih setia', dan 'Yahweh' dipilih demi ketepatan sekaligus keterbacaan.
