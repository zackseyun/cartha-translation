  yaml_path: translation/ot/psalms/032/003.yaml
  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
translation:
  language: id
  text: Sebab ketika aku berdiam diri, tulang-tulangku menjadi rapuh di tengah eranganku[a] sepanjang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “raunganku.” Kata Ibrani ini dapat menunjuk pada jeritan keras seperti raungan, tetapi di sini tampaknya menggambarkan erangan karena penderitaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab, ketika
  rationale: 'כִּי lentur secara semantis. Dalam konteks ini kata tersebut menghubungkan keadaan yang dialami pemazmur dengan pernyataan sebelumnya, sementara bentuk perfektif sesudahnya paling wajar diungkapkan sebagai keadaan lampau: “Sebab, ketika …”'
- source_word: הֶחֱרַשְׁתִּי
  choice: aku berdiam diri
  rationale: Bentuk ini berasal dari חרשׁ, “diam”. Ungkapan “berdiam diri” menyampaikan keadaan diam yang berlanjut tanpa menambahkan secara eksplisit bahwa yang tidak diakui adalah dosa, sebab objek tersebut tidak dinyatakan dalam ayat ini.
- source_word: בָּלוּ
  choice: merapuh
  rationale: בלה menggambarkan sesuatu yang menjadi usang, terkikis, atau merosot. “Merapuh” alami bagi tulang dan mempertahankan gambaran kemerosotan jasmani serta batiniah.
- source_word: עֲצָמָי
  choice: tulang-tulangku
  rationale: Terjemahan harfiah mempertahankan citra tubuh dalam puisi Ibrani, yang dapat mewakili penderitaan seluruh diri.
- source_word: בְּשַׁאֲגָתִי
  choice: karena eranganku
  rationale: שׁאגה dapat menunjuk pada raungan atau jeritan keras. Dalam ratapan ini, “erangan” menyampaikan luapan penderitaan secara alami; preposisi בְּ dipahami sebagai keadaan atau sarana yang menyertai kemerosotan itu.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Padanan Indonesia modern yang alami dan mempertahankan gagasan durasi terus-menerus.
theological_decisions:
- issue: Apakah hal yang didiamkan harus dinyatakan sebagai dosa yang tidak diakui
  choice: Dibiarkan tersirat dalam teks utama
  alternative: ketika aku berdiam diri tentang dosaku
  rationale: Konteks mazmur menunjukkan bahwa diam itu berkaitan dengan dosa, tetapi teks Ibrani ayat ini tidak menyebutkan objeknya. Karena itu, terjemahan mempertahankan ketegangan dan keringkasan sumber.
- issue: Apakah שׁאגה harus diterjemahkan secara harfiah sebagai raungan
  choice: erangan
  alternative: raungan
  rationale: Kata Ibrani dapat berarti suara keras seperti raungan, tetapi dalam konteks pengalaman sengsara pemazmur, “erangan” lebih alami tanpa menghilangkan intensitas penderitaan; alternatif literal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan kalimat tetap dekat dengan gerak teks Ibrani, tetapi menggunakan ungkapan yang alami bagi pembaca umum. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskannya.
