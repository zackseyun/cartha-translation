  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: id
  text: Ia tidak memfitnah dengan lidahnya[a], tidak berbuat jahat kepada sesamanya[b], dan tidak menimpakan celaan kepada orang yang dekat dengannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak pergi ke sana kemari menyebarkan fitnah dengan lidahnya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak berbuat salah kepada teman atau rekannya.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “orang yang dekat dengannya”; ungkapan ini dapat berarti kerabat, rekan dekat, atau seseorang yang berada dekat dengannya dalam komunitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל
  choice: memfitnah
  rationale: Dalam ungkapan dengan 'lidah', verba ini menunjuk pada menyebarkan perkataan yang merugikan orang lain, yakni memfitnah atau membawa-bawa kabar buruk. 'Memfitnah' ringkas, wajar, dan mempertahankan daya etis ungkapan itu.
- source_word: עַל לְשֹׁנוֹ
  choice: dengan lidahnya
  rationale: Frasa ini menyatakan alat atau sarana berbicara. Bentuk konkret 'dengan lidahnya' mempertahankan citraan Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: עָשָׂה ... רָעָה
  choice: berbuat jahat
  rationale: Ungkapan Ibrani ini luas, secara harfiah berarti melakukan yang buruk atau jahat terhadap seseorang. 'Berbuat jahat' mempertahankan bobot moralnya tanpa mempersempitnya hanya menjadi kerugian fisik.
- source_word: לְרֵעֵהוּ
  choice: kepada sesamanya
  rationale: רֵעַ dapat berarti teman, rekan, atau orang lain dalam lingkungan sosial. 'Sesamanya' alami dalam konteks etis dan cukup luas tanpa mensyaratkan hubungan akrab.
- source_word: חֶרְפָּה
  choice: celaan
  rationale: Kata ini mencakup penghinaan, aib, atau cercaan yang dikenakan kepada seseorang. 'Celaan' cocok dengan konteks perkataan dan penghinaan sosial.
- source_word: נָשָׂא ... עַל
  choice: melontarkan ... terhadap
  rationale: Secara harfiah idiom ini memakai gagasan mengangkat atau membawa celaan atas seseorang. Dalam konteks paralel dengan fitnah, 'melontarkan celaan terhadap' menyampaikan tindakan aktif mencerca secara alami dalam bahasa Indonesia.
- source_word: קְרֹבוֹ
  choice: orang yang dekat dengannya
  rationale: Kata ini berarti orang yang dekat dan dapat menunjuk pada kerabat, kenalan dekat, atau orang di sekitarnya. Terjemahan ini mempertahankan keluasan makna tanpa membatasinya pada hubungan darah.
