  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: id
  text: 'Mazmur Daud.[a]


    TUHAN, siapakah yang boleh tinggal sebagai tamu di kemah-Mu?[b]


    Siapakah yang boleh berdiam di gunung-Mu yang kudus?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur oleh Daud” atau “Mazmur untuk Daud”; judul Ibrani dapat menunjukkan kepengarangan, keterkaitan, atau persembahan.
    reason: alternative_reading
  - marker: b
    text: Atau “Kemah Suci-Mu”; teks Ibrani secara harfiah berbunyi “kemah-Mu”, yang kemungkinan menunjuk kepada tempat kudus sebagai kediaman Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Mazmur Daud
  rationale: Ungkapan judul Ibrani diterjemahkan secara ringkas dan lazim, sementara keluasan fungsi לְ—karya, kaitan, atau persembahan—dipertahankan dalam catatan kaki.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Memakai konvensi Alkitab bahasa Indonesia yang mapan untuk nama perjanjian YHWH, dengan huruf kapital untuk membedakannya dari gelar umum.
- source_word: יָגוּר
  choice: menumpang
  rationale: Kata ini dapat berarti tinggal sebagai pendatang atau tamu; 'menumpang' menjaga nuansa diterima tinggal di kediaman Allah tanpa menyamakannya sepenuhnya dengan verba paralel berikutnya.
- source_word: בְּאָהֳלֶךָ
  choice: di kemah-Mu
  rationale: Menerjemahkan citra konkret 'kemah' secara langsung; dalam konteks ini kemah tersebut membangkitkan tempat kudus sebagai kediaman Allah.
- source_word: יִשְׁכֹּן
  choice: tinggal
  rationale: Mengungkapkan menetap atau berdiam dan membentuk paralel alami dengan 'menumpang'.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: di gunung-Mu yang kudus
  rationale: Mempertahankan susunan kepunyaan dan sifat kekudusan gunung secara jelas serta alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan Daud dengan mazmur dalam לְדָוִד
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud / untuk Daud
  rationale: Teks utama memakai rumusan tradisional yang tetap cukup terbuka; catatan kaki menyatakan kemungkinan fungsi preposisi agar kepengarangan tidak dipastikan melampaui bentuk Ibrani.
- issue: Penyajian nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: Konvensi 'TUHAN' paling mudah dikenali pembaca Indonesia dan tetap menandai nama ilahi melalui kapitalisasi, tanpa mengharuskan satu rekonstruksi pelafalan.
- issue: Sifat pertanyaan tentang akses ke hadirat Allah
  choice: siapakah yang boleh
  alternative: siapakah yang akan / dapat
  rationale: '''Boleh'' secara alami menyampaikan pertanyaan mengenai siapa yang diterima untuk berdiam di tempat kudus, tanpa menentukan apakah tekanannya semata-mata kemampuan, izin, atau kelayakan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Paralelisme Ibrani dipertahankan melalui dua pertanyaan yang seimbang, sementara 'menumpang' dan 'tinggal' membedakan kedua verba sumber secara wajar.
