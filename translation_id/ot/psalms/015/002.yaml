  yaml_path: translation/ot/psalms/015/002.yaml
  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
translation:
  language: id
  text: Orang yang hidup dengan integritas[a], melakukan apa yang benar[b], dan berkata benar dalam hatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup tak bercela.” Istilah Ibrani ini dapat menunjuk pada keutuhan atau integritas dalam perilaku, bukan kesempurnaan mutlak.
    reason: lexical_alternative
  - marker: b
    text: Atau “melakukan kebenaran” atau “melakukan keadilan.” Kata benda Ibrani ini dapat bermakna kebenaran, keadilan, atau apa yang benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: hidup
  rationale: Secara harfiah berarti “berjalan”, tetapi di sini merupakan ungkapan tentang cara hidup atau perilaku seseorang. “Hidup” menyampaikan makna idiomatis itu secara alami dalam bahasa Indonesia modern.
- source_word: תָּמִים
  choice: tak bercela
  rationale: Kata ini menunjuk pada keutuhan dan integritas moral dalam perilaku, bukan kesempurnaan mutlak tanpa dosa. “Tak bercela” mempertahankan kekuatan etisnya tanpa memakai istilah yang berarti sempurna secara absolut.
- source_word: וּפֹעֵל
  choice: melakukan
  rationale: Partisipel פעל menyatakan tindakan atau praktik yang dilakukan. “Melakukan” merupakan padanan alami dengan objek berikutnya.
- source_word: צֶדֶק
  choice: apa yang benar
  rationale: צֶדֶק dapat berarti kebenaran, keadilan, atau hal yang benar. Dalam daftar perilaku etis ini, “apa yang benar” alami dan cukup luas untuk mempertahankan nuansa moralnya.
- source_word: וְדֹבֵר
  choice: mengatakan
  rationale: דבר berarti berbicara atau mengatakan. “Mengatakan” berpadu secara alami dengan “kebenaran” dan mempertahankan kesejajaran tindakan dalam ayat ini.
- source_word: אֱמֶת
  choice: kebenaran
  rationale: Dalam hubungannya dengan tindakan berbicara, אֱמֶת terutama menunjuk pada kebenaran atau apa yang benar, meskipun kata itu juga dapat mengandung nuansa kesetiaan dan keterandalan.
- source_word: בִּלְבָבוֹ
  choice: dalam hatinya
  rationale: Padanan ini mempertahankan gambaran Ibrani tentang hati sebagai batin seseorang dan menjaga kemungkinan bahwa frasa tersebut menekankan ketulusan batin, bukan sekadar ucapan lahiriah.
theological_decisions:
- issue: Ungkapan maskulin tunggal yang mewakili siapa saja
  choice: Orang yang ... dalam hatinya
  alternative: Laki-laki yang ... dalam hatinya
  rationale: Bentuk Ibrani adalah maskulin tunggal, tetapi berfungsi secara generik untuk menggambarkan siapa pun yang memenuhi ciri tersebut. Bahasa Indonesia tidak mewajibkan penandaan gender pada “orang” atau akhiran pronomina, sehingga terjemahan ini mempertahankan cakupan generiknya tanpa menambahkan pembatasan khusus kepada laki-laki.
- issue: Integritas moral versus kesempurnaan tanpa dosa
  choice: tak bercela
  alternative: sempurna
  rationale: תָּמִים di sini menggambarkan keutuhan atau integritas perilaku. “Sempurna” dapat disalahpahami sebagai pernyataan bahwa orang tersebut sama sekali tanpa dosa, sesuatu yang tidak harus dinyatakan oleh istilah Ibrani ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan tiga tindakan sejajar dipertahankan. Ungkapan idiomatis “hidup” dipilih untuk הוֹלֵךְ agar makna cara hidup dapat dipahami secara alami, sedangkan “dalam hatinya” dipertahankan untuk menjaga citra batiniah teks Ibrani.
