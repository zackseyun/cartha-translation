  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: id
  text: 'Mazmur Daud[a].


    Ya, Yahweh, siapa yang boleh menumpang di kemah-Mu[b]?


    Siapa yang boleh berdiam di gunung-Mu yang kudus?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Mazmur oleh Daud” atau “Mazmur untuk Daud”; ungkapan Ibrani dapat menunjukkan kepengarangan, keterkaitan, atau peruntukan.
    reason: alternative_reading
  - marker: b
    text: Atau “Kemah Suci-Mu”; teks Ibrani secara harfiah berbunyi “kemah-Mu” dan kemungkinan membangkitkan gambaran tempat kudus sebagai kediaman Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku dan tepat untuk jenis syair atau nyanyian ibadah yang ditunjukkan oleh מִזְמוֹר.
- source_word: לְדָוִד
  choice: Daud
  rationale: Frasa judul “Mazmur Daud” alami dalam bahasa Indonesia dan, dengan catatan kaki, mempertahankan kemungkinan hubungan berupa kepengarangan, keterkaitan, atau persembahan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: יָגוּר
  choice: boleh menumpang
  rationale: גור menggambarkan tinggal sebagai pendatang atau tamu; “menumpang” mempertahankan nuansa itu dan membedakannya dari שׁכן pada baris berikutnya.
- source_word: בְּאָהֳלֶךָ
  choice: di kemah-Mu
  rationale: “Kemah” adalah arti konkret אֹהֶל dan tetap memungkinkan gema tempat kudus tanpa langsung mempersempitnya menjadi istilah teknis.
- source_word: יִשְׁכֹּן
  choice: boleh berdiam
  rationale: שׁכן berarti tinggal atau menetap; “berdiam” membentuk kesejajaran yang alami dengan “menumpang” sambil mempertahankan perbedaan nuansanya.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: di gunung-Mu yang kudus
  rationale: Terjemahan alami bagi ungkapan yang menunjuk pada gunung kudus milik Allah; “gunung” mempertahankan arti umum הַר.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan yang dinyatakan oleh לְדָוִד dalam judul
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud atau Mazmur untuk Daud
  rationale: Preposisi לְ dapat menyatakan kepengarangan, keterkaitan, atau peruntukan. Catatan kaki mempertahankan ketaksaan tersebut tanpa menetapkan satu tafsiran.
- issue: Gambaran kemah sebagai tempat kediaman Allah
  choice: kemah-Mu
  alternative: Kemah Suci-Mu atau tempat kediaman-Mu
  rationale: Terjemahan konkret ini mempertahankan citra Ibrani dan membiarkan kaitannya dengan tempat kudus tetap tersirat, sebagaimana dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya Yahweh” alami untuk seruan langsung. “Menumpang” dan “berdiam” menjaga kesejajaran puisi sekaligus membedakan nuansa tinggal sebagai tamu dari tinggal secara menetap. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan ejaan teks keagamaan Indonesia.
