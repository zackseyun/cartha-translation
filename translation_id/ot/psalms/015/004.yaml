  variant: modern standard Indonesian
source:
  edition: WLC
  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: id
  text: Di matanya, orang yang dipandang hina itu ditolak[a], tetapi ia menghormati orang-orang yang takut akan Yahweh; ia bersumpah, meskipun itu merugikan dirinya sendiri, dan tidak mengubahnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut terjemahan yang lebih tradisional: “Di matanya, orang tercela dipandang hina.” Klausa Ibrani ini padat dan dapat diterjemahkan dengan beberapa cara yang maknanya berdekatan.'
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “ia bersumpah untuk yang buruk dan tidak mengubah.” Ungkapan ini umumnya dipahami bahwa ia tidak mengubah atau menarik kembali sumpahnya, sekalipun sumpah itu ternyata merugikan dirinya sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה
  choice: orang yang dipandang hina
  rationale: Bentuk pasif/adjektival ini menunjuk kepada orang yang dipandang rendah. Pilihan ini mempertahankan bentuk Ibrani tanpa langsung menetapkan bahwa orang tersebut secara moral 'tercela'.
- source_word: בְּעֵינָיו
  choice: di matanya
  rationale: Ungkapan Ibrani ini menyatakan penilaian seseorang; metaforanya tetap jelas dan wajar dalam bahasa Indonesia.
- source_word: נִמְאָס
  choice: ditolak
  rationale: Kata kerja ini menyatakan penolakan atau anggapan bahwa seseorang tidak layak diterima. 'Ditolak' juga menghindari pengulangan kata 'hina'.
- source_word: יִרְאֵי יְהוָה
  choice: orang-orang yang takut akan Yahweh
  rationale: Ungkapan perjanjian ini menggambarkan orang yang hidup dengan rasa takut penuh hormat kepada Yahweh. Unsur 'takut' dipertahankan, bukan diperhalus menjadi sekadar 'menghormati'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: יְכַבֵּד
  choice: menghormati
  rationale: Bentuk piel dari כבד di sini berarti memberi hormat atau menganggap bernilai; 'menghormati' ringkas dan alami.
- source_word: נִשְׁבַּע
  choice: ia bersumpah
  rationale: Bentuk kini sesuai dengan rangkaian ciri kebiasaan atau watak orang benar dalam mazmur ini.
- source_word: לְהָרַע
  choice: sekalipun merugikan dirinya sendiri
  rationale: Frasa Ibrani ini eliptis. Terjemahan utama menyatakan pemahaman kontekstual yang lazim bahwa sumpah itu tetap dipegang walaupun akibatnya merugikan orang yang bersumpah, sementara kelugasan dan ambiguitas bentuk aslinya dicatat dalam catatan kaki.
- source_word: יָמִר
  choice: tidak mengubah sumpahnya
  rationale: Bentuk hiphil dari מור berarti mengubah atau menukar. Objek yang tersirat dijelaskan sebagai 'sumpahnya' agar kalimat Indonesia alami dan maksudnya jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna klausa padat נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: Di matanya, orang yang dipandang hina ditolak
  alternative: Di matanya, orang tercela dipandang hina
  rationale: Pilihan utama mempertahankan nuansa pasif kedua bentuk Ibrani dan tidak secara diam-diam menyamakan orang yang dihina dengan orang yang secara moral tercela. Bacaan tradisional yang berdekatan dicantumkan dalam catatan kaki.
- issue: Makna sumpah לְהָרַע
  choice: Ia menepati sumpah sekalipun hal itu merugikan dirinya sendiri
  alternative: Ia bersumpah untuk berbuat jahat atau mencelakakan
  rationale: Dalam konteks gambaran tentang orang berintegritas, frasa ini lazim dipahami sebagai kesetiaan pada sumpah walaupun mahal bagi diri sendiri. Karena bentuk Ibraninya eliptis, makna harfiahnya tetap dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. Metafora Ibrani 'di matanya' serta istilah 'takut akan Yahweh' dipertahankan karena keduanya alami dan penting secara konseptual. Klausa pertama dan frasa mengenai sumpah diberi catatan untuk menjaga ambiguitas asli.
