  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: id
  text: Ia tidak meminjamkan uangnya dengan bunga[a] dan tidak menerima suap untuk mencelakakan orang yang tidak bersalah. Orang yang melakukan semuanya ini tidak akan pernah goyah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan riba”; kata Ibrani נֶשֶׁךְ dapat berarti bunga yang dikenakan atas pinjaman.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak akan goyah untuk selama-lamanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: uangnya
  rationale: כֶּסֶף secara harfiah dapat berarti 'perak', tetapi dalam konteks pinjaman menunjuk pada uang; 'uangnya' merupakan padanan Indonesia yang alami dan tepat.
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: meminjamkan ... dengan bunga
  rationale: Ungkapan ini merujuk pada pemberian pinjaman yang dikenai bunga. 'Dengan bunga' jelas dalam bahasa Indonesia modern dan tidak mempersempit maknanya hanya pada bunga yang sangat tinggi.
- source_word: שֹׁחַד
  choice: suap
  rationale: Kata benda ini secara langsung berarti pemberian yang dimaksudkan untuk memengaruhi keputusan atau tindakan secara tidak benar; 'suap' mempertahankan daya hukum dan moralnya.
- source_word: עַל נָקִי
  choice: untuk mencelakakan orang yang tidak bersalah
  rationale: נָקִי berarti orang yang bebas dari kesalahan. Dalam konstruksi sesudah 'menerima suap', עַל menunjukkan tindakan yang diarahkan melawan orang tersebut; 'untuk mencelakakan' mengungkapkan maksud ini secara alami tanpa menentukan prosedur hukum tertentu.
- source_word: עֹשֵׂה אֵלֶּה
  choice: Orang yang melakukan semuanya ini
  rationale: Partisip ini menunjuk pada siapa pun yang dicirikan oleh tindakan-tindakan tersebut. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan acuan tunggal kolektif.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: tidak akan pernah goyah
  rationale: מוֹט dalam bentuk Nifal menggambarkan keadaan diguncangkan, bergeser, atau menjadi tidak teguh. Bersama לְעוֹלָם dan negasi, ungkapan ini secara idiomatis berarti 'tidak akan pernah goyah'.
theological_decisions:
- issue: Cakupan etis pemungutan נֶשֶׁךְ
  choice: Menerjemahkannya sebagai 'bunga' tanpa membatasi larangan hanya pada bunga yang berlebihan.
  alternative: riba
  rationale: נֶשֶׁךְ dapat menunjuk pada bunga yang dikenakan atas pinjaman. Dalam pemakaian Indonesia, 'riba' dapat membawa definisi keagamaan atau ekonomi yang lebih khusus; 'bunga' mempertahankan cakupan leksikal yang luas tanpa memasukkan kerangka doktrinal tertentu.
- issue: Sifat jaminan dalam לֹא יִמּוֹט לְעוֹלָם
  choice: Mempertahankan metafora keteguhan sebagai 'tidak akan pernah goyah'.
  alternative: tidak akan dipindahkan untuk selama-lamanya
  rationale: Teks menyatakan kestabilan tetap bagi orang yang hidup demikian, tetapi tidak menjelaskan bentuk atau ranah kestabilan itu. Terjemahan metaforis menghindari penentuan teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan kalimat yang mudah dipahami. Istilah ekonomi dan hukum dibuat jelas tanpa memakai ungkapan arkais atau memasukkan definisi denominatif.
