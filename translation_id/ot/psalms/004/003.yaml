source:
  edition: WLC
  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: id
  text: Ketahuilah bahwa Yahweh telah mengkhususkan orang saleh bagi diri-Nya sendiri[a]; Yahweh mendengar ketika aku berseru kepada-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah membedakan orang yang setia bagi diri-Nya sendiri.” Kata Ibrani yang diterjemahkan “orang saleh” dapat menekankan kesetiaan dalam hubungan perjanjian ataupun kesalehan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Yahweh akan mendengar ketika aku berseru kepada-Nya.” Bentuk kata kerja Ibrani dapat dipahami sebagai tindakan yang biasa berlaku atau sebagai masa depan yang diyakini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: Ketahuilah
  rationale: Bentuk imperatif jamak memanggil para pendengar untuk mengakui suatu kenyataan. Konjungsi pembuka tidak perlu diterjemahkan secara tersendiri agar kalimat Indonesia tetap alami; konteks juga tidak mewajibkan nuansa pertentangan seperti “tetapi”.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang harus diketahui dan paling alami diterjemahkan “bahwa” sesudah kata kerja mengetahui.
- source_word: הִפְלָה
  choice: telah mengkhususkan
  rationale: Bentuk Hifil dari פלא di sini menyatakan tindakan membuat seseorang berbeda atau memperlakukannya secara khusus. “Mengkhususkan” mempertahankan gagasan pembedaan bagi Yahweh tanpa menambahkan cara atau tujuan yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: חָסִיד
  choice: orang saleh
  rationale: Istilah tunggal ini menunjuk kepada orang yang bercirikan kesetiaan, pengabdian, atau kesalehan. “Orang saleh” jelas dan wajar dalam bahasa Indonesia, sementara keluasan maknanya dijelaskan dalam catatan kaki.
- source_word: לוֹ
  choice: bagi diri-Nya sendiri
  rationale: Preposisi dengan sufiks pronominal menunjuk kepada Yahweh sebagai pihak yang bagi-Nya orang itu dikhususkan. Bentuk refleksif ini memperjelas rujukannya dalam bahasa Indonesia.
- source_word: יִשְׁמַע
  choice: mendengar
  rationale: Bentuk imperfek dapat menyatakan tindakan yang biasa berlaku atau keyakinan akan tindakan mendatang. Bentuk kini “mendengar” mengungkapkan keyakinan pemazmur tanpa meniadakan kemungkinan makna futur.
- source_word: בְּקָרְאִי
  choice: ketika aku berseru
  rationale: Infinitif konstruk dengan ב menyatakan keadaan temporal. “Ketika aku berseru” alami dalam bahasa Indonesia dan cocok dengan konteks doa.
- source_word: אֵלָיו
  choice: kepada-Nya
  rationale: Preposisi ini menunjukkan arah seruan kepada Yahweh; “kepada-Nya” merupakan ungkapan Indonesia yang langsung dan idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna חָסִיד
  choice: orang saleh
  alternative: orang yang setia atau orang yang berpegang pada perjanjian
  rationale: Kata ini memuat unsur kesalehan sekaligus kesetiaan relasional/perjanjian. Teks tidak mengharuskan satu nuansa dipilih secara eksklusif, sehingga alternatif yang sah dicatat.
- issue: Aspek waktu יִשְׁמַע
  choice: mendengar
  alternative: akan mendengar
  rationale: Imperfek Ibrani dapat dipahami sebagai tindakan yang tetap atau sebagai masa depan yang diyakini. Terjemahan utama memakai pernyataan kini, sedangkan kemungkinan futur dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Bentuk tunggal “orang saleh” dipertahankan sesuai teks Ibrani. Pronomina yang merujuk kepada Yahweh ditulis dengan huruf kapital menurut kebiasaan umum penerbitan Alkitab bahasa Indonesia.
