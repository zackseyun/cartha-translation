  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינ֗וֹת מִזְמ֥וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/000.yaml
  text: 'For the choirmaster: with stringed instruments. A psalm of David[a].'
translation:
  language: id
  text: 'Untuk pemimpin musik: dengan alat-alat musik berdawai. Mazmur Daud.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mazmur oleh Daud” atau “Mazmur untuk Daud”; ungkapan Ibrani dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Ungkapan ini jelas, modern, dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: בִּנְגִינוֹת
  choice: dengan alat-alat musik berdawai
  rationale: Kata ini dalam judul mazmur merujuk pada musik atau instrumen berdawai. Terjemahan ini mempertahankan petunjuk musikal tanpa menentukan cara memainkannya.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah istilah baku dan tepat dalam bahasa Indonesia untuk label jenis syair atau nyanyian ibadah tersebut.
- source_word: לְדָוִד
  choice: Daud
  rationale: Susunan “Mazmur Daud” alami dalam bahasa Indonesia dan tetap cukup luas untuk menyatakan kepengarangan, hubungan, atau peruntukan; catatan kaki menjelaskan cakupan ungkapan Ibraninya.
theological_decisions:
- issue: Kepengarangan atau hubungan yang dinyatakan oleh לְדָוִד dalam judul mazmur
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud; Mazmur untuk Daud
  rationale: Preposisi Ibrani dapat menunjukkan kepengarangan, hubungan, kepemilikan, atau peruntukan. Teks utama memakai bentuk tradisional yang ringkas, sedangkan catatan kaki mempertahankan ambiguitasnya dan tidak menetapkan klaim historis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Pemimpin musik” dipilih karena lebih mudah dipahami pembaca masa kini daripada “pemimpin biduan”. Penanda catatan kaki ditempatkan tepat sesudah “Daud”, unsur yang dijelaskannya.
