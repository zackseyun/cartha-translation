  text: נָתַ֣תָּה שִׂמְחָ֣ה בְ/לִבִּ֑/י מֵ/עֵ֬ת דְּגָנָ֖/ם וְ/תִֽירוֹשָׁ֣/ם רָֽבּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: id
  text: Engkau telah menaruh sukacita dalam hatiku, lebih besar daripada sukacita ketika gandum dan anggur baru mereka berlimpah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah, “sejak gandum dan anggur baru mereka bertambah.” Frasa Ibrani ini umumnya dipahami sebagai perbandingan: sukacita yang Allah berikan melampaui sukacita karena kelimpahan hasil bumi.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Engkau telah menaruh
  rationale: Bentuk Qal perfek orang kedua tunggal maskulin ditujukan kepada Allah. Ungkapan ini menyatakan tindakan yang telah dilakukan dengan dampak yang tetap dirasakan.
- source_word: שִׂמְחָה
  choice: sukacita
  rationale: Nomina ini menunjuk pada kegembiraan batin; “sukacita” alami, bermartabat, dan sesuai dengan konteks doa.
- source_word: בְלִבִּי
  choice: dalam hatiku
  rationale: לֵב menunjuk pada pusat batin manusia. Terjemahan ini mempertahankan gambaran lokasi batin tanpa mempersempit maknanya.
- source_word: מֵעֵת
  choice: lebih besar daripada ... ketika
  rationale: מִן bersama עֵת lazim dipahami memperkenalkan tolok ukur perbandingan. Penambahan “sukacita” sesudah “daripada” membuat hubungan perbandingan jelas dan alami dalam bahasa Indonesia.
- source_word: דְּגָנָם
  choice: gandum ... mereka
  rationale: דגן berarti hasil biji-bijian atau gandum. “Gandum” mudah dipahami dan mempertahankan gambaran hasil panen.
- source_word: וְתִירוֹשָׁם
  choice: dan anggur baru mereka
  rationale: תירוש biasanya menunjuk pada anggur baru atau hasil anggur segar, bukan sekadar anggur secara umum.
- source_word: רָבּוּ
  choice: berlimpah
  rationale: Bentuk Qal perfek jamak dari רבה menyatakan menjadi banyak atau bertambah. “Berlimpah” menyampaikan kelimpahan hasil pertanian secara wajar.
theological_decisions:
- issue: Sintaksis perbandingan dalam ayat ini
  choice: Sukacita batin pemberian Allah lebih besar daripada sukacita yang menyertai kelimpahan gandum dan anggur baru.
  alternative: 'Frasa itu dapat diterjemahkan secara lebih harfiah: “sejak gandum dan anggur baru mereka bertambah.”'
  rationale: מֵעֵת umumnya dipahami sebagai pengantar tolok ukur perbandingan. Namun, karena susunan Ibraninya dapat dibaca secara lebih harfiah sebagai penanda waktu, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Sapaan “Engkau” menandai bahwa pemazmur berbicara langsung kepada Allah. Pengulangan “sukacita” memperjelas unsur yang dibandingkan tanpa menghilangkan kemungkinan sintaksis lain, yang dicatat dalam catatan kaki.
