  text: רִגְז֗וּ וְֽ/אַל תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭/לְבַבְ/כֶם עַֽל מִשְׁכַּבְ/כֶ֗ם וְ/דֹ֣מּוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: id
  text: Gemetarlah[a] dan jangan berbuat dosa; berbicaralah dalam hati kalian di tempat tidur kalian, dan diamlah.[b] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Marahlah, tetapi jangan berbuat dosa.” Kata kerja Ibrani ini dapat berarti gemetar, mengalami gejolak, atau marah.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “tenanglah” atau “berdiamlah.”'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: רִגְזוּ
  choice: Gemetarlah
  rationale: Kata kerja רגז dapat menunjuk pada gemetar, kegelisahan, atau kemarahan. “Gemetarlah” mempertahankan gejolak emosi tanpa membatasinya hanya pada kemarahan dan sesuai dengan gerak ayat menuju perenungan serta keheningan.
- source_word: וְאַל תֶּחֱטָאוּ
  choice: dan jangan berbuat dosa
  rationale: Larangan langsung dengan חטא diterjemahkan secara lugas dan wajar dalam bahasa Indonesia.
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: berbicaralah dalam hati kalian
  rationale: Terjemahan ini mempertahankan daya verbal אמר dan ungkapan antropologis Ibrani tentang percakapan batin. “Kalian” menyatakan bahwa perintah dan akhiran pronominalnya berbentuk jamak.
- source_word: עַל מִשְׁכַּבְכֶם
  choice: di tempat tidur kalian
  rationale: Frasa ini menunjukkan tempat perenungan pribadi, kemungkinan pada malam hari; bentuk jamak pada akhiran pronominal dipertahankan.
- source_word: וְדֹמּוּ
  choice: lalu diamlah
  rationale: דמם dapat berarti menjadi diam atau tenang/tidak bergerak. “Diamlah” alami dalam konteks ucapan batin sebelumnya, sementara kemungkinan nuansa ketenangan dicatat dalam catatan kaki.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna istilah liturgis ini tidak pasti; transliterasi tradisional mempertahankan penanda Ibrani tanpa menebak artinya.
theological_decisions:
- issue: Makna רגזו dalam kaitannya dengan larangan berbuat dosa
  choice: Seruan untuk gemetar atau mengalami gejolak, tetapi tidak berbuat dosa
  alternative: Marahlah, tetapi jangan berbuat dosa
  rationale: Konteks bergerak dari gejolak menuju percakapan batin dan keheningan, sehingga arti yang lebih luas, “gemetar,” dipilih. Namun, arti “marah” memang dimungkinkan secara leksikal dan dipertahankan dalam catatan kaki agar ketegangan tafsir tidak dihapus.
- issue: Makna דמם sebagai diam atau tenang
  choice: diamlah
  alternative: tenanglah atau berdiam dirilah
  rationale: Konteks langsung tentang berbicara dalam hati mendukung nuansa keheningan, tetapi kata Ibraninya juga dapat mencakup keadaan tenang atau tidak bergerak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. Bentuk “kalian” dipakai untuk memperlihatkan sapaan jamak dalam teks Ibrani. Susunan perintah dan pergerakan retoris dari gejolak menuju pemeriksaan batin dan keheningan dipertahankan.
