  text: בְּ/שָׁל֣וֹם יַחְדָּו֮ אֶשְׁכְּבָ֪ה וְ/אִ֫ישָׁ֥ן כִּֽי אַתָּ֣ה יְהוָ֣ה לְ/בָדָ֑ד לָ֝/בֶ֗טַח תּוֹשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/008.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: id
  text: Dengan damai aku akan berbaring dan tidur[a], sebab hanya Engkau, ya Yahweh,[b] yang membuat aku tinggal dengan aman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “Dengan damai, bersama-sama aku akan berbaring dan tidur.” Kata keterangan Ibrani dapat berarti “bersama-sama” atau “sekaligus”; dalam teks utama, kedua tindakan dihubungkan secara erat.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sebab Engkau, ya Yahweh, membuat aku tinggal sendirian dengan aman.” Bahasa Ibraninya juga dapat dipahami dengan “sendirian” menerangkan keadaan pemazmur, bukan “hanya Engkau.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: Dengan damai
  rationale: שָׁלוֹם mencakup damai, kesejahteraan, dan keutuhan. “Dengan damai” alami dalam konteks istirahat yang tenteram dan mempertahankan kaitannya dengan rasa aman pada akhir ayat.
- source_word: יַחְדָּו
  choice: berbaring lalu tidur
  rationale: יַחְדָּו secara harfiah dapat berarti “bersama-sama” atau “sekaligus.” Dalam rangkaian dua verba ini, bahasa Indonesia paling alami menyatakan kesatuan erat kedua tindakan dengan “lalu”; kemungkinan arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: אֶשְׁכְּבָה
  choice: aku akan berbaring
  rationale: Bentuk imperfek di sini menyatakan kehendak atau keyakinan akan tindakan yang segera dilakukan. “Aku akan berbaring” mempertahankan pernyataan penuh percaya pemazmur.
- source_word: וְאִישָׁן
  choice: lalu tidur
  rationale: ישן dalam qal berarti “tidur.” “Lalu tidur” merupakan pasangan yang alami dengan “berbaring” dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan pemazmur dapat beristirahat dengan damai. “Sebab” ringkas, wajar, dan sesuai dengan ragam puitis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh,” sehingga nama pribadi dalam teks Ibrani tidak diganti dengan gelar.
- source_word: לְבָדָד
  choice: hanya Engkau
  rationale: לְבָדָד berarti “sendiri” atau “seorang diri.” Dalam susunan ini, kata tersebut paling wajar menerangkan Yahweh sebagai satu-satunya yang memberikan keamanan. Kemungkinan bahwa kata ini menerangkan keadaan pemazmur dicatat dalam catatan kaki.
- source_word: לָבֶטַח
  choice: dengan aman
  rationale: בֶּטַח menunjukkan keadaan aman atau terlindung. “Dengan aman” merupakan padanan Indonesia yang alami bersama verba “tinggal.”
- source_word: תּוֹשִׁיבֵנִי
  choice: membuat aku tinggal
  rationale: Bentuk hifil dari ישׁב bersifat kausatif, yakni “menyebabkan aku tinggal.” “Membuat aku tinggal” mempertahankan daya kausatifnya tanpa terasa terlalu teknis.
theological_decisions:
- issue: Acuan dan fungsi לְבָדָד
  choice: 'Kata itu menerangkan Yahweh: hanya Yahweh yang membuat pemazmur tinggal dengan aman.'
  alternative: 'Kata itu dapat menerangkan pemazmur: Yahweh membuatnya tinggal sendirian dengan aman.'
  rationale: Urutan kata dan alur pemikiran lebih mendukung penekanan pada Yahweh sebagai satu-satunya sumber keamanan. Namun, tata bahasa Ibrani memungkinkan kata tersebut dikaitkan dengan keadaan pemazmur, sehingga ketegangan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan mudah dipahami. Susunan kalimat mempertahankan deklarasi kepercayaan pemazmur serta hubungan sebab-akibat dalam teks Ibrani. Nama ilahi ditampilkan sebagai “Yahweh,” dan ambiguitas sintaksis utama tidak diselesaikan secara diam-diam.
