  text: בְּ/קָרְאִ֡/י עֲנֵ֤/נִי אֱלֹ֘הֵ֤י צִדְקִ֗/י בַּ֭/צָּר הִרְחַ֣בְתָּ לִּ֑/י חָ֝נֵּ֗/נִי וּ/שְׁמַ֥ע תְּפִלָּתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: id
  text: Ketika aku berseru, jawablah aku, ya Allah, kebenaranku.[a] Dalam kesesakan, Engkau telah memberi ruang bagiku.[b] Kasihanilah aku dan dengarkanlah doaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Allah kebenaranku.” Dapat juga diterjemahkan “Allahku yang benar” atau dipahami sebagai “Allah yang membenarkan aku.”
    reason: alternative_reading
  - marker: b
    text: Atau, “Engkau telah memberi kelegaan kepadaku.” Secara harfiah, kata kerja ini menggambarkan tindakan membuat luas atau memberi ruang keluar dari kesesakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: Ketika aku berseru
  rationale: Konstruksi ב dengan infinitif dan sufiks orang pertama tunggal berfungsi temporal. Dalam konteks doa, קרא secara alami diterjemahkan 'berseru' tanpa harus menambahkan kadar emosi yang tidak dinyatakan.
- source_word: עֲנֵנִי
  choice: jawablah aku
  rationale: ענה di sini berarti menjawab atau menanggapi; 'jawablah aku' merupakan ungkapan doa yang langsung dan alami.
- source_word: אֱלֹהֵי צִדְקִי
  choice: ya Allah sumber kebenaranku
  rationale: Rangkaian konstruksi harfiahnya 'Allah kebenaranku'. Penambahan 'sumber' menghasilkan bahasa Indonesia yang wajar sambil mempertahankan hubungan terbuka antara Allah dan kebenaran atau pembenaran pemazmur; alternatif dicatat dalam catatan kaki.
- source_word: בַּצָּר
  choice: Dalam kesesakan
  rationale: צַר menunjuk pada keadaan sempit secara kiasan, yaitu tekanan atau kesusahan. 'Kesesakan' mempertahankan gema citra ruang yang berlanjut dalam verba berikutnya.
- source_word: הִרְחַבְתָּ לִּי
  choice: Engkau telah memberi kelegaan kepadaku
  rationale: Bentuk kausatif רחב berarti membuat luas atau memberi ruang. 'Memberi kelegaan' alamiah dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan citra ruang aslinya.
- source_word: חָנֵּנִי
  choice: Kasihanilah aku
  rationale: חנן berarti menunjukkan kemurahan atau anugerah. Dalam permohonan doa bahasa Indonesia, 'kasihanilah aku' menyampaikan permohonan belas kasih secara alami dan bermartabat.
- source_word: וּשְׁמַע תְּפִלָּתִי
  choice: dan dengarkanlah doaku
  rationale: שמע dalam bahasa doa mencakup mendengar dengan penuh perhatian; 'dengarkanlah' menyatakan nuansa itu, dan תְּפִלָּה secara langsung berarti doa.
theological_decisions:
- issue: Makna אֱלֹהֵי צִדְקִי, secara harfiah 'Allah kebenaranku'
  choice: Allah sumber kebenaranku
  alternative: Allahku yang benar; Allah yang membenarkan aku; Allah kebenaranku
  rationale: Teks utama memakai ungkapan Indonesia yang dapat dipahami tanpa membatasi frasa hanya pada sifat Allah atau hanya pada tindakan pembenaran-Nya. Catatan kaki menyatakan bentuk harfiah dan kemungkinan pembacaan lain agar ketegangan teologis Ibrani tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan mudah dipahami. Kapitalisasi kata ganti ilahi dipakai sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Citra kesempitan dan kelapangan dipertahankan melalui 'kesesakan' serta dijelaskan dalam catatan kaki.
