  text: רַבִּ֥ים אֹמְרִים֮ מִֽי יַרְאֵ֪/נ֫וּ ט֥וֹב נְֽסָ/ה עָ֭לֵי/נוּ א֨וֹר פָּנֶ֬י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: id
  text: Banyak orang berkata, “Siapa yang akan memperlihatkan kepada kita hal yang baik?[a] Pancarkanlah cahaya wajah-Mu atas kami,[b] ya Yahweh.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Siapa yang akan membuat kita melihat hal yang baik?” Kata kerja Ibraninya berbentuk kausatif.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “cahaya wajah-Mu”, ungkapan puitis yang menggambarkan perkenanan atau kehadiran Allah yang penuh anugerah.
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: YHWH, yang secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: Banyak orang berkata
  rationale: רַבִּים dipakai secara substantival untuk sekumpulan orang, sedangkan bentuk partisip אֹמְרִים menggambarkan perkataan yang sedang berlangsung atau lazim mereka ucapkan. Ungkapan ini alami dalam bahasa Indonesia tanpa menambahkan penekanan yang tidak tersurat.
- source_word: מִי יַרְאֵנוּ טוֹב
  choice: Siapa yang akan memperlihatkan kebaikan kepada kita?
  rationale: Bentuk Hifil יַרְאֵנוּ bersifat kausatif, yaitu ‘membuat kami melihat’ atau ‘memperlihatkan kepada kami’. טוֹב dibiarkan luas sebagai ‘kebaikan’, tanpa dipersempit menjadi kemakmuran atau keuntungan materi.
- source_word: נְסָה עָלֵינוּ
  choice: Angkatlah ... atas kami
  rationale: Terjemahan ini mempertahankan bentuk permohonan dan citra puitis bahwa cahaya wajah Allah diangkat atau terpancar di atas umat, sekalipun ungkapannya tidak biasa dalam bahasa Indonesia.
- source_word: אוֹר פָּנֶיךָ
  choice: cahaya wajah-Mu
  rationale: Terjemahan harfiah ini mempertahankan metafora antropomorfis Ibrani bagi perkenanan dan kehadiran Allah, alih-alih menggantinya dengan tafsiran dalam teks utama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar ‘TUHAN’.
theological_decisions:
- issue: Makna luas טוֹב
  choice: kebaikan
  alternative: kemakmuran; hal yang baik
  rationale: ‘Kebaikan’ menjaga keluasan makna yang dapat mencakup kesejahteraan, manfaat, dan keadaan baik tanpa menentukan satu jenis berkat tertentu.
- issue: Metafora ‘cahaya wajah-Mu’
  choice: Mempertahankan metafora dalam teks utama
  alternative: perkenanan-Mu; cahaya hadirat-Mu
  rationale: Citra wajah Allah yang bercahaya mengungkapkan perkenanan atau kehadiran-Nya, tetapi puisi Ibrani tidak menyatakannya secara datar. Metafora dipertahankan agar ketegangan dan kekayaan gambarnya tidak hilang.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Ayat ini memakai nama diri ilahi YHWH. ‘Yahweh’ mempertahankan nama tersebut, sedangkan ‘TUHAN’ merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan doa langsung dipertahankan di dalam kutipan. Bentuk ‘wajah-Mu’ menjaga citra puisi Ibrani, sedangkan ‘ya Yahweh’ merupakan sapaan yang alami dalam doa bahasa Indonesia.
