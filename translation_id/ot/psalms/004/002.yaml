  text: בְּנֵ֥י אִ֡ישׁ עַד מֶ֬ה כְבוֹדִ֣/י לִ֭/כְלִמָּה תֶּאֱהָב֣וּ/ן רִ֑יק תְּבַקְשׁ֖וּ כָזָ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/002.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: id
  text: Hai anak-anak manusia, sampai kapan kalian menjadikan kemuliaanku kehinaan, mencintai kesia-siaan, dan mencari kebohongan? Sela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: anak-anak manusia
  rationale: Mempertahankan sapaan idiomatis Ibrani dalam bentuk jamak maskulin dan daya retorisnya; dalam bahasa Indonesia ungkapan ini tetap dapat dipahami sebagai sapaan kepada para lawan manusia.
- source_word: עַד מֶה
  choice: sampai kapan
  rationale: Padanan Indonesia yang alami bagi pertanyaan protes temporal dalam puisi Ibrani.
- source_word: כְבוֹדִי
  choice: kemuliaanku
  rationale: כָּבוֹד dapat berarti kemuliaan, kehormatan, atau bobot. 'Kemuliaanku' mempertahankan keluasan leksikal dan ambiguitas mengenai martabat atau kedudukan pemazmur.
- source_word: לִכְלִמָּה
  choice: dijadikan kehinaan
  rationale: Preposisi לְ menyatakan arah atau hasil; konstruksi verbal pasif ini mengungkapkan perubahan dari kemuliaan menjadi kehinaan secara alami dalam bahasa Indonesia.
- source_word: תֶּאֱהָבוּן
  choice: kamu mencintai
  rationale: Bentuk imperfek orang kedua jamak dalam teguran retoris dapat menunjukkan tindakan yang terus berlangsung; aspek itu dibawa oleh pengulangan 'sampai kapan'.
- source_word: רִיק
  choice: kesia-siaan
  rationale: Mencakup kekosongan, ketidakbergunaan, dan hal yang tanpa isi, serta membentuk nomina abstrak yang sejajar dengan 'kebohongan'.
- source_word: תְּבַקְשׁוּ
  choice: mencari
  rationale: Padanan langsung dan alami untuk בקשׁ yang mempertahankan paralelisme puitis.
- source_word: כָזָב
  choice: kebohongan
  rationale: Mempertahankan bentuk nomina abstrak tunggal serta kesejajarannya dengan 'kesia-siaan'; dapat mencakup dusta dan kepalsuan.
- source_word: סֶלָה
  choice: Sela
  rationale: Ditransliterasikan karena fungsi tepat istilah liturgis atau musikal ini tidak pasti.
theological_decisions:
- issue: Rujukan 'kemuliaanku'
  choice: Tidak diperjelas apakah yang dimaksud ialah martabat pribadi, kehormatan kerajaan, atau kemuliaan yang dianugerahkan Allah.
  alternative: kehormatanku; kemuliaan yang Allah berikan kepadaku
  rationale: Teks Ibrani hanya menyatakan 'kemuliaanku' dan memungkinkan beberapa nuansa yang saling berkaitan; terjemahan tidak mempersempitnya kepada satu penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat. Pengulangan 'sampai kapan' pada klausa kedua memperjelas cakupan pertanyaan Ibrani dan menghasilkan teguran yang alami tanpa mengubah makna. 'Kamu' dipakai sebagai pronomina jamak menurut konteks sapaan.
