  text: זִבְח֥וּ זִבְחֵי צֶ֑דֶק וּ֝/בִטְח֗וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: id
  text: Persembahkanlah korban yang benar[a], dan percayalah kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “korban-korban kebenaran” atau “korban-korban keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: Persembahkanlah kurban-kurban
  rationale: Imperatif jamak dan nomina serumpun menunjuk tindakan mempersembahkan kurban. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan nuansa kultis dan, sejauh wajar, pengulangan leksikal sumber.
- source_word: צֶדֶק
  choice: kebenaran
  rationale: Kata ini mencakup kebenaran, keadilan, dan apa yang tepat menurut tatanan perjanjian. Bentuk genitif dipertahankan agar ayat tidak dipersempit hanya kepada ketepatan ritual atau ketulusan moral.
- source_word: וּבִטְחוּ אֶל
  choice: dan percayalah kepada
  rationale: Imperatif jamak בטח menyatakan kepercayaan atau rasa aman yang diarahkan kepada Yahweh. 'Percayalah kepada' merupakan ungkapan Indonesia yang langsung dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Makna זִבְחֵי צֶדֶק, 'kurban-kurban kebenaran'
  choice: Mempertahankan konstruksi yang dapat berarti kurban yang bercirikan kebenaran atau kurban yang benar/semestinya.
  alternative: Persembahkanlah kurban-kurban yang benar; atau persembahkanlah kurban-kurban keadilan.
  rationale: Frasa Ibrani dapat mencakup ketulusan etis, ibadah yang tepat, tuntutan keadilan, atau gabungan semuanya. Terjemahan utama menjaga keluasan dan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk jamak eksplisit dipakai untuk mencerminkan nomina jamak Ibrani; akhiran -lah menyampaikan daya imperatif secara alami.
