  variant: modern standard Indonesian
source:
  edition: WLC
  text: זָ֘כַ֤ר חַסְדּ֨/וֹ וֶֽ/אֱֽמוּנָת/וֹ֮ לְ/בֵ֪ית יִשְׂרָ֫אֵ֥ל רָא֥וּ כָל אַפְסֵי אָ֑רֶץ אֵ֝֗ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: id
  text: Ia telah mengingat kasih setia-Nya dan kesetiaan-Nya kepada kaum Israel; seluruh ujung bumi telah melihat keselamatan Allah kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan Allah kita”; dalam konteks mazmur, kata Ibrani ini juga dapat mengandung arti tindakan penyelamatan yang membawa kemenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: telah mengingat
  rationale: Bentuk perfektif menyatakan tindakan yang sudah dilakukan dan kini dirayakan; ungkapan ini tetap mempertahankan gambaran Ibrani tentang Allah yang mengingat, yakni bertindak sesuai komitmen-Nya.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד menunjuk pada kasih yang loyal dan teguh dalam hubungan perjanjian; 'kasih setia' alami dalam bahasa Indonesia dan mempertahankan nuansa tersebut.
- source_word: וֶאֱמוּנָתוֹ
  choice: dan kesetiaan-Nya
  rationale: אֱמוּנָה di sini menyatakan keandalan atau kesetiaan Allah, sejajar dengan חֶסֶד, bukan terutama kebenaran sebagai gagasan abstrak.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: kepada kaum Israel
  rationale: '''Kaum Israel'' menyampaikan makna kolektif idiom ''rumah Israel'' dalam bahasa Indonesia modern, sedangkan ''kepada'' mempertahankan arah hubungan yang ditandai לְ.'
- source_word: רָאוּ
  choice: telah melihat
  rationale: Bentuk perfektif menggambarkan tindakan penyelamatan yang sudah disaksikan oleh seluruh bumi dan relevan bagi pujian saat ini.
- source_word: כָל אַפְסֵי אָרֶץ
  choice: seluruh ujung bumi
  rationale: Ungkapan ini merupakan idiom bagi semua wilayah yang paling jauh; bentuk Indonesia tersebut ringkas, puitis, dan mudah dipahami.
- source_word: אֵת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai objek langsung dalam bahasa Ibrani dan fungsinya sudah terwakili oleh susunan kalimat Indonesia.
- source_word: יְשׁוּעַת
  choice: keselamatan
  rationale: Kata ini mencakup tindakan menyelamatkan atau membebaskan dan dalam konteks mazmur dapat bernuansa kemenangan; 'keselamatan' mempertahankan cakupan makna yang luas.
- source_word: אֱלֹהֵינוּ
  choice: dari Allah kita
  rationale: Rangkaian konstruksi Ibrani secara harfiah berarti 'keselamatan Allah kita'. 'Dari Allah kita' menyatakan secara alami bahwa keselamatan itu berasal dari atau dikerjakan oleh Allah tanpa mempersempit bentuk tindakan penyelamatan-Nya.
theological_decisions:
- issue: Nuansa perjanjian dalam חֶסֶד dan אֱמוּנָה
  choice: '''kasih setia'' dan ''kesetiaan'''
  alternative: '''belas kasihan'' dan ''kebenaran'''
  rationale: Pasangan terpilih menampilkan kasih loyal dan keandalan Allah terhadap Israel tanpa menjadikannya sekadar rasa iba atau kebenaran abstrak.
- issue: Cakupan יְשׁוּעַת אֱלֹהֵינוּ
  choice: '''keselamatan dari Allah kita'''
  alternative: '''pembebasan Allah kita'' atau ''kemenangan Allah kita'''
  rationale: Bahasa Ibrani dapat mencakup pembebasan dan tindakan penyelamatan yang berkemenangan, tetapi tidak mengharuskan makna kemenangan militer. 'Keselamatan' menjaga keluasan teologis dan ambiguitas kontekstualnya.
- issue: Makna tindakan Allah 'mengingat'
  choice: mempertahankan ungkapan 'telah mengingat'
  alternative: menjelaskan sebagai 'telah bertindak sesuai dengan'
  rationale: Teks memakai bahasa ingatan ilahi. Terjemahan mempertahankan metafora itu dan tidak mengubahnya menjadi penjelasan teologis eksplisit, meskipun dalam konteks maknanya mencakup tindakan Allah sesuai kesetiaan-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Kaum Israel' dipilih daripada bentuk harfiah 'rumah Israel' agar makna kolektifnya langsung dipahami. Pengulangan 'setia' dalam 'kasih setia-Nya dan kesetiaan-Nya' sengaja dipertahankan karena mencerminkan dua istilah Ibrani yang berbeda tetapi saling melengkapi.
