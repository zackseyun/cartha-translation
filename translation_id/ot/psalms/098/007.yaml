  text: יִרְעַ֣ם הַ֭/יָּם וּ/מְלֹא֑/וֹ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/007.yaml
  text: Let the sea roar[a], and all that fills it[b], the world and those who dwell in it.
translation:
  language: id
  text: Biarlah laut bergemuruh bersama segala isinya, dunia bersama semua yang mendiaminya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְעַם
  choice: Biarlah ... bergemuruh
  rationale: Bentuk imperfek dalam konteks ajakan pujian paling wajar dipahami secara yusif. “Bergemuruh” menyampaikan bunyi kuat seperti deru atau guntur dengan gaya puitis yang alami.
- source_word: הַיָּם
  choice: laut
  rationale: Padanan baku dan alami untuk יָם dalam konteks puisi.
- source_word: וּמְלֹאוֹ
  choice: bersama segala isinya
  rationale: Secara harfiah berarti “dan kepenuhannya,” yakni segala sesuatu yang berada di dalam atau memenuhi laut. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan rujukan sufiks kepada laut.
- source_word: תֵּבֵל
  choice: dunia
  rationale: תֵּבֵל menunjuk pada dunia sebagai bumi yang teratur dan didiami. “Dunia” ringkas, lazim, dan diperjelas oleh frasa berikutnya.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: bersama semua yang mendiaminya
  rationale: Partisip Ibrani berarti orang-orang yang tinggal di dalamnya. “Semua yang mendiaminya” mempertahankan nuansa verbal dan kesejajaran puitis dengan “segala isinya.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan “bersama” memperjelas bahwa laut beserta isinya dan dunia beserta penghuninya sama-sama diajak bergemuruh dalam pujian, tanpa menambahkan penafsiran teologis khusus.
