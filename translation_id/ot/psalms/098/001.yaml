  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/001.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: id
  text: Mazmur. Nyanyikanlah nyanyian baru bagi Yahweh, sebab Ia telah melakukan perbuatan-perbuatan ajaib; tangan kanan-Nya dan lengan kudus-Nya telah mendatangkan kemenangan bagi-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah menyelamatkan-Nya” atau “telah mendatangkan keselamatan bagi-Nya.” Ungkapan Ibrani ini dapat diterjemahkan lebih harfiah, tetapi dalam konteksnya menyatakan bahwa kuasa Yahweh sendiri menghasilkan keselamatan atau kemenangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Judul atau penanda jenis syair; “Mazmur” merupakan padanan baku, jelas, dan sesuai dengan konteks kitab.
- source_word: שִׁירוּ
  choice: Nyanyikanlah
  rationale: Imperatif jamak dari שׁיר. Bentuk ini menyampaikan perintah langsung kepada umat tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai pihak yang menjadi tujuan nyanyian, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” sesuai sumber dan lapisan konsultasi.
- source_word: שִׁיר חָדָשׁ
  choice: nyanyian baru
  rationale: Padanan alami dan cukup formal bagi ungkapan puitis yang lazim dalam Mazmur.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah untuk bernyanyi; “sebab” alami dalam ragam puitis Indonesia.
- source_word: נִפְלָאוֹת עָשָׂה
  choice: Ia telah melakukan perbuatan-perbuatan ajaib
  rationale: נִפְלָאוֹת menunjuk pada tindakan yang membangkitkan kekaguman. Bentuk perfektif diterjemahkan sebagai tindakan yang telah dilakukan dan tetap menjadi dasar pujian.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: telah memperoleh kemenangan bagi-Nya
  rationale: Secara harfiah ungkapan ini dekat dengan “telah menyelamatkan bagi-Nya”; dalam konteks gambaran kuasa ilahi, maksudnya ialah tangan dan lengan Yahweh sendiri menghasilkan keselamatan atau kemenangan bagi-Nya. Pilihan ini mempertahankan unsur hasil dan frasa לּוֹ tanpa menyiratkan bahwa Yahweh perlu diselamatkan dari bahaya.
- source_word: יְמִינוֹ
  choice: tangan kanan-Nya
  rationale: Mempertahankan gambaran antropomorfis Ibrani tentang kuasa dan tindakan.
- source_word: וּזְרֹעַ קָדְשׁוֹ
  choice: dan lengan-Nya yang kudus
  rationale: Padanan alami bagi konstruksi posesif Ibrani dan mempertahankan paralelisme dengan “tangan kanan-Nya”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Transliterasi “Yahweh” mempertahankan nama khusus ilahi sebagaimana diminta oleh bukti sumber dan lapisan konsultasi, tanpa menggantinya dengan gelar.
- issue: Makna הוֹשִׁיעָה לּוֹ ketika subjeknya tangan dan lengan Yahweh
  choice: telah memperoleh kemenangan bagi-Nya
  alternative: telah menyelamatkan-Nya; telah mengerjakan keselamatan bagi-Nya
  rationale: Ungkapan Ibrani dapat dibaca lebih harfiah sebagai “menyelamatkan bagi-Nya,” tetapi konteks puitis menggambarkan kuasa Yahweh sendiri yang mencapai pembebasan atau kemenangan. Terjemahan utama menyampaikan makna kontekstual, sedangkan catatan kaki mempertahankan ketegangan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Imperatif “Nyanyikanlah” dan citra “tangan kanan” serta “lengan yang kudus” dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
