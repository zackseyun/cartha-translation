  text: לִֽ/פְֽנֵי יְהוָ֗ה כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/009.yaml
  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: id
  text: di hadapan Yahweh[a], sebab Ia datang[b] untuk menghakimi bumi. Ia akan menghakimi dunia[c] dengan kebenaran, dan bangsa-bangsa dengan keadilan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam hadirat Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Ia sedang datang.” Bentuk Ibraninya dalam konteks puisi dapat menyatakan tindakan yang segera atau pasti terjadi.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “dunia yang didiami.”
    reason: lexical_alternative
  - marker: d
    text: Atau “dengan kelurusan” atau “dengan tidak memihak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini secara idiomatis berarti “di hadapan” atau “dalam hadirat”; “di hadapan” alami dalam bahasa Indonesia dan mempertahankan makna relasionalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: כִּי
  choice: sebab
  rationale: Memperlihatkan hubungan alasan dengan ajakan bersukacita pada konteks sebelumnya.
- source_word: בָא
  choice: Ia datang
  rationale: Bentuk qatal dalam puisi dapat menggambarkan tindakan yang pasti atau segera terjadi; bentuk kini yang hidup mempertahankan nuansa itu tanpa membatasinya pada masa lampau.
- source_word: לִשְׁפֹּט / יִשְׁפֹּט
  choice: untuk menghakimi / Ia akan menghakimi
  rationale: “Menghakimi” paling langsung menyampaikan tindakan yudisial, sambil tetap memungkinkan cakupan memerintah dan menegakkan tatanan yang benar.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Paralel dengan dunia dan bangsa-bangsa menunjukkan cakupan global, bukan suatu negeri tertentu.
- source_word: תֵּבֵל
  choice: dunia
  rationale: Menunjuk dunia yang didiami; “dunia” merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: בְּצֶדֶק
  choice: dengan kebenaran
  rationale: Menyatakan cara atau tolok ukur penghakiman yang benar secara moral; mempertahankan hubungan leksikal dengan צדק.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Menunjuk berbagai kelompok manusia secara jamak dan terdengar alami dalam puisi Indonesia.
- source_word: בְּמֵישָׁרִים
  choice: dengan keadilan
  rationale: Dalam konteks penghakiman, kata ini menyatakan kelurusan, kewajaran, dan ketidakberpihakan; “keadilan” paling jelas bagi pembaca modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi; transliterasi “Yahweh” mempertahankan statusnya sebagai nama pribadi.
- issue: Nuansa penghakiman ilahi dalam שׁפט
  choice: menghakimi
  alternative: memerintah atau membela
  rationale: “Menghakimi” mempertahankan ketegangan antara pertanggungjawaban, pembelaan, dan penegakan tatanan yang benar tanpa mempersempitnya menjadi penghukuman semata.
- issue: Aspek waktu pada בָא
  choice: Ia datang
  alternative: Ia sedang datang atau Ia telah datang
  rationale: Ungkapan puitis ini dapat menyatakan kedatangan yang segera atau pasti. Bentuk “Ia datang” mempertahankan daya ungkap yang hidup dan ambiguitas waktunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan register puitis yang lugas dan bermartabat. Paralelisme antarbait dipertahankan; “kebenaran” dan “keadilan” dibedakan untuk mencerminkan dua istilah Ibrani yang terkait tetapi tidak identik.
