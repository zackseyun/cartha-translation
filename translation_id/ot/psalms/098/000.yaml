  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: id
  text: 'Mazmur.


    Nyanyikanlah nyanyian baru bagi Yahweh,

    sebab Ia telah melakukan perbuatan-perbuatan ajaib;

    tangan kanan-Nya dan lengan-Nya yang kudus

    telah mendatangkan keselamatan bagi-Nya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah menyelamatkan-Nya” atau “telah memperoleh kemenangan bagi-Nya.” Ungkapan Ibrani menyatakan bahwa kuasa Yahweh sendiri menghasilkan keselamatan atau kemenangan bagi-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah Indonesia yang baku untuk nyanyian yang diiringi musik dan tepat sebagai judul pendek.
- source_word: שִׁירוּ לַיהוָה שִׁיר חָדָשׁ
  choice: Nyanyikanlah nyanyian baru bagi Yahweh
  rationale: Mempertahankan bentuk perintah jamak dan nama ilahi יהוה; kata depan ל secara alami diterjemahkan “bagi” dalam konteks menyanyikan pujian.
- source_word: נִפְלָאוֹת
  choice: perbuatan-perbuatan ajaib
  rationale: Bentuk jamak ini menunjuk pada karya-karya luar biasa Allah, bukan sekadar hal yang menimbulkan rasa takjub.
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: tangan kanan-Nya dan lengan-Nya yang kudus
  rationale: Mempertahankan gambaran antropomorfis sumber mengenai kuasa ilahi tanpa mengubahnya menjadi penjelasan abstrak.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: telah mendatangkan keselamatan bagi-Nya
  rationale: Mencerminkan verba ישׁע dan unsur לּוֹ secara cukup dekat, sekaligus tetap wajar dalam bahasa Indonesia; catatan kaki menjaga kemungkinan nuansa kemenangan dan terjemahan yang lebih harfiah.
theological_decisions:
- issue: Objek atau penerima keselamatan dalam הוֹשִׁיעָה לּוֹ
  choice: mendatangkan keselamatan bagi-Nya
  alternative: menyelamatkan-Nya; memperoleh kemenangan bagi-Nya
  rationale: Teks Ibrani secara eksplisit memakai לּוֹ (“bagi-Nya”), sehingga unsur itu tidak dihapus. Ungkapan tersebut dapat berbicara tentang kemenangan yang dicapai Yahweh oleh kuasa-Nya sendiri, tetapi terjemahan utama tidak menyempitkan maknanya hanya menjadi kemenangan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan puitis dengan susunan baris yang mengikuti kesejajaran Ibrani. Nama יהוה ditransliterasikan sebagai “Yahweh”. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
