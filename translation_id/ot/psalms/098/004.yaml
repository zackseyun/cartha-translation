base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/004.yaml
  text: Shout joyfully to Yahweh[a], all the earth[b]; break forth and sing for joy and make music.
translation:
  language: id
  text: Bersoraklah dengan sukacita kepada Yahweh[a], hai seluruh bumi! Luapkanlah sorak-sorai, bernyanyilah dengan gembira, dan bermusiklah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepada TUHAN.”'
    reason: Padanan tradisional untuk nama ilahi יְהוָה dapat dipakai sebagai pengganti transliterasi “Yahweh”.
  - marker: b
    text: 'Rangkaian ini dapat juga diterjemahkan: “Pecahlah dalam sorak-sorai, bernyanyilah dengan gembira, dan lantunkanlah pujian.”'
    reason: Kata-kata kerja Ibrani dalam rangkaian ini memiliki cakupan yang bertumpang tindih antara pecah dalam ungkapan sukacita, bersorak atau bernyanyi gembira, dan menghasilkan musik pujian.
lexical_decisions:
- source_word: הָרִיעוּ
  choice: Bersoraklah dengan sukacita
  rationale: Bentuk imperatif Hifil dari רוע dalam konteks pujian menyerukan sorak yang nyaring dan penuh kegembiraan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menunjukkan bahwa sorak itu diarahkan kepada Yahweh. Bentuk nama diri mempertahankan nama ilahi yang terdapat dalam teks Ibrani.
- source_word: כָּל הָאָרֶץ
  choice: hai seluruh bumi
  rationale: Dalam seruan universal mazmur ini, אֶרֶץ paling tepat merujuk kepada seluruh bumi, bukan hanya suatu negeri. Partikel sapaan 'hai' memperjelas bahwa seluruh bumi sedang disapa langsung.
- source_word: פִּצְחוּ
  choice: Luapkanlah sorak-sorai
  rationale: פצח menggambarkan pecah atau meletusnya ungkapan suara. 'Luapkanlah' menyampaikan gambaran itu secara alami dalam bahasa Indonesia tanpa ungkapan harfiah yang kaku.
- source_word: וְרַנְּנוּ
  choice: bernyanyilah dengan gembira
  rationale: Bentuk Piel dari רנן dapat menunjuk pada seruan nyaring atau nyanyian sukacita. Dalam rangkaian puitis ini, 'bernyanyilah dengan gembira' membedakannya dari seruan pembuka.
- source_word: וְזַמֵּרוּ
  choice: bermusiklah
  rationale: זמר dalam konteks pujian mencakup kegiatan bermusik, sering kali berupa nyanyian pujian dan mungkin juga iringan alat musik. 'Bermusiklah' mempertahankan keluasan maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi itu secara langsung tanpa menggantinya dengan gelar, sedangkan 'TUHAN' merupakan padanan tradisional yang juga dikenal luas.
translation_notes:
  register: Bahasa puitis modern dan bermartabat dengan imperatif jamak yang kuat. Tanda seru mempertahankan nada seruan pujian; pilihan 'luapkanlah' menghindari keharfiahan 'pecahlah' yang kurang alami dalam bahasa Indonesia, sementara catatan kaki menjaga metafora dan alternatif leksikal sumber.
