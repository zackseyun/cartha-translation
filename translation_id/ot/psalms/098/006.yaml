  text: בַּ֭/חֲצֹ֣צְרוֹת וְ/ק֣וֹל שׁוֹפָ֑ר הָ֝רִ֗יעוּ לִ/פְנֵ֤י הַ/מֶּ֬לֶךְ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: id
  text: Dengan trompet dan bunyi sangkakala[a], bersoraklah di hadapan Sang Raja, Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bunyi tanduk domba jantan”. Kata Ibrani שׁוֹפָר sering menunjuk secara khusus pada tanduk domba jantan, yang berbeda dari trompet yang disebut sebelumnya dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: Dengan trompet
  rationale: חֲצֹצְרוֹת menunjuk pada trompet, kemungkinan alat tiup logam lurus yang berbeda dari שׁוֹפָר. Prefiks ב diterjemahkan secara instrumental sebagai “dengan”. Unsur “perak” tidak disebutkan dalam ayat ini sehingga tidak ditambahkan.
- source_word: וְקוֹל שׁוֹפָר
  choice: dan bunyi sangkakala
  rationale: קוֹל berarti “bunyi”, sedangkan שׁוֹפָר adalah alat tiup dari tanduk, sering kali tanduk domba jantan. “Sangkakala” merupakan istilah Indonesia yang wajar untuk alat tiup seremonial ini dan tetap membedakannya dari חֲצֹצְרוֹת, “trompet”; makna yang lebih spesifik dicatat dalam catatan kaki.
- source_word: הָרִיעוּ
  choice: bersoraklah
  rationale: Bentuk imperatif jamak Hifil dari רוע menyerukan aklamasi atau pekik nyaring. “Bersoraklah” alami dalam bahasa Indonesia dan sesuai dengan suasana pujian, tanpa menambahkan kata “sukacita” yang tidak dinyatakan secara eksplisit.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: לִפְנֵי menyatakan relasi kehadiran atau posisi “di hadapan”; pilihan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: Sang Raja
  rationale: Nomina definit ini merujuk kepada Yahweh sebagai Raja. “Sang Raja” menandai gelar ilahi secara alami dalam bahasa Indonesia tanpa mengubah makna leksikalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan merupakan transliterasi ilmiah yang lazim.
- issue: Hubungan הַמֶּלֶךְ dengan יְהוָה
  choice: 'aposisi: “Sang Raja, Yahweh”'
  alternative: “Yahweh, Sang Raja”
  rationale: Urutan Ibrani הַמֶּלֶךְ יְהוָה secara alami mengidentifikasi Yahweh sebagai Sang Raja. Urutan sumber dipertahankan karena jelas dan alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan liturgis yang tetap mudah dipahami. Pembedaan antara חֲצֹצְרוֹת dan שׁוֹפָר dipertahankan melalui “trompet” dan “sangkakala”; bentuk imperatif jamak disampaikan secara alami dengan “bersoraklah”.
