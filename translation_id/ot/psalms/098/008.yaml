id: PSA.98.8
reference: Psalms 98:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נְהָר֥וֹת יִמְחֲאוּ כָ֑ף יַ֝֗חַד הָרִ֥ים יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/008.yaml
  text: Let the rivers clap their hands[a]; let the mountains sing for joy together,
translation:
  language: id
  text: Biarlah sungai-sungai bertepuk tangan; biarlah gunung-gunung bersorak bersama-sama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bernyanyi dengan sukacita bersama-sama.” Kata kerja Ibrani dapat menunjuk pada sorak kegembiraan maupun nyanyian sukacita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְהָרוֹת
  choice: sungai-sungai
  rationale: Bentuk jamak ini secara langsung berarti sungai-sungai dan sesuai dengan gambaran seluruh ciptaan yang memuji.
- source_word: יִמְחֲאוּ כָף
  choice: bertepuk tangan
  rationale: Ungkapan Ibrani secara harfiah menggambarkan menepukkan telapak tangan; idiom Indonesia yang alami ialah 'bertepuk tangan'.
- source_word: יַחַד
  choice: bersama-sama
  rationale: Adverbia ini menyatakan tindakan serentak atau terpadu dan secara alami menerangkan sorak gunung-gunung.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Padanan langsung yang mempertahankan kebesaran citra puitis sumber.
- source_word: יְרַנֵּנוּ
  choice: bersorak
  rationale: Verba רנן dapat menyatakan seruan nyaring penuh sukacita maupun nyanyian sukacita. 'Bersorak' alami dalam bahasa Indonesia dan mempertahankan unsur kegembiraan tanpa mempersempitnya hanya menjadi nyanyian.
theological_decisions:
- issue: Personifikasi ciptaan dalam pujian
  choice: Mempertahankan secara langsung gambaran sungai yang bertepuk tangan dan gunung yang bersorak
  alternative: Menjelaskannya secara abstrak sebagai pujian manusia yang terinspirasi oleh alam
  rationale: Teks Ibrani menampilkan unsur-unsur ciptaan sebagai peserta yang dipersonifikasikan dalam pujian; citra itu sebaiknya tidak direduksi melalui parafrasa.
- issue: Nuansa יְרַנֵּנוּ
  choice: bersorak
  alternative: bernyanyi dengan sukacita
  rationale: Sumber memungkinkan seruan sukacita maupun nyanyian. Teks utama memakai istilah yang luas, sementara catatan kaki mempertahankan alternatif leksikal yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pola paralel 'Biarlah ...; biarlah ...' mempertahankan daya ajakan puisi, sedangkan personifikasi ciptaan dipertahankan tanpa penjelasan tambahan.
