base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: id
  text: Yahweh telah memperkenalkan keselamatan-Nya; di depan mata bangsa-bangsa[a] Ia telah menyatakan kebenaran-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di hadapan bangsa-bangsa.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “keadilan-Nya.” Istilah Ibrani ini dapat menyatakan kebenaran, keadilan, atau kelurusan yang terbukti, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הוֹדִיעַ
  choice: telah memberitahukan
  rationale: Bentuk Hifil dari ידע berarti ‘membuat diketahui’ atau ‘memberitahukan’; pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna kausatifnya.
- source_word: יְשׁוּעָתוֹ
  choice: keselamatan-Nya
  rationale: יְשׁוּעָה dapat berarti keselamatan, pembebasan, atau kemenangan. ‘Keselamatan’ mempertahankan cakupan makna yang luas sekaligus menunjuk pada tindakan penyelamatan Yahweh.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Menerjemahkan ungkapan Ibrani secara cukup dekat dan mempertahankan gambaran visual bahwa tindakan Yahweh diperlihatkan secara terbuka.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks mazmur ini, bentuk jamak tersebut merujuk secara luas kepada bangsa-bangsa, bukan secara sempit kepada kelompok tertentu.
- source_word: גִּלָּה
  choice: telah menyatakan
  rationale: Bentuk Piel dari גלה bermakna menyingkapkan atau menyatakan. ‘Menyatakan’ terdengar alami dan sejalan dengan paralelisme ‘memberitahukan’.
- source_word: צִדְקָתוֹ
  choice: kebenaran-Nya
  rationale: צְדָקָה mencakup kebenaran, keadilan, dan kelurusan yang terbukti dalam tindakan. ‘Kebenaran-Nya’ mempertahankan keluasan maknanya, sedangkan ‘keadilan-Nya’ dicatat sebagai alternatif.
theological_decisions:
- issue: Makna צִדְקָה dalam konteks keselamatan
  choice: kebenaran-Nya
  alternative: keadilan-Nya
  rationale: Teks menghubungkan tindakan penyelamatan Yahweh dengan penyingkapan צִדְקָה-Nya. ‘Kebenaran-Nya’ menjaga cakupan moral dan relasional istilah tersebut tanpa membatasinya hanya pada keadilan yudisial; alternatif yang sah tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang luhur tetapi mudah dipahami. Paralelisme kedua klausa dipertahankan, begitu pula gambaran visual dalam ungkapan ‘di depan mata’. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab berbahasa Indonesia.
