id: PSA.98.5
reference: Psalms 98:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זַמְּר֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ֝/כִנּ֗וֹר וְ/ק֣וֹל זִמְרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/005.yaml
  text: Sing praises to Yahweh with the lyre[b][a], with the lyre and the sound of song.
translation:
  language: id
  text: Nyanyikanlah puji-pujian bagi Yahweh dengan kecapi[a], dengan kecapi dan suara nyanyian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani kinnor, alat musik petik kuno; secara tradisional diterjemahkan “harpa”.
    reason: lexical_alternative
  - marker: b
    text: Atau “suara melodi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Nyanyikanlah puji-pujian
  rationale: Bentuk imperatif jamak piel dari זמר menyerukan pujian bermusik. Ungkapan ini mempertahankan unsur bernyanyi dan memuji dalam bahasa Indonesia yang wajar.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai arah atau penerima pujian, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: בְּכִנּוֹר
  choice: dengan kecapi
  rationale: כִּנּוֹר adalah alat musik petik kuno. “Kecapi” mudah dipahami pembaca Indonesia, sementara catatan kaki menjelaskan bahwa alat kuno yang dimaksud tidak harus sama persis dengan kecapi modern.
- source_word: בְּכִנּוֹר
  choice: dengan kecapi
  rationale: Pengulangan dalam teks Ibrani dipertahankan untuk menjaga kesejajaran dan penekanan puitisnya.
- source_word: וְקוֹל זִמְרָה
  choice: dan suara nyanyian
  rationale: קוֹל berarti “suara” dan זִמְרָה dapat berarti “nyanyian, lagu, atau melodi”. Pilihan ini mempertahankan citra bunyi serta hubungan konstruksi frasa Ibraninya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif jamak Ibrani diungkapkan dengan “-lah”; pengulangan “dengan kecapi” sengaja dipertahankan sebagai ciri puisi Ibrani.
