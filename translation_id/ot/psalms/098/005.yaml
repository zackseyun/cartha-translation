  source_fidelity: 'Teks Indonesia dengan setia mencerminkan struktur dan isi Ibrani: imperatif musikal-pujian, penerima pujian (Yahweh), pengulangan "dengan kecapi", serta frasa penutup "dan suara nyanyian" yang mempertahankan קוֹל זִמְרָה. "Kecapi" merupakan padanan Indonesia yang dapat diterima untuk kinnor, dengan catatan kaki yang tepat menyatakan sifatnya sebagai alat petik kuno dan tidak mengklaim identifikasi modern yang pasti.'
