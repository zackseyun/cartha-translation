  yaml_path: translation/ot/psalms/126/005.yaml
  text: Those who sow in tears will reap with joyful shouting[a].
translation:
  language: id
  text: Orang-orang yang menabur dengan air mata akan menuai dengan sorak-sorai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan seruan sukacita.” Kata Ibrani רִנָּה dapat berarti seruan kegembiraan yang nyaring dan juga dapat mencakup nyanyian penuh sukacita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזֹּרְעִים
  choice: Orang-orang yang menabur
  rationale: Partisipel dengan kata sandang berfungsi sebagai nomina dan menunjuk secara umum kepada orang-orang yang menabur. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan bentuk jamak dan metafora pertanian.
- source_word: בְּדִמְעָה
  choice: dengan air mata
  rationale: Preposisi ב dengan דִמְעָה menyatakan keadaan atau cara saat menabur. 'Dengan air mata' merupakan ungkapan Indonesia yang alami dan tetap dekat dengan citra Ibrani.
- source_word: בְּרִנָּה
  choice: dengan sorak-sorai
  rationale: רִנָּה menunjuk pada seruan nyaring penuh sukacita dan dalam konteks tertentu dapat mencakup nyanyian kegembiraan. 'Sorak-sorai' mempertahankan sifatnya yang terdengar dan meluap-luap.
- source_word: יִקְצֹרוּ
  choice: akan menuai
  rationale: Bentuk imperfek di sini menyatakan hasil pada masa mendatang. 'Akan menuai' alami dan mempertahankan kesejajaran metaforis dengan 'menabur'.
