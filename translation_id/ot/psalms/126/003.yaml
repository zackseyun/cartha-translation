source:
  edition: WLC
  text: הִגְדִּ֣יל יְ֭הוָה לַ/עֲשׂ֥וֹת עִמָּ֗/נוּ הָיִ֥ינוּ שְׂמֵחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/003.yaml
  text: Yahweh has done great things for us[a]; we were glad.
translation:
  language: id
  text: Yahweh telah melakukan perkara-perkara besar bagi kita[a]; kita bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “Yahweh telah melakukan perkara-perkara besar dengan kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: telah melakukan perkara-perkara besar
  rationale: Ungkapan Ibrani ini secara idiomatis berarti melakukan hal-hal besar. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan bobot puitisnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: עִמָּנוּ
  choice: bagi kita
  rationale: Walaupun עִם secara harfiah berarti 'dengan', dalam ungkapan ini konteks mendukung nuansa benefaktif 'bagi kita'. Arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: הָיִינוּ שְׂמֵחִים
  choice: kita bersukacita
  rationale: Menyampaikan keadaan gembira yang dihasilkan oleh perbuatan Yahweh. Bentuk ini lebih alami dan puitis daripada 'kita adalah orang-orang yang gembira', tanpa mengubah makna pokok.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi. Bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Nuansa preposisi עִמָּנוּ
  choice: bagi kita
  alternative: dengan kita
  rationale: Terjemahan utama menyatakan manfaat tindakan Yahweh secara alami dalam bahasa Indonesia, sedangkan catatan kaki menjaga kemungkinan pembacaan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Perkara-perkara besar' dipilih untuk menjaga keluhuran register mazmur; 'bersukacita' mengungkapkan kegembiraan yang kuat dan sesuai dengan puisi ibadah.
