source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/001.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: id
  text: Nyanyian ziarah. Ketika Yahweh memulihkan nasib Sion[a], kami seperti orang-orang yang bermimpi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membawa pulang para tawanan Sion” atau “memulihkan pembuangan Sion.” Ungkapan Ibrani ini dapat menunjuk secara khusus pada kepulangan dari pembuangan atau, secara lebih luas, pada pemulihan nasib.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Judul rangkaian mazmur ini secara harfiah berkaitan dengan 'kenaikan'. Dalam bahasa Indonesia, 'nyanyian ziarah' secara wajar menyampaikan konteks perjalanan naik para peziarah tanpa menjadikan frasa judul terasa janggal.
- source_word: בְּשׁוּב
  choice: Ketika ... memulihkan
  rationale: Preposisi ב dengan infinitif konstruktus membentuk klausa waktu, sehingga diterjemahkan 'ketika'. Dalam ungkapan ini, שוב dapat berarti memulihkan atau membawa kembali.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: שִׁיבַת צִיּוֹן
  choice: keadaan Sion
  rationale: Dalam konstruksi dengan שוב, ungkapan ini dapat menunjuk pada pemulihan keadaan atau nasib Sion secara umum, sekaligus mungkin merujuk secara khusus pada kepulangan dari pembuangan. Teks utama memakai ungkapan Indonesia yang luas, sedangkan nuansa alternatif dipertahankan dalam catatan kaki.
- source_word: הָיִינוּ
  choice: kita seperti
  rationale: Bentuk perfektif היה menyatakan keadaan pada masa lampau dalam klausa ini. Pronomina inklusif 'kita' wajar untuk suara komunal mazmur yang melibatkan penyanyi dan umat yang disapa.
- source_word: כְּחֹלְמִים
  choice: seperti orang-orang yang bermimpi
  rationale: Partisip tersebut menunjuk kepada orang yang bermimpi. Terjemahan ini mempertahankan perbandingan dan lebih alami daripada bentuk nominal yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna שִׁיבַת צִיּוֹן
  choice: memulihkan keadaan Sion
  alternative: membawa pulang para tawanan Sion / memulihkan Sion dari pembuangan
  rationale: Ungkapan Ibrani dapat mengacu secara luas pada pembalikan keadaan dan secara khusus pada pemulangan dari pembuangan. Teks utama tidak mempersempit maknanya, sementara catatan kaki menjaga kemungkinan historis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Judul dibuat ringkas serta mudah dipahami; kalimat utama mempertahankan citra mimpi dan ambiguitas ungkapan pemulihan.
