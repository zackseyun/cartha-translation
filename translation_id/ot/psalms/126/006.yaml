  text: הָ֘ל֤וֹךְ יֵלֵ֨ךְ וּ/בָכֹה֮ נֹשֵׂ֪א מֶֽשֶׁךְ הַ֫/זָּ֥רַע בֹּֽ֬א יָב֥וֹא בְ/רִנָּ֑ה נֹ֝שֵׂ֗א אֲלֻמֹּתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/006.yaml
  text: He surely goes out weeping[a], carrying the seed for sowing; he will surely come in with joyful shouting[b], carrying his sheaves.
translation:
  language: id
  text: Ia sungguh pergi sambil menangis, membawa benih untuk ditabur[a]; ia pasti akan pulang dengan sorak-sorai[b], membawa berkas-berkasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia terus berjalan sambil menangis, membawa kantong benih.” Ungkapan Ibrani yang diterjemahkan “benih untuk ditabur” sulit dipastikan; sebagian memahaminya secara lebih konkret sebagai kantong atau persediaan benih.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dengan nyanyian” atau “dengan sukacita.” Istilah Ibrani ini menunjuk pada seruan atau ungkapan sukacita yang nyaring.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  choice: orang yang pergi ... pasti
  rationale: Gabungan infinitif absolut dan bentuk verbal berhingga memberi penegasan. Dalam bahasa Indonesia, penegasan ini paling alami dinyatakan bersama verba pasangannya pada klausa berikut melalui "pasti", sementara "pergi" mempertahankan gerak menuju tempat menabur.
- source_word: וּבָכֹה
  choice: sambil menangis
  rationale: Infinitif absolut ini menerangkan cara orang itu pergi; "sambil menangis" alami dan mempertahankan tindakan yang berlangsung bersamaan.
- source_word: נֹשֵׂא
  choice: membawa
  rationale: Partisip ini menyatakan tindakan yang menyertai gerak pergi maupun pulang. "Membawa" merupakan padanan Indonesia modern yang lugas.
- source_word: מֶשֶׁךְ הַזָּרַע
  choice: benih untuk ditabur
  rationale: Ungkapan Ibrani ini sulit dipastikan. Dalam konteks pertanian, padanan ini menyampaikan fungsi benih tanpa menetapkan secara berlebihan bahwa מֶשֶׁךְ berarti kantong, takaran, atau persediaan tertentu.
- source_word: בֹּא יָבֹא
  choice: pasti akan pulang
  rationale: Infinitif absolut bersama imperfek menegaskan kedatangan. "Pulang" secara alami menyatakan gerak kembali dari ladang dan membentuk kontras dengan "pergi", meskipun arti harfiahnya adalah "datang".
- source_word: בְרִנָּה
  choice: dengan sorak-sorai
  rationale: רִנָּה menunjuk pada seruan sukacita yang terdengar. "Sorak-sorai" mempertahankan sifat nyaring dan perayaannya.
- source_word: אֲלֻמֹּתָיו
  choice: berkas-berkas panennya
  rationale: Kata ini menunjuk pada berkas hasil tuaian. Tambahan "panen" membuat gambaran pertanian jelas bagi pembaca modern tanpa mengubah rujukannya.
