  register: Bahasa Indonesia baku modern dengan nada puitis yang wajar. Struktur pergi–pulang dan menangis–bersorak dipertahankan. Pengulangan penegas Ibrani dialihkan menjadi "pasti akan" agar alami, dan ambiguitas מֶשֶׁךְ הַזָּרַע dicatat dalam catatan kaki.
