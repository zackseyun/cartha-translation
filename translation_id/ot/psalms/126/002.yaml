  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֤ז יִמָּלֵ֪א שְׂח֡וֹק פִּי/נוּ֮ וּ/לְשׁוֹנֵ֪/נוּ רִ֫נָּ֥ה אָ֭ז יֹאמְר֣וּ בַ/גּוֹיִ֑ם הִגְדִּ֥יל יְ֝הוָ֗ה לַ/עֲשׂ֥וֹת עִם אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/002.yaml
  text: Then our mouth was filled with laughter[a], and our tongue with joyful shouting; then they said among the nations[b], “Yahweh has done great things for them.”
translation:
  language: id
  text: Ketika itu, mulut kami dipenuhi tawa, dan lidah kami dipenuhi sorak-sorai[a]. Ketika itu, orang berkata di antara bangsa-bangsa, “Yahweh telah melakukan hal-hal besar bagi mereka.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seruan nyaring” atau “sorak-sorai sukacita.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Yahweh telah bertindak besar dengan mereka ini,” sebuah ungkapan yang berarti bahwa Yahweh telah melakukan hal-hal besar bagi mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pada waktu itu
  rationale: Menandai saat atau akibat dari pemulihan pada ayat sebelumnya dan mempertahankan pengulangan puitisnya.
- source_word: יִמָּלֵא
  choice: penuh
  rationale: Bentuk imperfek pasif dipahami secara retrospektif dalam konteks ini; ungkapan Indonesia yang alami ialah “mulut kami penuh dengan”.
- source_word: שְׂחוֹק
  choice: tawa
  rationale: Dalam paralel dengan רִנָּה dan konteks pemulihan, kata ini menunjuk pada tawa sukacita, bukan ejekan.
- source_word: פִּינוּ
  choice: mulut kami
  rationale: Mempertahankan bentuk tunggal kolektif Ibrani yang juga wajar dalam ungkapan Indonesia.
- source_word: וּלְשׁוֹנֵנוּ
  choice: dan lidah kami
  rationale: Mempertahankan citra tubuh tunggal kolektif yang sejajar dengan “mulut kami”.
- source_word: רִנָּה
  choice: sorak-sorai
  rationale: Menyampaikan seruan nyaring penuh kegembiraan tanpa mempersempit maknanya menjadi nyanyian formal.
- source_word: יֹאמְרוּ
  choice: orang berkata
  rationale: Subjeknya tidak dinyatakan secara eksplisit; bentuk impersonal ini alami dalam bahasa Indonesia dan konteks menunjukkan bahwa perkataan itu terdengar di kalangan bangsa-bangsa.
- source_word: בַגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: Menerjemahkan rujukan kepada bangsa-bangsa di luar Israel tanpa muatan teologis tambahan.
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: telah melakukan perkara-perkara besar
  rationale: Menyampaikan idiom Ibrani secara alami sambil mempertahankan gagasan tindakan yang besar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: עִם אֵלֶּה
  choice: bagi mereka
  rationale: Secara harfiah berarti “dengan mereka ini”; dalam idiom ini relasinya bersifat benefaktif, sehingga “bagi mereka” alami dan cukup dekat dengan acuannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Acuan waktu imperfek puitis יִמָּלֵא
  choice: 'retrospektif: “penuh” dalam rangkaian lampau'
  alternative: 'prospektif: “akan dipenuhi”'
  rationale: Ayat pertama menggambarkan pemulihan sebagai pengalaman yang dikenang, dan klausa berikutnya melaporkan perkataan bangsa-bangsa; karena itu bacaan retrospektif paling sesuai, meski bentuk Ibraninya sendiri adalah imperfek.
- issue: Relasi עִם dalam idiom tindakan besar
  choice: 'benefaktif: “bagi mereka”'
  alternative: 'harfiah: “dengan mereka ini”'
  rationale: Terjemahan benefaktif menyampaikan maksud idiom dengan alami, sedangkan bentuk harfiah akan kabur dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan “Pada waktu itu” mempertahankan אָז pada kedua klausa. “Sorak-sorai” dipilih sebagai ungkapan umum yang bermartabat untuk seruan sukacita yang nyaring.
