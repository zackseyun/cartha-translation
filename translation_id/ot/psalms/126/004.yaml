id: PSA.126.4
reference: Psalms 126:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה אֶת שבות/נו כַּ/אֲפִיקִ֥ים בַּ/נֶּֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/004.yaml
  text: Restore our fortunes[a], O Yahweh[b], like streams in the Negev.
translation:
  language: id
  text: 'Pulihkanlah keadaan kami[a], ya Yahweh,

    seperti aliran-aliran air di Negeb.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bawalah kembali para tawanan kami” atau “pulihkanlah kami dari penawanan.” Ungkapan Ibrani ini dapat secara khusus menunjuk pada kepulangan orang-orang buangan atau secara lebih luas pada pemulihan keadaan suatu bangsa.
    reason: alternative_reading
  - marker: b
    text: Gambarannya adalah saluran-saluran air di Negeb yang biasanya kering, tetapi tiba-tiba penuh ketika hujan turun.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבָה
  choice: Pulihkanlah
  rationale: Bentuk imperatif yang ditujukan kepada Yahweh. Dalam ungkapan שׁוּב אֶת־שְׁבוּת, kata ini menyatakan pembalikan keadaan atau pemulihan; pilihan ini tidak membatasi maknanya pada kepulangan fisik para tawanan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung dalam bahasa Ibrani; fungsinya tercermin dalam susunan kalimat Indonesia.
- source_word: שבותנו
  choice: keadaan kami
  rationale: Dalam ungkapan bersama שׁוּב, kata ini dapat menunjuk pada pemulihan keadaan atau nasib, tetapi juga dapat dipahami sebagai kepulangan para tawanan. 'Keadaan kami' terdengar alami dalam bahasa Indonesia dan mempertahankan cakupan yang luas.
- source_word: כַּאֲפִיקִים
  choice: seperti aliran-aliran air
  rationale: אֲפִיקִים menunjuk pada saluran atau palung aliran air. Ungkapan ini alami dan jelas, sedangkan gambaran saluran yang biasanya kering dijelaskan dalam catatan kaki.
- source_word: בַּנֶּגֶב
  choice: di Negeb
  rationale: Konteks gambaran aliran air di wilayah gersang mendukung nama geografis Negeb, bukan sekadar arti umum 'selatan'.
theological_decisions:
- issue: Makna ungkapan שׁוּב אֶת־שבות
  choice: permohonan agar keadaan umat dipulihkan
  alternative: permohonan khusus agar para tawanan atau orang buangan dibawa pulang
  rationale: Ungkapan Ibrani dapat memiliki kedua cakupan tersebut. Teks utama memakai rumusan luas, sementara kemungkinan makna yang lebih khusus dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, lugas, dan khidmat. Bentuk imperatif '-lah' mempertahankan nada permohonan. 'Negeb' dipakai sebagai nama geografis yang lazim dalam tradisi terjemahan Alkitab Indonesia.
