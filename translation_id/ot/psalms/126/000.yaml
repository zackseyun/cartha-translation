  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/000.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: id
  text: Nyanyian ziarah. Ketika YHWH memulihkan keadaan Sion[a], kami seperti orang-orang yang bermimpi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa pulang para tawanan Sion” atau “mengembalikan para tawanan Sion.” Ungkapan Ibrani ini dapat secara khusus menunjuk pada kepulangan dari pembuangan atau, secara lebih luas, pada pemulihan keadaan.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian ziarah
  rationale: Secara harfiah berarti “nyanyian pendakian.” Dalam konteks kumpulan mazmur ini, ungkapan tersebut lazim dipahami sebagai nyanyian yang dinyanyikan dalam perjalanan naik menuju Yerusalem; “ziarah” menyampaikan fungsi itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: YHWH
  rationale: Mempertahankan nama ilahi sebagai nama diri dan tidak menggantinya dengan gelar, sambil memakai bentuk huruf yang dikenal luas dalam bahasa Indonesia.
- source_word: בְּשׁוּב יְהוָה אֶת שִׁיבַת צִיּוֹן
  choice: Ketika YHWH memulihkan keadaan Sion
  rationale: Idiom Ibrani שׁוּב שְׁבוּת dapat menunjuk pada pemulihan keadaan atau, secara lebih khusus, pemulangan para tawanan. Teks utama memakai arti luas yang alami, sedangkan arti terkait pembuangan dipertahankan dalam catatan kaki.
- source_word: הָיִינוּ כְּחֹלְמִים
  choice: kita seperti orang-orang yang bermimpi
  rationale: Mempertahankan perbandingan dan bentuk partisip Ibrani tanpa menentukan apakah yang dimaksud ialah rasa tidak percaya, sukacita, atau pengalaman yang terasa seperti mimpi.
theological_decisions:
- issue: Makna pemulihan Sion
  choice: memulihkan keadaan Sion
  alternative: membawa pulang para tawanan Sion / memulihkan para tawanan Sion
  rationale: Ungkapan Ibrani memungkinkan rujukan khusus pada kepulangan dari pembuangan maupun pemulihan yang lebih luas. Teks utama tidak mempersempitnya secara teologis atau historis.
- issue: Rujukan waktu verba Ibrani
  choice: Ketika YHWH memulihkan
  alternative: Ketika YHWH membawa kembali
  rationale: Bentuk infinitif berprefiks בְּ menyatakan keadaan waktu. Terjemahan tidak menambahkan penentuan mengenai tahap atau cara pemulihan yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. “Nyanyian ziarah” dipilih daripada bentuk harfiah “nyanyian pendakian” agar judul dapat dipahami pembaca umum. Pronomina “kita” mempertahankan orang pertama jamak secara inklusif dan alami.
