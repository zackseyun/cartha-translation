  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: id
  text: Orang yang tangannya bersih dan hatinya murni, yang tidak mengarahkan dirinya kepada kepalsuan[a] dan tidak bersumpah dengan tipu daya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam ketiv (teks yang tertulis), bahasa Ibrani berbunyi “jiwaku”; qere (bacaan tradisional) berbunyi “jiwanya,” sesuai dengan gambaran orang ketiga dalam ayat ini. “Kepalsuan” juga dapat diterjemahkan “kesia-siaan” atau “yang palsu”; sebagian memahaminya sebagai berhala.
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: נְקִי כַפַּיִם
  choice: tangannya bersih
  rationale: Mempertahankan gambaran konkret Ibrani tentang tangan yang bersih sebagai lambang kelakuan yang tidak bercela, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וּבַר לֵבָב
  choice: hatinya murni
  rationale: Mengungkapkan kemurnian batin dan mempertahankan kesejajaran antara perilaku lahiriah ('tangan') dan keadaan batiniah ('hati').
- source_word: נָשָׂא ... נַפְשִׁי
  choice: menyerahkan dirinya
  rationale: Ungkapan נָשָׂא נֶפֶשׁ secara harfiah berarti 'mengangkat jiwa', tetapi dalam konteks ini menunjuk pada mengarahkan atau menyerahkan diri/hasrat. 'Dirinya' mengikuti makna kontekstual orang ketiga, sementara bacaan Masoret 'jiwa-Ku/jiwaku' dicatat dalam catatan kaki.
- source_word: לַשָּׁוְא
  choice: kepada kepalsuan
  rationale: שָׁוְא dapat berarti kesia-siaan, kehampaan, atau kepalsuan. 'Kepalsuan' sesuai dengan konteks etis dan berkaitan erat dengan tindakan menipu pada klausa berikutnya tanpa mempersempitnya secara pasti menjadi penyembahan berhala.
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: bersumpah untuk menipu
  rationale: Menyampaikan sumpah yang dilakukan dengan maksud menipu secara alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Akhiran orang pertama pada נַפְשִׁי ('jiwa-Ku/jiwaku') dibandingkan pengertian kontekstual orang ketiga ('dirinya')
  choice: Teks utama memakai 'dirinya' agar selaras dengan subjek orang ketiga dalam seluruh ayat.
  alternative: Secara tertulis teks Masoret berbunyi 'jiwa-Ku/jiwaku'; kemungkinan lain ialah menerjemahkan idiom itu secara harfiah sebagai 'mengangkat jiwanya'.
  rationale: Bentuk נַפְשִׁי dalam WLC memang bertanda akhiran orang pertama, tetapi susunan ayat menggambarkan orang ketiga. Tradisi pembacaan Masoret juga menandai bentuk ini secara khusus, dan banyak penerjemah mengikuti makna orang ketiga yang dituntut konteks. Ketegangan tekstual tidak disembunyikan, melainkan dijelaskan dalam catatan kaki.
- issue: Kemungkinan שָׁוְא merujuk pada berhala
  choice: kepalsuan
  alternative: kesia-siaan; sesuatu yang palsu; berhala
  rationale: Makna 'berhala' mungkin dalam konteks tertentu, tetapi tidak pasti di sini. Pilihan umum 'kepalsuan' menjaga rentang makna dan hubungan dengan sumpah yang menipu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur puitis mempertahankan kesejajaran antara tangan dan hati serta antara kepalsuan dan penipuan. 'Orang yang' dipilih sebagai pembuka yang alami dan inklusif tanpa menambah tafsiran denominasi.
