base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: id
  text: Angkatlah kepala kalian, hai pintu-pintu gerbang; terangkatlah, hai pintu-pintu purbakala[a], supaya Raja Kemuliaan masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pintu-pintu abadi.” Ungkapan Ibrani ini dapat menunjuk pada pintu-pintu yang berasal dari zaman purbakala atau yang tetap ada sepanjang masa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Angkatlah
  rationale: Bentuk imperatif jamak yang mempertahankan seruan puitis kepada pintu-pintu gerbang dan pengulangan akar kata dalam ayat ini.
- source_word: שְׁעָרִים
  choice: pintu-pintu gerbang
  rationale: Padanan Indonesia yang wajar untuk gerbang kota atau kompleks suci; bentuk ulang menyatakan jamak secara jelas.
- source_word: רָאשֵׁיכֶם
  choice: kepalamu
  rationale: Secara harfiah berarti 'kepala-kepalamu'. Bahasa Indonesia lazim memakai bentuk tunggal distributif sesudah sapaan jamak; metafora kepala tetap dipertahankan dan tidak diratakan menjadi 'terbukalah lebar-lebar'.
- source_word: וּשְׂאוּ
  choice: terangkatlah
  rationale: Mempertahankan pengulangan puitis sambil menyampaikan nuansa intransitif/pasif yang wajar bagi pintu-pintu yang dipersonifikasikan.
- source_word: פִּתְחֵי עוֹלָם
  choice: pintu-pintu purbakala
  rationale: עוֹלָם dalam konteks ini dapat menunjuk pada zaman lampau yang sangat jauh atau keberlangsungan yang panjang. 'Purbakala' menyampaikan usia yang sangat tua secara ringkas dan bermartabat, sementara kemungkinan 'abadi' dicatat dalam catatan kaki.
- source_word: וְיָבֹא
  choice: supaya ... masuk
  rationale: 'Sesudah rangkaian imperatif, bentuk verba ini secara alami dapat menyatakan tujuan atau hasil: pintu-pintu diangkat agar sang Raja dapat masuk.'
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Raja Kemuliaan
  rationale: Mempertahankan konstruksi gelar Ibrani secara dekat, berikut nada luhur dan pengulangannya dalam mazmur.
theological_decisions:
- issue: Apakah personifikasi pintu-pintu yang mempunyai 'kepala' harus dipertahankan
  choice: 'Metafora dipertahankan: ''Angkatlah kepalamu, hai pintu-pintu gerbang'''
  alternative: Parafrasa arsitektural seperti 'Terbukalah lebar-lebar, hai pintu-pintu gerbang'
  rationale: Teks Ibrani secara eksplisit menyebut 'kepala' dan mempersonifikasikan gerbang. Mempertahankannya menjaga citra serta daya liturgis-puitis tanpa memasukkan penafsiran arsitektural tertentu.
- issue: Makna עוֹלָם dalam פִּתְחֵי עוֹלָם
  choice: pintu-pintu purbakala
  alternative: pintu-pintu abadi
  rationale: Kata tersebut mencakup rentang makna dari masa lampau yang jauh hingga keberlangsungan tanpa batas. Konteks bangunan puitis mendukung 'purbakala', tetapi ambiguitas asli dijaga melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan khidmat. Sapaan 'hai' serta enklitik '-lah' mempertahankan corak seruan mazmur. Kapitalisasi 'Raja Kemuliaan' menandai gelar dalam konteks ini tanpa menambahkan identifikasi teologis yang tidak dinyatakan langsung dalam ayat.
