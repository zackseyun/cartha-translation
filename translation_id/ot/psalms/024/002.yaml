  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: id
  text: Sebab Dialah yang meletakkan dasar bumi di atas lautan dan mengokohkannya di atas sungai-sungai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi pernyataan pada ayat sebelumnya dan mengalir alami dalam puisi Indonesia.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri ini bersifat menegaskan; bentuk “Dialah” mempertahankan penekanan itu secara wajar.
- source_word: עַל יַמִּים
  choice: di atas lautan
  rationale: עַל menyatakan letak dasar, sedangkan bentuk jamak יַמִּים dipertahankan secara kolektif sebagai “lautan”, tanpa meniadakan gambaran kosmologis puitisnya.
- source_word: יְסָדָהּ
  choice: meletakkan dasar bumi
  rationale: Kata kerja יסד berarti meletakkan dasar atau mendirikan; sufiks feminin merujuk kepada bumi pada ayat 1. Penyebutan “bumi” lebih alami daripada pronomina “nya” dalam kalimat Indonesia ini.
- source_word: וְעַל נְהָרוֹת
  choice: dan ... di atas sungai-sungai
  rationale: Mempertahankan kesejajaran עַל ... וְעַל serta makna biasa bentuk jamak נְהָרוֹת.
- source_word: יְכוֹנְנֶהָ
  choice: menegakkannya
  rationale: כון dalam bentuk ini menyatakan membuat kukuh atau menetapkan. “Menegakkannya” membedakannya dari tindakan meletakkan dasar pada baris pertama sekaligus menjaga kesejajaran puitis.
theological_decisions:
- issue: Gambaran kosmologis bumi di atas lautan dan sungai-sungai
  choice: Mempertahankan gambaran puitis itu secara langsung.
  alternative: Mengubahnya menjadi bahasa abstrak tentang kestabilan bumi atau menyesuaikannya dengan uraian ilmiah modern.
  rationale: Teks Ibrani menggambarkan tindakan TUHAN menata ciptaan dengan bahasa kosmologis puitis. Terjemahan tidak semestinya mereduksi atau memodernisasi gambaran tersebut.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. “Dialah” membawa penekanan pada הוּא; “meletakkan dasar” dan “menegakkan” mempertahankan perbedaan antara יסד dan כון.
