  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: id
  text: Siapakah Raja kemuliaan ini? Yahweh semesta alam[a]—Dialah Raja kemuliaan itu. Sela[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Yahweh dari bala tentara.” Gelar Ibrani ini dapat merujuk secara luas pada bala tentara surgawi atau kuasa-kuasa yang teratur.
    reason: lexical_alternative
  - marker: b
    text: “Sela” mungkin merupakan petunjuk musik atau liturgis; arti tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: Siapakah Dia ... itu?
  rationale: Gabungan kata tanya, pronomina, dan penunjuk membentuk pertanyaan retoris yang tegas. Bentuk ini mempertahankan pronomina eksplisit הוּא dan daya penunjuk זֶה, tetapi tetap wajar dalam bahasa Indonesia.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Raja kemuliaan
  rationale: Mempertahankan hubungan konstruksi Ibrani dan makna כָּבוֹד sebagai kemuliaan, kehormatan, atau bobot keagungan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar seperti TUHAN.
- source_word: צְבָאוֹת
  choice: semesta alam
  rationale: Dalam gelar ilahi ini, ungkapan Indonesia yang sudah dikenal tersebut menyampaikan keluasan kuasa Yahweh tanpa membatasi rujukannya hanya pada pasukan manusia. Alternatif yang lebih harfiah dicantumkan dalam catatan kaki.
- source_word: הוּא
  choice: Dialah
  rationale: Bentuk ini mempertahankan pronomina eksplisit sekaligus penekanan identifikasi dalam bahasa Indonesia, tanpa menambahkan gagasan eksklusivitas yang tidak dinyatakan secara tersendiri.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna istilah ini tidak pasti; transliterasi merupakan pilihan yang paling transparan dan paling sedikit memuat tafsiran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk Yahweh mempertahankan nama ilahi yang terdapat dalam teks sumber.
- issue: Penerjemahan gelar יְהוָה צְבָאוֹת
  choice: Yahweh semesta alam
  alternative: Yahweh bala tentara
  rationale: Pilihan utama memakai gelar yang alami dan dikenal dalam bahasa Indonesia serta tidak mempersempit צְבָאוֹת pada pasukan duniawi. Catatan kaki menjaga alternatif yang lebih harfiah dan keluasan rujukan istilah Ibrani.
translation_notes:
  register: Bahasa Indonesia baku yang modern, khidmat, dan mudah dipahami. Pengulangan “Raja kemuliaan” dipertahankan untuk menjaga struktur retoris ayat, sedangkan “Dialah” menyampaikan penekanan pronomina Ibrani.
