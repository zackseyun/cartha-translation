source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: id
  text: Angkatlah kepala kalian, hai gerbang-gerbang! Terangkatlah, hai pintu-pintu purbakala[a], supaya Raja kemuliaan masuk!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pintu-pintu kekal.” Kata Ibrani yang dipakai dapat menunjuk pada sesuatu yang berasal dari zaman purba atau yang berlangsung untuk selama-lamanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Angkatlah
  rationale: Bentuk imperatif jamak dari נשׂא dipertahankan sebagai perintah yang hidup dan puitis.
- source_word: שְׁעָרִים
  choice: gerbang-gerbang
  rationale: Menunjuk pada gerbang kota atau tempat ibadah; bentuk ulang menyatakan jamak secara jelas dan membedakannya dari פִּתְחֵי pada baris berikut.
- source_word: רָאשֵׁיכֶם
  choice: kepala kalian
  rationale: Secara harfiah berarti 'kepala kalian'. Ungkapan ini mempertahankan personifikasi gerbang dan tidak meratakannya menjadi uraian arsitektural seperti 'bagian atas kalian'.
- source_word: וְהִנָּשְׂאוּ
  choice: Terangkatlah
  rationale: Bentuk Nifal imperatif menyampaikan nuansa pasif atau refleksif; pilihan ini juga menjaga kesejajaran bunyi dan makna dengan 'Angkatlah'.
- source_word: פִּתְחֵי עוֹלָם
  choice: pintu-pintu purbakala
  rationale: פִּתְחֵי dapat berarti bukaan atau pintu, sedangkan עוֹלָם dalam konteks ini dapat menunjuk pada zaman lampau yang jauh ataupun kelanggengan. 'Pintu-pintu purbakala' alami dalam puisi Indonesia dan alternatif temporalnya dicatat dalam catatan kaki.
- source_word: וְיָבֹא
  choice: supaya ... masuk
  rationale: Gabungan waw dan bentuk imperfek setelah dua perintah wajar dipahami menyatakan tujuan atau hasil.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Raja kemuliaan
  rationale: Mempertahankan frasa konstruksi Ibrani sebagai gelar yang luhur tanpa mengubahnya menjadi sekadar 'Raja yang mulia'.
theological_decisions:
- issue: Apakah personifikasi dan gambaran masuknya sang Raja perlu dipertahankan tanpa dipersempit secara interpretatif
  choice: Gerbang dan pintu tetap disapa langsung serta digambarkan memiliki kepala
  alternative: Memparafrasakannya sebagai seruan biasa untuk membuka gerbang
  rationale: Teks Ibrani secara langsung menyapa gerbang dan pintu. Mempertahankan personifikasi menjaga daya puisi dan nuansa liturgis tanpa memasukkan penentuan khusus mengenai latar sejarah atau penggenapan mesianik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan seruan mempertahankan paralelisme puisi Ibrani; 'kalian' dipakai agar akhiran orang kedua jamak pada רָאשֵׁיכֶם tersampaikan dengan jelas.
