  text: מִֽי יַעֲלֶ֥ה בְ/הַר יְהוָ֑ה וּ/מִי יָ֝קוּם בִּ/מְק֥וֹם קָדְשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/003.yaml
  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: id
  text: Siapakah yang boleh naik ke gunung Yahweh? Dan siapakah yang boleh berdiri di tempat-Nya yang kudus?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukit Yahweh.” Kata Ibrani הַר dapat berarti “gunung” atau “bukit”; “gunung” dipertahankan di sini sebagai padanan yang lebih umum dalam mazmur ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapakah
  rationale: Kata tanya ini membuka pertanyaan retoris tentang orang yang memenuhi syarat; “Siapakah” alami dan bermartabat dalam bahasa Indonesia.
- source_word: יַעֲלֶה
  choice: yang boleh naik
  rationale: Bentuk imperfek dari עלה berarti “naik.” Dalam konteks liturgis ini, “boleh” menyampaikan kelayakan atau izin untuk menghampiri, bukan sekadar tindakan pada masa depan.
- source_word: בְהַר
  choice: ke gunung
  rationale: הַר dapat berarti “gunung” atau “bukit.” “Gunung” dipilih sebagai padanan umum dan sesuai dengan gambaran tempat kediaman Allah yang tinggi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” sehingga nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: וּמִי
  choice: Dan siapakah
  rationale: Konjungsi dan kata tanya dipertahankan untuk menjaga kesejajaran puitis kedua baris.
- source_word: יָקוּם
  choice: yang boleh berdiri
  rationale: קום dapat berarti “bangkit” atau “berdiri.” Dalam konteks akses ke hadirat Allah, “berdiri” menyatakan mengambil tempat atau tetap berada di sana; “boleh” mempertahankan nuansa kelayakan.
- source_word: בִּמְקוֹם
  choice: di tempat
  rationale: מָקוֹם secara umum berarti “tempat.” Padanan ini tidak mempersempit maknanya menjadi “tempat kudus” atau “Bait Suci” secara berlebihan.
- source_word: קָדְשׁוֹ
  choice: -Nya yang kudus
  rationale: Bentuk ini mengandung makna kekudusan dan sufiks orang ketiga tunggal maskulin. Dalam frasa Indonesia, “tempat-Nya yang kudus” menyatakan kepemilikan dan sifat kudus dengan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Daya imperfek dalam kedua pertanyaan retoris
  choice: yang boleh naik / yang boleh berdiri
  alternative: yang akan naik / yang dapat naik; yang akan berdiri / yang dapat berdiri
  rationale: Konteks menanyakan siapa yang layak atau mendapat akses untuk menghampiri dan berada di hadirat Yahweh, bukan hanya siapa yang kelak melakukan tindakan tersebut. “Boleh” menjaga nuansa izin dan kelayakan tanpa menentukan dasar teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang jelas dan bermartabat. Pengulangan “Siapakah yang boleh” mempertahankan paralelisme Ibrani; bentuk “tempat-Nya yang kudus” dipilih agar alami tanpa mempersempit rujukan tempat tersebut.
