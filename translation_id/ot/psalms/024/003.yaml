  terminology: “Yahweh” konsisten dengan keputusan untuk menerjemahkan tetragram sebagai nama ilahi. “Gunung,” “boleh naik,” dan “boleh berdiri” selaras dengan makna leksikal serta fungsi konteksnya. Catatan kaki [a] terpasang pada unit yang relevan dan secara tepat menjelaskan alternatif “bukit.”
