  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: id
  text: 'Mazmur Daud.[a]


    Bumi beserta segala isinya adalah milik Yahweh,

    dunia dan para penghuninya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata depan Ibrani pada nama Daud dapat menunjukkan bahwa mazmur ini merupakan karya Daud, milik Daud, dipersembahkan untuk Daud, atau berkaitan dengannya.
    reason: lexical_ambiguity
  - marker: b
    text: 'Atau, lebih harfiah: “Bumi dan kepenuhannya adalah milik Yahweh, dunia dan para penghuninya.”'
    reason: literal_rendering
lexical_decisions:
- source_word: לְדָוִד
  choice: Mazmur Daud
  rationale: Ungkapan judul yang alami dalam bahasa Indonesia dan tetap cukup terbuka terhadap hubungan yang ditandai oleh לְ—karya, milik, untuk, atau berkaitan dengan Daud; ragam kemungkinannya dijelaskan dalam catatan kaki.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku dan mudah dipahami untuk nyanyian ibadah yang disebut מִזְמוֹר.
- source_word: לַיהוָה
  choice: adalah milik Yahweh
  rationale: Klausa nominal Ibrani menyatakan kepemilikan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan nama ilahi יהוה sebagai Yahweh.
- source_word: הָאָרֶץ
  choice: Bumi
  rationale: Paralel dengan תֵּבֵל dan cakupan universal ayat mendukung arti 'bumi', bukan 'tanah'.
- source_word: וּמְלוֹאָהּ
  choice: beserta segala isinya
  rationale: Menyampaikan makna 'kepenuhannya/semua yang memenuhi bumi' dengan bahasa Indonesia yang wajar tanpa menghilangkan cakupan menyeluruhnya.
- source_word: תֵּבֵל
  choice: dunia
  rationale: Padanan alami bagi dunia yang teratur dan didiami; nuansa berpenghuni dipertegas oleh frasa berikutnya.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: dan semua yang tinggal di dalamnya
  rationale: Mempertahankan daya verbal partisip Ibrani, yakni mereka yang sedang mendiami dunia, serta tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Cakupan kepemilikan ilahi
  choice: Bumi beserta segala isinya adalah milik Yahweh
  alternative: Bumi adalah milik Yahweh, demikian juga segala isinya
  rationale: Pilihan utama mengikuti struktur Ibrani yang menempatkan 'bumi dan kepenuhannya' sebagai satu kesatuan milik Yahweh, tanpa menyempitkan cakupannya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Baris-baris puisi mempertahankan paralelisme Ibrani. Ungkapan 'segala isinya' dipilih daripada 'kepenuhannya' agar alami bagi pembaca umum, sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki.
