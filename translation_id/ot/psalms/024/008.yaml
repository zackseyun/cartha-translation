id: PSA.24.8
reference: Psalms 24:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: id
  text: Siapakah Raja kemuliaan ini? Yahweh, kuat dan perkasa; Yahweh, perkasa dalam pertempuran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perkasa dalam peperangan.”'
    reason: Alternatif leksikal untuk מִלְחָמָה; kata ini dapat merujuk pada pertempuran tertentu atau peperangan secara lebih umum.
lexical_decisions:
- source_word: מִי זֶה
  choice: Siapakah ... ini?
  rationale: Ungkapan tanya ini secara idiomatis berarti “Siapakah ... ini?” dan mempertahankan bentuk seruan-jawaban liturgis dalam mazmur.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Raja kemuliaan
  rationale: Rangkaian konstruksi Ibrani dipertahankan sebagai gelar “Raja kemuliaan,” bukan diubah menjadi “Raja yang mulia,” agar daya titular dan pengulangan mazmur tetap terjaga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: עִזּוּז
  choice: kuat
  rationale: 'Kata ini menyatakan kekuatan atau kuasa. “Kuat” membedakannya dari גִּבּוֹר yang menyusul dan menghasilkan pasangan Indonesia yang alami: “kuat dan perkasa.”'
- source_word: וְגִבּוֹר
  choice: dan perkasa
  rationale: גִּבּוֹר dapat menunjuk pada seseorang yang gagah atau perkasa. Di sini “perkasa” mempertahankan kesejajaran tanpa memperkenalkan kata benda “pahlawan” atau “pejuang.”
- source_word: גִּבּוֹר מִלְחָמָה
  choice: perkasa dalam pertempuran
  rationale: Terjemahan ini mempertahankan unsur sifat “perkasa” dan ranah perang dari מִלְחָמָה tanpa menambahkan kata benda “pejuang” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi YHWH secara langsung. “Yahweh” mempertahankannya sebagai nama, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehuwa” memakai bentuk vokalisasi tradisional yang lebih jauh dari rekonstruksi akademis umum.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur tanya-jawab serta pengulangan “Yahweh” dan “perkasa” dipertahankan untuk menjaga irama dan paralelisme puitis.
