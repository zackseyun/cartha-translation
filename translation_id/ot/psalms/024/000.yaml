base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/000.yaml
  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: id
  text: 'Mazmur Daud.[a]


    Bumi serta segala isinya milik YAHWEH,

    dunia dan para penghuninya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mazmur untuk Daud.”'
    reason: ambiguity
lexical_decisions:
- source_word: לְדָוִד
  choice: Mazmur Daud
  rationale: Bentuk ringkas ini alami sebagai judul mazmur dan mempertahankan hubungan luas dengan Daud; preposisi לְ dapat menyatakan kepengarangan, keterkaitan, atau peruntukan.
- source_word: לַיהוָה
  choice: Milik YAHWEH-lah
  rationale: Konstruksi posesif di awal kalimat diberi penekanan dengan “-lah”, sedangkan nama ilahi יהוה ditransliterasikan sebagai YAHWEH, bukan diganti dengan gelar.
- source_word: הָאָרֶץ וּמְלוֹאָהּ
  choice: bumi beserta segala isinya
  rationale: מְלוֹאָהּ secara harfiah menunjuk pada kepenuhan atau segala yang memenuhi bumi; ungkapan Indonesia ini jelas dan alami tanpa mengubah cakupannya.
- source_word: תֵּבֵל
  choice: dunia
  rationale: Istilah ini menunjuk pada dunia atau bumi yang dihuni, sejajar secara puitis dengan הָאָרֶץ.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: dan semua yang tinggal di dalamnya
  rationale: Partisipel jamak dapat mencakup para penghuni secara umum; “semua yang” mempertahankan keluasan itu tanpa membatasinya secara eksplisit hanya kepada manusia.
theological_decisions:
- issue: Hubungan Daud dengan mazmur dalam לְדָוִד
  choice: Mazmur Daud
  alternative: Mazmur untuk Daud
  rationale: Ungkapan Ibrani tidak dengan sendirinya memastikan apakah Daud adalah pengarang, penerima, atau tokoh yang dikaitkan dengan mazmur; terjemahan utama memakai bentuk judul yang lazim, sementara alternatif dicatat.
- issue: Penyajian nama perjanjian יהוה
  choice: YAHWEH
  alternative: TUHAN
  rationale: Nama diri dipertahankan agar berbeda dari gelar אֲדֹנָי dan agar bentuk sumber terlihat jelas; kapitalisasi mengikuti kebiasaan yang mudah dikenali pembaca Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dua baris mempertahankan kesejajaran puisi Ibrani; penekanan awal pada kepemilikan YAHWEH dipertahankan secara alami dengan konstruksi “Milik ...-lah”.
