source:
  edition: WLC
  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: id
  text: Ia akan menerima berkat dari Yahweh dan kebenaran[a] dari Allah keselamatannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembenaran” atau “keadilan.” Istilah Ibrani ini dapat mengandung nuansa putusan yang membenarkan dan tindakan penyelamatan, selain kebenaran moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: akan menerima
  rationale: Walaupun נָשָׂא pada dasarnya berarti 'mengangkat, membawa, menanggung', dengan objek abstrak בְּרָכָה ungkapan ini secara idiomatis berarti menerima atau memperoleh berkat.
- source_word: בְּרָכָה
  choice: berkat
  rationale: Padanan baku yang mempertahankan bentuk tunggal dan gagasan tentang kemurahan yang dianugerahkan.
- source_word: מֵאֵת יְהוָה
  choice: dari Yahweh
  rationale: Kata depan menandai sumber, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: וּצְדָקָה
  choice: dan kebenaran
  rationale: צְדָקָה mencakup kebenaran, keadilan, dan pembenaran. 'Kebenaran' mempertahankan keluasan makna, sementara kemungkinan yudisialnya dicatat dalam catatan kaki.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: dari Allah yang menyelamatkannya
  rationale: Konstruksi harfiah 'Allah keselamatannya' kurang alami dalam bahasa Indonesia. Klausa relatif menyampaikan Allah sebagai sumber keselamatan tanpa mengubah pelaku atau penerimanya.
- source_word: יִשְׁעוֹ
  choice: yang menyelamatkannya
  rationale: Bentuk ini mengungkapkan secara alami bahwa keselamatan atau pembebasan orang tersebut berasal dari Allah; 'keselamatannya' tetap mungkin sebagai padanan lebih formal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama perjanjian dan mengikuti lapisan konsultasi yang telah diaudit.
- issue: Makna צְדָקָה dalam konteks ini
  choice: kebenaran
  alternative: pembenaran; keadilan
  rationale: '''Kebenaran'' mempertahankan cakupan moral dan relasional istilah itu tanpa menutup kemungkinan nuansa putusan yang membenarkan atau keadilan Allah yang menyelamatkan; alternatif dicatat agar ketegangan semantis tetap terbuka.'
- issue: Relasi genitif dalam אֱלֹהֵי יִשְׁעוֹ
  choice: Allah yang menyelamatkannya
  alternative: Allah keselamatannya; Allah, Penyelamatnya
  rationale: Bahasa Ibrani dapat menunjuk kepada Allah sebagai sumber keselamatan atau sebagai Allah yang bertindak menyelamatkan. Rumusan Indonesia yang dipilih alami dan mempertahankan inti relasi itu, meski sedikit lebih eksplisit secara verbal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Ia' merujuk kepada orang yang digambarkan dalam ayat sebelumnya. Susunan paralel 'dari Yahweh ... dari Allah' dipertahankan; konstruksi genitif terakhir dibuat lebih alami bagi pembaca Indonesia.
