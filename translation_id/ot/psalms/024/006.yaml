id: PSA.24.6
reference: Psalms 24:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זֶ֭ה דּ֣וֹר דרש/ו מְבַקְשֵׁ֨י פָנֶ֖י/ךָ יַעֲקֹ֣ב סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/006.yaml
  text: Such is the generation of those who seek him, who seek your face, O Jacob. Selah
translation:
  language: id
  text: 'Inilah angkatan orang-orang yang mencari Dia,

    yang mencari wajah-Mu, wahai Yakub.[a] Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “yang mencari wajah-Mu, wahai Yakub.” Sejumlah terjemahan mengikuti bacaan atau pemahaman lain, seperti “yang mencari wajah Allah Yakub.”
    reason: Sapaan 'Yakub' dalam teks Masoretik sukar secara konteks dan sintaksis; catatan mempertahankan teks utama sekaligus memberi tahu pembaca tentang alternatif yang luas dikenal tanpa menyelesaikan ketegangan secara diam-diam.
lexical_decisions:
- source_word: זֶה דּוֹר
  choice: Inilah angkatan
  rationale: Menjaga ungkapan demonstratif dan arti kolektif-generasional dari teks Ibrani dalam bahasa Indonesia yang wajar.
- source_word: דרש/ו
  choice: orang-orang yang mencari Dia
  rationale: Ketiv/Qere menunjuk bentuk jamak 'mereka yang mencari'; objek pronominal laki-laki tunggal diterjemahkan eksplisit sebagai 'Dia'.
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: yang mencari wajah-Mu
  rationale: Mempertahankan metafora Ibrani 'mencari wajah' dan pronomina orang kedua tunggal.
- source_word: יַעֲקֹב
  choice: wahai Yakub
  rationale: Teks Masoretik secara langsung berbunyi 'Yakub' tanpa 'Allah dari'; dipertahankan sebagai sapaan meskipun konstruksinya sukar.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal yang maknanya tidak pasti ditransliterasikan.
theological_decisions:
- issue: Identitas pihak yang disapa dalam frasa 'wajah-Mu, Yakub'
  choice: wahai Yakub
  alternative: ya Allah Yakub / wajah Allah Yakub
  rationale: Mengikuti teks konsonantal dan vokalisasi Masoretik yang tersedia, tanpa menambahkan kata 'Allah' yang tidak terdapat dalam sumber; keganjilan dan ambiguitas tekstual dijelaskan dalam catatan.
translation_notes:
  register: Bahasa modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan editorial Indonesia; susunan dua baris mempertahankan paralelisme puisi. Istilah 'angkatan' dipilih karena lebih alami daripada 'generasi' dalam register Alkitabiah, sedangkan 'wajah-Mu' sengaja dipertahankan sebagai metafora sumber.
