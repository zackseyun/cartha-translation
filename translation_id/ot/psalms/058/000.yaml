  text: לַ/מְנַצֵּ֥חַ אַל תַּשְׁחֵ֗ת לְ/דָוִ֥ד מִכְתָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] Of David. A miktam.[b]'
translation:
  language: id
  text: Untuk pemimpin musik. “Jangan Musnahkan.”[a] Dari Daud. Miktam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Menurut lagu ‘Jangan Musnahkan’,” jika frasa ini secara lebih khusus menyebut lagu atau pola musik yang digunakan.
    reason: alternative_reading
  - marker: b
    text: Istilah Ibrani miktam adalah sebutan bagi jenis mazmur yang maknanya tidak pasti; mungkin istilah ini menunjuk kepada suatu jenis gubahan atau pola musik.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini dalam judul-judul mazmur menunjuk kepada orang yang memimpin pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia modern dan tidak membatasi perannya hanya pada paduan suara.
- source_word: אַל תַּשְׁחֵת
  choice: “Jangan Musnahkan”
  rationale: Dalam judul mazmur, frasa ini kemungkinan besar merupakan nama lagu atau pola musik. Tanda petik menandainya sebagai judul tanpa menambahkan kata depan yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Preposisi Ibrani לְ dapat menunjukkan kepengarangan, peruntukan, atau hubungan. “Dari Daud” tetap alami sekaligus tidak setegas “ditulis oleh Daud” dalam menetapkan kepengarangan.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Makna tepat istilah ini tidak diketahui. Transliterasi menghindari terjemahan spekulatif dan mempertahankannya sebagai label sastra atau musik.
theological_decisions:
- issue: Sifat frasa אַל תַּשְׁחֵת dalam judul mazmur
  choice: Memperlakukannya sebagai judul lagu atau pola musik yang mungkin, dengan bentuk “Jangan Musnahkan”
  alternative: Memahaminya sebagai perintah langsung, atau menerjemahkannya secara eksplisit “Menurut lagu ‘Jangan Musnahkan’”
  rationale: Pemakaian dalam sejumlah judul mazmur mendukung fungsi musikal, tetapi teks Ibrani tidak memuat kata yang secara eksplisit berarti “menurut lagu”; karena itu bentuk ringkas mempertahankan ketegangan tersebut.
- issue: Hubungan Daud dengan mazmur
  choice: Dari Daud
  alternative: Oleh Daud; Untuk Daud
  rationale: Ungkapan Ibrani tidak dengan sendirinya memastikan apakah yang dimaksud ialah kepengarangan, peruntukan, atau hubungan lain. Terjemahan tidak boleh memastikan hal yang dibiarkan terbuka oleh sumber.
translation_notes:
  register: Bahasa Indonesia baku yang ringkas dan bermartabat. “Pemimpin musik” dipilih karena mudah dipahami pembaca modern. Tanda petik mempertahankan kemungkinan bahwa “Jangan Musnahkan” adalah judul, sedangkan istilah teknis “miktam” dipertahankan dan dijelaskan dalam catatan kaki.
