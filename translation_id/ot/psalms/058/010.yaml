  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: id
  text: Orang benar akan bersukacita ketika ia melihat pembalasan[a]; ia akan membasuh kakinya dalam darah orang fasik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karena ia telah melihat pembalasan.” Konjungsi Ibrani dapat dipahami secara kausal (“karena/sebab”) maupun temporal (“ketika”).'
    reason: lexical_alternative
  - marker: b
    text: Gambaran “membasuh kakinya dalam darah orang fasik” adalah bahasa puitis yang melukiskan tuntasnya penghukuman, bukan perintah untuk melakukan kekerasan pribadi.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: akan bersukacita
  rationale: Bentuk imperfek Qal orang ketiga tunggal menyatakan nuansa mendatang dalam konteks puitis; pilihan ini alami dan tetap mempertahankan daya prediktifnya.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva tunggal yang dipakai secara substantival; ungkapan ini alami dalam bahasa Indonesia dan dapat berfungsi secara representatif.
- source_word: כִּי
  choice: ketika
  rationale: Di sini konjungsi tersebut dapat memperkenalkan keadaan yang memicu sukacita, dengan nuansa temporal-kausal. Kemungkinan arti kausal dicatat dalam catatan kaki.
- source_word: חָזָה
  choice: ia melihat
  rationale: Bentuk perfektif dapat diterjemahkan dengan kala kini dalam anak kalimat yang berorientasi ke masa depan; 'melihat' lugas dan tidak arkais.
- source_word: נָקָם
  choice: pembalasan
  rationale: Nomina ini menunjuk pada tindakan pembalasan atau penghukuman setimpal. 'Pembalasan' mempertahankan kerasnya gambaran tanpa mempersempit pelakunya menjadi tindakan balas dendam pribadi.
- source_word: פְּעָמָיו
  choice: kakinya
  rationale: Walaupun kata dasarnya dapat berarti langkah atau hentakan kaki, dalam gambaran membasuh dalam darah makna konkret 'kakinya' paling sesuai.
- source_word: יִרְחַץ
  choice: ia akan membasuh
  rationale: Imperfek Qal orang ketiga tunggal dari רחץ berarti 'membasuh'; bentuk mendatang sesuai dengan baris pertama.
- source_word: בְּדַם
  choice: dalam darah
  rationale: Preposisi ב paling alami dipahami secara lokatif dalam gambaran ini; terjemahan tersebut mempertahankan citra puitis yang tajam.
- source_word: הָרָשָׁע
  choice: orang fasik
  rationale: Adjektiva tunggal substantival ini dapat bersifat representatif atau kolektif. 'Orang fasik' mempertahankan bentuk tunggal dan register mazmur yang bermartabat.
theological_decisions:
- issue: Apakah ayat ini menggambarkan dendam pribadi atau sukacita atas penghukuman yang adil
  choice: Teks utama mempertahankan sukacita ketika menyaksikan pembalasan tanpa menyebutnya sebagai balas dendam pribadi ataupun secara eksplisit menambahkan bahwa pembalasan itu ilahi.
  alternative: Menafsirkan ayat sebagai perayaan pembalasan pribadi, atau melunakkannya menjadi sukacita atas pembenaran semata.
  rationale: Bahasa Ibrani menyatakan bahwa orang benar bersukacita saat melihat pembalasan dan memakai gambaran keras tentang kaki yang dibasuh dalam darah orang fasik. Terjemahan mempertahankan ketegangan teologis tersebut tanpa memasukkan penjelasan yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'orang benar' dan 'orang fasik' sesuai dengan register puitis-biblis yang tetap mudah dipahami. Pronomina tunggal 'ia' mempertahankan bentuk representatif Ibrani.
