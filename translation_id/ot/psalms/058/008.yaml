  yaml_path: translation/ot/psalms/058/008.yaml
  text: Like a snail that melts away as it goes[b][a], like a stillborn child that has not seen the sun.
translation:
  language: id
  text: Seperti siput yang mencair selagi merayap,[a] seperti janin yang gugur dari kandungan seorang perempuan dan tidak pernah melihat matahari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan Ibraninya padat: secara harfiah kira-kira, “seperti siput—cair—ia berjalan.” Gambaran yang dimaksud ialah siput yang seolah-olah larut atau lenyap sementara bergerak.'
    reason: lexical_alternative
  - marker: b
    text: Susunan Ibraninya sulit dan secara harfiah berbunyi kira-kira, “janin gugur seorang perempuan—mereka tidak melihat matahari.” Verba “melihat” berbentuk jamak, meskipun “janin gugur” berbentuk tunggal; maksudnya tampaknya janin itu, atau janin-janin gugur sebagai suatu golongan, bukan ibunya.
    reason: source_syntax
lexical_decisions:
- source_word: כְּמוֹ
  choice: Seperti
  rationale: Memperkenalkan perbandingan secara alami dan mempertahankan daya komparatif teks Ibrani.
- source_word: שַׁבְּלוּל
  choice: siput
  rationale: Makna tradisional dan paling mapan ialah ‘siput’; ‘lintah bulan’ mungkin, tetapi kurang pasti dan kurang lazim dalam tradisi penafsiran ayat ini.
- source_word: תֶּמֶס
  choice: yang mencair
  rationale: Berasal dari akar yang berkaitan dengan mencair atau larut. Bentuk verbal dalam bahasa Indonesia menyampaikan gambaran puitis dengan jelas tanpa menjelaskan mekanismenya.
- source_word: יַהֲלֹךְ
  choice: selagi merayap
  rationale: Secara dasar berarti ‘berjalan/pergi’. ‘Merayap’ merupakan padanan alami bagi gerak siput, sedangkan ‘selagi’ menunjukkan bahwa pencairan berlangsung dalam perjalanannya.
- source_word: נֵפֶל
  choice: janin gugur
  rationale: Kata ini menunjuk pada hasil keguguran atau kelahiran yang tidak bertahan hidup. ‘Janin gugur’ cukup langsung, wajar dalam bahasa Indonesia, dan tidak menentukan secara berlebihan apakah kematian terjadi tepat sebelum atau saat kelahiran.
- source_word: אֵשֶׁת
  choice: dari kandungan seorang perempuan
  rationale: Secara harfiah berarti ‘milik/seorang perempuan’ dalam rangkaian konstruksi. Penambahan ‘dari kandungan’ membuat hubungan dengan janin gugur jelas dan alami dalam bahasa Indonesia.
- source_word: בַּל
  choice: tidak pernah
  rationale: Partikel ini meniadakan verba berikutnya. Dalam konteks janin yang tidak mengalami hidup di bawah matahari, ‘tidak pernah’ menyampaikan maksud secara idiomatis.
- source_word: חָזוּ
  choice: melihat
  rationale: Berarti ‘melihat’. Bentuk Ibraninya jamak meskipun נֵפֶל berbentuk tunggal; bahasa Indonesia tidak perlu memaksakan ketidakselarasan jumlah itu ke dalam teks utama.
- source_word: שָׁמֶשׁ
  choice: matahari
  rationale: Padanan langsung yang mempertahankan citra puitis tentang tidak sempat mengalami kehidupan di dunia.
theological_decisions:
- issue: Rujukan klausa ‘tidak melihat matahari’
  choice: Klausa diterapkan pada janin gugur, bukan pada perempuan itu.
  alternative: Menerapkannya pada perempuan karena letak kata yang berdekatan.
  rationale: Makna konteks dan kesepadanan menurut pengertian menunjukkan bahwa yang tidak pernah melihat matahari adalah janin yang gugur. Menerapkannya pada ibunya menghasilkan makna yang keliru.
- issue: Ketidakselarasan jumlah antara נֵפֶל dan חָזוּ
  choice: Teks utama memakai bentuk tunggal alami, sementara bentuk jamak Ibrani dicatat dalam catatan kaki.
  alternative: Memakai ‘mereka tidak pernah melihat matahari’ dalam teks utama.
  rationale: Verba jamak kemungkinan merupakan persesuaian menurut pengertian atau pergeseran ke golongan janin-janin gugur. Terjemahan tunggal mengikuti simile individual tanpa menutupi bentuk sumber, karena bentuk sumber dijelaskan dalam catatan.
translation_notes:
  register: Bahasa puitis yang lugas dan bermartabat. ‘Selagi merayap’ lebih alami bagi siput daripada terjemahan mekanis ‘selagi berjalan’. ‘Janin gugur’ dipilih untuk mempertahankan keluasan makna sumber dan menghindari penentuan medis yang terlalu sempit.
