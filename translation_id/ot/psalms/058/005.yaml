lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini meneruskan gambaran ular sendok yang tuli pada ayat sebelumnya; “yang” mempertahankan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: לֹא יִשְׁמַע
  choice: tidak mendengarkan
  rationale: Bentuk ini menggambarkan bahwa ular itu tidak mengindahkan atau tidak menanggapi bunyi; “mendengarkan” lebih sesuai dengan konteks daripada sekadar kemampuan mendengar.
- source_word: לְקוֹל
  choice: suara
  rationale: קוֹל dapat berarti “suara” atau “bunyi.” Karena yang mengeluarkannya adalah para pelaku yang melafalkan mantera, “suara” paling alami di sini.
- source_word: מְלַחֲשִׁים
  choice: para pawang
  rationale: Istilah ini berasal dari akar yang berkaitan dengan bisikan atau mantera. Dalam konteks penanganan ular, “pawang” menyampaikan fungsi pelakunya dengan jelas, sementara nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: חוֹבֵר חֲבָרִים
  choice: perapal mantra
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan orang yang ‘mengikat’ mantera atau jampi. “Perapal mantra” menyampaikan idiom itu secara wajar tanpa mempertahankan metafora yang kabur dalam bahasa Indonesia.
- source_word: מְחֻכָּם
  choice: sangat ahli
  rationale: Dalam konteks ini kata tersebut menunjukkan kemahiran atau keahlian, bukan hikmat dalam arti moral. “Sangat ahli” mengungkapkan keahlian sang pemantra dengan jelas.
