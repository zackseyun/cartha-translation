  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suara orang-orang yang berbisik.” Istilah Ibrani yang diterjemahkan “perapal mantra” berkaitan dengan bisikan atau pelafalan mantra.
