  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַֽ/אֻמְנָ֗ם אֵ֣לֶם צֶ֭דֶק תְּדַבֵּר֑וּ/ן מֵישָׁרִ֥ים תִּ֝שְׁפְּט֗וּ בְּנֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/001.yaml
  text: Do you indeed speak righteousness in silence? Do you judge uprightly[c][b][a], sons of man?
translation:
  language: id
  text: Benarkah dalam kebisuan[a] kamu mengatakan apa yang benar? Apakah kamu menghakimi dengan adil, hai anak-anak manusia?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani אֵלֶם sulit dipahami. Teks Masoret menunjuknya sebagai “kebisuan” atau “ketidakmampuan berbicara”; banyak penafsir memahaminya sebagai “orang-orang perkasa” atau bahkan “para ilah”, sehingga kalimatnya dapat diterjemahkan, “Benarkah kamu mengatakan apa yang benar, hai orang-orang perkasa?”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “anak-anak manusia”; ungkapan ini dapat berarti “manusia” atau “umat manusia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: Benarkah
  rationale: Partikel tanya yang diperkuat ini memperkenalkan pertanyaan retoris. “Benarkah” menyampaikan penekanan dan nada gugatan secara alami dalam bahasa Indonesia.
- source_word: אֵלֶם
  choice: dalam kebisuan
  rationale: Teks Masoret menunjuk bentuk yang berkaitan dengan kebisuan atau ketidakmampuan berbicara. Terjemahan utama mengikuti vokalisasi yang diterima, meskipun hasilnya sengaja tetap tajam dan sukar; pembacaan alternatif dicatat dalam catatan kaki.
- source_word: צֶדֶק
  choice: apa yang benar
  rationale: Dalam hubungan dengan verba “mengatakan”, frasa ini lebih alami daripada “mengatakan kebenaran” atau “mengatakan keadilan”, sambil tetap mempertahankan makna moral-yudisial nomina Ibrani.
- source_word: תְּדַבֵּרוּן
  choice: kamu mengatakan
  rationale: Verba ini berarti berbicara atau mengucapkan. “Mengatakan” cocok secara alami dengan objek “apa yang benar” dan mempertahankan bentuk orang kedua jamak melalui konteks.
- source_word: מֵישָׁרִים
  choice: dengan adil
  rationale: Bentuk ini berfungsi secara adverbial dan menyatakan kelurusan atau keadilan dalam penghakiman. “Dengan adil” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: תִּשְׁפְּטוּ
  choice: kamu menghakimi
  rationale: Konteksnya bersifat yudisial. “Menghakimi” mempertahankan daya hukum verba tersebut.
- source_word: בְּנֵי אָדָם
  choice: hai anak-anak manusia
  rationale: Ungkapan ini secara harfiah berarti “anak-anak manusia/Adam” dan di sini berfungsi sebagai sapaan kepada para hakim yang fana. “Hai” memperjelas fungsi vokatif tanpa mengubah letaknya di akhir ayat.
theological_decisions:
- issue: Penafsiran אֵלֶם dalam ayat yang sukar ini
  choice: Mengikuti vokalisasi Teks Masoret sebagai “kebisuan” dalam teks utama
  alternative: Membacanya sebagai sapaan “hai orang-orang perkasa” atau “hai para ilah”
  rationale: Bentuk ini sulit secara tekstual dan leksikal. Vokalisasi Masoret mendukung arti yang berhubungan dengan kebisuan, sedangkan pembacaan alternatif mengubah siapa yang disapa dan arah pertanyaan. Ketegangan ini tidak diselesaikan secara diam-diam, tetapi dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan nada gugatan retoris. Kejanggalan ungkapan “dalam kebisuan” dipertahankan karena berasal dari kesulitan nyata dalam teks Ibrani, bukan dihaluskan menjadi tafsiran tertentu.
