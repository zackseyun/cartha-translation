lexical_decisions:
- source_word: חֲמַת
  choice: bisa
  rationale: Dalam kesejajaran dengan ular, nomina ini paling alami berarti racun ular. Dalam bahasa Indonesia, “bisa” adalah istilah yang tepat dan idiomatis.
- source_word: לָמוֹ
  choice: mereka
  rationale: Bentuk pronominal ini dipahami secara posesif dalam frasa “bisa mereka,” bukan secara harfiah sebagai “bagi mereka.”
- source_word: כִּדְמוּת
  choice: seperti
  rationale: Konstruksi ini memperkenalkan perbandingan; “seperti” alami dan tetap mempertahankan bentuk simile.
- source_word: נָחָשׁ
  choice: ular
  rationale: Istilah umum “ular” sesuai dengan makna Ibrani dan menjadi kategori umum sebelum jenis ular berbisa pada baris berikutnya.
- source_word: כְּמוֹ
  choice: seperti
  rationale: Partikel perbandingan ini paling jelas dan alami diterjemahkan “seperti.”
- source_word: פֶתֶן
  choice: ular tedung
  rationale: Kata ini menunjuk pada ular berbisa, secara tradisional diterjemahkan “asp.” “Ular tedung” merupakan padanan modern yang mudah dipahami tanpa mengklaim identifikasi zoologis yang sepenuhnya pasti.
- source_word: חֵרֵשׁ
  choice: tuli
  rationale: Adjektiva ini berarti “tuli”; gambarnya ialah ular yang tidak mendengarkan, bukan ular yang bisu.
- source_word: יַאְטֵם
  choice: menyumbat
  rationale: Verba ini menyatakan tindakan menutup atau menyegel. “Menyumbat” mempertahankan gambaran fisik yang kuat.
- source_word: אָזְנוֹ
  choice: telinganya
  rationale: Pronomina tunggal merujuk kepada ular tedung; bentuk “-nya” alami dalam bahasa Indonesia dan tidak menambahkan penentuan gender.
