  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: id
  text: Orang akan berkata, “Sungguh, ada buah bagi orang benar[a]; sungguh, ada Allah yang menghakimi[b] di bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ada buah bagi orang benar”; maksudnya, orang benar sungguh menerima hasil atau ganjaran.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Ibrani, kata yang diterjemahkan “Allah” dan “yang menghakimi” berbentuk jamak. Bentuk-bentuk ini dapat dipahami sebagai merujuk kepada Allah tunggal, atau, lebih jarang, sebagai “ilah-ilah yang menghakimi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: Orang akan berkata
  rationale: Bentuk imperfek dalam alur mazmur ini paling wajar menyatakan tanggapan yang akan muncul sesudah penghukuman yang digambarkan sebelumnya. אָדָם bersifat generik; ‘orang’ alami dalam bahasa Indonesia tanpa membatasi maksudnya pada laki-laki.
- source_word: אַךְ
  choice: Sungguh
  rationale: Dalam kedua kemunculannya, partikel ini menegaskan kepastian, bukan pembatasan. ‘Sungguh’ mempertahankan daya retoris pengakuan tersebut.
- source_word: פְּרִי לַצַּדִּיק
  choice: ada buah bagi orang benar
  rationale: ‘Buah’ mempertahankan metafora Ibrani tentang hasil atau ganjaran yang diterima orang benar; konstruksi dengan ל menyatakan sesuatu yang tersedia atau diperuntukkan baginya.
- source_word: יֵשׁ אֱלֹהִים
  choice: ada Allah
  rationale: יֵשׁ merupakan ungkapan eksistensial. Dalam konteks pengakuan tentang keadilan ilahi, אֱלֹהִים paling mungkin menunjuk kepada Allah yang esa.
- source_word: שֹׁפְטִים בָּאָרֶץ
  choice: yang menghakimi di bumi
  rationale: Partisipel jamak mengikuti bentuk morfologis אֱלֹהִים, tetapi dalam konteks ini paling mungkin berfungsi dengan acuan tunggal. ‘Di bumi’ menyatakan lingkup pelaksanaan penghakiman ilahi secara alami.
theological_decisions:
- issue: Apakah אֱלֹהִים שֹׁפְטִים menunjuk kepada Allah tunggal atau para ilah/hakim jamak
  choice: Allah yang menghakimi
  alternative: ilah-ilah yang menghakimi
  rationale: Klimaks mazmur menegaskan kenyataan keadilan ilahi, sehingga acuan kepada Allah yang esa paling sesuai dengan konteks. Namun, karena אֱלֹהִים dan partisipelnya berbentuk jamak secara morfologis, kemungkinan pembacaan jamak dicatat dalam catatan kaki agar ambiguitas sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan cukup formal untuk pembacaan Kitab Suci. Metafora ‘buah’ dipertahankan, sedangkan catatan kaki menjelaskan maknanya. Penanda [a] dan [b] ditempatkan langsung pada unsur yang dijelaskan.
