  text: אַף בְּ/לֵב֮ עוֹלֹ֪ת תִּפְעָ֫ל֥וּ/ן בָּ/אָ֡רֶץ חֲמַ֥ס יְ֝דֵי/כֶ֗ם תְּפַלֵּֽסֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/002.yaml
  text: Even in your heart you work injustice[b][a]; on the earth your hands weigh out violence.
translation:
  language: id
  text: Bahkan dalam hati kamu melakukan ketidakadilan; di bumi[b] tanganmu menimbang kekerasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menakar kekerasan.” Kata kerja Ibrani dapat berarti menimbang atau menakar.
    reason: lexical_alternative
  - marker: b
    text: Atau “di negeri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Bahkan
  rationale: Partikel penegas ini memperluas tuduhan sampai ke batin para penerima teguran; “bahkan” menyampaikan daya tekan tersebut secara alami.
- source_word: בְּלֵב
  choice: dalam hati kamu
  rationale: Frasa ini menunjuk pada batin atau niat moral. Bentuk tunggal kolektif dipertahankan dalam ungkapan Indonesia yang alami.
- source_word: עוֹלֹת
  choice: ketidakadilan
  rationale: Nomina ini menyatakan kesalahan moral atau ketidakadilan; bentuk abstrak Indonesia sesuai dengan konteks penghakiman dan dapat mewakili jamak Ibrani.
- source_word: תִּפְעָלוּן
  choice: kamu melakukan
  rationale: Verba פעל berarti berbuat atau mengerjakan. “Melakukan” jelas, aktif, dan berterima dengan objek “ketidakadilan”.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: “Bumi” mempertahankan cakupan luas yang mungkin dimaksud dan membentuk kontras antara niat batin dengan tindakan nyata; “di negeri” tetap mungkin.
- source_word: חֲמַס
  choice: kekerasan
  rationale: חמס lazim menunjuk pada kekerasan atau kejahatan yang menindas; “kekerasan” adalah padanan langsung dalam konteks ini.
- source_word: יְדֵיכֶם
  choice: tanganmu
  rationale: Citra tangan dipertahankan sebagai ungkapan konkret bagi perbuatan dan tanggung jawab para penerima teguran.
- source_word: תְּפַלֵּסוּן
  choice: kamu menimbang
  rationale: Bentuk orang kedua jamak ini berasal dari פלס, yang dapat berarti menimbang atau menakar. “Menimbang” mempertahankan metafora pengukuran dan ironi pengadilan yang menyimpang.
theological_decisions:
- issue: Daya metaforis verba terakhir dalam konteks pengadilan
  choice: Memakai “menimbang” untuk mempertahankan gambaran penakaran atau pembagian yang terukur
  alternative: “menakar” atau “membagikan” kekerasan
  rationale: Mazmur ini menuduh para pemegang kuasa yang menyalahgunakan keadilan. Metafora timbangan mempertahankan ironi bahwa yang mereka timbang bukan keadilan, melainkan kekerasan.
- issue: Hubungan gramatikal “kekerasan” dan “tanganmu”
  choice: Menerjemahkan sebagai objek “kekerasan tanganmu”, dengan “kamu” sebagai subjek verba orang kedua jamak
  alternative: “tanganmu menimbang kekerasan”
  rationale: Bentuk verba Ibrani adalah orang kedua jamak dan paling langsung menunjuk kepada pihak yang disapa. Susunan “kekerasan tanganmu” juga mempertahankan hubungan erat kedua nomina tanpa menjadikan tangan sebagai subjek gramatikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralel antara batin dan perbuatan di bumi dipertahankan, demikian pula citra tangan dan timbangan. Kata ganti “kamu” dapat menyapa satu kelompok secara kolektif.
