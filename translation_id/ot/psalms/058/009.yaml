  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: id
  text: Sebelum periuk-periukmu sempat merasakan panas dari semak duri[a]—entah semak itu masih hijau atau sudah menyala—Ia akan menyapu semuanya hingga lenyap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibraninya sulit. Secara lebih harfiah: “Sebelum periuk-periukmu memahami atau merasakan semak duri, seperti yang hidup, seperti yang menyala atau dalam murka, Ia akan menghempaskannya.” Maksudnya mungkin bahwa semuanya disapu pergi sebelum api sempat memanaskan periuk. Frasa terakhir juga dapat dipahami sebagai “Ia akan menyapunya dalam murka.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Sebelum ... sempat
  rationale: Menandai bahwa tindakan berikut terjadi lebih dahulu; “sempat” mempertahankan kesan penghentian yang mendadak.
- source_word: יָבִינוּ
  choice: merasakan
  rationale: Makna dasarnya “memahami/menyadari,” tetapi dengan periuk sebagai subjek, “merasakan” menyampaikan personifikasi dan gagasan mulai terkena panas.
- source_word: סִּירֹתֵיכֶם
  choice: periuk-periukmu
  rationale: Menunjuk pada wadah untuk memasak; “periuk” konkret, lazim, dan sesuai dengan gambaran bahan bakar.
- source_word: אָטָד
  choice: semak duri
  rationale: Menunjuk pada tumbuhan berduri yang dapat dipakai sebagai bahan bakar cepat terbakar; pilihan ini mempertahankan citra konkretnya.
- source_word: כְּמוֹ חַי
  choice: masih hijau
  rationale: Secara harfiah “seperti hidup”; dalam konteks kayu bakar, kemungkinan berarti segar atau belum kering.
- source_word: כְּמוֹ חָרוֹן
  choice: sudah menyala
  rationale: חָרוֹן biasanya berkaitan dengan nyala murka, tetapi dalam citra api dapat menunjuk pada keadaan menyala. Terjemahan ini mempertahankan citra termal tanpa meniadakan kemungkinan makna “murka,” yang dicatat dalam catatan kaki.
- source_word: יִשְׂעָרֶנּוּ
  choice: Ia akan menyapu semuanya pergi
  rationale: Kata kerja menyiratkan tindakan seperti badai atau pusaran yang membawa pergi dengan keras. “Semuanya” menyampaikan pemusnahan mendadak tanpa berpura-pura menyelesaikan ketidakjelasan objek tunggal dalam bahasa Ibrani.
theological_decisions:
- issue: Gambaran puitis dan sintaksis yang sangat sulit dalam Mazmur 58:9
  choice: Ayat menggambarkan penyingkiran mendadak sebelum api semak duri sempat memanaskan periuk, baik bahan bakarnya masih hijau maupun sudah menyala.
  alternative: Frasa terakhir dapat dipahami sebagai “Ia akan menyapunya dalam murka,” dan objeknya dapat dibaca “dia/itu” alih-alih “semuanya.”
  rationale: Pilihan utama mengikuti alur citra memasak dan tema penghukuman mendadak, sedangkan kemungkinan makna murka serta ketidakjelasan objek dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan puitis. “Periuk-periukmu” serta “semak duri” mempertahankan gambaran konkret; “sempat merasakan panas” membuat personifikasi dapat dipahami tanpa menghapus kesulitan teks, yang dijelaskan dalam catatan kaki.
