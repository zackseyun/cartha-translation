id: PSA.58.6
reference: Psalms 58:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים הֲרָס שִׁנֵּ֥י/מוֹ בְּ/פִ֑י/מוֹ מַלְתְּע֥וֹת כְּ֝פִירִ֗ים נְתֹ֣ץ יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/006.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: id
  text: Ya Allah, patahkanlah gigi mereka di dalam mulut mereka; remukkanlah geraham singa-singa muda[a], ya Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “taring singa-singa muda”. Kata Ibrani menunjuk pada gigi rahang atau gigi penghancur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH, nama pribadi Allah.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung. Partikel “Ya” menyatakan vokatif secara alami dan khidmat dalam bahasa Indonesia.
- source_word: הֲרָס
  choice: patahkanlah
  rationale: Imperatif dari הרס berarti merobohkan atau menghancurkan. Dengan gigi sebagai objek, “patahkanlah” merupakan padanan Indonesia yang konkret dan idiomatis.
- source_word: שִׁנֵּימוֹ
  choice: gigi mereka
  rationale: Nomina jamak dengan sufiks orang ketiga jamak maskulin diterjemahkan secara langsung.
- source_word: בְּפִימוֹ
  choice: di dalam mulut mereka
  rationale: Preposisi ב menyatakan lokasi; terjemahan ini mempertahankan gambaran Ibrani bahwa gigi itu dipatahkan di dalam mulut mereka.
- source_word: מַלְתְּעוֹת
  choice: geraham
  rationale: Istilah ini menunjuk pada gigi rahang atau gigi penghancur. “Geraham” mempertahankan ciri anatominya, sementara kemungkinan “taring” dicatat dalam catatan kaki karena konteks singa.
- source_word: כְּפִירִים
  choice: singa-singa muda
  rationale: כפירים biasanya menunjuk pada singa muda yang sudah kuat dan buas, bukan sekadar anak singa kecil.
- source_word: נְתֹץ
  choice: remukkanlah
  rationale: Imperatif נתץ mengandung gagasan merobohkan, mematahkan, atau menghancurkan. “Remukkanlah” cocok dengan objek berupa geraham dan mempertahankan kekuatan gambaran puitis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan bentuk nama itu dan membedakannya dari gelar umum.
- issue: Gambaran kutukan yang keras
  choice: Mempertahankan permohonan konkret agar gigi dan geraham musuh dihancurkan
  alternative: Memparafrasakannya sebagai permohonan agar kekuatan mereka dilenyapkan
  rationale: Bahasa Ibrani sengaja memakai gambaran jasmani yang keras. Mengubahnya menjadi pernyataan abstrak akan mengurangi daya dan ketegangan teologis mazmur ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Bentuk imperatif berakhiran “-lah” mempertahankan desakan permohonan tanpa terdengar percakapan sehari-hari. Paralelisme antara “gigi” dan “geraham” serta antara “patahkanlah” dan “remukkanlah” dipertahankan.
