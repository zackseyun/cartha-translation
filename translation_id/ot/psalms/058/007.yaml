  register: Bahasa Indonesia modern yang puitis dan bermartabat. Paralelisme kutukan dipertahankan dengan pengulangan “biarlah,” sedangkan metafora air dan anak panah dibuat jelas bagi pembaca umum. Ambiguitas klausa terakhir tidak diselesaikan secara dogmatis dan dicatat dalam catatan kaki.
