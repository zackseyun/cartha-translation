  text: Let them melt away like water that runs off[a]; when he aims his arrows[c][b], let them be as though cut off.
translation:
  language: id
  text: Biarlah mereka lenyap seperti air yang mengalir pergi[a]; ketika ia mengarahkan anak panahnya[b], biarlah mereka seolah-olah terpotong[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang mengalir lenyap.” Ungkapan Ibrani menggambarkan air yang bergerak menjauh lalu menghilang.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbentuk tunggal, “anak panahnya”; kata ini dapat juga dipahami secara kolektif sebagai “anak-anak panahnya.”
    reason: lexical_alternative
  - marker: c
    text: 'Klausa terakhir sulit dipastikan dari segi teks dan makna katanya. Kemungkinan lain: “biarlah mereka menjadi tumpul” atau “biarlah mereka layu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: biarlah mereka lenyap
  rationale: Dalam konteks gambaran air, verba yang sulit ini menyatakan menghilang atau luruh. “Lenyap” menyampaikan hasil geraknya secara wajar sekaligus mempertahankan nuansa permohonan kutukan.
- source_word: כְמוֹ מַיִם
  choice: seperti air
  rationale: Padanan langsung dan alami yang mempertahankan perumpamaan Ibrani.
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: yang mengalir pergi
  rationale: Bentuk verba ini menggambarkan air yang terus bergerak menjauh dan menghilang. “Mengalir pergi” mempertahankan gerak serta arah gambaran itu tanpa memaksakan fungsi לָמוֹ yang sukar ke dalam teks utama.
- source_word: יִדְרֹךְ חצו
  choice: ketika ia membidikkan anak panahnya
  rationale: יִדְרֹךְ dapat dipakai untuk tindakan menyiapkan atau membentangkan senjata untuk menembak. Dalam hubungan langsung dengan “anak panahnya,” “membidikkan” menyampaikan tindakan tersebut secara alami; bentuk tunggal חצו dipertahankan.
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: biarlah mereka seolah-olah terpotong
  rationale: Bentuk terakhir langka dan diperdebatkan. “Terpotong” mempertahankan kemungkinan dasar makna memotong serta gagasan bahwa serangan itu dibuat tidak efektif, tanpa menutup alternatif seperti menjadi tumpul atau layu.
