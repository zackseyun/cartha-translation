  text: Orang-orang fasik telah terasing dari rahim; sejak dalam kandungan mereka tersesat dan berkata dusta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “dari rahim” dan “dari perut/kandungan.” Ini adalah hiperbola puitis yang menggambarkan orang fasik sebagai orang yang tersesat sejak awal kehidupan, bukan perumusan ajaran teknis tentang kesalahan moral sebelum lahir.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרוּ
  choice: telah menyimpang
  rationale: Dalam paralelisme dengan תָּעוּ, verba ini menyatakan keterasingan atau penyimpangan. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada kerusakan moral.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Padanan baku dan bermartabat untuk menyebut golongan yang berlaku jahat atau bersalah.
- source_word: מֵרָחֶם
  choice: sejak dari rahim
  rationale: Mempertahankan citra harfiah serta daya hiperbola puitis teks Ibrani.
- source_word: תָּעוּ
  choice: mereka tersesat
  rationale: Menyampaikan arti menyimpang atau kehilangan jalan serta mempertahankan kesejajaran dengan verba pertama.
- source_word: מִבֶּטֶן
  choice: sejak dalam kandungan
  rationale: בטן dapat berarti perut atau kandungan; dalam konteks ini 'kandungan' paling alami dan tetap dekat dengan citra Ibrani.
- source_word: דֹּבְרֵי כָזָב
  choice: mereka berkata dusta
  rationale: Mengungkapkan frasa partisipial secara alami sebagai ciri tindakan yang terus melekat pada orang-orang fasik.
- source_word: כָזָב
  choice: dusta
  rationale: Padanan Indonesia yang jelas dan sesuai dengan konteks perkataan palsu.
theological_decisions:
- issue: Apakah ayat ini harus diterjemahkan sebagai ajaran teknis tentang kesalahan moral sejak sebelum lahir
  choice: Mempertahankan hiperbola puitis bahwa orang fasik menyimpang sejak awal kehidupan
  alternative: Merumuskannya secara eksplisit sebagai doktrin tentang kebersalahan sejak pembuahan, atau melemahkannya menjadi cercaan tanpa bobot antropologis
  rationale: Paralelisme 'sejak dari rahim' dan 'sejak dalam kandungan' memberi gambaran puitis yang kuat. Terjemahan mempertahankan ketegangan itu tanpa memasukkan kesimpulan teologis sistematis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur paralel Ibrani dipertahankan, sementara susunan klausa terakhir dibuat alami bagi pembaca umum.
