id: PSA.25.3
reference: Psalms 25:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּ֣ם כָּל קֹ֭וֶי/ךָ לֹ֣א יֵבֹ֑שׁוּ יֵ֝בֹ֗שׁוּ הַ/בּוֹגְדִ֥ים רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: id
  text: Sungguh, tidak seorang pun yang menanti-nantikan Engkau[a] akan mendapat malu; orang-orang yang berkhianat tanpa alasan[b] akan mendapat malu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang berharap kepada-Mu.” Kata kerja Ibrani ini berarti menanti dengan penuh pengharapan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dengan sia-sia” atau “demi sesuatu yang hampa.” Kata Ibrani רֵיקָם dapat dipahami dengan lebih dari satu cara di sini; teks utama memahaminya sebagai “tanpa alasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Sungguh
  rationale: Dalam konteks ini גַּם menegaskan pernyataan, bukan sekadar menambahkan gagasan; “Sungguh” menyampaikan daya penegasan itu secara alami.
- source_word: כָּל קֹוֶיךָ לֹא יֵבֹשׁוּ
  choice: tidak seorang pun yang menanti-nantikan Engkau akan mendapat malu
  rationale: Susunan harfiah “semua yang menantikan Engkau tidak akan mendapat malu” dinyatakan sebagai bentuk negatif universal yang lebih wajar dalam bahasa Indonesia tanpa mengubah cakupannya.
- source_word: קֹוֶיךָ
  choice: yang menanti-nantikan Engkau
  rationale: Bentuk dari קוה menunjukkan penantian yang disertai pengharapan. “Menanti-nantikan” mempertahankan unsur menunggu dengan penuh harap.
- source_word: לֹא יֵבֹשׁוּ / יֵבֹשׁוּ
  choice: tidak ... akan mendapat malu / akan mendapat malu
  rationale: Pengulangan terjemahan yang sama mempertahankan kesejajaran dan kontras puitis antara kedua baris.
- source_word: הַבּוֹגְדִים
  choice: orang-orang yang berkhianat
  rationale: Partisipel בגד menggambarkan orang yang bertindak tidak setia atau khianat; bentuk verbal Indonesia mempertahankan sifat aktifnya.
- source_word: רֵיקָם
  choice: tanpa alasan
  rationale: Di sini kata tersebut paling wajar menerangkan pengkhianatan yang dilakukan tanpa dasar atau alasan yang patut, sambil tetap mengakui kemungkinan makna lain.
