  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap jelas bagi pembaca umum. Kapitalisasi pronomina ilahi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia. Kesejajaran pengulangan “mendapat malu” dipertahankan.
