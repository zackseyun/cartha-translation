  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: id
  text: Jagalah hidupku dan selamatkanlah aku; janganlah aku mendapat malu, sebab aku berlindung kepada-Mu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: hidupku
  rationale: Dalam konteks permohonan agar dijaga dan diselamatkan, נֶפֶשׁ menunjuk pada diri atau nyawa pemazmur, bukan semata-mata unsur batin yang terpisah. “Hidupku” alami dalam bahasa Indonesia dan mempertahankan cakupan kontekstualnya.
- source_word: וְהַצִּילֵנִי
  choice: dan selamatkanlah aku
  rationale: Bentuk imperatif ini memohon pembebasan atau penyelamatan dari bahaya; “selamatkanlah aku” menyampaikan permohonan langsung tersebut.
- source_word: אַל־אֵבוֹשׁ
  choice: jangan biarkan aku dipermalukan
  rationale: Kata בוש dapat menyatakan mengalami malu atau dipermalukan karena harapan terbukti sia-sia. Rumusan ini wajar dalam bahasa Indonesia dan mempertahankan nuansa keadaan yang menimpa pemazmur.
- source_word: חָסִיתִי בָךְ
  choice: aku berlindung kepada-Mu
  rationale: Verba חסה dengan preposisi ב menyatakan mencari atau mengambil perlindungan pada seseorang; bentuk lampau Ibrani di sini menggambarkan kepercayaan yang telah dan sedang ditempatkan pada Allah.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam antropologi Ibrani
  choice: hidupku
  alternative: jiwaku
  rationale: Pilihan “hidupku” menghindari pemaksaan dikotomi tubuh-jiwa pada istilah yang dalam konteks ini merujuk pada kehidupan atau diri pemazmur secara utuh.
- issue: Nuansa malu dalam אַל־אֵבוֹשׁ
  choice: jangan biarkan aku dipermalukan
  alternative: janganlah aku mendapat malu
  rationale: Pilihan utama mempertahankan permohonan agar Allah mencegah hasil yang memalukan, tanpa menetapkan secara lebih sempit apakah rasa malu itu bersifat batin, sosial, atau akibat kegagalan harapan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Akhiran hormat “-Mu” dipakai untuk sapaan kepada Allah. Paralelisme dan rangkaian imperatif Ibrani dipertahankan tanpa kekakuan yang tidak perlu.
