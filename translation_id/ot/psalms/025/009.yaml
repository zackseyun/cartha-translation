id: PSA.25.9
reference: Psalms 25:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יַדְרֵ֣ךְ עֲ֭נָוִים בַּ/מִּשְׁפָּ֑ט וִֽ/ילַמֵּ֖ד עֲנָוִ֣ים דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/009.yaml
  text: He guides the humble in justice[b][a], and he teaches the humble his way.
translation:
  language: id
  text: Ia menuntun orang-orang rendah hati dalam keadilan[a], dan mengajarkan jalan-Nya kepada orang-orang rendah hati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam penghakiman” atau “dalam apa yang benar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang lemah lembut”; kata Ibrani ini juga dapat menunjuk kepada orang-orang rendah atau tertindas, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְרֵךְ
  choice: menuntun
  rationale: Bentuk Hifil dari דרך menyatakan tindakan membimbing atau membuat seseorang menapaki jalan; “menuntun” alami dalam bahasa Indonesia dan mempertahankan nuansa pengarahan.
- source_word: עֲנָוִים
  choice: orang-orang rendah hati
  rationale: Istilah ini dapat menunjuk kepada mereka yang rendah hati, lemah lembut, rendah kedudukannya, atau tertindas. Dalam konteks pengajaran ilahi, “orang-orang rendah hati” paling jelas menyampaikan sikap yang bersedia menerima tuntunan; pengulangannya dipertahankan.
- source_word: בַּמִּשְׁפָּט
  choice: dalam keadilan
  rationale: מִשְׁפָּט dapat berarti keadilan, penghakiman, keputusan hukum, atau apa yang benar. “Dalam keadilan” mempertahankan nuansa etis-yudisial dan dapat menyatakan ranah atau standar tuntunan Allah.
- source_word: וִילַמֵּד
  choice: dan mengajarkan
  rationale: Bentuk Piel dari למד berarti mengajar atau memberi petunjuk. “Dan mengajarkan” sederhana, alami, dan mempertahankan hubungan antarklausa.
- source_word: דַּרְכּוֹ
  choice: jalan-Nya
  rationale: Nomina tunggal dengan akhiran orang ketiga maskulin tunggal secara langsung berarti “jalan-Nya”; ungkapan ini mencakup jalan, kehendak, atau cara hidup yang berasal dari Allah.
theological_decisions:
- issue: Makna עֲנָוִים dalam kaitannya dengan tuntunan dan pengajaran Allah
  choice: orang-orang rendah hati
  alternative: orang-orang lemah lembut; orang-orang rendah; orang-orang tertindas
  rationale: Konteks mazmur menonjolkan kesiapan menerima pengajaran Tuhan. Pilihan ini menyampaikan sikap batin tersebut tanpa meniadakan kemungkinan bahwa istilah Ibrani juga mencakup orang yang rendah kedudukan atau menderita.
- issue: Makna בַּמִּשְׁפָּט sebagai ranah atau standar tuntunan
  choice: dalam keadilan
  alternative: dalam penghakiman; dalam apa yang benar
  rationale: Teks Ibrani memungkinkan nuansa keadilan, keputusan, atau apa yang benar. Terjemahan utama mempertahankan istilah abstrak yang luas, sedangkan catatan kaki menjaga alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “orang-orang rendah hati” dipertahankan sesuai teks Ibrani untuk penekanan. Bentuk “jalan-Nya” memakai huruf kapital pada pronomina yang merujuk kepada Allah sesuai kebiasaan umum penulisan Alkitab bahasa Indonesia.
