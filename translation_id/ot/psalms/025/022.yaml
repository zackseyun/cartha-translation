source:
  edition: WLC
  text: פְּדֵ֣ה אֱ֭לֹהִים אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל צָֽרוֹתָי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/022.yaml
  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: id
  text: Tebuslah Israel, ya Allah, dari segala kesusahannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kesusahan mereka,” bila “Israel” dipahami sebagai umat secara kolektif, bukan dengan mempertahankan bentuk tunggal dalam tata bahasa Ibrani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדֵה
  choice: Tebuslah
  rationale: Bentuk imperatif tunggal dari פדה menyatakan tindakan menebus, membebaskan dengan nuansa penebusan. “Tebuslah” mempertahankan bobot teologis dan perjanjian lebih baik daripada “lepaskanlah” yang lebih umum.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung kepada Allah. Partikel “ya” merupakan bentuk vokatif yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri ini di sini menunjuk kepada umat perjanjian secara kolektif, bukan hanya kepada Yakub sebagai individu.
- source_word: מִכֹּל
  choice: dari segala
  rationale: Gabungan preposisi מִן dan כֹּל menyatakan pembebasan dari keseluruhan kesusahan; “dari segala” ringkas dan alami.
- source_word: צָרוֹתָיו
  choice: kesusahannya
  rationale: צָרוֹת mencakup kesusahan, kesesakan, dan kemalangan. Bentuk “-nya” mempertahankan sufiks orang ketiga tunggal maskulin dalam bahasa sumber, sementara “kesusahan” sesuai dengan konteks doa mazmur.
theological_decisions:
- issue: Pronomina tunggal kolektif bagi Israel
  choice: Mempertahankan bentuk tunggal “kesusahannya”
  alternative: “kesusahan mereka” bila Israel dipahami dan diungkapkan sebagai umat jamak
  rationale: Bahasa Ibrani memakai sufiks orang ketiga tunggal maskulin karena Israel diperlakukan sebagai satu kesatuan kolektif. Terjemahan utama mempertahankan bentuk gramatikal itu tanpa meniadakan kemungkinan rujukan kolektif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan vokatif “ya Allah” alami untuk doa. Penanda catatan kaki ditempatkan setelah kalimat yang diterangkannya.
