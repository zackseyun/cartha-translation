id: PSA.25.11
reference: Psalms 25:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: id
  text: Demi nama-Mu[b], ya Yahweh, ampunilah kesalahanku[a], sebab besar kesalahanku itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebersalahanku” atau “dosaku.” Kata Ibrani עָוֹן dapat menunjuk pada perbuatan salah, keadaan bersalah, atau beban dan akibat kesalahan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “demi nama-Mu” merupakan seruan kepada watak, reputasi, dan kehormatan perjanjian Allah, bukan hanya kepada nama yang diucapkan.
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  choice: Demi
  rationale: Menandai dasar atau alasan permohonan dan secara alami menyampaikan makna ‘demi kepentingan/kehormatan’ dalam bahasa Indonesia.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Mempertahankan ungkapan konkret bahasa Ibrani. Dalam konteks doa ini, ‘nama’ mencakup watak, reputasi, dan kehormatan perjanjian Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וְסָלַחְתָּ
  choice: ampunilah
  rationale: Walaupun bentuknya secara morfologis adalah perfektum dengan waw, konteks doa mendukung pemahaman sebagai permohonan. Bentuk ‘ampunilah’ alami, jelas, dan sesuai dengan laras doa.
- source_word: לַעֲוֺנִי
  choice: kesalahanku
  rationale: עָוֹן dapat menunjuk pada perbuatan salah, keadaan bersalah, atau beban/akibat kesalahan. ‘Kesalahan’ mempertahankan keluasan makna itu lebih baik daripada mempersempitnya hanya menjadi rasa bersalah; sufiks orang pertama dipertahankan.
- source_word: כִּי
  choice: sebab
  rationale: Menyatakan alasan bagi permohonan pengampunan dan menjaga hubungan kausal dalam kalimat.
- source_word: רַב הוּא
  choice: besar kesalahanku itu
  rationale: רַב menyatakan besarnya atau beratnya kesalahan, bukan jumlahnya. Susunan ini mempertahankan penegasan pronomina הוּא dengan bahasa Indonesia yang wajar dan bernuansa puitis.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian ilahi secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri, sedangkan ‘TUHAN’ menggantinya dengan gelar.
- issue: Cakupan makna עָוֹן
  choice: kesalahan
  alternative: dosa; kebersalahan; kedurhakaan
  rationale: Istilah Ibrani dapat mencakup tindakan salah, kebersalahan, dan beban atau akibatnya. ‘Kesalahan’ cukup luas dan mudah dipahami, sementara catatan kaki menjaga nuansa alternatif tanpa menetapkan hanya satu aspek.
- issue: Hubungan antara besarnya kesalahan dan permohonan pengampunan
  choice: sebab besar kesalahanku itu
  alternative: walaupun kesalahanku besar
  rationale: כִּי paling langsung bersifat kausal di sini. Terjemahan tidak mengubahnya menjadi konsesif, sehingga ketegangan doa—besarnya kesalahan justru dikemukakan sebagai alasan memohon pengampunan—tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, mutakhir, dan bernuansa doa. Sapaan ‘ya Yahweh’ terasa alami dan khidmat. Susunan ‘sebab besar kesalahanku itu’ sengaja mempertahankan penekanan puitis teks Ibrani tanpa menjadi tidak wajar.
