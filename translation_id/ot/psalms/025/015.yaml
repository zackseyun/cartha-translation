source:
  edition: WLC
  text: עֵינַ֣/י תָּ֭מִיד אֶל יְהוָ֑ה כִּ֤י הֽוּא יוֹצִ֖יא מֵ/רֶ֣שֶׁת רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/015.yaml
  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: id
  text: 'Mataku senantiasa tertuju kepada Yahweh,

    sebab Dialah yang akan mengeluarkan kakiku dari jaring.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַי
  choice: Mataku
  rationale: Mempertahankan gambaran konkret bentuk jamak Ibrani, yang dalam bahasa Indonesia secara alami dinyatakan dengan bentuk tunggal kolektif "mata" dan akhiran milik orang pertama.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Menyatakan perhatian yang terus-menerus atau menjadi kebiasaan, dengan ragam puitis yang tetap wajar dalam bahasa Indonesia modern.
- source_word: אֶל
  choice: tertuju kepada
  rationale: Dalam hubungan dengan "mata", frasa ini secara alami menyatakan arah perhatian dan pengharapan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan mengapa pemazmur terus mengarahkan matanya kepada Yahweh.
- source_word: הוּא
  choice: Dialah
  rationale: Partikel -lah menyampaikan penekanan dari pronomina mandiri Ibrani tanpa menambah gagasan baru.
- source_word: יוֹצִיא
  choice: akan mengeluarkan
  rationale: Mempertahankan arti kausatif harfiah, yaitu membuat keluar, serta gambaran penyelamatan dari belitan.
- source_word: מֵרֶשֶׁת
  choice: dari jaring
  rationale: '"Jaring" adalah padanan langsung yang mempertahankan metafora perangkap; preposisi "dari" sudah cukup menyatakan gerak keluar dalam bahasa Indonesia.'
- source_word: רַגְלָי
  choice: kakiku
  rationale: Mempertahankan citra jasmani konkret tentang kaki yang terjerat dan dibebaskan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi secara langsung; bentuk "Yahweh" mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Penekanan pada הוּא
  choice: Dialah
  alternative: Dia
  rationale: Bentuk mandiri הוּא dapat memberi penekanan; "Dialah" menyampaikannya secara alami, tetapi tidak menafsirkan lebih jauh siapa pelaku penyelamatan itu.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan dua baris mengikuti kesejajaran mazmur. Metafora mata, kaki, dan jaring dipertahankan secara konkret.
