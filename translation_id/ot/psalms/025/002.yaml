  text: אֱֽלֹהַ֗/י בְּ/ךָ֣ בָ֭טַחְתִּי אַל אֵב֑וֹשָׁה אַל יַֽעַלְצ֖וּ אֹיְבַ֣/י לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: id
  text: Allahku, kepada-Mu aku percaya; jangan biarkan aku dipermalukan[a]; jangan biarkan musuh-musuhku bersorak-sorak karena aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jangan biarkan aku mendapat malu.” Kata Ibrani ini dapat menunjuk rasa malu batiniah maupun keadaan dipermalukan atau dibuat hina di depan umum.
    reason: lexical_alternative
  - marker: b
    text: Atau “menang atas aku” atau “bergembira karena aku.” Maksudnya ialah kegembiraan musuh atas kejatuhan pemazmur.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal berarti “Allahku” dan berfungsi sebagai sapaan langsung.
- source_word: בְּךָ
  choice: kepada-Mu
  rationale: Dengan verba בטח, preposisi ini menandai pribadi yang menjadi tumpuan kepercayaan; “kepada-Mu” merupakan ungkapan Indonesia yang alami.
- source_word: בָטַחְתִּי
  choice: aku percaya
  rationale: Bentuk perfektum dapat menyatakan sikap percaya yang telah teguh dan masih berlangsung; bentuk kini alami dalam doa ini.
- source_word: אַל אֵבוֹשָׁה
  choice: jangan biarkan aku dipermalukan
  rationale: Partikel negatif dan bentuk volitif menyampaikan permohonan. בושׁ dapat menunjuk rasa malu batiniah ataupun keadaan dipermalukan; konteks para musuh mendukung nuansa aib publik.
- source_word: יַעַלְצוּ
  choice: bersorak
  rationale: Verba עלץ berarti bersukacita atau bersorak dengan penuh kegirangan; dalam konteks musuh, kegembiraan itu bernada mengejek atau membanggakan kemenangan.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung bagi nomina dengan akhiran orang pertama tunggal.
- source_word: לִי
  choice: atas aku
  rationale: Dengan verba kegirangan, ל menandai orang yang menjadi sasaran sorak kemenangan; “atas aku” mempertahankan metafora sumber secara ringkas.
theological_decisions:
- issue: Permohonan pemazmur mengenai rasa malu atau kehinaan
  choice: jangan biarkan aku dipermalukan
  alternative: jangan biarkan aku mendapat malu
  rationale: Pilihan utama menonjolkan kemungkinan kehinaan terbuka di hadapan musuh tanpa meniadakan cakupan verba Ibrani yang juga dapat menunjuk pengalaman malu batiniah.
- issue: Kegembiraan para musuh
  choice: bersorak atas aku
  alternative: menang atas aku; bergembira karena aku
  rationale: “Bersorak” mempertahankan makna dasar kegirangan yang meluap, sedangkan konteks menunjukkan sorak bermusuhan tanpa mengharuskan terjemahan menambahkan gagasan kemenangan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Susunan paralel kedua permohonan dipertahankan.
