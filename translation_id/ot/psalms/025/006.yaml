  text: זְכֹר רַחֲמֶ֣י/ךָ יְ֭הוָה וַ/חֲסָדֶ֑י/ךָ כִּ֖י מֵ/עוֹלָ֣ם הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: id
  text: Ingatlah akan belas kasih-Mu[a], ya Yahweh, dan kasih setia-Mu[b], sebab semuanya itu sudah ada sejak dahulu kala.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rahmat-Mu.” Kata Ibrani berbentuk jamak dan dapat menunjuk pada kelimpahan belas kasih atau berbagai tindakan belas kasih.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani untuk “kasih setia” berbentuk jamak; secara harfiah dapat diterjemahkan “kasih-kasih setia-Mu.”
    reason: lexical_alternative
  - marker: c
    text: Atau “sejak kekekalan” atau “sejak selama-lamanya.” Ungkapan Ibrani dapat menunjuk pada masa lampau yang sangat jauh atau pada durasi kekal.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Imperatif Qal orang kedua tunggal maskulin dari זכר, berupa permohonan langsung kepada Allah. “Ingatlah” alami dan tepat dalam bahasa doa Indonesia.
- source_word: רַחֲמֶיךָ
  choice: segala belas kasih-Mu
  rationale: Bentuk jamak רַחֲמִים dengan sufiks orang kedua tunggal. “Segala” menyampaikan keluasan atau banyaknya tindakan belas kasih tanpa menghasilkan bentuk jamak yang kaku dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: וַחֲסָדֶיךָ
  choice: dan segala kasih setia-Mu
  rationale: Bentuk jamak חֶסֶד dengan sufiks orang kedua tunggal. “Kasih setia” menyampaikan kasih yang teguh dan loyal; “segala” mencerminkan bentuk jamaknya secara alami.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan dasar bagi permohonan sebelumnya; “sebab” ringkas, jelas, dan sesuai dengan ragam doa.
- source_word: מֵעוֹלָם
  choice: sejak dahulu kala
  rationale: Ungkapan ini dapat menunjuk pada masa lampau yang sangat jauh atau pada kekekalan. “Sejak dahulu kala” paling langsung menyampaikan orientasi waktu lampau dalam konteks ini tanpa menutup kemungkinan makna yang lebih kuat.
- source_word: הֵמָּה
  choice: semuanya itu sudah ada
  rationale: Pronomina mandiri orang ketiga jamak merujuk kembali kepada belas kasih dan kasih setia. Bahasa Indonesia memerlukan perumusan predikatif yang alami; “semuanya itu” mempertahankan rujukan jamaknya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Daya waktu מֵעוֹלָם
  choice: sejak dahulu kala
  alternative: sejak kekekalan; sejak selama-lamanya
  rationale: Bahasa Ibrani dapat menyatakan masa purba maupun durasi kekal. Teks utama memilih arti kontekstual yang wajar, sedangkan catatan kaki mempertahankan kemungkinan makna kekekalan agar ketegangan semantis tidak diselesaikan secara diam-diam.
- issue: Bentuk jamak רַחֲמֶיךָ dan חֲסָדֶיךָ
  choice: segala belas kasih-Mu ... segala kasih setia-Mu
  alternative: belas kasih-Mu ... kasih setia-Mu; rahmat-rahmat-Mu ... kasih-kasih setia-Mu
  rationale: Penggunaan “segala” mempertahankan nuansa jamak berupa kelimpahan atau berbagai tindakan ilahi, tetapi tetap alami dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat tetapi mudah dipahami. Partikel “ya” menandai sapaan langsung kepada Yahweh. Pengulangan “segala” menjaga kesejajaran puitis sekaligus menyampaikan bentuk jamak Ibrani secara alami.
