  text: מִי זֶ֣ה הָ֭/אִישׁ יְרֵ֣א יְהוָ֑ה י֝וֹרֶ֗/נּוּ בְּ/דֶ֣רֶךְ יִבְחָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: id
  text: Siapakah orang yang takut akan Yahweh? Ia akan mengajarnya tentang jalan yang harus dipilihnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "jalan yang dipilihnya" atau "jalan yang akan dipilihnya." Bentuk kata kerja Ibrani terakhir memungkinkan beberapa nuansa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה הָאִישׁ
  choice: Siapakah orang
  rationale: Ungkapan interogatif dengan demonstratif berfungsi sebagai pertanyaan retoris. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan rujukan tunggal generik tanpa menerjemahkan demonstratif secara kaku.
- source_word: יְרֵא יְהוָה
  choice: yang takut akan Yahweh
  rationale: Dalam konteks hikmat dan mazmur, ירא menyatakan rasa takut yang penuh hormat kepada Allah. Ungkapan Indonesia ini mempertahankan bobot teologis dan bentuk sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: יוֹרֶנּוּ
  choice: Dia akan mengajarnya
  rationale: Bentuk hiphil dari ירה mencakup makna mengajar, memberi petunjuk, atau mengarahkan. 'Mengajarnya' alami dan cukup luas; 'Dia' merujuk kepada Yahweh menurut konteks, sedangkan akhiran objek merujuk kepada orang yang takut akan Yahweh.
- source_word: בְּדֶרֶךְ
  choice: tentang jalan
  rationale: דרך dapat menunjuk pada jalan atau cara hidup. Preposisi ב dapat dipahami sebagai ranah pengajaran; 'tentang jalan' menghasilkan hubungan yang alami dengan verba 'mengajar' sambil mempertahankan metafora jalan.
- source_word: יִבְחָר
  choice: yang harus dipilihnya
  rationale: Imperfek Ibrani memungkinkan nuansa 'dipilihnya', 'akan dipilihnya', atau kewajiban yang tersirat. Terjemahan utama menyampaikan nuansa jalan yang patut dipilih, sementara catatan kaki mempertahankan kemungkinan lain.
theological_decisions:
- issue: Subjek tersirat dalam יוֹרֶנּוּ
  choice: Yahweh adalah pihak yang mengajar orang yang takut kepada-Nya.
  alternative: Subjeknya dapat dipahami secara tak tentu, atau orang tersebut dianggap mengajar dirinya sendiri.
  rationale: Walaupun subjek verba tidak dinyatakan ulang, anteseden dan konteks mazmur paling wajar menunjuk kepada Yahweh. Kapitalisasi 'Dia' menandai rujukan ini tanpa menambahkan nama ke dalam teks.
- issue: Nuansa יִבְחָר dan pelaku pemilihan
  choice: Orang yang takut akan Yahweh harus memilih jalan yang diajarkan kepadanya.
  alternative: Frasa itu dapat berarti jalan yang dipilih orang tersebut, jalan yang kelak dipilihnya, atau jalan yang dipilih Yahweh.
  rationale: Bentuk verba dan ketiadaan subjek eksplisit membuka beberapa nuansa. Teks utama mengikuti hubungan terdekat dengan orang yang diajar, tetapi catatan kaki menjaga ambiguitas yang sungguh ada.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Orang' dipakai sebagai padanan generik yang alami bagi הָאִישׁ, sedangkan 'takut akan Yahweh' mempertahankan ungkapan khas sumber. Pronomina terikat '-nya' pada frasa terakhir sengaja dibiarkan memiliki keluwesan rujukan yang dijelaskan dalam catatan kaki.
