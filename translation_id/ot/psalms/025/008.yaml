  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: id
  text: Yahweh itu baik dan benar; sebab itu Ia mengajarkan jalan kepada orang-orang berdosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia memberi petunjuk kepada orang-orang berdosa di jalan.” Kata kerjanya dapat berarti “mengajar”, “memberi petunjuk”, atau “mengarahkan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: baik
  rationale: Menunjukkan kebaikan moral Yahweh dan membentuk pasangan yang alami dengan “benar”.
- source_word: וְיָשָׁר
  choice: dan benar
  rationale: Dalam konteks ini יָשָׁר menyatakan kelurusan atau ketulusan moral. “Benar” terdengar alami dalam bahasa Indonesia modern tanpa membatasi maknanya menjadi sekadar kejujuran atau keadilan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: עַל כֵּן
  choice: sebab itu
  rationale: 'Menyatakan hubungan akibat: karena Yahweh baik dan benar, Ia mengajar orang berdosa.'
- source_word: יוֹרֶה
  choice: Ia mengajar
  rationale: Bentuk Hifil dari ירה dapat berarti mengajar, memberi petunjuk, atau mengarahkan. “Mengajar” mempertahankan unsur didaktis dan tetap membuka nuansa pengarahan.
- source_word: חַטָּאִים
  choice: orang-orang berdosa
  rationale: Padanan langsung bagi bentuk jamak substantival yang mempertahankan kategori moral dalam teks.
- source_word: בַּדָּרֶךְ
  choice: tentang jalan
  rationale: Ungkapan ini mempertahankan metafora jalan tanpa menambahkan kata “benar”, “Yahweh”, atau tujuan tertentu yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Mempertahankan nama perjanjian yang tampil dalam teks sumber dan tidak menggantinya dengan sebuah gelar.
- issue: Makna בַּדָּרֶךְ
  choice: tentang jalan
  alternative: di jalan / jalan yang benar
  rationale: Teks Ibrani tidak secara eksplisit menyebut “jalan yang benar” atau “jalan-Nya”. Pilihan ini menjaga metafora dan ketidakspesifikan teks, sedangkan catatan kaki menjelaskan kemungkinan nuansa pengarahan.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan khidmat. Pronomina “Ia” dipakai untuk merujuk kepada Yahweh. Susunan klausa mengikuti hubungan logis teks Ibrani, sementara titik koma membuatnya alami dan mudah dibaca.
