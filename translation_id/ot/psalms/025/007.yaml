id: PSA.25.7
reference: Psalms 25:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: id
  text: Janganlah mengingat dosa-dosa masa mudaku dan pelanggaran-pelanggaranku. Sesuai dengan kasih setia-Mu[a], ingatlah aku, demi kebaikan-Mu, ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kasih setia” menerjemahkan kata Ibrani ḥesed, yang mencakup kasih, kesetiaan yang teguh, dan kemurahan; dapat juga diterjemahkan “belas kasihan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: dosa-dosa masa mudaku
  rationale: Bentuk jamak חַטֹּאות menunjuk pada tindakan-tindakan dosa, sedangkan נְעוּרַי mengaitkannya dengan masa muda pemazmur. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan tersebut.
- source_word: וּפְשָׁעַי
  choice: dan pelanggaran-pelanggaranku
  rationale: Prefiks וּ diterjemahkan secara langsung sebagai “dan”. פְשָׁעַי mengandung gagasan pelanggaran atau pemberontakan yang disengaja; “pelanggaran-pelanggaranku” mempertahankan bobot moralnya tanpa mempersempitnya.
- source_word: אַל תִּזְכֹּר
  choice: Janganlah mengingat
  rationale: Larangan ini berbentuk permohonan kepada Allah agar dosa-dosa itu tidak dibawa ke dalam perhitungan. “Janganlah mengingat” mempertahankan ungkapan sumber serta terdengar wajar dan khidmat.
- source_word: כְּחַסְדְּךָ
  choice: Sesuai dengan kasih setia-Mu
  rationale: כְ menyatakan tolok ukur atau dasar tindakan yang dimohonkan. חֶסֶד mencakup kasih, kesetiaan, dan kemurahan yang teguh; “kasih setia” merupakan padanan Indonesia yang ringkas dan luas.
- source_word: זְכָר לִי אַתָּה
  choice: ingatlah aku
  rationale: Perintah positif ini sengaja berlawanan dengan permohonan agar dosa tidak diingat. Kata ganti אַתָּה memberi penekanan pada Allah sebagai pelaku; dalam bahasa Indonesia penekanan itu cukup terwakili oleh bentuk permohonan langsung dan konteks.
- source_word: לְמַעַן טוּבְךָ
  choice: demi kebaikan-Mu
  rationale: לְמַעַן menyatakan alasan atau dasar permohonan, sedangkan טוּבְךָ menunjuk pada kebaikan Allah. “Demi kebaikan-Mu” mempertahankan fokus pada karakter Allah sendiri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Cakupan makna חֶסֶד
  choice: kasih setia
  alternative: belas kasihan; kasih perjanjian
  rationale: “Kasih setia” mempertahankan unsur kasih dan kesetiaan yang teguh tanpa membatasi istilah ini hanya pada rasa iba atau menambahkan kata “perjanjian” yang tidak tersurat dalam ayat.
- issue: Kontras antara mengingat dosa dan mengingat pemazmur
  choice: mempertahankan pengulangan kata “mengingat”
  alternative: memparafrasakan bagian pertama sebagai “jangan memperhitungkan”
  rationale: 'Pengulangan זכר membentuk ketegangan puitis dan teologis: Allah dimohon agar tidak mengingat dosa, tetapi mengingat orangnya menurut kasih setia-Nya. Terjemahan mempertahankan kontras itu.'
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “janganlah” dan “ingatlah” mempertahankan nada doa tanpa terdengar kuno. Kapital pada akhiran pronominal yang mengacu kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia.
