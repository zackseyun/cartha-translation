  text: כָּל אָרְח֣וֹת יְ֭הוָה חֶ֣סֶד וֶ/אֱמֶ֑ת לְ/נֹצְרֵ֥י בְ֝רִית֗/וֹ וְ/עֵדֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/010.yaml
  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: id
  text: Segala jalan Yahweh adalah kasih setia dan kesetiaan bagi orang-orang yang memelihara perjanjian-Nya dan ketetapan-ketetapan-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebenaran” untuk “kesetiaan”; dalam pasangan perjanjian ini, kata Ibrani tersebut juga dapat menyatakan sifat dapat dipercaya dan setia.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesaksian-kesaksian-Nya” untuk “ketetapan-ketetapan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָרְחוֹת
  choice: Segala jalan
  rationale: Mempertahankan cakupan menyeluruh dari כָּל dan gambaran metaforis אָרְחוֹת, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Mengungkapkan kasih yang teguh dan loyal dalam hubungan perjanjian; padanan ini ringkas, lazim, dan sesuai dengan konteks Mazmur.
- source_word: אֱמֶת
  choice: kesetiaan
  rationale: Dalam pasangan חֶסֶד וֶאֱמֶת, kata ini terutama menyatakan sifat dapat diandalkan dan teguh, bukan sekadar kebenaran abstrak.
- source_word: לְנֹצְרֵי
  choice: bagi orang-orang yang memegang
  rationale: Partisip נצר menyiratkan menjaga atau menaati dengan sungguh-sungguh. 'Memegang' cocok dengan 'perjanjian' dan mempertahankan hubungan yang ditandai preposisi לְ.
- source_word: בְרִיתוֹ
  choice: perjanjian-Nya
  rationale: Merupakan padanan baku dan tepat bagi istilah perjanjian dalam konteks hubungan Yahweh dengan umat-Nya.
- source_word: וְעֵדֹתָיו
  choice: dan ketetapan-ketetapan-Nya
  rationale: Dalam konteks ini עֵדוֹת menunjuk kepada ketentuan atau kesaksian ilahi yang harus dipelihara. 'Ketetapan-ketetapan' lebih mudah dipahami pembaca Indonesia modern daripada bentuk harfiah 'kesaksian-kesaksian'.
theological_decisions:
- issue: Hubungan predikatif antara jalan-jalan Yahweh dan kasih setia serta kesetiaan
  choice: Menyatakan bahwa segala jalan Yahweh adalah kasih setia dan kesetiaan
  alternative: Segala jalan Yahweh menuju kepada kasih setia dan kesetiaan
  rationale: Klausa nominal Ibrani paling wajar mempredikatkan חֶסֶד וֶאֱמֶת kepada jalan-jalan Yahweh, bukan menyatakan tujuan yang dicapai jalan-jalan itu.
- issue: Hubungan kasih setia dan kesetiaan Yahweh dengan pemegang perjanjian
  choice: bagi orang-orang yang memegang perjanjian-Nya
  alternative: terhadap orang-orang yang menjaga perjanjian-Nya
  rationale: Terjemahan ini mempertahankan hubungan yang dinyatakan oleh לְ tanpa menyimpulkan bahwa sifat Yahweh bergantung pada ketaatan manusia; ketegangan dalam teks tetap dibiarkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pengulangan 'ketetapan-ketetapan' mempertahankan bentuk jamak Ibrani, sedangkan 'kasih setia' menjaga bobot relasional dan perjanjian dari חֶסֶד.
