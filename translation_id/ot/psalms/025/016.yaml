lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Berpalinglah kepadaku
  rationale: Imperatif Qal dari פנה dengan אֵלַי memohon agar Allah mengarahkan perhatian-Nya kepada pemazmur. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran tindakan berbalik menghadap seseorang.
- source_word: וְחָנֵּנִי
  choice: dan bermurah hatilah kepadaku
  rationale: Imperatif חנן dengan sufiks orang pertama tunggal adalah permohonan akan kemurahan atau perkenanan. Pilihan ini mempertahankan nuansa anugerah tanpa mempersempitnya menjadi rasa iba saja.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi permohonan sebelumnya; 'sebab' menyatakan hubungan kausal secara jelas dan sesuai dengan ragam doa.
- source_word: יָחִיד
  choice: seorang diri
  rationale: Dalam ratapan, יָחִיד dapat menggambarkan keadaan sendirian, terasing, atau kesepian. 'Seorang diri' mempertahankan keadaan objektif tanpa memaksakan penafsiran emosional, sementara alternatif 'kesepian' dicatat dalam catatan kaki.
- source_word: וְעָנִי
  choice: dan tertindas
  rationale: עָנִי dapat menunjuk pada orang miskin, tertindas, atau menderita. 'Tertindas' cocok dengan keadaan rentan dalam ratapan, tetapi keluasan maknanya dipertahankan melalui catatan kaki.
- source_word: אָנִי
  choice: aku
  rationale: Pronomina mandiri ini menegaskan diri sang pemazmur. Susunan 'aku seorang diri dan tertindas' menyampaikan penekanan tersebut secara wajar dalam bahasa Indonesia.
