translation:
  language: id
  text: Berpalinglah kepadaku dan bermurah hatilah kepadaku, sebab aku seorang diri[a] dan menderita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesepian” atau “terasing.” Kata Ibrani יָחִיד dapat menyatakan keadaan sendirian maupun kesepian.
    reason: lexical_alternative
