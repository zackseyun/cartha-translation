  yaml_path: translation/ot/psalms/025/004.yaml
  text: Make your ways known to me[a], O Yahweh; teach me your paths.
translation:
  language: id
  text: Beritahukanlah kepadaku jalan-jalan-Mu[a], ya Yahweh; ajarkanlah kepadaku lintasan-lintasan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “buatlah aku mengetahui”; secara tradisional, “tunjukkanlah kepadaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: jalan-jalan-Mu
  rationale: דֶּרֶךְ berarti jalan atau cara hidup/bertindak. Ungkapan ini mempertahankan metafora Ibrani tanpa membatasinya hanya pada perilaku moral.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh; partikel 'ya' menandai sapaan langsung secara wajar dalam bahasa Indonesia.
- source_word: הוֹדִיעֵנִי
  choice: buatlah aku mengenal
  rationale: Bentuk Hifil dari ידע bersifat kausatif, yakni 'buatlah aku mengetahui/mengenal'. 'Mengenal' terdengar alami untuk permohonan agar pemazmur memahami jalan-jalan Yahweh.
- source_word: אֹרְחוֹתֶיךָ
  choice: jalan-jalan setapak-Mu
  rationale: אֹרַח menunjuk pada jalan atau jejak yang dilalui. 'Jalan setapak' membedakannya dari דֶּרֶךְ sambil mempertahankan paralelisme puitis.
- source_word: לַמְּדֵנִי
  choice: ajarkanlah ... kepadaku
  rationale: Bentuk Piel imperatif dengan akhiran orang pertama tunggal berarti 'ajarlah aku'. Susunan Indonesia ini menyatakan makna yang sama secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Pengulangan 'jalan-jalan' mempertahankan bentuk jamak dan metafora puisi Ibrani; 'jalan-jalan setapak' dipakai pada baris kedua untuk mencerminkan perbedaan kosakata sumber.
