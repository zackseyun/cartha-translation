  naturalness: ‘Buatlah aku mengenal’ dapat dipahami, tetapi kurang lazim dalam doa Indonesia modern. ‘Jalan-jalan setapak-Mu’ tidak idiomatis; ‘lintasan-lintasan-Mu’ adalah padanan puitis yang wajar untuk jalan atau jejak kecil dan tetap membedakannya dari ‘jalan-jalan-Mu’.
  terminology: ‘Yahweh’ tepat sebagai transliterasi יהוה dan ‘ya Yahweh’ merupakan sapaan langsung yang alami dalam register khidmat. Istilah ‘jalan’ dan ‘lintasan’ mempertahankan metafora tanpa mempersempitnya menjadi ajaran moral saja.
