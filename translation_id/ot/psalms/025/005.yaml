base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/005.yaml
  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: id
  text: Tuntunlah aku dalam kebenaran-Mu[a] dan ajarlah aku, sebab Engkaulah Allah keselamatanku; aku menantikan-Mu[b] sepanjang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam kesetiaan-Mu.” Kata Ibrani ini dapat berarti “kebenaran” atau “kesetiaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “aku berharap kepada-Mu sepanjang hari.” Kata kerja Ibrani ini mengandung makna menanti dengan penuh harap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: Tuntunlah aku
  rationale: Bentuk imperatif Hifil dari דרך menyatakan tindakan mengarahkan seseorang pada suatu jalan. “Tuntunlah aku” alami dalam bahasa Indonesia dan mempertahankan gambaran arah atau perjalanan.
- source_word: בַאֲמִתֶּךָ
  choice: dalam kebenaran-Mu
  rationale: אֱמֶת dapat berarti kebenaran, keteguhan, atau kesetiaan. Dalam konteks tuntunan dan pengajaran, “dalam kebenaran-Mu” paling langsung menyatakan ranah atau pedoman tuntunan Allah, sambil tetap mencatat kemungkinan “kesetiaan-Mu” dalam catatan kaki.
- source_word: וְלַמְּדֵנִי
  choice: dan ajarlah aku
  rationale: Bentuk imperatif Piel dari למד secara langsung berarti mengajar. Pilihan ini jelas, alami, dan sejalan dengan konteks permohonan.
- source_word: כִּי
  choice: sebab
  rationale: Kata penghubung ini memberikan dasar bagi permohonan sebelumnya. “Sebab” mempertahankan hubungan penjelas tersebut dengan gaya yang wajar dan bermartabat.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: Allah keselamatanku
  rationale: Ungkapan ini mempertahankan susunan nominal Ibrani dan menegaskan hubungan Allah dengan keselamatan pemazmur tanpa mempersempitnya menjadi satu tindakan penyelamatan tertentu.
- source_word: קִוִּיתִי
  choice: aku menanti
  rationale: קוה mencakup tindakan menanti dengan pengharapan atau harapan yang penuh keyakinan. “Menanti” mempertahankan gambaran waktunya, sedangkan unsur pengharapan dijelaskan dalam catatan kaki.
- source_word: אוֹתְךָ
  choice: kepada-Mu
  rationale: Bersama קוה, penanda objek dan pronomina menunjuk kepada Allah sebagai pribadi yang dinantikan. “Kepada-Mu aku menanti” merupakan ungkapan doa yang alami dan menjaga penekanan awal pada objek.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini berarti seluruh rentang hari. “Sepanjang hari” merupakan padanan modern yang alami dan mempertahankan nuansa duratif.
theological_decisions:
- issue: Makna אֱמֶת dalam kaitannya dengan tuntunan ilahi
  choice: Diterjemahkan “kebenaran-Mu”.
  alternative: “kesetiaan-Mu”
  rationale: Pasangan gagasan tuntunan dan pengajaran mendukung pemahaman bahwa kebenaran Allah menjadi ranah atau pedoman yang diikuti pemazmur. Namun, arti kesetiaan tetap mungkin secara leksikal dan karena itu dipertahankan dalam catatan kaki.
- issue: Nuansa קוה
  choice: Diterjemahkan “menanti” dalam teks utama.
  alternative: “berharap” atau “menanti dengan penuh harap”
  rationale: Kata Ibrani ini menyatukan unsur penantian dan pengharapan. Teks utama mempertahankan gambaran konkret tentang menanti, tanpa menghilangkan kemungkinan nuansa berharap yang dicatat dalam catatan kaki.
- issue: Hubungan Allah dengan יִשְׁעִי
  choice: Diterjemahkan “Allah keselamatanku”.
  alternative: “Allah yang menyelamatkan aku” atau “Allah, Penyelamatku”
  rationale: Pilihan utama mempertahankan bentuk nominal dan keluasan makna keselamatan, sehingga tidak mengubah ungkapan menjadi gelar atau hanya menjadi tindakan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan mudah dipahami. Bentuk “-Mu” dipakai untuk sapaan kepada Allah. Susunan “kepada-Mu aku menanti” mempertahankan penekanan pada Allah sebagai tujuan penantian, sedangkan tanda baca mengikuti alur permohonan dan alasannya.
