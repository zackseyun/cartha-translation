source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: id
  text: Dari Daud. Kepada-Mu, ya Yahweh, kuangkat jiwaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyawaku” atau “diriku”. Kata Ibrani nefesh dapat menunjuk pada seluruh pribadi, bukan hanya aspek manusia yang nonjasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Konstruksi לְ dengan nama pribadi dalam judul mazmur menandai hubungan dengan Daud, tetapi tidak memastikan apakah ia penulis, penerima, atau tokoh yang dikaitkan dengannya. "Dari Daud" mempertahankan bentuk ringkas dan tidak menambahkan kata "mazmur" yang tidak terdapat dalam teks Ibrani.
- source_word: אֵלֶיךָ
  choice: Kepada-Mu
  rationale: Preposisi אֶל dengan sufiks orang kedua tunggal maskulin berarti "kepada-Mu" dan menyatakan arah doa kepada Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai "Yahweh", bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, diri, atau keseluruhan pribadi. "Jiwaku" mempertahankan metafora dan bobot devosional ungkapan Ibrani, sedangkan catatan kaki menjelaskan keluasan maknanya.
- source_word: אֶשָּׂא
  choice: kuangkat
  rationale: Bentuk Qal orang pertama tunggal dari נָשָׂא berarti "aku mengangkat". Bentuk "kuangkat" alami dalam larik puitis Indonesia dan mempertahankan metafora mengarahkan seluruh diri kepada Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: ya Yahweh
  alternative: ya TUHAN; ya Yehovah
  rationale: Teks menggunakan Tetragramaton secara langsung. "Yahweh" mempertahankan nama ilahi, sementara partikel vokatif "ya" menyampaikan sapaan langsung tanpa menambah gelar.
- issue: Cakupan makna נֶפֶשׁ
  choice: jiwaku, dengan catatan kaki
  alternative: nyawaku; diriku; seluruh diriku
  rationale: Terjemahan utama mempertahankan ungkapan tradisional dan metafora sumber, tetapi catatan menjaganya agar tidak dibatasi hanya pada unsur nonjasmani manusia.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas, puitis, dan khidmat. Kapitalisasi pada sufiks sapaan dalam "Kepada-Mu" dipakai sebagai penghormatan dalam konteks doa. Susunan klausa mengikuti gerak teks Ibrani tanpa terdengar kaku.
