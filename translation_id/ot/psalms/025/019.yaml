  text: Look at my enemies[a], for they are many, and they hate me with violent hatred.
translation:
  language: id
  text: Pandanglah musuh-musuhku, sebab mereka banyak, dan mereka membenci aku dengan kebencian yang penuh kekerasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan dengan kebencian kekerasan mereka membenci aku.” Frasa Ibrani ini mengaitkan kebencian mereka dengan kekerasan, kelaliman, atau kebrutalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Pandanglah
  rationale: Imperatif tunggal yang ditujukan kepada Allah. “Pandanglah” mempertahankan daya permohonan dan sesuai dengan ragam doa yang bermartabat.
- source_word: אוֹיְבַי
  choice: musuh-musuhku
  rationale: Bentuk dengan akhiran orang pertama tunggal ini secara langsung berarti “musuh-musuhku”.
- source_word: כִּי רָבּוּ
  choice: sebab mereka banyak
  rationale: כִּי memberi alasan bagi permohonan, sedangkan רָבּוּ dalam konteks ini menyatakan banyaknya jumlah para musuh.
- source_word: וְשִׂנְאַת חָמָס
  choice: dengan kebencian yang kejam
  rationale: Ungkapan nominal ini secara harfiah mengaitkan kebencian dengan חָמָס, yaitu kekerasan, kelaliman, atau kekejaman. “Kebencian yang kejam” terdengar alami dan mempertahankan sifat brutal kebencian itu.
- source_word: שְׂנֵאוּנִי
  choice: mereka membenci aku
  rationale: Bentuk perfektif dengan objek orang pertama tunggal menggambarkan permusuhan mereka terhadap pemazmur; kala kini bahasa Indonesia menyampaikan keadaan yang sedang berlangsung dengan wajar.
