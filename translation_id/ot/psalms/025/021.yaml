lexical_decisions:
- source_word: תֹּם
  choice: ketulusan
  rationale: Kata ini menunjuk pada keutuhan watak moral atau integritas. “Ketulusan” alami dalam bahasa Indonesia dan tidak menyiratkan keadaan tanpa dosa.
- source_word: וָיֹשֶׁר
  choice: dan kelurusan hati
  rationale: יֹשֶׁר secara harfiah berkaitan dengan kelurusan dan secara etis berarti kelurusan moral. “Kelurusan hati” mempertahankan pasangan puitisnya dengan “ketulusan” dan memperjelas makna etisnya.
- source_word: יִצְּרוּנִי
  choice: Kiranya ... menjaga aku
  rationale: Bentuk ini berasal dari נצר, yang berarti menjaga, memelihara, atau melindungi. Dalam konteks doa, yiqtol dapat menyatakan permohonan ataupun harapan penuh keyakinan; “kiranya” mempertahankan nuansa permohonan.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi permohonan atau keyakinan sebelumnya. “Sebab” ringkas dan wajar dalam larik puitis.
- source_word: קִוִּיתִיךָ
  choice: aku menanti-nantikan Engkau
  rationale: קוה mengandung arti menunggu dengan penuh harap. “Menanti-nantikan” menyampaikan penantian yang tekun dan berpengharapan, sedangkan “Engkau” mempertahankan sapaan langsung kepada Allah.
theological_decisions:
- issue: Apakah sifat moral pemazmur dinyatakan sebagai jasa yang dihasilkan sendiri atau sebagai kebajikan yang dimohonkan untuk menjaganya
  choice: Ayat diterjemahkan sebagai doa agar ketulusan dan kelurusan hati menjaga pemazmur, tanpa menambahkan gagasan tentang jasa pembenaran diri.
  alternative: Menerjemahkannya sebagai pernyataan lebih tegas bahwa sifat benar pemazmur pasti melindunginya atas dasar jasanya sendiri.
  rationale: Teks Ibrani menyebut kedua sifat moral itu sebagai subjek yang menjaga pemazmur, lalu mengaitkannya dengan penantiannya kepada Allah. Terjemahan mempertahankan ketegangan tersebut tanpa melunakkan tuntutan etis atau menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. “Menanti-nantikan” dipilih untuk menyampaikan unsur penantian sekaligus pengharapan; kapitalisasi “Engkau” mengikuti konvensi penghormatan dalam teks keagamaan Indonesia.
