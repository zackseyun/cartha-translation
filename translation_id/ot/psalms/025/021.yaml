  text: Kiranya integritas dan kelurusan menjaga aku[a], sebab aku menanti Engkau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Integritas dan kelurusan akan menjaga aku”; dalam konteks ini, bentuk kata kerja Ibrani dapat menyatakan harapan yang penuh keyakinan ataupun suatu permohonan.
