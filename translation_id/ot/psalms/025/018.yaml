  text: רְאֵ֣ה עָ֭נְיִ/י וַ/עֲמָלִ֑/י וְ֝/שָׂ֗א לְ/כָל חַטֹּאותָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/018.yaml
  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: id
  text: Pandanglah penderitaan dan kesusahanku, dan ampunilah segala dosaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “angkatlah segala dosaku.” Kata kerja Ibrani ini dapat berarti “mengangkat” atau “membawa”; ketika digunakan dengan dosa sebagai objek, kata itu merupakan ungkapan untuk mengampuni atau menyingkirkan dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Pandanglah
  rationale: Bentuk imperatif yang ditujukan kepada Allah. “Pandanglah” menyampaikan permohonan agar Allah memperhatikan dengan penuh kepedulian, dalam ragam doa yang wajar dan bermartabat.
- source_word: עָנְיִי
  choice: penderitaanku
  rationale: Kata עֳנִי menunjuk pada kesengsaraan, penderitaan, atau keadaan tertindas; “penderitaanku” mempertahankan cakupan umum tanpa membatasinya pada kemiskinan.
- source_word: וַעֲמָלִי
  choice: dan kesusahanku
  rationale: Kata עָמָל dapat berarti jerih payah, kesukaran, atau penderitaan yang membebani. “Kesusahanku” terdengar alami dan melengkapi “penderitaanku” tanpa menghapus kesejajarannya.
- source_word: וְשָׂא
  choice: dan ampunilah
  rationale: Secara harfiah נשׂא berarti mengangkat atau membawa, tetapi ketika dosalah yang menjadi objeknya, ungkapan ini menyatakan pengangkatan atau penghapusan dosa, yakni pengampunan.
- source_word: לְכָל
  choice: segala
  rationale: Dalam konstruksi idiomatis ini, לְכָל secara alami menyatakan keseluruhan objek. “Segala” mempertahankan penekanan pada seluruh dosa pemazmur.
- source_word: חַטֹּאותָי
  choice: dosaku
  rationale: Bentuk jamak חַטֹּאותָי berarti dosa-dosaku. Dalam bahasa Indonesia, “segala dosaku” secara alami menyampaikan makna jamak dan menyeluruh.
theological_decisions:
- issue: Penerjemahan idiom נשׂא ketika dosa menjadi objek
  choice: “ampunilah segala dosaku”
  alternative: “angkatlah segala dosaku” atau “bawalah pergi segala dosaku”
  rationale: Terjemahan utama menyampaikan fungsi idiom Ibrani sebagai permohonan pengampunan dengan jelas, sedangkan catatan kaki mempertahankan citra harfiahnya tanpa menambahkan rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat dengan nada doa. “Pandanglah” mempertahankan daya permohonan, sedangkan pasangan “penderitaan dan kesusahanku” menjaga paralelisme Ibrani. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
