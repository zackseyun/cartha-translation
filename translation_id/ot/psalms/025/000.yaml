id: PSA.25.0
reference: Psalms 25:0
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: id
  text: 'Dari Daud.


    Kepada-Mu, ya TUHAN, aku mengangkat jiwaku.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "hidupku" atau "diriku". Kata Ibrani yang diterjemahkan "jiwaku" dapat menunjuk pada seluruh pribadi, bukan hanya bagian manusia yang tidak berwujud.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Bentuk לְדָוִד pada judul mazmur dapat menyatakan kepengarangan, keterkaitan, atau persembahan kepada Daud. "Dari Daud" alami sebagai judul sambil tidak memperluasnya menjadi klaim yang lebih khusus.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Nama ilahi tetragramaton diterjemahkan dengan konvensi Indonesia yang luas dikenal, yaitu "TUHAN" dalam huruf kapital.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Padanan formal ini mempertahankan citra Ibrani dan makna diri batin/seluruh pribadi; catatan kaki menjelaskan keluasan maknanya.
- source_word: אֶשָּׂא
  choice: aku mengangkat
  rationale: Mempertahankan metafora tindakan mengarahkan atau menyerahkan seluruh diri kepada TUHAN tanpa menafsirkannya secara sempit.
theological_decisions:
- issue: Rujukan nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: '"TUHAN" adalah konvensi terjemahan Alkitab Indonesia yang bermartabat dan mudah dikenali; pilihan ini tetap menandai bahwa teks sumber memakai nama ilahi, bukan gelar biasa.'
- issue: Cakupan נֶפֶשׁ
  choice: jiwaku, dengan catatan alternatif
  alternative: hidupku / diriku
  rationale: Teks utama mempertahankan metafora tradisional, sedangkan catatan mencegah pembaca membatasinya hanya pada unsur nonjasmani manusia.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Sapaan "ya TUHAN" membuat hubungan langsung אֵלֶיךָ יְהוָה terdengar alami. Kapital pada akhiran pronominal "-Mu" mengikuti konvensi penghormatan Indonesia.
