  text: נַ֭פְשׁ/וֹ בְּ/ט֣וֹב תָּלִ֑ין וְ֝/זַרְע֗/וֹ יִ֣ירַשׁ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: id
  text: Ia akan hidup dalam kesejahteraan[b], dan keturunannya akan mewarisi tanah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bumi.” Kata Ibrani אֶרֶץ dapat berarti “tanah” atau “bumi”; dalam ungkapan “mewarisi tanah,” “tanah” paling sesuai dengan nuansa warisan perjanjian.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “jiwanya akan bermalam dalam yang baik.” Kata kerja Ibraninya dapat menggambarkan bermalam atau tinggal, dan di sini menyatakan keadaan terus hidup dalam keadaan baik.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: jiwanya
  rationale: Mempertahankan ungkapan puitis Ibrani dan cakupan נֶפֶשׁ sebagai jiwa, diri, atau kehidupan, tanpa meratakannya menjadi sekadar 'ia'.
- source_word: בְּטוֹב
  choice: dalam kebaikan
  rationale: טוֹב mencakup kebaikan, keadaan baik, kesejahteraan, dan kemakmuran. 'Dalam kebaikan' mempertahankan keluasan makna moral sekaligus pengalaman hidup.
- source_word: תָּלִין
  choice: akan tinggal
  rationale: Kata לון secara harfiah menggambarkan bermalam atau menumpang, tetapi dalam puisi dapat menyatakan keadaan menetap atau terus berada. 'Akan tinggal' alami dalam bahasa Indonesia dan tidak menghilangkan gagasan keberlanjutan; citra harfiahnya dicatat dalam catatan kaki.
- source_word: וְזַרְעוֹ
  choice: dan keturunannya
  rationale: זֶרַע secara harfiah berarti benih, tetapi di sini jelas menunjuk kepada anak cucu atau keturunan.
- source_word: יִירַשׁ
  choice: akan mewarisi
  rationale: ירשׁ dapat berarti mewarisi atau mengambil milik. 'Mewarisi' mempertahankan gema bahasa perjanjian tentang penerimaan negeri.
- source_word: אָרֶץ
  choice: negeri
  rationale: אֶרֶץ dapat berarti negeri, tanah, atau bumi. Bersama ירשׁ, 'negeri' paling alami menyampaikan nuansa wilayah perjanjian, sementara kemungkinan 'bumi' tetap dicatat.
theological_decisions:
- issue: Cakupan אָרֶץ bersama יִירַשׁ
  choice: negeri
  alternative: bumi
  rationale: Ungkapan ini kemungkinan menggemakan janji perjanjian tentang mewarisi negeri, tetapi bahasa Ibraninya juga dapat dipahami lebih luas sebagai bumi. Alternatif itu dipertahankan dalam catatan kaki agar ketegangan makna tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis yang sederhana dan bermartabat. Susunan kedua klausa dipertahankan dekat dengan puisi Ibrani; 'jiwanya' menjaga tekstur aslinya, sedangkan 'tinggal' menghindari kekakuan tanpa meniadakan citra 'bermalam' yang dijelaskan dalam catatan kaki.
