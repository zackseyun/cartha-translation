  text: ס֣וֹד יְ֭הוָה לִ/ירֵאָ֑י/ו וּ֝/בְרִית֗/וֹ לְ/הוֹדִיעָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/014.yaml
  text: The counsel of the LORD is for those who fear him, and his covenant is to make it known to them.
translation:
  language: id
  text: TUHAN bergaul akrab[a] dengan orang-orang yang takut kepada-Nya, dan Ia memberitahukan perjanjian-Nya kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: TUHAN menyatakan nasihat rahasia-Nya kepada orang-orang yang takut kepada-Nya; atau: Rahasia TUHAN bagi orang-orang yang takut kepada-Nya.'
    reason: Menjaga rentang arti סוֹד, yang dapat menunjuk pada persekutuan akrab, nasihat/perundingan rahasia, atau rahasia itu sendiri, tanpa mengubah terjemahan utama yang relasional.
lexical_decisions:
- source_word: סוֹד (sod)
  choice: keakraban
  rationale: Kata ini dapat menunjuk pada lingkungan perundingan yang bersifat rahasia, nasihat yang dipercayakan, rahasia, atau persekutuan akrab. Dalam hubungan dengan TUHAN dan orang yang takut kepada-Nya, “keakraban” menyampaikan kedekatan yang bersifat khusus tanpa meniadakan nuansa nasihat atau rahasia; nuansa alternatif dicatat dalam catatan kaki.
- source_word: יְהוָה (YHWH)
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang mapan untuk nama ilahi, dengan huruf kapital penuh guna membedakannya dari gelar biasa.
- source_word: לִירֵאָיו (lire'av)
  choice: bagi orang-orang yang takut kepada-Nya
  rationale: Mempertahankan makna dasar ירא, yakni takut dalam arti hormat dan gentar di hadapan Allah, tanpa mempersempitnya menjadi sekadar menghormati.
- source_word: וּבְרִיתוֹ (uverito)
  choice: dan ... perjanjian-Nya
  rationale: בְּרִית secara langsung berarti “perjanjian”; konjungsi dan sufiks kepunyaan dipertahankan.
- source_word: לְהוֹדִיעָם (lehodi'am)
  choice: Ia memberitahukan ... kepada mereka
  rationale: Bentuk kausatif dari ידע berarti “membuat mereka mengetahui” atau “memberitahukan kepada mereka.” Subjek tersirat dipahami sebagai TUHAN dan objeknya sebagai perjanjian-Nya, sebagaimana ditunjukkan oleh susunan paralel ayat.
theological_decisions:
- issue: Makna hubungan antara סוֹד TUHAN dan orang yang takut kepada-Nya
  choice: “Keakraban dengan TUHAN adalah bagi ...”
  alternative: “Nasihat rahasia TUHAN adalah bagi ...” atau “Rahasia TUHAN adalah bagi ...”
  rationale: Pilihan utama menekankan relasi dekat yang tercakup dalam סוֹד, sedangkan catatan kaki menjaga cakupan makna yang berkaitan dengan nasihat rahasia atau perkara yang dipercayakan.
- issue: Sintaksis klausa kedua
  choice: “Ia memberitahukan perjanjian-Nya kepada mereka”
  alternative: “dan perjanjian-Nya adalah untuk membuat mereka mengetahuinya”
  rationale: Bahasa Ibrani sangat ringkas dan memakai infinitif kausatif. Terjemahan utama menyatakan hubungan sintaksis yang paling alami dalam bahasa Indonesia tanpa menambahkan isi perjanjian atau penafsiran doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Keakraban” mudah dipahami pembaca umum, sedangkan “takut kepada-Nya” mempertahankan ungkapan teologis sumber. Penempatan penanda [a] langsung setelah “TUHAN” mengaitkan catatan dengan seluruh frasa “Keakraban dengan TUHAN”.
