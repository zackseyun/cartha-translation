  text: צָר֣וֹת לְבָבִ֣/י הִרְחִ֑יבוּ מִ֝/מְּצֽוּקוֹתַ֗/י הוֹצִיאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/017.yaml
  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
translation:
  language: id
  text: Kesusahan hatiku telah bertambah[a]; keluarkanlah aku dari kesesakanku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “telah meluas” atau “telah melebar.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dari keadaan-keadaan sempit yang menghimpitku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹת
  choice: kesusahan
  rationale: Nomina ini menunjuk pada berbagai kesulitan, penderitaan, atau keadaan yang menyesakkan. “Kesusahan” wajar dalam bahasa Indonesia dan sesuai dengan paralelnya pada bagian kedua ayat.
- source_word: לְבָבִי
  choice: hatiku
  rationale: לֵבָב menunjuk pada batin seseorang, termasuk pikiran dan perasaannya. “Hatiku” mempertahankan gambaran antropologis Ibrani secara alami.
- source_word: הִרְחִיבוּ
  choice: telah bertambah
  rationale: Secara harfiah verba ini berarti “membuat lebar” atau “meluas.” Dengan “kesusahan” sebagai subjek, maksud kontekstualnya ialah kesusahan itu meningkat atau bertambah; catatan kaki mempertahankan gambaran harfiahnya.
- source_word: מִמְּצוּקוֹתַי
  choice: dari segala kesesakanku
  rationale: Bentuk jamak ini menggambarkan keadaan sempit atau terjepit, lalu secara kiasan penderitaan. “Segala kesesakanku” mempertahankan nuansa jamak sekaligus citra ruang sempit.
- source_word: הוֹצִיאֵנִי
  choice: keluarkanlah aku
  rationale: Bentuk kausatif ini secara konkret berarti “bawalah/keluarkan aku.” “Keluarkanlah aku” mempertahankan metafora pembebasan dari ruang atau keadaan yang menyesakkan.
