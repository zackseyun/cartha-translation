source:
  edition: WLC
  text: הַאֲזִ֣ינָ/ה יְ֭הוָה תְּפִלָּתִ֑/י וְ֝/הַקְשִׁ֗יבָ/ה בְּ/ק֣וֹל תַּחֲנוּנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/006.yaml
  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: id
  text: Dengarkanlah, ya Yahweh, doaku, dan perhatikanlah suara permohonanku akan belas kasihan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Dengarkanlah
  rationale: Imperatif אזן meminta Allah mendengarkan dengan saksama. Bahasa Indonesia tidak memiliki padanan harfiah yang wajar untuk idiom 'condongkan telinga'; 'dengarkanlah' menyampaikan seruan itu secara alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga sapaan langsung kepada Allah Israel tetap terpelihara.
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: Padanan langsung untuk תְּפִלָּה dengan akhiran orang pertama tunggal.
- source_word: וְהַקְשִׁיבָה
  choice: dan perhatikanlah
  rationale: קשב menunjuk pada tindakan mendengarkan dengan penuh perhatian. 'Perhatikanlah' membedakannya dari verba pertama sekaligus mempertahankan paralelisme puitis.
- source_word: בְּקוֹל
  choice: suara
  rationale: קוֹל secara langsung berarti 'suara'. Dengan verba 'perhatikanlah', konstruksi Indonesia tetap alami tanpa menghilangkan nomina Ibrani tersebut.
- source_word: תַּחֲנוּנוֹתָי
  choice: permohonanku akan belas kasihan
  rationale: תַּחֲנוּנִים adalah permohonan sungguh-sungguh untuk memperoleh kemurahan atau belas kasihan. Ungkapan ini lebih jelas bagi pembaca modern daripada istilah formal 'suplikasiku'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks menyapa Allah Israel dengan nama pribadi-Nya. Transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk 'Yehovah' yang kurang sesuai dengan rekonstruksi pelafalan yang lazim.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran -lah mempertahankan nada permohonan imperatif. Paralelisme dua seruan dipelihara melalui 'Dengarkanlah' dan 'perhatikanlah'.
