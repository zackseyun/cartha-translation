source:
  edition: WLC
  text: כִּֽי חַ֭סְדְּ/ךָ גָּד֣וֹל עָלָ֑/י וְ/הִצַּ֥לְתָּ נַ֝פְשִׁ֗/י מִ/שְּׁא֥וֹל תַּחְתִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: id
  text: Sebab besarlah kasih setia-Mu kepadaku, dan Engkau telah menyelamatkan jiwaku dari Syeol yang paling bawah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari ranah orang mati yang paling bawah” atau “dari kubur di bawah.” Syeol adalah istilah Ibrani untuk ranah orang mati.
    reason: Menjelaskan istilah Syeol serta mempertahankan alternatif leksikal bagi שְׁאוֹל תַּחְתִּיָּה tanpa menggeser citra “paling bawah” dalam teks Ibrani.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menunjukkan alasan bagi pujian dalam konteks sebelumnya sekaligus mempertahankan hubungan antarkalimat secara alami.
- source_word: חַסְדְּךָ
  choice: kasih setia-Mu
  rationale: Menyampaikan kasih, kemurahan, dan kesetiaan relasional yang terkandung dalam חֶסֶד tanpa mempersempitnya menjadi sekadar belas kasihan.
- source_word: גָּדוֹל עָלָי
  choice: besarlah ... kepadaku
  rationale: Mempertahankan arti dasar 'besar' dan arah kasih itu kepada pemazmur dalam susunan puitis yang wajar dalam bahasa Indonesia.
- source_word: וְהִצַּלְתָּ
  choice: dan Engkau telah menyelamatkan
  rationale: Bentuk Hifil dari נצל menyatakan tindakan melepaskan atau menyelamatkan; 'telah' mencerminkan tindakan yang sudah terlaksana dan kini dipuji.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Mempertahankan ungkapan puitis Ibrani dan kaitannya dengan ancaman kematian, tanpa menyatakan bahwa נֶפֶשׁ harus dipahami sebagai istilah antropologis teknis.
- source_word: מִשְּׁאוֹל
  choice: dari Syeol
  rationale: Transliterasi mempertahankan konsep Ibrani tentang ranah orang mati dan tidak menyempitkannya menjadi kubur fisik atau memasukkan pengertian teologis yang lebih kemudian.
- source_word: תַּחְתִּיָּה
  choice: yang paling bawah
  rationale: Mencerminkan gambaran superlatif tentang bagian yang terbawah atau terdalam dengan lebih langsung daripada parafrasa interpretatif.
theological_decisions:
- issue: Cara menerjemahkan שְׁאוֹל tanpa memasukkan ketepatan doktrinal yang berasal dari masa kemudian
  choice: Syeol
  alternative: dunia orang mati; kubur di bawah
  rationale: Transliterasi menjaga gambaran dunia teks Ibrani dan ambiguitas antara ancaman kematian, kubur, dan ranah orang mati. Catatan kaki memberi penjelasan bagi pembaca modern.
- issue: Makna נַפְשִׁי dalam konteks penyelamatan dari kematian
  choice: jiwaku
  alternative: nyawaku; diriku
  rationale: '''Jiwaku'' mempertahankan bentuk puitis teks, tetapi tidak dimaksudkan untuk menetapkan dikotomi tubuh-jiwa; dalam konteks ini kata tersebut juga dapat menunjuk pada hidup atau diri pemazmur.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Inversi ringan 'besarlah kasih setia-Mu' memberi tekanan yang sesuai dengan גָּדוֹל tanpa terdengar kuno. Huruf kapital pada pronomina ilahi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia.
