id: PSA.86.12
reference: Psalms 86:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אוֹדְ/ךָ֤ אֲדֹנָ֣/י אֱ֭לֹהַ/י בְּ/כָל לְבָבִ֑/י וַ/אֲכַבְּדָ֖ה שִׁמְ/ךָ֣ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: id
  text: Aku akan memuji-Mu[a], Tuhan, Allahku, dengan segenap hatiku, dan aku akan memuliakan nama-Mu selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersyukur kepada-Mu”; kata kerja Ibrani ini dapat berarti mengucap syukur ataupun memuji dalam konteks ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Aku akan memuji-Mu
  rationale: Bentuk Hifil dari ידה dapat berarti bersyukur atau memuji. Dalam konteks ibadah dan sejajar dengan tindakan memuliakan nama Allah, “memuji-Mu” paling tepat menangkap nuansa doksologisnya. Bentuk imperfek diterjemahkan sebagai pernyataan berorientasi ke depan, menyerupai ikrar.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Gelar ilahi ini diterjemahkan dengan padanan Indonesia yang baku dan penuh hormat, tanpa menambahkan gagasan kedaulatan yang tidak dinyatakan secara eksplisit.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Akhiran orang pertama tunggal dipertahankan dalam bentuk posesif yang alami dalam bahasa Indonesia.
- source_word: בְּכָל לְבָבִי
  choice: dengan segenap hatiku
  rationale: Ungkapan ini menyatakan pengabdian batin yang utuh dan tidak terbagi. “Dengan segenap hatiku” mempertahankan citra hati sekaligus terdengar wajar dan bermartabat.
- source_word: וַאֲכַבְּדָה
  choice: dan aku akan memuliakan
  rationale: Bentuk Piel dari כבד dapat berarti menghormati atau memuliakan. Dengan “nama-Mu” sebagai objek dalam konteks ibadah, “memuliakan” merupakan padanan alami dan tepat.
- source_word: שִׁמְךָ
  choice: nama-Mu
  rationale: Terjemahan harfiah dipertahankan karena “nama” dapat merujuk pada pribadi, karakter, dan kemasyhuran Allah, serta merupakan ungkapan yang lazim dalam bahasa Indonesia Alkitabiah.
- source_word: לְעוֹלָם
  choice: selama-lamanya
  rationale: Ungkapan ini menyampaikan keberlangsungan tanpa akhir dan sesuai dengan ragam puisi ibadah yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sapaan ilahi אֲדֹנָי אֱלֹהַי
  choice: Tuhan, Allahku
  alternative: Ya Tuhan, Allahku
  rationale: Terjemahan ini mempertahankan kedua gelar dan hubungan pribadi yang dinyatakan oleh akhiran posesif. Kata seru “Ya” tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam teks Ibrani dan sapaan langsung sudah jelas melalui tanda baca.
- issue: Cakupan makna אוֹדְךָ dalam konteks ibadah
  choice: memuji-Mu
  alternative: bersyukur kepada-Mu
  rationale: Kedua arti didukung secara leksikal. “Memuji-Mu” dipilih karena kesejajarannya dengan “memuliakan nama-Mu,” sementara alternatif yang sah dipertahankan dalam catatan kaki agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, wajar, dan khidmat. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan editorial Indonesia. Struktur paralel ayat dan citra “hati” serta “nama” dipertahankan.
