  text: פְּנֵ֥ה אֵלַ֗/י וְ/חָ֫נֵּ֥/נִי תְּנָֽ/ה עֻזְּ/ךָ֥ לְ/עַבְדֶּ֑/ךָ וְ֝/הוֹשִׁ֗יעָ/ה לְ/בֶן אֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: id
  text: 'Berpalinglah kepadaku dan bermurah hatilah kepadaku;

    berikanlah kekuatan-Mu kepada hamba-Mu,

    dan selamatkanlah putra hamba perempuan-Mu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “putra budak perempuan-Mu.” Kata Ibrani dapat menunjuk kepada seorang hamba perempuan atau budak perempuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Berpalinglah kepadaku
  rationale: Bentuk perintah dari פנה meminta Allah mengarahkan perhatian-Nya kepada pemazmur. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran gerak yang terdapat dalam bahasa Ibrani.
- source_word: וְחָנֵּנִי
  choice: dan bermurah hatilah kepadaku
  rationale: Kata חנן menyatakan pemberian kemurahan atau perkenanan. Pilihan ini mempertahankan nuansa kemurahan hati tanpa mempersempitnya menjadi rasa iba semata.
- source_word: תְּנָה עֻזְּךָ
  choice: berikanlah kekuatan-Mu
  rationale: Menerjemahkan secara langsung perintah נתן dan nomina עֹז sebagai permohonan agar kekuatan yang berasal dari Allah diberikan kepada pemazmur.
- source_word: לְעַבְדֶּךָ
  choice: kepada hamba-Mu
  rationale: עבד dapat berarti hamba atau budak. Dalam doa ini, 'hamba' menyampaikan kerendahan dan kepunyaan kepada Allah dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: וְהוֹשִׁיעָה
  choice: dan selamatkanlah
  rationale: Bentuk perintah dari ישׁע meminta penyelamatan atau pembebasan. 'Selamatkanlah' mempertahankan keluasan maknanya.
- source_word: לְבֶן אֲמָתֶךָ
  choice: putra hamba perempuan-Mu
  rationale: Frasa ini secara eksplisit menyebut pemazmur sebagai anak laki-laki dari seorang אָמָה milik Allah. 'Putra' ringkas dan puitis, sedangkan 'hamba perempuan' mempertahankan pembedaan leksikal dari עבד pada baris sebelumnya.
theological_decisions:
- issue: Sebutan diri yang merendah melalui עבד dan אמה
  choice: hamba-Mu ... putra hamba perempuan-Mu
  alternative: budak-Mu ... putra budak perempuan-Mu
  rationale: Teks menekankan ketergantungan dan kepunyaan pemazmur kepada Allah, tetapi kedua istilah juga berasal dari ranah pengabdian. Teks utama memakai 'hamba' agar wajar dalam doa Indonesia, sementara catatan mempertahankan kemungkinan arti sosial yang lebih kuat, yaitu 'budak perempuan'.
translation_notes:
  register: Bahasa doa dibuat modern, khidmat, dan langsung. Paralelisme antarbait dipertahankan, demikian pula perbedaan antara עבד dan bentuk feminin אמה. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
