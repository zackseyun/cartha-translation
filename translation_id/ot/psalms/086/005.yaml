  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: id
  text: Sebab[a] Engkau, ya Tuhan, baik dan pengampun, serta berlimpah dalam kasih setia terhadap semua orang yang berseru kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Karena Engkau, ya Tuhan, baik dan siap mengampuni, serta besar dalam kasih setia terhadap semua orang yang berseru kepada-Mu.”'
    reason: Alternatif ini mencerminkan kemungkinan padanan bagi כִּי, סַלָּח, dan רַב חֶסֶד tanpa mengubah inti makna ayat.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar bagi permohonan sebelumnya. “Sebab” mempertahankan hubungan penalaran itu secara alami dalam bahasa Indonesia.
- source_word: אַתָּה
  choice: Engkau
  rationale: Pronomina yang dinyatakan secara eksplisit dipertahankan untuk menonjolkan sapaan langsung dan penekanan pada Allah.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Ini adalah gelar ilahi Adonai, bukan nama YHWH. “Tuhan” merupakan padanan alami dan hormat dalam doa bahasa Indonesia.
- source_word: טוֹב
  choice: baik
  rationale: Mempertahankan arti luas tentang kebaikan Allah tanpa mempersempitnya hanya menjadi keramahan atau kemurahan hati.
- source_word: סַלָּח
  choice: pengampun
  rationale: Adjektiva Ibrani ini menggambarkan Allah sebagai Dia yang mengampuni. “Pengampun” ringkas, alami, dan tidak menambahkan unsur kesiapan yang tidak dinyatakan secara eksplisit.
- source_word: רַב חֶסֶד
  choice: berlimpah kasih setia
  rationale: Ungkapan ini menyatakan kelimpahan atau kebesaran hesed. Susunan ini alami dalam bahasa Indonesia dan mempertahankan baik intensitas maupun sifat kasih yang teguh dan setia.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: “Kasih setia” mencakup kasih, kebaikan, dan kesetiaan relasional yang terkandung dalam hesed, tanpa mempersempitnya menjadi belas kasihan saja.
- source_word: לְכָל
  choice: kepada semua orang
  rationale: Menandai semua orang yang menjadi sasaran atau penerima kasih setia Allah.
- source_word: קֹרְאֶיךָ
  choice: yang berseru kepada-Mu
  rationale: Partisip ini menunjuk kepada orang-orang yang memanggil atau memohon kepada Allah dalam doa. “Berseru kepada-Mu” jelas dan sesuai dengan konteks mazmur.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Tuanku; Penguasa
  rationale: Bentuk Ibrani yang dipakai adalah Adonai, bukan Tetragramaton. Karena itu, “Tuhan” menerjemahkan gelar tersebut tanpa memperlakukannya sebagai nama perjanjian YHWH.
- issue: Penerjemahan חֶסֶד
  choice: kasih setia
  alternative: kasih yang teguh; belas kasihan
  rationale: “Kasih setia” mempertahankan perpaduan antara kasih, kemurahan, dan kesetiaan yang terkandung dalam istilah Ibrani, sedangkan “belas kasihan” saja terlalu sempit.
- issue: Nuansa סַלָּח
  choice: pengampun
  alternative: siap mengampuni; suka mengampuni
  rationale: “Pengampun” mempertahankan bentuk sifat yang menggambarkan watak Allah. Alternatif “siap mengampuni” menjelaskan kecenderungan-Nya dengan lebih eksplisit, tetapi sedikit memperluas bentuk Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan tulisan rohani Indonesia. Ungkapan “kasih setia” dipilih karena mudah dipahami sekaligus mempertahankan keluasan makna teologis hesed.
