id: PSA.86.2
reference: Psalms 86:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: id
  text: Jagalah hidupku[a], sebab aku setia[b]. Selamatkanlah hamba-Mu yang percaya kepada-Mu, ya Allahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwaku”; dalam konteks ini berarti “hidupku” atau “diriku”.
    reason: lexical_alternative
  - marker: b
    text: Atau “saleh”, “berbakti”, atau “teguh dalam kasih setia”. Kata Ibrani ini menunjuk pada kesetiaan dalam hubungan dengan Allah, bukan kesempurnaan tanpa dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  choice: Jagalah
  rationale: Bentuk imperatif yang memohon perlindungan Allah; “jagalah” alami dalam bahasa Indonesia dan mempertahankan makna melindungi.
- source_word: נַפְשִׁי
  choice: hidupku
  rationale: Dalam permohonan penyelamatan ini, נֶפֶשׁ menunjuk pada hidup atau diri pemazmur, bukan terutama jiwa sebagai unsur tak berjasmani.
- source_word: כִּי
  choice: sebab
  rationale: Menyatakan dasar bagi permohonan yang mendahuluinya.
- source_word: חָסִיד
  choice: setia
  rationale: Mengungkapkan kesalehan dan kesetiaan dalam hubungan perjanjian tanpa menyiratkan kesempurnaan tanpa dosa.
- source_word: הוֹשַׁע
  choice: Selamatkanlah
  rationale: Padanan langsung bagi imperatif ישׁע yang sesuai dengan permohonan pembebasan dari bahaya.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Gelar relasional yang rendah hati dalam doa kepada Allah; lebih sesuai konteks daripada padanan yang terutama menonjolkan status perbudakan.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Mempertahankan sapaan pribadi dengan bentuk posesif.
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: yang percaya kepada-Mu
  rationale: Frasa partisipial menerangkan “hamba-Mu” dan menyatakan sikap bersandar kepada Allah yang terus berlangsung.
theological_decisions:
- issue: Makna חָסִיד dalam pengakuan pemazmur tentang dirinya
  choice: Pemazmur menyebut dirinya setia dalam pengabdian dan hubungan perjanjian.
  alternative: “saleh”, “orang kudus”, atau “orang yang Kaukasihi”
  rationale: “Setia” mempertahankan seruan berdasarkan hubungan dan pengabdian kepada Allah tanpa mengubahnya menjadi klaim kesempurnaan moral atau jasa yang menuntut keselamatan.
- issue: Hubungan אֱלֹהַי dengan permohonan הוֹשַׁע
  choice: Diterjemahkan sebagai sapaan, “ya Allahku”, pada akhir permohonan.
  alternative: “Engkaulah Allahku” sebagai pernyataan tersendiri
  rationale: Susunan Ibrani dapat dipahami sebagai seruan kepada Allah di tengah permohonan. Bentuk sapaan menghasilkan bahasa Indonesia yang wajar tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan.
translation_notes:
  register: Bahasa doa yang modern, lugas, dan khidmat. Akhiran hormat ilahi ditulis dengan huruf kapital sesuai kebiasaan bahasa Indonesia. Sapaan “ya Allahku” mempertahankan nada pribadi dan menghindari susunan yang kaku.
