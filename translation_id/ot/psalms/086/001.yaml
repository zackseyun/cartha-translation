id: PSA.86.1
reference: Psalms 86:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד הַטֵּֽה יְהוָ֣ה אָזְנְ/ךָ֣ עֲנֵ֑/נִי כִּֽי עָנִ֖י וְ/אֶבְי֣וֹן אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: id
  text: 'Doa Daud.


    Arahkanlah telinga-Mu, ya Yahweh, dan jawablah aku,

    sebab aku miskin[a] dan berkekurangan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menderita dan berkekurangan.” Kata Ibrani עָנִי dapat berarti miskin, menderita, atau direndahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Doa
  rationale: Sebagai label jenis mazmur, nomina ini paling alami diterjemahkan secara ringkas sebagai “Doa”.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam judul “Doa Daud,” bentuk ini mempertahankan keluwesan hubungan yang dinyatakan oleh לְ, tanpa secara eksplisit menetapkan apakah artinya ditulis oleh, untuk, atau berkaitan dengan Daud.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Arahkanlah telinga-Mu
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang mengarahkan telinga sebagai tanda mendengarkan dengan penuh perhatian, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: עֲנֵנִי
  choice: jawablah aku
  rationale: Dalam konteks doa, ענה secara alami berarti memberi jawaban atau tanggapan kepada pemohon.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan yang mendasari permohonan pemazmur.
- source_word: עָנִי
  choice: miskin
  rationale: “Miskin” mempertahankan arti konkret yang cocok dengan pasangan אֶבְיוֹן, sementara kemungkinan arti “tertindas” atau “menderita” dicatat dalam catatan kaki.
- source_word: וְאֶבְיוֹן
  choice: dan berkekurangan
  rationale: Pilihan ini menyampaikan keadaan membutuhkan atau melarat dan membentuk pasangan alami dengan “miskin” tanpa pengulangan yang kaku.
- source_word: אָנִי
  choice: aku
  rationale: Pronomina yang dinyatakan secara eksplisit dalam bahasa Ibrani diwakili secara alami dalam klausa bahasa Indonesia “aku miskin dan berkekurangan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Cakupan makna עָנִי
  choice: miskin dalam teks utama, dengan alternatif “menderita” dalam catatan kaki
  alternative: menderita dan berkekurangan
  rationale: Kata ini dapat menunjuk pada kemiskinan, penderitaan, atau keadaan direndahkan. Konteks tidak sepenuhnya meniadakan salah satu nuansa itu, sehingga arti konkret dipakai dalam teks utama dan ambiguitasnya dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Metafora telinga dipertahankan tanpa memakai ungkapan yang terlalu arkais. Huruf kapital pada pronomina “-Mu” mengikuti kebiasaan bahasa Indonesia untuk sapaan kepada Allah.
