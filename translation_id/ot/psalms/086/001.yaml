  terminology: “Yahweh” konsisten dengan keputusan penerjemahan nama ilahi yang diberikan. “Doa Daud,” “ya Yahweh,” dan kapitalisasi pronomina ilahi sesuai register yang dipilih. Catatan kaki menggunakan istilah yang mudah dipahami dan tidak memaksakan satu nuansa leksikal bagi עָנִי.
