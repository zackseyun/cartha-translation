  text: ה֘וֹרֵ֤/נִי יְהוָ֨ה דַּרְכֶּ֗/ךָ אֲהַלֵּ֥ךְ בַּ/אֲמִתֶּ֑/ךָ יַחֵ֥ד לְ֝בָבִ֗/י לְ/יִרְאָ֥ה שְׁמֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: id
  text: Ajarlah aku jalan-Mu, ya Yahweh, agar aku berjalan dalam kebenaran-Mu[a]; satukanlah hatiku[b] untuk takut akan nama-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesetiaan-Mu.” Kata Ibrani ini dapat berarti “kebenaran” maupun “kesetiaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “jadikanlah hatiku tidak terbagi.” Kata kerja Ibrani berarti “satukan” atau “jadikan satu” dan mengungkapkan hati yang bebas dari loyalitas yang terbagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Ajarlah aku
  rationale: Bentuk imperatif Hifil dengan akhiran orang pertama tunggal berarti meminta agar Yahweh mengajar atau memberi petunjuk; “Ajarlah aku” alami dan langsung dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: דַּרְכֶּךָ
  choice: jalan-Mu
  rationale: דֶּרֶךְ dapat menunjuk pada jalan secara harfiah maupun cara hidup yang dikehendaki Allah. “Jalan-Mu” mempertahankan metafora dan bentuk tunggal teks sumber.
- source_word: אֲהַלֵּךְ
  choice: supaya aku hidup menurut
  rationale: Imperfek setelah permohonan imperatif paling wajar menyatakan tujuan atau hasil. Ungkapan “hidup menurut” menyampaikan metafora Ibrani ‘berjalan dalam’ secara alami dalam bahasa Indonesia.
- source_word: בַּאֲמִתֶּךָ
  choice: kebenaran-Mu
  rationale: אֱמֶת mencakup kebenaran, keteguhan, dan kesetiaan. “Kebenaran-Mu” menjadi bacaan utama yang langsung, sementara kemungkinan “kesetiaan-Mu” dipertahankan dalam catatan kaki.
- source_word: יַחֵד
  choice: satukanlah
  rationale: Imperatif Piel dari יחד berarti ‘satukan’ atau ‘jadikan satu’. Pilihan ini dekat dengan bentuk Ibrani dan mempertahankan gambaran hati yang dibebaskan dari kesetiaan yang terbagi.
- source_word: לְבָבִי
  choice: hatiku
  rationale: לֵבָב menunjuk pada batin, termasuk kehendak dan perasaan. “Hati” merupakan padanan Indonesia yang wajar dan tetap membawa keluasan maknanya.
- source_word: לְיִרְאָה
  choice: untuk takut akan
  rationale: Infinitif dengan ל menyatakan tujuan. “Takut akan” mempertahankan bobot istilah ירא, yang dalam konteks ini mencakup rasa gentar, hormat, dan takzim.
- source_word: שְׁמֶךָ
  choice: nama-Mu
  rationale: “Nama” dipertahankan karena dalam pemakaian Ibrani menunjuk pada pribadi, watak, dan reputasi Allah serta penting dalam bahasa penyembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama itu sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna ירא terhadap nama Allah
  choice: takut akan nama-Mu
  alternative: menghormati nama-Mu
  rationale: Kata ירא mencakup takut, gentar, hormat, dan takzim. Terjemahan “takut akan” menjaga ketegangan dan bobot teologis kata sumber tanpa mempersempitnya menjadi rasa hormat saja.
- issue: Gambaran hati yang disatukan
  choice: satukanlah hatiku
  alternative: jadikanlah hatiku tidak terbagi
  rationale: Terjemahan utama mempertahankan tindakan ‘menyatukan’ dalam kata kerja Ibrani, sedangkan alternatif menjelaskan implikasinya, yaitu kesetiaan batin yang tidak terbagi.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Sapaan “ya Yahweh” mempertahankan seruan langsung. Metafora ‘berjalan’ dialihkan menjadi “hidup menurut” agar mudah dipahami tanpa menghilangkan gagasan tentang cara hidup; metafora hati tetap dipertahankan.
