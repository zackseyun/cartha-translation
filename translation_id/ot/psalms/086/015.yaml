  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: id
  text: Namun Engkau, ya Tuhan, adalah Allah yang penuh belas kasihan dan murah hati, lambat marah, serta berlimpah kasih setia dan kesetiaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kebenaran. Dalam rumusan perjanjian ini, kata Ibrani tersebut sering mengandung arti kesetiaan atau keterandalan, bukan hanya kebenaran dalam arti abstrak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Namun Engkau
  rationale: Kata penghubung bersama pronomina yang ditegaskan menunjukkan kontras dengan kesusahan dan perlawanan yang disebut dalam konteks sebelumnya. “Namun Engkau” menyampaikan daya adversatif itu secara alami.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: אֲדֹנָי merupakan gelar ilahi yang lazim diterjemahkan “Tuhan”. Partikel “ya” membuat sapaan langsung dalam kalimat ini alami dalam bahasa Indonesia tanpa mengubah gelar tersebut menjadi bentuk posesif.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל menyatakan identitas Tuhan sebagai Allah dalam rumusan pengakuan yang menggemakan Keluaran 34:6. “Allah” adalah padanan yang alami dan tidak menambahkan nuansa “perkasa” yang tidak perlu dieksplisitkan.
- source_word: רַחוּם
  choice: penuh belas kasihan
  rationale: Ungkapan ini menyampaikan sifat yang berbelaskasihan secara mendalam dan mudah dipahami pembaca modern.
- source_word: וְ/חַנּוּן
  choice: dan murah hati
  rationale: חַנּוּן menggambarkan pribadi yang berkenan menunjukkan kemurahan atau anugerah. “Murah hati” alami dalam bahasa Indonesia dan tetap membedakannya dari belas kasihan.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lambat marah
  rationale: Ungkapan Ibrani ini secara harfiah berkaitan dengan panjangnya hidung atau napas, tetapi secara idiomatis berarti tidak cepat menjadi marah. “Lambat marah” mempertahankan maknanya dengan jelas.
- source_word: וְ/רַב חֶסֶד
  choice: serta berlimpah kasih setia
  rationale: רַב menyatakan kelimpahan, sedangkan חֶסֶד mencakup kasih, kemurahan, dan loyalitas yang teguh, khususnya dalam relasi perjanjian. “Kasih setia” merupakan padanan ringkas dan mapan.
- source_word: וֶ/אֱמֶת
  choice: dan kesetiaan
  rationale: Dalam pasangan dengan חֶסֶד, אֱמֶת dapat menekankan keterandalan atau kesetiaan, bukan hanya kebenaran abstrak. Alternatif “kebenaran” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Rumusan sifat ilahi yang menggemakan Keluaran 34:6
  choice: 'Memakai ungkapan yang jelas dan bernuansa relasional: “penuh belas kasihan dan murah hati ... berlimpah kasih setia dan kesetiaan.”'
  alternative: “Penyayang dan pengasih ... berlimpah kasih dan kebenaran.”
  rationale: Pilihan utama menjaga gema rumusan perjanjian serta menampilkan belas kasihan, kemurahan, kasih yang teguh, dan keterandalan Allah tanpa memasukkan penafsiran denominatif.
- issue: Makna אֱמֶת dalam pasangan חֶסֶד וֶאֱמֶת
  choice: kesetiaan
  alternative: kebenaran
  rationale: Konteks rumusan perjanjian mendukung nuansa kesetiaan atau keterandalan, tetapi kata Ibrani itu sungguh dapat berarti “kebenaran”; karena itu ambiguitas leksikalnya dicatat, bukan dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Engkau” dan “ya Tuhan” mempertahankan tekanan pronominal serta bentuk doa. Susunan kalimat dibuat mengalir bagi pembaca umum sambil menjaga rumusan teologis sumber Ibrani.
