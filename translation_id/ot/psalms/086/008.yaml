  text: אֵין כָּמ֖וֹ/ךָ בָ/אֱלֹהִ֥ים אֲדֹנָ֗/י וְ/אֵ֣ין כְּֽ/מַעֲשֶֽׂי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/008.yaml
  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
translation:
  language: id
  text: Di antara para ilah tidak ada yang seperti Engkau, ya Tuhan, dan tidak ada karya seperti karya-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Karya” juga dapat diterjemahkan “perbuatan” atau “tindakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּמוֹךָ
  choice: tidak ada yang seperti Engkau
  rationale: Ungkapan ini mempertahankan penyangkalan eksistensial dan perbandingan langsung dalam bentuk Indonesia yang alami.
- source_word: בָאֱלֹהִים
  choice: di antara para ilah
  rationale: Bentuk jamak dan fungsi preposisinya dipertahankan, sehingga pernyataan puitis tentang ketakterbandingan Tuhan tidak dihaluskan menjadi bentuk tunggal.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: Kata ini berfungsi sebagai sapaan ilahi; partikel 'ya' membuat fungsi vokatifnya jelas dan alami dalam doa.
- source_word: וְאֵין כְּמַעֲשֶׂיךָ
  choice: dan tidak ada perbuatan yang seperti perbuatan-Mu
  rationale: מַעֲשֶׂה mencakup perbuatan, karya, atau tindakan. Pengulangan 'perbuatan' menghasilkan kalimat yang jelas dan mempertahankan paralelisme Ibrani.
theological_decisions:
- issue: Makna 'di antara para ilah'
  choice: Mempertahankan bentuk jamak 'para ilah' sebagai pernyataan puitis bahwa Tuhan tidak tertandingi oleh kuasa mana pun yang disebut ilahi.
  alternative: di antara makhluk-makhluk surgawi; tidak ada ilah seperti Engkau
  rationale: Teks Ibrani secara eksplisit memakai אֱלֹהִים dalam bentuk jamak. Terjemahan langsung mempertahankan ketegangan dan daya puitisnya tanpa menyatakan lebih jauh status ontologis para ilah tersebut.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi kata ganti yang merujuk kepada Tuhan mengikuti kelaziman bahasa Alkitab Indonesia. Istilah 'para ilah' dipilih untuk menjaga bentuk jamak teks sumber; catatan tentang alternatif 'makhluk-makhluk surgawi' tidak dimasukkan karena teks utama sudah jelas dan catatan tersebut berisiko terlalu menafsirkan.
