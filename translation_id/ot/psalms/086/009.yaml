id: PSA.86.9
reference: Psalms 86:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל גּוֹיִ֤ם אֲשֶׁ֥ר עָשִׂ֗יתָ יָב֤וֹאוּ וְ/יִשְׁתַּחֲו֣וּ לְ/פָנֶ֣י/ךָ אֲדֹנָ֑/י וִֽ/יכַבְּד֣וּ לִ/שְׁמֶֽ/ךָ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: id
  text: Segala bangsa yang telah Kaujadikan akan datang dan sujud di hadapan-Mu[a], ya Tuhan, dan mereka akan memuliakan nama-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah di hadapan-Mu”; kata Ibrani ini dapat berarti sujud sebagai tanda hormat dan, dalam konteks keagamaan, menyembah.
    reason: lexical_alternative
  - marker: b
    text: Atau “menghormati nama-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Segala bangsa
  rationale: Mengungkapkan cakupan kolektif seluruh bangsa secara alami dan mempertahankan keluasan pernyataan Ibrani tanpa mempersempitnya menjadi kelompok non-Yahudi saja.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: yang telah Kaujadikan
  rationale: Menjaga arti dasar עשה, yaitu 'membuat/menjadikan', serta menyampaikan tindakan lampau yang hasilnya tetap nyata; pilihan ini tidak mempersempit verba menjadi istilah teknis tertentu tentang penciptaan.
- source_word: יָבֹאוּ
  choice: akan datang
  rationale: Bentuk imperfek dalam konteks ini paling wajar dipahami sebagai pengharapan atau pernyataan mengenai masa depan.
- source_word: וְיִשְׁתַּחֲווּ
  choice: dan sujud
  rationale: Mempertahankan gambaran jasmani tentang membungkuk atau merebahkan diri dengan hormat, sekaligus membiarkan implikasi penyembahannya tetap terasa.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Padanan Indonesia yang alami bagi ungkapan harfiah 'di depan wajah-Mu', dengan makna berada dalam hadirat Tuhan.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: אֲדֹנָי berfungsi sebagai gelar ilahi dan sapaan langsung; 'ya Tuhan' menyampaikan keduanya secara wajar dan khidmat.
- source_word: וִיכַבְּדוּ
  choice: dan mereka akan memuliakan
  rationale: Dalam bentuk piel, כבד dapat berarti menghormati atau memuliakan. 'Memuliakan' cocok dengan objek 'nama-Mu' dan dengan konteks penyembahan, sementara alternatif 'menghormati' dicatat.
- source_word: לִשְׁמֶךָ
  choice: nama-Mu
  rationale: Objek ini menunjuk pada nama Tuhan sebagai penyataan identitas dan reputasi-Nya; susunan 'memuliakan nama-Mu' alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan tanggapan bangsa-bangsa
  choice: Pernyataan berjangkauan universal bahwa segala bangsa yang dijadikan Tuhan akan datang dan sujud kepada-Nya
  alternative: Bahasa pujian hiperbolis yang merujuk pada banyak bangsa, bukan setiap bangsa tanpa kecuali
  rationale: Teks secara langsung memakai כָּל, 'segala/semua', dan tidak memberi pembatas. Terjemahan mempertahankan cakupan universal itu tanpa menentukan lebih jauh bagaimana atau kapan penggenapannya terjadi.
- issue: Makna tindakan וְיִשְׁתַּחֲווּ
  choice: sujud
  alternative: menyembah
  rationale: Pilihan utama mempertahankan tindakan konkret merendahkan diri di hadapan Tuhan, sedangkan catatan kaki menyatakan perluasan maknanya sebagai penyembahan.
- issue: Gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Tuanku / Penguasa
  rationale: Dalam pemakaian mazmur ini, bentuk tersebut merupakan gelar ilahi yang lazim diterjemahkan 'Tuhan'; terjemahan tidak menjadikannya nama diri ataupun menambahkan nuansa doktrinal lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat dengan huruf kapital pada 'Kaujadikan', 'hadapan-Mu', dan 'nama-Mu' mengikuti pemakaian hormat bagi sapaan kepada Tuhan. Pengulangan subjek 'mereka' dipertahankan agar alur kalimat jelas dan alami.
