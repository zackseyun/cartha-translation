  yaml_path: translation/ot/psalms/086/000.yaml
  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
translation:
  language: id
  text: 'Doa Daud.


    Condongkanlah telinga-Mu kepadaku, ya TUHAN, dan jawablah aku, sebab aku menderita dan berkekurangan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “miskin dan berkekurangan.” Kata Ibrani עָנִי dapat menunjuk kepada orang yang miskin, menderita, atau direndahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Doa Daud
  rationale: Superskripsi Ibrani menyatakan sebuah doa yang dikaitkan dengan Daud; bentuk ringkas ini alami dalam bahasa Indonesia dan tidak memaksakan nuansa kepengarangan yang lebih spesifik daripada konstruksi לְדָוִד.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Condongkanlah telinga-Mu kepadaku
  rationale: Mempertahankan gambaran tubuh dalam idiom Ibrani, yang berarti meminta TUHAN berkenan mendengarkan, sambil menambahkan 'kepadaku' secara wajar dari konteks permohonan.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas untuk nama ilahi YHWH, dengan huruf kapital yang membedakannya dari gelar biasa.
- source_word: עָנִי וְאֶבְיוֹן
  choice: tertindas dan berkekurangan
  rationale: עָנִי dapat berarti miskin, tertindas, atau direndahkan; 'tertindas' mempertahankan dimensi penderitaan, sedangkan אֶבְיוֹן secara langsung menyatakan keadaan berkekurangan. Alternatif ekonomi dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan superskripsi לְדָוִד dengan Daud
  choice: Doa Daud
  alternative: Doa oleh Daud / Doa untuk Daud
  rationale: Konstruksi Ibrani dapat menandai kepunyaan, kaitan, atau kepengarangan. Rumusan genitif Indonesia menjaga keluasan hubungan itu tanpa menetapkan teori kepengarangan tertentu.
- issue: Penerjemahan nama perjanjian יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: TUHAN merupakan padanan konvensional dan bermartabat dalam tradisi penerjemahan Indonesia; kapitalisasi menandai bahwa yang dimaksud ialah nama ilahi, bukan sekadar gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme permohonan dipertahankan, begitu pula metafora 'condongkanlah telinga-Mu'. Penulisan pronomina yang merujuk kepada Allah memakai huruf kapital sesuai kebiasaan luas dalam teks keagamaan Indonesia.
