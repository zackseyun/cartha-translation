  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חָנֵּ֥/נִי אֲדֹנָ֑/י כִּ֥י אֵלֶ֥י/ךָ אֶ֝קְרָ֗א כָּל הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/003.yaml
  text: Be gracious to me[a], Lord, for I call to you all day long.
translation:
  language: id
  text: Kasihanilah aku[a], ya Tuhan, sebab sepanjang hari aku berseru kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bermurah hatilah kepadaku.” Kata kerja Ibrani ini dapat menyatakan permohonan akan kemurahan atau belas kasihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Kasihanilah aku
  rationale: Bentuk imperatif חנן dengan akhiran orang pertama tunggal memohon kemurahan atau belas kasihan. Dalam doa bahasa Indonesia, “Kasihanilah aku” alami dan tepat, sementara nuansa kemurahan tetap dicatat sebagai alternatif.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: Gelar ilahi אֲדֹנָי diterjemahkan “Tuhan”; partikel vokatif “ya” membuat sapaan doa terdengar alami tanpa menambahkan unsur makna teologis.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan dasar bagi permohonan dan secara alami diterjemahkan dengan konjungsi kausal “sebab”.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Preposisi אֶל dengan akhiran orang kedua maskulin tunggal menyatakan arah kepada pihak yang disapa; “kepada-Mu” paling wajar bersama “berseru”.
- source_word: אֶקְרָא
  choice: aku berseru
  rationale: קרא dapat berarti memanggil atau berseru. Dalam konteks doa permohonan kepada Allah, “berseru” mengungkapkan tindakan memanggil dalam doa tanpa mempersempit maknanya secara berlebihan.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini secara harfiah berarti “seluruh hari”; “sepanjang hari” merupakan padanan Indonesia modern yang alami dan mempertahankan gagasan berlangsung atau berulang selama hari itu.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Tuanku; Penguasa
  rationale: Dalam ayat ini אֲדֹנָי adalah gelar ilahi dalam sapaan doa. “Tuhan” adalah padanan Indonesia yang baku, alami, dan tidak memasukkan penafsiran denominasi tertentu.
- issue: Nuansa permohonan חָנֵּנִי
  choice: Kasihanilah aku
  alternative: Bermurah hatilah kepadaku
  rationale: Kata kerja חנן mencakup permohonan akan kemurahan atau belas kasihan. Teks utama memakai ungkapan doa yang paling alami dalam bahasa Indonesia, sedangkan alternatif di catatan kaki mempertahankan nuansa kemurahan agar rentang makna Ibraninya tidak ditutup.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat dalam ragam doa. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia; tanda koma menandai sapaan langsung.
