  yaml_path: translation/ot/psalms/086/010.yaml
  text: For you are great and do wondrous things[a]; you alone are God.
translation:
  language: id
  text: Sebab Engkau besar dan melakukan perbuatan-perbuatan ajaib; hanya Engkaulah Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Engkaulah satu-satunya Allah.'
    reason: Alternatif susunan yang memperjelas daya eksklusif לְבַדֶּךָ tanpa mengubah makna dasarnya.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan alasan bagi permohonan dan pujian sebelumnya; “sebab” mempertahankan hubungan logis itu dengan wajar.
- source_word: גָדוֹל
  choice: besar
  rationale: Kata sifat ini menyatakan kebesaran dalam kedudukan atau kuasa. “Besar” merupakan padanan langsung dan alami dalam konteks pujian.
- source_word: וְעֹשֵׂה
  choice: dan melakukan
  rationale: Bentuk partisip ini menyatakan tindakan yang menjadi ciri tetap. Bentuk kini umum dalam bahasa Indonesia menyampaikan tindakan ilahi yang terus berlaku tanpa membatasinya pada satu waktu.
- source_word: נִפְלָאוֹת
  choice: perbuatan-perbuatan ajaib
  rationale: Nomina jamak ini menunjuk pada tindakan luar biasa yang membangkitkan rasa takjub. Pilihan ini mempertahankan gagasan tentang tindakan nyata dan bentuk jamaknya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam sapaan orang kedua dan bersama penegasan eksklusif לְבַדֶּךָ, kata ini merujuk kepada satu-satunya Allah dan secara tepat diterjemahkan dengan nama umum “Allah” dalam bahasa Indonesia.
- source_word: לְבַדֶּךָ
  choice: hanya Engkaulah
  rationale: Bentuk ini berarti “Engkau saja/Engkau seorang diri.” Susunan “hanya Engkaulah” secara alami menonjolkan eksklusivitas dalam klausa penutup.
theological_decisions:
- issue: Penegasan eksklusif tentang Allah dalam klausa terakhir
  choice: hanya Engkaulah Allah
  alternative: Engkaulah satu-satunya Allah
  rationale: Kedua susunan menyatakan bahwa tidak ada yang lain yang adalah Allah. “Hanya Engkaulah Allah” mengikuti penekanan לְבַדֶּךָ secara dekat, tetap puitis, dan tidak menambahkan uraian filosofis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Huruf kapital pada “Engkau” dipakai sebagai bentuk penghormatan dalam sapaan kepada Allah. Pengulangan “perbuatan-perbuatan” mempertahankan bentuk jamak Ibrani dan tetap mudah dipahami.
