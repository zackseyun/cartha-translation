  text: שַׂ֭מֵּחַ נֶ֣פֶשׁ עַבְדֶּ֑/ךָ כִּ֥י אֵלֶ֥י/ךָ אֲ֝דֹנָ֗/י נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: id
  text: Gembirakanlah jiwa hamba-Mu[a], sebab kepada-Mu, ya Tuhan, kuangkat jiwaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diri” atau “hidup”; kata Ibrani yang diterjemahkan “jiwa” dapat berarti jiwa, hidup, atau diri, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמֵּחַ
  choice: Buatlah ... bersukacita
  rationale: Bentuk Piel imperatif menyampaikan permohonan langsung agar Allah menyebabkan sukacita. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya imperatifnya.
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: jiwa / jiwaku
  rationale: Dalam doa ini, נֶפֶשׁ menunjuk pada diri batiniah atau pribadi pemazmur. “Jiwa” mempertahankan bobot devosional serta pengulangan puitis pada kedua kemunculannya.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Dalam sapaan kepada Allah di Mazmur, istilah ini menyatakan kerendahan hati dan pengabdian. “Hamba-Mu” lebih sesuai dengan laras doa daripada padanan yang menonjolkan status perbudakan.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan dasar bagi permohonan sebelumnya dan mempertahankan hubungan logis antarklausa.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Preposisi אֶל menyatakan arah kepada Allah dan berpadu secara alami dengan metafora “mengangkat jiwa”.
- source_word: אֲדֹנָי
  choice: ya Tuhan
  rationale: אֲדֹנָי adalah gelar ilahi. Partikel vokatif “ya” membuat sapaan langsung tersebut jelas dan wajar dalam doa bahasa Indonesia.
- source_word: אֶשָּׂא
  choice: kuangkat
  rationale: Bentuk ini mempertahankan metafora Ibrani tentang mengarahkan seluruh diri kepada Allah dalam doa dan ketergantungan.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ dalam bahasa doa
  choice: Menerjemahkan kedua kemunculannya sebagai “jiwa”
  alternative: diri; hidup; batin
  rationale: “Jiwa” mempertahankan kekuatan devosional dan pengulangan sastra tanpa menetapkan suatu antropologi teknis yang melampaui teks.
- issue: Makna עבד dalam hubungan pemazmur dengan Allah
  choice: hamba-Mu
  alternative: budak-Mu
  rationale: Konteks doa ini menekankan kerendahan hati dan pengabdian kepada Allah, bukan terutama status sosial berupa perbudakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “hamba-Mu” dan sapaan “ya Tuhan” sesuai dengan laras doa; pengulangan “jiwa/jiwaku” mempertahankan pola puitis teks Ibrani.
