  text: In the day of my distress I call to you, because you answer me.
translation:
  language: id
  text: Pada hari kesesakanku aku berseru kepada-Mu, sebab Engkau menjawabku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: Pada hari kesesakanku
  rationale: Mencerminkan ungkapan temporal dan nomina צָרָה secara dekat, dengan bentuk Indonesia yang alami dan bermartabat.
- source_word: אֶקְרָאֶךָּ
  choice: aku berseru kepada-Mu
  rationale: Dalam konteks doa, קרא dengan objek orang berarti memanggil atau berseru kepada seseorang; 'berseru kepada-Mu' menyampaikan tindakan permohonan kepada Allah dengan jelas.
- source_word: כִּי
  choice: sebab
  rationale: 'Mempertahankan hubungan kausal yang paling wajar dalam konteks: pemazmur berseru karena yakin Allah akan menjawab.'
- source_word: תַעֲנֵנִי
  choice: Engkau akan menjawab aku
  rationale: Bentuk imperfek orang kedua maskulin tunggal dengan sufiks objek orang pertama paling alami dipahami sebagai tindakan mendatang yang diyakini pemazmur, bukan pernyataan kebiasaan yang harus diratakan menjadi kala kini.
theological_decisions:
- issue: Nuansa temporal תַעֲנֵנִי
  choice: Engkau akan menjawab aku
  alternative: Engkau menjawab aku
  rationale: Bahasa Ibrani tidak menandai kala secara identik dengan bahasa Indonesia, tetapi dalam konteks seruan pada masa kesesakan, bentuk imperfek paling alami menyatakan keyakinan akan jawaban Allah. Ini menjaga ketegangan antara permohonan kini dan jawaban yang diharapkan.
- issue: Hubungan כִּי dengan klausa sebelumnya
  choice: sebab
  alternative: karena
  rationale: Keduanya mungkin secara leksikal; 'sebab' dipilih sebagai penghubung kausal yang ringkas, alami, dan sesuai dengan register doa yang bermartabat tanpa mengubah alasan pemazmur berseru.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bernada doa. Kapitalisasi pronomina yang merujuk kepada Allah dipakai sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang perlu dijelaskan kepada pembaca pada ayat ini.
