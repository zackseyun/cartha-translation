source:
  edition: WLC
  text: אֱלֹהִ֤ים זֵ֘דִ֤ים קָֽמוּ עָלַ֗/י וַ/עֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י וְ/לֹ֖א שָׂמ֣וּ/ךָ לְ/נֶגְדָּֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: id
  text: Ya Allah, orang-orang sombong telah bangkit melawan aku, dan gerombolan orang kejam telah berusaha mencabut nyawaku; mereka tidak menempatkan Engkau di hadapan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Artinya, mereka tidak mengindahkan Allah.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Nomina ini berfungsi sebagai sapaan langsung kepada Allah. Partikel “Ya” merupakan bentuk sapaan yang alami dan bermartabat dalam bahasa Indonesia, tanpa menambah isi teologis.
- source_word: זֵדִים
  choice: orang-orang sombong
  rationale: Kata ini menunjuk kepada orang yang angkuh, lancang, atau pongah; “orang-orang sombong” jelas dan wajar bagi pembaca modern.
- source_word: קָמוּ עָלַי
  choice: telah bangkit melawan aku
  rationale: Ungkapan ini menggambarkan tindakan memusuhi atau menyerang; bentuk perfektif dipertahankan dengan “telah bangkit”.
- source_word: וַעֲדַת
  choice: gerombolan
  rationale: Kata sumber berarti kelompok atau perhimpunan. Dalam konteks para penyerang, “gerombolan” menyampaikan sifat kelompok yang mengancam secara alami.
- source_word: עָרִיצִים
  choice: orang kejam
  rationale: Istilah ini menunjuk kepada orang yang bengis, keras, atau menindas; “orang kejam” menyampaikan ancaman tanpa mempersempitnya menjadi penguasa politik.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: berusaha mencabut nyawaku
  rationale: Secara harfiah ungkapan ini berarti “mencari nyawaku,” sebuah idiom Ibrani bagi usaha membunuh. Padanan Indonesia ini menyampaikan maksud idiom sekaligus mempertahankan citra “nyawa”.
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: mereka tidak menempatkan Engkau di hadapan mereka
  rationale: Terjemahan ini mempertahankan metafora sumber tentang tidak menaruh Allah di depan mereka, yakni tidak mengindahkan-Nya.
theological_decisions:
- issue: Bentuk sapaan kepada Allah
  choice: Ya Allah
  alternative: Allah
  rationale: Bahasa Indonesia lazim menandai sapaan langsung dengan “Ya”. Ini memperjelas fungsi vokatif אֱלֹהִים tanpa mengubah identitas pihak yang disapa.
- issue: Seberapa eksplisit maksud בִּקְשׁוּ נַפְשִׁי
  choice: berusaha mencabut nyawaku
  alternative: mencari nyawaku
  rationale: Terjemahan harfiah “mencari nyawaku” kurang alami dan dapat kabur dalam bahasa Indonesia. Padanan terpilih menyampaikan idiom tentang niat membunuh tanpa menghilangkan unsur “nyawa” dari teks sumber.
- issue: Metafora tidak menempatkan Allah di hadapan mereka
  choice: mempertahankan metafora dalam teks utama
  alternative: mereka tidak mengindahkan Engkau
  rationale: Ungkapan sumber sengaja bersifat konkret. Metafora dipertahankan, sedangkan maknanya dijelaskan dalam catatan agar ketegangan dan citra teks tidak dilenyapkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Ya Allah” serta kapitalisasi “Engkau” mengikuti kelaziman teks doa. Struktur paralel puisi dipertahankan, dan metafora penutup dijaga dengan satu catatan penjelas.
