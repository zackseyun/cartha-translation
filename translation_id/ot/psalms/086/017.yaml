base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: id
  text: Berilah aku tanda kebaikan,[a] supaya orang-orang yang membenci aku melihatnya dan menjadi malu, karena Engkau, ya Yahweh, telah menolong dan menghibur aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Lakukanlah bersamaku suatu tanda untuk kebaikan.” Dapat juga diterjemahkan: “Berilah aku tanda perkenanan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי אוֹת
  choice: Berilah aku tanda
  rationale: Secara harfiah ungkapan ini berarti 'buatlah/lakukanlah bersamaku suatu tanda'. Dalam bahasa Indonesia, 'berilah aku tanda' menyampaikan permohonan akan tindakan ilahi yang nyata secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְטוֹבָה
  choice: bahwa Engkau berkenan kepadaku
  rationale: Ungkapan ini secara harfiah berarti 'untuk kebaikan' dan dapat menunjuk pada kebaikan atau perkenanan yang dinyatakan bagi pemazmur. Pilihan ini alami dalam konteks tanda ilahi tanpa menutup nuansa harfiahnya, yang dipertahankan dalam catatan kaki.
- source_word: וְיִרְאוּ
  choice: supaya ... melihatnya
  rationale: Bentuk imperfek setelah imperatif paling wajar dipahami sebagai hasil atau tujuan. Pronomina '-nya' merujuk pada tanda yang diminta dan membuat hubungan antarklausa jelas dalam bahasa Indonesia.
- source_word: שֹׂנְאַי
  choice: orang-orang yang membenci aku
  rationale: Partisip ini secara tepat menunjuk kepada mereka yang membenci pemazmur; terjemahan ini lebih dekat daripada istilah umum 'musuh-musuhku'.
- source_word: וְיֵבֹשׁוּ
  choice: dan mendapat malu
  rationale: Kata בוש dapat menyatakan dipermalukan, dikecewakan, atau terbukti gagal secara terbuka. 'Mendapat malu' mempertahankan dimensi objektif dan publik, bukan hanya perasaan malu batin.
- source_word: כִּי
  choice: sebab
  rationale: 'Partikel ini memperkenalkan alasan bagi rasa malu para pembenci: Yahweh telah bertindak bagi pemazmur.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: עֲזַרְתַּנִי
  choice: telah menolong aku
  rationale: Bentuk perfektif menyatakan tindakan pertolongan yang sudah dilakukan dan tetap relevan bagi permohonan pemazmur.
- source_word: וְנִחַמְתָּנִי
  choice: dan menghibur aku
  rationale: Dalam bentuk piel, נחם di sini berarti menghibur atau memberi penghiburan. 'Menghibur' merupakan padanan Indonesia yang alami dan luas dipahami.
theological_decisions:
- issue: Penafsiran tanda לְטוֹבָה
  choice: tanda bahwa Engkau berkenan kepadaku
  alternative: tanda untuk kebaikan
  rationale: Teks meminta tanda yang menandakan kebaikan atau perkenanan Yahweh kepada pemazmur. Terjemahan utama mengungkapkan fungsi tanda secara alami, sedangkan catatan kaki mempertahankan bentuk harfiah dan kemungkinan nuansa 'demi kebaikanku'.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi ilahi, bukan kata Ibrani untuk gelar 'Tuhan'. Transliterasi menjaga perbedaan tersebut tanpa menambahkan tafsiran denominasi.
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan bermartabat. Susunan klausa mengikuti gerak teks Ibrani: permohonan, tujuan yang menyangkut para pembenci, lalu alasan yang berakar pada pertolongan dan penghiburan Yahweh.'
