translation:
  language: id
  text: Mereka menukar kemuliaan mereka[a] dengan rupa seekor lembu[b] yang makan rumput.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Allah mereka yang mulia.” Secara harfiah teks Ibrani berbunyi “kemuliaan mereka”, suatu cara penuh hormat untuk merujuk kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “lembu jantan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: Mereka menukar
  rationale: Kata kerja מוּר menyatakan pertukaran atau penggantian satu hal dengan hal lain. “Menukar” secara alami menyampaikan tuduhan bahwa Israel menggantikan apa yang mulia dengan berhala.
- source_word: כְּבוֹדָם
  choice: kemuliaan mereka
  rationale: Ungkapan ini mengikuti bentuk harfiah Ibrani dan mempertahankan cara puitis untuk menunjuk kepada Allah tanpa memasukkan kata “Allah” ke dalam teks utama.
- source_word: בְּתַבְנִית
  choice: dengan rupa
  rationale: תַּבְנִית dapat berarti bentuk, pola, rupa, atau gambaran. “Dengan rupa” alami dalam konstruksi pertukaran ini dan tetap dekat dengan ungkapan sumber.
- source_word: שׁוֹר
  choice: lembu
  rationale: שׁוֹר menunjuk pada ternak sapi dan dapat dipahami sebagai lembu atau lembu jantan. “Lembu” mempertahankan keluasan istilah, sedangkan kemungkinan jenis kelamin jantan dicatat dalam catatan kaki.
- source_word: אֹכֵל עֵשֶׂב
  choice: yang makan rumput
  rationale: Partisipel dan objeknya paling alami diterjemahkan sebagai klausa relatif. Susunan ini mempertahankan ironi bahwa berhala itu menyerupai makhluk biasa yang makan rumput.
theological_decisions:
- issue: Acuan “kemuliaan mereka”
  choice: Mempertahankan ungkapan “kemuliaan mereka” dalam teks utama.
  alternative: “Allah mereka yang mulia” atau “Allah”
  rationale: Konteks menunjuk kepada Allah, tetapi teks Ibrani memakai ungkapan abstrak dan puitis “kemuliaan mereka.” Terjemahan mempertahankan ambiguitas dan daya teologis ungkapan itu, sementara catatan kaki menjelaskan acuannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan puitis. Kata “kemuliaan” mempertahankan ungkapan teologis sumber, sedangkan “lembu” mudah dipahami pembaca umum.
