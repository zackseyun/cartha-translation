  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: id
  text: Sebab mereka membuat hatinya pahit[a], sehingga ia berbicara gegabah dengan bibirnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memprovokasi dia.” Secara harfiah, “membuat rohnya pahit”; kata kerja Ibrani ini dapat menyatakan tindakan membuat pahit atau memprovokasi.'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah Musa berbicara tanpa pertimbangan di Meriba; bandingkan Bilangan 20:10.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan alasan bagi pernyataan sebelumnya dan mempertahankan alur penjelasan Ibrani.
- source_word: הִמְרוּ
  choice: membuat ... getir
  rationale: Bentuk Hifil dari מרה dengan רוּחוֹ sebagai objek dapat menyatakan tindakan menimbulkan kepahitan atau memprovokasi. Ungkapan ini mempertahankan nuansa kausatif tanpa menutup kemungkinan makna 'membangkitkan amarah'.
- source_word: אֶת רוּחוֹ
  choice: hatinya
  rationale: רוּחַ di sini menunjuk pada batin atau keadaan jiwa Musa, bukan Roh Kudus. 'Hatinya' merupakan ungkapan Indonesia yang alami bagi pusat perasaan dan sikap batin, meski secara harfiah berarti 'rohnya'.
- source_word: וַיְבַטֵּא
  choice: lalu ia berbicara gegabah
  rationale: Kata kerja ini berarti mengucapkan atau berbicara; konteks Meriba memberi nuansa negatif berupa perkataan yang terburu-buru dan tidak dipertimbangkan.
- source_word: בִּשְׂפָתָיו
  choice: dengan bibirnya
  rationale: Terjemahan langsung ini mempertahankan gambaran konkret bahasa Ibrani dan tetap jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan akhiran pronominal pada 'hatinya' dan 'bibirnya'
  choice: Keduanya dipahami mengacu kepada Musa.
  alternative: Akhiran tersebut dapat dianggap mengacu kepada umat secara kolektif atau anteseden lain.
  rationale: Dalam kisah Meriba pada ayat 32–33, tindakan umat menyebabkan Musa berbicara gegabah; hal ini selaras dengan Bilangan 20:10 dan tidak memasukkan rujukan kepada Roh Kudus yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Membuat hatinya getir' menyampaikan keadaan batin Musa secara alami; 'berbicara gegabah' mempertahankan penilaian negatif dalam konteks tanpa memperluas makna. Semua penanda catatan kaki ditempatkan dalam teks utama.
