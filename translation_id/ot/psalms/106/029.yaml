  source_fidelity: Terjemahan secara setia mencerminkan teks Ibrani. “Membangkitkan murka-Nya” menyampaikan daya kausatif וַיַּכְעִיסוּ serta dengan wajar memasok objek ilahi yang tersirat oleh konteks. “Dengan perbuatan-perbuatan mereka” menerjemahkan sarana yang ditandai בְּ, dan “wabah merebak di antara mereka” menangkap pecahnya wabah (וַתִּפְרָץ ... מַגֵּפָה בָּם).
