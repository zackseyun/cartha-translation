  text: וַ֭/יַּכְעִיסוּ בְּ/מַֽעַלְלֵי/הֶ֑ם וַ/תִּפְרָץ בָּ֝֗/ם מַגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/029.yaml
  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: id
  text: Mereka membangkitkan murka-Nya dengan perbuatan-perbuatan mereka[a], dan wabah merebak di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka membuat Dia murka melalui tindakan-tindakan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: Mereka membangkitkan murka-Nya
  rationale: Bentuk Hifil dari כעס menyatakan tindakan menyebabkan atau membangkitkan kemarahan. Ungkapan ini mempertahankan daya kausatifnya; akhiran “-Nya” memasok objek ilahi yang tersirat dari konteks.
- source_word: בְּמַעַלְלֵיהֶם
  choice: dengan perbuatan-perbuatan mereka
  rationale: מַעֲלָלִים berarti perbuatan atau tindakan, sering dengan nuansa moral; בְּ di sini paling wajar menyatakan sarana.
- source_word: וַתִּפְרָץ
  choice: dan ... merebak
  rationale: פרץ menggambarkan sesuatu yang menerobos atau pecah dengan tiba-tiba. Bersama “wabah”, “merebak” merupakan padanan Indonesia yang alami dan tetap menyampaikan timbul serta meluasnya kejadian itu.
- source_word: בָּם
  choice: di antara mereka
  rationale: Preposisi בְּ dengan kelompok orang dapat menunjukkan bahwa peristiwa itu terjadi di tengah kelompok tersebut.
- source_word: מַגֵּפָה
  choice: wabah
  rationale: מַגֵּפָה menunjuk pada wabah atau pukulan mematikan, khususnya dalam konteks penghukuman; “wabah” jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Objek ilahi yang tersirat pada וַיַּכְעִיסוּ
  choice: Memakai “-Nya” sebagai rujukan kepada Allah.
  alternative: Menerjemahkan tanpa objek eksplisit, atau menyebut “Allah” secara langsung.
  rationale: Bahasa Ibrani tidak menyatakan objek dalam klausa ini, tetapi konteks mazmur dengan jelas merujuk kepada Allah. “-Nya” membuat kalimat Indonesia lengkap tanpa menambahkan nama ilahi yang tidak muncul dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Membangkitkan murka-Nya” mempertahankan kekuatan kausatif bahasa sumber, sedangkan “wabah merebak” merupakan kolokasi alami.
