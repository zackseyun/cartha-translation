  yaml_path: translation/ot/psalms/106/008.yaml
  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: id
  text: Namun[a] Ia menyelamatkan mereka demi nama-Nya[b], untuk menyatakan kuasa-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dan Ia menyelamatkan mereka” atau “Tetapi Ia menyelamatkan mereka”. Kata penghubung Ibrani dapat diterjemahkan dengan beberapa cara; di sini konteks menunjukkan pertentangan dengan ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: “Demi nama-Nya” juga dapat dipahami sebagai “demi reputasi-Nya”, tetapi dalam bahasa Ibrani “nama” sering mencakup makna yang lebih luas, yaitu karakter dan kehormatan Allah yang dinyatakan.
    reason: lexical_alternative
  - marker: c
    text: Atau “kekuatan-Nya” atau “keperkasaan-Nya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: Namun Ia menyelamatkan mereka
  rationale: Kata kerja ישׁע berarti ‘menyelamatkan’ atau ‘melepaskan’. Bentuk dengan waw menghubungkan kalimat ini dengan ayat sebelumnya; dalam konteks ini, ‘Namun’ menyampaikan pertentangan antara pemberontakan umat dan tindakan Allah tanpa memperkuatnya secara berlebihan.
- source_word: לְמַעַן
  choice: demi
  rationale: לְמַעַן menyatakan tujuan atau alasan. Diikuti ‘nama-Nya’, kata ‘demi’ merupakan ungkapan Indonesia yang alami dan mempertahankan gagasan bahwa tindakan Allah didasarkan pada kehormatan serta penyataan diri-Nya sendiri.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Terjemahan harfiah ‘nama-Nya’ dipertahankan karena dalam bahasa Ibrani ‘nama’ mencakup reputasi, kehormatan, dan jati diri Allah yang dinyatakan, bukan sekadar sebutan.
- source_word: לְהוֹדִיעַ
  choice: untuk menyatakan
  rationale: Bentuk kausatif dari ידע berarti ‘membuat diketahui’. ‘Untuk menyatakan’ mengungkapkan tujuan tindakan Allah secara alami dalam bahasa Indonesia.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Penanda objek langsung ini tidak mempunyai padanan tersendiri dalam bahasa Indonesia dan terwakili oleh susunan kalimat.
- source_word: גְּבוּרָתוֹ
  choice: kuasa-Nya
  rationale: גְּבוּרָה dapat berarti kekuatan, keperkasaan, kuasa, atau perbuatan perkasa. Dalam klausa ini, ‘kuasa-Nya’ merupakan ungkapan Indonesia yang alami untuk kemampuan Allah yang diperlihatkan melalui penyelamatan.
theological_decisions:
- issue: Makna ‘demi nama-Nya’
  choice: Tindakan penyelamatan Allah didasarkan pada kehormatan dan penyataan nama atau karakter-Nya sendiri.
  alternative: demi reputasi-Nya
  rationale: Makna reputasi termasuk dalam ungkapan Ibrani ini, tetapi terlalu sempit jika dijadikan satu-satunya makna. Mempertahankan ‘nama-Nya’ menjaga keluasan makna mengenai kehormatan, karakter, dan jati diri Allah yang dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Namun’ menyampaikan kontras secara wajar; ‘demi nama-Nya’ mempertahankan idiom teologis sumber; ‘menyatakan kuasa-Nya’ jelas bagi pembaca umum tanpa kehilangan arah kausatif dan tujuan dalam teks Ibrani.
