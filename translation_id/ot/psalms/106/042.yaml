base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/042.yaml
  text: Their enemies oppressed them[a], and they were subdued under their hand.
translation:
  language: id
  text: Musuh-musuh mereka menindas mereka, dan mereka ditundukkan di bawah kuasa musuh-musuh itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di bawah tangan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: menindas mereka
  rationale: Bentuk Qal dari לחץ dengan akhiran objek orang ketiga jamak menyatakan tindakan menekan, menindas, atau menyengsarakan. Dalam konteks kekuasaan musuh, “menindas mereka” menyampaikan tekanan dan perlakuan sewenang-wenang secara alami.
- source_word: אֹיְבֵיהֶם
  choice: musuh-musuh mereka
  rationale: Padanan langsung dan lazim bagi אויב dengan akhiran orang ketiga jamak; konteksnya adalah dominasi oleh pihak yang memusuhi Israel.
- source_word: וַיִּכָּנְעוּ
  choice: mereka ditundukkan
  rationale: Bentuk Nifal dari כנע menyatakan keadaan dijadikan takluk atau berada dalam ketundukan. Bentuk pasif “ditundukkan” mempertahankan daya resultatif teks.
- source_word: תַּחַת יָדָם
  choice: di bawah kuasa musuh-musuh itu
  rationale: Secara harfiah berarti “di bawah tangan mereka,” sebuah idiom Ibrani untuk berada di bawah kuasa atau kendali pihak lain. “Kuasa” menyampaikan makna idiomatis secara jelas dalam bahasa Indonesia; pengulangan “musuh-musuh itu” menghindari ketidakjelasan rujukan pronomina.
