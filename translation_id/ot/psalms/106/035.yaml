  text: but they mixed with the nations and learned their practices[a][b].
translation:
  language: id
  text: Namun, mereka berbaur dengan bangsa-bangsa lain[a] dan mempelajari perbuatan-perbuatan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bercampur di antara bangsa-bangsa lain.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “perbuatan-perbuatan mereka”; dalam konteks ini mencakup kebiasaan dan praktik bangsa-bangsa tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: mereka berbaur
  rationale: Bentuk hitpael dari ערב menyatakan percampuran atau pergaulan sosial yang dapat mengarah pada pembauran. “Berbaur” alami dalam bahasa Indonesia modern dan tidak menambahkan gagasan pencemaran yang tidak dinyatakan langsung oleh teks.
- source_word: בַגּוֹיִם
  choice: dengan bangsa-bangsa lain
  rationale: גּוֹיִם berarti bangsa-bangsa atau suku-suku bangsa; dalam konteks ini yang dimaksud ialah bangsa-bangsa non-Israel di sekitar mereka. “Bangsa-bangsa lain” menghindari konotasi khusus yang dapat muncul dari istilah “orang kafir.”
- source_word: וַיִּלְמְדוּ
  choice: mempelajari
  rationale: 'Bentuk qal ini bersifat aktif: Israel mempelajari atau mengadopsi perilaku bangsa-bangsa tersebut. “Mempelajari” mempertahankan keaktifan subjek tanpa menyiratkan bahwa mereka hanya diajar secara pasif.'
- source_word: מַעֲשֵׂיהֶם
  choice: perbuatan-perbuatan mereka
  rationale: Secara harfiah מַעֲשֵׂיהֶם berarti “perbuatan-perbuatan mereka.” Pilihan ini menjaga hubungan dekat dengan teks Ibrani, sementara catatan kaki menjelaskan bahwa dalam konteksnya ungkapan itu dapat menunjuk pada kebiasaan atau praktik mereka.
theological_decisions:
- issue: Daya moral-keagamaan dari pembauran Israel dengan bangsa-bangsa lain
  choice: Menyatakan bahwa mereka berbaur dan mempelajari perbuatan bangsa-bangsa lain tanpa menambahkan kecaman eksplisit.
  alternative: “Mencemarkan diri dengan bangsa-bangsa lain” atau, sebaliknya, ungkapan netral seperti “tinggal di antara bangsa-bangsa lain.”
  rationale: Teks Ibrani menyebut pembauran dan proses belajar secara aktif, sedangkan penilaian negatifnya muncul dari konteks mazmur. Terjemahan tidak boleh memperkerasnya menjadi pencemaran atau melemahkannya menjadi sekadar hidup berdampingan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” menyambungkan ayat ini dengan pertentangan dalam konteks sebelumnya. Pengulangan “perbuatan-perbuatan” mempertahankan bentuk konkret teks sumber, sedangkan catatan kaki memberi penjelasan kontekstual.
