  text: Then they believed his words[a]; they sang his praise.
translation:
  language: id
  text: Lalu mereka percaya kepada perkataan-Nya[a]; mereka menyanyikan pujian bagi-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan mereka percaya kepada perkataan-Nya.” Bentuk naratif Ibrani dapat diterjemahkan dengan “dan” atau dengan kata urutan yang lebih eksplisit, “lalu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: Lalu mereka percaya
  rationale: Bentuk Hifil wayyiqtol dari אמן menyatakan percaya atau menaruh kepercayaan. Kata 'lalu' menyampaikan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: בִדְבָרָיו
  choice: kepada firman-firman-Nya
  rationale: Bentuk jamak דְבָרָיו secara harfiah berarti 'firman-firman-Nya' atau 'perkataan-perkataan-Nya'. 'Firman' sesuai dengan konteks perkataan Allah, sementara bentuk ulang mempertahankan penanda jamak Ibrani.
- source_word: יָשִׁירוּ
  choice: mereka menyanyikan
  rationale: Imperfek Qal ini melanjutkan rangkaian naratif dan secara wajar diterjemahkan sebagai tindakan lampau; bahasa Indonesia tidak menandai kala pada verba.
- source_word: תְּהִלָּתוֹ
  choice: pujian bagi-Nya
  rationale: תְּהִלָּה dengan sufiks orang ketiga maskulin tunggal menunjuk pada pujian yang menjadi milik atau patut diberikan kepada-Nya. 'Menyanyikan pujian bagi-Nya' lebih alami dalam bahasa Indonesia daripada 'menyanyikan pujian-Nya' dan tidak mengubah acuannya.
