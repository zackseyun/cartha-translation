  text: וַ/יְקַנְא֣וּ לְ֭/מֹשֶׁה בַּֽ/מַּחֲנֶ֑ה לְ֝/אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
translation:
  language: id
  text: Mereka menjadi iri kepada Musa di perkemahan, dan kepada Harun, orang kudus Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Harun yang kudus bagi Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: Mereka menjadi iri
  rationale: Kata kerja קנא dalam konteks pemberontakan di perkemahan menyatakan rasa iri terhadap kedudukan Musa dan Harun. Ungkapan “menjadi iri” alami dalam bahasa Indonesia dan sesuai dengan alur penceritaan kembali dalam bentuk wayyiqtol.
- source_word: לְמֹשֶׁה ... לְאַהֲרֹן
  choice: kepada Musa ... dan kepada Harun
  rationale: Preposisi ל menandai orang yang menjadi sasaran rasa iri. “Iri kepada” merupakan padanan idiomatis dalam bahasa Indonesia, dan pengulangan “kepada” mempertahankan kesejajaran kedua unsur.
- source_word: בַּמַּחֲנֶה
  choice: di perkemahan
  rationale: מַחֲנֶה menunjuk pada perkemahan Israel di padang gurun; “di perkemahan” adalah terjemahan langsung dan wajar.
- source_word: קְדוֹשׁ יְהוָה
  choice: orang kudus milik Yahweh
  rationale: Frasa ini menyebut Harun sebagai orang yang dikhususkan bagi Yahweh. “Orang kudus milik Yahweh” mempertahankan bentuk sebutan yang melekat pada Harun, sedangkan kemungkinan relasional “kudus bagi Yahweh” dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Makna sebutan קְדוֹשׁ יְהוָה bagi Harun
  choice: Harun disebut “orang kudus milik Yahweh”, yang menekankan bahwa ia secara khusus menjadi milik dan dikhususkan bagi Yahweh.
  alternative: “orang yang kudus bagi Yahweh”
  rationale: Susunan Ibrani yang ringkas dapat dipahami sebagai sebutan kepunyaan atau sebagai pernyataan bahwa Harun dikuduskan bagi Yahweh. Teks utama mempertahankan sebutan nominal, sementara catatan kaki menjaga kemungkinan relasional tanpa memaksakan satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur puitis dua sasaran rasa iri dipertahankan, dan istilah “perkemahan” menjaga latar perjalanan Israel di padang gurun.
