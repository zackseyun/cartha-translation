  text: The earth opened and swallowed Dathan[c][b][a], and covered the company of Abiram.
translation:
  language: id
  text: Bumi terbuka[a] dan menelan Datan[b], dan menutupi kelompok Abiram.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
