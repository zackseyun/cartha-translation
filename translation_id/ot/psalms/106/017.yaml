    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְתַּח
  choice: terbelah
  rationale: Bentuk Qal orang ketiga feminin tunggal dari פתח, dengan אֶרֶץ sebagai subjek, merujuk secara puitis pada peristiwa lampau. Dalam konteks hukuman di Bilangan 16, 'terbelah' menyampaikan bahwa bumi terbuka secara alamiah dan hidup dalam bahasa Indonesia.
- source_word: אֶרֶץ
  choice: bumi
  rationale: Di sini kata ini menunjuk pada bumi atau tanah yang terbuka di bawah para pemberontak, bukan wilayah geografis. 'Bumi' mempertahankan bobot puitis ayat.
- source_word: וַתִּבְלַע
  choice: lalu menelan
  rationale: Wayyiqtol dari בלע yang melanjutkan rangkaian tindakan lampau. 'Menelan' merupakan padanan langsung dan alami; 'lalu' menandai urutan naratif tanpa memperberat kalimat.
- source_word: דָּתָן
  choice: Datan
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַתְּכַס עַל
  choice: dan menutupi
  rationale: Kata כסה berarti 'menutupi', sedangkan עַל menandai objek yang terkena penutupan. Dalam bahasa Indonesia, 'menutupi' sudah menyatakan relasi itu secara wajar tanpa preposisi tambahan.
- source_word: עֲדַת
  choice: kumpulan
  rationale: Bentuk konstruk dari עֵדָה menunjuk pada kelompok atau rombongan tertentu yang terkait dengan Abiram. 'Kumpulan' jelas bagi pembaca modern dan tidak memberi kesan gerejawi yang mungkin muncul dari 'jemaat'.
- source_word: אֲבִירָם
  choice: Abiram
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan ayat ini dengan kisah yang lebih lengkap dalam Bilangan 16
  choice: Menerjemahkan ringkasan puitis mazmur sebagaimana adanya, dengan hanya menyebut Datan dan kumpulan Abiram.
  alternative: Menambahkan keluarga mereka atau para pemberontak lain dari kisah Bilangan 16.
  rationale: Teks Ibrani ayat ini tidak memuat rincian tambahan tersebut. Terjemahan tidak boleh memasukkan unsur narasi lain ke dalam isi ayat, tetapi latar kisahnya dapat diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. 'Bumi terbelah' dipilih daripada ungkapan yang lebih datar 'bumi terbuka' karena sesuai dengan konteks, sementara 'kumpulan' menjaga makna kelompok tanpa konotasi gerejawi yang kuat. Setiap penanda catatan kaki dicantumkan dalam teks utama.
