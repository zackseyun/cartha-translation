lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: Berkali-kali
  rationale: Ungkapan ini menyatakan kejadian yang berulang banyak kali; “berkali-kali” alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: יַצִּילֵם
  choice: Ia membebaskan mereka
  rationale: Bentuk Hifil dari נצל berarti melepaskan, membebaskan, atau menyelamatkan dari bahaya. “Membebaskan” menyampaikan tindakan pertolongan konkret tanpa mempersempitnya menjadi istilah doktrinal tertentu.
- source_word: וְהֵמָּה
  choice: tetapi mereka
  rationale: Pronomina mandiri memberi penekanan dan, dalam konteks ini, pertentangan dengan tindakan Allah yang berulang kali membebaskan mereka.
- source_word: יַמְרוּ
  choice: mereka memberontak
  rationale: Verba מרה menyatakan perlawanan atau pemberontakan. Bentuk verbal dipertahankan secara wajar dalam bahasa Indonesia tanpa menentukan apakah yang terutama ditekankan adalah tindakan atau watak mereka.
- source_word: בַעֲצָתָם
  choice: menurut rencana mereka
  rationale: עֵצָה dapat berarti nasihat, pertimbangan, rencana, atau maksud. “Menurut rencana mereka” menghasilkan klausa Indonesia yang alami, sedangkan keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: וַיָּמֹכּוּ
  choice: dan terpuruk
  rationale: מוך menggambarkan menjadi rendah, merosot, ambruk, atau merana. “Terpuruk” mempertahankan gambaran kemerosotan tanpa menetapkan adanya pelaku luar.
- source_word: בַּעֲוֺנָם
  choice: karena kejahatan mereka
  rationale: עָוֹן dapat menunjuk pada kejahatan, kesalahan, rasa bersalah, atau akibat kesalahan. “Kejahatan” mempertahankan bobot moralnya, sementara “karena” menyampaikan hubungan sebab yang paling mungkin dalam konteks.
theological_decisions:
- issue: Pelaku pembebasan tidak disebutkan ulang dalam ayat
  choice: Pronomina “Ia” dipakai dan dikapitalisasi sebagai rujukan kontekstual kepada Allah.
  alternative: Mengulang “Allah” atau “TUHAN”.
  rationale: Teks Ibrani hanya memakai subjek orang ketiga maskulin tunggal; konteks mazmur mengidentifikasinya sebagai Allah. Pronomina mempertahankan kehematan teks tanpa menambahkan nama ilahi.
- issue: Hubungan antara kejahatan dan keterpurukan
  choice: Diterjemahkan “terpuruk karena kejahatan mereka”.
  alternative: “direndahkan oleh kejahatan mereka” atau “merana dalam kesalahan mereka”.
  rationale: Pilihan ini mempertahankan keterkaitan moral dan akibatnya, tetapi tidak menyatakan secara eksplisit apakah keterpurukan itu hukuman langsung, akibat alami, atau keduanya.
- issue: Nuansa עָוֹן
  choice: “kejahatan”
  alternative: “kesalahan”, “dosa”, atau “kesalahan beserta akibatnya”.
  rationale: “Kejahatan” cukup berbobot secara moral tanpa mengunci kata Ibrani itu pada rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Struktur puitis dua bagian dipertahankan, dengan kontras antara pembebasan Allah yang berulang dan pemberontakan manusia beserta akibatnya. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
