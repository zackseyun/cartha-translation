base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/018.yaml
  text: And fire burned among their company[c][b][a]; a flame consumed the wicked.
translation:
  language: id
  text: Api pun menyala[a] di tengah kumpulan mereka[b]; nyala api menghanguskan[c] orang-orang fasik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkobar”; kata kerja Ibrani dapat menekankan mulai berkobarnya api.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tengah jemaah mereka”; kata Ibrani menunjuk kepada kelompok atau umat yang berhimpun.
    reason: lexical_alternative
  - marker: c
    text: Atau “membakar habis”; kata kerjanya menggambarkan pembakaran yang hebat dan merusak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: pun menyala
  rationale: Kata kerja בער menyatakan api yang mulai atau sedang menyala. Partikel “pun” secara alami menandai kelanjutan rangkaian peristiwa yang ditunjukkan oleh bentuk naratif Ibrani.
- source_word: אֵשׁ
  choice: api
  rationale: Makna dasarnya adalah api; konteks tidak menuntut pemaknaan kiasan.
- source_word: בַּעֲדָתָם
  choice: di tengah kumpulan mereka
  rationale: עֵדָה menunjuk kepada kelompok yang berhimpun. Ungkapan ini mempertahankan nuansa kolektif sekaligus menyampaikan bahwa api muncul di dalam kelompok itu.
- source_word: לֶהָבָה
  choice: nyala api
  rationale: Padanan alami bagi nomina yang berarti nyala atau kobaran, serta mempertahankan kesejajaran puitis dengan “api” pada larik pertama.
- source_word: תְּלַהֵט
  choice: menghanguskan
  rationale: Bentuk intensif dari להט menggambarkan pembakaran yang hebat dan merusak. “Menghanguskan” mempertahankan daya ungkap itu tanpa harus menyatakan bahwa objek musnah sama sekali.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk substantival jamak ini mencirikan mereka secara moral sebagai orang fasik. Padanan tersebut tidak menambahkan penandaan gender.
theological_decisions:
- issue: Rujukan bahasa penghukuman
  choice: Ayat ini tetap menggambarkan penghukuman konkret melalui api atas orang-orang fasik di dalam kelompok pemberontak.
  alternative: Memahami api semata-mata sebagai kiasan umum tentang penghukuman.
  rationale: Konteks Mazmur 106 mengenang peristiwa penghukuman dalam sejarah Israel, dan bahasa Ibraninya memakai gambaran api secara konkret. Terjemahan tidak memperluasnya menjadi pernyataan doktrinal yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. “Kumpulan” dipilih agar mudah dipahami tanpa memberi istilah itu muatan kelembagaan atau denominasi; “orang-orang fasik” mempertahankan penilaian moral teks sumber.
