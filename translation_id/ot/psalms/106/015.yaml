  text: So he gave them what they asked for[c][b][a], but sent leanness into their soul.
translation:
  language: id
  text: Maka Ia memberikan kepada mereka apa yang mereka minta,[a] tetapi membuat mereka merana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “permintaan mereka.”'
    reason: lexical_alternative
  - marker: b
    text: 'Harfiah: “mengirimkan kekurusan ke dalam nefesh mereka.” Nefesh dapat berarti “jiwa,” “nyawa,” “kehidupan,” “diri,” atau keseluruhan keberadaan seseorang; “kekurusan” juga dapat berarti keadaan menyusut atau merana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia memberikan
  rationale: Bentuk verba dari נתן secara langsung berarti “memberikan.” “Mengabulkan” mungkin sesuai konteks, tetapi lebih interpretatif.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Menyatakan objek tak langsung dan dipertahankan secara alami dalam bahasa Indonesia.
- source_word: שֶׁאֱלָתָם
  choice: apa yang mereka minta
  rationale: שְׁאֵלָה dapat berarti “permintaan” atau “hal yang diminta.” Ungkapan ini jelas dan alami setelah verba “memberikan,” tanpa mengubahnya menjadi “keinginan.”
- source_word: וַיְשַׁלַּח
  choice: tetapi mendatangkan
  rationale: Secara harfiah berarti “dan mengirimkan.” Konjungsi “tetapi” menyatakan pertentangan yang tersirat antara pemberian dan hukuman, sedangkan “mendatangkan” lebih alami daripada “mengirimkan” untuk sesuatu yang menimpa manusia.
- source_word: רָזוֹן
  choice: kekurusan
  rationale: Kata ini menunjuk pada keadaan kurus, merana, atau susut. “Kekurusan” mempertahankan gambaran konkret dan tidak mempersempitnya menjadi diagnosis penyakit tertentu.
- source_word: בְּנַפְשָׁם
  choice: ke dalam jiwa mereka
  rationale: נֶפֶשׁ memiliki cakupan makna “jiwa, nyawa, diri, kehidupan.” Terjemahan utama mempertahankan ungkapan Ibrani dan kedalamannya, sementara catatan kaki menjelaskan keluasan maknanya.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks penghukuman
  choice: Memakai “jiwa” dalam teks utama
  alternative: “nyawa,” “kehidupan,” atau “diri”
  rationale: “Jiwa” merupakan padanan yang sah, tetapi pembaca modern dapat memahaminya hanya sebagai unsur nonjasmani. Karena teks Ibrani dapat menunjuk pada seluruh hidup atau diri seseorang, kemungkinan itu dipertahankan dalam catatan kaki tanpa menghapus ketegangan ungkapan utama.
- issue: Hubungan antara pemberian Allah dan akibat penghukuman
  choice: Menerjemahkan ו sebagai “tetapi”
  alternative: “dan”
  rationale: 'Bahasa Ibrani memakai penghubung umum “dan,” tetapi kedua klausa berlawanan secara kontekstual: permintaan mereka diberikan, namun kekurusan didatangkan. “Tetapi” mengungkapkan hubungan wacana itu tanpa menentukan lebih jauh bentuk hukumannya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami sambil mempertahankan gambaran “kekurusan” dan ungkapan “ke dalam jiwa mereka.” Kapitalisasi “Ia” dipakai untuk rujukan kepada Allah sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
