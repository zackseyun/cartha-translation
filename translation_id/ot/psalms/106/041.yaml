translation:
  language: id
  text: Ia menyerahkan mereka ke tangan bangsa-bangsa[a], dan orang-orang yang membenci mereka berkuasa atas mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “ke tangan” berarti ke dalam kuasa atau kendali bangsa-bangsa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: Ia menyerahkan mereka
  rationale: Bentuk נתן dengan objek jamak, dalam konstruksi ‘ke tangan’, menyatakan tindakan memberikan atau menyerahkan seseorang ke dalam kuasa pihak lain. ‘Menyerahkan’ alami dalam bahasa Indonesia dan tetap menyatakan tindakan aktif Allah tanpa memperlunaknya menjadi sekadar izin.
- source_word: בְּיַד
  choice: ke tangan
  rationale: Ungkapan Ibrani ini merupakan metafora bagi kuasa atau kendali. Metafora ‘tangan’ tetap mudah dipahami dalam bahasa Indonesia dan mempertahankan corak teks sumber.
- source_word: גּוֹיִם
  choice: bangsa-bangsa lain
  rationale: Dalam konteks sejarah Israel, kata ini menunjuk pada bangsa-bangsa di luar Israel. ‘Bangsa-bangsa lain’ lebih alami dan kurang sarat tradisi teologis daripada ‘orang-orang bukan Yahudi’.
- source_word: וַיִּמְשְׁלוּ בָהֶם
  choice: berkuasa atas mereka
  rationale: Kata משל dengan preposisi ב berarti memerintah atau berkuasa atas seseorang. ‘Berkuasa atas’ menyampaikan pemerintahan yang menindas dalam konteks ini tanpa menambahkan intensitas yang tidak dinyatakan.
- source_word: שֹׂנְאֵיהֶם
  choice: orang-orang yang membenci mereka
  rationale: Partisip ini secara langsung menunjuk kepada pihak-pihak yang membenci mereka. Pilihan ini mempertahankan tindakan membenci, sedangkan ‘musuh-musuh mereka’ akan lebih umum.
theological_decisions:
- issue: Peran aktif Allah dalam penghukuman Israel
  choice: Ayat ini menyatakan bahwa Allah menyerahkan Israel ke dalam kuasa bangsa-bangsa lain.
  alternative: Menerjemahkannya seolah-olah Allah hanya membiarkan atau mengizinkan hal itu terjadi.
  rationale: Kata kerja נתן dengan Allah sebagai subjek tersirat secara langsung mengaitkan tindakan tersebut dengan-Nya. Terjemahan mempertahankan ketegangan teologis ini tanpa memperlunak atau mengembangkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel ayat dipertahankan, sedangkan ungkapan ‘ke tangan’ dijelaskan agar metafora Ibraninya tetap hadir dan mudah dimengerti.
