id: PSA.106.7
reference: Psalms 106:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: id
  text: Nenek moyang kami di Mesir tidak memahami perbuatan-perbuatan-Mu yang ajaib; mereka tidak mengingat betapa berlimpahnya kasih setia-Mu, tetapi memberontak di tepi laut, di Laut Teberau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional disebut “Laut Merah.” Nama Ibraninya, Yam Suf, dapat diterjemahkan “Laut Teberau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: Nenek moyang kami
  rationale: Secara harfiah berarti “bapak-bapak kami,” tetapi dalam konteks ini menunjuk kepada generasi-generasi Israel terdahulu; “nenek moyang kami” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan hubungan kekeluargaan.
- source_word: הִשְׂכִּילוּ
  choice: tidak memahami
  rationale: Bentuk Hifil dari שׂכל menyatakan kegagalan memperoleh pengertian atau menangkap makna tindakan Allah; “tidak memahami” menyampaikannya secara jelas tanpa menambah tafsiran.
- source_word: נִפְלְאוֹתֶיךָ
  choice: perbuatan-perbuatan-Mu yang ajaib
  rationale: Kata benda ini menunjuk kepada tindakan luar biasa yang menimbulkan kekaguman, bukan sekadar hal abstrak.
- source_word: רֹב חֲסָדֶיךָ
  choice: betapa berlimpahnya kasih setia-Mu
  rationale: רֹב menyatakan kelimpahan, sedangkan חֶסֶד mencakup kasih, kesetiaan, dan kemurahan dalam relasi perjanjian; susunan ini alami dalam bahasa Indonesia.
- source_word: וַיַּמְרוּ
  choice: tetapi memberontak
  rationale: מרה berarti memberontak atau bersikap durhaka; “tetapi” mengungkapkan pertentangan kontekstual dengan karya dan kasih setia Allah.
- source_word: עַל־יָם בְּיַם־סוּף
  choice: di tepi laut, di Laut Teberau
  rationale: Kedua frasa tempat itu dipertahankan, dengan frasa kedua menjelaskan laut yang dimaksud. “Laut Teberau” mencerminkan unsur סוּף dan merupakan nama yang dapat dipahami dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna חֶסֶד
  choice: kasih setia
  alternative: belas kasihan; kasih perjanjian; kemurahan
  rationale: “Kasih setia” mempertahankan perpaduan kasih dan loyalitas yang terkandung dalam istilah Ibrani tanpa mempersempitnya hanya menjadi belas kasihan.
- issue: Nama tempat יַם־סוּף
  choice: Laut Teberau
  alternative: Laut Merah
  rationale: “Laut Teberau” lebih dekat kepada bentuk leksikal Ibrani סוּף, sedangkan nama tradisional “Laut Merah” dicatat dalam catatan kaki agar hubungan dengan sebutan yang dikenal luas tetap jelas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang bermartabat. Sapaan kepada Allah memakai kapital hormat. Pengulangan dua keterangan tempat dipertahankan karena terdapat dalam teks Ibrani dan memberi penegasan serta penjelasan.
