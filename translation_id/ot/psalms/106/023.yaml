  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: id
  text: Maka Ia berfirman bahwa Ia akan membinasakan mereka—sekiranya Musa, orang pilihan-Nya, tidak berdiri di celah[a] di hadapan-Nya untuk menyurutkan murka-Nya, sehingga Ia tidak membinasakan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tempat yang jebol.” Gambaran Ibraninya ialah seseorang yang mengambil posisi pada celah dalam tembok pertahanan; di sini ungkapan itu menggambarkan perantaraan Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Maka Ia berkata
  rationale: Waw-konsekutif melanjutkan alur sekaligus menghubungkannya dengan penyebab sebelumnya; “Maka” menyampaikan hubungan itu secara wajar.
- source_word: לְהַשְׁמִידָם
  choice: bahwa Ia akan memusnahkan mereka
  rationale: Infinitif berawalan ל setelah verba “berkata” menyatakan tindakan yang diniatkan. “Memusnahkan” cukup kuat bagi השמיד tanpa harus secara eksplisit menyatakan pemusnahan ontologis.
- source_word: לוּלֵי
  choice: seandainya ... tidak
  rationale: 'Bentuk ini mempertahankan kondisi kontrafaktual: kehancuran akan terjadi jika Musa tidak bertindak.'
- source_word: בְחִירוֹ
  choice: orang pilihan-Nya
  rationale: Menunjukkan bahwa Musa dipilih Allah, tanpa memasukkan muatan doktrinal tambahan dari istilah teknis tertentu.
- source_word: עָמַד בַּפֶּרֶץ
  choice: berdiri di tempat tembok yang jebol
  rationale: Mempertahankan gambaran konkret seseorang yang mengambil posisi pada bagian pertahanan yang terbuka, sambil membuat citranya dapat dipahami pembaca Indonesia.
- source_word: לְפָנָיו
  choice: di hadapan-Nya
  rationale: Akhiran pronominal paling wajar merujuk kepada Allah dan menggambarkan Musa menghadap Allah dalam tindakan perantaraan.
- source_word: לְהָשִׁיב חֲמָתוֹ
  choice: untuk menyurutkan murka-Nya
  rationale: Hifil שוב berarti membuat berbalik atau surut. “Menyurutkan” alami dalam bahasa Indonesia dan tetap mempertahankan gerak metaforis murka yang ditahan kembali.
- source_word: מֵהַשְׁחִית
  choice: agar Ia tidak membinasakan mereka
  rationale: מִן dengan infinitif menyatakan pencegahan. Klausa Indonesia ini memperjelas bahwa murka Allah dicegah dari pelaksanaan pembinasaan; objek “mereka” tersirat dalam konteks dan diungkapkan demi kejelasan.
theological_decisions:
- issue: Bahasa antropopatik tentang murka ilahi
  choice: murka-Nya
  alternative: amarah-Nya; hukuman-Nya
  rationale: Teks secara langsung menyebut חֵמָה milik Allah. “Murka-Nya” mempertahankan bobot dan ketegangan teologisnya tanpa mengubahnya menjadi abstraksi berupa hukuman.
- issue: Gambaran Musa berdiri pada bagian tembok yang jebol
  choice: mempertahankan metafora dalam teks utama
  alternative: menjadi perantara; berdiri di celah
  rationale: Gambaran konkret itu menampilkan Musa sebagai perantara yang menghalangi datangnya kebinasaan. Terjemahan tidak menggantinya hanya dengan penjelasan teologis.
- issue: Perubahan dari niat membinasakan menjadi murka yang disurutkan
  choice: mempertahankan urutan dan ketegangan narasi sebagaimana dinyatakan
  alternative: menjelaskannya sebagai ungkapan kiasan atau keputusan bersyarat
  rationale: Ayat menggambarkan Allah berkata akan memusnahkan, lalu murka-Nya disurutkan melalui tindakan Musa. Terjemahan tidak menentukan lebih jauh bagaimana relasi antara maksud, murka, dan perantaraan itu harus disistematisasikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada Allah dipakai sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Metafora Ibrani dipertahankan dan dijelaskan singkat dalam catatan kaki.
