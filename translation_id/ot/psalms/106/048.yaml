id: PSA.106.48
reference: Psalms 106:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן הָ֤/עוֹלָ֨ם וְ/עַ֬ד הָ/עוֹלָ֗ם וְ/אָמַ֖ר כָּל הָ/עָ֥ם אָמֵ֗ן הַֽלְלוּ יָֽהּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: id
  text: 'Terpujilah Yahweh, Allah Israel,

    dari selama-lamanya sampai selama-lamanya.[a]

    Biarlah seluruh umat berkata, “Amin!”

    Pujilah Yah![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari kekekalan sampai kekekalan” atau “dari zaman ke zaman.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini secara tradisional dialihaksarakan sebagai “Haleluya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Partisipel pasif ini membentuk formula pujian atau doksologi. “Terpujilah” mempertahankan daya liturgisnya dan terdengar wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditampilkan sebagai nama diri, bukan diganti dengan gelar, sehingga berbeda dari bentuk pendek יָהּ pada akhir ayat.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi Ibrani ini secara langsung menunjuk kepada Allah yang disembah Israel; bentuk tanpa kata depan paling ringkas dan alami dalam konteks doksologi.
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: dari selama-lamanya sampai selama-lamanya
  rationale: Ungkapan ini menggambarkan rentang waktu yang tidak berbatas. Terjemahan tersebut mempertahankan pengulangan עוֹלָם dan pola “dari ... sampai ...” dalam teks sumber.
- source_word: וְאָמַר
  choice: Biarlah ... berkata
  rationale: Walaupun bentuknya secara morfologis adalah qatal, dalam formula liturgis ini kata tersebut berfungsi sebagai ajakan agar umat memberikan tanggapan.
- source_word: כָּל הָעָם
  choice: seluruh umat
  rationale: Dalam konteks ibadah bersama, עָם menunjuk kepada komunitas yang berhimpun. “Seluruh umat” lebih alami daripada “semua rakyat” dan tetap mempertahankan makna kolektif.
- source_word: אָמֵן
  choice: Amin
  rationale: Bentuk liturgis yang sudah baku dalam bahasa Indonesia dan mempertahankan fungsi jawaban persetujuan umat.
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah
  rationale: Imperatif jamak הַלְלוּ diterjemahkan sebagai ajakan “Pujilah”, sedangkan nama ilahi pendek יָהּ dipertahankan sebagai “Yah”, sehingga makna ungkapan dan perbedaannya dari יְהוָה tetap terlihat.
theological_decisions:
- issue: Pembedaan nama ilahi יְהוָה dan bentuk pendek יָהּ dalam ayat yang sama
  choice: Menerjemahkan יְהוָה sebagai “Yahweh” dan יָהּ sebagai “Yah”
  alternative: Mengganti keduanya dengan “TUHAN”, atau mengalihaksarakan הַלְלוּ יָהּ seluruhnya sebagai “Haleluya”
  rationale: Teks sengaja memakai bentuk penuh dan bentuk pendek nama ilahi. Mempertahankan “Yahweh” dan “Yah” menampilkan perbedaan leksikal itu tanpa menggantinya dengan gelar.
- issue: Nilai wacana וְאָמַר
  choice: 'Memahaminya sebagai ajakan liturgis: “Biarlah ... berkata”'
  alternative: Menerjemahkannya secara indikatif sebagai “seluruh umat berkata” atau “telah berkata”
  rationale: Dalam penutup doksologis ini, konteks mendukung respons yang diharapkan dari umat. Terjemahan ajakan mempertahankan fungsi liturgis tanpa mengubahnya menjadi laporan peristiwa lampau.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan baris mempertahankan gerak doksologi dan jawaban umat. “Umat” dipilih karena konteksnya liturgis; “Amin” memakai bentuk baku bahasa Indonesia.
