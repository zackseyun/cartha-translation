  text: וַ/יִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם בְּנֵ֘י/הֶ֤ם וּֽ/בְנוֹתֵי/הֶ֗ם אֲשֶׁ֣ר זִ֭בְּחוּ לַ/עֲצַבֵּ֣י כְנָ֑עַן וַ/תֶּחֱנַ֥ף הָ֝/אָ֗רֶץ בַּ/דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: id
  text: Mereka menumpahkan darah orang yang tidak bersalah—darah putra-putri mereka, yang mereka korbankan kepada berhala-berhala Kanaan—dan negeri itu tercemar oleh darah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “negeri itu tercemar karena utang darah.” Bahasa Ibrani memakai bentuk jamak harfiah “darah-darah”, yang dapat menunjuk pada pertumpahan darah atau utang darah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: menumpahkan
  rationale: Kata שׁפך secara konkret berarti 'menuangkan/menumpahkan' dan lazim dipakai untuk tindakan menumpahkan darah; padanan ini mempertahankan gambaran Ibraninya sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: דָם נָקִי
  choice: darah orang yang tidak bersalah
  rationale: Ungkapan ini menyatakan darah yang ditumpahkan secara tidak adil. Bentuk Indonesia ini mempertahankan penilaian moral teks dan lebih jelas daripada 'darah tidak bersalah'.
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: darah anak-anak lelaki dan perempuan mereka
  rationale: Pengulangan דם menjelaskan darah siapa yang disebut tidak bersalah, dan struktur ini mempertahankan penegasan tersebut.
- source_word: אֲשֶׁר זִבְּחוּ
  choice: yang mereka persembahkan sebagai kurban
  rationale: Dalam konteks pemujaan, זבח berarti mempersembahkan sebagai kurban. Frasa ini mempertahankan makna kultis tanpa mengaburkan bahwa anak-anak itu dibunuh.
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: kepada berhala-berhala Kanaan
  rationale: עֲצַבִּים menunjuk pada patung atau berhala dengan nada kecaman; 'berhala-berhala' menyampaikan daya polemis tersebut secara wajar.
- source_word: וַתֶּחֱנַף
  choice: menjadi najis
  rationale: Dalam konteks ini חנף menggambarkan pencemaran moral dan keagamaan negeri akibat darah yang ditumpahkan. 'Menjadi najis' mempertahankan bobot kultis-moralnya.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Konteks menunjuk pada wilayah Kanaan, bukan seluruh bumi; 'negeri itu' merupakan padanan kontekstual yang alami.
- source_word: בַּדָּמִים
  choice: karena pertumpahan darah
  rationale: Bentuk jamak harfiah 'darah-darah' dapat menyatakan pertumpahan darah atau utang darah. Padanan utama ini alami dalam bahasa Indonesia, sedangkan kemungkinan 'utang darah' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Status moral para korban dalam pengurbanan anak
  choice: Korban secara tegas disebut orang yang tidak bersalah.
  alternative: darah yang tidak bersalah
  rationale: Terjemahan mempertahankan penilaian moral eksplisit דָם נָקִי tanpa menambahkan penjelasan doktrinal.
- issue: Sifat kenajisan negeri
  choice: Negeri menjadi najis karena pertumpahan darah.
  alternative: Negeri menjadi najis karena utang darah.
  rationale: Bentuk jamak דָּמִים dapat menunjuk baik pada pertumpahan darah maupun tanggungan kesalahan akibat darah. Teks utama memakai ungkapan Indonesia yang paling alami, sementara ambiguitas yang bermakna dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Tanda pisah mempertahankan penjelasan berlapis dalam bahasa Ibrani, sedangkan 'sehingga' menyampaikan kelanjutan akibat tanpa memperlemah hubungan antarklausa.
