  text: They joined themselves to Baal of Peor and ate sacrifices of the dead[a][b].
translation:
  language: id
  text: Mereka mengikatkan diri kepada Baal-Peor[a] dan memakan kurban-kurban bagi yang mati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melekatkan diri kepada Baal-Peor.”'
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani ini dapat merujuk pada kurban bagi berhala yang tidak bernyawa atau pada upacara yang berkaitan dengan orang mati.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: mengikatkan diri
  rationale: Bentuk ini menyampaikan tindakan melekatkan atau menggabungkan diri secara erat, sekaligus mempertahankan nuansa refleksif verba Ibrani.
- source_word: לְבַעַל פְּעוֹר
  choice: kepada Baal-Peor
  rationale: Baal-Peor dipertahankan sebagai nama dewa yang berkaitan dengan Peor; bentuk berhubung mempertahankan nama tradisional secara ringkas dan jelas.
- source_word: וַיֹּאכְלוּ
  choice: dan memakan
  rationale: Pilihan langsung dan wajar untuk tindakan makan dalam rangkaian narasi.
- source_word: זִבְחֵי
  choice: kurban-kurban
  rationale: Kata ini menunjuk kepada persembahan sembelihan atau kurban; 'kurban-kurban' alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi jamuan ritual.
- source_word: מֵתִים
  choice: orang mati
  rationale: Ungkapan ini mempertahankan arti harfiah 'yang mati' dan tidak menentukan apakah yang dimaksud adalah manusia yang telah meninggal atau sebutan polemis bagi berhala/dewa yang tak bernyawa.
theological_decisions:
- issue: Rujukan מֵתִים dalam frasa זִבְחֵי מֵתִים
  choice: orang mati
  alternative: berhala yang tidak bernyawa; dewa-dewa mati; orang-orang yang telah meninggal
  rationale: Teks Ibrani tidak menentukan rujukannya secara tegas. Terjemahan utama mempertahankan ketegangan antara kurban yang berkaitan dengan orang mati dan gambaran polemis tentang ilah yang tidak bernyawa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Mengikatkan diri' mempertahankan citra keterikatan erat; 'orang mati' sengaja dibiarkan luas agar ambiguitas sumber tidak diselesaikan secara sepihak.
