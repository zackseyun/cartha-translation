  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: id
  text: Hal itu diperhitungkan kepadanya[a] sebagai kebenaran dari generasi ke generasi untuk selama-lamanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dianggap” atau “dinilai”. Bahasa Ibrani memakai ungkapan baku untuk sesuatu yang dipandang atau diperhitungkan sebagai kebenaran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagi generasi dan generasi”, suatu ungkapan yang berarti sepanjang semua generasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: diperhitungkan
  rationale: Bentuk Nifal menyatakan bahwa hal itu dianggap atau dinilai sebagai sesuatu. “Diperhitungkan” mempertahankan nuansa pengakuan atau penilaian dalam ungkapan Ibrani tanpa mempersempitnya menjadi transaksi keuangan.
- source_word: לוֹ
  choice: baginya
  rationale: Preposisi ל dengan sufiks pronominal menunjuk kepada orang yang menerima penilaian tersebut. “Baginya” alami dalam bahasa Indonesia dan cocok dengan konstruksi “diperhitungkan ... sebagai”.
- source_word: לִצְדָקָה
  choice: sebagai kebenaran
  rationale: Kata צְדָקָה berarti “kebenaran” atau “keadilan.” Dalam idiom חשב + ל, “sebagai kebenaran” mempertahankan bahasa penilaian dan tidak mempersempit maknanya menjadi sekadar satu perbuatan benar.
- source_word: לְדֹר וָדֹר
  choice: dari generasi ke generasi
  rationale: Ungkapan harfiahnya “bagi generasi dan generasi” menunjuk pada kesinambungan sepanjang generasi-generasi berturut-turut. “Dari generasi ke generasi” adalah padanan Indonesia yang jelas dan wajar.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan tanpa batas. “Untuk selama-lamanya” alami, bermartabat, dan mempertahankan penegasan puitis sesudah frasa tentang generasi.
theological_decisions:
- issue: Hubungan dengan Kejadian 15:6 dan makna teologis kebenaran yang diperhitungkan
  choice: Mempertahankan ungkapan “diperhitungkan baginya sebagai kebenaran” tanpa menambahkan penjelasan doktrinal kemudian.
  alternative: Menerjemahkannya sebagai “dianggap sebagai perbuatan benar” atau “dikreditkan kepadanya untuk kebenaran.”
  rationale: Ayat ini memakai idiom Alkitab tentang kebenaran yang diperhitungkan dan menggemakan bahasa Kejadian 15:6. Terjemahan mempertahankan resonansi itu sambil tidak menentukan apakah yang dimaksud terutama status, penilaian, atau perbuatan benar.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan idiom teologis Ibrani serta pengulangan puitis antara kesinambungan generasi dan “selama-lamanya”.
