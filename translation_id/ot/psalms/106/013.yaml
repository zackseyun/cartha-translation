  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִֽ֭הֲרוּ שָׁכְח֣וּ מַעֲשָׂ֑י/ו לֹֽא חִ֝כּ֗וּ לַ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/013.yaml
  text: They quickly forgot his works[a]; they did not wait for his counsel.
translation:
  language: id
  text: Mereka cepat melupakan perbuatan-perbuatan-Nya; mereka tidak menantikan nasihat-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rencana-Nya” atau “maksud-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהֲרוּ
  choice: cepat
  rationale: Bentuk dari מהר menyatakan kecepatan atau ketergesa-gesaan. Dalam bahasa Indonesia, “cepat melupakan” menyampaikan makna adverbialnya secara alami tanpa menguranginya menjadi sekadar urutan waktu seperti yang mungkin tersirat oleh “segera”.
- source_word: שָׁכְחוּ
  choice: melupakan
  rationale: Qal perfek orang ketiga jamak dari שכח berarti “melupakan”; bentuk lampau dipahami dari konteks naratif bahasa Indonesia.
- source_word: מַעֲשָׂיו
  choice: perbuatan-perbuatan-Nya
  rationale: מַעֲשֶׂה menunjuk pada perbuatan atau karya. Bentuk ulang mempertahankan pengertian jamak dan merujuk pada tindakan-tindakan Allah yang telah disaksikan Israel.
- source_word: לֹא
  choice: tidak
  rationale: Padanan negasi langsung dan alami dalam bahasa Indonesia.
- source_word: חִכּוּ
  choice: menantikan
  rationale: Bentuk dari חכה berarti menunggu atau menantikan. “Menantikan” cocok dengan objek berupa nasihat atau arahan yang berasal dari Allah.
- source_word: לַעֲצָתוֹ
  choice: nasihat-Nya
  rationale: עֵצָה dapat berarti nasihat, pertimbangan, rencana, atau maksud. “Nasihat-Nya” mempertahankan nuansa arahan yang bersifat relasional tanpa mempersempitnya menjadi ketetapan atau rencana ilahi saja.
theological_decisions:
- issue: Makna עֵצָה Allah dalam konteks ini
  choice: nasihat-Nya
  alternative: rencana-Nya atau maksud-Nya
  rationale: Pilihan ini menegaskan kegagalan Israel menunggu arahan Allah setelah menyaksikan perbuatan-Nya, tetapi tidak mengunci istilah itu pada konsep teologis yang lebih sempit tentang ketetapan ilahi. Alternatif leksikal dicatat untuk mempertahankan keluasan makna sumber.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis. Sapaan ilahi memakai akhiran hormat “-Nya”. Penanda catatan kaki ditempatkan sesudah istilah yang diterangkannya, yaitu “nasihat-Nya”.
