  source_fidelity: Teks Indonesia dengan tepat menerjemahkan מִהֲרוּ שָׁכְחוּ sebagai “cepat melupakan,” mempertahankan subjek jamak, dan menyampaikan verba perfek Ibrani dengan idiom Indonesia yang tidak perlu menandai kala secara eksplisit. “Perbuatan-perbuatan-Nya” secara memadai mencerminkan מַעֲשָׂיו, dan “mereka tidak menantikan nasihat-Nya” setia pada לֹא חִכּוּ לַעֲצָתוֹ.
