  text: וַ֭/יַּרְא בַּ/צַּ֣ר לָ/הֶ֑ם בְּ֝/שָׁמְע֗/וֹ אֶת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/044.yaml
  text: Yet he saw their distress when he heard their cry,[a]
translation:
  language: id
  text: Namun, Ia melihat kesesakan mereka ketika Ia mendengar seruan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan Ia melihat kesesakan yang menimpa mereka ketika Ia mendengar seruan mereka.”
    reason: Alternatif ini mempertahankan susunan בַּצַּר לָהֶם secara lebih eksplisit dan menerjemahkan waw sebagai penghubung sederhana.
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ia melihat
  rationale: Bentuk naratif dari ראה paling langsung berarti “melihat”; dalam konteks ini ungkapan tersebut juga menyiratkan bahwa Allah memperhatikan keadaan mereka.
- source_word: בַּצַּר לָהֶם
  choice: kesesakan mereka
  rationale: צַר menunjuk pada kesesakan atau keadaan terimpit, sedangkan לָהֶם secara idiomatis dapat diungkapkan sebagai bentuk posesif “mereka” dalam bahasa Indonesia.
- source_word: בְּשָׁמְעוֹ
  choice: ketika Ia mendengar
  rationale: 'Preposisi ב dengan infinitif konstruk di sini paling wajar dipahami secara temporal: “ketika Ia mendengar”.'
- source_word: רִנָּתָם
  choice: seruan mereka
  rationale: רִנָּה dapat berarti pekik atau seruan; dalam konteks kesesakan, “seruan” menyampaikan permohonan mendesak tanpa menyiratkan sukacita.
- source_word: וַ
  choice: Namun
  rationale: Walaupun secara formal dapat diterjemahkan “dan”, alur mazmur memberi kontras antara pemberontakan serta penindasan sebelumnya dan perhatian Allah yang penuh belas kasihan.
theological_decisions:
- issue: Daya wacana kata penghubung pembuka dalam konteks belas kasihan setelah penghukuman
  choice: Nuansa adversatif diterjemahkan “Namun”
  alternative: “Dan” atau “Lalu”
  rationale: Kata waw dapat berfungsi sebagai penghubung sederhana, tetapi konteks menonjolkan tanggapan Allah yang penuh belas kasihan meskipun umat sebelumnya memberontak. “Namun” menjaga ketegangan antara penghukuman dan belas kasihan tanpa menambahkan gagasan baru.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya khidmat dan mudah dipahami. Pronomina “Ia” dipakai untuk Allah sesuai kebiasaan penulisan religius Indonesia; “kesesakan” mempertahankan bobot puitis mazmur tanpa menjadi terlalu arkais.
