  yaml_path: translation/ot/psalms/106/027.yaml
  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: id
  text: dan menjatuhkan keturunan mereka di antara bangsa-bangsa,[a] serta menyerakkan mereka di berbagai negeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benih mereka.” “Menjatuhkan” juga dapat berarti “merobohkan”; dalam konteks tertentu, verba ini dapat menunjuk pada kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: dan membuat ... jatuh
  rationale: Bentuk infinitif kausatif (Hifil) dari נפל berarti ‘menyebabkan jatuh’. Ungkapan ini mempertahankan cakupan makna Ibrani tanpa mempersempitnya menjadi kematian atau kekalahan militer.
- source_word: זַרְעָם
  choice: keturunan mereka
  rationale: זֶרַע secara harfiah berarti ‘benih’, tetapi dalam konteks ini menunjuk kepada anak cucu atau keturunan. ‘Keturunan’ alami dan jelas dalam bahasa Indonesia modern.
- source_word: בַּגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם menunjuk kepada bangsa-bangsa asing tempat keturunan Israel mengalami penghukuman. ‘Bangsa-bangsa’ tidak memasukkan konotasi keagamaan yang tidak dituntut oleh teks.
- source_word: וּלְזָרוֹתָם
  choice: serta menyerakkan mereka
  rationale: זרה dapat berarti ‘menampi’ atau ‘menyerakkan’. Dalam kesejajaran dengan penghukuman dan penyebaran ke banyak negeri, ‘menyerakkan’ paling tepat dan tetap mempertahankan citra penyebaran.
- source_word: בָּאֲרָצוֹת
  choice: di berbagai negeri
  rationale: Bentuk jamak אֲרָצוֹת menunjuk kepada banyak negeri atau wilayah. ‘Di berbagai negeri’ mengungkapkan lokasi penyebaran secara alami tanpa mengubahnya menjadi tujuan gerak yang eksplisit.
theological_decisions:
- issue: Sifat penghukuman yang dinyatakan oleh ‘membuat ... jatuh’
  choice: Mempertahankan ungkapan umum ‘membuat keturunan mereka jatuh’, yang dapat mencakup keruntuhan atau kebinasaan dalam penghukuman dan pembuangan.
  alternative: Menerjemahkannya secara lebih khusus sebagai ‘membinasakan keturunan mereka’ atau ‘menewaskan keturunan mereka’.
  rationale: Kausatif נפל lebih luas daripada kematian fisik. Kesejajarannya dengan penyerakan mendukung konteks penghukuman dan pembuangan, tetapi tidak mengharuskan terjemahan mempersempit maknanya menjadi kematian.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan paralel Ibrani dipertahankan, sementara ‘serta’ memperjelas hubungan dua tindakan tanpa menambah hubungan sebab-akibat.
