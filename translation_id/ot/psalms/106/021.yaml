id: PSA.106.21
reference: Psalms 106:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׁ֭כְחוּ אֵ֣ל מוֹשִׁיעָ֑/ם עֹשֶׂ֖ה גְדֹל֣וֹת בְּ/מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: id
  text: Mereka melupakan Allah, Penyelamat mereka[a], yang telah melakukan perbuatan-perbuatan besar di Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pembebas mereka.” Bentuk partisipel Ibrani dapat menekankan Allah sebagai Dia yang menyelamatkan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: mereka melupakan
  rationale: Bentuk Qal perfektif orang ketiga jamak menuturkan tindakan lampau dalam rangkaian sejarah mazmur. 'Melupakan' alami dalam bahasa Indonesia dan menyatakan bahwa mereka tidak lagi mengingat serta mengindahkan Allah.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל berfungsi sebagai sebutan bagi Allah Israel. 'Allah' merupakan padanan baku dan alami tanpa menambahkan penekanan khusus pada makna 'Yang Mahakuasa' yang tidak ditonjolkan konteks.
- source_word: מוֹשִׁיעָם
  choice: Penyelamat mereka
  rationale: Partisipel Hifil dari ישׁע dengan sufiks orang ketiga jamak berarti 'yang menyelamatkan mereka' atau 'penyelamat mereka'. Frasa ini ringkas, wajar, dan mempertahankan peran Allah sebagai pihak yang menyelamatkan.
- source_word: עֹשֶׂה
  choice: yang telah melakukan
  rationale: Partisipel Qal ini menerangkan Allah. Klausa relatif diperlukan dalam bahasa Indonesia; 'telah melakukan' menunjukkan bahwa karya-karya itu mendahului tindakan mereka melupakan Allah.
- source_word: גְדֹלוֹת
  choice: perbuatan-perbuatan besar
  rationale: Bentuk jamak substantival dari גדול menunjuk pada tindakan-tindakan besar. 'Perbuatan-perbuatan besar' lebih jelas dalam bahasa Indonesia daripada sekadar 'hal-hal besar' dan tetap tidak membatasi jenis karya tersebut.
- source_word: בְּמִצְרָיִם
  choice: di Mesir
  rationale: Preposisi בְּ menyatakan lokasi; 'di Mesir' adalah padanan langsung dan alami.
theological_decisions:
- issue: Makna gelar אֵל bagi Allah Israel
  choice: Allah
  alternative: Yang Mahakuasa; Allah Yang Mahakuasa
  rationale: Ayat ini terutama mengidentifikasi siapa yang dilupakan Israel, bukan secara khusus mengembangkan gelar tentang kuasa ilahi. 'Allah' menjaga rujukan itu tanpa menambahkan penekanan teologis yang tidak diwajibkan konteks.
- issue: Nuansa partisipel מוֹשִׁיעָם
  choice: Penyelamat mereka
  alternative: Dia yang menyelamatkan mereka; Pembebas mereka
  rationale: Pilihan ini mempertahankan gambaran Allah dalam peran khas sebagai pihak yang menyelamatkan mereka. Catatan kaki menjaga kemungkinan nuansa pembebasan tanpa mempersempit makna utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Penyelamat' dipakai sebagai sebutan bagi Allah. Pengulangan 'perbuatan-perbuatan' memperjelas bentuk jamak sumber tanpa memakai ungkapan yang terlalu teknis.
