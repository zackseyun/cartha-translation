base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/045.yaml
  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
translation:
  language: id
  text: Ia mengingat perjanjian-Nya demi mereka, lalu mengurungkan niat-Nya[a] sesuai dengan kasih setia-Nya yang berlimpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berubah pikiran” atau “tergerak oleh belas kasihan.” Kata kerja Ibrani ini dapat menyatakan tindakan mengurungkan niat atau rasa iba yang menggerakkan hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Ia mengingat
  rationale: Dalam konteks perjanjian, זכר menunjuk bukan sekadar pada ingatan batin, melainkan pada mengingat dengan bertindak berdasarkan komitmen terdahulu. 'Mengingat' tetap transparan dan mempertahankan gema perjanjian itu.
- source_word: לָהֶם
  choice: demi mereka
  rationale: Preposisi ל dengan akhiran pronominal di sini menyatakan bahwa tindakan mengingat perjanjian itu berkenaan dengan dan membawa manfaat bagi umat. 'Demi mereka' menyampaikan hubungan tersebut secara alami.
- source_word: בְּרִיתוֹ
  choice: perjanjian-Nya
  rationale: בְּרִית adalah istilah baku untuk ikatan perjanjian; pilihan ini mempertahankan bobot relasional dan teologisnya.
- source_word: וַיִּנָּחֵם
  choice: lalu mengurungkan niat-Nya
  rationale: Bentuk Nifal dari נחם dapat berarti mengurungkan tindakan, berubah pikiran, atau tergerak oleh belas kasihan. Dalam konteks ini, 'mengurungkan niat-Nya' menyatakan perubahan nyata dalam tindakan Allah tanpa menyiratkan bahwa Ia sebelumnya keliru; kemungkinan makna lainnya dipertahankan dalam catatan kaki.
- source_word: כְּרֹב
  choice: sesuai dengan ... yang berlimpah
  rationale: Gabungan כ dengan רֹב menyatakan ukuran atau kesesuaian. Susunan ini menyampaikan makna tersebut dalam bahasa Indonesia yang alami.
- source_word: חסדו
  choice: kasih setia-Nya
  rationale: חסד mencakup kasih yang penuh anugerah sekaligus kesetiaan dalam hubungan perjanjian. 'Kasih setia' merupakan padanan Indonesia yang ringkas dan mapan untuk kedua unsur itu.
theological_decisions:
- issue: Bahasa antropopatik tentang Allah dalam וַיִּנָּחֵם
  choice: mengurungkan niat-Nya
  alternative: berubah pikiran atau tergerak oleh belas kasihan
  rationale: Terjemahan ini mempertahankan pernyataan teks tentang perubahan nyata dalam cara Allah bertindak terhadap umat, tetapi tidak menambahkan kesan bahwa Allah baru memperoleh informasi atau sebelumnya telah berbuat salah. Catatan kaki mempertahankan keluasan dan ketegangan makna verba Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Demi mereka' dan 'sesuai dengan kasih setia-Nya yang berlimpah' dipilih agar alami bagi pembaca umum tanpa menghilangkan hubungan sintaksis dan nuansa perjanjian dalam teks Ibrani.
