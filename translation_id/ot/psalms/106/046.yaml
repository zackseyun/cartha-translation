  text: He caused them to receive compassion before all who had taken them captive.
translation:
  language: id
  text: Ia membuat mereka mendapat belas kasihan di hadapan semua orang yang menawan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן אוֹתָם לְרַחֲמִים
  choice: Ia membuat mereka mendapat belas kasihan
  rationale: Secara harfiah konstruksi ini berarti ‘Ia memberikan mereka kepada/untuk belas kasihan’. Ungkapan Indonesia ini menyampaikan bahwa Allah menyebabkan para tawanan diperlakukan dengan belas kasihan, tanpa menjadikan para tawanan sebagai pelaku yang mencari belas kasihan.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mempertahankan citra relasional Ibrani dan menunjukkan bahwa belas kasihan itu timbul dalam sikap para penawan terhadap mereka.
- source_word: כָּל שׁוֹבֵיהֶם
  choice: semua orang yang menawan mereka
  rationale: Partisipel Ibrani menunjuk kepada para penawan mereka; bentuk ini alami dalam bahasa Indonesia dan tidak perlu menentukan apakah tindakan penawanan dipandang hanya sebagai peristiwa lampau.
theological_decisions:
- issue: Keagenan ilahi dalam timbulnya belas kasihan
  choice: Ia membuat mereka mendapat belas kasihan
  alternative: Mereka mendapat belas kasihan
  rationale: Bentuk וַיִּתֵּן secara eksplisit menempatkan Allah sebagai pelaku; terjemahan mempertahankan keagenan itu tanpa menjelaskan mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pronomina ‘Ia’ mengikuti rujukan kepada Allah dalam konteks mazmur; ‘belas kasihan’ mempertahankan bobot רַחֲמִים dan mudah dipahami pembaca modern.
