  text: אַ֭שְׁרֵי שֹׁמְרֵ֣י מִשְׁפָּ֑ט עֹשֵׂ֖ה צְדָקָ֣ה בְ/כָל עֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/003.yaml
  text: Blessed are those who keep justice[a], who do righteousness at all times.
translation:
  language: id
  text: Berbahagialah orang-orang yang memelihara keadilan, yang melakukan kebenaran setiap waktu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk seruan ini memperkenalkan ucapan bahagia. 'Berbahagialah' alami dan bernada luhur dalam bahasa Indonesia, tanpa membatasinya pada perasaan senang sesaat.
- source_word: שֹׁמְרֵי
  choice: orang-orang yang memelihara
  rationale: Partisip ini menyatakan kebiasaan yang berkelanjutan. 'Memelihara' mencakup menaati dan mempertahankan keadilan, serta sesuai dengan ragam mazmur yang luhur.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks etis ini, kata tersebut menunjuk pada tatanan atau tindakan yang adil, bukan terutama putusan pengadilan.
- source_word: עֹשֵׂה
  choice: yang melakukan
  rationale: Partisip tunggal Ibrani ini memiliki daya kolektif atau generik setelah ungkapan jamak. Klausa relatif bahasa Indonesia mempertahankan makna tindakan yang menjadi kebiasaan.
- source_word: צְדָקָה
  choice: kebenaran
  rationale: Di sini kata tersebut menunjuk pada perilaku yang benar dan lurus. 'Kebenaran' mempertahankan bobot moral-teologisnya sekaligus membedakannya dari מִשְׁפָּט, 'keadilan'.
- source_word: בְּכָל עֵת
  choice: setiap waktu
  rationale: Ungkapan ini menyatakan tindakan yang terus-menerus atau menjadi kebiasaan dan cukup dekat dengan bentuk harfiah Ibraninya.
theological_decisions:
- issue: Hubungan antara מִשְׁפָּט dan צְדָקָה
  choice: Menerjemahkan keduanya secara berbeda sebagai 'keadilan' dan 'kebenaran'.
  alternative: Menerjemahkan keduanya dengan kosakata yang sama atau bertumpang tindih, misalnya 'keadilan' dan 'yang benar'.
  rationale: Bahasa Ibrani memakai dua istilah etis yang berkaitan tetapi tidak identik. Pembedaan ini menjaga paralelisme puitis dan ketegangan maknanya tanpa meleburkan kedua konsep.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dipertahankan; 'orang-orang' memperjelas acuan jamak, sedangkan 'setiap waktu' menjaga tekanan temporal teks Ibrani.
