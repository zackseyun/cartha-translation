  text: נִ֭פְלָאוֹת בְּ/אֶ֣רֶץ חָ֑ם נ֝וֹרָא֗וֹת עַל יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/022.yaml
  text: wondrous things in the land of Ham[b][a], awesome things by the Red Sea.
translation:
  language: id
  text: perbuatan-perbuatan ajaib di tanah Ham[a], perbuatan-perbuatan dahsyat di tepi Laut Teberau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ham” merupakan nama puitis bagi Mesir dalam konteks ini.
    reason: cultural_note
  - marker: b
    text: Ibrani Yam Suf, secara tradisional diterjemahkan “Laut Merah”; dapat juga diterjemahkan “Laut Gelagah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: perbuatan-perbuatan ajaib
  rationale: Bentuk jamak dari akar פלא menunjuk pada tindakan luar biasa. Penambahan 'perbuatan-perbuatan' memperjelas bahwa yang dimaksud ialah karya yang dilakukan Allah dalam konteks mazmur ini.
- source_word: בְּאֶרֶץ
  choice: di tanah
  rationale: Preposisi ב bersifat lokatif, sedangkan אֶרֶץ secara alami diterjemahkan 'tanah' dalam ungkapan puitis 'tanah Ham'.
- source_word: חָם
  choice: Ham
  rationale: Nama diri Ibrani dipertahankan, bukan diganti dengan penafsirannya, yaitu Mesir; keterangannya diberikan dalam catatan kaki.
- source_word: נ֝וֹרָאוֹת
  choice: perbuatan-perbuatan dahsyat
  rationale: Kata dari akar ירא menggambarkan tindakan yang membangkitkan rasa gentar dan takjub. 'Dahsyat' alami dalam bahasa Indonesia dan tidak menyiratkan kejahatan moral.
- source_word: עַל
  choice: di tepi
  rationale: Dalam hubungan dengan unsur geografis, עַל dapat menunjukkan lokasi 'di/dekat'. 'Di tepi' menyampaikan hubungan tempat secara alami tanpa memberi kesan bahwa tindakan itu berlangsung di atas permukaan laut.
- source_word: יַם סוּף
  choice: Laut Teberau
  rationale: Istilah Alkitab bahasa Indonesia yang dikenal ini mempertahankan kaitan dengan סוּף, 'teberau/gelagah', sementara padanan tradisional 'Laut Merah' dicantumkan dalam catatan kaki.
