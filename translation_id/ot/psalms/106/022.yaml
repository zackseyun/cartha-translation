  register: Bahasa puitis yang modern dan bermartabat. Pengulangan 'perbuatan-perbuatan' mempertahankan paralelisme kedua frasa Ibrani. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskan.
