lexical_decisions:
- source_word: חָטָאנוּ
  choice: kami telah berdosa
  rationale: Bentuk Qal perfektif orang pertama jamak menyatakan pengakuan bersama atas dosa; bentuk 'telah berdosa' wajar dalam bahasa Indonesia dan menunjukkan tindakan lampau yang tetap relevan dalam pengakuan ini.
- source_word: עִם
  choice: bersama
  rationale: Preposisi ini menyatakan kebersamaan atau keterkaitan dengan generasi terdahulu, bukan sekadar kemiripan.
- source_word: אֲבוֹתֵינוּ
  choice: nenek moyang kami
  rationale: Secara harfiah berarti 'bapa-bapa kami', tetapi dalam konteks sejarah umat menunjuk para leluhur; 'nenek moyang kami' menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: הֶעֱוִינוּ
  choice: kami telah berbuat salah
  rationale: Bentuk Hifil perfektif dari עוה menyatakan perbuatan yang menyimpang atau salah. Pilihan ini jelas bagi pembaca modern dan mempertahankan daya moralnya tanpa istilah teknis.
- source_word: הִרְשָׁעְנוּ
  choice: kami telah bertindak fasik
  rationale: Bentuk Hifil perfektif dari רשע menyatakan bertindak jahat atau fasik. 'Bertindak fasik' mempertahankan unsur verbal serta puncak penguatan dalam pengakuan tiga serangkai.
theological_decisions:
- issue: Solidaritas komunal dalam pengakuan dosa
  choice: Frasa 'bersama nenek moyang kami' mengakui dosa dalam kesinambungan dengan generasi terdahulu.
  alternative: Frasa itu dapat diterjemahkan 'seperti nenek moyang kami', yang hanya menekankan kemiripan.
  rationale: עִם pada dasarnya menyatakan kebersamaan atau keterkaitan, bukan perbandingan. Terjemahan ini menjaga pengakuan komunal lintas generasi tanpa menambahkan rumusan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'kami telah' dipertahankan untuk mencerminkan irama pengakuan tiga serangkai dalam bahasa Ibrani; 'fasik' dipakai sebagai istilah moral yang kuat namun tetap lazim dalam register Kitab Suci.
