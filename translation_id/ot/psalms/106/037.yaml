  text: They sacrificed their sons and their daughters to demons[a].
translation:
  language: id
  text: Mereka mengorbankan anak-anak lelaki mereka dan anak-anak perempuan mereka kepada roh-roh jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepada roh-roh jahat itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: mereka mengorbankan
  rationale: Kata kerja זבח menunjuk pada penyembelihan atau persembahan korban. “Mengorbankan” alami dalam bahasa Indonesia dan mempertahankan konteks kultisnya.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: Penanda objek langsung Ibrani tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: בְּנֵיהֶם
  choice: anak-anak lelaki mereka
  rationale: Bentuk jamak בֵּן secara khusus berarti anak-anak lelaki; pilihan ini mempertahankan pembedaan gender dalam teks sumber.
- source_word: וְאֶת
  choice: dan [penanda objek langsung tidak diterjemahkan]
  rationale: Konjungsi diterjemahkan “dan”, sedangkan penanda objek langsung tidak diterjemahkan.
- source_word: בְּנוֹתֵיהֶם
  choice: anak-anak perempuan mereka
  rationale: Bentuk jamak בַּת secara khusus berarti anak-anak perempuan. Pengulangan lengkap mempertahankan penekanan dan cakupan tuduhan dalam bahasa Ibrani.
- source_word: לַשֵּׁדִים
  choice: kepada roh-roh jahat
  rationale: שֵׁדִים menunjuk pada makhluk-makhluk roh yang jahat. “Roh-roh jahat” jelas dan alami bagi pembaca Indonesia, sedangkan לְ menandai penerima korban.
theological_decisions:
- issue: Penerjemahan שֵׁדִים
  choice: roh-roh jahat
  alternative: setan-setan; dewa-dewa palsu
  rationale: Istilah Ibrani menunjuk pada makhluk-makhluk adikodrati yang jahat, bukan hanya berhala atau dewa palsu sebagai konsep abstrak. “Roh-roh jahat” mempertahankan klaim adikodrati teks tanpa menambahkan rincian spekulatif.
- issue: Artikel pada לַשֵּׁדִים
  choice: roh-roh jahat
  alternative: roh-roh jahat itu
  rationale: Bentuk Ibrani mengandung artikel tertentu, tetapi bahasa Indonesia tidak selalu memerlukan “itu” dalam pernyataan jenis ini. Catatan kaki mempertahankan kemungkinan bentuk definit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “anak-anak lelaki mereka dan anak-anak perempuan mereka” sengaja mempertahankan pembedaan serta pengulangan teks Ibrani; “kepada” menandai penerima korban secara jelas.
