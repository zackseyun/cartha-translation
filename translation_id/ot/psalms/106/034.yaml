  naturalness: Kalimat draf umumnya lugas, tetapi klausa relatif tersebut kurang alami dalam bahasa Indonesia modern. Menempatkan “kepada mereka” secara eksplisit membuat relasi sintaksisnya jelas dan pembacaannya lebih lancar.
  terminology: “Memusnahkan,” “bangsa-bangsa,” dan “Yahweh” merupakan padanan yang tepat dan konsisten. Pelengkap eliptis tetap sebaiknya ditandai dalam catatan kaki, bukan diterjemahkan seakan-akan kata “memerintahkan” terdapat dalam teks Ibrani.
