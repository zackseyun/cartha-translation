  text: They did not destroy the peoples whom Yahweh had told them to destroy[a].
translation:
  language: id
  text: Mereka tidak memusnahkan bangsa-bangsa yang Yahweh katakan kepada mereka untuk dimusnahkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Mereka tidak memusnahkan bangsa-bangsa yang Yahweh katakan kepada mereka.” Frasa “untuk dimusnahkan” melengkapi isi perkataan yang tersirat dalam bahasa Ibrani dan jelas dari konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא הִשְׁמִידוּ
  choice: tidak memusnahkan
  rationale: Bentuk Hifil הִשְׁמִידוּ menyatakan tindakan menyebabkan kebinasaan atau menyingkirkan sampai habis. “Memusnahkan” mempertahankan kekuatan maknanya tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: אֶת הָעַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak עַמִּים menunjuk kepada beberapa kelompok masyarakat atau etnis. “Bangsa-bangsa” merupakan padanan Indonesia yang alami dalam konteks ini.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini merujuk kembali kepada bangsa-bangsa dan secara alami diterjemahkan “yang”.
- source_word: אָמַר
  choice: katakan
  rationale: Kata Ibrani ini secara dasar berarti “berkata”, bukan secara eksplisit “memerintahkan”. Pilihan “katakan” menjaga bentuk leksikal tersebut, sedangkan isi perkataan yang tersirat dilengkapi dari konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap tampak dan tidak diganti dengan sebuah gelar.
- source_word: לָהֶם
  choice: kepada mereka, dinyatakan secara alami melalui klausa “harus mereka”
  rationale: Akhiran pronominal ini menandai Israel sebagai penerima perkataan Yahweh. Dalam susunan Indonesia, relasi itu sudah terungkap secara alami oleh “harus mereka musnahkan”, sehingga pengulangan “kepada mereka” akan terasa janggal.
theological_decisions:
- issue: Isi perkataan Yahweh tidak dinyatakan secara eksplisit sesudah אָמַר לָהֶם
  choice: Melengkapi klausa dengan “harus mereka musnahkan”
  alternative: “bangsa-bangsa yang tentang mereka Yahweh telah berfirman kepada mereka”
  rationale: Teks Ibrani secara harfiah berhenti pada “yang Yahweh katakan kepada mereka”, sehingga isi perkataannya eliptis. Kata kerja utama dan konteks mazmur menunjukkan bahwa yang tersirat ialah kewajiban memusnahkan bangsa-bangsa itu. Pelengkapan ini menghasilkan bahasa Indonesia yang jelas tanpa mengganti אָמַר dengan kata yang secara leksikal lebih kuat seperti “memerintahkan”.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan kekuatan “memusnahkan” serta nama “Yahweh”, sambil menjelaskan elipsis Ibrani secara wajar. Penanda catatan kaki [a] dicantumkan dalam teks utama.
