  yaml_path: translation/ot/psalms/106/010.yaml
  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
translation:
  language: id
  text: Ia menyelamatkan[a] mereka dari tangan orang yang membenci mereka, dan menebus[b] mereka dari tangan musuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melepaskan”; kata Ibrani ini dapat berarti menyelamatkan dari bahaya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “membebaskan” atau “menyelamatkan”; kata Ibrani ini mengandung gagasan pembebasan melalui campur tangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: Ia menyelamatkan mereka
  rationale: Kata kerja dari ישׁע menyatakan tindakan menyelamatkan atau melepaskan dari bahaya. “Menyelamatkan” alami dalam bahasa Indonesia dan tetap mempertahankan bobot tindakan penyelamatan ilahi.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan Ibrani ini berarti keluar dari kuasa atau kendali seseorang. Bentuk “dari tangan” dipertahankan karena dapat dipahami dalam konteks dan menjaga gambaran konkret teks sumber.
- source_word: שׂוֹנֵא
  choice: orang yang membenci mereka
  rationale: Partisip tunggal ini diperlakukan sebagai nomina tunggal. Bentuk tunggal dipertahankan, tanpa mengubahnya menjadi jamak, meskipun dalam konteksnya dapat menunjuk kepada penguasa atau kekuatan musuh secara representatif.
- source_word: וַיִּגְאָלֵם
  choice: menebus mereka
  rationale: Kata kerja גאל mengandung gagasan merebut kembali atau membebaskan melalui campur tangan. “Menebus” mempertahankan kekhasan istilah ini serta membedakannya dari kata kerja penyelamatan pada baris pertama.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Nomina tunggal diterjemahkan secara tunggal. Dalam bahasa Indonesia, “dari tangan musuh” sudah wajar dan dapat bersifat definit tanpa harus memakai penentu tambahan.
theological_decisions:
- issue: Apakah dua kata kerja ישׁע dan גאל perlu dilebur menjadi satu gagasan umum
  choice: Keduanya dibedakan sebagai “menyelamatkan” dan “menebus”
  alternative: Menerjemahkan keduanya dengan kata umum seperti “melepaskan”
  rationale: Teks memakai dua istilah penyelamatan yang berhubungan tetapi tidak identik. Mempertahankan keduanya menjaga paralelisme puitis dan nuansa penebusan tanpa menambahkan rumusan doktrinal di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan paralel serta gambaran “dari tangan” dipertahankan, sementara pilihan katanya tetap mudah dipahami pembaca umum.
