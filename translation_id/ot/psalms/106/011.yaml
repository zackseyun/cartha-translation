  text: וַ/יְכַסּוּ מַ֥יִם צָרֵי/הֶ֑ם אֶחָ֥ד מֵ֝/הֶ֗ם לֹ֣א נוֹתָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/011.yaml
  text: The waters covered their adversaries[b][a]; not one of them remained.
translation:
  language: id
  text: Air menutupi para lawan mereka; tidak seorang pun dari mereka tersisa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: menutupi
  rationale: Bentuk dari כסה berarti ‘menutupi’. Dalam konteks laut, pilihan ini mempertahankan gambaran konkret bahwa air menutupi para pengejar, tanpa memperluasnya menjadi ‘menenggelamkan’.
- source_word: מַיִם
  choice: Air
  rationale: Bentuk Ibrani secara gramatikal jamak, tetapi bahasa Indonesia lazim memakai nomina massa ‘air’. Konteks sudah menunjukkan air laut tertentu sehingga artikel tidak diperlukan.
- source_word: צָרֵיהֶם
  choice: para lawan mereka
  rationale: צָר menunjuk kepada pihak yang memusuhi atau menyesakkan. ‘Para lawan mereka’ mempertahankan makna permusuhan tanpa menambahkan rincian yang tidak dinyatakan dalam ayat.
- source_word: אֶחָד מֵהֶם
  choice: tidak seorang pun dari mereka
  rationale: Secara harfiah, ungkapan ini berarti ‘satu dari mereka’; bersama penyangkalan, ungkapan Indonesia yang alami adalah ‘tidak seorang pun dari mereka’.
- source_word: לֹא נוֹתָר
  choice: tersisa
  rationale: Nifal dari יתר berarti ‘ditinggalkan, tetap ada, tersisa’. ‘Tersisa’ langsung menyampaikan bahwa tak ada satu pun yang tinggal, tanpa menafsirkan lebih jauh sebagai ‘selamat’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur dua klausa dipertahankan untuk menjaga gerak puitis ayat. Tidak diperlukan catatan kaki karena alternatif ‘musuh’ tidak mengubah makna secara berarti dan ungkapan negatif dapat diterjemahkan secara alami.
