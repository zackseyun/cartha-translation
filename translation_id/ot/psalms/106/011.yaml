  terminology: “Para lawan mereka” merupakan padanan yang baik dan netral untuk צָרֵיהֶם; tidak perlu menggantinya dengan “musuh,” yang hanya merupakan alternatif leksikal. “Tersisa” secara tepat mempertahankan tekanan pada tidak adanya seorang pun yang tertinggal.
