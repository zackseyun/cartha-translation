  source_fidelity: Terjemahan dengan tepat mencerminkan וַיְכַסּוּ מַיִם sebagai “Air menutupi,” dan mempertahankan objek צָרֵיהֶם sebagai “para lawan mereka.” Klausa kedua, “tidak seorang pun dari mereka tersisa,” secara setia menyampaikan penyangkalan menyeluruh dalam אֶחָד מֵהֶם לֹא נוֹתָר tanpa menambahkan gagasan seperti “tenggelam” atau “binasa.”
