  yaml_path: translation/ot/psalms/106/005.yaml
  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
translation:
  language: id
  text: agar aku melihat kesejahteraan orang-orang pilihan-Mu, bersukacita dalam sukacita bangsa-Mu, dan bermegah bersama milik pusaka-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berbangga bersama milik pusaka-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִרְאוֹת
  choice: agar aku melihat
  rationale: Infinitif dengan ל melanjutkan permohonan ayat sebelumnya dan menyatakan tujuan; verba konkret 'melihat' dipertahankan.
- source_word: בְּטוֹבַת
  choice: kebaikan yang dinikmati
  rationale: טוֹבָה menunjuk pada keadaan baik atau kesejahteraan yang menjadi bagian umat. Rumusan ini menjaga unsur 'kebaikan' sekaligus membuat hubungannya dengan orang-orang pilihan jelas dan alami dalam bahasa Indonesia.
- source_word: בְּחִירֶיךָ
  choice: orang-orang pilihan-Mu
  rationale: Menunjuk kepada mereka yang dipilih Allah tanpa memakai istilah teknis yang dapat membawa muatan teologis sistematis tambahan.
- source_word: לִשְׂמֹחַ בְּשִׂמְחַת
  choice: bersukacita dalam sukacita
  rationale: Mempertahankan permainan akar kata Ibrani שמח dan gagasan ikut mengambil bagian dalam sukacita umat.
- source_word: גּוֹיֶךָ
  choice: bangsa-Mu
  rationale: Padanan langsung גּוֹי yang mempertahankan identitas korporat Israel sebagai bangsa milik Allah.
- source_word: לְהִתְהַלֵּל
  choice: bermegah
  rationale: Hitpael הלל di sini menyatakan kebanggaan atau kegembiraan yang positif; 'bermegah' sesuai dengan register mazmur dan tidak harus bernada negatif.
- source_word: עִם
  choice: bersama
  rationale: Menyatakan persekutuan atau kebersamaan dengan umat yang menjadi milik pusaka Allah.
- source_word: נַחֲלָתֶךָ
  choice: milik pusaka-Mu
  rationale: נַחֲלָה dalam konteks ini adalah umat sebagai bagian atau kepunyaan khusus Allah. 'Milik pusaka' mempertahankan citra warisan sekaligus lebih jelas daripada sekadar 'warisan-Mu'.
theological_decisions:
- issue: Pembedaan tiga sebutan identitas perjanjian bagi Israel
  choice: orang-orang pilihan-Mu ... bangsa-Mu ... milik pusaka-Mu
  alternative: umat pilihan-Mu ... umat-Mu ... warisan-Mu
  rationale: Tiga istilah Ibrani yang berbeda dipertahankan agar tidak diratakan menjadi satu sebutan dan agar relasi pemilihan, kebangsaan, serta kepunyaan Allah tetap terdengar.
- issue: Makna positif לְהִתְהַלֵּל dalam konteks umat Allah
  choice: bermegah
  alternative: berbangga / bersukaria
  rationale: Konteksnya bukan kesombongan yang dicela, melainkan kegembiraan karena turut bersama umat milik Allah; terjemahan tidak menambahkan objek atau dasar kemegahan yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis. Pengulangan 'bersukacita dalam sukacita' sengaja dipertahankan untuk mencerminkan pengulangan akar kata dalam bahasa Ibrani. Kapital pada enklitik -Mu menandai rujukan kepada Allah sesuai konvensi umum penerbitan Alkitab Indonesia.
