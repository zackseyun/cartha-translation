language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הוֹשִׁיעֵ֨/נוּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ/קַבְּצֵ/נוּ֮ מִֽן הַ/גּ֫וֹיִ֥ם לְ֭/הֹדוֹת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ לְ֝/הִשְׁתַּבֵּ֗חַ בִּ/תְהִלָּתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: id
  text: Selamatkanlah kami[a], ya Yahweh, Allah kami, dan kumpulkanlah kami dari antara bangsa-bangsa, supaya kami mengucap syukur kepada nama-Mu yang kudus dan bermegah dalam pujian kepada-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lepaskanlah kami.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bersukacita dalam pujian kepada-Mu” atau “berbangga dalam pujian kepada-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: Selamatkanlah kami
  rationale: Imperatif Hifil dengan sufiks orang pertama jamak merupakan permohonan langsung agar diselamatkan atau dilepaskan; pilihan ini alami dalam bahasa doa dan mempertahankan bobot makna keselamatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: Bentuk dengan sufiks orang pertama jamak secara langsung menyatakan hubungan 'Allah kami'.
- source_word: וְקַבְּצֵנוּ
  choice: dan kumpulkanlah kami
  rationale: Imperatif Piel קבץ mengacu pada pengumpulan kembali umat yang tercerai-berai.
- source_word: מִן הַגּוֹיִם
  choice: dari antara bangsa-bangsa
  rationale: Ungkapan ini menggambarkan umat yang berada tersebar di tengah berbagai bangsa; 'dari antara' memperjelas konteks tersebut.
- source_word: לְהוֹדוֹת
  choice: supaya kami mengucap syukur
  rationale: Infinitif berprefiks ל menyatakan tujuan, dan Hifil ידה di sini lazim bermakna mengucap syukur.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: kepada nama-Mu yang kudus
  rationale: Terjemahan ini mempertahankan sasaran ucapan syukur serta penekanan Ibrani pada kekudusan nama Allah.
- source_word: לְהִשְׁתַּבֵּחַ
  choice: dan bermegah
  rationale: Bentuk Hitpael שׁבח menyatakan tindakan bermegah, membanggakan, atau bersukacita dengan penuh kemenangan; 'bermegah' mempertahankan idiom kuat itu tanpa mengarah pada prestasi manusia.
- source_word: בִּתְהִלָּתֶךָ
  choice: dalam pujian kepada-Mu
  rationale: Preposisi ב menyatakan ranah atau objek tindakan bermegah. Frasa Indonesia ini menghindari kesan bahwa 'pujian-Mu' berarti pujian yang Allah ucapkan, sambil tetap mempertahankan nomina תהלה.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah; transliterasi mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Nuansa לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: bermegah dalam pujian kepada-Mu
  alternative: bersukacita dalam pujian kepada-Mu; berbangga dalam pujian kepada-Mu
  rationale: Ungkapan Ibrani memuat nuansa refleksif dan kegembiraan yang kuat. 'Bermegah' mempertahankan ketegangan idiomatis bahwa kemegahan umat berpusat pada pujian kepada Allah, bukan pada diri sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel -lah mempertahankan corak permohonan doa tanpa terdengar kuno. Kapitalisasi pronomina ilahi dipakai secara konsisten. Susunan tujuan dibuat alami, sedangkan ungkapan 'bermegah' dipertahankan untuk menjaga kekuatan dan ketegangan idiom Ibrani.
