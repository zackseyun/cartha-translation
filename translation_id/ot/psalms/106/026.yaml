  text: וַ/יִּשָּׂ֣א יָד֣/וֹ לָ/הֶ֑ם לְ/הַפִּ֥יל א֝וֹתָ֗/ם בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/026.yaml
  text: So he raised his hand against them[a], to make them fall in the wilderness.
translation:
  language: id
  text: Maka Ia mengangkat tangan-Nya terhadap mereka[a], untuk menjatuhkan mereka di padang gurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia bersumpah terhadap mereka”; ungkapan Ibrani “mengangkat tangan” dapat menunjuk pada tindakan bersumpah, khususnya dalam konteks penghakiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: mengangkat
  rationale: Kata נׂשא pada dasarnya berarti “mengangkat.” Bersama “tangan,” ungkapan konkret Ibrani dipertahankan karena tetap dapat dipahami dalam bahasa Indonesia, sementara nuansa bersumpah dijelaskan dalam catatan kaki.
- source_word: יָדוֹ
  choice: tangan-Nya
  rationale: Terjemahan langsung mempertahankan citra dan ungkapan Ibrani. Akhiran pronominal merujuk kepada Allah dalam konteks; huruf kapital mengikuti kaidah rujukan ilahi dalam bahasa Indonesia.
- source_word: לָהֶם
  choice: terhadap mereka
  rationale: Preposisi ל secara harfiah dapat berarti “kepada/bagi mereka,” tetapi dalam ungkapan ini “terhadap mereka” menyampaikan arah tindakan atau sumpah penghukuman tanpa mempersempitnya menjadi serangan fisik.
- source_word: לְהַפִּיל
  choice: untuk menjatuhkan
  rationale: Bentuk hiphil infinitif dari נפל bersifat kausatif, yaitu “menyebabkan jatuh.” “Menjatuhkan” merupakan padanan Indonesia yang alami dan tetap mempertahankan gambaran kausatif itu.
- source_word: אוֹתָם
  choice: mereka
  rationale: Pronomina objek langsung diterjemahkan secara lugas.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: “Padang gurun” adalah padanan yang lazim dan sesuai dengan latar pengembaraan Israel, tanpa mengharuskan arti wilayah yang sepenuhnya tandus.
theological_decisions:
- issue: Daya idiomatis ungkapan “mengangkat tangan”
  choice: Mempertahankan ungkapan Ibrani dalam teks utama dan mencatat kemungkinan makna sumpah penghakiman.
  alternative: “Ia bersumpah terhadap mereka” atau “Ia mengangkat tangan untuk bersumpah terhadap mereka.”
  rationale: Dalam konteks penghukuman di padang gurun, tindakan mengangkat tangan kemungkinan menunjuk pada sumpah ilahi yang khidmat. Namun, teks Ibrani mempertahankan gestur tersebut dan tidak memakai kata kerja eksplisit “bersumpah,” sehingga ambiguitas dan citranya sebaiknya dijaga.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Maka” menghubungkan ayat ini dengan tindakan sebelumnya; “terhadap mereka” menjaga nuansa judicial tanpa menjadikan gestur itu semata-mata serangan fisik.
