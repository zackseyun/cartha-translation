  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: id
  text: Lalu mereka memandang hina tanah yang indah itu[a]; mereka tidak percaya kepada firman-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanah yang menyenangkan itu” atau “tanah yang sangat diinginkan itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mereka tidak memercayai firman-Nya.” Dalam konteks ini, “firman-Nya” juga dapat dipahami sebagai “janji-Nya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Lalu mereka menolak
  rationale: Kata kerja מאס menyatakan penolakan yang kuat dan dapat berarti memandang hina. “Menolak” terdengar alami dalam bahasa Indonesia serta sesuai dengan konteks penolakan Israel terhadap negeri itu; “lalu” mencerminkan urutan naratif waw.
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: negeri yang menyenangkan itu
  rationale: אֶרֶץ di sini menunjuk pada negeri yang dijanjikan, sedangkan חֶמְדָּה menyatakan sesuatu yang menyenangkan, menarik, atau patut diinginkan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan penilaian positif teks terhadap negeri tersebut.
- source_word: לֹא הֶאֱמִינוּ
  choice: mereka tidak percaya
  rationale: Bentuk Hifil dari אמן dapat berarti percaya atau memercayai. “Tidak percaya” mempertahankan keluasan makna sumber tanpa mempersempitnya menjadi sekadar penerimaan intelektual ataupun secara eksplisit menjadi kepercayaan relasional.
- source_word: לִדְבָרוֹ
  choice: kepada firman-Nya
  rationale: דָּבָר berarti perkataan atau firman dan dalam konteks ini dapat merujuk pada janji Allah mengenai negeri itu. “Firman-Nya” mempertahankan ungkapan luas bahasa Ibrani, sedangkan nuansa “janji-Nya” dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah לִדְבָרוֹ harus diperjelas sebagai janji Allah tentang negeri itu
  choice: Mempertahankan “firman-Nya” dalam teks utama
  alternative: janji-Nya
  rationale: Teks Ibrani secara harfiah menyebut “firman/perkataan-Nya.” Konteks memungkinkan makna “janji-Nya,” tetapi menjadikannya teks utama akan mempersempit ungkapan sumber.
- issue: Apakah הֶאֱמִינוּ harus diterjemahkan sebagai percaya atau memercayai
  choice: tidak percaya kepada firman-Nya
  alternative: tidak memercayai firman-Nya
  rationale: Keduanya dimungkinkan. Pilihan utama mengikuti konstruksi yang wajar dalam bahasa Indonesia dan mempertahankan ambiguitas antara percaya serta menaruh kepercayaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Negeri” dipilih karena lebih alami bagi wilayah yang dijanjikan, sedangkan kapitalisasi pada “-Nya” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah.
