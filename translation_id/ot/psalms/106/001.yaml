  text: הַֽלְלוּ יָ֨הּ הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: id
  text: Pujilah Yah! Bersyukurlah kepada Yahweh, sebab Ia baik, sebab kasih setia-Nya berlangsung selama-lamanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Pujilah
  rationale: Bentuk imperatif jamak dari הלל, yaitu ajakan kepada umat untuk memuji; bentuk ini alami dan tetap dekat dengan sumber.
- source_word: יָהּ
  choice: Yah
  rationale: Bentuk singkat dan puitis dari nama ilahi, dipertahankan secara tersendiri dalam seruan liturgis הַלְלוּ־יָהּ.
- source_word: הוֹד֣וּ
  choice: Bersyukurlah
  rationale: Dalam konteks mazmur, bentuk Hifil dari ידה menyatakan ajakan untuk mengucap syukur kepada Allah.
- source_word: לַ/יהוָ֣ה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima ucapan syukur, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi ajakan untuk bersyukur; pengulangannya mempertahankan kesejajaran teks Ibrani.
- source_word: טוֹב
  choice: Ia baik
  rationale: Adjektiva predikatif dengan subjek tersirat yang merujuk kepada Yahweh; bahasa Indonesia memerlukan subjek eksplisit agar alami.
- source_word: לְ/עוֹלָ֣ם
  choice: untuk selama-lamanya
  rationale: Ungkapan temporal ini secara harfiah menunjuk kepada kelangsungan tanpa akhir; bentuk nominal tanpa verba mempertahankan kepadatan klausa Ibrani.
- source_word: חַסְדּֽ/וֹ
  choice: kasih setia-Nya
  rationale: חסד memadukan kasih, kesetiaan, dan komitmen relasional; 'kasih setia' merupakan padanan Indonesia yang ringkas dan kaya makna.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama ilahi yang hadir langsung dalam teks, tanpa menggantinya dengan gelar.
- issue: Penerjemahan bentuk singkat nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Bentuk singkat ini dipertahankan karena teks memakai יָהּ dan יְהוָה dalam ayat yang sama, sehingga perbedaan bentuk puitisnya tetap terlihat.
- issue: Hubungan sintaksis klausa terakhir
  choice: sebab kasih setia-Nya untuk selama-lamanya
  alternative: sebab kasih setia-Nya bertahan untuk selama-lamanya
  rationale: Bahasa Ibrani tidak memuat verba eksplisit. Bentuk tanpa 'bertahan' menjaga ellipsis dan ambiguitas sintaksis sumber, namun tetap dapat dipahami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, puitis, ringkas, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam teks keagamaan Indonesia. Paralelisme dua kali 'sebab' dan perbedaan antara 'Yah' serta 'Yahweh' dipertahankan.
