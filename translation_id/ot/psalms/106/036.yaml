  source_fidelity: Teks Indonesia secara akurat menerjemahkan וַיַּעַבְדוּ sebagai pengabdian/ibadah kepada berhala, עֲצַבֵּיהֶם sebagai berhala-berhala mereka, dan לְמוֹקֵשׁ sebagai jerat. Pengulangan nomina pada klausa kedua dengan tepat memperjelas bahwa berhala-berhala itulah yang menjadi jerat bagi mereka, sesuai pembacaan kontekstual yang paling wajar.
