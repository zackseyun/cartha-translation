source:
  edition: WLC
  text: וַ/יַּעַבְד֥וּ אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּהְי֖וּ לָ/הֶ֣ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/036.yaml
  text: They served their idols[a], and they became a snare to them.
translation:
  language: id
  text: Mereka beribadah kepada berhala-berhala mereka[a], dan berhala-berhala itu menjadi jerat bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mereka melayani berhala-berhala mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: mereka beribadah kepada
  rationale: Dalam konteks pengabdian kepada ilah-ilah palsu, עבד menunjuk pada pelayanan religius. Ungkapan 'beribadah kepada' terdengar alami dalam bahasa Indonesia dan menyampaikan makna tersebut tanpa menyempitkannya pada satu tindakan ritual tertentu.
- source_word: עֲצַבֵּיהֶם
  choice: berhala-berhala mereka
  rationale: עֲצַבִּים lazim menunjuk kepada berhala dalam konteks polemis. 'Berhala-berhala' lebih jelas bagi pembaca modern daripada 'patung-patung' atau 'gambar-gambar'.
- source_word: וַיִּהְיוּ
  choice: menjadi
  rationale: 'Dalam konstruksi dengan לְמוֹקֵשׁ, היה menyatakan hasil atau keadaan yang timbul: berhala-berhala itu berfungsi sebagai jerat.'
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Preposisi ל menyatakan hubungan atau akibat terhadap umat itu; 'bagi mereka' merupakan bentuk Indonesia yang alami dengan 'menjadi jerat'.
- source_word: לְמוֹקֵשׁ
  choice: jerat
  rationale: מוֹקֵשׁ berarti perangkap atau jerat, juga secara kiasan untuk sesuatu yang menyesatkan dan membinasakan. 'Jerat' mempertahankan citra metaforis sumber.
theological_decisions:
- issue: Acuan subjek tersirat dalam וַיִּהְיוּ ('dan mereka menjadi')
  choice: Berhala-berhala itu menjadi jerat bagi orang-orang yang beribadah kepadanya.
  alternative: Tindakan beribadah kepada berhala menjadi jerat bagi mereka.
  rationale: Anteseden jamak terdekat dan paling alami adalah 'berhala-berhala mereka'. Teks utama mengulang nomina agar acuan jelas dalam bahasa Indonesia, tanpa mengubah hubungan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'berhala-berhala' menghindari ambiguitas pronominal yang terasa janggal dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan nuansa harfiah verba עבד.
