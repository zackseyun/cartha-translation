  terminology: Istilah “beribadah,” “berhala,” dan “jerat” tepat bagi register mazmur serta mempertahankan citra dan bobot religius teks Ibrani. Catatan kaki “melayani berhala-berhala” memberi alternatif leksikal yang sah untuk עבד tanpa mengganggu teks utama.
