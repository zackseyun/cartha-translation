  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
translation:
  language: id
  text: Namun, mereka sangat berhasrat di padang gurun[a], dan menguji Allah di tanah tandus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka menginginkan suatu keinginan”; bahasa Ibrani memakai kata kerja dan kata benda serumpun untuk menegaskan kuatnya hasrat itu. Atau “mereka sangat mengingini.”
    reason: lexical_alternative
  - marker: b
