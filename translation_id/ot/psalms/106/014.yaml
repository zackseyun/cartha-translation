lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: sangat menginginkan sesuatu
  rationale: Gabungan verba dan nomina serumpun secara harfiah berarti ‘menginginkan suatu keinginan’ dan berfungsi menegaskan kuatnya hasrat. Ungkapan ini diterjemahkan secara idiomatis; ‘sesuatu’ menyatakan objek yang tersirat tanpa menentukannya.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk pada kawasan liar atau gurun; ‘padang gurun’ alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan perjalanan Israel.
- source_word: וַיְנַסּוּ
  choice: dan menguji
  rationale: נסה berarti menguji atau mencoba untuk membuktikan; ‘menguji’ ringkas dan mempertahankan nada tindakan Israel yang menantang Allah dalam konteks ini.
- source_word: אֵל
  choice: Allah
  rationale: אֵל adalah sebutan ilahi yang di sini secara langsung merujuk kepada Allah.
- source_word: בִּישִׁימוֹן
  choice: di tanah tandus
  rationale: יְשִׁימוֹן menekankan tempat yang sunyi, gersang, dan tidak produktif. ‘Tanah tandus’ membedakannya dari מִדְבָּר pada baris pertama.
theological_decisions:
- issue: Cara menyampaikan konstruksi serumpun וַיִּתְאַוּוּ תַאֲוָה
  choice: Diterjemahkan secara idiomatis sebagai ‘sangat menginginkan sesuatu’.
  alternative: ‘menginginkan suatu keinginan’ atau ‘bernafsu’.
  rationale: Bentuk Ibrani memberikan penegasan, bukan objek baru. Terjemahan idiomatis mempertahankan intensitasnya tanpa menghasilkan pengulangan yang janggal atau memberi kesan seksual yang tidak diwajibkan konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti kesejajaran puisi Ibrani, sedangkan konstruksi penegasan diterjemahkan secara alami. ‘Padang gurun’ dan ‘tanah tandus’ mempertahankan perbedaan dua istilah tempat dalam teks sumber.
