id: PSA.106.25
reference: Psalms 106:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּרָגְנ֥וּ בְ/אָהֳלֵי/הֶ֑ם לֹ֥א שָׁ֝מְע֗וּ בְּ/ק֣וֹל יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/025.yaml
  text: So they grumbled in their tents[b][a]; they did not listen to the voice of Yahweh.
translation:
  language: id
  text: Lalu mereka menggerutu di kemah-kemah mereka[a]; mereka tidak mendengarkan suara Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersungut-sungut” atau “mengeluh.” Kata kerja Ibrani ini menggambarkan keluhan yang diucapkan dengan nada tidak puas.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka tidak menaati Yahweh.” Ungkapan Ibrani “mendengarkan suara” juga dapat berarti mengindahkan atau menaati.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: Lalu mereka menggerutu
  rationale: Kata kerja רגן menyatakan keluhan yang diucapkan dengan nada tidak puas atau gerutuan. “Menggerutu” alami dalam bahasa Indonesia modern dan mempertahankan nuansa negatifnya; וַ melanjutkan rangkaian narasi dan diterjemahkan “Lalu”.
- source_word: בְאָהֳלֵיהֶם
  choice: di kemah-kemah mereka
  rationale: אֹהֶל berarti “kemah.” Bentuk jamak dan gambaran konkret dalam latar perjalanan Israel dipertahankan.
- source_word: לֹא שָׁמְעוּ
  choice: mereka tidak mendengarkan
  rationale: שׁמע bersama בְּקוֹל dapat berarti mendengar dengan perhatian, mengindahkan, atau menaati. “Tidak mendengarkan” mempertahankan ungkapan yang berkaitan dengan suara tanpa meniadakan implikasi ketidaktaatan.
- source_word: בְּקוֹל
  choice: suara
  rationale: Terjemahan “suara” mempertahankan citra konkret ungkapan Ibrani שׁמע בקול dan tidak mempersempitnya menjadi “perintah” saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Makna שׁמע בקול dalam hubungan dengan respons kepada Yahweh
  choice: tidak mendengarkan suara Yahweh
  alternative: tidak menaati Yahweh
  rationale: Ungkapan Ibrani mencakup tindakan mendengar, mengindahkan, dan menaati. Teks utama mempertahankan citra “mendengarkan suara,” sedangkan makna ketaatan dijelaskan sebagai kemungkinan dalam catatan kaki.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan khidmat. “Menggerutu” dipilih karena mudah dipahami dan menyampaikan keluhan bernada tidak puas; “kemah-kemah” mempertahankan bentuk jamak dan latar konkret. Susunan kalimat menjaga kesejajaran dua tindakan tanpa memperjelas secara berlebihan hubungan teologis di antaranya.
