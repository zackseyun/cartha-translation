  text: וַ/יִּטְמְא֥וּ בְ/מַעֲשֵׂי/הֶ֑ם וַ֝/יִּזְנוּ֗ בְּ/מַֽעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/039.yaml
  text: So they became unclean by their deeds[a], and they prostituted themselves by their acts.
translation:
  language: id
  text: Mereka menjadi najis karena perbuatan mereka dan melacurkan diri melalui tindakan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi tidak setia melalui tindakan mereka.” Bahasa Ibrani memakai gambaran seksual untuk ketidaksetiaan secara moral maupun terhadap perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: menjadi najis
  rationale: Bentuk verba dari טמא menyatakan masuk ke dalam keadaan najis atau tercemar tanpa menyebut pelaku dari luar. “Menjadi najis” mempertahankan nuansa hasil/intransitif itu dan wajar dalam bahasa Indonesia.
- source_word: בְמַעֲשֵׂיהֶם
  choice: karena perbuatan mereka
  rationale: מַעֲשֶׂה berarti perbuatan, pekerjaan, atau tindakan. Preposisi ב dapat menyatakan sarana atau sebab; “karena” menyampaikan bahwa perbuatan mereka menyebabkan kenajisan tersebut.
- source_word: וַיִּזְנוּ
  choice: melacurkan diri
  rationale: זנה memakai gambaran prostitusi, di sini sebagai metafora ketidaksetiaan moral dan perjanjian. “Melacurkan diri” mempertahankan gambaran yang tajam serta nuansa tindakan subjek, alih-alih langsung menafsirkannya sebagai sekadar ketidaksetiaan.
- source_word: בְמַעַלְלֵיהֶם
  choice: melalui tindakan mereka
  rationale: מַעֲלָל menunjuk pada tindakan, sepak terjang, atau praktik, kerap dengan warna moral. “Tindakan” mempertahankan variasi puitis dari מַעֲשֶׂה, sedangkan “melalui” menyatakan sarana.
theological_decisions:
- issue: Apakah זנה harus langsung ditafsirkan sebagai kemurtadan atau ketidaksetiaan terhadap perjanjian
  choice: 'Mempertahankan metafora seksual dalam teks utama: “melacurkan diri”'
  alternative: “menjadi tidak setia”
  rationale: Dalam konteks mazmur ini, gambaran tersebut menunjuk pada penyembahan berhala dan ketidaksetiaan Israel. Namun, teks Ibrani mengungkapkannya melalui metafora seksual; mempertahankannya menjaga daya ungkap dan ketegangan teologis sumber tanpa membatasi maknanya pada satu parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Najis” dipertahankan karena tepat bagi ranah moral-ritual Alkitabiah, sedangkan “melacurkan diri” sengaja mempertahankan metafora sumber. Variasi “perbuatan” dan “tindakan” mencerminkan dua nomina Ibrani yang berbeda.
