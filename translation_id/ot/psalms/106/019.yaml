  text: יַעֲשׂוּ עֵ֥גֶל בְּ/חֹרֵ֑ב וַ֝/יִּשְׁתַּחֲו֗וּ לְ/מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/019.yaml
  text: They made a calf at Horeb and bowed down to a cast image[a][b].
translation:
  language: id
  text: Mereka membuat seekor anak lembu di Horeb dan sujud menyembah patung tuangan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “patung cor.” Istilah Ibrani ini secara khusus menunjuk pada patung yang dibentuk dengan cara menuang bahan cair, biasanya logam.
    reason: lexical_alternative
  - marker: b
    text: Ayat ini mengingatkan pada anak lembu yang dibuat di Horeb/Sinai dalam Keluaran 32.
    reason: cross_reference
lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: membuat
  rationale: Bentuk Qal dari עשה secara langsung berarti “membuat”; pilihan ini alami dan tidak menambahkan nuansa yang tidak dinyatakan.
- source_word: עֵגֶל
  choice: seekor anak lembu
  rationale: עֵגֶל menunjuk pada anak sapi atau lembu muda. “Anak lembu” mempertahankan kaitan dengan peristiwa di Horeb tanpa menambahkan “emas,” yang tidak disebut dalam ayat ini.
- source_word: בְּחֹרֵב
  choice: di Horeb
  rationale: Preposisi ב menyatakan lokasi; “di Horeb” merupakan ungkapan lokasi yang wajar dalam bahasa Indonesia.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: dan sujud menyembah
  rationale: Bentuk verba שחה menyatakan tindakan membungkuk atau bersujud sebagai penghormatan atau penyembahan. “Sujud menyembah” menyampaikan tindakan fisik sekaligus maksud penyembahan dalam konteks ini.
- source_word: לְמַסֵּכָה
  choice: kepada patung tuangan
  rationale: מַסֵּכָה adalah patung yang dibentuk dengan menuangkan bahan cair, lazimnya logam. “Patung tuangan” mempertahankan kekhususan cara pembuatannya, tidak seperti “berhala” yang terlalu umum.
theological_decisions:
- issue: Apakah objek itu perlu disebut “anak lembu emas”
  choice: Mempertahankan “anak lembu” tanpa kata “emas.”
  alternative: anak lembu emas
  rationale: Keluaran 32 menyatakan bahwa patung itu terbuat dari emas, tetapi Mazmur 106:19 sendiri hanya menyebut anak lembu dan patung tuangan. Menambahkan “emas” akan memasukkan keterangan dari konteks lain ke dalam teks ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa “sujud menyembah” dipilih agar tindakan fisik dan makna pemujaannya tersampaikan secara alami; “patung tuangan” mempertahankan rincian leksikal tentang cara patung itu dibuat.
