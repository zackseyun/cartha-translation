  yaml_path: translation/ot/psalms/106/030.yaml
  text: Then Phinehas stood up and interceded[a], and the plague was stopped.
translation:
  language: id
  text: Lalu Pinehas bangkit dan turun tangan[a], dan wabah itu pun berhenti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melaksanakan penghakiman”; mungkin juga “berdoa syafaat.” Kata kerja Ibrani di sini dapat mengandung makna yudisial maupun perantaraan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: bangkit
  rationale: Kata עמד berarti berdiri atau bangkit. Dalam rangkaian narasi ini, “bangkit” menyampaikan gerak sekaligus tindakan tegas secara alami.
- source_word: פִּינְחָס
  choice: Pinehas
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיְפַלֵּל
  choice: turun tangan
  rationale: Bentuk piel dari פלל di sini dapat mengandung daya yudisial maupun perantaraan. “Turun tangan” secara alami menyatakan campur tangan tegas tanpa membatasi tindakan itu hanya sebagai doa atau hanya sebagai pelaksanaan hukuman.
- source_word: וַתֵּעָצַר
  choice: berhenti
  rationale: Bentuk nifal dari עצר menyatakan bahwa sesuatu ditahan atau dihentikan. “Berhenti” jelas dan alami untuk hasil yang dialami wabah itu.
- source_word: הַמַּגֵּפָה
  choice: wabah
  rationale: מגפה menunjuk pada wabah mematikan atau tulah. “Wabah” merupakan padanan modern yang jelas dalam konteks Bilangan 25.
theological_decisions:
- issue: Makna וַיְפַלֵּל sehubungan dengan tindakan Pinehas
  choice: Diterjemahkan secara luas sebagai “turun tangan” dalam teks utama.
  alternative: “melaksanakan penghakiman”; atau “berdoa syafaat”
  rationale: Mazmur ini merujuk pada Bilangan 25, tempat tindakan tegas Pinehas menghentikan wabah. Karena verba Ibrani tersebut dapat dipahami dengan nuansa yudisial atau perantaraan, teks utama mempertahankan keluasan maknanya dan catatan kaki menyajikan kemungkinan yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada puitis-naratif yang ringkas dan bermartabat. “Turun tangan” dipilih sebagai ungkapan umum yang mudah dipahami, namun tetap mempertahankan ketegasan tindakan serta ambiguitas verba sumber.
