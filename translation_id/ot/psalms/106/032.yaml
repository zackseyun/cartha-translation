  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: id
  text: Mereka membangkitkan murka di air Meriba[a], dan Musa tertimpa malapetaka karena mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba berarti “pertengkaran” atau “perselisihan.”
    reason: cultural_note
  - marker: b
    text: 'Atau: “Mereka membuat Dia murka di air Meriba, dan Musa tertimpa malapetaka karena mereka.” Bahasa Ibrani tidak menyebutkan secara eksplisit siapa yang dibuat murka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  choice: membangkitkan murka
  rationale: Bentuk kausatif dari קצף menyatakan bahwa mereka menyebabkan timbulnya murka. Ungkapan ini mempertahankan daya kausatif tanpa menyebut secara eksplisit siapa yang murka, sebagaimana teks Ibrani juga tidak menyatakannya.
- source_word: עַל
  choice: di
  rationale: Dalam frasa yang menunjuk lokasi atau peristiwa, 'di' secara alami menyatakan tempat terjadinya tindakan.
- source_word: מֵי מְרִיבָה
  choice: mata air Meriba
  rationale: Meriba dipertahankan sebagai nama tempat. Dalam konteks kisah padang gurun, 'mata air Meriba' merupakan ungkapan Indonesia yang alami untuk perairan di lokasi itu.
- source_word: וַיֵּרַע לְמֹשֶׁה
  choice: Musa mengalami kemalangan
  rationale: Ungkapan ini menyampaikan akibat buruk yang menimpa Musa tanpa memberi kesan bahwa kata 'buruk' menggambarkan watak moral Musa.
- source_word: בַּעֲבוּרָם
  choice: akibat perbuatan mereka
  rationale: Frasa ini menyatakan sebab. Pilihan ini memperjelas bahwa akibat buruk bagi Musa berkaitan dengan tindakan mereka, tanpa menguraikan lebih jauh kadar kesalahan masing-masing.
theological_decisions:
- issue: Hakikat akibat buruk yang dialami Musa
  choice: Ayat menyatakan bahwa tindakan umat berujung pada kemalangan bagi Musa, tanpa merinci penjelasan teologis lengkapnya dalam baris ini.
  alternative: Ayat ini dapat dipahami terutama sebagai rujukan kepada dosa Musa di Meriba, atau terutama sebagai penekanan pada kesalahan umat.
  rationale: Teks Ibrani mempertahankan ketegangan antara provokasi umat dan tanggung jawab Musa. Terjemahan tidak memutuskan secara sepihak letak penekanan yang baru dijelaskan oleh konteks yang lebih luas.
- issue: Objek murka dalam וַיַּקְצִיפוּ
  choice: Objek tidak disebutkan dalam teks utama.
  alternative: Mereka membuat Dia murka di mata air Meriba.
  rationale: Bahasa Ibrani tidak menyatakan objek secara eksplisit pada baris ini. Catatan kaki menyediakan pembacaan yang melengkapi Allah sebagai objek tanpa memasukkannya secara pasti ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Membangkitkan murka' mempertahankan ketidakjelasan objek dalam bahasa Ibrani, sedangkan 'mengalami kemalangan' menyampaikan akibat buruk secara alami tanpa menambahkan penilaian moral.
