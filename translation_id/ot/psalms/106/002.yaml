source:
  edition: WLC
  text: מִ֗י יְ֭מַלֵּל גְּבוּר֣וֹת יְהוָ֑ה יַ֝שְׁמִ֗יעַ כָּל תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/002.yaml
  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: id
  text: Siapakah yang sanggup menceritakan perbuatan-perbuatan perkasa Yahweh, atau memberitakan segala pujian bagi-Nya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memperdengarkan seluruh pujian-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יְמַלֵּל
  choice: Siapakah yang sanggup menceritakan
  rationale: Kata tanya מִי membuka pertanyaan retoris tentang kemampuan manusia, sedangkan bentuk piel יְמַלֵּל berarti menuturkan atau menceritakan. “Sanggup menceritakan” menyampaikan daya retoris dan makna verba secara alami.
- source_word: גְּבוּרוֹת
  choice: perbuatan-perbuatan perkasa
  rationale: Bentuk jamak ini menunjuk pada tindakan yang memperlihatkan kekuatan. Pilihan ini mempertahankan sifat konkret dan bentuk jamak sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: יַשְׁמִיעַ
  choice: memberitakan
  rationale: Bentuk hifil dari שמע secara harfiah berarti “membuat terdengar”. Dalam konteks pernyataan terbuka, “memberitakan” mengungkapkan makna kausatif itu dengan bahasa Indonesia yang wajar.
- source_word: כָּל תְּהִלָּתוֹ
  choice: segala pujian bagi-Nya
  rationale: כָּל mempertahankan cakupan menyeluruh, sedangkan תְּהִלָּתוֹ adalah bentuk tunggal kolektif dengan sufiks orang ketiga. “Segala pujian bagi-Nya” alami dalam bahasa Indonesia dan menyatakan seluruh pujian yang patut diberikan kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan “segala pujian bagi-Nya”
  choice: Mempertahankan pernyataan total sebagai pertanyaan retoris
  alternative: Menjelaskannya sebagai ketidakmampuan mutlak manusia untuk memuji Allah dengan cukup
  rationale: Ayat menekankan keluasan tindakan perkasa dan pujian Yahweh, tetapi tidak merumuskan doktrin terperinci tentang batas kemampuan manusia. Terjemahan membiarkan daya dan ketegangan pertanyaan retoris tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Siapakah” dan “sanggup” mempertahankan nada puitis-retoris; pengulangan “perbuatan-perbuatan” mempertahankan bentuk jamak Ibrani. Kapitalisasi pada “-Nya” mengikuti kebiasaan penghormatan dalam penulisan religius Indonesia.
