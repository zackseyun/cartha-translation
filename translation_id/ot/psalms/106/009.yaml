  text: He rebuked the Red Sea[a], and it dried up; he led them through the depths as through the wilderness.
translation:
  language: id
  text: Ia menghardik Laut Merah[a], dan laut itu menjadi kering; Ia menuntun mereka melalui kedalaman laut seperti melalui padang gurun.
  philosophy: optimal-equivalence
