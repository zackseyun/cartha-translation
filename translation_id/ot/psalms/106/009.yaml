lexical_decisions:
- source_word: וַיִּגְעַר
  choice: menghardik
  rationale: Kata גער berarti menegur atau menghardik. Dalam gambaran puitis tentang kuasa Allah atas air, “menghardik” mempertahankan personifikasi yang kuat.
- source_word: בְּיַם סוּף
  choice: Laut Merah
  rationale: יַם סוּף adalah nama Ibrani bagi laut dalam kisah keluaran. “Laut Merah” merupakan sebutan baku dan langsung menghubungkan ayat ini dengan peristiwa tersebut; arti harfiahnya dicatat dalam catatan kaki.
- source_word: וַיֶּחֱרָב
  choice: laut itu menjadi kering
  rationale: Bentuk kata kerja dari חרב menyatakan bahwa laut menjadi kering. Pengulangan “laut itu” memperjelas rujukan dalam bahasa Indonesia.
- source_word: וַיּוֹלִיכֵם
  choice: Ia menuntun mereka
  rationale: Bentuk Hifil dari הלך menyatakan tindakan membuat atau membawa seseorang berjalan; “menuntun” menyampaikan tindakan dan pengarahan ilahi secara alami.
- source_word: בַּתְּהֹמוֹת
  choice: melintasi samudra raya
  rationale: Bentuk jamak תְּהֹמוֹת menunjuk pada kedalaman air yang dahsyat. “Samudra raya” mempertahankan daya puitisnya, sedangkan “melintasi” sesuai dengan gerak yang dinyatakan oleh kata kerja sebelumnya.
- source_word: כַּמִּדְבָּר
  choice: seperti melintasi padang gurun
  rationale: Ungkapan ini membandingkan perjalanan menembus kedalaman laut dengan perjalanan melintasi tanah lapang yang kering. Pengulangan “melintasi” membuat hubungan perbandingan jelas dan alami.
theological_decisions:
- issue: Penerjemahan יַם סוּף dalam kias balik kepada peristiwa keluaran
  choice: Laut Merah
  alternative: Laut Teberau
  rationale: “Laut Merah” adalah nama yang paling dikenal dalam tradisi Alkitab bahasa Indonesia dan menandai rujukan kepada peristiwa keluaran. Namun, unsur סוּף secara harfiah dapat merujuk pada teberau, sehingga alternatif itu dipertahankan dalam catatan kaki.
