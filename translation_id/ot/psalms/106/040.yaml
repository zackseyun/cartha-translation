  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
translation:
  language: id
  text: Maka murka Yahweh menyala terhadap umat-Nya, dan Ia muak terhadap warisan-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: menyala murka
  rationale: Gabungan חרה dan אַף merupakan ungkapan tentang murka yang menjadi panas atau menyala. Pilihan ini mempertahankan metafora panas dan tetap wajar dalam ragam Alkitab bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: בְּעַמּוֹ
  choice: terhadap umat-Nya
  rationale: Dalam konstruksi dengan kata yang menyatakan murka, preposisi ב menandai sasaran murka. 'Terhadap' menyampaikan hubungan ini secara alami.
- source_word: וַיְתָעֵב
  choice: Ia merasa muak
  rationale: Kata תעב menyatakan rasa jijik atau penolakan yang kuat. 'Merasa muak' jelas bagi pembaca modern dan mempertahankan daya ungkapnya.
- source_word: נַחֲלָתוֹ
  choice: milik pusaka-Nya
  rationale: נחלה berarti warisan, bagian yang diperoleh, atau milik pusaka. Dalam konteks ini sebutan tersebut menunjuk kepada Israel sebagai milik khusus Yahweh dan mempertahankan nuansa perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama pribadi ilahi. Transliterasi 'Yahweh' mempertahankannya tanpa menggantinya dengan gelar.
- issue: Bahasa antropopatik tentang murka ilahi
  choice: menyala murka Yahweh
  alternative: Yahweh menjadi marah
  rationale: Teks memakai metafora panas yang kuat. Metafora itu dipertahankan agar gambaran mengenai penghakiman perjanjian tidak diperlemah atau dijelaskan secara teologis melampaui teks.
- issue: Israel sebagai נחלה Yahweh
  choice: milik pusaka-Nya
  alternative: warisan-Nya atau kepunyaan-Nya
  rationale: Pilihan ini menjaga metafora bahwa umat merupakan bagian atau milik pusaka Yahweh, tanpa meratakannya menjadi sekadar kepunyaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa mengikuti kesejajaran Ibrani secara alami. Huruf kapital pada pronomina ilahi digunakan sesuai kebiasaan luas dalam ragam Alkitab Indonesia.
