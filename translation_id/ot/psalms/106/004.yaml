source:
  edition: WLC
  text: זָכְרֵ֣/נִי יְ֭הוָה בִּ/רְצ֣וֹן עַמֶּ֑/ךָ פָּ֝קְדֵ֗/נִי בִּ/ישׁוּעָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/004.yaml
  text: Remember me[a], O Yahweh, when you show favor to your people[b]; attend to me with your salvation.
translation:
  language: id
  text: Ingatlah aku, ya Yahweh, ketika Engkau berkenan kepada umat-Mu[a]; perhatikanlah aku[b] dengan keselamatan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan perkenanan terhadap umat-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “lawatilah aku.” Kata Ibrani dapat berarti memperhatikan atau mendatangi seseorang untuk bertindak baginya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרֵנִי
  choice: Ingatlah aku
  rationale: Bentuk imperatif Qal dengan sufiks orang pertama tunggal menyampaikan permohonan langsung agar Yahweh mengingat pemazmur; terjemahan ini mempertahankan bentuk dan daya doanya tanpa tambahan tafsiran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: ketika Engkau berkenan kepada umat-Mu
  rationale: 'רָצוֹן menunjuk pada perkenanan atau kemurahan. Dalam konteks doa, preposisi בְּ dapat dipahami secara temporal-sirkumstansial: pemazmur memohon agar diingat ketika Allah menunjukkan perkenanan kepada umat-Nya. Catatan kaki mempertahankan kemungkinan konstruksi yang lebih formal.'
- source_word: פָּקְדֵנִי
  choice: perhatikanlah aku
  rationale: Dalam permohonan kepada Allah, פקד dapat berarti mengindahkan, memperhatikan, atau mendatangi untuk bertindak bagi seseorang. 'Perhatikanlah aku' alami dalam bahasa Indonesia dan menyiratkan perhatian yang menghasilkan tindakan, sedangkan alternatif yang lebih harfiah dicatat.
- source_word: בִּישׁוּעָתֶךָ
  choice: dengan keselamatan-Mu
  rationale: יְשׁוּעָה berarti keselamatan atau pembebasan. Terjemahan ini mempertahankan nomina dan preposisinya serta tidak mempersempit maknanya menjadi pertolongan sesaat saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Makna בִּרְצוֹן עַמֶּךָ
  choice: ketika Engkau berkenan kepada umat-Mu
  alternative: dengan perkenanan terhadap umat-Mu
  rationale: Pembacaan temporal-sirkumstansial menghasilkan bahasa Indonesia yang jelas dan sesuai dengan permohonan agar pemazmur ikut menerima tindakan penuh kemurahan Allah kepada umat-Nya. Kemungkinan hubungan instrumental atau asosiatif tetap diberikan dalam catatan kaki.
- issue: Nuansa tindakan dalam פָּקְדֵנִי
  choice: perhatikanlah aku
  alternative: lawatilah aku
  rationale: Kata Ibrani dapat menunjuk pada perhatian ilahi yang diwujudkan dalam tindakan, bukan sekadar kunjungan secara tempat. Pilihan utama menyampaikan permohonan akan kepedulian aktif tanpa menentukan bentuk tindakan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'ya Yahweh' mempertahankan nada doa; kapitalisasi pronomina ilahi mengikuti kebiasaan penulisan religius Indonesia. Susunan kalimat dibuat alami sambil mempertahankan kesejajaran kedua permohonan Ibrani.
