  source_fidelity: 'Teks Indonesia menyampaikan dengan setia tiga permohonan Ibrani: זָכְרֵנִי sebagai “Ingatlah aku,” בִּרְצוֹן עַמֶּךָ dalam pembacaan temporal-sirkumstansial “ketika Engkau berkenan kepada umat-Mu,” dan פָּקְדֵנִי sebagai permohonan perhatian ilahi yang aktif. “Dengan keselamatan-Mu” mempertahankan nomina יְשׁוּעָה dan sufiks milik orang kedua. Tidak ada penambahan doktrinal atau penyempitan makna yang tidak perlu.'
