base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: id
  text: Aku mencari Yahweh, dan Ia menjawabku; Ia melepaskanku dari segala ketakutanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari segala yang kutakuti” atau “dari segala kengerianku.”
    reason: Kata Ibrani מְגוּרוֹתַי dapat menunjuk pada rasa takut, hal-hal yang ditakuti, atau berbagai kengerian.
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: Aku mencari
  rationale: Dalam konteks ini, דרשׁ berarti mencari Yahweh melalui doa dan ketergantungan kepada-Nya, bukan sekadar meminta informasi. "Aku mencari" alami, ringkas, dan sesuai dengan gaya kesaksian mazmur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama pribadi "Yahweh", bukan diganti dengan gelar.
- source_word: וְעָנָנִי
  choice: dan Dia menjawab aku
  rationale: Bentuk ענה dengan akhiran orang pertama tunggal berarti bahwa Yahweh menjawab pemazmur. Penyebutan "Dia" membuat subjeknya jelas dalam bahasa Indonesia.
- source_word: מִכָּל
  choice: dari segala
  rationale: Gabungan מן dan כל menyatakan pelepasan yang menyeluruh dari semua hal dalam kategori yang disebutkan.
- source_word: מְגוּרוֹתַי
  choice: segala ketakutanku
  rationale: Dalam konteks ini, kata tersebut menunjuk pada ketakutan, kengerian, atau hal-hal yang ditakuti pemazmur, bukan tempat-tempat persinggahan. "Segala ketakutanku" merupakan ungkapan Indonesia yang alami sambil tetap mempertahankan keluasan maknanya; alternatif yang lebih konkret dicatat dalam catatan kaki.
- source_word: הִצִּילָנִי
  choice: Dia melepaskan aku
  rationale: Bentuk kausatif נצל menyatakan tindakan membebaskan atau menyelamatkan seseorang dari bahaya. "Melepaskan aku" mempertahankan makna luas itu tanpa membatasinya pada penyelamatan fisik.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Bentuk "Yahweh" mempertahankan nama pribadi Allah Israel dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Paralelisme kesaksian pribadi dipertahankan melalui dua klausa dengan subjek orang pertama, sedangkan titik koma mencerminkan hubungan erat antara jawaban Yahweh dan tindakan-Nya melepaskan pemazmur.
