id: PSA.34.21
reference: Psalms 34:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה וְ/שֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/021.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
translation:
  language: id
  text: Kejahatan[a] akan membunuh orang fasik, dan mereka yang membenci orang benar akan dinyatakan bersalah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Malapetaka akan membunuh orang fasik.” Kata Ibrani רָעָה dapat berarti “kejahatan”, “bahaya”, atau “malapetaka/bencana”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: akan membunuh
  rationale: Bentuk Hifil imperfek orang ketiga feminin tunggal dari מות menyatakan sebab kematian, dengan רָעָה sebagai subjek. “Akan membunuh” menyampaikan daya kausatif itu secara alami dalam bahasa Indonesia.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva tunggal yang dipakai secara substantival. “Orang fasik” mempertahankan bentuk tunggal representatif dan merupakan ungkapan Alkitabiah yang tetap dipahami dalam bahasa Indonesia modern.
- source_word: רָעָה
  choice: kejahatan
  rationale: Kata ini dapat berarti kejahatan moral, bahaya, atau malapetaka. “Kejahatan” mempertahankan ungkapan Ibrani yang ringkas serta kemungkinan ironi bahwa kejahatan itu sendiri membunuh orang fasik; kemungkinan makna “malapetaka” dicatat dalam catatan kaki.
- source_word: שֹׂנְאֵי
  choice: mereka yang membenci
  rationale: Partisipel Qal jamak konstruksi dari שׂנא. Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan gambaran tentang ciri atau sikap yang berlangsung.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva tunggal yang dipakai secara substantival. “Orang benar” mempertahankan bentuk tunggal representatif tanpa menambahkan penentuan identitas yang tidak terdapat dalam teks.
- source_word: יֶאְשָׁמוּ
  choice: akan dinyatakan bersalah
  rationale: Bentuk Qal imperfek orang ketiga jamak dari אשם menyatakan keadaan menanggung atau terkena kesalahan. “Akan dinyatakan bersalah” menyampaikan nuansa forensik dan pertanggungjawaban tanpa mempersempitnya menjadi bentuk hukuman tertentu.
theological_decisions:
- issue: Apakah רָעָה berarti kejahatan moral atau malapetaka yang menimpa
  choice: kejahatan
  alternative: malapetaka
  rationale: '“Kejahatan” menjaga ketegangan dan permainan moral dalam teks: kejahatan dipersonifikasikan sebagai sesuatu yang membunuh orang fasik. Karena “malapetaka” juga mungkin secara leksikal dan kontekstual, alternatif itu dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Paralelisme dua klausa dipertahankan. Istilah “orang fasik” dan “orang benar” dipakai sebagai kategori moral tunggal yang representatif; “dinyatakan bersalah” menjaga nuansa pertanggungjawaban hukum dari kata Ibrani.
