source:
  edition: WLC
  text: כְּ֭פִירִים רָשׁ֣וּ וְ/רָעֵ֑בוּ וְ/דֹרְשֵׁ֥י יְ֝הוָ֗ה לֹא יַחְסְר֥וּ כָל טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: id
  text: 'Singa-singa muda mengalami kekurangan dan kelaparan,[a]

    tetapi orang-orang yang mencari Yahweh tidak kekurangan sesuatu pun yang baik.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi miskin dan lapar.” Verba Ibrani yang pertama dapat berarti berada dalam kekurangan atau menjadi miskin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  choice: singa-singa muda
  rationale: Kata ini menunjuk kepada singa muda yang kuat, bukan anak singa yang masih kecil atau singa secara umum. Ungkapan ini mempertahankan gambaran tentang pemangsa kuat yang tampaknya paling tidak mungkin kekurangan makanan.
- source_word: רָשׁוּ
  choice: berkekurangan
  rationale: Verba ini menyatakan keadaan serba kekurangan atau menjadi miskin. 'Berkekurangan' alami dalam bahasa Indonesia dan tidak sekadar mengulangi gagasan 'kelaparan' pada verba berikutnya.
- source_word: וְרָעֵבוּ
  choice: dan kelaparan
  rationale: Verba ini berarti mengalami rasa lapar. 'Kelaparan' mempertahankan kesejajaran puitis secara ringkas dan jelas.
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: tetapi orang-orang yang mencari Yahweh
  rationale: Bentuk partisipial ini menggambarkan orang yang bercirikan tindakan mencari, memohon petunjuk, atau berpaling kepada Yahweh. 'Orang-orang yang mencari' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan keluasan maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: לֹא יַחְסְרוּ
  choice: tidak kekurangan
  rationale: Bentuk imperfek di sini paling wajar dipahami sebagai kebenaran umum atau jaminan bernada amsal. Bentuk kini 'tidak kekurangan' mempertahankan nuansa tersebut tanpa memaksanya menjadi janji yang hanya berorientasi pada masa depan.
- source_word: כָל טוֹב
  choice: sesuatu pun yang baik
  rationale: Ungkapan Ibrani menyampaikan cakupan 'segala/apa pun yang baik'. Dalam konstruksi negatif bahasa Indonesia, 'tidak kekurangan sesuatu pun yang baik' menyatakan cakupan menyeluruh dengan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama perjanjian sebagai nama pribadi dan tidak menggantinya dengan gelar seperti 'TUHAN'.
- issue: Cakupan jaminan bahwa para pencari Yahweh tidak kekurangan
  choice: tidak kekurangan sesuatu pun yang baik
  alternative: tidak akan kekurangan segala yang baik
  rationale: Terjemahan mempertahankan pernyataan menyeluruh dalam teks tanpa menjelaskan secara tambahan apa yang termasuk 'baik'. Dengan demikian, ketegangan teologis mengenai pemeliharaan Allah dan pengalaman kekurangan tidak diselesaikan secara diam-diam oleh penerjemah.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Larik dibagi menurut pertentangan paralel dalam puisi Ibrani. Pengulangan 'kekurangan' dipertahankan karena menghubungkan keadaan singa muda dengan jaminan bagi orang yang mencari Yahweh.
