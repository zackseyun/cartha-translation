  text: בַּ֭/יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑/י יִשְׁמְע֖וּ עֲנָוִ֣ים וְ/יִשְׂמָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: id
  text: Jiwaku bermegah dalam Yahweh; orang-orang yang rendah hati[a] mendengarnya dan bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang tertindas” atau “orang-orang yang lemah lembut” untuk “orang-orang yang rendah hati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: Dalam Yahweh
  rationale: Preposisi ב menunjukkan lingkup atau dasar kemegahan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: תִּתְהַלֵּל
  choice: akan bermegah
  rationale: Bentuk Hitpael dari הלל di sini berarti bermegah atau membanggakan diri; bentuk imperfek mendukung nuansa pernyataan yang berorientasi ke depan.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Mempertahankan ungkapan puitis Ibrani נֶפֶשׁ, yang di sini menunjuk pada diri pribadi secara utuh.
- source_word: יִשְׁמְעוּ
  choice: akan mendengarnya
  rationale: Qal imperfek dari שמע berarti “mendengar”; akhiran “-nya” membuat objek yang tersirat—kemegahan atau pernyataan pemazmur—jelas secara alami dalam bahasa Indonesia.
- source_word: עֲנָוִים
  choice: orang-orang yang rendah hati
  rationale: Istilah ini dapat menunjuk kepada orang yang rendah hati, lemah lembut, atau tertindas. Pilihan utama mempertahankan nuansa sikap batin tanpa meniadakan dimensi kerendahan keadaan.
- source_word: וְיִשְׂמָחוּ
  choice: dan bersukacita
  rationale: שמח menyatakan kegembiraan; “bersukacita” sesuai dengan ragam puitis yang bermartabat dan mempertahankan hubungan berurutan dengan tindakan mendengar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna עֲנָוִים
  choice: orang-orang yang rendah hati
  alternative: orang-orang yang tertindas; orang-orang yang lemah lembut
  rationale: Kata ini memuat ketegangan antara keadaan sosial yang rendah atau tertindas dan sikap rendah hati. Teks utama memakai padanan yang luas, sementara catatan mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, jelas, dan bermartabat. Susunan “Dalam Yahweh” dipertahankan untuk menonjolkan dasar kemegahan sebagaimana dalam teks Ibrani.
