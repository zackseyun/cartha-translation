  source_fidelity: 'Terjemahan dengan tepat mencerminkan unsur-unsur utama teks Ibrani: חֹנֶה sebagai “berkemah,” מַלְאַךְ יְהוָה sebagai “Malaikat Yahweh,” סָבִיב sebagai “di sekeliling,” לִירֵאָיו sebagai “orang-orang yang takut kepada-Nya,” dan וַיְחַלְּצֵם sebagai “dan menyelamatkan mereka.” Citra perlindungan melalui kemah dan tindakan penyelamatan tetap terpelihara tanpa menambahkan penafsiran tentang identitas malaikat itu.'
