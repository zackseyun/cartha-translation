source:
  edition: WLC
  text: חֹנֶ֤ה מַלְאַךְ יְהוָ֓ה סָ֘בִ֤יב לִֽ/ירֵאָ֗י/ו וַֽ/יְחַלְּצֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/007.yaml
  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: id
  text: Malaikat Yahweh berkemah di sekeliling orang-orang yang takut kepada-Nya[a], dan menyelamatkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.” Kata Ibrani מַלְאָךְ dapat berarti “utusan” atau “malaikat”, meskipun “malaikat” lebih mungkin dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: berkemah
  rationale: Partisipel Qal dari חנה menyatakan tindakan berkemah. Pilihan ini mempertahankan gambaran perlindungan seperti pasukan yang mendirikan kemah, sekaligus alami dalam bahasa Indonesia.
- source_word: מַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat, tetapi dalam gabungan ini makna makhluk surgawi paling wajar. Nama ilahi יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: סָבִיב
  choice: di sekeliling
  rationale: Ungkapan ini mempertahankan gambaran posisi yang mengitari dan melindungi.
- source_word: לִירֵאָיו
  choice: orang-orang yang takut kepada-Nya
  rationale: Frasa ini menunjuk kepada mereka yang bercirikan takut kepada Yahweh. 'Takut kepada' mempertahankan ungkapan alkitabiah yang mencakup rasa gentar dan hormat.
- source_word: וַיְחַלְּצֵם
  choice: dan menyelamatkan mereka
  rationale: Dalam konteks ini חלץ berarti melepaskan atau menyelamatkan dari bahaya. 'Menyelamatkan' jelas dan sesuai dengan gambaran perlindungan.
theological_decisions:
- issue: Apakah מַלְאַךְ יְהוָה diterjemahkan sebagai 'malaikat Yahweh' atau 'utusan Yahweh', dan apakah identitasnya perlu ditentukan lebih jauh.
  choice: Malaikat Yahweh, tanpa menentukan identitasnya lebih jauh.
  alternative: Utusan Yahweh; atau penafsiran khusus sebagai penampakan ilahi.
  rationale: Konteks paling alami mendukung 'malaikat', tetapi kemungkinan leksikal 'utusan' dicatat. Teks tidak secara eksplisit mengidentifikasi sosok ini lebih jauh, sehingga ketegangan teologisnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berkemah di sekeliling' mempertahankan citra spasial dan perlindungan; huruf kapital pada '-Nya' mengikuti kebiasaan penulisan rujukan kepada Allah dalam bahasa Indonesia.
