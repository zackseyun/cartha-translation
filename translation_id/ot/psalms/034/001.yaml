  text: אֲבָרֲכָ֣ה אֶת יְהוָ֣ה בְּ/כָל עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥/וֹ בְּ/פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: id
  text: Aku hendak memuji Yahweh[a] setiap saat; pujian kepada-Nya senantiasa ada di mulutku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (יהוה); dalam terjemahan ini ditulis “Yahweh”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks Ibrani dan bentuk yang digunakan dalam terjemahan ini tanpa menetapkan pelafalan historis yang diperdebatkan.
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: Aku hendak memuji
  rationale: Bentuk orang pertama tunggal dengan he paragogis mengungkapkan tekad atau kehendak. Ketika objeknya Allah, ברך paling alami diterjemahkan “memuji” dalam bahasa Indonesia, sebab “memberkati Allah” dapat disalahpahami sebagai manusia memberikan berkat kepada-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: בְּכָל עֵת
  choice: setiap waktu
  rationale: Ungkapan ini menyatakan bahwa pujian diberikan dalam segala keadaan dan sepanjang waktu; “setiap waktu” alami sekaligus dekat dengan bentuk Ibraninya.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Adverbia ini menegaskan kesinambungan pujian dan mempertahankan kesejajaran puitis dengan “setiap waktu” tanpa pengulangan kata yang kaku.
- source_word: תְּהִלָּתוֹ
  choice: pujian kepada-Nya
  rationale: Sufiks orang ketiga maskulin tunggal menunjuk kepada Yahweh. “Pujian kepada-Nya” menyampaikan bahwa Dia adalah sasaran atau pokok pujian dan menghindari kemungkinan salah paham bahwa “pujian-Nya” berarti pujian yang Dia ucapkan.
- source_word: בְּפִי
  choice: di mulutku
  rationale: Terjemahan ini mempertahankan gambaran konkret bahasa Ibrani tentang pujian yang terus diucapkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankannya sebagai nama dan tidak menggantinya dengan gelar, sementara catatan kaki menjelaskan bentuk Ibraninya.
- issue: Makna manusia 'memberkati' Allah
  choice: memuji
  alternative: memberkati
  rationale: ברך secara leksikal dapat berarti “memberkati”, tetapi ketika manusia melakukannya kepada Allah, maksud kontekstualnya ialah memuji atau menyatakan Dia terpuji. Pilihan ini menghindari kesan bahwa manusia menganugerahkan berkat kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. “Aku hendak” menyatakan tekad puitis; “senantiasa” mempertahankan nada mazmur. Penanda catatan kaki ditempatkan langsung sesudah “Yahweh” karena catatan itu menerangkan nama ilahi.
