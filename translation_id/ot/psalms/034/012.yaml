lexical_decisions:
- source_word: מִי הָאִישׁ
  choice: Siapakah orang
  rationale: Pertanyaan retoris Ibrani ini dibuka dengan מִי. Kata אִישׁ berbentuk maskulin tunggal, tetapi di sini berfungsi secara representatif; dalam bahasa Indonesia, “orang” menyampaikan cakupan generiknya secara alami tanpa mengubah acuannya.
- source_word: הֶחָפֵץ חַיִּים
  choice: yang mendambakan hidup
  rationale: חפץ menyatakan keinginan atau kesukaan yang kuat. “Mendambakan” mempertahankan unsur hasrat positif, sedangkan חַיִּים secara idiomatis berarti “hidup” atau “kehidupan” meskipun bentuknya jamak.
- source_word: אֹהֵב יָמִים
  choice: yang mencintai hari-hari
  rationale: Terjemahan ini mempertahankan citra dan kesejajaran Ibrani antara “hidup” dan “hari-hari”, tanpa langsung menafsirkannya sebagai “panjang umur” atau menambahkan gagasan “banyak” yang tidak dinyatakan secara eksplisit.
- source_word: לִרְאוֹת טוֹב
  choice: untuk melihat hal yang baik
  rationale: ראה secara langsung berarti “melihat”, tetapi dalam ungkapan ini juga dapat menunjuk pada mengalami atau menikmati. טוֹב dibiarkan luas sebagai “hal yang baik”, tanpa dipersempit menjadi kemakmuran material.
theological_decisions:
- issue: Ungkapan maskulin generik הָאִישׁ
  choice: orang
  alternative: laki-laki
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, pertanyaan hikmat ini ditujukan secara umum. Bahasa Indonesia lazim memakai “orang” untuk menyampaikan fungsi representatif tersebut; pilihan ini tidak membatasi ayat hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern yang bernada puitis dan bermartabat. Susunan dua klausa partisipial dipertahankan untuk mencerminkan kesejajaran puisi Ibrani. Ungkapan “mencintai hari-hari” sengaja mempertahankan citra sumber dan ambiguitasnya, meskipun “mendambakan panjang umur” lebih idiomatis tetapi lebih interpretatif.
