base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/005.yaml
  text: They looked to him and were radiant[b][a], and their faces were not put to shame.
translation:
  language: id
  text: Mereka memandang kepada-Nya[a] dan menjadi berseri-seri[b]; wajah mereka tidak akan menanggung malu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisi bacaan Ibrani di sini terbagi antara “kepada-Nya” dan “kepadaku.” Teks utama mengikuti “kepada-Nya” sesuai konteks; “kepadaku” merupakan bacaan alternatif yang terpelihara.
    reason: textual_variant
  - marker: b
    text: Atau “menjadi bercahaya.” Kata kerja Ibrani ini dapat menyatakan sinar atau cahaya dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: memandang
  rationale: Bentuk Hifil dari נבט menyatakan mengarahkan pandangan kepada seseorang. “Memandang” alami dan cukup puitis tanpa melebihkan intensitas.
- source_word: אֵלָי/ו
  choice: kepada-Nya
  rationale: Tradisi bacaan yang dipilih adalah אֵלָיו, “kepada-Nya,” yang dalam konteks merujuk kepada TUHAN. Varian “kepadaku” dipertahankan dalam catatan kaki.
- source_word: וְנָהָרוּ
  choice: menjadi berseri-seri
  rationale: Dalam konteks wajah dan rasa malu, verba ini paling wajar menyampaikan terang atau sinar yang tampak sebagai hasil dari memandang kepada TUHAN.
- source_word: וּפְנֵיהֶם
  choice: wajah mereka
  rationale: Mempertahankan gambaran konkret bahasa Ibrani dan bentuk jamak posesifnya.
- source_word: אַל יֶחְפָּרוּ
  choice: tidak mendapat malu
  rationale: Di sini אַל dengan bentuk tak selesai paling mungkin menyatakan hasil negatif, bukan larangan. Ungkapan “mendapat malu” mempertahankan dimensi kehinaan atau aib, bukan hanya perasaan malu batin.
theological_decisions:
- issue: Perbedaan ketiv/qere yang tercermin dalam אֵלָי/ו
  choice: kepada-Nya
  alternative: kepadaku
  rationale: Bacaan orang ketiga paling selaras dengan konteks orang-orang yang memandang kepada TUHAN. Namun, bacaan orang pertama sungguh terpelihara dalam tradisi teks dan mengubah sudut pandang penutur, sehingga dicatat dan tidak disingkirkan diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang wajar. Kapital pada enklitik “-Nya” menandai rujukan kepada TUHAN sesuai konteks. Tanda titik koma mempertahankan kesejajaran dua klausa Ibrani.
