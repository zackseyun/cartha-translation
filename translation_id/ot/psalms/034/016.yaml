source:
  edition: WLC
  text: פְּנֵ֣י יְ֭הוָה בְּ/עֹ֣שֵׂי רָ֑ע לְ/הַכְרִ֖ית מֵ/אֶ֣רֶץ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: id
  text: Wajah Yahweh menentang orang-orang yang berbuat jahat,[a] untuk melenyapkan ingatan akan mereka dari bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kehadiran Yahweh menentang orang-orang yang berbuat jahat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dari negeri”, jika אֶרֶץ dipahami secara lebih lokal.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי
  choice: Wajah
  rationale: Secara harfiah berarti “wajah”. Dalam ungkapan ini, kata tersebut menggambarkan kehadiran dan sikap pribadi Yahweh yang diarahkan untuk menentang para pelaku kejahatan. Citra konkret bahasa Ibrani dipertahankan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi yang terdapat dalam teks sumber tetap dipertahankan.
- source_word: בְּעֹשֵׂי רָע
  choice: menentang orang-orang yang berbuat jahat
  rationale: Dalam konteks ini, preposisi בְּ menyatakan arah permusuhan atau perlawanan. Frasa partisipial עֹשֵׂי רָע diterjemahkan secara jelas sebagai “orang-orang yang berbuat jahat”, bukan dipadatkan menjadi sebuah label.
- source_word: לְהַכְרִית
  choice: untuk melenyapkan
  rationale: Infinitif Hifil ini menyatakan tujuan atau hasil dari perlawanan Yahweh. “Melenyapkan” menyampaikan tindakan menghapus sampai tidak tersisa dengan wajar dalam bahasa Indonesia.
- source_word: מֵאֶרֶץ
  choice: dari bumi
  rationale: אֶרֶץ dapat berarti “tanah/negeri” atau “bumi”. Pernyataan hikmat yang bersifat umum dalam konteks ini mendukung cakupan yang lebih luas, yaitu “bumi”, sambil mempertahankan alternatif lokal dalam catatan kaki.
- source_word: זִכְרָם
  choice: ingatan akan mereka
  rationale: Kata benda זֵכֶר dengan sufiks jamak menunjuk pada ingatan atau kenangan mengenai mereka. “Ingatan akan mereka” jelas dan alami, serta mempertahankan mereka sebagai objek yang dikenang.
theological_decisions:
- issue: Ungkapan antropomorfis “wajah Yahweh” sebagai pernyataan perlawanan ilahi
  choice: Citra konkret “Wajah Yahweh” dipertahankan sebagai gambaran kehadiran dan sikap aktif Yahweh yang menentang pelaku kejahatan.
  alternative: Mengabstrakkannya menjadi “Yahweh menentang” atau “Kehadiran Yahweh menentang”.
  rationale: Bahasa Ibrani memakai gambaran tubuh untuk menyatakan sikap ilahi. Mempertahankan “wajah” menjaga daya puitis dan teologis teks tanpa mengharuskan pemahaman bahwa Allah memiliki tubuh jasmani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan citra “wajah”, nama ilahi Yahweh, hubungan tujuan, dan ambiguitas אֶרֶץ.
