base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: id
  text: Mata Yahweh tertuju kepada orang-orang benar, dan telinga-Nya kepada seruan minta tolong mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “permohonan mereka.” Istilah Ibrani ini menunjuk pada seruan yang timbul dari kesesakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: Mata
  rationale: Mempertahankan bentuk jamak konstruktif dan gambaran antropomorfis Ibrani tentang perhatian Yahweh, tanpa menguraikannya menjadi parafrasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֶל
  choice: tertuju kepada / kepada
  rationale: Preposisi ini menyatakan arah atau orientasi. 'Tertuju kepada' menghasilkan ungkapan Indonesia yang alami pada klausa pertama; unsur verbalnya dipahami juga pada klausa kedua sesuai paralelisme puisi.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Adjektiva jamak yang dipakai secara substantival; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan makna moral-perjanjian tanpa menambah penafsiran.
- source_word: וְאָזְנָיו
  choice: dan telinga-Nya
  rationale: Mempertahankan gambaran konkret dan bentuk jamak kolektif yang wajar dalam bahasa Indonesia, sejajar dengan 'mata'.
- source_word: שַׁוְעָתָם
  choice: seruan mereka minta tolong
  rationale: Kata benda Ibrani ini menunjuk pada seruan yang timbul dari kesesakan dan mengharapkan pertolongan, bukan sekadar teriakan biasa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi; 'Yahweh' mempertahankan fungsi nama tersebut.
- issue: Bahasa antropomorfis tentang perhatian Allah
  choice: Mempertahankan 'mata' dan 'telinga'
  alternative: Memparafrasakan sebagai 'Yahweh memperhatikan' dan 'Yahweh mendengarkan'
  rationale: Gambaran anggota tubuh merupakan unsur puitis asli yang menyatakan perhatian dan kesiapan menanggapi; mempertahankannya menghindari penyelesaian interpretatif yang tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Kapital pada pronomina '-Nya' mengikuti kelaziman penulisan religius Indonesia. Elipsis verba pada klausa kedua dipertahankan untuk mencerminkan paralelisme Ibrani.
