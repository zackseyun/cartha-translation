id: PSA.34.3
reference: Psalms 34:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּדְּל֣וּ לַ/יהוָ֣ה אִתִּ֑/י וּ/נְרוֹמְמָ֖ה שְׁמ֣/וֹ יַחְדָּֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/003.yaml
  text: Magnify Yahweh with me[a], and let us exalt his name together.
translation:
  language: id
  text: Muliakanlah Yahweh bersama aku[a]; mari kita meninggikan nama-Nya bersama-sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH.” Dalam banyak terjemahan Indonesia, nama ini secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: Muliakanlah
  rationale: Bentuk imperatif jamak dari גדל di sini mengajak para pendengar mengakui dan menyatakan kebesaran Yahweh dalam pujian. “Muliakanlah” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Allah secara harfiah dibuat lebih besar.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Preposisi ל menandai pihak yang dimuliakan, sedangkan יהוה adalah nama ilahi YHWH; nama itu dipertahankan sebagai “Yahweh”.
- source_word: אִתִּי
  choice: bersama aku
  rationale: Preposisi dengan akhiran orang pertama tunggal mengungkapkan ajakan untuk turut serta bersama pemazmur. “Bersama aku” mempertahankan bentuk pronomina yang lazim dalam bahasa puisi dan ibadah.
- source_word: וּנְרוֹמְמָה
  choice: mari kita meninggikan
  rationale: Bentuk kohortatif orang pertama jamak dari רום menyampaikan ajakan atau dorongan bersama, bukan sekadar pernyataan tentang masa depan.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Terjemahan harfiah ini mempertahankan ungkapan Ibrani tentang nama sebagai penyataan identitas dan kemasyhuran pribadi.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Adverbia ini menekankan tindakan yang dilakukan secara terpadu; “bersama-sama” jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה (YHWH)
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi ilahi, sedangkan “TUHAN” merupakan penggantian tradisional yang dapat dicantumkan sebagai penjelasan dalam catatan kaki.
- issue: Makna bahasa pujian pada גַּדְּלוּ dan וּנְרוֹמְמָה
  choice: Muliakanlah ... mari kita meninggikan
  alternative: Nyatakanlah kebesaran ... mari kita menjunjung tinggi
  rationale: Pilihan ini mempertahankan kesejajaran dua ajakan untuk memuji tanpa mengartikan bahwa manusia secara ontologis menambah kebesaran Allah.
translation_notes:
  register: Bahasa Indonesia modern yang luhur namun mudah dipahami. Paralelisme puisi Ibrani dipertahankan melalui dua ajakan yang seimbang; “bersama aku” dipilih untuk register puitis, dan “bersama-sama” mempertahankan penekanan penutup ayat.
