base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: id
  text: Mari, anak-anak[a], dengarkanlah aku; Aku akan mengajarkan kepadamu tentang takut akan Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki”; dalam sapaan khas sastra hikmat, istilah ini kemungkinan ditujukan kepada para murid secara umum.
    reason: lexical_alternative
  - marker: b
    text: “Takut akan Yahweh” adalah ungkapan dalam sastra hikmat yang mencakup rasa gentar dan hormat yang mendalam, serta ketaatan yang semestinya di hadapan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Mari
  rationale: Walaupun berasal dari verba yang berarti ‘pergi/berjalan’, dalam sapaan langsung bentuk ini berfungsi sebagai ajakan. ‘Mari’ menyampaikan fungsi idiomatis itu secara wajar dalam bahasa Indonesia.
- source_word: בָנִים
  choice: anak-anak
  rationale: Secara harfiah berarti ‘anak-anak lelaki’, tetapi dalam gaya sastra hikmat kata ini merupakan sapaan kepada para murid atau orang muda secara umum. ‘Anak-anak’ mempertahankan nada pengajaran tanpa membatasi sapaan hanya kepada laki-laki.
- source_word: שִׁמְעוּ לִי
  choice: dengarkanlah aku
  rationale: Ungkapan ini menyerukan perhatian dan ketaatan, bukan sekadar kemampuan mendengar. Partikel ‘-lah’ mempertahankan daya imperatif dengan nada ajakan yang wajar.
- source_word: יִרְאַת יְהוָה
  choice: takut akan Yahweh
  rationale: Ungkapan hikmat ini mencakup rasa gentar, hormat, dan ketaatan di hadapan Allah. Kata ‘takut’ dipertahankan agar bobot dan ketegangan makna Ibraninya tidak dipersempit menjadi ‘hormat’ saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan sebagai ‘Yahweh’ untuk mempertahankan nama perjanjian yang dinyatakan secara langsung.
- source_word: אֲלַמֶּדְכֶם
  choice: akan kuajarkan kepadamu
  rationale: Bentuk piel imperfek dalam konteks ini menyatakan maksud pembicara untuk mengajar. Susunan ini alami dalam bahasa Indonesia dan tetap menonjolkan isi yang akan diajarkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna יִרְאַת יְהוָה
  choice: takut akan Yahweh
  alternative: hormat kepada Yahweh; rasa takut akan Yahweh
  rationale: ‘Takut’ mempertahankan keluasan ungkapan hikmat ini, yang meliputi rasa gentar, kekaguman penuh hormat, dan ketaatan. ‘Hormat’ saja akan terlalu melunakkan maknanya, sedangkan ‘rasa takut’ dapat terdengar hanya menunjuk pada emosi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Mari’ memberi nada undangan; ‘dengarkanlah’ mempertahankan seruan untuk memperhatikan. Susunan ‘akan kuajarkan kepadamu’ bernuansa puitis ringan yang sesuai dengan Mazmur tanpa menjadi kuno.
