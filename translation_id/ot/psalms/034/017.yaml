id: PSA.34.17
reference: Psalms 34:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: צָעֲק֣וּ וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗/ם הִצִּילָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: id
  text: Mereka berseru, dan Yahweh mendengar; Ia membebaskan mereka dari segala kesesakan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָעֲקוּ
  choice: Mereka berseru
  rationale: Bentuk Qal perfektum orang ketiga jamak dari צעק menyatakan seruan mendesak untuk meminta pertolongan. “Berseru” alami, ringkas, dan sesuai dengan konteks doa dalam kesesakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: שָׁמֵעַ
  choice: mendengar
  rationale: Walaupun secara morfologis merupakan partisip, dalam rangkaian puitis yang diapit bentuk-bentuk perfektum kata ini paling wajar dipahami sebagai tindakan lampau dalam bahasa Indonesia.
- source_word: מִכָּל
  choice: dari segala
  rationale: Gabungan מן dan כל menunjukkan pembebasan dari keseluruhan lingkup kesesakan mereka; “dari segala” tepat dan idiomatis.
- source_word: צָרוֹתָם
  choice: kesesakan mereka
  rationale: צרה menunjuk pada keadaan sempit, tekanan, atau kesulitan berat. “Kesesakan” mempertahankan daya puitis dan nuansa penderitaan yang mendesak.
- source_word: הִצִּילָם
  choice: membebaskan mereka
  rationale: Bentuk Hifil dari נצל berarti melepaskan atau menyelamatkan dari bahaya. “Membebaskan” menyampaikan tindakan mengeluarkan mereka dari kesesakan tanpa mempersempit maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih bentuk transliterasi alternatif.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat, dengan kesejajaran puitis antara seruan, pendengaran ilahi, dan pembebasan. Tanda titik koma menandai peralihan dari Yahweh yang mendengar kepada tindakan-Nya membebaskan.
