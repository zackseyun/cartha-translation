  text: זֶ֤ה עָנִ֣י קָ֭רָא וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗י/ו הוֹשִׁיעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: id
  text: Orang miskin ini[a] berseru, dan Yahweh mendengar; Ia menyelamatkannya[b] dari segala kesesakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang yang menderita ini” atau “orang yang rendah hati ini.” Kata Ibrani עָנִי dapat menunjuk kepada kemiskinan, penderitaan, atau kerendahan hati.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “melepaskannya” atau “membebaskannya.” Kata kerjanya menyatakan penyelamatan dari bahaya atau kesesakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: ini
  rationale: Kata penunjuk ini menunjuk kepada orang yang sedang memberi kesaksian, yaitu pemazmur sendiri, sambil memungkinkan penerapan yang lebih luas.
- source_word: עָנִי
  choice: orang yang tertindas
  rationale: Kata ini dapat menunjuk kepada orang miskin, menderita, tertindas, atau rendah hati. Dalam konteks seruan dari kesesakan, 'orang yang tertindas' menonjolkan penderitaan tanpa membatasi maknanya pada kemiskinan materi.
- source_word: קָרָא
  choice: berseru
  rationale: Dalam konteks kesesakan dan pertolongan ilahi, kata kerja ini menyatakan panggilan yang mendesak, bukan sekadar memanggil secara netral.
- source_word: יהוה
  choice: Yahweh
  rationale: Nama perjanjian Allah dialihaksarakan sebagai 'Yahweh', sesuai dengan bentuk nama ilahi dalam teks Ibrani.
- source_word: שָׁמֵעַ
  choice: mendengar
  rationale: Bentuk lampau ini melanjutkan kesaksian pemazmur bahwa Yahweh mendengar seruannya.
- source_word: מִכָּל
  choice: dari segala
  rationale: Gabungan preposisi dan kata yang berarti 'semua' menyatakan pembebasan dari keseluruhan kesesakan yang dialami.
- source_word: צָרוֹתָיו
  choice: segala kesesakannya
  rationale: '''Kesesakan'' mempertahankan gambaran keadaan terimpit atau penuh tekanan yang terkandung dalam kata Ibrani, serta cocok dengan ragam bahasa mazmur.'
- source_word: הוֹשִׁיעוֹ
  choice: menyelamatkannya
  rationale: Bentuk kausatif kata kerja ini berarti menyelamatkan atau melepaskan seseorang dari bahaya dan mempertahankan kaitannya dengan kosakata keselamatan Alkitab.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Cakupan makna עָנִי
  choice: orang yang tertindas
  alternative: orang miskin; orang yang menderita; orang yang rendah hati
  rationale: Pilihan utama menyesuaikan konteks kesesakan dan pertolongan, sedangkan catatan kaki mempertahankan keluasan makna sosial, jasmani, dan sikap rendah hati tanpa menetapkan satu tafsiran teologis saja.
translation_notes:
  register: 'Bahasa Indonesia modern yang wajar dan bermartabat. Urutan kesaksian dipertahankan: seruan orang tertindas, Yahweh mendengar, lalu menyelamatkan. Tanda titik koma memperjelas hubungan erat antara tindakan mendengar dan menyelamatkan tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.'
