  text: שֹׁמֵ֥ר כָּל עַצְמוֹתָ֑י/ו אַחַ֥ת מֵ֝/הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/020.yaml
  text: He keeps all his bones[b][a]; not one of them is broken.
translation:
  language: id
  text: Ia menjaga semua tulangnya[a]; tidak satu pun di antaranya patah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melindungi” atau “memelihara” semua tulangnya.
    reason: lexical_alternative
  - marker: b
    text: Baris ini dikutip dalam Yohanes 19:36 sehubungan dengan penyaliban Yesus.
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  choice: menjaga
  rationale: Partisipel dari שׁמר menyatakan tindakan menjaga atau memelihara. “Menjaga” alami dalam bahasa Indonesia dan mempertahankan nuansa perlindungan.
- source_word: כָּל עַצְמוֹתָיו
  choice: semua tulangnya
  rationale: כָּל menyatakan keseluruhan, עַצְמוֹת berarti “tulang-tulang,” dan sufiks orang ketiga maskulin tunggal diterjemahkan “-nya.”
- source_word: אַחַת מֵהֵנָּה
  choice: tidak satu pun darinya
  rationale: אַחַת berarti “satu” dan bentuk feminin ini mengacu kepada satu tulang; מִן dengan pronomina berfungsi partitif, yaitu satu dari keseluruhan tulang tersebut.
- source_word: לֹא נִשְׁבָּרָה
  choice: dipatahkan
  rationale: Bentuk Nifal perfektum dari שׁבר berarti “dipatahkan” atau “menjadi patah.” Dalam pernyataan puitis ini, bentuk pasif Indonesia mempertahankan tindakan tanpa menyebut pelaku.
theological_decisions:
- issue: Acuan sufiks pronominal tunggal
  choice: Memakai “-nya,” yang dalam konteks langsung mengacu kepada orang benar yang menderita.
  alternative: Menuliskan secara eksplisit “tulang orang benar” atau menjadikannya rujukan kristologis langsung.
  rationale: Bahasa Ibrani memakai sufiks maskulin tunggal, sedangkan konteks mazmur berbicara tentang orang benar yang dilepaskan TUHAN. Terjemahan utama mempertahankan makna langsung mazmur tanpa meniadakan pemakaiannya kemudian dalam Yohanes 19:36.
- issue: Nilai waktu perfektum נִשְׁבָּרָה
  choice: Diterjemahkan “dipatahkan” dalam pernyataan umum yang berlaku bagi orang benar.
  alternative: “telah dipatahkan” atau “akan dipatahkan.”
  rationale: Perfektum dalam puisi dapat menggambarkan tindakan secara utuh tanpa harus memaksakan waktu lampau. Bahasa Indonesia memungkinkan bentuk pasif tanpa penandaan waktu eksplisit, sehingga ketegangan aspek sumber tetap terpelihara.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Urutan penanda catatan kaki mengikuti tempat yang dijelaskan: [a] sesudah frasa tentang penjagaan tulang, dan [b] sesudah pernyataan yang dikutip dalam Yohanes.'
