  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: id
  text: Yahweh menebus nyawa hamba-hamba-Nya[a], dan tidak seorang pun yang berlindung kepada-Nya akan dinyatakan bersalah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwa”; kata Ibrani nefesh di sini menunjuk pada hidup atau diri yang hidup.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan menanggung kesalahan” atau “akan dihukum.” Kata kerja Ibraninya mengandung bahasa mengenai kesalahan dan pertanggungjawaban secara hukum.
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: menebus
  rationale: Bentuk partisip dari פדה menyatakan tindakan menebus atau membebaskan melalui penyelamatan. “Menebus” mempertahankan baik gagasan pembebasan maupun nuansa penebusan yang ada dalam konteks iman Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi Allah dalam teks Ibrani tidak diganti dengan sebuah gelar.
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Dalam konteks ini נֶפֶשׁ menunjuk pada hidup atau diri yang hidup, bukan secara khusus unsur batin yang terpisah dari tubuh. “Nyawa” wajar dalam ungkapan Indonesia “menebus nyawa” dan menonjolkan hidup yang diselamatkan.
- source_word: עֲבָדָיו
  choice: hamba-hamba-Nya
  rationale: עבד dapat berarti hamba atau budak. Dalam konteks mazmur ini, “hamba-hamba-Nya” merupakan ungkapan alami dan tepat bagi orang-orang yang mengabdi kepada Yahweh tanpa menonjolkan status perbudakan yang tidak menjadi fokus ayat.
- source_word: יֶאְשְׁמוּ
  choice: akan dinyatakan bersalah
  rationale: Kata kerja אשם mengandung makna kesalahan atau pertanggungan kesalahan. “Dinyatakan bersalah” mempertahankan daya forensiknya tanpa mempersempitnya menjadi pernyataan khusus tentang penghukuman akhir.
- source_word: הַחֹסִים בּוֹ
  choice: yang berlindung kepada-Nya
  rationale: חסה menggambarkan tindakan mencari perlindungan atau naungan. “Berlindung kepada-Nya” mempertahankan citra konkret mazmur ini dan lebih tepat daripada istilah umum “percaya”.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks penyelamatan
  choice: Diterjemahkan “nyawa,” yakni hidup atau diri yang hidup.
  alternative: “Jiwa,” yang dapat dipahami sebagai unsur batin manusia.
  rationale: Kata Ibrani ini kerap menunjuk pada hidup atau keseluruhan pribadi. Terjemahan “nyawa” menghindari pemasukan antropologi dualistis yang tidak dituntut oleh teks, sementara alternatif tradisional dicatat dalam catatan kaki.
- issue: Daya makna יֶאְשְׁמוּ
  choice: Diterjemahkan dengan bahasa forensik “akan dinyatakan bersalah.”
  alternative: “Akan menanggung kesalahan” atau, dengan daya lebih kuat, “akan dihukum.”
  rationale: אשם berkaitan dengan keadaan bersalah atau menanggung kesalahan. Kontras dengan penebusan mendukung nuansa yudisial, tetapi terjemahan utama tidak memaksakan kesimpulan yang lebih sempit tentang jenis atau waktu penghukuman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Bentuk “hamba-hamba-Nya” dan “kepada-Nya” mengikuti pemakaian religius Indonesia yang alami; susunan kalimat dibuat ringkas untuk mempertahankan kesejajaran dua bagian ayat.
