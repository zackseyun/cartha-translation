  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֑וֹב בַּקֵּ֖שׁ שָׁל֣וֹם וְ/רָדְפֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/014.yaml
  text: Turn away from evil and do good[a]; seek peace and pursue it.
translation:
  language: id
  text: Jauhilah kejahatan dan lakukanlah kebaikan; carilah perdamaian[a] dan kejarlah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani shalom juga dapat berarti “keutuhan” atau “kesejahteraan”, bukan hanya tidak adanya konflik.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר
  choice: Berpalinglah
  rationale: Bentuk imperatif ini menyatakan tindakan menjauh atau berbalik arah. “Berpalinglah” mempertahankan gambaran perubahan arah moral dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: מֵרָע
  choice: dari kejahatan
  rationale: Dalam konteks nasihat hikmat ini, רַע terutama menunjuk pada kejahatan moral, sedangkan preposisi מִן menyatakan pemisahan atau penjauhan.
- source_word: וַעֲשֵׂה טוֹב
  choice: dan lakukanlah kebaikan
  rationale: Terjemahan ini mempertahankan pasangan perintah yang ringkas dan kontras langsung antara kejahatan dan kebaikan.
- source_word: בַּקֵּשׁ
  choice: carilah
  rationale: Imperatif piel ini menyiratkan pencarian yang sungguh-sungguh. “Carilah” jelas, alami, dan tetap mempertahankan daya perintahnya.
- source_word: שָׁלוֹם
  choice: damai sejahtera
  rationale: שָׁלוֹם mencakup kedamaian, keutuhan, dan kesejahteraan. “Damai sejahtera” merupakan ungkapan Indonesia yang ringkas dan cukup luas untuk membawa lebih dari sekadar makna tidak adanya konflik.
- source_word: וְרָדְפֵהוּ
  choice: dan kejarlah itu
  rationale: רָדַף berarti mengejar dan di sini menggambarkan usaha yang aktif serta terus-menerus. Akhiran pronominal maskulin tunggal merujuk kembali kepada שָׁלוֹם, sehingga diterjemahkan “itu”.
