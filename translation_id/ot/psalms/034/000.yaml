id: PSA.34.0
reference: Psalms 34:0
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/דָוִ֗ד בְּ/שַׁנּוֹת֣/וֹ אֶת טַ֭עְמ/וֹ לִ/פְנֵ֣י אֲבִימֶ֑לֶךְ וַֽ֝/יְגָרֲשֵׁ֗/הוּ וַ/יֵּלַֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: id
  text: Dari Daud. Ketika ia mengubah perilakunya di hadapan Abimelekh[a], lalu Abimelekh mengusirnya, dan Daud pun pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam 1 Samuel 21:10–15, raja ini disebut Akhis. “Abimelekh” di sini mungkin merupakan nama lain atau gelar kerajaan.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Kata depan לְ pada judul mazmur dapat menunjukkan kepengarangan, kepemilikan, persembahan, atau keterkaitan. “Dari Daud” tetap luas dan tidak mempersempitnya menjadi “Karya Daud” atau “Untuk Daud”.
- source_word: בְּשַׁנּוֹתוֹ
  choice: ketika ia mengubah
  rationale: Infinitif dengan prefiks בְּ berfungsi temporal, sehingga wajar diterjemahkan “ketika ia mengubah”.
- source_word: טַעְמוֹ
  choice: perilakunya
  rationale: Walaupun טַעַם dapat berarti “rasa”, “pertimbangan”, atau “akal”, dalam ungkapan dan konteks ini kata tersebut menunjuk pada sikap atau perilaku yang tampak. “Perilakunya” tidak menambahkan diagnosis atau secara eksplisit menyatakan bahwa Daud berpura-pura gila.
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: di hadapan Abimelekh
  rationale: Terjemahan langsung dan alami untuk tindakan yang dilakukan dalam kehadiran raja tersebut.
- source_word: וַיְגָרֲשֵׁהוּ
  choice: lalu Abimelekh mengusirnya
  rationale: Kata kerja berarti “mengusir”. Nama Abimelekh diulang untuk memperjelas pelaku dalam bahasa Indonesia tanpa mengubah hubungan tokoh dalam narasi.
- source_word: וַיֵּלַךְ
  choice: dan Daud pun pergi
  rationale: Kata kerja berarti “pergi”. Nama Daud dinyatakan untuk mencegah kerancuan rujukan kata ganti setelah pergantian subjek.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama dalam teks Ibrani dipertahankan dan ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; identifikasinya dengan Akhis dicatat dalam catatan kaki, bukan dimasukkan ke teks utama.
theological_decisions:
- issue: Identitas historis Abimelekh
  choice: Mempertahankan “Abimelekh” dalam teks utama sesuai teks Ibrani.
  alternative: Memahami “Abimelekh” sebagai nama lain atau gelar kerajaan bagi Akhis dari Gat.
  rationale: Keutamaan teks bahasa asli menuntut agar nama yang tercantum dalam judul mazmur tidak diganti untuk menyelaraskannya secara diam-diam dengan kisah dalam 1 Samuel 21. Hubungan yang mungkin dengan Akhis dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan nama Abimelekh dan Daud menghindari kerancuan beberapa kata ganti orang ketiga dalam satu rangkaian kalimat. Bentuk “Dari Daud” dipakai untuk menjaga keluasan makna judul Ibrani.
