  text: קָר֣וֹב יְ֭הוָה לְ/נִשְׁבְּרֵי לֵ֑ב וְֽ/אֶת דַּכְּאֵי ר֥וּחַ יוֹשִֽׁיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/018.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
translation:
  language: id
  text: Yahweh dekat kepada orang-orang yang remuk hatinya, dan Ia menyelamatkan mereka yang remuk rohnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka yang hancur batinnya.” Ungkapan Ibrani ini dapat menggambarkan orang yang rohnya diremukkan atau direndahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: dekat
  rationale: Sebagai adjektiva predikatif, kata ini berarti ‘dekat’. Pilihan ini tetap memuat kemungkinan nuansa kedekatan kehadiran maupun hubungan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani dipertahankan.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: kepada orang-orang yang remuk hatinya
  rationale: Ungkapan harfiahnya adalah ‘kepada mereka yang patah/remuk hati’. ‘Remuk hatinya’ mempertahankan metafora kehancuran batin dan terdengar wajar serta puitis dalam bahasa Indonesia.
- source_word: וְאֶת
  choice: dan
  rationale: אֵת menandai objek verba berikutnya; bersama konjungsi וְ, bentuk ini cukup diwakili oleh ‘dan’ dalam bahasa Indonesia yang alami.
- source_word: דַּכְּאֵי רוּחַ
  choice: mereka yang hancur batinnya
  rationale: דכא menggambarkan keadaan diremukkan atau direndahkan, sedangkan רוּחַ di sini menunjuk pada sisi batin manusia. Pilihan ini menyampaikan penderitaan batin tanpa membatasi maknanya pada penyesalan karena dosa.
- source_word: יוֹשִׁיעַ
  choice: Ia menyelamatkan
  rationale: Bentuk Hifil dari ישׁע berarti ‘menyelamatkan, melepaskan, atau menolong’. ‘Menyelamatkan’ mempertahankan cakupan kosakata keselamatan dalam Alkitab sekaligus sesuai dengan konteks pertolongan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa דַּכְּאֵי רוּחַ
  choice: mereka yang hancur batinnya
  alternative: mereka yang rendah atau remuk rohnya
  rationale: Frasa ini dapat menunjuk pada orang yang secara batin diremukkan oleh penderitaan ataupun direndahkan. Terjemahan utama mempertahankan gambaran kehancuran batin, sedangkan catatan kaki mengakui kemungkinan nuansa kerendahan atau penyesalan tanpa memaksakannya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Paralelisme antara ‘remuk hatinya’ dan ‘hancur batinnya’ dipertahankan tanpa memakai ungkapan kaku seperti ‘yang remuk dalam roh’. Kapitalisasi ‘Ia’ mengikuti register Alkitab Indonesia yang lazim dan menjaga kejelasan rujukan.
