id: PSA.34.19
reference: Psalms 34:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝/מִ/כֻּלָּ֗/ם יַצִּילֶ֥/נּוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Many are the afflictions of the righteous man[b][a], but Yahweh delivers him out of them all.
translation:
  language: id
  text: Banyaklah kemalangan yang menimpa orang benar[b][a], tetapi dari semuanya itu Yahweh menyelamatkan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesusahan” atau “bencana.” Kata Ibrani רָעוֹת dapat berarti hal-hal buruk, kesusahan, atau malapetaka; di sini yang dimaksud ialah berbagai penderitaan yang menimpa orang benar.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai bentuk tunggal, “orang benar,” yang dapat mewakili setiap orang yang benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Banyaklah
  rationale: Bentuk predikatif di awal klausa menonjolkan banyaknya kesusahan; partikel -lah mempertahankan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: רָעוֹת
  choice: kemalangan
  rationale: Dalam konteks ini kata tersebut menunjuk pada berbagai kesusahan atau bencana yang dialami orang benar, bukan kejahatan moral yang dilakukannya.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva substantival tunggal ini paling alami diterjemahkan sebagai 'orang benar'; bentuk tunggalnya dapat berfungsi secara representatif.
- source_word: וּמִכֻּלָּם
  choice: tetapi dari semuanya itu
  rationale: Kata sambung menyatakan kontras kontekstual, sedangkan preposisi dan bentuk 'semuanya' mempertahankan cakupan menyeluruh dari pembebasan.
- source_word: יַצִּילֶנּוּ
  choice: menyelamatkan dia
  rationale: Bentuk kausatif dari נצל berarti melepaskan atau menyelamatkan dari bahaya; pronomina tunggal dipertahankan dengan 'dia'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan suatu gelar.
theological_decisions:
- issue: Arti רָעוֹת sehubungan dengan orang benar
  choice: kemalangan
  alternative: kejahatan; kesusahan; bencana
  rationale: Konteks berbicara tentang hal-hal berat yang menimpa orang benar dan darinya ia diselamatkan. 'Kemalangan' menyampaikan penderitaan yang dialami tanpa menghapus rentang makna katanya.
- issue: Bentuk tunggal representatif צַדִּיק
  choice: orang benar
  alternative: orang-orang benar; seorang laki-laki yang benar
  rationale: Terjemahan mempertahankan bentuk tunggal tanpa membatasi acuannya hanya pada laki-laki; dalam bahasa Indonesia, 'orang benar' dapat berfungsi secara umum dan representatif.
- issue: Penerjemahan nama יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Pemakaian nama 'Yahweh' mempertahankan nama pribadi yang hadir dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. Susunan kalimat mempertahankan kontras serta penekanan teks Ibrani, sementara frasa 'yang menimpa' ditambahkan secara implisit untuk memperjelas hubungan idiomatis antara kemalangan dan orang benar.
