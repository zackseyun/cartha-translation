id: PSA.34.9
reference: Psalms 34:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: id
  text: Takutlah akan Yahweh, hai orang-orang kudus-Nya[a], sebab orang-orang yang takut akan Dia tidak berkekurangan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang-Nya yang kudus.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak ada kekurangan bagi orang-orang yang takut akan Dia.”
    reason: literal_rendering
lexical_decisions:
- source_word: יְר֣אוּ
  choice: Takutlah akan
  rationale: Bentuk imperatif orang kedua jamak dari ירא. Pilihan ini mempertahankan makna langsung serta kaitan leksikal dengan לִירֵאָיו di bagian akhir ayat; dalam konteks ini takut mencakup sikap gentar dan hormat kepada Allah.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: אֶת menandai objek langsung, sedangkan יְהוָה adalah nama ilahi. Transliterasi “Yahweh” mempertahankan nama perjanjian yang terdapat dalam teks Ibrani.
- source_word: קְדֹשָׁיו
  choice: orang-orang kudus-Nya
  rationale: Adjektiva jamak yang dipakai secara substantival dengan sufiks orang ketiga tunggal. Ungkapan ini menunjuk kepada mereka yang menjadi milik-Nya dan dikuduskan bagi-Nya tanpa mempersempitnya menjadi gelar kelompok tertentu.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya; “sebab” menyatakan hubungan penjelas itu secara alami dalam bahasa Indonesia.
- source_word: אֵין מַחְסוֹר
  choice: tidak berkekurangan
  rationale: Ungkapan Ibrani menyatakan tidak adanya kekurangan. “Tidak berkekurangan” alami dan bermartabat serta tidak menyiratkan bahwa setiap keinginan pasti dipenuhi.
- source_word: לִירֵאָיו
  choice: orang-orang yang takut akan Dia
  rationale: Frasa dengan preposisi לְ, partisipel jamak, dan sufiks orang ketiga tunggal. Bentuk ini alami dalam bahasa Indonesia dan mengulang akar gagasan “takut” dari perintah pembuka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama yang hadir dalam sumber Ibrani, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Makna takut kepada Allah
  choice: takut akan
  alternative: hormatilah
  rationale: “Takut akan” mempertahankan ketegangan bahasa hikmat dan hubungan verbal antara perintah serta sebutan bagi mereka yang takut kepada-Nya. “Hormatilah” hanya menyatakan salah satu segi maknanya dan dapat terlalu melunakkan unsur kegentaran.
- issue: Cakupan janji tidak berkekurangan
  choice: tidak berkekurangan
  alternative: tidak menginginkan apa pun
  rationale: מַחְסוֹר berbicara tentang kekurangan atau kebutuhan yang tidak terpenuhi, bukan tentang lenyapnya semua keinginan. Terjemahan ini menjaga pernyataan pemeliharaan ilahi tanpa mengubahnya menjadi janji pemenuhan setiap hasrat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis-dignified. Sapaan “hai” mempertahankan fungsi vokatif קְדֹשָׁיו. Pengulangan “takut” disengaja untuk mencerminkan pengulangan akar ירא dalam teks Ibrani.
