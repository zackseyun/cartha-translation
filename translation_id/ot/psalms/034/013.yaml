  text: Guard your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: id
  text: Jagalah lidahmu dari kejahatan, dan bibirmu dari mengucapkan tipu daya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tahanlah lidahmu dari kejahatan, dan bibirmu dari berkata dusta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְצֹר
  choice: Jagalah
  rationale: Bentuk imperatif ini menyatakan tindakan menjaga atau menahan dengan sungguh-sungguh; “jagalah” alami dalam nasihat etis dan tetap dekat dengan citra Ibrani.
- source_word: לְשׁוֹנְךָ
  choice: lidahmu
  rationale: Terjemahan harfiah ini mempertahankan citra tubuh yang mewakili perkataan dan mudah dipahami dalam bahasa Indonesia.
- source_word: מֵרָע
  choice: dari yang jahat
  rationale: רַע dapat menunjuk pada kejahatan atau sesuatu yang buruk. “Yang jahat” mempertahankan daya moral ungkapan itu tanpa membatasinya hanya pada akibat yang merugikan.
- source_word: וּשְׂפָתֶיךָ
  choice: dan bibirmu
  rationale: Pilihan harfiah ini mempertahankan kesejajaran puitis dengan “lidahmu” serta citra konkret teks Ibrani.
- source_word: מִדַּבֵּר
  choice: dari mengucapkan
  rationale: Infinitif dengan preposisi menyatakan hal yang harus dijauhi; “dari mengucapkan” terdengar wajar dan secara khusus terkait dengan tindakan bibir.
- source_word: מִרְמָה
  choice: tipu daya
  rationale: מִרְמָה berarti penipuan, kelicikan, atau perkataan menyesatkan. “Tipu daya” merupakan ungkapan Indonesia yang jelas dan bermartabat serta mencakup unsur kesengajaan.
