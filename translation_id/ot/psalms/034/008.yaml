  text: טַעֲמ֣וּ וּ֭/רְאוּ כִּי ט֣וֹב יְהוָ֑ה אַֽשְׁרֵ֥י הַ֝/גֶּ֗בֶר יֶחֱסֶה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: id
  text: Kecaplah dan lihatlah bahwa Yahweh itu baik! Berbahagialah laki-laki[a] yang berlindung kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “laki-laki”; bentuk maskulin tunggal di sini digunakan secara representatif untuk siapa pun yang berlindung kepada Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַעֲמוּ
  choice: Kecaplah
  rationale: Mempertahankan citra indrawi harfiah ‘mengecap’ serta daya metaforisnya, yaitu mengalami sendiri kebaikan Yahweh.
- source_word: וּרְאוּ
  choice: dan lihatlah
  rationale: Mempertahankan pasangan puitis antara mengecap dan melihat, sekaligus memungkinkan pengertian mengenali melalui pengalaman.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang harus dikecap dan dilihat; ‘bahwa’ merupakan penghubung yang alami dalam bahasa Indonesia.
- source_word: טוֹב
  choice: baik
  rationale: ‘Baik’ mempertahankan cakupan luas kata Ibrani, yang mencakup sifat dan kemurahan Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap tampak.
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Bentuk ini menyampaikan seruan maklumat bahagia tentang keadaan yang patut didambakan dan sesuai dengan ragam bahasa Mazmur yang luhur.
- source_word: הַגֶּבֶר
  choice: laki-laki
  rationale: Kata Ibrani berbentuk maskulin tunggal dan secara leksikal menunjuk kepada laki-laki; dalam konteks ini bentuk tersebut berfungsi mewakili siapa pun yang berlindung kepada Yahweh.
- source_word: יֶחֱסֶה
  choice: yang berlindung
  rationale: Mempertahankan gambaran mencari perlindungan atau naungan, alih-alih meratakannya menjadi sekadar ‘percaya’.
- source_word: בּוֹ
  choice: kepada-Nya
  rationale: Dalam ungkapan Indonesia ‘berlindung kepada-Nya’ terdengar alami dan tetap merujuk kepada Yahweh sebagai tempat perlindungan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Bentuk maskulin representatif הַגֶּבֶר
  choice: laki-laki dengan catatan kaki tentang cakupan representatifnya
  alternative: orang
  rationale: Pilihan ini mempertahankan bentuk maskulin tunggal dalam sumber tanpa membatasi penerapan maklumat bahagia tersebut hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Imperatif ‘Kecaplah dan lihatlah’ mempertahankan citra indrawi teks Ibrani. Tanda seru menandai ajakan puitis pada klausa pertama, sedangkan kapitalisasi pronomina ilahi mengikuti kebiasaan hormat dalam bahasa Indonesia.
