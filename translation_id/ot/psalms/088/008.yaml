base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
translation:
  language: id
  text: Engkau telah menjauhkan orang-orang yang kukenal[a] dariku; Engkau telah membuat aku menjijikkan bagi mereka[b]. Aku terkurung dan tidak dapat keluar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kenalan-kenalanku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Engkau telah menjadikan aku suatu kekejian bagi mereka.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dan aku tidak keluar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: telah menjauhkan
  rationale: Bentuk Hifil dari רחק menyatakan tindakan menyebabkan jarak; 'menjauhkan ... dariku' alami dalam bahasa Indonesia dan mempertahankan kausalitas teks.
- source_word: מְיֻדָּעַי
  choice: kenalan-kenalanku
  rationale: Bentuk nominal dari ידע menunjuk kepada orang-orang yang dikenal pemazmur. 'Kenalan-kenalanku' mempertahankan keluasan makna tanpa melebihkan keakraban menjadi 'sahabat-sahabatku'.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Menyampaikan makna pemisahan מן dengan akhiran orang pertama tunggal secara ringkas dan alami.
- source_word: שַׁתַּנִי
  choice: telah membuat aku menjadi
  rationale: Dalam konstruksi dengan pelengkap predikatif, שׁית/שׂים bermakna menjadikan atau membuat seseorang menjadi sesuatu.
- source_word: תוֹעֵבוֹת
  choice: sesuatu yang menjijikkan
  rationale: Walaupun bentuk Ibraninya jamak dan nominal, di sini kata tersebut berfungsi secara predikatif serta menyatakan kejijikan atau penolakan yang kuat. Ungkapan ini alami sekaligus mempertahankan kekuatan citranya.
- source_word: לָמוֹ
  choice: bagi mereka
  rationale: Pronomina ini merujuk kembali kepada para kenalan dan sesuai dengan konstruksi predikatif bahasa Indonesia.
- source_word: כָּלֻא
  choice: Aku terkurung
  rationale: Bentuk pasif atau statif dari כלא menyatakan keadaan tertahan atau tertutup di dalam, tanpa harus mengkhususkan tempat itu sebagai penjara resmi.
- source_word: וְלֹא אֵצֵא
  choice: dan tidak dapat keluar
  rationale: Secara harfiah berarti 'dan aku tidak keluar', tetapi sesudah 'terkurung' konteks menunjukkan ketidakmampuan, bukan sekadar tidak melakukan tindakan.
