  text: כִּֽי שָֽׂבְעָ֣ה בְ/רָע֣וֹת נַפְשִׁ֑/י וְ/חַיַּ֗/י לִ/שְׁא֥וֹל הִגִּֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: id
  text: Sebab jiwaku penuh dengan kesusahan, dan hidupku sudah mendekati Syeol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubur” atau “dunia orang mati”. Istilah Ibraninya ialah “Syeol”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi keadaan pemazmur dalam konteks sekitarnya dan mempertahankan hubungan kausal secara alami.
- source_word: שָׂבְעָה
  choice: penuh
  rationale: Verba ini berarti kenyang atau dipenuhi. Bersama רָעוֹת, terjemahan 'penuh dengan' mempertahankan gambaran keadaan yang dikuasai penderitaan tanpa terdengar janggal.
- source_word: בְרָעוֹת
  choice: dengan kesusahan
  rationale: Dalam konteks ratapan ini, bentuk jamak רָעוֹת menunjuk pada berbagai kemalangan atau penderitaan yang menimpa pemazmur, bukan terutama kejahatan moral yang dilakukannya.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Pilihan ini mempertahankan perbedaan leksikal dan kesejajaran puitis dengan חַיַּי, yang diterjemahkan 'hidupku' pada larik berikutnya.
- source_word: וְחַיַּי
  choice: dan hidupku
  rationale: Walaupun חַיִּים berbentuk jamak dalam bahasa Ibrani, kata ini lazim berfungsi sebagai nomina abstrak bermakna tunggal, yaitu 'hidup'.
- source_word: לִשְׁאוֹל
  choice: mendekati Syeol
  rationale: Nama 'Syeol' mempertahankan istilah dan gambaran dunia sumber tanpa mempersempitnya menjadi sekadar kubur atau memasukkan konsep teologis yang lebih kemudian.
- source_word: הִגִּיעוּ
  choice: sudah mendekati
  rationale: Verba ini berarti mencapai atau tiba. Dalam ratapan puitis ini, ungkapan 'sudah mendekati' menyampaikan bahwa kehidupan pemazmur berada di ambang Syeol, bukan bahwa ia telah benar-benar masuk ke sana.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syeol
  alternative: kubur; dunia orang mati
  rationale: Mempertahankan istilah Ibrani menghindari penyamaan yang terlalu sempit dengan kubur fisik maupun pengimporan kategori teologis yang lebih kemudian. Catatan kaki memberi pembaca padanan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Susunan dua klausa mempertahankan kesejajaran puitis, sementara 'penuh dengan kesusahan' dan 'sudah mendekati' tetap alami bagi pembaca umum.
