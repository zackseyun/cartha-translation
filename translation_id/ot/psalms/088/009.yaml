id: PSA.88.9
reference: Psalms 88:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: id
  text: Mataku merana karena penderitaan.[a] Setiap hari aku berseru kepada-Mu, ya Yahweh; kubentangkan tanganku kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mataku melemah karena penderitaan” atau “Mataku sakit karena kesengsaraan.”
    reason: Kata kerja Ibrani dapat menunjuk pada keadaan merana, melemah, atau merasa sakit; konteks tidak memastikan satu nuansa saja.
lexical_decisions:
- source_word: עֵינִי
  choice: Mataku
  rationale: Bentuk Ibrani ini tunggal. Terjemahan tunggal mempertahankan gambaran puitis tentang penglihatan atau daya hidup si pemazmur dan tetap wajar dalam bahasa Indonesia.
- source_word: דָאֲבָה
  choice: merana
  rationale: Kata kerja ini dapat menggambarkan keadaan melemah, merosot, atau menderita karena kesusahan. 'Merana' mempertahankan keluasan makna itu tanpa membatasinya pada rasa sakit fisik.
- source_word: מִנִּי עֹנִי
  choice: karena penderitaan
  rationale: Frasa ini menyatakan sebab atau sumber kemerosotan. 'Penderitaan' sesuai dengan konteks ratapan dan 'karena' menjelaskan hubungan kausal secara alami.
- source_word: קְרָאתִיךָ
  choice: aku berseru kepada-Mu
  rationale: Dalam kaitan dengan 'setiap hari', bentuk perfektif ini paling alami dipahami sebagai tindakan yang berulang. 'Berseru' menyampaikan permohonan dalam doa tanpa menambahkan isi yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּכָל־יוֹם
  choice: setiap hari
  rationale: Frasa ini paling mungkin menyatakan pengulangan dari hari ke hari, bukan tindakan yang berlangsung sepanjang satu hari.
- source_word: שִׁטַּחְתִּי
  choice: kubentangkan
  rationale: Kata kerja ini menggambarkan tindakan merentangkan atau membentangkan tangan sebagai sikap berdoa dan memohon.
- source_word: כַפָּי
  choice: tanganku
  rationale: Bentuk Ibraninya dual dan secara harfiah menunjuk pada kedua telapak tangan. Dalam bahasa Indonesia, 'tanganku' merupakan ungkapan alami untuk kedua tangan dalam gerak doa ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Nilai aspek קְרָאתִיךָ dalam konteks בְּכָל־יוֹם
  choice: 'Tindakan kebiasaan pada masa kini: ''aku berseru ... setiap hari'''
  alternative: 'Tindakan lampau atau berkelanjutan: ''aku telah berseru ... setiap hari'''
  rationale: Keterangan 'setiap hari' mendukung pembacaan kebiasaan, tetapi bentuk Ibrani sendiri juga dapat dipahami dengan nuansa tindakan yang telah dilakukan; terjemahan utama memilih ungkapan Indonesia yang paling alami dalam konteks ratapan.
translation_notes:
  register: 'Bahasa Indonesia baku, puitis, dan mudah dipahami. Susunan kalimat mempertahankan tiga gerak ayat: kemerosotan mata, seruan harian kepada Yahweh, dan pembentangan tangan dalam doa. Kata ganti yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia.'
