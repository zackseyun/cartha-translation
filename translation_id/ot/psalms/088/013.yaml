source:
  edition: WLC
  text: וַ/אֲנִ֤י אֵלֶ֣י/ךָ יְהוָ֣ה שִׁוַּ֑עְתִּי וּ֝/בַ/בֹּ֗קֶר תְּֽפִלָּתִ֥/י תְקַדְּמֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/013.yaml
  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
translation:
  language: id
  text: Namun aku berseru kepada-Mu, ya Yahweh; dan pada pagi hari doaku datang ke hadapan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menemui-Mu” atau “mendahului-Mu.” Verba Ibrani dapat berarti datang ke hadapan, menemui, atau mendahului.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Konjungsi dan pronomina mandiri memberi penekanan kontras. “Namun aku” mempertahankan daya adversatifnya secara wajar dalam bahasa Indonesia.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Preposisi ini menunjukkan arah seruan kepada Yahweh.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, sedangkan “ya” menandai sapaan langsung secara alami.
- source_word: שִׁוַּעְתִּי
  choice: aku berseru ... memohon pertolongan
  rationale: Verba ini menyatakan seruan minta tolong. Bentuk lampau Ibrani di dalam doa puitis dapat menggambarkan seruan yang telah dilakukan dan terus menjadi sikap pemazmur; bahasa Indonesia tidak mewajibkan penandaan kala.
- source_word: וּבַבֹּקֶר
  choice: pada pagi hari
  rationale: Ungkapan ini menunjuk waktu datangnya doa. Hubungan dengan klausa sebelumnya sudah cukup jelas melalui tanda titik koma sehingga prefiks penghubung tidak perlu diterjemahkan tersendiri.
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: Nomina tunggal dengan sufiks orang pertama diterjemahkan langsung dan alami.
- source_word: תְקַדְּמֶךָּ
  choice: datang ke hadapan-Mu
  rationale: Bentuk verba dari קדם dapat berarti datang ke hadapan, menemui, atau mendahului. Pilihan ini alami dengan “doaku” sebagai subjek dan mempertahankan gambaran doa yang hadir di hadapan Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Aspek שִׁוַּעְתִּי dalam doa puitis
  choice: aku berseru ... memohon pertolongan
  alternative: aku telah berseru memohon pertolongan
  rationale: Bentuk perfektif dapat merujuk pada seruan yang telah dilakukan, tetapi konteks doa memungkinkan tindakan yang sedang menjadi permohonan pemazmur. Bahasa Indonesia tanpa penanda kala mempertahankan keluwesan aspek ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada enklitik “-Mu” menandai rujukan kepada Allah. Susunan kalimat menjaga kontras pembuka dan paralelisme puitis tanpa terasa kaku.
