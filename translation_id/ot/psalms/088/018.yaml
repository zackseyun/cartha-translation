lexical_decisions:
- source_word: הִרְחַקְתָּ מִמֶּנִּי
  choice: Engkau telah menjauhkan ... dari aku
  rationale: Bentuk Hifil perfektum orang kedua tunggal menyatakan bahwa Allah, yang disapa langsung, menyebabkan mereka berada jauh dari pemazmur. Susunan ini mempertahankan daya kausatif dan pemisahan yang ditandai oleh מִמֶּנִּי.
- source_word: אֹהֵב
  choice: kekasih
  rationale: Partisip substantival ini menunjuk kepada seseorang yang mengasihi atau memiliki hubungan kasih yang dekat. 'Kekasih' ringkas, alami, dan tidak harus dibatasi pada pasangan romantis dalam larik puitis ini.
- source_word: וָרֵעַ
  choice: dan sahabat
  rationale: רֵעַ dalam konteks hubungan pribadi paling wajar berarti sahabat atau teman dekat; 'sahabat' sesuai dengan kedekatan yang tersirat dalam pasangan kata ini.
- source_word: מְיֻדָּעַי
  choice: orang-orang yang kukenal
  rationale: Bentuk dengan sufiks orang pertama tunggal menunjuk kepada mereka yang dikenal oleh pemazmur. Ungkapan ini lebih alami dalam bahasa Indonesia modern daripada 'kenalan-kenalanku' dan tetap membedakannya dari sahabat dekat.
- source_word: מַחְשָׁךְ
  choice: adalah kegelapan
  rationale: Nomina penutup berdiri dalam klausa tanpa verba dan secara sintaksis dapat dipahami sebagai predikat bagi 'orang-orang yang kukenal'. Kopula ditambahkan agar jelas dalam bahasa Indonesia, sementara metafora yang tajam dan ketaksaan teks Ibrani tetap dipertahankan melalui catatan kaki.
theological_decisions:
- issue: Hubungan sintaksis frasa penutup מְיֻדָּעַי מַחְשָׁךְ
  choice: orang-orang yang kukenal adalah kegelapan
  alternative: orang-orang yang kukenal berada dalam kegelapan; kegelapanlah satu-satunya temanku
  rationale: Teks Masoret sangat ringkas dan tidak memiliki verba atau preposisi. Terjemahan utama mengikuti urutan kata dan membaca 'kegelapan' sebagai predikat, tanpa mengubahnya menjadi pernyataan yang lebih eksplisit tentang lokasi atau satu-satunya teman.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Sapaan 'Engkau' mempertahankan alamat langsung kepada Allah. Konstruksi penutup sengaja tetap tajam dan tidak dilunakkan; penanda catatan kaki ditempatkan dalam teks utama.
