  text: יְ֭הוָה אֱלֹהֵ֣י יְשׁוּעָתִ֑/י יוֹם צָעַ֖קְתִּי בַ/לַּ֣יְלָה נֶגְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: id
  text: 'Ya Yahweh, Allah keselamatanku,

    siang dan malam aku berseru di hadapan-Mu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”, sedangkan “Ya” menandai sapaan langsung dalam doa.
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: Allah keselamatanku
  rationale: Ungkapan ini mempertahankan hubungan konstruksi Ibrani dan nuansa teologis kata יְשׁוּעָה tanpa mempersempitnya menjadi jenis pertolongan tertentu.
- source_word: יוֹם
  choice: siang hari
  rationale: Dalam pasangan temporal dengan בַלַּיְלָה, kata ini secara alami berarti “siang hari”.
- source_word: צָעַקְתִּי
  choice: aku berseru
  rationale: Bentuk perfektif orang pertama tunggal menyatakan seruan mendesak pemazmur; dalam konteks ratapan yang sedang dipanjatkan, bahasa Indonesia wajar memakai bentuk “aku berseru” tanpa penanda kala eksplisit.
- source_word: בַלַּיְלָה
  choice: malam hari
  rationale: Padanan temporal yang alami dan sejajar dengan “siang hari”.
- source_word: נֶגְדֶּךָ
  choice: aku berada di hadapan-Mu
  rationale: Frasa ini secara harfiah berarti “di hadapan-Mu”. Karena klausa Ibrani tidak memiliki kata kerja, “aku berada” dipasok agar kalimat Indonesia lengkap, sambil mempertahankan gambaran kehadiran pemazmur di hadapan Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan sintaksis antara seruan siang hari dan frasa malam hari
  choice: 'Dua klausa sejajar: “siang hari aku berseru; malam hari aku berada di hadapan-Mu”'
  alternative: “Siang dan malam aku berseru di hadapan-Mu”
  rationale: Teks Masoret menempatkan “siang hari” bersama “aku berseru” dan menyisakan frasa nominal “malam hari ... di hadapan-Mu”. Terjemahan mempertahankan ketegangan dan susunan puitis itu, alih-alih meratakan kedua keterangan waktu menjadi satu klausa.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Sapaan “Ya Yahweh” mempertahankan kelangsungan doa, sedangkan pemenggalan tiga baris mengikuti gerak puitis ayat. Huruf kapital pada “-Mu” mengikuti kebiasaan ejaan religius Indonesia untuk rujukan kepada Allah.
