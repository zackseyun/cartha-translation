  text: Murka-Mu yang menyala-nyala telah melanda aku[a]; kengerian-Mu telah membinasakan aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “telah melintas atas aku” atau “telah melewati aku.”'
