  register: Bahasa Indonesia baku, puitis, dan bermartabat. Pengulangan ‘aku’ mempertahankan tekanan pribadi dalam ratapan. Kapitalisasi pada sufiks yang merujuk kepada Allah mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia.
