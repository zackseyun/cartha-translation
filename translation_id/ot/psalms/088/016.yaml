lexical_decisions:
- source_word: עָלַי עָבְרוּ
  choice: telah melanda aku
  rationale: Secara harfiah berarti ‘telah melintas/melewati aku’, tetapi dengan murka sebagai subjek, ‘melanda aku’ secara alami mempertahankan gambaran gerak yang dahsyat dan menguasai.
- source_word: חֲרוֹנֶיךָ
  choice: murka-Mu yang menyala-nyala
  rationale: Nomina ini menunjuk pada kemarahan yang berkobar. ‘Murka-Mu yang menyala-nyala’ mempertahankan citra panas dalam bahasa Ibrani sekaligus terdengar kuat dan bermartabat dalam bahasa Indonesia.
- source_word: בִּעוּתֶיךָ
  choice: kengerian dari-Mu
  rationale: Bentuk ini dapat menunjuk pada berbagai hal mengerikan yang berasal dari Allah dan menimbulkan ketakutan. Frasa ‘kengerian dari-Mu’ alami dalam konteks ratapan serta tidak mengubahnya menjadi sekadar perasaan batin pemazmur.
- source_word: צִמְּתוּתֻנִי
  choice: telah membinasakan aku
  rationale: Kata kerja צמת berarti membinasakan, melenyapkan, atau memutuskan. ‘Membinasakan’ menyampaikan intensitas bahasa ratapan dan cocok dengan ragam Alkitab Indonesia yang tetap mudah dipahami.
