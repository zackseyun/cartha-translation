  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: id
  text: Aku dianggap termasuk orang-orang yang turun ke liang[a]; aku menjadi seperti seorang laki-laki[b] yang tanpa kekuatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang-orang yang turun ke kubur." Dalam puisi Ibrani, "liang" atau "lubang" lazim menjadi gambaran tentang kematian atau dunia orang mati.
    reason: lexical_alternative
  - marker: b
    text: Atau "seorang yang perkasa." Kata Ibrani ini berarti laki-laki, tetapi dapat mengandung nuansa kekuatan atau keperkasaan sehingga menciptakan kontras dengan "tanpa kekuatan."
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: Aku dianggap termasuk
  rationale: Bentuk Nifal dari חשׁב menyatakan bahwa pemazmur dipandang atau diperhitungkan sebagai bagian dari suatu kelompok. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa pasifnya.
- source_word: עִם
  choice: termasuk
  rationale: Secara harfiah berarti 'dengan', tetapi bersama נֶחְשַׁבְתִּי menyatakan bahwa pemazmur digolongkan di antara mereka yang turun ke liang kubur.
- source_word: יוֹרְדֵי בוֹר
  choice: orang-orang yang turun ke liang kubur
  rationale: Partisip יוֹרְדֵי menggambarkan orang-orang yang sedang atau akan turun, sedangkan בּוֹר merupakan gambaran puitis bagi kematian atau dunia orang mati.
- source_word: הָיִיתִי
  choice: aku menjadi
  rationale: Perfek dari היה dapat menyatakan keadaan yang telah dialami atau dihasilkan. Dalam konteks ratapan ini, 'menjadi' secara wajar menyampaikan peralihan ke keadaan tidak berdaya tanpa menutup kemungkinan nuansa keadaan kini.
- source_word: כְּגֶבֶר
  choice: seperti seorang laki-laki
  rationale: גֶּבֶר berarti laki-laki dan dapat mengandung nuansa keperkasaan. Pilihan utama mempertahankan arti dasarnya, sementara nuansa kekuatan dijelaskan dalam catatan.
- source_word: אֵין אֱיָל
  choice: yang tidak berdaya
  rationale: Ungkapan ini secara harfiah menyatakan ketiadaan kekuatan atau daya. 'Tidak berdaya' alami, ringkas, dan mempertahankan kontras dengan kemungkinan nuansa kuat pada גֶּבֶר.
