  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: id
  text: Apakah perbuatan ajaib-Mu diketahui dalam kegelapan, atau keadilan-Mu[a] di negeri kelupaan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebenaran-Mu.”
    reason: lexical_alternative
  - marker: b
    text: “Negeri kelupaan” adalah ungkapan puitis untuk alam orang mati.
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/יִוָּדַע
  choice: Apakah ... diketahui
  rationale: Bentuk Nifal imperfek dalam pertanyaan retoris diterjemahkan dengan bentuk pasif bahasa Indonesia. Aspek waktunya tidak dipersempit menjadi masa depan karena konteks tidak menuntutnya.
- source_word: בַּ/חֹשֶׁךְ
  choice: dalam kegelapan
  rationale: Preposisi dengan kata sandang menunjuk pada 'kegelapan' tertentu; dalam konteks mazmur, ungkapan ini membangkitkan gambaran alam kematian.
- source_word: פִּלְאֶךָ
  choice: perbuatan ajaib-Mu
  rationale: Nomina tunggal ini dapat menunjuk pada keajaiban atau tindakan Allah yang menakjubkan. 'Perbuatan ajaib-Mu' mempertahankan bentuk tunggal sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וְצִדְקָתְךָ
  choice: atau kebenaran-Mu
  rationale: Kata penghubung Ibrani mengaitkan dua bagian pertanyaan retoris yang sejajar; 'atau' membuat hubungan itu alami dalam bahasa Indonesia. 'Kebenaran' mempertahankan cakupan makna צדקה, sedangkan 'keadilan' dicatat sebagai alternatif.
- source_word: בְּ/אֶרֶץ נְשִׁיָּה
  choice: di negeri kelupaan
  rationale: Terjemahan ini mempertahankan metafora puitis Ibrani tentang suatu negeri yang bercirikan kelupaan, tanpa menggantinya langsung dengan tafsiran 'alam orang mati'.
theological_decisions:
- issue: Makna צְדָקָה dalam gambaran puitis tentang sifat dan tindakan Allah
  choice: kebenaran
  alternative: keadilan
  rationale: Istilah Ibrani dapat mencakup kebenaran moral maupun keadilan. Teks utama memakai 'kebenaran', sementara alternatif kontekstual 'keadilan' dipertahankan dalam catatan kaki agar keluasan maknanya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan pertanyaan retoris serta kesejajaran kedua baris dipertahankan; metafora tentang kegelapan dan negeri kelupaan tidak dijelaskan di dalam teks utama.
