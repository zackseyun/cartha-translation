source:
  edition: WLC
  text: עָ֭לַ/י סָמְכָ֣ה חֲמָתֶ֑/ךָ וְ/כָל מִ֝שְׁבָּרֶ֗י/ךָ עִנִּ֥יתָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/007.yaml
  text: Your wrath has rested on me[a], and with all your breakers you have afflicted me. Selah
translation:
  language: id
  text: 'Murka-Mu menindih aku,

    dan dengan segala ombak-Mu yang menghempas[a], Engkau menyengsarakan aku. Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ombak laut yang pecah; dapat juga diterjemahkan “gelombang-Mu” atau “gelora-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סָמְכָה
  choice: menindih
  rationale: Kata kerja ini pada dasarnya menggambarkan tindakan menopang atau bersandar. Dengan murka sebagai subjek dan 'atas aku' sebagai pelengkap, 'menindih aku' mempertahankan gambaran sesuatu yang bertumpu berat pada pemazmur.
- source_word: חֲמָתֶךָ
  choice: murka-Mu
  rationale: חֵמָה menyatakan murka, panas amarah, atau kegusaran. 'Murka-Mu' wajar dalam ratapan dan mempertahankan bobot teologis amarah ilahi.
- source_word: מִשְׁבָּרֶיךָ
  choice: ombak-Mu yang menghempas
  rationale: מִשְׁבָּר menunjuk pada ombak laut yang pecah atau menghempas. Ungkapan ini lebih jelas dan alami bagi pembaca Indonesia daripada terjemahan harfiah yang kaku.
- source_word: עִנִּיתָ
  choice: Engkau menyengsarakan aku
  rationale: Bentuk Piel dari ענה dapat berarti membuat menderita, merendahkan, atau menindas. Dalam ratapan ini, 'menyengsarakan aku' menyampaikan penderitaan yang ditimpakan tanpa mempersempitnya menjadi penindasan sosial.
- source_word: וְכָל
  choice: dan dengan segala
  rationale: Terjemahan ini mempertahankan penghubung antarklausa serta keseluruhan sarana yang dipakai untuk menyengsarakan pemazmur.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis ini tidak pasti; karena itu bentuknya dialihaksarakan dan tidak ditafsirkan secara spekulatif.
theological_decisions:
- issue: Murka dan tindakan Allah dalam penderitaan pemazmur
  choice: 'Allah disapa secara langsung: murka-Nya menindih pemazmur dan Dia menyengsarakannya dengan ombak-Nya.'
  alternative: Membuat penderitaan itu terdengar impersonal atau melunakkan 'murka' menjadi kesusahan biasa.
  rationale: Teks Ibrani secara langsung mengaitkan murka dan tindakan yang mendatangkan penderitaan dengan Allah. Terjemahan mempertahankan ketegangan teologis dalam ratapan itu.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. 'Menindih' mempertahankan citra spasial klausa pertama, sedangkan 'ombak yang menghempas' menghadirkan citra laut secara jelas tanpa istilah teknis yang asing.
