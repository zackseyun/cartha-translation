base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/006.yaml
  text: You have put me in the lowest pit[a], in dark places, in the depths.
translation:
  language: id
  text: Engkau telah menempatkan aku di lubang yang paling dalam[a], di tempat-tempat gelap, di kedalaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: di lubang pada bagian yang paling bawah.'
    reason: Alternatif ini lebih harfiah mempertahankan bentuk jamak dan citra spasial תַּחְתִּיּוֹת, meskipun kurang luwes dalam bahasa Indonesia.
lexical_decisions:
- source_word: שַׁתַּנִי
  choice: Engkau telah menempatkan aku
  rationale: Bentuk ini menyatakan tindakan orang kedua tunggal terhadap pemazmur dan mempertahankan tudingan langsung kepada Allah. ‘Menempatkan’ alami bagi seseorang yang dibawa ke suatu keadaan atau lokasi, sedangkan ‘telah’ menandai tindakan yang sudah terjadi.
- source_word: בְּבוֹר
  choice: di lubang
  rationale: בּוֹר dapat berarti lubang, perigi, atau tempat seperti kurungan bawah tanah. ‘Lubang’ mempertahankan metafora puitis tanpa mempersempitnya menjadi ‘kubur’.
- source_word: תַּחְתִּיּוֹת
  choice: yang paling dalam
  rationale: Kata ini menunjuk pada bagian-bagian yang paling bawah. Dalam bahasa Indonesia, ‘lubang yang paling dalam’ secara alami menyampaikan tingkat kedalaman yang ekstrem; catatan kaki mempertahankan ungkapan alternatif yang lebih dekat dengan citra spasial harfiahnya.
- source_word: בְּמַחֲשַׁכִּים
  choice: di tempat-tempat gelap
  rationale: Bentuk jamak dipertahankan secara nyata sebagai ‘tempat-tempat gelap’, bukan diratakan menjadi kata abstrak tunggal ‘kegelapan’.
- source_word: בִּמְצֹלוֹת
  choice: di kedalaman
  rationale: Kata ini menunjuk pada tempat-tempat yang dalam, termasuk kedalaman air. ‘Di kedalaman’ alami dan tetap mempertahankan citra jurang atau kedalaman yang menelan.
theological_decisions:
- issue: Peran langsung Allah dalam ratapan
  choice: 'Mempertahankan sapaan orang kedua: ‘Engkau telah menempatkan aku’'
  alternative: Ungkapan pasif atau impersonal yang melunakkan peran Allah
  rationale: Teks Ibrani secara langsung menyapa Allah sebagai pihak yang menempatkan pemazmur dalam keadaan ini. Terjemahan mempertahankan ketegangan teologis ratapan tersebut tanpa meredakannya.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. ‘Engkau’ cocok untuk sapaan langsung kepada Allah, sementara susunan tiga frasa tempat mempertahankan paralelisme ayat.
