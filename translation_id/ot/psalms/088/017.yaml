  text: They surrounded me like water all day long[a]; together they closed in on me.
translation:
  language: id
  text: Mereka mengelilingi aku seperti air sepanjang hari[a]; bersama-sama mereka mengepung aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka mengepung aku seperti air sepanjang hari; bersama-sama mereka mengelilingi aku,” dengan memakai padanan alternatif bagi kedua kata kerja Ibrani yang paralel.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי
  choice: mereka mengelilingi aku
  rationale: Bentuk Qal perfektum orang ketiga jamak dengan akhiran orang pertama tunggal menggambarkan ancaman yang mengitari pemazmur; “mengelilingi aku” alami dan tetap dekat dengan citra Ibrani.
- source_word: כַמַּיִם
  choice: seperti air
  rationale: Awalan כ menyatakan perbandingan. Bentuk tunggal kolektif “air” wajar dalam bahasa Indonesia dan menyampaikan gambaran sesuatu yang meliputi atau membanjiri.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan waktu ini menunjukkan berlangsungnya keadaan selama seluruh hari; “sepanjang hari” ringkas, alami, dan mempertahankan daya duratifnya.
- source_word: הִקִּיפוּ
  choice: mereka mengepung aku
  rationale: Verba ini sejajar dengan סַבּוּנִי dan menegaskan tindakan mengitari dari segala sisi. “Mengepung” mempertahankan tekanan permusuhan tanpa mengulang verba pertama secara kaku.
- source_word: עָלַי
  choice: aku (sebagai sasaran pengepungan)
  rationale: Preposisi עַל secara harfiah dapat berarti “atas/terhadap aku”; bersama “mengepung,” sasarannya dinyatakan secara alami dalam bahasa Indonesia sebagai objek langsung.
- source_word: יָחַד
  choice: serentak
  rationale: Adverbia ini menyatakan tindakan bersama atau sebagai satu kesatuan. “Serentak” secara alami menonjolkan bahwa semua ancaman itu bergerak bersama.
