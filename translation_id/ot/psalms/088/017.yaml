translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. Paralelisme dipertahankan melalui “mengelilingi” dan “mengepung”; citra air tidak diperjelas secara berlebihan agar ambiguitas dan daya metaforis teks Ibrani tetap terjaga.
