  yaml_path: translation/ot/psalms/088/010.yaml
  text: Do you work wonders for the dead? Do the departed spirits rise up to praise you? Selah[a]
translation:
  language: id
  text: Apakah Engkau melakukan keajaiban bagi orang mati? Apakah para arwah[a] bangkit untuk memuji Engkau? Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bayang-bayang”; Ibrani Refaim, istilah puitis untuk orang mati di dunia orang mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: bagi orang mati
  rationale: Kata tanya הֲ bersama לַ membentuk pertanyaan ‘bagi orang mati?’. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya retoris ratapan.
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: melakukan keajaiban
  rationale: עשה berarti luas ‘melakukan/membuat’, sedangkan פֶּלֶא menunjuk pada perbuatan luar biasa Allah. Bentuk tunggal ‘keajaiban’ mengikuti bentuk Ibrani tanpa mempersempitnya menjadi ‘mukjizat’.
- source_word: אִם
  choice: Apakah
  rationale: Di sini אִם memperkenalkan pertanyaan retoris kedua yang sejajar, bukan syarat ‘jika’.
- source_word: רְפָאִים
  choice: arwah orang mati
  rationale: Dalam puisi ini רְפָאִים menunjuk kepada mereka yang telah mati di dunia orang mati. Pilihan ini jelas bagi pembaca modern serta tidak memakai nama etnis ‘Refaim’ yang dapat menyesatkan.
- source_word: יָקוּמוּ
  choice: bangkit
  rationale: קום menggambarkan tindakan bangun atau berdiri; ‘bangkit’ mempertahankan gambaran kuat teks tanpa menentukan suatu doktrin kebangkitan.
- source_word: יוֹדוּךָ
  choice: untuk memuji Engkau
  rationale: ידה bentuk Hifil dapat berarti bersyukur atau memuji. Dalam konteks ibadah mazmur, ‘memuji’ paling sesuai; ‘untuk’ menyatakan hubungan tujuan yang tersirat.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak pasti, sehingga ditransliterasikan menurut kebiasaan Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna רְפָאִים dalam gambaran puitis dunia orang mati
  choice: arwah orang mati
  alternative: bayang-bayang orang mati; orang-orang mati; Refaim
  rationale: Pilihan ini mempertahankan acuan kepada orang mati di dunia orang mati tanpa memasukkan klaim doktrinal yang lebih kemudian tentang keadaan antara kematian dan kebangkitan. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- issue: Daya retoris pertanyaan tentang orang mati yang bangkit dan memuji Allah
  choice: dipertahankan sebagai pertanyaan tanpa jawaban eksplisit
  alternative: menyatakannya sebagai penyangkalan langsung
  rationale: Teks Ibrani memakai pertanyaan retoris dalam ratapan. Terjemahan tidak mengubahnya menjadi pernyataan doktrinal mutlak, sehingga ketegangan puitis dan teologis tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi kata ganti untuk Allah mengikuti kebiasaan luas terjemahan Alkitab Indonesia. ‘Sela’ dipertahankan sebagai istilah teknis yang maknanya tidak pasti.
