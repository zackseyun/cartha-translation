id: PSA.88.5
reference: Psalms 88:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/מֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים שֹׁ֥כְבֵי קֶ֗בֶר אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣/ם ע֑וֹד וְ֝/הֵ֗מָּה מִ/יָּדְ/ךָ֥ נִגְזָֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: id
  text: Di antara orang mati aku bebas[a], seperti orang-orang terbunuh yang terbaring dalam kubur, yang tidak lagi Kauingat[b]; dan mereka telah terputus dari tangan-Mu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “terlepas di antara orang mati.” Kata Ibrani memakai bahasa kebebasan atau pelepasan secara ironis: pemazmur merasa seolah-olah sudah mati dan terlepas dari lingkungan serta kegiatan orang hidup.'
    reason: lexical_alternative
  - marker: b
    text: “Mengingat” di sini dapat berarti lebih dari sekadar mengenang dalam pikiran; kata ini juga dapat menyiratkan memperhatikan atau bertindak bagi seseorang.
    reason: lexical_alternative
  - marker: c
    text: “Tangan” merupakan gambaran Ibrani yang dapat menunjuk pada kuasa, kendali, atau pemeliharaan.
    reason: cultural_metaphor
lexical_decisions:
- source_word: בַּמֵּתִים
  choice: di antara orang mati
  rationale: Preposisi ב dengan bentuk jamak 'orang mati' menyatakan tempat atau lingkungan keberadaan, sehingga 'di antara' mempertahankan gambaran bahwa pemazmur sudah termasuk dalam ranah orang mati.
- source_word: חָפְשִׁי
  choice: bebas
  rationale: 'Kata sifat ini berarti ''bebas'' atau ''terlepas''. Pilihan harfiah ''bebas'' mempertahankan ironi puitisnya: kebebasan yang dimaksud bukan pembebasan yang menggembirakan, melainkan keadaan seperti orang mati yang terlepas dari kehidupan dan segala kegiatannya.'
- source_word: חֲלָלִים
  choice: orang-orang terbunuh
  rationale: Dalam puisi Ibrani kata ini lazim menunjuk kepada mereka yang tewas akibat kekerasan. 'Orang-orang terbunuh' jelas dan alami dalam bahasa Indonesia.
- source_word: שֹׁכְבֵי קֶבֶר
  choice: yang terbaring dalam kubur
  rationale: Ungkapan ini mempertahankan gambaran terus-menerus tentang mereka yang berbaring di dalam kubur.
- source_word: אֲשֶׁר לֹא זְכַרְתָּם עוֹד
  choice: yang tidak lagi Kauingat
  rationale: Terjemahan ini mempertahankan verba 'mengingat' dan keterangan waktu 'tidak lagi', tanpa mempersempit maknanya menjadi sekadar ingatan mental atau langsung menafsirkannya sebagai kepedulian.
- source_word: וְהֵמָּה
  choice: dan mereka
  rationale: Konjungsi Ibrani diterjemahkan langsung sebagai 'dan', tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
- source_word: מִיָּדְךָ
  choice: dari tangan-Mu
  rationale: Metafora 'tangan' dipertahankan karena dapat mencakup kuasa, kendali, maupun pemeliharaan Allah tanpa membatasi maknanya pada salah satu unsur saja.
- source_word: נִגְזָרוּ
  choice: telah terputus
  rationale: Bentuk pasif verba גזר menyampaikan keadaan telah dipotong atau dipisahkan. 'Telah terputus' mempertahankan kerasnya citra pemisahan itu dan cocok dengan aspek verba Ibrani.
theological_decisions:
- issue: Makna Allah 'mengingat' orang mati dalam ratapan
  choice: Mempertahankan ungkapan 'tidak lagi Kauingat' dalam teks utama.
  alternative: tidak lagi Kaupedulikan; tidak lagi Kauperhatikan
  rationale: Bahasa ratapan ini menggambarkan pengalaman pemazmur dan tidak perlu dipahami sebagai penyangkalan terhadap kemahatahuan Allah. 'Mengingat' mempertahankan ketegangan relasional dan teologis dalam bahasa sumber.
- issue: Arti paradoksal 'bebas' di antara orang mati
  choice: Mempertahankan kata 'bebas' dan menjelaskan ironinya dalam catatan kaki.
  alternative: terlepas; ditinggalkan di antara orang mati
  rationale: Bahasa sumber memakai citra kebebasan atau pelepasan secara ironis. Menggantinya dengan 'ditinggalkan' akan menghapus paradoks puitis dan menambahkan gagasan yang tidak dinyatakan langsung.
- issue: Terputus dari tangan Allah
  choice: Mempertahankan metafora 'tangan-Mu'.
  alternative: terputus dari kuasa-Mu; terlepas dari pemeliharaan-Mu
  rationale: Metafora Ibrani sengaja dibiarkan luas dan dapat menyiratkan kuasa, kendali, atau pemeliharaan. Teks utama tidak memilih hanya satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan awal yang mempertahankan tekanan pada keberadaan 'di antara orang mati'. Sapaan ilahi ditulis dengan huruf kapital menurut kebiasaan ejaan religius Indonesia. Metafora dan ketegangan dalam ratapan dipertahankan, sementara catatan kaki menjelaskan ironi serta keluasan maknanya.
