base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/014.yaml
  text: Why[a], O Yahweh[b], do you reject my soul? Why do you hide your face from me?
translation:
  language: id
  text: Mengapa, ya Yahweh, Engkau menolak jiwaku[a] dan menyembunyikan wajah-Mu dariku[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menolak aku” atau “menolak hidupku”. Kata Ibrani yang diterjemahkan “jiwaku” juga dapat berarti diri atau hidup seseorang.
    reason: lexical_alternative
  - marker: b
    text: “Menyembunyikan wajah” adalah ungkapan Ibrani yang menggambarkan Allah menarik kembali kehadiran, perhatian, atau perkenanan-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  choice: Mengapa
  rationale: Kata tanya alasan ini diterjemahkan secara langsung dan alami. Pengulangannya pada klausa kedua memperjelas kesejajaran ratapan yang tersirat dalam teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: תִּזְנַח
  choice: menolak
  rationale: Kata kerja ini menyatakan tindakan menolak atau membuang. “Menolak” jelas dalam bahasa Indonesia modern dan mempertahankan kerasnya keluhan pemazmur.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat menunjuk pada jiwa, diri, atau hidup seseorang. “Jiwaku” mempertahankan ungkapan konkret teks Ibrani, sementara cakupan maknanya dijelaskan dalam catatan kaki.
- source_word: תַּסְתִּיר
  choice: menyembunyikan
  rationale: Padanan langsung bagi bentuk kausatif kata kerja “menyembunyikan”; pilihan ini juga mempertahankan gambaran Ibrani yang menyertainya.
- source_word: פָּנֶיךָ
  choice: wajah-Mu
  rationale: Secara harfiah berarti “wajah-Mu”. Ungkapan konkret ini dipertahankan, sedangkan makna idiomatisnya diterangkan dalam catatan kaki.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Padanan ringkas dan alami untuk frasa preposisional “dari aku” dalam konteks ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama, tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
- issue: Makna ungkapan “menyembunyikan wajah”
  choice: Mempertahankan ungkapan konkret dalam teks utama
  alternative: menarik hadirat atau perhatian-Mu dariku
  rationale: Ungkapan itu menggambarkan ditariknya kehadiran, perhatian, atau perkenanan Allah. Mempertahankan citra aslinya menjaga daya puitis dan ketegangan ratapan tanpa mempersempitnya menjadi satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku yang modern, puitis, dan tetap mudah dipahami. Sapaan “ya Yahweh” mempertahankan nada ratapan langsung; huruf kapital pada pronomina ilahi mengikuti kelaziman bahasa religius Indonesia.
