  text: May my prayer come before you[b][a]; incline your ear to my cry.
translation:
  language: id
  text: Kiranya doaku sampai ke hadapan-Mu[a][b]; condongkanlah telinga-Mu kepada seruanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Biarlah doaku sampai ke hadapan-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “ke hadapan wajah-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: Kiranya ... sampai
  rationale: Bentuk imperfek qal orang ketiga feminin tunggal sesuai dengan subjek feminin “doaku.” Dalam konteks permohonan ini, bentuk tersebut menyatakan harapan atau permohonan. “Kiranya ... sampai” alami dalam bahasa Indonesia dan menyampaikan gerak menuju hadirat Allah.
- source_word: לְפָנֶיךָ
  choice: ke hadapan-Mu
  rationale: Secara harfiah berarti “ke hadapan wajah-Mu,” tetapi merupakan ungkapan tentang datang ke hadirat seseorang. “Ke hadapan-Mu” mempertahankan gambaran dan terdengar wajar dalam bahasa Indonesia.
- source_word: תְּפִלָּתִי
  choice: doaku
  rationale: תְּפִלָּה adalah kata umum untuk “doa”; bentuk dengan akhiran orang pertama tunggal berarti “doaku.”
- source_word: הַטֵּה
  choice: condongkanlah
  rationale: Imperatif hifil dari נטה berarti mengulurkan, memiringkan, atau mencondongkan. Bersama “telinga,” kata ini membentuk gambaran tentang mendengarkan dengan penuh perhatian.
- source_word: אָזְנְךָ
  choice: telinga-Mu
  rationale: Bentuk tunggal Ibrani dipertahankan sesuai dengan ungkapan kiasan tentang perhatian Allah.
- source_word: לְרִנָּתִי
  choice: kepada seruanku
  rationale: רִנָּה dapat menunjuk pada seruan nyaring, baik dalam sukacita maupun ratapan. Konteks ratapan Mazmur 88 mendukung “seruan,” tanpa memasukkan nuansa sukacita.
