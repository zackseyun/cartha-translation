  text: 'A song. A psalm of the sons of Korah. For the choirmaster: according to Mahalath Leannoth[a]. A Maskil[b] of Heman the Ezrahite.'
translation:
  language: id
  text: 'Nyanyian. Mazmur keturunan Korah. Untuk pemimpin musik: menurut Mahalath Leannot[a]. Maskil yang berkaitan dengan Heman, orang Ezrahi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “Mahalath Leannot” tidak pasti artinya. Mungkin ini menunjuk pada sebuah lagu atau gaya musik. Kemungkinan lain ialah “menurut Mahalath, untuk nyanyian bersahut-sahutan” atau “menurut Mahalath, mengenai penderitaan.”
    reason: lexical_alternative
  - marker: b
    text: “Maskil” adalah istilah teknis dalam judul mazmur, yang sering dipahami sebagai suatu karya yang bersifat mengajar atau untuk perenungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Nyanyian
  rationale: Label jenis karya dalam judul mazmur; “nyanyian” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah baku untuk karya pujian yang dinyanyikan atau diiringi musik.
- source_word: לִבְנֵי קֹרַח
  choice: bani Korah
  rationale: Ungkapan ringkas dan lazim untuk kelompok keturunan Korah; relasi yang ditandai ל dapat mencakup kepengarangan, kepemilikan, atau keterkaitan, sehingga tidak dipersempit menjadi “untuk”.
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Menunjukkan orang yang bertanggung jawab atas pelaksanaan musik; lebih luas daripada “pemimpin paduan suara” dan mudah dipahami pembaca modern.
- source_word: עַל
  choice: menurut
  rationale: Dalam judul musik, kata ini dapat memperkenalkan lagu, gaya, atau petunjuk pementasan tanpa memastikan fungsi teknisnya secara berlebihan.
- source_word: מָחֲלַת
  choice: Mahalath
  rationale: Makna tepat istilah ini tidak pasti dan mungkin merupakan nama lagu atau istilah musik; transliterasi mempertahankan ketidakpastian itu.
- source_word: לְעַנּוֹת
  choice: Leanot
  rationale: Bentuk ini dapat dipahami sebagai bagian dari istilah musik, nyanyian bersahut-sahutan, atau acuan pada penderitaan; transliterasi mencegah pemilihan tafsiran secara sepihak.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Istilah teknis dalam judul mazmur yang nuansanya tidak pasti; transliterasi mempertahankan sifat teknis dan ambiguitasnya.
- source_word: לְהֵימָן
  choice: Heman
  rationale: Ditempatkan sesudah “Maskil” untuk menyatakan keterkaitan karya dengan Heman tanpa memaksakan apakah ia pengarang, penerima, atau pihak yang terkait.
- source_word: הָאֶזְרָחִי
  choice: orang Ezrahi
  rationale: Sebutan identitas bagi Heman; bentuk ini mengikuti pembacaan tradisional nama tersebut tanpa menyamakannya secara pasti dengan keturunan Zerah.
