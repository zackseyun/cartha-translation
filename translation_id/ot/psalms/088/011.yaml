  text: הַ/יְסֻפַּ֣ר בַּ/קֶּ֣בֶר חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ בָּ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: id
  text: Apakah kasih setia-Mu diceritakan di dalam kubur, dan kesetiaan-Mu di Abadon[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kebinasaan” atau “di tempat kebinasaan.” Kata Ibrani Abadon adalah istilah puitis bagi ranah kebinasaan atau kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְסֻפַּר
  choice: Apakah ... diceritakan
  rationale: 'Bentuk Pual imperfek dengan partikel tanya menyatakan pertanyaan retoris dalam bentuk pasif: apakah sesuatu diceritakan atau dituturkan. “Diceritakan” alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa perbuatan Allah dikisahkan.'
- source_word: בַּקֶּבֶר
  choice: di dalam kubur
  rationale: קֶבֶר menunjuk pada kubur atau tempat penguburan. “Di dalam kubur” merupakan padanan yang jelas dan lazim dalam konteks puitis ini.
- source_word: חַסְדֶּךָ
  choice: kasih setia-Mu
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan loyalitas yang teguh. “Kasih setia” mempertahankan keluasan makna tersebut dan sudah wajar dalam bahasa Indonesia alkitabiah modern.
- source_word: אֱמוּנָתְךָ
  choice: kesetiaan-Mu
  rationale: אֱמוּנָה di sini menunjuk pada sifat Allah yang tetap dapat dipercaya, sejajar dengan חֶסֶד. “Kesetiaan” menyampaikan makna itu secara tepat dan ringkas.
- source_word: בָּאֲבַדּוֹן
  choice: di Abadon
  rationale: אֲבַדּוֹן dapat berarti kebinasaan atau ranah kebinasaan dan di sini sejajar dengan “kubur.” Mempertahankan nama puitis “Abadon” menjaga citra khas teks Ibrani, sementara artinya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Apakah אֲבַדּוֹן diterjemahkan sebagai kata benda umum atau dipertahankan sebagai istilah puitis bagi ranah kematian
  choice: Memakai “Abadon” dalam teks utama
  alternative: “kebinasaan” atau “tempat kebinasaan”
  rationale: Dalam paralelisme dengan “kubur,” istilah ini kemungkinan menunjuk pada ranah orang mati atau kebinasaan, bukan semata-mata kehancuran abstrak. Bentuk “Abadon” mempertahankan resonansi sastra teks tanpa memaksakan satu penafsiran, sedangkan alternatif maknanya disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Paralelisme kedua baris dipertahankan; kata kerja pada bagian kedua dibiarkan tersirat sebagaimana dalam teks Ibrani. Kata ganti ilahi ditulis dengan huruf kapital sesuai konvensi bahasa Indonesia.
