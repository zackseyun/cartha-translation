  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: id
  text: Aku sengsara dan sekarat sejak masa mudaku; aku telah menanggung kengerian-Mu; aku kewalahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata terakhir sulit dipastikan maknanya; dapat juga diterjemahkan “aku kebingungan”, “aku remuk tak berdaya”, atau “aku diliputi kengerian”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  choice: tertindas
  rationale: Dalam konteks ratapan, kata ini menyatakan keadaan sengsara atau menderita, bukan terutama kemiskinan ekonomi. “Tertindas” wajar dan sesuai dengan penderitaan yang memenuhi mazmur ini.
- source_word: וְגֹוֵעַ
  choice: sekarat
  rationale: Partisipel dari גוע menggambarkan keadaan sedang menuju kematian. “Sekarat” mempertahankan daya ungkap yang kuat dan berkelanjutan.
- source_word: מִנֹּעַר
  choice: sejak masa mudaku
  rationale: Preposisi מִן menandai keadaan yang berlangsung mulai dari masa muda; akhiran orang pertama tersirat secara wajar oleh konteks.
- source_word: נָשָׂאתִי
  choice: aku menanggung
  rationale: Bentuk perfek dari נשׂא secara harfiah berarti mengangkat atau membawa, dan di sini bermakna menanggung kedahsyatan. Bahasa Indonesia dapat memakai bentuk tak bertanda waktu “menanggung” sambil membiarkan konteks menunjukkan penderitaan yang telah dan masih dialami.
- source_word: אֵמֶיךָ
  choice: kedahsyatan-Mu
  rationale: Bentuk jamak ini menunjuk pada hal-hal yang menimbulkan kengerian dan memiliki sufiks orang kedua tunggal. “Kedahsyatan-Mu” mempertahankan sapaan langsung kepada Allah tanpa melunakkan asal atau keterkaitannya.
- source_word: אָפוּנָה
  choice: aku kewalahan
  rationale: Bentuk dan makna kata ini sulit dipastikan; dalam konteksnya, kata tersebut dapat menyatakan keadaan diliputi, bingung, atau remuk tak berdaya. “Kewalahan” menyampaikan tekanan yang melampaui kemampuan tanpa menentukan nuansanya terlalu sempit.
theological_decisions:
- issue: Rujukan “kedahsyatan-Mu”
  choice: Kedahsyatan itu secara langsung dikaitkan dengan Allah yang sedang disapa pemazmur.
  alternative: Kedahsyatan itu hanya rasa takut yang dialami di hadirat Allah, bukan sesuatu yang berasal dari tindakan-Nya.
  rationale: Sufiks orang kedua pada אֵמֶיךָ secara alami menyatakan kedahsyatan yang adalah milik Allah atau datang dari perlakuan-Nya. Terjemahan mempertahankan ketegangan teologis ratapan ini tanpa mengurangi peran ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab berbahasa Indonesia. Klausa-klausa pendek mempertahankan tekanan berturut-turut dalam ratapan Ibrani.
