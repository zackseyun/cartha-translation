  terminology: “Kengerian-Mu” secara idiomatis menyampaikan teror atau hal-hal yang mengerikan yang dikaitkan dengan Allah, tanpa menghaluskan ketegangan teologis teks. Kapitalisasi -Mu sesuai register Alkitab Indonesia.
