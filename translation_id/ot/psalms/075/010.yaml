  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
translation:
  language: id
  text: Dan Aku akan memotong semua tanduk orang fasik,[a] tetapi tanduk orang benar akan ditinggikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tanduk” adalah metafora untuk kekuatan, kuasa, atau kedudukan yang tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Dan segala
  rationale: וְ menghubungkan baris penutup ini dengan konteks sebelumnya, sedangkan כָּל menyatakan keseluruhan; “Dan segala” mempertahankan hubungan serta cakupan itu secara wajar dalam puisi Indonesia.
- source_word: קַרְנֵי / קַרְנוֹת
  choice: tanduk
  rationale: קֶרֶן secara harfiah berarti “tanduk” dan di sini menjadi metafora bagi kekuatan, kuasa, atau kedudukan yang tinggi. Citra konkret dipertahankan agar daya puitis teks tidak diratakan menjadi istilah abstrak.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Bentuk jamak substantival ini menunjuk secara kolektif kepada orang-orang yang hidup dalam kefasikan. “Orang fasik” merupakan padanan Alkitabiah yang tetap jelas dalam bahasa Indonesia modern.
- source_word: אֲגַדֵּעַ
  choice: akan kupatahkan
  rationale: Kata גדע berarti memotong atau menebas hingga putus. Dalam hubungan dengan tanduk, “kupatahkan” terdengar alami dan menyampaikan penghancuran kekuatan secara tegas, meskipun gambaran dasarnya adalah pemotongan.
- source_word: תְּרוֹמַמְנָה
  choice: akan ditinggikan
  rationale: Bentuk dari רום menyatakan pengangkatan atau peninggian dan bersesuaian dengan bentuk jamak feminin “tanduk.” Bentuk pasif “akan ditinggikan” mempertahankan orientasi hasil tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini berfungsi secara generik dan berpasangan secara puitis dengan “orang fasik.” “Orang benar” mempertahankan bentuk representatif tersebut.
theological_decisions:
- issue: Metafora tanduk sebagai gambaran kekuatan dan kehormatan
  choice: Mempertahankan “tanduk” dalam teks utama.
  alternative: Menerjemahkannya secara interpretatif sebagai “kekuatan,” “kuasa,” atau “kedudukan.”
  rationale: Metafora tanduk merupakan citra Alkitab yang mapan untuk kekuatan, kuasa, dan kehormatan. Mempertahankannya menjaga daya puitis serta tidak membatasi makna pada satu konsep abstrak saja.
- issue: Pelaku dalam bentuk “akan ditinggikan”
  choice: Tidak menyebutkan pelaku secara eksplisit.
  alternative: “Akan Kutinggikan” atau “Allah akan meninggikan.”
  rationale: Bentuk Ibrani menyatakan bahwa tanduk-tanduk itu akan menjadi tinggi tanpa secara eksplisit menyebut pelakunya. Terjemahan pasif menjaga ambiguitas gramatikal dan teologis ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan paralel dipertahankan; istilah “orang fasik” dan “orang benar” dipilih sebagai kategori moral yang ringkas serta lazim dalam register Alkitabiah. Penanda catatan kaki [a] ditempatkan langsung setelah klausa yang pertama kali memakai metafora tersebut.
