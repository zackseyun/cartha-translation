id: PSA.75.3
reference: Psalms 75:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נְֽמֹגִ֗ים אֶ֥רֶץ וְ/כָל יֹשְׁבֶ֑י/הָ אָנֹכִ֨י תִכַּ֖נְתִּי עַמּוּדֶ֣י/הָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/003.yaml
  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: id
  text: Bumi dan semua penghuninya luluh[a]; Aku sendiri telah meneguhkan tiang-tiangnya.[b] Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “goyah”, “buyar”, atau “terguncang”. Gambaran Ibraninya menunjukkan ketidakstabilan atau keruntuhan.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah mengokohkan” atau “telah menetapkan dengan kokoh”.
    reason: lexical_alternative
  - marker: c
    text: “Sela” secara tradisional ditransliterasikan; makna tepatnya tidak pasti.
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: luluh
  rationale: Partisipel dari מוג menggambarkan keadaan mencair, buyar, atau runtuh. “Luluh” mempertahankan citra puitis tentang hilangnya kestabilan, sedangkan catatan kaki mencantumkan kemungkinan lain.
- source_word: אֶרֶץ
  choice: bumi
  rationale: Kaitan dengan semua penghuninya dan tiang-tiangnya mendukung cakupan kosmis, bukan sekadar suatu negeri.
- source_word: יֹשְׁבֶיהָ
  choice: semua penghuninya
  rationale: Ungkapan ini secara alami menyampaikan semua orang yang tinggal di bumi tanpa kehilangan cakupan kolektifnya.
- source_word: אָנֹכִי
  choice: Aku sendiri
  rationale: Kata ganti mandiri ini bersifat menegaskan; “Aku sendiri” mempertahankan penekanan tanpa menambahkan gagasan bahwa tidak ada pelaku lain.
- source_word: תִכַּנְתִּי
  choice: telah meneguhkan
  rationale: Bentuk Piel dari כון di sini menyatakan tindakan membuat kukuh atau menetapkan dengan kokoh; pilihan ini sesuai dengan objek berupa tiang-tiang.
- source_word: עַמּוּדֶיהָ
  choice: tiang-tiangnya
  rationale: Terjemahan harfiah ini mempertahankan citra kosmologis puitis dalam teks sumber.
- source_word: סֶּלָה
  choice: Sela
  rationale: Makna tepat istilah ini tidak pasti, sehingga ditransliterasikan alih-alih diberi arti spekulatif dalam teks utama.
theological_decisions:
- issue: Citra kosmologis tentang tiang-tiang bumi
  choice: Mempertahankan secara harfiah ungkapan “tiang-tiangnya”.
  alternative: dasar-dasarnya; penopang-penopangnya
  rationale: Mazmur memakai citra dunia kuno secara puitis untuk menyatakan kuasa Allah yang menstabilkan. Terjemahan tidak mengubahnya menjadi penjelasan ilmiah modern.
- issue: Identitas pembicara yang ditegaskan oleh אָנֹכִי
  choice: Menerjemahkan sebagai “Aku sendiri” tanpa menambahkan identitas dalam ayat ini.
  alternative: Akulah; hanya Aku
  rationale: Penegasan gramatikal dipertahankan, tetapi eksklusivitas tambahan atau identifikasi pembicara yang tidak dinyatakan langsung dalam ayat ini tidak dimasukkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan langsung mengikuti teks Ibrani tanpa menambahkan penghubung waktu seperti “ketika”. Tanda baca memisahkan keadaan bumi dari tindakan tegas sang pembicara.
