base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
translation:
  language: id
  text: 'Untuk pemimpin musik: “Jangan Musnahkan.”[a] Mazmur Asaf.[b] Sebuah nyanyian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mungkin juga nama lagu atau petunjuk musik: “Jangan Musnahkan.”'
    reason: cultural_note
  - marker: b
    text: Ungkapan “Mazmur Asaf” dapat menunjukkan bahwa mazmur ini digubah oleh Asaf, berkaitan dengannya, atau termasuk dalam kumpulan mazmur kaum Asaf.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Istilah ini dalam judul-judul mazmur menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: אַל תַּשְׁחֵת
  choice: “Jangan Musnahkan”
  rationale: Makna harfiahnya adalah larangan untuk memusnahkan atau merusak. Tanda petik menunjukkan bahwa frasa ini kemungkinan merupakan judul, nama lagu, atau petunjuk musik, bukan bagian dari isi proposisional mazmur.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah sebutan jenis karya yang lazim untuk nyanyian ibadah yang diiringi musik; istilah baku Indonesia 'mazmur' mempertahankan pembedaan dari שִׁיר.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Konstruksi 'Mazmur Asaf' tetap dapat mencakup karya oleh Asaf, karya yang berkaitan dengannya, atau mazmur dalam kumpulan Asaf, tanpa memaksakan satu hubungan tertentu.
- source_word: שִׁיר
  choice: Sebuah nyanyian
  rationale: Sebutan jenis karya yang kedua diterjemahkan secara terpisah agar rangkaian ganda Ibrani מִזְמוֹר ... שִׁיר tidak dilebur menjadi satu.
