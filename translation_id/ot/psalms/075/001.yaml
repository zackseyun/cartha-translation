source:
  edition: WLC
  text: ה֘וֹדִ֤ינוּ לְּ/ךָ֨ אֱֽלֹהִ֗ים ה֭וֹדִינוּ וְ/קָר֣וֹב שְׁמֶ֑/ךָ סִ֝פְּר֗וּ נִפְלְאוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/001.yaml
  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
translation:
  language: id
  text: Kami bersyukur kepada-Mu, ya Allah, kami bersyukur; nama-Mu dekat[b], dan orang-orang menceritakan perbuatan-perbuatan-Mu yang ajaib.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perbuatan-perbuatan-Mu yang ajaib diceritakan.” Bahasa Ibrani memakai kata kerja orang ketiga jamak tanpa menyebutkan subjeknya.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “nama-Mu dekat” dapat menyiratkan bahwa Allah sendiri dekat, kehadiran-Nya nyata, atau nama dan sifat-Nya dikenal. Ungkapan Ibraninya dipertahankan tanpa menentukan satu makna saja.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִינוּ
  choice: kami bersyukur
  rationale: Bentuk hifil dari ידה dalam konteks mazmur paling wajar menyatakan ucapan syukur kepada Allah; pengulangannya dipertahankan.
- source_word: לְּךָ אֱלֹהִים
  choice: kepada-Mu, ya Allah
  rationale: Preposisi dan pronomina dinyatakan secara eksplisit, sedangkan אֱלֹהִים diterjemahkan sebagai sapaan langsung yang alami dalam bahasa Indonesia.
- source_word: וְקָרוֹב
  choice: dan ... dekat
  rationale: Konjungsi Ibrani diterjemahkan secara langsung sebagai 'dan' agar hubungan antarklausa tidak dipersempit menjadi hubungan sebab yang tidak dinyatakan secara tegas.
- source_word: שְׁמֶךָ
  choice: nama-Mu
  rationale: Ungkapan teologis Ibrani dipertahankan tanpa diparafrasakan sebagai kehadiran, kemasyhuran, atau sifat Allah.
- source_word: סִפְּרוּ
  choice: orang-orang menceritakan
  rationale: Kata kerja orang ketiga jamak tidak menyebutkan subjek. 'Orang-orang' menyampaikan subjek jamak tak tentu secara alami, sementara 'menceritakan' mempertahankan gagasan memberitakan atau mengisahkan.
- source_word: נִפְלְאוֹתֶיךָ
  choice: perbuatan-perbuatan-Mu yang ajaib
  rationale: Nomina ini menunjuk pada tindakan luar biasa Allah yang menimbulkan kekaguman; terjemahan ini konkret dan mudah dipahami.
theological_decisions:
- issue: Makna ungkapan 'nama-Mu dekat'
  choice: Mempertahankan ungkapan Ibrani 'nama-Mu dekat'.
  alternative: kehadiran-Mu dekat; kemasyhuran-Mu nyata/dekat
  rationale: '''Nama'' dapat menunjuk pada karakter Allah yang dinyatakan, kemasyhuran-Nya, atau kehadiran perjanjian-Nya. Teks tidak mengharuskan satu tafsiran saja, sehingga ambiguitas teologisnya dipertahankan.'
- issue: Hubungan וְקָרוֹב dengan ucapan syukur
  choice: dan nama-Mu dekat
  alternative: sebab nama-Mu dekat
  rationale: ו dapat bersifat koordinatif atau membawa nuansa penjelasan. 'Dan' mempertahankan hubungan yang lebih terbuka dan dekat dengan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras doa-puisi yang khidmat tetapi mudah dipahami. Kapitalisasi pronomina ilahi dipakai secara konsisten. Tanda titik koma menandai pembagian utama ayat, dan semua penanda catatan kaki muncul dalam teks.
