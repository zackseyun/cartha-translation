  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י לֹ֣א מִ֭/מּוֹצָא וּ/מִֽ/מַּעֲרָ֑ב וְ֝/לֹ֗א מִ/מִּדְבַּ֥ר הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: id
  text: Sebab peninggian tidak datang dari timur atau dari barat, dan tidak juga dari padang gurun.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pengangkatan” atau, secara lebih idiomatis, “kenaikan kedudukan”. Ungkapan Ibraninya ringkas dan sulit; ayat berikutnya menjelaskan bahwa Allah merendahkan yang satu dan meninggikan yang lain.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani terakhir juga dapat dipahami sebagai “gunung-gunung”, sehingga bagian akhirnya dapat diterjemahkan kira-kira, “dan bukan dari padang gurun bergunung-gunung”. Namun, konteks lebih mendukung arti “peninggian”.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai penjelasan bagi pernyataan sebelumnya dan sesuai dengan alur argumentasi mazmur.
- source_word: מִמּוֹצָא
  choice: dari timur
  rationale: Kata ini secara harfiah berkaitan dengan terbitnya matahari dan lazim menunjuk arah timur; terjemahan ini alami sekaligus mempertahankan gambaran arah.
- source_word: וּמִמַּעֲרָב
  choice: atau dari barat
  rationale: מַעֲרָב menunjuk tempat matahari terbenam atau arah barat. Kata hubung 'atau' membentuk rangkaian negatif yang wajar dalam bahasa Indonesia.
- source_word: מִמִּדְבַּר
  choice: dari padang gurun
  rationale: מִדְבָּר berarti wilayah belantara atau gurun; 'padang gurun' jelas dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: הָרִים
  choice: peninggian
  rationale: Dalam konteks ayat berikutnya, bentuk ini paling mungkin berhubungan dengan רום, 'mengangkat/meninggikan'. Nomina 'peninggian' mempertahankan gagasan seseorang diangkat ke kedudukan tinggi tanpa mempersempitnya menjadi promosi jabatan.
theological_decisions:
- issue: Makna הָרִים dalam klausa Ibrani yang eliptis
  choice: Dipahami sebagai 'peninggian', yang tidak berasal dari arah atau sumber duniawi mana pun.
  alternative: Dibaca sebagai nomina 'gunung-gunung', sehingga bagian akhir dapat dipahami sebagai 'bukan dari padang gurun bergunung-gunung'.
  rationale: Ayat berikutnya menyatakan bahwa Allah merendahkan yang satu dan meninggikan yang lain. Konteks ini mendukung hubungan הָרִים dengan tindakan meninggikan, tetapi bacaan 'gunung-gunung' tetap dicatat karena bentuk tulisannya memungkinkan pemahaman tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan menempatkan 'peninggian' di awal, sementara rangkaian arah dan pengulangan negasinya tetap dipertahankan.
