    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תָּרִימוּ
  choice: Jangan tinggikan
  rationale: Bentuk larangan Ibrani diterjemahkan secara langsung; 'tinggikan' mempertahankan gambaran gerak ke atas sekaligus nuansa meninggikan diri.
- source_word: לַמָּרוֹם
  choice: tinggikan
  rationale: Unsur arah 'ke tempat tinggi/ke atas' dipadukan secara alami ke dalam verba Indonesia agar tidak menghasilkan ungkapan kaku seperti 'tinggikan ke tempat tinggi'.
- source_word: קַרְנְכֶם
  choice: tandukmu
  rationale: Arti harfiah 'tanduk' dipertahankan sebagai metafora kekuatan, kuasa, atau kesombongan; akhiran Ibrani berbentuk jamak, tetapi sapaan kolektif Indonesia wajar memakai bentuk tunggal generik.
- source_word: תְּדַבְּרוּ
  choice: berbicara
  rationale: Padanan umum dan bermartabat untuk tindakan berkata-kata.
- source_word: בְצַוָּאר עָתָק
  choice: dengan tengkuk yang angkuh
  rationale: Mempertahankan metafora jasmani Ibrani mengenai sikap membangkang dan sombong, tanpa mereduksinya menjadi keterangan abstrak saja.
theological_decisions:
- issue: Makna metaforis 'tanduk'
  choice: Metafora dipertahankan dalam teks utama dan dijelaskan dalam catatan.
  alternative: Menggantikannya dengan 'kekuatanmu', 'kuasamu', atau 'kesombonganmu'.
  rationale: Bahasa sumber sengaja memakai citra tanduk; mempertahankannya menjaga keluasan makna dan hubungan puitis dengan konteks mazmur.
- issue: Hubungan עָתָק dengan 'tengkuk' dan tindakan berbicara
  choice: Diterjemahkan 'berbicara dengan tengkuk yang angkuh'.
  alternative: '''berbicara dengan lancang'' atau ''berbicara dengan keras kepala''.'
  rationale: Susunan Ibrani tidak sepenuhnya biasa dan mengandung metafora tubuh. Terjemahan utama mempertahankan ketegangan itu, sedangkan catatan menjelaskan kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Metafora 'tanduk' dan 'tengkuk' dipertahankan karena penting bagi citra teks Ibrani, dengan catatan kaki untuk membantu pembaca umum.
