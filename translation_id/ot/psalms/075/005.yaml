  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
translation:
  language: id
  text: Jangan angkat tanduk kalian[a] tinggi-tinggi; jangan berbicara dengan tengkuk yang angkuh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Tanduk'' adalah metafora bagi kekuatan, kuasa, atau sikap meninggikan diri.'
