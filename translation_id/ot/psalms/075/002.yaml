source:
  edition: WLC
  text: כִּ֭י אֶקַּ֣ח מוֹעֵ֑ד אֲ֝נִ֗י מֵישָׁרִ֥ים אֶשְׁפֹּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/002.yaml
  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: id
  text: Sebab ketika Aku memilih waktu yang ditetapkan[a], Aku sendiri akan menghakimi dengan adil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika Aku mengambil waktu yang ditetapkan”; ungkapan ini juga dapat dipahami sebagai “ketika Aku menetapkan waktunya”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan kelurusan” atau “dengan keadilan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan pernyataan tersebut dengan ayat sebelumnya sebagai alasan atau penjelasan, sambil membiarkan unsur waktu dinyatakan oleh klausa berikutnya.
- source_word: אֶקַּח מוֹעֵד
  choice: ketika Aku memilih waktu yang ditetapkan
  rationale: Secara harfiah verba לקח berarti “mengambil”, sedangkan מוֹעֵד menunjuk pada waktu yang telah ditentukan. Dalam gabungan ini, “memilih waktu yang ditetapkan” menyampaikan idiom Ibrani secara wajar tanpa menghilangkan alternatif harfiahnya.
- source_word: אֲנִי
  choice: Aku sendiri
  rationale: Pronomina mandiri ini memberi penekanan karena orang pertama sudah terkandung dalam bentuk verba; “Aku sendiri” mempertahankan penekanan tersebut.
- source_word: מֵישָׁרִים
  choice: dengan adil
  rationale: Bentuk jamak abstrak ini menyatakan kelurusan atau keadilan, khususnya dalam tindakan menghakimi. “Dengan adil” alami dalam bahasa Indonesia dan mempertahankan nuansa moral-yudisialnya.
- source_word: אֶשְׁפֹּט
  choice: akan menghakimi
  rationale: Dalam konteks pernyataan mengenai waktu yang ditetapkan, bentuk imperfek paling wajar dipahami sebagai tindakan penghakiman yang akan dilakukan.
theological_decisions:
- issue: Identitas pembicara dan klaim penghakiman
  choice: Mempertahankan pernyataan orang pertama tanpa menambahkan nama “Allah” ke dalam teks ayat.
  alternative: Menyebut pembicara secara eksplisit sebagai Allah.
  rationale: Konteks mazmur menunjuk pada perkataan ilahi, tetapi ayat Ibrani sendiri hanya memakai bentuk orang pertama. Terjemahan mempertahankan klaim penghakiman dan kedaulatan pembicara tanpa membuat identifikasi tersirat itu menjadi tambahan eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku” mengikuti identitas pembicara yang dipahami dari konteks, sementara nama pembicara tidak ditambahkan ke dalam teks. Susunan kalimat menjaga hubungan penjelas “Sebab”, penekanan “Aku sendiri”, dan nuansa waktu dari klausa pertama.
