  text: אָמַ֣רְתִּי לַֽ֭/הוֹלְלִים אַל תָּהֹ֑לּוּ וְ֝/לָ/רְשָׁעִ֗ים אַל תָּרִ֥ימוּ קָֽרֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: id
  text: Aku berkata kepada orang-orang sombong, “Jangan menyombongkan diri,” dan kepada orang-orang fasik, “Jangan meninggikan tanduk kalian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan meninggikan kekuatan kalian” atau “Jangan meninggikan diri dengan congkak.” Dalam bahasa Ibrani, “tanduk” adalah kiasan untuk kekuatan, kedudukan, atau peninggian diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Aku berkata
  rationale: Bentuk Qal perfektif orang pertama tunggal paling wajar diterjemahkan sebagai tindakan lampau dalam konteks puitis ini.
- source_word: הוֹלְלִים
  choice: orang-orang sombong
  rationale: Dalam konteks ini kata tersebut menunjuk kepada mereka yang membanggakan atau meninggikan diri. Pilihan ini alami dalam bahasa Indonesia dan tetap terkait secara makna dengan larangan berikutnya.
- source_word: אַל תָּהֹלּוּ
  choice: Jangan menyombongkan diri
  rationale: Larangan kepada orang kedua jamak ini menyampaikan makna membual atau berlaku congkak serta mempertahankan kaitan dengan 'orang-orang sombong'.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Istilah ini mempertahankan kategori moral yang lazim dalam Mazmur tanpa mempersempitnya menjadi status hukum saja.
- source_word: אַל תָּרִימוּ
  choice: Jangan meninggikan
  rationale: Terjemahan langsung bentuk Hifil dengan larangan, sekaligus cocok dengan gambaran puitis 'tanduk'.
- source_word: קָרֶן
  choice: tanduk kalian
  rationale: Metafora 'tanduk' dipertahankan sebagai lambang kekuatan, kedudukan, atau keangkuhan. Kata ganti jamak dibuat tersurat agar sapaan kepada kelompok terdengar alami dalam bahasa Indonesia, meskipun bahasa Ibrani tidak memuat sufiks posesif.
theological_decisions:
- issue: Daya metaforis 'tanduk'
  choice: Mempertahankan metafora sebagai 'tanduk kalian' dalam teks utama
  alternative: Jangan meninggikan kekuatan kalian; Jangan meninggikan diri dengan congkak
  rationale: Metafora Ibrani dapat mencakup kekuatan, kedudukan, dan peninggian diri dengan sombong. Mempertahankan gambarnya menghindari pembatasan makna pada satu tafsiran saja, sedangkan catatan kaki memberi penjelasan bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan 'sombong/menyombongkan diri' mencerminkan kaitan leksikal dalam bahasa Ibrani, sedangkan metafora 'tanduk' dipertahankan dan dijelaskan melalui catatan kaki.
