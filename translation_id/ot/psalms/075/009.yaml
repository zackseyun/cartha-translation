  yaml_path: translation/ot/psalms/075/009.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
translation:
  language: id
  text: Namun, aku[a] akan memberitakan untuk selama-lamanya; aku akan menyanyikan pujian kepada Allah Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan aku akan memberitakan untuk selama-lamanya.” Konjungsi Ibrani dapat diterjemahkan sebagai “dan” atau, dalam konteks ini, sebagai “namun” untuk menyatakan pertentangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Konjungsi ו dengan pronomina mandiri אֲנִי memberi penekanan pada pembicara dan, dalam konteks, paling wajar dipahami sebagai pertentangan dengan nasib orang fasik pada ayat di sekitarnya.
- source_word: אַגִּיד
  choice: akan memberitakan
  rationale: Bentuk hifil dari נגד berarti menyatakan atau membuat sesuatu diketahui. 'Memberitakan' mempertahankan nuansa penyampaian terbuka tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa batas dan sesuai dengan ikrar pemazmur yang terus-menerus.
- source_word: אֲזַמְּרָה
  choice: akan menyanyikan pujian
  rationale: Bentuk piel dari זמר menunjuk pada kegiatan bermusik atau bernyanyi sebagai pujian; ungkapan ini menyampaikan unsur musikal sekaligus arah pujiannya secara jelas dalam bahasa Indonesia modern.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: bagi Allah Yakub
  rationale: Prefiks ל menandai penerima pujian, sedangkan 'Allah Yakub' mempertahankan sebutan perjanjian dalam teks sumber.
theological_decisions:
- issue: Pertentangan antara sikap pembicara dan orang fasik dalam konteks sekitar
  choice: 'Pembukaan diterjemahkan secara kontras: ''Namun aku'''
  alternative: '''Dan aku'''
  rationale: Pronomina mandiri menegaskan subjek, dan alur mazmur mendukung hubungan pertentangan. Catatan kaki mempertahankan kemungkinan bahwa konjungsi tersebut hanya bersifat penghubung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Menyanyikan pujian' dipilih alih-alih 'bermazmur' agar mudah dipahami pembaca umum, sedangkan 'Allah Yakub' dipertahankan sebagai sebutan khas dalam Mazmur.
