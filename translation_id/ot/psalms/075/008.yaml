  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י כ֪וֹס בְּֽ/יַד יְהוָ֡ה וְ/יַ֤יִן חָמַ֨ר מָ֥לֵא מֶסֶךְ֮ וַ/יַּגֵּ֪ר מִ֫/זֶּ֥ה אַךְ שְׁ֭מָרֶי/הָ יִמְצ֣וּ יִשְׁתּ֑וּ כֹּ֝֗ל רִשְׁעֵי אָֽרֶץ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: id
  text: Sebab di tangan Yahweh ada sebuah cawan; anggur itu berbuih dan penuh dengan ramuan.[a] Ia menuangkan dari cawan itu, dan semua orang fasik di bumi pasti akan mengisap habis ampasnya lalu meminumnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penuh dengan campuran” atau “tercampur sempurna.” Bahasa Ibrani merujuk pada anggur yang telah diramu; mungkin campuran itu mengandung rempah-rempah.
    reason: lexical_alternative
  - marker: b
    text: “Ampasnya” adalah endapan anggur di dasar cawan. Gambarannya ialah bahwa orang fasik harus meminum isi cawan itu sampai habis.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau dasar bagi pernyataan sebelumnya dan mempertahankan alur argumentatif mazmur.
- source_word: כּוֹס
  choice: cawan
  rationale: Padanan alami dan bermartabat yang mempertahankan gambaran konkret tentang wadah penghukuman ilahi.
- source_word: בְּיַד יְהוָה
  choice: di tangan Yahweh
  rationale: Mempertahankan idiom Ibrani yang menyatakan kepemilikan dan kendali.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung agar rujukan perjanjian dalam teks sumber tetap terlihat.
- source_word: יַיִן חָמַר
  choice: anggurnya berbuih
  rationale: חָמַר paling mungkin menggambarkan anggur yang berbuih atau bergejolak, bukan sekadar warnanya.
- source_word: מָלֵא מֶסֶךְ
  choice: penuh dengan campuran rempah-rempah
  rationale: Mengungkapkan anggur yang telah diramu; catatan kaki mempertahankan kemungkinan bahwa frasa ini lebih umum berarti campuran atau anggur yang tercampur sempurna.
- source_word: וַיַּגֵּר מִזֶּה
  choice: Ia menuangkan dari cawan itu
  rationale: Menyampaikan tindakan menuang dari cawan secara jelas tanpa menentukan objek yang tidak dinyatakan.
- source_word: אַךְ
  choice: pasti
  rationale: Menyampaikan penegasan dan kepastian hukuman dalam konteks ini.
- source_word: שְׁמָרֶיהָ
  choice: ampasnya
  rationale: Merujuk pada endapan anggur di dasar cawan; 'ampas' mudah dipahami pembaca Indonesia.
- source_word: יִמְצוּ יִשְׁתּוּ
  choice: akan mengisap habis ... lalu meminumnya
  rationale: Mempertahankan kekuatan verba pertama yang menggambarkan pengosongan sampai tuntas, disusul tindakan minum.
- source_word: כֹּל רִשְׁעֵי אָרֶץ
  choice: semua orang fasik di bumi
  rationale: Padanan langsung dan lazim bagi kelompok yang menjadi sasaran gambaran penghukuman.
theological_decisions:
- issue: Penerjemahan nama ilahi
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memuat tetragramaton; transliterasi mempertahankan nama diri tanpa menambahkan penafsiran denominatif.
- issue: Gambaran cawan
  choice: Mempertahankan metafora cawan berisi anggur tanpa menambahkan kata 'murka' atau 'penghukuman' dalam teks utama
  alternative: cawan murka atau cawan penghukuman
  rationale: Konteks menunjukkan penghukuman ilahi, tetapi ayat ini menyampaikannya melalui gambaran puitis, bukan label eksplisit.
- issue: Makna מֶסֶךְ
  choice: campuran rempah-rempah dengan alternatif dalam catatan kaki
  alternative: campuran; tercampur sempurna
  rationale: Kata tersebut menunjukkan anggur ramuan, tetapi isi campurannya tidak dinyatakan dengan pasti; catatan menjaga ambiguitas leksikal.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Struktur ayat dibuat lancar tanpa menghilangkan rangkaian tindakan dalam bahasa Ibrani. Istilah 'orang fasik', 'cawan', dan 'ampas' dipilih karena jelas serta sesuai dengan register mazmur.
