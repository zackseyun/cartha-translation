  text: כִּֽי אֱלֹהִ֥ים שֹׁפֵ֑ט זֶ֥ה יַ֝שְׁפִּ֗יל וְ/זֶ֣ה יָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/007.yaml
  text: 'For God is the judge: he brings one down[b][a], and lifts up another.'
translation:
  language: id
  text: 'Sebab Allah adalah hakim[a]: Ia merendahkan yang satu dan meninggikan yang lain.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah menghakimi.” Partisip Ibrani ini dapat dipahami secara verbal atau sebagai ungkapan predikatif yang menyerupai kata benda.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “yang ini Ia rendahkan, dan yang ini Ia tinggikan”—ungkapan distributif yang berarti “yang satu ... yang lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan dasar atau penjelasan bagi pernyataan sebelumnya; “Sebab” menyampaikan hubungan tersebut secara alami.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk predikat tunggal dan konteks penghakiman ilahi menunjukkan bahwa yang dimaksud ialah Allah.
- source_word: שֹׁפֵט
  choice: adalah hakim
  rationale: Partisip Ibrani ini dapat berfungsi sebagai predikat yang menyerupai kata benda, sehingga terjemahan ini menonjolkan peran Allah sebagai hakim sambil tetap mencatat kemungkinan nuansa verbal.
- source_word: זֶה ... וְזֶה
  choice: yang satu ... yang lain
  rationale: Pengulangan kata tunjuk ini dipakai secara distributif. Ungkapan “yang satu ... yang lain” merupakan padanan Indonesia yang alami.
- source_word: יַשְׁפִּיל
  choice: merendahkan
  rationale: Bentuk kausatif dari שׁפל berarti membuat rendah atau membawa turun; “merendahkan” mempertahankan makna kausatif dan berpasangan dengan “meninggikan”.
- source_word: יָרִים
  choice: meninggikan
  rationale: Bentuk kausatif dari רום menyatakan tindakan mengangkat atau membuat tinggi; “meninggikan” mempertahankan gambaran vertikal dan kesejajarannya dengan “merendahkan”.
theological_decisions:
- issue: Peran penghakiman Allah dalam frasa אֱלֹהִים שֹׁפֵט
  choice: Allah adalah hakim
  alternative: Allah menghakimi
  rationale: Bahasa Ibrani memungkinkan nuansa nominal maupun verbal. Teks utama mempertahankan nuansa peran Allah sebagai hakim, sedangkan catatan kaki menjaga kemungkinan pembacaan verbal tanpa menambahkan rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur aktif dengan subjek “Ia” mempertahankan tindakan Allah secara jelas. Kata “hakim” ditulis sebagai nomina umum predikatif, bukan sebagai gelar tambahan.
