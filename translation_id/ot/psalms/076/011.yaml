source:
  edition: WLC
  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: id
  text: Bernazarlah kepada Yahweh, Allah kalian, dan penuhilah nazar-nazar kalian. Hendaklah semua orang di sekeliling-Nya membawa upeti[a] kepada Yang Patut Ditakuti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan” atau “pemberian”. Kata Ibrani שַׁי dapat menunjuk pada pemberian yang dibawa kepada pihak yang dihormati atau berkuasa; “upeti” menonjolkan nuansa penghormatan dan kemungkinan nuansa politiknya.
    reason: lexical_alternative
  - marker: b
    text: Atau “Yang Dahsyat” atau “Dia yang harus ditakuti”. Sebutan Ibrani ini menekankan bahwa Allah patut menjadi objek rasa takut dan gentar.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: Bernazarlah
  rationale: Bentuk imperatif jamak dari נדר menyerukan para pendengar untuk mengucapkan nazar. Bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: וְשַׁלְּמוּ
  choice: dan penuhilah nazar itu
  rationale: Dalam konteks nazar, שלם berarti menunaikan atau memenuhi kewajiban yang telah diikrarkan. Objek yang tersirat dinyatakan sebagai 'nazar itu' agar jelas dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai 'Yahweh' untuk mempertahankan nama perjanjian yang hadir langsung dalam teks Ibrani.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Akhiran orang kedua jamak dinyatakan dengan 'kalian', sehingga sapaan kepada kelompok tidak hilang.
- source_word: כָּל סְבִיבָיו
  choice: semua orang di sekeliling-Nya
  rationale: Kata kerja jamak menunjukkan orang-orang atau bangsa-bangsa di sekitar-Nya, bukan sekadar tempat. Penambahan 'orang' memperjelas rujukannya.
- source_word: יוֹבִילוּ
  choice: membawa
  rationale: Bentuk Hifil dari יבל di sini berarti membawa atau mempersembahkan sesuatu kepada seorang penguasa; 'membawa' paling alami dalam konteks ini.
- source_word: שַׁי
  choice: upeti
  rationale: Kata ini menunjuk pada pemberian kepada pihak yang dihormati atau berkuasa. 'Upeti' mempertahankan nuansa penghormatan dan kemungkinan nuansa kerajaan atau politik.
- source_word: לַמּוֹרָא
  choice: kepada Yang Patut Ditakuti
  rationale: מורא berkaitan dengan takut, kegentaran, dan kedahsyatan. Sebagai sebutan bagi Allah, frasa ini mempertahankan gagasan bahwa Dia adalah objek rasa takut dan gentar yang semestinya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi perjanjian tanpa menggantinya dengan gelar.
- issue: Penerjemahan לַמּוֹרָא sebagai sebutan ilahi
  choice: Yang Patut Ditakuti
  alternative: Yang Dahsyat; Dia yang harus ditakuti
  rationale: Pilihan ini menjaga tekanan mazmur pada keagungan Allah yang menimbulkan takut dan gentar, tanpa memperlemahnya menjadi sekadar rasa kagum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk 'kalian' mempertahankan orang kedua jamak dalam teks sumber. Kapitalisasi '-Nya' dan 'Yang Patut Ditakuti' menandai rujukan kepada Allah tanpa menambahkan penafsiran denominasi.
