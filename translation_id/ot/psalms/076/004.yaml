base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/004.yaml
  text: You are radiant[a], more majestic than the mountains of prey.
translation:
  language: id
  text: Engkau bercahaya, lebih agung daripada gunung-gunung mangsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “mangsa” juga dapat berarti “jarahan” atau “rampasan.” Selain itu, kata depan yang diterjemahkan “daripada” dapat dipahami “dari”; karena itu frasa ini juga mungkin dipahami sebagai “Engkau bercahaya, agung dari gunung-gunung mangsa.”
    reason: Memisahkan alternatif leksikal bagi טָרֶף dari kemungkinan alternatif sintaksis bagi מִן, sehingga ambiguitas teks Ibrani dipertahankan tanpa menggabungkan dua pilihan interpretatif.
lexical_decisions:
- source_word: נָאוֹר
  choice: bercahaya
  rationale: Kata ini menggambarkan terang atau kemegahan yang bersinar. “Bercahaya” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa terang itu diterima dari sumber lain.
- source_word: אַתָּה
  choice: Engkau
  rationale: Pronomina orang kedua tunggal dipertahankan. “Engkau” sesuai dengan ragam puisi yang khidmat ketika menyapa Allah.
- source_word: אַדִּיר
  choice: lebih agung
  rationale: Kata ini dapat menyatakan keagungan, kemuliaan, atau kekuatan. Karena diikuti מִן yang paling wajar dipahami sebagai penanda perbandingan, bentuk komparatif “lebih agung” dipakai.
- source_word: מֵהַרְרֵי
  choice: daripada gunung-gunung
  rationale: Prefiks מִן dapat berarti “dari” atau menandai perbandingan. Bersama אַדִּיר, arti komparatif “daripada” paling sesuai, sementara bentuk jamak dan hubungan konstruksi tetap dipertahankan.
- source_word: טָרֶף
  choice: mangsa
  rationale: Makna dasarnya ialah mangsa yang diterkam, tetapi kata ini juga dapat diperluas menjadi jarahan atau rampasan. “Mangsa” mempertahankan citra puitis yang hidup tanpa menetapkan rujukan historis tertentu.
theological_decisions:
- issue: Makna frasa komparatif מֵהַרְרֵי טָרֶף
  choice: Allah lebih agung daripada “gunung-gunung mangsa.”
  alternative: Frasa itu dapat dipahami sebagai “Engkau bersinar dari gunung-gunung jarahan,” atau טָרֶף dapat diterjemahkan “jarahan/rampasan.”
  rationale: Susunan dengan אַדִּיר paling kuat mendukung perbandingan, tetapi bahasa Ibraninya memungkinkan nuansa asal atau pemisahan. Teks utama mempertahankan citra puitis yang tidak dijelaskan lebih lanjut, sedangkan catatan kaki menyajikan alternatif leksikal dan sintaksis tanpa mengaitkannya dengan tafsiran historis atau doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis dan khidmat. Ungkapan “gunung-gunung mangsa” sengaja dipertahankan sebagai citra puisi yang padat dan agak misterius, sebagaimana dalam bahasa Ibrani.
