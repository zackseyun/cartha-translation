  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֑ת מִזְמ֖וֹר לְ/אָסָ֣ף שִֽׁיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/000.yaml
  text: For the choirmaster[a]; with stringed instruments. A psalm of Asaph[b], a song.
translation:
  language: id
  text: Untuk pemimpin musik; dengan alat-alat musik petik. Mazmur Asaf,[a] sebuah nyanyian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “Mazmur Asaf” dapat berarti mazmur yang digubah oleh Asaf, yang berkaitan dengan kelompok Asaf, atau yang diperuntukkan bagi Asaf.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. “Pemimpin musik” alami dalam bahasa Indonesia dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: בִּנְגִינֹת
  choice: dengan alat-alat musik petik
  rationale: Istilah ini mengacu pada musik atau instrumen berdawai. “Alat-alat musik petik” menyampaikan jenis instrumennya secara jelas tanpa menentukan instrumen tertentu.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Ini adalah sebutan baku bagi jenis gubahan tersebut dan tetap dibedakan dari istilah שִׁיר yang menyusul.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Dalam frasa “Mazmur Asaf,” bentuk ringkas ini mempertahankan keluwesan preposisi Ibrani לְ, yang dapat menyatakan karya, kepunyaan, hubungan, atau peruntukan.
- source_word: שִׁיר
  choice: sebuah nyanyian
  rationale: Sebutan jenis kedua ini dipertahankan agar penggolongan ganda dalam bahasa Ibrani—mazmur dan nyanyian—tetap tampak.
theological_decisions:
- issue: Hubungan Asaf dengan mazmur
  choice: Mazmur Asaf
  alternative: Mazmur karya Asaf / Mazmur untuk Asaf
  rationale: Bahasa sumber tidak memastikan apakah Asaf adalah pengarang, tokoh yang menerima persembahan, atau nama yang menandai hubungan dengan kelompok keturunannya. Terjemahan utama tidak mempersempit kemungkinan-kemungkinan itu.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Tanda titik koma memisahkan dua petunjuk pelaksanaan yang sejajar tanpa memberi kesan bahwa frasa kedua menjelaskan frasa pertama.
