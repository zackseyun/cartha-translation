base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/003.yaml
  text: There he shattered the arrows of the bow[a], shield and sword and battle[c][b]. Selah
translation:
  language: id
  text: Di sanalah Ia menghancurkan panah-panah berkilat dari busur[a], perisai, pedang, dan peperangan[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “panah-panah berapi dari busur.” Ungkapan Ibrani secara harfiah melibatkan gambaran nyala atau kilatan busur untuk menyebut anak panah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “pertempuran” atau “perang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמָּה
  choice: Di sanalah
  rationale: Keterangan tempat ini menunjuk kembali kepada tempat yang disebut dalam konteks sebelumnya tanpa mengulang nama tempatnya.
- source_word: שִׁבַּר
  choice: Ia mematahkan
  rationale: Bentuk piel menyatakan tindakan menghancurkan atau mematahkan dengan kuat; 'mematahkan' alami untuk senjata dan tetap hidup secara puitis.
- source_word: רִשְׁפֵי קָשֶׁת
  choice: panah-panah berkilat dari busur
  rationale: רשף dapat menggambarkan nyala atau kilatan dan, dalam kaitannya dengan busur, menunjuk kepada anak panah. Terjemahan ini mempertahankan acuan senjata sekaligus citra puitisnya.
- source_word: מָגֵן
  choice: perisai
  rationale: Padanan Indonesia yang lazim bagi alat pertahanan ini.
- source_word: וְחֶרֶב
  choice: pedang
  rationale: Padanan langsung dan alami dalam rangkaian perlengkapan perang.
- source_word: וּמִלְחָמָה
  choice: dan peperangan
  rationale: מִלְחָמָה dapat berarti perang, peperangan, atau pertempuran; 'peperangan' cocok sebagai puncak daftar yang bergerak dari senjata kepada keseluruhan konflik.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal yang makna tepatnya tidak pasti dipertahankan sebagai transliterasi yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat dari kata kerja orang ketiga maskulin tunggal
  choice: Ia, yakni Allah menurut konteks
  alternative: Subjek maskulin yang tidak disebutkan
  rationale: Ayat ini tidak menyebut subjek secara eksplisit, tetapi konteks mazmur menunjukkan Allah sebagai pelaku. Kapitalisasi 'Ia' membantu pembaca mengikuti rujukan kontekstual tanpa menambahkan nama ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis yang ringkas. Pengulangan konjungsi Ibrani disesuaikan menjadi daftar alami dalam bahasa Indonesia; ambiguitas citra רִשְׁפֵי dan cakupan מִלְחָמָה dijaga melalui catatan kaki.
