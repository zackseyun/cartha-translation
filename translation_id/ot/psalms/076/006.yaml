  yaml_path: translation/ot/psalms/076/006.yaml
  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
translation:
  language: id
  text: Oleh hardikan-Mu[a], ya Allah Yakub, kereta perang dan kuda sama-sama terlelap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Karena hardikan-Mu” atau “Pada hardikan-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani menyebut “kereta perang dan kuda”, ungkapan puitis bagi kekuatan militer; sebagian orang memahami gambaran ini juga mencakup para pengendaranya.
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: Oleh hardikan-Mu
  rationale: מִן dapat menyatakan sumber atau sebab. “Oleh” mempertahankan hubungan kausal tanpa menentukan secara berlebihan apakah nuansanya “karena” atau “pada saat”; “hardikan” menyampaikan teguran ilahi yang kuat.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: ya Allah Yakub
  rationale: Frasa konstruksi ini adalah gelar ilahi dan berfungsi sebagai sapaan langsung; “ya” menandai vokatif secara alami dalam bahasa Indonesia.
- source_word: נִרְדָּם
  choice: terlelap dalam tidur nyenyak
  rationale: Bentuk Nifal dari רדם menunjuk pada tidur lelap atau keadaan tak berdaya seperti pingsan, bukan tidur biasa. Ungkapan ini menjaga citra puitis tanpa menetapkannya secara eksplisit sebagai kematian.
- source_word: וְרֶכֶב וָסוּס
  choice: kereta perang dan kuda sama-sama
  rationale: Teks menyebut kereta dan kuda, dua unsur kekuatan militer. “Sama-sama” mengungkapkan bahwa keduanya terkena dampak, sedangkan “perang” menjernihkan makna רֶכֶב dalam konteks ini tanpa menggantinya dengan penunggang.
theological_decisions:
- issue: Hakikat kekalahan yang digambarkan
  choice: Hardikan Allah membuat seluruh kekuatan militer musuh tidak berdaya, dengan citra tidur nyenyak.
  alternative: Citra itu dapat menyiratkan kematian atau kehancuran total, tetapi teks tidak menyatakannya secara langsung.
  rationale: נִרְדָּם mempertahankan gambaran tidur lelap atau ketidakberdayaan. Terjemahan tidak mereduksinya menjadi tidur harfiah biasa dan juga tidak menggantinya dengan kata “mati”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pronomina ilahi mengikuti gaya hormat yang lazim dalam terjemahan Alkitab Indonesia. Susunan kalimat mempertahankan sapaan kepada Allah dan pasangan “kereta perang dan kuda” dari teks Ibrani.
