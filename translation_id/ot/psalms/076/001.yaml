  variant: modern standard Indonesian
source:
  edition: WLC
  text: נוֹדָ֣ע בִּֽ/יהוּדָ֣ה אֱלֹהִ֑ים בְּ֝/יִשְׂרָאֵ֗ל גָּד֥וֹל שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/001.yaml
  text: God is known in Judah[b][a]; his name is great in Israel.
translation:
  language: id
  text: Allah dikenal di Yehuda[a]; nama-Nya besar di Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah telah menyatakan diri-Nya di Yehuda.” Bentuk Ibraninya dapat berarti keadaan “dikenal” atau, dalam konteks ini, tindakan menyatakan diri.
    reason: lexical_alternative
  - marker: b
    text: “Nama-Nya” dapat menunjuk kepada identitas-Nya yang dinyatakan, reputasi-Nya, atau kemasyhuran-Nya, bukan hanya nama yang diucapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: dikenal
  rationale: Bentuk nifal dari ידע paling langsung menyatakan keadaan pasif, “dikenal.” Pilihan ini mempertahankan kepadatan puisi Ibrani, sementara kemungkinan nuansa peristiwa dijelaskan dalam catatan kaki.
- source_word: בִּיהוּדָה
  choice: di Yehuda
  rationale: Preposisi ב paling wajar diterjemahkan “di” di sini. Ungkapan ini tetap memungkinkan Yehuda dipahami sebagai wilayah maupun umat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, maknanya tunggal dalam konteks ini dan menunjuk kepada Allah Israel; “Allah” merupakan padanan baku dalam bahasa Indonesia.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Terjemahan “di” mempertahankan kesejajaran dengan “di Yehuda” serta cakupan geografis dan komunal ungkapan Ibraninya.
- source_word: גָּדוֹל
  choice: besar
  rationale: Kata sifat ini secara langsung berarti “besar”; padanan tersebut tidak mengubahnya menjadi gagasan verbal seperti “ditinggikan.”
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Terjemahan harfiah ini mempertahankan bobot teologis “nama” sebagai identitas Allah yang dinyatakan dan kemasyhuran-Nya, tanpa mereduksinya menjadi sekadar ketenaran.
theological_decisions:
- issue: Makna “nama” ilahi
  choice: Mempertahankan ungkapan konkret “nama-Nya besar.”
  alternative: “kemasyhuran-Nya besar” atau “Ia sangat dihormati”
  rationale: Ungkapan harfiah mempertahankan cakupan nama sebagai identitas yang dinyatakan, reputasi, dan kemasyhuran Allah, serta tidak menghapus ketegangan puitis teks.
- issue: Nuansa נוֹדָע
  choice: “Allah dikenal” dalam teks utama.
  alternative: “Allah telah menyatakan diri-Nya”
  rationale: Bentuk nifal dapat dibaca secara statif/pasif, sedangkan konteks juga memungkinkan nuansa peristiwa. Terjemahan utama mengikuti bentuk yang paling langsung dan catatan kaki mempertahankan alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas, puitis, dan bermartabat. Kesejajaran “di Yehuda” dan “di Israel” dipertahankan. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
