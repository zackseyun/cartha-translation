source:
  edition: WLC
  text: וַ/יְהִ֣י בְ/שָׁלֵ֣ם סֻכּ֑/וֹ וּ/מְע֖וֹנָת֣/וֹ בְ/צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/002.yaml
  text: His shelter was in Salem[b][a], and his dwelling place in Zion.
translation:
  language: id
  text: Kemah-Nya ada di Salem[a][b], dan kediaman-Nya di Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Salem secara tradisional diidentikkan dengan Yerusalem; ayat ini menyejajarkan Salem dengan Sion sebagai tempat kediaman Allah.
    reason: cross_reference
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kemah” juga dapat berarti “pondok”, “tempat berteduh”, atau “paviliun”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ada
  rationale: Dalam konteks ini, bentuk verba היה menyatakan keberadaan dan lokasi tempat tinggal Allah; “ada” merupakan ungkapan Indonesia yang alami dan setia.
- source_word: בְשָׁלֵם
  choice: di Salem
  rationale: Nama tempat שָׁלֵם dipertahankan sebagai Salem, bukan ditafsirkan langsung sebagai Yerusalem, agar bentuk dan kesejajaran puitis teks Ibrani tetap terjaga.
- source_word: סֻכּוֹ
  choice: Kemah-Nya
  rationale: סֻכָּה menunjuk pada kemah, pondok, atau tempat berteduh. “Kemah” mempertahankan citra konkret bangunan sementara tanpa menjadikannya istilah teknis “Kemah Suci”.
- source_word: וּמְעוֹנָתוֹ
  choice: dan kediaman-Nya
  rationale: מְעוֹנָה berarti tempat tinggal atau kediaman; “kediaman” alami, ringkas, dan sesuai dengan gaya puitis.
- source_word: בְצִיּוֹן
  choice: di Sion
  rationale: Nama צִיּוֹן ditransliterasikan menurut bentuk baku bahasa Indonesia sebagai “Sion”.
theological_decisions:
- issue: Hubungan antara Salem dan Sion
  choice: Kedua nama tempat dipertahankan secara berbeda dalam teks utama.
  alternative: Menerjemahkan “Salem” sebagai “Yerusalem” dan dengan demikian membuat identifikasinya eksplisit.
  rationale: Teks Ibrani menyejajarkan Salem dan Sion secara puitis sebagai lokasi kediaman Allah. Mempertahankan keduanya menghindari penyelesaian interpretatif yang tidak dinyatakan langsung oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia. Urutan penanda catatan kaki dibuat [a][b] agar sesuai dengan urutan catatan.
