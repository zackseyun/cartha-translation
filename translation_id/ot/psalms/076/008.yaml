lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Dari langit
  rationale: Preposisi מִן menyatakan asal atau sumber. Dalam bahasa Indonesia, “dari langit” alami dan mempertahankan kontras vertikal dengan bumi.
- source_word: הִשְׁמַעְתָּ
  choice: Engkau memperdengarkan
  rationale: Bentuk Hifil dari שׁמע memiliki daya kausatif, yaitu membuat sesuatu terdengar. “Memperdengarkan” mempertahankan daya itu tanpa menafsirkannya lebih jauh sebagai sekadar ‘memberitakan’.
- source_word: דִּין
  choice: keputusan penghakiman
  rationale: דִּין di sini menunjuk pada keputusan atau tindakan yudisial Allah. “Keputusan penghakiman” mengungkapkan konteks hukum secara jelas dan tetap berfokus pada tindakan tertentu.
- source_word: אֶרֶץ
  choice: bumi
  rationale: Walaupun אֶרֶץ juga dapat berarti ‘negeri’, kontras puitis dengan langit mendukung pengertian kosmis ‘bumi’.
- source_word: יָרְאָה
  choice: takut
  rationale: Kata ירא dapat mencakup rasa takut maupun gentar penuh hormat. Dalam konteks penghakiman, “takut” mempertahankan ungkapan Ibrani yang ringkas tanpa mempersempitnya menjadi kekaguman saja.
- source_word: וְשָׁקָטָה
  choice: dan menjadi tenang
  rationale: שׁקט menyatakan keadaan tenang, diam, atau berhentinya kegaduhan. “Menjadi tenang” wajar dalam bahasa Indonesia dan dapat menyiratkan ketenangan yang timbul sebagai tanggapan atas penghakiman.
theological_decisions:
- issue: Cakupan אֶרֶץ dalam kontras puitis dengan langit
  choice: bumi dalam arti dunia secara umum
  alternative: negeri, mungkin wilayah tertentu atau ranah daratan
  rationale: Pasangan ‘dari langit’ dan ‘bumi’ membentuk bingkai kosmis yang lazim dalam puisi Ibrani. Pilihan ini tidak memasukkan pembatasan nasional yang tidak dituntut oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan ringkas. Kapitalisasi “Engkau” menandai sapaan kepada Allah. Susunan mempertahankan gerak puitis dari sumber surgawi menuju respons bumi.
