  text: when God rises for judgment[a], to save all the humble of the earth[b]. Selah
translation:
  language: id
  text: 'ketika Allah bangkit untuk menghakimi,

    untuk menyelamatkan semua orang yang rendah hati di bumi.[a]

    Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua orang yang lemah lembut di bumi” atau “semua orang yang tertindas di bumi.” “Bumi” juga dapat diterjemahkan “negeri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקוּם
  choice: ketika Allah bangkit
  rationale: Preposisi ב dengan infinitif konstruk קום menyatakan waktu. Bentuk kini memberi ungkapan puitis yang wajar bagi tindakan ilahi, sedangkan subjek 'Allah' mengikuti dalam teks Ibrani.
- source_word: לַמִּשְׁפָּט
  choice: untuk menghakimi
  rationale: מִשְׁפָּט menunjuk pada tindakan pengadilan atau pelaksanaan keadilan. Bentuk verbal ini alami dalam bahasa Indonesia dan mempertahankan gambaran Allah yang bangkit untuk bertindak sebagai hakim.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini merujuk secara tunggal kepada Allah Israel dan secara baku diterjemahkan 'Allah'.
- source_word: לְהוֹשִׁיעַ
  choice: untuk menyelamatkan
  rationale: Infinitif Hifil dari ישׁע berarti menyelamatkan atau melepaskan; 'menyelamatkan' langsung, luas, dan mudah dipahami.
- source_word: כָּל
  choice: semua
  rationale: כָּל dengan frasa berikutnya menyatakan keseluruhan kelompok secara kolektif.
- source_word: עַנְוֵי
  choice: orang yang rendah hati
  rationale: עָנָו dapat menggambarkan orang yang rendah hati, lemah lembut, tertindas, atau sengsara. Pilihan ini mempertahankan dimensi sikap batin tanpa sepenuhnya meniadakan latar kerendahan sosial.
- source_word: אֶרֶץ
  choice: bumi
  rationale: אֶרֶץ dapat berarti bumi atau negeri. Dalam ungkapan puitis yang mencakup semua orang dalam kelompok tersebut, 'bumi' memberi cakupan luas, sementara 'negeri' tetap dicatat sebagai kemungkinan.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis atau musikal ini tidak pasti; transliterasi mempertahankan unsur teks sumber tanpa memberi tafsiran yang terlalu pasti.
theological_decisions:
- issue: Nuansa semantis עַנְוֵי
  choice: orang yang rendah hati
  alternative: orang yang lemah lembut; orang yang tertindas atau sengsara
  rationale: Istilah ini dapat menunjuk sekaligus pada kerendahan hati dan keadaan sosial yang rendah atau tertindas. Teks utama memakai ungkapan yang alami dan luas, sedangkan catatan kaki mempertahankan alternatif yang sungguh mungkin.
- issue: Cakupan אֶרֶץ
  choice: bumi
  alternative: negeri
  rationale: Konteks puitis memungkinkan cakupan universal, tetapi kata Ibraninya juga dapat menunjuk pada suatu negeri. Ambiguitas itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Paralelisme dua baris dipertahankan. 'Sela' ditransliterasikan karena fungsinya tidak pasti. Penanda catatan kaki ditempatkan sesudah frasa yang memuat kedua ambiguitas leksikal.
