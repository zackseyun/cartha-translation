  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/005.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: id
  text: Orang-orang yang berhati perkasa telah dijarah; mereka tidur dalam tidur mereka,[a] dan tidak seorang pun di antara para pejuang gagah berani dapat menemukan tangan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini dapat menyiratkan tidur kematian, tetapi secara harfiah berbunyi “mereka tidur dalam tidur mereka”.
    reason: ambiguity
  - marker: b
    text: Artinya, para pejuang itu tidak dapat menggunakan tangan mereka; mereka menjadi tidak berdaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: telah dijarah
  rationale: Bentuk dari akar שלל di sini menyatakan bahwa orang-orang perkasa itu sendiri menjadi sasaran penjarahan. Pilihan ini mempertahankan gambaran militer dan bentuk pasif sumber.
- source_word: אַבִּירֵי לֵב
  choice: orang-orang yang gagah hati
  rationale: Secara harfiah berarti 'orang-orang yang perkasa hatinya'. 'Gagah hati' menyampaikan keberanian dan keteguhan batin dalam bahasa Indonesia yang wajar tanpa menghilangkan unsur 'hati'.
- source_word: נָמוּ שְׁנָתָם
  choice: mereka tertidur dalam tidur mereka
  rationale: Ungkapan serumpun dalam bahasa Ibrani dipertahankan untuk menjaga daya puitis serta ambiguitas antara tidur biasa, keadaan tak berdaya, dan tidur kematian.
- source_word: אַנְשֵׁי חַיִל
  choice: para kesatria
  rationale: Dalam konteks pertempuran, ungkapan ini menunjuk kepada orang-orang yang kuat dan gagah berani. 'Para kesatria' ringkas, alami, dan mempertahankan nuansa keprajuritan.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: tidak ... dapat menemukan tangannya
  rationale: Terjemahan ini mempertahankan citra harfiah idiom Ibrani 'tidak menemukan tangan mereka', sementara makna kemungkinan—tidak mampu menggunakan tangan atau bertindak—dijelaskan dalam catatan.
theological_decisions:
- issue: Apakah 'tidur mereka' secara eksplisit berarti kematian
  choice: Mempertahankan ungkapan 'tertidur dalam tidur mereka' tanpa menambahkan 'kematian'
  alternative: mereka tertidur dalam tidur kematian
  rationale: Konteks sangat mungkin menggambarkan kekalahan yang berujung pada kematian, tetapi kata 'kematian' tidak dinyatakan dalam teks Ibrani. Terjemahan utama menjaga ambiguitas puitis tersebut.
translation_notes:
  register: 'Bahasa Indonesia modern yang puitis dan bermartabat. Susunan ''tertidur dalam tidur mereka'' serta ''menemukan tangannya'' sengaja mempertahankan citra khas bahasa Ibrani; catatan kaki menjelaskan makna yang tersirat. Bentuk tunggal ''tangannya'' mengikuti pemakaian distributif: masing-masing kesatria tidak dapat menemukan atau memakai tangannya.'
