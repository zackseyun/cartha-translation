  yaml_path: translation/ot/psalms/076/007.yaml
  text: You—you are to be feared[a]; and who can stand before you from the time of your anger[b]?
translation:
  language: id
  text: Engkau—Engkau patut ditakuti[a]; siapakah yang dapat bertahan di hadapan-Mu sejak murka-Mu bangkit[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggentarkan” atau “dahsyat”; secara harfiah, “patut ditakuti.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ketika Engkau murka” atau “sejak awal murka-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה ... אַתָּה
  choice: Engkau—Engkau
  rationale: Pengulangan kata ganti dipertahankan untuk menyampaikan penekanan dan daya puitis teks Ibrani tanpa menambahkan gagasan eksklusif seperti “hanya Engkau”.
- source_word: נוֹרָא
  choice: patut ditakuti
  rationale: Bentuk ini mempertahankan daya predikatif serta cakupan rasa gentar dan hormat. “Menakutkan” cenderung hanya menggambarkan kesan, sedangkan “dahsyat” dapat mengaburkan unsur takut.
- source_word: וּמִי
  choice: Siapakah
  rationale: Pertanyaan retoris ini secara alami dibuka dengan “Siapakah” dalam bahasa Indonesia. Waw tidak harus diterjemahkan tersendiri karena hubungan dengan kalimat sebelumnya tetap jelas.
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: dapat bertahan di hadapan-Mu
  rationale: Dalam pertanyaan retoris ini, bentuk imperfek menyatakan kemampuan atau kemungkinan. “Bertahan” menyampaikan bahwa tidak seorang pun sanggup menghadapi kehadiran dan murka Allah.
- source_word: מֵאָז
  choice: sejak
  rationale: Kata ini menandai titik waktu dengan arti dasar “sejak saat itu”. Terjemahan “sejak” mempertahankan nuansa temporalnya, sementara kata kerja tersirat dijelaskan secara alami dalam bahasa Indonesia.
- source_word: אַפֶּךָ
  choice: murka-Mu
  rationale: Walaupun arti harfiahnya berkaitan dengan “hidung”, kata ini lazim menjadi metonimia bagi amarah. “Murka” sesuai dengan konteks ilahi dan bobot puitis ayat ini.
theological_decisions:
- issue: Sifat rasa takut kepada Allah
  choice: patut ditakuti
  alternative: menakutkan; dahsyat
  rationale: Pilihan ini menjaga ketegangan antara kegentaran di hadapan Allah dan rasa hormat kepada-Nya, tanpa membatasi maknanya pada teror belaka atau melemahkannya menjadi kekaguman umum.
- issue: Waktu murka Allah
  choice: sejak murka-Mu bangkit
  alternative: ketika Engkau murka; sejak murka-Mu
  rationale: “Sejak” mempertahankan nilai temporal מֵאָז, sedangkan “bangkit” membuat ungkapan eliptis Ibrani dapat dipahami secara alami. Catatan kaki mempertahankan kemungkinan pembacaan yang lebih umum sebagai “ketika”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pengulangan “Engkau—Engkau” sengaja dipertahankan sebagai penekanan Ibrani. Tanda baca memisahkan pernyataan dan pertanyaan agar alurnya alami, dan setiap penanda catatan kaki muncul dalam teks utama.
