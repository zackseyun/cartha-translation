source:
  edition: WLC
  text: כִּֽי חֲמַ֣ת אָדָ֣ם תּוֹדֶ֑/ךָּ שְׁאֵרִ֖ית חֵמֹ֣ת תַּחְגֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/010.yaml
  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
translation:
  language: id
  text: Sebab murka manusia[a] akan memuji-Mu; sisa kemurkaan akan Kauikatkan pada pinggang-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “manusia” di sini berarti umat manusia secara umum.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Engkau akan menahan sisa kemurkaan.” Klausa Ibrani ini sulit; teks utama mengikuti bunyi teks Masoret secara lebih dekat dan mempertahankan metaforanya.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi konteks sebelumnya; “sebab” mempertahankan daya kausalnya secara alami.
- source_word: חֲמַת אָדָם
  choice: murka manusia
  rationale: חֵמָה menunjuk pada murka atau amarah yang berkobar, sedangkan אָדָם di sini berarti manusia secara umum. “Murka manusia” ringkas, puitis, dan tidak membatasi maknanya pada laki-laki.
- source_word: תּוֹדֶךָּ
  choice: akan memuji-Mu
  rationale: Bentuk Hifil dari ידה lazim berarti mengucap syukur atau memuji. Dalam konteks ini, bahkan murka manusia pada akhirnya menghasilkan pujian bagi Allah.
- source_word: שְׁאֵרִית חֵמֹת
  choice: sisa kemurkaan
  rationale: שְׁאֵרִית berarti apa yang tersisa. Bentuk jamak חֵמֹת dipahami secara kolektif atau intensif dan secara alami diterjemahkan dengan nomina massa tunggal dalam bahasa Indonesia.
- source_word: תַּחְגֹּר
  choice: akan Kauikatkan pada pinggang-Mu
  rationale: חגר menggambarkan tindakan mengikat atau mengenakan sesuatu pada pinggang. Pilihan ini mempertahankan metafora teks Masoret tanpa menentukan apakah yang dimaksud adalah mengenakan, mempersenjatai diri, atau mengekang.
theological_decisions:
- issue: Penafsiran klausa שְׁאֵרִית חֵמֹת תַּחְגֹּר
  choice: Allah menjadi subjek dan secara metaforis mengikatkan sisa kemurkaan pada pinggang-Nya.
  alternative: Engkau akan menahan sisa kemurkaan.
  rationale: Bentuk verba orang kedua tunggal maskulin paling wajar menjadikan Allah sebagai subjek. Karena klausa Ibraninya sulit dan metaforanya tidak sepenuhnya jelas, teks utama mengikuti penunjukan Masoret dan mempertahankan gambaran tersebut, sedangkan penafsiran “menahan” dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang khidmat. “Murka” dan “kemurkaan” mempertahankan bobot ungkapan Ibrani, sementara susunan klausa dibuat cukup alami bagi pembaca umum.
