id: PSA.76.12
reference: Psalms 76:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִ֭בְצֹר ר֣וּחַ נְגִידִ֑ים נ֝וֹרָ֗א לְ/מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/012.yaml
  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: id
  text: Ia mematahkan semangat para penguasa[a]; Ia ditakuti oleh raja-raja bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Ia menahan roh para penguasa.” Kata yang diterjemahkan “semangat” juga dapat berarti “roh,” “napas,” “keberanian,” atau “perangai.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia dahsyat bagi raja-raja bumi.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: mematahkan
  rationale: Dalam konstruksi dengan רוּחַ para penguasa, kata kerja ini menggambarkan tindakan tegas Allah yang merendahkan atau melumpuhkan semangat mereka. “Mematahkan” alami dalam bahasa Indonesia dan mempertahankan daya ungkap puitisnya tanpa memastikan bahwa mereka dibunuh.
- source_word: רוּחַ
  choice: semangat
  rationale: רוּחַ dapat berarti roh, napas, semangat, keberanian, atau perangai. Dalam ungkapan ini, “semangat” paling alami dan cukup luas untuk menunjuk daya batin, keberanian, atau keangkuhan para penguasa.
- source_word: נְגִידִים
  choice: para penguasa
  rationale: נָגִיד menunjuk pemimpin atau orang yang berkuasa. “Para penguasa” jelas bagi pembaca modern dan membentuk kesejajaran yang wajar dengan “raja-raja bumi” pada baris berikutnya.
- source_word: נוֹרָא
  choice: ditakuti
  rationale: Bentuk ini menyatakan bahwa Allah menimbulkan rasa takut atau gentar. “Ditakuti” menyampaikan hubungan itu secara alami, sementara kemungkinan nuansa “dahsyat” dicatat dalam catatan kaki.
- source_word: לְמַלְכֵי אָרֶץ
  choice: oleh raja-raja bumi
  rationale: Preposisi לְ di sini menyatakan hubungan dengan pihak yang mengalami kedahsyatan Allah. Dalam bahasa Indonesia, “ditakuti oleh raja-raja bumi” mengungkapkan hubungan tersebut dengan jelas dan alami.
theological_decisions:
- issue: Sifat tindakan Allah terhadap para penguasa
  choice: Allah dengan tegas mematahkan semangat atau daya batin para penguasa dunia.
  alternative: Allah mengambil napas atau nyawa mereka; atau Ia menahan keberanian, amarah, maupun perangai mereka.
  rationale: Gabungan יִבְצֹר dan רוּחַ memungkinkan beberapa nuansa. Konteks mazmur menekankan supremasi Allah atas para penguasa, sehingga teks utama menyatakan perendahan tegas tanpa membatasi maknanya pada kematian atau satu emosi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. “Mematahkan semangat” dipilih sebagai ungkapan alami yang tetap kuat, sedangkan keluasan makna kata Ibrani dijaga melalui catatan kaki.
