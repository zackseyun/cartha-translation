  text: שַׁ֭אֲלוּ שְׁל֣וֹם יְרוּשָׁלִָ֑ם יִ֝שְׁלָ֗יוּ אֹהֲבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/006.yaml
  text: 'Pray for the peace of Jerusalem: may those who love you prosper[a][b].'
translation:
  language: id
  text: 'Berdoalah untuk kesejahteraan Yerusalem: semoga orang-orang yang mencintaimu hidup tenteram.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mintalah kesejahteraan Yerusalem,” atau “Berdoalah untuk kedamaian Yerusalem.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “semoga orang-orang yang mencintaimu makmur”; mungkin juga sebagai pernyataan: “orang-orang yang mencintaimu akan hidup tenteram.”'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁאֲלוּ
  choice: Berdoalah untuk
  rationale: Imperatif שׁאל dapat berarti meminta atau memohon. Dalam konteks mazmur ziarah ini, ungkapan ini secara wajar menyampaikan seruan untuk memohon kepada Allah demi Yerusalem.
- source_word: שְׁלוֹם
  choice: kesejahteraan
  rationale: שָׁלוֹם mencakup damai, keamanan, keutuhan, dan keadaan baik. 'Kesejahteraan' mempertahankan keluasan makna itu dalam konteks permohonan bagi kota, sedangkan 'kedamaian' dicatat sebagai alternatif.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Nama tempat ini mengikuti bentuk baku dalam bahasa Indonesia.
- source_word: יִשְׁלָיוּ
  choice: semoga ... hidup tenteram
  rationale: Bentuk dari שלה dapat menunjuk pada keadaan tenteram, aman, atau makmur. 'Hidup tenteram' sesuai dengan tema שָׁלוֹם tanpa membatasi maknanya pada kemakmuran materi; 'semoga' menyampaikan daya harapan atau doa dari bentuk imperfek dalam konteks ini.
- source_word: אֹהֲבָיִךְ
  choice: orang-orang yang mencintaimu
  rationale: Partisip dengan sufiks feminin tunggal orang kedua menunjuk kepada mereka yang mencintai Yerusalem dan mempertahankan sapaan langsung kepada kota itu.
theological_decisions:
- issue: Daya klausa kedua
  choice: 'Dipahami sebagai harapan atau doa: ''semoga orang-orang yang mencintaimu hidup tenteram'''
  alternative: 'Dapat pula dipahami sebagai pernyataan: ''orang-orang yang mencintaimu akan hidup tenteram/makmur'''
  rationale: Imperfek Ibrani dalam puisi dapat berdaya jusif atau indikatif. Sesudah imperatif pada klausa pertama, nuansa doa sangat alami, tetapi kemungkinan pernyataan tidak dihapus dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Sapaan langsung feminin kepada Yerusalem tidak ditandai secara gramatikal dalam bahasa Indonesia, tetapi dipertahankan melalui bentuk '-mu'. Catatan kaki menjaga keluasan שָׁלוֹם dan ambiguitas modal יִשְׁלָיוּ.
