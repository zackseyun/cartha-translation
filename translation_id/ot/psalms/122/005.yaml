  text: For there thrones sit for judgment[c][b][a], thrones for the house of David.
translation:
  language: id
  text: Sebab di sanalah takhta-takhta ditempatkan untuk penghakiman[a], takhta-takhta bagi wangsa Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “takhta-takhta duduk untuk penghakiman.” Ungkapan ini juga dapat diterjemahkan, “takhta-takhta ditetapkan untuk penghakiman.” “Penghakiman” dapat juga berarti “keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas ayat ini dalam konteks, dengan ungkapan Indonesia yang wajar.
- source_word: שָׁמָּה
  choice: di sanalah
  rationale: Merujuk kembali kepada Yerusalem dan mempertahankan penekanan lokatif dari bentuk Ibrani.
- source_word: יָשְׁבוּ
  choice: berdiri
  rationale: Secara harfiah verba ini berarti 'duduk', tetapi dengan takhta sebagai subjek, maksudnya ialah takhta-takhta itu ditempatkan atau ditegakkan untuk menjalankan fungsi peradilan. 'Berdiri' mempertahankan citra konkret secara lebih alami dalam bahasa Indonesia.
- source_word: כִסְאוֹת
  choice: takhta-takhta
  rationale: Menunjuk pada kursi kewibawaan kerajaan dan peradilan, bukan kursi biasa; bentuk ulang menyatakan jamak.
- source_word: לְמִשְׁפָּט
  choice: untuk mengadili
  rationale: Menyatakan fungsi yudisial takhta-takhta tersebut. Bentuk verbal alami dalam bahasa Indonesia tanpa meniadakan cakupan makna 'penghakiman/keadilan'.
- source_word: כִסְאוֹת לְבֵית דָּוִיד
  choice: takhta-takhta bagi keluarga Daud
  rationale: Mempertahankan preposisi לְ dan kaitannya dengan dinasti Daud tanpa memaksakan hubungan kepemilikan yang lebih tegas daripada teks.
theological_decisions:
- issue: Sifat rujukan kepada keluarga Daud
  choice: Rujukan dipertahankan sebagai takhta-takhta kerajaan dan peradilan yang berkaitan dengan dinasti Daud di Yerusalem.
  alternative: Menjadikannya sekadar pengadilan sipil Yerusalem atau menonjolkan tafsiran mesianik secara langsung.
  rationale: Teks secara eksplisit menyebut takhta-takhta dan keluarga Daud. Terjemahan mempertahankan latar historis-dinastis serta fungsi yudisialnya tanpa memasukkan pengembangan teologis yang tidak dinyatakan langsung dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. 'Di sanalah' memberi penekanan yang sesuai dengan שָׁמָּה. Ungkapan 'berdiri takhta-takhta' dipilih agar citra takhta yang telah ditegakkan tetap konkret dan tidak terdengar sejanggal terjemahan harfiah 'takhta-takhta duduk'.
