  yaml_path: translation/ot/psalms/122/008.yaml
  text: For the sake of my brothers and my companions[a], I will now say[c][b], “Peace be within you.”
translation:
  language: id
  text: Demi saudara-saudaraku dan sahabat-sahabatku, aku hendak berkata, “Kiranya damai sejahtera ada di dalammu!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Partikel Ibrani נָא dapat memberi nuansa desakan, permohonan, atau kesegeraan. Karena itu, bagian ini juga dapat diterjemahkan, “aku hendak berkata sekarang, ‘Damai sejahtera di dalammu!’”
    reason: lexical_alternative
  - marker: b
    text: “Damai sejahtera” juga mencakup kesejahteraan, keutuhan, dan keadaan yang baik. Kata “-mu” menyapa Yerusalem secara langsung.
    reason: lexical_and_referential_clarification
lexical_decisions:
- source_word: לְמַעַן
  choice: Demi
  rationale: Menyatakan alasan atau motivasi tindakan pemazmur secara ringkas dan alami.
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Mempertahankan bentuk maskulin jamak dan akhiran orang pertama tunggal dalam teks Ibrani.
- source_word: וְרֵעָי
  choice: dan sahabat-sahabatku
  rationale: רֵעַ dapat berarti sahabat, rekan, atau sesama; 'sahabat-sahabatku' alami dalam paralel dengan 'saudara-saudaraku'.
- source_word: אֲדַבְּרָה
  choice: aku hendak berkata
  rationale: Bentuk kohortatif menyatakan kehendak atau tekad penutur; 'hendak berkata' mempertahankan nuansa itu dalam bahasa Indonesia.
- source_word: נָּא
  choice: sekarang
  rationale: Partikel ini dapat memberi nuansa kesegeraan maupun permohonan. Dalam konteks ini, 'sekarang' mengalir alami, sedangkan kemungkinan 'kiranya' dicatat dalam catatan kaki.
- source_word: שָׁלוֹם
  choice: Damai sejahtera
  rationale: Ungkapan Indonesia ini mencakup bukan hanya ketiadaan konflik, tetapi juga kesejahteraan dan keutuhan yang terkandung dalam שָׁלוֹם.
- source_word: בָּךְ
  choice: ada di dalammu
  rationale: Akhiran feminin tunggal merujuk langsung kepada Yerusalem; 'di dalammu' mempertahankan personifikasi dan makna spasialnya.
theological_decisions:
- issue: Istilah kekerabatan bergender
  choice: saudara-saudaraku
  alternative: saudara-saudariku; kaum kerabatku
  rationale: Teks sumber memakai bentuk maskulin jamak. Terjemahan mempertahankannya tanpa menutup kemungkinan bahwa komunitas yang dimaksud lebih luas.
- issue: Pihak yang disapa dalam berkat
  choice: 'Yerusalem disapa langsung sebagai kota berjenis feminin: “Damai sejahtera ada di dalammu.”'
  alternative: Damai sejahtera ada di dalamnya; Semoga ada damai sejahtera di dalammu
  rationale: Akhiran orang kedua feminin tunggal secara alami kembali kepada Yerusalem dan mempertahankan daya puitis sapaan langsung.
- issue: Nuansa kohortatif dan partikel נָא
  choice: aku hendak berkata sekarang
  alternative: biarlah aku berkata; aku hendak berkata, kiranya
  rationale: Pilihan utama menyatakan tekad sekaligus kesegeraan, tetapi tidak menghapus kemungkinan bahwa נָא memberi nuansa permohonan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Bentuk ulang dipakai untuk menandai jamak secara jelas; sapaan langsung kepada Yerusalem dipertahankan.
