  text: Jerusalem[a], built like a city joined together as one[b],
translation:
  language: id
  text: Yerusalem, yang dibangun seperti kota yang terpadu erat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti kota yang bagian-bagiannya terhubung rapat satu sama lain.” Ungkapan Ibrani dapat menekankan kerapatan susunan kota atau kesatuannya secara internal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Nama tempat ini mengikuti bentuk baku yang telah umum dalam bahasa Indonesia.
- source_word: הַבְּנוּיָה
  choice: yang dibangun
  rationale: Partisip pasif dari בנה menerangkan Yerusalem sebagai kota dalam keadaan telah dibangun; terjemahan ini tidak menambahkan gagasan ‘dibangun kembali’ yang tidak dituntut oleh bentuk Ibraninya.
- source_word: כְּעִיר
  choice: seperti kota
  rationale: Prefiks כ menyatakan perbandingan. ‘Seperti kota’ mempertahankan bentuk perbandingan dalam teks Ibrani, meskipun ‘sebagai kota’ juga mungkin secara kontekstual.
- source_word: שֶׁחֻבְּרָה
  choice: yang menyatu erat
  rationale: Bentuk pasif dari חבר menyampaikan keadaan bagian-bagian yang dihubungkan atau dipadukan. ‘Menyatu erat’ alami dalam bahasa Indonesia dan dapat menunjuk pada kerapatan struktur kota.
- source_word: לָּהּ
  choice: —
  rationale: Pronomina feminin ini merujuk kembali kepada kota/Yerusalem. Hubungan refleksifnya diserap secara alami ke dalam frasa ‘menyatu ... menjadi satu’, sementara bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: יַחְדָּו
  choice: menjadi satu
  rationale: Adverbia ini menegaskan kebersamaan atau kesatuan. ‘Menjadi satu’ menyatakan penekanan itu secara wajar dalam bahasa Indonesia.
