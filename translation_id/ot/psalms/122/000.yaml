  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/000.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: id
  text: 'Nyanyian pendakian.[a] Dari Daud.[b]


    Aku bersukacita ketika orang berkata kepadaku,


    “Mari kita pergi ke rumah Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Judul Ibrani ini secara harfiah berkaitan dengan “pendakian” atau “naik.” Kemungkinan menunjuk pada kumpulan nyanyian ziarah ke Yerusalem atau untuk penggunaan liturgis.
    reason: cultural_note
  - marker: b
    text: Frasa Ibrani yang diterjemahkan “Dari Daud” juga dapat dipahami sebagai “milik Daud,” “untuk Daud,” atau “mengenai Daud.”
    reason: source_ambiguity
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian pendakian
  rationale: Mempertahankan gambaran harfiah tentang ‘naik’ sekaligus judul koleksi mazmur; makna ziarah atau fungsi liturgis dijelaskan dalam catatan kaki.
- source_word: שָׂמַחְתִּי
  choice: Aku bersukacita
  rationale: Menyampaikan kegembiraan yang kuat dalam ragam bahasa yang wajar dan bermartabat.
- source_word: בְּאֹמְרִים לִי
  choice: ketika orang berkata kepadaku
  rationale: Bentuk partisipel jamak tanpa subjek tertentu diterjemahkan secara alami dengan ‘orang’, tanpa menentukan identitas para pembicara.
- source_word: נֵלֵךְ
  choice: Mari kita pergi
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan bersama.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: ‘Rumah’ mempertahankan istilah konkret sumber, sedangkan nama ilahi יהוה ditampilkan sebagai Yahweh, bukan diganti dengan gelar.
theological_decisions:
- issue: Hubungan Daud dengan mazmur dalam frasa לְדָוִד
  choice: Dari Daud
  alternative: Milik Daud; untuk Daud; mengenai Daud
  rationale: ‘Dari Daud’ merupakan bentuk judul yang alami, tetapi preposisi Ibrani לְ tidak dengan sendirinya menetapkan jenis hubungan secara pasti; kemungkinan lain dicatat agar ambiguitas sumber tetap terlihat.
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi ‘Yahweh’ secara langsung membedakan nama perjanjian ilahi dari gelar umum ‘Tuhan’, tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Baris puisi mempertahankan gerak dari kegembiraan pribadi menuju ajakan bersama. Istilah ‘pendakian’ menjaga citra sumber, sementara catatan kaki memberi konteks ziarah dan liturgis.
