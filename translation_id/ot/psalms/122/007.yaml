translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Bentuk sapaan posesif tunggal “-mu” dipertahankan karena ayat ini menyapa Yerusalem sebagai satu kota. Kata “dan” ditambahkan untuk menghasilkan paralelisme yang alami dalam bahasa Indonesia tanpa mengubah hubungan kedua klausa.
