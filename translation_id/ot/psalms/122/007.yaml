  text: Semoga ada damai di dalam tembok pertahananmu,[a] dan ketenteraman[b] di dalam istana-istanamu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam kubu pertahananmu.” Kata Ibrani ini dapat merujuk pada benteng atau lingkar pertahanan sebuah kota.
    reason: lexical_alternative
