lexical_decisions:
- source_word: יְהִי
  choice: Semoga ada
  rationale: Bentuk yusif dari היה menyatakan harapan atau doa; “semoga ada” mempertahankan daya optatifnya secara alami dalam bahasa Indonesia.
- source_word: שָׁלוֹם
  choice: damai
  rationale: שָׁלוֹם dapat berarti damai, kesejahteraan, atau keutuhan. Dalam doa bagi Yerusalem ini, “damai” merupakan padanan langsung dan wajar.
- source_word: בְּחֵילֵךְ
  choice: di dalam tembok pertahananmu
  rationale: חֵיל di sini menunjuk pada lingkar pertahanan atau kubu kota. “Tembok pertahanan” jelas bagi pembaca modern, sedangkan “di dalam” mencerminkan fungsi lokatif בְּ.
- source_word: שַׁלְוָה
  choice: ketenteraman
  rationale: שַׁלְוָה menyatakan keadaan tenang, aman, dan sejahtera. “Ketenteraman” mempertahankan unsur ketenangan dan keamanan tanpa mempersempit maknanya menjadi kemakmuran materi.
- source_word: בְּאַרְמְנוֹתָיִךְ
  choice: di dalam istana-istanamu
  rationale: אַרְמוֹן dapat menunjuk pada istana atau bangunan berkubu. “Istana-istana” adalah padanan Indonesia yang alami, sementara kemungkinan arti defensif dicatat dalam catatan kaki.
