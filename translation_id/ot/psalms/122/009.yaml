  text: לְ֭מַעַן בֵּית יְהוָ֣ה אֱלֹהֵ֑י/נוּ אֲבַקְשָׁ֖ה ט֣וֹב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/009.yaml
  text: For the sake of the house of Yahweh our God[a], I will seek your good.
translation:
  language: id
  text: Demi rumah Yahweh, Allah kita, aku akan mengusahakan kebaikanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “aku akan mengusahakan kesejahteraanmu” atau “aku akan mengusahakan kemakmuranmu.” Kata Ibrani yang berarti “kebaikan” di sini menunjuk pada keadaan baik Yerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Demi
  rationale: Menyatakan alasan atau dorongan tindakan pemazmur secara ringkas dan alami.
- source_word: בֵּית
  choice: rumah
  rationale: Mempertahankan ungkapan harfiah Ibrani; dalam konteks ini yang dimaksud ialah rumah ibadah atau Bait Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang dinyatakan langsung dalam teks Ibrani.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Menerjemahkan bentuk dengan akhiran orang pertama jamak secara langsung dan wajar.
- source_word: אֲבַקְשָׁה
  choice: aku akan mengupayakan
  rationale: Bentuk ini menyatakan tekad atau niat. Dalam konteks mencari kebaikan bagi Yerusalem, 'mengupayakan' lebih alami daripada terjemahan harfiah 'mencari'.
- source_word: טוֹב
  choice: yang baik
  rationale: Mempertahankan keluasan makna טוֹב, yang di sini mencakup kebaikan, kesejahteraan, dan kemakmuran Yerusalem.
- source_word: לָךְ
  choice: bagimu
  rationale: Menerjemahkan preposisi dan akhiran orang kedua feminin tunggal yang merujuk kepada Yerusalem; bahasa Indonesia tidak menandai gender pada pronomina ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Ungkapan 'yang baik bagimu' mempertahankan keluasan makna asli, sedangkan catatan kaki menjelaskan arti kontekstualnya.
