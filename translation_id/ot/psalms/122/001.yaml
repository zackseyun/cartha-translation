id: PSA.122.1
reference: Psalms 122:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/001.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: id
  text: 'Nyanyian Pendakian.[a] Dari Daud.[b]


    Aku bersukacita ketika orang berkata kepadaku,

    “Marilah kita pergi ke rumah Yahweh.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Nyanyian Pendakian.” Ini mungkin judul kumpulan nyanyian untuk perjalanan ziarah menuju Yerusalem atau untuk penggunaan liturgis; makna tepat judul ini tidak pasti.
    reason: cultural_note
  - marker: b
    text: Kata depan Ibrani dapat berarti “dari,” “untuk,” “milik,” atau “berkaitan dengan” Daud.
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” menerjemahkan nama ilahi יהוה (YHWH), yang secara tradisional sering ditampilkan sebagai “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Nyanyian Pendakian
  rationale: Menerjemahkan judul koleksi secara cukup harfiah dan mempertahankan gambaran ‘naik’ dalam bentuk jamak, tanpa menetapkan apakah yang dimaksud ialah perjalanan ziarah, tangga, atau penggunaan liturgis.
- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Kata depan לְ dalam judul mazmur dapat menunjukkan kepengarangan, peruntukan, kepemilikan, atau keterkaitan. ‘Dari Daud’ merupakan ungkapan Indonesia yang ringkas dan tidak setegas ‘karangan Daud’.
- source_word: שָׂמַחְתִּי
  choice: Aku bersukacita
  rationale: Menyampaikan kegembiraan penutur secara langsung dan wajar, sesuai bentuk orang pertama tunggal.
- source_word: בְּאֹמְרִים לִי
  choice: ketika orang berkata kepadaku
  rationale: Konstruksi Ibrani tidak menyebut pelaku tertentu. ‘Orang’ mempertahankan ketidakpastian itu dan menghasilkan bahasa Indonesia yang alami.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Bentuk konstruksi Ibrani berarti rumah yang dikaitkan dengan YHWH; ‘rumah Yahweh’ langsung, jelas, dan tidak menambahkan penafsiran berupa ‘Bait Allah’.
- source_word: נֵלֵךְ
  choice: Marilah kita pergi
  rationale: Bentuk orang pertama jamak di sini paling alami dipahami sebagai ajakan; ‘marilah’ mempertahankan daya hortatifnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian YHWH. ‘Yahweh’ menyajikan nama itu secara langsung, sedangkan ‘TUHAN’ merupakan penggantian tradisional berdasarkan kebiasaan pembacaan.
- issue: Hubungan Daud dengan mazmur
  choice: Dari Daud
  alternative: Karangan Daud; untuk Daud; milik Daud
  rationale: Kata depan Ibrani לְ dalam judul tidak dengan sendirinya menentukan apakah Daud adalah pengarang, penerima, pemilik, atau tokoh yang dikaitkan dengan mazmur; terjemahan tidak boleh menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Paralelisme puitis dipertahankan melalui pemenggalan baris. ‘Pendakian’ dipakai dalam judul agar citra leksikal Ibrani tetap tampak, sementara catatan kaki menjelaskan kemungkinan latar ziarah.
