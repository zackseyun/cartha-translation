  yaml_path: translation/ot/psalms/122/004.yaml
  text: There the tribes went up, the tribes of Yah, as a testimony for Israel, to give thanks to the name of the LORD.
translation:
  language: id
  text: Ke sanalah suku-suku naik, suku-suku Yah, sebagai kesaksian bagi Israel[a], untuk mengucap syukur kepada nama TUHAN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebagai ketetapan bagi Israel.” Kata Ibrani ini dapat berarti kesaksian maupun ketetapan/peraturan.'
    reason: Mempertahankan ambiguitas leksikal עֵדוּת tanpa memaksakan satu penafsiran kultis atau teologis.
lexical_decisions:
- source_word: שֶׁשָּׁם
  choice: Ke sanalah
  rationale: Mengungkapkan unsur lokasi sekaligus arah yang tersirat oleh verba “naik” dalam konteks ziarah menuju Yerusalem.
- source_word: עָלוּ
  choice: telah naik
  rationale: Qal perfektum secara formal menunjuk tindakan yang telah terjadi; pilihan ini juga selaras dengan konteks pengamatan penyair atas Yerusalem.
- source_word: שִׁבְטֵי יָהּ
  choice: suku-suku Yah
  rationale: Mempertahankan bentuk ilahi singkat יָהּ dan konstruksi padat Ibrani, tanpa menggantinya dengan bentuk lengkap YHWH.
- source_word: עֵדוּת
  choice: ketetapan
  rationale: Dalam konteks kewajiban Israel berziarah dan beribadah, kata ini menunjuk ketentuan atau perintah yang mengikat, bukan terutama tindakan bersaksi.
- source_word: לְהֹדוֹת
  choice: untuk mengucap syukur
  rationale: Infinitif הידה dalam konteks ibadah berarti menyatakan syukur atau pujian; “mengucap syukur” alami dan tepat dalam bahasa Indonesia.
- source_word: שֵׁם יְהוָה
  choice: nama TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang mewakili tetragramaton dengan TUHAN dalam huruf kapital.
theological_decisions:
- issue: Makna עֵדוּת לְיִשְׂרָאֵל
  choice: sebagai ketetapan bagi Israel
  alternative: sebagai kesaksian bagi Israel
  rationale: Konteks ziarah suku-suku untuk beribadah lebih mendukung pengertian ketetapan ilahi bagi Israel, kemungkinan mengacu pada kewajiban kultis; namun kemungkinan arti “kesaksian” tetap merupakan ambiguitas leksikal yang sah.
- issue: Bentuk nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks memakai bentuk puitis singkat Yah, berbeda dari tetragramaton pada akhir ayat; perbedaan sumber ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Struktur paralel “suku-suku, suku-suku Yah” dipertahankan, demikian pula pembedaan antara יָהּ (“Yah”) dan יהוה (“TUHAN”).
