  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Sapaan ‘hai Yerusalem’ mempertahankan bentuk sapaan langsung, sedangkan pengulangan ‘gerbang-gerbang’ mempertahankan bentuk jamak sumber.
