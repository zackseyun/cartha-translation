translation:
  language: id
  text: Kaki kami telah berdiri di dalam gerbang-gerbangmu[a], hai Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kaki kami sedang berdiri di dalam gerbang-gerbangmu, Yerusalem.” Teks Ibrani memakai partisipel bersama bentuk lampau dari kata kerja “ada,” suatu ungkapan perifrastis yang juga dapat dipahami sebagai keadaan yang berlangsung pada waktu lampau.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדוֹת
  choice: berdiri
  rationale: Partisipel Qal feminin jamak dari עמד menyatakan keadaan yang berlangsung dan bersesuaian dengan subjek feminin jamak ‘kaki kami’. ‘Berdiri’ mempertahankan citra jasmani para peziarah yang telah tiba.
- source_word: הָיוּ
  choice: (tercakup dalam bentuk tanpa penanda waktu) berdiri
  rationale: Bentuk perfektif היה bersama partisipel membentuk ungkapan verbal perifrastis. Bahasa Indonesia tidak memerlukan kopula atau penandaan kala; bentuk sederhana ‘berdiri’ dapat menyampaikan keadaan yang sedang berlaku dalam konteks, sementara kemungkinan nuansa lampau dicatat dalam catatan kaki.
- source_word: רַגְלֵינוּ
  choice: kaki kami
  rationale: Terjemahan langsung bentuk jamak berkonstruksi dengan sufiks orang pertama jamak; ungkapan ini mempertahankan gambaran kedatangan para peziarah.
- source_word: בִּשְׁעָרַיִךְ
  choice: di dalam gerbang-gerbangmu
  rationale: Preposisi ב dan nomina bersufiks diterjemahkan dengan ‘di dalam’ untuk menunjukkan bahwa para peziarah berada dalam kawasan pintu masuk kota, bukan sekadar di luarnya. Bentuk jamak dipertahankan.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Menggunakan bentuk baku nama tempat ini dalam bahasa Indonesia.
