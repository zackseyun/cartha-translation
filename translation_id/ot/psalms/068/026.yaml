  text: בְּֽ֭/מַקְהֵלוֹת בָּרְכ֣וּ אֱלֹהִ֑ים יְ֝הוָ֗ה מִ/מְּק֥וֹר יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/026.yaml
  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: id
  text: Dalam berbagai perhimpunan, pujilah Allah, Yahweh[b], dari mata air Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Frasa Ibrani “dari mata air Israel” bersifat eliptis. Frasa ini juga dapat dipahami sebagai sapaan kepada para penyembah: “hai kamu yang berasal dari sumber Israel.”'
    reason: alternative_reading
  - marker: b
    text: 'Ibrani: YHWH, nama pribadi Allah; secara tradisional diterjemahkan “TUHAN.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: Dalam perhimpunan-perhimpunan
  rationale: Bentuk jamak מַקְהֵלוֹת menunjuk kepada kelompok-kelompok yang berkumpul. “Perhimpunan-perhimpunan” mempertahankan bentuk jamak tanpa memberi kesan kelembagaan gerejawi yang tidak dituntut oleh teks.
- source_word: בָּרְכוּ
  choice: pujilah
  rationale: Kata kerja imperatif ברך ketika Allah menjadi objek berarti memberkati atau memuji-Nya dalam ucapan ibadah. Dalam bahasa Indonesia modern, “pujilah” lebih alami dan tidak menimbulkan kesan bahwa manusia menganugerahkan berkat kepada Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk tersebut merujuk kepada Allah yang esa dan berdiri sejajar dengan nama Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: מִמְּקוֹר
  choice: dari mata air
  rationale: מָקוֹר berarti sumber atau mata air. “Mata air” mempertahankan gambaran puitisnya, sedangkan preposisi מִן diterjemahkan secara langsung sebagai “dari”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Transliterasi baku nama diri tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Masoret secara langsung memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri, sedangkan “TUHAN” merupakan penggantian tradisional dengan sebuah gelar.
- issue: Hubungan frasa מִמְּקוֹר יִשְׂרָאֵל dengan bagian sebelumnya
  choice: 'Mempertahankan susunan eliptis: “dari mata air Israel”'
  alternative: “hai kamu yang berasal dari sumber Israel”
  rationale: Bahasa Ibrani tidak menyatakan secara eksplisit unsur yang diterangkan oleh frasa ini. Terjemahan utama mempertahankan ketegangan sintaksis dan citra puitisnya; kemungkinan bahwa frasa itu menyapa para penyembah dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. Susunan yang agak tidak biasa pada frasa penutup sengaja dipertahankan karena teks Ibraninya eliptis; catatan kaki menyajikan pembacaan alternatif tanpa menetapkannya sebagai satu-satunya tafsiran.
