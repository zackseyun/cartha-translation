base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: id
  text: Tuhan berkata, “Aku akan membawa mereka kembali[a] dari Basan; Aku akan membawa mereka kembali dari kedalaman laut.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku akan membawa kembali dari Basan; Aku akan membawa kembali dari kedalaman laut.” Teks Ibrani tidak menyebutkan objek kata kerjanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: אֲדֹנָי adalah gelar ilahi, bukan nama YHWH. Dalam bahasa Indonesia, “Tuhan” secara alami dan hormat menyampaikan gelar tersebut.
- source_word: אָמַר
  choice: berkata
  rationale: Bentuk qatal ini memperkenalkan ucapan langsung. “Berkata” menerjemahkan makna dasarnya tanpa menambahkan nuansa deklaratif yang tidak dinyatakan.
- source_word: מִבָּשָׁן
  choice: dari Basan
  rationale: Nama tempat בָּשָׁן ditransliterasikan sebagai “Basan”, sedangkan preposisi מִן diterjemahkan secara wajar sebagai “dari”.
- source_word: אָשִׁיב ... אָשִׁיב
  choice: Aku akan membawa mereka kembali ... Aku akan membawa mereka kembali
  rationale: Bentuk Hifil dari שׁוב berarti membawa atau mengantar kembali. Pengulangan dipertahankan untuk menjaga penekanan dalam bahasa Ibrani. Kata “mereka” disediakan agar kalimat Indonesia alami, tetapi ketidaktersuratannya dalam teks sumber dicatat dalam catatan kaki.
- source_word: מִמְּצֻלוֹת יָם
  choice: dari kedalaman laut
  rationale: מְצֻלוֹת menunjuk pada bagian-bagian air yang dalam. “Kedalaman laut” mempertahankan gambaran tempat yang amat jauh atau sulit dijangkau tanpa memperlakukan “laut” sebagai nama diri.
theological_decisions:
- issue: Objek tersirat pada dua kemunculan אָשִׁיב
  choice: Menyediakan “mereka” tanpa menentukan siapa yang dimaksud
  alternative: 'Membiarkan objek tidak disebut: “Aku akan membawa kembali dari Basan; Aku akan membawa kembali dari kedalaman laut”'
  rationale: Bahasa Ibrani tidak menyebutkan objek, dan konteks dapat dipahami dengan lebih dari satu cara mengenai siapa yang dibawa kembali. Bahasa Indonesia lebih alami dengan objek pada verba transitif ini, sehingga “mereka” disediakan, tetapi rujukannya tidak dipersempit dan ketidaktersuratan objek dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel serta pengulangan sumber dipertahankan; tanda titik koma membantu memperlihatkan kesejajaran kedua klausa.
