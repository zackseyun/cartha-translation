  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: id
  text: Akuilah kekuatan Allah[a]; keagungan-Nya atas Israel, dan kekuatan-Nya di angkasa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Berikanlah kekuatan kepada Allah”; di sini ungkapan itu merupakan ajakan untuk mengakui atau menyatakan kekuatan Allah.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di awan-awan” atau “di langit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ עֹז
  choice: Akuilah kekuatan
  rationale: Secara harfiah berarti “berikanlah kekuatan,” tetapi dalam seruan pujian ungkapan ini meminta umat mengakui atau menyatakan kekuatan yang dimiliki Allah, bukan menambahkan kekuatan kepada-Nya.
- source_word: לֵאלֹהִים
  choice: Allah
  rationale: Preposisi Ibrani menandai pihak yang kepadanya pengakuan itu diarahkan; dalam susunan Indonesia, maknanya sudah tercakup secara alami dalam “Akuilah kekuatan Allah.”
- source_word: עַל יִשְׂרָאֵל
  choice: meliputi Israel
  rationale: Kata עַל dapat berarti “atas/di atas.” Bersama “keagungan-Nya,” pilihan “meliputi Israel” mempertahankan gambaran keagungan ilahi yang menaungi atau terbentang atas Israel tanpa mempersempitnya menjadi satu tafsiran saja.
- source_word: גַּאֲוָתוֹ
  choice: keagungan-Nya
  rationale: Dalam konteks pujian kepada Allah, nomina ini menyatakan keluhuran atau kemegahan, bukan kesombongan yang tercela.
- source_word: וְעֻזּוֹ
  choice: dan kekuatan-Nya
  rationale: Pengulangan “kekuatan” mempertahankan kaitan puitis dengan seruan pembuka.
- source_word: בַּשְּׁחָקִים
  choice: di angkasa
  rationale: Kata puitis ini dapat menunjuk langit tinggi atau awan. “Angkasa” alami dan luhur dalam bahasa Indonesia serta tidak terlalu membatasi gambarannya.
theological_decisions:
- issue: Apakah manusia secara harfiah memberikan kekuatan kepada Allah
  choice: “Akuilah kekuatan Allah” sebagai ungkapan pengakuan dalam pujian
  alternative: “Berikanlah kekuatan kepada Allah”
  rationale: Bentuk harfiahnya memakai verba “memberi,” tetapi konteks puitis memanggil para penyembah untuk mengakui kekuatan Allah, bukan menyiratkan bahwa Allah kekurangan kekuatan dan menerimanya dari manusia.
- issue: Hubungan keagungan Allah dengan Israel
  choice: “keagungan-Nya meliputi Israel”
  alternative: “keagungan-Nya atas Israel”
  rationale: Terjemahan ini menjaga cakupan spasial atau pemerintahan dari עַל sambil menghasilkan bahasa Indonesia yang alami; teks tidak diperinci menjadi satu rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. “Akuilah” menyampaikan fungsi idiomatis imperatif Ibrani; “angkasa” mempertahankan citra kosmis. Semua penanda catatan kaki muncul dalam teks utama.
