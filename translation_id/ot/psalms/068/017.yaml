  text: רֶ֤כֶב אֱלֹהִ֗ים רִבֹּתַ֣יִם אַלְפֵ֣י שִׁנְאָ֑ן אֲדֹנָ֥/י בָ֝֗/ם סִינַ֥י בַּ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: id
  text: Kereta-kereta Allah berjumlah puluhan ribu, ribuan yang berlipat-lipat[a]; Tuhan ada di antara mereka—Sinai dalam kekudusan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian kedua berbunyi “ribuan shin'an”. Arti kata Ibrani yang langka itu tidak pasti; kemungkinan besar kata itu menyatakan pengulangan atau jumlah yang berlipat-lipat.
    reason: lexical_alternative
  - marker: b
    text: 'Klausa Ibrani ini sangat padat dan sulit. Kemungkinan lain: “Tuhan ada di antara mereka seperti di Sinai, dalam kekudusan,” “Tuhan ada di antara mereka; Sinai berada di tempat kudus,” atau “Tuhan datang dari Sinai ke tempat kudus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: kereta-kereta Allah
  rationale: רֶכֶב dapat menunjuk secara kolektif pada kereta perang atau pasukan berkereta. Bentuk jamak dalam bahasa Indonesia mempertahankan gambaran rombongan kereta surgawi dan hubungan kepunyaan dengan Allah.
- source_word: רִבֹּתַיִם
  choice: puluhan ribu
  rationale: Bentuk dual ini secara harfiah dapat berarti dua laksa, tetapi dalam puisi berfungsi sebagai ungkapan jumlah yang amat besar. 'Puluhan ribu' alami dalam bahasa Indonesia modern tanpa menuntut ketepatan matematis.
- source_word: אַלְפֵי שִׁנְאָן
  choice: beribu-ribu banyaknya
  rationale: שִׁנְאָן adalah kata langka dan tidak pasti, mungkin menyatakan pengulangan atau pelipatgandaan. Ungkapan ini menyampaikan banyaknya ribuan sambil tidak memberi arti teknis yang terlalu pasti.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Gelar ilahi אֲדֹנָי diterjemahkan dengan bentuk baku dan wajar 'Tuhan'.
- source_word: בָם
  choice: ada di antara mereka
  rationale: Preposisi ב dengan akhiran pronominal dapat berarti 'di dalam', 'di antara', atau 'bersama'. Dalam konteks rombongan kereta ilahi, 'di antara mereka' paling alami.
- source_word: סִינַי
  choice: Sinai
  rationale: Nama tempat dipertahankan dalam bentuk Indonesia yang lazim.
- source_word: בַּקֹּדֶשׁ
  choice: dalam kekudusan
  rationale: קֹדֶשׁ dapat berarti kekudusan secara abstrak atau tempat kudus secara konkret. Pilihan ini mempertahankan ketaksaan dan kepadatan ungkapan Ibrani tanpa menetapkan lokasi tertentu.
theological_decisions:
- issue: Penafsiran klausa padat אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ
  choice: Tuhan ada di antara mereka—Sinai dalam kekudusan
  alternative: Tuhan ada di antara mereka seperti di Sinai, dalam kekudusan; atau Tuhan datang dari Sinai ke tempat kudus
  rationale: Teks Ibrani sangat eliptis dan tidak menyatakan secara eksplisit perbandingan maupun gerak dari Sinai menuju tempat kudus. Terjemahan utama mempertahankan ketegangan sintaksis dan hubungan puitis antargagasan, sedangkan kemungkinan penafsiran dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. 'Puluhan ribu, beribu-ribu banyaknya' mudah dipahami pembaca umum, sedangkan tanda pisah pada klausa terakhir mempertahankan kepadatan dan ketaksaan puisi Ibrani; catatan kaki mencegah ungkapan itu menjadi tidak tertolong.
