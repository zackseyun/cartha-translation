lexical_decisions:
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Bentuk ini adalah gelar ilahi, bukan nama YHWH. “Tuhan” merupakan padanan alami dan baku dalam bahasa Indonesia.
- source_word: יִתֶּן
  choice: memberikan
  rationale: Bentuk yiqtol di sini dapat bernuansa kini, mendatang, atau modal. Bentuk kini cocok dengan gaya pernyataan puitis ayat ini tanpa menutup kemungkinan nuansa lain dari konteks.
- source_word: אֹמֶר
  choice: firman
  rationale: Kata ini berarti perkataan, ujaran, pesan, atau perintah. “Firman” mempertahankan ungkapan yang ringkas dan menunjukkan bahwa perkataan itu berasal dari Tuhan; pilihan “pesan” dan “perintah” dicatat sebagai alternatif.
- source_word: הַמְבַשְּׂרוֹת
  choice: para perempuan yang membawa kabar baik
  rationale: Partisip ini berbentuk feminin jamak dan berasal dari akar yang berarti membawa atau memberitakan kabar baik. Terjemahan menyatakan gender yang ditandai dalam bahasa Ibrani dan mempertahankan gagasan kabar baik.
- source_word: צָבָא
  choice: pasukan
  rationale: Kata ini lazim berarti pasukan atau bala tentara, tetapi juga dapat menunjuk suatu rombongan besar. “Pasukan” mempertahankan citra militer yang cocok dengan konteks mazmur.
- source_word: רָב
  choice: yang besar
  rationale: Kata ini menyatakan besarnya atau banyaknya pasukan. “Yang besar” alami dalam bahasa Indonesia dan tetap dapat mencakup jumlah yang sangat banyak.
theological_decisions:
- issue: Gender partisip הַמְבַשְּׂרוֹת
  choice: Diterjemahkan secara eksplisit sebagai “para perempuan yang membawa kabar baik”.
  alternative: “para pembawa kabar baik” atau “orang-orang yang memberitakan kabar baik”
  rationale: Bahasa Ibrani secara gramatikal menandai kelompok ini sebagai feminin jamak. Mempertahankan unsur itu merupakan ketepatan tekstual, bukan penambahan klaim doktrinal.
- issue: Nuansa militer pada צָבָא
  choice: Diterjemahkan “pasukan”.
  alternative: “rombongan” atau “kumpulan”
  rationale: Konteks mazmur mendukung citra kemenangan dan peperangan, tetapi kata itu juga dapat merujuk pada kelompok yang besar. Alternatif yang kurang militer dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan kalimat yang mudah dipahami. “Para perempuan” mempertahankan gender eksplisit teks Ibrani, sedangkan “pasukan yang besar” menjaga citra kolektif dan militer tanpa memperluas maknanya.
