source:
  edition: WLC
  text: בָּ֤ר֣וּךְ אֲדֹנָ/י֮ י֤וֹם י֥וֹם יַֽעֲמָס לָ֗/נוּ הָ֘/אֵ֤ל יְֽשׁוּעָתֵ֬/נוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/019.yaml
  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: id
  text: Terpujilah Tuhan, yang hari demi hari menopang kita[a]—Allah adalah keselamatan kita. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Klausa Ibraninya ringkas dan dapat juga dipahami, “yang hari demi hari menanggung beban kita.” Secara tradisional diterjemahkan, “yang setiap hari melimpahi kita dengan kebaikan.” Kata kerjanya berarti memuati atau menanggung, tetapi objeknya tidak dinyatakan.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Partisipel pasif ini dipakai dalam rumus pujian. “Terpujilah” menyampaikan daya doksologisnya secara wajar dan khidmat dalam bahasa Indonesia.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Gelar ilahi ini secara alami diterjemahkan “Tuhan” dalam rumus pujian.
- source_word: יוֹם יוֹם
  choice: hari demi hari
  rationale: Ungkapan berulang ini bersifat distributif; “hari demi hari” mempertahankan pengulangan dan menegaskan tindakan yang terus berlangsung.
- source_word: יַעֲמָס לָנוּ
  choice: menopang kita
  rationale: Kata kerja עמס berkaitan dengan memuati atau menanggung muatan, sedangkan konstruksinya ringkas dan objeknya tidak dinyatakan. “Menopang kita” mengungkapkan pertolongan Allah yang terus-menerus tanpa menambahkan “berkat-berkat” yang tidak terdapat dalam teks; keragaman kemungkinan dijelaskan dalam catatan kaki.
- source_word: הָאֵל
  choice: Allah
  rationale: Sebutan ilahi אֵל paling wajar diterjemahkan “Allah”; artikelnya tidak perlu diterjemahkan secara kaku.
- source_word: יְשׁוּעָתֵנוּ
  choice: keselamatan kita
  rationale: Kata ini mencakup penyelamatan dan pertolongan yang membebaskan. “Keselamatan kita” mempertahankan keluasan maknanya.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah ini ditransliterasikan karena arti dan fungsi tepatnya tidak pasti.
theological_decisions:
- issue: Penafsiran klausa ringkas יַעֲמָס לָנוּ
  choice: Allah dipuji sebagai Dia yang terus-menerus menopang umat-Nya.
  alternative: Allah setiap hari menanggung beban kita; atau Allah setiap hari melimpahi kita dengan berbagai kebaikan.
  rationale: Kata kerja Ibraninya pada dasarnya menggambarkan tindakan memuati atau menanggung, tetapi objeknya tidak disebutkan dan לָנוּ secara harfiah berarti “bagi kita”. Terjemahan utama menyampaikan gambaran pemeliharaan ilahi secara alami, sedangkan catatan kaki mempertahankan ketidakpastian sintaksis dan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Terpujilah” mempertahankan corak pujian, “hari demi hari” mencerminkan pengulangan Ibrani, dan tanda pisah mempertahankan hubungan puitis yang erat antara kedua pernyataan.
