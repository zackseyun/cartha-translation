id: PSA.68.7
reference: Psalms 68:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים בְּ֭/צֵאתְ/ךָ לִ/פְנֵ֣י עַמֶּ֑/ךָ בְּ/צַעְדְּ/ךָ֖ בִֽ/ישִׁימ֣וֹן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/007.yaml
  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: id
  text: Ya Allah, ketika Engkau keluar mendahului umat-Mu, ketika Engkau melangkah melalui padang belantara[a]—Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui gurun” atau “di tanah tandus.” Istilah Ibrani menunjuk pada kawasan belantara yang sunyi dan tandus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Dipahami sebagai sapaan langsung pada awal klausa. Partikel “Ya” membuat fungsi sapaan itu alami dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: בְּצֵאתְךָ
  choice: ketika Engkau keluar
  rationale: 'Preposisi ב dengan bentuk infinitif konstruk יצא dan sufiks orang kedua tunggal maskulin berfungsi temporal: “ketika Engkau keluar”.'
- source_word: לִפְנֵי עַמֶּךָ
  choice: mendahului umat-Mu
  rationale: לִפְנֵי berarti “di depan” atau “mendahului”. Dalam konteks gerak, “mendahului” secara alami mempertahankan gambaran Allah berjalan di depan umat-Nya.
- source_word: בְּצַעְדְּךָ
  choice: ketika Engkau melangkah
  rationale: צעד menyatakan tindakan melangkah atau berbaris. “Melangkah” mempertahankan citra gerak yang konkret tanpa mempersempitnya menjadi istilah militer.
- source_word: בִישִׁימוֹן
  choice: melalui padang belantara
  rationale: יְשִׁימוֹן menunjuk kawasan sunyi, tandus, atau gurun. Dengan verba gerak, “melalui padang belantara” merupakan ungkapan Indonesia yang alami.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah ini dipertahankan sebagai transliterasi karena fungsi tepatnya tidak pasti, mungkin sebagai tanda liturgis atau musikal.
theological_decisions:
- issue: Tindakan Allah dalam perjalanan umat di padang belantara
  choice: Ayat diterjemahkan sebagai sapaan langsung kepada Allah yang mengenang tindakan-Nya berjalan mendahului umat-Nya.
  alternative: Membacanya secara lebih deskriptif, bukan sebagai sapaan langsung.
  rationale: Sintaks dan konteks mazmur mendukung sapaan langsung. Terjemahan mempertahankan gambaran kepemimpinan ilahi tanpa menambahkan rincian teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. “Sela” dipertahankan tanpa penjelasan dalam teks utama agar ketidakpastian istilah sumber tetap terjaga.
