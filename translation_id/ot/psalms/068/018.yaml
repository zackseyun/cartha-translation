  variant: modern standard Indonesian
source:
  edition: WLC
  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: id
  text: Engkau naik ke tempat tinggi; Engkau menawan para tawanan. Engkau menerima pemberian di antara manusia[a], bahkan di antara orang-orang yang memberontak, supaya Yah Allah berdiam di sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari manusia.” Preposisi Ibrani dalam ungkapan ini dapat menunjukkan lingkup (“di antara”) atau sumber (“dari”).
    reason: lexical_alternative
  - marker: b
    text: Atau “supaya Yah Allah berdiam di antara mereka” atau “sebagai tempat kediaman bagi Yah Allah.” Klausa Ibraninya padat dan dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ לַמָּרוֹם
  choice: Engkau naik ke tempat tinggi
  rationale: Ungkapan ini mempertahankan gerak vertikal dan suasana kemenangan tanpa menentukan lokasi secara berlebihan.
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: Engkau membawa tawanan-tawanan
  rationale: Bentuk jamak berulang memberikan ungkapan kemenangan yang ringkas dan wajar dalam bahasa Indonesia, meskipun permainan akar kata Ibraninya tidak dapat dipertahankan sepenuhnya.
- source_word: לָקַחְתָּ מַתָּנוֹת
  choice: Engkau menerima pemberian
  rationale: Walaupun לָקַחְתָּ secara dasar berarti 'mengambil', bersama 'pemberian' konteksnya mendukung makna menerima persembahan atau upeti.
- source_word: בָּאָדָם
  choice: di antara manusia
  rationale: Terjemahan ini mempertahankan kemungkinan bahwa ב menandai lingkup, sedangkan kemungkinan makna sumber, 'dari manusia', dicatat dalam catatan kaki.
- source_word: סוֹרְרִים
  choice: orang-orang yang memberontak
  rationale: Pilihan ini menyampaikan orang yang melawan atau bersikap keras kepala secara aktif dan mudah dipahami pembaca modern.
- source_word: לִשְׁכֹּן
  choice: supaya ... berdiam
  rationale: Infinitif berawalan ל dipahami sebagai tujuan atau hasil, tetapi hubungan tepatnya dengan unsur-unsur sebelumnya tetap tidak diperinci.
- source_word: יָהּ אֱלֹהִים
  choice: Yah Allah
  rationale: ‘Yah’ mempertahankan bentuk singkat nama ilahi יָהּ, sedangkan ‘Allah’ menerjemahkan אֱלֹהִים; susunan padat sumber dipertahankan.
theological_decisions:
- issue: Arah dan fungsi בָּאָדָם dalam klausa tentang pemberian
  choice: di antara manusia
  alternative: dari manusia
  rationale: Preposisi Ibrani ב dapat dipahami sebagai lingkup atau, dalam konteks ini, sebagai penanda sumber. Teks utama tidak menutup kemungkinan alternatif tersebut, yang dicantumkan dalam catatan kaki.
- issue: Sintaksis dan tempat berdiam dalam לִשְׁכֹּן יָהּ אֱלֹהִים
  choice: supaya Yah Allah berdiam di sana
  alternative: supaya Yah Allah berdiam di antara mereka; sebagai tempat kediaman bagi Yah Allah
  rationale: Klausa Ibrani sangat padat dan tidak menyatakan objek tempat secara eksplisit. ‘Di sana’ menghasilkan bahasa Indonesia yang wajar tanpa memastikan apakah tempat itu lokasi tinggi, umat manusia, atau bahkan kelompok pemberontak.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Pengulangan ‘tawanan-tawanan’ mempertahankan kepadatan retoris, sedangkan ‘Yah’ dipakai untuk membedakan bentuk singkat nama ilahi dari tetragramaton penuh.
