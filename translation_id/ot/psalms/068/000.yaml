  rationale: Padanan baku untuk jenis nyanyian yang dinyanyikan dengan iringan musik; label ini dipertahankan tersendiri.
- source_word: שִׁיר
  choice: Nyanyian
  rationale: Padanan langsung yang mempertahankan label jenis kedua dalam teks Ibrani, tanpa meleburkannya dengan 'mazmur'.
