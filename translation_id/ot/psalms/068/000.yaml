- source_word: לְדָוִד
  choice: Dari Daud
  rationale: Ungkapan yang ringkas dan wajar untuk judul, sambil memberi catatan bahwa preposisi Ibrani לְ dapat menyatakan kepengarangan, peruntukan, kepemilikan, atau hubungan.
- source_word: מִזְמוֹר
