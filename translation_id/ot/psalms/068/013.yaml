  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: id
  text: Sekalipun[a] kamu berbaring di antara kandang-kandang domba[b], sayap-sayap merpati bersalut perak, dan bulu-bulu kepaknya bersalut emas kuning kehijauan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jika” atau “Ketika.” Kata Ibrani ini dapat dipahami secara konsesif, kondisional, atau temporal dalam konteks puitis ini.'
