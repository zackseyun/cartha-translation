  - marker: c
    text: Secara harfiah, ungkapan Ibrani ini menggambarkan emas dengan rona kuning-hijau atau kehijauan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Sekalipun
  rationale: Dalam konteks puitis ini, אִם kemungkinan memperkenalkan anak kalimat konsesif. Namun, makna kondisional atau temporal tetap mungkin dan dicatat dalam catatan kaki.
- source_word: תִּשְׁכְּבוּן
  choice: kamu berbaring
  rationale: Bentuk ini berasal dari שׁכב, ‘berbaring’. Kata ganti ‘kamu’ dalam bahasa Indonesia dapat merujuk kepada bentuk jamak Ibrani tanpa membuat kalimat menjadi kaku.
- source_word: בֵּין שְׁפַתָּיִם
  choice: di antara kandang-kandang domba
  rationale: Istilah שְׁפַתָּיִם sulit dan maknanya diperdebatkan. Terjemahan tradisional ‘kandang-kandang domba’ mempertahankan gambaran tempat beristirahat, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: כַּנְפֵי יוֹנָה
  choice: sayap-sayap merpati
  rationale: Menerjemahkan rangkaian konstruksi Ibrani secara langsung dan alami tanpa menentukan apakah yang dimaksud seekor merpati tertentu.
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: bersalut perak
  rationale: Partisipel dari חפה menyatakan keadaan tertutup atau terlapisi. ‘Bersalut’ mempertahankan gambaran lapisan logam dengan bahasa Indonesia yang ringkas dan puitis.
- source_word: אֶבְרוֹתֶיהָ
  choice: bulu-bulu kepaknya
  rationale: אֶבְרוֹת menunjuk pada bulu kepak atau bulu terbang, bukan sekadar bulu secara umum. Bentuk posesif ‘-nya’ secara alami merujuk kembali kepada merpati.
- source_word: בִּירַקְרַק חָרוּץ
  choice: bersalut emas kuning kehijauan
  rationale: חָרוּץ dapat berarti emas, sedangkan יְרַקְרַק menggambarkan rona kuning-hijau atau kehijauan. Ungkapan ini mempertahankan unsur warna yang tidak biasa dalam teks Ibrani.
