  text: מֵֽ֭/הֵיכָלֶ/ךָ עַל יְרוּשָׁלִָ֑ם לְ/ךָ֤ יוֹבִ֖ילוּ מְלָכִ֣ים שָֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/029.yaml
  text: From your temple above Jerusalem[c][b][a], kings will bring tribute to you.
translation:
  language: id
  text: Dari bait-Mu yang di atas Yerusalem[a], raja-raja akan membawa upeti[b] kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Karena bait-Mu di Yerusalem, raja-raja akan membawa upeti kepada-Mu.”'
    reason: alternative_reading
  - marker: b
    text: “Upeti” dapat juga diterjemahkan “pemberian” atau “persembahan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: Dari bait-Mu
  rationale: Preposisi מִן dipertahankan dalam arti dasar sumber atau asal, “dari”. הֵיכָל dalam konteks ini menunjuk pada bait Allah.
- source_word: עַל יְרוּשָׁלִָם
  choice: yang di atas Yerusalem
  rationale: Terjemahan ini mempertahankan daya ruang עַל, “di atas”, dan menghubungkan frasa tersebut dengan bait Allah. Kemungkinan pembacaan lokatif yang lebih umum dicatat dalam catatan kaki.
- source_word: לְךָ
  choice: kepada-Mu
  rationale: Pronomina datif menandai Allah sebagai penerima upeti yang dibawa para raja.
- source_word: יוֹבִילוּ
  choice: akan membawa
  rationale: Bentuk Hifil dari יבל, dengan upeti sebagai objek, secara wajar berarti “membawa”. Bentuk “akan” sesuai dengan arah pernyataan dalam konteks mazmur.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Padanan langsung yang mempertahankan gambaran para penguasa bangsa-bangsa.
- source_word: שַׁי
  choice: upeti
  rationale: Kata ini berarti pemberian atau persembahan, khususnya pemberian kehormatan kepada pihak yang lebih tinggi. “Upeti” mempertahankan nuansa kerajaan dan pengakuan takluk dalam konteks para raja.
theological_decisions:
- issue: Hubungan sintaksis antara bait Allah dan Yerusalem
  choice: 'Frasa עַל יְרוּשָׁלִָם menerangkan letak bait Allah: “bait-Mu yang di atas Yerusalem”.'
  alternative: “Karena bait-Mu di Yerusalem, raja-raja akan membawa pemberian kepada-Mu.”
  rationale: Bahasa Ibrani memungkinkan מִן dipahami secara kausal dan עַל secara lokatif umum. Teks utama mempertahankan arti ruang yang lebih langsung tanpa menutup kemungkinan pembacaan alternatif.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Bentuk “bait-Mu” mempertahankan istilah Alkitab yang lazim, sedangkan susunan “yang di atas Yerusalem” sengaja mempertahankan ketegangan ruang dalam teks Ibrani; pembacaan yang lebih idiomatis tersedia dalam catatan kaki.
