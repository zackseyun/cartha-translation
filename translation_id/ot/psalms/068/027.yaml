  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: id
  text: Di sana ada Benyamin yang kecil, memimpin mereka[a]; para pemimpin Yehuda, rombongan mereka[b]; para pemimpin Zebulon; para pemimpin Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memerintah mereka” atau “berkuasa atas mereka.” Partisip Ibrani ini dapat menyatakan pemerintahan atau kedudukan terdepan; dalam konteks ini, teks utama memahaminya sebagai memimpin arak-arakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kumpulan mereka,” “kerumunan mereka,” atau “orang banyak mereka.” Kata Ibrani ini langka dan nuansa tepatnya tidak pasti, tetapi tampaknya menunjuk kelompok yang berkumpul bersama Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Di sana ada
  rationale: Adverbia lokatif/deiktis ini memperkenalkan suku-suku yang hadir; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan penunjukan tempat.
- source_word: בִּנְיָמִן צָעִיר
  choice: Benyamin yang kecil
  rationale: צָעִיר dapat berarti kecil, muda, atau paling kecil. Dalam konteks suku, 'yang kecil' mempertahankan ungkapan puitis dan kemungkinan rujukan pada ukuran atau kedudukan suku tanpa menjadikannya keterangan usia.
- source_word: רֹדֵם
  choice: memimpin mereka
  rationale: Partisip dengan sufiks orang ketiga jamak berasal dari akar yang lazim menyatakan memerintah atau berkuasa. Dalam gambaran arak-arakan, 'memimpin mereka' sesuai konteks, sementara kemungkinan arti pemerintahan dipertahankan dalam catatan kaki.
- source_word: שָׂרֵי
  choice: para pemimpin
  rationale: שַׂר menunjuk pejabat, kepala, penguasa, atau pangeran. 'Para pemimpin' terdengar alami bagi kepemimpinan suku dalam bahasa Indonesia modern tanpa mengharuskan status putra raja.
- source_word: רִגְמָתָם
  choice: dengan rombongan mereka
  rationale: Istilah langka ini tampaknya menunjuk kelompok, kumpulan, atau kerumunan. Pilihan ini menghasilkan gambaran rombongan Yehuda dan tetap mengakui ketidakpastian leksikal melalui catatan kaki.
- source_word: זְבֻלוּן
  choice: Zebulon
  rationale: Nama suku ditulis menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Nama suku ditulis menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa רֹדֵם sebagai kepemimpinan dalam arak-arakan atau kekuasaan pemerintahan
  choice: memimpin mereka
  alternative: memerintah mereka / berkuasa atas mereka
  rationale: Konteks mazmur menggambarkan arak-arakan, sehingga kepemimpinan prosesi paling sesuai sebagai teks utama. Namun, daya makna 'memerintah' dari akar Ibraninya tidak dihapus dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas. 'Para pemimpin' dipilih alih-alih 'para pangeran' agar tidak menyiratkan secara sempit bahwa mereka adalah putra raja. Tanda titik koma mempertahankan susunan daftar puitis sumber.
