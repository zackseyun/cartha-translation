  text: אֶ֤רֶץ רָעָ֨שָׁה אַף שָׁמַ֣יִם נָטְפוּ֮ מִ/פְּנֵ֪י אֱלֹ֫הִ֥ים זֶ֥ה סִינַ֑י מִ/פְּנֵ֥י אֱ֝לֹהִ֗ים אֱלֹהֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/008.yaml
  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: id
  text: Bumi berguncang; bahkan langit pun menitikkan air di hadapan Allah—Sinai ini—di hadapan Allah, Allah Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָשָׁה
  choice: berguncang
  rationale: Menyampaikan gerakan hebat bumi secara alami dan sesuai dengan konteks penampakan ilahi.
- source_word: נָטְפוּ
  choice: menitikkan air
  rationale: Mempertahankan gambaran harfiah langit yang 'menetes', sekaligus membuat acuannya sebagai hujan dapat dipahami dalam bahasa Indonesia.
- source_word: מִפְּנֵי
  choice: di hadapan
  rationale: Menjaga ungkapan relasional sumber, yakni bahwa alam bereaksi di hadapan atau karena kehadiran Allah, tanpa mempersempitnya hanya menjadi hubungan sebab-akibat.
- source_word: זֶה סִינַי
  choice: Sinai ini
  rationale: Mengikuti bentuk ringkas dan agak eliptis teks Ibrani serta mempertahankan kata penunjuk זֶה tanpa menambahkan kata seperti 'gunung' atau 'sendiri'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan alami bagi konstruksi kepunyaan Ibrani yang mengidentifikasi Allah sebagai Allah Israel.
theological_decisions:
- issue: Makna מִפְּנֵי dalam gambaran teofani
  choice: di hadapan Allah
  alternative: karena Allah / oleh karena kehadiran Allah
  rationale: Frasa Ibrani dapat membawa nuansa sebab maupun kehadiran. 'Di hadapan' mempertahankan keluasan itu dan tidak menjelaskan mekanisme secara berlebihan.
- issue: Konstruksi eliptis זֶה סִינַי
  choice: Sinai ini
  alternative: Sinai sendiri / Gunung Sinai
  rationale: Teks Masoret berbunyi singkat dan secara sintaksis sulit. Terjemahan mempertahankan ketegangannya tanpa memasukkan penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme serta pengulangan 'di hadapan Allah' dipertahankan. Tanda pisah menandai sisipan eliptis 'Sinai ini' sebagaimana struktur sumber.
