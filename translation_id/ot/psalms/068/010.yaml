  text: חַיָּתְ/ךָ֥ יָֽשְׁבוּ בָ֑/הּ תָּ֤כִ֥ין בְּ/טוֹבָתְ/ךָ֖ לֶ/עָנִ֣י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/010.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: id
  text: 'Makhluk-makhluk-Mu[a] menetap di sana;

    dalam kebaikan-Mu, ya Allah,

    Engkau menyediakan bagi orang miskin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani חַיָּתְךָ sulit ditafsirkan di sini; dapat juga diterjemahkan “kawanan-Mu”, “kelompok-Mu”, atau “umat-Mu”.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: Makhluk-makhluk-Mu
  rationale: חַיָּה pada dasarnya menunjuk kepada makhluk hidup atau binatang, tetapi bentuk tunggalnya di sini dapat bermakna kolektif. Pilihan ini mempertahankan keluasan makna dasar tanpa langsung menafsirkannya sebagai kawanan atau umat.
- source_word: יָשְׁבוּ בָהּ
  choice: menetap di sana
  rationale: יָשַׁב dapat berarti duduk, tinggal, atau menetap. Dalam konteks tempat kediaman yang telah disiapkan, 'menetap' paling sesuai; 'di sana' secara alami merujuk kepada tanah atau milik pusaka pada konteks sebelumnya.
- source_word: תָּכִין
  choice: Engkau menyediakan
  rationale: Bentuk Hifil dari כון berarti menyiapkan, menegakkan, atau menyediakan. Karena frasa berikutnya menyebut orang miskin sebagai penerima, 'menyediakan' menyampaikan daya idiomatisnya tanpa menentukan benda yang tidak disebutkan dalam Ibrani.
- source_word: בְּטוֹבָתְךָ
  choice: dalam kebaikan-Mu
  rationale: טוֹבָה dapat berarti kebaikan, kemurahan, atau kelimpahan. Terjemahan ini mempertahankan preposisi dan mengungkapkan kebaikan Allah sebagai lingkup atau dasar tindakan-Nya.
- source_word: לֶעָנִי
  choice: bagi orang miskin
  rationale: עָנִי dapat menunjuk kepada orang miskin, tertindas, atau sengsara. Dalam konteks penyediaan, 'orang miskin' adalah padanan langsung dan alami.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Letaknya pada akhir baris menunjukkan sapaan langsung; 'ya Allah' menyampaikan fungsi vokatif itu dalam bahasa Indonesia yang wajar dan khidmat.
theological_decisions:
- issue: Makna חַיָּתְךָ dalam konteks puisi yang sulit
  choice: Makhluk-makhluk-Mu, dipahami sebagai ungkapan kolektif yang tetap terbuka
  alternative: Kawanan-Mu; kelompok-Mu; umat-Mu
  rationale: Kata Ibraninya secara leksikal menunjuk kepada makhluk hidup atau binatang, tetapi dalam konteks ini mungkin dipakai secara kolektif bagi kelompok milik Allah yang tinggal di negeri itu. Teks utama mempertahankan makna yang luas, sedangkan catatan kaki menyajikan kemungkinan penafsiran manusiawi atau komunal tanpa menetapkannya sebagai satu-satunya arti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang sederhana dan khidmat. Pemenggalan baris mengikuti gerak paralel ayat. Akhiran hormat ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
