  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: id
  text: Sungguh, Allah akan meremukkan kepala musuh-musuh-Nya, puncak kepala yang berambut dari orang yang terus hidup dalam kesalahannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tengkorak yang berambut dari orang yang terus hidup dalam kesalahannya”; atau, “puncak kepala yang berambut dari orang yang terus berjalan dalam pelanggaran-pelanggarannya.”'
    reason: Alternatif leksikal untuk קָדְקֹד, מִתְהַלֵּךְ, dan בַּאֲשָׁמָיו.
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini menegaskan kepastian pernyataan, bukan membatasi dengan arti “hanya”; “Sungguh” alami dan kuat dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks menunjuk kepada Allah Israel.
- source_word: יִמְחַץ
  choice: akan meremukkan
  rationale: Mempertahankan gambaran penghakiman yang keras, yaitu menghancurkan dengan kekuatan.
- source_word: רֹאשׁ אֹיְבָיו
  choice: kepala musuh-musuh-Nya
  rationale: Gambaran konkret “kepala” dipertahankan; sufiks orang ketiga tunggal paling wajar merujuk kepada Allah sebagai subjek langsung.
- source_word: קָדְקֹד שֵׂעָר
  choice: ubun-ubun berambut
  rationale: קָדְקֹד menunjuk bagian atas kepala, sedangkan שֵׂעָר menerangkan bahwa bagian itu berambut; ungkapan ini mempertahankan paralelisme dan kejelasan anatominya.
- source_word: מִתְהַלֵּךְ
  choice: orang yang terus berjalan
  rationale: Partisipel Hitpael menyiratkan tindakan atau pola hidup yang berlanjut; “terus berjalan” mempertahankan metafora etis Ibrani.
- source_word: בַּאֲשָׁמָיו
  choice: dalam kesalahannya
  rationale: Nomina ini dapat menyatakan kesalahan, keadaan bersalah, atau pelanggaran. Bentuk tunggal abstrak dipertahankan tanpa memperluasnya secara pasti menjadi sejumlah perbuatan.
theological_decisions:
- issue: Rujukan sufiks pada “musuh-musuh-Nya”
  choice: Sufiks dipahami merujuk kepada Allah.
  alternative: Dapat dipahami secara lebih umum sebagai musuh raja ilahi atau umat Allah.
  rationale: Allah adalah subjek terdekat dari verba tunggal, sehingga menjadi anteseden yang paling alami tanpa mempersempit rujukan secara mesianik atau nasional.
- issue: Makna בַּאֲשָׁמָיו
  choice: “dalam kesalahannya” mempertahankan gagasan keadaan bersalah sekaligus kemungkinan perilaku yang salah.
  alternative: “dalam pelanggaran-pelanggarannya” atau “dalam perbuatan-perbuatannya yang membuatnya bersalah.”
  rationale: Leksikon dan sintaksis memungkinkan keadaan bersalah maupun tindakan culpable; terjemahan utama tidak memutuskan ambiguitas itu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “ubun-ubun berambut” sengaja mempertahankan citra puitis yang tidak biasa dalam teks Ibrani; kapitalisasi sufiks pada “-Nya” mengikuti kebiasaan ejaan religius Indonesia.
