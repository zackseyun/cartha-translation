source:
  edition: WLC
  text: וְֽ/צַדִּיקִ֗ים יִשְׂמְח֣וּ יַֽ֭עַלְצוּ לִ/פְנֵ֥י אֱלֹהִ֗ים וְ/יָשִׂ֥ישׂוּ בְ/שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/003.yaml
  text: But the righteous will be glad[a]; they will exult before God[b], and they will rejoice with gladness.
translation:
  language: id
  text: Namun, orang-orang benar akan bersukacita[a]; mereka akan beria-ria di hadapan Allah[b] dan bergembira dengan penuh sukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan orang-orang benar akan bersukacita.” Kata penghubung Ibrani dapat dipahami secara sederhana sebagai “dan”; “namun” dalam teks utama menonjolkan pertentangan dengan ayat sebelumnya.'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “di hadapan Allah”, yaitu dalam kehadiran Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: Namun, orang-orang benar
  rationale: צַדִּיקִים menunjuk kepada orang-orang yang benar. Kata penghubung וְ pada dasarnya dapat berarti “dan”, tetapi dalam konteks ini “namun” menyatakan pertentangan dengan nasib orang fasik pada ayat sebelumnya tanpa melampaui fungsi wacananya.
- source_word: יִשְׂמְחוּ
  choice: akan bersukacita
  rationale: Kata kerja שׂמח menyatakan sukacita atau kegembiraan. “Bersukacita” jelas dan wajar dalam laras mazmur serta tetap dapat dibedakan dari dua kata kerja kegembiraan berikutnya.
- source_word: יַעַלְצוּ
  choice: akan beria-ria
  rationale: Kata עלץ menggambarkan kegembiraan yang meluap-luap. “Beria-ria” mempertahankan nuansa penuh luapan dan membedakannya dari kata-kata sukacita di sekitarnya.
- source_word: לִפְנֵי אֱלֹהִים
  choice: di hadapan Allah
  rationale: Ungkapan ini secara harfiah berarti “di depan wajah/kehadiran Allah”. “Di hadapan Allah” alami dalam bahasa Indonesia dan mempertahankan gagasan berada dalam kehadiran-Nya.
- source_word: וְיָשִׂישׂוּ
  choice: dan bergembira
  rationale: Kata שׂוש menyatakan kegembiraan atau sukacita yang kuat. “Bergembira” mempertahankan unsur kegembiraan sambil menghindari pengulangan kata kerja “bersukacita”.
- source_word: בְשִׂמְחָה
  choice: dengan penuh sukacita
  rationale: Nomina שִׂמְחָה menerangkan cara atau memperkuat tindakan bergembira. “Dengan penuh sukacita” terdengar alami sekaligus mempertahankan penumpukan ungkapan kegembiraan dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis yang bermartabat dan mudah dipahami. Tiga ungkapan kegembiraan dibedakan sebagai “bersukacita”, “beria-ria”, dan “bergembira”, sementara pengulangan intensif bahasa Ibrani dipertahankan secara alami melalui “dengan penuh sukacita”.
