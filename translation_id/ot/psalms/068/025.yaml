translation:
  language: id
  text: Para penyanyi berjalan di depan, para pemain musik di belakang, di tengah para perempuan muda yang menabuh rebana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִדְּמוּ
  choice: berjalan di depan
  rationale: Bentuk Piel perfek orang ketiga jamak dari קדם menggambarkan mereka yang bergerak pada bagian depan arak-arakan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran pergerakan.
- source_word: שָׁרִים
  choice: para penyanyi
  rationale: Dalam kesejajaran dengan para pemain musik dan konteks arak-arakan, bentuk ini berasal dari שׁיר, 'bernyanyi', dan menunjuk kepada orang-orang yang bernyanyi, bukan para pemimpin.
- source_word: אַחַר
  choice: di belakang
  rationale: Kata ini menandai posisi atau urutan berikutnya dalam arak-arakan. 'Di belakang' mengungkapkan gambaran ruang secara alami.
- source_word: נֹגְנִים
  choice: para pemain musik
  rationale: Partisip dari נגן menunjuk kepada orang-orang yang memainkan alat musik. 'Pemain musik' jelas, modern, dan tidak menentukan alat musik yang tidak disebutkan.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah mereka
  rationale: Ungkapan ini mempertahankan gambaran posisi di dalam rombongan. Pronomina 'mereka' ditambahkan secara wajar untuk memperjelas kelompok yang dimaksud tanpa mengubah makna.
- source_word: עֲלָמוֹת
  choice: para perempuan muda
  rationale: Kata ini menunjuk kepada perempuan-perempuan muda, biasanya yang telah mencapai usia menikah. 'Perempuan muda' akurat dan tidak mempersempit artinya menjadi 'perawan'.
- source_word: תּוֹפֵפוֹת
  choice: yang menabuh rebana
  rationale: Bentuk ini menyatakan tindakan memainkan תֹּף, alat perkusi genggam. 'Menabuh rebana' menyampaikan tindakan perkusif dengan alami dan jelas.
