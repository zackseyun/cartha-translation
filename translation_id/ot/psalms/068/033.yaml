id: PSA.68.33
reference: Psalms 68:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָ֭/רֹכֵב בִּ/שְׁמֵ֣י שְׁמֵי קֶ֑דֶם הֵ֥ן יִתֵּ֥ן בְּ֝/קוֹל/וֹ ק֣וֹל עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/033.yaml
  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: id
  text: kepada Dia yang berkendara di langit tertinggi, yang ada sejak zaman purbakala[a]—lihatlah, Ia memperdengarkan suara-Nya,[b] suara yang penuh kuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di langit segala langit purbakala.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia mengeluarkan suara-Nya, suara kekuatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָ/רֹכֵב
  choice: kepada Dia yang berkendara
  rationale: Prefiks ל meneruskan arah perintah pada ayat sebelumnya, sedangkan partisip רֹכֵב dipakai secara substantival untuk menggambarkan Allah sebagai Dia yang berkendara.
- source_word: בִּ/שְׁמֵי שְׁמֵי
  choice: di langit tertinggi
  rationale: Rangkaian konstruksi harfiahnya berarti ‘di langit segala langit’ dan berfungsi sebagai ungkapan superlatif. ‘Langit tertinggi’ menyampaikan maksud itu secara alami dalam bahasa Indonesia.
- source_word: קֶדֶם
  choice: sejak zaman purbakala
  rationale: Dalam konteks ini kata tersebut menunjuk pada masa lampau yang sangat jauh dan menerangkan langit, bukan arah timur.
- source_word: הֵן
  choice: lihatlah
  rationale: Partikel ini menarik perhatian dengan daya puitis; ‘lihatlah’ mempertahankan fungsi tersebut dalam bahasa Indonesia modern yang bermartabat.
- source_word: יִתֵּן בְּ/קוֹל/וֹ
  choice: Ia memperdengarkan suara-Nya
  rationale: Secara harfiah ungkapan ini memakai verba ‘memberi’, tetapi bersama ‘suara’ maknanya ialah mengeluarkan atau memperdengarkan suara.
- source_word: קוֹל עֹז
  choice: suara yang penuh kuasa
  rationale: Frasa konstruksi ini secara harfiah berarti ‘suara kekuatan’. Pilihan ini alami sekaligus mempertahankan penekanan pada daya atau kuasa suara itu.
theological_decisions:
- issue: Rujukan Dia yang berkendara
  choice: Dipahami sebagai Allah Israel sesuai konteks langsung, tanpa mempersempitnya menjadi rujukan kristologis atau malaikat.
  alternative: Pembacaan tipologis kemudian dapat menghubungkan gambaran pengendara ilahi dengan Mesias.
  rationale: Teks Ibrani dan konteks mazmur menggambarkan Allah dalam citra puitis yang luhur; terjemahan tidak seharusnya memasukkan identifikasi teologis yang lebih khusus ke dalam teks utama.
translation_notes:
  register: Bahasa puitis, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum bahasa Indonesia. Tanda pisah mempertahankan peralihan tegas yang ditandai oleh הֵן.
