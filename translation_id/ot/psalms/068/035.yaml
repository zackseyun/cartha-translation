  variant: modern standard Indonesian
source:
  edition: WLC
  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: id
  text: Allah dahsyat dari tempat-tempat kudus-Mu[a]; Allah Israel—Dialah yang memberikan kekuatan dan keperkasaan kepada umat. Terpujilah Allah!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari tempat kudus-Mu” atau “di tempat kudus-Mu.” Teks Ibrani berbunyi “dari tempat-tempat kudus-Mu,” suatu bentuk jamak yang dapat menunjuk pada kediaman kudus Allah dalam arti kolektif atau sebagai ungkapan kebesaran.
    reason: alternative_reading
lexical_decisions:
- source_word: נ֤וֹרָ֥א
  choice: dahsyat
  rationale: Kata ini menyatakan bahwa Allah membangkitkan rasa takjub sekaligus gentar. “Dahsyat” alami dalam bahasa Indonesia dan mempertahankan kedua nuansa tersebut.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk jamak Ibrani ini di sini menunjuk kepada satu-satunya Allah Israel dan diterjemahkan dengan bentuk tunggal yang lazim dalam bahasa Indonesia.
- source_word: מִֽמִּקְדָּ֫שֶׁ֥יךָ
  choice: dari tempat-tempat kudus-Mu
  rationale: Bentuk Ibraninya secara morfologis jamak, memakai akhiran orang kedua tunggal maskulin, dan didahului preposisi “dari”. Terjemahan utama mempertahankan bentuk jamak dan preposisi tersebut.
- source_word: אֵ֤ל יִשְׂרָאֵ֗ל
  choice: Allah Israel
  rationale: Frasa nominal ini mengidentifikasi Allah yang baru disebut sebagai Allah Israel. Bentuk “Allah Israel” ringkas, wajar, dan bermartabat dalam bahasa Indonesia Alkitabiah modern.
- source_word: ה֤וּא
  choice: Dialah
  rationale: Pronomina eksplisit ini bersifat menegaskan. “Dialah” mempertahankan penekanan itu secara alami.
- source_word: נֹתֵ֨ן
  choice: memberikan
  rationale: Partisipel ini menyatakan tindakan yang menjadi ciri khas atau berlangsung secara umum; bentuk kini generik “memberikan” menyampaikannya dengan baik.
- source_word: עֹ֖ז
  choice: kekuatan
  rationale: Makna lazim kata ini ialah kekuatan atau daya. “Kekuatan” jelas dan dapat dibedakan dari istilah berikutnya.
- source_word: וְתַעֲצֻמ֥וֹת
  choice: dan keperkasaan
  rationale: Kata ini menunjuk pada daya atau kuasa yang besar. “Keperkasaan” mempertahankan intensitasnya sekaligus menghindari pengulangan kata “kekuatan”.
- source_word: לָעָ֗ם
  choice: kepada umat itu
  rationale: Teks Ibrani menyebut “kepada umat/bangsa itu” tanpa pronomina kepunyaan. Terjemahan ini mempertahankan ketakrifannya tanpa menambahkan “umat-Nya”.
- source_word: בָּר֥וּךְ
  choice: Terpujilah
  rationale: Dalam rumusan doksologis ini, “Terpujilah Allah!” merupakan ungkapan Indonesia yang alami dan mempertahankan seruan berkat serta pujian.
theological_decisions:
- issue: Jumlah dan makna “tempat-tempat kudus”
  choice: dari tempat-tempat kudus-Mu
  alternative: dari tempat kudus-Mu; di tempat kudus-Mu
  rationale: Bentuk Ibrani secara morfologis jamak dan memakai akhiran orang kedua tunggal. Teks utama mempertahankan bentuk jamak serta arti dasar preposisi “dari”; kemungkinan bahwa bentuk jamak itu bermakna kolektif atau agung, atau bahwa preposisinya dipahami lebih longgar, dicatat tanpa memaksakan salah satu tafsiran.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada puitis dan doksologis yang bermartabat. Susunan klausa mempertahankan penegasan teks Ibrani, sedangkan istilah-istilahnya tetap mudah dipahami pembaca umum.
