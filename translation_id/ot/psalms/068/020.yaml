  text: God is to us a God of salvations[b][a], and to the Lord GOD belong escapes from death.
translation:
  language: id
  text: Allah bagi kita adalah Allah yang memberi berbagai kelepasan[a]; Tuhan Yahweh memiliki berbagai jalan keluar dari maut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “penyelamatan-penyelamatan”; bentuk jamak Ibrani dapat menekankan tindakan penyelamatan yang berulang atau beraneka ragam.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tempat-tempat keluar” atau “jalan-jalan keluar”; dalam konteks ini maksudnya ialah jalan untuk luput dari maut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Allah
  rationale: Bentuk dengan kata sandang menunjuk secara khusus kepada Allah. Dalam bahasa Indonesia, nama sebutan “Allah” tidak memerlukan kata sandang.
- source_word: לָנוּ
  choice: bagi kita
  rationale: Preposisi ל menyatakan hubungan sekaligus manfaat; “bagi kita” alami dalam bahasa Indonesia dan mempertahankan nuansa bahwa Allah bertindak demi umat-Nya.
- source_word: אֵל
  choice: Allah
  rationale: Pengulangan sebutan ilahi dipertahankan dalam konstruksi predikatif, “Allah bagi kita adalah Allah ...,” untuk mencerminkan penekanan teks Ibrani.
- source_word: לְמוֹשָׁעוֹת
  choice: yang memberikan berbagai penyelamatan
  rationale: Bentuk jamak מוֹשָׁעוֹת dipertahankan melalui “berbagai,” yang menyampaikan tindakan penyelamatan yang berulang atau beraneka ragam tanpa mengubahnya menjadi gagasan abstrak tunggal.
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: Tuhan Yahweh memiliki
  rationale: Konstruksi dengan ל menyatakan kepemilikan. “Tuhan” mewakili אֲדֹנָי dan “Yahweh” mempertahankan nama perjanjian יהוה; susunan Indonesia dibuat alami.
- source_word: לַמָּוֶת
  choice: dari maut
  rationale: Walaupun preposisinya secara harfiah berarti “kepada/untuk,” bersama תּוֹצָאוֹת ungkapan ini menunjuk pada jalan keluar dari maut.
- source_word: תּוֹצָאוֹת
  choice: jalan-jalan keluar
  rationale: Pilihan ini mempertahankan gambaran dasar dan bentuk jamak kata Ibrani, serta tetap dapat dipahami sebagai sarana untuk luput dari maut.
theological_decisions:
- issue: Penerjemahan יהוה bersama אֲדֹנָי
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH
  rationale: “Yahweh” mempertahankan nama ilahi yang terdapat langsung dalam teks, sedangkan “Tuhan” mewakili אֲדֹנָי. Keduanya dipertahankan tanpa meleburkan salah satunya.
- issue: Makna bentuk jamak מוֹשָׁעוֹת
  choice: berbagai penyelamatan
  alternative: keselamatan
  rationale: Bentuk jamak dapat menunjuk pada tindakan-tindakan penyelamatan yang berulang atau beraneka ragam. Terjemahan tidak membatasinya pada satu skema teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “Allah” serta bentuk jamak pada kedua bagian dipertahankan, sementara susunan klausa kepemilikan disesuaikan agar alami bagi pembaca Indonesia.
