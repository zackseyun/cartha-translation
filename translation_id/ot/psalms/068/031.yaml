  text: יֶאֱתָ֣יוּ חַ֭שְׁמַנִּים מִנִּ֣י מִצְרָ֑יִם כּ֥וּשׁ תָּרִ֥יץ יָ֝דָ֗י/ו לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/031.yaml
  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: id
  text: Para bangsawan[a] akan datang dari Mesir; Kus akan segera mengulurkan tangannya kepada Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "para utusan" atau "para pangeran". Istilah Ibrani ini langka dan tampaknya menunjuk kepada orang-orang terkemuka dari Mesir.
    reason: lexical_alternative
  - marker: b
    text: Kus dipersonifikasikan sebagai satu bangsa; karena itu, teks Ibrani memakai bentuk tunggal, "tangannya".
    reason: grammatical_clarification
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: akan datang
  rationale: Bentuk imperfek Qal orang ketiga jamak dari אתה/אתי paling wajar menyatakan kedatangan. Terjemahan ini tidak menambahkan gagasan membawa upeti yang tidak dinyatakan langsung oleh verba.
- source_word: חַשְׁמַנִּים
  choice: para bangsawan
  rationale: Nomina langka ini dalam konteks menunjuk kepada orang-orang terkemuka. 'Para bangsawan' mempertahankan status tinggi mereka tanpa mempersempit peran mereka menjadi utusan atau pejabat tertentu.
- source_word: מִנִּי מִצְרָיִם
  choice: dari Mesir
  rationale: Preposisi dan nama tempat menyatakan asal secara langsung; 'dari Mesir' alami dalam bahasa Indonesia modern.
- source_word: כּוּשׁ
  choice: Kus
  rationale: Nama wilayah Ibrani ditransliterasikan sebagai 'Kus', bukan diganti dengan padanan geografis yang lebih kemudian seperti Etiopia.
- source_word: תָּרִיץ
  choice: akan segera mengulurkan
  rationale: Bentuk Hifil dari רוץ membawa nuansa bergegas atau cepat. Bersama objek 'tangan', ungkapan ini secara idiomatis berarti segera mengulurkan tangan.
- source_word: יָדָיו
  choice: tangannya
  rationale: Sufiksnya maskulin tunggal, selaras dengan Kus sebagai nama bangsa yang dipersonifikasikan. Bentuk '-nya' mempertahankan ketunggalan tanpa menetapkan gender.
- source_word: לֵאלֹהִים
  choice: kepada Allah
  rationale: Preposisi ל menyatakan arah gerak tangan kepada Allah. 'Kepada Allah' merupakan ungkapan Indonesia yang alami dan tidak menentukan apakah gerak itu terutama doa, penyembahan, atau penyerahan diri.
theological_decisions:
- issue: Makna Kus mengulurkan tangan kepada Allah
  choice: Mempertahankan tindakan sebagai gerak yang diarahkan kepada Allah tanpa menetapkannya secara khusus sebagai doa, penyembahan, penyerahan politik, atau pertobatan.
  alternative: Menafsirkannya secara khusus sebagai membawa upeti, takluk secara politik, atau masuk penuh ke dalam perjanjian.
  rationale: Ungkapan mengulurkan tangan kepada Allah dapat menyiratkan permohonan, doa, penyembahan, atau penyerahan diri. Teks tidak menentukan satu makna saja, sehingga keterbukaan teologisnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan paralel puisi dipertahankan. Nama Kus mengikuti bentuk nama Alkitab yang dekat dengan toponim Ibrani.
