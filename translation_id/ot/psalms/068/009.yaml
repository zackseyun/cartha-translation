  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
translation:
  language: id
  text: Hujan yang melimpah[a] Kaucurahkan, ya Allah; ketika milik pusaka-Mu letih[b], Engkau meneguhkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hujan kemurahan” atau “hujan yang berlimpah”; ungkapan Ibrani ini menekankan pemberian Allah yang murah hati dan berlimpah.
    reason: lexical_alternative
  - marker: b
    text: “Milik pusaka-Mu” dapat merujuk pada umat Allah, negeri yang diberikan-Nya, atau keduanya dalam ungkapan puitis.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: hujan yang melimpah
  rationale: Secara harfiah ungkapan ini menggabungkan ‘hujan’ dengan kata yang berkaitan dengan kerelaan atau kemurahan. Dalam konteks ini, ungkapan tersebut menggambarkan hujan sebagai pemberian Allah yang limpah dan murah hati.
- source_word: תָּנִיף
  choice: Kaucurahkan
  rationale: Bentuk kausatif dari נוּף pada dasarnya dapat berarti mengayunkan atau mengguncangkan. Bersama kata ‘hujan’, maknanya ialah Allah membuat hujan turun; ‘Kaucurahkan’ menyampaikan gambaran itu secara alami dan puitis.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung. ‘Ya Allah’ mempertahankan bentuk vokatif dengan register doa yang wajar dalam bahasa Indonesia.
- source_word: נַחֲלָתְךָ
  choice: milik pusaka-Mu
  rationale: Istilah ini dapat menunjuk kepada milik yang dianugerahkan atau diwariskan, dan secara puitis dapat merujuk pada umat Allah, negeri mereka, atau keduanya. ‘Milik pusaka-Mu’ mempertahankan keluasan rujukan itu.
- source_word: וְנִלְאָה
  choice: ketika ... letih
  rationale: Bentuk feminin tunggal ini selaras dengan ‘milik pusaka’ dan menyatakan keadaan lelah, lesu, atau merana. Hubungan temporal ‘ketika’ membuat urutan Ibrani alami dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: כּוֹנַנְתָּהּ
  choice: Engkau meneguhkannya
  rationale: Verba ini berarti menjadikan kukuh, menata, atau menetapkan. ‘Meneguhkannya’ dapat berlaku baik bagi negeri yang dipulihkan maupun umat yang dikuatkan.
theological_decisions:
- issue: Rujukan ‘milik pusaka-Mu’
  choice: Dibiarkan sebagai ‘milik pusaka-Mu’ tanpa menentukan negeri atau umat
  alternative: ‘negeri-Mu’ atau ‘umat-Mu’
  rationale: Bahasa Ibrani memungkinkan ungkapan perjanjian yang mencakup umat Israel, negeri Israel, atau keduanya dalam kepadatan bahasa puisi. Terjemahan tidak mempersempit ketaksaan yang memang ada.
translation_notes:
  register: Bahasa puitis yang khidmat tetapi tetap modern. Bentuk terikat ‘Kau-’ dan akhiran hormat ‘-Mu’ mempertahankan sapaan langsung kepada Allah. Susunan klausa dijaga ringkas agar irama paralel ayat tetap terasa.
