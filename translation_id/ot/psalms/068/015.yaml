  text: A mountain of God is the mountain of Bashan[b][a]; a mountain of peaks is the mountain of Bashan.
translation:
  language: id
  text: Gunung Allah[a] ialah Gunung Basan; gunung berpuncak-puncak[b] ialah Gunung Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung yang perkasa” atau “gunung yang megah”; ungkapan Ibrani “Gunung Allah” mungkin berfungsi sebagai bentuk superlatif.
    reason: alternative_reading
  - marker: b
    text: Istilah Ibrani yang langka dan diterjemahkan “berpuncak-puncak” juga dapat menggambarkan gunung yang terjal atau berpunuk-punuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: gunung
  rationale: Makna lazim kata ini adalah 'gunung'. Pengulangannya dipertahankan untuk menjaga struktur puitis dan penekanan dalam bahasa Ibrani.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam rangkaian הַר אֱלֹהִים, terjemahan paling langsung adalah 'Gunung Allah'. Kemungkinan fungsinya sebagai ungkapan superlatif dicatat dalam catatan kaki.
- source_word: בָּשָׁן
  choice: Basan
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: גַּבְנֻנִּים
  choice: berpuncak-puncak
  rationale: Istilah jamak yang langka ini tampaknya menggambarkan bentuk gunung dengan sejumlah puncak atau tonjolan. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan gambaran topografisnya.
theological_decisions:
- issue: Apakah הַר אֱלֹהִים diterjemahkan secara harfiah atau sebagai ungkapan superlatif
  choice: Gunung Allah
  alternative: gunung yang perkasa; gunung yang megah
  rationale: Bentuk konstruksi Ibraninya secara langsung berarti 'Gunung Allah' dan mengandung daya puitis-teologis. Kemungkinan makna idiomatisnya tidak disingkirkan, tetapi disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat. Struktur paralel serta pengulangan 'Gunung Basan' dipertahankan. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
