  text: לָ֤/מָּה תְּֽרַצְּדוּ/ן֮ הָרִ֪ים גַּבְנֻ֫נִּ֥ים הָ/הָ֗ר חָמַ֣ד אֱלֹהִ֣ים לְ/שִׁבְתּ֑/וֹ אַף יְ֝הוָ֗ה יִשְׁכֹּ֥ן לָ/נֶֽצַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: id
  text: Mengapa kalian memandang dengan iri[a] pada gunung yang banyak puncaknya, hai gunung-gunung? Gunung itu diinginkan Allah untuk menjadi tempat kediaman-Nya. Sungguh, Yahweh akan berdiam di sana selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa kalian melonjak-lonjak, hai gunung-gunung yang banyak puncaknya?” Kata kerja Ibrani ini langka dan maknanya tidak pasti; kata itu mungkin menggambarkan gerakan melonjak-lonjak, atau memandang dengan iri maupun memandang serong.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: memandang dengan iri
  rationale: Kata kerja Ibrani ini langka dan maknanya tidak pasti. Dalam konteks perbandingan dengan gunung yang dikehendaki Allah, ungkapan ini secara wajar menyampaikan sikap iri atau memandang serong. Kemungkinan makna gerak, seperti melonjak-lonjak, dicatat dalam catatan kaki.
- source_word: הָרִים גַּבְנֻנִּים
  choice: gunung-gunung berpuncak banyak
  rationale: Ungkapan ini tampaknya menggambarkan gunung-gunung dengan banyak puncak, punggung, atau tonjolan. Pilihan ini mempertahankan citra fisiknya tanpa menyederhanakannya menjadi sekadar gunung-gunung tinggi.
- source_word: הָהָר
  choice: gunung
  rationale: Teks menyebut suatu gunung tertentu dengan kata benda umum berartikel, bukan nama Sion secara eksplisit. Kekhususannya tersampaikan melalui konteks dan klausa penjelas.
- source_word: חָמַד
  choice: diinginkan
  rationale: Kata ini menyatakan keinginan atau kesukaan. 'Diinginkan' dekat dengan bentuk Ibrani dan tidak menggantinya dengan implikasi yang lebih interpretatif, seperti 'dipilih'.
- source_word: לְשִׁבְתּוֹ
  choice: sebagai kediaman-Nya
  rationale: Bentuk ini menyatakan tujuan atau fungsi gunung tersebut sebagai tempat Allah berdiam. Ungkapan Indonesia ini ringkas dan alami.
- source_word: אַף
  choice: Sungguh
  rationale: Di sini kata tersebut menegaskan pernyataan berikutnya, bukan terutama menambahkan unsur baru.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: akan berdiam di sana untuk selama-lamanya
  rationale: Kata kerja menyatakan menetap atau berdiam. 'Di sana' tersirat jelas dari gunung yang baru disebut, sedangkan frasa terakhir menyatakan kelangsungan tanpa akhir.
theological_decisions:
- issue: Apakah gunung itu harus disebut Sion secara eksplisit
  choice: Mempertahankan sebutan umum 'gunung' dalam teks utama
  alternative: Menerjemahkannya secara interpretatif sebagai 'Gunung Sion'
  rationale: Konteks mazmur menunjuk kepada Sion, tetapi ayat ini sendiri memakai kata benda umum, bukan nama tempat. Terjemahan tidak menambahkan kekhususan yang tidak dinyatakan langsung.
- issue: Cara menyampaikan pertentangan antara gunung-gunung lain dan gunung yang dikehendaki Allah
  choice: Memakai 'memandang dengan iri' sambil menandai ketidakpastian leksikal
  alternative: Memakai gambaran gerak seperti 'melonjak-lonjak' atau 'melompat-lompat'
  rationale: Makna kata kerjanya sungguh tidak pasti. Bacaan yang menyatakan tatapan iri cocok dengan pertanyaan retoris dan pertentangan dalam konteks, tetapi kemungkinan gambaran gerak tetap disajikan dalam catatan kaki agar ambiguitas tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Sapaan 'hai' mempertahankan personifikasi gunung-gunung, sedangkan 'kalian' memperjelas bahwa yang disapa berbentuk jamak. Kapital pada akhiran pronominal dalam 'kediaman-Nya' mengikuti kebiasaan penulisan religius Indonesia.
