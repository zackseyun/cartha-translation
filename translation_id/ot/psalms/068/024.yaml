  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: id
  text: Mereka telah melihat perarakan-Mu, ya Allah—perarakan Allahku, Rajaku, di tempat kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka telah melihat langkah-langkah-Mu, ya Allah—langkah-langkah Allahku, Rajaku, di tempat kudus.” Frasa terakhir juga dapat berarti “dalam kekudusan.”'
    reason: Memberi alternatif leksikal yang lebih umum untuk הֲלִיכוֹת serta mempertahankan ambiguitas lokatif/abstrak pada בַּקֹּדֶשׁ.
lexical_decisions:
- source_word: רָאוּ
  choice: Mereka telah melihat
  rationale: Bentuk Qal perfekt orang ketiga jamak menyatakan tindakan yang telah terjadi dan disaksikan; 'telah melihat' mempertahankan aspek selesai secara wajar dalam bahasa Indonesia.
- source_word: הֲלִיכוֹתֶיךָ / הֲלִיכוֹת
  choice: perarakan-perarakan-Mu / perarakan-perarakan
  rationale: Nomina jamak dari הלך dapat berarti gerak maju, perjalanan, atau perarakan. Konteks perayaan dan ibadah mendukung 'perarakan'; bentuk ulang mempertahankan jamak Ibrani dan pengulangan puitisnya.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Konteks menunjukkan sapaan langsung. Partikel 'ya' menyatakan vokatif secara alami dan khidmat.
- source_word: אֵלִי
  choice: Allahku
  rationale: 'Bentuk dengan sufiks orang pertama tunggal menyatakan kepunyaan: ''Allahku''.'
- source_word: מַלְכִּי
  choice: Rajaku
  rationale: Gelar kerajaan bagi Allah dengan sufiks orang pertama tunggal diterjemahkan langsung sebagai 'Rajaku'.
- source_word: בַקֹּדֶשׁ
  choice: menuju tempat kudus
  rationale: Secara harfiah frasa ini dapat berarti 'di dalam tempat kudus' atau 'dalam kekudusan'. Dalam konteks gerak perarakan, 'menuju tempat kudus' menyampaikan arah yang tersirat, sementara alternatif literal dicatat dalam catatan kaki.
theological_decisions:
- issue: Acuan perarakan
  choice: Ayat ini menggambarkan perarakan Allah menuju tempat kudus.
  alternative: Ungkapan itu dapat mengacu secara lebih umum pada langkah-langkah atau tindakan Allah yang terlihat, atau pada gerak-Nya 'dalam kekudusan'.
  rationale: Pengulangan הֲלִיכוֹת, sapaan kepada Allah, dan penutup בַקֹּדֶשׁ bersama-sama mendukung gambaran liturgis berupa perarakan, tetapi bahasa sumber tidak menetapkan rincian historis dan tetap memungkinkan pembacaan yang lebih umum.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. Pengulangan istilah dipertahankan untuk mencerminkan paralelisme Ibrani; 'ya Allah' memberi bentuk sapaan yang alami.
