  text: יָק֣וּם אֱ֭לֹהִים יָפ֣וּצוּ אוֹיְבָ֑י/ו וְ/יָנ֥וּסוּ מְ֝שַׂנְאָ֗י/ו מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/001.yaml
  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: id
  text: Allah bangkit; musuh-musuh-Nya tercerai-berai,[a] dan orang-orang yang membenci-Nya melarikan diri dari hadapan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut terjemahan optatif tradisional: “Kiranya Allah bangkit; kiranya musuh-musuh-Nya tercerai-berai, dan kiranya orang-orang yang membenci-Nya melarikan diri dari hadapan-Nya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יָקוּם
  choice: bangkit
  rationale: Bentuk Qal imperfek orang ketiga tunggal dari קום. Dalam puisi, bentuk ini dapat menyatakan gambaran deklaratif yang hidup atau nuansa harapan/jusif. “Bangkit” mempertahankan citra verba tanpa memaksakan salah satu nuansa.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal menunjukkan bahwa yang dimaksud ialah Allah Israel; dalam bahasa Indonesia nama ilahi yang wajar ialah “Allah”.
- source_word: יָפוּצוּ
  choice: tercerai-berai
  rationale: Qal imperfek jamak dari פוץ, yang menggambarkan musuh-musuh menjadi terserak atau terpencar. “Tercerai-berai” alami dalam konteks kekalahan pasukan dan mempertahankan gambaran puitisnya.
- source_word: אֹיְבָיו
  choice: musuh-musuh-Nya
  rationale: Bentuk konstruksi dengan sufiks orang ketiga tunggal; diterjemahkan langsung sebagai milik Allah.
- source_word: וְיָנוּסוּ
  choice: dan ... melarikan diri
  rationale: Qal imperfek jamak dari נוס. “Melarikan diri” menyampaikan tindakan kabur dari ancaman secara jelas dan wajar dalam bahasa Indonesia.
- source_word: מְשַׂנְאָיו
  choice: orang-orang yang membenci-Nya
  rationale: Partisipel yang berfungsi substantival dengan sufiks orang ketiga tunggal. Terjemahan ini mempertahankan daya verbal aktif “membenci”, bukan sekadar menyamakannya dengan musuh.
- source_word: מִפָּנָיו
  choice: dari hadapan-Nya
  rationale: Secara harfiah berarti “dari wajah/hadapan-Nya”. Ungkapan “dari hadapan-Nya” mempertahankan idiom Ibrani sekaligus menyatakan gerak menjauh dari kehadiran Allah.
theological_decisions:
- issue: Daya verbal bentuk-bentuk imperfek pembuka dalam konteks puisi dan penampakan ilahi sebagai pejuang
  choice: 'Gaya deklaratif yang hidup: “Allah bangkit; musuh-musuh-Nya tercerai-berai ...”'
  alternative: 'Gaya jusif/doa: “Kiranya Allah bangkit; kiranya musuh-musuh-Nya tercerai-berai, dan kiranya orang-orang yang membenci-Nya melarikan diri dari hadapan-Nya.”'
  rationale: Bentuk imperfek Ibrani dapat dipahami sebagai pernyataan yang hidup ataupun sebagai harapan/doa. Teks utama memakai pembacaan deklaratif tanpa menghapus pembacaan tradisional yang optatif, yang dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk “-Nya” memakai huruf kapital karena merujuk kepada Allah. Tanda titik koma mempertahankan hubungan erat antara tindakan Allah dan tercerai-berainya para musuh.
