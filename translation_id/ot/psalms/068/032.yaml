  yaml_path: translation/ot/psalms/068/032.yaml
  text: Kingdoms of the earth[a], sing to God; sing praises to the Lord—Selah
translation:
  language: id
  text: Hai kerajaan-kerajaan di bumi, bernyanyilah bagi Allah; bermazmurlah[a] bagi Tuhan—Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mainkanlah musik bagi Tuhan.”'
    reason: Alternatif leksikal untuk זַמְּרוּ, yang dapat mencakup memainkan musik maupun melantunkan pujian.
lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: kerajaan-kerajaan di bumi
  rationale: Frasa ini menunjuk kepada berbagai wilayah atau bangsa berdaulat di seluruh bumi. Bentuk jamak dan cakupan universalnya dipertahankan.
- source_word: שִׁירוּ
  choice: bernyanyilah
  rationale: Imperatif jamak ini merupakan seruan langsung kepada kerajaan-kerajaan agar menyanyi bagi Allah.
- source_word: לֵאלֹהִים
  choice: bagi Allah
  rationale: Preposisi ל menandai pihak yang menjadi tujuan nyanyian. 'Bagi Allah' alami dalam bahasa Indonesia dan mempertahankan arah pujian tersebut.
- source_word: זַמְּרוּ
  choice: bermazmurlah
  rationale: Bentuk piel imperatif dari זמר menyatakan pujian yang dinyanyikan atau diiringi musik. 'Bermazmurlah' mempertahankan nuansa ibadah dan musikalnya, sementara kemungkinan 'mainkanlah musik' dicatat dalam catatan kaki.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Ini adalah gelar ilahi אֲדֹנָי, bukan nama perjanjian יהוה. Karena itu diterjemahkan sebagai 'Tuhan', bukan bentuk khusus yang digunakan untuk YHWH.
- source_word: סֶלָה
  choice: Sela
  rationale: Makna tepat istilah liturgis atau musikal ini tidak pasti. Transliterasi mempertahankan penanda dalam teks tanpa menafsirkannya secara berlebihan.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Ibrani memakai אֲדֹנָי, bukan יהוה. Pembedaan ini dipertahankan dengan memakai 'Tuhan' dan tidak memakai bentuk yang dikhususkan bagi nama ilahi YHWH.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel vokatif 'Hai' memperjelas bahwa kerajaan-kerajaan disapa langsung. Tanda pisah sebelum 'Sela' mempertahankan jeda liturgis tanpa menentukan maknanya.
