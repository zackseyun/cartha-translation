id: PSA.68.30
reference: Psalms 68:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: id
  text: Hardiklah binatang di antara gelagah[a], kawanan lembu jantan di antara anak-anak lembu dari bangsa-bangsa, yang menginjak-injak kepingan-kepingan perak[b]. Cerai-beraikanlah bangsa-bangsa yang menyukai peperangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “binatang liar di antara gelagah”; mungkin merupakan gambaran kiasan tentang Mesir atau kuasa lain yang memusuhi.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani untuk klausa ini sulit. Klausa ini juga dapat berarti “yang menundukkan diri dengan kepingan-kepingan perak” atau “yang bersujud dengan batangan perak,” yakni dengan mempersembahkan upeti.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּעַר
  choice: Hardiklah
  rationale: Imperatif ini menyatakan teguran ilahi yang keras dan menundukkan. 'Hardiklah' lebih kuat dan alami daripada 'tegur' dalam konteks kuasa-kuasa yang memusuhi.
- source_word: חַיַּת קָנֶה
  choice: binatang dari antara gelagah
  rationale: Mempertahankan citra harfiah binatang yang menghuni kawasan bergelagah tanpa menetapkannya sebagai hewan atau kerajaan tertentu.
- source_word: עֲדַת אַבִּירִים
  choice: kawanan lembu jantan
  rationale: Dalam rangkaian citra binatang, אַבִּירִים paling wajar dipahami sebagai lembu-lembu jantan yang kuat, dan עֲדַת sebagai kelompok atau kawanan.
- source_word: בְּעֶגְלֵי עַמִּים
  choice: di antara anak-anak lembu bangsa-bangsa
  rationale: Preposisi dipahami secara lokatif/asosiatif; terjemahan ini mempertahankan kesinambungan metafora kawanan ternak dan bentuk jamak עַמִּים.
- source_word: מִתְרַפֵּס בְּרַצֵּי כָסֶף
  choice: yang menginjak-injak kepingan-kepingan perak
  rationale: Klausa Ibrani ini sulit. Bacaan tindakan bermusuhan dipakai dalam teks utama karena sesuai dengan citra kekerasan dan penutup ayat, sementara bacaan ketundukan atau upeti dicatat dalam catatan kaki.
- source_word: בִּזַּר
  choice: Cerai-beraikanlah
  rationale: Walau bentuknya secara morfologis perfektif, dalam puisi ini paling masuk akal sebagai permohonan yang melanjutkan imperatif pembuka.
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: yang menyukai peperangan
  rationale: Mengungkapkan kegemaran atau hasrat yang terus-menerus terhadap pertempuran dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Identitas 'binatang dari antara gelagah'
  choice: Metafora dipertahankan tanpa menyebut Mesir atau kuasa tertentu dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai Mesir atau sebagai kerajaan musuh tertentu.
  rationale: Latar gelagah mungkin mengisyaratkan Mesir, tetapi ayat Ibrani sendiri tidak menyebutkannya. Terjemahan tidak boleh membuat identifikasi historis itu lebih pasti daripada sumber.
- issue: Makna מִתְרַפֵּס dan hubungannya dengan perak
  choice: 'Teks utama memakai gambaran tindakan bermusuhan: ''menginjak-injak kepingan-kepingan perak''.'
  alternative: Memahami frasa itu sebagai merendahkan diri, tunduk, atau mempersembahkan upeti perak.
  rationale: Bentuk dan frasa ini sangat tidak pasti. Konteks musuh yang menyukai perang mendukung bacaan tindakan keras, tetapi bacaan ketundukan/upeti merupakan alternatif penting dan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis-luhur. Citra binatang dipertahankan, sedangkan ketidakpastian leksikal pada klausa tentang perak dijelaskan tanpa menghilangkan alur permohonan.
