id: PSA.68.14
reference: Psalms 68:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/פָ֘רֵ֤שׂ שַׁדַּ֓י מְלָ֘כִ֤ים בָּ֗/הּ תַּשְׁלֵ֥ג בְּ/צַלְמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: id
  text: Ketika Yang Mahakuasa mencerai-beraikan raja-raja di sana, turunlah salju di Zalmon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat Ibrani ini sulit ditafsirkan. Zalmon mungkin nama gunung atau tempat; namanya juga berkaitan dengan kata yang berarti “gelap”. Ungkapan “turunlah salju” dapat pula dipahami sebagai gambaran puitis.
    reason: Menandai ketidakpastian nyata mengenai nama tempat dan fungsi gambaran salju tanpa membebani teks utama.
lexical_decisions:
- source_word: בְּפָרֵשׂ
  choice: Ketika ... mencerai-beraikan
  rationale: Infinitif berpreposisi בְּ paling wajar menyatakan waktu, sedangkan פרשׂ dalam konteks ini berarti menyebarkan atau mencerai-beraikan.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Padanan gelar ilahi Shaddai yang lazim, bermartabat, dan tidak menambahkan nama diri yang tidak ada dalam teks.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Padanan langsung bentuk jamak Ibrani.
- source_word: בָּהּ
  choice: di sana
  rationale: Pronomina feminin tunggal secara harfiah berarti 'di dalamnya/di sana'; acuannya tidak dinyatakan dalam ayat ini, sehingga terjemahan mempertahankan ketidakjelasan konteks tanpa memaksakan anteseden.
- source_word: תַּשְׁלֵג
  choice: turunlah salju
  rationale: Bentuk verbalnya secara harfiah berkaitan dengan turunnya salju. Susunan impersonal ini alami dalam bahasa Indonesia dan tidak menetapkan subjek yang tidak eksplisit.
- source_word: בְּצַלְמוֹן
  choice: di Zalmon
  rationale: Diperlakukan sebagai nama tempat sesuai konteks dan tradisi terjemahan; kemungkinan makna leksikal nama itu dicatat dalam catatan kaki.
theological_decisions:
- issue: Subjek tindakan תַּשְׁלֵג
  choice: 'Diterjemahkan secara impersonal: ''turunlah salju'''
  alternative: '''Engkau membuat salju turun'' atau ''Yang Mahakuasa membuatnya seperti salju'''
  rationale: Teks Masoret memiliki bentuk orang kedua feminin tunggal yang sulit dan dapat dipahami melalui pemakaian impersonal/arkais atau sebagai ujaran kepada suatu entitas feminin. Terjemahan impersonal menjaga gambaran salju tanpa menambahkan pelaku teologis yang tidak pasti.
- issue: Makna gambaran salju di Zalmon
  choice: Dipertahankan sebagai pernyataan konkret dan puitis
  alternative: Ditafsirkan sebagai tulang-belulang, jarahan, atau raja-raja yang menjadi putih seperti salju
  rationale: Ayat Ibrani sangat padat dan tidak menjelaskan hubungan metaforisnya; terjemahan tidak boleh memilih salah satu tafsiran khusus secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Inversi 'turunlah salju' mempertahankan nuansa puitis mazmur, sedangkan 'mencerai-beraikan' menyampaikan tindakan kuat terhadap para raja.
