  text: אֱלֹהִ֤ים מ֘וֹשִׁ֤יב יְחִידִ֨ים בַּ֗יְתָ/ה מוֹצִ֣יא אֲ֭סִירִים בַּ/כּוֹשָׁר֑וֹת אַ֥ךְ ס֝וֹרֲרִ֗ים שָׁכְנ֥וּ צְחִיחָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/006.yaml
  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: id
  text: Allah menempatkan orang-orang yang seorang diri dalam sebuah rumah; Ia membawa para tahanan keluar ke keadaan sejahtera[a], tetapi orang-orang yang memberontak tinggal di tanah yang gersang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "ke dalam kelimpahan." Istilah Ibrani yang langka ini juga dipahami oleh sebagian orang sebagai "dengan nyanyian" atau sebagai ungkapan lain tentang pembebasan yang penuh sukacita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Sebutan umum bagi Allah Israel dalam konteks ini; bentuk-bentuk partisip sesudahnya menuntut pengertian tunggal.
- source_word: מוֹשִׁיב
  choice: menempatkan ... dalam sebuah rumah
  rationale: Bentuk Hifil dari ישׁב menyatakan tindakan menyebabkan seseorang tinggal atau menetap; 'menempatkan' mempertahankan nuansa kausatif secara wajar dalam bahasa Indonesia.
- source_word: יְחִידִים
  choice: orang-orang yang hidup seorang diri
  rationale: Kata ini menunjuk kepada orang yang sendirian atau terasing. Pilihan ini mempertahankan cakupan makna sumber tanpa membatasinya pada keadaan emosional atau ketiadaan keluarga biologis.
- source_word: בַּיְתָה
  choice: dalam sebuah rumah
  rationale: בַּיִת dapat berarti rumah atau rumah tangga. 'Sebuah rumah' mempertahankan gambaran konkret sumber sekaligus menyiratkan tempat tinggal dan rasa memiliki.
- source_word: מוֹצִיא
  choice: membawa ... keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar; susunan ini langsung dan mempertahankan kesejajaran tindakan Allah.
- source_word: אֲסִירִים
  choice: para tahanan
  rationale: Menunjuk kepada orang-orang yang diikat atau dipenjarakan; 'para tahanan' merupakan padanan modern yang jelas.
- source_word: בַּכּוֹשָׁרוֹת
  choice: menuju kesejahteraan
  rationale: Bentuk jamak yang sangat langka ini kemungkinan berkaitan dengan keberhasilan, kemakmuran, atau keadaan baik. 'Menuju kesejahteraan' sesuai dengan tindakan pembebasan dalam konteks, sementara ketidakpastian leksikalnya dijaga dalam catatan kaki.
- source_word: אַךְ
  choice: tetapi
  rationale: Di sini partikel tersebut menandai pertentangan tajam antara pemeliharaan Allah terhadap orang yang rentan dan nasib para pemberontak.
- source_word: סוֹרֲרִים
  choice: orang-orang yang memberontak
  rationale: Partisip dari סרר menunjuk kepada mereka yang keras kepala dan menentang; pilihan ini jelas dan alami dalam bahasa Indonesia.
- source_word: שָׁכְנוּ
  choice: tinggal
  rationale: Bentuk perfektum Qal dari שכן dipakai secara umum atau gnomic dalam puisi; bentuk kini bahasa Indonesia sesuai dengan kontras yang bersifat peribahasa.
- source_word: צְחִיחָה
  choice: tanah yang gersang
  rationale: Nomina ini menunjuk kepada kekeringan atau tempat tandus. Pilihan ini mempertahankan citra puitis dan kontras dengan rumah serta kesejahteraan.
theological_decisions:
- issue: Makna tindakan Allah terhadap orang yang hidup seorang diri
  choice: Allah menyediakan tempat tinggal dan rasa memiliki bagi orang-orang yang hidup seorang diri.
  alternative: Allah menempatkan orang-orang kesepian ke dalam keluarga-keluarga.
  rationale: Teks Ibrani secara langsung menyebut 'orang-orang yang seorang diri' dan 'rumah'. Terjemahan 'keluarga' merupakan penafsiran tradisional yang mungkin, tetapi בַּיִת berbentuk tunggal dan secara lebih langsung berarti rumah atau rumah tangga. Terjemahan utama mempertahankan citra sumber tanpa membatasinya pada struktur keluarga biologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur paralel ayat dipertahankan, sedangkan ungkapan dibuat cukup alami bagi pembaca umum. Ketidakpastian istilah Ibrani yang langka dinyatakan dalam catatan kaki, bukan diselesaikan secara dogmatis.
