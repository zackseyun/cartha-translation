base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: id
  text: Allahmu telah menetapkan kekuatanmu. Tunjukkanlah kekuatan[a], ya Allah, Engkau yang telah bertindak bagi kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani עוּזָה sulit dipastikan. Ungkapan ini juga dapat dipahami sebagai “Jadilah kuat, ya Allah,” atau, bila dihubungkan dengan ayat berikutnya, “Kuatkanlah, ya Allah, apa yang telah Engkau kerjakan bagi kami.”
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: telah menetapkan
  rationale: Bentuk perfektif menyatakan tindakan yang sudah dilakukan dan tetap berlaku; 'menetapkan' menyampaikan keputusan berotoritas secara alami dalam bahasa Indonesia.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: אֱלֹהִים di sini bermakna tunggal dan sufiks orang kedua tunggal menghasilkan 'Allahmu'.
- source_word: עֻזֶּךָ
  choice: kekuatanmu
  rationale: Nomina ini berarti kekuatan atau keperkasaan; 'kekuatanmu' merupakan padanan yang langsung dan wajar.
- source_word: עוּזָה
  choice: Tunjukkanlah kekuatan-Mu
  rationale: Bentuk ini sulit secara sintaksis. Dalam konteks, terjemahan ini mempertahankan daya permohonannya dengan memahami ungkapan tersebut sebagai seruan agar Allah menyatakan kekuatan-Nya, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Konteks permohonan menuntut fungsi vokatif, yang secara alami dinyatakan dengan 'ya Allah'.
- source_word: זוּ
  choice: Engkau yang
  rationale: Partikel relatif ini memperkenalkan klausa yang menerangkan Allah dalam sapaan langsung.
- source_word: פָּעַלְתָּ
  choice: telah bertindak
  rationale: Verba ini menunjuk pada tindakan yang efektif. 'Telah bertindak' alami dan tidak terlalu mempersempit jenis karya Allah.
- source_word: לָּנוּ
  choice: bagi kami
  rationale: 'Preposisi ini paling baik dipahami secara benefaktif: tindakan Allah dilakukan demi umat-Nya.'
theological_decisions:
- issue: Ambiguitas bentuk עוּזָה
  choice: 'Permohonan agar Allah memperlihatkan kekuatan-Nya: ''Tunjukkanlah kekuatan-Mu, ya Allah.'''
  alternative: '''Jadilah kuat, ya Allah,'' atau, bila dihubungkan dengan ayat berikutnya, ''Kuatkanlah, ya Allah, apa yang telah Engkau kerjakan bagi kami.'''
  rationale: Bentuk Ibraninya tidak lazim dan hubungan sintaksisnya tidak pasti. Teks utama memberi permohonan yang koheren di dalam ayat ini, sedangkan catatan kaki mempertahankan pembacaan alternatif tanpa menutup ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'ya Allah' serta kapitalisasi pronomina ilahi mengikuti kelaziman teks keagamaan Indonesia; konstruksi tetap mudah dipahami pembaca umum.
