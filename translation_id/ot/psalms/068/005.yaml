  text: אֲבִ֣י יְ֭תוֹמִים וְ/דַיַּ֣ן אַלְמָנ֑וֹת אֱ֝לֹהִ֗ים בִּ/מְע֥וֹן קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/005.yaml
  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: id
  text: Allah adalah Bapa bagi anak-anak yatim[a] dan Hakim bagi para janda[b] di kediaman-Nya yang kudus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak yang tidak berayah.” Istilah Ibrani secara khusus dapat menunjuk anak-anak yang kehilangan ayah.
    reason: lexical_alternative
  - marker: b
    text: Atau “Pembela para janda”; kata Ibraninya secara lebih harfiah menunjuk orang yang menghakimi atau menyelenggarakan keadilan.
    reason: lexical_alternative
  - marker: c
    text: Atau “dari kediaman-Nya yang kudus”; sebagian terjemahan memahami frasa ini sebagai tempat asal tindakan Allah, meskipun preposisi Ibraninya secara harfiah berarti “di/dalam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי
  choice: Bapa bagi
  rationale: Bentuk konstruksi dari אָב menyatakan peran Allah terhadap kelompok yang disebut sesudahnya. “Bapa bagi” alami dalam bahasa Indonesia dan mempertahankan hubungan yang dinyatakan teks.
- source_word: יְתוֹמִים
  choice: anak-anak yatim
  rationale: Dalam pemakaian Ibrani, istilah ini terutama menunjuk anak-anak yang kehilangan ayah dan karena itu rentan secara sosial. “Anak-anak yatim” merupakan padanan Indonesia yang lazim, ringkas, dan sesuai konteks.
- source_word: דַיַּן
  choice: Hakim bagi
  rationale: Nomina ini secara langsung berarti orang yang menghakimi atau menyelenggarakan keadilan. “Hakim bagi” mempertahankan citra hukum tanpa secara diam-diam mempersempitnya menjadi hanya pembelaan.
- source_word: אַלְמָנוֹת
  choice: para janda
  rationale: Padanan langsung bagi bentuk jamak yang menunjuk perempuan yang suaminya telah meninggal.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini bermakna tunggal dalam ayat tersebut dan menjadi subjek klausa nominal.
- source_word: בִּמְעוֹן
  choice: di kediaman-Nya
  rationale: מָעוֹן berarti tempat tinggal atau kediaman, sedangkan preposisi ב secara biasa bersifat lokatif, “di/dalam.” “Kediaman” terdengar modern dan tetap bermartabat.
- source_word: קָדְשׁוֹ
  choice: yang kudus
  rationale: Secara harfiah mengandung gagasan “kekudusan-Nya” dalam hubungan dengan “kediaman”; ungkapan adjektival “kediaman-Nya yang kudus” merupakan bentuk Indonesia yang alami.
theological_decisions:
- issue: Apakah דַיַּן perlu diterjemahkan dengan makna perlindungan yang lebih eksplisit
  choice: Hakim bagi para janda
  alternative: Pembela para janda
  rationale: Konteks menyiratkan bahwa Allah menjamin keadilan bagi orang rentan, tetapi arti leksikal kata tersebut bersifat yudisial. “Hakim” mempertahankan citra hukum dan ketegangan makna sumber; implikasi perlindungannya dicatat sebagai alternatif.
- issue: Apakah בִּמְעוֹן קָדְשׁוֹ menyatakan lokasi atau titik asal tindakan Allah
  choice: di kediaman-Nya yang kudus
  alternative: dari kediaman-Nya yang kudus
  rationale: Preposisi Ibrani ב secara paling langsung berarti “di/dalam.” Terjemahan “dari” dapat menjelaskan tempat asal tindakan Allah, tetapi melampaui bentuk preposisi yang tertulis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa menjadi arkais. Susunan klausa nominal dibuat alami dengan menempatkan “Allah adalah” di awal. Huruf kapital pada “Bapa” dan “Hakim” menandai sebutan peran bagi Allah, sedangkan bentuk jamak “anak-anak” dan penanda “para” memperjelas kelompok sosial yang dimaksud.
