  text: כְּ/הִנְדֹּ֥ף עָשָׁ֗ן תִּ֫נְדֹּ֥ף כְּ/הִמֵּ֣ס דּ֭וֹנַג מִ/פְּנֵי אֵ֑שׁ יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִ/פְּנֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: id
  text: Seperti asap dihalau[a], demikianlah Engkau menghalau mereka; seperti lilin meleleh di hadapan api[b], demikianlah orang-orang fasik binasa di hadapan Allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “dihalau” juga dapat berarti “dihamburkan” atau “ditiup pergi.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari hadapan api”; ungkapan yang sama dipakai dalam frasa “di hadapan Allah.” Ungkapan ini dapat menunjukkan kehadiran atau penyebab.
    reason: lexical_alternative
  - marker: c
    text: Bentuk-bentuk kata kerja Ibrani juga dapat dipahami sebagai masa mendatang (“akan menghalau ... akan binasa”) atau sebagai harapan dalam konteks ini.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: Seperti asap dihalau
  rationale: כְּ memperkenalkan perbandingan, sedangkan bentuk infinitif dari נדף menyatakan tindakan menghalau atau menghamburkan. Bentuk pasif ini wajar dalam bahasa Indonesia dan mempertahankan gambaran asap yang tersingkir.
- source_word: תִּנְדֹּף
  choice: Engkau menghalau mereka
  rationale: Bentuk Qal imperfek orang kedua maskulin tunggal menyapa Allah secara langsung. Objek tidak dinyatakan dalam bahasa Ibrani; “mereka” dipasok dari kesejajaran dengan orang-orang fasik dan konteks musuh pada ayat sebelumnya.
- source_word: דּוֹנַג
  choice: lilin
  rationale: Kata ini berarti bahan lilin atau malam. “Lilin” merupakan padanan modern yang paling mudah dipahami dalam gambaran sesuatu yang meleleh karena api.
- source_word: מִ/פְּנֵי אֵשׁ
  choice: di hadapan api
  rationale: Ungkapan מִפְּנֵי secara harfiah menunjuk pada posisi atau gerak dari hadapan sesuatu, dan dalam konteks ini berarti terkena kehadiran atau daya api. “Di hadapan” mempertahankan kesejajaran dengan frasa yang sama mengenai Allah.
- source_word: יֹאבְדוּ
  choice: binasa
  rationale: Qal imperfek jamak dari אבד berarti binasa, lenyap, atau musnah. “Binasa” menjaga ketegasan dan corak puitis tanpa menentukan cara kebinasaan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk substantival ini menunjuk kepada orang-orang yang jahat atau fasik. “Orang-orang fasik” mempertahankan kategori moral teks dengan ragam bahasa Kitab Suci yang tetap dapat dipahami.
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: di hadapan Allah
  rationale: Padanan ini mempertahankan pengulangan ungkapan מִפְּנֵי dan menampilkan kebinasaan itu sebagai akibat berhadapan dengan kehadiran Allah.
theological_decisions:
- issue: Daya bentuk imperfek dalam perbandingan puitis
  choice: 'Bentuk kini/generik: “Engkau menghalau ... binasa”'
  alternative: Bentuk mendatang (“akan menghalau ... akan binasa”) atau harapan (“kiranya Engkau menghalau ... kiranya ... binasa”)
  rationale: Imperfek Ibrani dalam puisi dapat menyatakan tindakan mendatang, berulang, atau bernuansa kehendak. Bentuk Indonesia tanpa penanda waktu mempertahankan keterbukaan itu sambil menyajikan perbandingan secara hidup.
- issue: Objek tersirat dari תִּנְדֹּף
  choice: Memakai “mereka,” merujuk kepada orang-orang fasik dan para musuh dalam konteks
  alternative: Memakai “asap itu” atau tidak menyatakan objek
  rationale: Teks Ibrani tidak menyebut objek secara eksplisit. “Mereka” membuat hubungan dengan bagian kedua ayat dan konteks sebelumnya jelas tanpa mengubah pelaku ilahi atau inti perbandingan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan “Engkau” dipakai untuk Allah guna mempertahankan sapaan langsung. Pengulangan “di hadapan” sengaja dipertahankan agar kesejajaran Ibrani antara api dan Allah tetap terdengar.
