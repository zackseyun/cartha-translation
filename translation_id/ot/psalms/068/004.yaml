  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: id
  text: 'Bernyanyilah bagi Allah;

    lantunkanlah pujian bagi nama-Nya.


    Siapkanlah jalan[a] bagi Dia yang berkendara di padang-padang tandus[b];

    Yah adalah nama-Nya.


    Bersorak-sorailah di hadapan-Nya!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini berarti “timbunlah” atau “bangunlah”; dalam konteks ini maksudnya mempersiapkan jalan bagi Allah. Sebagian orang memahaminya secara kiasan sebagai “angkatlah nyanyian.”
    reason: alternative_reading
  - marker: b
    text: Atau “di atas awan-awan.” Kata Ibrani biasanya berarti “padang-padang tandus” atau “stepa,” tetapi sebagian penafsir memahaminya sebagai gambaran teofanik tentang Allah yang berkendara di atas awan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: Bernyanyilah bagi Allah
  rationale: Imperatif jamak שִׁירוּ menyampaikan ajakan langsung untuk bernyanyi; לֵאלֹהִים dalam konteks mazmur ini menunjuk kepada Allah Israel.
- source_word: זַמְּרוּ שְׁמוֹ
  choice: lantunkanlah pujian bagi nama-Nya
  rationale: זמר dalam konteks ibadah berarti bermusik atau menyanyikan pujian. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan שְׁמוֹ, “nama-Nya,” sebagai sasaran pujian.
- source_word: סֹלּוּ
  choice: Siapkanlah jalan
  rationale: סלל pada dasarnya berarti menimbun, membangun, atau mempersiapkan jalan. Terjemahan ini mempertahankan citra konkret teks Ibrani dan tidak menambahkan kata “nyanyian” yang tidak tersurat.
- source_word: לָרֹכֵב בָּעֲרָבוֹת
  choice: bagi Dia yang berkendara melintasi padang-padang tandus
  rationale: Partisip רֹכֵב berfungsi sebagai sebutan bagi Sang Pengendara. עֲרָבוֹת lazimnya menunjuk padang tandus atau stepa; “melintasi” mengungkapkan gerak berkendara secara wajar dalam bahasa Indonesia.
- source_word: בְּיָהּ שְׁמוֹ
  choice: Yah nama-Nya
  rationale: יָהּ adalah bentuk singkat nama ilahi. Transliterasi “Yah” mempertahankan bentuk khusus yang terdapat dalam teks, sedangkan susunan “Yah nama-Nya” mengikuti penekanan puitis bahasa sumber.
- source_word: וְעִלְזוּ לְפָנָיו
  choice: Bersorak-sorailah di hadapan-Nya
  rationale: עלז menyatakan kegembiraan yang meluap. “Bersorak-sorai” mudah dipahami, kuat, dan sesuai dengan suasana perayaan.
theological_decisions:
- issue: Bentuk singkat nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks memakai יָהּ, bukan bentuk lengkap יהוה. Mentransliterasikannya sebagai “Yah” mempertahankan perbedaan yang sengaja hadir dalam bahasa sumber tanpa memasukkan penafsiran denominatif.
- issue: Citra ilahi dalam בָּעֲרָבוֹת
  choice: berkendara melintasi padang-padang tandus
  alternative: berkendara di atas awan-awan
  rationale: Makna leksikal biasa עֲרָבוֹת adalah padang tandus atau stepa dan cocok dengan gambaran perjalanan di padang gurun dalam mazmur ini. Namun, pembacaan “awan-awan” memiliki dasar komparatif dan teofanik yang cukup penting sehingga dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Imperatif jamak Ibrani diterjemahkan sebagai seruan umum memakai akhiran -lah. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Pemenggalan baris mempertahankan gerak paralel puisi tanpa membuat susunan kalimat terasa kuno.
