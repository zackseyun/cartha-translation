  yaml_path: translation/ot/psalms/068/012.yaml
  text: Kings of armies flee[a], they flee, and the woman at home divides the spoil.
translation:
  language: id
  text: 'Raja-raja yang memimpin pasukan melarikan diri,

    mereka melarikan diri,

    dan perempuan yang tinggal di rumah membagi-bagikan hasil jarahan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perempuan penghuni rumah membagi-bagikan hasil jarahan.” Frasa Ibraninya berbentuk feminin tunggal dan tampaknya menggambarkan perempuan yang tetap tinggal di rumah, lalu menerima dan membagikan rampasan perang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי צְבָאוֹת
  choice: raja-raja yang memimpin pasukan
  rationale: Bentuk konstruksi jamak secara harfiah dapat berarti 'raja-raja pasukan'. Dalam bahasa Indonesia, 'raja-raja yang memimpin pasukan' mengungkapkan hubungan militer itu dengan jelas tanpa menimbulkan kesan bahwa pasukan-pasukan tersebut sendiri adalah raja.
- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: melarikan diri, mereka melarikan diri
  rationale: Pengulangan verba dari נדד dipertahankan untuk menyampaikan penegasan dan daya puitis teks Ibrani.
- source_word: וּנְוַת בַּיִת
  choice: perempuan yang tinggal di rumah
  rationale: Frasa feminin tunggal ini menunjuk kepada penghuni perempuan dalam rumah. Pilihan ini alami dan jelas dalam bahasa Indonesia serta tidak memasukkan konsep sosial modern yang lebih khusus seperti 'ibu rumah tangga'.
- source_word: תְּחַלֵּק
  choice: membagi-bagikan
  rationale: Bentuk Piel menyatakan tindakan membagi atau mendistribusikan; 'membagi-bagikan' menangkap nuansa distributifnya secara alami.
- source_word: שָׁלָל
  choice: hasil jarahan
  rationale: Kata ini menunjuk pada barang rampasan perang. 'Hasil jarahan' mudah dipahami pembaca modern dan tetap mempertahankan konteks militer.
