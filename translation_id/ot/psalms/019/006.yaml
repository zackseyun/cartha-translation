source:
  edition: WLC
  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: id
  text: Ia terbit dari salah satu ujung langit[a] dan beredar sampai ke ujung-ujungnya[b]; tidak ada yang tersembunyi dari panasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia keluar.” Kata Ibrani dapat menunjuk pada keluarnya atau munculnya matahari.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “lintasannya mencapai ujung-ujung langit.” Kata Ibrani menggambarkan putaran atau perjalanan matahari melintasi langit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: dari salah satu ujung langit
  rationale: קָצֶה berarti ujung atau batas terjauh. Ungkapan "salah satu ujung" menyatakan titik awal gerak secara wajar dalam bahasa Indonesia, sedangkan "langit" merupakan bentuk kolektif alami untuk שָׁמַיִם.
- source_word: מוֹצָאוֹ
  choice: ia terbit
  rationale: מוֹצָא pada konteks matahari dapat menunjuk pada kemunculan atau keluarnya. "Ia terbit" menyampaikan gambaran yang dimaksud dengan jelas dan alami; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וּתְקוּפָתוֹ
  choice: dan beredar
  rationale: תְּקוּפָה menyatakan putaran, peredaran, atau lintasan yang ditempuh. Bentuk verbal "beredar" mempertahankan gerak puitis ayat dan lebih alami daripada nomina teknis.
- source_word: עַל קְצוֹתָם
  choice: sampai ke ujung-ujungnya
  rationale: Dalam hubungan dengan תְּקוּפָה, עַל menyatakan jangkauan gerak. Akhiran -nya merujuk kembali kepada langit, sebagaimana sufiks jamak Ibrani merujuk kepada הַשָּׁמַיִם.
- source_word: וְאֵין נִסְתָּר
  choice: tidak ada yang tersembunyi
  rationale: אֵין dengan partisip pasif נִסְתָּר menyatakan bahwa tidak seorang pun atau tidak sesuatu pun luput; rumusan Indonesia ini mempertahankan keluasan referensinya.
- source_word: מֵחַמָּתוֹ
  choice: dari panasnya
  rationale: חַמָּה di sini berarti panas matahari, bukan sekadar kehangatan. Akhiran -nya secara alami merujuk kepada matahari tanpa menambah penandaan gender.
theological_decisions:
- issue: Tingkat personifikasi matahari
  choice: Menggunakan pronomina "ia" bagi matahari dalam gambaran puitis, lalu akhiran netral -nya.
  alternative: Menghindari pronomina dengan mengulang "matahari", atau menonjolkan personifikasi maskulin dari tata bahasa Ibrani.
  rationale: Sufiks Ibrani berbentuk maskulin tunggal karena gender gramatikal kata "matahari". "Ia" wajar bagi benda yang dipersonifikasikan dalam puisi Indonesia, tetapi tidak menyiratkan bahwa matahari adalah pribadi ilahi; akhiran -nya sendiri tidak menandai gender.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis yang ringkas. Paralelisme gerak dari satu ujung ke ujung-ujung langit dipertahankan, sementara titik koma menandai peralihan kepada dampak panas matahari.
