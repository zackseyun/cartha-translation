translation:
  language: id
  text: Untuk pemimpin musik. Mazmur Daud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mazmur karya Daud” atau “mazmur untuk Daud”; ungkapan Ibrani dapat menunjukkan kepengarangan, hubungan, atau peruntukan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin musik
  rationale: Dalam judul-judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Frasa ini alami dalam bahasa Indonesia dan mempertahankan awalan ל sebagai arah atau peruntukan.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah ini merupakan penanda jenis karya yang lazim untuk nyanyian sakral dengan kaitan musikal; “mazmur” adalah padanan Indonesia yang baku dan tepat.
- source_word: לְדָוִד
  choice: Daud
  rationale: Susunan “Mazmur Daud” alami dalam bahasa Indonesia dan tidak memastikan apakah Daud adalah pengarang, tokoh yang dikaitkan dengannya, atau penerimanya.
theological_decisions:
- issue: Makna לְדָוִד dalam judul mazmur
  choice: Mazmur Daud
  alternative: Mazmur karya Daud; mazmur untuk Daud
  rationale: Preposisi ל dapat menyatakan kepengarangan, hubungan, kepunyaan, atau peruntukan. Terjemahan utama mempertahankan keluwesan hubungan itu, sedangkan catatan kaki menyebutkan kemungkinan yang lebih eksplisit tanpa menetapkan salah satunya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. “Pemimpin musik” dipilih karena lebih jelas bagi pembaca umum daripada istilah gerejawi yang lebih khusus. Penanda catatan kaki ditempatkan sesudah “Daud” karena catatan menjelaskan לְדָוִד.
