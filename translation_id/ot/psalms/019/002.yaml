  yaml_path: translation/ot/psalms/019/002.yaml
  text: Day to day pours forth speech[b][a], and night to night reveals knowledge.
translation:
  language: id
  text: Hari demi hari mencurahkan perkataan[a], dan malam demi malam menyatakan pengetahuan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengucapkan perkataan.” Kata kerja Ibrani menggambarkan perkataan yang memancar atau mengalir dengan limpah, bukan sekadar tindakan berbicara.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menyingkapkan pengetahuan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם לְיוֹם
  choice: Hari demi hari
  rationale: Ungkapan ini menyatakan kesinambungan dari satu hari ke hari berikutnya. Bentuk Indonesia ini alami sekaligus mempertahankan pengulangan puitis yang sejajar dengan bagian tentang malam.
- source_word: יַבִּיעַ
  choice: mencurahkan
  rationale: Bentuk Hifil dari נבע menggambarkan sesuatu yang memancar atau mengalir keluar dengan limpah; 'mencurahkan' mempertahankan metafora hidup itu.
- source_word: אֹמֶר
  choice: perkataan
  rationale: Nomina ini menunjuk pada ungkapan verbal atau tuturan. 'Perkataan' jelas dan wajar dalam konteks proklamasi puitis.
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: dan malam demi malam
  rationale: Pilihan ini mencerminkan susunan bagian pertama dan mempertahankan paralelisme Ibrani.
- source_word: יְחַוֶּה
  choice: menyatakan
  rationale: Bentuk Piel dari חוה berarti memberitahukan, menyatakan, atau memperlihatkan. 'Menyatakan' mempertahankan keluasan makna tanpa secara khusus menyiratkan penyingkapan rahasia.
- source_word: דָּעַת
  choice: pengetahuan
  rationale: Ini adalah padanan langsung yang mempertahankan kesejajaran konseptual dengan 'perkataan'.
