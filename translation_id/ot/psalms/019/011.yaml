  - marker: b
    text: 'Atau: “terdapat hasil atau balasan yang berlimpah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Juga
  rationale: Mempertahankan daya aditif yang menghubungkan ayat ini dengan pujian sebelumnya terhadap ketetapan-ketetapan TUHAN.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam konteks doa, pemazmur menyebut dirinya sebagai hamba Allah; pilihan ini alami dan mempertahankan nuansa pengabdian.
- source_word: נִזְהָר
  choice: diperingatkan
  rationale: Bentuk Nifal dari זהר paling wajar menyatakan bahwa sang hamba menerima peringatan atau menjadi waspada karenanya; bentuk pasif Ibrani tetap terpelihara.
- source_word: בָּהֶם
  choice: oleh semuanya itu
  rationale: Merujuk kepada ketetapan-ketetapan ilahi dalam konteks sebelumnya dan menyatakan sarana yang memberi peringatan.
- source_word: בְּשָׁמְרָם
  choice: dengan menaatinya
  rationale: שמר dalam konteks perintah berarti menjaga dengan melaksanakannya. Frasa ini secara alami menyatakan keadaan atau sarana tanpa mempersempit hubungan logisnya.
- source_word: עֵקֶב
  choice: upah
  rationale: Dalam konteks ini menunjuk pada hasil atau balasan yang mengikuti ketaatan. 'Upah' mempertahankan ungkapan positif ayat tanpa menetapkan mekanisme jasa tertentu.
- source_word: רָב
  choice: yang besar
  rationale: Menyatakan besarnya atau melimpahnya upah dengan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Apakah ayat ini mengajarkan perolehan pahala berdasarkan jasa manusia atau menyatakan hasil baik dari ketaatan
  choice: Terjemahan menyatakan bahwa menaati ketetapan Allah berkaitan dengan upah yang besar, tanpa menjelaskan apakah upah itu diperoleh berdasarkan jasa.
  alternative: Menerjemahkan עֵקֶב sebagai 'hasil yang berlimpah' untuk menekankan konsekuensi, atau memakai rumusan yang secara tegas menyatakan bahwa ketaatan menghasilkan pahala dari Allah.
  rationale: Bahasa Ibrani menyebut 'dalam/dengan menjaganya' dan 'upah/hasil yang besar', tetapi tidak merumuskan suatu sistem teologis tentang jasa. Ketegangan itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Kapital pada pronomina “-Mu” menandai sapaan kepada Allah sesuai kebiasaan penerbitan Alkitab Indonesia. “Semuanya itu” mempertahankan rujukan jamak kepada perkataan dan ketetapan TUHAN dalam konteks sebelumnya.
