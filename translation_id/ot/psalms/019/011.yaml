  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: id
  text: Hamba-Mu pun diperingatkan oleh semuanya itu[a]; dalam menaatinya terdapat upah besar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hamba-Mu mengambil peringatan dari semuanya itu”; kata kerja Ibrani dapat berarti diperingatkan atau mengindahkan peringatan.'
