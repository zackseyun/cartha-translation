lexical_decisions:
- source_word: קַוָּם
  choice: garis mereka
  rationale: Teks Masoret berbunyi harfiah “garis mereka”. Pilihan ini mempertahankan bacaan Ibrani dan ambiguitas metaforisnya; kemungkinan arti “suara mereka” dicatat dalam catatan kaki.
- source_word: יָצָא
  choice: telah menjangkau
  rationale: Secara harfiah verba ini berarti “telah keluar”. Dalam hubungan dengan “garis”, “telah menjangkau” menyampaikan gerak atau jangkauan ke seluruh bumi secara alami tanpa mengganti nomina Ibraninya.
- source_word: מִלֵּיהֶם
  choice: perkataan mereka
  rationale: Nomina ini berarti kata-kata atau tuturan. “Perkataan” sesuai dengan ragam puitis dan mempertahankan unsur komunikasi dalam kesejajaran ayat.
- source_word: תֵבֵל
  choice: dunia
  rationale: Kata ini menunjuk pada dunia, khususnya bumi yang dihuni. “Dunia” merupakan padanan Indonesia yang alami dalam larik puitis ini.
- source_word: שָׂם
  choice: telah memasang
  rationale: Verba ini menyatakan tindakan menaruh atau menempatkan. Bersama “kemah”, “memasang” terdengar alami dalam bahasa Indonesia dan tetap menggambarkan tindakan Allah.
- source_word: אֹהֶל
  choice: sebuah kemah
  rationale: Arti biasa kata ini adalah kemah. Padanan ini menghindari nuansa kultis yang tidak dituntut oleh konteks.
- source_word: בָּהֶם
  choice: di dalamnya
  rationale: Padanan ini mempertahankan pronomina Ibrani tanpa menjelaskan antesedennya secara berlebihan; rujukannya kemungkinan adalah langit atau cakrawala pada ayat sebelumnya.
- source_word: לַשֶּׁמֶשׁ
  choice: bagi matahari
  rationale: Padanan langsung dan wajar bagi frasa berpreposisi tersebut.
