    text: Atau, “Suara mereka telah terdengar di seluruh bumi.” Teks konsonantal Ibrani berbunyi “garis mereka”, tetapi beberapa versi kuno dan banyak penafsir memahami maksudnya sebagai “suara” dalam konteks puitis ini.
