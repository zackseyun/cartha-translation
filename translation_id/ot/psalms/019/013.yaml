id: PSA.19.13
reference: Psalms 19:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: id
  text: Jauhkanlah juga hamba-Mu dari dosa-dosa yang dilakukan dengan lancang[a]; jangan biarkan semuanya itu menguasai aku. Maka aku akan hidup tak bercela[b] dan bebas dari pelanggaran besar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari orang-orang angkuh.” Kata Ibrani ini dapat menunjuk kepada orang angkuh atau kepada dosa yang dilakukan dengan sikap lancang.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “aku akan menjadi utuh” atau “aku akan tidak bersalah.” Istilah Ibraninya dapat menyatakan keutuhan atau integritas.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “dari pemberontakan besar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: juga
  rationale: Mempertahankan daya aditif yang menghubungkan permohonan ini dengan pembicaraan tentang kesalahan tersembunyi pada ayat sebelumnya.
- source_word: מִזֵּדִים
  choice: dari dosa-dosa yang dilakukan dengan lancang
  rationale: Dalam konteks kesalahan dan dosa, bentuk ini paling wajar dipahami sebagai tindakan berdosa yang lahir dari keangkuhan atau kelancangan, meskipun secara leksikal juga dapat menunjuk kepada orang-orang angkuh.
- source_word: חֲשֹׂךְ
  choice: jauhkanlah
  rationale: Mengungkapkan permohonan agar Allah menahan atau menjaga pemazmur supaya tidak jatuh ke dalam dosa tersebut, dengan bahasa Indonesia yang alami.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Padanan doa yang lazim dan bermartabat, serta mempertahankan sikap tunduk pembicara kepada Allah.
- source_word: אַל יִמְשְׁלוּ בִי
  choice: jangan biarkan semuanya itu menguasai aku
  rationale: Mempertahankan gambaran tentang dosa sebagai kuasa yang dapat mendominasi seseorang. Kata ganti diperjelas agar rujukannya alami dalam bahasa Indonesia.
- source_word: אָז
  choice: Maka
  rationale: Menandai hasil yang mengikuti tindakan Allah dalam menahan pemazmur.
- source_word: אֵיתָם
  choice: aku akan hidup tak bercela
  rationale: Menyampaikan gagasan keutuhan atau integritas moral tanpa menyiratkan kesempurnaan mutlak; penambahan 'hidup' membuat bentuk adjektival Ibrani terdengar alami dalam bahasa Indonesia.
- source_word: וְנִקֵּיתִי
  choice: dan bebas
  rationale: Menyatakan keadaan terbebas dari kesalahan atau tanggungan pelanggaran secara jelas dan alami.
- source_word: מִפֶּשַׁע רָב
  choice: dari pelanggaran besar
  rationale: Mempertahankan bentuk tunggal dan bobot serius פשע sebagai pelanggaran atau pemberontakan terhadap Allah.
theological_decisions:
- issue: Rujukan מִזֵּדִים
  choice: dosa-dosa yang dilakukan dengan lancang
  alternative: orang-orang angkuh
  rationale: Konteks langsung membahas kesalahan dan dosa, sehingga pembacaan tindakan berdosa menjaga kesejajaran moral. Namun, kemungkinan bahwa istilah itu menunjuk kepada orang angkuh tetap dicatat.
- issue: Makna אֵיתָם
  choice: hidup tak bercela dalam arti berintegritas
  alternative: sempurna, utuh, atau tidak bersalah
  rationale: Pilihan ini mempertahankan gagasan keutuhan moral sebagai hasil pertolongan Allah tanpa menjadikannya pernyataan tentang ketidakberdosaan mutlak.
- issue: Makna פֶּשַׁע
  choice: pelanggaran
  alternative: pemberontakan
  rationale: Pelanggaran merupakan padanan Indonesia yang alami dalam konteks dosa, sementara nuansa pemberontakan yang lebih tegas tetap disediakan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras doa yang khidmat tetapi mudah dipahami. Bentuk 'hamba-Mu' dan imperatif '-lah' mempertahankan wibawa puitis; ambiguitas utama teks Ibrani disajikan melalui catatan kaki.
