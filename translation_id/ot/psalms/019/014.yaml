base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: id
  text: Kiranya perkataan mulutku dan renungan hatiku berkenan di hadapan-Mu[a], ya Yahweh, batuku dan penebusku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dalam pandangan-Mu”. Secara harfiah, bahasa Ibrani mengatakan “di depan wajah atau hadirat-Mu”.
    reason: lexical_alternative
  - marker: b
    text: “Penebus” menerjemahkan istilah bagi orang yang membebaskan atau memperoleh kembali sesuatu atau seseorang; dalam hukum Israel, tindakan ini sering berkaitan dengan kewajiban seorang kerabat dekat.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: Kiranya ... berkenan
  rationale: Bentuk imperfek Qal dipakai secara jusif dalam konteks doa atau harapan; “kiranya” menyampaikan daya permohonan itu dengan wajar dalam bahasa Indonesia.
- source_word: לְרָצוֹן
  choice: berkenan
  rationale: Ungkapan ini menyatakan sesuatu yang diterima dengan perkenanan. “Berkenan” alami dalam bahasa Indonesia dan mempertahankan nuansa doa di hadapan Allah.
- source_word: אִמְרֵי פִי
  choice: perkataan mulutku
  rationale: Terjemahan konkret ini mempertahankan gambaran Ibrani tentang segala sesuatu yang diucapkan pemazmur.
- source_word: הֶגְיוֹן לִבִּי
  choice: renungan hatiku
  rationale: הֶגְיוֹן dapat berarti renungan, pemikiran, atau gumaman batin. “Renungan hatiku” mempertahankan kesejajaran antara ucapan lahiriah dan perenungan batin.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Secara harfiah menunjuk pada berada di depan wajah atau dalam hadirat pihak yang disapa. “Di hadapan-Mu” ringkas, alami, dan mempertahankan dimensi kehadiran serta penilaian ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: צוּרִי
  choice: gunung batuku
  rationale: צוּר menunjuk pada batu besar atau tebing dan dipakai sebagai metafora bagi perlindungan serta keteguhan. “Gunung batuku” mempertahankan metafora dengan ungkapan Indonesia yang jelas dan puitis.
- source_word: וְגֹאֲלִי
  choice: dan penebusku
  rationale: גֹאֵל adalah pihak yang membebaskan atau memperoleh kembali, sering kali dalam latar kewajiban kerabat. “Penebusku” ringkas dan tidak mempersempit maknanya menjadi satu lembaga hukum saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: ya Yahweh
  alternative: ya TUHAN; ya Yehova
  rationale: Teks memakai nama perjanjian secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri, sedangkan “ya” menandai sapaan tanpa menambah gelar.
- issue: Metafora צוּרִי
  choice: gunung batuku
  alternative: perlindunganku; batuku
  rationale: Metafora batu dipertahankan, bukan dijelaskan secara interpretatif sebagai “perlindungan”, sehingga citra puitis dan keluasan makna teologisnya tetap ada.
- issue: Latar makna גֹאֲלִי
  choice: penebusku
  alternative: kerabat-penebusku; pembebasku
  rationale: “Penebusku” mempertahankan makna penyelamatan dan pengambilan kembali tanpa memastikan bahwa pemazmur sedang menekankan kewajiban kekerabatan secara khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan tetap puitis. Susunan paralel antara ucapan mulut dan renungan hati dipertahankan. Huruf kapital pada pronomina sapaan ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
