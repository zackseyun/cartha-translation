base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/005.yaml
  text: And it is like a bridegroom coming out from his wedding chamber[a]; it rejoices like a warrior to run a course.
translation:
  language: id
  text: Dan ia seperti pengantin laki-laki yang keluar dari kamar pengantinnya[a]; ia bersukacita seperti pejuang yang berlari menempuh lintasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "dari kanopi pernikahannya." Kata Ibrani חֻפָּה dapat menunjuk pada kanopi pernikahan atau kamar pengantin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Dan ia
  rationale: Kata ganti ini merujuk pada matahari dalam ayat sebelumnya. Dalam puisi Ibrani, matahari dipersonifikasikan; bahasa Indonesia dapat mempertahankan kata ganti 'ia' secara alami.
- source_word: כְּחָתָן
  choice: seperti pengantin laki-laki
  rationale: חָתָן berarti pengantin laki-laki dan mempertahankan gambaran pernikahan dengan jelas dalam bahasa Indonesia modern.
- source_word: יֹצֵא
  choice: yang keluar
  rationale: Partisipel יצא menggambarkan tindakan keluar secara hidup; bentuk 'yang keluar' mengalir alami setelah perbandingan dengan pengantin laki-laki.
- source_word: מֵחֻפָּתוֹ
  choice: dari kamar pengantinnya
  rationale: חֻפָּה dapat menunjuk pada kanopi pernikahan atau kamar pengantin. Dalam konteks pengantin laki-laki yang keluar, 'kamar pengantin' menghasilkan gambaran yang jelas, sementara kemungkinan 'kanopi pernikahan' dipertahankan dalam catatan kaki.
- source_word: יָשִׂישׂ
  choice: ia bersukacita
  rationale: Kata kerja ini menyatakan kegembiraan yang meluap. 'Bersukacita' mempertahankan nada puitis dan meriah tanpa menambahkan makna yang tidak ada.
- source_word: כְּגִבּוֹר
  choice: seperti seorang kesatria
  rationale: גִּבּוֹר menunjuk pada orang yang kuat atau pejuang. 'Kesatria' menyampaikan sosok gagah dalam perumpamaan puitis dan cocok dengan kesiapan berlari.
- source_word: לָרוּץ
  choice: yang berlari menempuh
  rationale: רוץ berarti 'berlari'. Gabungan 'berlari menempuh' menghubungkan tindakan itu secara alami dengan jalan yang dilalui tanpa menambahkan unsur perlombaan.
- source_word: אֹרַח
  choice: jalannya
  rationale: אֹרַח berarti jalan atau lintasan. 'Jalannya' mempertahankan metafora jalan dan memperjelas bahwa matahari menempuh lintasannya sendiri; posesif tersirat secara kontekstual meskipun tidak dinyatakan secara morfologis pada nomina Ibrani.
