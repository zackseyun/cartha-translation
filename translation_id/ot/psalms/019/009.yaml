base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: id
  text: Takut kepada Yahweh itu murni[a], bertahan selama-lamanya[b]; keputusan-keputusan Yahweh[c] itu benar; semuanya adil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tahir.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “berdiri untuk selamanya.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “ketetapan-ketetapan Yahweh” atau “penghakiman-penghakiman Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: takut akan Yahweh
  rationale: Mempertahankan ungkapan Ibrani yang mencakup rasa gentar, hormat, dan ketundukan kepada Yahweh, tanpa mempersempitnya menjadi sekadar agama atau ibadah.
- source_word: טְהוֹרָה
  choice: murni
  rationale: Menyampaikan kemurnian moral atau ritual secara alami dalam bahasa Indonesia modern; 'tahir' tetap dicatat sebagai alternatif.
- source_word: עוֹמֶדֶת לָעַד
  choice: tetap untuk selama-lamanya
  rationale: Secara harfiah berarti 'berdiri untuk selamanya'; pilihan ini mengungkapkan keteguhan dan keberlangsungan dengan wajar.
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: ketetapan-ketetapan Yahweh
  rationale: מִשְׁפָּט dapat menunjuk pada keputusan hukum, penghakiman, atau ketetapan. Dalam rangkaian istilah bagi penyataan ilahi di mazmur ini, 'ketetapan-ketetapan' terdengar alami tanpa meniadakan nuansa yudisial, yang dicatat dalam catatan kaki.
- source_word: אֱמֶת
  choice: benar
  rationale: Bentuk nomina Ibrani dipakai secara predikatif; 'benar' merupakan padanan Indonesia yang idiomatis dan mempertahankan gagasan kebenaran serta keterandalan.
- source_word: צָדְקוּ יַחְדָּו
  choice: semuanya adil
  rationale: 'Menjaga daya kolektif יַחְדָּו: seluruh ketetapan itu, dipandang bersama-sama, benar secara moral dan adil.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sesuai bukti teks sumber dan lapisan konsultasi.
theological_decisions:
- issue: Rujukan ungkapan 'takut akan Yahweh' dalam rangkaian istilah tentang penyataan Allah
  choice: Mempertahankan ungkapan 'takut akan Yahweh'.
  alternative: agama Yahweh; ibadah kepada Yahweh; rasa hormat kepada Yahweh
  rationale: Ungkapan Ibrani itu kaya secara teologis dan dapat mencakup kegentaran, penghormatan, kesalehan, serta ketaatan. Terjemahan tidak menentukannya secara metonimis sebagai 'agama' atau 'ibadah'.
- issue: Hubungan יַחְדָּו dengan keadilan ketetapan-ketetapan Yahweh
  choice: Menerjemahkan daya kolektifnya sebagai 'semuanya adil'.
  alternative: adil seluruhnya; bersama-sama adil
  rationale: Pilihan ini menyatakan bahwa ketetapan-ketetapan tersebut adil secara menyeluruh sebagai satu kesatuan, tanpa memaksakan penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme ayat dipertahankan; tanda titik koma membagi kedua klausa utama. Nama ilahi ditulis 'Yahweh'.
