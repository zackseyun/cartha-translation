  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: id
  text: Langit menceritakan kemuliaan Allah, dan bentangan langit menyatakan karya tangan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubah langit”. Kata Ibrani רָקִיעַ menunjuk pada hamparan atau bentangan langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Bentuk jamak Ibrani ini menunjuk pada langit atau kawasan surgawi. Dalam bahasa Indonesia, “langit” alami, puitis, dan dapat mencakup keluasan kosmis tanpa harus memakai bentuk “langit-langit” yang keliru.
- source_word: מְסַפְּרִים
  choice: menceritakan
  rationale: Partisipel dari ספר berarti menceritakan, mengisahkan, atau menyatakan. “Menceritakan” mempertahankan gambaran puitis bahwa langit terus bersaksi tentang kemuliaan Allah.
- source_word: כְּבוֹד
  choice: kemuliaan
  rationale: “Kemuliaan” adalah padanan baku dan tepat bagi כבוד dalam konteks keagungan, kehormatan, dan kebesaran Allah.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל berfungsi sebagai sebutan bagi Sang Pencipta, bukan harus ditransliterasikan sebagai nama diri “El”. “Allah” adalah padanan Indonesia yang wajar untuk God.
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: karya tangan-Nya
  rationale: Padanan ini mempertahankan ungkapan antropomorfis dan kekonkretan puitis teks Ibrani, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: מַגִּיד
  choice: menyatakan
  rationale: Bentuk partisipel Hifil dari נגד berarti memberitahukan atau menyatakan. “Menyatakan” membentuk paralel yang alami dengan “menceritakan” tanpa menghapus variasi kata kerja Ibrani.
- source_word: הָרָקִיעַ
  choice: cakrawala
  rationale: רָקִיעַ menunjuk pada bentangan langit yang terbentang. “Cakrawala” mempertahankan citra puitis dan lebih bermartabat daripada sekadar mengulang “langit”, meskipun dalam pemakaian modern maknanya kadang lebih sempit.
theological_decisions:
- issue: Pemaknaan אֵל
  choice: Allah
  alternative: El
  rationale: Konteks berbicara tentang Sang Pencipta yang kemuliaan-Nya dinyatakan oleh ciptaan. Teks tidak menuntut penekanan pada “El” sebagai nama diri, sehingga sebutan ilahi diterjemahkan secara alami.
translation_notes:
  register: Bahasa puitis, luhur, dan mudah dipahami. Paralelisme Ibrani dipertahankan melalui pasangan “Langit ... dan cakrawala” serta “menceritakan ... menyatakan”. Huruf kapital pada “-Nya” mengikuti kebiasaan ejaan religius Indonesia untuk rujukan kepada Allah.
