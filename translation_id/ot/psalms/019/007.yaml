  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: id
  text: Taurat Yahweh sempurna, memulihkan jiwa[a]; kesaksian Yahweh dapat dipercaya, membuat orang yang tidak berpengalaman menjadi bijaksana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: menghidupkan kembali jiwa.'
    reason: Alternatif ini mencerminkan kemungkinan bahwa מְשִׁיבַת נָפֶשׁ berbicara tentang menghidupkan kembali atau menyegarkan daya hidup, bukan hanya memulihkan keadaan sebelumnya.
lexical_decisions:
- source_word: תּוֹרַת
  choice: Taurat
  rationale: Dalam konteks ini תּוֹרָה menunjuk pada pengajaran ilahi yang berwibawa dan bercorak perjanjian. “Taurat” mempertahankan bobot istilah tersebut serta lazim dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: תְּמִימָה
  choice: sempurna
  rationale: Kata ini menyatakan keutuhan, kelengkapan, dan tidak adanya cacat; “sempurna” menyampaikan cakupan maknanya dengan ringkas dan wajar.
- source_word: מְשִׁיבַת
  choice: memulihkan
  rationale: Bentuk partisip kausatif dari שׁוב membawa gagasan mengembalikan atau memulihkan. “Memulihkan” mempertahankan nuansa dasar itu tanpa mempersempitnya.
- source_word: נָפֶשׁ
  choice: jiwa
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, diri, atau pribadi seutuhnya. “Jiwa” ringkas dan puitis, sambil tetap membiarkan keluasan makna Ibraninya.
- source_word: עֵדוּת
  choice: kesaksian
  rationale: Istilah ini menunjuk pada kesaksian atau ketetapan Yahweh yang menjadi saksi berwibawa; “kesaksian” merupakan padanan langsung dan sesuai dengan paralelisme ayat.
- source_word: נֶאֱמָנָה
  choice: dapat dipercaya
  rationale: Kata ini menekankan keteguhan dan keandalan. “Dapat dipercaya” jelas dan alami dalam bahasa Indonesia modern.
- source_word: מַחְכִּימַת
  choice: membuat ... menjadi bijaksana
  rationale: Bentuk kausatif ini berarti menjadikan seseorang bijaksana; susunan tersebut mengungkapkan daya penyebabnya secara eksplisit dan alami.
- source_word: פֶּתִי
  choice: orang yang tidak berpengalaman
  rationale: פֶּתִי ialah orang yang polos, naif, atau belum matang dan karena itu mudah dipengaruhi, bukan selalu orang bodoh secara moral. Pilihan ini menghindari kesan merendahkan yang berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Nuansa מְשִׁיבַת נָפֶשׁ
  choice: memulihkan jiwa
  alternative: menghidupkan kembali jiwa
  rationale: Ungkapan Ibrani dapat menggambarkan pengembalian, pemulihan, atau penghidupan kembali diri atau kehidupan. Teks utama mempertahankan nuansa dasar שׁוב, sedangkan kemungkinan bernuansa menghidupkan kembali dicatat tanpa memutuskan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan dengan dua klausa paralel. Istilah “Taurat” dan “kesaksian” mempertahankan corak perjanjian, sedangkan “orang yang tidak berpengalaman” menjelaskan פֶּתִי secara alami tanpa menambahkan kecaman moral yang tidak dinyatakan teks.
