  terminology: “Taurat,” “Yahweh,” “jiwa,” dan “kesaksian” digunakan secara konsisten serta sesuai register kitab suci. Nama ilahi dipertahankan sebagai “Yahweh,” selaras dengan sumber dan jejak audit Inggris. Catatan kaki pada penanda [a] terpasang tepat setelah “jiwa” dan menyajikan alternatif makna yang sah.
