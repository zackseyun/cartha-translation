source:
  edition: WLC
  text: פִּקּ֘וּדֵ֤י יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי לֵ֑ב מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: id
  text: Titah-titah Yahweh itu benar, menggembirakan hati; perintah Yahweh itu murni[a], menerangi mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jernih”. Kata sifat Ibrani ini dapat menekankan kemurnian; dalam kaitannya dengan frasa “menerangi mata”, kata itu juga dapat dipahami bernuansa kejernihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: titah-titah
  rationale: Istilah ini menunjuk pada arahan atau mandat yang ditetapkan. “Titah-titah” mempertahankan nuansa perintah yang berwibawa sekaligus membedakannya dari מִצְוַת dalam baris sejajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: יְשָׁרִים
  choice: benar
  rationale: Dalam konteks ini kata tersebut menyatakan kelurusan atau ketepatan moral. “Benar” alami dalam bahasa Indonesia dan sesuai sebagai sifat titah-titah Yahweh.
- source_word: מְשַׂמְּחֵי לֵב
  choice: menggembirakan hati
  rationale: 'Frasa ini mempertahankan makna kausatif dan bentuk partisipial yang menyatakan dampak berkelanjutan: titah-titah itu membuat hati bergembira.'
- source_word: לֵב
  choice: hati
  rationale: “Hati” mempertahankan gambaran konkret Ibrani dan dalam bahasa Indonesia dapat mencakup pusat batin, pikiran, kehendak, dan perasaan.
- source_word: מִצְוַת
  choice: perintah
  rationale: Bentuk tunggal ini bersifat kolektif atau representatif. “Perintah” mempertahankan nuansa hukum-perjanjian dan membedakannya dari “titah-titah” pada bagian pertama.
- source_word: בָּרָה
  choice: murni
  rationale: Makna dasarnya menekankan kemurnian atau kebersihan. “Murni” mempertahankan arti leksikal tersebut tanpa membatasi kata ini hanya pada kejernihan intelektual.
- source_word: מְאִירַת עֵינָיִם
  choice: menerangi mata
  rationale: Terjemahan ini mempertahankan makna kausatif kata kerja serta gambaran puitis tentang cahaya yang memberi persepsi dan daya hidup.
- source_word: עֵינָיִם
  choice: mata
  rationale: Nomina konkret “mata” dipertahankan agar metafora Ibrani tentang penglihatan, pemahaman, dan vitalitas tidak diganti dengan satu penafsiran abstrak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks menggunakan nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi Allah dalam teks Ibrani dan tidak menggantinya dengan sebuah gelar.
- issue: Makna בָּרָה dalam kaitannya dengan tindakan menerangi mata
  choice: murni
  alternative: jernih
  rationale: “Murni” lebih dekat dengan makna dasar kata Ibrani, sedangkan “jernih” mungkin menonjolkan hubungan semantis dengan frasa berikutnya. Alternatif itu dicatat tanpa menghapus ketegangan leksikal.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, ringkas, dan bermartabat. Partikel “itu” dipakai untuk menghasilkan predikasi yang alami dan tegas. Paralelisme dua bagian dipertahankan, demikian pula gambaran konkret “hati” dan “mata”.
