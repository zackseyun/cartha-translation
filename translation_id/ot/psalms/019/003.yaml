id: PSA.19.3
reference: Psalms 19:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵֽין אֹ֭מֶר וְ/אֵ֣ין דְּבָרִ֑ים בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: id
  text: Tidak ada ujaran dan tidak ada kata-kata; suara[a] mereka tidak terdengar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bunyi”. Kata Ibrani קוֹל dapat berarti “suara” atau “bunyi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: tidak ada
  rationale: Menyatakan penyangkalan eksistensial dan diterapkan secara alami pada kedua unsur paralel, אֹמֶר dan דְּבָרִים.
- source_word: אֹמֶר
  choice: ujaran
  rationale: Menunjuk pada ungkapan lisan secara umum. “Ujaran” membedakannya dari “kata-kata” dalam baris paralel tanpa menyiratkan satu ucapan tertentu.
- source_word: דְּבָרִים
  choice: kata-kata
  rationale: Dalam konteks komunikasi dan pendengaran, arti konkret “kata-kata” paling sesuai dengan paralelisme puisi.
- source_word: בְּלִי
  choice: tidak
  rationale: Mengungkapkan keadaan negatif yang menyertai bentuk pasif berikutnya; susunan “tidak terdengar” alami dalam bahasa Indonesia modern.
- source_word: נִשְׁמָע
  choice: terdengar
  rationale: Merupakan padanan langsung dan wajar bagi bentuk pasif dari שׁמע dalam konteks bunyi yang dapat didengar.
- source_word: קוֹלָם
  choice: suara mereka
  rationale: קוֹל dapat berarti “suara” atau “bunyi”. “Suara” mempertahankan personifikasi kesaksian langit, sedangkan kemungkinan “bunyi” dicatat dalam catatan kaki.
theological_decisions:
- issue: Kesaksian langit sebagai komunikasi tanpa bahasa manusia biasa
  choice: 'Ayat diterjemahkan sebagai penyangkalan terhadap ujaran dan kata-kata biasa: “Tidak ada ujaran dan tidak ada kata-kata; suara mereka tidak terdengar.”'
  alternative: Klausa terakhir dapat dipahami dalam kaitan dengan kesaksian tanpa ujaran atau kata-kata, sehingga menekankan pemberitaan yang diam namun universal.
  rationale: Sintaks Ibrani mendukung pembacaan lugas dengan rangkaian penyangkalan. Terjemahan ini mempertahankan ketegangan puitis bahwa langit memberitakan kemuliaan Allah, tetapi bukan melalui bahasa manusia yang terdengar, tanpa memaksakan penyelesaian atas gambaran tersebut.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Ujaran” dipilih untuk menjaga perbedaan puitis dengan “kata-kata”, sementara struktur dua klausa negatif dipertahankan sedekat mungkin dengan teks Ibrani.
