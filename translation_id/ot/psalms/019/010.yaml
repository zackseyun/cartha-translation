  yaml_path: translation/ot/psalms/019/010.yaml
  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: id
  text: Semuanya lebih diinginkan daripada emas[a], bahkan daripada banyak emas murni, dan lebih manis daripada madu dan tetesan madu dari sisir lebah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Semuanya lebih diinginkan daripada emas, bahkan daripada banyak emas murni, dan lebih manis daripada madu, bahkan tetesan madu dari sisir lebah.” Bahasa Ibrani memakai bentuk partisip dengan frasa perbandingan; ungkapan terakhir dapat diterjemahkan secara lebih harfiah, “madu tetesan dari sisir-sisir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: lebih berharga
  rationale: Partisip pasif dari חמד menyatakan bahwa semua ketetapan yang disebut sebelumnya patut diinginkan. Dalam bahasa Indonesia, “lebih berharga” secara alami menyampaikan daya tarik dan nilai yang tinggi dalam konstruksi perbandingan ini.
- source_word: מִזָּהָב
  choice: daripada emas
  rationale: Prefiks מִן berfungsi sebagai penanda perbandingan; “daripada emas” merupakan padanan Indonesia yang wajar.
- source_word: וּמִפַּז רָב
  choice: bahkan daripada banyak emas murni
  rationale: פַּז menunjuk pada emas bermutu tinggi atau murni, sedangkan רָב menyatakan kelimpahan. “Bahkan” menampilkan peningkatan retoris dari emas biasa kepada banyak emas murni.
- source_word: וּמְתוּקִים
  choice: dan lebih manis
  rationale: Adjektiva ini sejajar dengan הַנֶּחֱמָדִים dan diikuti perbandingan dengan מִן; bentuk komparatif “lebih manis” paling alami.
- source_word: מִדְּבַשׁ
  choice: daripada madu
  rationale: מִן kembali menandai perbandingan dengan דְּבַשׁ, yaitu madu.
- source_word: וְנֹפֶת צוּפִים
  choice: bahkan madu yang menetes dari sarang lebah
  rationale: נֹפֶת menggambarkan madu yang mengalir atau menetes, sementara צוּפִים merujuk pada sarang atau sisir madu. Ungkapan ini mempertahankan citra konkret madu pilihan yang baru menetes; “bahkan” menyatakan puncak perbandingan yang tersirat dalam paralelisme.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. “Semua itu” merujuk kembali pada berbagai penyataan dan ketetapan TUHAN dalam ayat-ayat sebelumnya. Bentuk jamak Ibrani dipertahankan melalui rujukan kolektif tersebut. Pengulangan “bahkan” membantu menghadirkan gerak klimaks paralelisme Ibrani tanpa membuat kalimat terasa kaku.
