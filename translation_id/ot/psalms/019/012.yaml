  text: Who can discern his errors? Clear me from hidden faults[a].
translation:
  language: id
  text: Siapakah yang dapat menyadari kesalahan-kesalahan? Bersihkanlah aku dari kesalahan-kesalahan tersembunyi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dosa-dosa rahasia” atau “hal-hal yang tersembunyi.” Ungkapan Ibrani ini dapat menunjuk pada kesalahan yang tidak disadari oleh pembicara, yang disembunyikan dari orang lain, atau pada hal-hal tersembunyi secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: kesalahan-kesalahan
  rationale: Nomina ini menunjuk pada kekeliruan, penyimpangan, atau dosa yang dilakukan karena khilaf. Dalam konteks ini, “kesalahan-kesalahan” alami dalam bahasa Indonesia dan mempertahankan dimensi moral tanpa mempersempitnya menjadi dosa yang pasti tidak disengaja.
- source_word: מִי
  choice: Siapa
  rationale: Kata tanya baku yang memperkenalkan pertanyaan retoris.
- source_word: יָבִין
  choice: dapat menyadari
  rationale: Verba ini berarti memahami, menangkap, atau mengenali. “Dapat menyadari” menyampaikan ketidakmampuan manusia untuk mengenali sepenuhnya kesalahannya sendiri dan cocok dengan sufiks orang ketiga pada “kesalahan-kesalahannya”.
- source_word: מִנִּסְתָּרוֹת
  choice: dari kesalahan yang tersembunyi
  rationale: Bentuk partisip pasif dari סתר dengan preposisi מן secara harfiah menunjuk pada hal-hal yang tersembunyi. Paralelismenya dengan “kesalahan-kesalahan” mendukung rujukan moral, tetapi frasa ini tetap tidak menentukan apakah kesalahan itu tersembunyi dari si pembicara atau dari orang lain.
- source_word: נַקֵּנִי
  choice: Bersihkanlah aku
  rationale: Imperatif piel dari נקה dapat berarti membersihkan, membebaskan dari kesalahan, atau menyatakan tidak bersalah. “Bersihkanlah aku” alami dan bermartabat, serta mempertahankan unsur pemurnian dan pembebasan dari kesalahan tanpa menjadikannya semata-mata istilah hukum.
theological_decisions:
- issue: Sifat hal-hal atau kesalahan yang tersembunyi
  choice: Frasa itu diterjemahkan sebagai kesalahan yang tersembunyi.
  alternative: Dosa-dosa rahasia; hal-hal yang tersembunyi secara umum.
  rationale: Paralelisme dengan “kesalahan-kesalahan” sangat mendukung rujukan moral. Namun, terjemahan dan catatan kaki tidak memastikan apakah kesalahan tersebut tidak disadari oleh pemazmur, disembunyikan dari orang lain, atau tersembunyi dalam arti yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang ringkas dan bermartabat. Bentuk “Bersihkanlah” mempertahankan nuansa permohonan langsung, sedangkan catatan kaki menjaga ambiguitas ungkapan Ibrani.
