  text: Their heart was not steadfast with him[b][a], and they were not faithful to his covenant.
translation:
  language: id
  text: Hati mereka tidak teguh terhadap-Nya[a], dan mereka tidak setia pada perjanjian-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hati mereka tidak kokoh terhadap-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak setia di dalam perjanjian-Nya”; ungkapan yang lebih wajar dalam bahasa Indonesia ialah “tidak setia pada perjanjian-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבָּם
  choice: hati mereka
  rationale: Bentuk tunggal dengan akhiran orang ketiga jamak menggambarkan batin atau kehendak bangsa itu secara kolektif; bahasa Indonesia secara alami mempertahankannya sebagai “hati mereka”.
- source_word: נָכוֹן
  choice: teguh
  rationale: Dalam konteks ini kata tersebut menunjuk pada kemantapan dan ketetapan sikap batin terhadap Allah, bukan sekadar keadaan benar.
- source_word: עִמּוֹ
  choice: bersama-Nya
  rationale: Preposisi עִם pada dasarnya berarti “dengan/beserta”; “bersama-Nya” mempertahankan gambaran keselarasan relasional tanpa mempersempitnya menjadi sekadar arah sikap.
- source_word: נֶאֶמְנוּ
  choice: tidak setia
  rationale: Bentuk Nifal dari אמן di sini menyatakan tidak adanya keterandalan atau kesetiaan dalam hubungan perjanjian.
- source_word: בִּבְרִיתוֹ
  choice: pada perjanjian-Nya
  rationale: Walaupun preposisi Ibraninya secara harfiah berarti “di dalam”, padanan idiomatis bahasa Indonesia dengan “setia” ialah “setia pada”; bentuk ini menyampaikan maksud hubungan perjanjian secara wajar.
theological_decisions:
- issue: Bahasa kesetiaan perjanjian
  choice: Ayat ini menyatakan bahwa Israel tidak memiliki keteguhan batin terhadap Allah dan tidak setia pada perjanjian-Nya.
  alternative: Klausa kedua dapat diterjemahkan secara lebih harfiah, “mereka tidak dapat dipercaya di dalam perjanjian-Nya.”
  rationale: Paralelisme antara hati yang tidak teguh dan kegagalan dalam perjanjian menunjuk pada ketidaksetiaan relasional dan moral, bukan hanya kurangnya keyakinan intelektual. Terjemahan ini mempertahankan bobot tersebut tanpa memasukkan kategori doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. “Teguh” dipilih karena alami bagi sikap hati, sedangkan “bersama-Nya” menjaga arti dasar עִם dan ambiguitas relasionalnya. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab bahasa Indonesia.
