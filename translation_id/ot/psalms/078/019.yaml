base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/019.yaml
  text: They spoke against God; they said[a], “Can God prepare a table in the wilderness?”
translation:
  language: id
  text: Mereka berbicara menentang Allah[a]; mereka berkata, “Dapatkah Allah menyiapkan meja di padang belantara?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbicara tentang Allah.” Konstruksi bahasa Ibrani ini dapat diterjemahkan secara lebih netral, tetapi konteks di sini mendukung arti “menentang,” yang menonjolkan keluhan Israel terhadap-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Mereka berbicara
  rationale: Bentuk naratif dari דבר memperkenalkan perkataan umat; “berbicara” merupakan padanan langsung dan alami dalam bahasa Indonesia.
- source_word: בֵּאלֹהִים
  choice: menentang Allah
  rationale: Preposisi ב bersama דבר dapat bermakna adversatif. Konteks pemberontakan dan pertanyaan yang menantang kemampuan Allah mendukung arti “menentang,” sambil mencatat kemungkinan yang lebih netral dalam catatan kaki.
- source_word: אָמְרוּ
  choice: mereka berkata
  rationale: Kata pelapor ini dipertahankan secara eksplisit agar susunan dua tahap dalam bahasa Ibrani tetap terlihat.
- source_word: הֲיוּכַל
  choice: Sanggupkah
  rationale: Partikel tanya dengan יכל menyatakan kemampuan. “Sanggupkah” secara alami menyampaikan nada tantangan terhadap kemampuan Allah.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל merupakan sebutan ilahi yang sejajar dengan אֱלֹהִים; “Allah” jelas dan tidak menambahkan penafsiran seperti “Yang Mahakuasa.”
- source_word: לַעֲרֹךְ
  choice: menyediakan
  rationale: ערך dengan שֻׁלְחָן berarti menata atau menyiapkan meja. “Menyediakan” menyampaikan gagasan pemberian makanan secara wajar tanpa menghapus citra konkret yang diwakili oleh “hidangan.”
- source_word: שֻׁלְחָן
  choice: hidangan
  rationale: Secara harfiah berarti “meja,” tetapi dalam ungkapan menata meja, yang dipersoalkan ialah penyediaan santapan. “Hidangan” menghasilkan bahasa Indonesia yang alami sekaligus mempertahankan gambaran jamuan.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk wilayah liar tempat pengembaraan Israel dan tidak harus berupa gurun pasir; “padang belantara” menjaga cakupan geografis tersebut.
theological_decisions:
- issue: Nada perkataan Israel mengenai Allah
  choice: “menentang Allah” untuk menunjukkan sifat perkataan yang memberontak dan menuduh
  alternative: “tentang Allah” atau “kepada Allah”
  rationale: Konteks mazmur menggambarkan ketidakpercayaan dan pemberontakan Israel. Arti adversatif paling sesuai dengan konteks, tetapi ambiguitas konstruksi Ibraninya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Sanggupkah” mempertahankan nada tantangan, sedangkan “padang belantara” menghindari penyempitan makna menjadi gurun pasir. Penanda catatan kaki [a] ditempatkan pada klausa pelapor yang berkaitan dengan alternatif konstruksi ujaran.
