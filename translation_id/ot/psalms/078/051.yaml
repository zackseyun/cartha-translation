  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/מִצְרָ֑יִם רֵאשִׁ֥ית א֝וֹנִ֗ים בְּ/אָהֳלֵי חָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/051.yaml
  text: He struck down every firstborn in Egypt[a], the firstfruits of their vigor in the tents of Ham.
translation:
  language: id
  text: 'Ia menewaskan semua anak sulung di Mesir,

    hasil pertama dari kekuatan mereka[a],

    di kemah-kemah Ham.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang pertama dari kekuatan mereka.” Ungkapan Ibrani ini menunjuk kepada hasil pertama dari kekuatan untuk menghasilkan keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Ia menewaskan
  rationale: Bentuk naratif lampau dari נכה berarti ‘memukul’; dalam konteks kematian anak-anak sulung, ‘menewaskan’ menyampaikan akibat mematikan tanpa memakai ungkapan yang kaku.
- source_word: כָּל בְּכוֹר
  choice: semua anak sulung
  rationale: Menyatakan keseluruhan anak sulung yang dimaksud. Unsur ‘laki-laki’ tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: בְּמִצְרָיִם
  choice: di Mesir
  rationale: Preposisi ב menunjukkan tempat dan mengacu langsung kepada Mesir dalam kisah tulah.
- source_word: רֵאשִׁית אֹנִים
  choice: buah pertama dari daya hidup mereka
  rationale: Ungkapan puitis ini menunjuk kepada hasil pertama dari kekuatan untuk menghasilkan keturunan. ‘Buah pertama’ mempertahankan gagasan permulaan atau hasil pertama, sedangkan ‘daya hidup’ mengungkapkan kekuatan generatif tanpa menjadi terlalu teknis.
- source_word: בְּאָהֳלֵי חָם
  choice: di kemah-kemah Ham
  rationale: Mempertahankan gambaran puitis dan sebutan genealogis bagi Mesir; nama Ham tidak diganti dengan penafsiran ‘orang Mesir’.
theological_decisions:
- issue: Sebutan puitis ‘Ham’ bagi Mesir
  choice: Mempertahankan ‘Ham’ dalam teks utama.
  alternative: di tempat tinggal orang Mesir; di negeri Mesir
  rationale: Baris pertama sudah menyebut Mesir, sedangkan ‘kemah-kemah Ham’ menambahkan kesejajaran puitis dan warna genealogis. Mempertahankannya menghindari penghilangan unsur teks tanpa menambahkan klaim doktrinal.
- issue: Makna ungkapan רֵאשִׁית אֹנִים
  choice: buah pertama dari daya hidup mereka
  alternative: yang pertama dari kekuatan mereka; buah pertama dari keperkasaan mereka
  rationale: Ungkapan ini menyamakan anak sulung dengan hasil pertama dari daya generatif. Terjemahan utama menjaga metafora tersebut, sementara catatan kaki mempertahankan alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Susunan dua baris mempertahankan paralelisme mazmur; ‘kemah-kemah Ham’ sengaja dipertahankan sebagai citra puitis.
