  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan urutan dan makna Ibrani: אִם dipahami secara temporal sebagai “Ketika”; הֲרָגָם sebagai “Ia membunuh mereka”; וּדְרָשׁוּהוּ sebagai “mereka mencari Dia”; וְשָׁבוּ sebagai “mereka kembali”; dan וְשִׁחֲרוּ אֵל sebagai “mencari Allah dengan sungguh-sungguh.” Subjek dan objek ilahi yang tersirat/berakhiran dalam bahasa Ibrani tersampaikan dengan jelas tanpa menambahkan isi teologis.'
