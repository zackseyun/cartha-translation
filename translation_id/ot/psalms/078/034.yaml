id: PSA.78.34
reference: Psalms 78:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם הֲרָגָ֥/ם וּ/דְרָשׁ֑וּ/הוּ וְ֝/שָׁ֗בוּ וְ/שִֽׁחֲרוּ אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
translation:
  language: id
  text: Ketika Ia membunuh mereka, mereka mencari Dia; mereka kembali[a] dan mencari Allah dengan sungguh-sungguh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbalik”; dalam konteks, kata ini dapat menyiratkan pertobatan, tetapi arti dasarnya adalah “kembali.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “mencari sejak dini,” suatu ungkapan untuk mencari dengan tekun atau sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ketika
  rationale: Dalam konteks puitis-historis ini, אִם menyatakan keadaan yang berulang, bukan syarat hipotetis; karena itu, 'ketika' paling sesuai.
- source_word: הֲרָגָם
  choice: Ia membunuh mereka
  rationale: Kata הרג secara langsung berarti membunuh. Subjek orang ketiga tunggal merujuk kepada Allah dalam konteks.
- source_word: וּדְרָשׁוּהוּ
  choice: mereka mencari Dia
  rationale: דרש dengan objek pribadi lazim berarti mencari seseorang; akhiran objek yang merujuk kepada Allah dipertahankan.
- source_word: וְשָׁבוּ
  choice: mereka kembali
  rationale: שוב pada dasarnya berarti kembali atau berbalik. Pilihan ini mempertahankan keluasan makna tanpa secara eksplisit menafsirkannya sebagai pertobatan.
- source_word: וְשִׁחֲרוּ
  choice: mencari ... dengan sungguh-sungguh
  rationale: Dalam bentuk Piel, שחר dapat menggambarkan mencari sejak dini, dan secara idiomatis berarti mencari dengan tekun atau sungguh-sungguh.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini merupakan sebutan umum bagi Allah; 'Allah' adalah padanan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Apakah וְשָׁבוּ harus diterjemahkan dengan istilah pertobatan yang eksplisit
  choice: mereka kembali
  alternative: mereka bertobat; mereka berbalik
  rationale: Kata שוב dapat menyiratkan pertobatan dalam konteks, tetapi makna dasarnya ialah kembali atau berbalik. Terjemahan utama mempertahankan ketegangan itu tanpa memasukkan klaim teologis yang lebih tegas daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang sederhana dan bermartabat. Huruf kapital pada 'Ia' dan 'Dia' memperjelas bahwa acuannya adalah Allah; kedua catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
