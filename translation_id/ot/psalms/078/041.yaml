  yaml_path: translation/ot/psalms/078/041.yaml
  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
translation:
  language: id
  text: Mereka kembali mencobai Allah dan memprovokasi Yang Kudus Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani yang diterjemahkan “memprovokasi” ini jarang dan maknanya tidak pasti. Kata ini juga dapat diterjemahkan “membatasi” atau “memberi tanda pada”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: kembali
  rationale: 'Dalam rangkaian dengan verba berikutnya, שׁוב menyatakan pengulangan tindakan: mereka kembali atau sekali lagi mencobai Allah. Terjemahan ini alami dalam bahasa Indonesia dan tidak mengharuskan arti harfiah bahwa mereka berbalik arah.'
- source_word: וַיְנַסּוּ
  choice: mencobai
  rationale: נסה berarti menguji atau mencobai. Dalam konteks kecaman terhadap pemberontakan Israel, “mencobai” menyampaikan tindakan menantang Allah, bukan pengujian yang netral.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini adalah sebutan bagi Allah Israel. “Allah” merupakan padanan baku dan tidak menambahkan nuansa yang tidak dinyatakan secara tegas.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: Yang Kudus dari Israel
  rationale: Frasa ini adalah gelar ilahi yang menegaskan kekudusan Allah dan hubungan-Nya dengan Israel. Bentuk ini jelas, bermartabat, dan mempertahankan struktur gelarnya.
- source_word: הִתְווּ
  choice: menyakiti hati
  rationale: Verba Ibrani ini sangat jarang dan maknanya tidak pasti. Dalam kesejajaran dengan tindakan mencobai Allah, “menyakiti hati” mengungkapkan tindakan yang mendukakan atau menyakiti Dia, sambil menghindari kesan metafisis bahwa manusia benar-benar membatasi kuasa Allah.
theological_decisions:
- issue: Makna verba langka הִתְווּ
  choice: menyakiti hati
  alternative: membatasi; memberi tanda pada; membangkitkan murka
  rationale: Makna verba ini diperdebatkan. Konteks puitis mendukung gagasan bahwa Israel menyakiti, mendukakan, atau memprovokasi Allah. Karena “membatasi” memiliki sejarah penerjemahan yang penting tetapi tidak pasti secara leksikal dan dapat menyiratkan klaim teologis yang lebih jauh daripada teks, alternatif tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kembali mencobai” menyampaikan tindakan berulang secara alami; gelar “Yang Kudus dari Israel” dipertahankan. Ketidakpastian leksikal pada verba terakhir dijaga melalui catatan kaki.
