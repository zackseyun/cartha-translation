  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: id
  text: Ia memilih Daud, hamba-Nya, dan mengambilnya dari kandang-kandang domba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kandang-kandang ternak kecil.”
    reason: 'Alternatif leksikal: צֹאן dapat mencakup ternak kecil, khususnya domba dan kambing, sementara מִכְלְאֹת menunjuk kandang atau tempat tertutup bagi ternak.'
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Ia memilih
  rationale: Bentuk wayyiqtol Qal dari בחר menyatakan tindakan lampau dalam narasi. 'Memilih' adalah padanan Indonesia yang langsung dan tidak menambahkan tafsiran teologis.
- source_word: בְּדָוִד
  choice: Daud
  rationale: Nama diri ini mengikuti bentuk baku dalam Alkitab bahasa Indonesia.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: עבד dapat berarti hamba atau budak. Di sini kata tersebut merupakan sebutan terhormat bagi Daud dalam hubungannya dengan Allah, bukan penekanan pada status perbudakan.
- source_word: וַיִּקָּחֵהוּ
  choice: dan mengambilnya
  rationale: לקח pada dasarnya berarti 'mengambil'. Bentuk ini mempertahankan ungkapan langsung bahasa Ibrani dan peralihan Daud dari pekerjaan menggembalakan.
- source_word: מִמִּכְלְאֹת צֹאן
  choice: dari kandang-kandang domba
  rationale: מִכְלְאֹת menunjuk pada tempat-tempat berpagar bagi ternak, sedangkan צֹאן menunjuk pada ternak kecil, khususnya domba dan kambing. 'Kandang-kandang domba' alami dalam bahasa Indonesia dan sesuai dengan konteks penggembalaan, sementara alternatif leksikal dicatat dalam catatan kaki.
theological_decisions:
- issue: Status Daud sebagai עבד dalam hubungannya dengan Allah
  choice: hamba-Nya
  alternative: budak-Nya
  rationale: Konteks menyebut Daud sebagai orang yang menjadi milik dan melayani Allah, tetapi tidak menonjolkan perbudakan yang bersifat memaksa. 'Hamba-Nya' mempertahankan nuansa kehormatan dan pengabdian yang sesuai di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Bentuk jamak 'kandang-kandang' mempertahankan bentuk jamak Ibrani.
