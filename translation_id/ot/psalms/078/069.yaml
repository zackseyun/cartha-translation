  text: וַ/יִּ֣בֶן כְּמוֹ רָ֭מִים מִקְדָּשׁ֑/וֹ כְּ֝/אֶ֗רֶץ יְסָדָ֥/הּ לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/069.yaml
  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: id
  text: Ia membangun tempat kudus-Nya seperti tempat-tempat yang tinggi[a], seperti bumi yang didirikan-Nya untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “langit yang tinggi” atau “ketinggian-ketinggian yang menjulang.” Ungkapan Ibrani ini puitis dan dapat membangkitkan gambaran langit yang luhur atau puncak-puncak gunung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol dari בנה melanjutkan rangkaian tindakan dalam narasi. Dalam bahasa Indonesia, urutan ini dapat disampaikan secara alami tanpa harus menambahkan kata penghubung.
- source_word: כְּמוֹ
  choice: seperti
  rationale: Preposisi ini menyatakan perbandingan; “seperti” merupakan padanan Indonesia yang alami.
- source_word: רָמִים
  choice: tempat-tempat yang tinggi
  rationale: Bentuk jamak dari רום menunjuk kepada ketinggian atau hal-hal yang menjulang. Pilihan ini mempertahankan gambaran puitis tanpa membatasinya secara pasti pada langit atau pegunungan.
- source_word: מִקְדָּשׁוֹ
  choice: tempat kudus-Nya
  rationale: מקדש berarti tempat kudus atau tempat suci. Padanan ini cukup luas untuk menunjuk tempat kediaman Allah tanpa mempersempitnya hanya kepada bangunan Bait Allah.
- source_word: כְּאֶרֶץ
  choice: seperti bumi
  rationale: Dalam paralelisme kosmis ayat ini, ארץ paling wajar berarti bumi, yang digambarkan kokoh dan tetap.
- source_word: יְסָדָהּ
  choice: yang didirikan-Nya
  rationale: Kata יסד berarti meletakkan dasar, mendirikan, atau mengukuhkan. “Didirikan-Nya” mempertahankan metafora pembangunan dan merujuk kembali kepada bumi.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelanggengan; padanan tersebut alami, bermartabat, dan mempertahankan daya puitisnya.
theological_decisions:
- issue: Acuan dan gambaran dalam perbandingan tempat kudus
  choice: Tempat kudus Allah dibandingkan dengan tempat-tempat yang tinggi dan dengan bumi yang didirikan secara tetap.
  alternative: Tempat kudus itu secara khusus dibandingkan dengan langit yang tinggi atau dengan puncak-puncak gunung.
  rationale: רָמִים bersifat puitis dan tidak menentukan satu gambaran kosmologis secara mutlak. Terjemahan utama mempertahankan ketaksaan itu, sedangkan kemungkinan langit atau ketinggian yang menjulang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Susunan dua perbandingan dipertahankan agar paralelisme Ibraninya tetap terasa.
