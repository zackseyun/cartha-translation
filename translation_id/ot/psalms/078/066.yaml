  source_fidelity: Terjemahan utama mengubah fungsi yang paling langsung dari אָחוֹר. Dalam konstruksi ויך ... אחור, kata itu lazim dipahami sebagai keterangan tempat/sasaran, “di/pada bagian belakang” (bandingkan gambaran serangan dari belakang), bukan sebagai hasil kausatif “memukul mundur.” Terjemahan “memukul mundur” menambahkan gagasan bahwa musuh dipaksa mundur, yang tidak dinyatakan oleh verba נכה. Klausa kedua pada dasarnya setia pada חֶרְפַּת עוֹלָם נָתַן לָמוֹ.
