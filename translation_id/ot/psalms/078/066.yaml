  terminology: “Lawan-lawan-Nya” dan “kehinaan” sesuai dengan ragam puitis dan makna צָרָיו serta חֶרְפַּת. “Kehinaan yang kekal” secara wajar menyatakan עוֹלָם sebagai kehinaan yang menetap/berlangsung lama dalam konteks ini, tanpa menetapkan pengertian metafisis secara berlebihan.
