  text: He struck his foes backward[a]; he put everlasting disgrace on them.
translation:
  language: id
  text: Ia memukul lawan-lawan-Nya dari belakang[a]; Ia membuat mereka menanggung kehinaan yang kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Ia memukul lawan-lawan-Nya pada bagian belakang.” Kata Ibrani אָחוֹר dapat dipahami sebagai keterangan arah atau tempat: “ke belakang/dari belakang” atau “pada bagian belakang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Ia memukul
  rationale: Bentuk dari נכה ini menceritakan tindakan lampau. “Memukul” mempertahankan tindakan yang dinyatakan teks tanpa menambahkan bahwa para lawan dibunuh atau ditumpas.
- source_word: צָרָיו
  choice: lawan-lawan-Nya
  rationale: Kata ini menunjuk kepada para musuh atau pihak yang memusuhi-Nya. “Lawan-lawan-Nya” alami dalam bahasa Indonesia dan tetap sesuai dengan ragam puitis mazmur.
- source_word: אָחוֹר
  choice: mundur
  rationale: Kata ini dapat berfungsi sebagai keterangan arah, yaitu “mundur/ke belakang”. Ungkapan “memukul mundur” menyampaikan gambaran itu secara alami, sambil mempertahankan kemungkinan leksikal lain dalam catatan kaki.
- source_word: חֶרְפַּת עוֹלָם
  choice: kehinaan untuk selamanya
  rationale: Frasa konstruksi ini menyatakan cela atau kehinaan yang terus melekat. “Untuk selamanya” mencerminkan daya waktu עוֹלָם tanpa memaksakan rumusan metafisis.
- source_word: נָתַן לָמוֹ
  choice: Ia menimpakan ... kepada mereka
  rationale: Dalam konteks ini נתן dengan ל dapat menyatakan bahwa sesuatu dikenakan atau ditaruh atas seseorang. “Menimpakan” mengungkapkan pemberian hukuman berupa kehinaan secara wajar dalam bahasa Indonesia.
