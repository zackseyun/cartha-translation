  text: וַ/יַּהֲפֹ֣ךְ לְ֭/דָם יְאֹרֵי/הֶ֑ם וְ֝/נֹזְלֵי/הֶ֗ם בַּל יִשְׁתָּיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/044.yaml
  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: id
  text: Ia mengubah sungai-sungai mereka menjadi darah[a], dan mereka tidak dapat minum dari aliran-aliran air mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saluran-saluran Sungai Nil mereka”; dalam konteks Mesir, istilah Ibrani ini sering merujuk pada Sungai Nil atau saluran-salurannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: Ia mengubah
  rationale: Bentuk verba dari הפך menyatakan perubahan menjadi keadaan lain. “Mengubah” alami dalam bahasa Indonesia dan mempertahankan makna transformasi.
- source_word: לְדָם
  choice: menjadi darah
  rationale: Preposisi לְ menandai keadaan hasil; “menjadi darah” merupakan ungkapan Indonesia yang wajar setelah “mengubah”.
- source_word: יְאֹרֵיהֶם
  choice: sungai-sungai mereka
  rationale: יְאֹר dapat menunjuk pada Sungai Nil atau saluran-salurannya dalam konteks Mesir. “Sungai-sungai” jelas bagi pembaca umum, sedangkan kekhususan latar Mesir dipertahankan dalam catatan kaki.
- source_word: וְנֹזְלֵיהֶם
  choice: dari aliran-aliran air mereka
  rationale: Nomina yang berkaitan dengan נזל, “mengalir,” menunjuk pada air atau aliran yang mengalir. Preposisi “dari” ditambahkan secara idiomatis untuk menjelaskan hubungan objek yang didahulukan dalam bahasa Ibrani dengan verba “minum”.
- source_word: בַּל יִשְׁתָּיוּן
  choice: mereka tidak dapat minum
  rationale: Partikel negatif puitis בַּל bersama bentuk imperfek dalam konteks ini menyatakan bahwa air itu tidak dapat diminum; “tidak dapat minum” menyampaikan akibat praktisnya secara alami.
theological_decisions: []
