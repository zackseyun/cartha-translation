  yaml_path: translation/ot/psalms/078/065.yaml
  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: id
  text: 'Lalu Tuhan bangun seolah-olah dari tidur,

    seperti seorang prajurit yang berseru nyaring karena anggur.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti seorang perkasa yang bersorak karena anggur”; atau “seperti seorang pejuang yang berseru karena anggur.”'
    reason: 'Alternatif leksikal untuk כְּגִבּוֹר מִתְרוֹנֵן מִיָּיִן: גִּבּוֹר dapat berarti orang perkasa atau pejuang, dan מִתְרוֹנֵן dapat menyatakan seruan nyaring atau sorak kegirangan.'
lexical_decisions:
- source_word: וַיִּקַץ
  choice: terjaga
  rationale: Kata kerja יקץ berarti bangun atau terjaga dari tidur. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gambaran puitisnya.
- source_word: כְּיָשֵׁן
  choice: seperti orang yang tertidur
  rationale: Prefiks כְּ menandai perbandingan. Terjemahan ini mempertahankan bentuk perumpamaan dan tidak menyatakan bahwa Tuhan benar-benar tidur.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Ini adalah gelar ilahi Adonai, bukan Tetragramaton; karena itu digunakan bentuk “Tuhan”, bukan “TUHAN”.
- source_word: כְּגִבּוֹר
  choice: seperti seorang kesatria
  rationale: גִּבּוֹר dapat menunjuk kepada orang perkasa atau pejuang. “Kesatria” menyampaikan sosok pejuang yang kuat secara hidup dan wajar dalam konteks ini.
- source_word: מִתְרוֹנֵן
  choice: yang berteriak lantang
  rationale: Bentuk partisip ini menggambarkan seruan nyaring dan mungkin bernuansa sorak kegirangan. “Berteriak lantang” cocok dengan gambaran pejuang tanpa meniadakan alternatif “bersorak-sorai” yang dicatat dalam catatan kaki.
- source_word: מִיָּיִן
  choice: karena anggur
  rationale: 'Preposisi מִן di sini paling wajar menyatakan sebab atau pengaruh: seruan itu timbul karena anggur. Ungkapan ini jelas dalam bahasa Indonesia modern, sementara ketaksaan nuansa frasa tetap dicatat.'
theological_decisions:
- issue: Penggambaran antropomorfis tentang Tuhan yang terjaga dan perbandingan dengan kesatria yang dipengaruhi anggur
  choice: Mempertahankan perumpamaan sebagai gambaran antropomorfis puitis tanpa melunakkannya.
  alternative: Memparafrasakan ayat untuk menghilangkan antropomorfisme atau menafsirkan anggur secara metaforis di luar perumpamaan.
  rationale: Mazmur ini memakai gambaran puitis yang berani untuk melukiskan campur tangan Tuhan yang tegas setelah Ia tampak tidak bertindak. Ketegangan teologis dan daya sastra teks perlu dipertahankan, bukan dijelaskan hingga hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua baris mempertahankan paralelisme puisi Ibrani. “Tuhan” dibedakan dari bentuk “TUHAN” yang lazim dipakai untuk Tetragramaton.
