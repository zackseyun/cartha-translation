  text: sebab mereka tidak percaya kepada Allah dan tidak mengandalkan keselamatan-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  choice: percaya kepada Allah
  rationale: Preposisi ב setelah bentuk hiphil אמן menyatakan bahwa Allah adalah pribadi yang menjadi sasaran iman atau kepercayaan; ungkapan Indonesia ini alami dan tidak mengubahnya menjadi sekadar percaya bahwa Allah ada.
- source_word: בָטְחוּ
  choice: mengandalkan
  rationale: בטח menyatakan menaruh rasa aman atau kepercayaan pada sesuatu. “Mengandalkan” membedakannya secara wajar dari klausa pertama sekaligus mempertahankan paralelismenya.
- source_word: בִּישׁוּעָתוֹ
  choice: keselamatan dari-Nya
  rationale: Nomina dengan sufiks pronominal secara harfiah berarti “keselamatan-Nya”. Dalam konteks ini, “keselamatan dari-Nya” menyampaikan bahwa Allah merupakan sumber atau pelaku penyelamatan tanpa menyiratkan bahwa Allah sendiri perlu diselamatkan.
theological_decisions:
- issue: Makna percaya kepada Allah
  choice: percaya kepada Allah
  alternative: memercayai Allah
  rationale: Teks memakai konstruksi אמן + ב, yang secara langsung menunjuk kepada Allah sebagai tumpuan iman. Pilihan ini mempertahankan nuansa tersebut dan selaras dengan revisi konsultasi yang diaudit.
- issue: Relasi sufiks posesif pada “keselamatan-Nya”
  choice: keselamatan dari-Nya
  alternative: keselamatan-Nya
  rationale: Genitif sumber paling alami dalam bahasa Indonesia pada konteks ini, tetapi tetap mempertahankan Allah sebagai pemilik/pemberi keselamatan tanpa menambahkan doktrin khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Konjungsi “sebab” mempertahankan hubungan kausal dengan ayat sebelumnya; paralelisme kedua klausa dijaga dengan “percaya” dan “mengandalkan”.
