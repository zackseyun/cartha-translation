id: PSA.78.53
reference: Psalms 78:53
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּנְחֵ֣/ם לָ֭/בֶטַח וְ/לֹ֣א פָחָ֑דוּ וְ/אֶת א֝וֹיְבֵי/הֶ֗ם כִּסָּ֥ה הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/053.yaml
  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
translation:
  language: id
  text: Ia menuntun mereka dengan aman, dan mereka tidak takut; laut menutupi musuh-musuh mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Ia menuntun mereka
  rationale: Bentuk dari נחה berarti ‘menuntun/membimbing’; ‘menuntun’ menyampaikan gerak nyata dalam konteks eksodus secara alami.
- source_word: לָבֶטַח
  choice: dengan aman
  rationale: בֶּטַח menyatakan keamanan atau keselamatan; dengan prefiks ל bentuk ini menerangkan cara Allah menuntun mereka.
- source_word: וְלֹא פָחָדוּ
  choice: dan mereka tidak takut
  rationale: Mempertahankan koordinasi sederhana dengan וְ dan arti langsung פחד tanpa mengubahnya menjadi hubungan hasil yang eksplisit.
- source_word: אֹיְבֵיהֶם
  choice: musuh-musuh mereka
  rationale: Padanan Indonesia yang langsung dan lazim untuk אויב dengan sufiks orang ketiga jamak.
- source_word: כִּסָּה
  choice: menutupi
  rationale: כסּה secara konkret berarti ‘menutupi’; pilihan ini mempertahankan gambaran air laut yang menutupi para musuh.
- source_word: הַיָּם
  choice: laut
  rationale: Teks Ibrani hanya memakai nomina definit ‘laut itu/laut’; konteks bahasa Indonesia memungkinkan ‘laut’ tanpa menambahkan nama khusus.
theological_decisions:
- issue: Kiasan historis kepada penyeberangan laut dalam peristiwa eksodus
  choice: Memakai ‘laut’ tanpa nama khusus.
  alternative: Laut Merah; Laut Teberau
  rationale: Walaupun acuannya jelas merupakan peristiwa eksodus, ayat Ibrani ini hanya menyebut הַיָּם, sehingga terjemahan tidak mempersempit identifikasinya dalam teks utama.
- issue: Hubungan antara tuntunan yang aman dan ketiadaan rasa takut
  choice: Mempertahankan ‘dan’ sebagai koordinasi.
  alternative: ‘sehingga mereka tidak takut’
  rationale: וְ secara eksplisit mengoordinasikan klausa. Hubungan hasil mungkin tersirat, tetapi tidak perlu ditegaskan oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kata ganti ‘Ia’ merujuk kepada Allah sesuai konteks mazmur. Tidak diperlukan catatan kaki karena teks utama ‘laut’ sudah mempertahankan ketidakspesifikan sumber Ibrani.
