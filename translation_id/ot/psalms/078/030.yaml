  text: לֹא זָר֥וּ מִ/תַּאֲוָתָ֑/ם ע֝֗וֹד אָכְלָ֥/ם בְּ/פִי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/030.yaml
  text: They had not yet turned away from their craving[a]; their food was still in their mouths.
translation:
  language: id
  text: Mereka belum berpaling dari keinginan mereka[a]; makanan mereka masih ada di mulut mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka belum terasing dari keinginan mereka.” Kata kerja Ibrani ini secara lebih harfiah dapat diterjemahkan demikian, tetapi dalam konteks ini kemungkinan maksudnya ialah bahwa mereka belum berpaling atau berhenti dari keinginan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָרוּ
  choice: berpaling
  rationale: Kata kerja זור dengan preposisi מִן di sini menyatakan menjauh atau beralih dari sesuatu. “Berpaling” mempertahankan gambaran verbal Ibrani sekaligus wajar dalam bahasa Indonesia.
- source_word: מִתַּאֲוָתָם
  choice: dari keinginan mereka
  rationale: תַּאֲוָה berarti keinginan, hasrat, atau nafsu. Dalam konteks tuntutan rakus akan makanan, “keinginan” cukup luas dan alami tanpa menimbulkan konotasi seksual yang tidak diperlukan.
- source_word: עוֹד
  choice: masih
  rationale: 'Kata ini menandai keadaan yang terus berlangsung pada saat itu: makanan mereka masih berada di mulut.'
- source_word: אָכְלָם
  choice: makanan mereka
  rationale: Bentuk ini berasal dari אֹכֶל, “makanan,” dengan sufiks kepunyaan orang ketiga jamak.
- source_word: בְּפִיהֶם
  choice: di mulut mereka
  rationale: Terjemahan ini alami dalam bahasa Indonesia; “mulut” lazim tetap berbentuk tunggal meskipun mengacu kepada sekelompok orang.
