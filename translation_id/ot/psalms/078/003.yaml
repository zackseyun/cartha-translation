  register: Bahasa Indonesia modern, jelas, dan bermartabat. Paralelisme Ibrani dipertahankan; “leluhur” dipilih agar cakupan generasional אֲבוֹתֵינוּ tidak dipersempit menjadi ayah biologis saja.
