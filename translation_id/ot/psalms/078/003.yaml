  yaml_path: translation/ot/psalms/078/003.yaml
  text: that we have heard and known, and our fathers have told us—
translation:
  language: id
  text: 'yang telah kami dengar dan ketahui,

    dan yang telah diceritakan leluhur kami kepada kami.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini meneruskan objek dari ayat sebelumnya; “yang” paling alami dalam bahasa Indonesia dan menjaga hubungan sintaktis tersebut.
- source_word: שָׁמַעְנוּ וַנֵּדָעֵם
  choice: telah kami dengar dan ketahui
  rationale: Mempertahankan dua verba Ibrani yang sejajar dan aspek pengalaman yang sudah dimiliki oleh penutur; sufiks objek jamak tercakup oleh klausa relatif “yang”.
- source_word: אֲבוֹתֵינוּ
  choice: leluhur kami
  rationale: Dalam konteks pewarisan tradisi antargenerasi, istilah ini menunjuk para pendahulu atau nenek moyang, bukan hanya ayah biologis.
- source_word: סִפְּרוּ לָנוּ
  choice: telah diceritakan ... kepada kami
  rationale: Menyampaikan tindakan menceritakan atau menuturkan kepada generasi berikutnya secara alami dalam bahasa Indonesia.
theological_decisions: []
