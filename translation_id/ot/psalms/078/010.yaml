  text: לֹ֣א שָׁ֭מְרוּ בְּרִ֣ית אֱלֹהִ֑ים וּ֝/בְ/תוֹרָת֗/וֹ מֵאֲנ֥וּ לָ/לֶֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/010.yaml
  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: id
  text: Mereka tidak memegang perjanjian Allah dan menolak untuk hidup menurut hukum-Nya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajaran-Nya” atau “petunjuk-Nya”; kata Ibrani torah dapat berarti hukum, ajaran, atau petunjuk Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: memegang
  rationale: Dalam hubungan dengan בְּרִית, kata ini menyatakan memelihara atau menaati perjanjian. “Memegang perjanjian” mempertahankan gambaran Ibrani sekaligus menyampaikan kesetiaan pada kewajiban perjanjian.
- source_word: בְּרִית אֱלֹהִים
  choice: perjanjian Allah
  rationale: Frasa konstruksi ini menunjuk pada perjanjian yang berasal dari atau ditetapkan oleh Allah; bentuk ini alami dan tetap bernada luhur dalam bahasa Indonesia.
- source_word: וּבְתוֹרָתוֹ
  choice: menurut hukum-Nya
  rationale: תּוֹרָה dapat berarti hukum, ajaran, atau petunjuk. Dalam konteks ketaatan pada perjanjian, “hukum” mempertahankan daya normatifnya; preposisi בְּ dalam ungkapan berjalan menyatakan pedoman atau jalan hidup, sehingga alami diterjemahkan “menurut”.
- source_word: מֵאֲנוּ
  choice: menolak
  rationale: Kata ini menyatakan penolakan atau ketidaksediaan yang disengaja; “menolak” jelas dan kuat dalam bahasa Indonesia modern.
- source_word: לָלֶכֶת
  choice: untuk hidup
  rationale: Secara harfiah berarti “untuk berjalan,” tetapi dalam konteks moral menunjuk pada perilaku atau cara menjalani hidup. “Hidup” menyampaikan idiom tersebut secara alami tanpa menghilangkan makna etisnya.
- source_word: לֹא
  choice: tidak
  rationale: Negasi langsung ini diterjemahkan secara lugas dengan “tidak”.
theological_decisions:
- issue: Makna תּוֹרָה dalam konteks perjanjian
  choice: hukum
  alternative: ajaran atau petunjuk
  rationale: Pasangan antara memegang perjanjian dan hidup menurut תּוֹרָה menonjolkan kewajiban normatif umat. Namun, karena cakupan kata Ibrani lebih luas daripada peraturan hukum saja, alternatif “ajaran” dicatat tanpa mempersempit maknanya secara dogmatis.
- issue: Ungkapan metaforis berjalan dalam hukum Allah
  choice: hidup menurut hukum-Nya
  alternative: berjalan menurut hukum-Nya
  rationale: הלך di sini menggambarkan seluruh perilaku hidup. Pilihan “hidup menurut” menyampaikan fungsi metafora itu dengan bahasa Indonesia modern, sedangkan terjemahan harfiah tetap mungkin tetapi lebih bercorak idiom Alkitab.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan paralel ayat dipertahankan, sementara idiom “berjalan” dialihkan menjadi “hidup menurut” agar segera dipahami pembaca modern. Penanda catatan kaki ditempatkan tepat setelah istilah yang diterangkannya.
