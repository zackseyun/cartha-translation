  yaml_path: translation/ot/psalms/078/063.yaml
  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: id
  text: Api melalap para pemudanya, dan gadis-gadisnya tidak dipuji dalam nyanyian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak dirayakan.” Kemungkinan besar maksudnya ialah tidak ada nyanyian pernikahan bagi para gadis itu karena kehancuran yang terjadi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: para pemudanya
  rationale: בָּחוּר menunjuk kepada laki-laki muda yang berada pada masa prima, sering dalam konteks peperangan atau usia menikah. “Para pemudanya” alami dalam bahasa Indonesia dan seimbang dengan “gadis-gadisnya” pada baris berikutnya.
- source_word: אָכְלָה אֵשׁ
  choice: Api melalap
  rationale: Dengan אֵשׁ sebagai subjek, אָכַל secara idiomatis berarti menghanguskan atau menghabiskan. “Api melalap” mempertahankan gambaran kuat dari ungkapan Ibrani dan terdengar alami dalam bahasa Indonesia.
- source_word: וּבְתוּלֹתָיו
  choice: dan gadis-gadisnya
  rationale: בְּתוּלָה dapat berarti perawan atau gadis muda yang belum menikah. “Gadis-gadisnya” lebih alami dan bermartabat dalam bahasa Indonesia, sekaligus mempertahankan kesejajaran dengan para pemuda tanpa membuat ayat terdengar klinis.
- source_word: לֹא הוּלָּלוּ
  choice: tidak dirayakan dengan nyanyian
  rationale: Bentuk Pual dari הלל menyatakan bahwa mereka tidak dipuji atau dirayakan. Tambahan “dengan nyanyian” menyampaikan kemungkinan kuat adanya nyanyian pernikahan, tetapi kata “pernikahan” tidak dimasukkan ke teks utama agar cakupan ungkapan Ibrani tidak dipersempit secara berlebihan.
