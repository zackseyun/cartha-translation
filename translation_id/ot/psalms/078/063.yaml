translation_notes:
  register: Bahasa Indonesia modern, jelas, dan puitis. “Melalap” mempertahankan daya gambaran api, sedangkan “dirayakan dengan nyanyian” menjaga hubungan dengan akar הלל dan menyisakan penjelasan konteks pernikahan untuk catatan kaki.
