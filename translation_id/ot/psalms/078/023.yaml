  text: וַ/יְצַ֣ו שְׁחָקִ֣ים מִ/מָּ֑עַל וְ/דַלְתֵ֖י שָׁמַ֣יִם פָּתָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/023.yaml
  text: Yet he commanded the clouds above[b][a], and opened the doors of heaven.
translation:
  language: id
  text: 'Namun, Ia memberi perintah kepada awan-awan di atas[a]

    dan membuka pintu-pintu langit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “langit di atas”.'
    reason: שְׁחָקִים dapat menunjuk awan-awan maupun langit.
  - marker: b
    text: 'Atau: “gerbang-gerbang langit”.'
    reason: Dalam gambaran puitis ini, דַלְתֵי secara harfiah berarti 'pintu-pintu', sedangkan 'gerbang-gerbang' merupakan padanan kontekstual yang mungkin.
lexical_decisions:
- source_word: וַיְצַו
  choice: memberi perintah kepada
  rationale: Kata צוה menyatakan tindakan memerintah atau memberi perintah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tindakan Allah yang berotoritas.
- source_word: שְׁחָקִים
  choice: awan-awan
  rationale: שׁחקים dapat berarti awan-awan atau langit. Dalam konteks turunnya manna dan gambaran pintu-pintu langit, 'awan-awan' memberi gambaran konkret tanpa meniadakan alternatif leksikalnya.
- source_word: מִמָּעַל
  choice: di atas
  rationale: Bentuk ini menunjukkan lokasi di atas atau di tempat tinggi. 'Awan-awan di atas' merupakan susunan yang alami dan mempertahankan hubungan katanya.
- source_word: דַלְתֵי
  choice: pintu-pintu
  rationale: Bentuk jamak konstruksi dari דלת paling langsung berarti 'pintu-pintu'. Pilihan ini mempertahankan metafora Ibrani tanpa menggantinya dengan istilah yang lebih bebas.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam konteks ini שמים menunjuk bentangan langit yang secara puitis digambarkan mempunyai pintu-pintu. 'Langit' alami dalam bahasa Indonesia dan sesuai dengan gambaran turunnya makanan dari atas.
- source_word: פָּתָח
  choice: membuka
  rationale: פתח secara langsung berarti 'membuka'; bentuk lampau naratif Ibrani dapat diterjemahkan secara alami dengan verba Indonesia tanpa penanda kala khusus.
- source_word: וַ
  choice: Namun
  rationale: Walaupun waw dapat berarti 'dan', konteks Mazmur 78 mengontraskan ketidakpercayaan Israel dengan tindakan Allah yang tetap menyediakan makanan. 'Namun' menyampaikan hubungan wacana tersebut tanpa mengubah isi tindakan.
theological_decisions:
- issue: Daya wacana waw awal dalam konteks ketidakpercayaan Israel dan pemeliharaan Allah
  choice: Diterjemahkan secara adversatif sebagai 'Namun'
  alternative: '''Dan'' atau ''Lalu'''
  rationale: Konjungsi Ibrani memiliki cakupan luas, tetapi konteks ayat-ayat sebelumnya membentuk kontras antara ketidakpercayaan umat dan tindakan Allah. Pilihan ini mempertahankan ketegangan naratif tanpa menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pemenggalan dua baris mempertahankan paralelisme ayat. Kapitalisasi 'Ia' mengikuti gaya hormat yang lazim bagi rujukan kepada Allah, tanpa menambahkan unsur yang tidak ada dalam teks.
