  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: id
  text: Mereka tidak mengingat tangan-Nya[a]—hari ketika Dia menebus mereka dari musuh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuasa-Nya” atau “apa yang telah dilakukan tangan-Nya.” Secara harfiah, teks Ibrani berbunyi “tangan-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “lawan” atau “penindas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  choice: mengingat
  rationale: Bentuk Qal זכר berarti “mengingat” atau “mengenang.” Dengan לֹא, terjemahan “tidak mengingat” mempertahankan susunan dan nuansa sumber dengan lebih langsung daripada “melupakan.”
- source_word: יָדוֹ
  choice: tangan-Nya
  rationale: Kata “tangan” merupakan gambaran konkret yang lazim bagi kuasa atau tindakan. Mempertahankan metafora ini setia pada teks Ibrani dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: יוֹם אֲשֶׁר
  choice: pada hari ketika
  rationale: Ungkapan ini mempertahankan unsur temporal “hari” sekaligus menghasilkan hubungan anak kalimat yang wajar dalam bahasa Indonesia.
- source_word: פָּדָם
  choice: Dia menebus mereka
  rationale: פדה menunjuk pada tindakan menebus, membebaskan, atau melepaskan dari bahaya maupun penindasan. “Menebus” mempertahankan bobot leksikalnya dalam konteks keluaran tanpa mempersempitnya kepada penafsiran doktrinal tertentu.
- source_word: מִנִּי צָר
  choice: dari lawan
  rationale: צָר dapat berarti lawan, musuh, atau penindas. “Lawan” ringkas dan sesuai dengan laras puitis, sementara catatan kaki mempertahankan alternatif yang sah.
theological_decisions:
- issue: Daya metaforis “tangan-Nya”
  choice: Metafora dipertahankan sebagai “tangan-Nya.”
  alternative: kuasa-Nya; apa yang telah dilakukan tangan-Nya
  rationale: Teks Ibrani memakai gambaran konkret “tangan.” Mempertahankannya menghindari penafsiran berlebihan, sedangkan kemungkinan maknanya dijelaskan dalam catatan kaki.
- issue: Arti פדה dalam konteks keluaran
  choice: Diterjemahkan “menebus.”
  alternative: membebaskan; melepaskan
  rationale: “Menebus” mempertahankan gema tindakan penyelamatan Allah terhadap Israel tanpa memasukkan klaim teologis yang melampaui ayat tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis yang sederhana dan bermartabat. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab berbahasa Indonesia. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
