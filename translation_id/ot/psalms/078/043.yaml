lexical_decisions:
- source_word: אֲשֶׁר
  choice: ketika
  rationale: Dalam konteks ayat 42–43, partikel relatif ini memperkenalkan tindakan Allah yang seharusnya diingat dan secara alami berfungsi temporal dalam bahasa Indonesia.
- source_word: שָׂם
  choice: mengadakan
  rationale: Kata kerja שׂוּם secara dasar berarti menaruh atau menetapkan; dalam konteks tanda-tanda ilahi, 'mengadakan' terdengar alami tanpa mempersempit maknanya menjadi sekadar 'melakukan mukjizat'.
- source_word: בְּמִצְרַיִם
  choice: di Mesir
  rationale: Preposisi בְּ menyatakan lokasi; nuansa 'terhadap Mesir' tidak perlu dimasukkan.
- source_word: אֹתוֹתָיו
  choice: tanda-tanda-Nya
  rationale: Mempertahankan arti leksikal אוֹת dan membedakannya dari מוֹפֵת pada frasa sejajar berikutnya.
- source_word: וּמוֹפְתָיו
  choice: dan keajaiban-keajaiban-Nya
  rationale: '''Keajaiban'' menyampaikan karya menakjubkan atau tanda ajaib dan tetap dibedakan dari ''tanda-tanda''.'
- source_word: בִּשְׂדֵה
  choice: di daerah
  rationale: Bentuk tunggal konstruktus שְׂדֵה secara idiomatis menunjuk kawasan atau wilayah sekitar sebuah kota; 'di daerah' lebih alami daripada 'di ladang' dalam bahasa Indonesia modern.
- source_word: צֹעַן
  choice: Zoan
  rationale: Nama tempat Ibrani ditransliterasikan; identifikasi dengan Tanis dijelaskan dalam catatan kaki.
