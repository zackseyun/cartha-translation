  yaml_path: translation/ot/psalms/078/001.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: id
  text: Maskil Asaf.[a] Dengarkanlah pengajaran-Ku, hai umat-Ku; condongkanlah telingamu kepada perkataan mulut-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maskil adalah istilah teknis dalam judul mazmur Ibrani. Makna tepatnya tidak pasti; istilah ini mungkin menunjuk pada suatu komposisi yang bersifat mengajar atau perenungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Nyanyian pengajaran
  rationale: Istilah teknis pada judul mazmur ini mungkin menunjuk pada karya yang bersifat mengajar atau perenungan. Terjemahan ini menyampaikan kemungkinan makna utamanya dalam bahasa Indonesia yang wajar, sementara ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: לְאָסָף
  choice: Asaf
  rationale: Dalam judul mazmur, לְ dapat menandai kepengarangan, hubungan, atau peruntukan. Susunan 'Nyanyian pengajaran Asaf' tetap wajar dan tidak memerinci hubungan itu secara berlebihan.
- source_word: הַאֲזִינָה
  choice: Dengarkanlah
  rationale: Imperatif ini meminta perhatian sungguh-sungguh. 'Dengarkanlah' alami dalam bahasa Indonesia modern dan mempertahankan nada ajakan yang khidmat.
- source_word: עַמִּי
  choice: hai umatku
  rationale: Akhiran posesif berarti 'umatku'. Kata seru 'hai' menandai sapaan langsung secara alami dalam ragam puitis Indonesia tanpa mengubah isinya.
- source_word: תּוֹרָתִי
  choice: pengajaranku
  rationale: תּוֹרָה di sini lebih luas daripada hukum tertulis dan menunjuk pada ajaran atau petunjuk; konteks mazmur mendukung 'pengajaran'.
- source_word: הַטּוּ
  choice: arahkanlah
  rationale: Kata kerja ini secara harfiah menggambarkan mencondongkan atau mengarahkan telinga untuk menyimak. 'Arahkanlah' mempertahankan metafora dengan bahasa Indonesia yang alami.
- source_word: אָזְנְכֶם
  choice: telingamu
  rationale: Bentuk Ibrani merujuk kepada umat secara jamak, tetapi bahasa Indonesia tidak menandai jumlah pada sufiks posesif. Bentuk ini alami karena 'umatku' diperlakukan sebagai sapaan kolektif.
- source_word: לְאִמְרֵי
  choice: kepada perkataan
  rationale: '''Perkataan'' jelas dan sesuai dengan gaya puitis, serta mempertahankan kesejajaran dengan pengajaran pada baris pertama.'
- source_word: פִי
  choice: mulutku
  rationale: Terjemahan konkret ini mempertahankan citra tubuh dan kesejajaran puitis antara telinga para pendengar dan mulut pembicara.
