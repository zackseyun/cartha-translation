id: PSA.78.11
reference: Psalms 78:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁכְּח֥וּ עֲלִילוֹתָ֑י/ו וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר הֶרְאָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/011.yaml
  text: They forgot his deeds[b][a], and his wonders that he had shown them.
translation:
  language: id
  text: Mereka melupakan perbuatan-perbuatan-Nya[a] dan keajaiban-keajaiban-Nya[b] yang telah diperlihatkan-Nya kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tindakan-tindakan-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “perbuatan-perbuatan-Nya yang menakjubkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: Mereka melupakan
  rationale: Bentuk wayyiqtol Qal orang ketiga jamak menyatakan tindakan lampau dalam rangkaian narasi. 'Melupakan' menyampaikan makna langsung שׁכח tanpa menafsirkannya sebagai pengabaian yang disengaja.
- source_word: עֲלִילוֹתָיו
  choice: perbuatan-perbuatan-Nya
  rationale: עֲלִילוֹת menunjuk pada tindakan atau perbuatan. Pilihan ini alami dalam bahasa Indonesia dan cukup luas untuk mencakup karya Allah dalam sejarah.
- source_word: וְנִפְלְאוֹתָיו
  choice: dan keajaiban-keajaiban-Nya
  rationale: נִפְלָאוֹת, dari akar פלא, menunjuk pada hal atau tindakan yang menakjubkan. 'Keajaiban-keajaiban' mempertahankan keluasan istilah dan tidak mempersempitnya hanya menjadi mukjizat.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata relatif ini secara alami diterjemahkan 'yang' dan memperkenalkan klausa yang menerangkan keajaiban-keajaiban tersebut.
- source_word: הֶרְאָם
  choice: telah diperlihatkan-Nya kepada mereka
  rationale: Bentuk Hifil perfektum orang ketiga tunggal dengan sufiks orang ketiga jamak secara harfiah berarti 'Ia menyebabkan mereka melihat'. Bentuk pasif idiomatis ini jelas dan wajar dalam bahasa Indonesia, sedangkan 'telah' menandai bahwa tindakan itu mendahului tindakan melupakan.
theological_decisions:
- issue: Rujukan sufiks pronominal pada עֲלִילוֹתָיו dan נִפְלְאוֹתָיו
  choice: 'Sufiks diterjemahkan sebagai milik Allah: ''perbuatan-perbuatan-Nya ... keajaiban-keajaiban-Nya''.'
  alternative: Mengulang nama 'Allah' atau 'TUHAN'.
  rationale: Dalam konteks mazmur, sufiks tersebut merujuk kepada Allah. Mempertahankan bentuk pronominal mengikuti teks Ibrani dan tidak menambahkan nama ilahi yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pengulangan bentuk jamak menjaga cakupan kolektif kedua nomina Ibrani. Kapitalisasi '-Nya' menandai rujukan kepada Allah sesuai kebiasaan ejaan religius Indonesia.
