  yaml_path: translation/ot/psalms/078/067.yaml
  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: id
  text: Lalu Ia menolak[a] kemah Yusuf[b], dan tidak memilih suku Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia mencampakkan kemah Yusuf.”'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah Efraim sebagai suku utama di antara suku-suku keturunan Yusuf. Ayat ini mendahului pemilihan Yehuda dan Sion dalam konteks berikutnya.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: Lalu Ia menolak
  rationale: Kata מָאַס dapat berarti menolak, memandang hina, atau mencampakkan. “Menolak” jelas dan wajar dalam bahasa Indonesia serta tidak melebihkan unsur penghinaan; “lalu” menyampaikan gerak maju narasi dari bentuk wayyiqtol.
- source_word: בְּאֹהֶל יוֹסֵף
  choice: kemah Yusuf
  rationale: אֹהֶל secara harfiah berarti “kemah”. Mempertahankan gambaran konkret ini lebih setia daripada menafsirkannya langsung sebagai “kaum” atau “wilayah”, meskipun dalam konteksnya ungkapan ini merujuk secara metonimis pada pusat kediaman atau lingkungan suku-suku Yusuf.
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: suku Efraim
  rationale: שֵׁבֶט dapat berarti suku, tongkat, atau tongkat kerajaan. Bersama nama Efraim dan sejajar dengan “kemah Yusuf”, arti “suku” paling sesuai dengan konteks.
- source_word: לֹא בָחָר
  choice: tidak memilih
  rationale: בָּחַר berarti memilih atau menetapkan pilihan. “Tidak memilih” merupakan padanan langsung dan mempertahankan bahasa pilihan ilahi tanpa memasukkan istilah teologis yang lebih khusus.
theological_decisions:
- issue: Makna historis-teologis penolakan dan pemilihan pusat kesukuan Israel oleh Allah
  choice: Ayat diterjemahkan secara konkret sebagai penolakan terhadap kemah Yusuf dan tidak dipilihnya suku Efraim sebagai pusat yang dikehendaki.
  alternative: Memahami Yusuf dan Efraim secara langsung sebagai lambang seluruh kerajaan utara.
  rationale: Mazmur 78 mengisahkan sejarah Israel dan, dalam ayat-ayat berikutnya, mengontraskan Efraim dengan pemilihan Yehuda dan Sion. Teks utama mempertahankan bahasa kesukuan Ibrani sehingga cakupan historisnya dapat dipahami dari konteks tanpa menutup kemungkinan nuansa yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis-naratif yang lugas dan bermartabat. Kapitalisasi “Ia” dipakai untuk rujukan kepada Allah. Urutan penanda catatan kaki dibuat [a][b] agar sesuai dengan urutan catatan yang disajikan.
