  yaml_path: translation/ot/psalms/078/028.yaml
  text: He made it fall in the midst of their camp[a], all around their dwellings.
translation:
  language: id
  text: Ia menjatuhkannya di tengah perkemahan mereka[a], di sekeliling tempat tinggal mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perkemahannya” dan “tempat tinggalnya”; sufiks kepunyaan tunggal itu tampaknya merujuk secara kolektif kepada Israel sebagai satu umat, sehingga diterjemahkan “mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: Ia menjatuhkannya
  rationale: Bentuk Hifil dari נפל bersifat kausatif, sehingga diterjemahkan “menjatuhkannya.” Akhiran “-nya” merujuk pada apa yang diterbangkan Allah dalam ayat sebelumnya.
- source_word: בְּקֶרֶב
  choice: di tengah
  rationale: Ungkapan ini menunjukkan lokasi di bagian dalam atau tengah, bukan sekadar kedekatan.
- source_word: מַחֲנֵהוּ
  choice: perkemahan mereka
  rationale: Akhiran Ibrani berbentuk tunggal, tetapi secara kolektif merujuk pada umat Israel; bentuk jamak lebih alami dalam bahasa Indonesia.
- source_word: סָבִיב
  choice: di sekeliling
  rationale: Kata ini menggambarkan penyebaran yang mengitari perkemahan.
- source_word: לְמִשְׁכְּנֹתָיו
  choice: tempat-tempat kediaman mereka
  rationale: מִשְׁכָּן di sini menunjuk secara umum pada tempat tinggal. Pilihan ini mempertahankan cakupan makna tanpa mempersempitnya menjadi “kemah-kemah.”
