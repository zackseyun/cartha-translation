  text: Yet they tested God Most High and rebelled[c][b][a], and they did not keep his testimonies.
translation:
  language: id
  text: Namun mereka menguji Allah Yang Mahatinggi dan memberontak terhadap-Nya; mereka tidak menaati ketetapan-ketetapan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kesaksian-kesaksian-Nya”; dapat juga diterjemahkan “peraturan-peraturan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: mereka menguji
  rationale: Kata נסה berarti menguji atau mencoba. “Menguji” jelas dalam bahasa Indonesia modern dan mempertahankan nada tuduhan dalam konteks ketidaksetiaan umat kepada Allah.
- source_word: וַיַּמְרוּ
  choice: dan memberontak terhadap-Nya
  rationale: Kata מרה menyatakan pembangkangan atau perlawanan. Frasa “memberontak terhadap-Nya” alami dalam bahasa Indonesia serta memperjelas bahwa Allah adalah sasaran pemberontakan itu.
- source_word: אֶת אֱלֹהִים עֶלְיוֹן
  choice: Allah Yang Mahatinggi
  rationale: Terjemahan ini mempertahankan gelar ilahi yang menegaskan keluhuran Allah dan berfungsi alami sebagai objek langsung dari “menguji”.
- source_word: וְעֵדוֹתָיו
  choice: ketetapan-ketetapan-Nya
  rationale: Dalam konteks perjanjian, עֵדוֹת menunjuk pada ketentuan ilahi yang menjadi kesaksian dan wajib ditaati. “Ketetapan-ketetapan” paling mudah dipahami pembaca modern, sementara nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: לֹא שָׁמָרוּ
  choice: mereka tidak menaati
  rationale: Dengan ketetapan sebagai objek, שׁמר berarti memelihara dengan jalan menjalankan atau menaatinya. “Tidak menaati” menyampaikan maksud itu secara langsung dan alami.
- source_word: וַ
  choice: Namun
  rationale: Walaupun waw melanjutkan kisah, konteks mazmur memperlihatkan pertentangan antara karya Allah sebelumnya dan tanggapan Israel. “Namun” menyatakan kontras tersebut dengan wajar.
theological_decisions:
- issue: Gelar ilahi אֱלֹהִים עֶלְיוֹן
  choice: Allah Yang Mahatinggi
  alternative: Allah, Yang Mahatinggi
  rationale: Pilihan ini mempertahankan kedua unsur gelar dan penekanan pada kedaulatan Allah tanpa menambahkan nuansa doktrinal yang tidak terdapat dalam teks.
- issue: Nuansa hukum dan perjanjian dalam עֵדוֹתָיו
  choice: ketetapan-ketetapan-Nya
  alternative: kesaksian-kesaksian-Nya
  rationale: “Ketetapan-ketetapan-Nya” menyampaikan kewajiban perjanjian secara jelas dalam bahasa Indonesia modern. Catatan kaki mempertahankan nuansa dasar “kesaksian” dan mengakui kemungkinan padanan lain.
- issue: Hubungan kedua verba dengan Allah sebagai objek
  choice: menguji Allah Yang Mahatinggi dan memberontak terhadap-Nya
  alternative: menguji dan memberontak terhadap Allah Yang Mahatinggi
  rationale: Susunan terpilih mempertahankan Allah sebagai objek langsung dari “menguji” dan memakai “terhadap” hanya dengan “memberontak”, sehingga hubungan gramatikal kedua verba tidak dikaburkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “terhadap-Nya” menghindari konstruksi yang dapat membuat “menguji” seolah-olah memakai preposisi, sedangkan titik koma menampilkan dua sisi ketidaksetiaan umat tanpa memutus hubungan antarklausa.
