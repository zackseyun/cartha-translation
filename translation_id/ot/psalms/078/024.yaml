  yaml_path: translation/ot/psalms/078/024.yaml
  text: He rained down manna on them to eat[a], and gave them the grain of heaven.
translation:
  language: id
  text: Ia menghujankan manna atas mereka untuk dimakan, dan memberi mereka biji-bijian dari langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “biji-bijian langit”; ungkapan puitis ini menggambarkan manna. Frasa ini juga dapat diterjemahkan secara lebih interpretatif sebagai “makanan dari langit” atau “roti dari langit” dalam konteks yang berkaitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Ia menurunkan ... seperti hujan
  rationale: Bentuk kausatif dari מטר berarti menyebabkan turun seperti hujan. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan citra hujan.
- source_word: עֲלֵיהֶם
  choice: kepada mereka
  rationale: Dalam konteks sesuatu yang diturunkan dari atas, 'kepada mereka' lebih alami daripada 'ke atas mereka' dan tetap menyampaikan arah tindakan.
- source_word: מָן
  choice: manna
  rationale: '''Manna'' adalah bentuk baku dalam bahasa Indonesia untuk makanan di padang gurun.'
- source_word: לֶאֱכֹל
  choice: untuk dimakan
  rationale: Infinitif dengan ל menyatakan tujuan. Bentuk pasif ini ringkas, alami, dan tidak perlu menambahkan subjek yang tidak dinyatakan secara eksplisit.
- source_word: דְגַן
  choice: gandum
  rationale: דגן menunjuk pada biji-bijian atau hasil serealia. 'Gandum' mempertahankan metafora konkret dan merupakan padanan puitis yang mudah dipahami, meski cakupan kata Ibraninya lebih luas.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam frasa konstruksi ini, 'langit' merupakan padanan Indonesia yang alami dan mempertahankan nuansa puitis asal surgawi.
- source_word: נָתַן
  choice: memberikan
  rationale: נתן adalah verba umum 'memberi'; 'memberikan' mempertahankan kesederhanaan maknanya.
- source_word: לָמוֹ
  choice: kepada mereka
  rationale: Bentuk pronomina puitis ini berarti 'kepada mereka' dan diterjemahkan secara eksplisit agar hubungan penerimanya jelas.
theological_decisions:
- issue: Manna digambarkan secara metaforis sebagai דְגַן שָׁמַיִם
  choice: Mempertahankan metafora sebagai 'gandum dari langit'.
  alternative: '''makanan dari langit'' atau ''roti dari langit'''
  rationale: Teks Ibrani memakai דגן, bukan kata umum untuk makanan maupun kata untuk roti. Metafora konkret dipertahankan agar gambaran puitis dan ketegangannya tidak ditafsirkan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur paralel puisi dipertahankan. Penanda catatan kaki [a] ditempatkan setelah frasa yang diterangkannya.
