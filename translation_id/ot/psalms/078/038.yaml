  text: וְ/ה֤וּא רַח֨וּם יְכַפֵּ֥ר עָוֺן֮ וְֽ/לֹא יַ֫שְׁחִ֥ית וְ֭/הִרְבָּה לְ/הָשִׁ֣יב אַפּ֑/וֹ וְ/לֹֽא יָ֝עִיר כָּל חֲמָתֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
translation:
  language: id
  text: Namun, Ia penuh belas kasihan; Ia mengadakan pendamaian bagi kesalahan[a] dan tidak membinasakan. Berkali-kali Ia menyurutkan murka-Nya dan tidak membangkitkan seluruh amarah-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengampuni kesalahan.” Kata Ibrani yang dipakai lazim berarti mengadakan pendamaian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: penuh belas kasihan
  rationale: Ungkapan ini secara alami menyatakan sifat Allah yang berbelaskasihan, sesuai dengan makna adjektiva Ibrani.
- source_word: יְכַפֵּר
  choice: mengadakan pendamaian
  rationale: Bentuk piel dari כפר lazim menyatakan tindakan mengadakan pendamaian atau penghapusan kesalahan. Pilihan ini mempertahankan bobot teologis istilah Ibrani tanpa menjelaskan mekanisme yang tidak disebutkan ayat.
- source_word: עָוֺן
  choice: kesalahan
  rationale: עָוֹן dapat menunjuk pada perbuatan salah maupun kesalahan yang ditimbulkannya. 'Kesalahan' jelas dalam bahasa Indonesia modern dan cocok sebagai objek tindakan pendamaian.
- source_word: יַשְׁחִית
  choice: membinasakan
  rationale: Bentuk hifil dari שׁחת di sini menunjuk pada penghukuman yang menghancurkan; 'membinasakan' tepat dan lazim dalam konteks ini.
- source_word: וְהִרְבָּה
  choice: berkali-kali
  rationale: הִרְבָּה yang diikuti infinitif menyatakan tindakan yang dilakukan berulang kali; 'berkali-kali' menyampaikan fungsi adverbial itu secara alami.
- source_word: לְהָשִׁיב אַפּוֹ
  choice: menyurutkan murka-Nya
  rationale: Secara harfiah ungkapan ini berarti membalikkan atau mengembalikan murka. 'Menyurutkan' mempertahankan gagasan bahwa murka itu ditarik kembali sekaligus terdengar alami.
- source_word: יָעִיר
  choice: membangkitkan
  rationale: Hifil dari עור berarti membangunkan atau membangkitkan. Dengan amarah sebagai objek, 'membangkitkan' mempertahankan metafora sumber.
- source_word: כָּל חֲמָתוֹ
  choice: seluruh amarah-Nya
  rationale: '''Seluruh'' mencerminkan כָּל, sedangkan ''amarah'' menyampaikan daya kuat חֵמָה dalam bahasa Indonesia yang wajar.'
theological_decisions:
- issue: Pemaknaan כפר dalam mazmur sejarah yang tidak secara langsung membahas ritual
  choice: mengadakan pendamaian atas kesalahan
  alternative: mengampuni kesalahan
  rationale: Kata כפר adalah istilah utama untuk tindakan pendamaian, tetapi dalam konteks ini juga dapat dipahami sebagai pengampunan. Teks utama mempertahankan bobot istilah sumber, sedangkan catatan kaki menjaga kemungkinan kontekstual tanpa menetapkan suatu mekanisme pendamaian tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti gaya teks ini. Dua kalimat dipakai agar paralelisme dan perkembangan gagasan mudah dipahami pembaca umum.
