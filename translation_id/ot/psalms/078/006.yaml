  text: לְמַ֤עַן יֵדְע֨וּ דּ֣וֹר אַ֭חֲרוֹן בָּנִ֣ים יִוָּלֵ֑דוּ יָ֝קֻ֗מוּ וִֽ/יסַפְּר֥וּ לִ/בְנֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/006.yaml
  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
translation:
  language: id
  text: supaya generasi yang akan datang mengetahuinya—anak-anak[a] yang akan lahir—lalu bangkit dan menceritakannya kepada anak-anak mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai “putra-putra” dan “putra-putra mereka”; di sini bentuk maskulin itu merujuk pada keturunan secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksud secara alami dalam bahasa Indonesia.
- source_word: יֵדְעוּ
  choice: mengetahuinya
  rationale: Bentuk imperfek sesudah לְמַעַן menyatakan tujuan. Akhiran “-nya” membuat verba ini alami dalam bahasa Indonesia dan menunjuk kembali pada kesaksian serta pengajaran dalam konteks sebelumnya tanpa mempersempit rujukannya.
- source_word: דּוֹר אַחֲרוֹן
  choice: angkatan yang kemudian
  rationale: Menunjuk pada generasi sesudahnya, bukan dengan sendirinya pada generasi terakhir dalam arti eskatologis.
- source_word: בָּנִים יִוָּלֵדוּ
  choice: anak-anak yang akan lahir
  rationale: Mempertahankan nuansa kelahiran pada masa mendatang; bentuk maskulin Ibrani di sini secara kontekstual merujuk pada keturunan secara umum.
- source_word: יָקֻמוּ
  choice: mereka akan bangkit
  rationale: קום menggambarkan tampilnya generasi tersebut untuk bertindak dan meneruskan pengajaran, bukan sekadar berdiri secara jasmani.
- source_word: וִיסַפְּרוּ
  choice: dan menceritakannya
  rationale: ספר dalam konteks ini berarti menyampaikan atau menuturkan kembali kepada generasi berikutnya. “Menceritakannya” alami dan mempertahankan rujukan kontekstual yang tidak dinyatakan secara eksplisit dalam ayat.
- source_word: לִבְנֵיהֶם
  choice: kepada anak-anak mereka
  rationale: Mengungkapkan pewarisan antargenerasi; bentuk maskulin jamak berfungsi sebagai sebutan umum bagi keturunan.
theological_decisions:
- issue: Bahasa keturunan bergender (בָּנִים / לִבְנֵיהֶם)
  choice: anak-anak / anak-anak mereka
  alternative: anak-anak lelaki / anak-anak lelaki mereka
  rationale: Bentuk maskulin jamak Ibrani dapat mewakili keturunan secara umum. Pokok ayat ini ialah penerusan pengajaran dari satu generasi kepada generasi berikutnya, bukan pembatasan kepada keturunan laki-laki.
- issue: Makna דּוֹר אַחֲרוֹן
  choice: angkatan yang kemudian
  alternative: angkatan terakhir
  rationale: Ungkapan ini paling wajar menunjuk pada generasi yang datang kemudian; menerjemahkannya sebagai “terakhir” dapat memasukkan makna eskatologis yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Angkatan” dipilih untuk kesinambungan generasi, sedangkan titik koma menjaga hubungan erat antara generasi yang akan lahir dan tindakan mereka kelak.
