  text: He sent against them his burning anger[a], fury, indignation, and distress, a band of destructive messengers.
translation:
  language: id
  text: Ia mengirimkan kepada mereka murka-Nya yang menyala-nyala, amarah, kegeraman, dan kesusahan—serombongan utusan pembawa malapetaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “suatu kiriman malaikat pembawa malapetaka”; secara tradisional: “malaikat jahat.” Bahasa Ibrani dapat menunjuk kepada utusan yang dicirikan oleh malapetaka yang mereka bawa, bukan kepada makhluk yang jahat secara moral.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Ia melepaskan
  rationale: Bentuk piel שלח menyatakan tindakan Allah mengirimkan atau melepas sesuatu terhadap mereka; “melepaskan” alami dalam konteks pencurahan murka dan mempertahankan daya puitisnya.
- source_word: בָּם
  choice: ke atas mereka
  rationale: Dengan tindakan penghukuman yang dikirimkan, בּ dapat menyatakan sasaran; ungkapan ini cocok dengan rangkaian murka dan malapetaka yang menimpa mereka.
- source_word: חֲרוֹן אַפּוֹ
  choice: murka-Nya yang menyala-nyala
  rationale: Idiom Ibrani menunjuk pada panas atau nyalanya kemarahan. Pilihan ini mempertahankan intensitas metaforis tanpa menerjemahkan unsur ‘hidung’ secara kaku.
- source_word: עֶבְרָה
  choice: amarah
  rationale: Kata ini menyatakan murka yang meluap. “Amarah” membedakannya dari חֲרוֹן אַפּוֹ sambil mempertahankan penumpukan sinonim.
- source_word: וָזַעַם
  choice: geram
  rationale: זעם menyatakan kemarahan atau kecaman yang kuat. “Geram” menjaga intensitas dan variasi dalam deretan istilah murka.
- source_word: וְצָרָה
  choice: dan kesesakan
  rationale: צָרָה berarti kesusahan, tekanan, atau kesesakan yang menimpa seseorang. “Kesesakan” sesuai dengan register puitis mazmur dan akibat penghukuman.
- source_word: מִשְׁלַחַת
  choice: serombongan
  rationale: Nomina ini dapat berarti pengiriman atau rombongan yang dikirim. Bersama ‘utusan’, “serombongan” menghasilkan bahasa Indonesia yang alami sambil menyiratkan kelompok yang diutus.
- source_word: מַלְאֲכֵי
  choice: utusan
  rationale: מַלְאָךְ dapat menunjuk kepada utusan manusia maupun adikodrati. “Utusan” mempertahankan keluasan leksikal dan tidak menetapkan hakikat mereka secara berlebihan.
- source_word: רָעִים
  choice: pembawa malapetaka
  rationale: רָעִים dapat berarti jahat secara moral atau bersifat buruk, mencelakakan, dan membawa bencana. Dalam konteks penghukuman, pilihan ini menyatakan dampak destruktif tanpa menutup kemungkinan terjemahan tradisional.
theological_decisions:
- issue: Apakah מַלְאֲכֵי רָעִים berarti malaikat yang jahat secara moral atau utusan penghukuman yang membawa bencana
  choice: utusan pembawa malapetaka
  alternative: malaikat-malaikat jahat; malaikat-malaikat pembawa malapetaka
  rationale: מַלְאָךְ berarti ‘utusan’ dan רַע dapat menggambarkan kejahatan moral ataupun keburukan, bahaya, dan malapetaka. Teks utama mempertahankan fungsi mereka sebagai pembawa penghukuman tanpa menyimpulkan bahwa Allah mengutus makhluk yang jahat secara moral; kemungkinan tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Deretan istilah kemarahan dipertahankan sebagai penumpukan retoris, sedangkan tanda pisah memperjelas bahwa frasa terakhir menggambarkan sarana penghukuman. Pronomina ilahi ditulis dengan kapital sesuai kelaziman penerbitan Alkitab Indonesia.
