id: PSA.78.21
reference: Psalms 78:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָ/כֵ֤ן שָׁמַ֥ע יְהוָ֗ה וַֽ/יִּתְעַבָּ֥ר וְ֭/אֵשׁ נִשְּׂקָ֣ה בְ/יַעֲקֹ֑ב וְ/גַם אַ֝֗ף עָלָ֥ה בְ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: id
  text: Karena itu, Yahweh mendengar dan menjadi murka[a]; api pun menyala terhadap Yakub[b], dan amarah juga bangkit terhadap Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menjadi sangat marah” atau “terbakar oleh murka.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di dalam Yakub” dan kemudian “di dalam Israel”; dalam konteks penghukuman ini dapat dipahami sebagai “terhadap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai akibat dari keluhan Israel pada ayat sebelumnya dengan ungkapan sebab-akibat yang alami dalam bahasa Indonesia.
- source_word: שָׁמַע
  choice: mendengar
  rationale: Menerjemahkan arti langsung verba tersebut tanpa menambahkan tafsiran bahwa Yahweh memperhatikan atau menanggapi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וַיִּתְעַבָּר
  choice: menjadi murka
  rationale: Bentuk hitpael di sini menyatakan bangkit atau meluapnya murka; pilihan ini kuat, wajar, dan sejalan dengan paralel אַף.
- source_word: וְאֵשׁ נִשְּׂקָה
  choice: api pun menyala
  rationale: Mempertahankan citra api serta makna pasif/intransitif bahwa api tersulut, sementara 'pun' mengalirkan waw secara alami dan menandai akibat lanjutan.
- source_word: בְיַעֲקֹב
  choice: terhadap Yakub
  rationale: Preposisi בְ secara harfiah dapat berarti 'di dalam/pada', tetapi dalam konteks penghukuman yang bermusuhan secara idiomatis menunjuk sasaran tindakan.
- source_word: וְגַם
  choice: dan ... juga
  rationale: Mempertahankan baik unsur penghubung maupun daya aditif ungkapan Ibrani.
- source_word: אַף
  choice: amarah
  rationale: Mengungkap idiom Ibrani yang secara harfiah berkaitan dengan 'hidung' tetapi di sini jelas berarti amarah atau murka.
- source_word: עָלָה
  choice: bangkit
  rationale: Menjaga metafora gerak naik sekaligus menghasilkan ungkapan Indonesia yang alami bagi munculnya amarah.
- source_word: בְיִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Sama seperti frasa paralelnya, preposisi ini dipahami secara idiomatis sebagai penanda sasaran penghukuman.
theological_decisions:
- issue: Kekuatan bahasa tentang murka ilahi
  choice: Memakai 'menjadi murka' dan 'amarah ... bangkit' tanpa memperhalusnya.
  alternative: Memakai ungkapan yang lebih ringan seperti 'menjadi tidak senang'.
  rationale: Teks Ibrani menekankan kerasnya respons ilahi; terjemahan perlu mempertahankan bobot tersebut tanpa memperlemah atau melebihkannya.
- issue: Hakikat api dalam penghukuman
  choice: Mempertahankan 'api pun menyala' tanpa menentukan apakah api itu harfiah, metaforis, atau keduanya.
  alternative: Menjelaskannya secara eksplisit sebagai lambang penghukuman atau sebagai api harfiah.
  rationale: Teks tidak menyelesaikan pertanyaan tersebut, sehingga ambiguitas dan citranya perlu dipertahankan.
- issue: Hubungan waw sebelum אֵשׁ
  choice: Menerjemahkannya dengan 'pun', sebagai kelanjutan naratif/konsekuensial yang tidak terlalu menentukan relasi logis.
  alternative: Memakai 'dan' secara formal atau 'sebab' secara eksplanatoris.
  rationale: '''Pun'' menyampaikan kesinambungan dan akibat secara alami dalam bahasa Indonesia tanpa memaksakan bahwa klausa api semata-mata merupakan penjelasan kausal.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama 'Yahweh' dipertahankan. Diksi 'murka' memberi bobot puitis-teologis, sedangkan susunan kalimat tetap mudah dipahami pembaca umum.
