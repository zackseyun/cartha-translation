  text: וַ֭/יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ אֹ֝֗הֶל שִׁכֵּ֥ן בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: id
  text: Maka Ia meninggalkan tempat kediaman di Silo, kemah yang ditempatkan-Nya di tengah umat manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kemah tempat Ia berdiam di antara manusia.”'
    reason: Bentuk שִׁכֵּן dapat dipahami sebagai tindakan menempatkan kemah atau, secara kontekstual, sebagai bahasa tentang Allah yang berdiam di sana.
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: meninggalkan
  rationale: Kata kerja נטש menyatakan tindakan meninggalkan atau membiarkan terbengkalai. “Meninggalkan” alami dalam bahasa Indonesia dan tetap menyampaikan penarikan diri Allah tanpa menambahkan penilaian yang tidak tersurat.
- source_word: מִשְׁכַּן
  choice: tempat kediaman
  rationale: מִשְׁכָּן berarti tempat tinggal atau kediaman, khususnya kediaman Allah. Pilihan ini mempertahankan citra kediaman sekaligus membedakannya dari אֹהֶל, “kemah,” pada baris sejajar.
- source_word: שִׁלֹה
  choice: Silo
  rationale: Nama tempat ini memakai bentuk Indonesia yang lazim, “Silo.” Frasa Ibrani berupa konstruksi “kediaman Silo,” yang secara alami dinyatakan “tempat kediaman di Silo” dalam bahasa Indonesia.
- source_word: אֹהֶל
  choice: kemah
  rationale: Padanan langsung dan alami bagi אֹהֶל, serta mempertahankan pengulangan puitis dengan istilah yang berbeda dari מִשְׁכַּן.
- source_word: שִׁכֵּן
  choice: ditempatkan-Nya
  rationale: Bentuk piel שִׁכֵּן dapat berarti menyebabkan tinggal, menempatkan, atau mendirikan. Dengan אֹהֶל sebagai hal yang diterangkan, “kemah yang ditempatkan-Nya” mengikuti konstruksi transitif Ibrani dengan wajar.
- source_word: בָּאָדָם
  choice: di tengah umat manusia
  rationale: אָדָם dipakai secara kolektif untuk manusia pada umumnya, bukan khusus seorang laki-laki. “Umat manusia” jelas, inklusif, dan sesuai dengan ragam Indonesia modern.
theological_decisions:
- issue: Makna ungkapan שִׁכֵּן pada kemah
  choice: Kemah itu ditempatkan Allah di tengah umat manusia.
  alternative: Kemah itu adalah tempat Allah berdiam di antara manusia.
  rationale: Bentuk piel paling langsung mendukung makna kausatif atau transitif, yaitu Allah menempatkan kemah itu. Namun, dalam konteks tempat kudus, ungkapan tersebut juga dapat dipahami sebagai pernyataan tentang kehadiran atau kediaman Allah; kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Cakupan אָדָם
  choice: umat manusia
  alternative: manusia
  rationale: Kata Ibrani berbentuk tunggal kolektif dan merujuk kepada manusia secara umum. Pilihan ini tidak membatasinya pada laki-laki dan terdengar alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi “Ia” dan enklitik “-Nya” mengikuti kebiasaan hormat bagi rujukan kepada Allah. Kesejajaran antara “tempat kediaman” dan “kemah” dipertahankan tanpa membuat kalimat kaku.
