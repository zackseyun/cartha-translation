  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
translation:
  language: id
  text: Namun mereka merayu-Nya dengan mulut mereka[a], dan dengan lidah mereka berdusta kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka memperdaya-Nya” atau “mereka memikat-Nya.” Kata kerja Ibrani dapat mengandung arti-arti itu; di sini kemungkinan besar yang dimaksud ialah perkataan rayuan yang tidak tulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: mereka membujuk-Nya
  rationale: Bentuk piel dari פתה dapat berarti membujuk, memperdaya, atau memikat. Dalam paralel dengan perkataan dusta, “membujuk-Nya” menyampaikan upaya mengambil hati Allah melalui ucapan yang tidak tulus tanpa menyatakan bahwa Allah benar-benar tertipu.
- source_word: בְּפִיהֶם
  choice: dengan mulut mereka
  rationale: Preposisi בְּ menyatakan sarana. Ungkapan konkret ini dipertahankan untuk menjaga kesejajaran puisi Ibrani.
- source_word: וּבִלְשׁוֹנָם
  choice: dan dengan lidah mereka
  rationale: Terjemahan harfiah “lidah” tetap alami dalam bahasa Indonesia sebagai kiasan bagi perkataan dan mempertahankan paralelisme dengan “mulut”.
- source_word: יְכַזְּבוּ
  choice: mereka berdusta
  rationale: Bentuk piel dari כזב secara langsung menyatakan tindakan berkata dusta; “berdusta” sesuai dengan register mazmur yang lugas dan bermartabat.
- source_word: לוֹ
  choice: kepada-Nya
  rationale: Preposisi ל dengan sufiks pronominal paling wajar menunjukkan pihak yang menjadi sasaran perkataan dusta, yaitu Allah.
theological_decisions:
- issue: Apakah ayat ini menyatakan bahwa manusia berhasil memperdaya Allah atau bahwa mereka berbicara tidak tulus kepada-Nya.
  choice: Teks utama memakai “membujuk-Nya,” yang menggambarkan perkataan manipulatif dan tidak tulus yang diarahkan kepada Allah.
  alternative: “Memperdaya-Nya” atau “memikat-Nya” merupakan kemungkinan leksikal yang lebih dekat kepada nuansa lain dari verba Ibrani.
  rationale: Konteks membicarakan tanggapan Israel yang tidak tulus. Pilihan ini tidak menyatakan bahwa Allah sungguh tertipu, tetapi catatan kaki mempertahankan rentang makna verba sumber dan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang jelas dan bermartabat. Bentuk “mulut” dan “lidah” dipertahankan untuk menjaga kesejajaran konkret dalam puisi Ibrani; pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan penulisan religius Indonesia.
