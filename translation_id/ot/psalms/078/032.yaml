  text: בְּ/כָל זֹ֭את חָֽטְאוּ ע֑וֹד וְ/לֹֽא הֶ֝אֱמִ֗ינוּ בְּ/נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: id
  text: Sekalipun semua itu, mereka masih berbuat dosa dan tidak percaya kepada perbuatan-perbuatan-Nya yang ajaib.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak memercayai perbuatan-perbuatan-Nya yang ajaib” atau “tidak menaruh kepercayaan pada perbuatan-perbuatan-Nya yang ajaib.” Kata kerja Ibrani dapat berarti “percaya” atau “memercayai/menaruh kepercayaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל זֹאת
  choice: Meskipun semua itu terjadi
  rationale: 'Ungkapan ini bersifat konsesif dalam konteks: sekalipun telah mengalami penghukuman dan pemeliharaan Allah yang diceritakan sebelumnya, mereka tetap berdosa. Penambahan ''terjadi'' membuat ungkapan tersebut alami dalam bahasa Indonesia tanpa menambah gagasan baru.'
- source_word: חָטְאוּ
  choice: berbuat dosa
  rationale: Padanan baku dan alami untuk bentuk Qal perfektum orang ketiga jamak; unsur keberlanjutan dinyatakan oleh עוֹד.
- source_word: עוֹד
  choice: masih
  rationale: Menunjukkan bahwa tindakan itu terus berlangsung sesudah semua kejadian sebelumnya, dengan penekanan pada kegigihan mereka dalam dosa.
- source_word: וְ/לֹא
  choice: dan tidak
  rationale: Mempertahankan koordinasi sederhana dalam bahasa Ibrani tanpa memperkuatnya menjadi pertentangan yang tidak dinyatakan secara eksplisit.
- source_word: הֶאֱמִינוּ
  choice: percaya
  rationale: Bentuk Hifil dari אמן dapat berarti percaya atau memercayai. 'Percaya' mempertahankan keluasan makna itu dan cocok dengan kegagalan mereka menanggapi perbuatan Allah.
- source_word: בְּ/נִפְלְאוֹתָיו
  choice: kepada perbuatan-perbuatan-Nya yang ajaib
  rationale: נִפְלָאוֹת menunjuk pada tindakan luar biasa Allah, bukan sekadar hal yang menimbulkan rasa kagum. 'Perbuatan-perbuatan-Nya yang ajaib' jelas dan alami, sedangkan 'kepada' mengikuti konstruksi Indonesia dengan 'percaya' sambil mempertahankan kemungkinan nuansa percaya atau menaruh kepercayaan.
theological_decisions:
- issue: Sifat kegagalan Israel dalam menanggapi tindakan Allah
  choice: tidak percaya kepada perbuatan-perbuatan-Nya yang ajaib
  alternative: tidak memercayai perbuatan-perbuatan-Nya yang ajaib; tidak menaruh kepercayaan pada perbuatan-perbuatan-Nya yang ajaib
  rationale: Teks menyoroti ketidakpercayaan di hadapan tindakan-tindakan Allah yang telah diperlihatkan. Rumusan utama tidak menentukan secara sempit apakah tekanannya pada menerima kebenaran tindakan itu atau menaruh kepercayaan kepada Allah berdasarkan tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk ulang 'perbuatan-perbuatan' dipakai untuk menyampaikan jamak Ibrani secara jelas; pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
