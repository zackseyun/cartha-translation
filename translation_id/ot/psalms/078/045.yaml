translation:
  language: id
  text: Ia mengirimkan kawanan lalat[a] ke antara mereka, yang melahap mereka, dan katak-katak yang membinasakan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kawanan serangga”; kata Ibrani עָרֹב dapat menunjuk pada kawanan serangga secara lebih umum, yang secara tradisional dipahami sebagai lalat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Ia mengirimkan
  rationale: Bentuk piel dari שׁלח menyatakan bahwa Allah mendatangkan wabah atas Mesir. “Mengirimkan” alami dalam bahasa Indonesia dan tetap mempertahankan tindakan ilahi yang disengaja.
- source_word: בָּהֶם
  choice: ke tengah-tengah mereka
  rationale: 'Preposisi ב di sini paling wajar dipahami secara lokatif: wabah itu masuk dan berada di antara orang Mesir. Ungkapan ini juga menyiratkan dampak terhadap mereka tanpa mengubahnya menjadi “melawan mereka”.'
- source_word: עָרֹב
  choice: kawanan lalat[a]
  rationale: Dalam konteks tulah Mesir, kata ini menunjuk pada kawanan makhluk pengganggu, yang secara tradisional dipahami sebagai lalat. “Kawanan lalat” jelas dan alami, sementara ketidakpastian jenisnya dipertahankan dalam catatan kaki.
- source_word: וַיֹּאכְלֵם
  choice: yang melahap mereka
  rationale: אכל secara harfiah berarti memakan dan di sini menggambarkan daya rusak wabah dengan sangat kuat. “Melahap” mempertahankan gambaran hidup itu; klausa relatif menghasilkan bahasa Indonesia yang lancar tanpa menghilangkan hubungan tindakan dengan kawanan tersebut.
- source_word: וּצְפַרְדֵּעַ
  choice: dan katak-katak
  rationale: Nomina tunggal Ibrani dipakai secara kolektif. Bentuk ulang “katak-katak” menyampaikan makna jamak kolektif secara alami dalam bahasa Indonesia.
- source_word: וַתַּשְׁחִיתֵם
  choice: yang membinasakan mereka
  rationale: Kata kerja שׁחת menyatakan perusakan atau pembinasaan. “Membinasakan” mempertahankan kekuatan ungkapan dalam konteks tulah, dan klausa relatif sesuai dengan nomina jamak bahasa Indonesia.
