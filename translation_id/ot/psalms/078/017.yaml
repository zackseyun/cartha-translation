  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
translation:
  language: id
  text: 'Namun mereka terus berbuat dosa terhadap-Nya,

    memberontak terhadap Yang Mahatinggi di tanah tandus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di padang gurun” atau “di tanah gersang.” Kata Ibrani yang digunakan secara khusus menunjuk pada tempat yang kering dan tandus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסִיפוּ עוֹד
  choice: Namun mereka terus
  rationale: Bentuk Hifil dari יסף dengan infinitif menyatakan tindakan yang berlanjut atau berulang. “Terus” membawa daya iteratifnya, sedangkan “namun” menyatakan perkembangan yang berlawanan dengan kemurahan Allah dalam konteks.
- source_word: לַחֲטֹא לוֹ
  choice: berbuat dosa terhadap-Nya
  rationale: חטא dengan ל dapat berarti berdosa terhadap seseorang. Bentuk ini alami dalam bahasa Indonesia dan pronomina tersebut merujuk kepada Allah dalam konteks.
- source_word: לַמְרוֹת
  choice: memberontak terhadap
  rationale: Infinitif dari מרה menjelaskan lebih lanjut sifat dosa mereka sebagai pembangkangan terhadap Allah. “Memberontak terhadap” mempertahankan kekuatan makna itu tanpa menambahkan tafsiran.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Gelar ilahi ini secara harfiah menyatakan Dia yang tertinggi. “Yang Mahatinggi” merupakan padanan Indonesia yang jelas, alami, dan tetap mempertahankan bobot teologis gelar tersebut.
- source_word: בַּצִּיָּה
  choice: di tanah tandus
  rationale: Nomina ini secara khusus menunjuk pada tempat yang kering atau gersang. “Tanah tandus” mencerminkan pilihan leksikal Ibrani dengan lebih tepat daripada sekadar “padang gurun,” sekaligus sesuai dengan konteks perjalanan di gurun.
theological_decisions:
- issue: Penerjemahan gelar ilahi עֶלְיוֹן
  choice: Yang Mahatinggi
  alternative: Allah Yang Mahatinggi
  rationale: Teks hanya memakai gelar “Mahatinggi” tanpa nomina “Allah.” Bentuk “Yang Mahatinggi” mempertahankan gelar ilahi sekaligus tidak menambahkan unsur yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Baris kedua mempertahankan hubungan partisipial/penjelas antara tindakan berdosa dan tindakan memberontak. Penanda catatan kaki ditempatkan sesudah “tanah tandus,” yaitu pada unsur yang dijelaskan oleh catatan.
