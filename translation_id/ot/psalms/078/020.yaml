base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: id
  text: Lihat, Ia memukul batu itu, lalu air memancar keluar dan aliran-aliran meluap. Apakah Ia juga sanggup memberikan roti atau menyediakan daging[a] bagi umat-Nya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daging”; dalam konteks ini kemungkinan menunjuk pada daging sebagai makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihat
  rationale: Mempertahankan daya deiktis dan penegasan seruan Ibrani dalam bahasa Indonesia modern.
- source_word: הִכָּה
  choice: memukul
  rationale: Mengungkapkan tindakan lampau yang kuat terhadap batu secara alami dan langsung.
- source_word: צוּר
  choice: batu itu
  rationale: Mengacu pada batu tertentu dalam peristiwa di padang gurun yang telah dikenal dalam kisah Israel.
- source_word: וַיָּז֣וּבוּ מַיִם
  choice: lalu air memancar keluar
  rationale: Menggambarkan air yang keluar dengan deras dan berlimpah; 'lalu' menyampaikan urutan naratif bentuk wayyiqtol.
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: dan sungai-sungai mengalir deras
  rationale: נְחָלִים dapat berarti aliran atau sungai, sedangkan יִשְׁטֹפוּ menyiratkan arus deras; pilihan ini mempertahankan gambaran kelimpahan tanpa mempersempitnya menjadi banjir.
- source_word: הֲגַם
  choice: Apakah Dia juga sanggup
  rationale: Mempertahankan bentuk pertanyaan retoris dan unsur 'juga' yang memperluas keraguan dari pemberian air kepada makanan.
- source_word: לֶחֶם
  choice: roti
  rationale: Mempertahankan benda konkret dalam teks Ibrani dan kesejajarannya dengan daging.
- source_word: יוּכַל תֵּת
  choice: sanggup memberikan
  rationale: Menyatakan secara wajar unsur kemampuan dalam יוּכַל dan tindakan memberi dalam תֵּת.
- source_word: אִם
  choice: atau
  rationale: Dalam rangkaian pertanyaan ini, אִם memperkenalkan anggota kedua secara disjungtif.
- source_word: יָכִין
  choice: menyediakan
  rationale: Dalam konteks makanan, bentuk Hifil ini berarti menyiapkan atau mengadakan bagi umat.
- source_word: שְׁאֵר
  choice: daging
  rationale: Secara harfiah berarti daging tubuh, tetapi dalam konteks ini menunjuk pada daging sebagai makanan.
- source_word: לְעַמּוֹ
  choice: bagi umat-Nya
  rationale: Mengungkapkan hubungan khas antara Allah dan Israel dengan istilah Indonesia yang wajar dalam register kitab suci.
theological_decisions:
- issue: Daya retoris keraguan Israel
  choice: Menerjemahkan bagian akhir sebagai pertanyaan skeptis tentang kesanggupan Allah menyediakan makanan selain air.
  alternative: Menerjemahkannya secara datar sebagai pernyataan atau menghapus unsur kemampuan.
  rationale: Partikel tanya הֲ dan konteks ketidakpercayaan menuntut bentuk pertanyaan retoris, tanpa menyelesaikan ketegangan teologis yang sengaja ditampilkan mazmur.
- issue: Rujukan pronomina ilahi
  choice: Memakai 'Dia' dan enklitik hormat '-Nya' tanpa menambahkan sebutan 'Allah'.
  alternative: Menambahkan subjek eksplisit 'Allah'.
  rationale: Teks Ibrani memakai pronomina; mempertahankannya menghindari penjelasan tambahan sambil tetap jelas dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur puitis dipertahankan melalui dua gambaran air yang sejajar dan pertanyaan retoris mengenai roti serta daging.
