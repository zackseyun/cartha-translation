  text: וַ֭/יִּזְכֹּר כִּי בָשָׂ֣ר הֵ֑מָּה ר֥וּחַ ה֝וֹלֵ֗ךְ וְ/לֹ֣א יָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/039.yaml
  text: He remembered that they were flesh[a], a wind that passes and does not return.
translation:
  language: id
  text: Ia ingat bahwa mereka adalah daging, angin[a] yang berlalu dan tidak kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "napas yang pergi dan tidak kembali." Kata Ibrani רוּחַ dapat berarti "angin", "napas", atau "roh"; di sini maksudnya kemungkinan besar adalah kesementaraan dan kerapuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Ia ingat
  rationale: Bentuk Qal wayyiqtol dari זכר menyatakan tindakan lampau dalam alur narasi. Subjek tersiratnya adalah Allah berdasarkan konteks; "Ia ingat" alami dan tetap dekat dengan teks.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang diingat, sehingga "bahwa" paling sesuai dengan susunan kalimat Indonesia.
- source_word: בָשָׂר
  choice: daging
  rationale: Mempertahankan gambaran konkret Ibrani tentang kefanaan dan kerapuhan manusia tanpa menggantinya dengan penafsiran seperti "manusia fana".
- source_word: הֵמָּה
  choice: mereka adalah
  rationale: Pronomina mandiri Ibrani dialihkan dengan kopula eksplisit agar hubungan predikatifnya jelas dalam bahasa Indonesia.
- source_word: רוּחַ
  choice: angin
  rationale: Dalam paralelisme puitis ini, kata tersebut menggambarkan sesuatu yang fana dan segera berlalu. "Angin" cocok dengan tindakan berlalu dan tidak kembali, sementara kemungkinan "napas" dipertahankan dalam catatan kaki.
- source_word: הוֹלֵךְ
  choice: yang berlalu
  rationale: Partisipel ini menggambarkan gerak; "berlalu" alami dalam puisi Indonesia dan menonjolkan sifat sementara tanpa menambah gagasan baru.
- source_word: וְלֹא יָשׁוּב
  choice: dan tidak kembali
  rationale: Menyampaikan ketidakberulangan secara umum tanpa memaksakan aspek masa depan yang lebih tegas.
theological_decisions:
- issue: Gambaran antropologis tentang kerapuhan manusia
  choice: Ayat ini menggambarkan manusia sebagai makhluk fana dan sementara melalui ungkapan "daging" dan "angin yang berlalu".
  alternative: Memahami רוּחַ sebagai "roh" dan menjadikan baris ini pernyataan teknis tentang roh manusia yang pergi.
  rationale: Paralelisme langsungnya menekankan kefanaan dan kesementaraan. Pilihan "angin" menghindari pemasukan doktrin antropologis yang tidak dituntut oleh teks, sementara ambiguitas leksikal tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis. Istilah konkret "daging" dipertahankan meskipun sedikit tidak lazim dalam prosa sehari-hari karena penting bagi citra Ibrani. Penanda catatan kaki ditempatkan langsung sesudah "angin", kata yang memiliki alternatif leksikal.
