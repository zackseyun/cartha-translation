  text: נֶ֣גֶד אֲ֭בוֹתָ/ם עָ֣שָׂה פֶ֑לֶא בְּ/אֶ֖רֶץ מִצְרַ֣יִם שְׂדֵה צֹֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/012.yaml
  text: Before their fathers he did wonders in the land of Egypt[b][a], in the fields of Zoan.
translation:
  language: id
  text: Di depan mata nenek moyang mereka, Ia melakukan keajaiban di tanah Mesir, di kawasan Zoan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di ladang Zoan,” kemungkinan yang dimaksud ialah daerah atau wilayah sekitar Zoan.'
    reason: cultural_note
lexical_decisions:
- source_word: נֶגֶד
  choice: di depan mata
  rationale: Ungkapan ini menyatakan bahwa perbuatan tersebut berlangsung di hadapan dan dapat disaksikan oleh nenek moyang mereka. “Di depan mata” alami dalam bahasa Indonesia serta mempertahankan unsur keterlihatan.
- source_word: אֲבוֹתָם
  choice: nenek moyang mereka
  rationale: Secara harfiah berarti “ayah-ayah mereka,” tetapi dalam konteks ini menunjuk kepada generasi pendahulu Israel yang menyaksikan peristiwa keluaran. “Nenek moyang” menyampaikan acuan antargenerasi itu secara jelas dan wajar.
- source_word: עָשָׂה פֶלֶא
  choice: Ia melakukan keajaiban
  rationale: Konstruksi ini secara harfiah berarti “melakukan keajaiban.” Bentuk tunggal פֶלֶא dapat dipahami secara kolektif dalam konteks berbagai perbuatan ajaib di Mesir; bentuk Indonesia “keajaiban” juga dapat berfungsi demikian tanpa mempersempitnya menjadi satu tindakan saja.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Terjemahan ini mempertahankan unsur geografis אֶרֶץ, “tanah/negeri,” dan tetap alami dalam bahasa Indonesia.
- source_word: שְׂדֵה צֹעַן
  choice: di kawasan Zoan
  rationale: Secara harfiah frasa ini berbunyi “ladang Zoan,” tetapi dalam konteks geografis kemungkinan menunjuk pada kawasan terbuka atau wilayah sekitar kota Zoan. “Kawasan Zoan” jelas bagi pembaca modern, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ia” mengikuti rujukan kontekstual kepada Allah tanpa menambahkan nama yang tidak terdapat dalam ayat ini. Susunan kalimat mempertahankan penekanan awal pada kesaksian nenek moyang mereka.
