  terminology: “Allah” adalah padanan baku bagi אֵל dalam konteks ini, dan “menguji” lebih tepat daripada “mencobai” karena menghindari konotasi menggoda untuk berbuat dosa. Catatan kaki menggunakan istilah “selera” dan “nafsu makan” secara tepat sebagai kemungkinan kontekstual bagi נֶפֶשׁ.
