  source_fidelity: Teks Indonesia dengan tepat menerjemahkan וַיְנַסּוּ אֵל sebagai “Mereka menguji Allah,” mempertahankan dimensi batin בִּלְבָבָם melalui “dalam hati mereka,” dan menyampaikan hubungan sarana pada לִשְׁאָל dengan “dengan meminta.” “Makanan” tepat untuk אֹכֶל yang umum. “Untuk diri mereka sendiri” merupakan pilihan yang sah bagi לְנַפְשָׁם dan dengan bijaksana tidak memaksakan satu nuansa leksikal yang diperdebatkan; catatan kaki mencatat nuansa selera yang kuat dalam konteks ini.
