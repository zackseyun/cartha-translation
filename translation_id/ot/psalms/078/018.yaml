  yaml_path: translation/ot/psalms/078/018.yaml
  text: They tested God in their heart by asking for food for themselves[a][b].
translation:
  language: id
  text: Mereka menguji Allah dalam hati mereka dengan meminta makanan untuk diri mereka sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan meminta makanan untuk memuaskan selera mereka.” Kata Ibrani yang diterjemahkan “diri” dapat berarti diri, jiwa, hasrat, atau selera; dalam konteks ini, makna “selera” atau “nafsu makan” mungkin dimaksudkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: menguji
  rationale: Bentuk piel dari נסה berarti menguji atau menempatkan pada ujian. “Menguji” menyampaikan tindakan menantang atau menguji Allah tanpa kesan utama membujuk-Nya untuk berbuat dosa yang dapat timbul dari “mencobai”.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini adalah sebutan ilahi umum; “Allah” merupakan padanan baku dan jelas dalam bahasa Indonesia.
- source_word: בִּלְבָבָם
  choice: dalam hati mereka
  rationale: Walaupun bentuk Ibraninya secara harfiah tunggal dengan akhiran jamak (“dalam hati mereka”), bahasa Indonesia alami memakai frasa ini untuk keadaan batin bersama maupun masing-masing orang.
- source_word: לִשְׁאָל
  choice: dengan meminta
  rationale: 'Infinitif dengan ל dalam konteks ini menyatakan cara atau sarana: mereka menguji Allah dengan tindakan meminta.'
- source_word: אֹכֶל
  choice: makanan
  rationale: אֹכֶל adalah istilah umum untuk makanan, bukan khusus roti.
- source_word: לְנַפְשָׁם
  choice: untuk diri mereka sendiri
  rationale: נֶפֶשׁ dapat menunjuk pada diri, kehidupan, hasrat, atau selera. “Diri mereka sendiri” mempertahankan keluasan makna dan mengikuti susunan Ibrani tanpa menambahkan gagasan “memuaskan” yang tidak dinyatakan secara eksplisit; konteks makanan memungkinkan nuansa selera dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks permintaan makanan
  choice: untuk diri mereka sendiri
  alternative: untuk memuaskan selera mereka; untuk nafsu makan mereka; untuk jiwa mereka
  rationale: Konteks mendukung nuansa selera atau keinginan jasmani, tetapi kata נֶפֶשׁ tetap dapat berarti diri. Teks utama memakai ungkapan yang alami dan cukup dekat dengan bentuk sumber, sedangkan catatan kaki mempertahankan alternatif kontekstual tanpa memasukkan antropologi tentang “jiwa” ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Menguji Allah” dipilih daripada “mencobai Allah” demi ketepatan makna. Bentuk “dalam hati mereka” alami dalam bahasa Indonesia dan tetap mencerminkan keadaan batin kolektif yang dinyatakan teks Ibrani.
