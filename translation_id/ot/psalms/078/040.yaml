  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
translation:
  language: id
  text: Betapa sering mereka memberontak terhadap-Nya di padang gurun dan mendukakan-Nya di tanah tandus![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berapa kali mereka memberontak terhadap-Nya di padang gurun.” Ungkapan pembuka dapat menekankan tindakan pemberontakan yang terjadi berulang kali.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyakiti-Nya” atau “membuat-Nya berduka” di tanah tandus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Betapa sering
  rationale: Dalam ungkapan seruan ini, kata tersebut menekankan kerapnya tindakan yang berulang, bukan meminta jumlah secara harfiah.
- source_word: יַמְרוּהוּ
  choice: mereka memberontak terhadap Dia
  rationale: Bentuk dari מרה menyatakan pembangkangan atau pemberontakan terhadap Allah; pilihan ini jelas dan dekat dengan makna Ibrani.
- source_word: בַמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk pada wilayah belantara tempat pengembaraan Israel; 'padang gurun' merupakan padanan Indonesia yang alami dan memiliki gema geografis alkitabiah.
- source_word: יַעֲצִיבוּהוּ
  choice: mendukakan hati-Nya
  rationale: Bentuk dari עצב berarti menyebabkan kepedihan, kesedihan, atau kejengkelan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya relasional serta emosional teks.
- source_word: בִּישִׁימוֹן
  choice: di tanah tandus
  rationale: יְשִׁימוֹן menunjuk pada daerah yang gersang dan sunyi. 'Tanah tandus' membedakannya dari מִדְבָּר sambil mempertahankan kesejajaran puitis.
theological_decisions:
- issue: Bahasa antropopatik tentang Allah dalam יַעֲצִיבוּהוּ
  choice: Mempertahankan ungkapan pribadi-emosional 'mendukakan hati-Nya' dalam teks utama.
  alternative: '''menyakiti Dia'' atau ''membuat Dia berduka'''
  rationale: Bahasa Ibrani menggambarkan tindakan Israel sebagai pelanggaran relasional yang mendukakan Allah. Ketegangan ini dipertahankan dan tidak diratakan menjadi ungkapan impersonal seperti sekadar 'membangkitkan murka-Nya'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia; 'mendukakan hati-Nya' dipilih demi kealamian tanpa menghapus bahasa afektif sumber.
