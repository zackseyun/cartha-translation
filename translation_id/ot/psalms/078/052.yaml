  text: Lalu Ia membawa umat-Nya keluar seperti domba-domba, dan menuntun mereka seperti kawanan domba di padang gurun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: membawa ... keluar
  rationale: Bentuk Hifil menyatakan bahwa Allah menyebabkan umat-Nya berangkat. Dalam konteks keluaran dari Mesir, “membawa ... keluar” alami dalam bahasa Indonesia dan mempertahankan nuansa kausatif serta arah geraknya.
- source_word: כַּצֹּאן
  choice: seperti kawanan domba
  rationale: צֹאן menunjuk pada ternak kecil, terutama domba dan kambing. Dalam perumpamaan penggembalaan ini, “kawanan domba” menyampaikan gambaran kolektif secara alami.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עַם berarti suatu bangsa atau umat. “Umat-Nya” sesuai untuk Israel dalam hubungan khusus dengan Allah dan tetap wajar dalam ragam Alkitab Indonesia.
- source_word: וַיְנַהֲגֵם
  choice: menuntun mereka
  rationale: נהג dapat berarti memimpin, menggiring, atau menuntun. “Menuntun” mempertahankan nuansa pengarahan oleh seorang gembala tanpa memberi kesan keras yang tidak diwajibkan oleh konteks.
- source_word: כָּעֵדֶר
  choice: seperti kawanan ternak
  rationale: עֵדֶר berarti kawanan ternak, baik kawanan domba maupun ternak lain. “Kawanan ternak” mempertahankan variasi leksikal antara צֹאן dan עֵדֶר tanpa mengubah kesatuan gambaran pastoral.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk pada daerah liar atau tidak dihuni yang dapat mencakup tanah penggembalaan, bukan hanya gurun pasir. “Padang gurun” adalah padanan Indonesia yang mapan dan sesuai dengan konteks perjalanan Israel.
theological_decisions:
- issue: Gambaran Allah sebagai gembala bagi Israel dalam peristiwa Keluaran
  choice: 'Perbandingan pastoral dipertahankan secara langsung: Allah membawa umat-Nya keluar seperti kawanan domba dan menuntun mereka seperti kawanan ternak.'
  alternative: Menjelaskan secara eksplisit bahwa Allah adalah Gembala Israel.
  rationale: Teks menyampaikan peran Allah melalui perbandingan, bukan melalui gelar eksplisit. Terjemahan mempertahankan metafora dan relasi-Nya dengan umat tanpa menambahkan perkembangan teologis dari bagian lain.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapitalisasi pronomina “Ia” dan enklitik “-Nya” mengikuti kebiasaan terjemahan Alkitab Indonesia ketika merujuk kepada Allah. Kesejajaran dua klausa Ibrani dipertahankan, dengan variasi alami antara “membawa ... keluar” dan “menuntun” serta antara “kawanan domba” dan “kawanan ternak”.
