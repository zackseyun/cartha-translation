  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: id
  text: Lalu mereka makan dan menjadi sangat kenyang, dan Ia mendatangkan kepada mereka apa yang mereka inginkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keinginan mereka” atau “hasrat mereka.” Kata benda Ibrani ini dapat menunjuk pada keinginan itu sendiri atau pada sesuatu yang diinginkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: mereka makan
  rationale: Bentuk Qal dari אכל memakai kata kerja biasa untuk tindakan makan; padanan ini paling langsung dan alami dalam bahasa Indonesia.
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: sampai sangat kenyang
  rationale: שׂבע berarti menjadi kenyang atau puas, sedangkan מְאֹד memperkuatnya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran konkret tentang makan hingga kenyang.
- source_word: תַאֲוָתָם
  choice: apa yang mereka inginkan
  rationale: תַּאֲוָה dapat menunjuk pada keinginan atau hasrat, maupun pada sesuatu yang diinginkan. Dalam konteks pemberian makanan, bentuk konkret ini jelas dan alami tanpa menghilangkan kemungkinan makna abstraknya, yang dicatat dalam catatan kaki.
- source_word: יָבִא לָהֶם
  choice: Ia mendatangkan kepada mereka
  rationale: Bentuk Hifil dari בוא menyatakan tindakan menyebabkan datang atau mendatangkan. Padanan ini mempertahankan nuansa kausatif dan agen ilahi yang tersirat dalam alur mazmur.
theological_decisions:
- issue: Subjek tersirat pada יָבִא
  choice: Ia, dengan Allah sebagai subjek yang tersirat
  alternative: Terjemahan impersonal, misalnya “keinginan mereka datang kepada mereka”
  rationale: Dalam alur kisah mazmur, Allah adalah pelaku yang menyediakan makanan. Bentuk Hifil mendukung arti kausatif “mendatangkan,” tetapi nama Allah tidak ditambahkan karena teks Ibrani hanya menyiratkan subjeknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Ia” mempertahankan subjek tunggal yang tersirat tanpa menambahkan nama Allah, sedangkan “sampai sangat kenyang” menyampaikan intensitas secara wajar.
