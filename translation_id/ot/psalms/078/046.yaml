source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לֶ/חָסִ֣יל יְבוּלָ֑/ם וִֽ֝/יגִיעָ֗/ם לָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/046.yaml
  text: He gave their produce to the devouring locust[b][a], and their labor to the swarming locust.
translation:
  language: id
  text: Ia menyerahkan hasil tanah mereka kepada belalang pelahap[a], dan hasil jerih payah mereka kepada belalang berkerumun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “serangga pelahap”; kata Ibrani ini mungkin menunjuk secara umum pada serangga pemakan tanaman, yang dalam teks tentang tulah sering dipahami sebagai sejenis belalang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jerih payah mereka”; istilah Ibrani ini dapat berarti jerih payah itu sendiri atau hasil yang diperoleh darinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia menyerahkan
  rationale: Bentuk wayyiqtol dari נתן pada dasarnya berarti ‘memberikan’. Dalam konteks penghukuman, ‘menyerahkan’ secara alami menyampaikan bahwa hasil tanah itu dibiarkan menjadi mangsa serangga, tanpa mengubah struktur dasar Ibrani.
- source_word: לֶחָסִיל
  choice: kepada belalang pelahap
  rationale: חָסִיל menunjuk pada serangga perusak tanaman, yang dalam teks tentang tulah kerap dipahami sebagai sejenis belalang. ‘Belalang pelahap’ mempertahankan nuansa daya rusaknya tanpa mengklaim identifikasi zoologis yang terlalu tepat.
- source_word: יְבוּלָם
  choice: hasil tanah mereka
  rationale: יְבוּל berarti hasil atau produksi tanah. ‘Hasil tanah’ alami dalam bahasa Indonesia dan cukup luas untuk mencakup panen pertanian.
- source_word: וִיגִיעָם
  choice: hasil jerih payah mereka
  rationale: יְגִיעַ dapat berarti jerih payah itu sendiri atau hasil yang diperoleh darinya. Karena menjadi objek yang dimakan belalang dan sejajar dengan יְבוּלָם, makna metonimis ‘hasil jerih payah’ paling jelas dalam bahasa Indonesia.
- source_word: לָאַרְבֶּה
  choice: kepada belalang berkerumun
  rationale: אַרְבֶּה adalah istilah umum untuk belalang. Tambahan ‘berkerumun’ membedakannya dari חָסִיל dalam baris paralel serta menggambarkan ciri serbuan belalang tanpa menetapkan spesies tertentu.
