  register: Bahasa Indonesia baku modern dengan nada puitis yang ringkas dan bermartabat. Paralelisme Ibrani dipertahankan, sementara dua istilah serangga dibedakan secara deskriptif tanpa kepastian zoologis yang berlebihan.
