  yaml_path: translation/ot/psalms/078/002.yaml
  text: I will open my mouth in a parable[d][c][b][a]; I will utter riddles from of old.
translation:
  language: id
  text: Aku akan membuka mulutku dengan perumpamaan[a][d]; aku akan mengucapkan teka-teki[b] dari zaman dahulu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan peribahasa” atau “dengan perkataan kiasan.” Kata Ibrani מָשָׁל dapat berarti peribahasa, perumpamaan, atau perkataan kiasan.
    reason: lexical_alternative
  - marker: b
    text: Atau “perkataan penuh teka-teki” atau “teka-teki yang sukar dipahami.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dari masa purbakala.”
    reason: lexical_alternative
  - marker: d
    text: Ayat ini dikutip dalam Matius 13:35 sehubungan dengan Yesus yang berbicara dalam perumpamaan.
    reason: cross_reference
lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: Aku hendak membuka
  rationale: Bentuk orang pertama tunggal ini bernuansa kehendak atau maksud dalam puisi; “hendak” menyampaikan nuansa tersebut secara wajar.
- source_word: בְמָשָׁל
  choice: dengan perumpamaan
  rationale: מָשָׁל dapat berarti peribahasa, perumpamaan, atau perkataan kiasan. Dalam kesejajaran dengan חִידוֹת, “perumpamaan” mempertahankan sifat kiasan dan pengajaran tanpa mempersempit maknanya secara berlebihan.
- source_word: פִּי
  choice: mulutku
  rationale: Terjemahan konkret ini alami dalam bahasa Indonesia dan mempertahankan ungkapan Ibrani.
- source_word: אַבִּיעָה
  choice: aku hendak mengucapkan
  rationale: Bentuk Hifil dari נבע secara harfiah menggambarkan sesuatu yang memancar atau mengalir keluar, lalu secara kiasan berarti menuturkan; “mengucapkan” jelas dan alami dalam konteks ini.
- source_word: חִידוֹת
  choice: teka-teki
  rationale: חִידָה menunjuk pada teka-teki atau perkataan yang penuh teka-teki. “Teka-teki” merupakan padanan langsung, sedangkan kemungkinan “perkataan penuh teka-teki” dicatat dalam catatan kaki.
- source_word: מִנִּי קֶדֶם
  choice: dari zaman dahulu
  rationale: Frasa ini menunjuk pada masa lampau yang jauh tanpa harus berarti permulaan mutlak.
theological_decisions:
- issue: Hubungan ayat ini dengan Matius 13:35 dan cakupan makna מָשָׁל serta חִידוֹת
  choice: Menerjemahkan teks Ibrani menurut maknanya sendiri sebagai “perumpamaan” dan “teka-teki,” lalu mencatat kutipannya dalam Matius 13:35.
  alternative: Menyelaraskannya dengan ungkapan “hal-hal yang tersembunyi” dalam bentuk kutipan Perjanjian Baru.
  rationale: Keutamaan diberikan kepada bukti teks Ibrani. Hubungan antarteks tetap penting, tetapi tidak boleh mengubah istilah Ibrani menjadi makna yang lebih khusus daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis. Pengulangan “aku hendak” mempertahankan kesejajaran dua baris Ibrani; “mulutku” mempertahankan gambaran konkret sumber.
