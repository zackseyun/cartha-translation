  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
translation:
  language: id
  text: Ia menggerakkan angin timur di langit[a], dan dengan kekuatan-Nya Ia mengarahkan angin selatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia membuat angin timur mulai bergerak di langit.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “selatan”; berdasarkan kesejajarannya dengan “angin timur”, yang dimaksud kemungkinan besar ialah angin selatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסַּע
  choice: menggerakkan
  rationale: Bentuk Hifil dari נסע secara harfiah berarti ‘menyuruh berangkat’, tetapi dengan angin sebagai objek artinya ialah membuat angin mulai bergerak. ‘Menggerakkan’ alami dalam bahasa Indonesia dan tetap menyatakan tindakan ilahi.
- source_word: קָדִים
  choice: angin timur
  rationale: Kata ini lazim menunjuk pada angin timur, bukan hanya arah timur, dan sejalan dengan תֵימָן pada baris berikutnya.
- source_word: בַּשָּׁמָיִם
  choice: di langit
  rationale: Dalam konteks gerak angin, שָׁמַיִם menunjuk pada bentangan langit. ‘Di langit’ lebih alami dalam bahasa Indonesia modern daripada bentuk jamak harfiah.
- source_word: וַיְנַהֵג
  choice: menuntun
  rationale: נהג dapat berarti ‘menuntun’, ‘memimpin’, atau ‘menghalau’. ‘Menuntun’ mempertahankan gambaran bahwa Allah mengarahkan angin tanpa memperkeras maknanya menjadi ‘menghalau’.
- source_word: בְּעֻזּוֹ
  choice: dengan kekuatan-Nya
  rationale: עֹז berarti kekuatan, keperkasaan, atau kuasa. Frasa ini secara langsung menyatakan sarana yang dipakai-Nya.
- source_word: תֵימָן
  choice: angin selatan
  rationale: Secara leksikal kata ini berarti ‘selatan’, tetapi paralelismenya dengan ‘angin timur’ menunjukkan bahwa yang dimaksud ialah angin dari selatan. Penjelasan ini dicatat dalam catatan kaki.
theological_decisions:
- issue: Tindakan Allah atas kekuatan alam
  choice: Allah ditampilkan secara aktif menggerakkan dan menuntun angin.
  alternative: Merumuskan ayat secara impersonal, seolah-olah angin timbul dengan sendirinya.
  rationale: Kedua verba Ibrani memiliki Allah sebagai subjek. Terjemahan mempertahankan tindakan langsung-Nya tanpa menambahkan klaim teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Pengulangan ‘Ia’ pada klausa kedua memperjelas bahwa Allah tetap menjadi pelaku, sedangkan ‘di langit’ menyampaikan konteks atmosferis secara alami.
