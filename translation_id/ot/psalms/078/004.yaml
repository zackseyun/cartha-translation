id: PSA.78.4
reference: Psalms 78:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹ֤א נְכַחֵ֨ד מִ/בְּנֵי/הֶ֗ם לְ/ד֥וֹר אַחֲר֗וֹן מְֽ֭סַפְּרִים תְּהִלּ֣וֹת יְהוָ֑ה וֶ/עֱזוּז֥/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר עָשָֽׂה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: id
  text: Kami tidak akan menyembunyikan hal-hal itu dari anak-anak mereka; kepada generasi mendatang[b] kami akan menceritakan perbuatan-perbuatan Yahweh yang patut dipuji[a], keperkasaan-Nya, dan keajaiban-keajaiban yang telah dikerjakan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “puji-pujian bagi Yahweh.” Kata Ibrani ini dapat berarti pujian yang disampaikan kepada Yahweh atau perbuatan-Nya yang patut dipuji; konteks di sini lebih mendukung pengertian kedua.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kepada generasi berikutnya” atau “kepada generasi yang kemudian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: tidak akan menyembunyikan
  rationale: Bentuk piel dari כחד menyatakan tindakan menyembunyikan atau menahan agar tidak diketahui. Bentuk ini mempertahankan maksud kehendak dalam konteks pewarisan antargenerasi.
- source_word: מִבְּנֵיהֶם
  choice: dari anak-anak mereka
  rationale: בנים dapat berarti anak laki-laki, anak-anak, atau keturunan. Konteks pewarisan kepada generasi berikutnya mendukung istilah inklusif 'anak-anak'.
- source_word: לְדוֹר אַחֲרוֹן
  choice: kepada generasi mendatang
  rationale: Ungkapan ini menunjuk kepada generasi yang datang kemudian. 'Generasi mendatang' alami dalam bahasa Indonesia dan mempertahankan arah pandang ke masa depan.
- source_word: מְסַפְּרִים
  choice: kami akan menceritakan
  rationale: Partisipel ini menerangkan bagaimana mereka tidak menyembunyikan hal-hal tersebut, yaitu dengan menuturkannya. Klausa verbal dipakai agar kalimat Indonesia tetap jelas dan alami.
- source_word: תְּהִלּוֹת יְהוָה
  choice: perbuatan-perbuatan Yahweh yang patut dipuji
  rationale: תהלות dapat menunjuk pada pujian yang diberikan kepada Yahweh atau pada hal-hal terpuji yang dilakukan-Nya. Kesejajarannya dengan keperkasaan dan keajaiban yang dikerjakan-Nya mendukung pengertian perbuatan yang patut dipuji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' untuk mempertahankan nama diri yang terdapat dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: עֱזוּזוֹ
  choice: keperkasaan-Nya
  rationale: Kata benda ini menyatakan kekuatan atau kedahsyatan. 'Keperkasaan' sesuai dengan konteks karya-karya ilahi yang sedang diceritakan.
- source_word: נִפְלְאוֹתָיו
  choice: keajaiban-keajaiban-Nya
  rationale: Istilah ini menunjuk pada tindakan luar biasa yang menimbulkan rasa takjub. Bentuk jamak dipertahankan.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dikerjakan-Nya
  rationale: Klausa relatif ini menerangkan keajaiban-keajaiban tersebut sebagai tindakan yang sudah Yahweh kerjakan dan kini diceritakan kembali.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna תְּהִלּוֹת יְהוָה
  choice: perbuatan-perbuatan Yahweh yang patut dipuji
  alternative: puji-pujian bagi Yahweh
  rationale: Susunan sejajar dengan 'keperkasaan-Nya' dan 'keajaiban-keajaiban yang telah dikerjakan-Nya' lebih mendukung rujukan kepada tindakan atau sifat Yahweh yang layak dipuji, tetapi kemungkinan makna pujian yang ditujukan kepada-Nya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hal-hal itu' memperjelas rujukan jamak tersirat kepada hal-hal yang didengar dan diketahui dalam ayat sebelumnya. Titik koma mempertahankan hubungan erat antara tidak menyembunyikan dan tindakan menceritakan, sementara susunan klausa dibuat alami dalam bahasa Indonesia.
