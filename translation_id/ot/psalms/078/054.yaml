source:
  edition: WLC
  text: וַ֭/יְבִיאֵ/ם אֶל גְּב֣וּל קָדְשׁ֑/וֹ הַר זֶ֝֗ה קָנְתָ֥ה יְמִינֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: id
  text: Lalu Ia membawa mereka ke wilayah kekudusan-Nya[a], gunung ini[b] yang diperoleh tangan kanan-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke batas kekudusan-Nya” atau “ke wilayah-Nya yang kudus.” Kata Ibrani ini dapat berarti batas, daerah, atau wilayah.
    reason: lexical_alternative
  - marker: b
    text: Atau “bukit ini.” Ungkapan ini mungkin menunjuk kepada kawasan pegunungan yang Allah berikan kepada Israel dan, dalam konteks yang lebih luas, dapat pula membangkitkan gambaran Sion.
    reason: alternative_reading
  - marker: c
    text: Atau “yang direbut,” “yang dimiliki,” atau “yang dibeli oleh tangan kanan-Nya.” Kata Ibraninya memiliki beberapa arti yang berkaitan; di sini ungkapan itu menggambarkan apa yang diperoleh Allah dengan kuasa-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: Lalu Ia membawa mereka
  rationale: Bentuk hifil dari בוא berarti membawa; waw melanjutkan rangkaian tindakan dalam kisah puitis dan wajar diterjemahkan dengan “Lalu”.
- source_word: אֶל גְּבוּל קָדְשׁוֹ
  choice: ke wilayah-Nya yang kudus
  rationale: גְּבוּל dapat berarti batas, daerah, atau wilayah. Dalam konteks tujuan yang dimasuki Israel, “wilayah” menyampaikan cakupan tempat dengan alami, sedangkan קָדְשׁוֹ dipertahankan sebagai kepunyaan Allah dan berciri kudus.
- source_word: הַר זֶה
  choice: pegunungan ini
  rationale: הַר dapat menunjuk gunung maupun kawasan pegunungan. Di sini bentuk kolektif “pegunungan” sesuai dengan wilayah berbukit yang menjadi tujuan, tanpa secara eksplisit menyamakannya dengan Sion.
- source_word: קָנְתָה
  choice: diperoleh
  rationale: קנה mencakup memperoleh, memiliki, membeli, atau mendapatkan. Bentuk pasif dalam bahasa Indonesia mempertahankan tangan kanan-Nya sebagai pelaku dan tidak menyiratkan transaksi jual beli.
- source_word: יְמִינוֹ
  choice: tangan kanan-Nya
  rationale: Ungkapan antropomorfis Ibrani dipertahankan sebagai gambaran kuasa dan kemenangan ilahi.
theological_decisions:
- issue: Rujukan “pegunungan ini”
  choice: Mempertahankan ungkapan deiktis tanpa menyebut Sion atau Kanaan secara eksplisit.
  alternative: Sion; daerah pegunungan Kanaan; negeri pegunungan yang diberikan Allah kepada Israel
  rationale: Ayat ini sendiri tidak menetapkan rujukannya secara tegas. Terjemahan tidak menyelesaikan ketegangan antara cakupan negeri dan gema Sion dalam konteks mazmur.
- issue: Makna tindakan tangan kanan Allah
  choice: “diperoleh”
  alternative: direbut; dimiliki; dibeli; diciptakan
  rationale: Pilihan ini mempertahankan keluasan makna קנה dan tidak memaksakan gagasan transaksi, penciptaan, atau cara penguasaan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang jelas dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Aposisi Ibrani dibuat lebih alami dengan pengulangan “ke”, yang menjelaskan bahwa frasa kedua menguraikan tujuan yang sama.
