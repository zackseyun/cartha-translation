  text: שָׁמַ֣ע אֱ֭לֹהִים וַֽ/יִּתְעַבָּ֑ר וַ/יִּמְאַ֥ס מְ֝אֹ֗ד בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/059.yaml
  text: God heard and was furious[b][a], and he utterly rejected Israel.
translation:
  language: id
  text: Allah mendengar, lalu Ia menjadi murka[a] dan menolak[b] Israel sepenuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi marah” atau “bangkit dalam kemurkaan”. Kata kerja Ibrani ini dapat menyatakan menjadi marah atau tergugah untuk murka.
    reason: lexical_alternative
  - marker: b
    text: Atau “membuang” atau “memandang hina”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: mendengar
  rationale: Bentuk Qal perfektum ini secara umum berarti “mendengar”. Objeknya tersirat dari konteks, yaitu kelakuan Israel yang baru saja diceritakan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba yang menyertainya bermakna tunggal dan kata ini jelas menunjuk kepada Allah Israel.
- source_word: וַיִּתְעַבָּר
  choice: lalu murka
  rationale: Bentuk Hitpael dari עבר di sini menyatakan timbulnya kemarahan yang kuat. “Murka” mempertahankan bobot ungkapan Ibrani dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: וַיִּמְאַס
  choice: menolak
  rationale: מאס dapat berarti menolak, membuang, atau memandang hina. “Menolak” paling baik menyampaikan tindakan penolakan dalam konteks penghakiman perjanjian tanpa mempersempitnya menjadi perasaan jijik atau hina semata.
- source_word: מְאֹד
  choice: sama sekali
  rationale: Adverbia ini sangat menguatkan tindakan penolakan. Dalam susunan ini, “menolak ... sama sekali” lebih alami dalam bahasa Indonesia daripada “sangat menolak” dan menyampaikan kuatnya penolakan tersebut.
- source_word: בְּיִשְׂרָאֵל
  choice: Israel
  rationale: 'Dengan מאס, preposisi ב menandai sasaran penolakan. Bahasa Indonesia secara alami mengungkapkannya sebagai objek langsung: “menolak Israel”.'
theological_decisions:
- issue: Bahasa antropopatik tentang murka dan penolakan Allah
  choice: Mempertahankan ungkapan kuat “murka” dan “menolak Israel sama sekali”.
  alternative: Melunakkannya menjadi “tidak berkenan” atau “menjauh dari Israel”.
  rationale: Teks Ibrani memakai bahasa penghakiman perjanjian yang kuat. Ketegangan teologisnya perlu dipertahankan dan tidak dilunakkan; ayat ini menyatakan beratnya tanggapan dan penghakiman Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Konjungsi “lalu” mempertahankan urutan naratif, sedangkan pengulangan subjek “Ia” membuat dua tindakan Allah terbaca jelas. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
