base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/055.yaml
  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
translation:
  language: id
  text: Ia mengusir bangsa-bangsa dari hadapan mereka dan membagikan kepada mereka tanah pusaka dengan tali pengukur[a]; ia menempatkan suku-suku Israel di kemah-kemah mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menetapkan tanah pusaka bagi mereka dengan tali pengukur.” Ungkapan Ibrani memadukan gagasan pembagian jatah dan pengukuran wilayah.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di kemah-kemah mereka”; “kemah” dapat juga berarti tempat kediaman. Kata “mereka” paling mungkin merujuk kepada bangsa-bangsa yang diusir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: mengusir
  rationale: Kata גרש menyatakan tindakan menghalau atau mengeluarkan secara paksa; “mengusir” alami dalam bahasa Indonesia dan mempertahankan daya ungkapnya.
- source_word: מִפְּנֵיהֶם
  choice: dari hadapan mereka
  rationale: Terjemahan ini mempertahankan bentuk idiom Ibrani dan menyatakan bahwa bangsa-bangsa itu disingkirkan di depan Israel.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks pendudukan tanah Kanaan, bentuk jamak ini menunjuk kepada kelompok-kelompok bangsa yang mendiaminya.
- source_word: וַיַּפִּילֵם בְּחֶבֶל נַחֲלָה
  choice: membagikan tanah pusaka kepada mereka dengan tali pengukur
  rationale: Konstruksi ini menggambarkan pembagian wilayah pusaka dengan tali ukur. “Tanah pusaka” memperjelas bahwa נַחֲלָה di sini merupakan warisan berupa tanah, sedangkan “membagikan” menyampaikan pemakaian idiomatis נפל dalam konteks penjatahan.
- source_word: וַיַּשְׁכֵּן
  choice: menempatkan
  rationale: Bentuk kausatif dari שכן berarti membuat atau membiarkan tinggal; “menempatkan” menyampaikan tindakan Allah memberi tempat tinggal kepada suku-suku Israel.
- source_word: בְּאָהֳלֵיהֶם
  choice: di kemah-kemah bangsa-bangsa itu
  rationale: אהל secara konkret berarti “kemah”. Pronomina orang ketiga jamak paling wajar merujuk kepada bangsa-bangsa yang baru disebut, sehingga rujukannya dibuat eksplisit agar tidak membingungkan dalam bahasa Indonesia.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: suku-suku Israel
  rationale: Padanan langsung dan lazim bagi frasa konstruksi Ibrani ini.
theological_decisions:
- issue: Pelaku dalam penaklukan, pembagian tanah, dan penempatan Israel
  choice: Allah tetap menjadi subjek ketiga tindakan tersebut, dinyatakan dengan “Ia”.
  alternative: Mengulang “Allah” dalam ayat ini.
  rationale: Konteks mazmur menetapkan Allah sebagai pelaku. Pronomina mempertahankan kesinambungan wacana tanpa menambahkan nama yang tidak muncul dalam ayat.
- issue: Rujukan pronomina pada בְּאָהֳלֵיהֶם
  choice: Kemah-kemah itu dipahami sebagai milik bangsa-bangsa yang diusir.
  alternative: “di kemah-kemah mereka,” yang secara gramatikal dapat terdengar merujuk kepada suku-suku Israel.
  rationale: Anteceden gramatikal yang tersedia adalah גּוֹיִם (“bangsa-bangsa”), dan gambaran ayatnya adalah Israel ditempatkan di tempat tinggal penduduk terdahulu. Catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi “tanah pusaka” mempertahankan gagasan warisan turun-temurun sekaligus memperjelas konteks pertanahan; gambaran konkret “tali pengukur” dan “kemah-kemah” dipertahankan.
