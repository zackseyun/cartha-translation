  text: וַ/יְכַל בַּ/הֶ֥בֶל יְמֵי/הֶ֑ם וּ֝/שְׁנוֹתָ֗/ם בַּ/בֶּהָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: id
  text: Maka Ia menghabiskan hari-hari mereka dalam kesia-siaan[a], dan tahun-tahun mereka dalam kengerian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam kehampaan”; kata Ibrani juga dapat menggambarkan embusan napas atau uap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: menghabiskan
  rationale: Bentuk dari כלה dapat berarti menyelesaikan, mengakhiri, atau menghabiskan. Dalam konteks penghukuman dengan Allah sebagai subjek tersirat, “menghabiskan” mempertahankan daya aktif verba sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: בַּהֶבֶל
  choice: dalam kesia-siaan
  rationale: הֶבֶל secara harfiah menunjuk pada embusan napas atau uap, lalu secara kiasan pada kehampaan, kefanaan, dan kesia-siaan. “Dalam kesia-siaan” menyampaikan bahwa hari-hari mereka berakhir tanpa hasil atau makna yang bertahan, sambil mempertahankan keluasan maknanya.
- source_word: יְמֵיהֶם
  choice: hari-hari mereka
  rationale: Terjemahan langsung ini mempertahankan gambaran waktu dan kesejajarannya dengan “tahun-tahun mereka”.
- source_word: וּשְׁנוֹתָם
  choice: dan tahun-tahun mereka
  rationale: Terjemahan langsung mempertahankan paralelisme puitis Ibrani antara hari-hari dan tahun-tahun.
- source_word: בַּבֶּהָלָה
  choice: dalam kengerian
  rationale: בֶּהָלָה dapat menyatakan kengerian, kepanikan, keterkejutan, atau keadaan yang datang mendadak. Dalam konteks penghukuman ilahi, “kengerian” menyampaikan unsur ketakutan dengan jelas tanpa mempersempitnya menjadi sekadar ketergesa-gesaan.
theological_decisions:
- issue: Subjek tersirat dari וַיְכַל
  choice: Allah dinyatakan melalui kata ganti “Ia” sebagai pelaku yang menghabiskan hari-hari mereka.
  alternative: Konstruksi impersonal, misalnya “hari-hari mereka pun berakhir.”
  rationale: Konteks mazmur mengaitkan tindakan penghukuman ini dengan Allah, dan verba Ibrani berbentuk tunggal maskulin. “Ia” mempertahankan pelaku ilahi tanpa menambahkan nama yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Kapitalisasi “Ia” mengikuti rujukan kepada Allah. Struktur paralel “hari-hari mereka ... tahun-tahun mereka” dipertahankan.
