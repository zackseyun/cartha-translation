  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: id
  text: Ia meratakan jalan bagi murka-Nya[a]; Ia tidak menyayangkan nyawa mereka dari maut, tetapi menyerahkan hidup mereka kepada wabah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuka jalan bagi amarah-Nya.”'
    reason: Alternatif ini mencerminkan kemungkinan nuansa יְפַלֵּס sebagai menyiapkan atau memberi jalan, sementara אַף juga dapat diterjemahkan 'amarah'.
lexical_decisions:
- source_word: יְפַלֵּס נָתִיב
  choice: meratakan jalan
  rationale: Bentuk Piel dari פלס bersama נָתִיב menggambarkan tindakan membuat atau menyiapkan jalan agar dapat dilalui. Ungkapan ini mempertahankan metafora konkret Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: לְאַפּוֹ
  choice: bagi murka-Nya
  rationale: אַף secara harfiah dapat berarti 'hidung', tetapi dalam idiom ini berarti kemarahan atau murka. 'Murka' sesuai dengan konteks penghukuman dan register puitis mazmur.
- source_word: לֹא חָשַׂךְ
  choice: tidak menyayangkan
  rationale: חשׂך dalam konstruksi ini berarti tidak menahan atau tidak membebaskan dari akibat. 'Tidak menyayangkan' secara alami menyampaikan bahwa hidup mereka tidak diluputkan.
- source_word: מִמָּוֶת נַפְשָׁם
  choice: nyawa mereka dari maut
  rationale: נֶפֶשׁ di sini menunjuk pada nyawa atau kehidupan fana, bukan secara khusus unsur rohani yang terpisah. 'Nyawa' mempertahankan nuansa leksikalnya, sedangkan מִן diterjemahkan secara separatif sebagai 'dari'.
- source_word: וְחַיָּתָם
  choice: hidup mereka
  rationale: חַיָּה di sini menunjuk pada kehidupan atau keberadaan hidup mereka dan sejajar dengan נַפְשָׁם. Bentuk kolektif tunggal dipertahankan secara alami sebagai 'hidup mereka'.
- source_word: לַדֶּבֶר
  choice: kepada wabah
  rationale: דֶּבֶר menunjuk pada penyakit menular mematikan atau sampar dalam konteks penghukuman. 'Wabah' merupakan padanan modern yang jelas dan luas.
- source_word: הִסְגִּיר
  choice: menyerahkan
  rationale: Bentuk Hiphil dari סגר dapat berarti menyerahkan atau membiarkan jatuh ke dalam kuasa sesuatu. 'Menyerahkan' menyatakan tindakan aktif tanpa menambahkan gagasan yang tidak ada dalam teks.
theological_decisions:
- issue: Bahasa antropomorfis tentang murka ilahi
  choice: Mempertahankan metafora 'meratakan jalan bagi murka-Nya'.
  alternative: Membiarkan murka-Nya meluap atau memberi keleluasaan kepada murka-Nya.
  rationale: Teks Ibrani melukiskan murka seakan-akan menempuh sebuah jalan. Metafora puitis ini dipertahankan tanpa diubah menjadi rumusan teologis abstrak.
- issue: Makna נֶפֶשׁ dalam konteks kematian
  choice: Menerjemahkannya sebagai 'nyawa', bukan 'jiwa'.
  alternative: jiwa mereka
  rationale: Dalam konteks ini נֶפֶשׁ menunjuk pada kehidupan fana yang dapat mati. 'Nyawa' menghindari kesan bahwa ayat ini secara khusus membicarakan jiwa tak berjasad.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Metafora jalan dipertahankan, sedangkan istilah tentang kehidupan dibedakan sebagai 'nyawa' dan 'hidup' untuk mencerminkan paralelisme Ibrani.
