  text: from following the nursing ewes he brought him[a], to shepherd Jacob his people[b], and Israel his inheritance.
translation:
  language: id
  text: Dari mengikuti domba-domba betina yang sedang menyusui, Dia membawa Daud[a] untuk menggembalakan Yakub, umat-Nya, dan Israel, warisan-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Dia membawanya.” Yang dimaksud adalah Daud.'
    reason: referent_clarification
  - marker: b
    text: “Warisan” dapat juga diterjemahkan “milik pusaka,” “pusaka,” atau “milik-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחַר
  choice: dari belakang
  rationale: Gabungan מִן dan אַחַר menunjukkan bahwa Daud diambil dari posisi di belakang kawanan yang diikutinya. Ungkapan ini mempertahankan gambaran penggembalaan secara alami dalam bahasa Indonesia.
- source_word: עָלוֹת
  choice: domba-domba betina yang menyusui
  rationale: Bentuk feminin jamak ini dalam konteks pastoral merujuk kepada induk domba yang menyusui anak-anaknya; terjemahan ini mempertahankan kekhususan istilah Ibrani.
- source_word: הֱבִיאוֹ
  choice: Dia membawa Daud
  rationale: Bentuk Hifil dari בוא berarti 'membawa'. Allah adalah subjek tersirat dari konteks sebelumnya, sedangkan sufiks objek merujuk kepada Daud. Nama Daud dinyatakan agar rujukan pronominal jelas dalam bahasa Indonesia.
- source_word: לִרְעוֹת
  choice: untuk menggembalakan
  rationale: רעה mempertahankan metafora gembala dan menghubungkan pekerjaan Daud sebelumnya dengan tugasnya atas umat Israel.
- source_word: בְּיַעֲקֹב עַמּוֹ
  choice: Yakub, umat-Nya
  rationale: Preposisi ב menandai pihak yang digembalakan, sedangkan עַמּוֹ berdiri sebagai aposisi bagi Yakub. Tanda koma membuat hubungan itu jelas dan alami.
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: dan Israel, milik pusaka-Nya
  rationale: נַחֲלָה dapat berarti warisan, pusaka, atau milik yang menjadi bagian seseorang. 'Milik pusaka-Nya' menjaga nuansa kepunyaan perjanjian sekaligus terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Metafora kerajaan-penggembalaan dalam panggilan Daud
  choice: Mempertahankan citra itu secara eksplisit dengan 'menggembalakan'.
  alternative: '''memimpin'' atau ''memelihara'' umat Yakub'
  rationale: Ayat ini sengaja menghubungkan pekerjaan harfiah Daud sebagai gembala dengan perannya atas Israel. Terjemahan tersebut mempertahankan kaitan sastra dan teologis tanpa menambahkan klaim doktrinal.
- issue: Allah sebagai subjek tersirat dan Daud sebagai objek
  choice: Menggunakan 'Dia' untuk Allah dan menyebut 'Daud' sebagai objek.
  alternative: '''Ia membawanya'''
  rationale: Teks Ibrani memakai subjek tersirat dan sufiks pronominal. Penyebutan Daud menjernihkan rujukan bagi pembaca modern tanpa mengubah relasi sintaksis atau isi ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Pengulangan nama kolektif 'Yakub' dan 'Israel' serta paralelisme kedua baris dipertahankan. Kapitalisasi pronomina ilahi mengikuti kebiasaan terjemahan Alkitab Indonesia dan membantu membedakan Allah dari Daud.
