source:
  edition: WLC
  text: וַֽ֭/יִּזְכְּרוּ כִּֽי אֱלֹהִ֣ים צוּרָ֑/ם וְ/אֵ֥ל עֶ֝לְיוֹן גֹּאֲלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/035.yaml
  text: Then they remembered that God was their rock[a], and God Most High was their redeemer.
translation:
  language: id
  text: Lalu mereka ingat bahwa Allah adalah gunung batu mereka, dan Allah Yang Mahatinggi[a] adalah penebus mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Allah Mahatinggi”. Susunan Ibraninya ialah “Allah Mahatinggi, penebus mereka”.'
    reason: Menjelaskan susunan gelar ilahi dalam bahasa Ibrani dan alternatif terjemahan yang lebih harfiah.
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: Lalu mereka ingat
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan daya sekuensialnya secara wajar dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang mereka ingat, bukan alasan atau sebab.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuknya secara morfologis jamak, kata ini menunjuk kepada Allah Israel dalam pengertian tunggal.
- source_word: צוּרָם
  choice: gunung batu mereka
  rationale: צוּר merupakan metafora bagi tempat perlindungan, keteguhan, dan kekuatan. “Gunung batu” mempertahankan metafora tersebut dan lazim dipahami dalam bahasa Indonesia Alkitabiah.
- source_word: וְאֵל עֶלְיוֹן
  choice: dan Allah Yang Mahatinggi
  rationale: אֵל diterjemahkan sebagai gelar ilahi “Allah”, sedangkan עֶלְיוֹן dinyatakan dengan gelar baku dan alami “Yang Mahatinggi”.
- source_word: גֹּאֲלָם
  choice: penebus mereka
  rationale: Partisip dari גאל menunjuk kepada pihak yang menebus atau bertindak sebagai penebus. Pilihan ini mempertahankan bentuk nominal tanpa mempersempitnya menjadi istilah hukum khusus mengenai kerabat-penebus.
theological_decisions:
- issue: Dua sebutan ilahi אֱלֹהִים dan אֵל עֶלְיוֹן dalam paralelisme puisi
  choice: 'Menerjemahkan keduanya dengan “Allah”: “Allah ... dan Allah Yang Mahatinggi”.'
  alternative: “Allah ... dan El Yang Mahatinggi” atau “Allah ... dan Yang Mahatinggi”.
  rationale: Kedua sebutan itu menunjuk kepada Allah yang sama. Pengulangan “Allah” mempertahankan paralelisme serta menghindari kesan adanya dua pribadi ilahi yang berbeda, sedangkan gelar diterjemahkan dan tidak ditransliterasikan.
- issue: Nuansa גֹּאֵל
  choice: penebus mereka
  alternative: kerabat-penebus mereka; Dia yang menebus mereka
  rationale: Konteks puisi ini menegaskan tindakan penyelamatan Allah tanpa secara eksplisit membatasi maknanya pada lembaga hukum kerabat-penebus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kopula “adalah” ditambahkan pada kedua klausa agar predikasi nominal jelas dan alami. Huruf kecil pada “gunung batu” dan “penebus” mempertahankan keduanya sebagai metafora dan sebutan, bukan nama diri.
