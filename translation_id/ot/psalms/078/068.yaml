  text: Namun Ia memilih suku Yehuda dan Gunung Sion yang dikasihi-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Namun, Ia memilih
  rationale: Waw-konsekutif melanjutkan kisah, sedangkan konteks setelah penolakan terhadap keturunan Yusuf dan suku Efraim menonjolkan pertentangan; karena itu, “Namun” wajar dalam bahasa Indonesia. Kata בחר berarti “memilih”.
- source_word: שֵׁבֶט יְהוּדָה
  choice: suku Yehuda
  rationale: Dalam konteks pembagian suku-suku Israel, שֵׁבֶט berarti “suku”; bentuk konstruksi dengan יְהוּדָה secara alami diterjemahkan “suku Yehuda”.
- source_word: הַר צִיּוֹן
  choice: Gunung Sion
  rationale: Padanan baku dan alami bagi nama tempat הַר צִיּוֹן.
- source_word: אֲשֶׁר אָהֵב
  choice: yang dikasihi-Nya
  rationale: Klausa relatif ini paling langsung menerangkan “Gunung Sion”. Bentuk pasif berpelaku “-Nya” menghasilkan ungkapan Indonesia yang alami sekaligus mempertahankan arti verba “mengasihi”.
- source_word: אֶת ... אֶת
  choice: suku Yehuda, Gunung Sion
  rationale: Bahasa Ibrani memakai satu verba dengan dua frasa yang masing-masing ditandai sebagai objek langsung, tanpa kata sambung. Tanda koma mempertahankan bentuk padat dan ketegangan sintaksis tersebut; catatan kaki menjelaskan kemungkinan membacanya sebagai dua objek yang dikoordinasikan.
theological_decisions:
- issue: Hubungan pemilihan ilahi atas Yehuda dan Sion
  choice: 'Mempertahankan susunan padat: “suku Yehuda, Gunung Sion”, tanpa mengembangkan maknanya menjadi uraian doktrinal tentang pemilihan.'
  alternative: '“suku Yehuda dan Gunung Sion” atau mengulangi verba: “Ia memilih suku Yehuda; Ia memilih Gunung Sion”.'
  rationale: Teks Ibrani menempatkan dua penanda objek langsung di bawah satu verba tanpa konjungsi. Terjemahan utama mempertahankan ambiguitas formal antara daftar dua objek dan hubungan penjelas yang erat, sedangkan catatan kaki menyajikan pembacaan koordinatif yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Kapitalisasi “Ia” dan enklitik “-Nya” dipakai untuk rujukan kepada Allah sesuai kebiasaan umum dalam teks religius Indonesia; “dikasihi-Nya” lebih alami daripada “yang Ia kasihi” dalam register ini.
