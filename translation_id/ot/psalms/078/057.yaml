reference: Psalms 78:57
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּסֹּ֣גוּ וַֽ֭/יִּבְגְּדוּ כַּ/אֲבוֹתָ֑/ם נֶ֝הְפְּכ֗וּ כְּ/קֶ֣שֶׁת רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/057.yaml
  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: id
  text: Namun, mereka berbalik dan berkhianat seperti bapak-bapak mereka; mereka menyimpang seperti busur yang tidak dapat dipercaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti busur yang kendur” atau “seperti busur yang cacat”—yaitu, busur yang tidak dapat diandalkan untuk melontarkan anak panah tepat ke sasaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: berbalik
  rationale: Kata kerja סוּג menyatakan mundur atau berbalik dari jalan yang sebelumnya ditempuh. 'Berbalik' alami dalam bahasa Indonesia dan tidak memasukkan jargon teologis tambahan.
- source_word: וַיִּבְגְּדוּ
  choice: berkhianat
  rationale: בגד menyatakan tindakan khianat atau ketidaksetiaan yang berat. 'Berkhianat' mempertahankan daya moral dan relasional kata kerja tanpa menambahkan objek yang tidak disebutkan.
- source_word: כַּאֲבוֹתָם
  choice: seperti bapak-bapak mereka
  rationale: Teks Ibrani secara eksplisit memakai bentuk maskulin 'bapak-bapak mereka'. Bentuk ini dipertahankan daripada dinetralkan menjadi 'nenek moyang mereka'.
- source_word: נֶהְפְּכוּ
  choice: menyimpang
  rationale: Dalam perumpamaan tentang busur, bentuk dari הפך menggambarkan perubahan arah atau penyimpangan. 'Menyimpang' menyampaikan bahwa mereka tidak lagi menuju sasaran yang benar secara alami dalam bahasa Indonesia.
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: seperti busur yang tidak dapat dipercaya
  rationale: רְמִיָּה dapat berarti menipu, kendur, atau tidak andal. Karena busur tidak menipu secara harfiah, ungkapan ini menyampaikan gambaran alat yang meleset dan tidak dapat diandalkan sambil mempertahankan personifikasi Ibrani secara wajar.
theological_decisions:
- issue: Nuansa ketidaksetiaan Israel dalam konteks perjanjian
  choice: Memakai kata bermuatan moral 'berkhianat' tanpa menyebut secara eksplisit bahwa mereka melanggar perjanjian atau mengkhianati Allah.
  alternative: Menerjemahkan 'tidak setia' atau memperjelasnya menjadi 'mengingkari perjanjian dengan Allah'.
  rationale: Konteks mazmur berkaitan dengan ketidaksetiaan perjanjian, tetapi ayat ini sendiri tidak menyatakan objek tindakan tersebut. Terjemahan mempertahankan bobot moral dan relasionalnya tanpa menambahkan keterangan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bapak-bapak mereka' mempertahankan bentuk keluarga maskulin dalam sumber; 'busur yang tidak dapat dipercaya' dibuat mudah dipahami tanpa menghilangkan ambiguitas leksikal, yang dicatat dalam catatan kaki.
