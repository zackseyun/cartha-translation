  text: וְ/לֹ֤א יִהְי֨וּ כַּ/אֲבוֹתָ֗/ם דּוֹר֮ סוֹרֵ֪ר וּ/מֹ֫רֶ֥ה דּ֭וֹר לֹא הֵכִ֣ין לִבּ֑/וֹ וְ/לֹא נֶאֶמְנָ֖ה אֶת אֵ֣ל רוּחֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/008.yaml
  text: and that they should not be like their fathers[a], a stubborn and rebellious generation[b], a generation that did not set its heart aright and whose spirit was not faithful to God.
translation:
  language: id
  text: supaya mereka jangan menjadi seperti nenek moyang mereka, angkatan yang keras kepala dan memberontak, angkatan yang tidak meneguhkan hatinya[a] dan yang rohnya[b] tidak setia kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mempersiapkan hatinya” atau “menetapkan hatinya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang rohnya tidak teguh bersama Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִהְיוּ
  choice: supaya mereka tidak menjadi
  rationale: Melanjutkan tujuan dari ayat sebelumnya dan secara alami menyatakan maksud agar angkatan mendatang tidak meniru para pendahulunya.
- source_word: כַאֲבוֹתָם
  choice: seperti nenek moyang mereka
  rationale: Dalam konteks sejarah umat, 'nenek moyang' lebih alami daripada 'bapak-bapak' dan tetap mempertahankan acuan antargenerasi.
- source_word: דּוֹר
  choice: angkatan
  rationale: Padanan lazim dalam konteks Alkitab untuk suatu kelompok sezaman; pengulangannya mempertahankan kesejajaran puitis.
- source_word: סוֹרֵר וּמֹרֶה
  choice: keras kepala dan memberontak
  rationale: Mengungkapkan baik sikap batin yang sulit diarahkan maupun perlawanan aktif.
- source_word: הֵכִין לִבּוֹ
  choice: meneguhkan hatinya
  rationale: Menjaga metafora Ibrani tentang menetapkan atau memantapkan hati tanpa mempersempitnya menjadi aktivitas intelektual saja.
- source_word: לִבּוֹ
  choice: hatinya
  rationale: '''Hati'' mempertahankan idiom antropologis Ibrani yang mencakup kehendak dan kecenderungan batin.'
- source_word: רוּחוֹ
  choice: jiwanya
  rationale: Dalam konteks ini רוּח menunjuk pada batin atau disposisi manusia. 'Jiwa' alami dalam bahasa Indonesia dan tetap dibedakan dari 'hati'.
- source_word: נֶאֶמְנָה אֶת אֵל
  choice: tidak setia kepada Allah
  rationale: Nifal אמן menyatakan keteguhan atau kesetiaan; konstruksi dengan אֶת menyatakan hubungan dengan Allah.
theological_decisions:
- issue: Pasangan antropologis 'hati' dan 'roh/jiwa'
  choice: 'Mempertahankan dua istilah berbeda: ''hati'' dan ''jiwa''.'
  alternative: Menyatukan keduanya sebagai 'batin', atau menerjemahkan רוּחוֹ secara lebih harfiah sebagai 'rohnya'.
  rationale: Teks Ibrani sengaja memakai dua istilah yang berkaitan tetapi tidak identik. 'Jiwa' di sini menyampaikan disposisi batin manusia tanpa mengesankan bahwa yang dimaksud ialah Roh Kudus.
- issue: Acuan tunggal kolektif pada 'angkatan'
  choice: Menggunakan bentuk tunggal '-nya' pada 'hatinya' dan 'jiwanya'.
  alternative: Menggunakan bentuk jamak, misalnya 'hati mereka' dan 'jiwa mereka'.
  rationale: Sufiks Ibrani berbentuk tunggal dan kembali kepada דּוֹר, kata benda kolektif tunggal; bentuk Indonesia ini tetap wajar dan menjaga struktur sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur puitis dipertahankan melalui pengulangan 'angkatan'; istilah antropologis tidak diratakan. Semua penanda catatan kaki dicantumkan dalam teks utama.
