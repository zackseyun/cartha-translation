base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/062.yaml
  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: id
  text: Ia menyerahkan umat-Nya kepada pedang, dan murka terhadap milik pusaka-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Ia menyerahkan
  rationale: Bentuk Hifil dari סגר dalam konteks ini berarti menyerahkan seseorang ke dalam kuasa pihak atau sarana lain, bukan sekadar menutup atau mengurung.
- source_word: לַחֶרֶב
  choice: kepada pedang
  rationale: חֶרֶב secara harfiah berarti 'pedang' dan di sini merupakan metonimia bagi kematian dalam pertempuran; citra Ibrani dipertahankan.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עַם dengan sufiks orang ketiga maskulin tunggal berarti 'umat-Nya'; 'umat' wajar dalam konteks hubungan Allah dengan Israel.
- source_word: וּבְנַחֲלָתוֹ
  choice: terhadap milik pusaka-Nya
  rationale: נַחֲלָה menunjuk kepada warisan atau milik pusaka, yakni Israel sebagai kepunyaan Allah. Preposisi ב dalam ungkapan kemarahan ini secara alami dinyatakan dengan 'terhadap' dalam bahasa Indonesia.
- source_word: הִתְעַבָּר
  choice: murka
  rationale: Bentuk Hitpael dari עבר dalam idiom ini menyatakan kemarahan yang hebat. 'Murka' merupakan ungkapan Indonesia yang ringkas, kuat, dan bermartabat.
theological_decisions:
- issue: Sebutan perjanjian bagi Israel
  choice: umat-Nya ... milik pusaka-Nya
  alternative: bangsa-Nya ... warisan-Nya
  rationale: Kedua sebutan dipertahankan secara berbeda untuk menunjukkan bahwa penghakiman Allah menimpa mereka yang tetap disebut umat dan kepunyaan-Nya sendiri.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Paralelisme Ibrani dipertahankan; citra 'pedang' tidak dijelaskan di dalam teks, dan intensitas kemarahan ilahi dinyatakan dengan 'murka'.
