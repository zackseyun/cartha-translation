  source_fidelity: 'Teks Indonesia dengan tepat merepresentasikan dua klausa Ibrani: וַיַּסְגֵּר berarti Allah menyerahkan umat-Nya kepada kuasa pedang, dan הִתְעַבָּר menyatakan kemarahan-Nya yang hebat terhadap נַחֲלָתוֹ, milik pusaka-Nya. Citra literal ‘pedang’ dipertahankan tanpa menghapus fungsi metonimisnya bagi kekerasan/perang.'
