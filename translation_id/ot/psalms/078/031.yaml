  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: id
  text: Lalu murka Allah bangkit melawan mereka; Ia membunuh orang-orang mereka yang tegap[a] dan menumbangkan para pemuda Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang-orang gemuk mereka”; kemungkinan menunjuk pada orang-orang yang tegap atau kuat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אֱלֹהִים
  choice: Lalu murka Allah
  rationale: אַף secara harfiah dapat berarti 'hidung', tetapi dalam ungkapan ini berarti murka. 'Lalu' menyampaikan kelanjutan narasi dari וְ secara alami.
- source_word: עָלָה בָהֶם
  choice: bangkit terhadap mereka
  rationale: Mempertahankan gambaran Ibrani tentang murka yang 'bangkit' serta nuansa permusuhan pada בָהֶם.
- source_word: וַיַּהֲרֹג
  choice: Ia membunuh
  rationale: Padanan langsung dan jelas bagi הרג dalam bahasa Indonesia modern.
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: orang-orang yang paling kuat di antara mereka
  rationale: Secara harfiah menunjuk kepada 'orang-orang gemuk mereka', tetapi dalam konteks kemungkinan berarti anggota mereka yang paling tegap, kuat, atau terpilih. Terjemahan utama menyampaikan makna kontekstual, sedangkan arti harfiah dicatat dalam catatan kaki.
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: para pemuda Israel
  rationale: בָּחוּר lazim menunjuk kepada laki-laki muda yang sedang berada pada puncak kekuatannya.
- source_word: הִכְרִיעַ
  choice: menumbangkan
  rationale: Bentuk kausatif dari כרע menggambarkan tindakan membuat seseorang rebah atau jatuh; 'menumbangkan' sesuai dengan paralelisme puitis dan konteks penghukuman.
theological_decisions:
- issue: Ungkapan antropopatik tentang murka ilahi
  choice: murka Allah bangkit terhadap mereka
  alternative: Allah menjadi murka kepada mereka; murka Allah menimpa mereka
  rationale: Pilihan ini mempertahankan metafora sumber bahwa murka itu 'bangkit' tanpa mengubahnya menjadi pernyataan teologis yang lebih datar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur puitis dipertahankan melalui dua klausa sejajar, dengan huruf kapital pada kata ganti 'Ia' sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
