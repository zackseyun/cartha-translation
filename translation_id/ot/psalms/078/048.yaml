base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/048.yaml
  text: He gave over their cattle to the hail[a], and their livestock to the lightning bolts.
translation:
  language: id
  text: Ia menyerahkan hewan mereka kepada hujan es, dan ternak mereka kepada sambaran kilat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “panah-panah api” atau “nyala api”; istilah Ibrani ini dapat menunjuk kepada kekuatan penghancur yang menyala atau berkilat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Ia menyerahkan
  rationale: Kata kerja סגר dapat berarti menutup atau menyerahkan. Dalam konteks tulah ini, “menyerahkan” secara alami menyatakan bahwa Allah membiarkan hewan-hewan itu dikuasai oleh kekuatan yang membinasakan.
- source_word: לַבָּרָד
  choice: kepada hujan es
  rationale: בָּרָד berarti “hujan es”, sedangkan prefiks ל menyatakan apa yang kepadanya hewan-hewan itu diserahkan.
- source_word: בְּעִירָם
  choice: hewan mereka
  rationale: בְּעִיר dapat menunjuk kepada hewan, khususnya hewan ternak atau hewan pengangkut. “Hewan” mempertahankan cakupan istilah ini dan membedakannya dari מִקְנֶה pada baris sejajar.
- source_word: וּמִקְנֵיהֶם
  choice: dan ternak mereka
  rationale: מִקְנֶה menunjuk kepada ternak sebagai milik. “Ternak” wajar dalam bahasa Indonesia dan tetap mempertahankan kesejajaran serta tumpang tindih makna dengan istilah sebelumnya.
- source_word: לָרְשָׁפִים
  choice: kepada sambaran kilat
  rationale: רְשָׁפִים dapat menunjuk kepada kilatan atau daya membakar yang menghancurkan. Dalam konteks tulah Mesir dan kesejajarannya dengan hujan es, “sambaran kilat” paling mungkin menyampaikan gambaran cuaca yang dimaksud, sementara cakupan makna yang lebih luas dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. Perbedaan antara בְּעִיר dan מִקְנֶה dipertahankan melalui “hewan” dan “ternak”, tanpa melebih-lebihkan perbedaan semantis keduanya. Penanda catatan kaki ditempatkan sesudah “sambaran kilat” karena catatan tersebut menjelaskan לָרְשָׁפִים.
