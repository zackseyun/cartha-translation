  text: He rained meat on them like dust[b][a], and winged birds like the sand of the seas.
translation:
  language: id
  text: 'Ia menghujani mereka dengan daging seperti debu[a],

    dan dengan burung-burung bersayap seperti pasir lautan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שְׁאֵר berarti “daging”; di sini yang dimaksud ialah daging untuk dimakan yang disediakan di padang gurun.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pasir laut-laut”; bahasa Ibrani memakai bentuk jamak “lautan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Ia menghujani
  rationale: Bentuk Hifil dari מטר berarti ‘menyebabkan turun seperti hujan’ atau ‘menghujankan’. ‘Ia menghujani’ mempertahankan gambaran puitis dan makna kausatif dalam bahasa Indonesia yang wajar.
- source_word: עֲלֵיהֶם
  choice: mereka
  rationale: Dengan verba ‘menghujani’, sasaran yang ditandai oleh עַל paling alami dinyatakan sebagai objek langsung ‘mereka’; makna ‘ke atas mereka’ tetap terkandung.
- source_word: כֶּעָפָר
  choice: seperti debu
  rationale: Prefiks כ menyatakan perbandingan. ‘Seperti debu’ mempertahankan perumpamaan tentang jumlah yang sangat banyak.
- source_word: שְׁאֵר
  choice: daging
  rationale: שְׁאֵר dapat berarti daging atau tubuh jasmani. Dalam konteks pemberian makanan di padang gurun, ‘daging’ paling tepat dan tetap mencakup nuansa dasar kata Ibraninya.
- source_word: וּכְחוֹל יַמִּים
  choice: seperti pasir lautan
  rationale: Ungkapan ini secara harfiah memakai bentuk jamak ‘lautan’. ‘Pasir lautan’ terdengar puitis dan alami sambil tetap mendekati bentuk Ibrani.
- source_word: עוֹף כָּנָף
  choice: burung-burung bersayap
  rationale: Frasa ini secara harfiah berarti ‘burung bersayap’ atau ‘makhluk terbang bersayap’. Pilihan ini mempertahankan gambaran aslinya dan jelas bagi pembaca modern.
