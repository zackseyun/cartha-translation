  text: He destroyed their vines with hail[a], and their sycamore trees with frost.
translation:
  language: id
  text: 'Ia memusnahkan tanaman anggur mereka dengan hujan es,

    dan pohon-pohon ara-sikomor mereka dengan embun beku.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan belalang,” “dengan batu-batu es,” atau “dengan hujan es bercampur salju”; istilah Ibraninya langka dan tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַהֲרֹג
  choice: membinasakan
  rationale: Secara harfiah verba ini berarti 'membunuh' atau 'membantai', tetapi karena objeknya tumbuhan, 'membinasakan' menyampaikan akibatnya secara wajar sambil mempertahankan kekuatan ungkapannya.
- source_word: בַּבָּרָד
  choice: dengan hujan es
  rationale: Preposisi ב berfungsi instrumental; 'dengan hujan es' menyatakan sarana penghancuran secara alami dalam bahasa Indonesia.
- source_word: גַּפְנָם
  choice: tanaman anggur mereka
  rationale: Nomina tunggal kolektif dengan sufiks orang ketiga jamak merujuk pada pokok-pokok anggur, bukan secara eksplisit pada lahan kebun anggur.
- source_word: וְשִׁקְמוֹתָם
  choice: dan pohon-pohon ara hutan mereka
  rationale: שִׁקְמָה adalah sycamore fig (Ficus sycomorus), bukan sycamore modern yang berbeda; 'pohon ara hutan' merupakan nama Indonesia yang cukup dikenal dan lebih tepat secara botani.
- source_word: בַּחֲנָמַל
  choice: dengan embun beku
  rationale: Istilah Ibrani ini sangat langka dan maknanya tidak pasti. 'Embun beku' cocok dengan paralelisme cuaca merusak bersama hujan es, sementara ketidakpastian dan alternatif penting dipertahankan dalam catatan kaki.
