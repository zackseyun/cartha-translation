  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
translation:
  language: id
  text: supaya mereka menaruh harapan mereka kepada Allah[a], tidak melupakan perbuatan-perbuatan Allah[b], dan menaati perintah-perintah-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau ‘kepercayaan mereka’ atau ‘keyakinan mereka’.
    reason: lexical_alternative
  - marker: b
    text: Atau ‘karya-karya Allah’ atau ‘tindakan-tindakan Allah’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׂימוּ
  choice: supaya mereka menaruh
  rationale: Bentuk imperfek Qal orang ketiga jamak dari שׂים berarti ‘menaruh/menempatkan’. Dalam kesinambungan tujuan dari ayat sebelumnya, ‘supaya mereka menaruh’ menyampaikan fungsi klausa secara alami dalam bahasa Indonesia.
- source_word: בֵאלֹהִים
  choice: kepada Allah
  rationale: Preposisi ב menandai pribadi yang menjadi tumpuan harapan. Dalam ungkapan Indonesia, ‘menaruh harapan kepada Allah’ lebih alami daripada terjemahan harfiah ‘di dalam Allah’.
- source_word: כִּסְלָם
  choice: harapan mereka
  rationale: כֶּסֶל dapat berarti harapan, kepercayaan, atau keyakinan. ‘Harapan’ cocok dengan nada nasihat mazmur dan tetap mengandung gagasan bersandar dengan yakin; alternatifnya dicatat dalam catatan kaki.
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: tidak melupakan
  rationale: Bentuk imperfek Qal yang dinegasikan ini menyatakan tujuan agar mereka tidak melupakan. Susunan tanpa pengulangan ‘supaya’ tetap jelas dan alami.
- source_word: מַעַלְלֵי אֵל
  choice: perbuatan-perbuatan Allah
  rationale: מַעֲלָלִים menunjuk pada berbagai perbuatan atau tindakan. Bentuk ulang ‘perbuatan-perbuatan’ menyampaikan bentuk jamak Ibrani, sedangkan ‘Allah’ menerjemahkan אֵל tanpa menambahkan gelar yang tidak dinyatakan.
- source_word: וּמִצְוֺתָיו
  choice: tetapi ... perintah-perintah-Nya
  rationale: מִצְוֹתָיו berarti perintah-perintah milik-Nya. ‘Tetapi’ menyatakan kontras praktis antara melupakan dan menaati yang tersirat oleh rangkaian klausa.
- source_word: יִנְצֹרוּ
  choice: menaati
  rationale: נצר secara dasar berarti menjaga atau memelihara; ketika objeknya adalah perintah, ‘menaati’ paling jelas dan alami bagi pembaca Indonesia modern, sambil menyampaikan pelaksanaan yang sungguh-sungguh.
theological_decisions:
- issue: Penerjemahan dua sebutan ilahi אֱלֹהִים dan אֵל dalam paralelisme
  choice: Keduanya diterjemahkan ‘Allah’
  alternative: Menerjemahkan אֵל sebagai ‘Yang Mahakuasa’ atau ‘Allah Yang Perkasa’
  rationale: Kedua istilah merupakan sebutan umum bagi Allah dalam paralelisme puitis, bukan nama perjanjian YHWH. Menerjemahkan keduanya sebagai ‘Allah’ mempertahankan rujukan yang sama tanpa memasukkan pembedaan teologis atau gelar tambahan yang tidak ditekankan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tujuan dari konteks dipertahankan dengan ‘supaya’; pengulangan bentuk jamak digunakan untuk mencerminkan nomina jamak Ibrani, sedangkan pilihan kata tetap mudah dipahami pembaca umum.
