  text: So he shepherded them with integrity of heart[b][a], and guided them with the skill of his hands.
translation:
  language: id
  text: Maka ia menggembalakan mereka dengan ketulusan hatinya[a] dan menuntun mereka dengan kecakapan tangannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sesuai dengan ketulusan hatinya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dengan pengertian kedua tangannya,” yaitu dengan kecakapan dan daya membedakan yang terampil dalam kepemimpinannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: ia menggembalakan mereka
  rationale: Bentuk dari רעה berarti menggembalakan atau menjaga kawanan. Dalam konteks pemerintahan Daud, pilihan ini mempertahankan gambaran raja sebagai gembala.
- source_word: כְּתֹם לְבָבוֹ
  choice: dengan ketulusan hatinya
  rationale: תֹם menyatakan keutuhan moral, ketulusan, atau integritas. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan 'hati' sebagai pusat batin, kehendak, dan pertimbangan.
- source_word: וּבִתְבוּנוֹת כַּפָּיו
  choice: dengan kecakapan tangannya
  rationale: תְּבוּנָה dapat berarti pengertian atau daya membedakan; bersama כַּפָּיו ('tangan-tangannya'), frasa ini menunjuk pada kemampuan praktis dalam memimpin. 'Kecakapan tangannya' mempertahankan metafora jasmaniah dengan bahasa Indonesia yang wajar.
- source_word: יַנְחֵם
  choice: menuntun mereka
  rationale: Bentuk Hifil dari נחה berarti memimpin atau menuntun. 'Menuntun' selaras dengan gambaran penggembalaan dan menyiratkan pengarahan yang penuh perhatian.
theological_decisions:
- issue: Gambaran Daud sebagai raja-gembala
  choice: Mempertahankan kata kerja eksplisit 'menggembalakan'.
  alternative: Menggunakan ungkapan umum seperti 'memelihara' atau 'memimpin'.
  rationale: Ayat ini menutup gambaran mazmur tentang Daud sebagai raja pilihan TUHAN yang menggembalakan umat. Pilihan ini menjaga metafora kerajaan-pastoral tanpa memasukkan klaim mesianik yang tidak dinyatakan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel Ibrani dipertahankan, sedangkan ungkapan 'kecakapan tangannya' dipilih agar metafora tangan tetap hadir dan maknanya mudah dipahami.
