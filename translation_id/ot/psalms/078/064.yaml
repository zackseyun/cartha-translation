  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: id
  text: Para imamnya gugur oleh pedang, dan janda-jandanya tidak menangis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak dapat menangis.” Secara harfiah bahasa Ibrani berbunyi “tidak menangis”; ungkapan itu dapat sekadar menyatakan kenyataan atau menyiratkan bahwa kehancuran tersebut tidak memberi kesempatan untuk menjalankan perkabungan sebagaimana biasanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: para imamnya
  rationale: כֹּהֵן secara lazim berarti imam, yaitu pejabat keagamaan Israel. Bentuk dengan sufiks orang ketiga tunggal dipertahankan secara alami melalui -nya.
- source_word: בַּחֶרֶב
  choice: oleh pedang
  rationale: Preposisi ב menyatakan sarana kematian. Ungkapan 'gugur oleh pedang' alami dalam bahasa Indonesia dan mempertahankan citra perang dalam bahasa Ibrani.
- source_word: נָפָלוּ
  choice: gugur
  rationale: נפל secara harfiah berarti jatuh, tetapi dalam konteks perang menyatakan tewas. 'Gugur' menyampaikan kematian akibat kekerasan sambil mempertahankan nuansa medan tempur.
- source_word: וְאַלְמְנֹתָיו
  choice: dan janda-jandanya
  rationale: Bentuk jamak dengan sufiks orang ketiga tunggal diterjemahkan secara formal dengan -nya. Terjemahan ini tidak mengubahnya menjadi 'janda-janda mereka', sehingga bentuk sumber tetap terlihat.
- source_word: לֹא תִבְכֶּינָה
  choice: tidak menangis
  rationale: Ini merupakan padanan langsung bagi bentuk verbal yang dinegasikan. Konteks mungkin menyiratkan bahwa mereka tidak sempat atau tidak dapat meratap, tetapi kemungkinan itu dicatat dalam catatan kaki agar ambiguitas teks tetap terpelihara.
theological_decisions:
- issue: Makna tidak menangisnya para janda
  choice: Teks utama menyatakan secara langsung bahwa mereka tidak menangis.
  alternative: Mereka tidak dapat atau tidak sempat menangis karena kehancuran begitu besar sehingga perkabungan biasa tidak mungkin dilakukan.
  rationale: Bahasa Ibrani secara formal hanya menegasikan tindakan menangis dan tidak secara eksplisit memakai kata yang berarti 'dapat'. Terjemahan utama mempertahankan ketegangan itu, sedangkan implikasi kontekstual dijelaskan dalam catatan kaki tanpa dipastikan sebagai satu-satunya tafsiran.
translation_notes:
  register: Bahasa dibuat ringkas, puitis, dan bermartabat. 'Para imamnya', 'gugur oleh pedang', dan 'janda-jandanya' mempertahankan kesejajaran serta bentuk kepunyaan tunggal dalam teks Ibrani. Catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
