  - severity: low
    issue: “Arahkanlah telingamu” kurang idiomatis dibandingkan padanan yang lebih mapan.
    rationale: Kata kerja הַטּוּ secara harfiah menyatakan memiringkan atau mencondongkan. “Condongkanlah telingamu” menjaga citra dan paralelisme dengan lebih alami.
