translation:
  language: id
  text: 'Maskil[a] dari Asaf.


    Dengarkanlah pengajaranku, hai umatku; condongkanlah telingamu kepada perkataan mulutku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maskil” adalah istilah teknis dalam judul-judul mazmur; istilah ini mungkin menunjuk pada karya yang bersifat pengajaran atau perenungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל (maskil)
  choice: Maskil
  rationale: Istilah teknis pada judul mazmur ini dipertahankan dalam transliterasi karena arti dan fungsi tepatnya tidak pasti; kemungkinan menunjuk pada karya yang bersifat pengajaran atau perenungan.
- source_word: תּוֹרָתִי (torati)
  choice: pengajaran-Ku
  rationale: Dalam konteks sang pemazmur sedang berbicara kepada umat dan akan menyampaikan hikmat tradisional; makna umum 'pengajaran' lebih tepat daripada menjadikannya sebutan khusus bagi Taurat Musa.
- source_word: הַאֲזִינָה ... הַטּוּ אָזְנְכֶם
  choice: Dengarlah ... arahkanlah telingamu
  rationale: Dua ungkapan sejajar diterjemahkan secara alami sambil mempertahankan gambaran telinga pada perintah kedua.
- source_word: עַמִּי (ammi)
  choice: umat-Ku
  rationale: Dalam konteks mazmur, 'umat' lebih alami daripada 'bangsa' untuk sapaan kepada komunitas Israel; huruf kapital pada enklitik menandai pembicara yang mewakili suara ilahi tanpa menghapus perantaraan pemazmur.
theological_decisions:
- issue: Identitas penutur dalam ungkapan 'umat-Ku' dan 'pengajaran-Ku'
  choice: 'Mempertahankan bentuk orang pertama dengan kapitalisasi enklitik: ''umat-Ku, pengajaran-Ku'''
  alternative: 'Menggunakan huruf kecil: ''umatku, pengajaranku'', dengan Asaf sebagai penutur langsung'
  rationale: Mazmur menyajikan pengajaran yang berwibawa kepada Israel dan kemudian menggemakan ucapan ilahi. Kapitalisasi membantu pembaca menangkap dimensi suara ilahi, tetapi teks tetap tidak menambahkan nama penutur yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'hai umat-Ku' mempertahankan daya retoris teks, sedangkan pasangan 'Dengarlah ... arahkanlah telingamu' menjaga paralelisme Ibrani tanpa terdengar kaku.
