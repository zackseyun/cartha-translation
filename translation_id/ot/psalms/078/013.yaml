  text: בָּ֣קַע יָ֭ם וַ/יַּֽעֲבִירֵ֑/ם וַֽ/יַּצֶּב מַ֥יִם כְּמוֹ נֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/013.yaml
  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
translation:
  language: id
  text: Ia membelah laut dan membuat mereka menyeberang; Ia membuat air berdiri seperti timbunan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti gundukan”; kata Ibrani menggambarkan massa yang tertumpuk. Sebagian orang menerjemahkannya “seperti tembok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַע
  choice: membelah
  rationale: Kata kerja ini berarti membelah atau membuka dengan belahan. “Membelah” hidup dan wajar dalam bahasa Indonesia serta sesuai dengan gambaran penyeberangan laut.
- source_word: יָם
  choice: laut
  rationale: Nomina ini merujuk pada laut dalam kisah eksodus, tetapi ayat ini tidak menyebut nama laut tertentu; karena itu tidak diperjelas menjadi “Laut Merah”.
- source_word: וַיַּעֲבִירֵם
  choice: membuat mereka menyeberang
  rationale: 'Bentuk Hifil bersifat kausatif: Allah menyebabkan mereka melintas. Ungkapan ini mempertahankan daya kausatif sekaligus terdengar alami.'
- source_word: וַיַּצֶּב
  choice: membuat ... berdiri
  rationale: Kata kerja ini menyatakan tindakan menempatkan atau menyebabkan sesuatu berdiri tegak. Pilihan ini mempertahankan bentuk kausatif dan gambaran konkret teks.
- source_word: מַיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya secara morfologis plural, “air” adalah nomina massa yang paling alami dalam bahasa Indonesia.
- source_word: כְּמוֹ
  choice: seperti
  rationale: Padanan perbandingan yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: נֵד
  choice: timbunan
  rationale: Kata ini menunjuk pada massa yang tertumpuk atau menggunung. “Timbunan” mempertahankan citra air yang menumpuk tanpa menggantinya dengan tafsiran “tembok”.
theological_decisions:
- issue: Sifat gambaran mukjizat laut
  choice: Mempertahankan gambaran konkret bahwa air dibuat berdiri seperti timbunan, tanpa menjelaskan mekanismenya.
  alternative: Mengartikannya sebagai hiperbola puitis atau memparafrasakannya menjadi “menahan air.”
  rationale: Ayat ini menyajikan tindakan Allah melalui gambaran eksodus yang konkret. Terjemahan mempertahankan daya teologis dan kepuitisannya tanpa memutuskan perdebatan mengenai mekanisme atau jenis deskripsinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme kedua klausa dipertahankan. Kata ganti “Ia” mengacu kepada Allah dalam konteks mazmur. Penanda catatan kaki [a] dicantumkan tepat setelah frasa yang diterangkannya.
