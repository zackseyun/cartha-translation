  yaml_path: translation/ot/psalms/078/016.yaml
  text: He brought streams out of the rock and made water flow down like rivers[a].
translation:
  language: id
  text: Ia mengeluarkan aliran-aliran air dari batu cadas dan membuat air mengalir turun seperti sungai-sungai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia mengeluarkan air yang mengalir dari batu cadas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: Ia mengeluarkan
  rationale: 'Bentuk Hifil dari יצא menyatakan sebab: Allah menyebabkan sesuatu keluar. ''Mengeluarkan'' menyampaikan makna kausatif itu secara alami dalam bahasa Indonesia.'
- source_word: נוֹזְלִים
  choice: aliran-aliran air
  rationale: Partisip dari נזל menunjuk pada sesuatu yang mengalir. Dalam konteks mukjizat air dan penyebutan מָיִם pada baris berikutnya, 'aliran-aliran air' jelas dan wajar.
- source_word: מִסָּלַע
  choice: dari batu cadas
  rationale: סֶלַע berarti batu besar, batu cadas, atau tebing batu. 'Batu cadas' mempertahankan kesan batu yang kukuh dan cocok dengan konteks padang gurun.
- source_word: וַיּוֹרֶד
  choice: membuat ... mengalir turun
  rationale: Bentuk Hifil dari ירד bersifat kausatif, yakni menyebabkan air turun. Ungkapan ini mempertahankan unsur kausatif sekaligus gambaran gerakan air.
- source_word: כַּנְּהָרוֹת
  choice: seperti sungai-sungai
  rationale: Prefiks כ menyatakan perbandingan, sedangkan bentuk jamak נְהָרוֹת berarti sungai-sungai.
- source_word: מָיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, מַיִם lazim berfungsi sebagai nomina massa; 'air' merupakan padanan alami dalam bahasa Indonesia.
