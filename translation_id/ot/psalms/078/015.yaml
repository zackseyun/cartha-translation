  yaml_path: translation/ot/psalms/078/015.yaml
  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
translation:
  language: id
  text: Ia membelah batu-batu cadas di padang gurun dan memberi mereka minum dengan berlimpah, seperti dari air yang dalam dan luas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan memberi mereka minum seperti dari air yang sangat dalam dan luas.”'
    reason: Alternatif ini menghubungkan רַבָּה dengan gambaran תְהֹמוֹת, bukan dengan tindakan memberi minum, sambil mempertahankan sifat perbandingan dari כ.
lexical_decisions:
- source_word: יְבַקַּע
  choice: membelah
  rationale: Bentuk piel dari בקע menyatakan tindakan membelah atau membuka dengan kuat; “membelah” mempertahankan gambaran fisik yang hidup dan alami dalam bahasa Indonesia.
- source_word: צֻרִים
  choice: batu-batu cadas
  rationale: Bentuk jamak צוּר menunjuk pada batu besar atau massa batuan. “Batu-batu cadas” mempertahankan bentuk jamak dan menyampaikan kesan batuan keras dengan wajar.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר dapat berarti kawasan liar atau gurun; “padang gurun” merupakan ungkapan Indonesia yang jelas dan sesuai dengan latar perjalanan Israel.
- source_word: וַיַּשְׁקְ
  choice: dan memberi mereka minum
  rationale: Bentuk hifil dari שׁקה berarti memberi atau menyebabkan minum. Objek “mereka,” yakni umat dalam konteks mazmur, tersirat dalam bahasa Ibrani dan perlu dinyatakan agar alami dalam bahasa Indonesia.
- source_word: כִּתְהֹמוֹת
  choice: seakan-akan dari samudra raya
  rationale: Awalan כ menyatakan perbandingan, sedangkan תְהֹמוֹת menggambarkan kedalaman air yang dahsyat. “Samudra raya” mempertahankan citra puitis air dalam yang amat besar tanpa menjadikannya penjelasan kosmologis harfiah.
- source_word: רַבָּה
  choice: dengan berlimpah
  rationale: Kata ini dapat dipahami secara adverbial untuk menegaskan banyaknya air yang diberikan. Ungkapan ini alami dalam bahasa Indonesia, sementara kemungkinan bahwa kata tersebut menerangkan samudra dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Sifat gambaran air
  choice: Mempertahankan bahasa perbandingan melalui “seakan-akan dari samudra raya.”
  alternative: Menafsirkan frasa itu sebagai keterangan harfiah tentang sumber air bawah tanah atau hanya sebagai pernyataan umum mengenai air yang banyak.
  rationale: Teks Ibrani menghadirkan perbandingan puitis. Terjemahan tidak menentukan kosmologi tertentu dan tidak menghilangkan citra kedalaman air.
- issue: Hubungan רַבָּה dengan frasa sebelumnya
  choice: Memahaminya secara adverbial sebagai “dengan berlimpah.”
  alternative: Memahaminya sebagai penerang תְהֹמוֹת, yaitu “samudra yang dahsyat/besar.”
  rationale: Susunan Ibrani memungkinkan nuansa kelimpahan dalam tindakan memberi minum, tetapi hubungan sintaksisnya tidak sepenuhnya pasti; alternatif yang menerangkan samudra dicatat agar ambiguitas tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. “Batu-batu cadas,” “padang gurun,” dan “samudra raya” mempertahankan kekuatan gambaran Ibrani tanpa terdengar kuno; tanda catatan kaki [a] dicantumkan dalam teks utama.
