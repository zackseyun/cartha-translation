  text: The sons of Ephraim[a], armed with bows, turned back on the day of battle.
translation:
  language: id
  text: Bani Efraim[a], para pemanah yang membawa senjata, berbalik pada hari pertempuran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang-orang Efraim, yang bersenjata dan menembakkan busur, berbalik pada hari pertempuran.” Bahasa Ibrani memakai rangkaian partisipel yang padat dan dapat diungkapkan secara alami dengan lebih dari satu cara.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  choice: Bani Efraim
  rationale: Ungkapan ini secara harfiah berarti ‘anak-anak lelaki Efraim’, tetapi bersama nama suku menunjuk pada keturunan atau kaum Efraim. ‘Bani Efraim’ mempertahankan corak genealogis Ibrani dan tetap lazim dalam bahasa Indonesia Alkitabiah.
- source_word: נוֹשְׁקֵי
  choice: yang membawa senjata
  rationale: Partisipel dari נשׁק di sini menggambarkan orang-orang yang diperlengkapi atau dipersenjatai. ‘Membawa senjata’ menyampaikan kesiapan militer secara alami tanpa menentukan jenis perlengkapan lebih jauh.
- source_word: רוֹמֵי קָשֶׁת
  choice: para pemanah
  rationale: Secara harfiah ungkapan ini menggambarkan orang-orang yang menembakkan busur. ‘Para pemanah’ merupakan padanan idiomatis dan ringkas dalam bahasa Indonesia modern.
- source_word: הָפְכוּ
  choice: berbalik
  rationale: Kata kerja ini menyatakan perubahan arah atau berbalik kembali. Dalam konteks pertempuran, ‘berbalik’ mempertahankan gambaran teks dan menyiratkan mundur tanpa mempersempit maknanya menjadi istilah militer yang lebih khusus.
- source_word: בְּיוֹם קְרָב
  choice: pada hari pertempuran
  rationale: Padanan temporal yang langsung dan wajar, dengan tetap mempertahankan ungkapan ‘hari’ serta nada khidmat teks.
