  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: id
  text: Mereka membangkitkan murka-Nya dengan tempat-tempat pemujaan mereka di tempat tinggi[a] dan membuat-Nya cemburu dengan patung-patung pahatan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tempat-tempat pemujaan di tempat tinggi” merujuk pada tempat ibadah setempat, sering kali dikaitkan dengan ibadah terlarang dan penyembahan berhala.
    reason: cultural_note
  - marker: b
    text: 'Atau: “mereka membangkitkan kecemburuan-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: Mereka membangkitkan murka-Nya
  rationale: Bentuk Hifil dari כעס menyatakan tindakan menyebabkan atau membangkitkan murka; ungkapan ini mempertahankan daya kausatifnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: בְּבָמוֹתָם
  choice: dengan bukit-bukit pengurbanan mereka
  rationale: בָּמוֹת menunjuk pada tempat-tempat ibadah setempat yang ditinggikan dan dalam konteks ini terkait dengan ibadah terlarang. 'Bukit pengurbanan' lebih informatif bagi pembaca Indonesia daripada terjemahan harfiah 'tempat tinggi', sedangkan preposisi בְּ dipahami secara instrumental.
- source_word: וּבִפְסִילֵיהֶם
  choice: dan dengan patung-patung pahatan mereka
  rationale: פְּסִילִים adalah benda sembahan yang dipahat. 'Patung-patung pahatan' mempertahankan gambaran konkret tentang benda buatan tanpa mengaburkannya menjadi istilah umum saja.
- source_word: יַקְנִיאוּהוּ
  choice: mereka membuat-Nya cemburu
  rationale: Bentuk Hifil dari קנא berarti membuat cemburu atau membangkitkan kecemburuan. Terjemahan ini mempertahankan bahasa relasional-perjanjian dan ketegangan teologis dalam teks.
theological_decisions:
- issue: Bahasa tentang kecemburuan ilahi
  choice: mereka membuat-Nya cemburu
  alternative: mereka membangkitkan kecemburuan-Nya; mereka membangkitkan gairah-Nya
  rationale: Kata Ibrani קנא secara eksplisit menggambarkan tanggapan Allah terhadap penyembahan berhala dalam hubungan perjanjian. Istilah 'cemburu' dipertahankan dan tidak dilunakkan menjadi sekadar 'murka' atau diubah menjadi 'iri'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel Ibrani dipertahankan sejauh tetap alami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
