source:
  edition: WLC
  text: וַ/יַּנְחֵ֣/ם בֶּ/עָנָ֣ן יוֹמָ֑ם וְ/כָל הַ֝/לַּ֗יְלָה בְּ/א֣וֹר אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/014.yaml
  text: He led them with a cloud by day[a], and all the night with the light of fire.
translation:
  language: id
  text: Pada siang hari Ia menuntun mereka dengan awan, dan sepanjang malam dengan cahaya api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia membimbing mereka dengan awan pada siang hari, dan sepanjang malam dengan cahaya api.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Ia menuntun mereka
  rationale: Bentuk Hifil dari נחה dengan sufiks orang ketiga jamak berarti ‘menuntun’ atau ‘membimbing’. ‘Menuntun’ alami dalam bahasa Indonesia dan mempertahankan gambaran arah yang diberikan Allah.
- source_word: בֶּעָנָן
  choice: dengan awan
  rationale: 'Preposisi ב dalam konteks ini menyatakan sarana: Allah menuntun mereka dengan menggunakan awan. Pilihan ini mempertahankan citra Ibrani tanpa memperjelasnya secara berlebihan.'
- source_word: יוֹמָם
  choice: pada siang hari
  rationale: Kata ini berfungsi secara adverbial dengan arti ‘pada siang hari’; ungkapan tersebut jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְכָל הַלַּיְלָה
  choice: dan sepanjang malam
  rationale: Ungkapan ini secara harfiah berarti ‘dan seluruh malam’. ‘Sepanjang malam’ menyampaikan cakupan waktu yang penuh secara alami.
- source_word: בְּאוֹר אֵשׁ
  choice: dengan cahaya api
  rationale: Terjemahan ini mempertahankan kedua nomina dalam frasa Ibrani serta menyatakan bahwa api menyediakan penerangan pada malam hari.
theological_decisions:
- issue: Hakikat gambaran tuntunan di padang gurun
  choice: Ayat diterjemahkan sebagai kisah tentang Allah menuntun Israel dengan awan dan cahaya api, tanpa menambahkan penafsiran tipologis.
  alternative: Menafsirkan awan dan api secara tipologis di dalam teks utama.
  rationale: Teks Ibrani sendiri mengenang tuntunan dalam peristiwa Keluaran. Makna teologis yang lebih luas tidak boleh dimasukkan ke dalam terjemahan utama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan waktu ditempatkan di awal agar alurnya alami, sedangkan paralelisme siang–malam dan citra awan–api tetap terpelihara.
