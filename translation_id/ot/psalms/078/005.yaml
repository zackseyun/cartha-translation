  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֤קֶם עֵד֨וּת בְּֽ/יַעֲקֹ֗ב וְ/תוֹרָה֮ שָׂ֤ם בְּ/יִשְׂרָ֫אֵ֥ל אֲשֶׁ֣ר צִ֭וָּה אֶת אֲבוֹתֵ֑י/נוּ לְ֝/הוֹדִיעָ֗/ם לִ/בְנֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: id
  text: Ia menetapkan kesaksian di Yakub dan menaruh hukum[a] di Israel, yang diperintahkan-Nya kepada bapak-bapak kita[b] agar mereka memberitahukannya kepada anak-anak mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “pengajaran” (Ibrani: torah).'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapak-bapak kita”; frasa ini menunjuk kepada generasi terdahulu.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak lelaki mereka”; dalam konteks ini istilah tersebut kemungkinan menunjuk kepada anak-anak secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: menetapkan
  rationale: Bentuk Hifil dari קום menyatakan tindakan membuat sesuatu berdiri atau berlaku. “Menetapkan” wajar dalam bahasa Indonesia dan sesuai dengan konteks ketetapan perjanjian.
- source_word: עֵדוּת
  choice: kesaksian
  rationale: Kata ini dapat berarti kesaksian, peringatan, atau ketetapan perjanjian. “Kesaksian” mempertahankan arti dasarnya tanpa mempersempitnya menjadi sekadar peraturan hukum.
- source_word: בְּיַעֲקֹב
  choice: di tengah Yakub
  rationale: Preposisi ב menunjukkan lingkup keberadaan, sedangkan “Yakub” secara metonimis menunjuk kepada umat. “Di tengah” terdengar alami sekaligus mempertahankan nama puitis itu.
- source_word: וְתוֹרָה
  choice: dan ... hukum
  rationale: תּוֹרָה mencakup pengajaran yang berotoritas dan hukum. Dalam pasangan dengan עֵדוּת serta konteks perintah antargenerasi, “hukum” mempertahankan daya normatifnya; alternatif “pengajaran” dicatat.
- source_word: שָׂם
  choice: menaruh
  rationale: שׂים secara dasar berarti menaruh atau menempatkan. “Menaruh” mempertahankan perbedaan leksikal dengan וַיָּקֶם dan tetap dapat dipahami dalam ungkapan puitis ini.
- source_word: בְּיִשְׂרָאֵל
  choice: di tengah Israel
  rationale: Pilihan ini sejajar dengan “di tengah Yakub” dan memahami Israel sebagai nama kolektif bagi umat.
- source_word: אֲשֶׁר צִוָּה
  choice: Hal-hal itu diperintahkan-Nya
  rationale: Klausa relatif merujuk kepada kesaksian dan hukum yang baru disebut. Bentuk “hal-hal itu” juga menampung sufiks objek jamak pada לְהוֹדִיעָם tanpa memaksakan hanya satu anteseden.
- source_word: אֶת אֲבוֹתֵינוּ
  choice: kepada bapak-bapak leluhur kita
  rationale: אבות berbentuk maskulin dan secara harfiah berarti para bapak. Ungkapan ini mempertahankan unsur tersebut sambil menjelaskan bahwa yang dimaksud ialah generasi leluhur.
- source_word: לְהוֹדִיעָם
  choice: untuk mereka beritahukan
  rationale: Bentuk Hifil dari ידע berarti menyebabkan orang lain mengetahui, yakni memberitahukan. Sufiks jamaknya diterjemahkan melalui “hal-hal itu” pada awal kalimat.
- source_word: לִבְנֵיהֶם
  choice: kepada anak-anak mereka
  rationale: בנים secara bentuk berarti anak-anak lelaki, tetapi dalam konteks pewarisan antargenerasi dapat mencakup keturunan secara umum. “Anak-anak” menyampaikan cakupan kontekstual itu; bentuk harfiahnya dicatat.
theological_decisions:
- issue: Makna תּוֹרָה dalam konteks perjanjian
  choice: hukum
  alternative: pengajaran
  rationale: “Hukum” mempertahankan kewibawaan normatif dari apa yang Allah tetapkan dan perintahkan untuk diwariskan, sedangkan “pengajaran” tetap merupakan kemungkinan leksikal yang sah dan dicatat dalam catatan kaki.
- issue: Rujukan jamak pada לְהוֹדִיעָם
  choice: Hal-hal itu ... diberitahukan
  alternative: hukum itu ... diberitahukan
  rationale: Sufiks objeknya berbentuk jamak dan paling wajar mencakup “kesaksian” serta “hukum”. Terjemahan tidak membatasi rujukannya hanya kepada salah satu unsur.
- issue: Bahasa kekerabatan pada אֲבוֹתֵינוּ dan לִבְנֵיהֶם
  choice: bapak-bapak leluhur kita ... anak-anak mereka
  alternative: nenek moyang kita ... anak-anak lelaki mereka
  rationale: Sebutan pertama mempertahankan bentuk maskulin yang eksplisit, sedangkan בנים pada bagian kedua berfungsi secara wajar sebagai sebutan bagi anak atau keturunan dalam pewarisan antargenerasi.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada puitis dan bermartabat. “Di tengah Yakub ... di tengah Israel” mempertahankan paralelisme dan nama kolektif Ibrani. Kalimat kedua dipisahkan agar hubungan objek jamak lebih jelas tanpa menghilangkan hubungan erat dengan kesaksian dan hukum pada kalimat pertama.
