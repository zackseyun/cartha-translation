  text: He gave his strength to captivity[c][b][a], and his splendor into the hand of the foe.
translation:
  language: id
  text: Ia menyerahkan kekuatan-Nya untuk ditawan[a], dan kemegahan-Nya[b] ke tangan lawan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat diterjemahkan, “Ia memberikan kekuatan-Nya kepada penawanan.” ‘Kekuatan-Nya’ mungkin menyinggung tabut sebagai tanda kekuatan Allah di tengah Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “kemuliaan-Nya” atau “keindahan-Nya.”
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, ke dalam kuasa musuh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia menyerahkan
  rationale: Bentuk naratif dari נתן secara harfiah berarti ‘memberikan’, tetapi dalam konteks sesuatu jatuh ke tangan musuh, ‘menyerahkan’ menyampaikan maknanya secara alami tanpa menambahkan pelaku lain.
- source_word: לַשְּׁבִי
  choice: untuk ditawan
  rationale: שְׁבִי menunjuk pada penawanan atau keadaan sebagai tawanan. Ungkapan ‘untuk ditawan’ merupakan bahasa Indonesia alami yang mempertahankan arah tindakan dalam frasa Ibrani.
- source_word: עֻזּוֹ
  choice: kekuatan-Nya
  rationale: עֹז berarti kekuatan atau keperkasaan. Terjemahan ini mempertahankan ungkapan puitis dan tidak secara eksplisit menyamakannya dengan tabut.
- source_word: וְתִפְאַרְתּוֹ
  choice: dan kemegahan-Nya
  rationale: תִּפְאֶרֶת dapat berarti kemegahan, kemuliaan, atau keindahan. ‘Kemegahan’ jelas, puitis, dan berpasangan baik dengan ‘kekuatan’.
- source_word: בְיַד
  choice: ke tangan
  rationale: Ungkapan Ibrani ini menggambarkan penyerahan ke dalam kuasa seseorang. Mempertahankan citra ‘tangan’ tetap wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: צָר
  choice: lawan
  rationale: צַר berarti musuh, lawan, atau penindas. ‘Lawan’ ringkas dan sesuai dengan larik puitis.
theological_decisions:
- issue: Apakah ‘kekuatan-Nya’ dan ‘kemegahan-Nya’ harus secara eksplisit diidentifikasi sebagai tabut, tempat kudus, atau kehadiran Allah yang dinyatakan
  choice: Mempertahankan ungkapan puitis ‘kekuatan-Nya’ dan ‘kemegahan-Nya’ tanpa mengidentifikasi rujukannya dalam teks utama
  alternative: Menafsirkan ‘kekuatan-Nya’ sebagai tabut, atau kedua ungkapan sebagai tempat kudus maupun kehadiran kemuliaan Allah
  rationale: Konteks kemungkinan besar menyinggung jatuhnya tabut ke tangan musuh, tetapi teks Ibrani tidak menyebut tabut secara langsung. Terjemahan utama karena itu mempertahankan ketegangan dan ketidaklangsungan puitis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. Kapital pada enklitik ‘-Nya’ menandai bahwa kata ganti merujuk kepada Allah. Struktur paralel Ibrani dipertahankan, sementara ‘untuk ditawan’ dipilih agar lebih alami daripada ‘kepada penawanan’.
