source:
  edition: WLC
  text: לֶ֣חֶם אַ֭בִּירִים אָ֣כַל אִ֑ישׁ צֵידָ֬ה שָׁלַ֖ח לָ/הֶ֣ם לָ/שֹֽׂבַע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/025.yaml
  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: id
  text: Manusia makan roti para perkasa[a]; Ia mengirimkan kepada mereka perbekalan hingga mereka kenyang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “roti para malaikat.” Secara lebih harfiah, bahasa Ibrani berbunyi “roti para perkasa” atau “roti orang-orang perkasa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  choice: roti
  rationale: Makna dasarnya adalah 'roti'; pilihan ini mempertahankan gambaran konkret dan puitis Ibrani.
- source_word: אַבִּירִים
  choice: para perkasa
  rationale: Kata ini secara lebih langsung menunjuk kepada orang-orang atau makhluk-makhluk yang kuat/perkasa. Bentuk 'para perkasa' mempertahankan ketidakjelasan identitas mereka tanpa langsung menafsirkannya sebagai malaikat.
- source_word: אָכַל
  choice: makan
  rationale: Bentuk perfek dalam rangkaian puisi naratif ini wajar diterjemahkan dengan bentuk lampau yang dalam bahasa Indonesia tidak perlu ditandai secara morfologis.
- source_word: אִישׁ
  choice: manusia
  rationale: Nomina tunggal ini bersifat representatif atau generik. 'Manusia' alami dalam bahasa Indonesia dan mempertahankan kontras puitis antara manusia dan 'para perkasa'.
- source_word: צֵידָה
  choice: perbekalan
  rationale: Kata ini berarti persediaan makanan atau bekal yang disediakan untuk suatu kebutuhan; 'perbekalan' membedakannya dari 'roti' pada klausa pertama.
- source_word: שָׁלַח
  choice: mengirimkan
  rationale: Pilihan ini secara langsung mencerminkan makna verba Ibrani 'mengirim', tanpa menggantinya dengan tafsiran seperti 'memberikan'.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Frasa ini menyatakan penerima perbekalan secara eksplisit dan alami dalam bahasa Indonesia.
- source_word: לָשֹׂבַע
  choice: sampai kenyang
  rationale: Ungkapan ini menyampaikan keadaan puas karena memperoleh makanan yang cukup atau berlimpah, dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Identitas אַבִּירִים dalam ungkapan 'roti para perkasa'
  choice: Menerjemahkannya secara leksikal sebagai 'para perkasa' dalam teks utama
  alternative: roti para malaikat
  rationale: Dalam konteks manna, tradisi kuno memahami istilah ini sebagai malaikat, tetapi kata Ibraninya sendiri lebih langsung berarti 'yang kuat/perkasa'. Teks utama mempertahankan ketegangan penafsiran, sedangkan tafsiran tradisional dicatat dalam catatan kaki.
- issue: Subjek tersirat pada שָׁלַח
  choice: Menggunakan 'Dia' untuk menunjuk kepada Allah sesuai konteks mazmur
  alternative: Ia
  rationale: Bahasa Ibrani hanya menandai subjek maskulin tunggal pada verba. Konteks ayat-ayat sebelumnya menunjukkan bahwa Allah adalah pelakunya; kapitalisasi membantu menjaga rujukan tersebut tanpa menambah gelar ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan dua klausa dipertahankan secara ringkas. 'Para perkasa' sengaja dipilih daripada 'malaikat' agar makna leksikal dan ambiguitas teks Ibrani tetap terjaga.
