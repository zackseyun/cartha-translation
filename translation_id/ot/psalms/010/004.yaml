  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: id
  text: 'Dalam keangkuhan sikapnya,[a]

    orang fasik tidak mencari;

    segenap pikirannya:

    “Tidak ada Allah.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam ketinggian hidungnya”; “hidung” juga dapat menunjuk pada wajah. Ini adalah ungkapan untuk keangkuhan atau sikap congkak.
    reason: cultural_note
  - marker: b
    text: Atau, “Dalam seluruh pikirannya tidak ada Allah.” Bahasa Ibrani juga dapat dipahami sebagai pernyataan bahwa Allah sama sekali tidak hadir dalam pemikirannya, bukan sebagai kutipan langsung dari isi pikirannya.
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva maskulin tunggal yang dipakai sebagai nomina. Pilihan ini mempertahankan gambaran seorang individu yang sekaligus mewakili golongan orang fasik.
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: Dalam keangkuhan yang terpancar dari wajahnya
  rationale: גֹבַהּ berarti ketinggian atau keangkuhan, sedangkan אַף secara harfiah berarti hidung dan dapat menunjuk pada wajah atau amarah. Dalam konteks ini ungkapan tersebut paling wajar menggambarkan raut atau sikap yang congkak; terjemahan ini mempertahankan gambaran wajah dalam bahasa Indonesia yang alami.
- source_word: בַּל יִדְרֹשׁ
  choice: tidak mencari Allah
  rationale: בַּל adalah partikel negatif puitis, dan יִדְרֹשׁ berarti mencari atau menyelidiki. Objeknya tidak dinyatakan secara eksplisit, tetapi Allah jelas tersirat dari klausa berikutnya; penyebutan 'Allah' membuat hubungan itu alami dalam bahasa Indonesia tanpa mengubah maksud konteks.
- source_word: אֵין אֱלֹהִים
  choice: Tidak ada Allah
  rationale: Ungkapan ini memakai negasi eksistensial dan paling langsung diterjemahkan sebagai penyangkalan 'Tidak ada Allah', yang di sini menyatakan isi pemikiran orang fasik.
- source_word: כָּל מְזִמּוֹתָיו
  choice: seluruh pikirannya berkata
  rationale: מְזִמּוֹת dapat berarti pikiran, rancangan, atau siasat. Dalam konteks ini kata tersebut menunjuk pada keseluruhan pola pikirnya. Kata 'berkata' menyajikan klausa berikut sebagai isi pikirannya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan sintaksis klausa penutup
  choice: Klausa 'Tidak ada Allah' dipahami sebagai isi seluruh pemikiran orang fasik.
  alternative: Allah tidak ada dalam segala pikirannya.
  rationale: Urutan kata Ibrani memungkinkan klausa itu dipahami sebagai isi pikirannya atau sebagai pernyataan bahwa Allah sama sekali tidak hadir dalam pikirannya. Teks utama mengikuti pembacaan yang lebih langsung sebagai isi pikiran, sedangkan pembacaan lain yang sudah lama dikenal dan tetap masuk akal dipertahankan dalam catatan kaki.
- issue: Objek tersirat dari יִדְרֹשׁ
  choice: Allah disebut sebagai objek dari 'mencari'.
  alternative: 'Membiarkan verba itu tanpa objek: ''tidak mencari''.'
  rationale: Teks Ibrani tidak menyebut objek secara eksplisit, tetapi klausa sesudahnya menjadikan Allah sebagai objek yang tersirat. Bahasa Indonesia membutuhkan objek ini agar kalimat terdengar lengkap dan jelas; pilihan ini tidak dimaksudkan untuk mempersempit makna mencari atau menyelidiki Allah.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan puitis dipertahankan dalam empat baris. 'Orang fasik' merupakan istilah Alkitabiah yang masih jelas dan sesuai bagi רָשָׁע; gambaran konkret tentang wajah dipertahankan sambil diungkapkan secara alami.
