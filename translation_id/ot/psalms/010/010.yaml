  text: ו/דכה יָשֹׁ֑חַ וְ/נָפַ֥ל בַּ֝/עֲצוּמָ֗י/ו חלכאים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/010.yaml
  text: He crouches[a]; he bows down[c][b], and the helpless fall by his might.
translation:
  language: id
  text: Ia merunduk dan membungkuk; orang-orang tak berdaya pun jatuh oleh kekuatannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani ayat ini sulit. Bagian terakhir juga dapat diterjemahkan, “oleh orang-orang kuatnya,” atau dipahami secara kiasan, “ke dalam cakarnya yang kuat.” Ada pula yang memahami kata kerjanya sebagai “ia jatuh,” bukan “orang-orang tak berdaya jatuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/דכה
  choice: Ia merunduk
  rationale: Bentuk Ibraninya sulit, tetapi dalam konteks gambaran perburuan, kata ini paling masuk akal menggambarkan sikap rendah si fasik ketika mengintai mangsa, bukan keadaan dirinya diremukkan.
- source_word: יָשֹׁחַ
  choice: dan membungkuk
  rationale: Kata kerja ini menyatakan gerakan merendahkan atau membungkukkan tubuh. Pilihan ini mempertahankan kesejajaran fisik dengan kata sebelumnya tanpa menambahkan tafsiran.
- source_word: וְ/נָפַ֥ל ... חלכאים
  choice: orang-orang tak berdaya pun jatuh
  rationale: Walaupun bentuk kata kerja 'jatuh' secara morfologis tunggal maskulin, susunan ayat ini sangat padat dan sulit. Memahami 'orang-orang tak berdaya' sebagai subjek memberikan makna yang paling selaras dengan konteks si fasik yang memangsa kaum rentan.
- source_word: בַּ֝/עֲצוּמָ֗י/ו
  choice: oleh kekuatannya
  rationale: Bentuk jamak bersufiks ini secara harfiah dapat menunjuk kepada 'orang-orang kuatnya', tetapi dalam konteks dapat dipahami sebagai jamak abstrak yang menyatakan daya atau kekuatan si fasik. Terjemahan ini alami dalam bahasa Indonesia, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: חלכאים
  choice: orang-orang tak berdaya
  rationale: Istilah ini menunjuk kepada orang yang lemah, malang, atau rentan. 'Orang-orang tak berdaya' menyampaikan kerentanan mereka dengan jelas dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua kata kerja gerak dipertahankan untuk mencerminkan gambaran si fasik yang merendahkan tubuh saat mengintai mangsa; ungkapan sulit pada akhir ayat diterjemahkan secara jelas dalam teks dan ambiguitas sumber dipertahankan melalui catatan kaki.
