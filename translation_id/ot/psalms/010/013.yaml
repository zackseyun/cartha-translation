  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: id
  text: Mengapa orang fasik menghina Allah? Dalam hatinya ia berkata, “Engkau tidak akan menuntut pertanggungjawaban.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל מֶה
  choice: Mengapa
  rationale: Ungkapan tanya ini secara idiomatis menanyakan alasan atau sebab.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Nomina tunggal ini menunjuk kepada seseorang yang bersalah secara moral; 'orang fasik' alami dan tepat dalam register Alkitab Indonesia.
- source_word: נִאֵץ
  choice: menghina
  rationale: Kata kerja ini menyatakan sikap meremehkan atau memperlakukan dengan penghinaan terhadap Allah.
- source_word: אָמַר בְּלִבּוֹ
  choice: Dalam hatinya ia berkata
  rationale: Mempertahankan gambaran Ibrani tentang ucapan batin, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: לֹא תִּדְרֹשׁ
  choice: Engkau tidak akan meminta pertanggungjawaban
  rationale: דרשׁ di sini berarti mencari, menuntut, atau mengusut sebagai tindakan penghakiman; terjemahan ini menyampaikan bahwa orang fasik menganggap Allah tidak akan menuntut jawaban atas perbuatannya.
theological_decisions:
- issue: Subjek tersirat dalam לֹא תִּדְרֹשׁ
  choice: Engkau
  alternative: Ia / Allah
  rationale: 'Bentuk verba orang kedua tunggal mendukung ucapan batin yang ditujukan kepada Allah: ''Engkau tidak akan ...'', bukan pernyataan orang ketiga.'
- issue: Cakupan makna דרשׁ
  choice: meminta pertanggungjawaban
  alternative: mengusut / menuntut
  rationale: Dalam konteks keluhan tentang kejahatan yang tidak dihukum, frasa ini menyatakan tindakan Allah menuntut pertanggungjawaban, tanpa menentukan secara berlebihan bentuk hukumannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan serta ucapan batin dipertahankan dengan jelas; tidak diperlukan catatan kaki.
