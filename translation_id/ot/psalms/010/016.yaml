id: PSA.10.16
reference: Psalms 10:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֣ה מֶ֭לֶךְ עוֹלָ֣ם וָ/עֶ֑ד אָבְד֥וּ ג֝וֹיִ֗ם מֵֽ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: id
  text: 'Yahweh adalah Raja untuk selama-lamanya;

    bangsa-bangsa telah lenyap dari negeri-Nya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bumi-Nya.” Kata Ibrani yang dipakai dapat berarti “negeri” atau “bumi”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: מֶלֶךְ
  choice: adalah Raja
  rationale: Nomina predikatif Ibrani dipertahankan secara alami dalam bahasa Indonesia; “Raja” lebih dekat pada bentuk sumber daripada parafrasa verbal “memerintah”.
- source_word: עוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia ini menyampaikan penegasan durasi tanpa akhir yang terdapat dalam pasangan kata Ibrani tersebut.
- source_word: אָבְדוּ
  choice: telah lenyap
  rationale: Bentuk perfektif menyatakan kenyataan yang dipandang sudah tuntas. “Telah lenyap” juga berpadu alami dengan frasa “dari negeri-Nya” tanpa menambahkan pelaku penghancuran yang tidak dinyatakan.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks ini kata tersebut menunjuk pada bangsa-bangsa asing, bukan pada kategori teologis khusus; “bangsa-bangsa” merupakan padanan yang luas dan wajar.
- source_word: מֵאַרְצוֹ
  choice: dari negeri-Nya
  rationale: “Negeri-Nya” menyampaikan makna teritorial yang paling langsung dalam konteks ini. Karena אֶרֶץ juga dapat berarti “bumi”, kemungkinan yang lebih universal dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan makna אַרְצוֹ
  choice: negeri-Nya
  alternative: bumi-Nya
  rationale: Konteks mazmur mendukung pengertian teritorial yang konkret, tetapi kata Ibrani juga dapat menunjuk pada seluruh bumi. Catatan kaki mempertahankan ambiguitas itu tanpa menetapkan salah satu cakupan teologis secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dua baris mempertahankan kesejajaran puitis. Huruf kapital pada “Raja” dan pronomina “-Nya” menandai rujukan kepada Allah sesuai kebiasaan penulisan religius Indonesia.
