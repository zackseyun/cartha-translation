  text: He sits in ambush in the villages[a]; in the hiding places he murders the innocent[b]; his eyes watch for the helpless.
translation:
  language: id
  text: Ia duduk mengadang di desa-desa[a]; di tempat-tempat tersembunyi ia membunuh orang yang tak bersalah; matanya mengintai orang yang tak berdaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Desa-desa” juga dapat diterjemahkan “permukiman-permukiman” atau, meski kemungkinannya lebih kecil di sini, “pelataran-pelataran” atau “tempat-tempat berpagar.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, verba Ibraninya berkaitan dengan menyembunyikan atau mengendap. Bersama kata “matanya”, maksudnya tampaknya ialah mengawasi calon korban secara diam-diam. Istilah yang diterjemahkan “orang yang tak berdaya” juga dapat berarti orang yang lemah atau malang.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Ia duduk
  rationale: Mempertahankan gambaran konkret verba 'duduk/tinggal'; frasa berikutnya menyatakan sikap mengadang.
- source_word: בְּמַאְרַב
  choice: mengadang
  rationale: Menyampaikan tindakan menunggu secara tersembunyi untuk menyerang dengan bahasa Indonesia yang alami.
- source_word: חֲצֵרִים
  choice: di desa-desa
  rationale: Dalam konteks ini bentuk jamak tersebut paling wajar menunjuk pada desa atau permukiman; preposisi Ibrani dipertahankan sebagai 'di', bukan diperluas menjadi 'dekat'.
- source_word: בַּמִּסְתָּרִים
  choice: dari tempat-tempat tersembunyi
  rationale: Menjaga gambaran lokasi-lokasi persembunyian sekaligus menghasilkan hubungan alami dengan tindakan membunuh dalam bahasa Indonesia.
- source_word: יַהֲרֹג
  choice: ia membunuh
  rationale: Konteks serangan terhadap orang tak bersalah mendukung 'membunuh', yang menyatakan kekerasan melawan korban tanpa menambahkan rincian cara.
- source_word: נָקִי
  choice: orang yang tak bersalah
  rationale: Mengungkapkan arti orang yang bebas dari kesalahan secara jelas dan alami.
- source_word: עֵינָיו
  choice: matanya
  rationale: Mempertahankan citraan konkret dan fokus puitis teks Ibrani.
- source_word: לְחֵלְכָה
  choice: orang yang tak berdaya
  rationale: Istilah ini sulit dan menunjuk pada korban yang lemah atau malang dalam konteks mazmur; terjemahan ini menonjolkan kerentanannya tanpa mempersempitnya menjadi kategori ekonomi.
- source_word: יִצְפֹּנוּ
  choice: mengintai
  rationale: Secara leksikal berkaitan dengan menyembunyikan atau bersembunyi, tetapi bersama 'matanya' ungkapan itu menggambarkan pengamatan diam-diam terhadap calon korban; 'mengintai' mempertahankan nuansa tersembunyi dan mengancam.
