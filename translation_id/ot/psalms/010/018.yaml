  text: to give justice to the fatherless and the oppressed[c][b][a], so that man from the earth may terrify no more.
translation:
  language: id
  text: untuk membela hak anak yatim[a] dan orang yang tertindas[b], supaya manusia yang berasal dari bumi[c] tidak lagi menebar ketakutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “anak yang kehilangan ayah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang yang remuk” atau “orang yang menderita.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “manusia dari bumi”; atau mungkin, “manusia dari negeri itu.” Ungkapan ini dapat menekankan bahwa ia hanyalah manusia fana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: untuk membela hak
  rationale: Infinitif ini menyatakan tujuan atau hasil dari tindakan Allah dalam konteks sebelumnya. Frasa ini mempertahankan nuansa hukum שׁפט sekaligus menyatakan tindakan demi pihak yang rentan secara alami dalam bahasa Indonesia.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Dalam bahasa Indonesia modern, 'anak yatim' merupakan sebutan lazim bagi anak yang kehilangan ayah dan sesuai dengan kategori sosial rentan yang dimaksudkan teks Ibrani.
- source_word: דָךְ
  choice: orang yang tertindas
  rationale: Kata ini menunjuk kepada orang yang diremukkan, direndahkan, atau menderita tekanan. 'Orang yang tertindas' menyampaikan keadaan itu dengan jelas tanpa mengaburkankan bahwa istilahnya berbeda dari verba 'menebar ketakutan' pada klausa berikut.
- source_word: בַּל יוֹסִיף עוֹד
  choice: supaya ... tidak lagi
  rationale: Gabungan negasi בַּל, יסף, dan עוֹד menyatakan tujuan atau hasil bahwa tindakan tersebut tidak berlanjut atau terulang lagi.
- source_word: לַעֲרֹץ
  choice: menebar ketakutan
  rationale: Verba ערץ mengandung gagasan menimbulkan rasa gentar atau takut. 'Menebar ketakutan' alami dalam bahasa Indonesia dan mempertahankan daya kausatif ungkapan Ibrani.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: אֱנוֹשׁ adalah nomina tunggal kolektif atau generik yang kerap menonjolkan kefanaan manusia. 'Manusia' mempertahankan cakupan generiknya tanpa memasukkan jenis kelamin yang tidak menjadi pokok ayat.
- source_word: מִן הָאָרֶץ
  choice: yang berasal dari bumi
  rationale: Terjemahan ini mempertahankan preposisi מן dan citra manusia yang berasal dari bumi, sekaligus terdengar wajar dalam bahasa Indonesia. Kemungkinan makna 'negeri' dicatat karena אֶרֶץ dapat berarti bumi atau negeri.
theological_decisions:
- issue: Makna ungkapan אֱנוֹשׁ מִן־הָאָרֶץ
  choice: manusia yang berasal dari bumi
  alternative: manusia dari negeri itu
  rationale: Pilihan utama mempertahankan arti harfiah dan kemungkinan penekanan pada manusia fana yang berasal dari bumi, tanpa memaksakan penafsiran teologis tertentu. Karena אֶרֶץ juga dapat berarti 'negeri', alternatif geografis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Membela hak' dipilih untuk nuansa yudisial yang alami; 'menebar ketakutan' mempertahankan perbedaan leksikal dari 'tertindas'. Semua penanda catatan kaki ditempatkan tepat sesudah unsur yang diterangkan.
