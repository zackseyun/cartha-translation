source:
  edition: WLC
  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
translation:
  language: id
  text: Ya Yahweh, Engkau telah mendengar keinginan orang-orang yang rendah hati[a]; Engkau akan mempersiapkan hati mereka[b]; Engkau akan menyimak dengan telinga-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang tertindas” atau “orang-orang yang lemah lembut.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menetapkan” atau “meneguhkan” hati mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: kerinduan
  rationale: Nomina ini berarti keinginan atau kerinduan. Dalam konteks doa, “kerinduan” menyampaikan hasrat batin secara alami tanpa mempersempitnya menjadi permintaan tertentu.
- source_word: עֲנָוִים
  choice: orang-orang yang rendah hati
  rationale: Istilah ini dapat menunjuk kepada mereka yang rendah hati, lemah lembut, atau tertindas. Pilihan ini mempertahankan makna kerendahan sambil membiarkan konteks mazmur mengaitkannya dengan penderitaan dan penindasan.
- source_word: שָׁמַעְתָּ
  choice: Engkau telah mendengar
  rationale: Bentuk perfektif menyatakan tindakan yang sudah terjadi dan tetap relevan dalam doa pemazmur.
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”; partikel “Ya” menandai sapaan langsung secara wajar dalam bahasa Indonesia.
- source_word: תָּכִין
  choice: Engkau akan meneguhkan
  rationale: Bentuk hifil dari כון dapat berarti mempersiapkan, menetapkan, atau membuat teguh. Dengan “hati” sebagai objek, “meneguhkan” mempertahankan gagasan membuat hati mantap tanpa menutup alternatif leksikal.
- source_word: לִבָּם
  choice: hati mereka
  rationale: Gambaran antropologis Ibrani dipertahankan dan tetap alami serta mudah dipahami dalam bahasa Indonesia.
- source_word: תַּקְשִׁיב
  choice: akan memperhatikan
  rationale: Kata kerja ini menyatakan mendengarkan dengan saksama atau memberi perhatian. “Memperhatikan” cocok dengan subjek konkret “telinga-Mu” dan menonjolkan perhatian aktif.
- source_word: אָזְנֶךָ
  choice: telinga-Mu
  rationale: Citra konkret dan antropomorfis dalam puisi Ibrani dipertahankan, bukan diratakan menjadi sekadar “Engkau”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Ya Yahweh
  alternative: Ya TUHAN
  rationale: Teks memakai nama diri ilahi. Transliterasi “Yahweh” mempertahankan nama tersebut, sedangkan “Ya” menyatakan vokatif.
- issue: Makna עֲנָוִים dalam konteks
  choice: orang-orang yang rendah hati
  alternative: orang-orang yang tertindas / orang-orang yang lemah lembut
  rationale: Konteks mazmur menyoroti orang tertindas, tetapi kata itu juga membawa nuansa kerendahan dan kelemahlembutan. Teks utama mempertahankan nuansa leksikal itu, sementara catatan mencatat kemungkinan lain.
- issue: Makna תָּכִין dengan objek “hati”
  choice: meneguhkan hati mereka
  alternative: mempersiapkan hati mereka / menetapkan hati mereka
  rationale: “Meneguhkan” menyampaikan tindakan membuat hati teguh atau mantap. Catatan mempertahankan keluasan semantis kata sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Paralelisme dan gambaran konkret “telinga-Mu” dipertahankan.
