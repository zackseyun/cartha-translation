  text: אָמַ֣ר בְּ֭/לִבּ/וֹ שָׁ֣כַֽח אֵ֑ל הִסְתִּ֥יר פָּ֝נָ֗י/ו בַּל רָאָ֥ה לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/011.yaml
  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: id
  text: Ia berkata dalam hatinya,[a] “Allah sudah lupa; Ia telah menyembunyikan wajah-Nya; Ia tidak akan pernah melihat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia berkata dalam hatinya … Allah lupa … Ia menyembunyikan wajah-Nya … Ia tidak akan melihat untuk selamanya.” Dalam puisi Ibrani, bentuk perfektif kata kerja ini dapat dipahami dengan nuansa kini atau lampau/perfektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Ia berkata
  rationale: Bentuk perfektif Qal orang ketiga tunggal maskulin dalam puisi dapat menggambarkan perkataan batin yang sedang atau berulang terjadi. Bentuk kini dalam bahasa Indonesia cocok dengan gambaran berkelanjutan tentang orang fasik.
- source_word: בְּלִבּוֹ
  choice: dalam hatinya
  rationale: Ungkapan harfiah ini alami dalam bahasa Indonesia dan mempertahankan gambaran tentang pikiran batin.
- source_word: שָׁכַח
  choice: sudah lupa
  rationale: Kata kerjanya berarti ‘lupa’. ‘Sudah lupa’ menyatakan anggapan bahwa Allah telah melupakan perkara itu sehingga tidak akan bertindak.
- source_word: אֵל
  choice: Allah
  rationale: Nomina tunggal ini menunjuk kepada Allah; ‘Allah’ merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: הִסְתִּיר פָּנָיו
  choice: Ia telah menyembunyikan wajah-Nya
  rationale: Gambaran konkret Ibrani dipertahankan dan menyiratkan bahwa Allah tidak lagi memperhatikan, tanpa mereduksinya menjadi satu tafsiran.
- source_word: בַּל ... לָנֶצַח
  choice: tidak akan pernah
  rationale: 'Gabungan partikel negasi dan keterangan durasi menyatakan negasi yang terus berlaku: ‘tidak pernah’.'
- source_word: רָאָה
  choice: melihatnya
  rationale: Makna dasar ‘melihat’ dipertahankan. Akhiran ‘-nya’ menjadikan objek yang tersirat wajar dalam bahasa Indonesia, yakni kejahatan atau penderitaan yang sedang dibicarakan.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah yang menyembunyikan wajah-Nya
  choice: Mempertahankan ungkapan ‘Ia telah menyembunyikan wajah-Nya’
  alternative: Ia telah berpaling; Ia tidak lagi memperhatikan
  rationale: Teks Ibrani memakai gambaran konkret. Mempertahankannya menjaga kekayaan teologis teks dan tidak membatasi maknanya pada satu penjelasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ‘Ia’ dan enklitik ‘-Nya’ dikapitalisasi sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Idiom Ibrani dipertahankan sejauh tetap alami dan dapat dipahami.
