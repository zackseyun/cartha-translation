id: PSA.10.12
reference: Psalms 10:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: id
  text: Bangkitlah, ya Yahweh! Ya Allah, angkatlah tangan-Mu! Jangan lupakan orang-orang yang tertindas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang-orang miskin,” “orang-orang yang rendah hati,” atau “orang-orang yang direndahkan.” Kata Ibrani ini dapat merujuk secara luas kepada mereka yang dibuat tidak berdaya dan rentan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Bangkitlah
  rationale: Bentuk imperatif dari קום yang ditujukan kepada Allah. “Bangkitlah” menyampaikan seruan mendesak dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: אֵל
  choice: Ya Allah
  rationale: Kata ini merupakan sapaan langsung yang sejajar dengan יְהוָה. Partikel “ya” menandai bentuk vokatif secara alami dalam bahasa Indonesia.
- source_word: נְשָׂא יָדֶךָ
  choice: angkatlah tangan-Mu
  rationale: Gambaran konkret Ibrani dipertahankan tanpa langsung menafsirkannya sebagai tindakan penghukuman atau penyelamatan.
- source_word: אַל תִּשְׁכַּח
  choice: Jangan lupakan
  rationale: Menerjemahkan larangan secara langsung dan mempertahankan metafora “melupakan”, alih-alih menafsirkannya sebagai “mengabaikan”.
- source_word: עניים
  choice: orang-orang yang tertindas
  rationale: Dalam konteks Mazmur 10, istilah ini menunjuk pada orang-orang lemah yang menjadi sasaran kejahatan dan penindasan. Pilihan ini sesuai dengan konteks, sementara keluasan maknanya dijaga dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Makna tindakan mengangkat tangan Allah
  choice: Gambaran antropomorfis dipertahankan secara harfiah
  alternative: Bertindaklah untuk menghukum atau menyelamatkan
  rationale: Teks tidak menyatakan secara eksplisit tindakan tertentu yang dilambangkan oleh tangan yang diangkat. Terjemahan mempertahankan daya puitis dan keterbukaan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan mudah dipahami. Tanda seru mencerminkan urgensi rangkaian seruan. Bentuk sapaan “ya” dipakai untuk menandai vokatif, sedangkan kapitalisasi pada “tangan-Mu” mengikuti konvensi bahasa Indonesia untuk pronomina yang mengacu kepada Allah.
