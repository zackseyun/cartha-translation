  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: id
  text: Jalan-jalannya selalu berhasil[a]; putusan-putusan-Mu tinggi, di luar pandangannya. Terhadap semua lawannya, ia mendengus terhadap mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jalan-jalannya selalu kukuh.” Kata kerja Ibraninya sulit dipastikan dan juga pernah dipahami dalam arti yang berkaitan dengan menggeliat atau bersusah payah, tetapi konteks lebih mendukung gagasan tentang keberhasilan atau rasa aman yang terus berlangsung.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia mengembuskan napas terhadap mereka,” sebuah gambaran hidup tentang sikap menghina atau meremehkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: selalu berhasil
  rationale: Bentuk dari חול di sini sulit ditafsirkan. Dalam konteks keluhan tentang kemakmuran dan kesombongan orang fasik, makna keberhasilan yang terus berlangsung paling sesuai, sementara kemungkinan ‘tetap kukuh’ dicatat dalam catatan kaki.
- source_word: דרכ/ו (דְּרָכָיו)
  choice: jalan-jalannya
  rationale: Ungkapan Ibrani ini menunjuk pada haluan hidup, tindakan, atau sepak terjang seseorang. ‘Jalan-jalannya’ mempertahankan kiasan sumber dan tetap alami dalam bahasa Indonesia.
- source_word: בְּכָל־עֵת
  choice: selalu
  rationale: Ungkapan ini menyatakan keadaan yang berlangsung setiap waktu; ‘selalu’ menyampaikannya secara ringkas dan alami.
- source_word: מָרוֹם
  choice: begitu tinggi
  rationale: Kata ini mempertahankan gambaran ruang tentang keputusan Allah yang berada tinggi dan, bagi orang fasik, terasa jauh dari jangkauannya.
- source_word: מִשְׁפָּטֶיךָ
  choice: keputusan-keputusan hukum-Mu
  rationale: Bentuk jamak ini dapat menunjuk pada putusan atau tindakan penghakiman Allah. Pilihan ini menjaga unsur yudisial tanpa membatasinya hanya pada peraturan tertulis.
- source_word: מִנֶּגְדּוֹ
  choice: jauh dari pandangannya
  rationale: Bersama kata ‘tinggi’, frasa ini mengungkapkan bahwa keputusan Allah berada di luar perhatian atau jangkauan pandangan orang fasik.
- source_word: כָּל־צוֹרְרָיו
  choice: semua lawannya
  rationale: צוֹרֵר berarti orang yang memusuhi atau menentang. ‘Lawan’ jelas, alami, dan sesuai dengan ragam puitis modern.
- source_word: יָפִיחַ בָּהֶם
  choice: ia mendengus dengan angkuh
  rationale: Kata kerja ini menggambarkan hembusan napas yang menyatakan penghinaan. ‘Mendengus’ mempertahankan citra tubuh yang hidup, sedangkan ‘dengan angkuh’ memperjelas maksud gerak tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Makna יָחִילוּ mengenai keadaan orang fasik
  choice: Jalan-jalan orang fasik terus berhasil.
  alternative: Jalan-jalannya selalu kukuh atau aman; secara lebih harfiah kata kerjanya juga pernah dikaitkan dengan menggeliat atau bersusah payah.
  rationale: Mazmur ini meratapi keberhasilan lahiriah dan keangkuhan orang fasik. Makna ‘berhasil’ paling selaras dengan keputusan Allah yang tampak jauh baginya dan sikapnya yang meremehkan semua lawan, tetapi ketidakpastian leksikal tetap dinyatakan dalam catatan kaki.
- issue: Hubungan keputusan Allah dengan orang fasik
  choice: Keputusan-keputusan Allah digambarkan tinggi dan jauh dari pandangan orang fasik.
  alternative: Keputusan-keputusan Allah semata-mata luhur atau ditinggikan, tanpa penekanan pada ketidakpedulian orang fasik.
  rationale: Susunan מָרוֹם ... מִנֶּגְדּוֹ menggabungkan gambaran ketinggian dengan jarak dari hadapan atau pandangan orang fasik. Terjemahan tidak menentukan apakah jarak itu objektif atau terutama mencerminkan ketidakpeduliannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Kiasan ‘jalan’, ketinggian keputusan Allah, dan dengusan penghinaan dipertahankan. Bentuk sapaan ilahi memakai kapital hormat secara konsisten.
