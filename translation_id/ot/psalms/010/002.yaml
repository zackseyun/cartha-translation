base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: id
  text: Dalam keangkuhannya, orang fasik mengejar orang tertindas[a]; semoga mereka terjerat dalam siasat yang mereka rancang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dalam keangkuhan orang fasik, orang tertindas dikejar.” Susunan Ibraninya padat; klausa itu juga dapat dipahami dengan orang fasik sebagai pelaku dan orang tertindas sebagai sasaran.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka terjerat dalam siasat yang mereka rancang.” Bentuk Ibraninya dapat dibaca sebagai pernyataan, bukan sebagai harapan atau doa.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: dengan angkuh
  rationale: Gabungan preposisi ב dan גַּאֲוָה menerangkan sikap atau cara orang fasik bertindak. “Dengan angkuh” alami dalam bahasa Indonesia dan tetap menghubungkan pengejaran itu dengan keangkuhannya.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggal ini dipakai secara representatif. “Orang fasik” merupakan padanan yang wajar dan bermartabat tanpa mempersempitnya kepada satu tokoh tertentu.
- source_word: יִדְלַק
  choice: memburu
  rationale: דלק dapat berarti mengejar dengan dekat atau gigih, dengan nuansa permusuhan. “Memburu” menyampaikan pengejaran yang keras tanpa memasukkan gambaran harfiah tentang terbakar.
- source_word: עָנִי
  choice: orang tertindas
  rationale: עָנִי mencakup orang miskin, sengsara, atau tertindas. Dalam konteks pemburuan oleh orang fasik, “orang tertindas” menonjolkan kerentanannya tanpa menghilangkan cakupan sosial istilah itu.
- source_word: יִתָּפְשׂוּ
  choice: semoga mereka terjerat
  rationale: Nifal imperfek jamak dipahami sebagai harapan atau permohonan agar para pelaku kejahatan mengalami pembalikan dari rencana mereka sendiri. “Terjerat” serasi dengan gambaran masuk ke dalam siasat sendiri.
- source_word: בִּמְזִמּוֹת
  choice: dalam siasat
  rationale: מְזִמּוֹת di sini menunjuk kepada rancangan licik atau jahat. “Siasat” mempertahankan unsur perencanaan, sedangkan “dalam” menggambarkan mereka terperangkap di dalam rancangan itu.
- source_word: זוּ חָשָׁבוּ
  choice: yang mereka rancang
  rationale: זוּ berfungsi sebagai partikel relatif dan חָשָׁבוּ menunjuk pada perencanaan yang disengaja. Ungkapan ini ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya sintaksis klausa kedua
  choice: 'Permohonan atau harapan: “semoga mereka terjerat dalam siasat yang mereka rancang”'
  alternative: 'Pernyataan: “mereka terjerat dalam siasat yang mereka rancang”'
  rationale: Bentuk Ibrani dapat dipahami sebagai modal/jusif atau indikatif. Bacaan berupa permohonan cocok dengan retorika doa dalam mazmur dan motif pembalikan moral, tetapi kemungkinan pernyataan tetap dicatat karena bentuknya ambigu.
- issue: Hubungan pelaku dan sasaran dalam klausa pertama
  choice: Orang fasik sebagai pelaku yang memburu orang tertindas
  alternative: 'Susunan pasif yang menonjolkan orang tertindas: “karena keangkuhan orang fasik, orang tertindas diburu”'
  rationale: יִדְלַק berbentuk maskulin tunggal dan paling wajar merujuk kepada רָשָׁע sebagai subjek, sedangkan עָנִי menjadi sasaran. Namun, susunan Ibraninya padat, sehingga kemungkinan ungkapan pasif yang menonjolkan korban dicatat tanpa mengubah hubungan dasar pelaku-sasaran.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Orang fasik,” “orang tertindas,” dan “siasat” mempertahankan register puitis-keagamaan tanpa menjadi kuno. Bentuk tunggal representatif pada klausa pertama dan peralihan ke bentuk jamak pada klausa kedua dipertahankan sesuai teks Ibrani.
