  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: id
  text: Engkau telah melihat, sebab Engkau memperhatikan kesusahan dan kepedihan untuk mengambilnya ke dalam tangan-Mu.[a] Orang yang tak berdaya menyerahkan dirinya kepada-Mu;[b] Engkau telah menjadi penolong anak yatim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk menaruhnya dalam tangan-Mu”; ungkapan Ibrani ini juga dapat dipahami sebagai Allah mengambil perkara itu untuk bertindak.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Orang malang menyerahkan perkaranya kepada-Mu.” Teks Ibrani dapat merujuk pada orang itu sendiri atau pada perkaranya yang dipercayakan kepada Allah.'
    reason: alternative_reading
  - marker: c
    text: Istilah Ibrani terutama menunjuk pada anak yang tidak berayah; dapat juga diterjemahkan “anak piatu” dalam pengertian tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: Engkau telah melihatnya
  rationale: Bentuk Qal perfekt orang kedua maskulin tunggal ditujukan kepada Allah. Bentuk "telah melihat" mempertahankan aspek perfektif dan menegaskan bahwa keadaan itu tidak luput dari pengamatan-Nya; pronomina "-nya" merujuk pada perkara yang kemudian disebutkan.
- source_word: עָמָל
  choice: kesusahan
  rationale: Dalam mazmur keluhan, kata ini dapat menunjuk pada kesusahan, penderitaan, atau kejahatan yang menindas. "Kesusahan" cukup luas untuk mempertahankan nuansa penderitaan tanpa membatasinya pada kerja berat.
- source_word: כַעַס
  choice: kepedihan
  rationale: Dalam pasangan dengan עָמָל, kata ini menunjuk pada pengalaman menyakitkan atau kejengkelan yang ditimbulkan oleh penindasan. "Kepedihan" menghindari kesan bahwa yang dimaksud pasti murka Allah.
- source_word: תַּבִּיט
  choice: Engkau memperhatikan
  rationale: Bentuk Hifil dari נבט menyatakan pandangan yang terarah atau penuh perhatian, bukan sekadar melihat sepintas.
- source_word: לָתֵת בְּיָדֶךָ
  choice: untuk mengambilnya ke dalam tangan-Mu
  rationale: Secara harfiah frasa ini berbunyi kira-kira "untuk menaruh/memberikannya dalam tangan-Mu". Terjemahan utama menyampaikan idiom bahwa Allah mengambil perkara itu untuk ditangani, sementara catatan kaki mempertahankan bentuk harfiah dan ambiguitasnya.
- source_word: חֵלֶכָה
  choice: orang yang tak berdaya
  rationale: Kata ini menunjuk pada orang malang, lemah, atau rentan. Pilihan ini sesuai dengan ketergantungannya kepada Allah dan paralelnya dengan anak yatim.
- source_word: עָלֶיךָ יַעֲזֹב
  choice: menyerahkan dirinya kepada-Mu
  rationale: Konstruksi עזב dengan עַל di sini paling wajar mengungkapkan tindakan memercayakan diri atau perkaranya kepada Allah, bukan ditelantarkan oleh Allah.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Dalam pemakaian Ibrani Alkitab, istilah ini terutama menunjuk pada anak yang kehilangan ayah dan karena itu rentan secara sosial. "Anak yatim" adalah ungkapan Indonesia yang alami dan mapan.
- source_word: עוֹזֵר
  choice: penolong
  rationale: Partisip ini dipakai secara predikatif untuk Allah. "Penolong" mempertahankan sifat personal dan ringkas dari pengakuan pemazmur.
theological_decisions:
- issue: Apakah penglihatan Allah hanya berupa pengamatan atau mengarah pada tindakan
  choice: Allah melihat penderitaan dan mengambil perkara itu ke dalam tangan-Nya untuk ditangani
  alternative: Allah melihat kesusahan dan kepedihan untuk menaruhnya dalam tangan-Nya
  rationale: Frasa infinitif לָתֵת בְּיָדֶךָ dalam konteks seruan kepada Allah paling mungkin mengarah pada tindakan-Nya, tetapi cara dan bentuk tindakan itu tidak diperinci. Catatan kaki menjaga kemungkinan pembacaan yang lebih harfiah.
- issue: Apa yang diserahkan orang tak berdaya kepada Allah
  choice: Orang tak berdaya menyerahkan dirinya kepada Allah
  alternative: Orang tak berdaya menyerahkan perkaranya kepada Allah
  rationale: Teks Ibrani tidak menyatakan objek secara eksplisit. Terjemahan utama menonjolkan kebergantungan pribadi, sedangkan catatan kaki mempertahankan kemungkinan bahwa yang dipercayakan adalah perkaranya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan ilahi “Engkau” dan akhiran pronominal “-Mu”. Diksi dibuat khidmat tetapi mudah dipahami. “Mengambilnya ke dalam tangan-Mu” sengaja mempertahankan citra tangan dari teks Ibrani, sementara catatan kaki menjelaskan bentuk harfiah dan fungsi idiomatisnya.
