  naturalness: Teks revisi memakai bahasa Indonesia modern yang lugas dan puitis. "Mengintai" juga lebih idiomatis daripada pengulangan "mengendap" dalam konteks pemangsa yang menunggu korban.
  terminology: '"Orang miskin" adalah padanan yang wajar bagi עני dalam konteks ini. "Menangkap" mempertahankan pengulangan חטף secara jelas tanpa menambahkan nuansa penafsiran. "Tempat persembunyiannya" untuk סכה menjaga makna naungan/penutup tanpa terlalu menyempitkannya menjadi sarang hewan.'
