  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: id
  text: Ia mengintai di tempat tersembunyi[a], seperti singa di tempat persembunyiannya[b]; ia mengintai untuk menangkap orang miskin; ia menangkap orang miskin ketika ia menariknya ke dalam jaringnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara tersembunyi.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai dapat menunjuk pada pondok, tempat berlindung, atau belukar yang menjadi tempat persembunyian.
    reason: lexical_alternative
  - marker: c
    text: Atau “dengan menariknya ke dalam jaringnya” atau “dengan jaringnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: mengendap
  rationale: Kata kerja ארב menggambarkan tindakan menunggu secara tersembunyi untuk menyerang. “Mengendap” alami dalam bahasa Indonesia dan mempertahankan kesan penyergapan yang disengaja; pengulangannya dipertahankan.
- source_word: בַּמִּסְתָּר
  choice: di tempat tersembunyi
  rationale: מִסְתָּר dapat menunjuk pada tempat persembunyian atau keadaan yang dirahasiakan. Pilihan ini menonjolkan lokasi tersembunyi yang sesuai dengan gambaran pemangsa.
- source_word: כְּאַרְיֵה
  choice: seperti singa
  rationale: Terjemahan langsung ini mempertahankan perumpamaan tentang pemangsa yang berbahaya.
- source_word: בְסֻכֹּה
  choice: di sarangnya
  rationale: Dalam konteks perbandingan dengan singa, “sarang” secara wajar menyampaikan tempat berlindung atau persembunyian pemangsa, meskipun kata Ibraninya juga dapat menunjuk pada pondok, naungan, atau belukar.
- source_word: לַחֲטוֹף / יַחְטֹף
  choice: untuk menangkap / ia menangkap
  rationale: חטף menyatakan penangkapan yang mendadak dan kuat. “Menangkap” jelas dan alami dalam konteks korban serta jaring, sementara pengulangan akar katanya dipertahankan untuk menjaga tekanan puitis.
- source_word: עָנִי
  choice: orang miskin
  rationale: עָנִי dapat berarti miskin, tertindas, atau sengsara. Dalam konteks penindasan sosial Mazmur 10, “orang miskin” adalah padanan langsung yang juga menyiratkan kerentanan.
- source_word: בְּמָשְׁכוֹ
  choice: ketika menariknya
  rationale: Infinitif dengan prefiks ב dapat menyatakan sarana atau keadaan yang menyertai. “Ketika menariknya” mempertahankan kemungkinan tindakan yang berlangsung bersama penangkapan tanpa memaksakan pembacaan kausal tunggal.
- source_word: בְרִשְׁתּוֹ
  choice: ke dalam jaringnya
  rationale: רֶשֶׁת berarti “jaring.” Walaupun preposisinya secara harfiah dapat berarti “di/dengan,” frasa Indonesia ini secara alami mengungkapkan gerakan penarikan dan jebakan yang tersirat.
