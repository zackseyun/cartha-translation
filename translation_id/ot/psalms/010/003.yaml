  text: For the wicked man boasts in the desire of his soul, and the greedy man blesses himself and despises the LORD.
translation:
  language: id
  text: Sebab orang fasik membanggakan keinginan hatinya, dan orang yang tamak memberkati,[a] lalu menghina TUHAN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani pada bagian ini padat dan dapat dipahami dengan beberapa cara. Kata yang diterjemahkan “memberkati” tidak menyebutkan objek; sebagian memahaminya sebagai “memberkati dirinya sendiri.” Dalam beberapa pemakaian Ibrani, kata “memberkati” juga dapat digunakan secara eufemistis dengan makna kebalikannya, seperti “mengutuk” atau “menghujat.”
    reason: Klausa בֵּרֵךְ נִאֵץ יְהוָה bersifat sintaktis padat dan kemungkinan fungsi eufemistis בֵּרֵךְ tidak boleh disembunyikan. Catatan ini mempertahankan kemungkinan-kemungkinan tersebut tanpa menetapkan objek yang tidak tersurat dalam teks utama.
lexical_decisions:
- source_word: הִלֵּל
  choice: membanggakan
  rationale: Dalam konstruksi ini berarti bermegah atau menyombongkan diri mengenai sesuatu; 'membanggakan' alami dalam bahasa Indonesia dan mempertahankan kecaman pemazmur.
- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: keinginan hatinya
  rationale: Secara harfiah 'keinginan jiwanya'; נֶפֶשׁ di sini menunjuk pada diri batin atau hasrat seseorang, sehingga 'hati' menyampaikan maksudnya secara wajar tanpa mengubah acuan personal.
- source_word: בֹצֵעַ
  choice: orang yang tamak
  rationale: Partisip ini dapat menunjuk pada orang yang mengejar keuntungan secara rakus atau tidak benar; 'orang yang tamak' ringkas dan sesuai konteks moral.
- source_word: בֵּרֵךְ
  choice: memberkati dirinya sendiri
  rationale: Bentuk Ibrani secara leksikal berarti 'memberkati'. Objek refleksif tidak dinyatakan eksplisit, tetapi dipahami dari konstruksi dan paralelisme; pilihan ini mempertahankan arti biasa kata tersebut sekaligus menghasilkan kalimat yang masuk akal.
- source_word: נִאֵץ
  choice: menghina
  rationale: Kata ini menyatakan perlakuan penuh hujat, nista, atau penghinaan terhadap Allah; 'menghina' jelas dan bermartabat.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama perjanjian YHWH dengan huruf kapital penuh.
theological_decisions:
- issue: Hubungan sintaksis בֵּרֵךְ נִאֵץ יְהוָה
  choice: orang yang tamak memberkati dirinya sendiri serta menghina TUHAN
  alternative: orang yang tamak memberkati orang yang menghina TUHAN / orang yang tamak menghujat dan menghina TUHAN
  rationale: Teks Masoret memungkinkan lebih dari satu analisis karena objek בֵּרֵךְ tidak dinyatakan dan dua verba berdekatan. Terjemahan utama mengikuti pembacaan refleksif yang selaras dengan paralelisme, sementara ambiguitas dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan khidmat. 'Orang fasik' mempertahankan istilah mazmur yang lazim; 'keinginan hatinya' lebih alami bagi pembaca umum daripada ungkapan harfiah 'keinginan jiwanya'. Marker [a] ditempatkan pada klausa yang memiliki ambiguitas tekstual-sintaktis.
