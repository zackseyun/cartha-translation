id: PSA.10.1
reference: Psalms 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: id
  text: Mengapa, ya Yahweh, Engkau berdiri di kejauhan? Mengapa Engkau menyembunyikan diri pada saat-saat kesesakan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mengapa Engkau menyembunyikan diri pada saat-saat kesusahan?”'
    reason: Alternatif leksikal untuk צָרָה, yang juga dapat berarti “kesusahan”.
lexical_decisions:
- source_word: לָמָה
  choice: Mengapa
  rationale: Kata tanya ini membuka ratapan dengan pertanyaan langsung dan kuat; “Mengapa” merupakan padanan alami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: תַּעֲמֹד
  choice: Engkau berdiri
  rationale: Bentuk qal dari עמד mempertahankan gambaran spasial dan relasional tentang Allah yang tampak berada jauh.
- source_word: בְּרָחוֹק
  choice: jauh-jauh
  rationale: Ungkapan ini menyatakan jarak yang dirasakan pemazmur; “berdiri jauh-jauh” alami dalam bahasa Indonesia dan tetap mempertahankan metafora spasial.
- source_word: תַּעְלִים
  choice: Engkau menyembunyikan diri
  rationale: Bentuk hifil dari עלם dalam konteks ini menyampaikan tindakan membuat diri tidak terlihat atau tidak hadir bagi orang yang berseru.
- source_word: לְעִתּוֹת
  choice: pada masa-masa
  rationale: Bentuk jamak עת dengan prefiks ל berfungsi secara temporal dan menunjukkan waktu-waktu atau keadaan berulang.
- source_word: בַּצָּרָה
  choice: kesesakan
  rationale: צרה menunjuk pada tekanan, kesukaran, atau keadaan genting; “kesesakan” mempertahankan bobot puitis dan cakupan maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; transliterasi “Yahweh” mempertahankan hal itu tanpa menggantinya dengan gelar.
- issue: Pengulangan kata tanya pada larik kedua
  choice: Mengulangi “Mengapa” secara eksplisit
  alternative: 'Membiarkan larik kedua sebagai pernyataan: “Engkau menyembunyikan diri pada masa-masa kesesakan”'
  rationale: Walaupun לָמָה tidak diulangi dalam larik kedua, paralelisme Ibrani membuat daya tanyanya tetap berlaku. Pengulangan dalam bahasa Indonesia memperjelas struktur ratapan tanpa mengubah maksud.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Sapaan “ya Yahweh” menandai vokatif secara alami. Kapitalisasi pronomina ilahi dipakai sebagai konvensi penghormatan bahasa Indonesia, tanpa menambah unsur makna pada teks sumber.
