  yaml_path: translation/ot/psalms/010/015.yaml
  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: id
  text: Patahkanlah lengan orang fasik dan orang jahat; selidikilah kejahatannya sampai tidak Kautemukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Patahkanlah lengan orang fasik; terhadap orang jahat, selidikilah kejahatannya sampai tidak Kautemukan.” Susunan bahasa Ibrani memungkinkan “orang jahat” dikaitkan dengan klausa kedua. Kata yang diterjemahkan “selidikilah” juga dapat berarti “carilah” atau, dalam konteks penghakiman, “tuntutlah pertanggungjawaban atas.”'
    reason: Menjaga ambiguitas sintaksis antara dua sebutan bagi orang jahat serta rentang makna yudisial kata דרש.
lexical_decisions:
- source_word: שְׁבֹר
  choice: Patahkanlah
  rationale: Bentuk imperatif tunggal yang ditujukan kepada Allah. Pilihan ini mempertahankan kekuatan permohonan dan cocok dengan gambaran konkret tentang lengan.
- source_word: זְרוֹעַ
  choice: lengan
  rationale: Arti harfiahnya ialah lengan, yang secara puitis melambangkan kekuatan atau kemampuan orang jahat untuk bertindak. Gambaran Ibraninya dipertahankan.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva yang dipakai sebagai nomina bagi seseorang yang bersalah atau jahat. 'Orang fasik' mempertahankan nuansa moral dan bentuk tunggal representatif.
- source_word: וָרָע
  choice: dan pelaku kejahatan itu
  rationale: Dapat dipahami sebagai sebutan substantival kedua yang sejajar dengan 'orang fasik'. 'Pelaku kejahatan' alami dalam bahasa Indonesia dan tidak sekadar mengulang kata 'jahat'.
- source_word: תִּדְרוֹשׁ
  choice: selidikilah
  rationale: Kata דרש dapat berarti mencari, menyelidiki, atau menuntut pertanggungjawaban. Dalam konteks penghakiman ini, 'selidikilah' mempertahankan citra pencarian sekaligus memungkinkan nuansa yudisial.
- source_word: רִשְׁעוֹ
  choice: kefasikannya
  rationale: Nomina ini menunjuk pada kefasikan, kejahatan, atau kesalahan orang tersebut. Pilihan ini mempertahankan hubungan leksikal dengan רָשָׁע.
- source_word: בַל תִּמְצָא
  choice: sampai tidak Kautemukan lagi
  rationale: 'Mengungkapkan hasil yang dimohonkan: kejahatannya ditelusuri dan ditangani sedemikian tuntas sehingga tidak ada lagi yang ditemukan. Bentuk orang kedua tetap mempertahankan sapaan langsung kepada Allah.'
theological_decisions:
- issue: Metafora 'lengan' orang fasik
  choice: Mempertahankan kata konkret 'lengan' dalam teks utama
  alternative: Menggantikannya dengan 'kekuatan' atau 'kuasa'
  rationale: Pemazmur memohon agar Allah melumpuhkan kemampuan penindas untuk berbuat jahat. Gambaran puitis Ibrani sebaiknya tidak diabstrakkan dalam teks utama.
- issue: Hubungan רָשָׁע dengan וָרָע
  choice: 'Menampilkan keduanya sebagai sebutan yang sejajar: ''orang fasik dan pelaku kejahatan itu'''
  alternative: Memahaminya sebagai satu rangkaian, misalnya 'orang fasik yang jahat', atau mengaitkan unsur kedua dengan klausa berikutnya
  rationale: Teks Ibrani memungkinkan lebih dari satu pengelompokan sintaksis. Teks utama mengikuti kesejajaran yang wajar tanpa menyamakan kedua istilah sepenuhnya; catatan mempertahankan kemungkinan lain.
- issue: Makna klausa akhir בַל תִּמְצָא
  choice: '''sampai tidak Kautemukan lagi'''
  alternative: '''supaya tidak Kautemukan'' atau ''Engkau tidak akan menemukannya'''
  rationale: Pilihan ini menyampaikan hasil yang diharapkan dari penyelidikan dan penghakiman Allah, yakni kejahatan itu ditangani sampai tidak tersisa, tanpa menyatakan lebih daripada yang dikatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Partikel -lah mempertahankan bentuk permohonan yang tegas; huruf kapital pada 'Kau-' menandai sapaan langsung kepada Allah. Istilah 'fasik' dipakai karena masih lazim dalam register Alkitab Indonesia, sedangkan 'pelaku kejahatan' membuat sebutan kedua jelas bagi pembaca umum.
