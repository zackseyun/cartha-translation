  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
translation:
  language: id
  text: Ia berkata dalam hatinya, “Aku tidak akan goyah[a]; dari generasi ke generasi aku tidak akan mengalami kesusahan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terguncang” atau “bergeser”; kata kerja Ibrani ini dapat menyatakan hilangnya kestabilan.
    reason: lexical_alternative
  - marker: b
    text: Klausa terakhir eliptis dalam bahasa Ibrani. Klausa itu juga dapat diterjemahkan, “dari generasi ke generasi, orang yang tidak mengalami kemalangan,” atau “aku tidak akan pernah mengalami bencana.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: Ia berkata
  rationale: Bentuk perfektif Ibrani dalam puisi dapat menyajikan tindakan secara hidup sebagai keadaan kini; “berkata” wajar dalam bahasa Indonesia untuk memperkenalkan ucapan batin orang fasik.
- source_word: בְּלִבּוֹ
  choice: dalam hatinya
  rationale: Ungkapan ini menunjuk pada pikiran atau perkataan dalam batin. Metafora “hati” dipertahankan karena jelas dan alami dalam bahasa Indonesia.
- source_word: בַּל אֶמּוֹט
  choice: Aku tidak akan goyah
  rationale: Partikel negatif puitis בַּל dan bentuk Nifal dari מוט menyatakan keyakinan bahwa dirinya tidak akan terguncang, bergeser, atau kehilangan kestabilan. “Tidak akan goyah” mempertahankan metafora dan terdengar alami.
- source_word: לְדֹר וָדֹר
  choice: turun-temurun
  rationale: Ungkapan ini menyatakan kelangsungan dari satu generasi ke generasi berikutnya. “Turun-temurun” ringkas, alami, dan mempertahankan cakupan waktunya.
- source_word: אֲשֶׁר לֹא בְרָע
  choice: aku tidak akan ditimpa malapetaka
  rationale: Klausa Ibrani ini eliptis. רָע dengan preposisi ב dapat menunjuk pada keadaan buruk, kesusahan, atau bencana. Terjemahan ini melengkapi orang pertama yang tersirat dan meneruskan kesombongan si fasik tanpa menghapus ketidakpastian lewat catatan kaki.
theological_decisions:
- issue: Klausa akhir yang eliptis dan sudut pandang penutur
  choice: 'Klausa akhir dipahami sebagai kelanjutan ucapan orang pertama si fasik: “aku tidak akan ditimpa malapetaka.”'
  alternative: Klausa itu dapat dipahami sebagai keterangan relatif, “orang yang tidak mengalami kemalangan,” atau secara lebih harfiah, “dari generasi ke generasi, yang tidak dalam kesusahan.”
  rationale: Konteks ayat menyajikan keyakinan batin orang fasik akan keamanannya sendiri. Melanjutkan bentuk orang pertama menghasilkan bahasa Indonesia yang koheren, sementara ambiguitas gramatikal yang nyata dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. “Turun-temurun” menghindari susunan yang kaku, sedangkan “ditimpa malapetaka” menyampaikan kesombongan akan keamanan terus-menerus dalam laras yang bermartabat.
