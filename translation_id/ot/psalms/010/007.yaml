  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
translation:
  language: id
  text: Mulutnya penuh dengan kutukan[a], tipu daya, dan penindasan; di bawah lidahnya ada malapetaka dan kejahatan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sumpah”; dalam konteks perkataan yang bermusuhan ini, “kutukan” lebih mungkin.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesusahan dan kefasikan” untuk “malapetaka dan kejahatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: kutukan
  rationale: Dalam konteks perkataan orang fasik, nomina ini paling wajar menunjuk pada kutukan, bukan sumpah yang netral.
- source_word: פִּיהוּ
  choice: mulutnya
  rationale: Mempertahankan gambaran konkret Ibrani tentang perkataan yang keluar dari mulut.
- source_word: מָלֵא
  choice: penuh dengan
  rationale: Padanan Indonesia yang alami bagi gagasan keadaan penuh atau kelimpahan.
- source_word: מִרְמוֹת
  choice: tipu daya
  rationale: Menyampaikan makna kelicikan atau penipuan dengan ungkapan Indonesia yang umum dan bermartabat.
- source_word: תֹךְ
  choice: penindasan
  rationale: Dalam rangkaian ini, kata tersebut menunjuk pada tindakan merugikan atau menindas; pilihan ini menjaga dimensi sosial dari kejahatan itu.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: di bawah lidahnya
  rationale: Mempertahankan metafora hidup tentang kejahatan yang tersimpan atau siap diucapkan.
- source_word: עָמָל
  choice: kesusahan
  rationale: Di sini bukan kerja biasa, melainkan kesusahan atau celaka yang ditimbulkan; kata ini juga menjaga keluasan makna Ibrani.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Padanan alami yang mempertahankan bobot moral berupa keburukan dan perbuatan salah.
