lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku
  rationale: Konjungsi dan pronomina mandiri menandai kontras serta penegasan subjek; “Namun aku” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Adverbia ini menunjukkan kesinambungan; “senantiasa” bernada wajar dan bermartabat dalam puisi.
- source_word: אֲיַחֵל
  choice: akan ... berharap
  rationale: Bentuk piel dari יחל menyatakan berharap atau menanti dengan penuh harap; konteksnya mendukung tekad yang berkelanjutan.
- source_word: וְהוֹסַפְתִּי
  choice: dan akan terus menambah
  rationale: יסף berarti menambah atau meningkatkan. Kata “terus” membuat gagasan penambahan lanjutan terasa alami tanpa menghilangkan metafora Ibrani.
- source_word: עַל כָּל תְּהִלָּתֶךָ
  choice: puji-pujian kepada-Mu
  rationale: Dalam konstruksi dengan יסף, עַל menyatakan penambahan, sedangkan תְּהִלָּתֶךָ menunjuk pada pujian yang ditujukan atau layak diberikan kepada Allah. Bentuk jamak Indonesia membantu menyampaikan כָּל secara idiomatis.
