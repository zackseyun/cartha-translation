source:
  edition: WLC
  text: אֱ֭לֹהִים אַל תִּרְחַ֣ק מִמֶּ֑/נִּי אֱ֝לֹהַ֗/י לְ/עֶזְרָ֥תִ/י חיש/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/012.yaml
  text: God[a], do not be far from me; my God, hurry to help me.
translation:
  language: id
  text: Ya Allah, janganlah jauh dariku; Allahku, segeralah menolong aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung. Dalam bahasa Indonesia modern, partikel vokatif “Ya” menyampaikan fungsi itu secara alami dan khidmat.
- source_word: אַל
  choice: janganlah
  rationale: Partikel larangan dalam permohonan diterjemahkan dengan “janganlah,” yang mempertahankan daya permohonan sekaligus sesuai dengan ragam doa.
- source_word: תִּרְחַק
  choice: jauh
  rationale: Verba רחק berarti berada atau menjadi jauh. Gabungan “janganlah jauh” mempertahankan metafora jarak relasional dan spasial tanpa menambahkan gagasan menjauhkan diri.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Preposisi dengan sufiks orang pertama tunggal secara langsung menyatakan jarak dari pemazmur.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk dengan sufiks orang pertama tunggal menyatakan sapaan pribadi, “Allahku,” dan mempertahankan pengulangan sebutan ilahi.
- source_word: לְעֶזְרָתִי
  choice: menolong aku
  rationale: Secara harfiah berarti “untuk/ke pertolonganku.” Sesudah perintah untuk bergegas, “menolong aku” merupakan ungkapan Indonesia yang alami dan tidak mengubah maksudnya.
- source_word: חִישָׁה
  choice: segeralah
  rationale: Bentuk perintah dari חושׁ menyatakan desakan untuk bergegas. “Segeralah” alami dalam doa modern dan tidak menambahkan verba gerak seperti “datanglah.”
theological_decisions:
- issue: Penerjemahan dua sebutan ilahi dalam sapaan langsung
  choice: Ya Allah ... Allahku
  alternative: Allah ... Allahku; Ya Allah ... ya Allahku
  rationale: “Ya” pada sapaan pertama memperjelas fungsi vokatif dalam bahasa Indonesia, sedangkan “Allahku” tetap jelas sebagai sapaan pada klausa kedua tanpa harus mengulang partikel. Pilihan ini mempertahankan ketergantungan pribadi dan desakan doa tanpa memberi corak denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Bentuk “janganlah” dan “segeralah” sesuai dengan register doa tanpa terasa terlalu arkais; urutan dan paralelisme Ibrani dipertahankan secara alami.
