  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
translation:
  language: id
  text: Lidahku pun akan berbicara tentang keadilan-Mu sepanjang hari[a], sebab orang-orang yang berusaha mencelakakan aku telah malu dan menjadi tercela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebenaran-Mu.” Istilah Ibrani ini dapat menunjuk pada kebenaran maupun keadilan, khususnya ketika Allah bertindak untuk membela dan menyelamatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: pun
  rationale: 'Menunjukkan kelanjutan dari pujian sebelumnya secara alami dalam bahasa Indonesia: lidah pemazmur pun ikut memuji.'
- source_word: לְשׁוֹנִי
  choice: Lidahku
  rationale: Mempertahankan gambaran konkret dan puitis dari istilah Ibrani, bukan mengabstraksikannya menjadi 'ucapanku'.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan Indonesia modern yang alami dan tetap mempertahankan penekanan duratif.
- source_word: תֶּהְגֶּה
  choice: akan membicarakan
  rationale: הגה dapat berarti bergumam, merenungkan, atau mengucapkan. Karena subjeknya 'lidahku', ungkapan lisan paling sesuai; 'membicarakan' tetap memberi ruang bagi nuansa perenungan yang diucapkan.
- source_word: צִדְקָתֶךָ
  choice: keadilan-Mu
  rationale: Dalam konteks ini, tindakan Allah yang membuat para pencari celaka mendapat malu menonjolkan dimensi penghakiman dan pembelaan yang adil. Catatan kaki mempertahankan alternatif 'kebenaran-Mu' agar keluasan makna צדקה tidak hilang.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi pujian pemazmur dengan jelas dan alami.
- source_word: בֹשׁוּ
  choice: telah mendapat malu
  rationale: Menyampaikan keadaan malu sebagai hasil yang sudah terjadi tanpa memaksakan bentuk pasif yang kaku.
- source_word: כִּי חָפְרוּ
  choice: dan dipermalukan
  rationale: כי kedua dipahami sebagai penegasan atau kelanjutan erat dari hasil sebelumnya; konjungsi 'dan' menghasilkan bahasa Indonesia alami, sedangkan 'dipermalukan' mempertahankan nuansa kehinaan yang berbeda dari בושׁ.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: orang-orang yang berusaha mencelakakan aku
  rationale: Menyampaikan tindakan bermusuhan yang sedang diupayakan. Bentuk ini lebih alami daripada terjemahan harfiah 'mencari celakaku'.
theological_decisions:
- issue: Makna צִדְקָתֶךָ dalam konteks mazmur
  choice: keadilan-Mu
  alternative: kebenaran-Mu
  rationale: צדקה mencakup kebenaran moral sekaligus keadilan yang membela dan menyelamatkan. Konteks dipermalukannya para penyerang mendukung 'keadilan-Mu', tetapi alternatif dicatat untuk menjaga keluasan teologis istilah itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapital pada enklitik '-Mu' menandai sapaan kepada Allah sesuai kelaziman penerbitan Alkitab Indonesia. Paralelisme dua ungkapan malu dipertahankan tanpa membuat keduanya identik.
