  text: וְ/גַ֤ם עַד זִקְנָ֨ה וְ/שֵׂיבָה֮ אֱלֹהִ֪ים אַֽל תַּעַ֫זְבֵ֥/נִי עַד אַגִּ֣יד זְרוֹעֲ/ךָ֣ לְ/ד֑וֹר לְ/כָל יָ֝ב֗וֹא גְּבוּרָתֶֽ/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: id
  text: Bahkan sampai aku tua dan beruban, ya Allah, jangan tinggalkan aku, sampai aku memberitakan lengan-Mu kepada generasi berikutnya, keperkasaan-Mu kepada semua orang di masa mendatang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bagian akhir juga dapat dipahami, “lengan-Mu kepada suatu generasi, keperkasaan-Mu kepada semua generasi yang akan datang.” “Lengan” merupakan gambaran bagi kuasa Allah yang bertindak.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם עַד זִקְנָה וְשֵׂיבָה
  choice: Bahkan sampai masa tua dan rambut beruban
  rationale: Mempertahankan penekanan וְגַם, batas waktu עַד, dan gambaran konkret tentang usia lanjut serta uban dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Bentuk sapaan langsung yang alami dalam doa bahasa Indonesia.
- source_word: אַל תַּעַזְבֵנִי
  choice: jangan tinggalkan aku
  rationale: Menyampaikan permohonan agar Allah tidak meninggalkan pemazmur tanpa memberi nuansa arkais yang tidak perlu.
- source_word: עַד אַגִּיד
  choice: sampai aku memberitakan
  rationale: Mengungkapkan keberlangsungan pertolongan yang dimohon hingga pemazmur dapat menyampaikan kesaksian secara terbuka.
- source_word: זְרוֹעֲךָ
  choice: lengan-Mu
  rationale: Mempertahankan metafora Ibrani tentang kuasa Allah yang bertindak, alih-alih langsung menafsirkannya sebagai kekuatan.
- source_word: לְדוֹר
  choice: kepada generasi berikutnya
  rationale: Dalam konteks pemazmur yang telah lanjut usia, frasa ini menunjuk secara alami kepada generasi sesudahnya.
- source_word: לְכָל יָבוֹא
  choice: kepada semua orang yang akan datang
  rationale: Mempertahankan bentuk kolektif dan cakupan masa depan tanpa membatasi frasa ini hanya pada satu generasi.
- source_word: גְּבוּרָתֶךָ
  choice: keperkasaan-Mu
  rationale: Mencakup makna kekuatan atau tindakan perkasa serta membedakannya dari metafora 'lengan-Mu'.
theological_decisions:
- issue: Apakah metafora 'lengan-Mu' dipertahankan atau ditafsirkan langsung sebagai kuasa Allah
  choice: Mempertahankan 'lengan-Mu' dalam teks utama
  alternative: kekuatan-Mu; kuasa-Mu
  rationale: Metafora tubuh dalam bahasa Ibrani menggambarkan kuasa Allah yang aktif. Mempertahankannya menjaga citra puitis dan tidak menghapus tekstur teologis sumber.
- issue: Cakupan לְדוֹר ... לְכָל יָבוֹא
  choice: Membedakan generasi berikutnya dari semua orang yang akan datang
  alternative: kepada segala generasi mendatang
  rationale: Susunan Ibrani bergerak dari satu generasi kepada cakupan masa depan yang lebih luas; terjemahan ini mempertahankan perluasan tersebut.
- issue: Hubungan sintaksis גְּבוּרָתֶךָ dengan frasa sebelumnya
  choice: Mengaitkan 'keperkasaan-Mu' dengan 'semua orang yang akan datang'
  alternative: Menganggap seluruh bagian sebagai ungkapan tunggal tentang generasi-generasi mendatang
  rationale: Pembacaan ini mengikuti paralelisme yang paling langsung, tetapi bahasa Ibraninya padat dan memungkinkan pemahaman generasional yang lebih menyatu; ambiguitas itu dicatat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan hormat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Metafora sumber dipertahankan, sedangkan catatan kaki menjelaskan citranya dan mencatat kemungkinan pembacaan sintaksis pada bagian akhir.
