  text: אֱֽלֹהִ֗ים לִמַּדְתַּ֥/נִי מִ/נְּעוּרָ֑/י וְ/עַד הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/017.yaml
  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: id
  text: Ya Allah, Engkau telah mengajar aku sejak masa mudaku, dan sampai sekarang aku memberitakan perbuatan-perbuatan-Mu yang ajaib.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keajaiban-keajaiban-Mu” atau “karya-karya-Mu yang menakjubkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ya Allah
  rationale: Nomina ilahi ini berfungsi sebagai sapaan langsung. Partikel “Ya” menyatakan fungsi vokatif secara alami dan khidmat dalam bahasa Indonesia tanpa menambah unsur makna baru.
- source_word: לִמַּדְתַּנִי
  choice: Engkau telah mengajar aku
  rationale: Bentuk piel dengan sufiks orang pertama tunggal berarti bahwa Allah mengajar pemazmur. “Telah mengajar” menyampaikan tindakan lampau yang pengaruhnya berlanjut hingga kini.
- source_word: מִנְּעוּרָי
  choice: sejak masa mudaku
  rationale: Ungkapan ini menunjuk pada rentang waktu yang bermula pada masa muda pemazmur. “Sejak masa mudaku” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dari masa mudaku”.
- source_word: וְעַד הֵנָּה
  choice: dan sampai sekarang
  rationale: Frasa ini menyatakan kelanjutan hingga waktu pemazmur berbicara. Pilihan ini langsung, alami, dan mempertahankan hubungan waktunya.
- source_word: אַגִּיד
  choice: aku memberitakan
  rationale: Bentuk hifil dari נגד dapat berarti menceritakan, menyatakan, atau memberitakan. “Memberitakan” mempertahankan nuansa kesaksian terbuka tanpa memperkuatnya secara berlebihan.
- source_word: נִפְלְאוֹתֶיךָ
  choice: perbuatan-perbuatan-Mu yang ajaib
  rationale: Kata ini lazim menunjuk pada tindakan luar biasa Allah. Pilihan ini membuat unsur tindakan yang tersirat menjadi jelas dalam bahasa Indonesia, sementara alternatif yang lebih ringkas dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah אֱלֹהִים merupakan sapaan langsung atau pokok pernyataan
  choice: 'Sapaan langsung: “Ya Allah, Engkau telah mengajar aku”'
  alternative: Pernyataan tentang Allah
  rationale: Kata kerja dan sufiks orang kedua tunggal maskulin yang menyusul paling wajar menunjukkan bahwa pemazmur sedang berbicara langsung kepada Allah. Pilihan ini mempertahankan bentuk doa tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat dan mudah dipahami. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penulisan religius Indonesia. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
