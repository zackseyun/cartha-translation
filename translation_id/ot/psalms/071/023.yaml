  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: id
  text: Bibirku akan bersorak-sorai ketika aku menyanyikan pujian kepada-Mu[a], dan jiwaku juga, yang telah Kautebus[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena aku menyanyikan pujian kepada-Mu.” Kata Ibrani כִּי dapat menyatakan waktu atau alasan.
    reason: syntactical_alternative
  - marker: b
    text: Atau “nyawaku” atau “diriku”; kata Ibrani nefesy dapat menunjuk pada jiwa, kehidupan, atau pribadi seutuhnya.
    reason: lexical_alternative
  - marker: c
    text: Atau “telah Kaubebaskan” atau “telah Kauselamatkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: akan bersorak-sorai
  rationale: Bentuk piel dari רנן menyatakan seruan sukacita atau nyanyian gembira; “bersorak-sorai” mempertahankan luapan sukacita tanpa membatasi maknanya hanya pada nyanyian.
- source_word: שְׂפָתַי
  choice: bibirku
  rationale: Terjemahan langsung ini mempertahankan citraan puitis Ibrani tentang pujian yang keluar dari bibir pemazmur.
- source_word: כִּי
  choice: ketika
  rationale: Dalam konteks ini כִּי dapat dipahami sebagai pengantar keadaan atau saat bibir bersorak, meskipun arti “sebab/karena” tetap mungkin.
- source_word: אֲזַמְּרָה לָּךְ
  choice: aku bermazmur bagi-Mu
  rationale: זמר dalam piel lazim menunjuk pada pujian musikal; “bermazmur” merupakan ungkapan Indonesia yang ringkas dan sesuai dengan konteks kitab Mazmur, sedangkan ל menandai pihak yang menjadi tujuan pujian.
- source_word: וְנַפְשִׁי
  choice: begitu juga jiwaku
  rationale: ו menghubungkan unsur kedua dalam kesejajaran, sedangkan נֶפֶשׁ dapat berarti jiwa, nyawa, atau diri. “Begitu juga” membuat kesejajaran dengan “bibirku” terbaca alami.
- source_word: פָּדִיתָ
  choice: telah Kautebus
  rationale: פדה menyatakan pembebasan melalui penebusan atau pembayaran tebusan, dan “tebus” mempertahankan bobot penyelamatan tanpa mempersempitnya pada rumusan doktrinal tertentu.
theological_decisions:
- issue: Makna tindakan Allah dalam פדה
  choice: telah Kautebus
  alternative: telah Kaubebaskan / telah Kauselamatkan
  rationale: “Kautebus” mempertahankan nuansa pelepasan dengan tebusan yang melekat pada פדה serta bobot teologisnya dalam ibadah, tanpa menentukan mekanisme penebusan yang tidak dinyatakan dalam ayat ini.
- issue: Cakupan makna נֶפֶשׁ
  choice: jiwaku
  alternative: nyawaku / diriku
  rationale: “Jiwaku” mempertahankan ungkapan puitis tradisional dan kesejajaran antropologis dengan “bibirku”, sementara catatan kaki menjaga keluasan makna Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. “Bermazmur” dipilih sebagai istilah ibadah yang sudah lazim; tanda baca mempertahankan satu kalimat dengan kesejajaran antara bibir dan jiwa.
