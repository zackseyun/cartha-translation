id: PSA.71.3
reference: Psalms 71:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֱיֵ֤ה לִ֨/י לְ/צ֥וּר מָע֡וֹן לָ/ב֗וֹא תָּמִ֗יד צִוִּ֥יתָ לְ/הוֹשִׁיעֵ֑/נִי כִּֽי סַלְעִ֖/י וּ/מְצוּדָתִ֣/י אָֽתָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: id
  text: Jadilah bagiku gunung batu tempat berlindung[a], yang selalu dapat kudatangi; Engkau telah memerintahkan agar aku diselamatkan[b], sebab Engkaulah bukit batuku dan bentengku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung batu, tempat kediaman”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Engkau telah memerintahkan untuk menyelamatkan aku”; atau “Engkau telah menetapkan untuk menyelamatkan aku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה לִי
  choice: Jadilah bagiku
  rationale: Imperatif langsung mempertahankan bentuk permohonan kepada Allah, sedangkan “bagiku” menyatakan hubungan dan manfaat secara alami dalam bahasa Indonesia.
- source_word: לְצוּר מָעוֹן
  choice: gunung batu tempat berlindung
  rationale: צוּר mempertahankan metafora batu karang yang kokoh. מָעוֹן secara dasar berarti tempat tinggal atau kediaman, tetapi dalam rangkaian gambaran perlindungan ini berfungsi sebagai tempat berlindung; arti dasarnya dicatat dalam catatan kaki.
- source_word: לָבוֹא תָּמִיד
  choice: yang selalu dapat kudatangi
  rationale: Ungkapan ini menyampaikan tempat yang dapat terus-menerus didatangi pemazmur dengan susunan Indonesia yang wajar.
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: Engkau telah memerintahkan agar aku diselamatkan
  rationale: Terjemahan ini mempertahankan makna kuat צוה, “memerintahkan”, sambil mengungkapkan tujuan perintah itu dengan bahasa Indonesia yang alami. Bentuk Ibrani yang lebih harfiah dan kemungkinan “menetapkan” dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan yang mendasari permohonan pemazmur.
- source_word: סַלְעִי
  choice: bukit batuku
  rationale: סלע menunjuk pada batu besar, tebing, atau bukit batu. “Bukit batu” membedakannya dari צוּר sebelumnya tanpa menghilangkan gambaran perlindungan berbatu.
- source_word: וּמְצוּדָתִי
  choice: dan bentengku
  rationale: מְצוּדָה berarti benteng atau kubu pertahanan; “benteng” ringkas, jelas, dan kuat dalam bahasa Indonesia modern.
- source_word: אָתָּה
  choice: Engkaulah
  rationale: Partikel -lah mencerminkan penekanan dari kata ganti mandiri Ibrani tanpa membuat kalimat terasa kaku.
theological_decisions:
- issue: Apakah צִוִּיתָ לְהוֹשִׁיעֵנִי harus dilunakkan menjadi “Engkau telah menetapkan untuk menyelamatkan aku” atau tetap mempertahankan gagasan perintah ilahi
  choice: Engkau telah memerintahkan agar aku diselamatkan
  alternative: Engkau telah menetapkan untuk menyelamatkan aku
  rationale: Teks Ibrani secara eksplisit memakai verba “memerintahkan”. Mempertahankannya menjaga kekuatan ungkapan tentang tindakan berdaulat Allah tanpa menentukan kepada siapa perintah itu ditujukan atau memasukkan rumusan doktrinal yang lebih sempit.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Metafora batu dan benteng dipertahankan, sementara susunan kalimat dibuat alami dalam bahasa Indonesia. Kapitalisasi kata ganti yang merujuk kepada Allah mengikuti gaya umum teks Alkitab Indonesia.
