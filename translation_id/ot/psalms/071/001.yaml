source:
  edition: WLC
  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: id
  text: Pada-Mu, ya Yahweh,[a] aku berlindung; jangan sekali-kali biarkan aku dipermalukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani יהוה (YHWH), yang dalam banyak terjemahan ditulis “TUHAN”.
    reason: Menjelaskan bentuk nama ilahi dan padanan tradisional yang mungkin lebih dikenal pembaca Indonesia.
lexical_decisions:
- source_word: בְּךָ
  choice: Pada-Mu
  rationale: Preposisi ב dengan sufiks orang kedua tunggal menunjuk kepada Yahweh sebagai tempat perlindungan secara metaforis. “Pada-Mu” mempertahankan gambaran itu dan terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Teks Ibrani memakai nama ilahi יהוה, bukan gelar. “Yahweh” mempertahankan fungsi nama diri, sedangkan partikel vokatif “ya” sesuai dengan seruan langsung dalam doa.
- source_word: חָסִיתִי
  choice: aku berlindung
  rationale: Verba חסה berarti mencari atau mendapatkan perlindungan. Bentuk perfektifnya menyatakan tindakan atau kepercayaan yang telah ditetapkan dan tetap berlaku; bentuk Indonesia “aku berlindung” menyampaikan keadaan kini secara lebih alami daripada “aku telah berlindung” tanpa menghilangkan citra perlindungan.
- source_word: אַל אֵבוֹשָׁה
  choice: jangan biarkan aku dipermalukan
  rationale: אַל dengan bentuk orang pertama mengungkapkan permohonan negatif. “Dipermalukan” menyampaikan kemungkinan mengalami aib atau kegagalan di hadapan orang lain, bukan sekadar merasa malu secara batin.
- source_word: לְעוֹלָם
  choice: selamanya
  rationale: Dalam cakupan negasi permohonan ini, לְעוֹלָם berarti “untuk selama-lamanya”; “selamanya” merupakan padanan Indonesia yang ringkas dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Karena teks sumber secara langsung memakai Tetragramaton sebagai nama diri, “Yahweh” mempertahankan pembedaan antara nama ilahi dan gelar אֲדֹנָי. Catatan kaki membantu pembaca yang terbiasa dengan bentuk “TUHAN”.
- issue: Makna malu dalam permohonan pemazmur
  choice: dipermalukan
  alternative: merasa malu
  rationale: Dalam konteks mazmur kepercayaan, בושׁ dapat menunjuk pada jatuhnya kehormatan atau terbuktinya harapan sebagai sia-sia. Pilihan ini mempertahankan dimensi publik dan relasional tanpa menentukan secara khusus siapa pelakunya.
translation_notes:
  register: Bahasa doa dibuat ringkas, khidmat, dan mudah dipahami. Kapitalisasi pada “-Mu” mengikuti kebiasaan bahasa Indonesia ketika merujuk kepada Allah. Susunan klausa tetap dekat dengan puisi Ibrani tanpa terasa kaku.
