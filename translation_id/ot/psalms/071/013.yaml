source:
  edition: WLC
  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: id
  text: Biarlah orang-orang yang memusuhi hidupku[b] mendapat malu dan binasa[a]; biarlah orang-orang yang mengusahakan celakaku diselubungi celaan dan kehinaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “habis” atau “lenyap.”
    reason: lexical_alternative
  - marker: b
    text: Atau “jiwaku”; kata Ibrani di sini sering merujuk pada hidup atau diri seseorang, bukan secara khusus jiwa yang tidak berwujud.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: mendapat malu
  rationale: Bentuk imperfek dalam konteks doa ini menyatakan harapan atau permohonan. Frasa ini menyampaikan akibat berupa rasa malu dan dipermalukan tanpa mengubahnya menjadi ramalan biasa.
- source_word: יִכְלוּ
  choice: binasa
  rationale: Kata dari akar כלה dapat berarti habis, berakhir, atau musnah. 'Binasa' alami dalam konteks doa kutukan dan tetap cukup luas untuk tidak membatasi maknanya pada cara kehancuran tertentu.
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: orang-orang yang memusuhi hidupku
  rationale: Partisip dari שטן menunjuk pada orang yang bertindak sebagai lawan atau musuh. Dalam konteks ini נֶפֶשׁ terutama merujuk pada hidup atau diri pemazmur, bukan secara khusus jiwa yang tidak berwujud.
- source_word: יַעֲטוּ
  choice: diselubungi
  rationale: Kata kerja עטה menggambarkan tindakan membungkus atau mengenakan sesuatu. 'Diselubungi' mempertahankan metafora pakaian sambil terdengar wajar dengan 'celaan dan kehinaan'.
- source_word: חֶרְפָּה
  choice: celaan
  rationale: Pilihan ini mempertahankan unsur penghinaan atau aib di muka umum dan dapat dibedakan dari כְלִמָּה.
- source_word: וּכְלִמָּה
  choice: dan kehinaan
  rationale: '''Kehinaan'' menyampaikan rasa malu dan perendahan yang memperkuat kata sebelumnya tanpa pengulangan yang datar.'
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: orang-orang yang menginginkan celakaku
  rationale: Ungkapan ini menyatakan niat aktif untuk mendatangkan keburukan kepada pemazmur. 'Menginginkan celakaku' ringkas, alami, dan mempertahankan maksud bermusuhan itu.
theological_decisions:
- issue: Daya jusif atau kutukan dalam doa
  choice: Menerjemahkan rangkaian verba dengan 'Biarlah ...', sebagai harapan atau permohonan langsung.
  alternative: 'Menerjemahkannya sebagai ramalan masa depan: ''Orang-orang ... akan mendapat malu dan binasa.'''
  rationale: Dalam konteks puisi-doa ini, bentuk-bentuk imperfek paling wajar dipahami memiliki daya jusif atau imprekatoris. Terjemahan ini mempertahankan permohonan pemazmur tanpa menjadikannya sekadar ramalan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Struktur paralel ayat dan metafora diselubungi aib dipertahankan; istilah dibuat mudah dipahami tanpa menghilangkan ketegangan imprekatoris teks.
