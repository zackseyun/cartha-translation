  text: May you increase my greatness and comfort me again[a][b][c].
translation:
  language: id
  text: Kiranya Engkau menambah kebesaranku dan kembali menghibur aku[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau akan menambah kebesaranku dan akan berbalik untuk menghibur aku.” Bentuk-bentuk imperfek Ibrani dapat dipahami sebagai pernyataan tentang masa depan ataupun sebagai harapan atau doa dalam konteks puisi.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “kebesaranku”; kata ini juga dapat menunjuk pada kehormatan atau martabat, bukan hanya ukuran atau tingkat kebesaran.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dan berbalik”; maksudnya kemungkinan ialah berbalik atau kembali kepada pemazmur untuk menghiburnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: Kiranya Engkau menambah
  rationale: Bentuk Hifil dari רבה berarti ‘membuat besar’ atau ‘menambah’. Dalam konteks doa puitis, bentuk imperfek orang kedua dapat menyatakan harapan atau permohonan; ‘kiranya’ menyampaikan nuansa itu secara alami dalam bahasa Indonesia.
- source_word: גְּדֻלָּתִי
  choice: kebesaranku
  rationale: Kata גְּדוּלָּה dapat menunjuk pada kebesaran, kedudukan, kehormatan, atau martabat. ‘Kebesaranku’ paling langsung dan mempertahankan hubungan leksikal dengan tindakan membuat besar, tanpa mempersempit maknanya.
- source_word: וְתִסֹּב
  choice: dan kembali
  rationale: Kata kerja סבב secara harfiah berarti ‘berbalik’ atau ‘berputar’. Bersama kata kerja berikutnya, ungkapan ini kemungkinan berarti berbalik atau kembali kepada pemazmur untuk menghiburnya; ‘kembali’ menyampaikan idiom itu secara wajar.
- source_word: תְּנַחֲמֵנִי
  choice: menghibur aku
  rationale: Bentuk Piel dari נחם di sini berarti ‘menghibur’ atau ‘memberi penghiburan’. ‘Menghibur aku’ jelas, alami, dan tetap bernada luhur.
theological_decisions:
- issue: Nuansa modal dari kedua bentuk imperfek
  choice: 'Diterjemahkan sebagai doa atau harapan: ‘Kiranya Engkau menambah ... dan kembali menghibur aku.’'
  alternative: 'Pernyataan keyakinan tentang masa depan: ‘Engkau akan menambah ... dan akan kembali menghibur aku.’'
  rationale: Dalam puisi Ibrani, bentuk imperfek dapat berfungsi sebagai pernyataan masa depan maupun sebagai harapan atau permohonan. Konteks sapaan dan doa mendukung ‘kiranya’, tetapi kemungkinan pembacaan sebagai keyakinan akan masa depan tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. Kapitalisasi ‘Engkau’ dipakai sebagai bentuk sapaan hormat kepada Allah. Susunan kalimat mempertahankan paralelisme ringkas teks Ibrani, sedangkan ‘kembali’ mengungkapkan idiom וְתִסֹּב secara alami tanpa menghilangkan citra ‘berbalik’, yang dijelaskan dalam catatan kaki.
