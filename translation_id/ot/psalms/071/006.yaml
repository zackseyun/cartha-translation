  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: id
  text: Kepada-Mu aku bersandar sejak dari kandungan; dari dalam tubuh ibuku, Engkaulah yang mengeluarkan aku.[a] Pujianku senantiasa tertuju kepada-Mu.
