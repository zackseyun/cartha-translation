    text: Atau, secara lebih luwes, “dari rahim ibuku, Engkaulah yang mengeluarkan aku.” Bahasa Ibrani memakai istilah yang berbeda dari kata yang diterjemahkan “kandungan” pada frasa sebelumnya; secara harfiah, “dari bagian dalam tubuh ibuku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  choice: Kepada-Mu aku bersandar
  rationale: Ungkapan ini mempertahankan gambaran konkret tentang bersandar kepada Allah sebagai tumpuan, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: מִבֶּטֶן
  choice: sejak dalam kandungan
  rationale: בטן menunjuk pada perut atau kandungan; dalam konteks ini, frasa tersebut menyatakan ketergantungan yang telah berlangsung sejak masa dalam kandungan.
- source_word: מִמְּעֵי אִמִּי
  choice: dari dalam tubuh ibuku
  rationale: מֵעֶה secara harfiah menunjuk pada bagian dalam tubuh. Pilihan ini mempertahankan perbedaan kosakata dengan בטן pada frasa sebelumnya tanpa memakai ungkapan Indonesia yang terlalu anatomis.
- source_word: אַתָּה גוֹזִי
  choice: Engkaulah yang mengeluarkan aku
  rationale: Kata ganti mandiri אַתָּה memberi penekanan, yang disampaikan dengan 'Engkaulah'. Partisip גוֹזִי dipahami dalam konteks kelahiran sebagai tindakan mengeluarkan atau membawa keluar dari tubuh ibu.
- source_word: בְּךָ תְהִלָּתִי תָמִיד
  choice: Pujianku senantiasa tertuju kepada-Mu
  rationale: Terjemahan ini mempertahankan nomina 'pujianku' dan gagasan bahwa Allah adalah arah atau sasaran pujian, sambil menghasilkan susunan yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Peran Allah dalam gambaran kelahiran
  choice: Allah digambarkan sebagai Dia yang mengeluarkan pemazmur dari tubuh ibunya.
  alternative: Allah dipahami terutama sebagai penopang pemazmur sejak kelahirannya, tanpa penekanan khusus pada tindakan mengeluarkannya.
  rationale: Konteks dan bentuk ungkapan Ibrani secara alami mengaitkan tindakan Allah dengan keluarnya pemazmur saat lahir. Terjemahan mempertahankan gambaran pemeliharaan ilahi ini tanpa menambahkan rumusan doktrinal di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina ilahi mengikuti konvensi umum Alkitab bahasa Indonesia. Struktur ayat mempertahankan metafora bersandar, penekanan pada 'Engkaulah', dan variasi kosakata Ibrani tentang kandungan atau bagian dalam tubuh.
