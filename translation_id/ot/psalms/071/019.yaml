  text: וְ/צִדְקָתְ/ךָ֥ אֱלֹהִ֗ים עַד מָ֫ר֥וֹם אֲשֶׁר עָשִׂ֥יתָ גְדֹל֑וֹת אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: id
  text: Keadilan-Mu[a], ya Allah, menjangkau hingga ke ketinggian[b]—Engkau yang telah melakukan hal-hal besar. Ya Allah, siapakah yang seperti Engkau?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebenaran-Mu.” Kata Ibrani צְדָקָה dapat menyatakan keadilan atau kebenaran moral, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “sampai ke surga.” Ungkapan Ibraninya secara harfiah berarti “hingga ke ketinggian/tempat tinggi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִדְקָתְךָ
  choice: Kebenaran-Mu
  rationale: צְדָקָה di sini menunjuk secara luas pada kelurusan moral Allah yang tampak dalam karya-karya-Nya. “Keadilan-Mu” tetap mungkin, tetapi lebih sempit dan dicatat sebagai alternatif.
- source_word: אֱלֹהִים
  choice: ya Allah
  rationale: Kedua kemunculannya berfungsi sebagai sapaan langsung. Partikel “ya” menyatakan bentuk vokatif secara alami dalam bahasa Indonesia yang dignified.
- source_word: עַד מָרוֹם
  choice: mencapai tempat yang tinggi
  rationale: Ungkapan ini secara harfiah menyatakan jangkauan “sampai ke ketinggian/tempat tinggi.” Terjemahan ini mempertahankan metafora ruang tanpa memastikan bahwa מָרוֹם secara khusus berarti surga.
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: Engkau yang telah melakukan perkara-perkara besar
  rationale: אֲשֶׁר dipertahankan sebagai penghubung klausa relatif, sedangkan גְדֹלוֹת yang dipakai secara substantival diterjemahkan luas sebagai “perkara-perkara besar,” mencakup tindakan-tindakan Allah.
- source_word: מִי כָמוֹךָ
  choice: siapakah yang seperti Engkau?
  rationale: Pertanyaan retoris ini menyatakan bahwa Allah tidak tertandingi, sekaligus mempertahankan bentuk langsung dan puitis teks Ibrani.
theological_decisions:
- issue: Makna צְדָקָה sebagai sifat Allah
  choice: kebenaran
  alternative: keadilan
  rationale: Konteks pujian atas sifat dan karya besar Allah mendukung pengertian luas tentang kelurusan moral-Nya. Karena istilah Ibrani juga dapat menonjolkan keadilan, alternatif itu tidak dihapus, melainkan dicatat dalam catatan kaki.
- issue: Rujukan מָרוֹם
  choice: tempat yang tinggi
  alternative: surga
  rationale: Teks menyebut “ketinggian/tempat tinggi” dan tidak harus secara khusus menunjuk kepada surga. Terjemahan utama mempertahankan keluasan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Sapaan “ya Allah” dan pronomina ilahi berhuruf kapital mempertahankan kejelasan serta keluhuran tanpa memakai bentuk arkais. Tanda pisah menandai klausa relatif puitis tanpa mengubah hubungan sintaksis dasarnya.
