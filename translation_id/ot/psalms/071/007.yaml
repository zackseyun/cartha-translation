  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: id
  text: Aku telah menjadi seperti pertanda bagi banyak orang[a], tetapi Engkau adalah perlindunganku yang kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu keajaiban,” “suatu tanda,” atau “sesuatu yang mengherankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: seperti pertanda
  rationale: מוֹפֵת dapat berarti tanda, keajaiban, atau pertanda. 'Seperti pertanda' mempertahankan unsur sesuatu yang mencolok dan mengherankan tanpa memastikan apakah maknanya positif atau buruk; prefiks כְּ diterjemahkan 'seperti'.
- source_word: הָיִיתִי
  choice: Aku telah menjadi
  rationale: Bentuk qatal orang pertama tunggal dari היה menyatakan keadaan yang telah terjadi dan masih relevan dalam situasi pemazmur.
- source_word: לְרַבִּים
  choice: bagi banyak orang
  rationale: Gabungan לְ dan רַבִּים menunjuk kepada banyak orang yang memandang pemazmur sebagai pertanda; 'bagi banyak orang' alami dalam bahasa Indonesia.
- source_word: מַחֲסִי
  choice: tempat perlindunganku
  rationale: מַחֲסֶה menunjuk pada perlindungan atau tempat berlindung. Pilihan ini mempertahankan metafora Allah sebagai tempat aman.
- source_word: עֹז
  choice: yang kuat
  rationale: עֹז berarti kekuatan atau keperkasaan. Frasa Ibrani yang harfiah berarti 'tempat perlindunganku yang berkekuatan' diungkapkan secara alami sebagai 'tempat perlindunganku yang kuat'.
theological_decisions:
- issue: Nuansa מוֹפֵת dalam keadaan pemazmur di hadapan orang banyak
  choice: Pemazmur digambarkan sebagai pertanda yang luar biasa dan mencengangkan bagi banyak orang, tanpa memastikan apakah pertanda itu bersifat mengagumkan, buruk, atau sekadar menimbulkan keheranan.
  alternative: Pemazmur dipandang secara khusus sebagai keajaiban positif, peringatan buruk, atau hanya sebagai objek keheranan.
  rationale: Rentang makna kata Ibrani tidak menentukan sifat reaksi orang banyak. Teks utama dan catatan kaki mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi 'Engkau' dipakai sebagai sapaan kepada Allah. Susunan kontras dengan 'tetapi' dipertahankan, dan semua penanda catatan kaki tercantum dalam teks utama.
