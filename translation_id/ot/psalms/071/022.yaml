  text: גַּם אֲנִ֤י אוֹדְ/ךָ֣ בִ/כְלִי נֶבֶל֮ אֲמִתְּ/ךָ֪ אֱלֹ֫הָ֥/י אֲזַמְּרָ֣ה לְ/ךָ֣ בְ/כִנּ֑וֹר קְ֝ד֗וֹשׁ יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: id
  text: Aku pun akan memuji-Mu dengan harpa karena kesetiaan-Mu[a], ya Allahku; aku akan bermazmur bagi-Mu dengan kecapi[b], ya Yang Kudus dari Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kebenaran-Mu.” Kata Ibrani ini dapat berarti kebenaran maupun kesetiaan.'
    reason: lexical_alternative
  - marker: b
    text: Pembedaan tepat antara kedua alat musik yang disebutkan di sini (nevel dan kinnor) tidak pasti. “Harpa” dan “kecapi” adalah sebutan tradisional.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Aku pun
  rationale: Menjaga penekanan dan kesinambungan yang dinyatakan oleh גַּם bersama pronomina mandiri, sekaligus terdengar alami dalam puisi Indonesia.
- source_word: אוֹדְךָ
  choice: akan memuji Engkau
  rationale: Dalam konteks ibadah musikal, bentuk ini secara wajar berarti memuji atau mengucap syukur; 'memuji' selaras dengan baris paralelnya.
- source_word: בִכְלִי נֶבֶל
  choice: dengan kecapi
  rationale: כְּלִי adalah istilah umum untuk alat, lalu diperinci oleh נֶבֶל. 'Kecapi' merupakan padanan tradisional yang mudah dipahami, sementara ketidakpastian identifikasi alat dicatat dalam catatan kaki.
- source_word: אֲמִתְּךָ
  choice: karena kesetiaan-Mu
  rationale: אֱמֶת dapat berarti kebenaran maupun kesetiaan. Di sini 'kesetiaan' secara alami menyatakan sifat Allah yang menjadi alasan pujian; kemungkinan 'kebenaran' tetap dipertahankan dalam catatan kaki.
- source_word: אֱלֹהָי
  choice: ya Allahku
  rationale: Menerjemahkan bentuk posesif dan memperjelas fungsi sapaan tanpa menambah isi teologis.
- source_word: אֲזַמְּרָה לְךָ
  choice: aku akan bermazmur bagi-Mu
  rationale: זמר dalam konteks Mazmur menunjuk pada nyanyian atau permainan musik pujian. 'Bermazmur' ringkas, bermartabat, dan cocok dengan penyebutan alat musik.
- source_word: בְכִנּוֹר
  choice: dengan kecapi kecil
  rationale: כִּנּוֹר menunjuk alat petik yang berbeda dari נֶבֶל. 'Kecapi kecil' mempertahankan perbedaan istilah secara tentatif; identifikasi tepat kedua alat tetap tidak pasti.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: ya Yang Kudus dari Israel
  rationale: Mempertahankan gelar ilahi dan mengungkapkan fungsi vokatifnya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna אֱמֶת sebagai sifat Allah dalam konteks pujian
  choice: kesetiaan
  alternative: kebenaran
  rationale: '''Kesetiaan'' menonjolkan keterandalan Allah dalam konteks karya penyelamatan yang dipuji, tetapi istilah Ibrani juga benar-benar dapat berarti ''kebenaran''; alternatif itu dicatat agar ketegangan leksikal tidak dihilangkan.'
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Pronomina ilahi memakai bentuk sapaan langsung dengan huruf kapital. Istilah 'kecapi' dan 'kecapi kecil' dipakai sebagai padanan fungsional, disertai catatan tentang ketidakpastian alat kuno.
