id: PSA.71.20
reference: Psalms 71:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: id
  text: Engkau yang telah membuat kami mengalami[a] banyak kesesakan dan malapetaka[b] akan kembali menghidupkan kami[c]; dari kedalaman bumi[d] Engkau akan kembali mengangkat aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah membuat kami melihat”; ungkapan ini berarti membuat seseorang mengalami sesuatu. Dapat juga diterjemahkan, “telah memperlihatkan kepada kami.”
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “malapetaka” juga dapat berarti “hal-hal buruk” atau “bencana”; di sini yang dimaksud ialah penderitaan, bukan kejahatan moral.
    reason: lexical_alternative
  - marker: c
    text: 'Teks Ibrani beralih dari bentuk jamak “kami” ke bentuk tunggal “aku”: “menghidupkan kami ... mengangkat aku.”'
    reason: textual_note
  - marker: d
    text: “Kedalaman bumi” dapat menjadi gambaran tentang kehinaan yang ekstrem atau keadaan mendekati maut, dan mungkin juga menggemakan gambaran turun ke kubur.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Memperkenalkan klausa relatif yang merujuk kepada Allah; bentuk ini alami dalam bahasa Indonesia.
- source_word: הראיתנו
  choice: telah membuat kami mengalami
  rationale: Bentuk kausatif dari ראה secara harfiah berarti 'telah membuat kami melihat'. Dalam konteks penderitaan, 'mengalami' menyampaikan idiom Ibrani secara alami sambil mempertahankan unsur kausatif melalui 'membuat'.
- source_word: צָרוֹת רַבּוֹת
  choice: banyak kesesakan
  rationale: 'צָרוֹת menunjuk pada keadaan terjepit, penderitaan, atau kesukaran, sedangkan רַבּוֹת paling wajar menyatakan jumlah: ''banyak''.'
- source_word: וְרָעוֹת
  choice: dan malapetaka
  rationale: Dalam konteks ini רָעוֹת menunjuk pada pengalaman buruk atau bencana, bukan kejahatan moral. 'Malapetaka' mempertahankan beratnya penderitaan tanpa memberi kesan bahwa Allah melakukan kejahatan moral.
- source_word: תָּשׁוּב
  choice: akan kembali
  rationale: שוב muncul dua kali. Terjemahan yang sama pada kedua kemunculan mempertahankan pengulangan dan susunan puitis teks Ibrani.
- source_word: תְּחַיֵּנוּ
  choice: menghidupkan kami
  rationale: Bentuk intensif/kausatif חיה menyatakan pemulihan hidup atau daya hidup. 'Menghidupkan kami' ringkas dan tetap membuka apakah yang dimaksud pemulihan dari penderitaan atau dari keadaan yang menyerupai kematian.
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  choice: dari kedalaman bumi
  rationale: Mempertahankan citra ruang dalam bahasa Ibrani tanpa mengubahnya secara eksplisit menjadi 'kubur' atau kebangkitan tubuh.
- source_word: תַּעֲלֵנִי
  choice: mengangkat aku
  rationale: Bentuk kausatif עלה berarti membuat seseorang naik. 'Mengangkat aku' alami dalam bahasa Indonesia dan sesuai dengan gerak naik dari kedalaman bumi.
- source_word: נו ... ני
  choice: kami ... aku
  rationale: Teks Masoret beralih dari orang pertama jamak ke orang pertama tunggal. Peralihan ini dipertahankan dan tidak diseragamkan.
theological_decisions:
- issue: Apakah רָעוֹת berarti kejahatan moral atau malapetaka yang dialami
  choice: malapetaka yang dialami
  alternative: kejahatan; hal-hal buruk; bencana
  rationale: Konteks membicarakan penderitaan yang dialami pemazmur, bukan kejahatan moral yang dilakukan Allah. Pilihan ini menjaga makna kontekstual tanpa meniadakan peran kausatif yang dinyatakan oleh verba sebelumnya.
- issue: Apakah 'kedalaman bumi' harus dijadikan bahasa kebangkitan secara eksplisit
  choice: mempertahankan metafora 'kedalaman bumi'
  alternative: dari kubur Engkau akan membangkitkan aku; Engkau akan membangkitkan aku dari kematian
  rationale: Gambaran Ibrani dapat menunjuk pada penghinaan yang amat dalam, keadaan mendekati maut, atau gema dunia orang mati. Teks utama tidak mempersempitnya menjadi satu penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa relatif dipertahankan, pengulangan “akan kembali” mengikuti puisi Ibrani, dan peralihan “kami” ke “aku” dibiarkan tampak. Istilah teknis serta penafsiran kebangkitan yang terlalu spesifik dihindari dalam teks utama.
