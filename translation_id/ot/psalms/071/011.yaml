  text: saying[a], “God has forsaken him; pursue and seize him, for there is no one to rescue him.”
translation:
  language: id
  text: sambil berkata, “Allah telah meninggalkan dia[a]. Kejarlah dan tangkaplah dia, sebab tidak ada seorang pun yang menyelamatkannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menelantarkan dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: sambil berkata
  rationale: Bentuk infinitif dari אמר memperkenalkan ucapan langsung dan bergantung pada konteks ayat sebelumnya. “Sambil berkata” alami dalam bahasa Indonesia serta mempertahankan kesinambungan sintaksis itu tanpa menambahkan subjek yang tidak dinyatakan dalam ayat ini.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, verba tunggal עֲזָבוֹ menunjukkan bahwa ini adalah gelar bagi Allah yang esa.
- source_word: עֲזָבוֹ
  choice: telah meninggalkan dia
  rationale: Verba Qal perfektum dengan sufiks orang ketiga maskulin tunggal menyatakan tindakan yang dianggap telah terjadi dan masih relevan. “Telah meninggalkan dia” jelas, wajar, dan tetap memuat bobot ratapan tanpa memastikan bahwa ejekan musuh itu benar.
- source_word: רִדְפוּ
  choice: kejarlah
  rationale: Imperatif jamak dari רדף memerintahkan pengejaran terhadap orang yang dianggap tidak lagi terlindungi. “Kejarlah” langsung dan idiomatis.
- source_word: וְתִפְשׂוּהוּ
  choice: dan tangkaplah dia
  rationale: Imperatif jamak dari תפשׂ dengan sufiks orang ketiga maskulin tunggal berarti memegang, menangkap, atau menyergap. “Tangkaplah dia” paling alami dalam rangkaian perintah pengejaran ini.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya; “sebab” ringkas dan sesuai dengan ragam bahasa Kitab Suci yang modern serta bermartabat.
- source_word: אֵין מַצִּיל
  choice: tidak ada yang akan menyelamatkannya
  rationale: אֵין menyatakan ketiadaan, sedangkan מַצִּיל adalah partisip Hifil yang menunjuk kepada orang yang melepaskan atau menyelamatkan. Susunan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa tidak ada seorang pun yang bertindak sebagai penyelamat.
theological_decisions:
- issue: Pernyataan musuh bahwa Allah telah meninggalkan pemazmur
  choice: Allah telah meninggalkan dia
  alternative: Allah telah menelantarkan dia
  rationale: Ayat ini mengutip perkataan para musuh, bukan menegaskan penilaian teologis narator. Terjemahan tersebut mempertahankan kerasnya ejekan dan ketegangan ratapan tanpa menyimpulkan bahwa Allah benar-benar meninggalkan orang yang menderita.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “sambil berkata” mempertahankan hubungan ayat ini dengan konteks sebelumnya; imperatif jamak Ibrani diterjemahkan dengan bentuk perintah yang alami tanpa menambahkan penanda jamak yang tidak diperlukan dalam bahasa Indonesia.
