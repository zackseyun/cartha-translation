  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: id
  text: Mulutku akan menuturkan keadilan-Mu[a] dan keselamatan-Mu sepanjang hari, sebab aku tidak mengetahui jumlahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebenaran-Mu” atau “perbuatan-perbuatan-Mu yang benar.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, keadilan dan keselamatan Allah, terutama tindakan-Nya yang adil dan menyelamatkan, terlalu banyak untuk dihitung.
    reason: clarification
lexical_decisions:
- source_word: פִּי
  choice: Mulutku
  rationale: Mempertahankan gambaran harfiah bahasa Ibrani yang menonjolkan mulut sebagai alat untuk menyampaikan pujian, alih-alih melicinkannya menjadi “aku”.
- source_word: יְסַפֵּר
  choice: akan menuturkan
  rationale: Bentuk piel dari ספר di sini menyatakan tindakan menceritakan atau menguraikan. “Menuturkan” alami, bermartabat, dan tetap berhubungan secara konseptual dengan penyebutan jumlah pada akhir ayat.
- source_word: צִדְקָתֶךָ
  choice: kebenaran-Mu
  rationale: Mempertahankan nomina abstrak tunggal dan cakupan makna צדקה yang meliputi kelurusan, keadilan, serta tindakan Allah yang benar dan setia. Kemungkinan makna yang lebih konkret dicatat dalam catatan kaki.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan Indonesia modern dan wajar untuk durasi yang terus berlangsung.
- source_word: תְּשׁוּעָתֶךָ
  choice: keselamatan-Mu
  rationale: Padanan baku yang mempertahankan cakupan luas tindakan Allah dalam menyelamatkan; “pembebasan-Mu” dimungkinkan tetapi lebih sempit.
- source_word: כִּי
  choice: sebab
  rationale: Menyatakan hubungan kausal dengan klausa sebelumnya secara jelas dan alami.
- source_word: לֹא יָדַעְתִּי
  choice: aku tidak mengetahui
  rationale: 'Walaupun verba Ibraninya berbentuk perfektif, konteks menyatakan keadaan penutur kini: ia tidak mengetahui atau tidak mampu menetapkan jumlahnya.'
- source_word: סְפֹרוֹת
  choice: jumlahnya
  rationale: Nomina jamak dari akar ספר menunjuk pada hitungan atau bilangan. Dalam konteks, ungkapan ini menyatakan bahwa karya-karya Allah yang benar dan menyelamatkan terlalu banyak untuk dihitung.
theological_decisions:
- issue: Apakah צִדְקָתֶךָ menunjuk pada sifat abstrak Allah atau tindakan-Nya yang benar dan adil.
  choice: kebenaran-Mu dalam teks utama
  alternative: keadilan-Mu; perbuatan-perbuatan-Mu yang benar
  rationale: Nomina Ibrani berbentuk abstrak tunggal, sehingga bentuk abstrak dipertahankan. Namun, dalam Mazmur istilah ini dapat mencakup tindakan Allah yang adil, setia, dan menyelamatkan; keluasan itu tidak dipersempit dalam teks utama dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami dengan menghubungkan kedua objek memakai “dan”, sementara gambaran “Mulutku” serta ketegangan makna antara kebenaran, keadilan, dan tindakan benar tetap dipertahankan.
