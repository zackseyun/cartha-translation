  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Paralelisme Ibrani dipertahankan melalui “tangan” dan “cengkeraman”, sementara dua partisip terakhir dipahami sebagai gambaran tentang satu jenis pelaku yang bertindak tidak adil dan keras.
