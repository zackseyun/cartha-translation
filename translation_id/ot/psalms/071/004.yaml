base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/004.yaml
  text: My God[a], rescue me from the hand of the wicked[c][b], from the grasp of the unjust and violent man.
translation:
  language: id
  text: Ya Allahku, luputkanlah aku dari tangan orang fasik, dari cengkeraman orang yang lalim dan ganas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang berlaku tidak adil dan kejam” atau “orang yang tidak adil dan menindas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Ya Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal merupakan sapaan langsung, yang secara alami dinyatakan dengan “Ya Allahku” dalam bahasa Indonesia.
- source_word: פַּלְּטֵנִי
  choice: luputkanlah aku
  rationale: Bentuk permohonan dari פלט meminta pembebasan atau penyelamatan dari bahaya; “luputkanlah aku” mempertahankan nuansa dilepaskan dari kuasa lawan.
- source_word: מִיַּד רָשָׁע
  choice: dari tangan orang fasik
  rationale: “Tangan” mempertahankan gambaran Ibrani tentang kuasa atau kendali, sedangkan רָשָׁע menunjuk kepada seorang yang jahat secara moral.
- source_word: מִכַּף
  choice: dari cengkeraman
  rationale: כף secara harfiah berarti “telapak tangan”, tetapi dalam konteks ini menyatakan genggaman atau kendali; “cengkeraman” menyampaikan idiom tersebut secara alami.
- source_word: מְעַוֵּל
  choice: orang yang berbuat tidak adil
  rationale: Partisip ini menggambarkan orang yang bertindak curang, salah, atau tidak adil; bentuk verbal Indonesia mempertahankan sifat aktifnya.
- source_word: וְחוֹמֵץ
  choice: dan melakukan kekerasan
  rationale: Kata ini menggambarkan orang yang bertindak keras, menindas, atau melakukan kekerasan. Frasa ini mempertahankan unsur tindakan tanpa membatasi maknanya pada sifat batin seperti “kejam”.
