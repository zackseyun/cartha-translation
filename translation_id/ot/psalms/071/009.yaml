  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַֽל תַּ֭שְׁלִיכֵ/נִי לְ/עֵ֣ת זִקְנָ֑ה כִּ/כְל֥וֹת כֹּ֝חִ֗/י אַֽל תַּעַזְבֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
translation:
  language: id
  text: Jangan buang aku pada masa tuaku[a]; ketika kekuatanku habis[b], jangan tinggalkan aku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tolak aku.” Kata Ibrani ini dapat menggambarkan tindakan membuang atau menyingkirkan seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau “ketika kekuatanku terkuras.”
    reason: lexical_alternative
  - marker: c
    text: Atau “jangan telantarkan aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: buang aku
  rationale: Bentuk Hifil dari שׁלך menggambarkan tindakan melemparkan atau membuang. Dalam konteks permohonan ini, “buang aku” alami dalam bahasa Indonesia dan mempertahankan gambaran tentang seseorang yang disingkirkan.
- source_word: לְעֵת זִקְנָה
  choice: pada masa tuaku
  rationale: עֵת menunjuk pada waktu atau masa, sedangkan זִקְנָה berarti usia tua. “Pada masa tuaku” mempertahankan unsur waktu dan menyatakan hubungan orang pertama secara alami.
- source_word: כִּכְלוֹת
  choice: ketika ... habis
  rationale: Infinitif konstruk כלה dengan כִּ menyatakan keadaan temporal, yakni ketika sesuatu mencapai akhirnya atau terkuras. “Ketika ... habis” ringkas dan sesuai dengan gambaran kekuatan yang menipis.
- source_word: כֹּחִי
  choice: kekuatanku
  rationale: כֹּחַ berarti kekuatan, daya, atau tenaga. Dalam konteks usia tua, “kekuatanku” merupakan padanan yang luas dan wajar.
- source_word: תַּעַזְבֵנִי
  choice: jangan tinggalkan aku
  rationale: עזב dapat berarti meninggalkan atau menelantarkan. “Jangan tinggalkan aku” jelas, bermartabat, dan mempertahankan permohonan akan kehadiran Allah tanpa menambahkan gagasan di luar teks.
- source_word: אַל
  choice: jangan
  rationale: אַל dengan bentuk imperfek menyatakan larangan atau permohonan negatif yang mendesak. “Jangan” adalah padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Sifat permohonan sehubungan dengan usia tua dan kehadiran Allah
  choice: Permohonan langsung agar Allah tidak membuang atau meninggalkan pemazmur ketika kekuatannya habis pada masa tua
  alternative: Keluhan umum tentang penderitaan tanpa penekanan khusus pada usia tua
  rationale: Ayat ini secara eksplisit menghubungkan permohonan dengan masa tua dan habisnya kekuatan. Terjemahan mempertahankan ketergantungan konkret kepada Allah tanpa memasukkan klaim doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang langsung dan bermartabat. Paralelisme dua permohonan negatif dipertahankan, sementara ungkapan temporal dibuat alami bagi pembaca umum.
