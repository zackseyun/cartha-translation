  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: id
  text: Dalam kebenaran-Mu, bebaskanlah aku dan luputkanlah aku.[a] Condongkanlah telinga-Mu kepadaku dan selamatkanlah aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dengan kebenaran-Mu”; “kebenaran” juga dapat dipahami sebagai “keadilan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: Dalam kebenaran-Mu
  rationale: Preposisi ב dapat menunjukkan lingkup atau dasar ('dalam') maupun sarana ('oleh/dengan'). 'Dalam kebenaran-Mu' mempertahankan ungkapan Ibrani yang ringkas dan seruan kepada sifat Allah yang benar; kemungkinan instrumental dan arti 'keadilan' dicatat dalam catatan kaki.
- source_word: תַּצִּילֵנִי
  choice: bebaskanlah aku
  rationale: Bentuk Hifil dari נצל berarti membebaskan atau menyelamatkan dari bahaya. 'Bebaskanlah' alami dalam permohonan ini dan membantu membedakannya dari verba penutup ישׁע.
- source_word: וּתְפַלְּטֵנִי
  choice: dan luputkanlah aku
  rationale: Bentuk Piel dari פלט menyatakan tindakan membuat seseorang lolos atau membawanya keluar dari bahaya. 'Luputkanlah aku' mempertahankan nuansa lolos sekaligus paralelisme dengan verba sebelumnya.
- source_word: הַטֵּה
  choice: Sendengkanlah
  rationale: Imperatif נטה bersama 'telinga' merupakan metafora untuk memberi perhatian dan mendengarkan. 'Sendengkanlah telinga-Mu' mempertahankan gambaran konkret dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: אָזְנְךָ
  choice: telinga-Mu
  rationale: Nomina konkret 'telinga' dipertahankan karena merupakan citraan puitis yang jelas, bukan diganti dengan gagasan abstrak seperti 'pendengaran'.
- source_word: וְהוֹשִׁיעֵנִי
  choice: dan selamatkanlah aku
  rationale: Bentuk Hifil dari ישׁע lazim berarti 'menyelamatkan'. Pilihan ini mempertahankan keluasan maknanya serta membedakannya secara leksikal dari dua verba pembebasan sebelumnya.
theological_decisions:
- issue: Makna צְדָקָה dalam permohonan kepada Allah
  choice: kebenaran
  alternative: keadilan; dengan/oleh kebenaran-Mu
  rationale: '''Kebenaran'' mencakup kelurusan dan kesetiaan sifat Allah tanpa mempersempitnya menjadi tindakan pengadilan saja. Karena צְדָקָה juga dapat berarti ''keadilan'' dan ב dapat dipahami secara instrumental, kedua kemungkinan itu dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan bermartabat. Bentuk permohonan dengan -lah mempertahankan nada doa; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
