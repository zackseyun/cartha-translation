translation:
  language: id
  text: Mulutku akan dipenuhi dengan pujian kepada-Mu[a], dengan keagungan-Mu[b] sepanjang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mulutku dipenuhi dengan pujian kepada-Mu,” atau mungkin “Biarlah mulutku dipenuhi dengan pujian kepada-Mu.” Bentuk imperfek Ibrani dalam konteks puisi dapat bernuansa masa depan, keadaan kini, atau permohonan.
    reason: alternative_reading
  - marker: b
