lexical_decisions:
- source_word: יִמָּלֵא
  choice: akan dipenuhi
  rationale: Bentuk Nifal imperfek dari מלא dipertahankan sebagai pasif dengan nuansa waktu mendatang atau hasil yang berkelanjutan; konteks puisi juga memungkinkan nuansa kini atau permohonan, yang dicatat dalam catatan kaki.
- source_word: פִי
  choice: mulutku
  rationale: Terjemahan langsung dan wajar untuk ungkapan tentang perkataan atau pujian, tanpa memparafrasakannya menjadi “aku” atau “ucapanku”.
- source_word: תְּהִלָּתֶךָ
  choice: puji-pujian kepada-Mu
  rationale: Konstruksi dengan akhiran orang kedua tunggal menunjuk pada pujian yang ditujukan kepada atau menyatakan kebesaran Allah. Bentuk “puji-pujian kepada-Mu” lebih jelas dan alami dalam bahasa Indonesia daripada “pujian-Mu”, yang dapat disalahpahami sebagai pujian yang berasal dari Allah.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan Indonesia yang alami dan mempertahankan makna duratif dari frasa Ibrani.
- source_word: תִּפְאַרְתֶּךָ
  choice: semarak-Mu
  rationale: “Semarak” mengungkapkan kilau, keindahan, dan keagungan yang terkandung dalam תפארת, serta menjaga kesejajaran puitis tanpa langsung menyamakannya dengan istilah “kemuliaan” yang lebih luas.
