  text: כִּֽי אַתָּ֥ה תִקְוָתִ֑/י אֲדֹנָ֥/י יְ֝הוִ֗ה מִבְטַחִ֥/י מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/005.yaml
  text: For you are my hope[a], Lord Yahweh[c][b], my confidence from my youth.
translation:
  language: id
  text: Sebab Engkaulah harapanku, ya Tuhan YAHWEH, kepercayaanku sejak masa mudaku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi permohonan dalam konteks mazmur; “Sebab” mempertahankan daya kausal atau penjelasnya.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Pronomina orang kedua tunggal dinyatakan secara eksplisit dan bersifat menegaskan; bentuk “Engkaulah” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: תִקְוָתִי
  choice: harapanku
  rationale: Nomina ini berarti harapan atau pengharapan; “harapanku” alami dan jelas dalam konteks doa.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  rationale: Menerjemahkan gelar אֲדֹנָי sebagai “Tuhan” dan mempertahankan nama ilahi יְהוָה sebagai “YAHWEH”, sehingga kedua unsur Ibrani tetap terlihat tanpa menghasilkan ungkapan rancu “Tuhan TUHAN”.
- source_word: מִבְטַחִי
  choice: kepercayaanku
  rationale: Nomina ini menunjuk kepada apa atau siapa yang menjadi tumpuan kepercayaan dan rasa aman; “kepercayaanku” mempertahankan makna ketergantungan pribadi kepada Allah.
- source_word: מִנְּעוּרָי
  choice: sejak masa mudaku
  rationale: Preposisi מִן menandai titik awal yang berlanjut; “sejak masa mudaku” merupakan ungkapan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה dalam gabungan אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  alternative: Tuhan ALLAH; Tuhan TUHAN
  rationale: Teks Ibrani memuat gelar dan nama ilahi secara berdampingan. “Tuhan YAHWEH” mempertahankan pembedaan keduanya dan menghindari penyamaran nama ilahi maupun pengulangan yang membingungkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Kapitalisasi “Engkau” menandai sapaan kepada Allah sesuai kebiasaan penulisan religius Indonesia; “YAHWEH” digunakan untuk memperlihatkan nama ilahi.
