  text: I will come in the mighty deeds of the Lord GOD[a]; I will proclaim your righteousness[c][b], yours alone.
translation:
  language: id
  text: Aku akan datang dengan perbuatan-perbuatan perkasa Tuhan Yahweh[a]; aku akan memberitakan kebenaran-Mu[b] saja.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam perbuatan-perbuatan perkasa Tuhan Yahweh.” Preposisi Ibrani dapat dipahami secara instrumental (“dengan”) maupun dalam arti “dalam”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “aku akan menyebutkan” atau “aku akan menceritakan”. Kata kerja Ibrani dapat berarti menyebutkan, menceritakan, atau memberitakan.'
    reason: lexical_alternative
  - marker: c
    text: “Kebenaran-Mu” juga dapat dipahami sebagai “keadilan-Mu” atau, dalam konteks ini, “perbuatan-perbuatan-Mu yang benar”. Frasa penutup secara harfiah berarti “Engkau saja” dan menegaskan bahwa hanya kebenaran-Mu yang diberitakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: Aku akan datang
  rationale: Bentuk Qal imperfek orang pertama tunggal dari בוא paling langsung berarti datang, pergi, atau masuk. Pilihan ini mempertahankan ungkapan Ibrani tanpa mempersempit maksudnya secara berlebihan.
- source_word: בִּגְבֻרוֹת
  choice: dengan perbuatan-perbuatan perkasa
  rationale: Bentuk jamak גְּבוּרוֹת dapat menunjuk pada kekuatan atau tindakan-tindakan yang menunjukkan kuasa. Preposisi בְּ di sini wajar dipahami secara instrumental, yaitu 'dengan', sementara kemungkinan nuansa lain dicatat dalam catatan kaki.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  rationale: אֲדֹנָי diterjemahkan 'Tuhan', sedangkan nama ilahi יהוה ditransliterasikan 'YAHWEH', sehingga kedua unsur gelar majemuk tetap tampak dan tidak melebur menjadi satu sebutan.
- source_word: אַזְכִּיר
  choice: aku akan memberitakan
  rationale: Bentuk Hifil dari זכר dapat berarti membuat orang mengingat, menyebutkan, menceritakan, atau memberitakan. Dalam konteks puisi tentang karya dan kebenaran Allah, 'memberitakan' menyampaikan tindakan deklaratif dengan alami.
- source_word: צִדְקָתְךָ
  choice: kebenaran-Mu
  rationale: צְדָקָה memiliki cakupan makna kebenaran, keadilan, dan tindakan benar. 'Kebenaran-Mu' mempertahankan istilah inti dan tidak membatasi referennya hanya pada tindakan konkret.
- source_word: לְבַדֶּךָ
  choice: hanya milik-Mu sendiri
  rationale: Ungkapan ini menekankan eksklusivitas. Dalam susunan ayat, ungkapan tersebut paling alami dikaitkan dengan 'kebenaran-Mu', tetapi hubungan sintaksis dan nuansa 'Engkau saja' tetap layak dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi dalam gelar אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  alternative: Tuhan ALLAH
  rationale: Pilihan ini mempertahankan perbedaan antara gelar אֲדֹנָי dan nama perjanjian יהוה tanpa menghasilkan pengulangan 'Tuhan TUHAN' yang janggal dalam bahasa Indonesia.
- issue: Makna צִדְקָתְךָ
  choice: kebenaran-Mu
  alternative: keadilan-Mu; perbuatan-perbuatan-Mu yang benar
  rationale: Istilah Ibrani dapat menunjuk pada sifat benar dan adil maupun perwujudannya dalam tindakan. Teks utama mempertahankan keluasan makna itu, dan alternatifnya dicatat agar ketegangan semantis tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Pengulangan 'perbuatan-perbuatan' dipertahankan untuk menyatakan bentuk jamak dan sifat konkret גְּבוּרוֹת.
