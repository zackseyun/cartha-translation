  register: Bahasa Indonesia baku modern dengan nada puitis yang jelas dan bermartabat. 'Mengincar nyawaku' mengungkapkan ancaman secara alami, sedangkan catatan kaki mempertahankan alternatif leksikal. Pengulangan gagasan kebersamaan dalam 'berunding bersama-sama' dipertahankan karena יַחְדָּו dinyatakan secara eksplisit.
