  text: For my enemies speak against me[b][a], and those who watch for my life consult together.
translation:
  language: id
  text: Sebab musuh-musuhku berkata melawan aku, dan orang-orang yang mengincar nyawaku[a] berunding bersama-sama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengintai nyawaku” atau “mencari nyawaku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “berembuk bersama-sama”; dalam konteks ini, kata kerja ini juga dapat berarti “bersekongkol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi permohonan sebelumnya dan mempertahankan hubungan penjelas antarayat.
- source_word: אָמְרוּ
  choice: berbicara
  rationale: Bentuk perfektif Ibrani dapat menggambarkan perkataan bermusuhan yang sedang berlangsung dalam wacana puitis; bentuk kini alami dalam bahasa Indonesia.
- source_word: אוֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan lazim bagi nomina dengan sufiks orang pertama tunggal.
- source_word: לִי
  choice: menentang aku
  rationale: Walaupun preposisinya secara harfiah dapat berarti 'kepadaku', konteks permusuhan menunjukkan bahwa perkataan itu diarahkan untuk melawan pemazmur.
- source_word: וְשֹׁמְרֵי נַפְשִׁי
  choice: dan orang-orang yang mengincar nyawaku
  rationale: Dalam konteks bermusuhan, שׁמר menunjuk pada pengamatan dengan maksud mencelakakan atau menangkap; נֶפֶשׁ di sini adalah nyawa atau hidup yang terancam, bukan unsur jiwa yang terpisah.
- source_word: נוֹעֲצוּ
  choice: berunding
  rationale: Nifal dari יעץ menyatakan tindakan saling meminta atau menyatukan nasihat; 'berunding' mempertahankan makna dasarnya tanpa menjadikan nuansa persekongkolan sebagai satu-satunya arti.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Menunjukkan bahwa para lawan bertindak secara terkoordinasi.
