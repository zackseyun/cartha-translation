  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: id
  text: Ya, Yahweh, dalam kekuatan-Mu raja bersukacita, dan dalam keselamatan-Mu, betapa sangat ia bersorak-sorai![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “keselamatan” juga dapat berarti “pembebasan” atau, dalam konteks ini, “kemenangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama perjanjian dipertahankan sebagai “Yahweh”; partikel “Ya” menandai sapaan langsung secara wajar dalam bahasa Indonesia.
- source_word: בְּעָזְּךָ
  choice: karena kekuatan-Mu
  rationale: בְּ menyatakan dasar atau sebab sukacita raja. “Karena” lebih alami daripada “di dalam” dalam bahasa Indonesia, sedangkan “kekuatan” mempertahankan arti עֹז.
- source_word: יִשְׂמַח
  choice: bersukacita
  rationale: Bentuk yiqtol puitis tidak diberi penanda waktu eksplisit; bahasa Indonesia secara alami mempertahankan keterbukaan antara nuansa kini, kebiasaan, dan kemungkinan mendatang.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Walaupun tanpa artikel dalam bahasa Ibrani, konteks menunjuk kepada raja tertentu; bahasa Indonesia tidak memerlukan artikel definit untuk menyatakan hal itu.
- source_word: וּבִישׁוּעָתְךָ
  choice: karena keselamatan dari-Mu
  rationale: יְשׁוּעָה memiliki rentang arti keselamatan, pembebasan, atau kemenangan. “Keselamatan” mempertahankan cakupan luasnya, sedangkan “dari-Mu” memperjelas bahwa keselamatan itu berasal dari Yahweh.
- source_word: מַה ... מְאֹד
  choice: betapa ... sangat
  rationale: Gabungan ini merupakan seruan intensif. “Betapa ... sangat” mempertahankan kedua unsur penegasan meskipun sedikit lebih puitis daripada prosa sehari-hari.
- source_word: יגיל
  choice: bersorak-sorai
  rationale: גיל menyatakan kegembiraan yang meluap. Pilihan ini membedakannya dari שׂמח yang diterjemahkan “bersukacita” pada baris sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama perjanjian dan membedakannya dari gelar ilahi.
- issue: Cakupan makna יְשׁוּעָה
  choice: keselamatan
  alternative: pembebasan atau kemenangan
  rationale: Konteks kerajaan dapat mendukung kemenangan atau pembebasan, tetapi “keselamatan” mempertahankan keluasan istilah sumber tanpa membatasi jenis pertolongan yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis. Susunan klausa dibuat alami dalam bahasa Indonesia sambil mempertahankan kesejajaran kedua bagian ayat dan peningkatan dari “bersukacita” menjadi “bersorak-sorai”.
