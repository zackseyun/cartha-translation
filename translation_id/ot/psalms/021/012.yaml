  text: For you will make them turn their back[c][b][a]; with your bowstrings you will aim at their faces.
translation:
  language: id
  text: Sebab Engkau akan membuat mereka berbalik[a]; dengan tali-tali busur-Mu Engkau akan membidik wajah mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Engkau akan menjadikan mereka sebagai bahu.” Ungkapan Ibrani ini mungkin menggambarkan musuh yang dipaksa berbalik sehingga punggung atau sisi mereka menjadi sasaran.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dengan tali-tali-Mu Engkau akan menyiapkan [sesuatu] terhadap wajah mereka.” Gambaran Ibraninya padat; kata yang diterjemahkan “membidik” juga dapat berarti “menyiapkan” atau “membuat siap,” dengan alat atau anak panah yang tersirat.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan konteks sebelumnya sebagai alasan atau dasar keyakinan pemazmur.
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: Engkau akan membuat mereka berbalik membelakangi-Mu
  rationale: Secara harfiah ungkapan ini berarti 'menempatkan mereka sebagai bahu'. Dalam konteks peperangan, ungkapan tersebut kemungkinan menggambarkan musuh yang dipaksa berbalik atau melarikan diri. Tambahan '-Mu' menjelaskan arah tindakan secara alami dalam bahasa Indonesia tanpa menghilangkan citra membelakangi lawan.
- source_word: בְּמֵיתָרֶיךָ
  choice: dengan tali-tali busur-Mu
  rationale: מֵיתָר berarti tali atau senar; konteks membidik dalam peperangan menunjukkan bahwa yang dimaksud kemungkinan besar ialah tali busur. Bentuk jamak sumber dipertahankan.
- source_word: תְּכוֹנֵן
  choice: Engkau akan membidik
  rationale: Bentuk verba ini dapat berarti menyiapkan atau membuat siap. Dalam konteks tali busur dan sasaran di hadapan pemanah, 'membidik' menyampaikan tindakan yang dimaksud secara wajar.
- source_word: עַל־פְּנֵיהֶם
  choice: wajah mereka
  rationale: פָּנִים secara konkret berarti wajah, dan עַל dalam konteks permusuhan menunjukkan arah sasaran. Pilihan ini mempertahankan gambaran tajam dalam bahasa Ibrani.
theological_decisions:
- issue: Hubungan antara musuh yang berbalik dan tindakan membidik wajah mereka
  choice: Mempertahankan kedua klausa berdampingan dengan titik koma
  alternative: 'Menjadikannya hubungan waktu atau sebab: ''ketika Engkau membidik'''
  rationale: Teks Ibrani tidak memakai penghubung yang secara eksplisit menyatakan hubungan waktu atau sebab. Struktur yang padat dan ketegangan gambarnya dipertahankan agar tafsiran tertentu tidak dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia. Titik koma mempertahankan kesejajaran dua klausa Ibrani tanpa memaksakan hubungan kausal.
