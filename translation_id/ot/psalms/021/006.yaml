  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: id
  text: Sebab Engkau menjadikannya sangat diberkati untuk selama-lamanya[a]; Engkau membuatnya bersukacita di hadapan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau menetapkannya sebagai berkat-berkat untuk selama-lamanya,” atau “Engkau menaruh berkat-berkat atasnya untuk selama-lamanya.” Secara harfiah, ungkapan Ibrani ini berbunyi “Engkau menetapkannya berkat-berkat.” Jamak “berkat-berkat” dapat menyatakan kelimpahan berkat, atau dapat menggambarkan raja sebagai berkat bagi orang lain.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi pujian sebelumnya; “sebab” alami dan sesuai dengan daya kausal kata Ibrani ini.
- source_word: תְשִׁיתֵהוּ בְרָכוֹת
  choice: Engkau menjadikannya penuh berkat
  rationale: Konstruksi harfiahnya sangat padat, kira-kira “Engkau menjadikan dia berkat-berkat.” Ungkapan “penuh berkat” menyampaikan jamak intensif secara wajar dalam bahasa Indonesia tanpa menutup kemungkinan bahwa raja bukan hanya menerima, melainkan juga mewujudkan atau menjadi sumber berkat.
- source_word: לָעַד
  choice: untuk selama-lamanya
  rationale: Padanan Indonesia yang baku dan wajar untuk durasi yang terus berlangsung.
- source_word: תְּחַדֵּהוּ
  choice: Engkau membuatnya bersukacita
  rationale: Bentuk piel menyatakan tindakan menyebabkan sukacita; frasa ini mempertahankan makna kausatif dalam bahasa Indonesia yang alami.
- source_word: בְשִׂמְחָה
  choice: bersukacita
  rationale: Gagasan “dengan sukacita” dipadukan secara idiomatis dengan verba kausatif agar tidak menghasilkan pengulangan kaku seperti “menggembirakannya dengan sukacita.”
- source_word: אֶת־פָּנֶיךָ
  choice: di hadapan-Mu
  rationale: Ungkapan tentang “wajah” Allah secara idiomatis menunjuk pada kehadiran-Nya; “di hadapan-Mu” mempertahankan gambaran relasional itu dengan bahasa yang jelas.
theological_decisions:
- issue: Makna konstruksi “menjadikan dia berkat-berkat”
  choice: Raja digambarkan sebagai orang yang dipenuhi berkat, sambil membiarkan terbuka kemungkinan bahwa ia juga menjadi perwujudan atau sumber berkat.
  alternative: “Engkau menaruh berkat-berkat atasnya” atau “Engkau menjadikannya suatu berkat.”
  rationale: Bentuk jamak בְרָכוֹת dan konstruksi predikatifnya dapat menunjuk pada kelimpahan berkat yang diterima maupun pada raja sebagai perwujudan berkat. Teks utama dibuat alami tanpa membatasi ayat pada arti material, mesianik tertentu, atau satu penafsiran teologis saja.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Bentuk sapaan ilahi memakai kapital penghormatan. Susunan paralel puisi dipertahankan, sementara ungkapan Ibrani yang sangat padat dijelaskan melalui catatan kaki agar teks utama tetap mudah dipahami.
