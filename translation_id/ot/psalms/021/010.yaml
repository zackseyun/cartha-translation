source:
  edition: WLC
  text: פִּ֭רְיָ/מוֹ מֵ/אֶ֣רֶץ תְּאַבֵּ֑ד וְ֝/זַרְעָ֗/ם מִ/בְּנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: id
  text: 'Buah mereka akan Kaubinasakan dari bumi,

    dan keturunan mereka dari antara anak-anak manusia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau "dari antara umat manusia" atau "dari antara manusia". Secara harfiah dalam bahasa Ibrani: "dari antara anak-anak manusia".'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: buah mereka
  rationale: Mempertahankan metafora konkret Ibrani פְּרִי, sekaligus membiarkan kesejajarannya dengan 'keturunan mereka' menjelaskan bahwa yang dimaksud ialah penerus atau anak cucu mereka.
- source_word: מֵאֶרֶץ
  choice: dari bumi
  rationale: אֶרֶץ dapat berarti 'bumi' atau 'negeri'. Dalam konteks penghukuman yang luas, 'bumi' mempertahankan cakupan umum tanpa membatasinya pada wilayah tertentu.
- source_word: תְּאַבֵּד
  choice: akan Kaubinasakan
  rationale: Bentuk Piel dari אבד menyatakan tindakan menyebabkan binasa. 'Kaubinasakan' menyampaikan daya kausatif dan sapaan orang kedua tunggal dengan ringkas serta puitis.
- source_word: וְזַרְעָם
  choice: dan keturunan mereka
  rationale: זֶרַע secara harfiah berarti 'benih', tetapi untuk manusia lazim menunjuk kepada keturunan. Pilihan ini jelas dalam bahasa Indonesia dan melengkapi metafora 'buah' pada baris pertama.
- source_word: מִבְּנֵי אָדָם
  choice: dari antara anak-anak manusia
  rationale: Ungkapan Ibrani secara harfiah berbentuk 'anak-anak manusia' dan secara idiomatis berarti umat manusia. Terjemahan utama mempertahankan citra serta bentuk puitis sumber, sedangkan arti idiomatis dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan אָדָם dalam ungkapan בְּנֵי אָדָם
  choice: anak-anak manusia
  alternative: umat manusia; manusia
  rationale: Ungkapan ini secara umum merujuk kepada manusia sebagai keseluruhan, tetapi bentuk harfiahnya memiliki warna puitis. Teks utama mempertahankan bentuk tersebut tanpa mempersempit acuannya hanya kepada laki-laki, dan catatan menjelaskan padanan idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Inversi 'akan Kaubinasakan' mempertahankan penekanan awal pada objek 'buah mereka' dalam bahasa Ibrani dan cocok dengan larik puisi. Penulisan 'Kau-' mengikuti sapaan langsung kepada Allah dalam konteks mazmur.
