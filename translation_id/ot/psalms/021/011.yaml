  text: For they intended evil against you[a]; they devised a scheme[b], but they could not carry it out.
translation:
  language: id
  text: Sebab mereka berniat jahat terhadapmu[a]; mereka merancang sebuah siasat, tetapi tidak akan mampu melaksanakannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka merentangkan kejahatan terhadapmu.” Ungkapan Ibrani ini berarti bahwa mereka mengarahkan atau berniat melakukan kejahatan terhadap seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka membuat rencana, tetapi mereka tidak akan mampu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Partikel ini memperkenalkan alasan bagi pernyataan penghukuman sebelumnya dan secara alami mempertahankan hubungan penjelas dalam bahasa Indonesia.
- source_word: נָטוּ עָלֶיךָ רָעָה
  choice: mereka berniat jahat terhadap Engkau
  rationale: Secara harfiah ungkapan ini menggambarkan tindakan 'merentangkan/mengarahkan kejahatan' terhadap seseorang; dalam konteks ini maknanya ialah mengarahkan niat jahat kepada orang yang disapa.
- source_word: חָשְׁבוּ
  choice: merancang
  rationale: Kata kerja ini menyatakan pemikiran atau perencanaan yang disengaja dan cocok dengan tindakan permusuhan dalam baris sebelumnya.
- source_word: מְזִמָּה
  choice: siasat
  rationale: Nomina ini dapat berarti rencana atau muslihat; 'siasat' mempertahankan nuansa perencanaan licik tanpa menambahkan rincian yang tidak terdapat dalam teks.
- source_word: בַּל יוּכָלוּ
  choice: tetapi tidak mampu melaksanakannya
  rationale: בַּל adalah partikel negatif puitis dan יכל berarti 'mampu'. Kata ganti '-nya' secara wajar merujuk pada siasat dalam klausa sebelumnya, sementara 'tetapi' menyatakan kontras antara rencana dan kegagalannya.
theological_decisions:
- issue: Identitas orang yang disapa
  choice: Engkau
  alternative: engkau
  rationale: Konteks mazmur menyapa raja, tetapi rujukan dekatnya dapat dipahami dalam hubungan dengan tindakan TUHAN. Kapitalisasi mempertahankan pembacaan POB yang memandang sapaan ini tertuju kepada Allah tanpa memasukkan nama ilahi yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan lugas. Struktur paralel Ibrani dipertahankan, sedangkan idiom harfiah dijelaskan dalam catatan kaki. Penanda catatan [a] dan [b] keduanya dicantumkan dalam teks utama.
