  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: id
  text: Ia meminta hidup dari-Mu; Engkau memberikannya kepadanya—umur panjang[a] untuk selama-lamanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “panjangnya hari-hari.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “untuk selama-lamanya” dapat dipahami sebagai bahasa kerajaan tentang hidup dan pemerintahan yang langgeng, atau sebagai bahasa yang mencapai penggenapan lebih penuh dalam Mesias.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  choice: hidup
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, kata ini lazim berfungsi sebagai nomina abstrak tunggal, yaitu 'hidup'. Durasi hidup itu kemudian dijelaskan oleh frasa berikutnya.
- source_word: שָׁאַל
  choice: meminta
  rationale: Kata kerja ini menyatakan tindakan meminta atau memohon. 'Meminta' alami dalam bahasa Indonesia dan sesuai dengan konstruksi meminta sesuatu dari Allah.
- source_word: מִמְּךָ
  choice: dari-Mu
  rationale: 'Preposisi מן menunjukkan sumber: sang raja meminta hidup dari Allah. Huruf kapital mempertahankan konvensi bahasa Indonesia untuk sapaan kepada Allah.'
- source_word: נָתַתָּה לוֹ
  choice: Engkau memberikannya kepadanya
  rationale: Bentuk perfektif diterjemahkan sebagai tindakan yang telah diberikan. Akhiran '-nya' merujuk kembali kepada 'hidup', sedangkan 'kepadanya' mewakili לוֹ dan menjaga kedua unsur tetap jelas.
- source_word: אֹרֶךְ יָמִים
  choice: umur panjang
  rationale: Secara harfiah frasa ini berarti 'panjangnya hari-hari', sebuah idiom untuk umur atau kehidupan yang panjang. 'Umur panjang' lebih alami dan langsung dipahami dalam bahasa Indonesia; makna harfiahnya dicatat dalam catatan kaki.
- source_word: עוֹלָם וָעֶד
  choice: untuk selama-lamanya
  rationale: Ungkapan berpasangan ini menegaskan durasi tanpa batas. 'Untuk selama-lamanya' mempertahankan daya intensifnya dalam bahasa Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Cakupan hidup yang dijanjikan kepada raja dalam mazmur kerajaan
  choice: Durasi diterjemahkan secara langsung sebagai 'untuk selama-lamanya' tanpa dipersempit dalam teks utama.
  alternative: Ungkapan itu dapat dipahami sebagai bahasa hiperbolis kerajaan tentang umur dan pemerintahan yang langgeng, atau sebagai bahasa yang mencapai penggenapan lebih penuh dalam Mesias.
  rationale: Teks Ibrani sendiri menyatakan durasi yang tidak dibatasi. Terjemahan mempertahankan ketegangan teologis tersebut dan tidak menentukan salah satu penafsiran dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital. Tanda pisah mempertahankan hubungan penjelas antara pemberian hidup dan umur panjang.
