  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: id
  text: Tinggikanlah diri-Mu[a], ya Yahweh, dalam kekuatan-Mu! Kami akan bernyanyi dan bermazmur tentang keperkasaan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bangkitlah, ya Yahweh, dengan kekuatan-Mu.” Kata Ibraninya dapat dipahami sebagai seruan agar Allah bangkit atau meninggikan diri-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Tinggikanlah diri-Mu
  rationale: Bentuk perintah dari רום ditujukan kepada Allah dan dapat menyatakan permohonan agar Ia tampil sebagai Yang Mahatinggi atau ditinggikan. Ungkapan ini mempertahankan citra ketinggian sekaligus terdengar wajar dalam bahasa Indonesia; kemungkinan makna 'Bangkitlah' dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בְּעֻזֶּךָ
  choice: dalam kekuatan-Mu
  rationale: Preposisi ב dapat menandai lingkup atau sarana. 'Dalam kekuatan-Mu' mempertahankan keluasan makna itu dan menggambarkan Yahweh ditinggikan dalam pernyataan kekuatan-Nya.
- source_word: נָשִׁירָה
  choice: Kami akan bernyanyi
  rationale: Bentuk kohortatif orang pertama jamak menyatakan tekad atau ajakan. Dalam konteks ini, bentuk futur 'kami akan' secara alami menyampaikan tekad umat untuk memuji.
- source_word: וּנְזַמְּרָה
  choice: dan bermazmur
  rationale: זמר dalam konteks ibadah berarti membuat musik atau menyanyikan pujian. 'Bermazmur' mempertahankan unsur musikal dan konteks pujian tanpa sekadar mengulang 'bernyanyi'.
- source_word: גְּבוּרָתֶךָ
  choice: tentang keperkasaan-Mu
  rationale: גְּבוּרָה menunjuk pada daya, keperkasaan, atau kuasa yang nyata. 'Keperkasaan' membedakannya dari עֹז yang diterjemahkan 'kekuatan', sedangkan 'tentang' secara alami menyatakan isi nyanyian dan mazmur.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton יהוה secara langsung. Transliterasi 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna permohonan רומה ketika ditujukan kepada Allah
  choice: Tinggikanlah diri-Mu
  alternative: Bangkitlah
  rationale: Konteks pujian mendukung pengertian agar Yahweh tampil tinggi atau ditinggikan, tetapi verba itu juga dapat dipahami sebagai seruan agar Ia bangkit. Ambiguitas tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan 'ya Yahweh' mempertahankan bentuk vokatif. Kapitalisasi pronomina ilahi mengikuti kelaziman hormat dalam penerbitan Alkitab Indonesia. Paralelisme antara 'kekuatan' dan 'keperkasaan' dipertahankan, demikian pula perbedaan antara 'bernyanyi' dan 'bermazmur'.
