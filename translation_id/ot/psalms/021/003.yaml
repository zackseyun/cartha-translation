lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau dasar bagi sukacita raja dalam konteks sebelumnya; “Sebab” mempertahankan hubungan penjelas tersebut.
- source_word: תְקַדְּמֶנּוּ
  choice: Engkau menyambutnya
  rationale: Bentuk Piel dari קדם dengan sufiks objek dapat berarti menemui atau mendatangi lebih dahulu. “Menyambutnya” alami dalam bahasa Indonesia dan tetap menonjolkan prakarsa Allah.
- source_word: בִּרְכוֹת טוֹב
  choice: dengan berkat-berkat yang baik
  rationale: Terjemahan ini mempertahankan bentuk jamak “berkat-berkat” dan cakupan luas טוֹב tanpa membatasinya pada kemakmuran materi atau berkat rohani saja.
- source_word: תָּשִׁית
  choice: Engkau menaruh
  rationale: Kata kerja ini berarti menaruh atau menempatkan; “menaruh” jelas dan wajar ketika objeknya mahkota.
- source_word: לְרֹאשׁוֹ
  choice: di atas kepalanya
  rationale: Dengan kata kerja penempatan, preposisi ל secara idiomatis menunjukkan lokasi pada kepala.
- source_word: עֲטֶרֶת
  choice: mahkota
  rationale: Dalam konteks mazmur kerajaan, “mahkota” menyampaikan makna kebangsawanan dengan tepat.
- source_word: פָּז
  choice: emas murni
  rationale: Kata ini menunjuk pada emas bermutu tinggi atau terpilih; “emas murni” jelas bagi pembaca modern dan mempertahankan gaya puitis yang luhur.
theological_decisions:
- issue: Sifat berkat yang diberikan kepada raja
  choice: Mempertahankan ungkapan umum “berkat-berkat yang baik”
  alternative: Menafsirkannya secara khusus sebagai kemakmuran materi atau sebagai berkat rohani/perjanjian
  rationale: Frasa Ibrani tetap luas dan tidak menetapkan jenis berkat tertentu, sehingga terjemahan tidak mempersempit ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Struktur paralel ayat dipertahankan, sementara ungkapannya dibuat cukup alami bagi pembaca umum.
