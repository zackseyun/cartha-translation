  text: You have given him his heart’s desire[a], and you have not withheld the request of his lips[b]. Selah
translation:
  language: id
  text: 'Keinginan hatinya telah Kauberikan kepadanya,

    dan permohonan[a] bibirnya tidak Kautahan.

    Sela.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang langka ini dapat juga diterjemahkan “keinginan bibirnya” atau “permintaan bibirnya”. Kemungkinan besar kata itu menunjuk pada permohonan yang diucapkan, sejajar dengan “keinginan hatinya”.
    reason: lexical_alternative
  - marker: b
    text: “Sela” dipertahankan sebagai alih aksara karena arti atau fungsinya tidak pasti, meskipun kemungkinan menandai jeda musikal atau liturgis.
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: keinginan hatinya
  rationale: Ungkapan ini secara langsung menyatakan hasrat batin sang raja dan tetap alami dalam bahasa Indonesia modern.
- source_word: נָתַתָּה לּוֹ
  choice: telah Kauberikan kepadanya
  rationale: Bentuk perfektif Ibrani menunjukkan tindakan yang sudah terlaksana; 'telah' sesuai dengan konteks mazmur syukur.
- source_word: וַאֲרֶשֶׁת
  choice: permohonan
  rationale: Nomina Ibrani yang langka ini kemungkinan menunjuk pada permintaan yang diucapkan, sejajar dengan keinginan hati pada baris pertama.
- source_word: שְׂפָתָיו
  choice: bibirnya
  rationale: Pilihan literal ini mempertahankan citra Ibrani tentang permohonan yang diucapkan.
- source_word: בַּל מָנַעְתָּ
  choice: tidak Kautahan
  rationale: Ungkapan ini menyampaikan penyangkalan puitis dan makna verba 'menahan' secara ringkas serta wajar.
- source_word: סֶּלָה
  choice: Sela
  rationale: Istilah ini dialihaksarakan karena arti dan fungsi persisnya tidak pasti.
