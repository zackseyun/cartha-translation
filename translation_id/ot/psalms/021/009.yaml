id: PSA.21.9
reference: Psalms 21:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תְּשִׁיתֵ֤/מוֹ כְּ/תַנּ֥וּר אֵשׁ֮ לְ/עֵ֪ת פָּ֫נֶ֥י/ךָ יְ֭הוָה בְּ/אַפּ֣/וֹ יְבַלְּעֵ֑/ם וְֽ/תֹאכְלֵ֥/ם אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: id
  text: Engkau akan menjadikan mereka seperti tungku yang menyala ketika engkau hadir[a]. Yahweh, dalam murka-Nya, akan menelan mereka, dan api akan melalap mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada waktu wajahmu”; dapat juga diterjemahkan, “ketika engkau menampakkan diri.”
    reason: Frasa Ibrani memakai ‘wajah’ sebagai ungkapan bagi kehadiran atau penampakan.
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: Engkau akan menjadikan mereka
  rationale: Kata שׁית berarti ‘menaruh/menempatkan/menjadikan’. Dengan pelengkap perbandingan yang menyusul, ‘menjadikan mereka’ paling alami untuk menyatakan keadaan yang dihasilkan.
- source_word: כְּתַנּוּר אֵשׁ
  choice: seperti tungku yang menyala
  rationale: תנור menunjuk pada tungku atau perapian, sedangkan אֵשׁ menegaskan panas api. Ungkapan ini mempertahankan citra kehancuran oleh api dalam bahasa Indonesia yang wajar.
- source_word: לְעֵת פָּנֶיךָ
  choice: ketika engkau hadir
  rationale: Secara harfiah berarti ‘pada waktu wajahmu’. Dalam konteks ini, פָּנִים dapat menyatakan kehadiran atau penampakan. Terjemahan ini alami tanpa menentukan bahwa frasa tersebut merupakan istilah teknis eskatologis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: בְּאַפּוֹ
  choice: dalam murka-Nya
  rationale: אַף secara harfiah berarti ‘hidung’, tetapi secara idiomatis menyatakan amarah. ‘Murka’ sesuai dengan konteks penghukuman yang keras.
- source_word: יְבַלְּעֵם
  choice: akan menelan mereka
  rationale: בלע berarti ‘menelan’. Metafora yang hidup ini dipertahankan dan dibedakan dari tindakan api pada klausa berikutnya.
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: dan api akan melalap mereka
  rationale: Kata אכל secara dasar berarti ‘memakan’, tetapi untuk api, ‘melalap’ merupakan padanan Indonesia yang alami dan tetap mempertahankan gambaran penghancuran.
theological_decisions:
- issue: Ungkapan antropomorfis ‘pada waktu wajahmu’
  choice: ketika engkau hadir
  alternative: ketika engkau menampakkan diri
  rationale: Pilihan ini menyampaikan makna kehadiran yang terkandung dalam idiom Ibrani tanpa mengubahnya menjadi istilah teknis tentang suatu penampakan eskatologis.
- issue: Rujukan kata ganti orang kedua
  choice: engkau, dengan huruf kecil
  alternative: Engkau, sebagai sapaan kepada Allah
  rationale: Alur Mazmur 21:8–9 paling langsung tetap menyapa raja, lalu menyebut Yahweh sebagai pelaku dalam klausa berikutnya. Kapitalisasi huruf kecil menghindari penyamaan diam-diam antara raja dan Yahweh.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama pribadi ilahi ditransliterasikan agar perbedaan antara nama Yahweh dan gelar tetap tampak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Tungku yang menyala’ dipilih agar citra tanur api mudah dipahami, sedangkan ‘menelan’ dan ‘melalap’ mempertahankan dua gambaran verbal yang berbeda dalam teks Ibrani.
