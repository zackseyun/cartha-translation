lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada pemimpin atau pengawas pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan fungsi musikalnya; kata depan לַ diterjemahkan sebagai “untuk”.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Istilah ini merupakan penanda jenis karya yang lazim untuk nyanyian atau puisi yang bermusik; “mazmur” adalah padanan baku dan tepat dalam konteks ini.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam frasa Indonesia “Mazmur Daud”, hubungan dengan Daud tetap cukup luas dan tidak secara tegas membatasi maknanya pada kepengarangan, peruntukan, atau keterkaitan.
theological_decisions:
- issue: Makna keterangan לְדָוִד dalam judul mazmur
  choice: Mazmur Daud
  alternative: Mazmur oleh Daud; mazmur untuk Daud
  rationale: Kata depan Ibrani לְ dapat menyatakan kepengarangan, peruntukan, kepunyaan, atau keterkaitan. Ungkapan “Mazmur Daud” mempertahankan keluasan makna itu, sedangkan catatan kaki menjelaskan kemungkinan-kemungkinannya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Pemimpin pujian” dipilih sebagai sebutan yang mudah dipahami bagi penanggung jawab musik ibadah. Penanda catatan kaki ditempatkan sesudah “Daud” karena catatan tersebut menerangkan לְדָוִד.
