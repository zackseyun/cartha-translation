  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
translation:
  language: id
  text: Tanganmu akan menemukan semua musuhmu;[a] tangan kananmu akan menemukan orang-orang yang membencimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjangkau” atau “menyusul”. Dalam konteks ini, kata Ibrani yang pada dasarnya berarti “menemukan” dapat menyiratkan bahwa musuh berhasil dijangkau atau dikuasai.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: akan menemukan
  rationale: Makna dasar מצא adalah ‘menemukan’. Dalam konteks peperangan ini, kata tersebut dapat menyiratkan berhasil menjangkau atau menangkap musuh. ‘Menemukan’ mempertahankan gambaran Ibrani dan pengulangan puitisnya.
- source_word: יָדְךָ
  choice: tangan-Mu
  rationale: Terjemahan konkret ini mempertahankan gambaran antropomorfis tentang kuasa dan tindakan efektif pihak yang disapa.
- source_word: לְכָל אֹיְבֶיךָ
  choice: semua musuh-Mu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan menyeluruh dari כֹּל serta sapaan orang kedua tunggal.
- source_word: יְמִינְךָ
  choice: tangan kanan-Mu
  rationale: Terjemahan harfiah mempertahankan kesejajaran Ibrani dan gambaran konvensional mengenai kekuatan serta kemenangan.
- source_word: שֹׂנְאֶיךָ
  choice: orang-orang yang membenci-Mu
  rationale: Pilihan ini mempertahankan nuansa verbal bentuk partisipel, alih-alih menyamakannya begitu saja dengan nomina ‘musuh’.
theological_decisions:
- issue: Bahasa antropomorfis tentang kuasa ilahi atau rajawi dalam mazmur kerajaan
  choice: Mempertahankan gambaran konkret ‘tangan’ dan ‘tangan kanan’.
  alternative: Kuasa-Mu akan menyusul semua musuh-Mu.
  rationale: Teks Ibrani memakai gambaran jasmani yang penting bagi daya puitis dan kesejajarannya. Menggantinya dengan istilah abstrak akan menafsirkan lebih jauh daripada teks dan dapat menutup ambiguitas mengenai pihak yang disapa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada pronomina terikat mempertahankan gaya penghormatan yang lazim dalam teks Alkitab Indonesia tanpa menentukan secara eksplisit apakah sapaan ini terutama ditujukan kepada raja atau kepada Allah.
