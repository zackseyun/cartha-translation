id: PSA.21.7
reference: Psalms 21:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי הַ֭/מֶּלֶךְ בֹּטֵ֣חַ בַּ/יהוָ֑ה וּ/בְ/חֶ֥סֶד עֶ֝לְי֗וֹן בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: id
  text: Sebab raja percaya kepada Yahweh, dan oleh kasih setia Yang Mahatinggi[a], ia tidak akan goyah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam kasih setia Yang Mahatinggi”; preposisi Ibrani dapat dipahami secara instrumental atau lokatif. “Kasih setia” juga dapat diterjemahkan “kesetiaan perjanjian”.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak akan terguncang” atau “tidak akan terhuyung”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan dasar atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan tersebut tanpa mempersempitnya secara berlebihan.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit ini menunjuk kepada tokoh kerajaan dalam mazmur. Dalam bahasa Indonesia, bentuk “raja” sudah wajar tanpa harus selalu memakai penanda definit.
- source_word: בֹּטֵחַ
  choice: percaya
  rationale: Partisipel Qal menyatakan sikap mengandalkan yang berlangsung atau menjadi ciri tetap. “Percaya” menyampaikan ketergantungan penuh keyakinan secara alami.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Preposisi menandai pribadi yang menjadi tumpuan kepercayaan. “Kepada” merupakan pasangan alami bagi verba “percaya”, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: וּבְחֶסֶד
  choice: dan oleh kasih setia
  rationale: חֶסֶד mencakup kasih yang teguh, loyal, dan terkait kesetiaan perjanjian. “Kasih setia” merupakan padanan Indonesia yang ringkas dan mapan; “oleh” mempertahankan kemungkinan fungsi instrumental atau kausal preposisi בְּ.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Gelar ilahi ini dipakai secara substantival. “Yang Mahatinggi” adalah padanan yang alami dan bermartabat.
- source_word: בַּל יִמּוֹט
  choice: ia tidak akan goyah
  rationale: Partikel negatif puitis dan verba ini menggambarkan ketidakstabilan, keguncangan, atau keterpelantingan. “Tidak akan goyah” mempertahankan metafora dan terdengar alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan kasih setia Yang Mahatinggi dengan keteguhan raja
  choice: oleh kasih setia Yang Mahatinggi
  alternative: di dalam kasih setia Yang Mahatinggi
  rationale: Preposisi בְּ dapat dipahami secara instrumental/kausal maupun lokatif. Teks utama memakai pembacaan instrumental yang paling alami dalam konteks, sementara catatan kaki mempertahankan kemungkinan lokatif dan nuansa kesetiaan perjanjian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang sederhana, puitis, dan bermartabat. Susunan kalimat mengikuti hubungan klausa Ibrani, tetapi pilihan preposisi dan pronomina dibuat idiomatis bagi pembaca umum.
