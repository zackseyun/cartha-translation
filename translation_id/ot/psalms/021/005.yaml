    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Besarlah
  rationale: Adjektiva predikatif ditempatkan di awal untuk mempertahankan penekanan puitis bahasa Ibrani; partikel -lah memberi bentuk yang wajar dan khidmat dalam bahasa Indonesia.
- source_word: כְּבוֹדוֹ
  choice: kemuliaannya
  rationale: כָּבוֹד dapat berarti kemuliaan atau kehormatan; 'kemuliaan' sesuai dengan konteks kerajaan dan pengagungan sang raja.
- source_word: בִּישׁוּעָתֶךָ
  choice: oleh keselamatan-Mu
  rationale: Preposisi ב dapat menyatakan sarana maupun lingkup. 'Oleh' mempertahankan kemungkinan makna instrumental tanpa mempersempit יְשׁוּעָה hanya menjadi kemenangan militer.
- source_word: הוֹד
  choice: semarak
  rationale: הוֹד menunjuk pada kecemerlangan atau kemegahan yang tampak. 'Semarak' membedakannya dari הָדָר dan cocok dalam pasangan puitis kerajaan.
- source_word: וְהָדָר
  choice: dan keagungan
  rationale: הָדָר mengandung gagasan kebesaran, keelokan, dan martabat; 'keagungan' menyampaikan nuansa kerajaan dalam pasangan ini.
- source_word: תְּשַׁוֶּה
  choice: Kauanugerahkan
  rationale: Dalam konstruksi dengan עַל, verba ini berarti menaruh atau mengenakan sesuatu pada seseorang. 'Menganugerahkan' menyampaikan tindakan pemberian kehormatan secara alami tanpa menghilangkan gagasan bahwa Allah menempatkannya pada raja.
- source_word: עָלָיו
  choice: kepadanya
  rationale: Dalam ungkapan Indonesia dengan verba 'menganugerahkan', 'kepadanya' merupakan padanan idiomatis bagi עַל dengan sufiks orang ketiga.
theological_decisions:
- issue: Makna יְשׁוּעָה dalam mazmur kerajaan
  choice: keselamatan
  alternative: kelepasan atau kemenangan
  rationale: '''Keselamatan'' mempertahankan keluasan makna istilah Ibrani, yang mencakup tindakan menyelamatkan atau melepaskan dan, dalam konteks kerajaan atau perang, dapat menunjuk pada kemenangan.'
- issue: Hubungan ב antara kemuliaan raja dan keselamatan Allah
  choice: oleh
  alternative: melalui atau di dalam
  rationale: Bentuk Ibrani dapat menyatakan sarana atau lingkup. Teks utama memakai 'oleh', sedangkan catatan kaki mempertahankan kemungkinan lainnya tanpa menetapkan hubungan teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan khidmat. Susunan awal 'Besarlah' mempertahankan penekanan teks Ibrani, sedangkan 'Kauanugerahkan kepadanya' dipilih agar relasi verba dan objek tetap alami bagi pembaca masa kini.
