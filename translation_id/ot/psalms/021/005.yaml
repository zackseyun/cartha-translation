translation:
  language: id
  text: Besarlah kemuliaannya karena keselamatan-Mu[a][b]; kemegahan dan keagungan Kauanugerahkan kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melalui keselamatan-Mu” atau “di dalam keselamatan-Mu”; preposisi Ibrani dapat menyatakan sarana atau lingkup.
    reason: lexical_alternative
