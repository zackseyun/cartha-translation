lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Untuk pemimpin pujian
  rationale: Dalam judul mazmur, istilah ini menunjuk kepada orang yang memimpin atau mengawasi pelaksanaan musik. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi tugasnya hanya pada paduan suara.
- source_word: לִידוּתוּן
  choice: menurut Yedutun
  rationale: Preposisi לְ dapat menyatakan arah atau hubungan. “Menurut” mempertahankan kemungkinan bahwa nama itu menunjuk pada gaya, tata musik, atau kelompok yang terkait dengan Yedutun, tanpa memastikan salah satunya.
- source_word: מִזְמוֹר
  choice: Mazmur
  rationale: Padanan baku dan alami untuk sebutan jenis gubahan musikal ini dalam Kitab Mazmur.
- source_word: לְדָוִד
  choice: Daud
  rationale: Dalam frasa Indonesia “Mazmur Daud,” hubungan genitif tetap cukup luas dan tidak secara eksplisit membatasi maknanya menjadi kepengarangan saja.
