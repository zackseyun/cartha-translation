  text: Untuk pemimpin musik; menurut Yedutun[a]. Mazmur Daud[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk Yedutun” atau “kepada Yedutun”; kata depan Ibrani ini dapat menyatakan berbagai jenis hubungan dalam judul mazmur.
    reason: alternative_reading
