revisions:
- from: Dengan teguran-teguran karena kesalahan, Engkau mendisiplinkan seorang laki-laki; seperti ngengat, Engkau meluluhkan apa yang berharga baginya[a]. Sungguh, setiap manusia hanyalah uap[b]. Sela.
  to: Dengan teguran-teguran karena dosa, Engkau mendisiplinkan seseorang; Engkau membuat apa yang berharga baginya lenyap seperti oleh ngengat[a]. Sungguh, setiap manusia hanyalah uap[b]. Sela.
  rationale: Revisi ini mempertahankan urutan pokok ayat, makna disiplin karena dosa, ambiguitas leksikal חֲמוּדוֹ, serta citra הֶבֶל. Frasa perbandingan diatur ulang agar dalam bahasa Indonesia tidak menyiratkan bahwa Allah sendiri adalah ngengat, sambil tetap menyampaikan gambaran barang berharga yang dilenyapkan sebagaimana oleh ngengat.
