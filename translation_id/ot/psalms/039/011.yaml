id: PSA.39.11
reference: Psalms 39:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/011.yaml
  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: id
  text: Dengan teguran-teguran karena dosa, Engkau mendisiplinkan seseorang; Engkau membuat apa yang berharga baginya lenyap seperti oleh ngengat[a]. Sungguh, setiap manusia hanyalah uap[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau membuat keelokannya lenyap seperti oleh ngengat.” Kata Ibrani yang diterjemahkan “apa yang berharga baginya” juga dapat berarti “keelokannya” atau, secara lebih luas, “barang-barang kesayangannya.”
    reason: lexical_alternative
  - marker: b
    text: “Uap” menerjemahkan kata Ibrani hevel, yang menggambarkan kefanaan atau ketidakmantapan seperti embusan napas; secara tradisional diterjemahkan “kesia-siaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: dengan teguran-teguran
  rationale: Bentuk jamak dan fungsi instrumental preposisi dipertahankan; 'teguran' menyampaikan koreksi yang tegas secara alami.
- source_word: עַל עָוֺן
  choice: karena kesalahan
  rationale: Dalam konteks ini frasa tersebut paling wajar menyatakan alasan pendisiplinan. 'Kesalahan' mempertahankan cakupan moral עָוֺן tanpa mempersempitnya hanya pada rasa bersalah atau hukumannya.
- source_word: יִסַּרְתָּ
  choice: Engkau mendisiplinkan
  rationale: Kata kerja ini menunjukkan tindakan mendidik atau mengoreksi melalui disiplin; padanan ini jelas dan modern.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk maskulin tunggal dalam teks Ibrani, dengan fungsi representatif yang dijelaskan oleh pernyataan universal pada akhir ayat.
- source_word: וַתֶּמֶס
  choice: Engkau meluluhkan
  rationale: Kata kerja מסס menggambarkan tindakan menyebabkan sesuatu menyusut, hancur, atau lenyap. 'Meluluhkan' mempertahankan gambaran proses penghancuran tanpa membuat ngengat menjadi subjek gramatikal.
- source_word: כָּעָשׁ
  choice: seperti ngengat
  rationale: Mempertahankan perbandingan eksplisit dan gambaran kerusakan perlahan oleh ngengat.
- source_word: חֲמוּדוֹ
  choice: apa yang berharga baginya
  rationale: Bentuk ini dapat menunjuk kepada keelokan, milik kesayangan, atau segala sesuatu yang dipandang berharga; terjemahan luas ini menjaga ambiguitas tersebut.
- source_word: אַךְ
  choice: sungguh
  rationale: Menyampaikan penegasan khidmat yang memperkenalkan kesimpulan ayat.
- source_word: הֶבֶל
  choice: uap
  rationale: '''Uap'' mempertahankan citra konkret tentang sesuatu yang lekas lenyap dan tidak tetap, bukan hanya gagasan abstrak ''kesia-siaan''.'
- source_word: כָּל אָדָם
  choice: setiap manusia
  rationale: אָדָם di sini bersifat generik dan mencakup umat manusia. Bahasa Indonesia tidak memerlukan maskulin generik untuk mempertahankan makna universalnya.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilah liturgis atau musikal ini ditransliterasikan karena arti tepatnya tidak pasti.
theological_decisions:
- issue: Antropologi maskulin generik
  choice: Menerjemahkan אִישׁ sebagai 'seorang laki-laki', tetapi כָּל אָדָם sebagai 'setiap manusia'.
  alternative: Menerjemahkan keduanya secara maskulin, misalnya 'seorang laki-laki' dan 'setiap laki-laki', atau menetralkan keduanya sebagai 'seseorang' dan 'setiap manusia'.
  rationale: Pembedaan ini mempertahankan bentuk maskulin eksplisit אִישׁ sekaligus menyampaikan cakupan universal אָדָם secara wajar dalam bahasa Indonesia; tidak ada ajaran tentang keterbatasan pernyataan ini hanya kepada laki-laki.
- issue: Objek yang diluluhkan oleh Allah
  choice: Mempertahankan ungkapan luas 'apa yang berharga baginya'.
  alternative: '''Keelokannya'', ''harta kesayangannya'', atau ''miliknya yang indah''.'
  rationale: חֲמוּדוֹ dapat dipahami sebagai keelokan seseorang atau sebagai sesuatu yang diingini dan dihargainya. Terjemahan utama tidak memaksakan salah satu pengertian khusus.
- issue: Makna הֶבֶל
  choice: Menggunakan citra 'uap'.
  alternative: '''Kesia-siaan'', ''napas'', atau ''kehampaan''.'
  rationale: Citra uap mengungkap kefanaan dan ketidakmantapan manusia tanpa mereduksi kata itu menjadi penilaian moral atau filosofis semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah ditulis dengan kapital kehormatan. Struktur paralel dan citra konkret Ibrani dipertahankan, sedangkan tanda baca disesuaikan agar ayat mudah dibaca.
