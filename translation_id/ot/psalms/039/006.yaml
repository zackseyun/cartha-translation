id: PSA.39.6
reference: Psalms 39:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: id
  text: Sungguh, manusia berjalan seperti bayang-bayang[a]; sungguh, mereka sibuk dengan sia-sia[b]. Ia menimbun harta, tetapi tidak tahu siapa yang akan mengumpulkannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti suatu gambar”, “seperti rupa semu”, atau “seperti hantu”. Kata Ibraninya secara harfiah berarti “gambar” atau “rupa”; di sini menunjuk pada keberadaan manusia yang tidak kukuh.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “sibuk” juga dapat berarti “bergejolak” atau “membuat kegaduhan”. Kata kerjanya berbentuk jamak, mungkin menunjuk pada manusia pada umumnya setelah kata “manusia” yang berbentuk tunggal.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “siapa yang akan mengumpulkan mereka”, yaitu segala milik yang telah ditimbunnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: sungguh
  rationale: Partikel ini muncul dua kali untuk menegaskan pengamatan pemazmur; pengulangan “sungguh” mempertahankan tekanan dan kesejajaran puitisnya.
- source_word: בְּצֶלֶם
  choice: seperti bayang-bayang
  rationale: צֶלֶם secara harfiah berarti “gambar” atau “rupa”, tetapi dalam konteks ini menggambarkan keberadaan manusia yang tidak kukuh dan cepat berlalu. “Seperti bayang-bayang” menyampaikan metafora itu secara alami dalam bahasa Indonesia.
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: manusia berjalan
  rationale: Bentuk hitpael dari הלך menunjukkan bergerak atau berjalan ke sana kemari. אִישׁ berbentuk tunggal maskulin, tetapi di sini mewakili manusia secara umum; “manusia” alami dan tetap mempertahankan cakupan generiknya.
- source_word: הֶבֶל
  choice: dengan sia-sia
  rationale: הֶבֶל dapat berarti napas, kesia-siaan, atau kehampaan. Di sini kata itu menerangkan kegaduhan atau kesibukan manusia sebagai sesuatu yang tidak menghasilkan tujuan yang bertahan.
- source_word: יֶהֱמָיוּן
  choice: mereka sibuk
  rationale: Kata kerja dari המה menyatakan kegaduhan, gejolak, atau aktivitas yang hiruk-pikuk. Bentuk jamaknya dipertahankan dengan “mereka”, sementara “sibuk” menyampaikan aktivitas manusia yang gelisah secara wajar.
- source_word: יִצְבֹּר
  choice: ia menimbun harta
  rationale: צבר berarti menumpuk atau mengumpulkan. Objeknya tersirat dan dijelaskan oleh klausa berikutnya; “harta” ditambahkan agar maksudnya jelas dalam bahasa Indonesia.
- source_word: וְלֹא יֵדַע
  choice: tetapi tidak tahu
  rationale: 'Walaupun וְ secara dasar berarti “dan”, hubungan antarklausa bersifat kontras: ia menimbun, namun tidak mengetahui siapa yang kelak memilikinya. “Tetapi” membuat hubungan itu alami tanpa mengubah makna.'
- source_word: מִי אֹסְפָם
  choice: siapa yang akan mengumpulkannya
  rationale: Akhiran Ibrani berbentuk jamak dan mengacu pada barang-barang yang telah ditimbun. Pronomina “-nya” dalam bahasa Indonesia dapat merujuk secara kolektif pada harta tersebut tanpa menetapkan jumlah.
theological_decisions:
- issue: Bahasa maskulin representatif dalam אִישׁ
  choice: manusia
  alternative: seorang laki-laki / seseorang
  rationale: Dalam konteks mazmur ini, אִישׁ tidak membatasi pernyataan pada laki-laki tertentu, tetapi menggambarkan keadaan umat manusia secara umum. “Manusia” mempertahankan makna generik tanpa memasukkan penafsiran doktrinal tambahan.
- issue: Peralihan dari subjek tunggal ke kata kerja jamak
  choice: manusia ... mereka ... Ia
  alternative: seorang ... ia ... ia
  rationale: Teks Ibrani beralih dari אִישׁ tunggal kepada יֶהֱמָיוּן jamak lalu kembali ke bentuk tunggal. Terjemahan mempertahankan ketegangan gramatikal ini alih-alih menyeragamkannya, sehingga pembaca dapat melihat gerak dari manusia representatif kepada umat manusia secara umum dan kembali lagi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Repetisi “sungguh” dipertahankan, metafora dibuat alami, dan peralihan jumlah gramatikal dalam bahasa Ibrani tetap terlihat.
