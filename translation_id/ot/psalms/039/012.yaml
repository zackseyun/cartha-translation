source:
  edition: WLC
  text: שִֽׁמְעָ֥/ה תְפִלָּתִ֨/י יְהוָ֡ה וְ/שַׁוְעָתִ֨/י הַאֲזִינָ/ה֮ אֶֽל דִּמְעָתִ֗/י אַֽל תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑/ךְ תּ֝וֹשָׁ֗ב כְּ/כָל אֲבוֹתָֽ/י־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: id
  text: Dengarkanlah doaku, ya Yahweh, dan condongkanlah telinga-Mu kepada seruanku; janganlah membisu terhadap air mataku.[a] Sebab aku adalah pendatang bersama-Mu,[b] orang asing yang menetap, seperti semua leluhurku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah tuli terhadap air mataku.” Kata kerja Ibrani dapat berarti “membisu” atau “menjadi tuli”; konteks sebelumnya yang menekankan pendengaran mendukung kemungkinan nuansa auditori.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bersama-Mu.” Frasa ini dapat pula dipahami dalam arti hidup sebagai pendatang dalam hadirat atau wilayah kekuasaan Allah.
    reason: translation_ambiguity
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Dengarkanlah
  rationale: Imperatif Qal dari שׁמע merupakan permohonan langsung kepada Yahweh. Bentuk ini alami dalam bahasa doa Indonesia dan mempertahankan desakan permohonan.
- source_word: תְפִלָּתִי
  choice: doaku
  rationale: Padanan langsung dan lazim untuk nomina yang berarti doa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: וְשַׁוְעָתִי
  choice: seruanku
  rationale: שַׁוְעָה menunjuk pada seruan, sering kali seruan minta pertolongan. 'Seruanku' ringkas dan mempertahankan daya emosionalnya.
- source_word: הַאֲזִינָה
  choice: berilah telinga kepada
  rationale: Imperatif Hifil dari אזן secara harfiah berkaitan dengan memberi telinga. Ungkapan puitis ini mempertahankan paralelisme dengan 'Dengarkanlah'.
- source_word: אֶל דִּמְעָתִי
  choice: terhadap air mataku
  rationale: Nomina tunggal kolektif dipertahankan dengan ungkapan Indonesia 'air mataku', yang secara alami dapat menunjuk pada tangisan.
- source_word: אַל תֶּחֱרַשׁ
  choice: janganlah berdiam diri
  rationale: חרשׁ dapat berarti diam atau tuli. 'Berdiam diri' merupakan arti yang kuat secara leksikal dan menggambarkan permohonan agar Allah tidak tetap tanpa tanggapan terhadap air mata pemazmur; kemungkinan nuansa auditori dicatat dalam catatan kaki.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendasari permohonan dan sesuai dengan ragam puitis Indonesia.
- source_word: גֵר
  choice: pendatang
  rationale: גֵר adalah orang bukan pribumi yang tinggal di tengah suatu komunitas tanpa kedudukan penuh sebagai warga asli. 'Pendatang' dapat dipahami pembaca modern dan tetap menyampaikan status bukan-pribumi.
- source_word: עִמָּךְ
  choice: di hadapan-Mu
  rationale: עם biasanya berarti 'dengan', tetapi dalam konteks status manusia di wilayah atau hadirat Allah, 'di hadapan-Mu' menyampaikan relasi yang dimaksud secara alami. Terjemahan lebih harfiah dicatat dalam catatan kaki agar ambiguitas tetap terlihat.
- source_word: תּוֹשָׁב
  choice: orang asing yang menetap
  rationale: תּוֹשָׁב menunjuk pada penghuni yang menetap tanpa kedudukan penuh sebagai warga asli. Pilihan ini membedakannya dari גֵר sambil tetap jelas dalam bahasa Indonesia.
- source_word: כְּכָל אֲבוֹתָי
  choice: seperti semua leluhurku
  rationale: אבות dalam konteks silsilah secara alami berarti para pendahulu keluarga. 'Leluhurku' adalah padanan Indonesia yang jelas dan tidak mengaburkan rujukan genealogis.
theological_decisions:
- issue: Hubungan pemazmur dengan Allah dalam frasa גֵר אָנֹכִי עִמָּךְ
  choice: aku adalah pendatang di hadapan-Mu
  alternative: aku adalah pendatang bersama-Mu
  rationale: Frasa itu menggambarkan status fana dan tanpa kepemilikan tetap di bawah kekuasaan atau dalam hadirat Allah. 'Di hadapan-Mu' alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan bentuk harfiah 'dengan-Mu' dan ketegangan maknanya.
- issue: Pembedaan istilah status sosial גֵר dan תּוֹשָׁב
  choice: pendatang ... orang asing yang menetap
  alternative: orang asing ... pendatang
  rationale: Dua ungkapan berbeda dipakai agar pasangan istilah Ibrani tidak dilebur menjadi satu konsep, tanpa memaksakan rincian hukum sosial yang melampaui konteks ayat.
- issue: Makna אַל תֶּחֱרַשׁ dalam rangkaian permohonan
  choice: janganlah berdiam diri
  alternative: janganlah tuli
  rationale: Arti 'diam' mempertahankan gambaran Allah yang dimohon untuk menanggapi air mata, sementara konteks verba mendengar memungkinkan nuansa 'janganlah tuli'; alternatif itu dicatat tanpa menutup ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang puitis dan bermartabat. Partikel '-lah' mempertahankan nada permohonan. Istilah sosial dibuat jelas bagi pembaca umum, dan dua catatan kaki mempertahankan ambiguitas leksikal serta relasional dalam teks Ibrani.
