base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: id
  text: Aku berkata, “Aku akan menjaga jalan-jalanku agar aku tidak berdosa dengan lidahku; aku akan memasangkan berangus pada mulutku selama orang fasik[a] berada di hadapanku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “si fasik” atau “seorang fasik.” Dalam bahasa Ibrani, ungkapan ini berbentuk maskulin tunggal.'
    reason: Menjelaskan ketakrifan yang dapat dipahami lebih dari satu cara serta bentuk maskulin tunggal dalam bahasa sumber.
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Aku berkata
  rationale: Bentuk Qal perfekt orang pertama tunggal dari אמר secara langsung menyatakan perkataan atau tekad pemazmur yang telah diucapkan.
- source_word: אֶשְׁמְרָה
  choice: Aku akan menjaga
  rationale: Bentuk orang pertama tunggal ini menyatakan tekad. 'Menjaga' mempertahankan gagasan kewaspadaan dan pengendalian diri.
- source_word: דְרָכַי
  choice: jalan-jalanku
  rationale: Bentuk jamak דרך merupakan ungkapan Ibrani bagi cara hidup atau perilaku; bentuk harfiahnya tetap dapat dipahami dalam bahasa Indonesia.
- source_word: מֵחֲטוֹא
  choice: agar aku tidak berdosa
  rationale: מן dengan infinitif konstruk menyatakan pencegahan atau penghindaran; susunan ini lebih alami dalam bahasa Indonesia daripada 'dari berbuat dosa'.
- source_word: בִלְשׁוֹנִי
  choice: dengan lidahku
  rationale: Preposisi ב bersifat instrumental dan menunjuk lidah sebagai sarana terjadinya dosa; citra tubuh dalam teks dipertahankan.
- source_word: מַחְסוֹם
  choice: kekang
  rationale: Nomina ini menunjuk alat penahan pada mulut. 'Kekang' mempertahankan citra konkret pengendalian ucapan.
- source_word: אֶשְׁמְרָה לְפִי מַחְסוֹם
  choice: aku akan memasang kekang pada mulutku
  rationale: Ungkapan Ibrani dialihkan secara alami sambil mempertahankan gambaran kekang yang dikenakan pada mulut.
- source_word: בְּעוֹד
  choice: selama
  rationale: Kata ini menandai waktu yang berlangsung bersamaan; 'selama' sesuai dengan kehadiran orang fasik yang terus berlangsung.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva substantival maskulin tunggal ini menunjuk satu pribadi fasik. Bahasa Indonesia tidak menandai gender gramatikal, sehingga 'orang fasik' paling wajar tanpa menambahkan unsur yang tidak eksplisit.
- source_word: לְנֶגְדִּי
  choice: berada di hadapanku
  rationale: Frasa ini berarti berada di depan atau dalam kehadiran si pembicara; 'berada' melengkapi klausa tanpa verba agar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan dan gender רָשָׁע
  choice: orang fasik
  alternative: si fasik; seorang fasik; laki-laki fasik
  rationale: Teks Ibrani memakai bentuk maskulin tunggal, tetapi bahasa Indonesia tidak memiliki gender gramatikal pada 'orang'. Terjemahan ini mempertahankan ketunggalan secara semantis tanpa mempersempitnya dengan menambahkan kata 'laki-laki'; ketakrifannya dibiarkan terbuka karena bentuk Ibrani tanpa artikel dapat dipahami secara kontekstual atau representatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Citra 'jalan', 'lidah', dan 'kekang' dipertahankan, sedangkan susunan klausa disesuaikan agar alami dan mudah dipahami.
