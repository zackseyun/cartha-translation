  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: id
  text: Sesungguhnya, Kaujadikan hari-hariku selebar beberapa telapak tangan, dan masa hidupku bagaikan tiada di hadapan-Mu. Sungguh, setiap manusia[a], sekalipun berdiri teguh[b], hanyalah uap belaka[c]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap orang” atau “seluruh umat manusia”; kata Ibrani memakai bentuk tunggal generik untuk manusia secara umum.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang berdiri” atau “yang ditegakkan”; maksudnya mungkin bahwa bahkan orang yang tampak kokoh pun hanyalah uap.
    reason: lexical_alternative
  - marker: c
    text: Atau “napas belaka” atau “kesia-siaan belaka”; kata Ibrani הֶבֶל menggambarkan sesuatu yang fana dan cepat berlalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Partikel ini mengarahkan perhatian secara tegas. “Sesungguhnya” mempertahankan daya tekan puitis dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: טְפָחוֹת
  choice: beberapa telapak tangan panjangnya
  rationale: Kata ini menunjuk pada satuan ukuran kecil selebar telapak tangan. Ungkapan ini mempertahankan gambaran konkret sekaligus menyampaikan singkatnya umur.
- source_word: נָתַתָּה
  choice: Kaujadikan
  rationale: Dalam konteks ini verba tersebut menyatakan bahwa Allah menetapkan atau menjadikan hari-hari pemazmur sedemikian singkat.
- source_word: יָמַי
  choice: hari-hariku
  rationale: Terjemahan langsung yang mempertahankan ungkapan Ibrani bagi lamanya hidup.
- source_word: וְחֶלְדִּי
  choice: masa hidupku
  rationale: Nomina ini menunjuk pada rentang kehidupan seseorang di dunia; pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: כְאַיִן
  choice: seperti ketiadaan
  rationale: Mempertahankan perbandingan yang menyatakan betapa tidak berartinya atau nyaris tiadanya umur manusia.
- source_word: נֶגְדֶּךָ
  choice: di hadapan-Mu
  rationale: Menyampaikan gagasan berada dalam kehadiran atau penilaian Allah tanpa mempersempit maknanya.
- source_word: אַךְ
  choice: Sungguh
  rationale: Menandai penegasan ketika pemazmur menarik kesimpulan umum tentang manusia.
- source_word: כָּל אָדָם
  choice: setiap manusia
  rationale: אָדָם adalah bentuk tunggal generik yang di sini mencakup seluruh umat manusia. “Setiap manusia” akurat dan alami tanpa memberi kesan hanya laki-laki.
- source_word: נִצָּב
  choice: sekalipun berdiri teguh
  rationale: Partisip ini secara harfiah berarti berdiri, ditempatkan, atau ditegakkan. Dalam konteksnya, ungkapan ini kemungkinan menonjolkan ironi bahwa orang yang tampak kokoh pun fana.
- source_word: כָּל הֶבֶל
  choice: hanyalah uap belaka
  rationale: הֶבֶל secara konkret berarti napas atau uap dan secara metaforis menunjuk pada kefanaan atau kesia-siaan. “Uap” mempertahankan citra konkret, sedangkan “hanyalah ... belaka” menyampaikan daya total כָּל.
- source_word: סֶלָה
  choice: Sela
  rationale: Transliterasi tradisional dipertahankan karena fungsi tepat istilah ini tidak pasti.
theological_decisions:
- issue: Cakupan אָדָם dalam pernyataan umum
  choice: setiap manusia
  alternative: setiap orang / seluruh umat manusia
  rationale: Bentuk tunggal generik ini menunjuk kepada manusia secara universal. Pilihan utama mempertahankan bentuk distributif dan cakupan inklusifnya.
- issue: Hubungan נִצָּב dengan kefanaan manusia
  choice: sekalipun berdiri teguh
  alternative: yang berdiri / yang ditegakkan
  rationale: 'Bacaan konsesif sesuai dengan kontras puitis: bahkan manusia yang tampak kokoh hanyalah uap. Namun arti partisipnya tidak sepenuhnya pasti, sehingga alternatif harfiahnya dicatat.'
- issue: Metafora הֶבֶל
  choice: uap
  alternative: napas / kesia-siaan
  rationale: “Uap” mempertahankan citra tentang sesuatu yang tidak berwujud dan cepat lenyap tanpa membatasi istilah itu hanya pada gagasan moral tentang kesia-siaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penulisan Alkitab bahasa Indonesia. Citra ukuran telapak tangan dan uap dipertahankan agar kepadatan metaforis teks Ibrani tetap terasa.
