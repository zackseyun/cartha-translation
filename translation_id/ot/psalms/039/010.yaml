lexical_decisions:
- source_word: הָסֵר
  choice: Jauhkanlah
  rationale: Bentuk imperatif kausatif menyatakan permohonan langsung agar Allah menyingkirkan penderitaan itu. “Jauhkanlah” alami dalam doa dan mempertahankan daya imperatif.
- source_word: מֵעָלַי
  choice: dariku
  rationale: Secara harfiah frasa ini memuat gagasan “dari atasku,” tetapi “dariku” merupakan ungkapan Indonesia yang alami; gambaran bahwa tulah itu menimpa pemazmur tetap tersirat.
- source_word: נִגְעֶךָ
  choice: tulah-Mu
  rationale: נגע dapat berarti tulah, pukulan, atau penderitaan. “Tulah” mempertahankan gagasan penderitaan yang ditimpakan Allah tanpa menentukan bahwa bentuknya pasti penyakit.
- source_word: מִתִּגְרַת
  choice: karena serangan
  rationale: תִּגְרָה menunjuk pada pertikaian, permusuhan, atau serangan. “Karena serangan” menyampaikan tekanan tindakan yang datang melalui tangan Allah, sambil mempertahankan ketegangan ungkapan Ibrani.
- source_word: יָדְךָ
  choice: tangan-Mu
  rationale: Metafora antropomorfis bagi kuasa atau tindakan Allah dipertahankan secara langsung, bukan diparafrasakan menjadi “kuasa-Mu.”
- source_word: אֲנִי כָלִיתִי
  choice: aku telah habis
  rationale: כלה dalam bentuk perfektum dapat berarti sampai pada kesudahan, habis, atau lenyap. “Aku telah habis” mempertahankan penekanan pada keadaan pemazmur yang terkuras tanpa mempersempitnya menjadi kematian jasmani.
theological_decisions:
- issue: Sifat נִגְעֶךָ sebagai penderitaan dari Allah
  choice: “tulah-Mu,” tanpa menentukan apakah tulah itu penyakit, hukuman tertentu, atau bentuk penderitaan lain
  alternative: “pukulan-Mu” atau “penderitaan yang Kautimpakan”
  rationale: Teks mengaitkan penderitaan itu langsung dengan Allah, tetapi tidak menjelaskan bentuk maupun tujuan tepatnya. Terjemahan mempertahankan ketegangan tersebut.
- issue: Gambaran serangan tangan Allah
  choice: Metafora yang kuat dipertahankan sebagai “serangan tangan-Mu”
  alternative: Diperlunak menjadi “tekanan kuasa-Mu”
  rationale: Ungkapan sumber menggambarkan tindakan ilahi secara keras. Melunakkannya akan menghilangkan ketegangan teologis dan emosional ratapan ini.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan layak untuk ratapan doa. “Tulah” memberi bobot sakral tanpa menetapkan penyakit tertentu; “aku telah habis” sengaja mempertahankan kekuatan dan keluasan verba Ibrani, dengan pilihan yang lebih idiomatis dicatat dalam catatan kaki.
