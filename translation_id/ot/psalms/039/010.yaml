base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/010.yaml
  text: Remove your plague from me[d][c][b][a]; by the blow of your hand I am consumed.
translation:
  language: id
  text: Jauhkanlah tulah-Mu[a] dariku[b]; karena serangan[c] tangan-Mu, aku sudah terkuras[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pukulan-Mu” atau “penderitaan-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari atasku.”
    reason: previous_rendering
  - marker: c
    text: Atau “karena hantaman” atau “karena permusuhan.”
