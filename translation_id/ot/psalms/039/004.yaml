  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: id
  text: Ya Yahweh, beritahukanlah kepadaku akhirku dan seberapa panjang hari-hariku; supaya aku tahu betapa fananya aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “betapa rapuhnya aku” atau “betapa cepat aku berlalu.” Ungkapan Ibraninya ringkas dan dapat menekankan kerapuhan maupun singkatnya hidup manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: beritahukanlah kepadaku
  rationale: Bentuk imperatif Hifil dari ידע dengan sufiks orang pertama tunggal bersifat kausatif, yaitu meminta agar sang pemazmur dibuat mengetahui. Ungkapan ini mempertahankan unsur mengetahui dan terdengar wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”; partikel “Ya” menandai sapaan langsung secara alami dan khidmat.
- source_word: קִצִּי
  choice: akhir hidupku
  rationale: קֵץ berarti akhir atau batas. Dalam konteks kefanaan manusia, “akhir hidupku” menjelaskan rujukannya tanpa memasukkan gagasan yang lebih kuat seperti nasib.
- source_word: וּמִדַּת יָמַי מַה הִיא
  choice: dan berapa panjang umurku
  rationale: Secara harfiah frasa ini menanyakan “apa ukuran hari-hariku.” Bahasa Indonesia alami mengungkapkan gambaran ukuran durasi tersebut sebagai “berapa panjang umurku,” tanpa mengubahnya menjadi permintaan akan tanggal kematian yang pasti.
- source_word: אֵדְעָה
  choice: biarlah aku mengetahui
  rationale: Bentuk kohortatif menyatakan maksud atau hasil yang diinginkan. “Biarlah aku mengetahui” mempertahankan nuansa tersebut serta kesejajarannya dengan permintaan pertama.
- source_word: מֶה חָדֵל אָנִי
  choice: betapa fananya aku
  rationale: חָדֵל merupakan ungkapan ringkas dan sulit yang dalam konteks ini menunjuk pada hidup manusia yang segera berakhir atau rapuh. “Betapa fananya aku” sesuai dengan perenungan mazmur tentang singkatnya hidup, sementara kemungkinan “betapa rapuhnya aku” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar, dan merupakan transliterasi ilmiah yang lazim.
- issue: Makna חָדֵל dalam gambaran keadaan manusia
  choice: fana
  alternative: rapuh; segera berlalu
  rationale: Konteks menekankan singkat dan tidak tetapnya hidup manusia. Terjemahan “fana” memelihara hubungan antara keterbatasan dan kefanaan tanpa menjadikannya pernyataan tentang kekurangan moral.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Berapa panjang umurku” dipilih sebagai padanan alami bagi metafora Ibrani tentang ukuran hari-hari, sedangkan “fana” mempertahankan kepadatan dan nuansa puitis klausa penutup.
