  text: חַם לִבִּ֨/י בְּ/קִרְבִּ֗/י בַּ/הֲגִיגִ֥/י תִבְעַר אֵ֑שׁ דִּ֝בַּ֗רְתִּי בִּ/לְשֽׁוֹנִ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/003.yaml
  text: 'My heart grew hot within me[a]; as I meditated, the fire burned[b]; then I spoke with my tongue:'
translation:
  language: id
  text: 'Hatiku menjadi panas di dalam diriku; ketika aku merenung, api menyala[a]. Lalu aku berbicara dengan lidahku:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “api berkobar.” Ungkapan Ibrani menggambarkan peningkatan dari panas di dalam hati menjadi api yang menyala.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַם
  choice: menjadi panas
  rationale: Mengungkapkan perubahan keadaan batin dan mempertahankan perkembangan gambaran dari panas menuju api yang menyala.
- source_word: לִבִּי
  choice: hatiku
  rationale: Mempertahankan citra antropologis Ibrani tentang pusat pikiran, perasaan, dan batin seseorang.
- source_word: בְּקִרְבִּי
  choice: di dalam diriku
  rationale: Ungkapan Indonesia yang alami untuk lokasi batiniah tanpa menghilangkan penekanannya.
- source_word: בַּהֲגִיגִי
  choice: ketika aku merenung
  rationale: הֲגִיג dapat menunjuk pada renungan, permenungan, atau gumaman batin; bentuk ini terbaca alami dan mempertahankan makna reflektif serta hubungan temporal dalam konteks.
- source_word: תִבְעַר אֵשׁ
  choice: api menyala
  rationale: Mempertahankan citra api dan peningkatan intensitas dari hati yang panas menjadi api yang aktif menyala, tanpa menambahkan artikel yang tidak diperlukan dalam bahasa Indonesia.
- source_word: דִּבַּרְתִּי
  choice: Lalu aku berbicara
  rationale: Kata 'lalu' menyatakan urutan dari gejolak batin menuju ucapan, sedangkan 'berbicara' sesuai dengan verba Ibrani.
- source_word: בִּלְשׁוֹנִי
  choice: dengan lidahku
  rationale: Mempertahankan citra tubuh yang eksplisit dalam teks Ibrani dan penekanan bahwa renungan batin berubah menjadi ujaran.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur paralel Ibrani dipertahankan, tetapi susunan klausa dibuat alami. Tanda titik koma menjaga alur dari keadaan batin menuju renungan, lalu titik menandai peralihan kepada ucapan yang menyusul.
