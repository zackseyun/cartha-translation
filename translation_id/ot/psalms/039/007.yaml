  text: וְ/עַתָּ֣ה מַה קִּוִּ֣יתִי אֲדֹנָ֑/י תּ֝וֹחַלְתִּ֗/י לְ/ךָ֣ הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/007.yaml
  text: And now[a], Lord, what do I wait for? My hope is in you.
translation:
  language: id
  text: Dan sekarang, ya Tuhan, apa yang kunantikan?[a] Harapanku ada pada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “apa yang telah kuharapkan?” Kata kerja Ibrani קוה dapat berarti menanti maupun berharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan unsur penghubung וְ dan penanda waktu עַתָּה secara alami dalam bahasa Indonesia.
- source_word: מַה
  choice: apa
  rationale: Kata tanya ini membentuk pertanyaan retoris mengenai apa yang dinantikan pemazmur.
- source_word: קִוִּיתִי
  choice: yang kunantikan
  rationale: Bentuk dari קוה mencakup nuansa menanti dengan pengharapan. Terjemahan ini alami setelah 'sekarang' dan tetap terkait dengan 'harapanku' pada klausa berikutnya.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Gelar ilahi ini lazim dan tepat diterjemahkan sebagai 'Tuhan' dalam bahasa Indonesia.
- source_word: תּוֹחַלְתִּי
  choice: Harapanku
  rationale: Kata benda ini menyatakan harapan atau penantian penuh pengharapan; 'harapanku' merupakan padanan yang alami dan sentral dalam konteks.
- source_word: לְךָ הִיא
  choice: ada pada-Mu
  rationale: Mengungkapkan bahwa arah dan sandaran harapan pemazmur tertuju kepada Tuhan, sambil mengikuti konstruksi nominal Ibrani secara wajar.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Tuhanku
  rationale: Dalam pemakaian ini אֲדֹנָי berfungsi sebagai gelar ilahi baku. 'Tuhan' mempertahankan sapaan hormat tanpa menonjolkan sufiks historis sebagai kata ganti milik.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, puitis, dan mudah dipahami. Bentuk 'kunantikan' menjaga kelancaran mazmur; kapitalisasi '-Mu' mengikuti kebiasaan penghormatan kepada Allah.
