source:
  edition: WLC
  text: נֶ֭אֱלַמְתִּי לֹ֣א אֶפְתַּח פִּ֑/י כִּ֖י אַתָּ֣ה עָשִֽׂיתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/009.yaml
  text: I am mute[a]; I do not open my mouth[b], because you have done it.
translation:
  language: id
  text: Aku membisu[a]; aku tidak membuka mulutku, sebab Engkaulah yang telah melakukannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Aku telah dibuat bisu” atau “Aku diam.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab Engkau telah melakukan”; objek tindakan itu tidak dinyatakan dalam bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Aku membisu
  rationale: Bentuk Nifal dari אלם dapat menyatakan keadaan menjadi bisu atau diam. “Aku membisu” mempertahankan nuansa keadaan/hasil sekaligus terdengar alami dalam konteks pemazmur yang menahan ucapan.
- source_word: לֹא אֶפְתַּח פִּי
  choice: aku tidak membuka mulutku
  rationale: Ungkapan פתח + פי secara harfiah dan idiomatis menunjuk pada berbicara. Bentuk imperfek dapat dibaca sebagai keadaan kini atau tekad; terjemahan ini mempertahankan ketegangan tersebut tanpa menambahkan kata “akan”.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan pemazmur membisu. “Sebab” merupakan penghubung kausal yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Pronomina ini dinyatakan secara eksplisit dan mendahului verba, sehingga memiliki penekanan. Partikel “-lah” menyampaikan penekanan itu secara alami; huruf kapital mengikuti sapaan langsung kepada Allah.
- source_word: עָשִׂיתָ
  choice: yang telah melakukannya
  rationale: עשה bermakna luas, “melakukan/membuat,” dan objeknya tidak disebutkan. Bentuk “melakukannya” wajar dalam bahasa Indonesia, sementara catatan kaki menjelaskan bahwa objek tersebut tersirat.
theological_decisions:
- issue: Objek tersirat pada עָשִׂיתָ dan tindakan ilahi
  choice: sebab Engkaulah yang telah melakukannya
  alternative: sebab Engkau telah bertindak
  rationale: Terjemahan mengakui bahwa keadaan yang dihadapi pemazmur berkaitan dengan tindakan Allah, tetapi tidak menentukan secara lebih rinci apa yang Allah lakukan. Dengan demikian, ketegangan mengenai tindakan ilahi dalam penderitaan tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme serta citra “membuka mulut” dipertahankan. “Engkaulah” menyampaikan penekanan pada pronomina Ibrani tanpa memperjelas objek tindakan yang sengaja dibiarkan tersirat.
