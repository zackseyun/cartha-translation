translation:
  language: id
  text: Aku membisu dalam keheningan; aku diam, tidak mengatakan yang baik[a], dan rasa sakitku bergolak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari yang baik.” Frasa Ibrani ini juga dapat dipahami sebagai “aku berdiam diri, bahkan dari mengatakan yang baik,” “aku berdiam diri mengenai hal yang baik,” atau “aku menahan diri dari apa yang baik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Aku membisu
  rationale: Bentuk Nifal orang pertama tunggal dari אלם menyatakan keadaan menjadi atau berada dalam kebisuan. “Aku membisu” tetap membuka kemungkinan bahwa kebisuan itu disengaja atau dialami sebagai ketidakmampuan berbicara.
- source_word: דּוּמִיָּה
  choice: dalam keheningan
  rationale: Nomina ini menunjuk pada keheningan atau keadaan diam. Ungkapan adverbial ini alami dalam bahasa Indonesia dan mempertahankan penegasan puitisnya.
- source_word: הֶחֱשֵׁיתִי
  choice: aku tetap diam
  rationale: Bentuk Hifil dari חשׁה berarti berdiam diri atau tidak berbicara. “Tetap diam” membedakannya secara halus dari “membisu” dan menyiratkan kelanjutan sikap diam tanpa menentukan penyebabnya.
- source_word: מִטּוֹב
  choice: bahkan untuk mengatakan yang baik
  rationale: Secara harfiah frasa padat ini berarti “dari yang baik,” tetapi ungkapan tersebut tidak wajar dan sangat kabur dalam bahasa Indonesia. Dalam konteks pengendalian ucapan, terjemahan utama menyatakan pembacaan yang paling masuk akal, sedangkan kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: וּכְאֵבִי
  choice: dan rasa sakitku
  rationale: כְּאֵב dapat menunjuk pada rasa sakit jasmani maupun batin. “Rasa sakit” mempertahankan keluasan makna itu tanpa mempersempitnya menjadi dukacita atau penderitaan emosional saja.
- source_word: נֶעְכָּר
  choice: makin bergejolak
  rationale: Bentuk Nifal dari עכר dapat berarti diguncangkan, dikacaukan, atau dibuat keruh. “Makin bergejolak” secara alami menggambarkan rasa sakit batin yang menjadi semakin kuat selama pemazmur berdiam diri.
theological_decisions:
- issue: Maksud מִטּוֹב dalam hubungan dengan sikap diam pemazmur
  choice: Dipahami dalam teks utama sebagai menahan diri bahkan dari mengatakan hal yang baik.
  alternative: Dapat berarti berdiam diri mengenai hal yang baik atau menjauhkan diri dari apa yang baik.
  rationale: Konteks ayat sebelumnya berfokus pada menjaga mulut dan lidah, sehingga makna yang berkaitan dengan ucapan paling sesuai. Namun, sintaks Ibraninya ringkas dan tidak menyebut verba “mengatakan,” sehingga alternatifnya dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Paralelisme antara “membisu” dan “tetap diam” dipertahankan, sementara frasa Ibrani yang sangat padat dijelaskan melalui catatan kaki agar teks utama tetap dapat dipahami.
