  text: הָשַׁ֣ע מִמֶּ֣/נִּי וְ/אַבְלִ֑יגָה בְּ/טֶ֖רֶם אֵלֵ֣ךְ וְ/אֵינֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/013.yaml
  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: id
  text: Alihkanlah pandangan-Mu dariku, supaya aku lega[a] sebelum aku pergi dan tidak ada lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya kekuatanku pulih” atau “supaya aku dapat tersenyum lagi.” Kata kerja Ibrani ini dapat menyatakan kelegaan, pulihnya kekuatan, atau kecerahan wajah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע
  choice: Palingkanlah pandangan-Mu
  rationale: Bentuk imperatif ini meminta Allah mengalihkan perhatian atau tatapan-Nya dari pemazmur. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran tatapan yang tersirat dalam konteks ratapan.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: 'Preposisi dengan sufiks orang pertama tunggal menyatakan pemisahan: pandangan itu diminta beralih dari pemazmur.'
- source_word: וְאַבְלִיגָה
  choice: supaya aku pulih kembali
  rationale: Kata kerja בלג dapat menunjuk pada pulihnya kekuatan, kelegaan, kecerahan wajah, atau kegembiraan. 'Pulih kembali' terdengar wajar dan tidak membatasi makna hanya pada senyum atau kekuatan fisik; alternatifnya dicatat dalam catatan kaki.
- source_word: בְּטֶרֶם
  choice: sebelum
  rationale: Penanda waktu ini secara langsung dan alami diterjemahkan 'sebelum'.
- source_word: אֵלֵךְ
  choice: aku pergi
  rationale: Kata הלך secara harfiah berarti 'pergi'. Dalam konteks ini ungkapan tersebut menunjuk secara halus kepada kematian, sehingga metafora sumber dipertahankan.
- source_word: וְאֵינֶנִּי
  choice: dan tidak ada lagi
  rationale: Ungkapan ini menyatakan bahwa pemazmur tidak lagi hadir atau hidup. 'Tidak ada lagi' mempertahankan keheningan dan finalitas ungkapan Ibrani tanpa memperjelasnya menjadi 'mati'.
theological_decisions:
- issue: Apakah rujukan kepada kematian dalam אֵלֵךְ וְאֵינֶנִּי perlu dibuat eksplisit
  choice: 'Mempertahankan ungkapan tidak langsung: ''sebelum aku pergi dan tidak ada lagi''.'
  alternative: sebelum aku mati dan tiada lagi
  rationale: Ayat ini jelas mengarah kepada kematian, tetapi teks Ibrani menyatakannya secara puitis dan tidak langsung. Terjemahan mempertahankan ketegangan serta kehalusan itu tanpa menambahkan penegasan yang tidak terdapat dalam bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Sapaan kepada Allah memakai bentuk hormat '-Mu'. Susunan puitis Ibrani dipertahankan tanpa membuat rujukan kepada kematian lebih eksplisit daripada teks sumber.
