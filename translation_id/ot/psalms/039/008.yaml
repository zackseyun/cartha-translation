  text: מִ/כָּל פְּשָׁעַ֥/י הַצִּילֵ֑/נִי חֶרְפַּ֥ת נָ֝בָ֗ל אַל תְּשִׂימֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/008.yaml
  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: id
  text: Lepaskanlah aku dari segala pelanggaranku; jangan jadikan aku sasaran celaan orang bebal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan jadikan aku aib orang bebal.” Ungkapan Ibrani dapat berarti bahwa pemazmur menjadi sasaran celaan orang bebal atau menjadi aib yang dikaitkan dengan orang bebal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל פְּשָׁעַי
  choice: dari segala pelanggaranku
  rationale: מִן dengan כָּל menyatakan pembebasan dari keseluruhan pelanggaran pemazmur. “Pelanggaran” mempertahankan bobot moral פֶּשַׁע, yang dapat menunjuk pada tindakan melawan kewenangan yang benar.
- source_word: הַצִּילֵנִי
  choice: Lepaskanlah aku
  rationale: Bentuk imperatif Hifil dari נצל berarti menyelamatkan atau melepaskan dari bahaya maupun akibat buruk. “Lepaskanlah aku” alami sebagai permohonan dan cocok dengan pelengkap “dari segala pelanggaranku”.
- source_word: חֶרְפַּת
  choice: sasaran celaan
  rationale: חֶרְפָּה mencakup celaan, kehinaan, dan aib di muka umum. Penambahan “sasaran” membuat konstruksi dengan שׂים alami dalam bahasa Indonesia sekaligus menyampaikan pembacaan utama bahwa pemazmur menjadi objek celaan.
- source_word: נָבָל
  choice: orang bebal
  rationale: נָבָל bukan sekadar orang yang kurang cerdas, melainkan orang yang tidak berakal sehat secara moral dan sering kali tidak saleh. “Orang bebal” ringkas, lazim dalam register sastra Alkitab, dan tidak menambahkan label teologis yang tidak dinyatakan langsung.
- source_word: אַל תְּשִׂימֵנִי
  choice: jangan jadikan aku
  rationale: שׂים dengan objek orang dapat berarti menyebabkan seseorang menjadi atau ditempatkan sebagai sesuatu. “Jangan jadikan aku” merupakan ungkapan Indonesia yang wajar bagi larangan permohonan ini.
theological_decisions:
- issue: Makna permohonan tentang celaan orang bebal
  choice: Pemazmur memohon agar Allah tidak membiarkannya menjadi sasaran celaan orang yang bebal secara moral.
  alternative: Pemazmur memohon agar tidak dijadikan aib yang dikaitkan dengan orang bebal.
  rationale: Frasa konstruksi חֶרְפַּת נָבָל dapat dipahami sebagai celaan yang berasal dari orang bebal atau sebagai aib yang berkaitan dengannya. Teks utama memakai pembacaan yang paling langsung dalam konteks relasi dan kehormatan, sedangkan catatan kaki mempertahankan kemungkinan alternatif tanpa menyatakan bahwa pemazmur sendiri adalah orang bebal.
translation_notes:
  register: Bahasa doa yang ringkas, bermartabat, dan mudah dipahami. “Orang bebal” mempertahankan nuansa moral istilah Ibrani; “sasaran celaan” menghindari kekakuan harfiah tanpa menghapus ambiguitas yang dijelaskan dalam catatan kaki.
