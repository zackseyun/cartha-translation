source:
  edition: WLC
  text: לָ֭/מָּה רָגְשׁ֣וּ גוֹיִ֑ם וּ֝/לְאֻמִּ֗ים יֶהְגּוּ רִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/001.yaml
  text: Why do the nations rage[a], and the peoples plot in vain?
translation:
  language: id
  text: Mengapa bangsa-bangsa bergolak, dan suku-suku bangsa merancangkan hal yang sia-sia[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “merenungkan kekosongan,” “menggumamkan hal yang kosong,” atau secara tradisional, “merancang dengan sia-sia.” Kata kerja Ibraninya dapat berarti menggumamkan atau merenungkan, selain merancangkan; kata bendanya berarti kekosongan, kesia-siaan, atau sesuatu yang tidak menghasilkan apa-apa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya ini membuka pertanyaan retoris; “mengapa” alami dalam bahasa Indonesia modern dan mempertahankan daya tanyanya.
- source_word: רָגְשׁוּ
  choice: bergolak
  rationale: Kata kerja ini menggambarkan kegaduhan atau gejolak bersama yang penuh permusuhan. “Bergolak” mempertahankan gagasan kekacauan yang bergerak tanpa terlalu cepat membatasi maknanya menjadi persekongkolan.
- source_word: גוֹיִם
  choice: bangsa-bangsa
  rationale: Yang dimaksud ialah kelompok-kelompok politik atau kebangsaan; terjemahan ini jelas dan tidak memasukkan pertentangan teologis dari masa kemudian.
- source_word: לְאֻמִּים
  choice: suku-suku bangsa
  rationale: Pilihan ini membedakannya dari גוֹיִם sambil mempertahankan paralelisme dua istilah kolektif dalam bahasa Ibrani.
- source_word: יֶהְגּוּ
  choice: merancangkan
  rationale: Dalam konteks pemberontakan politik, kata kerja yang juga dapat berarti merenungkan atau menggumamkan ini menunjuk pada penyusunan maksud atau rencana. “Merancangkan” menyampaikan maksud bermusuhan secara wajar tanpa meniadakan keluasan makna aslinya, yang dicatat dalam catatan kaki.
- source_word: רִיק
  choice: hal yang sia-sia
  rationale: Nomina ini berarti kekosongan, kesia-siaan, atau sesuatu yang tidak menghasilkan apa-apa. “Hal yang sia-sia” mempertahankannya sebagai objek kata kerja, bukan semata-mata mengubahnya menjadi keterangan cara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Bergolak” dipakai untuk gejolak kolektif, sedangkan “suku-suku bangsa” menjaga pembedaan dan paralelisme dengan “bangsa-bangsa.”
