  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/יִרְאָ֑ה וְ֝/גִ֗ילוּ בִּ/רְעָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/011.yaml
  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
translation:
  language: id
  text: Layanilah Yahweh dengan takut[a], dan bersoraklah[b] dengan gemetar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan hormat dan gentar”; kata Ibrani yang diterjemahkan “takut” juga dapat menyatakan rasa takjub dan hormat di hadapan Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “bergembiralah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Layanilah
  rationale: Bentuk imperatif jamak dari עבד. Dalam hubungan dengan Yahweh, kata ini mencakup pelayanan sebagai wujud kesetiaan dan ibadah; “layanilah” mempertahankan cakupan luas itu tanpa membatasinya pada tindakan ibadah ritual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi Yahweh, bukan diganti dengan gelar.
- source_word: בְּיִרְאָה
  choice: dengan takut
  rationale: יִרְאָה dapat berarti takut, gentar, atau hormat penuh kekaguman. “Dengan takut” paling langsung dan mempertahankan kuatnya nada ketundukan di hadapan kewibawaan ilahi.
- source_word: וְגִילוּ
  choice: dan bersoraklah
  rationale: גיל menyatakan kegembiraan yang meluap atau sorak sukacita. “Bersoraklah” menyampaikan daya emosional verba ini dengan wajar dalam bahasa Indonesia.
- source_word: בִּרְעָדָה
  choice: dengan gemetar
  rationale: רְעָדָה berarti gemetar atau guncangan, khususnya karena takut atau gentar. Ungkapan ini mempertahankan ketegangan antara sukacita dan kegentaran.
theological_decisions:
- issue: Pasangan perintah yang menyandingkan sukacita dengan ketundukan penuh takut
  choice: 'Kedua perintah dipertahankan dalam ketegangannya: “Layanilah Yahweh dengan takut, dan bersoraklah dengan gemetar.”'
  alternative: Melunakkan “takut” menjadi “hormat” atau menjelaskan paradoks itu sebagai sukacita ibadah semata.
  rationale: Teks Ibrani menyandingkan takut dan sorak sukacita tanpa menjelaskan atau menyelaraskannya. Terjemahan mempertahankan paradoks teologis tersebut.
- issue: Penerjemahan יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi ini mempertahankan nama pribadi ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif “layanilah” dan “bersoraklah” menjaga kesejajaran puitis, sedangkan “takut” dan “gemetar” mempertahankan kekuatan serta ketegangan teks Ibrani.
