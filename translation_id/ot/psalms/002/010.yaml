  text: וְ֭/עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/010.yaml
  text: So now[a], O kings, be wise; be warned, O judges of the earth.
translation:
  language: id
  text: Maka sekarang, hai raja-raja, bertindaklah bijaksana; terimalah teguran[a], hai para hakim di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terimalah didikan,” “terimalah koreksi,” atau “biarlah kamu diperingatkan.” Kata Ibrani ini dapat menunjuk pada penerimaan disiplin atau nasihat keras, bukan hanya peringatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maka sekarang
  rationale: Ungkapan ini mempertahankan unsur penghubung dan waktu sekaligus menyampaikan peralihan berupa kesimpulan dari ayat-ayat sebelumnya menuju nasihat.
- source_word: מְלָכִים
  choice: hai raja-raja
  rationale: Bentuk ini menyatakan sapaan langsung dengan jelas dan tetap wajar dalam ragam puisi Indonesia yang bermartabat.
- source_word: הַשְׂכִּילוּ
  choice: bertindaklah bijaksana
  rationale: Imperatif Hifil dari שכל menunjuk pada pemahaman arif yang terwujud dalam tindakan; pilihan ini mempertahankan sisi praktis verba tersebut.
- source_word: הִוָּסְרוּ
  choice: terimalah teguran
  rationale: Imperatif Nifal dari יסר dapat berarti menerima didikan, disiplin, koreksi, atau peringatan. 'Terimalah teguran' mempertahankan gagasan penerimaan koreksi tanpa mempersempitnya menjadi sekadar ancaman.
- source_word: שֹׁפְטֵי אָרֶץ
  choice: hai para hakim di bumi
  rationale: Istilah שֹׁפְטֵי dipertahankan secara spesifik sebagai 'hakim', bukan diperluas menjadi 'penguasa'; 'bumi' sesuai dengan cakupan bangsa-bangsa dalam Mazmur 2.
