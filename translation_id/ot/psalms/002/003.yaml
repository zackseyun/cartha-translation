  text: נְֽ֭נַתְּקָה אֶת מֽוֹסְרוֹתֵ֑י/מוֹ וְ/נַשְׁלִ֖יכָה מִמֶּ֣/נּוּ עֲבֹתֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/003.yaml
  text: Let us tear off their chains and cast their ropes from us[a][b][c].
translation:
  language: id
  text: “Mari kita putuskan belenggu mereka[a] dan kita campakkan tali-tali mereka[b] dari kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ikatan mereka”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tambang-tambang mereka”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְנַתְּקָה
  choice: Mari kita putuskan
  rationale: Bentuk kohortatif orang pertama jamak menyatakan tekad atau ajakan. ‘Putuskan’ menyampaikan tindakan melepaskan secara paksa dan cocok dengan gambaran alat pengikat.
- source_word: מֹוסְרוֹתֵימוֹ
  choice: belenggu mereka
  rationale: Kata benda jamak ini menunjuk pada alat pengikat atau pengekang. ‘Belenggu’ konkret, puitis, dan mudah dipahami, tanpa menambahkan penilaian bahwa kekuasaan tersebut menindas.
- source_word: וְנַשְׁלִיכָה
  choice: dan kita campakkan
  rationale: Kohortatif orang pertama jamak kedua meneruskan seruan penuh tekad. ‘Campakkan’ mengungkapkan tindakan membuang dengan kuat dan sesuai dengan gaya puisi yang bermartabat.
- source_word: מִמֶּנּוּ
  choice: dari kita
  rationale: Preposisi dengan akhiran orang pertama jamak menyatakan penyingkiran alat pengikat itu dari para pembicara sendiri.
- source_word: עֲבֹתֵימוֹ
  choice: tali-tali mereka
  rationale: Kata ini berarti tali atau tambang pengikat. ‘Tali-tali’ mempertahankan gambaran konkret dan paralelismenya dengan ‘belenggu’.
theological_decisions:
- issue: Metafora pengekangan ilahi/kerajaan
  choice: Mempertahankan gambaran konkret berupa belenggu dan tali tanpa menyebutnya sebagai penindasan.
  alternative: Menafsirkan ikatan itu secara abstrak sebagai kekuasaan, hukum, atau kuk.
  rationale: Dalam konteksnya, bangsa-bangsa sedang menolak TUHAN dan Yang Diurapi-Nya, tetapi ayat ini hanya menyuarakan cara mereka menggambarkan pemerintahan tersebut. Terjemahan tidak perlu membenarkan ataupun mengoreksi penilaian mereka di dalam baris ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puisi yang lugas dan bermartabat. Pengulangan ‘kita’ dipertahankan agar dua bentuk kohortatif Ibrani dan tekad para pembicara terdengar jelas.
