base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: id
  text: 'Aku hendak menyatakan ketetapan Yahweh: Ia berkata kepadaku, “Engkaulah anak-Ku[a]; hari ini Aku telah memperanakkanmu.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkaulah Anak-Ku.” Bahasa Ibrani tidak membedakan huruf besar dan kecil. Kapitalisasi dapat dipakai untuk mencerminkan pembacaan mesianis dalam penggunaan kanonik selanjutnya, tetapi teks utama mempertahankan bentuk yang tidak menafsirkan lebih jauh.
    reason: alternative_reading
  - marker: b
    text: Atau, “hari ini Aku telah menjadi Bapamu.” Secara lebih harfiah, bahasa Ibrani memakai ungkapan memperanakkan, yang dapat membangkitkan gambaran penobatan atau pengangkatan raja; ungkapan itu dipertahankan dalam teks utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Aku hendak menyatakan
  rationale: Bentuk ini memperkenalkan suatu pernyataan khidmat. “Hendak menyatakan” terdengar alami dalam bahasa Indonesia sekaligus mempertahankan nada proklamasi kerajaan.
- source_word: אֶל חֹק
  choice: ketetapan
  rationale: Dalam konteks penobatan raja, חֹק menunjuk pada ketetapan yang berwenang, bukan sekadar peraturan umum. Hubungan yang diperkenalkan אֶל dinyatakan secara alami melalui konstruksi “menyatakan ketetapan”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אָמַר אֵלַי
  choice: Ia berkata kepadaku
  rationale: Subjeknya secara wajar merujuk kembali kepada Yahweh. “Berkata” menerjemahkan אָמַר secara langsung tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: בְּנִי אַתָּה
  choice: Engkaulah Anak-Ku
  rationale: Susunan berpredikat depan dalam bahasa Ibrani diberi tekanan alami dengan “-lah”. Huruf kapital mencerminkan makna kerajaan-mesianis dalam konteks kanonik, sedangkan kemungkinan huruf kecil dicatat dalam catatan kaki.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan modern dan langsung yang mempertahankan penekanan waktunya.
- source_word: יְלִדְתִּיךָ
  choice: Aku telah memperanakkanmu
  rationale: Pilihan ini mempertahankan gambaran melahirkan atau memperanakkan dalam verba ילד serta bobot intertekstualnya, tanpa membatasinya pada satu penafsiran seperti pengangkatan atau penobatan.
theological_decisions:
- issue: Status kerajaan dan makna mesianis בְּנִי
  choice: Engkaulah Anak-Ku
  alternative: Engkaulah anak-Ku
  rationale: Konteks langsung berbicara tentang raja keturunan Daud, sementara penggunaan kanonik selanjutnya bersifat mesianis. Kapitalisasi menandai makna tersebut tanpa mengubah arti leksikal; karena bahasa Ibrani tidak membedakan huruf besar dan kecil, bentuk alternatif dicatat.
- issue: Makna “hari ini Aku telah memperanakkanmu”
  choice: Mempertahankan bahasa memperanakkan
  alternative: Hari ini Aku telah menjadi Bapamu
  rationale: Teks Ibrani memakai gambaran kelahiran atau tindakan memperanakkan. Terjemahan utama tidak menentukan apakah ungkapan ini terutama menunjuk pada penobatan kerajaan, pengangkatan dalam hubungan perjanjian, atau penggenapan mesianis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkaulah” dan “Anak-Ku” mempertahankan nada puitis-kerajaan tanpa menjadi arkais; “memperanakkanmu” sengaja dipilih karena ketepatan leksikal dan bobot teologisnya.
