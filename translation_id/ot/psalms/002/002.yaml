  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: id
  text: Raja-raja bumi mengambil sikap[a], dan para penguasa bersepakat melawan Yahweh dan melawan yang diurapi-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menempatkan diri” atau “mengambil posisi.” Ungkapan Ibrani ini menggambarkan tindakan sengaja mengambil posisi, di sini dalam sikap menentang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “melawan TUHAN dan melawan Mesias-Nya.” Secara harfiah, kata Ibrani itu berarti “yang diurapi-Nya” dan dapat menunjuk raja yang diurapi maupun, dalam lintasan mesianik mazmur ini, Sang Mesias.
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: menempatkan diri
  rationale: Bentuk Hitpael menyatakan tindakan sengaja mengambil posisi atau menempatkan diri. Pilihan ini mempertahankan nuansa refleksif dan, dalam konteksnya, sikap menentang tanpa menambahkan kata yang tidak tersurat.
- source_word: מַלְכֵי אֶרֶץ
  choice: raja-raja di bumi
  rationale: Frasa konstruksi ini menunjuk para raja dunia secara luas. 'Di bumi' terdengar alami dalam bahasa Indonesia dan lebih sesuai dengan cakupan universal mazmur ini daripada 'di negeri'.
- source_word: רוֹזְנִים
  choice: para penguasa
  rationale: Kata ini menunjuk pejabat tinggi atau pemimpin politik. 'Para penguasa' jelas, modern, dan cukup luas.
- source_word: נוֹסְדוּ יָחַד
  choice: bersekutu
  rationale: Dalam konteks ini, bentuk Nifal bersama יָחַד menggambarkan tindakan bersama yang terkoordinasi. 'Bersekutu' menyampaikan kesatuan tindakan tanpa mempersempit makna menjadi sekadar perundingan.
- source_word: עַל
  choice: melawan
  rationale: Dalam konteks permusuhan ini, preposisi tersebut menyatakan arah pertentangan. Pengulangan 'melawan' mempertahankan struktur Ibrani dan menegaskan bahwa perlawanan diarahkan kepada Yahweh serta kepada yang diurapi-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar 'TUHAN'.
- source_word: מְשִׁיחוֹ
  choice: yang diurapi-Nya
  rationale: Secara leksikal frasa ini berarti orang yang telah diurapi oleh-Nya. Terjemahan ini menjaga rujukan langsung kepada raja yang diurapi sekaligus tidak meniadakan cakrawala mesianik mazmur.
theological_decisions:
- issue: Makna מְשִׁיחוֹ dalam mazmur yang memiliki rujukan kerajaan langsung dan lintasan mesianik yang lebih luas
  choice: yang diurapi-Nya
  alternative: Mesias-Nya
  rationale: Terjemahan utama mengikuti arti leksikal dan membiarkan identitas tokoh berkembang dari konteks mazmur serta kesaksian kanonik, tanpa memasukkan kesimpulan kristologis langsung ke dalam bentuk katanya. Alternatif bertitel dicatat agar bobot mesianik istilah itu tetap terlihat.
- issue: Penyajian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Pemakaian 'Yahweh' mempertahankan nama pribadi yang terdapat dalam teks Ibrani; padanan tradisional berbentuk gelar dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan paralel Ibrani dipertahankan sejauh tetap alami; 'melawan' diulang untuk menjaga penekanan sumber. Istilah teologis yang berpotensi menutup ambiguitas asli ditempatkan dalam catatan kaki, bukan dipaksakan ke teks utama.
