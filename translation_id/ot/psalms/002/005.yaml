source:
  edition: WLC
  text: אָ֤ז יְדַבֵּ֣ר אֵלֵ֣י/מוֹ בְ/אַפּ֑/וֹ וּֽ/בַ/חֲרוֹנ֥/וֹ יְבַהֲלֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
translation:
  language: id
  text: Kemudian Ia akan berbicara kepada mereka dalam amarah-Nya, dan dalam murka-Nya yang menyala-nyala Ia akan menggentarkan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan dalam panas amarah-Nya Ia akan membuat mereka gempar.”'
    reason: Alternatif leksikal yang mempertahankan metafora panas pada חָרוֹן dan kemungkinan nuansa kepanikan atau kegemparan pada בהל.
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Menandai tindakan berikutnya dalam rangkaian mazmur secara alami dan ringkas.
- source_word: יְדַבֵּר
  choice: Ia akan berbicara
  rationale: Bentuk imperfek dalam konteks ini menyatakan tanggapan Allah yang akan menyusul; pilihan ini mempertahankan verba umum 'berbicara' tanpa menambah gagasan seperti 'menegur'.
- source_word: אֵלֵימוֹ
  choice: kepada mereka
  rationale: Merujuk kembali kepada para raja dan penguasa yang memberontak dalam ayat-ayat sebelumnya.
- source_word: בְאַפּוֹ
  choice: dalam amarah-Nya
  rationale: אַף secara harfiah berkaitan dengan hidung, tetapi secara idiomatis menyatakan amarah; terjemahan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: וּבַחֲרוֹנוֹ
  choice: dan dalam murka-Nya yang menyala-nyala
  rationale: חָרוֹן menggambarkan amarah yang berkobar atau membara; ungkapan ini mempertahankan metafora panas sekaligus membedakannya dari אַף pada klausa pertama.
- source_word: יְבַהֲלֵמוֹ
  choice: Ia akan menggentarkan mereka
  rationale: Bentuk piel בהל menyatakan tindakan yang menyebabkan ketakutan mendadak, kepanikan, atau kegemparan; 'menggentarkan' kuat, bermartabat, dan tidak berlebihan.
theological_decisions:
- issue: Bahasa antropopatik tentang amarah Allah
  choice: Mempertahankan penyebutan amarah dan murka Allah secara langsung dan kuat.
  alternative: Melunakkannya menjadi 'ketidaksenangan' atau sekadar 'penghakiman'.
  rationale: Teks Ibrani secara jelas menggambarkan perlawanan pribadi Allah terhadap pemberontakan dengan bahasa penghakiman yang kuat. Terjemahan tidak perlu melunakkan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Kapitalisasi pronomina ilahi dipakai secara konsisten. Penanda catatan kaki [a] ditempatkan dalam teks utama.
