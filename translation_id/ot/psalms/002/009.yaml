  text: Engkau akan meremukkan mereka dengan tongkat kerajaan dari besi[b][a]; seperti bejana seorang tukang periuk, Engkau akan menghancurkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, mengikuti tradisi teks alternatif yang tercermin dalam beberapa versi kuno dan digemakan dalam kitab Wahyu: “Engkau akan menggembalakan mereka dengan tongkat kerajaan dari besi” atau “Engkau akan memerintah mereka dengan tongkat kerajaan dari besi.”'
    reason: alternative_reading
  - marker: b
