lexical_decisions:
- source_word: תְּרֹעֵם
  choice: Engkau akan meremukkan mereka
  rationale: Vokalisasi Teks Masoret dan paralelismenya dengan תְּנַפְּצֵם mendukung makna tindakan penghukuman yang menghancurkan. Bentuk konsonantalnya juga berkaitan dengan tradisi bacaan ‘menggembalakan/memerintah’, yang dipertahankan dalam catatan kaki.
- source_word: בְּשֵׁבֶט
  choice: dengan tongkat kerajaan
  rationale: שֵׁבֶט dapat berarti tongkat, gada, atau tongkat kerajaan. Dalam konteks kerajaan Mazmur 2, ‘tongkat kerajaan’ menyampaikan kewibawaan raja, sedangkan catatan kaki mempertahankan kemungkinan leksikal ‘tongkat’.
- source_word: בַּרְזֶל
  choice: dari besi
  rationale: Istilah bahan yang langsung dan jelas; besi menekankan kekuatan serta kerasnya penghukuman.
- source_word: כִּכְלִי יוֹצֵר
  choice: seperti bejana tukang periuk
  rationale: כְּלִי berarti benda atau wadah, dan bersama יוֹצֵר secara alami merujuk kepada bejana yang dibuat tukang periuk. Ungkapan ini mempertahankan citra tembikar yang rapuh.
- source_word: תְּנַפְּצֵם
  choice: Engkau akan menghancurkan mereka
  rationale: Kata kerja ini menggambarkan pembantingan atau pemecahan dengan keras. ‘Menghancurkan’ terdengar alami dalam bahasa Indonesia dan mempertahankan daya gambarnya.
theological_decisions:
- issue: Apakah kata kerja pertama menggambarkan pemerintahan kerajaan atau penghukuman yang menghancurkan
  choice: 'Penghukuman yang menghancurkan: ‘Engkau akan meremukkan mereka’'
  alternative: 'Pemerintahan atau penggembalaan kerajaan: ‘Engkau akan menggembalakan mereka’ atau ‘Engkau akan memerintah mereka’'
  rationale: Vokalisasi Ibrani Masoret dan paralelisme sinonim dengan ‘Engkau akan menghancurkan mereka’ lebih mendukung gambaran penghukuman. Namun, tradisi alternatif yang tercermin dalam beberapa versi kuno dan gema Perjanjian Baru cukup penting untuk dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ‘Engkau’ mempertahankan bentuk orang kedua tunggal dan register puitis. Struktur paralel Ibrani serta citra penghukuman yang keras dipertahankan tanpa melunakkannya.
