source:
  edition: WLC
  text: יוֹשֵׁ֣ב בַּ/שָּׁמַ֣יִם יִשְׂחָ֑ק אֲ֝דֹנָ֗/י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/004.yaml
  text: The one enthroned in the heavens laughs[a]; the Lord mocks them.
translation:
  language: id
  text: Dia yang bertakhta di surga tertawa[a]; Tuhan mencemooh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia yang duduk di surga tertawa; Tuhan mengejek mereka.”
    reason: Alternatif ini mempertahankan arti yang lebih harfiah dari יוֹשֵׁב dan padanan lain yang wajar untuk יִלְעַג.
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: Dia yang bertakhta
  rationale: Partisipel ini secara harfiah berarti ‘yang duduk’ atau ‘yang berdiam’. Dalam konteks mazmur tentang raja-raja yang memberontak, ‘bertakhta’ menyampaikan nuansa pemerintahan berdaulat yang tersirat, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: בַּשָּׁמַיִם
  choice: di surga
  rationale: Bentuk Ibrani ini secara morfologis jamak dan dapat berarti ‘langit’ atau ‘surga’. Dalam bahasa Indonesia, ‘di surga’ paling alami untuk tempat kediaman dan pemerintahan Allah; bentuk jamak tidak perlu dipaksakan karena bahasa Indonesia tidak menandainya dengan cara yang sama.
- source_word: יִשְׂחָק
  choice: tertawa
  rationale: Bentuk yiqtol di sini dapat menyatakan tindakan yang hidup dan berkelanjutan dalam puisi. Kala kini tersirat secara alami dalam bahasa Indonesia. Kata ‘tertawa’ mempertahankan gambaran antropomorfis, sementara sifat mengejeknya diperjelas oleh baris sejajar berikutnya.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Bentuk ini adalah gelar אֲדֹנָי, bukan nama ilahi YHWH. ‘Tuhan’ merupakan padanan Indonesia yang wajar dan khidmat untuk gelar tersebut.
- source_word: יִלְעַג
  choice: mencemooh
  rationale: Kata kerja לעג menyatakan ejekan atau penghinaan. ‘Mencemooh’ jelas, kuat, dan sesuai dengan ragam puisi yang khidmat tanpa terdengar kuno.
- source_word: לָמוֹ
  choice: mereka
  rationale: Pronomina ini menunjuk kepada bangsa-bangsa dan para penguasa yang memberontak dalam ayat-ayat sebelumnya. ‘Mereka’ menjadi objek langsung yang alami bagi ‘mencemooh’.
theological_decisions:
- issue: Penggambaran Allah secara rajawi dan antropomorfis
  choice: Menerjemahkan יוֹשֵׁב dengan nuansa rajawi sebagai ‘Dia yang bertakhta’, sambil mempertahankan tindakan ‘tertawa’ dan ‘mencemooh’.
  alternative: ‘Dia yang duduk di surga tertawa; Tuhan mengejek mereka.’
  rationale: Konteks Mazmur 2 menampilkan kedaulatan Allah atas para penguasa yang memberontak. Nuansa kerajaan tidak diratakan, dan bahasa antropomorfis tidak dijelaskan menjadi gagasan abstrak sehingga ketegangan serta daya gambar teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Susunan dua klausa sejajar dipertahankan. ‘Bertakhta’ membawa citra kerajaan yang cocok dengan konteks mazmur, sedangkan ‘tertawa’ dan ‘mencemooh’ mempertahankan ketajaman ungkapan Ibrani.
