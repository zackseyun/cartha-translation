source:
  edition: WLC
  text: שְׁאַ֤ל מִמֶּ֗/נִּי וְ/אֶתְּנָ֣ה ג֭וֹיִם נַחֲלָתֶ֑/ךָ וַ֝/אֲחֻזָּתְ/ךָ֗ אַפְסֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: id
  text: Mintalah kepada-Ku, maka Aku akan memberikan bangsa-bangsa sebagai warisanmu, dan ujung-ujung bumi[a] sebagai milikmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bagian-bagian bumi yang paling jauh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל מִמֶּנִּי
  choice: Mintalah kepada-Ku
  rationale: Bentuk imperatif orang kedua tunggal maskulin dari שׁאל, diikuti מִן dengan akhiran orang pertama tunggal, menyatakan perintah langsung untuk memohon kepada pihak yang berbicara. Ungkapan ini alami dan tetap bernada luhur dalam bahasa Indonesia.
- source_word: וְאֶתְּנָה
  choice: maka Aku akan memberikan
  rationale: Bentuk kohortatif Qal sesudah imperatif berfungsi sebagai tanggapan berupa janji. 'Maka' mengungkapkan hubungan permintaan dan pemberian secara alami tanpa mengubahnya menjadi syarat formal.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Kata ini menunjuk kepada berbagai bangsa atau kelompok bangsa. Pilihan ini mempertahankan cakupan internasional dan tidak memasukkan kontras teologis Yahudi/non-Yahudi yang lebih kemudian.
- source_word: נַחֲלָתֶךָ
  choice: sebagai warisanmu
  rationale: נַחֲלָה berarti warisan, bagian pusaka, atau milik yang dianugerahkan. 'Sebagai warisanmu' memperjelas hubungan predikatifnya dengan bangsa-bangsa.
- source_word: וַאֲחֻזָּתְךָ
  choice: sebagai milikmu
  rationale: אֲחֻזָּה adalah milik, pegangan, atau wilayah kepunyaan. 'Milikmu' alami dalam bahasa Indonesia dan tetap membedakannya dari 'warisanmu' pada baris sejajar.
- source_word: אַפְסֵי אָרֶץ
  choice: ujung-ujung bumi
  rationale: Ungkapan konstruksi ini menunjuk pada bagian-bagian bumi yang paling jauh atau batas-batas terluarnya. 'Ujung-ujung bumi' mempertahankan citra Ibrani dan merupakan ungkapan Indonesia yang mudah dipahami.
theological_decisions:
- issue: Cakupan kerajaan/mesianik dari janji tersebut
  choice: Menerjemahkan ayat sebagai janji ilahi kepada raja/anak yang disapa tanpa menyebut identitas mesianik secara eksplisit.
  alternative: Parafrasa yang secara eksplisit mengidentifikasi pihak yang disapa sebagai Mesias.
  rationale: Teks Ibrani sendiri menjanjikan kekuasaan yang meliputi bangsa-bangsa dan seluruh bumi kepada pihak yang disapa. Terjemahan mempertahankan keterbukaan bagi pembacaan kerajaan dan mesianik tanpa memasukkan kesimpulan penafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan luhur. Huruf kapital pada enklitik dalam 'kepada-Ku' dan pada 'Aku' menandai bahwa pembicara dalam konteks mazmur adalah Allah. Paralelisme antara 'warisanmu' dan 'milikmu' dipertahankan.
