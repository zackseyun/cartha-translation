  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: id
  text: Ciumlah sang anak[a]; jangan sampai ia murka dan kamu binasa di jalan, sebab murka-Nya cepat menyala[c]. Berbahagialah semua orang yang berlindung kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Berilah penghormatan kepada sang anak.” Kata kerjanya secara harfiah berarti “ciumlah” dan dalam konteks kerajaan dapat menyatakan ketundukan atau penghormatan. Kata Ibrani bar (“anak”) tidak lazim di sini; ada juga yang mengusulkan arti seperti “kemurnian” atau “dengan murni.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “sebab murka-Nya akan menyala sebentar lagi” atau “sebab murka-Nya menyala sedikit saja.” Ungkapan Ibraninya padat dan dapat menekankan cepatnya murka itu datang atau singkatnya waktu maupun kecilnya kadar hingga murka itu menyala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: Ciumlah
  rationale: Imperatif jamak dari נשׁק secara konkret berarti “ciumlah.” Dalam konteks kerajaan, tindakan ini menyatakan ketundukan atau penghormatan; gambaran Ibrani dipertahankan dalam teks utama dan makna kontekstual dijelaskan dalam catatan.
- source_word: בַר
  choice: sang anak
  rationale: בַר merupakan bentuk yang tidak lazim dalam mazmur Ibrani ini, tetapi arti “anak” paling selaras dengan tokoh kerajaan dan pernyataan “Engkaulah anak-Ku” pada ayat 7. Kata “sang” menandai tokoh tertentu tanpa memasukkan gelar kristologis secara eksplisit.
- source_word: פֶּן יֶאֱנַף
  choice: supaya ia jangan murka
  rationale: פֶּן memperkenalkan akibat yang hendak dihindari, sedangkan יֶאֱנַף menyatakan menjadi atau merasa murka. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan subjek pribadi yang secara gramatikal tersirat.
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: dan kamu binasa di jalan
  rationale: אבד berarti binasa, sedangkan דֶרֶךְ hadir tanpa preposisi dalam ungkapan puitis yang padat. “Di jalan” mempertahankan citra perjalanan atau arah hidup tanpa menentukan secara berlebihan hubungan sintaksisnya.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: sebab murkanya cepat menyala
  rationale: יבער mempertahankan metafora api, dan כמעט dapat menunjuk pada sedikitnya waktu atau kadar. “Cepat menyala” menyampaikan ancaman yang segera dengan bahasa Indonesia yang jelas, sementara kemungkinan lain dicatat.
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Formula ucapan bahagia dalam Mazmur. “Berbahagialah” merupakan ungkapan Indonesia yang wajar dan bermartabat serta lebih luas daripada sekadar keadaan emosi sesaat.
- source_word: כָּל חוֹסֵי בוֹ
  choice: semua orang yang berlindung kepadanya
  rationale: חסה berarti mencari perlindungan atau naungan. “Berlindung kepadanya” mempertahankan citra perlindungan dan relasi dengan tokoh yang dirujuk.
theological_decisions:
- issue: Identitas בַר dalam Mazmur 2:12
  choice: Diterjemahkan “sang anak” sesuai kesinambungan dengan bahasa tentang anak kerajaan pada Mazmur 2:7.
  alternative: Memahaminya sebagai “kemurnian,” “dengan murni,” atau sebagai persoalan teks yang tidak menunjuk kepada anak kerajaan.
  rationale: Konteks sastra mazmur secara kuat mendukung rujukan kepada anak atau raja yang disebut sebelumnya, tetapi bentuk בַר tetap tidak lazim dan diperdebatkan. Karena itu, teks utama memakai “sang anak” tanpa menambahkan identifikasi doktrinal yang tidak dinyatakan ayat ini, dan alternatifnya dicatat.
- issue: Rujukan pronomina pada “ia/murkanya/kepadanya”
  choice: Dibiarkan menunjuk secara alami kepada “sang anak” sebagai anteseden terdekat.
  alternative: Menafsirkan satu atau lebih pronomina sebagai rujukan langsung kepada TUHAN.
  rationale: Bahasa Ibrani memungkinkan ketegangan rujukan dalam konteks hubungan antara TUHAN dan raja-Nya. Terjemahan tidak menambahkan nama atau gelar yang akan menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Bentuk konkret “Ciumlah” mempertahankan citra sumber, sedangkan “sang anak” memberi kejelasan rujukan tanpa memakai kapitalisasi atau gelar yang akan memaksakan identifikasi teologis. Semua penanda catatan kaki yang disertakan muncul dalam teks utama.
