source:
  edition: WLC
  text: וַ֭/אֲנִי נָסַ֣כְתִּי מַלְכִּ֑/י עַל צִ֝יּ֗וֹן הַר קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/006.yaml
  text: But as for me[a], I have installed my king on Zion, my holy mountain.
translation:
  language: id
  text: Namun Aku sendiri telah mengangkat[a] raja-Ku di Sion, gunung-Ku yang kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menetapkan”; sebagian orang memahami kata ini sebagai “telah mengurapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun Aku sendiri
  rationale: 'Kata penghubung dan pronomina mandiri ini bersifat kontras sekaligus emfatis dalam konteks: pemberontakan bangsa-bangsa dipertentangkan dengan tindakan tegas TUHAN. “Namun Aku sendiri” menyampaikan kedua nuansa itu secara alami dalam bahasa Indonesia.'
- source_word: נָסַכְתִּי
  choice: telah mengangkat
  rationale: Dalam konteks ini verba tersebut menunjuk pada pengangkatan atau penetapan seorang raja. “Mengangkat” jelas menyatakan tindakan kerajaan tanpa membatasinya pada upacara pengurapan, yang biasanya dinyatakan dengan verba Ibrani lain.
- source_word: מַלְכִּי
  choice: raja-Ku
  rationale: Nomina dengan sufiks orang pertama tunggal berarti “rajaku.” Huruf kapital pada sufiks mengikuti kaidah ejaan Indonesia bagi pronomina yang mengacu kepada Allah, sedangkan “raja” tetap merupakan nomina umum.
- source_word: עַל
  choice: di
  rationale: Dengan nama tempat, “di” paling alami dalam bahasa Indonesia dan menyatakan lokasi sang raja di Sion, bukan wilayah kekuasaannya.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Bentuk nama tempat yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: הַר קָדְשִׁי
  choice: gunung-Ku yang kudus
  rationale: Ungkapan ini secara wajar menyampaikan konstruksi Ibrani “gunung kekudusan-Ku” sebagai kepunyaan Allah yang berciri kudus, sambil mempertahankan arti langsung הַר sebagai “gunung.”
theological_decisions:
- issue: Apakah נָסַכְתִּי harus diterjemahkan sebagai pengurapan ritual atau pengangkatan raja
  choice: pengangkatan raja (“telah mengangkat”)
  alternative: “telah menetapkan” atau, menurut sebagian penafsiran, “telah mengurapi”
  rationale: Konteks langsung menggambarkan jawaban TUHAN terhadap para raja yang memberontak dengan menyatakan raja pilihan-Nya di Sion. “Mengangkat” mempertahankan daya pengangkatan kerajaan tanpa menyamakan verba ini dengan istilah Ibrani yang lazim untuk mengurapi. Kemungkinan pemahaman ritual tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan agung. “Namun Aku sendiri” mempertahankan kontras dan penekanan teks Ibrani; susunan selebihnya dibuat alami bagi pembaca umum.
