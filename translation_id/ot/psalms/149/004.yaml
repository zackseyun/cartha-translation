source:
  edition: WLC
  text: כִּֽי רוֹצֶ֣ה יְהוָ֣ה בְּ/עַמּ֑/וֹ יְפָאֵ֥ר עֲ֝נָוִ֗ים בִּ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/004.yaml
  text: For Yahweh delights in his people[a]; he adorns the humble with salvation.
translation:
  language: id
  text: Sebab Yahweh berkenan kepada umat-Nya; Ia menghiasi orang-orang yang rendah hati dengan keselamatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kemenangan” atau “pembebasan.” Kata Ibrani yang digunakan dapat berarti penyelamatan, pembebasan, atau kemenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ajakan untuk memuji dalam konteks sekitarnya; “Sebab” mempertahankan fungsi penjelas tersebut secara alami.
- source_word: רוֹצֶה
  choice: berkenan kepada
  rationale: Dalam konstruksi ini, verba tersebut menyatakan perkenanan atau kesenangan yang positif terhadap seseorang, bukan sekadar kehendak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: בְּעַמּוֹ
  choice: kepada umat-Nya
  rationale: Preposisi ב dengan רצה menandai pihak yang menjadi sasaran perkenanan. “Kepada umat-Nya” merupakan ungkapan Indonesia yang alami.
- source_word: יְפָאֵר
  choice: menghiasi
  rationale: Bentuk Piel dari פאר menyampaikan tindakan memperindah atau menghiasi, termasuk dengan kehormatan; “menghiasi” mempertahankan citra konkret tanpa menafsirkannya sebagai penobatan.
- source_word: עֲנָוִים
  choice: orang-orang yang rendah hati
  rationale: Istilah ini dapat menunjuk kepada orang yang rendah hati, lemah lembut, atau tertindas. Pilihan ini menyampaikan makna utama dengan bahasa Indonesia modern tanpa menghapus nuansa kerendahan atau keterbatasan keadaan mereka.
- source_word: בִּישׁוּעָה
  choice: dengan keselamatan
  rationale: יְשׁוּעָה mencakup keselamatan, pembebasan, dan dalam konteks tertentu kemenangan. “Dengan keselamatan” mempertahankan cakupan luas istilah itu dan cocok dengan citra menghiasi; alternatif kontekstual dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Transliterasi “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan sebuah gelar.
- issue: Cakupan makna יְשׁוּעָה dalam mazmur pujian
  choice: keselamatan
  alternative: kemenangan atau pembebasan
  rationale: “Keselamatan” mempertahankan keluasan makna teologis dan konkret dari kata Ibrani, sedangkan “kemenangan” tetap mungkin dalam konteks mazmur ini. Ketegangan leksikal tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. “Berkenan kepada” dipilih sebagai ungkapan alami untuk perkenanan Yahweh, sedangkan “menghiasi” mempertahankan metafora Ibrani. Penanda catatan kaki ditempatkan setelah “keselamatan,” yaitu pada kata yang dijelaskannya.
