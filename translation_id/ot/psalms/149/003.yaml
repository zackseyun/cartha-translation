  text: יְהַֽלְל֣וּ שְׁמ֣/וֹ בְ/מָח֑וֹל בְּ/תֹ֥ף וְ֝/כִנּ֗וֹר יְזַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/003.yaml
  text: Let them praise his name with dancing[c][b][a]; let them make music to him with tambourine and lyre.
translation:
  language: id
  text: Biarlah mereka memuji nama-Nya dengan tarian[a]; biarlah mereka bermusik[b] bagi-Nya dengan rebana dan lira[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan tari-tarian” atau “dalam tarian.” Kata Ibrani מָחוֹל dapat menunjuk pada kegiatan menari atau pada suatu tarian.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyanyikan pujian.” Kata Ibrani זמר dapat mencakup nyanyian pujian maupun permainan alat musik.
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional diterjemahkan “kecapi” atau “harpa”; kata Ibrani כִּנּוֹר lebih khusus menunjuk pada alat musik petik sejenis lira.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Biarlah mereka memuji
  rationale: Bentuk piel imperfek ini memiliki daya ajakan atau dorongan dalam konteks puisi; “biarlah mereka memuji” mempertahankan nuansa volitifnya secara wajar.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Teks Ibrani secara eksplisit menyebut “nama-Nya”; ungkapan ini dipertahankan karena menunjuk kepada diri Allah sebagaimana Ia dikenal dan dihormati.
- source_word: בְמָחוֹל
  choice: dengan tarian
  rationale: מָחוֹל dapat menunjuk pada kegiatan menari maupun suatu tarian. “Dengan tarian” alami dalam bahasa Indonesia dan mempertahankan keluasan maknanya.
- source_word: בְּתֹף
  choice: dengan rebana
  rationale: תֹף ialah alat perkusi berupa gendang bingkai. “Rebana” merupakan padanan Indonesia yang mudah dipahami dan lebih dekat secara bentuk daripada tamborin modern yang biasanya memakai kerincing.
- source_word: וְכִנּוֹר
  choice: dan lira
  rationale: כִּנּוֹר menunjuk pada alat musik petik kuno yang bentuknya lebih menyerupai lira daripada harpa modern; “lira” mengutamakan ketepatan historis.
- source_word: יְזַמְּרוּ
  choice: biarlah mereka bermusik
  rationale: Dalam piel, זמר dapat berarti bermusik atau menyanyikan pujian. Karena ayat ini secara eksplisit menyebut alat musik, “bermusik” mencakup unsur vokal maupun instrumental tanpa mempersempit makna.
- source_word: לוֹ
  choice: bagi-Nya
  rationale: Preposisi ל menandai Allah sebagai tujuan atau penerima kegiatan pujian; “bagi-Nya” terdengar alami bersama verba “bermusik”.
