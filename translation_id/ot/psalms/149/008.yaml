  terminology: “Raja-raja,” “rantai,” dan “belenggu besi” tepat dan konsisten dengan citra pengekangan dalam teks. “Orang-orang terhormat” mempertahankan makna נִכְבָּדִים tanpa secara berlebihan menyempitkannya menjadi kaum bangsawan atau pejabat. Catatan kaki menyediakan alternatif leksikal yang sah.
