source:
  edition: WLC
  text: לֶ/אְסֹ֣ר מַלְכֵי/הֶ֣ם בְּ/זִקִּ֑ים וְ֝/נִכְבְּדֵי/הֶ֗ם בְּ/כַבְלֵ֥י בַרְזֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/008.yaml
  text: to bind their kings with chains[a], and their honored men with iron fetters,
translation:
  language: id
  text: untuk mengikat raja-raja mereka dengan rantai, dan orang-orang terhormat mereka[a] dengan belenggu besi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pembesar mereka” atau “para bangsawan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: untuk mengikat
  rationale: Bentuk infinitif ini menyatakan tujuan atau hasil yang berhubungan dengan ayat sebelumnya. “Mengikat” mempertahankan gambaran pengekangan fisik tanpa mempersempitnya menjadi pemenjaraan resmi.
- source_word: מַלְכֵיהֶם
  choice: raja-raja mereka
  rationale: מֶלֶךְ secara khusus berarti “raja,” dan akhiran orang ketiga jamak dipertahankan sebagai “mereka.”
- source_word: בְּזִקִּים
  choice: dengan rantai
  rationale: זִקִּים menunjuk pada rantai atau alat pengekang. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran konkret teks Ibrani.
- source_word: וְנִכְבְּדֵיהֶם
  choice: dan orang-orang terhormat mereka
  rationale: Istilah ini berasal dari akar כבד dan menunjuk kepada orang-orang yang dipandang berbobot, terhormat, atau berkedudukan tinggi. Terjemahan ini dekat dengan bentuk Ibraninya tanpa secara pasti membatasi mereka pada satu golongan sosial tertentu.
- source_word: בְּכַבְלֵי בַרְזֶל
  choice: dengan belenggu besi
  rationale: כֶּבֶל berarti ikatan atau belenggu. “Belenggu besi” mempertahankan unsur bahan dan variasi kosakata terhadap “rantai” pada baris sebelumnya.
theological_decisions:
- issue: Bentuk maskulin jamak וְנִכְבְּדֵיהֶם
  choice: orang-orang terhormat mereka
  alternative: para pembesar mereka; para bangsawan mereka
  rationale: Teks menunjuk kepada kalangan elite atau orang berkedudukan tinggi dengan bentuk maskulin jamak. “Orang-orang terhormat” mempertahankan rujukan personal dan makna kehormatan tanpa menetapkan secara berlebihan bahwa mereka pasti bangsawan berdasarkan keturunan atau pejabat dengan jabatan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme puitis dipertahankan melalui pasangan “rantai” dan “belenggu besi”; tanda koma akhir mengikuti kenyataan bahwa ayat ini meneruskan kalimat dari konteks sekitarnya.
