  source_fidelity: Teks Indonesia secara akurat mencerminkan infinitif tujuan לֶאְסֹר (“untuk mengikat”), kepemilikan jamak pada “raja-raja mereka” dan “orang-orang terhormat mereka,” serta dua istilah pengekangan yang dibedakan dalam bahasa Ibrani. “Dengan rantai” dan “dengan belenggu besi” adalah padanan yang wajar bagi בְּזִקִּים dan בְּכַבְלֵי בַרְזֶל.
