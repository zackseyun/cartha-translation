  text: Let the faithful exult in glory[c][b][a]; let them sing for joy on their beds.
translation:
  language: id
  text: Biarlah orang-orang yang setia[a] bersukacita dalam kemuliaan[b]; biarlah mereka bersorak-sorai di tempat tidur mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang saleh” atau “orang-orang kudus”. Istilah Ibrani ini menunjuk kepada orang-orang yang dicirikan oleh kesetiaan dan pengabdian dalam ikatan perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam kehormatan.”
    reason: lexical_alternative
  - marker: c
    text: “Bersorak-sorai” juga dapat diterjemahkan “bernyanyi dengan sukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעְלְזוּ
  choice: Biarlah ... bersukacita
  rationale: Bentuk imperfek orang ketiga jamak dalam paralelisme puitis paling wajar dipahami sebagai ajakan. “Bersukacita” menyampaikan kegembiraan yang kuat dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: חֲסִידִים
  choice: orang-orang yang setia
  rationale: חָסִיד menunjuk kepada mereka yang bercirikan kesetiaan dan pengabdian dalam ikatan perjanjian. Pilihan ini jelas bagi pembaca modern dan tidak memasukkan pengertian teknis gerejawi yang belum tentu dimaksudkan.
- source_word: בְּכָבוֹד
  choice: dalam kemuliaan
  rationale: Preposisi ב paling langsung menunjukkan lingkup atau keadaan sukacita, sedangkan כָּבוֹד mempertahankan nuansa berbobot “kemuliaan”; arti “kehormatan” tetap mungkin dan dicatat dalam catatan kaki.
- source_word: יְרַנְּנוּ
  choice: biarlah mereka bersorak-sorai
  rationale: רנן dalam bentuk Piel menggambarkan seruan kegembiraan yang nyaring dan dapat mencakup nyanyian. “Bersorak-sorai” mempertahankan unsur vokal dan penuh sukacita tanpa membatasi maknanya hanya pada bernyanyi.
- source_word: עַל
  choice: di
  rationale: Dalam bahasa Indonesia, “di tempat tidur” merupakan padanan lokatif yang lebih alami daripada “di atas tempat tidur”, sambil tetap menggambarkan mereka bersukacita ketika berada di tempat pembaringan.
- source_word: מִשְׁכְּבוֹתָם
  choice: tempat tidur mereka
  rationale: Kata ini menunjuk kepada tempat berbaring. “Tempat tidur” adalah padanan langsung dan idiomatis dalam konteks ini.
theological_decisions:
- issue: Makna חֲסִידִים
  choice: orang-orang yang setia
  alternative: orang-orang saleh; orang-orang kudus
  rationale: Ungkapan ini menunjuk kepada umat yang setia dan mengabdi kepada Allah dalam relasi perjanjian, tanpa mengharuskan kategori gerejawi teknis. Alternatif leksikal dipertahankan dalam catatan kaki.
- issue: Makna בְּכָבוֹד
  choice: dalam kemuliaan
  alternative: dalam kehormatan
  rationale: Teks dapat merujuk pada keadaan mulia atau terhormat yang menjadi lingkup sukacita. Terjemahan utama mempertahankan bobot puitis “kemuliaan”, sementara kemungkinan “kehormatan” tidak disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan bermartabat. Pengulangan “biarlah” mempertahankan paralelisme serta sifat ajakan dalam kedua baris. Semua penanda catatan kaki ditempatkan pada bagian teks yang diterangkannya.
