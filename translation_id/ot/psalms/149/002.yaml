lexical_decisions:
- source_word: יִשְׂמַח
  choice: Biarlah ... bersukacita
  rationale: Bentuk imperfek Qal orang ketiga tunggal maskulin dipakai secara jusif sebagai ajakan; ungkapan ini alami dan puitis dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri umat perjanjian dipertahankan dalam bentuk Indonesia yang lazim.
- source_word: בְּעֹשָׂיו
  choice: karena Dia yang menjadikannya
  rationale: Preposisi ב menunjuk kepada pribadi yang menjadi alasan atau sasaran sukacita. Rumusan ini alami dalam bahasa Indonesia, mempertahankan sufiks tunggal yang merujuk kepada Israel, dan menghindari kesan bahwa bentuk plural Ibrani harus berarti banyak pencipta; bentuk pluralnya dijelaskan dalam catatan.
- source_word: בְּנֵי צִיּוֹן
  choice: anak-anak Sion
  rationale: Menerjemahkan ungkapan harfiah 'anak-anak lelaki Sion' dengan idiom Indonesia yang wajar bagi anggota atau penduduk Sion secara kolektif, tanpa membatasi acuannya hanya kepada laki-laki.
- source_word: יָגִילוּ
  choice: biarlah ... bersorak-sorai
  rationale: Kata גיל menyatakan kegembiraan yang meluap; 'bersorak-sorai' membedakannya dari שׂמח dan mempertahankan daya puitis paralelisme.
- source_word: בְמַלְכָּם
  choice: karena Raja mereka
  rationale: Preposisi ב kembali menyatakan pribadi yang menjadi alasan atau sasaran sukacita. 'Raja' memakai huruf kapital karena paralelisme paling mungkin menunjuk kepada Allah, sementara kemungkinan raja duniawi tetap dicatat.
theological_decisions:
- issue: Acuan 'Raja mereka'
  choice: Allah sebagai Raja Israel
  alternative: Seorang raja duniawi Israel
  rationale: Paralelisme langsung dengan 'Dia yang menjadikannya' sangat mendukung acuan ilahi. Huruf kapital menandai keputusan kontekstual ini, sedangkan kemungkinan lain tetap dipertahankan dalam catatan kaki.
- issue: Bilangan pada עֹשָׂיו
  choice: 'Acuan tunggal kepada Allah: ''Dia yang menjadikannya'''
  alternative: 'Terjemahan formal plural: ''mereka yang menjadikannya'' atau ''para pembuatnya'''
  rationale: Bentuk Ibraninya secara morfologis plural, tetapi dalam konteks ini paling wajar mengacu kepada Allah, Pencipta Israel. Terjemahan tunggal mencegah salah pengertian politeistis tanpa menyembunyikan bentuk sumber, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan puitis. Dua klausa ajakan dipertahankan secara paralel. 'Bersukacita' dan 'bersorak-sorai' membedakan nuansa kedua verba Ibrani. Semua penanda catatan kaki ditempatkan langsung dalam teks.
