  language: id
  text: Biarlah Israel bersukacita dalam Penciptanya[a]; biarlah anak-anak Sion bersorak-sorai dalam Raja mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, Ibraninya berbentuk plural: “para pembuatnya” atau “para penciptanya”. Bentuk ini umumnya dipahami di sini sebagai sebutan bagi Allah, Pencipta Israel.'
