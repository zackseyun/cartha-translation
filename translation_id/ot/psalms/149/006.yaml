translation:
  language: id
  text: Pujian-pujian luhur kepada Allah ada dalam tenggorokan mereka[a], dan pedang bermata dua ada di tangan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pujian-pujian yang ditinggikan.” Secara harfiah, “tenggorokan mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pedang bermata ganda.” Secara harfiah, “pedang dua mata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹמְמוֹת
  choice: puji-pujian luhur
  rationale: Bentuk jamak ini menunjuk pada pujian atau seruan yang meninggikan; 'puji-pujian luhur' mempertahankan nuansa keagungan dan cocok dengan ragam puitis.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל adalah sebutan ilahi yang merujuk kepada Allah Israel; 'Allah' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: בִּגְרוֹנָם
  choice: ada di tenggorokan mereka
  rationale: גָּרוֹן secara harfiah berarti 'tenggorokan'. Terjemahan harfiah mempertahankan gambaran jasmani yang kuat tentang pujian yang keluar dari dalam diri mereka.
- source_word: וְחֶרֶב
  choice: dan pedang
  rationale: Kata penghubung membuka baris paralel kedua, sedangkan nomina ini tidak tentu dalam konteksnya.
- source_word: פִּיפִיּוֹת
  choice: bermata dua
  rationale: Ungkapan ini secara harfiah menggambarkan pedang dengan dua mata atau sisi tajam; 'bermata dua' adalah ungkapan Indonesia yang jelas dan lazim.
- source_word: בְּיָדָם
  choice: ada di tangan mereka
  rationale: Kata Ibrani 'tangan' berbentuk tunggal dengan akhiran jamak dan dapat dipahami secara kolektif. Bahasa Indonesia secara alami dapat mempertahankan 'tangan mereka' tanpa menentukan apakah setiap orang memakai satu atau lebih tangan.
theological_decisions:
- issue: Gambaran peperangan yang disandingkan dengan ibadah
  choice: Mempertahankan penjajaran pujian dan pedang tanpa melunakkan salah satu gambaran.
  alternative: Menafsirkan pedang secara metaforis dalam teks utama.
  rationale: Teks Ibrani menampilkan gambaran perang secara langsung dalam paralel puitis dengan pujian. Terjemahan mempertahankan ketegangan ini dan tidak menetapkan tafsiran metaforis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Bentuk 'Kiranya ... ada' mempertahankan kemungkinan nuansa jussif atau ajakan yang timbul dari konstruksi tanpa verba dalam konteks mazmur, sementara citra konkret 'tenggorokan' dan 'pedang' tetap dipertahankan.
