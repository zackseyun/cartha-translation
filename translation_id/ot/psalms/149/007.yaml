translation:
  language: id
  text: 'untuk melaksanakan pembalasan terhadap bangsa-bangsa,

    menjatuhkan hukuman[a] terhadap kaum-kaum,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “teguran” atau “koreksi”. Kata Ibrani ini dapat berarti teguran, tetapi dalam konteks ini kemungkinan besar bermakna penghukuman, sejajar dengan “pembalasan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: untuk melaksanakan
  rationale: Infinitif berkata depan ל menyatakan tujuan. Bersama objek נְקָמָה, “melaksanakan” lebih alami daripada terjemahan harfiah “melakukan” dan tetap menyampaikan tindakan penghakiman.
- source_word: נְקָמָה
  choice: pembalasan
  rationale: Kata ini menunjuk pada pembalasan atau tindakan membalas dalam konteks hukum maupun perang. “Pembalasan” mempertahankan kekuatan istilah Ibrani tanpa memperhalus ketegangan teks.
- source_word: בַּגּוֹיִם
  choice: terhadap bangsa-bangsa
  rationale: Dalam hubungan dengan “pembalasan”, preposisi ב menandai sasaran tindakan. “Terhadap” terdengar alami dalam bahasa Indonesia dan tidak menyiratkan sekadar lokasi di tengah bangsa-bangsa.
- source_word: תּוֹכֵחוֹת
  choice: menjatuhkan hukuman
  rationale: Bentuk jamak ini dapat berarti teguran, koreksi, atau tindakan penghukuman. Dalam paralel dengan “pembalasan” dan konteks penghakiman pada ayat-ayat berikutnya, “hukuman” paling tepat; verba “menjatuhkan” membuat baris kedua alami dalam bahasa Indonesia.
- source_word: בַּל
  choice: kepada
  rationale: Unsur ini dipahami sebagai bentuk puitis preposisional yang menandai sasaran, sejajar dengan בַּגּוֹיִם. “Kepada” sesuai dengan ungkapan Indonesia “menjatuhkan hukuman kepada”.
- source_word: אֻמִּים
  choice: suku-suku bangsa
  rationale: Kata ini menyebut kelompok-kelompok masyarakat atau bangsa. “Suku-suku bangsa” membedakannya secara wajar dari גּוֹיִם yang diterjemahkan “bangsa-bangsa”, sambil mempertahankan kesejajaran puitis.
theological_decisions:
- issue: Apakah bahasa penghakiman perlu diperhalus agar tidak terkesan mengaitkan pembalasan dengan umat Allah
  choice: Mempertahankan istilah kuat “pembalasan” dan “hukuman”
  alternative: Menggunakan istilah yang lebih lunak seperti “keadilan”, “teguran”, atau “koreksi”
  rationale: Teks Ibrani memakai bahasa penghakiman yang kuat dalam konteks pujian bernuansa perang. Terjemahan mempertahankan ketegangan teologis tersebut tanpa menambah penjelasan mengenai pelaku atau cakupan tindakan di luar yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dua baris mempertahankan paralelisme puisi Ibrani. Bentuk “menjatuhkan hukuman” dipilih agar idiomatis, sedangkan “pembalasan” dipertahankan untuk menjaga daya dan ketegangan teks sumber.
