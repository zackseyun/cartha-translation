id: PSA.149.1
reference: Psalms 149:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ שִׁ֣ירוּ לַֽ֭/יהוָה שִׁ֣יר חָדָ֑שׁ תְּ֝הִלָּת֗/וֹ בִּ/קְהַ֥ל חֲסִידִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/001.yaml
  text: Praise Yah! Sing to Yahweh a new song[b][a], his praise in the assembly of the faithful.
translation:
  language: id
  text: 'Pujilah Yah![a]

    Nyanyikanlah nyanyian baru bagi Yahweh,

    pujian bagi-Nya dalam perhimpunan orang-orang yang setia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “Halelu-Yah”, yang secara harfiah berarti “Pujilah Yah!”
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam perhimpunan orang-orang saleh” atau “dalam jemaah orang-orang kudus.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Bentuk perintah jamak dari הלל diikuti bentuk singkat nama ilahi יָהּ. Terjemahan ini mempertahankan seruan langsung sekaligus bentuk nama yang khas.
- source_word: שִׁירוּ לַיהוָה
  choice: Nyanyikanlah ... bagi Yahweh
  rationale: שׁירו adalah perintah jamak, sedangkan ל menandai pihak yang menjadi tujuan nyanyian. 'Bagi Yahweh' alami dalam bahasa Indonesia dan mempertahankan nama perjanjian.
- source_word: שִׁיר חָדָשׁ
  choice: nyanyian baru
  rationale: Padanan langsung dan wajar bagi ungkapan Ibrani yang berulang dalam Mazmur.
- source_word: תְּהִלָּתוֹ
  choice: pujian bagi-Nya
  rationale: Secara harfiah dapat berarti 'pujian-Nya'; dalam konteks ajakan menyanyi, 'pujian bagi-Nya' menyampaikan bahwa Yahweh adalah sasaran pujian tanpa menghilangkan hubungan pronominal.
- source_word: בִּקְהַל
  choice: dalam perhimpunan
  rationale: קהל menunjuk komunitas yang berhimpun. 'Perhimpunan' mempertahankan latar komunal tanpa memberi nuansa kelembagaan gerejawi yang berlebihan.
- source_word: חֲסִידִים
  choice: orang-orang yang setia
  rationale: חסידים menunjuk mereka yang dicirikan oleh kesetiaan atau pengabdian, khususnya dalam relasi perjanjian. Pilihan ini jelas bagi pembaca modern dan menghindari konotasi teknis yang mungkin melekat pada 'orang-orang kudus'.
theological_decisions:
- issue: Pembedaan nama ilahi יָהּ dan יהוה dalam ayat yang sama
  choice: יָהּ diterjemahkan 'Yah' dan יהוה diterjemahkan 'Yahweh'
  alternative: Menerjemahkan salah satu atau keduanya sebagai 'TUHAN'
  rationale: Teks Ibrani sengaja memakai bentuk singkat dan bentuk lengkap nama ilahi. Mempertahankan keduanya mencerminkan bentuk sumber dan tidak meleburkan perbedaan tersebut.
- issue: Makna חֲסִידִים
  choice: orang-orang yang setia
  alternative: orang-orang saleh; orang-orang kudus; mereka yang dikasihi-Nya
  rationale: Kata ini dapat menonjolkan kesetiaan, kesalehan, atau keterikatan perjanjian. 'Orang-orang yang setia' menjaga dimensi pengabdian tanpa memasukkan kategori gerejawi yang lebih kemudian.
- issue: Hubungan sintaksis תְּהִלָּתוֹ dengan seruan sebelumnya
  choice: 'Disajikan sebagai kelanjutan eliptis: ''pujian bagi-Nya dalam perhimpunan ...'''
  alternative: Melengkapinya menjadi perintah eksplisit, misalnya 'nyanyikanlah pujian bagi-Nya'
  rationale: Bahasa Ibrani tidak mengulang verba pada bagian ini. Bentuk eliptis mempertahankan kepadatan puitis dan ambiguitas mengenai apakah frasa itu merupakan aposisi atau kelanjutan seruan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang lugas dan bermartabat. Paralelisme serta bentuk perintah jamak dipertahankan; 'perhimpunan' dipilih sebagai istilah komunal yang tidak terlalu teknis.
