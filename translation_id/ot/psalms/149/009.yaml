  yaml_path: translation/ot/psalms/149/009.yaml
  text: to execute on them the written judgment[a]. This is an honor for all his faithful ones[d][c][b]. Praise Yah!
translation:
  language: id
  text: untuk menjalankan putusan yang tertulis terhadap mereka[a]. Inilah kehormatan bagi semua orang yang setia kepada-Nya[b]. Pujilah Yah![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hukuman yang tertulis,” yakni putusan yang sudah dicatat atau ditetapkan oleh Allah.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “orang-orang setia-Nya”; secara tradisional: “orang-orang kudus-Nya.”'
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: “Pujilah Yah” (halelu-yah); secara tradisional ditransliterasikan “Haleluya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: untuk melaksanakan
  rationale: Dalam konstruksi dengan מִשְׁפָּט dan konteks penghukuman pada ayat sebelumnya, verba ini berarti menjalankan atau melaksanakan putusan, bukan sekadar 'melakukan'.
- source_word: בָּהֶם
  choice: atas mereka
  rationale: Preposisi ב menandai bangsa-bangsa dan para penguasa pada konteks sebelumnya sebagai pihak yang dikenai hukuman.
- source_word: מִשְׁפָּט כָּתוּב
  choice: hukuman yang tertulis
  rationale: '''Hukuman'' menyampaikan tindakan atau putusan yudisial yang dilaksanakan, sedangkan ''yang tertulis'' mempertahankan gambaran tekstual dari partisipel כָּתוּב tanpa mengubahnya secara tersirat menjadi ''ditetapkan''.'
- source_word: הָדָר
  choice: kehormatan
  rationale: Dalam klausa ini kata tersebut menunjuk pada martabat atau kehormatan yang menjadi bagian umat Allah, bukan terutama kemegahan visual.
- source_word: חֲסִידָיו
  choice: orang yang setia kepada-Nya
  rationale: חָסִיד menunjuk pada mereka yang menunjukkan kesetiaan dan pengabdian kepada Allah. Pilihan ini alami dalam bahasa Indonesia dan tidak memasukkan konotasi gerejawi belakangan dari istilah 'orang kudus'.
- source_word: הַלְלוּ יָהּ
  choice: Pujilah Yah!
  rationale: Menerjemahkan imperatif הַלְלוּ dan mentransliterasikan bentuk singkat nama ilahi יָהּ mempertahankan arti serta bentuk Ibraninya.
theological_decisions:
- issue: Bentuk nama ilahi dalam ungkapan penutup הַלְלוּ יָהּ
  choice: Yah
  alternative: TUHAN; Haleluya
  rationale: Teks memakai bentuk singkat nama ilahi יָהּ, bukan bentuk lengkap יהוה. 'Yah' mempertahankan bentuk yang benar-benar terdapat dalam sumber, sementara 'Pujilah' menyampaikan daya imperatifnya.
- issue: Rujukan sufiks posesif dalam חֲסִידָיו
  choice: kepada-Nya
  alternative: milik-Nya
  rationale: Sufiks orang ketiga tunggal merujuk kepada Allah. Kapitalisasi membantu memperjelas rujukan dalam bahasa Indonesia tanpa menambahkan nama yang tidak dinyatakan dalam klausa.
- issue: Hubungan הָדָר dengan pelaksanaan hukuman
  choice: Inilah kehormatan bagi
  alternative: Ini adalah kehormatan bagi; Kemegahan ini milik
  rationale: Klausa Ibrani singkat dan dapat dipahami bahwa hal yang baru disebut merupakan kehormatan bagi umat-Nya. 'Inilah' menjaga hubungan deiktis tersebut tanpa menjelaskan lebih jauh sumber atau sifat kehormatan itu.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Susunan 'melaksanakan atas mereka' sengaja mempertahankan sasaran penghukuman, sedangkan 'hukuman yang tertulis' lebih alami daripada susunan harfiah terbalik. Bentuk 'Inilah' merangkum tindakan sebelumnya sebagai kehormatan. Semua penanda catatan kaki muncul dalam teks utama.
