base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: id
  text: Namun, pada tahun keempat seluruh buahnya harus kudus[a], sebagai puji-pujian bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kudus, puji-pujian bagi Yahweh” atau “kudus, untuk pujian bagi Yahweh.” Ungkapan Ibraninya langka dan mungkin menekankan pujian penuh sukacita yang disampaikan dengan buah itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: Namun, pada tahun keempat
  rationale: Konjungsi ו dipahami sebagai kontras dengan larangan mengenai tiga tahun sebelumnya; frasa berpreposisi menyatakan waktu.
- source_word: יִהְיֶה
  choice: harus menjadi
  rationale: Dalam konteks hukum, bentuk ini menyatakan ketetapan mengenai status buah pada tahun keempat; 'harus menjadi' terdengar alami dalam bahasa Indonesia hukum-keagamaan.
- source_word: כָּל פִּרְיוֹ
  choice: seluruh buahnya
  rationale: כָּל mencakup keseluruhan hasil buah pohon tersebut, sedangkan sufiks orang ketiga tunggal dipertahankan dengan '-nya'.
- source_word: קֹדֶשׁ
  choice: kudus
  rationale: Nomina ini berfungsi predikatif dan menetapkan buah itu sebagai sesuatu yang dikhususkan bagi Allah.
- source_word: הִלּוּלִים
  choice: untuk memuji
  rationale: Kata jamak yang langka ini berkaitan dengan pujian atau perayaan. Terjemahan ini mempertahankan fungsi pujian tanpa menambahkan gagasan teknis 'persembahan' yang tidak dinyatakan secara eksplisit.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Preposisi ל dipadukan secara alami dengan 'untuk memuji', sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Makna frasa kultis yang langka קֹדֶשׁ הִלּוּלִים לַיהוָה
  choice: kudus untuk memuji Yahweh
  alternative: kudus, puji-pujian bagi Yahweh; kudus, untuk pujian bagi Yahweh
  rationale: Susunan Ibrani dapat menunjuk pada buah yang dikhususkan dalam tindakan pujian atau perayaan. Teks utama dibuat alami tanpa mengubah הִלּוּלִים menjadi istilah teknis bagi persembahan, sementara ambiguitasnya dicatat.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama ilahi yang hadir langsung dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' menandai kontras dengan tiga tahun sebelumnya. Penanda catatan kaki [a] ditempatkan langsung sesudah 'kudus', sesuai pokok ambiguitas.
