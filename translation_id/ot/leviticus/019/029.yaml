  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: id
  text: Jangan menajiskan anak perempuanmu dengan menjadikannya pelacur,[a] supaya negeri itu tidak berzina[b] dan dipenuhi kebejatan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan menyebabkan dia melakukan pelacuran.” Kata kerja Ibrani berbentuk kausatif.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “supaya negeri itu tidak melakukan pelacuran.” Ungkapan ini secara metaforis menggambarkan masyarakat yang menjadi rusak.
    reason: lexical_alternative
  - marker: c
    text: Atau, “perbuatan mesum” atau “kejahatan.” Istilah Ibrani ini menunjuk pada kebejatan moral yang keterlaluan, sering kali dalam konteks seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: menajiskan
  rationale: Bentuk Piel dari חלל menyatakan tindakan memperlakukan sebagai tidak kudus atau mencemarkan. Dalam bahasa Indonesia, “menajiskan” mempertahankan konteks kekudusan dalam Imamat dan lebih wajar daripada “memprofanakan”.
- source_word: בִּתְּךָ
  choice: anak perempuanmu
  rationale: Padanan langsung bagi nomina tunggal dengan sufiks orang kedua maskulin tunggal.
- source_word: לְהַזְנוֹתָהּ
  choice: dengan menjadikannya pelacur
  rationale: Infinitif Hifil dari זנה dengan sufiks orang ketiga feminin tunggal bersifat kausatif. Pilihan ini menyatakan bahwa sang ayah menyebabkan anak perempuannya masuk ke dalam pelacuran.
- source_word: תִזְנֶה הָאָרֶץ
  choice: negeri itu ... berzina
  rationale: Mempertahankan metafora Ibrani yang menggambarkan seluruh masyarakat atau negeri sebagai berzina, alih-alih meratakannya menjadi kemerosotan moral secara umum.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: dipenuhi
  rationale: Dalam rangkaian akibat yang diperkenalkan oleh וְלֹא, bentuk ini menyatakan konsekuensi yang hendak dicegah; bentuk pasif “dipenuhi” alami dalam bahasa Indonesia.
- source_word: זִמָּה
  choice: kebejatan
  rationale: Istilah ini menunjuk pada kejahatan moral yang keterlaluan, sering kali berkonteks seksual. “Kebejatan” cukup luas untuk mempertahankan cakupannya tanpa membatasinya hanya pada pelanggaran seksual.
theological_decisions:
- issue: Cara menerjemahkan metafora negeri yang ‘berzina’
  choice: Mempertahankan metafora dengan “negeri itu tidak berzina”.
  alternative: “negeri itu tidak menjadi rusak secara moral” atau “negeri itu tidak jatuh ke dalam pelacuran”
  rationale: Metafora seksual dalam teks menghubungkan tindakan perseorangan dengan kerusakan komunal. Mempertahankannya menjaga daya retoris dan ketegangan teologis teks tanpa memasukkan kategori teologis tambahan.
- issue: Cara menerjemahkan חלל dalam konteks kekudusan
  choice: Menggunakan “menajiskan”.
  alternative: “mencemarkan”, “menghinakan”, atau “memprofanakan”
  rationale: “Menajiskan” mempertahankan pertentangan kudus–tidak kudus yang penting dalam Imamat, sekaligus lebih mudah dipahami pembaca Indonesia masa kini daripada “memprofanakan”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menajiskan” mempertahankan laras kekudusan khas Imamat; “pelacur” dan “berzina” menyampaikan metafora seksual secara jelas tanpa eufemisme berlebihan. Susunan klausa dibuat alami dalam bahasa Indonesia sambil mempertahankan hubungan larangan dan akibat.
