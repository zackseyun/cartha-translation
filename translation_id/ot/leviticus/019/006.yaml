  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: id
  text: Pada hari kamu mempersembahkan kurban itu, kurban itu harus dimakan, dan juga pada hari berikutnya. Namun, apa yang masih tersisa sampai hari ketiga harus dibakar dalam api.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: pada hari kamu mempersembahkannya
  rationale: Frasa ini secara harfiah berkaitan dengan 'hari kurbanmu'; bentuk verbal dalam bahasa Indonesia lebih alami dan tetap mempertahankan konteks persembahan kurban.
- source_word: יֵאָכֵל
  choice: harus dimakan
  rationale: Bentuk Nifal menyatakan tindakan pasif; dalam konteks hukum, 'harus' menyampaikan ketentuan, bukan sekadar izin.
- source_word: וּמִמָּחֳרָת
  choice: dan pada hari berikutnya
  rationale: מָחֳרָת menunjuk pada hari sesudahnya. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan urutan waktu dalam konteks.
- source_word: וְהַנּוֹתָר
  choice: Namun, apa yang masih tersisa
  rationale: Partisip ini menunjuk pada bagian yang tertinggal. 'Namun' secara alami menandai peralihan dari waktu makan yang diperbolehkan kepada aturan pembuangan sisanya.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: sampai hari ketiga
  rationale: Terjemahan ini mempertahankan batas waktu yang dinyatakan oleh עַד tanpa mengubahnya menjadi batas yang lebih tegas daripada teks sumber.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: harus dibakar dalam api
  rationale: Bentuk Nifal diterjemahkan secara pasif, sedangkan בָּאֵשׁ dipertahankan dengan gambaran konkret 'dalam api'.
