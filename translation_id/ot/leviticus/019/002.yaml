  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: id
  text: 'Berbicaralah kepada seluruh umat Israel[a] dan katakanlah kepada mereka: ‘Hendaklah kamu kudus[b], sebab Aku, Yahweh, Allahmu, kudus.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh jemaah anak-anak Israel”; maksudnya seluruh komunitas orang Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “Jadilah kudus” atau “Kamu harus kudus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Imperatif piel yang memerintahkan Musa menyampaikan firman secara langsung; bentuk ini alami dan tetap mempertahankan nada resmi.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: עֵדָה menunjuk kepada komunitas perjanjian secara kolektif, sedangkan בְּנֵי יִשְׂרָאֵל adalah ungkapan Ibrani bagi orang Israel. 'Seluruh umat Israel' jelas, alami, dan mencakup komunitas yang disapa.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: dan katakanlah kepada mereka
  rationale: Mempertahankan urutan perintah dan gaya langsung wacana hukum Ibrani.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: Hendaklah kamu kudus
  rationale: Konstruksi adjektiva predikatif dengan bentuk imperfek menyampaikan tuntutan yang berlaku bagi seluruh komunitas. 'Hendaklah' mempertahankan daya perintah tanpa menjadikannya sekadar prediksi.
- source_word: קָדוֹשׁ
  choice: kudus
  rationale: '''Kudus'' adalah padanan mapan yang mencakup keterpisahan bagi Allah sekaligus kemurnian yang dituntut konteks, tanpa mereduksinya menjadi hanya ''terpisah''.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Akhiran orang kedua jamak merujuk kepada umat yang disapa; bahasa Indonesia secara alami dapat memakai bentuk kolektif 'Allahmu'.
theological_decisions:
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak Israel
  rationale: Secara bentuk ungkapan itu berarti 'anak-anak lelaki/keturunan Israel', tetapi dalam konteks ini menunjuk kepada komunitas Israel secara keseluruhan. 'Umat Israel' menyampaikan rujukan korporat tanpa menyiratkan bahwa hanya laki-laki atau anak-anak yang disapa; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- issue: Daya ujar קְדֹשִׁים תִּהְיוּ
  choice: Hendaklah kamu kudus
  alternative: Kamu harus kudus; Kamu akan kudus
  rationale: Bentuk Ibrani dapat terdengar sebagai perintah, kewajiban, atau pernyataan dengan nuansa futuris. Dalam konteks hukum, daya perintah paling menonjol, tetapi kemungkinan terjemahan lain tetap dicatat agar ketegangan bentuknya tidak dihapus.
- issue: Dasar kekudusan umat
  choice: sebab Aku, Yahweh, Allahmu, kudus
  alternative: karena Akulah Yahweh, Allahmu, yang kudus
  rationale: Susunan ini mempertahankan hubungan eksplisit antara kekudusan umat dan kekudusan Allah tanpa menambahkan penjelasan teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, resmi, dan mudah dipahami. 'Umat' dipilih daripada 'jemaah' dalam teks utama karena lebih alami untuk komunitas Israel secara keseluruhan. Sapaan jamak Ibrani diterjemahkan dengan 'kamu', yang tidak menandai jumlah dalam bahasa Indonesia; konteks kolektif sudah jelas. Tanda petik menunjukkan isi perkataan yang harus disampaikan Musa.
