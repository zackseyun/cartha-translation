base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: id
  text: Apabila kamu mempersembahkan kurban keselamatan kepada Yahweh, persembahkanlah itu sedemikian rupa sehingga kamu diterima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “untuk penerimaanmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Apabila
  rationale: Dalam konteks hukum, frasa ini memperkenalkan keadaan yang menjadi dasar perintah; “apabila” mencakup nuansa waktu dan syarat secara alami dalam bahasa Indonesia.
- source_word: תִזְבְּחוּ / תִּזְבָּחֻהוּ
  choice: mempersembahkan / persembahkanlah
  rationale: Kata kerja זבח menunjuk pada tindakan mengurbankan dalam ibadah. “Mempersembahkan” terdengar alami dan bermartabat, sedangkan pengulangan kata kerja Ibrani tetap dipertahankan.
- source_word: זֶבַח שְׁלָמִים
  choice: kurban keselamatan
  rationale: Ini adalah nama jenis kurban yang lazim. “Keselamatan” mempertahankan hubungan leksikal dengan שׁלם tanpa mempersempit maknanya menjadi sekadar persekutuan atau kedamaian subjektif.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai arah atau peruntukan kurban, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: לִרְצֹנְכֶם
  choice: sedemikian rupa sehingga kamu diterima
  rationale: Dalam hukum kurban, רָצוֹן menyatakan keberterimaan di hadapan Allah. Rumusan ini menyampaikan maksud kultisnya dengan bahasa Indonesia yang jelas sambil menghindari tafsiran bahwa kurban dilakukan sesuka hati pemberi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks menyebut nama perjanjian secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Makna לִרְצֹנְכֶם dalam hukum kurban
  choice: sedemikian rupa sehingga kamu diterima
  alternative: untuk penerimaanmu; sesuai dengan kehendakmu
  rationale: Konteks kultis mendukung keberterimaan orang yang mempersembahkan kurban di hadapan Allah. Alternatif “sesuai dengan kehendakmu” berisiko mengalihkan makna kepada pilihan pribadi penyembah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal “kurban keselamatan” dipakai sebagai nama kategori kurban; perintah jamak Ibrani dinyatakan dengan “kamu” yang dapat merujuk kepada kelompok.
