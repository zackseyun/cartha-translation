  text: וְ/הֵבִ֤יא אֶת אֲשָׁמ/וֹ֙ לַֽ/יהוָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: id
  text: 'Ia harus membawa korban penebus salahnya[a] kepada Yahweh, ke pintu masuk Kemah Pertemuan: seekor domba jantan sebagai korban penebus salah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “korban pemulihan.” Istilah Ibrani אָשָׁם dapat menunjuk pada kesalahan maupun pada korban yang dipersembahkan sebagai pemulihan atas kesalahan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Ia harus membawa
  rationale: Bentuk verba dalam konteks hukum menyatakan kewajiban; “harus” terdengar alami dalam bahasa Indonesia modern.
- source_word: אֲשָׁמוֹ
  choice: persembahan penebus salahnya
  rationale: אָשָׁם di sini menunjuk pada kurban yang dipersembahkan berkenaan dengan kesalahan dan pemulihannya; pilihan ini mempertahankan kaitan dengan kesalahan tanpa menyempitkannya menjadi sekadar rasa bersalah.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan, dan nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: אֶל פֶּתַח
  choice: ke pintu
  rationale: פֶּתַח berarti bukaan atau jalan masuk; “pintu” alami untuk lokasi masuk ke kemah.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Sebutan baku bagi tempat kudus tempat Yahweh bertemu dengan umat-Nya; kapitalisasi menandai nama bangunan khusus.
- source_word: אֵיל
  choice: seekor domba jantan
  rationale: אֵיל secara khusus menunjuk pada domba jantan dewasa.
- source_word: אָשָׁם
  choice: sebagai persembahan penebus salah
  rationale: Frasa akhir menjelaskan fungsi kurban dari domba jantan tersebut dan mengulang istilah אָשָׁם.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna אָשָׁם
  choice: persembahan penebus salah
  alternative: persembahan karena salah; persembahan pemulihan
  rationale: Istilah ini dapat menunjuk baik pada kesalahan maupun pada persembahan reparatif yang berkaitan dengannya. Terjemahan utama menonjolkan kategori kurban sambil tetap mempertahankan unsur kesalahan; catatan kaki menjaga alternatif maknanya.
translation_notes:
  register: Bahasa hukum-keagamaan yang modern dan bermartabat. Susunan kalimat mengikuti alur Ibrani, tetapi memakai “harus” sebagai penanda kewajiban yang lebih wajar daripada bentuk futur dalam bahasa Indonesia.
