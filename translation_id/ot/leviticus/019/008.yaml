id: LEV.19.8
reference: Leviticus 19:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: id
  text: Siapa pun yang memakannya harus menanggung kesalahannya[a], sebab ia telah menajiskan apa yang kudus bagi Yahweh[b]. Orang itu harus dilenyapkan dari tengah bangsanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "harus menanggung akibat kesalahannya." Ungkapan Ibrani ini dapat mencakup baik kesalahan maupun akibat yang harus ditanggung karena kesalahan itu.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud dengan "apa yang kudus bagi Yahweh" ialah sesuatu yang telah dikhususkan bagi Yahweh; dalam konteks ini, daging kurban.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, "jiwa itu harus dilenyapkan dari tengah bangsanya." Dalam bahasa hukum Ibrani, "jiwa" berarti orang tersebut. Formula "dilenyapkan" tidak menjelaskan apakah hukumannya berupa kematian, pengucilan, atau penghakiman langsung dari Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: Siapa pun yang memakannya
  rationale: Bentuk partisip dengan sufiks merujuk secara umum kepada siapa saja yang memakan daging kurban tersebut; pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya generiknya.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: harus menanggung kesalahannya
  rationale: Ungkapan Ibrani mencakup kesalahan serta tanggung jawab atas akibatnya. Terjemahan ini mempertahankan idiom 'menanggung' tanpa mempersempitnya menjadi hukuman saja.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi hukuman yang dinyatakan dan terdengar wajar dalam ragam bahasa yang bermartabat.
- source_word: קֹדֶשׁ יְהוָה
  choice: apa yang kudus bagi Yahweh
  rationale: Frasa ini menunjuk kepada sesuatu yang dikhususkan bagi Yahweh—dalam konteks ini daging kurban—tanpa menambahkan kata 'persembahan' yang tidak eksplisit dalam klausa ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung sesuai kebijakan proyek.
- source_word: חִלֵּל
  choice: telah menajiskan
  rationale: Bentuk piel menyatakan tindakan memperlakukan yang kudus sebagai sesuatu yang biasa atau tidak kudus. 'Menajiskan' menyampaikan pelanggaran terhadap kekudusan secara alami dalam bahasa Indonesia.
- source_word: וְנִכְרְתָה
  choice: harus dilenyapkan
  rationale: Pilihan ini mempertahankan formula hukuman perjanjian tanpa menentukan apakah pelaksanaannya berupa kematian, pengusiran, atau tindakan penghakiman ilahi.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: Orang itu
  rationale: Dalam konteks hukum, נֶפֶשׁ menunjuk kepada pribadi secara utuh, bukan khusus kepada 'jiwa' sebagai unsur terpisah.
- source_word: מֵעַמֶּיהָ
  choice: dari tengah bangsanya
  rationale: Menyampaikan pemisahan orang tersebut dari kelompok umat atau kerabatnya, sekaligus mengikuti idiom Indonesia yang alami.
theological_decisions:
- issue: Makna formula hukuman וְנִכְרְתָה ('dilenyapkan')
  choice: Mempertahankan formula 'harus dilenyapkan' tanpa menentukan mekanismenya.
  alternative: Dihukum mati; dikucilkan; disingkirkan melalui penghakiman langsung dari Allah.
  rationale: Ayat ini tidak menjelaskan apakah hukuman tersebut berarti kematian, pengusiran dari komunitas, atau penghakiman ilahi. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat dipertahankan dengan jelas. Istilah 'apa yang kudus bagi Yahweh' menghindari penafsiran berlebihan, sedangkan 'dilenyapkan' menjaga ketidakpastian formula hukuman Ibrani.
