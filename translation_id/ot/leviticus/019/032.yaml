base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: id
  text: Di hadapan orang yang beruban, engkau harus berdiri[a]; engkau harus menghormati seorang laki-laki tua[b] dan takut akan Allahmu. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Di hadapan uban engkau harus berdiri.” Uban dipakai sebagai gambaran konkret bagi orang berusia lanjut.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “hormatilah wajah seorang laki-laki tua.” Kata Ibrani yang diterjemahkan “laki-laki tua” berbentuk maskulin tunggal dan dalam konteks tertentu juga dapat diterjemahkan “seorang tua-tua.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: di hadapan orang yang beruban
  rationale: Ungkapan ini secara harfiah mengacu pada uban, tetapi secara metonimis menunjuk kepada orang berusia lanjut. Pilihan ini mempertahankan gambaran konkret Ibrani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: תָּקוּם
  choice: engkau harus berdiri
  rationale: Kata kerja קום dalam konteks ini memerintahkan seseorang berdiri sebagai tanda hormat.
- source_word: וְהָדַרְתָּ פְּנֵי זָקֵן
  choice: engkau harus menghormati orang yang sudah tua
  rationale: הדר bentuk piel berarti memberi hormat atau menunjukkan penghargaan. Frasa 'wajah orang tua' merupakan idiom Ibrani yang paling alami dialihkan sebagai menghormati orang yang sudah tua.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: dan takut akan Allahmu
  rationale: Kata ירא mempertahankan bobot takut, gentar, dan hormat di hadapan Allah; 'takut akan' merupakan ungkapan Indonesia yang mapan dan tidak mereduksinya menjadi rasa hormat biasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
theological_decisions:
- issue: Cakupan זָקֵן yang berbentuk maskulin tunggal
  choice: orang yang sudah tua
  alternative: laki-laki tua; tua-tua
  rationale: Dalam konteks perintah umum, kata maskulin tunggal dapat berfungsi representatif. Pilihan netral ini menghindari pembatasan yang tidak dituntut konteks, sedangkan 'tua-tua' dapat menyiratkan jabatan pemimpin yang belum tentu dimaksud.
- issue: Makna takut kepada Allah
  choice: takut akan Allahmu
  alternative: menghormati Allahmu; gentar terhadap Allahmu
  rationale: Pilihan 'takut' mempertahankan ketegangan teologis antara rasa gentar, hormat, dan ketaatan, tanpa melunakkannya menjadi penghormatan belaka.
- issue: Penyebutan nama ilahi
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; transliterasi Yahweh mempertahankan fungsi tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina tunggal 'engkau' mempertahankan sapaan pribadi dalam bahasa sumber. Struktur paralel ayat dipertahankan tanpa mempertahankan idiom 'wajah' secara kaku dalam teks utama.
