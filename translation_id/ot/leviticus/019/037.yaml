  source_fidelity: 'Terjemahan dengan tepat mencakup seluruh unsur Ibrani: waw penghubung yang secara kontekstual dapat bernuansa simpulan diterjemahkan “Karena itu”; שׁמר dinyatakan sebagai kewajiban menaati; kedua kemunculan כָּל dipertahankan; חֻקֹּתַי dan מִשְׁפָּטַי dibedakan sebagai “ketetapan-Ku” dan “peraturan-Ku”; עשה diterjemahkan secara idiomatis “melaksanakannya”; dan אֲנִי יְהוָה diterjemahkan “Akulah Yahweh.” Tidak ada penambahan makna teologis yang menentukan.'
