id: LEV.19.37
reference: Leviticus 19:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: id
  text: Karena itu, kamu harus menaati segala ketetapan-Ku dan segala peraturan-Ku[a] serta melaksanakannya. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala ketentuan-Ku dan segala keputusan hukum-Ku.” Bahasa Ibrani memakai dua istilah hukum yang berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Karena itu, kamu harus menaati
  rationale: שׁמר dalam konteks hukum perjanjian berarti menjaga dengan cara menaati atau mematuhi. 'Menaati' alami dalam bahasa Indonesia; 'Karena itu' menyampaikan fungsi penutup dan rangkuman dari waw penghubung dalam konteks pasal.
- source_word: כָּל
  choice: segala
  rationale: Mempertahankan cakupan menyeluruh dari kedua kemunculan כָּל dan terdengar wajar sebelum nomina hukum jamak kolektif.
- source_word: חֻקֹּתַי
  choice: ketetapan-Ku
  rationale: חֻקִּים menunjuk pada ketentuan atau ketetapan yang ditetapkan; pilihan ini mempertahankan ragam hukum dan membedakannya dari מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: peraturan-Ku
  rationale: מִשְׁפָּטִים dapat menunjuk pada keputusan hukum, aturan, atau peraturan. 'Peraturan' jelas bagi pembaca modern dan tetap dibedakan dari 'ketetapan'.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: serta melaksanakannya
  rationale: עשה dengan objek berupa ketentuan hukum berarti melakukan atau menjalankannya. 'Melaksanakannya' lebih alami daripada terjemahan harfiah 'melakukannya' dalam konteks hukum.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya ikat bentuk וּשְׁמַרְתֶּם
  choice: kamu harus menaati
  alternative: kamu akan menaati; taatilah
  rationale: Dalam konteks rangkaian hukum, bentuk tersebut berfungsi sebagai tuntutan, bukan sekadar prediksi. 'Harus' menyampaikan kewajiban tanpa mengubahnya menjadi bentuk imperatif langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan orang kedua jamak Ibrani diterjemahkan dengan 'kamu' yang dapat bersifat kolektif; sufiks ilahi ditulis dengan huruf kapital menurut kebiasaan ejaan Alkitab Indonesia. Ungkapan penegasan אֲנִי יְהוָה diterjemahkan 'Akulah Yahweh'.
