  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: id
  text: 'Jangan mengutuk seorang yang tuli dan jangan menaruh penghalang yang membuat seorang yang buta tersandung di depannya; tetapi takutlah akan Allahmu: Akulah Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְקַלֵּל
  choice: mengutuk
  rationale: Bentuk Piel dari קלל di sini menyatakan tindakan mengutuk atau menghina. “Mengutuk” merupakan padanan langsung yang mempertahankan daya moral dan verbal larangan ini.
- source_word: חֵרֵשׁ
  choice: seorang yang tuli
  rationale: Bentuk Ibrani adalah tunggal maskulin dan berfungsi sebagai contoh konkret dalam hukum. Bahasa Indonesia secara wajar memakai “seorang yang tuli”; keterangan kaki menjelaskan bentuk gramatikal sumber tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Ungkapan ini mempertahankan makna ruang dari לִפְנֵי dan sesuai dengan gambaran menaruh penghalang di jalur orang yang buta.
- source_word: עִוֵּר
  choice: seorang yang buta
  rationale: Bentuk tunggal maskulin ini merupakan contoh representatif dalam ketetapan hukum. “Seorang yang buta” alami dan konkret dalam bahasa Indonesia.
- source_word: תִתֵּן
  choice: menaruh
  rationale: Walaupun arti dasarnya “memberi”, dalam konteks penempatan suatu penghalang padanan idiomatisnya adalah “menaruh”.
- source_word: מִכְשֹׁל
  choice: penghalang yang dapat membuat ... tersandung
  rationale: Padanan ini mempertahankan gagasan tentang sesuatu yang menyebabkan orang tersandung, tanpa menambahkan unsur “batu” yang tidak dinyatakan secara eksplisit oleh kata Ibrani.
- source_word: וְיָרֵאתָ
  choice: Sebaliknya, takutlah
  rationale: Waw menghubungkan perintah ini dengan larangan sebelumnya. “Sebaliknya” mengungkapkan peralihan kontras menuju pertanggungjawaban di hadapan Allah, sedangkan bentuk perintah Indonesia menyampaikan daya kewajibannya secara alami.
- source_word: מֵאֱלֹהֶיךָ
  choice: akan Allahmu
  rationale: Dengan verba ירא, preposisi מן menandai objek rasa takut atau hormat. Bahasa Indonesia secara idiomatis memakai “takut akan Allahmu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Bentuk maskulin tunggal sebagai contoh representatif dalam hukum
  choice: Terjemahkan secara konkret sebagai “seorang yang tuli” dan “seorang yang buta”, dengan catatan mengenai bentuk maskulin tunggal Ibrani
  alternative: “laki-laki yang tuli” dan “laki-laki yang buta”; atau “orang-orang tuli” dan “orang-orang buta”
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal sebagai contoh kasus hukum. Bahasa Indonesia tidak menandai gender secara gramatikal pada kata-kata ini; menambahkan “laki-laki” akan terdengar tidak alami dan berisiko menjadikan jenis kelamin sebagai inti larangan. Catatan kaki mempertahankan informasi bentuk sumber serta cakupannya yang representatif.
- issue: Daya klausa motivasi terakhir
  choice: “Sebaliknya, takutlah akan Allahmu” sebagai dasar etis bagi larangan
  alternative: “dan takutlah akan Allahmu”
  rationale: Klausa tersebut mengalihkan perhatian dari penyalahgunaan yang mungkin luput dari pengawasan manusia kepada pertanggungjawaban di hadapan Allah. “Sebaliknya” menyampaikan fungsi wacana itu tanpa mengubah isi perintah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan dua larangan, motivasi untuk takut akan Allah, dan pernyataan nama ilahi. Ungkapan “penghalang yang dapat membuat ... tersandung” dipilih agar gambaran konkret teks jelas bagi pembaca umum.
