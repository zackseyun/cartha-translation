  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: id
  text: Janganlah engkau membenci saudaramu dalam hatimu. Hendaklah engkau sungguh-sungguh menegur sesamamu, dan janganlah engkau menanggung dosa karena dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jangan menjadi bersalah karena dia” atau “jangan turut menanggung dosanya.” Ungkapan Ibrani ini bersifat idiomatis dan mungkin berarti bahwa seseorang menjadi bersalah karena tidak menegur perbuatan yang salah.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: membenci
  rationale: Kata kerja שׂנא secara langsung menyatakan kebencian; pilihan ini mempertahankan daya moral larangan tanpa memperlunaknya.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: אָח dapat menunjuk saudara kandung atau sesama anggota komunitas perjanjian. “Saudaramu” mempertahankan citra kekeluargaan dan cakupan komunalnya dalam konteks.
- source_word: בִּלְבָבֶךָ
  choice: di dalam hatimu
  rationale: לֵבָב menunjuk batin, termasuk pikiran dan niat. Ungkapan Indonesia ini alami dan mempertahankan penekanan pada kebencian yang dipendam.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: harus sungguh-sungguh menegur
  rationale: Infinitif absolut yang diikuti bentuk finit menguatkan perintah. “Harus sungguh-sungguh” menyampaikan penegasan itu, sedangkan “menegur” sesuai dengan konteks kesalahan moral.
- source_word: עֲמִיתֶךָ
  choice: sesamamu
  rationale: עָמִית menunjuk orang yang merupakan sesama anggota komunitas. “Sesamamu” merupakan padanan Indonesia yang alami tanpa membatasi maknanya pada orang yang tinggal berdekatan.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: menanggung dosa karena dia
  rationale: Ungkapan נָשָׂא חֵטְא dapat berarti menanggung dosa atau menjadi bersalah, sementara עָלָיו dapat menyatakan kaitan atau sebab. Terjemahan ini dekat dengan bentuk Ibrani dan tetap membiarkan ambiguitas idiomatisnya dijelaskan dalam catatan.
theological_decisions:
- issue: Cakupan bahasa kekerabatan dalam etika perjanjian
  choice: Mempertahankan bentuk tunggal “saudaramu” dan “sesamamu”.
  alternative: “sesama orang” atau “sesama orang Israel”
  rationale: Bahasa Ibrani memakai bentuk tunggal maskulin dengan fungsi representatif. Padanan yang dipilih mempertahankan bahasa relasional sumber tanpa menyempitkannya secara eksplisit hanya kepada saudara kandung atau memperluasnya melampaui konteks.
- issue: Hubungan antara kegagalan menegur dan dosa
  choice: “jangan menanggung dosa karena dia”
  alternative: “jangan menjadi bersalah karena dia” atau “jangan turut menanggung dosanya”
  rationale: Konstruksi Ibrani memungkinkan nuansa menanggung dosa, mendatangkan kesalahan atas diri sendiri, atau terlibat dalam dosa orang itu. Teks utama mempertahankan ketegangan tersebut, dengan alternatif dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” dipakai untuk mempertahankan sapaan orang kedua tunggal dalam teks hukum, sedangkan susunan kalimat dibuat alami bagi pembaca umum.
