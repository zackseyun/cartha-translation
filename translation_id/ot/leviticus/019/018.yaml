id: LEV.19.18
reference: Leviticus 19:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: id
  text: Janganlah membalas dendam atau menyimpan dendam terhadap orang-orang sebangsamu,[a] tetapi kasihilah sesamamu seperti dirimu sendiri. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak laki-laki bangsamu”; maksudnya dapat pula diungkapkan sebagai “orang-orang dari bangsamu sendiri.”
    reason: Menjelaskan bentuk harfiah frasa Ibrani sekaligus alternatif idiomatisnya.
lexical_decisions:
- source_word: תִקֹּם
  choice: membalas dendam
  rationale: Kata kerja נקם menyatakan tindakan menuntut atau melakukan pembalasan; “membalas dendam” merupakan ungkapan Indonesia yang alami dan mempertahankan daya aktifnya.
- source_word: תִטֹּר
  choice: menyimpan dendam
  rationale: Dalam konteks ini נטר berarti terus memelihara kemarahan atau kebencian; “menyimpan dendam” menangkap aspek berkelanjutan tersebut.
- source_word: בְּנֵי עַמֶּךָ
  choice: orang-orang sebangsamu
  rationale: Secara harfiah frasa ini berarti “anak-anak laki-laki bangsamu,” tetapi secara idiomatis menunjuk para anggota bangsa atau umat sendiri. Pilihan ini alami dalam bahasa Indonesia tanpa mempersempit acuannya hanya kepada laki-laki; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְאָהַבְתָּ
  choice: kasihilah
  rationale: Bentuk waw + perfek di dalam konteks hukum memiliki daya perintah. Imperatif “kasihilah” menyampaikan kewajiban itu secara langsung dan wajar dalam bahasa Indonesia.
- source_word: לְרֵעֲךָ
  choice: sesamamu
  rationale: רֵעַ dapat berarti kawan, rekan, atau sesama. “Sesamamu” cocok dengan konteks etis-komunal dan mempertahankan keluwesan cakupan istilah sumber.
- source_word: כָּמוֹךָ
  choice: seperti dirimu sendiri
  rationale: Ungkapan perbandingan ini secara alami menyatakan diri sendiri sebagai tolok ukur kasih kepada sesama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
theological_decisions:
- issue: Cakupan objek larangan dan perintah
  choice: Mempertahankan rujukan langsung kepada anggota bangsa sendiri melalui “orang-orang sebangsamu,” sementara רֵעַ diterjemahkan “sesamamu.”
  alternative: Meratakan kedua ungkapan menjadi bahasa universal yang sama, atau menerjemahkan בְּנֵי עַמֶּךָ secara kaku sebagai “anak-anak laki-laki bangsamu.”
  rationale: Teks memakai dua ungkapan yang berbeda. Terjemahan mempertahankan kekhususan komunal pada frasa pertama dan keluwesan leksikal רֵעַ pada frasa kedua tanpa memperluas atau membatasi maknanya berdasarkan penafsiran teologis kemudian.
- issue: Penerjemahan nama ilahi
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Pilihan ini mempertahankan nama pribadi יהוה sebagaimana terdapat dalam teks sumber, alih-alih menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk larangan “janganlah” dan perintah “kasihilah” menjaga nada hukum-perjanjian tanpa terdengar usang. Tanda baca memisahkan penegasan penutup “Akulah Yahweh” sebagai deklarasi ilahi.
