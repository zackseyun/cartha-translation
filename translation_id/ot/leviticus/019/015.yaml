  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: id
  text: Jangan berbuat tidak adil dalam pengadilan. Jangan memihak orang miskin ataupun memberi perlakuan istimewa kepada orang besar. Dengan keadilan[a] engkau harus menghakimi sesamamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kebenaran.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “memihak” dan “memberi perlakuan istimewa” secara harfiah berbicara tentang “mengangkat wajah orang miskin” dan “menghormati wajah orang besar”; keduanya menunjuk pada perlakuan berat sebelah dalam pengadilan.
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: tidak adil dalam pengadilan
  rationale: Gabungan ini menunjuk pada ketidakadilan dalam proses atau putusan hukum. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan konteks yudisial.
- source_word: תִשָּׂא פְנֵי דָל
  choice: memihak orang miskin
  rationale: Idiom harfiahnya, 'mengangkat wajah orang miskin', berarti menunjukkan keberpihakan. 'Memihak' menyampaikan larangan favoritisme secara jelas.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: memberi perlakuan istimewa kepada orang besar
  rationale: Idiom ini melarang sikap segan atau penghormatan yang menghasilkan perlakuan berat sebelah kepada orang berkedudukan tinggi. Pilihan ini lebih alami daripada mempertahankan gambaran 'menghormati wajah'.
- source_word: גָדוֹל
  choice: orang besar
  rationale: Dalam konteks ini kata tersebut menunjuk pada orang yang tinggi kedudukan atau pengaruhnya, bukan ukuran fisik. 'Orang besar' mempertahankan keluasan istilah sumber.
- source_word: בְּצֶדֶק
  choice: dengan keadilan
  rationale: Dalam konteks pengadilan, צֶדֶק terutama menyatakan keadilan atau kelurusan putusan, sambil tetap mengandung bobot moral.
- source_word: תִּשְׁפֹּט
  choice: engkau harus menghakimi
  rationale: Bentuk ini menyatakan kewajiban hukum. 'Menghakimi' mempertahankan verba sumber dan konteks pemberian putusan.
- source_word: עֲמִיתֶךָ
  choice: sesamamu
  rationale: Istilah ini menunjuk pada sesama anggota komunitas. 'Sesamamu' alami, ringkas, dan tidak membatasinya pada orang yang tinggal berdekatan.
theological_decisions:
- issue: Makna צֶדֶק dalam konteks hukum dan etika
  choice: dengan keadilan
  alternative: dengan kebenaran
  rationale: Konteks pengadilan mendukung 'keadilan', tetapi istilah Ibrani juga dapat membawa nuansa kelurusan moral. Alternatif dicatat agar rentang maknanya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'engkau' mempertahankan sapaan maskulin tunggal dalam teks Ibrani tanpa menyiratkan bahwa perintah hanya berlaku bagi laki-laki. Istilah 'pengadilan' memperjelas ranah hukum, sedangkan 'orang besar' mempertahankan cakupan sosial yang lebih luas daripada hanya 'orang kaya' atau 'penguasa'.
