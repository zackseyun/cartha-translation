  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: id
  text: Janganlah kamu makan di atas darah.[a] Janganlah kamu melakukan praktik tenung atau menafsirkan pertanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersama darah.” Ungkapan Ibraninya sulit dan mungkin merujuk pada memakan daging yang masih mengandung darah atau pada keikutsertaan dalam perjamuan ritual yang berkaitan dengan darah.
    reason: alternative_reading
  - marker: b
    text: Atau “menentukan waktu mujur” atau “melakukan ramalan.” Makna tepat kata Ibraninya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: Janganlah kamu makan
  rationale: Bentuk imperfek yang dinegasikan dalam konteks hukum menyatakan larangan. Bentuk ini alami, jelas, dan tetap bermartabat dalam bahasa Indonesia.
- source_word: עַל הַדָּם
  choice: di atas darah
  rationale: Ungkapan Ibrani ini sulit dan rujukan praktiknya tidak pasti. Terjemahan yang relatif harfiah mempertahankan preposisi עַל serta ambiguitas teks, sedangkan kemungkinan maknanya dijelaskan dalam catatan kaki.
- source_word: תְנַחֲשׁוּ
  choice: melakukan tenung
  rationale: Dalam bentuk piel, נחשׁ menunjuk pada praktik mencari pengetahuan gaib atau melakukan divinasi. 'Melakukan tenung' jelas bagi pembaca modern dan sesuai dengan larangan terhadap suatu praktik.
- source_word: תְעוֹנֵנוּ
  choice: meramal berdasarkan pertanda
  rationale: Makna verba ini diperdebatkan, tetapi berkaitan dengan peramalan, pembacaan pertanda, atau penentuan waktu yang dianggap membawa tanda tertentu. Pilihan ini menyampaikan kemungkinan utama tanpa memakai ungkapan tradisional yang kabur.
theological_decisions:
- issue: Seberapa khusus ungkapan עַל הַדָּם harus diterjemahkan
  choice: Mempertahankan ungkapan relatif harfiah 'di atas darah' dalam teks utama
  alternative: '''bersama darah'', ''sementara darahnya masih ada'', atau ''dalam perjamuan ritual yang melibatkan darah'''
  rationale: Praktik tepat yang dilarang tidak pasti. Ungkapan tersebut dapat merujuk pada memakan daging yang masih mengandung darah, makan dalam ritus yang berkaitan dengan darah, atau praktik kultis lain. Teks utama tidak memilih salah satu tafsiran secara diam-diam.
- issue: Makna תְעוֹנֵנוּ
  choice: meramal berdasarkan pertanda
  alternative: '''menentukan waktu mujur'', ''melakukan ramalan'', atau ''mempraktikkan tenung'''
  rationale: Etimologi dan cakupan praktik yang dimaksud tidak sepenuhnya pasti. Terjemahan ini menyatakan ranah peramalan sambil mempertahankan catatan alternatif yang relevan.
translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat digunakan melalui bentuk 'Janganlah kamu'. Istilah 'tenung' dipertahankan karena ringkas dan masih dikenal, lalu dipasangkan dengan ungkapan yang lebih eksplisit, 'meramal berdasarkan pertanda'. Semua ambiguitas penting dari ungkapan Ibrani dipertahankan melalui teks utama dan catatan kaki.
