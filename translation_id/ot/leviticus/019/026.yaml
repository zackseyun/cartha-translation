  naturalness: “Janganlah kamu” sesuai dengan register hukum yang jelas dan bermartabat. Kolokasi “melakukan praktik tenung” lebih wajar dan eksplisit daripada “melakukan tenung,” sementara “menafsirkan pertanda” adalah ungkapan modern yang alami.
