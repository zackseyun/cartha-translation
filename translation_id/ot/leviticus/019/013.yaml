  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: id
  text: Jangan menindas sesamamu atau merampas miliknya. Jangan kautahan upah pekerja upahan hingga pagi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: menindas
  rationale: Kata kerja ini mencakup penindasan melalui penyalahgunaan kuasa atau penahanan hak orang lain; 'menindas' mempertahankan cakupan etisnya yang luas.
- source_word: רֵעֲךָ
  choice: sesamamu
  rationale: Dalam konteks hukum-etis Taurat, kata ini menunjuk kepada orang lain dalam lingkungan sosial seseorang; 'sesamamu' alami dan mempertahankan kaitannya dengan perintah mengasihi sesama.
- source_word: תִגְזֹל
  choice: merampas miliknya
  rationale: Kata גזל menunjuk pada pengambilan secara paksa atau tidak sah. Penambahan 'miliknya' membuat objek tersirat dalam bahasa Ibrani menjadi wajar dan jelas dalam bahasa Indonesia.
- source_word: תָלִין
  choice: jangan kautahan semalam
  rationale: Secara harfiah upah itu 'jangan bermalam' pada si pemberi kerja; dalam konteks pembayaran, 'jangan kautahan semalam' menyampaikan tindakan menunda pembayaran dengan alami.
- source_word: פְּעֻלַּת
  choice: upah
  rationale: Dalam gabungan dengan pekerja upahan, kata ini menunjuk pada imbalan atas pekerjaan, bukan pekerjaan itu sendiri.
- source_word: שָׂכִיר
  choice: pekerja upahan
  rationale: Istilah ini menunjuk pada orang yang bekerja dengan menerima upah; pilihan ini tepat dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: אִתְּךָ
  choice: kautahan
  rationale: Makna harfiah 'bersamamu' menunjukkan bahwa upah masih berada dalam penguasaan pemberi kerja; makna relasional itu dinyatakan secara idiomatis melalui verba 'tahan'.
- source_word: עַד בֹּקֶר
  choice: sampai pagi
  rationale: Pilihan ini mempertahankan batas waktu konkret dalam teks sumber.
