  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: id
  text: Janganlah kamu berbuat tidak adil dalam peradilan, dalam ukuran panjang, bobot, atau takaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Janganlah kamu melakukan ketidakadilan dalam keputusan hukum, dalam ukuran, bobot, atau ukuran takaran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: Janganlah kamu berbuat
  rationale: Bentuk larangan orang kedua jamak diterjemahkan dengan larangan hukum yang wajar dalam bahasa Indonesia; “kamu” mempertahankan sasaran jamak yang dapat dipahami dari konteks.
- source_word: עָוֶל
  choice: curang
  rationale: Dalam konteks pengadilan dan transaksi, kata ini menunjuk pada tindakan tidak adil atau tidak jujur. “Berbuat curang” alami dan menghubungkan larangan umum dengan ukuran, bobot, dan takaran yang menyusul.
- source_word: בַּמִּשְׁפָּט
  choice: dalam pengadilan
  rationale: מִשְׁפָּט dapat berarti pengadilan, keputusan hukum, atau keadilan. Pilihan ini dekat dengan bentuk Ibrani dan tetap mempertahankan kemungkinan bahwa frasa itu berbicara tentang ranah hukum, sementara catatan kaki memberi alternatif yang lebih luas.
- source_word: בַּמִּדָּה
  choice: dalam mengukur panjang
  rationale: מִדָּה adalah ukuran atau tindakan mengukur. Karena bobot dan kapasitas disebut tersendiri, “mengukur panjang” membedakan kategori ini secara jelas dan alami.
- source_word: בַּמִּשְׁקָל
  choice: menimbang berat
  rationale: מִשְׁקָל menunjuk pada bobot atau penimbangan. Ungkapan verbal ini sejajar secara alami dengan “mengukur” dan “menakar”.
- source_word: וּבַמְּשׂוּרָה
  choice: menakar isi
  rationale: מְשׂוּרָה menunjuk pada ukuran kapasitas atau sejumlah isi yang ditakar. “Menakar isi” mudah dipahami dan tidak membatasi istilah hanya pada bahan cair atau bahan kering.
theological_decisions:
- issue: Cakupan בַּמִּשְׁפָּט
  choice: dalam pengadilan
  alternative: dalam perkara keadilan / dalam penilaian
  rationale: Kata Ibrani memiliki cakupan hukum dan etis yang bertumpang tindih. Teks utama mempertahankan ungkapan konkret yang dekat dengan sumber, sedangkan catatan kaki menjaga cakupan alternatif tanpa memaksakan penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang bermartabat. Rangkaian verba “mengukur—menimbang—menakar” dipakai agar kategori komersial mudah dipahami, sementara catatan kaki mempertahankan struktur nominal dan ambiguitas leksikal teks Ibrani.
