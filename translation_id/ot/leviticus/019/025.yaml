id: LEV.19.25
reference: Leviticus 19:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: id
  text: Pada tahun kelima, kamu boleh memakan buahnya supaya hasilnya bertambah bagimu. Akulah Yahweh, Allahmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: Pada tahun kelima
  rationale: Dalam rangkaian hukum ini, waw dapat diterjemahkan secara wajar tanpa kata penghubung eksplisit dalam bahasa Indonesia; frasa tersebut menandai peralihan dari larangan pada tahun-tahun sebelumnya kepada izin pada tahun kelima.
- source_word: תֹּאכְלוּ
  choice: kamu boleh memakan
  rationale: Bentuk imperfek orang kedua jamak ini, setelah larangan sebelumnya, paling alami dipahami sebagai pemberian izin, bukan sekadar pernyataan tentang masa depan.
- source_word: אֶת־פִּרְיוֹ
  choice: buahnya
  rationale: פְּרִי berarti buah, dan sufiks orang ketiga tunggal merujuk kepada pohon yang dibicarakan dalam konteks.
- source_word: לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: supaya hasilnya bertambah bagimu
  rationale: Infinitif dengan ל menyatakan tujuan atau hasil. Susunan Indonesia ini mempertahankan kaitan purposif sekaligus ambiguitas mengenai cara tindakan itu berkaitan dengan bertambahnya hasil.
- source_word: תְּבוּאָתוֹ
  choice: hasilnya
  rationale: תְּבוּאָה menunjuk pada hasil atau produksi tanaman; 'hasilnya' ringkas, alami, dan cukup luas.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Akulah Yahweh, Allahmu
  rationale: Bentuk 'Akulah' mempertahankan penegasan formula perjanjian, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'. Sufiks jamak dipahami secara kolektif dan dinyatakan dengan bentuk Indonesia 'Allahmu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Hubungan tujuan atau hasil dalam לְהוֹסִיף
  choice: supaya hasilnya bertambah bagimu
  alternative: untuk menambah hasilnya bagimu
  rationale: Terjemahan dengan 'supaya' mencerminkan nilai tujuan/hasil tanpa menentukan secara dogmatis mekanisme berkat atau pertambahan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti 'kamu' mempertahankan sapaan orang kedua jamak secara kolektif; 'bagimu' juga dapat mencakup komunitas Israel sebagai keseluruhan.
