  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: id
  text: Janganlah berpaling kepada berhala-berhala[a], dan janganlah membuat bagi kamu dewa-dewa dari logam tuangan[b]. Akulah Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berhala-berhala yang tidak bernilai”; istilah Ibrani ini dapat mengandung nada merendahkan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dewa-dewa tuangan” atau “berhala-berhala logam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: berpaling kepada
  rationale: Kata פנה dengan אֶל secara harfiah menyatakan tindakan berpaling atau mengarahkan diri kepada sesuatu. Pilihan ini mempertahankan cakupan makna perhatian, kesetiaan, atau ibadah tanpa mempersempitnya menjadi hanya 'menyembah'.
- source_word: אֱלִילִים
  choice: berhala-berhala
  rationale: Istilah ini lazim menunjuk kepada berhala dan mungkin mengandung nuansa merendahkan, yakni sesuatu yang tidak bernilai. 'Berhala-berhala' jelas dan alami dalam bahasa Indonesia, sedangkan nuansa alternatif dicatat dalam catatan kaki.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: dewa-dewa dari logam tuangan
  rationale: Frasa konstruksi ini menunjuk kepada dewa atau patung ilahi yang dibuat dengan menuangkan logam cair ke dalam cetakan. Terjemahan ini mempertahankan bentuk jamak אֱלֹהֵי dan cara pembuatannya yang dinyatakan oleh מַסֵּכָה.
- source_word: תַעֲשׂוּ לָכֶם
  choice: membuat bagi dirimu
  rationale: Konstruksi עשה dengan לָכֶם menyatakan pembuatan untuk kepentingan atau kepunyaan para pendengar. Bahasa Indonesia memakai 'dirimu' sebagai bentuk kolektif yang merujuk kepada umat yang diajak bicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Walaupun bentuk dasarnya secara morfologis tampak jamak, dalam rumusan perjanjian ini kata tersebut secara sintaksis merujuk kepada Allah Israel yang tunggal. Akhiran orang kedua jamak disampaikan secara alami melalui bentuk kolektif 'Allahmu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Apakah berpaling kepada berhala harus dijelaskan sebagai menyembah
  choice: Janganlah berpaling kepada berhala-berhala
  alternative: Janganlah menyembah berhala-berhala
  rationale: Kata kerja פנה tidak secara tersurat berarti 'menyembah'. Terjemahan yang lebih dekat mempertahankan keluasan maknanya dan tidak mempersempit larangan tersebut.
- issue: Penyebutan אֱלֹהֵי מַסֵּכָה sebagai dewa atau berhala
  choice: dewa-dewa dari logam tuangan
  alternative: berhala-berhala logam atau patung-patung tuangan
  rationale: Kata אֱלֹהֵי secara formal berarti 'dewa-dewa', sementara מַסֵּכָה menunjukkan benda hasil penuangan logam. Pilihan utama mempertahankan ketegangan antara sebutan 'dewa' dan kenyataan bahwa benda itu dibuat manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk larangan 'janganlah' mempertahankan nada hukum. 'Dirimu' dan 'Allahmu' dipakai secara kolektif untuk sapaan Ibrani orang kedua jamak; bentuk ini lebih alami daripada pengulangan 'kalian' dalam konteks hukum. Semua penanda catatan kaki tampil dalam teks utama.
