id: LEV.19.12
reference: Leviticus 19:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: id
  text: Janganlah kamu bersumpah palsu demi nama-Ku sehingga mencemarkan nama Allahmu. Akulah Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: bersumpah
  rationale: Bentuk Nifal dari שׁבע dalam konteks hukum berarti bersumpah atau mengucapkan sumpah; pilihan ini alami dan langsung dalam bahasa Indonesia.
- source_word: בִשְׁמִי
  choice: demi nama-Ku
  rationale: Preposisi ב dengan 'nama' dalam konteks sumpah menunjukkan nama yang dijadikan dasar atau penjamin sumpah; 'demi' merupakan ungkapan Indonesia yang idiomatis.
- source_word: לַשָּׁקֶר
  choice: palsu
  rationale: Secara harfiah berarti 'untuk kepalsuan', tetapi di sini berfungsi menerangkan sumpah yang tidak benar; 'bersumpah palsu' menyampaikan maksudnya dengan wajar.
- source_word: וְחִלַּלְתָּ
  choice: sehingga mencemarkan
  rationale: Piel חלל berarti menajiskan, mencemarkan, atau memperlakukan sebagai tidak kudus. 'Sehingga' menyatakan hubungan akibat yang wajar dalam konteks, sementara 'mencemarkan' dapat dipahami pembaca umum.
- source_word: שֵׁם
  choice: nama
  rationale: '''Nama'' dipertahankan secara harfiah karena menunjuk pada identitas dan kehormatan Allah yang dinyatakan.'
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis jamak, rujukannya di sini tunggal, yaitu Allah Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama pribadi perjanjian YHWH; transliterasi 'Yahweh' mempertahankan nama itu.
- issue: Hubungan klausa larangan dengan pencemaran nama Allah
  choice: 'akibat: ''sehingga mencemarkan'''
  alternative: 'koordinasi sederhana: ''dan mencemarkan'''
  rationale: Waw dapat dipahami sebagai penghubung biasa, tetapi konteks menunjukkan bahwa sumpah palsu demi nama Allah mengakibatkan pencemaran nama-Nya. 'Sehingga' menyampaikan hubungan itu tanpa menambah gagasan baru.
- issue: Ungkapan penutup אֲנִי יְהוָה
  choice: Akulah Yahweh
  alternative: Aku Yahweh
  rationale: Partikel penegas '-lah' secara alami mempertahankan daya pernyataan identitas dan otoritas dalam formula ilahi ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk tunggal 'kamu/Allahmu' mengikuti perubahan dari larangan jamak תִשָּׁבְעוּ kepada akibat yang dinyatakan dengan bentuk tunggal וְחִלַּלְתָּ; dalam konteks hukum kepada umat, bentuk Indonesia tetap terbaca sebagai sapaan umum. Tidak ada catatan kaki karena ungkapan 'bersumpah palsu' sudah menyampaikan לַשָּׁקֶר secara tepat dan alami.
