lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam formula pengantar perkataan ilahi, kata דּבר paling wajar diterjemahkan dengan “berfirman”; bentuk naratif berawalan וַ memperkenalkan peristiwa tutur yang baru.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menerima firman; “kepada” merupakan padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: berikut
  rationale: Dalam formula pengantar kutipan, לֵאמֹר menandai bahwa isi perkataan segera menyusul. Karena kutipannya dimulai pada ayat berikut, fungsi ini diwakili secara alami oleh tanda koma tanpa menambahkan kata tersendiri.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar, sementara catatan kaki menjelaskan kebiasaan penerjemahan tradisional.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. “Berfirman” dipilih sebagai ungkapan baku untuk perkataan Allah. Penanda לֵאמֹר tidak diterjemahkan secara mekanis sebagai “dengan berkata”, sebab dalam bahasa Indonesia tanda koma secara alami memperkenalkan isi firman yang berlanjut pada ayat berikut.
