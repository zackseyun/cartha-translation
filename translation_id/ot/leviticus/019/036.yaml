source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: id
  text: Haruslah kamu memiliki neraca yang benar[a], batu timbangan yang benar, efa yang benar[b], dan hin yang benar[c]. Akulah Yahweh, Allahmu, yang telah membawa kamu keluar dari tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “benar” adalah צֶדֶק, yang sering berarti “kebenaran” atau “keadilan”; di sini kata itu diterapkan pada alat dan takaran perdagangan.
    reason: lexical_alternative
  - marker: b
    text: Efa adalah satuan takaran kering pada zaman dahulu.
    reason: cultural_note
  - marker: c
    text: Hin adalah satuan takaran cair pada zaman dahulu.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: neraca yang jujur
  rationale: מֹאזְנַיִם menunjuk pada neraca untuk menimbang, sedangkan צֶדֶק dalam konteks perdagangan menuntut ukuran yang benar dan tidak curang. Ungkapan “neraca yang jujur” alami dalam bahasa Indonesia dan mempertahankan daya etisnya.
- source_word: אַבְנֵי צֶדֶק
  choice: batu timbangan yang jujur
  rationale: אַבְנֵי secara harfiah berarti “batu-batu” dan di sini menunjuk pada batu pemberat yang dipakai dalam penimbangan. “Batu timbangan” mempertahankan gambaran budaya sumber tanpa mengaburkan fungsinya.
- source_word: אֵיפַת צֶדֶק
  choice: efa yang jujur
  rationale: אֵיפָה adalah satuan takaran kering kuno. Bentuk “efa” dipertahankan agar kekhususan budaya sumber tidak diganti dengan padanan modern yang hanya bersifat perkiraan.
- source_word: וְהִין צֶדֶק
  choice: dan hin yang jujur
  rationale: הִין adalah satuan takaran cair kuno. Transliterasi “hin” mempertahankan satuan asli, sedangkan pengulangan “yang jujur” mencerminkan pengulangan צֶדֶק dalam teks Ibrani.
- source_word: יִהְיֶה לָכֶם
  choice: Kamu harus mempunyai
  rationale: Secara harfiah berarti “harus ada bagimu.” Rumusan ini menyampaikan kewajiban yang ditujukan kepada umat secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” dan tidak diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam rumusan perjanjian bersama nama Yahweh, bentuk ini bermakna tunggal, yaitu “Allahmu.”
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: yang membawa kamu keluar dari tanah Mesir
  rationale: Terjemahan ini mempertahankan rumusan keluaran yang menjadi dasar perintah tersebut dan terdengar wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna pengulangan צֶדֶק dalam hukum perdagangan
  choice: jujur
  alternative: adil; benar; tepat
  rationale: צֶדֶק mempunyai cakupan makna kebenaran dan keadilan, tetapi ketika menerangkan neraca, batu timbangan, dan takaran, “jujur” paling jelas menyampaikan tuntutan untuk tidak berbuat curang. Catatan kaki tetap menunjukkan cakupan alternatifnya.
- issue: Penerjemahan satuan ukuran kuno
  choice: mempertahankan “efa” dan “hin”
  alternative: takaran kering dan takaran cair; konversi ke satuan modern
  rationale: Mempertahankan istilah kuno menghindari konversi yang seolah-olah tepat dan menjaga latar budaya sumber. Jenis masing-masing takaran dijelaskan dalam catatan kaki.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama pribadi dalam teks sumber dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “yang jujur” sengaja dipertahankan untuk mencerminkan empat kali pengulangan צֶדֶק. Kata ganti “kamu” dapat menyapa umat secara kolektif tanpa memakai bentuk percakapan yang lebih informal.
