  naturalness: “Neraca yang jujur,” khususnya “efa yang jujur” dan “hin yang jujur,” kurang lazim dalam bahasa Indonesia modern karena sifat jujur biasanya dikenakan pada pelaku, bukan alat atau satuan ukuran. “Yang benar” merupakan kolokasi yang alami untuk timbangan dan takaran, sekaligus cukup luas untuk mengungkapkan ketepatan dan tuntutan etis צֶדֶק.
  terminology: “Neraca,” “batu timbangan,” “efa,” “hin,” “Yahweh,” dan “Allahmu” sudah tepat. Catatan satuan efa dan hin memadai; penanda catatan kaki selaras dengan unsur yang dijelaskan.
