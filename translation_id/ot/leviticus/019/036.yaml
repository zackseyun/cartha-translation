revisions:
- from: Kamu harus mempunyai neraca yang jujur[a], batu timbangan yang jujur, efa yang jujur[b], dan hin yang jujur[c]. Akulah Yahweh, Allahmu, yang membawa kamu keluar dari tanah Mesir.
  to: Haruslah kamu memiliki neraca yang benar[a], batu timbangan yang benar, efa yang benar[b], dan hin yang benar[c]. Akulah Yahweh, Allahmu, yang telah membawa kamu keluar dari tanah Mesir.
  rationale: Revisi mengganti personifikasi yang kurang alami “yang jujur” dengan “yang benar,” sebuah ungkapan Indonesia yang wajar untuk timbangan, batu pemberat, dan takaran. Pengulangan empat kali tetap dipertahankan sebagaimana dalam teks Ibrani. “Telah membawa” juga memperjelas bentuk perfekt dalam pengakuan tindakan Yahweh pada masa lalu.
