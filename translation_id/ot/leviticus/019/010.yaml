base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: id
  text: Kebun anggurmu jangan kaupetik habis[a], dan buah anggur yang jatuh[b] di kebun anggurmu jangan kaupungut. Biarkanlah semuanya itu bagi orang miskin dan pendatang[c]. Akulah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “jangan kaupetik lagi.” Kata Ibrani ini menunjuk pada tindakan memeriksa kembali tanaman anggur untuk mengambil buah yang masih tersisa sesudah panen utama.
    reason: lexical_alternative
  - marker: b
    text: Atau “sisa buah anggur.” Kata Ibrani ini menunjuk pada buah yang terlepas atau jatuh selama panen.
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah orang non-Israel yang tinggal menetap di tengah-tengah masyarakat Israel; dapat juga diterjemahkan “orang asing yang menetap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: kebun anggurmu
  rationale: כֶּרֶם berarti kebun anggur; bentuk dengan akhiran orang kedua tunggal diterjemahkan secara langsung dengan “-mu”.
- source_word: תְעוֹלֵל
  choice: jangan kaupetik habis
  rationale: Dalam konteks ini, verba tersebut menunjuk pada tindakan memeriksa kembali tanaman anggur dan mengambil sisa panen. “Petik habis” menyampaikan larangan memanen secara menyeluruh tanpa memakai istilah teknis yang kurang lazim.
- source_word: פֶרֶט
  choice: buah anggur yang jatuh
  rationale: פֶרֶט menunjuk pada buah yang terlepas atau jatuh selama panen; terjemahan konkret ini sesuai dengan konteks kebun anggur.
- source_word: תְלַקֵּט
  choice: kaupungut
  rationale: לקט berarti mengumpulkan atau memungut. Karena objeknya buah yang jatuh, “pungut” merupakan pilihan yang paling alami dan tepat.
- source_word: לֶעָנִי
  choice: bagi orang miskin
  rationale: עָנִי di sini menunjuk pada orang yang miskin atau berkekurangan; “orang miskin” jelas dan lazim dalam ketentuan sosial.
- source_word: וְלַגֵּר
  choice: dan pendatang
  rationale: גֵּר adalah orang bukan asli Israel yang tinggal di tengah masyarakat Israel. “Pendatang” mempertahankan status nonpribumi tanpa konotasi birokratis modern.
- source_word: תַּעֲזֹב אֹתָם
  choice: Biarkanlah semuanya itu
  rationale: עזב dalam konteks ini berarti membiarkan hasil yang tersisa tersedia bagi orang lain; “semuanya itu” merujuk pada buah yang tidak dipetik dan yang jatuh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Bentuk Ibrani memakai akhiran orang kedua jamak. “Allah kalian” mempertahankan peralihan dari sapaan tunggal dalam perintah sebelumnya ke bentuk jamak dalam rumusan penutup.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Peralihan jumlah orang dalam rumusan penutup
  choice: Allah kalian
  alternative: Allahmu
  rationale: אֱלֹהֵיכֶם berbentuk jamak, meskipun perintah sebelumnya memakai sapaan tunggal. Peralihan yang ada dalam teks sumber dipertahankan dan tidak diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya hukum yang tegas namun alami. Bentuk “kau-” mempertahankan sapaan orang kedua tunggal pada perintah, sedangkan “kalian” mempertahankan bentuk jamak pada rumusan penutup. Istilah pertanian dijelaskan secara konkret agar mudah dipahami tanpa menghilangkan nuansa tindakan memanen untuk kedua kalinya.
