id: LEV.19.34
reference: Leviticus 19:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: id
  text: Orang pendatang yang tinggal di antara kalian harus kalian perlakukan seperti penduduk asli di antara kalian.[a] Engkau harus mengasihinya seperti dirimu sendiri, sebab dahulu kalian pun pendatang di tanah Mesir. Akulah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing,” “orang asing yang menetap,” atau “penduduk asing.” Istilah Ibrani ini menunjuk pada orang bukan asli yang tinggal di tengah Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: seperti penduduk asli di antara kalian
  rationale: אֶזְרָח menunjuk pada anggota masyarakat yang asli atau kelahiran setempat. Ungkapan ini mempertahankan perbandingan dengan כְּ tanpa memasukkan konsep kewarganegaraan modern.
- source_word: הַגֵּר
  choice: orang pendatang
  rationale: גֵּר di dalam hukum Taurat menunjuk pada orang bukan asli yang menetap di tengah Israel, bukan sekadar pelancong. 'Orang pendatang' cukup alami dalam bahasa Indonesia, sedangkan cakupan khusus istilah Ibraninya dijelaskan dalam catatan kaki.
- source_word: הַגָּר אִתְּכֶם
  choice: yang tinggal di antara kalian
  rationale: Partisipel גָּר menerangkan bahwa orang tersebut tinggal bersama komunitas Israel. Terjemahan ini alami dan menyampaikan tempat tinggal yang berkelanjutan, meskipun permainan akar kata גֵּר–גָּר tidak dapat dipertahankan sepenuhnya.
- source_word: יִהְיֶה לָכֶם
  choice: harus kalian perlakukan
  rationale: Secara harfiah berarti 'harus menjadi bagi kalian'. Dalam konteks hukum-etis, konstruksi ini menyatakan bagaimana pendatang itu harus dipandang dan diperlakukan; pilihan ini menyampaikan daya perintah secara jelas.
- source_word: וְאָהַבְתָּ לוֹ כָּמוֹךָ
  choice: Engkau harus mengasihinya seperti dirimu sendiri
  rationale: Bentuk orang kedua tunggal dipertahankan dengan 'engkau', termasuk peralihan dari sapaan jamak di sekitarnya. 'Seperti dirimu sendiri' juga menjaga kaitan verbal dengan Imamat 19:18.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: sebab dahulu kalian pun pendatang
  rationale: Pengulangan 'pendatang' mempertahankan hubungan leksikal dengan גֵּר sebelumnya dan menjadikan pengalaman Israel sendiri sebagai dasar perintah.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Mempertahankan unsur אֶרֶץ dan ungkapan historis Alkitabiah tanpa terasa kaku dalam bahasa Indonesia.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Akulah Yahweh, Allah kalian
  rationale: Konstruksi penegasan diterjemahkan dengan 'Akulah'; nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', dan bentuk posesif jamak dipertahankan dengan 'Allah kalian'.
theological_decisions:
- issue: Makna גֵּר dalam konteks hukum dan etika
  choice: orang pendatang
  alternative: orang asing; orang asing yang menetap; penduduk asing
  rationale: Istilah ini mengacu pada orang bukan asli yang tinggal di tengah Israel dan berada dalam lingkup perlindungan sosial-hukum. 'Orang pendatang' menghindari kesan bahwa ia hanya pengunjung, sementara catatan kaki menjaga batas makna istilah sumber.
- issue: Peralihan sapaan jamak dan tunggal
  choice: kalian ... Engkau ... kalian
  alternative: menyeragamkan seluruh sapaan menjadi 'kalian' atau 'kamu'
  rationale: Teks Ibrani beralih dari bentuk jamak kepada bentuk tunggal dalam perintah mengasihi, lalu kembali ke bentuk jamak. Pergeseran retoris ini dipertahankan dan tidak diselaraskan diam-diam.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi, bukan sekadar gelar. Transliterasi 'Yahweh' mempertahankan fungsi nama tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kalian' dipakai untuk bentuk jamak agar berbeda dari 'engkau' yang mewakili bentuk tunggal dalam perintah utama. Istilah hukum modern seperti 'warga negara' dan 'imigran residen' dihindari karena dapat membawa kategori yang tidak terdapat dalam teks kuno.
