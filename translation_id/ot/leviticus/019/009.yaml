id: LEV.19.9
reference: Leviticus 19:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: id
  text: Ketika kamu menuai hasil tanahmu, janganlah kamu menuai habis bagian tepi ladangmu[a], dan janganlah kamu memungut sisa-sisa panenmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "sudut ladangmu." Istilah Ibrani ini dapat berarti tepi, sisi, atau sudut; di sini yang dimaksud ialah bagian luar ladang yang harus dibiarkan tidak dituai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: Ketika kamu menuai
  rationale: Konstruksi dengan infinitif memperkenalkan keadaan waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan suasana ketetapan hukum.
- source_word: קְצִיר אַרְצְכֶם
  choice: hasil tanahmu
  rationale: קְצִיר menunjuk pada hasil panen atau kegiatan panen, sedangkan אֶרֶץ di sini adalah tanah pertanian. Ungkapan ini ringkas dan alami dalam konteks tersebut.
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: janganlah kamu menuai habis
  rationale: Bentuk Piel dari כלה menyatakan menyelesaikan atau menghabiskan; 'menuai habis' secara jelas menyampaikan larangan mengambil seluruh hasil pada bagian yang disebutkan.
- source_word: פְּאַת שָׂדְךָ
  choice: bagian tepi ladangmu
  rationale: פֵּאָה dapat berarti tepi, sisi, atau sudut. 'Bagian tepi' cocok dengan konteks pertanian tanpa mempersempit maknanya hanya kepada sudut.
- source_word: לֶקֶט קְצִירְךָ
  choice: sisa-sisa panenmu
  rationale: לֶקֶט adalah hasil yang tercecer atau tertinggal untuk dipungut sesudah panen utama. 'Sisa-sisa panen' lebih mudah dipahami pembaca Indonesia daripada istilah teknis yang kurang umum.
- source_word: לֹא תְלַקֵּט
  choice: janganlah kamu memungut
  rationale: לקט berarti mengumpulkan atau memungut hasil yang tercecer; 'memungut' tepat bagi sisa panen di tanah.
theological_decisions: []
