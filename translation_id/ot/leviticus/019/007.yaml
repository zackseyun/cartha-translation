  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: id
  text: Namun, jika kurban itu benar-benar dimakan pada hari ketiga, kurban itu adalah sesuatu yang tercemar[a]; kurban itu tidak akan diterima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini juga dapat diterjemahkan “sesuatu yang menjijikkan” atau “sesuatu yang ternoda”. Dalam konteks kurban, istilah ini menunjuk pada daging kurban yang menjadi tidak layak diterima karena dimakan melewati waktu yang diizinkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Gabungan konjungsi dan syarat ini menyatakan kondisi yang berlawanan dengan ketentuan sebelumnya. “Namun, jika” mempertahankan alur kontras secara alami.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: sampai dimakan
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. Dalam bahasa Indonesia, “sampai dimakan” menyampaikan kemungkinan yang ditekankan dalam peringatan ini tanpa terasa kaku.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: pada hari ketiga
  rationale: Padanan temporal yang langsung, tepat, dan alami.
- source_word: פִּגּוּל
  choice: sesuatu yang tercemar
  rationale: Dalam konteks kurban, istilah ini menyatakan sesuatu yang telah menjadi tidak layak atau tidak dapat diterima karena aturan kurban dilanggar. “Tercemar” mempertahankan daya evaluatifnya tanpa menyamakannya dengan istilah teknis Ibrani lain untuk kenajisan.
- source_word: הוּא
  choice: kurban itu adalah
  rationale: Pronomina ini berfungsi sebagai subjek predikatif. Pengulangan “kurban itu” memperjelas acuannya dalam bahasa Indonesia.
- source_word: לֹא יֵרָצֶה
  choice: kurban itu tidak akan diterima
  rationale: Bentuk Nifal dari רצה dalam konteks persembahan menunjuk pada penerimaan atau keberkenanan terhadap kurban. “Tidak akan diterima” menyampaikan makna kultis ini dengan jelas.
theological_decisions:
- issue: Status daging kurban yang dimakan pada hari ketiga
  choice: Ayat ini menyatakan bahwa kurban tersebut menjadi tidak layak diterima dalam tata ibadah kurban.
  alternative: Daging itu semata-mata telah rusak secara fisik, atau merupakan kekejian dalam kategori tabu yang lebih luas.
  rationale: Konteks langsung membahas aturan persembahan, dan klausa penutup menegaskan bahwa kurban itu tidak akan diterima. Terjemahan mempertahankan lingkup ritual-kurban tanpa memperluasnya menjadi pernyataan metafisis atau kategori doktrinal lain.
translation_notes:
  register: Bahasa Indonesia modern yang formal tetapi mudah dipahami. “Kurban” dipakai untuk memperjelas acuan pronomina berdasarkan konteks langsung, sedangkan pengulangan pada klausa terakhir menjaga kejelasan. Tanda catatan kaki ditempatkan langsung sesudah padanan פִּגּוּל yang diterangkannya.
