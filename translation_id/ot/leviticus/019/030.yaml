source:
  edition: WLC
  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: id
  text: Kamu harus memelihara hari-hari Sabat-Ku dan menghormati tempat kudus-Ku.[a] Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “merasa gentar terhadap tempat kudus-Ku.” Kata kerja Ibraninya dapat berarti “takut” atau “menghormati”; di sini maksudnya ialah memperlakukan tempat suci Yahweh dengan rasa hormat yang kudus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: hari-hari Sabat-Ku
  rationale: Bentuk Ibrani ini jamak dan menunjuk pada berbagai perayaan Sabat yang ditetapkan Yahweh. Bentuk ulang “hari-hari” mempertahankan kejamakan secara alami dalam bahasa Indonesia.
- source_word: תִּשְׁמֹרוּ
  choice: harus memelihara
  rationale: Kata שׁמר berarti menjaga, menaati, atau menjalankan. “Memelihara” sesuai dengan ragam hukum-perjanjian dan berpasangan secara wajar dengan hari-hari Sabat.
- source_word: מִקְדָּשִׁי
  choice: tempat kudus-Ku
  rationale: מִקְדָּשׁ menunjuk pada tempat yang dikhususkan bagi Allah. “Tempat kudus-Ku” jelas dan tidak mempersempit rujukan secara tidak semestinya menjadi Kemah Suci atau Bait Allah.
- source_word: תִּירָאוּ
  choice: menghormati
  rationale: Dalam konteks tempat suci, ירא menyatakan sikap takut penuh hormat. “Menghormati” menyampaikan tuntutan untuk memperlakukan tempat kudus dengan rasa gentar dan hormat, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga identitas perjanjian dalam teks sumber tetap nyata.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Partikel penegas “-lah” menyampaikan penekanan formula pengenalan diri ilahi secara alami dan khidmat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Daya makna ירא ketika tempat kudus menjadi objeknya
  choice: menghormati tempat kudus-Ku
  alternative: takut terhadap tempat kudus-Ku; merasa gentar terhadap tempat kudus-Ku
  rationale: Kata kerja tersebut dapat berarti takut atau menaruh hormat. Dalam konteks ini, “menghormati” mengungkapkan sikap kudus terhadap tempat milik Yahweh tanpa menyempitkannya menjadi rasa ngeri; ambiguitas leksikal dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-perjanjian yang khidmat. “Kamu” mempertahankan sapaan jamak melalui konteks, sedangkan bentuk verbal dengan “harus” menyampaikan kekuatan perintah. Kapitalisasi pada akhiran pronominal -Ku mengikuti kelaziman penerbitan Alkitab Indonesia.
