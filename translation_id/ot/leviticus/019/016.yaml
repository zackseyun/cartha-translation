source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: id
  text: Janganlah engkau berkeliling menyebarkan fitnah di antara bangsamu. Janganlah engkau berdiri menentang darah sesamamu.[a] Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Janganlah engkau berdiam diri ketika darah sesamamu ditumpahkan.”
    reason: Ungkapan Ibrani dapat dipahami sebagai larangan membiarkan sesama menghadapi bahaya maut tanpa pertolongan.
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: berkeliling menyebarkan fitnah
  rationale: Gabungan harfiah 'pergi/berjalan' dan רָכִיל menggambarkan orang yang bergerak di tengah masyarakat sambil menyebarkan laporan yang merusak. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran tindakan berkeliling.
- source_word: בְּעַמֶּיךָ
  choice: di antara bangsamu
  rationale: Preposisi ב dengan עַם menunjukkan lingkungan tempat tindakan itu berlangsung, yakni di tengah komunitas umat.
- source_word: תַעֲמֹד
  choice: berdiri
  rationale: Mempertahankan gambaran konkret verba עמד dan ketegangan ungkapan Ibrani.
- source_word: עַל
  choice: menentang
  rationale: Dalam frasa yang sukar ini, עַל dapat menyiratkan posisi melawan atau tindakan yang membahayakan. 'Menentang' mempertahankan kemungkinan tersebut tanpa menghapus tafsiran tentang berdiam diri, yang dicatat dalam catatan kaki.
- source_word: דַּם
  choice: darah
  rationale: Terjemahan langsung yang mempertahankan kekonkretan bahasa hukum-etis Ibrani; darah juga dapat mewakili nyawa atau penumpahan darah.
- source_word: רֵעֶךָ
  choice: sesamamu
  rationale: רֵעַ menunjuk kepada orang lain dalam lingkungan komunitas. 'Sesama' merupakan padanan Indonesia yang alami dan mapan dalam konteks etis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Makna לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  choice: Larangan berdiri menentang darah atau nyawa sesama, dengan ungkapan konkret Ibrani dipertahankan dalam teks utama.
  alternative: Larangan berdiam diri ketika darah sesama ditumpahkan atau ketika nyawanya terancam.
  rationale: Ungkapan Ibrani ini ringkas dan ambigu. Teks utama mempertahankan kata 'berdiri', 'menentang', dan 'darah' agar kemungkinan tindakan bermusuhan atau keterlibatan tidak dipersempit; tafsiran umum mengenai sikap pasif dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'engkau' dipertahankan sesuai sufiks orang kedua tunggal dalam teks Ibrani. Ungkapan yang tidak biasa pada klausa kedua sengaja cukup formal untuk menjaga ambiguitas sumber.
