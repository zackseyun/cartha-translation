  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: id
  text: Janganlah kamu memotong rambut di sisi kepalamu secara membulat,[a][b] dan janganlah kamu merusak tepi janggutmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sudut-sudut rambut di kepalamu.” Kata Ibrani yang dipakai dapat berarti “tepi,” “sisi,” atau “sudut.”
    reason: lexical_alternative
  - marker: b
    text: Kemungkinan yang dimaksud ialah mencukur atau memangkas rambut pada sisi kepala sehingga berbentuk membulat.
    reason: cultural_note
  - marker: c
    text: Atau “membinasakan,” “mencacatkan,” atau “merusak bagian pinggir janggutmu.” Teks tidak menyebutkan cara tindakan itu dilakukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: mencukur membulat
  rationale: Bentuk Hifil dari נקף dalam konteks ini menunjuk pada tindakan memotong atau mencukur rambut mengikuti bentuk membulat; ungkapan ini mempertahankan tindakan konkret tanpa menentukan teknik secara berlebihan.
- source_word: פְּאַת רֹאשְׁכֶם
  choice: rambut di sisi kepalamu
  rationale: פֵּאָה berarti tepi, sisi, atau sudut. Dalam klausa ini, ungkapan alami bahasa Indonesia menjelaskan bahwa yang dimaksud ialah rambut pada sisi kepala. Bentuk Ibrani berakhiran jamak kolektif, sedangkan bahasa Indonesia dapat memakai bentuk tunggal distributif setelah sapaan jamak 'kamu'.
- source_word: תַשְׁחִית
  choice: merusak
  rationale: Bentuk Hifil dari שׁחת berarti merusak, membinasakan, atau mencacatkan. 'Merusak' mempertahankan keluasan makna verba dan tidak menambahkan cara tertentu seperti mencukur.
- source_word: פְּאַת זְקָנֶךָ
  choice: tepi janggutmu
  rationale: Terjemahan ini mempertahankan arti dasar פֵּאָה sebagai tepi atau bagian pinggir dan זָקָן sebagai janggut, tanpa menyimpulkan bentuk potongan tertentu.
- source_word: לֹא ... וְלֹא
  choice: Janganlah ... dan janganlah ...
  rationale: Bentuk larangan ini menyampaikan daya hukum kedua larangan secara jelas, wajar, dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Sifat dan latar belakang larangan
  choice: Menerjemahkan dua tindakan yang dilarang secara konkret tanpa memasukkan motif ritual atau budaya ke dalam teks utama.
  alternative: Menjelaskannya sebagai larangan khusus terhadap kebiasaan berkabung kafir atau gaya perawatan bangsa-bangsa sekitar.
  rationale: Ayat Ibrani menyatakan tindakan yang dilarang, tetapi tidak menyebutkan alasannya. Terjemahan karena itu tidak menyelesaikan secara diam-diam pertanyaan mengenai latar budaya atau cakupan teologisnya.
translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat, tetapi tetap alami bagi pembaca Indonesia masa kini. Sapaan 'kamu' dipahami secara jamak dalam klausa pertama dan secara distributif dalam frasa kepunyaan; pengulangan 'janganlah' mempertahankan kesejajaran larangan Ibrani.
