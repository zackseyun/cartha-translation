  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: id
  text: Setiap laki-laki[a] harus takut[b] kepada ibunya dan ayahnya, dan kalian harus memelihara hari-hari Sabat-Ku. Akulah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap orang.” Kata Ibrani yang secara harfiah berarti “laki-laki” dipakai dalam bentuk tunggal untuk menyatakan bahwa perintah ini berlaku bagi setiap anggota komunitas.
    reason: lexical_alternative
  - marker: b
    text: Atau “menghormati dengan penuh takzim.” Kata Ibrani ini dapat menyatakan rasa takut, hormat, atau gentar penuh takzim.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: setiap laki-laki
  rationale: Bentuk tunggal maskulin dipakai secara distributif bagi seluruh komunitas. Terjemahan mempertahankan bentuk maskulin sumber, sementara catatan kaki menjelaskan cakupan perintahnya.
- source_word: אִמּוֹ וְאָבִיו
  choice: ibunya dan ayahnya
  rationale: Ibrani menyebut ibu lebih dahulu daripada ayah dan memakai penanda milik pada keduanya; urutan serta kedua istilah kekerabatan dipertahankan.
- source_word: תִּירָאוּ
  choice: harus takut
  rationale: Kata kerja ירא mencakup rasa takut, hormat, dan gentar penuh takzim. 'Takut' mempertahankan daya ungkap yang kuat tanpa meniadakan nuansa penghormatan, yang dijelaskan dalam catatan kaki.
- source_word: שַׁבְּתֹתַי
  choice: hari-hari Sabat-Ku
  rationale: Ungkapan ini mempertahankan bentuk jamak dan kepunyaan ilahi secara alami dalam bahasa Indonesia.
- source_word: תִּשְׁמֹרוּ
  choice: harus memelihara
  rationale: Dalam hubungan dengan Sabat, 'memelihara' menyampaikan ketaatan dan penjagaan yang cermat, bukan sekadar mengingat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Bentuk akhiran orang kedua jamak dibuat jelas dalam bahasa Indonesia dan אֱלֹהִים di sini merujuk kepada Allah Israel yang esa.
theological_decisions:
- issue: Daya afektif perintah terhadap orang tua
  choice: takut kepada ibunya dan ayahnya
  alternative: menghormati ibunya dan ayahnya; gentar terhadap ibunya dan ayahnya
  rationale: Pilihan utama mempertahankan rentang kuat kata ירא. Catatan kaki menunjukkan bahwa dalam konteks ini rasa takut mencakup hormat atau takzim, tanpa mempersempit maknanya hanya menjadi kesopanan.
- issue: Representasi gender dalam bentuk tunggal distributif
  choice: setiap laki-laki
  alternative: setiap orang; masing-masing orang
  rationale: Teks Ibrani memakai אִישׁ dalam bentuk tunggal maskulin secara distributif. Bentuk sumber dipertahankan dalam teks utama, sedangkan cakupan komunitas dijelaskan dalam catatan kaki.
- issue: Peralihan dari tunggal distributif ke sapaan jamak
  choice: kalian harus ... Allah kalian
  alternative: kamu harus ... Allahmu
  rationale: Bentuk verbal dan akhiran pada bagian kedua adalah jamak. 'Kalian' memperlihatkan peralihan gramatikal itu dan menghindari pengaburan jumlah yang dapat terjadi dengan 'kamu'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk menandai sapaan jamak Ibrani secara jelas; 'hari-hari Sabat-Ku' mempertahankan bentuk jamak dengan susunan yang lebih alami daripada 'Sabat-sabat-Ku'.
