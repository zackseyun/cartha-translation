  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: id
  text: Imam akan mengadakan pendamaian baginya di hadapan Yahweh dengan domba jantan sebagai kurban penebus salah[a] atas dosa yang telah dilakukannya, dan ia akan diampuni atas dosa yang telah dilakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani אָשָׁם dapat berarti “kurban penebus salah” dan juga menonjolkan segi pemulihan atau ganti rugi dari kurban itu; dapat juga diterjemahkan “kurban pemulihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: harus mengadakan pendamaian
  rationale: Dalam konteks kurban Imamat, כפר menunjuk pada tindakan ritual imam untuk mengadakan pendamaian bagi seseorang. Ungkapan ini baku, jelas, dan tetap mempertahankan nuansa kultis.
- source_word: עָלָיו
  choice: baginya
  rationale: Bersama כפר, preposisi על menyatakan orang yang menerima manfaat pendamaian; 'baginya' menyampaikan makna tersebut secara alami.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Padanan langsung bagi pelayan kultis yang melakukan tindakan tersebut; ketakrifan cukup jelas dari konteks bahasa Indonesia.
- source_word: בְּאֵיל הָאָשָׁם
  choice: dengan domba jantan kurban penebus salah
  rationale: איל secara khusus berarti domba jantan, sedangkan אָשָׁם adalah kurban yang berkaitan dengan kesalahan dan pemulihan atau ganti rugi. 'Dengan' mencerminkan fungsi instrumental ב.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan bahasa ruang-kultis לִפְנֵי dan menyajikan nama perjanjian יְהוָה sebagai Yahweh.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: atas dosa yang telah diperbuatnya
  rationale: Menyampaikan pelanggaran yang menjadi alasan pendamaian sambil menghaluskan konstruksi serumpun חטאת/חטא agar alami dalam bahasa Indonesia.
- source_word: וְנִסְלַח לוֹ
  choice: Maka ia akan diampuni
  rationale: Bentuk pasif mempertahankan pelaku ilahi yang tersirat tetapi tidak disebutkan dalam teks Ibrani; 'maka' menunjukkan hasil dari tindakan pendamaian.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dari dosa yang telah diperbuatnya
  rationale: '''Dari'' mempertahankan preposisi מן dan tetap dapat dipahami secara alami sebagai pembebasan dari tanggungan dosa.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Pelaku pengampunan tidak dinyatakan
  choice: bentuk pasif 'ia akan diampuni'
  alternative: Yahweh akan mengampuninya
  rationale: Bahasa Ibrani memakai bentuk pasif dan membiarkan pelaku ilahi tersirat; terjemahan tidak menambahkan subjek yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dua kalimat dipakai agar hubungan tindakan dan hasilnya jelas, sambil mempertahankan pengulangan 'dosa yang telah diperbuatnya' dari teks Ibrani.
