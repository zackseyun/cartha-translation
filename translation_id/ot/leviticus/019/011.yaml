  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: id
  text: Jangan mencuri, jangan berbuat curang, dan jangan berdusta kepada sesama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang [laki-laki] dengan sesamanya”; dalam konteks ini frasa tersebut dapat bermakna “terhadap” atau “kepada sesama”. Kata Ibrani yang diterjemahkan “sesama” dapat menunjuk kepada rekan atau anggota lain dalam komunitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: jangan mencuri
  rationale: Bentuk Qal imperfek orang kedua jamak dengan לֹא berfungsi sebagai larangan. Kata “mencuri” menyampaikan arti dasar גנב secara langsung dan wajar.
- source_word: תְכַחֲשׁוּ
  choice: jangan berbuat curang
  rationale: Bentuk Piel כחש dapat berarti menyangkal, menipu, atau bertindak tidak jujur. “Berbuat curang” mempertahankan cakupan perilaku tidak jujur tanpa membatasinya pada penyangkalan lisan.
- source_word: תְשַׁקְּרוּ
  choice: jangan berdusta
  rationale: Bentuk Piel שקר lazim menyatakan berdusta atau bertindak palsu. “Berdusta” alami dalam rangkaian larangan ini dan tetap menonjolkan tindakan verbal terhadap orang lain.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: kepada sesama
  rationale: Ungkapan harfiahnya bersifat distributif, “seseorang terhadap sesamanya.” Dalam bahasa Indonesia, “kepada sesama” menyampaikan hubungan antarsesama secara ringkas dan alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עֲמִית
  choice: sesama
  rationale: עֲמִית menunjuk kepada rekan, sesama, atau anggota lain dalam lingkungan sosial. “Sesama” mempertahankan cakupan interpersonalnya tanpa mempersempitnya menjadi tetangga tempat tinggal.
theological_decisions:
- issue: Ungkapan distributif bergender אִישׁ ... עֲמִיתוֹ
  choice: Diterjemahkan secara inklusif sebagai “kepada sesama”
  alternative: “seseorang terhadap sesamanya” atau “seorang laki-laki terhadap rekannya”
  rationale: Bentuk maskulin tunggal dalam bahasa Ibrani berfungsi secara representatif dan tidak membatasi larangan ini hanya kepada laki-laki. Pilihan inklusif menyampaikan maksud sumber tanpa menambahkan pembatasan gender.
translation_notes:
  register: Bahasa larangan dibuat langsung, sejajar, dan mudah dipahami dengan pengulangan “jangan”. “Berdusta” dipilih sebagai bentuk baku dan bermartabat, sedangkan “sesama” menjaga keluasan hubungan sosial dalam teks sumber.
