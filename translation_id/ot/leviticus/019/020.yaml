id: LEV.19.20
reference: Leviticus 19:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: id
  text: Jika seorang laki-laki bersetubuh dengan seorang perempuan dan mengeluarkan air mani, sedangkan perempuan itu adalah budak perempuan yang diperuntukkan bagi seorang laki-laki[a], tetapi belum ditebus atau diberi kebebasan, harus ada pemeriksaan[b]. Mereka tidak boleh dihukum mati, karena perempuan itu belum dibebaskan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditunangkan dengan seorang laki-laki” atau “dijanjikan kepada seorang laki-laki.” Kata Ibrani ini kemungkinan menunjukkan bahwa budak perempuan itu telah ditetapkan atau dijanjikan bagi seorang laki-laki, meskipun status hukumnya tidak sama dengan seorang istri merdeka.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “pemeriksaan” langka dan maknanya tidak pasti; kata itu mungkin juga berarti “hukuman” atau “ganti rugi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Bentuk maskulin tunggal menunjuk kepada seorang laki-laki dalam rumusan hukum kasuistis.
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: bersetubuh dengan seorang perempuan hingga mengeluarkan air mani
  rationale: Ungkapan Ibrani menyatakan hubungan seksual sekaligus unsur keluarnya air mani; terjemahan ini mempertahankan kekhususan hukum tersebut dalam bahasa Indonesia yang jelas.
- source_word: שִׁפְחָה
  choice: budak perempuan
  rationale: Status perbudakan perempuan itu menentukan perkara ini, sehingga istilah yang secara jelas menyatakan status terikat dipertahankan.
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: diperuntukkan bagi seorang laki-laki
  rationale: Partisip yang langka ini tampaknya menyatakan bahwa perempuan tersebut telah ditetapkan atau dijanjikan bagi seorang laki-laki, tanpa memastikan bahwa statusnya sama dengan pertunangan seorang perempuan merdeka.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: belum ditebus
  rationale: Pengulangan bentuk verbal menegaskan bahwa penebusan belum terlaksana; bentuk pasif ini alami dan tepat dalam konteks hukum-ekonomi.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: belum ... diberi kebebasan
  rationale: Ungkapan ini merujuk pada pemberian kebebasan dari status budak dan diterjemahkan secara alami tanpa menghilangkan makna hukumnya.
- source_word: בִּקֹּרֶת
  choice: pemeriksaan
  rationale: Istilah ini langka dan maknanya diperdebatkan. 'Pemeriksaan' mempertahankan kemungkinan adanya penanganan atau peninjauan resmi tanpa menetapkan jenis hukuman tertentu.
- source_word: לֹא יוּמְתוּ
  choice: mereka tidak boleh dihukum mati
  rationale: Bentuk jamak dalam konteks hukum menunjuk kepada kedua pihak dan menyatakan bahwa hukuman mati tidak dijatuhkan.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: karena perempuan itu belum dibebaskan
  rationale: Alasan yang diberikan terkait langsung dengan status perempuan tersebut yang masih belum merdeka.
theological_decisions:
- issue: Status hukum נֶחֱרֶפֶת לְאִישׁ
  choice: diperuntukkan bagi seorang laki-laki
  alternative: ditunangkan dengan seorang laki-laki; dijanjikan kepada seorang laki-laki
  rationale: Ayat ini membedakan perkara tersebut dari perzinaan dengan perempuan merdeka yang bertunangan. Pilihan ini menyatakan ikatan yang ada tanpa secara tidak semestinya menyamakannya dengan pertunangan penuh.
- issue: Makna בִּקֹּרֶת
  choice: harus ada pemeriksaan
  alternative: harus ada hukuman; harus ada ganti rugi
  rationale: Karena kata bendanya langka dan tidak pasti, teks utama memakai padanan yang tidak menentukan bentuk sanksi secara berlebihan, sedangkan kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya hukum yang lugas dan bermartabat. Istilah 'budak perempuan' mempertahankan realitas status sosial dalam teks, sedangkan ungkapan seksual dibuat jelas tanpa menjadi kasar. Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
