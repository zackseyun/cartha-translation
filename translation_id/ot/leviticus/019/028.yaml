source:
  edition: WLC
  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: id
  text: Janganlah kamu membuat sayatan pada tubuh kalian karena orang mati[a], dan janganlah kamu membuat tanda rajah pada tubuh kalian[b]. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena seorang yang mati.” Ungkapan Ibrani ini lazim dipahami dalam konteks perkabungan bagi orang mati.
    reason: lexical_alternative
  - marker: b
    text: Atau “tanda bertulis” atau “tato.” Ungkapan Ibrani ini langka dan mungkin menunjuk pada tanda permanen pada tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: sayatan
  rationale: Nomina ini menunjuk pada luka potong atau torehan pada tubuh. 'Sayatan' alami dalam bahasa Indonesia dan tidak menentukan alat maupun tingkat keparahannya.
- source_word: לָנֶפֶשׁ
  choice: karena orang mati
  rationale: Dalam konteks hukum dan perkabungan ini, נֶפֶשׁ mengacu pada orang yang telah mati. 'Karena orang mati' menyampaikan kaitan tindakan tersebut dengan perkabungan tanpa menambahkan rincian ritual yang tidak dinyatakan.
- source_word: בִּבְשַׂרְכֶם
  choice: pada tubuhmu
  rationale: Secara harfiah berarti 'pada/dalam dagingmu', tetapi dalam larangan mengenai tindakan jasmani, 'pada tubuhmu' lebih wajar dan jelas dalam bahasa Indonesia modern.
- source_word: כְתֹבֶת קַעֲקַע
  choice: rajah
  rationale: Ungkapan langka ini menunjuk pada tulisan atau tanda yang dibuat pada kulit, kemungkinan tanda permanen. 'Rajah' mempertahankan gagasan tanda yang diterakan pada tubuh tanpa menjelaskan secara berlebihan teknik pembuatannya.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: janganlah kamu membuat ... pada tubuhmu
  rationale: Walaupun נתן secara dasar berarti 'menaruh/memberikan', dalam konstruksi ini ungkapan tersebut berarti menerakan atau membuat tanda pada tubuh. Rumusan ini alami dalam bahasa Indonesia.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Mempertahankan nama ilahi יהוה secara langsung serta bentuk penegasan formula penutup dalam bahasa Indonesia yang ringkas dan bermartabat.
theological_decisions:
- issue: Cakupan larangan tanda tubuh dan hubungannya dengan perkabungan
  choice: Menerjemahkan larangan pertama sebagai sayatan karena orang mati dan larangan kedua sebagai pembuatan rajah, tanpa menyamakan atau memisahkan konteks keduanya secara eksplisit.
  alternative: Membatasi kedua larangan hanya pada ritus perkabungan, atau memperluas larangan kedua secara eksplisit menjadi larangan universal atas semua bentuk tato modern.
  rationale: Frasa 'karena orang mati' secara gramatikal melekat pada larangan pertama dan tidak diulangi pada larangan kedua. Terjemahan mempertahankan susunan dan ketegangan teks tanpa menetapkan penerapan teologis yang melampaui bunyi bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal kolektif 'kamu' mengikuti sapaan jamak Ibrani dalam gaya hukum yang alami; kedua catatan kaki menjaga ketidakpastian leksikal ungkapan-ungkapan Ibrani.
