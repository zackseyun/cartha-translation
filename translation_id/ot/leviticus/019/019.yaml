  - severity: low
    issue: «Jangan taburi ladangmu» kurang idiomatis dibandingkan bentuk verba transitif «menaburi».
    rationale: Perbaikan ini meningkatkan kelancaran bahasa Indonesia modern tanpa mengubah makna tindakan menabur.
