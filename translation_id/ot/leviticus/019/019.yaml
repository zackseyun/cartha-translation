source:
  edition: WLC
  text: אֶֽת חֻקֹּתַ/י֮ תִּשְׁמֹרוּ֒ בְּהֶמְתְּ/ךָ֙ לֹא תַרְבִּ֣יעַ כִּלְאַ֔יִם שָׂדְ/ךָ֖ לֹא תִזְרַ֣ע כִּלְאָ֑יִם וּ/בֶ֤גֶד כִּלְאַ֨יִם֙ שַֽׁעַטְנֵ֔ז לֹ֥א יַעֲלֶ֖ה עָלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: id
  text: Kamu harus menaati ketetapan-ketetapan-Ku. Jangan kawinkan ternakmu dengan jenis yang berbeda. Jangan menaburi ladangmu dengan benih dari berbagai jenis. Jangan kenakan pakaian dari bahan campuran, yaitu syaatnez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Syaatnez adalah istilah teknis Ibrani untuk kain campuran yang dilarang. Secara tradisional istilah ini dipahami sebagai campuran wol dan linen; bandingkan Ulangan 22:11.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: Bentuk ini mempertahankan jamak dan daya hukum חֻקָּה, serta terdengar wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: תִּשְׁמֹרוּ
  choice: harus menaati
  rationale: Dalam konteks hukum perjanjian, שׁמר berarti memelihara atau menaati; 'harus menaati' menyampaikan tuntutan itu secara alami dan jelas.
- source_word: בְּהֶמְתְּךָ
  choice: ternakmu
  rationale: בְּהֵמָה di sini menunjuk secara luas kepada hewan piaraan dalam konteks pertanian, bukan hanya sapi.
- source_word: תַרְבִּיעַ כִּלְאַיִם
  choice: kawinkan ... dengan ... dari jenis lain
  rationale: Hifil רבע berarti menyebabkan hewan kawin, sedangkan כִּלְאַיִם menyatakan jenis-jenis yang berlainan. Susunan ini alami tanpa mempersempitnya menjadi istilah genetika modern.
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: Jangan taburi ladangmu dengan dua jenis benih
  rationale: '''Taburi ... dengan benih'' menyampaikan tindakan menabur secara idiomatis; ''dua jenis benih'' memperjelas campuran yang tersirat oleh כִּלְאָיִם.'
- source_word: בֶגֶד כִּלְאַיִם
  choice: pakaian dari bahan campuran
  rationale: בֶגֶד adalah pakaian, dan כִּלְאַיִם dalam klausa tekstil menunjuk bahan berlainan yang dicampurkan tanpa dengan sendirinya menyebut serat tertentu.
- source_word: שַׁעַטְנֵז
  choice: syaatnez
  rationale: Istilah teknis yang langka ini ditransliterasikan agar kekhususan dan ketidakpastian leksikalnya terpelihara; catatan kaki menjelaskan pemahaman tradisional.
- source_word: לֹא יַעֲלֶה עָלֶיךָ
  choice: Jangan kenakan
  rationale: Ungkapan harfiah 'jangan naik ke atasmu' secara idiomatis melarang pakaian itu dikenakan. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan sasaran larangan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal orang kedua dipakai karena akhiran Ibrani pada tiga larangan berbentuk tunggal, sementara pembukaan berbentuk jamak kolektif; bahasa Indonesia tidak menandai perbedaan itu pada 'kamu'. Kalimat-kalimat pendek menjaga kejelasan hukum. Istilah 'syaatnez' mengikuti ejaan Indonesia dan diberi penjelasan melalui catatan kaki.
