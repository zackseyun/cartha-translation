  naturalness: Bahasa draf jelas, baku, dan bernada hukum yang wajar. “Memperlakukan ... dengan sewenang-wenang” merupakan ungkapan modern yang baik, meskipun alternatif “menindas” dan “berbuat tidak adil” patut dipertahankan dalam catatan. Peralihan “bersamamu” ke “kalian” mencerminkan sumber dan tetap dapat dipahami dalam bahasa Indonesia.
