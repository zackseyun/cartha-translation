  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: id
  text: Apabila seorang pendatang tinggal bersamamu di negeri kalian,[a] janganlah kalian memperlakukannya dengan sewenang-wenang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pendatang” menerjemahkan kata Ibrani ger, yaitu orang yang bukan anggota bangsa Israel dan menetap di tengah masyarakat Israel; istilah ini juga dapat diterjemahkan “orang asing yang menetap.”
    reason: cultural_note
  - marker: b
    text: Atau “janganlah kalian menindasnya” atau “janganlah kalian berbuat tidak adil terhadapnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Apabila
  rationale: Memperkenalkan keadaan yang mungkin atau diharapkan terjadi dalam rumusan hukum; “apabila” alami dan tidak terlalu menekankan ketidakpastian.
- source_word: יָגוּר
  choice: tinggal
  rationale: Menunjukkan keberadaan menetap sebagai orang bukan pribumi, bukan sekadar kunjungan sementara.
- source_word: אִתְּךָ
  choice: bersamamu
  rationale: Mencerminkan langsung preposisi dengan sufiks orang kedua tunggal.
- source_word: גֵּר
  choice: seorang pendatang
  rationale: Menunjuk orang bukan pribumi yang tinggal di tengah masyarakat Israel. “Pendatang” lebih alami daripada istilah administratif dan, bersama kata “tinggal,” menyampaikan statusnya sebagai warga menetap nonpribumi.
- source_word: בְּאַרְצְכֶם
  choice: di negerimu
  rationale: “Negeri” mempertahankan gagasan tanah tempat komunitas Israel hidup. Bahasa Indonesia memakai bentuk yang sama untuk sapaan tunggal maupun jamak, sehingga peralihan jumlah dalam bahasa Ibrani tidak tampak secara morfologis.
- source_word: לֹא תוֹנוּ
  choice: janganlah kamu memperlakukannya dengan sewenang-wenang
  rationale: Bentuk Hifil dari ינה mencakup berbuat salah, menindas, atau memperlakukan secara buruk. Ungkapan ini luas, jelas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: אֹתוֹ
  choice: -nya
  rationale: Pronomina objek merujuk kembali kepada גֵּר; bentuk “-nya” alami dalam bahasa Indonesia tanpa mengubah rujukannya.
theological_decisions:
- issue: Makna גֵּר dalam hukum kekudusan Israel
  choice: pendatang
  alternative: orang asing; penduduk asing; perantau
  rationale: Istilah ini bukan sekadar orang yang tidak dikenal atau pelancong, melainkan orang non-Israel yang tinggal di negeri itu dan berada dalam lingkup perlindungan sosial-hukum Israel. Nuansa menetap diperjelas oleh verba “tinggal”.
- issue: Cakupan larangan ינה
  choice: memperlakukan dengan sewenang-wenang
  alternative: menindas; berbuat tidak adil terhadap; memperlakukan dengan buruk
  rationale: Pilihan utama mempertahankan keluasan tindakan salah yang dilarang tanpa membatasinya hanya pada penindasan struktural; alternatif utama dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk larangan “janganlah” mempertahankan nada hukum tanpa terasa kuno. Sapaan “kamu” dapat berfungsi secara kolektif dalam konteks ini; teks Ibrani beralih dari bentuk tunggal pada “bersamamu” ke bentuk jamak pada “negeri kalian” dan verba larangan.
