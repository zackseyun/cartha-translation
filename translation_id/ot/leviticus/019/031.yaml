  rationale: Revisi mengganti istilah yang kurang baku dan berpotensi netral, “ahli roh”, dengan “spiritis”, yang lebih jelas menunjuk pada praktisi konsultasi roh dan tetap membedakannya dari “medium”. Catatan kaki diperhalus agar alternatif leksikal dapat dipahami secara modern tanpa mengklaim kepastian tentang makna tepat kedua istilah Ibrani yang diperdebatkan. Struktur, larangan, dan keluasan makna “najis” dipertahankan.
