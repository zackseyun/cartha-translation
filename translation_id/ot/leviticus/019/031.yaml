  naturalness: “Para medium” dan “para spiritis” adalah istilah yang lebih lazim dan jelas dalam bahasa Indonesia modern untuk dua kategori praktisi yang berkaitan dengan konsultasi roh. Bentuk “kamu” tetap dapat berfungsi sebagai jamak dalam konteks larangan kepada umat dan lebih idiomatis daripada “kalian” dalam register kitab suci.
  terminology: “Medium” sesuai untuk אֹבוֹת dalam keputusan leksikal audit, sedangkan “spiritis” lebih tepat dan alami daripada “ahli roh” untuk יִדְּעֹנִים. “Najis” dengan sengaja dibiarkan tidak diperinci sebagai ritual atau moral.
