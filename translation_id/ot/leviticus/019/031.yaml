source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: id
  text: Janganlah berpaling kepada para medium atau para spiritis; janganlah mencari mereka[a] sehingga kamu menjadi najis oleh mereka. Akulah Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah pertama juga dapat diterjemahkan “pemanggil arwah”, sedangkan istilah kedua “orang yang berhubungan dengan roh pendamping” atau “dukun”. Kedua istilah Ibrani ini menunjuk kepada praktisi terlarang yang berkaitan dengan konsultasi dengan roh atau orang mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: berpaling kepada
  rationale: Mempertahankan gambaran dasar verba פנה, yaitu mengarahkan diri atau berpaling kepada seseorang, tanpa mempersempitnya menjadi sekadar ‘meminta petunjuk’.
- source_word: הָאֹבֹת
  choice: para perantara arwah
  rationale: Dalam konteks hukum ini, אוֹב menunjuk kepada pihak yang berkaitan dengan upaya menghubungi arwah atau orang mati. ‘Perantara arwah’ dapat dipahami pembaca modern dan tetap menyisakan ketidakpastian apakah istilah Ibrani terutama menyoroti praktisi atau roh yang dihubungi.
- source_word: הַיִּדְּעֹנִים
  choice: para ahli roh
  rationale: יִדְּעֹנִי adalah istilah bagi praktisi pengetahuan atau konsultasi gaib yang berkaitan dengan roh. ‘Ahli roh’ membedakannya dari perantara arwah tanpa memakai ‘penyihir’, yang dalam pemakaian modern dapat menimbulkan gambaran yang tidak tepat.
- source_word: תְּבַקְשׁוּ
  choice: mencari mereka
  rationale: Menerjemahkan arti dasar בקש, ‘mencari’, dan dalam konteks ini secara wajar menyiratkan usaha mendatangi atau meminta layanan mereka.
- source_word: לְטָמְאָה בָהֶם
  choice: sehingga kalian menjadi najis karena mereka
  rationale: Ungkapan ini mempertahankan nuansa akibat atau tujuan dari infinitif Ibrani dan tidak membatasi kenajisan hanya pada ranah ritual ataupun moral.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: ‘Kalian’ menyatakan dengan jelas bahwa sufiks orang kedua dalam bahasa Ibrani berbentuk jamak.
theological_decisions:
- issue: Sifat kenajisan akibat praktik terlarang
  choice: menjadi najis
  alternative: menjadi najis secara ritual; tercemar secara moral
  rationale: טמא dalam konteks Imamat dapat mencakup dimensi ritual dan moral. Terjemahan tidak mempersempit cakupannya pada salah satu dimensi saja.
- issue: Rujukan dua istilah okultisme
  choice: Mempertahankan dua kelompok praktisi yang berbeda tanpa mendefinisikan metode mereka secara terlalu pasti.
  alternative: Menyamakan keduanya sebagai pemanggil arwah atau penyihir.
  rationale: Makna tepat אוֹב dan יִדְּעֹנִי diperdebatkan, tetapi kesejajaran teks menunjukkan dua sebutan yang patut tetap dibedakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada larangan yang tegas dan bermartabat. ‘Kalian’ dipakai untuk menampilkan bentuk jamak Ibrani secara jelas; istilah praktik gaib dibuat cukup alami tetapi tidak terlalu menentukan arti dua kata Ibrani yang sukar.
