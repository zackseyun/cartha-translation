  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: id
  text: Apabila kamu masuk ke negeri itu dan menanam segala jenis pohon yang buahnya dapat dimakan, kamu harus menganggap buahnya sebagai tidak bersunat.[a] Selama tiga tahun buah itu harus dianggap tidak bersunat bagimu; tidak boleh dimakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang biasanya berkaitan dengan keadaan tidak bersunat dipakai di sini secara kiasan untuk buah yang selama tiga tahun pertama belum boleh dimakan.
    reason: Menjelaskan metafora leksikal yang sengaja dipertahankan dan akibat hukumnya.
lexical_decisions:
- source_word: וְ/כִי
  choice: Apabila
  rationale: Dalam konteks hukum, ungkapan ini memperkenalkan keadaan yang akan terjadi, bukan alasan kausal. “Apabila” terdengar wajar dan tetap bernada instruksional.
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: kamu masuk ke negeri itu
  rationale: Kata kerja בוא dengan אֶל menyatakan masuk atau datang ke suatu wilayah. “Negeri itu” mempertahankan acuan tertentu tanpa menambahkan nama Kanaan yang tidak disebutkan dalam ayat.
- source_word: וּנְטַעְתֶּם כָּל עֵץ מַאֲכָל
  choice: dan menanam segala jenis pohon yang buahnya dapat dimakan
  rationale: Ungkapan עֵץ מַאֲכָל menunjuk pada pohon penghasil bahan pangan. Rumusan ini alami dalam bahasa Indonesia dan menyampaikan cakupan distributif כָּל tanpa menyiratkan bahwa setiap pohon secara harfiah harus ditanam.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת פִּרְיוֹ
  choice: kamu harus menganggap buahnya tidak bersunat
  rationale: Bahasa Ibrani menerapkan akar ערל secara metaforis kepada buah. “Menganggap” menyampaikan penetapan status, sedangkan “tidak bersunat” mempertahankan metafora sumber.
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: Selama tiga tahun buah itu terlarang bagimu
  rationale: Frasa waktu diletakkan di depan sesuai penekanan Ibrani. “Terlarang bagimu” menjelaskan akibat hukum dari metafora ערל dalam bahasa Indonesia yang alami, sementara metaforanya telah dipertahankan dalam klausa sebelumnya.
- source_word: לֹא יֵאָכֵל
  choice: tidak boleh dimakan
  rationale: Bentuk Nifal bersifat pasif atau impersonal. “Tidak boleh dimakan” mempertahankan larangan pasif tanpa mengubahnya menjadi perintah aktif “jangan kamu makan”.
theological_decisions:
- issue: Apakah metafora buah yang “tidak bersunat” perlu dipertahankan atau seluruhnya diganti dengan istilah fungsional “terlarang”
  choice: Mempertahankan metafora pada penyebutan pertama dan menjelaskan dampak hukumnya dengan “terlarang” pada penyebutan berikutnya
  alternative: Memakai “tidak bersunat” pada kedua penyebutan, atau menggantinya seluruhnya dengan “terlarang”
  rationale: Akar ערל sengaja membawa citra perjanjian dan kekudusan ke dalam ketentuan tentang buah, sehingga metafora tidak boleh dihapus seluruhnya. Namun, pengulangan harfiah “tidak bersunat bagimu” sangat tidak alami dan berpotensi kabur dalam bahasa Indonesia; “terlarang bagimu” menyampaikan fungsi hukumnya tanpa meniadakan metafora yang sudah tampak pada klausa pertama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” mempertahankan sapaan jamak kolektif kepada umat tanpa menambahkan penjelasan denominatif. Kalimat mengikuti urutan hukum Ibrani tetapi disusun agar tetap mudah dipahami pembaca umum.
