  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: id
  text: Jika kamu hidup menurut ketetapan-ketetapan-Ku[a], berpegang pada perintah-perintah-Ku, dan melakukannya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “berjalan dalam ketetapan-ketetapan-Ku,” yaitu menata hidup sesuai dengan ketetapan-ketetapan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan daya syarat yang jelas dalam rumusan perjanjian; “apabila” mungkin, tetapi sedikit kurang langsung.
- source_word: בְּחֻקֹּתַי תֵּלֵכוּ
  choice: kamu hidup menurut ketetapan-ketetapan-Ku
  rationale: Secara harfiah berarti “kamu berjalan dalam ketetapan-ketetapan-Ku,” tetapi dalam bahasa Ibrani ini merupakan ungkapan tentang menata cara hidup sesuai dengan ketetapan Allah. Terjemahan ini menyampaikan makna idiomatis secara alami sambil mempertahankan nuansa perilaku hidup.
- source_word: מִצְוֺתַי
  choice: perintah-perintah-Ku
  rationale: מִצְוָה menunjuk pada perintah dalam konteks hukum-perjanjian; bentuk jamak Indonesia mencerminkan bentuk jamak sumber.
- source_word: תִּשְׁמְרוּ
  choice: berpegang pada
  rationale: Dalam konteks hukum, שׁמר berarti menjaga, menaati, atau mengindahkan. “Berpegang pada” terdengar alami dan mencakup kesetiaan terhadap perintah tanpa melebur dengan kata kerja berikutnya, “melakukan.”
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: dan melakukannya
  rationale: Menyampaikan tindakan nyata menjalankan perintah-perintah tersebut dan mempertahankan penekanan sumber pada pelaksanaan.
theological_decisions:
- issue: Ungkapan ketaatan dalam perjanjian
  choice: Menerjemahkan idiom הלך ב secara idiomatis sebagai “hidup menurut,” dengan arti harfiah dijelaskan dalam catatan kaki.
  alternative: berjalan dalam ketetapan-ketetapan-Ku
  rationale: Bahasa Indonesia modern tidak lazim memakai “berjalan dalam ketetapan” untuk cara hidup. “Hidup menurut” mempertahankan makna etis-perjanjian tanpa menambahkan gagasan teologis yang tidak dinyatakan teks, sedangkan catatan kaki menjaga metafora sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “ketetapan-ketetapan” dan “perintah-perintah” mempertahankan bentuk jamak serta corak hukum-perjanjian. Koma penutup dipertahankan karena ayat ini merupakan anak kalimat bersyarat yang berlanjut ke ayat berikutnya.
