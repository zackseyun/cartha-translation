  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: id
  text: Aku pun[a] akan berjalan melawan mereka[b] dan membawa mereka ke negeri musuh-musuh mereka. Atau, pada waktu itu[c] hati mereka yang tidak bersunat[d] akan direndahkan, dan pada waktu itu mereka akan menerima hukuman atas kesalahan mereka.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan “bahkan Aku.” Ungkapan Ibraninya menekankan tindakan balasan Allah: sebagaimana mereka bertindak terhadap-Nya, demikian pula Dia bertindak terhadap mereka.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berjalan bersama mereka dengan sikap melawan.” Ungkapan ini mengulangi bahasa kutuk perjanjian yang dipakai sepanjang pasal ini dan dapat pula diterjemahkan “berjalan dengan sikap bermusuhan terhadap mereka.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “atau pada waktu itu.” Susunan Ibraninya sulit dan mungkin memperkenalkan saat ketika hati mereka akhirnya direndahkan.
    reason: alternative_reading
  - marker: d
    text: Secara harfiah, “hati mereka yang tidak bersunat,” sebuah metafora perjanjian bagi batin yang keras kepala dan tidak tahir.
    reason: cultural_note
  - marker: e
    text: Dapat juga diterjemahkan “mereka akan menanggung hukuman atas kesalahan mereka,” “mereka akan membayar kesalahan mereka,” atau “kesalahan mereka akan dilunasi.” Idiom Ibraninya menunjuk pada menerima atau menanggung akibat yang patut dari kesalahan.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Aku pun
  rationale: Partikel אַף bersama pronomina mandiri אֲנִי memberi penekanan sekaligus menunjukkan tindakan timbal balik Allah. “Aku pun” menyampaikan keduanya secara ringkas dan alami.
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: akan berjalan melawan mereka
  rationale: Ungkapan ini mengulangi rumusan kutuk perjanjian dalam pasal ini. “Berjalan melawan” mempertahankan gambaran harfiahnya sekaligus menyatakan sikap menentang atau bermusuhan.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: dan membawa mereka ke negeri musuh-musuh mereka
  rationale: Bentuk Hifil dari בוא berarti “membawa.” Preposisi בְּ setelah verba gerak dipahami secara direktif, yaitu menuju atau masuk ke negeri musuh mereka.
- source_word: אוֹ אָז
  choice: Atau, pada waktu itu
  rationale: Susunan ini secara sintaksis sulit. Terjemahan mempertahankan daya disjungtif אוֹ (“atau”) dan hubungan temporal אָז (“pada waktu itu”) tanpa meleburkannya menjadi penafsiran sebab-akibat yang lebih pasti.
- source_word: יִכָּנַע
  choice: akan direndahkan
  rationale: Bentuk Nifal dari כנע berarti “direndahkan” atau “ditundukkan.” Dengan hati sebagai subjek, “direndahkan” dapat mencakup penundukan dan kerendahan batin tanpa secara berlebihan memastikan pertobatan.
- source_word: לְבָבָם הֶעָרֵל
  choice: hati mereka yang tidak bersunat
  rationale: Metafora perjanjian dalam teks Ibrani dipertahankan, bukan diganti dengan “hati yang keras kepala,” agar bobot teologis dan kaitannya dengan pemakaian di bagian Kitab Suci lain tetap terlihat.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: dan pada waktu itu mereka akan menerima hukuman atas kesalahan mereka
  rationale: Dalam konteks ini, רצה dengan עָוֹן menunjuk pada menerima atau menanggung akibat hukuman yang patut atas kesalahan. Pilihan ini menyampaikan arti yudisial idiom tersebut tanpa menyiratkan bahwa mereka menghasilkan pendamaian berdasarkan jasa sendiri.
theological_decisions:
- issue: Metafora הֶעָרֵל yang dikenakan pada hati
  choice: Mempertahankan metafora sebagai “hati mereka yang tidak bersunat”
  alternative: “hati mereka yang keras kepala” atau “hati mereka yang tidak bertobat”
  rationale: Teks memakai metafora perjanjian yang sarat makna, bukan sekadar gambaran umum tentang sikap keras kepala. Mempertahankannya menjaga ketegangan dan hubungan antarteks tanpa memasukkan penafsiran yang terlalu spesifik.
- issue: Makna יִרְצוּ אֶת עֲוֺנָם
  choice: Mereka menerima hukuman atas kesalahan mereka
  alternative: “mereka menanggung hukuman atas kesalahan mereka,” “mereka membayar kesalahan mereka,” atau “mereka mengadakan pemulihan atas kesalahan mereka”
  rationale: Frasa ini berkenaan dengan penerimaan atau penanggungan akibat kesalahan dalam kerangka hukuman perjanjian. Terjemahan utama menghindari kesan bahwa manusia mengadakan pendamaian yang berjasa, sedangkan catatan kaki mempertahankan keluasan idiom Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Kata “Aku” mempertahankan suara ilahi orang pertama; “negeri” cocok untuk konteks wilayah bangsa-bangsa; pengulangan “pada waktu itu” mengikuti pengulangan אָז dalam teks dan menjaga struktur wacananya. Metafora “hati yang tidak bersunat” sengaja dipertahankan dan dijelaskan melalui catatan kaki.
