  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: id
  text: Aku akan berpaling kepada kalian[a], membuat kalian berbuah, dan membuat kalian bertambah banyak. Aku akan meneguhkan perjanjian-Ku dengan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan memandang kalian dengan penuh perkenanan.” Secara harfiah, bahasa Ibraninya berbunyi “Aku akan berpaling kepada kalian”; dalam konteks ini ungkapan tersebut menyiratkan perkenanan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: Aku akan berpaling kepada kalian
  rationale: Mempertahankan gambaran konkret verba פנה, yaitu berpaling atau mengarahkan diri kepada seseorang. Dalam konteks berkat perjanjian, ungkapan ini menyiratkan perhatian dan perkenanan Allah.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: membuat kalian berbuah
  rationale: Bentuk Hifil dari פרה bersifat kausatif. Pilihan ini mempertahankan bahasa khas berkat tentang keberbuahan tanpa membatasinya secara eksplisit pada kesuburan biologis.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: membuat kalian bertambah banyak
  rationale: Bentuk Hifil dari רבה berarti menyebabkan menjadi banyak. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan rumusan berkat 'berbuah dan bertambah banyak'.
- source_word: וַהֲקִימֹתִי
  choice: Aku akan meneguhkan
  rationale: Hifil קום bersama בְּרִית dapat berarti menegakkan, menetapkan, atau meneguhkan perjanjian. Dalam konteks perjanjian yang sudah ada, 'meneguhkan' secara alami menjaga kemungkinan makna mengukuhkan atau memberlakukan perjanjian tersebut.
- source_word: בְּרִיתִי אִתְּכֶם
  choice: perjanjian-Ku dengan kalian
  rationale: בְּרִית diterjemahkan secara konsisten sebagai 'perjanjian', sedangkan אִתְּכֶם menyatakan hubungan perjanjian 'dengan kalian'.
theological_decisions:
- issue: Apakah makna perkenanan dalam tindakan Allah yang berpaling perlu dibuat eksplisit
  choice: Mempertahankan ungkapan konkret 'Aku akan berpaling kepada kalian' dalam teks utama
  alternative: Aku akan memandang kalian dengan berkenan
  rationale: Konteks menunjukkan perkenanan ilahi, tetapi verba Ibraninya secara harfiah menggambarkan tindakan berpaling atau mengarahkan diri. Teks utama mempertahankan citra tersebut, sedangkan catatan menjelaskan implikasinya.
- issue: Makna וַהֲקִימֹתִי dalam kaitannya dengan perjanjian
  choice: Aku akan meneguhkan perjanjian-Ku
  alternative: Aku akan menetapkan perjanjian-Ku
  rationale: Perjanjian dengan Israel telah menjadi kerangka pasal ini, sehingga 'meneguhkan' sesuai dengan konteks dan tetap berada dalam rentang makna konstruksi Ibrani. Alternatif 'menetapkan' juga mungkin secara leksikal.
- issue: Cakupan berkat keberbuahan dan pertambahan
  choice: membuat kalian berbuah dan membuat kalian bertambah banyak
  alternative: membuat kalian subur dan memperbanyak jumlah kalian
  rationale: Pilihan utama mempertahankan gema rumusan berkat Pentateukh dan tidak mempersempit maknanya menjadi pernyataan demografis semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' dipakai agar sapaan Ibrani bentuk jamak terlihat jelas; 'Aku' dan sufiks hormat '-Ku' merujuk kepada Allah. Susunan kalimat dibagi menjadi dua agar mudah dibaca tanpa mengubah hubungan antarklausa.
