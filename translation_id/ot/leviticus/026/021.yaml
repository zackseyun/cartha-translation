base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: id
  text: Namun, jika kamu hidup menentang Aku[a] dan tidak mau mendengarkan Aku, Aku akan menambah pukulan atasmu tujuh kali lipat sesuai dengan dosa-dosamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berjalan terhadap Aku dengan sikap berlawanan.” Ungkapan Ibrani ini juga dapat diterjemahkan “bersikap bermusuhan terhadap Aku” atau “berperilaku melawan Aku.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Aku akan menambah pukulan atasmu tujuh kali karena dosa-dosamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: kamu hidup menentang Aku
  rationale: Secara harfiah ungkapan ini memakai kata ‘berjalan’ sebagai kiasan untuk perilaku atau cara hidup. ‘Hidup menentang Aku’ menyampaikan idiom itu secara wajar dalam bahasa Indonesia sekaligus mempertahankan sikap perlawanan yang dinyatakan קֶרִי.
- source_word: קֶרִי
  choice: menentang
  rationale: Dalam rangkaian Imamat 26, kata yang sulit ini menunjuk pada sikap berlawanan atau bermusuhan terhadap Allah, bukan sekadar tindakan yang terjadi secara kebetulan.
- source_word: וְלֹא תֹאבוּ לִשְׁמֹעַ לִי
  choice: dan tidak mau mendengarkan Aku
  rationale: תֹאבוּ menyatakan kemauan, sedangkan שׁמע mempertahankan gambaran mendengar atau mendengarkan yang dalam konteks perjanjian juga menyiratkan ketaatan.
- source_word: וְיָסַפְתִּי עֲלֵיכֶם מַכָּה
  choice: Aku akan menimpakan pukulan tambahan atas kamu
  rationale: יָסַפְתִּי berarti menambah, dan מַכָּה mencakup pukulan atau malapetaka tanpa harus dibatasi menjadi wabah tertentu. Susunan ini mempertahankan gagasan bahwa hukuman sebelumnya akan ditambah.
- source_word: שֶׁבַע
  choice: tujuh kali lipat
  rationale: Kata ‘tujuh’ dipakai secara adverbial dalam rumusan hukuman yang meningkat; ‘tujuh kali lipat’ merupakan padanan Indonesia yang jelas dan alami.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: sesuai dengan dosa-dosamu
  rationale: Prefiks כ menyatakan kesesuaian atau perbandingan. Pilihan ini mempertahankan hubungan proporsional antara hukuman dan dosa, bukan hanya hubungan sebab-akibat.
theological_decisions:
- issue: Sifat peningkatan hukuman perjanjian
  choice: Menyatakan bahwa Allah akan menambahkan hukuman tujuh kali lipat sesuai dengan dosa umat, tanpa menentukan bentuk hukumannya secara lebih sempit.
  alternative: Menafsirkan מַכָּה secara khusus sebagai ‘wabah’ atau menerjemahkan כְּחַטֹּאתֵיכֶם hanya secara kausal sebagai ‘karena dosa-dosamu’.
  rationale: Konteks berisi sanksi perjanjian yang makin berat. Teks menegaskan peningkatan penghukuman ilahi, tetapi kata מַכָּה cukup luas dan tidak mengharuskan satu mekanisme tertentu.
- issue: Makna mendengarkan dalam konteks perjanjian
  choice: Memakai ‘mendengarkan’ dan membiarkan nuansa menaati tetap tersirat.
  alternative: Menerjemahkan langsung sebagai ‘menaati’.
  rationale: שׁמע dapat menyiratkan ketaatan dalam konteks ini, tetapi bentuk leksikalnya tetap berkaitan dengan mendengar. Terjemahan ini tidak menghapus ketegangan antara mendengar dan menaati.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai ‘Aku’ sesuai konteks ucapan langsung Allah. ‘Hidup menentang’ dipilih daripada bentuk harfiah ‘berjalan menentang’ agar idiom mudah dipahami pembaca masa kini tanpa menghilangkan gagasan cara hidup yang berlawanan.
