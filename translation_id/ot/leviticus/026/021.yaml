  terminology: Pemakaian “Aku” konsisten dengan ujaran ilahi dan register khidmat. “Pukulan” mempertahankan keluasan מַכָּה tanpa mempersempitnya menjadi “wabah.” Catatan a perlu dirumuskan ulang karena “berjalan bersama Aku dalam pertentangan” berpotensi menyiratkan kebersamaan, padahal idiom tersebut menyatakan sikap berlawanan terhadap Allah.
