  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: id
  text: Kalian akan memakan daging anak-anak lelaki kalian, dan kalian akan memakan daging anak-anak perempuan kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Kalian akan memakan
  rationale: Bentuk Qal orang kedua jamak dari אכל dalam rangkaian kutuk perjanjian menyatakan akibat yang akan terjadi. Bentuk masa depan dengan 'akan' menyampaikan daya prediktifnya secara alami.
- source_word: בְּשַׂר
  choice: daging
  rationale: בָּשָׂר berarti daging tubuh. Dalam bahasa Indonesia, 'daging' merupakan padanan langsung dan tidak memperhalus kengerian kanibalisme yang dinyatakan.
- source_word: בְּנֵיכֶם
  choice: anak-anak lelaki kalian
  rationale: Bentuk jamak maskulin 'anak-anak lelaki' dipertahankan secara khusus karena klausa berikutnya menyebut anak-anak perempuan secara terpisah.
- source_word: וּבְשַׂר
  choice: dan ... daging
  rationale: Kata benda yang diulang dalam bahasa Ibrani juga diulang untuk mempertahankan kesejajaran dan tekanan retoris ayat.
- source_word: בְּנֹתֵיכֶם
  choice: anak-anak perempuan kalian
  rationale: Padanan langsung ini mempertahankan pasangan eksplisit anak lelaki dan anak perempuan dalam teks sumber.
- source_word: תֹּאכֵלוּ
  choice: kalian akan memakan
  rationale: Kata kerja kedua dipertahankan, bukan dilesapkan, untuk menjaga pengulangan, kesejajaran, dan penekanan dalam bahasa Ibrani.
theological_decisions:
- issue: Pernyataan kanibalisme sebagai kutuk perjanjian
  choice: 'Diterjemahkan sebagai peringatan langsung tentang apa yang akan terjadi: ''Kalian akan memakan daging ...'''
  alternative: Ungkapan yang diperhalus atau dipahami hanya secara kiasan
  rationale: Teks menyatakan kutuk itu secara gamblang. Terjemahan tidak memperhalusnya dan tidak menambahkan penjelasan teologis yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina jamak 'kalian' memperjelas bahwa bentuk Ibrani ditujukan kepada orang kedua jamak. Susunan paralel serta pengulangan kata kerja dan kata 'daging' dipertahankan.
