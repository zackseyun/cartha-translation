base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: id
  text: Mereka akan tersandung satu sama lain[a], seolah-olah di hadapan pedang, padahal tidak ada yang mengejar; dan kamu tidak akan mampu bertahan[b] di hadapan musuh-musuhmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang terhadap saudaranya”; maksudnya, mereka akan saling bertabrakan atau tersandung dalam kepanikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kamu tidak akan dapat berdiri teguh di hadapan musuh-musuhmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: akan tersandung
  rationale: Kata kerja כשל menggambarkan tindakan tersandung atau terhuyung. “Tersandung” mempertahankan gambaran konkret kepanikan dan keruntuhan.
- source_word: אִישׁ בְּאָחִיו
  choice: satu sama lain
  rationale: Secara harfiah, “seorang terhadap/karena saudaranya.” Dalam konteks ini ungkapan tersebut menggambarkan orang-orang yang saling bertabrakan atau tersandung dalam kepanikan; “satu sama lain” menyampaikan sifat timbal baliknya secara wajar.
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: seolah-olah menghadapi pedang
  rationale: Gabungan כְּ dan מִפְּנֵי berarti “seperti dari hadapan” atau “seolah-olah di hadapan.” Terjemahan ini mempertahankan perbandingan tanpa menambahkan tindakan “melarikan diri” yang tidak dinyatakan secara eksplisit.
- source_word: וְרֹדֵף אָיִן
  choice: padahal tidak ada yang mengejar
  rationale: 'Teks secara harfiah menyatakan bahwa tidak ada pengejar. “Padahal” menyampaikan pertentangan kontekstual: mereka panik seakan-akan dikejar meskipun tidak ada pengejar.'
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: kamu tidak akan mampu bertahan
  rationale: תְּקוּמָה dapat berarti keadaan berdiri, kebangkitan, atau kemampuan untuk berdiri teguh. Dalam konteks permusuhan, frasa ini menyatakan ketidakmampuan untuk mempertahankan posisi atau melawan.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: di hadapan musuh-musuhmu
  rationale: Padanan langsung dan wajar bagi לִפְנֵי dalam konteks konfrontasi dengan musuh.
