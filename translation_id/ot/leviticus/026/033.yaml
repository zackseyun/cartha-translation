  naturalness: Bahasanya baku, modern, dan sesuai register nubuat penghukuman. “Sunyi sepi” dapat dipahami terutama sebagai keadaan hening atau tanpa penghuni, sedangkan שְׁמָמָה menekankan kehancuran/ketandusan. “Menjadi tandus” lebih langsung menangkap keadaan negeri yang dimusnahkan.
