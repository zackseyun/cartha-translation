  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: id
  text: Aku akan menyerakkan kamu di antara bangsa-bangsa dan menghunus pedang[a] untuk mengejar kamu; negerimu akan menjadi tandus, dan kota-kotamu akan menjadi reruntuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan mengeluarkan pedang dari sarungnya untuk mengejar kamu.”
    reason: Alternatif leksikal untuk idiom Ibrani וַהֲרִיקֹתִי ... חָרֶב; penanda ditempatkan pada “pedang,” unsur yang dijelaskan catatan.
lexical_decisions:
- source_word: אֱזָרֶה
  choice: Aku akan menyerakkan
  rationale: Bentuk Hifil dari זרה menyatakan tindakan menyebarkan atau mencerai-beraikan. 'Menyerakkan' alami dalam konteks penghukuman dan mempertahankan gambaran pembuangan.
- source_word: בַגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם di sini menunjuk kepada bangsa-bangsa asing sebagai lingkungan pembuangan; 'bangsa-bangsa' tidak memasukkan konotasi teologis yang tidak dituntut teks.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: menghunus pedang
  rationale: Ungkapan dengan ריק dan חֶרֶב berarti mengeluarkan pedang dari sarungnya. 'Menghunus pedang' merupakan padanan Indonesia yang konkret, ringkas, dan lazim.
- source_word: אַחֲרֵיכֶם
  choice: untuk mengejar kamu
  rationale: Secara harfiah berarti 'di belakang/sesudah kamu', tetapi dalam gabungan dengan pedang ungkapan ini menyatakan pengejaran yang bermusuhan. Padanan ini menyampaikan fungsi kontekstualnya dengan jelas.
- source_word: שְׁמָמָה
  choice: sunyi sepi
  rationale: Nomina ini menyatakan keadaan telantar dan tanpa penghuni akibat kehancuran. 'Menjadi sunyi sepi' adalah ungkapan Indonesia alami yang mempertahankan gambaran negeri yang ditinggalkan.
- source_word: חָרְבָּה
  choice: reruntuhan
  rationale: Nomina ini menunjuk kepada keadaan atau tempat yang telah hancur. Dengan subjek kota-kota, 'menjadi reruntuhan' merupakan padanan yang alami dan tepat.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: akan menjadi
  rationale: Dalam konteks kutuk perjanjian, היה menyatakan perubahan menuju keadaan sunyi sepi dan hancur; 'akan menjadi' mempertahankan nuansa resultatif tersebut.
theological_decisions:
- issue: Bahasa penghukuman perjanjian yang menyatakan pembuangan dan pengejaran militer
  choice: 'Mempertahankan pelaku ilahi orang pertama secara langsung: ''Aku akan menyerakkan ... [Aku akan] menghunus pedang'''
  alternative: Menggunakan bentuk pasif atau impersonal untuk memperhalus pelaku ilahi
  rationale: Teks Ibrani secara eksplisit menghubungkan tindakan-tindakan penghukuman ini dengan Allah sebagai pembicara. Terjemahan mempertahankan daya teologis tersebut tanpa memperhalusnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Aku' mengikuti tuturan langsung ilahi dalam konteks pasal. Struktur paralel Ibrani dipertahankan, sementara 'untuk mengejar kamu' mengungkapkan secara alami makna idiomatis pedang yang dihunus 'sesudah' mereka.
