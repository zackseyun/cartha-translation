  to: 'Aku pun akan melakukan ini terhadap kalian: Aku akan mendatangkan atas kalian kengerian yang tiba-tiba[a], penyakit yang membuat tubuh merana[b], dan demam, yang membuat mata merana dan menguras kehidupan[c]. Kalian akan menabur benih dengan sia-sia, dan musuh-musuh kalian akan memakannya.'
