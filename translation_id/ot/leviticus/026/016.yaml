  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: id
  text: 'Aku pun akan melakukan ini terhadap kalian: Aku akan mendatangkan atas kalian kengerian yang tiba-tiba[a], penyakit yang membuat tubuh merana[b], dan demam, yang membuat mata merana dan menguras kehidupan[c]. Kalian akan menabur benih dengan sia-sia, dan musuh-musuh kalian akan memakannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepanikan.” Kata Ibrani dapat menunjuk kepada kengerian atau kepanikan yang datang mendadak.'
    reason: lexical_alternative
  - marker: b
    text: Jenis penyakit yang dimaksud tidak pasti; istilah Ibraninya tampaknya menunjuk kepada penyakit yang membuat tubuh merana.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “yang menghabiskan mata dan membuat kehidupan merana.” Ungkapan Ibraninya puitis; bagian tentang kehidupan menggambarkan vitalitas yang merana atau terkuras.'
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Aku pun
  rationale: אַף bersama pronomina mandiri memberi penekanan sekaligus menyatakan tanggapan lanjutan. 'Aku pun' alami dalam bahasa Indonesia dan mempertahankan daya pembalasan dalam konteks perjanjian.
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: akan melakukan ini terhadap kalian
  rationale: Konstruksi עשה + זאת + ל menyatakan tindakan yang diarahkan kepada para pendengar; dalam konteks penghukuman, 'terhadap kalian' lebih tepat daripada 'bagi kalian'.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: Aku akan mendatangkan atas kalian
  rationale: Bentuk Hifil פקד dapat berarti menetapkan, menugaskan, atau menimpakan. Dalam konteks kutuk perjanjian, 'mendatangkan atas kalian' jelas dan alami tanpa menghilangkan gagasan bahwa hukuman itu dikenakan oleh Allah.
- source_word: בֶּהָלָה
  choice: kengerian yang tiba-tiba
  rationale: Nomina ini menunjuk kepada kengerian, kepanikan, atau kegentaran mendadak. Pilihan ini menangkap unsur rasa takut dan serangan yang tiba-tiba.
- source_word: הַשַּׁחֶפֶת
  choice: penyakit yang menggerogoti tubuh
  rationale: Jenis penyakit kuno ini tidak dapat dipastikan. Terjemahan deskriptif menyampaikan efek melemahkan atau menguruskan tanpa mengidentifikasikannya secara terlalu khusus sebagai tuberkulosis.
- source_word: הַקַּדַּחַת
  choice: demam
  rationale: Kata ini menunjuk kepada panas demam atau peradangan; 'demam' merupakan padanan Indonesia modern yang paling jelas.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: yang membuat mata merana
  rationale: Partisip כלה menyatakan menghabiskan, menggerogoti, atau membuat merana. Ungkapan ini mempertahankan citra mata yang melemah akibat penyakit atau penderitaan.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: dan hidup tersiksa
  rationale: Frasa yang sulit ini menggambarkan נֶפֶשׁ—kehidupan atau diri yang hidup—sebagai sesuatu yang merana atau menderita. Terjemahan ini menghindari pemaksaan konsep jiwa tak berjasad.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: Kalian akan menabur benih dengan sia-sia
  rationale: לריק berarti tanpa hasil atau sia-sia. Ungkapan Indonesia ini setia pada gambaran pertanian dan mudah dipahami.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: dan musuh-musuh kalian akan memakannya
  rationale: Waw diterjemahkan langsung sebagai 'dan'. Sufiks objek merujuk kembali kepada benih atau hasil tanaman; 'memakannya' mempertahankan gambaran konkret teks.
theological_decisions:
- issue: Makna נָפֶשׁ dalam konteks kutuk
  choice: hidup
  alternative: jiwa; diri
  rationale: Dalam konteks penyakit yang melemahkan, נֶפֶשׁ menunjuk kepada kehidupan atau vitalitas orang itu. 'Hidup' mempertahankan cakupan Ibrani tanpa memasukkan antropologi dualistis.
- issue: Pelaku dan sifat penghukuman perjanjian
  choice: Allah secara langsung mendatangkan malapetaka atas umat yang tidak taat
  alternative: ungkapan pasif atau impersonal tentang malapetaka yang terjadi
  rationale: Bentuk orang pertama אֶעֱשֶׂה dan וְהִפְקַדְתִּי secara eksplisit menampilkan Allah sebagai pelaku. Terjemahan mempertahankan ketegangan teologis tersebut dan tidak melunakkannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar pembedaan jumlah dalam bahasa Ibrani tetap jelas. Gaya dibuat lugas dan bermartabat. Citra penyakit dipertahankan secara deskriptif tanpa diagnosis medis yang terlalu khusus; frasa sulit mengenai mata dan נֶפֶשׁ diterjemahkan secara alami, dengan bentuk yang lebih harfiah dicatat dalam catatan kaki.
