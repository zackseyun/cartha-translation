  yaml_path: translation/ot/leviticus/026/007.yaml
  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: id
  text: Kalian akan mengejar musuh-musuh kalian, dan mereka akan jatuh di hadapan kalian oleh pedang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "mereka akan jatuh di hadapan kalian karena pedang." Dalam konteks pertempuran, "jatuh" dapat menyiratkan kekalahan atau kematian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: Kamu akan mengejar
  rationale: Kata רדף lazim berarti “mengejar” atau “memburu.” “Mengejar” alami dalam bahasa Indonesia dan mempertahankan konteks militernya.
- source_word: אֹיְבֵיכֶם
  choice: musuh-musuhmu
  rationale: Kata אֹיֵב adalah istilah umum untuk “musuh,” dan akhiran orang kedua jamak dinyatakan dengan bentuk posesif “-mu,” yang dalam konteks ini menyapa bangsa Israel secara kolektif.
- source_word: וְנָפְלוּ
  choice: dan mereka akan tewas
  rationale: Secara harfiah נפל berarti “jatuh,” tetapi dalam konteks pertempuran, diikuti לֶחָרֶב, ungkapan ini secara idiomatis menyatakan gugur atau tewas karena pedang. “Tewas” menyampaikan maksudnya secara alami tanpa menyiratkan bahwa mereka hanya tersungkur.
- source_word: לִפְנֵיכֶם
  choice: di hadapanmu
  rationale: Ungkapan לפני dengan akhiran pronominal berarti “di hadapan” atau “di depan.” “Di hadapanmu” mempertahankan gambaran bahwa musuh jatuh di depan umat yang disapa.
- source_word: לֶחָרֶב
  choice: oleh pedang
  rationale: Preposisi ל dengan חֶרֶב dalam konteks ini menunjukkan sarana atau penyebab kematian dalam pertempuran. “Oleh pedang” mempertahankan gambaran Ibrani dan terdengar wajar dalam ragam Alkitabiah modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Kata ganti tunggal “kamu” dipakai sebagai sapaan kolektif kepada Israel, sedangkan “musuh-musuhmu” mewakili bentuk jamak Ibrani secara alami. Susunan kalimat mempertahankan paralelisme tindakan dan akibat dalam teks sumber.
