source:
  edition: WLC
  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: id
  text: Jika melalui semua ini kamu tidak juga menerima didikan-Ku, tetapi tetap hidup menentang Aku,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah memakai kata “bersama-Ku” dan sebuah kata yang dapat menyatakan pertentangan atau permusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: melalui semua ini
  rationale: Preposisi ב dipahami secara instrumental dan menunjuk pada hukuman-hukuman yang disebut sebelumnya; “melalui semua ini” alami dalam bahasa Indonesia serta mempertahankan kaitan konteks.
- source_word: תִוָּסְרוּ לִי
  choice: menerima didikan-Ku
  rationale: Bentuk Nifal dari יסר menyatakan dikenai didikan atau koreksi. Ungkapan ini menyampaikan bahwa tindakan disiplin telah terjadi tetapi tidak menghasilkan tanggapan yang semestinya; לִי diungkapkan secara idiomatis melalui akhiran “-Ku” tanpa memaksakan fungsi gramatikal yang sepenuhnya pasti.
- source_word: וַהֲלַכְתֶּם
  choice: tetapi tetap hidup
  rationale: Kata kerja “berjalan” merupakan metafora Ibrani bagi cara hidup. “Tetapi” menyatakan kontras dalam kalimat bersyarat, sedangkan “tetap” memperjelas keberlanjutan sikap mereka setelah dididik.
- source_word: עִמִּי קֶרִי
  choice: menentang Aku
  rationale: Ungkapan khas ini secara harfiah memakai “bersama-Ku” diikuti קֶרִי, kata yang mengungkapkan pertentangan atau permusuhan. “Menentang Aku” alami dan jelas, sementara ketidakpastian nuansa istilah tersebut dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna ungkapan perjanjian עִמִּי קֶרִי
  choice: hidup menentang Aku
  alternative: berjalan bersama-Ku dalam permusuhan; hidup berlawanan dengan Aku
  rationale: Pilihan ini mempertahankan gambaran tentang sikap aktif yang berlawanan dengan TUHAN tanpa mempersempitnya menjadi sekadar pelanggaran aturan atau memasukkan kategori teologis dari tradisi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan orang kedua jamak Ibrani diterjemahkan dengan “kamu”, sesuai pemakaian baku yang dapat bersifat tunggal maupun jamak; kapitalisasi pada “-Ku” dan “Aku” menandai pembicara ilahi.
