base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: id
  text: Akulah Yahweh, Allahmu, yang membawa kamu keluar dari negeri Mesir supaya kamu tidak lagi menjadi budak mereka. Aku mematahkan palang-palang kukmu dan membuat kamu berjalan tegak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuat kamu berjalan dengan kepala tegak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi dalam bentuk transliterasi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam rumusan perjanjian ini bentuk tersebut menunjuk kepada satu Allah, yaitu Yahweh; akhiran orang kedua jamak dipahami secara kolektif dan secara alami diterjemahkan dengan '-mu' dalam bahasa Indonesia.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: membawa kamu keluar dari negeri Mesir
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan keluar; ungkapan ini alami sekaligus mempertahankan motif keluaran.
- source_word: מִהְיֹת לָהֶם עֲבָדִים
  choice: supaya kamu tidak lagi menjadi budak mereka
  rationale: Konstruksi ini menyatakan pembebasan dari keadaan diperbudak. 'Budak' menampilkan status keterikatan di Mesir tanpa memperhalusnya menjadi sekadar pelayanan.
- source_word: מֹטֹת עֻלְּכֶם
  choice: batang-batang kukmu
  rationale: מוֹטוֹת menunjuk pada batang atau palang kuk; pilihan ini mempertahankan gambaran konkret penindasan yang dipatahkan.
- source_word: וָאוֹלֵךְ אֶתְכֶם קוֹמְמִיּוּת
  choice: membuat kamu berjalan dengan tegak
  rationale: Bentuk kausatif הלך dipertahankan melalui 'membuat ... berjalan', sedangkan קוֹמְמִיּוּת menggambarkan postur tegak yang menyiratkan martabat yang dipulihkan.
theological_decisions:
- issue: Status Israel di Mesir
  choice: budak
  alternative: hamba
  rationale: Konteksnya adalah pembebasan dari keterikatan yang menindas, sehingga 'budak' lebih tepat daripada istilah yang dapat dipahami sebagai pelayanan sukarela.
- issue: Gambaran penutup tentang pembebasan
  choice: membuat kamu berjalan dengan tegak
  alternative: membuat kamu berjalan dengan kepala tegak
  rationale: Pilihan utama mempertahankan gambaran postur tubuh dan nuansa martabat tanpa membatasi kata Ibrani pada satu idiom penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' dipakai sebagai sapaan kolektif kepada Israel; bentuk '-mu' menjaga kelancaran tanpa menghilangkan cakupan jamak konteksnya.
