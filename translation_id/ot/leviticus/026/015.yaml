  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: id
  text: dan jika kamu menolak ketetapan-ketetapan-Ku, dan jika jiwamu muak terhadap hukum-hukum-Ku,[a] sehingga kamu tidak melakukan segala perintah-Ku dan dengan demikian melanggar perjanjian-Ku,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwamu muak terhadap hukum-hukum-Ku”; ungkapan ini juga dapat dipahami, “seluruh dirimu muak terhadap hukum-hukum-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dan dengan demikian merusak perjanjian-Ku” atau “membatalkan perjanjian-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: Menjaga ragam hukum-perjanjian dari חֻקִּים serta membedakannya dari מִשְׁפָּטִים dan מִצְוֹת dalam ayat ini.
- source_word: תִּמְאָסוּ
  choice: menolak
  rationale: מאס menyatakan penolakan yang dapat mengandung rasa hina; 'menolak' jelas dan alami tanpa melebihkan unsur emosionalnya.
- source_word: מִשְׁפָּטַי
  choice: hukum-hukum-Ku
  rationale: מִשְׁפָּטִים menunjuk pada ketentuan atau putusan hukum. 'Hukum-hukum-Ku' mempertahankan nuansa yuridis dan tetap dapat dibedakan dari 'ketetapan-ketetapan-Ku'.
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: batinmu muak
  rationale: Ungkapan ini mempertahankan נֶפֶשׁ sebagai subjek dan intensitas געל, tetapi memakai 'batin' agar alami dalam bahasa Indonesia serta tidak menyiratkan antropologi teknis yang tidak dituntut konteks.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: sehingga kamu tidak melakukan
  rationale: Menyampaikan hubungan akibat atau tujuan antara rasa muak dan ketidaktaatan tanpa memutus kesinambungan kalimat.
- source_word: כָּל מִצְוֺתַי
  choice: segala perintah-Ku
  rationale: מִצְוֹת berarti perintah-perintah; 'segala perintah-Ku' alami dalam bahasa Indonesia dan mempertahankan cakupan כָּל.
- source_word: לְהַפְרְכֶם
  choice: dengan demikian melanggar
  rationale: Hifil פרר di sini berarti merusak, membatalkan, atau melanggar ikatan perjanjian. Frasa ini menunjukkan bahwa ketidaktaatan tersebut merupakan pelanggaran perjanjian.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: Padanan baku dan tepat bagi בְּרִית dalam konteks hubungan perjanjian antara Allah dan umat-Nya.
theological_decisions:
- issue: Pemertahanan נֶפֶשׁ sebagai subjek ungkapan idiomatis
  choice: batinmu muak
  alternative: kamu muak; jiwamu muak; seluruh dirimu muak
  rationale: '''Batinmu'' mempertahankan rujukan eksplisit pada diri bagian dalam dan intensitas ungkapan Ibrani, tanpa memaksakan pemisahan teknis antara jiwa dan tubuh.'
- issue: Pembedaan istilah-istilah hukum perjanjian
  choice: ketetapan-ketetapan / hukum-hukum / perintah / perjanjian
  alternative: peraturan / keputusan / titah / perjanjian
  rationale: Teks menumpuk beberapa istilah hukum yang berbeda. Padanan terpilih menjaga tekstur dan perbedaannya sejauh wajar dalam bahasa Indonesia.
- issue: Nuansa לְהַפְרְכֶם terhadap perjanjian
  choice: melanggar perjanjian-Ku
  alternative: membatalkan perjanjian-Ku; merusak perjanjian-Ku
  rationale: '''Melanggar'' menyatakan pelanggaran ikatan perjanjian secara jelas tanpa memutuskan bahwa tindakan manusia menghapus keberadaan perjanjian itu secara mutlak.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak ulang dipakai untuk mencerminkan kelompok istilah hukum yang berbeda. 'Batinmu muak' mempertahankan intensitas idiom Ibrani dengan ungkapan yang wajar bagi pembaca Indonesia. Tanda baca mempertahankan ayat ini sebagai lanjutan bersyarat dari konteks sebelumnya.
