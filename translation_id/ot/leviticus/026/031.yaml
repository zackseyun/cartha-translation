  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: id
  text: Aku akan membuat kota-kotamu menjadi reruntuhan dan menelantarkan tempat-tempat kudusmu, dan Aku tidak akan mencium aroma yang menyenangkan dari persembahanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku tidak akan mencium aroma menyenangkanmu.” Ini adalah ungkapan baku tentang kurban yang menyatakan penerimaan Allah; frasa “dari persembahanmu” ditambahkan untuk memperjelas maksudnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת עָרֵיכֶם חָרְבָּה
  choice: Aku akan membuat kota-kotamu menjadi reruntuhan
  rationale: 'נתן dalam konstruksi dengan objek ''kota-kotamu'' dan predikat חָרְבָּה menyatakan hasil kausatif: membuat kota-kota itu menjadi reruntuhan. Bentuk jamak ''kota-kotamu'' dipertahankan.'
- source_word: וַהֲשִׁמּוֹתִי
  choice: dan membinasakan
  rationale: Bentuk Hifil dari שמם berarti menyebabkan menjadi sunyi atau tandus, yakni menghancurkan hingga telantar. 'Membinasakan' menyampaikan daya ancamannya secara wajar dalam bahasa Indonesia.
- source_word: מִקְדְּשֵׁיכֶם
  choice: tempat-tempat kudusmu
  rationale: Bentuk jamak מקדש menunjuk pada tempat yang dikhususkan sebagai kudus. 'Tempat-tempat kudus' mempertahankan bentuk jamak dan cakupan istilah sumber tanpa mempersempit semuanya menjadi satu Bait Suci.
- source_word: וְלֹא אָרִיחַ
  choice: Aku tidak akan mencium
  rationale: Kata kerja ריח secara eksplisit memakai citra indrawi 'mencium'. Terjemahan mempertahankan antropomorfisme sumber dan tidak langsung menggantinya dengan tafsiran 'menerima'.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: aroma menyenangkan dari persembahanmu
  rationale: רֵיחַ נִיחֹחַ adalah ungkapan baku dalam konteks kurban. 'Aroma menyenangkan' mempertahankan citranya, sedangkan 'dari persembahanmu' menjelaskan acuan kultis yang tersirat agar tidak disalahpahami sebagai bau umat itu sendiri.
theological_decisions:
- issue: Apakah klausa terakhir diterjemahkan sebagai tindakan mencium atau langsung sebagai penolakan terhadap kurban
  choice: 'Mempertahankan bahasa indrawi: ''Aku tidak akan mencium aroma menyenangkan dari persembahanmu'''
  alternative: Aku tidak akan menerima persembahanmu / Aku tidak akan berkenan pada kurbanmu
  rationale: Teks Ibrani secara eksplisit menggunakan kata kerja 'mencium' dan ungkapan kurban 'aroma menyenangkan'. Mempertahankan citra ini menjaga tekstur teologis teks, sementara catatan menjelaskan implikasi penerimaannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pronomina ilahi 'Aku' mengikuti tuturan langsung. Pengulangan sufiks orang kedua jamak diterjemahkan dengan bentuk -mu yang secara alami dapat merujuk kepada umat secara kolektif.
