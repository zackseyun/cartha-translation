  edition: WLC
  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: id
  text: Kamu akan binasa di antara bangsa-bangsa, dan negeri musuh-musuhmu akan melahap kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani yang diterjemahkan “melahap” berarti “makan”. Dapat juga diterjemahkan, “negeri musuh-musuhmu akan menghabiskan kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: kamu akan binasa
  rationale: Bentuk Qal dari אבד dalam rangkaian kutuk perjanjian menyatakan kebinasaan atau lenyapnya umat. 'Akan binasa' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi pembunuhan langsung.
- source_word: בַּגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם berarti bangsa-bangsa atau suku-suku bangsa. Ungkapan ini sesuai dengan konteks pembuangan dan tidak memasukkan nuansa istilah keagamaan yang lebih kemudian.
- source_word: וְאָכְלָה
  choice: akan melahap
  rationale: Kata אכל secara harfiah berarti 'makan'. Karena subjeknya adalah negeri, 'melahap' mempertahankan metafora yang kuat dan personifikasi dalam bahasa Indonesia yang wajar.
- source_word: אֶתְכֶם
  choice: kamu
  rationale: Penanda objek langsung dengan sufiks orang kedua jamak diterjemahkan secara alami sebagai 'kamu'; konteks menunjukkan sapaan kepada umat secara kolektif.
- source_word: אֶרֶץ
  choice: negeri
  rationale: Dalam frasa אֶרֶץ אֹיְבֵיכֶם, kata ini menunjuk wilayah atau negeri tempat para musuh berada. 'Negeri' lebih alami daripada 'bumi' dalam konteks pembuangan.
- source_word: אֹיְבֵיכֶם
  choice: musuh-musuhmu
  rationale: Bentuk konstruk dengan sufiks orang kedua jamak menyatakan negeri milik atau tempat para musuh mereka; bentuk ulang mempertahankan makna jamaknya.
theological_decisions:
- issue: Daya metaforis ungkapan 'negeri musuh-musuhmu akan melahap kamu'
  choice: Mempertahankan negeri sebagai subjek yang secara metaforis melahap orang-orang buangan.
  alternative: Menjelaskan metafora menjadi 'negeri musuh-musuhmu akan membinasakan kamu'.
  rationale: Teks Ibrani memakai kata umum 'makan' dengan negeri sebagai subjek. 'Melahap' menjaga gambaran kutuk perjanjian yang keras tanpa menambahkan penafsiran tentang cara kebinasaan itu terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kamu' dipakai sebagai sapaan kolektif sesuai orang kedua jamak dalam bahasa Ibrani. Metafora konkret dipertahankan tanpa penjelasan doktrinal tambahan.
