  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: id
  text: Aku akan mendatangkan binatang liar di padang[a] ke atas kamu. Binatang-binatang itu akan membuat kamu kehilangan anak-anakmu[b], membinasakan ternakmu, mengurangi jumlahmu, dan jalan-jalanmu akan menjadi lengang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “binatang-binatang padang.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai berarti membuat seseorang kehilangan anak atau menjadi tanpa anak; kata “anak-anak” tersirat dalam ungkapan itu.
    reason: implicit_object
  - marker: c
    text: Atau, “jalan-jalanmu akan menjadi terlantar.” Kata yang diterjemahkan “jalan-jalan” juga dapat berarti rute perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: Aku akan mendatangkan ... untuk menyerang kamu
  rationale: Bentuk kausatif שׁלח menyatakan tindakan Allah mengirim atau mendatangkan, sedangkan ב dalam konteks penghukuman bersifat adversatif. Susunan ini alami dalam bahasa Indonesia dan mempertahankan tindakan serta tujuan yang tersurat dalam konstruksi Ibrani.
- source_word: חַיַּת הַשָּׂדֶה
  choice: binatang-binatang liar dari padang
  rationale: Frasa ini menunjuk pada satwa liar yang hidup di kawasan terbuka. 'Binatang-binatang liar dari padang' mempertahankan unsur שׂדה tanpa memakai ungkapan yang kuno.
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: akan membuat kamu kehilangan anak-anakmu
  rationale: Piel שׁכל berarti membuat kehilangan anak atau menjadikan tanpa anak. Bahasa Indonesia memerlukan pelengkap agar idiom ini dipahami secara wajar; objek yang tersirat dijelaskan tanpa mengubah pelakunya.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: membinasakan ternakmu
  rationale: הכרית dalam konteks penghukuman berarti melenyapkan atau membinasakan. 'Membinasakan' lebih alami daripada terjemahan harfiah 'memutuskan', sementara בְּהֵמָה di sini paling tepat berarti ternak.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: mengurangi jumlahmu
  rationale: Hifil מעט berarti membuat menjadi sedikit. Ungkapan ini secara jelas menyampaikan penyusutan jumlah penduduk.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: sehingga jalan-jalanmu menjadi sunyi
  rationale: נשׁם menyatakan keadaan terlantar atau sunyi karena kehancuran. Dalam konteks berkurangnya penduduk, דְּרָכִים paling wajar menunjuk pada jalan atau rute perjalanan. 'Sehingga' mengungkapkan hubungan akibat yang tersirat dalam rangkaian klausa.
theological_decisions:
- issue: Objek tersirat pada kata שׁכל
  choice: Menjelaskan maknanya sebagai kehilangan anak-anak
  alternative: Menerjemahkan secara lebih umum sebagai 'membuat kamu kehilangan orang-orang yang kamu kasihi' atau membiarkan objek tidak disebutkan
  rationale: Dalam pemakaian Ibrani Alkitab, שׁכל lazim berarti kehilangan anak. Menyebut 'anak-anakmu' membuat idiom tersebut dapat dimengerti dalam bahasa Indonesia, tetapi catatan kaki tetap menjelaskan bahwa unsur itu tersirat dan bukan nomina yang tertulis terpisah.
- issue: Hubungan klausa terakhir dengan rangkaian sebelumnya
  choice: Menggunakan 'sehingga' untuk hasil atau akibat
  alternative: Mempertahankan koordinasi formal dengan 'dan'
  rationale: 'Waw dapat menyambungkan akibat dari penyusutan penduduk: jalan-jalan menjadi sunyi. Pilihan ini tidak mengubah isi penghukuman, tetapi membuat alurnya alami dalam bahasa Indonesia.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal kolektif 'kamu', mengikuti sufiks orang kedua jamak Ibrani yang ditujukan kepada umat sebagai satu komunitas. Diksi dibuat lugas dan bermartabat; 'binatang liar', 'ternak', dan 'jalan-jalan' mudah dipahami pembaca umum. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
