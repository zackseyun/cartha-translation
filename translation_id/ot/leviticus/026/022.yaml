    rationale: Kata kerja “mengirim/mendatangkan” dengan ב adversatif menyatakan pengiriman terhadap umat, tetapi tidak secara eksplisit menyatakan tujuan dengan infinitif “untuk menyerang.” Tambahan itu sebaiknya dihilangkan.
  - severity: low
    issue: “Sehingga” menjadikan klausa terakhir hubungan akibat eksplisit
    rationale: Waw pada וְנָשַׁמּוּ terutama mengoordinasikan akibat-akibat penghukuman. “Dan” lebih dekat pada bentuk dan membiarkan hubungan semantis tetap terbuka.
