  naturalness: “Masa-masa Sabat” dan “memperoleh kembali masa-masa Sabatnya” terasa kurang idiomatis dalam bahasa Indonesia modern. “Sabat-Sabatnya” lebih dekat dengan ungkapan sumber dan cukup jelas dalam konteks; “menikmati” merupakan ungkapan Indonesia yang wajar untuk metafora ini.
  terminology: “Tanah itu” lebih tepat dan lazim daripada “negeri itu” untuk הארץ dalam konteks tanah perjanjian dan perhentian pertanian. “Sabat-Sabatnya” mempertahankan istilah serta bentuk jamak Ibrani tanpa menetapkan bahwa yang dimaksud hanya tahun Sabat.
