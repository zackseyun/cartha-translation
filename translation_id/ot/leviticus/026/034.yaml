revisions:
- from: Pada waktu itu, negeri itu akan memperoleh kembali masa-masa Sabatnya selama ditinggalkan telantar,[a] sementara kamu berada di negeri musuh-musuhmu. Pada waktu itu, negeri itu akan beristirahat dan memperoleh kembali masa-masa Sabatnya.
  to: Pada waktu itu tanah itu akan menikmati Sabat-Sabatnya sepanjang hari-hari ketelantarannya,[a] sementara kamu berada di negeri musuh-musuhmu. Pada waktu itu tanah itu akan beristirahat dan menikmati Sabat-Sabatnya.
  rationale: Revisi memakai “menikmati” untuk kedua kemunculan רצה, sehingga pengulangan akar kata dalam Ibrani tetap tampak dan makna kontekstualnya lebih baik daripada “memperoleh kembali.” Frasa duratif diperjelas, dan istilah “tanah” serta “Sabat-Sabatnya” dipilih demi ketepatan dan keluwesan bahasa Indonesia modern.
