  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: id
  text: Pada waktu itu tanah itu akan menikmati Sabat-Sabatnya sepanjang hari-hari ketelantarannya,[a] sementara kamu berada di negeri musuh-musuhmu. Pada waktu itu tanah itu akan beristirahat dan menikmati Sabat-Sabatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menerima ganti atas Sabat-Sabatnya.” Kata kerja Ibrani dalam konteks ini dapat menyatakan bahwa tanah menerima apa yang sebelumnya tidak diberikan kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pada waktu itu
  rationale: Menandai akibat yang terjadi pada masa penghukuman yang telah disebutkan sebelumnya; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: akan memperoleh kembali / memperoleh kembali
  rationale: Dalam konteks masa-masa Sabat yang sebelumnya tidak diberikan kepada negeri itu, verba רצה menyiratkan bahwa negeri tersebut menerima kembali apa yang menjadi haknya. Pilihan yang sama dipertahankan pada kedua kemunculannya.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Yang dimaksud ialah wilayah perjanjian tempat Israel tinggal, bukan seluruh bumi; 'negeri itu' paling wajar dalam konteks ini.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: masa-masa Sabatnya
  rationale: Merujuk pada perhentian Sabat milik negeri itu, khususnya tahun-tahun Sabat. 'Masa-masa' membantu pembaca memahami bentuk jamak tanpa mempersempitnya secara berlebihan.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: selama ditinggalkan telantar
  rationale: Mengungkapkan seluruh jangka waktu ketika negeri itu berada dalam keadaan tandus dan tidak dihuni, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: sementara kamu berada di negeri musuh-musuhmu
  rationale: Klausa ini bersifat sirkumstansial dan menunjukkan keadaan yang berlangsung bersamaan dengan ketelantaran negeri itu.
- source_word: תִּשְׁבַּת
  choice: akan beristirahat
  rationale: Menunjukkan bahwa negeri itu berhenti digarap dan dengan demikian mendapat perhentian; pilihan ini juga mempertahankan kaitannya dengan tema Sabat.
theological_decisions:
- issue: Hubungan negeri itu dengan masa-masa Sabatnya selama pembuangan
  choice: Negeri itu memperoleh kembali masa-masa Sabat yang sebelumnya tidak diterimanya ketika umat berada di negeri musuh.
  alternative: Negeri itu menikmati masa-masa Sabatnya atau berkenan kepada masa-masa Sabatnya.
  rationale: Konteks kutuk perjanjian mendukung nuansa penerimaan kembali atau pelunasan atas perhentian yang terabaikan. Terjemahan ini tidak menjadikan negeri itu seolah-olah merasakan kenikmatan emosional, tetapi tetap mengakui rentang makna verba Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan verba Ibrani dipertahankan, sedangkan susunan kalimat dibuat alami bagi pembaca umum. Bentuk 'kamu' mengikuti sapaan jamak kolektif kepada umat.
