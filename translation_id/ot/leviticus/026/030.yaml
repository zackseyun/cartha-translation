  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: id
  text: Aku akan memusnahkan tempat-tempat pemujaanmu di bukit-bukit dan menumbangkan tugu-tugu pemujaanmu[a]. Aku akan menaruh mayat-mayatmu di atas mayat-mayat berhala-berhalamu[b], dan jiwa-Ku akan muak terhadap kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibraninya menunjuk pada benda pemujaan yang bentuk pastinya diperdebatkan; mungkin tugu pemujaan matahari atau mezbah dupa.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai kata yang sama, “mayat,” baik untuk manusia maupun untuk berhala. Pengulangan ini menegaskan bahwa berhala itu tidak bernyawa sekaligus mempermalukannya.
    reason: lexical_wordplay
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: Aku akan memusnahkan
  rationale: Bentuk Hifil dari שׁמד menyatakan tindakan menyebabkan kehancuran. “Memusnahkan” mempertahankan kekuatan ancaman tanpa menambahkan gagasan yang tidak ada dalam konteks.
- source_word: בָּמֹתֵיכֶם
  choice: tempat-tempat pemujaanmu di bukit-bukit
  rationale: בָּמוֹת menunjuk pada lokasi pemujaan yang biasanya berada di tempat tinggi. Ungkapan ini lebih jelas bagi pembaca Indonesia modern daripada terjemahan harfiah “tempat-tempat tinggi”.
- source_word: הִכְרַתִּי
  choice: menumbangkan
  rationale: כרת secara dasar berarti memotong atau melenyapkan. Untuk benda pemujaan yang berdiri, “menumbangkan” mempertahankan gambaran tindakan fisik secara alami dalam bahasa Indonesia.
- source_word: חַמָּנֵיכֶם
  choice: tugu-tugu pemujaanmu
  rationale: חַמָּנִים menunjuk pada benda-benda kultis, mungkin tugu pemujaan matahari atau perlengkapan pembakaran dupa. Pilihan umum dalam teks utama mempertahankan ketidakpastian bentuk bendanya; kemungkinan yang lebih khusus dicatat dalam catatan kaki.
- source_word: נָתַתִּי
  choice: Aku akan menaruh
  rationale: נתן memiliki cakupan arti memberi, meletakkan, atau menaruh. Dalam gambaran penempatan mayat di atas benda lain, “menaruh” lugas dan alami.
- source_word: פִּגְרֵיכֶם
  choice: mayat-mayatmu
  rationale: פגר berarti mayat atau bangkai. “Mayat” sesuai untuk tubuh manusia dan menyampaikan kerasnya penghukuman.
- source_word: עַל
  choice: di atas
  rationale: Preposisi ini menyatakan penempatan fisik pada atau di atas sesuatu.
- source_word: פִּגְרֵי גִּלּוּלֵיכֶם
  choice: mayat berhala-berhalamu
  rationale: Teks Ibrani memakai kata פגר yang sama bagi manusia dan berhala. Pengulangan “mayat” sengaja dipertahankan meskipun tidak lazim bagi benda mati, karena menekankan bahwa berhala itu tidak bernyawa dan dipermalukan.
- source_word: גִּלּוּלֵיכֶם
  choice: berhala-berhalamu
  rationale: גִּלּוּלִים adalah sebutan bernada sangat menghina bagi berhala. “Berhala” memberikan arti dasar dengan jelas, sedangkan nada penghinaan juga tampak dari penyebutan berhala sebagai mayat.
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: jiwa-Ku akan muak terhadap kalian
  rationale: Terjemahan ini mempertahankan subjek eksplisit “jiwa-Ku” dan kekuatan kata געלה, sekaligus memakai susunan yang dapat dipahami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Ungkapan antropopatik tentang kejijikan ilahi
  choice: jiwa-Ku akan muak terhadap kalian
  alternative: Aku akan muak terhadap kalian
  rationale: Teks menyebut נַפְשִׁי, “jiwa-Ku,” secara eksplisit. Mempertahankannya menjaga daya retoris dan ketegangan teologis sumber, tanpa meratakannya menjadi pernyataan abstrak tentang penolakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan tegas. Sapaan “kalian” dipakai karena akhiran Ibrani berbentuk jamak. Kapitalisasi pada “Aku” dan “-Ku” menandai Allah sebagai pembicara. Kalimat dibagi dua agar rangkaian ancaman tetap jelas tanpa mengurangi hubungan antarklausanya.
