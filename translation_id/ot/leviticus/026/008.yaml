  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: id
  text: Lima orang dari antara kalian akan mengejar seratus orang, dan seratus orang dari antara kalian akan mengejar sepuluh ribu orang[a]. Musuh-musuh kalian akan jatuh di hadapan kalian oleh pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “sepuluh ribu” juga dapat berarti “jumlah yang amat besar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: akan mengejar
  rationale: רדף berarti mengejar atau memburu. Dalam konteks kemenangan militer, “mengejar” alami dalam bahasa Indonesia dan mempertahankan gambaran tindakan aktif.
- source_word: מִכֶּם
  choice: dari antara kamu
  rationale: 'Preposisi מן dengan sufiks di sini bersifat partitif: lima dan seratus orang yang berasal dari kelompok umat itu.'
- source_word: רְבָבָה
  choice: sepuluh ribu orang
  rationale: Kata ini dapat menunjuk sepuluh ribu atau jumlah yang amat besar; angka konkret “sepuluh ribu” paling sesuai dengan peningkatan perbandingan angka dalam kedua klausa.
- source_word: וְנָפְלוּ
  choice: akan tewas
  rationale: נפל secara harfiah berarti jatuh, tetapi dalam konteks peperangan lazim menyatakan gugur atau tewas; pilihan ini menjelaskan akibat pertempuran secara alami tanpa menghilangkan kekuatan pernyataan.
- source_word: אֹיְבֵיכֶם
  choice: musuh-musuhmu
  rationale: Padanan langsung dan wajar bagi bentuk jamak dengan sufiks orang kedua jamak, yang dalam bahasa Indonesia dapat diungkapkan secara kolektif dengan “-mu” kepada umat.
- source_word: לִפְנֵיכֶם
  choice: di hadapanmu
  rationale: Mempertahankan ungkapan spasial Ibrani yang dalam konteks militer menunjukkan kekalahan musuh di depan umat.
- source_word: לֶחָרֶב
  choice: oleh pedang
  rationale: Ungkapan ini menunjukkan sarana kematian atau kekalahan dalam pertempuran dan mempertahankan citra pedang dari teks sumber.
theological_decisions:
- issue: 'Janji kemenangan militer dalam berkat perjanjian: harfiah atau hiperbolis'
  choice: Mempertahankan janji militer langsung dan perbandingan angka tanpa menjelaskan apakah angka itu dimaksudkan secara harfiah atau retoris.
  alternative: Menggeneralisasikannya sebagai janji keberanian atau kemenangan besar tanpa angka konkret.
  rationale: Teks menyatakan kemenangan yang sangat tidak seimbang sebagai bagian dari berkat perjanjian. Terjemahan seharusnya mempertahankan ketegangan dan kekonkretan itu, bukan menentukan terlebih dahulu sifat literal atau retorisnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Dari antara kamu” menyampaikan makna partitif dengan tepat. Bentuk “musuh-musuhmu” memakai sapaan tunggal kolektif yang lazim dalam terjemahan Alkitab Indonesia, meskipun sumber Ibrani menyapa umat secara jamak.
