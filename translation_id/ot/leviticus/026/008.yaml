  terminology: “Mengejar,” “sepuluh ribu,” “di hadapan kalian,” dan “oleh pedang” sesuai dengan istilah serta citra teks sumber. Catatan kaki dipertahankan dan diperjelas tanpa memaksakan salah satu nuansa leksikal רְבָבָה di luar konteks angka.
