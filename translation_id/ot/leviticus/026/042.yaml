  text: וְ/זָכַרְתִּ֖י אֶת בְּרִיתִ֣/י יַעֲק֑וֹב וְ/אַף֩ אֶת בְּרִיתִ֨/י יִצְחָ֜ק וְ/אַ֨ף אֶת בְּרִיתִ֧/י אַבְרָהָ֛ם אֶזְכֹּ֖ר וְ/הָ/אָ֥רֶץ אֶזְכֹּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: id
  text: Maka Aku akan mengingat perjanjian-Ku dengan Yakub[a], dan juga perjanjian-Ku dengan Ishak, dan juga perjanjian-Ku dengan Abraham akan Kuingat; dan negeri itu akan Kuingat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan Aku akan mengingat.” Kata penghubung Ibrani dapat diterjemahkan secara sederhana sebagai “dan”; “maka” menunjukkan hubungan ayat ini dengan konteks sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Maka Aku akan mengingat
  rationale: Kata זכר dalam konteks perjanjian menyiratkan mengingat dengan maksud untuk bertindak, tetapi terjemahan tetap mempertahankan verba “mengingat”. Konjungsi וְ dapat berarti “dan”; “maka” menampilkan hubungan wacana dengan konteks pemulihan sebelumnya.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: בְּרִית adalah istilah baku bagi ikatan perjanjian Allah dengan para leluhur; “perjanjian” merupakan padanan Indonesia yang alami dan berbobot teologis tanpa memperluas makna.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku dalam bahasa Indonesia.
- source_word: וְאַף
  choice: dan juga
  rationale: אַף di sini bersifat aditif sekaligus memberi penegasan; “dan juga” mempertahankan kedua unsur tersebut secara alami.
- source_word: יִצְחָק
  choice: Ishak
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku dalam bahasa Indonesia.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku dalam bahasa Indonesia.
- source_word: אֶזְכֹּר
  choice: akan Kuingat
  rationale: Pengulangan verba finite dipertahankan karena dalam bahasa Ibrani pengulangan itu memberi tekanan retoris pada perjanjian dengan Abraham dan kemudian pada negeri itu.
- source_word: וְהָאָרֶץ
  choice: dan negeri itu
  rationale: אֶרֶץ dalam konteks ini menunjuk kepada negeri yang terkait dengan janji perjanjian. “Negeri itu” lebih khusus daripada “tanah” dan tetap tidak menambahkan nama yang tidak disebut dalam ayat.
theological_decisions:
- issue: Urutan dan penekanan perjanjian dengan para leluhur
  choice: Mempertahankan urutan Ibrani Yakub, Ishak, Abraham serta mengulang frasa “perjanjian-Ku” bagi masing-masing.
  alternative: Mengurutkan Abraham, Ishak, Yakub atau memadatkannya menjadi “perjanjian dengan Abraham, Ishak, dan Yakub”.
  rationale: Urutan terbalik dan pengulangan dalam teks sumber tampaknya disengaja. Mempertahankannya menjaga penekanan retoris dan tidak menggantinya dengan rumusan tradisional yang lebih lazim.
- issue: Makna Allah “mengingat”
  choice: Menerjemahkan זכר sebagai “mengingat” tanpa menjabarkannya menjadi tindakan tertentu.
  alternative: “Mengingat dan bertindak”, “mengindahkan”, atau “memperbarui”.
  rationale: Dalam konteks perjanjian, tindakan Allah tersirat dalam “mengingat”, tetapi ayat ini tidak menyebut tindakan itu secara eksplisit. Bentuk leksikal dipertahankan agar ketegangan teologis sumber tidak diselesaikan melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Susunan “perjanjian-Ku dengan Abraham akan Kuingat” sengaja mempertahankan pengulangan dan penekanan teks Ibrani, meskipun lebih bertanda daripada susunan prosa sehari-hari.
