  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: id
  text: Aku sendiri akan menjadikan tanah itu tandus, dan musuh-musuhmu yang tinggal di sana akan tercengang[a] melihatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan merasa ngeri.” Kata Ibrani ini dapat menyatakan ketercengangan yang disertai kengerian sebagai reaksi terhadap kehancuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: akan membuat ... tandus
  rationale: Bentuk kausatif dari שׁמם menyatakan tindakan menjadikan negeri itu sunyi dan hancur. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan daya kausatifnya.
- source_word: אֲנִי
  choice: Aku sendiri
  rationale: Pronomina mandiri ini memberi penegasan di samping subjek yang sudah terkandung dalam verba; 'sendiri' mempertahankan penekanan tersebut.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks kutuk perjanjian, kata ini menunjuk pada negeri tempat Israel tinggal, bukan seluruh bumi. 'Negeri itu' jelas dan wajar dalam bahasa Indonesia.
- source_word: וְשָׁמְמוּ
  choice: akan tercengang
  rationale: Dalam bentuk sederhana, שׁמם dapat menyatakan ketercengangan atau rasa ngeri sebagai reaksi terhadap kehancuran. Karena subjeknya ialah para musuh yang tinggal di negeri itu, terjemahan ini menyatakan reaksi mereka tanpa membuat mereka sendiri menjadi tandus.
- source_word: עָלֶיהָ
  choice: melihatnya
  rationale: Dengan שׁמם, עַל menandai hal atau keadaan yang menimbulkan ketercengangan. 'Melihatnya' menyampaikan hubungan itu secara alami tanpa menambahkan gagasan tujuan.
- source_word: אֹיְבֵיכֶם
  choice: musuh-musuhmu
  rationale: Padanan langsung untuk bentuk jamak dengan akhiran milik orang kedua jamak; bahasa Indonesia lazim memakai '-mu' secara kolektif dalam sapaan kepada umat.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: yang tinggal di sana
  rationale: Partisipel ישׁב menyatakan keberadaan atau kediaman. 'Di sana' mengacu secara alami kepada negeri itu dan menghindari pengulangan yang kaku.
theological_decisions:
- issue: Cakupan הָאָרֶץ dalam konteks hukuman perjanjian
  choice: negeri itu, yaitu negeri Israel/Kanaan dalam konteks
  alternative: bumi
  rationale: Konteks langsung membicarakan kutuk perjanjian atas negeri tempat Israel tinggal. Terjemahan 'negeri itu' tidak memperluas cakupan hukuman menjadi seluruh bumi.
- issue: Sifat reaksi para musuh dalam וְשָׁמְמוּ
  choice: mereka tercengang karena keadaan negeri yang hancur
  alternative: mereka sendiri menjadi telantar atau negeri itu menjadi tandus bagi mereka
  rationale: Subjek verba ialah para musuh yang tinggal di sana. Makna reaksi berupa ketercengangan atau kengerian sesuai dengan konstruksi שׁמם עַל, tetapi nuansa tepatnya tetap diberi ruang dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Aku sendiri' mempertahankan penegasan ilahi; 'negeri itu' sesuai dengan konteks tanah perjanjian; dan catatan kaki menjaga rentang makna verba Ibrani tanpa membebani teks utama.
