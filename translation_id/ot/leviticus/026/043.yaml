  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: id
  text: Namun, negeri itu akan ditinggalkan oleh mereka dan akan menikmati Sabat-Sabatnya selama negeri itu telantar tanpa mereka; dan mereka akan menanggung hukuman atas kesalahan mereka[a], sebab—ya, sebab—mereka telah menolak keputusan-keputusan-Ku dan batin mereka muak terhadap ketetapan-ketetapan-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menerima kesalahan mereka” atau “membayar ganti atas kesalahan mereka.” Ungkapan Ibrani ini dapat dipahami lebih dari satu cara; di sini diterjemahkan menurut makna hukumnya dalam konteks penghukuman perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב
  choice: akan ditinggalkan
  rationale: Bentuk nifal mempertahankan makna pasif, dengan negeri sebagai subjek.
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: akan menikmati masa-masa Sabatnya
  rationale: Dalam konteks tahun Sabat bagi tanah, רצה menyatakan bahwa negeri memperoleh masa istirahat yang menjadi haknya; 'masa-masa Sabat' memperjelas bahwa yang dimaksud ialah perhentian Sabat negeri.
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: selama negeri itu telantar tanpa mereka
  rationale: Ungkapan ini menyatakan keadaan negeri yang sunyi atau telantar ketika penduduknya tidak berada di sana.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: akan menanggung hukuman atas kesalahan mereka
  rationale: Dalam konteks hukuman perjanjian, gabungan רצה dan עון paling wajar dipahami sebagai menanggung atau menerima akibat hukum dari kesalahan, sambil mengakui adanya kemungkinan pemaknaan lain dalam catatan kaki.
- source_word: יַעַן וּבְיַעַן
  choice: sebab—ya, sebab—
  rationale: Pengulangan mempertahankan penegasan kuat dalam ungkapan sebab-akibat Ibrani.
- source_word: בְּמִשְׁפָּטַי
  choice: hukum-hukum-Ku
  rationale: Dalam konteks perjanjian, מִשְׁפָּטִים menunjuk kepada aturan atau keputusan hukum; pilihan ini alami dalam bahasa Indonesia dan tetap dibedakan dari חֻקּוֹת.
- source_word: חֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: Menerjemahkan istilah hukum perjanjian ini secara berbeda dari מִשְׁפָּטַי.
- source_word: גָּעֲלָה נַפְשָׁם
  choice: batin mereka muak
  rationale: נפש kolektif tunggal menunjuk kepada diri atau batin mereka, sedangkan געל menyatakan rasa muak atau jijik yang kuat; bentuk ini lebih alami daripada 'jiwa mereka' dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna עון dalam frasa יִרְצוּ אֶת עֲוֺנָם
  choice: 'makna penghukuman: ''menanggung hukuman atas kesalahan mereka'''
  alternative: '''menerima kesalahan mereka'' atau ''menebus kesalahan mereka'''
  rationale: Konteks kutuk perjanjian, pembuangan, dan penggantian masa Sabat negeri menonjolkan akibat hukum dari kesalahan. Pilihan ini tidak menyiratkan bahwa mereka menghasilkan pendamaian melalui jasa sendiri, sementara ambiguitas leksikal tetap dicatat.
- issue: Ungkapan kolektif נַפְשָׁם
  choice: '''batin mereka'''
  alternative: '''jiwa mereka'' atau secara idiomatis ''mereka'''
  rationale: Pilihan ini mempertahankan dimensi batiniah dari נֶפֶשׁ tanpa menjadikannya pernyataan antropologis teknis atau meratakan ungkapan itu menjadi subjek biasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. 'Negeri' dipakai bagi הארץ dalam konteks tanah perjanjian; 'telantar' menyampaikan keadaan sunyi dan tidak terurus. Pengulangan 'sebab—ya, sebab—' mempertahankan tekanan retoris sumber.
