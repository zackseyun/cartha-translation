  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: id
  text: Mengenai orang-orang di antara kamu yang masih tersisa, Aku akan mendatangkan rasa gentar ke dalam hati mereka di negeri-negeri para musuh mereka. Bunyi daun yang tertiup[a] akan mengejar mereka; mereka akan lari seperti orang yang melarikan diri dari pedang, dan mereka akan jatuh padahal tidak ada yang mengejar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bunyi daun yang tertiup angin.”
    reason: Alternatif ini menyebut angin secara eksplisit. Teks Ibrani hanya menyatakan bahwa daun itu terdorong atau terhembus, tanpa menyebut pelakunya.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: orang-orang di antara kamu yang masih tersisa
  rationale: Mencerminkan partisip yang menunjuk kepada mereka yang tertinggal setelah penghukuman, sekaligus mempertahankan sapaan langsung kepada Israel melalui בָּכֶם.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: Aku akan mendatangkan rasa gentar ke dalam hati mereka
  rationale: Bentuk kausatif וְהֵבֵאתִי mempertahankan tindakan Allah sebagai penyebab, sedangkan מֹרֶךְ menunjuk pada hilangnya keberanian atau batin yang menjadi ciut, bukan sekadar rasa takut biasa.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: di negeri-negeri musuh mereka
  rationale: Bentuk jamak אַרְצֹת dipertahankan untuk menggambarkan keberadaan mereka yang tersebar di berbagai wilayah musuh.
- source_word: קוֹל עָלֶה נִדָּף
  choice: suara daun yang diterbangkan
  rationale: Mempertahankan unsur 'suara', 'daun', dan keadaan pasif daun yang terdorong atau terbawa, tanpa menyebutkan pelaku yang tidak dinyatakan dalam teks Ibrani.
- source_word: וְרָדַף אֹתָם
  choice: akan mengejar mereka
  rationale: Ungkapan ini mempertahankan personifikasi ironis bahwa bunyi yang sepele bertindak sebagai pengejar.
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: mereka akan lari seperti orang yang melarikan diri dari pedang
  rationale: Frasa konstruksi menyatakan cara mereka lari, yakni seperti pelarian ketika menghadapi ancaman pedang.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: mereka akan jatuh padahal tidak ada yang mengejar
  rationale: Kata 'jatuh' mempertahankan keluasan makna נפל, sementara 'padahal' menyampaikan ironi bahwa tidak ada pengejar yang nyata.
theological_decisions:
- issue: Sifat penghukuman yang digambarkan
  choice: Allah menyebabkan kegentaran batin dan kepanikan di negeri pembuangan
  alternative: sekadar pengejaran militer dari luar atau hanya kegelisahan metaforis
  rationale: Teks secara langsung menghubungkan kegentaran dalam hati dengan tindakan Allah, lalu menggambarkan pelarian irasional akibat suara daun. Terjemahan mempertahankan tindakan ilahi dan dimensi batin tanpa memasukkan kategori doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan sapaan kepada Israel, tindakan Allah, pengulangan 'mereka', dan ironi pada akhir ayat.
