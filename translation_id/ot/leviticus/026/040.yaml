source:
  edition: WLC
  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: id
  text: Namun, jika mereka mengakui kesalahan mereka dan kesalahan leluhur mereka, dalam ketidaksetiaan mereka, yang dengannya mereka telah tidak setia kepada-Ku, dan juga bahwa mereka hidup menentang Aku[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersikap bermusuhan terhadap Aku.” Istilah Ibrani yang diterjemahkan “menentang” sulit dipastikan maknanya dan berulang kali dipakai dalam pasal ini untuk perilaku yang berlawanan atau bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: jika mereka mengakui
  rationale: Dalam alur bersyarat yang berlanjut dari ayat sebelumnya, bentuk ini paling wajar diterjemahkan dengan 'jika'; verba Hitpael dari ידה berarti mengakui atau menyatakan dosa.
- source_word: עֲוֺנָם
  choice: kesalahan mereka
  rationale: עָוֹן di sini menunjuk pada perbuatan salah yang menimbulkan kesalahan moral dan harus diakui; 'kesalahan' alami dalam bahasa Indonesia sekaligus tidak membatasi makna hanya pada tindakan atau akibatnya.
- source_word: עֲוֺן אֲבֹתָם
  choice: kesalahan leluhur mereka
  rationale: Frasa konstruksi ini menyebut kesalahan generasi terdahulu. 'Leluhur' menyampaikan rujukan genealogis אבות secara alami dan inklusif dalam bahasa Indonesia tanpa menghilangkan dimensi korporatnya.
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: serta ketidaksetiaan yang mereka lakukan terhadap-Ku
  rationale: Nomina dan verba serumpun dari מעל menekankan pelanggaran kesetiaan terhadap Allah. Bahasa Indonesia tidak dapat mempertahankan pengulangan serumpun itu secara alami; frasa ini tetap menyampaikan ketidaksetiaan relasional dan kovenantal.
- source_word: וְאַף
  choice: dan juga
  rationale: Ungkapan ini menambahkan unsur lain pada hal yang diakui tanpa perlu memberi penekanan berlebihan.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: mereka hidup menentang Aku
  rationale: Secara harfiah verba itu berarti 'berjalan', tetapi sebagai ungkapan perilaku lebih alami diterjemahkan 'hidup'. קֶרִי adalah istilah sulit yang dalam konteks pasal ini menunjukkan sikap berlawanan atau bermusuhan.
theological_decisions:
- issue: Pengakuan korporat yang mencakup kesalahan leluhur
  choice: Mempertahankan 'kesalahan leluhur mereka' sebagai bagian dari hal yang mereka akui.
  alternative: dosa nenek moyang mereka; akibat kesalahan leluhur mereka
  rationale: Teks Ibrani secara eksplisit menyejajarkan kesalahan mereka sendiri dengan kesalahan generasi terdahulu. Terjemahan tidak membatasinya menjadi sekadar akibat atau teladan buruk.
- issue: Makna ketidaksetiaan kepada Allah
  choice: Menggunakan bahasa relasional 'ketidaksetiaan ... terhadap-Ku'.
  alternative: pelanggaran mereka terhadap-Ku; pengkhianatan mereka kepada-Ku
  rationale: מעל menggambarkan pelanggaran kesetiaan, khususnya dalam hubungan perjanjian, tetapi terjemahan tidak menambahkan penjelasan teologis yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Hidup menentang Aku' mengalihkan idiom Ibrani 'berjalan ...' ke ungkapan perilaku yang alami. Tanda koma terakhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat 41.
