revisions:
- from: Namun, jika mereka mengakui kesalahan mereka dan kesalahan leluhur mereka, serta ketidaksetiaan yang mereka lakukan terhadap-Ku, dan juga bahwa mereka hidup menentang Aku[a],
  to: Namun, jika mereka mengakui kesalahan mereka dan kesalahan leluhur mereka, dalam ketidaksetiaan mereka, yang dengannya mereka telah tidak setia kepada-Ku, dan juga bahwa mereka hidup menentang Aku[a],
  rationale: Revisi ini memulihkan hubungan “dalam ... yang dengannya” serta pengulangan ketidaksetiaan/tidak setia dalam teks Ibrani. Unsur pengakuan atas kesalahan sendiri dan leluhur, serta istilah sulit untuk perilaku yang menentang Allah, tetap dipertahankan. Koma terakhir tetap diperlukan karena struktur kalimat berlanjut ke ayat 41.
