    text: Atau “bersikap bermusuhan terhadap Aku.” Istilah Ibrani yang diterjemahkan “menentang” sulit dipastikan maknanya dan berulang kali dipakai dalam pasal ini untuk perilaku yang berlawanan atau bermusuhan.
    reason: lexical_alternative
  revision_rationale: Revisi ini memulihkan hubungan “dalam ... yang dengannya” serta pengulangan ketidaksetiaan/tidak setia dalam teks Ibrani. Unsur pengakuan atas kesalahan sendiri dan leluhur, serta istilah sulit untuk perilaku yang menentang Allah, tetap dipertahankan. Koma terakhir tetap diperlukan karena struktur kalimat berlanjut ke ayat 41.
