  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: id
  text: Namun, jika bahkan setelah semua ini kamu tidak mau mendengarkan Aku dan hidup menentang Aku[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berjalan bersama-Ku dalam pertentangan.” Ungkapan ini menunjuk pada hidup atau bertindak dalam sikap berlawanan terhadap Allah. Istilah Ibrani yang diterjemahkan “dalam pertentangan” sulit; juga dapat dipahami sebagai “dengan permusuhan” atau “secara berlawanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menandai tahap lanjutan dalam rangkaian peringatan bersyarat sekaligus menunjukkan pertentangan dengan tanggapan yang diharapkan.
- source_word: בְּזֹאת
  choice: sekalipun demikian
  rationale: Dalam konteks ini menunjuk kembali kepada tindakan pendisiplinan sebelumnya dan menyampaikan makna konsesif, bukan makna tempat atau alat.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: kamu tidak mau mendengarkan Aku
  rationale: Mempertahankan gambaran mendengar dalam bahasa Ibrani sambil menyampaikan unsur penolakan untuk mengindahkan; bentuk orang kedua jamak tidak dibedakan secara morfologis dalam bahasa Indonesia.
- source_word: וַהֲלַכְתֶּם
  choice: dan tetap hidup
  rationale: הלך di sini merupakan ungkapan tentang perilaku atau cara hidup. 'Tetap hidup' menyampaikan kelanjutan sikap dalam konteks tanpa menimbulkan kesan berjalan secara harfiah.
- source_word: עִמִּי בְּקֶרִי
  choice: menentang Aku
  rationale: Gabungan ini secara harfiah sulit dan merupakan ungkapan relasional tentang sikap berlawanan atau bermusuhan terhadap Allah. Pilihan ini alami dalam bahasa Indonesia sambil mempertahankan arah pertentangannya.
theological_decisions:
- issue: Ungkapan peringatan perjanjian dalam Imamat 26
  choice: Mempertahankan gagasan cara hidup yang menentang Allah
  alternative: terus tidak taat kepada-Ku
  rationale: Ayat ini menggambarkan lebih dari sekadar kegagalan menaati perintah, yaitu sikap relasional yang berlawanan dalam konteks perjanjian. Terjemahan tidak mempersempitnya menjadi ketidaktaatan semata.
- issue: Nuansa istilah קֶרִי
  choice: menentang
  alternative: dengan permusuhan / secara keras kepala / secara kebetulan
  rationale: Istilah ini sulit dan maknanya diperdebatkan. 'Menentang' mewakili nuansa oposisi yang paling sesuai dengan formula berulang dalam pasal ini tanpa menetapkan motif psikologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Aku' dipakai untuk suara langsung Allah. Struktur ayat dibiarkan berakhir dengan koma karena kalimat bersyarat berlanjut ke ayat berikutnya.
