  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: id
  text: Inilah ketetapan, peraturan, dan hukum yang Yahweh berikan sebagai ketetapan antara diri-Nya dan bangsa Israel di Gunung Sinai melalui Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan tangan Musa.”
    reason: Menjelaskan idiom Ibrani בְּיַד מֹשֶׁה, yang berarti “melalui Musa.”
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Bentuk penunjuk ini secara alami memperkenalkan rangkuman bahan perjanjian dalam bahasa Indonesia.
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: Mempertahankan nuansa ketentuan tetap atau ketetapan yang diwajibkan dalam konteks hukum perjanjian.
- source_word: הַמִּשְׁפָּטִים
  choice: peraturan-peraturan
  rationale: Dalam rangkaian istilah hukum ini, kata tersebut menunjuk pada aturan atau keputusan hukum; 'peraturan-peraturan' jelas dan wajar bagi pembaca Indonesia.
- source_word: הַתּוֹרֹת
  choice: hukum-hukum
  rationale: Bentuk jamak menunjuk pada berbagai hukum atau kumpulan pengajaran yang berwenang; konteks rangkuman hukum mendukung pilihan ini.
- source_word: אֲשֶׁר נָתַן
  choice: yang diberikan
  rationale: Menerjemahkan נָתַן secara langsung sebagai 'diberikan' tanpa menambahkan gagasan 'ditetapkan' yang tidak dinyatakan secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi yang tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: antara diri-Nya dan keturunan Israel
  rationale: '''Diri-Nya'' menyatakan hubungan refleksif dengan wajar, sedangkan ''keturunan Israel'' mempertahankan hubungan genealogis ungkapan Ibrani sambil mencakup bangsa Israel secara kolektif.'
- source_word: בְּהַר סִינַי
  choice: di Gunung Sinai
  rationale: Ungkapan lokasi yang alami dalam bahasa Indonesia dan sesuai dengan fungsi preposisi Ibrani di sini.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Menyampaikan makna idiom Ibrani, yakni bahwa Musa menjadi perantara penyampaian hukum-hukum tersebut; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Ungkapan Ibrani secara harfiah berarti 'anak-anak lelaki Israel', tetapi berfungsi sebagai sebutan kolektif etnis-perjanjian. 'Keturunan Israel' mempertahankan kaitan genealogis tanpa secara keliru membatasi rujukannya hanya kepada laki-laki atau anak-anak.
- issue: Relasi yang diungkapkan oleh נָתַן ... בֵּינוֹ וּבֵין
  choice: yang diberikan Yahweh antara diri-Nya dan keturunan Israel
  alternative: yang ditetapkan Yahweh antara diri-Nya dan keturunan Israel
  rationale: '''Diberikan'' mempertahankan verba sumber secara lebih langsung. Susunan ''antara'' dibiarkan menyatakan dimensi relasional-perjanjian tanpa mengubah verba menjadi ''menetapkan''.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan bentuk jamak mempertahankan tiga kategori hukum dalam teks Ibrani, sedangkan idiom 'dengan tangan Musa' dialihkan menjadi 'melalui Musa' agar jelas dan alami.
