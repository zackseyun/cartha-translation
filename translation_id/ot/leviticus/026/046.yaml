revisions:
- from: Inilah ketetapan-ketetapan, peraturan-peraturan, dan hukum-hukum yang diberikan Yahweh antara diri-Nya dan keturunan Israel di Gunung Sinai melalui Musa.[a]
  to: Inilah ketetapan, peraturan, dan hukum yang Yahweh berikan sebagai ketetapan antara diri-Nya dan bangsa Israel di Gunung Sinai melalui Musa.[a]
  rationale: Revisi memperjelas bahwa ketetapan, peraturan, dan hukum itu berfungsi dalam relasi antara Yahweh dan Israel, sambil tetap menerjemahkan נָתַן sebagai “berikan.” Istilah kolektif “bangsa Israel” lebih alami daripada “keturunan Israel” dalam konteks sebutan etnis-perjanjian ini. Catatan kaki dipadatkan dan tetap ditambatkan pada “melalui Musa.”
