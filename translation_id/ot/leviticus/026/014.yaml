  text: וְ/אִם לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: id
  text: Namun, jika kamu tidak mendengarkan Aku[a] dan tidak melakukan segala perintah ini,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menaati Aku.” Kata kerja Ibrani ini dapat berarti mendengarkan dengan sikap taat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Kata penghubung ini memperkenalkan pertentangan dengan bagian berkat sebelumnya sekaligus mempertahankan syarat yang dinyatakan oleh אִם.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: kamu tidak mendengarkan Aku
  rationale: שׁמע dengan ל dapat berarti mendengarkan dengan implikasi menaati. Pilihan ini mempertahankan gambaran harfiah dan relasional, sedangkan klausa berikutnya menyatakan tindakan melakukan perintah.
- source_word: וְלֹא תַעֲשׂוּ
  choice: dan tidak melakukan
  rationale: Terjemahan langsung dan alami untuk klausa negatif kedua; עשה dalam konteks hukum berarti melakukan atau melaksanakan.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: segala perintah ini
  rationale: כָּל menyatakan keseluruhan, מִצְוֺת berarti perintah-perintah, dan הָאֵלֶּה menunjuk pada perintah yang telah disampaikan.
theological_decisions:
- issue: Apakah שׁמע ל diterjemahkan sebagai “mendengarkan Aku” atau “menaati Aku”
  choice: mendengarkan Aku
  alternative: menaati Aku
  rationale: Pilihan utama mempertahankan perbedaan tekstual antara mendengarkan Allah dan melakukan perintah-perintah-Nya, tanpa menghilangkan nuansa ketaatan yang terkandung dalam verba Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “Aku” dikapitalisasi karena merujuk kepada Allah. Bentuk “kamu” dipahami sebagai jamak berdasarkan verba Ibrani. Tanda koma akhir dipertahankan karena ayat ini merupakan awal klausa bersyarat yang berlanjut pada ayat berikutnya.
