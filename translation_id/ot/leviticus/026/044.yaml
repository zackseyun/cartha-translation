source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: id
  text: Namun, bahkan dalam keadaan demikian, ketika mereka berada di negeri para musuh mereka, Aku tidak akan menolak mereka dan tidak akan merasa muak terhadap mereka sampai-sampai Aku membinasakan mereka serta membatalkan perjanjian-Ku dengan mereka, sebab Akulah Yahweh, Allah mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: Namun, sekalipun
  rationale: 'Rangkaian partikel ini menyatakan konsesi yang kuat: bahkan dalam keadaan penghukuman dan pembuangan yang telah disebutkan, komitmen perjanjian Allah tetap berlaku.'
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: mereka berada di negeri musuh-musuh mereka
  rationale: Infinitif dengan prefiks בְּ menyatakan keadaan temporal, sedangkan bentuk jamak אֹיְבֵיהֶם dipertahankan secara eksplisit.
- source_word: לֹא מְאַסְתִּים
  choice: Aku tidak akan menolak mereka
  rationale: מָאַס dalam konteks perjanjian menunjuk pada penolakan atau pencampakan. Bentuk mendatang menyampaikan daya janji dalam konteks pembuangan yang akan datang.
- source_word: וְלֹא גְעַלְתִּים
  choice: ataupun merasa jijik terhadap mereka
  rationale: גָּעַל mengungkapkan rasa muak atau jijik yang kuat. Ungkapan ini membedakannya dari tindakan 'menolak' pada klausa sebelumnya.
- source_word: לְכַלֹּתָם
  choice: sehingga menghabisi mereka
  rationale: כלה dapat berarti mengakhiri, menghabiskan, atau memusnahkan sama sekali. 'Menghabisi' mempertahankan gagasan kebinasaan total dan hubungan akibat/tujuan dengan kata kerja sebelumnya.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: dan membatalkan perjanjian-Ku dengan mereka
  rationale: Dalam hubungan dengan perjanjian, הֵפֵר berarti membatalkan, meniadakan, atau merusak keberlakuannya. 'Membatalkan' jelas dan alami dalam bahasa Indonesia.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: sebab Akulah Yahweh, Allah mereka
  rationale: כִּי memberikan dasar bagi pernyataan sebelumnya, dan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Aspek verba qatal dalam konteks nubuat perjanjian
  choice: 'bentuk mendatang: ''Aku tidak akan menolak ... ataupun merasa jijik'''
  alternative: 'bentuk lampau: ''Aku tidak menolak ... dan tidak merasa jijik'''
  rationale: Walaupun verba Ibrani berbentuk qatal, konteks membicarakan keadaan Israel di negeri musuh pada masa mendatang. Bentuk mendatang dalam bahasa Indonesia paling wajar menyampaikan komitmen ilahi tanpa menganggap qatal sebagai penanda waktu yang kaku.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama pribadi itu dan membedakannya dari gelar umum.
- issue: Hubungan infinitif לְכַלֹּתָם dan לְהָפֵר dengan penolakan Allah
  choice: 'hasil atau batas yang tidak akan dicapai: ''sehingga menghabisi ... dan membatalkan'''
  alternative: 'tujuan: ''untuk menghabisi ... untuk membatalkan'''
  rationale: Konstruksi לְ dapat menyatakan tujuan maupun hasil. 'Sehingga' mempertahankan hubungan logis dalam konteks ini tanpa menyatakan bahwa pemusnahan pernah menjadi maksud Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur kalimat mempertahankan kontras, kekuatan emosi dua verba penolakan, dan dasar perjanjian pada akhir ayat.
