  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: id
  text: Janganlah kamu membuat berhala untuk diri kalian. Janganlah kamu mendirikan patung pahatan dan tugu batu untuk diri kalian. Janganlah kamu menempatkan batu bergambar[a] di negeri kalian untuk sujud kepadanya, sebab Akulah Yahweh, Allah kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu berukir” atau “batu berpatung.” Makna tepat frasa Ibrani אֶבֶן מַשְׂכִּית diperdebatkan, tetapi frasa itu menunjuk kepada sebuah benda batu yang berkaitan dengan ibadah terlarang.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: berhala
  rationale: Kata ini menunjuk kepada berhala dan dapat bernuansa merendahkan sebagai sesuatu yang tidak bernilai. “Berhala” merupakan padanan Indonesia modern yang jelas tanpa menambahkan penafsiran ke dalam teks utama.
- source_word: פֶסֶל
  choice: patung pahatan
  rationale: Istilah ini menunjuk kepada gambar atau patung yang dibentuk dengan cara memahat. “Patung pahatan” mempertahankan unsur bendawi dan cara pembuatannya serta membedakannya dari istilah-istilah kultis lain dalam ayat ini.
- source_word: מַצֵּבָה
  choice: tugu batu
  rationale: Kata ini menunjuk kepada batu atau pilar yang didirikan tegak sebagai monumen. “Tugu batu” konkret dan mudah dimengerti, sedangkan “tugu suci” akan membuat fungsi kultisnya lebih eksplisit daripada nomina Ibraninya sendiri.
- source_word: אֶבֶן מַשְׂכִּית
  choice: batu bergambar
  rationale: Frasa ini kemungkinan menunjuk kepada batu yang memiliki gambar atau ukiran dan digunakan dalam konteks ibadah terlarang. “Batu bergambar” mempertahankan perbedaannya dari פֶסֶל; karena nuansa tepatnya diperdebatkan, alternatif dicatat dalam catatan kaki.
- source_word: תַעֲשׂוּ לָכֶם
  choice: membuat ... bagi dirimu
  rationale: Konstruksi ini memadukan verba “membuat” dengan unsur benefaktif-refleksif “bagi kamu sendiri.” Bentuk tunggal kolektif “dirimu” dalam bahasa Indonesia mengacu secara alami kepada umat yang disapa sebagai satu kesatuan.
- source_word: תָקִימוּ לָכֶם
  choice: mendirikan ... bagi dirimu
  rationale: Bentuk kausatif dari קום di sini berarti menegakkan atau mendirikan benda. “Mendirikan” tepat bagi patung pahatan maupun tugu batu dan sesuai dengan gaya hukum.
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: menempatkan ... di negerimu
  rationale: נתן dengan penanda lokasi secara alami berarti “menempatkan” dalam konteks ini. “Di negerimu” mempertahankan latar tanah perjanjian tanpa mempersempitnya menjadi rumah atau tempat ibadah tertentu.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: untuk sujud kepadanya
  rationale: Infinitif ini menyatakan tujuan. “Sujud kepadanya” mempertahankan tindakan merendahkan diri di hadapan benda itu. Kemungkinan memahami preposisinya sebagai “di atasnya” kurang mungkin dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: sebab Akulah Yahweh, Allahmu
  rationale: כִּי memberi dasar bagi larangan, sehingga “sebab” sesuai. Partikel penegas “-lah” pada “Akulah” menyampaikan penekanan formula Ibrani secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Ayat ini memakai nama YHWH secara langsung. “Yahweh” mempertahankan nama pribadi dalam teks sumber, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehovah” mencerminkan bentuk pelafalan yang berbeda.
- issue: Pembedaan istilah untuk benda-benda kultis
  choice: Berhala, patung pahatan, tugu batu, dan batu bergambar dibedakan
  alternative: Semua istilah diratakan menjadi “berhala” atau “patung”
  rationale: Teks Ibrani menumpuk beberapa istilah yang berbeda. Mempertahankan perbedaan itu menghormati kekhususan larangan tanpa memastikan secara berlebihan bentuk atau fungsi setiap benda.
- issue: Objek tindakan sujud dalam לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: sujud kepadanya
  alternative: sujud di atasnya
  rationale: Preposisi עַל secara harfiah memiliki rentang makna yang luas, tetapi dalam konteks benda ibadah terlarang, rujukan kepada objek penghormatan paling masuk akal. Alternatif lokatif tetap merupakan kemungkinan gramatikal yang lebih lemah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas dan bermartabat. Kalimat panjang Ibrani dibagi menjadi tiga larangan agar mudah dipahami, tanpa menghilangkan pengulangan dan susunan benda-benda kultis. “Kamu/dirimu/negerimu/Allahmu” dipakai sebagai bentuk tunggal kolektif untuk umat Israel.
