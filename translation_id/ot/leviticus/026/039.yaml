  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: id
  text: Dan orang-orang yang masih tersisa di antara kamu akan merana[a] di negeri-negeri musuhmu karena kesalahan mereka; dan mereka pun akan merana karena kesalahan-kesalahan nenek moyang mereka yang ada bersama mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan membusuk” atau “akan menyusut”; kata kerja Ibrani ini menggambarkan keadaan yang makin susut atau rusak di bawah penghukuman.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bersama mereka”. Ini dapat berarti bahwa kesalahan-kesalahan nenek moyang mereka tetap menyertai mereka, atau bahwa mereka merana sementara kesalahan-kesalahan nenek moyang itu masih bersama mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: Dan orang-orang yang masih tersisa di antara kamu
  rationale: Partisipel שׁאר menunjuk kepada orang-orang yang tertinggal setelah penghukuman, sedangkan בָּכֶם menyatakan bahwa mereka berasal dari antara umat yang disapa. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sapaan orang kedua jamak.
- source_word: יִמַּקּוּ
  choice: akan merana
  rationale: Bentuk Nifal dari מקק menggambarkan keadaan yang makin susut, rusak, atau hancur di bawah penghukuman. “Akan merana” menyampaikan proses penderitaan yang berkepanjangan secara alami, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: בַּעֲוֺנָם
  choice: karena kesalahan mereka
  rationale: עָוֹן dapat mencakup perbuatan salah, kesalahan, dan tanggungan akibatnya. Preposisi בְּ di sini wajar dipahami secara kausal, tetapi terjemahan tidak mempersempit istilah itu hanya menjadi hukuman atau hanya menjadi rasa bersalah.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: di negeri-negeri musuhmu
  rationale: Bentuk jamak אַרְצֹת dipertahankan sebagai “negeri-negeri”, sesuai dengan latar pembuangan ke berbagai wilayah asing. Sufiks orang kedua jamak diterjemahkan dengan “-mu”, yang dapat merujuk kepada kelompok dalam bahasa Indonesia.
- source_word: וְאַף
  choice: dan ... pun
  rationale: Gabungan ini menyatakan tambahan dengan penegasan. Bentuk “dan ... pun” alami dalam bahasa Indonesia serta mempertahankan daya tambahannya.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: karena kesalahan-kesalahan leluhur mereka
  rationale: Bentuk jamak “kesalahan-kesalahan” dipertahankan. אֲבוֹת dalam konteks antargenerasi secara alami berarti para pendahulu keluarga atau bangsa; “leluhur” lebih jelas dan wajar daripada “bapak-bapak” dalam bahasa Indonesia modern.
- source_word: אִתָּם
  choice: yang ada bersama mereka
  rationale: Frasa Ibrani ini singkat dan terbuka secara sintaksis. Pilihan ini mempertahankan gagasan “bersama mereka” tanpa menjelaskan secara dogmatis apakah kesalahan leluhur tetap menyertai mereka atau mereka merana bersama dampak kesalahan tersebut.
theological_decisions:
- issue: Kesalahan dan penghukuman antargenerasi
  choice: Mempertahankan pernyataan bahwa kaum yang tersisa merana karena kesalahan mereka sendiri dan juga karena kesalahan-kesalahan leluhur mereka.
  alternative: Menafsirkan bagian kedua hanya sebagai akibat historis dosa leluhur, atau hanya sebagai pengulangan dosa yang sama oleh keturunan.
  rationale: Teks menyebut secara tersendiri “kesalahan mereka” dan “kesalahan-kesalahan leluhur mereka”. Terjemahan tidak menyelaraskan ketegangan ini dengan meniadakan salah satu unsur.
- issue: Rujukan frasa אִתָּם (“bersama mereka”)
  choice: Menggunakan “yang ada bersama mereka” dan menjelaskan keterbukaannya dalam catatan kaki.
  alternative: Menyatakan secara tegas bahwa kesalahan leluhur diwariskan, atau bahwa mereka hanya mengalami akibat dosa leluhur.
  rationale: Susunan Ibraninya padat dan memungkinkan lebih dari satu hubungan konseptual. Terjemahan utama mempertahankan ketegangan itu, sedangkan catatan kaki menyajikan cakupan pembacaannya.
translation_notes:
  register: Bahasa yang digunakan modern, lugas, dan khidmat. “Merana” mudah dipahami pembaca umum dan menyampaikan proses kehancuran berkepanjangan; “leluhur” menghindari kesan bahwa ayat hanya berbicara tentang ayah kandung. Tanda titik koma mempertahankan kesejajaran dua klausa Ibrani tanpa membuat kalimat Indonesia terasa terputus.
