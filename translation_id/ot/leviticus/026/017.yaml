base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: id
  text: Aku akan mengarahkan wajah-Ku untuk menentang kamu[a], dan kamu akan dikalahkan di hadapan musuh-musuhmu. Orang-orang yang membenci kamu akan berkuasa atasmu, dan kamu akan melarikan diri, padahal tidak ada seorang pun yang mengejar kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "Aku akan menempatkan wajah-Ku terhadap kamu"; ungkapan Ibrani ini menyatakan tekad Allah untuk menentang kamu dalam penghakiman.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: Aku akan menghadapkan wajah-Ku untuk melawan kamu
  rationale: Mempertahankan gambaran antropomorfis dan daya relasional ungkapan Ibrani, sekaligus menambahkan 'untuk melawan' agar makna sikap permusuhan dalam penghakiman jelas dan alami dalam bahasa Indonesia.
- source_word: וְנִגַּפְתֶּם
  choice: kamu akan dikalahkan
  rationale: Bentuk Nifal di sini menyatakan bahwa mereka akan dipukul kalah dalam konteks peperangan. 'Dikalahkan' menyampaikan hasil tindakan itu secara wajar tanpa memakai ungkapan Indonesia yang dapat menyiratkan bahwa semuanya pasti dibunuh.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: di hadapan musuh-musuhmu
  rationale: 'Menerjemahkan ungkapan ruang dan militer secara langsung: kekalahan itu terjadi di depan atau oleh kehadiran musuh-musuh mereka.'
- source_word: וְרָדוּ בָכֶם
  choice: akan berkuasa atasmu
  rationale: רדה menunjuk pada pelaksanaan kuasa atau pemerintahan. 'Berkuasa atasmu' mempertahankan gagasan penaklukan tanpa menambahkan kadar kekejaman yang tidak dinyatakan secara eksplisit.
- source_word: שֹׂנְאֵיכֶם
  choice: orang-orang yang membenci kamu
  rationale: Mempertahankan bentuk partisip dan membedakannya dari אֹיְבֵיכֶם, 'musuh-musuhmu', pada klausa sebelumnya.
- source_word: וְנַסְתֶּם
  choice: kamu akan melarikan diri
  rationale: Padanan baku dan alami untuk tindakan lari karena ketakutan atau ancaman.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: meskipun tidak ada yang mengejar kamu
  rationale: 'Menampilkan kontras tersirat: kepanikan mereka begitu besar sehingga mereka lari tanpa adanya pengejar. ''Meskipun'' menjadikan hubungan itu jelas dalam bahasa Indonesia tanpa mengubah isi klausa.'
theological_decisions:
- issue: Bahasa antropomorfis tentang sikap Allah dalam penghakiman
  choice: Mempertahankan unsur 'wajah-Ku' dalam ungkapan 'Aku akan menghadapkan wajah-Ku untuk melawan kamu'
  alternative: Aku akan menentang kamu
  rationale: Teks Ibrani menggambarkan sikap perjanjian Allah secara personal melalui gambaran wajah. Mempertahankannya menjaga kekuatan sastra dan teologis ungkapan tersebut, sedangkan 'untuk melawan' mencegah salah pengertian bahwa Allah memandang mereka dengan kemurahan.
- issue: Sifat kekuasaan para pembenci Israel
  choice: akan berkuasa atasmu
  alternative: akan menindas kamu
  rationale: Kata רדה menyatakan penguasaan, tetapi klausa ini tidak secara eksplisit merinci bentuk atau tingkat penindasannya. Terjemahan ini mempertahankan ancaman penaklukan tanpa memperkuatnya secara interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina orang kedua jamak dalam bahasa Ibrani diterjemahkan dengan 'kamu' sebagai bentuk kolektif yang umum dalam bahasa Indonesia; akhiran pada 'musuh-musuhmu' dan 'atasmu' merujuk kepada seluruh umat yang disapa.
