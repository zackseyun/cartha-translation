  to: Ketika Aku mematahkan persediaan rotimu,[a] sepuluh perempuan akan memanggang rotimu dalam satu tungku dan mengembalikan rotimu kepadamu dengan ditimbang. Kamu akan makan, tetapi tidak akan kenyang.
  rationale: Revisi mengganti perluasan “penopang hidupmu, yaitu persediaan roti” dengan “persediaan rotimu,” yang secara langsung menyampaikan idiom מַטֵּה לֶחֶם sambil mempertahankan “roti.” Klausa tentang penimbangan dipadatkan dan dibuat lebih idiomatis tanpa mengubah urutan maupun makna teks Ibrani.
