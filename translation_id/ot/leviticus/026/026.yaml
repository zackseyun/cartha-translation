review_pass:
  verdict: revise
  source_fidelity: Terjemahan menangkap urutan penghakiman, kelangkaan, pemanggangan oleh sepuluh perempuan dalam satu tungku, pembagian berdasarkan timbangan, dan hasil akhir bahwa mereka makan tanpa kenyang. Namun, “penopang hidupmu, yaitu persediaan roti” memperluas idiom מַטֵּה לֶחֶם menjadi “penopang hidup” dan membuat relasi idiomatiknya kurang langsung. Padanan “persediaan rotimu” menyampaikan idiom secara tepat tanpa tambahan penjelasan dalam teks utama.
  naturalness: Bahasa Indonesia umumnya baku dan jelas. “Menurut timbangan” dapat dipahami, tetapi “dengan ditimbang” lebih alami dalam konteks pembagian jatah roti. Pengulangan “rotimu” sesuai dengan teks dan efektif.
  terminology: “Tungku,” “perempuan,” dan “kenyang” tepat untuk register modern baku. Catatan kaki perlu menyebutkan bahwa “tongkat roti” adalah idiom bagi persediaan/penopang makanan, bukan menyatakan secara sempit bahwa roti itu sendiri adalah “penopang kehidupan.”
  issues:
  - severity: medium
    issue: “penopang hidupmu, yaitu persediaan roti” terlalu memperluas idiom Ibrani מַטֵּה לֶחֶם.
    rationale: Secara harfiah idiom itu “tongkat/penopang roti” dan mengacu pada persediaan roti sebagai sumber penopang. “Penopang hidupmu” menambahkan cakupan yang tidak dinyatakan secara langsung dan pemakaian “yaitu” mengubah penjelasan idiom menjadi aposisi yang kurang alami.
  - severity: low
    issue: “menurut timbangan” kurang idiomatis untuk tindakan mengembalikan roti yang sudah dijatah.
    rationale: בַּמִּשְׁקָל berarti berdasarkan berat/ditimbang. “Dengan ditimbang” mengungkapkan penjatahan berdasarkan berat secara lebih alami dalam bahasa Indonesia.
  - severity: low
    issue: Catatan kaki “roti sebagai penopang kehidupan” kurang presisi sebagai penjelasan idiom.
    rationale: Idiom tersebut terutama menunjuk kepada persediaan roti yang menopang hidup; catatan yang direvisi mempertahankan bentuk literal dan makna idiomatiknya.
  revised_text: Ketika Aku mematahkan persediaan rotimu,[a] sepuluh perempuan akan memanggang rotimu dalam satu tungku dan mengembalikan rotimu kepadamu dengan ditimbang. Kamu akan makan, tetapi tidak akan kenyang.
  revised_footnotes:
