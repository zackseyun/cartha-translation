base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: id
  text: Ketika Aku mematahkan persediaan rotimu,[a] sepuluh perempuan akan memanggang rotimu dalam satu tungku dan mengembalikan rotimu kepadamu dengan ditimbang. Kamu akan makan, tetapi tidak akan kenyang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tongkat roti”, suatu ungkapan untuk persediaan roti sebagai penopang kehidupan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: Ketika Aku mematahkan
  rationale: Infinitif konstruk dengan prefiks ב membentuk klausa waktu. ‘Mematahkan’ mempertahankan gambaran penghakiman yang kuat tanpa menyiratkan tindakan menghancurkan roti secara harfiah.
- source_word: מַטֵּה לֶחֶם
  choice: penopang hidupmu, yaitu persediaan roti
  rationale: Secara harfiah ungkapan ini berarti ‘tongkat roti’, yaitu roti sebagai penopang kelangsungan hidup. Terjemahan ini menyampaikan fungsi idiom tersebut dengan jelas sambil tetap mempertahankan unsur roti.
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: sepuluh perempuan akan memanggang
  rationale: Bentuk perfektum meneruskan rangkaian akibat pada masa mendatang. Penyebutan ‘sepuluh perempuan’ dipertahankan karena merupakan bagian nyata dari gambaran kelangkaan.
- source_word: בְּתַנּוּר אֶחָד
  choice: dalam satu tungku
  rationale: 'Ungkapan ini menekankan kelangkaan: roti bagi banyak keluarga dapat dimuat ke dalam hanya satu tungku.'
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: Mereka akan mengembalikan rotimu menurut timbangan
  rationale: Hifil שוב berarti membawa atau mengembalikan. ‘Menurut timbangan’ mempertahankan gambaran pembagian jatah secara ketat akibat kelangkaan.
- source_word: וְלֹא תִשְׂבָּעוּ
  choice: tetapi tidak akan kenyang
  rationale: שׂבע menunjuk pada keadaan kenyang setelah makan. ‘Tidak akan kenyang’ alami dalam bahasa Indonesia dan secara langsung menyatakan bahwa rasa lapar tidak terpuaskan.
