  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: id
  text: Dan jika, sekalipun semua itu telah terjadi[a], kamu tidak mendengarkan Aku, Aku akan terus mendisiplinkan kamu tujuh kali lipat[b] karena dosa-dosamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesudah semua ini.” Ungkapan Ibrani ini menyatakan bahwa ketidaktaatan tetap berlanjut meskipun hukuman-hukuman sebelumnya telah terjadi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tujuh kali.” Ungkapan Ibrani ini dapat menunjukkan hukuman yang sangat ditingkatkan, bukan jumlah yang harus dipahami secara matematis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Dan jika
  rationale: Mempertahankan daya penghubung ו serta memperkenalkan kelanjutan bersyarat dalam rangkaian peringatan perjanjian.
- source_word: עַד אֵלֶּה
  choice: sekalipun setelah semua ini
  rationale: Dalam konteks ini, ungkapan tersebut menunjuk pada ketidaktaatan yang berlanjut meskipun hukuman-hukuman sebelumnya telah terjadi, bukan sekadar batas waktu.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: kamu tidak mendengarkan Aku
  rationale: Mempertahankan metafora mendengar dalam שׁמע, sementara implikasi menaati tetap dapat dipahami dari konteks perjanjian.
- source_word: וְיָסַפְתִּי
  choice: Aku akan terus
  rationale: Mengungkapkan kelanjutan sekaligus peningkatan tindakan yang tersirat oleh יסף secara alami dalam bahasa Indonesia.
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: mendisiplinkan kamu
  rationale: יסר mencakup koreksi yang sekaligus bersifat menghukum; 'mendisiplinkan' mempertahankan kedua sisi makna itu.
- source_word: שֶׁבַע
  choice: tujuh kali lipat
  rationale: Menyampaikan pemakaian adverbial yang menunjukkan peningkatan kadar hukuman, sambil mempertahankan citra angka tujuh.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: karena dosa-dosamu
  rationale: עַל menyatakan alasan atau dasar tindakan disiplin tersebut; 'karena' menyampaikan hubungan kausal dengan jelas dan alami.
theological_decisions:
- issue: Sifat יָסַר dalam konteks kutuk perjanjian
  choice: mendisiplinkan
  alternative: menghukum
  rationale: Tindakan ini bersifat menghukum sekaligus mengoreksi dalam hubungan perjanjian. 'Mendisiplinkan' mempertahankan ketegangan tersebut tanpa menjadikannya semata-mata pembalasan atau koreksi yang lunak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pronomina ilahi 'Aku' ditulis dengan huruf kapital menurut kebiasaan luas penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan hubungan bersyarat, kesinambungan hukuman, dan ketegangan antara koreksi serta penghukuman.
