  to: Namun, demi mereka Aku akan mengingat perjanjian dengan nenek moyang mereka[a], yang telah Kubawa keluar dari tanah Mesir di depan mata bangsa-bangsa, supaya Aku menjadi Allah mereka. Akulah Yahweh.
