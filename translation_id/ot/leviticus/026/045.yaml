  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: id
  text: Namun, demi mereka Aku akan mengingat perjanjian dengan nenek moyang mereka[a], yang telah Kubawa keluar dari tanah Mesir di depan mata bangsa-bangsa, supaya Aku menjadi Allah mereka. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perjanjian [dengan] orang-orang terdahulu.” Ungkapan ini merujuk kepada generasi terdahulu yang dibawa keluar dari Mesir; dapat juga diterjemahkan “perjanjian dengan para pendahulu mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Namun, ... Aku akan mengingat
  rationale: Konjungsi ו dapat berarti “dan”, tetapi dalam konteks ini menandai peralihan yang kontras dari penghukuman menuju belas kasihan berdasarkan perjanjian; “Namun” menyampaikan alur itu secara wajar.
- source_word: לָהֶם
  choice: demi mereka
  rationale: Preposisi ל menunjukkan bahwa tindakan mengingat itu diarahkan bagi kepentingan mereka. “Demi mereka” lebih alami dalam bahasa Indonesia daripada “untuk mereka” setelah verba “mengingat”.
- source_word: בְּרִית רִאשֹׁנִים
  choice: perjanjian-Ku dengan para pendahulu mereka[a]
  rationale: רִאשֹׁנִים adalah bentuk jamak substantival yang secara harfiah menunjuk kepada “orang-orang terdahulu”. “Para pendahulu mereka” mempertahankan rujukan kepada generasi sebelumnya tanpa mempersempitnya menjadi istilah khusus laki-laki. Sufiks “-Ku” memperjelas bahwa perjanjian tersebut adalah perjanjian Yahweh, yang sudah tertentu dalam konteks, tanpa mengubah relasinya dengan generasi terdahulu.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: yang telah Kubawa keluar
  rationale: Klausa relatif ini paling alami merujuk kepada orang-orang terdahulu, bukan kepada perjanjian. Bentuk “telah Kubawa” menyatakan tindakan historis yang sudah selesai.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Ungkapan ini mempertahankan rumusan historis-perjanjian dari teks sumber dan tetap alami dalam bahasa Indonesia.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: di depan mata bangsa-bangsa
  rationale: Terjemahan ini mempertahankan citra Ibrani dan menegaskan bahwa keluaran itu terjadi secara terbuka serta disaksikan bangsa-bangsa.
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: supaya Aku menjadi Allah mereka
  rationale: Konstruksi tujuan לִהְיוֹת diterjemahkan dengan “supaya”, sedangkan “menjadi Allah mereka” mempertahankan rumusan hubungan perjanjian tanpa menentukan lebih jauh apakah tekanannya pada tujuan atau hasil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Rujukan frasa בְּרִית רִאשֹׁנִים
  choice: Perjanjian dengan para pendahulu mereka, yakni generasi terdahulu yang dibawa keluar dari Mesir
  alternative: Perjanjian dengan nenek moyang mereka; atau perjanjian terdahulu sebagai suatu tatanan abstrak
  rationale: Klausa berikutnya, “yang telah Kubawa keluar dari tanah Mesir”, menunjuk kepada manusia dan mendukung pembacaan bahwa רִאשֹׁנִים adalah generasi terdahulu. “Para pendahulu mereka” mempertahankan keluasan ungkapan Ibrani dan tidak memutuskan secara berlebihan apakah yang dimaksud khusus generasi keluaran atau garis leluhur secara lebih luas.
- issue: Nuansa לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: supaya Aku menjadi Allah mereka
  alternative: untuk menjadi Allah mereka; agar Aku tetap menjadi Allah mereka
  rationale: Teks menyatakan tujuan hubungan perjanjian. Tambahan “tetap” tidak dipakai karena tidak dinyatakan secara eksplisit dan akan menafsirkan kesinambungan hubungan itu lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat dibuat lancar bagi pembaca umum sambil mempertahankan citra “di depan mata bangsa-bangsa”, formula perjanjian, dan nama Yahweh.
