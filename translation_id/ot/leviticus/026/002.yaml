  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: id
  text: Kamu harus memelihara hari-hari Sabat-Ku dan menaruh hormat kepada tempat kudus-Ku[a]. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “takut akan tempat kudus-Ku” atau “menaruh rasa gentar terhadap tempat kudus-Ku.” Kata kerja Ibrani dapat menyatakan rasa takut, hormat, atau gentar, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: hari-hari Sabat-Ku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal dipertahankan secara alami dalam bahasa Indonesia. Ungkapan ini dapat mencakup seluruh waktu Sabat yang menjadi milik Yahweh, bukan hanya satu hari tertentu.
- source_word: תִּשְׁמֹרוּ
  choice: harus memelihara
  rationale: Dalam konteks perintah perjanjian, שׁמר menyatakan ketaatan dan perhatian saksama dalam menjalankan ketetapan. 'Memelihara' merupakan padanan yang wajar dan bermartabat.
- source_word: וּמִקְדָּשִׁי
  choice: dan tempat kudus-Ku
  rationale: מִקְדָּשׁ berarti tempat yang dikuduskan atau tempat suci. 'Tempat kudus' jelas dan lazim dalam bahasa Indonesia serta tidak mempersempit rujukannya secara berlebihan.
- source_word: תִּירָאוּ
  choice: menghormati
  rationale: Dalam konteks tempat kudus, ירא mengungkapkan rasa takut yang penuh hormat atau gentar karena kekudusan. 'Menghormati' menghasilkan perintah yang alami, sedangkan keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Konstruksi ini merupakan penegasan identitas ilahi yang mendasari kedua perintah. 'Akulah' mempertahankan tekanannya, dan nama יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Makna ירא terhadap tempat kudus
  choice: menghormati
  alternative: takut terhadap; gentar terhadap
  rationale: Konteks menuntut sikap hormat yang mendalam terhadap kekudusan tempat itu. Namun, karena verba Ibrani juga dapat menyatakan takut atau gentar, alternatif tersebut dicatat dan tidak dihapus dari pembaca.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah perjanjian yang ringkas dan bermartabat. Bentuk 'Kamu' mengikuti sapaan jamak Ibrani secara kolektif; bahasa Indonesia tidak menandai jumlah pada pronomina ini. Kapitalisasi pada akhiran posesif ilahi dipakai demi kejelasan rujukan.
