  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: id
  text: Aku akan menempatkan kediaman-Ku di tengah-tengah kamu, dan jiwa-Ku tidak akan muak terhadap kamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: tempat kediaman-Ku
  rationale: Menjaga arti dasar mishkan sebagai tempat Allah berdiam, sekaligus tetap alami dalam bahasa Indonesia dan tidak mempersempitnya hanya pada bentuk bangunan.
- source_word: נַפְשִׁי
  choice: jiwa-Ku
  rationale: Menerjemahkan unsur nefesh secara eksplisit, sesuai penekanan antropomorfis teks sumber dan tanpa menghilangkannya menjadi sekadar kata ganti 'Aku'.
- source_word: תִגְעַל
  choice: akan muak terhadap
  rationale: Kata ga'al menyatakan penolakan atau kejijikan yang kuat; 'muak terhadap' mempertahankan kekuatan ungkapannya dalam bahasa Indonesia modern.
theological_decisions:
- issue: Bahasa antropomorfis tentang jiwa Allah
  choice: jiwa-Ku tidak akan muak terhadap kamu
  alternative: Aku tidak akan muak terhadap kamu
  rationale: Teks Ibrani secara eksplisit memakai נַפְשִׁי, 'jiwa-Ku'. Terjemahan mempertahankan ungkapan itu tanpa mencoba menjelaskan atau menyelaraskannya secara teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'di tengah-tengah kamu' dipilih untuk menyampaikan בְּתוֹכְכֶם secara alami; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
