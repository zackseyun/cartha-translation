translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan dua akibat kutuk perjanjian: tenaga manusia habis tanpa guna, lalu tanah dan pepohonan gagal memberikan hasil. Pronomina tunggal dipakai secara kolektif untuk umat yang disapa.'
