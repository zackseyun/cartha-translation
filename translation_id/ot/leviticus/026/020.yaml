  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: id
  text: Tenagamu akan terkuras sia-sia,[a] tanahmu tidak akan memberikan hasilnya, dan pohon-pohon di tanah itu tidak akan menghasilkan buahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tenagamu akan habis untuk kesia-siaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם לָרִיק
  choice: akan terkuras sia-sia
  rationale: Gabungan ini menyatakan tenaga yang habis tanpa hasil. 'Terkuras sia-sia' alami dalam bahasa Indonesia serta mempertahankan gagasan kehabisan tenaga dan kesia-siaan.
- source_word: כֹּחֲכֶם
  choice: tenagamu
  rationale: Dalam konteks pekerjaan pertanian, 'tenaga' lebih langsung dan alami daripada 'kekuatan', tanpa menghilangkan makna daya yang dikerahkan.
- source_word: אַרְצְכֶם
  choice: tanahmu
  rationale: Di sini אֶרֶץ menunjuk pada tanah milik umat yang diusahakan dan yang seharusnya memberikan hasil; 'tanahmu' sesuai dengan konteks pertanian.
- source_word: יְבוּלָהּ
  choice: hasilnya
  rationale: יְבוּל berarti hasil atau produksi tanah. 'Hasilnya' ringkas, jelas, dan cukup luas untuk mencakup seluruh hasil pertanian.
- source_word: וְעֵץ הָאָרֶץ
  choice: pohon-pohon di negeri itu
  rationale: Kata עֵץ berbentuk tunggal tetapi bermakna kolektif. Bentuk jamak wajar dalam bahasa Indonesia, sedangkan הָאָרֶץ di sini menunjuk pada negeri yang sedang dibicarakan.
- source_word: לֹא יִתֵּן פִּרְיוֹ
  choice: tidak akan menghasilkan buahnya
  rationale: Secara harfiah berarti 'tidak akan memberikan buahnya'. 'Menghasilkan buahnya' merupakan ungkapan pertanian yang alami dan mempertahankan maknanya.
