  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: id
  text: Aku akan memberikan damai di negeri itu, dan kamu akan berbaring tanpa ada yang membuatmu takut. Aku akan menyingkirkan binatang berbahaya dari negeri itu, dan pedang[a] tidak akan melintasi negerimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pedang” merupakan kiasan Ibrani untuk perang atau penyerbuan bersenjata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי שָׁלוֹם
  choice: Aku akan memberikan damai
  rationale: Mempertahankan makna langsung נתן, sedangkan שָׁלוֹם dalam konteks berkat perjanjian mencakup keamanan dan kesejahteraan; 'damai' paling alami tanpa mempersempit cakupannya.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: אֶרֶץ menunjuk pada wilayah tempat Israel tinggal; 'negeri itu' mempertahankan arti teritorial dan terdengar alami dalam bahasa Indonesia.
- source_word: וּשְׁכַבְתֶּם וְאֵין מַחֲרִיד
  choice: sehingga kamu akan berbaring tanpa ada yang membuatmu takut
  rationale: שׁכב secara konkret berarti 'berbaring', sementara מַחֲרִיד adalah penyebab rasa takut. 'Sehingga' menyatakan hasil alami dari damai tanpa mengubah isi janji.
- source_word: וְהִשְׁבַּתִּי חַיָּה רָעָה
  choice: Aku akan menyingkirkan binatang buas yang berbahaya
  rationale: Bentuk kausatif שׁבת berarti membuat berhenti atau lenyap dari keadaan tersebut. רָעָה di sini menggambarkan ancaman atau bahaya, bukan kejahatan moral.
- source_word: וְחֶרֶב לֹא תַעֲבֹר
  choice: dan pedang tidak akan melintasi
  rationale: Terjemahan ini mempertahankan citra harfiah 'pedang' sekaligus membuka makna metonimisnya, yaitu perang atau penyerbuan bersenjata.
- source_word: בְּאַרְצְכֶם
  choice: negerimu
  rationale: Akhiran orang kedua jamak pada teks sumber menyatakan negeri milik atau tempat tinggal umat; bahasa Indonesia lazim memakai bentuk '-mu' yang dapat bersifat jamak menurut konteks.
theological_decisions:
- issue: Cakupan damai yang dijanjikan
  choice: Damai dipertahankan sebagai berkat perjanjian yang nyata di negeri itu, mencakup keamanan dari ketakutan, binatang berbahaya, dan serangan bersenjata.
  alternative: Menafsirkan damai sebagai ketenteraman batin saja atau sebagai keadaan politik saja.
  rationale: Rangkaian gambaran konkret dalam ayat mendukung keamanan yang menyeluruh tetapi berakar pada kehidupan nyata di negeri itu; terjemahan tidak membatasi janji pada satu dimensi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti tunggal untuk Allah ditulis dengan huruf kapital, sedangkan 'kamu/-mu' mewakili umat secara jamak sesuai konteks. Citra konkret 'berbaring' dan 'pedang' dipertahankan.
