base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: id
  text: Pengirikanmu akan mencapai panen anggur, dan panen anggur akan mencapai waktu menabur. Kamu akan makan rotimu sampai kenyang dan hidup dengan aman di negerimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: masa pengirikanmu
  rationale: Nomina ini menunjuk pada kegiatan atau masa mengirik; penambahan 'masa' membuat ungkapan tentang berlangsungnya pekerjaan hingga panen anggur alami dalam bahasa Indonesia.
- source_word: בָּצִיר
  choice: musim panen anggur
  rationale: Istilah Ibrani ini secara khusus berarti panen anggur, bukan panen secara umum.
- source_word: זָרַע
  choice: musim menabur
  rationale: Dalam rangkaian kalender pertanian, bentuk ini menunjuk pada waktu atau kegiatan menabur benih; 'musim menabur' menyampaikan maksudnya dengan jelas.
- source_word: לֶחֶם
  choice: makanan
  rationale: Dalam konteks janji kecukupan pangan, לֶחֶם dapat berfungsi lebih luas daripada roti harfiah dan berarti makanan atau bahan pangan.
- source_word: לָשֹׂבַע
  choice: sampai kenyang
  rationale: Menyatakan makan hingga puas atau berkecukupan, sesuai makna sumber.
- source_word: וִישַׁבְתֶּם לָבֶטַח
  choice: tinggal dengan aman
  rationale: ישׁב berarti tinggal atau menetap, sedangkan לָבֶטַח menyatakan keadaan aman dan tenteram.
