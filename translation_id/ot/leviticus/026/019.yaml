base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: id
  text: Aku akan mematahkan kebanggaan akan kekuatanmu. Aku akan membuat langit di atasmu seperti besi dan tanahmu seperti perunggu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tembaga”. Kata Ibrani ini dapat berarti tembaga atau perunggu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Aku akan mematahkan
  rationale: Kata שׁבר berarti mematahkan atau menghancurkan. “Mematahkan” alami dalam bahasa Indonesia dan mempertahankan gambaran bahwa Allah meruntuhkan kebanggaan serta keteguhan mereka.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: kebanggaan akan kekuatanmu
  rationale: גָּאוֹן dapat berarti kebanggaan, keangkuhan, keluhuran, atau kemegahan, sedangkan עֹז berarti kekuatan. Dalam konteks hukuman terhadap umat yang membangkang, frasa ini menunjuk pada kebanggaan yang bertumpu pada kekuatan mereka. Bentuk ini menjaga hubungan antarkata tanpa mengubahnya menjadi penjelasan panjang.
- source_word: וְנָתַתִּי
  choice: Aku akan membuat
  rationale: Walaupun נתן secara dasar berarti “memberikan” atau “menempatkan”, dalam konstruksi ini maknanya adalah menjadikan langit dan tanah seperti bahan-bahan keras yang disebutkan.
- source_word: שְׁמֵיכֶם
  choice: langit di atasmu
  rationale: Bentuk Ibrani secara gramatikal jamak dan mengacu pada langit di atas mereka. Bahasa Indonesia lazim memakai bentuk tunggal “langit”; tambahan “di atasmu” menyampaikan hubungan sufiks orang kedua secara alami tanpa memakai bentuk “langit-langit” yang akan keliru berarti plafon.
- source_word: כַּבַּרְזֶל
  choice: seperti besi
  rationale: Perbandingan ini menggambarkan langit yang keras dan tidak menghasilkan hujan. “Seperti besi” jelas serta mempertahankan metafora sumber.
- source_word: אַרְצְכֶם
  choice: tanahmu
  rationale: אֶרֶץ dapat berarti negeri, bumi, atau tanah. Dalam gambaran pertanian ini, “tanahmu” paling langsung menyatakan lahan yang menjadi keras dan tidak subur.
- source_word: כַּנְּחֻשָׁה
  choice: seperti perunggu
  rationale: נְחֻשָׁה dapat menunjuk pada tembaga atau perunggu. “Perunggu” merupakan padanan yang wajar dalam gambaran tradisional tentang tanah yang keras, sedangkan kemungkinan “tembaga” dicatat dalam catatan kaki.
theological_decisions:
- issue: Daya metaforis gambaran kutuk perjanjian
  choice: Mempertahankan gambaran langit seperti besi dan tanah seperti perunggu
  alternative: Menjelaskannya langsung sebagai kekeringan dan kegagalan panen
  rationale: Konteks menunjukkan hukuman berupa langit yang tidak menurunkan hujan dan tanah yang tidak menghasilkan, tetapi teks menyatakannya melalui metafora. Terjemahan mempertahankan metafora itu agar tidak mempersempit atau menjelaskan lebih daripada sumber.
- issue: Hubungan antara kebanggaan dan kekuatan
  choice: kebanggaan akan kekuatanmu
  alternative: kekuatanmu yang kaubanggakan
  rationale: Konstruksi Ibrani גְּאוֹן עֻזְּכֶם ringkas dan dapat dipahami sebagai kebanggaan yang berkaitan atau bertumpu pada kekuatan mereka. Pilihan utama cukup alami dalam bahasa Indonesia dan tidak sepenuhnya mengubah konstruksi itu menjadi klausa yang lebih tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal “Aku” dan akhiran “-mu” mengikuti tuturan ilahi kepada Israel sebagai satu umat. Metafora sumber dipertahankan tanpa menjadikannya penjelasan eksplisit tentang kekeringan.
