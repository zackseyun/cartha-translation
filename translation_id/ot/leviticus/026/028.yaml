  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: id
  text: maka Aku pun akan berjalan melawan kamu dengan kemarahan yang penuh permusuhan[a], dan Aku sendiri akan menghajar kamu tujuh kali lipat[b] karena dosa-dosamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam murka karena perlawanan”; secara tradisional, “Aku akan berjalan melawan kamu dalam murka.”
    reason: Istilah קֶרִי sulit dan dalam konteks ini dapat menunjuk pada permusuhan, perlawanan, atau keberlawanan. Alternatif mempertahankan susunan ungkapan Ibrani yang lebih dekat.
  - marker: b
    text: Atau, “Aku akan mendisiplin kamu tujuh kali karena dosa-dosamu.”
    reason: יסר dapat berarti menghajar, mendisiplin, atau menghukum; שֶׁבַע juga dapat dinyatakan sebagai “tujuh kali” alih-alih “tujuh kali lipat”.
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: Aku pun akan berjalan
  rationale: Mempertahankan gambaran harfiah ‘berjalan’ yang berulang dan penting dalam rumusan kutuk perjanjian pasal ini; ‘pun’ menyampaikan kesinambungan serta tanggapan ilahi dalam konteks.
- source_word: עִמָּכֶם
  choice: melawan kamu
  rationale: Walaupun עִם secara harfiah berarti ‘dengan’, gabungannya dengan קֶרִי di sini bersifat adversatif. ‘Melawan kamu’ alami dalam bahasa Indonesia dan mempertahankan daya relasional ungkapan itu.
- source_word: בַּחֲמַת קֶרִי
  choice: dengan permusuhan yang penuh murka
  rationale: חֵמָה menyatakan murka atau amarah yang menyala, sedangkan קֶרִי adalah istilah sulit yang dalam konteks ini menyatakan sikap berlawanan atau bermusuhan. Susunan ini alami dalam bahasa Indonesia tanpa menghapus ketidakpastian leksikalnya, yang dicatat dalam catatan kaki.
- source_word: וְיִסַּרְתִּי
  choice: Aku akan mendisiplinkan
  rationale: יסר dapat menunjuk pada tindakan mendidik, mengoreksi, atau menghajar. ‘Mendisiplinkan’ mempertahankan nuansa korektif sekaligus keseriusan hukuman perjanjian.
- source_word: אַף אֲנִי
  choice: Aku sendiri
  rationale: Menyampaikan penegasan kuat pada pelaku ilahi tanpa memakai susunan yang terasa kuno atau janggal dalam bahasa Indonesia modern.
- source_word: שֶׁבַע
  choice: tujuh kali lipat
  rationale: Dalam rangkaian Imamat 26, bilangan ini menyatakan penggandaan atau peningkatan hukuman. ‘Tujuh kali lipat’ ringkas dan wajar, sementara kemungkinan ‘tujuh kali’ dicatat sebagai alternatif.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: karena dosa-dosamu
  rationale: עַל menandai dasar atau sebab pendisiplinan; ‘karena’ menyatakannya secara jelas dan alami.
theological_decisions:
- issue: Sifat tanggapan Allah dalam kutuk perjanjian
  choice: 'Mempertahankan sekaligus bahasa permusuhan dan pendisiplinan: Allah berjalan melawan umat dan mendisiplinkan mereka.'
  alternative: Menerjemahkan seluruh tindakan hanya sebagai penghukuman, atau melunakkan ungkapan adversatif menjadi sekadar ketidaksenangan.
  rationale: Bahasa Ibrani menggabungkan perlawanan relasional (הלך + עם + קֶרִי) dengan יסר, yang dapat mencakup hajaran atau disiplin. Mempertahankan keduanya menghindari pembacaan yang hanya retributif maupun yang terlalu dilunakkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Idiom ‘berjalan melawan’ dipertahankan karena penting dalam pola sastra pasal ini, sedangkan frasa sulit בַּחֲמַת קֶרִי dibuat wajar melalui ‘permusuhan yang penuh murka’ dan alternatifnya dicatat.
