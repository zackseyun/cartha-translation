  text: וַ/אֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְ/יָשָׁ֕ן מִ/פְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: id
  text: Kalian akan memakan persediaan lama yang sudah lama tersimpan[a], dan kalian akan mengeluarkan yang lama karena yang baru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kalian akan memakan yang lama, yang telah lama tersimpan.”'
    reason: Menjelaskan susunan padat יָשָׁן נוֹשָׁן dan bahwa kata 'persediaan' tersirat, bukan disebutkan langsung dalam teks Ibrani.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Kalian akan memakan
  rationale: Bentuk orang kedua jamak berada dalam rangkaian berkat perjanjian dan menyatakan janji mengenai masa depan.
- source_word: יָשָׁן נוֹשָׁן
  choice: persediaan lama yang sudah lama tersimpan
  rationale: יָשָׁן dipakai sebagai nomina bagi hasil panen atau bahan makanan simpanan, sedangkan נוֹשָׁן menegaskan bahwa persediaan itu telah disimpan lama tanpa memberi kesan negatif seperti basi.
- source_word: וְיָשָׁן
  choice: yang lama
  rationale: Adjektiva ini kembali dipakai secara substantival dan merujuk pada persediaan lama yang telah disebutkan.
- source_word: מִפְּנֵי
  choice: karena
  rationale: Dalam konteks ini frasa tersebut menyatakan alasan atau desakan akibat datangnya persediaan baru. Pilihan ringkas ini mempertahankan hubungan yang tidak dijabarkan secara eksplisit dalam bahasa Ibrani.
- source_word: חָדָשׁ
  choice: yang baru
  rationale: Adjektiva ini digunakan secara substantival bagi hasil panen atau persediaan baru; terjemahan ringkas mempertahankan gaya sumber.
- source_word: תּוֹצִיאוּ
  choice: kalian akan mengeluarkan
  rationale: Bentuk Hifil dari יצא secara harfiah berarti menyebabkan keluar atau membawa keluar. 'Mengeluarkan' mempertahankan makna dasar tanpa secara eksplisit menambahkan gagasan membuang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Kalian' menandai sapaan jamak dalam teks Ibrani. Pengulangan 'lama' dipertahankan karena mencerminkan penegasan sumber dan melukiskan kelimpahan persediaan.
