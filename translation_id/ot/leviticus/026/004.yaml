  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: id
  text: maka Aku akan memberikan hujan bagimu pada musimnya[a]. Tanah akan memberikan hasilnya, dan pohon-pohon di ladang[b] akan memberikan buahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada waktu yang tepat.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani untuk “pohon” berbentuk tunggal, tetapi digunakan dengan makna kolektif, yakni pohon-pohon di ladang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Aku akan memberikan
  rationale: Menerjemahkan verba umum נתן secara langsung sebagai “memberikan” dan mempertahankan bentuk janji ilahi orang pertama.
- source_word: גִשְׁמֵיכֶם
  choice: hujan bagimu
  rationale: Bentuk jamak Ibrani menunjuk pada hujan musiman, tetapi pengulangan “hujan-hujanmu” tidak wajar dalam bahasa Indonesia. “Hujan bagimu” tetap menyatakan bahwa hujan itu dianugerahkan untuk umat.
- source_word: בְּעִתָּם
  choice: pada musimnya
  rationale: Ungkapan ini menyatakan waktu yang semestinya bagi turunnya hujan. “Pada musimnya” alami dalam konteks pertanian dan tetap membuka nuansa “pada waktu yang tepat” dalam catatan kaki.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: Tanah akan memberikan
  rationale: “Tanah” sesuai dengan konteks negeri dan pertanian. “Memberikan” mempertahankan pengulangan verba נתן yang menonjol dalam ayat ini tanpa terasa janggal dalam bahasa Indonesia.
- source_word: יְבוּלָהּ
  choice: hasilnya
  rationale: “Hasil” mencakup keluaran pertanian tanah tanpa mempersempitnya hanya pada jenis tanaman tertentu.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: pohon di ladang
  rationale: Mempertahankan bentuk tunggal Ibrani yang dapat berfungsi secara kolektif atau generik. Catatan kaki menjelaskan daya kolektifnya tanpa mengubah bentuk dalam teks utama.
- source_word: יִתֵּן פִּרְיוֹ
  choice: akan memberikan buahnya
  rationale: Mempertahankan arti dasar נתן serta pengulangannya, sementara bentuk tunggal “buahnya” selaras dengan “pohon” dalam teks Ibrani.
theological_decisions:
- issue: Bahasa berkat perjanjian yang berkaitan dengan ketaatan dan kesuburan pertanian
  choice: Menyampaikan janji konkret tentang hujan, hasil tanah, dan buah pohon secara langsung.
  alternative: Menjadikannya janji umum tentang kemakmuran materi atau menafsirkannya semata-mata sebagai kelimpahan rohani.
  rationale: Konteks langsungnya adalah berkat perjanjian bagi Israel dalam bentuk produktivitas pertanian. Terjemahan tidak memperluas ataupun merohanikan janji tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Kapital pada “Aku” menandai pembicara ilahi sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Pengulangan “memberikan” dipertahankan untuk mencerminkan tiga pemakaian נתן dalam teks Ibrani.
