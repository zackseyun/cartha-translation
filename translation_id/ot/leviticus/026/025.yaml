  terminology: '''Pedang'', ''pembalasan perjanjian'', ''wabah penyakit'', dan idiom ''ke tangan musuh'' sesuai dengan register Alkitab Indonesia modern. Huruf kapital pada ''Aku'' konsisten dengan konvensi naskah.'
