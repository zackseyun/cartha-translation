  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: id
  text: Aku akan mendatangkan pedang melawan kamu untuk melaksanakan pembalasan perjanjian[a], dan kamu akan terkumpul di kota-kotamu. Lalu Aku akan mengirimkan wabah penyakit di tengah-tengahmu, dan kamu akan diserahkan ke tangan musuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pedang yang melaksanakan pembalasan pembalasan perjanjian.” Ungkapan Ibrani ini bersifat menegaskan melalui kata-kata serumpun. Ungkapan tersebut juga dapat diterjemahkan “pedang yang menuntut pembalasan perjanjian,” “pedang yang membalaskan perjanjian,” atau, dengan lebih lancar, “pedang yang melaksanakan pembalasan karena perjanjian.”
    reason: Menjelaskan pengulangan emphatik participium dan nomina serumpun, serta mempertahankan ketidakpastian yang wajar mengenai hubungan antara pembalasan dan perjanjian.
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם
  choice: Aku akan mendatangkan ... melawan kamu
  rationale: 'Bentuk hifil dari בוא menyatakan tindakan kausatif: Allah mendatangkan pedang. Dalam konteks penghukuman, עַל menyatakan tindakan yang diarahkan melawan mereka.'
- source_word: חֶרֶב
  choice: pedang
  rationale: Nomina tanpa artikel ini menunjuk pada pedang sebagai lambang sekaligus alat perang dan penghukuman.
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: untuk melaksanakan pembalasan perjanjian
  rationale: Partisip dan nomina serumpun menegaskan tindakan pembalasan. Ungkapan ini dipertahankan cukup dekat dengan struktur Ibrani sambil dibuat wajar dalam bahasa Indonesia; hubungan tepat antara pembalasan dan perjanjian tetap dijelaskan dalam catatan.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: dan kamu akan berkumpul ke dalam kota-kotamu
  rationale: Nifal אסף dapat menyatakan berkumpul atau dihimpun. 'Akan berkumpul' alami dalam konteks orang-orang yang mencari perlindungan di dalam kota, sedangkan 'ke dalam' menampilkan gerak masuk yang tersirat oleh konteks pengepungan.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: Lalu Aku akan mengirimkan wabah penyakit ke tengah-tengahmu
  rationale: דֶבֶר dalam rumusan kutuk perjanjian menunjuk pada wabah mematikan. 'Lalu' menyatakan urutan penghukuman, dan 'ke tengah-tengahmu' mempertahankan gambaran lokatif בְּתוֹכְכֶם.
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: dan kamu akan diserahkan ke tangan musuh
  rationale: Nifal נתן di sini bermakna pasif, yakni diserahkan kepada kuasa musuh. Ungkapan 'ke tangan musuh' mempertahankan idiom Ibrani tentang berada di bawah kekuasaan pihak lain.
theological_decisions:
- issue: Makna נְקַם בְּרִית, 'pembalasan perjanjian'
  choice: Mempertahankan ungkapan 'pembalasan perjanjian' sebagai penghukuman yang berkaitan dengan perjanjian.
  alternative: Menerjemahkannya secara lebih interpretatif sebagai 'pembalasan karena kamu melanggar perjanjian' atau 'pembalasan demi menegakkan perjanjian'.
  rationale: Hubungan konstruksi Ibrani dapat mencakup pembalasan yang didasarkan pada, dituntut oleh, atau dijalankan demi perjanjian. Teks utama tidak memilih salah satu nuansa secara sempit, sehingga ketegangan teologisnya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. 'Wabah penyakit' dipilih daripada istilah yang lebih arkais, sedangkan idiom 'ke tangan musuh' dipertahankan karena jelas dan memiliki bobot sastra.
