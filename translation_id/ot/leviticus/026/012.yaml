  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: id
  text: Aku akan berjalan di tengah-tengah kamu dan menjadi Allahmu, dan kamu akan menjadi umat-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: Aku akan berjalan
  rationale: Bentuk hitpael dari הלך menggambarkan gerak dan kehadiran Allah di antara umat-Nya. 'Berjalan' mempertahankan gambaran konkret teks; 'diam' akan menafsirkan lebih jauh daripada arti langsung verba tersebut.
- source_word: בְּתוֹכְכֶם
  choice: di tengah-tengah kamu
  rationale: Frasa ini menunjuk pada kehadiran di tengah komunitas, bukan keberadaan batiniah di dalam setiap orang. Ungkapan ini alami dan cukup formal dalam bahasa Indonesia modern.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: dan menjadi Allahmu
  rationale: Ini merupakan rumusan perjanjian yang menyatakan hubungan kepunyaan. Bentuk 'menjadi Allahmu' lebih alami daripada 'menjadi Allah bagi kamu' dan tetap mempertahankan daya relasional konstruksi Ibrani.
- source_word: לֵאלֹהִים
  choice: Allah
  rationale: Dalam konteks perjanjian Israel, אֱלֹהִים merujuk kepada Allah yang mengikat perjanjian dengan umat-Nya, bukan kepada suatu ilah yang tidak tertentu.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: dan kamu akan menjadi umat-Ku
  rationale: '''Umat-Ku'' menyampaikan secara alami hubungan timbal balik dalam rumusan perjanjian, sedangkan ''suatu umat bagi-Ku'' terasa kaku dalam bahasa Indonesia.'
theological_decisions:
- issue: Penerjemahan rumusan perjanjian
  choice: Aku ... menjadi Allahmu, dan kamu ... menjadi umat-Ku.
  alternative: Aku akan menjadi Allah bagi kamu, dan kamu akan menjadi suatu umat bagi-Ku.
  rationale: Pilihan ini mempertahankan hubungan timbal balik yang dinyatakan oleh rumusan perjanjian Ibrani, tanpa menambahkan isi doktrinal yang tidak disebutkan dalam ayat.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam yang alami dan bermartabat. Kata ganti 'Aku' dan akhiran '-Ku' dipakai untuk suara Allah sesuai kebiasaan penerjemahan Alkitab Indonesia; 'kamu' dipahami secara jamak dari bentuk Ibrani dan konteks umat sebagai komunitas.
