  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: id
  text: maka Aku pun akan berjalan menentang kamu[a], dan Aku sendiri akan menghantam kamu tujuh kali lipat[b] karena dosa-dosamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melawan kamu dengan permusuhan” atau “berlaku berlawanan terhadap kamu.” Istilah Ibrani yang diterjemahkan “menentang” berulang kali muncul dalam Imamat 26 untuk menggambarkan sikap saling berlawanan antara Israel dan TUHAN.
    reason: lexical_alternative
  - marker: b
    text: Atau “tujuh kali karena dosa-dosamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הָלַכְתִּי
  choice: maka ... akan berjalan
  rationale: Kata הָלַךְ secara harfiah berarti “berjalan/pergi.” “Berjalan” mempertahankan ungkapan dan pengulangan sastra dalam rangkaian peringatan pasal ini; וְ diterjemahkan “maka” untuk menyatakan perkembangan konsekuensial.
- source_word: אַף אֲנִי
  choice: Aku pun
  rationale: Gabungan ini menegaskan tanggapan timbal balik dari Allah. “Aku pun” alami dalam bahasa Indonesia dan tetap membawa daya penekanannya.
- source_word: עִמָּכֶם בְּ/קֶרִי
  choice: menentang kamu
  rationale: Secara harfiah עִמָּכֶם berarti “dengan kamu,” tetapi bersama בְּקֶרִי ungkapan itu menunjukkan sikap atau tindakan yang berlawanan. “Menentang kamu” jelas dan mempertahankan pola timbal balik dalam pasal ini.
- source_word: וְ/הִכֵּיתִי
  choice: dan ... akan menghantam
  rationale: נכה menyatakan tindakan memukul atau menghantam. “Menghantam” merupakan ungkapan Indonesia modern yang kuat dan sesuai dengan tindakan penghukuman dalam konteks ini.
- source_word: גַּם אָ֔נִי
  choice: Aku sendiri
  rationale: Penyebutan diri yang kembali ditekankan memperjelas bahwa TUHAN sendiri bertindak. “Aku sendiri” mempertahankan penekanan tersebut tanpa menjadi arkais.
- source_word: שֶׁבַע
  choice: tujuh kali lipat
  rationale: Dalam rangkaian Imamat 26, kata ini menyatakan pelipatgandaan atau peningkatan hukuman. “Tujuh kali lipat” mempertahankan daya retorisnya, sementara kemungkinan “tujuh kali” dicatat dalam catatan kaki.
- source_word: עַל חַטֹּאתֵי/כֶם
  choice: karena dosa-dosamu
  rationale: עַל di sini menunjukkan dasar atau sebab penghukuman. “Karena dosa-dosamu” menyampaikan hubungan sebab itu secara lugas dan alami.
theological_decisions:
- issue: Pemaknaan ungkapan perjanjian בְּקֶרִי dalam pernyataan timbal balik tentang TUHAN dan Israel
  choice: menentang
  alternative: dengan permusuhan / berlawanan
  rationale: Pilihan ini mempertahankan gagasan perlawanan timbal balik dalam penghakiman perjanjian tanpa mempersempitnya menjadi emosi permusuhan saja atau memasukkan kategori teologis dari luar teks.
- issue: Derajat keharfiah-an dalam rumusan hukuman שֶׁבַע
  choice: tujuh kali lipat
  alternative: tujuh kali
  rationale: Rumusan ini mempertahankan intensitas retoris peringatan dan kemungkinan makna pelipatgandaan, tanpa menghilangkan pembacaan yang lebih numerik, yang dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Ungkapan “berjalan menentang” sengaja mempertahankan metafora Ibrani serta kata kunci berulang dalam pasal ini; pronomina ilahi ditulis dengan huruf kapital mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
