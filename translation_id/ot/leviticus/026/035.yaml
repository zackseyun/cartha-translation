  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: id
  text: Selama masa ketelantarannya, tanah itu akan beristirahat—istirahat yang tidak dinikmatinya selama masa-masa Sabatmu, ketika kamu tinggal di tanah itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: Sepanjang masa tanah itu telantar
  rationale: Ungkapan ini menyatakan keseluruhan masa ketelantaran. Penyebutan 'tanah itu' memperjelas rujukan sufiks feminin kepada negeri atau tanah tersebut.
- source_word: תִּשְׁבֹּת
  choice: tanah itu akan beristirahat
  rationale: Verba שׁבת berarti berhenti atau beristirahat; dalam konteks ini subjeknya ialah tanah. Pengulangan 'tanah itu' menghasilkan bahasa Indonesia yang jelas.
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: istirahat yang tidak diperolehnya
  rationale: Partikel אֵת menjadikan klausa relatif sebagai objek verba sebelumnya. Rumusan ini wajar dalam bahasa Indonesia serta mempertahankan gagasan bahwa tanah akan memperoleh istirahat yang dahulu tidak dinikmatinya.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: pada masa Sabat-sabatmu
  rationale: Bentuk jamak secara harfiah berarti 'Sabat-sabatmu'. Konteks ayat 34–35 mengarah pada masa-masa perhentian Sabat yang seharusnya diterima tanah, khususnya tahun-tahun Sabat.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: ketika kamu tinggal di atasnya
  rationale: Infinitif ישׁב dengan sufiks orang kedua jamak menyatakan masa ketika umat itu mendiami tanah tersebut; עָלֶיהָ dipertahankan sebagai 'di atasnya'.
theological_decisions:
- issue: Rujukan 'Sabat-sabatmu'
  choice: Mempertahankan ungkapan jamak 'Sabat-sabatmu' dalam teks dan menjelaskan konteks pertanian dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai 'tahun-tahun Sabatmu'.
  rationale: Teks Ibrani memakai istilah umum שַׁבָּתוֹת, sedangkan konteks menunjukkan perhentian tanah. Mempertahankan bentuk umum menghindari pembatasan makna yang lebih tegas daripada sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Personifikasi tanah serta pengulangan gagasan 'beristirahat' dipertahankan. 'Telantar' dipilih untuk keadaan tanah yang tidak dihuni dan tidak diolah, bukan semata-mata kerusakan fisik.
