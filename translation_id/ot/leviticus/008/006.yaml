  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: id
  text: Kemudian Musa membawa Harun dan putra-putranya mendekat, lalu membasuh mereka dengan air.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: membawa ... mendekat
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau menghadapkan. Dalam konteks penahbisan ini, pilihan ini mempertahankan gerak konkret menuju tempat upacara tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks ini, kata tersebut menunjuk kepada putra-putra Harun yang ditahbiskan sebagai imam. Bentuk Indonesia 'anak-anaknya' wajar dan, berdasarkan konteks, tidak mengaburkan rujukannya.
- source_word: וַיִּרְחַץ
  choice: membasuh
  rationale: רחץ berarti mencuci atau membasuh. 'Membasuh' sesuai dengan tindakan ritual dan tidak menentukan apakah pembasuhan itu sebagian atau seluruh tubuh.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek ini merujuk bersama-sama kepada Harun dan anak-anaknya.
- source_word: בַּמָּיִם
  choice: dengan air
  rationale: Preposisi ב dapat menyatakan sarana atau lingkungan. 'Dengan air' merupakan ungkapan Indonesia yang alami dan mempertahankan air sebagai sarana pembasuhan.
- source_word: וַ
  choice: Kemudian ... lalu
  rationale: Rangkaian waw konsekutif memajukan alur cerita. 'Kemudian' dan 'lalu' menyampaikan urutan tindakan secara alami dalam bahasa Indonesia modern.
