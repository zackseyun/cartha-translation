    text: Atau “sabuk berhias pada efod itu” atau “ikat pinggang efod itu.”
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani di sini jarang digunakan dan tampaknya berarti bahwa efod itu diikatkan pada Harun dengan sabuk tenunannya.
    reason: cultural_note
  revision_rationale: Revisi terutama memperbaiki idiom bahasa Indonesia dengan memakai “memakaikan” untuk tindakan mengenakan pakaian pada orang lain. Istilah teknis “efod” dan istilah pakaian lainnya dipertahankan. Klausa akhir menyatakan bahwa sabuk tenunan yang baru disebut adalah sarana untuk mengencangkan efod pada Harun, sebagaimana paling mungkin dimaksudkan oleh verba denominatif Ibrani dan pronomina finalnya.
