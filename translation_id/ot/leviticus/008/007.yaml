revisions:
- from: Ia mengenakan baju panjang kepada Harun, melilitkan ikat pinggang padanya, mengenakan jubah kepadanya, dan memasangkan efod padanya. Kemudian ia melilitkan sabuk tenunan efod itu padanya[a] dan mengikatkan efod itu padanya dengan sabuk tersebut.[b]
  to: Ia memakaikan Harun baju panjang, mengikat Harun dengan ikat pinggang, memakaikan jubah kepadanya, dan mengenakan efod padanya. Lalu ia mengikatnya dengan sabuk tenunan efod itu[a] dan mengencangkan efod itu pada Harun dengan sabuk tersebut.[b]
  rationale: Revisi terutama memperbaiki idiom bahasa Indonesia dengan memakai “memakaikan” untuk tindakan mengenakan pakaian pada orang lain. Istilah teknis “efod” dan istilah pakaian lainnya dipertahankan. Klausa akhir menyatakan bahwa sabuk tenunan yang baru disebut adalah sarana untuk mengencangkan efod pada Harun, sebagaimana paling mungkin dimaksudkan oleh verba denominatif Ibrani dan pronomina finalnya.
