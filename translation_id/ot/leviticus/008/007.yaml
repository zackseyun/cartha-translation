base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: id
  text: Ia memakaikan Harun baju panjang, mengikat Harun dengan ikat pinggang, memakaikan jubah kepadanya, dan mengenakan efod padanya. Lalu ia mengikatnya dengan sabuk tenunan efod itu[a] dan mengencangkan efod itu pada Harun dengan sabuk tersebut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sabuk berhias pada efod itu” atau “ikat pinggang efod itu.”
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani di sini jarang digunakan dan tampaknya berarti bahwa efod itu diikatkan pada Harun dengan sabuk tenunannya.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: baju panjang
  rationale: Menunjuk pada pakaian dasar imam yang dikenakan dekat tubuh. “Baju panjang” alami dan mudah dipahami dalam bahasa Indonesia modern tanpa menyamakannya dengan mantel luar.
- source_word: אַבְנֵט
  choice: ikat pinggang
  rationale: Menunjuk pada kain yang dililitkan di pinggang; padanan ini jelas dan lazim untuk perlengkapan pakaian imam.
- source_word: מְעִיל
  choice: jubah
  rationale: Menunjuk pada pakaian luar yang dikenakan di atas baju panjang; “jubah” merupakan padanan Indonesia yang alami dalam konteks upacara.
- source_word: אֵפֹד
  choice: efod
  rationale: Istilah teknis bagi pakaian khusus imam yang tidak memiliki padanan Indonesia yang tepat; transliterasi mempertahankan kekhususan benda itu.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: sabuk tenunan efod
  rationale: Dalam konteks pakaian imam, frasa ini menunjuk pada sabuk atau pita tenunan yang menjadi bagian dari efod. Terjemahan ini menyatakan fungsi dan kaitannya dengan efod tanpa memastikan secara berlebihan sifat hiasannya.
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: melilitkan ikat pinggang padanya
  rationale: Kata kerja חגר menggambarkan tindakan memasang atau melilitkan sesuatu pada pinggang. Ungkapan ini akurat sekaligus alami dalam bahasa Indonesia.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: mengikatkan efod itu padanya dengan sabuk tersebut
  rationale: Kata kerja langka yang dibentuk dari אֵפֹד tampaknya menggambarkan tindakan mengencangkan efod. Terjemahan ini memperjelas bahwa sabuk yang baru disebut menjadi alat pengikatnya, sesuai hubungan sintaksis frasa tersebut.
- source_word: וַיִּתֵּן עָלָיו
  choice: mengenakan ... kepadanya / memasangkan ... padanya
  rationale: Ungkapan Ibrani ini dalam konteks pakaian berarti menaruh atau mengenakan pakaian pada seseorang. Variasi padanan Indonesia disesuaikan dengan jenis pakaian agar kalimat tetap alami.
theological_decisions:
- issue: Istilah khusus untuk pakaian imam
  choice: Mempertahankan istilah “efod” sambil menerjemahkan nama pakaian lain dengan padanan Indonesia yang umum
  alternative: Menerjemahkan אֵפֹד secara deskriptif sebagai “pakaian imam seperti celemek”
  rationale: Bentuk dan fungsi efod bersifat khas dan tidak sepenuhnya terwakili oleh satu nama pakaian Indonesia. Transliterasi menjaga ketepatan budaya dan tidak memasukkan gambaran bentuk yang lebih pasti daripada sumber.
- issue: Rujukan pronominal pelaku dan penerima tindakan
  choice: Mempertahankan pelaku sebagai “ia” tetapi menyebut Harun sebagai penerima pada awal kalimat
  alternative: Menyebut “Musa” dan “Harun” berulang kali berdasarkan konteks ayat sebelumnya
  rationale: Teks Ibrani memakai pronomina, tetapi penyebutan Harun sekali mencegah ketidakjelasan alami dalam bahasa Indonesia tanpa mengubah rangkaian tindakan. Identitas pelaku tetap disampaikan secara pronominal sebagaimana teks ayat ini.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Rangkaian tindakan berpakaian dibuat mengalir tanpa menghilangkan pengulangan khas teks Ibrani. Istilah teknis “efod” dipertahankan, sedangkan חֵשֶׁב diterjemahkan secara fungsional dengan catatan kaki yang menjaga kemungkinan makna lainnya.
