base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: id
  text: Kemudian Musa membawa anak-anak Harun mendekat. Musa mengoleskan sebagian darah itu pada cuping telinga kanan mereka, pada ibu jari tangan kanan mereka, dan pada ibu jari kaki kanan mereka. Lalu Musa memercikkan darah itu pada sekeliling mezbah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: menyuruh ... mendekat
  rationale: Bentuk hifil menyatakan bahwa Musa membawa atau membuat anak-anak Harun mendekat; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kausatif.
- source_word: תְּנוּךְ
  choice: cuping telinga
  rationale: Menunjuk bagian luar atau cuping telinga; pilihan ini jelas dan lazim bagi pembaca modern.
- source_word: בֹּהֶן יָד
  choice: ibu jari tangan
  rationale: Dalam konteks tangan, בֹּהֶן menunjuk ibu jari.
- source_word: בֹּהֶן רֶגֶל
  choice: ibu jari kaki
  rationale: Dalam konteks kaki, בֹּהֶן menunjuk jari kaki yang besar.
- source_word: וַיִּזְרֹק
  choice: memercikkan
  rationale: Dalam konteks ritual darah pada mezbah, זרק menyatakan tindakan melemparkan atau memercikkan darah ke permukaan mezbah; 'memercikkan' merupakan padanan ritual yang alami tanpa menyiratkan penuangan.
- source_word: סָבִיב
  choice: ke sekeliling mezbah
  rationale: Menunjukkan bahwa darah dikenakan pada sisi-sisi mezbah di sekelilingnya.
theological_decisions:
- issue: Makna simbolis darah pada anggota tubuh sebelah kanan
  choice: Tidak ditafsirkan dalam teks
  alternative: Menjelaskannya sebagai lambang penyucian pendengaran, tindakan, dan perjalanan hidup
  rationale: Ayat hanya melaporkan tindakan pentahbisan dan tidak menjelaskan simbolismenya; terjemahan tidak boleh memasukkan penafsiran teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Nama pelaku 'Musa' diulang sesuai teks Ibrani untuk menghindari ketidakjelasan. Tidak diperlukan catatan kaki karena semua pilihan dapat disampaikan secara memadai dalam teks utama.
