  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: id
  text: 'Lalu Musa berkata kepada Harun dan anak-anaknya, “Rebuslah daging itu di pintu masuk Kemah Pertemuan. Di sanalah kalian harus memakannya bersama roti yang ada dalam bakul persembahan penahbisan[a], seperti yang telah kuperintahkan: ‘Harun dan anak-anaknya harus memakannya.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bakul persembahan pengudusan.” Istilah Ibrani ini merujuk pada persembahan yang berkaitan dengan upacara pelantikan para imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: Rebuslah
  rationale: Dalam konteks kurban, verba ini menunjuk pada memasak dengan merebus; bentuk imperatif Indonesia mempertahankan daya perintahnya.
- source_word: הַבָּשָׂר
  choice: daging itu
  rationale: Yang dimaksud ialah bagian hewan kurban yang dimakan. 'Daging' alami dalam bahasa Indonesia modern dan lebih tepat dalam konteks kuliner daripada 'tubuh' atau 'daging jasmani'.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: פֶּתַח berarti bukaan atau pintu masuk; frasa ini mempertahankan lokasi ritual secara jelas dan alami.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: Di sanalah kalian harus memakannya
  rationale: Partikel '-lah' pada 'sanalah' mempertahankan penekanan lokasi dari שָׁם, sedangkan 'harus' menyampaikan daya instruktif bentuk verbal dalam konteks perintah.
- source_word: הַלֶּחֶם
  choice: roti
  rationale: Istilah ini secara langsung menunjuk pada roti yang menyertai upacara penahbisan.
- source_word: סַל הַמִּלֻּאִים
  choice: bakul persembahan penahbisan
  rationale: מִלֻּאִים merujuk pada ritus pelantikan atau penahbisan imam. Ungkapan ini menyampaikan fungsi ritualnya tanpa mempertahankan idiom Ibrani 'memenuhi tangan' secara kabur.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: 'seperti yang telah kuperintahkan:'
  rationale: Titik dua secara alami memperkenalkan isi perintah yang dalam bahasa Ibrani ditandai oleh לֵאמֹר, tanpa menghasilkan ungkapan Indonesia yang kaku seperti 'dengan berkata'.
- source_word: יֹאכְלֻהוּ
  choice: harus memakannya
  rationale: Bentuk imperfek dalam kutipan ini memiliki daya instruksi atau kewajiban, bukan semata-mata menyatakan masa depan.
theological_decisions:
- issue: Makna מִלֻּאִים dalam konteks pelantikan imam
  choice: persembahan penahbisan
  alternative: persembahan pengudusan
  rationale: '''Penahbisan'' secara jelas menyatakan ritus pelantikan Harun dan anak-anaknya sebagai imam, tanpa memasukkan struktur jabatan gerejawi yang lebih kemudian. ''Pengudusan'' tetap merupakan kemungkinan leksikal, tetapi kurang spesifik terhadap konteks pelantikan ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai karena Musa berbicara kepada Harun beserta anak-anaknya. Nama ritual 'Kemah Pertemuan' ditulis dengan huruf kapital. Susunan kalimat dibuat alami sambil mempertahankan penekanan lokasi dan daya perintah teks Ibrani.
