  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: id
  text: Bawalah Harun bersama anak-anaknya, pakaian-pakaian itu, minyak pengurapan, lembu jantan untuk kurban penghapus dosa[a], kedua domba jantan itu, dan keranjang berisi roti tidak beragi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban pemurnian.” Istilah Ibrani ini dapat merujuk pada kurban yang berkaitan dengan dosa dan pemurnian ritual.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Bawalah
  rationale: Bentuk imperatif orang kedua maskulin tunggal dari לקח. Dalam konteks pentahbisan ini, perintah tersebut mengharuskan Musa menghadirkan Harun dan segala perlengkapannya; “Bawalah” menyampaikan tindakan itu secara alami dalam bahasa Indonesia tanpa mengubah bentuk perintah.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו אִתּוֹ
  choice: Harun beserta anak-anaknya
  rationale: “Beserta” secara alami menyatakan bahwa anak-anak Harun menyertai dia dan mempertahankan unsur אִתּוֹ tanpa pengulangan pronomina yang kaku.
- source_word: הַבְּגָדִים
  choice: pakaian-pakaian itu
  rationale: בְּגָדִים adalah istilah umum untuk pakaian. Bentuk ulang menunjukkan jamak, sedangkan “itu” mencerminkan kejelasan bentuk tertentu tanpa memasukkan istilah teknis yang tidak dinyatakan langsung.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak pengurapan
  rationale: Ungkapan konstruksi yang secara harfiah berarti “minyak pengurapan”; bentuk ini alami dan telah dikenal dalam bahasa Indonesia.
- source_word: פַּר הַחַטָּאת
  choice: lembu jantan untuk kurban penghapus dosa
  rationale: פַּר berarti lembu jantan, sedangkan חַטָּאת dalam konteks persembahan menunjuk pada kurban yang berkaitan dengan dosa dan pemurnian. “Untuk” memperjelas bahwa hewan itu diperuntukkan bagi kurban tersebut.
- source_word: שְׁנֵי הָאֵילִים
  choice: kedua domba jantan itu
  rationale: Menerjemahkan bilangan dua dan bentuk tertentu pada nomina secara langsung dan wajar.
- source_word: סַל הַמַּצּוֹת
  choice: bakul berisi roti tidak beragi
  rationale: מַצּוֹת menunjuk pada makanan berbahan roti tanpa ragi. “Bakul berisi” mengungkapkan hubungan konstruksi secara alami tanpa menentukan bentuk roti lebih khusus daripada teks.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani ini dapat menunjuk pada dosa maupun kurban yang berhubungan dengan penghapusan dosa dan pemurnian ritual. Karena yang disebut ialah hewan kurban, makna persembahan diperlukan. Teks utama memakai istilah yang luas dikenal, sementara catatan kaki mempertahankan dimensi pemurnian yang juga mungkin dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. Rangkaian objek dipadatkan secara alami; pengulangan kata sambung Ibrani tidak ditiru secara mekanis. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
