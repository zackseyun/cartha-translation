    rationale: The Hebrew explicitly says “his sons with him,” with the pronoun referring to Aaron. “Harun bersama anak-anaknya” makes this relationship clearer in idiomatic Indonesian.
  - severity: low
    issue: “Bakul” is less broadly standard than “keranjang.”
    rationale: Both can render סַל, but “keranjang” has wider currency in modern standard Indonesian and retains the generic sense of the Hebrew.
