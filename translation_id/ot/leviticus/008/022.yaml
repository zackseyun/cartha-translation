  source_fidelity: 'Teks dengan tepat menyampaikan urutan dasar: Musa menghadapkan domba jantan kedua, domba jantan bagi ritus penahbisan, lalu Harun dan keturunannya menumpangkan tangan pada kepalanya. Namun, בָנָיו secara khusus berarti putra-putranya, bukan istilah Indonesia yang lebih luas “anak-anaknya.”'
