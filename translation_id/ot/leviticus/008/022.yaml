base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: id
  text: Kemudian Musa membawa ke hadapan domba jantan kedua, yaitu domba jantan untuk pentahbisan[a], lalu Harun dan putra-putranya menumpangkan tangan mereka ke atas kepala domba jantan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pengudusan.” Ungkapan Ibrani ini adalah istilah teknis keimaman untuk ritus pelantikan ke dalam jabatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Kemudian Musa membawa mendekat
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau mempersembahkan. Ungkapan ini mempertahankan nuansa ritual; nama Musa dinyatakan dari konteks langsung agar subjeknya jelas dalam bahasa Indonesia.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: domba jantan yang kedua
  rationale: אַיִל berarti domba jantan, dan הַשֵּׁנִי merupakan bilangan bertingkat yang berarti yang kedua.
- source_word: אֵיל הַמִּלֻּאִים
  choice: domba jantan untuk penahbisan
  rationale: מִלֻּאִים adalah istilah teknis keimaman bagi upacara pelantikan ke dalam jabatan. Kata 'untuk' menghasilkan frasa Indonesia yang wajar tanpa menghilangkan fungsi ritual hewan tersebut.
- source_word: וַיִּסְמְכוּ
  choice: meletakkan
  rationale: Dalam konteks kurban, סמך menunjuk pada tindakan meletakkan atau menumpangkan tangan pada hewan persembahan.
- source_word: אֶת יְדֵיהֶם
  choice: tangan mereka
  rationale: Terjemahan ini mempertahankan bentuk jamak Ibrani dan terdengar alami dalam bahasa Indonesia.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: di atas kepala domba jantan itu
  rationale: Terjemahan langsung dan jelas dari frasa preposisional yang menggambarkan tindakan ritual tersebut.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Harun dan anak-anaknya
  rationale: בָנָיו dalam konteks ini merujuk kepada putra-putra Harun yang ditahbiskan bersama dia; bentuk Indonesia ini alami dan identitas mereka sudah jelas dari konteks.
theological_decisions:
- issue: Penerjemahan istilah teknis keimaman מִלֻּאִים
  choice: penahbisan
  alternative: pengudusan
  rationale: '''Penahbisan'' paling tepat menyatakan pelantikan Harun dan anak-anaknya ke dalam jabatan imam. ''Pengudusan'' juga mungkin, tetapi lebih luas dan kurang menonjolkan aspek pelantikan resmi; alternatif itu dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan ritual dan istilah teknis teks sumber.
