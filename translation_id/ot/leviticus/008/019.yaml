  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: id
  text: Ia menyembelihnya, lalu Musa memercikkan darah itu pada semua sisi mezbah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghamburkan darah itu pada semua sisi mezbah.” Kata Ibrani yang dipakai menunjukkan penerapan darah kurban dengan gerakan kuat, bukan percikan ringan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Lalu Musa menyembelih domba jantan itu
  rationale: Kata שׁחט dalam konteks kurban berarti menyembelih. Subjek 'Musa' diterapkan secara alami pada kedua verba, sedangkan objek 'domba jantan itu' dipulihkan dari ayat sebelumnya agar jelas dalam bahasa Indonesia.
- source_word: וַיִּזְרֹק
  choice: menyiramkan ... dengan kuat
  rationale: Dalam ritual kurban, זרק menunjuk pada penerapan darah secara kuat ke mezbah, bukan pemercikan ringan. Ungkapan ini lebih alami daripada 'melemparkan darah' dalam bahasa Indonesia sekaligus mempertahankan kekuatan tindakannya.
- source_word: הַדָּם
  choice: darahnya
  rationale: Nomina tentu 'darah itu' merujuk pada darah hewan yang baru disembelih; bentuk posesif pronominal terdengar alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: הַמִּזְבֵּחַ
  choice: mezbah
  rationale: Istilah baku dan ringkas dalam bahasa Indonesia untuk מזבח dalam konteks ibadah kurban.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Menunjukkan bahwa darah dikenakan pada sisi-sisi atau seluruh keliling mezbah.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
