  verdict: revise
  source_fidelity: Draf mengubah subjek verba pertama menjadi Musa, padahal teks Ibrani membedakan pelaku yang tidak disebutkan namanya pada וַיִּשְׁחָט ('ia menyembelih') dari Musa yang disebut secara eksplisit pada וַיִּזְרֹק. Dalam konteks dekat, rujukan 'ia' dapat dipahami, tetapi teks ayat ini sendiri tidak menamai pelaku pertama; terjemahan perlu mempertahankan pembedaan itu. Selain itu, 'di sekelilingnya' kurang jelas karena pronomina dapat merujuk pada darah, sedangkan סָבִיב menerangkan penerapan darah pada seluruh sisi mezbah.
  naturalness: '''Ia menyembelihnya, lalu Musa memercikkan darah itu pada semua sisi mezbah'' adalah bahasa Indonesia modern yang jelas dan tetap bercorak naratif-khidmat. ''Memercikkan'' lazim dalam register kurban; catatan menjelaskan bahwa verba Ibrani di sini melibatkan tindakan yang lebih kuat daripada percikan ringan.'
  terminology: '''Musa'' dan ''mezbah'' sudah baku. ''Darah itu'' mempertahankan ketentuan nomina Ibrani dan rujukannya kepada hewan yang baru disembelih. Istilah ''memercikkan'' dipertahankan dengan kualifikasi leksikal dalam catatan kaki, tanpa menyamakan tindakan ini dengan ritual pemercikan yang lebih ringan.'
