revisions:
- from: Lalu Musa menyembelih domba jantan itu dan menyiramkan darahnya dengan kuat[a] pada mezbah di sekelilingnya.
  to: Ia menyembelihnya, lalu Musa memercikkan darah itu pada semua sisi mezbah.[a]
  rationale: Revisi mempertahankan subjek pelaku pertama yang tidak disebutkan namanya dan penyebutan Musa yang eksplisit pada tindakan kedua. Objek 'nya' tetap dapat dipahami dari ayat sebelumnya tanpa menambahkan identitas hewan secara berlebihan. Frasa spasial diperjelas agar menerjemahkan 'pada mezbah, sekelilingnya' sebagai aplikasi pada seluruh sisi mezbah.
