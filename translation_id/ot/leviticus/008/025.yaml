base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: id
  text: Lalu Musa mengambil lemak, ekor berlemak, seluruh lemak yang menutupi isi perut, umbai hati[a], kedua ginjal beserta lemaknya, dan paha kanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian tambahan pada hati.” Istilah Ibrani ini menunjuk pada bagian tertentu yang diambil dalam tata cara persembahan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Lalu Musa mengambil
  rationale: Bentuk wayyiqtol melanjutkan urutan kisah. Subjek yang tersirat dijelaskan sebagai Musa berdasarkan konteks langsung agar bahasa Indonesia alami dan rujukannya jelas.
- source_word: הַחֵלֶב
  choice: lemak
  rationale: Padanan lazim bagi bagian-bagian berlemak yang dikhususkan dalam tata cara persembahan.
- source_word: הָאַלְיָה
  choice: ekor berlemak
  rationale: Istilah ini menunjuk pada ekor domba yang besar dan berlemak, bukan sekadar ekor biasa.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: seluruh lemak yang ada pada isi perut
  rationale: קֶרֶב dalam konteks anatomi kurban menunjuk pada organ atau bagian dalam; 'isi perut' konkret, wajar, dan mudah dipahami.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: umbai hati
  rationale: Ungkapan ini menunjuk pada bagian tertentu yang melekat pada hati dan disingkirkan dalam tata cara kurban; 'umbai hati' mempertahankan kekhususan anatominya tanpa memastikan secara berlebihan bahwa yang dimaksud adalah lobus.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: kedua ginjal
  rationale: Padanan anatomis langsung yang secara alami menyampaikan jumlah dua.
- source_word: חֶלְבְּהֶן
  choice: beserta lemaknya
  rationale: Menunjukkan bahwa lemak yang dimaksud berkaitan dengan kedua ginjal tersebut.
- source_word: שׁוֹק הַיָּמִין
  choice: paha kanan
  rationale: שׁוֹק menunjuk pada bagian paha atau tungkai atas dalam konteks pemotongan hewan kurban; 'paha' merupakan padanan Indonesia yang ringkas dan tepat.
