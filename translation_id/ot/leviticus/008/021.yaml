base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Musa membasuh isi perut dan kaki-kakinya dengan air. Lalu ia membakar seluruh domba jantan itu di atas mazbah. Itu adalah kurban bakaran, suatu aroma yang menyenangkan, suatu persembahan melalui api bagi Yahweh, seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: isi perut
  rationale: Menunjuk pada bagian-bagian dalam hewan kurban; “isi perut” konkret, wajar, dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: הַכְּרָעַיִם
  choice: kaki-kakinya
  rationale: Dalam petunjuk kurban, istilah ini menunjuk pada kaki atau tungkai hewan. Bentuk dengan enklitik memperjelas bahwa kaki itu milik domba jantan tersebut.
- source_word: רָחַץ בַּמָּיִם
  choice: membasuh ... dengan air
  rationale: Mempertahankan tindakan mencuci dan penyebutan air secara eksplisit sebagaimana dalam bahasa Ibrani.
- source_word: וַיַּקְטֵר
  choice: membakar
  rationale: Dalam konteks kurban, verba ini berarti membuat persembahan naik sebagai asap di atas mazbah. “Membakar” merupakan ungkapan Indonesia yang alami dan konteks mazbah menjaga nuansa ritualnya.
- source_word: כָּל הָאַיִל
  choice: seluruh domba jantan itu
  rationale: כָּל menegaskan bahwa seluruh hewan dipersembahkan; “domba jantan” adalah padanan jelas bagi אַיִל.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Padanan baku dan tepat bagi lokasi pembakaran kurban.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah yang mapan untuk jenis kurban yang seluruhnya dibakar dan naik sebagai asap.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: suatu aroma yang menyenangkan
  rationale: Mempertahankan metafora indrawi dan gagasan bahwa kurban itu berkenan tanpa menjelaskannya secara teologis melampaui teks.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Mencerminkan hubungan istilah ini dengan api dan cara persembahan dipersembahkan, sambil mencatat kemungkinan nuansa “persembahan makanan” dalam catatan kaki.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi menyatakan arah atau peruntukan persembahan kepada Yahweh; “bagi” alami dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang hadir secara langsung dalam teks Ibrani.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: seperti yang diperintahkan Yahweh kepada Musa
  rationale: Mempertahankan rumusan penutup yang menegaskan kesesuaian tindakan Musa dengan perintah ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna ungkapan kultis לְרֵיחַ נִיחֹחַ
  choice: suatu aroma yang menyenangkan
  alternative: suatu bau yang harum
  rationale: Pilihan ini mempertahankan citraan aroma dan penerimaan ilahi tanpa menghapus ketegangan metaforis atau memberi penjelasan dogmatis tambahan.
- issue: Makna אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan makanan
  rationale: Etimologi dan pemakaian kultis mendukung kaitan dengan api, sedangkan sejumlah konteks dapat memberi nuansa makanan mazbah. Teks utama memakai terjemahan berbasis cara persembahan, dan alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat namun mudah dipahami. “Mazbah” dan “kurban bakaran” dipertahankan sebagai istilah ritual yang ringkas dan dikenal. Subjek implisit pada awal ayat diperjelas sebagai Musa berdasarkan konteks, tanpa mengubah pelaku tindakan.
