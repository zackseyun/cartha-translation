base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/032.yaml
  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: id
  text: Sisa daging dan roti itu harus kamu bakar dalam api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “daging” secara harfiah berarti “daging tubuh” atau “flesh”; di sini kata itu menunjuk pada daging hewan persembahan sebagai makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Apa yang tersisa
  rationale: Partisipel Nifal yang dipakai secara substantival menunjuk pada apa yang masih tersisa; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: בַּבָּשָׂר
  choice: dari daging
  rationale: בָּשָׂר secara harfiah dapat berarti 'daging' atau 'tubuh', tetapi dalam konteks makanan persembahan menunjuk pada daging hewan.
- source_word: וּבַלָּחֶם
  choice: dan roti itu
  rationale: לֶחֶם adalah kata umum untuk roti; kata tunjuk 'itu' secara alami merepresentasikan kejelasan nomina Ibrani dalam konteks ini.
- source_word: בָּאֵשׁ
  choice: dalam api
  rationale: Preposisi ב dapat menyatakan sarana atau lingkungan tindakan; 'dalam api' mempertahankan citra konkret ungkapan Ibrani.
- source_word: תִּשְׂרֹפוּ
  choice: harus kamu bakar
  rationale: Bentuk imperfek orang kedua jamak memiliki daya perintah dalam konteks hukum. 'Harus' menyampaikan kewajiban dengan bahasa Indonesia modern; 'kamu' dapat merujuk kepada kelompok yang disapa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan fokus awal pada sisa daging dan roti serta daya perintah teks hukum.
