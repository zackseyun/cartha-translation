base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Kemudian Yahweh berfirman kepada Musa[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”. Transliterasi lain yang digunakan meliputi “Yehovah” dan “Jehovah”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sehingga “Kemudian” menyampaikan urutan peristiwa. Dalam bahasa Indonesia, “berfirman” merupakan padanan wajar dan bermartabat ketika Allah menjadi subjek verba דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri dan dialihaksarakan “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju dalam tindakan berbicara; “kepada Musa” adalah ungkapan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: ditandai dengan koma setelah verba ujaran
  rationale: Formula infinitif לֵאמֹר memperkenalkan isi firman yang menyusul. Karena kutipan langsung dimulai pada ayat berikutnya, bahasa Indonesia alami dapat menyatakannya melalui tanda baca tanpa menerjemahkannya secara kaku sebagai “dengan mengatakan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani menggunakan Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama itu, sedangkan “TUHAN” menggantinya dengan gelar; catatan kaki memberi tahu pembaca tentang tradisi penerjemahannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Berfirman” dipilih sebagai verba ujaran yang lazim bagi Allah. Formula לֵאמֹר tidak dibuat kaku karena isi perkataan berlanjut pada ayat berikutnya.
