revisions:
- from: Musa menyembelih lembu itu. Ia mengambil darahnya dan dengan jarinya mengoleskannya pada tanduk-tanduk mezbah di sekelilingnya. Demikianlah ia menyucikan mezbah itu.[a] Kemudian ia mencurahkan darah itu ke dasar mezbah dan menguduskannya untuk mengadakan pendamaian bagi mezbah itu.[b]
  to: Musa menyembelih lembu itu. Ia mengambil darahnya dan, dengan jarinya, mengoleskannya pada tanduk-tanduk mezbah di sekelilingnya. Ia menyucikan mezbah itu.[a] Kemudian ia mencurahkan darah itu ke dasar mezbah dan menguduskannya untuk mengadakan pendamaian bagi mezbah itu.[b]
  rationale: Revisi hanya memperjelas fungsi keterangan 'di sekelilingnya', menghilangkan penghubung tambahan yang tidak perlu, dan memperbaiki kejelasan serta keidiomatisan catatan kaki b. Makna ritual dan ambiguitas terukur dari כפר tetap dipertahankan.
