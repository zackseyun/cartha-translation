  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: id
  text: Musa menyembelih lembu itu. Ia mengambil darahnya dan, dengan jarinya, mengoleskannya pada tanduk-tanduk mezbah di sekelilingnya. Ia menyucikan mezbah itu.[a] Kemudian ia mencurahkan darah itu ke dasar mezbah dan menguduskannya untuk mengadakan pendamaian bagi mezbah itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “membersihkan mezbah itu.” Yang dimaksud ialah menyucikannya dari kenajisan secara ritual.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “memurnikannya” atau “mengadakan pendamaian atasnya.” Kata Ibraninya mencakup gagasan pendamaian dan pemurnian melalui ritus persembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Musa menyembelih lembu itu
  rationale: Dalam konteks persembahan, שׁחט menunjuk pada penyembelihan ritual, bukan sekadar pembunuhan. Subjek tersirat dipahami sebagai Musa dari klausa berikutnya, sedangkan objeknya ialah lembu jantan pada ayat sebelumnya.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: tanduk-tanduk mezbah di sekelilingnya
  rationale: Istilah ini menunjuk pada tonjolan berbentuk tanduk pada mezbah; סָבִיב menyatakan bahwa darah dikenakan pada tanduk-tanduk yang berada di berbagai sisinya.
- source_word: בְּאֶצְבָּעוֹ
  choice: dengan jarinya
  rationale: Bentuk tunggal dengan akhiran orang ketiga maskulin menyatakan alat yang dipakai Musa dalam tindakan ritual itu.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: Demikianlah ia menyucikan mezbah itu
  rationale: Bentuk piel dari חטא dalam konteks ritual keimaman berarti membersihkan atau memurnikan dari kenajisan ritual, bukan membuat mezbah berdosa. 'Menyucikan' alami dalam bahasa Indonesia dan mempertahankan fungsi ritualnya.
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: mencurahkan darah itu ke dasar mezbah
  rationale: יצק berarti mencurahkan, sedangkan יסוד dalam terminologi mezbah menunjuk pada bagian dasar atau fondasinya.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: menguduskannya
  rationale: קדשׁ di sini berarti menetapkan mezbah sebagai kudus dan dikhususkan bagi pemakaian sakral.
- source_word: לְכַפֵּר עָלָיו
  choice: untuk mengadakan pendamaian bagi mezbah itu
  rationale: כפר adalah istilah ritual yang mencakup pendamaian, penghapusan, atau pemurnian. Ungkapan Indonesia ini mempertahankan bobot teologis istilah tersebut, sementara catatan kaki menyajikan nuansa ritual alternatif.
theological_decisions:
- issue: Makna חטא dalam konteks pemurnian ritual
  choice: menyucikan mezbah itu
  alternative: membersihkan mezbah itu
  rationale: Mezbah bukan digambarkan sebagai pelaku dosa. Darah berfungsi memurnikannya secara ritual; karena itu terjemahan menghindari pengertian moral yang keliru.
- issue: Makna כפר ketika mezbah menjadi sasaran ritus
  choice: mengadakan pendamaian bagi mezbah itu
  alternative: menghapus kenajisan mezbah itu
  rationale: Ungkapan utama mempertahankan istilah kultis yang luas dan lazim, tanpa menentukan secara sempit mekanisme tindakan itu. Alternatif dalam catatan kaki menjelaskan nuansa pemurnian atau penghapusan yang juga terkandung dalam konteks ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak khidmat. Istilah ritual seperti “mezbah”, “menyucikan”, “menguduskan”, dan “mengadakan pendamaian” dipertahankan karena tepat dan sudah dikenal, sedangkan susunan kalimat dibuat lebih alami bagi pembaca umum.
