  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: id
  text: Kemudian Musa mengambil sebagian dari minyak pengurapan dan sebagian dari darah yang ada di atas mazbah, lalu memercikkannya pada Harun, pada pakaiannya, pada para putranya, dan pada pakaian para putranya yang bersamanya. Demikianlah ia menguduskan Harun, pakaiannya, para putranya, dan pakaian para putranya yang bersamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyucikan.” Dalam konteks ini, tindakan tersebut mengkhususkan untuk pelayanan kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: mengambil sebagian dari minyak ... dan sebagian dari darah
  rationale: Kata kerja berarti “mengambil,” sedangkan dua pemakaian מִן menunjukkan bahwa Musa mengambil sebagian dari kedua bahan tersebut.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak pengurapan
  rationale: Padanan ini alami dalam bahasa Indonesia dan mempertahankan fungsi ritual minyak itu.
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: darah yang ada di atas mazbah
  rationale: Klausa relatif diterjemahkan secara langsung; “mazbah” mempertahankan istilah khusus untuk tempat persembahan korban.
- source_word: וַיַּז
  choice: lalu memercikkannya
  rationale: Bentuk kausatif נזה dalam konteks ritual imam menunjuk pada tindakan memercikkan cairan. Akhiran “-nya” mengacu secara wajar pada bahan yang baru disebutkan.
- source_word: בְּגָדָיו
  choice: pakaiannya
  rationale: “Pakaian” merupakan padanan Indonesia yang alami dan cukup bermartabat tanpa mempersempit makna menjadi pakaian jabatan tertentu.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Bahasa Ibrani secara khusus memakai bentuk jamak maskulin dan konteksnya ialah para putra Harun yang ditahbiskan sebagai imam.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: pakaian anak-anak lelakinya yang bersamanya
  rationale: אִתּוֹ paling wajar menerangkan anak-anak lelaki Harun yang hadir bersamanya, bukan pakaiannya.
- source_word: וַיְקַדֵּשׁ
  choice: Demikianlah ia menguduskan
  rationale: קדשׁ berarti menjadikan atau menetapkan kudus. “Menguduskan” mempertahankan istilah teologis dan hubungan tindakan ritual dengan status kudus tanpa menambahkan gagasan yang tidak dinyatakan.
theological_decisions:
- issue: Makna קדשׁ dalam upacara penetapan imam
  choice: menguduskan
  alternative: menahbiskan; mengkhususkan sebagai kudus
  rationale: Konteksnya memang penetapan untuk pelayanan imam, tetapi kata Ibrani menekankan status kudus. “Menguduskan” menjaga keluasan makna itu, sedangkan catatan kaki menjelaskan nuansa ritualnya.
- issue: Rujukan gender bagi keturunan Harun
  choice: anak-anak lelakinya
  alternative: anak-anaknya; putra-putranya
  rationale: Teks Ibrani merujuk secara khusus kepada laki-laki yang ikut dalam penetapan imam. Pilihan ini jelas bagi pembaca Indonesia modern dan tidak mengaburkan gender referennya.
- issue: Apa saja yang dikuduskan
  choice: Harun, pakaiannya, anak-anak lelakinya, dan pakaian anak-anak lelakinya
  alternative: hanya Harun dan anak-anak lelakinya
  rationale: Penanda objek langsung yang berulang memasukkan baik orang maupun pakaian ke dalam daftar objek tindakan pengudusan; struktur ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mazbah” dipakai sebagai istilah ritual yang ringkas; “pakaian” dipilih daripada “jubah” agar tidak mempersempit arti בֶּגֶד. Pengulangan daftar dipertahankan karena menonjol dalam teks Ibrani.
