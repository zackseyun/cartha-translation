revisions:
- from: Kemudian Musa mengambil sebagian dari minyak pengurapan dan sebagian dari darah yang ada di atas mazbah, lalu memercikkannya pada Harun, pada pakaiannya, pada anak-anak lelakinya, dan pada pakaian anak-anak lelakinya yang bersamanya. Demikianlah ia menguduskan Harun, pakaiannya, anak-anak lelakinya, dan pakaian anak-anak lelakinya yang bersamanya.[a]
  to: Kemudian Musa mengambil sebagian dari minyak pengurapan dan sebagian dari darah yang ada di atas mazbah, lalu memercikkannya pada Harun, pada pakaiannya, pada para putranya, dan pada pakaian para putranya yang bersamanya. Demikianlah ia menguduskan Harun, pakaiannya, para putranya, dan pakaian para putranya yang bersamanya.[a]
  rationale: Revisi hanya mengganti ungkapan yang kurang alami ‘anak-anak lelakinya’ dengan ‘para putranya’ dan merapikan catatan kaki agar berfungsi sebagai alternatif leksikal. Makna, daftar objek, pengulangan, dan ambiguitas yang relevan dalam teks sumber tetap dipertahankan.
