base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: id
  text: Kemudian Musa mengambil minyak urapan dan mengurapi Kemah Suci serta segala sesuatu yang ada di dalamnya, dan menguduskan semuanya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengkhususkan semuanya sebagai kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kemudian Musa mengambil
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “kemudian” menyampaikan hubungan beruntun itu secara alami dalam bahasa Indonesia.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak urapan
  rationale: Frasa konstruksi ini menunjuk pada minyak yang digunakan untuk pengurapan; “minyak urapan” merupakan istilah Indonesia yang ringkas dan lazim.
- source_word: וַיִּמְשַׁח
  choice: mengurapi
  rationale: Kata kerja ini memiliki makna ritual penerapan minyak untuk mengkhususkan sesuatu; “mengurapi” mempertahankan nuansa kultisnya.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks Keluaran–Imamat, istilah ini menunjuk pada bangunan tempat kudus portabel. “Kemah Suci” jelas, wajar, dan mempertahankan rujukan teknis tersebut.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: segala sesuatu yang ada di dalamnya
  rationale: Ungkapan ini mencakup seluruh isi atau perlengkapan Kemah Suci dan diterjemahkan secara dekat sekaligus alami.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: dan menguduskan semuanya
  rationale: Dalam konteks ritual keimaman, קדשׁ berarti menjadikan atau menetapkan sebagai kudus. “Semuanya” dengan jelas merujuk bersama-sama kepada Kemah Suci dan seluruh isinya.
theological_decisions:
- issue: Makna קדשׁ dalam konteks ritual keimaman
  choice: menguduskan
  alternative: mengkhususkan sebagai kudus
  rationale: “Menguduskan” mempertahankan istilah utama dan daya teologis teks, sedangkan catatan kaki menjelaskan nuansa ritualnya tanpa memasukkan tafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Kemah Suci” dipakai sebagai istilah yang mudah dipahami untuk מִשְׁכָּן, dan pengulangan subjek tidak ditambahkan karena rangkaian verba tetap jelas dalam bahasa Indonesia.
