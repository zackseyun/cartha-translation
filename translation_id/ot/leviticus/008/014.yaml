base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: id
  text: Kemudian Musa membawa lembu jantan kurban penghapus dosa itu ke hadapan[a]. Harun dan anak-anaknya meletakkan tangan mereka di atas kepala lembu jantan kurban penghapus dosa itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghadapkan” atau “membawa ke depan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: membawa mendekat
  rationale: Bentuk Hifil dari נגשׁ berarti membawa dekat atau mempersembahkan. Pilihan ini mempertahankan gambaran gerak ritual dalam teks Ibrani; pelakunya dinyatakan sebagai Musa berdasarkan subjek yang berlanjut dari konteks terdekat.
- source_word: פַּר
  choice: lembu jantan
  rationale: Dalam konteks kurban, פַּר menunjuk kepada lembu jantan. Kata Ibrani ini tidak mengharuskan penambahan keterangan usia dalam ayat ini.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam peraturan kurban, חַטָּאת menunjuk kepada kurban yang berkaitan dengan penanganan dosa, bukan sekadar 'dosa'. Pilihan ini merupakan istilah Indonesia yang alami dan tetap membedakan kurban tersebut dari tindakan mempersembahkannya.
- source_word: וַיִּסְמֹךְ ... אֶת יְדֵיהֶם
  choice: meletakkan tangan mereka
  rationale: סמך dalam ritual kurban menggambarkan tindakan menaruh atau menumpukan tangan pada hewan. Terjemahan ini menyatakan tindakan fisiknya tanpa menentukan seberapa kuat tekanannya.
- source_word: עַל רֹאשׁ
  choice: di atas kepala
  rationale: Ungkapan ruang ini diterjemahkan langsung dan alami sesuai adegan ritual.
theological_decisions:
- issue: Makna penumpangan tangan dalam ritual kurban
  choice: Tindakan diterjemahkan secara deskriptif tanpa menjelaskan mekanisme teologisnya.
  alternative: Menafsirkannya secara eksplisit sebagai pemindahan kesalahan, penyatuan diri dengan kurban, atau penetapan hewan sebagai kurban.
  rationale: Ayat ini hanya menceritakan tindakan ritual tersebut dan tidak menerangkan maknanya. Karena itu, terjemahan mempertahankan keterbukaan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama Musa dibuat eksplisit agar rujukan subjek laki-laki tunggal dalam bahasa Ibrani jelas dan alami dalam bahasa Indonesia; identitasnya berasal dari konteks langsung pasal ini. Pengulangan frasa kurban dipertahankan mengikuti teks sumber.
