source:
  edition: WLC
  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: id
  text: Ia memercikkan sebagian dari minyak itu pada mazbah sebanyak tujuh kali, lalu mengurapi mazbah itu beserta segala perkakasnya, juga bejana pembasuhan dan penyangganya, untuk menguduskan semuanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּז
  choice: Ia memercikkan
  rationale: Bentuk Hifil dari נזה menunjuk pada tindakan ritual memercikkan cairan; “memercikkan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: מִמֶּנּוּ
  choice: sebagian dari minyak itu
  rationale: Secara harfiah berarti “darinya”; acuannya adalah minyak urapan dalam konteks ayat sebelumnya. Ungkapan ini membuat acuan pronominal jelas tanpa mengubah tindakan ritualnya.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: “Mazbah” merupakan istilah baku dan ringkas untuk tempat mempersembahkan kurban dalam konteks Kemah Suci.
- source_word: שֶׁבַע פְּעָמִים
  choice: sebanyak tujuh kali
  rationale: Menyampaikan secara langsung jumlah pengulangan tindakan ritual.
- source_word: וַיִּמְשַׁח
  choice: lalu mengurapi
  rationale: משׁח dalam konteks ibadah berarti mengolesi atau mengenai dengan minyak sebagai tindakan pengkhususan; “mengurapi” mempertahankan register ritual.
- source_word: כָּל כֵּלָיו
  choice: segala perkakasnya
  rationale: כְּלִי mencakup berbagai alat atau benda perlengkapan; “perkakas” alami dan cukup luas dalam konteks tempat ibadah.
- source_word: הַכִּיֹּר
  choice: bejana pembasuhan
  rationale: Istilah ini menunjuk pada bejana air untuk pembasuhan di pelataran Kemah Suci. Pilihan ini lebih informatif daripada sekadar “bejana” dan lebih modern daripada istilah tradisional yang arkais.
- source_word: כַּנּוֹ
  choice: penyangganya
  rationale: כֵּן di sini adalah struktur yang menopang bejana; “penyangga” menyatakan fungsi tersebut dengan jelas.
- source_word: לְקַדְּשָׁם
  choice: untuk menguduskan semuanya
  rationale: Bentuk ini menyatakan bahwa benda-benda tersebut dijadikan kudus atau dikhususkan bagi penggunaan suci. “Menguduskan” mempertahankan kaitan leksikal dengan kekudusan tanpa menambahkan doktrin tertentu.
theological_decisions:
- issue: Istilah ritual bagi tindakan dan benda-benda suci
  choice: 'Memakai istilah ritual yang baku tetapi tetap mudah dipahami: “mengurapi” dan “menguduskan”.'
  alternative: Memakai ungkapan penjelas seperti “mengolesinya dengan minyak” dan “mengkhususkannya bagi Allah”.
  rationale: Teks menggambarkan ritus pengudusan Kemah Suci. Istilah yang dipilih mempertahankan bobot kultis dan hubungan leksikalnya tanpa memasukkan pengertian doktrinal yang lebih kemudian.
- issue: Acuan pronomina מִמֶּנּוּ
  choice: Menjelaskan acuannya sebagai “minyak itu”.
  alternative: Mempertahankan bentuk lebih harfiah “darinya”.
  rationale: Konteks langsung menyebut minyak urapan. Menyatakan acuan tersebut menghasilkan bahasa Indonesia yang alami tanpa menyelesaikan ketegangan teologis atau menambahkan unsur baru.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Istilah “mazbah” dipertahankan sebagai kosakata Alkitab yang baku, sedangkan “bejana pembasuhan” dan “penyangga” dipilih agar perlengkapan Kemah Suci mudah dipahami pembaca umum.
