  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: id
  text: Musa melakukan sesuai dengan yang diperintahkan Yahweh kepadanya, lalu umat itu berkumpul[a] di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “umat itu dihimpunkan.” Bentuk kata kerja Ibrani ini dapat menyatakan bahwa umat datang berkumpul atau bahwa mereka dihimpunkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja עשה bermakna luas, ‘melakukan/membuat’. Dalam konteks menaati perintah, ‘melakukan’ paling alami dan tepat.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Menunjukkan bahwa tindakan Musa sesuai dengan perintah Yahweh; ‘seperti yang’ alami dalam bahasa Indonesia.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: צוה menyatakan perintah yang berwenang. Bentuk pasif ini menghasilkan susunan Indonesia yang alami tanpa mengurangi kekuatan perintah ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֹתוֹ
  choice: kepadanya
  rationale: Pronomina ini merujuk kepada Musa sebagai penerima perintah; konstruksi Indonesia ‘diperintahkan ... kepadanya’ menyampaikan relasi sintaksis tersebut secara alami.
- source_word: וַתִּקָּהֵל
  choice: lalu ... berkumpul
  rationale: Bentuk Niphal dari קהל menyatakan bahwa umat datang bersama atau dihimpunkan. ‘Berkumpul’ mempertahankan makna kolektif dengan ungkapan Indonesia yang alami; ‘lalu’ meneruskan urutan narasi waw.
- source_word: הָעֵדָה
  choice: umat itu
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu kelompok. ‘Umat itu’ jelas, modern, dan tidak memberi kesan bahwa hanya sebuah sidang resmi yang dimaksud.
- source_word: אֶל פֶּתַח
  choice: di pintu masuk
  rationale: Walaupun אֶל pada dasarnya menunjukkan arah ‘ke’, bersama tindakan berkumpul dan פתח, bahasa Indonesia alami menyatakan tempat hasil berkumpul dengan ‘di pintu masuk’.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Sebutan tetap bagi kemah suci, yang mempertahankan unsur ‘kemah’ dan fungsi pertemuan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama ilahi YHWH secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Nuansa bentuk Niphal וַתִּקָּהֵל
  choice: umat itu berkumpul
  alternative: umat itu dihimpunkan
  rationale: Bentuk Ibrani dapat diungkapkan secara intransitif atau pasif. Teks utama memakai ungkapan Indonesia yang paling alami, sedangkan kemungkinan pasif dipertahankan dalam catatan kaki tanpa menentukan siapa yang menghimpunkan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Umat itu’ dipilih untuk komunitas Israel, dan ‘Kemah Pertemuan’ diperlakukan sebagai sebutan khusus. Penanda catatan kaki ditempatkan tepat sesudah kata yang mengandung alternatif terjemahan.
