source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: id
  text: Janganlah kalian keluar dari pintu masuk Kemah Pertemuan selama tujuh hari, sampai pada hari ketika masa penahbisan kalian genap, sebab selama tujuh hari ia akan menahbiskan kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia akan memenuhi tangan kalian,” sebuah ungkapan Ibrani untuk menahbiskan atau melantik seseorang ke dalam pelayanan imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: dari pintu masuk
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk. Dalam bahasa Indonesia modern, “pintu masuk” jelas dan alami dalam konteks tempat kudus; waw penghubung tidak perlu diterjemahkan secara kaku pada awal kalimat.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan langsung dan transparan bagi nama tempat kudus ini; huruf kapital menandai sebutan khusus.
- source_word: לֹא תֵצְאוּ
  choice: Janganlah kalian keluar
  rationale: Bentuk negatif ini menyampaikan larangan kepada kelompok Harun dan anak-anaknya. “Janganlah” mempertahankan nada instruktif yang luhur, sedangkan “kalian” memperjelas bentuk jamak Ibrani.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Ungkapan durasi ini paling alami diterjemahkan “selama tujuh hari” dalam bahasa Indonesia.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: sampai pada hari ketika masa penahbisan kalian genap
  rationale: Susunan nominal Ibrani secara harfiah berbicara tentang hari ketika hari-hari penahbisan menjadi penuh. “Masa penahbisan ... genap” mempertahankan gagasan penyelesaian seluruh rangkaian hari dengan bahasa Indonesia yang wajar.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan keluar selama tujuh hari.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: ia akan menahbiskan kalian
  rationale: Secara harfiah ungkapan ini berarti “memenuhi tangan kalian”, tetapi dalam konteks imamat merupakan idiom teknis untuk melantik atau menahbiskan seseorang ke dalam pelayanan imam. Makna idiom diterjemahkan dalam teks utama dan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Idiom penahbisan imam מלא את־יד
  choice: menahbiskan kalian, dengan bentuk harfiah dijelaskan dalam catatan kaki
  alternative: memenuhi tangan kalian
  rationale: Terjemahan utama menyampaikan makna idiom teknis dengan jelas bagi pembaca modern, sementara catatan kaki mempertahankan transparansi terhadap citra khas bahasa Ibrani dan kaitannya dengan istilah penahbisan.
- issue: Identitas subjek tunggal dalam יְמַלֵּא
  choice: ia
  alternative: TUHAN atau Musa
  rationale: Teks Ibrani hanya memakai bentuk verba orang ketiga tunggal maskulin dan tidak menyebut subjek secara eksplisit dalam ayat ini. Kata “ia” mempertahankan ketidakjelasan tersebut tanpa memasukkan identitas yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menampilkan dengan jelas bahwa semua kata ganti dan verba orang kedua dalam bahasa Ibrani berbentuk jamak. Istilah “Kemah Pertemuan” dipertahankan sebagai sebutan khusus yang mudah dipahami.
