source:
  edition: WLC
  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: id
  text: Dari keranjang roti tidak beragi yang ada di hadapan Yahweh, ia mengambil satu roti tidak beragi, satu roti dengan minyak[a], dan satu roti tipis. Ia meletakkan semuanya di atas bagian-bagian berlemak dan paha kanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “satu roti yang dicampur dengan minyak.” Frasa Ibraninya mengaitkan roti itu dengan minyak, tetapi cara penggunaannya tidak dijelaskan secara tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִסַּל הַמַּצּוֹת
  choice: Dari keranjang roti tidak beragi
  rationale: Preposisi מִן menunjukkan sumber, sedangkan הַמַּצּוֹת menunjuk pada aneka roti tidak beragi dalam keranjang ritual itu. Ungkapan ini konkret dan alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: yang ada di hadapan Yahweh
  rationale: Frasa kultis לִפְנֵי menyatakan bahwa keranjang itu ditempatkan dalam hadirat Yahweh; nama perjanjian יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: חַלַּת מַצָּה אַחַת
  choice: satu roti tidak beragi
  rationale: חַלָּה adalah satu unit roti atau kue roti. “Satu roti tidak beragi” jelas dan wajar tanpa menentukan bentuk yang tidak dijelaskan oleh teks.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: satu roti yang dibuat dengan minyak
  rationale: Rangkaian nomina Ibrani menghubungkan roti ini dengan minyak, tetapi tidak menyatakan secara pasti apakah minyak dicampurkan, dioleskan, atau digunakan dengan cara lain. Pilihan ini mempertahankan ketidakpastian tersebut.
- source_word: וְרָקִיק אֶחָד
  choice: dan satu roti tipis
  rationale: רָקִיק menunjuk pada roti pipih yang tipis. “Roti tipis” lebih mudah dipahami pembaca Indonesia daripada istilah serapan atau istilah ritual khusus.
- source_word: וַיָּשֶׂם
  choice: Ia meletakkan semuanya
  rationale: Kata kerja ini berarti menaruh atau meletakkan. “Semuanya” secara alami merujuk pada ketiga jenis roti yang baru disebutkan.
- source_word: הַחֲלָבִים
  choice: bagian-bagian berlemak
  rationale: Dalam konteks kurban, bentuk jamak ini menunjuk pada bagian-bagian lemak tertentu yang dipisahkan untuk ritual, bukan lemak secara umum.
- source_word: שׁוֹק הַיָּמִין
  choice: paha kanan
  rationale: שׁוֹק menunjuk pada bagian tungkai atau paha hewan kurban; “paha kanan” merupakan padanan yang jelas dan lazim dalam konteks ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan struktur kalimat yang mudah dipahami. Pengulangan “ia” menjaga kejelasan tindakan, sedangkan istilah ritual diterjemahkan secara konkret tanpa menambahkan rincian mengenai bentuk roti atau cara penggunaan minyak yang tidak dinyatakan oleh teks.
