  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: id
  text: Ia menaruh semuanya di telapak tangan Harun dan di telapak tangan putra-putranya, lalu mengunjukkan semua itu sebagai persembahan unjukan di hadapan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia menaruh
  rationale: Dalam konteks tindakan ritual ini, נָתַן berarti menaruh atau meletakkan. “Menaruh” menyatakan penempatan secara fisik tanpa menyiratkan pemindahan kepemilikan.
- source_word: אֶת הַכֹּל
  choice: semuanya
  rationale: Frasa ini merujuk kepada seluruh bagian persembahan yang disebutkan pada ayat sebelumnya.
- source_word: עַל כַּפֵּי
  choice: di telapak tangan
  rationale: כַּף menunjuk pada telapak tangan, sedangkan עַל secara dasar berarti “di atas/pada.” Ungkapan “di telapak tangan” alami dalam bahasa Indonesia dan tetap dekat dengan gambaran Ibrani.
- source_word: וְעַל כַּפֵּי בָנָיו
  choice: dan di telapak tangan anak-anaknya
  rationale: Struktur berulang dari teks Ibrani dipertahankan. Dalam konteks ini, “anak-anaknya” mengacu kepada putra-putra Harun yang sedang ditahbiskan.
- source_word: וַיָּנֶף
  choice: lalu mengunjukkan
  rationale: Bentuk Hifil dari נוף merupakan istilah ritual bagi tindakan mengunjukkan persembahan di hadapan Allah.
- source_word: אֹתָם
  choice: semua itu
  rationale: Kata ganti ini merujuk kepada bagian-bagian persembahan yang diletakkan di telapak tangan, bukan kepada Harun dan anak-anaknya. “Semua itu” membuat rujukannya jelas tanpa mengubah makna.
- source_word: תְּנוּפָה
  choice: sebagai persembahan unjukan
  rationale: “Persembahan unjukan” adalah padanan teknis yang mapan untuk persembahan yang disajikan dengan gerakan ritual mengunjukkan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menyatakan bahwa tindakan ritual tersebut dilakukan di hadirat Yahweh; nama ilahi ditransliterasikan secara langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: “Yahweh” mempertahankan nama pribadi ilahi dalam teks sumber dan sesuai dengan kebijakan proyek, tanpa menggantinya dengan gelar.
- issue: Rujukan בָנָיו dalam konteks penahbisan imam
  choice: anak-anaknya
  alternative: putra-putranya
  rationale: Bahasa Indonesia lazim memakai “anak-anaknya” untuk keturunan laki-laki bila konteks telah menjelaskannya. Konteks penahbisan imam menunjukkan bahwa yang dimaksud ialah putra-putra Harun, sehingga tidak terjadi perluasan kepada kelompok lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah ritual “mengunjukkan” dan “persembahan unjukan” dipertahankan karena ketepatan teknisnya, sementara susunan kalimat dibuat alami bagi pembaca umum.
