id: LEV.8.23
reference: Leviticus 8:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁחָ֓ט וַ/יִּקַּ֤ח מֹשֶׁה֙ מִ/דָּמ֔/וֹ וַ/יִּתֵּ֛ן עַל תְּנ֥וּךְ אֹֽזֶן אַהֲרֹ֖ן הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: id
  text: Lalu ia menyembelihnya. Musa mengambil sebagian darahnya dan membubuhkannya pada cuping telinga kanan Harun[a], pada ibu jari tangan kanannya, dan pada ibu jari kaki kanannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ujung telinga kanan Harun.”
    reason: Kata Ibrani תְּנוּךְ dapat dipahami sebagai cuping atau bagian ujung luar telinga.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: ia menyembelihnya
  rationale: Dalam konteks persembahan, verba ini menunjuk pada penyembelihan ritual. Akhiran objek diterjemahkan dengan “-nya”, dengan rujukan kepada domba jantan dari konteks sebelumnya.
- source_word: מִדָּמוֹ
  choice: sebagian darahnya
  rationale: Preposisi מִן di sini menunjukkan bahwa Musa mengambil sejumlah dari darah hewan itu, bukan seluruhnya.
- source_word: תְּנוּךְ אֹזֶן
  choice: cuping telinga
  rationale: Ungkapan ini menunjuk pada bagian luar atau ujung telinga. “Cuping telinga” merupakan padanan yang jelas dan alami, sementara kemungkinan “ujung telinga” dicatat dalam catatan kaki.
- source_word: הַיְמָנִית
  choice: kanan
  rationale: Bentuk ini menerangkan anggota tubuh di sisi kanan; susunan “telinga kanan”, “tangan kanan”, dan “kaki kanan” sesuai dengan idiom bahasa Indonesia.
- source_word: בֹּהֶן יָדוֹ
  choice: ibu jari tangan kanannya
  rationale: בֹּהֶן pada tangan secara khusus berarti ibu jari.
- source_word: בֹּהֶן רַגְלוֹ
  choice: ibu jari kaki kanannya
  rationale: בֹּהֶן pada kaki menunjuk pada jari kaki yang besar; “ibu jari kaki” adalah istilah Indonesia yang alami dan spesifik.
- source_word: וַיִּתֵּן עַל
  choice: membubuhkannya pada
  rationale: Pilihan ini menyampaikan tindakan menaruh atau mengoleskan darah pada bagian tubuh tanpa menambahkan penafsiran simbolis.
theological_decisions:
- issue: Pengolesan darah korban pada bagian-bagian tubuh Harun
  choice: Menggambarkan tindakan ritual itu secara langsung tanpa menjelaskan simbolismenya
  alternative: Menambahkan makna pentahbisan atau simbolisme ketaatan dan pelayanan ke dalam teks utama
  rationale: Ayat ini hanya menarasikan tindakan ritual. Makna teologisnya tidak boleh dimasukkan ke dalam terjemahan jika tidak dinyatakan secara eksplisit oleh teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mempertahankan peralihan dari subjek tersirat pada verba pertama kepada penyebutan eksplisit Musa pada klausa berikutnya. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
