  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: id
  text: Harun dan putra-putranya melakukan segala yang diperintahkan Yahweh melalui Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan tangan Musa,” suatu ungkapan Ibrani yang berarti “melalui Musa” atau “oleh Musa sebagai perantara.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja עשה merangkum ketaatan mereka terhadap seluruh perintah yang telah diberikan; “melakukan” wajar dan tetap dekat dengan bentuk Ibrani.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Harun dan anak-anaknya
  rationale: Nama אַהֲרֹן mengikuti bentuk baku Indonesia “Harun”; בָנָיו dalam konteks keimaman merujuk kepada putra-putranya, sedangkan “anak-anaknya” merupakan ungkapan Indonesia yang alami dan tidak mengubah rujukan kontekstual tersebut.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: segala yang
  rationale: דברים dapat berarti perkataan, perkara, atau hal-hal. Dalam konteks pelaksanaan petunjuk ritual, “segala yang” menyampaikan cakupan menyeluruh secara alami tanpa mempersempitnya hanya menjadi perkataan.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk aktif Ibrani dinyatakan secara pasif dalam klausa relatif Indonesia agar hubungan dengan “segala yang” alami, sementara Yahweh tetap jelas sebagai pelaku perintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Secara harfiah “dengan/perantaraan tangan Musa”; idiom ini menyatakan Musa sebagai perantara penyampaian perintah, yang secara alami diterjemahkan “melalui Musa”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Peran Musa dalam frasa בְּיַד מֹשֶׁה
  choice: melalui Musa
  alternative: dengan perantaraan tangan Musa
  rationale: Pilihan ini mempertahankan gagasan bahwa Yahweh adalah sumber perintah dan Musa adalah perantara penyampaiannya, tanpa menjadikan Musa sumber perintah.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan fokus teks pada ketaatan menyeluruh Harun dan anak-anaknya.
