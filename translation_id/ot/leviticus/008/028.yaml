  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: id
  text: Kemudian Musa mengambil semua itu dari telapak tangan mereka dan membakarnya di atas mazbah, di atas kurban bakaran. Itu semua adalah kurban penahbisan, sebagai aroma yang menyenangkan, suatu persembahan yang dibakar dengan api[a] bagi TUHAN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “suatu persembahan makanan.” Kata Ibrani yang dipakai merupakan istilah teknis untuk persembahan yang dibakar di atas mazbah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... אֹתָם
  choice: mengambil semuanya
  rationale: לקח adalah verba biasa untuk 'mengambil'; אֹתָם menunjuk kepada bagian-bagian kurban pada ayat sebelumnya dan secara alami diterjemahkan 'semuanya' dalam bahasa Indonesia.
- source_word: מֵעַל כַּפֵּיהֶם
  choice: dari telapak tangan mereka
  rationale: כַּף secara konkret berarti telapak tangan; bentuk ini mempertahankan gambaran tindakan ritual Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיַּקְטֵר הַמִּזְבֵּחָה
  choice: membakarnya di atas mazbah
  rationale: Bentuk Hifil קטר dalam konteks kurban berarti membakar sehingga asapnya naik; 'membakarnya' jelas dan ringkas, sedangkan akhiran arah pada הַמִּזְבֵּחָה menyatakan lokasi ritual.
- source_word: עַל הָעֹלָה
  choice: di atas kurban bakaran
  rationale: עַל paling wajar berarti 'di atas', dan עֹלָה adalah istilah teknis bagi kurban bakaran.
- source_word: מִלֻּאִים
  choice: kurban penahbisan
  rationale: Istilah teknis ini menunjuk kepada kurban dalam upacara pelantikan imam, secara harfiah terkait tindakan 'memenuhi tangan'. 'Penahbisan' menyampaikan fungsi ritualnya tanpa memakai ungkapan harfiah yang kabur.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: yang aromanya menyenangkan
  rationale: Ungkapan kurban baku ini menyatakan aroma yang berkenan atau menyenangkan; susunan relatif menghasilkan bahasa Indonesia yang alami tanpa menghapus citra aroma.
- source_word: אִשֶּׁה
  choice: suatu persembahan dengan api
  rationale: אִשֶּׁה adalah istilah kurban yang makna tepat atau etimologinya diperdebatkan, tetapi dalam konteks ini jelas berkaitan dengan persembahan yang dibakar. Terjemahan ini lebih langsung bersumber pada bahasa Ibrani daripada 'persembahan makanan'.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Nama perjanjian יהוה diterjemahkan menurut konvensi Alkitab Indonesia yang mapan sebagai 'TUHAN' dalam huruf kapital.
theological_decisions:
- issue: Makna teknis מִלֻּאִים dalam ritus pelantikan imam
  choice: kurban penahbisan
  alternative: kurban pelantikan; kurban pengudusan
  rationale: Konteks Imamat 8 adalah penetapan Harun dan anak-anaknya sebagai imam. 'Kurban penahbisan' menyatakan fungsi khusus itu, tetapi tidak memasukkan struktur jabatan keagamaan yang berasal dari masa kemudian.
- issue: Makna אִשֶּׁה
  choice: suatu persembahan dengan api
  alternative: suatu persembahan makanan; suatu kurban api-apian
  rationale: Kata ini merupakan label teknis dalam kosakata kurban dan tidak perlu disamakan secara pasti dengan 'makanan'. Terjemahan utama mempertahankan hubungan nyata dengan pembakaran, sedangkan catatan kaki mengakui alternatif yang lazim.
- issue: Rujukan לְרֵיחַ נִיחֹחַ
  choice: yang aromanya menyenangkan
  alternative: sebagai aroma yang menenangkan; sebagai aroma yang berkenan
  rationale: Terjemahan mempertahankan bahasa antropomorfis teks tentang aroma kurban tanpa menjelaskan secara dogmatis bagaimana aroma itu berkenan kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Istilah 'mazbah', 'kurban bakaran', dan 'penahbisan' dipertahankan karena sudah dikenal dalam konteks keimaman dan kurban. Penanda catatan kaki [a] ditempatkan sesudah frasa yang dijelaskannya.
