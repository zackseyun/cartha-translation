  naturalness: Bahasa draft umumnya baku dan jelas. “Umbai hati,” “ginjal,” dan “mazbah” sesuai register Alkitab modern. Revisi kecil membuat hubungan lemak dengan organ-organ dalam lebih alami dan menghindari pengulangan makna antara teks utama dan catatan kaki.
