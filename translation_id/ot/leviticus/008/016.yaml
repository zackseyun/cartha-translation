  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: id
  text: Ia mengambil seluruh lemak yang menutupi organ-organ dalam, umbai hati[a], kedua ginjal beserta lemaknya, lalu Musa membakarnya di atas mazbah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat juga diterjemahkan “bagian tambahan pada hati”; yang dimaksud ialah bagian tertentu dari hati yang dilepaskan ketika kurban disiapkan.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani yang dipakai di sini secara khusus dapat berarti “membuat menjadi asap” atau “mempersembahkan dengan membakarnya hingga berasap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Ia mengambil
  rationale: Bentuk wayyiqtol dari לקח melanjutkan urutan narasi. Kata ganti mempertahankan subjek tersirat sebelum nama Musa disebut secara eksplisit pada klausa berikutnya.
- source_word: כָּל הַחֵלֶב
  choice: seluruh lemak
  rationale: Dalam konteks kurban, חֵלֶב menunjuk pada bagian-bagian berlemak yang dikhususkan untuk dibakar; padanan langsung dan wajar dalam bahasa Indonesia ialah “lemak”.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: yang ada pada isi perut
  rationale: קֶרֶב di sini menunjuk pada bagian-bagian atau organ di dalam rongga perut. “Isi perut” cukup konkret, mudah dipahami, dan sesuai dengan konteks anatomi kurban.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: umbai hati
  rationale: Ungkapan ini menunjuk pada bagian atau tonjolan tertentu dari hati yang dilepaskan dalam penyiapan kurban. “Umbai hati” merupakan padanan ringkas yang tetap mempertahankan kekhususan anatominya.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: kedua ginjal
  rationale: Menyampaikan bentuk dual Ibrani secara alami dan tepat.
- source_word: חֶלְבְּהֶן
  choice: beserta lemaknya
  rationale: Akhiran pronominal mengacu pada kedua ginjal; “beserta lemaknya” menghubungkan bagian lemak itu secara jelas dengan ginjal.
- source_word: וַיַּקְטֵר
  choice: membakar semuanya ... hingga menjadi asap
  rationale: Dalam konteks kurban, קטר lebih khusus daripada sekadar membakar dan mengandung gagasan membuat persembahan itu naik sebagai asap. Objek “semuanya” dipasok secara wajar dari daftar sebelumnya.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran lokatif pada kata “mazbah” menunjukkan tempat atau arah tindakan. “Di atas mazbah” merupakan ungkapan Indonesia yang alami dalam konteks ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Istilah “mazbah” dipertahankan sebagai kosakata Alkitab yang mapan, sedangkan rincian anatomi dibuat cukup jelas bagi pembaca umum. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
