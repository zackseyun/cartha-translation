  rationale: Revisi mempertahankan struktur dan makna teks Ibrani, memperjelas bahwa lemak itu berada pada/menutupi bagian-bagian dalam, serta menempatkan nuansa teknis kata kerja kultis dalam catatan kaki agar teks utama tidak terlalu dijelaskan. Penanda catatan kaki tetap melekat pada “umbai hati” dan tindakan pembakaran di mazbah.
