  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: id
  text: Lalu Musa mengenakan tutup dada itu pada Harun[a], dan memasukkan Urim dan Tumim[b] ke dalam tutup dada itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menaruh tutup dada itu padanya.” Dalam konteks ini, “padanya” merujuk kepada Harun.
    reason: referent_clarification
  - marker: b
    text: Urim dan Tumim adalah istilah ritual Ibrani. Wujud dan cara tepat penggunaannya tidak diketahui dengan pasti.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם עָלָיו
  choice: Lalu Musa memasangkan ... pada Harun
  rationale: Kata kerja שׂוּם berarti menaruh atau menempatkan. Dalam konteks pengenaan pakaian imam, 'memasangkan' terdengar alami dan tetap menyatakan tindakan menempatkan benda pada Harun. Nama Musa dan Harun dijelaskan dari konteks langsung agar rujukan pronominal alami dalam bahasa Indonesia.
- source_word: הַחֹשֶׁן
  choice: tutup dada
  rationale: Istilah חֹשֶׁן menunjuk perlengkapan khusus imam besar yang dikenakan pada dada. 'Tutup dada' menghindari kesan bahwa benda ini adalah zirah, dan dipakai secara konsisten pada kedua kemunculannya.
- source_word: וַיִּתֵּן אֶל
  choice: memasukkan ... ke dalam
  rationale: נָתַן secara luas berarti memberikan, menaruh, atau menempatkan, sedangkan אֶל menyatakan arah. Dalam konteks ini, 'memasukkan ... ke dalam' menyampaikan bahwa benda-benda tersebut ditempatkan di bagian dalam tutup dada.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: Urim dan Tumim
  rationale: Keduanya merupakan istilah ritual Ibrani yang bentuk serta cara penggunaannya tidak diketahui dengan pasti. Transliterasi mempertahankan kekhususan istilah tanpa memaksakan etimologi atau penafsiran tertentu.
theological_decisions:
- issue: Makna dan hakikat Urim dan Tumim
  choice: Mempertahankan nama 'Urim dan Tumim' melalui transliterasi
  alternative: cahaya dan kesempurnaan; undi-undian suci
  rationale: Teks tidak menjelaskan bentuk atau mekanisme penggunaannya. Transliterasi mempertahankan ketidakpastian yang memang ada dan tidak mengimpor penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat lancar untuk pembaca umum, dengan 'lalu' untuk rangkaian tindakan. 'Tutup dada' dipilih daripada 'pelindung dada' agar tidak menyiratkan zirah. Ejaan 'Tumim' mengikuti transliterasi Indonesia yang wajar.
