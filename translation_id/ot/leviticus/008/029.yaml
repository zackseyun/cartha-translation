  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Kemudian Musa mengambil bagian dada domba jantan itu dan mengayunkannya sebagai persembahan unjukan di hadapan Yahweh. Bagian itu menjadi bagian Musa dari domba jantan penahbisan[a], sebagaimana Yahweh telah memerintahkan Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “domba jantan pengudusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kemudian Musa mengambil
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Kemudian” menyampaikan perkembangan tindakan secara alami dalam bahasa Indonesia.
- source_word: הֶחָזֶה
  choice: bagian dada domba jantan itu
  rationale: Dalam konteks kurban, חָזֶה menunjuk pada bagian dada hewan. Penambahan “domba jantan itu” memperjelas rujukan tanpa mengubah makna.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: mengayunkannya sebagai persembahan unjukan
  rationale: Kata kerja נוּף dan nomina serumpunnya תְּנוּפָה sama-sama dipertahankan melalui tindakan “mengayunkan” dan istilah ritual “persembahan unjukan.”
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menyatakan bahwa persembahan dilakukan dalam hadirat Yahweh; “di hadapan” merupakan padanan kultis yang alami dan tepat.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: dari domba jantan penahbisan
  rationale: אֵיל berarti domba jantan, sedangkan מִלֻּאִים dalam konteks pengangkatan imam merujuk pada upacara penahbisan; “pengudusan” tetap mungkin sebagai alternatif.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: Bagian itu menjadi jatah Musa
  rationale: מָנָה adalah bagian atau jatah yang ditetapkan. Susunan ini alami dalam bahasa Indonesia dan menyatakan hak Musa atas bagian kurban tersebut.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: seperti yang diperintahkan Yahweh kepada Musa
  rationale: Padanan ini mempertahankan rumusan kepatuhan terhadap perintah ilahi tanpa menambahkan penafsiran waktu yang tidak perlu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi YHWH. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Makna מִלֻּאִים dalam konteks pelantikan imam
  choice: penahbisan
  alternative: pengudusan
  rationale: Istilah ini secara harfiah terkait dengan tindakan “memenuhi tangan,” tetapi dalam Imamat 8 menunjuk pada pelantikan Harun dan anak-anaknya sebagai imam. “Penahbisan” menyampaikan fungsi tersebut, sementara catatan kaki mempertahankan alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Istilah teknis kurban “persembahan unjukan” dipertahankan karena lazim dan mencerminkan pasangan kata kerja-nomina dalam bahasa Ibrani.
