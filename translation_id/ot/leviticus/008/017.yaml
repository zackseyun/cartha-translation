id: LEV.8.17
reference: Leviticus 8:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת הַ/פָּ֤ר וְ/אֶת עֹר/וֹ֙ וְ/אֶת בְּשָׂר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Namun, lembu jantan itu[a], beserta kulit, daging, dan kotorannya[b], dibakarnya dengan api di luar perkemahan, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “lembu jantan muda.”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah kotoran tubuhnya, yakni tahinya, bukan sampah atau sisa-sisa secara umum.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַפָּר
  choice: lembu jantan itu
  rationale: פַּר menunjuk pada lembu jantan, mungkin lembu jantan muda. Bentuk ini menyampaikan arti dasarnya tanpa menambahkan bahwa hewan itu adalah persembahan penghapus dosa, keterangan yang berasal dari konteks sekitar.
- source_word: עֹרוֹ
  choice: kulit
  rationale: עוֹר berarti kulit atau belulang. Dalam bahasa Indonesia, 'kulit' alami dan cukup jelas untuk bagian luar bangkai hewan; kepemilikan bersama dinyatakan oleh akhiran pada unsur terakhir dalam rangkaian 'kulit, daging, dan kotorannya'.
- source_word: בְּשָׂרוֹ
  choice: daging
  rationale: בָּשָׂר berarti daging. Pilihan ini alami dalam konteks tubuh hewan dan tidak memperluas maknanya menjadi seluruh tubuh.
- source_word: פִּרְשׁוֹ
  choice: kotorannya
  rationale: פֶּרֶשׁ secara khusus menunjuk pada kotoran atau tahi. 'Kotorannya' mempertahankan makna konkret itu dalam ragam bahasa Indonesia yang wajar dan bermartabat; catatan kaki memperjelas kekhususannya.
- source_word: שָׂרַף בָּאֵשׁ
  choice: dibakarnya dengan api
  rationale: Ungkapan ini mempertahankan verba 'membakar' dan penyebutan api dalam bahasa Ibrani. Bentuk '-nya' menyatakan pelaku yang tersirat dari konteks, yaitu Musa, tanpa menambahkan nama itu sebagai subjek eksplisit dalam klausa.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Ini adalah padanan alami dan tepat bagi lokasi di luar tempat Israel berkemah.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: tepat seperti yang diperintahkan
  rationale: כַּאֲשֶׁר menyatakan kesesuaian tindakan dengan perintah. 'Tepat seperti' menyampaikan daya korespondensi itu secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: lembu jantan itu, beserta kulit, daging, dan kotorannya
  rationale: Rangkaian objek dalam bahasa Ibrani disampaikan sebagai daftar kumulatif yang alami dalam bahasa Indonesia. 'Beserta' mempertahankan hubungan antara hewan dan bagian-bagiannya tanpa pengulangan yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri יהוה. 'Yahweh' mempertahankannya sebagai nama, sementara 'TUHAN' menggantinya dengan gelar dan 'Yehuwa' mencerminkan bentuk transliterasi tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan objek yang didahulukan dalam bahasa Ibrani dibuat alami dalam bahasa Indonesia, sedangkan penekanan pada pembakaran dengan api, lokasi di luar perkemahan, dan ketaatan persis kepada perintah tetap dipertahankan.
