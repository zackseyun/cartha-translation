  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: id
  text: Lalu domba jantan itu dipotong-potong, dan Musa membakar kepala, potongan-potongan, serta lemaknya hingga menjadi asap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lemak kerasnya”. Istilah Ibrani menunjuk kepada bagian berlemak dari hewan korban; makna tepatnya tidak pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: domba jantan
  rationale: Dalam konteks persembahan, אַיִל menunjuk kepada domba jantan dewasa.
- source_word: נִתַּח לִנְתָחָיו
  choice: dipotong-potong
  rationale: Ungkapan dengan verba dan nomina serumpun ini menyatakan bahwa hewan itu dipotong menjadi bagian-bagian; bentuk pasif Ibrani dipertahankan.
- source_word: וַיַּקְטֵר
  choice: membakar ... di atas mezbah hingga asapnya naik
  rationale: Bentuk Hifil קטר dalam konteks korban berarti membakar di mezbah sehingga bahan persembahan naik sebagai asap, bukan sekadar membakar biasa.
- source_word: הָרֹאשׁ
  choice: kepala
  rationale: Padanan anatomis langsung dan wajar.
- source_word: הַנְּתָחִים
  choice: potongan-potongan
  rationale: Menggemakan akar kata pada klausa pertama dan menunjuk kepada bagian-bagian hewan yang telah dipotong.
- source_word: הַפָּדֶר
  choice: lemaknya
  rationale: פָּדֶר menunjuk kepada bagian berlemak pada hewan korban; 'lemaknya' menjaga cakupan makna tanpa mempersempitnya secara tidak pasti menjadi ekor berlemak.
