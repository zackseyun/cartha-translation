id: LEV.8.34
reference: Leviticus 8:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: id
  text: Seperti yang telah dilakukan pada hari ini,[a] demikianlah Yahweh memerintahkan agar dilakukan untuk mengadakan pendamaian bagi kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebagaimana dilakukan hari ini, begitulah Yahweh memerintahkan agar hal itu dilakukan untuk mengadakan pendamaian bagi kalian.”'
    reason: Alternatif susunan sintaksis yang mempertahankan hubungan perbandingan dalam bahasa Ibrani.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Seperti ... demikianlah
  rationale: Menyatakan perbandingan antara upacara yang baru dilaksanakan dan perintah Yahweh; pasangan ini alami dalam bahasa Indonesia dan memperjelas hubungan sintaksis tanpa mengubah makna.
- source_word: עָשָׂה
  choice: yang telah dilakukan
  rationale: Walaupun bentuk Ibraninya secara morfologis orang ketiga tunggal maskulin, pelakunya tidak dinyatakan dan yang dimaksud ialah tindakan upacara yang baru dilaksanakan. Bentuk pasif menjaga ketaktertentuan itu.
- source_word: בַּיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Mempertahankan ungkapan waktu yang formal dan menunjuk kepada hari pelaksanaan upacara tersebut.
- source_word: צִוָּה
  choice: memerintahkan
  rationale: Menyampaikan tindakan perintah yang telah diberikan dan tetap menjadi dasar pelaksanaan upacara dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: לַעֲשֹׂת
  choice: agar dilakukan
  rationale: Menggemakan verba sebelumnya dan memakai bentuk pasif supaya tidak menetapkan pelaku yang tidak dinyatakan dalam teks.
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: Mewakili istilah ritual imamat כפר dengan ungkapan Indonesia yang dapat dipahami, tanpa mempersempit mekanismenya menjadi kategori teologis tertentu.
- source_word: עֲלֵיכֶם
  choice: bagi kalian
  rationale: Dengan כפר, preposisi ini menyatakan pihak yang menerima manfaat atau yang atas namanya pendamaian diadakan. 'Kalian' mempertahankan bentuk jamak.
theological_decisions:
- issue: Makna כפר dalam konteks kurban dan pentahbisan
  choice: untuk mengadakan pendamaian bagi kalian
  alternative: untuk mengadakan penebusan bagi kalian; untuk mendamaikan kalian
  rationale: '''Mengadakan pendamaian'' mempertahankan arti ritual yang luas dan tidak memaksakan penjelasan khusus tentang bagaimana pendamaian itu bekerja. ''Penebusan'' dapat mencampuradukkan כפר dengan kosakata pembebasan atau pembayaran tebusan.'
- issue: Hubungan sintaksis antara tindakan hari itu dan perintah Yahweh
  choice: Seperti yang telah dilakukan pada hari ini, demikianlah Yahweh memerintahkan agar dilakukan
  alternative: Apa yang dilakukan hari ini telah diperintahkan Yahweh untuk dilakukan
  rationale: Susunan pilihan mempertahankan pola perbandingan כַּאֲשֶׁר serta ambiguitas ringan dalam teks mengenai lingkup tepat dari tindakan yang diperintahkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kalian' dipakai untuk menyatakan orang kedua jamak secara jelas. Istilah ritual dijaga tetap dapat dipahami tanpa memasukkan kekhasan denominasi.
