source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: id
  text: Kamu harus tetap berada di pintu masuk Kemah Pertemuan siang dan malam selama tujuh hari dan menjalankan kewajiban yang diberikan Yahweh, supaya kamu tidak mati.[a] Sebab, demikianlah aku diperintahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “dan kamu tidak akan mati”; atau, “supaya kamu jangan mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֶתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: פֶתַח menunjuk pada bukaan atau pintu masuk, sedangkan אֹהֶל מוֹעֵד adalah sebutan baku bagi tempat kudus tersebut. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna lokatifnya.
- source_word: תֵּשְׁבוּ
  choice: kamu harus tinggal
  rationale: Dalam konteks ini ישב bukan sekadar tindakan duduk, melainkan tetap berada di suatu tempat selama waktu yang ditentukan. 'Tinggal' menyampaikan tuntutan itu secara wajar.
- source_word: יוֹמָם וָ/לַיְלָה שִׁבְעַת יָמִים
  choice: siang dan malam selama tujuh hari
  rationale: '''Siang dan malam'' mempertahankan merisme yang menyatakan keberadaan terus-menerus, dan ''selama'' memperjelas frasa durasi dalam bahasa Indonesia.'
- source_word: וּ/שְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: dan menjalankan tugas yang ditetapkan Yahweh
  rationale: Gabungan שמר dan משמרת mengacu pada menaati atau melaksanakan tugas yang diwajibkan. Terjemahan ini menyampaikan register ritual tanpa frasa harfiah yang kaku, sekaligus membiarkan Yahweh sebagai sumber ketetapan tugas tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton dialihaksarakan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וְ/לֹא תָמֻתוּ
  choice: supaya kamu tidak mati
  rationale: Dalam rangkaian perintah ini, klausa tersebut secara wajar menyatakan akibat yang dihindari melalui ketaatan. Kemungkinan pembacaan koordinatif tetap dicatat dalam catatan kaki.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: Sebab, demikianlah aku diperintahkan
  rationale: Bentuk pasif mempertahankan pernyataan Musa bahwa ia sendiri telah menerima perintah itu, sedangkan כִּי memperkenalkan alasannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan fungsi nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Daya klausa peringatan kematian וְלֹא תָמֻתוּ
  choice: supaya kamu tidak mati
  alternative: dan kamu tidak akan mati; agar jangan kamu mati
  rationale: Rangkaian waw dengan bentuk tak sempurna sesudah perintah dapat menyampaikan akibat atau tujuan negatif. Teks utama mengungkapkan kaitannya dengan ketaatan, sedangkan catatan kaki mempertahankan kemungkinan koordinatif dan nuansa peringatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak pada kata ganti Ibrani tidak dapat dibedakan dalam bentuk 'kamu' bahasa Indonesia, tetapi konteks tetap menunjukkan bahwa perintah ditujukan kepada kelompok imam.
