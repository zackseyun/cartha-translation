  source_fidelity: Terjemahan secara tepat menyampaikan וַיֹּאמֶר sebagai kelanjutan naratif, מֹשֶׁה sebagai “Musa,” אֶל־הָעֵדָה sebagai “kepada umat itu,” dan זֶה הַדָּבָר אֲשֶׁר sebagai “Inilah yang.” “Diperintahkan Yahweh untuk dilakukan” merepresentasikan perintah yang telah diberikan dan mempertahankan nuansa impersonal yang wajar bagi לַעֲשׂוֹת dalam konteks ini, tanpa menambahkan pelaku.
