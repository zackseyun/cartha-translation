id: LEV.8.5
reference: Leviticus 8:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: id
  text: Lalu Musa berkata kepada umat itu, “Inilah yang diperintahkan Yahweh untuk dilakukan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “untuk melakukan.” Dalam konteks ini, bentuk tersebut dapat dipahami secara impersonal sebagai “untuk dilakukan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan rangkaian narasi; “lalu” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: הָעֵדָה
  choice: umat itu
  rationale: עֵדָה menunjuk kepada komunitas Israel yang sedang dihimpunkan. “Umat itu” alami dalam konteks ini dan mempertahankan sifat kolektifnya.
- source_word: זֶה הַדָּבָר אֲשֶׁר
  choice: Inilah yang
  rationale: Ungkapan ini menyampaikan fungsi konstruksi demonstratif dan relatif secara alami; terjemahan sangat harfiah “Inilah hal yang” terasa kaku dalam bahasa Indonesia.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk pasif Indonesia menghasilkan susunan yang alami dengan “yang” dan tetap menyatakan bahwa perintah telah diberikan sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
- source_word: לַעֲשׂוֹת
  choice: untuk dilakukan
  rationale: Infinitif Ibrani berbentuk aktif, tetapi dalam konteks ini objek yang diperintahkan menjadi pokok ungkapan sehingga makna impersonal-pasif paling alami dalam bahasa Indonesia; kemungkinan bentuk aktif dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung; “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan sebuah gelar.
- issue: Pelaku tersirat dalam לַעֲשׂוֹת
  choice: untuk dilakukan
  alternative: untuk dilakukan oleh kita / untuk kita lakukan
  rationale: Teks Ibrani tidak menyebut pelaku infinitif secara eksplisit. Terjemahan impersonal mempertahankan keterbukaan itu dan tidak menambahkan subjek tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan alur naratif yang alami. “Umat itu” dipilih untuk komunitas Israel yang sedang berkumpul; kalimat tidak menambahkan pelaku yang tidak dinyatakan dalam teks Ibrani.
