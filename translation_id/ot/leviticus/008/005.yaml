  terminology: “Musa” adalah bentuk nama baku Indonesia, dan “Yahweh” secara konsisten mempertahankan Tetragramaton sebagai nama ilahi. Catatan kaki secara tepat menjelaskan bahwa infinitif Ibrani secara formal aktif (“untuk melakukan”), sementara terjemahan utama memakai bentuk impersonal yang idiomatis.
