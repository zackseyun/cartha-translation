base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: id
  text: Kemudian Musa menghadapkan domba jantan untuk kurban bakaran itu,[a] lalu Harun dan anak-anaknya menumpangkan tangan mereka[b] ke atas kepala domba jantan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa mendekat” atau “membawa maju.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini juga dapat diterjemahkan “meletakkan” atau “menekan” tangan mereka; yang dimaksud ialah tindakan ritual atas hewan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Kemudian Musa membawa mendekat
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau mengajukan. Nama Musa dinyatakan untuk memperjelas rujukan pronomina dari konteks langsung tanpa mengubah pelaku tindakan.
- source_word: אֵיל הָעֹלָה
  choice: domba jantan untuk kurban bakaran itu
  rationale: אֵיל menunjuk pada domba jantan, sedangkan עֹלָה adalah istilah kurban yang seluruhnya dibakar. Kata 'untuk' secara alami menyatakan bahwa domba itu diperuntukkan bagi kurban tersebut.
- source_word: וַיִּסְמְכוּ
  choice: menumpangkan
  rationale: Dalam konteks kurban, סמך menunjuk pada tindakan ritual meletakkan atau menekankan tangan pada hewan. 'Menumpangkan tangan' jelas dan lazim dalam bahasa Indonesia keagamaan tanpa menjelaskan makna teologis yang tidak dinyatakan ayat ini.
- source_word: יְדֵיהֶם
  choice: tangan mereka
  rationale: Bentuk jamak dalam bahasa Ibrani dipertahankan.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: di atas kepala domba jantan itu
  rationale: Terjemahan langsung dan alami dari frasa preposisional tersebut; bentuk definit dipertahankan dengan 'itu'.
theological_decisions:
- issue: Makna tindakan ritual penumpangan tangan pada hewan kurban
  choice: menumpangkan tangan mereka di atas kepala domba jantan itu
  alternative: menekankan tangan mereka pada kepala domba jantan itu
  rationale: Terjemahan menyatakan tindakan ritualnya saja dan tidak menambahkan gagasan pemindahan kesalahan, penggantian, atau identifikasi karena ayat ini sendiri tidak menjelaskan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'kurban bakaran' dipilih sebagai sebutan yang mudah dipahami untuk עֹלָה, sedangkan susunan kalimat mengikuti alur tindakan dalam teks Ibrani.
