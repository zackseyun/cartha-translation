id: LEV.8.9
reference: Leviticus 8:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Musa mengenakan serban pada kepala Harun. Pada bagian depan serban itu ia memasang lempeng emas, yaitu mahkota kudus[a], tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jamang kudus.”'
    reason: Alternatif leksikal untuk נֵזֶר הַקֹּדֶשׁ; “jamang” lebih khusus menunjuk perhiasan atau ikat kepala kebesaran, tetapi kurang umum daripada “mahkota”.
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: serban
  rationale: Kata ini menunjuk pada penutup kepala khas imam. “Serban” merupakan padanan bahasa Indonesia yang jelas, alami, dan sesuai dengan konteks pakaian keimaman.
- source_word: אֶל מוּל פָּנָיו
  choice: pada bagian depan
  rationale: Ungkapan ini menunjukkan letak lempeng pada sisi serban yang menghadap ke depan, bukan sekadar berada di depan Harun.
- source_word: צִיץ
  choice: lempeng emas
  rationale: Dalam konteks pakaian imam, kata ini menunjuk pada hiasan emas yang dipasang pada serban. Walaupun secara umum dapat berarti bunga atau kembang, bentuk dan fungsinya di sini mendukung padanan “lempeng”.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: mahkota kudus
  rationale: Frasa aposisional ini mengidentifikasi lempeng emas tersebut sebagai lambang kudus dalam penahbisan imam. Padanan ini dekat dengan bentuk Ibrani dan mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: mengenakan ... memasang
  rationale: 'Kata kerja Ibrani yang sama diterjemahkan menurut objek dan tindakannya: serban dikenakan pada kepala, sedangkan lempeng dipasang pada serban.'
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: “Tepat seperti” menyampaikan penekanan pada kesesuaian tindakan Musa dengan perintah ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah. Bentuk “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan נֵזֶר הַקֹּדֶשׁ dengan lempeng emas
  choice: yaitu mahkota kudus
  alternative: jamang kudus; mahkota kekudusan
  rationale: Frasa ini dipahami sebagai keterangan aposisional bagi lempeng emas. Terjemahan mempertahankan identifikasi itu tanpa menentukan lebih jauh bentuk fisik bendanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama Musa dan Harun dinyatakan untuk memperjelas rujukan pronomina Ibrani tanpa mengubah pelaku atau penerima tindakan. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
