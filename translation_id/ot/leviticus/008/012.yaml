  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: id
  text: Kemudian Musa menuangkan sebagian minyak urapan ke atas kepala Harun dan mengurapinya untuk menguduskannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: menuangkan
  rationale: Verba יצק menyatakan tindakan menuangkan cairan; bentuk aktif ini alami dalam bahasa Indonesia dan sesuai dengan rangkaian tindakan Musa dalam konteks.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: sebagian minyak urapan
  rationale: Preposisi מִן di sini paling wajar dipahami secara partitif, yaitu sejumlah dari minyak itu. 'Minyak urapan' merupakan padanan Indonesia yang lazim dan jelas bagi שֶׁמֶן הַמִּשְׁחָה.
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: ke atas kepala Harun
  rationale: Dengan verba 'menuangkan', frasa 'ke atas kepala' secara alami menyatakan arah sekaligus tempat minyak dicurahkan.
- source_word: וַיִּמְשַׁח
  choice: mengurapinya
  rationale: '''Mengurapi'' mempertahankan makna ritual khas משׁח; sufiks objek orang ketiga tunggal dinyatakan secara alami dengan ''-nya'', yang merujuk kepada Harun.'
- source_word: לְקַדְּשׁוֹ
  choice: untuk menguduskannya
  rationale: Dalam konteks penahbisan imam, קדשׁ berarti menjadikan atau menetapkan seseorang kudus, yakni dikhususkan bagi pelayanan suci. 'Menguduskan' mempertahankan hubungan leksikal dan teologis dengan konsep kekudusan dalam Imamat.
- source_word: וַ
  choice: Kemudian
  rationale: Waw konsekutif melanjutkan urutan tindakan ritual; 'Kemudian' menyampaikan perkembangan narasi secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan קדשׁ dalam konteks pelantikan imam
  choice: untuk menguduskannya
  alternative: untuk menahbiskannya; untuk mengkhususkannya
  rationale: '''Menguduskan'' mempertahankan gagasan dasar bahwa Harun dijadikan atau ditetapkan kudus bagi pelayanan sakral. ''Menahbiskan'' lebih khusus pada upacara jabatan dan dapat mempersempit makna, sedangkan ''mengkhususkan'' lebih mudah dipahami tetapi melemahkan unsur kekudusan yang eksplisit.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama pelaku 'Musa' dinyatakan untuk menghindari rujukan pronominal yang kabur dalam ayat yang berdiri sendiri, berdasarkan konteks langsung. Struktur kalimat tetap ringkas dan mempertahankan urutan dua tindakan dalam teks Ibrani.
