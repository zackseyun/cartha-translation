  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל הָ/עֵדָ֖ה הַקְהֵ֑ל אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: id
  text: dan kumpulkanlah seluruh umat itu di pintu masuk Kemah Pertemuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kumpulkanlah seluruh jemaah itu.” Kata Ibrani עֵדָה dapat diterjemahkan “umat,” “jemaah,” atau “himpunan,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: dan
  rationale: וְ menghubungkan perintah ini dengan perintah sebelumnya, sedangkan אֵת adalah penanda objek langsung yang tidak perlu diterjemahkan dalam bahasa Indonesia.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat itu
  rationale: כָּל menyatakan keseluruhan, dan עֵדָה menunjuk pada komunitas Israel secara kolektif. 'Umat' alami dan bermartabat dalam konteks ini, sementara 'itu' mencerminkan ketakrifan bentuk Ibrani.
- source_word: הַקְהֵל
  choice: kumpulkanlah
  rationale: Bentuk imperatif Hifil dari קהל berarti menyebabkan orang berkumpul. 'Kumpulkanlah' merupakan perintah yang jelas dan wajar dalam bahasa Indonesia modern.
- source_word: אֶל פֶּתַח
  choice: di pintu masuk
  rationale: Walaupun אֶל lazimnya berarti 'ke', dalam konstruksi ini lokasi berkumpul paling alami dinyatakan dengan 'di pintu masuk' dalam bahasa Indonesia.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Ungkapan baku ini mempertahankan gambaran kemah sebagai tempat pertemuan yang ditetapkan; huruf kapital menandai sebutan khusus bagi tempat kudus tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel imperatif -lah mempertahankan nada perintah tanpa terdengar kasar. Istilah 'umat' dipilih agar mudah dipahami sekaligus mempertahankan makna korporat komunitas Israel.
