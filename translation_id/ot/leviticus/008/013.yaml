  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Kemudian Musa membawa anak-anak Harun mendekat[a], memakaikan baju-baju panjang pada mereka, mengikatkan ikat pinggang pada mereka[b], dan memasangkan penutup kepala pada mereka, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menghadapkan anak-anak Harun.” Kata Ibrani ini dapat berarti membawa mendekat atau, dalam konteks ritual, menghadapkan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, “mengikatkan ikat pinggang pada mereka.” Kata “ikat pinggang” berbentuk tunggal dalam bahasa Ibrani, tetapi dipahami secara distributif: setiap orang mengenakan ikat pinggangnya sendiri.'
    reason: distributive_singular
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: menyuruh ... mendekat
  rationale: Bentuk Hifil dari קרב berarti membawa atau membuat seseorang mendekat. Dalam bahasa Indonesia, 'menyuruh ... mendekat' menyampaikan tindakan kausatif dengan wajar sekaligus mempertahankan nuansa ritual; kemungkinan 'menghadapkan' dicatat dalam catatan kaki.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Ungkapan konstruksi ini secara langsung merujuk kepada putra-putra Harun; konteks imamat membuat rujukan laki-lakinya jelas tanpa perlu memakai bentuk yang lebih kaku.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: mengenakan baju-baju panjang kepada mereka
  rationale: Hifil לבשׁ berarti mengenakan pakaian kepada orang lain, sedangkan כֻּתֹּנֶת adalah pakaian dasar panjang seperti tunik. 'Baju panjang' lebih mudah dipahami pembaca Indonesia daripada serapan 'tunik' dan tidak menyiratkan jubah luar.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: melilitkan ikat pinggang pada mereka
  rationale: 'חגר menggambarkan tindakan memasang atau melilitkan pengikat pada pinggang, dan אַבְנֵט adalah ikat pinggang kain untuk pakaian imam. Nomina Ibrani berbentuk tunggal tetapi dipahami secara distributif: masing-masing anak Harun memakai satu.'
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: memasangkan penutup kepala pada mereka
  rationale: חבשׁ menyatakan pemasangan atau pengikatan penutup kepala. מִגְבָּעוֹת adalah penutup kepala para imam biasa, berbeda dari penutup kepala Harun; 'penutup kepala' akurat tanpa memaksakan bentuk fisik yang tidak pasti.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: Formula ini menekankan kesesuaian tindakan Musa dengan perintah ilahi. 'Tepat seperti' mempertahankan penekanan כַּאֲשֶׁר, dan nama ilahi ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar, tanpa menambahkan tafsiran teologis.
- issue: Sifat tindakan וַיַּקְרֵב dalam konteks pentahbisan
  choice: menyuruh anak-anak Harun mendekat
  alternative: menghadapkan anak-anak Harun
  rationale: Bentuk kausatif dan konteks ritual memungkinkan nuansa membawa mendekat maupun menghadapkan untuk penahbisan. Teks utama mempertahankan gagasan mendekat, sedangkan alternatif ritual dicatat agar ambiguitas leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan struktur naratif yang jelas. Istilah pakaian dipilih agar mudah dipahami pembaca umum, sambil mempertahankan perbedaan antara pakaian panjang, ikat pinggang kain, dan penutup kepala imam.
