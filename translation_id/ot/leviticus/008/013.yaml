  naturalness: “Mengenakan baju-baju panjang kepada mereka” kurang alami dalam bahasa Indonesia modern; “memakaikan ... pada mereka” lebih idiomatis. “Mengikatkan ikat pinggang pada mereka” juga lebih langsung menyatakan tindakan mengenakan ikat pinggang daripada “melilitkan.”
  terminology: “Baju-baju panjang” merupakan padanan yang dapat dipahami untuk כֻּתֳּנֹת tanpa menyamakan pakaian itu dengan jubah luar. “Ikat pinggang” dan “penutup kepala” mempertahankan istilah umum yang tidak memaksakan rincian bentuk. “Yahweh” sesuai dengan kebijakan nama ilahi proyek.
