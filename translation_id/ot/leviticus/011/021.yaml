translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang jelas dan bermartabat. Istilah umum dipakai agar dapat dipahami pembaca biasa, sambil mempertahankan gambaran kuno “keempat kakinya” dan ketegangan varian teks Ibrani melalui catatan kaki.
