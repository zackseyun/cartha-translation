  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: id
  text: 'Namun, inilah yang boleh kamu makan dari segala makhluk kecil bersayap yang berkerumun, yang berjalan dengan empat kaki: yang mempunyai[a] kaki khusus untuk melompat[b] di atas kaki mereka, untuk melompat dengan kaki-kaki itu di tanah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani yang tertulis secara harfiah berbunyi “yang tidak mempunyai kaki”; bacaan tradisional yang dipahami berdasarkan konteks dan versi-versi kuno ialah “yang mempunyai kaki”.
    reason: textual_variant
  - marker: b
    text: Atau “kaki yang bersendi”; kata Ibrani ini menunjuk pada kaki belakang khusus yang digunakan untuk melompat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pengecualian terhadap larangan pada ayat sebelumnya dengan penghubung pertentangan yang wajar dalam bahasa Indonesia modern.
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: inilah yang boleh kamu makan
  rationale: Bentuk tunggal memperkenalkan golongan makhluk yang diizinkan; ungkapan ini menyampaikan fungsi permisif bentuk verbal dalam konteks hukum.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: dari antara segala binatang kecil bersayap yang berkerumun
  rationale: שֶׁרֶץ menunjuk pada makhluk kecil yang bergerombol atau berkerumun, sedangkan הָעוֹף menggolongkannya sebagai makhluk bersayap; pilihan ini tidak mempersempitnya menjadi burung.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: berjalan dengan keempat kakinya
  rationale: Mempertahankan penggambaran sumber tentang gerak dengan empat anggota gerak, tanpa mencoba menyelaraskannya dengan klasifikasi zoologis modern.
- source_word: אֲשֶׁר לוֹ כְרָעַיִם
  choice: yang mempunyai kaki pelompat
  rationale: Mengikuti bacaan tradisional לוֹ yang didukung konteks dan versi-versi kuno. כְרָעַיִם dalam konteks ini ialah kaki khusus yang dipakai untuk melompat.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: di atas kaki-kakinya
  rationale: Mempertahankan gambaran anatomis sumber bahwa kaki khusus itu berada di atas kaki-kaki biasa.
- source_word: לְנַתֵּר בָּהֵן עַל הָאָרֶץ
  choice: untuk melompat di tanah
  rationale: Menyatakan tujuan kaki khusus tersebut dalam bahasa Indonesia yang alami; alatnya sudah jelas dari frasa 'kaki pelompat'.
