base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: id
  text: 'Burung-burung berikut ini harus kamu anggap menjijikkan; semuanya tidak boleh dimakan; semuanya menjijikkan: elang[a], nasar berjanggut[b], dan hering hitam[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi burung ini tidak pasti. Istilah Ibrani yang diterjemahkan “elang” dapat menunjuk secara lebih luas pada burung pemangsa besar, termasuk sejenis nasar.
    reason: lexical_alternative
  - marker: b
    text: Identifikasi burung ini tidak pasti. Istilah Ibrani ini sering dihubungkan dengan nasar berjanggut (bearded vulture atau lammergeier), tetapi juga diterjemahkan secara lebih umum sebagai “nasar.”
    reason: lexical_alternative
  - marker: c
    text: Identifikasi burung ini tidak pasti. Terjemahan lain mencakup “elang laut”; ada pula yang mengusulkan jenis elang atau nasar.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: harus kamu anggap menjijikkan
  rationale: Bentuk Piel menyatakan bahwa hewan-hewan itu harus dipandang dan diperlakukan sebagai sesuatu yang menjijikkan dalam konteks aturan makanan, bukan sekadar dibenci secara emosional.
- source_word: מִן הָעוֹף
  choice: Burung-burung berikut
  rationale: Frasa partitif ini menunjuk pada beberapa jenis dari antara kelompok burung; susunan ini alami dalam bahasa Indonesia dan mempertahankan fungsi pemilahannya.
- source_word: לֹא יֵאָכְלוּ
  choice: tidak boleh dimakan
  rationale: Bentuk pasif ini menyampaikan larangan dengan jelas dan alami dalam bahasa Indonesia modern.
- source_word: שֶׁקֶץ
  choice: menjijikkan
  rationale: Pilihan ini mempertahankan daya evaluatif istilah Ibrani dalam hukum makanan tanpa mereduksinya menjadi sekadar 'najis'.
- source_word: הַנֶּשֶׁר
  choice: burung nasar
  rationale: נֶשֶׁר kemungkinan menunjuk pada burung pemangsa besar, terutama nasar; identifikasi zoologisnya tidak sepenuhnya pasti dan dijelaskan dalam catatan kaki.
- source_word: הַפֶּרֶס
  choice: burung pemakan tulang
  rationale: Nama ini berkaitan dengan akar yang berarti mematahkan dan lazim dihubungkan dengan bearded vulture/lammergeier, burung yang menjatuhkan tulang untuk memecahkannya. Sebutan deskriptif menghindari istilah asing yang kurang dikenal.
- source_word: הָעָזְנִיָּה
  choice: burung hering hitam
  rationale: Ini merupakan salah satu identifikasi modern yang mungkin, tetapi ketidakpastian zoologisnya tetap dinyatakan dalam catatan kaki.
theological_decisions:
- issue: Nuansa שֶׁקֶץ dalam hukum makanan
  choice: menjijikkan
  alternative: najis / kekejian
  rationale: Ayat ini memakai שֶׁקֶץ, bukan istilah umum טָמֵא untuk 'najis'. Karena itu, terjemahan mempertahankan gagasan sesuatu yang dianggap menjijikkan atau tabu dan tidak menyamakan kedua istilah tersebut.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. Bentuk tunggal 'kamu' mengikuti sapaan Ibrani, sementara pengulangan 'menjijikkan' mempertahankan penegasan teks sumber. Nama burung dibuat cukup komunikatif, dan ketidakpastian identifikasinya tidak disembunyikan.
