  text: every raven according to its kind,[a]
translation:
  language: id
  text: setiap burung gagak menurut jenisnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap jenis burung gagak.” Istilah Ibraninya mungkin merujuk secara luas kepada keluarga gagak, termasuk gagak besar dan gagak biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Partikel ini menandai objek langsung dan tidak memiliki padanan tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam frasa benda pada konteks daftar.
- source_word: כָּל
  choice: setiap
  rationale: Dengan nomina tunggal kolektif dalam daftar burung yang dilarang, kata ini bersifat distributif dan secara alami diterjemahkan “setiap”.
- source_word: עֹרֵב
  choice: burung gagak
  rationale: Istilah Ibrani ini lazim menunjuk gagak besar (raven), tetapi dapat mencakup keluarga gagak secara lebih luas. “Burung gagak” merupakan sebutan Indonesia yang alami tanpa memaksakan ketepatan spesies modern.
- source_word: לְמִינוֹ
  choice: menurut jenisnya
  rationale: Ungkapan klasifikasi ini mempertahankan makna pengelompokan dalam teks imamat tanpa memasukkan ketepatan taksonomi biologi modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata “burung” ditambahkan untuk memperjelas bahwa yang dimaksud ialah hewan, sedangkan rumusan “menurut jenisnya” mempertahankan formula klasifikasi Ibrani.
