base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: id
  text: Jika salah satu hewan ternak yang boleh kamu makan mati[a], orang yang menyentuh bangkainya menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang bagimu untuk makanan.” Frasa Ibrani ini menunjuk pada hewan yang diizinkan untuk dimakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Membuka kasus bersyarat yang masih terhubung dengan peraturan sebelumnya; dalam bahasa Indonesia, hubungan itu tersampaikan secara alami tanpa harus memakai "dan".
- source_word: יָמוּת
  choice: mati
  rationale: Bentuk imperfek dalam klausa bersyarat paling wajar diterjemahkan dengan bentuk umum "mati".
- source_word: מִן הַבְּהֵמָה
  choice: seekor dari antara hewan ternak
  rationale: Menampilkan makna partitif מִן dan arti בְּהֵמָה sebagai hewan ternak dalam konteks ini.
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: yang boleh kamu makan
  rationale: Mengungkapkan secara alami bahwa hewan itu termasuk golongan yang diizinkan sebagai makanan, tanpa mengartikannya sebagai tindakan makan yang sedang berlangsung.
- source_word: הַנֹּגֵעַ
  choice: orang yang menyentuh
  rationale: Menerjemahkan partisipel substantival sebagai orang yang melakukan tindakan tersebut.
- source_word: בְּנִבְלָתָהּ
  choice: bangkainya
  rationale: נְבֵלָה menunjuk pada tubuh hewan yang telah mati; "bangkai" merupakan padanan Indonesia yang ringkas dan tepat.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: Bentuk verba menyatakan masuk ke dalam keadaan najis secara ritual; "menjadi najis" mempertahankan nuansa perubahan keadaan.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Merupakan rumusan waktu yang alami dan bermartabat dalam bahasa Indonesia untuk batas kenajisan ritual.
theological_decisions:
- issue: Makna kenajisan
  choice: najis
  alternative: cemar
  rationale: Istilah "najis" mempertahankan kategori ritual dalam hukum Imamat dan tidak menyamakannya dengan dosa moral atau sekadar kotor secara fisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Bentuk tunggal "kamu" mencerminkan sufiks orang kedua jamak Ibrani secara kolektif dalam sapaan kepada umat; ungkapan "sampai petang" mempertahankan corak hukum ritual yang khidmat.
