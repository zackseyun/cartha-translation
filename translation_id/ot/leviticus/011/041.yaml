  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: id
  text: Dan setiap makhluk yang merayap di atas tanah[a] adalah sesuatu yang menjijikkan[b]; itu tidak boleh dimakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk yang berkeriapan”. Istilah Ibrani ini mencakup secara luas makhluk-makhluk yang bergerak atau merayap dekat permukaan tanah.
    reason: lexical_alternative
  - marker: b
    text: Atau “suatu kekejian”. Di sini istilah itu menunjuk pada sesuatu yang menjijikkan secara ritual sebagai makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Dan setiap
  rationale: Menjaga fungsi penghubung וְ dengan ketentuan makanan sebelumnya dan cakupan menyeluruh כָּל.
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: binatang kecil yang bergerak berkerumun
  rationale: שֶׁרֶץ menunjuk secara luas pada makhluk kecil yang berkerumun atau bergerak dekat tanah; frasa ini juga mempertahankan pengulangan gagasan dari nomina dan partisip Ibrani tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: עַל הָ/אָ֑רֶץ
  choice: di atas tanah
  rationale: Dalam konteks penggolongan makhluk hidup di pasal ini, אָרֶץ menunjuk ranah darat; 'tanah' lebih wajar dalam bahasa Indonesia untuk gerak makhluk kecil daripada 'bumi'.
- source_word: שֶׁ֥קֶץ
  choice: sesuatu yang menjijikkan
  rationale: Menyampaikan bahwa makhluk itu dipandang menjijikkan dan terlarang sebagai makanan dalam konteks ritual, tanpa otomatis memberinya penilaian moral umum.
- source_word: ה֖וּא
  choice: adalah
  rationale: Mewakili klausa predikatif dengan penekanan yang wajar dalam bahasa Indonesia.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: itu tidak boleh dimakan
  rationale: Bentuk pasif menyatakan larangan; 'tidak boleh' mempertahankan daya hukum secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Cakupan שֶׁקֶץ
  choice: sesuatu yang menjijikkan dalam konteks aturan makanan
  alternative: suatu kekejian moral secara umum
  rationale: Konteks Imamat 11 membicarakan kelayakan ritual dan makanan, sehingga terjemahan tidak memperluas istilah itu menjadi vonis moral umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat. 'Binatang kecil yang bergerak berkerumun' dipilih agar cakupan istilah Ibrani dapat dipahami pembaca umum, sedangkan catatan kaki mempertahankan alternatif tradisional 'binatang melata'. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkan.
