base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/019.yaml
  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: id
  text: burung bangau, burung cangak[a] menurut jenisnya[b], burung hudhud[c], dan kelelawar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi istilah Ibrani ini tidak pasti; mungkin burung cangak, ibis, atau burung air berkaki panjang lainnya.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “menurut jenisnya” mencakup berbagai kelompok yang tergolong dalam jenis burung umum tersebut.
    reason: cultural_note
  - marker: c
    text: Secara tradisional kadang diterjemahkan dengan nama burung lain, tetapi istilah Ibraninya kemungkinan besar menunjuk kepada burung hudhud.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲסִידָה
  choice: burung bangau
  rationale: Istilah ini secara luas dipahami sebagai stork (keluarga Ciconiidae). “Burung bangau” merupakan padanan Indonesia yang paling mudah dipahami, meskipun pemakaian umum kata “bangau” tidak selalu setepat klasifikasi zoologis modern.
- source_word: אֲנָפָה
  choice: burung cangak
  rationale: Identifikasi tepat burung ini tidak pasti. “Cangak” merupakan sebutan Indonesia yang wajar untuk kelompok heron dan menjaga perbedaannya dari חֲסִידָה dalam daftar ini.
- source_word: לְמִינָהּ
  choice: menurut jenisnya
  rationale: Ungkapan ini menandai berbagai kelompok atau varietas yang termasuk dalam jenis umum yang disebutkan; terjemahan ini dekat dengan bentuk Ibrani dan tetap alami.
- source_word: דּוּכִיפַת
  choice: burung hudhud
  rationale: Bukti leksikal dan zoologis modern lebih kuat menunjuk kepada hoopoe, yang lazim disebut “burung hudhud” dalam bahasa Indonesia, daripada identifikasi tradisional lain seperti lapwing.
- source_word: עֲטַלֵּף
  choice: kelelawar
  rationale: Identifikasinya jelas. Daftar Ibrani mengelompokkan makhluk berdasarkan pengamatan sehari-hari sebagai makhluk terbang, bukan berdasarkan taksonomi biologis modern.
- source_word: וְאֵת / וְאֶת
  choice: dan
  rationale: Penanda objek langsung tidak memiliki padanan tersendiri dalam bahasa Indonesia; unsur penghubungnya diterjemahkan secara alami sebagai “dan” sebelum unsur terakhir daftar.
