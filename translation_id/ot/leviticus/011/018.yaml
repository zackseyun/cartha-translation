  text: וְ/אֶת הַ/תִּנְשֶׁ֥מֶת וְ/אֶת הַ/קָּאָ֖ת וְ/אֶת הָ/רָחָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/018.yaml
  text: the owl, the pelican, and the carrion vulture;
translation:
  language: id
  text: burung hantu[a], burung undan[b], dan burung nasar pemakan bangkai[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama burung Ibrani ini tidak dapat diidentifikasi dengan pasti; mungkin sejenis burung hantu.
    reason: Menandai ketidakpastian zoologis pada תִּנְשֶׁמֶת.
  - marker: b
    text: Identifikasi tradisionalnya adalah burung undan, tetapi jenis burung yang tepat tidak pasti.
    reason: Menandai ketidakpastian zoologis pada קָאָת.
  - marker: c
    text: Mungkin sejenis burung nasar, barangkali nasar Mesir; identifikasi tepatnya tidak pasti.
    reason: Menandai ketidakpastian zoologis pada רָחָם.
lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (hattinshemet)
  choice: burung hantu
  rationale: Nama burung ini tidak dapat diidentifikasi dengan pasti. Dalam konteks daftar burung, padanan umum “burung hantu” mempertahankan kategori tradisional tanpa mengklaim spesies tertentu.
- source_word: הַקָּאָת (haqqa'at)
  choice: burung undan
  rationale: Secara tradisional dipahami sebagai pelikan/undan, walaupun identifikasi zoologisnya tidak pasti. “Burung undan” adalah istilah Indonesia modern yang jelas.
- source_word: הָרָחָם (haraham)
  choice: burung nasar pemakan bangkai
  rationale: Kemungkinan besar menunjuk pada sejenis burung nasar, sering kali diidentifikasi sebagai nasar Mesir. Frasa ini menyampaikan jenis burung dan kebiasaannya tanpa menetapkan spesies secara berlebihan.
theological_decisions:
- issue: Ketidakpastian identifikasi nama-nama burung Ibrani kuno
  choice: Memakai padanan umum dalam teks dan menyatakan ketidakpastian dalam catatan kaki
  alternative: Menetapkan spesies modern tertentu tanpa catatan
  rationale: Identifikasi zoologis tidak menentukan pokok hukum kenajisan dalam konteks ini; catatan kaki menjaga kejujuran terhadap bukti bahasa sumber dan menghindari kepastian semu.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan mudah dipahami. Bentuknya mengikuti struktur daftar pada ayat-ayat sekitar; tanda titik koma mempertahankan kesinambungan daftar.
