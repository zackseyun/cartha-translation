  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: id
  text: Siapa pun yang mengangkat bangkai hewan-hewan itu[a] harus mencuci pakaiannya dan menjadi najis sampai petang. Hewan-hewan itu najis bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bangkai mereka.” Ungkapan Ibrani ini dapat dipahami secara distributif, yaitu bangkai salah satu dari hewan-hewan yang dibicarakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: Siapa pun yang mengangkat
  rationale: Partisipel dengan artikel berfungsi secara umum dalam ketentuan hukum. Frasa ini alami dalam bahasa Indonesia dan mempertahankan cakupan umum dari ‘orang yang mengangkat’.
- source_word: נִבְלָתָם
  choice: bangkai salah satu dari hewan-hewan itu
  rationale: נְבֵלָה menunjuk pada bangkai hewan, sedangkan sufiks jamaknya merujuk kepada hewan-hewan dalam konteks sebelumnya. Rumusan distributif ini membuat rujukannya jelas dan tetap mengakui kemungkinan bentuk harfiah ‘bangkai mereka’.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Bentuk imperfek dalam bahan hukum mengandung daya perintah. ‘Harus’ menyampaikannya secara wajar dalam bahasa Indonesia modern; ‘pakaiannya’ mempertahankan sufiks orang ketiga tunggal.
- source_word: וְטָמֵא
  choice: dan menjadi najis
  rationale: Klausa ini menyatakan status kenajisan ritual yang timbul akibat tindakan tersebut. ‘Menjadi najis’ jelas dan tidak menyiratkan kesalahan moral.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Ungkapan ini alami dan bermartabat dalam bahasa Indonesia serta tepat menyatakan batas waktu status kenajisan.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: Hewan-hewan itu najis bagimu
  rationale: Subjek eksplisit memperjelas bahwa kata ganti Ibrani merujuk kepada hewan-hewan yang sedang dibahas. ‘Bagimu’ mempertahankan לָכֶם tanpa menambahkan tafsiran.
theological_decisions:
- issue: Istilah kenajisan ritual
  choice: najis
  alternative: cemar; tidak tahir
  rationale: Dalam peraturan kemurnian Imamat, טמא merupakan kategori ritual teknis. ‘Najis’ adalah istilah Indonesia yang lazim dan konsisten, tanpa dengan sendirinya menyatakan kesalahan moral.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Istilah teknis ‘najis’ dipertahankan secara konsisten, sedangkan konstruksi distributif dipakai dalam teks utama untuk kejelasan rujukan.
