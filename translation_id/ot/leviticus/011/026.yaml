id: LEV.11.26
reference: Leviticus 11:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: id
  text: Setiap binatang yang berkuku belah, tetapi kukunya tidak terbelah sepenuhnya[a] dan tidak memamah biak, adalah najis bagimu. Setiap orang yang menyentuh binatang-binatang itu akan menjadi najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak membelah suatu belahan”; pengulangan kata serumpun dalam bahasa Ibrani menegaskan bahwa kukunya tidak terbelah sepenuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: Setiap binatang
  rationale: בְּהֵמָה di sini menunjuk secara luas pada binatang darat. Dalam bahasa Indonesia, daya topikal prefiks לְ tidak perlu dinyatakan dengan frasa tambahan karena pembukaan “Setiap binatang” sudah alami dan jelas.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: berkuku belah
  rationale: Ungkapan ini menggambarkan binatang yang memiliki kuku terbagi. “Berkuku belah” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: tetapi kukunya tidak terbelah sepenuhnya
  rationale: Gabungan nomina dan verba serumpun menegaskan bahwa belahan kuku itu tidak lengkap. “Sepenuhnya” menyampaikan penegasan tersebut tanpa mempertahankan pengulangan Ibrani yang janggal dalam bahasa Indonesia.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: dan tidak memamah biak
  rationale: Secara harfiah ungkapan Ibrani berarti tidak menaikkan kembali makanan yang telah ditelan. “Memamah biak” adalah istilah zoologis Indonesia yang tepat dan mudah dipahami.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: adalah najis bagimu
  rationale: “Najis” mempertahankan kategori kenajisan ritual dalam hukum Imamat. “Bagimu” mencerminkan לָכֶם dan sudut pandang hukum perjanjian.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Setiap orang yang menyentuh binatang-binatang itu
  rationale: Partisip tunggal dengan כָּל menyatakan kaidah umum. Penyebutan kembali “binatang-binatang itu” menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: יִטְמָא
  choice: akan menjadi najis
  rationale: Bentuk imperfek menyatakan akibat hukum yang berlaku ketika sentuhan terjadi. “Akan menjadi najis” memperjelas perubahan status kenajisan.
theological_decisions:
- issue: Istilah kemurnian dalam hukum Imamat
  choice: najis
  alternative: tidak tahir
  rationale: Ayat ini menetapkan status ritual, bukan dengan sendirinya penilaian moral. “Najis” merupakan istilah Alkitabiah Indonesia yang umum dan mempertahankan kategori hukum-ritual tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “berkuku belah,” “memamah biak,” dan “najis” dipilih karena jelas bagi pembaca umum sekaligus sesuai dengan corak hukum-ritual Imamat.
