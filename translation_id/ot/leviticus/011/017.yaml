  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: id
  text: burung hantu kecil[a], burung pecuk, dan burung hantu besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi burung-burung ini tidak pasti. “Burung hantu kecil,” “burung pecuk,” dan “burung hantu besar” merupakan padanan tradisional atau ilmiah yang masuk akal. Kemungkinan lain mencakup “burung hantu” untuk כּוֹס, “burung undan” untuk שָׁלָךְ, serta “burung hantu bertanduk” atau “burung hantu elang” untuk יַנְשׁוּף.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: burung hantu kecil
  rationale: Kata ini menunjuk pada seekor burung yang haram, tetapi jenis tepatnya tidak pasti. Pilihan ini mengikuti identifikasi modern yang cukup umum dan tetap menyiratkan jenis burung tertentu.
- source_word: הַשָּׁלָךְ
  choice: burung pecuk
  rationale: Rujukan tepat kata ini diperdebatkan; kemungkinan menunjuk pada burung air yang menyelam. 'Burung pecuk' merupakan padanan Indonesia yang wajar untuk identifikasi tradisional sebagai cormorant, sementara alternatif dicatat dalam catatan kaki.
- source_word: הַיַּנְשׁוּף
  choice: burung hantu besar
  rationale: Kata ini kemungkinan menunjuk pada burung malam berukuran besar, tetapi spesies tepatnya tidak dapat dipastikan. Padanan ini mempertahankan kekhususan tanpa menyatakan kepastian zoologis yang berlebihan.
- source_word: וְאֶת
  choice: dan
  rationale: Pengulangan kata sambung dan penanda objek meneruskan daftar sebelumnya. Dalam bahasa Indonesia, tanda koma dan satu 'dan' sebelum unsur terakhir menghasilkan daftar yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan mudah dipahami. Kata 'burung' diulang untuk memperjelas bahwa setiap unsur adalah nama jenis burung; ketidakpastian zoologis dipertahankan melalui catatan kaki.
