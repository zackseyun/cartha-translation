  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: id
  text: Setiap makhluk bersayap yang berkerumun dan berjalan dengan empat kaki adalah sesuatu yang menjijikkan bagi kalian.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setiap makhluk terbang yang berkerumun.” Kata Ibrani עוֹף dapat menunjuk secara luas kepada makhluk yang terbang, bukan hanya burung.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berjalan di atas empat”; ungkapan ini menunjuk pada gerak dengan empat kaki, sedangkan ayat-ayat berikutnya mengecualikan serangga tertentu yang memiliki kaki beruas untuk melompat.
    reason: cultural_note
  - marker: c
    text: Atau, “adalah suatu kekejian bagi kalian.” Dalam hukum makanan ini, istilah tersebut menyatakan sesuatu yang dipandang menjijikkan atau terlarang secara ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Setiap
  rationale: 'Menyatakan cakupan distributif dalam ketetapan hukum: tiap anggota golongan ini tercakup.'
- source_word: שֶׁרֶץ
  choice: binatang kecil ... yang berkerumun
  rationale: Kata ini menunjuk pada makhluk kecil yang bergerak atau terdapat dalam jumlah banyak; ungkapan ini lebih jelas dalam bahasa Indonesia modern daripada padanan tradisional yang hanya menekankan gerak melata.
- source_word: הָעוֹף
  choice: bersayap
  rationale: עוֹף dapat mencakup makhluk terbang secara luas, termasuk serangga, bukan hanya burung. 'Bersayap' mencegah pembatasan makna kepada burung.
- source_word: הַהֹלֵךְ
  choice: berjalan
  rationale: Partisip ini menggambarkan cara bergerak yang khas dan diterjemahkan secara langsung serta wajar.
- source_word: עַל אַרְבַּע
  choice: dengan empat kaki
  rationale: Secara harfiah, 'di atas empat'; dalam konteks ini menunjuk pada gerak dengan empat kaki. Bentuk ini mempertahankan korespondensi dekat dengan bahasa Ibrani.
- source_word: שֶׁקֶץ
  choice: sesuatu yang menjijikkan
  rationale: Dalam hukum makanan, istilah ini menyatakan sesuatu yang harus dipandang menjijikkan atau pantang secara ritual, dan tidak identik begitu saja dengan istilah umum untuk 'najis'.
- source_word: לָכֶם
  choice: bagi kalian
  rationale: Dativus ini menyatakan hubungan dengan umat Israel sebagai pihak yang harus memandang makhluk tersebut demikian; bentuk jamak 'kalian' membuat acuannya jelas.
theological_decisions:
- issue: Daya makna שֶׁקֶץ dalam hukum makanan
  choice: sesuatu yang menjijikkan bagi kalian
  alternative: suatu kekejian bagi kalian
  rationale: Pilihan ini mempertahankan kuatnya penolakan ritual dalam konteks hukum makanan tanpa secara otomatis memberi istilah itu muatan moral yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. 'Kalian' dipakai untuk mempertahankan bentuk jamak orang kedua. Susunan kalimat dibuat alami tanpa menghapus klasifikasi zoologis kuno atau ketegangan dengan pengecualian pada ayat berikutnya.
