  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: id
  text: Segala sesuatu di dalam air yang tidak mempunyai sirip dan sisik adalah sesuatu yang menjijikkan bagi kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuatu yang keji bagi kalian.” Kata Ibrani שֶׁקֶץ menunjuk pada sesuatu yang menjijikkan atau dipandang pantang secara ritual dalam konteks hukum makanan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Segala sesuatu ... yang
  rationale: Ungkapan ini menyatakan kategori yang menyeluruh; bentuk Indonesia ini alami dan mempertahankan daya cakup teks Ibrani.
- source_word: אֵין לוֹ
  choice: tidak mempunyai
  rationale: Konstruksi eksistensial negatif dengan pelengkap pronominal secara alami menyatakan ketiadaan kepemilikan.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: sirip dan sisik
  rationale: Kedua nomina tunggal Ibrani dipakai secara generik; dalam bahasa Indonesia, bentuk tak bertanda jumlah ini cocok untuk ciri jenis makhluk air.
- source_word: בַּמָּיִם
  choice: di dalam air
  rationale: מַיִם berbentuk jamak dalam bahasa Ibrani tetapi lazim diterjemahkan sebagai nomina massa 'air'; frasa ini mempertahankan makna lokatif.
- source_word: שֶׁקֶץ
  choice: sesuatu yang menjijikkan
  rationale: Dalam konteks hukum makanan, kata ini menunjuk pada sesuatu yang dipandang sangat menjijikkan atau pantang secara ritual; frasa nominal mempertahankan bentuk predikat Ibrani dan daya evaluatifnya.
- source_word: הוּא
  choice: adalah
  rationale: Pronomina mandiri menguatkan klausa nominal; kopula Indonesia menyampaikan hubungan predikatif dengan jelas.
- source_word: לָכֶם
  choice: bagi kalian
  rationale: Bentuk jamak orang kedua menandai penerapan ketentuan ini kepada umat yang disapa; 'kalian' mempertahankan jumlah jamaknya.
theological_decisions:
- issue: Istilah status ritual שֶׁקֶץ dalam konteks hukum makanan
  choice: sesuatu yang menjijikkan
  alternative: sesuatu yang keji; suatu kekejian; sesuatu yang najis
  rationale: '''Sesuatu yang menjijikkan'' mempertahankan penilaian kuat dan nuansa kepantangan ritual tanpa menyamakannya dengan kosakata khusus untuk kenajisan, yang tidak dipakai dalam ayat ini. Catatan kaki mencatat alternatif yang lebih padat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk mempertahankan sapaan orang kedua jamak secara jelas. Susunan kalimat dibuat lugas, sementara predikat nominal dipertahankan agar kekuatan ungkapan sumber tidak melemah.
