base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: id
  text: Namun, mata air atau perigi, tempat air terkumpul, akan tetap tahir. Tetapi siapa pun yang menyentuh bangkai mereka akan menjadi najis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pengecualian atau kontras terhadap aturan kenajisan sebelumnya tanpa memberi nuansa pembatas yang terlalu kuat.
- source_word: מַעְיָן
  choice: mata air
  rationale: Padanan Indonesia yang alami untuk sumber air alami.
- source_word: בּוֹר
  choice: perigi
  rationale: Dalam konteks ini menunjuk tempat buatan untuk menampung air; 'perigi' cukup luas untuk wadah atau lubang penampungan air dan tidak harus berarti sumur dengan sumber air sendiri.
- source_word: מִקְוֵה מַיִם
  choice: tempat air terkumpul
  rationale: Menerangkan mata air atau perigi sebagai kumpulan atau tampungan air, dengan ungkapan yang alami dalam bahasa Indonesia.
- source_word: יִהְיֶה טָהוֹר
  choice: akan tetap tahir
  rationale: Secara kontekstual sumber air itu tidak menjadi najis oleh bangkai yang disebut sebelumnya; 'tetap' menyatakan kesinambungan yang tersirat.
- source_word: נֹגֵעַ
  choice: siapa pun yang menyentuh
  rationale: Partisip ini dipakai secara substantival dan umum; bentuk ini alami dalam bahasa Indonesia.
- source_word: נִבְלָתָם
  choice: bangkai mereka
  rationale: Menjaga bentuk kolektif tunggal dan akhiran orang ketiga jamak yang merujuk kepada binatang-binatang dalam konteks sebelumnya.
- source_word: יִטְמָא
  choice: akan menjadi najis
  rationale: Menyatakan akibat sentuhan sebagai perubahan menuju keadaan najis dan mempertahankan istilah ritual baku.
theological_decisions:
- issue: Istilah ketahiran ritual
  choice: tahir / najis
  alternative: bersih / tidak bersih; murni / cemar
  rationale: '''Tahir'' dan ''najis'' merupakan istilah Indonesia yang jelas dan mapan untuk status ritual dalam Imamat, tanpa mengubahnya menjadi penilaian moral.'
- issue: Objek yang menjadi najis pada klausa kedua
  choice: orang yang menyentuh bangkai menjadi najis
  alternative: air atau tempat air menjadi najis
  rationale: Partisip נֹגֵעַ berfungsi sebagai subjek personal generik; terjemahan mempertahankan perbedaan bahwa sumber air tetap tahir, sedangkan penyentuh bangkai menjadi najis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat mudah dipahami sambil mempertahankan kontras hukum ritual serta nuansa bahwa sumber air tetap tahir.
