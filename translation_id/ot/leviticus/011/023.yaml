  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף אֲשֶׁר ל֖/וֹ אַרְבַּ֣ע רַגְלָ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: id
  text: Namun, setiap makhluk bersayap yang berkerumun[a] dan mempunyai empat kaki[b] adalah sesuatu yang menjijikkan bagi kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “makhluk yang berkerumun dan terbang.” Ungkapan Ibrani ini menunjuk secara luas kepada makhluk terbang yang berkerumun, terutama serangga.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “empat kaki.” Pernyataan ini dipertahankan sebagaimana terdapat dalam teks Ibrani; ayat sebelumnya menyebut anggota gerak tambahan pada jenis tertentu.'
    reason: source_clarity
lexical_decisions:
- source_word: וְ/כֹל
  choice: Namun, setiap
  rationale: וְ menandai kontras dengan pengecualian pada ayat sebelumnya, sehingga diterjemahkan secara alami sebagai “Namun”; כֹל mempertahankan cakupan distributif “setiap”.
- source_word: שֶׁרֶץ הָעֹוף
  choice: makhluk bersayap yang berkerumun
  rationale: Gabungan ini menunjuk secara luas kepada makhluk kecil yang terbang atau bersayap dan berkerumun, terutama serangga. Pilihan ini lebih tepat daripada membatasinya pada burung atau makhluk yang merayap.
- source_word: אֲשֶׁר לוֹ
  choice: yang ... mempunyai
  rationale: Konstruksi relatif ini menyatakan ciri yang dimiliki makhluk tersebut; “mempunyai” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: אַרְבַּע רַגְלָיִם
  choice: empat kaki
  rationale: רַגְלָיִם dapat berarti kaki atau tungkai. Bahasa Indonesia memakai “kaki” secara alami untuk anggota gerak serangga sekaligus tetap dekat dengan bentuk Ibrani.
- source_word: שֶׁקֶץ
  choice: sesuatu yang menjijikkan
  rationale: Dalam konteks aturan makanan, kata ini menyatakan sesuatu yang harus dipandang menjijikkan dan dilarang, tanpa menyamakannya begitu saja dengan istilah umum “najis”.
- source_word: הוּא לָכֶם
  choice: adalah ... bagi kalian
  rationale: Klausa nominal Ibrani memerlukan kopula dalam bahasa Indonesia. “Bagi kalian” mempertahankan sasaran jamak dari ketetapan ini.
theological_decisions:
- issue: Sifat kategori שֶׁקֶץ dalam hukum makanan
  choice: sesuatu yang menjijikkan bagi kalian
  alternative: najis bagi kalian
  rationale: Teks memakai שֶׁקֶץ, bukan istilah utama untuk kenajisan ritual. Terjemahan mempertahankan daya evaluatif kata tersebut tanpa meleburkan dua kategori Ibrani yang berbeda.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. “Kalian” dipakai untuk mempertahankan sapaan orang kedua jamak secara jelas; “makhluk” menjaga keluasan kategori zoologis dalam teks.
