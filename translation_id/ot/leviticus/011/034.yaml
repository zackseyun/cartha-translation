  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: id
  text: Setiap makanan yang boleh dimakan[a], yang terkena air, menjadi najis. Demikian juga, setiap minuman yang boleh diminum dalam bejana apa pun menjadi najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “setiap makanan yang dimakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: Setiap makanan
  rationale: Frasa ini menunjuk secara umum pada setiap jenis makanan; bentuk alami dalam bahasa Indonesia adalah “setiap makanan”.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: yang boleh dimakan
  rationale: Nifal imperfek membatasi kategori pada makanan yang dapat atau layak dimakan, bukan sekadar makanan yang sedang dimakan.
- source_word: אֲשֶׁר יָבוֹא עָלָיו מַיִם
  choice: yang terkena air
  rationale: Secara harfiah, “yang air datang ke atasnya.” Ungkapan “terkena air” menyampaikan keadaan yang dimaksud secara alami tanpa menentukan pelaku atau cara air itu mengenainya.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: Dalam konteks hukum ritual Imamat, verba ini menyatakan perubahan status menjadi najis.
- source_word: וְכָל מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: Demikian juga, setiap minuman yang boleh diminum
  rationale: “Minuman” tepat untuk sesuatu yang diminum, sedangkan “boleh diminum” mempertahankan fungsi kualifikatif bentuk Nifal.
- source_word: בְּכָל כְּלִי
  choice: dari bejana apa pun
  rationale: Preposisi ב dapat dipahami berkaitan dengan tindakan meminum—minuman yang diminum dari bejana apa pun. “Bejana” mempertahankan ragam hukum-ritual yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan frasa בְּכָל כְּלִי
  choice: “dari bejana apa pun” dikaitkan dengan “boleh diminum”
  alternative: “di dalam bejana apa pun” dikaitkan dengan keberadaan minuman
  rationale: Tata bahasa Ibrani memungkinkan frasa tersebut dibaca bersama verba “diminum”; pilihan ini mengikuti urutan sintaksis tanpa menambahkan penjelasan teologis. Ketegangan interpretatif tidak memengaruhi kesimpulan hukum bahwa minuman itu menjadi najis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Najis” dipakai sebagai istilah status ritual dalam konteks Imamat; “bejana” dipilih untuk mempertahankan ragam hukum-ritual tanpa menjadi kuno.
