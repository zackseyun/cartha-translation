id: LEV.11.5
reference: Leviticus 11:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: id
  text: Hiraks batu[a], karena memamah biak tetapi kukunya tidak terbelah, adalah najis bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: syafan, umumnya diidentifikasi sebagai hiraks. Terjemahan tradisional memakai “pelanduk,” tetapi pelanduk adalah hewan yang berbeda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: hiraks batu
  rationale: Kata Ibrani ini umumnya menunjuk pada mamalia kecil penghuni tebing yang dikenal sebagai hiraks batu. Istilah ini lebih tepat secara zoologis daripada terjemahan tradisional “pelanduk”.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan mengapa hewan tersebut digolongkan sebagai najis.
- source_word: מַעֲלֵה גֵרָה
  choice: memamah biak
  rationale: Ungkapan Ibrani secara harfiah berarti ‘menaikkan kembali makanan yang dikunyah’; “memamah biak” merupakan padanan Indonesia yang alami dalam rumusan hukum makanan ini.
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: tetapi kukunya tidak terbelah
  rationale: Terjemahan ini menyampaikan kontras serta ciri klasifikasi yang dimaksud, yaitu tidak adanya kuku yang terbelah.
- source_word: טָמֵא
  choice: najis
  rationale: Dalam hukum Imamat, kata ini menyatakan status kenajisan ritual, bukan bahwa hewan itu jahat secara moral.
- source_word: לָכֶם
  choice: bagimu
  rationale: Bentuk ini menyatakan bahwa ketetapan tersebut berlaku bagi umat yang disapa sebagai satu komunitas.
theological_decisions:
- issue: Makna טָמֵא dalam hukum makanan Imamat
  choice: najis dalam arti status ritual
  alternative: kotor atau jahat secara moral
  rationale: Konteks Imamat 11 memakai istilah ini sebagai kategori ritual dalam hukum makanan. Kata “najis” mempertahankan kategori teks tanpa menyatakan bahwa hewan tersebut memiliki keburukan moral.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Memamah biak” dan “najis bagimu” mempertahankan corak hukum keagamaan yang lazim dipahami, sedangkan “hiraks batu” memberi identifikasi hewan yang lebih tepat.
