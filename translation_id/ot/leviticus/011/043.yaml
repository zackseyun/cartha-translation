source:
  edition: WLC
  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: id
  text: Janganlah menjadikan diri kalian menjijikkan dengan segala makhluk yang berkeriapan[a], dan janganlah menajiskan diri kalian dengan makhluk-makhluk itu, agar kalian tidak menjadi najis karenanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala makhluk merayap yang merayap.” Istilah Ibrani ini menunjuk secara luas pada golongan makhluk kecil yang berkeriapan atau bergerak dalam jumlah besar; terjemahan “makhluk yang berkeriapan” mempertahankan cakupannya yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: membuat dirimu menjijikkan
  rationale: Mempertahankan makna refleksif verba שׁקץ dan membedakannya dari istilah טמא, yang diterjemahkan dengan kosakata kenajisan.
- source_word: נַפְשֹׁתֵיכֶם
  choice: dirimu
  rationale: Dalam konstruksi ini נפש menunjuk kepada diri atau pribadi secara utuh; terjemahan harfiah 'jiwamu' akan memberi kesan antropologis yang terlalu sempit.
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: karena segala binatang berkeriapan yang berkeriapan
  rationale: '''Binatang berkeriapan'' mencakup golongan makhluk kecil yang bergerak dalam jumlah banyak dan pengulangan ''yang berkeriapan'' mempertahankan permainan kata Ibrani שׁרץ.'
- source_word: תִטַּמְּאוּ
  choice: menajiskan dirimu
  rationale: Bentuk refleksif menunjukkan tindakan membuat diri sendiri najis; pilihan ini dibedakan dari keadaan yang dinyatakan dalam klausa berikutnya.
- source_word: בָּהֶם / בָּם
  choice: dengan semuanya itu / karenanya
  rationale: Kedua bentuk preposisional menyatakan sarana atau penyebab kenajisan. Variasi alami dalam bahasa Indonesia tetap mempertahankan hubungan tersebut.
- source_word: וְנִטְמֵתֶם
  choice: sehingga kamu menjadi najis
  rationale: Menyatakan akibat dari menajiskan diri dalam rangkaian larangan, sambil mempertahankan perbedaan antara tindakan 'menajiskan diri' dan keadaan 'menjadi najis'.
theological_decisions:
- issue: Istilah kenajisan dalam hukum kekudusan
  choice: najis / menajiskan
  alternative: cemar / mencemarkan
  rationale: טמא dalam Imamat terutama menyatakan status kenajisan dalam tata kekudusan perjanjian. 'Najis' merupakan istilah Indonesia yang mapan dan tidak dengan sendirinya menyamakan status ritual tersebut dengan kesalahan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'janganlah' mempertahankan nada hukum tanpa terdengar kuno; pengulangan sumber dipertahankan karena bermakna secara leksikal.
