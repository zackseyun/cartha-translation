id: LEV.11.6
reference: Leviticus 11:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: id
  text: Juga kelinci hutan[a], karena ia memamah biak, tetapi kukunya tidak terbelah, adalah najis bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelinci.” Kata Ibrani אַרְנֶבֶת secara tradisional dipahami sebagai kelinci hutan (hare), meskipun ada yang memahaminya secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: kelinci hutan
  rationale: Istilah Ibrani ini secara tradisional dipahami sebagai hare, yaitu hewan keluarga Leporidae yang dalam bahasa Indonesia lazim disebut kelinci hutan; catatan kaki mempertahankan kemungkinan padanan yang lebih umum.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi penggolongan hewan tersebut.
- source_word: מַעֲלַת גֵּרָה
  choice: memamah biak
  rationale: Ungkapan Ibrani secara harfiah menggambarkan menaikkan kembali makanan; 'memamah biak' merupakan ungkapan Indonesia yang alami untuk kriteria dalam hukum makanan ini, tanpa menilai ketepatan zoologis modernnya.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: tetapi kukunya tidak terbelah
  rationale: Terjemahan ini menyampaikan kriteria kedua secara negatif, dengan 'tetapi' yang secara alami menandai pertentangan terhadap klausa sebelumnya.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: adalah najis bagimu
  rationale: '''Najis'' adalah istilah Indonesia yang mapan bagi ketidakmurnian ritual dalam konteks hukum makanan, sedangkan ''bagimu'' mempertahankan sasaran perjanjian dari לָכֶם.'
theological_decisions:
- issue: Sifat kenajisan dalam hukum makanan Imamat
  choice: najis dalam pengertian ritual
  alternative: cemar atau jahat secara moral
  rationale: Ayat ini menggolongkan hewan dalam hukum makanan Israel, bukan menyatakan bahwa hewan itu jahat secara moral. Teks memakai istilah ringkas 'najis' dan membiarkan konteks ritual menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan alur alasan dan keputusan hukum dalam teks Ibrani, sementara istilah 'memamah biak' dan 'najis' memakai kosakata yang sudah dikenal pembaca Alkitab Indonesia.
