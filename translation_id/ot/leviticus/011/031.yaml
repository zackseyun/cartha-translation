source:
  edition: WLC
  text: אֵ֛לֶּה הַ/טְּמֵאִ֥ים לָ/כֶ֖ם בְּ/כָל הַ/שָּׁ֑רֶץ כָּל הַ/נֹּגֵ֧עַ בָּ/הֶ֛ם בְּ/מֹתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: id
  text: Inilah yang najis bagimu di antara segala hewan melata.[a] Setiap orang yang menyentuh hewan-hewan itu ketika mereka sudah mati[b] akan menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di antara segala makhluk yang berkeriapan.” Istilah Ibrani ini mencakup secara luas makhluk-makhluk kecil yang merayap, berkerumun, atau terdapat dalam jumlah banyak.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam kematian mereka”; maksudnya, ketika hewan-hewan itu berada dalam keadaan mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַטְּמֵאִים לָכֶם
  choice: Inilah yang najis bagimu
  rationale: Mempertahankan penunjukan jamak kepada makhluk-makhluk yang baru disebut serta status kenajisan ritualnya. Frasa ini alami dan tetap dekat dengan susunan Ibrani.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: di antara segala makhluk yang berkeriapan
  rationale: שֶׁרֶץ adalah istilah luas bagi makhluk kecil yang bergerak dalam jumlah banyak, merayap, atau berkerumun. 'Makhluk yang berkeriapan' mempertahankan keluasan kategorinya tanpa membatasinya pada golongan zoologis tertentu.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Setiap orang yang menyentuh makhluk-makhluk itu
  rationale: Mengungkapkan cakupan distributif dan umum dari konstruksi Ibrani, sekaligus membuat rujukan pronomina jamak בָּהֶם jelas dalam bahasa Indonesia.
- source_word: בְּמֹתָם
  choice: dalam keadaan mati
  rationale: Frasa ini menunjuk pada keadaan makhluk-makhluk tersebut setelah mati, bukan hanya saat terjadinya kematian. Pilihan ini alami dan menghindari penyempitan makna menjadi momen ketika mereka mati.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: akan menjadi najis sampai petang
  rationale: Menyatakan akibat berupa status najis ritual yang berlangsung hingga batas waktu pada petang hari, dengan gaya hukum yang jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Sifat kenajisan
  choice: Menerjemahkan טמא dengan 'najis' tanpa tambahan penjelas dalam ayat
  alternative: '''cemar secara ritual'' atau ''tidak tahir'''
  rationale: '''Najis'' merupakan istilah baku dan dapat dipahami dalam konteks hukum kesucian Imamat. Menambahkan ''secara ritual'' ke dalam teks akan menjelaskan sesuatu yang tersirat tetapi tidak dinyatakan secara eksplisit dalam ayat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'najis' mempertahankan register hukum kesucian Kitab Imamat, sedangkan 'makhluk yang berkeriapan' menjaga keluasan istilah sumber tanpa klasifikasi zoologis yang terlalu khusus.
