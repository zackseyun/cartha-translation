  verdict: revise
  source_fidelity: Draf menangkap cakupan universal, tindakan menangani/membawa bangkai, kewajiban mencuci pakaian, dan batas kenajisan hingga petang. Namun, frasa "salah satu bangkai binatang-binatang itu" tidak idiomatis dan dapat terdengar seolah-olah yang dimaksud adalah satu bangkai dari sejumlah bangkai, bukan bangkai dari salah satu hewan yang telah disebutkan. Bentuk Ibrani מִנִּבְלָתָם memungkinkan nuansa distributif yang lebih jelas bila diterjemahkan "bangkai salah satu dari binatang-binatang itu."
  naturalness: '"Binatang-binatang" dapat dipakai untuk mempertahankan rujukan jamak yang spesifik, tetapi susunan "salah satu bangkai binatang-binatang itu" perlu diperbaiki. "Mengangkat" merupakan padanan yang lugas bagi נָשָׂא dalam konteks ini; kalimat hasil revisi tetap alami dalam bahasa Indonesia standar modern.'
  terminology: '"Najis" tepat untuk טָמֵא dalam hukum kemurnian ritual dan tidak perlu diberi penjelasan moral. "Mencuci pakaiannya" dan "sampai petang" juga tepat serta sesuai register hukum.'
