    issue: Susunan frasa objek "salah satu bangkai binatang-binatang itu" ambigu dan tidak alami.
    rationale: Secara sintaksis, frasa itu dapat menyiratkan satu bangkai di antara banyak bangkai. Yang dimaksud teks adalah bangkai milik/salah satu dari kelompok hewan yang dirujuk sebelumnya. Mengubah urutan menjadi "bangkai salah satu dari binatang-binatang itu" menyampaikan nuansa distributif tanpa menambah makna.
  - severity: low
