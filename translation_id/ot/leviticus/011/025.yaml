  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: id
  text: Setiap orang yang mengangkat bangkai salah satu dari binatang-binatang itu[a] harus mencuci pakaiannya dan menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bangkai binatang-binatang itu.” Secara lebih harfiah: “dari bangkai mereka.” Susunan bahasa Ibrani ini dapat diterjemahkan secara lebih formal demikian, tetapi dalam konteksnya menunjuk secara distributif kepada bangkai salah satu dari binatang-binatang yang telah disebutkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: Setiap orang yang membawa
  rationale: כָּל dengan bentuk partisip berfungsi distributif, sedangkan נָשָׂא dalam konteks ini berarti membawa atau mengangkut. Ungkapan ini menyampaikan cakupan universal aturan tersebut secara alami dalam bahasa Indonesia.
- source_word: מִ/נִּבְלָתָ/ם
  choice: salah satu bangkai binatang-binatang itu
  rationale: נְבֵלָה menunjuk kepada bangkai binatang dalam hukum kenajisan. מִן sesudah נָשָׂא dapat dipahami secara partitif; pilihan ini menyampaikan bahwa membawa bangkai mana pun dari kelompok binatang yang disebut sebelumnya menimbulkan kenajisan.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: harus mencuci pakaiannya
  rationale: Bentuk imperfek menyatakan kewajiban hukum. 'Harus' mempertahankan daya preskriptifnya, sedangkan 'pakaiannya' adalah padanan modern dan alami bagi bentuk tunggal בְּגָדָיו.
- source_word: וְ/טָמֵא
  choice: dan menjadi najis
  rationale: טָמֵא di sini menyatakan kenajisan ritual, bukan kejahatan moral. 'Menjadi najis' menyampaikan status yang timbul akibat tindakan tersebut.
- source_word: עַד הָ/עָרֶב
  choice: sampai petang
  rationale: Frasa ini menetapkan batas waktu berlangsungnya kenajisan. 'Sampai petang' alami, ringkas, dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk maskulin tunggal dalam ketentuan hukum yang berlaku umum
  choice: 'Memakai bentuk tunggal netral dalam bahasa Indonesia: ''setiap orang'' dan ''pakaiannya'''
  alternative: Memakai bentuk yang secara eksplisit menyebut laki-laki
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal untuk individu representatif. Bahasa Indonesia tidak menandai gender pada 'orang' atau akhiran posesif '-nya', sehingga bentuk tunggal dan cakupan umum dapat dipertahankan tanpa menambahkan pembatasan gender yang tidak dinyatakan oleh konteks.
translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat dipertahankan dengan 'harus', sementara kosakata seperti 'pakaian', 'najis', dan 'petang' tetap mudah dipahami pembaca Indonesia masa kini. Rujukan jamak pada akhiran Ibrani dijelaskan sebagai 'binatang-binatang itu' agar acuannya jelas.
