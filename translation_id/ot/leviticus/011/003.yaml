  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: id
  text: Di antara binatang-binatang, setiap binatang yang berkuku belah[a] dan kukunya terbelah sepenuhnya, serta yang memamah biak[b], boleh kamu makan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang membelah kuku dan membelah belahan pada kuku-kuku.” Bahasa Ibrani memakai dua ungkapan yang berkerabat untuk menunjukkan kuku yang benar-benar terbagi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang mengangkat kembali mamahan,” yaitu memamah biak.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: setiap
  rationale: Dipakai secara distributif untuk mencakup tiap binatang yang memenuhi semua ciri berikutnya; bentuk ini alami dalam ketentuan hukum bahasa Indonesia.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: berkuku belah
  rationale: Ungkapan ini secara harfiah menggambarkan binatang yang membelah kuku; 'berkuku belah' menyampaikan ciri fisiknya dengan ringkas dan wajar.
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: yaitu yang kukunya terbelah sepenuhnya
  rationale: Ungkapan kedua yang berkerabat memperjelas bahwa kuku itu sungguh-sungguh terbagi; 'yaitu' menyatakan fungsi penjelas tanpa menghilangkan pengulangan makna dalam bahasa Ibrani.
- source_word: מַעֲלַת גֵּרָה
  choice: memamah biak
  rationale: Secara harfiah berarti 'menaikkan kembali mamahan'; 'memamah biak' adalah padanan Indonesia yang lazim untuk perilaku ruminansia yang dimaksud.
- source_word: בַּבְּהֵמָה
  choice: binatang
  rationale: Dalam konteks penggolongan makanan, istilah ini menunjuk pada binatang darat; 'binatang' jelas dan tidak membatasinya hanya pada ternak.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: boleh kamu makan
  rationale: Bentuk verba ini dalam konteks hukum makanan menyatakan izin, bukan perintah agar binatang tersebut harus dimakan. Susunan ini alami dalam bahasa Indonesia dan mempertahankan sapaan orang kedua jamak secara kolektif.
