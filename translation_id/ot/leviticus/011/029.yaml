id: LEV.11.29
reference: Leviticus 11:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: id
  text: 'Inilah yang najis bagimu di antara binatang yang berkeriapan di atas tanah: tikus tanah[a], tikus, dan kadal besar menurut jenisnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas tepat חֹלֶד dan צָב tidak pasti. Padanan tradisional untuk חֹלֶד mencakup “cerpelai” atau “tikus mondok”, sedangkan צָב juga pernah diterjemahkan “kura-kura darat” atau secara umum “kadal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Inilah
  rationale: Bentuk tunggal Ibrani memperkenalkan daftar yang menyusul. “Inilah” mempertahankan daya tunjuknya dan tetap wajar dalam bahasa Indonesia.
- source_word: לָכֶם
  choice: bagimu
  rationale: Preposisi ל menyatakan hubungan dengan umat yang disapa; “bagimu” menyampaikan bahwa binatang-binatang ini berstatus najis bagi mereka.
- source_word: הַטָּמֵא
  choice: yang najis
  rationale: “Najis” merupakan istilah Indonesia yang lazim dan tepat untuk ketidakmurnian ritual dalam hukum Imamat, tanpa menggeser maknanya menjadi sekadar kotor secara jasmani.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: di antara binatang yang berkeriapan
  rationale: שֶׁרֶץ menunjuk pada kelompok binatang yang bergerak berkeriap atau berkerumun. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan akar kata yang diulang dalam bahasa Ibrani, meskipun pengulangan penuh tidak dipaksakan.
- source_word: עַל הָאָרֶץ
  choice: di bumi
  rationale: Dalam konteks ini אָרֶץ menunjuk pada ranah darat tempat binatang-binatang itu bergerak; “di bumi” mempertahankan keluasan ungkapan sumber.
- source_word: הַחֹלֶד
  choice: tikus tanah
  rationale: Identitas zoologisnya tidak pasti. “Tikus tanah” merupakan padanan modern yang masuk akal bagi binatang kecil penghuni tanah, sementara pilihan tradisional lain dicatat dalam catatan kaki.
- source_word: הָעַכְבָּר
  choice: tikus
  rationale: עַכְבָּר lazim menunjuk pada tikus atau kelompok pengerat serupa; “tikus” adalah padanan Indonesia yang jelas tanpa menuntut penentuan spesies.
- source_word: הַצָּב
  choice: kadal besar
  rationale: Identitas spesiesnya tidak pasti, tetapi dalam daftar binatang darat yang berkeriapan, sejenis reptil atau kadal merupakan kemungkinan kuat. Ketidakpastian dan padanan tradisional dicatat dalam catatan kaki.
- source_word: לְמִינֵהוּ
  choice: menurut jenisnya
  rationale: Ungkapan klasifikasi baku ini menyatakan pengelompokan menurut jenis dan diterjemahkan secara ringkas serta alami.
theological_decisions:
- issue: Makna ketidakmurnian dalam הַטָּמֵא
  choice: najis
  alternative: haram; tidak murni
  rationale: Konteksnya adalah status ketahiran ritual, bukan hanya larangan untuk dimakan atau kekotoran fisik. “Najis” mempertahankan kategori hukum tersebut tanpa memperluas atau mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Istilah “najis” dipertahankan sebagai istilah ritual, sedangkan nama binatang dibuat mudah dipahami dan ketidakpastian zoologisnya dinyatakan dalam catatan kaki.
