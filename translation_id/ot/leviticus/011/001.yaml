  yaml_path: translation/ot/leviticus/011/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa dan Harun; Ia berkata kepada mereka:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר memulai peristiwa tutur baru. Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti sepenuhnya dengan gelar.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: kepada Musa dan Harun
  rationale: Preposisi אֶל menandai kedua penerima firman. Pengulangan preposisi dalam bahasa Ibrani tidak perlu diulang dalam bahasa Indonesia karena cakupan “kepada” atas kedua nama sudah jelas.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Infinitif ini memperkenalkan isi perkataan. “Kata-Nya” mempertahankan penanda ujaran dengan susunan yang lebih wajar dalam bahasa Indonesia daripada “dengan mengatakan”.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Kata ganti jamak menegaskan bahwa perkataan berikut ditujukan kepada Musa dan Harun; unsur ini dipertahankan meskipun menghasilkan sedikit pengulangan retoris.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan fungsi nama tersebut, sementara kebiasaan tradisional menerjemahkannya sebagai “TUHAN” dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “berfirman” sesuai untuk tuturan ilahi, sedangkan “kata-Nya kepada mereka” mempertahankan unsur לֵאמֹר אֲלֵהֶם dan mengantar langsung ke isi firman pada ayat berikutnya.
