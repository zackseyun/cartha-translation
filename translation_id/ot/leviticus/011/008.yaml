id: LEV.11.8
reference: Leviticus 11:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: id
  text: Kamu tidak boleh memakan sedikit pun dari daging hewan-hewan itu dan tidak boleh menyentuh bangkainya[a]. Hewan-hewan itu najis bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bangkai mereka,” yaitu tubuh hewan-hewan itu setelah mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: sedikit pun dari daging hewan-hewan itu
  rationale: Preposisi מִן bersifat partitif dalam larangan ini. Ungkapan “sedikit pun dari” menyampaikan bahwa bagian mana pun dari daging hewan-hewan tersebut tidak boleh dimakan.
- source_word: לֹא תֹאכֵלוּ
  choice: kamu tidak boleh memakan
  rationale: Bentuk imperfek dalam ketentuan hukum menyatakan larangan. “Tidak boleh” terdengar alami dalam bahasa Indonesia modern dan tetap mempertahankan daya wajibnya.
- source_word: וּבְנִבְלָתָם
  choice: dan ... bangkainya
  rationale: נְבֵלָה menunjuk kepada tubuh hewan yang sudah mati. “Bangkai” merupakan padanan Indonesia yang tepat dan membedakannya dari jenazah manusia.
- source_word: לֹא תִגָּעוּ
  choice: tidak boleh menyentuh
  rationale: Kata נגע secara langsung berarti menyentuh atau bersentuhan. “Menyentuh” mempertahankan bentuk larangan tanpa menambahkan penafsiran tentang akibat ritualnya.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: Hewan-hewan itu najis bagimu
  rationale: “Najis” mempertahankan kategori ketahiran ritual dalam Imamat, sedangkan “bagimu” mencerminkan hubungan yang dinyatakan oleh לָכֶם tanpa memperluas maknanya.
theological_decisions:
- issue: Sifat kenajisan dalam hukum makanan Imamat
  choice: Menggunakan “najis” sebagai kategori ketahiran ritual
  alternative: Menggunakan “tidak tahir” atau menafsirkannya sebagai kejahatan moral
  rationale: Ayat ini menetapkan status hewan-hewan tersebut dalam hukum ketahiran Israel. Terjemahan tidak menyamakannya dengan kejahatan moral dan tidak memutuskan perdebatan teologis mengenai penerapan hukum itu pada masa kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kamu” dipakai secara kolektif untuk sasaran jamak dalam ketentuan hukum, sementara pengulangan “hewan-hewan itu” memperjelas rujukan kata ganti Ibrani.
