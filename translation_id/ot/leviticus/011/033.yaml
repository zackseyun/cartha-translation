base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: id
  text: Setiap bejana tembikar[a] yang ke dalamnya jatuh salah satu dari bangkai itu—segala sesuatu yang ada di dalamnya akan menjadi najis—harus kamu pecahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bejana tanah liat." Frasa Ibrani secara khusus menunjuk pada wadah yang terbuat dari tanah liat yang dibakar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: bejana tanah liat
  rationale: כְּלִי menunjuk pada wadah atau perkakas, sedangkan חֶרֶשׂ menentukan bahannya sebagai tanah liat/tembikar. 'Bejana tanah liat' alami dalam bahasa Indonesia dan mempertahankan arti penting bahan wadah dalam hukum kenajisan ini.
- source_word: יִפֹּל מֵהֶם
  choice: jatuh salah satu dari binatang-binatang itu
  rationale: Pronomina jamak merujuk pada binatang-binatang yang dibicarakan dalam konteks sebelumnya. Ungkapan ini mempertahankan makna distributif bahwa jatuhnya salah satu di antaranya sudah membuat ketentuan ini berlaku.
- source_word: אֶל תּוֹכוֹ
  choice: yang ke dalamnya
  rationale: תּוֹךְ menunjuk pada bagian dalam; konstruksi relatif ini menyampaikan gerak masuk ke bagian dalam bejana secara alami.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: segala sesuatu yang ada di dalamnya
  rationale: Pilihan ini mempertahankan cakupan menyeluruh dari כֹּל dan dengan jelas menunjuk pada seluruh isi bejana.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: '''Najis'' adalah istilah Indonesia yang lazim untuk keadaan ketidakmurnian ritual dalam Imamat, sedangkan ''menjadi'' menyatakan keadaan yang timbul akibat peristiwa tersebut.'
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: dan bejana itu harus kamu pecahkan
  rationale: Objek yang didahulukan dalam bahasa Ibrani diberi kejelasan dan penekanan dengan mengulang 'bejana itu'. Bentuk 'harus kamu pecahkan' menyampaikan daya perintah tanpa memperkuat verba menjadi 'hancurkan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum sambil mempertahankan istilah hukum ritual 'najis' dan kekhususan bahan bejana. Penanda catatan kaki ditempatkan setelah seluruh ketentuan karena catatan menjelaskan istilah 'bejana tanah liat' dalam ayat.
