source:
  edition: WLC
  text: וְ/אֵת֙ בַּ֣ת הַֽ/יַּעֲנָ֔ה וְ/אֶת הַ/תַּחְמָ֖ס וְ/אֶת הַ/שָּׁ֑חַף וְ/אֶת הַ/נֵּ֖ץ לְ/מִינֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/016.yaml
  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: id
  text: burung unta,[a] elang, camar, dan alap-alap menurut jenisnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi beberapa burung dalam ayat ini tidak pasti. Padanan tradisional lainnya mencakup “burung hantu” untuk “burung unta”, “burung hantu” atau sejenis burung pemangsa malam untuk “elang”, “kukuk” untuk “camar”, dan “elang” untuk “alap-alap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: burung unta
  rationale: Ungkapan Ibrani ini secara harfiah berbentuk 'anak perempuan ya'anah', tetapi dalam daftar hewan berfungsi sebagai nama burung. 'Burung unta' merupakan identifikasi yang paling lazim berdasarkan bukti leksikal dan bahasa serumpun, meskipun tidak sepenuhnya pasti.
- source_word: הַתַּחְמָס
  choice: elang
  rationale: Identifikasi jenis burung ini tidak pasti. 'Elang' dipilih sebagai sebutan umum dan alami dalam bahasa Indonesia untuk burung pemangsa, tanpa mengklaim spesies tertentu.
- source_word: הַשָּׁחַף
  choice: camar
  rationale: Walaupun identifikasinya tidak pasti, 'camar' banyak diterima dalam leksikon dan terjemahan modern serta merupakan nama burung yang wajar dalam bahasa Indonesia.
- source_word: הַנֵּץ
  choice: alap-alap
  rationale: Kata ini menunjuk pada burung pemangsa, yang dapat diidentifikasi sebagai falcon atau hawk. 'Alap-alap' membedakannya dari תַּחְמָס sekaligus tetap berada dalam cakupan makna yang didukung bukti leksikal.
- source_word: לְמִינֵהוּ
  choice: menurut jenisnya
  rationale: Frasa ini menyatakan penggolongan berdasarkan jenis dan mempertahankan bentuk klasifikasi yang berulang dalam konteks ini.
- source_word: וְאֵת / וְאֶת
  choice: dan / tidak dinyatakan secara terpisah
  rationale: Partikel אֵת menandai objek langsung dan tidak mempunyai padanan tersendiri dalam bahasa Indonesia; konjungsi וְ diterjemahkan sesuai struktur daftar, dengan 'dan' sebelum unsur terakhir agar alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. Struktur daftar dibuat alami dalam bahasa Indonesia, sementara tanda koma di akhir mempertahankan kesinambungan sintaksis dengan ayat-ayat di sekitarnya. Penanda catatan kaki [a] ditempatkan langsung setelah istilah pertama, tetapi catatannya menjelaskan ketidakpastian beberapa nama burung dalam seluruh ayat.
