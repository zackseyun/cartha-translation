lexical_decisions:
- source_word: הַדָּאָה
  choice: burung elang merah
  rationale: Nama burung ini tidak dapat dipastikan secara zoologis. 'Elang merah' merupakan padanan Indonesia yang wajar untuk kite, yaitu burung pemangsa dari kelompok Milvus, sambil mempertahankan ketidakpastian dalam catatan kaki.
- source_word: הָאַיָּה
  choice: burung alap-alap
  rationale: Kata ini menunjuk pada burung pemangsa dan dapat dipahami sebagai falcon atau kite. 'Burung alap-alap' membedakannya dari istilah sebelumnya tanpa melampaui cakupan makna yang mungkin.
- source_word: לְמִינָהּ
  choice: menurut jenisnya
  rationale: Padanan ini mempertahankan fungsi klasifikatif frasa Ibrani dan terdengar alami dalam bahasa Indonesia modern.
- source_word: וְאֶת ... וְאֶת
  choice: '... dan ...'
  rationale: Penanda objek langsung אֵת tidak memiliki padanan tersendiri dalam bahasa Indonesia; rangkaian konjungsi diterjemahkan secara alami dengan 'dan' dalam daftar yang sedang berlangsung.
