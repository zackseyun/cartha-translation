  text: the kite[a], and the falcon according to its kind,
translation:
  language: id
  text: burung elang[a] dan burung alap-alap menurut jenisnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi tepat kedua burung ini tidak pasti; sebagai alternatif, yang pertama dapat diterjemahkan “burung nasar” dan yang kedua “burung elang”.
