source:
  edition: WLC
  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: id
  text: Orang yang memakan sebagian dari bangkainya[a] harus mencuci pakaiannya, dan ia menjadi najis[b] sampai petang. Orang yang membawa bangkainya harus mencuci pakaiannya, dan ia menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “memakan dari bangkainya” atau “memakan sesuatu dari bangkainya”; ungkapan Ibrani ini bersifat partitif dan tidak menentukan jumlah yang dimakan.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, najis menurut hukum kemurnian ritual Israel.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: orang yang memakan
  rationale: Partisipel dengan artikel berfungsi sebagai nomina generik. Bentuk ini mempertahankan gaya hukum sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: מִנִּבְלָתָהּ
  choice: sebagian dari bangkainya
  rationale: 'Preposisi מִן menyatakan makna partitif: yang dimakan berasal dari atau merupakan bagian bangkai itu. Kata ''sebagian'' membuat hubungan tersebut jelas tanpa menentukan jumlahnya.'
- source_word: נִבְלָתָהּ
  choice: bangkainya
  rationale: Dalam konteks hukum kenajisan hewan, נְבֵלָה menunjuk pada bangkai hewan, bukan jenazah manusia. Akhiran pronominal diterjemahkan dengan '-nya'.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Bentuk imperfek dalam ketentuan hukum memiliki daya perintah. 'Harus' menyampaikan kewajiban secara wajar dalam bahasa Indonesia modern, sedangkan bentuk tunggal '-nya' mengikuti rumusan hukum Ibrani.
- source_word: וְטָמֵא
  choice: dan ia menjadi najis
  rationale: Klausa ini menyatakan status kenajisan yang timbul dalam rangkaian hukum tersebut. Kata 'najis' dipertahankan tanpa menambahkan 'secara ritual' dalam teks utama.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Ungkapan ini menyampaikan batas waktu status kenajisan secara tepat dan mengikuti laras formula hukum Imamat.
- source_word: הַנֹּשֵׂא
  choice: orang yang mengangkut
  rationale: Partisipel substantival ini sejajar dengan הָאֹכֵל. 'Mengangkut' menyatakan tindakan membawa bangkai sebagai beban dengan lebih tepat daripada kata umum 'membawa'.
- source_word: אֶת נִבְלָתָהּ
  choice: bangkainya
  rationale: Penanda objek langsung tidak diterjemahkan tersendiri; nomina dengan akhiran pronominal diterjemahkan secara alami sebagai 'bangkainya'.
theological_decisions:
- issue: Sifat kenajisan
  choice: najis
  alternative: najis secara ritual
  rationale: Konteksnya adalah hukum kemurnian ritual Israel, tetapi unsur 'secara ritual' tidak dinyatakan secara eksplisit dalam bahasa Ibrani. Teks utama mempertahankan istilah ringkas sumber, sementara catatan kaki menjelaskan ranah maknanya.
- issue: Representasi gender dalam rumusan hukum tunggal
  choice: orang ... pakaiannya; ia
  alternative: barang siapa ... pakaian mereka
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal secara representatif. Bahasa Indonesia memungkinkan kata 'orang' dan akhiran '-nya' yang tidak menandai gender, sambil tetap mempertahankan jumlah tunggal dan struktur hukum sumber.
- issue: Status yang dinyatakan oleh וְטָמֵא
  choice: ia menjadi najis
  alternative: ia najis; ia akan tetap najis
  rationale: Pilihan ini menyampaikan status yang dihasilkan tanpa memasukkan gagasan 'tetap' yang tidak dinyatakan secara eksplisit. Alternatif 'ia najis' lebih harfiah secara nominal, tetapi kurang alami dalam rangkaian kalimat Indonesia ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras hukum yang lugas dan bermartabat. Struktur paralel kedua klausa dipertahankan. Istilah 'bangkai', 'najis', dan 'sampai petang' selaras dengan konteks Imamat tanpa menambahkan kekhususan doktrinal.
