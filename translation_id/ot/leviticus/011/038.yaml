  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: id
  text: Namun, jika air dibubuhkan pada benih itu dan salah satu dari bangkai binatang-binatang itu jatuh ke atasnya, benih itu menjadi najis bagimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Namun, jika
  rationale: Menandai syarat yang berlawanan dengan keadaan pada ayat sebelumnya; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kontrasnya.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: benih itu terkena air
  rationale: Secara harfiah berarti air diberikan atau ditaruh pada benih. Dalam konteks ini, 'terkena air' menyampaikan keadaan benih yang telah dibasahi tanpa menentukan cara air mengenainya.
- source_word: וְנָפַל
  choice: lalu ... jatuh
  rationale: Meneruskan kondisi hukum dengan urutan yang wajar dalam bahasa Indonesia.
- source_word: מִנִּבְלָתָם
  choice: sebagian dari bangkai binatang-binatang itu
  rationale: מִן dipahami secara partitif, yakni sebagian dari bangkai hewan-hewan yang dibicarakan; 'bangkai' tepat untuk נְבֵלָה dalam konteks kenajisan hewan.
- source_word: עָלָיו
  choice: ke atasnya
  rationale: Merujuk kembali kepada benih sebagai nomina kolektif.
- source_word: טָמֵא הוּא לָכֶם
  choice: benih itu menjadi najis bagimu
  rationale: Menyatakan status kenajisan ritual secara jelas. Pengulangan 'benih itu' menghindari ketidakjelasan rujukan dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat kenajisan
  choice: najis sebagai status ritual
  alternative: tercemar atau kotor secara moral/fisik
  rationale: טָמֵא dalam hukum Imamat menunjuk pada kategori kenajisan ritual, bukan dengan sendirinya kesalahan moral atau kekotoran biasa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur hukum bersyarat dipertahankan, sementara ungkapan pasif Ibrani dibuat alami dalam bahasa sasaran.
