base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: id
  text: Babi juga, karena berkuku belah dan kukunya terbelah sempurna, tetapi tidak memamah biak[a], adalah najis bagimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak mengangkat kembali makanan yang dimamah.”'
    reason: lexical_alternative
  - marker: b
    text: “Najis” di sini merupakan kategori ritual dalam hukum makanan, bukan penilaian bahwa hewan itu jahat secara moral.
    reason: theological_clarification
lexical_decisions:
- source_word: הַחֲזִיר
  choice: babi
  rationale: Kata umum dalam bahasa Indonesia modern untuk hewan yang dimaksud; tidak perlu memakai istilah yang lebih arkais atau khusus.
- source_word: כִּי
  choice: karena
  rationale: Menunjukkan alasan bagi penggolongan hewan tersebut sebagai najis.
- source_word: מַפְרִיס פַּרְסָה
  choice: berkuku belah
  rationale: Ungkapan Indonesia yang ringkas dan alami untuk kuku yang terbagi.
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: dan belahan kukunya terpisah
  rationale: Mempertahankan uraian kedua dalam bahasa Ibrani yang menegaskan bahwa kuku itu benar-benar terbelah, tanpa meleburkannya ke dalam frasa sebelumnya.
- source_word: גֵּרָה לֹא יִגָּר
  choice: tidak memamah biak
  rationale: Ungkapan zoologis yang lazim dan mudah dipahami dalam bahasa Indonesia; bentuk Ibraninya secara lebih harfiah menggambarkan pengangkatan kembali makanan.
- source_word: טָמֵא הוּא לָכֶם
  choice: babi itu najis bagimu
  rationale: Menjaga penegasan subjek dan hubungan kepada umat yang disapa; 'najis' merupakan istilah baku untuk ketidakmurnian ritual dalam konteks hukum makanan.
theological_decisions:
- issue: Makna טָמֵא dalam hukum makanan
  choice: najis dalam pengertian ritual dan hukum makanan
  alternative: cemar; tidak tahir
  rationale: Konteks Imamat 11 membahas pembedaan ritual bagi Israel, bukan menyatakan bahwa hewan itu jahat secara moral. 'Najis' mempertahankan kategori hukum tersebut secara ringkas dan lazim.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Pengulangan deskripsi kuku dipertahankan untuk mencerminkan penekanan teks Ibrani, sedangkan tanda pisah membantu memperjelas peralihan menuju putusan ritual.
