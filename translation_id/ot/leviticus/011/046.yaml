  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: id
  text: Inilah hukum[a] tentang hewan darat, burung-burung, setiap makhluk hidup[b] yang bergerak di dalam air, dan setiap makhluk yang merayap di atas daratan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajaran tentang”. Kata Ibrani תּוֹרָה dapat berarti pengajaran yang berwibawa maupun hukum.
    reason: lexical_alternative
  - marker: b
    text: Atau “setiap makhluk bernyawa”. Ungkapan Ibrani נֶפֶשׁ הַחַיָּה menunjuk kepada makhluk hidup, bukan secara khusus kepada “jiwa” yang tidak berwujud.
    reason: lexical_alternative
  - marker: c
    text: Atau “di atas bumi”. Kata Ibrani אֶרֶץ dapat berarti bumi, negeri, atau daratan; di sini daratan dikontraskan dengan air.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: hukum tentang
  rationale: Dalam konteks ini, תּוֹרָה merangkum ketetapan yang telah diberikan mengenai binatang yang tahir dan najis. “Hukum tentang” menyampaikan kewibawaan ketetapan itu secara alami dalam bahasa Indonesia.
- source_word: הַבְּהֵמָה
  choice: hewan darat
  rationale: בְּהֵמָה dapat menunjuk kepada binatang besar atau binatang darat, termasuk yang jinak maupun liar. Karena pasal ini tidak hanya membahas ternak, “hewan darat” lebih tepat daripada “ternak” dan memperjelas kontras dengan burung serta makhluk air.
- source_word: הָעוֹף
  choice: burung-burung
  rationale: Dalam konteks pengelompokan binatang ini, עוֹף secara wajar diterjemahkan “burung-burung,” meskipun secara leksikal dapat mencakup makhluk yang terbang.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: setiap makhluk hidup
  rationale: Ungkapan נֶפֶשׁ הַחַיָּה menunjuk kepada makhluk atau kehidupan bernyawa, bukan secara khusus kepada jiwa yang terpisah dari tubuh.
- source_word: הָרֹמֶשֶׂת
  choice: yang bergerak
  rationale: Partisipel רמש menggambarkan gerak makhluk hidup. “Bergerak” cukup luas dan alami untuk makhluk air, sedangkan “merayap” dapat memberi gambaran yang terlalu khusus.
- source_word: בַּמָּיִם
  choice: di dalam air
  rationale: Walaupun bentuk Ibraninya jamak, bahasa Indonesia secara idiomatis menggunakan “air” sebagai nomina massa dalam konteks ini.
- source_word: הַשֹּׁרֶצֶת
  choice: yang berkerumun
  rationale: שׁרץ menggambarkan makhluk-makhluk kecil yang bergerak atau berkembang dalam jumlah banyak. “Berkerumun” mempertahankan nuansa itu dan membedakannya dari רמש sebelumnya.
- source_word: עַל הָאָרֶץ
  choice: di atas daratan
  rationale: Di sini אֶרֶץ berlawanan dengan “air,” sehingga “daratan” paling jelas menyatakan kategori habitat yang dimaksud, sambil tetap mengakui bahwa kata itu juga dapat berarti “bumi.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. Susunan daftar dipertahankan agar fungsi ayat sebagai rangkuman peraturan tetap jelas. “Hewan darat” dipilih alih-alih “ternak” supaya kategori tersebut tidak dipersempit hanya pada binatang peliharaan.
