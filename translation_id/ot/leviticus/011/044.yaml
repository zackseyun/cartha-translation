source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: id
  text: Sebab Akulah Yahweh, Allah kalian. Karena itu, kuduskanlah diri kalian dan hendaklah kalian menjadi kudus, sebab Aku kudus. Janganlah kalian menajiskan diri kalian dengan binatang kecil apa pun yang bergerak di atas tanah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan makhluk apa pun yang merayap di tanah.” Ungkapan Ibrani ini menunjuk pada makhluk kecil yang bergerak atau merayap di atas tanah.'
    reason: Alternatif leksikal untuk הַשֶּׁרֶץ הָרֹמֵשׂ עַל הָאָרֶץ.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar TUHAN.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam rumusan perjanjian ini bentuk tersebut merujuk kepada satu Allah; akhiran orang kedua jamak dicakup secara wajar oleh bentuk Indonesia 'Allahmu'.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Karena itu, kuduskanlah dirimu
  rationale: Bentuk hitpael bersifat refleksif dan menyerukan umat untuk menguduskan atau mengkhususkan diri; 'karena itu' menyatakan hubungan konsekuensial yang tersirat dalam konteks.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: dan hendaklah kamu menjadi kudus
  rationale: Mencerminkan bentuk 'dan kamu akan/harus menjadi kudus' sekaligus menyampaikan daya perintahnya dalam bahasa Indonesia yang alami.
- source_word: קָדוֹשׁ
  choice: kudus
  rationale: Mempertahankan istilah utama yang sama bagi umat dan Allah, sehingga hubungan teologis antara keduanya tetap jelas.
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  choice: menajiskan dirimu
  rationale: Menyampaikan pencemaran ritual tanpa menerjemahkan נֶפֶשׁ secara dualistis sebagai 'jiwa'; yang dimaksud ialah diri atau pribadi mereka.
- source_word: הַשֶּׁרֶץ
  choice: binatang kecil ... yang berkeriapan
  rationale: Dalam konteks Imamat 11, kata ini menunjuk pada makhluk kecil yang bergerak atau berkerumun; 'binatang kecil' menghindari kesan bahwa semua binatang melata tanpa kecuali dimaksudkan.
- source_word: הָרֹמֵשׂ עַל הָאָרֶץ
  choice: yang berkeriapan di bumi
  rationale: '''Berkeliaran/bergerak'' terlalu umum, sedangkan ''berkeriapan'' secara alami menggambarkan gerak makhluk-makhluk kecil dekat permukaan tanah.'
theological_decisions:
- issue: Hubungan antara kekudusan Allah dan kewajiban umat
  choice: Memakai 'kudus' untuk umat maupun Allah
  alternative: Menerjemahkan salah satu atau kedua bentuk dengan 'dikhususkan/terpisah'
  rationale: Pengulangan rumpun kata קדשׁ sengaja mendasarkan kekudusan umat pada kekudusan Allah; istilah yang sama mempertahankan kaitan itu.
- issue: Makna נַפְשֹׁתֵיכֶם dalam larangan kenajisan
  choice: dirimu
  alternative: jiwamu; hidupmu
  rationale: Konteks berbicara tentang pencemaran pribadi secara utuh, bukan mengajarkan pembedaan teknis antara tubuh dan jiwa.
- issue: Daya modal וִהְיִיתֶם
  choice: hendaklah kamu menjadi kudus
  alternative: kamu akan menjadi kudus; jadilah kudus
  rationale: Bentuknya secara gramatikal dapat tampak sebagai konsekuensi atau kewajiban setelah perintah sebelumnya. 'Hendaklah' mempertahankan daya normatif tanpa mengubahnya menjadi imperatif langsung kedua.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal 'dirimu/Allahmu' dipakai secara idiomatis untuk sapaan kepada umat secara kolektif; 'kamu' tetap dapat dipahami sebagai tunggal atau jamak dalam bahasa Indonesia. Nama Yahweh dipertahankan.
