  naturalness: Diksi direvisi ke bentuk jamak yang jelas dan modern ('kalian', 'diri kalian'). 'Yang bergerak di atas tanah' lebih alami dan lebih langsung mencerminkan הָרֹמֵשׂ daripada 'berkeriapan', yang dalam bahasa Indonesia dapat menambahkan nuansa bunyi atau gerak ramai yang tidak dinyatakan oleh partisip tersebut.
