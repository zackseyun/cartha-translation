base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: id
  text: 'Inilah yang boleh kamu makan dari segala yang ada di dalam air: segala yang bersirip dan bersisik di dalam air, di laut dan di sungai[a], boleh kamu makan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aliran air”. Kata Ibrani נְחָלִים dapat berarti sungai, aliran air, atau wadi, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת זֶה
  choice: Inilah yang
  rationale: Demonstratif tunggal Ibrani berfungsi sebagai pengantar kategori dalam hukum makanan. “Inilah yang” mempertahankan penunjukan itu sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: תֹּאכְלוּ
  choice: boleh kamu makan
  rationale: Bentuk imperfek orang kedua jamak dalam konteks ini menyatakan izin, bukan perintah untuk wajib memakannya. “Kamu” dipakai secara kolektif kepada umat.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: dari segala yang ada di dalam air
  rationale: Mempertahankan nuansa partitif מִן serta cakupan umum כֹּל אֲשֶׁר; “air” merupakan ungkapan Indonesia yang lebih alami daripada bentuk jamak harfiah.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: bersirip dan bersisik
  rationale: Kedua nomina Ibrani dipakai sebagai ciri penggolongan. Bentuk ber- menyampaikan makna ‘memiliki sirip dan sisik’ secara ringkas dan idiomatis.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: di laut maupun di sungai
  rationale: יַמִּים menunjuk pada laut, sedangkan נְחָלִים dapat menunjuk aliran air, sungai, atau wadi. “Maupun” menyatakan bahwa syarat itu berlaku pada kedua lingkungan air.
- source_word: אֹתָם תֹּאכֵלוּ
  choice: boleh kamu makan
  rationale: Pengulangan pada akhir ayat dipertahankan sebagai penegasan hukum atas makhluk yang memenuhi kedua ciri tersebut; objeknya sudah jelas dari klausa sebelumnya.
