  text: לְ/הַבְדִּ֕יל בֵּ֥ין הַ/טָּמֵ֖א וּ/בֵ֣ין הַ/טָּהֹ֑ר וּ/בֵ֤ין הַֽ/חַיָּה֙ הַֽ/נֶּאֱכֶ֔לֶת וּ/בֵין֙ הַֽ/חַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: id
  text: untuk membedakan antara yang najis dan yang tahir, serta antara binatang yang boleh dimakan dan binatang yang tidak boleh dimakan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: untuk membedakan
  rationale: Infinitif ini menyatakan tujuan dalam kaitannya dengan konteks sebelumnya; 'membedakan' menyampaikan penilaian menurut ketentuan hukum, bukan pemisahan secara fisik.
- source_word: בֵּין ... וּבֵין
  choice: antara ... dan ..., serta antara ... dan ...
  rationale: Susunan ini mempertahankan dua pasang kontras dalam bahasa Indonesia yang alami.
- source_word: הַטָּמֵא
  choice: yang najis
  rationale: '''Najis'' merupakan istilah baku dan mudah dipahami untuk kategori kenajisan ritual dalam hukum Imamat, tanpa menyiratkan keburukan moral intrinsik.'
- source_word: הַטָּהֹר
  choice: yang tahir
  rationale: '''Tahir'' adalah pasangan terminologis yang lazim bagi ''najis'' dalam konteks kemurnian ritual.'
- source_word: הַחַיָּה
  choice: makhluk hidup
  rationale: Pilihan ini mempertahankan cakupan umum חַיָּה dan tidak membatasinya hanya pada binatang liar.
- source_word: הַנֶּאֱכֶלֶת
  choice: yang boleh dimakan
  rationale: Partisipel Nifal dalam konteks hukum makanan menunjuk pada sesuatu yang diizinkan atau layak dimakan, bukan sekadar dapat dimakan secara fisik.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: yang tidak boleh dimakan
  rationale: Ungkapan ini menyampaikan larangan dan membentuk kontras langsung dengan 'yang boleh dimakan' dalam bahasa Indonesia modern.
theological_decisions:
- issue: Istilah kenajisan dan ketahiran dalam hukum Imamat
  choice: yang najis dan yang tahir
  alternative: yang cemar dan yang murni
  rationale: Pilihan ini mempertahankan kategori ritual-hukum dalam teks tanpa mengubahnya menjadi penilaian moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme Ibrani dipertahankan dengan dua kali pemakaian 'antara', sedangkan 'serta' memperjelas hubungan antarpasangan. Tidak diperlukan catatan kaki karena pilihan leksikal utama dapat disampaikan secara langsung dan alami.
