  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: id
  text: 'Oleh hal-hal ini kamu akan menjadi najis: setiap orang yang menyentuh bangkai mereka akan menjadi najis sampai petang[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mengenai hal-hal ini kamu akan menjadi najis.” Frasa pembuka ini dapat memperkenalkan kategori berikut secara umum, bukan semata-mata menyatakan sarana.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bangkai mereka”; nomina Ibraninya berbentuk tunggal dengan akhiran jamak. Ungkapan ini juga dapat diterjemahkan “bangkai-bangkai mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: Karena hal-hal ini
  rationale: Gabungan ו dan ל dengan kata tunjuk dapat menunjukkan sarana atau memperkenalkan kategori yang dibicarakan. Dalam konteks ini, frasa tersebut secara alami menyatakan bahwa hal-hal ini menjadi penyebab kenajisan, sambil mempertahankan alternatif cakupan yang lebih umum dalam catatan kaki.
- source_word: תִּטַּמָּאוּ
  choice: kamu akan menjadi najis
  rationale: Bentuk imperfek orang kedua maskulin jamak dari טמא menyatakan keadaan kenajisan yang timbul. 'Menjadi najis' mempertahankan makna ritual tanpa menyiratkan kesalahan moral.
- source_word: כָּל הַנֹּגֵעַ
  choice: setiap orang yang menyentuh
  rationale: Partisip tunggal sesudah כָּל memiliki daya generik dan universal; ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בְּנִבְלָתָם
  choice: bangkainya
  rationale: נְבֵלָה menunjuk pada bangkai binatang. Bentuk Ibraninya berupa nomina tunggal dengan sufiks jamak; bahasa Indonesia dapat memakai bentuk kolektif tunggal 'bangkainya', sementara kemungkinan bentuk jamak dicatat.
- source_word: יִטְמָא
  choice: akan menjadi najis
  rationale: Verba tunggal sesuai dengan subjek generik tunggal. Pengulangan 'menjadi najis' memperjelas keadaan ritual yang diakibatkan oleh sentuhan.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Frasa ini menyatakan batas waktu berlangsungnya kenajisan ritual dan terdengar alami dalam gaya hukum Indonesia.
theological_decisions:
- issue: Sifat istilah kenajisan dalam peraturan kekudusan
  choice: Menerjemahkan טמא sebagai kenajisan ritual, bukan kesalahan moral
  alternative: '''tercemar'' atau ''tidak tahir'''
  rationale: Ayat ini membahas keadaan ritual akibat menyentuh bangkai binatang. 'Najis' merupakan istilah Indonesia yang jelas dalam konteks hukum pentahiran dan tidak dengan sendirinya menyatakan hukuman moral.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Istilah 'najis' dipakai secara konsisten untuk kenajisan ritual; 'bangkai' dipilih sebagai istilah tepat bagi tubuh binatang yang mati.
