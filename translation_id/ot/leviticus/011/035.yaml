id: LEV.11.35
reference: Leviticus 11:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: id
  text: Segala sesuatu yang kejatuhan bangkai binatang-binatang itu akan menjadi najis.[a] Tungku maupun perapian[b] harus dihancurkan. Keduanya najis dan harus kamu anggap najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangkai mereka.” Kata Ibrani ini menunjuk pada bangkai binatang dalam konteks hukum kenajisan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini menunjuk pada instalasi untuk memasak, yang mungkin berupa kompor sederhana, tempat menaruh periuk, atau struktur seperti perapian.
    reason: cultural_note
lexical_decisions:
- source_word: נִּבְלָתָם
  choice: bangkai binatang-binatang itu
  rationale: נְבֵלָה menunjuk pada bangkai hewan dalam konteks hukum kenajisan. Bentuk dengan akhiran orang ketiga jamak merujuk kembali kepada binatang-binatang yang dibahas sebelumnya.
- source_word: יִפֹּל
  choice: kejatuhan
  rationale: Bentuk imperfek menyatakan keadaan umum dalam rumusan hukum. Konstruksi Indonesia ini secara alami menyampaikan bahwa bagian bangkai jatuh menimpa suatu benda.
- source_word: עָלָיו יִטְמָא
  choice: yang kejatuhan ... akan menjadi najis
  rationale: Ungkapan ini menunjukkan bahwa benda yang terkena bangkai memasuki keadaan najis, bukan bahwa tindakan jatuh itu sendiri bersifat najis.
- source_word: תַּנּוּר
  choice: tungku
  rationale: Istilah ini menunjuk pada tungku untuk memanggang atau membakar makanan; 'tungku' merupakan padanan Indonesia yang ringkas dan sesuai dengan teknologi rumah tangga kuno.
- source_word: כִירַיִם
  choice: perapian
  rationale: Istilah ini menunjuk pada instalasi memasak, mungkin tempat menaruh periuk, kompor sederhana, atau bangunan menyerupai perapian. 'Perapian' mempertahankan cakupan tersebut tanpa menentukan bentuknya secara berlebihan.
- source_word: יֻתָּץ
  choice: harus dihancurkan
  rationale: Bentuk pasif ini menyatakan kewajiban untuk merusak atau membongkar instalasi memasak yang tercemar. 'Harus dihancurkan' jelas dan wajar dalam bahasa Indonesia.
- source_word: טְמֵאִים הֵם
  choice: Semua itu najis
  rationale: Bentuk jamak merujuk pada tungku dan perapian sebagai benda-benda yang berstatus najis.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: dan harus kamu anggap najis
  rationale: 'לָכֶם menyatakan hubungan dengan umat yang dituju: benda-benda itu harus diperlakukan atau dipandang sebagai najis oleh mereka. Rumusan ini menyampaikan daya normatif hukum secara alami.'
theological_decisions:
- issue: Sifat kenajisan dalam hukum Imamat
  choice: Menerjemahkan טמא dengan 'najis' tanpa menambahkan 'secara ritual' dalam teks utama.
  alternative: '''najis secara ritual'' atau ''cemar secara upacara'''
  rationale: Konteksnya adalah kenajisan ritual, bukan kejahatan moral. Istilah baku 'najis' menjaga konsistensi leksikal dan tidak menambahkan penafsiran yang tidak dinyatakan secara eksplisit.
- issue: Arti frasa 'najis bagimu'
  choice: Menerjemahkannya sebagai kewajiban untuk menganggap benda-benda itu najis.
  alternative: '''akan menjadi najis bagimu'' atau ''akan tetap najis bagimu'''
  rationale: Bahasa Indonesia harfiah 'najis bagimu' kurang alami. Rumusan terpilih mempertahankan orientasi kepada umat Israel dan sifat normatif pernyataan tanpa menambahkan gagasan durasi yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur hukum dipertahankan, sedangkan susunan kalimat disesuaikan agar alami. Pengulangan kata 'najis' dipertahankan untuk mencerminkan penegasan teks Ibrani.
