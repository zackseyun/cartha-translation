  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: id
  text: Tetapi segala yang di laut dan di sungai[b] yang tidak bersirip dan bersisik—baik segala binatang yang berkeriapan di air maupun segala makhluk hidup yang ada di air—merupakan sesuatu yang menjijikkan bagimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “merupakan kekejian bagimu.” Kata Ibrani ini menunjuk pada sesuatu yang secara ritual dianggap sangat menjijikkan atau harus ditolak dalam konteks hukum makanan.'
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “sungai” juga dapat berarti anak sungai, aliran air, atau wadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Tetapi segala sesuatu
  rationale: Kata penghubung וְ dalam konteks ini memperkenalkan kebalikan dari hewan air yang boleh dimakan pada ayat sebelumnya; “tetapi” menyatakan kontras itu, sedangkan “segala sesuatu” mempertahankan cakupan כֹל.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: yang tidak
  rationale: Ungkapan relatif ini menyatakan ketiadaan ciri yang disyaratkan; dalam bahasa Indonesia, bentuk ini mengalir secara alami bersama “bersirip dan bersisik”.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: bersirip dan bersisik
  rationale: Kedua ciri tersebut sama-sama disyaratkan. Bentuk verbal berimbuhan ber- alami dalam bahasa Indonesia dan mempertahankan hubungan aditif “dan”.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: di laut dan di sungai
  rationale: יַּמִּים menunjuk pada laut, sedangkan נְחָלִים secara luas menunjuk aliran air seperti sungai, anak sungai, atau wadi. “Sungai” merupakan padanan Indonesia yang jelas dalam konteks ini.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: baik segala binatang yang berkeriapan di air
  rationale: שֶׁרֶץ menggambarkan makhluk yang bergerak berkeriapan atau berkerumun. “Binatang yang berkeriapan” mempertahankan gambaran konkret kategori Ibrani, dan “baik ... maupun ...” mengungkapkan dua kelompok partitif secara alami.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: maupun segala makhluk hidup
  rationale: נֶפֶשׁ הַחַיָּה adalah ungkapan luas bagi makhluk bernyawa. “Makhluk hidup” alami dan tidak mempersempitnya menjadi pengertian manusia atau “jiwa” saja.
- source_word: אֲשֶׁר בַּמָּיִם
  choice: yang ada di air
  rationale: Klausa relatif ini menerangkan makhluk hidup tersebut. “Air” sebagai nomina massa merupakan ungkapan Indonesia yang alami untuk bentuk jamak konseptual Ibrani.
- source_word: שֶׁקֶץ הֵם לָכֶם
  choice: harus kamu anggap menjijikkan
  rationale: Klausa nominal Ibrani menetapkan status makhluk-makhluk itu bagi umat Israel. Rumusan ini mengungkapkan daya normatif hukum dan relasi לָכֶם tanpa menjadikannya pernyataan bahwa makhluk tersebut menjijikkan secara mutlak.
theological_decisions:
- issue: Istilah status ritual dalam hukum makanan
  choice: harus kamu anggap menjijikkan
  alternative: merupakan kekejian bagimu
  rationale: שֶׁקֶץ menyatakan sesuatu yang sangat menjijikkan atau patut ditolak dalam klasifikasi makanan perjanjian. Pilihan ini mempertahankan kekuatan ritual-legalnya dalam bahasa Indonesia modern tanpa mengubahnya menjadi kecaman moral universal.
- issue: Nuansa klausa nominal הֵם לָכֶם
  choice: harus kamu anggap
  alternative: adalah ... bagimu
  rationale: Bahasa Ibrani secara harfiah menyatakan status, “mereka menjijikkan bagimu,” sedangkan konteks hukum memberi daya normatif. Terjemahan utama memakai bentuk kewajiban yang alami; catatan kaki mempertahankan kemungkinan pembacaan statif yang lebih formal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda pisah membantu memperlihatkan bahwa dua kelompok makhluk air menjelaskan cakupan “segala sesuatu.” Penanda catatan kaki ditempatkan dalam urutan [a][b] setelah klausa yang berkaitan dengan keduanya.
