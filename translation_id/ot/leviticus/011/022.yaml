reference: Leviticus 11:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶת אֵ֤לֶּה מֵ/הֶם֙ תֹּאכֵ֔לוּ אֶת הָֽ/אַרְבֶּ֣ה לְ/מִינ֔/וֹ וְ/אֶת הַ/סָּלְעָ֖ם לְ/מִינֵ֑/הוּ וְ/אֶת הַ/חַרְגֹּ֣ל לְ/מִינֵ֔/הוּ וְ/אֶת הֶ/חָגָ֖ב לְ/מִינֵֽ/הוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: id
  text: 'Dari antara semuanya itu, inilah yang boleh kamu makan: belalang menurut jenisnya[a], belalang botak menurut jenisnya, jangkrik menurut jenisnya, dan belalang hijau menurut jenisnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Selain kata yang diterjemahkan “belalang”, identitas tepat nama-nama serangga Ibrani dalam ayat ini tidak pasti. Terjemahan tradisional mencakup “belalang botak” untuk סָלְעָם dan “jangkrik” untuk חַרְגֹּל.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: Dari antara semuanya itu, inilah
  rationale: Frasa ini menunjuk pada sebagian dari serangga bersayap yang merayap yang disebut sebelumnya. Susunan ini alami dalam bahasa Indonesia dan mempertahankan gagasan pemilihan dari kelompok tersebut.
- source_word: תֹּאכֵלוּ
  choice: boleh kamu makan
  rationale: Dalam konteks hukum makanan, bentuk imperfek ini menyatakan izin, bukan perintah untuk memakannya.
- source_word: הָאַרְבֶּה
  choice: belalang
  rationale: Istilah ini merupakan sebutan Ibrani yang paling umum dan paling pasti untuk belalang, khususnya belalang yang berkerumun.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: menurut jenisnya
  rationale: Ungkapan klasifikasi yang berulang dalam Taurat ini diterjemahkan secara konsisten dan alami.
- source_word: הַסָּלְעָם
  choice: belalang botak
  rationale: Identifikasi zoologisnya tidak pasti. Pilihan tradisional ini mempertahankan nama yang berbeda dari jenis-jenis lain, sementara ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: הַחַרְגֹּל
  choice: jangkrik
  rationale: Ini adalah padanan tradisional yang masuk akal bagi serangga pelompat, tetapi spesies tepatnya tidak diketahui dan karena itu dicatat sebagai tidak pasti.
- source_word: הֶחָגָב
  choice: belalang hijau
  rationale: Padanan ini membedakannya dari אַרְבֶּה dalam ayat yang sama dan merupakan nama Indonesia yang wajar bagi serangga pelompat jenis grasshopper.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Bentuk tunggal kolektif “kamu” mengikuti sapaan Ibrani, sedangkan daftar serangga dipertahankan secara berurutan. Catatan kaki menjaga ketidakpastian zoologis tanpa membebani teks utama.
