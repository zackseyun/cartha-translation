  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: id
  text: Segala yang bergerak dengan perutnya[a], segala yang berjalan dengan empat kaki, bahkan segala yang berkaki banyak, dari antara semua makhluk-makhluk melata yang merayap di atas tanah[b], janganlah kamu memakannya, sebab semuanya itu menjijikkan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “merayap dengan perutnya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “segala makhluk melata yang merayap”; bahasa Ibrani memakai kata benda dan kata kerja yang seakar untuk menegaskan golongan makhluk ini.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “merupakan kejijikan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: segala yang
  rationale: Kata ini dipakai secara distributif untuk mencakup setiap makhluk dalam kategori yang disebutkan.
- source_word: הוֹלֵךְ עַל גָּח
  choice: berjalan dengan perutnya
  rationale: Ungkapan ini mempertahankan gambaran konkret tentang cara bergerak tanpa mempersempitnya menjadi jenis gerakan tertentu.
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: berjalan dengan empat kaki
  rationale: Bahasa Indonesia memerlukan penyebutan 'kaki' agar angka empat yang tersirat dalam ungkapan Ibrani menjadi jelas dan alami.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: bahkan segala yang berkaki banyak
  rationale: Di sini עַד memperluas cakupan daftar sampai mencakup makhluk berkaki banyak; 'bahkan' menyampaikan daya inklusif itu secara alami.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: dari antara semua binatang kecil yang berkeriapan
  rationale: Terjemahan ini menyatakan fungsi penggolongan לְ dan sebisa mungkin mencerminkan pengulangan serumpun antara kata benda dan partisip dalam bahasa Ibrani.
- source_word: עַל הָאָרֶץ
  choice: di atas tanah
  rationale: Dalam konteks gerak makhluk kecil, 'tanah' menyampaikan permukaan tempat mereka bergerak dengan lebih alami daripada 'bumi', tanpa mengubah cakupannya.
- source_word: לֹא תֹאכְלֻם
  choice: janganlah kamu makan
  rationale: Bentuk larangan hukum diterjemahkan sebagai larangan langsung yang tegas, wajar, dan bermartabat dalam bahasa Indonesia.
- source_word: שֶׁקֶץ
  choice: menjijikkan
  rationale: Dalam hukum makanan, kata ini menyatakan sesuatu yang harus dipandang dengan rasa jijik atau sebagai pantangan; 'menjijikkan' kuat dan mudah dipahami tanpa menambahkan penafsiran doktrinal.
theological_decisions:
- issue: Sifat larangan dalam peraturan kekudusan
  choice: Ayat diterjemahkan sebagai larangan makanan secara langsung tanpa menentukan penerapannya dalam kerangka teologis kemudian.
  alternative: Menampilkannya sebagai larangan moral yang berlaku sepanjang masa, atau melemahkannya menjadi sekadar tabu budaya.
  rationale: Teks Ibrani menyampaikan larangan langsung dalam konteks hukum kemurnian Imamat. Terjemahan harus mempertahankan ketegasan hukum itu tanpa menyelesaikan perdebatan kanonis atau doktrinal yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas dan bermartabat. Susunan daftar dipertahankan, sedangkan pengulangan Ibrani dijelaskan melalui catatan kaki agar teks utama tetap alami.
