  text: דַּבְּר֛וּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֤את הַֽ/חַיָּה֙ אֲשֶׁ֣ר תֹּאכְל֔וּ מִ/כָּל הַ/בְּהֵמָ֖ה אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: id
  text: Berbicaralah kepada umat Israel[a] dan katakanlah, ‘Inilah makhluk-makhluk hidup[b] yang boleh kalian makan dari antara segala binatang yang ada di darat[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “anak-anak Israel” atau “orang Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani secara bentuk memakai kata tunggal: “Inilah makhluk hidup yang boleh kalian makan”; kata tunggal itu dipakai secara kolektif untuk memperkenalkan berbagai jenis makhluk.'
    reason: lexical_alternative
  - marker: c
    text: Atau “di bumi.” Dalam konteks ini, frasa tersebut menunjuk kepada binatang darat sebagai kategori yang dibedakan dari makhluk air.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Berbicaralah
  rationale: Bentuk imperatif jamak dari דבר ditujukan kepada Musa dan Harun dalam konteks. Bahasa Indonesia tidak membedakan imperatif tunggal dan jamak, tetapi bentuk ini mempertahankan corak perintah resmi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan Ibrani secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi di sini menunjuk kepada komunitas Israel secara keseluruhan. ‘Umat Israel’ alami, inklusif sesuai cakupan kolektifnya, dan tetap bernuansa komunal.
- source_word: לֵאמֹר
  choice: dan katakanlah
  rationale: Infinitif pengutip Ibrani ini memperkenalkan perkataan langsung. Dalam bahasa Indonesia, ‘dan katakanlah’ lebih alami daripada bentuk partisipial yang kaku.
- source_word: זֹאת הַחַיָּה
  choice: Inilah makhluk-makhluk hidup
  rationale: זֹאת dan הַחַיָּה berbentuk tunggal, tetapi frasa ini berfungsi secara kolektif dan mengawali penggolongan berbagai makhluk yang boleh dimakan. Bentuk jamak menyampaikan fungsi klasifikasinya secara alami; bentuk formal tunggal dicatat dalam catatan kaki.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: yang boleh kalian makan
  rationale: Imperfek orang kedua jamak dalam konteks hukum menyatakan makanan yang diizinkan. ‘Boleh’ menyampaikan izin, sedangkan ‘kalian’ mempertahankan sapaan jamak.
- source_word: מִכָּל
  choice: dari antara segala
  rationale: Gabungan מן dan כל menyatakan pemilihan sebagian dari suatu kelompok yang lebih luas.
- source_word: הַבְּהֵמָה
  choice: binatang
  rationale: Dalam konteks peraturan makanan ini, istilah tersebut mencakup binatang darat secara luas dan tidak hanya ternak.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: yang ada di darat
  rationale: Frasa ini membedakan makhluk darat dari makhluk air dan kelompok lain yang dibahas kemudian. ‘Di darat’ paling jelas menyatakan fungsi kontekstual tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tetap lugas dan bermartabat. ‘Kalian’ dipakai untuk memperjelas bahwa sapaan dalam perkataan langsung berbentuk jamak; ‘umat Israel’ menghindari kesan bahwa hanya laki-laki yang dimaksud. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
