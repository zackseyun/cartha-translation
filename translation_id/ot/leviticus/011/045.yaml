  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: id
  text: Sebab Akulah Yahweh, yang membawa kamu keluar[a] dari tanah Mesir untuk menjadi Allah bagimu. Hendaklah kamu kudus, sebab Aku kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "yang membawa kamu naik." Kata kerja Ibrani berbentuk partisipel; dalam konteks keluaran dapat merujuk pada peristiwa yang telah terjadi, tetapi juga dapat diterjemahkan "yang membawa kamu keluar."
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung agar identitas nama perjanjian tetap tampak dan tidak dilebur ke dalam gelar.
- source_word: הַמַּעֲלֶה
  choice: yang membawa kamu keluar
  rationale: Partisipel hiphil dari עלה secara harfiah menggambarkan tindakan membawa naik. Dalam konteks peristiwa keluaran yang telah terjadi, bahasa Indonesia paling alami memakai bentuk lampau yang tersirat melalui konteks; 'keluar' menyampaikan gerak dari Mesir tanpa menambahkan gagasan penafsiran seperti 'menyelamatkan'.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Mempertahankan unsur eksplisit אֶרֶץ dan rumusan keluaran-perjanjian.
- source_word: לִהְיֹת לָכֶם לֵאלֹהִים
  choice: untuk menjadi Allahmu
  rationale: Ungkapan perjanjian ini dinyatakan secara wajar dalam bahasa Indonesia. Akhiran orang kedua jamak diterjemahkan dengan bentuk kolektif 'kamu', sebagaimana lazim dalam bahasa Indonesia.
- source_word: וִהְיִיתֶם
  choice: Kamu harus
  rationale: Dalam konteks ini bentuk tersebut memiliki daya perintah. 'Harus' mengungkapkan kewajiban dengan alami tanpa menjadikannya sekadar ramalan masa depan.
- source_word: קְדֹשִׁים
  choice: kudus
  rationale: '''Kudus'' adalah padanan mapan yang mencakup lebih dari sekadar ''terpisah'' dan mempertahankan bobot etis, ritual, serta relasional dalam konteks.'
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: sebab Aku kudus
  rationale: כִּי menyatakan dasar bagi tuntutan kekudusan Israel. 'Sebab' mempertahankan hubungan kausal sekaligus register yang bermartabat.
theological_decisions:
- issue: Dasar perjanjian bagi kekudusan umat
  choice: Tuntutan agar Israel kudus didasarkan pada identitas Yahweh, tindakan-Nya membawa mereka keluar dari Mesir, dan hubungan perjanjian-Nya sebagai Allah mereka.
  alternative: Membatasi ayat ini sebagai petunjuk kemurnian ritual tanpa arti perjanjian yang lebih luas.
  rationale: Konteks dekat membahas makanan dan kenajisan, tetapi ayat ini sendiri secara eksplisit menghubungkan kekudusan umat dengan keluaran, hubungan Allah-umat, dan kekudusan Allah sendiri.
- issue: Nilai waktu partisipel הַמַּעֲלֶה
  choice: 'Diterjemahkan sebagai tindakan keluaran yang telah terjadi: ''yang membawa kamu keluar''.'
  alternative: 'Diterjemahkan dengan nuansa kini atau berkelanjutan: ''yang membawa kamu keluar'' juga dapat dipahami sebagai gelar berciri kini dalam bahasa sumber.'
  rationale: Partisipel Ibrani tidak menentukan waktu seketat verba finit. Konteks historis menunjuk pada keluaran yang telah terjadi, sedangkan konstruksi relatif Indonesia tetap cukup lentur dan tidak perlu diberi keterangan waktu tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum, dengan pengulangan 'kudus' dipertahankan untuk menjaga hubungan langsung antara kekudusan umat dan kekudusan Allah.
