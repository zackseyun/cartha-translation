- from: Segala sesuatu yang ditimpa salah satu dari binatang-binatang itu setelah mati akan menjadi najis, baik perkakas dari kayu, pakaian, kulit, maupun kain karung—setiap perkakas yang digunakan untuk suatu pekerjaan. Benda itu harus dimasukkan ke dalam air[a] dan tetap najis sampai petang; sesudah itu benda itu menjadi tahir.
