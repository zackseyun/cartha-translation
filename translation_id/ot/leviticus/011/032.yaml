  verdict: revise
  source_fidelity: 'Draf pada dasarnya setia pada Ibrani: kenajisan akibat terkena salah satu bangkai, kategori benda, pencelupan/pemasukan ke dalam air, batas sampai petang, dan status tahir sesudahnya semuanya terwakili. Namun, “setelah mati” kurang tepat untuk בְּמֹתָם karena dapat terdengar hanya sebagai urutan waktu dan secara sintaktis dapat mengambang; “ketika binatang-binatang itu sudah mati” lebih jelas menyatakan keadaan bangkai. '
  naturalness: Rangkaian “akan menjadi najis, baik perkakas dari kayu, pakaian, kulit, maupun kain karung” tidak alami dan mengaburkan bahwa daftar itu menjelaskan cakupan “segala sesuatu.” Susunan dengan titik dua dan daftar “setiap ... atau ...” lebih jelas dalam bahasa Indonesia baku.
  terminology: “Najis/tahir” tepat untuk status ritual dalam hukum Imamat dan tidak perlu diganti. “Kain karung” merupakan padanan yang baik untuk שָׂק. “Perkakas” tetap dapat dipakai untuk כְּלִי, tetapi frasa rangkuman lebih luas jika memakai “benda apa pun yang dipakai untuk bekerja.”
  issues:
  - severity: medium
    issue: “setelah mati” untuk בְּמֹתָם
    rationale: Ungkapan ini dapat dibaca sebagai kejadian yang berlangsung sesudah kematian, bukan kontak dengan makhluk dalam keadaan mati. Teks Ibrani menyatakan keadaan/waktu “ketika mereka mati/sudah mati.”
  - severity: medium
    issue: Konstruksi daftar dengan “baik ... maupun”
    rationale: Setelah predikat “akan menjadi najis,” konstruksi itu tidak membentuk apposisi yang jelas dan menimbulkan kesan bahwa “perkakas” adalah subjek tambahan. Daftar kategori perlu ditata ulang.
  revised_text: 'Segala sesuatu yang ditimpa salah satu dari binatang-binatang itu ketika binatang itu sudah mati akan menjadi najis: setiap perkakas dari kayu, pakaian, kulit, atau kain karung, setiap benda yang dipakai untuk bekerja. Benda itu harus dimasukkan ke dalam air[a] dan tetap najis sampai petang; sesudah itu benda itu menjadi tahir.'
  revised_footnotes:
