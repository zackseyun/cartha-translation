  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: id
  text: 'Segala sesuatu yang ditimpa salah satu dari binatang-binatang itu ketika binatang itu sudah mati akan menjadi najis: setiap perkakas dari kayu, pakaian, kulit, atau kain karung, setiap benda yang dipakai untuk bekerja. Benda itu harus dimasukkan ke dalam air[a] dan tetap najis sampai petang; sesudah itu benda itu menjadi tahir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “harus dicelupkan ke dalam air.” Secara harfiah, bahasa Ibrani berbunyi “harus dibawa masuk ke dalam air.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: Segala sesuatu yang ditimpa salah satu dari binatang-binatang itu setelah mati
  rationale: Menyampaikan cakupan menyeluruh כֹּל dan hubungan kontak dalam klausa relatif. Rujukan 'binatang-binatang itu' mengikuti konteks ayat sebelumnya, sedangkan 'setelah mati' menegaskan keadaan bangkai tanpa menyiratkan bahwa benda itu ditimpa sebelum kematian.
- source_word: יִטְמָא
  choice: akan menjadi najis
  rationale: Bentuk verba menunjukkan perubahan menuju status kenajisan ritual akibat kontak, bukan kesalahan moral.
- source_word: מִכָּל כְּלִי עֵץ
  choice: baik perkakas dari kayu
  rationale: כְּלִי bermakna luas, mencakup perkakas, wadah, atau barang pakai. 'Perkakas' cocok dengan rangkuman berikutnya dan tidak membatasinya pada wadah.
- source_word: בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: pakaian, kulit, maupun kain karung
  rationale: '''Pakaian'' merupakan padanan alami bagi בֶגֶד; ''kulit'' tidak menentukan tingkat pengolahannya; ''kain karung'' menyatakan bahan tenun kasar tanpa menggeser makna menjadi pakaian perkabungan.'
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: setiap perkakas yang digunakan untuk suatu pekerjaan
  rationale: Merender konstruksi pasif dan fungsi instrumental secara alami serta mempertahankan sifat umum frasa rangkuman itu.
- source_word: בַּמַּיִם יוּבָא
  choice: harus dimasukkan ke dalam air
  rationale: Hofal dari בוא secara harfiah berarti 'dibawa masuk'; dalam konteks petunjuk pentahiran, 'dimasukkan' alami dan tetap dekat dengan citra sumber. Kemungkinan 'dicelupkan' dicatat dalam catatan kaki.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: dan tetap najis sampai petang; sesudah itu benda itu menjadi tahir
  rationale: Mengungkapkan durasi status najis dan pemulihan berikutnya. 'Najis/tahir' adalah pasangan istilah yang mapan dalam bahasa Indonesia untuk status ritual Imamat.
theological_decisions:
- issue: Sifat kenajisan dan ketahiran
  choice: Menggunakan 'najis/tahir' sebagai istilah status ritual-legal.
  alternative: cemar/murni atau kotor/bersih
  rationale: טמא dan טהר dalam konteks ini menyatakan status ritual, bukan dengan sendirinya kesalahan moral atau kebersihan jasmani. Pasangan 'najis/tahir' mempertahankan ranah hukum Imamat dengan jelas.
- issue: Saat terjadinya kontak dengan binatang mati
  choice: '''setelah mati'''
  alternative: '''ketika binatang-binatang itu mati'' atau ''dalam kematiannya'''
  rationale: Frasa בְּמֹתָם dapat menyatakan waktu atau keadaan kematian. 'Setelah mati' secara alami menunjukkan bahwa yang menajiskan adalah binatang dalam keadaan mati, tanpa menambahkan gagasan moral atau mekanisme lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dibuat alami dengan 'baik ... maupun', sedangkan 'benda itu' memperjelas subjek tunggal kolektif dalam kalimat berikutnya. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkannya.
