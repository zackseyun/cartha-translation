id: LEV.11.4
reference: Leviticus 11:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: id
  text: 'Namun, inilah yang tidak boleh kamu makan dari antara hewan-hewan yang memamah biak atau yang berkuku belah: unta, karena hewan itu memamah biak, tetapi kukunya tidak terbelah. Unta itu najis bagi kamu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “najis bagi kamu”—yakni, najis bagi Israel menurut hukum tentang makanan.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pembatasan atau pengecualian terhadap ketentuan pada ayat sebelumnya dengan penghubung adversatif yang alami dalam bahasa Indonesia.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: dari antara hewan yang memamah biak
  rationale: Ungkapan Ibrani secara harfiah menggambarkan hewan yang menaikkan kembali makanan; 'memamah biak' adalah padanan Indonesia yang baku dan jelas.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: ataupun yang berkuku belah
  rationale: Menunjukkan ciri klasifikasi kedua. 'Ataupun' sesuai dengan konteks, sebab contoh-contoh berikut memiliki salah satu ciri, tetapi tidak memenuhi gabungan kedua syarat.
- source_word: הַגָּמָל
  choice: unta
  rationale: Padanan langsung bagi nama hewan tersebut.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: karena unta memamah biak
  rationale: Menyatakan bahwa unta memenuhi salah satu dari kedua ciri; nomina diulangi agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: tetapi kukunya tidak terbelah
  rationale: Menyatakan pertentangan dan kegagalan memenuhi ciri kedua, dengan susunan yang alami tanpa mengubah klasifikasinya.
- source_word: טָמֵא הוּא לָכֶם
  choice: Unta itu najis bagi kamu
  rationale: '''Najis'' mempertahankan istilah utama dalam konteks kenajisan Imamat, sedangkan ''bagi kamu'' menjaga sudut pandang hukum-perjanjian dari teks Ibrani.'
theological_decisions:
- issue: Sifat kenajisan dalam hukum makanan Imamat
  choice: najis
  alternative: najis secara ritual
  rationale: Teks utama mempertahankan keluasan istilah Ibrani טָמֵא dan tidak mempersempitnya secara interpretatif menjadi 'ritual' atau 'seremonial'; konteks hukumnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam hukum yang lugas dan bermartabat. 'Kamu' dipakai secara kolektif sesuai sapaan jamak Ibrani kepada umat Israel. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
