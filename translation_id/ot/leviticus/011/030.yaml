translation:
  language: id
  text: tokek[a], biawak, kadal, kadal pasir, dan bunglon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Identifikasi tepat beberapa binatang dalam ayat ini tidak pasti. Usulan tradisional dan modern mencakup: untuk “tokek”, mungkin “cerpelai” atau “celurut”; untuk “biawak”, mungkin “bunglon”; untuk “kadal pasir”, mungkin “kadal skink” atau, menurut tradisi lama, “siput”; dan untuk “bunglon”, mungkin “tikus tanah” atau jenis kadal lainnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: tokek
  rationale: Identifikasi zoologisnya tidak pasti. Dalam konteks daftar binatang melata, sejenis kadal lebih mungkin daripada mamalia; “tokek” merupakan padanan modern yang alami dan tetap mudah dipahami.
- source_word: הַכֹּחַ
  choice: biawak
  rationale: Kata ini tampaknya menunjuk kepada kadal besar. “Biawak” adalah padanan Indonesia yang wajar bagi monitor lizard dan membedakannya dari jenis kadal lain dalam daftar ini.
- source_word: הַלְּטָאָה
  choice: kadal
  rationale: Karena jenis tepatnya tidak diketahui, istilah umum “kadal” mempertahankan arti zoologis tanpa memberi kesan kepastian yang tidak didukung sumber.
- source_word: הַחֹמֶט
  choice: kadal pasir
  rationale: Dalam daftar binatang melata ini, identifikasi sebagai sejenis kadal lebih sesuai daripada terjemahan lama “siput”. “Kadal pasir” adalah kemungkinan khusus yang masuk akal, meskipun tidak pasti.
- source_word: הַתִּנְשָׁמֶת
  choice: bunglon
  rationale: Walaupun kata Ibrani yang sama dapat menunjuk kepada burung di tempat lain, konteks langsung di sini menuntut sejenis binatang melata. “Bunglon” merupakan padanan kontekstual yang lazim, tetapi identifikasi tepatnya tetap diperdebatkan.
