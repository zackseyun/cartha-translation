translation:
  language: id
  text: Dan hewan-hewan itu harus kamu anggap menjijikkan[a]; kamu tidak boleh memakan sedikit pun daging hewan-hewan itu, dan bangkai hewan-hewan itu harus kamu anggap menjijikkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “harus menjadi sesuatu yang menjijikkan bagimu.” Istilah Ibrani ini menunjuk pada sesuatu yang secara ritual dipandang pantang dan menjijikkan dalam konteks ketentuan makanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: menjijikkan
  rationale: Kata benda ini menunjuk pada sesuatu yang dipandang sangat menjijikkan atau pantang dalam konteks ketentuan makanan. Bentuk adjektival ini alami dalam bahasa Indonesia dan mempertahankan kuatnya penilaian ritual tersebut tanpa menyamakannya dengan istilah Ibrani lain yang berarti “najis”.
- source_word: יִהְיוּ לָכֶם
  choice: harus kamu anggap
  rationale: Secara harfiah, frasa ini berarti “akan menjadi bagimu.” Dalam konteks hukum, “harus kamu anggap” menyampaikan bahwa umat Israel diwajibkan memandang hewan-hewan tersebut dengan cara demikian.
- source_word: מִבְּשָׂרָם
  choice: sedikit pun dari dagingnya
  rationale: 'Preposisi מִן sesudah verba makan yang dinegasikan bersifat partitif: tidak boleh memakan bagian mana pun dari dagingnya. “Sedikit pun dari” menyatakan larangan menyeluruh itu secara wajar dalam bahasa Indonesia.'
- source_word: לֹא תֹאכֵלוּ
  choice: jangan makan
  rationale: Bentuk imperfek dengan negasi dalam ketentuan hukum menyatakan larangan. “Jangan makan” merupakan bentuk larangan yang langsung, tegas, dan alami dalam bahasa Indonesia modern.
- source_word: נִבְלָתָם
  choice: bangkainya
  rationale: Kata נְבֵלָה menunjuk pada tubuh hewan yang sudah mati. “Bangkai” adalah padanan Indonesia yang paling tepat dalam konteks hewan dan hukum makanan.
- source_word: תְּשַׁקֵּצוּ
  choice: harus kamu anggap menjijikkan
  rationale: Verba Piel yang seakar dengan שֶׁקֶץ ini berarti menganggap atau memperlakukan sesuatu sebagai hal yang menjijikkan. Pilihan ini mempertahankan hubungan leksikal dengan klausa pertama dan tidak membatasinya pada perasaan jijik belaka.
theological_decisions:
- issue: Sifat bahasa kenajisan dalam hukum makanan
  choice: Menggunakan bahasa penilaian ritual “menjijikkan,” bukan istilah moral yang lebih luas seperti “kekejian.”
  alternative: Menerjemahkan dengan “kekejian” untuk diksi tradisional yang lebih kuat, atau dengan “najis” agar lebih sederhana.
  rationale: Ayat ini membahas pembedaan makanan dalam perjanjian Israel. “Menjijikkan” mempertahankan penilaian negatif yang kuat tanpa memasukkan kategori moral yang lebih luas atau meleburkannya dengan kosakata Ibrani lain untuk kenajisan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan tegas. Bentuk tunggal “kamu” mengikuti sapaan kolektif Ibrani kepada Israel; akhiran “-nya” dipakai secara kolektif untuk hewan-hewan yang dibicarakan. Tanda titik koma mempertahankan keterkaitan erat antarklausa.
