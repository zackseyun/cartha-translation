  text: וְ/כִ֤י יִפֹּל֙ מִ/נִּבְלָתָ֔/ם עַל כָּל זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: id
  text: Jika sebagian dari bangkai binatang-binatang itu jatuh ke atas benih apa pun yang disediakan untuk ditabur,[a] benih itu tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika salah satu bangkai binatang-binatang itu jatuh ke atas benih apa pun yang akan ditabur.” Ungkapan Ibrani מִנִּבְלָתָם dapat dipahami secara partitif (“sebagian dari bangkai”) atau secara kolektif/jamak (“salah satu bangkai”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Dalam rangkaian hukum kasuistis, frasa ini memperkenalkan suatu keadaan bersyarat. Hubungan dengan ayat sebelumnya sudah tersirat dalam kesinambungan teks Indonesia, sehingga 'Jika' lebih alami daripada 'Dan jika'.
- source_word: יִפֹּל
  choice: jatuh
  rationale: Bentuk imperfek Qal dari נפל menyatakan kejadian yang menjadi syarat dalam ketentuan hukum; bentuk kini 'jatuh' tepat dan lugas dalam bahasa Indonesia.
- source_word: מִנִּבְלָתָם
  choice: sebagian dari bangkai binatang-binatang itu
  rationale: Preposisi מִן dapat dipahami secara partitif, sedangkan נְבֵלָה menunjuk pada bangkai binatang yang membawa kenajisan dalam konteks ini. Penyebutan 'binatang-binatang itu' memperjelas acuan sufiks orang ketiga jamak tanpa membuatnya terdengar seolah-olah bangkai manusia.
- source_word: עַל כָּל
  choice: ke atas ... apa pun
  rationale: עַל menyatakan lokasi 'di atas/pada', dan כָּל dalam ketentuan bersyarat ini paling alami diberi daya distributif dengan 'apa pun'.
- source_word: זֶרַע זֵרוּעַ אֲשֶׁר יִזָּרֵעַ
  choice: benih apa pun yang disediakan untuk ditabur
  rationale: Ungkapan ini menekankan benih sebagai benih tabur dan menyertakan tujuan prospektif dari klausa relatif. 'Disediakan untuk ditabur' mempertahankan maksud tersebut tanpa pengulangan yang kaku.
- source_word: טָהוֹר הוּא
  choice: benih itu tahir
  rationale: טָהוֹר dalam hukum Imamat menyatakan status ketahiran, bukan kebersihan fisik. Subjek 'benih itu' dinyatakan kembali agar rujukannya jelas dalam bahasa Indonesia; teks tidak menambahkan kata interpretatif 'tetap'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang lugas dan bermartabat. Istilah 'tahir' dipakai untuk status ritual dalam Imamat, sedangkan konstruksi yang berulang dalam bahasa Ibrani diungkapkan secara alami tanpa menghilangkan tujuan benih untuk ditabur.
