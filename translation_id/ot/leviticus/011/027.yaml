  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: ayat ini membahas binatang yang berjalan pada telapak kaki/cakarnya di antara binatang berkaki empat, status kenajisan ritualnya, serta kenajisan orang yang menyentuh bangkainya hingga petang. Namun, sufiks jamak Ibrani pada בְּנִבְלָתָם lebih jelas dipertahankan dalam bahasa Indonesia sebagai “bangkai mereka,” bukan “bangkainya.”'
