base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: id
  text: Setiap binatang yang berjalan dengan telapak kakinya, di antara semua binatang yang berjalan dengan empat kaki, adalah najis bagimu. Siapa pun yang menyentuh bangkai mereka akan menjadi najis sampai petang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: Setiap binatang yang berjalan dengan telapak kakinya
  rationale: Partisipel tunggal bersifat distributif dan dalam konteks ini menunjuk kepada binatang. כַּף secara harfiah adalah telapak atau bagian bawah kaki; 'telapak kakinya' alami dan cukup luas untuk berbagai binatang.
- source_word: בְּכָל הַחַיָּה הַהֹלֶכֶת עַל אַרְבַּע
  choice: di antara segala binatang yang berjalan dengan keempat kakinya
  rationale: חַיָּה di sini berarti binatang darat, sedangkan ungkapan 'berjalan dengan keempat kakinya' menyampaikan idiom Ibrani secara jelas dalam bahasa Indonesia.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: adalah najis bagimu
  rationale: '''Najis'' merupakan istilah baku untuk status ritual טמא dan tidak menyiratkan bahwa binatang itu bersalah secara moral.'
- source_word: כָּל הַנֹּגֵעַ
  choice: Siapa pun yang menyentuh
  rationale: Menyampaikan daya distributif dan ketentuan hukum ungkapan Ibrani secara alami.
- source_word: בְּנִבְלָתָם
  choice: bangkainya
  rationale: נְבֵלָה menunjuk kepada tubuh mati binatang. Bentuk Ibrani memakai nomina tunggal dengan sufiks jamak dan berfungsi secara kolektif.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: menjadi najis sampai petang
  rationale: Bentuk imperfek dalam konteks hukum menyatakan akibat status ritual; 'menjadi najis' lebih alami dalam bahasa Indonesia daripada bentuk futur eksplisit.
theological_decisions:
- issue: Istilah kemurnian ritual
  choice: najis
  alternative: cemar; tidak tahir
  rationale: Ayat ini mengatur status ritual, bukan terutama kesalahan moral. 'Najis' adalah istilah Indonesia yang mapan dan tepat untuk טמא dalam hukum Imamat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang khidmat. Struktur dihaluskan agar alami tanpa menghapus sifat kolektif dan distributif teks Ibrani.
