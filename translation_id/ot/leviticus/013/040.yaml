translation:
  language: id
  text: Jika seorang laki-laki kehilangan rambut di kepalanya[a], ia botak; ia tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika seorang laki-laki menjadi botak.” Kata kerja Ibrani dapat berarti menjadi tidak berambut atau kehilangan rambut; teks utama mempertahankan perbedaan verbal sebelum pernyataan “ia botak”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: seorang laki-laki
  rationale: Nomina maskulin tunggal ini memperkenalkan suatu kasus dalam ketentuan pemeriksaan tubuh; pilihan ini mempertahankan bentuk dan rujukan sumber.
- source_word: כִּי
  choice: jika
  rationale: Dalam konteks hukum dan diagnosis, כִּי memperkenalkan keadaan bersyarat.
- source_word: יִמָּרֵט רֹאשׁוֹ
  choice: rambut kepalanya rontok
  rationale: Bentuk Nifal dari מרט menyatakan kepala menjadi gundul atau kehilangan rambut tanpa menentukan penyebabnya. Ungkapan ini alami dalam bahasa Indonesia dan tetap membedakannya dari predikat berikutnya, קֵרֵחַ.
- source_word: קֵרֵחַ
  choice: botak
  rationale: Adjektiva ini menyatakan keadaan yang dihasilkan secara jelas dan alami.
- source_word: טָהוֹר
  choice: tahir
  rationale: Dalam Imamat 13, istilah ini menunjuk pada status ritual dalam pemeriksaan penyakit kulit, bukan kemurnian moral.
- source_word: הוּא ... הוּא
  choice: ia ... ia
  rationale: Kedua klausa predikatif dipertahankan untuk mencerminkan pengulangan dan penegasan dalam bahasa Ibrani.
theological_decisions:
- issue: Istilah status ritual dalam ketentuan kenajisan Imamat
  choice: tahir
  alternative: bersih; suci
  rationale: “Tahir” mempertahankan kategori ritual yang berlawanan dengan najis dan menghindari kesan bahwa ayat ini berbicara tentang kebersihan jasmani atau kesucian moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat ringkas seperti ketentuan kasus hukum, dengan istilah ritual “tahir” dipertahankan demi ketepatan konteks.
