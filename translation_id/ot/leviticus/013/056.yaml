  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: id
  text: Namun, jika imam memeriksanya dan ternyata bercak itu telah memudar setelah dicuci, ia harus menyobek bagian yang terkena itu dari pakaian, bahan kulit, benang lungsin, atau benang pakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Benang lungsin ialah benang yang memanjang pada tenunan, sedangkan benang pakan melintanginya.
    reason: Menjelaskan dua istilah teknis pertenunan yang mempertahankan perincian dalam teks Ibrani.
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menyatakan kelanjutan bersyarat sekaligus perkembangan yang sedikit berlawanan dengan prosedur sebelumnya.
- source_word: רָאָה הַכֹּהֵן
  choice: imam memeriksanya
  rationale: Secara harfiah berarti imam 'melihat', tetapi dalam konteks hukum pemeriksaan, 'memeriksa' menyampaikan tindakan penilaian dengan lebih wajar.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Mengungkapkan penanda perhatian dan hasil pengamatan dalam bahasa Indonesia modern tanpa memakai ungkapan yang terlalu arkais.
- source_word: כֵּהָה הַנֶּגַע
  choice: bercak itu telah memudar
  rationale: כֵּהָה menunjukkan bahwa tampilan bercak menjadi kurang kuat, sedangkan נֶגַע di sini menunjuk pada bagian bahan yang tampak terkena kelainan.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: setelah dicuci
  rationale: Mempertahankan bentuk pasif Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: וְקָרַע אֹתוֹ
  choice: ia harus menyobek bagian yang terkena itu
  rationale: Konteks menunjukkan bahwa bagian yang terkena harus disobek dan dikeluarkan, bukan bahwa seluruh benda harus dimusnahkan.
- source_word: מִן הַבֶּגֶד
  choice: dari pakaian
  rationale: Padanan umum dan alami bagi בֶּגֶד dalam konteks bahan atau barang pakaian.
- source_word: מִן הָעוֹר
  choice: kulit
  rationale: Dalam konteks benda dan bahan, עוֹר mengacu pada kulit yang dipakai sebagai bahan, bukan kulit manusia.
- source_word: מִן הַשְּׁתִי
  choice: benang lungsin
  rationale: Istilah teknis Indonesia bagi benang yang memanjang pada tenunan dan mempertahankan ketepatan material teks sumber.
- source_word: מִן הָעֵרֶב
  choice: benang pakan
  rationale: Istilah teknis Indonesia bagi benang melintang pada tenunan, sebagai pasangan benang lungsin.
