  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'dan ternyata' mempertahankan daya penunjuk וְהִנֵּה secara alami; istilah pertenunan yang tepat dipertahankan lalu dijelaskan dalam catatan kaki.
