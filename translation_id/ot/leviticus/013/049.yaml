  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: id
  text: Jika bercak itu berwarna kehijauan atau kemerahan pada pakaian, bahan kulit, benang lungsin atau benang pakan,[a] atau pada barang apa pun dari kulit, itu adalah bercak penyakit kulit.[b] Bercak itu harus diperlihatkan kepada imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Benang lungsin ialah benang yang memanjang dalam tenunan, sedangkan benang pakan ialah benang yang melintang.
    reason: Penjelasan istilah teknis tekstil.
  - marker: b
    text: Secara tradisional diterjemahkan “bercak kusta”. Istilah Ibrani tsaraat menunjuk pada kategori kelainan ritual-fisik yang lebih luas daripada penyakit Hansen modern dan dalam pasal ini juga dapat mengenai kain serta bahan kulit.
    reason: Mencegah penyamaan istilah Ibrani dengan diagnosis medis modern sekaligus menjelaskan penerapannya pada benda.
lexical_decisions:
- source_word: הַנֶּגַע / נֶגַע
  choice: bercak
  rationale: Dalam konteks pemeriksaan pakaian dan bahan kulit, kata ini menunjuk pada bagian yang tampak terkena kelainan. “Bercak” alami dalam bahasa Indonesia dan tetap cocok untuk benda mati.
- source_word: יְרַקְרַק
  choice: berwarna kehijauan
  rationale: Bentuk Ibrani menunjukkan rona hijau yang tidak dinyatakan sebagai hijau murni; “kehijauan” mempertahankan sifat perkiraan warna itu.
- source_word: אֲדַמְדָּם
  choice: kemerahan
  rationale: Bentuk reduplikatif menunjukkan rona merah; “kemerahan” menyampaikan pengamatan warna tanpa menentukan corak secara berlebihan.
- source_word: בֶּגֶד
  choice: pakaian
  rationale: Dalam daftar ini kata tersebut paling wajar dipahami sebagai pakaian atau benda sandang dari kain.
- source_word: עוֹר
  choice: bahan kulit
  rationale: Yang dimaksud ialah kulit binatang sebagai bahan, bukan kulit manusia yang hidup. “Bahan kulit” mencegah salah pengertian dan tetap cukup luas.
- source_word: שְׁתִי
  choice: benang lungsin
  rationale: Istilah tekstil Indonesia untuk benang yang memanjang pada tenunan.
- source_word: עֵרֶב
  choice: benang pakan
  rationale: Istilah tekstil Indonesia untuk benang melintang pada tenunan; catatan kaki menjelaskannya bagi pembaca umum.
- source_word: כְּלִי עוֹר
  choice: barang apa pun dari kulit
  rationale: כְּלִי merupakan istilah luas bagi benda atau perkakas. Terjemahan ini tidak mempersempit jenis barang yang dimaksud.
- source_word: נֶגַע צָרַעַת
  choice: bercak penyakit kulit
  rationale: צָרַעַת adalah kategori ritual-fisik dalam Imamat dan tidak sama secara khusus dengan penyakit Hansen modern. Ungkapan ini mengikuti istilah umum pasal tersebut sambil mempertahankan ketegangan bahwa kategori yang sama juga dapat dikenakan pada kain dan kulit.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: Benda itu harus diperlihatkan kepada imam
  rationale: Bentuk Hofal bersifat pasif dan tidak menyebut pelaku. “Benda itu” memperjelas acuan dalam bahasa Indonesia tanpa menentukan siapa yang membawanya.
theological_decisions:
- issue: Penerjemahan צָרַעַת dalam hukum keimaman
  choice: penyakit kulit
  alternative: kusta; tsaraat
  rationale: “Kusta” mudah disalahpahami sebagai diagnosis modern penyakit Hansen, padahal kategori Ibrani ini juga diterapkan pada pakaian dan barang dari kulit. “Penyakit kulit” lebih mudah dipahami, sedangkan catatan kaki menjaga keluasan kategori ritual-fisik aslinya dan mengakui bahwa penerapannya pada benda tidak identik dengan diagnosis medis modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Istilah teknis “lungsin” dan “pakan” dipertahankan untuk ketepatan, lalu dijelaskan dalam catatan kaki. Bentuk pasif pada akhir ayat mengikuti bentuk Ibrani dan membiarkan pelakunya tetap tidak disebutkan.
