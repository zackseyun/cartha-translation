base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: id
  text: Jika imam memeriksanya dan ternyata kelainan bersisik[a] itu telah menyebar pada kulit, imam tidak perlu memeriksa apakah ada rambut kuning; orang itu najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Istilah Ibrani yang diterjemahkan “kelainan bersisik” menunjuk pada kelainan kulit, khususnya di kepala atau janggut; terjemahan lain: “kudis.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ הַכֹּהֵן
  choice: Jika imam memeriksanya
  rationale: Dalam konteks hukum pemeriksaan imam, ראה berarti memeriksa atau menilai. Konteks rangkaian ketentuan memberi klausa ini daya bersyarat, sehingga 'jika' wajar dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Menyampaikan penanda hasil pengamatan secara alami tanpa kehilangan daya deiktisnya.
- source_word: פָּשָׂה
  choice: telah menyebar
  rationale: Menggambarkan meluasnya kelainan, sesuai pemakaian istilah ini dalam peraturan penyakit kulit.
- source_word: הַנֶּתֶק
  choice: kelainan bersisik
  rationale: נתק menunjuk pada kelainan khusus di kepala atau janggut. 'Kelainan bersisik' cukup jelas dan tidak menyatakan penyebab medis yang tidak diberikan teks.
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: Ungkapan Indonesia yang alami untuk lokasi penyebaran kelainan.
- source_word: לֹא יְבַקֵּר הַכֹּהֵן
  choice: imam tidak perlu mencari
  rationale: Dalam konteks ini בקר berarti menyelidiki atau memeriksa tanda lebih lanjut; penyangkalan menunjukkan pemeriksaan tanda itu tidak lagi diperlukan.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: rambut yang kuning
  rationale: Padanan langsung bagi tanda diagnostik yang telah disebutkan dalam bagian sebelumnya.
- source_word: טָמֵא הוּא
  choice: orang itu najis
  rationale: Pronomina Ibrani merujuk kepada orang yang diperiksa. 'Najis' adalah istilah Indonesia yang mapan untuk status ketahiran ritual ini.
theological_decisions:
- issue: Makna טָמֵא dalam hukum ketahiran Imamat
  choice: najis
  alternative: cemar; tidak tahir
  rationale: Istilah ini menyatakan status ritual menurut hukum keimaman, bukan dengan sendirinya kesalahan moral. 'Najis' paling mapan dan ringkas dalam bahasa Alkitab Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur prosedural dibuat alami, sementara istilah hukum ketahiran 'najis' dipertahankan. Penanda catatan kaki ditempatkan sesudah pernyataan status karena catatan menjelaskan istilah yang muncul sebelumnya dalam ayat.
