  to: Sesudah bagian yang terkena itu dicuci, imam harus memeriksanya. Jika bagian yang terkena itu tidak berubah penampilannya[a] dan tidak meluas, benda itu najis. Benda itu harus dibakar dalam api; itu adalah kerusakan yang menggerogoti[b], entah pada bagian yang aus atau pada bagian yang gundul[c].
