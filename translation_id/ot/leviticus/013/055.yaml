  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: id
  text: Sesudah bagian yang terkena itu dicuci, imam harus memeriksanya. Jika bagian yang terkena itu tidak berubah penampilannya[a] dan tidak meluas, benda itu najis. Benda itu harus dibakar dalam api; itu adalah kerusakan yang menggerogoti[b], entah pada bagian yang aus atau pada bagian yang gundul[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak berubah warnanya.” Ungkapan Ibraninya secara harfiah berbunyi “tidak mengubah matanya” dan menunjuk pada tampilan yang terlihat.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kerusakan yang mengikis,” atau secara tradisional, “fret.” Istilah Ibraninya menunjuk pada kerusakan bahan yang bersifat merusak atau menggerogoti.'
    reason: lexical_alternative
  - marker: c
    text: Frasa penutup ini sulit dipastikan. Secara harfiah, istilah-istilah Ibraninya berarti “pada kebotakannya atau pada kebotakan dahinya”; dalam konteks ini, tampaknya yang dimaksud ialah bagian atau permukaan bahan yang aus dan bagian atau permukaan lainnya yang gundul. Makna tepat pasangan istilah ini tidak pasti.
    reason: textual_or_semantic_difficulty
lexical_decisions:
- source_word: וְרָאָה
  choice: imam harus memeriksanya
  rationale: Dalam konteks diagnosis keimaman, ראה berarti memeriksa, bukan sekadar melihat.
- source_word: אַחֲרֵי הֻכַּבֵּס
  choice: sesudah bagian yang terkena itu dicuci
  rationale: Bentuk pasif כבס menunjukkan bahwa bagian atau benda yang terkena telah dicuci.
- source_word: הַנֶּגַע
  choice: bagian yang terkena
  rationale: נגע menunjuk pada bagian yang mengalami kelainan; pilihan ini cukup luas dan tidak memaksakan diagnosis modern.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: tidak berubah penampilannya
  rationale: Ungkapan harfiah 'tidak mengubah matanya' menunjuk pada tampilan yang terlihat, mungkin terutama warnanya.
- source_word: לֹא פָשָׂה
  choice: tidak meluas
  rationale: פשה berarti menyebar atau meluas dalam konteks kelainan pada kulit maupun bahan.
- source_word: טָמֵא הוּא
  choice: benda itu najis
  rationale: Najis merupakan padanan baku dan tepat bagi status ketahiran ritual dalam Imamat.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Benda itu harus dibakar dalam api
  rationale: Ungkapan ini menyampaikan kewajiban hukum dan menjelaskan bahwa objek yang dibakar ialah benda atau bahan tersebut.
- source_word: פְּחֶתֶת
  choice: kerusakan itu bersifat menggerogoti
  rationale: Istilah langka ini menunjuk pada kemerosotan atau kerusakan yang merusak bahan; terjemahan ini tidak menetapkannya sebagai jenis jamur modern tertentu.
- source_word: בְּקָרַחְתּוֹ ... בְגַבַּחְתּוֹ
  choice: pada sisi belakang atau sisi depannya
  rationale: Dalam konteks benda dari kain atau kulit, pasangan istilah yang secara harfiah berkaitan dengan kebotakan kepala ini paling mungkin menunjuk pada dua sisi atau permukaan bahan; kepastian maknanya tetap rendah dan dicatat dalam catatan kaki.
