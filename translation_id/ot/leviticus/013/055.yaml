  naturalness: Bahasa draf pada umumnya baku dan jelas. “Kerusakan itu bersifat menggerogoti” kurang idiomatis sebagai predikasi; “itu adalah kerusakan yang menggerogoti” lebih alami. “Pada bagian yang aus atau bagian yang gundul” juga tetap mudah dipahami sambil menjaga ketidakpastian leksikal.
  terminology: “Imam,” “najis,” dan “dibakar dalam api” sesuai dengan register hukum-ketahiran dalam Imamat. “Bagian yang terkena” cukup netral dan tidak memaksakan diagnosis modern.
