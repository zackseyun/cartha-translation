  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: א֤וֹ בִֽ/שְׁתִי֙ א֣וֹ בְ/עֵ֔רֶב לַ/פִּשְׁתִּ֖ים וְ/לַ/צָּ֑מֶר א֣וֹ בְ/ע֔וֹר א֖וֹ בְּ/כָל מְלֶ֥אכֶת עֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: id
  text: atau pada benang lungsin atau benang pakan dari linen atau wol, atau pada kulit, atau pada barang apa pun yang terbuat dari kulit—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתִי
  choice: benang lungsin
  rationale: Istilah ini menunjuk pada benang yang memanjang pada tenunan; “benang lungsin” adalah padanan baku dan jelas dalam bahasa Indonesia.
- source_word: עֵרֶב
  choice: benang pakan
  rationale: Istilah ini menunjuk pada benang melintang yang disilangkan dengan lungsin; “benang pakan” adalah pasangan teknis baku bagi “benang lungsin”.
- source_word: לַפִּשְׁתִּים
  choice: dari linen
  rationale: Walaupun פִּשְׁתִּים dapat berarti rami, konteks bahan tenunan menunjuk pada linen yang dibuat dari serat rami.
- source_word: וְלַצָּמֶר
  choice: atau wol
  rationale: צֶמֶר berarti wol. Konjungsi Ibrani dalam rangkaian ini secara idiomatis menyatakan pilihan bahan, sehingga diterjemahkan “atau”.
- source_word: עוֹר
  choice: kulit
  rationale: Dalam konteks benda yang dapat digunakan atau dibuat, עוֹר menunjuk pada kulit binatang sebagai bahan; “kulit” merupakan padanan Indonesia yang alami tanpa harus menentukan tingkat pengolahannya.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: pada barang apa pun yang terbuat dari kulit
  rationale: מְלָאכָה di sini menunjuk pada hasil pekerjaan atau benda buatan, bukan pekerjaan abstrak. Ungkapan ini menyampaikan arti produk kulit secara jelas dan alami.
- source_word: אוֹ ... אוֹ
  choice: atau ... atau
  rationale: Pengulangan אוֹ menandai serangkaian pilihan tempat atau bahan; pengulangannya dipertahankan sejauh wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Istilah tekstil “benang lungsin” dan “benang pakan” dipakai karena tepat dan lazim dalam terminologi pertenunan. Ayat ini merupakan kelanjutan sintaksis dari ayat sebelumnya, sehingga tanda pisah pada akhir dipertahankan.
