  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: id
  text: Atau, jika daging yang terbuka[a] itu berubah kembali menjadi putih, orang itu harus datang kepada imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daging yang hidup”.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ כִ֥י
  choice: Atau, jika
  rationale: Gabungan partikel ini memperkenalkan kemungkinan lain dalam prosedur pemeriksaan; “Atau, jika” mempertahankan daya disjungtif sekaligus bersyarat.
- source_word: יָשׁ֛וּב
  choice: berubah kembali
  rationale: Kata kerja שׁוב menyatakan kembalinya keadaan sebelumnya; bersama verba berikutnya, frasa ini menunjukkan bahwa kondisi daging berbalik dan kembali menjadi putih.
- source_word: הַ/בָּשָׂ֥ר הַ/חַ֖י
  choice: daging yang terbuka
  rationale: Secara harfiah berarti “daging yang hidup”, tetapi dalam konteks diagnosis penyakit kulit menunjuk pada jaringan hidup yang tampak terbuka. Pilihan ini lebih jelas bagi pembaca modern tanpa memasukkan diagnosis medis tertentu.
- source_word: וְ/נֶהְפַּ֣ךְ לְ/לָבָ֑ן
  choice: menjadi putih
  rationale: Bentuk Nifal menyatakan perubahan keadaan, dan לָבָן adalah warna putih. Digabung dengan “berubah kembali” agar urutan Ibrani tersampaikan secara alami.
- source_word: וּ/בָ֖א אֶל הַ/כֹּהֵֽן
  choice: orang itu harus datang kepada imam
  rationale: Dalam konteks hukum-prosedural, tindakan berikutnya adalah orang yang diperiksa datang kepada imam. Subjek diperjelas sebagai “orang itu” agar tidak disalahpahami sebagai daging.
