  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: id
  text: Orang yang terkena penyakit kulit, yang memiliki tanda penyakit itu, harus mengenakan pakaian yang koyak, membiarkan rambut kepalanya terurai, menutupi bagian atas bibirnya[a], dan berseru, “Najis! Najis!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menutupi daerah kumisnya.” Ungkapan Ibrani menunjuk pada penutupan daerah bibir atas atau kumis sebagai tanda dukacita dan peringatan kepada orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: orang yang terkena penyakit kulit
  rationale: Istilah Ibrani menunjuk pada orang yang terkena kategori penyakit kulit dalam hukum Imamat dan tidak boleh dipersempit menjadi penyakit Hansen.
- source_word: הַנֶּגַע
  choice: tanda penyakit
  rationale: Dalam konteks pemeriksaan Imamat 13, נֶגַע menunjuk pada kelainan atau tanda penyakit yang menyebabkan status kenajisan; pilihan ini menghindari kesan khusus tentang infeksi kuman modern.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: harus mengenakan pakaian yang koyak
  rationale: Ungkapan ini menyatakan bahwa pakaiannya harus berada dalam keadaan terkoyak, suatu tanda lahiriah dukacita atau keadaan gawat.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: membiarkan rambut kepalanya terurai
  rationale: פָרוּעַ lebih mungkin menggambarkan rambut yang dibiarkan lepas atau tidak terurus daripada kepala yang telanjang.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: menutupi bagian atas bibirnya
  rationale: שָׂפָם dapat menunjuk pada bibir atas atau daerah kumis. Terjemahan ini mempertahankan rujukan anatominya tanpa mengandaikan bahwa orang itu berkumis.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: dan berseru, “Najis! Najis!”
  rationale: Pengulangan טָמֵא merupakan seruan publik yang tegas mengenai status kenajisan ritual.
theological_decisions:
- issue: Makna kenajisan dalam Imamat 13
  choice: Najis
  alternative: Cemar; tidak tahir
  rationale: טָמֵא di sini terutama menyatakan status ritual dan sosial menurut hukum Imamat, bukan dengan sendirinya kesalahan moral atau diagnosis medis modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal maskulin Ibrani diterjemahkan secara alami dengan “orang” tanpa menambahkan jenis kelamin yang tidak perlu. Penanda catatan kaki ditempatkan pada frasa bibir atas karena catatan tersebut menjelaskan וְעַל שָׂפָם יַעְטֶה.
