id: LEV.13.2
reference: Leviticus 13:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: id
  text: Apabila pada kulit tubuh seseorang terdapat pembengkakan, keropeng, atau bercak cerah, lalu hal itu menjadi suatu kelainan kulit[a] pada kulit tubuhnya, orang itu harus dibawa kepada Imam Harun atau kepada salah seorang putranya yang menjadi imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “kusta” atau “penyakit kusta”. Kata Ibrani צָרָעַת (tsaraat) menunjuk pada kategori gangguan kulit yang lebih luas dan tidak serta-merta dapat disamakan dengan penyakit Hansen.
    reason: Menjelaskan padanan tradisional sambil menghindari penyamaan otomatis istilah Ibrani tersebut dengan diagnosis medis modern.
lexical_decisions:
- source_word: אָדָם
  choice: seseorang
  rationale: Kata ini memperkenalkan satu kasus hukum secara generik. “Seseorang” alami dalam bahasa Indonesia dan tidak menambahkan pembatasan jenis kelamin yang tidak dituntut oleh konteks.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: pada kulit tubuhnya
  rationale: Ungkapan ini mempertahankan acuan anatomis konkret dan pengulangannya dalam ayat, tetapi memakai susunan Indonesia yang wajar.
- source_word: שְׂאֵת
  choice: pembengkakan
  rationale: Istilah ini menunjuk pada bagian kulit yang meninggi atau membengkak; “pembengkakan” jelas tanpa menetapkan diagnosis modern tertentu.
- source_word: סַפַּחַת
  choice: keropeng
  rationale: Referen dermatologisnya tidak pasti. “Keropeng” mempertahankan gambaran lesi kulit yang konkret dan merupakan padanan tradisional yang mudah dipahami.
- source_word: בַּהֶרֶת
  choice: bercak cerah
  rationale: Kata ini menunjuk pada tanda kulit yang terang, pucat, atau mengilap. “Bercak cerah” mempertahankan keluasan makna tanpa mempersempitnya menjadi bercak putih.
- source_word: לְנֶגַע צָרָעַת
  choice: menjadi gejala penyakit kulit[a]
  rationale: נֶגַע menunjuk pada bagian yang terkena, lesi, atau gejala penyakit, sedangkan צָרָעַת adalah kategori gangguan kulit dalam teks ini. Ungkapan Indonesia ini mudah dipahami dan tidak menyamakannya secara otomatis dengan penyakit Hansen.
- source_word: וְהוּבָא
  choice: harus dibawa
  rationale: Bentuk pasif ini menyampaikan kewajiban prosedural dalam hukum dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: Imam Harun
  rationale: Susunan gelar di depan nama merupakan bentuk Indonesia yang alami untuk menyatakan Harun dalam jabatannya sebagai imam.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: salah seorang anaknya yang menjadi imam
  rationale: Padanan ini mempertahankan hubungan keluarga dan status keimaman mereka tanpa menghasilkan susunan aposisional yang kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan צָרָעַת
  choice: penyakit kulit
  alternative: kusta; penyakit yang menajiskan; tsaraat
  rationale: צָרָעַת mencakup kategori gangguan yang lebih luas daripada penyakit Hansen modern. “Penyakit kulit” menghindari diagnosis medis yang terlalu sempit, sedangkan padanan tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum kasus dipertahankan dengan “Apabila ... harus ...”. Pengulangan “kulit tubuh” dipertahankan karena menonjol dalam teks Ibrani, sementara istilah teknis medis yang tidak perlu dihindari.
