base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: id
  text: Pada hari ketujuh, imam harus memeriksa orang itu. Jika bercak itu benar-benar telah menyebar pada kulit, imam harus menyatakan orang itu najis; itu adalah bercak penyakit kulit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “kusta”. Istilah Ibrani ini mencakup berbagai kondisi kulit dalam hukum kemurnian Israel dan tidak selalu merujuk pada kusta modern (penyakit Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: imam harus memeriksanya
  rationale: Secara harfiah verba ini berarti 'melihat', tetapi dalam prosedur diagnosis imamat konteksnya menuntut arti 'memeriksa'.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Padanan waktu yang langsung, alami, dan tetap dekat dengan susunan Ibrani.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: jika ... benar-benar telah menyebar
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan pada tindakan menyebar; 'benar-benar' mempertahankan daya tekan itu dalam bahasa Indonesia alami.
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: עוֹר berarti kulit; 'pada kulit' merupakan ungkapan Indonesia yang paling wajar untuk penyebaran bercak kulit.
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  choice: imam harus menyatakan orang itu najis
  rationale: Dalam hukum kemurnian, imam memberikan keputusan resmi mengenai status kenajisan, bukan menyebabkan orang itu menjadi najis.
- source_word: נֶגַע
  choice: bercak
  rationale: Dalam konteks pemeriksaan kulit, kata ini menunjuk pada bagian atau tanda yang terkena. 'Bercak' konkret dan mudah dipahami tanpa memberi diagnosis medis modern yang terlalu khusus.
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: Istilah Ibrani ini mencakup kondisi yang lebih luas daripada penyakit Hansen modern; padanan ini menghindari penyamaan yang anakronistis dengan kusta.
- source_word: הִוא
  choice: itu adalah
  rationale: Pronomina ini mengidentifikasi bercak yang telah menyebar sebagai נֶגַע צָרַעַת.
theological_decisions:
- issue: Makna צָרַעַת dalam hukum kemurnian
  choice: penyakit kulit
  alternative: kusta
  rationale: צָרַעַת dalam Imamat tidak dapat dibatasi pada penyakit Hansen dan juga dipakai dalam cakupan hukum kemurnian yang tidak sama dengan klasifikasi medis modern. Terjemahan utama mempertahankan keluasan istilah, sedangkan padanan tradisional dicatat dalam catatan kaki.
- issue: Fungsi imam dalam וְטִמֵּא ... אֹתוֹ
  choice: menyatakan orang itu najis
  alternative: menjadikan orang itu najis
  rationale: Bentuk Ibrani dapat tampak kausatif, tetapi dalam konteks prosedural imam menetapkan atau mengumumkan status ritual berdasarkan hasil pemeriksaan; ia tidak menciptakan kondisi fisiknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'harus' menyampaikan daya normatif bentuk verbal Ibrani dalam hukum. Pengulangan 'bercak' dipertahankan demi kejelasan rujukan dan kesepadanan dengan נֶגַע, meskipun struktur kalimat tetap dibuat alami bagi pembaca umum.
