base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: id
  text: Tetapi, jika kelainan bersisik[a] itu benar-benar[b] meluas di kulit setelah orang itu menghadap imam agar dinyatakan tahir,[c] ia harus menghadap imam untuk kedua kalinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruam”, “kelainan kulit”, atau menurut terjemahan tradisional “koreng”. Istilah Ibrani ini menunjuk pada kelainan kulit di permukaan yang sedang diperiksa.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani menegaskan kata kerjanya: “jika kelainan itu sungguh-sungguh meluas”.'
    reason: lexical_alternative
  - marker: c
    text: “Agar dinyatakan tahir” mengacu pada proses atau tujuan pemeriksaan untuk menentukan apakah orang itu dapat dinyatakan tahir.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: benar-benar meluas
  rationale: Gabungan infinitif absolut dan bentuk verba finit menegaskan tindakan meluas; “benar-benar” mempertahankan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: הַמִּסְפַּחַת
  choice: kelainan bersisik
  rationale: Dalam konteks pemeriksaan kulit di Imamat 13, istilah ini menunjuk pada kelainan kulit yang tampak di permukaan. Pilihan ini lebih netral dan tepat daripada “koreng”, yang biasanya dipahami sebagai lapisan pada luka yang sedang sembuh.
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: Mengungkapkan lokasi kelainan secara idiomatis dan tidak menambahkan kata ganti kepunyaan yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: אַחֲרֵי הֵרָאֹתוֹ אֶל הַכֹּהֵן
  choice: setelah orang itu menghadap imam
  rationale: Bentuk Niphal ראה dalam konteks ini menyatakan bahwa orang tersebut hadir atau memperlihatkan diri kepada imam untuk diperiksa. “Menghadap imam” alami dalam bahasa Indonesia dan mempertahankan konteks prosedural.
- source_word: לְטָהֳרָתוֹ
  choice: agar dinyatakan tahir
  rationale: Dalam konteks pasal ini, maksudnya ialah pemeriksaan dengan tujuan memperoleh penetapan status tahir, bukan tindakan membersihkan secara jasmani. Rumusan ini memperjelas fungsi deklaratif imam tanpa menyiratkan hasil pemeriksaan sudah pasti.
- source_word: וְנִרְאָה שֵׁנִית אֶל־הַכֹּהֵן
  choice: ia harus menghadap imam untuk kedua kalinya
  rationale: Dalam ketentuan hukum ini, bentuk tersebut menyampaikan kewajiban untuk hadir kembali bagi pemeriksaan kedua.
theological_decisions:
- issue: Makna לְטָהֳרָתוֹ dalam tata cara pemeriksaan imam
  choice: agar dinyatakan tahir
  alternative: untuk pentahirannya
  rationale: Pilihan ini menjaga kategori ritual Imamat dan menekankan penetapan status oleh imam, tanpa mengubahnya menjadi pembersihan fisik atau menganggap orang itu pasti akan dinyatakan tahir.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang tetap wajar dan mudah dipahami. “Tahir” dipertahankan sebagai istilah ritual yang mapan; “menghadap imam” menghindari konstruksi pasif yang kaku.
