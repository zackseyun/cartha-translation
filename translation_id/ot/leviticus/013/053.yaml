source:
  edition: WLC
  text: וְ/אִם֮ יִרְאֶ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔גַע בַּ/בֶּ֕גֶד א֥וֹ בַ/שְּׁתִ֖י א֣וֹ בָ/עֵ֑רֶב א֖וֹ בְּ/כָל כְּלִי עֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: id
  text: Namun, jika imam memeriksanya dan ternyata tanda itu tidak menyebar pada pakaian, benang lungsin, benang pakan, atau barang kulit apa pun,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Meneruskan ketentuan sebelumnya dengan nuansa kontras terhadap kemungkinan bahwa tanda itu menyebar.
- source_word: יִרְאֶה הַכֹּהֵן
  choice: imam memeriksanya
  rationale: Secara harfiah berarti imam 'melihat', tetapi dalam konteks tugas resmi keimaman, 'memeriksa' menyampaikan tindakan penilaian dengan wajar.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Mengungkapkan penanda wacana yang mengarahkan perhatian kepada hasil pemeriksaan tanpa memakai ungkapan arkais.
- source_word: לֹא פָשָׂה
  choice: tidak menyebar
  rationale: פשה dalam konteks tanda pada kulit atau bahan menunjuk pada perluasan atau penyebaran.
- source_word: הַנֶּגַע
  choice: tanda itu
  rationale: נגע di sini menunjuk pada tanda atau bagian yang terkena; 'tanda' menjaga kehati-hatian dan tidak menetapkannya sebagai diagnosis medis modern.
- source_word: בַּבֶּגֶד
  choice: pada pakaian
  rationale: Dalam bahasa Indonesia, 'pada' paling alami untuk tanda yang terdapat dan menyebar di bahan pakaian.
- source_word: בַשְּׁתִי
  choice: benang lungsin
  rationale: Istilah tekstil Indonesia untuk benang yang memanjang pada tenunan.
- source_word: בָעֵרֶב
  choice: benang pakan
  rationale: Istilah tekstil Indonesia untuk benang yang melintang pada tenunan.
- source_word: בְּכָל כְּלִי עוֹר
  choice: barang kulit apa pun
  rationale: Menyampaikan cakupan luas כְּלִי sebagai benda atau barang, sedangkan 'kulit' sesuai untuk bahan barang tersebut.
theological_decisions: []
