  source_fidelity: Tepat terhadap teks Ibrani. Frasa bersyarat וְאִם diterjemahkan dengan nuansa kelanjutan/kontras yang wajar; tindakan pemeriksaan imam, hasil bahwa נגע tidak menyebar, serta seluruh daftar objek—pakaian, lungsin, pakan, dan barang kulit—tercakup. Kalimat yang diakhiri koma dengan tepat mempertahankan kelanjutan sintaksis ke ayat berikutnya.
