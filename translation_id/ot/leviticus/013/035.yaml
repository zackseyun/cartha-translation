  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: id
  text: Namun, jika kelainan bersisik itu[a] benar-benar menyebar pada kulit sesudah ia dinyatakan tahir,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini menunjuk pada kelainan kulit tertentu yang dibahas dalam pasal ini, khususnya pada kepala atau janggut, kemungkinan disertai sisik dan kerontokan rambut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menandai syarat yang berlawanan dengan keadaan sebelumnya dalam prosedur pemeriksaan, dengan ungkapan Indonesia yang alami.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: benar-benar menyebar
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan pada tindakan menyebar; 'benar-benar' menyampaikan tekanan itu secara wajar.
- source_word: הַנֶּתֶק
  choice: kelainan bersisik
  rationale: Istilah ini menunjuk pada kelainan khusus di kepala atau janggut yang dibahas dalam pasal ini, berkaitan dengan kondisi kulit dan rambut; pilihan ini jelas tanpa menyamakannya dengan diagnosis modern tertentu.
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: Dalam bahasa Indonesia, 'menyebar pada kulit' lebih alami daripada 'di dalam kulit' untuk perluasan kelainan yang tampak.
- source_word: אַחֲרֵי
  choice: sesudah
  rationale: Menyampaikan hubungan waktu secara langsung dan alami.
- source_word: טָהֳרָתוֹ
  choice: ia dinyatakan tahir
  rationale: Dalam konteks pemeriksaan imamat, ungkapan ini paling jelas merujuk pada status ritual yang telah ditetapkan, bukan pembersihan medis atau moral.
theological_decisions:
- issue: Makna טָהֳרָתוֹ dalam hukum pemeriksaan
  choice: ia dinyatakan tahir
  alternative: penahirannya
  rationale: Konteks terdekat berkenaan dengan keputusan imam mengenai status tahir. Pilihan ini menghindari kesan bahwa orang tersebut telah mengalami penyembuhan atau pemurnian moral.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. 'Tahir' dipertahankan sebagai istilah ritual yang lazim dalam konteks Imamat; 'kelainan bersisik' tidak dimaksudkan sebagai diagnosis medis modern.
