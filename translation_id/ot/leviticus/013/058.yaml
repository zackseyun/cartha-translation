  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: id
  text: Namun, pakaian, benang lungsin, benang pakan, atau barang kulit apa pun yang dicuci dan yang tandanya hilang dari barang-barang itu harus dicuci untuk kedua kalinya, lalu barang itu menjadi tahir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: pakaian
  rationale: Istilah umum untuk pakaian atau bahan pakaian; “pakaian” alami dan jelas dalam bahasa Indonesia.
- source_word: הַשְּׁתִי
  choice: benang lungsin
  rationale: Istilah baku untuk benang yang membujur pada tenunan.
- source_word: הָעֵרֶב
  choice: benang pakan
  rationale: Istilah baku untuk benang yang melintang pada tenunan dan berpasangan dengan lungsin.
- source_word: כָל כְּלִי הָעוֹר
  choice: barang kulit apa pun
  rationale: כְּלִי mencakup berbagai barang atau perkakas; ungkapan ini tidak mempersempit maknanya menjadi wadah.
- source_word: תְּכַבֵּס
  choice: yang sudah dicuci
  rationale: Dalam klausa relatif, bentuk orang kedua tunggal paling wajar dialihkan menjadi pasif agar rangkaian beberapa benda tetap jelas dalam bahasa Indonesia.
- source_word: הַנָּגַע
  choice: tandanya
  rationale: Dalam konteks benda, istilah ini menunjuk pada tanda atau bercak serangan yang tampak; “tanda” menghindari diagnosis medis modern yang terlalu khusus.
- source_word: וְסָר מֵהֶם
  choice: dan tandanya hilang dari benda-benda itu
  rationale: Mempertahankan hubungan koordinatif dengan וְ serta bentuk jamak מֵהֶם, tanpa mengubahnya secara eksplisit menjadi syarat.
- source_word: וְכֻבַּס שֵׁנִית
  choice: harus dicuci untuk kedua kalinya
  rationale: Menyampaikan bentuk pasif dan daya prosedural dari pencucian ulang.
- source_word: וְטָהֵר
  choice: sesudah itu benda itu menjadi tahir
  rationale: “Tahir” mempertahankan arti status kemurnian ritual, bukan sekadar kebersihan fisik; penambahan subjek memperjelas rujukan dalam bahasa Indonesia.
theological_decisions:
- issue: Makna וְטָהֵר dalam hukum kemurnian ritual
  choice: menjadi tahir
  alternative: menjadi bersih
  rationale: Konteks Imamat 13 membicarakan status ritual. “Tahir” membedakannya dari sekadar bersih secara fisik tanpa menambahkan doktrin denominasi.
- issue: Hubungan וְסָר dalam klausa relatif
  choice: dan tandanya hilang
  alternative: jika tandanya hilang
  rationale: Teks Ibrani memakai konjungsi וְ dan tidak menandai syarat secara eksplisit. Terjemahan mempertahankan koordinasi itu, sementara urutan prosedural tetap dapat dipahami dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah teknis tenun “lungsin” dan “pakan” dipakai karena keduanya merupakan padanan Indonesia yang tepat. Kalimat diatur ulang secukupnya agar rangkaian prosedural jelas tanpa menghapus bentuk jamak pada benda-benda yang disebut.
