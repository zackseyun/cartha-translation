base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: id
  text: Namun, jika menurut pengamatan imam kelainan bersisik itu tetap tidak berubah, dan rambut hitam telah tumbuh pada bagian itu, kelainan itu telah sembuh. Orang itu tahir, dan imam harus menyatakan dia tahir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “imam harus menahirkan dia.” Kata kerja Ibrani ini dapat diterjemahkan “menahirkan,” tetapi dalam konteks ini menunjuk pada keputusan resmi imam bahwa orang itu tahir setelah kelainan itu sembuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: menurut pengamatannya
  rationale: Ungkapan ini secara harfiah berarti “di matanya”, tetapi dalam konteks pemeriksaan menunjuk pada apa yang tampak dalam pengamatan imam. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan sudut pandang pemeriksa.
- source_word: עָמַד
  choice: tetap tidak berubah
  rationale: Dalam konteks diagnosis, verba ini menyatakan bahwa keadaan penyakit bertahan seperti sebelumnya, tidak berkembang atau berubah.
- source_word: הַנֶּתֶק
  choice: penyakit bersisik
  rationale: Istilah ini menunjuk pada kelainan khusus di kulit kepala atau daerah janggut dalam perikop ini. “Penyakit bersisik” dapat dipahami pembaca modern tanpa menyamakannya secara tidak pasti dengan diagnosis medis masa kini.
- source_word: שֵׂעָר שָׁחֹר
  choice: rambut hitam
  rationale: Terjemahan langsung yang mempertahankan tanda diagnostik dan kontras warna dalam perikop.
- source_word: צָמַח בּוֹ
  choice: telah tumbuh di bagian itu
  rationale: Frasa ini menunjukkan bahwa rambut tumbuh di area yang terkena. “Di bagian itu” lebih alami dan jelas daripada “di dalamnya” dalam bahasa Indonesia.
- source_word: נִרְפָּא
  choice: telah sembuh
  rationale: Bentuk pasif ini menyatakan bahwa penyakit tersebut sudah pulih sebelum keputusan resmi imam diberikan.
- source_word: טָהוֹר הוּא
  choice: Orang itu tahir
  rationale: Predikat ini merujuk kepada orang yang diperiksa. “Tahir” mempertahankan istilah baku bagi status kemurnian ritual dalam Imamat, bukan sekadar kebersihan jasmani.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: dan imam harus menyatakan dia tahir
  rationale: Dalam konteks hukum keimaman, tindakan imam adalah memberikan keputusan resmi mengenai status ketahiran, bukan menyembuhkan penyakitnya.
theological_decisions:
- issue: Sifat tindakan imam dalam penetapan ketahiran ritual
  choice: imam harus menyatakan dia tahir
  alternative: imam harus menahirkan dia
  rationale: Ayat ini membedakan kesembuhan penyakit dari keputusan imam sesudahnya. Terjemahan utama menunjukkan bahwa imam menetapkan status ritual orang tersebut dan tidak menyiratkan bahwa imam menyebabkan kesembuhan fisiknya. Catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah “tahir” dipertahankan sebagai kosakata ritual dalam Imamat; susunan kalimat dibuat alami tanpa menghilangkan urutan pemeriksaan, kesembuhan, status, dan keputusan imam.
