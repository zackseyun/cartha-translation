  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: id
  text: Pada hari ketujuh, imam harus memeriksa bercak itu. Jika bercak itu telah meluas pada pakaian, pada benang lungsin atau benang pakan, atau pada kulit, pada barang apa pun yang dibuat dari kulit untuk keperluan apa pun, bercak itu merupakan tsaraat[a] yang merusak; bercak itu najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraat adalah istilah Ibrani untuk berbagai keadaan yang menajiskan dalam Imamat 13–14. Istilah ini secara tradisional sering diterjemahkan “kusta”, tetapi tidak sama persis dengan penyakit kusta modern dan di sini juga dikenakan pada pakaian serta barang dari kulit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: harus memeriksa
  rationale: Dalam tata cara pemeriksaan oleh imam, verba ini menyatakan tindakan mengamati dan menilai, bukan sekadar melihat.
- source_word: הַנֶּגַע
  choice: bercak itu
  rationale: Istilah ini menunjuk pada bagian atau tanda yang terkena dan dapat meluas. 'Bercak' tetap wajar ketika acuannya pakaian maupun kulit serta tidak mengandaikan infeksi biologis.
- source_word: פָשָׂה
  choice: telah meluas
  rationale: Verba ini menyatakan bahwa bercak tersebut menyebar atau bertambah luas.
- source_word: בֶּגֶד
  choice: pakaian
  rationale: Padanan umum dan alami untuk benda tekstil atau pakaian dalam konteks ini.
- source_word: שְׁתִי ... עֵרֶב
  choice: benang lungsin ... benang pakan
  rationale: Keduanya adalah istilah baku bahasa Indonesia untuk benang memanjang dan melintang dalam tenunan.
- source_word: עוֹר
  choice: kulit
  rationale: Konteksnya menunjukkan kulit binatang sebagai bahan yang dapat diolah menjadi barang; 'kulit' merupakan padanan Indonesia yang paling luas dan alami.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: pada barang apa pun yang dibuat dari kulit untuk digunakan
  rationale: Ungkapan ini mencakup segala barang olahan kulit. Susunan Indonesia dibuat alami sambil mempertahankan cakupan menyeluruh dari ketentuan Ibrani.
- source_word: צָרַעַת
  choice: tsaraat
  rationale: Transliterasi mempertahankan istilah teknis hukum kenajisan yang cakupannya tidak sama dengan penyakit kusta modern dan di sini bahkan berlaku pada pakaian serta kulit.
- source_word: מַמְאֶרֶת
  choice: yang merusak
  rationale: Kata sifat ini menggambarkan sifat berbahaya, menggerogoti, atau merusak tanpa memaksakan diagnosis medis tertentu.
- source_word: טָמֵא הוּא
  choice: benda itu najis
  rationale: Status najis dikenakan pada benda yang diperiksa. Penyebutan 'benda' memperjelas acuan pronomina dalam bahasa Indonesia.
theological_decisions:
- issue: Makna צָרַעַת dalam hukum kenajisan Imamat
  choice: tsaraat
  alternative: penyakit kusta; penyakit kulit; penyakit yang menajiskan
  rationale: Istilah Ibrani ini tidak identik dengan penyakit Hansen dan dalam pasal ini dapat mengenai manusia, pakaian, dan bangunan. Transliterasi menghindari kategori medis yang keliru serta mempertahankan ketegangan dan keluasan istilah sumber.
- issue: Sifat kenajisan dalam טָמֵא הוּא
  choice: benda itu najis
  alternative: benda itu najis secara ritual
  rationale: Konteks hukum Imamat sudah menunjukkan bahwa yang dimaksud adalah status kenajisan ritual; tambahan 'secara ritual' tidak diperlukan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersifat hukum-liturgis tanpa menjadi kaku. Istilah pertenunan dijelaskan secara langsung sebagai 'benang lungsin' dan 'benang pakan'. Tanda pisah membantu memperjelas bahwa frasa berikutnya memperluas cakupan semua barang dari kulit.
