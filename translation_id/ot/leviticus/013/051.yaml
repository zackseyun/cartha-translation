revisions:
- from: Pada hari ketujuh, imam harus memeriksa bercak itu. Jika bercak itu telah meluas pada pakaian, pada benang lungsin atau benang pakan, atau pada kulit—pada barang apa pun yang dibuat dari kulit untuk digunakan—bercak itu adalah tsaraat[a] yang merusak; benda itu najis.
  to: Pada hari ketujuh, imam harus memeriksa bercak itu. Jika bercak itu telah meluas pada pakaian, pada benang lungsin atau benang pakan, atau pada kulit, pada barang apa pun yang dibuat dari kulit untuk keperluan apa pun, bercak itu merupakan tsaraat[a] yang merusak; bercak itu najis.
  rationale: Revisi mengembalikan “bercak itu” sebagai subjek penetapan najis, sesuai tata bahasa Ibrani. Klausa mengenai barang dari kulit dirapikan agar lebih alami dalam bahasa Indonesia serta tetap mencakup semua barang kulit yang dibuat untuk penggunaan apa pun. Catatan untuk tsaraat dipertahankan karena menjelaskan istilah teknis tanpa mempersempitnya menjadi diagnosis medis modern.
  reviewer_model: gpt-5.6-terra
