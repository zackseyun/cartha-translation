  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֹת֜/וֹ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֮ שֵׁנִית֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע וְ/לֹא פָשָׂ֥ה הַ/נֶּ֖גַע בָּ/ע֑וֹר וְ/טִהֲר֤/וֹ הַ/כֹּהֵן֙ מִסְפַּ֣חַת הִ֔יא וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: id
  text: Pada hari ketujuh, imam harus memeriksa orang itu sekali lagi. Jika ternyata kelainan itu telah memudar dan tidak menyebar pada kulit, imam harus menyatakan orang itu tahir. Itu adalah ruam bersisik.[a] Orang itu harus mencuci pakaiannya, lalu ia menjadi tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruam”. Istilah Ibrani ini menunjuk kelainan kulit yang relatif ringan, berbeda dari keadaan lebih serius yang menyebar.
    reason: Alternatif leksikal dan penjelasan cakupan istilah מִסְפַּחַת; penanda ditempatkan pada istilah yang diterangkannya.
lexical_decisions:
- source_word: וְרָאָה
  choice: harus memeriksa
  rationale: Dalam konteks diagnosis resmi oleh imam, ראה berarti melakukan pemeriksaan, bukan sekadar melihat.
- source_word: שֵׁנִית
  choice: sekali lagi
  rationale: Bentuk adverbial ini menyatakan pengulangan pemeriksaan dan wajar diterjemahkan demikian dalam bahasa Indonesia modern.
- source_word: כֵּהָה
  choice: telah memudar
  rationale: Kata ini menggambarkan kelainan yang menjadi kurang nyata atau kurang kuat warnanya.
- source_word: הַנֶּגַע
  choice: kelainan itu
  rationale: נגע di sini menunjuk tanda atau kelainan kulit yang diamati. 'Kelainan' tidak mengandaikan infeksi dalam pengertian medis modern dan tetap cukup umum untuk cakupan istilah Ibrani.
- source_word: פָשָׂה
  choice: tidak menyebar
  rationale: Dalam peraturan penyakit kulit ini, kata tersebut menunjuk perluasan kelainan pada kulit.
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: עוֹר berarti 'kulit'; dalam bahasa Indonesia, 'pada kulit' merupakan ungkapan diagnostik yang paling alami.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: imam harus menyatakan orang itu tahir
  rationale: Bentuk piel ini dalam hukum kemurnian menyatakan keputusan resmi imam mengenai status ritual, bukan tindakan menyembuhkan atau membersihkan secara fisik.
- source_word: מִסְפַּחַת
  choice: ruam bersisik
  rationale: Istilah ini menunjuk kelainan kulit yang relatif ringan, berbeda dari keadaan menyebar yang sedang diperiksa; padanan ini mempertahankan gambaran kulit tanpa bahasa teknis berlebihan.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Orang itu harus mencuci pakaiannya
  rationale: Subjek tersirat secara alami dijelaskan sebagai orang yang diperiksa; 'pakaian' adalah padanan modern bagi בגד.
- source_word: וְטָהֵר
  choice: lalu ia menjadi tahir
  rationale: Kata ini menyatakan status ritual yang berlaku sesudah pencucian; 'tahir' membedakannya dari kebersihan fisik biasa.
theological_decisions:
- issue: Keputusan kemurnian ritual atau penyembuhan fisik
  choice: Tindakan imam diterjemahkan sebagai 'menyatakan orang itu tahir', dan keadaan akhirnya sebagai 'menjadi tahir'.
  alternative: '''menyucikan orang itu'' atau menyatakan bahwa ia telah sembuh'
  rationale: Ayat ini membahas penetapan status ritual berdasarkan pemeriksaan, bukan klaim bahwa imam menyembuhkan penyakit atau bahwa semua gejala fisik lenyap.
- issue: Daya pasti הִנֵּה dalam kalimat bersyarat
  choice: Jika ternyata
  alternative: dan lihatlah
  rationale: Dalam rangkaian hukum kasus ini, הִנֵּה memperkenalkan hasil pemeriksaan. 'Jika ternyata' mempertahankan fungsi evidensialnya secara alami tanpa mengubahnya menjadi seruan kepada pembaca.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tahir' dipakai untuk status kemurnian ritual, sedangkan 'kelainan' menghindari kesan diagnosis infeksi modern. Kata 'hanyalah' menyampaikan kontras klasifikatoris dalam konteks—kelainan tersebut dinilai sebagai מִסְפַּחַת, bukan kondisi menajiskan yang menyebar—tanpa menyiratkan bahwa gejalanya tidak nyata.
