  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: id
  text: Namun, jika pada bagian belakang kepala yang botak atau pada bagian depan kepala yang botak terdapat bercak putih kemerah-merahan[b], itu adalah penyakit kulit[a] yang sedang merebak pada bagian belakang kepalanya yang botak atau pada bagian depan kepalanya yang botak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan tradisional, “kusta”. Istilah Ibrani ini mencakup berbagai penyakit atau kelainan kulit dan tidak dapat disamakan begitu saja dengan penyakit Hansen modern.
    reason: lexical_alternative
  - marker: b
    text: Dua istilah Ibrani yang dipakai di sini membedakan kebotakan pada bagian belakang kepala dari kebotakan pada bagian depan kepala.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Namun, jika
  rationale: Membuka kasus bersyarat yang berlawanan dengan keadaan pada ayat sebelumnya; ungkapan ini mempertahankan hubungan kontras dan daya kondisionalnya.
- source_word: יִהְיֶה
  choice: terdapat
  rationale: 'Kata kerja ini berfungsi secara eksistensial: ada atau terdapat suatu bercak pada lokasi yang disebutkan.'
- source_word: בַקָּרַחַת
  choice: pada bagian belakang kepala yang botak
  rationale: קָרַחַת menunjuk kebotakan yang dibedakan dari kebotakan bagian depan; penyebutan lokasi secara eksplisit mempertahankan pembedaan pasangan istilah Ibrani.
- source_word: בַגַּבַּחַת
  choice: pada bagian depan kepala yang botak
  rationale: גַּבַּחַת merupakan istilah pasangan bagi kebotakan di bagian depan kepala; terjemahan ini jelas dan alami dalam bahasa Indonesia.
- source_word: נֶגַע
  choice: bercak penyakit
  rationale: Dalam Imamat 13, kata ini menunjuk tanda atau bercak yang tampak dan diperiksa, tanpa menetapkannya sebagai diagnosis medis modern tertentu.
- source_word: לָבָן אֲדַמְדָּם
  choice: berwarna putih kemerah-merahan
  rationale: Mempertahankan urutan warna dalam bahasa Ibrani dan menyampaikan bahwa putihnya memiliki semburat kemerahan.
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: Istilah Ibrani mencakup berbagai keadaan yang tidak dapat disamakan secara ketat dengan penyakit Hansen; pilihan ini mudah dipahami dan menghindari ketepatan medis yang palsu.
- source_word: פֹּרַחַת
  choice: yang sedang merebak
  rationale: Partisip dari פרח menggambarkan penyakit yang timbul atau merebak; bentuk progresif Indonesia mempertahankan sifat aktif keadaan tersebut tanpa memastikan pola penyebaran medis tertentu.
- source_word: הִוא
  choice: itu adalah
  rationale: Kata ganti ini mengidentifikasi bercak atau keadaan yang baru saja digambarkan.
- source_word: בְּקָרַחְתּוֹ א֥וֹ בְגַבַּחְתּוֹ
  choice: pada bagian belakang atau bagian depan kepalanya yang botak
  rationale: Mempertahankan kedua lokasi dan sufiks posesif, sambil menghindari pengulangan yang kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna צָרַעַת
  choice: penyakit kulit
  alternative: kusta
  rationale: Terjemahan tradisional “kusta” dapat memberi kesan keliru bahwa teks secara khusus mendiagnosis penyakit Hansen. Pilihan dalam teks utama mempertahankan cakupan istilah Ibrani yang lebih luas, sedangkan bentuk tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Pembedaan anatomis kedua istilah Ibrani dibuat eksplisit agar tidak hilang, sedangkan istilah penyakit dijaga tetap nonteknis dan tidak disamakan dengan diagnosis modern.
