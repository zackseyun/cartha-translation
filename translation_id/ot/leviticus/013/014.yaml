source:
  edition: WLC
  text: וּ/בְ/י֨וֹם הֵרָא֥וֹת בּ֛/וֹ בָּשָׂ֥ר חַ֖י יִטְמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/014.yaml
  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: id
  text: Namun, pada hari daging hidup tampak padanya, ia menjadi najis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְיוֹם
  choice: Namun, pada hari
  rationale: Kata penghubung וּ dibaca secara kontras sesuai konteks ayat sebelumnya, sedangkan בְיוֹם dipertahankan secara formal sebagai keterangan waktu.
- source_word: בָּשָׂר חַי
  choice: daging hidup
  rationale: 'Terjemahan langsung yang mempertahankan istilah pemeriksaan penyakit kulit: daging yang masih hidup atau mentah, bukan jaringan yang telah memutih.'
- source_word: הֵרָאוֹת
  choice: tampak
  rationale: Bentuk nifal infinitif dari ראה menyatakan keadaan ketika daging hidup terlihat atau muncul.
- source_word: בּוֹ
  choice: padanya
  rationale: Pronomina maskulin tunggal sengaja dibiarkan memiliki rujukan yang tidak diperinci, sebagaimana teks Ibrani; konteks memungkinkan rujukan kepada orang yang diperiksa atau bagian yang terkena.
- source_word: יִטְמָא
  choice: ia menjadi najis
  rationale: Bentuk imperfek menyatakan penetapan status kenajisan ketika tanda tersebut tampak; 'menjadi najis' alami dalam bahasa Indonesia dan tidak menambahkan pelaku manusia.
theological_decisions:
- issue: Sifat kenajisan
  choice: ia menjadi najis
  alternative: ia harus dinyatakan najis
  rationale: Teks Ibrani memakai verba qal 'menjadi najis', bukan bentuk eksplisit 'dinyatakan najis'. Terjemahan mempertahankan rumusan status ritual tanpa mengubahnya menjadi tindakan imam.
- issue: Rujukan pronomina בּוֹ
  choice: padanya
  alternative: di bagian itu
  rationale: Rujukannya secara gramatikal tetap terbuka. 'Padanya' menjaga ambiguitas antara orang dan bagian kulit, sedangkan 'di bagian itu' akan mempersempitnya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan kontras, waktu munculnya tanda, serta keputusan status ritual dalam teks sumber.
