  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: id
  text: Namun, jika bercak terang itu tetap di tempatnya dan tidak menyebar[a], itu adalah bekas luka akibat bisul, dan imam harus menyatakan orang itu tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di bawahnya”; ungkapan Ibrani ini berarti bahwa bercak itu tetap pada tempatnya, bukan menyebar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Mengungkapkan syarat yang berlawanan dengan kasus sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: tetap di tempatnya
  rationale: Secara harfiah mengandung gagasan 'berdiri di bawahnya', tetapi dalam konteks pemeriksaan ini berarti bercak tidak meluas dari letaknya.
- source_word: הַבַּהֶרֶת
  choice: bercak mengilap
  rationale: Menunjuk pada tanda kulit yang tampak terang atau berkilau; pilihan ini mempertahankan ciri visual tanpa menetapkan diagnosis modern.
- source_word: לֹא פָשָׂתָה
  choice: tidak menyebar
  rationale: Kata kerja ini berulang kali dipakai dalam pasal ini untuk meluasnya kelainan pada kulit.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: bekas bisul
  rationale: Merujuk pada tanda atau jaringan bekas peradangan yang ditinggalkan oleh bisul.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: imam harus menyatakan orang itu tahir
  rationale: Bentuk kausatif dalam konteks hukum ketahiran menyatakan penetapan status ritual oleh imam, bukan tindakan menyembuhkan atau membersihkan secara fisik.
theological_decisions:
- issue: Ketahiran ritual dibandingkan penyembuhan medis
  choice: imam harus menyatakan orang itu tahir
  alternative: imam harus menahirkan atau menyembuhkan orang itu
  rationale: Konteksnya ialah pemeriksaan dan penetapan status dalam tata ketahiran Israel. Imam menetapkan orang itu tahir; ia tidak digambarkan menyembuhkan penyakitnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'tahir' dipertahankan karena tepat untuk status ritual dalam Imamat, sedangkan 'bercak mengilap' menggambarkan tanda yang terlihat tanpa memasukkan diagnosis medis modern.
