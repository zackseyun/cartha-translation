id: LEV.13.12
reference: Leviticus 13:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: id
  text: Jika penyakit kulit itu menyebar luas pada kulit[a] dan menutupi seluruh kulit orang yang terkena, dari kepala sampai kakinya, sejauh yang dapat dilihat oleh imam[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani צָרַעַת (tsaraat) dalam Imamat mengacu pada beragam kelainan yang berkaitan dengan kenajisan ritual dan tidak boleh disamakan secara sempit dengan kusta modern (penyakit Hansen).
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “seluruh kulit penyakit itu.” Ungkapan Ibrani ini menunjuk pada kulit orang tersebut yang terkena penyakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: menyebar luas
  rationale: Gabungan infinitif absolut dan verba finit menguatkan gagasan penyebaran. “Menyebar luas” alami dalam bahasa Indonesia dan menyampaikan meluasnya kondisi tersebut tanpa meniru bentuk Ibrani secara kaku.
- source_word: הַצָּרַעַת
  choice: penyakit kulit itu
  rationale: Istilah צָרַעַת dalam Imamat mencakup beragam kelainan kulit yang berkaitan dengan status ritual dan tidak tepat disamakan secara sempit dengan kusta modern (penyakit Hansen).
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: Preposisi ב di sini menunjuk permukaan tubuh tempat penyakit itu menyebar; “pada kulit” merupakan ungkapan Indonesia yang alami.
- source_word: וְכִסְּתָה
  choice: dan menutupi
  rationale: Dalam rangkaian syarat ini, bentuk verba menyatakan akibat atau keadaan lanjutan dari penyebaran; “menutupi” mempertahankan gambaran cakupan menyeluruh.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: seluruh kulit orang yang terkena
  rationale: Secara harfiah ungkapan ini berarti “seluruh kulit penyakit/kelainan itu,” tetapi maksud kontekstualnya adalah kulit orang yang terkena. Terjemahan utama dibuat jelas, sedangkan bentuk yang lebih harfiah dicatat.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: dari kepala sampai kakinya
  rationale: Ungkapan merismatik ini menunjukkan seluruh tubuh. Bentuk Indonesia ini alami dan mempertahankan acuan tunggal maskulin sumber tanpa perlu menandai gender secara eksplisit.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: sejauh yang dapat dilihat oleh imam
  rationale: Ungkapan harfiahnya berkaitan dengan seluruh jangkauan pandangan mata imam. Pilihan ini menyampaikan batas pemeriksaan visual secara jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dipertahankan sebagai anak kalimat bersyarat yang berlanjut ke ayat berikutnya. Istilah medis yang terlalu spesifik dihindari, dan peran imam sebagai pengamat visual dinyatakan tanpa menambahkan penafsiran.
