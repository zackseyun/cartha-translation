revisions:
- from: Atau apabila pada kulit tubuh seseorang terdapat luka bakar karena api[a], dan jaringan hidup pada luka bakar itu menjadi bercak mengilap yang putih kemerah-merahan atau putih[b],
  to: Atau, jika pada kulit tubuh seseorang[a] terdapat luka bakar akibat api, dan jaringan hidup pada luka bakar itu menjadi bercak terang yang putih kemerah-merahan atau putih[b],
  rationale: Revisi mengganti “mengilap” dengan “terang” agar lebih setia pada makna בַּהֶרֶת, memindahkan jangkar catatan a ke istilah yang dibahas, dan memperjelas catatan mengenai מִחְיַת tanpa mengubah makna atau sifat terbuka kalimat yang berlanjut ke ayat berikutnya.
