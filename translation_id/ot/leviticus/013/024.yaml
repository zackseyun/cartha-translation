review_pass:
  verdict: revise
  source_fidelity: Draf ini pada dasarnya mengikuti struktur kasus alternatif dan unsur-unsur diagnostik teks Ibrani dengan baik. Namun, בַּהֶרֶת lebih tepat diterjemahkan sebagai bercak yang terang daripada “bercak mengilap”; maknanya adalah tampak cerah/terang, bukan terutama berkilau. Penanda catatan a juga perlu ditempatkan pada padanan בָּשָׂר, bukan pada “api.”
  naturalness: Kalimat revisi tetap baku dan alami dalam bahasa Indonesia modern, sambil mempertahankan bentuk pengandaian hukum yang belum selesai dan berlanjut ke ayat berikutnya.
  terminology: “Luka bakar akibat api,” “jaringan hidup,” dan “bercak terang” menyampaikan istilah sumber secara jelas tanpa memaksakan diagnosis medis modern. “Putih kemerah-merahan” mempertahankan nuansa gabungan לְבָנָה אֲדַמְדֶּמֶת.
  issues:
  - severity: medium
    issue: “Bercak mengilap” kurang tepat untuk בַּהֶרֶת.
    rationale: Dalam konteks ini istilah tersebut menunjuk bercak yang terang atau cerah pada kulit. “Mengilap” dapat menyiratkan permukaan berkilau dan mempersempit makna.
  - severity: low
    issue: Penanda catatan a ditempatkan setelah “api,” padahal catatannya membahas בָּשָׂר.
    rationale: Penanda perlu dipindahkan ke “tubuh seseorang,” yaitu unsur terjemahan yang mewakili makna “daging/tubuh” dalam konstruksi Ibrani.
  - severity: low
    issue: Catatan b menyebut “hidup atau mentah” tanpa menjelaskan hubungan kedua ungkapan itu.
    rationale: Penjelasan “daging hidup,” yaitu jaringan yang masih hidup, lebih langsung dan tidak menimbulkan kesan bahwa teks Ibrani memuat dua istilah alternatif.
  revised_text: Atau, jika pada kulit tubuh seseorang[a] terdapat luka bakar akibat api, dan jaringan hidup pada luka bakar itu menjadi bercak terang yang putih kemerah-merahan atau putih[b],
