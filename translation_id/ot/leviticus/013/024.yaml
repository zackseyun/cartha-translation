base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: id
  text: Atau, jika pada kulit tubuh seseorang[a] terdapat luka bakar akibat api, dan jaringan hidup pada luka bakar itu menjadi bercak terang yang putih kemerah-merahan atau putih[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daging”; dalam hukum pemeriksaan kulit ini, kata Ibrani tersebut menunjuk tubuh atau jaringan tubuh seseorang.
    reason: lexical_alternative
  - marker: b
    text: “Jaringan hidup” menerjemahkan ungkapan Ibrani yang secara harfiah merujuk pada “daging hidup,” yaitu jaringan yang masih hidup dan tampak pada area luka bakar.
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ
  choice: Atau apabila
  rationale: Memperkenalkan kasus alternatif dalam rangkaian hukum dan menyampaikan daya kondisionalnya secara wajar dalam bahasa Indonesia.
- source_word: בָשָׂר ... בְעֹרוֹ
  choice: pada kulit tubuh seseorang
  rationale: בָשָׂר secara harfiah berarti daging, tetapi di sini menunjuk tubuh manusia; penyebutan 'seseorang' membuat acuan sufiks maskulin tunggal pada עֹרוֹ jelas tanpa bahasa yang kaku.
- source_word: מִכְוַת אֵשׁ
  choice: luka bakar karena api
  rationale: Mengungkapkan cedera bakar yang disebabkan oleh api dengan istilah Indonesia yang alami dan tepat.
- source_word: וְהָיְתָה
  choice: menjadi
  rationale: Dalam uraian prosedural ini bentuk verba melanjutkan keadaan kasus; 'menjadi' mempertahankan perkembangan yang dinyatakan teks.
- source_word: מִחְיַת הַמִּכְוָה
  choice: jaringan hidup pada luka bakar itu
  rationale: מִחְיָה dalam konteks penyakit kulit menunjuk jaringan hidup atau mentah yang tampak di area luka; 'jaringan hidup' akurat dan mudah dipahami.
- source_word: בַּהֶרֶת
  choice: bercak mengilap
  rationale: Istilah ini menunjuk bercak kulit yang tampak terang atau berkilau; 'mengilap' membedakannya dari warna putih yang disebut sesudahnya.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: putih kemerah-merahan
  rationale: Mempertahankan warna dasar putih dengan rona kemerahan yang dinyatakan oleh bentuk reduplikasi adjektiva Ibrani.
- source_word: אוֹ לְבָנָה
  choice: atau putih
  rationale: Mempertahankan alternatif warna kedua secara langsung.
