  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: id
  text: Apabila terdapat bercak kusta[a] pada suatu pakaian wol atau pakaian lenan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani tsaraat, yang secara tradisional diterjemahkan “kusta”, di sini mencakup kategori kelainan atau pencemaran yang lebih luas, termasuk yang terdapat pada pakaian, dan tidak secara khusus berarti penyakit Hansen modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: suatu pakaian
  rationale: בֶּגֶד berarti pakaian atau bahan sandang. Walaupun berbentuk definit, dalam rumusan hukum ini kata tersebut menyatakan kasus umum, sehingga “suatu pakaian” paling wajar dalam bahasa Indonesia.
- source_word: כִּי יִהְיֶה בוֹ
  choice: apabila pada ... terdapat
  rationale: כִּי dengan bentuk imperfek memperkenalkan suatu kasus hukum. בוֹ menyatakan lokasi; susunan “pada ... terdapat” mempertahankan makna tersebut secara alami.
- source_word: נֶגַע צָרָעַת
  choice: bercak kusta
  rationale: נֶגַע menunjuk tanda atau kelainan yang dapat diamati dalam konteks pemeriksaan Imamat 13. “Bercak” sesuai untuk gejala pada tekstil, sedangkan “kusta” mempertahankan padanan tradisional צָרָעַת; catatan kaki menjelaskan bahwa cakupan istilah Ibraninya lebih luas.
- source_word: בְּבֶגֶד צֶמֶר
  choice: pada pakaian wol
  rationale: צֶמֶר berarti wol, dan preposisi בְּ diungkapkan dengan “pada” karena yang dimaksud ialah lokasi bercak pada pakaian.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: atau pada pakaian lenan
  rationale: פִּשְׁתִּים merujuk pada rami atau kain yang dibuat darinya; “lenan” adalah sebutan alami untuk bahan jadinya. Pengulangan “pada” mempertahankan pengulangan preposisi בְּ dalam teks Ibrani.
