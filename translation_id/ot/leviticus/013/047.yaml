translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum. Bentuk ayat dibiarkan berakhir dengan koma karena kalimat hukumnya berlanjut ke ayat berikutnya. Pengulangan “pada pakaian” dipertahankan untuk mencerminkan susunan lokatif teks Ibrani.
