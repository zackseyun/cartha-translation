  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: id
  text: Kemudian imam harus memeriksanya. Tampak bahwa bagian itu lebih rendah daripada kulit di sekitarnya dan bulu di bagian itu telah berubah putih; imam harus menyatakan orang itu najis. Itu adalah lesi penyakit kulit[a] yang timbul pada bisul itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani tsara'at secara tradisional diterjemahkan “kusta”, tetapi dalam Kitab Imamat istilah ini tampaknya mencakup berbagai penyakit atau kelainan kulit yang serius, bukan hanya penyakit Hansen modern.
    reason: Menjelaskan cakupan leksikal צָרַעַת dan menghindari penyamaan anakronistis dengan satu diagnosis medis modern.
lexical_decisions:
- source_word: וְרָאָה
  choice: harus memeriksanya
  rationale: Dalam konteks diagnosis keimaman, ראה berarti mengamati atau memeriksa, bukan sekadar melihat.
- source_word: וְהִנֵּה
  choice: Jika tampak bahwa
  rationale: Dalam rangkaian prosedural ini, penanda pengamatan memperkenalkan hasil pemeriksaan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kondisional yang tersirat oleh konteks.
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: bagian itu lebih dalam daripada kulit
  rationale: Ungkapan tersebut menggambarkan bagian yang terkena sebagai tampak cekung atau berada di bawah permukaan kulit.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: bulu di situ telah berubah menjadi putih
  rationale: Akhiran feminin mengacu pada bagian yang terkena; 'bulu di situ' lebih jelas dan alami daripada bentuk posesif yang berpotensi janggal.
- source_word: וְטִמְּאוֹ
  choice: imam harus menyatakan orang itu najis
  rationale: Dalam hukum kemurnian ritual, imam memberikan keputusan resmi mengenai status kenajisan, bukan menyebabkan orang itu menjadi najis.
- source_word: נֶגַע צָרַעַת
  choice: bercak penyakit kulit menular
  rationale: נגע menunjuk pada bercak atau serangan yang tampak, sedangkan צרעת adalah kategori penyakit dalam hukum Imamat yang tidak dapat disamakan secara pasti dengan penyakit Hansen modern. Istilah 'menular' di sini meneruskan sebutan Indonesia yang lazim, dengan catatan penjelas untuk mencegah penyempitan medis.
- source_word: בַּשְּׁחִין
  choice: pada bisul tersebut
  rationale: שחין menunjuk pada bisul atau luka meradang; 'bisul' ringkas, konkret, dan sesuai konteks ayat sebelumnya.
- source_word: פָּרָחָה
  choice: yang timbul
  rationale: Kata kerja ini menggambarkan penyakit yang muncul atau bersemi pada bisul, tanpa harus menyatakan bahwa penyakit itu telah menyebar luas.
theological_decisions:
- issue: Makna צָרַעַת dalam hukum kemurnian Imamat
  choice: penyakit kulit menular, disertai catatan kaki
  alternative: kusta; penyakit kulit
  rationale: צָרַעַת mencakup kategori ritual-diagnostik yang lebih luas dan tidak identik secara pasti dengan penyakit Hansen. Terjemahan utama memakai istilah yang mudah dipahami, sementara catatan mempertahankan ketidakpastian cakupan medisnya.
- issue: Fungsi imam dalam וְטִמְּאוֹ
  choice: menyatakan orang itu najis
  alternative: menajiskan orang itu
  rationale: Rumusan ini menunjukkan bahwa imam menetapkan status ritual berdasarkan tanda-tanda yang diperiksa, bukan secara aktif menciptakan kenajisan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur prosedural dipertahankan dengan 'harus'; istilah ritual 'najis' dipakai karena tepat dan dikenal luas. Penanda [a] dicantumkan langsung setelah frasa yang dijelaskan.
