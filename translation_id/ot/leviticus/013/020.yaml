  source_fidelity: Revisi diperlukan karena “menular” tidak didukung oleh צָרַעַת dan berisiko menyiratkan klaim medis yang justru dihindari oleh catatan kaki. “Jika tampak” dapat dipakai secara prosedural, tetapi penanda וְהִנֵּה lebih tepat diterjemahkan sebagai pengamatan langsung tanpa mengubahnya menjadi syarat eksplisit.
  naturalness: Bahasa draf umumnya jelas. “Tampak lebih rendah daripada kulit di sekitarnya” lebih idiomatis dan lebih tepat untuk lesi yang tampak cekung daripada “lebih dalam daripada kulit”. “Lesi” merupakan istilah Indonesia modern yang tepat dalam konteks pemeriksaan kulit dan menghindari konotasi “bercak” yang terlalu sempit.
  terminology: “Menyatakan orang itu najis” tepat untuk keputusan status ritual. Istilah utama “penyakit kulit” dengan catatan kaki mempertahankan keluasan צָרַעַת tanpa menyamakannya dengan penyakit Hansen. “Bisul” sesuai untuk שְׁחִין.
