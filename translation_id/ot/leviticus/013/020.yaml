revisions:
- from: Lalu imam harus memeriksanya. Jika tampak bahwa bagian itu lebih dalam daripada kulit dan bulu di situ telah berubah menjadi putih, imam harus menyatakan orang itu najis. Itu adalah bercak penyakit kulit menular[a] yang timbul pada bisul tersebut.
  to: Kemudian imam harus memeriksanya. Tampak bahwa bagian itu lebih rendah daripada kulit di sekitarnya dan bulu di bagian itu telah berubah putih; imam harus menyatakan orang itu najis. Itu adalah lesi penyakit kulit[a] yang timbul pada bisul itu.
  rationale: Revisi menghapus tambahan makna “menular”, mempertahankan penanda pengamatan dalam teks sumber, dan memakai “lesi penyakit kulit” untuk menyampaikan נֶגַע צָרַעַת secara akurat serta alami dalam bahasa Indonesia modern. Catatan kaki tetap diperlukan dan penandanya tetap langsung melekat pada istilah yang dijelaskan.
