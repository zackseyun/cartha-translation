  yaml_path: translation/ot/leviticus/013/029.yaml
  text: When a man or a woman has an infection on the head or on the beard[b][a],
translation:
  language: id
  text: Jika seorang laki-laki atau perempuan memiliki kelainan[a] pada kepala[b] atau pada janggut,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “luka”, “penyakit”, atau “bercak”. Kata Ibrani nega‘ adalah istilah luas dalam Imamat untuk kelainan atau lesi yang tampak dan diperiksa oleh imam.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepala”; dalam konteks ini mungkin lebih khusus berarti kulit kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: seorang laki-laki atau perempuan
  rationale: Teks Ibrani menyebut kedua jenis kelamin secara eksplisit; bentuk ini mempertahankan cakupan tersebut secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: Jika
  rationale: Dalam rumusan hukum kasuistik, כִּי memperkenalkan suatu kondisi. 'Jika' paling jelas mempertahankan sifat kondisionalnya dalam bahasa Indonesia.
- source_word: יִהְיֶה בּוֹ
  choice: memiliki
  rationale: Ungkapan harfiahnya kira-kira 'ada padanya'; 'memiliki' merupakan ungkapan Indonesia yang wajar dalam konteks pemeriksaan kelainan tubuh.
- source_word: נָגַע
  choice: kelainan
  rationale: נָגַע adalah istilah luas untuk keadaan, luka, atau bercak yang tampak dan diperiksa imam. 'Kelainan' tidak mengandaikan diagnosis medis modern seperti yang dapat tersirat oleh 'infeksi'.
- source_word: בְּ/רֹאשׁ
  choice: pada kepala
  rationale: Pilihan ini mempertahankan keluasan רֹאשׁ. Dalam konteks ini yang dimaksud mungkin lebih khusus kulit kepala, sehingga alternatif itu dicatat dalam catatan kaki.
- source_word: בְ/זָקָן
  choice: pada bagian yang berjanggut
  rationale: זָקָן secara leksikal berarti 'janggut', tetapi karena ketentuan ini secara eksplisit berlaku bagi laki-laki maupun perempuan, frasa ini secara alami menunjuk daerah tumbuhnya janggut, yakni bagian wajah yang berjanggut, bukan hanya rambut janggut yang ada.
theological_decisions:
- issue: Cakupan נָגַע dalam hukum kemurnian
  choice: kelainan
  alternative: infeksi; penyakit; luka; bercak
  rationale: Istilah sumber tidak menetapkan diagnosis medis tertentu. Pilihan umum ini mempertahankan ketidakpastian jenis kondisi yang sedang diperiksa dan menghindari penyamaan langsung dengan penyakit modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dipertahankan sebagai pembuka ketentuan hukum yang berlanjut ke ayat berikutnya; karena itu digunakan koma penutup. 'Bagian yang berjanggut' dipilih agar masuk akal bagi kedua jenis kelamin tanpa menghapus istilah konkret זָקָן.
