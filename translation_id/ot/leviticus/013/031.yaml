revisions:
- from: Jika imam memeriksa bagian yang terkena penyakit kulit kepala atau janggut[a] itu, dan ternyata bagian itu tidak tampak lebih dalam daripada kulit serta tidak ada rambut hitam di situ, imam harus mengisolasi orang yang terkena penyakit itu selama tujuh hari.
  to: Jika imam memeriksa bagian yang terkena kelainan bersisik[a] itu dan ternyata tampaknya tidak lebih dalam daripada kulit serta tidak ada rambut hitam di situ, imam harus mengasingkan orang yang mengalami kelainan bersisik itu selama tujuh hari.
  rationale: Revisi menghilangkan spesifikasi 'kepala atau janggut' dari teks utama karena itu merupakan informasi kontekstual, bukan makna yang perlu dipastikan dari נֶתֶק pada ayat ini. Catatan kaki menyampaikan alternatif leksikal dan ketidakpastian medis. Subjek yang diasingkan dinyatakan sebagai orang yang mengalami kelainan tersebut, suatu pengungkapan idiomatis untuk prosedur yang dalam bahasa Ibrani menyebut lesi/kasusnya.
