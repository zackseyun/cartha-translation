  text: וְ/כִֽי יִרְאֶ֨ה הַ/כֹּהֵ֜ן אֶת נֶ֣גַע הַ/נֶּ֗תֶק וְ/הִנֵּ֤ה אֵין מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וְ/שֵׂעָ֥ר שָׁחֹ֖ר אֵ֣ין בּ֑/וֹ וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת נֶ֥גַע הַ/נֶּ֖תֶק שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: id
  text: Jika imam memeriksa bagian yang terkena kelainan bersisik[a] itu dan ternyata tampaknya tidak lebih dalam daripada kulit serta tidak ada rambut hitam di situ, imam harus mengasingkan orang yang mengalami kelainan bersisik itu selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani נֶתֶק dapat berarti 'gatal' atau istilah tradisional 'scall'; istilah ini menunjuk pada suatu kelainan kulit atau kulit kepala tertentu dalam pasal ini. Jenis penyakit yang tepat tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִרְאֶה
  choice: Jika ... memeriksa
  rationale: Dalam konteks hukum diagnosis, יִרְאֶה berarti melakukan pemeriksaan visual. וְכִי memperkenalkan kasus lanjutan; dalam bahasa Indonesia, 'Jika' menghubungkannya secara alami tanpa perlu mempertahankan 'dan' secara kaku.
- source_word: נֶגַע
  choice: bagian yang terkena penyakit
  rationale: Istilah ini menunjuk pada bagian atau kelainan yang dapat diamati, bukan selalu 'wabah'. Pilihan ini netral dan sesuai dengan konteks pemeriksaan.
- source_word: נֶתֶק
  choice: penyakit kulit kepala atau janggut
  rationale: Dalam konteks Imamat 13:29-37, istilah khusus ini mengenai kelainan pada daerah berambut di kepala atau janggut, yang dapat disertai kerontokan rambut. Ungkapan ini lebih jelas bagi pembaca modern daripada transliterasi atau istilah medis yang terlalu pasti.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: bagian itu tidak tampak lebih dalam daripada kulit
  rationale: Mempertahankan unsur pengamatan visual pada מַרְאֵהוּ dan perbandingan harfiah 'lebih dalam daripada kulit', tanpa mengubahnya menjadi diagnosis modern.
- source_word: שֵׂעָר שָׁחֹר
  choice: rambut hitam
  rationale: Warna hitam disebut secara khusus sebagai bagian dari kriteria pemeriksaan dan tidak digeneralisasi menjadi 'gelap'.
- source_word: וְהִסְגִּיר ... אֶת נֶגַע הַנֶּתֶק
  choice: mengisolasi orang yang terkena penyakit itu
  rationale: Secara tata bahasa objeknya adalah 'bagian/kelainan' tersebut, tetapi dalam praktik hukum orang yang mengalaminya ditempatkan dalam isolasi. Bahasa Indonesia menuntut objek personal agar 'mengisolasi' terdengar alami; hubungan dengan penyakit tetap dinyatakan.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Padanan temporal yang alami dan tepat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum bersyarat dipertahankan, sementara istilah dermatologis yang identitas medisnya tidak pasti dijelaskan secara deskriptif. Penanda catatan kaki [a] dicantumkan dalam teks utama.
