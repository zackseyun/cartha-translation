  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: id
  text: Imam itu memeriksanya, dan ternyata penyakit kulit itu telah menutupi seluruh tubuhnya. Ia harus menyatakan orang yang terkena itu tahir[a]. Seluruhnya telah berubah menjadi putih; orang itu tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia harus menyatakan kelainan itu tahir.” Putusan tersebut berlaku bagi orang yang mengalami kelainan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָאָה
  choice: harus memeriksanya
  rationale: Dalam konteks pemeriksaan keimaman, ראה bukan sekadar melihat, melainkan memeriksa untuk menetapkan status ketahiran.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Menyampaikan bahwa keadaan berikut merupakan hasil yang didapati dalam pemeriksaan, dengan bahasa Indonesia modern dan alami.
- source_word: הַצָּרַעַת
  choice: penyakit kulit
  rationale: צָרַעַת mencakup beragam kelainan kulit dan tidak identik dengan penyakit Hansen yang kini disebut kusta.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: seluruh tubuhnya
  rationale: Dalam konteks ini בשר menunjuk permukaan jasmani orang itu; 'seluruh tubuhnya' lebih alami daripada padanan harfiah 'seluruh dagingnya'.
- source_word: וְטִהַר
  choice: harus menyatakan ... tahir
  rationale: Bentuk piel di sini menyatakan keputusan imam mengenai status ketahiran, bukan tindakan menyembuhkan atau menahirkan.
- source_word: אֶת הַנָּגַע
  choice: orang yang terkena itu
  rationale: Secara harfiah objeknya adalah נגע, yakni kelainan atau bagian yang terkena, tetapi putusan ketahiran berlaku kepada orang yang mengalaminya; pilihan ini menjaga maksud hukum dalam bahasa Indonesia yang jelas.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: Seluruhnya telah berubah menjadi putih
  rationale: Mempertahankan penekanan pada keadaan yang menyeluruh dan hasil perubahan warna yang menjadi dasar putusan.
- source_word: טָהוֹר הוּא
  choice: orang itu tahir
  rationale: '''Tahir'' merupakan istilah Indonesia yang tepat bagi status kemurnian ritual dalam hukum Imamat, tanpa menambahkan penjelasan doktrinal.'
theological_decisions:
- issue: Cakupan istilah צָרַעַת
  choice: penyakit kulit
  alternative: kusta; penyakit kusta; tsaraat
  rationale: Pilihan ini menghindari penyamaan kategori Ibrani kuno yang luas dengan diagnosis modern penyakit Hansen.
- issue: Sifat putusan imam dalam וְטִהַר
  choice: imam harus menyatakan orang yang terkena itu tahir
  alternative: imam harus menahirkan kelainan itu; imam harus menyatakan kelainan itu tahir
  rationale: Imam menetapkan status ritual berdasarkan pemeriksaan; ia tidak menyembuhkan penyakit atau menghasilkan ketahiran melalui tindakan medis.
- issue: Objek gramatikal אֶת הַנָּגַע
  choice: orang yang terkena itu
  alternative: kelainan itu; bagian yang terkena itu
  rationale: Teks Ibrani secara formal menyebut נגע, tetapi dalam penerapan hukum putusan tersebut menyangkut orangnya. Catatan kaki mempertahankan bentuk harfiah dan ambiguitas rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'tahir' dipertahankan karena tepat dalam konteks hukum kemurnian ritual. Struktur dibuat prosedural dan mudah dipahami tanpa menghilangkan perbedaan antara diagnosis penyakit dan penetapan status ritual.
