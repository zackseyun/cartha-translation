base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: id
  text: Imam harus memeriksanya[a], dan ternyata bagian yang terkena itu telah berubah menjadi putih. Imam harus menyatakan bagian yang terkena itu tahir[b]; bagian itu tahir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melihatnya”; dalam konteks ini maksudnya memeriksa bagian yang terkena.
    reason: lexical_alternative
  - marker: b
    text: Atau “menetapkan bahwa bagian itu tahir.” Imam memberikan keputusan tentang status ritualnya, bukan menyembuhkannya.
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: “tahir dia/itu.” Kata ganti maskulin tunggal itu dapat merujuk kepada bagian yang terkena (נֶגַע).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: harus memeriksanya
  rationale: Dalam konteks hukum imamat, ראה bukan sekadar melihat, melainkan melakukan pemeriksaan untuk menentukan status ketahiran.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku untuk כֹּהֵן dalam konteks hukum Imamat.
- source_word: וְהִנֵּה
  choice: Jika
  rationale: Dalam rangkaian prosedural ini, וְהִנֵּה memperkenalkan hasil yang didapati dalam pemeriksaan. Bahasa Indonesia alami menyatakannya sebagai kondisi 'Jika', tanpa mengubah hubungan logis ayat.
- source_word: נֶהְפַּךְ
  choice: telah berubah menjadi
  rationale: Bentuk Nifal menunjukkan perubahan keadaan, yaitu warna bagian yang terkena menjadi putih.
- source_word: הַנֶּגַע
  choice: bagian yang terkena
  rationale: נֶגַע menunjuk pada bagian tubuh yang tampak terkena suatu kelainan dan sedang diperiksa, tanpa menetapkan diagnosis medis modern tertentu.
- source_word: לְלָבָן
  choice: putih
  rationale: Padanan langsung bagi istilah warna לָבָן.
- source_word: וְטִהַר
  choice: harus menyatakan ... tahir
  rationale: Dalam Imamat 13, imam memberikan keputusan resmi tentang status ritual; ia tidak menyembuhkan atau secara fisik membersihkan bagian tersebut.
- source_word: טָהוֹר הוּא
  choice: Bagian itu tahir
  rationale: Mempertahankan pengulangan tegas putusan Ibrani dan menerapkan pronomina maskulin tunggal pada נֶגַע, yakni bagian yang terkena.
theological_decisions:
- issue: Sifat tindakan imam dalam hukum ketahiran
  choice: Imam menyatakan bagian yang terkena itu tahir.
  alternative: Imam menahirkan atau membersihkan bagian tersebut.
  rationale: Dalam konteks ini, טהר menyatakan keputusan imam mengenai status ritual setelah pemeriksaan, bukan tindakan penyembuhan medis atau pembersihan fisik.
- issue: Makna טָהוֹר
  choice: tahir
  alternative: bersih
  rationale: '''Tahir'' mempertahankan ranah status ritual yang dominan dalam pasal ini dan menghindari kesan bahwa ayat hanya berbicara tentang kebersihan jasmani.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Tahir' dipertahankan sebagai istilah yang mudah dikenali untuk status ritual. Struktur prosedural dibuat alami dalam bahasa Indonesia sambil mempertahankan pemeriksaan, perubahan warna, keputusan imam, dan penegasan akhir.
