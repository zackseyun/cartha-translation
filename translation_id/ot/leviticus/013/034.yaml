  to: Pada hari ketujuh, imam harus memeriksa kelainan bersisik itu[a]. Jika kelainan itu tidak meluas pada kulit dan penampakannya tidak lebih dalam daripada kulit[b], imam harus menyatakan orang itu tahir[c]. Orang itu harus mencuci pakaiannya, lalu ia menjadi tahir.
