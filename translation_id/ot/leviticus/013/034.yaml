base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: id
  text: Pada hari ketujuh, imam harus memeriksa kelainan bersisik itu[a]. Jika kelainan itu tidak meluas pada kulit dan penampakannya tidak lebih dalam daripada kulit[b], imam harus menyatakan orang itu tahir[c]. Orang itu harus mencuci pakaiannya, lalu ia menjadi tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani netek, istilah untuk kelainan tertentu pada kulit kepala atau daerah janggut; jenis medisnya tidak dapat dipastikan. Istilah ini juga dapat diterjemahkan "gatal" atau, secara tradisional, "kudis".
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "tidak lebih dalam daripada kulit"; maksudnya, bagian yang terkena tidak tampak cekung di bawah kulit di sekitarnya.
    reason: cultural_note
  - marker: c
    text: Artinya, imam menetapkan secara resmi bahwa orang itu tahir; bukan berarti imam menyembuhkan kelainan kulitnya.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: netek
  rationale: Istilah Ibrani ini menunjuk pada kelainan khusus di kepala atau janggut dalam Imamat 13. Transliterasi dipakai agar tidak memasukkan diagnosis modern yang tidak pasti; catatan kaki menjelaskan cakupan maknanya.
- source_word: פָשָׂה
  choice: meluas
  rationale: Dalam pemeriksaan ini, verba tersebut menyatakan bahwa bagian yang terkena bertambah luas pada kulit.
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: Ungkapan ini secara alami menyatakan lokasi meluasnya kelainan dalam bahasa Indonesia.
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן הָעוֹר
  choice: tampaknya tidak lebih dalam daripada kulit
  rationale: Terjemahan mempertahankan unsur penampakan visual dan perbandingan harfiah yang menjadi kriteria pemeriksaan imam.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: imam harus menyatakan orang itu tahir
  rationale: Dalam hukum kenajisan ritual, imam menetapkan status orang tersebut; ia bukan menyembuhkan kelainan itu.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Orang itu harus mencuci pakaiannya
  rationale: Subjek tersirat dijelaskan secara alami sebagai orang yang diperiksa, sedangkan tindakan ritualnya dipertahankan.
- source_word: וְטָהֵר
  choice: lalu ia menjadi tahir
  rationale: Bentuk ini menyatakan status tahir yang berlaku sesudah pakaiannya dicuci tanpa menyiratkan kesembuhan medis.
- source_word: וְרָאָה
  choice: harus memeriksa
  rationale: Dalam konteks prosedural, verba melihat berfungsi sebagai pemeriksaan resmi oleh imam.
- source_word: וְהִנֵּה
  choice: Jika
  rationale: Dalam rumusan pemeriksaan ini, partikel tersebut memperkenalkan keadaan yang didapati imam; bentuk kondisional wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat tindakan imam dalam hukum ketahiran
  choice: Imam menyatakan orang itu tahir secara resmi.
  alternative: Imam menahirkan orang itu.
  rationale: Konteks hukum menunjukkan penetapan status ritual, bukan tindakan penyembuhan medis atau penyucian yang dilakukan imam terhadap penyakitnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual “tahir” dipertahankan untuk membedakannya dari kebersihan biasa. Istilah teknis “netek” dijelaskan dalam catatan kaki guna menjaga ketidakpastian leksikal sumber.
