review_pass:
  verdict: revise
  source_fidelity: Sebagian besar setia pada teks Ibrani. “Penyakit kulit yang sudah menahun,” “pada kulit tubuhnya,” dan “menyatakan orang itu najis” menyampaikan צָרַעַת נוֹשֶׁנֶת, בְּעוֹר בְּשָׂרוֹ, dan וְטִמְּאוֹ dengan baik. Namun, לֹא יַסְגִּרֶנּוּ adalah larangan/prosedur negatif yang tegas (“jangan/tidak boleh mengasingkannya”), bukan sekadar pernyataan bahwa pengasingan tidak diperlukan.
  naturalness: Bahasa draft umumnya modern dan wajar. “Ia tidak perlu mengasingkannya” terdengar alami, tetapi melemahkan daya larangan bentuk Ibrani. “Imam itu tidak boleh mengasingkannya” tetap alami dan lebih tepat. Mengganti “Itu adalah” dengan “Itu penyakit kulit...” juga membuat pembukaan lebih langsung dalam bahasa Indonesia baku.
  terminology: “Penyakit kulit” tepat sebagai padanan nonspesifik bagi צָרַעַת dan menghindari penyamaan dengan penyakit Hansen. “Najis” mempertahankan istilah ritual-legal yang mapan. “Imam” tepat untuk הַכֹּהֵן. Catatan kaki secara tepat menjelaskan cakupan istilah tanpa membuat diagnosis medis yang tidak didukung teks.
  issues:
  - severity: medium
    issue: “Ia tidak perlu mengasingkannya” melemahkan לֹא יַסְגִּרֶנּוּ.
    rationale: Bentuk negatif imperfect dalam instruksi kepada imam menyatakan bahwa ia tidak boleh/harus tidak mengurung atau mengasingkan orang itu untuk observasi. “Tidak perlu” mengubahnya menjadi sekadar ketiadaan kebutuhan atau pilihan praktis.
  revised_text: Itu penyakit kulit yang sudah menahun pada kulit tubuhnya[a]. Imam harus menyatakan orang itu najis. Imam itu tidak boleh mengasingkannya, sebab orang itu najis.
