source:
  edition: WLC
  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: id
  text: Itu penyakit kulit yang sudah menahun pada kulit tubuhnya[a]. Imam harus menyatakan orang itu najis. Imam itu tidak boleh mengasingkannya, sebab orang itu najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penyakit kulit yang sudah lama ada.” Terjemahan tradisional sering menerjemahkan צָרַעַת sebagai “kusta”, tetapi istilah Ibrani dalam Imamat mencakup kondisi yang lebih luas daripada penyakit kusta modern (penyakit Hansen).'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: Dalam Imamat, istilah ini mencakup berbagai kelainan serius pada kulit dan tidak secara khusus menunjuk pada penyakit Hansen; pilihan ini menghindari kekhususan medis yang menyesatkan.
- source_word: נוֹשֶׁנֶת
  choice: yang sudah menahun
  rationale: Bentuk partisip ini menunjukkan keadaan yang telah lama ada atau menetap. 'Sudah menahun' alami dalam bahasa Indonesia dan tetap mempertahankan gagasan durasi.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: pada kulit tubuhnya
  rationale: '''Tubuh'' lebih wajar daripada ''daging'' dalam konteks pemeriksaan kulit, sedangkan preposisi diterjemahkan secara idiomatis sebagai ''pada''.'
- source_word: וְטִמְּאוֹ
  choice: harus menyatakan orang itu najis
  rationale: Dalam prosedur pemeriksaan keimaman, imam menetapkan dan mengumumkan status kenajisan; ia bukan menyebabkan orang tersebut menjadi najis.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan langsung bagi jabatan kultis ini.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: Ia tidak perlu mengasingkannya
  rationale: Kata kerja ini menunjuk pada pemisahan sementara untuk pengamatan. 'Mengasingkan' jelas dan tidak terlalu memediskan prosedur tersebut seperti 'mengarantina'.
- source_word: כִּי טָמֵא הוּא
  choice: sebab orang itu najis
  rationale: Klausa sebab ini menjelaskan bahwa pengasingan untuk pemeriksaan lanjutan tidak diperlukan karena statusnya sudah jelas.
theological_decisions:
- issue: Penerjemahan istilah kenajisan ritual טמא
  choice: najis
  alternative: tidak tahir
  rationale: '''Najis'' mempertahankan istilah Alkitab yang mapan untuk status ritual-legal dan, dalam konteks ini, tidak menyiratkan kesalahan moral pribadi.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah agar prosedur diagnosis mudah dipahami. 'Tidak perlu' menyampaikan larangan prosedural dalam konteks ketika diagnosis sudah pasti, tanpa memberi kesan bahwa imam dilarang secara moral.
