base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: id
  text: Imam harus memeriksa bagian yang terkena itu. Jika ternyata bagian itu tampak lebih dalam daripada kulit dan di dalamnya terdapat rambut halus berwarna kuning, imam harus menyatakan orang itu najis. Itu adalah netek[a], yaitu penyakit kulit[b] pada kepala atau janggut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani netek; istilah untuk suatu kelainan pada kepala atau daerah janggut. Jenis penyakit yang dimaksud secara tepat tidak diketahui.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “penyakit kulit” mencakup berbagai kelainan serius dan tidak selalu berarti kusta modern (penyakit Hansen).
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: bagian yang terkena
  rationale: Dalam konteks pemeriksaan Imamat 13, kata ini menunjuk pada bagian tubuh yang menunjukkan kelainan. Pilihan ini alami dalam bahasa Indonesia dan tidak memberi diagnosis medis yang terlalu khusus.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: bagian itu tampak lebih dalam daripada kulit
  rationale: Mempertahankan bahasa diagnostik sumber dan gambaran bahwa kelainan itu tampak berada di bawah atau lebih dalam daripada permukaan kulit, tanpa mempersempitnya menjadi diagnosis modern.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: rambut halus berwarna kuning
  rationale: 'Menyampaikan kedua ciri dalam teks Ibrani: warna kuning dan keadaan rambut yang tipis atau halus.'
- source_word: וְטִמֵּא אֹתוֹ
  choice: harus menyatakan orang itu najis
  rationale: Imam memberikan keputusan mengenai status kenajisan ritual; ia tidak menyebabkan orang itu menjadi najis.
- source_word: נֶתֶק
  choice: netek
  rationale: Istilah ini menunjuk pada kelainan khusus di kepala atau daerah janggut, tetapi padanan medisnya tidak pasti. Transliterasi menghindari identifikasi yang bersifat spekulatif, sedangkan catatan kaki memberi penjelasan.
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: Istilah Ibrani ini lebih luas daripada penyakit Hansen yang kini disebut kusta. 'Penyakit kulit' menghindari anakronisme medis dan sesuai dengan konteks ayat.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: pada kepala atau janggut
  rationale: Menyatakan lokasi kelainan dengan dekat pada bentuk sumber; 'kepala' dipertahankan dan tidak dipersempit secara interpretatif menjadi 'kulit kepala'.
theological_decisions:
- issue: Kenajisan sebagai keputusan ritual
  choice: imam harus menyatakan orang itu najis
  alternative: imam membuat orang itu najis
  rationale: Bentuk ini menjaga peran imam sebagai pihak yang menetapkan status ritual berdasarkan tanda-tanda yang diperiksa, bukan sebagai penyebab penyakit atau kenajisan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami, dengan nada hukum-imamat yang tetap bermartabat. Struktur “jika ternyata” menyampaikan fungsi וְהִנֵּה sebagai tanda yang ditemukan dalam pemeriksaan. Istilah teknis netek dipertahankan melalui transliterasi karena identifikasi medisnya tidak pasti.
