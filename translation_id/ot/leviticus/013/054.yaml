  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: id
  text: Kemudian imam harus memerintahkan agar barang yang di dalamnya terdapat tanda penyakit itu[a] dicuci, lalu ia harus mengurungnya[b] selama tujuh hari untuk kedua kalinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “barang yang terkena tanda penyakit itu.” Secara harfiah, ungkapan Ibrani ini berarti “apa yang di dalamnya terdapat tanda penyakit itu” dan menunjuk barang yang sedang diperiksa.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “memisahkannya” atau “mengisolasikannya.” Kata ini secara harfiah dapat berarti “mengurungnya” dan menunjuk pemisahan untuk pemeriksaan lebih lanjut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: Lalu imam harus memerintahkan
  rationale: Waw dengan bentuk perfektif dalam rangkaian hukum menyatakan langkah prosedural berikutnya; “lalu” dan “harus” mengungkapkan urutan serta daya wajibnya secara alami.
- source_word: וְכִבְּסוּ
  choice: agar ... dicuci
  rationale: Bentuk orang ketiga jamak menunjuk pelaksana yang tidak disebutkan. Konstruksi pasif menghindari penambahan pelaku dan tetap wajar dalam bahasa Indonesia.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: barang yang terkena tanda penyakit itu
  rationale: Ungkapan relatif Ibrani sengaja luas dan dalam konteks menunjuk benda yang sedang diperiksa. “Barang” mempertahankan keluasan acuan, sedangkan “terkena” menyampaikan bahwa tanda itu terdapat padanya tanpa menyiratkan diagnosis modern.
- source_word: הַנָּגַע
  choice: tanda penyakit
  rationale: Dalam Imamat 13 istilah ini dapat menunjuk lesi, bercak, atau gejala mencurigakan pada manusia maupun benda. “Tanda penyakit” cukup luas dan lebih alami untuk barang daripada “infeksi”.
- source_word: וְהִסְגִּירוֹ
  choice: kemudian ia harus mengasingkannya
  rationale: Kata kerja ini berarti menutup atau memisahkan sesuatu untuk pemeriksaan. “Mengasingkan” menyampaikan isolasi prosedural tanpa konotasi medis modern yang terlalu khusus dari “mengarantina”.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: selama tujuh hari lagi
  rationale: Terjemahan ini secara idiomatis menyatakan pengulangan masa pengasingan tujuh hari untuk kedua kalinya.
