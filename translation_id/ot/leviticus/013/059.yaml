id: LEV.13.59
reference: Leviticus 13:59
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: id
  text: Inilah ketentuan mengenai bercak kusta[a] pada pakaian wol atau pakaian lenan, pada benang lungsin atau benang pakan, atau pada barang apa pun dari kulit, untuk menyatakannya tahir atau najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “kusta” mencakup berbagai keadaan pada manusia maupun bercak pada pakaian atau barang dari kulit; istilah ini tidak khusus menunjuk pada penyakit Hansen modern.
    reason: Menjaga keluasan makna צָרַעַת dan mencegah pembacaan medis yang anakronistis.
lexical_decisions:
- source_word: תּוֹרַת
  choice: ketentuan mengenai
  rationale: Dalam ayat rangkuman hukum ini, תּוֹרָה menunjuk pada aturan atau prosedur yang mengatur perkara sebelumnya. “Ketentuan” terdengar alami dalam bahasa Indonesia hukum tanpa kehilangan daya normatifnya.
- source_word: נֶגַע צָרַעַת
  choice: bercak kusta
  rationale: נֶגַע menunjuk pada tanda atau bercak yang tampak, sedangkan צָרַעַת adalah kategori luas dalam Imamat yang juga dapat mengenai bahan dan tidak identik dengan diagnosis modern penyakit Hansen. Istilah tradisional “kusta” dipertahankan, dengan catatan kaki untuk mencegah salah pengertian medis.
- source_word: בֶּגֶד הַצֶּמֶר
  choice: pakaian wol
  rationale: Frasa ini menyatakan pakaian yang terbuat dari wol; bentuk Indonesia ini ringkas dan alami.
- source_word: הַפִּשְׁתִּים
  choice: pakaian lenan
  rationale: Secara harfiah berarti ‘lenan/flaks’; kata “pakaian” dilengkapi berdasarkan kesejajaran dengan pakaian wol dan konteks sebelumnya.
- source_word: הַשְּׁתִי
  choice: benang lungsin
  rationale: Istilah tekstil Indonesia bagi benang yang memanjang pada tenunan.
- source_word: הָעֵרֶב
  choice: benang pakan
  rationale: Istilah tekstil Indonesia bagi benang melintang yang ditenunkan melalui benang lungsin.
- source_word: כָּל כְּלִי עוֹר
  choice: barang apa pun dari kulit
  rationale: כְּלִי mencakup berbagai benda atau perkakas. Terjemahan ini mempertahankan keluasan makna dan terdengar wajar dalam bahasa Indonesia.
- source_word: לְטַהֲרוֹ א֥וֹ לְטַמְּאוֹ
  choice: untuk menyatakannya tahir atau najis
  rationale: Dalam konteks hukum keimaman, verba ini menunjuk pada penetapan status ritual, bukan tindakan membersihkan atau mengotori benda secara fisik.
theological_decisions:
- issue: Makna צָרַעַת ketika dikenakan pada pakaian dan barang kulit
  choice: bercak kusta, disertai penjelasan
  alternative: bercak penyakit kulit; bercak yang menajiskan
  rationale: “Penyakit kulit” tidak cocok untuk benda mati dan dapat memberi kesan diagnosis medis yang terlalu sempit, sedangkan “yang menajiskan” memasukkan akibat ritual ke dalam nama fenomenanya. “Kusta” mempertahankan kesinambungan istilah tradisional, sementara catatan menjelaskan keluasan istilah Ibrani.
- issue: Arti tindakan mentahirkan atau menajiskan pada akhir ayat
  choice: menyatakannya tahir atau najis
  alternative: membersihkannya atau menajiskannya
  rationale: Konteksnya adalah keputusan mengenai status ritual benda. Pilihan ini tidak menyiratkan bahwa imam secara fisik membersihkan atau mencemarkan benda tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual “tahir” dan “najis” dipertahankan karena tepat dan lazim dalam konteks Imamat; istilah teknis tekstil diberi bentuk lengkap “benang lungsin” dan “benang pakan” agar mudah dikenali.
