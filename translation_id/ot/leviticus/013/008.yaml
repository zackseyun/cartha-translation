id: LEV.13.8
reference: Leviticus 13:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: id
  text: Imam harus memeriksanya. Jika ternyata kelainan bersisik itu telah menyebar pada kulit, imam harus menyatakan orang itu najis; itu adalah tsaraat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraat adalah istilah Ibrani yang secara tradisional diterjemahkan “kusta”, tetapi dalam Kitab Imamat cakupannya lebih luas daripada penyakit kusta modern dan mencakup berbagai kelainan serius pada kulit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: harus memeriksa
  rationale: Dalam konteks diagnosis keimaman, ראה berarti mengamati dengan saksama untuk menetapkan status, bukan sekadar melihat.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan alami bagi כהן dalam hukum Imamat.
- source_word: וְהִנֵּה
  choice: jika ternyata
  rationale: Ungkapan ini menandai keadaan yang didapati melalui pemeriksaan; 'jika ternyata' mempertahankan daya kondisional sekaligus unsur penemuan.
- source_word: פָּשְׂתָה
  choice: telah menyebar
  rationale: Kata kerja ini menunjuk pada meluasnya kelainan, salah satu kriteria diagnosis utama dalam pasal ini.
- source_word: הַמִּסְפַּחַת
  choice: kelainan bersisik
  rationale: Istilah ini menunjuk pada kelainan kulit yang tampak di permukaan; pilihan ini lebih luas dan lebih tepat daripada 'koreng'.
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: Padanan alami bagi lokasi kelainan yang menyebar.
- source_word: וְטִמְּאוֹ
  choice: harus menyatakan orang itu najis
  rationale: Imam menetapkan secara resmi status kenajisan ritual orang tersebut, bukan menyebabkan ia menjadi najis.
- source_word: צָרַעַת
  choice: tsaraat
  rationale: Transliterasi mempertahankan cakupan istilah Ibrani yang tidak identik dengan kusta modern dan sulit diwakili secara tepat oleh satu nama penyakit Indonesia.
- source_word: הִוא
  choice: itu adalah
  rationale: Pronomina feminin ini merujuk kembali kepada kelainan dan membentuk klausa identifikasi.
theological_decisions:
- issue: Penerjemahan צָרַעַת dalam hukum kemurnian Imamat
  choice: tsaraat
  alternative: kusta; penyakit kulit; penyakit kulit yang menajiskan
  rationale: Istilah Ibrani mencakup kategori kelainan yang lebih luas daripada penyakit Hansen modern. Transliterasi dalam teks, disertai catatan, menghindari ketepatan medis palsu sekaligus mempertahankan kategori ritual teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur prosedural dibuat alami tanpa menghilangkan unsur penemuan dalam וְהִנֵּה. Istilah teknis 'tsaraat' dijelaskan dalam catatan agar tidak disalahartikan sebagai penyakit Hansen saja.
