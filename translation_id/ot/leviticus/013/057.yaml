  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: id
  text: Namun, jika bercak itu muncul lagi pada pakaian, pada benang lungsin atau benang pakan, ataupun pada barang apa pun dari kulit, berarti bercak itu sedang menyebar. Barang yang terkena bercak itu harus kaubakar dalam api.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: muncul lagi
  rationale: Bentuk Nifal menyatakan bahwa bercak tersebut terlihat kembali; dalam konteks pemeriksaan sesudah pencucian, frasa ini secara alami menyatakan kemunculan kembali.
- source_word: בֶּגֶד
  choice: pakaian
  rationale: Istilah ini dapat menunjuk pakaian atau bahan kain; 'pakaian' sesuai dengan pemakaian utama kata tersebut dalam pasal ini dan mudah dipahami.
- source_word: שְׁתִי
  choice: benang lungsin
  rationale: Istilah teknis untuk benang yang memanjang pada tenunan; penambahan 'benang' memperjelas maknanya bagi pembaca umum.
- source_word: עֵרֶב
  choice: benang pakan
  rationale: Pasangan teknis dari lungsin, yaitu benang yang melintang pada tenunan; ini merupakan istilah baku dalam bahasa Indonesia.
- source_word: כְּלִי עוֹר
  choice: barang apa pun dari kulit
  rationale: Frasa Ibrani mencakup berbagai benda atau perkakas berbahan kulit; terjemahan ini mempertahankan cakupannya yang luas.
- source_word: פֹּרַחַת הִוא
  choice: berarti bercak itu sedang menyebar
  rationale: Partisip dari פרח secara harfiah menggambarkan pertumbuhan atau perkembangan. Dalam konteks bercak pada benda, 'sedang menyebar' menyampaikan proses aktif tanpa memasukkan diagnosis medis.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: harus kaubakar dalam api
  rationale: Bentuk orang kedua tunggal menyampaikan ketentuan langsung. 'Harus kaubakar' mempertahankan daya perintah hukum dan bentuk sapaan tunggal.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: barang yang terkena bercak itu
  rationale: Konstruksi relatif menunjuk benda tempat bercak itu berada. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan diagnosis medis modern.
- source_word: הַנָּגַע
  choice: bercak
  rationale: Dalam Imamat 13, נגע adalah istilah teknis bagi bagian yang terkena atau tampak tercemar. 'Bercak' mempertahankan fokus visual dan prosedural tanpa membatasi maknanya pada infeksi medis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah tekstil baku 'benang lungsin' dan 'benang pakan' dipakai agar pasangan teknis Ibrani tetap jelas. Kalimat kedua dipecah untuk kelancaran tanpa mengubah hubungan logis teks.
