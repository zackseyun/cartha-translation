base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: id
  text: Pada hari ketujuh, imam harus memeriksa bagian yang terkena itu. Jika ternyata kelainan bersisik itu[a] tidak menyebar, tidak ada rambut kuning di dalamnya, dan kelainan itu tidak tampak lebih dalam daripada kulit,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani נֶתֶק, istilah bagi kelainan bersisik yang dalam bagian ini berkaitan dengan kulit kepala atau daerah janggut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: harus memeriksa
  rationale: Dalam prosedur diagnosis keimaman, ראה berarti mengamati dengan saksama untuk menetapkan keadaan, bukan sekadar melihat.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku כֹּהֵן dalam konteks hukum pentahiran; imam bertindak sebagai pemeriksa yang berwenang.
- source_word: הַנֶּגַע
  choice: bagian yang terkena itu
  rationale: נֶגַע menunjuk pada bagian tubuh yang terkena suatu kelainan; ungkapan ini tidak menyamakannya dengan diagnosis medis modern tertentu.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Padanan langsung bagi penanda waktu pemeriksaan ulang.
- source_word: וְהִנֵּה
  choice: jika ternyata
  rationale: Dalam rangkaian hukum ini, וְהִנֵּה memperkenalkan hasil yang didapati imam. 'Ternyata' mempertahankan nuansa penemuan, sedangkan 'jika' membuat hubungan bersyarat dengan ketentuan lanjutan menjadi wajar dalam bahasa Indonesia.
- source_word: לֹא פָשָׂה
  choice: tidak menyebar
  rationale: פשה dalam konteks kelainan kulit berarti meluas pada kulit.
- source_word: הַנֶּתֶק
  choice: kelainan bersisik itu
  rationale: נֶתֶק adalah istilah khusus bagi kelainan pada kulit kepala atau daerah janggut dalam bagian ini. Padanan deskriptif ini jelas, tidak arkais, dan tidak memaksakan diagnosis modern.
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: tidak ada rambut kuning padanya
  rationale: Terjemahan ini mempertahankan ketiadaan tanda diagnostik serta hubungan lokatif בוֹ dengan bagian yang terkena.
- source_word: שֵׂעָר צָהֹב
  choice: rambut kuning
  rationale: צָהֹב menyatakan warna kuning atau kekuningan; padanan lugas ini sesuai dengan ciri yang diamati.
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: dan kelainan itu tidak tampak lebih dalam daripada kulit
  rationale: מַרְאֵה menandai penampakan visual. 'Tidak tampak lebih dalam' menyampaikan perbandingan dengan permukaan kulit tanpa mengubahnya menjadi klaim medis tentang kedalaman jaringan.
