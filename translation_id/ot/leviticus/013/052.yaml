  to: Ia harus membakar pakaian itu, atau benang lungsin atau benang pakan, baik yang dari wol maupun dari linen, atau barang apa pun dari kulit yang padanya terdapat tanda itu, karena itu adalah tsaraat[a] yang merusak; barang itu harus dibakar dalam api.
