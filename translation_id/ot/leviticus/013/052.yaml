source:
  edition: WLC
  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: id
  text: Ia harus membakar pakaian itu, atau benang lungsin atau benang pakan, baik yang dari wol maupun dari linen, atau barang apa pun dari kulit yang padanya terdapat tanda itu, karena itu adalah tsaraat[a] yang merusak; barang itu harus dibakar dalam api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraat adalah istilah Ibrani untuk suatu keadaan yang menyebabkan kenajisan ritual. Istilah ini secara tradisional sering diterjemahkan “kusta”, tetapi cakupannya lebih luas daripada penyakit Hansen dan dalam pasal ini juga dipakai untuk tanda pada pakaian serta rumah.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Ia harus membakar
  rationale: Dalam rangkaian hukum ini, bentuk verba dengan waw meneruskan ketentuan prosedural dan menyatakan kewajiban.
- source_word: הַבֶּגֶד
  choice: pakaian itu
  rationale: בגד lazim menunjuk pada pakaian; bentuk definitnya dipertahankan dengan 'itu'.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: benang lungsin ... benang pakan
  rationale: Keduanya merupakan istilah teknis tenun yang berpasangan; 'lungsin' dan 'pakan' adalah padanan baku dan ringkas dalam bahasa Indonesia.
- source_word: בַּצֶּמֶר ... בַפִּשְׁתִּים
  choice: baik yang dari wol maupun dari linen
  rationale: Ungkapan ini secara alami menyatakan bahan dari lungsin atau pakan tersebut; 'linen' menunjuk kain/benang yang dihasilkan dari serat lenan.
- source_word: כָּל כְּלִי הָעוֹר
  choice: barang apa pun dari kulit
  rationale: כלי memiliki cakupan luas, yakni barang, perkakas, atau benda; pilihan ini tidak membatasinya pada wadah.
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: yang terkena tanda itu
  rationale: נגע dalam konteks ini adalah tanda atau bercak yang diperiksa. 'Tanda' menjaga sifatnya yang teramati tanpa menetapkannya sebagai infeksi medis.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: tsaraat yang merusak
  rationale: Transliterasi mempertahankan kategori khas hukum kenajisan yang juga dapat mengenai pakaian dan rumah, sedangkan 'yang merusak' menyampaikan daya merusak atau menggerogoti dari ממארת.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: harus dibakar habis dalam api
  rationale: Bentuk pasif menyatakan hasil yang diwajibkan. 'Dibakar habis' menegaskan pemusnahan barang tersebut, sesuai tindakan yang diperintahkan.
theological_decisions:
- issue: Makna צָרַעַת ketika dikenakan pada tekstil dan kulit
  choice: tsaraat
  alternative: penyakit kulit; kusta; penyakit yang menajiskan
  rationale: Istilah Ibrani ini menunjuk kategori kenajisan ritual yang lebih luas daripada penyakit Hansen dan dalam pasal ini juga dikenakan pada pakaian serta rumah. Transliterasi menghindari diagnosis medis yang keliru dan mempertahankan keterkaitan istilah di seluruh konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah tenun baku 'lungsin' dan 'pakan' dipakai agar rincian teknis teks tetap jelas. 'Tsaraat' dipertahankan dengan catatan kaki karena tidak ada satu padanan Indonesia yang mencakup seluruh penggunaannya dalam Imamat.
