  naturalness: Bahasanya pada umumnya baku dan jelas. “Bulu” lebih alami dan lebih tepat daripada “rambut” untuk rambut/bulu yang tumbuh pada suatu bercak kulit; “rambut” dalam pemakaian Indonesia modern lebih lazim mengacu pada rambut kepala.
  terminology: “Bercak,” “penyakit kulit,” dan “najis” merupakan pilihan yang sesuai. Catatan kaki dengan tepat mencegah penyamaan otomatis צָרַעַת dengan penyakit Hansen modern. Istilah tradisional “kusta” tetap tersedia sebagai alternatif.
