  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: id
  text: Imam harus memeriksa bercak pada kulit tubuh orang itu. Jika bulu pada bercak itu telah berubah menjadi putih dan bercak itu tampak lebih dalam daripada kulit tubuhnya, bercak itu adalah bercak penyakit kulit[a]. Setelah memeriksa bercak itu, imam harus menyatakan orang itu najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “bercak kusta” atau “penyakit kusta”. Istilah Ibrani צָרַעַת mencakup kategori yang lebih luas daripada kusta atau penyakit Hansen modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: bercak
  rationale: Dalam konteks pemeriksaan kulit, kata ini menunjuk pada bagian kulit yang tampak terkena kelainan. “Bercak” alami dalam bahasa Indonesia dan tidak memasukkan diagnosis medis tertentu.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: pada kulit tubuh orang itu
  rationale: עוֹר berarti “kulit” dan בָּשָׂר di sini menunjuk pada tubuh. Ungkapan ini alami dalam bahasa Indonesia serta memperjelas bahwa yang diperiksa adalah kulit orang tersebut.
- source_word: שֵׂעָר
  choice: rambut
  rationale: Padanan langsung dan wajar dalam uraian pemeriksaan kulit.
- source_word: הָפַךְ לָבָן
  choice: telah berubah menjadi putih
  rationale: Bentuk verba menggambarkan perubahan yang hasilnya sudah terlihat pada saat pemeriksaan.
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: bercak itu tampak lebih dalam daripada kulit tubuhnya
  rationale: “Tampak” mempertahankan unsur penampakan visual, sedangkan “lebih dalam” mempertahankan perbandingan dalam teks tanpa menafsirkannya lebih jauh secara medis.
- source_word: נֶגַע צָרַעַת
  choice: bercak penyakit kulit
  rationale: Terjemahan ini mempertahankan kedua unsur nomina dan menghindari penyamaan צָרַעַת dengan penyakit Hansen modern. Istilah tradisional dicatat dalam catatan kaki.
- source_word: וְרָאָהוּ
  choice: setelah memeriksa orang itu
  rationale: Dalam konteksnya, sufiks dapat dipahami menunjuk pada orang yang diperiksa. Susunan temporal menghasilkan bahasa Indonesia yang alami dan mempertahankan urutan pemeriksaan lalu keputusan.
- source_word: וְטִמֵּא אֹתוֹ
  choice: imam harus menyatakannya najis
  rationale: Dalam hukum kenajisan ritual, imam menetapkan dan mengumumkan status orang itu; ia tidak menyebabkan orang tersebut menjadi najis.
theological_decisions:
- issue: Makna צָרַעַת dalam hukum kemurnian Imamat
  choice: penyakit kulit
  alternative: kusta
  rationale: צָרַעַת merupakan kategori kuno yang lebih luas dan tidak dapat begitu saja disamakan dengan kusta atau penyakit Hansen modern. Terjemahan utama menghindari ketepatan medis yang anakronistis, sementara istilah tradisional dipertahankan dalam catatan kaki.
- issue: Daya tindakan imam dalam וְטִמֵּא אֹתוֹ
  choice: menyatakannya najis
  alternative: menjadikannya najis
  rationale: Konteksnya adalah pemeriksaan dan keputusan resmi imam mengenai status kenajisan ritual, bukan tindakan yang menyebabkan kenajisan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “najis” dipertahankan karena merupakan istilah umum dan tepat untuk status ritual dalam konteks Imamat. Pengulangan “bercak” mengikuti corak hukum-diagnostik teks sumber dan menjaga hubungan antarklausa tetap jelas.
