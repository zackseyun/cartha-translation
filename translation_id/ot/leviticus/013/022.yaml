  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: id
  text: Namun, jika bercak itu benar-benar menyebar pada kulit, imam harus menyatakan orang itu najis[a]; itu adalah suatu kelainan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetapkan orang itu najis.” Dalam konteks hukum keimaman, kata kerja Ibrani ini menunjuk pada pernyataan resmi mengenai status kenajisan.
    reason: lexical_alternative
  - marker: b
    text: Atau “penyakit”, “wabah”, atau “bercak yang terkena penyakit”. Istilah Ibraninya luas dan tidak tepat disamakan dengan satu kategori medis modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Dalam konteks ini, waw dengan אִם memperkenalkan keadaan yang berlawanan dengan kasus sebelumnya; “Namun, jika” menyampaikan peralihan bersyarat itu secara alami.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: benar-benar menyebar
  rationale: Gabungan infinitif absolut dan bentuk imperfek menegaskan tindakan menyebar. “Benar-benar menyebar” mempertahankan penekanan itu tanpa menyiratkan tingkat penyebaran yang tidak dinyatakan.
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: עוֹר berarti kulit. Dalam bahasa Indonesia, bercak atau kelainan lazim dikatakan menyebar “pada kulit”, meskipun preposisi Ibrani juga dapat dipahami sebagai “di kulit”.
- source_word: וְטִמֵּא
  choice: harus menyatakan ... najis
  rationale: Dalam prosedur pemeriksaan imamat, bentuk Piel ini menunjuk pada penetapan resmi status kenajisan, bukan tindakan yang menyebabkan orang itu menjadi najis.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku כֹּהֵן dalam konteks hukum keimaman di Imamat.
- source_word: אֹתוֹ
  choice: orang itu
  rationale: Objek maskulin tunggal mengacu pada orang yang diperiksa. Penyebutan eksplisit “orang itu” lebih jelas dan alami daripada pronomina yang dapat ambigu dalam bahasa Indonesia.
- source_word: נֶגַע
  choice: kelainan
  rationale: נֶגַע adalah istilah luas bagi bercak atau keadaan yang terserang dan tidak tepat dipersempit menjadi diagnosis medis modern. “Kelainan” cukup luas untuk konteks pemeriksaan kulit ini.
- source_word: הִוא
  choice: itu adalah
  rationale: Pronomina feminin tersebut mengidentifikasi keadaan atau kelainan yang baru dijelaskan; bahasa Indonesia tidak menandai gender gramatikal.
theological_decisions:
- issue: Sifat pernyataan kenajisan oleh imam
  choice: Imam secara resmi menyatakan orang itu najis.
  alternative: Imam membuat orang itu menjadi najis.
  rationale: Konteks hukum-keimaman menunjukkan diagnosis dan penetapan status ritual yang berwenang, bukan bahwa ucapan imam secara kausal menciptakan kenajisan.
- issue: Sifat נֶגַע
  choice: Istilah umum “kelainan” tanpa diagnosis medis tertentu.
  alternative: “Infeksi”, “penyakit”, atau “wabah”.
  rationale: Teks mempertahankan keluasan istilah Ibrani dan tidak memastikan etiologi medis modern; terjemahan tidak boleh menyelesaikan ketidakpastian itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bercak itu” dipakai untuk memperjelas subjek tersirat dari verba “menyebar” berdasarkan konteks langsung, sedangkan “kelainan” menjaga keluasan נֶגַע. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskannya.
