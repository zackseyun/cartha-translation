  naturalness: Bahasa draf umumnya modern dan jelas. “Mencukur dirinya” lebih dekat dengan bentuk refleksif Ibrani daripada “mencukur rambutnya,” tanpa membatasi tindakan pada rambut kepala. “Mengisolasi kelainan itu” mempertahankan ungkapan sumber; catatan kaki diperlukan karena ungkapan tersebut secara prosedural merujuk pada orang yang terkena kelainan.
  terminology: “Kelainan” merupakan padanan netral yang baik untuk נֶתֶק dan tidak memaksakan diagnosis medis modern. “Imam,” “mengisolasi,” dan “tujuh hari untuk kedua kalinya” sesuai dengan ragam hukum-prosedural.
