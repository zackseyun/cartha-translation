translation:
  language: id
  text: Lalu orang itu harus mencukur dirinya, tetapi bagian yang terkena kelainan itu[a] jangan dicukur. Imam harus mengisolasi kelainan itu[b] selama tujuh hari untuk kedua kalinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini menunjuk pada kelainan tertentu di kulit kepala atau janggut, biasanya disertai kerontokan rambut; jenis penyakitnya tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Imam harus mengisolasi kelainan itu.” Dalam prosedur ini, ungkapan tersebut berarti orang yang mengalami kelainan itu dipisahkan untuk diamati.
    reason: translation_clarity
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: Lalu orang itu harus mencukur rambutnya
  rationale: 'Bentuk hitpael dari גלח menyatakan tindakan refleksif: orang tersebut mencukur dirinya atau mengatur agar rambutnya dicukur. Dalam bahasa Indonesia, objek “rambutnya” membuat tindakan itu jelas dan alami; “lalu” menyampaikan urutan prosedural.'
- source_word: הַנֶּתֶק
  choice: bagian yang terkena kelainan itu
  rationale: נֶתֶק menunjuk pada kelainan khusus di kulit kepala atau daerah janggut yang berkaitan dengan kerontokan rambut, bukan sekadar rasa gatal. Ungkapan ini cukup jelas dalam bahasa Indonesia tanpa menyatakan diagnosis modern yang tidak pasti.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: tetapi bagian yang terkena kelainan itu jangan dicukur
  rationale: Teks Ibrani secara langsung melarang pencukuran pada bagian yang terkena kelainan. Terjemahan ini mempertahankan objek tersebut dan tidak menambahkan bahwa hanya daerah di sekelilingnya yang harus dicukur.
- source_word: וְהִסְגִּיר הַכֹּהֵן אֶת הַנֶּתֶק
  choice: Imam harus mengisolasi orang itu
  rationale: Secara harfiah objeknya adalah “kelainan itu”, tetapi dalam prosedur ini yang dapat diisolasi selama masa pengamatan ialah orang yang mengalaminya. Terjemahan menyampaikan maksud tindakan secara alami, sementara catatan kaki mempertahankan bentuk ungkapan Ibraninya.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: selama tujuh hari untuk kedua kalinya
  rationale: Ungkapan ini menandai masa pengamatan tujuh hari yang diulangi untuk kedua kali.
