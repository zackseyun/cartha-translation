  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: id
  text: Apabila pada kulit tubuh seorang laki-laki atau perempuan terdapat bercak-bercak cerah, yaitu bercak-bercak putih,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: seorang laki-laki atau perempuan
  rationale: Pasangan nomina itu secara eksplisit mencakup kedua jenis kelamin, sedangkan bentuk tak tentu sesuai dengan gaya hukum kasus.
- source_word: כִּי יִהְיֶה
  choice: apabila ... terdapat
  rationale: Dalam konteks pemeriksaan hukum, כִּי memperkenalkan suatu keadaan; konstruksi eksistensial יִהְיֶה dengan lokasi pada kulit paling alami diterjemahkan 'terdapat'.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: pada kulit tubuh
  rationale: עוֹר berarti 'kulit', dan בָּשָׂר menunjuk pada tubuh jasmani orang tersebut. Ungkapan ini konkret sekaligus wajar dalam bahasa Indonesia modern.
- source_word: בֶּהָרֹת
  choice: bercak-bercak cerah
  rationale: Nomina ini menunjuk pada tanda atau area kulit yang tampak terang; 'bercak-bercak cerah' mempertahankan ciri visual dan bentuk jamaknya.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: bercak-bercak putih
  rationale: Adjektiva לְבָנֹת menetapkan warnanya sebagai putih. Pengulangan 'bercak-bercak' mempertahankan pengulangan diagnostik dalam bahasa Ibrani tanpa menghasilkan frasa Indonesia yang janggal seperti 'bercak cerah putih'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Apabila' mempertahankan corak hukum kasus. Susunan memakai 'terdapat' agar alami dan tidak memerlukan pronomina yang dapat mengaburkan rujukan gender. Pengulangan nomina dipertahankan, sementara 'yaitu' menjelaskan hubungan antara bercak cerah dan bercak putih secara idiomatis.
