  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: id
  text: Selama penyakit itu[a] ada padanya, ia harus tetap najis.[b] Ia najis. Ia harus tinggal seorang diri; tempat tinggalnya harus berada di luar perkemahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “luka itu”, “penderitaan itu”, atau “tulah itu”. Istilah Ibrani ini luas dan di sini menunjuk pada kondisi yang telah diperiksa sebagaimana diuraikan dalam pasal ini.
    reason: lexical_alternative
  - marker: b
    text: “Najis” di sini menunjuk pada status kenajisan menurut hukum Imamat, bukan dengan sendirinya kesalahan moral.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: penyakit itu
  rationale: נֶגַע adalah istilah luas untuk luka, serangan, atau kondisi penyakit. Dalam Imamat 13 istilah ini menunjuk pada kondisi yang diperiksa dan dinyatakan menurut hukum; “penyakit” jelas bagi pembaca modern tanpa menyamakannya secara khusus dengan wabah.
- source_word: בּוֹ
  choice: padanya
  rationale: Preposisi ini dapat berarti “di dalam” atau “pada” dirinya. “Padanya” mempertahankan keluasan ungkapan Ibrani dan sesuai untuk kondisi yang tampak pada tubuh.
- source_word: יִטְמָא
  choice: ia tetap najis
  rationale: Bentuk imperfek dalam klausa waktu menyatakan status yang berlangsung selama kondisi itu ada. “Tetap najis” mengungkapkan keberlangsungan tersebut secara alami dalam bahasa Indonesia.
- source_word: טָמֵא הוּא
  choice: Ia najis
  rationale: Klausa tanpa verba ini menegaskan kembali status orang tersebut. Kalimat tersendiri mempertahankan penekanannya tanpa menambahkan kategori penafsiran ke dalam teks utama.
- source_word: בָּדָד
  choice: seorang diri
  rationale: בָּדָד berarti terpisah atau sendirian. “Seorang diri” alami, langsung, dan tidak memberi nuansa klinis tambahan.
- source_word: יֵשֵׁב
  choice: harus tinggal
  rationale: ישב dapat berarti duduk, menetap, atau tinggal. Dalam aturan mengenai tempat kediaman, “tinggal” paling tepat dan alami; “harus” menyampaikan daya ketentuan hukum.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Ungkapan ini menunjukkan tempat di luar kawasan tempat komunitas berkemah. “Perkemahan” sesuai dengan latar perjalanan Israel di padang gurun.
- source_word: מוֹשָׁבוֹ
  choice: tempat tinggalnya
  rationale: מוֹשָׁב menunjuk pada tempat menetap atau kediaman. “Tempat tinggalnya” konkret dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hakikat kenajisan dalam Imamat 13
  choice: Menerjemahkan טמא sebagai “najis” tanpa menambahkan “secara ritual” atau “secara upacara” dalam teks utama.
  alternative: “najis secara ritual” atau “najis secara upacara”
  rationale: Ayat ini menyatakan status kenajisan menurut hukum Imamat dan tidak dengan sendirinya menyatakan kesalahan moral. Teks utama mempertahankan kategori Alkitab “najis”, sedangkan catatan menjelaskan konteksnya tanpa mempersempit bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Pengulangan “Ia najis” dipertahankan untuk mencerminkan penegasan dalam bahasa Ibrani. Istilah “najis” dibiarkan tanpa kualifikasi dalam teks utama agar ambiguitas dan kategori teologis sumber tetap terjaga.
