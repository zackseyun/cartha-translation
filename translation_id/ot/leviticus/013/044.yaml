  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: id
  text: Ia adalah seorang laki-laki yang terkena penyakit kulit[a]; ia najis. Imam harus menyatakan bahwa ia najis; penyakitnya ada di kepalanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional, “seorang yang sakit kusta.” Istilah Ibrani ini menunjuk kepada kondisi kulit yang dibahas dalam pasal ini dan tidak selalu sama dengan kusta modern (penyakit Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina ini berbentuk tunggal maskulin dan menunjuk kepada seorang laki-laki dalam kasus hukum tersebut.
- source_word: צָרוּעַ
  choice: yang terkena penyakit kulit
  rationale: Istilah ini menunjuk kepada orang yang terkena kondisi kulit yang dibahas dalam pasal ini, tanpa menyamakannya secara keliru dengan penyakit Hansen modern.
- source_word: טָמֵא הוּא
  choice: ia najis
  rationale: Dalam konteks Imamat, istilah ini menyatakan kenajisan ritual; 'najis' merupakan padanan Indonesia yang lazim dan tepat.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: harus menyatakan dia najis
  rationale: Gabungan infinitif absolut dan bentuk verba berhingga memberi penegasan. Dalam pemeriksaan imamat, imam menetapkan atau menyatakan status orang itu, bukan menyebabkan kenajisannya.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi pejabat kultis yang melakukan pemeriksaan dan memberikan pernyataan resmi.
- source_word: בְּרֹאשׁוֹ
  choice: di kepalanya
  rationale: Frasa Ibrani secara langsung menunjukkan lokasi pada kepala; terjemahan tidak mempersempitnya menjadi kulit kepala.
- source_word: נִגְעוֹ
  choice: penyakit itu
  rationale: Dalam Imamat 13, נגע menunjuk kepada kelainan atau penyakit yang diperiksa. 'Penyakit' alami dalam bahasa Indonesia, sedangkan 'tulah' dapat memberi kesan hukuman atau wabah.
theological_decisions:
- issue: Kenajisan sebagai status ritual atau kondisi moral
  choice: najis
  alternative: cemar
  rationale: Konteksnya adalah status ritual berdasarkan pemeriksaan imam, bukan penilaian atas kesalahan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan Ibrani dipertahankan sejauh tetap alami. Bentuk penegasan pada deklarasi imam disampaikan dengan 'harus', dan istilah medis yang terlalu spesifik dihindari.
