  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: id
  text: Imam itu memeriksa, dan tampaklah pada kulit tubuh mereka bercak-bercak putih yang pudar; itu adalah ruam[a] yang timbul pada kulit. Orang itu tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelainan kulit” atau “bercak pada kulit”. Istilah Ibrani ini menunjuk pada suatu kondisi kulit yang berbeda dari kondisi-kondisi yang menajiskan dalam pasal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: harus memeriksanya
  rationale: Dalam konteks pemeriksaan imamat di Imamat 13, ראה menyatakan tindakan memeriksa, bukan sekadar melihat. Bentuk prosedural Indonesia memakai “harus” secara wajar.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Padanan baku bagi petugas keimaman yang menentukan status kenajisan dalam pasal ini.
- source_word: וְהִנֵּה
  choice: Jika ternyata
  rationale: Mengungkapkan hasil yang tampak ketika pemeriksaan dilakukan, dengan bahasa Indonesia alami tanpa menghilangkan daya penunjuk הִנֵּה.
- source_word: בְעוֹר בְּשָׂרָם
  choice: pada kulit tubuh mereka
  rationale: Mempertahankan akhiran orang ketiga jamak pada בשרם sambil memakai ungkapan Indonesia yang alami.
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: bercak-bercak putih yang pudar
  rationale: בֶּהָרֹת menunjuk pada bercak yang tampak, sedangkan כֵּהוֹת membatasi warna putih itu sebagai redup atau tidak terang.
- source_word: בֹּהַק
  choice: ruam
  rationale: Istilah langka ini menunjuk pada kelainan kulit yang tidak menajiskan dan dibedakan dari penyakit kulit serius dalam pasal tersebut. “Ruam” mudah dipahami tanpa menyatakan diagnosis medis yang terlalu pasti.
- source_word: פָּרַח
  choice: timbul
  rationale: Dalam konteks kelainan kulit, פרח menggambarkan sesuatu yang muncul atau pecah keluar pada kulit; “timbul” alami dalam bahasa Indonesia.
- source_word: טָהוֹר הוּא
  choice: orang itu tahir
  rationale: “Tahir” mempertahankan kategori hukum-ritual dalam Imamat dan tidak mengubahnya menjadi pernyataan tentang kesembuhan medis atau kemurnian moral.
theological_decisions:
- issue: Sifat keputusan imam
  choice: orang itu tahir
  alternative: orang itu bersih; orang itu suci secara ritual
  rationale: Konteksnya adalah penetapan status tahir dalam hukum keimaman. “Tahir” mempertahankan kategori ritual tanpa menambahkan gagasan kesembuhan atau kemurnian moral.
- issue: Sifat בֹּהַק
  choice: ruam, dengan catatan bahwa istilah ini menunjuk pada kelainan yang tidak menajiskan
  alternative: ruam yang tidak berbahaya; bercak kulit; erupsi kulit
  rationale: Teks menetapkan bahwa kondisi tersebut tidak membuat orang itu najis, tetapi tidak secara eksplisit memberikan penilaian medis bahwa kondisi itu tidak berbahaya. Karena itu, penjelasan tersebut ditempatkan dalam catatan, bukan ditambahkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dihaluskan menjadi prosedur pemeriksaan yang alami. Pergantian dari “mereka” dalam gambaran kulit kepada “orang itu” dalam keputusan akhir dipertahankan untuk mencerminkan bentuk jamak dan tunggal dalam teks Ibrani.
