  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: id
  text: Jika bagian depan kepalanya menjadi botak, ia botak di dahi[a]; ia tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "botak di bagian depan kepala" atau "mengalami kebotakan frontal." Istilah Ibrani ini membedakan kebotakan di bagian depan kepala dari kebotakan di bagian belakang atau ubun-ubun dalam ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: di bagian depan kepalanya
  rationale: Secara harfiah frasa ini memadukan gagasan ‘tepi/sisi’ dan ‘wajahnya’, tetapi dalam konteks pemeriksaan kulit kepala menunjuk pada daerah depan kepala.
- source_word: יִמָּרֵט רֹאשׁוֹ
  choice: rambut ... kepalanya rontok
  rationale: Bentuk Nifal menyatakan kepala menjadi gundul karena rambut hilang; ungkapan ini menyampaikan proses tersebut secara alami dalam bahasa Indonesia.
- source_word: גִּבֵּחַ
  choice: botak di bagian depan
  rationale: Istilah ini secara khusus menunjuk pada kebotakan frontal dan dibedakan dari istilah kebotakan pada bagian belakang atau ubun-ubun dalam ayat sebelumnya.
- source_word: טָהוֹר
  choice: tahir
  rationale: Dalam peraturan Imamat, kata ini menyatakan status ritual, bukan kebersihan jasmani atau kemurnian moral. ‘Tahir’ mempertahankan kategori hukum ritual itu.
theological_decisions:
- issue: Istilah status ritual dalam hukum ketahiran
  choice: tahir
  alternative: bersih; murni
  rationale: Ayat ini menetapkan status ritual berdasarkan pemeriksaan jasmani. ‘Tahir’ menghindari kesan bahwa yang dimaksud semata-mata bersih secara fisik atau murni secara moral.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Namun, jika’ mencerminkan kesinambungan bersyarat dengan ayat sebelumnya; pengulangan makna kebotakan dipertahankan karena teks Ibrani mula-mula menggambarkan hilangnya rambut lalu menetapkan jenis kebotakannya.
