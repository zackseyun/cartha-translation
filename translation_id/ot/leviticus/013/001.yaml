  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa dan Harun dengan berfirman:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN” dalam banyak terjemahan.'
    reason: Menjelaskan bentuk Ibrani nama ilahi yang diterjemahkan “Yahweh” serta padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk ini memperkenalkan peristiwa tutur ilahi yang baru. Dalam bahasa Indonesia Alkitabiah yang tetap wajar, “berfirman” secara tepat menandai bahwa Allah adalah penuturnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani dipertahankan.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kepada Musa dan Harun
  rationale: Preposisi אֶל menandai pihak yang disapa. Bahasa Indonesia tidak perlu mengulang “kepada” sebelum Harun, walaupun bahasa Ibrani mengulang preposisinya.
- source_word: לֵאמֹר
  choice: '[ditandai dengan koma dan dilanjutkan oleh isi ujaran pada ayat berikutnya]'
  rationale: Infinitif ini memperkenalkan isi firman berikutnya. Dalam bahasa Indonesia, formula “dengan mengatakan” terasa kaku; koma secara alami menghubungkan pengantar ini dengan ujaran langsung pada ayat selanjutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut dan merupakan rekonstruksi pelafalan yang paling umum dalam kajian modern.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Berfirman” mempertahankan nuansa formula tutur ilahi, sedangkan koma menghindari terjemahan harfiah לֵאמֹר yang tidak alami. Penanda catatan kaki ditempatkan setelah rangkaian penerima firman, mengikuti lapisan konsultasi yang diberikan.
