  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: id
  text: Imam harus memeriksanya. Dan ternyata, rambut pada bercak terang itu telah berubah menjadi putih dan bercak itu tampak lebih dalam daripada kulit; itu adalah penyakit kulit[a] yang telah timbul pada bekas luka bakar itu. Imam harus menyatakan orang itu najis. Itu adalah lesi penyakit kulit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani: tsara''at, istilah luas untuk kelainan kulit yang serius; secara tradisional diterjemahkan “kusta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: memeriksanya
  rationale: Dalam konteks diagnosis keimaman, kata ini menunjuk pada pemeriksaan resmi, bukan sekadar melihat.
- source_word: בַּהֶרֶת
  choice: bercak terang
  rationale: Istilah ini menggambarkan bercak kulit yang tampak terang tanpa memasukkan diagnosis medis modern.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: rambut ... telah berubah menjadi putih
  rationale: Pilihan ini mempertahankan gagasan perubahan yang dinyatakan oleh bentuk Ibrani.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: bercak itu tampak lebih dalam daripada kulit
  rationale: Ungkapan ini menyampaikan kesan visual bahwa bercak tersebut tampak cekung atau berada di bawah permukaan kulit.
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: Istilah Ibrani mencakup kategori kelainan kulit yang lebih luas daripada penyakit Hansen; padanan ini menghindari identifikasi medis yang terlalu sempit.
- source_word: מִכְוָה
  choice: bekas luka bakar
  rationale: Dalam konteks ini, kata tersebut menunjuk pada bagian kulit yang sebelumnya terbakar.
- source_word: פָּרָחָה
  choice: muncul
  rationale: Dalam uraian penyakit kulit, kata ini menggambarkan timbulnya atau merebaknya kelainan; 'muncul' alami dan tidak melebihkan gagasan penyebaran.
- source_word: טִמֵּא אֹתוֹ
  choice: menyatakan orang itu najis
  rationale: Imam memberikan keputusan status kenajisan ritual, bukan menyebabkan orang itu menjadi najis.
- source_word: נֶגַע צָרַעַת
  choice: kelainan penyakit kulit
  rationale: '''Kelainan'' menyampaikan tanda atau bagian kulit yang terkena tanpa mengimpor pengertian infeksi mikrobiologis modern.'
theological_decisions:
- issue: Makna צָרַעַת dalam hukum kemurnian Imamat
  choice: penyakit kulit
  alternative: kusta
  rationale: צָרַעַת merupakan kategori ritual-dermatologis yang lebih luas dan tidak dapat disamakan begitu saja dengan penyakit Hansen.
- issue: Fungsi imam dalam keputusan kenajisan
  choice: menyatakan orang itu najis
  alternative: membuat orang itu najis
  rationale: Bentuk ini mengungkapkan keputusan resmi imam dan tidak menyiratkan bahwa imam secara kausal menimbulkan kenajisan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Jika ternyata' menyampaikan fungsi וְהִנֵּה sebagai pengantar hasil pemeriksaan secara alami dalam kalimat bersyarat. Istilah ritual 'najis' dipertahankan karena merupakan istilah mapan dan sesuai konteks hukum kemurnian.
