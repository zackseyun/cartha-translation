revisions:
- from: Imam harus memeriksanya. Jika ternyata rambut pada bercak terang itu telah berubah menjadi putih dan bercak itu tampak lebih dalam daripada kulit, itu adalah penyakit kulit[a] yang muncul pada bekas luka bakar. Imam harus menyatakan orang itu najis; itu adalah kelainan penyakit kulit.
  to: Imam harus memeriksanya. Dan ternyata, rambut pada bercak terang itu telah berubah menjadi putih dan bercak itu tampak lebih dalam daripada kulit; itu adalah penyakit kulit[a] yang telah timbul pada bekas luka bakar itu. Imam harus menyatakan orang itu najis. Itu adalah lesi penyakit kulit.
  rationale: Revisi mengganti pembacaan bersyarat “Jika ternyata” dengan “Dan ternyata” untuk mencerminkan וְהִנֵּה, serta memperbaiki frasa penutup menjadi “lesi penyakit kulit” untuk menerjemahkan נֶגַע צָרַעַת secara lebih alami dan setia. Catatan kaki dipertahankan dan jangkar [a] tetap melekat pada padanan pertama untuk צָרַעַת.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:14:42Z'
review_pass:
  verdict: revise
  source_fidelity: Draf tepat menerjemahkan pemeriksaan imam, rambut yang menjadi putih, tampak lebih dalam daripada kulit, lokasi pada bekas luka bakar, dan putusan kenajisan. Namun, “Jika ternyata” mengubah וְהִנֵּה (‘dan lihatlah/ternyata’) menjadi syarat. Frasa akhir “kelainan penyakit kulit” juga tidak alami dan kurang tepat menangkap נֶגַע צָרַעַת sebagai lesi atau tanda penyakit kulit.
  naturalness: Bahasa draf umumnya baku dan jelas. “Kelainan penyakit kulit” terdengar berlebihan dan tidak idiomatis; “lesi penyakit kulit” lebih ringkas dan sesuai konteks pemeriksaan kulit. “Dan ternyata” secara alami mempertahankan fungsi pengamatan diagnostik dari וְהִנֵּה tanpa menjadikannya kalimat bersyarat.
  terminology: “Penyakit kulit” dengan catatan tentang tsara'at adalah pilihan yang aman dan tidak menyamakan istilah Ibrani itu dengan penyakit Hansen. “Najis” tepat untuk status ritual. “Lesi” secara tepat membedakan נֶגַע sebagai tanda/kelainan yang tampak dari istilah umum צָרַעַת.
  issues:
  - severity: medium
    issue: “Jika ternyata” menerjemahkan וְהִנֵּה sebagai syarat.
    rationale: Teks Ibrani menyatakan hasil pemeriksaan dengan partikel presentatif, bukan membentuk anak kalimat bersyarat. “Dan ternyata” mempertahankan alur observasional tersebut.
  - severity: medium
    issue: “kelainan penyakit kulit” pada kalimat penutup tidak alami dan kurang spesifik.
    rationale: נֶגַע צָרַעַת menunjuk pada lesi/tanda dari kondisi kulit itu. “Lesi penyakit kulit” menyampaikan relasi tersebut tanpa menyiratkan infeksi mikrobiologis.
  revised_text: Imam harus memeriksanya. Dan ternyata, rambut pada bercak terang itu telah berubah menjadi putih dan bercak itu tampak lebih dalam daripada kulit; itu adalah penyakit kulit[a] yang telah timbul pada bekas luka bakar itu. Imam harus menyatakan orang itu najis. Itu adalah lesi penyakit kulit.
  revised_footnotes:
  - marker: a
    text: 'Bahasa Ibrani: tsara''at, istilah luas untuk kelainan kulit yang serius; secara tradisional diterjemahkan “kusta”.'
    reason: lexical_alternative
  revision_rationale: Revisi mengganti pembacaan bersyarat “Jika ternyata” dengan “Dan ternyata” untuk mencerminkan וְהִנֵּה, serta memperbaiki frasa penutup menjadi “lesi penyakit kulit” untuk menerjemahkan נֶגַע צָרַעַת secara lebih alami dan setia. Catatan kaki dipertahankan dan jangkar [a] tetap melekat pada padanan pertama untuk צָרַעַת.
