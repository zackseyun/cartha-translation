  terminology: '"Imam" tepat untuk הַכֹּהֵן. "Memeriksanya" tepat dalam konteks inspeksi imamat. "Mengasingkan orang itu" menyampaikan הִסְגִּירוֹ tanpa membatasi maknanya pada terminologi medis modern; catatan kaki secara tepat memberi "karantina" sebagai alternatif dan menjelaskan tujuan pengamatan.'
