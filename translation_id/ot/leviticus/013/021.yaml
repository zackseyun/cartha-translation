  source_fidelity: 'Terjemahan dengan setia mencerminkan unsur-unsur utama teks Ibrani: kondisi bersyarat, pemeriksaan imam terhadap bercak, ketiadaan rambut putih, bercak yang tidak cekung/lebih dalam daripada kulit, keadaan yang pudar atau redup, serta pengasingan orang yang diperiksa selama tujuh hari. "Tampak pudar" merupakan padanan yang wajar bagi כֵהָה tanpa menyatakan diagnosis medis yang tidak ada dalam teks.'
