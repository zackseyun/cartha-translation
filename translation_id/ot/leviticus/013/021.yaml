  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בָּ/הּ֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣יא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: id
  text: Tetapi jika imam memeriksanya dan ternyata tidak ada rambut putih di situ, serta bagian itu tidak lebih dalam daripada kulit, melainkan tampak pudar, imam harus mengasingkan orang itu selama tujuh hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menempatkan orang itu dalam karantina selama tujuh hari.” Kata kerja Ibrani menunjuk pada tindakan memisahkan orang itu untuk diamati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Menandai keadaan bersyarat yang berlawanan dengan kemungkinan diagnosis pada ayat sebelumnya.
- source_word: יִרְאֶנָּה
  choice: memeriksanya
  rationale: Secara harfiah berarti 'melihatnya', tetapi dalam konteks pemeriksaan imamat mengacu pada pengamatan untuk menetapkan keadaan bercak.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Menyampaikan formula pengamatan Ibrani secara alami dalam bahasa Indonesia modern.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: tidak ada rambut putih di situ
  rationale: Mempertahankan tanda diagnosis yang diamati; 'di situ' secara alami merujuk kepada bagian yang terkena.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: bagian itu tidak lebih dalam daripada kulit
  rationale: שְׁפָלָה secara harfiah menunjukkan keadaan rendah atau cekung; 'lebih dalam' menyampaikan kriteria visual tersebut dengan jelas.
- source_word: וְהִיא כֵהָה
  choice: melainkan tampak pudar
  rationale: כֵהָה menunjukkan tampilan yang redup, samar, atau berkurang ketegasannya; 'tampak pudar' alami dalam konteks bercak kulit.
- source_word: וְהִסְגִּירוֹ
  choice: imam harus mengasingkan orang itu
  rationale: Kata kerja ini menunjukkan penutupan atau pemisahan untuk pengamatan; akhiran maskulin merujuk kepada orang yang diperiksa, bukan kepada bercaknya.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Padanan langsung dan wajar untuk ungkapan jangka waktu tersebut.
