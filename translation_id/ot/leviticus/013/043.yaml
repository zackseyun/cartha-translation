base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: id
  text: Lalu imam memeriksa orang itu. Ternyata benjolan penyakit itu berwarna putih kemerah-merahan pada bagian belakang kepalanya yang botak atau pada bagian depan kepalanya yang botak[b], seperti tampaknya penyakit kulit[a] pada kulit tubuhnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani צָרַעַת secara tradisional diterjemahkan “kusta”, tetapi dalam Kitab Imamat istilah ini menunjuk pada beragam gangguan kulit serius, bukan hanya penyakit Hansen.
    reason: lexical_alternative
  - marker: b
    text: Kedua istilah Ibrani untuk kebotakan ini tampaknya membedakan bagian belakang kepala dari bagian depan kepala.
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה אֹתוֹ הַכֹּהֵן
  choice: Lalu imam memeriksa orang itu
  rationale: Dalam tata cara pemeriksaan Imamat 13, ראה berarti melihat dengan saksama untuk menetapkan keadaan; “memeriksa” menyampaikan fungsi proseduralnya secara alami.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Menandai hasil yang didapati imam saat pemeriksaan, dengan daya tunjuk yang alami dalam bahasa Indonesia.
- source_word: שְׂאֵת הַנֶּגַע
  choice: benjolan akibat penyakit tersebut
  rationale: שְׂאֵת menunjuk bagian kulit yang meninggi atau membengkak, sedangkan נֶגַע adalah gangguan yang sedang diperiksa. Ungkapan ini jelas tanpa memakai istilah medis yang terlalu khusus.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: putih kemerah-merahan
  rationale: 'Mempertahankan urutan unsur warna Ibrani: putih dengan corak kemerahan.'
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: pada bagian belakang kepalanya yang botak atau pada bagian depan kepalanya yang botak
  rationale: Kedua istilah membedakan dua lokasi kebotakan, kemungkinan bagian belakang dan bagian depan kepala. Rumusan ini mempertahankan kontras tersebut dengan bahasa yang mudah dipahami.
- source_word: כְּמַרְאֵה
  choice: seperti rupa
  rationale: Mempertahankan bahasa perbandingan visual yang penting dalam diagnosis pada pasal ini.
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: Istilah Ibrani ini mencakup kategori gangguan kulit yang lebih luas daripada penyakit Hansen yang kini lazim disebut kusta.
- source_word: עוֹר בָּשָׂר
  choice: kulit tubuhnya
  rationale: Menyampaikan kedua unsur tubuh dan kulit secara wajar dalam bahasa Indonesia serta membedakan lokasi biasa pada kulit tubuh dari bagian kepala yang botak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-imamiah yang tetap jelas bagi pembaca umum. “Ternyata” dipakai sebagai padanan alami bagi formula pengamatan וְהִנֵּה. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke putusan pada ayat berikutnya.
