  naturalness: Bahasa Indonesia baku dan jelas. "Seperti tampaknya" lebih alami daripada "seperti rupa" dalam perbandingan pengamatan visual.
  terminology: '"Imam", "memeriksa", "benjolan", dan "penyakit kulit" sesuai konteks. Catatan mengenai צָרַעַת dan pembedaan dua istilah kebotakan tetap tepat serta jangkar catatannya ditempatkan pada unsur yang relevan.'
