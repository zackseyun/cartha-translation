  - severity: low
    issue: Ungkapan "seperti rupa" kurang alami
    rationale: Ungkapan ini dapat dipahami, tetapi "seperti tampaknya" lebih idiomatis dalam bahasa Indonesia modern dan tetap mencerminkan כְּמַרְאֵה, "seperti penampakan/tampaknya".
