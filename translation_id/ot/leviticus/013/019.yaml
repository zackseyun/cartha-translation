  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Istilah diagnostik dibedakan secara konsisten: ''pembengkakan'' untuk שְׂאֵת dan ''bercak mengilap'' untuk בַהֶרֶת. Penanda catatan kaki [a] ditempatkan pada klausa yang dijelaskannya.'
