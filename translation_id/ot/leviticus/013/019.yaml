  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: id
  text: dan di tempat bisul itu timbul pembengkakan putih atau bercak putih kemerah-merahan yang terang, ia harus diperlihatkan kepada imam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan ia akan terlihat oleh imam.” Dalam konteks ini, ungkapan Ibrani kemungkinan besar berarti bahwa orang atau bagian yang terkena harus diperlihatkan kepada imam untuk diperiksa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: apabila ... timbul
  rationale: Dalam hukum pemeriksaan ini, bentuk היה menyatakan munculnya keadaan pada bekas bisul; 'timbul' alami dalam bahasa Indonesia dan tetap menyampaikan perkembangan gejala.
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: di tempat bisul itu
  rationale: Ungkapan lokatif yang lugas; 'bisul' merupakan padanan umum bagi שְׁחִין dalam konteks kelainan kulit.
- source_word: שְׂאֵת לְבָנָה
  choice: pembengkakan putih
  rationale: שְׂאֵת menunjuk pada bagian kulit yang terangkat atau bengkak, sedangkan לְבָנָה menyatakan warnanya.
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: bercak mengilap yang putih kemerah-merahan
  rationale: '''Bercak mengilap'' membedakan בַהֶרֶת dari pembengkakan; rangkaian adjektiva mempertahankan unsur putih dan kemerah-merahan tanpa menghapus ketegangan deskriptif teks.'
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: bagian itu harus diperlihatkan kepada imam
  rationale: Nifal ראה secara harfiah dapat berarti 'terlihat', tetapi konteks prosedural menunjuk pada penyajian bagian yang terkena untuk diperiksa imam. 'Bagian itu' memperjelas acuan tanpa menganggap bahwa orangnya sendiri merupakan subjek gramatikal.
