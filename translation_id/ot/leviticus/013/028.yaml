  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: id
  text: Namun, jika bercak terang itu tetap di tempatnya dan tidak menyebar pada kulit,[a] serta warnanya memudar, itu adalah pembengkakan akibat luka bakar. Imam harus menyatakan orang itu tahir, sebab itu adalah bekas luka bakar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berdiri di bawahnya”; dalam konteks ini maksudnya bercak itu tetap di tempat dan tidak menyebar.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: tetap di tempatnya
  rationale: Ungkapan harfiahnya, “berdiri di bawahnya,” dalam konteks pemeriksaan berarti bercak itu tidak bergerak atau meluas. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan makna pengamatan medisnya.
- source_word: הַבַּהֶרֶת
  choice: bercak terang
  rationale: Istilah ini menunjuk pada perubahan warna kulit yang tampak terang; “bercak terang” jelas dan sesuai dengan konteks Imamat 13.
- source_word: לֹא פָשְׂתָה בָעוֹר
  choice: tidak menyebar pada kulit
  rationale: פָשְׂתָה adalah istilah diagnostik untuk perluasan kelainan kulit. Preposisi ב dapat diungkapkan secara alami sebagai “pada” dalam bahasa Indonesia.
- source_word: כֵהָה
  choice: warnanya memudar
  rationale: Kata ini menunjukkan berkurangnya kecerahan atau ketegasan bercak. Penambahan “warnanya” memperjelas acuannya tanpa mengubah makna.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: pembengkakan akibat luka bakar
  rationale: שְׂאֵת menunjuk pada bagian kulit yang terangkat atau membengkak, sedangkan הַמִּכְוָה adalah luka bakar. “Akibat” mengungkapkan hubungan konstruksi Ibraninya secara wajar.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: Imam harus menyatakan orang itu tahir
  rationale: Dalam konteks diagnosis keimaman, verba ini berarti menetapkan status tahir, bukan membuat orang itu menjadi bersih secara fisik.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: bekas luka bakar
  rationale: צָרֶבֶת menunjuk pada bekas atau jaringan parut yang ditinggalkan luka bakar. “Bekas luka bakar” merupakan ungkapan Indonesia yang alami dan tidak terlalu teknis.
theological_decisions:
- issue: Makna status tahir
  choice: menyatakan orang itu tahir
  alternative: menahirkan orang itu
  rationale: Bentuk ini mempertahankan fungsi imam sebagai pihak yang menetapkan hasil pemeriksaan, tanpa menyiratkan bahwa imam secara aktif menyembuhkan atau membersihkan kelainan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tahir” dipertahankan sebagai istilah status ritual yang lazim dalam konteks Imamat, sedangkan “orang itu” memperjelas objek sufiks maskulin tanpa menganggap jenis penyakit tertentu.
