id: LEV.13.15
reference: Leviticus 13:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: id
  text: Ketika imam melihat daging yang terbuka[a] itu, ia harus menyatakan orang itu najis[b]. Daging yang terbuka itu najis; itu adalah penyakit kulit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “daging yang hidup”; maksudnya, jaringan hidup yang tersingkap.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menetapkan orang itu sebagai najis.” Imam sedang memberikan keputusan resmi tentang status kenajisannya.'
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional diterjemahkan “kusta”, tetapi istilah Ibraninya mencakup penyakit atau kelainan kulit secara lebih luas dan tidak secara khusus menunjuk pada penyakit Hansen modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Ketika ... melihat
  rationale: Waw dengan bentuk qatal melanjutkan prosedur hukum; klausa waktu alami dalam bahasa Indonesia dan sesuai dengan konteks pemeriksaan.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi כֹּהֵן dalam konteks hukum Imamat.
- source_word: הַבָּשָׂר הַחַי
  choice: daging yang terbuka
  rationale: Secara harfiah berarti 'daging yang hidup'. Dalam pemeriksaan penyakit kulit, ungkapan ini menunjuk pada jaringan hidup yang tersingkap; 'daging yang terbuka' lebih alami dan jelas daripada terjemahan harfiah.
- source_word: וְטִמְּאוֹ
  choice: ia harus menyatakan orang itu najis
  rationale: Bentuk piel טמא dalam hukum kenajisan menunjuk pada keputusan resmi imam mengenai status kenajisan, bukan tindakan yang menyebabkan orang itu menjadi najis.
- source_word: טָמֵא הוּא
  choice: itu najis
  rationale: Mempertahankan istilah ritual baku 'najis' dan mengacu kepada daging yang terbuka.
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: Istilah Ibrani ini lebih luas daripada penyakit Hansen modern; padanan ini menghindari ketepatan medis yang tidak dimaksudkan teks.
theological_decisions:
- issue: Makna צָרַעַת dalam hukum kenajisan Imamat
  choice: penyakit kulit
  alternative: kusta; penyakit kulit yang menajiskan
  rationale: Terjemahan ini tidak memasukkan anggapan medis modern atau tradisional yang terlalu sempit, sambil mempertahankan kategori kondisi kulit yang dinilai menurut hukum ritual.
- issue: Fungsi imam dalam וְטִמְּאוֹ
  choice: menyatakan orang itu najis
  alternative: menjadikan orang itu najis
  rationale: Imam memberikan keputusan resmi tentang status ritual; teks tidak perlu dipahami seolah-olah keputusan imam menyebabkan kondisi itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan gaya prosedural hukum. 'Najis' dipakai sebagai istilah ritual yang lazim; pronomina diperjelas menjadi 'orang itu' agar objek keputusan imam tidak rancu.
