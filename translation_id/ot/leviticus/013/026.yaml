  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: id
  text: Namun, jika imam memeriksanya dan ternyata tidak ada rambut putih pada bercak cerah itu, bercak itu tidak tampak lebih rendah daripada permukaan kulit[a] dan tampak samar, imam harus mengisolasi orang itu selama tujuh hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak tampak lebih dalam daripada kulit,” yaitu tidak tampak cekung di bawah permukaan kulit di sekitarnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “memisahkan orang itu” atau “mengurung orang itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: memeriksanya
  rationale: Secara harfiah berarti ‘melihatnya’, tetapi dalam konteks pemeriksaan resmi oleh imam, ‘memeriksanya’ menyampaikan tindakan yang dimaksud secara wajar.
- source_word: בַּבֶּהֶרֶת
  choice: pada bercak cerah itu
  rationale: בַּהֶרֶת menunjuk pada bercak atau tanda kulit yang tampak cerah; pilihan ini mempertahankan unsur visual tanpa menetapkan diagnosis medis modern.
- source_word: שֵׂעָר לָבָן
  choice: rambut putih
  rationale: Ungkapan tunggal kolektif ini secara alami diterjemahkan ‘rambut putih’ dalam bahasa Indonesia.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: bercak itu tidak tampak lebih dalam daripada kulit
  rationale: שְׁפָלָה secara harfiah berkaitan dengan keadaan rendah atau cekung. ‘Tidak tampak lebih dalam’ menyampaikan kriteria visual bahwa bercak itu tidak cekung di bawah permukaan kulit.
- source_word: כֵהָה
  choice: warnanya sudah pudar
  rationale: Kata ini menunjukkan bahwa tampilan bercak telah melemah atau tidak lagi mencolok; ‘pudar’ jelas dan alami dalam konteks warna bercak kulit.
- source_word: וְהִסְגִּירוֹ
  choice: imam harus mengisolasi orang itu
  rationale: Kata kerja ini berarti menutup, mengurung, atau memisahkan seseorang untuk masa pengamatan. ‘Mengisolasi’ menyampaikan prosedurnya dengan jelas tanpa menyiratkan pembuangan permanen.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Terjemahan langsung dan alami untuk jangka waktu yang disebutkan.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Dalam bahasa Indonesia modern, ‘ternyata’ secara alami mempertahankan fungsi penanda wacana yang mengarahkan perhatian kepada hasil pemeriksaan.
