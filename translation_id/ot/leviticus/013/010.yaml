translation:
  language: id
  text: Imam itu memeriksanya, dan tampak ada pembengkakan putih pada kulitnya; pembengkakan itu telah membuat bulunya menjadi putih, dan ada daging hidup yang terbuka di dalam pembengkakan itu[a].
  philosophy: optimal-equivalence
  footnotes:
