    text: Secara harfiah, “daging hidup”; ungkapan ini menunjuk pada jaringan hidup yang terbuka atau tampak di dalam pembengkakan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה הַכֹּהֵן
  choice: Lalu imam memeriksanya
  rationale: Dalam konteks hukum diagnosis ini, ראה berarti mengamati atau memeriksa kondisi kulit, bukan sekadar melihat.
- source_word: וְהִנֵּה
  choice: Jika tampak ada
  rationale: Mengungkapkan fungsi deiktis הִנֵּה sebagai penanda hasil pengamatan, sekaligus mengalir alami dalam rumusan kasus bersyarat bahasa Indonesia.
- source_word: שְׂאֵת לְבָנָה
  choice: pembengkakan putih
  rationale: שְׂאֵת adalah istilah teknis bagi bagian kulit yang meninggi atau membengkak; 'pembengkakan' jelas dan mudah dipahami.
- source_word: בָּעוֹר
  choice: pada kulit
  rationale: Bahasa Indonesia secara alami menyatakan kelainan kulit sebagai sesuatu yang terdapat 'pada kulit', tanpa mengubah lokasi diagnostiknya.
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: pembengkakan itu telah membuat bulu menjadi putih
  rationale: Subjek feminin הִיא merujuk kepada שְׂאֵת. Pengulangan 'pembengkakan itu' memperjelas rujukannya, sedangkan שֵׂעָר diterjemahkan 'bulu' karena konteksnya adalah kulit tubuh.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: serta ada daging hidup yang terbuka
  rationale: Ungkapan harfiah 'daging hidup' dipertahankan, sementara 'yang terbuka' menyampaikan bahwa jaringan hidup atau mentah tampak pada lesi tersebut.
- source_word: בַּשְׂאֵת
  choice: di dalam pembengkakan itu
  rationale: Menunjukkan bahwa daging hidup tersebut terlihat di dalam area lesi, serta mempertahankan konsistensi terjemahan שְׂאֵת.
