base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: id
  text: Pada hari ketujuh imam harus memeriksanya. Jika ternyata kelainan itu[a] tampak tetap sama dalam pandangan imam[b] dan tidak meluas pada kulit, imam harus mengisolasinya[c] selama tujuh hari lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bercak”, “tanda”, atau “luka”. Kata Ibrani negaʿ menunjuk pada kelainan yang tampak dan diperiksa oleh imam, bukan selalu penyakit yang telah didefinisikan secara medis.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tetap di matanya”, yaitu tampak tetap sama bagi imam yang memeriksanya.
    reason: lexical_alternative
  - marker: c
    text: Atau “mengurungnya”; secara lebih harfiah, “menutupnya”. Yang dimaksud ialah memisahkannya sementara untuk pemeriksaan lebih lanjut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: imam harus memeriksa orang itu
  rationale: Dalam konteks pemeriksaan keimaman, ראה bukan sekadar ‘melihat’, melainkan memeriksa untuk menetapkan keadaan ritual; penyebutan ‘orang itu’ memperjelas objek pronominal tanpa mengubah makna.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Padanan temporal yang langsung dan alami, dengan urutan pemeriksaan tetap dipertahankan.
- source_word: וְהִנֵּה
  choice: Jika ternyata
  rationale: Dalam rangkaian ketentuan bersyarat ini, ungkapan tersebut mengarahkan perhatian pada hasil pemeriksaan. ‘Jika ternyata’ lebih wajar dalam bahasa hukum modern daripada ‘lihatlah’, tanpa menghilangkan unsur penemuan.
- source_word: הַנֶּגַע
  choice: kelainan itu
  rationale: נגע menunjuk pada tanda atau lesi yang tampak dan sedang diperiksa, tetapi tidak harus merupakan penyakit dalam pengertian medis modern. ‘Kelainan’ cukup luas untuk menghindari diagnosis yang terlalu spesifik.
- source_word: עָמַד בְּעֵינָיו
  choice: tampak tidak berubah menurut pengamatannya
  rationale: Ungkapan harfiahnya ‘tetap di matanya’; terjemahan ini menyampaikan bahwa menurut penilaian visual imam, keadaan kelainan itu tetap sama.
- source_word: לֹא פָשָׂה ... בָּעוֹר
  choice: tidak meluas pada kulit
  rationale: פשׂה dalam konteks ini berarti menyebar atau meluas. ‘Pada kulit’ merupakan ungkapan Indonesia yang alami untuk penyebaran kelainan kulit.
- source_word: וְהִסְגִּירוֹ
  choice: imam harus mengasingkan orang itu
  rationale: Kata kerja ini secara harfiah berarti menutup atau mengurung. ‘Mengasingkan’ menyampaikan pemisahan prosedural tanpa memasukkan ketepatan medis modern yang tersirat oleh ‘mengarantina’.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: selama tujuh hari lagi
  rationale: Padanan alami yang menyatakan pengulangan masa pemisahan selama tujuh hari untuk kedua kalinya.
