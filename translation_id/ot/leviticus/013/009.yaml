  text: נֶ֣גַע צָרַ֔עַת כִּ֥י תִהְיֶ֖ה בְּ/אָדָ֑ם וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/009.yaml
  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: id
  text: Apabila ada kelainan kulit pada seseorang,[a] ia harus dibawa kepada imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang secara tradisional diterjemahkan “kusta” kemungkinan mencakup beragam penyakit atau kelainan kulit yang serius, bukan hanya penyakit Hansen modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: tanda
  rationale: Dalam konteks pemeriksaan Imamat 13, kata ini menunjuk pada kelainan atau tanda yang tampak pada kulit. 'Tanda' alami dalam bahasa Indonesia dan tidak menetapkan diagnosis medis yang belum diberikan.
- source_word: צָרַעַת
  choice: penyakit kulit menular
  rationale: Istilah Ibrani ini mencakup kategori kelainan serius yang lebih luas daripada penyakit Hansen modern. Pilihan ini mempertahankan gagasan penyakit kulit tanpa memakai istilah tradisional 'kusta' secara terlalu spesifik; catatan kaki menjelaskan cakupannya.
- source_word: כִּי
  choice: apabila
  rationale: Partikel ini membuka ketentuan kasus hukum. 'Apabila' sesuai dengan ragam hukum yang formal sekaligus alami dalam bahasa Indonesia.
- source_word: תִהְיֶה
  choice: ada
  rationale: Bentuk verba menyatakan keberadaan. 'Ada ... pada seseorang' merupakan konstruksi Indonesia yang wajar tanpa menambahkan gagasan 'muncul' yang tidak dinyatakan secara eksplisit.
- source_word: בְּאָדָם
  choice: pada seseorang
  rationale: אָדָם di sini bersifat generik dan menunjuk manusia yang mengalami kondisi tersebut. Bahasa Indonesia tidak memerlukan penandaan gender; 'seseorang' tepat dan alami dalam rumusan kasus hukum.
- source_word: וְהוּבָא
  choice: ia harus dibawa
  rationale: Bentuk pasif ini menyatakan langkah prosedural berikutnya. 'Harus dibawa' menyampaikan kewajiban hukum secara jelas, sedangkan 'ia' mempertahankan rujukan tunggal tanpa menambahkan gender.
- source_word: אֶל הַכֹּהֵן
  choice: kepada imam
  rationale: Artikel tertentu menunjuk imam yang berfungsi sebagai pemeriksa dalam prosedur ini. Dalam bahasa Indonesia, 'kepada imam' secara alami dapat menyampaikan rujukan tersebut tanpa artikel.
theological_decisions:
- issue: Cakupan צָרַעַת
  choice: penyakit kulit menular, dengan catatan kaki
  alternative: kusta
  rationale: Menerjemahkannya hanya sebagai 'kusta' dapat disalahpahami sebagai diagnosis penyakit Hansen modern. Terjemahan utama dan catatan kaki mempertahankan kategori kuno yang lebih luas tanpa menghapus kaitannya dengan tradisi penerjemahan.
- issue: Rujukan generik אָדָם
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Dalam ketentuan ini אָדָם merujuk secara generik kepada manusia, bukan secara khusus kepada laki-laki. 'Seseorang' mempertahankan cakupan sumber dan merupakan ungkapan Indonesia yang alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan corak ketentuan hukum. Struktur dibuat ringkas dan prosedural. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
