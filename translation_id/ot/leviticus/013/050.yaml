translation:
  language: id
  text: Imam harus memeriksa bagian yang terkena itu[a], lalu mengasingkannya[b] selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanda itu”, “bagian yang terjangkit itu”, atau secara tradisional “tulah itu”. Istilah Ibrani ini menunjuk pada tanda atau bagian terdampak yang sedang diperiksa oleh imam, dan tidak selalu menunjuk pada kategori penyakit modern tertentu.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “mengurung” atau “menahan di tempat tertutup”. Maksudnya ialah memisahkannya sementara untuk diamati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: harus memeriksa
  rationale: Kata kerja ראה secara harfiah berarti ‘melihat’, tetapi dalam konteks pemeriksaan keimaman ini menunjuk pada tindakan memeriksa secara resmi. Bentuk rangkaian tindakan dalam ketentuan hukum dinyatakan secara alami dengan ‘harus’.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan wajar bagi כֹּהֵן dalam konteks keimaman Israel.
- source_word: הַנָּגַע / הַנֶּגַע
  choice: bagian yang terkena itu / bagian tersebut
  rationale: נגע di Imamat 13 menunjuk pada tanda atau bagian terdampak yang diperiksa, bukan dengan pasti pada satu kategori penyakit modern. Penggunaan ‘bagian’ sesuai dengan konteks benda yang terdampak dan menghindari diagnosis yang terlalu spesifik; pada penyebutan kedua dipakai rujukan alami tanpa mengubah acuannya.
- source_word: וְהִסְגִּיר
  choice: lalu mengisolasi
  rationale: Bentuk hifil dari סגר berarti menutup, mengurung, atau memisahkan. ‘Mengisolasi’ menyampaikan pemisahan sementara untuk pengamatan dengan jelas dalam bahasa Indonesia modern.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: ‘Selama’ menyatakan durasi tindakan secara idiomatis dan tepat.
