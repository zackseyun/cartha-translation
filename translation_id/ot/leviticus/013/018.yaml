  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָשָׂר
  choice: tubuh seseorang
  rationale: בָשָׂר secara harfiah berarti “daging”, tetapi dalam rumusan pemeriksaan ini menunjuk pada tubuh manusia. “Tubuh seseorang” alami dalam bahasa Indonesia dan menghindari kesan bahwa yang dimaksud hanya jaringan daging.
- source_word: כִּי
  choice: apabila
  rationale: כִּי memperkenalkan keadaan dalam hukum kasuistik. “Apabila” mempertahankan sifat kondisional sekaligus sesuai dengan ragam hukum yang bermartabat.
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: pada kulit tubuh seseorang timbul
  rationale: Susunan harfiah “ada padanya, pada kulitnya” dialihkan secara idiomatis menjadi “pada kulit tubuh seseorang timbul”, tanpa menghilangkan lokasi kelainan pada kulit.
- source_word: שְׁחִין
  choice: bisul
  rationale: שְׁחִין menunjuk pada bisul atau radang kulit. “Bisul” adalah padanan ringkas, umum, dan tepat dalam konteks diagnosis ini.
- source_word: וְנִרְפָּא
  choice: lalu sembuh
  rationale: Bentuk Nifal dapat menyatakan keadaan pasif atau proses intransitif. “Lalu sembuh” secara alami menyatakan bahwa bisul itu telah pulih tanpa menentukan pelaku penyembuhan.
