  terminology: Gunakan 'bercak terang' untuk בַּהֶרֶת, 'bulu pada bercak itu' untuk שְׂעָרָהּ, dan 'bagian yang terkena itu' untuk הַנֶּגַע. Istilah terakhir bersifat deskriptif dan tidak mengandaikan diagnosis penyakit tertentu.
