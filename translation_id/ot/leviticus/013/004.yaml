  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: id
  text: Namun, jika bercak terang itu berwarna putih pada kulit tubuhnya,[a] dan tampaknya tidak lebih dalam daripada kulit, serta bulu pada bercak itu belum berubah menjadi putih, imam harus mengisolasi bagian yang terkena itu[b] selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bercak mengilap” atau “bercak berkilau”; istilah Ibraninya menunjuk pada tanda kulit yang tampak terang atau putih.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagian yang terkena itu.” Dalam konteks ini, kasus tersebut ditempatkan dalam pemisahan sementara untuk diamati.
    reason: source_clarity
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: bercak mengilap
  rationale: Istilah ini menunjuk pada tanda atau bercak kulit yang tampak terang atau mengilap. Pilihan ini membedakannya dari istilah untuk benjolan pada ayat sebelumnya dan tetap alami dalam bahasa Indonesia.
- source_word: לְבָנָה
  choice: berwarna putih
  rationale: Adjektiva ini secara langsung menyatakan warna bercak tersebut.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: pada kulit tubuhnya
  rationale: Ungkapan ini menyampaikan makna anatomis Ibrani secara alami; בשר di sini berarti tubuh, bukan daging sebagai bahan makanan.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: tampaknya tidak lebih dalam daripada kulit
  rationale: Terjemahan ini mempertahankan unsur pengamatan visual dan perbandingan kedalaman yang menjadi kriteria pemeriksaan.
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: bulu di situ belum berubah menjadi putih
  rationale: Yang dimaksud ialah bulu yang tumbuh pada atau di dalam area bercak. 'Bulu' lebih alami daripada 'rambut' untuk permukaan kulit tubuh secara umum.
- source_word: וְהִסְגִּיר
  choice: harus mengisolasi
  rationale: Kata kerja ini menggambarkan pemisahan sementara untuk pengamatan, bukan putusan akhir mengenai penyakit tersebut.
- source_word: אֶת־הַנֶּגַע
  choice: orang yang memiliki bagian terkena itu
  rationale: Secara gramatikal objeknya adalah 'bagian yang terkena/lesi', tetapi tindakan mengisolasi dalam konteks prosedural diterapkan kepada orang atau kasus yang sedang diperiksa. Catatan kaki mempertahankan bentuk harfiah sumber.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Ungkapan durasi ini diterjemahkan secara langsung dan wajar.
theological_decisions:
- issue: Status bercak belum ditetapkan sebagai penyakit tertentu
  choice: menggunakan istilah deskriptif 'bercak mengilap' dan 'bagian terkena'
  alternative: penyakit, kusta, atau tulah
  rationale: Ayat ini menggambarkan tahap pemeriksaan dan pengamatan. Istilah yang langsung mendiagnosis penyakit tertentu akan melampaui bukti teks serta menghilangkan ketidakpastian proseduralnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bercak mengilap' mempertahankan ciri visual istilah sumber; 'kulit tubuhnya' menghindari ungkapan kaku 'kulit dagingnya'. Struktur kalimat menjaga hubungan antarkriteria pemeriksaan tanpa memberi diagnosis yang tidak dinyatakan teks.
