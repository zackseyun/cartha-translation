  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: id
  text: Maka, laksanakanlah ketetapan-ketetapan-Ku dan peliharalah peraturan-peraturan-Ku[a], serta lakukanlah semuanya itu[b], sehingga kamu akan tinggal dengan aman di negeri itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, untuk “ketetapan-ketetapan-Ku”: “ketentuan-ketentuan-Ku”; dan untuk “peraturan-peraturan-Ku”: “keputusan-keputusan hukum-Ku”. Bahasa Ibrani memakai dua istilah hukum yang berbeda, חֻקִּים dan מִשְׁפָּטִים.'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani mengulang kata kerja “melakukan”: secara harfiah, “lakukanlah ketetapan-ketetapan-Ku ... peliharalah peraturan-peraturan-Ku dan lakukanlah semuanya itu.”'
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, tinggal dengan aman di negeri yang dijanjikan.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: חֻקִּים menunjuk pada ketentuan yang ditetapkan dalam kerangka hukum perjanjian. “Ketetapan-ketetapan” mempertahankan nuansa tersebut dan tetap dapat dibedakan dari מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: peraturan-peraturan-Ku
  rationale: מִשְׁפָּטִים dapat berarti keputusan hukum, kaidah, atau peraturan. “Peraturan-peraturan” terdengar alami dalam bahasa Indonesia modern dan mempertahankan kategori hukum yang berbeda dari “ketetapan-ketetapan”.
- source_word: תִּשְׁמְרוּ
  choice: peliharalah
  rationale: Dalam konteks hukum perjanjian, שׁמר berarti menjaga dengan menaati atau menjalankan. “Peliharalah” mempertahankan daya covenantal dan lebih tepat daripada arti harfiah sempit “jagalah”.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: laksanakanlah ... serta lakukanlah semuanya itu
  rationale: Teks Ibrani memakai עשה dua kali. Variasi “laksanakanlah ... lakukanlah” menjaga pengulangan dan penekanan pada ketaatan nyata tanpa menghasilkan ungkapan Indonesia yang terlalu kaku.
- source_word: וִישַׁבְתֶּם
  choice: kamu akan tinggal
  rationale: ישׁב di sini menunjuk pada hidup menetap atau mendiami negeri tersebut. “Tinggal” alami dan jelas dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks Imamat 25, הָאָרֶץ adalah negeri yang dijanjikan dan didiami Israel. “Negeri itu” menyampaikan wilayah tersebut secara lebih alami daripada “tanah itu” dalam bahasa Indonesia.
- source_word: לָבֶטַח
  choice: dengan aman
  rationale: בֶּטַח menyatakan keadaan aman dan tenteram tanpa ancaman. “Dengan aman” merupakan padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Hubungan antara ketaatan dan kediaman yang aman di negeri itu
  choice: 'Ayat ini menyatakan konsekuensi perjanjian bagi Israel dalam konteks negeri yang dijanjikan: ketaatan berkaitan dengan tinggal dengan aman di sana.'
  alternative: Membacanya sebagai janji umum dan tanpa syarat tentang keselamatan atau kemakmuran pribadi bagi semua orang percaya di segala tempat.
  rationale: Teks Ibrani secara langsung menghubungkan pelaksanaan ketetapan dan pemeliharaan peraturan YHWH dengan tinggal aman di הָאָרֶץ. Terjemahan mempertahankan konteks negeri perjanjian dan tidak memperluas janji itu melampaui cakupan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak pada subjek Ibrani diterjemahkan dengan “kamu” yang dapat merujuk secara kolektif kepada umat Israel; akhiran ilahi ditulis “-Ku” sesuai kebiasaan penerbitan Alkitab berbahasa Indonesia. Hubungan antarklausa dibuat jelas dengan “Karena itu” dan “Dengan demikian” tanpa mengubah kaitan sebab-akibat dalam konteks.
