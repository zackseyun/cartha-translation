  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: id
  text: Selama enam tahun engkau harus menabur benih di ladangmu, dan selama enam tahun engkau harus memangkas kebun anggurmu serta mengumpulkan hasilnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: selama enam tahun
  rationale: Frasa ini menyatakan jangka waktu berlangsungnya tindakan; “selama enam tahun” menyampaikannya secara wajar dan jelas dalam bahasa Indonesia.
- source_word: תִּזְרַע שָׂדֶךָ
  choice: engkau harus menabur benih di ladangmu
  rationale: Bentuk verba berfungsi sebagai ketentuan dalam konteks hukum. Penambahan “benih” dan “di” membuat ungkapan “menabur ladang” alami dalam bahasa Indonesia tanpa mengubah tindakan pertaniannya.
- source_word: תִּזְמֹר כַּרְמֶךָ
  choice: engkau harus memangkas kebun anggurmu
  rationale: Dalam konteks kebun anggur, זמר secara khusus berarti memangkas tanaman anggur; “kebun anggur” adalah padanan lazim bagi כרם.
- source_word: וְאָסַפְתָּ
  choice: serta mengumpulkan
  rationale: אָסַף berarti mengumpulkan. “Serta” menghubungkan tindakan ini dengan ketentuan sebelumnya secara alami, sementara unsur kewajiban tetap tercakup oleh “harus”.
- source_word: תְּבוּאָתָהּ
  choice: hasilnya
  rationale: תְּבוּאָה menunjuk pada hasil pertanian atau hasil bumi. Bentuk “-nya” mempertahankan rujukan sufiks feminin tunggal tanpa memaksakan anteseden yang tidak dinyatakan ulang dalam ayat ini.
