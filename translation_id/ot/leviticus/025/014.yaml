  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: id
  text: Jika kamu menjual sesuatu kepada sesamamu atau membeli dari sesamamu, janganlah seorang pun merugikan saudaranya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “janganlah kamu saling memperlakukan dengan tidak adil.” Kata Ibrani yang dipakai dapat berarti mengambil keuntungan secara tidak adil, khususnya dalam transaksi jual beli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Dalam rumusan hukum kasuistik, וְכִי membuka keadaan bersyarat; bahasa Indonesia alami tidak memerlukan padanan tersendiri untuk waw di awal ayat.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: kamu menjual sesuatu
  rationale: Gabungan verba dan nomina serumpun menunjuk pada tindakan menjual suatu barang atau objek transaksi; 'menjual sesuatu' jelas dan alami.
- source_word: לַעֲמִיתֶךָ
  choice: kepada sesamamu
  rationale: עָמִית menunjuk sesama anggota komunitas. 'Sesamamu' mempertahankan hubungan sosial itu tanpa membatasinya pada orang yang tinggal berdekatan.
- source_word: אוֹ קָנֹה
  choice: atau membeli
  rationale: Infinitif absolut קָנֹה berfungsi sejajar dengan verba sebelumnya dan secara idiomatis diterjemahkan sebagai verba koordinatif.
- source_word: מִיַּד עֲמִיתֶךָ
  choice: dari tangan sesamamu
  rationale: Ungkapan konkret Ibrani berarti menerima atau membeli dari penguasaan pihak lain. Bentuk 'dari tangan' tetap dapat dipahami dalam bahasa Indonesia dan mempertahankan citra sumber.
- source_word: אַל תּוֹנוּ
  choice: janganlah ... merugikan
  rationale: Dalam konteks transaksi, ינה menunjuk tindakan memperlakukan secara tidak adil atau mengambil keuntungan secara curang. 'Merugikan' menangkap nuansa ekonomi tanpa mempersempitnya secara berlebihan.
- source_word: אִישׁ אֶת אָחִיו
  choice: seorang pun ... saudaranya
  rationale: אִישׁ bersifat distributif dalam larangan, sedangkan אָחִיו mempertahankan bahasa solidaritas komunitas. Susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan bentuk sumber.
theological_decisions:
- issue: Cakupan istilah maskulin representatif dalam larangan hukum
  choice: seorang pun ... saudaranya
  alternative: satu sama lain; sesamanya
  rationale: Teks memakai אִישׁ dan אָחִיו. Terjemahan mempertahankan 'saudaranya' sebagai citra kekerabatan komunitas, sementara 'seorang pun' menyampaikan daya distributif larangan tanpa menyatakan bahwa hukum hanya berlaku bagi laki-laki.
- issue: Makna ינה dalam konteks jual beli
  choice: merugikan
  alternative: menindas; memperdaya; mengambil keuntungan secara tidak adil
  rationale: Konteks komersial mendukung pengertian perlakuan tidak adil atau eksploitasi dalam transaksi. 'Merugikan' mempertahankan keluasan makna, dan catatan kaki menjelaskan nuansa khususnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina tunggal 'kamu' mengikuti bentuk orang kedua tunggal pada 'sesamamu', sedangkan verba utama Ibrani berbentuk jamak dan dipahami sebagai sapaan kepada komunitas secara kolektif. Catatan kaki ditempatkan pada larangan yang diterangkannya.
