  text: וְ/הִתְנַחֲלְתֶּ֨ם אֹתָ֜/ם לִ/בְנֵי/כֶ֤ם אַחֲרֵי/כֶם֙ לָ/רֶ֣שֶׁת אֲחֻזָּ֔ה לְ/עֹלָ֖ם בָּ/הֶ֣ם תַּעֲבֹ֑דוּ וּ/בְ/אַ֨חֵי/כֶ֤ם בְּנֵֽי יִשְׂרָאֵל֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: id
  text: Kamu boleh mewariskan mereka kepada anak-anak lelakimu sesudah kamu[a] sebagai milik pusaka untuk seterusnya; kamu boleh memaksa mereka bekerja. Namun, terhadap saudara-saudaramu, bani Israel[b], janganlah seorang pun memerintah saudaranya dengan kejam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kamu boleh menyerahkan mereka kepada anak-anak lelakimu sesudah kamu sebagai milik turun-temurun.”'
    reason: lexical_alternative
  - marker: b
    text: Kata “saudara-saudara” dan “bani Israel” menerjemahkan langsung istilah kekerabatan maskulin dalam bahasa Ibrani; hukum ini menyebut sesama orang Israel sebagai kerabat dalam ikatan perjanjian.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: kamu boleh mewariskan mereka
  rationale: Bentuk Hitpael dari נחל dalam konteks ini menyatakan tindakan meneruskan orang-orang tersebut sebagai warisan. Pilihan ini mempertahankan daya hukum-pewarisan tanpa mengaburkan bahwa objeknya adalah manusia.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: kepada anak-anak lelakimu sesudah kamu
  rationale: בנים secara langsung berarti “anak-anak lelaki.” Bentuk maskulin dalam ketentuan waris ini dipertahankan, sedangkan “sesudah kamu” menyatakan pewarisan setelah generasi pemilik sekarang.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: sebagai milik pusaka
  rationale: אֲחֻזָּה menunjuk milik tetap atau turun-temurun, dan konstruksi dengan לָרֶשֶׁת menekankan statusnya sebagai kepunyaan yang diwarisi. “Milik pusaka” menyampaikan kedua unsur itu secara ringkas dan wajar.
- source_word: לְעֹלָם
  choice: untuk seterusnya
  rationale: Dalam hukum sosial ini, עוֹלָם menyatakan keberlangsungan yang tetap atau tidak dibatasi dalam kerangka ketentuan tersebut, bukan keabadian metafisis. Penempatannya mempertahankan kaitan erat dengan status milik pusaka tanpa menutup kemungkinan nuansa keberlanjutan kerja yang disebut sesudahnya.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: kamu boleh memaksa mereka bekerja
  rationale: עבד dalam konteks kepemilikan atas manusia menunjuk kerja yang dituntut, bukan hubungan kerja sukarela modern. “Memaksa mereka bekerja” menyatakan kenyataan koersif itu secara jelas tanpa menggantinya dengan istilah tafsiran yang lebih luas.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: Namun, terhadap saudara-saudaramu, bani Israel
  rationale: Ungkapan ini mengontraskan kelompok sebelumnya dengan sesama orang Israel dan mempertahankan bahasa kekerabatan perjanjian. “Bani Israel” merupakan padanan Indonesia yang mapan untuk “anak-anak Israel.”
- source_word: אִישׁ בְּאָחִיו
  choice: janganlah seorang pun memerintah saudaranya
  rationale: Konstruksi distributif אִישׁ ... בְּאָחִיו melarang setiap orang Israel memperlakukan sesama saudara dengan cara yang disebutkan. Bentuk larangan ini alami dalam bahasa Indonesia dan mempertahankan kata “saudara.”
- source_word: לֹא תִרְדֶּה בוֹ
  choice: janganlah ... memerintah ...
  rationale: רדה berarti menjalankan kekuasaan atau dominasi atas seseorang. “Memerintah” mempertahankan gagasan kekuasaan, sementara keterangan berikutnya menyatakan sifat kekerasannya.
- source_word: בְּפָרֶךְ
  choice: dengan kejam
  rationale: פֶרֶךְ menggambarkan kekerasan atau kekejaman dalam pelaksanaan kerja paksa. “Dengan kejam” merupakan ungkapan Indonesia yang langsung, alami, dan sesuai dengan konteks.
theological_decisions:
- issue: Bahasa kekerabatan dalam hukum sosial Israel
  choice: Mempertahankan “saudara-saudaramu” dan “bani Israel.”
  alternative: “Sesama orang Israel” atau “kaum sebangsamu.”
  rationale: Teks Ibrani memakai istilah kekerabatan maskulin untuk membingkai solidaritas perjanjian. Terjemahan mempertahankan gambaran tersebut dan tidak menetralkannya menjadi sekadar identitas kebangsaan.
- issue: Keterusterangan bahasa perbudakan dan kepemilikan
  choice: Menggunakan “mewariskan,” “milik pusaka,” dan “memaksa mereka bekerja.”
  alternative: Bahasa pelayanan atau pekerjaan yang lebih lunak, seperti “mempekerjakan mereka.”
  rationale: Teks secara nyata berbicara tentang manusia sebagai milik turun-temurun dan tentang kerja yang dituntut dari mereka. Terjemahan tidak melunakkan kenyataan hukum dan sosial tersebut ataupun menambahkan penilaian doktrinal yang tidak dinyatakan ayat ini.
- issue: Cakupan לְעֹלָם
  choice: “Untuk seterusnya” ditempatkan bersama status milik pusaka, dengan kemungkinan nuansa yang berlanjut ke ketentuan kerja.
  alternative: “Selama-lamanya kamu boleh memaksa mereka bekerja.”
  rationale: Susunan Ibrani memungkinkan hubungan erat dengan klausa kerja berikutnya, sedangkan rangkaian pewarisan dan milik pusaka juga memberi istilah itu daya hukum turun-temurun. Terjemahan menjaga ketegangan sintaktis itu tanpa menjadikannya pernyataan tentang keabadian metafisis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum dipertahankan, tetapi susunan kalimat dibuat alami. Istilah “milik pusaka” menjaga nuansa hukum waris, sedangkan “memaksa mereka bekerja” menghindari kesan hubungan kerja sukarela.
