  source_fidelity: Teks Indonesia dengan setia menyampaikan tindakan meneruskan orang-orang ini sebagai warisan kepada anak-anak lelaki, status mereka sebagai milik pusaka yang berkelanjutan, dan hak untuk menuntut kerja dari mereka. Kontrasnya dengan perlakuan terhadap sesama Israel, serta larangan berkuasa dengan keras, juga terpelihara. Penempatan “untuk seterusnya” pada status milik pusaka merupakan pembacaan yang wajar atas sintaks Ibrani tanpa menutup nuansa keberlanjutan pada klausa sesudahnya.
