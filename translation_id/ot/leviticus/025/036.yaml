  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: id
  text: Janganlah mengambil bunga atau keuntungan darinya[a]. Takutlah kepada Allahmu dan biarkanlah saudaramu[b] hidup bersamamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tambahan” atau “laba” untuk “keuntungan”; bahasa Ibrani memasangkan dua istilah yang berkaitan dengan bunga atau tambahan yang ditarik dari peminjam miskin.
    reason: lexical_alternative
  - marker: b
    text: “Saudaramu” di sini berarti sesama anggota komunitas perjanjian, tidak harus saudara kandung.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: Janganlah mengambil
  rationale: אַל dengan bentuk imperfek menyatakan larangan langsung; “janganlah mengambil” mempertahankan daya perintah dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: מֵאִתּוֹ
  choice: darinya
  rationale: Frasa preposisional ini menandai orang miskin tersebut sebagai pihak yang darinya tambahan terlarang itu ditarik.
- source_word: נֶשֶׁךְ
  choice: bunga
  rationale: Kata ini menunjuk pada bunga yang dikenakan atas pinjaman. “Bunga” adalah istilah ekonomi modern yang tepat dan tidak membatasi makna pada bunga yang berlebihan.
- source_word: וְתַרְבִּית
  choice: keuntungan
  rationale: Kata ini dipasangkan dengan נֶשֶׁךְ dan menunjuk pada tambahan atau laba yang ditarik dari peminjam; catatan kaki mempertahankan alternatif leksikal “tambahan” dan “laba”.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: Takutlah akan Allahmu
  rationale: Terjemahan ini mempertahankan perintah etis dan bentuk posesif perjanjian dalam bahasa Indonesia yang alami.
- source_word: וְחֵי
  choice: dan biarkanlah ... hidup
  rationale: Bentuk ini dipahami secara yusif dan diterjemahkan langsung sebagai seruan agar saudara itu dibiarkan tetap hidup, tanpa menambahkan hubungan tujuan yang tidak dinyatakan secara eksplisit.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Terjemahan harfiah ini mempertahankan metafora kekeluargaan dan daya komunal-perjanjian dari bahasa Ibrani; cakupan sosialnya dijelaskan dalam catatan kaki.
- source_word: עִמָּךְ
  choice: bersamamu
  rationale: Pilihan ini secara langsung menyatakan kehidupan yang berlanjut di tengah komunitas bersama pihak yang disapa.
theological_decisions:
- issue: Cakupan sosial אָחִיךָ dalam hukum perjanjian
  choice: saudaramu
  alternative: sesama orang Israel; kerabatmu
  rationale: Bahasa Ibrani memakai istilah kekeluargaan yang dalam konteks ini menunjuk kepada sesama anggota komunitas perjanjian, bukan hanya saudara kandung. Teks utama mempertahankan istilah itu, sementara catatan kaki menjelaskan cakupannya.
- issue: Hubungan sintaksis וְחֵי dengan perintah sebelumnya
  choice: dan biarkanlah saudaramu hidup
  alternative: supaya saudaramu dapat hidup
  rationale: Waw diterjemahkan secara langsung, dan bentuk verbal diperlakukan sebagai yusif. Ini menghindari penetapan hubungan tujuan secara tegas ketika teks Ibrani juga dapat menyampaikan kelanjutan atau hasil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang langsung tetapi tetap bermartabat. “Bunga” dipilih daripada istilah lama “riba” agar makna ekonomi sumber tidak secara otomatis dipersempit menjadi bunga yang berlebihan atau diberi muatan doktrinal tambahan. Semua penanda catatan kaki dicantumkan dalam teks utama.
