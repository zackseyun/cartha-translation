  naturalness: Bahasa Indonesia modernnya jelas dan berwibawa. “Tanah itu tidak boleh dijual untuk selamanya” dapat dipahami, tetapi “tidak boleh dijual secara permanen” lebih idiomatis dan lebih tepat membatasi permanensi pada penjualannya/pelepasan hak, bukan pada tindakan menjual itu sendiri. “Pendatang dan penduduk sementara bersama-Ku” tetap dapat dipahami sebagai status mereka di hadapan Allah dalam konteks klausa sebelumnya.
  terminology: “Milik-Ku,” “pendatang,” dan “penduduk sementara” merupakan pilihan yang layak. “Bersama-Ku” harus dipertahankan untuk עִמָּדִי. Catatan budaya boleh menerangkan bahwa ungkapan tersebut menyatakan kedudukan Israel sebagai penghuni yang bergantung, tanpa mengubah arti leksikal menjadi “di hadapan-Ku.”
