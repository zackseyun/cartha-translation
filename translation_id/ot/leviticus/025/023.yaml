  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: id
  text: Tanah itu tidak boleh dijual secara permanen[a], sebab tanah itu milik-Ku. Sebab kalian adalah pendatang dan penduduk sementara bersama-Ku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk selamanya” atau “sebagai pelepasan hak untuk selama-lamanya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pendatang dan penduduk sementara bersama-Ku.” Ungkapan ini menunjukkan bahwa bangsa Israel menempati tanah sebagai pihak yang bergantung kepada Allah, pemilik tanah itu.'
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: tidak boleh dijual
  rationale: Bentuk Nifal imperfek dalam konteks hukum menyatakan larangan secara pasif; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya hukumnya.
- source_word: לִצְמִתֻת
  choice: untuk selamanya
  rationale: Istilah ini menunjuk pada pelepasan hak yang tetap atau tidak dapat dipulihkan. 'Untuk selamanya' jelas bagi pembaca modern dan sesuai dengan konteks kepemilikan tanah.
- source_word: כִּי לִי הָאָרֶץ
  choice: sebab tanah itu milik-Ku
  rationale: כִּי bersifat kausal dan klausa ini menegaskan kepemilikan langsung Allah sebagai dasar larangan.
- source_word: גֵרִים
  choice: pendatang
  rationale: גֵר menunjuk pada orang yang tinggal di wilayah yang bukan milik turun-temurunnya dan memiliki kedudukan bergantung; 'pendatang' menyampaikan status tersebut secara wajar.
- source_word: וְתוֹשָׁבִים
  choice: penduduk sementara
  rationale: תּוֹשָׁב menunjuk pada penghuni yang tidak memiliki hak waris penuh atas tanah; pilihan ini mempertahankan nuansa masa tinggal yang tidak mutlak.
- source_word: עִמָּדִי
  choice: di hadapan-Ku
  rationale: Secara harfiah berarti 'bersama-Ku', tetapi dalam pasangan status גֵר dan תּוֹשָׁב konteksnya menyatakan kedudukan mereka dalam hubungan dengan Allah sebagai pemilik tanah. 'Di hadapan-Ku' alami dan tidak menyiratkan bahwa Allah dan Israel sama-sama pendatang.
theological_decisions:
- issue: Hubungan Israel dengan tanah
  choice: Israel menempati tanah sebagai pendatang dan penduduk sementara di hadapan Allah, sedangkan kepemilikan utamanya tetap pada Allah.
  alternative: Ayat ini dipahami hanya sebagai aturan sosial-ekonomi tanpa penegasan teologis mengenai kepemilikan Allah.
  rationale: Pernyataan eksplisit 'tanah itu milik-Ku' menjadikan kepemilikan Allah dasar teologis bagi larangan penjualan permanen, tanpa memperluas maknanya melampaui konteks hukum tahun Yobel.
- issue: Makna עִמָּדִי
  choice: di hadapan-Ku
  alternative: bersama-Ku
  rationale: '''Bersama-Ku'' lebih harfiah dan tetap dicatat sebagai alternatif, tetapi dalam bahasa Indonesia dapat memberi kesan keliru bahwa Allah juga berstatus sebagai pendatang. Terjemahan utama mempertahankan hubungan ketergantungan kepada-Nya.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' dipakai untuk bentuk orang kedua jamak אַתֶּם. Kapitalisasi pada 'milik-Ku' dan 'di hadapan-Ku' menandai pembicara ilahi menurut kebiasaan ejaan Alkitab bahasa Indonesia.
