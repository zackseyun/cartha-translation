  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: id
  text: Sebab orang Israel adalah hamba-hamba-Ku; mereka adalah hamba-hamba-Ku yang Kubawa keluar dari tanah Mesir. Akulah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi ketetapan sebelumnya dan mempertahankan daya penjelas teks Ibrani.
- source_word: לִי ... עֲבָדִים / עֲבָדַי
  choice: hamba-hamba-Ku
  rationale: Ungkapan ini menyatakan kepemilikan dan pengabdian yang terikat. Dalam bahasa Indonesia, 'hamba' mempertahankan cakupan antara pelayan dan budak serta sesuai dengan hubungan perjanjian kepada Allah; pengulangannya dipertahankan untuk menegaskan bahwa Israel adalah milik Yahweh.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan korporat Ibrani secara idiomatis menunjuk kepada bangsa Israel secara keseluruhan. 'Orang Israel' alami, jelas, dan tidak keliru membatasi acuan hanya kepada laki-laki.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: yang Kubawa keluar
  rationale: Mempertahankan rumusan khas keluaran dan tindakan langsung Yahweh.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Padanan alami bagi formula geografis Ibrani dan selaras dengan verba 'membawa keluar'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Sufiks Ibrani berbentuk jamak, tetapi bahasa Indonesia tidak membedakan 'kamu' tunggal dan jamak dalam bentuk posesif ini; bentuk tersebut mempertahankan formula perjanjian secara alami.
theological_decisions:
- issue: Makna עבד dalam konteks kepemilikan perjanjian dan pembatasan perbudakan sesama Israel
  choice: hamba-hamba-Ku
  alternative: budak-budak-Ku
  rationale: '''Budak'' akan menonjolkan status terikat dan kontras kepemilikan dengan tuan manusia, sedangkan ''hamba'' juga dapat menyatakan pelayanan. Karena עבד mencakup kedua nuansa dan konteks ini berbicara tentang kepunyaan Yahweh tanpa menyamakan hubungan itu begitu saja dengan perbudakan manusia, ''hamba'' menjaga keluasan dan ketegangan leksikal istilah sumber.'
- issue: Ungkapan korporat בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Ini adalah sebutan konvensional bagi komunitas Israel. Padanan idiomatis tidak mengubah cakupan teologisnya dan menghindari kesan bahwa yang dimaksud hanya anak biologis atau hanya laki-laki.
- issue: Pernyataan kepunyaan Israel kepada Yahweh
  choice: pengulangan 'hamba-hamba-Ku' dipertahankan
  alternative: meringkas menjadi satu pernyataan
  rationale: Pengulangan dalam bahasa Ibrani menegaskan klaim eksklusif Yahweh atas Israel sebagai dasar larangan memperlakukan mereka sebagai milik permanen manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti penekanan teks Ibrani tanpa menjadi kaku; kapitalisasi pada bentuk terikat '-Ku' menandai pembicara ilahi sesuai kebiasaan penerbitan Alkitab Indonesia.
