  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: id
  text: Kalian akan menabur pada tahun kedelapan dan makan hasil panen yang lama[a] sampai tahun kesembilan; sampai hasil panennya tersedia, kalian akan makan hasil panen yang lama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang lama.” Pada kedua kemunculannya, bahasa Ibrani hanya memakai kata “lama”; “hasil panen” dipahami dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: Kamu harus menabur
  rationale: Bentuk perfektum Qal dengan waw dalam konteks hukum ini menyatakan tindakan yang harus dilakukan pada tahun kedelapan. Kata “harus” menyampaikan daya instruksionalnya secara alami dalam bahasa Indonesia.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: pada tahun kedelapan
  rationale: Ungkapan ordinal diterjemahkan langsung dan idiomatis.
- source_word: וַאֲכַלְתֶּם מִן הַתְּבוּאָה יָשָׁן
  choice: dan makan dari hasil panen lama
  rationale: תְּבוּאָה menunjuk pada hasil pertanian atau panen, sedangkan יָשָׁן berarti “lama,” yaitu hasil yang disimpan dari panen sebelumnya. Susunan ini alami dalam bahasa Indonesia dan mempertahankan gagasan sumber dengan “dari”.
- source_word: עַד הַשָּׁנָה הַשְּׁמִינִת ... עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: sampai tahun kesembilan
  rationale: Batas waktu diterjemahkan secara langsung.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: Sampai hasil panen tahun itu tiba
  rationale: בּוֹא berarti “datang” atau “tiba.” Sufiks feminin tunggal pada תְּבוּאָתָהּ secara wajar merujuk pada tahun kesembilan yang baru disebut; “tahun itu” membuat hubungan tersebut jelas tanpa memperluas makna.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: kamu harus makan hasil yang lama
  rationale: Bahasa Ibrani mengulangi יָשָׁן untuk menegaskan bahwa hasil lama tetap dimakan sampai panen berikutnya tersedia. Kata “hasil” dipasok dari konteks agar kalimat wajar dalam bahasa Indonesia.
