base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: id
  text: Ia harus berada bersamamu sebagai pekerja upahan, sebagai pendatang yang menetap[a]; ia harus bekerja bersamamu sampai tahun Yobel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "penduduk asing." Istilah Ibrani ini menunjuk orang nonpribumi yang tinggal menetap di tengah masyarakat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: sebagai pekerja upahan
  rationale: שָׂכִיר menunjuk pada pekerja yang menerima upah. Pilihan ini alami dalam bahasa Indonesia modern dan menegaskan bahwa statusnya bukan budak.
- source_word: כְּתוֹשָׁב
  choice: sebagai pendatang
  rationale: תּוֹשָׁב menunjuk pada orang bukan pribumi yang menetap di tengah masyarakat. 'Pendatang' ringkas dan mudah dipahami; nuansa menetap dijelaskan dalam catatan kaki.
- source_word: יִהְיֶה עִמָּךְ
  choice: ia harus tinggal bersamamu
  rationale: Secara harfiah berarti 'ia akan/harus ada bersamamu'. Dalam konteks status seorang yang menetap dan bekerja dalam rumah tangga, 'tinggal bersamamu' menyampaikan maksudnya secara wajar tanpa mengubah hubungan hukumnya.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: sampai tahun Yobel
  rationale: Ini adalah istilah teknis bagi tahun pembebasan dalam Imamat 25; 'Yobel' merupakan padanan Alkitabiah Indonesia yang dikenal.
- source_word: יַעֲבֹד עִמָּךְ
  choice: ia harus bekerja bersamamu
  rationale: עבד dapat berarti bekerja atau melayani, sedangkan עִמָּךְ secara langsung berarti 'bersamamu'. 'Bekerja bersamamu' mempertahankan ungkapan Ibrani dan menghindari kesan perbudakan yang dibatasi oleh konteks.
theological_decisions:
- issue: Status orang Israel yang bekerja karena kemiskinan atau utang
  choice: Digambarkan sebagai pekerja upahan dan pendatang, bukan sebagai budak.
  alternative: Menerjemahkan עבד sebagai 'melayani' dengan kemungkinan nuansa hubungan tuan-hamba.
  rationale: Ayat 39–43 secara tegas membedakan orang ini dari budak dan menetapkan masa kerjanya sebagai sementara. Terjemahan mempertahankan pembedaan hukum tersebut tanpa menghapus kenyataan bahwa ia tetap wajib bekerja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'ia harus' mencerminkan daya normatif yiqtol dalam konteks hukum. 'Yobel' dipertahankan sebagai istilah teknis yang lazim.
