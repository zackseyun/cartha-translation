  text: וְ֠/הָיְתָה שַׁבַּ֨ת הָ/אָ֤רֶץ לָ/כֶם֙ לְ/אָכְלָ֔ה לְ/ךָ֖ וּ/לְ/עַבְדְּ/ךָ֣ וְ/לַ/אֲמָתֶ֑/ךָ וְ/לִ/שְׂכִֽירְ/ךָ֙ וּ/לְ/תוֹשָׁ֣בְ/ךָ֔ הַ/גָּרִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: id
  text: Hasil tanah selama tahun Sabat itu akan menjadi makanan bagi kalian—bagimu, bagi budakmu yang laki-laki, bagi budakmu yang perempuan, bagi pekerja upahanmu, dan bagi orang asing yang menetap bersamamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: akan menjadi
  rationale: Bentuk ini dalam konteks hukum menyatakan keadaan yang berlaku pada masa tahun Sabat; 'akan menjadi' wajar dalam bahasa Indonesia dan tetap mempertahankan nada ketetapan.
- source_word: שַׁבַּת הָאָרֶץ
  choice: hasil tanah selama tahun Sabat itu
  rationale: Secara harfiah frasa ini berarti 'Sabat tanah', tetapi dalam hubungan dengan 'menjadi makanan' yang dimaksud ialah hasil yang tumbuh ketika tanah menjalani perhentian Sabat. Terjemahan ini menyatakan rujukan kontekstual tanpa mengaburkan kaitannya dengan tahun Sabat.
- source_word: לָכֶם לְאָכְלָה
  choice: menjadi makanan bagimu
  rationale: Ungkapan ini menunjukkan peruntukan, yakni hasil tersebut tersedia untuk dimakan. Bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: לְךָ
  choice: bagimu
  rationale: Pronomina tunggal ini memulai daftar orang yang boleh memakan hasil tanah tersebut.
- source_word: עַבְדְּךָ
  choice: budakmu yang laki-laki
  rationale: Dalam konteks hukum dan sosial ini, istilah tersebut menunjuk orang dalam status perbudakan, bukan pekerja upahan; unsur laki-laki dipertahankan karena dipasangkan dengan istilah khusus bagi budak perempuan.
- source_word: אֲמָתֶךָ
  choice: budakmu yang perempuan
  rationale: Istilah ini secara khusus menunjuk budak perempuan dan mempertahankan pembedaan gender dalam teks Ibrani.
- source_word: שְׂכִירְךָ
  choice: pekerja upahanmu
  rationale: Istilah ini menunjuk orang yang bekerja untuk mendapat upah dan membedakannya dari budak rumah tangga.
- source_word: תוֹשָׁבְךָ הַגָּרִים עִמָּךְ
  choice: pendatang yang tinggal bersamamu
  rationale: תוֹשָׁב menunjuk orang bukan pribumi yang menetap di tengah masyarakat; frasa partisipial berikutnya menegaskan bahwa ia tinggal bersama pihak yang disapa. 'Pendatang' merupakan padanan Indonesia yang jelas tanpa memakai istilah yang bernuansa merendahkan.
theological_decisions:
- issue: Penerjemahan kategori pengabdian dalam hukum Israel
  choice: Membedakan budak laki-laki dan perempuan dari pekerja upahan.
  alternative: Menerjemahkan semuanya sebagai 'hamba' atau 'pelayan'.
  rationale: Teks Ibrani membedakan status sosial dan ekonomi ketiga kategori tersebut. Menyeragamkannya akan menghilangkan perbedaan hukum yang terdapat dalam sumber.
- issue: Makna שַׁבַּת הָאָרֶץ dalam hubungan dengan makanan
  choice: Mengungkapkan hasil tanah yang tersedia selama tahun Sabat.
  alternative: Menerjemahkan secara harfiah sebagai 'Sabat tanah' atau 'perhentian Sabat tanah'.
  rationale: Yang dapat menjadi makanan ialah hasil tanah, sedangkan konstruksi Ibrani secara metonimis menyebutnya 'Sabat tanah'. Pilihan ini mempertahankan kaitan dengan tahun Sabat sekaligus menghasilkan kalimat Indonesia yang masuk akal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, termasuk pengulangan 'bagimu', agar cakupan ketetapan dan penekanan teks sumber tetap terlihat.
