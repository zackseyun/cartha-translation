  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: id
  text: Di seluruh tanah milik pusaka kalian[a], kalian harus memberikan hak penebusan bagi tanah itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Milik pusaka” merujuk pada kepemilikan tanah atau tanah pegangan dalam pembagian warisan Israel.
    reason: cultural_note
  - marker: b
    text: 'Secara lebih harfiah: “kalian harus memberikan penebusan bagi tanah itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל
  choice: Di seluruh
  rationale: Ungkapan ini memperkenalkan ketentuan umum yang berlaku di segenap wilayah yang dimaksud; dalam bahasa Indonesia, “di seluruh” lebih alami daripada terjemahan harfiah “dan di dalam semua”.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: tanah milik pusakamu
  rationale: אֶרֶץ di sini menunjuk pada tanah atau wilayah, sedangkan אֲחֻזָּה adalah milik tetap yang diterima dalam tatanan warisan Israel. “Tanah milik pusaka” menyampaikan aspek kepemilikan turun-temurun tanpa menjadikannya sekadar milik pribadi biasa.
- source_word: גְּאֻלָּה
  choice: hak penebusan
  rationale: Dalam konteks hukum tanah, nomina ini menunjuk pada penebusan atau kesempatan/hak untuk memperoleh kembali tanah melalui pembayaran. “Hak penebusan” membuat fungsi hukumnya jelas, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: תִּתְּנוּ
  choice: kamu harus memberikan
  rationale: Bentuk imperfek dalam hukum ini menyatakan kewajiban. “Harus memberikan” mempertahankan arti dasar נתן sekaligus menyampaikan daya perintahnya.
- source_word: לָאָרֶץ
  choice: atas tanah itu
  rationale: Preposisi ל menghubungkan penebusan dengan tanah yang menjadi objek ketentuan. “Atas tanah itu” merupakan ungkapan hukum Indonesia yang alami untuk suatu hak yang melekat pada tanah.
theological_decisions:
- issue: Sifat ketentuan penebusan tanah pusaka
  choice: Ayat ini mewajibkan pemberian hak atau kesempatan untuk menebus kembali tanah milik pusaka.
  alternative: Ayat ini dapat diterjemahkan lebih harfiah sebagai kewajiban untuk “memberikan penebusan bagi tanah,” tanpa secara eksplisit menyebut hak.
  rationale: Konteks Imamat 25 mendukung pengertian hukum tentang pemerolehan kembali tanah yang telah dijual. Namun, catatan kaki mempertahankan bentuk yang lebih harfiah agar istilah גְּאֻלָּה tidak dibatasi secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum secara wajar. “Tanah milik pusaka” dipilih untuk membedakan אֲחֻזָּה dari kepemilikan biasa, dan “hak penebusan” menjelaskan fungsi hukum istilah tersebut tanpa memasukkan makna doktrinal lain.
