  - severity: medium
    issue: “Lalu ia dapat kembali” untuk וְשָׁב
    rationale: 'Bentuk Ibrani menyatakan konsekuensi hukum secara futur/imperfektif: setelah pelunasan, ia kembali kepada tanah miliknya. “Dapat” memasukkan nuansa izin atau kemungkinan yang tidak dinyatakan secara eksplisit. “Ia pun kembali” mempertahankan urutan dan daya legalnya tanpa memaksakan kewajiban fisik.'
  - severity: medium
    issue: “mengembalikan kelebihannya” ambigu
    rationale: Akhiran -nya dapat mengacu pada tanah, penjual, atau pembeli. הָעֹדֵף berarti jumlah yang tersisa/selisih setelah masa yang telah berlalu dihitung. “membayarkan selisihnya” jelas dalam konteks transaksi dan setia pada fungsi verba Hifil הֵשִׁיב.
  - severity: low
    issue: Frasa relatif “orang yang kepadanya ia telah menjualnya” kurang alami
    rationale: Pengulangan “yang kepadanya” dan “menjualnya” membebani kalimat. Penyebutan “orang yang telah membeli tanah itu darinya” mengekspresikan relasi yang sama secara idiomatis.
  - severity: low
