    rationale: Catatan sebaiknya menjelaskan bahwa yang dimaksud adalah nilai bagi tahun-tahun yang masih tersisa sesudah tahun-tahun yang telah berlalu diperhitungkan, tanpa menjadikan Tahun Yobel bagian eksplisit dari teks ayat.
