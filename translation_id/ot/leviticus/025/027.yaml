translation:
  language: id
  text: maka ia harus menghitung tahun-tahun sejak tanah itu dijual dan membayarkan selisihnya[a] kepada orang yang telah membeli tanah itu darinya. Lalu ia pun kembali ke tanah miliknya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sisanya” atau “kelebihannya”. Yang dimaksud ialah jumlah yang tersisa setelah nilai tahun-tahun yang telah berlalu diperhitungkan.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah tanah miliknya sebagai milik warisan; dalam konteks ini, kemungkinan besar bagian tanah warisan keluarganya di Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: maka ia harus menghitung
  rationale: Kata kerja ini menyatakan tindakan menghitung nilai penebusan; “maka” menunjukkan urutan prosedural dalam konteks hukum.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: tahun-tahun sejak penjualan itu
  rationale: Secara harfiah, “tahun-tahun penjualannya”; dalam konteks ini yang dihitung ialah tahun-tahun yang telah berlalu sejak tanah itu dijual.
- source_word: וְהֵשִׁיב אֶת הָעֹדֵף
  choice: mengembalikan kelebihannya
  rationale: Bentuk kausatif שׁוב berarti mengembalikan atau membayar kembali, sedangkan הָעֹדֵף menunjuk pada jumlah yang tersisa setelah nilai tahun-tahun yang telah digunakan diperhitungkan.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: kepada orang yang kepadanya ia telah menjualnya
  rationale: Ungkapan ini menunjuk kepada pembeli, tetapi penyebutan personal “orang” dipertahankan dan objek tersirat dibuat jelas dalam bahasa Indonesia.
- source_word: וְשָׁב
  choice: Lalu ia dapat kembali
  rationale: Dalam rangkaian hukum ini, tindakan kembali menjadi mungkin setelah pembayaran penebusan dilakukan. “Dapat” menyampaikan hasil atau izin praktis tanpa menjadikannya perintah untuk pindah secara fisik.
- source_word: לַאֲחֻזָּתוֹ
  choice: ke tanah miliknya
  rationale: אֲחֻזָּה dalam hukum Imamat menunjuk pada milik berupa tanah, khususnya bagian tanah warisan; “tanah miliknya” lebih tepat daripada “properti” dalam bahasa Indonesia umum.
theological_decisions:
- issue: Makna אֲחֻזָּה dalam hukum Tahun Yobel
  choice: tanah miliknya
  alternative: tanah warisannya
  rationale: Istilah ini mengacu pada kepemilikan tanah dalam tatanan tanah Israel dan mengandung nuansa warisan turun-temurun. Teks utama memakai ungkapan yang alami dan tidak terlalu menjelaskan, sedangkan catatan kaki mempertahankan latar budaya-hukumnya.
- issue: Modalitas וְשָׁב setelah pembayaran penebusan
  choice: ia dapat kembali
  alternative: ia harus kembali
  rationale: Bentuk Ibrani dapat dibaca sebagai kelanjutan hukum yang menyatakan hasil atau hak untuk kembali, bukan keharusan bahwa penjual secara fisik wajib kembali. Pilihan ini mempertahankan fungsi hukum penebusan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan urutan tindakan hukum Ibrani, sementara istilah teknis dijelaskan secara ringkas dalam catatan kaki.
