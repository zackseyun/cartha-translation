review_pass:
  verdict: revise
  source_fidelity: Draf ini menangkap kondisi kemiskinan dan kewajiban memberi dukungan, tetapi “warga sementara” tidak tepat untuk תּוֹשָׁב karena warga biasanya berarti citizen. Penempatan “seperti pendatang atau warga sementara” juga mengaburkan hubungan sintaktis frasa Ibrani dengan klausa akhir. Revisi mempertahankan ketaksaan yang relevan melalui susunan kalimat dan catatan kaki.
  naturalness: “Tidak sanggup lagi mencukupi kebutuhannya di tengah-tengahmu” terasa panjang dan menambahkan nuansa yang tidak diperlukan. “Tidak lagi mampu menopang dirinya di antaramu” lebih langsung. “Orang asing yang menetap” dan “penduduk sementara” merupakan istilah Indonesia baku yang lebih jelas daripada “pendatang” dan “warga sementara.”
  terminology: Saudaramu dan menopangnya dipertahankan. גֵּר diterjemahkan “orang asing yang menetap,” sedangkan תּוֹשָׁב “penduduk sementara.” Konjungsi “dan” dipertahankan dalam teks utama, bukan diganti “atau,” karena teks Ibrani memakai וְ; kemungkinan fungsi gabungan atau alternatif sintaktis dijelaskan dalam catatan.
  issues:
  - severity: medium
    issue: “Warga sementara”
    rationale: Dalam bahasa Indonesia modern, “warga” lazimnya menunjuk warga negara atau anggota suatu komunitas, bukan kategori penduduk berstatus sementara; istilah ini dapat menyesatkan pembaca.
  - severity: medium
    issue: Hubungan frasa “pendatang atau warga sementara” dalam kalimat utama
    rationale: Frasa tersebut lebih tepat ditempatkan dekat klausa “ia hidup bersamamu.” Susunan draf menjadikannya perbandingan cara menopang secara terlalu tegas, padahal sintaksis Ibrani padat dan diperselisihkan.
  - severity: low
    issue: Parafrasa idiom dan pengulangan “di tengah-tengahmu”
    rationale: Draf dapat dipahami, tetapi ungkapan itu bertele-tele. “Di antaramu” pada klausa pertama dan “bersamamu” pada klausa akhir menyampaikan dimensi komunal עִמָּךְ secara lebih alami.
  revised_text: Jika saudaramu jatuh miskin dan tidak lagi mampu menopang dirinya di antaramu,[a] engkau harus menopangnya; sebagai orang asing yang menetap dan penduduk sementara,[b] ia harus hidup bersamamu.
