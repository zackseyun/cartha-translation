  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: id
  text: Jika saudaramu jatuh miskin dan tidak lagi mampu menopang dirinya di antaramu,[a] engkau harus menopangnya; sebagai orang asing yang menetap dan penduduk sementara,[b] ia harus hidup bersamamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangannya goyah bersamamu,” suatu ungkapan untuk kehilangan kemampuan atau sarana guna menopang diri.
    reason: lexical_alternative
  - marker: b
    text: 'Frasa Ibrani “orang asing yang menetap dan penduduk sementara” padat secara sintaksis. Frasa ini dapat dihubungkan dengan cara ia harus ditopang atau dengan statusnya ketika hidup bersama kamu; frasa itu juga dapat dipahami sebagai tambahan pihak yang harus ditopang: “topanglah dia—orang asing yang menetap dan penduduk sementara itu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Memperkenalkan ketentuan hukum bersyarat; kata penghubung awal tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: יָמוּךְ
  choice: jatuh miskin
  rationale: Menunjukkan kemerosotan keadaan ekonomi; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan istilah kekerabatan dalam teks Ibrani, yang dalam konteks ini terutama menunjuk kepada sesama anggota umat perjanjian.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: tidak sanggup lagi mencukupi kebutuhannya di tengah-tengahmu
  rationale: Mengungkapkan makna idiom tangan yang menjadi goyah, yakni kehilangan kemampuan ekonomi untuk menopang diri, sambil mempertahankan konteks kehidupan dalam komunitas.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: engkau harus menopang dia
  rationale: Bentuk kausatif חזק di sini berarti menguatkan, menegakkan, atau memberi dukungan kepada orang yang sedang terdesak secara ekonomi.
- source_word: גֵּר
  choice: pendatang
  rationale: Menunjuk kepada orang bukan pribumi yang menetap dalam masyarakat Israel; 'pendatang' merupakan istilah modern yang mudah dipahami.
- source_word: וְתוֹשָׁב
  choice: warga sementara
  rationale: Menunjuk kepada penghuni dengan status menetap yang lebih terbatas atau sementara dan membedakannya dari גֵּר.
- source_word: וָחַי עִמָּךְ
  choice: agar ia dapat tetap hidup di tengah-tengahmu
  rationale: Menyatakan hasil atau tujuan dukungan itu, yaitu memungkinkan orang tersebut terus hidup sebagai bagian dari komunitas.
theological_decisions:
- issue: Cakupan istilah 'saudaramu'
  choice: Mempertahankan istilah harfiah 'saudaramu'.
  alternative: sesama orang Israel; kerabatmu
  rationale: Bahasa kekerabatan sumber dipertahankan tanpa mempersempitnya melalui parafrasa, sementara konteks menunjukkan tanggung jawab terhadap sesama anggota umat.
- issue: Fungsi frasa 'pendatang dan warga sementara'
  choice: Memahaminya sebagai perbandingan yang menerangkan cara saudara yang miskin itu harus ditopang.
  alternative: 'Memahaminya sebagai tambahan golongan yang harus ditopang: ''topanglah dia—pendatang dan warga sementara itu''; atau sebagai satu sebutan gabungan.'
  rationale: Susunan Ibraninya padat dan memungkinkan lebih dari satu hubungan sintaksis. Bacaan utama menghasilkan kalimat Indonesia yang alami, sedangkan kemungkinan lain dipertahankan dalam catatan kaki.
- issue: Hubungan וָחַי dengan perintah sebelumnya
  choice: 'Menerjemahkannya sebagai tujuan atau hasil: ''agar ia dapat tetap hidup''.'
  alternative: dan ia akan hidup; biarlah ia hidup
  rationale: Konteks mendukung hubungan tujuan/hasil, tetapi bentuk Ibraninya juga dapat dibaca sebagai kelanjutan pernyataan atau perintah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Jatuh miskin', 'mencukupi kebutuhannya', dan 'menopang' dipilih agar dapat dipahami pembaca umum tanpa menghilangkan konteks ekonomi dan komunal. Pengulangan 'di tengah-tengahmu' mencerminkan pengulangan עִמָּךְ dalam teks sumber.
