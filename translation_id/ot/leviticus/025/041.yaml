base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: id
  text: Kemudian ia dan anak-anak lelakinya yang bersamanya akan keluar dari padamu. Ia akan kembali kepada kaum keluarganya[a] dan kembali ke tanah milik leluhurnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelompok kerabatnya”; istilah Ibrani dapat menunjuk kaum atau kelompok kekerabatan yang lebih luas daripada keluarga inti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tanah milik bapak-bapaknya”; maksudnya ialah tanah milik turun-temurun atau tanah warisan leluhurnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: harus keluar
  rationale: Dalam konteks hukum ini, bentuk verba menyatakan tindakan yang diwajibkan atau akan berlaku. “Keluar” mempertahankan gambaran konkret bahasa Ibrani tanpa langsung menafsirkannya sebagai istilah teknis “dibebaskan”.
- source_word: מֵעִמָּךְ
  choice: dari tempatmu
  rationale: Secara harfiah berarti “dari bersamamu.” Ungkapan “dari tempatmu” terdengar wajar dalam bahasa Indonesia dan menunjukkan bahwa ia meninggalkan lingkungan rumah tangga atau pelayanan orang yang disapa tanpa mempersempit maknanya.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: ia beserta anak-anak lelakinya
  rationale: “Beserta” secara alami menyampaikan bahwa anak-anak lelakinya ikut dengannya, sedangkan “anak-anak lelaki” mempertahankan bentuk maskulin eksplisit בָּנָיו.
- source_word: וְשָׁב ... יָשׁוּב
  choice: Ia harus kembali ... dan kembali
  rationale: Pengulangan “kembali” dipertahankan karena teks Ibrani mengulang akar שׁוב untuk menekankan pemulihan kepada kelompok kekerabatan dan tanah warisan.
- source_word: מִשְׁפַּחְתּוֹ
  choice: kaum keluarganya
  rationale: Dalam konteks sosial dan pertanahan, מִשְׁפָּחָה dapat menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti. “Kaum keluarga” alami dalam bahasa Indonesia dan mempertahankan keluasan itu.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: tanah milik leluhurnya
  rationale: אֲחֻזָּה di sini menunjuk tanah milik atau pegangan turun-temurun. “Tanah milik leluhurnya” menyampaikan hubungan dengan warisan keluarga secara jelas dan alami.
theological_decisions:
- issue: Bahasa kekerabatan maskulin
  choice: anak-anak lelakinya ... leluhurnya
  alternative: anak-anaknya ... bapak-bapaknya
  rationale: Bentuk maskulin eksplisit בָּנָיו dipertahankan sebagai “anak-anak lelakinya.” Untuk אֲבֹתָיו, “leluhurnya” dipilih karena merupakan ungkapan Indonesia yang alami bagi garis asal-usul dan pemilikan turun-temurun; arti harfiahnya dicatat dalam catatan kaki.
- issue: Daya hukum ungkapan keluar
  choice: harus keluar dari tempatmu
  alternative: harus dibebaskan dari pelayananmu
  rationale: Konteksnya adalah pemulihan pada tahun Yobel, tetapi verba Ibrani secara konkret berarti “keluar.” Terjemahan utama mempertahankan ungkapan sumber dan tidak memasukkan penafsiran hukum yang lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua klausa dengan pengulangan “kembali” mengikuti penekanan teks Ibrani, sementara “kaum keluarga” dan “tanah milik leluhur” menjaga konteks sosial-pertanahan tetap mudah dipahami.
