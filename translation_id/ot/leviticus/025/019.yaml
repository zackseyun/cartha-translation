id: LEV.25.19
reference: Leviticus 25:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: id
  text: Tanah itu akan menghasilkan buahnya, dan kamu akan makan sampai kenyang serta tinggal dengan aman di sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menetap dengan tenteram di atasnya.” Kata kerja Ibrani yang digunakan dapat berarti “tinggal” atau “menetap”; frasa ini menekankan kehidupan yang aman di tanah itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנָה
  choice: akan menghasilkan
  rationale: Secara harfiah berarti ‘akan memberikan’, tetapi dengan tanah sebagai subjek, ‘akan menghasilkan’ secara alami menyatakan bahwa tanah memberikan hasil pertanian.
- source_word: הָאָרֶץ
  choice: tanah itu
  rationale: Konteksnya adalah tanah tempat umat tinggal dan bercocok tanam, bukan bumi secara umum.
- source_word: פִּרְיָהּ
  choice: buahnya
  rationale: Mempertahankan gambaran konkret dari kata Ibrani פְּרִי, yang juga dapat mencakup hasil pertanian secara umum.
- source_word: וַאֲכַלְתֶּם לָשֹׂבַע
  choice: dan kamu akan makan sampai kenyang
  rationale: Ungkapan ini menyampaikan makna makan hingga merasa puas atau kenyang dengan bahasa Indonesia yang alami.
- source_word: וִישַׁבְתֶּם
  choice: serta tinggal
  rationale: Kata יָשַׁב di sini menunjuk pada hidup atau menetap di suatu tempat; ‘tinggal’ mempertahankan cakupan makna itu.
- source_word: לָבֶטַח
  choice: dengan aman
  rationale: Menyatakan keadaan tenteram dan terlindungi, sesuai makna keamanan yang terkandung dalam בֶּטַח.
- source_word: עָלֶיהָ
  choice: di sana
  rationale: Rujukannya kembali kepada tanah itu. ‘Di sana’ lebih alami dalam bahasa Indonesia daripada ungkapan harfiah ‘di atasnya’ ketika berbicara tentang tempat tinggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk ‘kamu’ mengikuti sapaan orang kedua dalam konteks hukum kepada umat secara kolektif; susunan kalimat mempertahankan hubungan antara kesuburan tanah, kecukupan makanan, dan kehidupan yang aman.
