  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: id
  text: Apa yang tumbuh sendiri dari hasil panenmu sebelumnya[a] janganlah kautuai, dan buah anggur dari pokok anggurmu yang tidak dipangkas[b] janganlah kaupetik. Itu akan menjadi tahun perhentian penuh bagi tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tanaman yang tumbuh sendiri” atau “hasil yang tumbuh dengan sendirinya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “buah anggur dari pokok anggurmu yang dibiarkan terpisah”; yang dimaksud ialah pokok anggur yang dibiarkan tidak dipangkas atau tidak dirawat selama tahun perhentian.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: apa yang tumbuh sendiri dari bekas panenmu
  rationale: סְפִיחַ menunjuk pada hasil yang tumbuh dengan sendirinya dari benih panen terdahulu, bukan tanaman yang sengaja ditabur. Frasa ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: תִקְצֹר
  choice: kau tuai
  rationale: Kata kerja ini secara khusus mengacu pada menuai hasil ladang; 'tuai' mempertahankan gambaran pertaniannya.
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: buah anggur dari tanaman anggurmu yang tidak dipangkas
  rationale: Dalam konteks tahun perhentian, נְזִירֶךָ mengacu pada tanaman anggur yang dibiarkan tidak dirawat atau tidak dipangkas. Terjemahan ini menyampaikan makna praktisnya tanpa menimbulkan kesan tentang nazar seorang nazir.
- source_word: תִבְצֹר
  choice: kau petik
  rationale: Kata kerja ini digunakan khusus untuk memetik atau mengumpulkan buah anggur; 'petik' merupakan padanan alami dalam bahasa Indonesia.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: tahun perhentian penuh
  rationale: שַׁבָּתוֹן menyatakan perhentian yang sungguh-sungguh atau lengkap. 'Perhentian penuh' mempertahankan daya tekan istilah itu dan tetap mudah dipahami.
- source_word: לָאָרֶץ
  choice: bagi tanah
  rationale: Dalam konteks Imamat 25, yang dimaksud ialah tanah pertanian yang harus dibiarkan beristirahat, bukan bumi secara umum.
theological_decisions:
- issue: Penerjemahan istilah tahun Sabat tanpa memasukkan asosiasi doktrinal atau liturgis yang lebih kemudian
  choice: tahun perhentian penuh bagi tanah
  alternative: tahun Sabat bagi tanah; tahun perhentian khidmat bagi tanah
  rationale: Pilihan ini mempertahankan gagasan teologis tentang perhentian Sabat serta daya intensif שַׁבָּתוֹן, sambil menyatakan ketentuan bagi tanah secara jelas dan tanpa menambahkan tafsiran di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang khidmat namun mudah dipahami. Bentuk 'janganlah kau' mempertahankan perintah langsung orang kedua tunggal. Istilah pertanian dijelaskan secara konkret, sedangkan metafora dan konsep perhentian tanah tetap dipertahankan.
