  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: id
  text: Jika saudaramu jatuh miskin bersamamu dan menjual dirinya kepadamu[a], janganlah engkau mempekerjakan dia sebagai budak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dijual kepadamu.” Bentuk Ibraninya pasif, tetapi dalam konteks ini dapat menunjuk pada orang miskin yang menjual dirinya untuk menjalani pengabdian karena utang.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “janganlah engkau membuat dia bekerja dengan pekerjaan seorang budak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Membuka suatu kasus bersyarat. Dalam bahasa Indonesia, “jika” sudah mengungkapkan hubungan kondisional dengan wajar; konjungsi waw tidak perlu diterjemahkan secara mekanis.
- source_word: יָמוּךְ
  choice: jatuh miskin
  rationale: Kata kerja ini menunjuk pada masuknya seseorang ke dalam keadaan miskin atau kemerosotan ekonomi. “Jatuh miskin” alami dan mempertahankan unsur perubahan keadaan.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan istilah kekerabatan harfiah. Dalam konteks hukum Imamat, kata ini juga menunjuk pada sesama anggota umat perjanjian, tetapi cakupan itu tidak dimasukkan ke teks utama.
- source_word: עִמָּךְ
  choice: di antaramu
  rationale: Mengungkapkan bahwa orang miskin itu hidup dalam lingkungan atau komunitas pihak yang disapa. Pilihan ini lebih alami daripada terjemahan mekanis “bersamamu” dalam konteks hukum ini.
- source_word: וְנִמְכַּר לָךְ
  choice: dan menjual dirinya kepadamu
  rationale: Bentuk Nifal secara formal dapat diterjemahkan pasif, tetapi dalam konteks kemiskinan dan pengabdian karena utang, ungkapan ini secara idiomatis merujuk pada penjualan diri. Kemungkinan bentuk pasif tetap dicatat dalam catatan kaki.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: janganlah engkau mempekerjakan dia
  rationale: Konstruksi ini melarang pihak yang disapa menuntut atau menggunakan tenaga orang tersebut. “Mempekerjakan dia” menyampaikan daya kausatif praktisnya secara alami dalam bahasa Indonesia.
- source_word: עֲבֹדַת עָבֶד
  choice: sebagai budak
  rationale: Frasa ini secara harfiah berarti pekerjaan atau pelayanan seorang budak. “Sebagai budak” menyampaikan status dan jenis perlakuan yang dilarang tanpa memperhalus istilah sosialnya.
theological_decisions:
- issue: Istilah status sosial dalam hukum pengabdian karena kemiskinan
  choice: sebagai budak
  alternative: sebagai pelayan; dengan pekerjaan budak; sebagai hamba sahaya
  rationale: עֶבֶד dalam frasa ini menunjuk pada status kerja terikat, bukan sekadar pelayanan umum. Ayat ini tidak menyangkal bahwa orang miskin tersebut memasuki suatu bentuk pengabdian, tetapi melarang memperlakukannya menurut pola kerja seorang budak.
- issue: Keaktifan atau kepasifan penjualan orang miskin
  choice: menjual dirinya kepadamu
  alternative: dijual kepadamu
  rationale: Konteks mendukung pengertian penjualan diri karena kemiskinan, tetapi bentuk Ibrani bersifat pasif. Teks utama memakai ungkapan idiomatis, sedangkan catatan kaki mempertahankan ambiguitas gramatikal yang asli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Bentuk “engkau” dipakai untuk mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Istilah “budak” dipertahankan karena status kerja terikat merupakan pokok larangan ayat ini.
