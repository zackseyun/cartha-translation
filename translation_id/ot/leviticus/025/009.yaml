  text: וְ/הַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִעִ֔י בֶּ/עָשׂ֖וֹר לַ/חֹ֑דֶשׁ בְּ/יוֹם֙ הַ/כִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּ/כָל אַרְצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: id
  text: Kemudian, pada bulan ketujuh, pada hari kesepuluh bulan itu, engkau harus membunyikan sangkakala[a] dengan tiupan nyaring. Pada Hari Pendamaian[b], kalian harus membunyikan sangkakala di seluruh negeri kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: syofar, yaitu alat tiup dari tanduk, yang secara tradisional sering dipahami sebagai tanduk domba jantan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, ungkapan Ibrani yang diterjemahkan “Hari Pendamaian” berbentuk jamak: “hari pendamaian-pendamaian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: engkau harus memperdengarkan
  rationale: Bentuk Hifil secara harfiah berarti ‘membuat lewat’, tetapi bersama שׁוֹפָר secara idiomatis berarti membuat bunyi sangkakala terdengar atau berkumandang. ‘Kemudian’ menyampaikan urutan tindakan yang ditandai waw.
- source_word: שׁוֹפַר תְּרוּעָה
  choice: bunyi sangkakala yang nyaring
  rationale: שׁוֹפַר adalah alat tiup dari tanduk, sedangkan תְּרוּעָה di sini menunjuk pada bunyi atau tanda keras yang dihasilkannya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya bunyi tersebut.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: pada bulan ketujuh
  rationale: Padanan waktu yang langsung dan wajar dalam bahasa Indonesia.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: pada hari kesepuluh bulan itu
  rationale: Ungkapan Ibrani harfiah ‘pada tanggal sepuluh bulan itu’ dijabarkan secara alami sebagai hari kesepuluh.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: Pada Hari Pendamaian
  rationale: Ini adalah sebutan baku dan mudah dipahami bagi hari raya tersebut. Bentuk jamak kata Ibraninya dicatat dalam catatan kaki.
- source_word: תַּעֲבִירוּ
  choice: kalian harus memperdengarkan
  rationale: Mempertahankan arti idiomatis verba yang sama sekaligus mencerminkan perubahan dari bentuk orang kedua tunggal pada awal ayat menjadi bentuk orang kedua jamak di sini.
- source_word: בְּכָל אַרְצְכֶם
  choice: di seluruh negeri kalian
  rationale: Menyampaikan cakupan menyeluruh atas wilayah umat yang disapa dan mempertahankan akhiran orang kedua jamak.
theological_decisions:
- issue: Penerjemahan יוֹם הַכִּפֻּרִים
  choice: Hari Pendamaian
  alternative: hari pendamaian-pendamaian; Hari Penghapusan Dosa
  rationale: ‘Hari Pendamaian’ menyampaikan rujukan hari kudus itu secara jelas dan mapan tanpa memaksakan bentuk jamak Ibrani ke dalam ungkapan Indonesia yang janggal. Nuansa morfologis bentuk jamak dipertahankan dalam catatan kaki.
- issue: Peralihan sapaan tunggal ke jamak
  choice: engkau ... kalian
  alternative: kamu ... kamu
  rationale: Teks Ibrani beralih dari verba orang kedua tunggal וְהַעֲבַרְתָּ ke verba orang kedua jamak תַּעֲבִירוּ. Peralihan ini dipertahankan agar ketegangan gramatikal sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Sangkakala’ dipilih karena mudah dikenali dalam konteks Alkitab, sedangkan bentuk alat aslinya dijelaskan dalam catatan kaki. Pergantian ‘engkau’ ke ‘kalian’ sengaja mempertahankan perubahan jumlah gramatikal dalam teks Ibrani.
