  text: וְ/סָפַרְתָּ֣ לְ/ךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְ/הָי֣וּ לְ/ךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַ/שָּׁנִ֔ים תֵּ֥שַׁע וְ/אַרְבָּעִ֖ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: id
  text: Engkau harus menghitung tujuh sabat tahun[a] bagimu, yaitu tujuh kali tujuh tahun, dan masa tujuh sabat tahun itu akan berjumlah empat puluh sembilan tahun bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tujuh pekan tahun"; secara harfiah, bahasa Ibrani berbunyi "tujuh sabat tahun", yang menunjuk pada tujuh daur, masing-masing tujuh tahun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ
  choice: Kamu harus menghitung
  rationale: Bentuk verba orang kedua tunggal menyatakan perintah untuk menghitung atau menetapkan urutan masa; 'menghitung' alami dan tetap dekat dengan makna sumber.
- source_word: לְךָ
  choice: bagimu
  rationale: Mempertahankan datif orang kedua tunggal yang eksplisit tanpa memberi penekanan refleksif berlebihan seperti 'bagi dirimu sendiri'.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: tujuh sabat tahun
  rationale: Mempertahankan metafora Ibrani dan kaitannya dengan ketetapan tahun sabat, sementara catatan kaki menjelaskan bahwa yang dimaksud adalah tujuh daur, masing-masing tujuh tahun.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: tujuh kali tujuh tahun
  rationale: Mengungkapkan struktur aritmetis teks secara alami dalam bahasa Indonesia tanpa mengubah isinya.
- source_word: יְמֵי שֶׁבַע שַׁבְּתֹת הַשָּׁנִים
  choice: masa tujuh sabat tahun itu
  rationale: Secara harfiah יְמֵי berarti 'hari-hari', tetapi dalam ungkapan ini menunjuk pada keseluruhan rentang waktu; 'masa' lebih alami dan jelas dalam bahasa Indonesia.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: empat puluh sembilan tahun
  rationale: Mengikuti urutan bilangan yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Makna 'sabat tahun'
  choice: Mempertahankan ungkapan 'tujuh sabat tahun' dalam teks dan menjelaskannya sebagai tujuh daur tujuh tahunan dalam catatan kaki.
  alternative: tujuh pekan tahun / tujuh daur tahun sabat
  rationale: Pilihan ini menjaga citra dan kaitan leksikal dengan hukum tahun sabat tanpa menyamarkannya sebagai pekan harfiah atau memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sambil mempertahankan pengulangan tujuh, datif 'bagimu', dan istilah khas 'sabat tahun'.
