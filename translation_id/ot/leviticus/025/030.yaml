id: LEV.25.30
reference: Leviticus 25:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: id
  text: Namun, jika rumah itu tidak ditebus sampai genap satu tahun penuh, rumah di kota yang bertembok[a] itu akan menjadi milik tetap orang yang membelinya, turun-temurun[b]. Rumah itu tidak akan kembali kepada pemilik semula pada Tahun Yobel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani yang dibaca menurut tradisi Masoret berbunyi “yang bertembok”; bentuk yang tertulis berbunyi “yang tidak bertembok.” Konteks ayat 29–31 mendukung bacaan “yang bertembok.”
    reason: textual_variant
  - marker: b
    text: 'Secara lebih harfiah: “rumah itu akan berdiri secara tetap bagi orang yang membelinya, bagi generasi-generasinya.” Ini adalah ungkapan hukum yang menyatakan bahwa penjualan tersebut menjadi tetap.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “Rumah itu tidak akan keluar pada Yobel,” artinya rumah itu tidak dilepaskan dari pembeli dan tidak kembali kepada keluarga pemilik semula.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: ditebus
  rationale: Bentuk Nifal dari גאל menunjuk pada rumah yang ditebus atau dibeli kembali menurut hukum penebusan harta dalam Imamat 25. “Ditebus” mempertahankan istilah hukum-perjanjian yang konsisten dalam pasal ini.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: sampai genap satu tahun penuh
  rationale: Ungkapan ini menyatakan batas waktu penebusan, yaitu selesainya satu masa setahun penuh. Bentuk ini alami dalam bahasa Indonesia tanpa menambahkan titik awal yang tidak disebutkan secara eksplisit dalam frasa tersebut.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: akan menjadi milik tetap
  rationale: Secara harfiah וְקָם berarti “akan berdiri/berlaku,” tetapi dalam konteks hukum, bersama לַצְּמִיתֻת, ungkapan ini berarti bahwa kepemilikan pembeli menjadi tetap dan tidak dapat dibatalkan.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לוֹ חֹמָה (qere; ketiv לֹא)
  choice: rumah di kota yang bertembok
  rationale: Bacaan qere Masoret dan konteks ayat 29–31 menunjukkan rumah dalam kota bertembok. Ketiv tertulis לֹא, “tidak,” merupakan varian tekstual asli yang dipertahankan dalam catatan kaki.
- source_word: לַקֹּנֶה אֹתוֹ
  choice: orang yang membelinya
  rationale: Partisipel קֹּנֶה menunjuk kepada pembeli; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: לְדֹרֹתָיו
  choice: turun-temurun
  rationale: Ungkapan ini menyatakan keberlanjutan hak milik dalam garis generasi pembeli. “Turun-temurun” ringkas, alami, dan mempertahankan unsur pewarisan antargenerasi.
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: tidak akan kembali kepada pemilik semula pada Tahun Yobel
  rationale: Secara harfiah berarti “tidak akan keluar pada Yobel.” Dalam hukum harta di pasal ini, maksudnya ialah rumah tersebut tidak dilepaskan dari kepemilikan pembeli dan tidak kembali kepada keluarga pemilik semula.
- source_word: יּוֹבֵל
  choice: Tahun Yobel
  rationale: Ini adalah istilah baku untuk lembaga tahun kelima puluh dalam Imamat 25. Penambahan “Tahun” membuat rujukannya jelas bagi pembaca Indonesia.
theological_decisions:
- issue: Kekuatan hukum penjualan rumah dalam kota bertembok
  choice: Jika rumah tidak ditebus dalam satu tahun penuh, rumah itu menjadi milik tetap pembeli dan garis keturunannya serta tidak kembali pada Tahun Yobel.
  alternative: Menerjemahkan וְקָם secara harfiah sebagai “akan berdiri” tanpa menjelaskan akibat hukumnya.
  rationale: Gabungan וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו, dan לֹא יֵצֵא בַּיּוֹבֵל menunjukkan pemindahan hak milik yang tetap, berbeda dari tanah yang kembali pada Tahun Yobel.
- issue: Perbedaan ketiv dan qere pada frasa tentang tembok kota
  choice: Mengikuti qere לוֹ, “yang bertembok,” dalam teks utama dan mencatat ketiv לֹא, “yang tidak bertembok,” dalam catatan kaki.
  alternative: Mengikuti ketiv dan menerjemahkan “kota yang tidak bertembok.”
  rationale: Bacaan qere sesuai dengan aturan bagi rumah di kota bertembok pada ayat 29 dan dengan kontras rumah di desa tidak bertembok pada ayat 31. Varian ketiv tetap diberitahukan agar bukti tekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum disampaikan secara jelas bagi pembaca umum; “ditebus” dan “Tahun Yobel” dipertahankan untuk kesinambungan istilah dalam Imamat 25. Varian tekstual penting pada kata “bertembok” dijelaskan tanpa membebani teks utama.
