  text: אֶ֨ת כַּסְפְּ/ךָ֔ לֹֽא תִתֵּ֥ן ל֖/וֹ בְּ/נֶ֑שֶׁךְ וּ/בְ/מַרְבִּ֖ית לֹא תִתֵּ֥ן אָכְלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: id
  text: Jangan kauberikan uangmu kepadanya dengan bunga, dan jangan kauberikan makananmu untuk mendapat keuntungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּסְפְּךָ
  choice: uangmu
  rationale: כֶּסֶף dapat berarti 'perak' atau 'uang'; dalam konteks pemberian pinjaman, 'uang' menyampaikan fungsi ekonominya secara alami.
- source_word: תִתֵּן לוֹ
  choice: kauberikan ... kepadanya
  rationale: נתן secara langsung berarti 'memberikan'. Konteks bunga menunjukkan transaksi pinjaman, tetapi terjemahan ini mempertahankan verba sumber dan membiarkan konteks menjelaskan sifat transaksi tersebut.
- source_word: בְּנֶשֶׁךְ
  choice: dengan bunga
  rationale: נֶשֶׁךְ menunjuk pada bunga yang dikenakan atas pinjaman. 'Bunga' adalah istilah Indonesia modern yang jelas dan tidak membatasi makna pada bunga yang berlebihan.
- source_word: וּבְמַרְבִּית
  choice: untuk mendapat keuntungan
  rationale: מַרְבִּית berarti tambahan, kenaikan, atau keuntungan yang diperoleh dari apa yang diberikan. Dalam kaitannya dengan makanan, frasa ini mengungkapkan pengambilan keuntungan dengan jelas dan alami.
- source_word: אָכְלֶךָ
  choice: makananmu
  rationale: אָכֶל secara langsung berarti 'makanan'; pilihan ini mempertahankan gambaran konkret teks.
- source_word: לֹא ... לֹא
  choice: Jangan ... dan jangan
  rationale: Dua bentuk negatif Ibrani menyatakan dua larangan yang sejajar; pengulangan 'jangan' mempertahankan struktur serta tekanan hukum teks.
theological_decisions:
- issue: Cakupan larangan נֶשֶׁךְ dan מַרְבִּית
  choice: Menggunakan istilah umum 'bunga' dan 'keuntungan' tanpa membatasi larangan pada kadar yang berlebihan.
  alternative: Menerjemahkan נֶשֶׁךְ sebagai 'riba' atau 'bunga yang mencekik'.
  rationale: Teks Ibrani tidak secara eksplisit membatasi larangan pada bunga yang berlebihan; istilah netral mempertahankan keluasan dan ketegangan hukum teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hukum. Bentuk terikat 'kauberikan' mempertahankan sapaan orang kedua tunggal dalam konteks perintah tanpa terasa arkais.
