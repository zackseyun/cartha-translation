revisions:
- from: Ia harus membuat perhitungan bersama pembelinya, mulai dari tahun ia menjual dirinya kepada orang itu sampai tahun Yobel. Harga penjualannya harus dihitung menurut jumlah tahun[a]; masa kerjanya pada orang itu harus diperlakukan seperti masa kerja seorang pekerja upahan.[b]
  to: Ia harus membuat perhitungan dengan pembelinya, mulai dari tahun ia menjual dirinya kepada orang itu sampai tahun Yobel. Harga penjualannya harus dihitung menurut jumlah tahun[a]; masa ia bersama pembelinya harus seperti masa seorang pekerja upahan.[b]
  rationale: Revisi menghilangkan penambahan interpretatif "harus diperlakukan" sambil mempertahankan makna bahwa jangka waktu bersama pembeli diperbandingkan dengan jangka waktu pekerja upahan. Catatan kaki b dibatasi pada alternatif harfiah agar tidak menafsirkan melampaui ayat.
