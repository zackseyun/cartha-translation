id: LEV.25.50
reference: Leviticus 25:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: id
  text: Ia harus membuat perhitungan dengan pembelinya, mulai dari tahun ia menjual dirinya kepada orang itu sampai tahun Yobel. Harga penjualannya harus dihitung menurut jumlah tahun[a]; masa ia bersama pembelinya harus seperti masa seorang pekerja upahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “harga penjualannya haruslah menurut jumlah tahun.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “seperti hari-hari seorang pekerja upahan, ia harus berada bersamanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: harus membuat perhitungan
  rationale: Kata kerja חשׁב dalam konteks penebusan ini menunjuk pada perhitungan keuangan; frasa ini alami dalam bahasa Indonesia dan mempertahankan nuansa hukum-ekonominya.
- source_word: קֹנֵהוּ
  choice: pembelinya
  rationale: Partisip dari קנה menunjuk kepada orang yang membelinya; 'pembelinya' ringkas dan mempertahankan daya transaksional teks.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: mulai dari tahun ia menjual dirinya kepada orang itu
  rationale: Bentuk Niphal secara formal dapat berarti 'ia dijual', tetapi konteks ayat 47–49 menunjukkan tindakan menjual diri untuk menjadi pekerja terikat. Terjemahan ini menyatakan makna kontekstual tanpa mengaburkan subjek.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: sampai tahun Yobel
  rationale: Ungkapan ini merupakan sebutan baku bagi tahun pelepasan yang ditetapkan dalam pasal ini; kapitalisasi menandai nama lembaganya dalam bahasa Indonesia.
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: Harga penjualannya
  rationale: כֶּסֶף secara harfiah berarti 'perak/uang', tetapi bersama מִמְכָּרוֹ di sini berarti nilai uang atau harga transaksi.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: harus dihitung menurut jumlah tahun
  rationale: Frasa tersebut menetapkan jumlah tahun sebagai dasar perhitungan proporsional; penambahan 'dihitung' membuat hubungan sintaksis jelas dalam bahasa Indonesia.
- source_word: כִּימֵי שָׂכִיר
  choice: seperti masa kerja seorang pekerja upahan
  rationale: Secara harfiah 'seperti hari-hari seorang pekerja upahan'. 'Masa kerja' menyampaikan idiom durasi dengan alami, sedangkan 'pekerja upahan' mempertahankan status orang yang bekerja dengan upah.
- source_word: יִהְיֶה עִמּוֹ
  choice: masa kerjanya pada orang itu harus diperlakukan
  rationale: Secara harfiah 'ia akan berada bersamanya'. Dalam susunan ini klausa menyatakan dasar penilaian masa pengabdiannya; perumusan Indonesia ini menjelaskan hubungan dengan perbandingan pekerja upahan tanpa menjadikannya kepemilikan tetap.
theological_decisions:
- issue: Status orang Israel yang menjual diri dalam perhitungan penebusan
  choice: Diperlakukan seperti pekerja upahan untuk keperluan masa dan nilai kerja
  alternative: Dinyatakan secara lebih harfiah bahwa 'ia harus berada bersamanya seperti hari-hari pekerja upahan'
  rationale: Perbandingan Ibrani menahan pembacaan bahwa orang tersebut menjadi milik permanen pembeli, tetapi ayat ini sendiri terutama menetapkan cara menghitung harga penebusan. Terjemahan tidak memasukkan kategori teologis tambahan.
translation_notes:
  register: Bahasa hukum yang modern, jelas, dan bermartabat. 'Yobel' dipertahankan sebagai istilah baku Alkitabiah. Struktur Ibrani yang padat dibuat lebih alami dalam bahasa Indonesia, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
