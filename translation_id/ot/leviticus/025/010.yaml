language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: id
  text: Kamu harus menguduskan tahun kelima puluh dan mengumumkan pembebasan[a] di negeri itu bagi seluruh penduduknya. Tahun itu harus menjadi tahun Yobel[b] bagimu. Masing-masing dari kamu harus kembali ke tanah miliknya[c], dan masing-masing dari kamu harus kembali kepada keluarganya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebebasan” atau “pelepasan”. Kata Ibrani dror menunjuk pada pengumuman resmi tentang pembebasan dalam tahun Yobel.
    reason: lexical_alternative
  - marker: b
    text: Ibrani yovel. Dalam konteks ini kata tersebut menamai tahun pemulihan khusus; kata yang sama juga berkaitan dengan tanduk domba jantan yang ditiup untuk mengumumkannya.
    reason: cultural_note
  - marker: c
    text: Atau “tanah warisannya”. Kata Ibrani ini terutama menunjuk pada tanah milik yang menjadi bagian warisan keluarga.
    reason: lexical_alternative
  - marker: d
    text: Atau “klannya”. Secara harfiah, kedua klausa memakai ungkapan distributif “masing-masing orang”, dengan kata Ibrani berbentuk maskulin tunggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: Kamu harus menguduskan
  rationale: Bentuk Piel dari קדשׁ menyatakan tindakan menetapkan sebagai kudus. Ungkapan ini mempertahankan makna sakral sekaligus menyampaikan daya perintah hukum secara wajar dalam bahasa Indonesia.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: tahun kelima puluh
  rationale: Ini adalah padanan idiomatis dan tepat bagi konstruksi bilangan Ibrani tersebut.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: dan mengumumkan pembebasan
  rationale: דרור menunjuk pada kebebasan atau pelepasan yang diumumkan secara resmi, khususnya pembebasan dan pemulihan dalam tahun Yobel. 'Pembebasan' menyampaikan tindakan hukum itu dengan jelas tanpa membatasinya hanya pada satu bentuk pelepasan.
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: di negeri itu kepada seluruh penduduknya
  rationale: Padanan ini mempertahankan arti lokatif ב dan cakupan menyeluruh yang dinyatakan oleh לְכָל.
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: Tahun itu harus menjadi tahun Yobel bagimu
  rationale: Dalam Imamat 25, יוֹבֵל merupakan istilah teknis bagi pranata tahun Yobel, bukan sekadar tanduk domba jantan yang dipakai untuk mengumumkannya. Penambahan 'tahun' membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: harus kembali ... harus kembali
  rationale: Pengulangan kata שוב dipertahankan untuk menonjolkan tema pemulihan serta kesejajaran kedua klausa.
- source_word: אִישׁ ... וְאִישׁ
  choice: Masing-masing dari kamu ... dan masing-masing dari kamu
  rationale: איש berbentuk tunggal maskulin, tetapi dipakai secara distributif di bawah sapaan orang kedua jamak. Ungkapan ini menyampaikan bahwa kewajiban berlaku kepada setiap orang yang disapa dan mempertahankan pengulangannya.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: ke tanah miliknya
  rationale: אֲחֻזָּה dalam konteks ini terutama menunjuk pada sebidang tanah milik atau warisan keluarga. 'Tanah miliknya' lebih tepat daripada 'miliknya' yang dapat mencakup segala jenis benda.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: kepada kaum keluarganya
  rationale: מִשְׁפָּחָה dapat menunjuk pada keluarga besar atau klan. 'Kaum keluarga' mempertahankan keluasan unit kekerabatan itu tanpa terdengar terlalu teknis.
theological_decisions:
- issue: Cakupan distributif אִישׁ dalam ketetapan hukum
  choice: Masing-masing dari kamu
  alternative: Setiap laki-laki di antara kamu
  rationale: Bentuk Ibraninya maskulin tunggal, tetapi fungsinya distributif dalam sapaan jamak. Bahasa Indonesia tidak menandai gender pada 'masing-masing'; pilihan ini mempertahankan fungsi ayat tanpa menambahkan penegasan gender yang tidak wajar. Catatan kaki menyebutkan bentuk harfiahnya.
- issue: Makna teknis יוֹבֵל
  choice: tahun Yobel
  alternative: tiupan tanduk domba jantan
  rationale: Dalam konteks ini, kata tersebut menamai pranata tahun kelima puluh. Makna yang berkaitan dengan tanduk tetap dicatat agar latar leksikalnya tidak hilang.
- issue: Cakupan pembebasan דרור
  choice: pembebasan
  alternative: kebebasan atau pelepasan
  rationale: Istilah ini menyatakan proklamasi resmi dalam tahun Yobel yang mencakup pelepasan dan pemulihan. Terjemahan utama tidak merinci penerapannya melebihi yang dikatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pola 'harus' menyampaikan ketetapan hukum dengan jelas; pengulangan 'masing-masing dari kamu harus kembali' sengaja dipertahankan untuk mencerminkan struktur dan penekanan teks Ibrani.
