translation_notes:
  register: Bahasa hukum yang modern, jelas, dan bermartabat. Pronomina 'ia' dipakai untuk menjaga kesinambungan dengan konteks, sedangkan 'orang itu' memperjelas pihak yang menjadi lawan dalam perhitungan.
