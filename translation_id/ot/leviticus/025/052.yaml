  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: id
  text: Namun, jika hanya beberapa tahun yang tersisa sampai Tahun Yobel, ia harus membuat perhitungan dengan orang itu; sebanding dengan tahun-tahun yang tersisa, ia harus membayar harga penebusannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengembalikan penebusannya”; dalam konteks ini yang dimaksud ialah jumlah uang yang harus dibayar untuk penebusannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: hanya sedikit tahun yang tersisa
  rationale: Ungkapan ini menyatakan bahwa jumlah tahun yang masih tersisa sampai Yobel hanya sedikit; susunan ini alami dalam bahasa Indonesia modern.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: Tahun Yobel
  rationale: Istilah baku dan jelas bagi lembaga hukum-perjanjian dalam Imamat 25.
- source_word: וְחִשַּׁב לוֹ
  choice: ia harus membuat perhitungan dengan orang itu
  rationale: Dalam konteks hukum-ekonomi, חִשַּׁב berarti menghitung atau memperhitungkan; לוֹ menunjuk pada pihak lain yang terlibat dalam perhitungan tersebut.
- source_word: כְּפִי שָׁנָיו
  choice: sebanding dengan tahun-tahun yang tersisa
  rationale: כְּפִי menyatakan kesesuaian atau proporsi. Penambahan 'yang tersisa' menjelaskan acuan שָׁנָיו dari konteks langsung tanpa mengubah maksudnya.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: ia harus membayar harga penebusannya
  rationale: Dalam konteks ini, גְּאֻלָּה menunjuk pada pembayaran untuk menebus atau memperoleh kebebasan, sedangkan bentuk kausatif שׁוב menyampaikan tindakan mengembalikan atau membayar. Terjemahan ini menghindari ungkapan abstrak dan kurang alami 'membayar penebusannya'.
