  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: id
  text: Sesuai dengan jumlah tahun sesudah tahun Yobel, engkau harus membeli dari sesamamu; sesuai dengan jumlah tahun panen[a], ia harus menjual kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tahun-tahun hasil bumi.” Maksudnya, harga jual dihitung menurut jumlah tahun yang masih dapat menghasilkan panen sampai tahun Yobel berikutnya, bukan sebagai pemindahan tanah secara permanen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר
  choice: sesuai dengan jumlah
  rationale: Gabungan preposisi ב dengan מִסְפָּר menyatakan ukuran atau dasar perhitungan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan struktur kedua klausa.
- source_word: אַחַר הַיּוֹבֵל
  choice: sesudah tahun Yobel
  rationale: אַחַר adalah penanda waktu, sedangkan יוֹבֵל menunjuk pada tahun pemulihan berkala dalam konteks Imamat 25. Penambahan 'tahun' memperjelas rujukannya secara alami.
- source_word: תִּקְנֶה
  choice: engkau harus membeli
  rationale: Bentuk imperfek orang kedua tunggal maskulin dalam ketentuan hukum memiliki daya instruktif; 'harus' menyampaikan kewajiban tanpa terdengar kuno.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: dari sesamamu
  rationale: עָמִית menunjuk kepada rekan atau sesama anggota masyarakat dalam konteks hukum. 'Sesamamu' ringkas, wajar, dan tidak mempersempitnya secara etnis.
- source_word: שְׁנֵי תְבוּאֹת
  choice: tahun panen
  rationale: Secara harfiah berarti 'tahun-tahun hasil bumi/panen' dan dalam konteks ini menunjuk kepada tahun-tahun yang menghasilkan panen. 'Tahun panen' mempertahankan unsur waktu dan hasil tanah.
- source_word: יִמְכָּר לָךְ
  choice: ia harus menjual kepadamu
  rationale: Bentuk orang ketiga tunggal menyatakan tindakan penjual yang berpadanan dengan kewajiban pembeli; 'ia' mempertahankan gender yang tidak ditandai dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat transaksi tanah dalam daur Yobel
  choice: Teks utama mempertahankan bahasa jual-beli dan menjelaskan dasar hitungnya sebagai jumlah tahun panen.
  alternative: Menguraikan transaksi langsung sebagai sewa hak panen sampai Yobel.
  rationale: Ayat Ibrani memakai verba membeli dan menjual. Penjelasan tentang transaksi yang tidak permanen berasal dari konteks dan ditempatkan dalam catatan kaki agar makna ekonominya jelas tanpa mengganti citra hukum teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang bermartabat. Pronomina 'engkau' dipakai untuk mempertahankan sapaan tunggal teks Ibrani; pengulangan 'sesuai dengan jumlah' menjaga kesejajaran retoris kedua klausa.
