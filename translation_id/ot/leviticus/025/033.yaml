  naturalness: Kalimat Indonesia dapat dibuat lebih langsung tanpa tanda pisah yang membebani struktur. “Penjualan sebuah rumah ... harus berakhir” mengikuti מִמְכַּר dengan lebih dekat daripada menjadikan “rumah yang telah dijual” sebagai sisipan penjelas.
