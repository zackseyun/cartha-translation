source:
  edition: WLC
  text: וַ/אֲשֶׁ֤ר יִגְאַל֙ מִן הַ/לְוִיִּ֔ם וְ/יָצָ֧א מִמְכַּר בַּ֛יִת וְ/עִ֥יר אֲחֻזָּת֖/וֹ בַּ/יֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַ/לְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔/ם בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: id
  text: Jika seseorang menebus dari orang Lewi,[a] penjualan sebuah rumah di kota miliknya harus berakhir pada Tahun Yobel,[b] sebab rumah-rumah di kota-kota orang Lewi adalah milik pusaka mereka di antara anak-anak Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini juga dapat dipahami, “Jika salah seorang Lewi menebusnya.” Kata depan yang diterjemahkan “dari” dapat dipahami sebagai penanda sumber atau secara partitif.
    reason: Mempertahankan ambiguitas sintaksis מִן הַלְוִיִּם tanpa menetapkan salah satu analisis sebagai pasti.
  - marker: b
    text: Secara harfiah, “harus keluar” pada Tahun Yobel, yaitu keluar dari penguasaan pembeli dan kembali kepada pemilik semula.
    reason: Menjelaskan penggunaan hukum וְיָצָא.
  - marker: c
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini lazim dipakai secara kolektif bagi umat Israel.
    reason: Menjelaskan bentuk maskulin jamak dalam בְּנֵי יִשְׂרָאֵל serta fungsi kolektifnya.
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: Apa yang ditebus dari orang Lewi
  rationale: 'Memahami מִן sebagai penanda sumber dan konstruksi relatif sebagai pokok hukum: sesuatu yang ditebus dari orang Lewi. Susunannya dibuat wajar dalam bahasa Indonesia, sementara kemungkinan analisis partitif dicatat dalam catatan kaki.'
- source_word: וְיָצָא
  choice: harus kembali
  rationale: Secara harfiah berarti 'keluar'. Dalam hukum Tahun Yobel, benda yang dijual keluar dari penguasaan pembeli dan kembali kepada pemilik semula; 'harus kembali' menyatakan akibat hukumnya secara jelas tanpa menghapus metafora Ibrani dari catatan kaki.
- source_word: מִמְכַּר בַּיִת וְעִיר אֲחֻזָּתוֹ
  choice: rumah yang telah dijual di kota miliknya
  rationale: Rangkaian Ibrani ini padat. Dalam konteks ayat sebelumnya, yang dimaksud ialah rumah terjual yang berada di kota milik orang Lewi. Terjemahan ini mempertahankan unsur rumah, penjualan, kota, dan kepemilikan.
- source_word: בַּיֹּבֵל
  choice: pada Tahun Yobel
  rationale: Menunjuk pada lembaga dan tahun khusus ketika harta milik dikembalikan. Bentuk ini alami dan jelas bagi pembaca Indonesia.
- source_word: בָּתֵּי עָרֵי הַלְוִיִּם
  choice: rumah-rumah di kota-kota orang Lewi
  rationale: Rangkaian konstruksi dipahami secara lokatif, yakni rumah-rumah yang berada di kota-kota orang Lewi.
- source_word: אֲחֻזָּתָם
  choice: milik pusaka mereka
  rationale: אֲחֻזָּה adalah kepemilikan tetap atau turun-temurun. 'Milik pusaka' mempertahankan corak hukum pertanahan tanpa membatasi maknanya hanya pada warisan yang baru diterima.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: di tengah keturunan Israel
  rationale: '''Keturunan Israel'' menyampaikan ungkapan kolektif perjanjian secara alami dalam bahasa Indonesia modern; bentuk harfiahnya diterangkan dalam catatan kaki.'
theological_decisions:
- issue: Analisis מִן הַלְוִיִּם dalam ketentuan penebusan
  choice: dari orang Lewi
  alternative: salah seorang Lewi menebusnya
  rationale: מִן dapat dibaca sebagai penanda sumber ('dari orang Lewi') atau secara partitif ('salah seorang dari orang-orang Lewi'). Konteks harta yang ditebus mendukung bacaan sumber, tetapi ambiguitas tata bahasanya nyata dan karena itu dipertahankan melalui catatan kaki.
- issue: Pengungkapan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; bani Israel; orang Israel
  rationale: Ungkapan Ibrani ini merupakan sebutan kolektif bagi bangsa Israel, bukan pembatasan kepada laki-laki saja. 'Keturunan Israel' tetap dekat dengan citra kekerabatan dalam teks sumber dan dapat dipahami pembaca modern.
translation_notes:
  register: Bahasa Indonesia modern yang formal dan mudah dibaca. Tanda pisah menandai keterangan penjelas mengenai harta yang ditebus. Istilah hukum-keagamaan 'Tahun Yobel' dan 'milik pusaka' dipertahankan karena penting bagi konteks Imamat 25.
