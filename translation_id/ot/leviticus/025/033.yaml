revisions:
- from: Apa yang ditebus dari orang Lewi[a]—yaitu rumah yang telah dijual di kota miliknya—harus kembali pada Tahun Yobel,[b] sebab rumah-rumah di kota-kota orang Lewi adalah milik pusaka mereka di tengah keturunan Israel.[c]
  to: Jika seseorang menebus dari orang Lewi,[a] penjualan sebuah rumah di kota miliknya harus berakhir pada Tahun Yobel,[b] sebab rumah-rumah di kota-kota orang Lewi adalah milik pusaka mereka di antara anak-anak Israel.[c]
  rationale: Revisi mempertahankan ketidakpastian yang nyata pada pembuka melalui teks aktif tak tentu dan catatan kaki, sambil memperjelas istilah hukum “penjualan” dan memakai padanan idiomatis yang lebih dekat untuk sebutan Israel. Tidak ada perubahan terhadap akibat hukum Tahun Yobel atau status rumah-rumah kota Lewi sebagai milik pusaka.
