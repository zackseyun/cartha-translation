  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: id
  text: Jika seorang pendatang yang menetap di antaramu menjadi berkecukupan, dan saudaramu yang bersamanya jatuh miskin serta menjual dirinya kepada pendatang yang menetap di antaramu itu atau kepada seorang anggota keluarga pendatang itu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kepada akar/cabang keluarga seorang pendatang.” Ungkapan Ibraninya sulit dan mungkin menunjuk kepada seorang anggota atau keturunan keluarga pendatang tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: menjadi berkecukupan
  rationale: Ungkapan harfiah “tangannya mencapai” menyatakan bahwa kemampuan atau sumber daya ekonominya bertambah hingga mencukupi. “Menjadi berkecukupan” menyampaikan idiom itu secara wajar dalam bahasa Indonesia.
- source_word: גֵּר וְתוֹשָׁב
  choice: pendatang yang menetap
  rationale: Gabungan ini menunjuk kepada orang bukan pribumi yang tinggal di tengah masyarakat Israel, bukan pelancong sementara. “Pendatang yang menetap” mempertahankan statusnya sebagai orang luar sekaligus kenyataan bahwa ia bermukim di sana.
- source_word: וּמָךְ
  choice: jatuh miskin
  rationale: Kata kerja ini menunjukkan kemerosotan keadaan ekonomi. “Jatuh miskin” alami dan mempertahankan unsur perubahan keadaan.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Terjemahan harfiah ini mempertahankan bahasa kekerabatan dan daya etis hukum tersebut; dalam konteksnya, yang dimaksud ialah sesama orang Israel.
- source_word: עִמּוֹ
  choice: yang berada di dekatnya
  rationale: Frasa ini menempatkan saudara yang miskin itu dalam kedekatan atau hubungan dengan pendatang yang berkecukupan. Pilihan ini mempertahankan keluwesan makna עִם tanpa memaksakan hubungan yang lebih khusus.
- source_word: וְנִמְכַּר
  choice: lalu menjual dirinya
  rationale: Bentuk Nifal dapat diterjemahkan secara pasif, tetapi dalam konteks kemiskinan dan pengabdian karena utang, maknanya secara efektif refleksif. “Menjual dirinya” menjelaskan tindakan yang dimaksud tanpa menambahkan pelaku lain.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: kepada salah seorang anggota keluarga pendatang itu
  rationale: עֵקֶר dalam ungkapan ini sulit dan tampaknya menunjuk kepada bagian, cabang, atau anggota kelompok keluarga. Terjemahan utama memakai ungkapan Indonesia yang jelas, sementara catatan kaki mempertahankan ketidakpastian leksikalnya.
theological_decisions:
- issue: Bahasa kekerabatan Israel dalam hukum sosial
  choice: saudaramu
  alternative: sesama orang Israel; kerabatmu
  rationale: “Saudaramu” mempertahankan gambaran kekeluargaan yang terdapat dalam teks dan daya kewajiban sosialnya, tanpa mengubahnya menjadi istilah kewargaan semata.
- issue: Sifat penjualan dalam וְנִמְכַּר
  choice: menjual dirinya
  alternative: dijual
  rationale: Konteks pasal ini menggambarkan orang miskin yang masuk ke dalam pengabdian karena keadaan ekonominya. Bentuk refleksif alami dalam bahasa Indonesia, meski bentuk Ibraninya juga dapat dibaca secara pasif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tetap lugas dan bermartabat. Struktur kalimat mempertahankan hubungan bersyarat ayat, dan koma penutup dibiarkan karena kalimat berlanjut ke ayat berikutnya.
