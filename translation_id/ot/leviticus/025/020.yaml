  text: וְ/כִ֣י תֹאמְר֔וּ מַה נֹּאכַ֤֖ל בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֑ת הֵ֚ן לֹ֣א נִזְרָ֔ע וְ/לֹ֥א נֶאֱסֹ֖ף אֶת תְּבוּאָתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: id
  text: Jika kamu berkata, “Apa yang akan kami makan pada tahun ketujuh, sebab kami tidak akan menabur ataupun mengumpulkan hasil tanah kami?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: Jika kamu berkata
  rationale: Ungkapan bersyarat Ibrani diterjemahkan secara alami; bentuk jamak ditujukan kepada umat secara kolektif.
- source_word: מַה נֹאכַל
  choice: Apa yang akan kami makan
  rationale: Mempertahankan pertanyaan langsung dan bentuk orang pertama jamak.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִת
  choice: pada tahun ketujuh
  rationale: Padanan langsung yang sesuai dengan konteks tahun sabat.
- source_word: הֵן לֹא נִזְרָע
  choice: sebab kami tidak akan menabur
  rationale: Partikel הֵן di sini memperkenalkan alasan atau keadaan yang mendasari pertanyaan; 'sebab' menghasilkan hubungan yang alami dalam bahasa Indonesia.
- source_word: וְלֹא נֶאֱסֹף אֶת תְּבוּאָתֵנוּ
  choice: ataupun mengumpulkan hasil tanah kami
  rationale: תְּבוּאָה menunjuk pada hasil atau panen yang dihasilkan tanah; 'mengumpulkan' mempertahankan verba sumber tanpa mempersempitnya menjadi tindakan menuai saja.
theological_decisions: []
