  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: id
  text: atau pamannya, atau anak laki-laki pamannya[a], boleh menebusnya; atau salah seorang kerabat sedarah dekat dari kaumnya boleh menebusnya; atau jika ia memperoleh cukup harta[b], ia boleh menebus dirinya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sepupunya.” Secara harfiah, “anak laki-laki pamannya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jika tangannya mencapai.” Maksudnya, jika ia memperoleh sumber daya yang cukup. Kata-kata selanjutnya juga dapat diterjemahkan, “ia boleh ditebus.”
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: דֹדוֹ
  choice: pamannya
  rationale: Dalam konteks hukum kekerabatan, דּוֹד berarti paman, bukan ‘kekasih’.
- source_word: בֶן דֹּדוֹ
  choice: anak laki-laki pamannya
  rationale: Menerjemahkan ungkapan Ibrani secara transparan; dalam hubungan kekerabatan yang dimaksud, orang ini adalah sepupunya.
- source_word: יִגְאָלֶנּוּ
  choice: boleh menebusnya
  rationale: Kata גאל menunjuk pada penebusan oleh kerabat. ‘Boleh’ menyampaikan daya permisif dalam ketentuan hukum ini tanpa menjadikannya perintah mutlak.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: salah seorang kerabat sedarah dekat
  rationale: Ungkapan harfiah yang berkaitan dengan ‘dagingnya’ menunjuk pada kerabat dekat berdasarkan pertalian darah.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: dari kaumnya
  rationale: מִשְׁפָּחָה di sini menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti; ‘kaum’ mempertahankan latar sosial Israel kuno dan tetap mudah dipahami.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: jika ia sendiri memperoleh cukup kemampuan
  rationale: Idiom ‘tangannya mencapai’ berarti ia mendapatkan sumber daya yang memadai. Teks utama menyampaikan maknanya secara alami, sedangkan citra tangan dipertahankan dalam catatan kaki.
- source_word: וְנִגְאָל
  choice: ia boleh menebus dirinya sendiri
  rationale: Bentuk Ibraninya secara tata bahasa bersifat pasif, ‘ia ditebus’, tetapi setelah pernyataan bahwa ia memiliki kemampuan, konteks menunjukkan penebusan atas dirinya dengan sumber dayanya sendiri.
theological_decisions:
- issue: Istilah hukum penebusan oleh kerabat
  choice: Menggunakan ‘menebus’ secara konsisten untuk גאל.
  alternative: membeli kembali; membebaskan
  rationale: ‘Menebus’ mempertahankan kesinambungan istilah hukum dan teologis dari rumpun kata גאל dalam pasal ini tanpa membatasinya pada transaksi komersial.
- issue: Idiom הִשִּׂיגָה יָדוֹ
  choice: Menyatakan makna idiom secara alami dalam teks dan mencatat gambaran harfiahnya.
  alternative: jika tangannya mencapai; jika tangannya berhasil
  rationale: Terjemahan harfiah dengan ‘tangan’ tidak lazim dan dapat kabur dalam bahasa Indonesia modern. Catatan kaki menjaga citra sumber dan kemungkinan nuansanya.
- issue: Bentuk pasif וְנִגְאָל dan makna penebusan diri
  choice: ia boleh menebus dirinya sendiri
  alternative: ia boleh ditebus; ia akan ditebus
  rationale: Bentuk pasif tetap diakui, tetapi konteks langsung—orang itu telah memperoleh kemampuan—mendukung pengungkapan refleksif dalam bahasa Indonesia. Catatan kaki menjaga bentuk alternatif yang sungguh mungkin secara tata bahasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kaum’ dipakai untuk kelompok kekerabatan yang lebih luas, sedangkan ‘kerabat sedarah dekat’ mempertahankan unsur pertalian darah dalam ungkapan Ibrani. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
