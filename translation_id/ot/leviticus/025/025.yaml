base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: id
  text: Jika saudaramu jatuh miskin dan menjual sebagian dari tanah warisannya[a], maka kerabat terdekatnya yang berhak menebus akan datang dan menebus apa yang telah dijual saudaranya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah tanah milik keluarga yang diwariskan turun-temurun dalam pembagian tanah Israel.
    reason: cultural_note
  - marker: b
    text: 'Atau: “kerabat terdekatnya yang berhak menebus dapat datang dan menebus apa yang telah dijual saudaranya.” Bahasa Ibrani tidak memakai kata modal yang secara eksplisit berarti “harus” atau “dapat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּךְ
  choice: jatuh miskin
  rationale: Ungkapan ini secara alami menyatakan kemerosotan keadaan ekonomi, sesuai dengan verba Ibrani yang berarti menjadi miskin.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan istilah kekerabatan harfiah dalam hukum Israel, tanpa mempersempit atau memperluasnya secara diam-diam.
- source_word: מֵאֲחֻזָּתוֹ
  choice: sebagian dari tanah warisannya
  rationale: Dalam konteks tahun Yobel, אֲחֻזָּה menunjuk pada tanah milik turun-temurun dalam pembagian tanah Israel, bukan sekadar harta benda umum.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: kerabatnya yang terdekat dan berhak menebus
  rationale: Mengungkapkan unsur kekerabatan dan fungsi hukum גאל dengan bahasa Indonesia yang jelas; orang tersebut adalah kerabat terdekat yang memiliki hak dan kewajiban keluarga untuk memperoleh kembali tanah itu.
- source_word: וּבָא וְגָאַל
  choice: harus datang untuk menebus
  rationale: Rangkaian perfektum berwaw dalam ketentuan hukum menyatakan konsekuensi normatif. 'Harus' menyampaikan daya hukum tersebut, sementara catatan kaki mempertahankan kemungkinan pembacaan yang kurang wajib.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: apa yang telah dijual saudaranya
  rationale: מִמְכָּר dapat menunjuk pada barang yang dijual; rumusan ini alami dan tidak mengaburkan bahwa yang ditebus ialah tanah yang telah dialihkan.
theological_decisions:
- issue: Bahasa kekerabatan dalam hukum Israel
  choice: saudaramu
  alternative: sesamamu orang Israel
  rationale: Teks memakai istilah harfiah 'saudara'. Makna komunalnya tidak disangkal, tetapi tidak dimasukkan sebagai penafsiran eksplisit ke dalam teks utama.
- issue: Istilah hukum גאל
  choice: kerabat ... yang berhak menebus / menebus
  alternative: penebus / membeli kembali
  rationale: '''Menebus'' mempertahankan kesinambungan istilah hukum-teologis גאל, sedangkan penyebutan kerabat menjelaskan bahwa pelakunya bukan sembarang pembeli.'
- issue: Daya modal וּבָא וְגָאַל
  choice: harus datang untuk menebus
  alternative: boleh datang dan menebus
  rationale: Konteks hukum mendukung kewajiban atau konsekuensi normatif, tetapi bentuk Ibraninya sendiri tidak memuat verba modal eksplisit; karena itu pembacaan permisif dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tanah warisan' dipilih agar latar hukum pertanahan Israel jelas; frasa deskriptif untuk גֹאֵל menghindari istilah teknis yang kurang alami bagi pembaca umum.
