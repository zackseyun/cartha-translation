revisions:
- from: Jika jumlah tahunnya lebih banyak, engkau harus menaikkan harga pembeliannya; dan jika jumlah tahunnya lebih sedikit, engkau harus menurunkan harga pembeliannya, karena yang dijualnya kepadamu adalah sejumlah hasil panen.[a]
  to: Sesuai dengan banyaknya tahun, engkau harus menaikkan harga pembeliannya; sesuai dengan sedikitnya tahun, engkau harus menurunkan harga pembeliannya, karena ia menjual kepadamu sejumlah kali panen.[a]
