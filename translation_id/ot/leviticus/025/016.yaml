  text: לְ/פִ֣י רֹ֣ב הַ/שָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔/וֹ וּ/לְ/פִי֙ מְעֹ֣ט הַ/שָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑/וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽ/ךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: id
  text: Sesuai dengan banyaknya tahun, engkau harus menaikkan harga pembeliannya; sesuai dengan sedikitnya tahun, engkau harus menurunkan harga pembeliannya, karena ia menjual kepadamu sejumlah kali panen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sejumlah hasil panen.” Kata Ibrani תְּבוּאוֹת dapat berarti hasil bumi, hasil panen, atau panen-panen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי רֹב הַשָּׁנִים
  choice: jika jumlah tahunnya lebih banyak
  rationale: Ungkapan לְפִי menyatakan kesesuaian atau perbandingan. Dalam konteks aturan harga ini, frasa tersebut secara alami menunjukkan bahwa harga naik bila jumlah tahun yang tersisa lebih banyak.
- source_word: תַּרְבֶּה מִקְנָתוֹ
  choice: engkau harus menaikkan harga pembeliannya
  rationale: Bentuk kausatif תַּרְבֶּה berarti membuat lebih banyak atau menaikkan. מִקְנָה dapat berarti pembelian, barang perolehan, atau harga pembelian; konteks penilaian berdasarkan tahun dan panen mendukung makna 'harga pembelian'.
- source_word: וּלְפִי מְעֹט הַשָּׁנִים
  choice: dan jika jumlah tahunnya lebih sedikit
  rationale: Frasa ini menjadi pasangan antitetis bagi jumlah tahun yang lebih banyak dan mempertahankan simetri rumusan hukum dalam bahasa Indonesia yang wajar.
- source_word: תַּמְעִיט מִקְנָתוֹ
  choice: engkau harus menurunkan harga pembeliannya
  rationale: Bentuk kausatif תַּמְעִיט berarti membuat lebih sedikit atau mengurangi; 'menurunkan harga' merupakan ungkapan Indonesia yang jelas untuk penyesuaian harga ke bawah.
- source_word: כִּי מִסְפַּר תְּבוּאֹת הוּא מֹכֵר לָךְ
  choice: karena yang dijualnya kepadamu adalah sejumlah hasil panen
  rationale: כִּי memperkenalkan alasan bagi aturan harga. Susunan fokus 'yang dijualnya ... adalah' memperjelas bahwa objek ekonomis transaksi itu ialah hasil-hasil panen selama tahun-tahun tersebut, tanpa menambahkan gagasan yang tidak dinyatakan dalam teks.
