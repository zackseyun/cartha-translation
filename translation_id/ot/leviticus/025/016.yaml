translation_notes:
  register: Bahasa hukum yang modern dan bermartabat dipertahankan dengan sapaan tunggal 'engkau'. Struktur paralel ayat dijaga, sementara ungkapan perbandingan dibuat alami dalam bahasa Indonesia. Penanda catatan kaki [a] dicantumkan dalam teks utama.
