review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the two corresponding price adjustments and the explanatory clause. However, “jika” frames the Hebrew proportional formula as merely conditional; “sesuai dengan” more directly represents לְפִי. Rendering מִסְפַּר תְּבוּאוֹת as “sejumlah kali panen” preserves the countable sense of harvests more clearly than “sejumlah hasil panen.”
  naturalness: The revision uses clear, modern standard Indonesian while retaining the direct, dignified legal register and the singular address “engkau.”
  terminology: “Harga pembeliannya” appropriately conveys מִקְנָתוֹ in this transactional context. “Kali panen” naturally expresses the counted harvest occasions/yields intended by תְּבוּאוֹת without introducing an interpretive claim about land ownership or rights.
  issues:
  - severity: low
    issue: “Jika jumlah tahunnya ...” weakens the proportional formulation.
    rationale: לְפִי means “according to/in proportion to,” rather than simply introducing an if-clause. The revised parallel wording retains the legal pricing logic more closely.
  - severity: low
    issue: “Sejumlah hasil panen” can be heard as an unspecified quantity of produce rather than a number of harvests.
    rationale: מִסְפַּר explicitly denotes a number/count. “Sejumlah kali panen” better retains the countable temporal-agricultural sense in Indonesian.
  revised_text: Sesuai dengan banyaknya tahun, engkau harus menaikkan harga pembeliannya; sesuai dengan sedikitnya tahun, engkau harus menurunkan harga pembeliannya, karena ia menjual kepadamu sejumlah kali panen.[a]
  revised_footnotes:
