  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa di Gunung Sinai:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; nama ini biasanya ditransliterasikan “Yahweh”. Bentuk “Yehuwa” juga digunakan.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber serta transliterasi alternatif tanpa secara keliru menyajikan bentuk yang dipakai dalam teks utama sebagai alternatif.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah menjadi subjek, tanpa mengubah makna dasar “berbicara”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi empat huruf dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang menerima firman, dan nama מֹשֶׁה secara baku ditulis “Musa” dalam bahasa Indonesia.
- source_word: בְּהַר סִינַי
  choice: di Gunung Sinai
  rationale: Preposisi בְּ bersifat lokatif. “Di Gunung Sinai” alami dalam bahasa Indonesia dan tidak memaksakan apakah lokasinya tepat di puncak atau di kawasan gunung.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi ucapan pada ayat berikutnya. “Demikian:” menjadi penghubung yang ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut, sedangkan catatan kaki memberi tahu pembaca tentang bentuk Ibraninya dan alternatif transliterasi.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan kalimat mempertahankan pengantar firman ilahi serta kaitannya dengan isi ucapan pada ayat berikutnya.
