id: LEV.25.12
reference: Leviticus 25:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: id
  text: Sebab, tahun itu adalah tahun Yobel; tahun itu harus kudus bagi kalian. Dari ladang itu kalian harus memakan hasilnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang dihasilkannya” atau “panennya”. Istilah Ibrani ini menunjuk pada apa yang dihasilkan ladang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ketentuan sebelumnya. “Sebab” mempertahankan hubungan penjelas-kausal secara alami dalam bahasa Indonesia.
- source_word: יוֹבֵל
  choice: tahun Yobel
  rationale: Dalam Imamat 25, istilah ini menunjuk pada tahun kelima puluh yang khusus, bukan pada sangkakala tanduk domba yang berkaitan dengan asal istilah tersebut.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: tahun itu harus kudus bagi kalian
  rationale: “Kudus” mempertahankan makna religius-perjanjian dari קֹדֶשׁ. Bentuk “harus” menyampaikan daya normatif ungkapan Ibrani dalam konteks hukum.
- source_word: מִן הַשָּׂדֶה
  choice: Dari ladang itu
  rationale: Terjemahan langsung ini mempertahankan penekanan bahwa makanan diperoleh dari ladang, sesuai ketentuan tentang tahun Yobel.
- source_word: תֹּאכְלוּ
  choice: kalian harus memakan
  rationale: Bentuk imperfek berfungsi sebagai ketentuan dalam materi hukum; “harus” menyampaikan sifat instruksionalnya dalam bahasa Indonesia modern.
- source_word: תְּבוּאָתָהּ
  choice: hasilnya
  rationale: Istilah ini menunjuk pada apa yang dihasilkan ladang. “Hasilnya” alami, luas cakupannya, dan tidak membatasi makna pada panen yang dibudidayakan secara teratur.
theological_decisions:
- issue: Bahasa kekudusan bagi tahun Yobel
  choice: tahun itu harus kudus bagi kalian
  alternative: tahun itu harus dikhususkan bagi kalian
  rationale: “Kudus” mempertahankan bobot teologis קֹדֶשׁ dan tidak mereduksinya menjadi sekadar status khusus secara sosial atau sipil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tetap wajar dan bermartabat. “Kalian” dipakai untuk menandai sapaan jamak Ibrani secara jelas. Pengulangan “tahun itu” memperjelas acuan feminin tunggal dalam teks Ibrani tanpa mengubah isinya.
