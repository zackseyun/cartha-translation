  edition: WLC
  text: אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה לּ֑/וֹ אֶחָ֥ד מֵ/אֶחָ֖י/ו יִגְאָלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: id
  text: Setelah ia dijual, ia dapat ditebus; salah seorang saudaranya[a] dapat menebusnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dalam arti yang lebih luas, “salah seorang kerabatnya dapat menebusnya.” Bahasa Ibrani secara harfiah berbunyi “salah seorang saudaranya” dan menunjuk kepada seorang laki-laki dari keluarga yang bertindak sebagai kerabat-penebus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: Setelah ia dijual
  rationale: אַחֲרֵי menyatakan urutan waktu, sedangkan bentuk nifal נִמְכַּר menyatakan keadaan pasif, yaitu ‘dijual’. Susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: ia dapat ditebus
  rationale: Secara harfiah konstruksi ini berarti bahwa penebusan tersedia baginya. Bentuk verbal ‘ia dapat ditebus’ menyampaikan hak atau kemungkinan hukum itu secara alami tanpa menghilangkan makna penebusan.
- source_word: אֶחָד מֵאֶחָיו
  choice: salah seorang saudaranya
  rationale: Ungkapan ini secara harfiah menunjuk kepada satu orang dari antara saudara laki-lakinya. ‘Salah seorang saudaranya’ merupakan padanan Indonesia yang wajar dan mempertahankan istilah kekerabatan maskulin dalam teks utama.
- source_word: יִגְאָלֶנּוּ
  choice: dapat menebusnya
  rationale: Kata kerja גאל adalah istilah baku untuk tindakan kerabat yang menebus atau membeli kembali anggota keluarga. ‘Menebusnya’ mempertahankan nuansa hukum dan makna penebusan; ‘dapat’ menyatakan ketentuan atau kemungkinan yang diberikan oleh hukum.
theological_decisions:
- issue: Cakupan istilah kekerabatan אֶחָיו
  choice: saudaranya
  alternative: kerabatnya
  rationale: Teks Ibrani secara harfiah memakai bentuk maskulin ‘saudara-saudaranya’. Teks utama mempertahankan bentuk itu agar tidak memperluas maknanya secara diam-diam, sedangkan catatan menjelaskan cakupan hukum kekerabatan yang mungkin lebih luas.
- issue: Bentuk ungkapan גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: ia dapat ditebus
  alternative: penebusan tersedia baginya
  rationale: Bahasa Ibrani memakai nomina ‘penebusan’ dalam konstruksi eksistensial/legal. Terjemahan verbal lebih alami dalam bahasa Indonesia dan tetap menyatakan bahwa hak atau kemungkinan penebusan masih berlaku, tanpa menentukan apakah penebusan itu pasti terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum tanpa terasa kaku. Istilah ‘menebus’ dipertahankan karena sesuai dengan konteks hukum kekerabatan sekaligus menjaga resonansi teologis kata Ibrani גאל.
