  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: id
  text: Namun, tanah penggembalaan di sekitar kota-kota mereka tidak boleh dijual, karena itu merupakan milik tetap mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hak milik untuk selama-lamanya.” Kata Ibrani עוֹלָם dapat menyatakan keberlangsungan yang tetap; di sini kata itu menunjuk pada status tanah yang tidak boleh dialihkan.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה
  choice: Namun, ladang
  rationale: שָׂדֶה berarti 'ladang'; וּ diterjemahkan 'Namun' untuk menandai pertentangan dengan ketentuan sebelumnya.
- source_word: מִגְרַשׁ
  choice: tanah penggembalaan
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota, khususnya wilayah yang dapat digunakan untuk menggembalakan ternak di sekitar kota-kota orang Lewi.
- source_word: עָרֵיהֶם
  choice: milik kota-kota mereka
  rationale: Ungkapan ini menyampaikan hubungan konstruksi Ibrani secara alami dan mengaitkan tanah tersebut dengan kota-kota mereka.
- source_word: לֹא יִמָּכֵר
  choice: tidak boleh dijual
  rationale: Bentuk pasif menyatakan larangan hukum; frasa ini wajar dan jelas dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan bagi larangan tersebut.
- source_word: אֲחֻזַּת עוֹלָם
  choice: milik tetap
  rationale: אֲחֻזָּה adalah milik atau tanah pegangan, sedangkan עוֹלָם dalam konteks hukum ini menekankan status yang terus berlaku dan tidak boleh dialihkan.
- source_word: הוּא לָהֶם
  choice: itu adalah ... mereka
  rationale: Konstruksi pronomina dan frasa berpreposisi menyatakan bahwa tanah tersebut merupakan milik mereka.
theological_decisions:
- issue: Daya makna עוֹלָם dalam hukum tanah Israel
  choice: milik tetap
  alternative: milik untuk selama-lamanya
  rationale: Dalam konteks hukum tanah ini, עוֹלָם menekankan status kepemilikan yang bertahan dan tidak dapat dialihkan, tanpa harus menyatakan kekekalan metafisis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'tanah penggembalaan' dipilih agar fungsi מִגְרָשׁ mudah dipahami, sementara 'ladang' mempertahankan unsur שָׂדֶה dalam teks sumber.
