  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים לְ/פִי/הֶן֙ יָשִׁ֣יב גְּאֻלָּת֔/וֹ מִ/כֶּ֖סֶף מִקְנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: id
  text: Jika tahun yang tersisa masih banyak, sebanding dengan jumlah tahun itu ia harus membayar kembali harga penebusannya[a] dari uang yang dibayarkan untuk membelinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penebusannya”; kata benda Ibrani dapat menunjuk pada tindakan penebusan, tetapi dalam konteks ini kemungkinan besar berarti jumlah uang yang harus dibayar untuk penebusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel bersyarat yang memperkenalkan kemungkinan dalam ketentuan hukum ini.
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: tahun yang tersisa masih banyak
  rationale: Ungkapan ini menyatakan bahwa masih ada banyak tahun sebelum Tahun Yobel; susunan ini alami dalam bahasa Indonesia.
- source_word: לְפִיהֶן
  choice: sebanding dengan jumlah tahun itu
  rationale: Secara harfiah berarti 'menurut mulutnya', tetapi merupakan idiom yang di sini menyatakan perbandingan berdasarkan banyaknya tahun yang tersisa.
- source_word: יָשִׁיב
  choice: ia harus membayar kembali
  rationale: Bentuk Hifil dari שוב dalam konteks keuangan berarti mengembalikan atau membayar kembali sejumlah uang.
- source_word: גְּאֻלָּתוֹ
  choice: harga penebusannya
  rationale: Dalam perhitungan hukum-ekonomi ini, kata benda tersebut kemungkinan menunjuk pada jumlah uang yang harus dibayar untuk penebusan, bukan hanya tindakan menebus.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: dari uang yang dibayarkan untuk membelinya
  rationale: Menyampaikan secara jelas arti harfiahnya, 'dari uang pembeliannya', yakni harga pembelian semula yang menjadi dasar perhitungan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum-ekonomi dibuat jelas tanpa menghilangkan hubungan perhitungan antara tahun yang tersisa, harga pembelian semula, dan pembayaran penebusan.
