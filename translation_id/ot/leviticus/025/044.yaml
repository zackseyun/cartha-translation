  text: וְ/עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ אֲשֶׁ֣ר יִהְיוּ לָ֑/ךְ מֵ/אֵ֣ת הַ/גּוֹיִ֗ם אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם מֵ/הֶ֥ם תִּקְנ֖וּ עֶ֥בֶד וְ/אָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: id
  text: 'Adapun budak laki-laki dan budak perempuan[a] yang akan menjadi milikmu: dari bangsa-bangsa yang ada di sekelilingmu, dari merekalah kamu boleh membeli budak laki-laki dan budak perempuan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai dua istilah berbeda menurut jenis kelamin. Keduanya juga dapat diterjemahkan “hamba,” tetapi konteks pembelian dan kepemilikan di sini menunjukkan status budak.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ / עֶבֶד
  choice: budak laki-laki
  rationale: עֶבֶד dapat berarti hamba atau budak, tetapi dalam konteks hukum ini pembelian dan kepemilikan dinyatakan secara eksplisit. Tambahan “laki-laki” mempertahankan pembedaan dengan istilah feminin yang dipasangkan dengannya.
- source_word: אֲמָתְךָ / אָמָה
  choice: budak perempuan
  rationale: אָמָה adalah istilah feminin yang berpasangan dengan עֶבֶד dalam ayat ini. Pilihan ini mempertahankan pembedaan jenis kelamin dan menghindari istilah lama seperti “sahaya perempuan”.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: yang menjadi milikmu
  rationale: Ungkapan ini menyatakan hubungan kepemilikan dalam ketentuan hukum. Bentuk Indonesia ini alami dan tidak memaksakan penekanan futur yang tidak diperlukan.
- source_word: מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: dari bangsa-bangsa yang ada di sekelilingmu
  rationale: גּוֹיִם di sini menunjuk kepada bangsa-bangsa non-Israel di sekitar Israel. “Bangsa-bangsa” mempertahankan arti sosial-geografis tanpa muatan teologis tambahan.
- source_word: תִּקְנוּ
  choice: kamu boleh membeli
  rationale: קנה berarti membeli atau memperoleh. Dalam konteks peraturan ini, bentuk imperfek menyatakan izin, bukan perintah untuk melakukan pembelian.
- source_word: מֵהֶם
  choice: dari ...-lah
  rationale: Partikel fokus “-lah” pada frasa sumber menyampaikan penegasan Ibrani bahwa budak tersebut boleh dibeli dari bangsa-bangsa di sekeliling Israel.
theological_decisions:
- issue: Penerjemahan istilah perbudakan dalam teks hukum
  choice: budak
  alternative: hamba
  rationale: Ayat ini secara eksplisit berbicara tentang orang yang dibeli dan menjadi milik pihak lain. “Budak” menyatakan status terikat itu dengan jujur, sedangkan “hamba” dapat mengaburkan sifat hubungan hukum tersebut.
- issue: Daya modal תִּקְנוּ dalam konteks
  choice: kamu boleh membeli
  alternative: kamu harus membeli
  rationale: Ketentuan ini mengizinkan sumber pembelian, bukan memerintahkan orang Israel untuk membeli budak. Terjemahan permisif mempertahankan fungsi hukum ayat tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Susunan “dari ...-lah” mempertahankan penekanan pada sumber pembelian, sedangkan pengulangan “budak laki-laki dan budak perempuan” mencerminkan pengulangan pasangan istilah dalam teks Ibrani.
