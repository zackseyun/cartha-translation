  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: id
  text: Pada Tahun Yobel ini, setiap orang di antara kamu harus kembali ke tanah miliknya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: miliknya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת
  choice: Pada ... Tahun
  rationale: Gabungan preposisi ב dengan bentuk konstruksi שָׁנָה menyatakan waktu. Dalam bahasa Indonesia, “pada ... Tahun” wajar untuk menunjuk tahun khusus tempat ketetapan ini berlaku.
- source_word: הַ/יּוֹבֵל
  choice: Tahun Yobel
  rationale: יוֹבֵל di Imamat 25 menunjuk tahun khusus dalam pranata Yobel. “Tahun Yobel” merupakan istilah yang jelas, ringkas, dan lazim dalam konteks Alkitab.
- source_word: הַ/זֹּאת
  choice: ini
  rationale: Kata tunjuk feminin ini menerangkan שְׁנַת dan secara alami ditempatkan sesudah “Tahun Yobel” dalam bahasa Indonesia.
- source_word: תָּשֻׁבוּ
  choice: harus kembali
  rationale: Bentuk orang kedua jamak ini berfungsi sebagai ketetapan hukum. “Harus kembali” menyampaikan kewajiban sekaligus makna dasar verba שׁוב.
- source_word: אִישׁ
  choice: setiap orang di antara kamu
  rationale: אִישׁ dipakai secara distributif sesudah verba orang kedua jamak. Ungkapan ini mempertahankan hubungan dengan para pendengar sekaligus menyatakan bahwa kewajiban berlaku kepada tiap-tiap orang.
- source_word: אֶל
  choice: ke
  rationale: Preposisi ini menyatakan arah tujuan dan secara langsung sepadan dengan “ke” setelah verba “kembali”.
- source_word: אֲחֻזָּת/וֹ
  choice: tanah miliknya
  rationale: Dalam konteks Imamat 25, אֲחֻזָּה terutama menunjuk tanah atau lahan milik yang menjadi pegangan keluarga. “Tanah miliknya” jelas bagi pembaca modern dan mempertahankan sufiks orang ketiga tunggal.
theological_decisions:
- issue: Bentuk distributif maskulin אִישׁ
  choice: setiap orang di antara kamu
  alternative: setiap laki-laki di antara kamu
  rationale: Dalam ketetapan ini אִישׁ berfungsi distributif, yaitu masing-masing anggota umat yang memiliki tanah. Bahasa Indonesia tidak memiliki keharusan gramatikal untuk menandai gender pada “orang”; menerjemahkannya sebagai “laki-laki” dapat mempersempit cakupan secara tidak perlu, sedangkan “setiap orang di antara kamu” mempertahankan fungsi distributif dan sapaan jamak.
- issue: Cakupan אֲחֻזָּה
  choice: tanah miliknya
  alternative: milik pusakanya
  rationale: Konteks pasal ini membicarakan pemulihan kepemilikan lahan pada Tahun Yobel. Teks ayat sendiri memakai istilah yang dapat berarti milik, pegangan, atau tanah pusaka; pilihan utama menjelaskan referen kontekstual tanpa memasukkan rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang tetap mudah dipahami. Susunan “setiap orang di antara kamu” mempertahankan sapaan jamak Ibrani serta penerapannya secara perseorangan.
