  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: id
  text: Namun, rumah-rumah di desa-desa yang tidak dikelilingi tembok harus dianggap sebagai tanah ladang[a]. Hak penebusan tetap berlaku atas rumah-rumah itu, dan pada Tahun Yobel rumah-rumah itu akan dilepaskan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “harus diperhitungkan sebagai ladang negeri itu”; maksudnya, secara hukum rumah-rumah desa ini diperlakukan seperti tanah pedesaan, bukan seperti rumah di kota bertembok.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan pada Tahun Yobel, itu akan keluar.” Dalam konteks hukum ini, ungkapan tersebut menunjuk pada pelepasan properti itu pada Tahun Yobel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: rumah-rumah di desa-desa
  rationale: Frasa konstruksi ini menunjuk pada rumah-rumah yang berada di permukiman pedesaan; 'desa-desa' alami dalam bahasa Indonesia, sedangkan ketiadaan tembok dinyatakan oleh klausa berikutnya.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: yang tidak dikelilingi tembok
  rationale: Menyampaikan secara alami bahwa desa-desa tersebut tidak memiliki tembok yang mengelilinginya.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: harus dianggap sama seperti ladang di negeri itu
  rationale: 'Mempertahankan gambaran harfiah ''ladang di negeri itu'' sekaligus memperjelas fungsi yuridisnya: rumah desa diperlakukan seperti tanah pertanian, bukan seperti rumah dalam kota bertembok.'
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: Rumah-rumah itu dapat ditebus
  rationale: Ungkapan Ibrani menyatakan bahwa hak penebusan tetap berlaku atas properti tersebut; bentuk pasif-modal ini ringkas dan alami.
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: dan pada Tahun Yobel harus dikembalikan
  rationale: Secara harfiah berarti 'akan keluar', tetapi dalam konteks hukum tanah menunjuk pada pelepasan atau kembalinya properti pada Tahun Yobel.
theological_decisions:
- issue: Makna 'keluar' pada Tahun Yobel
  choice: harus dikembalikan
  alternative: akan keluar
  rationale: Terjemahan kontekstual menyatakan akibat hukum tanpa menetapkan lebih jauh pihak penerima; catatan kaki mempertahankan idiom dan ambiguitas gramatikal teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum 'ditebus' serta istilah kelembagaan 'Tahun Yobel' dipertahankan; susunan kalimat dibuat alami tanpa menghilangkan klasifikasi hukum dan idiom Ibrani yang dijelaskan dalam catatan kaki.
