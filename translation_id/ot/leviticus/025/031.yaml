  to: Namun, rumah-rumah di desa-desa yang tidak dikelilingi tembok harus dianggap sebagai tanah ladang[a]. Hak penebusan tetap berlaku atas rumah-rumah itu, dan pada Tahun Yobel rumah-rumah itu akan dilepaskan[b].
