  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: id
  text: Seperti pekerja upahan, tahun demi tahun ia harus tinggal bersamanya; orang itu tidak boleh berkuasa atasnya dengan kejam di depan matamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: Seperti pekerja upahan
  rationale: Prefiks כ menyatakan perbandingan, sedangkan שׂכיר menunjuk kepada orang yang bekerja dengan upah, bukan budak. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan perbandingan dalam teks Ibrani.
- source_word: שָׁנָה בְּשָׁנָה
  choice: tahun demi tahun
  rationale: Idiom ini menyatakan keadaan yang berlangsung dan ditinjau setiap tahun; 'tahun demi tahun' ringkas serta mempertahankan nuansa distributifnya.
- source_word: יִהְיֶה עִמּוֹ
  choice: ia harus tinggal bersamanya
  rationale: Secara harfiah berarti 'ia akan/harus berada bersamanya'. 'Tinggal bersamanya' menyampaikan keberadaan yang berkelanjutan secara alami tanpa menambahkan kata 'melayani' yang tidak dinyatakan oleh verba היה.
- source_word: לֹא יִרְדֶּנּוּ
  choice: orang itu tidak boleh berkuasa atasnya
  rationale: רדה berarti memerintah, menguasai, atau menjalankan kekuasaan atas seseorang. Subjek diperjelas menjadi 'orang itu' agar rujukan pronomina Ibrani tetap mudah dipahami dalam bahasa Indonesia.
- source_word: בְּפֶרֶךְ
  choice: dengan kejam
  rationale: Kata ini menyatakan kekerasan atau kekejaman dalam pelaksanaan kuasa, khususnya dalam konteks kerja paksa. 'Dengan kejam' alami setelah 'berkuasa atasnya' dan mempertahankan daya etis larangan tersebut.
- source_word: לְעֵינֶיךָ
  choice: di depan matamu
  rationale: Ungkapan ini mempertahankan citra harfiah 'di hadapan mata' sekaligus lazim dipahami sebagai sesuatu yang terjadi dalam penglihatan atau sepengetahuan pihak yang disapa.
theological_decisions:
- issue: Status orang Israel di bawah pemilik pendatang
  choice: Statusnya digambarkan melalui perbandingan dengan pekerja upahan, bukan disebut sebagai budak.
  alternative: Sebagai pelayan upahan, tahun demi tahun ia harus berada bersamanya.
  rationale: כִּשְׂכִיר membingkai kedudukannya sebagai perbandingan dengan pekerja upahan. Pilihan ini mempertahankan perlindungan hukum dan sifat sementara dalam konteks tanpa menghapus kenyataan bahwa ia berada di bawah kuasa orang lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum; peralihan dari 'ia' ke 'orang itu' mencegah kerancuan antara orang Israel yang bekerja dan pemiliknya.
