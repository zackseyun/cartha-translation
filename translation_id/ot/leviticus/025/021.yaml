    rationale: Kecukupan memang tersirat oleh konteks, tetapi לִשְׁלֹשׁ הַשָּׁנִים hanya menyatakan “untuk tiga tahun.” Terjemahan yang tidak menambahkan “cukup” lebih mempertahankan tingkat eksplisit sumber.
