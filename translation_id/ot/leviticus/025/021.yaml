  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: id
  text: Maka Aku akan memerintahkan berkat-Ku bagimu pada tahun keenam, dan berkat itu akan menghasilkan hasil panen untuk tiga tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: Maka ... Aku akan memerintahkan
  rationale: Bentuk orang pertama tunggal dari צוה menyatakan perintah atau ketetapan ilahi. “Maka” menampilkan fungsi penghubungnya sebagai jawaban atas pertanyaan yang dibayangkan dalam ayat sebelumnya.
- source_word: אֶת־בִּרְכָתִי לָכֶם
  choice: berkat-Ku bagimu
  rationale: ברכה menunjuk pada berkat yang Allah karuniakan, sedangkan לָכֶם menandai penerimanya. Ungkapan ini tetap luas, dan dampak pertaniannya dijelaskan oleh klausa berikut.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: pada tahun keenam
  rationale: Terjemahan temporal langsung dan wajar yang mempertahankan letak berkat itu dalam siklus tahun sabat.
- source_word: וְעָשָׂת אֶת־הַתְּבוּאָה
  choice: sehingga tahun itu akan menghasilkan panen
  rationale: Verba feminin tunggal dapat dipahami dengan “tahun keenam” sebagai subjek kontekstual. “Menghasilkan panen” menyampaikan hasil pertanian secara alami dalam bahasa Indonesia.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: yang cukup untuk tiga tahun
  rationale: Secara harfiah berarti “untuk tiga tahun”; dalam konteks, frasa itu menyatakan kecukupan hasil panen bagi jangka tersebut. Penambahan “cukup” membuat hubungan maknanya jelas dalam bahasa Indonesia tanpa mengubah isi.
theological_decisions:
- issue: Sifat berkat yang dijanjikan
  choice: Tindakan ilahi langsung yang menghasilkan persediaan panen luar biasa
  alternative: Pernyataan umum tentang pemeliharaan ilahi
  rationale: Ungkapan orang pertama “Aku akan memerintahkan berkat-Ku” menggambarkan ketetapan khusus Allah, bukan sekadar pengamatan mengenai pola panen biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata “panen” dipilih agar hasil pertanian mudah dipahami; konstruksi “sehingga” memperjelas bahwa kelimpahan merupakan akibat dari berkat yang diperintahkan Allah.
