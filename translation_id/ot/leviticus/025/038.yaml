  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: id
  text: Akulah Yahweh[a], Allah kalian, yang membawa kalian keluar dari tanah Mesir untuk memberikan tanah Kanaan kepada kalian, untuk menjadi Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan transliterasi nama ilahi יְהוָה dan padanan tradisionalnya.
lexical_decisions:
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Klausa identifikasi tanpa verba diterjemahkan secara alami dan tegas dengan “Akulah”; nama perjanjian יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis jamak, dalam rumusan perjanjian ini acuannya tunggal, yaitu Allah Israel. Sufiks orang kedua jamak dipahami secara kolektif dan dapat dinyatakan secara alami dengan “-mu” dalam bahasa Indonesia.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: yang membawa kamu keluar
  rationale: Bentuk Hifil dari יצא lazim berarti “membawa keluar”, khususnya dalam rumusan keluaran dari Mesir; “kamu” mempertahankan sapaan jamak kolektif tanpa bentuk yang kaku.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Kata אֶרֶץ dipertahankan sebagai “tanah”, bukan dihilangkan menjadi hanya “Mesir”.
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: untuk memberikan kepadamu tanah Kanaan
  rationale: Infinitif לָתֵת menyatakan tujuan; susunan ini menjaga unsur pemberian dan tujuan keluaran dengan bahasa Indonesia yang wajar.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: dan menjadi Allahmu
  rationale: Infinitif kedua berada dalam rangkaian tujuan dengan לָתֵת. “Menjadi Allahmu” cukup dekat dengan bentuk Ibrani dan menyampaikan relasi perjanjian; kata “dan” memperjelas koordinasi alami dalam bahasa Indonesia tanpa mengubah isinya.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi YHWH, bukan gelar. Transliterasi “Yahweh” mempertahankan nama pribadi itu, sementara catatan kaki mencatat kebiasaan penerjemahan tradisional.
- issue: Rumusan perjanjian לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: menjadi Allahmu
  alternative: menjadi Allah bagimu; menjadi Allah kamu
  rationale: Pilihan ini mempertahankan bentuk infinitif “menjadi” dan daya relasional rumusan perjanjian, tanpa menyiratkan perubahan dalam hakikat Allah; yang dinyatakan ialah kedudukan-Nya dalam relasi perjanjian dengan umat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Akulah” mempertahankan penekanan pengenalan diri; “Allahmu” dan “kepadamu” dipakai secara kolektif untuk kelompok yang disapa. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang memuat nama dan gelar ilahi.
