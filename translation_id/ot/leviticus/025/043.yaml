  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: id
  text: Janganlah engkau memerintah dia dengan kejam[a], tetapi takutlah akan Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan keras” atau “dengan kekerasan.” Istilah Ibrani ini menunjuk pada perlakuan keras yang menindas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה
  choice: memerintah
  rationale: Kata רדה menyatakan tindakan berkuasa atau memerintah atas seseorang. Dalam konteks hukum ini, “memerintah” mempertahankan hubungan kewenangan tanpa mempersempit maknanya menjadi sekadar menyuruh bekerja.
- source_word: בּוֹ
  choice: dia
  rationale: Pronomina maskulin tunggal ini menunjuk kembali kepada orang Israel yang berada dalam pelayanan karena kemiskinan. Hubungan ‘atas dia’ sudah tersirat secara alami dalam konstruksi bahasa Indonesia.
- source_word: בְּפָרֶךְ
  choice: dengan kejam
  rationale: פָרֶךְ menunjuk pada perlakuan yang keras dan menindas. “Dengan kejam” alami dalam bahasa Indonesia dan menyampaikan beratnya perlakuan tersebut tanpa harus membatasi makna pada kerja paksa saja.
- source_word: וְיָרֵאתָ
  choice: tetapi takutlah
  rationale: Walaupun וְ secara bentuk berarti “dan”, sesudah larangan klausa ini berfungsi sebagai kontras dan dasar etis. “Tetapi” mengungkapkan hubungan wacana itu secara alami.
- source_word: מֵאֱלֹהֶיךָ
  choice: akan Allahmu
  rationale: Dengan verba ירא, preposisi מִן menandai objek rasa takut atau hormat. Dalam bahasa Indonesia, bentuk idiomatisnya ialah “takut akan Allahmu”.
theological_decisions:
- issue: Fungsi klausa terakhir sebagai landasan etis
  choice: “tetapi takutlah akan Allahmu” menyatakan bahwa rasa takut kepada Allah harus membatasi penggunaan kuasa atas sesama.
  alternative: “dan takutlah akan Allahmu” dapat mempertahankan konjungsi Ibrani secara lebih harfiah.
  rationale: 'Pilihan kontras mempertahankan alur etis ayat: larangan memperlakukan orang dengan kejam dihubungkan dengan rasa takut kepada Allah, tanpa menambahkan ajaran denominasi tertentu.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk tunggal “engkau” dipertahankan karena semua verba dan pronomina dalam ayat ini berjenis maskulin tunggal. Ungkapan “takut akan Allahmu” dipakai sebagai bentuk religius yang tetap wajar dan mudah dipahami.
