  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: id
  text: Jika seseorang menjual rumah tempat tinggal di kota yang bertembok, rumah itu dapat ditebus sampai genap satu tahun sejak penjualannya. Hak penebusannya berlaku selama setahun penuh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “selama hari-hari”; dalam ungkapan hukum Ibrani ini, maksudnya ialah jangka waktu satu tahun penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Jika seseorang
  rationale: Dalam rumusan hukum kasuistik, כִּי memperkenalkan syarat. אִישׁ secara leksikal berarti laki-laki/orang, tetapi bahasa hukum Indonesia yang alami memakai “seseorang” sebagai pelaku representatif tanpa mengubah cakupan ketentuan.
- source_word: יִמְכֹּר
  choice: menjual
  rationale: Bentuk imperfek dalam protasis hukum diterjemahkan secara alami dengan bentuk kini Indonesia sesudah “jika”.
- source_word: בֵּית מוֹשַׁב
  choice: rumah tempat tinggal
  rationale: Mempertahankan fungsi hunian yang dinyatakan oleh frasa konstruksi, sekaligus memakai ungkapan Indonesia yang wajar.
- source_word: עִיר חוֹמָה
  choice: kota yang bertembok
  rationale: Secara harfiah menunjuk pada kota yang memiliki tembok; pilihan ini lebih tepat daripada mempersempitnya menjadi sekadar kota berbenteng.
- source_word: וְהָיְתָה גְּאֻלָּתוֹ
  choice: rumah itu dapat ditebus
  rationale: Dalam konteks hukum tanah, גְּאֻלָּה menunjuk pada penebusan kembali setelah penjualan. Bentuk verbal ini jelas dan alami dalam bahasa Indonesia.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: sampai genap satu tahun sejak penjualannya
  rationale: Menyatakan satu tahun penuh yang dihitung dari penjualan, bukan akhir tahun kalender.
- source_word: יָמִים תִּהְיֶה גְאֻלָּתוֹ
  choice: Hak penebusannya berlaku selama setahun penuh
  rationale: יָמִים dapat menjadi idiom bagi masa satu tahun. Terjemahan utama menyampaikan maksud hukum dengan jelas, sementara catatan kaki mencatat bentuk harfiahnya.
theological_decisions: []
translation_notes:
  register: Bahasa hukum yang modern, jelas, dan bermartabat. “Hak penebusan” dipakai pada klausa kedua untuk memperjelas bahwa yang tetap berlaku selama masa tersebut ialah hak untuk membeli kembali rumah itu; pengulangan dalam teks Ibrani tetap dipertahankan secara fungsional.
