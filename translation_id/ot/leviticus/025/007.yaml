  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: id
  text: Bagi ternakmu dan binatang liar yang ada di tanahmu, seluruh hasil tanah itu akan menjadi makanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: bagi ternakmu
  rationale: בְּהֵמָה merujuk secara kolektif kepada hewan peliharaan milik orang yang disapa. “Ternak” alami dalam bahasa Indonesia dan membedakannya dari binatang liar yang disebut sesudahnya.
- source_word: לַחַיָּה
  choice: bagi binatang liar
  rationale: Dalam kontras dengan ternak, חַיָּה menunjuk kepada hewan yang tidak dipelihara. “Binatang liar” konkret, jelas, dan mudah dipahami.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: yang ada di negerimu
  rationale: Klausa relatif ini menerangkan binatang liar. “Negerimu” mempertahankan acuan kepada wilayah atau tanah tempat umat tinggal tanpa terdengar janggal dalam bahasa Indonesia modern.
- source_word: תִּהְיֶה
  choice: akan menjadi
  rationale: Bentuk היה menyatakan keadaan atau peruntukan yang berlaku. “Akan menjadi” mempertahankan nuansa instruksional dalam konteks tahun Sabat.
- source_word: כָּל תְּבוּאָתָהּ
  choice: seluruh hasil tanah itu
  rationale: תְּבוּאָה adalah hasil atau panen tanah, dan akhiran feminin -הּ mengacu kembali kepada הארץ. Penyebutan “tanah itu” membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: לֶאֱכֹל
  choice: menjadi makanan
  rationale: Infinitif dengan ל menyatakan tujuan atau kegunaan. “Menjadi makanan” alami setelah תִּהְיֶה dan menyampaikan bahwa hasil tersebut tersedia untuk dimakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat tetapi tetap mudah dipahami. Susunan paralel “bagi ternakmu dan bagi binatang liar” dipertahankan, sedangkan ungkapan penutup dibuat idiomatis tanpa menghilangkan makna peruntukannya sebagai makanan.
