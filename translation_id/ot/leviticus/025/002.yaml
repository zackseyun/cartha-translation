revisions:
- from: “Berbicaralah kepada umat Israel dan katakan kepada mereka, ‘Apabila kamu memasuki negeri yang Kuberikan kepadamu, negeri itu harus menjalani perhentian Sabat bagi Yahweh.[a]
  to: “Berbicaralah kepada orang-orang Israel dan katakanlah kepada mereka, ‘Ketika kamu memasuki tanah yang Aku berikan kepadamu, maka tanah itu harus menjalankan Sabat bagi Yahweh.[a]
  rationale: Revisi mengganti ungkapan yang tidak idiomatis dengan “menjalankan Sabat,” mempertahankan tanah sebagai subjek yang dipersonifikasikan dan Sabat sebagai tindakan yang dipersembahkan bagi Yahweh. “Ketika” mencerminkan fungsi temporal כִּי, dan “tanah” sesuai dengan konteks sabat atas tanah. Tanda kutip pembuka dipertahankan karena tuturan langsung berlanjut dalam ayat-ayat berikutnya.
