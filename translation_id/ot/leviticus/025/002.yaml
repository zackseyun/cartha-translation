source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: id
  text: “Berbicaralah kepada orang-orang Israel dan katakanlah kepada mereka, ‘Ketika kamu memasuki tanah yang Aku berikan kepadamu, maka tanah itu harus menjalankan Sabat bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tanah itu akan beristirahat, suatu Sabat bagi Yahweh.” Bahasa Ibrani mempersonifikasikan tanah sebagai pihak yang menjalankan Sabat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Imperatif piel ini menyampaikan perintah langsung kepada Musa dan secara wajar mengawali penyampaian ketetapan ilahi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan harfiahnya 'anak-anak lelaki Israel', tetapi dalam konteks ini menunjuk kepada komunitas Israel secara keseluruhan; 'umat Israel' alami, inklusif, dan tidak menghilangkan identitas kolektifnya.
- source_word: כִּי תָבֹאוּ
  choice: Apabila kamu memasuki
  rationale: כִּי berfungsi temporal dalam ketetapan ini, dan verba jamak mengacu kepada umat; 'apabila' mempertahankan nuansa peristiwa mendatang yang diharapkan.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: yang Kuberikan kepadamu
  rationale: Partisip נֹתֵן menggambarkan pemberian ilahi yang sedang atau segera diwujudkan; bentuk kini bahasa Indonesia menyampaikan hal itu dengan alami.
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: negeri itu harus menjalani perhentian Sabat
  rationale: Pilihan ini mempertahankan personifikasi negeri sebagai pelaku perhentian sekaligus hubungan etimologis antara verba שבת dan nomina שַׁבָּת.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan peruntukan atau pengabdian perhentian tersebut kepada Yahweh; nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai nama ilahi YHWH; 'Yahweh' mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Hubungan negeri dengan Sabat
  choice: negeri itu harus menjalani perhentian Sabat
  alternative: negeri itu harus beristirahat pada hari Sabat
  rationale: Teks tidak sekadar menyatakan istirahat pada satu hari, tetapi mempersonifikasikan negeri sebagai menjalani suatu perhentian sabat bagi Yahweh; terjemahan terpilih tidak mempersempitnya menjadi Sabat mingguan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Umat Israel' dipilih sebagai padanan kolektif yang alami bagi בְּנֵי יִשְׂרָאֵל. Kapitalisasi pronomina ilahi pada 'Kuberikan' mengikuti konvensi umum penerbitan Alkitab Indonesia. Tanda kutip pembuka dipertahankan karena ayat ini mengawali tuturan langsung yang berlanjut ke ayat berikutnya.
