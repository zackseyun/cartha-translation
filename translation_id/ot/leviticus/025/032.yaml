  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: id
  text: Mengenai kota-kota orang Lewi, orang Lewi memiliki hak penebusan untuk selamanya atas rumah-rumah di kota-kota milik pusaka mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “penebusan untuk selamanya akan ada bagi orang Lewi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  choice: Mengenai kota-kota orang Lewi
  rationale: Waw bersama frasa nominal menandai peralihan ke kasus hukum berikutnya. 'Mengenai' menyatakan peralihan topik secara alami, sedangkan 'orang Lewi' adalah sebutan baku dan mudah dipahami.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: rumah-rumah di kota-kota milik pusaka mereka
  rationale: Susunan konstruk Ibrani menunjuk pada rumah-rumah yang berada di kota-kota pegangan turun-temurun mereka. 'Milik pusaka' mempertahankan nuansa hukum dan warisan dalam אֲחֻזָּה tanpa menjadikannya sekadar kepemilikan biasa.
- source_word: גְּאֻלַּת עוֹלָם
  choice: hak penebusan untuk selamanya
  rationale: Dalam konteks hukum ini, nomina 'penebusan' bersama עוֹלָם menyatakan hak penebusan yang terus berlaku. Kata 'hak' dijelaskan oleh konteks legal, sedangkan 'untuk selamanya' mempertahankan daya ungkap temporal teks.
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: memiliki ... orang Lewi
  rationale: Secara harfiah frasa itu berarti 'akan ada bagi orang Lewi'. Dalam bahasa Indonesia, konstruksi kepunyaan 'orang Lewi memiliki hak' menyampaikan pihak yang memegang hak secara jelas dan alami.
theological_decisions:
- issue: Daya hukum klausul penebusan rumah-rumah orang Lewi
  choice: Orang Lewi memiliki hak penebusan yang terus berlaku atas rumah-rumah di kota milik pusaka mereka.
  alternative: Rumah-rumah itu dapat ditebus kapan saja oleh orang Lewi; atau secara lebih formal, 'penebusan untuk selamanya akan berlaku bagi orang Lewi.'
  rationale: Klausa nominal גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם menetapkan hak atau ketersediaan penebusan yang tetap. Terjemahan utama menyatakan daya hukum tersebut tanpa mengubahnya menjadi kewajiban untuk menebus; catatan kaki mempertahankan bentuk yang lebih dekat dengan struktur Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang tetap mudah dipahami. 'Milik pusaka' dipakai untuk nuansa kepemilikan turun-temurun; 'hak penebusan' menghindari kesan bahwa tindakan penebusan diwajibkan.
