base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: id
  text: Namun, jika seseorang tidak mempunyai penebus[a], lalu ia menjadi mampu[b] dan memperoleh cukup dana untuk penebusannya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penebus kerabat”. Kata Ibrani גֹּאֵל sering menunjuk kepada kerabat dekat yang memiliki hak atau kewajiban untuk menebus kembali milik keluarga.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tangannya mencapai”. Ungkapan Ibrani ini berarti bahwa kemampuan ekonominya menjadi cukup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Namun, jika seseorang
  rationale: Dalam rumusan hukum kasus ini, אִישׁ menunjuk pada seseorang sebagai pihak dalam perkara, sedangkan כִּי berfungsi kondisional. “Namun” menghubungkan kasus ini sebagai kemungkinan lain dari ayat sebelumnya.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: tidak mempunyai penebus
  rationale: גֹּאֵל ialah kerabat yang berhak atau berkewajiban membeli kembali harta keluarga. Istilah ringkas “penebus” dipertahankan, dengan nuansa kekerabatannya dijelaskan dalam catatan kaki.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: lalu ia menjadi mampu
  rationale: Ungkapan harfiah “tangannya mencapai” merupakan idiom tentang kemampuan atau kecukupan ekonomi. Terjemahan ini menyampaikan maknanya secara alami tanpa menghilangkan idiom sumber, yang dicatat dalam catatan kaki.
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: dan memperoleh cukup biaya untuk menebus kembali miliknya
  rationale: מָצָא dapat berarti menemukan atau memperoleh, sedangkan כְּדֵי menyatakan kecukupan. Dalam konteks hukum tanah, גְאֻלָּה adalah penebusan kembali milik yang telah dijual; “miliknya” menjaga rujukan tetap cukup umum sambil menyampaikan konteks ekonomi-hukumnya.
