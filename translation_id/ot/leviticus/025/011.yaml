source:
  edition: WLC
  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: id
  text: Itulah Tahun Yobel; tahun yang kelima puluh itu berlaku bagi kalian. Janganlah kalian menabur dan menuai hasil yang tumbuh dengan sendirinya, ataupun memetik buah anggur dari tanaman anggur yang dibiarkan tidak dipangkas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini secara harfiah berkaitan dengan tanaman anggur yang dibiarkan terpisah atau tidak dirawat; dalam konteks ini, maksudnya anggur dari tanaman anggur yang tidak dipangkas.
    reason: Menjelaskan nuansa leksikal נְזִרֶיהָ dan hubungannya dengan pemetikan anggur tanpa menghilangkan ambiguitas bentuknya.
lexical_decisions:
- source_word: יוֹבֵל
  choice: Tahun Yobel
  rationale: Dalam konteks Imamat 25, istilah ini menunjuk pada tahun khusus yang ditetapkan, bukan pada tanduk domba jantan. Bentuk baku Indonesia 'Yobel' dipakai sebagai nama lembaga tersebut.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: tahun yang kelima puluh
  rationale: Ungkapan alami dalam bahasa Indonesia untuk frasa Ibrani yang mengidentifikasi tahun itu sebagai tahun kelima puluh.
- source_word: תִּהְיֶה לָכֶם
  choice: harus menjadi tahun khusus bagi kalian
  rationale: Kata 'harus' menyampaikan daya ketetapan hukum, sedangkan 'bagi kalian' mempertahankan unsur datif. 'Tahun khusus' melengkapi predikat secara alami setelah Yobel disebut pada klausa sebelumnya.
- source_word: לֹא תִזְרָעוּ
  choice: Janganlah kalian menabur
  rationale: Bentuk larangan langsung alami dalam bahasa Indonesia dan sesuai dengan konteks hukum.
- source_word: לֹא תִקְצְרוּ
  choice: janganlah menuai
  rationale: Mempertahankan verba pertanian untuk panen tanaman dan membedakannya dari pemetikan anggur pada klausa berikutnya.
- source_word: סְפִיחֶיהָ
  choice: apa yang tumbuh dengan sendirinya di tanah itu
  rationale: Menunjuk pada hasil yang muncul tanpa penaburan. Bentuk deskriptif ini lebih mudah dipahami daripada istilah teknis dan sufiks feminin dipahami merujuk pada tanah.
- source_word: לֹא תִבְצְרוּ
  choice: ataupun memetik buah anggur
  rationale: Verba ini khusus berkaitan dengan panen anggur; 'memetik buah anggur' jelas dan idiomatis.
- source_word: נְזִרֶיהָ
  choice: tanaman anggurnya yang tidak dipangkas
  rationale: Dalam konteks pertanian, istilah ini menunjuk pada tanaman anggur yang dibiarkan tanpa dirawat atau dipangkas, bukan pada orang nazir.
theological_decisions:
- issue: Hubungan sintaksis antara 'Yobel' dan 'tahun yang kelima puluh'
  choice: 'Mempertahankan dua klausa: ''Itulah Tahun Yobel; tahun yang kelima puluh itu harus menjadi tahun khusus bagi kalian.'''
  alternative: '''Tahun yang kelima puluh itu harus menjadi Tahun Yobel bagi kalian.'''
  rationale: Teks Ibrani membuka dengan predikasi tersendiri, 'Yobel itulah,' lalu menyatakan apa yang harus berlaku bagi umat. Terjemahan dua klausa menjaga tekanan dan susunan tersebut tanpa melebur keduanya.
- issue: Makna נְזִרֶיהָ dalam konteks tahun Yobel
  choice: tanaman anggurnya yang tidak dipangkas
  alternative: anggurnya yang dibiarkan terpisah/dikhususkan
  rationale: Paralel pertanian dengan hasil yang tumbuh sendiri dan penggunaan verba khusus panen anggur mendukung pengertian tanaman anggur yang dibiarkan tidak dipangkas, sambil catatan kaki mengakui nuansa tidak dirawat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' dipakai karena pronomina Ibrani berbentuk jamak. Larangan diterjemahkan dengan 'janganlah' agar tegas tanpa terdengar arkais. Setiap penanda catatan kaki ditempatkan dalam teks utama.
