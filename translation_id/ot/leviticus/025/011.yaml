  naturalness: Susunan revisi tetap baku dan jelas dalam bahasa Indonesia modern. "Berlaku bagi kalian" menyampaikan fungsi frasa "akan menjadi bagi kalian" secara idiomatis dalam konteks ketetapan hukum, tanpa menambahkan kategori "khusus".
  terminology: '"Tahun Yobel", "menabur", "menuai", dan "memetik buah anggur" tepat. "Tanaman anggur yang dibiarkan tidak dipangkas" menyampaikan nuansa נְזִרֶיהָ dalam konteks pertanian tanpa mengidentifikasikannya secara berlebihan dengan salah satu kemungkinan bentuk objek.'
