  to: Itulah Tahun Yobel; tahun yang kelima puluh itu berlaku bagi kalian. Janganlah kalian menabur dan menuai hasil yang tumbuh dengan sendirinya, ataupun memetik buah anggur dari tanaman anggur yang dibiarkan tidak dipangkas.[a]
