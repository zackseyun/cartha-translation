base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: id
  text: Namun, jika ia tidak memiliki cukup sarana untuk mendapatkannya kembali, tanah yang dijualnya tetap berada pada pembelinya sampai tahun Yobel. Pada tahun Yobel tanah itu keluar dari tangan pembeli, dan ia kembali ke tanah miliknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan tanah itu kembali menjadi miliknya.” Verba Ibrani terakhir dapat dipahami dengan tanah yang dijual sebagai subjek, bukan penjualnya.
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ דֵּי
  choice: ia tidak mempunyai cukup uang
  rationale: Ungkapan harfiah ‘tangannya tidak memperoleh cukup’ merupakan idiom tentang kemampuan atau sumber daya. Dalam konteks penebusan tanah, ‘tidak mempunyai cukup uang’ menyampaikan maksudnya secara alami dan tepat.
- source_word: הָשִׁיב לוֹ
  choice: untuk membayar kembali kepada pembeli
  rationale: Dalam konteks hukum penebusan ini, yang dikembalikan kepada pihak yang memegang tanah ialah pembayaran penebusan. Penyebutan ‘pembeli’ memperjelas rujukan pronomina tanpa mengubah hubungan hukumnya.
- source_word: מִמְכָּרוֹ
  choice: tanah yang dijualnya itu
  rationale: Nomina ini dapat berarti penjualan atau barang yang dijual. Konteks ayat-ayat sebelumnya menunjukkan bahwa yang dimaksud ialah tanah milik warisan yang telah dijual.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: berada dalam kekuasaan pembelinya
  rationale: Ungkapan ‘di tangan’ menandakan penguasaan atau pemilikan. ‘Dalam kekuasaan’ mempertahankan nuansa hukum sumber sambil tetap wajar dalam bahasa Indonesia.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: Tahun Yobel
  rationale: Ini adalah istilah ringkas dan lazim dalam bahasa Indonesia untuk tahun khusus yang ditetapkan dalam pasal ini.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: Pada Tahun Yobel tanah itu harus dibebaskan
  rationale: Secara harfiah verba ini berarti ‘keluar’; dalam konteksnya tanah keluar dari kekuasaan pembeli. ‘Dibebaskan’ menyampaikan akibat hukum tersebut secara jelas tanpa memakai istilah teknis yang asing.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: lalu ia harus kembali ke tanah miliknya
  rationale: Subjek yang paling mungkin ialah penjual atau pemilik semula, sedangkan אֲחֻזָּה menunjuk tanah milik tetap atau warisan. Pilihan ini mempertahankan fokus personal dan pertanahan ayat.
theological_decisions:
- issue: Rujukan subjek וְשָׁב pada klausa terakhir
  choice: 'Pemilik semula menjadi subjek: ‘ia harus kembali ke tanah miliknya.’'
  alternative: 'Tanah yang dijual menjadi subjek: ‘tanah itu harus kembali menjadi miliknya.’'
  rationale: Bentuk maskulin tunggal secara tata bahasa dapat merujuk kepada pemilik semula ataupun benda yang dijual. Konteks hukum Yobel lebih mendukung kembalinya orang itu ke tanah milik warisannya, tetapi ambiguitas yang nyata dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang jelas dan bermartabat. Idiom yang akan terasa janggal bila diterjemahkan harfiah dialihkan menurut maknanya; istilah ‘Tahun Yobel’ dipertahankan sebagai istilah penting dalam konteks pasal.
