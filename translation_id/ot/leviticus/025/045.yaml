  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: id
  text: Kamu juga boleh membeli dari antara keturunan para pendatang yang tinggal di tengah-tengah kamu, serta dari keluarga mereka yang ada di tengah-tengah kamu—orang-orang yang mereka peranakkan di negerimu; mereka akan menjadi milik kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjadi bagi kamu sebagai milik.” Dalam konteks hukum ini, istilah tersebut menunjuk pada milik yang dapat diwariskan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... מֵהֶם תִּקְנוּ
  choice: Kamu juga boleh membeli dari antara
  rationale: Ungkapan ini melanjutkan sumber pembelian yang diizinkan pada ayat sebelumnya. Kata 'boleh' menyatakan daya permisif hukum dalam konteks, sedangkan 'membeli' mempertahankan arti komersial קנה.
- source_word: מִבְּנֵי הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: dari antara keturunan para pendatang yang tinggal di tengah-tengah kamu
  rationale: בני dapat berarti anak-anak atau keturunan; dalam konstruksi ini 'keturunan' lebih alami dan menghindari kesan bahwa hanya anak laki-laki yang dimaksud. Pasangan תושב dan גר menunjuk orang nonpribumi yang menetap di antara Israel.
- source_word: וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם
  choice: serta dari keluarga mereka yang ada di tengah-tengah kamu
  rationale: מִשְׁפָּחָה dapat berarti keluarga atau kaum; 'keluarga' jelas bagi pembaca modern dan sesuai dengan konteks garis keturunan.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: yaitu mereka yang dilahirkan di negeri kamu
  rationale: Hiphil הוליד secara harfiah berarti memperanakkan. Bentuk pasif Indonesia lebih alami di sini dan tetap menyampaikan bahwa orang-orang tersebut merupakan keturunan yang lahir di negeri Israel.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: mereka akan menjadi milik kamu
  rationale: אֲחֻזָּה berarti milik atau kepunyaan yang dikuasai, sering dengan sifat dapat diwariskan. 'Milik kamu' mempertahankan bahasa kepemilikan yang tegas tanpa menghaluskan status hukum yang digambarkan.
theological_decisions:
- issue: Bahasa pembelian dan kepemilikan manusia dalam hukum perbudakan
  choice: 'Memakai bahasa langsung: ''membeli'' dan ''menjadi milik kamu''.'
  alternative: Memakai ungkapan yang lebih lunak seperti 'memperoleh', 'menjadi hamba', atau 'berada dalam penguasaan kamu'.
  rationale: Teks Ibrani menggunakan istilah transaksi dan kepemilikan. Terjemahan tidak boleh mengaburkan kenyataan hukum yang keras dalam teks, ataupun menambahkan penilaian teologis yang tidak dinyatakan dalam ayat ini.
- issue: Cakupan בני dalam frasa מִבְּנֵי הַתּוֹשָׁבִים
  choice: Menerjemahkan 'keturunan'.
  alternative: Menerjemahkan secara lebih harfiah 'anak-anak lelaki'.
  rationale: Dalam konteks kelompok keluarga dan garis keturunan, בני berfungsi secara kolektif dan tidak harus membatasi rujukan pada laki-laki. 'Keturunan' menjaga cakupan yang mungkin dimaksud tanpa memaksakan pembatasan gender.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Sapaan jamak Ibrani dipertahankan dengan 'kamu', yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak; pengulangan 'di tengah-tengah kamu' menjaga hubungan dengan komunitas Israel tanpa memakai istilah arkais.
