  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: id
  text: Namun, pada tahun ketujuh harus ada sabat perhentian penuh bagi tanah itu, suatu sabat bagi Yahweh. Ladangmu jangan kautaburi, dan kebun anggurmu jangan kaupangkas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: Namun, pada tahun ketujuh
  rationale: Kata penghubung וּ dapat berarti “dan” atau menandai pertentangan. Karena ayat ini mengontraskan tahun ketujuh dengan enam tahun pengolahan pada ayat sebelumnya, “Namun” menyampaikan alur wacana secara alami.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: sabat perhentian penuh
  rationale: Gabungan kedua nomina ini memperkuat gagasan berhenti sepenuhnya. Terjemahan ini mempertahankan istilah “sabat” sekaligus daya intensif שַׁבָּתוֹן.
- source_word: יִהְיֶה לָאָרֶץ
  choice: tanah itu harus mendapat
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa perhentian tersebut “akan ada bagi tanah.” Bentuk ini alami dalam bahasa Indonesia dan tetap menampilkan tanah sebagai penerima perhentian.
- source_word: שַׁבָּת לַיהוָה
  choice: suatu sabat bagi Yahweh
  rationale: Preposisi ל menandai peruntukan atau pengabdian; “bagi” mempertahankan hubungan tersebut tanpa menentukan lebih jauh apakah tekanannya terutama pada manfaat, kepemilikan, atau pengudusan.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh,” sesuai bukti teks sumber dan lapisan konsultasi POB yang telah diperbarui.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: Ladangmu jangan kautaburi
  rationale: Bentuk larangan orang kedua tunggal dipertahankan secara ringkas dan wajar. “Menaburi” dalam konteks ladang berarti menaburkan atau menanam benih.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: dan kebun anggurmu jangan kaupangkas
  rationale: Dalam konteks kebun anggur, זמר berarti memangkas. Pengulangan bentuk larangan mencerminkan struktur paralel teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri perjanjian dan mengikuti keputusan teologis proyek yang diperbarui.
- issue: Arah hubungan dalam שַׁבָּת לַיהוָה
  choice: suatu sabat bagi Yahweh
  alternative: suatu sabat untuk Yahweh
  rationale: “Bagi” mempertahankan cakupan luas preposisi ל dan tidak mempersempit relasi itu menjadi sekadar manfaat atau tujuan praktis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk klitik “kautaburi” dan “kaupangkas” mempertahankan sapaan orang kedua tunggal serta gaya hukum yang ringkas tanpa terdengar terlalu arkais.
