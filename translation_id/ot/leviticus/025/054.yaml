base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: id
  text: Namun, jika ia tidak ditebus dengan cara-cara ini[a], ia dan anak-anak lelakinya akan keluar pada tahun Yobel bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan hal-hal ini”—merujuk pada ketentuan-ketentuan penebusan yang diuraikan dalam ayat-ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Meneruskan ketentuan sebelumnya sekaligus menandai pertentangan ringan dengan berbagai kemungkinan penebusan yang baru diuraikan.
- source_word: לֹא יִגָּאֵל
  choice: tidak ditebus
  rationale: Bentuk Nifal dari גאל menyatakan bahwa orang itu tidak memperoleh penebusan atau pembelian kembali menurut mekanisme hukum yang berlaku.
- source_word: בְּאֵלֶּה
  choice: dengan cara-cara ini
  rationale: Kata depan dan kata tunjuk ini merujuk kembali pada ketentuan-ketentuan penebusan dalam ayat-ayat sebelumnya; ungkapan ini wajar dalam bahasa Indonesia tanpa menghilangkan rujukan tersebut.
- source_word: וְיָצָא
  choice: harus keluar
  rationale: Secara harfiah berarti 'keluar'; dalam konteks pengabdian karena utang, tindakan itu merupakan keluarnya seseorang dari ikatan pelayanan. 'Harus' sesuai dengan corak ketentuan hukum.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: pada tahun Yobel
  rationale: Menggunakan istilah Indonesia yang lazim untuk יוֹבֵל dan mempertahankan penanda waktu hukum tersebut.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: ia dan anak-anak lelakinya yang menyertainya
  rationale: Mempertahankan kata ganti yang ditegaskan serta makna maskulin בָנָיו, sambil mengungkapkan עִמּוֹ secara alami sebagai orang-orang yang keluar bersamanya.
theological_decisions:
- issue: Istilah rumah tangga bergender בָנָיו
  choice: anak-anak lelakinya
  alternative: anak-anaknya
  rationale: Teks Ibrani memakai bentuk jamak maskulin yang secara eksplisit berarti anak-anak lelaki; terjemahan tidak memperluasnya secara diam-diam menjadi semua anak.
- issue: Makna keluarnya orang yang mengabdi
  choice: harus keluar
  alternative: harus dibebaskan
  rationale: Pilihan utama mempertahankan ungkapan konkret teks Ibrani tanpa menutup implikasi hukumnya, yakni berakhirnya ikatan pelayanan pada tahun Yobel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang tetap mudah dipahami. Istilah 'Yobel' dipertahankan sebagai istilah teknis kitab Imamat; susunan kalimat menjaga hubungan syarat-akibat serta ungkapan 'keluar' dari teks sumber.
