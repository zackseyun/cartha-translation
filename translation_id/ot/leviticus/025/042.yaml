  source_fidelity: Teks Indonesia secara tepat menyampaikan כִּי sebagai alasan, penegasan “mereka adalah hamba-hamba-Ku,” tindakan TUHAN membawa mereka keluar dari Mesir, dan larangan menjual mereka menurut cara penjualan budak. “Tidak boleh dijual” wajar untuk imperfect pasif dalam konteks hukum. “Sebagaimana budak dijual” menangkap idiom מִמְכֶּרֶת עָבֶד tanpa menambahkan rincian yang tidak ada dalam teks.
