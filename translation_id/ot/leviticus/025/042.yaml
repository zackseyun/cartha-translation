id: LEV.25.42
reference: Leviticus 25:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: id
  text: Sebab mereka adalah hamba-hamba-Ku[a], yang Kubawa keluar dari tanah Mesir. Mereka tidak boleh dijual sebagaimana budak dijual.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “hamba-hamba” juga dapat berarti “budak-budak”. Di sini ungkapan itu menegaskan bahwa orang Israel adalah milik TUHAN, yang telah membebaskan mereka dari Mesir.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka tidak boleh dijual dengan penjualan seorang budak”, yaitu melalui transaksi yang memperlakukan mereka sebagai budak biasa.
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi ketentuan sebelumnya dan mempertahankan daya penjelas dalam konteks hukum.
- source_word: עֲבָדַי הֵם
  choice: mereka adalah hamba-hamba-Ku
  rationale: Pronomina eksplisit הֵם memberi penekanan. 'Hamba-hamba-Ku' mempertahankan makna kepunyaan dan pengabdian kepada TUHAN, sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia; cakupan makna עֶבֶד dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: yang Kubawa keluar
  rationale: Menerjemahkan idiom keluaran secara langsung dan alami, dengan pelaku ilahi tetap dinyatakan dalam bentuk 'Ku-'.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Padanan langsung dan lazim untuk frasa geografis Ibrani tersebut.
- source_word: לֹא יִמָּכְרוּ
  choice: Mereka tidak boleh dijual
  rationale: Bentuk pasif dalam konteks hukum menyatakan larangan; 'tidak boleh' menyampaikan kekuatan normatifnya dengan bahasa Indonesia modern.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: sebagaimana budak dijual
  rationale: Menyampaikan cara atau jenis transaksi yang berlaku dalam penjualan budak, tanpa memakai ungkapan Indonesia yang kaku seperti 'dengan penjualan seorang budak'.
theological_decisions:
- issue: Makna עֶבֶד dalam hubungan Israel dengan TUHAN dan dalam transaksi manusia
  choice: hamba-hamba-Ku pada klausa pertama; budak pada klausa terakhir
  alternative: budak-budak-Ku pada klausa pertama dan budak pada klausa terakhir
  rationale: Kata Ibrani yang sama mencakup baik pengabdian/kepunyaan maupun status perbudakan. 'Hamba-hamba-Ku' merupakan ungkapan Indonesia yang wajar bagi hubungan Israel dengan TUHAN, sedangkan 'budak' pada larangan penjualan mempertahankan daya sosial-hukum ayat. Catatan kaki menjaga hubungan leksikal dan ketegangan maknanya agar perbedaan pilihan Indonesia tidak dianggap berasal dari dua istilah Ibrani yang berbeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang tetap mudah dipahami. 'Sebab' mempertahankan kaitan argumentatif; 'tidak boleh' lebih alami daripada bentuk legalistis yang terlalu kaku. Tanda [a] dan [b] ditempatkan langsung pada bagian teks yang dijelaskan.
