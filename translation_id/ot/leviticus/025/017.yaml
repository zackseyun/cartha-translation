  text: וְ/לֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת עֲמִית֔/וֹ וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: id
  text: Janganlah seorang pun berlaku tidak adil terhadap sesamanya[a]. Sebaliknya, hendaklah engkau takut akan Allahmu, sebab Akulah Yahweh, Allahmu sekalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merugikan sesamanya” atau “mengambil keuntungan secara tidak adil dari sesamanya.” Kata kerja Ibrani ini dapat menunjuk pada tindakan memperlakukan orang lain secara tidak adil dalam hubungan sosial atau transaksi ekonomi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: merugikan
  rationale: Dalam konteks hukum dan ekonomi ini, bentuk verba tersebut menunjuk pada tindakan memperlakukan orang lain secara tidak adil atau mengambil keuntungan darinya. “Merugikan” mempertahankan cakupan maknanya tanpa membatasinya hanya pada penindasan terbuka.
- source_word: אִישׁ אֶת עֲמִיתוֹ
  choice: seorang pun ... sesamanya
  rationale: אִישׁ berfungsi distributif, sedangkan עָמִית menunjuk kepada sesama atau rekan dalam komunitas. Ungkapan Indonesia ini alami dan tetap mencerminkan tanggung jawab setiap orang terhadap sesamanya.
- source_word: וְיָרֵאתָ
  choice: Sebaliknya, hendaklah engkau takut
  rationale: Konjungsi ו secara bentuk berarti “dan”, tetapi di sini mengontraskan perbuatan merugikan sesama dengan sikap takut kepada Allah. “Sebaliknya” menyatakan hubungan itu secara wajar dalam bahasa Indonesia.
- source_word: מֵאֱלֹהֶיךָ
  choice: akan Allahmu
  rationale: Sesudah verba ירא, preposisi מִן menandai objek rasa takut. Dalam bahasa Indonesia, bentuk idiomatisnya ialah “takut akan Allahmu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Akhiran pronomina jamak menyapa seluruh komunitas. “Kalian” mempertahankan perbedaan dari bentuk tunggal “Allahmu” dalam klausa sebelumnya.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memberi dasar bagi perintah tersebut, yakni identitas dan kewibawaan Yahweh sebagai Allah umat itu.
theological_decisions:
- issue: Penyajian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian YHWH secara langsung; transliterasi “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Peralihan sapaan tunggal dan jamak
  choice: “engkau/Allahmu” lalu “Allah kalian”
  alternative: Menyeragamkan seluruh sapaan menjadi “kalian”
  rationale: Teks Ibrani beralih dari perintah jamak dan unsur distributif kepada sapaan tunggal וְיָרֵאתָ ... אֱלֹהֶיךָ, lalu kembali ke bentuk jamak אֱלֹהֵיכֶם. Terjemahan mempertahankan peralihan tersebut sebagai ciri retoris-teologis teks.
- issue: Bahasa maskulin distributif אִישׁ
  choice: seorang pun
  alternative: seorang laki-laki pun
  rationale: Dalam konstruksi hukum ini אִישׁ berfungsi distributif (“masing-masing orang”), bukan menegaskan jenis kelamin pelaku. “Seorang pun” menyampaikan fungsi sumber dengan tepat tanpa mempersempit cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hendaklah” mempertahankan nada perintah hukum, sedangkan pasangan “engkau/Allahmu” dan “kalian” sengaja mempertahankan perubahan jumlah gramatikal dalam teks Ibrani.
