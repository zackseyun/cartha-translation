    issue: Kata utama "merugikan" berpotensi terlalu berfokus pada hasil kerugian.
    rationale: Hifil ינה dalam konteks ini menunjuk pada perlakuan tidak adil atau pengambilan keuntungan yang tidak patut dalam relasi sosial-ekonomi; tindakan itu tidak perlu dirumuskan semata-mata sebagai kerugian yang dialami pihak lain.
  - severity: medium
    issue: Alternatif catatan "mengambil keuntungan dari sesamanya" tidak menyatakan unsur ketidakadilan.
    rationale: Dalam bahasa Indonesia, mengambil keuntungan dapat bermakna netral atau sah. Unsur ketidakpatutan yang melekat pada verba Ibrani perlu dinyatakan.
  - severity: low
    issue: '"Allah kalian" kurang selaras dengan register baku-bermartabat dan dengan sapaan tunggal sebelumnya.'
    rationale: '"Allahmu sekalian" tetap menerjemahkan sufiks jamak אֱלֹהֵיכֶם, tetapi terdengar lebih alami dalam register terjemahan Alkitab.'
