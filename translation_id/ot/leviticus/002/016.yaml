revisions:
- from: Lalu imam harus membakar bagian peringatannya, yang diambil dari bulir-bulirnya yang ditumbuk dan dari minyaknya,[a] bersama seluruh kemenyannya, sebagai persembahan yang dibakar bagi Yahweh.
  to: Imam harus membakar bagian peringatan dari persembahan itu, yang diambil dari bulir-bulirnya yang ditumbuk[a] dan dari minyaknya, bersama seluruh kemenyannya, sebagai persembahan yang dibakar bagi Yahweh.
  rationale: Revisi ini hanya memperjelas konstruksi posesif bagi istilah ritual “bagian peringatan” dan memindahkan jangkar catatan kaki kepada frasa leksikal yang diterangkannya. Urutan dan cakupan unsur-unsur teks Ibrani tetap dipertahankan.
