base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: id
  text: Imam harus membakar bagian peringatan dari persembahan itu, yang diambil dari bulir-bulirnya yang ditumbuk[a] dan dari minyaknya, bersama seluruh kemenyannya, sebagai persembahan yang dibakar bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari biji-bijiannya yang ditumbuk kasar”; kata Ibrani ini menunjuk pada bulir atau biji-bijian yang dihancurkan untuk persembahan sajian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: harus membakar
  rationale: Dalam konteks kurban, bentuk Hifil dari קטר menunjuk pada pembakaran persembahan di mazbah sehingga asapnya naik. “Membakar” alami dan jelas dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi כהן dalam peraturan ibadah Israel.
- source_word: אַזְכָּרָתָהּ
  choice: bagian peringatannya
  rationale: Istilah teknis ini menunjuk pada bagian representatif dari persembahan sajian yang dibakar di mazbah sebagai peringatan. Terjemahan ini mempertahankan unsur ‘peringatan’ tanpa menjadikannya persembahan terpisah.
- source_word: מִגִּרְשָׂהּ
  choice: dari bulir-bulirnya yang ditumbuk
  rationale: גרש menunjuk pada biji-bijian atau bulir yang dihancurkan atau ditumbuk kasar. Ungkapan ini mudah dipahami dan sesuai dengan persembahan hasil pertama dalam konteks sebelumnya.
- source_word: וּמִשַּׁמְנָהּ
  choice: dan dari minyaknya
  rationale: Preposisi מן menunjukkan bahwa bagian yang dibakar diambil dari bulir yang ditumbuk dan dari minyak persembahan itu.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: bersama seluruh kemenyannya
  rationale: 'Dalam petunjuk kurban ini, על menyatakan penyertaan: bagian peringatan dibakar bersama seluruh kemenyan.'
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: אשה adalah istilah kurban bagi persembahan yang disajikan melalui api. Pilihan ini jelas dan tidak menimbulkan kesan bahwa persembahan tersebut adalah makanan bagi Allah.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan persembahan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan mengikuti keputusan proyek yang diberikan.
- issue: Makna אַזְכָּרָה dalam ritual persembahan sajian
  choice: bagian peringatan
  alternative: persembahan peringatan
  rationale: Bentuk posesif dan konteks menunjukkan suatu bagian dari keseluruhan persembahan, bukan persembahan lain yang berdiri sendiri. Terjemahan ini tidak menentukan secara berlebihan siapa yang diingatkan atau apa tepatnya fungsi teologis peringatan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan urutan tindakan ritual dalam bahasa Ibrani, sambil memakai ungkapan yang wajar bagi pembaca umum. Penanda catatan kaki [a] ditempatkan sesudah frasa yang dijelaskannya.
