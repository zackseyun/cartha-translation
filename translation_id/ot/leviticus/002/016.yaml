    reason: lexical_alternative
  revision_rationale: Revisi ini hanya memperjelas konstruksi posesif bagi istilah ritual “bagian peringatan” dan memindahkan jangkar catatan kaki kepada frasa leksikal yang diterangkannya. Urutan dan cakupan unsur-unsur teks Ibrani tetap dipertahankan.
