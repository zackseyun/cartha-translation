id: LEV.2.12
reference: Leviticus 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: id
  text: Sebagai persembahan hasil pertama[a], kamu boleh mempersembahkan benda-benda itu kepada Yahweh, tetapi benda-benda itu tidak boleh dinaikkan ke atas mazbah sebagai aroma yang menyenangkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai persembahan hasil pertama.”
    reason: Susunan Ibrani קָרְבַּן רֵאשִׁית dapat dinyatakan dengan sedikit perbedaan penekanan dalam bahasa Indonesia.
  - marker: b
    text: Secara harfiah, “tidak boleh naik ke mazbah sebagai aroma yang menyenangkan”; ini merupakan ungkapan ritual tentang persembahan yang dibakar di atas mazbah dan berkenan kepada Allah.
    reason: Menjelaskan gambaran harfiah dan fungsi idiom ritual tanpa menggantikannya dalam teks utama.
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: persembahan hasil pertama
  rationale: Ungkapan ini mempertahankan hubungan konstruksi Ibrani antara persembahan dan hasil yang pertama, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: תַּקְרִיבוּ
  choice: kamu boleh mempersembahkan
  rationale: 'Bentuk Hifil קרב dalam konteks ibadah berarti membawa atau mempersembahkan kepada Allah. Kata ''boleh'' menyampaikan nuansa izin dalam konteks: bahan-bahan tersebut dapat dipersembahkan, meskipun tidak dibakar di atas mazbah.'
- source_word: אֹתָם
  choice: semuanya itu
  rationale: Pronomina jamak ini merujuk pada bahan-bahan yang disebut dalam ayat sebelumnya, yaitu ragi dan madu. 'Semuanya itu' membuat rujukan jamaknya jelas tanpa menambahkan identifikasi ke dalam teks.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan persembahan, sedangkan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: tetapi semuanya itu tidak boleh dinaikkan ke atas mazbah
  rationale: Kata penghubung dipahami sebagai kontras. Terjemahan 'dinaikkan' mempertahankan gambaran harfiah עלה sambil memakai bentuk pasif yang alami bagi tindakan ritual membawa persembahan ke mazbah.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Terjemahan ini mempertahankan metafora ritual tentang aroma yang berkenan tanpa mengubahnya menjadi penjelasan teologis yang lebih eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian sebagai nama diri dan mengikuti lapisan konsultasi yang telah diaudit.
- issue: Makna ritual dari לא יעלו לריח ניחח
  choice: tidak boleh dinaikkan ke atas mazbah sebagai aroma yang menyenangkan
  alternative: tidak boleh dibakar di atas mazbah sebagai persembahan yang berkenan
  rationale: Pilihan utama mempertahankan citra 'naik' dan 'aroma' dalam bahasa sumber, sehingga tidak secara diam-diam menyelesaikan idiom itu menjadi penjelasan mengenai korban bakaran yang diterima.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Mazbah' dipertahankan sebagai istilah khusus bagi altar korban; struktur kalimat dibuat jelas bagi pembaca umum. Semua penanda catatan kaki terdapat dalam teks utama.
