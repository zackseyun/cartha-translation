revisions:
- from: Apa yang tersisa dari kurban sajian itu harus menjadi bagian Harun dan anak-anaknya. Itulah bagian yang mahakudus dari persembahan yang dibakar bagi Yahweh.[a]
  to: Sisa kurban sajian itu menjadi milik Harun dan anak-anaknya. Itu adalah bagian yang mahakudus dari persembahan bagi Yahweh yang dipersembahkan dengan api.[a]
  rationale: Revisi menghapus modalitas tambahan "harus" dan memakai "menjadi milik" untuk menyatakan peruntukan imam secara alami. Frasa mengenai persembahan dipertahankan sebagai kategori sumber bagi "bagian yang mahakudus," sambil menyampaikan nuansa api dari אִשֵּׁי dalam teks utama. Alternatif "persembahan makanan" dan "persembahan api" tetap dicatat pada penanda yang benar.
