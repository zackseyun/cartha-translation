  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: id
  text: Sisa kurban sajian itu menjadi milik Harun dan anak-anaknya. Itu adalah bagian yang mahakudus dari persembahan bagi Yahweh yang dipersembahkan dengan api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan makanan bagi Yahweh” atau “persembahan api bagi Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Apa yang tersisa
  rationale: Bentuk partisip berartikel berfungsi sebagai nomina dan menunjuk pada bagian kurban yang masih tersisa; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: מִן הַמִּנְחָה
  choice: dari kurban sajian itu
  rationale: Dalam Imamat 2, מִנְחָה adalah kurban berbahan hasil tanaman, terutama tepung; istilah baku dan ringkas 'kurban sajian' mempertahankan kategori ritual tanpa membatasinya secara keliru hanya pada biji-bijian utuh.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: harus menjadi bagian Harun dan anak-anaknya
  rationale: Preposisi לְ menyatakan peruntukan atau hak kepemilikan; 'menjadi bagian' menyampaikan pembagian kepada para imam secara jelas.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: bagian yang mahakudus
  rationale: Konstruksi intensif ini menunjukkan tingkat kekudusan tertinggi. Penambahan 'bagian' memperjelas bahwa yang dimaksud ialah sisa kurban, bukan ruang Mahakudus.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: dari persembahan yang dibakar bagi Yahweh
  rationale: אִשֶּׁה adalah istilah ritual bagi persembahan yang dipersembahkan melalui api. Terjemahan ini mempertahankan unsur api yang terdapat dalam akar dan konteksnya, sementara מִן menyatakan bahwa bagian tersebut berasal dari atau termasuk dalam persembahan demikian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Makna קֹדֶשׁ קָדָשִׁים
  choice: bagian yang mahakudus
  alternative: mahakudus; kudus dari segala yang kudus
  rationale: Pilihan ini mempertahankan klasifikasi ritual dengan tingkat kekudusan tertinggi serta menghindari kesan bahwa frasa tersebut menunjuk pada ruang Mahakudus.
- issue: Makna אִשֵּׁי יְהוָה
  choice: persembahan yang dibakar bagi Yahweh
  alternative: persembahan berupa makanan bagi Yahweh; persembahan api milik Yahweh
  rationale: Istilah Ibrani memiliki nuansa teknis dan dapat dipahami sebagai persembahan melalui api atau sebagai persembahan makanan bagi Allah. Teks utama mempertahankan unsur api, sedangkan catatan kaki mencatat alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kurban sajian' dipakai sebagai istilah ritual yang dapat dipahami pembaca umum; struktur dua kalimat menghindari kalimat panjang dan memperjelas rujukan frasa kekudusan.
