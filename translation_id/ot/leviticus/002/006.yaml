  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
translation:
  language: id
  text: Pecahkanlah itu menjadi pecahan-pecahan, lalu tuangkan minyak di atasnya[a]; itulah persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sufiks feminin tunggal dalam bahasa Ibrani merujuk kepada persembahan itu sebagai satu kesatuan, meskipun telah dipecahkan menjadi beberapa bagian.
    reason: referential_ambiguity
lexical_decisions:
- source_word: פָּת֤וֹת אֹתָ/הּ֙ פִּתִּ֔ים
  choice: Pecah-pecahkanlah itu menjadi potongan-potongan
  rationale: Infinitif absolut פָּתוֹת berfungsi sebagai perintah, sedangkan פִּתִּים menyatakan hasil berupa bagian-bagian kecil. Bentuk ulang 'pecah-pecahkanlah' menyampaikan tindakan membagi benda itu menjadi beberapa potong secara alami dalam bahasa Indonesia.
- source_word: וְ/יָצַקְתָּ֥
  choice: lalu tuangkan
  rationale: Bentuk perfek orang kedua tunggal maskulin dengan waw meneruskan urutan instruksi. 'Lalu' memperjelas bahwa penuangan dilakukan sesudah pemecahan tanpa menambahkan isi baru.
- source_word: עָלֶ֖י/הָ
  choice: ke atasnya
  rationale: Preposisi עַל dengan sufiks feminin merujuk kepada benda persembahan dan menunjukkan minyak dituangkan pada permukaannya.
- source_word: שָׁ֑מֶן
  choice: minyak
  rationale: Teks Ibrani hanya menyebut minyak; tidak ditambahkan 'zaitun' meskipun hal itu mungkin secara budaya.
- source_word: מִנְחָ֖ה
  choice: persembahan sajian
  rationale: Dalam konteks Imamat 2, מִנְחָה adalah istilah kultis bagi persembahan berbahan hasil tanaman. 'Persembahan sajian' merupakan padanan Indonesia yang mapan dan tidak membatasi bahan secara tidak perlu pada biji-bijian utuh.
- source_word: הִֽוא
  choice: itulah
  rationale: Pronomina mandiri menegaskan identitas benda yang baru dijelaskan sebagai persembahan sajian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan berwibawa. Imperatif '-lah' mempertahankan nada instruksional hukum ritual, sedangkan 'lalu' menyajikan urutan tindakan secara alami.
