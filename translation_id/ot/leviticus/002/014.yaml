  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: id
  text: Jika engkau mempersembahkan kepada Yahweh persembahan hasil pertama, persembahkanlah sebagai persembahan hasil pertamamu bulir-bulir muda yang dipanggang dalam api, yaitu biji-bijian segar yang ditumbuk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “biji-bijian muda yang dipanggang dalam api, biji-bijian dari panen baru yang ditumbuk.”'
    reason: Alternatif ini mencerminkan ketidakpastian leksikal dan hubungan sintaksis dalam אָבִיב קָלוּי בָּאֵשׁ גֶּרֶשׂ כַּרְמֶל.
lexical_decisions:
- source_word: מִנְחַת
  choice: persembahan
  rationale: Dalam Imamat 2, מִנְחָה menunjuk pada persembahan berbahan hasil bumi. Kata “persembahan” tetap alami ketika diterangkan oleh “hasil pertama” dan oleh bahan biji-bijian yang disebut sesudahnya.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: hasil pertama / hasil pertamamu
  rationale: Istilah ini menunjuk pada hasil yang mula-mula matang dan dipersembahkan kepada Allah. “Hasil pertama” jelas dalam bahasa Indonesia modern serta mempertahankan konteks pertanian dan ibadah.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”, sesuai bentuk nama diri dalam teks sumber.
- source_word: אָבִיב
  choice: bulir-bulir muda
  rationale: אָבִיב menunjuk pada biji-bijian yang masih segar atau muda dalam bulir. Pilihan ini mempertahankan gambaran pertanian tanpa menentukan jenis tanaman tertentu seperti gandum atau jelai.
- source_word: קָלוּי בָּאֵשׁ
  choice: yang dipanggang dalam api
  rationale: Frasa ini menyatakan cara pengolahannya, yakni dipanggang atau digarang dengan api. “Dipanggang dalam api” jelas dan dekat dengan bentuk Ibrani.
- source_word: גֶּרֶשׂ
  choice: yang ditumbuk
  rationale: Kata ini menunjuk pada biji-bijian yang dihancurkan atau ditumbuk. Bentuk verbal menghasilkan ungkapan Indonesia yang alami dan tidak memasukkan tingkat kehalusan yang tidak dinyatakan.
- source_word: כַּרְמֶל
  choice: biji-bijian segar
  rationale: Dalam konteks ini כַּרְמֶל menunjuk pada hasil atau biji-bijian segar dari panen baru, bukan nama tempat. Pilihan ini mempertahankan kesegaran hasil panen tanpa mempersempit artinya.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: mempersembahkan ... persembahkanlah
  rationale: Pengulangan bentuk kausatif קרב dipertahankan dengan verba ritual yang lazim dan mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri יהוה. “Yahweh” mempertahankan nama perjanjian itu secara langsung tanpa menggantinya dengan gelar.
- issue: Hubungan אָבִיב, גֶּרֶשׂ, dan כַּרְמֶל
  choice: bulir-bulir muda ... yaitu biji-bijian segar yang ditumbuk
  alternative: biji-bijian muda ... biji-bijian dari panen baru yang ditumbuk
  rationale: Susunan Ibrani padat dan hubungan antarnomina dapat dipahami secara agak berbeda. Teks utama memberi bentuk Indonesia yang wajar, sedangkan catatan kaki mempertahankan alternatif leksikal yang nyata tanpa memaksakan identifikasi tanaman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti tunggal “engkau” mempertahankan sapaan orang kedua tunggal. Istilah pertanian dibuat mudah dipahami tanpa menentukan spesies biji-bijian yang tidak dinyatakan dalam teks Ibrani.
