  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: id
  text: Engkau harus membawa kepada Yahweh[a] persembahan sajian yang dibuat dari bahan-bahan ini, lalu membawanya kepada imam dan mendekatkannya ke mazbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “bagi Yahweh”. Preposisi Ibrani dapat menyatakan peruntukan maupun arah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Engkau harus membawa
  rationale: Bentuk Hifil orang kedua tunggal dalam gaya hukum menyatakan kewajiban. “Harus membawa” terdengar alami dan tegas dalam bahasa Indonesia modern.
- source_word: הַמִּנְחָה
  choice: persembahan sajian
  rationale: Dalam Imamat 2, מִנְחָה menunjuk pada persembahan berbahan hasil tanaman, bukan persembahan umum. “Persembahan sajian” merupakan istilah kultis yang cukup luas untuk mencakup tepung, roti, atau olahan biji-bijian yang disebut dalam pasal ini.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: yang dibuat dari bahan-bahan ini
  rationale: Bentuk pasif יֵעָשֶׂה berarti “dibuat” atau “diolah”. “Bahan-bahan ini” mengacu secara alami pada jenis-jenis sajian yang baru saja disebut tanpa mempersempit rujukannya.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan “Yahweh”. Preposisi ל dapat menyatakan arah maupun peruntukan; “kepada” cocok dengan tindakan membawa sambil tetap membiarkan nuansa persembahan yang diperuntukkan bagi Yahweh.
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: Lalu orang itu harus menyerahkannya kepada imam
  rationale: Hifil קרב berarti membawa mendekat atau mempersembahkan. “Menyerahkan” menyatakan tahap ketika pembawa memberikan persembahan kepada imam dan membedakannya dari tindakan berikutnya di dekat mazbah. “Orang itu” mencerminkan peralihan gramatikal dari orang kedua ke orang ketiga.
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: dan imam harus membawanya mendekati mazbah
  rationale: Hifil נגשׁ berarti membawa mendekat. Konteks paling wajar menjadikan imam yang baru disebut sebagai pelaku tindakan ini. “Mendekati mazbah” mempertahankan arah gerak dan membedakan verba ini dari tindakan penyerahan sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri יהוה. “Yahweh” mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Subjek tindakan terakhir dalam urutan ritual
  choice: imam harus membawanya mendekati mazbah
  alternative: ia harus membawanya mendekati mazbah
  rationale: Bentuk verba hanya menandai orang ketiga maskulin tunggal, sehingga pronomina tersurat tidak ada. Nomina terdekat, “imam”, secara alami menjadi subjek tindakan terakhir, tetapi catatan kaki mengakui bahwa bahasa Ibraninya tidak mengulang subjek secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” mempertahankan sapaan tunggal dalam ketetapan hukum; “harus” menyampaikan daya perintah. Istilah “persembahan sajian” dan “mazbah” dipakai sebagai kosakata ibadah yang mapan, sedangkan susunan kalimat dibuat jelas bagi pembaca umum.
