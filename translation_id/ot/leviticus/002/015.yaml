  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: id
  text: Bubuhkanlah minyak di atasnya[a] dan letakkanlah kemenyan di atasnya; itu adalah korban sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berikanlah minyak di atasnya” atau “taruhlah minyak di atasnya.” Kata Ibrani ini bermakna luas, antara lain “memberikan”, “menaruh”, atau “membubuhkan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Tuangkanlah
  rationale: נתן bermakna luas, termasuk ‘memberikan, menaruh, membubuhkan’. Karena objeknya minyak dan arahnya ke atas persembahan, ‘tuangkanlah’ merupakan ungkapan Indonesia yang alami untuk tindakan ritual ini, tanpa menambahkan jenis minyak yang tidak dinyatakan.
- source_word: עָלֶיהָ
  choice: ke atasnya / di atasnya
  rationale: על dengan sufiks feminin tunggal menunjukkan bahwa minyak dan kemenyan dikenakan atau ditempatkan pada persembahan yang baru disebutkan.
- source_word: שֶׁמֶן
  choice: minyak
  rationale: Teks Ibrani hanya menyebut ‘minyak’; meskipun konteks dapat menunjuk pada minyak zaitun, jenisnya tidak dieksplisitkan di ayat ini.
- source_word: וְשַׂמְתָּ
  choice: dan taruhlah
  rationale: שׂים berarti ‘menaruh, menempatkan’. ‘Taruhlah’ alami dalam bahasa Indonesia dan menyampaikan tindakan penempatan yang disengaja.
- source_word: לְבֹנָה
  choice: kemenyan
  rationale: לְבֹנָה menunjuk secara khusus pada frankincense; ‘kemenyan’ adalah padanan Indonesia yang lazim dalam konteks Alkitab dan persembahan.
- source_word: מִנְחָה
  choice: kurban sajian
  rationale: Dalam hukum persembahan Imamat, מִנְחָה adalah persembahan berbahan hasil tanaman atau tepung, bukan sekadar pemberian umum. ‘Kurban sajian’ merupakan istilah Indonesia yang mapan dan tidak mempersempitnya menjadi biji-bijian utuh.
- source_word: הִוא
  choice: itulah
  rationale: Pronomina feminin tunggal mengidentifikasi benda yang baru dijelaskan sebagai kurban sajian. ‘Itulah’ mempertahankan predikasi ringkas dan wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk -lah mempertahankan daya instruksi ritual. Istilah ‘kurban sajian’ dipakai sebagai istilah kultis yang lazim; ‘minyak’ tidak diperluas menjadi ‘minyak zaitun’ karena ayat ini tidak menyatakannya.
