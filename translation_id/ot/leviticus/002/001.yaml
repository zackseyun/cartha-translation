id: LEV.2.1
reference: Leviticus 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: id
  text: “Apabila seseorang membawa persembahan sajian[a] kepada Yahweh, persembahannya harus berupa tepung halus[b]. Ia harus menuangkan minyak di atasnya dan menaruh kemenyan di atasnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Persembahan sajian” menerjemahkan istilah Ibrani מִנְחָה, yaitu persembahan dari bahan pangan; dalam ayat ini bahannya berupa tepung halus.
    reason: Catatan budaya dan leksikal untuk menjelaskan istilah peribadatan tanpa menyiratkan bahwa persembahan ini berupa biji-bijian mentah atau hewan sembelihan.
  - marker: b
    text: Atau “tepung bermutu halus.”
    reason: Menunjukkan bahwa סֹלֶת dapat menekankan baik kehalusan hasil olahan maupun mutu tepungnya.
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Dalam bahasa hukum dan peribadatan, kata ini menunjuk kepada seorang individu, bukan khusus kepada ‘jiwa’ sebagai unsur batin manusia. ‘Seseorang’ alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal perwakilan.
- source_word: תַקְרִיב
  choice: mempersembahkan
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau menyajikan sebagai persembahan. ‘Mempersembahkan’ menyampaikan tindakan peribadatan itu secara wajar.
- source_word: קָרְבַּן מִנְחָה
  choice: kurban sajian
  rationale: קָרְבַּן adalah sesuatu yang dibawa sebagai persembahan, sedangkan מִנְחָה dalam konteks Imamat menunjuk kepada persembahan hasil pangan. ‘Kurban sajian’ merupakan istilah ringkas yang sesuai dengan konteks ritual, sementara catatan kaki menjelaskan bahan sajian tersebut.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל diterjemahkan ‘kepada’, dan nama ilahi יהוה ditransliterasikan ‘Yahweh’ agar nama perjanjian dalam teks sumber tetap tampak.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Kata ini menunjuk kepada tepung bermutu yang digiling atau diolah halus untuk persembahan.
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: persembahannya harus berupa
  rationale: Klausa ini menetapkan bahan yang wajib dipakai. ‘Harus berupa’ menyatakan daya preskriptif hukum dengan alami dalam bahasa Indonesia.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: Ia harus menuangkan minyak ke atasnya
  rationale: Rangkaian verba dalam konteks hukum menyatakan tindakan yang diwajibkan. Akhiran feminin pada עָלֶיהָ merujuk kembali kepada sajian tersebut.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: dan menaruh kemenyan di atasnya
  rationale: לְבֹנָה adalah resin aromatik kemenyan yang dipakai dalam ibadah. ‘Menaruh ... di atasnya’ mencerminkan verba נתן dan frasa berpreposisi עַל secara jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. ‘Yahweh’ mempertahankan nama diri ilahi dan membedakannya dari gelar ‘Tuhan’.
- issue: Bentuk tunggal perwakilan dalam hukum
  choice: seseorang ... persembahannya ... ia
  alternative: siapa pun ... persembahan mereka ... mereka
  rationale: Bahasa Ibrani memakai bentuk tunggal dan akhiran orang ketiga maskulin tunggal. Bahasa Indonesia dapat mempertahankan ketunggalan itu tanpa menentukan jenis kelamin melalui ‘seseorang’, ‘-nya’, dan ‘ia’.
- issue: Arti kultis מִנְחָה
  choice: kurban sajian
  alternative: persembahan bahan pangan; persembahan biji-bijian; pemberian
  rationale: Secara lebih luas מִנְחָה dapat berarti pemberian atau upeti, tetapi dalam bagian hukum kurban ini istilah tersebut merupakan nama persembahan pangan. Terjemahan tidak menyempitkannya menjadi biji-bijian mentah karena ayat ini menetapkan tepung halus sebagai bahannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Apabila’ serta ‘harus’ sesuai dengan corak ketentuan hukum. Istilah ritual dijaga tetap ringkas, dengan penjelasan budaya ditempatkan dalam catatan kaki.
