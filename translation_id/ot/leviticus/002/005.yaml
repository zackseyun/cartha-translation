  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: id
  text: Jika persembahanmu berupa persembahan sajian yang dibuat di atas wajan datar[a], persembahan itu harus berupa tepung halus yang dicampur dengan minyak dan tidak beragi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "di atas panggangan datar". Istilah Ibrani ini menunjuk pada alat atau permukaan masak datar untuk menyiapkan persembahan sajian ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam Imamat 2, istilah ini menunjuk pada persembahan berbahan tepung atau hasil biji-bijian. 'Persembahan sajian' merupakan istilah Indonesia yang jelas dan lazim untuk konteks ritual ini.
- source_word: עַל הַמַּחֲבַת
  choice: yang dimasak di atas panggangan datar
  rationale: Frasa ini menunjuk pada penyiapan persembahan di atas permukaan masak yang datar. Penambahan 'yang dimasak' membuat hubungan frasa itu alami dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: קָרְבָּנְךָ
  choice: persembahanmu
  rationale: Istilah ini mempertahankan sapaan langsung orang kedua tunggal dan berfungsi sebagai sebutan umum bagi sesuatu yang dibawa untuk dipersembahkan.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah ini menunjuk pada tepung bermutu tinggi yang digiling halus dan menjadi bahan standar persembahan ini.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: dicampur dengan minyak
  rationale: Bentuk partisipelnya menyatakan bahwa tepung digabungkan dengan minyak tanpa menentukan teknik pencampuran secara lebih khusus.
- source_word: מַצָּה
  choice: tidak beragi
  rationale: Kata ini menerangkan keadaan persembahan, yakni tanpa ragi, bukan menyebut roti tidak beragi sebagai benda yang terpisah.
- source_word: תִהְיֶה
  choice: harus
  rationale: Bentuk imperfek dalam konteks hukum ini menyatakan persyaratan. 'Harus' menyampaikan daya preskriptifnya secara alami dalam bahasa Indonesia modern.
