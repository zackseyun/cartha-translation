  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: id
  text: Sisa persembahan sajian itu menjadi milik Harun dan anak-anaknya; sisa itu mahakudus, dari persembahan-persembahan yang dibakar bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan makanan bagi Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Apa yang tersisa
  rationale: Bentuk partisip berartikel dipakai secara substantival untuk menunjuk bagian persembahan yang masih tersisa. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan pelaku.
- source_word: מִן הַמִּנְחָה
  choice: dari persembahan sajian itu
  rationale: Dalam Imamat 2, מִנְחָה menunjuk persembahan berbahan hasil tanaman atau tepung. Istilah mapan 'persembahan sajian' mempertahankan cakupan ritualnya tanpa membatasinya hanya pada bulir gandum.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: menjadi bagian Harun dan anak-anaknya
  rationale: Preposisi לְ menandai peruntukan atau kepemilikan. Kata 'bagian' menjelaskan pembagian ritual yang tersirat dalam klausa nominal Ibrani.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: bagian yang mahakudus
  rationale: Konstruksi Ibrani ini merupakan ungkapan superlatif, yakni tingkat kekudusan tertinggi. 'Bagian' merujuk kembali pada sisa persembahan dan menghindari terjemahan harfiah 'kudus segala kudus' yang tidak alami.
- source_word: מֵאִשֵּׁי
  choice: dari persembahan yang dibakar
  rationale: אִשֶּׁה adalah istilah kurban yang secara tradisional dipahami sebagai persembahan yang diserahkan melalui api. Karena nuansa tepat istilah ini diperdebatkan, alternatif 'persembahan berupa makanan' dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Makna istilah kurban אִשֵּׁי יְהוָה
  choice: persembahan yang dibakar bagi Yahweh
  alternative: persembahan berupa makanan milik Yahweh
  rationale: Terjemahan utama mempertahankan hubungan tradisional istilah אִשֶּׁה dengan api, sedangkan catatan kaki menjaga kemungkinan leksikal bahwa istilah itu mengacu pada persembahan yang dipandang sebagai makanan bagi Allah. Preposisi dan konstruksi kepunyaan tidak dibuat lebih tegas daripada yang diperlukan.
- issue: Ungkapan superlatif קֹדֶשׁ קָדָשִׁים
  choice: bagian yang mahakudus
  alternative: mahakudus
  rationale: Penambahan 'bagian' hanya memperjelas acuan kepada sisa persembahan, bukan menciptakan kategori teologis baru. Tingkat superlatif Ibrani dipertahankan dengan 'mahakudus'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual 'persembahan sajian' dipakai secara konsisten; struktur klausa dibuat alami tanpa menghilangkan hubungan sisa persembahan dengan bagian imam dan statusnya yang mahakudus.
