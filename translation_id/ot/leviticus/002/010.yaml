revisions:
- from: Apa yang tersisa dari persembahan sajian itu menjadi bagian Harun dan anak-anaknya; itu merupakan bagian yang mahakudus dari persembahan yang dibakar bagi Yahweh.[a]
  to: Sisa persembahan sajian itu menjadi milik Harun dan anak-anaknya; sisa itu mahakudus, dari persembahan-persembahan yang dibakar bagi Yahweh.[a]
  rationale: Revisi memperbaiki idiom kepemilikan dan kelancaran kalimat, mempertahankan istilah ritual serta nama Yahweh, dan mencerminkan bentuk jamak istilah persembahan dalam teks sumber. Terjemahan utama tetap memakai pengertian tradisional yang berkaitan dengan api, sedangkan catatan kaki mempertahankan alternatif leksikal tanpa memaksakan kepastian atas istilah yang diperdebatkan.
