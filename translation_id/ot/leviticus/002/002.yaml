    issue: '"tepung terbaiknya" untuk סֹלֶת'
    rationale: '"Terbaik" dapat menyiratkan evaluasi umum. סֹלֶת secara lebih khusus menunjuk tepung halus; "tepung halusnya" lebih dekat pada istilah sumber dan lazim dalam register ritual.'
  - severity: low
    issue: '"bagian peringatannya"'
    rationale: Bentuk posesif ini kurang alami dalam bahasa Indonesia dan dapat terdengar seperti peringatan milik persembahan. "Bagian peringatan dari persembahan itu" menyampaikan istilah teknis secara lebih jelas tanpa menafsirkan fungsinya.
  - severity: low
    issue: '"sebagai persembahan dengan api"'
    rationale: Frasa ini kurang idiomatis setelah verba "membakar." "Sebagai persembahan yang dibakar" lebih lancar dan tetap mempertahankan kategori אִשֶּׁה.
