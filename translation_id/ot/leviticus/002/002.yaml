id: LEV.2.2
reference: Leviticus 2:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: id
  text: Ia harus membawanya kepada anak-anak Harun, para imam. Salah seorang imam harus mengambil dari sana segenggam penuh tepung halusnya dan sebagian minyaknya, beserta seluruh kemenyannya. Kemudian imam itu harus membakar bagian peringatan dari persembahan itu di atas mazbah sebagai persembahan yang dibakar[a], aroma yang menyenangkan bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan makanan.” Istilah Ibraninya dapat dipahami sebagai persembahan yang dipersembahkan dengan api atau sebagai persembahan makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Ia harus membawanya
  rationale: Bentuk Hifil dari בוא dengan objek feminin tunggal menunjuk pada tindakan membawa persembahan sajian; 'harus' sesuai dengan gaya ketentuan ritual dalam bahasa Indonesia.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: anak-anak Harun, para imam
  rationale: Mempertahankan hubungan keluarga dan keterangan aposisional bahwa mereka adalah para imam.
- source_word: וְקָמַץ מִשָּׁם מְלֹא קֻמְצוֹ
  choice: Salah seorang dari mereka harus mengambil dari sana segenggam penuh
  rationale: קמץ menggambarkan pengambilan dengan genggaman, sedangkan מִשָּׁם secara harfiah berarti 'dari sana'. Subjek dijelaskan secara alami sebagai salah seorang imam tanpa mengubah tindakan ritualnya.
- source_word: מִסָּלְתָּהּ וּמִשַּׁמְנָהּ
  choice: tepung terbaiknya dan sebagian minyaknya
  rationale: סֹלֶת adalah tepung bermutu tinggi yang khusus digunakan dalam persembahan. Kata 'sebagian' menjelaskan bahwa minyak yang diambil termasuk dalam porsi segenggam, bukan seluruh minyak.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: beserta seluruh kemenyannya
  rationale: Menunjukkan bahwa seluruh kemenyan disertakan, berbeda dengan tepung dan minyak yang hanya diambil sebagian.
- source_word: וְהִקְטִיר
  choice: harus membakar
  rationale: Dalam konteks kurban, bentuk Hifil קטר berarti membakar di mazbah sehingga persembahan naik sebagai asap.
- source_word: אַזְכָּרָתָהּ
  choice: bagian peringatannya
  rationale: Mempertahankan istilah ritual bagi bagian representatif dari persembahan yang dibakar di hadapan Allah, tanpa menentukan secara berlebihan siapa yang diingatkan atau apa yang diperingati.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran direktif pada kata 'mazbah' secara idiomatis menunjuk ke tempat tindakan pembakaran; 'di atas mazbah' alami dan tepat dalam konteks ritual.
- source_word: אִשֵּׁה
  choice: persembahan dengan api
  rationale: Istilah keimaman ini berkaitan dengan persembahan yang dibakar, tetapi mungkin juga mengandung citra makanan bagi Allah. Terjemahan utama mempertahankan kaitan formal dengan api, sedangkan alternatifnya dicatat.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Mengungkapkan idiom kurban tentang aroma yang berkenan atau menenangkan dengan bahasa Indonesia modern dan wajar.
- source_word: יהוה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang dinyatakan langsung dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna istilah ritual אִשֵּׁה
  choice: persembahan dengan api
  alternative: persembahan makanan
  rationale: Etimologi dan pemakaian istilah ini diperdebatkan antara kaitannya dengan api dan citra makanan persembahan. Teks utama mempertahankan unsur api yang jelas dalam konteks, sementara catatan kaki menjaga alternatif yang sungguh-sungguh mungkin.
- issue: Makna אַזְכָּרָה dalam persembahan sajian
  choice: bagian peringatan
  alternative: bagian pengingat
  rationale: Istilah teknis ini dapat menunjuk pada bagian yang membuat persembahan diingat di hadapan Allah, tetapi teks tidak menjelaskan mekanismenya. Terjemahan tidak menetapkan tafsiran teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'mazbah' dipertahankan karena merupakan istilah ritual yang ringkas dan dikenal luas. Pronomina feminin Ibrani diterjemahkan dengan akhiran '-nya' yang secara alami merujuk pada persembahan sajian. Penanda catatan kaki ditempatkan tepat setelah istilah אִשֵּׁה yang diterangkan.
