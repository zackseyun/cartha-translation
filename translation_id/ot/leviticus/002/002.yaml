  to: Ia harus membawanya kepada anak-anak Harun, para imam. Salah seorang imam harus mengambil dari sana segenggam penuh tepung halusnya dan sebagian minyaknya, beserta seluruh kemenyannya. Kemudian imam itu harus membakar bagian peringatan dari persembahan itu di atas mazbah sebagai persembahan yang dibakar[a], aroma yang menyenangkan bagi Yahweh.
