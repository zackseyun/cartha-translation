id: LEV.2.11
reference: Leviticus 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: id
  text: Setiap kurban sajian yang kamu persembahkan kepada Yahweh tidak boleh dibuat beragi, sebab kamu tidak boleh membakar ragi atau madu apa pun dari kurban itu sebagai persembahan yang dibakar[a] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan dengan api.” Istilah Ibrani ini menunjuk pada persembahan yang dipersembahkan di mezbah dengan pembakaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: kurban sajian
  rationale: Dalam konteks Imamat 2, istilah ini menunjuk pada persembahan berbahan tepung atau hasil biji-bijian. 'Kurban sajian' merupakan istilah Indonesia yang wajar dan cukup luas untuk mencakup berbagai bentuknya.
- source_word: תַּקְרִיבוּ
  choice: kamu persembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa mendekat atau mempersembahkan; 'persembahkan' alami dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: kepada/bagi Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'; preposisinya diterjemahkan sesuai fungsi kalimat.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: tidak boleh dibuat beragi
  rationale: Ungkapan ini melarang kurban sajian dipersiapkan dalam keadaan beragi, bukan hanya melarang penggunaan ragi komersial modern.
- source_word: שְׂאֹר
  choice: ragi
  rationale: Istilah ini menunjuk pada bahan pengembang atau biang adonan; 'ragi' adalah padanan Indonesia yang paling mudah dipahami.
- source_word: דְּבַשׁ
  choice: madu
  rationale: Makna dasarnya ialah madu, tetapi dalam pemakaian kuno dapat pula mencakup sari buah yang kental; keluasan ini dijelaskan dalam catatan kaki.
- source_word: לֹא תַקְטִירוּ
  choice: kamu tidak boleh membakar
  rationale: Dalam konteks ritual, kata ini berarti membuat sesuatu naik sebagai asap dengan membakarnya di mezbah.
- source_word: מִמֶּנּוּ
  choice: tidak dinyatakan tersendiri
  rationale: Pronomina tunggal ini secara harfiah berarti 'darinya'. Dalam susunan Indonesia, rujukannya kepada bahan kurban tersebut telah tersirat; menerjemahkannya secara mekanis akan menghasilkan kalimat yang janggal dan berpotensi menyesatkan.
- source_word: אִשֶּׁה
  choice: kurban bakaran
  rationale: Istilah teknis ini merujuk pada persembahan yang disajikan di mezbah dengan pembakaran. Alternatif yang lebih harfiah dicatat untuk menjaga keterlacakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Istilah kultis אִשֶּׁה
  choice: kurban bakaran
  alternative: persembahan dengan api
  rationale: '''Kurban bakaran'' menyampaikan bahwa persembahan itu dibakar di mezbah, sedangkan catatan kaki mempertahankan bentuk alternatif yang lebih harfiah. Istilah ini tidak dimaksudkan untuk menyamakan אִשֶּׁה dengan kategori khusus עֹלָה.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang lugas dan bermartabat. Bentuk jamak pada kata kerja Ibrani diterjemahkan dengan 'kamu' yang dapat dipahami secara kolektif. Semua penanda catatan kaki ditempatkan langsung setelah istilah terkait.
