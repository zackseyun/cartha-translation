base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: id
  text: Lalu imam harus mengangkat dari persembahan sajian itu bagian peringatan dan membakarnya di atas mezbah sebagai persembahan dengan api—aroma yang menyenangkan bagi TUHAN.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵרִים
  choice: harus mengangkat
  rationale: Bentuk Hifil dari רום di sini menggambarkan tindakan ritual imam mengambil dan mengangkat sebagian persembahan. Pilihan ini mempertahankan gambaran konkret teks Ibrani.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan wajar untuk כֹּהֵן dalam konteks ibadah Israel.
- source_word: מִן הַמִּנְחָה
  choice: dari persembahan sajian itu
  rationale: Dalam Imamat 2, מִנְחָה menunjuk pada persembahan berbahan hasil pertanian. 'Persembahan sajian' merupakan istilah yang ringkas, bermartabat, dan cukup luas untuk mencakup bentuk-bentuknya dalam pasal ini tanpa membatasinya pada biji-bijian utuh.
- source_word: אַזְכָּרָתָהּ
  choice: bagian peringatannya
  rationale: Dalam konteks korban, אַזְכָּרָה adalah bagian representatif yang dibakar di mezbah. Kata 'bagian' memperjelas bahwa bukan seluruh persembahan yang dimaksud, sedangkan 'peringatan' mempertahankan unsur leksikal זכר tanpa menentukan secara berlebihan fungsi teologisnya.
- source_word: וְהִקְטִיר
  choice: dan membakarnya
  rationale: Bentuk Hifil dari קטר dalam konteks korban berarti membakar bahan korban di mezbah sehingga naik sebagai asap. 'Membakarnya' alami dalam bahasa Indonesia dan objeknya jelas dari konteks.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mezbah
  rationale: Akhiran arah pada מִזְבֵּחַ merupakan bagian dari ungkapan ritual yang secara idiomatis berarti membakar persembahan di atas mezbah.
- source_word: אִשֵּׁה
  choice: persembahan dengan api
  rationale: Makna tepat istilah kultis ini diperdebatkan, tetapi dalam konteks ini jelas menunjuk pada persembahan yang dibakar. 'Persembahan dengan api' mempertahankan hubungan yang lazim dipahami dengan api dan menghindari penetapan makna 'makanan' sebagai satu-satunya tafsiran.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Ungkapan korban ini mempertahankan gambaran antropomorfis tentang aroma yang berkenan, tanpa menguraikannya menjadi pernyataan teologis yang lebih eksplisit daripada teks.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Nama ilahi יהוה diterjemahkan dengan bentuk tradisional 'TUHAN' dalam huruf kapital, yang jelas dan dikenal luas dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna istilah korban אִשֵּׁה
  choice: persembahan dengan api
  alternative: persembahan makanan
  rationale: Istilah ini dapat dipahami berdasarkan kaitannya dengan api atau sebagai persembahan makanan bagi Allah. Teks utama mempertahankan hubungan langsung dengan tindakan membakar yang disebut dalam ayat, sedangkan alternatif dicatat agar ambiguitas leksikal yang nyata tidak disembunyikan.
- issue: Fungsi אַזְכָּרָה dalam ritual
  choice: bagian peringatannya
  alternative: bagian pengingatnya / bagian tanda ingatannya
  rationale: Terjemahan ini mempertahankan gagasan 'mengingat/peringatan' serta menjelaskan bahwa yang dibakar hanyalah satu bagian. Terjemahan tidak menetapkan apakah bagian itu terutama membuat Allah mengingat si pemberi, mengingatkan si pemberi akan Allah, atau berfungsi sebagai wakil seluruh persembahan.
- issue: Nuansa רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan bagi TUHAN
  alternative: aroma yang menenteramkan bagi TUHAN
  rationale: '''Menyenangkan'' menyampaikan penerimaan ilahi sambil mempertahankan citra aroma. Pilihan ini tidak mengembangkan frasa tersebut menjadi teori tertentu tentang cara kerja korban.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan bernada khidmat. Istilah ritual 'persembahan sajian', 'bagian peringatan', dan 'mezbah' dipertahankan karena dikenal dalam ragam Alkitabiah Indonesia, sedangkan struktur kalimat dibuat alami bagi pembaca masa kini.
