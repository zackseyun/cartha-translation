  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: id
  text: 'Jika kamu mempersembahkan korban sajian yang dipanggang dalam tungku, korban itu harus terbuat dari tepung halus: roti tidak beragi yang dicampur dengan minyak, dan[a] roti tipis tidak beragi yang diolesi minyak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan”. Dalam konteks ini, kata penghubung Ibrani itu mungkin menyebutkan bentuk alternatif dari korban sajian yang dipanggang dalam tungku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Dalam rangkaian hukum kurban, bentuk ini memperkenalkan kasus bersyarat. Dalam bahasa Indonesia, “Jika” secara alami menyampaikan fungsi itu tanpa perlu mempertahankan waw pembuka secara kaku.
- source_word: תַקְרִב קָרְבַּן
  choice: kamu mempersembahkan kurban
  rationale: Hifil קרב berarti membawa mendekat atau menyajikan. Dalam konteks ritual, “mempersembahkan kurban” alami dan tetap menyatakan tindakan membawa kurban untuk disajikan.
- source_word: מִנְחָה
  choice: kurban sajian
  rationale: Di Imamat 2, istilah ini menunjuk kategori kurban yang bahan utamanya tepung dan minyak. “Kurban sajian” mempertahankan istilah kategori ritual tanpa menyempitkannya secara tidak perlu menjadi biji-bijian utuh.
- source_word: מַאֲפֵה תַנּוּר
  choice: yang dipanggang dalam tungku
  rationale: Frasa konstruksi ini menyatakan cara pengolahan. “Dipanggang dalam tungku” jelas dan idiomatis dalam bahasa Indonesia.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah ini menunjuk tepung bermutu yang digiling halus untuk persembahan.
- source_word: חַלּוֹת מַצּוֹת
  choice: roti bundar tidak beragi
  rationale: חַלּוֹת menunjuk roti atau kue berbentuk bundar, sedangkan מַצּוֹת menyatakan bahwa roti itu tidak beragi.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisipel pasif בלל menunjukkan minyak dicampurkan ke dalam adonan atau bahan.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: atau[a] roti tipis tidak beragi
  rationale: רְקִיקִים adalah roti atau kue tipis. Waw secara harfiah berarti “dan”, tetapi dalam daftar bentuk sajian ini mungkin menyatakan pilihan alternatif; ambiguitasnya dicatat dalam catatan kaki.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: yang diolesi minyak
  rationale: Dalam konteks makanan ritual, משׁח menggambarkan minyak yang dibubuhkan atau dioleskan pada permukaan; “diolesi” lebih konkret daripada “diurapi” tanpa menghilangkan tindakan dasarnya.
theological_decisions:
- issue: Makna מִנְחָה dalam konteks peribadatan
  choice: kurban sajian
  alternative: kurban gandum; persembahan pemberian
  rationale: Konteks Imamat 2 menetapkan kategori kurban berbahan tepung dan minyak. “Kurban sajian” menunjukkan kategori ritual dan menghindari kesan bahwa bahan yang dibawa selalu berupa bulir gandum.
- issue: Hubungan antara dua bentuk sajian yang dipanggang
  choice: atau, dengan catatan tekstual
  alternative: dan
  rationale: Waw Ibrani adalah “dan”, tetapi dua bentuk yang disebut kemungkinan merupakan pilihan. Terjemahan utama memakai hubungan alternatif yang alami, sambil mempertahankan bentuk harfiah dalam catatan kaki agar ambiguitas sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat konsisten dan mudah dipahami; struktur kalimat disederhanakan secara wajar tanpa menghapus rincian bentuk roti, minyak, atau ambiguitas kata penghubung.
