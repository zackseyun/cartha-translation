  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
translation:
  language: id
  text: Jika persembahanmu adalah persembahan sajian yang dibuat dalam bejana masak[a], persembahan itu harus dibuat dari tepung halus dengan minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wajan,” “wajan dalam,” atau “belanga”; jenis bejana yang dimaksud oleh istilah Ibrani ini tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Dalam bahasa Indonesia, “Jika” secara alami memperkenalkan kasus berikutnya dalam rangkaian ketentuan; unsur penghubung וְ tidak perlu diterjemahkan secara tersendiri.
- source_word: מִנְחַת
  choice: persembahan sajian
  rationale: Dalam Imamat 2, מִנְחָה menunjuk pada persembahan berbahan hasil olahan biji-bijian. “Persembahan sajian” merupakan istilah yang wajar dan tidak membatasi bahan itu pada butiran utuh.
- source_word: מַרְחֶשֶׁת
  choice: belanga
  rationale: Istilah Ibrani ini menunjuk pada bejana untuk memasak, tetapi bentuk tepatnya tidak pasti. “Belanga” menyampaikan bejana memasak yang cukup dalam tanpa memastikan rincian yang tidak dinyatakan teks.
- source_word: קָרְבָּנְךָ
  choice: persembahanmu
  rationale: קָרְבָּן adalah sesuatu yang dibawa mendekat sebagai persembahan; bentuk ini juga memuat akhiran orang kedua tunggal, sehingga diterjemahkan “persembahanmu”.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Padanan ini menyampaikan tepung bermutu yang digiling halus, bahan baku yang lazim bagi persembahan sajian.
- source_word: בַּשֶּׁמֶן
  choice: dengan minyak
  rationale: Preposisi בְּ di sini menyatakan bahan atau penyertaan dalam pengolahan. “Dengan minyak” mempertahankan keluasan ungkapan Ibrani tanpa menambahkan bahwa tepung itu pasti dicampur atau digoreng.
- source_word: תֵּעָשֶׂה
  choice: harus dibuat
  rationale: Bentuk pasif imperfek dalam konteks hukum menyatakan ketentuan mengenai cara pembuatannya. “Harus dibuat” mempertahankan makna pasif dan daya normatifnya.
