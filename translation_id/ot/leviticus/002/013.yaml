source:
  edition: WLC
  text: וְ/כָל קָרְבַּ֣ן מִנְחָתְ/ךָ֮ בַּ/מֶּ֣לַח תִּמְלָח֒ וְ/לֹ֣א תַשְׁבִּ֗ית מֶ֚לַח בְּרִ֣ית אֱלֹהֶ֔י/ךָ מֵ/עַ֖ל מִנְחָתֶ֑/ךָ עַ֥ל כָּל קָרְבָּנְ/ךָ֖ תַּקְרִ֥יב מֶֽלַח־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: id
  text: Setiap persembahan sajianmu harus kaububuhi garam.[a] Jangan sampai garam perjanjian Allahmu tidak ada pada persembahan sajianmu.[b] Bersama setiap persembahanmu, engkau harus mempersembahkan garam.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “harus kaugarami dengan garam,” yaitu pengulangan kata “garam” sebagai nomina dan verba dalam bahasa Ibrani.'
    reason: lexical_alternative
  - marker: b
    text: “Garam perjanjian Allahmu” merupakan ungkapan perjanjian yang dipertahankan secara harfiah; ayat ini tidak menjelaskan sendiri makna simbolisnya.
    reason: cultural_note
  - marker: c
    text: 'Atau: “Atas setiap persembahanmu, engkau harus mempersembahkan garam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן
  choice: persembahan
  rationale: Istilah kurban yang luas ini paling wajar diterjemahkan sebagai 'persembahan' dan sesuai pada kedua kemunculannya dalam ayat ini.
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam Imamat 2, istilah ini menunjuk pada persembahan berbahan hasil tanaman atau tepung. 'Persembahan sajian' mempertahankan istilah kultis yang lazim dalam bahasa Indonesia tanpa membatasinya secara keliru hanya pada biji-bijian utuh.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: harus kaububuhi garam
  rationale: Ungkapan Ibrani secara harfiah mengulang kata benda dan verba yang berakar pada 'garam'. Terjemahan ini menyampaikan kewajiban ritual tersebut secara alami, sedangkan bentuk harfiah dijelaskan dalam catatan.
- source_word: תַשְׁבִּית
  choice: jangan biarkan ... tidak ada
  rationale: Bentuk Hifil di sini berarti menyebabkan berhenti, meniadakan, atau membiarkan menjadi tidak tersedia. Rumusan ini jelas dalam bahasa Indonesia dan mempertahankan larangannya.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: garam perjanjian Allahmu
  rationale: Rangkaian nomina Ibrani dipertahankan tanpa menjelaskan secara berlebihan hubungan simbolis antara garam dan perjanjian.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: bersama setiap persembahanmu
  rationale: Preposisi עַל dapat berarti 'di atas/pada', tetapi dalam konteks ini juga menyatakan penyertaan garam pada setiap persembahan. 'Bersama' alami dan tidak menyiratkan bahwa garam selalu harus ditaruh secara fisik di atas semua jenis persembahan.
- source_word: תַּקְרִיב
  choice: engkau harus mempersembahkan
  rationale: Dalam konteks kurban, bentuk Hifil dari קרב berarti membawa mendekat atau mempersembahkan. 'Mempersembahkan' paling sesuai dengan laras kultis ayat ini.
theological_decisions:
- issue: Apakah ungkapan perjanjian harus dipertahankan secara harfiah atau dijelaskan simbolismenya
  choice: Mempertahankan 'garam perjanjian Allahmu' dalam teks utama
  alternative: garam yang melambangkan perjanjian Allahmu
  rationale: Teks Ibrani tidak menerangkan simbolismenya. Mempertahankan citra aslinya menghindari penetapan tafsir tertentu dan menjaga ketegangan teologis ayat.
- issue: Hubungan garam dengan setiap persembahan dalam klausa terakhir
  choice: Bersama setiap persembahanmu
  alternative: Di atas setiap persembahanmu
  rationale: עַל memungkinkan terjemahan yang lebih harfiah 'di atas/pada', tetapi konteks dapat menyatakan bahwa garam menyertai setiap persembahan. Alternatif harfiah dicatat agar ambiguitas sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk enklitik 'kaububuhi' dan 'Allahmu' dipakai agar ringkas dan alami. Istilah 'persembahan sajian' mempertahankan kekhususan kultis pasal ini. Catatan [a] memerlukan pembetulan tipografis dalam hasil publikasi menjadi “harus kaugarami dengan garam” apabila sistem tidak menormalkan spasi.
