  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam rumus pengantar ucapan ilahi, bentuk dari דבר paling wajar diterjemahkan sebagai “berfirman” dalam bahasa Indonesia; pilihan ini juga membedakannya dari לֵאמֹר yang memperkenalkan isi firman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri dan ditransliterasikan “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menerima firman; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Infinitif ini memperkenalkan isi ucapan yang menyusul. Dalam bahasa Indonesia modern, fungsi tersebut sudah tersirat secara alami oleh tanda koma dan kelanjutan kutipan pada ayat berikutnya; menerjemahkannya “demikian” akan menambahkan nuansa yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri YHWH. Bentuk “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. “Berfirman” dipakai sebagai ungkapan baku yang alami untuk ucapan Allah. Struktur ayat diperlancar tanpa menghilangkan fungsi pengantar menuju isi firman pada ayat berikutnya.
