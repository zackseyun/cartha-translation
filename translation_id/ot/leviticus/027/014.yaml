source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: id
  text: Apabila seseorang menguduskan rumahnya bagi Yahweh, imam harus menaksirnya, entah baik atau buruk[a]. Sebagaimana imam menaksirnya[b], demikianlah taksirannya itu berlaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “entah baik atau buruk” mengacu pada keadaan atau mutu rumah dalam penaksiran imam.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “sesuai dengan taksiran imam”; kata Ibrani yang sama untuk “menaksir” dipakai dua kali dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Apabila seseorang
  rationale: Ungkapan ini memperkenalkan suatu kasus hukum. “Seseorang” alami dalam bahasa Indonesia dan tidak membatasi penerapan hukum hanya pada laki-laki, meskipun bentuk Ibraninya tunggal maskulin.
- source_word: יַקְדִּשׁ
  choice: menguduskan
  rationale: Bentuk hifil dari קדשׁ berarti menjadikan atau menetapkan sesuatu sebagai kudus bagi penggunaan sakral; “menguduskan” mempertahankan hubungan leksikal dengan קֹדֶשׁ.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: Dalam konteks penaksiran harta, בַּיִת menunjuk pada rumah atau bangunan, bukan terutama suasana ‘kediaman’ atau ‘rumah tangga’.
- source_word: קֹדֶשׁ לַיהוָה
  choice: sebagai sesuatu yang kudus bagi Yahweh
  rationale: Frasa ini menyatakan status rumah yang dikhususkan bagi YHWH. Bentuk ini jelas dan tetap mempertahankan unsur ‘kudus’ dalam teks sumber.
- source_word: וְהֶעֱרִיכוֹ
  choice: imam harus menaksir nilainya
  rationale: Dalam Imamat 27, bentuk hifil ערך mengacu pada penilaian resmi oleh imam. “Menaksir nilainya” lebih jelas dalam bahasa Indonesia daripada sekadar “menilainya”.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: entah baik atau buruk
  rationale: Ungkapan ini mencakup keadaan atau mutu rumah yang menjadi dasar penaksiran, tanpa menentukan lebih lanjut ukuran penilaiannya.
- source_word: כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן
  choice: Sesuai dengan nilai yang ditetapkan imam
  rationale: Terjemahan ini menyampaikan bahwa penaksiran imam bersifat menentukan, sambil tetap mencerminkan pengulangan verba ערך.
- source_word: כֵּן יָקוּם
  choice: demikianlah nilai itu berlaku
  rationale: קום di sini merupakan ungkapan hukum bahwa penaksiran tersebut tetap sah atau mengikat. “Berlaku” menyampaikan daya hukumnya secara alami dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama perjanjian yang hadir langsung dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi dan selaras dengan lapisan konsultasi POB yang telah diperbarui.
- issue: Sifat penaksiran imam
  choice: demikianlah nilai itu berlaku
  alternative: demikianlah nilainya harus tetap
  rationale: Ungkapan כֵּן יָקוּם menyatakan bahwa penaksiran imam berdiri sebagai keputusan yang sah. Terjemahan tidak menambahkan penjelasan tentang penebusan atau kepemilikan yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa hukum-keagamaan yang modern dan bermartabat. Istilah “menaksir nilai” dipilih agar tindakan resmi imam mudah dipahami, sedangkan “berlaku” mempertahankan daya mengikat ungkapan hukum Ibrani tanpa terdengar kaku.
