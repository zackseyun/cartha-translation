base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: id
  text: '“Berbicaralah kepada orang Israel dan katakan kepada mereka: Apabila seorang laki-laki mengucapkan nazar khusus kepada Yahweh mengenai nilai taksiran orang-orang menurut penilaianmu,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Frasa Ibrani ini sulit. Terjemahan lain yang mungkin: “Apabila seorang laki-laki mengucapkan nazar khusus menurut penilaianmu atas orang-orang bagi Yahweh.” Ayat-ayat berikutnya menetapkan nilai taksiran bagi orang yang menjadi pokok nazar.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Bentuk imperatif piel ini merupakan rumusan penugasan ilahi yang baku; pilihan ini mempertahankan gaya resmi namun tetap alami dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi dalam rumusan perjanjian ini menunjuk kepada bangsa Israel secara keseluruhan; 'orang Israel' lebih alami dan tidak salah dipahami sebagai hanya keturunan laki-laki.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Teks Ibrani memakai nomina tunggal maskulin. Terjemahan mempertahankan bentuk gender sumber meskipun dalam hukum bentuk ini dapat berfungsi sebagai kasus perwakilan.
- source_word: יַפְלִא נֶדֶר
  choice: mengucapkan nazar khusus
  rationale: Hifil פלא menandai tindakan bernazar yang khusus atau luar biasa. 'Mengucapkan nazar khusus' menyampaikan tindakan formal tersebut dengan bahasa Indonesia yang wajar.
- source_word: בְּעֶרְכְּךָ
  choice: menurut penilaianmu
  rationale: Preposisi ב dan sufiks orang kedua tunggal dipertahankan. Frasa Ibraninya sulit, tetapi konteks ayat-ayat berikutnya menunjukkan nilai taksiran yang ditetapkan bagi orang-orang.
- source_word: נְפָשֹׁת
  choice: orang-orang
  rationale: Dalam konteks hukum ini, נְפָשׁוֹת menunjuk kepada pribadi manusia, bukan jiwa sebagai unsur tak berwujud.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: ל menyatakan arah atau peruntukan nazar, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama ilahi muncul langsung dalam teks dan dipertahankan sebagai nama diri 'Yahweh', tanpa menggantinya dengan gelar.
- issue: Bentuk hukum maskulin אִישׁ
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Pilihan utama mempertahankan bentuk tunggal maskulin sumber tanpa menyangkal bahwa rumusan hukum dapat memiliki fungsi perwakilan.
- issue: Hubungan sintaksis בְּעֶרְכְּךָ נְפָשֹׁת
  choice: mengenai orang-orang yang dinilai bagi Yahweh menurut penilaianmu
  alternative: menurut nilai taksiran orang-orang bagi Yahweh
  rationale: Susunan Ibrani sukar dan dapat dipahami dengan lebih dari satu cara. Terjemahan menghubungkan nazar itu dengan orang-orang yang dikenai nilai taksiran, sambil mempertahankan unsur orang kedua tunggal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang khidmat. Struktur dibuat cukup dekat dengan sumber, tetapi ungkapan 'orang Israel' dan 'orang-orang' dipilih agar alami serta jelas bagi pembaca masa kini.
