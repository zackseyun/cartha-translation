  terminology: “Yahweh,” “nazar,” dan “nilai taksiran” sesuai konteks. “Orang Israel” adalah padanan idiomatis yang tepat bagi בני ישראל; “seorang laki-laki” mempertahankan bentuk maskulin singular sumber.
