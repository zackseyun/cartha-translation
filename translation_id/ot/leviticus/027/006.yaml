translation_notes:
  register: Bahasa hukum yang modern, jelas, dan bermartabat. Istilah 'nilai taksiran' mempertahankan sifat teknis pasal ini, sedangkan 'syikal' dipertahankan sebagai satuan kuno. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau teologis yang perlu dijelaskan pada ayat ini.
