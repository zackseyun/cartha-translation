base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: id
  text: Jika orang itu berusia antara satu bulan dan lima tahun, nilai taksiranmu untuk laki-laki harus lima syikal perak, dan nilai taksiranmu untuk perempuan harus tiga syikal perak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ
  choice: dari satu bulan
  rationale: Ungkapan usia Ibrani ini secara harfiah berarti 'dari anak satu bulan'. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan batas bawah usia secara tepat.
- source_word: וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: sampai lima tahun
  rationale: Melanjutkan rentang usia dengan ungkapan Indonesia yang ringkas dan sesuai dengan ketepatan bahasa hukum.
- source_word: עֶרְכְּךָ
  choice: nilai taksiranmu
  rationale: Dalam Imamat 27, istilah ini menunjuk pada nilai resmi yang ditetapkan sehubungan dengan nazar. Sufiks orang kedua tunggal dipertahankan dengan '-mu'.
- source_word: הַזָּכָר
  choice: laki-laki itu
  rationale: Istilah Ibrani menggolongkan berdasarkan jenis kelamin tanpa memakai kata khusus usia seperti 'anak laki-laki'; bentuk ini sesuai dengan konteks rentang usia dan klasifikasi hukum.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: lima syikal perak
  rationale: Menyampaikan jumlah dan bahan alat pembayaran secara langsung, sambil mempertahankan satuan berat kuno 'syikal'.
- source_word: וְלַנְּקֵבָה
  choice: untuk perempuan itu
  rationale: Mempertahankan kesejajaran kategori jenis kelamin dengan frasa sebelumnya tanpa menggantinya dengan istilah khusus usia.
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: tiga syikal perak
  rationale: Terjemahan langsung dan konsisten dengan jumlah bagi laki-laki.
- source_word: וְהָיָה
  choice: harus
  rationale: Dalam konteks ketetapan hukum, bentuk ini membawa daya preskriptif; 'harus' menyatakannya secara alami dalam bahasa Indonesia modern.
