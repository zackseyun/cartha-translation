  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: id
  text: Namun, segala sesuatu yang diserahkan secara mutlak[a] oleh seseorang kepada TUHAN dari segala miliknya—entah manusia atau hewan, ataupun dari ladang milik pusakanya—tidak boleh dijual ataupun ditebus. Segala sesuatu yang diserahkan secara mutlak itu mahakudus bagi TUHAN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: ḥerem, istilah teknis untuk sesuatu yang diserahkan kepada TUHAN secara mutlak dan tidak dapat ditarik kembali. Dalam konteks tertentu, istilah ini juga dapat berarti ditempatkan di bawah larangan atau dikhususkan untuk dimusnahkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai peralihan yang membatasi atau mempertentangkan ketentuan ini dengan aturan sebelumnya mengenai hal-hal nazar yang dapat ditebus.
- source_word: חֵרֶם / יַחֲרִם
  choice: sesuatu yang diserahkan secara mutlak / diserahkan secara mutlak
  rationale: Mempertahankan hubungan antara nomina dan verba Ibrani serta menonjolkan sifat penyerahan yang tidak dapat dibatalkan, tanpa memasukkan makna pemusnahan ke dalam teks utama.
- source_word: אִישׁ
  choice: seseorang
  rationale: Dalam rumusan hukum ini bentuk maskulin tunggal berfungsi secara representatif; bahasa Indonesia tidak memiliki penanda gender gramatikal yang sepadan, sehingga 'seseorang' menyampaikan fungsi generiknya secara alami.
- source_word: לַיהוָה
  choice: kepada TUHAN / bagi TUHAN
  rationale: Mengikuti konvensi terjemahan nama ilahi YHWH sebagai 'TUHAN'; preposisi disesuaikan dengan fungsi kalimat dalam bahasa Indonesia.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: dari segala miliknya
  rationale: Menyampaikan cakupan sumber benda atau pihak yang diserahkan dengan ringkas dan alami.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: entah manusia atau hewan
  rationale: Mempertahankan pertentangan kategori manusia dan hewan dalam teks sumber tanpa mempersempit בְּהֵמָה menjadi hanya ternak.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: ataupun sebagian dari ladang milik pusakanya
  rationale: Kata 'sebagian' menyatakan daya partitif preposisi מִן, sedangkan 'milik pusaka' mempertahankan nuansa tanah warisan turun-temurun dari אֲחֻזָּה.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: tidak boleh dijual ataupun ditebus
  rationale: Menyampaikan larangan hukum dan mempertahankan istilah teknis penebusan yang dipakai sepanjang pasal ini.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Ungkapan superlatif Ibrani menyatakan tingkat kekudusan tertinggi; 'mahakudus' merupakan padanan Indonesia yang ringkas dan lazim dalam konteks keagamaan.
theological_decisions:
- issue: Makna חֵרֶם dalam konteks hukum ini
  choice: Disampaikan sebagai sesuatu yang 'diserahkan secara mutlak', yakni tidak dapat ditarik kembali.
  alternative: Sesuatu yang dikhususkan untuk dimusnahkan; sesuatu yang ditempatkan di bawah larangan.
  rationale: Kelompok kata חרם dapat mencakup pemusnahan dalam konteks tertentu, tetapi ayat ini sendiri menekankan bahwa yang diserahkan tidak dapat dijual atau ditebus dan bersifat mahakudus bagi TUHAN. Nuansa larangan atau pemusnahan tetap dicatat dalam catatan kaki.
- issue: Bahasa hukum maskulin generik pada אִישׁ
  choice: Diterjemahkan 'seseorang'.
  alternative: Seorang laki-laki.
  rationale: Maskulin tunggal Ibrani berfungsi generik dalam ketentuan hukum ini. Karena bahasa Indonesia tidak menandai gender gramatikal pada pronomina atau nomina tersebut, 'seseorang' mempertahankan fungsi sumber tanpa menambahkan penekanan biologis yang tidak dituntut konteks.
- issue: Penyebutan manusia di antara hal-hal yang dapat diserahkan
  choice: Kategori 'manusia' dipertahankan tanpa penjelasan tambahan dalam teks utama.
  alternative: Menafsirkan manusia sebagai budak, anggota rumah tangga, atau orang yang ditetapkan untuk dimusnahkan.
  rationale: Teks hanya menyebut אָדָם dan tidak menjelaskan status atau akibat khususnya dalam ayat ini. Terjemahan mempertahankan ketegangan dan ketidakjelasan tersebut daripada menetapkan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'diserahkan secara mutlak' dipilih untuk membedakan ḥerem dari nazar biasa yang dapat ditebus, sedangkan 'milik pusaka' mempertahankan corak hukum pertanahan Israel. Tanda pisah membantu pembaca mengikuti daftar kategori tanpa mengubah struktur argumentasi ayat.
