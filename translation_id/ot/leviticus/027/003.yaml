  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: id
  text: Nilai taksiranmu bagi laki-laki berusia dua puluh hingga enam puluh tahun haruslah lima puluh syikal perak, menurut syikal kudus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: nilai taksiranmu
  rationale: Dalam Imamat 27, עֵרֶךְ menunjuk pada jumlah yang ditetapkan dalam ketentuan nazar, bukan nilai hakiki seseorang. Bentuk dengan akhiran orang kedua dipertahankan melalui '-mu'.
- source_word: הַזָּכָר
  choice: laki-laki
  rationale: Istilah ini menandai kategori berjenis kelamin laki-laki dalam ketentuan penaksiran. 'Laki-laki' alami dalam bahasa Indonesia dan tidak menetralkan pembedaan yang terdapat dalam teks.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: yang berumur dua puluh sampai enam puluh tahun
  rationale: Ungkapan Ibrani menyatakan rentang usia; susunan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: lima puluh syikal perak
  rationale: Ungkapan tersebut menyebut jumlah menurut satuan berat dan logamnya. Istilah teknis 'syikal' dipertahankan.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Preposisi בְּ di sini menunjukkan standar pengukuran, sedangkan הַקֹּדֶשׁ merujuk pada standar resmi yang terkait dengan tempat kudus.
- source_word: וְהָיָה ... וְהָיָה
  choice: haruslah
  rationale: Dalam konteks hukum ini, bentuk tersebut menyampaikan ketetapan, bukan sekadar ramalan; 'haruslah' mengungkapkan daya preskriptifnya secara wajar.
theological_decisions:
- issue: Kategori penaksiran berdasarkan jenis kelamin
  choice: laki-laki
  alternative: seorang pria; orang laki-laki
  rationale: Ayat ini membedakan kategori penaksiran menurut jenis kelamin dan usia. Terjemahan mempertahankan kategori maskulin tanpa menjadikannya sebutan umum bagi manusia.
- issue: Makna עֵרֶךְ dalam Imamat 27
  choice: nilai taksiran
  alternative: nilai; penilaian
  rationale: Konteksnya adalah jumlah resmi yang ditetapkan sehubungan dengan nazar, bukan pernyataan tentang martabat pribadi ataupun harga pasar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur legal dipertahankan dengan 'haruslah', sementara rentang usia disampaikan secara alami. Tidak diperlukan catatan kaki karena frasa standar tempat kudus dapat diterjemahkan dengan jelas dalam teks utama.
