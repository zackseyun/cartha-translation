  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: id
  text: Jika orang yang menguduskan rumahnya itu hendak menebusnya[a], ia harus menambahkan seperlima dari nilai taksiranmu dalam perak pada nilai itu[b]. Dengan demikian, rumah itu menjadi miliknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jika orang yang mempersembahkan rumahnya itu hendak membelinya kembali.”'
    reason: lexical_alternative
  - marker: b
    text: Artinya, ia harus membayar nilai dalam perak yang telah ditaksir itu, ditambah seperlima dari nilai tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: orang yang menguduskan
  rationale: Bentuk partisipel dari קדשׁ menunjuk kepada orang yang mengkhususkan rumahnya sebagai kudus bagi TUHAN. 'Menguduskan' mempertahankan nuansa kultis dalam bahasa Indonesia yang wajar.
- source_word: יִגְאַל
  choice: menebusnya kembali
  rationale: Dalam konteks hukum-keagamaan ini, גאל berarti memperoleh kembali hak milik melalui pembayaran. Kata 'kembali' memperjelas arah tindakan tanpa mengubah maknanya.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: Terjemahan langsung dan tepat untuk objek properti yang dinilai dalam peraturan ini.
- source_word: וְיָסַף חֲמִישִׁית
  choice: harus menambahkan seperlima
  rationale: Rangkaian hukum ini menyatakan kewajiban setelah syarat terpenuhi; 'harus' menyampaikan daya wajib secara alami, sedangkan 'seperlima' mempertahankan bentuk pecahan sumber.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: nilai taksiranmu dalam perak
  rationale: Ungkapan ini mempertahankan כֶּסֶף sebagai perak sekaligus menyampaikan bahwa yang dimaksud ialah jumlah nilai hasil penaksiran. Sufiks orang kedua tunggal dipertahankan sebagai '-mu'.
- source_word: עָלָיו
  choice: menambahkan ... dari nilai taksiranmu
  rationale: Preposisi ini menyatakan tambahan di atas jumlah yang telah ditaksir; susunan Indonesia menyampaikan hubungan aditif tersebut secara alami.
- source_word: וְהָיָה לוֹ
  choice: rumah itu menjadi miliknya kembali
  rationale: Klausa menyatakan hasil kepemilikan setelah pembayaran penebusan. 'Kembali' dibuat eksplisit karena pemilik semula memperoleh lagi rumah yang telah dikuduskan.
theological_decisions:
- issue: Istilah kultis bagi rumah yang dikhususkan bagi Allah
  choice: menguduskan
  alternative: mempersembahkan; mengkhususkan sebagai kudus
  rationale: '''Menguduskan'' mempertahankan hubungan leksikal dengan קדשׁ dan sifat sakral tindakan tersebut tanpa memasukkan ajaran denominasi tertentu.'
- issue: Sifat penebusan properti
  choice: menebusnya kembali
  alternative: membelinya kembali
  rationale: '''Menebus'' mempertahankan istilah hukum-sakral גאל, sementara ''kembali'' menjelaskan pemulihan kepemilikan tanpa mereduksinya menjadi transaksi dagang biasa.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur syarat-hasil dibuat alami; istilah 'menguduskan' dan 'menebus' mempertahankan corak hukum-sakral Imamat 27. Semua penanda catatan kaki muncul dalam teks utama.
