  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: id
  text: Namun, jika orang itu benar-benar menebusnya[a], ia harus menambahkan seperlima kepada nilai taksiranmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menebusnya” atau “sungguh-sungguh menebusnya”; bahasa Ibrani memakai infinitif absolut yang diikuti verba finit untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Gabungan konjungsi dan syarat ini melanjutkan ketentuan sebelumnya dengan nuansa kontras; “Namun, jika” alami dalam bahasa Indonesia.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: orang itu benar-benar menebusnya
  rationale: Infinitif absolut yang diikuti verba finit menegaskan tindakan menebus. “Benar-benar” mempertahankan penekanan itu, sedangkan akhiran feminin tunggal merujuk pada hewan yang dibicarakan sebelumnya.
- source_word: וְיָסַף
  choice: ia harus menambahkan
  rationale: Dalam konteks hukum, bentuk ini menyatakan konsekuensi yang diwajibkan. “Harus menambahkan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: חֲמִישִׁתוֹ
  choice: seperlima
  rationale: Kata ini menyatakan bagian sebesar satu per lima. Teks Ibrani tidak mengulang objek yang menjadi dasar perhitungan, sehingga terjemahan tidak menambahkannya secara eksplisit.
- source_word: עַל עֶרְכֶּךָ
  choice: pada nilai yang kautetapkan
  rationale: עַל menyatakan tambahan atas jumlah penilaian, sedangkan sufiks orang kedua tunggal pada עֶרְכֶּךָ dipertahankan dengan “yang kautetapkan,” yakni penilaian oleh imam dalam konteks ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum secara wajar. Subjek “orang itu” dipakai agar rujukan pelaku jelas; “ia” menghindari pengulangan. Penekanan bentuk Ibrani dipertahankan melalui “benar-benar,” dengan alternatif dicatat dalam catatan kaki.
