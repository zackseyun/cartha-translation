  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: id
  text: Namun, jika ia menguduskan ladangnya sesudah Tahun Yobel[a], imam harus menghitung jumlah uang baginya berdasarkan tahun-tahun yang masih tersisa sampai Tahun Yobel, dan jumlah itu harus dikurangkan dari nilai taksiranmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesudah Yobel.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan nilainya harus dikurangi dari nilai taksiranmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: sesudah Tahun Yobel
  rationale: אַחַר menyatakan urutan waktu, sedangkan הַיֹּבֵל menunjuk pada tahun atau pranata Yobel. 'Tahun Yobel' jelas dan wajar dalam bahasa Indonesia.
- source_word: יַקְדִּישׁ
  choice: menguduskan
  rationale: Dalam konteks Imamat 27, קדשׁ berarti menetapkan sesuatu sebagai kudus bagi TUHAN; 'menguduskan' mempertahankan makna kultisnya.
- source_word: שָׂדֵהוּ
  choice: ladangnya
  rationale: 'Bentuk ini adalah konstruksi posesif orang ketiga tunggal laki-laki: ladang miliknya.'
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: imam harus menghitung jumlah uang baginya
  rationale: חשב dalam konteks hukum berarti menghitung atau memperhitungkan, dan הַכֶּסֶף menunjuk pada jumlah uang yang dinilai.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: berdasarkan tahun-tahun yang masih tersisa
  rationale: Ungkapan עַל־פִּי berarti 'berdasarkan' atau 'menurut', dengan jumlah nilai disesuaikan terhadap sisa tahun.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: sampai Tahun Yobel
  rationale: Frasa ini menyatakan batas akhir bagi tahun-tahun yang dipakai dalam perhitungan.
- source_word: וְנִגְרַע
  choice: harus dikurangkan
  rationale: Bentuk Nifal גרע di sini menyatakan pengurangan dari nilai patokan dalam konteks moneter dan hukum.
- source_word: מֵעֶרְכֶּךָ
  choice: dari nilai taksiranmu
  rationale: עֶרְכְּךָ adalah nilai yang ditaksir dengan akhiran orang kedua tunggal; '-mu' mempertahankan sapaan hukum langsung dalam bahasa Ibrani.
theological_decisions:
- issue: Akhiran orang kedua tunggal pada מֵעֶרְכֶּךָ
  choice: dari nilai taksiranmu
  alternative: dari nilai taksiran itu
  rationale: Teks Ibrani memakai akhiran orang kedua tunggal. Mempertahankan '-mu' menjaga gaya sapaan hukum dan kaitannya dengan ketentuan penaksiran sebelumnya.
- issue: Istilah kultis untuk יַקְדִּישׁ
  choice: menguduskan
  alternative: mempersembahkan
  rationale: '''Menguduskan'' mempertahankan gagasan menetapkan ladang sebagai kudus tanpa mempersempit tindakan itu menjadi pemberian biasa.'
- issue: Rujukan הַיֹּבֵל
  choice: Tahun Yobel
  alternative: Yobel
  rationale: Penambahan 'Tahun' mengungkapkan rujukan temporal yang tersirat dan menghasilkan bahasa Indonesia yang jelas tanpa mengubah pranata yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan corak hukum serta urutan logis teks Ibrani, tetapi memakai ungkapan moneter yang alami bagi pembaca masa kini.
