  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: id
  text: Semua nilai taksiranmu harus dihitung menurut syikal tempat kudus[a]; satu syikal sama dengan dua puluh gera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut syikal kudus.” Bahasa Ibrani menunjuk pada standar syikal yang digunakan untuk penilaian yang berkaitan dengan tempat kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: nilai taksiranmu
  rationale: Dalam Imamat 27, עֵרֶךְ menunjuk pada nilai resmi yang ditetapkan bagi orang atau benda sehubungan dengan nazar. Frasa ini mempertahankan arti teknis serta akhiran orang kedua tunggal.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Ungkapan ini menunjuk pada syikal sebagai standar resmi yang dipakai untuk penilaian terkait tempat kudus, bukan sekadar pada sebuah syikal yang memiliki sifat moral 'kudus'.
- source_word: גֵּרָה
  choice: gera
  rationale: Gera adalah satuan kecil berat atau nilai tanpa padanan alami dalam bahasa Indonesia, sehingga namanya ditransliterasikan.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: satu syikal sama dengan dua puluh gera
  rationale: Klausa ini mendefinisikan besaran satu syikal. Susunan Indonesia ini alami dan menyampaikan hubungan ukurannya dengan jelas.
- source_word: וְכָל
  choice: Setiap
  rationale: 'Kata ''setiap'' menyampaikan cakupan distributif: masing-masing nilai taksiran harus memakai standar yang sama. Konjungsi Ibrani tidak perlu diterjemahkan secara mekanis karena ayat ini merupakan kelanjutan langsung dalam konteks.'
- source_word: יִהְיֶה
  choice: harus ditetapkan
  rationale: Bentuk imperfek pertama berfungsi preskriptif dalam konteks hukum. 'Harus ditetapkan' menyatakan kewajiban secara wajar dalam bahasa Indonesia.
