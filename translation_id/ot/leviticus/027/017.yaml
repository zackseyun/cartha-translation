- from: Jika ia menguduskan ladangnya sejak tahun Yobel[a], nilai yang kautetapkan itu tetap berlaku.
  to: Jika ia menguduskan ladangnya mulai tahun Yobel[a], nilai yang kautetapkan itu tetap berlaku.
