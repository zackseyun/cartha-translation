  - marker: a
    text: 'Atau: “menetapkan ladangnya sebagai kudus.” Kata kerja Ibrani berarti menetapkan sesuatu sebagai kudus.'
    reason: lexical_alternative
  revision_rationale: The revision makes the temporal force of “from the year of jubilee” more precise in Indonesian and refines the lexical alternative so that it retains the Hebrew cultic meaning without importing the narrower idea of a sacrificial offering.
