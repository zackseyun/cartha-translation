  text: אִם מִ/שְּׁנַ֥ת הַ/יֹּבֵ֖ל יַקְדִּ֣ישׁ שָׂדֵ֑/הוּ כְּ/עֶרְכְּ/ךָ֖ יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: id
  text: Jika ia menguduskan ladangnya mulai tahun Yobel[a], nilai yang kautetapkan itu tetap berlaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menetapkan ladangnya sebagai kudus.” Kata kerja Ibrani berarti menetapkan sesuatu sebagai kudus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel syarat yang secara alami memperkenalkan ketentuan hukum dalam bahasa Indonesia.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: sejak tahun Yobel
  rationale: Preposisi מִן menunjukkan titik awal waktu; 'sejak' menyampaikan bahwa penilaian dihitung mulai dari tahun Yobel.
- source_word: יַקְדִּישׁ
  choice: menguduskan
  rationale: Bentuk Hifil dari קדשׁ berarti menjadikan atau menetapkan sesuatu sebagai kudus; pilihan ini mempertahankan dimensi sakral dari tindakan tersebut.
- source_word: שָׂדֵהוּ
  choice: ladangnya
  rationale: Padanan langsung dan alami bagi nomina dengan sufiks kepunyaan orang ketiga tunggal.
- source_word: כְּעֶרְכְּךָ
  choice: nilai yang kautetapkan itu
  rationale: Mengungkapkan hasil penilaian oleh orang kedua tunggal, yakni imam dalam konteks hukum pasal ini, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: יָקוּם
  choice: tetap berlaku
  rationale: Dalam konteks hukum-administratif, קום menyatakan bahwa suatu penetapan sah dan terus berlaku.
theological_decisions:
- issue: Kata kerja kultis untuk penetapan ladang sebagai kudus
  choice: menguduskan
  alternative: mempersembahkan
  rationale: '''Menguduskan'' menjaga makna bahwa ladang itu ditetapkan sebagai kudus tanpa mempersempit tindakan tersebut menjadi jenis persembahan tertentu.'
translation_notes:
  register: Bahasa hukum yang ringkas dan bermartabat, tetapi tetap alami bagi pembaca Indonesia modern. 'Yobel' dipertahankan sebagai istilah baku untuk lembaga tahun pembebasan Israel.
