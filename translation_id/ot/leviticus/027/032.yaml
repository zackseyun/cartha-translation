base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: id
  text: Dan setiap persepuluhan dari kawanan sapi dan kambing-domba—yakni setiap hewan kesepuluh yang lewat di bawah tongkat[a]—harus menjadi kudus bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “staf.” Ungkapan ini merujuk pada penghitungan ternak satu demi satu ketika mereka lewat di bawah tongkat penggembala.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מַעְשַׂר
  choice: Dan setiap persepuluhan
  rationale: Mempertahankan istilah hukum bagi sepersepuluh yang dikhususkan, dengan cakupan distributif וְכָל.
- source_word: בָּקָר וָצֹאן
  choice: dari kawanan sapi maupun kawanan kambing domba
  rationale: בָּקָר menunjuk ternak besar, khususnya sapi, sedangkan צֹאן merupakan istilah kolektif yang mencakup domba dan kambing; penyebutan keduanya menghindari penyempitan makna.
- source_word: כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: setiap ... yang lewat di bawah tongkat
  rationale: Mencerminkan cara ternak dihitung satu demi satu ketika melewati tongkat gembala.
- source_word: הָעֲשִׂירִי
  choice: hewan kesepuluh
  rationale: Secara harfiah berarti 'yang kesepuluh'; kata 'hewan' ditambahkan secara wajar karena nomina yang dimaksud tersirat dalam bahasa Ibrani.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: harus menjadi kudus
  rationale: Menjaga konstruksi predikatif dan daya wajib dari ketentuan hukum, tanpa mengganti kategori 'kudus' dengan tafsiran yang lebih sempit.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan peruntukan atau kepemilikan dalam rumusan pengudusan; nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi, bukan menggantinya dengan gelar.
- issue: Makna status קֹדֶשׁ
  choice: kudus bagi Yahweh
  alternative: dipersembahkan kepada Yahweh; dikhususkan bagi Yahweh
  rationale: '''Kudus'' mempertahankan kategori teologis dan hukum dalam teks, termasuk gagasan bahwa hewan itu menjadi milik atau peruntukan Yahweh, tanpa mereduksinya menjadi satu tindakan ritual tertentu.'
- issue: Nomina tersirat pada הָעֲשִׂירִי
  choice: hewan kesepuluh
  alternative: yang kesepuluh
  rationale: Penambahan 'hewan' menjernihkan rujukan yang sudah tersedia dalam konteks ternak dan tidak menambahkan gagasan baru.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa “kawanan kambing domba” dipakai sebagai istilah kolektif yang mencakup kedua jenis ternak dalam צֹאן. Penanda “yaitu” memperjelas bahwa bagian berikut menerangkan cara menentukan persepuluhan, bukan menyebut kewajiban tambahan.
