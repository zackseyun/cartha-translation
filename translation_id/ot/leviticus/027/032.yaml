revisions:
- from: Dan setiap persepuluhan dari kawanan sapi maupun kawanan kambing domba, yaitu setiap hewan kesepuluh yang lewat di bawah tongkat[a], harus menjadi kudus bagi Yahweh.
  to: Dan setiap persepuluhan dari kawanan sapi dan kambing-domba—yakni setiap hewan kesepuluh yang lewat di bawah tongkat[a]—harus menjadi kudus bagi Yahweh.
  rationale: Revisi mempertahankan seluruh unsur pokok teks Ibrani dan penjelasan implisit bahwa hewan kesepuluh ditetapkan melalui proses penghitungan di bawah tongkat. Istilah kolektif bagi ternak dibuat lebih alami dalam bahasa Indonesia, dan catatan kaki diperbaiki agar tidak memberi alternatif yang secara budaya dan semantis menyesatkan.
