source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: id
  text: Namun, jika seseorang menguduskan bagi Yahweh ladang yang dibelinya[a], yang bukan bagian dari tanah milik pusakanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ladang pembeliannya”; maksudnya, ladang yang diperoleh dengan membeli, berbeda dari tanah pusaka leluhurnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menandai kasus bersyarat yang berlanjut dari ketentuan sebelumnya sekaligus memberi sedikit kontras.
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: ladang yang dibelinya
  rationale: Mengungkapkan secara alami bahwa ladang itu diperoleh melalui pembelian, bukan sebagai warisan.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: yang bukan bagian dari tanah milik pusakanya
  rationale: Menjaga pembedaan hukum antara tanah yang dibeli dan tanah turun-temurun; 'bagian dari' menyampaikan fungsi מִן secara wajar dalam bahasa Indonesia.
- source_word: יַקְדִּישׁ
  choice: menguduskan
  rationale: Dalam konteks nazar dan hukum Imamat 27, kata ini berarti menetapkan sesuatu sebagai kudus bagi Allah.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan penerima pengudusan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna אֲחֻזָּה dalam hukum pertanahan
  choice: tanah milik pusaka
  alternative: tanah miliknya
  rationale: Istilah ini menunjuk pada kepemilikan tanah turun-temurun, sehingga perlu dibedakan dari ladang yang diperoleh melalui pembelian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa hukum-keagamaan. 'Seseorang' dipakai untuk menyatakan subjek maskulin generik Ibrani secara alami. Koma akhir dipertahankan karena ayat ini merupakan anak kalimat yang dilanjutkan dalam ayat berikutnya.
