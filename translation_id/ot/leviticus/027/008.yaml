  text: וְ/אִם מָ֥ךְ הוּא֙ מֵֽ/עֶרְכֶּ֔/ךָ וְ/הֶֽעֱמִיד/וֹ֙ לִ/פְנֵ֣י הַ/כֹּהֵ֔ן וְ/הֶעֱרִ֥יךְ אֹת֖/וֹ הַ/כֹּהֵ֑ן עַל פִּ֗י אֲשֶׁ֤ר תַּשִּׂיג֙ יַ֣ד הַ/נֹּדֵ֔ר יַעֲרִיכֶ֖/נּוּ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: id
  text: Namun, jika orang itu terlalu miskin untuk membayar nilai yang kautetapkan[a], ia harus dihadapkan kepada imam, lalu imam akan menetapkan nilainya. Imam harus menetapkan nilainya sesuai dengan kemampuan orang yang mengucapkan nazar itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “miskin dibandingkan dengan nilai yang kautetapkan.” Maksudnya, ia tidak mampu membayar nilai tersebut.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “menurut apa yang dapat dijangkau tangan orang yang mengucapkan nazar.” Ini merupakan ungkapan Ibrani yang berarti kemampuan ekonominya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ ... מֵעֶרְכֶּךָ
  choice: terlalu miskin untuk membayar nilai yang kautetapkan
  rationale: מָךְ menyatakan keadaan ekonomi yang lemah, sedangkan מִן dalam konteks ini menunjukkan bahwa orang tersebut tidak sanggup memenuhi nilai yang telah ditentukan. Ungkapan ini menyampaikan maksudnya secara alami dalam bahasa Indonesia sambil mempertahankan sufiks orang kedua tunggal pada עֶרְכֶּךָ.
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  choice: ia harus dihadapkan kepada imam
  rationale: Bentuk Hifil dari עמד berarti ‘membuat berdiri’ atau ‘menghadapkan’. Konstruksi pasif bahasa Indonesia mempertahankan ketidakjelasan pelaku dalam teks Ibrani dan cocok dengan prosedur hukum yang dimaksud.
- source_word: וְהֶעֱרִיךְ אֹתוֹ ... יַעֲרִיכֶנּוּ
  choice: imam akan/harus menetapkan nilainya
  rationale: Dalam Imamat 27, ערך merupakan istilah teknis untuk menentukan nilai uang bagi orang yang dinazarkan. ‘Menetapkan nilainya’ jelas, wajar, dan menjaga pengulangan verba sumber.
- source_word: עַל פִּי
  choice: sesuai dengan
  rationale: Ungkapan ini memperkenalkan dasar atau patokan yang dipakai imam dalam menentukan nilai.
- source_word: אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר
  choice: sesuai dengan kemampuan orang yang mengucapkan nazar itu
  rationale: Secara harfiah, teks berbicara tentang apa yang dapat ‘dijangkau tangan’ pengucap nazar, sebuah idiom Ibrani bagi kemampuan ekonomi. ‘Kemampuan’ menyampaikan makna itu dengan alami.
- source_word: הַנֹּדֵר
  choice: orang yang mengucapkan nazar itu
  rationale: Partisipel ini menunjuk kepada orang yang membuat nazar. Pilihan tersebut mudah dipahami dan menghindari istilah teknis yang kaku.
theological_decisions:
- issue: Pelaku tindakan menghadapkan orang itu kepada imam tidak disebutkan dalam teks Ibrani.
  choice: Menggunakan bentuk pasif ‘ia harus dihadapkan’.
  alternative: ‘Ia harus menghadap imam’ atau ‘orang itu harus membawanya menghadap imam’.
  rationale: Bentuk pasif tidak menentukan pelaku yang tidak dinyatakan oleh teks dan tetap mempertahankan sifat prosedural ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum-keagamaan yang tetap mudah dipahami. Istilah ‘nazar’ dipertahankan sebagai istilah Alkitab yang lazim; ‘menetapkan nilainya’ digunakan secara konsisten untuk verba teknis ערך.
