id: LEV.27.21
reference: Leviticus 27:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: id
  text: Namun, ketika ladang itu dilepaskan pada Tahun Yobel, ladang itu akan menjadi kudus bagi Yahweh, seperti ladang yang dikhususkan secara mutlak[a]; ladang itu akan menjadi milik imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti ladang yang berada di bawah larangan.” Istilah Ibrani ini menunjuk pada sesuatu yang diserahkan secara tidak dapat ditarik kembali kepada Yahweh dan dikeluarkan dari pemakaian manusia biasa; dalam konteks tertentu, hal itu dapat mencakup pemusnahan.
    reason: Menjaga keluasan makna חֵרֶם dan alternatif tradisional tanpa memaksakan unsur pemusnahan pada konteks hukum tanah ini.
lexical_decisions:
- source_word: וְהָיָה
  choice: Namun, ... akan menjadi
  rationale: Konjungsi ini meneruskan ketentuan hukum dengan nuansa kontras terhadap kemungkinan penebusan pada ayat sebelumnya; bentuk mendatang menyatakan hasil pada Tahun Yobel.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: ketika ladang itu dilepaskan pada Tahun Yobel
  rationale: Secara harfiah berarti 'ketika ia keluar pada Yobel', tetapi dalam konteks hukum pertanahan ungkapan ini menunjuk pada pelepasan atau peralihan tanah saat Yobel.
- source_word: קֹדֶשׁ לַיהוָה
  choice: kudus bagi Yahweh
  rationale: Mempertahankan rumusan pengudusan kepada YHWH dan menerjemahkan nama ilahi sebagai nama diri, Yahweh.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: seperti ladang yang dikhususkan secara mutlak
  rationale: חֵרֶם menyatakan sesuatu yang diserahkan secara tidak dapat ditarik kembali dan dikeluarkan dari pemakaian biasa. Dalam konteks ladang yang menjadi milik imam, ungkapan ini mempertahankan sifat mutlaknya tanpa menyatakan bahwa ladang itu sendiri harus dimusnahkan.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: ladang itu akan menjadi milik imam
  rationale: Lamed menunjukkan penyerahan atau kepemilikan, sedangkan אֲחֻזָּה adalah tanah milik atau pegangan turun-temurun. Susunan ini alami dalam bahasa Indonesia dan menyampaikan hasil hukumnya.
theological_decisions:
- issue: Makna חֵרֶם dalam hukum kekudusan
  choice: dikhususkan secara mutlak
  alternative: dikhususkan untuk dimusnahkan; berada di bawah larangan
  rationale: Istilah ini dapat berkaitan dengan pemusnahan dalam konteks tertentu, tetapi inti semantiknya adalah penyerahan yang tidak dapat ditarik kembali kepada Allah. Karena ayat ini menetapkan ladang tersebut sebagai milik imam, terjemahan utama tidak menambahkan pemusnahan yang tidak dinyatakan secara eksplisit di sini; catatan kaki menjaga alternatif tradisional dan cakupan maknanya.
- issue: Penerjemahan יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri Ibrani dipertahankan secara transparan sebagai Yahweh, selaras dengan lapisan konsultasi POB, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “ladang itu” dipertahankan demi kejelasan rujukan dalam rumusan hukum. “Tahun Yobel” memakai istilah Alkitab Indonesia yang lazim.
