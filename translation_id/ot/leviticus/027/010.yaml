  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: id
  text: Ia tidak boleh menggantinya atau menukarkannya[a], yang baik dengan yang buruk atau yang buruk dengan yang baik. Jika ia benar-benar menukar seekor hewan dengan hewan lain[b], hewan itu beserta penggantinya akan menjadi kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai dua kata kerja yang berhubungan tetapi berbeda, yang di sini diterjemahkan “mengganti” dan “menukarkan”.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani menegaskan kata kerjanya; secara harfiah dapat dipahami, “jika ia sungguh-sungguh menukar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: menggantinya
  rationale: Bentuk hifil dari חלף di sini menunjuk pada penggantian hewan yang telah dipersembahkan dengan hewan lain; pilihan ini juga membedakannya dari verba berikutnya.
- source_word: יָמִיר אֹתוֹ
  choice: menukarkannya
  rationale: מוּר dalam konteks hukum ini berarti menukar seekor hewan dengan hewan lain. 'Menukarkan' alami dalam bahasa Indonesia dan mempertahankan pola dua verba yang berbeda.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: yang baik dengan yang buruk atau yang buruk dengan yang baik
  rationale: Kata sifat Ibrani dipakai secara substantival, sedangkan ב menandai objek pertukaran; rumusan ini mempertahankan kontras hukum dengan jelas.
- source_word: וְאִם הָמֵר יָמִיר
  choice: jika ia benar-benar menukar
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan pada tindakan. 'Benar-benar' menyampaikan intensifikasi itu secara wajar.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: seekor hewan dengan hewan lain
  rationale: Ungkapan ini menyatakan pertukaran satu hewan dengan hewan lainnya secara jelas dan idiomatis.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: hewan itu dan penggantinya, keduanya
  rationale: Kata ganti menunjuk kepada hewan semula, sedangkan תְּמוּרָה menunjuk kepada hewan pengganti; 'keduanya' memperjelas bahwa status berikut berlaku bagi dua hewan.
- source_word: קֹדֶשׁ
  choice: menjadi kudus
  rationale: Dalam hukum nazar/persembahan, קֹדֶשׁ menyatakan status yang dikhususkan bagi Allah. 'Menjadi kudus' langsung, bermartabat, dan sesuai dengan konstruksi predikatif Ibrani.
theological_decisions:
- issue: Status hewan semula dan hewan pengganti sesudah pertukaran yang dilarang
  choice: Hewan semula dan hewan pengganti sama-sama menjadi kudus.
  alternative: Hanya hewan pengganti yang menjadi kudus, atau ayat ini sekadar menyatakan pertukaran itu tidak sah.
  rationale: Frasa 'hewan itu dan penggantinya ... menjadi kudus' secara gramatikal memberikan status kudus kepada keduanya. Terjemahan mempertahankan akibat ganda ini tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang lugas dan bermartabat. Bentuk 'ia tidak boleh' menyampaikan larangan, sementara 'benar-benar' mempertahankan penegasan Ibrani tanpa kekakuan harfiah.
