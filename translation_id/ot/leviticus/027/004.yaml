lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Gabungan konjungsi dan partikel syarat memperkenalkan keadaan yang berlawanan dengan ayat sebelumnya; frasa ini menyampaikan pertentangan itu secara alami dalam bahasa Indonesia.
- source_word: נְקֵבָה הִוא
  choice: orang itu perempuan
  rationale: נְקֵבָה menyatakan jenis kelamin perempuan, sedangkan pronomina feminin הִוא merujuk kepada orang yang dinilai. 'Orang itu perempuan' alami dalam rumusan hukum dan tidak mempersempit maknanya menjadi kategori usia tertentu.
- source_word: וְהָיָה
  choice: harus
  rationale: Dalam rumusan hukum, bentuk ini memperkenalkan akibat atau ketetapan dalam klausa utama; 'harus' menyampaikan daya normatifnya secara wajar.
- source_word: עֶרְכְּךָ
  choice: nilai taksiranmu
  rationale: עֶרֶךְ dalam Imamat 27 menunjuk pada nilai resmi yang ditetapkan sehubungan dengan nazar, dan sufiks orang kedua tunggal dipertahankan dengan '-mu'.
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: tiga puluh syikal
  rationale: Angka diterjemahkan langsung; nomina Ibrani berbentuk tunggal sesudah bilangan, sedangkan bahasa Indonesia tetap memakai bentuk 'syikal' tanpa penanda jamak.
