source:
  edition: WLC
  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: id
  text: Jika usianya dari lima tahun sampai dua puluh tahun, nilai taksiranmu haruslah dua puluh syikal untuk laki-laki dan sepuluh syikal untuk perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Partikel syarat diterjemahkan secara alami dalam bahasa Indonesia; hubungan dengan ketentuan sebelumnya tetap jelas dari konteks rangkaian hukum.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: umurnya dari lima tahun sampai dua puluh tahun
  rationale: Ungkapan Ibrani dengan בֶּן menyatakan rentang usia. Penambahan 'umurnya' membuat rujukannya jelas dan wajar dalam bahasa Indonesia.
- source_word: וְהָיָה
  choice: adalah
  rationale: Dalam konteks ketentuan hukum, bentuk ini menetapkan jumlah yang berlaku; 'adalah' menyampaikan daya preskriptif secara lugas tanpa gaya legalistik yang kaku.
- source_word: עֶרְכְּךָ
  choice: nilai yang kautetapkan
  rationale: עֵרֶךְ menunjuk pada nilai taksiran yang ditetapkan dalam konteks nazar, sedangkan sufiks orang kedua tunggal dipertahankan melalui 'kau-'.
- source_word: הַזָּכָר
  choice: laki-laki
  rationale: Istilah ini menandai kategori jenis kelamin laki-laki dalam tabel penilaian, bukan kelompok sosial yang lebih luas.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: dua puluh syikal
  rationale: Jumlah dan satuan historis dipertahankan tanpa konversi ke mata uang modern.
- source_word: וְלַנְּקֵבָה
  choice: untuk perempuan
  rationale: Preposisi ל diterjemahkan 'untuk' dan kategori jenis kelamin perempuan dipertahankan sejajar dengan kategori laki-laki.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: sepuluh syikal
  rationale: Terjemahan langsung jumlah dan satuan, mempertahankan kontras dengan nilai untuk laki-laki.
theological_decisions:
- issue: Kategori penilaian berdasarkan jenis kelamin dalam hukum nazar
  choice: laki-laki ... perempuan
  alternative: seorang laki-laki ... seorang perempuan; jantan ... betina
  rationale: Bahasa Ibrani memakai kategori tunggal berdasarkan jenis kelamin dalam jadwal penilaian. Pilihan ini terdengar wajar bagi manusia dalam bahasa Indonesia dan tidak memperluas ketentuan tersebut menjadi klaim sosial atau teologis di luar konteksnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan rentang usia, sapaan orang kedua tunggal, kategori jenis kelamin, serta satuan syikal dari teks sumber.
