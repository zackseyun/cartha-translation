  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: id
  text: Ia tidak boleh memilah antara hewan yang baik dan yang buruk[a], dan tidak boleh menukarnya. Jika ia benar-benar menukarnya[b], baik hewan itu maupun hewan penggantinya akan menjadi kudus. Hewan itu tidak boleh ditebus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memeriksa antara yang baik dan yang buruk”; ungkapan Ibrani ini berarti membedakan mutu hewan ketika memilihnya.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani menegaskan tindakan ini: “jika ia sungguh-sungguh menukarnya” atau “jika ia memang menukarnya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר
  choice: memilah
  rationale: Dalam konteks persepuluhan hewan, bentuk piel ini menunjuk pada pemeriksaan yang bertujuan memilih atau membedakan hewan menurut mutunya. “Memilah” menyampaikan fungsi hukum tersebut secara alami.
- source_word: בֵּין טוֹב לָרַע
  choice: antara hewan yang baik dan yang buruk
  rationale: Ungkapan Ibrani menyatakan pembedaan kualitatif. Penyebutan “hewan” memperjelas rujukannya dari konteks tanpa mengubah makna.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: menukarnya / benar-benar menukarnya
  rationale: Akar מור merupakan istilah hukum untuk mengganti seekor hewan dengan hewan lain. Konstruksi infinitif absolut dengan verba finit diterjemahkan “benar-benar” untuk mempertahankan penekanannya.
- source_word: תְמוּרָתוֹ
  choice: hewan penggantinya
  rationale: Istilah ini menunjuk pada hewan yang ditempatkan sebagai pengganti hewan semula. Pilihan ini jelas dan alami dalam bahasa Indonesia.
- source_word: קֹדֶשׁ
  choice: kudus
  rationale: Dalam hukum Imamat, kata ini menyatakan bahwa sesuatu dikhususkan bagi Allah. “Kudus” mempertahankan bobot sakral dan keterkaitan istilah dalam kitab ini.
- source_word: לֹא יִגָּאֵל
  choice: tidak boleh ditebus
  rationale: Bentuk nifal גאל di sini menyatakan bahwa hewan tersebut tidak dapat ditebus dari status persembahannya. “Ditebus” mempertahankan istilah hukum-ibadah kitab Imamat.
- source_word: הוּא וּתְמוּרָתוֹ
  choice: baik hewan itu maupun hewan penggantinya
  rationale: Susunan ini mencakup hewan semula dan hewan yang digunakan sebagai pengganti. Pola “baik ... maupun ...” membuat cakupan keduanya jelas.
theological_decisions:
- issue: Daya hukum dan sakral dari bahasa pengudusan
  choice: Menerjemahkan קֹדֶשׁ sebagai “kudus” dan גאל sebagai “ditebus”.
  alternative: Menggunakan istilah yang lebih umum, seperti “suci” atau “dibeli kembali”.
  rationale: Ayat ini mengatur hewan yang dikhususkan dalam ibadah Israel. “Kudus” dan “ditebus” mempertahankan nuansa teologis sekaligus hukum-ibadah tanpa memasukkan ajaran denominasi tertentu.
- issue: Cakupan larangan penebusan pada klausa terakhir
  choice: Mempertahankan bentuk tunggal dengan “Hewan itu tidak boleh ditebus”.
  alternative: 'Menjadikannya eksplisit jamak: “Keduanya tidak boleh ditebus”.'
  rationale: Teks Ibrani memakai verba tunggal pada klausa terakhir. Terjemahan tidak memperluasnya secara eksplisit menjadi jamak, sehingga bentuk sumber dan kemungkinan cakupannya tetap terjaga.
translation_notes:
  register: Bahasa hukum-ibadah dipertahankan dengan bentuk yang lugas, modern, dan bermartabat. Istilah “kudus” dan “ditebus” menjaga kesinambungan kosakata kitab Imamat, sedangkan “memilah” mengungkapkan pemeriksaan untuk memilih menurut mutu.
