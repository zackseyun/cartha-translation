base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: id
  text: Jika seseorang berumur enam puluh tahun atau lebih, jika ia laki-laki, nilai yang harus kautetapkan adalah lima belas syikal; untuk perempuan, sepuluh syikal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: berumur enam puluh tahun atau lebih
  rationale: Ungkapan Ibrani ini menetapkan batas usia mulai enam puluh tahun ke atas. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan cakupan usia sumber.
- source_word: זָכָר
  choice: laki-laki
  rationale: Dalam konteks penetapan nilai ini, kata tersebut menunjuk pada jenis kelamin; 'laki-laki' tepat dan mudah dipahami tanpa membatasi pada status sosial tertentu.
- source_word: עֶרְכְּךָ
  choice: nilai yang kautetapkan
  rationale: Istilah ini merujuk pada nilai resmi dalam peraturan nazar di Imamat 27. Pilihan ini mempertahankan unsur orang kedua tunggal pada sufiks Ibrani sekaligus terdengar alami.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: lima belas syikal
  rationale: Terjemahan langsung bilangan dan satuan berat atau nilai yang digunakan dalam teks.
- source_word: לַנְּקֵבָה
  choice: untuk perempuan
  rationale: Pilihan ini membentuk pasangan yang wajar dengan 'laki-laki' dan menyampaikan kategori jenis kelamin dalam ketentuan tersebut.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: sepuluh syikal
  rationale: Terjemahan langsung bilangan dan satuan dalam teks sumber.
theological_decisions:
- issue: Sifat 'nilai' dalam peraturan nazar
  choice: nilai yang kautetapkan
  alternative: harga orang itu
  rationale: Teks berbicara tentang nilai resmi yang ditetapkan bagi nazar, bukan harga intrinsik atau martabat manusia. Karena itu, terjemahan menghindari kesan bahwa manusia sedang diperjualbelikan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur syarat usia diperlancar agar alami, sedangkan istilah teknis penetapan nilai serta bentuk orang kedua tunggal tetap dipertahankan.
