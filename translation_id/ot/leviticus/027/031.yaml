translation:
  language: id
  text: Jika seseorang menebus sebagian dari persepuluhannya[a], ia harus menambahkan seperlima pada jumlah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk “menebus, ia menebus,” yaitu susunan yang memberi penegasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Namun, jika
  rationale: Gabungan konjungsi dan partikel bersyarat memperkenalkan kasus lain dalam rangkaian hukum; “Namun, jika” wajar dalam bahasa Indonesia dan mempertahankan nuansa peralihan.
- source_word: גָּאֹל יִגְאַל
  choice: benar-benar menebus
  rationale: Infinitif absolut yang diikuti bentuk imperfek dari akar yang sama memberi penegasan pada tindakan; “benar-benar menebus” menyampaikan penekanan itu tanpa menafsirkannya sebagai keinginan.
- source_word: אִישׁ
  choice: seseorang
  rationale: Dalam rumusan hukum ini, nomina maskulin tunggal berfungsi secara generik. “Seseorang” merupakan ungkapan hukum Indonesia yang alami tanpa mengubah cakupan acuannya.
- source_word: מִמַּעַשְׂרוֹ
  choice: sebagian dari persepuluhannya
  rationale: Preposisi מִן menyatakan makna partitif, yaitu suatu bagian dari apa yang telah dipersembahkan sebagai persepuluhan.
- source_word: חֲמִשִׁיתוֹ
  choice: seperlimanya
  rationale: Bentuk ini menunjuk pada bagian kelima dari nilai atau jumlah yang ditebus; bentuk berpronomina mempertahankan kaitannya dengan pokok tersebut.
- source_word: יֹסֵף עָלָיו
  choice: ia harus menambahkan ... pada jumlah itu
  rationale: Bentuk Hifil יסף berarti “menambahkan,” sedangkan עַל menyatakan penambahan pada jumlah pokok. “Jumlah itu” memperjelas acuannya secara alami dalam bahasa Indonesia.
