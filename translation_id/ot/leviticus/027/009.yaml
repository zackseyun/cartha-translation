source:
  edition: WLC
  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: id
  text: Dan jika itu seekor hewan yang darinya orang mempersembahkan kurban kepada Yahweh[a], segala yang seseorang berikan dari hewan itu kepada Yahweh akan menjadi kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seekor hewan dari jenis yang darinya orang dapat mempersembahkan kurban kepada Yahweh.” Susunan bahasa Ibrani dapat dipahami sebagai hewan yang darinya kurban benar-benar dipersembahkan atau sebagai hewan dari jenis yang dapat dijadikan sumber kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Memperkenalkan syarat lanjutan dalam rangkaian hukum. Kata penghubung ו tersampaikan secara alami melalui kesinambungan konteks tanpa perlu selalu diterjemahkan secara tersendiri.
- source_word: בְּהֵמָה
  choice: seekor hewan
  rationale: Istilah umum bagi hewan, di sini dalam konteks persembahan. Pilihan ini lebih luas dan alami daripada ‘ternak’.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: yang darinya orang mempersembahkan kurban kepada Yahweh
  rationale: Bentuk Hifil יַקְרִיבוּ dalam konteks ibadah berarti membawa atau mempersembahkan, sedangkan מִמֶּנָּה menyatakan bahwa kurban berasal dari hewan itu. ‘Orang’ menyampaikan subjek umum tanpa membatasi pada jenis kelamin tertentu.
- source_word: קָרְבָּן
  choice: kurban
  rationale: Padanan baku dan mudah dipahami untuk persembahan yang dibawa dalam konteks ritual.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mempertahankan nama ilahi יהוה sebagai nama perjanjian, bukan menggantinya dengan gelar.
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: apa pun yang diberikan dari hewan itu
  rationale: Bentuk pasif alami dalam bahasa Indonesia menyampaikan pelaku generik dari verba tunggal Ibrani, sementara ‘dari hewan itu’ mempertahankan acuan מִמֶּנּוּ.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: haruslah menjadi kudus
  rationale: Dalam rumusan hukum, ‘haruslah’ menyampaikan daya normatif, sedangkan ‘menjadi kudus’ mempertahankan status pengudusan yang dinyatakan oleh קֹדֶשׁ.
theological_decisions:
- issue: Cakupan frasa tentang hewan yang dapat dipersembahkan
  choice: hewan yang darinya orang mempersembahkan kurban
  alternative: hewan yang termasuk jenis yang dapat dipersembahkan sebagai kurban
  rationale: Susunan אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה dapat menunjuk pada hewan yang darinya kurban benar-benar dipersembahkan atau pada kategori hewan yang layak dipersembahkan. Teks utama mengikuti bentuk verbal secara dekat, dan catatan kaki mempertahankan kemungkinan kategoris.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama pribadi ilahi dan membedakannya dari gelar.
translation_notes:
  register: Bahasa hukum-keagamaan yang modern dan bermartabat. ‘Kurban’, ‘Yahweh’, dan ‘kudus’ mempertahankan ragam ibadah, sementara susunan kalimat dibuat jelas bagi pembaca Indonesia masa kini.
