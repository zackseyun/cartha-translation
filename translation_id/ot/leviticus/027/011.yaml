  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: id
  text: Namun, jika itu seekor hewan najis yang tidak boleh dipersembahkan sebagai persembahan kepada Yahweh, ia harus menempatkan hewan itu di hadapan imam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Melanjutkan ketentuan sebelumnya sekaligus menandai peralihan kontras kepada kasus hewan najis.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: salah satu hewan najis
  rationale: Dalam konstruksi ini כָּל dengan nomina tunggal menyatakan anggota mana pun dari suatu golongan; 'najis' mempertahankan arti ritual-kultis טְמֵאָה.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: yang tidak boleh dipersembahkan sebagai persembahan
  rationale: Bentuk jamak orang ketiga יַקְרִיבוּ berfungsi umum atau impersonal. Ungkapan Indonesia pasif mempertahankan maksud umum itu; 'sebagai persembahan' menyampaikan fungsi מִמֶּנָּה קָרְבָּן secara alami tanpa menyiratkan ketidakmampuan fisik.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai 'Yahweh' sesuai bukti teks sumber dan kebijakan nama perjanjian.
- source_word: וְהֶעֱמִיד
  choice: orang itu harus menempatkan
  rationale: Hifil dari עמד berarti membuat berdiri atau menempatkan. Subjek tunggal yang tersirat dibuat eksplisit secara alami dalam bahasa Indonesia.
- source_word: לִפְנֵי הַכֹּהֵן
  choice: di hadapan imam
  rationale: Padanan formal dan idiomatis yang mempertahankan latar penilaian resmi oleh imam.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama diri perjanjian tanpa menggantinya dengan gelar.
- issue: Daya modal klausa tentang hewan najis
  choice: tidak boleh dipersembahkan
  alternative: tidak dipersembahkan
  rationale: Konteks hukum kurban menunjukkan ketidaklayakan ritual, bukan sekadar laporan bahwa orang biasanya tidak mempersembahkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum bersyarat dipertahankan dengan jelas; istilah 'najis', 'persembahan', dan 'imam' mengikuti register ritual dalam Imamat.
