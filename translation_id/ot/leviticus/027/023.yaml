revisions:
- from: Lalu imam harus menghitung baginya bagian dari nilai taksiranmu sampai Tahun Yobel. Pada hari itu, orang itu harus memberikan nilai taksiran tersebut sebagai persembahan kudus kepada Yahweh.[a]
  to: Lalu imam harus menghitung baginya jumlah nilai taksiranmu sampai Tahun Yobel. Pada hari itu, orang itu harus menyerahkan nilai taksiran tersebut; itu kudus bagi Yahweh.[a]
  rationale: Revisi mengganti konstruksi “bagian dari” dengan “jumlah” untuk mencerminkan nilai yang dihitung, dan menerjemahkan קֹדֶשׁ לַיהוָה secara langsung sebagai “kudus bagi Yahweh.” Subjek tersirat dari וְנָתַן tetap dinyatakan sebagai “orang itu,” sesuai konteks dekat, tanpa menyatakan identitasnya lebih khusus daripada yang diperlukan.
