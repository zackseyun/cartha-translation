base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: id
  text: Lalu imam harus menghitung baginya jumlah nilai taksiranmu sampai Tahun Yobel. Pada hari itu, orang itu harus menyerahkan nilai taksiran tersebut; itu kudus bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “nilai taksiran tersebut harus menjadi kudus bagi Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Lalu ... harus menghitung
  rationale: Bentuk piel dari חשׁב menyatakan tindakan menghitung atau menetapkan jumlah berdasarkan perhitungan; “lalu” menyampaikan urutan hukum secara wajar.
- source_word: לּוֹ
  choice: baginya
  rationale: Pronomina datif menunjukkan bahwa imam menghitung jumlah itu bagi orang yang bersangkutan.
- source_word: מִכְסַת
  choice: bagian
  rationale: מִכְסָה menunjuk pada jumlah atau bagian yang sebanding; dalam konteks ini, yang dimaksud ialah bagian nilai taksiran hingga Tahun Yobel.
- source_word: הָעֶרְכְּךָ
  choice: nilai taksiranmu / nilai taksiran tersebut
  rationale: עֵרֶךְ merupakan istilah teknis dalam Imamat 27 untuk nilai yang ditetapkan. Kemunculan pertama mempertahankan akhiran orang kedua tunggal, sedangkan pengulangan memakai rujukan alami dalam bahasa Indonesia.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: sampai Tahun Yobel
  rationale: Ungkapan ini menetapkan Tahun Yobel sebagai batas waktu perhitungan.
- source_word: וְנָתַן
  choice: orang itu harus memberikan
  rationale: נתן berarti “memberikan”. Subjek Ibrani tersirat; konteks menunjukkan orang yang bersangkutan, bukan imam, sebagai pihak yang menyerahkan jumlah tersebut.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan langsung dan alami bagi ungkapan temporal Ibrani.
- source_word: קֹדֶשׁ לַיהוָה
  choice: sebagai persembahan kudus kepada Yahweh
  rationale: Secara harfiah berarti “kudus bagi Yahweh”. Penambahan “persembahan” memperjelas fungsi kultis jumlah yang diberikan tanpa mengubah maknanya; bentuk lebih harfiah dicantumkan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi Yahweh, bukan diganti dengan gelar.
theological_decisions:
- issue: Subjek tersirat dari וְנָתַן
  choice: orang yang bersangkutan adalah pihak yang memberikan nilai taksiran
  alternative: imam adalah pihak yang memberikannya
  rationale: Imam melakukan perhitungan, tetapi konteks hukum mengenai ladang yang dikuduskan menunjukkan bahwa pemilik atau orang yang bersangkutanlah yang menyerahkan jumlah nilai taksiran. “Orang itu” menghindari kerancuan pronomina dalam bahasa Indonesia.
- issue: Makna קֹדֶשׁ לַיהוָה
  choice: persembahan yang dikhususkan kepada Yahweh
  alternative: “kudus bagi Yahweh” secara harfiah
  rationale: Frasa itu menyatakan pengkhususan kultis kepada Yahweh. Terjemahan utama dibuat alami, sedangkan bentuk formal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “nilai taksiran” dipakai secara konsisten sebagai istilah teknis, sedangkan “Tahun Yobel” diperlakukan sebagai nama lembaga perjanjian. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya.
