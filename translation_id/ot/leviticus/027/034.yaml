- from: Itulah perintah-perintah yang Yahweh sampaikan melalui Musa kepada bani Israel di Gunung Sinai.[a]
  to: Inilah perintah-perintah yang Yahweh perintahkan kepada Musa untuk bani Israel di Gunung Sinai.
  rationale: Revisi memulihkan arti dasar צִוָּה sebagai "memerintahkan" dan mempertahankan Musa sebagai penerima langsung tindakan itu. Frasa "untuk bani Israel" menyampaikan fungsi אֶל dalam konteks ini secara alami tanpa mengklaim lebih daripada yang diungkapkan teks. Catatan kaki dihapus karena tidak diperlukan dan alternatifnya kurang setia.
