source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: id
  text: Inilah perintah-perintah yang Yahweh perintahkan kepada Musa untuk bani Israel di Gunung Sinai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Itulah
  rationale: Menandai rumusan penutup yang merangkum ketentuan-ketentuan sebelumnya; bentuk ini alami dalam bahasa Indonesia.
- source_word: הַמִּצְוֺת
  choice: perintah-perintah
  rationale: Mempertahankan daya hukum מִצְוָה dan bentuk jamaknya.
- source_word: אֲשֶׁר צִוָּה
  choice: yang ... sampaikan
  rationale: Dalam konstruksi ini, צִוָּה menyatakan pemberian perintah kepada Musa untuk diteruskan kepada Israel. 'Sampaikan' menghasilkan bahasa Indonesia yang alami, sementara nomina 'perintah-perintah' tetap mempertahankan gagasan memerintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֶת מֹשֶׁה
  choice: melalui Musa
  rationale: Secara gramatikal, Musa ialah objek langsung verba 'memerintahkan'; dalam konteks אֶל בְּנֵי יִשְׂרָאֵל, bahasa Indonesia paling jelas mengungkapkan perannya sebagai penerima sekaligus perantara dengan 'melalui Musa'.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kepada bani Israel
  rationale: אֶל paling langsung berarti 'kepada'. 'Bani Israel' merupakan ungkapan Indonesia yang dikenal luas dan mempertahankan bentuk harfiah 'anak-anak lelaki/keturunan Israel' sebagai sebutan kolektif.
- source_word: בְּהַר סִינָי
  choice: di Gunung Sinai
  rationale: Padanan lokasi yang alami bagi בְּ dalam bahasa Indonesia; tidak memaksakan apakah peristiwa itu tepat di puncak atau di kawasan gunung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; umat Israel; anak-anak Israel
  rationale: Ungkapan Ibrani adalah sebutan kolektif bagi keturunan atau umat Israel, bukan pembatasan kepada laki-laki saja. 'Bani Israel' mempertahankan bentuk historisnya dan dipahami secara kolektif.
- issue: Hubungan sintaksis Musa dan Israel dalam צִוָּה ... אֶת מֹשֶׁה אֶל בְּנֵי יִשְׂרָאֵל
  choice: sampaikan melalui Musa kepada bani Israel
  alternative: perintahkan kepada Musa untuk bani Israel; perintahkan Musa mengenai bani Israel
  rationale: Pilihan utama mengungkapkan alur komunikasi yang tersirat dalam konstruksi Ibrani tanpa menyatakan bahwa Israel adalah objek langsung verba. Catatan kaki mempertahankan alternatif hubungan אֶל.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Itulah' sesuai dengan fungsi ayat sebagai rumusan penutup. 'Bani Israel' dipakai sebagai sebutan kolektif historis yang lazim; frasa ini tidak dimaksudkan hanya untuk laki-laki. Penanda catatan kaki ditempatkan dalam teks utama.
