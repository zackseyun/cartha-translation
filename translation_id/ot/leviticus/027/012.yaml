translation:
  language: id
  text: Imam harus menilai hewan itu, apakah baik atau buruk. Sesuai dengan penilaian imam, demikianlah nilai hewan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sesuai dengan penilaianmu, imam, demikianlah jadinya.” Bentuk Ibrani memakai “penilaianmu” diikuti “imam”; dalam konteksnya, yang dimaksud ialah penilaian imam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: harus menilai
  rationale: Bentuk Hifil dari ערך dalam konteks hukum nazar berarti menetapkan nilai hewan. 'Harus menilai' alami dalam bahasa Indonesia dan menyampaikan daya instruksional bentuk verba tersebut.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi כֹּהֵן dalam materi hukum Imamat; subjek tertentu tetap jelas dalam konteks.
- source_word: אֹתָהּ
  choice: hewan itu
  rationale: Pronomina feminin tunggal merujuk kepada hewan dalam ayat sebelumnya. Mengulangi 'hewan itu' membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: apakah baik atau buruk
  rationale: Ungkapan ini menandai penilaian mutu. Bentuk 'apakah ... atau ...' mempertahankan kedua kemungkinan dan lebih wajar daripada terjemahan harfiah 'antara baik dan buruk'.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: sesuai dengan penilaian imam
  rationale: Secara bentuk, עֶרְכְּךָ memuat sufiks orang kedua tunggal ('penilaianmu'), sedangkan 'imam' yang mengikutinya menjelaskan pihak yang menilai. Terjemahan utama menyampaikan fungsi frasa secara alami; bentuk Ibrani yang tidak biasa dicatat dalam catatan kaki.
- source_word: כֵּן יִהְיֶה
  choice: demikianlah nilainya ditetapkan
  rationale: Formula ini menegaskan bahwa hasil penilaian imam berlaku secara mengikat. Penyebutan 'nilainya' memperjelas rujukan tanpa menambahkan isi substantif.
