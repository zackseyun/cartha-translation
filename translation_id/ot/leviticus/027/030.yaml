base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: id
  text: Setiap persepuluhan dari tanah[a]—baik dari hasil benih di tanah maupun dari buah pohon—adalah milik Yahweh; itu kudus bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Setiap persepuluhan dari tanah, dari benih tanah dan dari buah pohon, adalah milik Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: Setiap persepuluhan dari tanah
  rationale: כָל dengan nomina tunggal berkonstruksi bersifat distributif, sehingga wajar diterjemahkan “setiap”. מַעְשַׂר adalah istilah baku untuk bagian sepersepuluh, sedangkan הָאָרֶץ dalam konteks pertanian menunjuk pada tanah atau hasil yang berasal darinya. Konjungsi awal וְ tidak perlu dinyatakan dalam ayat yang dikutip tersendiri.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: dari benih tanah
  rationale: Terjemahan ini mempertahankan gambaran konkret bahasa Ibrani. Ungkapan tersebut mencakup hasil pertanian yang berasal dari benih yang ditanam, tetapi “benih tanah” menjaga kesejajaran dengan “buah pohon” tanpa mempersempitnya menjadi biji-bijian saja.
- source_word: מִפְּרִי הָעֵץ
  choice: dari buah pohon
  rationale: Bentuk tunggal הָעֵץ dapat dipakai secara kolektif. “Buah pohon” dekat dengan bentuk sumber dan tetap alami dalam bahasa Indonesia.
- source_word: לַיהוָה הוּא
  choice: adalah milik Yahweh
  rationale: Preposisi לְ di sini menyatakan kepemilikan atau peruntukan. “Milik Yahweh” menyampaikan makna utama secara jelas, sementara kemungkinan terjemahan yang lebih formal dicatat dalam catatan kaki.
- source_word: קֹדֶשׁ לַיהוָה
  choice: itu kudus bagi Yahweh
  rationale: קֹדֶשׁ menyatakan bahwa persepuluhan tersebut dikhususkan sebagai kudus. “Kudus bagi Yahweh” mempertahankan rumusan kultis sumber tanpa menambahkan tingkat superlatif yang tidak terdapat dalam bahasa Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu secara langsung dan tidak menggantinya dengan gelar.
- issue: Makna לַיהוָה dalam pernyataan tentang persepuluhan
  choice: adalah milik Yahweh
  alternative: adalah bagi Yahweh
  rationale: Konteks mendukung makna kepemilikan sekaligus pengkhususan. Teks utama memakai ungkapan Indonesia yang jelas, sedangkan catatan kaki mempertahankan bentuk “bagi Yahweh” yang lebih dekat secara formal dan sedikit lebih terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah membantu pembaca mengenali dua jenis hasil tanah yang termasuk dalam pernyataan utama. Istilah “persepuluhan”, “kudus”, dan nama “Yahweh” dipertahankan karena tepat dalam konteks hukum ibadah.
