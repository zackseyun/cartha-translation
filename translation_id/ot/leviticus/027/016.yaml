source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: id
  text: 'Jika seseorang menguduskan bagi Yahweh sebagian dari ladang pusakanya[a], penilaianmu haruslah didasarkan pada jumlah benih yang diperlukan untuk menaburinya: benih jelai sebanyak satu homer dihargai lima puluh syikal perak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagian dari ladang warisannya.” Ungkapan Ibrani ini menunjuk pada tanah yang dimiliki sebagai pusaka turun-temurun, dan awalan “dari” menyiratkan bahwa hanya sebagian dari ladang itu yang dikuduskan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: sebagian dari ladang milik pusakanya
  rationale: Prefiks מִן menyiratkan bagian dari ladang, sedangkan אֲחֻזָּה menunjuk pada tanah milik turun-temurun; frasa ini mempertahankan kedua unsur tersebut secara wajar dalam bahasa Indonesia.
- source_word: יַקְדִּישׁ
  choice: menguduskan
  rationale: Dalam konteks Imamat 27, kata ini berarti mengkhususkan sesuatu sebagai kudus bagi Yahweh, bukan sekadar menyumbangkannya.
- source_word: אִישׁ
  choice: seseorang
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam ketentuan hukum ini kata tersebut berfungsi secara umum. 'Seseorang' alami dalam bahasa Indonesia dan tidak mengubah cakupan hukumnya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה dipertahankan sebagai 'Yahweh'; preposisi ל menyatakan bahwa ladang itu dikhususkan bagi-Nya.
- source_word: עֶרְכְּךָ
  choice: penilaianmu
  rationale: Mempertahankan bentuk orang kedua tunggal dan arti teknis penetapan nilai dalam pasal ini.
- source_word: לְפִי זַרְעוֹ
  choice: berdasarkan jumlah benih yang diperlukan untuk menaburinya
  rationale: Ungkapan ini mengukur lahan menurut banyaknya benih yang dibutuhkan untuk ditaburkan, bukan menurut hasil panennya.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: satu homer benih jelai
  rationale: Menyatakan jumlah benih jelai sebanyak satu homer sebagai satuan dasar penilaian, sambil mempertahankan satuan kuno.
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: lima puluh syikal perak
  rationale: Terjemahan langsung dan lazim untuk nilai yang ditetapkan dalam perak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memuat Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama diri perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan אִישׁ dalam rumusan hukum
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Bentuknya maskulin tunggal, tetapi pemakaiannya di sini bersifat representatif dalam hukum. Bahasa Indonesia tidak mewajibkan penandaan gender pada 'seseorang', sehingga fungsi umum sumber dapat disampaikan tanpa menghapus pelaku tunggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum-keagamaan yang bermartabat. Istilah ukuran kuno 'homer' dan 'syikal' dipertahankan; 'jelai' dipilih untuk barley. Struktur kalimat diperjelas tanpa menghilangkan dasar agraris penilaian.
