  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: id
  text: Namun, jika itu termasuk hewan yang najis secara ritual[a], ia boleh menebusnya menurut nilai yang kautetapkan dan harus menambahkan seperlimanya pada nilai itu[b]. Jika tidak ditebus, hewan itu harus dijual menurut nilai yang kautetapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "dari hewan yang najis." Frasa Ibrani ini merujuk pada hewan yang termasuk golongan hewan najis menurut ketentuan ritual.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "menambahkan seperlimanya padanya," yakni menambahkan dua puluh persen pada nilai yang ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: termasuk hewan yang najis secara ritual
  rationale: 'Frasa ini bersifat partitif atau klasifikatoris: benda yang dipersembahkan termasuk golongan hewan yang dinyatakan najis menurut hukum ritual, bukan berarti hewan itu kotor secara fisik.'
- source_word: וּפָדָה
  choice: orang itu harus menebusnya
  rationale: פדה berarti menebus atau membeli kembali. Dalam rumusan hukum bersyarat ini, bentuk verba menyatakan prosedur yang berlaku bila orang tersebut memilih mengambil kembali hewan yang telah dipersembahkan; 'harus' menyatakan syarat prosedural itu tanpa menjadikan penebusan satu-satunya pilihan.
- source_word: בְעֶרְכֶּךָ
  choice: menurut nilai yang kautetapkan
  rationale: עֵרֶךְ menunjuk pada nilai taksiran yang ditetapkan oleh imam dalam konteks pasal ini. Bentuk 'kautetapkan' mempertahankan sapaan orang kedua tunggal.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: menambahkan seperlimanya pada nilai itu
  rationale: Ungkapan Ibrani secara harfiah menyatakan penambahan 'seperlimanya' di atas jumlah tersebut, yaitu tambahan dua puluh persen dari nilai taksiran.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: jika hewan itu tidak ditebus
  rationale: Bentuk Nifal membiarkan pelaku penebusan tidak disebutkan; bentuk pasif Indonesia mempertahankan ketaktertentuan itu.
- source_word: וְנִמְכַּר
  choice: hewan itu harus dijual
  rationale: Bentuk Nifal berfungsi sebagai pasif hukum dan menyatakan tindakan yang wajib dilakukan bila hewan tersebut tidak ditebus.
theological_decisions:
- issue: Makna 'najis' pada hewan
  choice: najis secara ritual
  alternative: hewan najis
  rationale: Penjelasan 'secara ritual' mencegah pembaca memahami najis sebagai kotor secara fisik dan mempertahankan kategori hukum Imamat tanpa memasukkan tafsir denominasi tertentu.
- issue: Daya modal וּפָדָה dalam ketentuan hukum
  choice: harus menebusnya
  alternative: boleh menebusnya
  rationale: Dalam struktur kasus ini, penebusan secara keseluruhan tetap merupakan pilihan karena ayat juga mengatur kemungkinan hewan itu tidak ditebus. Namun, bila penebusan dilakukan, pembayaran nilai taksiran beserta tambahan seperlima merupakan prosedur yang diwajibkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'hewan itu' dipertahankan demi kejelasan rujukan, sedangkan 'yang kautetapkan' menjaga sapaan tunggal kepada imam dalam konteks dekat.
