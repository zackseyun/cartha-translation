id: LEV.27.19
reference: Leviticus 27:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: id
  text: Namun, jika orang yang menguduskan[a] ladang itu benar-benar menebusnya, ia harus menambahkan seperlima dari nilai taksiranmu dalam perak[b] kepada nilai itu, dan ladang itu akan menjadi miliknya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: mempersembahkan; secara harfiah, mengkhususkan sebagai milik kudus.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: seperlima dari perak taksiranmu.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: akan ditetapkan baginya; secara harfiah, akan berdiri baginya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Meneruskan ketentuan sebelumnya sekaligus memperkenalkan kemungkinan yang berbeda; bentuk ini alami dalam bahasa hukum Indonesia.
- source_word: גָּאֹל יִגְאַל
  choice: benar-benar menebusnya
  rationale: Gabungan infinitif absolut dan bentuk verba berhingga memberi penegasan pada tindakan menebus; ‘benar-benar’ mempertahankan tekanan itu secara wajar.
- source_word: הַשָּׂדֶה
  choice: ladang itu
  rationale: Menunjuk pada bidang tanah tertentu yang dibahas dalam ketentuan sebelumnya; ‘ladang’ lebih tepat daripada istilah umum ‘tanah’.
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: orang yang menguduskan ladang itu
  rationale: Partisipel ini menunjuk kepada orang yang mengkhususkan ladang tersebut untuk tujuan kudus. ‘Menguduskan’ mempertahankan nuansa kultis tanpa menambahkan penerima yang tidak disebut secara eksplisit dalam ayat.
- source_word: וְיָסַף
  choice: ia harus menambahkan
  rationale: Dalam konteks hukum, rangkaian bentuk verba ini menyatakan kewajiban, bukan sekadar ramalan mengenai masa depan.
- source_word: חֲמִשִׁית
  choice: seperlima
  rationale: Padanan hukum dan ekonomi yang alami serta tepat.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: nilai taksiranmu dalam perak
  rationale: Mempertahankan unsur ‘perak’ dan sapaan orang kedua tunggal dalam ungkapan harfiah ‘perak dari taksiranmu’, tetapi menyusunnya secara alami dalam bahasa Indonesia.
- source_word: עָלָיו
  choice: kepada nilai itu
  rationale: Seperlima tersebut ditambahkan pada jumlah taksiran ladang; penyebutan ‘nilai itu’ memperjelas acuan pronomina tanpa mengubah ketentuan.
- source_word: וְקָם לוֹ
  choice: ladang itu akan menjadi miliknya
  rationale: Ungkapan hukum harfiahnya ‘akan berdiri/berlaku baginya’ menyatakan bahwa hak atas ladang itu ditetapkan baginya setelah pembayaran.
theological_decisions:
- issue: Makna kultis bentuk הקדישׁ
  choice: menguduskan
  alternative: mempersembahkan; mengkhususkan sebagai milik kudus
  rationale: ‘Menguduskan’ menjaga gagasan bahwa ladang itu dikhususkan dalam ranah sakral. Terjemahan ini tidak mereduksinya menjadi sumbangan biasa dan tidak menambahkan rincian teologis yang tidak dinyatakan.
- issue: Daya hukum rangkaian klausa
  choice: kewajiban dan akibat hukum (‘harus menambahkan ... akan menjadi miliknya’)
  alternative: masa depan sederhana atau narasi lampau
  rationale: Konteks Imamat 27 adalah ketentuan hukum. Karena itu, klausa pertama menyatakan kewajiban pembayaran, sedangkan klausa terakhir menyatakan akibat hukum dari pembayaran tersebut.
- issue: Arti idiom וְקָם לוֹ
  choice: akan menjadi miliknya
  alternative: akan tetap menjadi miliknya; akan berlaku baginya
  rationale: Teks menyatakan penetapan hak baginya, tetapi tidak secara eksplisit menguraikan teori kepemilikan. Pilihan ini menyampaikan akibat hukum tanpa memakai ungkapan harfiah yang kabur dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum dibuat jelas bagi pembaca umum, sementara penegasan verba Ibrani, nuansa kultis, unsur perak, sapaan orang kedua tunggal, dan idiom penetapan hak tetap dipertahankan.
