  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: id
  text: Tidak seorang pun dari kalangan manusia yang dikhususkan secara mutlak[a] boleh ditebus; ia pasti harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tidak seorang pun dari kalangan manusia yang dikhususkan untuk dimusnahkan boleh ditebus; ia pasti harus dihukum mati.”'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרֶם
  choice: yang dikhususkan secara mutlak
  rationale: Istilah teknis חֵרֶם menunjuk pada sesuatu atau seseorang yang ditempatkan di bawah ketetapan pengkhususan yang tidak dapat ditarik kembali, dan dalam konteks tertentu ditujukan untuk dimusnahkan. Ungkapan ini mempertahankan nuansa pengkhususan tanpa langsung menyempitkannya menjadi 'dimusnahkan'.
- source_word: יָחֳרַם
  choice: dikhususkan secara mutlak
  rationale: Bentuk verba ini menyatakan bahwa sesuatu atau seseorang ditempatkan di bawah חֵרֶם. Terjemahan tersebut mempertahankan hubungan leksikal dengan nomina חֵרֶם dalam bahasa Indonesia yang wajar.
- source_word: מִן הָאָדָם
  choice: dari antara manusia
  rationale: Dalam konteks ini אָדָם menunjuk pada golongan manusia, sehingga frasa tersebut menjelaskan bahwa yang dikhususkan adalah seorang manusia, bukan benda biasa.
- source_word: יִפָּדֶה
  choice: tidak boleh ditebus
  rationale: פדה berarti menebus atau membebaskan dengan tebusan. Bentuk modal 'tidak boleh' sesuai dengan larangan hukum dalam konteks pasal ini.
- source_word: מוֹת יוּמָת
  choice: ia harus dihukum mati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian atau kemutlakan hukuman mati. 'Harus dihukum mati' menyampaikan daya wajib formula hukum tersebut secara alami.
theological_decisions:
- issue: Makna חֵרֶם ketika yang dikenai ketetapan itu adalah manusia
  choice: Memakai bahasa teknis 'dikhususkan secara mutlak' dalam teks utama.
  alternative: Setiap orang dari antara manusia yang dikhususkan untuk dimusnahkan tidak boleh ditebus; ia harus dihukum mati.
  rationale: Teks menggabungkan istilah pengkhususan sakral-hukum dengan rumusan hukuman mati. Terjemahan utama tidak menyamakan חֵרֶם begitu saja dengan pemusnahan, sedangkan catatan kaki memperlihatkan pembacaan yang lebih eksplisit.
- issue: Rujukan manusia dalam bentuk gramatikal yang semula dapat terdengar seperti 'sesuatu'
  choice: Mempertahankan pembukaan yang cukup formal, lalu memakai 'ia' karena frasa 'dari antara manusia' dan klausa hukuman mati menunjukkan bahwa rujukannya adalah orang.
  alternative: Setiap orang yang dikhususkan secara mutlak dari antara manusia tidak boleh ditebus; ia harus dihukum mati.
  rationale: Pilihan ini menjaga ketegangan antara nomina teknis חֵרֶם dan rujukan nyatanya kepada seorang manusia tanpa menghasilkan kalimat Indonesia yang tidak wajar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum-sakral. Ungkapan 'dikhususkan secara mutlak' dipakai untuk menghindari kata 'haram', yang dalam bahasa Indonesia modern terutama dipahami sebagai 'terlarang' dan dapat mengaburkan makna teknis חֵרֶם.
