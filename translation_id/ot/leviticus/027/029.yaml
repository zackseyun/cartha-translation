  source_fidelity: Teks Ibrani membatasi ketetapan ḥerem ini pada seorang manusia (מִן־הָאָדָם), lalu menyatakan bahwa orang itu tidak dapat ditebus dan pasti dihukum mati. Draf mempertahankan nuansa teknis ḥerem dengan baik, tetapi pembukaannya, “Segala yang,” memperlakukan rujukan itu sebagai benda dan bertentangan dengan “ia” serta klausa hukuman mati.
  naturalness: “Segala yang dikhususkan secara mutlak dari antara manusia” tidak wajar dalam bahasa Indonesia baku dan tidak secara jelas menunjuk kepada manusia. “Tidak seorang pun dari kalangan manusia yang dikhususkan secara mutlak” jelas, formal, dan alami dalam register hukum-sakral.
  terminology: “Dikhususkan secara mutlak” dapat dipertahankan sebagai padanan teknis yang berhati-hati bagi חֵרֶם/יחרם. “Ditebus” tepat bagi יִפָּדֶה. “Pasti harus dihukum mati” menyampaikan penegasan infinitif absolut מוֹת bersama verba יוּמָת tanpa menguraikan ḥerem secara doktrinal dalam teks utama.
  issues:
  - severity: medium
    issue: Rujukan manusia dalam teks utama tidak jelas dan secara idiomatis terbaca sebagai benda.
    rationale: “Segala yang ... dari antara manusia” tidak secara alami berarti seorang manusia dalam bahasa Indonesia, sedangkan frasa Ibrani dalam konteks ini menunjuk kepada manusia dan klausa berikutnya memakai formula hukuman mati. Mengubahnya menjadi “Tidak seorang pun dari kalangan manusia ...” memperjelas rujukan tanpa menghilangkan istilah teknis pengkhususan.
  - severity: low
    issue: Penegasan formula mati tidak tercermin sepenuhnya.
    rationale: Gabungan מוֹת יוּמָת menegaskan kepastian. Penambahan “pasti” secara wajar mencerminkan penegasan tersebut.
  revised_text: Tidak seorang pun dari kalangan manusia yang dikhususkan secara mutlak[a] boleh ditebus; ia pasti harus dihukum mati.
