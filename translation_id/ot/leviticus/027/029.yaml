revisions:
- from: Segala yang dikhususkan secara mutlak dari antara manusia[a] tidak boleh ditebus; ia harus dihukum mati.
  to: Tidak seorang pun dari kalangan manusia yang dikhususkan secara mutlak[a] boleh ditebus; ia pasti harus dihukum mati.
  rationale: Revisi mengganti pembukaan yang berkonotasi benda dengan subjek manusia yang eksplisit, sebagaimana dituntut oleh konteks frasa Ibrani dan oleh hukuman mati pada klausa kedua. Istilah “dikhususkan secara mutlak” dipertahankan untuk menjaga ambiguitas teknis ḥerem; pembacaan yang menjadikannya “dikhususkan untuk dimusnahkan” tetap tersedia dalam catatan kaki. Marker catatan kaki tetap terpasang pada istilah yang dipersoalkan.
