  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: id
  text: Namun, anak sulung dari ternak, yang sebagai anak sulung menjadi milik Yahweh, tidak seorang pun boleh mengkhususkannya[a]. Entah sapi, entah domba atau kambing[b], hewan itu milik Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang laki-laki tidak boleh mengkhususkannya”; kata Ibrani yang berarti “laki-laki” digunakan secara umum di sini.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani שֶׂה dapat menunjuk pada seekor domba ataupun kambing dari kawanan ternak kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pengecualian atau pembatasan terhadap ketentuan sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: בְּכוֹר
  choice: anak sulung
  rationale: Menunjuk pada hewan yang pertama lahir; istilah ini jelas dan lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: yang sebagai anak sulung menjadi milik Yahweh
  rationale: Bentuk pasif יְבֻכַּר menyatakan status kesulungan, bukan tindakan manusia. Terjemahan ini menyampaikan bahwa hewan tersebut sudah menjadi hak Yahweh karena statusnya sebagai anak sulung.
- source_word: בִּבְהֵמָה
  choice: di antara ternak
  rationale: בְּהֵמָה di sini merupakan istilah kolektif bagi hewan peliharaan dalam konteks persembahan.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: tidak boleh dikhususkan oleh siapa pun
  rationale: Hifil dari קדש berarti mengkhususkan atau mempersembahkan sebagai kudus. Bentuk pasif alami dalam bahasa Indonesia mempertahankan larangan, sedangkan 'siapa pun' menyampaikan fungsi generik אִישׁ.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: baik sapi maupun domba atau kambing
  rationale: Konstruksi אִם ... אִם berarti 'baik ... maupun'. שׁוֹר menunjuk pada jenis sapi, sedangkan שֶׂה dapat menunjuk pada domba atau kambing.
- source_word: לַיהוָה הוּא
  choice: hewan itu milik Yahweh
  rationale: Menyatakan kepemilikan atau hak Yahweh dengan jelas dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sesuai kebijakan proyek.
theological_decisions:
- issue: Alasan anak sulung ternak tidak boleh dikhususkan melalui nazar
  choice: Hewan itu tidak dapat dikhususkan lagi karena sebagai anak sulung sudah menjadi milik Yahweh.
  alternative: Status anak sulung itu sendiri merupakan suatu bentuk pengudusan, tanpa penekanan khusus pada kepemilikan.
  rationale: Alur ayat melarang seseorang mempersembahkan sebagai pemberian khusus sesuatu yang sudah menjadi hak Yahweh; klausa terakhir, 'hewan itu milik Yahweh', mendukung penekanan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang bermartabat. 'Dikhususkan' mempertahankan makna kultis tanpa terdengar terlalu teknis, dan pengulangan 'sebagai anak sulung' mempertahankan hubungan eksplisit dengan bentuk Ibrani.
