id: LEV.27.20
reference: Leviticus 27:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: id
  text: Tetapi jika ia tidak menebus ladang itu, atau jika ia telah menjual ladang itu kepada laki-laki lain[a], ladang itu tidak dapat ditebus lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “orang lain.” Secara harfiah: “laki-laki lain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika / atau jika
  rationale: Dalam rangkaian ketentuan ini, וְאִם meneruskan syarat sebelumnya sekaligus memperkenalkan kemungkinan yang berlawanan; bentuk Indonesia ini jelas dan alami.
- source_word: יִגְאַל / יִגָּאֵל
  choice: menebus / dapat ditebus
  rationale: Kata גאל di sini merupakan istilah hukum untuk memperoleh kembali harta yang telah dikhususkan. 'Menebus' mempertahankan nuansa hukum-keagamaan dan hubungan antara bentuk aktif dan pasif.
- source_word: הַשָּׂדֶה
  choice: ladang itu
  rationale: שׂדה menunjuk pada ladang tertentu yang sedang dibicarakan, bukan tanah atau wilayah secara umum.
- source_word: מָכַר
  choice: telah menjual
  rationale: Bentuk perfektif menunjukkan penjualan yang sudah terjadi dan menimbulkan akibat hukum.
- source_word: לְאִישׁ אַחֵר
  choice: kepada laki-laki lain
  rationale: איש secara leksikal berbentuk maskulin dan berarti 'laki-laki', walaupun dalam rumusan hukum dapat berfungsi secara umum. Terjemahan utama mempertahankan bentuk sumber, sementara catatan menyajikan kemungkinan umum.
- source_word: עוֹד
  choice: lagi
  rationale: Dalam konteks ini, עוֹד menandakan bahwa sesudah keadaan tersebut terjadi, penebusan berikutnya tidak lagi dimungkinkan.
theological_decisions:
- issue: Maskulin generik dalam rumusan hukum
  choice: laki-laki lain
  alternative: orang lain
  rationale: Teks Ibrani memakai איש, nomina maskulin tunggal. Bentuk maskulin dipertahankan dalam teks utama tanpa menyangkal kemungkinan fungsi generiknya, yang dicatat dalam catatan kaki.
- issue: Daya hukum-keagamaan גאל
  choice: menebus
  alternative: membeli kembali; memperoleh kembali
  rationale: '''Menebus'' mempertahankan istilah teknis yang konsisten dengan hukum harta yang dikhususkan dalam Imamat 27 tanpa menambahkan klaim teologis di luar konteks.'
- issue: Nuansa לֹא יִגָּאֵל עוֹד
  choice: tidak dapat ditebus lagi
  alternative: tidak boleh ditebus lagi; tidak akan ditebus lagi
  rationale: Ungkapan ini menyatakan akibat atau ketidaklayakan hukum, bukan semata-mata larangan langsung. 'Tidak dapat' menjaga nuansa akibat hukum sambil tetap alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan 'ladang itu' dipertahankan untuk kejelasan hukum dan kesetiaan pada struktur sumber. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
