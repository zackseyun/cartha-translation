id: LEV.27.24
reference: Leviticus 27:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת הַ/יּוֹבֵל֙ יָשׁ֣וּב הַ/שָּׂדֶ֔ה לַ/אֲשֶׁ֥ר קָנָ֖/הוּ מֵ/אִתּ֑/וֹ לַ/אֲשֶׁר ל֖/וֹ אֲחֻזַּ֥ת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: id
  text: Pada tahun Yobel, ladang itu harus kembali kepada orang yang darinya ladang itu dibeli, yaitu orang yang mempunyai hak milik atas tanah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yaitu orang yang memiliki tanah itu sebagai milik pusaka.” Kata Ibrani אֲחֻזַּת הָאָרֶץ menunjuk pada suatu milik atau pegangan berupa tanah; dalam konteks ini, tanah itu adalah bagian yang semula diberikan kepada suatu keluarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: Pada tahun Yobel
  rationale: Ungkapan ini menyatakan waktu. “Tahun Yobel” adalah istilah yang lazim dan jelas dalam konteks peraturan Imamat.
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: ladang itu harus kembali
  rationale: Bentuk imperfek menyatakan akibat hukum dalam ketentuan ini; “harus kembali” menyampaikan daya normatifnya dalam bahasa Indonesia alami.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: kepada orang yang darinya ladang itu dibeli
  rationale: Rumusan pasif menghindari penambahan subjek pembeli yang dapat terasa ambigu, sambil tetap menunjukkan bahwa ladang kembali kepada pemilik sebelumnya yang menjualnya.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: yaitu orang yang mempunyai hak milik atas tanah itu
  rationale: אֲחֻזָּה menunjuk pada milik atau pegangan atas tanah. “Hak milik atas tanah” mempertahankan corak hukumnya tanpa menjadikan unsur turun-temurun eksplisit dalam teks utama.
theological_decisions:
- issue: Sifat אֲחֻזַּת הָאָרֶץ dalam ketentuan Yobel
  choice: hak milik atas tanah itu
  alternative: tanah itu merupakan milik pusakanya
  rationale: Konteks luasnya menyangkut tanah keluarga yang diwariskan, tetapi kata אֲחֻזָּה sendiri berarti milik atau pegangan. Teks utama mempertahankan cakupan leksikal tersebut, sedangkan nuansa milik pusaka dicatat sebagai kemungkinan kontekstual.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah “Yobel” dipertahankan sebagai istilah baku Alkitab, sedangkan susunan klausa dibuat alami tanpa menghilangkan corak hukum ayat.
