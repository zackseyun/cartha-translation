  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Lalu Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; juga dialihaksarakan “Yahweh” atau “Yehuwa,” dan secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dan ragam penyajiannya dalam tradisi penerjemahan.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam rumus ujaran ilahi, דִּבֵּר paling alami dan bermartabat diterjemahkan dengan "berfirman" dalam bahasa Indonesia; waw naratif menghubungkan ayat ini dengan alur sebelumnya tanpa harus selalu dinyatakan sebagai "dan" pada awal bagian baru.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menerima firman; "kepada" adalah padanan Indonesia yang wajar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: (tersirat dalam tanda koma)
  rationale: Infinitif לֵאמֹר memperkenalkan isi ucapan berikutnya. Dalam bahasa Indonesia modern, fungsinya dapat dinyatakan secara alami dengan koma sebelum kutipan atau isi firman, tanpa frasa kaku "dengan mengatakan".
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. "Yahweh" mempertahankan nama tersebut dan mengikuti pembacaan ilmiah yang umum, sedangkan bentuk lain dicatat agar tradisi pembacaan yang dikenal pembaca tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. "Berfirman" dipakai untuk formula ujaran ilahi. Konjungsi pembuka waw tidak dibuat eksplisit karena ayat ini membuka unit baru dalam bahasa Indonesia; hubungan naratif tetap terjaga. לֵאמֹר dinyatakan secara idiomatis melalui tanda baca karena isi firman menyusul pada ayat berikutnya.
