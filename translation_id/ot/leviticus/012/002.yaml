source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: id
  text: 'Berbicaralah kepada orang Israel: “Apabila[a] seorang perempuan mengandung dan melahirkan seorang anak laki-laki[b], ia menjadi najis selama tujuh hari. Seperti pada hari-hari kenajisannya karena haid, ia menjadi najis.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Jika” atau “Ketika”. Partikel Ibrani ini memperkenalkan suatu kasus hukum dan dapat bernuansa kondisional atau temporal.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melahirkan seorang laki-laki”.
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah status najis dalam ketentuan kemurnian ritual, bukan penilaian moral terhadap perempuan atau persalinan.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini merupakan sebutan nasional-kovenantal bagi bangsa Israel. Dalam bahasa Indonesia, “orang Israel” menyampaikan rujukan kolektif itu secara wajar tanpa memberi kesan bahwa hanya anak laki-laki yang disapa.
- source_word: אִשָּׁה
  choice: seorang perempuan
  rationale: Dalam ketentuan hukum ini, kata tersebut berarti perempuan secara umum; konteksnya tidak mengharuskan arti “istri”.
- source_word: כִּי
  choice: apabila
  rationale: Partikel ini memperkenalkan suatu kasus hukum. “Apabila” terdengar alami dalam ragam hukum Indonesia dan tetap memungkinkan nuansa “jika” maupun “ketika”.
- source_word: תַזְרִיעַ
  choice: mengandung
  rationale: Bentuk kausatif dari akar yang berkaitan dengan benih secara idiomatis menunjuk pada terjadinya kehamilan. “Mengandung” menyatakan maksudnya secara jelas tanpa terjemahan harfiah yang janggal.
- source_word: וְיָלְדָה זָכָר
  choice: dan melahirkan seorang anak laki-laki
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan penegasan jenis kelamin laki-laki pada זָכָר.
- source_word: וְטָמְאָה ... תִּטְמָא
  choice: ia menjadi najis ... ia menjadi najis
  rationale: Pengulangan dalam bahasa Ibrani dipertahankan. “Menjadi najis” menyatakan perubahan atau berlakunya status kenajisan dalam konteks hukum kemurnian.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Preposisi “selama” memperjelas bahwa tujuh hari adalah jangka waktu status tersebut.
- source_word: כִּימֵי נִדַּת דְּוֺתָהּ
  choice: seperti pada masa kenajisannya karena haid
  rationale: Ungkapan ini membandingkan status sesudah melahirkan dengan kenajisan yang berkaitan dengan menstruasi. “Masa” menyampaikan jamak “hari-hari” secara alami, sedangkan “karena haid” menjelaskan hubungan antarkata tanpa menambahkan gagasan doktrinal.
theological_decisions:
- issue: Sifat kenajisan dalam hukum kemurnian
  choice: najis
  alternative: najis secara ritual
  rationale: Konteks Imamat menunjukkan bahwa yang dimaksud ialah status kemurnian ritual, tetapi teks Ibrani sendiri hanya memakai istilah “najis”. Karena itu, keterangan “secara ritual” tidak ditambahkan ke teks utama, melainkan dijelaskan dalam catatan kaki.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan Ibrani berbentuk maskulin jamak, tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” mempertahankan identitas nasionalnya dan menghindari salah pengertian bahwa yang disapa hanya anak-anak atau hanya laki-laki.
- issue: Nilai kondisional atau temporal dari כִּי
  choice: apabila
  alternative: jika; ketika
  rationale: Dalam rumusan hukum kasus, partikel ini dapat dipahami secara kondisional maupun temporal. “Apabila” menjaga keluwesan itu dan catatan kaki menyatakan alternatifnya secara terbuka.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Rumusan “Katakanlah kepada orang Israel” mempertahankan nada perintah ilahi tanpa kekakuan “berbicaralah ... dengan mengatakan”. Pengulangan “ia menjadi najis” dipertahankan karena menonjol dalam sumber Ibrani.
