source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: id
  text: Ketika masa penahirannya selesai, baik setelah melahirkan anak laki-laki maupun anak perempuan, perempuan itu harus membawa seekor anak domba berumur setahun sebagai kurban bakaran, serta seekor burung merpati muda atau burung tekukur sebagai kurban penghapus dosa[a], kepada imam di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban penahiran.” Istilah Ibraninya dapat menunjuk kepada kurban untuk menghapus kenajisan ritual, bukan hanya kepada kurban karena pelanggaran moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאת יְמֵי טָהֳרָהּ
  choice: Ketika masa penahirannya selesai
  rationale: Konstruksi ב + infinitif מלא menyatakan selesainya suatu jangka waktu. 'Masa penahirannya' menyampaikan makna ritual טָהֳרָה secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: לְבֵן אוֹ לְבַת
  choice: baik setelah melahirkan anak laki-laki maupun anak perempuan
  rationale: Frasa ini membedakan dua keadaan persalinan yang masa penahirannya diatur sebelumnya. Penambahan tersirat 'setelah melahirkan' memperjelas acuannya secara alami tanpa mengubah ketentuan.
- source_word: תָּבִיא
  choice: perempuan itu harus membawa
  rationale: Bentuk imperfek Hifil memiliki daya preskriptif dalam konteks hukum. 'Harus membawa' merupakan ungkapan kewajiban yang alami dalam bahasa Indonesia modern.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: seekor anak domba berumur setahun
  rationale: Ungkapan Ibrani menunjuk kepada anak domba dalam tahun pertamanya; terjemahan ini jelas dan idiomatis.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah teknis bagi persembahan yang dibakar. 'Kurban bakaran' mempertahankan kategori ritual tersebut.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: serta seekor anak burung merpati atau burung tekukur
  rationale: בֶּן יוֹנָה secara khusus berarti burung merpati muda, sedangkan תֹר berarti tekukur. Kedua jenis dipertahankan secara berbeda.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: חַטָּאת adalah istilah persembahan yang secara tradisional berkaitan dengan dosa, tetapi dalam konteks ini juga dapat dipahami sebagai kurban penahiran. Alternatif kontekstual dijaga dalam catatan kaki.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: kepada imam di pintu masuk Kemah Pertemuan
  rationale: Urutan ini mempertahankan imam sebagai penerima dan pintu masuk Kemah Pertemuan sebagai lokasi penyerahan.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks penahiran sesudah melahirkan
  choice: kurban penghapus dosa
  alternative: kurban penahiran
  rationale: Istilah teknis tradisional dipertahankan dalam teks utama demi kesinambungan kosakata korban, tetapi catatan kaki menjelaskan bahwa dalam konteks ini korban itu berkaitan dengan kenajisan ritual dan tidak dengan sendirinya menyatakan bahwa melahirkan merupakan dosa moral.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan istilah kultis yang konsisten. 'Penahiran' dipilih untuk menandai kemurnian ritual; 'Kemah Pertemuan' dipakai sebagai nama tempat ibadah. Penanda catatan kaki [a] ditempatkan langsung setelah istilah yang dijelaskan.
