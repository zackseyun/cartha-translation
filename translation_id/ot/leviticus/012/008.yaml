  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: id
  text: Namun, jika ia tidak mampu menyediakan seekor anak domba, ia harus mengambil dua ekor burung tekukur atau dua ekor anak burung merpati, yang seekor untuk kurban bakaran dan yang seekor lagi untuk kurban penghapus dosa[a]. Imam harus mengadakan pendamaian baginya, maka ia menjadi tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban penyucian”; dalam konteks ini kurban tersebut menangani kenajisan ritual sesudah melahirkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: ia tidak mampu menyediakan seekor anak domba
  rationale: Ungkapan harfiah 'tangannya tidak mendapatkan cukup untuk seekor domba' menunjuk pada keterbatasan kemampuan ekonomi. Pilihan ini menyampaikan maknanya secara alami tanpa menghilangkan kondisi sosial-ekonominya.
- source_word: שֶׂה
  choice: seekor anak domba
  rationale: Dalam konteks kurban dan berdasarkan kurban yang ditetapkan pada ayat sebelumnya, 'anak domba' merupakan padanan yang alami dan cukup spesifik.
- source_word: שְׁתֵּי תֹרִים
  choice: dua ekor burung tekukur
  rationale: תֹרִים secara khusus menunjuk pada burung tekukur, bukan burung merpati secara umum.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dua ekor anak burung merpati
  rationale: Ungkapan konstruksi ini secara idiomatis berarti burung merpati yang masih muda.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah Indonesia yang mapan untuk kurban yang dibakar di atas mezbah dan sepadan dengan istilah teknis Ibrani.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Padanan ini mempertahankan istilah kurban yang lazim dan hubungan leksikalnya dengan dosa, sementara kemungkinan makna 'kurban penyucian' dalam konteks kenajisan ritual dicatat dalam catatan kaki.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: Imam harus mengadakan pendamaian baginya
  rationale: Mengadakan pendamaian mempertahankan bobot kultis-teologis כפר tanpa menentukan secara berlebihan mekanismenya.
- source_word: וְטָהֵרָה
  choice: maka ia menjadi tahir
  rationale: Kata 'tahir' secara tepat menyatakan pemulihan kepada keadaan bersih secara ritual; bentuk 'menjadi' mencerminkan hasil tindakan ritual tersebut.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks pentahiran sesudah melahirkan
  choice: kurban penghapus dosa
  alternative: kurban penyucian
  rationale: Konteksnya membahas kenajisan ritual, bukan kesalahan moral pribadi. Namun, חַטָּאת merupakan istilah kurban yang secara tradisional berkaitan dengan dosa. Teks utama mempertahankan padanan istilah tersebut, sedangkan catatan kaki menyajikan alternatif kontekstual agar ketegangan maknanya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual 'kurban bakaran', 'pendamaian', dan 'tahir' dipertahankan karena tepat dan dikenal dalam wacana Alkitab, sedangkan idiom ekonomi Ibrani diterjemahkan secara alami.
