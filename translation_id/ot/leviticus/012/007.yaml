  to: Imam harus mempersembahkannya di hadapan Yahweh dan mengadakan pendamaian bagi perempuan itu. Dengan demikian, perempuan itu menjadi tahir dari sumber darahnya.[a] Inilah hukum mengenai perempuan yang melahirkan anak laki-laki ataupun anak perempuan.
