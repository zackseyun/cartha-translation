base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: id
  text: Imam harus mempersembahkannya di hadapan Yahweh dan mengadakan pendamaian bagi perempuan itu. Dengan demikian, perempuan itu menjadi tahir dari sumber darahnya.[a] Inilah hukum mengenai perempuan yang melahirkan anak laki-laki ataupun anak perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari aliran darahnya”. Secara harfiah, bahasa Ibrani berbunyi “dari sumber darahnya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: Ia harus mempersembahkannya
  rationale: Bentuk Hifil dari קרב dengan akhiran objek merujuk pada persembahan dalam ayat sebelumnya. “Mempersembahkannya” menyampaikan tindakan kultis secara alami tanpa menentukan jenis persembahan lebih jauh.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Frasa kultis ini berarti di hadapan atau dalam hadirat YHWH; nama perjanjian יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: dan mengadakan pendamaian bagi perempuan itu
  rationale: Dalam konteks korban imamat, כפר menyatakan tindakan ritual imam untuk mengadakan pendamaian. Ungkapan “bagi perempuan itu” mempertahankan fungsi עַל tanpa memasukkan teori pendamaian tertentu.
- source_word: וְטָהֲרָה
  choice: Dengan demikian, perempuan itu menjadi tahir
  rationale: Kata kerja ini menyatakan hasil tindakan sebelumnya, yaitu perubahan status menjadi tahir secara ritual. “Tahir” mempertahankan kosakata khas hukum kemurnian Imamat.
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: dari sumber darahnya
  rationale: מָקוֹר secara harfiah berarti sumber atau mata air. Terjemahan ini mempertahankan gambaran Ibrani, sementara arti kontekstual “aliran darah” dicatat dalam catatan kaki.
- source_word: זֹאת תּוֹרַת
  choice: Inilah hukum mengenai
  rationale: Dalam rumusan kitab Imamat ini, תּוֹרָה menunjuk pada ketentuan atau hukum ritual yang berlaku.
- source_word: הַיֹּלֶדֶת
  choice: perempuan yang melahirkan
  rationale: Partisip ini secara khusus menunjuk pada perempuan dalam kaitannya dengan persalinan; terjemahan ini lebih tepat daripada sekadar “ibu”.
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: anak laki-laki ataupun anak perempuan
  rationale: Secara harfiah teks menyebut “laki-laki atau perempuan”. Penambahan “anak” dalam bahasa Indonesia memperjelas bahwa istilah itu menunjuk pada bayi yang dilahirkan, tanpa mengubah cakupan maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama perjanjian tersebut, bukan menggantinya dengan gelar.
- issue: Makna pendamaian dalam konteks kenajisan sesudah melahirkan
  choice: mengadakan pendamaian bagi perempuan itu
  alternative: menyucikan perempuan itu
  rationale: Terjemahan mempertahankan istilah pendamaian untuk כפר dan membedakannya dari hasil ritual וְטָהֲרָה, “menjadi tahir”, sehingga teks tidak menyiratkan secara berlebihan bahwa persalinan itu sendiri merupakan dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Tahir” dipakai sebagai istilah ritual yang konsisten dengan konteks hukum kemurnian dalam Imamat. Subjek perempuan disebut ulang untuk menghindari ketidakjelasan rujukan pronomina.
