lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Ungkapan waktu ini diterjemahkan secara alami dalam bahasa Indonesia. Konjungsi וּ tidak perlu dinyatakan tersendiri karena hubungan berurutan sudah jelas dari konteks hukum.
- source_word: יִמּוֹל
  choice: harus disunat
  rationale: Bentuk Nifal imperfek menyampaikan tindakan pasif dalam ketentuan hukum. 'Harus disunat' mempertahankan bentuk pasif sekaligus menyatakan daya wajibnya secara wajar dalam bahasa Indonesia modern.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: kulit khatannya
  rationale: Secara harfiah frasa ini berarti 'daging kulit khatannya', tetapi dalam bahasa Indonesia ungkapan tersebut terasa janggal dan berlebihan. 'Kulit khatannya' menyampaikan bagian tubuh yang dimaksud dengan jelas dan wajar.
