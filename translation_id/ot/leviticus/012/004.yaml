  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: id
  text: Selama tiga puluh tiga hari, hendaklah ia tetap berada dalam masa darah penyuciannya.[a] Ia tidak boleh menyentuh apa pun yang kudus dan tidak boleh masuk ke tempat kudus sampai genap hari-hari penyuciannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam darah penyucian.” Bentuk Ibraninya memakai kata “darah-darah” dan menunjuk pada masa pascapersalinan yang berkaitan dengan pendarahan serta pemurnian ritual.
    reason: Menjelaskan ungkapan Ibrani yang tidak lazim, termasuk bentuk pluralnya, tanpa menghilangkan gambaran konkret atau menambahkan penilaian moral.
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: selama tiga puluh tiga hari
  rationale: Ungkapan Ibrani secara harfiah menyebut “tiga puluh hari dan tiga hari”; bahasa Indonesia wajar merangkumnya sebagai “tiga puluh tiga hari,” dengan “selama” untuk menyatakan durasi.
- source_word: תֵּשֵׁב
  choice: ia harus tetap berada
  rationale: Kata kerja יָשַׁב dapat berarti duduk, tinggal, atau tetap berada. Dalam ketentuan ritual ini, maksudnya ialah berlanjut dalam suatu keadaan selama jangka waktu tertentu.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: dalam masa darah penyuciannya
  rationale: Terjemahan ini mempertahankan gambaran konkret “darah” sekaligus memakai “masa” agar hubungan frasa tersebut dengan periode pascapersalinan dapat dipahami secara alami dalam bahasa Indonesia. Akhiran posesif dipahami dari konteks dan dinyatakan secara eksplisit kemudian dalam ayat.
- source_word: בְּ/כָל קֹדֶשׁ
  choice: apa pun yang kudus
  rationale: Frasa ini secara harfiah berarti sesuatu yang kudus dan cakupannya dibiarkan luas, tanpa membatasinya pada jenis benda tertentu.
- source_word: לֹא תִגָּע
  choice: ia tidak boleh menyentuh
  rationale: Bentuk larangan hukum diterjemahkan dengan “tidak boleh,” ungkapan baku dan jelas dalam bahasa Indonesia modern.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: dan tidak boleh masuk ke tempat kudus
  rationale: מִקְדָּשׁ menunjuk pada tempat kudus atau tempat ibadah yang dikhususkan. “Masuk ke” menyampaikan arah gerak verba dan preposisi secara alami.
- source_word: עַד מְלֹאת
  choice: sampai genap
  rationale: Bentuk מְלֹאת menyatakan tercapainya kepenuhan atau selesainya suatu masa; “sampai genap” ringkas dan idiomatis.
- source_word: יְמֵי טָהֳרָהּ
  choice: hari-hari penyuciannya
  rationale: טָהֳרָה di sini merupakan istilah kemurnian ritual. “Penyucian” mempertahankan kategori kultis, dan akhiran feminin dinyatakan dengan “-nya.”
theological_decisions:
- issue: Istilah kemurnian ritual tanpa menyiratkan kesalahan moral
  choice: penyucian
  alternative: pembersihan
  rationale: Ayat ini mengatur status ritual sesudah persalinan, bukan menyatakan bahwa persalinan atau sang ibu merupakan kesalahan moral. “Penyucian” mempertahankan ranah ritual teks tanpa menambahkan klaim tentang dosa pribadi.
- issue: Makna frasa sulit “darah penyucian”
  choice: masa darah penyuciannya
  alternative: darah penyuciannya
  rationale: Tambahan “masa” menjelaskan bahwa frasa itu menunjuk pada periode pascapersalinan, tetapi unsur “darah” tetap dipertahankan agar ketegangan dan gambaran konkret bahasa Ibrani tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum dinyatakan dengan “harus” dan “tidak boleh.” Istilah “penyucian” dan “tempat kudus” mempertahankan ranah ritual tanpa memasukkan penilaian moral yang tidak dinyatakan teks.
