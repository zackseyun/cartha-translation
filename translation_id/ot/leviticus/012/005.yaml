  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: id
  text: Namun, jika ia melahirkan anak perempuan, ia menjadi najis selama dua minggu, seperti pada masa haidnya[a]. Selama enam puluh enam hari ia harus tetap menjalani masa darah pentahiran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “seperti pada masa kenajisannya karena haid.” Bahasa Ibrani membandingkan kenajisannya setelah melahirkan dengan keadaan yang berkaitan dengan haid.
    reason: lexical_alternative
  - marker: b
    text: “Darah pentahiran” menunjuk pada masa pentahiran yang ditetapkan setelah persalinan, bukan pada kesalahan atau kenajisan moral.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Dalam konteks ini, gabungan konjungsi dan partikel bersyarat memperkenalkan kasus yang berbeda dari ayat sebelumnya; “Namun, jika” menyatakan kontras itu secara wajar.
- source_word: נְקֵבָה תֵלֵד
  choice: ia melahirkan anak perempuan
  rationale: נְקֵבָה berarti perempuan atau betina; dalam konteks kelahiran manusia, “anak perempuan” jelas dan alami tanpa mengubah acuannya menjadi istilah kekerabatan yang lebih interpretatif.
- source_word: וְטָמְאָה
  choice: ia menjadi najis
  rationale: Bentuk ini menyatakan status kenajisan ritual sebagai akibat kelahiran. “Menjadi najis” alami dalam bahasa Indonesia dan tidak dengan sendirinya menyatakan kesalahan moral.
- source_word: שְׁבֻעַיִם
  choice: selama dua minggu
  rationale: Bentuk dual ini menunjuk pada dua pekan; terjemahan langsung sebagai “dua minggu” jelas dan tepat.
- source_word: כְּנִדָּתָהּ
  choice: seperti pada masa haidnya
  rationale: נִדָּה di sini menunjuk pada keadaan atau masa yang berkaitan dengan menstruasi. Ungkapan ini ringkas dan alami, sementara catatan kaki menjelaskan unsur kenajisan ritual dalam perbandingan tersebut.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: selama enam puluh enam hari
  rationale: Bilangan Ibrani secara harfiah tersusun sebagai enam puluh hari dan enam hari; bahasa Indonesia secara alami menggabungkannya menjadi “enam puluh enam hari”.
- source_word: תֵּשֵׁב
  choice: ia harus tetap
  rationale: Kata ini secara harfiah dapat berarti duduk, tinggal, atau menetap, tetapi dalam konteks hukum ini menyatakan keberlanjutan dalam suatu keadaan atau masa.
- source_word: עַל דְּמֵי טָהֳרָה
  choice: dalam masa darah pentahiran
  rationale: Ungkapan Ibrani secara harfiah memakai bentuk jamak “darah-darah pentahiran.” Penambahan “masa” menyampaikan fungsi idiomatisnya dalam konteks periode pascapersalinan, sedangkan “darah pentahiran” mempertahankan kategori ritual sumber.
theological_decisions:
- issue: Sifat kenajisan sesudah persalinan
  choice: Memakai istilah “najis” sebagai status ritual tanpa menambahkan bahwa perempuan itu berdosa atau tercemar secara moral.
  alternative: “najis secara ritual” atau “najis secara upacara”
  rationale: Konteks Imamat mengatur status ritual-kultis. Menambahkan keterangan dalam teks utama akan memperjelas, tetapi tidak dinyatakan secara eksplisit dalam frasa Ibrani; istilah sumber dipertahankan tanpa memasukkan penilaian moral.
- issue: Makna “darah pentahiran”
  choice: Mempertahankan ungkapan ritual sebagai “masa darah pentahiran” dan menjelaskannya dalam catatan kaki.
  alternative: “masa pentahiran setelah melahirkan”
  rationale: Pilihan utama mempertahankan kaitan eksplisit dengan darah dalam teks Ibrani sekaligus membuat fungsi temporal ungkapan itu dapat dipahami. Alternatif lebih mudah dipahami, tetapi menghilangkan unsur “darah”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang lugas dan bermartabat. Istilah tradisional “najis” dan “pentahiran” dipertahankan karena ketepatan ritualnya, sedangkan susunan kalimat dibuat alami bagi pembaca masa kini.
