id: LEV.24.3
reference: Leviticus 24:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: id
  text: Di luar tabir Kesaksian[a], di dalam Kemah Pertemuan, Harun harus menatanya dari petang sampai pagi di hadapan Yahweh, secara tetap.[b] Inilah ketetapan untuk selamanya[c] bagi kamu turun-temurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tirai Kesaksian”. “Kesaksian” berkaitan dengan Kesaksian perjanjian yang ditempatkan di dalam tabut.
    reason: lexical_alternative
  - marker: b
    text: “Secara tetap” di sini dapat menunjuk pada pelaksanaan upacara yang tetap dan berulang, yang waktunya disebutkan sebagai “dari petang sampai pagi”.
    reason: cultural_note
  - marker: c
    text: Atau “ketetapan kekal” atau “ketetapan tetap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: Di luar tabir Kesaksian
  rationale: מִחוּץ menyatakan lokasi di luar; פָרֹכֶת adalah tabir bagian dalam tempat kudus; הָעֵדֻת dipertahankan sebagai istilah kultis “Kesaksian” tanpa mempersempitnya secara eksplisit menjadi loh atau dokumen perjanjian.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di dalam Kemah Pertemuan
  rationale: Ini adalah sebutan baku bagi kemah suci; “di dalam” menyatakan lokasi dengan wajar dalam bahasa Indonesia.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: harus menatanya
  rationale: Dalam konteks ibadah, ערך berarti menata atau mengatur sebagaimana mestinya. Pronomina tunggal tetap dipertahankan sebagai “-nya”, dengan rujukannya dibiarkan mengikuti konteks ayat sebelumnya.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: dari petang sampai pagi
  rationale: Mengungkapkan rentang waktu secara langsung dan alami dalam bahasa Indonesia modern.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי dalam konteks ibadah menunjukkan kehadiran di hadapan Allah, sedangkan nama ilahi ditransliterasikan sebagai “Yahweh”.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Pilihan ini mempertahankan gagasan keberlangsungan tanpa meniadakan keterangan eksplisit “dari petang sampai pagi”; catatan kaki menjelaskan nuansa pelaksanaan yang tetap dan berulang.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan untuk selamanya
  rationale: Frasa ini menyatakan ketetapan yang terus berlaku. Bentuk ini alami dan tetap mempertahankan daya ungkap עוֹלָם tanpa menetapkan teori khusus tentang cakupan waktunya.
- source_word: לְדֹרֹתֵיכֶם
  choice: bagi kamu turun-temurun
  rationale: Ungkapan Indonesia “turun-temurun” menyampaikan keberlakuan bagi generasi-generasi berikutnya secara ringkas dan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Hubungan תָּמִיד dengan rentang waktu dari petang sampai pagi
  choice: senantiasa, dengan catatan penjelas
  alternative: secara tetap; setiap malam; terus-menerus
  rationale: Dalam peraturan keimaman, תָּמִיד dapat menunjuk pada pelaksanaan yang terus berlaku secara teratur. Karena ayat ini sendiri membatasi pelayanan lampu dari petang sampai pagi, terjemahan tidak memaksanya berarti nyala tanpa jeda sepanjang siang dan malam.
- issue: Cakupan waktu חֻקַּת עוֹלָם
  choice: ketetapan untuk selamanya
  alternative: ketetapan kekal; ketetapan tetap
  rationale: Terjemahan mempertahankan kekuatan ungkapan Ibrani mengenai keberlakuan yang berkelanjutan tanpa memasukkan pembatasan atau kerangka teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah kultis “tabir Kesaksian” dan “Kemah Pertemuan” dipertahankan, sedangkan susunan kalimat dibuat alami tanpa menjauh dari urutan dan hubungan sintaksis teks Ibrani.
