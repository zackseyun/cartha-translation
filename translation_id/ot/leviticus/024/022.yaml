  text: מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָ/כֶ֔ם כַּ/גֵּ֥ר כָּ/אֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: id
  text: Satu standar hukum harus berlaku bagi kamu, baik bagi pendatang maupun bagi warga asli, sebab Akulah TUHAN, Allahmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: satu standar hukum
  rationale: Ungkapan ini secara harfiah berarti 'satu hukum/putusan' dan dalam konteks menegaskan satu standar hukum yang sama bagi semua orang.
- source_word: גֵּר
  choice: pendatang
  rationale: Menunjuk kepada orang asing yang tinggal di tengah komunitas Israel; 'pendatang' alami dalam bahasa Indonesia dan mempertahankan perbedaannya dari warga asli.
- source_word: אֶזְרָח
  choice: warga asli
  rationale: Menunjuk kepada anggota pribumi komunitas, sebagai pasangan kontras bagi pendatang.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia untuk menyatakan nama ilahi dengan huruf kapital.
theological_decisions:
- issue: Kesetaraan pendatang dan warga asli di hadapan hukum
  choice: baik bagi pendatang maupun bagi warga asli
  alternative: seperti bagi pendatang, demikian juga bagi warga asli
  rationale: Menyampaikan kesejajaran hukum dengan jelas tanpa menambahkan pembatasan atau penafsiran teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan berwibawa. Susunan kalimat dibuat alami sambil mempertahankan penekanan teks pada satu standar hukum dan dasar ilahinya.
