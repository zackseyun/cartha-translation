base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Kemudian Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN.”'
    reason: Mencatat bentuk nama ilahi dalam bahasa Ibrani dan penyajian tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. “Kemudian” menyatakan urutan secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang dituju dalam tindakan berbicara; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk baku nama מֹשֶׁה dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Ibrani, infinitif ini memperkenalkan perkataan langsung. Karena ayat berikutnya langsung memuat isi firman, fungsinya sudah terwakili secara alami oleh tanda koma; menerjemahkannya sebagai “demikian” dapat memberi kesan bahwa kata itu bagian dari isi ucapan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehovah” mencerminkan bentuk pelafalan tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Berfirman” dipilih sebagai verba tutur yang lazim ketika Allah menjadi subjek. Koma mempertahankan hubungan sintaksis dengan isi firman pada ayat berikutnya.
