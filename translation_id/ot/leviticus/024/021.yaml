  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: id
  text: Siapa pun yang memukul mati seekor hewan harus memberikan ganti rugi atasnya, tetapi siapa pun yang memukul mati seorang manusia[a] harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani אָדָם dapat berarti “manusia” atau “orang”; bentuk tunggal dalam rumusan hukum ini tidak dengan sendirinya membatasi maknanya pada laki-laki.
    reason: Menjelaskan cakupan istilah Ibrani dan mempertahankan kemungkinan nuansa bentuk maskulin tunggal tanpa mempersempit maknanya.
lexical_decisions:
- source_word: מַכֵּה
  choice: yang memukul mati
  rationale: Partisipel Hifil dari נכה menyatakan tindakan memukul yang berakibat fatal dalam konteks ini. Ungkapan “memukul mati” mempertahankan gambaran tindakan dalam teks sekaligus memperjelas akibatnya.
- source_word: בְהֵמָה
  choice: seekor hewan
  rationale: Istilah ini menunjuk pada hewan, terutama hewan peliharaan atau ternak. “Hewan” jelas dan tidak mempersempit maknanya hanya pada jenis ternak tertentu.
- source_word: יְשַׁלְּמֶנָּה
  choice: harus menggantinya
  rationale: Bentuk Piel dari שלם di sini berarti memberi ganti rugi atau penggantian. Akhiran pronominal feminin merujuk kepada בְהֵמָה secara gramatikal, bukan kepada jenis kelamin hewan.
- source_word: אָדָם
  choice: seorang manusia
  rationale: Dalam pertentangan dengan hewan, אָדָם menunjuk kepada seorang pribadi manusia. Bahasa Indonesia tidak memerlukan kata yang berjenis kelamin maskulin untuk mempertahankan bentuk hukum kasus tunggal.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hophal menyatakan bahwa pelaku dibuat mati, yakni dijatuhi hukuman mati. “Harus dihukum mati” menyampaikan bentuk pasif dan konteks yudisial dengan wajar.
theological_decisions:
- issue: Cakupan אָדָם dalam rumusan hukum
  choice: seorang manusia
  alternative: seorang laki-laki
  rationale: אָדָם dapat menunjuk kepada manusia secara umum dan di sini dikontraskan dengan hewan. Walaupun bentuk hukum Ibraninya tunggal dan secara gramatikal maskulin, konteksnya tidak secara tegas membatasi korban pada laki-laki.
translation_notes:
  register: Bahasa hukum yang ringkas, tegas, dan modern. “Memukul mati” dipilih untuk menjaga citra leksikal נכה sekaligus menyatakan bahwa pukulan tersebut berakibat fatal; “menggantinya” menyampaikan kewajiban restitusi secara alami dalam bahasa Indonesia.
