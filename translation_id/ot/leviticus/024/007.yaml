  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: id
  text: Letakkanlah kemenyan murni pada tiap susunan roti itu[a]. Kemenyan itu akan menjadi bagian pengingat bagi roti tersebut—suatu persembahan yang dibakar bagi Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada susunan itu”; dalam konteksnya, yang dimaksud ialah masing-masing dari dua susunan roti pada ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan makanan bagi Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Taruhlah
  rationale: Bentuk perfektif dengan waw dalam rangkaian petunjuk ritual berfungsi sebagai perintah; “taruhlah” alami dan tepat untuk tindakan menempatkan kemenyan.
- source_word: הַמַּעֲרֶכֶת
  choice: setiap susunan roti itu
  rationale: Kata benda tunggal ini menunjuk pada susunan yang teratur. Dalam konteks ayat sebelumnya terdapat dua susunan roti, sehingga maknanya bersifat distributif; unsur “roti” ditambahkan secara kontekstual untuk memperjelas acuannya.
- source_word: לְבֹנָה זַכָּה
  choice: kemenyan murni
  rationale: לְבֹנָה adalah damar kemenyan, sedangkan זַכָּה menyatakan kemurnian yang sesuai untuk pemakaian ritual.
- source_word: לַלֶּחֶם
  choice: bagi roti tersebut
  rationale: Bentuk tunggal לֶחֶם dipakai secara kolektif untuk seluruh roti yang telah disusun.
- source_word: לְאַזְכָּרָה
  choice: bagian pengingat
  rationale: Istilah kultis ini menunjuk pada bagian representatif dari persembahan yang dipersembahkan kepada Allah; “bagian pengingat” menyampaikan fungsi ritual itu tanpa menentukan secara berlebihan siapa yang diingatkan.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Dalam bahasa ritual Imamat, istilah ini menunjuk pada persembahan yang diserahkan melalui api. Terjemahan ini jelas dalam bahasa Indonesia dan sesuai dengan tindakan membakar kemenyan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menyatakan penerima atau tujuan persembahan, dan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Makna לְאַזְכָּרָה dalam ritual persembahan
  choice: bagian pengingat
  alternative: peringatan
  rationale: Pilihan ini mempertahankan gagasan bahwa kemenyan berfungsi sebagai bagian representatif bagi seluruh roti, tanpa menjelaskan secara spekulatif apakah fungsi ‘mengingat’ terutama diarahkan kepada Allah atau umat.
- issue: Pemaknaan אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan makanan
  rationale: Bentuk dan etimologi istilah ini diperdebatkan, tetapi dalam konteks ini kemenyan memang dibakar. Terjemahan utama mengikuti fungsi ritual yang nyata, sedangkan alternatif penting dicatat dalam catatan kaki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Kalimat Ibrani yang panjang dibagi menjadi dua agar mudah dipahami, sementara hubungan antara kemenyan, roti, bagian pengingat, dan persembahan tetap dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
