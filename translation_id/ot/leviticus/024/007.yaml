  to: Letakkanlah kemenyan murni pada tiap susunan roti itu[a]. Kemenyan itu akan menjadi bagian pengingat bagi roti tersebut—suatu persembahan yang dibakar bagi Yahweh[b].
  rationale: Revisi ini mempertahankan semua unsur pokok teks sumber dan ambiguitas leksikal yang relevan. “Letakkanlah” meningkatkan register, sedangkan tanda pisah menjelaskan bahwa kemenyan berfungsi sebagai bagian pengingat bagi roti dan sebagai persembahan bagi Yahweh. Catatan kaki b dipadatkan agar hanya menyajikan alternatif leksikal.
