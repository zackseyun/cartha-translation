id: LEV.24.8
reference: Leviticus 24:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/י֨וֹם הַ/שַּׁבָּ֜ת בְּ/י֣וֹם הַ/שַּׁבָּ֗ת יַֽעַרְכֶ֛/נּוּ לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד מֵ/אֵ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: id
  text: Setiap Sabat ia harus menyusunnya di hadapan Yahweh secara teratur, dari orang Israel sebagai perjanjian kekal.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada hari Sabat, pada hari Sabat”; pengulangan ini menyatakan “Sabat demi Sabat” atau “setiap Sabat.”
    reason: Menjelaskan fungsi distributif pengulangan Ibrani.
  - marker: b
    text: Frasa Ibrani juga dapat diterjemahkan, “suatu perjanjian kekal.”
    reason: Mempertahankan kemungkinan bahwa בְּרִית עוֹלָם dibaca sebagai frasa nominal.
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: Setiap hari Sabat
  rationale: Pengulangan Ibrani bersifat distributif, yakni menunjuk pada pelaksanaan yang berulang pada setiap Sabat; ungkapan ini menyampaikan maksud itu secara alami dalam bahasa Indonesia.
- source_word: יַעַרְכֶנּוּ
  choice: ia harus menatanya
  rationale: Kata kerja ערך berarti menata atau menyusun dengan teratur dalam konteks ritual. Sufiks tunggal merujuk secara kolektif kepada susunan roti yang dibicarakan sebelumnya.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan kultis ini menunjukkan penempatan di hadirat Yahweh, dan nama ilahi dipertahankan sebagai Yahweh.
- source_word: תָּמִיד
  choice: secara tetap
  rationale: Dalam konteks keimaman, kata ini dapat menyatakan pelaksanaan teratur dan berkesinambungan, bukan tindakan fisik tanpa henti; jadwal mingguannya sudah dinyatakan pada awal ayat.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: dari bani Israel
  rationale: מֵאֵת menandai sumber atau asal. 'Bani Israel' mempertahankan bentuk korporat ungkapan Ibrani sambil tetap wajar dan mudah dikenali dalam bahasa Indonesia.
- source_word: בְּרִית עוֹלָם
  choice: sebagai perjanjian untuk selama-lamanya
  rationale: Terjemahan ini mempertahankan istilah perjanjian dan cakupan waktunya tanpa menambahkan gagasan 'kewajiban' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk 'Yahweh' mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Makna korporat בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: Pilihan ini mempertahankan citra keturunan dan sifat korporat frasa sumber tanpa membatasi acuannya hanya kepada laki-laki secara individual.
- issue: Hubungan sintaksis בְּרִית עוֹלָם
  choice: sebagai perjanjian untuk selama-lamanya
  alternative: suatu perjanjian untuk selama-lamanya
  rationale: Kata-kata Ibrani tidak menyatakan secara eksplisit unsur mana yang diterangkan oleh frasa ini. 'Sebagai' menyampaikan fungsi perjanjian ritual tersebut, sementara catatan kaki mengakui kemungkinan pembacaan yang lebih nominal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Menatanya' alami untuk tindakan ritual penyusunan; 'secara tetap' menghindari kesan bahwa tindakan itu berlangsung tanpa henti. Penanda catatan kaki ditempatkan tepat setelah frasa yang memiliki nuansa leksikal dan sintaksis.
