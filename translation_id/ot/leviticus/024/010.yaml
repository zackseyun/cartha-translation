  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ בֶּן אִשָּׁ֣ה יִשְׂרְאֵלִ֔ית וְ/הוּא֙ בֶּן אִ֣ישׁ מִצְרִ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּנָּצוּ֙ בַּֽ/מַּחֲנֶ֔ה בֶּ֚ן הַ/יִּשְׂרְאֵלִ֔ית וְ/אִ֖ישׁ הַ/יִּשְׂרְאֵלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: id
  text: Seorang anak laki-laki dari seorang perempuan Israel, yang ayahnya seorang pria Mesir, keluar di antara anak-anak Israel.[a] Di perkemahan, anak laki-laki dari perempuan Israel itu berkelahi dengan seorang laki-laki Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “di tengah anak-anak Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bertengkar dengan.” Kata Ibrani ini dapat menunjuk pada pertengkaran atau perkelahian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Bentuk naratif dari יצא menyatakan gerakan keluar tanpa menjelaskan dari mana; “keluar” mempertahankan ketidakjelasan itu.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: anak laki-laki seorang perempuan Israel
  rationale: Ungkapan ini mengidentifikasi tokoh tersebut melalui garis keturunan ibunya; “anak laki-laki” juga memperjelas jenis kelamin tokoh sesuai konteks.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: ayahnya seorang laki-laki Mesir
  rationale: Ungkapan idiomatis ini menyampaikan identitas ayah secara alami dalam bahasa Indonesia tanpa mengubah hubungan kekeluargaannya.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ke tengah-tengah anak-anak Israel
  rationale: בְּתוֹךְ berarti “di tengah/di antara”; “anak-anak Israel” mempertahankan sebutan kebangsaan perjanjian dalam bahasa Ibrani.
- source_word: וַיִּנָּצוּ
  choice: berkelahi
  rationale: Bentuk Niphal נצה dapat menunjuk pada pertengkaran atau perkelahian. “Berkelahi” cocok dengan eskalasi kisah, sementara kemungkinan makna yang lebih verbal dicatat dalam catatan kaki.
- source_word: בַּמַּחֲנֶה
  choice: di perkemahan
  rationale: Terjemahan lokatif yang langsung dan alami untuk tempat tinggal perkemahan Israel.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: anak laki-laki perempuan Israel itu
  rationale: Pengulangan sebutan tokoh dipertahankan untuk mengikuti penekanan dan identifikasi dalam teks Ibrani.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: dengan seorang laki-laki Israel
  rationale: Frasa ini membedakan tokoh pertama dari seorang laki-laki lain yang disebut sebagai orang Israel; preposisi “dengan” diperlukan secara idiomatis sesudah “berkelahi”.
theological_decisions:
- issue: Sebutan kebangsaan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel
  rationale: Pilihan utama mempertahankan bentuk ungkapan kebangsaan tradisional dalam bahasa Ibrani tanpa menafsirkan kelompok itu secara lebih sempit atau lebih luas daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Tanda pisah merangkum keterangan tentang ayah agar hubungan antarklausa jelas. Pengulangan “anak laki-laki perempuan Israel itu” dipertahankan karena menonjol dalam sumber.
