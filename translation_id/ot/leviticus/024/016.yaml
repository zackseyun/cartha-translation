source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: id
  text: Siapa pun yang menghujat nama Yahweh haruslah dihukum mati[a]. Seluruh jemaat harus merajamnya dengan batu. Baik orang asing yang menetap maupun orang kelahiran asli—apabila ia menghujat Nama[b]—harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani ini juga dapat diterjemahkan “mengucapkan nama Yahweh dengan jelas” atau “mengutuk nama Yahweh”. Dalam konteks ini, kata tersebut dapat menunjuk pada pengucapan yang mencemarkan atau menghina.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “nama”. Di sini “Nama” berdiri sendiri sebagai sebutan penuh hormat bagi nama ilahi.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב
  choice: siapa pun yang menghujat
  rationale: Kata kerja נקב dapat berarti menyebut atau mengucapkan dengan jelas, tetapi dalam konteks hukum ini menunjuk pada penggunaan nama ilahi secara mencemarkan. “Menghujat” menyampaikan daya idiomatisnya tanpa menyatakan bahwa sekadar mengucapkan nama itu merupakan pelanggaran.
- source_word: שֵׁם יְהוָה
  choice: nama Yahweh
  rationale: שֵׁם berarti “nama”, sedangkan יהוה dialihaksarakan sebagai “Yahweh” untuk mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: מוֹת יוּמָת
  choice: harus dihukum mati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan rumusan hukum tentang pelaksanaan hukuman mati. Bentuk pasif dan kewajiban hukumnya dipertahankan dalam bahasa Indonesia yang alami.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: harus melempari dia dengan batu
  rationale: Ungkapan ini memerintahkan pelaksanaan hukuman dengan rajam; pronomina objek pada בו diterjemahkan sebagai “dia”. Kata “harus” mempertahankan daya wajib dari rumusan hukum tersebut.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk pada komunitas Israel sebagai keseluruhan yang terhimpun. “Seluruh umat” alami dan tetap memiliki nuansa komunal.
- source_word: כַּגֵּר
  choice: pendatang
  rationale: גֵּר ialah orang bukan pribumi yang tinggal di tengah Israel. “Pendatang” ringkas dan mudah dipahami dalam pertentangannya dengan orang asli.
- source_word: כָּאֶזְרָח
  choice: orang asli
  rationale: אֶזְרָח menunjuk pada anggota pribumi komunitas dan secara langsung dikontraskan dengan גֵּר.
- source_word: בְּנָקְבוֹ שֵׁם
  choice: apabila ia menghujat Sang Nama
  rationale: ב dengan infinitif konstruk dibaca secara temporal atau kondisional. “Sang Nama” mempertahankan pemakaian absolut “Nama” sebagai sebutan penuh hormat bagi nama ilahi.
- source_word: יוּמָת
  choice: ia harus dihukum mati
  rationale: Bentuk pasif dalam rumusan hukum penutup dipertahankan dan mengulang konsekuensi yang dinyatakan pada awal ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna נקב ketika berobjek nama ilahi
  choice: menghujat
  alternative: mengucapkan atau mengutuk
  rationale: Dalam konteks tindak pidana dan hukuman mati, “menghujat” paling alami menyampaikan pencemaran nama ilahi. Namun, karena jangkauan leksikal kata Ibrani diperdebatkan, kemungkinan “mengucapkan dengan jelas” dan “mengutuk” dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum. “Seluruh umat” dipilih agar dapat dipahami luas tanpa kehilangan dimensi komunal, sedangkan pengulangan “harus dihukum mati” mempertahankan struktur dan ketegasan teks sumber.
