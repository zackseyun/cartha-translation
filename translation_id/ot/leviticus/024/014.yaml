  source_fidelity: Teks Indonesia secara akurat mencerminkan imperatif kausatif untuk membawa pelaku ke luar perkemahan, partisipel Ibrani yang secara harfiah berarti “orang yang mengutuk,” tindakan penumpangan tangan oleh semua pendengar, dan pelaksanaan rajam oleh seluruh umat. Tidak menambahkan objek pada “yang mendengar” secara tepat mempertahankan ketaktersebutan objek dalam bentuk Ibrani, meskipun konteksnya mengarah pada orang-orang yang mendengar pelanggaran itu.
  naturalness: Bahasa Indonesia baku, jelas, dan sesuai register hukum. Rangkaian “Bawalah … Semua orang … harus … lalu seluruh umat harus …” dapat dipahami dengan baik dan menyampaikan daya perintah berurutan dari teks sumber.
  terminology: “Orang yang mengutuk itu” mempertahankan leksikon Ibrani tanpa menaikkan tafsiran “penghujat” ke teks utama. “Menumpangkan tangan,” “perkemahan,” “merajam,” dan “seluruh umat” tepat dan konsisten dengan konteks hukum-komunal. Catatan kaki mempertahankan alternatif dan ketidakpastian makna tindakan tanpa memaksakan penafsiran teologis.
