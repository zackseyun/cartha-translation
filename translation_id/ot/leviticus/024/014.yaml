source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: id
  text: Bawalah orang yang mengutuk itu ke luar perkemahan.[a] Semua orang yang mendengar harus menumpangkan tangan mereka di atas kepalanya,[b] lalu seluruh umat harus merajam dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penghujat itu” atau “orang yang menghujat itu”. Secara harfiah, bahasa Ibrani menyebutnya “orang yang mengutuk itu”.
    reason: alternative_reading
  - marker: b
    text: Penumpangan tangan di sini kemungkinan menandai pengenalan resmi pelaku oleh para saksi, meskipun ada juga yang memahami tindakan ini memiliki makna simbolis.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: Bawalah ... ke luar
  rationale: Bentuk imperatif kausatif dari יצא berarti menyuruh atau menyebabkan seseorang keluar. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyatakan arah menuju luar perkemahan.
- source_word: הַמְקַלֵּל
  choice: orang yang mengutuk itu
  rationale: Partisipel dari קלל menunjuk kepada pelaku tertentu dalam konteks. Pilihan ini mempertahankan arti leksikal ‘mengutuk’ tanpa langsung menafsirkannya sebagai ‘menghujat’.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Ungkapan ruang ini menunjukkan tempat di luar batas perkemahan. ‘Ke luar perkemahan’ sesuai dengan verba gerak dan alami dalam bahasa Indonesia.
- source_word: וְסָמְכוּ
  choice: harus menumpangkan
  rationale: סמך dengan tangan di atas kepala merupakan ungkapan tindakan menumpangkan tangan. ‘Harus’ meneruskan daya perintah dari imperatif pembuka tanpa menjelaskan makna simbolis tindakan itu.
- source_word: כָל הַשֹּׁמְעִים
  choice: semua orang yang mendengar
  rationale: Partisipel ini secara harfiah menunjuk kepada semua orang yang mendengar. Objek yang didengar tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: tangan mereka di atas kepalanya
  rationale: Terjemahan ini mempertahankan bentuk jamak ‘tangan’ dan bentuk tunggal ‘kepala’, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: harus merajam dia
  rationale: רגם adalah verba baku untuk pelaksanaan hukuman mati dengan batu. ‘Merajam’ merupakan padanan Indonesia yang tepat dan ringkas.
- source_word: כָל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai perhimpunan perjanjian. ‘Seluruh umat’ menjaga sifat komunalnya dan lebih alami bagi pembaca Indonesia modern daripada ‘seluruh jemaat’ dalam konteks hukum ini.
theological_decisions:
- issue: Apakah pelaku disebut ‘orang yang mengutuk’ atau ‘penghujat’
  choice: orang yang mengutuk itu
  alternative: penghujat; orang yang menghujat
  rationale: Istilah Ibrani langsungnya adalah partisipel dari קלל, ‘mengutuk’. Konteks yang lebih luas memang menyangkut penghujatan terhadap Nama Allah, tetapi terjemahan utama mempertahankan arti leksikal dan menempatkan penafsiran tersebut dalam catatan kaki.
- issue: Makna penumpangan tangan oleh para pendengar
  choice: Tindakan harfiahnya dipertahankan tanpa diberi penjelasan dalam teks utama.
  alternative: Menafsirkannya sebagai pengenalan resmi oleh para saksi atau sebagai tindakan simbolis yang memindahkan kesalahan.
  rationale: Ayat ini memerintahkan tindakan tersebut tetapi tidak menjelaskan maknanya. Karena itu, terjemahan tidak menetapkan satu tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara urutan perintah dan istilah konkret dalam teks Ibrani dipertahankan. Semua penanda catatan kaki dicantumkan dalam teks utama.
