  naturalness: '"Lalu mereka menahannya dalam tahanan" dan "berdasarkan firman Yahweh" alami dalam bahasa Indonesia baku. Penggantian konstruksi "sampai perkara itu dijelaskan" dengan klausa tujuan menghasilkan alur yang lebih tepat dan tetap idiomatis.'
