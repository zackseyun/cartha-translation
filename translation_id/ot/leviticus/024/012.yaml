  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: id
  text: Lalu mereka menahannya dalam tahanan agar mereka mendapat penjelasan berdasarkan firman Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: Lalu mereka menahannya
  rationale: Bentuk kausatif dari נוח berarti menempatkan atau menaruh. Dalam konteks penahanan, bahasa Indonesia alami memakai 'menahannya'; 'lalu' meneruskan urutan narasi.
- source_word: בַּמִּשְׁמָר
  choice: dalam tahanan
  rationale: מִשְׁמָר di sini menunjuk pada penjagaan atau pengurungan resmi, bukan sekadar tindakan berjaga.
- source_word: לִפְרֹשׁ
  choice: sampai perkara itu dijelaskan
  rationale: פרשׁ dapat berarti membuat jelas, menjelaskan, atau menyatakan dengan tegas. Bentuk pasif Indonesia mempertahankan bahwa teks Ibrani tidak menyebut secara eksplisit siapa yang akan menjelaskan; 'perkara itu' menyatakan objek tersirat yang dituntut oleh ungkapan Indonesia.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Pronomina jamak tersebut merujuk kepada pihak-pihak yang menantikan penjelasan.
- source_word: עַל־פִּי
  choice: berdasarkan firman
  rationale: Idiom harfiah 'menurut mulut' menunjuk pada ucapan yang berwenang. 'Berdasarkan firman' mempertahankan nuansa verbal dan normatifnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Sumber penjelasan atau putusan
  choice: berdasarkan firman Yahweh
  alternative: atas perintah Yahweh
  rationale: עַל־פִּי dapat menyatakan perintah, tetapi 'berdasarkan firman' lebih dekat dengan citra ucapan dalam idiom Ibrani dan tidak mempersempitnya menjadi perintah semata.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan kalimat menghindari ungkapan kaku 'menaruh dia dalam penjagaan' serta tidak menambahkan 'putusan' yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
