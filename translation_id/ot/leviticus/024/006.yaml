  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: id
  text: Letakkan roti-roti itu dalam dua susunan[a], enam roti dalam setiap susunan, di atas meja yang tahir[b] di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam dua baris” atau “dalam dua tumpukan”; istilah Ibrani menunjuk pada susunan roti yang teratur dan tidak dengan sendirinya menentukan bentuk tepat susunan itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “bersih”; yang dimaksud ialah ketahiran dalam konteks ritual, bukan sekadar kebersihan fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Engkau harus menata
  rationale: Kata שׂוּם berarti menaruh, menempatkan, atau menetapkan. Dalam konteks menyusun roti secara teratur, “menata” terdengar alami dan mempertahankan daya instruktif bentuk orang kedua tunggal.
- source_word: אוֹתָם
  choice: semuanya
  rationale: Pronomina objek ini merujuk kepada kedua belas roti pada ayat sebelumnya. “Semuanya” secara alami menegaskan bahwa seluruh roti itu harus ditata.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: dalam dua baris
  rationale: מַעֲרָכָה menunjuk pada susunan yang teratur. “Dua baris” paling jelas dan alami dalam konteks roti yang ditata di atas meja, sementara alternatif seperti “dua susunan” tetap dicatat karena bentuk tepat susunannya tidak dijelaskan.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: enam buah dalam setiap baris
  rationale: 'Ungkapan Ibrani harfiahnya ringkas, “enam, susunan itu,” tetapi bermakna distributif: masing-masing susunan berisi enam roti. Kata penggolong “buah” membuat kalimat Indonesia lebih alami tanpa mengulang “roti.”'
- source_word: עַל הַשֻּׁלְחָן
  choice: di atas meja
  rationale: עַל secara langsung menyatakan posisi “di atas,” dan ini merupakan ungkapan Indonesia yang wajar.
- source_word: הַטָּהֹר
  choice: yang tahir
  rationale: טָהוֹר dalam konteks perlengkapan tempat kudus menunjuk pada ketahiran atau kebersihan ritual. “Tahir” mempertahankan nuansa kultis itu lebih baik daripada “bersih,” yang dapat dipahami hanya secara fisik.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti “di hadapan” atau “dalam kehadiran.” “Di hadapan Yahweh” ringkas, alami, dan mempertahankan nama ilahi yang terdapat dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa kultis הַטָּהֹר
  choice: meja yang tahir
  alternative: meja yang bersih
  rationale: Konteksnya adalah perlengkapan tempat kudus. “Tahir” menyampaikan kategori ritual tanpa menyamakan istilah ini dengan kekudusan atau sekadar kebersihan fisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Engkau harus” mempertahankan sapaan orang kedua tunggal dan daya instruktif teks. Istilah “tahir” dipertahankan karena konteks kultis, dengan penjelasan dalam catatan kaki agar tetap mudah dipahami.
