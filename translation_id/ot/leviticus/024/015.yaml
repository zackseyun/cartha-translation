  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֥ישׁ אִ֛ישׁ כִּֽי יְקַלֵּ֥ל אֱלֹהָ֖י/ו וְ/נָשָׂ֥א חֶטְאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: id
  text: Katakanlah kepada umat Israel[a], ‘Jika seseorang[b] mengutuk Allahnya, ia harus menanggung dosanya[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; ungkapan ini menunjuk kepada umat Israel secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: 'Atau “siapa pun”. Bahasa Ibrani mengulang kata “orang” untuk memberi arti distributif: setiap orang dalam keadaan yang disebutkan.'
    reason: lexical_alternative
  - marker: c
    text: “Menanggung dosanya” adalah ungkapan Ibrani yang berarti memikul kesalahan atau tanggung jawab atas pelanggaran itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: Katakanlah kepada umat Israel
  rationale: Dalam bahasa Indonesia, waw pembuka tidak harus diterjemahkan tersendiri. בְּנֵי יִשְׂרָאֵל secara harfiah berarti ‘anak-anak Israel’, tetapi dalam konteks ini menunjuk kepada umat Israel secara kolektif; bentuk ‘umat Israel’ lebih alami dan tidak menyiratkan hanya laki-laki.
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: Katakanlah
  rationale: Gabungan verba perintah hukum dan infinitif pengutip ‘dengan berkata’ dapat diungkapkan secara alami dan tetap formal dengan ‘Katakanlah’, yang sekaligus memperkenalkan isi perkataan.
- source_word: אִישׁ אִישׁ כִּי
  choice: Jika seseorang
  rationale: Pengulangan אִישׁ bersifat distributif, yakni ‘siapa pun’ atau ‘setiap orang’. ‘Jika seseorang’ mempertahankan bentuk kasus hukum bersyarat tanpa menerjemahkan pengulangan secara kaku.
- source_word: יְקַלֵּל
  choice: mengutuki
  rationale: Bentuk piel dari קלל berarti mengutuk atau mencerca. ‘Mengutuki’ menyampaikan tindakan mengucapkan kutuk terhadap Allah dan tidak mempersempitnya menjadi istilah teologis ‘menghujat’, yang menjadi lebih khusus dalam ayat berikutnya.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Pronomina posesif orang ketiga tunggal dipertahankan. Dalam konteks ini אֱלֹהִים paling wajar dipahami tunggal, tetapi teks tidak memakai nama YHWH.
- source_word: וְ/נָשָׂא חֶטְאוֹ
  choice: ia harus menanggung dosanya
  rationale: Konjungsi menandai akibat dari syarat. ‘Harus’ sesuai dengan daya wajib dalam ketetapan hukum, sedangkan ‘menanggung dosanya’ mempertahankan idiom Ibrani sambil membiarkan catatan kaki menjelaskan nuansa tanggungannya.
theological_decisions:
- issue: Cakupan אֱלֹהָיו
  choice: Allahnya
  alternative: TUHAN; Allah
  rationale: Bentuk posesif Ibrani dipertahankan dan tidak diganti dengan nama perjanjian YHWH. Dengan demikian, terjemahan tidak menyamakan begitu saja pelanggaran dalam ayat ini dengan pelanggaran yang dirumuskan lebih khusus pada ayat berikutnya.
- issue: Subjek hukum אִישׁ אִישׁ
  choice: seseorang
  alternative: seorang laki-laki; siapa pun
  rationale: Pengulangan nomina maskulin di sini berfungsi distributif dalam rumusan hukum. Bahasa Indonesia ‘seseorang’ menyatakan cakupan distributif secara wajar tanpa menambahkan pembatasan jenis kelamin yang tidak harus dimaksudkan oleh konstruksi tersebut.
- issue: Makna idiom נָשָׂא חֵטְא
  choice: menanggung dosanya
  alternative: menanggung kesalahannya; menanggung hukuman atas dosanya
  rationale: Idiom sumber dipertahankan agar hubungan antara dosa, kesalahan, dan akibat hukum tidak dipersempit secara tafsir. Catatan kaki menerangkan rentang maknanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan nada ketetapan hukum. Susunan dibuat alami bagi pembaca umum, sementara bentuk posesif ‘Allahnya’ dan idiom ‘menanggung dosanya’ dipertahankan untuk menjaga ketegangan serta keluasan makna teks sumber.
