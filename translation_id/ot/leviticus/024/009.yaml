  text: וְ/הָֽיְתָה֙ לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֔י/ו וַ/אֲכָלֻ֖/הוּ בְּ/מָק֣וֹם קָדֹ֑שׁ כִּ֡י קֹדֶשׁ֩ קָֽדָשִׁ֨ים ה֥וּא ל֛/וֹ מֵ/אִשֵּׁ֥י יְהוָ֖ה חָק עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: id
  text: Itu akan menjadi bagian Harun dan anak-anak laki-lakinya. Mereka harus memakannya di tempat kudus, sebab dari persembahan yang dibakar bagi Yahweh[a], itu adalah yang mahakudus baginya, sebagai ketetapan untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan berupa makanan bagi Yahweh.” Istilah Ibrani ini secara tradisional menunjuk pada persembahan yang disajikan melalui api.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: Itu menjadi bagian Harun dan anak-anak lelakinya
  rationale: Konstruksi היה dengan ל menyatakan kepemilikan atau peruntukan. Ungkapan “menjadi bagian” menyampaikan makna hukum itu secara alami. “Anak-anak lelaki” mempertahankan kekhususan gender בָנָיו dalam konteks garis imam.
- source_word: וַאֲכָלֻהוּ
  choice: Mereka harus memakannya
  rationale: Bentuk verba ini melanjutkan ketentuan hukum. “Harus” menyatakan daya wajibnya dengan jelas dalam bahasa Indonesia modern.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: di tempat kudus
  rationale: Bahasa Indonesia tidak memakai artikel seperti bahasa Ibrani; frasa ini tidak dipersempit menjadi ruangan tertentu di dalam Kemah Suci.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Ungkapan superlatif Ibrani ini menunjukkan tingkat kekudusan tertinggi. “Mahakudus” alami dan tidak mudah disalahartikan sebagai nama ruang Mahakudus.
- source_word: הוּא לוֹ
  choice: itu merupakan bagian mahakudus baginya
  rationale: “Baginya” mempertahankan pronomina tunggal Ibrani dan membiarkan Harun berfungsi sebagai kepala representatif garis imam, tanpa mengubahnya diam-diam menjadi bentuk jamak.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: dari persembahan yang dibakar bagi Yahweh
  rationale: אִשֶּׁה secara tradisional menunjuk pada persembahan yang disajikan melalui api. Terjemahan ini mempertahankan unsur api tanpa menyiratkan bahwa seluruh bagian imam ikut dibakar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi yang ditransliterasikan, bukan diganti dengan gelar.
- source_word: חָק עוֹלָם
  choice: sebagai ketetapan untuk selama-lamanya
  rationale: Frasa ini menyatakan ketentuan yang terus berlaku; pilihan ini jelas, bermartabat, dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Acuan pronomina tunggal לֹו setelah Harun dan anak-anak lelakinya disebut
  choice: Mempertahankan bentuk tunggal sebagai “baginya”
  alternative: Menghaluskannya menjadi bentuk jamak “bagi mereka”
  rationale: Teks Ibrani memakai bentuk tunggal. Terjemahan mempertahankan ketegangan gramatikal tersebut dan memungkinkan Harun dipahami sebagai wakil garis imam tanpa memaksakan penafsiran itu ke dalam teks.
- issue: Makna אִשֵּׁי sebagai persembahan korban
  choice: “persembahan yang dibakar”
  alternative: “persembahan berupa makanan”
  rationale: Pilihan utama mempertahankan kaitan tradisional istilah itu dengan api, sedangkan catatan kaki menyediakan padanan alternatif yang dipakai berdasarkan fungsi persembahan sebagai sajian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang bermartabat. Kalimat dipecah menjadi dua agar mudah dipahami, sedangkan istilah “mahakudus,” “ketetapan,” dan nama “Yahweh” mempertahankan bobot sakral teks.
