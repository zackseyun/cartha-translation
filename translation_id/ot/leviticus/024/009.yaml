revisions:
- from: Itu menjadi bagian Harun dan anak-anak lelakinya. Mereka harus memakannya di tempat kudus, sebab itu merupakan bagian mahakudus baginya dari persembahan yang dibakar bagi Yahweh[a], sebagai ketetapan untuk selama-lamanya.
  to: Itu akan menjadi bagian Harun dan anak-anak laki-lakinya. Mereka harus memakannya di tempat kudus, sebab dari persembahan yang dibakar bagi Yahweh[a], itu adalah yang mahakudus baginya, sebagai ketetapan untuk selama-lamanya.
  rationale: Revisi memperjelas hubungan "dari persembahan yang dibakar bagi Yahweh" dengan status roti tersebut sebagai yang mahakudus, sambil mempertahankan bentuk tunggal "baginya" sebagaimana dalam teks Ibrani. "Akan menjadi" menyampaikan daya futurum-yuridis וְהָיְתָה, dan "anak-anak laki-lakinya" membakukan bentuk Indonesia tanpa menghilangkan kekhususan gender.
  reviewer_model: gpt-5.6-terra
