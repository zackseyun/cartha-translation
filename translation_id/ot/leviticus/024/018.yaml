translation:
  language: id
  text: 'Siapa pun yang membunuh seekor hewan harus menggantinya: nyawa ganti nyawa[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “nyawa ganti nyawa.” Dalam konteks penggantian atas seekor hewan, ungkapan ini menyatakan ganti yang sepadan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה נֶפֶשׁ בְּהֵמָה
  choice: Siapa pun yang membunuh seekor hewan
  rationale: Partisip Hifil מַכֵּה menyatakan subjek umum dalam hukum kasus. Bersama נֶפֶשׁ בְּהֵמָה, ungkapan ini menunjuk pada tindakan mematikan; ‘membunuh seekor hewan’ menyampaikan maksudnya secara alami dalam bahasa Indonesia tanpa mengartikan נֶפֶשׁ sebagai ‘jiwa’ yang tak berwujud.
- source_word: בְּהֵמָה
  choice: seekor hewan
  rationale: בְּהֵמָה adalah istilah umum bagi hewan, meskipun dalam konteks hukum ini kemungkinan besar merupakan hewan milik orang lain. ‘Hewan’ mempertahankan keluasan istilah sumber.
- source_word: יְשַׁלְּמֶנָּה
  choice: harus menggantinya
  rationale: Bentuk Piel dari שׁלם di sini berarti memberi ganti atau pemulihan. Sufiks feminin tunggal merujuk kembali kepada hewan tersebut; ‘menggantinya’ ringkas dan wajar dalam rumusan hukum Indonesia.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: nyawa ganti nyawa
  rationale: Terjemahan ini mempertahankan rumus hukum Ibrani dan kesejajarannya. ‘Nyawa’ tepat bagi kehidupan makhluk hidup dalam konteks ini, sedangkan ‘ganti’ mengungkapkan תַּחַת sebagai penggantian atau kesepadanan tanpa menentukan mekanisme kompensasi secara berlebihan.
theological_decisions:
- issue: Makna rumus pembalasan dalam hukum mengenai hewan
  choice: Rumus ‘nyawa ganti nyawa’ dipertahankan, sementara kata kerja utama diterjemahkan sebagai kewajiban mengganti hewan yang dibunuh.
  alternative: Rumus itu dapat dipahami secara lebih harfiah sebagai kewajiban menyerahkan hewan lain, atau secara lebih luas sebagai ganti rugi material yang setara.
  rationale: Kata kerja יְשַׁלְּמֶנָּה menempatkan rumus penutup dalam kerangka penggantian atau restitusi. Teks tidak menjelaskan bentuk tepat penggantian itu, sehingga terjemahan tidak mempersempitnya menjadi pembayaran uang ataupun eksekusi tertentu.
translation_notes:
  register: Bahasa hukum yang ringkas, modern, dan bermartabat. ‘Siapa pun’ menandai ketentuan umum; ‘harus’ menyampaikan daya wajib bentuk hukum. Konjungsi awal waw tidak ditampilkan tersendiri karena ayat ini dibaca sebagai ketentuan hukum mandiri dalam bahasa Indonesia.
