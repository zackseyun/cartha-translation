source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: id
  text: Jika seseorang menyebabkan cedera pada sesamanya,[a] sebagaimana yang telah dilakukannya, demikianlah harus dilakukan kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan cacat kepada sesamanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Jika seseorang
  rationale: Dalam rumusan hukum kasuistik, כִּי memperkenalkan suatu keadaan bersyarat. ‘Jika seseorang’ alami dalam bahasa Indonesia dan tidak membatasi penerapannya hanya pada laki-laki, meskipun אִישׁ berbentuk maskulin tunggal.
- source_word: יִתֵּן מוּם
  choice: menyebabkan cedera
  rationale: Ungkapan ini secara harfiah berarti ‘memberikan cacat’. Dalam konteks kerugian jasmani dan hukuman yang sepadan, ‘menyebabkan cedera’ menyampaikan maksud hukumnya dengan jelas tanpa menghilangkan gagasan kerusakan tubuh; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בַּעֲמִיתוֹ
  choice: pada sesamanya
  rationale: עָמִית menunjuk pada sesama atau rekan dalam komunitas. ‘Sesamanya’ wajar dalam bahasa Indonesia dan mempertahankan hubungan antaranggotanya tanpa mempersempitnya menjadi sahabat dekat.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: sebagaimana yang telah dilakukannya
  rationale: Frasa perbandingan ini menetapkan perbuatan pelaku sebagai ukuran pembalasan yang sepadan. Bentuk ini mempertahankan penekanan korespondensi dalam bahasa Ibrani.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: demikianlah harus dilakukan kepadanya
  rationale: Bentuk Nifal pasif mempertahankan pelaksana yang tidak disebutkan dan cocok dengan konteks keputusan hukum. ‘Harus dilakukan’ menyampaikan daya normatifnya tanpa menjadikannya perintah untuk balas dendam pribadi.
theological_decisions:
- issue: Asas pembalasan yang sepadan dalam konteks hukum
  choice: Ayat dirumuskan sebagai ketentuan pasif tentang balasan yang sepadan, tanpa menyebut pelaksana.
  alternative: Merumuskannya sebagai perintah kepada orang yang cedera untuk membalas sendiri.
  rationale: Bahasa Ibrani memakai bentuk pasif, ‘akan/harus dilakukan kepadanya’, sehingga mendukung konteks penerapan hukum dan tidak mengharuskan penafsiran sebagai balas dendam pribadi.
- issue: Cakupan istilah אִישׁ dalam rumusan kasus hukum
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Walaupun אִישׁ secara gramatikal maskulin tunggal, dalam rumusan hukum ini kata tersebut memperkenalkan pelaku suatu kasus. ‘Seseorang’ mempertahankan bentuk tunggal dan fungsi umumnya tanpa menambahkan pembatasan teologis atau hukum yang tidak dinyatakan oleh konteks.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. Susunan ‘sebagaimana … demikianlah’ mempertahankan kesejajaran retoris teks Ibrani, sedangkan bentuk pasif menjaga sifat impersonal dari pelaksanaan ketentuan tersebut.
