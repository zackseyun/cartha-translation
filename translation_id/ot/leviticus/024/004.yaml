  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: id
  text: Di atas kaki pelita yang murni itu haruslah ia menata pelita-pelita di hadapan Yahweh senantiasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai nama ilahi YHWH, yang di sini diterjemahkan “Yahweh”.
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber.
lexical_decisions:
- source_word: עַל הַמְּנֹרָה הַטְּהֹרָה
  choice: Di atas kaki pelita yang murni itu
  rationale: עַל menunjukkan letak pada atau di atas benda tersebut; מְנוֹרָה adalah kaki pelita untuk keperluan ibadah, sedangkan טְהֹרָה mempertahankan gagasan kemurnian dalam konteks tempat kudus.
- source_word: יַעֲרֹךְ
  choice: ia harus menata
  rationale: Bentuk verba ini menyatakan tindakan mengatur atau menempatkan dengan tertib. Subjek orang ketiga tunggal tersirat dalam bahasa Ibrani dan dipertahankan dengan 'ia'.
- source_word: אֶת הַנֵּרוֹת
  choice: pelita-pelita
  rationale: Bentuk jamak נֵרוֹת menunjuk pada pelita-pelita individual yang ditempatkan pada kaki pelita.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan kultis לִפְנֵי berarti 'di hadapan' atau 'dalam hadirat', dan nama ilahi יהוה ditransliterasikan sebagai Yahweh.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Dalam konteks keimaman, kata ini menyatakan keberlangsungan atau pelaksanaan tetap dan berulang; 'senantiasa' mempertahankan keluasan makna itu tanpa menentukannya secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi YHWH secara langsung. 'Yahweh' mempertahankan nama pribadi itu, bukan menggantinya dengan gelar.
- issue: Cakupan makna תָּמִיד
  choice: senantiasa
  alternative: secara tetap
  rationale: Kata ini dapat menekankan kesinambungan maupun keteraturan ritus. 'Senantiasa' membiarkan ketegangan makna tersebut tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat tetap dekat dengan urutan Ibrani, tetapi memakai bentuk yang alami bagi pembaca umum. Istilah 'kaki pelita' dipilih sebagai padanan fungsional bagi benda ibadah tersebut.
