base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: id
  text: Dan jika seorang laki-laki memukul seseorang[a] hingga tewas[b], ia harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap nyawa manusia.” Di sini ungkapan Ibrani itu menunjuk kepada seorang manusia atau nyawa manusia, bukan secara khusus kepada “jiwa” yang tidak berwujud.
    reason: lexical_alternative
  - marker: b
    text: Atau “membunuh seseorang.” Verba Ibraninya secara harfiah berarti “memukul”, tetapi dalam konteks ini yang dimaksud ialah pukulan yang mengakibatkan kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: Dan jika seorang laki-laki
  rationale: וְ menghubungkan hukum ini dengan konteks sebelumnya, sedangkan konstruksi bersama כִּי membentuk syarat. אִישׁ berbentuk maskulin tunggal, sehingga diterjemahkan secara eksplisit sebagai “seorang laki-laki”.
- source_word: כִּי
  choice: jika
  rationale: Dalam rumusan hukum kasuistik ini, כִּי memperkenalkan keadaan bersyarat.
- source_word: יַכֶּה
  choice: memukul ... hingga tewas
  rationale: Bentuk Hifil dari נכה pada dasarnya berarti “memukul”, tetapi objek dan sanksi dalam ayat ini menunjukkan pukulan yang berakibat fatal. Ungkapan ini mempertahankan gambaran tindakan memukul sekaligus menyampaikan akibatnya.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: seseorang
  rationale: Dalam konteks ini, נֶפֶשׁ אָדָם menunjuk kepada pribadi atau nyawa manusia, bukan secara khusus kepada jiwa yang tidak berwujud. “Seseorang” merupakan padanan Indonesia yang alami bagi manusia mana pun yang menjadi korban.
- source_word: מוֹת יוּמָת
  choice: ia harus dihukum mati
  rationale: Gabungan infinitif absolut dengan bentuk verbal pasif menegaskan kepastian hukuman mati. “Harus dihukum mati” mempertahankan daya wajib dan bentuk pasif rumusan hukum tersebut.
theological_decisions:
- issue: Makna אָדָם dalam frasa objek hukum
  choice: seseorang
  alternative: nyawa manusia mana pun
  rationale: אָדָם bersifat umum dan tidak membatasi korban pada laki-laki. Pilihan ini menunjuk kepada pribadi manusia yang dibunuh tanpa mengartikan נֶפֶשׁ sebagai “jiwa” tak berwujud.
- issue: Bentuk maskulin אִישׁ bagi pelaku
  choice: seorang laki-laki
  alternative: siapa pun
  rationale: Teks sumber memakai nomina maskulin tunggal אִישׁ. Bentuk itu dipertahankan dalam teks utama tanpa menyangkal sifat representatif rumusan hukum tersebut.
- issue: Hubungan antara tindakan memukul dan kematian korban
  choice: memukul ... hingga tewas
  alternative: membunuh
  rationale: Terjemahan ini tidak menghilangkan citra konkret verba נכה, tetapi juga tidak membiarkan pembaca mengira bahwa setiap pukulan, sekalipun tidak fatal, otomatis dikenai hukuman mati.
translation_notes:
  register: Bahasa hukum dibuat tegas, alami, dan bermartabat. “Seorang laki-laki” mempertahankan bentuk maskulin sumber, sedangkan “seseorang” menyampaikan bahwa korban dapat berupa manusia mana pun. Penempatan “hingga tewas” sesudah objek sesuai dengan susunan Indonesia yang wajar.
