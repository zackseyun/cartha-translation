  text: וַ/יְדַבֵּ֣ר מֹשֶׁה֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/יּוֹצִ֣יאוּ אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֖/וֹ אָ֑בֶן וּ/בְנֵֽי יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: id
  text: Lalu Musa berbicara kepada orang-orang Israel. Mereka membawa orang yang telah mengutuk[a] itu ke luar perkemahan dan merajamnya dengan batu. Demikianlah orang-orang Israel melakukan seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penghujat.” Secara harfiah, bentuk partisipel Ibrani berarti “orang yang mengutuk” dan merujuk kepada orang yang mengutuk Nama ilahi dalam konteks sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: Bentuk piel dari דבר lazim berarti ‘berbicara’; pilihan ini wajar untuk Musa yang menyampaikan firman kepada umat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan ini menunjuk kepada bangsa Israel. ‘Orang-orang Israel’ lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah ‘anak-anak lelaki Israel’, tanpa mengubah cakupan kelompoknya.
- source_word: וַיּוֹצִיאוּ
  choice: membawa ... ke luar
  rationale: Bentuk hifil dari יצא berarti menyebabkan keluar atau membawa keluar; frasa ini mempertahankan gerak dari dalam perkemahan menuju bagian luarnya.
- source_word: הַמְקַלֵּל
  choice: orang yang telah mengutuk
  rationale: Partisipel dari קלל secara langsung berarti orang yang mengutuk dan merujuk kembali pada tindakan dalam konteks sebelumnya. Kata ‘telah’ memperjelas bahwa kutukan itu mendahului tindakan dalam ayat ini.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Frasa tersebut menunjukkan tujuan di luar batas perkemahan; ‘ke luar perkemahan’ alami setelah verba gerak dan mempertahankan arah tindakan.
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: merajamnya dengan batu
  rationale: ‘Merajam’ tepat untuk רגم, sedangkan ‘dengan batu’ mempertahankan penyebutan eksplisit אֶבֶן dalam sumber Ibrani.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: melakukan seperti yang diperintahkan
  rationale: Ungkapan ini merangkum ketaatan Israel kepada perintah yang sebelumnya diberikan; bentuk pasif Indonesia menghasilkan susunan yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Apakah הַמְקַלֵּל diterjemahkan dengan istilah teologis yang lebih khusus, ‘penghujat’
  choice: orang yang telah mengutuk
  alternative: penghujat
  rationale: Konteks sebelumnya menyangkut pengutukan Nama ilahi, tetapi bentuk yang dipakai dalam ayat ini adalah partisipel dari קלל, ‘mengutuk’. Terjemahan utama mempertahankan arti leksikal langsung, sementara makna ‘penghujat’ dicatat sebagai kemungkinan kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. ‘Orang-orang Israel’ dipilih sebagai padanan alami bagi idiom Ibrani, dan ‘merajamnya dengan batu’ mempertahankan kepenuhan ungkapan sumber tanpa terdengar janggal.
