  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: id
  text: Perintahkan kepada orang Israel[a] agar mereka membawa kepadamu minyak murni dari buah zaitun yang ditumbuk[b] untuk penerangan, supaya pelita terus menyala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”; ini adalah sebutan konvensional bagi umat Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “minyak zaitun murni hasil tumbukan.” Bahasa Ibrani menyebut minyak yang murni dan dihasilkan dari buah zaitun yang ditumbuk atau dihancurkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Perintahkanlah
  rationale: Bentuk imperatif dari צוה menyampaikan perintah langsung yang berwibawa. Bentuk ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi merupakan sebutan perjanjian konvensional bagi umat Israel secara keseluruhan. 'Orang Israel' menyampaikan rujukan kolektif itu secara wajar dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: agar mereka membawa kepadamu
  rationale: Walaupun לקח biasanya berarti 'mengambil', dengan arah אֵלֶיךָ ('kepadamu') konstruksi ini bermakna membawa atau menyediakan bagi Musa.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: minyak murni dari buah zaitun yang ditumbuk
  rationale: Ungkapan ini mempertahankan bahan asal, kemurnian, dan cara pengolahannya. 'Ditumbuk' mencerminkan כָּתִית tanpa menyamakannya begitu saja dengan pemerasan biasa.
- source_word: לַמָּאוֹר
  choice: untuk penerangan
  rationale: מָאוֹר menunjuk pada cahaya atau penerangan. Pilihan ini alami dalam konteks fungsi minyak bagi pelita.
- source_word: לְהַעֲלֹת נֵר
  choice: supaya pelita tetap menyala
  rationale: Secara idiomatis frasa ini berarti menyalakan atau mempertahankan nyala pelita. Terjemahan ini menyampaikan fungsi berkelanjutan tanpa mempertahankan ungkapan harfiah yang tidak alami, 'menaikkan pelita'.
- source_word: תָּמִיד
  choice: terus-menerus
  rationale: Dalam konteks ibadah imam, תָּמִיד menyatakan keberlangsungan atau keteraturan yang tetap. 'Terus-menerus' mempertahankan daya ungkap teks tanpa menambahkan jadwal yang tidak dinyatakan.
theological_decisions:
- issue: Sebutan perjanjian yang bergender בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Bentuk Ibrani secara harfiah maskulin jamak, tetapi berfungsi sebagai sebutan konvensional bagi komunitas Israel. Bahasa Indonesia modern lazim memakai 'orang Israel' untuk keseluruhan umat; bentuk harfiah tetap disediakan dalam catatan kaki agar ciri sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang berwibawa tetapi tidak kaku. Susunan kalimat dibuat jelas bagi pembaca umum, sementara rincian kultis tentang kemurnian dan pengolahan minyak dipertahankan.
