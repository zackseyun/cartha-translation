  text: 'Lalu Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk waw-konsekutif melanjutkan urutan narasi; “lalu” menyatakannya secara alami. Dalam konteks Allah menyampaikan firman, “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menyatakan arah penerima tuturan, dan nama מֹשֶׁה mengikuti bentuk baku Indonesia “Musa”.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Infinitif ini merupakan formula pengantar isi perkataan. “Kata-Nya” terdengar alami dalam bahasa Indonesia dan menunjukkan bahwa kutipan berlanjut pada ayat berikutnya tanpa menambahkan isi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula Ibrani harfiah “dan ... berbicara ... dengan mengatakan” diungkapkan secara idiomatis sebagai “Lalu ... berfirman ..., kata-Nya,” sambil tetap mempertahankan fungsi pengantar tuturan.
