  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: id
  text: Ambillah tepung halus, lalu pangganglah itu menjadi dua belas roti[a]. Setiap roti harus dibuat dari dua persepuluh efa tepung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dua belas kue.” Kata Ibrani ini dapat menunjuk pada satuan roti panggang yang digunakan dalam konteks ritual.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dua persepuluh.” Dalam istilah ukuran keimaman, ini berarti dua persepuluh efa untuk setiap roti.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Ambillah
  rationale: Bentuk perfektum dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya instruksionalnya.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Istilah kultis ini menunjuk pada tepung olahan bermutu tinggi. 'Tepung terbaik' jelas bagi pembaca modern tanpa menambahkan jenis biji-bijian yang tidak disebutkan dalam teks Ibrani.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: lalu pangganglah menjadi
  rationale: Objek feminin merujuk kembali kepada tepung, sedangkan frasa berikut menyatakan hasil pemanggangan. Susunan ini merupakan ungkapan Indonesia yang alami.
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: dua belas roti
  rationale: חַלּוֹת menunjuk pada satuan roti yang dipanggang, khususnya dalam konteks ritual. 'Roti' lebih alami daripada 'kue' dalam konteks roti kudus ini, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dua persepuluh efa
  rationale: Secara harfiah berarti 'dua persepuluh'; dalam sistem ukuran keimaman, satuan yang dipahami ialah efa. Penyebutan 'efa' membuat ukuran tersirat itu jelas.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: Setiap roti harus dibuat dari
  rationale: Ungkapan harfiahnya, 'roti yang satu itu akan berjumlah,' bersifat distributif. 'Setiap roti' menyampaikan bahwa ukuran tersebut berlaku bagi masing-masing roti.
