language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: id
  text: Anak laki-laki dari perempuan Israel itu mengucapkan Nama itu lalu mengutuk[a]. Kemudian mereka membawanya kepada Musa. Nama ibunya ialah Selomit, putri Dibri, dari suku Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghujat Nama itu dan mengutuk.” Kata kerja Ibrani yang diterjemahkan “mengucapkan” dapat berarti menyebut atau menyatakan dengan jelas, tetapi dalam konteks ini juga dapat dipahami sebagai bagian dari tindakan menghujat.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: mengucapkan
  rationale: Kata kerja נקב pada dasarnya dapat berarti menyatakan atau menyebut secara jelas. Bersama אֶת־הַשֵּׁם dan diikuti kata kerja tersendiri וַיְקַלֵּל, pilihan ini mempertahankan urutan dua tindakan dalam bahasa Ibrani tanpa meniadakan kemungkinan nuansa penghujatan.
- source_word: בֶּן הָאִשָּׁה הַיִּשְׂרְאֵלִית
  choice: anak laki-laki perempuan Israel itu
  rationale: Terjemahan ini mempertahankan identifikasi tokoh berdasarkan ibunya dan menjelaskan bahwa בֶּן menunjuk kepada anak laki-laki.
- source_word: אֶת הַשֵּׁם
  choice: Nama itu
  rationale: Huruf kapital menandai bahwa sebutan ini merujuk secara hormat kepada nama ilahi, sedangkan kata 'itu' mencerminkan artikel tertentu tanpa memasukkan nama ilahi secara eksplisit.
- source_word: וַיְקַלֵּל
  choice: lalu mengutuk
  rationale: Dalam bentuk piel, קלל lazim berarti 'mengutuk'. 'Lalu' menyampaikan kelanjutan tindakan secara alami dan menjaga kata kerja ini tetap berbeda dari וַיִּקֹּב.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: Kemudian mereka membawanya kepada Musa
  rationale: Bentuk orang ketiga jamak aktif dengan pelaku yang tidak disebut dipertahankan melalui 'mereka', tanpa menambahkan identitas pelakunya.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Ungkapan ini menyajikan informasi latar secara lugas dan wajar dalam bahasa Indonesia.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: Selomit anak Dibri
  rationale: Nama-nama ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia, dan hubungan keturunan dipertahankan tanpa menganggap Dibri laki-laki atau perempuan secara eksplisit di luar bentuk nama sumber.
- source_word: לְמַטֵּה דָן
  choice: dari suku Dan
  rationale: Ungkapan Ibrani ini menyatakan afiliasi kesukuan; 'dari suku Dan' merupakan padanan Indonesia yang ringkas dan jelas.
theological_decisions:
- issue: Makna נקב ketika objeknya adalah 'Nama itu' dalam konteks penghujatan
  choice: Mengucapkan Nama itu, kemudian melakukan tindakan mengutuk yang dinyatakan oleh kata kerja kedua
  alternative: Menghujat Nama itu dan mengutuk
  rationale: Teks Ibrani memakai dua kata kerja, נקב dan קלל. Menerjemahkannya sebagai dua tindakan mempertahankan susunan sumber dan ketegangan maknanya, sedangkan catatan kaki mengakui bahwa kata kerja pertama dalam konteks ini juga dapat dipahami sebagai penghujatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah 'Nama' dikapitalisasi sebagai rujukan hormat kepada nama ilahi. Ambiguitas leksikal utama dipertahankan melalui catatan kaki, bukan diselesaikan secara dogmatis dalam teks utama.
