translation:
  language: id
  text: Patah ganti patah, mata ganti mata, gigi ganti gigi; sebagaimana seseorang menimbulkan cedera[a] pada orang lain[b], demikian juga cedera itu harus ditimpakan kepada orang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “memberikan cacat/cela fisik.” Bahasa Ibrani memakai kata “memberi” bersama kata yang dapat berarti cacat, cela fisik, atau cedera.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pada manusia.” Kata tunggal di sini digunakan secara umum untuk seorang manusia dalam hukum kasus.'
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר
  choice: patah
  rationale: Nomina ini menunjuk pada keadaan patah atau retak akibat cedera. Dalam rangkaian hukum yang konkret, “patah” ringkas, wajar, dan mempertahankan kesejajaran dengan mata dan gigi.
- source_word: תַּחַת
  choice: ganti
  rationale: Dalam rumusan hukum pembalasan yang setimpal, kata ini menyatakan penggantian atau kesepadanan. “Ganti” mempertahankan bentuk tradisional dan konkret tanpa mengubahnya menjadi teori mengenai jenis hukuman.
- source_word: עַיִן
  choice: mata
  rationale: Istilah anatomi yang langsung dan dipertahankan secara harfiah.
- source_word: שֵׁן
  choice: gigi
  rationale: Istilah anatomi yang langsung dan dipertahankan secara harfiah.
- source_word: יִתֵּן מוּם
  choice: menimbulkan cedera
  rationale: Secara harfiah konstruksi ini memakai verba “memberi” dengan nomina “cacat/cela fisik”. Dalam konteks hukum mengenai tindakan terhadap tubuh, “menimbulkan cedera” menyampaikan idiom Ibraninya secara alami.
- source_word: מוּם
  choice: cedera
  rationale: Kata ini dapat berarti cacat, cela fisik, atau kerusakan tubuh. “Cedera” paling sesuai dengan konteks seseorang menyebabkan kerusakan fisik pada orang lain, sementara catatan kaki mempertahankan nuansa alternatifnya.
- source_word: אָדָם
  choice: orang lain
  rationale: Di sini אָדָם menunjuk secara umum kepada seorang manusia yang menjadi korban dalam hukum kasus. “Orang lain” memperjelas hubungan antarpelaku dan korban secara alami tanpa membatasi rujukannya pada laki-laki.
- source_word: כֵּן
  choice: demikian juga
  rationale: Menandai akibat yang sepadan dengan tindakan sebelumnya dan mempertahankan simetri rumusan hukum.
- source_word: יִנָּתֶן בּוֹ
  choice: cedera itu harus ditimpakan kepadanya
  rationale: Bentuk pasif verba נתן secara harfiah berarti “diberikan/dikenakan”. Pengulangan “cedera itu” membuat acuan tersiratnya jelas dalam bahasa Indonesia, sedangkan “harus ditimpakan” menyampaikan daya normatif hukum tersebut.
theological_decisions:
- issue: Sifat rumusan pembalasan setimpal
  choice: Mempertahankan rumusan konkret “patah ganti patah, mata ganti mata, gigi ganti gigi”.
  alternative: Mengabstraksikannya menjadi “hukuman atau ganti rugi yang setimpal dengan cedera”.
  rationale: Teks Ibrani memberikan rangkaian anggota tubuh dan cedera secara konkret. Terjemahan tidak menetapkan apakah penerapannya selalu berupa cedera fisik, ganti rugi, atau mekanisme hukum lain, karena hal itu merupakan persoalan penafsiran.
- issue: Cakupan אָדָם
  choice: Menerjemahkannya secara generik sebagai “orang lain”.
  alternative: “seorang laki-laki” atau “manusia”.
  rationale: Dalam hukum kasus ini, bentuk tunggalnya mewakili manusia secara umum. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan pembatasan gender yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang ringkas dan bermartabat. Rumusan “patah ganti patah, mata ganti mata, gigi ganti gigi” dipertahankan karena jelas, mudah diingat, dan dekat dengan struktur Ibrani; klausa berikutnya dibuat lebih idiomatis agar dapat dipahami pembaca umum.
