  text: וּ/בַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִ/זְנ֑וֹת אֶת אָבִ֨י/הָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: id
  text: Dan jika anak perempuan seorang imam mencemarkan dirinya[a] dengan melacurkan diri[b], ia mencemarkan ayahnya; ia harus dibakar dengan api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mulai melacurkan diri.” Bentuk Ibrani ini dapat berasal dari kata kerja yang berarti “mulai”, tetapi dalam konteks ini lebih mungkin berarti menjadi cemar atau mencemarkan diri.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dengan berzina.” Kata Ibrani yang dipakai menggambarkan tindakan seperti seorang pelacur dan dapat menunjuk lebih luas pada perilaku seksual terlarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: anak perempuan seorang imam
  rationale: Ungkapan harfiah ‘anak perempuan seorang laki-laki, seorang imam’ secara idiomatis berarti ‘anak perempuan seorang imam’. Konjungsi pembuka tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia karena ayat ini langsung melanjutkan rangkaian hukum.
- source_word: כִּי
  choice: jika
  rationale: Dalam rumusan hukum kasuistik, כִּי memperkenalkan keadaan bersyarat; ‘jika’ paling jelas menyampaikan fungsi itu.
- source_word: תֵחֵל
  choice: mencemarkan dirinya
  rationale: Bentuk ini paling tepat dipahami dari חלל dengan makna menjadi cemar atau mencemarkan diri dalam konteks kekudusan imam. Kemungkinan analisis bermakna ‘mulai’ dipertahankan dalam catatan kaki.
- source_word: לִזְנוֹת
  choice: dengan melacurkan diri
  rationale: Infinitif זנה menjelaskan cara pencemaran itu terjadi dan menunjuk pada perilaku seksual seperti seorang pelacur. Pilihan ini mempertahankan kekonkretan istilah sumber; alternatif yang lebih umum dicatat.
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: ia mencemarkan ayahnya
  rationale: Pengulangan ‘mencemarkan’ mempertahankan kaitan leksikal חלל antara tindakan anak perempuan itu dan pencemaran terhadap kekudusan ayahnya, tanpa mengubahnya menjadi sekadar ‘mempermalukan’.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: ia harus dibakar dengan api
  rationale: Bentuk pasif dalam konteks hukum menyatakan hukuman yang diwajibkan. ‘Harus’ terdengar alami dalam bahasa Indonesia modern, sedangkan ‘dengan api’ mempertahankan rumusan Ibrani.
theological_decisions:
- issue: Kosakata חלל dalam hukum kekudusan imam
  choice: Memakai ‘mencemarkan’ pada kedua kemunculan
  alternative: Memakai ‘menajiskan’ atau ‘mempermalukan’ pada salah satu atau kedua kemunculan
  rationale: ‘Mencemarkan’ mempertahankan hubungan verbal dalam teks serta bobot kekudusan ritualnya. ‘Mempermalukan’ terlalu membatasi makna pada kehormatan sosial, sedangkan ‘menajiskan’ dapat memberi kesan bahwa rincian status ritual tertentu telah ditetapkan lebih jauh daripada yang dinyatakan ayat.
- issue: Cakupan makna זנה
  choice: ‘melacurkan diri’ dalam teks dengan alternatif ‘berzina’ dalam catatan kaki
  alternative: Menerjemahkan langsung sebagai ‘berzina’ atau ‘melakukan percabulan’
  rationale: Istilah sumber memakai citra pelacuran tetapi dapat mencakup perilaku seksual terlarang secara lebih luas. Teks utama mempertahankan citra konkretnya, sementara catatan mengakui cakupan alternatif tanpa menetapkan rincian yang tidak diberikan.
translation_notes:
  register: Bahasa hukum yang khidmat tetapi tetap modern dan mudah dipahami. Susunan kalimat dibuat langsung dan ringkas; pengulangan ‘mencemarkan’ sengaja dipertahankan untuk mencerminkan pengulangan akar Ibrani חלל.
