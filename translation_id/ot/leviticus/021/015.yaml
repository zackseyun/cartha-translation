  terminology: '"Mencemarkan" lebih akurat daripada "menajiskan" bagi חלל dan menghindari penyamaan dengan istilah kenajisan ritual. "Menguduskan" tepat bagi מְקַדְּשׁוֹ. Nama ilahi "Yahweh" dipertahankan.'
