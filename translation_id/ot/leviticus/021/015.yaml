  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: id
  text: Ia tidak boleh mencemarkan keturunannya di tengah bangsanya,[a] sebab Akulah Yahweh yang menguduskan dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menodai keturunannya.” Kata Ibrani ini menyatakan tindakan mencemarkan atau memperlakukan sebagai tidak kudus sesuatu yang seharusnya kudus. Dalam konteks ini, larangan tersebut berkaitan dengan pembatasan perkawinan bagi imam besar.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Atau “yang menjadikan dia kudus” atau “yang mengkhususkan dia sebagai kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: menajiskan
  rationale: Bentuk piel dari חלל dalam konteks kekudusan imamat berarti menjadikan sesuatu yang seharusnya kudus sebagai cemar atau tidak kudus. “Menajiskan” mempertahankan bobot kultisnya dan lebih wajar dalam bahasa Indonesia daripada “memprofanakan”.
- source_word: זַרְעוֹ
  choice: keturunannya
  rationale: זֶרַע dapat berarti benih, anak cucu, atau keturunan. Dalam konteks perkawinan dan garis imam, “keturunannya” alami dan mencakup garis genealogis tanpa kelugasan janggal “benihnya”.
- source_word: בְּעַמָּיו
  choice: di antara bangsanya
  rationale: Gabungan ב dengan עַם bersufiks orang ketiga tunggal secara alami menunjukkan lingkungan sosial tempat keturunan itu berada. “Di antara bangsanya” mempertahankan ungkapan Ibrani tanpa mempersempitnya menjadi kaum kerabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: מְקַדְּשׁוֹ
  choice: yang menguduskan dia
  rationale: Partisipel piel קדשׁ menyatakan tindakan menjadikan kudus atau mengkhususkan sebagai kudus. “Menguduskan” mempertahankan istilah kekudusan yang penting dalam konteks imamat dan tidak mempersempitnya pada upacara penahbisan saja.
theological_decisions:
- issue: Acuan larangan dan alasan kekudusan
  choice: Ayat ini menyatakan bahwa imam tidak boleh menajiskan keturunannya di tengah bangsanya karena Yahweh menguduskan imam itu.
  alternative: Larangan ini dapat dipahami secara lebih khusus sebagai larangan bagi imam besar untuk membuat garis keturunannya tidak memenuhi syarat bagi keimaman melalui perkawinan yang terlarang.
  rationale: Konteks langsung membahas pembatasan perkawinan imam besar, tetapi teks Ibrani sendiri tidak secara eksplisit menyebut hilangnya status keimaman. Karena itu, terjemahan mempertahankan ungkapan yang lebih luas, “menajiskan keturunannya”, dan tidak memasukkan penafsiran yang lebih khusus ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pronomina “Ia” mengacu kepada imam besar dalam konteks sebelumnya; “Akulah” mempertahankan penekanan pada אֲנִי. Istilah “menajiskan” dan “menguduskan” mempertahankan pertentangan leksikal-teologis antara חלל dan קדשׁ.
