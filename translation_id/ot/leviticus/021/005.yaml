  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: id
  text: Mereka tidak boleh membuat bagian botak pada kepala mereka, mencukur habis tepi janggut mereka[a], ataupun membuat sayatan pada tubuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sudut janggut mereka.” Istilah Ibrani ini dapat berarti tepi, sisi, atau sudut.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְחוּ קָרְחָה
  choice: membuat bagian ... menjadi botak
  rationale: Pasangan kata kerja dan kata benda serumpun ini menunjuk pada tindakan sengaja menghasilkan bagian yang botak, bukan kebotakan alami. Ungkapan ini mempertahankan tindakan konkret tanpa menentukan bahwa caranya harus dengan mencukur.
- source_word: בְּרֹאשָׁם
  choice: kepala mereka
  rationale: Bentuk Ibrani memakai kata benda tunggal dengan akhiran jamak. Dalam bahasa Indonesia, “kepala mereka” wajar dipahami secara distributif, yaitu kepala tiap-tiap orang.
- source_word: פְאַת זְקָנָם
  choice: tepi janggut mereka
  rationale: פֵּאָה dapat berarti tepi, sisi, atau sudut. “Tepi” jelas dalam bahasa Indonesia modern dan tidak menetapkan pola pencukuran tertentu secara berlebihan.
- source_word: יְגַלֵּחוּ
  choice: mencukur habis
  rationale: Bentuk piel menyatakan tindakan menyingkirkan rambut; “mencukur habis” menyampaikan unsur penghilangan tersebut secara alami.
- source_word: וּבִבְשָׂרָם
  choice: pada tubuh mereka
  rationale: בָּשָׂר secara harfiah berarti “daging,” tetapi dalam konteks pelukaan diri merujuk pada tubuh jasmani. “Pada tubuh mereka” alami dan tetap konkret dalam bahasa Indonesia.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: membuat sayatan
  rationale: Gabungan kata kerja dan kata benda serumpun ini berarti membuat luka potong atau guratan. “Membuat sayatan” lugas, mudah dipahami, dan tidak terlalu klinis.
theological_decisions:
- issue: Sifat larangan
  choice: Menerjemahkan tindakan-tindakan pada tubuh secara konkret tanpa menambahkan alasan ritual atau perkabungan.
  alternative: Menambahkan keterangan “karena orang mati” berdasarkan Imamat 19:28 atau Ulangan 14:1.
  rationale: Ayat ini sendiri hanya menyebut tindakan yang dilarang dan tidak memuat keterangan tentang orang mati. Terjemahan tidak memasukkan penjelasan dari ayat paralel ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “mereka” mempertahankan cakupan jamak serta susunan tiga larangan, sedangkan “ataupun” menghubungkan larangan terakhir secara alami.
