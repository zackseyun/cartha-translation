base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: id
  text: Ia tidak boleh mendekati mayat siapa pun[a]; ia tidak boleh menajiskan dirinya, bahkan karena ayahnya atau ibunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jenazah.” Secara harfiah, “orang mati” atau “jiwa orang mati”; dalam hukum kenajisan, ungkapan ini menunjuk kepada jasad orang mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל ... לֹא יָבֹא
  choice: tidak boleh mendekati
  rationale: Dalam konteks kenajisan imam, gabungan בוא dengan עַל menyatakan mendekati atau bersentuhan dengan jenazah. Ungkapan ini juga menyampaikan larangan hukum secara wajar dalam bahasa Indonesia.
- source_word: כָּל
  choice: siapa pun
  rationale: 'Dalam konstruksi negatif, pilihan ini menyatakan cakupan menyeluruh: tidak ada orang mati yang dikecualikan.'
- source_word: נַפְשֹׁת מֵת
  choice: mayat siapa pun
  rationale: Secara harfiah ungkapan ini berkaitan dengan 'pribadi/jiwa orang mati', tetapi dalam hukum kenajisan נֶפֶשׁ di sini secara metonimis menunjuk kepada jasad manusia yang telah mati. 'Mayat' jelas dan alami dalam bahasa Indonesia.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: bahkan karena ayahnya atau ibunya
  rationale: Preposisi לְ menyatakan pihak atau keadaan yang berkenaan dengan penajisan itu. 'Bahkan' mempertahankan penekanan bahwa orang tua sendiri pun tidak menjadi pengecualian.
- source_word: לֹא יִטַּמָּא
  choice: ia tidak boleh menajiskan dirinya
  rationale: Bentuk Hitpael bersifat refleksif. 'Menajiskan dirinya' mempertahankan istilah kenajisan ritual tanpa menyamakannya secara langsung dengan kesalahan moral.
theological_decisions:
- issue: Istilah kenajisan ritual
  choice: menajiskan dirinya
  alternative: menjadi najis; mencemarkan dirinya
  rationale: Ayat ini membahas kenajisan akibat mayat dalam hukum keimaman. Istilah 'najis' mempertahankan kategori hukum Imamat; 'mencemarkan' dapat terdengar terutama moral, sedangkan 'menjadi najis' kurang menonjolkan bentuk refleksif teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' sesuai untuk ketentuan hukum tentang imam besar dalam konteks. Tanda titik koma mempertahankan hubungan erat antara larangan mendekati mayat dan larangan menajiskan diri.
