source:
  edition: WLC
  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: id
  text: Mereka tidak boleh memperistri perempuan yang menjadi pelacur atau yang tercemar[a]. Mereka juga tidak boleh memperistri perempuan yang telah diceraikan oleh suaminya, sebab setiap imam kudus bagi Allahnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “tercemar” dapat menunjuk kepada perempuan yang dianggap telah dinodai atau kehilangan status kudus; cakupan tepatnya dalam ayat ini tidak dijelaskan.
    reason: Menandai istilah hukum-kultis yang maknanya lebih teknis dan lebih luas daripada sekadar keadaan kotor secara moral.
  - marker: b
    text: Teks Ibrani secara harfiah beralih dari bentuk jamak, “mereka tidak boleh memperistri,” ke bentuk tunggal, “sebab ia kudus bagi Allahnya.”
    reason: Mencatat peralihan gramatikal yang diterjemahkan secara distributif sebagai 'setiap imam'.
lexical_decisions:
- source_word: זֹנָה (zonah)
  choice: perempuan yang menjadi pelacur
  rationale: Menyampaikan makna perempuan yang melakukan pelacuran dengan bahasa Indonesia modern tanpa memakai istilah yang terlalu arkais.
- source_word: חֲלָלָה (chalalah)
  choice: yang tercemar
  rationale: Bentuk feminin ini menunjuk kepada perempuan yang dianggap ternoda atau kehilangan status kudus; terjemahan ini mempertahankan cakupan istilah tanpa menentukan secara sempit bagaimana pencemaran itu terjadi.
- source_word: יִקָּחוּ (yiqqachu)
  choice: memperistri
  rationale: Dalam konteks aturan perkawinan bagi para imam, kata 'mengambil' bermakna mengambil seorang perempuan sebagai istri.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ (gerushah me'ishah)
  choice: yang telah diceraikan oleh suaminya
  rationale: Mencerminkan bentuk pasif dan frasa harfiah 'dari laki-lakinya/suaminya' secara alami dalam bahasa Indonesia.
- source_word: קָדֹשׁ (qadosh)
  choice: kudus
  rationale: Mempertahankan istilah utama mengenai pengkhususan imam bagi Allah.
theological_decisions:
- issue: Peralihan dari subjek jamak pada larangan kepada kata ganti tunggal dalam alasan
  choice: sebab setiap imam kudus bagi Allahnya
  alternative: sebab ia kudus bagi Allahnya
  rationale: Bahasa Ibrani beralih dari verba jamak 'mereka tidak boleh memperistri' ke bentuk tunggal 'ia kudus'. Ungkapan 'setiap imam' menyampaikan pemakaian distributif itu dengan jelas tanpa mengubah cakupan aturan.
- issue: Makna teknis חֲלָלָה dalam hukum kekudusan imam
  choice: yang tercemar, disertai catatan kaki yang mempertahankan ketidakpastian cakupannya
  alternative: yang dinodai; yang kehilangan status kudus
  rationale: Istilah tersebut dapat memiliki nuansa status kultis atau sosial yang lebih khusus daripada kenajisan umum. Teks utama dibuat wajar, sedangkan catatan kaki mencegah pembaca menganggap satu penyebab tertentu sebagai satu-satunya makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Memperistri' dipilih agar konteks perkawinan jelas. Pengulangan 'perempuan' dibatasi supaya kalimat tetap alami, sedangkan 'setiap imam' menjelaskan rujukan bentuk tunggal Ibrani tanpa mengaburkan bahwa larangan berlaku kepada para imam.
