  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: id
  text: Ia tidak boleh menajiskan dirinya sebagai seorang suami di antara bangsanya[a], dan dengan demikian mencemarkan dirinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia tidak boleh menajiskan dirinya sebagai orang terpandang di antara bangsanya, dan dengan demikian mencemarkan dirinya.” Klausa Ibrani ini sulit; ada juga yang memahaminya secara lebih umum sebagai larangan bagi imam untuk menajiskan dirinya dalam kedudukannya di tengah bangsanya.
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: menajiskan dirinya
  rationale: Bentuk Hitpael imperfek dari טמא di sini menunjuk pada kenajisan ritual akibat persentuhan dengan orang mati. Pilihan ini mempertahankan tindakan refleksif dan cocok dengan konteks kekudusan imam; 'menjadi najis' juga mungkin.
- source_word: בַּעַל
  choice: seorang suami
  rationale: Dalam klausa yang sulit ini, בַּעַל dapat berarti 'suami', dan makna relasional tersebut sesuai dengan konteks pengecualian berkabung berdasarkan hubungan keluarga. Kemungkinan arti 'orang terpandang/pemimpin' dipertahankan dalam catatan kaki.
- source_word: בְּעַמָּיו
  choice: di antara bangsanya
  rationale: Terjemahan ini dekat dengan ungkapan Ibrani dan tetap membiarkan konteks menunjukkan nuansa kelompok kerabat atau komunitasnya.
- source_word: לְהֵחַלּוֹ
  choice: sehingga mencemarkan kekudusannya
  rationale: Infinitif dari חלל menyatakan akibat atau tujuan. Ungkapan ini menyampaikan bahwa kenajisan ritual akan menodai kedudukan kudus imam, sambil menghindari frasa Indonesia yang kurang alami seperti 'menajiskan dirinya ... menajiskan dirinya'.
theological_decisions:
- issue: Penafsiran klausa sulit בַּעַל בְּעַמָּיו
  choice: Larangan bagi imam untuk menajiskan diri sebagai seorang suami di antara bangsanya.
  alternative: Ia tidak boleh menajiskan diri sebagai orang terpandang di antara bangsanya; atau, ia tidak boleh menajiskan diri di antara bangsanya sehingga mencemarkan kekudusannya.
  rationale: Susunan Ibrani sangat padat dan memungkinkan lebih dari satu penafsiran. Arti umum בַּעַל sebagai 'suami' masuk akal dalam konteks aturan tentang kenajisan karena kematian kerabat, tetapi alternatif penting dicatat agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah 'menajiskan' mempertahankan corak ritual-imamat; 'mencemarkan kekudusannya' memperjelas hubungan חלל dengan status kudus imam tanpa menghilangkan ketegangan tafsir pada klausa utama.
