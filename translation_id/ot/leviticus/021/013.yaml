base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/013.yaml
  text: And he shall take a wife in her virginity[a].
translation:
  language: id
  text: Ia harus mengambil seorang istri yang masih perawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dalam keperawanannya”; dapat juga diterjemahkan “sebagai seorang perawan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ia
  rationale: Pronomina mandiri menandai subjek dengan sedikit penegasan dalam kesinambungan wacana. Dalam bahasa Indonesia, “Ia” menyampaikan subjek secara alami; hubungan dengan ayat sebelumnya sudah jelas dari konteks.
- source_word: אִשָּׁה
  choice: seorang istri
  rationale: Dalam konstruksi dengan לקח yang merujuk pada perkawinan, kata ini berarti istri, bukan sekadar perempuan.
- source_word: בִּבְתוּלֶיהָ
  choice: yang masih perawan
  rationale: Ungkapan Ibrani secara harfiah berarti “dalam keperawanannya,” yakni dalam keadaan perawan. Bentuk relatif ini lebih alami dalam bahasa Indonesia sambil mempertahankan makna keadaan tersebut.
- source_word: יִקָּח
  choice: harus mengambil
  rationale: Bentuk imperfek dalam konteks hukum menyatakan kewajiban. “Mengambil seorang istri” mempertahankan idiom perkawinan Ibrani, sedangkan “harus” menyampaikan daya normatifnya.
theological_decisions:
- issue: Istilah perkawinan dalam peraturan keimaman
  choice: Mempertahankan idiom “mengambil seorang istri”
  alternative: Ia harus menikahi seorang perempuan yang masih perawan
  rationale: Pilihan ini menjaga corak formula hukum dan idiom teks Ibrani tanpa memasukkan penafsiran doktrinal tambahan.
- issue: Makna בִּבְתוּלֶיהָ
  choice: yang masih perawan
  alternative: dalam keperawanannya
  rationale: Terjemahan utama mengungkapkan keadaan perempuan secara wajar dalam bahasa Indonesia; catatan kaki mempertahankan bentuk harfiahnya dan ambiguitas ungkapan sumber.
translation_notes:
  register: Bahasa hukum yang ringkas dan bermartabat. Idiom “mengambil seorang istri” sengaja dipertahankan, sedangkan “yang masih perawan” dipilih agar alami dan mudah dipahami dalam bahasa Indonesia modern.
