base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: id
  text: Imam besar di antara saudara-saudaranya, yang kepalanya telah dituangi minyak pengurapan dan yang telah ditahbiskan[a] untuk mengenakan pakaian itu, tidak boleh membiarkan rambut kepalanya terurai[b] dan tidak boleh mengoyakkan pakaiannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang tangannya telah dipenuhi,” suatu ungkapan Ibrani untuk dilantik atau ditahbiskan ke dalam pelayanan imam.
    reason: lexical_alternative
  - marker: b
    text: Ini merujuk pada tanda perkabungan, yaitu membiarkan rambut terurai atau tidak terurus, serta mengoyakkan pakaian.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: Imam besar di antara saudara-saudaranya
  rationale: “Imam besar” adalah sebutan baku dan alami dalam bahasa Indonesia untuk jabatan ini. “Di antara saudara-saudaranya” mempertahankan hubungan dengan para imam lain tanpa memaksakan apakah מִן terutama menyatakan asal dari kelompok atau kedudukan di atas mereka.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: yang kepalanya telah dituangi minyak pengurapan
  rationale: Mempertahankan bentuk pasif serta gambaran konkret bahwa minyak pengurapan dituangkan ke atas kepala.
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: yang telah ditahbiskan[a]
  rationale: Ungkapan harfiahnya ialah “tangannya telah dipenuhi,” sebuah idiom untuk pelantikan atau penahbisan ke dalam jabatan imam. Makna idiomatis dipakai dalam teks utama agar jelas dan alami, sedangkan bentuk Ibraninya dicatat dalam catatan kaki.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: untuk mengenakan pakaian itu
  rationale: Menerjemahkan konstruksi infinitif secara langsung. Bentuk kolektif “pakaian” terdengar lebih alami daripada pengulangan “pakaian-pakaian,” dan kata penunjuk mempertahankan kejelasan bentuk tertentu dalam bahasa Ibrani.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: tidak boleh membiarkan rambut kepalanya terurai[b]
  rationale: Kata kerja ini menunjuk pada kepala atau rambut yang dibiarkan terurai atau tidak terurus, khususnya sebagai tanda berkabung. Penyebutan “rambut kepalanya” membuat maksudnya wajar dalam bahasa Indonesia tanpa menghilangkan catatan tentang kemungkinan nuansanya.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: dan tidak boleh mengoyakkan pakaiannya
  rationale: Menyampaikan tindakan berkabung berupa mengoyakkan pakaian dengan bahasa Indonesia modern dan jelas.
theological_decisions:
- issue: Makna ungkapan penahbisan מִלֵּא אֶת יָדוֹ
  choice: Makna idiomatis “telah ditahbiskan” dipakai dalam teks utama, dengan bentuk harfiahnya dijelaskan dalam catatan kaki.
  alternative: “yang tangannya telah dipenuhi” atau “yang telah dilantik”
  rationale: Terjemahan harfiah sukar dipahami pembaca Indonesia dan dapat disalahartikan. “Ditahbiskan” menyampaikan fungsi ritual ungkapan tersebut tanpa memasukkan rincian denominasi tertentu.
- issue: Nuansa מֵאֶחָיו
  choice: “di antara saudara-saudaranya”
  alternative: “yang lebih tinggi daripada saudara-saudaranya” atau “dari antara saudara-saudaranya”
  rationale: Frasa Ibrani dapat dipahami dalam hubungan dengan kelompok saudara atau sesama imam sekaligus menyiratkan kedudukan utamanya. Terjemahan ini mempertahankan keluwesan tersebut dan menghindari penjelasan berlebihan dalam teks.
- issue: Tanda perkabungan dalam אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: “tidak boleh membiarkan rambut kepalanya terurai”
  alternative: “tidak boleh membiarkan rambutnya tidak terurus” atau “tidak boleh membuka penutup kepalanya”
  rationale: Makna yang paling mungkin berkaitan dengan rambut yang dibiarkan terurai atau kusut sebagai tanda berkabung, tetapi nuansa tepat kata kerja tetap dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur kalimat mengikuti alur ayat Ibrani, tetapi idiom penahbisan diterjemahkan menurut maknanya agar dapat dipahami pembaca umum. Istilah “imam besar,” “minyak pengurapan,” dan “mengoyakkan pakaian” mempertahankan register ritual Alkitab yang sudah dikenal tanpa menjadi arkais.
