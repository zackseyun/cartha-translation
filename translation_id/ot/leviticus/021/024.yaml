  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: id
  text: Lalu Musa berbicara kepada Harun, kepada putra-putranya, dan kepada seluruh bani Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh orang Israel” atau “segenap umat Israel.” Secara harfiah, bahasa Ibrani berbunyi “putra-putra Israel”; ini adalah sebutan baku yang secara korporat menunjuk umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu Musa menyampaikan hal itu
  rationale: Bentuk wayyiqtol melanjutkan sekaligus menutup bagian ini. Dalam konteks rangkaian ketetapan sebelumnya, objek tersirat wajar diungkapkan sebagai “hal itu”; “menyampaikan” lebih alami daripada “berbicara kepada” untuk pemberitahuan ketetapan.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak-pihak yang menerima penyampaian Musa.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Merujuk kepada anak-anak laki-laki Harun dalam konteks keimaman. Bahasa Indonesia lazim memakai “anak-anaknya”; konteks menjelaskan bahwa yang dimaksud ialah para putranya.
- source_word: כָּל
  choice: seluruh
  rationale: Mengungkapkan cakupan segenap kelompok dengan alami dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang mapan dan tetap dekat dengan bentuk harfiah Ibrani “anak-anak laki-laki Israel”, sementara secara korporat menunjuk bangsa Israel.
theological_decisions:
- issue: Penerjemahan sebutan perjanjian בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; keturunan Israel
  rationale: Ungkapan ini adalah sebutan korporat bagi umat Israel. “Bani Israel” mempertahankan warna Semitik dan bentuk sebutan tradisional tanpa menyiratkan bahwa hanya laki-laki yang menerima penyampaian tersebut; alternatif yang lebih transparan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Bani Israel” dipertahankan sebagai istilah yang sudah dikenal, sedangkan catatan kaki menjelaskan fungsi korporatnya.
