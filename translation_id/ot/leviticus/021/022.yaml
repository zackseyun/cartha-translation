  source_fidelity: 'Terjemahan dengan tepat menyampaikan izin hukum dalam יֹאכֵל melalui “Ia boleh makan”, relasi posesif dalam “Allahnya”, serta dua golongan yang dibedakan dalam teks Ibrani: yang mahakudus dan yang kudus. “Makanan” merupakan padanan idiomatis yang sah untuk לֶחֶם dalam konteks bagian makanan imam.'
