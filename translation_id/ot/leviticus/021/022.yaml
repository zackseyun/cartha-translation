id: LEV.21.22
reference: Leviticus 21:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: id
  text: Ia boleh makan makanan Allahnya[a], baik dari persembahan-persembahan yang mahakudus maupun dari persembahan-persembahan yang kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti Allahnya”. Di sini “roti” digunakan dalam arti luas untuk bagian makanan yang menjadi hak imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: makanan
  rationale: Secara harfiah berarti “roti”, tetapi dalam konteks hukum persembahan kata ini mengacu secara lebih luas pada bagian makanan yang menjadi hak imam; “makanan” menyampaikan makna idiomatis tersebut.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Akhiran pronominal maskulin tunggal merujuk kepada imam. “Allahnya” mempertahankan bentuk posesif dan nuansa hubungan perjanjian dalam bahasa Ibrani.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: dari persembahan-persembahan yang mahakudus
  rationale: Rangkaian konstruksi ini merupakan bentuk superlatif yang menunjuk pada tingkat kekudusan tertinggi. “Persembahan-persembahan” memperjelas bahwa yang dimaksud ialah bagian-bagian kurban, bukan benda kudus secara umum.
- source_word: וּמִן הַקֳּדָשִׁים
  choice: maupun dari persembahan-persembahan yang kudus
  rationale: Frasa ini menunjuk pada golongan benda persembahan kudus yang dibedakan dari golongan mahakudus, sekaligus mempertahankan kaitan leksikal dengan akar קדש.
- source_word: יֹאכֵל
  choice: Ia boleh makan
  rationale: 'Dalam konteks hukum ini, bentuk imperfek menyatakan izin: imam yang memiliki cacat tetap berhak makan bagian-bagian kudus meskipun tidak boleh mendekati mezbah untuk mempersembahkannya.'
theological_decisions:
- issue: Daya hukum bentuk imperfek יֹאכֵל dalam peraturan keimaman
  choice: izin (“boleh makan”)
  alternative: masa depan sederhana (“akan makan”) atau kewajiban (“harus makan”)
  rationale: Konteks membedakan larangan bagi imam bercacat untuk mendekat dan mempersembahkan kurban dari haknya yang tetap berlaku untuk memakan bagian kudus. Bentuk izin paling tepat mempertahankan kontras hukum itu tanpa mengubahnya menjadi kewajiban.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata “mahakudus” dipakai sebagai superlatif kultis, sedangkan pasangan “baik ... maupun ...” menyampaikan bahwa izin tersebut mencakup kedua golongan persembahan kudus.
