  terminology: Pertahankan rangkaian 'kudus' dan 'menguduskan' untuk akar קדשׁ. 'Makanan Allahmu' dapat dipertahankan sebagai pemahaman kultis yang luas atas לֶחֶם, dengan catatan kaki yang menyediakan alternatif literal 'roti Allahmu.' 'Yahweh' konsisten dengan kebijakan yang diberikan.
