base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: id
  text: Harus kamu perlakukan dia sebagai kudus, karena dialah yang mempersembahkan makanan Allahmu.[a] Ia harus kudus bagimu, sebab Aku, Yahweh, yang menguduskan kamu, adalah kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “roti Allahmu.” Dalam konteks persembahan, “roti” dapat merujuk lebih luas kepada makanan atau persembahan makanan bagi Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: Engkau harus memperlakukannya sebagai orang kudus
  rationale: Bentuk Piel dari קדשׁ dengan akhiran objek memerintahkan umat untuk mengakui dan memperlakukan imam sebagai orang yang dikhususkan bagi Allah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: makanan Allahmu
  rationale: לֶחֶם secara harfiah berarti 'roti', tetapi dalam konteks kurban imamat dapat menunjuk secara lebih luas pada persembahan makanan bagi Allah. 'Makanan' menyampaikan cakupan kontekstual itu tanpa membatasinya pada roti.
- source_word: מַקְרִיב
  choice: mempersembahkan
  rationale: Partisip Hifil dari קרב dalam konteks kurban berarti membawa atau menyajikan sesuatu sebagai persembahan. 'Mempersembahkan' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: Ia harus kudus bagimu
  rationale: Terjemahan ini mempertahankan predikat 'kudus', nuansa kewajiban dari יִהְיֶה dalam konteks ini, serta relasi yang ditandai oleh לָּךְ ('bagimu').
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan suatu gelar.
- source_word: מְקַדִּשְׁכֶם
  choice: yang menguduskan kamu
  rationale: Partisip Piel ini menyatakan tindakan Yahweh yang menjadikan atau menetapkan umat-Nya kudus. 'Menguduskan' juga menjaga kaitan leksikal dengan tema kekudusan yang berulang dalam ayat.
theological_decisions:
- issue: Ungkapan kultis לֶחֶם אֱלֹהֶיךָ
  choice: makanan Allahmu
  alternative: roti Allahmu
  rationale: Dalam pelayanan kurban, לֶחֶם dapat mencakup persembahan makanan secara luas. Terjemahan utama memakai makna kontekstual tersebut tanpa menyiratkan bahwa Allah secara jasmani membutuhkan makanan.
- issue: Pengulangan akar קדשׁ
  choice: orang kudus / kudus / menguduskan
  alternative: orang yang dikhususkan / dikhususkan / menjadikan kudus
  rationale: 'Pilihan ini mempertahankan jalinan gagasan dalam teks: umat harus mengakui kekudusan imam, imam harus kudus bagi mereka, Yahweh sendiri kudus, dan Yahweh menguduskan umat.'
- issue: Rujukan orang kedua pada מְקַדִּשְׁכֶם
  choice: kamu
  alternative: kalian
  rationale: Akhiran Ibrani berbentuk jamak dan menunjuk kepada umat secara kolektif. Dalam bahasa Indonesia baku, 'kamu' dapat berfungsi tunggal maupun jamak dan sesuai dengan perubahan dari sapaan individual pada awal ayat menuju umat sebagai kelompok.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Dialah yang' memperjelas penekanan pada הוּא tanpa menambah gagasan baru. Tidak diperlukan catatan kaki karena makna kontekstual 'makanan' cukup kuat untuk teks utama dan tidak ada penanda catatan dalam teks.
