  source_fidelity: 'Makna pokok Ibrani terwakili dengan baik: umat diperintahkan memperlakukan imam itu sebagai kudus karena ia mempersembahkan makanan Allah; kekudusan imam, kekudusan Yahweh, dan tindakan Yahweh menguduskan umat dipertahankan. Namun, ''orang kudus'' tidak setepat fungsi predikatif קדוש dalam konteks imamat dan dalam penggunaan Indonesia dapat terbaca sebagai sebutan kategori orang saleh/santo, bukan status kultis yang harus diakui.'
