lexical_decisions:
- source_word: אוֹ
  choice: atau
  rationale: Konjungsi pemisah sederhana yang melanjutkan daftar kondisi fisik dalam peraturan ini.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina tunggal maskulin ini menunjuk kepada seorang laki-laki; dalam konteks ini, orang yang dimaksud adalah seorang imam laki-laki.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: yang ...-nya
  rationale: Ungkapan Ibrani ini secara harfiah berarti 'yang padanya terdapat', tetapi konstruksi posesif bahasa Indonesia lebih alami dan tetap menyampaikan bahwa kondisi itu ada pada tubuh orang tersebut.
- source_word: שֶׁבֶר
  choice: patah
  rationale: Nomina ini menyatakan patah atau retak tulang. 'Patah' merupakan padanan yang alami, jelas, dan tidak terlalu klinis dalam bahasa Indonesia.
- source_word: רָגֶל
  choice: kaki
  rationale: Makna dasarnya adalah 'kaki', meskipun dalam konteks tertentu cakupannya dapat meluas ke tungkai.
- source_word: שֶׁבֶר יָד
  choice: tangannya patah
  rationale: Terjemahan ini mempertahankan pengulangan gagasan 'patah' dan menerjemahkan יָד secara langsung sebagai 'tangan', meskipun kata Ibrani itu kadang dapat mencakup lengan.
