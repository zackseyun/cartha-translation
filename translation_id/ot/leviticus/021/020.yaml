  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: id
  text: atau yang bungkuk[a], atau yang bertubuh kerdil[b], atau yang memiliki kelainan pada matanya[c], atau yang menderita penyakit kulit yang gatal, atau yang menderita penyakit kulit berkeropeng[d], atau yang buah zakarnya remuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang punggungnya melengkung.”
    reason: lexical_alternative
  - marker: b
    text: Makna istilah Ibrani ini tidak pasti; mungkin menunjuk pada tubuh yang kerdil, tidak berkembang, atau menyusut.
    reason: lexical_alternative
  - marker: c
    text: Atau “yang memiliki bercak pada matanya”; jenis kelainan mata yang dimaksud tidak diketahui dengan pasti.
    reason: lexical_alternative
  - marker: d
    text: Kedua istilah Ibrani bagi penyakit kulit dalam ayat ini tampaknya menunjuk pada dua kondisi yang berbeda; diagnosis modernnya tidak dapat dipastikan.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: bungkuk
  rationale: Menunjukkan kelainan berupa punggung yang membungkuk atau melengkung; pilihan ini alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: דַק
  choice: yang pertumbuhan tubuhnya terhambat
  rationale: Makna istilah ini tidak pasti dan dapat menunjuk pada tubuh yang kerdil, tidak berkembang, atau menyusut. Ungkapan deskriptif ini mempertahankan cakupan makna tanpa memberi diagnosis yang terlalu spesifik.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: yang memiliki kelainan pada matanya
  rationale: Frasa ini menyebut suatu abnormalitas mata, tetapi jenis persisnya tidak diketahui; terjemahan umum menghindari ketepatan medis semu.
- source_word: גָרָב
  choice: yang terkena penyakit kulit gatal
  rationale: Istilah ini menunjuk pada penyakit atau iritasi kulit yang disertai rasa gatal. Terjemahan tersebut konkret tanpa menyamakannya dengan diagnosis modern tertentu.
- source_word: יַלֶּפֶת
  choice: penyakit kulit berkeropeng
  rationale: Ini merupakan kondisi kulit yang berbeda dari גָרָב. 'Berkeropeng' mempertahankan pembedaan dalam daftar tanpa memastikan diagnosis modern.
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: yang buah zakarnya remuk
  rationale: Frasa ini secara konkret menunjuk pada buah zakar yang diremukkan atau rusak; terjemahan langsung mempertahankan rujukan anatomis Ibrani.
- source_word: אוֹ
  choice: atau
  rationale: Partikel pemisah yang diulang pada setiap unsur daftar diterjemahkan secara konsisten untuk mempertahankan susunan katalog.
theological_decisions:
- issue: Istilah kondisi tubuh dalam hukum kekudusan mengenai imam
  choice: Menggunakan bahasa fisik yang langsung tanpa menyiratkan kesalahan moral.
  alternative: Memperhalusnya dengan eufemisme atau memakai istilah diagnosis medis modern.
  rationale: Ayat ini mencantumkan kondisi tubuh yang memengaruhi kelayakan pelayanan imam di mezbah, bukan menyatakan bahwa kondisi tersebut merupakan dosa. Terjemahan mempertahankan fokus jasmani teks tanpa menambahkan penilaian moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Struktur berulang 'atau' dipertahankan sesuai teks Ibrani. Istilah anatomi diterjemahkan secara jelas, sedangkan kondisi medis yang tidak pasti dijelaskan secara deskriptif dan diberi catatan kaki.
