revisions:
- from: Sebab, setiap laki-laki yang memiliki cacat tidak boleh mendekat untuk melayani sebagai imam:[a] orang yang buta, yang timpang, yang wajahnya cacat,[b] atau yang anggota tubuhnya terlalu panjang.[c]
  to: 'Sebab, tidak seorang pun yang memiliki cacat boleh mendekat: seorang yang buta, seorang yang timpang, seorang yang berwajah cacat,[a] atau seorang yang anggota tubuhnya terlalu panjang.[b]'
  rationale: Revisi mempertahankan makna dan ruang lingkup kultis ayat, tetapi mengembalikan “mendekat” sebagai terjemahan teks utama bagi יִקְרָב dan menempatkan penjelasan pelayanan imam dalam catatan kaki. Daftar juga dibuat lebih paralel dan alami. Catatan untuk dua istilah Ibrani langka mempertahankan ketidakpastian leksikal.
