base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: id
  text: 'Sebab, tidak seorang pun yang memiliki cacat boleh mendekat: seorang yang buta, seorang yang timpang, seorang yang berwajah cacat,[a] atau seorang yang anggota tubuhnya terlalu panjang.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini langka dan mungkin lebih khusus menunjuk pada seseorang yang hidungnya rusak atau berbentuk tidak normal.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang anggota tubuhnya memanjang atau tidak proporsional.” Kata Ibrani ini tampaknya menunjuk pada anggota tubuh yang terlalu panjang atau tidak proporsional.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan dasar bagi larangan dalam ayat sebelumnya; “Sebab” menyampaikan fungsi penjelas tersebut secara alami.
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: setiap laki-laki yang memiliki cacat
  rationale: Bentuk Ibrani secara harfiah menyebut “setiap laki-laki yang padanya ada cacat”; konteksnya adalah laki-laki keturunan Harun yang dapat melayani sebagai imam.
- source_word: לֹא יִקְרָב
  choice: tidak boleh mendekat untuk melayani sebagai imam
  rationale: Dalam konteks hukum keimaman, kata kerja ini menunjuk pada mendekat untuk menjalankan pelayanan kudus. Tambahan penjelas mencegah larangan ini disalahpahami sebagai pengucilan sosial umum.
- source_word: אִישׁ עִוֵּר
  choice: orang yang buta
  rationale: Ungkapan yang jelas, alami, dan tidak menambahkan rincian di luar teks.
- source_word: פִסֵּחַ
  choice: yang timpang
  rationale: “Timpang” merupakan padanan Indonesia yang ringkas untuk kondisi yang mengganggu kemampuan berjalan tanpa memakai istilah yang merendahkan.
- source_word: חָרֻם
  choice: yang wajahnya cacat
  rationale: Istilah Ibrani ini langka dan makna tepatnya tidak pasti; kemungkinan menunjuk pada cacat atau kerusakan wajah, khususnya hidung. Terjemahan mempertahankan ketidakpastian itu dengan catatan kaki.
- source_word: שָׂרוּעַ
  choice: yang anggota tubuhnya terlalu panjang
  rationale: Istilah ini kemungkinan menunjuk pada anggota tubuh yang memanjang atau tidak proporsional; pilihan ini konkret tetapi tetap diberi catatan mengenai alternatifnya.
theological_decisions:
- issue: Ruang lingkup larangan bagi imam yang memiliki cacat fisik
  choice: Menyatakan secara eksplisit bahwa “mendekat” berkaitan dengan pelayanan sebagai imam.
  alternative: Menerjemahkan secara harfiah hanya sebagai “tidak boleh mendekat”.
  rationale: Konteks langsung membatasi larangan pada pendekatan ritual dalam pelayanan keimaman, bukan pada martabat pribadi, kedudukan moral, atau pergaulan sosial seseorang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat. Istilah kondisi fisik dibuat ringkas dan tidak merendahkan. Cakupan ritual dari “mendekat” diperjelas agar pembaca umum tidak menafsirkannya sebagai larangan sosial umum; ketidakpastian dua istilah Ibrani yang langka dipertahankan melalui catatan kaki.
