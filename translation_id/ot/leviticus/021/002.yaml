base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/002.yaml
  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: id
  text: 'kecuali bagi kerabat dekatnya[a]: bagi ibunya, bagi ayahnya, bagi anak laki-lakinya, bagi anak perempuannya, dan bagi saudara laki-lakinya—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שְׁאֵר secara harfiah dapat berarti “daging” dan juga menunjuk pada kerabat; karena itu, frasa ini juga dapat diterjemahkan “kerabat sedarah” atau “sanak daging.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: kecuali karena
  rationale: Dalam konteks hukum ini, ungkapan tersebut memperkenalkan pengecualian terhadap larangan pada ayat sebelumnya; kata 'karena' juga menghubungkan daftar orang yang kematiannya mengizinkan kenajisan ritual.
- source_word: שְׁאֵרוֹ
  choice: kerabat sedarahnya
  rationale: שְׁאֵר secara harfiah berkaitan dengan 'daging' dan di sini menunjuk pada hubungan kekerabatan; 'kerabat sedarah' mempertahankan nuansa jasmani-kekerabatan dengan bahasa Indonesia yang wajar.
- source_word: הַקָּרֹב אֵלָיו
  choice: yang dekat dengannya
  rationale: Terjemahan ini mempertahankan gagasan kedekatan hubungan tanpa memaksakan arti superlatif yang tidak dinyatakan secara morfologis.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: karena ibunya, ayahnya, anak laki-lakinya, anak perempuannya, dan saudara laki-lakinya
  rationale: Preposisi לְ dipahami sebagai penanda orang yang karena kematiannya imam boleh menajiskan diri. 'Karena' dinyatakan sekali di awal daftar agar alami dalam bahasa Indonesia, sementara semua anggota keluarga tunggal dan pembedaan gender dipertahankan.
theological_decisions:
- issue: Hubungan frasa ini dengan larangan menajiskan diri pada ayat sebelumnya
  choice: Mempertahankannya sebagai anak kalimat pengecualian yang berlanjut dari ayat 1
  alternative: Menjadikannya kalimat mandiri dengan menambahkan kata kerja seperti 'ia boleh menajiskan diri'
  rationale: Teks Ibrani ayat 2 tidak mengulang kata kerja; bentuk fragmen dengan tanda pisah mempertahankan kesinambungan sintaksis dan tidak menambahkan unsur yang hanya tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat sengaja dibiarkan berlanjut dari ayat sebelumnya, sesuai sintaksis Ibrani. Istilah kekerabatan dibuat eksplisit menurut gender untuk mencerminkan bentuk Ibrani.
