  terminology: '"Kerabat dekat" merupakan padanan netral dan modern untuk istilah kekerabatan שְׁאֵר yang diperjelas oleh הַקָּרֹב אֵלָיו. "Saudara laki-laki" tepat untuk אָח dalam daftar ini. Catatan kaki dipindahkan ke frasa yang dijelaskannya dan tetap menyebut nuansa harfiah "daging".'
