  variant: modern standard Indonesian
source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: id
  text: Mereka harus kudus bagi Allah mereka dan tidak boleh mencemarkan nama Allah mereka, sebab mereka mempersembahkan persembahan yang dipersembahkan dengan api[a] bagi Yahweh, yaitu makanan Allah mereka. Karena itu, mereka harus kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: "persembahan api bagi Yahweh, roti Allah mereka."'
    reason: Menjelaskan istilah teknis Ibrani אִשֵּׁי (persembahan melalui api) dan mempertahankan alternatif harfiah untuk לֶחֶם (roti).
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ לֵאלֹהֵיהֶם
  choice: Mereka harus kudus bagi Allah mereka
  rationale: Dalam konteks hukum, bentuk imperfek menyatakan kewajiban. 'Harus kudus' alami dalam bahasa Indonesia dan mempertahankan gagasan pengkhususan bagi Allah.
- source_word: יְחַלְּלוּ
  choice: mencemarkan
  rationale: Bentuk Piel dari חלל berarti memperlakukan sebagai tidak kudus atau menajiskan. 'Mencemarkan' jelas dan wajar dalam ungkapan 'mencemarkan nama'.
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: nama Allah mereka
  rationale: Terjemahan langsung frasa konstruksi Ibrani yang mempertahankan bobot relasional dan religiusnya.
- source_word: אִשֵּׁי יְהוָה
  choice: kurban-kurban api bagi Yahweh
  rationale: אִשֶּׁה adalah istilah teknis bagi persembahan yang dibakar atau dipersembahkan melalui api. Terjemahan ini mempertahankan unsur api yang nyata dalam istilah sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: makanan Allah mereka
  rationale: Walaupun לֶחֶם secara harfiah dapat berarti 'roti', dalam konteks kurban kata ini menunjuk lebih luas kepada makanan persembahan.
- source_word: מַקְרִיבִם
  choice: mempersembahkan
  rationale: Partisipel Hifil dari קרב dalam konteks ritual berarti membawa mendekat sebagai persembahan; 'mempersembahkan' merupakan padanan Indonesia yang alami dan tepat.
- source_word: וְהָיוּ קֹדֶשׁ
  choice: Karena itu, mereka harus kudus
  rationale: Klausa penutup mengulangi tuntutan kekudusan berdasarkan tugas keimaman yang baru disebutkan. 'Karena itu' menyatakan hubungan logis yang tersirat dalam alur kalimat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menggunakan nama perjanjian secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Makna ungkapan kultis אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם
  choice: kurban-kurban api bagi Yahweh, yaitu makanan Allah mereka
  alternative: persembahan-persembahan makanan bagi Yahweh, roti Allah mereka
  rationale: Pilihan utama mempertahankan unsur api dalam istilah teknis אִשֶּׁה, sedangkan 'makanan' menyampaikan cakupan kontekstual לֶחֶם tanpa membatasinya pada roti harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Pengulangan 'Allah mereka' dan 'harus kudus' dipertahankan karena merupakan penekanan retoris teks Ibrani.
