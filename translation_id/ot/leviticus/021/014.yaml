  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: id
  text: Ia tidak boleh memperistri seorang janda, perempuan yang diceraikan, perempuan yang ternoda[a], atau pelacur. Ia hanya boleh memperistri seorang perawan dari bangsanya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perempuan yang dinodai” atau “perempuan yang dianggap tidak kudus”; istilah Ibrani ini menunjuk pada perempuan yang statusnya dianggap tidak layak menurut hukum kekudusan imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: seorang janda
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk perempuan yang suaminya telah meninggal.
- source_word: גְרוּשָׁה
  choice: perempuan yang diceraikan
  rationale: Bentuk pasif Ibrani menunjukkan perempuan yang telah diceraikan; ungkapan ini mempertahankan nuansa hukum perkawinan.
- source_word: חֲלָלָה
  choice: perempuan yang ternoda
  rationale: Dalam hukum kekudusan imam, istilah ini menunjuk pada status yang dianggap telah dinodai atau dijadikan tidak layak bagi perkawinan imam. Pilihan ini cukup alami tanpa menghapus nuansa kekudusan ritual-status.
- source_word: זֹנָה
  choice: pelacur
  rationale: Padanan langsung, jelas, dan lazim dalam bahasa Indonesia modern.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: Ia tidak boleh memperistri
  rationale: Secara harfiah berarti 'tidak mengambil mereka', tetapi konteks dan אִשָּׁה menunjukkan tindakan mengambil sebagai istri; 'memperistri' menyampaikan idiom perkawinan secara alami.
- source_word: כִּי אִם
  choice: Ia hanya boleh
  rationale: 'Mengungkapkan pembatasan dan kontras: bukan perempuan dalam kategori sebelumnya, melainkan hanya perempuan yang disebut sesudahnya.'
- source_word: בְּתוּלָה
  choice: seorang perawan
  rationale: Dalam konteks hukum perkawinan ini, istilah tersebut secara khusus menunjuk pada perempuan yang masih perawan.
- source_word: מֵעַמָּיו
  choice: dari bangsanya sendiri
  rationale: Menunjukkan asal dari kalangan kelompok bangsanya sendiri; 'sendiri' memperjelas hubungan pronominal tanpa menambah pembatasan baru.
- source_word: אִשָּׁה
  choice: memperistri
  rationale: Fungsi kata 'istri/perempuan' diserap secara alami ke dalam verba Indonesia 'memperistri', yang menyatakan pengambilan seseorang sebagai istri.
theological_decisions:
- issue: Makna istilah status kekudusan imam חֲלָלָה
  choice: perempuan yang ternoda
  alternative: perempuan yang dinodai; perempuan yang dianggap tidak kudus
  rationale: Istilah ini berkaitan dengan status yang ternoda atau profan menurut hukum kekudusan imam, bukan sekadar kenajisan fisik. Teks utama memakai ungkapan yang mudah dipahami, sedangkan catatan kaki mempertahankan kemungkinan padanan yang lebih harfiah dan menjelaskan konteks statusnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Verba 'memperistri' dipakai untuk menyampaikan idiom hukum perkawinan secara ringkas dan alami. Penanda catatan kaki ditempatkan pada istilah חֲלָלָה yang memang dijelaskannya.
