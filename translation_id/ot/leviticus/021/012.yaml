    text: Atau, secara lebih harfiah, “mahkota dari minyak urapan Allahnya ada padanya.” Kata Ibrani yang dipakai dapat berarti “mahkota” atau “pengudusan/pentahbisan.”
    reason: lexical_alternative
  revision_rationale: Revisi terbatas pada frasa נֵזֶר שֶׁמֶן מִשְׁחַת אֱלֹהָיו dan catatan kakinya. Frasa utama tidak lagi menambahkan bahwa minyak adalah ‘tanda,’ melainkan menyatakan pengudusan yang berhubungan dengan minyak urapan. Catatan kaki mempertahankan pembacaan ‘mahkota’ tanpa memaksakan salah satu makna leksikal yang diperdebatkan.
