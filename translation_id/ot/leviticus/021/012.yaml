revisions:
- from: Ia tidak boleh keluar dari tempat kudus dan tidak boleh mencemarkan tempat kudus Allahnya, sebab tanda pengudusan berupa minyak urapan Allahnya ada padanya.[a] Akulah TUHAN.
  to: Ia tidak boleh keluar dari tempat kudus dan tidak boleh mencemarkan tempat kudus Allahnya, sebab pengudusan oleh minyak urapan Allahnya ada padanya.[a] Akulah TUHAN.
  rationale: Revisi terbatas pada frasa נֵזֶר שֶׁמֶן מִשְׁחַת אֱלֹהָיו dan catatan kakinya. Frasa utama tidak lagi menambahkan bahwa minyak adalah ‘tanda,’ melainkan menyatakan pengudusan yang berhubungan dengan minyak urapan. Catatan kaki mempertahankan pembacaan ‘mahkota’ tanpa memaksakan salah satu makna leksikal yang diperdebatkan.
