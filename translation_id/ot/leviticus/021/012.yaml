base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: id
  text: Ia tidak boleh keluar dari tempat kudus dan tidak boleh mencemarkan tempat kudus Allahnya, sebab pengudusan oleh minyak urapan Allahnya ada padanya.[a] Akulah TUHAN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “mahkota dari minyak urapan Allahnya ada padanya.” Kata Ibrani yang dipakai dapat berarti “mahkota” atau “pengudusan/pentahbisan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ לֹא יֵצֵא
  choice: Ia tidak boleh keluar dari tempat kudus
  rationale: מִקְדָּשׁ menunjuk pada tempat yang kudus atau tempat suci. Dalam konteks hukum imamat, 'tempat kudus' alami dan jelas; bentuk imperfek negatif diterjemahkan sebagai larangan.
- source_word: וְלֹא יְחַלֵּל אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: dan tidak boleh mencemarkan tempat kudus Allahnya
  rationale: Bentuk piel חלל berarti menjadikan sesuatu yang kudus tidak kudus, yakni mencemarkan atau menajiskannya. 'Mencemarkan' mempertahankan pertentangan dengan kekudusan tanpa terdengar terlalu teknis.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi kedua larangan sebelumnya.
- source_word: נֵזֶר
  choice: tanda pengudusan
  rationale: נֵזֶר dapat berarti mahkota/diadem ataupun status atau tanda pengudusan. Dalam kaitannya dengan minyak urapan imam besar, 'tanda pengudusan' menyampaikan fungsi frasa tersebut sambil mempertahankan bahwa ada tanda yang dikenakan atau melekat padanya.
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: minyak urapan Allahnya
  rationale: Ungkapan ini menerjemahkan rangkaian konstruksi Ibrani secara ringkas dan alami, dengan semua unsur maknanya tetap hadir.
- source_word: עָלָיו
  choice: ada padanya
  rationale: Frasa ini menyatakan keadaan yang terus berlaku pada imam besar sebagai orang yang telah diurapi dan dikuduskan.
- source_word: אֲנִי יְהוָה
  choice: Akulah TUHAN
  rationale: Formula ilahi yang berulang dalam Imamat diterjemahkan secara khidmat; nama perjanjian יהוה ditampilkan menurut konvensi Alkitab bahasa Indonesia sebagai 'TUHAN'.
theological_decisions:
- issue: Makna נֵזֶר dalam hubungannya dengan minyak urapan imam besar
  choice: tanda pengudusan berupa minyak urapan Allahnya
  alternative: mahkota dari minyak urapan Allahnya
  rationale: Konteks menekankan status kudus yang ditandai oleh pengurapan, tetapi נֵזֶר juga dapat membawa citra mahkota atau diadem. Teks utama menyampaikan fungsi kontekstualnya, sedangkan arti yang lebih harfiah dipertahankan dalam catatan kaki agar ambiguitas leksikal tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'tempat kudus' dipertahankan mengikuti penekanan hukum dalam teks Ibrani; struktur kalimat dibuat mudah dipahami tanpa menghapus ambiguitas נֵזֶר.
