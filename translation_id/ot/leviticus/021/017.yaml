  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּבֵּ֥ר אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אִ֣ישׁ מִֽ/זַּרְעֲ/ךָ֞ לְ/דֹרֹתָ֗/ם אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְ/הַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: id
  text: 'Katakanlah kepada Harun: Setiap laki-laki dari keturunanmu, turun-temurun, yang mempunyai cacat[a] tidak boleh mendekat untuk mempersembahkan makanan Allahnya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cela.” Kata Ibrani mum menunjuk pada cacat fisik yang membuat seseorang tidak memenuhi syarat untuk tugas keimaman ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “roti Allahnya”; dalam konteks keimaman ini, “roti” menunjuk secara lebih luas pada makanan yang dipersembahkan sebagai korban.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן לֵאמֹר
  choice: Katakanlah kepada Harun
  rationale: Menyampaikan daya imperatif dan formula pengantar ucapan Ibrani secara alami dalam bahasa Indonesia modern; tanda titik dua menggantikan terjemahan kaku לֵאמֹר.
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: Setiap laki-laki dari keturunanmu
  rationale: אִישׁ berbentuk maskulin dan konteksnya menyangkut keturunan laki-laki Harun yang dapat menjalankan tugas keimaman; 'keturunanmu' mempertahankan gagasan garis keturunan.
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan Indonesia yang ringkas dan alami untuk keberlakuan ketetapan dalam generasi-generasi berikutnya.
- source_word: מוּם
  choice: cacat
  rationale: Dalam konteks hukum keimaman, מוּם menunjuk pada kondisi fisik yang menggugurkan kelayakan untuk tugas khusus ini. 'Cacat' jelas dan tidak membatasi maknanya pada noda kosmetik.
- source_word: לֹא יִקְרַב
  choice: tidak boleh mendekat
  rationale: Mempertahankan citra mendekat yang bersifat teknis dalam ibadah sekaligus menyatakan larangan hukum.
- source_word: לְהַקְרִיב
  choice: untuk mempersembahkan
  rationale: Bentuk hifil dari קרב dalam konteks korban berarti membawa atau menyajikan sebagai persembahan; 'mempersembahkan' merupakan padanan Indonesia yang idiomatis.
- source_word: לֶחֶם אֱלֹהָיו
  choice: makanan Allahnya
  rationale: לֶחֶם secara harfiah berarti 'roti', tetapi dalam idiom keimaman di sini mencakup makanan persembahan. Pilihan ini mempertahankan hubungan kepunyaan dalam teks sambil menyampaikan cakupan kontekstualnya.
theological_decisions:
- issue: Larangan kultis bagi imam yang mempunyai cacat fisik
  choice: Menerjemahkannya sebagai pembatasan untuk mendekat dan mempersembahkan makanan korban dalam tugas keimaman tertentu.
  alternative: Memakai bahasa yang dapat menyiratkan kenajisan moral, berkurangnya nilai pribadi, atau pengucilan menyeluruh dari umat perjanjian.
  rationale: Ayat ini mengatur kelayakan menjalankan fungsi khusus di tempat kudus. Teks tidak menyatakan kesalahan moral, rendahnya martabat manusia, ataupun pengucilan dari seluruh kehidupan perjanjian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang khidmat namun mudah dipahami. 'Turun-temurun' dipilih untuk kelancaran, sedangkan istilah teknis 'mendekat' dipertahankan karena penting dalam konteks tempat kudus.
