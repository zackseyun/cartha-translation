  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: id
  text: Tidak seorang laki-laki pun dari keturunan Harun, imam itu, yang memiliki cacat boleh mendekat untuk mempersembahkan persembahan bagi Yahweh yang dipersembahkan dengan api.[a] Ia memiliki cacat; ia tidak boleh mendekat untuk mempersembahkan roti Allahnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “persembahan sajian bagi Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: “Roti Allahnya” adalah ungkapan keimaman untuk makanan yang dipersembahkan kepada Allah sebagai kurban; dapat juga diterjemahkan “makanan Allahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: Tidak seorang laki-laki pun
  rationale: Gabungan כָּל dengan klausa negatif menyatakan larangan universal. 'Laki-laki' mempertahankan bentuk maskulin dan sesuai dengan konteks keturunan Harun yang menjalankan tugas keimaman.
- source_word: מוּם
  choice: cacat
  rationale: Dalam konteks hukum keimaman ini, מוּם menunjuk pada kondisi jasmani yang menyebabkan seseorang tidak boleh menjalankan tugas tertentu di mezbah. 'Cacat' adalah padanan Indonesia yang langsung dan umum.
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: dari keturunan Harun, sang imam
  rationale: זֶרַע di sini menyatakan garis keturunan, sedangkan הַכֹּהֵן menerangkan Harun secara aposisional.
- source_word: יִגַּשׁ
  choice: boleh mendekat
  rationale: Dalam konteks ibadah, נגשׁ berarti mendekat untuk melaksanakan pelayanan kurban. Modal 'boleh' bersama penyangkalan menyampaikan daya larangan hukum dengan wajar dalam bahasa Indonesia.
- source_word: לְהַקְרִיב
  choice: untuk mempersembahkan
  rationale: Bentuk kausatif dari קרב dalam konteks kurban berarti membawa atau menyajikan sesuatu sebagai persembahan.
- source_word: אִשֵּׁי יְהוָה
  choice: persembahan makanan bagi Yahweh
  rationale: Istilah teknis אִשֶּׁה berkaitan dengan persembahan yang dibakar, tetapi dalam konteks imamat juga memiliki nuansa sajian bagi Allah dan sejajar dengan לֶחֶם pada bagian berikutnya. Terjemahan utama mempertahankan hubungan semantis itu, sementara alternatif yang menonjolkan api dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi diterjemahkan secara langsung sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: לֶחֶם אֱלֹהָיו
  choice: roti Allahnya
  rationale: לֶחֶם secara harfiah berarti 'roti', tetapi di sini merupakan ungkapan keimaman bagi makanan yang dipersembahkan kepada Allah. Bentuk harfiah dipertahankan dalam teks dan makna idiomatis dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menggunakan Tetragramaton sebagai nama diri; bentuk 'Yahweh' mempertahankan fungsi nama tersebut.
- issue: Cakupan larangan bagi imam yang memiliki מוּם
  choice: Larangan khusus untuk mendekat dan mempersembahkan sajian kurban
  alternative: Larangan umum terhadap seluruh peran atau keberadaan dalam komunitas
  rationale: Ayat ini secara khusus mengulang larangan mendekat untuk mempersembahkan אִשֵּׁי יהוה atau לֶחֶם אֱלֹהָיו. Terjemahan tidak memperluas larangan melampaui tindakan ritual yang disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'mendekat untuk mempersembahkan' dipertahankan karena menonjol dalam teks Ibrani. Susunan singkat 'Ada cacat padanya' mempertahankan penegasan klausa Ibrani tanpa menambahkan penilaian di luar konteks hukum ritual.
