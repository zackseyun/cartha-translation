revisions:
- from: Tidak seorang laki-laki pun dari keturunan Harun, sang imam, yang memiliki cacat boleh mendekat untuk mempersembahkan persembahan makanan bagi Yahweh.[a] Ada cacat padanya; ia tidak boleh mendekat untuk mempersembahkan roti Allahnya.[b]
  to: Tidak seorang laki-laki pun dari keturunan Harun, imam itu, yang memiliki cacat boleh mendekat untuk mempersembahkan persembahan bagi Yahweh yang dipersembahkan dengan api.[a] Ia memiliki cacat; ia tidak boleh mendekat untuk mempersembahkan roti Allahnya.[b]
  rationale: Revisi membedakan istilah אִשֵּׁי dari istilah Indonesia yang dapat dipahami sebagai persembahan makanan tertentu, sambil tetap memberi alternatif yang mencerminkan nuansa sajian. Aposisi dan klausa penegas juga dirapikan agar lebih wajar dalam bahasa Indonesia baku tanpa mengubah cakupan larangan ritual.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:18:27Z'
review_pass:
  verdict: revise
  source_fidelity: Klausa larangan, garis keturunan Harun, pengulangan 'mendekat untuk mempersembahkan', dan nama Yahweh telah dialihkan dengan setia. Namun, 'persembahan makanan' dalam bahasa Indonesia berpotensi dipahami sebagai jenis persembahan tertentu (misalnya persembahan bahan makanan/bijian), sedangkan אִשֵּׁי terutama menunjuk pada persembahan yang dipersembahkan dengan api. Penyesuaian utama memperjelas unsur ini tanpa menghilangkan hubungan sajian dengan 'roti Allahnya'.
  naturalness: Kalimat pembuka pada dasarnya baku. 'Ia memiliki cacat' lebih alami daripada 'Ada cacat padanya' dan tetap mempertahankan penegasan pengulangan Ibrani. 'Imam itu' adalah aposisi yang lebih netral dan modern daripada 'sang imam'.
  terminology: '''Cacat'' dipertahankan sebagai padanan langsung מוּם dalam konteks kualifikasi ritual, tanpa memperluasnya menjadi penilaian atas martabat seseorang. Yahweh dipertahankan untuk יהוה. ''Roti Allahnya'' dipertahankan sebagai idiom kultis, dengan penjelasan catatan kaki.'
  issues:
  - severity: medium
    issue: '''Persembahan makanan bagi Yahweh'' untuk אִשֵּׁי יהוה'
    rationale: Ungkapan ini dapat secara keliru terdengar seperti nama suatu persembahan makanan/bijian dalam bahasa Indonesia. Dalam sumber Ibrani, istilah teknis tersebut secara leksikal terkait dengan persembahan yang dipersembahkan dengan api. Terjemahan utama perlu menyatakan unsur itu, sementara alternatif yang menonjolkan sajian/makanan dapat dicatat.
  - severity: low
    issue: '''Ada cacat padanya'' kurang idiomatis'
    rationale: Klausa nominal מוּם בּוֹ berfungsi sebagai penegasan alasan kualifikasi ritual. 'Ia memiliki cacat' menyampaikan isi yang sama dalam bahasa Indonesia modern dan mempertahankan pengulangan kata 'cacat'.
  revised_text: Tidak seorang laki-laki pun dari keturunan Harun, imam itu, yang memiliki cacat boleh mendekat untuk mempersembahkan persembahan bagi Yahweh yang dipersembahkan dengan api.[a] Ia memiliki cacat; ia tidak boleh mendekat untuk mempersembahkan roti Allahnya.[b]
