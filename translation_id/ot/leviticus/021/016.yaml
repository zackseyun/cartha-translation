  yaml_path: translation/ot/leviticus/021/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN.”'
    reason: Memberikan bentuk Ibrani dan padanan tradisional bagi nama ilahi.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam formula pengantar ucapan ilahi, bentuk ini secara alami dan bermartabat diterjemahkan dengan verba khusus untuk perkataan Allah dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: אֶל menandai pihak yang dituju dalam tindakan berbicara; 'kepada Musa' merupakan ungkapan Indonesia modern yang alami.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam formula Ibrani, kata ini memperkenalkan isi ucapan yang menyusul. Karena ayat berakhir tepat pada formula tersebut, tanda koma mempertahankan fungsi pengantarnya tanpa ungkapan Indonesia yang kaku seperti 'dengan berkata'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi. Bentuk 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' adalah penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berfirman' sesuai dengan formula ucapan ilahi; koma di akhir menunjukkan bahwa isi firman berlanjut pada ayat berikutnya.
