id: LEV.21.1
reference: Leviticus 21:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa, “Katakanlah kepada para imam, anak-anak Harun, dan katakan kepada mereka: Jangan seorang pun menajiskan dirinya[a] karena orang mati[b] di antara bangsanya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi najis.” Yang dimaksud ialah kenajisan ritual akibat orang mati.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “karena suatu נֶפֶשׁ (nefesy)”; dalam konteks hukum kenajisan, ungkapan ini berarti orang mati atau jenazah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar seperti ‘TUHAN’.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: Katakanlah ... dan katakan
  rationale: Mempertahankan pengulangan verba אמר dalam bahasa Ibrani dengan susunan yang tetap wajar dalam bahasa Indonesia.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: para imam, anak-anak Harun
  rationale: Mempertahankan bentuk aposisional dan sebutan kekeluargaan dalam teks sumber; dalam konteks ini ‘anak-anak’ juga mencakup garis keturunan Harun.
- source_word: לְנֶפֶשׁ
  choice: karena orang mati
  rationale: Dalam konteks hukum kenajisan, נֶפֶשׁ secara idiomatis menunjuk kepada orang mati atau jenazah, bukan ‘jiwa’.
- source_word: יִטַּמָּא
  choice: menajiskan dirinya
  rationale: Mengungkapkan nuansa refleksif dan kategori kenajisan ritual akibat hubungan atau kontak dengan orang mati.
- source_word: בְּעַמָּיו
  choice: di antara bangsanya
  rationale: Menerjemahkan ungkapan secara langsung tanpa mempersempitnya menjadi ‘kerabat’; ayat-ayat berikutnya menjelaskan pengecualian bagi keluarga dekat.
theological_decisions:
- issue: Sifat kenajisan dalam peraturan bagi imam
  choice: 'Bahasa kenajisan ritual: ‘menajiskan dirinya’'
  alternative: ‘menjadi najis’ atau ‘mencemarkan dirinya’
  rationale: Konteksnya adalah kenajisan ritual karena orang mati, bukan pernyataan bahwa tindakan tersebut pada dirinya merupakan kejahatan moral. ‘Mencemarkan’ berpotensi memberi kesan moral yang lebih kuat.
- issue: Subjek larangan dalam sapaan jamak
  choice: ‘Jangan seorang pun’
  alternative: ‘Seorang imam tidak boleh’
  rationale: Bentuk verba Ibrani tunggal mengikuti sapaan kepada kelompok imam dan menyatakan larangan yang berlaku bagi setiap orang di antara mereka; terjemahan ini tidak menambahkan nomina ‘imam’ ke dalam klausa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ‘katakanlah ... dan katakan’ sengaja dipertahankan karena terdapat dalam teks Ibrani. ‘Bangsanya’ mempertahankan keluasan referen עַמָּיו, sedangkan hubungan kekerabatan yang dikecualikan baru dirinci dalam ayat-ayat selanjutnya.
