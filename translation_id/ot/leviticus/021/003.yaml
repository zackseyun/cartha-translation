  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: id
  text: Ia juga boleh menjadi najis karena saudara perempuannya yang masih perawan, yang dekat dengannya dan belum bersuami[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang belum menjadi milik seorang laki-laki.” Ungkapan Ibrani ini juga dapat dipahami sebagai “yang belum menikah dengan seorang laki-laki” atau “yang belum pernah bersatu dengan seorang laki-laki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: juga karena saudara perempuannya
  rationale: Konjungsi dan preposisi melanjutkan daftar kerabat yang kematiannya mengizinkan imam menjadi najis; sufiks pronominal menyatakan bahwa perempuan itu adalah saudara perempuannya.
- source_word: הַבְּתוּלָה
  choice: yang masih perawan
  rationale: בְּתוּלָה secara langsung menyatakan status keperawanan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur penting dalam ketentuan hukum tersebut.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: dan dekat dengannya
  rationale: Terjemahan ini mempertahankan gambaran Ibrani mengenai kedekatan hubungan tanpa membatasinya hanya pada kedekatan emosional.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: yang belum menikah dengan seorang laki-laki[a]
  rationale: Secara harfiah ungkapan ini berarti kira-kira 'yang belum menjadi milik/seorang laki-laki.' Dalam konteks hukum keluarga, pernikahan merupakan makna yang paling wajar, sedangkan catatan kaki mempertahankan kemungkinan nuansa persatuan atau hubungan dengan laki-laki.
- source_word: לָהּ
  choice: karena dialah
  rationale: Pronomina feminin ditegaskan dalam bahasa Indonesia untuk menghubungkan izin menjadi najis secara jelas dengan saudara perempuan tersebut.
- source_word: יִטַּמָּא
  choice: imam itu boleh menjadi najis
  rationale: Bentuk ini menyatakan izin dalam rangkaian ketentuan dan menunjuk pada kenajisan ritual akibat kematian, bukan pencemaran moral. Penyebutan 'imam itu' memperjelas subjek yang tersirat dari konteks.
theological_decisions:
- issue: Sifat kenajisan dalam hukum imamat
  choice: menjadi najis dalam arti ritual
  alternative: menajiskan dirinya dalam arti moral
  rationale: Konteksnya adalah aturan kenajisan imam akibat kontak dengan orang mati. Karena itu, terjemahan tidak boleh menyiratkan bahwa tindakan yang diizinkan ini merupakan dosa atau kerusakan moral.
- issue: Makna אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: belum menikah dengan seorang laki-laki, dengan alternatif dicatat
  alternative: belum pernah berhubungan atau bersatu dengan seorang laki-laki
  rationale: Ungkapan Ibrani bersifat idiomatis dan dapat menunjuk pada masuknya seorang perempuan ke dalam ikatan dengan laki-laki. Terjemahan utama memakai pengertian perkawinan yang paling sesuai dengan konteks rumah tangga, tanpa menutup nuansa lain.
translation_notes:
  register: Bahasa dibuat modern, jelas, dan bermartabat. Struktur kalimat mempertahankan hubungan erat dengan susunan hukum Ibrani, sementara pengulangan 'karena dialah' menjaga penekanan pronomina feminin dan memperjelas alasan imam diizinkan menjadi najis.
