  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: id
  text: Namun, ia tidak boleh masuk sampai ke tabir atau mendekati mazbah, karena ada cacat pada tubuhnya[a], agar ia tidak mencemarkan tempat-tempat kudus-Ku[b]; sebab Akulah Yahweh yang menguduskan semuanya itu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ada cacat padanya.” Yang dimaksud dalam konteks ini ialah kondisi fisik yang membatasi tugas keimaman tertentu, bukan kesalahan moral.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani memakai bentuk jamak: “tempat-tempat kudus-Ku.”'
    reason: lexical_alternative
  - marker: c
    text: “Semuanya itu” paling mungkin merujuk pada tempat-tempat kudus. Ada kemungkinan sufiks Ibraninya merujuk lebih luas kepada para imam atau umat.
    reason: referential_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pembatasan terhadap izin pada ayat sebelumnya dengan pertentangan yang alami dalam bahasa Indonesia.
- source_word: הַפָּרֹכֶת
  choice: tabir
  rationale: Istilah yang jelas dan lazim untuk tirai pemisah di tempat kudus.
- source_word: יָבֹא
  choice: masuk sampai ke
  rationale: Dalam konstruksi dengan אֶל, menyatakan gerak memasuki atau mencapai kawasan di dekat tabir; frasa ini menghindari kesan bahwa imam memasuki tabir itu sendiri.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: Istilah baku dalam bahasa Indonesia untuk altar persembahan dalam konteks keimaman.
- source_word: יִגַּשׁ
  choice: mendekati
  rationale: Menyampaikan bahasa pendekatan ritual secara alami dan tepat.
- source_word: מוּם בּוֹ
  choice: ada cacat pada tubuhnya
  rationale: מוּם menunjuk pada kondisi fisik yang membatasi pelayanan imam dalam konteks hukum ini, bukan kesalahan moral.
- source_word: יְחַלֵּל
  choice: menajiskan
  rationale: Dalam bahasa kekudusan imamat, kata ini berarti memperlakukan yang kudus sebagai tidak kudus; 'menajiskan' paling mudah dipahami pembaca umum, meski 'mencemarkan kekudusan' juga mungkin.
- source_word: מִקְדָּשַׁי
  choice: tempat-tempat kudus-Ku
  rationale: Mempertahankan bentuk jamak Ibrani dan mengungkapkan arti מִקְדָּשׁ secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: מְקַדְּשָׁם
  choice: yang menguduskan semuanya itu
  rationale: Mempertahankan verba kekudusan dan menghubungkan sufiks jamak dengan tempat-tempat kudus sebagai anteseden terdekat, sambil mencatat kemungkinan rujukan lain.
theological_decisions:
- issue: Makna מוּם dalam hukum kekudusan imam
  choice: cacat pada tubuhnya
  alternative: ada cacat padanya; ia mempunyai cela
  rationale: Konteks ayat 17–23 menunjukkan kondisi fisik yang membatasi pendekatan ritual, bukan dosa, kesalahan moral, atau pernyataan tentang nilai pribadi orang itu.
- issue: Rujukan sufiks dalam מְקַדְּשָׁם
  choice: '''semuanya itu'' merujuk pada tempat-tempat kudus-Ku'
  alternative: Sufiks itu dapat dipahami merujuk lebih luas kepada para imam atau umat
  rationale: Anteseden gramatikal terdekat ialah מִקְדָּשַׁי yang berbentuk jamak. Namun, karena sufiks maskulin jamak juga memungkinkan rujukan kepada kelompok orang dari konteks yang lebih luas, alternatif tersebut dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. 'Tabir', 'mazbah', 'kudus', dan 'menguduskan' dipertahankan sebagai kosakata kultis yang masih dikenal. Susunan dua kalimat dipakai agar hubungan akibat tidak terlalu berat, tanpa menghilangkan kaitan logis teks Ibrani.
