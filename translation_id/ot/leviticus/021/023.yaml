  source_fidelity: 'Draf ini pada umumnya mengikuti teks Ibrani dengan baik: larangan terkait tabir dan mazbah, kondisi fisik (מוּם), bentuk jamak “tempat-tempat kudus-Ku,” serta nama Yahweh dipertahankan. Namun, וְלֹא יְחַלֵּל menyatakan tujuan (“agar/supaya ia tidak mencemarkan atau melanggar kekudusan”), bukan akibat mandiri yang tepat diterjemahkan “Dengan demikian.”'
  naturalness: Bahasa draf umumnya modern dan formal. “Dengan demikian” di awal kalimat kedua mengubah dan melemahkan hubungan tujuan dalam kalimat Ibrani. Menghubungkannya dengan “agar” menghasilkan sintaks yang lebih alami dan setia. “Masuk sampai ke tabir” dapat dipertahankan sebagai ungkapan yang wajar untuk akses ke kawasan tabir tanpa menyiratkan masuk ke dalam tabir itu sendiri.
  terminology: “Tabir,” “mazbah,” “cacat pada tubuhnya,” “tempat-tempat kudus-Ku,” dan “Yahweh” sesuai register kultis Indonesia. “Mencemarkan” lebih baik daripada “menajiskan” untuk חלל dalam konteks ini, karena kata tersebut berkenaan dengan memperlakukan yang kudus sebagai tidak kudus, bukan terutama dengan penularan kenajisan ritual. “Semuanya itu” secara sengaja tidak memaksakan rujukan sufiks jamak yang diperdebatkan; catatan kaki menjelaskan pembacaan yang paling dekat secara gramatikal.
