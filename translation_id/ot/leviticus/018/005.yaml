base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: id
  text: Karena itu, kamu harus menaati ketetapan-ketetapan-Ku dan peraturan-peraturan-Ku. Jika seseorang melakukannya, ia akan hidup karenanya[a]. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia akan hidup di dalamnya.” Kata depan Ibrani dapat menunjukkan sarana atau perantaraan (“karenanya”) maupun ranah kehidupan (“di dalamnya”).
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Karena itu, kamu harus menaati
  rationale: Bentuk dengan waw meneruskan hubungan dengan larangan sebelumnya, sedangkan verba dalam konteks hukum berfungsi sebagai perintah. 'Menaati' menyampaikan makna menjaga dengan setia dan melaksanakan, bukan sekadar menyimpan.
- source_word: חֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: Istilah ini menunjuk pada ketentuan yang ditetapkan; pilihan ini mempertahankan nuansa hukum serta membedakannya dari מִשְׁפָּטַי.
- source_word: מִשְׁפָּטַי
  choice: peraturan-peraturan-Ku
  rationale: Dalam konteks ini istilah tersebut menunjuk pada aturan atau keputusan hukum. 'Peraturan' terdengar alami dalam bahasa Indonesia modern dan tetap berbeda dari 'ketetapan'.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם
  choice: Jika seseorang melakukannya
  rationale: Klausa relatif Ibrani memiliki daya kondisional dalam konteks ini. הָאָדָם merupakan bentuk tunggal representatif, sehingga 'seseorang' menyampaikan cakupan generiknya tanpa menyiratkan seorang laki-laki tertentu.
- source_word: וָחַי בָּהֶם
  choice: ia akan hidup olehnya
  rationale: '''Akan hidup'' mempertahankan akibat yang dijanjikan tanpa menentukan apakah hidup itu bersifat jasmani, perjanjian, atau kekal. ''Olehnya'' mempertahankan pembacaan instrumental dari preposisi ב, sementara alternatif lokatif dicatat dalam catatan kaki.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Cakupan makna 'hidup olehnya'
  choice: Mempertahankan ungkapan luas 'ia akan hidup olehnya'.
  alternative: '''Ia akan hidup di dalamnya'' atau penafsiran yang secara khusus menunjuk pada kehidupan di negeri, kesejahteraan sementara, maupun hidup kekal.'
  rationale: Teks Ibrani tidak menentukan secara eksplisit lingkup kehidupan yang dimaksud. Terjemahan tidak mempersempit ketegangan teologis tersebut.
- issue: Daya representatif הָאָדָם
  choice: seseorang
  alternative: orang itu; seorang laki-laki; manusia
  rationale: Dalam klausa ini bentuk tunggal tersebut bersifat generik dan representatif. 'Seseorang' merupakan padanan Indonesia yang alami dan tepat cakupan, tanpa mengubahnya menjadi kemanusiaan sebagai gagasan abstrak.
- issue: Makna preposisi ב dalam בָּהֶם
  choice: olehnya
  alternative: di dalamnya
  rationale: Preposisi dapat dipahami secara instrumental ('oleh/dengan perantaraan') atau sebagai ranah ('di dalam'). Teks utama memakai bentuk instrumental yang alami, sedangkan kemungkinan lainnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'kamu' bersifat jamak menurut konteks Ibrani, meskipun bahasa Indonesia tidak menandainya secara morfologis. Kapitalisasi akhiran '-Ku' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah.
