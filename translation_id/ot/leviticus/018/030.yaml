source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: id
  text: Jadi, peliharalah kewajiban-Ku dengan tidak melakukan satu pun dari kebiasaan-kebiasaan keji[a] yang telah dilakukan sebelum kamu, dan janganlah kamu menajiskan diri dengan semuanya itu. Akulah Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketetapan-ketetapan yang keji” atau “adat istiadat yang keji.” Istilah Ibrani ini dapat menunjuk pada praktik atau adat yang ditetapkan, bukan hanya ketetapan resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמַרְתִּי
  choice: kamu harus menjalankan kewajiban yang Kuberikan kepadamu
  rationale: Gabungan שׁמר dan מִשְׁמֶרֶת menyatakan kewajiban atau tanggung jawab dari Allah yang harus ditaati. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: dengan tidak melakukan
  rationale: Konstruksi ini menyatakan maksud atau pencegahan. Dalam kalimat Indonesia, 'dengan tidak melakukan' menghubungkan ketaatan tersebut secara alami dengan larangan yang mengikutinya.
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: satu pun kebiasaan menjijikkan
  rationale: מִן bersifat partitif dan ditampilkan dengan 'satu pun'. חֻקּוֹת di sini menunjuk pada kebiasaan atau praktik yang sudah menetap, sedangkan תּוֹעֵבֹת menyampaikan penilaian yang sangat negatif.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: yang dilakukan sebelum kamu
  rationale: Bentuk pasif Ibrani dipertahankan. 'Sebelum kamu' menjaga ungkapan sumber yang dalam konteks menunjuk pada praktik penduduk terdahulu.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: supaya kamu tidak menajiskan dirimu dengannya
  rationale: Bentuk verba bersifat refleksif; 'menajiskan dirimu' mempertahankan makna itu. Pronomina tunggal kolektif 'dengannya' merujuk pada keseluruhan jenis kebiasaan yang dilarang.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Akulah Yahweh, Allahmu
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'. Bentuk -כם adalah jamak dalam bahasa Ibrani, tetapi bahasa Indonesia lazim memakai 'kamu/Allahmu' tanpa membedakan tunggal dan jamak; konteksnya tetap menyapa umat secara kolektif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri perjanjian secara langsung; 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya moral dan kultis תּוֹעֵבֹת
  choice: menjijikkan
  alternative: keji
  rationale: '''Menjijikkan'' menyampaikan penolakan keras yang terkandung dalam תּוֹעֵבָה tanpa mempersempitnya hanya pada ranah moral atau ritual.'
- issue: Makna חֻקּוֹת dalam praktik bangsa-bangsa
  choice: kebiasaan
  alternative: ketetapan
  rationale: Dalam konteks ini, kata tersebut mengacu pada pola perilaku yang dipraktikkan oleh penduduk sebelumnya. 'Kebiasaan' lebih alami daripada seolah-olah menunjuk pada hukum resmi mereka, sambil tetap mempertahankan gagasan praktik yang mapan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Sapaan orang kedua memakai 'kamu' secara kolektif, dengan kapitalisasi pronomina yang merujuk kepada Allah dalam 'Kuberikan'. Struktur larangan dibuat jelas tanpa menambahkan pelaku yang tidak disebutkan secara eksplisit dalam teks Ibrani.
