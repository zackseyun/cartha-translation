    text: Atau, “ketetapan-ketetapan yang keji” atau “adat istiadat yang keji.” Istilah Ibrani ini dapat menunjuk pada praktik atau adat yang ditetapkan, bukan hanya ketetapan resmi.
    reason: lexical_alternative
