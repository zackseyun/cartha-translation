review_pass:
  verdict: revise
  source_fidelity: Draf secara umum menyampaikan perintah untuk menaati tanggung jawab ilahi, menghindari praktik terdahulu yang dinilai sangat negatif, dan tidak menajiskan diri. Namun, “yang Kuberikan kepadamu” menambahkan gagasan pemberian yang tidak dinyatakan dalam teks Ibrani, sedangkan “supaya” mengubah larangan koordinatif kedua menjadi tujuan dari larangan pertama.
  naturalness: Bahasa draf cukup alami, tetapi “memelihara kewajiban-Ku” lebih dekat dengan idiom perjanjian Ibrani daripada “menjalankan kewajiban yang Kuberikan kepadamu.” Penggunaan bentuk jamak “kebiasaan-kebiasaan” dan rujukan “semuanya itu” juga lebih jelas mengikuti anteseden jamak dalam sumber.
  terminology: Yahweh tepat untuk יְהוָה sesuai kebijakan yang diberikan. “Keji” menyampaikan daya evaluatif תּוֹעֵבָה secara kuat dan lazim dalam register Alkitab Indonesia. “Kebiasaan-kebiasaan” dapat dipakai untuk חֻקּוֹת dalam konteks ini, dengan catatan kaki yang mempertahankan kemungkinan “ketetapan” atau “adat istiadat.”
  issues:
  - severity: medium
    issue: Penambahan “yang Kuberikan kepadamu”
    rationale: מִשְׁמַרְתִּי berarti “tanggung jawab/kewajiban-Ku” atau “ketetapan yang harus Kupelihara,” tetapi ayat ini tidak menyatakan bahwa kewajiban itu “Kuberikan kepadamu.”
  - severity: medium
    issue: “Supaya kamu tidak menajiskan dirimu” mengubah hubungan klausa
    rationale: וְלֹא תִטַּמְּאוּ adalah larangan koordinatif (“dan janganlah ...”), bukan klausa tujuan yang bergantung pada tindakan sebelumnya.
  - severity: low
    issue: Tidak ada catatan kaki untuk alternatif leksikal חֻקּוֹת
    rationale: Jejak audit Inggris menandai ambiguitas antara ketetapan, praktik, dan adat. Catatan kaki singkat menjaga alternatif tersebut tanpa membebani teks utama.
  revised_text: Jadi, peliharalah kewajiban-Ku dengan tidak melakukan satu pun dari kebiasaan-kebiasaan keji[a] yang telah dilakukan sebelum kamu, dan janganlah kamu menajiskan diri dengan semuanya itu. Akulah Yahweh, Allahmu.
  revised_footnotes:
