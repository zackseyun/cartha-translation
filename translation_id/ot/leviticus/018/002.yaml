  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: id
  text: Berbicaralah kepada anak-anak Israel[a] dan katakanlah kepada mereka, “Akulah Yahweh[b], Allah kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Israel” atau “orang Israel.” Secara harfiah bahasa Ibrani berbunyi “anak-anak lelaki Israel,” sebuah ungkapan kekeluargaan dalam konteks perjanjian yang menunjuk kepada umat Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Bentuk imperatif ini memerintahkan Musa untuk menyampaikan firman secara lisan; pilihan ini juga mempertahankan pembedaan dengan kata kerja berikutnya, וְאָמַרְתָּ (‘dan katakanlah’).
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Ungkapan ini secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi secara korporatif menunjuk kepada umat Israel. ‘Anak-anak Israel’ mempertahankan gambaran kekeluargaan tanpa menyiratkan bahwa yang dimaksud hanya anak kecil.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: dan katakanlah kepada mereka
  rationale: Terjemahan langsung ini mempertahankan urutan perintah dan pengantar bagi perkataan langsung yang menyusul.
- source_word: אֲנִי
  choice: Akulah
  rationale: Pronomina mandiri memberi penegasan dalam rumus pengenalan diri; ‘Akulah’ mengungkapkan penegasan itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: אֱלֹהִים merujuk secara tunggal kepada Allah, sedangkan akhiran orang kedua jamak ditampilkan secara jelas dengan ‘kalian’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri YHWH. Bentuk ‘Yahweh’ mempertahankan nama ilahi, sementara catatan kaki mencantumkan tradisi penggantian dengan gelar ‘TUHAN’.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel
  rationale: Pilihan utama mempertahankan ungkapan kekeluargaan dalam bahasa Ibrani, sedangkan maknanya tetap korporatif bagi umat Israel dan tidak dibatasi hanya pada laki-laki atau anak kecil.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan ‘Berbicaralah ... dan katakanlah’ dipertahankan karena mencerminkan dua kata kerja berbeda dalam teks Ibrani. ‘Allah kalian’ menyatakan dengan jelas bahwa sapaan ditujukan kepada kelompok.
