  text: עֶרְוַ֥ת אֵֽשֶׁת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/008.yaml
  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat istri ayahmu[a]; itu adalah aurat ayahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “Janganlah engkau berhubungan seksual dengan istri ayahmu.” Secara harfiah, bahasa Ibrani berbunyi “menyingkapkan aurat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: aurat
  rationale: Dalam Imamat 18, kata ini menjadi bagian dari ungkapan hukum tetap 'menyingkapkan aurat', suatu ungkapan halus untuk hubungan seksual terlarang. 'Aurat' mempertahankan citra dan rumusan berulang bahasa Ibrani secara alami dalam bahasa Indonesia.
- source_word: אֵשֶׁת
  choice: istri
  rationale: 'Dalam konstruksi dengan ''ayahmu'', kata ini menunjuk pada hubungan perkawinan: ''istri ayahmu'', bukan sekadar seorang perempuan.'
- source_word: לֹא תְגַלֵּה
  choice: Janganlah engkau menyingkapkan
  rationale: Bentuk negatif dalam konteks hukum menyatakan larangan. 'Janganlah engkau' sesuai dengan ragam hukum yang bermartabat, sedangkan 'menyingkapkan' mempertahankan metafora sumber.
- source_word: אָבִיךָ
  choice: ayahmu
  rationale: Padanan langsung bagi bentuk nomina dengan akhiran milik orang kedua tunggal; pengulangannya dipertahankan demi kejelasan dan kesepadanan.
- source_word: הִוא
  choice: itu adalah
  rationale: Pronomina feminin ini secara gramatikal merujuk kembali kepada עֶרְוַת, 'aurat', bukan menyamakan perempuan itu dengan ayah. 'Itu adalah' menyampaikan hubungan tersebut dengan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ungkapan halus hukum ini perlu diterjemahkan secara eksplisit sebagai larangan hubungan seksual
  choice: Mempertahankan ungkapan 'menyingkapkan aurat' dalam teks utama
  alternative: Janganlah engkau berhubungan seksual dengan istri ayahmu
  rationale: Bahasa Ibrani memakai rumusan hukum perjanjian yang berulang di seluruh pasal. Mempertahankan ungkapan tersebut menjaga pola leksikal dan ragam halus teks tanpa menutup maknanya; penjelasan eksplisit diberikan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam hukum yang ringkas dan bermartabat. Bentuk 'engkau' mempertahankan sapaan orang kedua tunggal; 'janganlah' menyampaikan larangan dengan wajar. Istilah 'aurat' dipilih karena dikenal luas dan memungkinkan idiom Ibrani dipertahankan tanpa terdengar kasar.
