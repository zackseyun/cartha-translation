  source_fidelity: 'Teks Indonesia dengan setia mengikuti struktur dan pengulangan Ibrani: larangan לֹא תְגַלֶּה, objek “aurat istri saudaramu,” dan penegasan “itu adalah aurat saudaramu.” “Saudaramu” dalam konteks “istri saudaramu” cukup jelas menunjuk saudara laki-laki, tanpa perlu menambahkan unsur yang tidak tersurat secara idiomatis dalam bahasa Indonesia.'
  naturalness: “Janganlah engkau menyingkapkan aurat ...” merupakan ragam hukum yang wajar, bermartabat, dan konsisten dengan idiom Alkitab Indonesia. Istilah “aurat” mempertahankan sifat eufemistis ungkapan sumber, sedangkan catatan kaki membantu pembaca memahami cakupan seksual idiom tersebut.
  terminology: “Aurat,” “menyingkapkan,” dan pengulangannya dipertahankan secara konsisten untuk עֶרְוָה dan גלה ערוה. “Istri saudaramu” tepat untuk אֵשֶׁת אָחִיךָ. Jangkar catatan kaki ditempatkan tepat pada frasa yang dijelaskan, dan isi catatan kaki secara akurat memberi padanan eksplisit tanpa menggantikannya di teks utama.
