  yaml_path: translation/ot/leviticus/018/016.yaml
  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat istri saudaramu[a]; itu adalah aurat saudaramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih langsung, “Janganlah engkau berhubungan seksual dengan istri saudaramu.” Bahasa Ibrani memakai ungkapan “menyingkapkan aurat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: aurat
  rationale: Dalam konteks hukum Imamat 18, עֶרְוָה merupakan bagian dari ungkapan halus tetap untuk keterbukaan seksual atau hubungan seksual terlarang. Kata “aurat” mempertahankan ungkapan halus, nuansa tubuh yang tidak patut disingkapkan, dan pengulangan leksikal ayat ini.
- source_word: אֵשֶׁת אָחִיךָ
  choice: istri saudaramu
  rationale: Bentuk konstruksi ini secara khusus menunjuk kepada istri dari saudara laki-laki orang yang disapa. Bahasa Indonesia lazim memakai “saudara” tanpa harus menambahkan “laki-laki” karena “istri” sudah memperjelas acuannya.
- source_word: לֹא תְגַלֵּה
  choice: Janganlah engkau menyingkapkan
  rationale: Konstruksi larangan Ibrani diterjemahkan dengan bentuk larangan yang tegas dan bermartabat. “Menyingkapkan” mempertahankan gambaran konkret verba גלה serta cocok dengan ungkapan “menyingkapkan aurat”.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: itu adalah aurat saudaramu
  rationale: Terjemahan ini mempertahankan predikasi dan pengulangan kata עֶרְוָה, sehingga alasan hukum yang diberikan teks tidak dilebur menjadi parafrasa kepemilikan.
theological_decisions:
- issue: Apakah ungkapan hukum yang halus harus dijadikan larangan hubungan seksual secara eksplisit
  choice: Mempertahankan ungkapan “menyingkapkan aurat” dalam teks utama
  alternative: Janganlah engkau berhubungan seksual dengan istri saudaramu
  rationale: Teks Ibrani memakai idiom hukum yang halus dan sengaja mengulang “aurat”. Mempertahankannya menjaga bentuk, ketegangan, dan hubungan logis dalam ayat, sedangkan arti eksplisitnya dijelaskan dalam catatan kaki.
- issue: Identifikasi aurat istri saudara sebagai aurat saudara
  choice: 'Menerjemahkan secara langsung: “itu adalah aurat saudaramu”'
  alternative: aurat itu menjadi hak saudaramu
  rationale: Teks menyatakan identifikasi secara ringkas, bukan menjelaskan teori kepemilikan atau hubungan perkawinan. Terjemahan langsung menghindari penambahan tafsir teologis.
translation_notes:
  register: Bahasa hukum yang modern, tegas, dan bermartabat. Bentuk “Janganlah engkau” mempertahankan sapaan tunggal dan nada larangan, sedangkan “aurat” merupakan istilah Indonesia yang alami untuk idiom halus Ibrani.
