translation:
  language: id
  text: Janganlah engkau melakukan hubungan seksual[a] dengan istri sesamamu dan dengan demikian menajiskan dirimu dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “Janganlah engkau memberikan air manimu sebagai benih kepada istri sesamamu.”
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: istri sesamamu
  rationale: Dalam konteks hukum ini, עָמִית menunjuk kepada orang lain dalam komunitas. “Istri sesamamu” jelas, wajar, dan mempertahankan hubungan sosial yang dinyatakan teks.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: Janganlah engkau melakukan hubungan seksual
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan pemberian cairan kelamin sebagai benih, tetapi secara idiomatis merujuk kepada persetubuhan. Terjemahan utama menyampaikan maknanya dengan jelas, sedangkan gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: לְטָמְאָה בָהּ
  choice: sehingga engkau menajiskan dirimu dengan dia
  rationale: Infinitif ini menyatakan kenajisan yang dihasilkan atau dituju oleh tindakan tersebut. “Menajiskan dirimu” mempertahankan bahasa kenajisan tanpa mempersempitnya secara tidak perlu menjadi kenajisan ritual saja.
theological_decisions:
- issue: Sifat larangan dan bahasa kenajisan
  choice: Larangan melakukan hubungan seksual dengan istri sesama, yang mengakibatkan pelaku menajiskan dirinya dengan perempuan itu.
  alternative: Mempertahankan ungkapan harfiah tentang pemberian cairan kelamin dalam teks utama, atau menerjemahkan akibatnya secara khusus sebagai menjadi najis secara ritual.
  rationale: Ungkapan Ibrani jelas berfungsi sebagai idiom untuk persetubuhan, sedangkan frasa terakhir menyatakan kenajisan. Terjemahan ini menyampaikan makna idiom dengan alami dan tidak membatasi cakupan kenajisan melampaui yang dinyatakan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” sesuai dengan sapaan hukum tunggal dalam bahasa Ibrani; “melakukan hubungan seksual” dipilih agar idiom sumber dipahami secara langsung tanpa menjadi vulgar.
