base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: id
  text: Maka tanah itu menjadi najis[a]. Aku menghukum tanah itu karena kesalahannya[b], dan tanah itu memuntahkan penduduknya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dinajiskan.” Kata Ibrani dapat menggambarkan tanah itu sebagai menjadi najis atau sebagai dinajiskan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Aku mengunjungi kesalahannya atasnya,” suatu ungkapan Ibrani untuk menuntut pertanggungjawaban dan menjatuhkan hukuman.
    reason: lexical_alternative
  - marker: c
    text: Atau “memuntahkan ke luar.” Bahasa Ibrani mempertahankan gambaran keras tentang muntah untuk melukiskan pengusiran penduduk tanah itu akibat kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: menjadi najis
  rationale: Kata טמא menyatakan bahwa negeri itu berada dalam keadaan najis akibat perbuatan-perbuatan keji yang disebut dalam konteks. Pilihan ini mempertahankan bahasa kenajisan ritual dan moral tanpa menentukan secara berlebihan apakah bentuknya harus dipahami sebagai pasif.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks Imamat 18, אֶרֶץ menunjuk pada wilayah Kanaan, bukan seluruh bumi. 'Negeri itu' jelas dan alami dalam bahasa Indonesia.
- source_word: וָאֶפְקֹד
  choice: Aku menghukum
  rationale: Dalam konstruksi dengan עָוֹן, פקד mengandung arti meminta pertanggungjawaban melalui penghukuman. 'Menghukum' menyampaikan daya idiomatisnya secara langsung dan mempertahankan Allah sebagai pelaku.
- source_word: עֲוֺנָהּ עָלֶיהָ
  choice: negeri itu karena kesalahannya
  rationale: Ungkapan harfiahnya adalah 'memperhitungkan kesalahannya atasnya'. Susunan Indonesia ini menyampaikan bahwa negeri tersebut menanggung hukuman karena kesalahan yang terjadi di dalamnya, tanpa ungkapan kaku 'menghukum kesalahannya atasnya'.
- source_word: וַתָּקִא
  choice: memuntahkan
  rationale: Kata קיא memakai gambaran konkret tentang muntah. 'Memuntahkan' mempertahankan personifikasi negeri dan kedahsyatan pengusiran itu.
- source_word: יֹשְׁבֶיהָ
  choice: penduduknya
  rationale: Bentuk partisip dari ישב menunjuk secara kolektif kepada orang-orang yang tinggal di negeri itu. 'Penduduknya' ringkas, alami, dan tepat.
theological_decisions:
- issue: Personifikasi negeri sebagai sesuatu yang bereaksi terhadap kenajisan
  choice: Mempertahankan gambaran bahwa negeri itu 'memuntahkan' penduduknya.
  alternative: Negeri itu mengusir penduduknya.
  rationale: Teks Ibrani sengaja memakai metafora muntah untuk menghubungkan dosa, kenajisan, hukuman ilahi, dan pengusiran. Metafora ini tidak dilunakkan.
- issue: Hukuman ilahi dalam וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  choice: Aku menghukum negeri itu karena kesalahannya.
  alternative: Aku memperhitungkan kesalahannya atasnya.
  rationale: Pilihan utama menyampaikan makna idiomatis פקד dengan עָוֹן dalam bahasa Indonesia yang wajar, sambil tetap menyatakan tindakan Allah dan dasar moral penghukuman. Catatan kaki mempertahankan bentuk ungkapan Ibraninya.
- issue: Rujukan kesalahan milik negeri
  choice: Mempertahankan pronomina feminin tunggal sebagai 'kesalahannya', dengan negeri sebagai anteseden gramatikal.
  alternative: Kesalahan penduduk negeri itu.
  rationale: Teks mengaitkan kesalahan dengan negeri yang dipersonifikasikan. Terjemahan tidak diam-diam mengganti pemilik gramatikalnya dengan penduduk, meskipun konteks menunjukkan bahwa perbuatan manusialah yang menajiskan negeri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Negeri' dipilih alih-alih 'bumi' karena konteksnya adalah tanah Kanaan. Metafora 'memuntahkan' dipertahankan secara konkret, sedangkan idiom penghukuman diterjemahkan secara alami dan bentuk harfiahnya dijelaskan dalam catatan kaki.
