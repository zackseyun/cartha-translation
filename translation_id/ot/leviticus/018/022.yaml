  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: id
  text: Janganlah engkau tidur dengan seorang laki-laki seperti dengan perempuan[a]; hal itu adalah kekejian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “pembaringan-pembaringan seorang perempuan,” suatu ungkapan yang mengacu pada persetubuhan dengan perempuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: seorang laki-laki
  rationale: Kata ini menunjuk pada manusia berjenis kelamin laki-laki. Dalam bahasa Indonesia, “seorang laki-laki” merupakan padanan langsung dan alami tanpa menambahkan pembatas yang tidak ada dalam teks.
- source_word: תִשְׁכַּב
  choice: tidur dengan
  rationale: Bentuk dari שׁכב ini dipakai sebagai ungkapan halus seksual. “Tidur dengan” mempertahankan kiasan Ibrani dan tetap mudah dipahami dalam konteks larangan ini.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: seperti dengan perempuan
  rationale: Frasa jamak konstruktif ini secara idiomatis mengacu pada persetubuhan dengan perempuan. Terjemahan ini menyampaikan perbandingan dalam teks secara alami; bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: תּוֹעֵבָה
  choice: kekejian
  rationale: Istilah ini menyatakan sesuatu yang sangat menjijikkan atau tercela dalam konteks hukum kekudusan. “Kekejian” mempertahankan bobot penilaian yang kuat dalam bahasa sumber.
- source_word: הִוא
  choice: hal itu adalah
  rationale: Pronomina feminin tersebut merujuk kembali kepada tindakan yang dilarang dan menghubungkannya dengan predikat תּוֹעֵבָה. “Hal itu adalah” menyatakan rujukan tersebut secara jelas dan alami.
theological_decisions:
- issue: Cakupan larangan dalam konteks hukum kekudusan
  choice: Menerjemahkan ayat sebagai larangan langsung terhadap hubungan seksual seorang laki-laki dengan laki-laki tanpa mempersempitnya menjadi praktik kultis atau eksploitatif tertentu.
  alternative: Menafsirkan larangan secara lebih sempit sebagai hanya mengenai praktik kultis atau eksploitatif.
  rationale: Teks Ibrani melarang tidur dengan laki-laki menurut “pembaringan perempuan” dan menyebut tindakan itu kekejian. Tidak ada keterangan pembatas dalam ayat ini yang mengkhususkannya pada keadaan kultis atau eksploitatif tertentu; terjemahan juga tidak memperluasnya melampaui perkataan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “engkau” mempertahankan bentuk orang kedua tunggal dalam bahasa Ibrani. Ungkapan “tidur dengan” menjaga kiasan seksual sumber sambil tetap dapat dipahami pembaca umum.
