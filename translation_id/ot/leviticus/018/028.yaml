  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: id
  text: supaya tanah itu tidak memuntahkan kamu[a] ketika kamu menajiskannya, sebagaimana tanah itu telah memuntahkan bangsa yang ada sebelum kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memuntahkan kamu keluar.” Bahasa Ibrani memakai gambaran kuat tentang tanah yang mengusir penduduknya karena kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: memuntahkan ... / telah memuntahkan
  rationale: Kata Ibrani ini memakai gambaran muntah yang kuat untuk pengusiran penduduk. “Memuntahkan” mempertahankan personifikasi dan daya metaforanya secara alami dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: tanah itu
  rationale: Konteksnya menunjuk pada tanah Kanaan, bukan seluruh bumi. “Tanah itu” juga mempertahankan gambaran tanah sebagai pihak yang bereaksi terhadap kenajisan.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: ketika kamu menajiskannya
  rationale: Ungkapan ini secara alami menyampaikan hubungan waktu dalam peringatan tersebut, sementara verba “menajiskan” mempertahankan gagasan bahwa tindakan mereka membuat tanah itu najis. Preposisi Ibraninya juga dapat bernuansa sebab atau sarana.
- source_word: הַגּוֹי
  choice: bangsa
  rationale: Nomina tunggal kolektif ini menunjuk pada kelompok penduduk terdahulu. “Bangsa” mempertahankan bentuk kolektif tunggal tanpa memasukkan nuansa teologis yang tidak dinyatakan.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: yang ada sebelum kamu
  rationale: Frasa ini menyatakan bahwa bangsa tersebut lebih dahulu tinggal di tanah itu. “Yang ada sebelum kamu” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְלֹא
  choice: agar ... tidak
  rationale: Dalam konteks peringatan sebelumnya, bentuk yang secara harfiah berarti “dan tidak” berfungsi sebagai tujuan atau hasil negatif. “Agar ... tidak” menyampaikan hubungan wacananya dengan alami.
theological_decisions:
- issue: Personifikasi tanah sebagai pelaku penghakiman
  choice: Mempertahankan tanah sebagai subjek yang “memuntahkan” penduduknya.
  alternative: Mengabstraksikannya sebagai Allah yang mengusir penduduk melalui tanah.
  rationale: Teks Ibrani secara eksplisit menggambarkan tanah seolah-olah bereaksi terhadap kenajisan. Mempertahankan gambaran ini menjaga corak teologis Imamat tanpa menyangkal kedaulatan Allah.
- issue: Hubungan בְּ pada frasa tentang penajisan
  choice: 'Menerjemahkannya secara temporal: “ketika kamu menajiskannya.”'
  alternative: 'Menerjemahkannya secara kausal atau instrumental: “karena kamu menajiskannya” atau “dengan menajiskannya.”'
  rationale: Bentuk Ibrani memungkinkan nuansa waktu maupun sebab/sarana. Pilihan temporal paling alami dalam kalimat Indonesia dan tidak meniadakan hubungan sebab yang sudah tersirat oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora “memuntahkan” sengaja dipertahankan karena merupakan unsur utama gambaran Ibrani; “tanah itu” dipakai alih-alih “bumi” agar rujukan setempatnya jelas.
