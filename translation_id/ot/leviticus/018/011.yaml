  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat anak perempuan istri ayahmu[a] yang diperanakkan oleh ayahmu; ia adalah saudara perempuanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara perempuan seayahmu.” Secara harfiah bahasa Ibrani berbunyi, “ia adalah saudara perempuanmu,” sedangkan uraian sebelumnya menjelaskan hubungan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: aurat ... / auratnya
  rationale: Dalam Imamat 18, עֶרְוָה merupakan bagian dari ungkapan hukum yang tetap, yaitu 'menyingkapkan aurat'. Pilihan ini alami dalam bahasa Indonesia, tetap santun, dan mempertahankan makna seksual serta konsistensi antarayat.
- source_word: בַּת
  choice: anak perempuan
  rationale: Istilah kekerabatan ini diterjemahkan secara langsung dan wajar.
- source_word: אֵשֶׁת אָבִיךָ
  choice: istri ayahmu
  rationale: Mempertahankan ungkapan relasional Ibrani secara langsung. 'Ibu tirimu' akan menambahkan kesimpulan yang tidak dinyatakan secara eksplisit oleh teks.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: yang diperanakkan oleh ayahmu
  rationale: Ungkapan ini menandai keturunan biologis dari pihak ayah. Bentuk ini agak formal, tetapi tepat untuk ragam hukum dan mempertahankan penekanan sumber pada hubungan biologis dengan ayah.
- source_word: אֲחוֹתְךָ הִוא
  choice: dia adalah saudara perempuanmu
  rationale: Teks Ibrani menyebut hubungan itu sebagai 'saudara perempuan' tanpa menambahkan unsur 'tiri' atau 'seayah'; rincian sebelumnya menjelaskan hubungan yang dimaksud.
- source_word: לֹא תְגַלֶּה
  choice: Janganlah kausingkapkan
  rationale: Menyampaikan larangan hukum secara tegas dan mempertahankan verba 'menyingkapkan' yang menjadi bagian dari rumusan tetap pasal ini.
theological_decisions:
- issue: Apakah hubungan itu perlu disebut secara eksplisit sebagai saudara perempuan seayah dalam teks utama
  choice: 'Mempertahankan rumusan sumber: ''dia adalah saudara perempuanmu''.'
  alternative: dia adalah saudara perempuan seayahmu
  rationale: Keterangan sebelumnya sudah menetapkan bahwa perempuan itu diperanakkan oleh ayah yang sama. Menambahkan 'seayah' dalam teks utama memang memperjelas, tetapi mempersempit ungkapan Ibrani yang secara eksplisit hanya mengatakan 'saudara perempuanmu'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan nuansa larangan hukum. Bentuk terikat 'kausingkapkan' dipakai agar rumusan ringkas dan selaras dengan gaya perundangan Alkitab; istilah 'aurat' mempertahankan ungkapan idiomatis pasal ini tanpa menjadi terlalu gamblang.
