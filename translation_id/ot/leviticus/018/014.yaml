  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat saudara laki-laki ayahmu; janganlah engkau menghampiri istrinya[a]. Dia adalah bibimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menghampiri”; dalam konteks ini kata tersebut bermakna seksual dalam rumusan hukum tentang hubungan inses.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: aurat
  rationale: Dalam rumusan tetap Imamat 18, kata ini menunjuk pada ketelanjangan dalam idiom hubungan seksual terlarang. “Aurat” mempertahankan ungkapan konkret dan nada hukum tanpa menguraikannya menjadi parafrasa.
- source_word: אֲחִי אָבִיךָ
  choice: saudara laki-laki ayahmu
  rationale: Terjemahan ini mempertahankan rincian hubungan keluarga dalam konstruksi Ibrani dan lebih transparan daripada hanya memakai “pamanmu”.
- source_word: לֹא תְגַלֵּה
  choice: janganlah engkau menyingkapkan
  rationale: Bentuk larangan dan verba “menyingkapkan” mempertahankan rumusan hukum idiomatis yang berulang dalam pasal ini.
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: janganlah engkau menghampiri istrinya
  rationale: “Menghampiri” mempertahankan bahasa halus sumber; dalam konteks hukum inses, verba ini bermuatan seksual, yang dijelaskan dalam catatan kaki.
- source_word: דֹּדָתְךָ
  choice: bibimu
  rationale: Kata Ibrani memakai istilah kekerabatan biasa untuk bibi; klausa sebelumnya telah menjelaskan bahwa yang dimaksud ialah istri saudara laki-laki ayah.
- source_word: הִוא
  choice: Dia adalah
  rationale: Pronomina ini berfungsi secara predikatif. Terjemahan langsung tidak menambahkan hubungan sebab seperti “sebab” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan idiom hukum inses
  choice: Mempertahankan “menyingkapkan aurat” dalam teks utama.
  alternative: Memparafrasakannya sebagai “melakukan hubungan seksual dengan”.
  rationale: Rumusan konkret mempertahankan konsistensi antar-ayat dan keterlihatan idiom Ibrani, sementara konteks menunjukkan sifat seksual larangan itu.
- issue: Identifikasi hubungan kekerabatan
  choice: “Dia adalah bibimu.”
  alternative: “Dia adalah istri saudara laki-laki ayahmu.”
  rationale: Sumber memakai istilah ringkas “bibi” pada klausa terakhir, sedangkan hubungan spesifiknya sudah diterangkan sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang khidmat. Bentuk “janganlah engkau” dipakai untuk mempertahankan gaya larangan langsung; “aurat” dan “menghampiri” menjaga ungkapan halus sumber tanpa mengaburkan konteks seksualnya.
