translation:
  language: id
  text: Janganlah engkau mendekati seorang perempuan selama masa kenajisan haidnya untuk menyingkapkan ketelanjangannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “selama masa ketidakmurnian haidnya.” Bahasa Ibrani memakai istilah yang berkaitan dengan kenajisan ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה
  choice: mendekati seorang perempuan
  rationale: Preposisi אֶל bersama verba קָרַב membentuk ungkapan ‘mendekati’. אִשָּׁה di sini bersifat umum dan tidak ditandai sebagai milik seseorang, sehingga diterjemahkan ‘seorang perempuan’, bukan ‘istri’.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: pada waktu ia najis karena haidnya
  rationale: Frasa ini menunjuk pada keadaan kenajisan ritual yang berkaitan dengan menstruasi. Rumusan ini alami dalam bahasa Indonesia dan tetap mempertahankan kategori kenajisan dalam Imamat.
- source_word: לֹא תִקְרַב
  choice: Janganlah engkau mendekati
  rationale: Bentuk larangan hukum dengan לֹא dan verba imperfek diterjemahkan sebagai larangan langsung yang tegas. ‘Mendekati’ mempertahankan ungkapan halus dalam konteks seksual.
- source_word: לְ/גַלּוֹת
  choice: untuk menyingkapkan
  rationale: גלה secara harfiah berarti menyingkapkan atau membuka. Pilihan ini mempertahankan ungkapan hukum yang halus dalam pasal ini.
- source_word: עֶרְוָתָהּ
  choice: auratnya
  rationale: עֶרְוָה menunjuk pada ketelanjangan atau bagian tubuh yang bersifat pribadi. ‘Auratnya’ merupakan padanan Indonesia yang ringkas, bermartabat, dan mempertahankan fungsi eufemistis ungkapan Ibrani.
theological_decisions:
- issue: Apakah istilah טֻמְאָה harus dipahami sebagai kenajisan ritual atau semata-mata keadaan biologis atau medis
  choice: kenajisan ritual yang berkaitan dengan haid
  alternative: masa haid; ketidakmurnian menstruasi
  rationale: Dalam Imamat, טֻמְאָה merupakan istilah dalam kerangka tahir dan najis secara ritual. Terjemahan tidak mengubahnya menjadi penilaian medis maupun moral.
translation_notes:
  register: Bahasa hukum yang tegas namun tetap alami dan bermartabat. Kata ‘engkau’ mempertahankan sapaan tunggal dalam teks Ibrani. Ungkapan ‘menyingkapkan auratnya’ mempertahankan eufemisme seksual teks sumber tanpa membuatnya lebih eksplisit.
