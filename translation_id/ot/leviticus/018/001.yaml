  yaml_path: translation/ot/leviticus/018/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif dari דבר menyatakan tindakan berbicara. Dalam bahasa Indonesia Alkitabiah yang tetap modern, “berfirman” secara wajar dipakai ketika Allah menjadi subjek dan tidak mengubah isi semantis dasarnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju dalam ujaran, dan מֹשֶׁה secara baku ditransliterasikan “Musa” dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif לֵאמֹר memperkenalkan isi ujaran yang menyusul. “Demikian:” merupakan rumusan Indonesia yang alami dan dignified untuk fungsi pengantar ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Konjungsi pembuka וַ tidak diterjemahkan secara mekanis dengan “Dan” karena ayat ini membuka satu unit ujaran baru dalam pembagian modern; kesinambungan naratif tetap tersirat. Tanda titik dua menandai bahwa isi firman dimulai pada ayat berikutnya.
