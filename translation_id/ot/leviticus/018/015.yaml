  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat menantumu[a]; dia adalah istri anakmu. Janganlah engkau menyingkapkan auratnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyingkapkan aurat”; ungkapan hukum yang berulang dalam Imamat untuk hubungan seksual yang dilarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: aurat
  rationale: Dalam rumusan hukum Imamat 18, עֶרְוָה merupakan bagian dari ungkapan tetap tentang hubungan seksual terlarang. Kata “aurat” mempertahankan ungkapan halus, nuansa ketelanjangan, dan konsistensi antarayat dalam bahasa Indonesia yang wajar.
- source_word: כַּלָּתְךָ
  choice: menantumu
  rationale: Dalam konteks ini kata tersebut menunjuk langsung kepada istri anak laki-laki orang yang disapa. “Menantumu” adalah istilah kekerabatan Indonesia yang alami; klausa berikutnya memperjelas hubungan yang dimaksud.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: janganlah engkau menyingkapkan
  rationale: Bentuk Piel גלה bersama עֶרְוָה membentuk rumusan larangan yang berulang dalam pasal ini. “Menyingkapkan” mempertahankan citra dan gaya hukum sumber tanpa menggantinya dengan parafrasa seksual yang lebih eksplisit.
- source_word: אֵשֶׁת בִּנְךָ
  choice: istri anakmu
  rationale: Ungkapan ini menjelaskan identitas menantu yang dimaksud dengan lugas dan alami.
- source_word: הִוא
  choice: dia adalah
  rationale: Pronomina ini mengidentifikasi kembali perempuan yang baru disebut dan mendukung fungsi penjelas klausa tersebut.
- source_word: עֶרְוָתָהּ
  choice: auratnya
  rationale: Pengulangan “auratnya” mempertahankan repetisi dan gaya rumusan hukum dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan ungkapan “menyingkapkan aurat” dalam konteks larangan seksual
  choice: Mempertahankan ungkapan “menyingkapkan aurat”
  alternative: berhubungan seksual dengan
  rationale: Teks Ibrani memakai ungkapan hukum yang tetap dan bersifat eufemistis di seluruh Imamat 18. Mempertahankannya menjaga hubungan antarayat serta tidak menghilangkan citra bahasa sumber, sedangkan catatan kaki menjelaskan makna hukumnya.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan bercorak hukum. Bentuk “janganlah engkau” dipakai untuk menyampaikan larangan langsung tunggal dan mempertahankan kekhidmatan tanpa menjadi arkais. Tanda titik koma mempertahankan kaitan erat antara larangan dan penjelasan kekerabatan.
