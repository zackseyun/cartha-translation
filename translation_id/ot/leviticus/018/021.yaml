  verdict: revise
  source_fidelity: 'Draf mempertahankan unsur-unsur utama: larangan memberi/menyerahkan keturunan, kaitannya dengan Molok, larangan mencemarkan nama Allah, dan penutup ilahi. Namun, “suatu ritus” tidak terdapat dalam teks Ibrani dan konstruksi “dibuat melewati suatu ritus” mengubah objek tindakan: teks menyatakan keturunan itu dibuat/dilewatkan bagi atau kepada Molok, bukan dibuat melewati sebuah ritus.'
  naturalness: “Jangan serahkan seorang pun dari keturunanmu” dapat dipahami, tetapi “Janganlah engkau menyerahkan seorang pun dari keturunanmu” lebih baku dan serasi dengan register hukum. “Untuk dilewatkan kepada Molok” merupakan bentuk yang ringkas, dapat dipahami, dan lebih dekat dengan bentuk kausatif Ibrani tanpa menambahkan rincian ritual.
  terminology: “Molok,” “mencemarkan nama Allahmu,” dan “Yahweh” dapat dipertahankan. Catatan kaki sebaiknya terlebih dahulu menjelaskan idiom harfiah, lalu menyatakan secara terbatas bahwa banyak penafsir menghubungkannya dengan pengurbanan anak; api tidak disebut dalam ayat ini.
  issues:
