base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: id
  text: Janganlah engkau menyerahkan seorang pun dari keturunanmu untuk dilewatkan kepada Molok,[a] dan jangan mencemarkan nama Allahmu. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk dilewatkan kepada Molok.” Ini merujuk pada suatu tindakan yang berkaitan dengan Molok. Banyak penafsir memahaminya sebagai pengurbanan anak, yang di bagian lain sering digambarkan sebagai membuat anak-anak “melewati api”; ayat ini sendiri tidak menyebut api.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: seorang pun dari keturunanmu
  rationale: זֶרַע secara harfiah berarti 'benih', tetapi di sini menunjuk kepada keturunan. Ungkapan 'seorang pun dari keturunanmu' mempertahankan nuansa partitif מִן dan terdengar alami dalam larangan bahasa Indonesia.
- source_word: תִתֵּן
  choice: serahkan
  rationale: נתן pada dasarnya berarti 'memberikan'. Dalam konteks penyerahan kepada Molok, 'serahkan' menyampaikan tindakan tersebut secara alami tanpa secara eksplisit menambahkan gagasan pengurbanan.
- source_word: לְהַעֲבִיר
  choice: untuk dibuat melewati suatu ritus
  rationale: Bentuk Hifil dari עבר berarti 'membuat/me­nyebabkan lewat'. Tambahan 'suatu ritus' menjelaskan bahwa ini tindakan ritual tanpa menentukan secara pasti hakikat ritus tersebut; kemungkinan pengurbanan dengan api dicatat dalam catatan kaki.
- source_word: לַמֹּלֶךְ
  choice: bagi Molok
  rationale: Bentuk ini dipahami secara tradisional sebagai nama diri Molok. Preposisi לְ dapat menyatakan arah atau peruntukan; 'bagi Molok' sesuai dengan konteks ritus.
- source_word: תְחַלֵּל
  choice: mencemarkan
  rationale: חלל dalam bentuk Piel berarti 'menajiskan, mencemarkan, menodai kesucian'. 'Mencemarkan' alami dengan objek 'nama Allahmu' dan mempertahankan bobot religiusnya.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: nama Allahmu
  rationale: Terjemahan ini dekat dengan susunan Ibrani dan mempertahankan bobot teologis 'nama' sebagai kehormatan dan reputasi Allah yang dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Hakikat larangan yang berkaitan dengan Molok
  choice: Mempertahankan tindakan 'dibuat melewati' dan menyebutnya sebagai suatu ritus tanpa menyatakan 'dipersembahkan sebagai kurban dengan api' dalam teks utama.
  alternative: 'Jangan kurbankan seorang pun dari anak-anakmu kepada Molok; atau: jangan buat keturunanmu melewati api bagi Molok.'
  rationale: Ayat Ibrani ini menyatakan 'memberikan ... untuk membuat lewat bagi Molok', tetapi tidak menyebut api secara eksplisit. Konteks Alkitab yang lebih luas sering mengaitkannya dengan pengurbanan anak dan api. Teks utama tidak menyelesaikan ambiguitas itu, sedangkan catatan kaki menerangkan kemungkinan maknanya.
- issue: Cakupan זרע
  choice: keturunan
  alternative: anak-anak; benih
  rationale: '''Keturunan'' menjaga cakupan istilah Ibrani yang lebih luas daripada kelompok usia tertentu dan lebih alami daripada terjemahan harfiah ''benih''.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk larangan langsung dipakai agar jelas bagi pembaca umum. Istilah 'ritus' dipilih untuk menjaga ungkapan ritual Ibrani dan menghindari penetapan tafsir yang lebih khusus daripada bunyi ayat.
