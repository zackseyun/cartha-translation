  - severity: medium
    issue: Konstruksi “untuk dibuat melewati suatu ritus” kurang setia pada arah frasa Ibrani
    rationale: Hifil עבר berarti menyebabkan seseorang lewat/berpindah; dalam konteks ini frasa itu terarah kepada Molok. “Untuk dilewatkan kepada Molok” mempertahankan ketakterincian tindakan sambil menghindari penambahan api atau pengurbanan ke dalam teks utama.
