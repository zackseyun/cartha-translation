  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: id
  text: Namun, kamu sendiri harus menaati ketetapan-Ku dan hukum-Ku. Baik orang asli maupun orang asing yang tinggal di tengah-tengah kamu tidak boleh melakukan satu pun dari perbuatan-perbuatan menjijikkan ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing yang menetap di tengah-tengah kamu.”
    reason: Alternatif ini menegaskan bahwa גֵּר adalah orang nonasli yang tinggal dalam komunitas, bukan sekadar pengunjung.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: harus menaati
  rationale: Dalam konteks hukum perjanjian, שׁמר berarti menjaga dengan cara mematuhi atau menaati. Bentuk ini menyampaikan daya perintah secara alami dalam bahasa Indonesia modern.
- source_word: אַתֶּם
  choice: kamu sendiri
  rationale: Pronomina mandiri ini memberi penekanan yang melampaui penanda orang pada verba; 'kamu sendiri' mempertahankan penekanan tersebut.
- source_word: חֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: חֻקִּים menunjuk pada ketentuan yang telah ditetapkan; 'ketetapan' mempertahankan nuansa hukum dengan bahasa yang jelas.
- source_word: מִשְׁפָּטַי
  choice: hukum-hukum-Ku
  rationale: מִשְׁפָּטִים dapat menunjuk pada keputusan atau aturan hukum. 'Hukum-hukum-Ku' terdengar alami dan tetap membedakannya secara memadai dari 'ketetapan-ketetapan-Ku'.
- source_word: תַעֲשׂוּ
  choice: lakukan
  rationale: עשה adalah verba umum 'melakukan'. Pilihan ini tidak menambahkan gagasan kebiasaan atau pengulangan yang tidak dinyatakan secara eksplisit.
- source_word: מִכֹּל
  choice: satu pun dari segala
  rationale: Dalam konstruksi negatif, מן + כל menyatakan larangan yang menyeluruh. Ungkapan ini mempertahankan baik unsur 'satu pun' maupun cakupan keseluruhan.
- source_word: הַתּוֹעֵבֹת
  choice: perbuatan menjijikkan
  rationale: תּוֹעֵבָה menyatakan sesuatu yang sangat tercela atau menjijikkan dalam penilaian moral dan kultis. Karena konteksnya adalah tindakan-tindakan terlarang, 'perbuatan menjijikkan' jelas dan kuat.
- source_word: הָאֶזְרָח
  choice: warga asli
  rationale: אֶזְרָח menunjuk pada anggota asli komunitas atau negeri, berlawanan dengan גֵּר. 'Warga asli' ringkas dan dapat dipahami dalam konteks hukum komunitas.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: pendatang yang tinggal di tengah-tengah kamu
  rationale: גֵּר adalah orang nonasli yang tinggal dalam komunitas dan berada di bawah kewajiban serta perlindungannya. 'Pendatang yang tinggal' mempertahankan pengulangan leksikal antara nomina dan partisip Ibrani secara alami.
theological_decisions:
- issue: Cakupan larangan bagi warga asli dan pendatang
  choice: Larangan itu berlaku bagi warga asli maupun pendatang yang tinggal dalam komunitas Israel.
  alternative: Frasa terakhir dapat dipahami hanya sebagai penyebutan secara aposisional atas kelompok-kelompok yang terikat oleh perintah, tanpa penekanan khusus pada kesetaraan.
  rationale: Sintaks Ibrani menyebut הָאֶזְרָח dan הַגֵּר sebagai dua kelompok yang sama-sama tercakup dalam larangan. Terjemahan 'baik ... maupun ...' membuat cakupan ganda itu jelas tanpa menambahkan klaim teologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan nuansa hukum. Sapaan jamak Ibrani diterjemahkan dengan 'kamu' sesuai kelaziman bahasa Indonesia; kapitalisasi enklitik ilahi dipakai pada bentuk '-Ku'. Penanda catatan kaki ditempatkan pada frasa tentang pendatang yang diterangkannya.
