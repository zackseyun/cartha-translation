review_pass:
  verdict: revise
  source_fidelity: Draf mempertahankan penekanan pada subjek jamak, pasangan istilah hukum, larangan menyeluruh, serta cakupan bagi orang asli dan ger. Namun, susunan Indonesia saat ini membuat frasa “baik warga asli maupun pendatang” menggantung setelah imperatif dan kurang jelas sebagai kedua subjek yang tercakup dalam larangan.
  naturalness: Bahasa umumnya modern dan bernada hukum, tetapi “Jangan lakukan ..., baik warga asli maupun pendatang ...” tidak idiomatis karena kelompok-kelompok itu tidak dapat secara alami melekat pada objek larangan. “Warga asli” juga bernuansa kewarganegaraan modern, sedangkan “pendatang” dapat menyiratkan kedatangan sementara.
  terminology: “Ketetapan-Ku” dan “hukum-Ku” merupakan pasangan yang baik untuk חֻקֹּתַי dan מִשְׁפָּטַי. “Orang asli” dan “orang asing yang tinggal di tengah-tengah kamu” menyatakan kontras אֶזְרָח/גֵּר serta sifat menetap dari participle הַגָּר dengan lebih tepat dan alami.
  issues:
  - severity: medium
    issue: Cakupan subjek larangan tidak tersusun jelas dalam bahasa Indonesia.
    rationale: Dalam teks Ibrani, “orang asli” dan “ger yang tinggal di tengah-tengahmu” adalah dua kelompok yang sama-sama terikat pada larangan. Draf menaruh “baik ... maupun ...” setelah “Jangan lakukan ...” sehingga frasa itu menggantung dan dapat terdengar seperti keterangan yang tidak berfungsi sintaktis.
  - severity: low
    issue: “Warga asli” dan “pendatang” kurang tepat untuk kontras sosial-hukum sumber.
    rationale: אֶזְרָח bukan terutama istilah kewarganegaraan modern, dan גֵּר bukan semata-mata pendatang. Istilah “orang asli” berhadapan dengan “orang asing yang tinggal” lebih baik menyampaikan asal-usul setempat dan status penduduk asing.
  revised_text: Namun, kamu sendiri harus menaati ketetapan-Ku dan hukum-Ku. Baik orang asli maupun orang asing yang tinggal di tengah-tengah kamu tidak boleh melakukan satu pun dari perbuatan-perbuatan menjijikkan ini.[a]
  revised_footnotes:
