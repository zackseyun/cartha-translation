  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat cucu perempuanmu, baik yang melalui anak laki-lakimu maupun yang melalui anak perempuanmu.[a] Sebab mereka adalah auratmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “Janganlah engkau berhubungan seksual dengan cucu perempuanmu, baik yang melalui anak laki-lakimu maupun yang melalui anak perempuanmu.” Ungkapan Ibraninya secara harfiah berbunyi “menyingkapkan aurat”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bagian penutup berbunyi “sebab mereka adalah auratmu”. Ungkapan ini menyatakan alasan berdasarkan kedekatan kekerabatan; teksnya tidak mengatakan “aurat mereka adalah auratmu”.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: aurat / auratmu
  rationale: Kata “aurat” mempertahankan ungkapan hukum Ibrani tentang ketelanjangan dan bagian tubuh yang bersifat intim. Dalam rumus גלה ערוה, ungkapan ini berfungsi sebagai eufemisme bagi hubungan seksual terlarang; terjemahan yang tetap idiomatis mempertahankan pola berulang dalam Imamat 18.
- source_word: בַּת בִּנְךָ
  choice: anak perempuan dari anak laki-lakimu
  rationale: Terjemahan ini mempertahankan jalur kekerabatan melalui anak laki-laki secara eksplisit dan mengikuti susunan sumber dengan cukup dekat.
- source_word: בַת בִּתְּךָ
  choice: anak perempuan dari anak perempuanmu
  rationale: Terjemahan ini mempertahankan jalur kekerabatan melalui anak perempuan dan kesejajarannya dengan frasa sebelumnya.
- source_word: לֹא תְגַלֶּה
  choice: Janganlah kausingkapkan
  rationale: Bentuk larangan ini wajar dalam bahasa Indonesia bermartabat dan mempertahankan metafora hukum harfiah “menyingkapkan aurat”, alih-alih langsung menggantinya dengan tafsiran mengenai hubungan seksual.
- source_word: כִּי
  choice: Sebab
  rationale: “Sebab” menyampaikan hubungan kausal dengan jelas serta sesuai dengan ragam hukum yang bermartabat.
- source_word: הֵנָּה
  choice: mereka adalah
  rationale: Pronomina feminin jamak merujuk kepada kedua keturunan perempuan tersebut. Terjemahan predikatif ini mempertahankan bentuk Ibrani yang tidak mengatakan “aurat mereka”, melainkan “mereka adalah auratmu”.
theological_decisions:
- issue: Makna alasan penutup כִּי עֶרְוָתְךָ הֵנָּה
  choice: Sebab, mereka adalah auratmu sendiri.
  alternative: Sebab, aurat mereka adalah auratmu sendiri.
  rationale: Teks Ibrani secara harfiah mempredikasikan “auratmu” tentang kedua keturunan perempuan itu. Bentuk yang tidak biasa ini dipertahankan agar logika identitas atau keterikatan keluarga dalam larangan tersebut tidak diam-diam diubah menjadi pernyataan yang lebih analitis. Kata “sendiri” menegaskan pronomina kepunyaan tanpa menentukan lebih jauh bagaimana metafora itu harus dipahami.
translation_notes:
  register: Bahasa Indonesia modern dengan ragam hukum yang bermartabat. Bentuk “janganlah kausingkapkan” mempertahankan formula larangan dan ungkapan berulang dalam pasal ini. Susunan kekerabatan dibuat eksplisit untuk membedakan cucu perempuan melalui anak laki-laki dan melalui anak perempuan; kejanggalan teologis yang disengaja dalam klausa terakhir dipertahankan dan dijelaskan melalui catatan kaki.
