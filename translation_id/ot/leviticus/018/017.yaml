source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat seorang perempuan dan aurat anak perempuannya.[a] Janganlah engkau mengambil cucu perempuan dari anak laki-lakinya atau cucu perempuan dari anak perempuannya untuk menyingkapkan auratnya; mereka adalah kerabat sedarahnya. Itu perbuatan keji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “menyingkapkan aurat” adalah ungkapan Ibrani untuk melakukan hubungan seksual yang terlarang.
    reason: cultural_note
  - marker: b
    text: 'Atau: “kebejatan,” “kecemaran,” atau “perbuatan yang memalukan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה
  choice: menyingkapkan aurat
  rationale: Mempertahankan ungkapan hukum Ibrani yang secara idiomatis menunjuk pada hubungan seksual terlarang, sekaligus menjaga konsistensi dengan konteks Imamat 18.
- source_word: אִשָּׁה
  choice: seorang perempuan
  rationale: Kata ini dapat berarti perempuan atau istri; konteks tidak mengharuskan hubungan perkawinan, sehingga 'perempuan' lebih luas dan aman.
- source_word: וּבִתָּהּ
  choice: dan aurat anak perempuannya
  rationale: 'Pengulangan ''aurat'' membuat cakupan konstruksi Ibrani lebih jelas dalam bahasa Indonesia: larangan itu menyangkut perempuan tersebut dan anak perempuannya.'
- source_word: תִקַּח
  choice: mengambil
  rationale: Mempertahankan keluasan verba Ibrani tanpa mempersempitnya menjadi 'menikahi'; frasa tujuan berikutnya menjelaskan sifat seksual dari tindakan yang dilarang.
- source_word: בַּת בְּנָהּ
  choice: cucu perempuan dari anak laki-lakinya
  rationale: Menyampaikan struktur kekerabatan secara tepat dan alami dalam bahasa Indonesia.
- source_word: בַּת בִּתָּהּ
  choice: cucu perempuan dari anak perempuannya
  rationale: Menyampaikan jalur keturunan dari pihak anak perempuan secara eksplisit.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: untuk menyingkapkan auratnya
  rationale: Mempertahankan pronomina tunggal yang ambigu sebagaimana teks Ibrani, tanpa menentukan rujukannya secara berlebihan.
- source_word: שַׁאֲרָה הֵנָּה
  choice: mereka adalah kerabat sedarah
  rationale: שְׁאֵר menunjuk pada hubungan daging atau pertalian darah; 'kerabat sedarah' jelas dan wajar dalam bahasa Indonesia.
- source_word: זִמָּה
  choice: perbuatan keji
  rationale: Mengungkapkan kecaman moral yang kuat dan, dalam konteks ini, bernuansa pelanggaran seksual, tanpa menambahkan kategori doktrinal.
theological_decisions:
- issue: Rujukan akhiran tunggal dalam לְגַלּוֹת עֶרְוָתָהּ
  choice: Mempertahankan bentuk 'auratnya' tanpa memperjelas rujukan.
  alternative: Menafsirkannya sebagai aurat perempuan pertama, atau secara distributif sebagai aurat masing-masing keturunannya.
  rationale: Akhiran Ibrani berbentuk feminin tunggal dan rujukannya dapat dipahami berbeda; terjemahan tidak seharusnya menutup ambiguitas asli.
- issue: Cakupan makna תִקַּח dalam hukum ini
  choice: mengambil
  alternative: menikahi atau mengambil sebagai istri
  rationale: Teks dapat mencakup perkawinan atau penyatuan seksual; 'mengambil' tidak mempersempit larangan hanya pada perkawinan formal.
- issue: Daya kecaman זִמָּה
  choice: perbuatan keji
  alternative: kebejatan, kecemaran, atau perbuatan mesum
  rationale: '''Perbuatan keji'' menjaga kecaman hukum-moral yang kuat tanpa membatasi kata itu pada satu nuansa saja.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang lugas dan bermartabat. Sapaan tunggal 'engkau' dipertahankan untuk gaya perintah hukum. Istilah kekerabatan dibuat eksplisit agar kedua jalur cucu perempuan mudah dipahami.
