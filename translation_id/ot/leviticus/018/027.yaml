  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: id
  text: Sebab penduduk tanah itu yang tinggal sebelum kamu telah melakukan semua kekejian ini, dan tanah itu menjadi najis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tanah itu tercemar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan larangan atau peringatan sebelumnya sebagai alasan yang menjelaskannya.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: segala kekejian ini
  rationale: Menjaga kekuatan moral dan perjanjian dari תּוֹעֵבָה serta penunjukan jamak yang ditekankan oleh הָאֵל.
- source_word: עָשׂוּ
  choice: telah melakukan
  rationale: Menerjemahkan verba umum עשה secara langsung dan alami dalam bahasa Indonesia; aspek lampau jelas dari konteks penduduk terdahulu.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: penduduk negeri
  rationale: Walaupun secara bentuk harfiah berarti 'orang-orang lelaki negeri itu', frasa ini berfungsi kolektif untuk para penghuni terdahulu; 'penduduk negeri' adalah padanan Indonesia yang alami tanpa menambahkan pembatasan gender yang belum tentu dimaksudkan secara referensial.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: yang ada sebelum kamu
  rationale: Menyampaikan hubungan relatif dan urutan waktu secara jelas serta alami.
- source_word: וַתִּטְמָא
  choice: sehingga ... menjadi najis
  rationale: Menjaga makna hasil atau perubahan keadaan dari טמא dan membuat hubungan akibat dengan perbuatan sebelumnya eksplisit sebagaimana urutan narasi Ibrani.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Merujuk pada wilayah tertentu yang dihuni sebelum Israel, bukan bumi secara keseluruhan; demonstratif Indonesia membantu mempertahankan rujukan definit.
theological_decisions:
- issue: Sifat kenajisan negeri
  choice: negeri itu menjadi najis
  alternative: negeri itu tercemar
  rationale: Pilihan ini mempertahankan hubungan teologis antara tindakan manusia dan kenajisan negeri tanpa membatasinya hanya pada kategori ritual, moral, atau metaforis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Negeri' dipilih untuk wilayah yang dimaksud dalam konteks, sedangkan 'kekejian' mempertahankan bobot kuat istilah Ibrani. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
