  edition: WLC
  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: id
  text: Kalian harus melaksanakan ketentuan-Ku dan menaati ketetapan-Ku dengan hidup menurut semuanya itu.[a] Akulah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berjalan di dalamnya,” sebuah ungkapan Ibrani tentang menjalani hidup menurut perintah-perintah Allah.
    reason: Menjelaskan metafora לָלֶכֶת בָּהֶם tanpa memasukkan gagasan tambahan bahwa ketaatan itu sendiri menghasilkan kehidupan.
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: peraturan-peraturan-Ku
  rationale: Dalam konteks hukum perjanjian, מִשְׁפָּט menunjuk pada aturan atau ketentuan hukum. Pilihan ini mempertahankan nuansa yuridis dan tetap membedakannya dari חֻקֹּתַי.
- source_word: תַּעֲשׂוּ
  choice: harus melaksanakan
  rationale: Kata עשה secara dasar berarti 'melakukan', tetapi 'melaksanakan' lebih alami dalam bahasa Indonesia ketika objeknya adalah peraturan dan menegaskan penerapan nyata.
- source_word: חֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: חֻקָּה merujuk pada ketetapan atau aturan yang ditetapkan. 'Ketetapan' merupakan padanan hukum yang wajar dan menjaga perbedaannya dari מִשְׁפָּט.
- source_word: תִּשְׁמְרוּ
  choice: menaati
  rationale: שׁמר secara harfiah berarti menjaga, tetapi dalam konteks hukum perjanjian bermakna memelihara dengan cara menaatinya. 'Menaati' menyampaikan maksud itu secara alami.
- source_word: לָלֶכֶת בָּהֶם
  choice: menjalani hidup menurut semuanya itu
  rationale: Ungkapan ini secara harfiah berarti 'berjalan di dalamnya' dan merupakan idiom tentang pola hidup. Terjemahan ini mempertahankan cakupan etisnya dalam bahasa Indonesia alami; metafora Ibraninya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Bentuk konstruk dengan akhiran orang kedua jamak berarti 'Allah kamu'. Bentuk 'Allahmu' alami dalam bahasa Indonesia dan mengungkapkan hubungan perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Makna לָלֶכֶת בָּהֶם
  choice: menjalani hidup menurut semuanya itu
  alternative: berjalan di dalam semuanya itu
  rationale: Bahasa Ibrani memakai metafora berjalan untuk perilaku atau cara hidup. Teks utama menyampaikan idiom itu secara jelas tanpa mengubahnya menjadi gagasan bahwa ketaatan menghasilkan kehidupan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kamu' mengikuti sapaan orang kedua jamak dalam bahasa Ibrani, meskipun bahasa Indonesia tidak menandai jumlah secara tegas. Pengulangan kata benda mempertahankan corak hukum tanpa menjadi terlalu teknis.
