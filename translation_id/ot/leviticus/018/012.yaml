  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat saudara perempuan ayahmu[a]; dia adalah kerabat sedarah ayahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “menyingkapkan aurat” merupakan ungkapan hukum dalam Imamat untuk penyingkapan seksual atau hubungan seksual yang terlarang.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “daging ayahmu”; dapat juga dipahami sebagai “kerabat dekat ayahmu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: aurat
  rationale: Dalam Imamat 18, istilah ini menjadi bagian dari ungkapan hukum tetap tentang penyingkapan seksual yang terlarang. “Aurat” mempertahankan citra sumber dan wajar dalam bahasa Indonesia.
- source_word: תְגַלֵּה
  choice: janganlah engkau menyingkapkan
  rationale: Bentuk larangan ini menerjemahkan ungkapan sumber secara cukup formal dan mempertahankan pola berulang dalam pasal tersebut, tanpa langsung memparafrasakannya sebagai hubungan seksual.
- source_word: אֲחוֹת אָבִיךָ
  choice: saudara perempuan ayahmu
  rationale: Pilihan ini alami dan jelas, sekaligus mempertahankan hubungan kekerabatan yang dinyatakan langsung dalam bahasa Ibrani. “Bibimu dari pihak ayah” lebih ringkas tetapi lebih interpretatif.
- source_word: שְׁאֵר
  choice: kerabat sedarah
  rationale: Dalam konteks kekerabatan, kata ini menunjuk pada pertalian daging atau hubungan darah yang dekat. “Kerabat sedarah” menyampaikan maksud hukumnya secara jelas; catatan kaki mempertahankan ungkapan harfiahnya.
- source_word: הִוא
  choice: dia adalah
  rationale: Pronomina feminin mengidentifikasi perempuan itu sebagai pihak yang memiliki pertalian kekerabatan terlarang tersebut. Bahasa Indonesia tidak membedakan gender pada pronomina orang ketiga.
theological_decisions:
- issue: Penerjemahan ungkapan hukum tentang hubungan seksual terlarang
  choice: Mempertahankan ungkapan “menyingkapkan aurat” dalam teks utama.
  alternative: “melakukan hubungan seksual dengan”
  rationale: Ungkapan Ibrani bersifat tetap dan berulang dalam Imamat 18. Mempertahankannya menjaga konsistensi antarteks dan tidak mempersempit atau memperluas rumusan sumber secara diam-diam.
- issue: Makna שְׁאֵר dalam hubungan kekerabatan
  choice: “kerabat sedarah” dalam teks utama
  alternative: “daging ayahmu” atau “kerabat dekat ayahmu”
  rationale: “Kerabat sedarah” mengungkapkan fungsi kekerabatan istilah tersebut dalam bahasa Indonesia modern, sedangkan catatan kaki menjaga metafora harfiah “daging” dan ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “janganlah engkau” mempertahankan nada hukum yang khidmat; “aurat” menjaga ungkapan sumber, sementara “kerabat sedarah” memberi kejelasan bagi pembaca umum.
