  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: id
  text: Janganlah engkau mengambil seorang perempuan di samping saudarinya untuk menjadi istri saingan, untuk menyingkapkan auratnya selama saudarinya itu masih hidup.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִשָּׁה
  choice: seorang perempuan
  rationale: אִשָּׁה dapat berarti 'perempuan' atau 'istri'. Dalam konteks ini, verba 'mengambil' dan frasa 'menjadi istri saingan' menjelaskan bahwa yang dimaksud ialah mengambilnya dalam perkawinan.
- source_word: אֶל אֲחֹתָהּ
  choice: di samping saudarinya
  rationale: Ungkapan ringkas ini menunjukkan bahwa perempuan tersebut diambil sebagai tambahan bagi saudarinya yang sudah menjadi istri; 'di samping' mempertahankan hubungan itu tanpa meleburkannya dengan לִצְרֹר.
- source_word: לֹא תִקָּח
  choice: Janganlah engkau mengambil
  rationale: Bentuk larangan hukum ini diterjemahkan dengan rumusan Indonesia yang alami dan tetap khidmat. Dalam konteks perkawinan, 'mengambil' mempunyai arti mengambil sebagai istri.
- source_word: לִצְרֹר
  choice: untuk menjadi istri saingan
  rationale: Infinitif dari צרר di sini menyatakan terciptanya hubungan persaingan antara kedua saudari. Kata 'istri' memperjelas konteks perkawinan yang tersirat.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: dan menyingkapkan auratnya
  rationale: Mempertahankan ungkapan khas Imamat bagi hubungan seksual, alih-alih menggantinya dengan parafrasa yang lebih interpretatif.
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: selama saudarinya itu masih hidup
  rationale: Secara keseluruhan frasa ini membatasi larangan pada masa hidup saudari yang pertama. Penyebutan ulang 'saudarinya itu' menjernihkan rujukan pronomina dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan larangan mengenai perkawinan dengan dua saudari
  choice: Ayat ini melarang mengambil saudari dari istri sebagai istri tambahan selama istri tersebut masih hidup.
  alternative: Ayat ini melarang perkawinan dengan dua saudari dalam segala keadaan, termasuk setelah salah satunya meninggal; atau terutama melarang setiap perkawinan yang menimbulkan persaingan.
  rationale: לִצְרֹר dan בְּחַיֶּיהָ paling wajar menunjuk pada pengambilan saudari sebagai istri tambahan yang menjadi saingan selama saudari pertama masih hidup. Terjemahan tidak memperluas larangan melampaui batas waktu yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal 'engkau' mempertahankan bentuk hukum langsung. Ungkapan 'menyingkapkan aurat' dipertahankan demi konsistensi dengan idiom hukum seksual dalam Imamat.
