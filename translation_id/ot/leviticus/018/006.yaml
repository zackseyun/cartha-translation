  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: id
  text: Jangan seorang pun mendekati kerabat sedarahnya untuk menyingkapkan aurat.[a] Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyingkapkan aurat.” Dalam pasal ini, ungkapan hukum tersebut merujuk pada penyingkapan seksual atau hubungan seksual yang dilarang dengan kerabat dekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: seorang pun
  rationale: Pengulangan nomina tunggal berfungsi distributif. Dalam larangan bahasa Indonesia, “jangan seorang pun” menyampaikan bahwa larangan berlaku kepada setiap orang secara alami tanpa perlu menambahkan “di antara kamu” yang tidak tersurat.
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: kerabat sedarahnya
  rationale: Ungkapan ini menunjuk pada kerabat dekat berdasarkan hubungan daging atau darah. “Kerabat sedarah” jelas dan wajar dalam bahasa Indonesia modern, sedangkan terjemahan harfiah “kerabat dari dagingnya” terasa tidak alami.
- source_word: לֹא תִקְרְבוּ
  choice: jangan ... mendekati
  rationale: Bentuk imperfek orang kedua jamak dengan negasi menyatakan larangan. “Mendekati” mempertahankan ungkapan halus dalam teks Ibrani dan berkaitan langsung dengan frasa tujuan sesudahnya.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: untuk menyingkapkan auratnya
  rationale: Terjemahan ini mempertahankan idiom hukum yang berulang dalam pasal tersebut. Akhiran posesif “-nya” dibuat eksplisit secara wajar dalam bahasa Indonesia sesuai objek kerabat, sementara catatan kaki menerangkan cakupan seksual idiom itu.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: “Akulah” menyampaikan penegasan dalam rumusan ilahi dengan alami, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi dan selaras dengan lapisan konsultasi yang telah diperbarui.
- issue: Apakah idiom seksual dibuat eksplisit dalam teks utama
  choice: mempertahankan idiom “menyingkapkan aurat”
  alternative: melakukan hubungan seksual dengan
  rationale: Idiom hukum Ibrani sengaja dipertahankan karena berulang sepanjang pasal dan dapat mencakup paparan seksual maupun hubungan seksual. Catatan kaki menjelaskan maknanya tanpa mempersempit ketegangan semantis dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk larangan dibuat langsung dan mudah dipahami, sementara idiom hukum serta nama ilahi dipertahankan.
