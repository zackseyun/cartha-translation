  verdict: revise
  source_fidelity: Revisi diperlukan pada formula hukuman. וְנִכְרְתוּ secara harfiah dan sebagai idiom hukum berarti “akan diputuskan/disingkirkan,” sedangkan “dilenyapkan” terlalu mudah dipahami sebagai pemusnahan atau kematian dan karena itu mempersempit ketaksaan yang disengaja dalam teks Ibrani. Bentuk imperfek dapat diterjemahkan futurum (“akan”), bukan modal normatif “harus.” Unsur universal-partitif tetap tersampaikan dengan “satu saja dari segala kekejian ini.”
  naturalness: Kalimat revisi tetap formal, jelas, dan alami dalam bahasa Indonesia modern. “Orang-orang yang melakukannya” secara idiomatis merujuk pada kekejian-kekejian yang disebutkan; “dari antara bangsa mereka” adalah bentuk yang wajar untuk formula komunal Ibrani.
  terminology: '“Kekejian” tepat untuk תּוֹעֵבוֹת dalam konteks ini. “Diputuskan dari antara bangsa mereka” mempertahankan istilah formulaik tanpa memutuskan apakah akibatnya kematian, pengucilan, atau bentuk penghakiman lain. Catatan kaki perlu diselaraskan: “diputuskan,” bukan “dilenyapkan,” sebagai pembacaan utama.'
  issues:
