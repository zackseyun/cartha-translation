    issue: “harus dilenyapkan” mempersempit arti וְנִכְרְתוּ.
    rationale: Formula כרת tidak menentukan cara penghukuman. “Dilenyapkan” dalam bahasa Indonesia cenderung menyatakan pemusnahan dan dapat menyiratkan hukuman mati, padahal sumber sengaja tidak merincinya.
  - severity: medium
    issue: “harus” kurang mencerminkan bentuk prediktif/legal dari וְנִכְרְתוּ.
    rationale: “Akan diputuskan” menyampaikan konsekuensi yang dinyatakan teks tanpa mengubahnya menjadi perintah normatif.
  - severity: low
    issue: “salah satu dari segala kekejian ini” dapat dibuat lebih eksplisit sebagai tindakan tunggal dalam cakupan universal.
    rationale: “Satu saja dari segala kekejian ini” lebih alami dan dengan jelas mempertahankan daya partitif מִכֹּל.
  revised_text: Sebab, siapa pun yang melakukan satu saja dari segala kekejian ini[a], orang-orang yang melakukannya akan diputuskan dari antara bangsa mereka.
