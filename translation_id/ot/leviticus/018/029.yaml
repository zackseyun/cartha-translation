  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: id
  text: Sebab, siapa pun yang melakukan satu saja dari segala kekejian ini[a], orang-orang yang melakukannya akan diputuskan dari antara bangsa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan dihukum mati” atau “akan dikeluarkan dari komunitas”; teks Ibrani mengatakan “akan diputuskan,” tanpa menyebutkan dengan tepat bagaimana hukuman itu dilaksanakan.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendasari peringatan dan ketetapan sebelumnya; bentuk ini wajar dan tetap mempertahankan hubungan penjelas dalam konteks.
- source_word: כָּל אֲשֶׁר
  choice: siapa pun yang
  rationale: Ungkapan relatif universal ini mencakup setiap orang tanpa kecuali dan terdengar alami dalam bahasa Indonesia modern.
- source_word: יַעֲשֶׂה
  choice: melakukan
  rationale: Mempertahankan arti dasar verba 'berbuat/melakukan' tanpa mempersempitnya menjadi istilah moral yang lebih khusus.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: salah satu dari segala kekejian ini
  rationale: Mengungkapkan unsur partitif מִן sekaligus cakupan menyeluruh כֹּל secara alami dalam bahasa Indonesia.
- source_word: תּוֹעֵבוֹת
  choice: kekejian
  rationale: Istilah ini mempertahankan bobot moral dan ritual dari kata Ibrani dalam konteks hukum kekudusan.
- source_word: וְנִכְרְתוּ
  choice: harus dilenyapkan
  rationale: Mengungkapkan akibat hukum yang tegas dari bentuk Niphal כרת, sementara catatan kaki mempertahankan ketidakpastian tentang cara pelaksanaannya.
- source_word: הַנְּפָשׁוֹת
  choice: orang-orang
  rationale: Dalam konteks hukum, נֶפֶשׁ menunjuk kepada pribadi atau individu, bukan secara khusus kepada jiwa sebagai unsur terpisah.
- source_word: הָעֹשֹׂת
  choice: yang melakukannya
  rationale: Partisip ini mengidentifikasi mereka sebagai pelaku kekejian yang baru disebutkan.
- source_word: מִקֶּרֶב עַמָּם
  choice: dari tengah-tengah bangsa mereka
  rationale: Mempertahankan gambaran komunal dan formulasi perjanjian dari teks Ibrani; 'bangsa mereka' sesuai dengan עַם dan tidak mempersempitnya menjadi keluarga atau kerabat.
theological_decisions:
- issue: Makna formula hukuman וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  choice: harus dilenyapkan dari tengah-tengah bangsa mereka
  alternative: harus dihukum mati; harus dikeluarkan dari komunitas
  rationale: Teks Ibrani tidak menjelaskan apakah hukuman ini berupa tindakan langsung Allah, hukuman mati oleh manusia, atau pengucilan. Terjemahan utama mempertahankan ungkapan yang cukup luas, dan catatan kaki menyatakan kemungkinan-kemungkinannya tanpa menetapkan salah satunya.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan bermartabat. Susunan kalimat mempertahankan penekanan universal pada pelaku serta keseriusan formula hukuman, tetapi menghindari istilah teknis yang sukar dipahami pembaca umum.
