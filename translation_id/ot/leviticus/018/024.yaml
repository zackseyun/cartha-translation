  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: id
  text: Janganlah menajiskan diri kalian dengan satu pun dari hal-hal ini[a], sebab dengan semua hal ini bangsa-bangsa yang sedang Kuusir dari hadapan kalian telah menjadi najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Janganlah mencemarkan diri kalian dengan satu pun dari hal-hal ini ... bangsa-bangsa ... telah tercemar.”'
    reason: alternatif leksikal untuk akar טמא; “mencemarkan/tercemar” merupakan padanan yang sah bagi “menajiskan/menjadi najis”.
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: Janganlah menajiskan diri kalian
  rationale: אַל dengan bentuk imperfek menyatakan larangan, sedangkan bentuk Hitpael תִּטַּמְּאוּ melibatkan subjek itu sendiri. Ungkapan ini mempertahankan kosakata kenajisan khas Imamat dan terdengar wajar dalam bahasa Indonesia.
- source_word: בְּכָל אֵלֶּה
  choice: dengan satu pun dari semua hal ini
  rationale: Dalam kalimat negatif, כָל dapat diterjemahkan secara idiomatis sebagai 'satu pun'; בְּ menunjukkan sarana atau hal yang menyebabkan kenajisan. Unsur 'semua' tetap dipertahankan untuk menghubungkannya dengan klausa berikutnya.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi larangan sebelumnya; 'sebab' menyampaikan hubungan penjelas itu secara ringkas dan bermartabat.
- source_word: בְכָל אֵלֶּה נִטְמְאוּ
  choice: dengan semua hal ini ... telah menjadi najis
  rationale: Nifal נִטְמְאוּ dapat menyatakan keadaan hasil, yaitu 'menjadi najis'. Bentuk perfektum merujuk pada kenajisan yang telah terjadi dan menjadi dasar tindakan pengusiran yang sedang dinyatakan.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks ini istilah tersebut menunjuk pada bangsa-bangsa non-Israel penghuni negeri itu. 'Bangsa-bangsa' adalah padanan langsung dan tidak anakronistis.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: yang sedang Kuusir
  rationale: Walaupun שׁלח pada dasarnya dapat berarti 'mengirim', konteks penghukuman dan pengambilalihan negeri menuntut arti mengeluarkan atau mengusir. Partisipel מְשַׁלֵּחַ ditampilkan dengan aspek progresif 'sedang'.
- source_word: מִפְּנֵיכֶם
  choice: dari hadapan kalian
  rationale: Terjemahan ini mempertahankan unsur spasial מִן dan פָּנִים serta tetap alami bersama kata 'mengusir'.
theological_decisions:
- issue: Istilah kenajisan ritual-moral dalam Imamat 18
  choice: menajiskan diri / menjadi najis
  alternative: mencemarkan diri / telah dicemarkan
  rationale: Akar טמא dipertahankan secara konsisten dengan istilah 'najis', yang mencakup kategori kekudusan dalam Imamat tanpa mempersempitnya menjadi sekadar kenajisan seremonial. Klausa pertama menyatakan keterlibatan refleksif, sedangkan Nifal pada klausa kedua dibiarkan sebagai keadaan hasil dan tidak dipaksakan menjadi tindakan refleksif atau pasif murni.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Kata ganti jamak 'kalian' memperjelas bentuk Ibrani orang kedua jamak; 'Kuusir' mengikuti kaidah penulisan bentuk terikat dan menandai perkataan Allah. Pengulangan 'semua hal ini' sengaja dipertahankan untuk mencerminkan struktur Ibrani.
