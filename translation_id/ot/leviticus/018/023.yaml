  verdict: revise
  source_fidelity: Terjemahan ini pada dasarnya menyampaikan larangan dan penilaian penutup dengan setia. Namun, בָּהּ berarti “dengannya/bersamanya,” bukan terutama “olehnya”; revisi mempertahankan relasi yang dinyatakan teks tanpa mengubahnya menjadi sebab yang dilakukan oleh binatang. Pada klausa tentang perempuan, bentuk pasif dalam draf dapat dibuat lebih jelas dengan menyatakan binatang sebagai pelaku, sesuai dengan akhiran feminin pada לְרִבְעָהּ.
  naturalness: “Bersetubuh” dan “binatang apa pun” baku serta jelas dalam register ini. “Agar binatang itu mengawininya” lebih langsung dan alami daripada “untuk dikawini olehnya,” yang berpotensi kabur karena rujukan -nya. “Pelanggaran terhadap tatanan yang semestinya” tetap jelas dan bermartabat.
  terminology: “Najis” dengan catatan penjelas mempertahankan kategori טמא tanpa membatasinya menjadi kenajisan ritual belaka. “Pelanggaran terhadap tatanan yang semestinya” merupakan padanan yang hati-hati bagi תבל; alternatif “penyimpangan” dan “kekacauan” tetap dicatat. Catatan a direvisi agar tidak menjadikan “pembaringan” sebagai klaim harfiah yang terlalu sempit atau tidak alami bagi idiom Ibrani.
