base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: id
  text: Janganlah engkau bersetubuh dengan binatang apa pun sehingga engkau menjadi najis dengannya.[a] Seorang perempuan janganlah menempatkan dirinya di hadapan seekor binatang agar binatang itu mengawininya.[b] Itu adalah pelanggaran terhadap tatanan yang semestinya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, teks berbunyi, “jangan memberikan perbaringanmu kepada binatang apa pun untuk menjadi najis dengannya.” Ungkapan “memberikan perbaringanmu” adalah idiom seksual; frasa berikutnya juga dapat diterjemahkan “dengan demikian menajiskan dirimu dengannya.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “jangan berdiri di hadapan seekor binatang agar binatang itu menaikinya”; ungkapan itu menunjuk pada hubungan seksual dengan binatang.'
    reason: lexical_alternative
  - marker: c
    text: Atau “penyimpangan” atau “kekacauan.” Kata Ibraninya menunjuk pada pelanggaran atau pencampuradukan tatanan yang semestinya, khususnya dalam konteks seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: dengan binatang apa pun
  rationale: בְּהֵמָה menunjuk pada binatang, kerap binatang ternak tetapi tidak harus dibatasi demikian; “binatang apa pun” mempertahankan cakupan כָּל dan terdengar alami dalam bahasa Indonesia.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: janganlah engkau bersetubuh
  rationale: Ungkapan harfiahnya kira-kira “jangan memberikan pembaringanmu,” sebuah idiom seksual yang akan janggal dan kabur bila disalin mentah-mentah. “Bersetubuh” menyampaikan maksud idiom itu secara jelas tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: לְטָמְאָה בָהּ
  choice: sehingga engkau menjadi najis olehnya
  rationale: Infinitif ini dapat menyatakan tujuan atau akibat. “Sehingga” mempertahankan kaitan tindakan itu dengan keadaan najis tanpa membatasinya hanya pada kenajisan ritual.
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: janganlah menempatkan dirinya di hadapan seekor binatang
  rationale: Secara harfiah teks berbunyi “jangan berdiri di hadapan binatang.” Dalam konteks ini, “menempatkan dirinya” secara alami menyatakan tindakan sengaja mengambil posisi untuk tujuan seksual yang disebut sesudahnya.
- source_word: לְרִבְעָהּ
  choice: untuk dikawini olehnya
  rationale: Akar רבע dalam konteks ini menunjuk pada tindakan binatang menaiki betina untuk kawin; akhiran feminin menjadikan perempuan itu objek tindakan. Bentuk pasif Indonesia mempertahankan arah tindakan tersebut.
- source_word: תֶּבֶל
  choice: pelanggaran terhadap tatanan yang semestinya
  rationale: Istilah ini menandai pencampuradukan atau pelanggaran tatanan, terutama dalam konteks seksual. Pilihan ini lebih jelas bagi pembaca modern daripada “kekacauan” dan tidak mencampurkannya dengan istilah Ibrani lain yang biasa diterjemahkan “kekejian”.
theological_decisions:
- issue: Hubungan tindakan seksual dengan kenajisan
  choice: sehingga engkau menjadi najis olehnya
  alternative: untuk menjadi najis dengannya; dengan demikian menajiskan dirimu dengannya
  rationale: Bahasa sumber menghubungkan tindakan tersebut dengan kenajisan, tetapi bentuk infinitifnya dapat bernuansa tujuan atau akibat. Terjemahan utama memakai hasil yang alami dalam bahasa Indonesia, sedangkan catatan mempertahankan kemungkinan lainnya.
- issue: Makna penilaian תֶּבֶל
  choice: pelanggaran terhadap tatanan yang semestinya
  alternative: penyimpangan; kekacauan
  rationale: Pilihan ini mempertahankan penilaian moral bahwa tindakan tersebut melanggar tatanan yang patut tanpa memasukkan kategori doktrinal yang lebih kemudian atau menyamakannya dengan istilah teknis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “engkau” mempertahankan bentuk orang kedua maskulin tunggal pada larangan pertama. Istilah “bersetubuh” dipilih karena jelas tetapi tidak kasar; “dikawini” mempertahankan gambaran tindakan seksual binatang dan arah pasif yang tersirat oleh akhiran feminin Ibrani.
