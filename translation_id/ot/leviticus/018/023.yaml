    issue: “Olehnya” pada klausa kenajisan
    rationale: Kata ganti בָּהּ secara harfiah berarti “dengannya” dan mengaitkan kenajisan dengan hubungan itu. “Olehnya” lebih mudah dibaca sebagai sebab atau pelaku yang menajiskan.
  - severity: low
    issue: Rujukan dalam “dikawini olehnya” kurang jelas
    rationale: Bentuk tersebut secara gramatikal dapat dipahami, tetapi pembaca dapat ragu siapa yang dimaksud oleh “olehnya.” Menyebut “binatang itu” secara eksplisit mempertahankan arah tindakan yang ditandai oleh akhiran feminin Ibrani.
  - severity: low
