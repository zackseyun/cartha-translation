    rationale: שְׁכָבְתְּךָ adalah idiom seksual yang berhubungan dengan “berbaring,” bukan padanan Indonesia yang secara aman dapat dijelaskan sebagai “pembaringanmu.” Catatan sebaiknya menyebut idiom tersebut tanpa menciptakan kesan padanan leksikal yang pasti.
