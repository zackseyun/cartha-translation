base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: id
  text: Janganlah kalian melakukan apa yang dilakukan orang di negeri Mesir[a], tempat kalian dahulu tinggal. Janganlah kalian melakukan apa yang dilakukan orang di negeri Kanaan, ke mana Aku sedang membawa kalian. Janganlah kalian mengikuti ketetapan-ketetapan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “menurut perbuatan negeri Mesir”; demikian juga tentang negeri Kanaan. Ungkapan Ibrani menunjuk pada perbuatan atau praktik penduduk negeri itu.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “berjalan menurut ketetapan-ketetapan mereka.” Kata yang diterjemahkan “ketetapan-ketetapan” juga dapat berarti “kebiasaan-kebiasaan” atau “peraturan-peraturan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: melakukan apa yang dilakukan orang di
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang ‘perbuatan/praktik negeri’. Terjemahan ini menyampaikan bahwa yang dimaksud ialah perilaku penduduk negeri itu, sambil mempertahankan unsur tindakan konkret.
- source_word: אֶרֶץ מִצְרַיִם / אֶרֶץ כְּנַעַן
  choice: negeri Mesir / negeri Kanaan
  rationale: ‘Negeri’ mempertahankan penekanan geografis אֶרֶץ dan terdengar alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: tempat kalian dahulu tinggal
  rationale: Klausa ini menunjuk Mesir sebagai tempat tinggal Israel pada masa lampau; ‘dahulu’ memperjelas hubungan waktu tanpa mengubah makna.
- source_word: לֹא תַעֲשׂוּ
  choice: Janganlah kalian melakukan
  rationale: Larangan langsung dan mengikat dalam konteks hukum perjanjian disampaikan secara wajar dengan ‘janganlah’; ‘kalian’ mempertahankan bentuk jamak.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: ke mana Aku membawa kalian
  rationale: Partisipel מֵבִיא menyatakan tindakan ilahi yang sedang berlangsung atau segera terjadi, sedangkan שָׁמָּה menandai arah tujuan.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: ketetapan-ketetapan mereka
  rationale: חֻקּוֹת dapat berarti ketetapan, peraturan, atau kebiasaan yang tetap. ‘Ketetapan-ketetapan’ mempertahankan daya normatifnya dan kontras dengan ketetapan TUHAN dalam konteks sekitar.
- source_word: לֹא תֵלֵכוּ
  choice: Janganlah kalian mengikuti
  rationale: Secara harfiah verba ini berarti ‘berjalan’, tetapi bersama בְּ dan ‘ketetapan’ ungkapan itu berarti mengatur perilaku menurut atau mengikuti norma tersebut. Pilihan ini alami dalam bahasa Indonesia, sementara metafora sumber dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah pelaku kebiasaan Mesir dan Kanaan perlu dinyatakan secara eksplisit
  choice: orang di negeri Mesir/Kanaan
  alternative: perbuatan atau kebiasaan negeri Mesir/Kanaan
  rationale: Bahasa Ibrani mengaitkan perbuatan dengan ‘negeri’, tetapi yang dimaksud secara wajar ialah praktik penduduknya. ‘Orang di’ menghindari kesan bahwa tanah itu sendiri bertindak tanpa mempersempit larangan pada kelompok tertentu yang tidak disebutkan.
- issue: Apakah חֻקֹּתֵיהֶם diterjemahkan sebagai kebiasaan atau ketetapan
  choice: ketetapan-ketetapan mereka
  alternative: kebiasaan-kebiasaan mereka; peraturan-peraturan mereka
  rationale: ‘Ketetapan’ mempertahankan nuansa norma yang mengikat serta kontras leksikal dengan ketetapan Allah dalam ayat-ayat sekitar; kemungkinan arti ‘kebiasaan’ tetap dicatat.
- issue: Apakah metafora ‘berjalan’ pada לֹא תֵלֵכוּ dipertahankan dalam teks utama
  choice: mengikuti
  alternative: berjalan menurut
  rationale: ‘Mengikuti ketetapan’ merupakan ungkapan Indonesia yang jelas bagi perilaku yang diarahkan oleh norma. Metafora Ibrani tidak dihilangkan dari bukti terjemahan, melainkan disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk menyatakan dengan jelas bahwa semua verba dan pronomina orang kedua dalam ayat ini berbentuk jamak. Pengulangan larangan dipertahankan untuk menjaga irama dan penekanan teks Ibrani.
