  - severity: low
    issue: Bentuk “kausingkapkan”
    rationale: Bentuk ini tidak salah, tetapi konstruksi “engkau menyingkapkan” lebih lancar dalam bahasa Indonesia baku modern sambil mempertahankan register larangan hukum.
