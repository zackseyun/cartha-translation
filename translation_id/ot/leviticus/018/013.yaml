  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: id
  text: Janganlah engkau menyingkapkan ketelanjangan saudara perempuan ibumu,[a] sebab ia adalah kerabat dekat ibumu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih dinamis, “Janganlah engkau melakukan hubungan seksual dengan saudara perempuan ibumu.” Bahasa Ibrani secara harfiah berbunyi, “Janganlah engkau menyingkapkan ketelanjangan saudara perempuan ibumu.”
    reason: lexical_alternative
  - marker: b
    text: “Kerabat dekat” menerjemahkan istilah Ibrani שְׁאֵר, istilah kekerabatan yang menunjuk pada kerabat dekat atau kerabat sedarah.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: Janganlah kausingkapkan aurat
  rationale: Mempertahankan ungkapan hukum eufemistis Ibrani secara formal. Dalam konteks Imamat 18, ungkapan ini mengacu pada hubungan seksual terlarang.
- source_word: אֲחוֹת אִמְּךָ
  choice: saudara perempuan ibumu
  rationale: Menyatakan hubungan kekerabatan secara langsung dan lebih dekat dengan bentuk Ibrani daripada 'bibimu', yang dapat mencakup kerabat melalui perkawinan.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi larangan tersebut dengan gaya hukum yang wajar dalam bahasa Indonesia.
- source_word: שְׁאֵר אִמְּךָ
  choice: kerabat dekat ibumu
  rationale: שְׁאֵר adalah istilah kekerabatan bagi sanak dekat atau kerabat sedarah; 'kerabat dekat' menyampaikan maksudnya secara alami tanpa menerjemahkannya secara kaku sebagai 'daging'.
- source_word: הִוא
  choice: ia adalah
  rationale: Mewakili klausa nominal Ibrani dengan jelas dan tetap bermartabat dalam register hukum.
theological_decisions:
- issue: Penerjemahan ungkapan hukum eufemistis tentang hubungan seksual terlarang
  choice: Mempertahankan ungkapan 'menyingkapkan aurat' dalam teks utama
  alternative: Menerjemahkannya secara dinamis sebagai 'melakukan hubungan seksual dengan'
  rationale: Ungkapan Ibrani ini berulang di sepanjang Imamat 18. Mempertahankannya menjaga corak hukum, eufemisme, dan kesinambungan sastra teks; maknanya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'janganlah kausingkapkan' mempertahankan nada larangan hukum tanpa terdengar terlalu arkais. Penempatan penanda [a] sesudah frasa kekerabatan mengaitkan catatan dengan keseluruhan ungkapan larangan, sedangkan [b] ditempatkan langsung sesudah 'kerabat dekat'.
