  source_fidelity: 'Makna pokoknya setia pada Ibrani: larangan memakai idiom hukum עֶרְוָה ... גלה, objeknya adalah saudara perempuan ibu, dan alasannya ialah kedekatan kekerabatan dengan ibu. Namun, “ketelanjangan” lebih langsung mencerminkan עֶרְוָה dan lebih idiomatis dalam register Alkitab Indonesia daripada “aurat,” yang dalam pemakaian modern membawa asosiasi sosial-keagamaan tersendiri.'
  naturalness: Susunan hubungan kekerabatan dan alasan larangan sudah jelas. Bentuk “Janganlah engkau menyingkapkan ketelanjangan ...” mempertahankan nada hukum yang formal tetapi tetap baku dan mudah dipahami. Bentuk “kausingkapkan” dapat dipahami, tetapi kurang lazim dalam prosa Indonesia baku modern dibandingkan konstruksi ini.
  terminology: “Ketelanjangan” mempertahankan metafora/eufemisme hukum sumber tanpa memaksakan parafrasa eksplisit ke dalam teks utama. “Kerabat dekat ibumu” memadai untuk שְׁאֵר אִמְּךָ; catatan kaki dapat menjelaskan bahwa istilah itu secara harfiah berhubungan dengan ‘daging/kerabat sedarah’ tanpa menjadikan satu penafsiran teknis sebagai teks utama.
