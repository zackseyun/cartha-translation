base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat saudara perempuanmu—baik anak perempuan ayahmu maupun anak perempuan ibumu, yang lahir di rumah ataupun yang lahir di luar. Janganlah engkau menyingkapkan aurat mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang lahir di rumah atau yang lahir di luar.” Bahasa Ibrani mengontraskan kelahiran “di rumah/rumah tangga” dengan kelahiran “di luar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: aurat ...
  rationale: Dalam Imamat 18, עֶרְוָה merupakan ungkapan hukum bagi ketelanjangan seksual dalam hubungan yang dilarang. Ungkapan “menyingkapkan aurat” mempertahankan idiom sumber dan lazim dipahami dalam bahasa Indonesia.
- source_word: אֲחוֹתְךָ
  choice: saudara perempuanmu
  rationale: Istilah kekerabatan ini diterjemahkan langsung dan mempertahankan sapaan orang kedua tunggal kepada laki-laki dalam konteks hukum pasal ini.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: anak perempuan ayahmu / anak perempuan ibumu
  rationale: Kedua frasa menjabarkan cakupan “saudara perempuanmu” secara simetris tanpa memasukkan pembedaan hukum yang tidak dinyatakan dalam ayat.
- source_word: מוֹלֶדֶת
  choice: yang lahir
  rationale: Bentuk ini menunjuk kepada orang yang dilahirkan; “yang lahir” merupakan padanan Indonesia yang jelas dan alami.
- source_word: בַּיִת / חוּץ
  choice: dalam rumah tangga / di luarnya
  rationale: Pasangan kata ini mengontraskan lingkungan rumah atau rumah tangga dengan bagian di luar lingkungan itu. Pilihan ini menjaga cakupan sosial kata בַּיִת sekaligus mempertahankan ketidakpastian tepatnya makna kontras tersebut.
- source_word: לֹא תְגַלֶּה
  choice: Janganlah engkau menyingkapkan
  rationale: Bentuk larangan hukum diterjemahkan dengan ragam yang tegas dan bermartabat; “menyingkapkan” mempertahankan idiom yang terkait dengan aurat.
- source_word: אוֹ ... אוֹ
  choice: baik ... maupun ... ataupun
  rationale: Struktur alternatif dalam bahasa Ibrani disampaikan dengan pasangan yang alami dalam bahasa Indonesia tanpa mengubah cakupan larangan.
theological_decisions:
- issue: Cakupan hubungan yang dilarang
  choice: Larangan mencakup saudara perempuan yang merupakan anak perempuan ayah atau anak perempuan ibu, tanpa memandang apakah ia lahir dalam rumah tangga atau di luarnya.
  alternative: Keterangan terakhir dapat dipahami sebagai pembedaan antara saudara perempuan yang lahir di rumah dan yang lahir di luar, atau dapat berkaitan dengan keadaan keluarga yang berbeda; larangan pokok tetap berlaku atas semua kategori tersebut.
  rationale: Susunan hukum Ibrani memperluas dan menjabarkan kategori “saudara perempuanmu”, bukan mempersempitnya. Terjemahan tidak memasukkan kategori anak sah, anak di luar nikah, saudara kandung, atau saudara tiri secara eksplisit karena istilah-istilah itu tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa hukum yang tegas dan bermartabat dipertahankan, tetapi susunannya dibuat alami bagi pembaca Indonesia modern. “Engkau” menjaga bentuk sapaan tunggal sumber. Istilah “aurat” dipilih karena ringkas, lazim, dan sesuai dengan idiom seksual-hukum dalam konteks ini.
