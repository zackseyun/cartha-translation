  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: id
  text: 'Janganlah engkau menyingkapkan aurat ayahmu,[a] yaitu aurat ibumu. Ia adalah ibumu; janganlah engkau menyingkapkan auratnya.


    [a] Secara lebih harfiah: “aurat ayahmu dan aurat ibumu.” Kalimat selanjutnya menjelaskan bahwa yang dimaksud ialah ibumu: “Ia adalah ibumu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “aurat ayahmu dan aurat ibumu.” Kalimat selanjutnya menjelaskan bahwa yang dimaksud ialah ibumu: “Ia adalah ibumu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: aurat
  rationale: Dalam Imamat 18, עֶרְוָה merupakan bagian dari ungkapan hukum eufemistis גלה ערוה tentang hubungan seksual terlarang. “Aurat” mempertahankan citra tubuh telanjang sekaligus nuansa sopan dan legal yang alami dalam bahasa Indonesia.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: janganlah engkau menyingkapkan
  rationale: Bentuk larangan ini dipertahankan secara konsisten dan cukup dekat dengan verba גלה, tanpa mengganti ungkapan Ibrani dengan parafrasa seksual yang lebih eksplisit.
- source_word: אָבִיךָ
  choice: ayahmu
  rationale: Padanan langsung bagi istilah kekerabatan dengan sufiks orang kedua tunggal maskulin.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: yaitu aurat ibumu
  rationale: Dalam konteks dekat, frasa ini dapat dipahami sebagai penjelasan bagi “aurat ayahmu,” sebagaimana ditegaskan oleh kalimat berikut, “Ia adalah ibumu.” Karena וְ secara bentuk juga dapat berarti “dan,” bacaan yang lebih harfiah dicantumkan dalam catatan kaki.
- source_word: הִוא
  choice: Ia adalah
  rationale: Pronomina feminin tunggal menunjuk kepada ibu. “Ia adalah ibumu” mempertahankan penegasan identitas dalam teks Ibrani.
- source_word: אִמְּךָ
  choice: ibumu
  rationale: Padanan langsung bagi istilah kekerabatan yang diulang untuk penegasan dan kejelasan hukum.
theological_decisions:
- issue: Makna hubungan antara “aurat ayahmu” dan “aurat ibumu”
  choice: 'Frasa kedua diterjemahkan sebagai penjelasan: “aurat ayahmu, yaitu aurat ibumu.”'
  alternative: “aurat ayahmu dan aurat ibumu”
  rationale: Kalimat “Ia adalah ibumu” mendukung pemahaman bahwa pelanggaran terhadap ibu juga menyingkapkan aurat ayah dalam kerangka kehormatan keluarga. Namun, karena teks Ibrani memakai kata penghubung וְ, kemungkinan terjemahan koordinatif tetap disajikan dalam catatan kaki agar ambiguitas sumber tidak dihilangkan.
translation_notes:
  register: Bahasa hukum yang khidmat dan mudah dipahami dipertahankan dengan formula “Janganlah engkau.” Istilah “aurat” menjaga sifat eufemistis ungkapan Ibrani tanpa mengaburkan konteks seksualnya. Pengulangan dalam kalimat terakhir dipertahankan demi penekanan dan kejelasan.
