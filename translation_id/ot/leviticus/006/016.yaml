  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: id
  text: Setiap persembahan sajian seorang imam harus dibakar seluruhnya[a]; persembahan itu tidak boleh dimakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “harus menjadi seluruhnya.” Kata Ibrani ini dapat berarti “utuh” atau “lengkap”; dalam konteks persembahan, maknanya ialah bahwa tidak ada bagian yang dimakan, melainkan seluruhnya diserahkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Setiap
  rationale: כָּל dengan nomina tunggal bermakna distributif, yaitu “setiap”. Konjungsi וְ melanjutkan rangkaian ketentuan, tetapi tidak perlu diterjemahkan secara tersendiri karena “Setiap” mengawali ketentuan ini dengan wajar dalam bahasa Indonesia.
- source_word: מִנְחַת
  choice: kurban sajian
  rationale: מִנְחָה merupakan istilah teknis bagi persembahan berbahan hasil tanaman dalam hukum kurban Imamat. “Kurban sajian” jelas, alami, dan membedakannya dari persembahan umum.
- source_word: כֹּהֵן
  choice: seorang imam
  rationale: Rangkaian konstruksi מִנְחַת כֹּהֵן berarti kurban sajian milik atau yang dipersembahkan seorang imam. Bentuk tak tentu “seorang imam” mempertahankan cakupan umum hukum ini.
- source_word: כָּלִיל תִּהְיֶה
  choice: harus dibakar seluruhnya
  rationale: כָּלִיל menyatakan sesuatu yang utuh atau seluruhnya diserahkan, dan dalam konteks kurban mempunyai implikasi praktis bahwa seluruh persembahan dibakar. “Harus” menyampaikan daya preskriptif bentuk imperfek dalam hukum, sedangkan catatan kaki mempertahankan bentuk ungkapan Ibrani yang lebih harfiah.
- source_word: לֹא תֵאָכֵל
  choice: kurban itu tidak boleh dimakan
  rationale: Bentuk Nifal bersifat pasif, “tidak dimakan”. “Tidak boleh” menyampaikan larangan hukum secara alami, dan pengulangan “kurban itu” memperjelas rujukan tanpa mengubah makna.
theological_decisions:
- issue: Apakah כָּלִיל menyatakan keadaan “utuh” atau tindakan dibakar seluruhnya
  choice: harus dibakar seluruhnya
  alternative: harus menjadi persembahan yang utuh
  rationale: Kata Ibrani itu secara bentuk adalah adjektiva yang berarti utuh atau lengkap, tetapi dalam konteks altar menunjuk pada kurban yang seluruhnya diserahkan melalui pembakaran. Terjemahan utama menyatakan makna praktis konteks ini, sementara catatan kaki menjaga nuansa leksikal dan kemungkinan terjemahan yang lebih harfiah.
translation_notes:
  register: Bahasa hukum yang ringkas, bermartabat, dan mudah dipahami. Istilah “kurban sajian” dipakai sebagai istilah teknis, sementara “harus” dan “tidak boleh” menyampaikan kewajiban serta larangan secara alami dalam bahasa Indonesia modern.
