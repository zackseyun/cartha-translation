base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: id
  text: Apa yang tersisa darinya harus dimakan oleh Harun dan putra-putranya.[a] Itu harus dimakan tanpa ragi[c] di suatu tempat kudus;[b] mereka harus memakannya di pelataran Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sisanya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di suatu tempat kudus,” bukan “di tempat kudus itu”; klausa berikutnya menetapkan tempat tersebut sebagai pelataran Kemah Pertemuan.
    reason: lexical_alternative
  - marker: c
    text: Atau “sebagai makanan tidak beragi.” Bahasa Ibrani menyatakan bahwa persembahan itu harus dimakan dalam keadaan tanpa ragi, tanpa menentukan bentuknya secara lebih khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: Apa yang tersisa dari persembahan itu
  rationale: Partisip feminin dengan artikel berfungsi sebagai nomina dan menunjuk pada bagian yang tersisa dari persembahan sajian. Penambahan 'persembahan' memperjelas acuan pronomina feminin tanpa mengubah makna.
- source_word: יֹאכְלוּ
  choice: harus dimakan oleh
  rationale: Bentuk imperfek dalam konteks hukum menyatakan ketentuan. Konstruksi pasif alami dalam bahasa Indonesia mempertahankan fokus pada bagian persembahan yang wajib dimakan.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Harun dan anak-anaknya
  rationale: Dalam konteks ini בנים menunjuk kepada anak-anak laki-laki Harun yang menjalankan tugas keimaman. Bentuk Indonesia 'anak-anaknya' alami dan konteks imamat membatasi acuannya.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: Itu harus dimakan tanpa ragi
  rationale: מַצּוֹת menyatakan bentuk atau keadaan tanpa ragi. Terjemahan ini tidak menambahkan bentuk tertentu seperti roti, kue, atau bundaran yang tidak dinyatakan secara eksplisit.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: di suatu tempat kudus
  rationale: מָקוֹם tidak berartikel; 'suatu tempat kudus' mempertahankan ketakrifan yang tidak ditentukan, sementara klausa berikutnya menetapkan lokasinya.
- source_word: בַּחֲצַר
  choice: di pelataran
  rationale: חצר adalah area terbuka yang dibatasi dalam kompleks kemah suci. 'Pelataran' merupakan istilah Indonesia yang alami dan tepat.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan ini mempertahankan citra harfiah istilah Ibrani dan merupakan sebutan baku yang mudah dipahami.
- source_word: יֹאכְלוּהָ
  choice: mereka harus memakannya
  rationale: Pengulangan verba dan sufiks objek dipertahankan karena teks Ibrani mengulangi ketentuan itu sambil menetapkan tempatnya secara khusus.
