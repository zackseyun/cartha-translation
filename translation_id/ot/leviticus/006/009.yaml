  terminology: “Kemah Pertemuan” dan “pelataran” tepat serta konsisten. “Putra-putranya” lebih akurat untuk בָּנָיו dalam konteks imam laki-laki. “Tempat kudus” tepat untuk מָקוֹם קָדוֹשׁ dan tidak perlu dipahami sebagai ruang “Tempat Kudus.”
