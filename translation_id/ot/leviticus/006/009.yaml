translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi hukum 'harus' mempertahankan daya preskriptif ayat. Istilah 'pelataran' dan 'Kemah Pertemuan' digunakan secara konsisten untuk konteks tempat ibadah Israel.
