base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: id
  text: 'Imam yang diurapi dari antara anak-anaknya, yang menggantikannya,[a] harus menyiapkan persembahan itu. Inilah ketetapan untuk selama-lamanya[b] bagi TUHAN: seluruh persembahan itu harus dibakar hingga menjadi asap.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di bawahnya”; dalam konteks ini berarti “sebagai penggantinya” atau “menggantikan kedudukannya.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “ketetapan tetap” atau “ketetapan yang berlaku turun-temurun.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “seluruhnya harus dibuat menjadi asap”; maksudnya, seluruh persembahan dihabiskan di atas mazbah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: imam yang diurapi
  rationale: Mempertahankan istilah kultis bagi imam yang diurapi untuk jabatannya tanpa memberinya makna mesianik yang tidak dimaksudkan dalam konteks ini.
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: dari antara anak-anaknya, yang menggantikannya
  rationale: Mengungkapkan suksesi jabatan secara alami sambil mempertahankan keterangan bahwa penggantinya berasal dari antara anak-anak imam tersebut.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: harus menyiapkan persembahan itu
  rationale: Kata עשה luas artinya, tetapi dalam petunjuk ritual ini 'menyiapkan' menyampaikan tindakan terhadap persembahan tanpa mempersempitnya secara berlebihan.
- source_word: חָק עוֹלָם
  choice: ketetapan untuk selama-lamanya
  rationale: Menyampaikan daya berlaku yang berkelanjutan dengan ungkapan baku dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Mengikuti kebiasaan penerjemahan nama ilahi YHWH sebagai 'TUHAN'; preposisi 'bagi' sesuai dengan arah pengabdian ketetapan dan persembahan itu.
- source_word: כָּלִיל תָּקְטָר
  choice: seluruh persembahan itu harus dibakar hingga menjadi asap
  rationale: Menjaga gagasan totalitas sekaligus nuansa teknis bahwa persembahan dibuat naik sebagai asap di atas mazbah, bukan sekadar dibakar sebagian.
theological_decisions:
- issue: Identitas 'imam yang diurapi'
  choice: imam yang diurapi untuk jabatan dan kemudian menggantikan imam sebelumnya
  alternative: setiap imam yang pernah diurapi; atau sosok mesianik
  rationale: Keterangan bahwa ia berasal dari antara anak-anak imam sebelumnya dan menggantikannya menunjukkan suksesi jabatan keimaman, bukan gelar mesianik.
- issue: Penerjemahan nama YHWH
  choice: TUHAN
  alternative: Yahweh; Yehuwa
  rationale: Bentuk 'TUHAN' merupakan padanan Indonesia yang mapan dan menjaga pembedaan tipografis nama ilahi.
translation_notes:
  register: Bahasa Indonesia modern, resmi, dan lugas. Istilah kultis 'imam', 'persembahan', dan 'mazbah' dipertahankan karena sesuai dengan konteks Imamat. Susunan kalimat dibuat alami tanpa menghilangkan hubungan suksesi dan penekanan bahwa seluruh persembahan dibakar.
