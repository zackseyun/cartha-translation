base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: id
  text: Api di atas mazbah harus tetap menyala; jangan dibiarkan padam. Setiap pagi[a] imam harus menyalakan kayu di atasnya, menata kurban bakaran di atasnya, lalu membakar di atasnya lemak dari kurban keselamatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pagi demi pagi.” Pengulangan kata “pagi” menyatakan tindakan yang dilakukan setiap pagi.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani juga dapat diterjemahkan “kurban kesejahteraan” atau “kurban persekutuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: harus tetap menyala
  rationale: Bentuk Hofal menyatakan keadaan api yang harus terus dipertahankan. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan kewajiban ritual yang berkelanjutan.
- source_word: בּוֹ
  choice: di atas mazbah
  rationale: Acuannya adalah mazbah. Penyebutan ulang nomina lebih jelas daripada 'di atasnya' pada awal kalimat dan sesuai dengan lokasi api kurban.
- source_word: לֹא תִכְבֶּה
  choice: jangan dibiarkan padam
  rationale: Bentuk ini mempertahankan tuntutan agar api tidak padam sekaligus menyiratkan tanggung jawab imam untuk menjaganya, tanpa menyatakan bahwa api tidak mungkin padam dengan sendirinya.
- source_word: וּבִעֵר ... עֵצִים
  choice: menambahkan kayu ke dalam api itu
  rationale: Dalam konteks api yang sudah menyala, tindakan imam bukan menyalakan api baru, melainkan menaruh kayu agar api terus menyala. Terjemahan harfiah 'membakar kayu' kurang alami dan dapat mengaburkan fungsi tindakan tersebut.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: setiap pagi
  rationale: Pengulangan 'pagi' mempunyai arti distributif, yaitu tindakan yang dilakukan berulang kali pada tiap pagi.
- source_word: וְעָרַךְ
  choice: menata
  rationale: Kata ini menunjuk pada penempatan secara teratur dalam tata ibadah kurban; 'menata' ringkas, wajar, dan mempertahankan unsur keteraturan.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Ini adalah istilah Indonesia yang sudah dikenal untuk kategori kurban yang seluruhnya dibakar di mazbah, tanpa memaksakan makna etimologis 'naik' ke dalam teks.
- source_word: וְהִקְטִיר
  choice: membakar
  rationale: Dalam konteks kurban, bentuk Hifil ini berarti membuat bagian kurban naik sebagai asap dengan membakarnya di mazbah. 'Membakar' jelas dan alami.
- source_word: חֶלְבֵי
  choice: bagian-bagian lemak
  rationale: Yang dimaksud ialah bagian lemak tertentu yang ditetapkan untuk dibakar, bukan secara kiasan bagian terbaik.
- source_word: הַשְּׁלָמִים
  choice: kurban keselamatan
  rationale: Istilah ini mempertahankan kaitan leksikal dengan keutuhan, kesejahteraan, atau damai, sekaligus berfungsi sebagai nama kategori kurban dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah untuk הַשְּׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan; kurban kesejahteraan; kurban pendamaian
  rationale: '''Kurban keselamatan'' mempertahankan istilah kultis yang dikenal tanpa membatasi makna hanya pada persekutuan atau kesejahteraan. Catatan kaki mengakui keluasan makna istilah Ibrani. ''Kurban pendamaian'' dihindari karena dapat mencampurkannya dengan kategori kurban lain.'
- issue: Keberlangsungan api mazbah
  choice: harus tetap menyala; jangan dibiarkan padam
  alternative: akan menyala; tidak akan padam
  rationale: Konteksnya adalah perintah ritual kepada imam, bukan pernyataan bahwa api secara ajaib tidak dapat padam. Rumusan kewajiban mempertahankan daya normatif teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat langsung agar instruksi ritual mudah dipahami. Istilah 'mazbah', 'imam', 'kurban bakaran', dan 'kurban keselamatan' dipertahankan sebagai kosakata kultis yang dikenal, sedangkan tindakan imam diungkapkan secara alami.
