  text: Api harus terus dijaga agar tetap menyala di atas mezbah[a]; api itu tidak boleh padam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Api yang terus-menerus harus menyala di atas mezbah; api itu tidak boleh padam.”
    reason: alternatif leksikal untuk nuansa תָּמִיד dan kemungkinan menerjemahkan תּוּקַד secara kurang eksplisit sebagai “harus menyala”.
lexical_decisions:
- source_word: אֵשׁ
  choice: api
  rationale: Padanan literal dan lazim untuk api pada mazbah.
- source_word: תָּמִיד
  choice: terus
  rationale: Menyatakan kesinambungan; dalam bahasa Indonesia modern, frasa 'harus terus menyala' menyampaikan kewajiban memelihara api secara berkelanjutan.
- source_word: תּוּקַד
  choice: harus ... menyala
  rationale: Bentuk Hofal dari יקד memiliki nuansa pasif-kausatif. Dalam konteks perintah pemeliharaan api, 'harus terus menyala' alami dan menyiratkan bahwa api dijaga agar tetap menyala.
- source_word: עַל הַמִּזְבֵּחַ
  choice: di atas mazbah
  rationale: Mempertahankan hubungan ruang dan istilah kultis yang mapan.
- source_word: לֹא תִכְבֶּה
  choice: tidak boleh padam
  rationale: Mengungkapkan larangan dengan jelas serta mempertahankan gambaran api yang tidak padam.
