reference: Leviticus 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: id
  text: 'Perintahkanlah Harun dan para putranya: “Inilah hukum[a] tentang kurban bakaran: Kurban bakaran itu harus tetap berada di atas perapian mazbah[b] sepanjang malam sampai pagi, dan api mazbah harus dijaga agar tetap menyala di situ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “petunjuk” atau “ketentuan”.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “di tempat pembakaran di atas mazbah”. Kata Ibrani ini menunjuk kepada tempat pembakaran atau perapian pada mazbah.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Perintahkanlah
  rationale: Bentuk imperatif dari צוה menyampaikan perintah langsung; “perintahkanlah” mempertahankan daya wajibnya.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: Harun dan anak-anak laki-lakinya
  rationale: בנים dalam konteks ini menunjuk kepada putra-putra Harun yang menjalankan tugas keimaman; bentuk eksplisit ini menghindari kesan bahwa semua anak tanpa membedakan jenis kelamin dimaksudkan.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Dalam rumus pengantar perkataan langsung, tanda titik dua sesudah “demikian” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dengan berkata”.
- source_word: זֹאת תּוֹרַת
  choice: Inilah hukum tentang
  rationale: תורה di sini adalah ketentuan yang mengatur kurban tertentu. “Hukum tentang” mempertahankan ragam resmi tanpa menjadikannya sebutan bagi keseluruhan Taurat.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Istilah Indonesia yang lazim dan jelas bagi עֹלָה, yaitu kurban yang dibakar di atas mazbah.
- source_word: הִוא הָעֹלָה
  choice: Kurban bakaran itu
  rationale: Pengulangan nomina bersama pronomina memberi penegasan pada kurban itu sendiri; pengulangan “kurban bakaran” mempertahankan fokus tersebut secara alami.
- source_word: עַל מוֹקְדָה
  choice: harus tetap berada di tempat pembakarannya
  rationale: מוֹקְדָה menunjuk pada tempat atau perapian tempat kurban dibakar. “Harus tetap berada” menyampaikan keberlangsungan yang dituntut oleh konteks sepanjang malam.
- source_word: עַל הַמִּזְבֵּחַ
  choice: di atas mazbah
  rationale: Padanan langsung yang mempertahankan lokasi ritual dan istilah Indonesia yang mapan untuk altar persembahan.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: sepanjang malam sampai pagi
  rationale: Ungkapan alami yang tetap mempertahankan seluruh rentang waktu dalam teks Ibrani.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: dan api mazbah harus dijaga agar tetap menyala di situ
  rationale: Bentuk Hophal תּוּקַד menyatakan bahwa api itu harus dipelihara dalam keadaan menyala, bukan sekadar menyatakan bahwa api akan menyala. “Di situ” mempertahankan kekompakan rujukan בּוֹ tanpa memaksakan apakah acuannya terutama mazbah atau tempat pembakaran.
theological_decisions:
- issue: Arti תּוֹרָה dalam peraturan kurban
  choice: hukum
  alternative: petunjuk; ketentuan
  rationale: Dalam rumus hukum kurban ini, “hukum” mempertahankan nada normatif. Pilihan ini tidak menyatakan bahwa kata tersebut di sini merupakan judul bagi keseluruhan Taurat.
- issue: Sifat perintah mengenai api mazbah
  choice: harus dijaga agar tetap menyala
  alternative: akan menyala; harus menyala
  rationale: Bentuk verbal Ibrani menunjukkan pemeliharaan api secara berkelanjutan, sehingga instruksi ritual tidak diubah menjadi pernyataan keadaan semata.
- issue: Acuan pronomina בּוֹ
  choice: di situ
  alternative: di atasnya
  rationale: Acuannya dapat dipahami dalam lingkungan mazbah atau tempat pembakaran. “Di situ” menjaga ketegangan rujukan itu tanpa memilih secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mazbah” dipertahankan sebagai istilah ritual yang mapan; susunan kalimat dibuat alami dengan “demikian:” sebagai pengantar kutipan langsung. Semua penanda catatan kaki ditempatkan tepat pada unsur yang diterangkannya.
