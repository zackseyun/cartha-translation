  terminology: “Harun,” “kurban bakaran,” “mazbah,” dan “hukum” konsisten serta dapat dipertahankan. “Perapian” adalah padanan yang lebih idiomatis dan tepat bagi מוֹקְדָה dalam konteks altar.
