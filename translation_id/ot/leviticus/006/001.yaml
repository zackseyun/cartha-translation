  text: 'Lalu Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur dengan tindakan tutur berikutnya. “Lalu” alami dalam narasi Indonesia, sedangkan “berfirman” merupakan padanan yang wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju dalam tindakan berbicara; “kepada Musa” adalah ungkapan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Dalam rumus pengantar tuturan langsung, infinitif ini secara idiomatis dapat diterjemahkan “kata-Nya”. Bentuk ini mempertahankan fungsi pengantar menuju perkataan pada ayat berikutnya tanpa menghasilkan ungkapan kaku “dengan mengatakan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar; “Yehovah” merupakan bentuk tradisional alternatif.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Berfirman” dipilih untuk tuturan Allah; “kata-Nya” mempertahankan formula pengantar tanpa kekakuan harfiah. Tidak ada catatan kaki karena teks utama langsung memakai nama Yahweh dan tidak memerlukan penjelasan tekstual untuk ayat singkat ini.
