  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: id
  text: Imam yang mempersembahkannya sebagai kurban penghapus dosa[a] harus memakannya. Kurban itu harus dimakan di tempat yang kudus, di pelataran Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Imam yang mengadakan pendamaian dengannya harus memakannya.” Kata Ibrani yang dipakai dapat pula menunjuk pada imam yang melaksanakan ritus kurban penghapus dosa atau ritus penyucian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Padanan baku dan wajar bagi כֹּהֵן dalam konteks ibadah Israel; bentuk definit dalam bahasa Ibrani tidak selalu perlu dinyatakan dengan kata penentu tersendiri dalam bahasa Indonesia.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: yang mempersembahkannya sebagai kurban penghapus dosa
  rationale: Bentuk partisipel piel dari חטא dalam konteks hukum kurban menunjuk pada imam yang melaksanakan ritus kurban penghapus dosa. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan jenis kurban tanpa mempersempitnya menjadi satu teori pendamaian.
- source_word: יֹאכֲלֶנָּה
  choice: harus memakannya
  rationale: Bentuk imperfek di sini bersifat preskriptif dalam hukum ibadah; 'harus' menyatakan kewajiban dengan jelas.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: di tempat yang kudus
  rationale: Frasa Ibrani tidak memakai artikel pada מָקוֹם; terjemahan ini mempertahankan sifat tempat itu tanpa menjadikannya nama ruang tertentu.
- source_word: תֵּאָכֵל
  choice: Kurban itu harus dimakan
  rationale: Bentuk nifal pasif dipertahankan, sedangkan nomina 'kurban' dipakai untuk memperjelas acuan pronomina feminin dalam bahasa Ibrani.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: di pelataran Kemah Pertemuan
  rationale: '''Pelataran'' merupakan padanan alami bagi חָצֵר dalam kompleks tempat ibadah, dan ''Kemah Pertemuan'' adalah padanan baku bagi אֹהֶל מוֹעֵד.'
theological_decisions:
- issue: Makna kultis חטא dalam hukum kurban para imam
  choice: yang mempersembahkannya sebagai kurban penghapus dosa
  alternative: yang mengadakan pendamaian dengannya; yang menyucikan dengannya
  rationale: Dalam konteks ini verba tersebut dapat menunjuk secara khusus pada pelaksanaan ritus kurban penghapus dosa. Terjemahan utama menyatakan fungsi kultisnya tanpa menyelesaikan secara berlebihan hubungan semantis antara penghapusan dosa, penyucian, dan pendamaian; ambiguitas itu dicatat dalam catatan kaki.
- issue: Acuan sufiks pronominal feminin
  choice: dinyatakan sebagai kurban itu/-nya
  alternative: mempertahankan gender gramatikal secara harfiah
  rationale: Sufiks feminin mengacu pada kurban atau hewan kurban. Bahasa Indonesia tidak menandai gender pada pronomina, sehingga acuan dipertegas secara idiomatis sebagai 'kurban itu'.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Istilah kultis dibuat konsisten dan mudah dipahami: ''imam'', ''kurban penghapus dosa'', ''tempat yang kudus'', ''pelataran'', dan ''Kemah Pertemuan''. Penanda catatan kaki ditempatkan setelah seluruh ayat karena catatan menjelaskan frasa pada kalimat pertama.'
