  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: id
  text: Kemudian ia harus menanggalkan pakaiannya dan mengenakan pakaian lain, lalu membawa[a] abu itu ke suatu tempat yang tahir[b] di luar perkemahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mengeluarkan” atau “membawa keluar” abu itu.
    reason: lexical_alternative
  - marker: b
    text: “Tahir” di sini mengacu pada keadaan bersih secara ritual menurut ketentuan dalam Imamat.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: Kemudian ia harus menanggalkan
  rationale: Dalam konteks pakaian, פשט berarti menanggalkan. “Kemudian” menyampaikan urutan tindakan dalam petunjuk ritual, sedangkan “harus” menyatakan daya preskriptif bentuk verbal dalam konteks hukum.
- source_word: בְּגָדָיו
  choice: pakaiannya
  rationale: בגד adalah istilah umum untuk pakaian; bentuk bersufiks menunjukkan milik orang yang sedang dibicarakan.
- source_word: וְלָבַשׁ
  choice: dan mengenakan
  rationale: לבש berarti mengenakan pakaian. Pilihan ini alami sekaligus sesuai dengan ragam bahasa ritual yang bermartabat.
- source_word: בְּגָדִים אֲחֵרִים
  choice: pakaian lain
  rationale: אֲחֵרִים menunjukkan pakaian yang berbeda dari pakaian yang baru ditanggalkan, tanpa mengharuskan penjelasan tambahan seperti “seperangkat”.
- source_word: וְהוֹצִיא
  choice: lalu membawa ... ke luar
  rationale: Bentuk Hifil dari יצא berarti membuat keluar, mengeluarkan, atau membawa keluar. Karena objeknya abu yang dipindahkan menuju lokasi tertentu, “membawa ... ke luar” menyatakan tindakan konkret dan arah geraknya dengan jelas.
- source_word: הַדֶּשֶׁן
  choice: abu itu
  rationale: Dalam konteks mazbah, דֶּשֶׁן menunjuk pada abu atau sisa pembakaran. “Abu” adalah padanan Indonesia yang alami; penentu “itu” mewakili bentuk tentu Ibrani dan mengacu pada abu yang telah disebut dalam konteks.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Frasa ini menunjukkan gerakan menuju tempat di luar batas perkemahan. “Ke luar perkemahan” ringkas dan idiomatis.
- source_word: אֶל מָקוֹם טָהוֹר
  choice: ke tempat yang tahir
  rationale: טָהוֹר dalam konteks Imamat menyatakan status kemurnian ritual. “Tahir” mempertahankan kategori khas tersebut tanpa memperluas teks utama menjadi penjelasan.
theological_decisions:
- issue: Nuansa kemurnian ritual pada טָהוֹר
  choice: tempat yang tahir
  alternative: tempat yang bersih; tempat yang suci secara ritual
  rationale: “Tahir” mempertahankan kategori ritual Imamat dan membedakannya dari kebersihan fisik biasa. Catatan kaki menjelaskan maknanya agar istilah tetap mudah dipahami tanpa memasukkan tafsiran tambahan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan urutan prosedural teks Ibrani. Istilah “tahir” dipakai untuk menjaga pembedaan ritual yang penting dalam Imamat, dengan penjelasan singkat dalam catatan kaki.
