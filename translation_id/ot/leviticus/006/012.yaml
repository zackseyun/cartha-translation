  text: 'Lalu Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sedangkan דִּבֵּר dalam pengantar ucapan ilahi secara alami dan bermartabat diterjemahkan dengan “berfirman” dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang menerima firman; “kepada Musa” adalah padanan Indonesia yang wajar.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Dalam formula pengantar ucapan, “kata-Nya” mengungkapkan fungsi לֵאמֹר secara alami dalam bahasa Indonesia dan menghindari ungkapan kaku “dengan mengatakan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri YHWH. Bentuk “Yahweh” mempertahankan nama tersebut dan paling luas diterima sebagai rekonstruksi pelafalannya, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Formula “berfirman ... kata-Nya” lazim dan mudah dipahami; tanda koma menunjukkan bahwa isi firman menyusul pada ayat berikutnya.
