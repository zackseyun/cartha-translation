base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: id
  text: Imam harus mengenakan pakaian linennya dan mengenakan celana dalam linen pada tubuhnya.[a] Lalu ia harus mengangkat abu dari kurban bakaran yang dilalap api di atas mazbah[b] dan menaruhnya di sisi mazbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Pada tubuhnya" secara harfiah berarti "pada dagingnya".'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani tentang abu dan api sangat padat; dapat juga diterjemahkan, "abu yang api 'makan' dari kurban bakaran."
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: pakaian linennya
  rationale: Dalam konteks pakaian imam, frasa ini menunjuk pada pakaian resmi dari linen. 'Pakaian' tidak menentukan modelnya secara berlebihan.
- source_word: מִכְנְסֵי בַד
  choice: celana dalam linen
  rationale: Istilah ini menunjuk pada pakaian linen untuk tubuh bagian bawah yang dikenakan langsung pada badan; pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עַל בְּשָׂרוֹ
  choice: pada tubuhnya
  rationale: Secara harfiah berarti 'pada dagingnya'. 'Pada tubuhnya' mempertahankan gagasan bahwa pakaian itu dikenakan langsung pada badan tanpa ungkapan yang kaku.
- source_word: וְהֵרִים
  choice: mengangkat
  rationale: Makna dasar verba ini adalah mengangkat atau mengambil. Dalam prosedur ini tindakan tersebut sekaligus memindahkan abu, tetapi 'mengangkat' menjaga bentuk konkret teks Ibrani.
- source_word: הַדֶּשֶׁן
  choice: abu sisa
  rationale: Dalam konteks kurban, kata ini menunjuk pada residu berabu dari bahan yang dilalap api. 'Abu sisa' membuat fungsi kontekstualnya jelas.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: kurban bakaran yang telah dilalap api
  rationale: Ungkapan Ibrani padat dan secara harfiah menggambarkan api 'memakan' kurban bakaran. 'Dilalap api' alami dalam bahasa Indonesia dan tetap mempertahankan citra tersebut.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Ini adalah istilah Indonesia yang jelas dan lazim bagi kurban yang dibakar seluruhnya, tanpa mengganti istilah ritual dengan penjelasan teologis.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: di sisi mazbah
  rationale: Frasa ini menyatakan letak yang berdekatan di samping mazbah. 'Di sisi' ringkas dan alami.
