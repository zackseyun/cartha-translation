  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל בּ֖/וֹ יִשָּׁבֵ֑ר וְ/אִם בִּ/כְלִ֤י נְחֹ֨שֶׁת֙ בֻּשָּׁ֔לָה וּ/מֹרַ֥ק וְ/שֻׁטַּ֖ף בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: id
  text: Bejana tanah liat yang di dalamnya kurban itu direbus harus dipecahkan. Namun, jika kurban itu direbus dalam bejana perunggu[a], bejana itu harus digosok dan dibilas dengan air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bejana tembaga.” Kata Ibrani נְחֹשֶׁת dapat berarti tembaga atau perunggu, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: bejana tanah liat
  rationale: Menyatakan wadah dari tembikar secara alami dalam bahasa Indonesia dan mempertahankan perbedaan bahan yang mendasari perlakuan berbeda.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: direbus
  rationale: Dalam konteks kurban, בשׁל menunjuk pada memasak dengan merebus; bentuk pasif sumber dipertahankan.
- source_word: בּוֹ
  choice: yang dipakai untuk merebusnya
  rationale: Mengungkapkan hubungan lokatif dengan bejana secara wajar; akhiran -nya merujuk pada kurban yang dibicarakan dalam konteks.
- source_word: יִשָּׁבֵר
  choice: harus dipecahkan
  rationale: Bentuk imperfek Nifal dalam ketentuan hukum menyatakan kewajiban; 'harus' jelas dan modern.
- source_word: כְלִי נְחֹשֶׁת
  choice: bejana perunggu
  rationale: נְחֹשֶׁת dapat berarti tembaga atau perunggu. 'Perunggu' lazim untuk perkakas logam kuno, sementara kemungkinan 'tembaga' dicatat dalam catatan kaki.
- source_word: וּמֹרַק
  choice: harus digosok hingga bersih
  rationale: מרק menyiratkan pembersihan menyeluruh dengan menggosok; frasa ini lebih alami dan jelas daripada satu kata teknis.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: dan dibilas dengan air
  rationale: שטף menggambarkan pencucian atau pembilasan dengan air dan menjadi tindakan pembersihan kedua setelah penggosokan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang lugas dan bermartabat. Pengulangan 'bejana itu' dipakai untuk memperjelas rujukan pronomina, sedangkan 'kurban itu' memasok rujukan tersirat dari konteks tanpa menentukan jenis atau bagian kurban lebih jauh.
