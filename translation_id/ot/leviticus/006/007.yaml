id: LEV.6.7
reference: Leviticus 6:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: id
  text: 'Inilah hukum tentang kurban sajian[a]: anak-anak Harun harus mempersembahkannya di hadapan Yahweh, di depan mezbah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “petunjuk untuk” atau “peraturan mengenai” kurban sajian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Inilah
  rationale: Ungkapan ini memperkenalkan bagian petunjuk yang baru. “Inilah” alami dalam bahasa Indonesia dan tetap mempertahankan fungsi penunjuknya; hubungan dengan konteks sebelumnya tersirat tanpa perlu memakai “dan” yang terasa kaku.
- source_word: תּוֹרַת
  choice: hukum tentang
  rationale: Dalam konteks peribadatan ini, תּוֹרָה menunjuk pada ketentuan resmi yang mengatur tata cara kurban. “Hukum tentang” mempertahankan corak hukum-liturgis, sementara kemungkinan arti “petunjuk” atau “peraturan” dicatat dalam catatan kaki.
- source_word: הַמִּנְחָה
  choice: kurban sajian
  rationale: Dalam peraturan kurban Imamat, מִנְחָה adalah kurban berbahan hasil tanaman, bukan persembahan umum. “Kurban sajian” merupakan istilah Indonesia yang ringkas dan mapan untuk jenis kurban ini.
- source_word: הַקְרֵב אֹתָהּ
  choice: harus mempersembahkannya
  rationale: Bentuk ini memberikan perintah tata cara kepada para imam agar membawa kurban itu untuk disajikan secara ritual. “Harus mempersembahkannya” menyampaikan daya wajib dan tindakan kultisnya secara alami.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Terjemahan langsung ini mempertahankan sebutan kekeluargaan sekaligus keimaman yang penting dalam Imamat.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Frasa ini menyatakan bahwa kurban disajikan dalam hadirat ilahi. “Di hadapan” membedakannya dengan jelas dari keterangan tempat konkret yang menyusul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga identitas nama dalam teks Ibrani tetap tampak.
- source_word: אֶל־פְּנֵי הַמִּזְבֵּחַ
  choice: di depan mezbah
  rationale: Ungkapan ini menunjukkan lokasi penyajian relatif terhadap mezbah. Terjemahan tersebut konkret dan tidak meleburkannya dengan frasa “di hadapan Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan menghindari penggantiannya dengan sebuah gelar.
- issue: Makna תּוֹרָה dalam peraturan kurban
  choice: hukum tentang
  alternative: petunjuk untuk; peraturan mengenai
  rationale: Konteksnya adalah tata cara resmi peribadatan. “Hukum” menjaga bobot normatifnya tanpa meniadakan nuansa petunjuk atau peraturan, yang disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “kurban sajian” dipakai sebagai istilah peribadatan yang ringkas; “di hadapan” dan “di depan” sengaja dibedakan untuk mempertahankan perbedaan kedua frasa ruang dalam bahasa Ibrani.
