base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: id
  text: 'Berbicaralah kepada Harun dan kepada anak-anaknya, dan katakanlah: “Inilah ketentuan mengenai kurban penghapus dosa[a]: Di tempat kurban bakaran disembelih, kurban penghapus dosa harus disembelih di hadapan Yahweh. Kurban itu maha kudus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian”. Istilah Ibrani חַטָּאת dapat menunjuk pada dosa maupun pada kurban yang berkaitan dengan pemurnian dari dosa atau kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן וְאֶל בָּנָיו לֵאמֹר
  choice: Berbicaralah kepada Harun dan kepada anak-anaknya demikian
  rationale: Mempertahankan bentuk perintah dan rumusan resmi yang memperkenalkan ketetapan ilahi, sambil memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: זֹאת תּוֹרַת
  choice: Inilah ketentuan mengenai
  rationale: Dalam konteks peraturan kurban, תּוֹרָה berarti pengajaran atau ketentuan yang mengatur tata cara. 'Ketentuan' terdengar alami dan tetap memiliki bobot hukum.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks imamat, חַטָּאת menunjuk pada kurban yang berkaitan dengan dosa dan pemurnian. Pilihan ini mudah dipahami pembaca Indonesia dan alternatif 'kurban pemurnian' dicatat dalam catatan kaki.
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: Di tempat kurban bakaran disembelih
  rationale: Menyampaikan lokasi dan tindakan ritual secara langsung; 'disembelih' tepat untuk שׁחט dalam konteks kurban.
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: kurban penghapus dosa harus disembelih
  rationale: Bentuk imperfek dalam teks hukum bersifat preskriptif; 'harus' menyatakan kewajiban itu dengan jelas dalam bahasa Indonesia modern.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan idiom kehadiran ilahi dan menerjemahkan nama perjanjian יְהוָה sebagai 'Yahweh'.
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: Kurban itu maha kudus
  rationale: Ungkapan superlatif Ibrani menyatakan tingkat kekudusan tertinggi. Subjek 'kurban itu' memperjelas rujukan pronomina feminin tanpa mengubah makna.
theological_decisions:
- issue: Makna חַטָּאת sebagai nama kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah tersebut dapat menonjolkan dosa maupun pemurnian ritual yang terkait dengannya. Teks utama memakai istilah yang lebih dikenal, sedangkan catatan kaki mempertahankan alternatif leksikal yang sah.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri dalam teks Ibrani dipertahankan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga identitas nama perjanjian tetap tampak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat konsisten dan mudah dipahami; nada perundangan dipertahankan tanpa memakai susunan yang kaku.
