  to: Inilah persembahan Harun dan anak-anaknya yang harus mereka persembahkan kepada TUHAN pada hari ia diurapi:[a] sepersepuluh efa tepung halus sebagai kurban sajian yang teratur, separuhnya pada pagi hari dan separuhnya pada petang hari.
