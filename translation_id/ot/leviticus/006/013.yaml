  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: id
  text: Inilah persembahan Harun dan anak-anaknya yang harus mereka persembahkan kepada TUHAN pada hari ia diurapi:[a] sepersepuluh efa tepung halus sebagai kurban sajian yang teratur, separuhnya pada pagi hari dan separuhnya pada petang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada hari pengurapannya.” Teks Ibrani memakai pronomina tunggal (“dia”), meskipun ayat ini menyebut “Harun dan anak-anaknya.”
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבַּן
  choice: persembahan
  rationale: Istilah kurban yang luas; 'persembahan' alami dalam bahasa Indonesia dan tidak mempersempit jenisnya sebelum rincian ayat diberikan.
- source_word: יַקְרִיבוּ
  choice: harus mereka persembahkan
  rationale: Bentuk Hifil קרב dalam konteks ritual berarti membawa atau menyajikan sebagai persembahan; 'harus' menyampaikan daya preskriptif peraturan ini.
- source_word: לַיהוָה
  choice: kepada TUHAN
  rationale: Nama ilahi יהוה ditampilkan dengan padanan tradisional bahasa Indonesia 'TUHAN' dalam huruf kapital.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: pada hari ia diurapi
  rationale: Mempertahankan keterangan waktu serta pronomina objek tunggal dalam teks Ibrani, tanpa mengubahnya menjadi bentuk jamak.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: sepersepuluh efa
  rationale: Padanan langsung dan ringkas bagi ukuran Ibrani; nama satuan kuno dipertahankan.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Menunjukkan tepung bermutu tinggi dan halus untuk persembahan, dengan ungkapan Indonesia yang wajar.
- source_word: מִנְחָה
  choice: kurban sajian
  rationale: Dalam perundang-undangan Imamat, istilah ini menunjuk persembahan berbahan hasil bumi; 'kurban sajian' merupakan istilah Indonesia yang jelas dan mapan.
- source_word: תָּמִיד
  choice: tetap
  rationale: Menyatakan keteraturan yang terus berlaku, bukan tindakan fisik yang berlangsung tanpa henti.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: separuhnya ... dan separuhnya
  rationale: Mempertahankan pembagian persembahan menjadi dua bagian sama besar.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: pada pagi hari ... pada petang hari
  rationale: Padanan temporal yang alami dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Acuan pronomina tunggal dalam frasa 'pada hari ia diurapi' setelah penyebutan Harun dan anak-anaknya
  choice: Mempertahankan bentuk tunggal 'ia' sebagaimana teks Masoret.
  alternative: Mengalihkannya secara distributif atau berdasarkan makna menjadi 'pada hari mereka diurapi'.
  rationale: Teks Ibrani memakai pronomina tunggal אֹתוֹ meskipun subjek sebelumnya adalah Harun dan anak-anaknya. Terjemahan tidak menyelaraskannya secara diam-diam; catatan memberi tahu pembaca tentang ketegangan gramatikal tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat konsisten dan mudah dipahami; satuan kuno 'efa' dipertahankan. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
