reference: Leviticus 6:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: id
  text: Persembahan itu harus dibuat di atas wajan dengan minyak[a], dalam keadaan tercampur rata. Bawalah itu sebagai persembahan sajian berupa potongan-potongan yang dipanggang[b], lalu persembahkanlah sebagai aroma yang menyenangkan[c] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam minyak.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “yang dipanggang” sangat langka; mungkin menunjuk pada potongan-potongan yang dipanggang atau pada cara pengolahannya di atas wajan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “aroma yang menyenangkan”; ini merupakan ungkapan baku dalam bahasa kurban untuk persembahan yang berkenan kepada Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: wajan
  rationale: Menunjuk pada alat masak datar untuk mengolah persembahan sajian. “Wajan” merupakan istilah Indonesia yang alami dan cukup luas tanpa menentukan bentuk alat secara berlebihan.
- source_word: בַּשֶּׁמֶן
  choice: dengan minyak
  rationale: Preposisi ב dapat menyatakan sarana atau medium. “Dengan minyak” alami dalam petunjuk pengolahan, sedangkan kemungkinan “di dalam minyak” dipertahankan dalam catatan kaki.
- source_word: תֵּעָשֶׂה
  choice: harus diolah
  rationale: Bentuk pasif Niphal dari עשה menyatakan bahwa persembahan itu harus dibuat atau disiapkan. “Diolah” sesuai dengan konteks kuliner dan tetap mempertahankan bentuk pasif.
- source_word: מֻרְבֶּכֶת
  choice: hingga tercampur rata
  rationale: Istilah ini menggambarkan bahan yang dicampur atau diaduk bersama minyak. Pilihan ini menyampaikan hasil pengolahan tanpa menetapkan teknik kuliner yang tidak pasti.
- source_word: תְּבִיאֶנָּה
  choice: Bawalah itu
  rationale: Kata kerja ini berarti membawa, dan sufiks feminin merujuk kepada persembahan. Bentuk imperatif Indonesia menyampaikan daya perintah dari bentuk Ibrani.
- source_word: תֻּפִינֵי
  choice: bagian-bagian yang dipanggang
  rationale: Istilah kuliner yang langka ini tampaknya berkaitan dengan hasil atau bagian yang dipanggang. Ketidakpastian maknanya dinyatakan dalam catatan kaki.
- source_word: מִנְחַת
  choice: persembahan sajian
  rationale: Dalam konteks Imamat, מִנְחָה menunjuk secara khusus pada persembahan berbahan tepung atau hasil tanaman. “Persembahan sajian” membedakannya dari kurban hewan.
- source_word: פִּתִּים
  choice: yang dipatah-patah
  rationale: Kata ini menunjuk pada bagian atau potongan. Bentuk “dipatah-patah” mempertahankan gambaran bahwa persembahan tersebut dibagi menjadi sejumlah potongan.
- source_word: תַּקְרִיב
  choice: Persembahkanlah
  rationale: Dalam konteks kurban, bentuk Hiphil dari קרב berarti membawa dekat untuk dipersembahkan. “Persembahkanlah” merupakan padanan kultis yang alami.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Ungkapan baku dalam bahasa kurban ini menyatakan persembahan yang berkenan atau diterima di hadapan Allah, sambil tetap mempertahankan citra aroma dalam teks.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”; preposisi ל dalam konteks ini menyatakan bahwa persembahan ditujukan bagi-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi dalam teks sumber tanpa menggantinya dengan gelar.
- issue: Makna ungkapan kurban רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  alternative: aroma yang menenteramkan
  rationale: Pilihan ini mempertahankan metafora aroma sekaligus menyampaikan bahwa persembahan itu berkenan, tanpa menyiratkan secara kasar bahwa Allah memerlukan bau makanan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dibagi menjadi tiga kalimat agar petunjuk ritual mudah dipahami. Istilah kultis “persembahan sajian” dipertahankan, sedangkan istilah kuliner dibuat alami tanpa menutupi ketidakpastian kata Ibrani yang langka.
