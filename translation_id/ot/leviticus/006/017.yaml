lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam formula pengantar perkataan ilahi, kata ini secara wajar dan bermartabat diterjemahkan “berfirman”; awalan וַ־ menghubungkannya dengan alur sebelumnya tanpa perlu selalu dinyatakan sebagai “lalu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Padanan Indonesia yang alami untuk arah tutur kepada Musa.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dalam bahasa Indonesia modern, fungsi formula “dengan berkata” paling alami dinyatakan dengan tanda titik dua yang memperkenalkan perkataan langsung berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama itu, sedangkan catatan kaki memberitahukan kebiasaan tradisional menerjemahkannya sebagai “TUHAN”.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Formula Ibrani untuk memperkenalkan perkataan langsung disampaikan secara alami dengan titik dua.
