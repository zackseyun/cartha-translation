  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: id
  text: Apa pun yang menyentuh dagingnya akan menjadi kudus. Jika sebagian darahnya terpercik[a] pada pakaian, pakaian yang terkena percikan itu harus kaucuci di tempat kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipercikkan.” Kata kerja Ibrani ini dapat menunjuk pada tindakan memercikkan dalam suatu ritus; “terpercik” di sini mempertahankan kemungkinan bahwa darah sekadar mengenai pakaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Apa pun yang
  rationale: Ungkapan ini bersifat menyeluruh dan tak tentu. “Apa pun yang” alami dalam bahasa Indonesia dan tidak membatasi acuannya hanya pada orang.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: menyentuh dagingnya
  rationale: בָּשָׂר secara konkret berarti “daging” dan dalam konteks ini menunjuk pada daging kurban penghapus dosa; akhiran feminin diterjemahkan dengan “-nya”.
- source_word: יִקְדָּשׁ
  choice: akan menjadi kudus
  rationale: Bentuk verba ini menunjukkan masuknya sesuatu ke dalam status kudus akibat persentuhan, bukan semata-mata pernyataan bahwa sesuatu sudah kudus atau pelaksanaan upacara penahbisan formal.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: Jika sebagian darahnya terpercik
  rationale: נזה dapat menunjuk pada darah yang diproyeksikan atau dipercikkan. Dalam konteks darah yang mengenai pakaian lalu harus dicuci, “terpercik” merupakan ungkapan Indonesia yang alami tanpa memastikan apakah kejadian itu disengaja.
- source_word: עַל הַבֶּגֶד
  choice: pada pakaian
  rationale: בֶּגֶד menunjuk pada sehelai pakaian. Bahasa Indonesia dapat memakai nomina tanpa penentu untuk ketentuan hukum yang bersifat umum.
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: pakaian yang terkena percikan itu
  rationale: Frasa ini merujuk kembali pada pakaian yang terkena darah. Pengulangan “pakaian” menghindari ketaksaan dan menyampaikan hubungan relatif Ibrani secara alami.
- source_word: תְּכַבֵּס
  choice: harus kaucuci
  rationale: Piel כבס berarti mencuci pakaian. Bentuk “kaucuci” mempertahankan sapaan orang kedua tunggal, sedangkan “harus” menyampaikan daya wajib dari ketentuan hukum ini.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: di tempat kudus
  rationale: Frasa ini menunjuk pada tempat yang berstatus kudus tanpa harus diartikan khusus sebagai ruang terdalam tempat suci.
theological_decisions:
- issue: Makna kekudusan yang timbul melalui persentuhan dengan daging kurban
  choice: Persentuhan menyebabkan sesuatu masuk ke dalam status kudus secara ritual.
  alternative: Persentuhan hanya membatasi benda itu bagi penggunaan sakral tanpa menyatakannya “menjadi kudus”.
  rationale: Terjemahan “akan menjadi kudus” mempertahankan predikasi verba Ibrani dan ketegangan teks, sementara konteks imamat menunjukkan bahwa yang dimaksud ialah kekudusan ritual, bukan perubahan moral batin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keimaman yang lugas dan bermartabat. Istilah “kudus” dipertahankan untuk kesinambungan kosakata kultis, dan bentuk orang kedua tunggal “kaucuci” mengikuti perintah langsung dalam teks Ibrani.
