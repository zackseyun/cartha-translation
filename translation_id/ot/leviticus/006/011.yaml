  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: id
  text: Setiap laki-laki di antara anak-anak Harun boleh memakannya. Ini adalah ketetapan tetap bagi generasi-generasimu dari persembahan yang dipersembahkan dengan api bagi Yahweh. Apa pun yang menyentuh persembahan-persembahan itu akan menjadi kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa pun yang menyentuh persembahan-persembahan itu akan dikuduskan.” Bahasa Ibrani dapat menyatakan bahwa sesuatu menjadi kudus melalui persentuhan; sebagian memahaminya lebih terbatas, yakni bahwa hanya yang kudus boleh menyentuhnya.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Setiap laki-laki
  rationale: Mempertahankan acuan gender yang tepat dalam konteks kelayakan imam; bentuk tunggal dipakai secara distributif.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: di antara anak-anak Harun
  rationale: Mempertahankan sebutan kekeluargaan sekaligus keimaman dalam teks Ibrani tanpa memperluasnya secara eksplisit menjadi semua keturunan.
- source_word: יֹאכֲלֶנָּה
  choice: boleh memakannya
  rationale: Menyatakan izin atau hak yang sah bagi para imam untuk memakan persembahan yang disebut dalam konteks sebelumnya.
- source_word: חָק עוֹלָם
  choice: ketetapan tetap
  rationale: Ungkapan hukum yang alami dalam bahasa Indonesia modern dan menyampaikan keberlakuan yang berkesinambungan.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun bagimu
  rationale: Menyampaikan keberlakuan bagi generasi-generasi berikutnya dengan ungkapan Indonesia yang idiomatis.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: mengenai persembahan-persembahan yang dibakar bagi Yahweh
  rationale: אִשֶּׁה menunjuk pada persembahan kurban yang disajikan melalui api; pilihan ini mempertahankan unsur api tanpa menyiratkan bahwa seluruh bagiannya selalu habis terbakar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana muncul dalam teks sumber.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: Apa pun yang menyentuhnya
  rationale: Menjaga keluasan konstruksi Ibrani yang tidak membatasi pelakunya pada orang atau benda. Pronomina Indonesia dibuat tunggal karena merujuk secara kolektif pada persembahan kurban dalam konteks.
- source_word: יִקְדָּשׁ
  choice: akan menjadi kudus
  rationale: Bentuk verbal paling wajar menyatakan hasil atau perubahan status akibat persentuhan, sambil mempertahankan ketegangan makna hukum kekudusan.
theological_decisions:
- issue: Makna peralihan kekudusan dalam klausa terakhir
  choice: Persentuhan dengan persembahan kudus mengakibatkan sesuatu atau seseorang menjadi kudus.
  alternative: Hanya sesuatu atau seseorang yang sudah kudus boleh menyentuh persembahan itu; atau persentuhan menempatkan pihak yang menyentuh di bawah kewajiban khusus karena status kudus.
  rationale: Urutan klausa Ibrani dan bentuk יִקְדָּשׁ paling langsung menyatakan akibat berupa keadaan kudus. Catatan kaki mempertahankan kemungkinan penafsiran yang lebih restriktif atau bernuansa kewajiban tanpa memasukkannya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum dibuat lugas; struktur kalimat diatur agar mudah dipahami pembaca umum. Penanda catatan kaki ditempatkan langsung setelah klausa yang diterangkannya.
