revisions:
- from: Setiap laki-laki di antara anak-anak Harun boleh memakannya. Inilah ketetapan tetap turun-temurun bagimu mengenai persembahan-persembahan yang dibakar bagi Yahweh. Apa pun yang menyentuhnya akan menjadi kudus.[a]
  to: Setiap laki-laki di antara anak-anak Harun boleh memakannya. Ini adalah ketetapan tetap bagi generasi-generasimu dari persembahan yang dipersembahkan dengan api bagi Yahweh. Apa pun yang menyentuh persembahan-persembahan itu akan menjadi kudus.[a]
  rationale: Revisi mengganti hubungan topikal 'mengenai' dengan 'dari' untuk mencerminkan preposisi Ibrani, dan mengganti 'yang dibakar' dengan istilah yang tidak menyiratkan bahwa seluruh persembahan habis terbakar. Rujukan akhir dibuat eksplisit dalam bentuk jamak agar selaras dengan persembahan-persembahan yang dimaksud, sementara 'apa pun' tetap menjaga ambiguitas orang atau benda. Catatan kaki diperbaiki agar tidak menambahkan kewajiban 'harus'.
