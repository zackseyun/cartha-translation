  terminology: '''Anak-anak Harun'', ''Yahweh'', dan ''kudus'' tepat dan konsisten dengan register keimaman. ''Persembahan yang dipersembahkan dengan api'' lebih akurat daripada ''persembahan-persembahan yang dibakar'', karena istilah Ibrani menunjuk persembahan api dan tidak mengharuskan seluruh persembahan habis dibakar.'
