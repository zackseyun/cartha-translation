revisions:
- from: Janganlah itu dipanggang dengan ragi. Aku telah memberikannya kepada mereka sebagai bagian mereka dari persembahan-Ku yang dibakar[a]. Itu mahakudus, sama seperti korban penghapus dosa dan korban penebus salah[b].
  to: Itu tidak boleh dipanggang dengan ragi. Aku telah memberikannya sebagai bagian mereka dari persembahan-Ku yang dipersembahkan dengan api[a]. Itu mahakudus, sama seperti korban penghapus dosa dan korban penebus salah[b].
  rationale: Revisi memperbaiki keluwesan larangan hukum, menyesuaikan susunan “bagian mereka” dengan teks Ibrani tanpa pengulangan penerima, dan memakai ungkapan yang lebih tepat untuk istilah teknis אִשֶּׁה. Klasifikasi persembahan dan alternatif leksikal dipertahankan.
