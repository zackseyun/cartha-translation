  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: id
  text: Itu tidak boleh dipanggang dengan ragi. Aku telah memberikannya sebagai bagian mereka dari persembahan-Ku yang dipersembahkan dengan api[a]. Itu mahakudus, sama seperti korban penghapus dosa dan korban penebus salah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari persembahan makanan bagi-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “korban kesalahan” atau “korban pemulihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵאָפֶה חָמֵץ
  choice: Janganlah itu dipanggang dengan ragi
  rationale: Bentuk Nifal תֵאָפֶה dipertahankan dengan konstruksi pasif, sedangkan larangan hukum לֹא dengan bentuk imperfek diterjemahkan secara alami sebagai “janganlah”. חָמֵץ dalam konteks pemanggangan menunjuk pada ragi atau bahan beragi tanpa mengharuskan penambahan kata “roti”.
- source_word: חֶלְקָם נָתַתִּי אֹתָהּ
  choice: Aku telah memberikannya kepada mereka sebagai bagian mereka
  rationale: Bentuk perfektif נָתַתִּי menyatakan pemberian yang telah ditetapkan dan tetap berlaku. Ungkapan “bagian mereka” mempertahankan bahasa pembagian jatah bagi para imam.
- source_word: מֵאִשָּׁי
  choice: dari persembahan-Ku yang dibakar
  rationale: אִשֶּׁה adalah istilah teknis persembahan yang lazimnya berkaitan dengan pembakaran di atas mezbah. Terjemahan ini jelas dalam bahasa Indonesia dan mempertahankan akhiran posesif orang pertama.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Konstruksi intensif ini menyatakan tingkat kekudusan tertinggi dalam penggolongan persembahan. “Mahakudus” ringkas, wajar, dan tidak mengesankan nama suatu lokasi.
- source_word: כַּחַטָּאת
  choice: sama seperti korban penghapus dosa
  rationale: Awalan כְּ menyatakan perbandingan atau kesamaan golongan. Dalam konteks korban, חַטָּאת menunjuk pada korban yang berkaitan dengan dosa, bukan pada dosa sebagai konsep abstrak.
- source_word: וְכָאָשָׁם
  choice: dan korban penebus salah
  rationale: Dalam konteks ritual, אָשָׁם adalah jenis korban tersendiri yang berkaitan dengan kesalahan dan kewajiban pemulihan. “Korban penebus salah” merupakan istilah Indonesia yang jelas dan membedakannya dari korban penghapus dosa.
theological_decisions:
- issue: Makna istilah persembahan אִשֶּׁה
  choice: persembahan-Ku yang dibakar
  alternative: persembahan makanan bagi-Ku
  rationale: Istilah Ibrani ini merupakan sebutan teknis yang dapat dipahami dengan menonjolkan pembakaran persembahan atau fungsinya sebagai pemberian makanan bagi Allah. Teks utama memakai pengertian ritual yang paling langsung, sementara catatan mempertahankan alternatif leksikalnya.
- issue: Terjemahan istilah korban אָשָׁם
  choice: korban penebus salah
  alternative: korban kesalahan; korban pemulihan
  rationale: Pilihan utama menandai jenis korban ritual tanpa menetapkan teori penebusan tertentu. Alternatif dicatat karena istilah ini juga dapat menonjolkan kesalahan yang menimbulkan kewajiban atau pemulihan yang menyertainya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Gaya hukum ritual dipertahankan tanpa menjadi kaku. Istilah “mahakudus”, “korban penghapus dosa”, dan “korban penebus salah” dipakai sebagai kategori persembahan yang mudah dikenali; ketidakpastian pada dua istilah teknis dijaga melalui catatan kaki.
