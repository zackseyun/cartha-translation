  text: וְ/כָל חַטָּ֡את אֲשֶׁר֩ יוּבָ֨א מִ/דָּמָ֜/הּ אֶל אֹ֧הֶל מוֹעֵ֛ד לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ לֹ֣א תֵאָכֵ֑ל בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: id
  text: Namun, setiap kurban penghapus dosa yang sebagian darahnya dibawa masuk ke Kemah Pertemuan untuk mengadakan pendamaian di tempat kudus tidak boleh dimakan[a]; kurban itu harus dibakar dengan api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kurban pemurnian" untuk "kurban penghapus dosa"; istilah Ibrani חַטָּאת dalam Kitab Imamat dapat menunjuk pada kurban yang menangani kenajisan dan dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Namun, setiap
  rationale: וְ menghubungkan ketentuan ini dengan aturan sebelumnya dan dalam konteks menyatakan kontras, sedangkan כָל memberi cakupan menyeluruh.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam peraturan kurban, istilah ini menunjuk pada kurban yang menangani dosa dan kenajisan, bukan pada dosa sebagai gagasan abstrak. Padanan ini dikenal luas dan tetap menyisakan dimensi pemurnian dalam catatan kaki.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: yang sebagian darahnya dibawa masuk
  rationale: 'Prefiks מִן pada ''darahnya'' bersifat partitif: sebagian dari darah kurban itu dibawa masuk. Ungkapan eksplisit ini menyampaikan rincian ritual secara alami.'
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: ke Kemah Pertemuan
  rationale: Ini adalah sebutan baku bagi bangunan tempat kudus. Kata kerja 'dibawa masuk' memperjelas bahwa darah dibawa ke bagian dalam kemah.
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: כפר dalam konteks keimaman menyatakan tindakan ritual pendamaian tanpa menetapkan satu teori teologis tertentu tentang mekanismenya.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Frasa ini menunjuk pada kawasan kudus di dalam tempat suci, bukan pada kekudusan sebagai konsep abstrak.
- source_word: לֹא תֵאָכֵל
  choice: tidak boleh dimakan
  rationale: Bentuk pasif Ibrani dipertahankan, sementara 'tidak boleh' menyampaikan larangan hukum secara wajar dalam bahasa Indonesia modern.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: harus dibakar dengan api
  rationale: Padanan ini mempertahankan bentuk pasif serta penegasan idiom Ibrani 'dibakar dengan api'.
theological_decisions:
- issue: Makna חַטָּאת dalam peraturan kurban keimaman
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Dalam konteks ini חַטָּאת jelas menunjuk pada kurban. 'Kurban penghapus dosa' merupakan istilah yang lebih mudah dikenali pembaca umum, sedangkan alternatif 'kurban pemurnian' dicatat untuk menjaga dimensi ritual dan ambiguitas leksikalnya.
- issue: Cakupan darah yang dibawa masuk ke tempat kudus
  choice: sebagian darahnya dibawa masuk
  alternative: darahnya dibawa masuk
  rationale: מִן yang melekat pada 'darahnya' mendukung pengertian partitif, sehingga teks tidak menyiratkan bahwa seluruh darah kurban dibawa masuk.
- issue: Daya wacana וְ pada awal ayat
  choice: Namun
  alternative: Dan
  rationale: Dalam konteks ketentuan sebelumnya, ayat ini menetapkan pengecualian atau kontras terhadap kurban yang boleh dimakan. 'Namun' menyampaikan hubungan itu tanpa mengubah cakupan כָל.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual dibuat konsisten dan mudah dipahami; struktur pasif serta rincian partitif dari teks Ibrani dipertahankan.
