  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: id
  text: Setiap laki-laki di antara para imam boleh memakannya; itu mahakudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kekudusan dari kekudusan-kekudusan,” suatu ungkapan superlatif yang berarti “mahakudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Setiap laki-laki
  rationale: כָּל dengan nomina tunggal זָכָר bersifat distributif. “Setiap laki-laki” juga mempertahankan penekanan pada jenis kelamin dalam ketentuan ritual ini tanpa menyiratkan usia dewasa.
- source_word: בַּכֹּהֲנִים
  choice: di antara para imam
  rationale: Preposisi בְּ di sini menyatakan keanggotaan dalam kelompok imam; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan kelompok tersebut.
- source_word: יֹאכַל
  choice: boleh memakannya
  rationale: Bentuk imperfek dalam konteks hukum ini menyatakan tindakan yang diizinkan atau diatur, bukan perintah bahwa setiap imam wajib makan.
- source_word: אֹתָהּ
  choice: memakannya
  rationale: Pronomina feminin merujuk pada persembahan yang sedang dibicarakan. Akhiran “-nya” mempertahankan rujukan pronominal secara alami dalam bahasa Indonesia.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Ungkapan harfiah “kekudusan dari segala kekudusan” merupakan idiom superlatif yang menunjukkan tingkat kekudusan tertinggi. “Mahakudus” ringkas, bermartabat, dan sesuai dengan kategori ritual ini.
- source_word: הִוא
  choice: persembahan itu
  rationale: Pronomina feminin menunjuk kembali kepada persembahan. Pengulangan nomina dalam bahasa Indonesia memperjelas anteseden tanpa mengubah rujukannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah “mahakudus” dipertahankan sebagai ungkapan kultis superlatif, sedangkan “boleh” menyampaikan izin yang diatur oleh hukum, bukan kewajiban universal.
