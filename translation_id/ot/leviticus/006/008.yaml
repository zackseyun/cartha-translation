reference: Leviticus 6:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: id
  text: Ia harus mengambil segenggam tepung halus dari persembahan sajian itu[a], serta sebagian minyaknya dan seluruh kemenyan yang ada di atas persembahan sajian itu. Lalu ia harus membakar bagian peringatannya[b] di atas mezbah sebagai aroma yang menyenangkan bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mengangkat darinya dengan genggamannya.” Gabungan kata kerja dan kata benda Ibrani menekankan pengambilan bagian tertentu sebanyak yang tergenggam.
    reason: lexical_alternative
  - marker: b
    text: “Bagian peringatan” menerjemahkan istilah khusus untuk bagian yang mewakili seluruh persembahan sajian dan dibakar di atas mezbah. Teks tidak menyatakan secara langsung siapa yang diingatkan atau apa yang diperingati.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: Ia harus mengambil dari persembahan itu segenggam
  rationale: Bentuk Hifil dari רום bersama בְּקֻמְצוֹ menyatakan pengambilan bagian tertentu sebanyak yang tergenggam. “Mengambil ... segenggam” alami dalam bahasa Indonesia dan tetap mempertahankan gagasan bagian yang diangkat atau dipisahkan.
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: tepung halus
  rationale: סֹלֶת adalah tepung halus sebagai bahan khusus persembahan sajian. Hubungannya dengan הַמִּנְחָה dibuat jelas melalui frasa “dari persembahan itu” dan penyebutan “persembahan sajian itu” kemudian dalam ayat.
- source_word: וּמִשַּׁמְנָהּ
  choice: dan sebagian minyaknya
  rationale: 'Preposisi מִן menyatakan makna partitif: yang diambil ialah sebagian dari minyak persembahan, bukan seluruh minyaknya.'
- source_word: וְאֵת כָּל הַלְּבֹנָה אֲשֶׁר עַל הַמִּנְחָה
  choice: beserta seluruh kemenyan yang ada di atas persembahan sajian itu
  rationale: לְבֹנָה menunjuk khusus pada kemenyan. Berbeda dengan tepung dan minyak yang hanya diambil sebagian, seluruh kemenyan disertakan.
- source_word: וְהִקְטִיר הַמִּזְבֵּחַ
  choice: Lalu ia harus membakar ... di atas mazbah
  rationale: Dalam konteks kurban, קטר bentuk Hifil berarti membakar di mazbah sebagai persembahan. “Mazbah” mempertahankan istilah khusus untuk tempat mempersembahkan kurban dan membedakannya dari mezbah bagi ilah lain tanpa menambah tafsiran pada tindakan tersebut.
- source_word: רֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Ungkapan kultis tetap menyatakan bahwa persembahan itu berkenan tanpa menggambarkan secara kasar kesenangan indrawi ilahi.
- source_word: אַזְכָּרָתָהּ
  choice: bagian peringatannya
  rationale: Istilah teknis ini menunjuk bagian representatif dari persembahan sajian yang dibakar di mazbah. Terjemahan mempertahankan unsur makna “mengingat/memperingati” tanpa menentukan secara eksplisit siapa yang mengingat atau apa yang diingat.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”; preposisi לְ dalam konstruksi ini menunjukkan bahwa aroma tersebut menyenangkan bagi-Nya.
theological_decisions:
- issue: Pengungkapan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri יהוה. “Yahweh” mempertahankan nama ilahi itu alih-alih menggantinya dengan gelar.
- issue: Makna רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan bagi Yahweh
  alternative: bau harum bagi Yahweh
  rationale: Pilihan ini menyampaikan keberkenanan ilahi dalam bahasa Indonesia modern tanpa menambahkan teori tertentu tentang cara kerja kurban.
- issue: Makna teknis אַזְכָּרָה
  choice: bagian peringatan
  alternative: bagian pengingat
  rationale: Kata ini berkaitan dengan akar זכר, tetapi fungsi dan arah tindakan mengingatnya tidak dijelaskan dalam ayat. Terjemahan dan catatan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibagi dua agar petunjuk ritual mudah diikuti. “Persembahan sajian” dipakai sebagai istilah kultis yang cukup transparan, sedangkan istilah teknis “bagian peringatan” dijelaskan melalui catatan kaki.
