translation:
  language: id
  text: Bejana tanah liat yang disentuh oleh orang yang mengalami keluarnya cairan dari tubuh[a] harus dipecahkan, dan setiap bejana kayu harus dibilas dengan air[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini adalah istilah teknis dalam hukum kenajisan untuk orang yang mengalami keluarnya cairan dari tubuh.
    reason: cultural_note
  - marker: b
    text: 'Atau: “harus dicuci dengan air.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: bejana tanah liat
  rationale: Gabungan כְלִי dan חֶרֶשׂ menunjuk pada wadah yang terbuat dari tembikar atau tanah liat; pilihan ini mempertahankan pembedaan bahan yang penting dalam hukum kenajisan.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: yang disentuh oleh
  rationale: נגע dalam bentuk Qal berarti 'menyentuh'. Susunan pasif dalam bahasa Indonesia menghasilkan ungkapan yang alami sambil mempertahankan pelaku dan objek sentuhan.
- source_word: הַזָּב
  choice: orang yang mengeluarkan lelehan
  rationale: Bentuk ini merupakan istilah teknis hukum kenajisan bagi orang yang mengalami lelehan tubuh. Terjemahan ini berfokus pada kondisi sebagaimana bentuk Ibraninya, tanpa mempersempitnya lebih jauh daripada ayat ini.
- source_word: יִשָּׁבֵר
  choice: harus dipecahkan
  rationale: Bentuk Niphal dalam konteks hukum menyatakan perintah pasif; 'harus dipecahkan' menyampaikan daya wajibnya secara wajar dalam bahasa Indonesia modern.
- source_word: כָל כְּלִי עֵץ
  choice: setiap bejana kayu
  rationale: Terjemahan ini ringkas, alami, dan mempertahankan kesejajaran dengan bejana tanah liat.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: harus dibilas dengan air
  rationale: שטף menyatakan pembilasan atau pencucian dengan air; 'dibilas' sesuai untuk bejana dan membedakannya dari istilah untuk mencuci pakaian.
theological_decisions:
- issue: Identitas הַזָּב dalam hukum kenajisan
  choice: orang yang mengeluarkan lelehan
  alternative: laki-laki yang mengeluarkan lelehan
  rationale: Konteks pasal ini berkaitan dengan lelehan pada laki-laki, tetapi bentuk dalam ayat ini sendiri menonjolkan orang berdasarkan kondisinya. Pilihan utama mempertahankan fokus leksikal tanpa menghapus konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersifat hukum tanpa terdengar kaku. 'Bejana tanah liat' dan 'bejana kayu' mempertahankan kesejajaran bahan; 'sedangkan' menandai perbedaan perlakuan terhadap kedua jenis bejana.
