  source_fidelity: 'Terjemahan menyampaikan dengan tepat urutan prosedural teks Ibrani: lelehan telah berhenti, perempuan itu menghitung tujuh hari untuk dirinya, lalu ia memperoleh status tahir. “Namun, jika” dapat mewakili fungsi kontrasif וְאִם dalam kaitannya dengan kasus sebelumnya. Penggunaan “lelehannya telah berhenti” merupakan pengungkapan kontekstual yang wajar bagi טָהֲרָה מִזּוֹבָהּ dan tidak mengacaukan tahap jasmani dengan status ritual akhir.'
