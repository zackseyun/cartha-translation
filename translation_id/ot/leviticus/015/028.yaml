  terminology: “Tahir” tepat untuk status ritual dan menghindari kesan bahwa ayat ini berbicara tentang kebersihan moral. Catatan kaki dengan benar mempertahankan keterkaitan leksikal antara dua penggunaan akar טהר, sambil mengakui bahwa pemakaian pertama diterjemahkan secara kontekstual.
