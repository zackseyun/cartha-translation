  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: id
  text: Namun, jika lelehannya telah berhenti[a], ia harus menghitung tujuh hari bagi dirinya sendiri; sesudah itu ia menjadi tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “jika ia menjadi tahir dari lelehannya.” Bahasa Ibrani memakai akar kata yang sama di sini dan pada akhir ayat: pertama untuk berakhirnya lelehan, kemudian untuk status tahir yang dihasilkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Penghubung dan partikel syarat memperkenalkan keadaan yang berlawanan dengan kasus sebelumnya; bentuk ini alami dalam bahasa Indonesia hukum-naratif.
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: lelehannya telah berhenti
  rationale: Dalam konteks ini bentuk טהר dengan מן menunjuk pada berakhirnya lelehan. Ungkapan ini menyampaikan peristiwa jasmani secara alami tanpa menyamakan tahap tersebut dengan status kenajisan ritual yang baru diperoleh setelah tujuh hari.
- source_word: וְסָפְרָה לָּהּ
  choice: ia harus menghitung ... bagi dirinya sendiri
  rationale: Rangkaian verbal menyatakan prosedur yang diwajibkan. Unsur לָּהּ dipertahankan sebagai 'bagi dirinya sendiri' karena masa penghitungan itu berlaku baginya.
- source_word: שִׁבְעַת יָמִים
  choice: tujuh hari
  rationale: Padanan langsung dan lazim untuk konstruksi bilangan dengan nomina.
- source_word: וְאַחַר
  choice: sesudah itu
  rationale: Menandai tahap berikutnya setelah genapnya penghitungan tujuh hari.
- source_word: תִּטְהָר
  choice: ia menjadi tahir
  rationale: Kata 'tahir' secara tepat menyatakan status ritual dalam konteks Imamat dan membedakannya dari kebersihan jasmani biasa.
theological_decisions:
- issue: Istilah ketahiran ritual
  choice: Menggunakan 'tahir' untuk status ritual akhir, bukan bahasa tentang kesucian moral.
  alternative: bersih / disucikan
  rationale: Perikop ini mengatur status ritual akibat lelehan tubuh, bukan menyatakan kesalahan atau kenajisan moral.
- issue: Dua pemakaian akar טהר dalam satu ayat
  choice: Menerjemahkan yang pertama secara kontekstual sebagai berhentinya lelehan dan yang kedua sebagai menjadi tahir.
  alternative: Jika ia menjadi tahir dari lelehannya ... sesudah itu ia menjadi tahir.
  rationale: 'Pembedaan ini menghasilkan bahasa Indonesia yang alami sekaligus menjaga urutan teks: lelehan berhenti, tujuh hari dihitung, lalu status tahir diperoleh. Catatan kaki mempertahankan hubungan leksikal kedua bentuk Ibrani.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Lelehan' mengikuti istilah konteks hukum ketahiran tubuh, sedangkan 'tahir' dipertahankan sebagai istilah ritual yang mudah dikenali. Tanda titik koma memperjelas urutan prosedural.
