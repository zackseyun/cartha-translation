  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: id
  text: Setiap orang yang menyentuh apa pun yang pernah berada di bawah orang itu akan menjadi najis sampai petang.[a] Siapa pun yang membawa benda-benda itu[b] harus mencuci pakaiannya dan membasuh tubuhnya dengan air, dan ia akan menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “apa pun yang berada di bawahnya.” Bentuk Ibrani dapat dipahami sebagai keadaan kini, tetapi makna lampau sesuai dengan konteks prosedural tentang benda yang sebelumnya berada di bawah orang yang mengalami lelehan.'
    reason: lexical_alternative
  - marker: b
    text: Kata ganti jamak “benda-benda itu” merujuk secara kolektif pada benda-benda tercemar yang berkaitan dengan apa yang berada di bawah orang tersebut.
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: orang yang menyentuh
  rationale: Partisipel נגע menyatakan sentuhan atau kontak fisik; bentuk ini alami dalam ketentuan umum.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: apa pun yang pernah berada di bawah orang itu
  rationale: Frasa ini menunjuk pada benda yang sebelumnya berada di bawah orang yang mengalami lelehan. Kata 'pernah' menyampaikan arti prosedural lampau tanpa menghilangkan nuansa bentuk Ibrani yang secara harfiah dapat dipahami sebagai keadaan kini.
- source_word: יִטְמָא
  choice: akan menjadi najis
  rationale: Dalam hukum kenajisan, טמא menunjukkan keadaan najis atau masuknya seseorang ke dalam keadaan itu. 'Akan menjadi najis' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Ungkapan ini tepat dan ringkas untuk batas waktu ritual yang dinyatakan teks.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: siapa pun yang mengangkat benda-benda itu
  rationale: נשא dapat berarti mengangkat atau membawa. Dalam konteks pemindahan benda tercemar, 'mengangkat' membedakannya dari sekadar menyentuh, sementara pronomina jamak dijelaskan sebagai rujukan kolektif pada benda-benda terkait.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Dalam register hukum, 'harus' menyampaikan daya wajib bentuk verbal; 'pakaian' merupakan padanan modern dan jelas bagi בגדים.
- source_word: וְרָחַץ בַּמַּיִם
  choice: dan membasuh tubuhnya dengan air
  rationale: רחץ dalam rumus pentahiran ini mengacu pada pembasuhan diri atau tubuh. Objek 'tubuhnya' dibuat eksplisit secara idiomatis agar tidak disalahpahami sebagai pembasuhan pakaian kedua kali.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: dan ia akan menjadi najis sampai petang
  rationale: Klausa penutup mempertahankan keadaan kenajisan hingga petang, sekalipun tindakan pembasuhan telah dilakukan.
theological_decisions:
- issue: Hubungan pembasuhan dengan berakhirnya kenajisan
  choice: Tetap menyatakan bahwa orang itu najis sampai petang setelah mencuci dan membasuh diri
  alternative: Mengisyaratkan bahwa pembasuhan langsung menyucikannya
  rationale: Urutan Ibrani secara tegas menempatkan pembasuhan sebelum pernyataan bahwa kenajisan berlangsung sampai petang; terjemahan tidak boleh menghapus ketegangan ritual ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual 'najis' dipertahankan karena tepat dalam konteks Imamat. Struktur hukum dibuat jelas tanpa memakai gaya yang terlalu arkais; 'orang itu' dipakai untuk memperjelas anteseden pronomina maskulin.
