base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: id
  text: Setiap orang yang duduk di atas benda[a] yang diduduki oleh laki-laki yang mengalami lelehan itu harus mencuci pakaiannya dan membasuh tubuhnya dengan air; ia menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “benda” dapat juga berarti “wadah”, “perkakas”, atau “barang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: Siapa pun yang duduk
  rationale: Partisip substantival ini secara harfiah berarti 'dan orang yang duduk'. Bentuk 'siapa pun yang duduk' alami dalam ketentuan hukum dan mempertahankan makna generiknya.
- source_word: הַכְּלִי
  choice: benda
  rationale: כְּלִי dapat menunjuk pada benda, perkakas, wadah, atau perlengkapan. Dalam konteks sesuatu yang diduduki, 'benda' mempertahankan cakupan luas tanpa menyiratkan bahwa yang dimaksud pasti sebuah wadah.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: yang pernah diduduki
  rationale: Klausa relatif ini mengenali benda melalui kontak sebelumnya. 'Pernah diduduki' menyampaikan secara alami bahwa orang yang mengalami lelehan itu sebelumnya duduk di atas benda tersebut.
- source_word: הַזָּב
  choice: orang yang mengalami lelehan itu
  rationale: Partisip substantival ini menunjuk pada laki-laki yang mengalami lelehan tubuh dalam konteks Imamat 15:2–15. Kata 'orang' tetap alami dalam bahasa Indonesia, sedangkan konteks langsung mempertahankan rujukan laki-lakinya tanpa menambahkan jenis lelehan yang tidak dinyatakan dalam ayat ini.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: כִּבֵּס lazim dipakai untuk mencuci pakaian. 'Harus' menyampaikan daya wajib dari ketentuan hukum dalam bahasa Indonesia modern.
- source_word: וְרָחַץ בַּמַּיִם
  choice: dan membasuh tubuhnya dengan air
  rationale: רָחַץ dalam konteks kenajisan menunjuk pada pembasuhan badan. Penambahan objek tersirat 'tubuhnya' memperjelas perbedaannya dari pencucian pakaian dan tetap setia pada tindakan yang dimaksud.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: ia menjadi najis sampai petang
  rationale: Ungkapan ini menyatakan status kenajisan yang timbul akibat kontak dan batas waktunya. 'Najis' adalah istilah baku dalam konteks hukum tahir-najis, sedangkan 'sampai petang' mempertahankan batas temporal teks.
theological_decisions:
- issue: Sifat kenajisan
  choice: Menerjemahkan טָמֵא sebagai 'najis' tanpa menambahkan kesalahan moral
  alternative: '''najis secara ritual'' atau ''tercemar'''
  rationale: Konteksnya adalah hukum tahir-najis, bukan pernyataan bahwa orang itu melakukan dosa moral. 'Najis' mempertahankan istilah hukum secara ringkas; 'secara ritual' bersifat menjelaskan, sedangkan 'tercemar' dapat memberi kesan moral atau fisik yang berlebihan.
- issue: Rujukan gender הַזָּב dan pronomina berikutnya
  choice: Rujukan kepada laki-laki dipertahankan melalui konteks bagian ini, sementara bahasa Indonesia memakai 'orang' dan 'ia' secara alami
  alternative: Menambahkan 'laki-laki yang mengalami lelehan itu'
  rationale: Bagian Imamat 15:2–15 secara khusus membahas laki-laki, tetapi bahasa Indonesia tidak menandai gender pada 'orang' dan 'ia'. Terjemahan ini tidak menetralkan konteks, sekaligus tidak mengulang informasi gender yang sudah jelas dari perikop.
translation_notes:
  register: Bahasa hukum-keagamaan yang modern, lugas, dan bermartabat. 'Harus' dipakai untuk kewajiban; 'najis' dan 'petang' mempertahankan register Alkitabiah yang tetap mudah dipahami. Penanda catatan kaki [a] ditempatkan setelah frasa pembasuhan sesuai format yang diberikan, meskipun isi catatan menjelaskan kata 'benda' sebelumnya.
