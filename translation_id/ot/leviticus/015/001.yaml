  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: id
  text: 'Kemudian Yahweh[a] berfirman kepada Musa dan kepada Harun:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Memberi tahu pembaca mengenai bentuk Ibrani dan padanan tradisional nama ilahi.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur wacana. “Kemudian” menyatakan urutan secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang lazim dan bermartabat untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kepada Musa dan kepada Harun
  rationale: Pengulangan preposisi אֶל dipertahankan untuk mencerminkan bahwa firman itu ditujukan secara eksplisit kepada keduanya.
- source_word: לֵאמֹר
  choice: '[ditandai oleh koma dan dilanjutkan dalam ayat berikut]'
  rationale: Rumus pengantar ujaran langsung ini secara harfiah berarti “dengan berkata”. Dalam bahasa Indonesia, setelah verba “berfirman”, fungsi tersebut paling alami dinyatakan dengan tanda koma karena isi firman menyusul pada ayat berikutnya; menerjemahkannya lagi sebagai “demikian” atau “kata-Nya” akan terasa berulang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berfirman” dipilih karena subjeknya Allah. Struktur “kepada Musa dan kepada Harun” mempertahankan pengulangan dalam bahasa Ibrani. Penanda catatan kaki [a] ditempatkan sesudah “Harun” agar tidak memutus nama “Yahweh”, selaras dengan data konsultasi yang diberikan.
