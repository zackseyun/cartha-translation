  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: id
  text: Pada hari kedelapan, ia harus mengambil bagi dirinya dua ekor burung tekukur atau dua ekor anak burung merpati, lalu membawa kedua burung itu kepada imam, ke pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַש׼ְּמִינִי
  choice: Pada hari kedelapan
  rationale: Ungkapan waktu ini diterjemahkan secara alami dalam bahasa Indonesia; waw penghubung tidak perlu dinyatakan karena ayat tetap jelas sebagai kelanjutan ketentuan sebelumnya.
- source_word: תִּקַּח לָהּ
  choice: ia harus mengambil bagi dirinya
  rationale: Bentuk imperfek dalam konteks hukum menyatakan kewajiban, sedangkan לָהּ dipertahankan sebagai unsur benefaktif/refleksif melalui frasa 'bagi dirinya'.
- source_word: שְׁתֵּי תֹרִים
  choice: dua ekor burung tekukur
  rationale: תֹרִים menunjuk pada burung tekukur; kata penggolong 'ekor' menghasilkan bahasa Indonesia yang wajar.
- source_word: אוֹ
  choice: atau
  rationale: Kata penghubung ini menyatakan pilihan alternatif yang diperbolehkan.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dua ekor anak merpati
  rationale: Ungkapan konstruksi harfiah 'anak-anak merpati' secara idiomatis menunjuk pada merpati muda; 'anak merpati' mempertahankan gambaran usia dalam sumber.
- source_word: וְהֵבִיאָה אֹתָם
  choice: lalu membawanya
  rationale: Dalam rangkaian ketentuan hukum, bentuk verba ini melanjutkan kewajiban sebelumnya. 'Lalu' menandai urutan, dan pronomina '-nya' merujuk pada kedua ekor burung sebagai satu kelompok benda.
- source_word: אֶל הַכֹּהֵן
  choice: kepada imam
  rationale: Preposisi menunjukkan arah kepada pejabat ritual; dalam bahasa Indonesia, jabatan yang sudah tertentu oleh konteks dapat dinyatakan secara alami tanpa kata sandang.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ke pintu masuk Kemah Pertemuan
  rationale: Pengulangan אֶל dipertahankan dengan 'ke', dan פֶּתַח diterjemahkan 'pintu masuk'. Nama tempat ritual אֹהֶל מוֹעֵד diterjemahkan dengan istilah mapan 'Kemah Pertemuan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur hukum dipertahankan tanpa kekakuan yang tidak perlu; pengulangan preposisi sumber tetap terlihat dalam frasa 'kepada imam, ke pintu masuk Kemah Pertemuan'.
