  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/דָּוָה֙ בְּ/נִדָּתָ֔/הּ וְ/הַ/זָּב֙ אֶת זוֹב֔/וֹ לַ/זָּכָ֖ר וְ/לַ/נְּקֵבָ֑ה וּ/לְ/אִ֕ישׁ אֲשֶׁ֥ר יִשְׁכַּ֖ב עִם טְמֵאָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: id
  text: juga tentang perempuan yang sakit dalam kenajisannya karena haid[a], tentang orang yang mengeluarkan cairan tubuh, baik laki-laki maupun perempuan, dan tentang laki-laki yang tidur dengan perempuan yang najis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perempuan yang sedang haid”; kata Ibrani yang diterjemahkan “perempuan yang sakit” di sini menunjuk kepada perempuan dalam keadaan haid.
    reason: lexical_alternative
  - marker: b
    text: “Najis” dalam ayat ini berarti najis secara ritual menurut hukum Imamat, bukan najis secara moral.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: perempuan yang sakit dalam kenajisannya karena haid
  rationale: Terjemahan ini mempertahankan nuansa dasar הַדָּוָה sebagai keadaan sakit atau tidak sehat, sementara בְּנִדָּתָהּ menjelaskan bahwa keadaan yang dimaksud berkaitan dengan kenajisan ritual karena haid. Catatan kaki memberi alternatif yang lebih ringkas.
- source_word: הַזָּב אֶת זוֹבוֹ
  choice: orang yang mengeluarkan lelehan
  rationale: Frasa Ibrani memakai bentuk maskulin sebagai label kategori, tetapi kelanjutannya secara tegas mencakup laki-laki dan perempuan. 'Lelehan' mempertahankan istilah umum untuk cairan tubuh yang keluar tanpa membatasi jenisnya.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: baik laki-laki maupun perempuan
  rationale: Ungkapan ini secara alami menyatakan cakupan distributif dari ketentuan mengenai lelehan.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: yang tidur dengan
  rationale: Ungkapan ini mempertahankan eufemisme seksual dalam bahasa Ibrani dan tetap dapat dipahami secara wajar dalam konteks pasal ini.
- source_word: טְמֵאָה
  choice: perempuan yang najis
  rationale: Kata sifat feminin ini menunjuk kepada perempuan dalam keadaan najis secara ritual menurut hukum Imamat, bukan kepada rendahnya nilai moral orang tersebut.
theological_decisions:
- issue: Istilah kenajisan ritual
  choice: Menggunakan 'kenajisan' dan 'najis' sebagai kategori ritual dalam hukum Imamat.
  alternative: Menggunakan istilah yang menyiratkan kekotoran fisik atau keburukan moral.
  rationale: נִדָּה dan טְמֵאָה dalam konteks ini menunjuk kepada status ritual. Terjemahan tidak boleh mengubahnya menjadi penilaian moral terhadap perempuan atau orang yang mengalami lelehan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'juga tentang' mempertahankan fungsi ayat ini sebagai kelanjutan daftar penutup dari ayat sebelumnya. Istilah 'tidur dengan' mempertahankan eufemisme sumber, sedangkan catatan kaki menjernihkan sifat ritual dari istilah 'najis'.
