  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: id
  text: Setiap tempat tidur yang dipakainya untuk berbaring selama seluruh masa lelehan tubuhnya akan menjadi baginya seperti tempat tidur pada masa haidnya[a]. Setiap benda yang didudukinya akan menjadi najis[b], seperti kenajisan pada masa haidnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti tempat tidur dalam keadaan najis karena haidnya.” Istilah Ibrani נִדָּה dapat menunjuk pada masa haid beserta status kenajisan ritual dan pemisahan yang menyertainya.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “benda” mencakup berbagai benda, perkakas, atau perabot yang dapat diduduki, bukan hanya wadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: tempat tidur
  rationale: Kata ini menunjuk pada tempat untuk berbaring; “tempat tidur” alami dalam bahasa Indonesia dan sesuai dengan konteks hukum kenajisan.
- source_word: תִּשְׁכַּב עָלָיו
  choice: yang ditidurinya
  rationale: Mengungkapkan tindakan berbaring di atas sesuatu secara ringkas dan alami.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: selama ia mengalami lelehan itu
  rationale: זוֹב menunjuk pada lelehan tubuh yang dibahas dalam konteks ini. Bentuk ini jelas tanpa menambahkan penilaian moral.
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  choice: seperti tempat tidur pada masa haidnya
  rationale: נִדָּה di sini mengacu pada keadaan menstruasi beserta status ritualnya; “masa haid” konkret dan mudah dipahami.
- source_word: יִהְיֶה לָּהּ
  choice: akan menjadi baginya
  rationale: Mempertahankan konstruksi status relatif terhadap perempuan itu tanpa menjelaskannya secara berlebihan.
- source_word: כְּלִי
  choice: barang
  rationale: כְּלִי merupakan istilah luas bagi benda, perkakas, atau perabot. “Barang” tidak membatasinya hanya pada wadah.
- source_word: תֵּשֵׁב עָלָיו
  choice: yang didudukinya
  rationale: Padanan Indonesia yang alami untuk benda yang ia duduki.
- source_word: טָמֵא
  choice: najis
  rationale: Dalam hukum kemurnian Imamat, “najis” adalah istilah Indonesia yang lazim untuk status ritual, bukan kesalahan moral.
- source_word: כְּטֻמְאַת נִדָּתָהּ
  choice: seperti kenajisan pada masa haidnya
  rationale: “Kenajisan” mempertahankan kaitan leksikal dengan “najis,” sedangkan “masa haidnya” memperjelas keadaan yang dibandingkan.
theological_decisions:
- issue: Sifat kenajisan dalam hukum Imamat
  choice: Menerjemahkan טָמֵא / טֻמְאָה sebagai “najis/kenajisan” dalam arti status ritual.
  alternative: cemar/kecemaran; tidak murni/ketidakmurnian
  rationale: Ayat ini membicarakan status ritual dalam sistem kemurnian Israel, bukan dosa atau kesalahan moral pribadi.
- issue: Makna נִדָּה
  choice: Menerjemahkannya secara konkret sebagai “masa haid” dalam teks utama.
  alternative: keadaan najis karena haid; masa pemisahan menstruasi
  rationale: Konteks menunjuk pada keadaan menstruasi, tetapi istilah Ibrani juga dapat mencakup status ritual dan pemisahan yang menyertainya; nuansa itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang tetap bermartabat. “Lelehan” mengikuti istilah tubuh dalam konteks pasal ini; “najis/kenajisan” dipakai secara konsisten untuk status ritual. Semua penanda catatan kaki muncul dalam teks utama.
