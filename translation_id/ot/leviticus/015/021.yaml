  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: id
  text: Setiap orang yang menyentuh tempat tidurnya[a] harus mencuci pakaiannya dan membasuh diri dengan air. Ia menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat ia berbaring” atau “alas tidurnya.” Istilah Ibrani ini menunjuk pada tempat ia berbaring.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Setiap orang yang menyentuh
  rationale: Bentuk partisip dengan כָּל menyatakan ketentuan umum bagi siapa pun yang menyentuh; susunan ini alami dalam bahasa Indonesia dan mempertahankan cakupan universal.
- source_word: בְּמִשְׁכָּבָהּ
  choice: tempat tidurnya
  rationale: מִשְׁכָּב menunjuk pada tempat seseorang berbaring. 'Tempat tidur' konkret dan mudah dipahami, sementara catatan kaki mempertahankan kemungkinan nuansa 'tempat berbaring' atau 'alas tidur'.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: כִּבֵּס secara khusus berarti mencuci pakaian. 'Harus' menyampaikan daya wajib dari ketentuan hukum ini secara alami dalam bahasa Indonesia modern.
- source_word: וְרָחַץ בַּמַּיִם
  choice: dan membasuh tubuhnya dengan air
  rationale: רָחַץ di sini mengacu pada pembasuhan badan, dibedakan dari pencucian pakaian sebelumnya. Objek 'tubuhnya' dibuat eksplisit agar maknanya jelas dalam bahasa Indonesia.
- source_word: וְטָמֵא
  choice: Ia menjadi najis
  rationale: טָמֵא menyatakan status kenajisan ritual. 'Menjadi najis' mempertahankan kategori hukum ritual tanpa menyiratkan kesalahan moral.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Frasa ini menetapkan batas waktu status najis; 'sampai petang' ringkas, alami, dan setia pada teks.
theological_decisions:
- issue: Sifat kenajisan
  choice: najis sebagai status ritual
  alternative: cemar atau bersalah secara moral
  rationale: Konteks Imamat 15 adalah hukum kemurnian ritual. Terjemahan tidak menyamakan status ini dengan dosa atau kesalahan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Harus' dipakai untuk daya hukum yang jelas; 'membasuh tubuhnya' membedakan pembasuhan badan dari pencucian pakaian. Penanda catatan kaki [a] ditempatkan langsung setelah frasa terkait.
