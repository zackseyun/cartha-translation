base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: id
  text: Jika seorang laki-laki bersetubuh dengannya[a], dan kenajisan haidnya menimpa laki-laki itu, ia menjadi najis selama tujuh hari. Setiap tempat tidur yang ditiduri laki-laki itu menjadi najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika seorang laki-laki sungguh berbaring dengannya.” Ungkapan Ibrani ini adalah idiom untuk hubungan seksual; pengulangan bentuk verba menegaskan tindakan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: benar-benar tidur dengannya
  rationale: Gabungan infinitif absolut dan bentuk verba berhingga memberi penegasan. Ungkapan “benar-benar tidur dengannya” mempertahankan penekanan dan idiom Ibrani, sedangkan catatan kaki menjelaskan makna seksualnya.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina ini berbentuk tunggal maskulin dan dalam konteks merujuk kepada laki-laki dewasa.
- source_word: נִדָּתָהּ
  choice: kenajisan haid perempuan itu
  rationale: Dalam hukum kemurnian Imamat, kata ini menunjuk pada keadaan najis secara ritual yang berkaitan dengan haid, bukan sekadar peristiwa biologisnya. Penyebutan “perempuan itu” memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: וּתְהִי ... עָלָיו
  choice: menimpa dia
  rationale: Secara harfiah berarti “ada/menjadi di atasnya.” “Menimpa dia” mempertahankan gambaran sumber dan menyampaikan bahwa keadaan najis itu kini berlaku atas laki-laki tersebut.
- source_word: וְטָמֵא
  choice: menjadi najis
  rationale: Dalam kalimat syarat hukum ini, bentuk tersebut menyatakan akibat. “Menjadi najis” terdengar alami dalam bahasa Indonesia dan tidak mengesankan kesalahan moral.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Ungkapan waktu diterjemahkan langsung dan alami.
- source_word: הַמִּשְׁכָּב
  choice: tempat tidur
  rationale: Nomina ini berarti tempat untuk berbaring; “tempat tidur” merupakan padanan umum yang sesuai dengan konteks.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: yang ditidurinya
  rationale: Bentuk ini menyampaikan secara ringkas dan alami bahwa laki-laki tersebut berbaring atau tidur di atas tempat itu.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: Bentuk imperfek dalam konteks hukum menyatakan akibat; pilihan ini konsisten dengan klausa sebelumnya.
theological_decisions:
- issue: Bahasa kenajisan ritual tidak boleh disamakan dengan kesalahan moral
  choice: Menggunakan “najis” dan “kenajisan haid” sebagai istilah kemurnian ritual
  alternative: Menggunakan istilah seperti “tercemar” atau bahasa yang menyiratkan dosa moral
  rationale: Imamat 15 membahas status kemurnian ritual. Ayat ini tidak dengan sendirinya menyatakan kesalahan moral, sehingga terjemahan tidak menambahkan penilaian tersebut.
- issue: Ungkapan hubungan seksual dan penegasan verba Ibrani
  choice: Mempertahankan idiom “benar-benar tidur dengannya” dan menjelaskan maknanya dalam catatan kaki
  alternative: Langsung menerjemahkan “bersetubuh dengannya” dalam teks utama
  rationale: Pilihan utama mempertahankan bentuk halus serta penekanan dalam bahasa Ibrani, sementara catatan kaki memastikan maknanya tidak kabur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum, dengan pengulangan “laki-laki itu” untuk menghindari kerancuan rujukan. Istilah “najis” dipakai secara konsisten dalam arti ritual.
