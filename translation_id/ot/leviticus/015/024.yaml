  naturalness: “Kenajisan haid perempuan itu” dan “tempat tidur yang ditidurinya” dapat dipahami, tetapi “kenajisan haidnya menimpa laki-laki itu” serta “yang ditiduri laki-laki itu” lebih jelas dan alami dalam kalimat hukum yang panjang. “Bersetubuh” adalah istilah baku, netral, dan cukup langsung untuk konteks hukum ini.
  terminology: “Najis” dan “kenajisan haid” tepat untuk status kemurnian ritual dan tidak perlu dipahami sebagai penghakiman moral. “Bersetubuh” secara akurat menerjemahkan idiom שָׁכֹב יִשְׁכַּב dalam konteks ini. Catatan kaki mempertahankan bentuk idiomatik Ibrani dan penegasannya tanpa membuat teks utama kabur.
