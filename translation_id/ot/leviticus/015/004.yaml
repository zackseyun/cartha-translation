  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: id
  text: Setiap tempat tidur yang ditiduri oleh laki-laki yang mengalami lelehan itu akan menjadi najis, dan setiap benda[a] yang didudukinya akan menjadi najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap barang yang didudukinya.” Kata Ibrani ini dapat merujuk secara luas kepada barang, perkakas, atau wadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: tempat tidur
  rationale: מִשְׁכָּב menunjuk pada tempat untuk berbaring; “tempat tidur” alami dalam bahasa Indonesia dan tetap sesuai dengan konteks kenajisan ritual.
- source_word: הַזָּב
  choice: laki-laki yang mengeluarkan lelehan itu
  rationale: Partisip substantival זָב dalam konteks ini merujuk pada laki-laki yang mengalami lelehan tubuh. Pilihan ini mempertahankan rujukan maskulin dan kaitannya dengan uraian pada ayat-ayat sebelumnya.
- source_word: יִשְׁכַּב עָלָיו
  choice: yang ditiduri
  rationale: Bentuk pasif relatif ini menghasilkan ungkapan Indonesia yang wajar untuk ‘yang di atasnya ia berbaring’ tanpa mengubah hubungan maknanya.
- source_word: יִטְמָא
  choice: akan menjadi najis
  rationale: Qal יִטְמָא menyatakan akibat status kenajisan. “Akan menjadi najis” lebih tepat menyampaikan konsekuensi yang timbul daripada sekadar keadaan statis.
- source_word: הַכְּלִי
  choice: benda
  rationale: 'כְּלִי memiliki cakupan luas: barang, perkakas, wadah, atau benda. Karena sesuatu yang dapat diduduki dimaksudkan di sini, “benda” lebih alami dan tidak mempersempit makna menjadi wadah.'
- source_word: יֵשֵׁב עָלָיו
  choice: yang didudukinya
  rationale: Ungkapan ini secara ringkas dan alami menyampaikan ‘yang di atasnya ia duduk’ dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat kenajisan
  choice: najis tanpa penambahan penjelas
  alternative: najis secara ritual; tercemar
  rationale: Konteks Imamat menunjukkan status kenajisan ritual, tetapi teks Ibrani hanya memakai akar טמא. “Najis” mempertahankan kategori itu tanpa menambahkan keterangan interpretatif atau memberi kesan kesalahan moral.
- issue: Gender subjek
  choice: laki-laki yang mengeluarkan lelehan itu
  alternative: orang yang mengeluarkan lelehan itu
  rationale: Bentuk Ibrani bersifat maskulin tunggal, dan konteks langsung secara khusus membahas lelehan dari tubuh laki-laki. Rujukan maskulin karena itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel Ibrani dipertahankan, sementara klausa relatif dibuat idiomatis. “Lelehan” dipakai sesuai konteks bagian ini dan tidak diperluas dengan diagnosis medis yang tidak dinyatakan teks.
