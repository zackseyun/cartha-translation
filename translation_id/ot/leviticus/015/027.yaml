  source_fidelity: Teks Indonesia dengan setia menyampaikan cakupan universal, tindakan menyentuh, acuan jamak yang sengaja tidak dirinci secara berlebihan, akibat kenajisan ritual, pencucian pakaian, pembasuhan tubuh dengan air, dan batas waktu sampai petang. "Benda-benda itu" secara wajar menerangkan pronomina Ibrani בָּם berdasarkan konteks dekat tanpa membatasi acuannya hanya pada satu jenis benda.
  naturalness: Bahasanya baku, jelas, dan cocok dengan register hukum naratif Alkitab. "Membasuh tubuhnya" membedakan tindakan ini dari mencuci pakaian, sedangkan "tetap najis sampai petang" menyampaikan kelanjutan status tersebut secara idiomatis.
  terminology: '"Najis" dipakai secara konsisten untuk טמא dalam konteks kenajisan ritual dan tidak mengubahnya menjadi kategori kesalahan moral. Istilah "petang" serta "mencuci pakaiannya" juga tepat dan alami. Catatan kaki menjelaskan anteceden tanpa memasukkan rincian itu ke dalam teks utama.'
