  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: id
  text: Setiap orang yang menyentuh benda-benda itu menjadi najis[a]. Ia harus mencuci pakaiannya dan membasuh tubuhnya dengan air, dan ia tetap najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, benda-benda yang berkaitan dengan kenajisan perempuan itu dalam konteks sebelumnya, seperti apa yang ditiduri atau didudukinya.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: Setiap orang yang menyentuh
  rationale: Gabungan כָּל dengan partisipel נֹגֵעַ menyatakan siapa saja tanpa kecuali; bentuk ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: בָּם
  choice: benda-benda itu
  rationale: Pronomina maskulin jamak ini merujuk pada hal-hal yang berkaitan dengan kenajisan perempuan dalam konteks sebelumnya. 'Benda-benda itu' memperjelas bahwa acuannya bukan orang, tanpa merinci lebih jauh di dalam teks utama.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: Kata טמא di sini menunjuk pada status kenajisan ritual, bukan kesalahan moral. Bentuk verba 'menjadi najis' juga mencerminkan akibat dari sentuhan.
- source_word: וְ/כִבֶּס בְּגָדָיו
  choice: Ia harus mencuci pakaiannya
  rationale: כִּבֶּס dalam konteks ini berarti mencuci pakaian; 'pakaiannya' merupakan padanan modern dan wajar untuk בְּגָדָיו.
- source_word: וְ/רָחַץ בַּמַּיִם
  choice: dan membasuh tubuhnya dengan air
  rationale: רחץ dalam ketentuan pentahiran ini mengacu pada pembasuhan badan. Penambahan 'tubuhnya' menyatakan objek implisit secara alami dan membedakannya dari pencucian pakaian.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: dan ia tetap najis sampai petang
  rationale: Klausa ini menyatakan bahwa status najis berlangsung hingga petang; 'tetap' membuat fungsi duratifnya jelas tanpa mengubah makna.
theological_decisions:
- issue: Sifat kenajisan dalam hukum Imamat
  choice: Menerjemahkan טמא sebagai 'najis' dalam arti status ritual.
  alternative: cemar
  rationale: Konteks membahas ketahiran ritual. 'Najis' mempertahankan kategori hukum ibadah tersebut dan tidak menyiratkan bahwa sentuhan itu dengan sendirinya merupakan dosa moral.
- issue: Acuan pronomina בָּם
  choice: Mempertahankan acuan umum sebagai 'benda-benda itu' dan menjelaskannya melalui catatan kaki.
  alternative: Menyebut secara eksplisit 'tempat tidur atau tempat duduk itu' dalam teks utama.
  rationale: Bahasa Ibrani hanya memakai pronomina jamak. Merinci acuannya dalam teks utama akan menutup keluasan acuan yang tetap bergantung pada konteks sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. 'Membasuh tubuhnya' dipilih agar pembasuhan badan jelas dibedakan dari pencucian pakaian; 'petang' mempertahankan register Alkitabiah yang tetap mudah dipahami.
