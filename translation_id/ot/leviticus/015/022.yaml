  text: וְ/כָל הַ/נֹּגֵ֔עַ בְּ/כָל כְּלִ֖י אֲשֶׁר תֵּשֵׁ֣ב עָלָ֑י/ו יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: id
  text: Setiap orang yang menyentuh benda apa pun[a] yang diduduki perempuan itu harus mencuci pakaiannya dan membasuh dirinya dengan air; ia akan menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkakas”, “wadah”, atau “barang”. Kata Ibrani keli adalah istilah luas untuk suatu benda atau perkakas.
    reason: Menjelaskan keluasan leksikal כְּלִי tanpa mempersempit maknanya dalam teks utama.
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Setiap orang yang menyentuh
  rationale: Konstruksi ini menunjuk secara umum dan menyeluruh kepada siapa saja yang menyentuh; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: בְּכָל כְּלִי
  choice: benda apa pun
  rationale: כְּלִי merupakan istilah luas untuk benda, perkakas, wadah, atau barang. Dalam konteks sesuatu yang diduduki, 'benda' mempertahankan keluasan maknanya tanpa mempersempitnya menjadi 'wadah'.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: yang diduduki perempuan itu
  rationale: Bentuk imperfek Ibrani berada dalam konteks ketentuan umum. Bentuk pasif Indonesia ringkas dan jelas, sedangkan 'perempuan itu' menjelaskan subjek feminin yang berasal dari konteks sebelumnya.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: '''Harus'' menyampaikan daya wajib dalam ketentuan hukum, dan ''mencuci pakaiannya'' secara tepat merujuk pada pencucian pakaian.'
- source_word: וְרָחַץ בַּמַּיִם
  choice: dan membasuh tubuhnya dengan air
  rationale: Dalam hukum kenajisan, רָחַץ menunjuk pada pembasuhan badan. Penyebutan 'tubuhnya' membuat objek yang tersirat jelas dan mencegahnya dipahami sebagai pencucian barang.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: dan ia menjadi najis sampai petang
  rationale: '''Najis'' mempertahankan kategori ritual dalam Imamat, bukan kesalahan moral; ''sampai petang'' menyatakan batas waktunya secara alami.'
theological_decisions:
- issue: Sifat kenajisan dalam hukum kemurnian Imamat
  choice: Menerjemahkan טָמֵא sebagai 'najis' dalam arti status ritual.
  alternative: '''tercemar'' atau ''tidak tahir'''
  rationale: Ayat ini membahas status ritual akibat sentuhan, bukan dosa atau kesalahan moral. 'Najis' merupakan istilah ringkas dan lazim dalam konteks hukum Imamat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan corak ketentuan hukum, tetapi menghindari ungkapan yang kaku. Tidak diperlukan catatan kaki karena keluasan כְּלִי sudah dapat diwakili secara wajar oleh 'benda apa pun'.
