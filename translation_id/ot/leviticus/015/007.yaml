  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: id
  text: Siapa pun yang menyentuh tubuh[a] laki-laki yang mengalami lelehan harus mencuci pakaiannya dan membasuh dirinya dengan air; ia najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "daging" laki-laki yang mengalami lelehan.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: Siapa pun yang menyentuh
  rationale: Partisipel berartikel berfungsi secara substantival dan umum; bentuk ini menyampaikan daya hukum umum dengan bahasa Indonesia yang alami.
- source_word: בִּבְשַׂר
  choice: tubuh
  rationale: בָּשָׂר secara harfiah berarti 'daging', tetapi dalam konteks sentuhan terhadap seseorang menunjuk pada tubuh jasmaninya. 'Tubuh' menghindari kesan bahwa yang dimaksud hanya jaringan daging dan lebih wajar dalam bahasa Indonesia.
- source_word: הַזָּב
  choice: orang yang mengeluarkan lelehan itu
  rationale: Partisipel maskulin dari זוּב menunjuk kepada orang yang mengalami lelehan tubuh dalam konteks ini. 'Orang' mempertahankan acuannya tanpa menambahkan kata 'laki-laki' yang tidak harus ditekankan dalam ayat ini.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Bentuk yiqtol dalam hukum ini menyatakan kewajiban. 'Pakaian' merupakan padanan modern yang alami bagi בְּגָדִים.
- source_word: וְרָחַץ בַּמַּיִם
  choice: dan membasuh dirinya dengan air
  rationale: רָחַץ di sini berarti membersihkan tubuh dengan air. Unsur refleksif dinyatakan agar sasaran pembasuhan jelas dalam bahasa Indonesia.
- source_word: וְטָמֵא
  choice: lalu ia menjadi najis
  rationale: Dalam urutan hukum ini, kenajisan merupakan keadaan yang timbul akibat sentuhan dan berlangsung sampai petang; 'menjadi najis' menyatakannya secara jelas tanpa menyiratkan kesalahan moral.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: '''Petang'' adalah padanan ringkas dan bermartabat bagi הָעָרֶב serta menandai batas waktu keadaan najis.'
theological_decisions:
- issue: Sifat kenajisan
  choice: najis
  alternative: cemar; tidak tahir
  rationale: טָמֵא dalam Imamat 15 menunjuk pada status kenajisan ritual, bukan kesalahan moral. 'Najis' mempertahankan istilah baku dalam konteks hukum ketahiran.
- issue: Identitas הַזָּב
  choice: orang yang mengeluarkan lelehan itu
  alternative: laki-laki yang mengeluarkan lelehan itu
  rationale: Bentuk Ibrani bersifat maskulin dan konteks dekatnya membahas laki-laki, tetapi ungkapan substantivalnya berfokus pada keadaan orang tersebut. Terjemahan tidak perlu menambahkan penekanan gender yang tidak dinyatakan secara leksikal sebagai nomina 'laki-laki'.
translation_notes:
  register: Bahasa hukum yang modern, jelas, dan bermartabat. 'Harus' menyampaikan kewajiban; 'lelehan' dipakai secara konsisten untuk cairan tubuh abnormal dalam konteks pasal ini. Tidak ada catatan kaki karena pilihan 'tubuh' langsung menyampaikan makna kontekstual בָּשָׂר secara alami.
