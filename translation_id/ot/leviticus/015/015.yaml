  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה אֹתָ/ם֙ הַ/כֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה מִ/זּוֹבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: id
  text: Imam harus mempersembahkan kedua burung itu, yang satu sebagai korban penghapus dosa[a] dan yang lain sebagai korban bakaran. Imam harus mengadakan pendamaian bagi orang itu di hadapan Yahweh karena lelehannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “korban pemurnian.” Istilah Ibrani חַטָּאת dapat menunjuk pada persembahan untuk menyingkirkan kenajisan ritual, bukan hanya pada persembahan yang berkaitan dengan dosa moral.
    reason: lexical_alternative
  - marker: b
    text: Atau “cairan keluarannya.” Dalam konteks ini, istilah tersebut merujuk pada lelehan atau keluarnya cairan dari kelamin seorang laki-laki yang menimbulkan kenajisan ritual.
    reason: contextual_clarification
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: harus mempersembahkan kedua burung itu
  rationale: Dalam konteks persembahan, עשה berarti melaksanakan atau mempersembahkan secara ritual. Acuan jamak אֹתָם diperjelas secara wajar sebagai kedua burung yang disebut pada ayat sebelumnya.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan alami bagi כהן dalam peraturan ibadah Israel.
- source_word: אֶחָד חַטָּאת
  choice: yang satu sebagai korban penghapus dosa
  rationale: Padanan ini mempertahankan istilah persembahan yang dikenal luas. Karena חַטָּאת dalam konteks kenajisan ritual juga dapat berarti korban pemurnian, alternatif itu dicatat dalam catatan kaki.
- source_word: וְהָאֶחָד עֹלָה
  choice: dan yang lain sebagai korban bakaran
  rationale: עֹלָה menunjuk pada persembahan yang dibakar seluruhnya; 'korban bakaran' merupakan istilah Indonesia yang mapan.
- source_word: וְכִפֶּר עָלָיו
  choice: Imam harus mengadakan pendamaian bagi orang itu
  rationale: Ungkapan ini mempertahankan daya teologis כפר tanpa menentukan satu teori khusus mengenai cara kerja pendamaian. 'Orang itu' memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: '''Di hadapan'' merupakan padanan alami bagi לִפְנֵי, sedangkan nama ilahi dipertahankan sebagai Yahweh sesuai bentuk nama diri dalam teks sumber.'
- source_word: מִזּוֹבוֹ
  choice: karena cairan yang keluar dari tubuhnya
  rationale: מן menyatakan sebab atau keadaan yang memerlukan pendamaian. Frasa deskriptif ini lebih jelas bagi pembaca modern daripada istilah teknis atau lama seperti 'lelehan', sambil tetap menjaga kesantunan.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kenajisan ritual
  choice: korban penghapus dosa
  alternative: korban pemurnian
  rationale: Istilah Ibrani ini dapat menamai persembahan yang menangani kenajisan ritual, bukan hanya dosa moral. Teks utama memakai istilah tradisional yang dikenal luas, sedangkan catatan kaki mempertahankan nuansa ritual alternatif.
- issue: Makna כפר dalam tata ibadah korban
  choice: mengadakan pendamaian
  alternative: mengadakan penghapusan; menyucikan secara ritual
  rationale: Pilihan ini mempertahankan keluasan dan ketegangan teologis istilah sumber tanpa menyempitkannya menjadi satu mekanisme pendamaian tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kedua burung itu' menghubungkan ayat ini dengan konteks sebelumnya; 'cairan yang keluar dari tubuhnya' dipilih agar mudah dipahami tanpa menjadi kasar atau terlalu teknis.
