id: LEV.15.18
reference: Leviticus 15:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: id
  text: Jika seorang laki-laki bersetubuh dengan seorang perempuan dan mengeluarkan air mani[a], keduanya harus membasuh diri dengan air dan menjadi najis[b] sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan pembaringan benih”; ungkapan Ibrani ini secara khusus menunjuk pada keluarnya air mani.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, najis secara ritual sampai petang.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר
  choice: Jika ... seorang perempuan
  rationale: Dalam konteks hukum kasuistik, konstruksi penghubung dan relatif ini secara wajar menyatakan suatu keadaan bersyarat. Susunan kalimat disesuaikan agar alami dalam bahasa Indonesia tanpa menghilangkan perempuan sebagai salah satu pihak.
- source_word: יִשְׁכַּב אִישׁ אֹתָהּ
  choice: seorang laki-laki bersetubuh dengan seorang perempuan
  rationale: Kata שׁכב dengan konstruksi ini merupakan idiom untuk hubungan seksual. “Bersetubuh” menyampaikan maknanya secara jelas, ringkas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: שִׁכְבַת זָרַע
  choice: mengeluarkan air mani
  rationale: Ungkapan Ibrani ini secara khusus menunjuk pada keluarnya semen. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “pembaringan benih” dan tetap mempertahankan kekhususan jasmaninya.
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: keduanya harus membasuh diri dengan air
  rationale: Bentuk verba jamak merujuk kepada kedua pihak. “Keduanya” memperjelas rujukan itu, sedangkan “membasuh diri dengan air” mempertahankan cakupan umum tindakan mencuci atau mandi tanpa menentukan cara yang tidak disebutkan teks.
- source_word: וְטָמְאוּ
  choice: menjadi najis
  rationale: Dalam konteks Imamat, kata ini menyatakan status kenajisan ritual. “Najis” adalah istilah Indonesia yang ringkas dan lazim; catatan kaki menjelaskan sifat ritualnya agar teks utama tidak menambahkan unsur kesalahan moral.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Terjemahan ini mempertahankan batas waktu yang dinyatakan teks tanpa menafsirkannya lebih khusus sebagai saat matahari terbenam.
theological_decisions:
- issue: Sifat kenajisan dalam hukum kemurnian Imamat
  choice: Menerjemahkan טמא sebagai “najis” dan menjelaskan dalam catatan bahwa yang dimaksud ialah kenajisan ritual.
  alternative: “najis secara ritual” atau bahasa yang menyiratkan kesalahan moral
  rationale: Ayat ini menetapkan status kemurnian sementara sesudah hubungan seksual, bukan menyatakan bahwa hubungan tersebut merupakan dosa. Rumusan ini menjaga perbedaan antara kenajisan ritual dan kesalahan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. “Bersetubuh” dipilih karena lugas tanpa terdengar kasar atau terlalu klinis. Modalitas hukum disampaikan dengan “harus”, dan kedua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
