translation:
  language: id
  text: Dan setiap pelana yang dinaiki oleh laki-laki yang mengalami lelehan itu akan menjadi najis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap benda yang dinaiki”; istilah Ibrani ini dapat menunjuk lebih luas kepada sesuatu yang dinaiki, bukan hanya pelana dalam arti sempit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Dan setiap
  rationale: וְ menghubungkan ketentuan ini dengan peraturan sebelumnya, sedangkan כָּל menyatakan cakupan distributif; “Dan setiap” mempertahankan keduanya secara alami.
- source_word: הַ/מֶּרְכָּב
  choice: pelana
  rationale: מֶרְכָּב berarti sesuatu yang dinaiki. Dalam konteks hukum kenajisan ini, “pelana” merupakan padanan konkret dan alami, sementara cakupan istilah Ibraninya yang lebih luas dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: yang dinaiki
  rationale: Ungkapan ini menyatakan benda yang di atasnya orang tersebut berkendara. Bentuk pasif “yang dinaiki” ringkas, idiomatis, dan tetap mempertahankan hubungan spasial yang tersirat oleh עַל.
- source_word: הַ/זָּב
  choice: orang yang mengeluarkan lelehan itu
  rationale: Partisipel substantival maskulin זָב menunjuk kepada laki-laki yang mengalami lelehan tubuh sebagaimana ditetapkan dalam konteks pasal ini. “Orang yang mengeluarkan lelehan itu” jelas dalam bahasa Indonesia dan tidak menambahkan penilaian moral.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: Bentuk qal ini menyatakan status kenajisan ritual yang berlaku pada benda tersebut. “Menjadi najis” menyampaikan hasil ketentuan tanpa menyiratkan kesalahan moral.
theological_decisions:
- issue: Sifat kenajisan dalam hukum Imamat
  choice: “najis” dalam arti ritual/legal
  alternative: “tercemar” atau “tidak tahir” dengan kemungkinan konotasi moral
  rationale: Ayat ini mengatur status ritual akibat lelehan tubuh, bukan menyatakan dosa atau keburukan moral. Istilah “najis” lazim dan tepat dalam konteks hukum pentahiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur hukum dipertahankan tanpa gaya yang terlalu arkais; istilah teknis ritual dijaga melalui kata “najis”.
