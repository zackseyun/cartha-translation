base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: id
  text: Setiap pakaian dan setiap kulit[a] yang terkena pancaran mani[b] harus dicuci dengan air dan menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud kemungkinan ialah kulit binatang atau barang yang terbuat dari kulit.
    reason: lexical_alternative
  - marker: b
    text: Atau “lelehan mani”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: pakaian
  rationale: Istilah ini secara luas menunjuk pada pakaian atau kain. “Pakaian” alami dalam bahasa Indonesia dan sesuai dengan konteks benda yang terkena mani.
- source_word: עוֹר
  choice: kulit
  rationale: Padanan langsungnya adalah “kulit”, kemungkinan kulit binatang atau barang dari kulit dalam konteks ini. Catatan kaki menjelaskan kemungkinan makna kontekstual tersebut tanpa memasukkannya ke teks utama.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: yang terkena
  rationale: Secara harfiah berarti sesuatu berada di atasnya. “Yang terkena” menyampaikan hubungan lokatif itu secara alami dalam konteks cairan yang mengenai benda.
- source_word: שִׁכְבַת זָרַע
  choice: pancaran mani
  rationale: Ungkapan Ibrani menunjuk pada mani yang terpancar. “Pancaran mani” jelas, ringkas, dan mempertahankan unsur pengeluaran yang terkandung dalam ungkapan sumber.
- source_word: וְכֻבַּס
  choice: harus dicuci
  rationale: Bentuk pasif dalam ketentuan hukum menyatakan kewajiban. “Harus dicuci” merupakan rumusan hukum yang alami dan jelas dalam bahasa Indonesia.
- source_word: בַּמַּיִם
  choice: dengan air
  rationale: Preposisi menyatakan sarana pencucian; “dengan air” adalah ungkapan Indonesia yang alami.
- source_word: וְטָמֵא
  choice: dan menjadi najis
  rationale: “Najis” mempertahankan kategori kenajisan ritual dalam Imamat. Kata “menjadi” menghubungkan keadaan benda itu secara alami dengan ketentuan sebelumnya tanpa menyiratkan kesalahan moral.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Padanan ini akurat, ringkas, dan wajar dalam ragam Alkitab bahasa Indonesia modern.
theological_decisions:
- issue: Sifat kenajisan dalam hukum kemurnian Imamat
  choice: Menerjemahkan טָמֵא sebagai “najis” dalam arti ritual.
  alternative: cemar; tidak tahir
  rationale: Konteks membahas status ritual, bukan dengan sendirinya kesalahan moral. “Najis” mempertahankan kategori hukum sumber tanpa menambahkan penilaian moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mudah dipahami, sedangkan istilah “najis” dipertahankan sebagai istilah ritual yang lazim. Semua penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskan.
