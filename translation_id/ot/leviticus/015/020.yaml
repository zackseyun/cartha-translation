  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: id
  text: Segala sesuatu yang menjadi tempat ia berbaring selama ia dalam keadaan najis karena haid[a] akan menjadi najis, dan segala sesuatu yang didudukinya akan menjadi najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “selama haidnya.” Istilah Ibrani mencakup gagasan kenajisan ritual yang berkaitan dengan haid, bukan hanya siklus fisiknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: masa kenajisan haidnya
  rationale: Dalam konteks Imamat 15, istilah ini menunjuk pada keadaan najis secara ritual yang berkaitan dengan haid, bukan pada kesalahan moral. Frasa ini mempertahankan unsur haid dan kategori hukum kenajisan.
- source_word: תִּשְׁכַּב
  choice: ditidurinya
  rationale: Bentuk ini secara alami menyatakan benda yang menjadi tempat perempuan itu berbaring, tanpa menyiratkan bahwa ia harus tidur.
- source_word: תֵּשֵׁב
  choice: didudukinya
  rationale: Menyatakan secara langsung benda yang menjadi tempat ia duduk.
- source_word: עָלָיו
  choice: yang ditidurinya / yang didudukinya
  rationale: Akhiran pronominal dengan preposisi menyatakan benda tempat ia berbaring atau duduk; dalam bahasa Indonesia hubungan ruang ini dapat diungkapkan secara idiomatis melalui verba berakhiran -i.
- source_word: יִטְמָא
  choice: akan menjadi najis
  rationale: Verba ini menyatakan bahwa benda tersebut masuk ke dalam keadaan najis menurut hukum ritual; 'menjadi' memperjelas perubahan status tanpa memberi kesan kesalahan moral.
- source_word: וְכֹל אֲשֶׁר
  choice: segala sesuatu yang
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh dari konstruksi relatif Ibrani dan terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat kenajisan dalam hukum kesucian Imamat
  choice: Menggunakan istilah 'najis' dan 'kenajisan haid' sebagai status ritual, bukan kesalahan moral
  alternative: Menerjemahkannya dengan ungkapan yang dapat menyiratkan kecemaran moral atau keberdosaan
  rationale: Ayat ini membahas status kenajisan dalam tata kesucian Israel. Terjemahan tidak boleh menyiratkan bahwa haid itu sendiri merupakan pelanggaran moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'ditidurinya' dan 'didudukinya' ringkas serta alami untuk menyatakan benda yang menjadi tempat berbaring dan duduk. Istilah 'najis' dipertahankan sebagai istilah hukum ritual yang umum dipahami.
