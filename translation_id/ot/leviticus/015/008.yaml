base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: id
  text: Jika laki-laki yang mengeluarkan lelehan itu meludahi orang yang tahir[a], orang yang diludahi itu harus mencuci pakaiannya dan membasuh tubuhnya dengan air. Ia menjadi najis sampai petang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, orang yang berstatus tahir menurut ketentuan ritual.
    reason: cultural_note
  - marker: b
    text: Kenajisan di sini adalah status ritual sampai petang, bukan dengan sendirinya kesalahan moral.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Jika
  rationale: Membuka kasus bersyarat dalam rangkaian hukum. Dalam bahasa Indonesia, hubungan dengan ayat sebelumnya sudah cukup tersirat tanpa harus memakai 'Dan jika'.
- source_word: יָרֹק
  choice: meludahi
  rationale: Verba Ibrani berarti 'meludah'; preposisi ב pada objek menunjukkan ludah mengenai orang tersebut, sehingga 'meludahi' merupakan padanan Indonesia yang alami.
- source_word: הַ/זָּב
  choice: orang yang mengeluarkan lelehan itu
  rationale: Partisip substantival ini menunjuk kepada orang yang mengalami lelehan tubuh. 'Orang' mempertahankan bentuk sumber yang tidak secara eksplisit memakai nomina 'laki-laki', sedangkan 'itu' menandai referen tertentu dalam konteks.
- source_word: בַּ/טָּהוֹר
  choice: orang yang tahir
  rationale: Adjektiva substantival טָהוֹר berarti orang yang berstatus tahir secara ritual; 'tahir' merupakan istilah Indonesia yang mapan untuk kategori pentahiran dalam Imamat.
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: orang yang diludahi itu harus mencuci pakaiannya
  rationale: Subjek gramatikal tersirat dapat terasa ambigu dalam bahasa Indonesia. Penyebutan 'orang yang diludahi itu' memperjelas bahwa pemilik pakaian dan orang yang menjadi najis ialah orang tahir yang terkena ludah, sesuai alur hukum Ibrani.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: dan membasuh tubuhnya dengan air
  rationale: רָחַץ dalam konteks ritual menunjuk pada pembasuhan badan. Penambahan 'tubuhnya' membuat objek yang tersirat jelas dan membedakannya dari pencucian pakaian.
- source_word: וְ/טָמֵא
  choice: Ia menjadi najis
  rationale: Bentuk ini menyatakan peralihan status akibat kontak. 'Najis' dipahami sebagai status ritual, bukan kesalahan moral.
- source_word: עַד הָ/עָרֶב
  choice: sampai petang
  rationale: Ungkapan waktu baku yang menyatakan lamanya status najis; 'sampai petang' alami dan setia pada sumber.
theological_decisions:
- issue: Istilah status ritual טָהוֹר / טָמֵא
  choice: tahir / najis
  alternative: bersih / tidak bersih; suci / cemar
  rationale: '''Tahir'' dan ''najis'' secara tepat menandai status ritual dalam hukum Imamat dan menghindari kesan bahwa ayat ini terutama membicarakan kebersihan fisik atau kesalahan moral.'
- issue: Identitas orang yang wajib mencuci dan menjadi najis
  choice: orang yang diludahi
  alternative: orang yang mengeluarkan lelehan
  rationale: Rangkaian kasus menyatakan bahwa kontak dengan lelehan orang tersebut memindahkan kenajisan kepada orang yang sebelumnya tahir. Sufiks pada 'pakaiannya' dan verba tunggal selanjutnya merujuk pada orang yang terkena ludah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah teknis 'tahir' dan 'najis' dipertahankan karena mapan dalam konteks hukum ritual. Struktur dipecah menjadi dua kalimat agar rujukan subjek jelas bagi pembaca umum.
