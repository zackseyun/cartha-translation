  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: id
  text: Jika sesuatu berada di atas tempat tidur atau di atas barang yang diduduki perempuan itu[a], orang yang menyentuhnya menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “barang” (כְּלִי) dapat juga berarti “benda”, “perkakas”, atau “wadah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Dalam rangkaian hukum bersyarat, bahasa Indonesia alami memakai “Jika”; hubungan dengan ayat sebelumnya tetap jelas dari konteks tanpa harus menambahkan “dan”.
- source_word: עַל הַמִּשְׁכָּב
  choice: di atas tempat tidur
  rationale: מִשְׁכָּב menunjuk pada tempat berbaring atau tempat tidur; pilihan ini jelas dan sesuai dengan konteks hukum kenajisan.
- source_word: הוּא
  choice: benda itu ada
  rationale: Pronomina maskulin tunggal ini dipahami menunjuk pada benda tersirat dalam konteks. “Benda itu ada” membuat konstruksi dapat dipahami tanpa menentukan benda tersebut secara lebih sempit.
- source_word: עַל הַכְּלִי
  choice: di atas barang
  rationale: כְּלִי adalah istilah luas untuk barang, perkakas, wadah, atau benda. “Barang” mempertahankan keluasan maknanya dalam bahasa Indonesia umum.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: yang didudukinya
  rationale: Ungkapan ini secara alami menyatakan barang yang menjadi tempat perempuan itu duduk; bentuk “didudukinya” ringkas dan mempertahankan rujukan kepada perempuan tersebut.
- source_word: בְּנָגְעוֹ בוֹ
  choice: orang yang menyentuh benda itu
  rationale: Infinitif dengan בְּ menyatakan keadaan waktu, sedangkan akhiran 3ms menggambarkan pelaku tunggal. Bahasa Indonesia tidak wajib menandai gender, sehingga “orang yang” alami dan tidak menambah penekanan gender yang tidak berfungsi dalam bahasa sasaran.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: Dalam hukum ini verba menyatakan akibat ritual dari sentuhan. “Menjadi najis” lebih alami daripada bentuk legalistis dan tidak menyiratkan kesalahan moral.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Ini merupakan padanan alami bagi rumus waktu dalam Imamat dan mempertahankan batas berlakunya kenajisan.
theological_decisions:
- issue: Sifat kenajisan dalam טָמֵא
  choice: najis
  alternative: najis secara ritual; tercemar
  rationale: Konteksnya adalah status kenajisan ritual, bukan dengan sendirinya kesalahan moral. Teks utama mempertahankan istilah sederhana “najis” tanpa memasukkan penjelasan teologis tambahan.
- issue: Rujukan הוּא pada awal ayat
  choice: benda yang tersirat dari konteks
  alternative: seorang laki-laki; kenajisan itu sendiri
  rationale: Susunan kalimat dan kelanjutan “ketika menyentuhnya” paling wajar dipahami mengenai sesuatu yang berada di atas tempat tidur atau barang. Terjemahan tidak menentukan jenis bendanya lebih jauh.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk hukum bersyarat, rujukan perempuan dalam klausa relatif, serta makna kenajisan ritual.
