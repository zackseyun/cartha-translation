base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: id
  text: Dan laki-laki yang menyentuh tempat tidurnya[a] harus mencuci pakaiannya dan membasuh diri dengan air. Ia menjadi najis[b] sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat berbaringnya.” Istilah Ibrani ini dapat mencakup ranjang, alas tidur, atau tempat lain yang dipakainya untuk berbaring.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, najis secara ritual menurut ketentuan kemurnian dalam pasal ini, bukan dengan sendirinya bersalah secara moral.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: Dan orang yang
  rationale: אִישׁ berbentuk maskulin tunggal, tetapi dalam ketentuan hukum ini menunjuk pada siapa pun yang melakukan tindakan tersebut; 'orang yang' alami dalam bahasa Indonesia tanpa mengubah cakupan hukum.
- source_word: יִגַּע
  choice: menyentuh
  rationale: נגע berarti menyentuh atau bersentuhan; 'menyentuh' ringkas dan tepat dalam konteks kenajisan karena kontak.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: tempat tidurnya
  rationale: מִשְׁכָּב adalah tempat untuk berbaring, yang dapat berupa ranjang, alas tidur, atau tempat ia berbaring. 'Tempat tidurnya' alami dan sedikit lebih luas daripada 'ranjangnya'.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: harus mencuci pakaiannya
  rationale: כִּבֵּס secara khusus menyatakan pencucian pakaian. 'Harus' menyampaikan daya wajib ketentuan hukum secara wajar dalam bahasa Indonesia modern.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: dan membasuh tubuhnya dengan air
  rationale: רחץ di sini mengacu pada pembasuhan badan; objek refleksif tersirat dijelaskan sebagai 'tubuhnya'. Preposisi ב dengan air secara alami diterjemahkan 'dengan air'.
- source_word: וְ/טָמֵא
  choice: Ia menjadi najis
  rationale: טָמֵא menyatakan status najis dalam aturan kemurnian ritual, bukan kesalahan moral. Pemenggalan menjadi kalimat baru menjaga kejelasan tanpa mengubah hubungan makna.
- source_word: עַד הָ/עָרֶב
  choice: sampai petang
  rationale: Frasa ini menetapkan batas waktu status najis. 'Sampai petang' merupakan ungkapan Indonesia yang alami dan setia.
theological_decisions:
- issue: Sifat kenajisan dalam hukum Imamat
  choice: Menggunakan 'najis' untuk status ritual dan menjelaskannya dalam catatan kaki.
  alternative: Memasukkan 'secara ritual' atau 'secara upacara' langsung ke dalam teks utama.
  rationale: Teks Ibrani memakai kategori טָמֵא tanpa menyebut kesalahan moral. 'Najis' mempertahankan istilah pokok teks, sedangkan catatan kaki mencegah pembaca menyamakannya dengan dosa atau kekotoran fisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'harus' dipakai untuk daya wajib hukum; 'membasuh tubuhnya' membedakan pencucian badan dari pencucian pakaian. Semua penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskan.
