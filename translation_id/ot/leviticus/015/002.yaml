base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: id
  text: '“Berbicaralah kepada orang Israel dan katakan kepada mereka: Apabila seorang laki-laki mengalami lelehan dari tubuhnya[a], lelehannya itu najis.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari dagingnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Berbicaralah
  rationale: Bentuk perintah jamak ini mengawali penyampaian ketetapan ilahi dan mempertahankan gaya formal teks hukum.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiahnya 'anak-anak lelaki Israel', tetapi dalam bahasa Indonesia modern 'orang Israel' merupakan sebutan kolektif yang alami tanpa mengubah kelompok yang dituju.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: dan katakan kepada mereka
  rationale: Mempertahankan rangkaian perintah dan irama formula penyampaian hukum Ibrani.
- source_word: אִישׁ אִישׁ
  choice: seorang laki-laki
  rationale: Pengulangan distributif berarti setiap atau siapa pun dari kalangan laki-laki; konteksnya secara khusus membicarakan lelehan tubuh laki-laki.
- source_word: כִּי יִהְיֶה
  choice: apabila ... mengeluarkan
  rationale: כִּי memperkenalkan kasus hukum yang mungkin terjadi; 'apabila' sesuai dengan corak ketetapan kasus dalam bahasa Indonesia.
- source_word: זָב מִבְּשָׂרוֹ
  choice: mengeluarkan lelehan dari tubuhnya
  rationale: זָב menunjukkan keadaan keluarnya cairan, sedangkan בשר di sini menunjuk tubuh atau bagian tubuh; 'lelehan' mempertahankan istilah yang cukup umum tanpa menentukan diagnosis yang tidak dinyatakan teks.
- source_word: זוֹבוֹ
  choice: lelehan itu
  rationale: Nomina ini seakar dengan זָב; pengulangan 'lelehan' menjaga hubungan leksikal antara keadaan dan cairan yang keluar.
- source_word: טָמֵא הוּא
  choice: lelehan itu membuatnya najis
  rationale: Pronomina tunggal maskulin dapat secara gramatikal merujuk kepada lelehan maupun laki-laki itu. Pilihan ini menghasilkan bahasa Indonesia yang alami sekaligus menandai dampak kenajisan pada orang tersebut; ambiguitas sumber dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna טָמֵא dalam hukum kesucian
  choice: najis
  alternative: tidak tahir
  rationale: '''Najis'' adalah istilah Indonesia yang mapan untuk status ritual dalam Imamat dan tidak dengan sendirinya menyatakan kesalahan moral.'
- issue: Acuan pronomina dalam טָמֵא הוּא
  choice: lelehan itu membuatnya najis
  alternative: lelehan itu najis / ia najis karena lelehannya
  rationale: Susunan Ibrani memungkinkan perdebatan apakah הוּא merujuk pada lelehan atau laki-laki itu. Terjemahan utama menyampaikan akibat praktis ketetapan tanpa menghapus ambiguitas, yang dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa hukum yang formal tetapi mudah dipahami. 'Lelehan' dipilih sebagai istilah umum dan bermartabat bagi cairan tubuh yang keluar, tanpa menambahkan lokasi anatomis atau diagnosis yang tidak disebutkan secara eksplisit oleh ayat ini.
