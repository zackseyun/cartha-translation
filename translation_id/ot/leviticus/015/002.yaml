  naturalness: “Berbicaralah kepada orang Israel dan katakan kepada mereka” formal dan masih alami dalam register kitab hukum. “Mengalami lelehan” lebih idiomatis dalam bahasa Indonesia modern daripada “mengeluarkan lelehan” untuk menyatakan keadaan yang ditandai partisip זָב.
