  revised_text: Apabila laki-laki yang mengalami lelehan itu telah tahir dari lelehannya, ia harus menghitung tujuh hari untuk pentahirannya. Ia harus mencuci pakaiannya dan membasuh tubuhnya dengan air yang mengalir[a]; barulah ia tahir.
