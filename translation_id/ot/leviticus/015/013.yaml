  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: id
  text: Apabila laki-laki yang mengalami lelehan itu telah tahir dari lelehannya, ia harus menghitung tujuh hari untuk pentahirannya. Ia harus mencuci pakaiannya dan membasuh tubuhnya dengan air yang mengalir[a]; barulah ia tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “air hidup”, yaitu air segar atau air yang mengalir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: orang yang mengalami lelehan
  rationale: Partisip substantival ini menunjuk pada laki-laki yang mengalami lelehan tubuh sebagaimana dibahas dalam konteks pasal ini. Ungkapan Indonesia ini alami dan netral; konteks ayat-ayat sebelumnya mempertahankan acuan laki-lakinya tanpa perlu menambahkan kata 'laki-laki' di sini.
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: sudah tahir dari lelehannya
  rationale: Kata טהר dalam konteks ini menyatakan ketahiran ritual, bukan kebersihan jasmani atau kemurnian moral. Bentuk 'sudah tahir' menyampaikan perubahan keadaan yang mendahului penghitungan tujuh hari.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: ia harus menghitung tujuh hari
  rationale: Rangkaian verba dalam ketentuan ritual ini memiliki daya instruktif. 'Harus' menyatakannya dengan wajar dalam bahasa Indonesia modern.
- source_word: לְטָהֳרָתוֹ
  choice: untuk pentahirannya
  rationale: Nomina ini merujuk pada proses ketahiran ritual. 'Pentahiran' mempertahankan ranah ritual dan tidak menyiratkan kesalahan moral.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Ia harus mencuci pakaiannya
  rationale: כבס secara khusus menunjuk pada pencucian pakaian; terjemahan ini jelas dan idiomatis.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: membasuh tubuhnya
  rationale: בשר secara harfiah berarti 'daging', tetapi di sini menunjuk pada tubuh yang dibasuh. 'Membasuh tubuhnya' tepat untuk konteks ritual dan membedakannya dari mencuci pakaian.
- source_word: בְּמַיִם חַיִּים
  choice: dengan air yang mengalir
  rationale: Secara harfiah ungkapan ini berarti 'air hidup' dan secara idiomatis menunjuk pada air alami yang segar atau mengalir. 'Air yang mengalir' memberi arti praktis yang jelas, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: וְטָהֵר
  choice: sesudah itu ia menjadi tahir
  rationale: Verba penutup menyatakan hasil rangkaian tindakan ritual. 'Sesudah itu' memperjelas urutannya tanpa menambahkan gagasan teologis.
theological_decisions:
- issue: Istilah ketahiran ritual dan kemungkinan pemaknaan moral
  choice: Menggunakan 'tahir' dan 'pentahiran' sebagai kategori ritual
  alternative: bersih dan pembersihan; suci dan penyucian
  rationale: '''Tahir'' mempertahankan pembedaan antara keadaan ritual dan kebersihan biasa, serta tidak mengesankan bahwa lelehan tersebut dengan sendirinya merupakan dosa atau kesalahan moral.'
- issue: Makna מַיִם חַיִּים
  choice: air yang mengalir, dengan arti harfiah dalam catatan kaki
  alternative: air hidup; air segar
  rationale: Ungkapan Ibrani tetap memiliki citra harfiah 'air hidup', tetapi dalam hukum ritual ini menunjuk pada air alami yang segar atau mengalir. Terjemahan utama dibuat mudah dipahami tanpa menghapus bentuk sumbernya dari catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur prosedural dipertahankan dengan kalimat yang mudah diikuti. Istilah 'tahir' dipakai secara konsisten untuk ketahiran ritual, bukan kemurnian moral.
