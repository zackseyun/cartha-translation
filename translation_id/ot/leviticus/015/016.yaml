base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: id
  text: Apabila seorang laki-laki mengalami keluarnya air mani[a], ia harus membasuh seluruh tubuhnya dengan air, dan ia menjadi najis[b] sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “keluarnya benih.”'
    reason: lexical_alternative
  - marker: b
    text: “Najis” di sini menunjuk kepada kenajisan ritual dalam hukum kemurnian Imamat, bukan dengan sendirinya kepada kesalahan moral.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Konteksnya secara khusus mengatur keluarnya air mani dari tubuh laki-laki, sehingga acuan gender dipertahankan.
- source_word: כִּי
  choice: apabila
  rationale: Dalam rumusan hukum kasuistik, kata ini memperkenalkan keadaan yang mungkin terjadi; 'apabila' alami dan sesuai dengan ragam hukum Indonesia.
- source_word: תֵצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: mengeluarkan air mani
  rationale: Ungkapan Ibrani secara harfiah menggambarkan keluarnya 'benih', tetapi dalam konteks fisiologis ini jelas menunjuk kepada keluarnya semen; terjemahan dipadatkan agar alami tanpa menghilangkan maknanya.
- source_word: וְרָחַץ בַּמַּיִם אֶת כָּל בְּשָׂרוֹ
  choice: ia harus membasuh seluruh tubuhnya dengan air
  rationale: בָּשָׂר berarti 'daging', tetapi dalam ungkapan ini menunjuk kepada seluruh tubuh. 'Harus' menyampaikan daya instruktif urutan hukum dengan jelas.
- source_word: וְטָמֵא
  choice: dan ia menjadi najis
  rationale: Istilah baku 'najis' mempertahankan kategori kenajisan dalam hukum kemurnian Imamat; catatan kaki menjelaskan bahwa ini bukan dengan sendirinya penilaian atas kesalahan moral.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan batas waktu yang dinyatakan teks.
theological_decisions:
- issue: Sifat kenajisan dalam וְטָמֵא
  choice: najis dalam konteks ritual
  alternative: bersalah atau cemar secara moral
  rationale: Konteksnya ialah hukum kemurnian Imamat mengenai cairan tubuh. Teks menyatakan status kenajisan, tetapi tidak menyatakan bahwa keluarnya air mani itu sendiri merupakan dosa; catatan menjaga pembedaan ini tanpa mengubah istilah utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumusan 'apabila ... harus' sesuai dengan gaya hukum yang mudah dipahami. 'Seluruh tubuhnya' dipilih daripada 'seluruh dagingnya' agar makna idiom Ibrani tersampaikan secara alami.
