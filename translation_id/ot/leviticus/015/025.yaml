  source_fidelity: Draf pada dasarnya setia pada teks Ibrani dan dengan tepat mempertahankan kategori kenajisan ritual. Namun, “ia menjadi najis” dapat menyiratkan perubahan status pada suatu titik, sedangkan טְמֵאָה הִוא menetapkan statusnya selama seluruh periode. Selain itu, “selama lelehan najisnya itu” kurang jelas menyatakan “seluruh hari/massa lelehan kenajisannya.”
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. Revisi kecil memperjelas durasi status ritual dan menghindari frasa “lelehan najis” yang dalam bahasa Indonesia dapat terdengar seperti lelehan yang kotor secara fisik, bukan lelehan yang terkait dengan kenajisan ritual.
  terminology: “Kenajisan haid” dan “najis” konsisten serta sesuai untuk status ritual dalam Imamat. “Lelehan darah” adalah pilihan modern yang wajar. Catatan kaki mempertahankan alternatif makna עַל tanpa memaksakan satu penafsiran.
  issues:
