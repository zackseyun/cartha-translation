id: LEV.15.25
reference: Leviticus 15:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: id
  text: Jika seorang perempuan mengalami lelehan darah selama berhari-hari di luar masa kenajisan haidnya,[a] atau jika ia mengalami lelehan yang berlanjut melampaui masa kenajisan haidnya,[b] maka selama seluruh masa lelehan yang membuatnya najis itu, ia najis, sama seperti pada hari-hari kenajisan haidnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di luar waktu haidnya.” Istilah Ibrani mencakup keadaan kenajisan ritual yang berkaitan dengan haid, bukan hanya perdarahannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “jika ia mengalami lelehan di samping kenajisan haidnya,” yaitu lelehan yang berlanjut melewati masa haid yang normal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: mengalami lelehan / lelehannya berlanjut
  rationale: Gabungan verba dan nomina dari זוּב menunjuk pada aliran tubuh yang tidak normal. “Mengalami lelehan” cukup alami dalam bahasa Indonesia dan tetap mempertahankan corak hukum-kemurnian; pada klausa kedua, “berlanjut melampaui” menyampaikan makna perpanjangan yang dapat dikandung עַל dalam konteks ini.
- source_word: דָּמָהּ
  choice: darah
  rationale: Akhiran pronominal secara harfiah berarti “darahnya”; sesudah “lelehan”, ungkapan idiomatis “lelehan darah” menyampaikan maksudnya dengan jelas.
- source_word: יָמִים רַבִּים
  choice: selama berhari-hari
  rationale: Ungkapan ini menyatakan durasi yang panjang; “selama berhari-hari” alami dan tidak menetapkan jumlah hari tertentu.
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: bukan pada waktu kenajisan haidnya
  rationale: עֵת berarti “waktu”, sedangkan נִדָּה dalam konteks Imamat mencakup keadaan kenajisan ritual yang berkaitan dengan haid, bukan hanya perdarahannya.
- source_word: נִדָּה
  choice: kenajisan haid
  rationale: Pilihan ini mempertahankan dimensi status ritual yang terkandung dalam istilah Ibrani, tanpa menyiratkan kesalahan moral.
- source_word: עַל נִדָּתָהּ
  choice: melampaui masa kenajisan haidnya
  rationale: Dalam konteks ini עַל dapat menunjukkan bahwa lelehan itu berlanjut melewati masa haid yang biasa. Kata “masa” ditambahkan secara idiomatis untuk memperjelas dimensi waktunya.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: selama lelehan najisnya itu
  rationale: Rangkaian konstruksi tersebut menghubungkan lelehan dengan kenajisan ritual. Rumusan ini ringkas, alami, dan tetap menyebut sifat najis dari lelehan tersebut.
- source_word: טְמֵאָה
  choice: menjadi najis
  rationale: Istilah ini menyatakan status ritual menurut hukum kemurnian Imamat, bukan dengan sendirinya kesalahan atau dosa moral.
- source_word: כִּימֵי נִדָּתָהּ
  choice: sama seperti pada hari-hari kenajisan haidnya
  rationale: Perbandingan ini menyamakan status perempuan selama lelehan abnormal dengan statusnya selama kenajisan haid; pengulangan istilah menjaga konsistensi leksikal.
theological_decisions:
- issue: Penerjemahan istilah kemurnian ritual tanpa menyiratkan kesalahan moral
  choice: Menggunakan “najis” dan “kenajisan haid” sebagai istilah status ritual
  alternative: Menggunakan “tidak tahir” secara konsisten, atau hanya “haid/menstruasi” tanpa menyebut dimensi kenajisan
  rationale: Ayat ini mengatur kenajisan ritual dalam hukum Imamat, bukan menyatakan bahwa perempuan tersebut bersalah secara moral. Pilihan ini mempertahankan kategori kultis sambil tetap mudah dipahami.
- issue: Ambiguitas עַל נִדָּתָהּ
  choice: Menerjemahkan sebagai lelehan yang berlanjut “melampaui” masa kenajisan haid
  alternative: Menerjemahkan “di samping/selain kenajisan haidnya”
  rationale: Konteks mendukung perpanjangan lelehan melewati masa normal, tetapi preposisi עַל juga dapat dibaca sebagai tambahan pada keadaan haid; alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang tetap luhur dan mudah dipahami. “Lelehan” dipilih untuk aliran tubuh yang abnormal; “najis/kenajisan” digunakan secara konsisten sebagai kategori ritual, bukan penilaian moral.
