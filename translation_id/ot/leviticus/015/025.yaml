revisions:
- from: Jika seorang perempuan mengalami lelehan darah selama berhari-hari, bukan pada waktu kenajisan haidnya,[a] atau jika lelehannya berlanjut melampaui masa kenajisan haidnya,[b] maka selama lelehan najisnya itu ia menjadi najis, sama seperti pada hari-hari kenajisan haidnya.
  to: Jika seorang perempuan mengalami lelehan darah selama berhari-hari di luar masa kenajisan haidnya,[a] atau jika ia mengalami lelehan yang berlanjut melampaui masa kenajisan haidnya,[b] maka selama seluruh masa lelehan yang membuatnya najis itu, ia najis, sama seperti pada hari-hari kenajisan haidnya.
  rationale: 'Revisi mempertahankan seluruh unsur utama teks sumber: lelehan darah yang berlangsung lama di luar masa haid, lelehan yang berlanjut melampaui masa haid, status najis sepanjang seluruh masa lelehan, dan perbandingannya dengan hari-hari kenajisan haid. “Ia najis” lebih tepat daripada “ia menjadi najis” untuk status yang dinyatakan teks, sedangkan “selama seluruh masa lelehan yang membuatnya najis” menyampaikan durasi dan fungsi ritual lelehan itu secara jelas tanpa mengklaim diagnosis medis.'
