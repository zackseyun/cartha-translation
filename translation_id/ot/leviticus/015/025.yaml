  - severity: low
    issue: “Selama lelehan najisnya itu” kurang eksplisit tentang seluruh masa lelehan dan berpotensi menggeser makna ritual menjadi sifat fisik lelehan.
    rationale: כָּל יְמֵי menyebut seluruh hari/masa, dan konstruksi זוֹב טֻמְאָתָהּ mengaitkan lelehan itu dengan kenajisannya. Rumusan yang menyebut masa lelehan dan akibat ritualnya lebih jelas dalam bahasa Indonesia.
