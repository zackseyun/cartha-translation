    issue: '"Karena lelehannya" dalam klausa pembuka'
    rationale: בְּזוֹבוֹ secara langsung berarti "dalam/sehubungan dengan lelehannya," bukan secara tegas "karena lelehannya." Terjemahan sebab-akibat dapat dibaca sebagai penjelasan yang lebih sempit daripada rumusan sumber.
  - severity: medium
    issue: Catatan kaki mengubah hubungan מִן dalam klausa kedua menjadi "karena"
    rationale: Frasa מִזּוֹבוֹ secara harfiah memakai "dari lelehannya." Karena konstruksi ini sukar dan diperdebatkan, catatan seharusnya mempertahankan ketidakjelasan itu, bukan menetapkan hubungan sebab-akibat.
  - severity: low
    issue: Penjelasan "sehingga lelehan itu tidak keluar"
    rationale: Ini adalah penjelasan yang masuk akal atas keadaan terhambat, tetapi bukan pernyataan eksplisit kata demi kata. Kata "terhambat" lebih dekat dengan kontras sumber daripada "tersumbat" saja.
