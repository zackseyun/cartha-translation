  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: id
  text: 'Inilah kenajisannya sehubungan dengan lelehannya: entah tubuhnya mengeluarkan lelehannya,[a] entah tubuhnya terhambat sehingga lelehannya tidak keluar, itulah kenajisannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dagingnya mengalirkan lelehannya ... dagingnya tertutup dari lelehannya.” Di sini “daging” menunjuk pada kondisi tubuh yang terkait dengan lelehan itu. Ungkapan kedua dalam bahasa Ibrani sukar; kata-kata “terhambat sehingga lelehannya tidak keluar” menyatakan kontras yang dimaksudkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: kenajisannya
  rationale: Dalam hukum kesucian Imamat, kata ini menunjuk pada status kenajisan ritual, bukan terutama kekotoran fisik atau kesalahan moral.
- source_word: זוֹב
  choice: lelehan
  rationale: Dalam konteks ini kata tersebut menunjuk pada cairan abnormal yang keluar dari alat kelamin laki-laki. 'Lelehan' cukup jelas, wajar, dan tidak terlalu teknis.
- source_word: רָר
  choice: mengeluarkan
  rationale: Kata kerja ini menggambarkan tubuh atau bagian tubuh yang mengalirkan lelehan; 'mengeluarkan' merupakan ungkapan Indonesia yang alami dalam konteks tubuh.
- source_word: בְּשָׂרוֹ
  choice: tubuhnya
  rationale: Secara harfiah berarti 'dagingnya', tetapi di sini mengacu pada bagian tubuh yang terkait dengan lelehan. 'Tubuhnya' menghindari kesan teologis yang tidak dimaksudkan.
- source_word: הֶחְתִּים
  choice: tersumbat
  rationale: Bentuk ini menunjukkan keadaan tertutup atau terhalang, sebagai lawan dari keluarnya lelehan secara aktif.
- source_word: מִזּוֹבוֹ
  choice: sehingga lelehan itu tidak keluar
  rationale: Ungkapan ini memperjelas dalam bahasa Indonesia keadaan tersumbat dalam hubungannya dengan lelehan, sambil mempertahankan kontras antarkedua kondisi.
- source_word: וְזֹאת תִּהְיֶה
  choice: Inilah
  rationale: Dalam rumusan hukum Indonesia, 'Inilah' menyampaikan formula penetapan Ibrani secara alami dan tegas.
- source_word: אוֹ
  choice: entah ... entah
  rationale: Pasangan ini menampilkan dua keadaan alternatif yang sama-sama menghasilkan ketetapan yang sama.
theological_decisions:
- issue: Sifat kenajisan
  choice: Memakai 'kenajisan' sebagai kategori ritual
  alternative: Memakai 'kecemaran' atau bahasa yang menyiratkan kesalahan moral
  rationale: Konteks Imamat membahas status ritual; terjemahan tidak boleh menyamakan kondisi tubuh ini dengan dosa moral.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. Istilah 'lelehan' dipilih agar dapat dipahami pembaca umum tanpa menjadi vulgar; catatan kaki mempertahankan gambaran harfiah Ibrani dan ambiguitas bagian tubuh yang dimaksud.
