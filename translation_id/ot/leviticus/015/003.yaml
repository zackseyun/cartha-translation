- from: 'Inilah kenajisannya karena lelehannya: entah tubuhnya mengeluarkan lelehan itu,[a] entah tubuhnya tersumbat sehingga lelehan itu tidak keluar, itulah kenajisannya.'
  to: 'Inilah kenajisannya sehubungan dengan lelehannya: entah tubuhnya mengeluarkan lelehannya,[a] entah tubuhnya terhambat sehingga lelehannya tidak keluar, itulah kenajisannya.'
  rationale: Revisi mempertahankan "kenajisan" dan "lelehan," tetapi mengganti hubungan sebab-akibat yang terlalu tegas pada pembukaan dengan "sehubungan dengan." Klausa kedua dan catatan kaki diperbaiki agar menyampaikan kontras antara aliran dan keadaan terhambat tanpa menghapus kesukaran konstruksi Ibrani atau mengubah "dari" menjadi "karena."
