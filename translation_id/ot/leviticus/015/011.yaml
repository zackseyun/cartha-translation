  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: id
  text: Setiap orang yang disentuh oleh laki-laki yang mengalami lelehan, sementara laki-laki itu belum membilas tangannya dengan air,[a] harus mencuci pakaiannya dan membasuh tubuhnya dengan air; orang itu najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika laki-laki itu belum membilas tangannya dengan air.” Klausa Ibrani ini dapat dipahami sebagai syarat yang menyebabkan sentuhan itu menularkan kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: laki-laki yang mengeluarkan lelehan
  rationale: Bentuk partisipial ini menunjuk kepada seorang laki-laki yang mengalami lelehan tubuh dalam konteks hukum kenajisan. Terjemahan ini mempertahankan rujukan laki-laki dan kaitannya dengan istilah yang dipakai dalam perikop.
- source_word: יִגַּע בּוֹ
  choice: disentuh oleh
  rationale: Kata נגע dengan ב menyatakan sentuhan atau kontak fisik. Bentuk pasif menghasilkan susunan Indonesia yang alami dengan כֹל אֲשֶׁר sebagai subjek utama.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: sedangkan ia belum membilas tangannya dengan air
  rationale: Klausa ini dipahami sebagai keadaan pada pihak laki-laki yang mengeluarkan lelehan ketika ia menyentuh orang lain. 'Membilas' membedakan שטף dari רחץ dan כבס, tetapi catatan kaki mempertahankan kemungkinan pembacaan kondisional.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: כּבס lazim dipakai untuk mencuci kain atau pakaian. 'Harus' menyampaikan daya perintah dari bentuk hukum berurutan secara wajar dalam bahasa Indonesia.
- source_word: וְרָחַץ בַּמַּיִם
  choice: membasuh tubuhnya dengan air
  rationale: Dalam hukum kenajisan, רחץ menunjuk pada pembasuhan badan. Penambahan 'tubuhnya' membuat objek tersirat jelas dan membedakannya dari mencuci pakaian.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: Ia menjadi najis sampai petang
  rationale: טמא di sini menyatakan status kenajisan ritual, bukan kesalahan moral. 'Sampai petang' merupakan ungkapan Indonesia yang alami.
- source_word: כֹל אֲשֶׁר
  choice: setiap orang yang
  rationale: Ungkapan ini bersifat distributif dan, dalam konteks, merujuk kepada manusia yang terkena sentuhan.
theological_decisions:
- issue: Sifat kenajisan dalam hukum kemurnian Imamat
  choice: najis dalam arti ritual
  alternative: tercemar atau berdosa secara moral
  rationale: Konteksnya adalah status ritual akibat lelehan tubuh dan kontak, yang dipulihkan melalui pencucian serta berlalunya waktu; ayat ini tidak menyatakan kesalahan moral.
- issue: Hubungan klausa pembilasan tangan dengan sentuhan
  choice: keadaan orang yang mengeluarkan lelehan ketika menyentuh
  alternative: 'syarat yang dirumuskan secara eksplisit: jika ia belum membilas tangannya'
  rationale: Susunan Ibrani memungkinkan klausa tersebut dibaca secara sirkumstansial maupun kondisional. Teks utama memakai susunan sirkumstansial yang alami, sementara alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang jelas dan bermartabat. Istilah 'lelehan' dipakai untuk discharge tubuh, 'membilas' mempertahankan pembedaan leksikal dari pembasuhan tubuh, dan 'najis' dipertahankan sebagai istilah status ritual.
