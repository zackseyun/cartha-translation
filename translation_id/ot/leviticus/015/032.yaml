source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: id
  text: 'Inilah hukum tentang orang yang mengalami lelehan, dan tentang orang yang mengeluarkan air mani sehingga menjadi najis karenanya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Inilah hukum tentang
  rationale: Rumus ringkasan hukum ini paling wajar diterjemahkan dengan kopula tersirat dan frasa 'hukum tentang'; 'hukum' sesuai dengan konteks ketetapan ritual dalam Imamat.
- source_word: הַזָּב
  choice: orang yang mengalami lelehan
  rationale: Bentuk partisipial ini menunjuk pada orang yang mengalami keluarnya cairan tubuh. 'Lelehan' mempertahankan istilah umum yang dipakai dalam konteks kenajisan ritual tanpa menentukan diagnosis medis.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע
  choice: dan tentang orang yang mengeluarkan air mani
  rationale: Ungkapan Ibrani secara konkret menyatakan bahwa air mani keluar darinya. Bentuk Indonesia ini alami, jelas, dan mempertahankan rujukan personal tanpa memakai istilah yang terlalu teknis.
- source_word: לְטָמְאָה בָהּ
  choice: sehingga menjadi najis karenanya
  rationale: Infinitif dapat menyatakan akibat atau tujuan. 'Sehingga' mempertahankan hubungan semantis yang cukup terbuka, sedangkan 'karenanya' merujuk pada keluarnya air mani sebagai penyebab kenajisan ritual.
theological_decisions:
- issue: Makna kenajisan
  choice: najis
  alternative: cemar
  rationale: Istilah ini menyatakan status ritual dalam hukum Imamat, bukan penilaian moral. 'Najis' merupakan padanan baku dan mudah dipahami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur ayat dipertahankan sebagai rumus ringkasan yang berlanjut ke ayat berikutnya; tanda titik dua mencerminkan kesinambungan tersebut.
