revisions:
- from: Apabila seorang perempuan mengeluarkan lelehan, dan lelehan dari tubuhnya itu berupa darah, ia berada dalam keadaan najis karena haid selama tujuh hari[a]. Setiap orang yang menyentuhnya menjadi najis sampai petang.
  to: Apabila seorang perempuan mengeluarkan cairan, dan cairan yang keluar dari tubuhnya[a] itu adalah darah, ia akan berada dalam kenajisan haid selama tujuh hari[b]. Setiap orang yang menyentuhnya akan menjadi najis sampai petang.
  rationale: Revisi mengganti “lelehan” dengan “cairan” demi kejelasan dan kelaziman bahasa Indonesia, sambil mempertahankan pengulangan leksikal antara partisip dan nomina Ibrani. Rumusan “kenajisan haid” menjaga istilah ritual secara tepat, dan bentuk “akan” mencerminkan gaya ketetapan hukum tanpa mengubah makna. Catatan baru pada “tubuhnya” mengungkapkan alternatif literal Ibrani, sedangkan catatan tentang status ritual dipertahankan.
  reviewer_model: gpt-5.6-terra
