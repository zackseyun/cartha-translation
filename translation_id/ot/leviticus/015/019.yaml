  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: id
  text: Apabila seorang perempuan mengeluarkan cairan, dan cairan yang keluar dari tubuhnya[a] itu adalah darah, ia akan berada dalam kenajisan haid selama tujuh hari[b]. Setiap orang yang menyentuhnya akan menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam daging/tubuhnya.”
    reason: lexical_alternative
  - marker: b
    text: “Kenajisan haid” di sini adalah status kenajisan ritual menurut hukum Imamat, bukan dengan sendirinya kesalahan moral.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: mengeluarkan lelehan / lelehan
  rationale: Akar זוּב menunjuk pada cairan tubuh yang mengalir atau keluar. “Lelehan” mempertahankan hubungan leksikal kedua bentuk dan cukup alami dalam konteks hukum kenajisan; frasa berikutnya menetapkan bahwa lelehan itu adalah darah.
- source_word: בִּבְשָׂרָהּ
  choice: dari tubuhnya
  rationale: Secara harfiah frasa ini dapat berarti “di dalam tubuh/dagingnya,” tetapi dalam konteks lelehan tubuh, bahasa Indonesia alami memakai “dari tubuhnya.” Arah keluarnya cairan dipahami dari konteks, bukan dari arti dasar preposisi saja.
- source_word: בְנִדָּתָהּ
  choice: berada dalam keadaan najis karena haid
  rationale: נִדָּה di dalam hukum Imamat menunjuk pada status kenajisan ritual yang berkaitan dengan menstruasi, bukan sekadar peristiwa biologisnya. Rumusan ini jelas bagi pembaca modern dan tidak menyiratkan kesalahan moral.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Ungkapan durasi langsung; “selama” membuat hubungan waktunya alami dalam bahasa Indonesia.
- source_word: כָל־הַנֹּגֵעַ בָּהּ
  choice: setiap orang yang menyentuhnya
  rationale: כָל dengan partisip menyatakan siapa pun dalam kategori tersebut. Terjemahan ini jelas dan wajar.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: Bentuk verba menyatakan bahwa orang yang menyentuh memperoleh status najis ritual. “Menjadi najis” lebih tepat daripada sekadar “najis” karena menunjukkan perubahan status.
- source_word: עַד־הָעָרֶב
  choice: sampai petang
  rationale: Padanan alami dan bermartabat untuk batas waktu hingga petang.
theological_decisions:
- issue: Istilah kenajisan dalam hukum Imamat dapat disalahpahami sebagai kesalahan moral.
  choice: Memakai “najis” dan menjelaskan dalam catatan bahwa yang dimaksud ialah status ritual.
  alternative: “cemar” atau rumusan tanpa penjelasan
  rationale: Konteks membahas status ritual menurut hukum Imamat, bukan dengan sendirinya dosa atau kesalahan moral. Istilah baku dipertahankan tanpa menambahkan penilaian moral yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan urutan gagasan Ibrani serta istilah teknis hukum kenajisan.
