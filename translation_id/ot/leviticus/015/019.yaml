review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan bahwa cairan yang dimaksud adalah darah, lamanya tujuh hari, status kenajisan ritual, dan kenajisan orang yang menyentuh perempuan itu hingga petang. Namun, “lelehan” bukan padanan Indonesia baku yang baik untuk זָבָה/זֹבָהּ dalam konteks ini dan terdengar seperti bahan yang meleleh, bukan cairan tubuh. “Cairan” lebih jelas serta mempertahankan tahap awal yang umum sebelum darah disebutkan. Frasa “dari tubuhnya” dapat diterima secara kontekstual, tetapi catatan perlu mencatat bahwa Ibrani secara harfiah memakai “di dalam tubuh/dagingnya.”
  naturalness: “Mengeluarkan lelehan” dan nomina “lelehan” terasa tidak lazim dalam bahasa Indonesia modern. “Mengeluarkan cairan” dan “cairan yang keluar dari tubuhnya itu adalah darah” adalah baku, jelas, dan tetap mengikuti struktur penjelasan teks sumber. “Kenajisan haid” adalah istilah teknis yang lebih ringkas dan kurang berpotensi terdengar sebagai vonis pribadi daripada “keadaan najis karena haid.”
  terminology: “Kenajisan” dan “menjadi najis” secara konsisten menandai status ritual טמא/נדה tanpa memasukkan penilaian moral. “Haid” tepat untuk konteks נדה, dan catatan budaya tetap diperlukan. “Petang” merupakan padanan yang alami untuk עַד־הָעָרֶב.
