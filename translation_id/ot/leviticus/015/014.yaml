  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: id
  text: Pada hari kedelapan, ia harus mengambil bagi dirinya dua ekor burung tekukur atau dua ekor merpati muda, lalu datang ke hadapan Yahweh[a] di pintu masuk Kemah Pertemuan dan menyerahkan burung-burung itu kepada imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”; “Yahweh” adalah rekonstruksi pelafalan yang lazim digunakan.'
    reason: Menjelaskan bentuk tertulis nama ilahi dalam bahasa Ibrani serta sifat rekonstruktif pelafalan “Yahweh.”
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Ungkapan ini meneruskan urutan ketentuan dari ayat sebelumnya. Kata penghubung Ibrani tidak perlu diterjemahkan secara kaku sebagai “dan” pada awal kalimat Indonesia.
- source_word: יִקַּח לוֹ
  choice: ia harus mengambil bagi dirinya
  rationale: Bentuk verba menyatakan kewajiban dalam ketentuan hukum, sedangkan לוֹ dipertahankan sebagai “bagi dirinya” untuk menunjukkan bahwa orang itu sendiri menyediakan burung-burung tersebut.
- source_word: שְׁתֵּי תֹרִים
  choice: dua ekor burung tekukur
  rationale: תֹרִים menunjuk kepada burung tekukur; kata penggolong “ekor” menghasilkan ungkapan Indonesia yang alami.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: atau dua ekor anak burung merpati
  rationale: Ungkapan harfiah “anak-anak merpati” berarti burung merpati yang masih muda dan diterjemahkan secara wajar dalam bahasa Indonesia.
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: lalu datang ke hadapan Yahweh
  rationale: Rangkaian tindakan hukum diteruskan dengan “lalu”; לִפְנֵי dipertahankan sebagai “ke hadapan,” dan nama ilahi diterjemahkan “Yahweh.”
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: Secara harfiah frasa ini menyatakan gerak menuju pintu masuk. Dalam susunan Indonesia, “di pintu masuk” secara alami menunjukkan lokasi orang itu menghadap Yahweh tanpa mengubah tempat tujuannya.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: dan menyerahkan burung-burung itu kepada imam
  rationale: נתן dalam konteks pemindahan benda kepada imam dapat diterjemahkan alami sebagai “menyerahkan”; objek jamak diperjelas sebagai “burung-burung itu.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian tersebut, sementara catatan kaki memberitahukan kebiasaan penerjemahan tradisional tanpa menetapkan pelafalan kuno sebagai sesuatu yang sepenuhnya pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “Kemah Pertemuan” dipakai sebagai padanan transparan dan lazim bagi אֹהֶל מוֹעֵד. Struktur satu kalimat mempertahankan rangkaian prosedural teks Ibrani tanpa terasa kaku.
