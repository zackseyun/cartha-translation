language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: id
  text: Kalian harus memperingatkan orang Israel[a] mengenai kenajisan mereka, supaya mereka tidak mati dalam kenajisan mereka dengan menajiskan Kemah Suci-Ku yang ada di tengah-tengah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; dapat juga diterjemahkan “Bani Israel.”
    reason: Menjelaskan bentuk harfiah ungkapan Ibrani dan alternatif tradisionalnya, sementara teks utama memakai sebutan kolektif yang alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: Kalian harus memperingatkan
  rationale: Bentuk Hifil dari זהר di sini menyatakan tindakan memberi peringatan. Kata ganti jamak dipertahankan karena verba Ibrani berpersona kedua jamak dan konteksnya menyapa Musa serta Harun.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak lelaki Israel' berfungsi sebagai sebutan kolektif bagi bangsa Israel. 'Orang Israel' alami dalam bahasa Indonesia dan tidak mempersempit acuannya hanya kepada laki-laki.
- source_word: מִטֻּמְאָתָם
  choice: mengenai kenajisan mereka
  rationale: Dengan verba 'memperingatkan', preposisi מִן menunjuk pada perkara atau bahaya yang menjadi pokok peringatan. 'Mengenai' menyampaikan hubungan ini secara wajar.
- source_word: טֻמְאָה
  choice: kenajisan
  rationale: '''Kenajisan'' mempertahankan kategori ketahiran ritual dalam Imamat dan tidak menyamakannya begitu saja dengan dosa moral.'
- source_word: וְלֹא יָמֻתוּ
  choice: supaya mereka tidak mati
  rationale: Klausa ini menyatakan tujuan pencegahan dari peringatan yang diberikan.
- source_word: בְּטֻמְאָתָם
  choice: dalam kenajisan mereka
  rationale: Preposisi ב dipertahankan sebagai penanda keadaan ketika kematian dapat menimpa mereka, tanpa memutuskan secara berlebihan apakah kenajisan itu juga dinyatakan sebagai sebab langsung.
- source_word: בְּטַמְּאָם
  choice: karena menajiskan
  rationale: Infinitif dengan ב menyatakan keadaan atau dasar yang terkait dengan bahaya kematian. 'Karena menajiskan' alami dalam bahasa Indonesia dan mempertahankan tindakan pencemaran terhadap Kemah Suci.
- source_word: מִשְׁכָּנִי
  choice: Kemah Suci-Ku
  rationale: Dalam konteks Pentateukh, מִשְׁכָּן menunjuk pada kediaman kudus Allah berupa Kemah Suci; pilihan ini mempertahankan acuan konkret tersebut.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: yang ada di tengah-tengah mereka
  rationale: Terjemahan ini mempertahankan penekanan pada kehadiran kediaman Allah di tengah komunitas Israel.
theological_decisions:
- issue: Istilah kenajisan ritual dalam Imamat
  choice: Menggunakan 'kenajisan' untuk טֻמְאָה.
  alternative: ketidakmurnian; kecemaran
  rationale: '''Kenajisan'' mengungkapkan kategori ritual dalam hukum Imamat tanpa mengubahnya menjadi pernyataan umum tentang kesalahan moral.'
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: Bani Israel; anak-anak Israel
  rationale: Dalam konteks ini ungkapan tersebut menunjuk kepada umat Israel secara kolektif. Terjemahan idiomatis tidak menghapus makna sumber dan menghindari kesan bahwa hanya laki-laki yang dimaksud.
- issue: Hubungan kenajisan, pencemaran Kemah Suci, dan kematian
  choice: Mempertahankan urutan bahwa peringatan mencegah kematian dalam keadaan najis akibat menajiskan Kemah Suci.
  alternative: Menafsirkan kenajisan semata-mata sebagai dosa moral atau menyatakan semua orang najis otomatis dihukum mati.
  rationale: Ayat ini menghubungkan bahaya kematian dengan pencemaran kediaman Allah; terjemahan tidak memperluasnya menjadi doktrin umum yang melampaui konteks ritual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk mempertahankan sapaan orang kedua jamak kepada Musa dan Harun; 'Kemah Suci-Ku' memakai huruf kapital sesuai acuan khusus kepada kediaman kudus Allah.
