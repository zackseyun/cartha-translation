source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: id
  text: Kemudian imam harus mempersembahkan yang seekor sebagai kurban penghapus dosa[a] dan yang seekor lagi sebagai kurban bakaran. Imam harus mengadakan pendamaian bagi perempuan itu di hadapan Yahweh karena cairan najis yang keluar dari tubuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban penyucian”; istilah Ibrani חַטָּאת dalam peraturan kurban Imamat dapat menekankan fungsi penyucian kurban tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: harus mempersembahkan
  rationale: Walaupun verba ini secara umum berarti ‘melakukan/membuat’, dalam konteks kurban dengan objek חַטָּאת dan עֹלָה, ‘mempersembahkan’ menyampaikan tindakan ritual secara wajar dalam bahasa Indonesia.
- source_word: הָאֶחָד חַטָּאת
  choice: yang seekor sebagai kurban penghapus dosa
  rationale: חַטָּאת di sini menunjuk pada jenis kurban. ‘Kurban penghapus dosa’ merupakan istilah yang dikenal luas, sedangkan fungsi penyuciannya dipertahankan sebagai alternatif dalam catatan kaki.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: dan yang seekor lagi sebagai kurban bakaran
  rationale: Pengulangan הָאֶחָד bersifat distributif; ‘yang seekor lagi’ alami karena konteks sebelumnya menyebut dua ekor burung. עֹלָה diterjemahkan dengan istilah baku ‘kurban bakaran’.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: Imam harus mengadakan pendamaian bagi perempuan itu
  rationale: ‘Mengadakan pendamaian’ mempertahankan bobot ritual-teologis כפר, sedangkan ‘bagi perempuan itu’ menyampaikan עָלֶיהָ tanpa menentukan mekanisme pendamaian lebih jauh.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: ‘Di hadapan’ mempertahankan latar kehadiran dan ibadah, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: karena lelehannya yang najis
  rationale: ‘Lelehan’ menyampaikan זוֹב sebagai aliran atau cairan tubuh yang keluar. Ungkapan ‘yang najis’ merujuk pada kenajisan ritual dalam konteks pasal ini, dan ‘karena’ menyampaikan hubungan sebab yang dapat dinyatakan oleh מִן setelah כפר.
theological_decisions:
- issue: Makna חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban penyucian
  rationale: Istilah ini jelas menunjuk pada kategori kurban, tetapi חַטָּאת dalam konteks Imamat juga dapat menonjolkan fungsi penyucian. Alternatif itu dicatat agar nuansa leksikal tidak dihilangkan.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; ‘Yahweh’ mempertahankan nama perjanjian tersebut.
- issue: Sifat kenajisan dalam frasa זּוֹב טֻמְאָתָהּ
  choice: lelehannya yang najis
  alternative: lelehan kenajisannya
  rationale: Pilihan utama lebih alami dalam bahasa Indonesia dan tetap menyatakan status kenajisan ritual, tanpa mengubahnya menjadi penilaian moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Yang seekor ... yang seekor lagi’ mengikuti konteks dua ekor burung, sedangkan ‘perempuan itu’ memperjelas rujukan pronomina feminin tanpa menambah identitas baru.
