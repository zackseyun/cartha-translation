id: LEV.14.22
reference: Leviticus 14:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: id
  text: dan dua ekor burung tekukur atau dua ekor anak merpati, sesuai dengan kemampuannya. Yang seekor harus menjadi kurban penghapus dosa[a] dan yang lain menjadi kurban bakaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban pemurnian.” Istilah Ibrani ini dapat menunjuk kurban yang digunakan untuk pemurnian dalam konteks ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁתֵּי תֹרִים
  choice: dan dua ekor burung tekukur
  rationale: Konjungsi melanjutkan daftar persembahan dari ayat sebelumnya; תֹרִים secara khusus menunjuk burung tekukur.
- source_word: א֤וֹ
  choice: atau
  rationale: Menyatakan pilihan di antara dua jenis burung yang diperbolehkan.
- source_word: שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה
  choice: dua ekor anak merpati
  rationale: Ungkapan Ibrani secara idiomatis menunjuk merpati muda; 'anak merpati' mempertahankan nuansa usianya.
- source_word: אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑וֹ
  choice: sesuai dengan kemampuannya
  rationale: Ungkapan harfiah tentang apa yang dapat dicapai tangannya menyatakan kemampuan ekonomi orang tersebut.
- source_word: וְ/הָיָ֤ה אֶחָד֙
  choice: Yang seekor harus menjadi
  rationale: Rumusan ini menyampaikan pembagian fungsi kedua burung secara jelas dan alami dalam bahasa Indonesia.
- source_word: חַטָּ֔את
  choice: kurban penghapus dosa
  rationale: Istilah baku yang mudah dipahami untuk persembahan ini, sambil mempertahankan alternatif nuansa pemurnian dalam catatan kaki.
- source_word: וְ/הָ/אֶחָ֖ד
  choice: dan yang lain
  rationale: Artikel pada bentuk Ibrani membedakan burung yang tersisa dari burung pertama.
- source_word: עֹלָֽה
  choice: kurban bakaran
  rationale: Istilah Indonesia yang mapan bagi persembahan yang dibakar seluruhnya; lebih idiomatis daripada terjemahan etimologis 'kurban kenaikan'.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kurban Imamat
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Kata ini dapat menunjuk kurban yang berkaitan dengan dosa sekaligus pemurnian ritual. Teks utama memakai istilah yang umum dan dapat dikenali, sedangkan catatan kaki mempertahankan nuansa ritual yang mungkin dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Penggolong 'ekor' dipakai secara wajar untuk burung; struktur kalimat dibuat jelas tanpa menghilangkan hubungan dengan daftar persembahan pada ayat sebelumnya.
