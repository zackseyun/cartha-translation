  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: id
  text: Siapa pun yang masuk ke dalam rumah itu selama rumah itu ditutup[a] akan menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “diasingkan” atau “dikarantina.” Kata Ibrani menunjuk pada rumah yang ditutup atau dibatasi di bawah ketetapan imam untuk diperiksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: Siapa pun yang masuk
  rationale: Artikel dengan bentuk partisip berfungsi substantival dan bersifat umum. Ungkapan ini menyampaikan daya hukum yang berlaku bagi setiap orang secara alami dalam bahasa Indonesia.
- source_word: אֶל הַ/בַּיִת
  choice: ke dalam rumah itu
  rationale: Konstruksi בוא dengan אֶל menyatakan gerak masuk. 'Ke dalam rumah itu' mempertahankan arah gerak serta penentuan rumah tertentu oleh artikel Ibrani.
- source_word: כָּל יְמֵי
  choice: selama
  rationale: Frasa ini mencakup seluruh jangka waktu pengasingan. 'Selama' menyampaikannya secara ringkas dan wajar tanpa mengharuskan ungkapan harfiah 'sepanjang hari-hari'.
- source_word: הִסְגִּיר אֹתוֹ
  choice: rumah itu diasingkan
  rationale: Dalam tata cara kenajisan Imamat 13–14, סגר menunjuk pada tindakan menutup atau mengasingkan objek di bawah pembatasan imam untuk pemeriksaan. Bentuk pasif alami mempertahankan fokus pada keadaan rumah tanpa menyisipkan subjek yang tidak dinyatakan dalam klausa ini.
- source_word: יִטְמָא
  choice: akan menjadi najis
  rationale: Kata kerja ini menyatakan masuk ke dalam keadaan najis secara ritual sebagai akibat memasuki rumah tersebut. 'Akan menjadi najis' memperjelas perubahan status tanpa menambahkan gagasan moral.
- source_word: עַד הָ/עָרֶב
  choice: sampai petang
  rationale: Ini merupakan ungkapan baku untuk batas waktu kenajisan ritual sementara. 'Sampai petang' alami dalam bahasa Indonesia dan setia pada jangka waktunya.
theological_decisions:
- issue: Sifat kenajisan
  choice: najis
  alternative: cemar
  rationale: Dalam konteks hukum ritual Imamat, טמא menunjuk pada status kenajisan ritual, bukan kesalahan moral. Istilah 'najis' mempertahankan kategori teknis Alkitab tanpa menafsirkannya sebagai dosa.
- issue: Pelaku tindakan pengasingan tidak disebutkan secara eksplisit
  choice: rumah itu diasingkan
  alternative: imam mengasingkan rumah itu
  rationale: Bentuk Ibrani secara gramatikal dapat dipahami dengan pelaku tersirat dari konteks, tetapi ayat ini tidak menyebut 'imam' secara eksplisit. Bentuk pasif menghindari penambahan dan mempertahankan ketegangan gramatikal tersebut.
translation_notes:
  register: Bahasa hukum-ritual yang modern, jelas, dan bermartabat. 'Siapa pun' mempertahankan cakupan umum; 'diasingkan' dipilih agar tidak memberi kesan karantina medis modern, sedangkan catatan kaki mencatat alternatif leksikal yang lebih harfiah.
