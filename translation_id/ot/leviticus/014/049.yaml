id: LEV.14.49
reference: Leviticus 14:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: id
  text: Untuk menyucikan rumah itu, imam harus mengambil dua ekor burung, kayu aras, benang merah tua,[a] dan hisop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: benang kirmizi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: imam harus mengambil
  rationale: Bentuk verba dalam rangkaian petunjuk ritual menyatakan tindakan yang diwajibkan. Subjek 'imam' dibuat eksplisit dari konteks terdekat agar rujukannya jelas dalam bahasa Indonesia.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: untuk menyucikan rumah itu
  rationale: Dalam konteks ritual, bentuk piel חטא berarti membersihkan atau menyucikan dari kenajisan. Terjemahan ini tidak menyiratkan bahwa rumah melakukan dosa dan tidak menambahkan konsep pendamaian yang tidak dinyatakan secara eksplisit.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: dua ekor burung
  rationale: Bahasa Indonesia lazim memakai penggolong 'ekor' untuk burung. Kata 'hidup' tidak ditambahkan karena tidak terdapat dalam ayat ini.
- source_word: וְעֵץ אֶרֶז
  choice: kayu aras
  rationale: '''Kayu aras'' merupakan padanan Indonesia yang lazim dan jelas untuk bahan ritual ini.'
- source_word: וּשְׁנִי תוֹלַעַת
  choice: benang merah tua
  rationale: Ungkapan Ibrani ini menunjuk pada bahan benang atau serat yang diwarnai merah tua; 'benang merah tua' alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: וְאֵזֹב
  choice: hisop
  rationale: '''Hisop'' mempertahankan sebutan tradisional yang dikenal luas, sementara identifikasi botanis tepatnya tetap tidak pasti.'
theological_decisions:
- issue: Makna ritual לְחַטֵּא ketika objeknya rumah
  choice: untuk menyucikan rumah itu
  alternative: untuk membersihkan rumah itu dari dosa/kenajisan; untuk mengadakan pendamaian bagi rumah itu
  rationale: Konteks membicarakan pemurnian ritual sebuah rumah yang terkena cemaran. 'Menyucikan' mempertahankan dimensi ritualnya tanpa memperlakukan rumah sebagai pelaku dosa atau memasukkan mekanisme pendamaian yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan tujuan ditempatkan di awal agar kalimat prosedural mengalir alami. Istilah ritual dipertahankan tanpa penjelasan doktrinal tambahan.
