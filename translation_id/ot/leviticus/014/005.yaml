lexical_decisions:
- source_word: וְצִוָּה
  choice: Lalu ... harus memerintahkan
  rationale: Waw dengan bentuk perfektif dalam rangkaian petunjuk ritual menyatakan urutan dan kewajiban; bentuk ini alami dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku untuk כֹּהֵן dalam konteks ibadah dan hukum Israel.
- source_word: וְשָׁחַט
  choice: agar ... disembelih
  rationale: Walaupun verba Ibraninya aktif, sesudah 'memerintahkan' konstruksi pasif menyampaikan tindakan yang diperintahkan secara alami tanpa memastikan bahwa imam sendiri pelakunya.
- source_word: אֶת־הַצִּפּוֹר הָאֶחָת
  choice: burung yang satu
  rationale: Menunjuk satu dari dua burung yang telah disebutkan dalam konteks, sekaligus mempertahankan daya pembeda הָאֶחָת.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: di atas sebuah wadah tanah liat
  rationale: Dalam konteks penyembelihan, darah diarahkan kepada atau masuk ke wadah; 'di atas' bekerja bersama frasa berikut dan menghasilkan gambaran ritual yang alami dalam bahasa Indonesia.
- source_word: עַל מַיִם חַיִּים
  choice: yang berisi air segar
  rationale: Secara harfiah berarti 'air hidup', yaitu air segar yang berasal dari sumber mengalir. 'Yang berisi' memperjelas hubungan air dengan wadah tanpa mengubah unsur ritual.
theological_decisions:
- issue: Makna מַיִם חַיִּים dalam ritual pentahiran
  choice: air segar
  alternative: air hidup; air mengalir
  rationale: Dalam konteks ini frasa tersebut terutama menunjuk air alami yang segar dan bukan air tergenang. Terjemahan utama dibuat mudah dipahami, sementara ungkapan harfiah dan kemungkinan 'air mengalir' dipertahankan dalam catatan agar gaung dan ambiguitas sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual dibuat jelas bagi pembaca umum; 'wadah tanah liat' lebih alami daripada istilah teknis seperti 'bejana tembikar'.
