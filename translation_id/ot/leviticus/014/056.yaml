  text: וְ/לַ/שְׂאֵ֥ת וְ/לַ/סַּפַּ֖חַת וְ/לַ/בֶּהָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/056.yaml
  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: id
  text: dan untuk benjolan[a], untuk ruam[b], dan untuk bercak cerah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian kulit yang meninggi” atau “pembengkakan”; arti dermatologis tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “kelainan kulit”, “bercak kulit”, atau “keropeng”; arti dermatologis tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: c
    text: Atau “bercak mengilap”; dalam konteks ini dapat berupa bercak putih.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: benjolan
  rationale: Dalam konteks pemeriksaan kulit di Imamat 13–14, kata ini menunjuk pada bagian kulit yang meninggi. “Benjolan” alami dalam bahasa Indonesia dan tidak menambahkan diagnosis tertentu.
- source_word: סַפַּחַת
  choice: ruam
  rationale: Istilah ini menunjuk pada kelainan atau bercak kulit, tetapi arti dermatologis tepatnya tidak pasti. “Ruam” merupakan padanan modern yang umum dan cukup netral.
- source_word: בֶּהֶרֶת
  choice: bercak cerah
  rationale: Kata ini menekankan tampilan bercahaya atau cerah pada kulit. “Bercak cerah” mempertahankan unsur tersebut tanpa memastikan bahwa warnanya selalu putih.
- source_word: וְ/לַ
  choice: dan untuk / untuk
  rationale: Gabungan konjungsi dan preposisi melanjutkan daftar jenis kondisi yang dicakup oleh petunjuk sebelumnya. Pengulangan “untuk” mempertahankan corak daftar hukum Ibrani tanpa membuat bahasa Indonesia terasa kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas, dengan gaya daftar hukum yang tetap jelas. Terjemahan mempertahankan bentuk fragmen yang melanjutkan ayat sebelumnya. Penanda catatan kaki diselaraskan langsung dengan masing-masing istilah Ibrani.
