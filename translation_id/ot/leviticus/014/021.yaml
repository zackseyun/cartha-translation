  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: id
  text: Namun, jika orang itu miskin dan tidak mampu[a], ia harus mengambil seekor anak domba jantan sebagai kurban penebus salah, sebagai persembahan unjukan, guna mengadakan pendamaian baginya, serta sepersepuluh efa tepung halus yang dicampur dengan minyak sebagai kurban sajian, dan satu log[b] minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “tangannya tidak mencapai”; maksudnya, kemampuannya tidak mencukupi.
    reason: lexical_alternative
  - marker: b
    text: Log adalah satuan kecil untuk mengukur cairan yang digunakan dalam hukum ritual Israel.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: miskin
  rationale: Kata ini menunjuk kepada orang yang berkekurangan secara ekonomi; “miskin” merupakan padanan Indonesia yang langsung dan wajar dalam konteks hukum ini.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: tidak mampu
  rationale: Ungkapan Ibrani harfiahnya menyatakan bahwa “tangannya tidak mencapai,” yakni kemampuan ekonominya tidak mencukupi. “Tidak mampu” menyampaikan makna idiomatis itu secara alami tanpa mempersempitnya pada satu harga tertentu.
- source_word: כֶּבֶשׂ אֶחָד
  choice: seekor anak domba jantan
  rationale: כֶּבֶשׂ secara khusus menunjuk pada anak domba jantan; unsur jenis kelaminnya dipertahankan karena penting dalam ketentuan kurban.
- source_word: אָשָׁם
  choice: kurban penebus salah
  rationale: Istilah ini adalah kategori kurban khusus dalam hukum keimaman. “Kurban penebus salah” membedakannya dari kurban penghapus dosa dan tetap mengungkapkan kaitannya dengan kesalahan serta pemulihan.
- source_word: לִתְנוּפָה
  choice: untuk diunjukkan
  rationale: Bentuk ini menunjuk pada tindakan ritual mengunjukkan kurban. Susunan tersebut menjelaskan perlakuan terhadap anak domba yang menjadi kurban penebus salah, bukan menjadikannya kurban kedua yang terpisah.
- source_word: לְכַפֵּר עָלָיו
  choice: guna mengadakan pendamaian baginya
  rationale: Padanan ini mempertahankan daya ritual-teologis כפר dalam konteks keimaman tanpa menentukan suatu teori khusus tentang cara kerja pendamaian.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: sepersepuluh efa tepung halus
  rationale: עִשָּׂרוֹן adalah ukuran sepersepuluh yang dalam peraturan kurban dipahami sebagai sepersepuluh efa. Penyebutan “efa” membuat satuannya jelas bagi pembaca.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Ungkapan ini secara langsung menggambarkan tepung yang telah dicampur dengan minyak; bentuk Indonesia ini jelas dan alami.
- source_word: לְמִנְחָה
  choice: sebagai kurban sajian
  rationale: Dalam Imamat, מִנְחָה adalah kategori kurban berbahan hasil bumi atau tepung. “Kurban sajian” mempertahankan istilah ritual yang sudah dikenal dan membedakannya dari kurban hewan.
- source_word: לֹג שָׁמֶן
  choice: satu log minyak
  rationale: לֹג adalah satuan khusus untuk cairan. Nama satuannya dipertahankan karena konversi modernnya tidak sepenuhnya pasti dan catatan kaki memberi penjelasan yang diperlukan.
theological_decisions:
- issue: Penerjemahan istilah kurban dalam hukum keimaman
  choice: 'Mempertahankan kategori-kategori khusus: “kurban penebus salah,” tindakan “diunjukkan,” “mengadakan pendamaian,” dan “kurban sajian.”'
  alternative: Menggunakan uraian umum seperti “kurban pemulihan,” “dipersembahkan secara ritual,” atau sekadar “persembahan.”
  rationale: Istilah-istilah sumber membedakan tindakan dan kategori ritual tertentu. Padanan yang dipilih menjaga ketepatan itu tanpa memasukkan penafsiran denominasi tertentu.
- issue: Hubungan לִתְנוּפָה dengan kurban penebus salah
  choice: Menerjemahkannya “untuk diunjukkan” sebagai tindakan ritual terhadap anak domba itu.
  alternative: Menerjemahkannya “sebagai persembahan unjukan,” yang dapat memberi kesan bahwa ada kategori kurban terpisah.
  rationale: Secara sintaksis, anak domba tersebut adalah kurban penebus salah yang dikenai ritus pengunjukan. Rumusan verbal mempertahankan hubungan ini dengan lebih tepat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual dipertahankan secara konsisten, sedangkan idiom ekonomi Ibrani diterjemahkan secara alami dan dijelaskan dalam catatan kaki. Penanda catatan [a] ditempatkan setelah idiom yang dijelaskan, dan [b] setelah satuan “log” yang menjadi pokok catatan.
