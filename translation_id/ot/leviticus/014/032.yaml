  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: id
  text: Inilah hukum bagi orang yang terkena penyakit kulit[a] dan tidak mampu menyediakan apa yang diperlukan untuk pentahirannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani צָרָעַת secara tradisional diterjemahkan “kusta”, tetapi dalam Kitab Imamat cakupannya lebih luas daripada penyakit Hansen dan menunjuk pada berbagai kelainan serius yang menimbulkan kenajisan ritual.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tangannya tidak mencapai dalam pentahirannya”; ini adalah ungkapan yang berarti bahwa ia tidak mempunyai cukup kemampuan untuk menyediakan persembahan pentahiran yang biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: hukum
  rationale: Dalam bahan keimaman, תּוֹרָה menunjuk pada ketentuan atau prosedur yang ditetapkan; “hukum” ringkas, wajar, dan sesuai dengan konteks ini.
- source_word: אֲשֶׁר בּוֹ נֶגַע צָרָעַת
  choice: orang yang terkena penyakit kulit
  rationale: Ungkapan ini menyatakan bahwa orang tersebut mengalami נֶגַע צָרָעַת. “Penyakit kulit” menghindari penyamaan yang terlalu sempit dengan penyakit Hansen, sedangkan “terkena” menyampaikan adanya kelainan atau serangan penyakit tanpa menyatakan bahwa penyakit itu pasti menular.
- source_word: אֲשֶׁר לֹא תַשִּׂיג יָדוֹ
  choice: tidak mampu menyediakan
  rationale: Secara harfiah tangan orang itu “tidak mencapai”; idiom ini berarti sumber dayanya tidak mencukupi untuk memperoleh persembahan yang biasanya diperlukan.
- source_word: בְּטָהֳרָתוֹ
  choice: apa yang diperlukan untuk pentahirannya
  rationale: Konteks ayat-ayat sebelumnya menunjukkan biaya atau persembahan bagi proses pemulihan kemurnian ritual. “Pentahiran” mempertahankan nuansa ritual, dan perluasan “apa yang diperlukan” membuat maksud idiomnya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat צָרָעַת
  choice: penyakit kulit
  alternative: kusta
  rationale: Istilah Ibrani ini mencakup kategori kelainan yang lebih luas daripada penyakit Hansen; terjemahan tidak menyamakan kategori ritual kuno itu dengan satu diagnosis modern.
- issue: Makna pentahiran
  choice: pentahiran ritual
  alternative: pengampunan dosa atau penyembuhan medis
  rationale: Konteks membahas prosedur dan persembahan untuk pemulihan status tahir. Terjemahan tidak mengubahnya menjadi pernyataan bahwa kemiskinan menghalangi pengampunan atau bahwa persembahan itu sendiri merupakan terapi medis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pentahiran” dipertahankan sebagai istilah ritual yang lebih tepat daripada “pembersihan”, sementara susunan kalimat dibuat alami dan mudah dipahami.
