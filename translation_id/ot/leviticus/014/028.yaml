  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: id
  text: Lalu imam harus mengoleskan sedikit minyak yang ada di telapak tangannya pada cuping telinga kanan orang yang sedang ditahirkan, pada ibu jari tangan kanannya, dan pada ibu jari kaki kanannya, di tempat darah kurban penebus salah itu telah dioleskan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַן
  choice: harus mengoleskan
  rationale: Dalam tindakan ritual ini, נתן berarti menaruh atau membubuhkan minyak pada anggota tubuh; 'mengoleskan' menyampaikan tindakan itu secara alami dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: מִן הַשֶּׁמֶן
  choice: sedikit minyak
  rationale: 'מִן bersifat partitif: imam mengambil sebagian dari minyak tersebut. ''Sedikit minyak'' merupakan ungkapan Indonesia yang alami.'
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: yang ada di telapak tangannya
  rationale: כַּף menunjuk pada telapak atau lekuk tangan imam; konteks langsung menetapkan bahwa pronomina itu merujuk kepada imam.
- source_word: תְּנוּךְ אֹזֶן
  choice: cuping telinga
  rationale: Dalam konteks ritual imamat, תְּנוּךְ menunjuk pada cuping telinga; ini istilah anatomi Indonesia yang jelas dan lazim.
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan
  rationale: Partisipel hitpael mempertahankan gagasan proses pentahiran ritual yang sedang dijalani, bukan semata-mata keadaan yang sudah selesai.
- source_word: הַיְמָנִית
  choice: kanan
  rationale: Padanan anatomi Indonesia yang langsung dan alami pada ketiga kemunculannya.
- source_word: בֹּהֶן יָדוֹ
  choice: ibu jari tangan kanannya
  rationale: בֹּהֶן pada tangan berarti ibu jari.
- source_word: בֹּהֶן רַגְלוֹ
  choice: ibu jari kaki kanannya
  rationale: בֹּהֶן pada kaki berarti ibu jari kaki; ungkapan ini alami dalam bahasa Indonesia.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: di tempat darah kurban penebus salah itu telah dioleskan
  rationale: Ungkapan ini merujuk pada lokasi tubuh tempat darah kurban sebelumnya dibubuhkan. Bentuk eksplisit ini alami dan mencegah frasa nominal yang kaku tanpa menambahkan lokasi baru.
theological_decisions:
- issue: Penerjemahan אָשָׁם
  choice: kurban penebus salah
  alternative: kurban penghapus kesalahan; kurban ganti rugi
  rationale: אָשָׁם dapat menunjuk pada kesalahan, kewajiban ganti rugi, dan kurban yang terkait. 'Kurban penebus salah' mempertahankan istilah kurban yang dikenal dan tidak membatasi maknanya hanya pada aspek ganti rugi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ditahirkan' dipertahankan sebagai istilah ritual yang lebih tepat daripada 'dibersihkan', sedangkan struktur kalimat dibuat alami dan mudah dipahami.
