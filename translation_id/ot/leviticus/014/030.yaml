  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: id
  text: Ia harus mempersembahkan seekor burung tekukur atau seekor burung merpati muda, sesuai dengan kemampuannya[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari apa yang dicapai tangannya,” sebuah ungkapan Ibrani yang berarti sesuai dengan apa yang sanggup ia biayai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: Ia harus mempersembahkan
  rationale: Dalam konteks kurban, עשה berarti melaksanakan atau mempersembahkan kurban. Pilihan ini menyampaikan fungsi kultisnya secara alami dalam bahasa Indonesia.
- source_word: אֶת הָאֶחָד
  choice: seekor
  rationale: Ungkapan ini menunjuk pada satu ekor yang dipilih dari dua jenis burung yang disebutkan; penggolong 'seekor' alami bagi hewan dalam bahasa Indonesia.
- source_word: מִן הַתֹּרִים
  choice: burung tekukur
  rationale: תֹּרִים secara khusus menunjuk pada burung tekukur dalam ketentuan persembahan, bukan burung merpati secara umum.
- source_word: אוֹ מִן בְּנֵי הַיּוֹנָה
  choice: atau seekor anak burung merpati
  rationale: בְּנֵי הַיּוֹנָה merupakan ungkapan baku bagi anak burung merpati. Pengulangan 'seekor' memperjelas bahwa hanya satu burung yang dipersembahkan.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: sesuai dengan kemampuannya
  rationale: Secara harfiah berarti 'dari apa yang dicapai tangannya', sebuah idiom Ibrani tentang kemampuan atau kecukupan ekonomis. Terjemahan ini alami dan mempertahankan maksudnya.
