translation:
  language: id
  text: Inilah hukum mengenai setiap kasus penyakit kulit yang disebut tsaraat[a] dan mengenai kelainan kulit bersisik[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani tsaraat mencakup berbagai keadaan yang dinilai menurut ketentuan kenajisan; istilah ini tidak identik dengan penyakit Hansen yang kini biasa disebut kusta.
    reason: lexical_clarification
  - marker: b
    text: 'Istilah Ibrani neteq menunjuk pada kelainan tertentu, terutama yang dibahas pada kulit kepala atau daerah janggut, tetapi padanan medisnya tidak dapat dipastikan. Terjemahan lain: “kudis pada kepala atau janggut.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Inilah hukum
  rationale: Ungkapan penutup ini merangkum ketentuan yang berlaku. “Inilah hukum” alami dalam bahasa Indonesia dan mempertahankan fungsi hukum/prosedural תּוֹרָה dalam konteks Imamat 13–14.
- source_word: לְכָל נֶגַע
  choice: mengenai setiap kasus
  rationale: לְ menyatakan pokok atau cakupan hukum, sedangkan נֶגַע di sini menunjuk pada setiap kejadian atau kasus yang harus diperiksa, bukan wabah dalam pengertian modern.
- source_word: הַצָּרַעַת
  choice: penyakit kulit yang disebut tsaraat
  rationale: Transliterasi mempertahankan istilah Ibrani yang cakupannya tidak sama persis dengan diagnosis medis modern. Penjelas “penyakit kulit” membuatnya tetap mudah dipahami dalam konteks ayat ini tanpa menyamakannya dengan penyakit Hansen.
- source_word: וְלַנָּתֶק
  choice: dan mengenai kelainan bersisik pada kulit kepala atau janggut
  rationale: נֶתֶק adalah kelainan khusus pada bagian kepala atau janggut dalam Imamat 13:29–37. Padanan medisnya tidak pasti; terjemahan deskriptif lebih jelas daripada istilah lama atau “gatal,” yang terlalu umum.
