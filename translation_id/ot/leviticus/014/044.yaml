base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: id
  text: Kemudian imam harus datang untuk memeriksa. Jika ternyata tanda itu telah menyebar di rumah itu, itu adalah tsaraat[a] yang merusak[b] di rumah itu; rumah itu najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraat adalah istilah Ibrani untuk suatu kategori kenajisan ritual yang dapat mengenai manusia, kain, atau rumah; istilah ini tidak sama begitu saja dengan penyakit kusta modern.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “yang merusak” juga dapat dipahami sebagai “ganas” atau “menggerogoti”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Kemudian ... harus datang
  rationale: Dalam konteks hukum prosedural, bentuk ini menyatakan langkah berikutnya yang wajib dilakukan, bukan sekadar peristiwa lampau.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi pejabat kultis dalam konteks Imamat.
- source_word: וְרָאָה
  choice: memeriksanya
  rationale: Secara harfiah berarti 'melihat', tetapi di sini menunjuk pada pemeriksaan resmi untuk menentukan status kenajisan.
- source_word: וְהִנֵּה
  choice: Jika ternyata
  rationale: Mengungkapkan kondisi yang didapati sesudah pemeriksaan secara alami dalam bahasa hukum Indonesia.
- source_word: פָּשָׂה
  choice: telah menyebar
  rationale: Kata kerja ini menyatakan bahwa tanda atau gangguan tersebut meluas.
- source_word: הַנֶּגַע
  choice: tanda itu
  rationale: נגע di sini adalah gejala atau bagian terdampak yang diperiksa; 'tanda' menghindari kesan infeksi biologis yang terlalu khusus pada sebuah rumah.
- source_word: צָרַעַת
  choice: tsaraat
  rationale: Istilah Ibrani ini mencakup kategori kenajisan ritual pada manusia, kain, dan rumah. Transliterasi mempertahankan kesinambungan istilah tanpa menyamakannya dengan kusta modern atau membatasinya menjadi jamur.
- source_word: מַמְאֶרֶת
  choice: yang merusak
  rationale: Menyampaikan sifat berat atau menggerogoti tanpa memasukkan konotasi diagnosis medis modern.
- source_word: טָמֵא הוּא
  choice: rumah itu najis
  rationale: Kata ganti maskulin tunggal secara alami merujuk kepada rumah; 'najis' adalah padanan baku untuk status ritual טמא.
theological_decisions:
- issue: Makna צָרַעַת ketika diterapkan pada rumah
  choice: Memakai istilah 'tsaraat' dengan catatan penjelas
  alternative: kusta; penyakit kulit; jamur; cemaran
  rationale: Teks memakai kategori ritual yang sama untuk manusia, pakaian, dan rumah. 'Penyakit kulit' tidak cocok untuk rumah, sedangkan 'jamur' terlalu memastikan sifat fisik gangguan yang tidak ditetapkan oleh kata Ibraninya.
- issue: Acuan טָמֵא הוּא
  choice: Menjelaskan subjek sebagai 'rumah itu'
  alternative: itu najis
  rationale: Dalam bahasa Indonesia, penyebutan kembali 'rumah' memperjelas bahwa status najis dikenakan pada rumah tanpa mengubah isi proposisi Ibrani.
- issue: Daya prosedural rangkaian verba
  choice: Menggunakan 'Kemudian ... harus datang' dan kondisi 'Jika ternyata'
  alternative: 'Narasi lampau: ''Lalu imam datang dan melihat'''
  rationale: Ayat ini merupakan ketentuan prosedural bagi pemeriksaan imam, bukan laporan naratif tentang satu kejadian lampau.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersifat prosedural. 'Tsaraat' dipertahankan sebagai istilah teknis yang dijelaskan dalam catatan kaki agar tidak memberi diagnosis modern yang tidak didukung teks.
