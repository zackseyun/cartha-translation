base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: id
  text: Lalu imam harus memerintahkan agar rumah itu dikosongkan sebelum ia masuk untuk memeriksa bagian yang terkena[a], supaya segala sesuatu yang ada di dalam rumah itu tidak menjadi najis. Sesudah itu, imam harus masuk untuk memeriksa rumah tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanda itu”, “bagian yang terjangkit”, atau, menurut terjemahan tradisional, “tulah itu”. Kata Ibrani nega‘ menunjuk pada bagian atau keadaan terdampak yang diperiksa oleh imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: Lalu imam harus memerintahkan
  rationale: Dalam hukum prosedural, waw dengan bentuk perfektif menandai langkah berikutnya; “lalu” dan “harus” menyampaikan urutan serta kewajiban secara alami.
- source_word: וּפִנּוּ אֶת הַבַּיִת
  choice: agar rumah itu dikosongkan
  rationale: Verba jamak memiliki pelaku tak tentu. Bentuk pasif alami dalam bahasa Indonesia mempertahankan fokus pada isi rumah yang harus dikeluarkan tanpa menambahkan pelaku.
- source_word: בְּטֶרֶם יָבֹא הַכֹּהֵן
  choice: sebelum ia masuk
  rationale: בטרם adalah penanda waktu “sebelum”; pronomina “ia” menghindari pengulangan yang kaku dan tetap jelas merujuk kepada imam.
- source_word: לִרְאוֹת
  choice: memeriksa
  rationale: Secara harfiah berarti “melihat”, tetapi dalam konteks penilaian resmi oleh imam, “memeriksa” paling tepat menggambarkan fungsinya.
- source_word: הַנֶּגַע
  choice: bagian yang terkena
  rationale: נגע menunjuk pada bagian atau keadaan yang terdampak dan sedang diperiksa. Pilihan ini tidak memaksakan diagnosis medis modern maupun arti tradisional “wabah”.
- source_word: וְלֹא יִטְמָא
  choice: supaya ... tidak menjadi najis
  rationale: Klausa ini menyatakan tujuan pencegahan. “Menjadi najis” mempertahankan istilah ritual khas Imamat tanpa memberi kesan kesalahan moral.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: segala sesuatu yang ada di dalam rumah itu
  rationale: Ungkapan ini mencakup seluruh isi rumah, bukan rumahnya sendiri.
- source_word: וְאַחַר כֵּן
  choice: Sesudah itu
  rationale: Menandai langkah prosedural berikutnya secara jelas dan wajar.
- source_word: לִרְאוֹת אֶת הַבָּיִת
  choice: untuk memeriksa rumah tersebut
  rationale: Objek pemeriksaan kedua adalah rumah secara keseluruhan; “memeriksa” menjaga konsistensi konteks resmi.
theological_decisions:
- issue: Istilah kenajisan ritual
  choice: menjadi najis
  alternative: menjadi cemar; menjadi tidak tahir
  rationale: טמא dalam konteks ini menyatakan status kenajisan ritual, bukan dengan sendirinya dosa atau pencemaran moral. “Najis” merupakan istilah Indonesia yang ringkas dan dikenal dalam konteks hukum ritual.
- issue: Hakikat נגע pada rumah
  choice: bagian yang terkena
  alternative: tanda; infeksi; wabah
  rationale: Teks tidak menetapkan diagnosis ilmiah modern. Terjemahan ini mempertahankan keluasan makna sebagai bagian atau kondisi terdampak yang diperiksa imam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti urutan prosedural teks Ibrani, sedangkan pengulangan dikurangi secara wajar tanpa menghilangkan rujukan. Istilah “najis” dipertahankan sebagai kosakata ritual khas kitab Imamat.
