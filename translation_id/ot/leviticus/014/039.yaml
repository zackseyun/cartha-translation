  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: id
  text: Kemudian, pada hari ketujuh, imam harus kembali dan memeriksa rumah itu. Jika ternyata tanda itu telah menyebar di dinding-dinding rumah,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: harus kembali
  rationale: Bentuk perfektum dengan waw dalam rangkaian hukum menyatakan tindakan berikut yang diwajibkan.
- source_word: וְרָאָה
  choice: memeriksanya
  rationale: Dalam konteks pemeriksaan kenajisan rumah, maknanya lebih khusus daripada sekadar 'melihat'; objek tersirat dibuat eksplisit secara alami.
- source_word: הַנֶּגַע
  choice: tanda itu
  rationale: Istilah נגע menunjuk gejala atau tanda yang diperiksa pada rumah; 'tanda' menghindari kepastian medis yang tidak dinyatakan teks.
- source_word: פָשָׂה
  choice: telah menyebar
  rationale: Menunjukkan meluasnya tanda selama masa penutupan rumah.
- source_word: בְּקִירֹת הַבָּיִת
  choice: pada dinding-dinding rumah
  rationale: Mempertahankan bentuk jamak קירות dan relasi lokasi yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan וְהִנֵּה dengan klausa bersyarat dalam prosedur hukum
  choice: Jika ternyata
  alternative: dan lihatlah, tanda itu telah menyebar
  rationale: Dalam konteks ini וְהִנֵּה memperkenalkan hasil pemeriksaan yang menjadi syarat bagi tindakan pada ayat berikut; 'ternyata' mempertahankan nuansa penemuan tanpa ungkapan harfiah yang kaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat tetap terbuka dengan koma karena ayat ini merupakan protasis yang dilanjutkan oleh tindakan konsekuen dalam ayat berikutnya.
