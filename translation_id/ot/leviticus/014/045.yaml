base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: id
  text: Kemudian ia harus merobohkan rumah itu—batu-batunya, kayu-kayunya, dan seluruh lepa rumah itu[a]—lalu membawa semuanya ke luar kota, ke suatu tempat yang najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh debu rumah itu”; dalam konteks bangunan, ungkapan ini mungkin merujuk pada seluruh lepa, plester, atau adukan rumah itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ אֶת הַבַּיִת
  choice: Lalu rumah itu harus dirobohkan
  rationale: Kata נתץ menunjuk pada pembongkaran atau penghancuran bangunan. Bentuk pasif dengan modalitas kewajiban terdengar alami dalam bahasa hukum Indonesia dan tidak memaksakan identitas pelaku yang hanya tersirat dalam bentuk Ibrani maskulin tunggal.
- source_word: אֲבָנָיו
  choice: batu-batunya
  rationale: Terjemahan konkret dan langsung bagi batu-batu yang menjadi bagian rumah tersebut.
- source_word: עֵצָיו
  choice: kayu-kayunya
  rationale: Bentuk jamak berakhiran posesif mencakup seluruh unsur kayu rumah tanpa mempersempit makna hanya menjadi balok.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: seluruh lepa rumah itu
  rationale: עפר secara harfiah berarti debu atau tanah lepas, tetapi dalam konteks pengerikan dan pembongkaran rumah paling mungkin menunjuk pada bahan pelapis dinding. 'Lepa' adalah istilah bangunan Indonesia yang tepat; arti harfiahnya dicatat dalam catatan kaki.
- source_word: וְהוֹצִיא
  choice: dan semuanya harus dibawa
  rationale: Verba kausatif berarti mengeluarkan atau membawa keluar. 'Semuanya' memperjelas bahwa seluruh bahan bongkaran yang baru disebut harus dipindahkan.
- source_word: אֶל מִחוּץ לָעִיר
  choice: ke luar kota
  rationale: Menyampaikan arah pemindahan menuju tempat di luar batas kota secara alami dalam bahasa Indonesia.
- source_word: אֶל מָקוֹם טָמֵא
  choice: ke suatu tempat yang najis
  rationale: '''Najis'' mempertahankan makna ritual-legal טמא dalam konteks Imamat, bukan sekadar kotor secara fisik.'
theological_decisions:
- issue: Istilah kenajisan ritual
  choice: najis
  alternative: tidak tahir
  rationale: '''Najis'' merupakan padanan Indonesia yang ringkas dan lazim bagi טמא serta mempertahankan kerangka ritual dan hukum kitab Imamat. Pilihan ini tidak menyiratkan bahwa tempat tersebut hanya kotor secara biasa.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, sedangkan bentuk kewajiban pasif dipakai agar prosedur hukum terdengar wajar. Istilah teknis 'lepa' dijelaskan melalui catatan kaki.
