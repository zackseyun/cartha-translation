  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: id
  text: Kemudian imam harus keluar dari rumah itu ke pintu masuk rumah itu, lalu menutup rumah itu selama tujuh hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menutup akses ke rumah itu selama tujuh hari.” Kata kerja Ibrani yang digunakan dapat berarti menutup atau membatasi akses selama masa pemeriksaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Kemudian ... harus keluar
  rationale: Dalam rangkaian prosedur hukum, waw dengan bentuk qatal melanjutkan urutan tindakan. “Kemudian” menyatakan urutan itu secara alami, sedangkan “harus keluar” mempertahankan daya perintahnya.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku כֹּהֵן dalam konteks hukum Imamat; ketakrifannya tampak secara alami melalui konteks dan frasa “imam” yang telah ditentukan dalam prosedur.
- source_word: מִן הַבַּיִת
  choice: dari rumah itu
  rationale: Dengan verba “keluar”, bahasa Indonesia secara alami memakai “keluar dari”; “itu” menandai nomina tertentu.
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: ke pintu masuk rumah
  rationale: פֶּתַח berarti bukaan atau jalan masuk. “Pintu masuk” konkret dan alami tanpa mengharuskan adanya daun pintu.
- source_word: וְהִסְגִּיר
  choice: lalu menutup
  rationale: Bentuk Hifil dari סגר di sini berarti menutup atau membatasi akses terhadap rumah selama masa pemeriksaan. “Menutup” mempertahankan tindakan konkret tanpa memasukkan istilah teknis modern seperti “mengarantina”.
- source_word: אֶת הַבַּיִת
  choice: rumah itu
  rationale: Penanda objek langsung tidak diterjemahkan; nomina tertentu dinyatakan dengan “itu”.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: “Selama” menyatakan durasi secara alami dalam bahasa Indonesia.
