  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: id
  text: Lalu ia harus melepaskan burung yang hidup itu ke padang terbuka di luar kota. Dengan demikian ia harus mengadakan pendamaian bagi rumah itu[a], dan rumah itu akan menjadi tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mentahirkan rumah itu” atau “mengadakan penghapusan kenajisan bagi rumah itu.” Bahasa Ibrani memakai istilah pendamaian keimaman dalam konteks pentahiran ritual ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: Lalu ia harus melepaskan
  rationale: Bentuk piel שלח di sini menunjuk pada tindakan ritual membiarkan burung itu pergi bebas. “Melepaskan” alami dalam bahasa Indonesia, sedangkan “lalu” menyatakan urutan tindakan.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: burung yang hidup itu
  rationale: Ungkapan ini membedakan burung tersebut dari burung yang sebelumnya disembelih; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: אֶל מִחוּץ לָעִיר
  choice: di luar kota
  rationale: Frasa tersebut menunjukkan tempat tujuan yang berada di luar batas kota. Dalam konstruksi dengan “melepaskan”, “di luar kota” merupakan padanan Indonesia yang wajar.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: ke padang terbuka
  rationale: Ungkapan harfiah “ke permukaan/arah muka padang” menunjuk pada kawasan padang yang terbuka; terjemahan ini mempertahankan gambaran ruang tanpa menjadi kaku.
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: ia harus mengadakan pendamaian bagi rumah itu
  rationale: כפר merupakan istilah ritual keimaman yang bermakna mengadakan pendamaian atau penghapusan kenajisan. Padanan ini mempertahankan bahasa pendamaian yang khas, bahkan ketika objeknya adalah rumah.
- source_word: וְטָהֵר
  choice: rumah itu akan menjadi tahir
  rationale: Kata טהר menyatakan status kemurnian ritual sebagai hasil tindakan tersebut. Subjek “rumah itu” disebutkan secara eksplisit demi kejelasan, dan “tahir” mempertahankan ranah kemurnian ritual.
theological_decisions:
- issue: Makna כפר dalam konteks pentahiran ritual sebuah rumah
  choice: mengadakan pendamaian bagi rumah itu
  alternative: menahirkan rumah itu; mengadakan penghapusan bagi rumah itu
  rationale: Teks memakai istilah pendamaian keimaman untuk sebuah rumah. Terjemahan mempertahankan ketegangan teologis dan ritual tersebut tanpa membatasinya pada suatu teori pendamaian tertentu atau mereduksinya menjadi pembersihan biasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Istilah “tahir” dipertahankan karena secara ringkas menandai status kemurnian ritual, bukan sekadar kebersihan fisik.
