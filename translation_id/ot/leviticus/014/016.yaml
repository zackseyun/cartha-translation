id: LEV.14.16
reference: Leviticus 14:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/טָבַ֤ל הַ/כֹּהֵן֙ אֶת אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית וְ/הִזָּ֨ה מִן הַ/שֶּׁ֧מֶן בְּ/אֶצְבָּע֛/וֹ שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: id
  text: Imam harus mencelupkan jari kanannya ke dalam minyak yang ada di telapak tangan kirinya. Lalu, dengan jarinya ia harus memercikkan sebagian minyak itu tujuh kali di hadapan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang juga lazim diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: טָבַל
  choice: mencelupkan
  rationale: Kata kerja ini menunjuk pada tindakan memasukkan bagian tubuh atau benda ke dalam cairan. “Mencelupkan” alami dalam bahasa Indonesia dan tepat untuk tindakan ritual terhadap jari.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: jari kanannya
  rationale: Terjemahan ini langsung dan alami, sekaligus mempertahankan penentuan sisi tubuh yang penting dalam tata ritual.
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: ke dalam minyak yang ada di telapak tangan kirinya
  rationale: Sesudah kata kerja “mencelupkan”, preposisi Ibrani מִן paling alami diungkapkan sebagai “ke dalam” dalam bahasa Indonesia. כַּף secara khusus merujuk pada telapak tangan.
- source_word: הִזָּה
  choice: memercikkan
  rationale: Dalam konteks ritual keimaman, kata ini menunjuk pada pemercikan cairan secara teratur. “Memercikkan” merupakan istilah Indonesia yang jelas dan sesuai.
- source_word: בְּאֶצְבָּעוֹ
  choice: dengan jarinya
  rationale: Preposisi בְּ menyatakan alat atau sarana; frasa ini mempertahankan bahwa pemercikan dilakukan dengan jari imam.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Jumlah ini diterjemahkan secara harfiah karena hitungannya memiliki arti penting dalam pelaksanaan ritual.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: “Di hadapan” mempertahankan ungkapan kultis tentang tindakan yang dilakukan dalam kehadiran Allah, sedangkan nama ilahi ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu, sementara catatan kaki mengakui padanan penghormatan yang lazim dipakai dalam terjemahan Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat dibagi menjadi dua kalimat agar urutan kedua tindakan ritual mudah dipahami tanpa mengubah hubungan antarklausanya.
