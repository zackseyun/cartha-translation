  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/033.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa dan Harun:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Mencatat bentuk Ibrani dan padanan tradisional dari nama ilahi.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif ini memperkenalkan peristiwa tutur baru. Dalam bahasa Indonesia Alkitabiah yang tetap modern, “berfirman” merupakan padanan alami ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kepada Musa dan Harun
  rationale: Preposisi אֶל menandai pihak yang disapa. Pengulangan preposisi sebelum Harun tidak perlu diulang dalam bahasa Indonesia karena cakupan “kepada” atas kedua nama sudah jelas.
- source_word: לֵאמֹר
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Infinitif ini merupakan formula pengantar tuturan langsung. Dalam bahasa Indonesia, fungsi tersebut sudah tersampaikan secara alami oleh “berfirman” dan tanda baca; menerjemahkannya sebagai “dengan mengatakan” akan terasa kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memakai bentuk alih aksara alternatif.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Formula Ibrani dipadatkan secara wajar menjadi “berfirman”; koma akhir menandakan bahwa tuturan langsung berlanjut pada ayat berikutnya.
