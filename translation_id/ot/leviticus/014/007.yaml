source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: id
  text: Ia harus memercikkannya tujuh kali ke atas orang yang sedang ditahirkan dari penyakit kulit[a] itu, lalu menyatakan orang itu tahir[b], dan melepaskan burung yang hidup itu ke padang terbuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “kusta”. Istilah Ibraninya mencakup berbagai kondisi yang berkaitan dengan kulit dalam Imamat dan tidak selalu berarti kusta modern.
    reason: lexical_alternative
  - marker: b
    text: Atau “menetapkan orang itu tahir”. Tindakan imam bersifat ritual dan yudisial, bukan sekadar medis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Ia harus memercikkannya
  rationale: Bentuk hifil dari נזה dalam konteks ritual berarti memercikkan cairan. Akhiran -nya memasok objek yang tersirat dari campuran ritual pada ayat sebelumnya.
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan
  rationale: Partisipel hitpael טהר menunjuk kepada orang yang sedang menjalani proses pentahiran; bentuk ini mempertahankan aspek prosesual.
- source_word: מִן הַצָּרַעַת
  choice: dari penyakit kulit itu
  rationale: צָרַעַת dalam Imamat mencakup kategori gangguan kulit yang lebih luas daripada penyakit Hansen modern. Kata 'itu' mengaitkannya dengan kondisi yang sedang dibahas.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Padanan numerik-adverbial yang langsung dan alami dalam bahasa Indonesia.
- source_word: וְטִהֲרוֹ
  choice: lalu menyatakan orang itu tahir
  rationale: Dalam konteks ritual-keimaman, tindakan ini bersifat deklaratif atau yudisial, bukan semata-mata penyembuhan atau pembersihan fisik.
- source_word: וְשִׁלַּח
  choice: ia harus melepaskan
  rationale: שׁלח dapat berarti menyuruh pergi atau melepaskan; dalam ritus ini, 'melepaskan' paling alami untuk burung yang dibiarkan terbang bebas.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: burung yang hidup itu
  rationale: Ungkapan ini membedakan burung tersebut dari burung yang telah disembelih pada ayat sebelumnya.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: ke padang terbuka
  rationale: Ungkapan idiomatis ini menggambarkan pelepasan burung menuju bentangan lapang; 'ke padang terbuka' alami dalam bahasa Indonesia dan sesuai dengan gerak yang tersirat oleh verba.
theological_decisions:
- issue: Pemaknaan צָרַעַת
  choice: penyakit kulit
  alternative: kusta
  rationale: Istilah Ibrani ini menunjuk pada kategori kenajisan ritual yang berkaitan dengan beragam kelainan kulit dan tidak identik secara pasti dengan kusta atau penyakit Hansen modern.
- issue: Daya tindakan וְטִהֲרוֹ
  choice: menyatakan orang itu tahir
  alternative: menahirkan orang itu
  rationale: Konteks keimaman mendukung tindakan deklaratif-ritual. Terjemahan ini tidak menyiratkan bahwa imam secara medis menyembuhkan orang tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'tahir' dipertahankan karena tepat bagi ranah ritual Imamat dan lazim dipahami dalam bahasa keagamaan Indonesia; struktur kalimat dipecah agar urutan tindakan jelas.
