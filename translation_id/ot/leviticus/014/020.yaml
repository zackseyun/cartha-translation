  text: וְ/הֶעֱלָ֧ה הַ/כֹּהֵ֛ן אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה הַ/מִּזְבֵּ֑חָ/ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/טָהֵֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: id
  text: Kemudian imam harus mempersembahkan kurban bakaran dan persembahan sajian di atas mazbah. Imam harus mengadakan pendamaian bagi orang itu, dan orang itu akan menjadi tahir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan ia menjadi tahir.” Bentuk Ibrani menyatakan keadaan yang dihasilkan oleh ritus itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: harus mempersembahkan
  rationale: Bentuk Hifil dari עלה dalam konteks kurban berarti mempersembahkan di atas mazbah, bukan sekadar membawa naik.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: עלה sebagai istilah kurban menunjuk pada kurban yang dibakar; padanan ini baku dan jelas dalam bahasa Indonesia.
- source_word: הַמִּנְחָה
  choice: persembahan sajian
  rationale: Dalam hukum kurban Imamat, מִנְחָה menunjuk pada persembahan bahan pangan; 'persembahan sajian' mempertahankan istilah ritual tanpa membatasinya secara kurang tepat hanya pada biji-bijian.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran arah pada מזבח dalam konteks ini secara idiomatis menyatakan tempat kurban dipersembahkan, yakni di atas mazbah.
- source_word: וְכִפֶּר עָלָיו
  choice: harus mengadakan pendamaian bagi orang itu
  rationale: Dalam konteks keimaman, כפר menyatakan tindakan ritual mengadakan pendamaian, sedangkan עָלָיו menyatakan pihak yang menerima manfaat tindakan itu.
- source_word: וְטָהֵר
  choice: orang itu akan menjadi tahir
  rationale: Bentuk Qal menyatakan keadaan yang dihasilkan sesudah ritus. Subjek diperjelas sebagai orang itu agar rujukan pronomina Ibrani tidak rancu dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat ketahiran dalam hukum keimaman
  choice: ketahiran ritual
  alternative: kemurnian moral
  rationale: Konteks Imamat 14 membahas pemulihan status setelah kenajisan akibat penyakit kulit. Istilah 'tahir' mempertahankan kategori ritual teks tanpa mengubahnya menjadi pernyataan tentang moralitas.
- issue: Makna כפר dalam ritus kurban
  choice: mengadakan pendamaian bagi orang itu
  alternative: menyucikan orang itu
  rationale: Terjemahan ini membedakan tindakan pendamaian oleh imam dari keadaan tahir yang dinyatakan pada klausa berikutnya, sehingga urutan dan ketegangan istilah sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Harus' mempertahankan corak instruksi ritual. 'Mazbah', 'kurban bakaran', 'persembahan sajian', 'pendamaian', dan 'tahir' dipakai sebagai istilah keimaman yang ringkas dan mudah dikenali. Penanda catatan kaki [a] dicantumkan pada klausa yang dijelaskannya.
