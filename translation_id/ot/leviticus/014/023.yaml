id: LEV.14.23
reference: Leviticus 14:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: id
  text: Pada hari kedelapan ia harus membawa semuanya kepada imam untuk pentahirannya[a], di pintu masuk Kemah Pertemuan, di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “agar ia menjadi tahir.” Istilah Ibrani di sini menunjuk pada proses pentahiran secara ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: ia harus membawa
  rationale: Dalam konteks hukum dan petunjuk ritual, bentuk ini menyatakan ketentuan yang wajib dilakukan; 'harus membawa' alami dan jelas dalam bahasa Indonesia modern.
- source_word: אֹתָם
  choice: semuanya
  rationale: Pronomina objek jamak ini merujuk pada seluruh persembahan yang disebut dalam ayat sebelumnya.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Ini merupakan ungkapan waktu yang lazim dan langsung dalam bahasa Indonesia.
- source_word: לְטָהֳרָתוֹ
  choice: untuk pentahirannya
  rationale: Istilah ini menunjuk pada proses atau keadaan tahir secara ritual. 'Pentahiran' mempertahankan nuansa kultis tanpa menyamakannya dengan kebersihan fisik biasa.
- source_word: אֶל הַכֹּהֵן
  choice: kepada imam
  rationale: Frasa arah ini secara langsung menyatakan bahwa benda-benda tersebut dibawa kepada imam.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: Dalam konteks ini frasa tersebut menunjukkan lokasi tindakan. 'Kemah Pertemuan' merupakan padanan yang jelas dan mapan bagi אֹהֶל מוֹעֵד.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini mempertahankan arti kehadiran kultis dengan bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan fungsi nama pribadi dalam teks.
- issue: Makna ritual לְטָהֳרָתוֹ
  choice: untuk pentahirannya
  alternative: untuk penyuciannya; agar ia menjadi tahir
  rationale: Konteksnya adalah pemulihan status tahir secara ritual. 'Pentahiran' menjaga nuansa tersebut tanpa menyiratkan bahwa yang terutama dimaksud ialah kebersihan fisik atau pengampunan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur prosedural dipertahankan, sedangkan istilah 'pentahiran' digunakan untuk membedakan status ritual dari kebersihan fisik biasa.
