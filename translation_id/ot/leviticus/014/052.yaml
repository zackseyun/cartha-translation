  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: id
  text: Dengan demikian, ia harus menyucikan rumah itu dengan darah burung, dengan air yang mengalir[a], dengan burung yang hidup, dengan kayu aras, dengan hisop, dan dengan benang merah tua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “air hidup,” yaitu air segar dari sumber yang mengalir.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “benang kirmizi.” Ungkapan Ibrani ini menunjuk pada bahan yang diwarnai merah tua dan digunakan dalam ritual penyucian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: Dengan demikian, ia harus menyucikan
  rationale: Bentuk piel dari חטא dalam konteks ritual berarti membersihkan atau menyucikan dari kenajisan. 'Menyucikan' menyampaikan tindakan ritual ini secara wajar; 'dengan demikian' menghubungkannya dengan tata cara pada ayat sebelumnya.
- source_word: הַבַּיִת
  choice: rumah itu
  rationale: Kata בַּיִת menunjuk pada bangunan rumah tertentu yang sedang menjalani proses penyucian.
- source_word: בְּדַם הַצִּפּוֹר
  choice: dengan darah burung
  rationale: Preposisi בְּ menyatakan sarana yang dipakai dalam ritual.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: dengan air yang mengalir
  rationale: Ungkapan harfiah 'air hidup' merupakan idiom Ibrani bagi air dari sumber segar yang mengalir. Terjemahan ini menyampaikan maksud idiom secara jelas sambil mencatat bentuk harfiahnya dalam catatan kaki.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: dengan burung yang hidup
  rationale: Frasa ini membedakan burung tersebut dari burung yang darahnya telah dipakai.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: dengan kayu aras
  rationale: עֵץ dengan nama pohon di sini menunjuk pada kayu yang digunakan dalam ritual; 'kayu aras' merupakan istilah Alkitab yang baku dan mudah dipahami.
- source_word: וּבָאֵזֹב
  choice: dengan hisop
  rationale: Identifikasi botanis אֵזֹב tidak pasti, tetapi 'hisop' adalah padanan tradisional yang mempertahankan istilah ritual Alkitab.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: dengan benang merah tua
  rationale: Ungkapan ini menunjuk pada bahan berupa benang atau serat yang diwarnai merah tua dan dipakai dalam ritual; jenis tepat bahannya tidak dinyatakan.
