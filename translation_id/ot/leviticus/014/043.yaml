  text: וְ/אִם יָשׁ֤וּב הַ/נֶּ֨גַע֙ וּ/פָרַ֣ח בַּ/בַּ֔יִת אַחַ֖ר חִלֵּ֣ץ אֶת הָ/אֲבָנִ֑ים וְ/אַחֲרֵ֛י הִקְצ֥וֹת אֶת הַ/בַּ֖יִת וְ/אַחֲרֵ֥י הִטּֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: id
  text: Namun, jika penyakit[a] itu muncul kembali dan merebak di rumah setelah batu-batunya dikeluarkan, setelah rumah itu dikikis, dan setelah diplester,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “infeksi” atau “kelainan”. Kata Ibrani nega merupakan istilah teknis dalam Imamat untuk kondisi yang tampak pada manusia, pakaian, atau rumah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Meneruskan prosedur hukum dengan suatu keadaan bersyarat yang berlawanan dengan hasil yang diharapkan dari tindakan sebelumnya.
- source_word: יָשׁוּב
  choice: muncul kembali
  rationale: Dalam konteks ini, verba שׁוב menyatakan bahwa kondisi tersebut tampak lagi; ungkapan ini lebih alami dalam bahasa Indonesia daripada sekadar 'kembali'.
- source_word: הַנֶּגַע
  choice: penyakit
  rationale: נגע adalah istilah teknis dalam Imamat untuk kondisi mencolok yang menyerang manusia, pakaian, atau rumah. 'Penyakit' mudah dipahami, sedangkan catatan kaki mempertahankan keluasan maknanya.
- source_word: וּפָרַח
  choice: dan merebak
  rationale: Verba פרח secara harfiah menggambarkan pertunasan atau perkembangan, tetapi di sini secara idiomatis menunjuk pada merebaknya kondisi tersebut.
- source_word: בַּבַּיִת
  choice: di rumah
  rationale: Preposisi ב bersifat lokatif dan secara alami diterjemahkan 'di rumah'.
- source_word: אַחַר חִלֵּץ אֶת־הָאֲבָנִים
  choice: setelah batu-batunya dikeluarkan
  rationale: Bentuk pasif alami dalam bahasa Indonesia dan tidak menetapkan pelaku secara berlebihan, sementara tetap merujuk pada tindakan yang diperintahkan sebelumnya.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת־הַבַּיִת
  choice: setelah rumah itu dikikis
  rationale: Menggambarkan tindakan fisik mengikis permukaan rumah, bukan sekadar membersihkannya.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: dan setelah diplester
  rationale: Infinitif Ibrani tidak menyebut pelaku atau objek secara eksplisit; bahasa Indonesia secara wajar memahami rumah sebagai objek tanpa menambahkan pelaku.
theological_decisions: []
