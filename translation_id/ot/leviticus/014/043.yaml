  register: Bahasa Indonesia baku modern dengan nada prosedural yang jelas. Susunan pasif mempertahankan ketidakjelasan pelaku dalam rangkaian bentuk infinitif Ibrani. Tanda koma penutup dipertahankan karena ayat ini merupakan anak kalimat yang berlanjut ke ayat berikutnya.
