  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
translation:
  language: id
  text: Lalu imam harus menuangkan sebagian dari minyak itu ke telapak tangan kirinya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke telapak imam, yang kiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן הַ/שֶּׁמֶן
  choice: Lalu ... sebagian dari minyak itu
  rationale: וְ melanjutkan urutan tindakan ritual secara alami dengan “Lalu”; מִן menyatakan sumber. Dalam bahasa Indonesia, “sebagian dari” membuat tindakan menuang sejumlah minyak dari minyak yang telah disebut lebih wajar tanpa menentukan takarannya.
- source_word: יִצֹק
  choice: harus menuangkan
  rationale: Bentuk yiqtol berfungsi sebagai petunjuk dalam rangkaian ketentuan ritual; “harus menuangkan” menyampaikan daya instruksionalnya secara alami.
- source_word: הַ/כֹּהֵן
  choice: imam
  rationale: Padanan baku dan sesuai konteks kultis bagi כֹּהֵן.
- source_word: עַל כַּף
  choice: ke telapak tangan
  rationale: עַל setelah verba menuang menyatakan arah menuju permukaan, sedangkan כַּף secara khusus menunjuk telapak atau lekuk tangan.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: tangan kirinya sendiri
  rationale: Ungkapan Ibrani secara harfiah berbunyi “telapak imam, yang kiri.” Bentuk refleksif “kirinya sendiri” menghindari pengulangan yang kaku dan memperjelas bahwa tangan itu milik imam yang bertindak.
