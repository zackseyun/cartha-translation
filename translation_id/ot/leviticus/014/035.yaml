  - marker: a
    text: 'Ibrani: “seperti suatu penyakit/bala.” Ungkapan ini menyatakan kemiripan; pemilik rumah melaporkan apa yang tampak, bukan menetapkan diagnosis secara pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: maka ... harus datang
  rationale: Dalam rangkaian ketentuan hukum, bentuk ini menyatakan langkah prosedural berikutnya; “maka” dan “harus datang” menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: pemilik rumah itu
  rationale: Ungkapan harfiahnya berarti orang yang memiliki rumah tersebut; “pemilik rumah itu” ringkas dan alami.
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: melaporkannya kepada imam
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan. “Melaporkannya” sesuai dengan konteks pemberitahuan resmi kepada imam.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Mempertahankan fungsi ungkapan Ibrani sebagai pengantar kutipan langsung dalam bahasa Indonesia yang alami.
- source_word: כְּנֶגַע
  choice: semacam tanda penyakit
  rationale: Prefiks כְּ menyatakan kemiripan, bukan diagnosis yang pasti. “Tanda penyakit” menggambarkan gejala yang tampak pada bangunan tanpa membatasinya pada pengertian medis modern.
- source_word: נִרְאָה לִי
  choice: Tampaknya ada ... di rumah saya
  rationale: Ungkapan ini menyatakan apa yang terlihat atau tampak bagi pelapor. “Tampaknya” mempertahankan keterbatasan pengamatan dan ketidakpastian pemilik rumah.
- source_word: בַּבָּיִת
  choice: di rumah saya
  rationale: Preposisi בְּ paling wajar diterjemahkan “di”; “rumah saya” alami dalam ucapan langsung pemilik rumah.
