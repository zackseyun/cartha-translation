source:
  edition: WLC
  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: id
  text: 'Inilah ketentuan bagi orang yang terkena penyakit kulit[a] pada hari pentahirannya: ia harus dibawa kepada imam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional istilah Ibrani ini diterjemahkan “orang kusta,” tetapi kondisi yang dimaksud tidak harus sama dengan penyakit kusta (penyakit Hansen) dalam pengertian medis modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Inilah
  rationale: Ungkapan pembuka ketentuan hukum ini diterjemahkan secara alami dalam bahasa Indonesia sebagai “Inilah,” yang mencakup fungsi demonstratif dan kopulatifnya.
- source_word: תּוֹרַת
  choice: ketentuan bagi
  rationale: Dalam konteks ini תּוֹרָה menunjuk pada aturan atau tata cara ritual tertentu. “Ketentuan” lebih langsung dipahami pembaca modern daripada “hukum,” sedangkan “bagi” mencerminkan hubungan konstruksi dengan kata berikutnya.
- source_word: הַמְּצֹרָע
  choice: orang yang terkena penyakit kulit
  rationale: מְצֹרָע adalah orang yang terkena צָרַעַת. Pilihan ini menghindari penyamaan yang tidak tepat dengan penyakit Hansen modern dan tidak mereduksi identitas orang tersebut menjadi penyakitnya.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: pada hari pentahirannya
  rationale: Frasa temporal diterjemahkan secara langsung. “Pentahiran” mempertahankan nuansa ritual dari akar טהר, bukan sekadar kebersihan jasmani.
- source_word: וְהוּבָא
  choice: ia harus dibawa
  rationale: Bentuk Hofal mempertahankan makna pasif. “Harus” menyampaikan fungsi prosedural-preskriptif klausa ini dalam bahasa Indonesia alami.
- source_word: אֶל הַכֹּהֵן
  choice: kepada imam
  rationale: Artikel tentu Ibrani menunjuk kepada imam yang menangani prosedur tersebut; bahasa Indonesia tidak memerlukan kata sandang tersendiri.
theological_decisions:
- issue: Hubungan מְצֹרָע dengan istilah tradisional “kusta”
  choice: orang yang terkena penyakit kulit
  alternative: orang kusta
  rationale: Kondisi yang disebut צָרַעַת dalam Imamat merupakan kategori kenajisan ritual dan tidak dapat disamakan begitu saja dengan penyakit Hansen yang kini disebut kusta. Terjemahan utama menghindari diagnosis medis yang terlalu spesifik, sementara catatan kaki mempertahankan hubungan dengan istilah tradisional.
- issue: Nuansa טָהֳרָתוֹ
  choice: pentahirannya
  alternative: pembersihannya
  rationale: “Pentahiran” menandai pemulihan status ritual dalam konteks Imamat dan mencegah pembaca mengartikannya hanya sebagai tindakan membersihkan tubuh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “ketentuan” menjaga corak hukum tanpa terdengar kaku, sedangkan “pentahiran” dipertahankan sebagai istilah ritual yang lazim dan tepat.
