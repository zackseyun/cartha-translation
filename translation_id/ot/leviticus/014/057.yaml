  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: id
  text: untuk memberi petunjuk tentang kapan sesuatu itu najis dan kapan sesuatu itu tahir. Inilah hukum mengenai kondisi kenajisan itu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “kusta”. Istilah Ibrani ini dapat menunjuk pada kondisi yang menajiskan manusia, kain, atau rumah dan tidak terbatas pada penyakit Hansen modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/הוֹרֹת
  choice: untuk memberi petunjuk tentang
  rationale: Bentuk Hifil menyatakan pemberian petunjuk yang berwenang untuk menentukan status ritual dalam hukum-hukum sebelumnya.
- source_word: בְּ/י֥וֹם
  choice: kapan
  rationale: Dalam rumusan ini, ungkapan waktu tersebut menunjuk pada kapan suatu keadaan berlaku, bukan pada satu hari kalender secara harfiah.
- source_word: הַ/טָּמֵא
  choice: sesuatu najis
  rationale: Kata sifat ini menyatakan status yang ditentukan; 'sesuatu' menjaga cakupannya bagi manusia, benda, atau rumah.
- source_word: וּ/בְ/י֣וֹם הַ/טָּהֹר
  choice: dan kapan sesuatu tahir
  rationale: Ungkapan sejajar ini membedakan status tahir dari status najis; 'tahir' merupakan istilah Indonesia yang lazim bagi kemurnian ritual.
- source_word: זֹ֥את תּוֹרַ֖ת
  choice: Inilah hukum mengenai
  rationale: Menerjemahkan rumusan penutup sebagai pengenalan ringkas terhadap ketentuan yang mengatur perkara tersebut.
- source_word: הַ/צָּרָֽעַת
  choice: kondisi yang menajiskan itu
  rationale: Istilah Ibrani mencakup gejala pada manusia, kain, dan rumah, sehingga tidak tepat dibatasi pada penyakit Hansen atau penyakit kulit saja.
theological_decisions:
- issue: Cakupan צָרַעַת dalam hukum kenajisan Imamat
  choice: kondisi yang menajiskan
  alternative: kusta; penyakit kulit
  rationale: Pilihan ini mempertahankan kategori ritual yang luas dalam konteks pasal 13–14 dan menghindari identifikasi medis yang anakronistis, tanpa membatasinya hanya pada kulit manusia.
- issue: Makna טָמֵא dan טָהֹר
  choice: najis dan tahir
  alternative: tidak bersih dan bersih
  rationale: Dalam konteks ini kedua istilah menunjuk terutama pada status ritual. Pasangan 'najis–tahir' menyampaikan ranah tersebut secara ringkas tanpa menyamakannya dengan kebersihan jasmani atau kesalahan moral.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Kapan' dipakai untuk idiom temporal בְּיוֹם, sedangkan 'najis–tahir' mempertahankan pembedaan status ritual. Penanda catatan kaki ditempatkan tepat sesudah istilah yang dijelaskan.
