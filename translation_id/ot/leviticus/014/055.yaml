translation:
  language: id
  text: dan mengenai tsaraat pada pakaian dan pada rumah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tsaraat adalah istilah Ibrani yang secara tradisional diterjemahkan “kusta”, tetapi dalam Imamat cakupannya lebih luas: berbagai kelainan atau cemaran yang dapat mengenai manusia, pakaian, dan rumah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: dan mengenai
  rationale: Gabungan waw dan preposisi le melanjutkan daftar pokok yang diatur oleh hukum pada ayat-ayat sebelumnya; 'dan mengenai' mempertahankan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: צָרַעַת
  choice: tsaraat
  rationale: Istilah Ibrani ini mencakup berbagai kelainan atau cemaran yang dapat mengenai manusia, pakaian, dan rumah. Transliterasi mempertahankan kategori khas Imamat dan menghindari padanan sempit seperti 'kusta' atau 'penyakit kulit', yang tidak cocok untuk pakaian dan rumah.
- source_word: הַבֶּגֶד
  choice: pakaian
  rationale: Kata benda ini menunjuk pada pakaian atau bahan sandang. Dalam daftar generik bahasa Indonesia, bentuk tanpa penanda definit lebih wajar daripada 'pakaian itu'.
- source_word: וְלַבָּיִת
  choice: atau rumah
  rationale: Waw menghubungkan alternatif lain dalam kategori yang sama. 'Atau' menyampaikan susunan distributif dengan wajar, sedangkan preposisi sebelumnya dipahami berlaku juga pada unsur kedua.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Istilah teknis 'tsaraat' dipertahankan karena tidak ada satu padanan Indonesia yang mencakup seluruh pemakaiannya dalam Imamat; catatan kaki menjelaskannya.
