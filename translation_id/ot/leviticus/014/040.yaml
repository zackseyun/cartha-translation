base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: id
  text: Kemudian imam harus memerintahkan supaya batu-batu yang di dalamnya terdapat bercak itu dicabut dan dibuang ke luar kota, ke suatu tempat najis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִוָּה
  choice: Kemudian ... harus memerintahkan
  rationale: Waw dengan bentuk perfektif melanjutkan urutan prosedural. “Kemudian” menyatakan tahap berikutnya secara alami, sedangkan “harus memerintahkan” mempertahankan daya instruktifnya.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku untuk כֹּהֵן dalam konteks ritual Imamat; ketakrifannya sudah jelas dari konstruksi kalimat bahasa Indonesia.
- source_word: וְחִלְּצוּ
  choice: agar ... dicabut
  rationale: Kata kerja ini menyatakan tindakan menarik atau mengeluarkan sesuatu. Untuk batu pada dinding rumah, “dicabut” menyampaikan pelepasan batu dari susunannya dengan tepat.
- source_word: הָאֲבָנִים
  choice: batu-batu
  rationale: Padanan langsung dan alami; konteks sudah menunjukkan bahwa yang dimaksud ialah batu-batu bangunan.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: tempat bercak itu terdapat
  rationale: Ungkapan ini mempertahankan konstruksi lokatif Ibrani, secara harfiah ‘yang di dalam/padanya ada bercak itu’. “Bercak” tidak mengunci pembaca pada diagnosis medis atau jenis jamur tertentu.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: dan dibuang
  rationale: Dalam konteks penyingkiran bahan bangunan yang tercemar, “dibuang” lebih alami dalam bahasa Indonesia daripada terjemahan mekanis ‘dilempar’, sekaligus tetap menyampaikan tindakan menyingkirkan batu-batu itu.
- source_word: אֶל מִחוּץ לָעִיר
  choice: di luar kota
  rationale: Menunjukkan tujuan pemindahan ke lokasi yang berada di luar batas kota.
- source_word: אֶל מָקוֹם טָמֵא
  choice: ke suatu tempat najis
  rationale: “Najis” mempertahankan istilah teknis tentang ketidakmurnian ritual dalam Imamat dan tidak sekadar berarti kotor secara fisik.
theological_decisions:
- issue: Istilah kenajisan ritual dalam peraturan mengenai rumah
  choice: “najis” untuk טָמֵא dan “bercak” untuk נֶגַע
  alternative: “tidak tahir” untuk טָמֵא; “penyakit”, “wabah”, atau “jamur” untuk נֶגַע
  rationale: Ayat ini berbicara tentang kategori kemurnian ritual tanpa menetapkan diagnosis ilmiah modern. “Najis” mempertahankan kategori ritual, sedangkan “bercak” menggambarkan gejala yang tampak tanpa memastikan bahwa penyebabnya adalah penyakit atau jamur tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan prosedural dibuat alami dengan bentuk pasif, sementara istilah “najis” dipertahankan sebagai kosakata ritual utama dalam Imamat.
