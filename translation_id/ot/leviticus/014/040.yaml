  source_fidelity: 'Draf pada dasarnya setia pada urutan prosedural dan makna Ibrani: imam memberi perintah, batu-batu terkait dikeluarkan, lalu dibuang ke tempat najis di luar kota. Namun, "batu-batu tempat bercak itu terdapat" kurang idiomatis dalam bahasa Indonesia dan berpotensi membuat "tempat" tampak sebagai rujukan lokasi tersendiri, bukan batu-batu itu. Susunan tujuan juga sebaiknya mencerminkan dua keterangan arah Ibrani: ke luar kota, ke suatu tempat najis.'
