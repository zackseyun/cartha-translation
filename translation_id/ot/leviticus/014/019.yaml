  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: id
  text: Kemudian imam harus mempersembahkan kurban penghapus dosa[a] dan mengadakan pendamaian bagi orang yang sedang ditahirkan dari kenajisannya. Sesudah itu, imam harus menyembelih kurban bakaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pentahiran.” Istilah Ibrani חַטָּאת dapat menunjuk pada kurban yang dipakai untuk pentahiran dalam konteks ritual Imamat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: harus mempersembahkan
  rationale: Secara harfiah berarti 'melakukan/membuat', tetapi dalam konteks kurban menunjuk pada pelaksanaan atau persembahan kurban.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Istilah ini merupakan sebutan teknis bagi suatu jenis kurban; padanan ini dikenal luas, sedangkan nuansa pentahiran dicatat dalam catatan kaki.
- source_word: וְכִפֶּר עַל
  choice: mengadakan pendamaian bagi
  rationale: Mempertahankan daya ritual-teologis כפר tanpa menentukan teori pendamaian tertentu; עַל menandai orang yang menerima manfaat tindakan itu.
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan
  rationale: Bentuk partisipel Hitpael menggambarkan orang yang menjalani proses pentahiran ritual.
- source_word: מִטֻּמְאָתוֹ
  choice: dari kenajisannya
  rationale: Dalam Imamat, טֻמְאָה mengacu pada keadaan najis secara ritual; akhiran maskulin tunggal dipertahankan dengan '-nya' sesuai kelaziman bahasa Indonesia.
- source_word: יִשְׁחַט
  choice: harus menyembelih
  rationale: Kata ini merupakan istilah lazim bagi penyembelihan hewan kurban.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Padanan baku dan jelas untuk jenis kurban yang dibakar di atas mazbah.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kurban Imamat
  choice: kurban penghapus dosa
  alternative: kurban pentahiran
  rationale: Teks jelas menunjuk pada jenis persembahan, tetapi istilah Ibraninya dapat menonjolkan fungsi pentahiran, khususnya dalam konteks kenajisan ritual. Alternatif itu dipertahankan dalam catatan kaki.
- issue: Cakupan כפר
  choice: mengadakan pendamaian
  alternative: mengadakan penebusan
  rationale: Padanan yang dipilih menjaga cakupan ritual-teologis kata Ibrani dan tidak membatasi maknanya pada satu penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual dibuat konsisten dan mudah dipahami; pengulangan 'imam' pada klausa terakhir memperjelas subjek dalam bahasa Indonesia.
