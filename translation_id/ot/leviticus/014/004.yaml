base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: id
  text: Lalu imam harus memerintahkan agar dua ekor burung hidup yang tahir, kayu aras, benang merah tua[a], dan hisop[b] diambil bagi orang yang sedang ditahirkan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benang kirmizi”. Ungkapan Ibrani שְׁנִי תוֹלַעַת menunjuk pada bahan berwarna merah tua; bentuk tepat bahan itu dapat diterjemahkan dengan beberapa cara.
    reason: lexical_alternative
  - marker: b
    text: Jenis tanaman yang dimaksud dengan “hisop” tidak dapat dipastikan; sebutan tradisional ini dipertahankan.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: Lalu imam harus memerintahkan
  rationale: Dalam rangkaian hukum ritual, waw dengan bentuk perfektif melanjutkan tahap prosedur. “Lalu” menyatakan urutan dengan alami, sedangkan “harus memerintahkan” mempertahankan daya perintahnya.
- source_word: וְלָקַח
  choice: agar ... diambil
  rationale: Walaupun bentuk Ibraninya orang ketiga maskulin tunggal, sesudah perintah imam verba ini secara idiomatis menunjuk pada pelaksanaan pengambilan barang-barang tersebut; bentuk pasif Indonesia menghindari kesan bahwa imam sendiri wajib mengambilnya.
- source_word: לַמִּטַּהֵר
  choice: bagi orang yang sedang ditahirkan itu
  rationale: Partisipel Hitpael menggambarkan orang yang sedang menjalani proses pentahiran. Ungkapan ini mempertahankan nuansa proses dan kaitannya dengan orang yang telah disebut dalam konteks.
- source_word: שְׁתֵּי צִפֳּרִים חַיּוֹת טְהֹרוֹת
  choice: dua ekor burung hidup yang tahir
  rationale: צִפּוֹר adalah istilah umum bagi burung, bukan khusus burung pipit. “Hidup” dan “tahir” mempertahankan dua sifat ritual yang dinyatakan teks.
- source_word: עֵץ אֶרֶז
  choice: kayu aras
  rationale: Padanan tradisional dan alami dalam bahasa Indonesia untuk bahan kayu cedar yang dipakai dalam ritus.
- source_word: שְׁנִי תוֹלַעַת
  choice: benang merah tua
  rationale: Ungkapan ini menunjuk pada bahan yang diwarnai merah tua dengan zat pewarna yang dikaitkan dengan serangga; bentuk tepat bahannya tidak sepenuhnya pasti, sehingga alternatif dicatat dalam catatan kaki.
- source_word: אֵזֹב
  choice: hisop
  rationale: Padanan tradisional dipertahankan karena identifikasi botanis tanaman yang dimaksud tidak pasti dan padanan yang lebih spesifik akan bersifat spekulatif.
theological_decisions:
- issue: Makna ketahiran pada burung dan orang dalam konteks ritual Imamat
  choice: Menggunakan “tahir” dan “ditahirkan” tanpa tambahan penjelas dalam teks utama
  alternative: “bersih secara ritual” dan “sedang dibersihkan secara ritual”
  rationale: “Tahir” merupakan istilah Indonesia yang ringkas dan mapan untuk kategori ritual Imamat, serta tidak mengubah kategori itu menjadi penilaian moral atau kebersihan jasmani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti urutan prosedural Ibrani sambil memakai bentuk pasif yang alami. Istilah ritual “tahir” dipertahankan agar berbeda dari sekadar bersih secara jasmani.
