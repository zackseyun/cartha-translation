  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: id
  text: Kemudian mereka harus mengambil batu-batu lain dan menempatkannya sebagai pengganti batu-batu itu[a]. Lalu seseorang harus mengambil tanah lain[b] dan melapisi rumah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di bawah batu-batu itu”; dalam konteks ini ungkapan tersebut berarti menempatkan batu-batu baru sebagai pengganti batu-batu yang disingkirkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “adukan lain”; secara lebih harfiah, “debu/tanah lain”. Yang dimaksud ialah bahan yang digunakan untuk melapisi kembali rumah itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Kemudian mereka harus mengambil
  rationale: 'Bentuk jamak dalam rangkaian prosedur hukum diterjemahkan sebagai kewajiban, sedangkan kata penghubung diberi nilai urutan: “Kemudian”.'
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: batu-batu lain
  rationale: Menyampaikan secara langsung bahwa batu pengganti harus berbeda dari batu yang telah disingkirkan.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: dan memasangnya sebagai pengganti batu-batu itu
  rationale: תַּחַת bersifat substitutif dalam konteks ini, bukan menunjukkan posisi fisik di bawah; “memasangnya” alami untuk tindakan membawa batu ke tempat batu lama.
- source_word: וְעָפָר אַחֵר
  choice: bahan pelapis lain
  rationale: עָפָר secara harfiah dapat berarti debu atau tanah, tetapi di sini menunjuk pada bahan berbasis tanah yang dipakai untuk melapisi kembali rumah; pilihan ini menghindari kesan bahwa bahan yang dimaksud ialah debu biasa atau produk plester jadi.
- source_word: יִקַּח
  choice: orang harus mengambil
  rationale: Mempertahankan peralihan gramatikal dari subjek jamak ke orang ketiga tunggal tanpa memakai pronomina bergender dalam bahasa Indonesia.
- source_word: וְטָח אֶת הַבָּיִת
  choice: dan melapisi rumah itu
  rationale: טוח berarti mengoleskan atau melapisi permukaan; “melapisi” cocok dengan bahan yang disebut sebelumnya dan alami dalam bahasa Indonesia.
