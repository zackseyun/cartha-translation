source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: id
  text: Pada hari kedelapan, ia harus mengambil dua ekor anak domba jantan tanpa cacat, seekor anak domba betina berumur setahun tanpa cacat, tiga persepuluh efa tepung halus yang dicampur dengan minyak sebagai persembahan sajian, dan satu log[a] minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Log adalah satuan kecil untuk mengukur cairan yang digunakan dalam tata ibadah Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Ungkapan ini melanjutkan urutan tata cara sebelumnya. Dalam bahasa Indonesia, hubungan tersebut sudah jelas tanpa harus menerjemahkan waw pembuka sebagai “dan”.
- source_word: יִקַּח
  choice: ia harus mengambil
  rationale: Bentuk imperfek ini berfungsi sebagai perintah dalam konteks hukum ritual; “harus” menyampaikan daya wajibnya dengan bahasa Indonesia modern.
- source_word: שְׁנֵי כְבָשִׂים
  choice: dua ekor anak domba jantan
  rationale: Bentuk maskulin sengaja dibedakan dari כַבְשָׂה yang feminin sesudahnya, sehingga jenis kelamin hewan dinyatakan secara eksplisit.
- source_word: תְּמִימִים ... תְּמִימָה
  choice: yang tidak bercacat
  rationale: Dalam konteks kurban, תמים menunjuk pada hewan yang bebas dari cacat; pilihan ini jelas dan mempertahankan istilah ritual.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: seekor anak domba betina berumur setahun
  rationale: Terjemahan ini mempertahankan jenis kelamin dan ketentuan usia hewan dengan ungkapan Indonesia yang alami.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tiga persepuluh efa
  rationale: עִשָּׂרוֹן adalah ukuran sepersepuluh, yang dalam konteks ini dipahami sebagai sepersepuluh efa. Menyebut “efa” membuat satuan tersirat itu jelas tanpa mengubah jumlah.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah ini menunjuk pada tepung bermutu yang digiling halus dan digunakan untuk persembahan.
- source_word: מִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam tata kurban Imamat, מִנְחָה adalah persembahan dari hasil olahan biji-bijian. “Persembahan sajian” mempertahankan istilah ritual yang ringkas dan dikenal, sedangkan “sebagai” menyatakan hubungan aposisionalnya.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Frasa ini menerangkan keadaan tepung tersebut dan diterjemahkan secara langsung serta alami.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: dan satu log minyak
  rationale: לֹג adalah satuan cair khusus yang tidak mempunyai padanan Indonesia yang tepat. Transliterasi mempertahankan satuan sumber, dengan penjelasan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja digunakan dengan tetap mempertahankan ketepatan istilah ritual. Penggolong “ekor” dipakai secara wajar untuk hewan. Penanda catatan kaki ditempatkan sesudah “log”, yaitu istilah yang dijelaskan.
