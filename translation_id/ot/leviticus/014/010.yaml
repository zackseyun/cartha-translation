  source_fidelity: 'Makna pokok draf setia pada teks Ibrani: hari kedelapan, dua anak domba jantan, seekor anak domba betina berumur setahun, ketentuan tanpa cacat, tiga persepuluh efa tepung halus, minyak, dan satu log minyak semuanya terwakili. Revisi kecil memperjelas bahwa tepung haluslah yang dicampur dengan minyak, sebagaimana partisip Ibrani בְּלוּלָה yang secara gramatikal menerangkan סֹלֶת.'
