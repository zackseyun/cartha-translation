- from: Lalu ia harus menyembelih burung yang satu itu di atas sebuah wadah tanah liat yang berisi air hidup[a].
  to: Lalu ia harus menyembelih burung yang satu itu ke dalam sebuah bejana tanah liat di atas air hidup[a].
