  verdict: revise
  source_fidelity: Perlu revisi. אֶל כְּלִי חֶרֶשׂ berarti tindakan penyembelihan dilakukan ke/dalam sebuah bejana tanah liat, sedangkan עַל מַיִם חַיִּים menyatakan di atas air hidup (yakni air segar atau mengalir). Terjemahan draf “di atas sebuah wadah tanah liat yang berisi air hidup” menggeser אֶל menjadi ‘di atas’ dan menambahkan klausa ‘yang berisi’, yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
  naturalness: “Lalu ia harus menyembelih burung yang satu itu” alami dan sesuai register. “Ke dalam sebuah bejana tanah liat di atas air hidup” tetap cukup jelas dalam bahasa Indonesia formal dan mempertahankan hubungan sintaksis sumber; catatan kaki menjelaskan idiom ‘air hidup’.
  terminology: “Menyembelih” tepat untuk שָׁחַט; “burung yang satu itu” tepat untuk frasa definitif pembeda; “bejana tanah liat” lebih idiomatis dan spesifik sebagai padanan כְּלִי חֶרֶשׂ daripada “wadah tanah liat”. “Air hidup” dapat dipertahankan sebagai terjemahan literal, dengan penjelasan idiomatis pada catatan kaki.
  issues:
  - severity: high
    issue: Hubungan arah/spasial pada אֶל dan עַל bergeser.
    rationale: Draf menerjemahkan אֶל כְּלִי חֶרֶשׂ sebagai ‘di atas sebuah wadah tanah liat’ dan menyerap עַל מַיִם חַיִּים ke dalam anak kalimat ‘yang berisi air hidup’. Teks Ibrani membedakan bejana sebagai tujuan tindakan (‘ke/dalam’) dan air hidup sebagai unsur yang berada di bawah/menjadi dasar tindakan (‘di atas’).
  - severity: medium
    issue: Klausa ‘yang berisi’ adalah penambahan penafsiran.
    rationale: Konteks ritual memang mendukung pemahaman bahwa air ada dalam bejana, tetapi konstruksi itu tidak dinyatakan oleh klausa relatif dalam ayat ini. Terjemahan hendaknya tidak mengubah struktur menjadi atribusi eksplisit pada bejana.
  revised_text: Lalu ia harus menyembelih burung yang satu itu ke dalam sebuah bejana tanah liat di atas air hidup[a].
