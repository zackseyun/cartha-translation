  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: id
  text: Lalu ia harus menyembelih burung yang satu itu ke dalam sebuah bejana tanah liat di atas air hidup[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “air hidup”; yaitu air segar atau air mengalir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Lalu ia harus menyembelih
  rationale: Bentuk berawalan waw melanjutkan urutan prosedur ritual. “Lalu” menyatakan urutan, sedangkan “harus menyembelih” menyampaikan daya instruktif dan arti teknis tindakan tersebut.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: burung yang satu itu
  rationale: Frasa definit ini membedakan burung tersebut dari burung lainnya tanpa menambahkan gagasan bahwa burung itu adalah yang pertama.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: di atas sebuah wadah tanah liat
  rationale: Secara harfiah אֶל biasanya berarti “ke/arah”, tetapi dalam rumusan ritual ini penyembelihan dilakukan sedemikian rupa sehingga darah masuk ke wadah. Dalam bahasa Indonesia, “di atas ... wadah” menyampaikan tata caranya dengan wajar; “wadah tanah liat” secara akurat menerjemahkan bahan dan fungsi benda itu.
- source_word: עַל מַיִם חַיִּים
  choice: yang berisi air hidup
  rationale: עַל menghubungkan tindakan dan wadah dengan air di dalamnya. Susunan Indonesia ini menghindari kesan bahwa wadah berada di atas air, sekaligus mempertahankan ungkapan harfiah “air hidup” dan menjelaskan makna idiomatisnya dalam catatan kaki.
theological_decisions:
- issue: Makna מַיִם חַיִּים dalam tata cara pentahiran
  choice: air hidup
  alternative: air segar; air mengalir
  rationale: Ungkapan Ibrani secara harfiah berarti “air hidup” dan dalam konteks ini menunjuk pada air segar atau mengalir, bukan air tergenang. Teks utama mempertahankan citra dan resonansi ungkapan sumber, sedangkan catatan kaki menerangkan arti idiomatisnya tanpa mengubahnya menjadi metafora teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “ia” mengikuti subjek pelaksana ritual dari konteks. Susunan “wadah tanah liat yang berisi air hidup” dipilih agar hubungan spasial tindakan, wadah, dan air jelas dalam bahasa Indonesia.
