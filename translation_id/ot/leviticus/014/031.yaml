  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: id
  text: Sesuai dengan kemampuannya[a], ia harus mempersembahkan satu ekor sebagai persembahan penghapus dosa[b] dan satu ekor lagi sebagai persembahan bakaran, bersama dengan persembahan sajian. Dengan demikian, imam harus mengadakan pendamaian bagi orang yang sedang ditahirkan itu di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang dapat dicapai tangannya”; maksudnya, sesuai dengan yang mampu ia sediakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan pentahiran.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: sesuai dengan kemampuannya
  rationale: Ungkapan harfiahnya adalah 'yang dapat dicapai tangannya' dan menunjuk pada kemampuan ekonomi; pilihan ini menyampaikan idiom itu secara alami dalam bahasa Indonesia.
- source_word: חַטָּאת
  choice: persembahan penghapus dosa
  rationale: Istilah kurban ini berkaitan dengan dosa sekaligus pentahiran ritual. Pilihan tradisional yang jelas ini mempertahankan kaitan eksplisit dengan dosa tanpa meniadakan fungsi pentahirannya; alternatif dicatat dalam catatan kaki.
- source_word: עֹלָה
  choice: persembahan bakaran
  rationale: Istilah baku dan mudah dipahami untuk kurban yang seluruhnya dibakar sehingga asapnya naik.
- source_word: עַל הַמִּנְחָה
  choice: bersama dengan persembahan sajian
  rationale: Dalam tata cara kurban ini, עַל menyatakan penyertaan atau penambahan, bukan posisi ruang secara harfiah.
- source_word: וְכִפֶּר
  choice: harus mengadakan pendamaian
  rationale: Mempertahankan daya kultis dan teologis כפר tanpa menentukan teori pendamaian yang lebih sempit daripada teks.
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan itu
  rationale: Bentuk partisipel menunjukkan orang yang tengah menjalani proses pentahiran ritual.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Menyampaikan makna 'di hadapan/dalam kehadiran' dan mempertahankan nama ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasi nama ilahi mempertahankan nama diri dalam teks Ibrani.
theological_decisions:
- issue: Istilah חַטָּאת dalam konteks kurban
  choice: persembahan penghapus dosa
  alternative: persembahan pentahiran
  rationale: Kedua sisi makna—dosa dan pentahiran ritual—relevan. Teks utama memakai istilah yang dikenal luas, sedangkan kemungkinan fungsi pentahiran dipertahankan dalam catatan kaki.
- issue: Makna כפר dalam tata cara imamat
  choice: mengadakan pendamaian
  alternative: mengadakan penebusan; membersihkan secara ritual
  rationale: Pilihan ini mempertahankan ketegangan teologis dan fungsi kultis istilah tersebut tanpa memasukkan teori tertentu tentang cara kerja pendamaian.
- issue: Penerjemahan nama ilahi
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Nama diri dipertahankan sebagai Yahweh, sejalan dengan sumber Ibrani dan kebijakan proyek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat konsisten dan mudah dipahami; struktur awal dipertahankan sebagai kelanjutan dari ayat sebelumnya.
