base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Yahweh[a] berfirman kepada Musa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.”'
    reason: Menjelaskan bentuk Ibrani nama ilahi dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam formula pembuka perkataan ilahi, דּבר menyatakan tindakan berbicara. “Berfirman” merupakan padanan Indonesia yang alami dan bermartabat ketika subjeknya Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap terlihat, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menerima perkataan; “kepada” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk nama yang baku dan umum dikenal dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: ditandai dengan koma yang mengantar isi firman berikutnya
  rationale: Infinitif לֵאמֹר berfungsi sebagai formula pengantar bagi isi ucapan. Dalam bahasa Indonesia modern, fungsi ini secara alami dinyatakan dengan verba “berfirman” dan tanda baca, tanpa tambahan harfiah “dengan mengatakan” yang terasa kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu secara langsung, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehuwa” mencerminkan bentuk pelafalan tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula Ibrani diterjemahkan secara alami sebagai pembuka ucapan ilahi; koma menghubungkan ayat ini dengan isi firman pada ayat berikutnya.
