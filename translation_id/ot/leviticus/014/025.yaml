  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: id
  text: Kemudian ia harus menyembelih anak domba jantan korban penebus salah itu.[a] Imam harus mengambil sebagian darah korban penebus salah itu, lalu mengoleskannya pada cuping telinga kanan[b] orang yang sedang ditahirkan, pada ibu jari tangan kanannya, dan pada ibu jari kaki kanannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “korban ganti rugi.” Istilah Ibrani menunjuk pada satu jenis korban khusus dalam hukum ritual.
    reason: lexical_alternative
  - marker: b
    text: Atau “ujung telinga kanan.” Istilah Ibrani menunjuk pada bagian luar atau bagian terujung dari telinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Kemudian ia harus menyembelih
  rationale: Kata kerja ini menunjuk pada penyembelihan ritual, bukan sekadar membunuh. Kata “kemudian” menyatakan urutan tindakan yang ditandai waw.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: domba jantan untuk korban penebus salah
  rationale: Dalam konteks ini כֶּבֶשׂ adalah hewan kurban jantan, sedangkan hubungan konstruksi menunjukkan bahwa hewan itu diperuntukkan bagi korban אָשָׁם.
- source_word: אָשָׁם
  choice: korban penebus salah
  rationale: Istilah ini adalah nama teknis bagi jenis korban tertentu dalam Imamat. Padanan ini jelas dan sudah dikenal dalam bahasa Indonesia, tanpa mereduksinya menjadi perasaan bersalah semata.
- source_word: מִדַּם הָאָשָׁם
  choice: sebagian darah korban penebus salah itu
  rationale: 'Preposisi מִן dipahami secara partitif: imam mengambil sebagian, bukan seluruh darah.'
- source_word: תְּנוּךְ אֹזֶן
  choice: cuping telinga
  rationale: Istilah Ibrani menunjuk pada bagian luar atau ujung telinga. “Cuping telinga” adalah padanan anatomis yang alami, sementara kemungkinan “ujung telinga” dicatat dalam catatan kaki.
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan
  rationale: Partisipel hitpael menggambarkan orang yang sedang menjalani proses pentahiran ritual; bentuk ini mempertahankan aspek proses tersebut.
- source_word: בֹּהֶן יָדוֹ
  choice: ibu jari tangan kanannya
  rationale: Dengan יָד, בֹּהֶן secara khusus berarti ibu jari.
- source_word: בֹּהֶן רַגְלוֹ
  choice: ibu jari kaki kanannya
  rationale: Dengan רֶגֶל, בֹּהֶן menunjuk pada jari terbesar pada kaki; “ibu jari kaki” merupakan ungkapan Indonesia yang wajar.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Padanan baku untuk petugas kultis yang melaksanakan ritus ini.
theological_decisions:
- issue: Makna istilah korban אָשָׁם
  choice: korban penebus salah
  alternative: korban ganti rugi
  rationale: “Korban penebus salah” mempertahankan istilah teknis yang dikenal dan mencakup dimensi kesalahan, sedangkan “korban ganti rugi” dapat terlalu membatasi maknanya pada restitusi materi. Catatan kaki mempertahankan alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada ritual yang khidmat. “Ditahirkan” dipertahankan sebagai istilah kultis yang lebih tepat daripada “dibersihkan.” Kalimat dibagi menjadi dua agar prosedur panjang tetap mudah dipahami.
