  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: id
  text: Kemudian imam harus mengambil sebagian minyak dari takaran satu log itu dan menuangkannya ke telapak tangan kirinya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Log adalah satuan takaran cair kuno.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Bentuk waw + qatal melanjutkan urutan tata cara ritual. Ungkapan ini menyampaikan urutan sekaligus sifat preskriptif secara alami dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku כֹּהֵן dalam konteks ibadah Israel; kejelasan nomina tertentu didukung oleh konteks dan kata penunjuk pada frasa berikutnya.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: sebagian dari satu log minyak itu
  rationale: 'מִן dipahami secara partitif: imam mengambil sebagian minyak dari takaran satu log, bukan mengambil seluruh takaran atau wadahnya.'
- source_word: לֹג
  choice: log
  rationale: Nama satuan cair kuno dipertahankan melalui transliterasi karena padanan modernnya tidak pasti; maknanya dijelaskan dalam catatan kaki.
- source_word: וְיָצַק
  choice: dan menuangkannya
  rationale: Tindakan kedua berada di bawah daya preskriptif yang sama dengan 'harus mengambil'; enklitik '-nya' secara alami merujuk kepada minyak yang diambil.
- source_word: עַל כַּף
  choice: ke telapak tangan
  rationale: Walaupun עַל secara harfiah berarti 'di atas/ke atas', konteks menuang ke tangan yang ditadahkan paling wajar dinyatakan dengan 'ke telapak tangan' tanpa mengubah tindakan ritual.
- source_word: כַּף
  choice: telapak tangan
  rationale: כַּף menunjuk secara khusus kepada telapak atau lekuk tangan, bukan tangan secara umum.
- source_word: הַשְּׂמָאלִית
  choice: kirinya sendiri
  rationale: Adjektiva ini menunjukkan telapak tangan kiri imam. 'Sendiri' memperjelas bahwa tangan itu milik imam yang bertindak, sesuai pengulangan 'imam' dalam bahasa Ibrani.
