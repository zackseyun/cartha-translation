  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/כֹּהֵן֙ בְּ/אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: id
  text: Kemudian imam harus memercikkan dengan jari kanannya sebagian dari minyak yang ada di telapak tangan kirinya sebanyak tujuh kali di hadapan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: Kemudian ... harus memercikkan
  rationale: Bentuk Hifil dari נזה dalam konteks ritual berarti ‘memercikkan’. Kata sambung וְ diterjemahkan ‘Kemudian’ agar urutan tindakan ritual terasa alami.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi כֹּהֵן dalam peraturan peribadatan Israel.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: dengan jari kanannya
  rationale: Mempertahankan bentuk tunggal אֶצְבַּע dan penekanan pada sisi kanan dengan ungkapan Indonesia yang alami.
- source_word: מִן הַשֶּׁמֶן
  choice: sebagian dari minyak
  rationale: 'מִן berfungsi secara partitif: yang dipercikkan ialah sebagian minyak tersebut, bukan seluruhnya.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: yang ada di telapak tangan kirinya
  rationale: כַּף dalam konteks ini menunjuk secara khusus pada telapak tangan tempat minyak ditaruh.
- source_word: שֶׁבַע פְּעָמִים
  choice: sebanyak tujuh kali
  rationale: Ungkapan hitungan ini diterjemahkan secara idiomatis sambil mempertahankan jumlah yang tepat.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan tindakan yang dilakukan di hadirat Allah dalam konteks ritual, sedangkan nama perjanjian יְהוָה ditransliterasikan ‘Yahweh’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur prosedural dipertahankan dengan jelas; ‘telapak tangan’ dipilih demi ketepatan gambaran ritual.
