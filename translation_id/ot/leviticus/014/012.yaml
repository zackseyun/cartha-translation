  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: id
  text: Kemudian imam harus mengambil domba jantan yang satu itu dan mempersembahkannya sebagai kurban penebus kesalahan[a], bersama satu log minyak[b]. Ia harus mengunjukkan keduanya sebagai persembahan unjukan di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemulihan.”
    reason: lexical_alternative
  - marker: b
    text: Log adalah satuan kecil untuk menakar cairan dalam tata peribadatan Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Waw dengan bentuk qatal melanjutkan urutan tata upacara; “kemudian” menyatakan tahap berikutnya, sedangkan “harus” mempertahankan daya preskriptifnya.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan alami untuk כֹּהֵן dalam konteks peribadatan Israel.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: domba jantan yang satu itu
  rationale: כֶּבֶשׂ menunjuk kepada anak domba, lazimnya jantan dalam konteks kurban ini; artikel dan bilangan membedakan hewan tersebut dari hewan-hewan lain dalam rangkaian upacara.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: mempersembahkannya
  rationale: Dalam konteks kurban, הקריב berarti membawa mendekat atau menghadapkan sebagai persembahan; pilihan ini alami dalam bahasa Indonesia tanpa menentukan tindakan penyembelihan yang belum dinyatakan oleh verba itu sendiri.
- source_word: לְאָשָׁם
  choice: sebagai kurban penebus kesalahan
  rationale: אָשָׁם merupakan istilah teknis untuk jenis kurban yang berkaitan dengan kesalahan dan pemulihan; pilihan ini menyampaikan fungsi penebusan tanpa menghilangkan unsur kesalahan.
- source_word: לֹג הַשָּׁמֶן
  choice: satu log minyak
  rationale: לֹג adalah satuan takaran cairan tertentu. Istilah teknis “log” dipertahankan dan dijelaskan dalam catatan kaki agar ukuran kunonya tidak diganti dengan perkiraan modern.
- source_word: וְהֵנִיף אֹתָם
  choice: Ia harus mengayun-ayunkan keduanya
  rationale: הניף menunjuk kepada gerakan ritual mengayunkan atau mengunjukkan; “keduanya” secara jelas merujuk pada domba dan minyak.
- source_word: תְּנוּפָה
  choice: sebagai persembahan unjukan
  rationale: תְּנוּפָה adalah istilah teknis bagi persembahan yang dikenai gerakan ritual tersebut; “persembahan unjukan” mempertahankan terminologi peribadatan yang dikenal sambil didampingi verba yang menjelaskan tindakannya.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: “Di hadapan” merupakan padanan alami formula ritual לִפְנֵי, dan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Makna teknis אָשָׁם
  choice: kurban penebus kesalahan
  alternative: kurban ganti rugi
  rationale: Istilah Ibrani mencakup kesalahan sekaligus kewajiban pemulihan. Teks utama memakai ungkapan yang lebih mudah dipahami dan mapan, sementara alternatif dicatat untuk mempertahankan dimensi reparatifnya.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; transliterasi “Yahweh” mempertahankan nama perjanjian tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual teknis dipertahankan bila penting bagi ketepatan, tetapi tindakan ritual dijelaskan dengan verba yang mudah dipahami. Semua penanda catatan kaki ditempatkan tepat pada istilah yang diterangkan.
