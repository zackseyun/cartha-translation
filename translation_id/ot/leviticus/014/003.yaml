  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: id
  text: Imam itu harus pergi ke tempat di luar perkemahan, lalu imam itu harus memeriksanya; dan ternyata penyakit kulit itu telah sembuh dari orang yang menderita penyakit itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara tradisional: “kusta”. Istilah Ibrani ini mencakup berbagai kelainan kulit dan tidak khusus menunjuk pada penyakit kusta modern (penyakit Hansen).'
    reason: Menjelaskan cakupan istilah Ibrani dan mencatat padanan tradisional tanpa memberi identifikasi medis yang terlalu sempit.
lexical_decisions:
- source_word: וְיָצָא
  choice: harus pergi
  rationale: Dalam konteks hukum prosedural, bentuk ini menyatakan tindakan yang diwajibkan, bukan sekadar peristiwa lampau.
- source_word: הַכֹּהֵן
  choice: imam itu
  rationale: Padanan baku dalam konteks ibadah Israel; pengulangannya dipertahankan sesuai teks Ibrani.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Ungkapan ini menunjukkan gerak menuju tempat di luar batas perkemahan dan dapat disampaikan secara alami demikian dalam bahasa Indonesia.
- source_word: וְרָאָה
  choice: harus memeriksanya
  rationale: Dalam peraturan pemeriksaan ini, ראה bukan hanya berarti melihat, melainkan mengamati untuk menentukan keadaan orang tersebut.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Mempertahankan fungsi presentatif וְהִנֵּה sebagai penanda hasil yang didapati dalam pemeriksaan, tanpa memakai ungkapan arkais.
- source_word: נִרְפָּא
  choice: telah sembuh
  rationale: Bentuk Nifal menyatakan keadaan hasil yang dialami penyakit itu; 'telah sembuh' alami dalam bahasa Indonesia.
- source_word: נֶגַע הַצָּרַעַת
  choice: penyakit kulit
  rationale: Istilah Ibrani menunjuk pada kelainan yang tampak dan menajiskan secara ritual, tetapi tidak dapat disamakan secara pasti dengan penyakit kusta modern.
- source_word: מִן הַצָּרוּעַ
  choice: pada orang yang terkena itu
  rationale: מן menandai bahwa penyakit tersebut telah hilang dari orang yang terkena; susunan 'pada orang ... telah sembuh' menyampaikan relasi itu secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna צָרַעַת dan הַצָּרוּעַ
  choice: penyakit kulit / orang yang terkena
  alternative: kusta / orang kusta
  rationale: Istilah Ibrani mencakup kategori kelainan yang berkaitan dengan kenajisan ritual dan tidak selalu merujuk pada penyakit Hansen. Terjemahan umum menghindari identifikasi medis yang anakronistis, sedangkan sebutan tradisional dicatat dalam catatan kaki.
- issue: Fungsi וְהִנֵּה dalam prosedur pemeriksaan
  choice: dan ternyata
  alternative: dan lihatlah / dan jika
  rationale: '''Dan ternyata'' mempertahankan nuansa ditemukannya keadaan tertentu. Terjemahan bersyarat ''jika'' terlalu cepat mengubah bentuk presentatif menjadi syarat, sedangkan ''lihatlah'' kurang alami dalam prosedur hukum modern.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Modal 'harus' menandai kewajiban dalam hukum ritual. Pengulangan 'imam itu' mengikuti teks Ibrani, sedangkan 'dan ternyata' mempertahankan daya presentatif וְהִנֵּה secara alami.
