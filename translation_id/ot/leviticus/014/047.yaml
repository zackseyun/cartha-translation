  text: וְ/הַ/שֹּׁכֵ֣ב בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָ֑י/ו וְ/הָ/אֹכֵ֣ל בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: id
  text: Siapa pun yang berbaring di dalam rumah itu harus mencuci pakaiannya[a], dan siapa pun yang makan di dalam rumah itu harus mencuci pakaiannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "yang tidur di dalam rumah itu." Kata Ibrani yang dipakai dapat berarti "berbaring" atau "tidur"; "berbaring" lebih luas dan sesuai dengan konteks hukum ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: Siapa pun yang berbaring
  rationale: Partisipel dengan artikel berfungsi sebagai nomina dan menunjuk secara umum kepada setiap orang. "Berbaring" mempertahankan cakupan verba שׁכב yang dapat berarti berbaring tanpa harus menyatakan bahwa orang itu benar-benar tidur.
- source_word: בַּבַּיִת
  choice: di dalam rumah itu
  rationale: Frasa lokatif ini secara alami merujuk kepada rumah yang sedang dibicarakan dalam konteks hukum. "Di dalam" menegaskan keberadaan di bagian dalam rumah.
- source_word: יְכַבֵּס
  choice: harus mencuci
  rationale: Dalam konteks hukum imamat, bentuk imperfek menyatakan kewajiban yang ditetapkan. "Harus mencuci" merupakan ungkapan hukum yang jelas dan alami dalam bahasa Indonesia modern.
- source_word: אֶת־בְּגָדָיו
  choice: pakaiannya
  rationale: בֶּגֶד berarti pakaian. Bentuk "pakaiannya" alami dalam bahasa Indonesia dan tetap singular tanpa perlu menandai gender gramatikal yang tidak tersedia pada pronomina posesif Indonesia.
- source_word: וְהָאֹכֵל
  choice: dan siapa pun yang makan
  rationale: Seperti partisipel sebelumnya, bentuk ini berfungsi secara substantival dan generik. "Siapa pun yang makan" menyampaikan cakupan hukum dengan jelas.
theological_decisions:
- issue: Cakupan bentuk maskulin tunggal generik dalam ketentuan hukum
  choice: Gunakan "siapa pun ... pakaiannya"
  alternative: Gunakan "orang yang ... pakaiannya" atau bentuk yang secara eksplisit menyebut laki-laki
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal dalam fungsi hukum yang representatif dan generik. Bahasa Indonesia tidak menandai gender dalam "siapa pun" maupun sufiks posesif -nya, sehingga terjemahan ini mempertahankan cakupan umum tanpa menambahkan pembatasan jenis kelamin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang lugas. "Harus" dipilih untuk menyatakan kewajiban; pengulangan klausa dipertahankan mengikuti struktur Ibrani.
