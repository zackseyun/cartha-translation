id: LEV.14.51
reference: Leviticus 14:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: id
  text: Lalu ia harus mengambil kayu aras, hisop, benang merah tua[a], dan burung yang hidup itu, lalu mencelupkan semuanya ke dalam darah burung yang disembelih dan ke dalam air segar[b], kemudian memerciki rumah itu tujuh kali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “merah tua dari ulat”; secara tradisional dipahami sebagai benang atau bahan yang dicelup merah tua.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani berbunyi “air hidup”, yaitu air segar atau air mengalir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Lalu ia harus mengambil
  rationale: Dalam rangkaian ketentuan ritual, bentuk ini menyampaikan tindakan wajib berikutnya; frasa ini alami dalam bahasa Indonesia dan mempertahankan daya instruksional teks.
- source_word: עֵץ הָאֶרֶז
  choice: kayu aras
  rationale: Padanan baku dan jelas untuk bahan ritual yang disebutkan dalam frasa konstruksi Ibrani.
- source_word: הָאֵזֹב
  choice: hisop
  rationale: Istilah tradisional yang sudah dikenal dalam bahasa Indonesia dan tetap dekat dengan nama tumbuhan dalam sumber.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: benang merah tua
  rationale: Ungkapan Ibrani menunjuk pada bahan yang diwarnai merah tua dengan zat warna dari serangga; 'benang' paling sesuai dengan pemahaman tradisional tentang benda ritual ini, sedangkan bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: burung yang hidup itu
  rationale: Mempertahankan kontras eksplisit antara burung yang masih hidup dan burung yang telah disembelih.
- source_word: וְטָבַל אֹתָם
  choice: lalu mencelupkan semuanya
  rationale: Kata kerja טבל berarti mencelupkan atau membenamkan. 'Semuanya' mempertahankan objek jamak yang merujuk pada seluruh bahan yang baru disebutkan.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: ke dalam darah burung yang disembelih
  rationale: '''Disembelih'' mempertahankan nuansa ritual dari שׁחט dan lebih tepat daripada sekadar ''dibunuh''.'
- source_word: וּבַמַּיִם הַחַיִּים
  choice: dan ke dalam air segar
  rationale: Ungkapan harfiah 'air hidup' menunjuk pada air dari sumber yang segar atau mengalir. 'Air segar' menyampaikan makna kontekstual tanpa memasukkan asosiasi teologis dari pemakaian lain; bentuk harfiah dijaga dalam catatan kaki.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: kemudian memerciki rumah itu
  rationale: Bentuk Hifil dari נזה adalah istilah lazim untuk pemercikan ritual; konstruksi Indonesia ini alami dan tetap mempertahankan rumah sebagai sasaran pemercikan.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Padanan langsung dan alami bagi keterangan jumlah pengulangan.
theological_decisions:
- issue: Makna מַיִם חַיִּים dalam peraturan ritual
  choice: air segar
  alternative: air hidup; air mengalir
  rationale: Dalam konteks ini, ungkapan tersebut menunjuk pada air segar dari sumber hidup atau mengalir. Teks utama memakai bahasa Indonesia yang jelas, sementara arti harfiah dan kemungkinan yang lebih khusus dipertahankan dalam catatan kaki agar ketegangan leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti urutan tindakan ritual sumber Ibrani, dengan penghubung yang alami bagi pembaca umum. Istilah 'aras', 'hisop', dan 'memerciki' mempertahankan corak ritual tanpa menjadi teknis secara berlebihan.
