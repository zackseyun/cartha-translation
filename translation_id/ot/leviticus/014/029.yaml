  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: id
  text: Sisa minyak yang ada pada telapak tangan imam itu harus dibubuhkan oleh imam itu pada kepala orang yang sedang ditahirkan, untuk mengadakan pendamaian baginya di hadapan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: Sisa minyak
  rationale: Partisipel Niphal הַנּוֹתָר dengan frasa partitif מִן הַשֶּׁמֶן menunjuk pada minyak yang masih tersisa; bentuk ringkas ini alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: yang ada di telapak tangan imam
  rationale: כַּף adalah telapak atau lekuk tangan. Untuk cairan yang ditampung, 'di telapak tangan' lebih alami daripada terjemahan harfiah 'di atas telapak tangan'.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: harus dibubuhkannya ke atas kepala
  rationale: נתן dalam tindakan ritual ini berarti menaruh atau membubuhkan. 'Membubuhkan' tepat untuk pengolesan minyak, sedangkan 'ke atas kepala' menyampaikan arah dan lokasi tindakan.
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan
  rationale: 'Partisipel Hitpael mempertahankan aspek proses: orang itu sedang menjalani ritus pentahiran, bukan sekadar sudah berada dalam keadaan tahir.'
- source_word: לְכַפֵּר עָלָיו
  choice: untuk mengadakan pendamaian baginya
  rationale: כפר adalah istilah ritual penting. 'Mengadakan pendamaian' mempertahankan bobot kultisnya, sementara עָלָיו menunjukkan pihak yang menerima manfaat tindakan tersebut.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan keberadaan di hadapan Allah dalam konteks ibadah, dan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi יהוה. 'Yahweh' mempertahankan nama perjanjian itu secara langsung tanpa menggantinya dengan gelar.
- issue: Makna kultis כפר
  choice: mengadakan pendamaian baginya
  alternative: mengadakan penebusan baginya; menghapus kesalahannya
  rationale: Rumusan ini menjaga istilah ritual dan tidak mempersempit maknanya menjadi satu teori tertentu tentang cara kerja pendamaian.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mengikuti urutan tindakan ritual dalam bahasa Ibrani, tetapi menggunakan ungkapan Indonesia yang alami. Tidak diperlukan catatan kaki karena alternatif pada konsultasi Inggris tampaknya salah tempat: frasa tentang minyak di telapak imam sudah diterjemahkan secara jelas dalam teks utama.'
