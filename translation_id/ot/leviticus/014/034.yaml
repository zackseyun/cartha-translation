  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: id
  text: “Ketika kamu memasuki negeri Kanaan yang Kuberikan kepadamu sebagai milikmu, dan Aku mendatangkan gangguan tsara'at[a] pada sebuah rumah di negeri milikmu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsara'at secara tradisional diterjemahkan “kusta”. Istilah Ibrani ini mencakup berbagai kondisi yang dapat mengenai kulit, kain, dan rumah, sehingga tidak sama persis dengan penyakit kusta (Hansen) dalam pengertian modern.
    reason: Menjelaskan keluasan makna צָרַעַת dan menghindari penyamaan dengan satu diagnosis medis modern.
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: Ketika kamu memasuki
  rationale: כִּי memperkenalkan keadaan yang akan terjadi dalam konteks hukum, sedangkan תָבֹאוּ adalah bentuk orang kedua jamak. ‘Ketika kamu memasuki’ alami dalam bahasa Indonesia dan menyampaikan latar waktu yang akan datang.
- source_word: אֶרֶץ כְּנַעַן
  choice: negeri Kanaan
  rationale: ‘Negeri Kanaan’ merupakan ungkapan geografis yang wajar dan tetap mempertahankan arti wilayah.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם לַאֲחֻזָּה
  choice: yang Kuberikan kepadamu untuk menjadi milikmu
  rationale: Bentuk partisip נֹתֵן menyatakan tindakan ilahi yang berlangsung atau segera diwujudkan. אֲחֻזָּה menunjuk pada tanah milik atau pegangan tetap; frasa Indonesia ini menyampaikan maksud tersebut secara alami.
- source_word: וְנָתַתִּי
  choice: dan Aku mendatangkan
  rationale: Secara harfiah berarti ‘dan Aku memberikan/menempatkan’. ‘Mendatangkan’ alami bagi munculnya suatu gangguan dan tetap mempertahankan tindakan Allah secara eksplisit.
- source_word: נֶגַע צָרַעַת
  choice: bercak penyakit
  rationale: נֶגַע dapat menunjuk pada tanda, bercak, atau gangguan yang tampak, sedangkan צָרַעַת mencakup kategori kondisi yang lebih luas daripada kusta modern dan dalam konteks ini mengenai rumah. ‘Bercak penyakit’ mempertahankan sifat yang tampak tanpa menyamakannya dengan diagnosis modern tertentu.
- source_word: בְּבֵית
  choice: pada sebuah rumah
  rationale: Dalam konteks bercak yang tampak pada bagian rumah, ‘pada sebuah rumah’ lebih alami daripada ‘di dalam sebuah rumah’ dan sesuai dengan pemakaian preposisi ב di sini.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: negeri milikmu
  rationale: Ungkapan ringkas ini mempertahankan hubungan leksikal dengan אֲחֻזָּה sebelumnya serta gagasan tentang negeri yang menjadi milik Israel.
theological_decisions:
- issue: Peran langsung Allah dalam munculnya gangguan pada rumah
  choice: Mempertahankan tindakan ilahi dalam bentuk ‘Aku mendatangkan’.
  alternative: Menggunakan bentuk impersonal seperti ‘muncul bercak penyakit’.
  rationale: Teks Ibrani secara eksplisit memakai bentuk orang pertama וְנָתַתִּי. Terjemahan tidak mengaburkan ketegangan teologis ini dengan menjadikan peristiwanya impersonal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘Kuberikan’ dan ‘Aku’ mempertahankan tuturan langsung Allah. Kalimat sengaja diakhiri koma karena ayat ini merupakan anak kalimat yang berlanjut ke ketentuan pada ayat berikutnya.
