  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: id
  text: Ia harus menyuruh orang mengerik seluruh bagian dalam rumah itu, lalu mereka harus membuang debu[a] yang telah dikerik itu ke luar kota, ke suatu tempat yang najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai secara harfiah berarti “debu”; dalam konteks ini, kata tersebut menunjuk pada bahan yang terlepas ketika bagian dalam rumah dikerik.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַקְצִעַ
  choice: harus menyuruh orang mengerik
  rationale: 'Bentuk Hifil menyatakan tindakan kausatif: ia memerintahkan atau mengatur agar pengerikan dilakukan, bukan harus mengerjakannya sendiri.'
- source_word: מִבַּיִת סָבִיב
  choice: rumah itu pada seluruh bagian dalamnya
  rationale: Ungkapan ini menunjuk pada sisi dalam rumah secara menyeluruh atau berkeliling; susunan ini menyampaikan cakupan tersebut dengan bahasa Indonesia yang wajar.
- source_word: וְשָׁפְכוּ
  choice: mereka harus membuang
  rationale: Secara dasar verba ini berarti menumpahkan atau mencurahkan. Dalam konteks pembuangan bahan hasil kerikan, 'membuang' menyatakan tindakan yang dimaksud secara alami tanpa mengubah pelakunya yang jamak.
- source_word: הֶעָפָר
  choice: debu
  rationale: Kata ini secara harfiah berarti 'debu'. Konteks menunjukkan bahwa yang dimaksud ialah bahan berdebu yang terlepas ketika bagian dalam rumah dikerik, tanpa perlu menambahkan bahan tertentu seperti plester.
- source_word: אֲשֶׁר הִקְצוּ
  choice: hasil kerikan itu
  rationale: Ungkapan ringkas ini secara alami menyatakan bahwa debu tersebut adalah bahan yang mereka lepaskan dengan mengerik.
- source_word: אֶל מִחוּץ לָעִיר
  choice: ke luar kota
  rationale: Rangkaian preposisi ini menunjukkan gerak menuju lokasi di luar batas kota.
- source_word: אֶל מָקוֹם טָמֵא
  choice: ke suatu tempat yang najis
  rationale: '''Najis'' mempertahankan istilah teknis mengenai ketidaktahiran ritual dalam Imamat; kata ''suatu'' sesuai dengan nomina Ibrani yang tidak tentu.'
theological_decisions:
- issue: Makna טָמֵא dalam konteks hukum ketahiran Imamat
  choice: najis
  alternative: tidak tahir
  rationale: '''Najis'' merupakan istilah Indonesia yang lazim untuk kategori ritual ini dan tidak dengan sendirinya mengubahnya menjadi penilaian moral.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Konstruksi 'menyuruh orang mengerik' mempertahankan daya kausatif verba, sedangkan 'hasil kerikan' menghindari pengulangan yang kaku dan tidak menambahkan bahan bangunan yang tidak dinyatakan secara eksplisit.
