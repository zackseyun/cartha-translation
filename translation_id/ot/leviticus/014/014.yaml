base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: id
  text: Lalu imam harus mengambil sebagian dari darah kurban penebus salah[a]. Imam harus membubuhkan darah itu pada cuping telinga kanan[b] orang yang sedang ditahirkan, pada ibu jari tangan kanannya, dan pada ibu jari kaki kanannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari darah kurban penebus salah.” Maksudnya, imam mengambil sebagian dari darah itu untuk ritus ini.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ujung telinga kanan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: sebagian dari darah
  rationale: 'Kata depan מִן di sini bersifat partitif: imam mengambil dari darah kurban itu, yakni sebagian darinya. Ungkapan ini jelas dan alami dalam bahasa Indonesia.'
- source_word: הָאָשָׁם
  choice: kurban penebus salah
  rationale: Dalam hukum kurban Imamat, אָשָׁם menunjuk pada jenis kurban khusus untuk kesalahan yang menuntut pemulihan atau ganti rugi. Istilah ini dikenal dan membedakannya dari kurban penghapus dosa.
- source_word: תְּנוּךְ אֹזֶן
  choice: cuping telinga
  rationale: תְּנוּךְ menunjuk pada bagian ujung atau bagian lunak telinga dalam konteks ritual. 'Cuping telinga' merupakan padanan anatomis yang alami, sementara ketidakpastian kecilnya dicatat dalam catatan kaki.
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan
  rationale: Partisipel ini menggambarkan orang yang sedang menjalani proses pentahiran. Bentuk pasif bahasa Indonesia menghindari kesan bahwa orang tersebut melakukan seluruh pentahiran atas dirinya sendiri.
- source_word: בֹּהֶן יָדוֹ
  choice: ibu jari tangan kanannya
  rationale: בֹּהֶן ketika dikaitkan dengan tangan berarti ibu jari.
- source_word: בֹּהֶן רַגְלוֹ
  choice: ibu jari kaki kanannya
  rationale: בֹּהֶן ketika dikaitkan dengan kaki berarti jari kaki yang besar; 'ibu jari kaki' adalah ungkapan Indonesia yang lazim.
- source_word: וְלָקַח ... וְנָתַן
  choice: harus mengambil ... harus membubuhkan
  rationale: Dalam rangkaian petunjuk ritual ini, bentuk verba menyatakan tindakan yang diwajibkan. 'Harus' menyampaikan daya preskriptifnya, sedangkan 'membubuhkan' cocok untuk pengolesan atau penempatan darah dalam ritus.
theological_decisions:
- issue: Kedudukan orang yang menjalani pentahiran
  choice: orang yang sedang ditahirkan
  alternative: orang yang mentahirkan diri; orang yang telah tahir
  rationale: Konteks menggambarkan orang itu sebagai peserta yang menjalani ritus pentahiran oleh imam. Terjemahan ini mempertahankan proses yang sedang berlangsung tanpa menyiratkan bahwa ia menahirkan dirinya secara mandiri atau bahwa prosesnya sudah selesai.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan subjek 'imam' dipertahankan untuk mengikuti penekanan prosedural teks Ibrani, sedangkan 'darah itu' ditambahkan secara eksplisit agar objek tindakan tetap jelas dalam bahasa Indonesia. Semua penanda catatan kaki ditempatkan pada frasa yang diterangkannya.
