source:
  edition: WLC
  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: id
  text: Ia harus mengambil burung yang masih hidup itu bersama kayu aras, benang merah tua, dan hisop. Lalu ia harus mencelupkan benda-benda itu serta burung yang masih hidup itu ke dalam darah burung yang telah disembelih di atas air yang mengalir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “air hidup”; dapat juga diterjemahkan “air segar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: burung yang masih hidup
  rationale: Menerjemahkan צִפּוֹר secara umum sebagai “burung” dan mempertahankan kontras חַיָּה dengan burung yang telah disembelih.
- source_word: יִקַּח
  choice: harus diambilnya
  rationale: Bentuk imperfek ini berfungsi sebagai ketentuan ritual; susunan ini mempertahankan daya preskriptif sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: עֵץ הָאֶרֶז
  choice: kayu aras
  rationale: Padanan Indonesia yang lazim untuk bahan kayu cedar dalam konteks Alkitab dan ritual.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: benang merah tua
  rationale: Ungkapan ini menunjuk pada bahan atau benang yang diberi pewarna merah tua; “benang” sesuai dengan benda ritual yang dimaksud tanpa menuntut identifikasi bahan yang lebih khusus.
- source_word: הָאֵזֹב
  choice: hisop
  rationale: Transliterasi tradisional yang transparan untuk tumbuhan ritual ini, yang identifikasi botanisnya tidak sepenuhnya pasti.
- source_word: וְטָבַל
  choice: harus dicelupkannya
  rationale: טבל menyatakan tindakan mencelupkan atau membenamkan sejenak ke dalam suatu cairan; “dicelupkan” merupakan padanan alami dalam konteks ini.
- source_word: אוֹתָם וְאֵת הַצִּפֹּר הַחַיָּה
  choice: semuanya, termasuk burung yang masih hidup itu
  rationale: Menjelaskan bahwa benda-benda yang baru disebut dan burung hidup sama-sama menjadi objek tindakan mencelupkan, tanpa mengubah cakupan teks.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחֻטָה
  choice: ke dalam darah burung yang telah disembelih
  rationale: Kata depan ב setelah טבל menandai cairan tempat benda dicelupkan, sedangkan שׁחט memiliki nuansa penyembelihan ritual.
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: di atas air yang mengalir
  rationale: Secara harfiah frasa ini berarti “air hidup” dan secara idiomatis menunjuk pada air segar atau mengalir. “Air yang mengalir” menyampaikan maknanya dengan jelas dalam bahasa Indonesia sambil mempertahankan ungkapan harfiahnya dalam catatan kaki.
theological_decisions:
- issue: Makna מַיִם חַיִּים dalam konteks pentahiran ritual
  choice: air yang mengalir
  alternative: air hidup; air segar
  rationale: Ungkapan Ibrani secara harfiah adalah “air hidup,” tetapi dalam konteks ini menunjuk pada air yang mengalir atau bersumber, bukan secara eksplisit pada konsep teologis yang lebih kemudian. Terjemahan utama menyampaikan arti idiomatis, sedangkan catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dibagi dua agar daftar benda ritual dan objek tindakan mencelupkan mudah dipahami. Pengulangan “burung yang masih hidup” dipertahankan karena penting bagi kontras ritual dalam teks sumber.
