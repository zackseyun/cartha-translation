id: LEV.14.13
reference: Leviticus 14:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁחַ֣ט אֶת הַ/כֶּ֗בֶשׂ בִּ֠/מְקוֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת הַֽ/חַטָּ֛את וְ/אֶת הָ/עֹלָ֖ה בִּ/מְק֣וֹם הַ/קֹּ֑דֶשׁ כִּ֡י כַּ֠/חַטָּאת הָ/אָשָׁ֥ם הוּא֙ לַ/כֹּהֵ֔ן קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: id
  text: Ia harus menyembelih anak domba itu di tempat orang menyembelih kurban penghapus dosa[a] dan kurban bakaran, di tempat kudus. Sebab, seperti kurban penghapus dosa, kurban penebus salah[b] itu menjadi bagian imam; kurban itu mahakudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian”. Istilah Ibrani חַטָּאת dapat menekankan fungsi ritus ini untuk membersihkan kenajisan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban ganti rugi”. Istilah Ibrani אָשָׁם dapat menonjolkan unsur pemulihan atau ganti rugi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Ia harus menyembelih
  rationale: Dalam konteks persembahan, שׁחט adalah istilah baku untuk penyembelihan ritual. Bentuk hukum Ibrani dinyatakan secara wajar dengan “harus”.
- source_word: הַכֶּבֶשׂ
  choice: anak domba itu
  rationale: כֶּבֶשׂ menunjuk pada anak domba, dan artikel tertentu dipertahankan dengan “itu” karena hewan tersebut telah ditentukan dalam konteks sebelumnya.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: di tempat orang menyembelih
  rationale: Bentuk tunggal יִשְׁחַט dapat berfungsi secara umum atau tak tentu dalam ketentuan hukum. “Orang menyembelih” menyampaikan kebiasaan ritual tanpa menetapkan pelaku tertentu.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Istilah ini mempertahankan nama kategori persembahan yang lazim sekaligus terdengar jelas dalam bahasa Indonesia; fungsi pemurniannya dicatat sebagai alternatif.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: עֹלָה adalah istilah teknis bagi persembahan yang dibakar seluruhnya; “kurban bakaran” merupakan padanan Indonesia yang ringkas dan mapan.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Artikel Ibrani menunjuk pada kawasan suci yang ditetapkan untuk penyembelihan. Padanan ini tidak mempersempitnya secara keliru menjadi ruang dalam Kemah Suci.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: Sebab, seperti kurban penghapus dosa, kurban penebus salah itu menjadi bagian imam
  rationale: Susunan ini mempertahankan perbandingan antara kedua jenis kurban dan menyatakan hak imam yang terkandung dalam לַכֹּהֵן tanpa menghilangkan hubungan sintaksisnya.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: kurban itu mahakudus
  rationale: Konstruksi intensif קֹדֶשׁ קָדָשִׁים menyatakan tingkat kekudusan tertinggi dalam klasifikasi ritual; “mahakudus” menyampaikannya secara ringkas dan teknis.
theological_decisions:
- issue: Makna חַטָּאת dalam hukum persembahan
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: חַטָּאת dapat menonjolkan baik kaitan dengan dosa maupun fungsi pemurnian ritual. Teks utama mempertahankan nama kategori yang dikenal, sedangkan catatan kaki menjaga alternatif penting tanpa memutuskan secara sepihak tujuan ritus tersebut.
- issue: Makna אָשָׁם
  choice: kurban penebus salah
  alternative: kurban ganti rugi
  rationale: “Kurban penebus salah” mempertahankan kategori persembahan yang berkaitan dengan kesalahan atau tanggungan. Alternatif “kurban ganti rugi” menonjolkan unsur pemulihan atau restitusi yang juga dapat terkandung dalam istilah Ibrani.
- issue: Rujukan hak imam dalam לַכֹּהֵן
  choice: menjadi bagian imam
  alternative: milik imam
  rationale: “Menjadi bagian imam” menyatakan peruntukan bagian kurban bagi imam tanpa memberi kesan bahwa seluruh upacara atau hewan itu merupakan milik pribadi imam dalam pengertian modern.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Istilah ritual dibuat konsisten dan mudah dipahami; kalimat hukum tetap tegas tanpa menjadi kaku. “Tempat kudus” dipertahankan sebagai lokasi ritual yang ditetapkan, sedangkan “mahakudus” dipakai sebagai klasifikasi teknis kekudusan.
