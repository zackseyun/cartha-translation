base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: id
  text: Ia harus memeriksa bagian yang terkena itu. Jika bagian yang terkena pada dinding rumah itu berupa lekukan-lekukan[a] yang berwarna kehijauan atau kemerahan, dan lekukan-lekukan itu tampak lebih rendah daripada permukaan dinding[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian-bagian yang cekung.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tampilannya lebih rendah daripada dinding”; maksudnya, bagian-bagian itu tampak cekung dari permukaan dinding.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Ia harus memeriksa
  rationale: Dalam konteks prosedur pemeriksaan oleh imam, kata ini berarti memeriksa dengan saksama, bukan sekadar melihat.
- source_word: הַנֶּגַע
  choice: bagian yang terkena itu
  rationale: Istilah ini menunjuk pada tanda atau bagian yang terkena kelainan pada rumah; pilihan ini wajar dalam bahasa Indonesia dan tidak menyiratkan diagnosis medis modern secara berlebihan.
- source_word: וְהִנֵּה
  choice: Jika ... tampak
  rationale: Dalam prosa hukum prosedural, ungkapan ini memperkenalkan keadaan yang didapati saat pemeriksaan. Bentuk bersyarat ini menyampaikan fungsinya secara alami.
- source_word: בְּקִירֹת הַבַּיִת
  choice: pada dinding rumah
  rationale: Bahasa Indonesia lazim memakai 'pada' untuk sesuatu yang terlihat di permukaan dinding, sementara keterangan berikutnya menjelaskan bahwa bagian itu tampak cekung.
- source_word: שְׁקַעֲרוּרֹת
  choice: lekukan-lekukan
  rationale: Kata langka ini menunjuk pada bagian-bagian yang cekung atau melesak. 'Lekukan-lekukan' mempertahankan bentuk jamak dan cocok dengan gambaran visual pada dinding.
- source_word: יְרַקְרַקֹּת
  choice: kehijau-hijauan
  rationale: Bentuk reduplikasi Ibrani menunjukkan rona yang cenderung hijau, bukan warna hijau yang tegas.
- source_word: אֲדַמְדַּמֹּת
  choice: kemerah-merahan
  rationale: Bentuk reduplikasi menunjukkan rona kemerahan, bukan merah pekat.
- source_word: וּמַרְאֵיהֶן שָׁפָל מִן הַקִּיר
  choice: lekukan-lekukan itu tampak lebih rendah daripada permukaan dinding
  rationale: Secara harfiah, tampilannya 'lebih rendah daripada dinding'. Penambahan 'permukaan' memperjelas bahwa tanda itu terlihat cekung tanpa mengubah kriteria visual teks.
