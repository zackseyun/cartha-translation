    rationale: Teks Ibrani menyatakan bahwa bagian yang terkena itu berada pada dinding rumah dan berupa/berciri lekukan-lekukan. Draf dapat dibaca hanya sebagai kemunculan lekukan di dinding.
  - severity: low
    issue: Ungkapan warna kurang idiomatis dibandingkan alternatif yang lebih langsung.
    rationale: '"Berwarna kehijauan atau kemerahan" tetap menyampaikan nuansa rona tidak pekat dari bentuk reduplikasi Ibrani dan lebih lancar dalam bahasa Indonesia baku.'
