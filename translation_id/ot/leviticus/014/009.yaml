source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: id
  text: 'Pada hari ketujuh, ia harus mencukur habis seluruh rambutnya: rambut kepalanya, janggutnya, dan alisnya. Ia harus mencukur habis seluruh rambutnya, mencuci pakaiannya, dan membasuh tubuhnya dengan air[a]; sesudah itu ia menjadi tahir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dagingnya.” Dalam konteks ini, ungkapan Ibrani tersebut merujuk pada tubuh orang itu.'
    reason: Menjelaskan pilihan idiomatis 'tubuhnya' untuk Ibrani בְּשָׂרוֹ sambil mempertahankan pembacaan harfiahnya.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Ungkapan Ibrani memperkenalkan tahap berikutnya dalam rangkaian ritual. Bentuk temporal ini alami dalam bahasa Indonesia dan mempertahankan urutannya.
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: ia harus mencukur habis seluruh rambutnya
  rationale: Bentuk Piel dari גלח menyatakan pencukuran atau penyingkiran rambut. 'Mencukur habis' menyampaikan ketuntasan, sedangkan 'seluruh rambutnya' mempertahankan cakupan menyeluruh.
- source_word: רֹאשׁוֹ
  choice: rambut kepalanya
  rationale: Secara harfiah objeknya adalah 'kepalanya', tetapi dalam konteks mencukur yang dimaksud ialah rambut pada kepala. Ungkapan eksplisit ini mencegah kesan bahwa kepala itu sendiri dicukur sebagai objek anatomis.
- source_word: זְקָנוֹ
  choice: janggutnya
  rationale: זָקָן dalam konteks ini secara lazim berarti janggut.
- source_word: גַּבֹּת עֵינָיו
  choice: alis matanya
  rationale: Ungkapan harfiah 'tonjolan/bagian atas matanya' menunjuk pada alis; 'alis matanya' ialah padanan Indonesia yang alami.
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: Ia harus mencukur habis seluruh rambutnya
  rationale: Pengulangan dalam teks sumber dipertahankan karena menegaskan bahwa seluruh rambut harus dicukur, tidak hanya bagian-bagian yang disebutkan.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: mencuci pakaiannya
  rationale: כבס lazim digunakan untuk mencuci pakaian; padanan ini jelas dan modern.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: membasuh tubuhnya dengan air
  rationale: בָּשָׂר secara harfiah berarti 'daging', tetapi di sini merupakan ungkapan bagi tubuh orang tersebut. 'Membasuh tubuhnya dengan air' alami dan tetap dekat dengan tindakan ritual sumber.
- source_word: וְטָהֵר
  choice: sesudah itu ia menjadi tahir
  rationale: Kata kerja tersebut menyatakan keadaan ritual yang dihasilkan sesudah tindakan-tindakan sebelumnya. 'Tahir' mempertahankan kategori kemurnian ritual dan membedakannya dari kebersihan fisik biasa.
theological_decisions:
- issue: Istilah status kemurnian ritual
  choice: tahir
  alternative: bersih; menjadi murni
  rationale: Konteksnya adalah status ritual menurut hukum Imamat, bukan kebersihan jasmani atau ketidakbersalahan moral. 'Tahir' merupakan istilah Indonesia yang tepat dan cukup dikenal untuk kategori ini.
- issue: Hubungan tindakan ritual dan hasilnya
  choice: sesudah itu ia menjadi tahir
  alternative: dan ia akan tahir
  rationale: Ungkapan ini memperjelas urutan yang terkandung dalam rangkaian verba tanpa menyatakan teori teologis tambahan tentang bagaimana ritual menghasilkan status tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'tahir' dipakai khusus bagi status ritual, sementara 'mencuci' dan 'membasuh' membedakan tindakan atas pakaian dan tubuh. Pengulangan teks Ibrani dipertahankan untuk menonjolkan totalitas pencukuran.
