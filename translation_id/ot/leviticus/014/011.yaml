id: LEV.14.11
reference: Leviticus 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: id
  text: Lalu imam yang melaksanakan pentahiran itu harus menghadapkan laki-laki yang sedang ditahirkan itu beserta semua benda itu di hadapan Yahweh, di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: harus menghadapkan
  rationale: Bentuk Hifil dari עמד berarti membuat seseorang atau sesuatu berdiri dalam konteks ritual. 'Menghadapkan' menyampaikan tindakan mempersembahkan mereka di hadapan Yahweh secara alami tanpa menghilangkan gagasan posisi ritual.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: imam yang melaksanakan pentahiran itu
  rationale: Partisipel Piel menerangkan peran imam sebagai pelaksana rangkaian pentahiran ritual, bukan sumber kemurnian moral.
- source_word: הָאִישׁ הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan tersebut
  rationale: הָאִישׁ menunjuk individu laki-laki dalam konteks, tetapi bahasa Indonesia lazim memakai 'orang' untuk rujukan ini; partisipel Hitpael menunjukkan bahwa ia sedang menjalani proses pentahiran ritual.
- source_word: וְאֹתָם
  choice: beserta semuanya itu
  rationale: Pronomina jamak ini merujuk pada berbagai persembahan dan perlengkapan dalam ayat sebelumnya. 'Semuanya itu' mempertahankan rujukan kontekstual tanpa keliru menyiratkan orang-orang lain.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan kultis ini berarti berada atau tampil di hadirat Allah; nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: '''Pintu masuk'' merupakan padanan Indonesia yang alami bagi פֶּתַח, sedangkan ''Kemah Pertemuan'' adalah istilah baku dan jelas bagi אֹהֶל מוֹעֵד.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dan sejalan dengan lapisan konsultasi yang telah diselaraskan.
- issue: Peran imam dalam pentahiran
  choice: imam yang melaksanakan pentahiran
  alternative: imam yang menyatakan tahir; imam yang menahirkan
  rationale: Frasa ini menyatakan fungsi ritual imam dalam keseluruhan proses tanpa membatasi tindakannya hanya pada pernyataan status dan tanpa menyiratkan bahwa imam menghasilkan kemurnian moral.
translation_notes:
  register: Bahasa Indonesia modern, resmi, dan mudah dipahami. 'Pentahiran/ditahirkan' dipakai untuk menjaga ranah ritual-imamat; konstruksi 'tersebut' memperjelas bahwa orang itu adalah orang yang sedang menjalani pentahiran. Tidak diperlukan catatan kaki.
