revisions:
- from: Lalu imam yang melaksanakan pentahiran itu harus menghadapkan orang yang sedang ditahirkan tersebut beserta semuanya itu di hadapan Yahweh, di pintu masuk Kemah Pertemuan.
  to: Lalu imam yang melaksanakan pentahiran itu harus menghadapkan laki-laki yang sedang ditahirkan itu beserta semua benda itu di hadapan Yahweh, di pintu masuk Kemah Pertemuan.
  rationale: Revisi hanya memulihkan penandaan maskulin eksplisit pada הָאִישׁ dan memperjelas bahwa pronomina jamak merujuk kepada benda-benda ritual dari ayat sebelumnya. Tidak ada perubahan pada makna ritual, nama ilahi, atau lokasi kudus.
