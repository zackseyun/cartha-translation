  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: id
  text: Sisa minyak[a] yang ada di telapak tangan imam itu harus dibubuhkan imam itu pada kepala orang yang sedang ditahirkan. Lalu imam itu harus mengadakan pendamaian bagi orang tersebut di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Minyak yang tersisa.”
    reason: Alternatif susunan yang sama-sama mencerminkan partisipel substantival וְהַנּוֹתָר dan hubungan partitif dengan בַּשֶּׁמֶן.
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: Sisa minyak
  rationale: Partisipel substantival נוֹתָר menyatakan apa yang masih tersisa, sedangkan בַּשֶּׁמֶן dipahami secara partitif dalam konteks. “Sisa minyak” ringkas, alami, dan tepat dalam bahasa Indonesia.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: yang ada di telapak tangan imam itu
  rationale: כַּף secara khusus menunjuk telapak tangan. Meskipun עַל secara harfiah berarti “di atas/pada,” ungkapan “di telapak tangan” lebih alami untuk minyak yang sedang ditampung tanpa mengubah gambaran tindakan.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: harus dibubuhkannya pada kepala
  rationale: נתן dapat berarti memberi, menaruh, atau membubuhkan. Dalam tindakan ritual pengolesan minyak, “membubuhkan” menyampaikan tindakan penerapan dengan wajar; bentuk klitik -nya merujuk kepada imam.
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan
  rationale: Partisipel Hitpael menunjukkan orang yang sedang menjalani proses pentahiran ritual. “Sedang ditahirkan” mempertahankan aspek proses dan konteks ritual tanpa mengartikannya sebagai penyucian moral.
- source_word: וְכִפֶּר עָלָיו
  choice: Dengan demikian, imam itu harus mengadakan pendamaian bagi orang tersebut
  rationale: כפר dalam tata ritual Imamat diterjemahkan dengan ungkapan mapan “mengadakan pendamaian,” tanpa menetapkan teori teologis tertentu. עָלָיו dinyatakan secara idiomatis dengan “bagi orang tersebut.”
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti “di hadapan” atau “dalam hadirat,” dan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Makna ritual כפר
  choice: mengadakan pendamaian
  alternative: mengadakan penebusan; menyucikan dari kenajisan
  rationale: “Mengadakan pendamaian” mempertahankan cakupan ritual-teologis כפר dalam Imamat dan tidak mempersempitnya menjadi satu teori penebusan atau sekadar pembersihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “ditahirkan” dipertahankan karena ketepatan ritualnya dalam konteks Imamat, sedangkan struktur kalimat dipecah menjadi dua agar mudah dipahami. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskannya.
