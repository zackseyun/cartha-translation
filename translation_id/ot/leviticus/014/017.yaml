id: LEV.14.17
reference: Leviticus 14:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: id
  text: Dari sisa minyak yang ada di telapak tangannya, imam harus membubuhkan sebagian pada cuping[a] telinga kanan orang yang sedang ditahirkan, pada ibu jari tangan kanannya, dan pada ibu jari kaki kanannya, di atas darah kurban penebus kesalahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ujung telinga.” Istilah Ibrani ini menunjuk bagian luar atau ujung telinga; dalam konteks ritual ini, “cuping” adalah padanan anatomis yang paling jelas.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada darah kurban penebus kesalahan.” Maksudnya tampaknya minyak dibubuhkan pada tempat yang sebelumnya telah diberi darah.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: dari sisa minyak
  rationale: Mempertahankan makna partitif מִן dan arti יֶתֶר sebagai sesuatu yang tersisa, dalam ungkapan Indonesia yang wajar.
- source_word: עַל כַּפּוֹ
  choice: yang ada di telapak tangannya
  rationale: כַּף menunjuk telapak atau lekuk tangan; frasa ini mengikuti gambaran ritual bahwa minyak berada pada telapak tangan imam.
- source_word: יִתֵּן
  choice: harus membubuhkan sebagian
  rationale: נתן berarti memberi, menaruh, atau membubuhkan. 'Membubuhkan' sesuai untuk pengolesan ritual, sedangkan 'sebagian' menyatakan bahwa hanya sejumlah dari minyak yang tersisa itu digunakan.
- source_word: תְּנוּךְ אֹזֶן
  choice: cuping telinga
  rationale: תְּנוּךְ menunjuk bagian luar atau ujung telinga. 'Cuping telinga' merupakan sebutan anatomis modern yang paling jelas, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan
  rationale: Partisipel hitpael menggambarkan orang yang sedang menjalani proses pentahiran ritual; bentuk ini mempertahankan aspek proses tanpa mengubahnya menjadi pernyataan moral.
- source_word: בֹּהֶן יָדוֹ
  choice: ibu jari tangan kanannya
  rationale: בֹּהֶן pada tangan berarti ibu jari; konteks menentukan makna anatomisnya.
- source_word: בֹּהֶן רַגְלוֹ
  choice: ibu jari kaki kanannya
  rationale: בֹּהֶן pada kaki berarti ibu jari kaki; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: עַל דַּם הָאָשָׁם
  choice: di atas darah kurban penebus kesalahan
  rationale: עַל paling mungkin menunjukkan bahwa minyak dibubuhkan pada tempat yang telah terkena darah. אָשָׁם dipertahankan sebagai istilah kurban khusus yang berkaitan dengan kesalahan atau tanggungan.
theological_decisions:
- issue: Padanan istilah kurban אָשָׁם
  choice: kurban penebus kesalahan
  alternative: kurban pemulihan; kurban ganti rugi
  rationale: Pilihan ini menyampaikan bahwa אָשָׁם adalah jenis kurban tertentu yang berkaitan dengan kesalahan atau tanggungan, tanpa memasukkan kategori doktrinal yang tidak dinyatakan teks.
- issue: Hubungan minyak dengan darah dalam frasa עַל דַּם
  choice: di atas darah
  alternative: pada darah
  rationale: Konteks ritual menunjukkan bahwa minyak dibubuhkan pada bagian tubuh yang sebelumnya telah diberi darah. 'Di atas' mempertahankan pengertian paling mungkin, sedangkan kemungkinan ungkapan yang lebih umum dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Ditahirkan' dipakai sebagai istilah ringkas untuk pentahiran ritual, bukan penyucian moral. Susunan anggota tubuh yang berulang dipertahankan agar pola upacara dalam teks sumber tetap tampak.
