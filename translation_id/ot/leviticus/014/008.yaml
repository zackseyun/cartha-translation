id: LEV.14.8
reference: Leviticus 14:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: id
  text: Orang yang sedang ditahirkan itu harus mencuci pakaiannya,[a] mencukur seluruh rambutnya, dan mandi dengan air; sesudah itu ia menjadi tahir. Kemudian ia boleh masuk ke perkemahan,[b] tetapi harus tinggal di luar kemahnya selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang sedang menjalani pentahiran.” Bahasa Ibrani menunjuk kepada orang yang menjalani tata cara pentahiran yang ditetapkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “ia akan masuk ke perkemahan.” Bentuk Ibraninya dapat dibaca sebagai pernyataan sederhana (“akan masuk”) atau sebagai izin (“boleh masuk”); konteksnya menunjukkan bahwa ia diizinkan masuk kembali, tetapi masih dikenai pembatasan.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: orang yang sedang ditahirkan
  rationale: Bentuk Hitpael partisip menunjuk kepada orang yang sedang menjalani proses pentahiran ritual. Bentuk pasif bahasa Indonesia mempertahankan nuansa bahwa ia dikenai tata cara tersebut.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: כִּבֵּס lazim dipakai untuk mencuci pakaian. 'Pakaian' alami dalam bahasa Indonesia modern, sedangkan 'harus' menyampaikan daya instruktif rangkaian bentuk verbal ini.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: mencukur seluruh rambutnya
  rationale: Frasa ini menuntut pencukuran menyeluruh. 'Seluruh rambutnya' mempertahankan cakupan כָּל tanpa ungkapan yang janggal.
- source_word: רָחַץ בַּמַּיִם
  choice: mandi dengan air
  rationale: Dalam konteks ritual, רָחַץ menunjuk pada pembasuhan tubuh. 'Mandi' membedakannya dengan tindakan mencuci pakaian sebelumnya.
- source_word: וְטָהֵר
  choice: sesudah itu ia menjadi tahir
  rationale: Klausa ini menyatakan hasil status ritual sesudah tindakan pembasuhan. 'Menjadi tahir' lebih tepat daripada bahasa moral seperti 'menjadi suci'.
- source_word: וְאַחַר
  choice: Kemudian
  rationale: Kata ini menandai tahap berikutnya dalam urutan ritual; 'kemudian' ringkas dan alami.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: ia boleh masuk ke perkemahan
  rationale: Dalam konteks izin masuk kembali yang masih disertai pembatasan, imperfek dapat dipahami secara permisif. Catatan kaki mempertahankan kemungkinan pembacaan futuratif/instruktif.
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: tetapi harus tinggal di luar kemahnya
  rationale: יָשַׁב di sini berarti tinggal atau menetap sementara. 'Tetapi' mengungkapkan kontras kontekstual antara masuk ke perkemahan dan belum boleh kembali ke kemah sendiri, meski penghubung Ibraninya adalah waw.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Ungkapan durasi ini diterjemahkan secara idiomatis dan tepat.
theological_decisions:
- issue: Sifat istilah ketahiran ritual
  choice: ditahirkan/tahir
  alternative: dibersihkan/bersih; dimurnikan/murni
  rationale: טהר dalam konteks ini menyatakan status ritual menurut tata cara Imamat, bukan terutama kebersihan jasmani atau kemurnian moral. 'Tahir' adalah istilah Indonesia yang ringkas dan mapan untuk mempertahankan kategori ritual tersebut.
- issue: Daya modal יָבֹא saat masuk kembali ke perkemahan
  choice: boleh masuk
  alternative: akan masuk; harus masuk
  rationale: Pembatasan berikutnya—harus tinggal di luar kemahnya—mendukung pemahaman bahwa orang itu diizinkan masuk kembali ke lingkup perkemahan, tetapi pemulihannya belum sepenuhnya selesai. Karena bentuk Ibraninya tetap dapat dibaca sebagai pernyataan sederhana, alternatif itu dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang bermartabat dan mudah dipahami. Istilah 'tahir' dipertahankan karena tepat bagi kategori ritual Imamat; struktur kalimat dibuat alami tanpa menghapus urutan tindakan dan pembatasan dalam teks Ibrani.
