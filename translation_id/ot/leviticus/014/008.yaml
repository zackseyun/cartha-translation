  source_fidelity: 'Terjemahan dengan tepat mempertahankan urutan tindakan dalam bahasa Ibrani: mencuci pakaian, mencukur seluruh rambut, mandi, memperoleh status tahir, masuk kembali ke perkemahan, dan tinggal di luar kemah selama tujuh hari. “Orang yang sedang ditahirkan” menyampaikan fungsi partisip Hitpael dalam konteks tata cara ritual tanpa memoraliskan istilah tersebut. Pembacaan permisif “boleh masuk” dapat dipertanggungjawabkan secara kontekstual, dan alternatif pembacaan futuratif dicatat.'
