id: LEV.14.24
reference: Leviticus 14:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: id
  text: Kemudian imam harus mengambil anak domba untuk kurban penebus kesalahan[a] dan satu log minyak[b], lalu imam harus mengunjukkan keduanya sebagai persembahan unjukan di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “anak domba dari kurban penebus kesalahan”; secara tradisional juga disebut “anak domba kurban penebus salah”.
    reason: lexical_alternative
  - marker: b
    text: “Log” adalah satuan kecil untuk mengukur cairan dalam tata ritual Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Waw dengan bentuk qatal melanjutkan urutan tata cara; “kemudian” menyatakan perkembangan prosedural secara alami, sedangkan “harus” mempertahankan daya perintahnya.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku כֹּהֵן dalam konteks ritual. Penyebutan subjek yang kedua dipertahankan karena teks Ibrani mengulanginya sebelum verba berikutnya.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: anak domba untuk kurban penebus kesalahan
  rationale: כֶּבֶשׂ adalah anak domba, sedangkan אָשָׁם menunjuk kategori kurban yang berkaitan dengan kesalahan dan tanggungan. Susunan “untuk” menyampaikan hubungan konstruksi Ibrani dengan wajar tanpa meleburkan kedua unsur.
- source_word: לֹג הַשָּׁמֶן
  choice: satu log minyak
  rationale: לֹג adalah satuan khusus untuk cairan. Transliterasi “log” mempertahankan istilah teknis ritual, sementara “satu” membuat fungsi satuannya jelas dalam bahasa Indonesia.
- source_word: וְהֵנִיף
  choice: lalu ... harus mengunjukkan
  rationale: Bentuk Hifil dari נוּף menunjuk tindakan ritual menggerakkan atau mempersembahkan di hadapan Yahweh. “Mengunjukkan” mempertahankan istilah ritual Indonesia dan berpasangan alami dengan “persembahan unjukan”.
- source_word: אֹתָם
  choice: keduanya
  rationale: Pronomina jamak mengacu bersama-sama kepada anak domba dan satu log minyak; “keduanya” memperjelas bahwa tepat dua unsur yang dimaksud.
- source_word: תְּנוּפָה
  choice: sebagai persembahan unjukan
  rationale: Nomina yang serumpun dengan נוּף menyatakan tindakan atau kategori ritual pengunjukan. Padanan ini mempertahankan hubungan leksikal dengan verba “mengunjukkan”.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan kultis ini menyatakan penyajian dalam kehadiran ilahi. Nama diri יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri itu tanpa menggantinya dengan gelar, sambil menghindari bentuk campuran yang kurang dekat dengan bukti kebahasaan.
- issue: Penerjemahan אָשָׁם dalam hukum kurban
  choice: kurban penebus kesalahan
  alternative: kurban penghapus salah; kurban kesalahan
  rationale: Istilah ini perlu tetap dibedakan sebagai kategori kurban tersendiri. “Penebus kesalahan” menyampaikan kaitannya dengan kesalahan dan tanggungan, tanpa menentukan secara berlebihan seluruh teori teologis mengenai fungsi kurban tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur prosedural dipertahankan, termasuk pengulangan “imam”. Istilah teknis “log” dijelaskan melalui catatan kaki; pasangan “mengunjukkan/persembahan unjukan” menjaga kaitan kata yang terdapat dalam bahasa Ibrani.
