id: LEV.14.48
reference: Leviticus 14:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם בֹּ֨א יָבֹ֜א הַ/כֹּהֵ֗ן וְ/רָאָה֙ וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ/בַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת הַ/בָּ֑יִת וְ/טִהַ֤ר הַ/כֹּהֵן֙ אֶת הַ/בַּ֔יִת כִּ֥י נִרְפָּ֖א הַ/נָּֽגַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: id
  text: Namun, jika imam datang dan memeriksanya, lalu ternyata tanda penyakit itu tidak menyebar di dalam rumah itu setelah rumah itu dilapisi plester, imam harus menyatakan rumah itu tahir[a], sebab tanda penyakit itu telah sembuh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menetapkan rumah itu bersih.” Kata Ibrani ini dalam konteks tersebut menunjuk pada pernyataan imam tentang status ketahiran rumah.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara harfiah memakai ungkapan “telah sembuh” untuk gangguan pada rumah. Kata yang diterjemahkan “tanda penyakit” juga dapat diterjemahkan “gangguan” atau, secara tradisional, “tulah”.
    reason: lexical_metaphor
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Membuka kelanjutan bersyarat yang berlawanan dengan kemungkinan dalam prosedur sebelumnya; bentuk ini wajar dalam bahasa Indonesia.
- source_word: בֹּא יָבֹא
  choice: datang
  rationale: Gabungan infinitif absolut dan bentuk finit memberi penegasan pada tindakan datang. Dalam prosedur hukum ini, bahasa Indonesia secara alami cukup memakai 'datang'; penegasan tidak perlu dibuat berlebihan.
- source_word: וְרָאָה
  choice: memeriksanya
  rationale: Secara harfiah berarti 'melihat', tetapi dalam konteks imam datang untuk melakukan pemeriksaan. Pronomina '-nya' merujuk pada rumah beserta keadaan yang sedang diperiksa.
- source_word: וְהִנֵּה
  choice: lalu ternyata
  rationale: Menandai hasil yang didapati melalui pemeriksaan dan mempertahankan fungsi penarik perhatian dari partikel Ibrani dalam ungkapan Indonesia yang alami.
- source_word: לֹא פָשָׂה
  choice: tidak menyebar
  rationale: Dalam konteks gangguan pada kulit, kain, atau rumah, פשׂה menunjukkan bahwa gangguan meluas atau menyebar.
- source_word: הַנֶּגַע
  choice: tanda penyakit itu
  rationale: נגע menunjuk pada gangguan atau tanda yang menimpa rumah, tanpa harus disamakan dengan diagnosis medis modern. Pilihan ini lebih jelas daripada 'wabah' dan tetap mempertahankan gagasan adanya kondisi yang terlihat.
- source_word: בַּבַּיִת
  choice: di dalam rumah itu
  rationale: Mencerminkan preposisi Ibrani 'di/dalam' dan lokasi menyebarnya gangguan pada bangunan.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: setelah rumah itu dilapisi plester
  rationale: טוח mengacu pada tindakan melapisi atau memplester rumah dalam proses penanganannya; bentuk pasif sesuai karena pelakunya tidak ditonjolkan.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבַּיִת
  choice: imam harus menyatakan rumah itu tahir
  rationale: Dalam tata kemurnian imamat, טהר di sini menyatakan penetapan status tahir oleh imam, bukan bahwa imam melakukan pembersihan fisik rumah pada tahap ini.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: sebab tanda penyakit itu telah sembuh
  rationale: נרפא berasal dari רפא, 'sembuh'. Pilihan ini mempertahankan metafora penyembuhan yang dipakai teks bagi gangguan pada rumah.
theological_decisions:
- issue: Penetapan status ritual atau tindakan membersihkan dalam וְטִהַר
  choice: imam menyatakan rumah itu tahir
  alternative: imam membersihkan rumah itu
  rationale: Konteks hukum-imamat menempatkan imam sebagai pihak yang menetapkan status kemurnian setelah pemeriksaan. Terjemahan ini tidak menyiratkan bahwa imam sendiri melakukan pekerjaan pembersihan fisik.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'tahir' dipertahankan karena menunjuk pada status ritual, sedangkan 'dilapisi plester' menjelaskan tindakan perbaikan bangunan secara konkret. Metafora Ibrani tentang gangguan rumah yang 'sembuh' sengaja dipertahankan dan diterangkan dalam catatan kaki.
