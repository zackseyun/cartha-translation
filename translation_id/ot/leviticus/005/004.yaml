language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: id
  text: Atau jika seseorang bersumpah dengan gegabah[a] untuk berbuat jahat atau berbuat baik—apa pun yang diucapkan manusia dalam sumpah—dan hal itu tersembunyi darinya, lalu ia mengetahuinya dan menjadi bersalah dalam salah satu perkara ini,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “dengan gegabah” juga dapat menekankan tindakan mengucapkan sesuatu dengan bibir; dalam konteks ini, nuansa sumpah yang gegabah mungkin dimaksudkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Dalam rumusan hukum ini, נֶפֶשׁ menunjuk kepada seorang individu, bukan jiwa sebagai bagian nonjasmani.
- source_word: תִשָּׁבַע
  choice: bersumpah
  rationale: Bentuk Nifal dari שׁבע di sini menyatakan tindakan mengucapkan sumpah.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: dengan gegabah melalui bibirnya
  rationale: בּטא pada dasarnya berkaitan dengan pengucapan verbal; konteks mendukung nuansa ucapan sumpah yang gegabah. Frasa 'melalui bibirnya' mempertahankan gambaran Ibrani.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: untuk berbuat jahat atau berbuat baik
  rationale: Terjemahan ini mempertahankan pasangan polar yang mencakup luasnya isi sumpah tanpa mempersempitnya menjadi hanya merugikan atau menolong orang lain.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: apa pun yang diucapkan manusia dalam sumpah
  rationale: Ungkapan ini memperluas kasus kepada segala ucapan dalam sumpah. 'Manusia' menyampaikan הָאָדָם sebagai sebutan generik bagi manusia tanpa membatasi cakupan hukumnya menurut jenis kelamin.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: lalu hal itu tersembunyi darinya
  rationale: Bentuk pasif sumber dipertahankan, sehingga tidak dipastikan apakah yang luput dari kesadaran adalah sumpah, implikasinya, atau pelanggarannya.
- source_word: וְהוּא יָדַע
  choice: tetapi kemudian ia menyadarinya
  rationale: Terjemahan ini menyatakan perkembangan dari ketidaksadaran menuju pengetahuan kemudian, sambil memakai ungkapan Indonesia yang alami.
- source_word: וְאָשֵׁם
  choice: menjadi bersalah
  rationale: Kata kerja ini menyatakan timbul atau nyatanya kesalahan dan tanggung jawab hukum.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: dalam salah satu perkara itu
  rationale: Frasa ini menunjuk kembali kepada perkara-perkara hukum yang disebut dalam konteks terdekat.
theological_decisions:
- issue: Cakupan generik הָאָדָם dalam rumusan hukum
  choice: manusia
  alternative: seorang laki-laki; seseorang
  rationale: '''Manusia'' mempertahankan unsur אָדָם dan fungsi tunggal representatifnya secara alami dalam bahasa Indonesia, tanpa menyiratkan bahwa hukum ini hanya berlaku bagi laki-laki.'
- issue: Objek ketidaksadaran dalam וְנֶעְלַם מִמֶּנּוּ
  choice: mempertahankan ungkapan pasif 'hal itu tersembunyi darinya'
  alternative: ia tidak menyadari sumpah itu; ia tidak menyadari pelanggarannya
  rationale: Teks Ibrani tidak menetapkan secara tegas apa yang tersembunyi darinya; terjemahan tidak menyelesaikan ambiguitas tersebut secara sepihak.
- issue: Nuansa לְבַטֵּא בִשְׂפָתַיִם
  choice: bersumpah dengan gegabah melalui bibirnya
  alternative: bersumpah dengan mengucapkannya melalui bibirnya
  rationale: Konteks hukum mendukung nuansa gegabah, tetapi makna dasar berupa pengucapan verbal tetap terlihat melalui frasa 'melalui bibirnya' dan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang tetap jelas bagi pembaca umum. Struktur kalimat mempertahankan kesinambungan dengan ayat-ayat di sekitarnya; tanda koma akhir menunjukkan bahwa kalimat hukum berlanjut ke ayat berikutnya.
