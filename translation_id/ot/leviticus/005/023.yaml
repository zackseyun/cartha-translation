base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: id
  text: Apabila ia berbuat dosa dan bersalah[a], maka ia harus mengembalikan apa yang dirampasnya, atau apa yang diperolehnya dengan menindas orang lain,[b] atau barang titipan yang dipercayakan kepadanya, atau barang hilang yang ditemukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika ia berbuat dosa dan menanggung kesalahan.” Rumus hukum Ibrani dapat dipahami sebagai “apabila” atau “jika”; ungkapan terakhir juga dapat berarti bahwa ia menanggung tanggung jawab atas kesalahannya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “apa yang diperasnya,” “apa yang diperolehnya dengan kecurangan,” atau “apa yang ditahannya secara tidak adil.” Istilah Ibrani mencakup pengambilan atau penahanan harta orang lain melalui penindasan atau penipuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Maka, apabila
  rationale: Rumus hukum kasuistik ini memperkenalkan keadaan yang menimbulkan kewajiban. 'Maka, apabila' alami dalam bahasa Indonesia dan tetap mempertahankan nuansa kondisional-temporal.
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: ia berbuat dosa dan menjadi bersalah
  rationale: Terjemahan ini mempertahankan baik tindakan berdosa maupun timbulnya keadaan bersalah atau tanggung jawab hukum, tanpa menyempitkannya menjadi kesadaran batin akan kesalahan.
- source_word: וְהֵשִׁיב
  choice: ia harus mengembalikan
  rationale: '''Harus'' menyampaikan daya wajib dari ketentuan hukum, sedangkan ''mengembalikan'' sesuai dengan konteks pemulihan barang kepada pemiliknya.'
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: apa yang dirampasnya
  rationale: Pasangan nomina-verba serumpun menunjuk pada barang yang diambil secara melawan hak. 'Dirampasnya' ringkas dan mempertahankan kekuatan tindakan tersebut tanpa pengulangan yang janggal.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: apa yang diperolehnya dengan menindas orang lain
  rationale: Istilah ini dapat mencakup perolehan atau penahanan harta melalui penindasan, pemerasan, atau kecurangan. Rumusan ini mempertahankan cakupan yang cukup luas dan cocok dengan daftar barang yang wajib dikembalikan.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: barang titipan yang dipercayakan kepadanya
  rationale: '''Barang titipan'' secara alami menunjuk pada harta yang diserahkan untuk dijaga, dan ''dipercayakan kepadanya'' menegaskan hubungan amanat.'
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: barang hilang yang ditemukannya
  rationale: Terjemahan langsung dan wajar untuk harta milik orang lain yang hilang lalu ditemukan oleh pelaku.
theological_decisions:
- issue: Hubungan antara dosa dan keadaan bersalah dalam וְאָשֵׁם
  choice: menjadi bersalah
  alternative: menyadari kesalahannya / menanggung kesalahan
  rationale: Bentuk Ibrani dapat berkaitan dengan bersalah atau menanggung tanggung jawab, tetapi ayat ini tidak secara tegas hanya berbicara tentang kesadaran subjektif. Terjemahan utama menjaga arti hukum-moral yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat. Struktur daftar dipertahankan, tetapi pengulangan serumpun khas Ibrani dibuat alami. Tanda koma sebelum catatan [a] menempatkan catatan pada keseluruhan klausa pembuka.
