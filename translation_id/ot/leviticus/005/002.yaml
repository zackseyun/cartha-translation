id: LEV.5.2
reference: Leviticus 5:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: id
  text: Atau apabila seseorang menyentuh sesuatu yang najis—baik bangkai binatang liar yang najis, bangkai ternak yang najis, maupun bangkai binatang yang merayap yang najis—dan hal itu luput dari pengetahuannya[a], ia menjadi najis dan bersalah[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hal itu tersembunyi darinya”; maksudnya, ia tidak menyadarinya.
    reason: lexical_alternative
  - marker: b
    text: Artinya, ia terkena kesalahan atau tanggung jawab dalam kaitannya dengan kenajisan itu; menyentuh bangkai tidak dengan sendirinya disamakan dengan kejahatan moral yang disengaja.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Dalam konteks hukum, kata ini menunjuk kepada seorang individu, bukan secara khusus kepada jiwa sebagai bagian nonjasmani manusia. “Seseorang” alami dan mencakup siapa pun yang terkena ketentuan ini.
- source_word: תִּגַּע בְּ
  choice: menyentuh
  rationale: Kata kerja נגע dengan preposisi ב menyatakan kontak fisik. “Menyentuh” merupakan padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: כָל דָּבָר טָמֵא
  choice: sesuatu yang najis
  rationale: דָּבָר bersifat luas dan di sini memperkenalkan kategori umum yang kemudian dijabarkan. “Sesuatu yang najis” mempertahankan keluasan itu tanpa terasa kaku.
- source_word: נִבְלַת
  choice: bangkai
  rationale: Dalam hukum kenajisan Imamat, נְבֵלָה menunjuk kepada tubuh hewan yang mati. “Bangkai” adalah istilah Indonesia yang tepat dan ringkas.
- source_word: חַיָּה טְמֵאָה
  choice: binatang liar yang najis
  rationale: חַיָּה di sini dibedakan dari בְּהֵמָה dan menunjuk kepada binatang darat liar. Pilihan ini mempertahankan pembedaan antarkategori hewan.
- source_word: בְּהֵמָה טְמֵאָה
  choice: ternak yang najis
  rationale: בְּהֵמָה dalam kontras ini menunjuk kepada hewan piaraan berkaki empat. “Ternak” singkat, alami, dan jelas dibedakan dari binatang liar.
- source_word: שֶׁרֶץ טָמֵא
  choice: binatang berkeriapan yang najis
  rationale: שֶׁרֶץ merupakan kategori makhluk kecil yang bergerak berkerumun atau merayap. “Binatang berkeriapan” cukup dekat dengan kategori Ibrani tanpa membatasinya pada satu jenis tertentu.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: dan hal itu luput dari pengetahuannya
  rationale: Bentuk nifal dari עלם secara harfiah menyatakan bahwa hal tersebut tersembunyi darinya, yakni tidak diketahuinya. Ungkapan ini mempertahankan sudut pandang Ibrani sekaligus alami dalam bahasa Indonesia.
- source_word: וְהוּא טָמֵא
  choice: maka ia menjadi najis
  rationale: Klausa ini menyatakan status kenajisan yang dialami orang tersebut. “Menjadi najis” menjelaskan perubahan status tanpa mengartikannya sebagai keburukan moral.
- source_word: וְאָשֵׁם
  choice: dan menanggung kesalahan
  rationale: אָשֵׁם dalam konteks hukum menyatakan keadaan bersalah atau terkena tanggung jawab hukum-kultis. “Menanggung kesalahan” mempertahankan nuansa pertanggungjawaban tanpa menyamakannya begitu saja dengan dosa moral yang disengaja.
theological_decisions:
- issue: Hakikat kenajisan
  choice: Menerjemahkan טָמֵא/טְמֵאָה dengan “najis”.
  alternative: cemar; berdosa
  rationale: Ayat ini membahas status kenajisan ritual akibat bersentuhan dengan bangkai, bukan menyatakan bahwa kontak tersebut dengan sendirinya merupakan kejahatan moral. “Najis” adalah istilah yang lazim dan tepat dalam konteks hukum kesucian Imamat.
- issue: Makna וְאָשֵׁם
  choice: “menanggung kesalahan” sebagai pertanggungjawaban yang timbul dalam ketentuan ini.
  alternative: menjadi berdosa; dinyatakan bersalah secara moral
  rationale: Istilah Ibrani dapat menyatakan kesalahan atau liabilitas. Terjemahan dipilih agar bobot hukumnya tetap terdengar, tetapi tidak menyelesaikan secara berlebihan hubungan antara kenajisan ritual, ketidaktahuan, dan kesalahan moral.
- issue: Rujukan gender
  choice: Menggunakan “seseorang” dan pronomina “ia/-nya”.
  alternative: seorang laki-laki; dia (laki-laki)
  rationale: נֶפֶשׁ di sini bersifat generik. Bahasa Indonesia tidak menuntut penandaan gender pada pronomina, sehingga “ia” mengikuti cakupan umum sumber tanpa menambahkan jenis kelamin yang tidak menjadi pokok ketentuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah membantu pembaca mengikuti tiga contoh bangkai yang menjabarkan “sesuatu yang najis”. Koma penutup dipertahankan karena ayat ini merupakan bagian dari rangkaian ketentuan yang berlanjut ke ayat berikutnya.
