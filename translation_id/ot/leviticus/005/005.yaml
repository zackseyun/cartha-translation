  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: id
  text: Maka, apabila seseorang menjadi bersalah[a] dalam salah satu perkara itu, ia harus mengakui dosa yang telah dilakukannya berkenaan dengan perkara itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terkena tanggungan kesalahan” atau “bersalah.” Kata kerja Ibrani menekankan keadaan bersalah atau tanggungan hukum, bukan sekadar kesadaran batin akan kesalahan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bagian akhirnya berbunyi: “yang telah ia lakukan berdosa berkenaan dengannya.” Kata ganti “dengannya” merujuk kembali kepada salah satu perkara yang baru disebutkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: Maka, apabila
  rationale: Ungkapan ini membuka keadaan dalam ketentuan hukum. 'Maka, apabila' mempertahankan peralihan dan nuansa kondisional-temporalnya secara wajar dalam bahasa Indonesia.
- source_word: יֶאְשַׁם
  choice: menjadi bersalah
  rationale: Verba אשם menunjuk pada keadaan bersalah atau terkena tanggungan hukum, bukan secara khusus pada kesadaran batin bahwa ia bersalah.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: dalam salah satu perkara itu
  rationale: Frasa ini merujuk kembali kepada kasus-kasus yang baru disebutkan; 'perkara' sesuai dengan konteks hukum dan tidak menambahkan rincian baru.
- source_word: וְהִתְוַדָּה
  choice: ia harus mengakui
  rationale: Bentuk Hitpael dari ידה di sini berarti mengaku. 'Harus' menyampaikan daya ketentuan hukum dengan bahasa Indonesia yang alami.
- source_word: אֲשֶׁר חָטָא
  choice: dosa yang telah dilakukannya
  rationale: Ungkapan ini menyatakan isi pengakuan. Perumusan tersebut lebih alami daripada terjemahan struktur verbal secara harfiah, tetapi tetap mempertahankan rujukan kepada dosa yang dilakukan.
- source_word: עָלֶיהָ
  choice: berkenaan dengan perkara itu
  rationale: Pronomina feminin tunggal merujuk kembali kepada salah satu perkara yang disebut; frasa ini mempertahankan hubungan eksplisit tersebut.
theological_decisions:
- issue: Apakah יֶאְשַׁם menyatakan kesadaran akan kesalahan atau status/tanggungan bersalah
  choice: menjadi bersalah
  alternative: menyadari kesalahannya
  rationale: Teks Ibrani menekankan keadaan bersalah atau tanggungan hukum dan tidak secara eksplisit menyatakan proses menyadari kesalahan.
translation_notes:
  register: Bahasa hukum yang dignified namun tetap mudah dipahami. 'Seseorang' dipakai untuk mengungkapkan subjek maskulin generik dalam konteks umum; pengulangan 'perkara itu' mempertahankan rujukan pronominal teks Ibrani.
