language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: id
  text: “Jika seseorang berbuat tidak setia dan tanpa sengaja berdosa dalam hal barang-barang kudus milik Yahweh, ia harus membawa kepada Yahweh persembahan ganti ruginya[a], yaitu seekor domba jantan yang tidak bercacat dari kawanan, menurut penilaianmu dalam syikal perak berdasarkan standar syikal tempat kudus[b], sebagai persembahan ganti rugi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani אָשָׁם, yang muncul dua kali dalam ayat ini, juga dapat diterjemahkan “persembahan salah” atau “persembahan penebus salah”. Istilah ini dapat menunjuk kepada tanggungan akibat pelanggaran maupun kepada persembahan yang mengadakan pemulihan.
    reason: lexical_alternative
  - marker: b
    text: “Syikal tempat kudus” mengacu pada standar berat yang digunakan untuk penilaian dalam urusan kudus.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Dalam rumusan hukum, נֶפֶשׁ menunjuk kepada seorang individu, bukan hanya unsur batin manusia. ‘Seseorang’ alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal generik.
- source_word: תִמְעֹל מַעַל
  choice: berbuat tidak setia
  rationale: Gabungan verba dan nomina seakar ini menegaskan pelanggaran terhadap kewajiban atau kepercayaan, khususnya dalam perkara kudus.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: dan tanpa sengaja berdosa
  rationale: בִשְׁגָגָה menyatakan tindakan yang tidak disengaja atau dilakukan karena kekeliruan, bukan pemberontakan yang disengaja.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: dalam hal barang-barang kudus milik Yahweh
  rationale: Frasa ini menunjuk kepada perkara, benda, atau persembahan kudus yang menjadi milik Yahweh. ‘Dalam hal’ tidak mempersempit hubungan preposisional secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: persembahan ganti rugi atas kesalahannya / sebagai persembahan ganti rugi
  rationale: אָשָׁם dapat menunjuk sekaligus kepada kesalahan atau tanggungan yang timbul dan kepada persembahan yang memulihkannya. ‘Ganti rugi’ menonjolkan unsur pemulihan dalam konteks kerugian terhadap barang kudus, sementara catatan kaki mempertahankan alternatif tradisional.
- source_word: אַיִל תָּמִים
  choice: seekor domba jantan yang tidak bercacat
  rationale: Dalam konteks persembahan, תָּמִים berarti bebas dari cacat; אַיִל secara khusus berarti domba jantan dewasa.
- source_word: מִן הַצֹּאן
  choice: dari kawanan
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil; karena אַיִל sudah menentukan jenis hewannya, ‘dari kawanan’ cukup jelas.
- source_word: בְּעֶרְכְּךָ
  choice: menurut penilaianmu
  rationale: Terjemahan ini mempertahankan sapaan orang kedua tunggal dalam rumusan penetapan nilai.
- source_word: כֶּסֶף שְׁקָלִים
  choice: dalam syikal perak
  rationale: Frasa ini menyatakan nilai moneter dengan satuan berat syikal perak.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: berdasarkan syikal tempat kudus
  rationale: Ungkapan ini menunjuk kepada standar berat resmi yang dipakai untuk penilaian dalam urusan kudus.
theological_decisions:
- issue: Makna istilah persembahan אָשָׁם
  choice: persembahan ganti rugi
  alternative: kurban penebus salah; persembahan penebus kesalahan
  rationale: Konteksnya adalah pelanggaran tidak sengaja terhadap milik kudus dan penilaian dengan perak, sehingga dimensi penggantian atau pemulihan nyata. Namun istilah Ibrani juga mencakup kesalahan dan kurban yang menanganinya; alternatif itu dicatat agar ketegangan leksikal tidak dihapus.
- issue: Subjek tunggal generik dalam hukum
  choice: seseorang … ia harus membawa
  alternative: orang … mereka harus membawa
  rationale: Bentuk tunggal Ibrani dipertahankan dengan cara yang wajar dan tidak secara tidak perlu menentukan jenis kelamin pelaku.
- issue: Ruang lingkup מִקָּדְשֵׁי יְהוָה
  choice: dalam hal barang-barang kudus milik Yahweh
  alternative: terhadap barang-barang kudus milik Yahweh; dari barang-barang kudus milik Yahweh
  rationale: Preposisi dapat menggambarkan lingkungan atau objek pelanggaran. ‘Dalam hal’ mempertahankan keluasan itu tanpa menetapkan jenis penyalahgunaan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang khidmat tetapi mudah dipahami. ‘Barang-barang kudus’ dipakai agar cakupannya tidak dibatasi hanya pada satu jenis benda atau persembahan. Bentuk ‘kautetapkan’ dihindari dalam teks utama demi kelancaran, tetapi orang kedua tunggal tetap dipertahankan melalui ‘penilaianmu’.
