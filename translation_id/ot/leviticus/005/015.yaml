    rationale: “Kurban penebus salah” kurang lazim dibanding “persembahan salah” atau “persembahan penebus salah.” Catatan yang direvisi tetap menyatakan rentang makna אָשָׁם tanpa mengikatnya pada tafsiran tertentu.
