  to: “Jika seseorang berbuat tidak setia dan tanpa sengaja berdosa dalam hal barang-barang kudus milik Yahweh, ia harus membawa kepada Yahweh persembahan ganti ruginya[a], yaitu seekor domba jantan yang tidak bercacat dari kawanan, menurut penilaianmu dalam syikal perak berdasarkan standar syikal tempat kudus[b], sebagai persembahan ganti rugi.”
