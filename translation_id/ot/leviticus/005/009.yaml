  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: id
  text: Lalu imam harus memercikkan sebagian darah kurban penghapus dosa[a] pada sisi mazbah. Darah yang tersisa harus ditiriskan ke dasar mazbah. Itulah kurban penghapus dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban pemurnian”, di sini dan pada akhir ayat. Istilah Ibrani חַטָּאת dapat menyebut kurban karena dosa dengan penekanan pada fungsi pemurniannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: imam harus memercikkan
  rationale: Bentuk Hifil dari נזה dalam konteks kurban menunjuk pada tindakan ritual memercikkan darah. Subjek 'imam' disediakan oleh konteks ayat sebelumnya dan membuat bahasa Indonesia jelas.
- source_word: מִדַּם
  choice: sebagian darah
  rationale: 'Preposisi מִן dipahami secara partitif: hanya sebagian darah yang digunakan pada tahap ini.'
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam peraturan kurban, חַטָּאת menunjuk pada kurban yang berkaitan dengan dosa. Ungkapan ini alami, cukup dikenal, dan tetap mempertahankan kaitannya dengan dosa.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: pada sisi mazbah
  rationale: קִיר secara harfiah berarti 'dinding', tetapi untuk permukaan mazbah, 'sisi' lebih alami dalam bahasa Indonesia tanpa menghilangkan gambaran konkretnya.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: Darah yang tersisa
  rationale: Partisipel Nifal dari שׁאר menyatakan bagian darah yang masih tinggal; susunan ini langsung dan alami.
- source_word: יִמָּצֶה
  choice: harus dikeluarkan
  rationale: Nifal dari מצה menggambarkan darah yang tersisa dikeluarkan atau ditiriskan, bukan sekadar dituang bebas. 'Dikeluarkan' cukup luas untuk mempertahankan cara tindakan yang tidak sepenuhnya pasti.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: pada dasar mazbah
  rationale: יְסוֹד berarti dasar atau fondasi; 'dasar mazbah' merupakan padanan ritual yang ringkas dan tepat.
- source_word: חַטָּאת הוּא
  choice: Itulah kurban penghapus dosa
  rationale: Klausa ini mengidentifikasi kategori kurban tersebut. 'Itulah' wajar dalam bahasa Indonesia dan mempertahankan penegasan Ibrani.
theological_decisions:
- issue: Makna חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani dapat menonjolkan hubungan kurban dengan dosa maupun fungsi pemurniannya. Teks utama mempertahankan istilah yang dikenal luas, sedangkan nuansa pemurnian dicatat agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mazbah' dipertahankan sebagai istilah khusus bagi altar kurban; struktur kalimat dipecah agar prosedur ritual mudah dipahami.
