  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: id
  text: Ia harus membawa kepada imam seekor domba jantan yang tidak bercacat dari kawanan, menurut penilaianmu, sebagai kurban penebus salah.[a] Imam harus mengadakan pendamaian baginya atas kesalahannya yang dilakukannya tanpa sengaja dan tidak diketahuinya,[b] dan ia akan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai kurban kesalahan”; istilah Ibrani אָשָׁם menamai suatu jenis kurban khusus. Istilah ini juga dapat diterjemahkan “kurban pemulihan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “atas kesalahan tidak sengajanya.” Frasa Ibrani menekankan kesalahan yang dilakukan tanpa sengaja; klausa berikutnya menyatakan bahwa ia tidak mengetahuinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Ia harus membawa
  rationale: Bentuk ini berfungsi sebagai ketentuan hukum; “harus membawa” menyampaikan daya preskriptifnya dalam bahasa Indonesia modern.
- source_word: אַיִל תָּמִים
  choice: seekor domba jantan yang tidak bercacat
  rationale: אַיִל menunjuk domba jantan dewasa, sedangkan תָּמִים dalam konteks kurban berarti bebas dari cacat.
- source_word: מִן הַצֹּאן
  choice: dari kawanan
  rationale: צֹאן adalah ternak kecil, terutama domba dan kambing; karena אַיִל sudah menentukan jenis hewannya sebagai domba jantan, “kawanan” cukup alami dan tepat.
- source_word: בְּעֶרְכְּךָ
  choice: menurut penilaianmu
  rationale: Terjemahan ini mempertahankan sufiks orang kedua tunggal dan tidak menentukan secara berlebihan siapa yang melakukan penilaian.
- source_word: לְאָשָׁם
  choice: sebagai persembahan penebus salah
  rationale: אָשָׁם adalah nama kategori kurban tertentu yang berkaitan dengan kesalahan dan pemulihan; pilihan ini membedakannya dari persembahan penghapus dosa.
- source_word: וְכִפֶּר עָלָיו
  choice: Imam harus mengadakan pendamaian baginya
  rationale: Ungkapan ini mempertahankan bobot kultis כפר dan menyatakan tindakan imam demi orang tersebut tanpa menjelaskan mekanismenya secara denominatif.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: atas kesalahan yang diperbuatnya tanpa sengaja
  rationale: Terjemahan ini mempertahankan hubungan antara nomina dan verba serumpun serta menonjolkan sifat tidak disengaja dari pelanggaran itu.
- source_word: וְהוּא לֹא יָדַע
  choice: ketika ia tidak mengetahuinya
  rationale: Klausa ini menyatakan ketidaktahuan pelaku sebagai bagian dari keadaan kesalahannya, tanpa menghapus kemungkinan nuansa “meskipun ia tidak tahu”.
- source_word: וְנִסְלַח לוֹ
  choice: maka ia akan diampuni
  rationale: Bentuk pasif mempertahankan pelaku pengampunan yang tidak disebutkan secara eksplisit dalam teks Ibrani.
theological_decisions:
- issue: Arti istilah kurban אָשָׁם
  choice: persembahan penebus salah
  alternative: persembahan kesalahan; persembahan pemulihan
  rationale: Istilah ini menamai kategori kurban khusus dalam Imamat. “Penebus salah” cukup dikenal dan membedakannya dari חטאת, sedangkan catatan kaki mengakui alternatif yang menonjolkan unsur pemulihan.
- issue: Terjemahan כפר
  choice: mengadakan pendamaian
  alternative: mengadakan penebusan; melakukan ritus pendamaian
  rationale: “Mengadakan pendamaian” mempertahankan istilah teologis-kultis tanpa menetapkan satu teori khusus tentang cara kerja kurban.
- issue: Hubungan ketidaktahuan dan kesalahan tidak sengaja
  choice: ketika ia tidak mengetahuinya
  alternative: meskipun ia tidak mengetahuinya
  rationale: Teks menyandingkan tindakan tidak sengaja dan ketidaktahuan. Pilihan utama membacanya secara temporal/keadaan, sementara catatan kaki mempertahankan kemungkinan nuansa konsesif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dijaga konsisten dan mudah dipahami. Kata ganti “ia” dipakai untuk register teks suci yang wajar; struktur kalimat dibuat alami tanpa menghilangkan pengulangan dan ketegangan makna dalam sumber Ibrani.
