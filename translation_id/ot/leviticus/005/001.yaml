language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: id
  text: Jika seseorang berbuat dosa, yakni ia mendengar seruan sumpah[a] dan ia adalah saksi—entah ia melihat atau mengetahui perkara itu—jika ia tidak memberikan keterangan, ia harus menanggung kesalahannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “suara sumpah.” Yang dimaksud dapat berupa seruan resmi dengan sumpah atau kutuk yang meminta orang yang mengetahui perkara itu untuk memberikan kesaksian.
    reason: lexical_alternative
  - marker: b
    text: Atau “memikul kesalahannya.” Ungkapan Ibrani ini berarti bahwa ia tetap bertanggung jawab atas kesalahan karena menahan keterangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Dalam rumusan hukum ini, נֶפֶשׁ menunjuk kepada seorang pribadi, bukan kepada 'jiwa' sebagai unsur metafisik. 'Seseorang' wajar dan inklusif dalam bahasa Indonesia modern.
- source_word: תֶחֱטָא
  choice: berbuat dosa
  rationale: Kata kerja חטא menyatakan pelanggaran yang menimbulkan kesalahan moral dan hukum; 'berbuat dosa' mempertahankan kedua nuansa itu.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: mendengar seruan sumpah
  rationale: Ungkapan harfiahnya adalah 'mendengar suara sumpah'. Dalam konteks hukum, אָלָה adalah sumpah atau kutuk resmi yang menyerukan orang yang mengetahui perkara untuk bersaksi. 'Seruan sumpah' tetap dekat dengan bentuk Ibrani tanpa membatasi konteks secara berlebihan.
- source_word: וְהוּא עֵד
  choice: sedangkan ia adalah saksi
  rationale: Frasa ini menyatakan bahwa orang tersebut memiliki kedudukan sebagai saksi atas perkara yang dimaksud.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: entah ia melihat atau mengetahui perkara itu
  rationale: Pasangan kata ini mencakup pengetahuan melalui penglihatan langsung maupun melalui cara lain. Objek 'perkara itu' ditambahkan secara tersirat agar alami dalam bahasa Indonesia.
- source_word: אִם לֹא יַגִּיד
  choice: tetapi tidak memberikan keterangan
  rationale: Bentuk Hifil נגד berarti memberitahukan atau menyatakan. Dalam konteks saksi, 'memberikan keterangan' menyampaikan fungsi hukumnya tanpa memastikan bahwa latarnya harus berupa persidangan formal.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: ia harus menanggung kesalahannya
  rationale: Ungkapan Ibrani menyatakan bahwa orang itu tetap memikul kesalahan serta tanggung jawab yang menyertainya; terjemahan ini mempertahankan idiom dan bobot hukum-teologisnya.
theological_decisions:
- issue: Cakupan ungkapan קוֹל אָלָה
  choice: seruan sumpah
  alternative: suara sumpah; sumpah kutuk; seruan resmi untuk bersaksi
  rationale: Terjemahan utama mempertahankan unsur 'suara/seruan' dan 'sumpah' sambil membiarkan terbuka apakah אָלָה terutama menekankan sumpah, kutuk bersyarat, atau adjurasi resmi. Catatan kaki menjelaskan fungsi hukumnya.
- issue: Makna menanggung kesalahan
  choice: menanggung kesalahannya
  alternative: menanggung hukumannya; memikul kedurhakaannya
  rationale: Teks Ibrani tidak secara sempit menyamakan עָוֹן dengan hukuman saja. Terjemahan ini menjaga ketegangan antara kesalahan dan akibat atau pertanggungjawaban yang timbul darinya.
- issue: Representasi gender dalam rumusan hukum
  choice: menggunakan 'seseorang' dan pronomina 'ia'
  alternative: menggunakan 'seorang laki-laki' atau bentuk maskulin eksplisit
  rationale: נֶפֶשׁ berarti seorang pribadi dalam kasus hukum ini. Pronomina Indonesia 'ia' tidak menambahkan gender yang tidak dinyatakan secara leksikal oleh nomina tersebut.
translation_notes:
  register: Bahasa hukum yang modern, lugas, dan bermartabat. Struktur kalimat dibuat alami dalam bahasa Indonesia, dengan tanda pisah untuk mengapit syarat mengenai dasar pengetahuan saksi. Semua penanda catatan kaki dicantumkan dalam teks utama.
