  source_fidelity: Draf dengan tepat menerjemahkan נֶפֶשׁ sebagai “seseorang,” mempertahankan cakupan “melihat atau mengetahui,” dan menyampaikan konsekuensi וְנָשָׂא עֲוֺנוֹ dengan baik. Namun, “berbuat dosa karena mendengar” secara normal menyatakan bahwa tindakan mendengar itu sendiri adalah penyebab dosa. Dalam konstruksi hukum Ibrani ini, kesalahan terkait dengan kegagalan menyatakan keterangan setelah mendengar seruan sumpah dan memiliki pengetahuan sebagai saksi. “Yakni” lebih jelas menghubungkan unsur-unsur kasus tanpa menambahkan prosedur hukum tertentu.
  naturalness: Bahasa draf umumnya modern dan jelas. Mengganti “sedangkan” dengan “dan” menghindari kesan pertentangan yang tidak ada dalam teks. Struktur “yakni … jika ia tidak memberikan keterangan” juga lebih wajar dan logis dalam bahasa hukum Indonesia.
  terminology: “Seruan sumpah” dapat dipertahankan sebagai padanan yang cukup dekat untuk קוֹל אָלָה, dengan catatan kaki yang menjelaskan kemungkinan unsur kutuk/adjurasinya. “Memberikan keterangan” dan “menanggung kesalahannya” sesuai dengan register hukum serta bobot istilah Ibrani.
