  to: Jika seseorang berbuat dosa, yakni ia mendengar seruan sumpah[a] dan ia adalah saksi—entah ia melihat atau mengetahui perkara itu—jika ia tidak memberikan keterangan, ia harus menanggung kesalahannya.[b]
