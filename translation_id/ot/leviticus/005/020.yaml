  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam formula pengantar perkataan ilahi, verba דבר paling alami dan bermartabat diterjemahkan “berfirman” dalam bahasa Indonesia; waw naratif membuka unit perkataan baru.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju oleh firman, dan nama מֹשֶׁה memakai bentuk baku bahasa Indonesia “Musa”.
- source_word: לֵאמֹר
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Infinitif ini merupakan formula pengantar kutipan. Dalam bahasa Indonesia modern, maknanya sudah tersampaikan secara alami oleh “berfirman ...” dan tanda baca yang mengantar perkataan pada ayat berikutnya; terjemahan harfiah “demikian” akan terasa kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi tersebut, sedangkan “TUHAN” adalah penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Berfirman” dipilih sebagai padanan idiomatis untuk perkataan Allah. Koma mempertahankan sifat ayat ini sebagai pengantar bagi perkataan yang berlanjut pada ayat berikutnya.
