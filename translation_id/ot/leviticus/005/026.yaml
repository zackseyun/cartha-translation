revisions:
- from: Imam harus mengadakan pendamaian baginya di hadapan Yahweh, maka ia akan diampuni sehubungan dengan salah satu dari segala perbuatan yang membuatnya bersalah.[a]
  to: Imam itu akan mengadakan pendamaian baginya di hadapan Yahweh, dan ia akan diampuni sehubungan dengan salah satu dari segala hal yang dilakukannya sehingga ia menjadi bersalah.[a]
  rationale: Revisi mengganti modal deontik "harus" dengan futurum prosedural "akan," memperhalus penghubung, dan menjelaskan klausa kesalahan secara lebih setia serta alami. Ambiguitas pelaku pengampunan tetap dipertahankan dalam bentuk pasif.
