base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: id
  text: Imam itu akan mengadakan pendamaian baginya di hadapan Yahweh, dan ia akan diampuni sehubungan dengan salah satu dari segala hal yang dilakukannya sehingga ia menjadi bersalah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “atas salah satu dari segala hal yang dilakukannya sehingga ia menjadi bersalah karenanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: Imam harus mengadakan pendamaian baginya
  rationale: Bentuk piel כפר dalam konteks kurban menyatakan tindakan mengadakan pendamaian bagi seseorang; susunan ini alami dalam bahasa Indonesia dan mempertahankan makna ritualnya.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan keberadaan atau tindakan di hadapan-Nya dalam konteks tempat kudus, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: וְנִסְלַח לוֹ
  choice: maka ia akan diampuni
  rationale: Bentuk nifal menyatakan hasil pasif, yakni orang itu menerima pengampunan; pelaku ilahi tetap tersirat sebagaimana dalam bahasa Ibrani.
- source_word: עַל אַחַת מִכֹּל
  choice: sehubungan dengan salah satu dari segala
  rationale: Ungkapan ini menunjuk satu kasus mana pun dalam keseluruhan kelompok pelanggaran, tanpa menghapus daya distributifnya.
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: perbuatan yang membuatnya bersalah
  rationale: Terjemahan ini menyampaikan hubungan antara tindakan dan timbulnya kesalahan secara wajar; בָהּ merujuk pada masing-masing perbuatan yang dimaksud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; bentuk Yahweh mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Pelaku pengampunan dalam וְנִסְלַח לוֹ
  choice: tetap tersirat dalam bentuk pasif
  alternative: Yahweh akan mengampuninya
  rationale: Teks Ibrani tidak menyebut pelaku secara eksplisit. Bentuk pasif mempertahankan implikasi ilahi sekaligus menghindari penambahan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Istilah kultis “mengadakan pendamaian” dipertahankan karena jelas dan tidak mengunci teks pada teori pendamaian tertentu.
