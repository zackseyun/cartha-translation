  naturalness: Revisi menghasilkan bahasa Indonesia baku dan alami. "Mengadakan pendamaian" dipertahankan sebagai istilah ritual yang lazim, sedangkan susunan tentang domba jantan dibuat lebih langsung.
  terminology: '"Persembahan penebus salah" konsisten untuk אָשָׁם dan catatan alternatif "persembahan ganti rugi" menjaga nuansa pemulihan. "Sesuatu yang kudus" tidak membatasi referen menjadi tempat kudus atau secara pasti barang yang dicuri.'
