  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: id
  text: Ia harus mengganti kerugian yang ditimbulkannya terhadap sesuatu yang kudus[a], lalu menambahkan seperlima dari nilainya dan menyerahkannya kepada imam. Imam itu harus mengadakan pendamaian baginya dengan domba jantan untuk persembahan penebus salah[b], maka ia akan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang secara tidak semestinya ditahannya dari sesuatu yang kudus.” Bahasa Ibrani merujuk pada penggantian atas pelanggaran yang menyangkut milik atau iuran kudus.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dengan domba jantan sebagai persembahan penebus salah”; istilah Ibrani juga dapat dipahami sebagai “persembahan ganti rugi.”
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: apa yang telah diambilnya dari sesuatu yang kudus karena dosanya
  rationale: Konstruksi Ibrani menunjuk pada pelanggaran yang menimbulkan kewajiban mengganti milik atau iuran kudus. Terjemahan ini menyampaikan makna dalam bahasa Indonesia yang alami tanpa mempersempit הַקֹּדֶשׁ menjadi 'tempat kudus'.
- source_word: יְשַׁלֵּם
  choice: harus mengganti
  rationale: Dalam konteks hukum-kurban, bentuk Piel ini berarti mengembalikan atau membayar ganti atas kerugian, bukan sekadar membayar secara umum.
- source_word: חֲמִישִׁתוֹ
  choice: seperlimanya
  rationale: Secara harfiah berarti bagian kelimanya; bentuk ini ringkas, tepat, dan alami dalam bahasa Indonesia.
- source_word: יוֹסֵף עָלָיו
  choice: menambahkan ...
  rationale: Ungkapan ini menyatakan tambahan denda di atas nilai pokok yang harus diganti.
- source_word: לַכֹּהֵן
  choice: kepada imam
  rationale: Padanan langsung dan baku bagi penerima pembayaran ganti tersebut.
- source_word: יְכַפֵּר עָלָיו
  choice: mengadakan pendamaian baginya
  rationale: Padanan yang lazim dan mudah dipahami untuk tindakan ritual כפר dalam konteks kurban.
- source_word: בְּאֵיל הָאָשָׁם
  choice: dengan domba jantan sebagai persembahan penebus salah
  rationale: Menjaga domba jantan sebagai sarana kurban dan menerjemahkan אָשָׁם dengan istilah yang menampung unsur kesalahan sekaligus pemulihan kerugian.
- source_word: וְנִסְלַח לוֹ
  choice: maka ia akan diampuni
  rationale: Bentuk pasif Ibrani secara alami menyatakan bahwa pengampunan diberikan kepada pelanggar; pelaku ilahinya tetap tersirat seperti dalam teks sumber.
theological_decisions:
- issue: Makna istilah kurban אָשָׁם
  choice: persembahan penebus salah
  alternative: persembahan penghapus salah; persembahan ganti rugi
  rationale: Istilah ini berkaitan dengan kesalahan sekaligus kewajiban pemulihan. 'Persembahan penebus salah' cukup dikenal dalam bahasa Alkitab Indonesia dan tidak menghapus unsur ganti rugi yang telah dinyatakan pada awal ayat.
- issue: Pelaku pengampunan dalam וְנִסְלַח לוֹ
  choice: tetap tersirat dalam bentuk pasif 'ia akan diampuni'
  alternative: Allah akan mengampuninya
  rationale: Teks Ibrani tidak menyebut pelaku secara eksplisit. Bentuk pasif mempertahankan ungkapan teologis sumber tanpa menambahkan subjek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum dipertahankan dengan 'harus', sedangkan ungkapan yang terlalu harfiah dibuat alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
