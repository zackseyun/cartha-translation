source:
  edition: WLC
  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: id
  text: Burung yang kedua harus dipersembahkannya sebagai kurban bakaran sesuai dengan ketentuan[a]; imam itu harus mengadakan pendamaian baginya atas dosa yang telah diperbuatnya, dan ia akan diampuni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan tata cara yang ditetapkan.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk pasif yang tidak menyebutkan secara langsung siapa yang mengampuni.
    reason: source_form
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: burung yang kedua
  rationale: Kata sifat ordinal ini menunjuk kepada burung kedua dalam konteks ayat sebelumnya; penambahan 'burung' menjadikan acuannya jelas dalam bahasa Indonesia.
- source_word: יַעֲשֶׂה עֹלָה
  choice: harus dipersembahkannya sebagai kurban bakaran
  rationale: Secara harfiah עשה berarti 'membuat/melakukan', tetapi dalam tata cara kurban konstruksi ini secara alami menyatakan bahwa burung tersebut dijadikan atau dipersembahkan sebagai kurban bakaran.
- source_word: כַּמִּשְׁפָּט
  choice: sesuai dengan ketentuan
  rationale: מִשְׁפָּט di sini mengacu pada aturan atau tata cara ritual yang telah ditetapkan; 'ketentuan' mempertahankan nuansa normatif sekaligus mudah dipahami.
- source_word: וְכִפֶּר עָלָיו
  choice: harus mengadakan pendamaian baginya
  rationale: Ungkapan ini mempertahankan istilah ritual-imamat כפר tanpa mempersempitnya menjadi sekadar penyucian atau langsung menyamakannya dengan pengampunan.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: atas dosa yang telah diperbuatnya
  rationale: Terjemahan ini menyampaikan dosa yang menjadi alasan tindakan pendamaian dengan ungkapan Indonesia yang alami.
- source_word: וְנִסְלַח לוֹ
  choice: maka ia akan diampuni
  rationale: Bentuk pasif dipertahankan sehingga pelaku ilahi tetap tersirat sebagaimana dalam bahasa Ibrani.
theological_decisions:
- issue: Bahasa pendamaian imamat tanpa memasukkan rumusan doktrinal yang lebih kemudian
  choice: mengadakan pendamaian baginya
  alternative: menyucikannya; memperoleh pengampunan baginya
  rationale: Pilihan ini mempertahankan kategori ritual-teologis כפר dan hubungannya dengan pengampunan tanpa menentukan satu teori pendamaian tertentu.
- issue: Rumus pasif untuk pengampunan
  choice: ia akan diampuni
  alternative: TUHAN akan mengampuninya; dosanya akan diampuni
  rationale: Bahasa Ibrani tidak menyebut pelaku pengampunan secara eksplisit. Bentuk pasif Indonesia mempertahankan ketersembunyian pelaku ilahi tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. 'Kurban bakaran' dipakai sebagai istilah ritual yang lazim; struktur kalimat dipecah menjadi dua agar mudah dibaca tanpa menghilangkan hubungan tindakan pendamaian dan pengampunan.
