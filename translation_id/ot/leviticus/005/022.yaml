  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: id
  text: atau menemukan barang yang hilang, lalu berbohong tentang hal itu dan bersumpah palsu—tentang salah satu dari segala perbuatan yang dilakukan seseorang sehingga ia berdosa karenanya—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: barang yang hilang
  rationale: Menunjuk pada harta atau benda temuan yang sebelumnya hilang; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks hukum.
- source_word: וְכִחֶשׁ בָּהּ
  choice: lalu menyangkal bahwa barang itu ada padanya
  rationale: Kata kerja כחש menyatakan penyangkalan atau kebohongan, sedangkan בָּהּ merujuk kembali pada barang temuan. Perumusan eksplisit ini menghindari ketaksaan pronomina dalam bahasa Indonesia.
- source_word: וְנִשְׁבַּע עַל־שָׁקֶר
  choice: dan bersumpah palsu
  rationale: Padanan hukum-keagamaan yang ringkas dan wajar untuk tindakan mengucapkan sumpah berdasarkan kepalsuan.
- source_word: הָאָדָם
  choice: seseorang
  rationale: Dalam konstruksi ini אָדָם dipakai secara generik bagi manusia, bukan secara khusus untuk laki-laki.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: dan dengan itu ia berdosa
  rationale: Mempertahankan hubungan instrumental atau situasional dari preposisi ב tanpa memaksakan penafsiran yang lebih khusus.
theological_decisions:
- issue: Cakupan manusia dalam הָאָדָם
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Konteks dan pemakaian generik kata אָדָם mendukung rujukan kepada siapa pun yang melakukan pelanggaran tersebut.
- issue: Hubungan tindakan dengan dosa dalam לַחֲטֹא בָהֵנָּה
  choice: dan dengan itu ia berdosa
  alternative: sehingga ia berdosa dalam perkara-perkara itu
  rationale: Pilihan ini mempertahankan bahwa tindakan-tindakan tersebut menjadi sarana atau ranah dosa tanpa menentukan secara berlebihan nuansa sintaksisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk kalimat dipertahankan sebagai lanjutan daftar hukum dari ayat sebelumnya, termasuk tanda pisah penutup yang menunjukkan bahwa kalimat berlanjut.
