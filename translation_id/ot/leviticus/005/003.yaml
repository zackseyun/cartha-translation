source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: id
  text: Atau jika seseorang menyentuh kenajisan manusia[a]—kenajisan apa pun yang membuat seseorang menjadi najis—dan hal itu tersembunyi darinya,[b] lalu ia mengetahuinya, ia bersalah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketidakmurnian manusia.” Dalam konteks hukum ini, istilah Ibrani tersebut menunjuk pada kenajisan ritual.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan hal itu tersembunyi darinya”; maksudnya, pada waktu itu ia tidak menyadarinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: menyentuh
  rationale: Kata נגע dengan preposisi ב menyatakan kontak fisik; “menyentuh” merupakan padanan langsung dan alami dalam bahasa Indonesia.
- source_word: טֻמְאַת אָדָם
  choice: kenajisan manusia
  rationale: Dalam konteks hukum Imamat, טֻמְאָה menunjuk pada kenajisan ritual, sedangkan אָדָם bersifat generik dan menunjuk kepada manusia, bukan khusus laki-laki.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: kenajisan apa pun
  rationale: Frasa ini memperluas cakupan kepada segala bentuk kenajisan terkait; akhiran pronominal tidak diterjemahkan secara kaku agar ungkapannya wajar tanpa mengurangi cakupannya.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: yang membuat seseorang menjadi najis
  rationale: Klausa relatif ini menjelaskan akibat kenajisan tersebut. “Seseorang” mempertahankan daya generik ungkapan Ibrani.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: dan hal itu tersembunyi darinya
  rationale: 'Bentuk Nifal mempertahankan nuansa pasif: perkara tersebut berada di luar kesadarannya pada waktu itu.'
- source_word: וְהוּא יָדַע
  choice: lalu ia mengetahuinya
  rationale: Dalam urutan konteks, pengetahuan ini muncul sesudah ketidaksadaran sebelumnya; “lalu” menyatakan perkembangan tersebut secara alami.
- source_word: וְאָשֵׁם
  choice: ia bersalah
  rationale: Dalam konteks hukum-kurban, אשם menyatakan timbulnya kesalahan atau tanggung jawab hukum; “ia bersalah” ringkas dan mempertahankan daya yuridisnya.
theological_decisions:
- issue: Sifat טֻמְאָה dalam hukum Imamat
  choice: kenajisan
  alternative: ketidakmurnian; keberdosaan
  rationale: Ayat ini berbicara tentang kenajisan ritual akibat sentuhan, bukan dengan sendirinya kejahatan moral. “Kenajisan” mempertahankan kategori ritual-hukum tanpa memoralisasikannya.
- issue: Cakupan אָדָם
  choice: manusia
  alternative: laki-laki; umat manusia
  rationale: אָדָם digunakan secara generik di sini. “Manusia” akurat dari segi gender dan tetap dekat dengan bentuk frasa sumber.
- issue: Hubungan antara ketidaksadaran, pengetahuan, dan kesalahan
  choice: mempertahankan urutan bahwa perkara itu tersembunyi, kemudian diketahui, dan orang itu bersalah
  alternative: menjelaskan bahwa kesalahan baru timbul hanya saat ia mengetahuinya
  rationale: Teks menyandingkan ketidaksadaran, pengetahuan, dan kesalahan tanpa menguraikan secara eksplisit kapan tepatnya status bersalah mulai berlaku; terjemahan tidak menyelesaikan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “seseorang” dipakai untuk subjek hukum yang generik, lalu “ia” menjaga kelancaran. Tanda pisah mempertahankan fungsi penjelas klausa tengah.
