base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/014.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (יהוה), nama ilahi yang juga secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk Ibrani dan alternatif penerjemahan tradisional bagi nama ilahi.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר membuka peristiwa tutur baru. Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang menerima perkataan; “kepada Musa” adalah ungkapan Indonesia yang wajar.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dalam rumus pengantar ucapan ini, infinitif “dengan berkata” secara alami dinyatakan dalam bahasa Indonesia dengan tanda titik dua yang mengantar isi firman pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi YHWH. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi, sedangkan “TUHAN” adalah penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Rumus tutur Ibrani dialihkan secara alami; tanda titik dua mempertahankan fungsi לֵאמֹר sebagai pengantar langsung kepada perkataan pada ayat berikutnya.
