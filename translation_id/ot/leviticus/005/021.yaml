  variant: modern standard Indonesian
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: id
  text: Jika seseorang berbuat dosa dan berlaku tidak setia terhadap Yahweh dengan berdusta kepada sesamanya dalam hal barang titipan, barang jaminan[a], atau dengan merampas, ataupun dengan menindas sesamanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah berarti sesuatu yang diserahkan ke tangan seseorang; mungkin yang dimaksud ialah barang jaminan atau barang lain yang dipercayakan kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Dalam rumusan hukum, kata ini menunjuk kepada seorang individu, bukan kepada ‘jiwa’ sebagai bagian batin manusia.
- source_word: כִּי תֶחֱטָא
  choice: jika ... berbuat dosa
  rationale: כִּי dengan bentuk verba ini membuka kasus bersyarat; ‘jika’ sesuai dengan gaya hukum kasuistik dalam bahasa Indonesia.
- source_word: וּמָעֲלָה מַעַל
  choice: dan berlaku tidak setia
  rationale: Konstruksi serumpun ini menyatakan tindakan pengkhianatan atau ketidaksetiaan. Ungkapan Indonesia ini mempertahankan dimensi relasional dan perjanjian tanpa memakai istilah teknis yang kurang alami.
- source_word: בַּיהוָה
  choice: terhadap Yahweh
  rationale: Preposisi menandai pihak yang menjadi sasaran ketidaksetiaan. Nama ilahi dipertahankan sebagai ‘Yahweh’.
- source_word: וְכִחֵשׁ
  choice: dengan berbohong
  rationale: Verba ini dapat berarti menyangkal, berdusta, atau berlaku curang. Dalam konteks sengketa harta, ‘berbohong ... mengenai’ alami dan cukup luas untuk mencakup penyangkalan palsu.
- source_word: בַּעֲמִיתוֹ
  choice: kepada sesamanya
  rationale: עָמִית menunjuk kepada sesama anggota masyarakat. ‘Sesamanya’ jelas, wajar, dan mempertahankan hubungan sosial yang dimaksud.
- source_word: בְּפִקָּדוֹן
  choice: mengenai barang titipan
  rationale: Nomina ini menunjuk kepada harta yang dipercayakan kepada seseorang untuk disimpan; ‘barang titipan’ merupakan padanan hukum sehari-hari yang tepat.
- source_word: בִתְשׂוּמֶת יָד
  choice: barang jaminan[a]
  rationale: Secara harfiah ungkapan ini berkaitan dengan sesuatu yang ‘ditaruh/diserahkan ke tangan’ seseorang. ‘Barang jaminan’ menyampaikan salah satu arti transaksional yang paling mungkin, sementara ketidakpastiannya dicatat dalam catatan kaki.
- source_word: בְגָזֵל
  choice: barang yang diperolehnya melalui perampasan
  rationale: Nomina ini dapat menunjuk kepada perampasan maupun barang rampasan. Rumusan ini menyatakan cara memperoleh barang tersebut dan cocok dengan rangkaian perkara harta.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: memeras sesamanya
  rationale: Verba ini mencakup tindakan menindas secara ekonomi, mengambil keuntungan secara tidak adil, atau memeras. Dalam daftar pelanggaran harta, ‘memeras’ memberi makna konkret tanpa membatasi semua kemungkinan secara berlebihan.
theological_decisions:
- issue: Kesalahan sosial dan ekonomi sekaligus merupakan ketidaksetiaan kepada Allah
  choice: berlaku tidak setia terhadap Yahweh
  alternative: berlaku tidak setia dalam perkara yang menyangkut Yahweh
  rationale: Teks Ibrani secara langsung menempatkan penipuan terhadap sesama sebagai ketidaksetiaan terhadap Yahweh. Terjemahan mempertahankan dimensi vertikal ini tanpa menambahkan penjelasan doktrinal.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri ilahi ditransliterasikan agar pembedaan antara יהוה dan gelar-gelar ilahi tetap tampak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang tetap mudah dipahami. Kalimat dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat bersyarat yang berlanjut ke ayat berikutnya. Penanda catatan kaki [a] dicantumkan tepat setelah frasa yang ambigu.
