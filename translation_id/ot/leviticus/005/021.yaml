  verdict: revise
  source_fidelity: Terjemahan pada umumnya mengikuti struktur hukum bersyarat dan mempertahankan bahwa pelanggaran terhadap sesama merupakan ketidaksetiaan terhadap Yahweh. Namun, “barang yang diperolehnya melalui perampasan” menambahkan gagasan memperoleh barang dan mengubah kategori “perampasan” menjadi barang tertentu; Ibrani בְגָזֵל lebih baik dibiarkan sebagai tindakan/perkara perampasan. “Memeras” juga terlalu khusus untuk עָשַׁק, yang mencakup penindasan atau pemerasan ekonomi secara lebih luas.
  naturalness: Bahasa Indonesia baku dan alurnya jelas. “Berdusta kepada sesamanya dalam hal” lebih sesuai dengan ragam hukum daripada “berbohong kepada sesamanya mengenai,” dan “menindas sesamanya” mempertahankan keluasan makna tanpa terasa tidak alami.
  terminology: “Yahweh,” “barang titipan,” dan “barang jaminan” dapat dipertahankan. Catatan kaki dengan tepat menandai ketidakpastian pada תְשׂוּמֶת יָד. Istilah “menindas” dipilih untuk עָשַׁק karena tidak membatasi makna hanya pada pemerasan.
  issues:
  - severity: medium
    issue: “barang yang diperolehnya melalui perampasan” untuk בְגָזֵל
    rationale: Frasa ini menyisipkan unsur “yang diperolehnya” dan menjadikan perampasan terutama sebagai asal-usul suatu barang. Dalam daftar Ibrani, istilah itu menunjuk pada perampasan/perkara perampasan. “Merampas” menyampaikan pelanggaran itu secara langsung tanpa tambahan yang tidak dinyatakan.
  - severity: medium
    issue: “memeras sesamanya” untuk עָשַׁק
    rationale: Pemerasan merupakan salah satu kemungkinan, tetapi verba ini juga mencakup menindas, mengeksploitasi, atau merugikan secara tidak adil. “Menindas sesamanya” mempertahankan cakupan yang lebih luas.
  revised_text: Jika seseorang berbuat dosa dan berlaku tidak setia terhadap Yahweh dengan berdusta kepada sesamanya dalam hal barang titipan, barang jaminan[a], atau dengan merampas, ataupun dengan menindas sesamanya,
  revised_footnotes:
