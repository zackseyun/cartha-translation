id: LEV.5.11
reference: Leviticus 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: id
  text: Namun, jika kemampuannya tidak cukup untuk dua ekor burung tekukur atau dua ekor anak burung merpati[a], ia harus membawa sebagai persembahannya atas dosa yang telah diperbuatnya sepersepuluh efa tepung halus sebagai kurban dosa. Ia tidak boleh membubuhkan minyak di atasnya ataupun menaruh kemenyan di atasnya, karena itu adalah kurban dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika tangannya tidak mencapai”—ungkapan Ibrani yang berarti bahwa ia tidak memiliki kemampuan ekonomi yang cukup.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: ia tidak mampu menyediakan
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘tangannya tidak mencapai’ dan menunjukkan ketidakmampuan secara ekonomi. Pilihan ini alami dalam bahasa Indonesia serta tetap terkait langsung dengan hewan yang harus disediakan.
- source_word: תֹרִים
  choice: burung tekukur
  rationale: Istilah ini menunjuk pada jenis burung tekukur yang digunakan dalam persembahan, bukan burung merpati secara umum.
- source_word: בְנֵי יוֹנָה
  choice: anak burung merpati
  rationale: Secara harfiah ‘anak-anak merpati’; frasa ini merupakan sebutan bagi merpati muda.
- source_word: קָרְבָּנוֹ
  choice: persembahan
  rationale: Kata ini secara luas berarti sesuatu yang dibawa mendekat sebagai persembahan dan cocok karena penggantinya dalam ayat ini berupa tepung.
- source_word: אֲשֶׁר חָטָא
  choice: atas dosa yang telah diperbuatnya
  rationale: Menunjukkan hubungan persembahan dengan pelanggaran orang tersebut dalam susunan Indonesia yang jelas dan wajar.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: sepersepuluh efa
  rationale: Mempertahankan satuan takaran kering kuno tanpa memberikan perkiraan modern yang berpotensi menyesatkan.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Menunjuk pada tepung halus bermutu yang dipakai untuk persembahan; ‘tepung terbaik’ merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam konteks aturan kurban, חַטָּאת menunjuk pada jenis persembahan yang berkaitan dengan penghapusan dosa.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: Ia tidak boleh menuangkan minyak ke atasnya
  rationale: Menyampaikan larangan ritual dengan jelas; verba ‘menuangkan’ sesuai dengan tindakan memakai minyak pada tepung.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: ataupun menaruh kemenyan di atasnya
  rationale: לְבֹנָה adalah resin aromatik kemenyan yang lazim digunakan dalam persembahan.
- source_word: כִּי חַטָּאת הִיא
  choice: karena itu adalah kurban penghapus dosa
  rationale: Klausa ini menyatakan alasan minyak dan kemenyan tidak ditambahkan, yakni status ritual persembahan tersebut.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban karena dosa; kurban dosa
  rationale: Konteks dan kata ganti feminin pada הִיא mengacu pada bahan persembahan sebagai kategori ritual, bukan semata-mata pada perbuatan dosa. Pilihan ini mempertahankan fungsi kultis istilah tanpa memasukkan kerangka doktrinal yang lebih kemudian.
- issue: Penyampaian ungkapan kemiskinan dalam ketentuan hukum
  choice: jika ia tidak mampu menyediakan
  alternative: jika tangannya tidak mencapai; jika ia tidak sanggup membeli
  rationale: Pilihan ini menyampaikan syarat ekonomi dengan jelas tanpa membatasi ketidakmampuan itu secara eksplisit pada tindakan membeli, yang tidak disebutkan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘ia harus’ dan ‘tidak boleh’ mempertahankan daya hukum ketentuan. Istilah kuno ‘efa’ dipertahankan, sedangkan idiom ekonomi diterjemahkan secara komunikatif; arti harfiahnya dicatat dalam catatan kaki.
