  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: id
  text: Demikianlah imam akan mengadakan pendamaian baginya karena dosanya yang telah diperbuatnya dalam salah satu perkara ini, dan orang itu akan diampuni. Kurban penghapus dosa itu menjadi milik imam, seperti persembahan sajian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: harus mengadakan pendamaian baginya
  rationale: Dalam peraturan kurban Imamat, כפר dengan עַל menyatakan tindakan ritual imam untuk mengadakan pendamaian bagi pelanggar. Ungkapan ini lazim, jelas, dan tidak memasukkan teori pendamaian yang lebih sempit.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan alami bagi כֹּהֵן dalam konteks peribadatan Israel.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: atas dosa yang telah dilakukannya
  rationale: Klausa אֲשֶׁר חָטָא menunjukkan bahwa חַטָּאתוֹ di sini merujuk pada dosa atau pelanggaran, bukan pada kurban penghapus dosa.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: dalam salah satu dari perkara-perkara itu
  rationale: Terjemahan ini mempertahankan makna partitif dan rujukannya kepada beberapa perkara yang disebut sebelumnya.
- source_word: וְנִסְלַח לוֹ
  choice: maka orang itu akan diampuni
  rationale: Bentuk pasif נִסְלַח dipertahankan tanpa menyebut secara eksplisit siapa yang mengampuni; 'orang itu' memperjelas penerima pengampunan dalam bahasa Indonesia.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: Persembahan itu menjadi bagian imam
  rationale: Subjek feminin tersirat merujuk pada persembahan yang dibicarakan dalam konteks sebelumnya; 'menjadi bagian imam' menyampaikan hak imam secara alami.
- source_word: כַּמִּנְחָה
  choice: sama seperti persembahan sajian
  rationale: Dalam hukum kurban Imamat, מִנְחָה menunjuk pada persembahan berbahan hasil tanaman; 'persembahan sajian' merupakan istilah Indonesia yang ringkas dan bermartabat.
theological_decisions:
- issue: Rumus pengampunan dalam tata kurban
  choice: maka orang itu akan diampuni
  alternative: maka dosanya akan diampuni baginya
  rationale: Teks Ibrani memakai bentuk pasif dan tidak menyebut pihak yang mengampuni. Pilihan utama mempertahankan kepasifan dan ketaktersebutan pelaku sambil menghasilkan bahasa Indonesia yang alami.
- issue: Makna חַטָּאתוֹ dalam klausa ini
  choice: dosa
  alternative: kurban penghapus dosa
  rationale: Klausa relatif 'yang telah dilakukannya' paling wajar menerangkan dosa yang dilakukan, bukan persembahan yang dibawa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mudah dipahami tanpa menghapus nuansa ritual. Istilah 'pendamaian' dan 'persembahan sajian' dipakai secara konsisten dengan register hukum peribadatan.
