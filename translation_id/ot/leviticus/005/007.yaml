  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: id
  text: 'Namun, jika ia tidak mampu menyediakan seekor domba, ia harus membawa kepada TUHAN, sebagai kurban penebus salah atas dosa yang telah dilakukannya, dua ekor burung tekukur atau dua ekor anak merpati: yang satu sebagai kurban dosa[a] dan yang lain sebagai kurban bakaran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian.” Kata Ibrani חַטָּאת dapat berarti “dosa” atau kurban yang berkaitan dengan penghapusan dosa atau kenajisan dalam konteks persembahan.
    reason: Alternatif leksikal ini mempertahankan kemungkinan bahwa nama kurban tersebut terutama menyoroti fungsi pemurniannya.
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: ia tidak mampu menyediakan seekor domba
  rationale: Ungkapan Ibrani yang secara harfiah menyebut tangannya tidak mencapai kecukupan menyatakan keterbatasan kemampuan ekonomi. Pilihan ini menyampaikan idiom tersebut secara alami tanpa mempersempitnya hanya pada uang tunai.
- source_word: אֲשָׁמוֹ
  choice: persembahan penebus salah
  rationale: Dalam konteks persembahan, אָשָׁם menunjuk pada persembahan yang berkaitan dengan kesalahan dan pemulihan akibatnya. Frasa ini mempertahankan unsur kesalahan sekaligus fungsi kultisnya.
- source_word: אֲשֶׁר חָטָא
  choice: atas dosa yang telah dilakukannya
  rationale: Klausa ini menghubungkan persembahan dengan dosa yang dilakukan orang tersebut; susunan ini alami dalam bahasa Indonesia dan tidak menambahkan jenis pelanggaran tertentu.
- source_word: שְׁתֵּי תֹרִים
  choice: dua ekor burung tekukur
  rationale: תֹר adalah burung tekukur yang lazim disebut dalam ketentuan persembahan; kata penggolong 'ekor' membuat ungkapan alami dalam bahasa Indonesia.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: dua ekor anak merpati
  rationale: Ungkapan harfiah 'anak-anak merpati' menunjukkan merpati muda. Terjemahan ini mempertahankan penanda usia dengan bahasa yang wajar.
- source_word: לַיהוָה
  choice: kepada TUHAN
  rationale: Nama ilahi יהוה diterjemahkan dengan bentuk kehormatan yang mapan dalam tradisi Alkitab bahasa Indonesia, tanpa mengubah peran gramatikal preposisi לְ.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam hukum persembahan, חַטָּאת menunjuk pada kurban yang berkaitan dengan dosa dan penyingkirannya. Pilihan tradisional ini jelas bagi pembaca umum, sementara nuansa pemurnian dicatat dalam catatan kaki.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah persembahan yang seluruhnya dibakar. 'Kurban bakaran' merupakan istilah Indonesia yang ringkas dan dikenal luas.
theological_decisions:
- issue: Makna istilah persembahan חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah ini dapat menekankan dosa yang ditangani oleh persembahan atau fungsi pemurniannya. Konteks hukum persembahan dan pasangannya dengan עֹלָה mendukung istilah tradisional dalam teks utama, sedangkan alternatifnya dipertahankan dalam catatan kaki agar ketegangan maknanya tidak dihapus.
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: Bentuk 'TUHAN' adalah padanan kehormatan yang mapan dan mudah dikenali dalam bahasa Indonesia. Bentuk sumber tetap diakui sebagai nama ilahi יהוה, bukan kata Ibrani biasa yang berarti 'Tuhan'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur hukum Ibrani, tetapi idiom kemampuan ekonomi dibuat alami. Istilah persembahan dijaga konsisten dan cukup jelas bagi pembaca umum.
