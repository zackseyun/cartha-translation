  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: id
  text: Itulah kurban penebus salah[a]; orang itu sungguh-sungguh telah bersalah terhadap TUHAN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Itulah kurban penebus salah; orang itu benar-benar bersalah terhadap TUHAN.” Bahasa Ibrani mengulang akar kata yang berarti “kesalahan/bersalah” untuk memberi penekanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: kurban penebus salah
  rationale: Dalam konteks kurban, nomina ini menunjuk pada kurban khusus yang diwajibkan karena kesalahan dan mencakup gagasan pemulihan; istilah ini juga mempertahankan kaitannya dengan keadaan 'bersalah' dalam klausa berikutnya.
- source_word: הוּא
  choice: Itulah
  rationale: Pronomina ini berfungsi secara predikatif untuk mengidentifikasi kurban yang baru dijelaskan; 'Itulah' wajar sebagai pernyataan penegasan dalam bahasa Indonesia.
- source_word: אָשֹׁם אָשַׁם
  choice: sungguh-sungguh telah bersalah
  rationale: Infinitif absolut yang diikuti verba dari akar yang sama memberi penekanan kuat. Pengulangan makna melalui 'sungguh-sungguh' menyampaikan intensifikasi itu secara alami.
- source_word: לַיהוָה
  choice: terhadap TUHAN
  rationale: Dengan verba אָשַׁם, preposisi ל menyatakan pertanggungjawaban atau kesalahan dalam hubungan dengan YHWH. 'Terhadap' menjaga cakupan tersebut tanpa mempersempitnya menjadi tindakan permusuhan langsung.
- source_word: יהוה
  choice: TUHAN
  rationale: Nama ilahi tetragramaton diterjemahkan menurut konvensi Indonesia yang mapan dengan huruf kapital, sambil tetap membedakannya dari gelar biasa.
theological_decisions:
- issue: Hubungan לַיהוָה dengan אָשֹׁם אָשַׁם
  choice: Frasa itu menerangkan bahwa orang tersebut benar-benar bersalah terhadap TUHAN.
  alternative: Frasa itu menerangkan bahwa kurban tersebut dipersembahkan kepada TUHAN.
  rationale: Susunan Ibrani paling langsung menghubungkan לַיהוָה dengan klausa verbal yang mendahuluinya. Terjemahan ini mempertahankan pertanggungjawaban orang itu kepada Allah tanpa menentukan secara berlebihan sifat tepat pelanggarannya.
- issue: Hubungan leksikal antara kurban dan kesalahan
  choice: Menggunakan 'kurban penebus salah' dan 'bersalah' untuk mempertahankan hubungan akar kata אשם.
  alternative: Menggunakan 'kurban pemulihan' sehingga hubungan leksikal dengan 'bersalah' menjadi kurang tampak.
  rationale: Teks Ibrani mengulang akar אשם sebagai nomina dan verba; mempertahankan gema ini penting bagi penekanan dan logika ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dan bermartabat. 'Kurban' dipakai sesuai ejaan baku; 'penebus salah' cukup transparan bagi pembaca umum dan tetap menandai jenis kurban tertentu. Penanda catatan kaki [a] ditempatkan tepat setelah istilah yang dijelaskan.
