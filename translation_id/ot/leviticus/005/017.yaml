id: LEV.5.17
reference: Leviticus 5:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: id
  text: Jika seseorang berbuat dosa dengan melakukan salah satu hal yang dilarang oleh perintah-perintah Yahweh, sekalipun ia tidak mengetahuinya, ia bersalah[a] dan harus menanggung kesalahannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi bersalah” atau “menjadi bertanggung jawab atas kesalahan itu.” Kata Ibrani ini dapat menyatakan timbulnya tanggung jawab karena pelanggaran itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “harus memikul tanggung jawab atas kesalahannya” atau “harus menanggung akibat kesalahannya.” Ungkapan Ibrani ini dapat menunjuk kepada memikul tanggung jawab atau akibat dari perbuatan salah.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Dalam konteks hukum ini, נֶפֶשׁ menunjuk kepada seorang individu, bukan secara khusus kepada jiwa sebagai unsur nonjasmani.
- source_word: תֶחֱטָא
  choice: berbuat dosa
  rationale: Kata kerja חטא dalam konteks hukum keimaman secara langsung menyatakan tindakan berdosa.
- source_word: וְעָשְׂתָה אַחַת מִכָּל
  choice: dengan melakukan salah satu dari segala hal
  rationale: 'Ungkapan ini mempertahankan makna distributif: satu tindakan dari antara seluruh tindakan yang dilarang. Kata ''dengan'' membuat hubungan dengan ''berbuat dosa'' alami dalam bahasa Indonesia.'
- source_word: מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: yang menurut perintah-perintah Yahweh tidak boleh dilakukan
  rationale: Bentuk pasif menyatakan tindakan yang dilarang oleh perintah Yahweh; 'tidak boleh dilakukan' menyampaikan daya hukum larangan itu dengan jelas.
- source_word: וְלֹא יָדַע
  choice: sekalipun ia tidak mengetahuinya
  rationale: Klausa ini menunjukkan bahwa orang tersebut tidak mengetahui atau menyadari pelanggarannya. 'Sekalipun' memperjelas pertentangan tanpa menghapus kemungkinan cakupan makna kata ידע.
- source_word: וְאָשֵׁם
  choice: ia bersalah
  rationale: אָשֵׁם menyatakan keadaan bersalah atau timbulnya tanggungan hukum akibat pelanggaran, termasuk ketika dilakukan tanpa diketahui.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: harus menanggung kesalahannya
  rationale: Ungkapan נשׂא עון secara harfiah dan idiomatis menggambarkan memikul kesalahan beserta tanggung jawab atau akibatnya. Pilihan ini mempertahankan bobot bahasa hukum-perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan ketidaktahuan dalam pelanggaran
  choice: sekalipun ia tidak mengetahuinya
  alternative: tanpa menyadarinya
  rationale: Teks menyatakan ketidaktahuan tetapi tetap menetapkan kesalahan. Terjemahan tidak menentukan secara lebih sempit apakah yang tidak diketahui adalah perintah, tindakan, atau sifat melanggar dari tindakan tersebut.
- issue: Makna tanggung jawab dalam וְנָשָׂא עֲוֺנוֹ
  choice: harus menanggung kesalahannya
  alternative: harus menanggung akibat kesalahannya
  rationale: Pilihan utama mempertahankan ungkapan yang mencakup kesalahan, tanggungan, dan kemungkinan akibatnya tanpa membatasi makna hanya pada hukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum ayat dipertahankan, sedangkan hubungan antarklausa dibuat alami. Pronomina 'ia' dipakai secara generik untuk individu yang disebut oleh נֶפֶשׁ.
