revisions:
- from: Lalu ia harus membawanya kepada imam. Imam itu harus mengambil segenggam penuh darinya sebagai bagian peringatannya, lalu membakarnya di atas mazbah, di atas kurban-kurban api bagi Yahweh.[a] Itulah kurban penghapus dosa.[b]
  to: Lalu ia harus membawanya kepada imam, dan imam harus mengambil dari persembahan itu segenggam penuh sebagai bagian peringatan, lalu membakarnya di atas mazbah, di atas persembahan-persembahan yang dibakar bagi Yahweh.[a] Itulah kurban penghapus dosa.[b]
  rationale: Revisi ini mempertahankan urutan tindakan, ukuran genggaman, fungsi bagian peringatan, nama Yahweh, dan ambiguitas yang relevan pada עַל serta חַטָּאת. Istilah teknis Ibrani untuk persembahan yang dibakar dibuat lebih jelas dalam bahasa Indonesia baku tanpa menambahkan penafsiran doktrinal.
