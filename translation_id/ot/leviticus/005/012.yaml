  source_fidelity: Revisi diperlukan untuk ungkapan עַל אִשֵּׁי יְהוָה. “Kurban-kurban api” tidak lazim dalam bahasa Indonesia modern dan kurang jelas menyampaikan istilah kultis itu. “Persembahan-persembahan yang dibakar bagi Yahweh” lebih langsung mencerminkan אִשֵּׁי יְהוָה, sementara “di atas” mempertahankan nilai dasar עַל tanpa menutup kemungkinan nuansa ‘sebagai tambahan pada’ dalam catatan kaki.
  naturalness: Struktur kalimat yang dipisahkan dapat dipahami, tetapi satu kalimat berurutan lebih alami untuk instruksi ritual ini. “Bagian peringatan dari persembahan itu” juga lebih jelas daripada “bagian peringatannya,” yang dapat terasa kurang tentu dalam bahasa Indonesia.
  terminology: “Imam,” “mazbah,” “Yahweh,” dan “kurban penghapus dosa” dapat dipertahankan. “Kurban penghapus dosa” merupakan padanan Indonesia yang wajar bagi חַטָּאת dalam klasifikasi ritual, dengan alternatif “kurban penyucian” dicatat. Istilah untuk אִשֵּׁי direvisi demi ketepatan dan keterbacaan.
