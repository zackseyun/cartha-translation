  - severity: low
    issue: “bagian peringatannya”
    rationale: Akhiran -nya berpotensi kurang jelas rujukannya. Menyebut “dari persembahan itu” membuat hubungan dengan bahan persembahan feminin dalam teks Ibrani menjadi terang.
