language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: id
  text: Lalu ia harus membawanya kepada imam, dan imam harus mengambil dari persembahan itu segenggam penuh sebagai bagian peringatan, lalu membakarnya di atas mazbah, di atas persembahan-persembahan yang dibakar bagi Yahweh.[a] Itulah kurban penghapus dosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai tambahan pada persembahan-persembahan yang dibakar bagi Yahweh.”
    reason: Kata Ibrani עַל secara harfiah berarti “di atas,” tetapi dalam konteks ritual dapat menyatakan hubungan sebagai tambahan pada persembahan yang dibakar.
  - marker: b
    text: Atau, “Itulah kurban penyucian.” Istilah Ibraninya dapat menyebut kurban yang menangani dosa melalui penyucian.
    reason: Mempertahankan alternatif leksikal dan teologis yang penting bagi חַטָּאת.
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Lalu ia harus membawanya
  rationale: Bentuk kausatif dengan akhiran feminin menunjuk kepada tepung persembahan dalam konteks sebelumnya; “lalu” menyampaikan urutan tindakan secara alami.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: harus mengambil segenggam penuh
  rationale: Ungkapan ini secara harfiah menyatakan isi penuh genggaman imam dan merupakan tindakan ritual teknis.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: sebagai bagian peringatannya
  rationale: Menunjuk kepada bagian perwakilan dari persembahan yang dibakar di mazbah; “bagian peringatan” mempertahankan nuansa istilah kultis Ibrani.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: lalu membakarnya di atas mazbah
  rationale: Dalam konteks kurban, verba ini berarti membakar bahan persembahan di mazbah hingga menjadi asap.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: di atas kurban-kurban api bagi Yahweh
  rationale: Terjemahan ini mempertahankan nilai spasial dasar עַל dan ungkapan teknis אִשֵּׁי, tanpa mengubahnya menjadi “kurban makanan” yang tidak dinyatakan secara eksplisit di sini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: חַטָּאת הִוא
  choice: Itulah kurban penghapus dosa
  rationale: Dalam formula penggolongan kurban, חַטָּאת menunjuk kepada jenis kurban yang menangani dosa; padanan ini lebih alami dalam bahasa Indonesia daripada “kurban dosa” dan tetap membiarkan fungsi penyuciannya dicatat sebagai alternatif.
theological_decisions:
- issue: Makna חַטָּאת dalam hukum kurban Imamat
  choice: kurban penghapus dosa
  alternative: kurban penyucian
  rationale: Istilah Ibrani dapat menyoroti kaitannya dengan dosa maupun fungsi ritual penyucian. Teks utama memakai istilah Indonesia yang mudah dipahami, sedangkan alternatif penting dipertahankan dalam catatan kaki.
- issue: Hubungan bagian peringatan dengan אִשֵּׁי יְהוָה
  choice: di atas kurban-kurban api bagi Yahweh
  alternative: bersama dengan kurban-kurban api bagi Yahweh
  rationale: עַל secara paling langsung berarti “di atas”; terjemahan utama tidak secara diam-diam menetapkan bahwa maksudnya semata-mata “sebagai tambahan pada”, meskipun nuansa kebersamaan ritual mungkin dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mazbah” dipertahankan sebagai istilah ritual Alkitab yang ringkas; struktur kalimat dipecah agar jelas bagi pembaca umum. Semua penanda catatan kaki ditempatkan pada klausa yang diterangkannya.
