id: LEV.5.6
reference: Leviticus 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: id
  text: 'Ia harus membawa kepada Yahweh persembahan penebus salahnya[a] karena dosa yang telah dilakukannya: seekor hewan betina dari kawanan ternak kecil, yaitu seekor domba betina atau kambing betina, sebagai persembahan penghapus dosa. Imam harus mengadakan pendamaian baginya atas dosanya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan karena kesalahannya” atau “persembahan pemulihan.” Istilah Ibrani אשם berkaitan dengan kesalahan dan pemulihan, sedangkan hewan itu kemudian disebut sebagai “persembahan penghapus dosa.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari dosanya.” Ungkapan ini dapat menekankan pelepasan dari dosa sebagai hasil pendamaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Ia harus membawa
  rationale: Bentuk verbal dalam konteks hukum menyatakan kewajiban; “harus” terdengar alami dan tegas dalam bahasa Indonesia modern.
- source_word: אֲשָׁמוֹ
  choice: persembahan kesalahannya
  rationale: אשם dapat menunjuk pada kesalahan maupun persembahan yang berkaitan dengan kesalahan. Pilihan ini mempertahankan kaitan leksikal itu tanpa menyamakan istilahnya dengan חטאת yang muncul kemudian.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai “Yahweh” sesuai bentuk nama diri dalam teks sumber.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: karena dosa yang telah dilakukannya
  rationale: עַל menyatakan dasar atau sebab persembahan, sedangkan konstruksi serumpun חטאת/חטא dialihkan secara idiomatis tanpa menghilangkan rujukan eksplisit kepada dosa.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: seekor betina dari kawanan kambing domba
  rationale: Menjaga penentuan jenis kelamin dan menjelaskan צאן sebagai kelompok ternak kecil yang mencakup domba dan kambing.
- source_word: כִּשְׂבָּה
  choice: seekor anak domba betina
  rationale: Istilah ini menunjuk pada domba betina; penyebutan “betina” dipertahankan secara eksplisit demi kejelasan.
- source_word: אוֹ שְׂעִירַת עִזִּים
  choice: atau kambing betina
  rationale: Menyampaikan secara langsung jenis hewan dan jenis kelaminnya dalam bahasa Indonesia modern.
- source_word: לְחַטָּאת
  choice: sebagai persembahan penghapus dosa
  rationale: Dalam konteks kurban, חטאת merupakan nama persembahan yang berkaitan dengan dosa dan pemurnian. Istilah ini membedakannya dari אשם sambil tetap mudah dipahami.
- source_word: וְכִפֶּר עָלָיו
  choice: lalu imam harus mengadakan pendamaian baginya
  rationale: כפר dalam konteks keimaman menyatakan tindakan ritual pendamaian; terjemahan ini mempertahankan makna kultis tanpa menetapkan teori pendamaian tertentu.
- source_word: מֵחַטָּאתוֹ
  choice: dari dosanya
  rationale: Terjemahan dekat terhadap מן mempertahankan kemungkinan nuansa pelepasan atau penghapusan dari dosa, meskipun hubungan ini dapat pula diungkapkan secara idiomatis sebagai “atas dosanya”.
theological_decisions:
- issue: Pemakaian אשם dan חטאת dalam ayat yang sama
  choice: Membedakan “persembahan kesalahan” dari “persembahan penghapus dosa”
  alternative: Menyelaraskan keduanya menjadi satu istilah persembahan dosa, atau menerjemahkan חטאת sebagai “persembahan pemurnian”
  rationale: Teks Ibrani sengaja memakai dua istilah berbeda. Pembedaan dipertahankan agar ketegangan leksikal dan logika ritual dalam sumber tidak disamarkan.
- issue: Makna מן dalam מֵחַטָּאתוֹ sesudah כפר
  choice: “dari dosanya” dalam teks utama
  alternative: “atas dosanya” atau “karena dosanya”
  rationale: “Dari dosanya” menjaga bentuk sumber dan kemungkinan nuansa bahwa pendamaian menghasilkan pelepasan dari dosa; catatan kaki memberi padanan Indonesia yang lebih idiomatis.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Nama diri dipertahankan melalui transliterasi yang lazim dan tidak diganti dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum dibuat jelas dengan “harus,” istilah ritual dipertahankan secara konsisten, dan penjelasan teknis yang diperlukan ditempatkan dalam catatan kaki.
