base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: id
  text: 'Ia harus membawa korban penebus salahnya[a] kepada Yahweh: seekor domba jantan tanpa cela dari kawanan, sesuai dengan penilaianmu, sebagai korban penebus salah, kepada imam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “korban penebus salah” dapat menunjuk pada kesalahan atau kewajiban ganti rugi, dan juga pada jenis korban yang dipersembahkan berkaitan dengannya. Istilah ini juga dapat diterjemahkan “korban ganti rugi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: persembahan penebus salahnya
  rationale: Dalam konteks hukum korban ini, אָשָׁם menunjuk pada persembahan yang berkaitan dengan kesalahan sekaligus pemulihan kerugian. Istilah yang sama dipertahankan pada kedua kemunculan agar hubungan leksikal dalam bahasa Ibrani tetap terlihat.
- source_word: יָבִיא
  choice: harus membawa
  rationale: Bentuk imperfek Hifil dalam ketentuan hukum menyatakan kewajiban; 'harus membawa' alami dan tegas dalam bahasa Indonesia modern.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Menerjemahkan nama perjanjian יהוה secara langsung sebagai 'Yahweh'.
- source_word: אַיִל תָּמִים
  choice: seekor domba jantan yang tidak bercela
  rationale: אַיִל adalah domba jantan, sedangkan תָּמִים dalam konteks korban menyatakan ketiadaan cacat yang membuat hewan tidak layak dipersembahkan.
- source_word: מִן הַצֹּאן
  choice: dari kawanan
  rationale: צֹאן adalah ternak kecil, terutama domba dan kambing; karena אַיִל sudah menentukan bahwa hewannya domba jantan, 'dari kawanan' cukup tepat dan alami.
- source_word: בְּעֶרְכְּךָ
  choice: sesuai dengan penilaianmu
  rationale: Mempertahankan gagasan taksiran serta akhiran orang kedua tunggal, yang dalam konteks ini ditujukan kepada pihak yang berwenang menilai.
- source_word: לְאָשָׁם
  choice: sebagai persembahan penebus salah
  rationale: Frasa ini menentukan fungsi dan kategori korban dari domba jantan tersebut.
- source_word: אֶל הַכֹּהֵן
  choice: kepada imam
  rationale: Menyatakan arah penyerahan hewan korban kepada imam yang melayani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama diri ilahi יהוה; bentuk 'Yahweh' mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Makna ganda אָשָׁם
  choice: persembahan penebus salah pada kedua kemunculan
  alternative: persembahan penghapus salah; persembahan ganti rugi; membedakan kemunculan pertama sebagai ganti rugi dan yang kedua sebagai kategori korban
  rationale: אָשָׁם mencakup kesalahan, pertanggungjawaban, dan pemulihan, serta menjadi nama kategori korban. 'Penebus salah' mempertahankan dimensi kesalahan dan pemulihan tanpa menyamakan korban ini dengan korban penghapus dosa; pengulangan istilah juga mencerminkan pengulangan akar Ibrani.
- issue: Identitas pihak dalam akhiran orang kedua בְּעֶרְכְּךָ
  choice: dipertahankan sebagai 'penilaianmu' tanpa menyebut identitasnya
  alternative: menurut penilaian imam; menurut nilai yang ditetapkan
  rationale: Bahasa Ibrani menyatakan orang kedua tunggal tetapi ayat ini sendiri tidak secara eksplisit menamai pemilik akhiran itu; terjemahan tidak menambahkan penafsiran yang menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti alur hukum Ibrani tetapi memakai 'yaitu' untuk memperjelas bahwa domba jantan tersebut merupakan persembahan yang dimaksud. Istilah korban dipilih agar dapat dimengerti pembaca umum sekaligus mempertahankan nuansa kesalahan dan pemulihan.
