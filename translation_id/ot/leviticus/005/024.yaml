base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: id
  text: atau apa pun yang tentangnya ia bersumpah palsu—ia harus mengembalikannya secara utuh dan menambahkan seperlima dari nilainya. Ia harus menyerahkannya kepada pemiliknya pada hari kurban penebus salahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada hari kesalahannya.” Istilah Ibrani dapat menunjuk pada kesalahan itu sendiri ataupun pada kurban penebus salah; teks utama mengikuti konteks kurban dalam bagian ini.
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּ֞ל אֲשֶׁר
  choice: atau apa pun yang mengenainya
  rationale: Melanjutkan daftar perkara dari ayat sebelumnya. Ungkapan ini mempertahankan cakupan luas frasa Ibrani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒
  choice: ia telah bersumpah palsu
  rationale: Bentuk ini menyatakan sumpah palsu mengenai benda atau perkara yang baru disebutkan; keterangan 'mengenainya' mempertahankan hubungan dengan עָלָיו.
- source_word: וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ
  choice: Ia harus menggantinya sepenuhnya
  rationale: Ungkapan hukum harfiah 'dengan pokoknya' menunjuk pada penggantian seluruh jumlah atau nilai pokok. 'Menggantinya sepenuhnya' jelas dan cukup luas untuk berbagai jenis milik dalam konteks.
- source_word: וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו
  choice: dan menambahkan seperlima dari nilainya
  rationale: Menunjukkan tambahan dua puluh persen atas nilai pokok. Penyebutan 'dari nilainya' memperjelas dasar perhitungan dalam bahasa Indonesia.
- source_word: לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ
  choice: kepada pemiliknya
  rationale: Idiom Ibrani secara harfiah berarti 'kepada orang yang memilikinya'; 'pemiliknya' menyampaikan hak kepemilikan secara ringkas dan alami.
- source_word: יִתְּנֶ֖/נּוּ
  choice: Ia harus menyerahkannya
  rationale: Dalam konteks pemulihan hak milik, 'menyerahkan' menyatakan pemberian ganti rugi kepada pihak yang berhak dengan lebih tepat daripada sekadar 'memberi'.
- source_word: בְּ/י֥וֹם אַשְׁמָתֽ/וֹ
  choice: pada hari ia mempersembahkan kurban penebus salahnya
  rationale: Konteks imamat mendukung arti kultis אַשָׁם sebagai kurban penebus salah. Kata kerja 'mempersembahkan' dibuat tersurat demi kelancaran bahasa Indonesia, sedangkan ambiguitas istilah Ibrani dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna אַשְׁמָתוֹ dalam konteks hukum kurban
  choice: kurban penebus salahnya
  alternative: kesalahannya
  rationale: Istilah Ibrani dapat menunjuk baik pada keadaan bersalah maupun pada kurban yang berkaitan dengan kesalahan. Konteks langsung Imamat menghubungkan pembayaran ganti rugi dengan tindakan kurban, sehingga arti kultis dipakai dalam teks utama tanpa meniadakan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang bermartabat. Kalimat dibuat lugas bagi pembaca umum; istilah 'kurban penebus salah' dipertahankan sebagai istilah ritual, sementara ambiguitas sumber dijelaskan melalui catatan kaki.
