base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: id
  text: Ia harus membawa kedua burung itu kepada imam. Imam harus lebih dahulu mempersembahkan burung yang diperuntukkan sebagai kurban penghapus dosa[a]. Imam harus memulas kepalanya pada bagian depan tengkuknya[b], tetapi tidak memisahkannya sampai lepas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini juga dapat diterjemahkan “kurban penyucian”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari hadapan tengkuknya”. Ungkapan Ibrani ini sulit; kata yang diterjemahkan “tengkuk” dapat menunjuk pada belakang leher, dan letak tepat tindakan ini tidak pasti.
    reason: textual_or_semantic_ambiguity
  - marker: c
    text: Artinya, kepala burung itu tidak dipisahkan seluruhnya dari tubuhnya.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: Ia harus membawa kedua burung itu kepada imam
  rationale: Bentuk hukum diterjemahkan dengan 'harus'. 'Kedua burung' menjelaskan acuan pronomina jamak kepada dua ekor burung dalam ayat sebelumnya tanpa mengubah jumlahnya.
- source_word: וְהִקְרִיב
  choice: Imam harus ... mempersembahkan
  rationale: Dalam konteks ritus, bentuk Hifil dari קרב menunjuk pada tindakan mempersembahkan atau membawa mendekat. Penyebutan ulang 'imam' memperjelas pelaku ritual secara wajar dalam bahasa Indonesia.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: lebih dahulu ... burung yang diperuntukkan sebagai kurban penghapus dosa
  rationale: '''Lebih dahulu'' mempertahankan urutan רִאשׁוֹנָה, sedangkan frasa relatif mempertahankan gagasan bahwa salah satu burung ditetapkan untuk חטאת.'
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Istilah ini dikenal luas dan menyampaikan fungsi kurban dalam konteks hukum Imamat; alternatif 'kurban penyucian' dicatat karena istilah Ibraninya juga dapat menekankan pemurnian ritual.
- source_word: וּמָלַק
  choice: menjepit pangkal kepala
  rationale: מלק adalah istilah teknis untuk tindakan imam pada kepala atau leher burung. Pilihan ini menggambarkan tindakan manual tanpa menyiratkan bahwa kepala langsung dipisahkan seluruhnya; ketidakpastian teknis dijelaskan dalam catatan.
- source_word: מִמּוּל עָרְפּוֹ
  choice: pada bagian yang berhadapan dengan tengkuknya
  rationale: Terjemahan ini mempertahankan hubungan spasial yang sulit dalam מִמּוּל dan arti עֹרֶף sebagai tengkuk atau belakang leher, tanpa memastikan secara berlebihan titik anatomis yang diperdebatkan.
- source_word: וְלֹא יַבְדִּיל
  choice: tetapi tidak boleh memutuskannya sampai lepas
  rationale: בדל berarti memisahkan. Dalam ritus ini larangannya ialah memisahkan kepala sepenuhnya dari tubuh; ungkapan Indonesia ini menyampaikan batas tindakan tersebut dengan jelas.
