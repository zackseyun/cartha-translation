translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Kalimat dipecah agar pergantian pelaku dari pembawa kurban kepada imam jelas. Istilah teknis yang tidak pasti tidak dibuat terlalu spesifik, dan ambiguitas anatomi dipertahankan melalui catatan kaki.
