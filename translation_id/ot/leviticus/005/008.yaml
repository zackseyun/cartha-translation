revisions:
- from: Ia harus membawa kedua burung itu kepada imam. Imam harus lebih dahulu mempersembahkan burung yang diperuntukkan sebagai kurban penghapus dosa[a]. Imam harus menjepit pangkal kepala burung itu[b] pada bagian yang berhadapan dengan tengkuknya[c], tetapi tidak boleh memutuskannya sampai lepas.
  to: Ia harus membawa kedua burung itu kepada imam. Imam harus lebih dahulu mempersembahkan burung yang diperuntukkan sebagai kurban penghapus dosa[a]. Imam harus memulas kepalanya pada bagian depan tengkuknya[b], tetapi tidak memisahkannya sampai lepas[c].
  rationale: Revisi menghapus tambahan “pangkal”, memakai “memulas” sebagai ungkapan Indonesia yang wajar bagi tindakan teknis pada kepala burung tanpa menyiratkan pemenggalan penuh, dan memindahkan ketidakpastian frasa anatomis ke catatan kaki. Catatan kaki juga dipadatkan agar membedakan alternatif leksikal dari penjelasan ritual.
