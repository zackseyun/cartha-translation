review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan rujukan jamak kepada dua burung, urutan bahwa burung untuk חַטָּאת dipersembahkan lebih dahulu, dan larangan memisahkan kepala seluruhnya. Namun, “pangkal kepala” menambahkan rincian anatomi yang tidak terdapat dalam bahasa Ibrani. Frasa מִמּוּל עָרְפּוֹ memang sulit; terjemahan utama perlu menghindari penetapan lokasi yang terlalu pasti, sementara catatan kaki menjelaskan ketidakpastiannya.
  naturalness: Bahasa draf umumnya modern dan jelas. “Menjepit pangkal kepala” kurang alami dan dapat menyatakan tindakan/lokasi yang keliru. “Memulas kepalanya” lebih lazim untuk tindakan ritual pada burung dan tetap selaras dengan larangan berikutnya bahwa kepala tidak dipisahkan.
  terminology: “Kurban penghapus dosa” dapat dipertahankan sebagai istilah yang mudah dipahami untuk חַטָּאת, dengan alternatif “kurban penyucian” dalam catatan. Pelaku ritual “imam” pada dua tindakan terakhir jelas dari konteks hukum kurban dan membuat pergantian dari pembawa persembahan menjadi imam dapat dipahami.
  issues:
  - severity: medium
    issue: “pangkal kepala” tidak didukung oleh teks Ibrani.
    rationale: Objeknya adalah “kepalanya”; teks tidak menyebut pangkal kepala. Penambahan ini secara tidak perlu mempersempit tindakan ritual yang dimaksud.
  - severity: medium
    issue: Terjemahan lokasi anatomi terlalu menentukan dan kurang alami.
    rationale: מִמּוּל עָרְפּוֹ merupakan frasa sulit. Terjemahan “pada bagian yang berhadapan dengan tengkuknya” kaku dan dapat terdengar tidak jelas; terjemahan utama yang lebih ringkas, disertai catatan tentang ambiguitasnya, lebih setia pada tingkat kepastian sumber.
  - severity: low
    issue: Catatan a terlalu menjelaskan fungsi istilah sebagai penghapusan kenajisan ritual.
    rationale: Alternatif leksikal “kurban penyucian” cukup dicatat tanpa membatasi atau menguraikan fungsi persembahan secara berlebihan dalam ayat ini.
  revised_text: Ia harus membawa kedua burung itu kepada imam. Imam harus lebih dahulu mempersembahkan burung yang diperuntukkan sebagai kurban penghapus dosa[a]. Imam harus memulas kepalanya pada bagian depan tengkuknya[b], tetapi tidak memisahkannya sampai lepas[c].
