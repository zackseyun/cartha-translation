  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: id
  text: Lalu Harun mengunjukkan bagian dada dan paha kanan itu sebagai persembahan unjukan di hadapan Yahweh, seperti yang diperintahkan Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: dada-dada
  rationale: Dalam konteks kurban, חָזֶה menunjuk pada bagian dada hewan. Bentuk jamaknya dipertahankan karena bagian-bagian itu berasal dari lebih dari satu hewan kurban.
- source_word: שׁוֹק הַיָּמִין
  choice: paha kanan
  rationale: שׁוֹק menunjuk pada bagian paha atau tungkai; 'paha kanan' merupakan istilah ritual yang jelas dan lazim dalam bahasa Indonesia.
- source_word: הֵנִיף
  choice: mengunjukkan
  rationale: Bentuk Hifil dari נוּף menyatakan tindakan ritual mempersembahkan sesuatu dengan gerakan unjukan di hadapan Yahweh. 'Mengunjukkan' mempertahankan kaitannya dengan istilah teknis 'persembahan unjukan'.
- source_word: תְּנוּפָה
  choice: sebagai persembahan unjukan
  rationale: Nomina ini merupakan istilah teknis bagi persembahan yang diunjukkan; konstruksi Indonesia ini menyampaikan fungsi ritual tindakan tersebut.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti 'di hadapan/dalam hadirat', dan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: seperti yang diperintahkan Musa
  rationale: Klausa ini menyatakan bahwa tindakan Harun dilakukan sesuai dengan perintah Musa sebelumnya, tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: וְאֵת ... וְאֵת
  choice: dada-dada dan paha kanan itu
  rationale: Pengulangan penanda objek langsung mengoordinasikan kedua objek. Partikel 'itu' secara alami menandai bagian-bagian kurban yang telah disebut dalam konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi sebagai nama diri dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Pelaku yang memberi perintah dalam klausa penutup
  choice: Musa sebagai pihak yang memerintahkan
  alternative: Yahweh sebagai pihak yang memerintahkan melalui Musa
  rationale: Secara gramatikal, מֹשֶׁה adalah subjek eksplisit dari צִוָּה. Terjemahan tidak mengalihkan subjek kepada Yahweh meskipun konteks lebih luas menyatakan bahwa Musa menyampaikan perintah ilahi.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Istilah ritual 'persembahan unjukan' dipertahankan demi ketepatan dan konsistensi kitab Imamat; susunan kalimat dibuat alami tanpa menghilangkan bentuk jamak 'dada-dada'.
