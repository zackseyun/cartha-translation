  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: id
  text: Kemudian ia membawa persembahan umat itu. Ia mengambil kambing jantan yang menjadi kurban penghapus dosa bagi umat itu, menyembelihnya, lalu mempersembahkannya sebagai kurban penghapus dosa[a], seperti yang pertama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memurnikannya secara ritual.” Kata kerja Ibrani ini dapat berarti melaksanakan tata cara kurban penghapus dosa atau melakukan pemurnian/penghapusan secara ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: membawa
  rationale: Dalam bentuk Hifil dan konteks kurban, kata ini berarti membawa mendekat atau menghadapkan suatu persembahan. “Membawa” alami dalam bahasa Indonesia dan tidak menyamakan tindakan awal ini dengan seluruh rangkaian mempersembahkan kurban.
- source_word: קָרְבַּן הָעָם
  choice: persembahan umat itu
  rationale: קָרְבָּן adalah istilah umum bagi sesuatu yang dibawa mendekat sebagai persembahan; bentuk konstruksi menyatakan bahwa persembahan itu berasal dari atau diperuntukkan bagi umat.
- source_word: שְׂעִיר הַחַטָּאת
  choice: kambing jantan yang menjadi kurban penghapus dosa
  rationale: שָׂעִיר menunjuk pada kambing jantan, sedangkan חַטָּאת dalam konteks ritual ini menunjuk pada jenis kurban, bukan sekadar konsep abstrak ‘dosa’.
- source_word: אֲשֶׁר לָעָם
  choice: bagi umat itu
  rationale: Preposisi ל di sini paling wajar menyatakan peruntukan atau tindakan atas nama umat, bukan kepemilikan semata.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: menyembelihnya
  rationale: שׁחט adalah verba baku untuk penyembelihan hewan, khususnya dalam konteks kurban.
- source_word: וַיְחַטְּאֵהוּ
  choice: mengolahnya sebagai kurban penghapus dosa
  rationale: Bentuk Piel dari חטא di sini menunjuk pada pelaksanaan tata cara kurban penghapus dosa terhadap atau dengan kambing itu. “Mengolahnya” menyatakan tindakan ritual tanpa memberi kesan bahwa kambing tersebut sendiri sedang dibersihkan.
- source_word: כָּרִאשׁוֹן
  choice: seperti kurban yang pertama
  rationale: Ungkapan ini merujuk kembali kepada kurban penghapus dosa yang lebih dahulu dipersembahkan dan menunjukkan bahwa tata cara serupa diikuti.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: dosa; kurban pemurnian
  rationale: Dalam konteks Imamat 9, חַטָּאת menunjuk pada jenis kurban. “Kurban penghapus dosa” mempertahankan hubungan leksikalnya dengan dosa tanpa mengubahnya menjadi konsep abstrak semata; alternatif “kurban pemurnian” mencerminkan fungsi ritual yang mungkin ditekankan istilah tersebut.
- issue: Makna וַיְחַטְּאֵהוּ
  choice: mengolahnya sebagai kurban penghapus dosa
  alternative: memurnikannya; mempersembahkannya sebagai kurban penghapus dosa
  rationale: Verba ini dapat menyatakan pelaksanaan ritus חַטָּאת atau tindakan pemurnian/penghapusan secara ritual. Pilihan utama mempertahankan cakupan ritualnya tanpa memasukkan istilah teologis yang lebih khusus seperti “mengadakan pendamaian”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Umat” dipakai untuk הָעָם dalam konteks komunitas Israel; “kurban” mengikuti ejaan baku KBBI. Struktur kalimat dipertahankan dekat dengan urutan Ibrani, tetapi dipecah secara alami agar mudah dibaca.
