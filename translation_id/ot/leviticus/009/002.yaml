base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: id
  text: Lalu ia berkata kepada Harun, “Ambillah untuk dirimu seekor anak lembu[a] sebagai kurban penghapus dosa dan seekor domba jantan sebagai kurban bakaran, keduanya tanpa cacat, lalu bawalah keduanya ke hadapan Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seekor anak lembu, anak dari kawanan sapi”; ini adalah ungkapan Ibrani untuk seekor hewan bovin muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אַהֲרֹן
  choice: Lalu ia berkata kepada Harun
  rationale: Bentuk wayyiqtol meneruskan alur narasi. ‘Lalu’ menyampaikan kelanjutan itu secara wajar tanpa mempertegas urutan waktu secara berlebihan.
- source_word: קַח לְךָ
  choice: Ambillah untuk dirimu
  rationale: Mempertahankan nuansa datif personal לְךָ, yakni bahwa Harun harus mengambil hewan itu bagi dirinya sendiri.
- source_word: עֵגֶל בֶּן בָּקָר
  choice: seekor anak sapi—anak dari kawanan sapi
  rationale: Mempertahankan susunan aposisional Ibrani dan menjelaskan bahwa yang dimaksud ialah hewan muda dari jenis sapi.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam konteks ritual, חַטָּאת menunjuk pada jenis kurban, bukan hanya pada dosa sebagai gagasan abstrak.
- source_word: וְאַיִל לְעֹלָה
  choice: dan seekor domba jantan sebagai kurban bakaran
  rationale: אַיִל ialah domba jantan, sedangkan עֹלָה merupakan istilah teknis untuk kurban yang dibakar.
- source_word: תְּמִימִם
  choice: Keduanya harus tidak bercacat
  rationale: Bentuk jamaknya mencakup kedua hewan. Kalimat tersendiri membuat cakupan jamak tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: וְהַקְרֵב
  choice: Bawalah keduanya
  rationale: Hifil dari קרב secara harfiah berarti membawa mendekat atau menghadapkan. ‘Bawalah’ tidak mendahului tindakan persembahan yang prosedurnya baru dijelaskan sesudahnya.
- source_word: לִפְנֵי יְהוָה
  choice: ke hadapan Yahweh
  rationale: Menyampaikan ungkapan kultis tentang kehadiran Allah dan mempertahankan nama perjanjian יהוה sebagai ‘Yahweh’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama ilahi tersebut, bukan menggantinya dengan gelar.
- issue: Makna חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban karena dosa
  rationale: Istilah ini dapat menyoroti dosa maupun fungsi pemurnian/penghapusan dalam sistem kurban. Pilihan ini mengikuti istilah jenis kurban yang lazim tanpa merinci teori pendamaian tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Imperatif memakai bentuk -lah; istilah ritual ‘kurban penghapus dosa’ dan ‘kurban bakaran’ dipakai secara konsisten. Tanda pisah mempertahankan sekaligus memperjelas aposisi Ibrani.
