  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: id
  text: Lalu ia membawa kurban bakaran itu dan mempersembahkannya sesuai dengan ketetapan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan tata cara yang ditetapkan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: membawa
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau menghadapkan. Dalam konteks ritual ini, “membawa” alami dalam bahasa Indonesia dan tidak menyamakan tindakan ini sepenuhnya dengan verba berikutnya.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang seluruhnya dibakar. “Kurban bakaran” jelas, ringkas, dan lazim dalam konteks Imamat.
- source_word: וַיַּעֲשֶׂהָ
  choice: mempersembahkannya
  rationale: עשה secara dasar berarti melakukan atau mengerjakan, tetapi di sini menunjuk pada pelaksanaan ritus kurban. “Mempersembahkannya” menyampaikan fungsi kontekstualnya secara alami tanpa merinci tahap ritual yang tidak dinyatakan oleh verba tersebut.
- source_word: כַּמִּשְׁפָּט
  choice: sesuai dengan ketetapan
  rationale: מִשְׁפָּט di sini mengacu pada aturan atau tata cara yang telah ditetapkan bagi kurban. Pilihan ini mempertahankan nuansa normatif dan legalnya.
