  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: id
  text: Kemudian ia menyembelih kurban bakaran itu. Anak-anak Harun membawa darahnya kepadanya, lalu ia menyiramkan[a] darah itu pada mezbah, di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melemparkannya”. Kata Ibrani ini menunjukkan darah dikenakan pada mezbah dengan gerakan yang kuat, bukan sekadar dipercikkan secara halus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Kemudian ia menyembelih
  rationale: Dalam konteks kurban, שׁחט menunjuk pada penyembelihan ritual; “kemudian” menyampaikan urutan narasi secara alami.
- source_word: הָעֹלָה
  choice: kurban bakaran itu
  rationale: עוֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya; bentuk definit diterjemahkan dengan “itu” sesuai konteks.
- source_word: וַיַּמְצִאוּ
  choice: membawa
  rationale: Dalam prosedur ritual ini, anak-anak Harun membawa darah kepada Harun agar ia mengaplikasikannya pada mezbah.
- source_word: בְּנֵי אַהֲרֹן
  choice: Anak-anak Harun
  rationale: Padanan langsung dan alami yang mempertahankan identitas keluarga sekaligus peran keimaman mereka.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Pronomina ini merujuk kepada Harun, pelaku tindakan dalam konteks terdekat.
- source_word: הַדָּם
  choice: darah itu
  rationale: Bentuk definit merujuk pada darah kurban yang baru disembelih.
- source_word: וַיִּזְרְקֵהוּ
  choice: ia memercikkan darah itu
  rationale: זרק dalam tata cara kurban berarti mengaplikasikan darah dengan melemparkan atau memercikkannya pada mezbah. “Memercikkan” alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan nuansa gerakan yang lebih kuat.
- source_word: עַל הַמִּזְבֵּחַ
  choice: pada ... mezbah
  rationale: Frasa ini menunjukkan darah dikenakan pada permukaan mezbah.
- source_word: סָבִיב
  choice: pada semua sisi
  rationale: סביב menyatakan bahwa darah dikenakan mengelilingi mezbah, bukan hanya pada satu bagian.
