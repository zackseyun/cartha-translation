  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: id
  text: Lalu mereka menyerahkan kurban bakaran itu kepadanya menurut potongan-potongannya dan kepalanya; kemudian ia membakarnya di atas mazbah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani yang diterjemahkan “membakarnya” dalam konteks kurban dapat secara lebih khusus berarti “mempersembahkannya sebagai asap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan mudah dipahami untuk עֹלָה dalam konteks kurban Imamat; menunjuk pada kurban yang seluruhnya dibakar di mazbah.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: mereka menyerahkan ... kepadanya
  rationale: Bentuk Hifil מצא di sini menyatakan tindakan membawa atau menyampaikan bagian kurban kepada Harun. 'Menyerahkan' sesuai dengan rangkaian pelayanan para imam dan alami dalam bahasa Indonesia.
- source_word: לִנְתָחֶיהָ
  choice: potong demi potong
  rationale: נֶתַח berarti potongan atau bagian tubuh hewan yang telah disembelih; ungkapan ini menyampaikan bahwa bagian-bagian itu diberikan secara terpisah.
- source_word: הָרֹאשׁ
  choice: kepalanya
  rationale: Terjemahan anatomis langsung, dengan sufiks kepunyaan yang alami dalam bahasa Indonesia dan tetap membedakan kepala dari potongan-potongan lainnya.
- source_word: וַיַּקְטֵר
  choice: ia membakarnya
  rationale: Dalam konteks persembahan, קטר berarti membakar di mazbah sehingga naik sebagai asap. Bentuk enklitik '-nya' secara alami merujuk secara kolektif kepada kurban yang baru disebut.
- source_word: עַל הַמִּזְבֵּחַ
  choice: di atas mazbah
  rationale: '''Mazbah'' mempertahankan istilah kultis yang lazim dalam terjemahan Alkitab Indonesia, sedangkan ''di atas'' menyatakan lokasi pembakaran dengan jelas.'
