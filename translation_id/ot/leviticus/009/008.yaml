  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: id
  text: Kemudian Harun mendekati mazbah dan menyembelih anak sapi untuk kurban penghapus dosa[a] bagi dirinya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban pemurnian.” Istilah Ibrani ini dapat merujuk pada kurban yang berkaitan dengan penghapusan dosa dan kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: mendekati
  rationale: Bentuk wayyiqtol dari קרב menyatakan gerakan mendekat. 'Mendekati' alami dalam bahasa Indonesia dan mempertahankan gerakan konkret menuju mazbah.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: '''Mazbah'' adalah istilah Indonesia yang baku dan khas bagi tempat persembahan kurban dalam konteks Alkitab.'
- source_word: וַיִּשְׁחַט
  choice: menyembelih
  rationale: Dalam konteks kurban, שחט menunjuk pada tindakan penyembelihan ritual; 'menyembelih' lebih tepat daripada 'membunuh'.
- source_word: עֵגֶל
  choice: anak sapi
  rationale: עֵגֶל menunjuk pada sapi muda; 'anak sapi' merupakan padanan langsung dan mudah dipahami.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam peraturan kurban, חטאת menamai jenis kurban yang berkaitan dengan dosa sekaligus penghapusan kenajisan. Padanan ini mempertahankan kaitan leksikal dengan dosa tanpa meniadakan fungsi pemurniannya.
- source_word: אֲשֶׁר לוֹ
  choice: bagi dirinya sendiri
  rationale: Dalam konteks ini frasa tersebut membedakan kurban Harun sendiri dari kurban bagi umat. 'Bagi dirinya sendiri' menyatakan fungsi kurban secara alami, bukan sekadar kepemilikan.
theological_decisions:
- issue: Makna חטאת dalam konteks kurban keimaman
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: חטאת dapat menunjuk pada dosa maupun kurban yang menangani dosa dan kenajisan. Teks utama memakai istilah yang sudah jelas bagi pembaca Indonesia dan tetap menghubungkannya dengan dosa; kemungkinan penekanan pada pemurnian dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan tindakan Ibrani dipertahankan. 'Mazbah' dipilih untuk ketepatan dalam konteks ibadah, sedangkan penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
