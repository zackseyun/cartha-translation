source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: id
  text: Musa dan Harun masuk ke Kemah Pertemuan. Setelah keluar, mereka memberkati umat itu. Lalu kemuliaan Yahweh tampak kepada seluruh umat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan teknis yang baku dan alami untuk kemah suci tempat pertemuan; huruf kapital menandai nama khusus bangunan ibadah tersebut.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: masuk ... setelah keluar
  rationale: Mengungkapkan urutan gerak secara alami dalam bahasa Indonesia. Subjek gabungan Musa dan Harun serta verba jamak berikutnya mendukung bahwa keduanya masuk dan keluar.
- source_word: וַיְבָרֲכוּ
  choice: mereka memberkati
  rationale: Padanan langsung yang tidak merinci bentuk atau isi berkat melebihi teks sumber.
- source_word: הָעָם / כָּל הָעָם
  choice: umat itu / seluruh umat
  rationale: Dalam konteks ini עָם menunjuk kepada komunitas Israel yang berkumpul; 'umat' alami dan mempertahankan nuansa komunitas perjanjian.
- source_word: כְבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: Mempertahankan gagasan כָּבוֹד sebagai kemuliaan ilahi yang menyatakan diri dan menerjemahkan nama perjanjian יְהוָה sebagai Yahweh.
- source_word: וַיֵּרָא
  choice: tampak
  rationale: Bentuk Nifal menyatakan bahwa kemuliaan itu menjadi terlihat; 'tampak' ringkas, alami, dan tidak menambahkan rincian.
- source_word: אֶל כָּל הָעָם
  choice: kepada seluruh umat
  rationale: Mengikuti arah relasional אֶל dan menyatakan bahwa penampakan tersebut dialami oleh seluruh umat tanpa memperluas makna.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; 'Yahweh' mempertahankan nama perjanjian itu dan menghindari penggantiannya dengan gelar.
- issue: Hubungan waktu dan urutan antarklausa
  choice: Setelah keluar ... Lalu
  alternative: dan mereka keluar ... dan
  rationale: Rangkaian wayyiqtol menyampaikan kemajuan narasi. 'Setelah' dan 'lalu' membuat urutannya jelas dalam bahasa Indonesia modern tanpa menyatakan hubungan sebab-akibat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi agar mudah dipahami, sambil mempertahankan urutan tindakan dan ketegangan teofanik dalam teks Ibrani.
