  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: id
  text: 'Dan kepada orang Israel engkau harus berkata: “Ambillah seekor kambing jantan sebagai kurban penghapus dosa, serta seekor anak sapi dan seekor anak domba, keduanya berumur satu tahun dan tanpa cacat, sebagai kurban bakaran.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: Kepada orang Israel
  rationale: Ungkapan ini mengalihkan perintah kepada komunitas Israel. ‘Orang Israel’ menyampaikan sebutan kolektif Ibrani secara alami dalam bahasa Indonesia tanpa membuatnya terdengar seolah-olah hanya merujuk kepada anak-anak secara usia.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: haruslah engkau berkata
  rationale: Bentuk imperfek dalam konteks perintah menyatakan kewajiban yang ditujukan kepada Musa, sedangkan לֵאמֹר memperkenalkan perkataan langsung. Susunan ini mempertahankan daya perintah dengan ragam yang wajar dan bermartabat.
- source_word: קְחוּ
  choice: Ambillah
  rationale: Imperatif jamak ini ditujukan kepada orang Israel. ‘Ambillah’ mempertahankan arti dasar לקח tanpa menambahkan gagasan tujuan tempat seperti yang dapat tersirat dalam ‘bawalah’.
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa konstruksi ini menunjuk kepada kambing jantan; terjemahan tersebut jelas dan mempertahankan spesifikasi jenis kelamin hewan.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam konteks persembahan keimaman, חַטָּאת menunjuk kepada jenis kurban. Istilah Indonesia ini dikenal luas, sedangkan nuansa pemurnian yang juga mungkin dipertahankan dalam catatan kaki.
- source_word: וְעֵגֶל וָכֶבֶשׂ
  choice: serta seekor anak sapi dan seekor anak domba
  rationale: עֵגֶל berarti anak sapi dan כֶּבֶשׂ berarti anak domba. ‘Serta’ menghubungkan kedua hewan ini dengan kurban sebelumnya secara alami.
- source_word: בְּנֵי שָׁנָה תְּמִימִם
  choice: keduanya berumur satu tahun dan tidak bercacat
  rationale: Bentuk jamak menerangkan anak sapi dan anak domba secara distributif. ‘Keduanya’ memperjelas cakupan itu, dan ‘tidak bercacat’ menyampaikan kelayakan ritual tanpa memberi kesan kesempurnaan mutlak.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: Dalam pemakaian kultis, עֹלָה adalah kurban yang dibakar seluruhnya. ‘Kurban bakaran’ merupakan istilah Indonesia yang ringkas, lazim, dan tepat.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Secara harfiah bentuk ini berarti ‘anak-anak lelaki Israel’, tetapi sebagai sebutan kolektif ungkapan tersebut menunjuk kepada anggota atau keturunan umat Israel, bukan hanya anak laki-laki. ‘Orang Israel’ mempertahankan rujukan korporatnya dalam bahasa Indonesia modern tanpa membatasi makna berdasarkan usia atau jenis kelamin.
- issue: Penerjemahan חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Kata Ibrani ini menamai kategori kurban dan dapat menonjolkan baik hubungan dengan dosa maupun fungsi pemurnian dalam teks keimaman. Istilah yang paling mudah dikenali digunakan dalam teks utama, sementara alternatif yang sah dicatat agar ketegangan leksikalnya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk ‘engkau’ dipakai karena perintah ditujukan kepada Musa seorang diri, sedangkan ‘Ambillah’ mempertahankan perintah jamak kepada komunitas. Struktur kalimat dibuat alami sambil menjaga rincian ritual dan hubungan gramatikal sumber.
