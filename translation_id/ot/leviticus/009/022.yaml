source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: id
  text: Kemudian Harun mengangkat tangannya[a] ke arah umat itu dan memberkati mereka. Lalu ia turun setelah mempersembahkan kurban penghapus dosa[b], kurban bakaran, dan kurban keselamatan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangannya”; sebagian orang memahami gerak pemberkatan ini sebagai mengangkat kedua tangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban pemurnian.”
    reason: lexical_alternative
  - marker: c
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: mengangkat
  rationale: Kata kerja נשׂא bersama 'tangan' berarti mengangkat; pilihan ini menyampaikan gerakan fisik yang mendahului berkat.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Bentuk Ibrani ini tunggal dengan sufiks orang ketiga maskulin tunggal. Bentuk tunggal dipertahankan agar setia pada WLC, tanpa menutup kemungkinan bahwa gerak pemberkatan dilakukan dengan kedua tangan.
- source_word: אֶל הָעָם
  choice: ke arah umat itu
  rationale: Preposisi אֶל menunjukkan arah. 'Ke arah' mempertahankan orientasi gerakan tangan Harun, sedangkan 'umat' sesuai dengan konteks komunitas Israel.
- source_word: וַיְבָרְכֵם
  choice: dan memberkati mereka
  rationale: Bentuk piel dari ברך secara langsung berarti memberkati; ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: וַיֵּרֶד
  choice: Lalu ia turun
  rationale: ירד berarti turun. Terjemahan ini mempertahankan gerak turun tanpa menambahkan lokasi yang tidak dinyatakan dalam teks.
- source_word: מֵעֲשֹׂת
  choice: setelah mempersembahkan
  rationale: Infinitif עשה dengan מן menunjukkan peralihan sesudah tindakan yang baru diselesaikan. Dalam konteks kurban, 'mempersembahkan' lebih alami daripada terjemahan harfiah 'membuat'.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: חטאת adalah istilah teknis untuk kurban yang berkaitan dengan dosa dan pemurnian. 'Kurban penghapus dosa' dikenal luas dalam bahasa Indonesia, sementara nuansa pemurnian dicatat dalam catatan kaki.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: עלה merupakan istilah baku bagi kurban yang dibakar di atas mazbah; 'kurban bakaran' ringkas, dikenal, dan konsisten dengan terminologi Alkitab Indonesia.
- source_word: הַשְּׁלָמִים
  choice: kurban keselamatan
  rationale: שׁלמים adalah kategori kurban yang berhubungan dengan kesejahteraan, damai, dan persekutuan. 'Kurban keselamatan' mempertahankan istilah Alkitab Indonesia yang mapan, dengan alternatif makna dicatat.
theological_decisions:
- issue: Bilangan tangan dalam gerak pemberkatan
  choice: Mempertahankan bentuk tunggal 'tangannya' dalam teks utama
  alternative: Menggunakan 'kedua tangannya' atau 'tangan-tangannya' berdasarkan pemahaman umum mengenai gerak pemberkatan imam
  rationale: Teks Masoret secara morfologis berbentuk tunggal. Mempertahankan bentuk itu menjaga bukti sumber dan tidak menetapkan secara berlebihan bagaimana gerak tersebut dilakukan.
- issue: Istilah teknis חטאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah tradisional mempertahankan keterkenalan dan kaitannya dengan dosa, tetapi 'kurban pemurnian' dapat lebih menonjolkan fungsi ritualnya; alternatif itu disediakan agar ketegangan makna tidak dihapus.
- issue: Istilah teknis שׁלמים
  choice: kurban keselamatan
  alternative: kurban persekutuan atau kurban kesejahteraan
  rationale: Istilah ini memiliki cakupan makna yang mencakup damai, kesejahteraan, dan persekutuan. Pilihan utama menjaga kesinambungan istilah yang dikenal, sedangkan alternatif dicatat tanpa mengunci satu penafsiran fungsi kurban.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami dengan pemisahan sesudah tindakan pemberkatan. Istilah 'kurban' digunakan secara konsisten untuk kategori persembahan ritual. Penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskan.
