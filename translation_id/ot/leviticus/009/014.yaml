id: LEV.9.14
reference: Leviticus 9:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּרְחַ֥ץ אֶת הַ/קֶּ֖רֶב וְ/אֶת הַ/כְּרָעָ֑יִם וַ/יַּקְטֵ֥ר עַל הָ/עֹלָ֖ה הַ/מִּזְבֵּֽחָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: id
  text: Ia membasuh isi perut dan tungkai bawahnya, lalu membakar semuanya[a] di atas mazbah, di atas kurban bakaran itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mempersembahkan semuanya sebagai asap”.
    reason: Alternatif ini menampilkan secara lebih eksplisit nuansa ritual וַיַּקְטֵר, yaitu membuat bagian-bagian kurban naik sebagai asap dari mazbah, bukan sekadar membakarnya secara umum.
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: ia membasuh
  rationale: Dalam konteks kurban, רחץ menunjuk pada tindakan mencuci dengan air. “Membasuh” jelas, alami, dan sesuai dengan ragam bahasa ritual yang bermartabat.
- source_word: הַקֶּרֶב
  choice: isi perut
  rationale: Dalam petunjuk kurban, קֶרֶב menunjuk pada bagian-bagian dalam tubuh hewan. “Isi perut” merupakan ungkapan Indonesia yang konkret dan mudah dipahami tanpa membatasi maknanya hanya pada usus.
- source_word: הַכְּרָעָיִם
  choice: tungkai bawahnya
  rationale: כְּרָעַיִם merujuk pada tungkai atau bagian bawah kaki hewan. “Tungkai bawahnya” mempertahankan kekhususan anatomis sekaligus memakai bentuk posesif yang alami dalam bahasa Indonesia.
- source_word: וַיַּקְטֵר
  choice: lalu membakar semuanya
  rationale: Bentuk Hifil dari קטר dalam konteks keimaman berarti membakar persembahan di mazbah sehingga naik sebagai asap. “Membakar” alami dalam teks utama, sedangkan nuansa persembahan yang naik sebagai asap dipertahankan dalam catatan kaki.
- source_word: עַל הָעֹלָה
  choice: di atas kurban bakaran itu
  rationale: עַל menyatakan letak di atas kurban yang sudah berada di mazbah, dan עֹלָה adalah istilah baku untuk kurban bakaran. Kata “itu” menandai kurban yang telah disebut dalam konteks sebelumnya.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran direktif pada מִזְבֵּחָה menyatakan arah atau tujuan menuju mazbah; dalam susunan ini, bahasa Indonesia paling alami menyatakannya sebagai lokasi tindakan, “di atas mazbah”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Mazbah” dipertahankan sebagai istilah ibadah yang ringkas dan dikenal luas. Penanda catatan kaki ditempatkan sesudah verba yang diterangkannya, bukan sesudah “tungkai bawahnya”.
