  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: id
  text: Lalu Musa berkata kepada Harun, “Hampirilah mezbah dan persembahkanlah kurban penghapus dosamu[a] serta kurban bakaranmu. Lakukanlah pendamaian bagi dirimu dan bagi umat itu. Kemudian persembahkanlah kurban umat itu dan lakukanlah pendamaian bagi mereka, seperti yang diperintahkan Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnianmu.” Istilah Ibrani חַטָּאת dapat berarti kurban penghapus dosa dan, dalam beberapa konteks, menekankan pemurnian dari kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב אֶל הַמִּזְבֵּחַ
  choice: Datanglah mendekat ke mezbah
  rationale: Bentuk imperatif קרב memanggil Harun untuk mendekati mezbah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gerak mendekat yang dinyatakan teks.
- source_word: וַעֲשֵׂה
  choice: persembahkanlah
  rationale: Secara harfiah berarti 'buatlah/lakukanlah', tetapi dengan objek berupa kurban, makna idiomatisnya ialah melaksanakan atau mempersembahkan kurban.
- source_word: חַטָּאתְךָ
  choice: kurban penghapus dosamu
  rationale: Dalam konteks ibadah, חַטָּאת menunjuk pada kurban yang berkaitan dengan dosa dan kenajisan. Pilihan ini jelas bagi pembaca modern, sementara nuansa pemurniannya dicatat dalam catatan kaki.
- source_word: עֹלָתֶךָ
  choice: kurban bakaranmu
  rationale: Istilah ini menunjuk pada kurban yang seluruhnya dibakar; 'kurban bakaran' merupakan padanan Indonesia yang baku dan tepat.
- source_word: וְכַפֵּר
  choice: adakanlah pendamaian
  rationale: כפר dalam konteks keimaman mencakup tindakan ritual yang menangani dosa atau kenajisan. 'Mengadakan pendamaian' mempertahankan bobot teologis tanpa menetapkan satu teori tertentu.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: bagi dirimu dan bagi umat itu
  rationale: בעד menyatakan kepentingan atau perwakilan. 'Bagi' menyampaikan hubungan tersebut secara ringkas dan alami.
- source_word: קָרְבַּן הָעָם
  choice: kurban umat itu
  rationale: קָרְבָּן adalah istilah umum untuk sesuatu yang dibawa sebagai persembahan; konstruksi kepemilikan dipertahankan secara alami.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: seperti yang diperintahkan Yahweh
  rationale: Ungkapan ini menyatakan kesesuaian dengan perintah ilahi. Nama diri יהוה ditransliterasikan sebagai 'Yahweh' dan tidak diganti dengan gelar.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani dapat menonjolkan dosa yang ditangani atau pemurnian dari kenajisan. Teks utama memakai istilah yang mudah dipahami dan mapan, sedangkan alternatif yang sah dipertahankan dalam catatan kaki.
- issue: Makna כפר
  choice: mengadakan pendamaian
  alternative: melakukan penghapusan dosa atau pemurnian
  rationale: Padanan utama cukup luas untuk mempertahankan dimensi ritual dan teologis kata tersebut tanpa mempersempitnya menjadi satu mekanisme doktrinal.
- issue: Rujukan הָעָם pada dua kemunculan
  choice: umat itu / mereka
  alternative: bangsa itu / mereka
  rationale: Dalam konteks Israel sebagai komunitas ibadah, 'umat' menyampaikan dimensi komunal dan perjanjian tanpa menambahkan penafsiran sektarian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Bentuk imperatif '-lah' dipakai untuk mempertahankan ujaran langsung Musa. Istilah kurban dipilih sesuai ejaan baku; pengulangan struktur sumber dipertahankan sejauh tetap alami.
