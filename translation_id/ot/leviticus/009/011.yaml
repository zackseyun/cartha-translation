  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: id
  text: Namun daging dan kulitnya dibakarnya dengan api di luar perkemahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan daging serta kulitnya dibakarnya dalam api di luar perkemahan.”
    reason: Alternatif ini mempertahankan nilai penghubung biasa dari וְ sebagai 'dan' dan kemungkinan lokatif בָּאֵשׁ sebagai 'dalam api'.
lexical_decisions:
- source_word: וְ/אֶת
  choice: Namun
  rationale: Konjungsi וְ melanjutkan rangkaian tindakan, tetapi dalam konteks ini juga menandai kontras dengan bagian korban yang dibakar di atas mazbah pada ayat sebelumnya. 'Namun' menyampaikan hubungan wacana itu secara alami; אֵת sendiri adalah penanda objek langsung dan tidak diterjemahkan.
- source_word: הַ/בָּשָׂר
  choice: daging
  rationale: בָּשָׂר menunjuk pada daging tubuh hewan. 'Daging' merupakan padanan Indonesia yang konkret dan wajar dalam konteks korban.
- source_word: הָ/ע֑וֹר
  choice: kulitnya
  rationale: עוֹר berarti kulit hewan. Bentuk '-nya' memperjelas bahwa kulit tersebut berasal dari hewan korban yang sedang dibicarakan tanpa menambah gagasan baru.
- source_word: שָׂרַף
  choice: dibakarnya
  rationale: Bentuk aktif orang ketiga tunggal diterjemahkan dengan konstruksi inversi Indonesia yang alami, tetap menyatakan bahwa pelaku yang sama membakar kedua objek tersebut.
- source_word: בָּ/אֵשׁ
  choice: dengan api
  rationale: 'Preposisi בְּ di sini paling wajar dipahami sebagai sarana: pembakaran dilakukan dengan api. ''Dalam api'' tetap mungkin secara leksikal dan dicatat sebagai alternatif.'
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: di luar perkemahan
  rationale: Ungkapan ini menunjukkan lokasi di luar kawasan tempat Israel berkemah. 'Perkemahan' alami dalam bahasa Indonesia dan mempertahankan arti geografis-ritualnya.
theological_decisions:
- issue: Bahasa pembuangan ritual dalam konteks korban
  choice: Menerjemahkan secara konkret tindakan membakar daging dan kulit di luar perkemahan.
  alternative: Memberi terjemahan tipologis yang menonjolkan kaitan teologis dari bagian Alkitab yang lebih kemudian.
  rationale: Ayat ini menyatakan prosedur korban. Terjemahan tidak memasukkan simbolisme atau penafsiran teologis yang tidak dinyatakan langsung oleh teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Istilah 'perkemahan' dipilih karena jelas bagi pembaca umum dan sesuai dengan latar perjalanan Israel. Penanda catatan kaki [a] dicantumkan dalam teks utama.
