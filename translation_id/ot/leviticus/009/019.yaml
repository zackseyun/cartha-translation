  text: וְ/אֶת הַ/חֲלָבִ֖ים מִן הַ/שּׁ֑וֹר וּ/מִן הָ/אַ֔יִל הָֽ/אַלְיָ֤ה וְ/הַֽ/מְכַסֶּה֙ וְ/הַ/כְּלָיֹ֔ת וְ/יֹתֶ֖רֶת הַ/כָּבֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: id
  text: 'dan bagian-bagian lemak dari sapi jantan dan dari domba jantan: ekor berlemak, lemak yang menutupi isi perut, kedua ginjal, dan umbai hati.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: dan bagian-bagian lemak
  rationale: Bentuk jamak חֲלָבִים dalam konteks kurban menunjuk pada bagian-bagian lemak tertentu yang dipersembahkan; ungkapan ini alami dan tetap mempertahankan kekhususan ritualnya.
- source_word: מִן הַשּׁוֹר
  choice: dari sapi jantan
  rationale: שׁוֹר dapat menunjuk pada hewan jenis sapi, dan dalam konteks ini konteks kurban sebelumnya mendukung sapi jantan. Pilihan ini lebih jelas dalam bahasa Indonesia daripada 'lembu' yang dapat terasa kurang spesifik.
- source_word: וּמִן הָאַיִל
  choice: dan dari domba jantan
  rationale: אַיִל secara khusus berarti domba jantan dalam konteks kurban.
- source_word: הָאַלְיָה
  choice: ekor berlemak
  rationale: Istilah ini menunjuk pada ekor berlemak khas domba; terjemahan tersebut jelas tanpa menyiratkan bahwa yang dimaksud hanya lemak yang terpisah dari ekornya.
- source_word: וְהַמְכַסֶּה
  choice: lemak yang menutupi isi perut
  rationale: Bentuk dari כסה berarti 'menutupi'; dalam daftar anatomi kurban, yang dimaksud ialah lemak penutup organ-organ dalam. Penambahan 'isi perut' memperjelas rujukan implisit secara kontekstual.
- source_word: וְהַכְּלָיֹת
  choice: kedua ginjal
  rationale: Bentuk Ibrani ini jamak dan dalam anatomi normal menunjuk pada sepasang ginjal; 'kedua ginjal' terdengar alami dalam bahasa Indonesia.
- source_word: וְיֹתֶרֶת הַכָּבֵד
  choice: dan umbai hati
  rationale: יֹתֶרֶת menunjuk pada bagian atau jaringan tambahan yang melekat pada hati. 'Umbai hati' merupakan istilah ringkas dalam bahasa Indonesia dan tidak memaksakan identifikasi anatomi modern yang sepenuhnya pasti.
theological_decisions: []
