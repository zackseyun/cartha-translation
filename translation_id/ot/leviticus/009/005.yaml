  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: id
  text: Lalu mereka membawa apa yang telah diperintahkan Musa ke bagian depan Kemah Pertemuan. Segenap umat itu mendekat dan berdiri di hadapan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: mereka membawa
  rationale: Walaupun לָקַח pada dasarnya berarti ‘mengambil’, adanya tujuan yang disebutkan membuat ‘membawa’ menjadi padanan bahasa Indonesia yang alami dan tepat dalam konteks ini.
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: apa yang telah diperintahkan Musa
  rationale: Klausa relatif ini merujuk pada segala sesuatu yang sebelumnya diperintahkan Musa tanpa mempersempitnya secara tidak perlu menjadi benda atau tindakan tertentu.
- source_word: אֶל־פְּנֵי
  choice: ke depan
  rationale: Ungkapan ini bersifat spasial dan menunjukkan tempat di bagian depan Kemah Pertemuan; pilihan ini juga membedakannya dari לִפְנֵי יְהוָה pada akhir ayat.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan ini transparan terhadap unsur-unsur istilah Ibrani dan merupakan sebutan yang wajar serta bermartabat dalam bahasa Indonesia.
- source_word: וַיִּקְרְבוּ
  choice: mendekat
  rationale: Kata kerja קָרַב menyatakan gerak mendekati tempat kudus; ‘mendekat’ mempertahankan makna itu secara ringkas dan alami.
- source_word: כָּל־הָעֵדָה
  choice: segenap umat itu
  rationale: עֵדָה menunjuk pada komunitas Israel yang berhimpun. ‘Segenap umat itu’ alami dalam bahasa Indonesia dan mempertahankan cakupan keseluruhannya.
- source_word: וַיַּעַמְדוּ
  choice: berdiri
  rationale: Padanan langsung dan alami bagi עָמַד dalam konteks umat yang mengambil posisi di hadapan Yahweh.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini mempertahankan sekaligus nuansa ruang dan kehadiran ilahi, sedangkan nama perjanjian יְהוָה dialihaksarakan sebagai ‘Yahweh’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu dan mengikuti keputusan teologis sumber konsultasi yang telah diperbarui.
- issue: Makna berdiri לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  alternative: di depan Yahweh
  rationale: ‘Di hadapan’ mempertahankan ketegangan antara lokasi fisik di kawasan kudus dan kenyataan berada dalam kehadiran ilahi, tanpa membatasi ungkapan itu pada salah satu sisi saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. ‘Lalu’ menjaga kesinambungan cerita; ‘Kemah Pertemuan’ diperlakukan sebagai nama sebutan khusus. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual yang perlu dijelaskan kepada pembaca pada ayat ini.
