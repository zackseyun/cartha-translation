  text: וַ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁמִינִ֔י קָרָ֣א מֹשֶׁ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו וּ/לְ/זִקְנֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: id
  text: Pada hari kedelapan, Musa memanggil[a] Harun, putra-putranya, dan para tua-tua Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memanggil untuk datang”; kata kerja Ibrani ini juga dapat berarti “menyuruh datang” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Dalam rangkaian narasi Ibrani, וַיְהִי mengantar peristiwa baru. Bahasa Indonesia alami tidak memerlukan padanan tersendiri seperti 'dan terjadilah'; peralihannya tersampaikan melalui keterangan waktu di awal kalimat.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Padanan temporal langsung yang tidak menambahkan penjelasan bahwa hari itu mengikuti tujuh hari penahbisan, meskipun konteks sebelumnya menunjukkan hal tersebut.
- source_word: קָרָא
  choice: memanggil
  rationale: Kata kerja ini dapat berarti 'memanggil' atau 'menyuruh datang'. 'Memanggil' mempertahankan keluasan makna sumber dan terdengar alami dalam bahasa Indonesia.
- source_word: לְאַהֲרֹן
  choice: Harun
  rationale: Menggunakan bentuk nama yang sudah baku dalam tradisi dan bahasa Indonesia.
- source_word: וּלְבָנָיו
  choice: anak-anaknya
  rationale: Dalam konteks imamat, בָּנָיו menunjuk kepada anak-anak laki-laki Harun. Bentuk 'anak-anaknya' alami dalam bahasa Indonesia dan acuannya jelas dari konteks; jenis kelamin dapat dipahami dari konteks jabatan imam.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: dan para tua-tua Israel
  rationale: Ungkapan ini menunjuk kepada para pemimpin atau wakil senior Israel. 'Para tua-tua Israel' merupakan padanan Indonesia yang mapan dan mempertahankan istilah sosial sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami dengan keterangan waktu di depan; unsur pembuka naratif וַיְהִי tidak diterjemahkan secara harfiah karena akan terasa kaku. Penanda catatan kaki ditempatkan setelah seluruh daftar orang yang dipanggil.
