id: LEV.9.10
reference: Leviticus 9:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת הַ/חֵ֨לֶב וְ/אֶת הַ/כְּלָיֹ֜ת וְ/אֶת הַ/יֹּתֶ֤רֶת מִן הַ/כָּבֵד֙ מִן הַ֣/חַטָּ֔את הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Lemak, kedua ginjal, dan umbai hati dari kurban penghapus dosa[a] itu dibakarnya di atas mazbah hingga menjadi asap, seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban pemurnian.” Istilah Ibrani ini dapat menekankan fungsi kurban untuk menghapus kenajisan, selain menangani dosa.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: lemak
  rationale: Dalam konteks kurban, istilah ini menunjuk pada bagian-bagian lemak yang dikhususkan untuk dipersembahkan. 'Lemak' merupakan padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: כְּלָיֹת
  choice: kedua ginjal
  rationale: Bentuk Ibrani ini jamak dan merujuk secara konkret pada sepasang ginjal hewan kurban.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: umbai hati
  rationale: Frasa ini menunjuk pada bagian tambahan atau tonjolan yang berkaitan dengan hati. 'Umbai hati' mempertahankan rincian anatomis sekaligus memakai istilah kurban yang ringkas dan dapat dipahami.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Padanan ini mempertahankan kaitan leksikal dengan dosa dan menyatakan bahwa yang dimaksud ialah suatu jenis kurban. Nuansa pemurnian yang juga mungkin dalam konteks imamat dicatat dalam catatan kaki.
- source_word: הִקְטִיר
  choice: dibakarnya ... hingga menjadi asap
  rationale: Bentuk kausatif dari קטר dalam konteks kurban berarti membuat bahan kurban naik sebagai asap, bukan sekadar membakar secara umum. Ungkapan ini mempertahankan nuansa ritual tersebut dengan bahasa Indonesia yang alami.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran arah pada bentuk Ibrani berkaitan dengan gerak menuju mazbah, tetapi bersama verba pembakaran kurban, 'di atas mazbah' adalah ungkapan Indonesia yang paling alami dan tepat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Makna חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani dapat menonjolkan dosa maupun fungsi pemurnian kurban. Teks utama memakai kategori yang umum dikenali dan mempertahankan kaitannya dengan dosa, sementara kemungkinan nuansa pemurnian disajikan dalam catatan kaki agar ketegangan maknanya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan rincian ritual; subjek tersirat pada verba Ibrani dinyatakan melalui bentuk enklitik '-nya', yang dalam konteks menunjuk kepada Harun.
