  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: id
  text: Putra-putra Harun membawa darah itu kepadanya[a], lalu ia mencelupkan jarinya ke dalam darah itu dan membubuhkan darah itu pada tanduk-tanduk mezbah[b], dan mencurahkan darah itu ke dasar mezbah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “membawa” juga dapat berarti “membawa mendekat” atau “mempersembahkan” dalam konteks ritual. Kata “kepadanya” paling mungkin mengacu kepada Harun.
    reason: lexical_alternative
  - marker: b
    text: “Tanduk-tanduk mezbah” ialah tonjolan menyerupai tanduk pada sudut-sudut mezbah.
    reason: cultural_note
  - marker: c
    text: 'Atau: “ke fondasi mezbah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: membawa
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau mempersembahkan. Dalam konteks ini, 'membawa' menyatakan tindakan para putra Harun secara wajar tanpa menghilangkan nuansa ritual.
- source_word: בְּנֵי אַהֲרֹן
  choice: Anak-anak Harun
  rationale: Ungkapan konstruksi ini menunjuk kepada putra-putra Harun yang melayani sebagai imam; 'anak-anak Harun' alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: הַדָּם
  choice: darah itu
  rationale: Artikel tertentu dipertahankan melalui 'itu' karena yang dimaksud ialah darah kurban tertentu yang sudah hadir dalam konteks.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Pronomina Ibrani dipertahankan, dengan Harun sebagai anteseden paling alami dalam konteks langsung.
- source_word: וַיִּטְבֹּל
  choice: mencelupkan
  rationale: טבל berarti mencelupkan atau membenamkan; 'mencelupkan' paling sesuai untuk tindakan memasukkan jari ke dalam darah.
- source_word: אֶצְבָּעוֹ
  choice: jarinya
  rationale: Bentuk tunggal dan sufiks posesif orang ketiga dipertahankan secara langsung.
- source_word: וַיִּתֵּן עַל
  choice: membubuhkannya pada
  rationale: נתן dengan עַל di sini menggambarkan penerapan darah dalam ritus. 'Membubuhkan' lebih alami dan tepat daripada sekadar 'menaruh' untuk mengoleskan sedikit darah pada mezbah.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: tanduk-tanduk mezbah
  rationale: Istilah kultis harfiah dipertahankan; yang dimaksud ialah tonjolan menyerupai tanduk pada sudut-sudut mezbah.
- source_word: יָצַק
  choice: mencurahkan
  rationale: Kata ini berarti menuang atau mencurahkan. 'Mencurahkan' menyampaikan tindakan menuangkan darah secara sengaja dalam ritus.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: pada bagian dasar mezbah
  rationale: יְסוֹד dapat berarti dasar atau fondasi. Dalam konteks mezbah, 'bagian dasar' jelas dan alami, sedangkan preposisi אֶל menyatakan arah atau sasaran pencurahan.
theological_decisions:
- issue: Anteseden pronomina אֵלָיו
  choice: Darah dibawa kepada Harun, tetapi nama Harun tidak disisipkan ke dalam teks utama.
  alternative: Darah dibawa kepada mezbah atau kepada pihak lain yang tersirat.
  rationale: Konteks langsung menampilkan anak-anak Harun membantu Harun, yang kemudian melakukan tindakan ritual. Karena teks Ibrani memakai pronomina, terjemahan mempertahankan 'kepadanya' sambil menjelaskan antesedennya dalam catatan.
- issue: Objek pencurahan terakhir
  choice: Dipahami sebagai darah yang masih tersisa.
  alternative: Mengulang secara netral 'darah itu' tanpa menyatakan bahwa itu sisanya.
  rationale: Konstruksi וְאֶת־הַדָּם setelah sebagian darah dibubuhkan pada tanduk-tanduk mezbah secara pragmatis menunjuk pada darah selebihnya. Ungkapan ini memperjelas urutan tindakan tanpa menambahkan makna teologis.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan khidmat. Istilah kultis 'mezbah' dan 'tanduk-tanduk mezbah' dipertahankan karena mapan serta tepat, dengan penjelasan budaya dalam catatan kaki. Pemenggalan menjadi tiga kalimat membantu keterbacaan tanpa mengubah urutan tindakan Ibrani.
