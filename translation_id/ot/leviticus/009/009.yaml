  to: Putra-putra Harun membawa darah itu kepadanya[a], lalu ia mencelupkan jarinya ke dalam darah itu dan membubuhkan darah itu pada tanduk-tanduk mezbah[b], dan mencurahkan darah itu ke dasar mezbah[c].
