  naturalness: Teks revisi tetap memakai Bahasa Indonesia modern yang wajar dan register khidmat. Susunan satu kalimat dengan penghubung “lalu” dan “dan” mempertahankan urutan tindakan naratif tanpa terasa kaku.
  terminology: “Mezbah,” “tanduk-tanduk mezbah,” dan “dasar mezbah” tepat. Catatan tentang tonjolan pada sudut mezbah dan alternatif “fondasi” memadai. Pronomina “kepadanya” mempertahankan bentuk sumber, dengan penjelasan anteseden dalam catatan.
