  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: id
  text: Lalu keluarlah api dari hadapan Yahweh dan menghanguskan di atas mazbah kurban bakaran serta bagian-bagian lemak. Seluruh umat melihat, lalu mereka bersorak gembira dan tersungkur dengan muka ke tanah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: keluarlah api
  rationale: Menjaga gerak keluar yang dinyatakan verba יצא serta urutan narasi yang hidup; bentuk inversi dengan -lah wajar dalam narasi Indonesia yang bermartabat.
- source_word: מִלִּפְנֵי יְהוָה
  choice: dari hadapan Yahweh
  rationale: Mempertahankan idiom Ibrani לִפְנֵי dan menunjukkan bahwa api berasal dari hadirat Yahweh, tanpa mengaburkan nama ilahi.
- source_word: וַתֹּאכַל
  choice: menghanguskan
  rationale: Dalam hubungan dengan api, אכל secara idiomatis berarti melalap atau menghabiskan; 'menghanguskan' alami dan sesuai dengan konteks kurban.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan mudah dipahami untuk עֹלָה, yaitu kurban yang dibakar seluruhnya di atas mezbah.
- source_word: הַחֲלָבִים
  choice: bagian-bagian lemak
  rationale: Bentuk jamak dan konteks ritual menunjuk pada bagian lemak tertentu yang dipersembahkan, bukan lemak secara umum.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: Istilah Indonesia yang mapan untuk tempat kurban dalam konteks Alkitab dan membedakannya dari sekadar meja biasa.
- source_word: וַיַּרְא כָּל הָעָם
  choice: ketika seluruh umat melihatnya
  rationale: Mengungkapkan hubungan temporal naratif secara alami; objek pronominal merujuk pada peristiwa api yang baru saja disebut.
- source_word: וַיָּרֹנּוּ
  choice: mereka bersorak gembira
  rationale: רנן menyatakan seruan nyaring penuh sukacita; pilihan ini mempertahankan unsur suara dan kegembiraan.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: lalu sujud dengan muka sampai ke tanah
  rationale: Mengungkapkan tindakan tersungkur sebagai sikap hormat atau penyembahan sekaligus mempertahankan gambaran konkret muka menghadap tanah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna tindakan jatuh dengan muka ke tanah
  choice: sujud dengan muka sampai ke tanah
  alternative: tersungkur; jatuh dengan muka ke tanah
  rationale: Ungkapan mempertahankan tindakan jasmani yang konkret dan nuansa penghormatan, tanpa menentukan lebih jauh apakah respons itu harus dikategorikan hanya sebagai takut atau hanya sebagai ibadah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibuat mengalir secara naratif; istilah ritual 'kurban bakaran', 'bagian-bagian lemak', dan 'mazbah' dipertahankan karena tepat dalam konteks Imamat.
