  to: Lalu keluarlah api dari hadapan Yahweh dan menghanguskan di atas mazbah kurban bakaran serta bagian-bagian lemak. Seluruh umat melihat, lalu mereka bersorak gembira dan tersungkur dengan muka ke tanah.
  rationale: Revisi menata ulang frasa lokasi agar jelas bahwa kedua unsur persembahan berada di atas mazbah, menghindari penambahan objek eksplisit pada 'melihat', dan memilih ungkapan postur yang lebih dekat dengan idiom Ibrani. Nama ilahi dan istilah kurban dipertahankan.
