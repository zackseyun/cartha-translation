  source_fidelity: 'Revisi kecil diperlukan untuk mempertahankan susunan dan cakupan frasa Ibrani dengan lebih jelas: api itu menghanguskan persembahan yang berada di atas mazbah. Teks Ibrani hanya menyatakan bahwa seluruh umat ''melihat''; objek ''hal itu'' dapat dipahami dari konteks, tetapi tidak perlu ditambahkan. Respons terakhir adalah tindakan tersungkur secara jasmani.'
  naturalness: Drafnya umumnya alami dan berdaftar baik. Namun, penempatan 'di atas mazbah' setelah dua objek dapat sesaat terbaca sebagai hanya menerangkan 'bagian-bagian lemak'. Susunan yang direvisi lebih lancar dan jelas dalam bahasa Indonesia modern.
  terminology: '''Yahweh'', ''kurban bakaran'', ''bagian-bagian lemak'', dan ''mazbah'' tepat dan konsisten dengan konteks ritual. ''Tersungkur dengan muka ke tanah'' mempertahankan citra konkret ungkapan Ibrani tanpa menambahkan penafsiran tentang motif batin.'
