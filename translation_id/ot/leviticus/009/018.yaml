base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: id
  text: Kemudian Harun menyembelih sapi jantan dan domba jantan itu sebagai kurban keselamatan[a] bagi umat. Anak-anak Harun membawa darahnya kepadanya, lalu ia memercikkan darah itu pada sisi-sisi mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kurban persekutuan” atau “kurban kesejahteraan”. Kata Ibrani שְׁלָמִים berkaitan dengan damai, keutuhan, kesejahteraan, dan persekutuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Kemudian Harun menyembelih
  rationale: Bentuk wayyiqtol melanjutkan urutan peristiwa. Nama Harun dinyatakan untuk memperjelas pelaku yang tersirat dari konteks, sedangkan “menyembelih” merupakan istilah kurban yang tepat.
- source_word: הַשּׁוֹר
  choice: sapi jantan
  rationale: שׁוֹר menunjuk pada hewan jenis lembu/sapi; dalam konteks hewan kurban ini, “sapi jantan” alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: הָאַיִל
  choice: domba jantan
  rationale: אַיִל secara khusus berarti domba jantan dewasa.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: kurban keselamatan
  rationale: Pilihan ini mempertahankan kaitan שְׁלָמִים dengan damai, keutuhan, dan keadaan sejahtera, sementara alternatif penting dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לָעָם
  choice: bagi umat
  rationale: Frasa ini menyatakan bahwa kurban tersebut dipersembahkan bagi atau atas nama umat; bentuk ringkas ini alami dalam bahasa Indonesia.
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: membawa ... kepadanya
  rationale: Dalam tata cara kurban, verba ini menyampaikan tindakan membawa atau menyerahkan darah kepada orang yang memimpin upacara.
- source_word: וַיִּזְרְקֵהוּ
  choice: ia memercikkan darah itu
  rationale: זָרַק dalam konteks ritual menunjuk pada pengenaan darah dengan gerakan melemparkan atau memercikkannya pada mezbah. Pengulangan “darah itu” menghindari rujukan pronominal yang janggal dalam bahasa Indonesia.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: pada mezbah di sekelilingnya
  rationale: Terjemahan ini mengikuti gambaran Ibrani bahwa darah dikenakan pada mezbah mengelilingi bagian-bagiannya tanpa menentukan detail yang tidak dinyatakan.
