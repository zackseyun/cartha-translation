translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan khidmat. “Umat” dipilih karena konteksnya adalah seluruh komunitas Israel, dan istilah ritual dijaga agar tetap dapat dipahami pembaca umum.
