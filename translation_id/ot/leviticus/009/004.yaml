id: LEV.9.4
reference: Leviticus 9:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: id
  text: juga seekor sapi dan seekor domba jantan sebagai kurban persekutuan[a] untuk dikurbankan di hadapan Yahweh[b], serta kurban sajian yang dicampur dengan minyak. Sebab hari ini Yahweh akan menampakkan diri kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kurban keselamatan” atau “kurban kesejahteraan.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: יהוה (YHWH), nama ilahi yang di sini diterjemahkan “Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: sapi
  rationale: Istilah ini menunjuk pada hewan jenis sapi. “Sapi” mempertahankan keluasan istilah Ibrani tanpa memastikan jenis kelamin lebih jauh daripada yang dinyatakan bentuk katanya.
- source_word: אַיִל
  choice: domba jantan
  rationale: Istilah ini secara khusus menunjuk pada domba jantan dan diterjemahkan secara jelas bagi pembaca Indonesia modern.
- source_word: שְׁלָמִים
  choice: kurban persekutuan
  rationale: Istilah kurban ini mencakup gagasan damai, kesejahteraan, dan persekutuan. “Kurban persekutuan” alami dalam konteks ritual, sedangkan alternatif penting dipertahankan dalam catatan kaki.
- source_word: לִזְבֹּחַ
  choice: untuk dikurbankan
  rationale: Dalam konteks ritual, verba ini bukan sekadar tindakan menyembelih, melainkan menyembelih sebagai persembahan kurban.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Frasa ini secara langsung berarti “di hadapan” atau “dalam kehadiran” Yahweh; bentuk ringkasnya wajar dan tetap dekat dengan sumber.
- source_word: מִנְחָה
  choice: kurban sajian
  rationale: Dalam peraturan kurban Imamat, istilah ini menunjuk pada persembahan bahan pangan, biasanya biji-bijian atau tepung. “Kurban sajian” merupakan istilah Indonesia yang ringkas dan tidak membatasi bentuknya secara berlebihan.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Ungkapan ini menjelaskan cara kurban sajian dipersiapkan; terjemahan tersebut tepat dan alami dalam bahasa Indonesia modern.
- source_word: כִּי הַיּוֹם
  choice: Sebab hari ini
  rationale: כִּי memperkenalkan alasan bagi perintah sebelumnya, sedangkan הַיּוֹם menekankan waktu terjadinya penampakan.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: akan menampakkan diri kepada kalian
  rationale: Walaupun bentuk Ibraninya perfektif, konteks memberi daya waktu yang segera dan akan datang. Bentuk refleksif “menampakkan diri” menyampaikan makna Niphal secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani menyebut nama perjanjian YHWH secara langsung. “Yahweh” mempertahankan nama diri itu dan membedakannya dari gelar umum “Tuhan”.
- issue: Makna pernyataan tentang penampakan ilahi
  choice: Yahweh akan menampakkan diri kepada kalian
  alternative: kemuliaan Yahweh akan tampak kepada kalian; Yahweh telah menampakkan diri kepada kalian
  rationale: Ayat ini menyebut Yahweh sendiri, bukan “kemuliaan Yahweh” seperti ayat berikutnya. Konteks menunjukkan bahwa penampakan tersebut masih akan segera terjadi, sehingga digunakan bentuk masa depan tanpa menambahkan unsur dari ayat lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena bentuk Ibraninya jamak. Susunan kalimat mempertahankan hubungan ayat ini dengan daftar persembahan pada ayat sebelumnya; huruf awal kecil mencerminkan bahwa teks merupakan kelanjutan kalimat tersebut.
