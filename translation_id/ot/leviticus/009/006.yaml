id: LEV.9.6
reference: Leviticus 9:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: id
  text: Lalu Musa berkata, “Inilah yang telah Yahweh perintahkan untuk kalian lakukan, supaya kemuliaan Yahweh tampak kepada kalian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kemuliaan Yahweh akan tampak kepada kalian.”
    reason: Bahasa Ibrani juga dapat dipahami sebagai klausa masa depan yang terkoordinasi, bukan sebagai klausa tujuan atau hasil.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur narasi; “lalu” menyatakannya secara wajar dalam bahasa Indonesia tanpa memberi penekanan sebab-akibat.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: זֶה הַדָּבָר
  choice: Inilah yang
  rationale: Ungkapan ini menyampaikan penunjukan langsung pada hal yang harus dilakukan. Bentuk yang lebih harfiah, “Inilah hal yang,” kurang alami dalam bahasa Indonesia.
- source_word: צִוָּה
  choice: telah ... perintahkan
  rationale: Kata kerja ini menyatakan perintah berotoritas; “telah” mencerminkan tindakan perintah yang sudah diberikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterusaksarakan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: תַּעֲשׂוּ
  choice: untuk kalian lakukan
  rationale: Bentuk orang kedua jamak dinyatakan secara jelas dengan “kalian”; susunan ini alami sesudah verba “perintahkan”.
- source_word: וְיֵרָא
  choice: supaya ... tampak
  rationale: Klausa ini dapat menyatakan tujuan atau hasil dari pelaksanaan perintah. “Supaya ... tampak” mempertahankan hubungan itu tanpa menjadikannya perintah tambahan.
- source_word: אֲלֵיכֶם
  choice: kepada kalian
  rationale: Preposisi אֶל bersama verba penampakan menunjuk kepada mereka yang menerima penyataan tersebut.
- source_word: כְּבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: Frasa konstruksi Ibrani diterjemahkan langsung dan mempertahankan ungkapan teologis tentang kemuliaan ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung; “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Daya klausa akhir וְיֵרָא אֲלֵיכֶם כְּבוֹד יְהוָה
  choice: 'tujuan/hasil: “supaya kemuliaan Yahweh tampak kepada kalian”'
  alternative: 'masa depan koordinatif: “dan kemuliaan Yahweh akan tampak kepada kalian”'
  rationale: Bahasa Ibrani memungkinkan klausa ini dipahami sebagai tujuan atau hasil, tetapi juga sebagai janji yang terkoordinasi. Terjemahan utama memakai hubungan tujuan/hasil, sedangkan kemungkinan koordinatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan dengan jelas bahwa sapaan dalam bahasa Ibrani berbentuk jamak; susunan kalimat tetap mudah dipahami oleh pembaca umum.
