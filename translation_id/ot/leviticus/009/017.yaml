base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: id
  text: Kemudian ia mempersembahkan kurban sajian, mengambil segenggam[a] darinya, lalu membakarnya di atas mazbah, selain kurban bakaran pagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memenuhi tangannya darinya,” suatu ungkapan untuk mengambil sebagian dari kurban sajian itu dengan tangan untuk dibakar di atas mazbah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: mempersembahkan
  rationale: Dalam konteks kurban, bentuk Hifil dari קרב berarti membawa mendekat atau menyajikan di hadapan TUHAN. “Mempersembahkan” merupakan ungkapan ritual yang alami dalam bahasa Indonesia tanpa merinci tindakan melebihi teks.
- source_word: הַמִּנְחָה
  choice: kurban sajian
  rationale: Dalam peraturan Imamat, מִנְחָה menunjuk pada persembahan hasil bumi, terutama tepung atau gandum. “Kurban sajian” membedakannya dari persembahan umum dan sesuai dengan istilah ritual yang lazim.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: Ia mengambil segenggam dari kurban itu
  rationale: Secara harfiah ungkapan ini berarti “ia memenuhi telapak tangannya darinya.” Dalam konteks ini maksudnya ialah mengambil satu porsi dengan tangan; “mengambil segenggam” menyampaikan tindakan tersebut secara alami sambil mempertahankan gambaran konkretnya.
- source_word: וַיַּקְטֵר
  choice: membakarnya
  rationale: Bentuk Hifil dari קטר dalam konteks kurban berarti membakar bahan persembahan di atas mazbah sehingga naik sebagai asap. “Membakarnya” ringkas dan konteks mazbah memperjelas fungsi ritualnya.
- source_word: עַל הַמִּזְבֵּחַ
  choice: di atas mazbah
  rationale: Padanan lokatif yang wajar dan tepat untuk tindakan pembakaran kurban.
- source_word: מִלְּבַד
  choice: di samping
  rationale: 'Di sini מִלְּבַד menunjukkan tambahan: kurban sajian ini dibakar selain kurban bakaran pagi yang tetap dipersembahkan.'
- source_word: עֹלַת הַבֹּקֶר
  choice: kurban bakaran pagi
  rationale: עֹלָה adalah kurban yang seluruhnya dibakar di atas mazbah. “Kurban bakaran pagi” mempertahankan istilah kultis dan hubungan waktunya secara ringkas.
theological_decisions:
- issue: Hubungan kurban sajian dengan kurban bakaran pagi
  choice: di samping kurban bakaran pagi
  alternative: terpisah dari kurban bakaran pagi
  rationale: Konteks dan penggunaan מִלְּבַד mendukung makna tambahan, bukan pemisahan yang meniadakan hubungan; kurban sajian dipersembahkan sebagai tindakan tambahan pada kurban bakaran pagi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah ritual “kurban sajian,” “kurban bakaran,” dan “mazbah” dipakai secara konsisten; idiom Ibrani diterjemahkan secara alami dan makna harfiahnya dicatat dalam catatan kaki.
