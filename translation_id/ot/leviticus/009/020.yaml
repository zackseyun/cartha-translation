  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: id
  text: Mereka menaruh bagian-bagian lemak itu di atas bagian dada itu, lalu ia membakar bagian-bagian lemak itu di atas mezbah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “ia membuat bagian-bagian lemak itu menjadi asap di atas mezbah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Mereka menaruh
  rationale: Bentuk jamak dari שׂים berarti menaruh atau meletakkan; “menaruh” alami dalam bahasa Indonesia dan mempertahankan subjek jamak.
- source_word: הַחֲלָבִים
  choice: bagian-bagian lemak itu
  rationale: Bentuk jamak חֲלָבִים dalam konteks kurban menunjuk pada bagian-bagian lemak yang dipisahkan untuk dipersembahkan; bentuk ini mempertahankan kekonkretan dan kejamakannya.
- source_word: עַל הֶחָזוֹת
  choice: di atas bagian-bagian dada
  rationale: חָזֶה dalam tata kurban adalah bagian dada hewan; bentuk jamaknya dipertahankan tanpa memakai “payudara,” yang kurang tepat untuk konteks anatomi kurban dalam bahasa Indonesia.
- source_word: וַיַּקְטֵר
  choice: ia membakar
  rationale: Dalam konteks kurban imamat, קטר berarti membakar persembahan di mezbah sehingga menjadi asap. “Membakar” jelas dan wajar, sedangkan nuansa asap dicatat dalam catatan kaki.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mezbah
  rationale: Akhiran arah pada מִזְבֵּחַ sesudah קטר secara idiomatis menyatakan tempat pembakaran, sehingga diterjemahkan “di atas mezbah.”
theological_decisions:
- issue: Pergantian subjek dari jamak ke tunggal
  choice: “Mereka menaruh … lalu ia membakar”
  alternative: Menyeragamkan kedua subjek sebagai “mereka” atau menyebut nama pelaku
  rationale: Teks Ibrani secara nyata beralih dari verba jamak וַיָּשִׂימוּ ke verba tunggal וַיַּקְטֵר. Terjemahan mempertahankan peralihan tersebut tanpa menentukan identitas pelaku melebihi yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Istilah ritual “mezbah” dipertahankan karena dikenal luas dalam konteks Alkitab. Penanda catatan kaki ditempatkan pada klausa pembakaran yang diterangkannya, bukan pada frasa bagian dada.
