id: LEV.17.5
reference: Leviticus 17:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: id
  text: supaya anak-anak Israel[a] membawa kurban-kurban mereka yang biasa mereka sembelih di padang terbuka, dan membawa kurban-kurban itu kepada Yahweh, ke pintu masuk Kemah Pertemuan, kepada imam, lalu mempersembahkannya sebagai kurban persekutuan[b] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel.” Secara harfiah, “anak-anak lelaki Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban perdamaian” atau “kurban kesejahteraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: supaya
  rationale: Menandai tujuan dari ketetapan pada ayat sebelumnya dengan ungkapan Indonesia yang alami dan tetap mempertahankan hubungan antarayat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Mempertahankan gambaran kekerabatan dalam ungkapan Ibrani tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak dalam arti usia.
- source_word: זִבְחֵיהֶם אֲשֶׁר הֵם זֹבְחִים
  choice: kurban-kurban yang mereka sembelih
  rationale: Menjaga kaitan leksikal dengan tindakan penyembelihan kurban serta nuansa tindakan yang sedang atau lazim mereka lakukan.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: di padang terbuka
  rationale: Menyampaikan idiom lokasi di luar kawasan tempat kudus secara alami, bukan menerjemahkannya secara harfiah sebagai 'di atas muka padang'.
- source_word: וְהֱבִיאֻם
  choice: membawanya
  rationale: Akhiran objek merujuk kembali kepada kurban-kurban itu; bentuk tunggal kolektif 'membawanya' wajar dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: kepada/bagi Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'; preposisi disesuaikan secara idiomatis dengan verba 'membawa' dan 'mempersembahkan'.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pintu Kemah Pertemuan
  rationale: Istilah yang ringkas, jelas, dan lazim untuk lokasi masuk ke tempat kudus tersebut.
- source_word: אֶל הַכֹּהֵן
  choice: kepada imam
  rationale: 'Mempertahankan artikel tertentu Ibrani secara kontekstual: imam yang bertugas di tempat kudus.'
- source_word: וְזָבְחוּ
  choice: lalu mempersembahkannya
  rationale: Dalam konteks imam dan tempat kudus, 'mempersembahkan' menyatakan tindakan kurban dengan alami; 'lalu' memperjelas urutan tanpa menjadikannya perintah mandiri.
- source_word: זִבְחֵי שְׁלָמִים
  choice: kurban persekutuan
  rationale: Menunjuk jenis kurban khusus yang melibatkan perjamuan bersama; catatan kaki mempertahankan alternatif yang menonjolkan damai, keutuhan, atau kesejahteraan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama diri perjanjian secara langsung; 'Yahweh' mempertahankan statusnya sebagai nama, bukan menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang Israel; anak-anak Israel
  rationale: Ungkapan itu menunjuk umat Israel sebagai komunitas perjanjian. Pilihan ini mempertahankan unsur keturunan tanpa membatasi rujukannya pada anak laki-laki atau orang berusia muda.
- issue: Makna זִבְחֵי שְׁלָמִים
  choice: kurban persekutuan
  alternative: kurban perdamaian; kurban kesejahteraan
  rationale: Istilah Ibrani menamai kategori kurban yang nuansanya dapat mencakup damai, keutuhan, kesejahteraan, dan persekutuan. Teks utama memilih istilah yang mudah dipahami, sementara catatan menjaga keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Struktur klausa tujuan dipertahankan karena ayat ini melanjutkan ketetapan pada ayat sebelumnya. Kapitalisasi 'Kemah Pertemuan' dipakai sebagai sebutan khusus tempat kudus.
