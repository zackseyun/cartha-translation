  naturalness: Bahasa draf umumnya baku dan mudah dipahami. "Pintu masuk Kemah Pertemuan" sedikit lebih idiomatis dan eksplisit daripada "pintu Kemah Pertemuan." Pengulangan "membawa" dipertahankan karena memang ada dua verba dalam teks sumber, tetapi objek plural dapat dinyatakan lebih jelas sebagai "kurban-kurban itu."
  terminology: '"Yahweh," "Kemah Pertemuan," dan "imam" tepat. "Kurban persekutuan" dapat dipakai untuk זִבְחֵי שְׁלָמִים, asalkan alternatif leksikal dipertahankan dalam catatan kaki tanpa penjelasan yang terlalu mempersempit arti istilah Ibrani.'
