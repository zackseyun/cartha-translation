review_pass:
  verdict: revise
  source_fidelity: Makna pokok tersampaikan, tetapi "yang mereka ikuti dengan melacurkan diri" tidak secara idiomatis maupun sintaktis menyatakan Ibrani זֹנִים אַחֲרֵיהֶם. Frasa itu berarti bahwa mereka berzina/berlaku sebagai pelacur mengikuti atau terhadap para se'irim tersebut; dalam bahasa Indonesia, "berlaku serong terhadap" lebih jelas mempertahankan metafora dan relasi itu. "roh-roh jahat berbentuk kambing" cukup interpretatif karena bentuk fisiknya tidak dinyatakan secara eksplisit; "roh-roh kambing" lebih dekat dan tetap dapat dijelaskan dalam catatan.
  naturalness: '"Mempersembahkan kurban-kurban" dan "ketetapan tetap ... turun-temurun" dapat dipahami, tetapi pengulangan "kurban-kurban" terasa kurang wajar dalam prosa hukum Indonesia, dan konstruksi "mengikuti dengan melacurkan diri" janggal. "Mempersembahkan kurban kepada ..." serta "ketetapan yang berlaku untuk selama-lamanya ... dari generasi ke generasi" lebih alami dan tetap formal.'
  terminology: '"Kurban" sesuai untuk זבח. "Roh-roh kambing" menerjemahkan istilah yang diperdebatkan tanpa menegaskan secara berlebihan bahwa mereka "berbentuk kambing". Metafora זנה dipertahankan dengan "berlaku serong"; catatan menjelaskan bahwa ini metafora ketidaksetiaan ibadah. Penanda catatan ditempatkan langsung pada unsur yang dijelaskan.'
