  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: id
  text: Mereka tidak boleh lagi mempersembahkan kurban kepada roh-roh kambing[a], yang terhadapnya mereka berlaku serong[b]. Inilah ketetapan yang berlaku untuk selama-lamanya[c] bagi mereka, dari generasi ke generasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "berhala-berhala kambing" atau "makhluk-makhluk seperti kambing". Istilah Ibrani ini secara harfiah berkaitan dengan kambing atau makhluk berbulu; dalam konteks ini tampaknya menunjuk pada objek ibadah terlarang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "yang mereka zinahi/ikuti sebagai pelacur". Ini adalah metafora bagi ketidaksetiaan dalam ibadah atau penyembahan berhala.
    reason: cultural_note
  - marker: c
    text: Atau "ketetapan tetap" atau "ketetapan kekal".
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: mempersembahkan kurban-kurban
  rationale: Bentuk imperfek yang dinegasikan dalam konteks hukum menyatakan larangan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan leksikal dengan זִבְחֵיהֶם.
- source_word: עוֹד
  choice: tidak ... lagi
  rationale: Dalam konteks penghentian praktik yang telah atau sedang berlangsung, bentuk ini paling wajar untuk menyampaikan עוֹד bersama negasi.
- source_word: זִבְחֵיהֶם
  choice: kurban-kurban mereka
  rationale: Menyampaikan nomina kultis זבח secara langsung serta mempertahankan pengulangan dengan verba serumpunnya.
- source_word: לַשְּׂעִירִם
  choice: kepada roh-roh jahat berbentuk kambing
  rationale: Dalam konteks ibadah terlarang, istilah harfiahnya, 'yang berbulu/kambing-kambing', kemungkinan menunjuk pada makhluk gaib yang dibayangkan berwujud kambing, bukan kambing biasa. Pilihan ini jelas tanpa memasukkan mitologi Yunani-Romawi.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: yang mereka ikuti dengan melacurkan diri
  rationale: Mempertahankan metafora seksual tentang ketidaksetiaan religius sekaligus mengungkapkan arah tindakan dalam אַחֲרֵיהֶם secara alami.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan tetap
  rationale: Dalam rumusan hukum, עוֹלָם menyatakan keberlakuan yang terus-menerus. 'Tetap' lebih alami daripada 'kekal' dan tidak memaksakan jangkauan metafisik pada idiom tersebut.
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan Indonesia yang alami dan ringkas untuk keberlakuan di sepanjang generasi-generasi mereka.
theological_decisions:
- issue: Rujukan שְּׂעִירִם dalam ibadah terlarang Israel
  choice: makhluk gaib dengan citra kambing ('roh-roh jahat berbentuk kambing')
  alternative: kambing-kambing; berhala-berhala kambing; satir
  rationale: Konteks persembahan terlarang dan metafora pelacuran religius mendukung rujukan gaib atau idolatrik, bukan hewan biasa. Catatan kaki mempertahankan alternatif leksikal yang sungguh mungkin.
- issue: Daya metafora זֹנִים
  choice: mempertahankan secara eksplisit metafora 'melacurkan diri'
  alternative: berlaku tidak setia; menyembah berhala
  rationale: Bahasa sumber memakai citra ketidaksetiaan seksual bagi ibadah yang menyimpang. Terjemahan tidak meratakannya menjadi penjelasan teologis abstrak.
- issue: Jangkauan חֻקַּת עוֹלָם
  choice: ketetapan tetap
  alternative: ketetapan kekal; ketetapan untuk selama-lamanya
  rationale: Pilihan ini mempertahankan sifat berkelanjutan rumusan hukum tanpa secara diam-diam menentukan perdebatan mengenai cakupan teologis עוֹלָם.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-kultis yang bermartabat. 'Kurban' dipilih sebagai ejaan baku; 'turun-temurun' membuat rumusan penutup alami dan mudah dipahami. Metafora keras bahasa Ibrani tetap dipertahankan, sedangkan alternatif penting dijelaskan dalam catatan kaki.
