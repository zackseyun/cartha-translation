  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: id
  text: Namun, jika ia tidak mencuci pakaiannya dan tidak membasuh tubuhnya[a], ia akan menanggung kesalahannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dagingnya”; dalam konteks ini yang dimaksud ialah tubuhnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “menanggung kedurhakaannya” atau “menanggung hukuman atas kesalahannya”. Ungkapan hukum Ibrani ini dapat mencakup baik kesalahan maupun akibatnya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Kata penghubung ini memperkenalkan keadaan negatif yang berlawanan dengan tata cara pentahiran pada ayat sebelumnya; “Namun, jika” menyatakan hubungan itu secara alami.
- source_word: יְכַבֵּס
  choice: mencuci pakaiannya
  rationale: Bentuk piel dari כבס lazim dipakai untuk mencuci pakaian. Objek “pakaiannya” tidak tertulis dalam ayat ini, tetapi tersirat jelas dari ayat sebelumnya dan dari pemakaian verba tersebut.
- source_word: וּבְשָׂרוֹ לֹא יִרְחָץ
  choice: tidak membasuh tubuhnya
  rationale: בשר secara harfiah berarti “daging”, tetapi dalam konteks pembasuhan ritual menunjuk pada tubuh orang itu. “Membasuh tubuhnya” jelas dan wajar dalam bahasa Indonesia.
- source_word: וְנָשָׂא
  choice: ia harus menanggung
  rationale: Rangkaian waw dengan bentuk qatal menyatakan akibat hukum dari kegagalan melakukan pembasuhan yang diwajibkan. “Harus menanggung” mempertahankan nada hukum tanpa menentukan bentuk akibatnya.
- source_word: עֲוֹנוֹ
  choice: kesalahannya
  rationale: עון dapat mencakup perbuatan salah, keadaan bersalah, dan akibat atau hukuman yang menyertainya. “Kesalahannya” cukup alami dalam bahasa Indonesia dan, bersama verba “menanggung”, tetap mempertahankan keluasan ungkapan hukum Ibrani.
theological_decisions:
- issue: Makna ungkapan hukum וְנָשָׂא עֲוֹנוֹ
  choice: “ia harus menanggung kesalahannya” tanpa menyebutkan hukuman tertentu
  alternative: “ia harus menanggung hukumannya karena kesalahannya” atau “ia harus menanggung kedurhakaannya”
  rationale: Ungkapan Ibrani dapat mencakup baik kesalahan maupun konsekuensi hukumnya. Terjemahan utama mempertahankan ketegangan ini dan catatan kaki menjelaskan keluasan maknanya tanpa memilih satu penafsiran secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Membasuh tubuh” dipilih untuk membedakannya dari mencuci pakaian, sedangkan “menanggung kesalahan” mempertahankan corak hukum dan ambiguitas asli.
