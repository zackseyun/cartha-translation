base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: id
  text: Jika siapa pun dari antara kaum Israel atau dari kalangan pendatang yang tinggal di antara mereka memakan darah apa pun, Aku akan mengarahkan wajah-Ku melawan orang yang memakan darah itu dan akan memutuskan dia dari antara bangsanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “memutuskan dia dari antara bangsanya” menerjemahkan formula hukuman dalam konteks perjanjian. Ayat ini tidak menjelaskan apakah hal itu berarti kematian, pengucilan, atau bentuk penghukuman ilahi lainnya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: Jika siapa pun
  rationale: Pengulangan אִישׁ bersifat distributif dan berarti ‘siapa pun’. Dalam bahasa Indonesia, ‘siapa pun’ menyampaikan cakupan hukum secara alami tanpa perlu mempertahankan maskulin gramatikal Ibrani.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: dari kaum Israel
  rationale: ‘Kaum Israel’ mempertahankan pengertian kolektif dan perjanjian dari ‘rumah Israel’, tetapi lebih wajar dalam bahasa Indonesia modern.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: atau dari kalangan pendatang yang tinggal di tengah-tengah mereka
  rationale: גֵּר menunjuk kepada orang bukan pribumi yang menetap dalam masyarakat Israel, bukan sekadar pengunjung. ‘Pendatang yang tinggal’ juga mencerminkan hubungan kata antara nomina dan partisipiumnya.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: memakan darah apa pun
  rationale: ‘Memakan’ menerjemahkan kata kerja biasa אָכַל secara langsung, sedangkan ‘darah apa pun’ mempertahankan cakupan menyeluruh dari כָּל דָּם.
- source_word: וְנָתַתִּי פָנַי בַּנֶּפֶשׁ
  choice: Aku akan menghadapkan wajah-Ku terhadap orang
  rationale: Ungkapan antropomorfis ‘menghadapkan wajah’ dipertahankan sebagai gambaran perlawanan dan penghukuman ilahi; נֶפֶשׁ dalam konteks hukum ini berarti individu atau orang.
- source_word: וְהִכְרַתִּי אֹתָהּ מִקֶּרֶב עַמָּהּ
  choice: dan melenyapkannya dari tengah-tengah bangsanya
  rationale: ‘Melenyapkan dari tengah-tengah’ mempertahankan gagasan eksisi dari kelompok tanpa menentukan mekanismenya. Bentuk ‘-nya’ secara alami merujuk kembali kepada orang tersebut.
theological_decisions:
- issue: Makna formula hukuman וְהִכְרַתִּי (‘Aku akan melenyapkan/memutuskan’)
  choice: Menerjemahkannya ‘melenyapkannya dari tengah-tengah bangsanya’ tanpa menetapkan cara pelaksanaannya.
  alternative: ‘menghukumnya mati’, ‘mengucilkannya’, atau ‘memusnahkannya melalui hukuman ilahi’
  rationale: Ayat ini menyatakan hukuman perjanjian yang berat, tetapi tidak menjelaskan apakah bentuknya kematian, pengusiran, atau tindakan penghukuman ilahi lainnya. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur hukum dibuat alami dengan ‘Jika siapa pun’, sementara idiom wajah ilahi dan ketidakpastian formula hukuman tetap dipertahankan.
