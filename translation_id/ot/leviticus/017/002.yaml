  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: id
  text: Berbicaralah kepada Harun, kepada anak-anak laki-lakinya, dan kepada seluruh bani Israel[a], lalu katakanlah kepada mereka, “Inilah hal[b] yang Yahweh perintahkan:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh orang Israel”; secara harfiah, “seluruh putra-putra Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “perkara” atau “perkataan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Imperatif piel orang kedua tunggal ini merupakan perintah langsung kepada Musa. Bentuk “Berbicaralah” mempertahankan daya perintah dan cocok dengan rumusan pembuka wacana.
- source_word: בָּנָיו
  choice: anak-anak laki-lakinya
  rationale: Bentuk maskulin jamak dengan sufiks orang ketiga tunggal maskulin secara khusus menunjuk kepada putra-putra Harun dalam konteks keimaman; terjemahan ini tidak memperluasnya menjadi semua anak.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: seluruh bani Israel
  rationale: Ungkapan ini secara harfiah bersifat kekeluargaan, tetapi juga berfungsi sebagai sebutan etnis bagi umat Israel. “Seluruh bani Israel” mempertahankan bentuk tradisional yang masih dipahami dalam bahasa Indonesia.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: lalu katakanlah kepada mereka
  rationale: Bentuk ini meneruskan rangkaian perintah secara wajar dalam bahasa Indonesia. “Lalu” menyampaikan kesinambungan waw Ibrani tanpa mengaburkan bahwa Musa tetap menjadi pihak yang diperintah.
- source_word: זֶה הַדָּבָר
  choice: Inilah hal
  rationale: דָּבָר dapat berarti perkataan, perkara, atau hal. Dalam rumusan yang memperkenalkan ketetapan berikutnya, “hal” terdengar alami dan tetap cukup luas untuk mempertahankan rentang maknanya.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk perfektif dari צוה menyatakan perintah ilahi yang telah diberikan dan kini akan disampaikan. Pasif bahasa Indonesia membuat Yahweh tetap tampil alami sebagai pelaku sesudah verba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif ini memperkenalkan isi ucapan atau perintah yang menyusul. Dalam bahasa Indonesia modern, fungsi tersebut paling alami dinyatakan dengan tanda titik dua, terutama karena isi perintah berlanjut pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Ungkapan kekeluargaan בְּנֵי יִשְׂרָאֵל
  choice: seluruh bani Israel
  alternative: seluruh orang Israel
  rationale: Pilihan utama mempertahankan citra keturunan dalam ungkapan Ibrani sekaligus berfungsi sebagai sebutan kolektif. Catatan kaki menyediakan padanan etnis yang lebih langsung.
- issue: Hubungan לֵאמֹר dengan isi perintah pada ayat berikutnya
  choice: dinyatakan dengan titik dua
  alternative: dengan berfirman atau demikianlah firman-Nya
  rationale: Titik dua menjaga fungsi pengantar tanpa menambahkan subjek, kepemilikan, atau nuansa teologis yang tidak dinyatakan secara eksplisit oleh bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “kepada” dipertahankan agar susunan tiga kelompok penerima tetap jelas. Tanda titik dua menandai bahwa perintah ilahi berlanjut ke ayat berikutnya.
