source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: id
  text: Setiap orang yang memakan bangkai atau hewan yang diterkam binatang buas, baik orang Israel asli maupun pendatang yang menetap[a], harus mencuci pakaiannya dan membasuh diri dengan air; ia najis sampai petang, lalu tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang asing yang tinggal di antara mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: orang
  rationale: Dalam konteks hukum, kata ini menunjuk pada seorang individu, bukan jiwa sebagai unsur nonjasmani.
- source_word: נְבֵלָה
  choice: bangkai
  rationale: Istilah ini menunjuk pada tubuh hewan yang mati tanpa penyembelihan yang semestinya; 'bangkai' merupakan padanan Indonesia yang alami dan tepat.
- source_word: טְרֵפָה
  choice: hewan yang diterkam binatang buas
  rationale: Kata ini menunjuk pada hewan yang dicabik atau diterkam pemangsa; frasa ini menyatakan penyebab kematiannya dengan jelas.
- source_word: אֶזְרָח
  choice: orang Israel asli
  rationale: Dalam tatanan hukum Israel, istilah ini menunjuk pada anggota asli masyarakat Israel. Penambahan 'Israel' memperjelas acuan yang tersirat dalam konteks.
- source_word: גֵּר
  choice: pendatang yang menetap
  rationale: Istilah ini menunjuk pada orang luar yang tinggal di tengah Israel, bukan pelancong sementara.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Bentuk verbal dalam ketentuan hukum menyatakan tindakan yang diwajibkan; 'pakaian' alami dalam bahasa Indonesia modern.
- source_word: וְרָחַץ בַּמַּיִם
  choice: membasuh tubuhnya dengan air
  rationale: Konteksnya adalah pembasuhan badan secara ritual; objek refleksif dibuat eksplisit agar alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: Ia menjadi najis sampai petang
  rationale: '''Najis'' mempertahankan kategori kenajisan ritual, sedangkan ''sampai petang'' menyatakan batas waktunya.'
- source_word: וְטָהֵר
  choice: sesudah itu ia menjadi tahir
  rationale: '''Tahir'' adalah pasangan baku ''najis'' dalam konteks kemurnian ritual; ''sesudah itu'' memperjelas urutan tanpa mengubah isi.'
theological_decisions:
- issue: Sifat kenajisan dalam hukum kemurnian Imamat
  choice: Menerjemahkan טָמֵא/טָהֵר sebagai 'najis/tahir' dalam arti status ritual.
  alternative: '''tercemar/disucikan'' atau bahasa yang menyiratkan kesalahan moral'
  rationale: Ayat ini mengatur status ritual setelah memakan bangkai atau hewan yang diterkam. Padanan 'najis/tahir' mempertahankan kategori kultis dan tidak menyamakan status itu secara otomatis dengan kebobrokan moral.
- issue: Hubungan pembasuhan, waktu petang, dan pemulihan status
  choice: Mempertahankan urutan bahwa orang itu membasuh diri, tetap najis sampai petang, lalu menjadi tahir.
  alternative: Mengatakan bahwa pembasuhan saja langsung menahirkan
  rationale: Rangkaian klausa Ibrani menempatkan berakhirnya masa kenajisan setelah batas waktu petang; terjemahan tidak boleh menghapus ketegangan antara tindakan pembasuhan dan penantian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami untuk pembaca umum sambil mempertahankan corak hukum ritual. 'Najis/tahir' dipilih karena merupakan istilah Indonesia yang dikenal luas dan tepat bagi kategori kemurnian dalam Imamat.
