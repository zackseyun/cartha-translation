lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר memperkenalkan peristiwa tutur baru. Dalam konteks firman ilahi, “berfirman” merupakan padanan bahasa Indonesia yang alami, ringkas, dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang dituju dalam tindakan berbicara; “kepada” adalah padanan Indonesia yang wajar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam rumusan Ibrani ini, לֵאמֹר mengantar isi perkataan yang menyusul. Bahasa Indonesia modern dapat menyatakannya secara alami dengan tanda koma setelah “berfirman kepada Musa”, tanpa pengulangan kaku seperti “demikian” atau “katanya”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama ilahi tersebut, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehuwa” mencerminkan pelafalan tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Ungkapan “berfirman kepada Musa” mempertahankan corak formula wahyu ilahi tanpa menghasilkan susunan yang kaku.
