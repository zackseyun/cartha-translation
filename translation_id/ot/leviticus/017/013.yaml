source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: id
  text: Setiap orang dari antara keturunan Israel atau dari antara pendatang yang tinggal di tengah-tengah mereka, yang berburu binatang liar atau burung yang boleh dimakan, harus mencurahkan darah binatang atau burung itu lalu menutupinya dengan tanah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “-nya” dalam “menutupinya” paling wajar merujuk kepada darah yang baru disebut. Kata Ibrani yang diterjemahkan “tanah” juga dapat berarti “debu” atau “tanah gembur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: setiap orang
  rationale: Pengulangan kata benda Ibrani menyatakan makna distributif. Dalam bahasa Indonesia, 'setiap orang' menyampaikannya secara wajar tanpa menghilangkan cakupan perorangan.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: dari antara keturunan Israel
  rationale: Pilihan ini mempertahankan gambaran kekerabatan dalam בְּנֵי יִשְׂרָאֵל sekaligus terdengar alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: pendatang yang tinggal di tengah-tengah mereka
  rationale: גֵּר menunjuk kepada orang non-Israel yang menetap dalam komunitas. 'Pendatang' menghindari konotasi negatif 'orang asing', sedangkan 'yang tinggal' mencerminkan verba serumpunnya secara alami.
- source_word: יָצוּד צֵיד
  choice: berburu
  rationale: Konstruksi verba-kata benda serumpun ini secara idiomatis berarti melakukan perburuan. Objek buruannya dinyatakan oleh frasa berikutnya.
- source_word: חַיָּה אוֹ עוֹף
  choice: binatang liar atau burung
  rationale: Dalam konteks berburu, חַיָּה mengacu pada satwa liar, bukan binatang secara umum; עוֹף secara alami diterjemahkan 'burung'.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: yang boleh dimakan
  rationale: Bentuk pasif Niphal dalam konteks hukum makanan paling tepat menyatakan bahwa binatang atau burung itu diizinkan atau layak dimakan.
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: harus mencurahkan darahnya
  rationale: Dalam konteks hukum, bentuk verba ini bersifat preskriptif. 'Harus' merupakan ungkapan kewajiban yang jelas dalam bahasa Indonesia, dan pronomina '-nya' merujuk pada hewan buruan.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: lalu menutupinya dengan tanah
  rationale: Pronomina objek paling wajar merujuk kepada darah yang baru disebut. עָפָר dapat berarti debu atau tanah gembur; 'tanah' paling alami untuk tindakan menutupi darah di sini.
theological_decisions:
- issue: Acuan pronomina objek dalam וְכִסָּהוּ
  choice: darah itu harus ditutupi
  alternative: hewan itu harus ditutupi atau dikubur
  rationale: Anteseden terdekat dan paling wajar ialah 'darahnya'. Terjemahan mempertahankan acuan ini tanpa menambahkan penjelasan teologis yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang jelas. 'Keturunan Israel' mempertahankan unsur kekerabatan; 'pendatang yang tinggal' menjelaskan kategori sosial גֵּר tanpa memakai istilah imigrasi modern. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
