  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: id
  text: Sebab nyawa makhluk berdaging ada di dalam darah, dan Aku telah memberikan darah itu kepadamu di atas mazbah untuk mengadakan pendamaian bagi nyawamu.[a] Sebab darahlah yang mengadakan pendamaian melalui nyawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani nefesh dapat berarti “nyawa,” “hidup,” “diri,” atau “orang,” sesuai konteks. Dalam ayat ini, maksudnya adalah nyawa atau hidup.
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibraninya juga dapat dipahami, “darah mengadakan pendamaian melalui nyawa yang ada di dalamnya,” atau “karena nyawa.”
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Dalam hukum kurban ini, kata tersebut menunjuk pada hidup yang menjiwai makhluk, bukan secara khusus pada jiwa yang terpisah dari tubuh. “Nyawa” mempertahankan kaitan langsung antara hidup dan darah pada ketiga pemakaiannya dalam ayat ini.
- source_word: הַבָּשָׂר
  choice: makhluk
  rationale: Secara harfiah berarti “daging,” tetapi dalam frasa ini menunjuk pada makhluk yang hidup sebagai makhluk berdaging. “Nyawa makhluk” lebih alami dalam bahasa Indonesia daripada “nyawa daging” tanpa mengubah acuannya menjadi tubuh abstrak.
- source_word: בַּדָּם
  choice: di dalam darah
  rationale: 'Preposisi ב dengan kata sandang menyatakan tempat atau ranah: nyawa makhluk berada di dalam darah.'
- source_word: נְתַתִּיו לָכֶם
  choice: Aku telah memberikan darah itu kepadamu
  rationale: Akhiran objek tunggal mengacu pada darah. Menyebut ulang “darah itu” menghindari ketidakjelasan pronomina dalam bahasa Indonesia, sedangkan bentuk “telah memberikan” menyatakan tindakan ilahi yang tetap berlaku bagi ketentuan ini.
- source_word: עַל הַמִּזְבֵּחַ
  choice: di atas mazbah
  rationale: Mempertahankan lokasi tindakan kurban dan memakai istilah kultis Indonesia yang mapan.
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: Mengungkapkan fungsi kultis כפר tanpa menetapkan satu teori khusus mengenai cara kerja pendamaian.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: bagi nyawamu
  rationale: Mempertahankan hubungan leksikal dengan נֶפֶשׁ sebelumnya dan menyampaikan bahwa pendamaian itu berkenaan dengan hidup umat.
- source_word: כִּי הַדָּם הוּא
  choice: Sebab darahlah
  rationale: “Sebab” mempertahankan fungsi penjelas כִּי, sedangkan partikel -lah menyampaikan penekanan pada darah.
- source_word: בַּנֶּפֶשׁ
  choice: melalui nyawa
  rationale: Frasa Ibrani ini ringkas dan dapat dipahami secara instrumental atau sebagai menunjuk pada nyawa yang berada dalam darah. “Melalui nyawa” mempertahankan hubungan sarana tanpa menambahkan kata “di dalamnya” ke teks utama.
- source_word: יְכַפֵּר
  choice: mengadakan pendamaian
  rationale: Menjaga konsistensi dengan לְכַפֵּר sebelumnya dan mempertahankan istilah kultis utama ayat ini.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam hukum kurban
  choice: Diterjemahkan “nyawa” secara konsisten.
  alternative: jiwa; hidup; diri/orang
  rationale: Ayat ini mendasarkan fungsi darah pada nyawa yang berkaitan dengannya. “Jiwa” dapat menyiratkan pemisahan antropologis yang tidak dinyatakan teks, sedangkan “nyawa” paling jelas mempertahankan logika darah dan hidup.
- issue: Daya preposisi ב dalam בַּנֶּפֶשׁ
  choice: Diterjemahkan “melalui nyawa” dan ambiguitasnya dijelaskan dalam catatan kaki.
  alternative: karena nyawa; dengan nyawa; melalui nyawa yang ada di dalamnya
  rationale: Teks Ibrani tidak sepenuhnya menentukan apakah nyawa dipandang sebagai sarana, dasar, atau nyawa yang terkandung dalam darah. Terjemahan utama tetap ringkas dan tidak memaksakan satu penjelasan teologis yang lebih sempit.
- issue: Acuan sufiks objek pada נְתַתִּיו
  choice: Dinyatakan secara eksplisit sebagai “darah itu.”
  alternative: memberikannya
  rationale: Bentuk maskulin tunggal paling wajar mengacu pada הַדָּם, “darah.” Penyebutan eksplisit memperjelas tata bahasa Indonesia tanpa mengubah substansi ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mazbah” dipertahankan sebagai istilah kultis yang mapan. Bentuk tunggal “-mu” mengikuti sapaan kolektif Ibrani kepada umat, sedangkan susunan kalimat dibuat alami tanpa menghilangkan pengulangan teologis antara darah, nyawa, dan pendamaian.
