source:
  edition: WLC
  text: אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל אֲשֶׁ֨ר יִשְׁחַ֜ט שׁ֥וֹר אוֹ כֶ֛שֶׂב אוֹ עֵ֖ז בַּֽ/מַּחֲנֶ֑ה א֚וֹ אֲשֶׁ֣ר יִשְׁחַ֔ט מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: id
  text: Setiap laki-laki[a] dari kaum Israel yang menyembelih seekor lembu, seekor domba, atau seekor kambing di dalam perkemahan, atau yang menyembelihnya di luar perkemahan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “laki-laki, laki-laki”; pengulangan ini bersifat distributif dan berarti setiap laki-laki dalam masyarakat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Setiap laki-laki
  rationale: Pengulangan nomina ini merupakan ungkapan distributif, yakni ‘setiap laki-laki’ atau ‘laki-laki mana pun’. Terjemahan ini mempertahankan bentuk maskulin dan daya distributif teks Ibrani.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: dari kaum Israel
  rationale: Ungkapan harfiahnya ialah ‘dari rumah Israel’. ‘Kaum Israel’ mempertahankan makna kesatuan umat atau bangsa perjanjian dalam bahasa Indonesia yang alami.
- source_word: יִשְׁחַט
  choice: menyembelih
  rationale: Kata kerja ini secara khusus menunjuk pada penyembelihan hewan dan sesuai dengan konteks hukum persembahan.
- source_word: שׁוֹר
  choice: seekor lembu
  rationale: Istilah ini menunjuk pada seekor hewan dari jenis sapi tanpa harus dibatasi pada lembu jantan; ‘lembu’ sesuai dengan ragam bahasa hukum kurban.
- source_word: כֶשֶׂב
  choice: seekor domba
  rationale: Kata ini menunjuk secara umum pada domba dan tidak mesti berarti anak domba.
- source_word: עֵז
  choice: seekor kambing
  rationale: Padanan langsung dan lazim bagi nama hewan tersebut.
- source_word: בַּמַּחֲנֶה
  choice: di dalam perkemahan
  rationale: Padanan lokatif yang alami dan jelas untuk tempat tinggal bersama bangsa Israel.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Menyatakan lokasi penyembelihan di luar batas perkemahan secara jelas dan idiomatis.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: yang ... atau yang
  rationale: Mempertahankan kesejajaran kedua klausa relatif dalam rumusan hukum Ibrani.
- source_word: '[objek tersirat sesudah יִשְׁחַט yang kedua]'
  choice: menyembelihnya
  rationale: Akhiran ‘-nya’ memperjelas bahwa objek penyembelihan kedua tetap salah satu hewan yang baru disebutkan, tanpa menambahkan informasi baru.
theological_decisions: []
