  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kaum Israel’ dipilih sebagai padanan alami bagi idiom kebangsaan-perjanjian ‘rumah Israel’, sedangkan tanda pisah pada akhir ayat mempertahankan kalimat hukum yang berlanjut ke ayat berikutnya.
