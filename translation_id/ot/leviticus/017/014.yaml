source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: id
  text: Sebab nyawa setiap makhluk ada dalam darahnya; darah itu adalah nyawanya.[a] Karena itu Aku berfirman kepada umat Israel, “Janganlah kamu memakan darah makhluk apa pun, sebab nyawa setiap makhluk ada dalam darahnya.” Siapa pun yang memakannya akan disingkirkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini secara lebih harfiah dapat diterjemahkan, “darahnya ada dalam nyawanya.” Frasa ini juga dapat dipahami, “darahnya adalah nyawanya.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “akan disingkirkan” tidak menjelaskan di sini apakah yang dimaksud ialah hukuman mati, pengucilan dari umat, atau penghukuman oleh Allah.
    reason: theological_ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Dalam konteks larangan mengenai darah, kata ini menunjuk pada daya hidup makhluk, bukan secara khusus pada jiwa tak berwujud. “Nyawa” menyampaikan kaitan konkret antara hidup dan darah.
- source_word: כָּל בָּשָׂר
  choice: setiap makhluk
  rationale: Secara harfiah ungkapan ini berarti “segala daging,” tetapi dalam konteks ini mengacu pada setiap makhluk bertubuh yang memiliki darah. “Setiap makhluk” lebih alami dalam bahasa Indonesia dan tetap cocok dalam kedua pengulangan.
- source_word: דָּם / דָּמוֹ
  choice: darah / darahnya
  rationale: Diterjemahkan secara langsung karena darah merupakan pokok larangan dan dasar penjelasannya.
- source_word: בְנַפְשׁוֹ הוּא
  choice: darahnya itulah nyawanya
  rationale: Frasa Ibrani ini padat dan dapat dipahami sebagai penyamaan darah dengan nyawa atau sebagai pernyataan bahwa darah berada dalam atau terikat dengan nyawa. Teks utama memakai bentuk Indonesia yang alami, sedangkan ambiguitasnya dicatat dalam catatan kaki.
- source_word: וָאֹמַר
  choice: Karena itu Aku berfirman
  rationale: Kata penghubung meneruskan alasan sebelumnya menuju perintah. “Karena itu” menyatakan hubungan logis tersebut, dan “berfirman” sesuai dengan register perkataan ilahi dalam konteks hukum Taurat.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada umat Israel
  rationale: Ungkapan harfiahnya “kepada anak-anak lelaki Israel,” tetapi secara idiomatis menunjuk kepada bangsa atau umat Israel secara keseluruhan.
- source_word: לֹא תֹאכֵלוּ
  choice: Janganlah kamu memakan
  rationale: Bentuk ini menyampaikan larangan langsung dengan register hukum yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: כָּל אֹכְלָיו
  choice: Siapa pun yang memakannya
  rationale: Partisip dengan sufiks menyatakan setiap orang yang memakan darah yang sedang dibicarakan; bentuk ini mempertahankan sifat distributifnya.
- source_word: יִכָּרֵת
  choice: akan disingkirkan
  rationale: Pilihan ini mempertahankan rumusan sanksi perjanjian tanpa menentukan apakah pelaksanaannya berupa hukuman mati, pengucilan dari komunitas, atau penghukuman langsung oleh Allah.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam hubungannya dengan darah
  choice: Diterjemahkan “nyawa,” sehingga darah dinyatakan sebagai sesuatu yang identik atau terikat erat dengan hidup makhluk.
  alternative: “jiwa” dalam arti metafisik, atau “hidup” sebagai konsep yang lebih abstrak
  rationale: Ayat ini mendasarkan larangan memakan darah pada hubungan darah dengan daya hidup makhluk. “Nyawa” menjaga logika konkret tersebut tanpa memasukkan antropologi metafisik yang tidak dinyatakan oleh ayat.
- issue: Hubungan sintaksis דָּמוֹ בְנַפְשׁוֹ הוּא
  choice: Teks utama berbunyi “darahnya itulah nyawanya,” dengan alternatif yang lebih harfiah dicatat.
  alternative: “darahnya ada dalam nyawanya” atau “darahnya menyatu dengan nyawanya”
  rationale: Bahasa Ibrani memungkinkan lebih dari satu pemahaman terhadap preposisi בְּ. Terjemahan utama dibuat alami, tetapi catatan kaki mempertahankan ambiguitas asli.
- issue: Arti sanksi יִכָּרֵת
  choice: Dibiarkan sebagai “akan disingkirkan.”
  alternative: “akan dihukum mati,” “akan dikucilkan,” atau “akan dilenyapkan”
  rationale: Rumusan Ibrani tidak menjelaskan dalam ayat ini mekanisme sanksinya. Terjemahan tidak menentukan salah satu tafsiran yang diperdebatkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang bermartabat. “Umat Israel” dipilih daripada bentuk harfiah “anak-anak lelaki Israel” agar alami dan mencakup komunitas yang dituju. Pengulangan “nyawa setiap makhluk adalah darahnya” dipertahankan untuk mengikuti struktur retoris Ibrani.
