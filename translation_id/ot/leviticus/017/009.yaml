reference: Leviticus 17:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: id
  text: dan tidak membawanya ke pintu masuk Kemah Pertemuan untuk mempersembahkannya kepada Yahweh[a], laki-laki itu harus dilenyapkan dari antara bangsanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “untuk melakukan atau membuatnya bagi Yahweh”; dalam konteks ini, ungkapan Ibrani tersebut mengacu pada mempersembahkan kurban.
    reason: lexical_alternative
  - marker: b
    text: “Dilenyapkan” adalah rumusan hukum yang bentuk hukumannya tidak dijelaskan secara khusus di sini; ungkapan ini dapat menunjuk pada penyingkiran dari umat perjanjian atau penghukuman langsung oleh Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: pintu masuk
  rationale: Menunjuk pada bukaan atau jalan masuk; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks tempat kudus.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Sebutan baku dan transparan bagi kemah suci tempat pertemuan dalam konteks perjalanan Israel di padang gurun.
- source_word: יְבִיאֶנּוּ
  choice: membawanya
  rationale: Akhiran pronominal merujuk pada hewan kurban dalam konteks sebelumnya; terjemahan ini mempertahankan tindakan konkret tanpa menambahkan penafsiran ritual.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: untuk mempersembahkannya kepada Yahweh
  rationale: Secara harfiah berarti 'untuk melakukan/membuatnya bagi Yahweh', tetapi dalam konteks kurban עשה merupakan ungkapan yang mengacu pada pelaksanaan atau persembahan kurban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וְנִכְרַת
  choice: harus dilenyapkan
  rationale: Bentuk hukum ini menyatakan bahwa pelanggar 'diputuskan' dari umatnya. 'Dilenyapkan' mempertahankan bobot hukuman tanpa menentukan mekanismenya sebagai hukuman mati, pengucilan, atau tindakan ilahi.
- source_word: הָאִישׁ הַהוּא
  choice: orang itu
  rationale: Dalam bahasa hukum Indonesia, 'orang itu' menunjuk secara jelas kepada individu pelanggar dan lebih alami daripada 'laki-laki itu'; konteks tidak mengharuskan penekanan jenis kelamin biologis.
- source_word: מֵעַמָּיו
  choice: dari antara bangsanya
  rationale: Mengungkapkan pemisahan individu dari lingkungan umat atau komunitas perjanjiannya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna hukuman וְנִכְרַת ('diputuskan/dilenyapkan')
  choice: Memakai 'harus dilenyapkan dari antara bangsanya' tanpa menentukan cara pelaksanaan hukumannya.
  alternative: harus dihukum mati; harus dikucilkan dari umat; harus dibinasakan
  rationale: Rumus hukum Ibrani ini tidak menjelaskan di sini apakah akibatnya berupa kematian, pengucilan, ketiadaan keturunan, atau penghukuman langsung oleh Allah. Terjemahan mempertahankan ketegangan itu.
- issue: Pengungkapan הָאִישׁ הַהוּא
  choice: orang itu
  alternative: laki-laki itu; orang tersebut
  rationale: Nomina Ibrani berbentuk maskulin tunggal, tetapi dalam rumusan hukum ini menunjuk kepada pelanggar sebagai individu. 'Orang itu' mempertahankan acuan tunggal tanpa menambahkan penekanan gender yang tidak diperlukan oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat mempertahankan kesinambungan dengan ayat sebelumnya melalui pembuka 'dan'. Istilah ritual dibuat jelas tanpa menghapus arti harfiah yang dicatat dalam catatan kaki.
