  source_fidelity: 'Makna pokok diterjemahkan dengan setia: imam melakukan aplikasi ritual darah pada mezbah Yahweh, membakar lemak, dan tindakan itu diarahkan bagi Yahweh. Namun, “di depan pintu” dapat berarti berada di hadapan pintu, sedangkan פֶּתַח menunjuk pintu masuk/bukaan; “di pintu masuk” lebih tepat. “Lemaknya” juga menambahkan relasi posesif yang tidak dinyatakan secara eksplisit; “lemak itu” mempertahankan ketakrifan Ibrani.'
