  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: id
  text: Lalu imam harus menyiramkan darah itu pada mezbah Yahweh di pintu masuk Kemah Pertemuan,[a] dan membakar lemak itu sebagai aroma yang menyenangkan bagi Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai menunjuk pada tindakan ritual imam mengaplikasikan darah ke mezbah; dapat juga diterjemahkan “memercikkan” atau “menghamburkan darah itu pada mezbah.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebagai aroma yang menyenangkan bagi Yahweh”; secara tradisional juga diterjemahkan “sebagai aroma yang menenangkan” atau “sebagai bau harum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: Lalu ... harus menyiramkan
  rationale: Dalam konteks kurban, זָרַק menunjuk pada tindakan ritual imam mengaplikasikan darah dengan mengayunkan atau memercikkannya ke mezbah. 'Menyiramkan' cukup alami dalam bahasa Indonesia dan menyampaikan tindakan yang lebih kuat daripada sekadar percikan ringan.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku untuk כֹּהֵן dalam konteks keimaman Israel; ketakrifan sudah jelas dari konteks.
- source_word: הַדָּם
  choice: darah itu
  rationale: Objek tertentu yang merujuk pada darah hewan kurban yang baru disebut dalam konteks.
- source_word: עַל מִזְבַּח יְהוָה
  choice: pada mezbah Yahweh
  rationale: Dengan זָרַק, עַל dapat berarti ke atas atau mengenai mezbah. 'Pada' mempertahankan cakupan relasionalnya secara alami, sementara catatan kaki menjelaskan gerak ritual tersebut.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di depan pintu Kemah Pertemuan
  rationale: פֶּתַח adalah bukaan atau pintu masuk. Ungkapan ini secara alami menunjukkan lokasi mezbah di area pintu masuk Kemah Pertemuan.
- source_word: וְהִקְטִיר
  choice: dan membakar
  rationale: Dalam bahasa kurban imamat, bentuk ini berarti membakar bagian persembahan di mezbah sehingga asapnya naik. 'Membakar' merupakan padanan Indonesia yang jelas dan ringkas.
- source_word: הַחֵלֶב
  choice: lemaknya
  rationale: חֵלֶב merujuk pada bagian-bagian lemak khusus dari hewan kurban yang dibakar di mezbah; bentuk posesif menghubungkannya secara alami dengan hewan kurban.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Ungkapan baku kurban ini menggambarkan aroma persembahan sebagai berkenan atau menyenangkan bagi Allah, tanpa mengharuskan makna bahwa Allah perlu ditenangkan.
- source_word: יְהוָה / לַיהוָה
  choice: Yahweh / bagi Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi 'Yahweh'; לְ pada frasa terakhir menyatakan arah atau penerima persembahan dan secara alami diterjemahkan 'bagi'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Makna רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan bagi Yahweh
  alternative: aroma yang menenangkan Yahweh
  rationale: נִיחֹחַ dalam rumusan kurban dapat menyatakan aroma yang diterima dengan senang. Pilihan ini mempertahankan citra antropomorfis teks tanpa menambahkan gagasan teologis bahwa kurban meredakan emosi Allah.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Istilah liturgis baku 'imam', 'mezbah', dan 'Kemah Pertemuan' dipertahankan. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
