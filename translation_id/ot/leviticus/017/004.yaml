  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: id
  text: 'tetapi tidak membawanya ke pintu masuk Kemah Pertemuan untuk mempersembahkannya sebagai persembahan kepada Yahweh di hadapan Kemah Suci Yahweh, darah akan diperhitungkan kepada orang itu[a]: ia telah menumpahkan darah, dan orang itu akan diputuskan dari antara bangsanya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darah akan diperhitungkan kepada orang itu.” Ungkapan ini menyatakan bahwa ia dianggap bertanggung jawab atas penumpahan darah.
    reason: lexical_alternative
  - marker: b
    text: Teks ini tidak menjelaskan apakah “diputuskan” berarti dihukum mati, dikeluarkan dari komunitas, atau dikenai bentuk penyingkiran lain dari bangsanya.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pintu masuk Kemah Pertemuan
  rationale: פֶּתַח menunjuk pada pintu atau jalan masuk, sedangkan אֹהֶל מוֹעֵד adalah sebutan baku bagi tempat pertemuan kudus. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הֱבִיאוֹ
  choice: membawanya
  rationale: Bentuk Hifil dari בוא berarti membawa; akhiran objeknya merujuk pada hewan yang disembelih dalam ayat sebelumnya.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: untuk mempersembahkannya sebagai persembahan
  rationale: הקריב dalam konteks kurban berarti membawa dekat atau mempersembahkan, sedangkan קָרְבָּן berarti persembahan. Rumusan ini mempertahankan kedua unsur tanpa pengulangan yang terlalu kaku.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, sehingga nama diri dalam teks Ibrani tetap tampak.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: di hadapan Kemah Suci Yahweh
  rationale: לִפְנֵי berarti di hadapan atau di depan. מִשְׁכָּן adalah tempat kediaman kudus; 'Kemah Suci' merupakan padanan yang alami dan membedakannya dari Kemah Pertemuan tanpa mengaburkan rujukan kepada tempat ibadah yang sama.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: darah akan diperhitungkan kepada orang itu
  rationale: Terjemahan ini mempertahankan ungkapan hukum Ibrani secara dekat dan membiarkan klausa berikutnya menjelaskan bahwa orang tersebut dipandang bertanggung jawab atas penumpahan darah.
- source_word: דָּם שָׁפָךְ
  choice: Ia telah menumpahkan darah
  rationale: Ini adalah ungkapan langsung dan lazim untuk tindakan penumpahan darah, dengan daya hukum dan moral yang sama seperti sumbernya.
- source_word: וְנִכְרַת ... מִקֶּרֶב עַמּוֹ
  choice: akan disingkirkan dari tengah-tengah bangsanya
  rationale: Pilihan ini menyampaikan pengeluaran dari komunitas umat tanpa menetapkan bahwa caranya pasti hukuman mati, pengusiran, atau bentuk hukuman tertentu lainnya.
theological_decisions:
- issue: Makna ungkapan hukum דָּם יֵחָשֵׁב
  choice: darah akan diperhitungkan kepada orang itu
  alternative: orang itu akan dianggap berutang darah
  rationale: Bentuk yang dipilih lebih dekat dengan susunan Ibrani dan menjaga metafora darah, sementara catatan kaki menjelaskan bahwa ungkapan itu menyatakan pertanggungjawaban atas penumpahan darah.
- issue: Sifat hukuman וְנִכְרַת
  choice: akan disingkirkan
  alternative: akan dihukum mati; akan dikeluarkan
  rationale: Ayat ini tidak menjelaskan mekanisme penyingkiran tersebut. Karena itu, terjemahan tidak mempersempitnya menjadi hukuman mati ataupun pengusiran semata.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Ayat dipertahankan sebagai kelanjutan kalimat bersyarat dari ayat sebelumnya. Istilah tempat ibadah ditulis sebagai nama/sebutan khusus, dan ambiguitas hukuman hukum-perjanjian tidak diselesaikan secara denominatif.
