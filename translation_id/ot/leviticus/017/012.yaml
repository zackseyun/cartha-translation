  verdict: revise
  source_fidelity: Teks menangkap daya simpulan עַל־כֵּן, larangan hukum atas makan darah, dan pengulangan larangan bagi הַגֵּר. Namun, אָמַרְתִּי adalah bentuk perfektif (“Aku telah berfirman/berkata”), sehingga “Aku berkata” kurang tepat dalam bahasa Indonesia modern. Istilah “pendatang” dapat mengacu pada orang yang baru datang dan tidak dengan jelas menyampaikan status penduduk non-Israel yang menetap dalam konteks hukum ini.
  naturalness: Susunan kalimatnya jelas dan register hukumnya baik. “Tidak seorang pun di antara kamu” lebih idiomatis daripada “Tidak seorang pun dari antara kamu.” “Orang asing yang menetap” lebih jelas dan alami dalam konteks ini daripada “pendatang yang tinggal.”
  terminology: “Anak-anak Israel” dapat dipertahankan sebagai padanan yang lazim bagi בְּנֵי יִשְׂרָאֵל. “Berfirman” sesuai dengan Allah sebagai penutur tanpa mengubah isi ujaran. “Orang asing yang menetap” menjelaskan גֵּר dengan lebih akurat; catatan kaki mempertahankan alternatif “penduduk asing.”
