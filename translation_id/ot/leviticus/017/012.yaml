    rationale: “Pendatang” dalam pemakaian modern dapat berarti orang yang baru tiba, sedangkan גֵּר menunjuk orang non-Israel yang tinggal menetap di tengah komunitas Israel. “Orang asing yang menetap” lebih jelas tanpa memaksakan kategori hukum modern.
