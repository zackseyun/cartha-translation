  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: id
  text: Oleh sebab itu, Aku telah berfirman kepada anak-anak Israel[a], “Tidak seorang pun di antara kamu boleh makan darah, dan orang asing[b] yang menetap di tengah-tengah kamu tidak boleh makan darah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; dapat juga diterjemahkan “orang Israel” atau “keturunan Israel.”
    reason: lexical_alternative
  - marker: b
    text: “Orang asing” di sini ialah orang bukan Israel yang menetap di tengah umat Israel dan hidup di bawah hukum komunitas itu; dapat juga diterjemahkan “penduduk asing” atau “orang asing yang menetap.”
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Oleh sebab itu
  rationale: Ungkapan ini menyatakan kesimpulan yang ditarik dari alasan pada ayat sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: אָמַרְתִּי
  choice: Aku berkata
  rationale: Menerjemahkan verba dasar ‘berkata’ secara langsung tanpa mempersempitnya menjadi istilah khusus untuk ujaran ilahi.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada anak-anak Israel
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah merujuk kepada anak-anak Israel, sekaligus memakai bentuk yang lazim dan mudah dipahami dalam bahasa Indonesia.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: Tidak seorang pun dari antara kamu
  rationale: נֶפֶשׁ di sini berarti seorang individu; rumusan ini menyampaikan daya distributif larangan dengan jelas tanpa terjemahan kaku ‘jiwa’.
- source_word: לֹא תֹאכַל דָּם
  choice: tidak ... boleh makan darah
  rationale: Bentuk ini menyampaikan larangan hukum secara alami dan tetap mempertahankan ungkapan konkret ‘makan darah’.
- source_word: הַגֵּר
  choice: pendatang
  rationale: Istilah ini menunjuk kepada orang bukan Israel yang tinggal di tengah komunitas Israel, bukan sekadar orang luar yang sedang berkunjung.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: yang tinggal di tengah-tengah kamu
  rationale: Menyampaikan keadaan menetap di dalam komunitas dengan bahasa Indonesia yang alami.
- source_word: לֹא יֹאכַל דָּם
  choice: tidak boleh makan darah
  rationale: Mengulangi larangan yang sama bagi pendatang dan mempertahankan kesejajaran kedua klausa.
theological_decisions:
- issue: Sebutan umat perjanjian dalam לִבְנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel; keturunan Israel; anak-anak lelaki Israel
  rationale: Pilihan ini mempertahankan citra hubungan keturunan dalam teks Ibrani tanpa menyiratkan bahwa larangan hanya berlaku bagi laki-laki; konteks hukum mencakup umat Israel sebagai komunitas.
translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat. Kapitalisasi “Aku” mengikuti kebiasaan bahasa Indonesia ketika Allah menjadi pembicara. Struktur paralel kedua larangan dipertahankan, sementara bentuk ‘tidak boleh’ dipilih agar larangan terdengar alami bagi pembaca modern.
