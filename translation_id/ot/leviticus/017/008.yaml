  text: וַ/אֲלֵ/הֶ֣ם תֹּאמַ֔ר אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל וּ/מִן הַ/גֵּ֖ר אֲשֶׁר יָג֣וּר בְּ/תוֹכָ֑/ם אֲשֶׁר יַעֲלֶ֥ה עֹלָ֖ה אוֹ זָֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: id
  text: 'Dan katakanlah kepada mereka: Setiap laki-laki dari kaum Israel[a] atau dari kalangan pendatang yang tinggal di tengah mereka[b], yang mempersembahkan kurban bakaran atau kurban sembelihan—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani mengulang kata “laki-laki” (“laki-laki, laki-laki”); ini adalah ungkapan hukum distributif yang berarti setiap laki-laki dalam tiap kasus.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang asing yang menetap”; istilah Ibrani ini menunjuk kepada orang bukan Israel yang tinggal di tengah umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: Dan katakanlah kepada mereka
  rationale: Konjungsi mempertahankan kesinambungan dengan konteks, sedangkan bentuk imperfek di sini berfungsi sebagai perintah kepada Musa. Susunan ini alami dalam bahasa Indonesia.
- source_word: אִישׁ אִישׁ
  choice: Setiap laki-laki
  rationale: Pengulangan kata benda maskulin merupakan ungkapan distributif hukum, yang menunjuk kepada setiap laki-laki sebagai kasus individual.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: dari kaum Israel
  rationale: Kata בֵּית secara harfiah berarti 'rumah', tetapi dalam ungkapan kolektif ini 'kaum Israel' menyampaikan makna umat atau komunitas Israel secara alami dan bermartabat.
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: atau dari antara pendatang yang tinggal di tengah-tengah mereka
  rationale: גֵּר menunjuk kepada orang bukan Israel yang menetap dalam komunitas Israel. 'Pendatang' menghindari kesan bahwa ia sekadar orang asing yang tidak dikenal, sedangkan 'tinggal' menyampaikan verba serumpun גּוּר secara wajar.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: yang mempersembahkan
  rationale: Bentuk Hifil dari עלה bersama objek kurban merupakan idiom kultis untuk mempersembahkan kurban; padanan ini lebih alami daripada menerjemahkan unsur 'naik' secara harfiah.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah ini menunjuk kepada kurban yang dibakar seluruhnya; 'kurban bakaran' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: אוֹ זָבַח
  choice: atau kurban sembelihan
  rationale: Nomina ini menunjuk kepada kurban yang disembelih dan dibedakan di sini dari kurban bakaran. 'Kurban sembelihan' mempertahankan perbedaan leksikal tersebut tanpa mempersempitnya menjadi jenis kurban tertentu.
theological_decisions:
- issue: Ungkapan distributif maskulin אִישׁ אִישׁ
  choice: Setiap laki-laki
  alternative: Setiap orang; siapa pun
  rationale: Teks Ibrani memakai bentuk maskulin tunggal secara distributif dalam ketentuan hukum. Terjemahan utama mempertahankan bentuk berjenis kelamin itu dan menjelaskan sifat idiomatisnya dalam catatan.
- issue: Status sosial-keagamaan גֵּר
  choice: pendatang
  alternative: orang asing yang menetap; penduduk asing
  rationale: Istilah ini merujuk kepada orang bukan Israel yang tinggal di tengah komunitas Israel dan tercakup dalam ketentuan ibadahnya. 'Pendatang' cukup alami dalam bahasa Indonesia dan konteks menetap dijelaskan oleh klausa berikutnya.
- issue: Pembedaan עֹלָה dan זָבַח
  choice: kurban bakaran atau kurban sembelihan
  alternative: kurban bakaran atau kurban
  rationale: Menyebut 'kurban sembelihan' mempertahankan kontras antara dua istilah kurban dalam teks tanpa menentukan subjenis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern dengan ragam hukum-keagamaan yang lugas dan bermartabat. Tanda pisah pada akhir ayat dipertahankan karena kalimat bersyarat berlanjut ke ayat berikutnya.
