id: LEV.1.14
reference: Leviticus 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: id
  text: Jika persembahannya kepada Yahweh adalah kurban bakaran dari burung, ia harus mempersembahkan persembahannya dari burung tekukur atau dari anak burung merpati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Konstruksi ini memperkenalkan kasus berikutnya dalam rangkaian petunjuk kurban. Dalam bahasa Indonesia, hubungan antarayat tetap alami tanpa menerjemahkan וְ secara tersendiri.
- source_word: מִן הָעוֹף
  choice: dari antara burung-burung
  rationale: עוֹף menunjuk pada golongan burung; frasa 'dari antara' menyampaikan pemilihan dari kategori tersebut.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan jelas untuk jenis kurban yang dibakar seluruhnya di atas mazbah, tanpa menghilangkan fungsi teknis istilah Ibrani.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן adalah sesuatu yang dibawa mendekat sebagai persembahan; padanan ini alami dan tepat dalam konteks ritual.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau penerima persembahan, sedangkan nama ilahi יהוה ditransliterasikan sebagai Yahweh.
- source_word: וְהִקְרִיב
  choice: ia harus mempersembahkan
  rationale: Bentuk Hifil dari קרב menyatakan tindakan membawa atau menyajikan persembahan; bentuk 'harus' menyampaikan daya instruksional konteks hukum.
- source_word: מִן הַתֹּרִים
  choice: burung tekukur
  rationale: תֹּרִים menunjuk pada turtledove; 'burung tekukur' merupakan padanan Indonesia yang mudah dipahami.
- source_word: אוֹ
  choice: atau
  rationale: Mempertahankan pilihan di antara dua jenis burung yang diizinkan.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: anak burung merpati
  rationale: Ungkapan harfiah 'anak-anak merpati' secara idiomatis menunjuk pada merpati yang masih muda.
- source_word: אֶת קָרְבָּנוֹ
  choice: sebagai persembahannya
  rationale: Pengulangan קָרְבָּנוֹ dipertahankan secara alami dan memperjelas bahwa burung yang dipilih itulah persembahan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk 'Yahweh' mempertahankan nama tersebut dan selaras dengan keputusan istilah proyek.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah ritual 'kurban bakaran' dipertahankan sebagai istilah teknis, sementara susunan kalimat dibuat alami bagi pembaca umum.
