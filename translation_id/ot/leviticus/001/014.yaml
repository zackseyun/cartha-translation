    rationale: Ibrani מִן הָעוֹף menyatakan asal atau kategori, bukan terutama pemilihan "dari antara" sejumlah burung. "Dari burung" menyampaikan makna itu dengan lebih idiomatis.
  - severity: low
    issue: Preposisi "dari" pada dua pilihan jenis burung tidak dinyatakan secara eksplisit.
    rationale: Walaupun struktur draf tetap dapat dipahami, pengulangan "dari" mencerminkan מִן ... אוֹ מִן dan memperjelas bahwa kedua jenis tersebut adalah kategori yang diperbolehkan.
  revised_text: Jika persembahannya kepada Yahweh adalah kurban bakaran dari burung, ia harus mempersembahkan persembahannya dari burung tekukur atau dari anak burung merpati.
