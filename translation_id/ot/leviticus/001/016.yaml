  text: וְ/הֵסִ֥יר אֶת מֻרְאָת֖/וֹ בְּ/נֹצָתָ֑/הּ וְ/הִשְׁלִ֨יךְ אֹתָ֜/הּ אֵ֤צֶל הַ/מִּזְבֵּ֨חַ֙ קֵ֔דְמָ/ה אֶל מְק֖וֹם הַ/דָּֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: id
  text: Ia harus menyingkirkan temboloknya[a] beserta bulu-bulunya[b], lalu membuangnya di samping mazbah, di sisi timur, ke tempat abu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tembolok adalah kantong pada saluran pencernaan burung; istilah ini juga dapat diterjemahkan “kantong makan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “beserta bulu-bulunya”; sebagian terjemahan memahami frasa Ibrani ini sebagai “beserta kotorannya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: Ia harus menyingkirkan
  rationale: Bentuk Hifil dari סור menyatakan tindakan membuat sesuatu tersingkir atau dikeluarkan. Ungkapan ini alami dalam petunjuk ritual bahasa Indonesia dan mempertahankan daya wajib dari konteks.
- source_word: מֻרְאָתוֹ
  choice: temboloknya
  rationale: Dalam konteks burung, kata ini menunjuk pada tembolok, yaitu kantong pada saluran pencernaan burung. Istilah anatomi Indonesia ini tepat dan mudah dipahami.
- source_word: בְּנֹצָתָהּ
  choice: beserta bulu-bulunya
  rationale: Bentuk konsonantalnya paling wajar dihubungkan dengan נוצה, 'bulu' atau 'bulu burung'. 'Beserta' menunjukkan bahwa bulu-bulu itu disingkirkan bersama tembolok, tanpa menghapus adanya penafsiran alternatif.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: lalu membuangnya
  rationale: Bentuk Hifil dari שלך berarti melemparkan atau membuang. Dalam prosedur ini, 'membuangnya' terdengar alami dan menyampaikan bahwa bagian yang telah disingkirkan harus ditempatkan sebagai buangan.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: di samping mazbah
  rationale: אצל menunjukkan letak dekat pada sisi suatu benda. 'Di samping mazbah' ringkas dan tepat.
- source_word: קֵדְמָה
  choice: di sisi timur
  rationale: Kata keterangan arah ini menunjukkan lokasi ke arah timur. Dalam konteks tata letak mazbah, 'di sisi timur' merupakan ungkapan Indonesia yang alami.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: ke tempat abu
  rationale: Dalam konteks persembahan, דשן dapat mengacu pada abu sisa mazbah, mungkin termasuk sisa berlemak. Terjemahan ini tidak merinci lebih daripada teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada petunjuk ritual yang lugas dan bermartabat. Istilah 'mazbah' dipertahankan sebagai istilah baku dalam konteks ibadah Israel, sedangkan 'tembolok' memberi ketepatan anatomi tanpa ungkapan teknis yang berlebihan.
