  text: וְ/קִרְבּ֥/וֹ וּ/כְרָעָ֖י/ו יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיח֖וֹחַ לַֽ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: id
  text: Ia harus membasuh isi perut dan kaki binatang itu dengan air, lalu imam harus membakar seluruhnya hingga menjadi asap di atas mezbah—sebagai kurban bakaran, persembahan dengan api[a], aroma yang menyenangkan bagi Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan makanan”. Makna tepat istilah Ibrani ini tidak pasti; istilah itu juga dapat dipahami sebagai persembahan yang disajikan melalui api.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “aroma yang menyenangkan” merupakan formula tetap dalam teks-teks kurban yang menunjukkan bahwa persembahan itu berkenan kepada Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: isi perut binatang itu
  rationale: Dalam konteks kurban, קֶרֶב menunjuk pada bagian-bagian dalam tubuh atau organ dalam binatang. “Isi perut” konkret, mudah dipahami, dan sesuai dengan tindakan pencucian.
- source_word: כְרָעָיו
  choice: kaki binatang itu
  rationale: Kata ini menunjuk pada tungkai atau bagian bawah kaki binatang. “Kaki” merupakan padanan Indonesia modern yang paling jelas tanpa memakai istilah teknis.
- source_word: יִרְחַץ בַּמָּיִם
  choice: harus dicucinya dengan air
  rationale: Bentuk ini mempertahankan kewajiban ritual dan sarana pencucian. Susunan pasif berpelaku ini alami dalam bahasa Indonesia dan tetap menunjukkan bahwa orang yang mempersembahkan kurban melakukan pencucian.
- source_word: וְהִקְטִיר
  choice: harus membakar seluruhnya hingga menjadi asap
  rationale: Dalam bahasa persembahan, kata kerja ini berarti membuat bahan kurban naik sebagai asap di mezbah, bukan sekadar membakarnya. Ungkapan ini mempertahankan nuansa tersebut dengan bahasa yang wajar.
- source_word: אֶת־הַכֹּל
  choice: seluruhnya
  rationale: Padanan ini menyampaikan penekanan pada keseluruhan binatang yang telah dipersiapkan.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mezbah
  rationale: “Mezbah” adalah istilah Indonesia yang mapan untuk tempat persembahan, dan “di atas” mencerminkan arah/lokasi tindakan dalam bahasa Ibrani.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Ini istilah Indonesia yang mapan untuk kurban yang seluruhnya dibakar di mezbah; hubungan kata Ibrani dengan tindakan naik tetap tersirat dalam asap yang naik.
- source_word: אִשֵּׁה
  choice: persembahan dengan api
  rationale: Makna tepat istilah ritual ini diperdebatkan. Pilihan utama mempertahankan kaitannya yang paling jelas dengan api tanpa menyatakan bahwa api itu sendiri adalah persembahannya; kemungkinan makna “persembahan makanan” dicatat dalam catatan kaki.
- source_word: רֵיחַ נִיחוֹחַ
  choice: suatu aroma yang menyenangkan
  rationale: Padanan ini mempertahankan metafora formula kurban sekaligus menyampaikan bahwa persembahan itu berkenan, tanpa menjelaskan metafora secara berlebihan dalam teks utama.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה dialihaksarakan sebagai “Yahweh”, sedangkan ל־ di sini menyatakan arah atau penerima persembahan.
theological_decisions:
- issue: Makna istilah kurban אִשֵּׁה
  choice: persembahan dengan api
  alternative: persembahan makanan
  rationale: Etimologi dan fungsi formula ini tidak sepenuhnya pasti. Teks utama mempertahankan unsur api yang tampak dalam bentuk katanya, sedangkan catatan kaki menjaga kemungkinan bahwa istilah itu menggambarkan persembahan sebagai pemberian makanan.
- issue: Makna formula רֵיחַ נִיחוֹחַ
  choice: suatu aroma yang menyenangkan
  alternative: suatu aroma yang menenteramkan
  rationale: Terjemahan mempertahankan citra indrawi teks dan tidak mengubahnya langsung menjadi pernyataan abstrak tentang penerimaan ilahi. Catatan menjelaskan fungsi formula tanpa meniadakan metaforanya.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Alih aksara “Yahweh” mempertahankan nama diri yang hadir dalam teks Ibrani, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Istilah ritual yang mapan, seperti “mezbah” dan “kurban bakaran”, dipertahankan. Kalimat Ibrani yang panjang dibagi menjadi tiga kalimat agar mudah dibaca, sementara urutan tindakan dan rangkaian aposisional kurban tetap terjaga.
