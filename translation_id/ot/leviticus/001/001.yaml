  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: id
  text: 'Lalu Yahweh memanggil Musa; dari Kemah Pertemuan Ia berfirman kepadanya demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Kata קרא di sini memperkenalkan sapaan ilahi kepada Musa. “Memanggil” alami dan tidak menambahkan gagasan perintah kuat seperti “memerintahkan datang”.
- source_word: אֶל
  choice: Musa (sebagai objek langsung dari “memanggil”)
  rationale: Dalam bahasa Indonesia, konstruksi קרא אל paling alami dinyatakan dengan verba transitif “memanggil Musa”; bentuk harfiah “memanggil kepada Musa” tidak idiomatis.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: דבר menyatakan tindakan berbicara, khususnya komunikasi ilahi yang formal. Pilihan ini mempertahankan perbedaannya dari לֵאמֹר yang menyusul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi dengan sufiks pronominal merujuk kembali kepada Musa.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: dari Kemah Pertemuan
  rationale: אֹהֶל מוֹעֵד adalah sebutan bagi tempat suci tempat pertemuan yang ditetapkan. “Kemah Pertemuan” merupakan padanan Indonesia yang jelas dan lazim tanpa memasukkan istilah tambahan.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi perkataan yang dimulai pada ayat berikutnya. “Demikian:” menjalankan fungsi pengantar kutipan secara alami dan menghindari pengulangan janggal “berbicara ... dengan berkata”.
- source_word: וַ
  choice: Lalu
  rationale: Waw naratif melanjutkan urutan cerita dari penutup Kitab Keluaran; “Lalu” menyampaikan kesinambungan dan urutan itu secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar, tanpa memilih bentuk tradisional “Yehova”.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan dalam bahasa Ibrani dan fungsi formula pengantar perkataan. Tidak ada catatan kaki karena naskah sumber tidak menunjukkan varian pada frasa “Kemah Pertemuan”; catatan kaki bahasa Inggris yang diberikan tampaknya tidak selaras antara penanda dan isinya.
