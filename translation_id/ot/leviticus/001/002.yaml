  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: id
  text: '“Berbicaralah kepada orang Israel[a] dan katakanlah kepada mereka: Apabila seseorang[b] dari antara kamu membawa persembahan kepada Yahweh, haruslah kamu membawa persembahanmu dari hewan ternak, dari kawanan sapi atau dari kawanan kambing dan domba.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”; dapat juga diterjemahkan “keturunan Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: ʼadam, “orang” atau “manusia”; di sini dipakai untuk seorang individu sebagai contoh yang mewakili siapa pun dari antara umat itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini menunjuk kepada anggota-anggota bangsa Israel. ‘Orang Israel’ alami dalam bahasa Indonesia modern, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אָדָם
  choice: seseorang
  rationale: Dalam rumusan kasus ini, kata tersebut memperkenalkan seorang individu secara representatif, bukan menegaskan jenis kelamin laki-laki. ‘Seseorang’ mempertahankan fungsi generiknya dalam bahasa Indonesia.
- source_word: יַקְרִיב / תַּקְרִיבוּ
  choice: membawa / haruslah kamu membawa
  rationale: Bentuk Hifil dari קרב dalam konteks persembahan berarti membawa atau menghadirkan sesuatu sebagai persembahan. Pengulangan ‘membawa’ mempertahankan kaitan verbal antara kedua klausa.
- source_word: מִכֶּם
  choice: dari antara kamu
  rationale: 'Frasa ini bersifat partitif: seorang individu yang berasal dari komunitas yang sedang disapa.'
- source_word: קָרְבָּן
  choice: persembahan
  rationale: Istilah ini mencakup sesuatu yang dibawa atau dipersembahkan kepada Allah dan lebih luas daripada ‘kurban’ atau ‘korban sembelihan’.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: הַבְּהֵמָה
  choice: hewan ternak
  rationale: Kata ini menjadi kategori umum bagi binatang piaraan yang kemudian dirinci sebagai sapi serta kambing domba.
- source_word: הַבָּקָר
  choice: kawanan sapi
  rationale: Istilah ini menunjuk pada ternak besar jenis sapi; ‘kawanan sapi’ mempertahankan nuansa kolektifnya.
- source_word: הַצֹּאן
  choice: kawanan kambing domba
  rationale: Istilah kolektif ini mencakup domba dan kambing. ‘Kambing domba’ menyatakan kedua jenis itu tanpa membatasinya hanya pada domba.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi יהוה. Bentuk ‘Yahweh’ mempertahankan nama tersebut dan membedakannya dari gelar.
- issue: Daya cakup representatif אָדָם
  choice: seseorang
  alternative: seorang laki-laki
  rationale: אָדָם di sini memperkenalkan kasus seorang anggota komunitas secara umum. Terjemahan ‘seseorang’ tidak membatasi ketentuan ini kepada laki-laki tanpa dasar kontekstual.
- issue: Peralihan dari subjek tunggal ke sapaan jamak
  choice: Mempertahankan ‘seseorang’ lalu ‘kamu’
  alternative: Menyeragamkan seluruh ayat menjadi bentuk tunggal
  rationale: Bahasa Ibrani beralih dari individu dalam kasus hipotetis kepada komunitas yang disapa dengan bentuk jamak. Bentuk Indonesia mempertahankan ketegangan gramatikal itu sejauh dimungkinkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan perintah dipertahankan, sementara ungkapan Ibrani yang kaku dialihkan secara alami. ‘Haruslah kamu’ menjaga nada ketentuan resmi dan membiarkan ‘kamu’ berfungsi sebagai sapaan jamak kepada komunitas.
