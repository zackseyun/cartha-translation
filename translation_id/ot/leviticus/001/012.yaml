base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: id
  text: Ia harus memotongnya menjadi bagian-bagiannya, beserta kepala dan lemaknya[a]. Imam harus menata semuanya di atas kayu yang berada di atas api yang berada di atas mazbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lemak kerasnya” atau “lemak di sekitar isi perutnya.” Istilah Ibrani ini menunjuk pada jaringan lemak yang terkait dengan hewan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: ia harus memotongnya menjadi bagian-bagian
  rationale: Dalam konteks kurban, נתח berarti memotong hewan menjadi beberapa bagian. Bentuk hukum-ritual diterjemahkan dengan 'harus' agar daya instruksinya jelas dalam bahasa Indonesia.
- source_word: רֹאשׁוֹ
  choice: kepala
  rationale: Istilah anatomi ini langsung dan jelas; bersama frasa 'termasuk ... lemaknya', kepala dipahami sebagai bagian yang turut ditata.
- source_word: פִּדְרוֹ
  choice: lemaknya
  rationale: פדר menunjuk pada jaringan lemak atau lapisan lemak hewan kurban. 'Lemaknya' alami dan tidak mempersempit makna pada jenis lemak tertentu; alternatif yang lebih khusus dicatat dalam catatan kaki.
- source_word: וְעָרַךְ
  choice: harus menata
  rationale: ערך dalam konteks ibadah berarti menyusun atau menempatkan secara teratur. 'Menata' mempertahankan gagasan tindakan ritual yang teratur.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Padanan baku כהן dalam konteks keimaman Israel; penggunaan tanpa artikel alami dalam bahasa Indonesia.
- source_word: אֹתָם
  choice: semuanya
  rationale: Mengacu secara kolektif kepada potongan-potongan, kepala, dan lemak; 'semuanya' memperjelas rujukan jamaknya secara alami.
- source_word: עַל הָעֵצִים
  choice: di atas kayu
  rationale: הָעֵצִים berbentuk jamak, tetapi 'kayu' lazim dipakai secara kolektif dalam bahasa Indonesia untuk bahan bakar altar.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: yang ada di atas api pada mazbah
  rationale: Terjemahan ini mempertahankan urutan spasial kayu–api–mazbah sambil menghindari rangkaian klausa relatif yang kaku. 'Pada mazbah' menerangkan lokasi api.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan gaya instruksi ritual. Istilah 'mazbah' dipertahankan sebagai kosakata Alkitab yang tepat, sedangkan struktur kalimat dibuat alami bagi pembaca umum.
