base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: id
  text: Imam harus membawanya ke mazbah, lalu memutuskan kepalanya[a] dan membakarnya di atas mazbah. Darahnya harus diperas keluar pada sisi mazbah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai di sini merupakan istilah teknis untuk tindakan imam membunuh burung kurban pada bagian kepala; tindakan ini juga dapat digambarkan sebagai memuntir lepas atau mematahkan kepalanya.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pada dinding mazbah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: harus membawanya
  rationale: Bentuk Hifil dari קרב menyatakan tindakan membawa mendekat. Karena frasa berikutnya menyebut tujuan, yaitu mazbah, pilihan ini mempertahankan gerak konkret dalam teks.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan wajar untuk כֹּהֵן dalam konteks peraturan kurban.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: ke mazbah
  rationale: אֶל menunjukkan gerak menuju suatu tujuan; 'ke mazbah' menyatakannya secara langsung.
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: memuntir putus kepalanya
  rationale: מלק merupakan istilah teknis bagi tindakan imam membunuh burung kurban pada bagian kepala. Ungkapan ini konkret dan alami dalam bahasa Indonesia, tanpa mengganti objek Ibrani 'kepalanya' dengan 'lehernya'.
- source_word: וְהִקְטִיר
  choice: membakarnya
  rationale: Dalam konteks kurban, קטר berarti membakar persembahan di mazbah sehingga asapnya naik. 'Membakarnya' jelas dan wajar; objeknya diperjelas oleh pronomina yang merujuk kepada burung.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran penunjuk arah pada bentuk ini secara idiomatis menyertai tindakan kurban di mazbah. Karena burung dibakar pada permukaan mazbah, 'di atas mazbah' paling jelas.
- source_word: וְנִמְצָה דָמוֹ
  choice: darahnya harus diperas keluar
  rationale: Bentuk Nifal dari מצה di sini menggambarkan darah yang dikeluarkan dengan tekanan. Pilihan ini mempertahankan nuansa pasif dan cara pengeluarannya.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: pada sisi mazbah
  rationale: קִיר secara harfiah berarti 'dinding', tetapi untuk bangunan mazbah, 'sisi mazbah' lebih alami dan tidak memberi kesan bahwa yang dimaksud ialah dinding bangunan terpisah.
