id: LEV.1.10
reference: Leviticus 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: id
  text: Jika persembahannya berasal dari kawanan ternak, yakni dari domba atau kambing, sebagai kurban bakaran,[a] ia harus mempersembahkan seekor jantan yang tidak bercacat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk kurban bakaran.”
    reason: lexical_alternative
  - marker: b
    text: “Tidak bercacat” berarti bebas dari cacat fisik, sebagaimana disyaratkan bagi kurban ini.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Memperkenalkan kasus bersyarat berikutnya. Dalam bahasa Indonesia, hubungan lanjutan dengan ayat sebelumnya sudah wajar tanpa harus menerjemahkan וְ secara eksplisit sebagai “dan”.
- source_word: מִן הַצֹּאן
  choice: berasal dari kawanan ternak
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, terutama domba dan kambing. “Kawanan ternak” dapat dipahami pembaca umum, sedangkan frasa berikutnya menjelaskan jenisnya.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן menunjuk pada sesuatu yang dibawa atau dipersembahkan dalam ibadah. “Persembahan” merupakan padanan yang jelas dan lazim dalam konteks ini.
- source_word: מִן הַכְּשָׂבִים
  choice: dari domba
  rationale: כְּשָׂבִים menunjuk pada jenis domba tanpa mengharuskan pembatasan umur menjadi anak domba.
- source_word: אוֹ מִן הָעִזִּים
  choice: atau kambing
  rationale: עִזִּים adalah bentuk jamak yang lazim untuk kambing; terjemahan ini mempertahankan pilihan antara kedua jenis ternak.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah kurban yang seluruhnya dibakar. Preposisi לְ dapat dipahami sebagai penandaan fungsi atau tujuan; “sebagai” alami dalam bahasa Indonesia dan alternatif “untuk” dicatat.
- source_word: זָכָר
  choice: seekor jantan
  rationale: Teks secara khusus mensyaratkan jenis kelamin hewan. Kata penggolong “seekor” membuat ungkapan Indonesia lebih alami.
- source_word: תָּמִים
  choice: yang tidak bercacat
  rationale: Dalam konteks kurban, תָּמִים berarti bebas dari cacat fisik, bukan kesempurnaan moral atau abstrak.
- source_word: יַקְרִיבֶנּוּ
  choice: ia harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa untuk dipersembahkan atau mempersembahkan. “Harus” menyampaikan daya instruksional bentuk verba tersebut, sementara objeknya dinyatakan langsung sebagai “seekor jantan”.
theological_decisions:
- issue: Makna istilah kurban עֹלָה
  choice: kurban bakaran
  alternative: kurban yang naik
  rationale: “Kurban bakaran” menyampaikan kategori kurban yang dikenal dalam tata ibadah Imamat tanpa menjadikan etimologi ‘naik’ sebagai tafsiran utama.
- issue: Hubungan לְ pada לְעֹלָה
  choice: sebagai kurban bakaran
  alternative: untuk kurban bakaran
  rationale: Keduanya mungkin secara gramatikal. “Sebagai” menandai fungsi hewan yang dipersembahkan, sedangkan kemungkinan makna tujuan dipertahankan dalam catatan kaki.
- issue: Syarat jenis kelamin hewan
  choice: seekor jantan
  alternative: jantan
  rationale: Teks Ibrani secara eksplisit menyebut jenis kelamin hewan; rincian ini dipertahankan tanpa penerapan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. Istilah “kurban bakaran” dipakai secara konsisten sebagai istilah ritual, sedangkan “kawanan ternak” segera diperjelas dengan “domba atau kambing” agar tidak terasa teknis.
