  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: id
  text: Ia harus menyembelih sapi jantan muda itu[a] di hadapan Yahweh. Kemudian anak-anak Harun, para imam, harus menyajikan darah itu dan memercikkan[b] darah itu pada sekeliling mezbah yang terletak di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak dari kawanan sapi,” suatu ungkapan Ibrani untuk hewan ternak sapi; di sini yang dimaksud ialah sapi jantan muda.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “memercikkan” pada dasarnya menggambarkan tindakan melemparkan atau menyiramkan darah dalam penerapan ritual; dapat juga diterjemahkan “menyiramkan darah itu pada sekeliling mezbah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: harus menyembelih
  rationale: Bentuk qatal dalam rangkaian petunjuk ritual menyatakan tindakan yang diwajibkan; “menyembelih” lebih tepat daripada sekadar “membunuh”.
- source_word: בֶּן הַבָּקָר
  choice: sapi jantan muda
  rationale: Secara harfiah berarti “anak dari kawanan sapi,” yakni ungkapan untuk ternak sapi; konteks ayat sebelumnya menetapkan hewan jantan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan makna spasial dan ritual serta menyajikan nama ilahi sebagaimana terdapat dalam teks Ibrani.
- source_word: וְהִקְרִיבוּ
  choice: harus mempersembahkan
  rationale: Bentuk hifil קרב berarti membawa mendekat atau menyajikan; “mempersembahkan” wajar dalam konteks imam yang menangani darah tanpa menyamakan tindakan ini dengan keseluruhan kurban.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: anak-anak Harun, yaitu para imam
  rationale: Menjaga hubungan keluarga sekaligus fungsi “para imam” sebagai aposisi yang menjelaskan siapa yang menangani darah.
- source_word: וְזָרְקוּ
  choice: memercikkan
  rationale: Dalam penerapan darah secara ritual, זרק menunjuk tindakan melemparkan atau menghamburkan darah ke permukaan. “Memercikkan” merupakan ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan nuansa tindakan yang lebih kuat.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: pada seluruh sisi mezbah
  rationale: Mengungkapkan bahwa darah dikenakan pada mezbah di sekelilingnya, bukan sekadar diletakkan di atas permukaan atas mezbah.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: yang berada di pintu masuk Kemah Pertemuan
  rationale: Klausa relatif ini menerangkan lokasi mezbah; “Kemah Pertemuan” adalah terjemahan langsung dan mapan untuk אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks menyebut nama perjanjian יהוה secara langsung; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Pelaku penyembelihan
  choice: Ia harus menyembelih
  alternative: Imam harus menyembelih
  rationale: Subjek tunggal meneruskan orang yang membawa persembahan dari konteks sebelumnya, sedangkan para imam baru disebut sebagai pelaku penanganan darah. Terjemahan tidak memindahkan penyembelihan kepada imam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang khidmat. “Harus” menyampaikan fungsi hukum-prosedural bentuk verba Ibrani. Kapitalisasi “Kemah Pertemuan” dipakai sebagai nama tempat ibadah tertentu.
