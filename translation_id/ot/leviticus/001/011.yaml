  naturalness: Bahasa umumnya formal dan alami, tetapi "pada mazbah di sekelilingnya" dapat dibaca seolah-olah darah dikenakan pada area di sekitar altar, bukan pada semua sisi altar. "Pada seluruh sisi mezbah" lebih jelas dan idiomatis. Ejaan "mezbah" juga lebih lazim dalam bahasa Indonesia modern untuk istilah ini.
  terminology: '"Menyembelih", "di hadapan Yahweh", dan "anak-anak Harun, para imam" tepat. "Menyiramkan" merupakan padanan Indonesia yang baik untuk tindakan ritual זרק; catatan kaki dapat mempertahankan alternatif yang lebih harfiah, "menghamburkan".'
