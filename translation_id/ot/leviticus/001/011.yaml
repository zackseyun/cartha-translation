- from: Ia harus menyembelihnya di sisi utara mazbah di hadapan Yahweh, lalu anak-anak Harun, para imam itu, harus mencurahkan darahnya pada mazbah di sekelilingnya.[a]
  to: Ia harus menyembelihnya di sisi utara mezbah di hadapan Yahweh. Kemudian anak-anak Harun, para imam, harus menyiramkan darahnya pada seluruh sisi mezbah.[a]
  rationale: Revisi mengganti "mencurahkan" dengan "menyiramkan" agar tindakan ritual זרק tidak direduksi menjadi penuangan, dan menjelaskan cakupan סָבִיב sebagai pengenaan pada seluruh sisi mezbah. Struktur dua kalimat mempertahankan urutan prosedural tanpa mengubah makna.
