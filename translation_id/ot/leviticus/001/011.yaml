  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: id
  text: Ia harus menyembelihnya di sisi utara mezbah di hadapan Yahweh. Kemudian anak-anak Harun, para imam, harus menyiramkan darahnya pada seluruh sisi mezbah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “harus menghamburkan darahnya pada seluruh sisi mezbah.” Kata kerja Ibrani menunjukkan pengenaan darah dengan gerakan kuat, bukan sekadar pemercikan ringan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט אֹתוֹ
  choice: Ia harus menyembelihnya
  rationale: שׁחט adalah verba baku untuk menyembelih hewan kurban; 'menyembelih' lebih khusus dan tepat daripada 'membunuh'. Bentuk instruksional diterjemahkan dengan 'harus'.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: di sisi utara mazbah
  rationale: יֶרֶךְ secara harfiah berarti sisi atau rusuk; dalam konteks lokasi altar, ungkapan alami dalam bahasa Indonesia ialah 'sisi utara mazbah'.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan kultis ini menyatakan tindakan yang dilakukan dalam kehadiran Yahweh; nama ilahi dipertahankan sebagai 'Yahweh'.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: anak-anak Harun, para imam itu
  rationale: Susunan aposisional Ibrani dipertahankan sehingga garis keturunan dan jabatan mereka sama-sama jelas.
- source_word: וְזָרְקוּ
  choice: harus mencurahkan
  rationale: Dalam ritus darah, זרק menunjuk pada pengenaan darah pada mazbah dengan gerakan yang lebih kuat daripada pemercikan ringan. 'Mencurahkan ... pada' terdengar alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan nuansa alternatif 'melemparkan/memercikkan dengan kuat'.
- source_word: אֶת דָּמוֹ
  choice: darahnya
  rationale: Pronomina merujuk kepada hewan kurban; bahasa Indonesia secara alami memakai '-nya' tanpa membedakan gender.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: pada mazbah di sekelilingnya
  rationale: עַל menandai sasaran tindakan, sedangkan סָבִיב menunjukkan bahwa darah dikenakan mengelilingi sisi-sisi mazbah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. 'Yahweh' mempertahankan nama perjanjian yang terdapat dalam sumber tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa ritual-hukum yang formal tetapi tetap alami bagi pembaca Indonesia modern. 'Mazbah' dipakai sebagai istilah ringkas dan mapan untuk altar kurban. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
