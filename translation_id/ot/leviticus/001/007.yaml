  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: id
  text: Anak-anak Harun, sang imam, harus menaruh api di atas mezbah dan menata kayu di atas api.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: harus menaruh
  rationale: Kata נָתַן dapat berarti memberi, menaruh, atau menempatkan. Dalam petunjuk ritual ini, “menaruh” menyatakan tindakan konkret dengan alami, sedangkan “harus” menyampaikan daya instruksional bentuk verba dalam konteks hukum.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: anak-anak Harun, imam itu
  rationale: Frasa ini mempertahankan hubungan kekeluargaan dan menempatkan sebutan tunggal “imam itu” sebagai aposisi bagi Harun, bukan bagi anak-anaknya.
- source_word: אֵשׁ
  choice: api
  rationale: Makna dasarnya adalah api harfiah yang digunakan dalam pelaksanaan kurban.
- source_word: עַל הַמִּזְבֵּחַ
  choice: di atas mezbah
  rationale: Ini adalah padanan yang wajar dan tepat untuk lokasi api dalam konteks persembahan kurban.
- source_word: וְעָרְכוּ
  choice: dan menata
  rationale: Kata עָרַךְ dalam konteks ritual berarti menyusun atau mengatur secara tertib. “Menata” ringkas, alami, dan mempertahankan unsur keteraturan.
- source_word: עֵצִים
  choice: kayu
  rationale: Walaupun bentuk Ibraninya jamak, bahasa Indonesia lazim memakai nomina kolektif “kayu” dalam konteks bahan bakar; “potongan-potongan kayu” akan terlalu eksplisit.
- source_word: עַל הָאֵשׁ
  choice: di atas api itu
  rationale: Pengulangan “api” dipertahankan sesuai urutan tindakan dalam bahasa Ibrani, sementara “itu” merujuk secara alami kepada api yang baru disebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat dengan corak instruksi ritual. Aposisi “imam itu” dipertahankan untuk menunjukkan bahwa הַכֹּהֵן menerangkan Harun. Tidak digunakan catatan kaki karena alternatif dalam lapisan konsultasi Inggris yang menjadikan frasa itu sebagai “keluarga keimaman” tidak diperlukan oleh sintaks Ibrani.
