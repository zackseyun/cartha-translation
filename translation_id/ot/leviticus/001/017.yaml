  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: id
  text: Ia harus mengoyak burung itu pada sayap-sayapnya, tetapi tidak memisahkannya. Lalu imam harus membakarnya di atas mazbah, di atas kayu yang berada di atas api. Itulah kurban bakaran, kurban yang dibakar dengan api, yang aromanya menyenangkan bagi Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁסַּע
  choice: membelah
  rationale: Kata kerja ini menggambarkan tindakan merobek atau membelah tubuh burung; konteks berikutnya menjelaskan bahwa belahan itu tidak boleh memisahkan tubuhnya sepenuhnya.
- source_word: בִכְנָפָיו
  choice: pada sayap-sayapnya
  rationale: Preposisi ב dapat menyatakan lokasi atau sarana. 'Pada sayap-sayapnya' mempertahankan gambaran konkret sekaligus tidak menentukan secara berlebihan apakah sayap menjadi lokasi atau alat tindakan.
- source_word: לֹא יַבְדִּיל
  choice: tidak sampai memisahkannya menjadi dua
  rationale: Hifil בדל berarti memisahkan. Ungkapan ini menjelaskan secara alami bahwa burung dibelah, tetapi kedua bagiannya tidak diputus sepenuhnya.
- source_word: וְהִקְטִיר
  choice: harus membakarnya
  rationale: Dalam konteks kurban, kata ini menunjuk pada pembakaran di mazbah sehingga persembahan naik sebagai asap. 'Membakarnya' jelas dan ditentukan oleh konteks mazbah.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: '''Mazbah'' merupakan istilah Indonesia yang mapan untuk altar kurban dan sesuai dengan register Alkitab yang dignified.'
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: di atas kayu yang ada pada api
  rationale: Terjemahan ini mempertahankan susunan berlapis dan pengulangan preposisi dalam bahasa Ibrani tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Ini adalah istilah kultis yang mapan bagi persembahan yang dibakar seluruhnya di mazbah; nuansa etimologis 'naik' tidak perlu dipaksakan ke dalam teks utama.
- source_word: אִשֵּׁה
  choice: kurban yang dibakar dengan api
  rationale: Kata ini secara paling langsung menunjuk pada persembahan yang dibuat dengan api. Pilihan ini lebih transparan daripada 'persembahan makanan' dan cocok dengan tindakan ritual dalam ayat.
- source_word: רֵיחַ נִיחֹחַ
  choice: yang aromanya menyenangkan
  rationale: Ungkapan ini mempertahankan metafora indrawi dan menyampaikan bahwa kurban itu berkenan, tanpa menjelaskan teologinya melebihi teks.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan arah atau relasi; 'bagi Yahweh' alami dalam bahasa Indonesia dan mempertahankan nama ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Makna formula kultis רֵיחַ נִיחֹחַ
  choice: yang aromanya menyenangkan bagi Yahweh
  alternative: bau yang menenteramkan bagi Yahweh
  rationale: Pilihan utama mempertahankan metafora kurban dan gagasan keberkenanan ilahi tanpa memasukkan penjelasan doktrinal tambahan.
- issue: Makna אִשֵּׁה
  choice: kurban yang dibakar dengan api
  alternative: persembahan makanan atau kurban api-apian
  rationale: Bentuk dan konteks mendukung persembahan yang dipersembahkan melalui api. Terjemahan ini menjaga ketegangan kultis tanpa mengandaikan bahwa kurban tersebut secara harfiah adalah makanan bagi Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'kurban bakaran' dan 'mazbah' dipertahankan sebagai kosakata kultis yang telah dikenal. Susunan kalimat dibuat alami, sedangkan rincian ritual dan metafora aroma tetap dekat dengan teks Ibrani.
