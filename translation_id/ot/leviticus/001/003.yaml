id: LEV.1.3
reference: Leviticus 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: id
  text: “Jika persembahannya adalah kurban bakaran dari ternak sapi, ia harus mempersembahkan seekor jantan yang tidak bercacat. Ia harus mempersembahkannya di pintu masuk Kemah Pertemuan supaya ia diterima di hadapan Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “agar persembahannya diterima di hadapan Yahweh”; menurut pemahaman tradisional lain: “atas kehendaknya sendiri di hadapan Yahweh.”'
    reason: Frasa Ibrani לִרְצֹנוֹ memiliki ambiguitas mengenai penerimaan orang atau persembahannya dan, dalam tradisi penerjemahan, juga dapat dipahami sebagai kesukarelaan.
lexical_decisions:
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan jelas dalam bahasa Indonesia untuk persembahan yang seluruhnya dibakar di atas mazbah; mempertahankan makna kultisnya tanpa parafrasa berlebihan.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קרבן adalah sesuatu yang dibawa mendekat sebagai persembahan. 'Persembahan' alami dan tepat dalam konteks kurban.
- source_word: מִן הַבָּקָר
  choice: dari kawanan sapi
  rationale: הבקר menunjuk pada ternak besar jenis sapi. Ungkapan ini membedakannya dari ternak kecil pada ayat berikutnya.
- source_word: זָכָר תָּמִים
  choice: seekor jantan yang tidak bercacat
  rationale: Menyatakan secara eksplisit jenis kelamin dan syarat bebas cacat bagi hewan kurban.
- source_word: יַקְרִיבֶנּוּ
  choice: ia harus mempersembahkan
  rationale: Bentuk hifil קרב dalam konteks ibadah berarti membawa atau menyajikan sebagai persembahan. Modal 'harus' menyampaikan daya instruktif bentuk verba Ibrani.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pintu Kemah Pertemuan
  rationale: Padanan alami bagi ungkapan tempat kudus ini; 'pintu' menunjuk pada jalan masuk, sedangkan nama Kemah Pertemuan dipertahankan.
- source_word: לִרְצֹנוֹ
  choice: supaya ia diterima
  rationale: Dalam konteks kurban, frasa ini paling mungkin menyatakan penerimaan orang yang mempersembahkan di hadapan Allah. Bentuk Indonesia ini lebih alami daripada 'untuk penerimaannya', sementara kemungkinan makna kesukarelaan dicatat dalam catatan kaki.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti 'di hadapan/dalam kehadiran', dan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani menggunakan nama ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan selaras dengan lapisan konsultasi yang telah diaudit.
- issue: Makna לִרְצֹנוֹ
  choice: supaya ia diterima
  alternative: atas kehendaknya sendiri; agar berkenan
  rationale: Frasa ini ambigu antara penerimaan di hadapan Yahweh dan tindakan sukarela si pemberi. Teks utama memilih makna penerimaan yang kuat dalam konteks kurban, tetapi tidak meniadakan bacaan tradisional tentang kesukarelaan; alternatif itu dipertahankan dalam catatan kaki.
- issue: Rujukan pronomina dalam לִרְצֹנוֹ
  choice: '''ia'' merujuk kepada orang yang mempersembahkan'
  alternative: persembahan itu diterima
  rationale: Akhiran orang ketiga maskulin tunggal secara gramatikal dapat berkaitan dengan si pemberi atau persembahannya. Rumusan utama mengikuti pengertian bahwa si pemberi diterima, sebagaimana didukung konteks penerimaan kurban, tanpa mengembangkan mekanisme teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kurban' dipakai untuk persembahan sembelihan ritual, sedangkan 'persembahan' menerjemahkan istilah umum קרבן. Kalimat dibagi dua mengikuti alur instruksi Ibrani dan tetap mudah dipahami pembaca umum.
