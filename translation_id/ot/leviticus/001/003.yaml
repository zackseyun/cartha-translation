  - severity: low
    issue: “Ke pintu Kemah Pertemuan” kurang idiomatis untuk lokasi tindakan.
    rationale: פֶּתַח menunjukkan pintu masuk/ambang sebagai tempat persembahan itu disajikan. “Di pintu masuk Kemah Pertemuan” menyampaikan lokasi tersebut dengan lebih jelas.
