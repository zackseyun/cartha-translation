  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: id
  text: Ia harus menumpangkan tangannya pada kepala kurban bakaran itu, dan kurban itu akan diterima[a] untuknya, untuk mengadakan pendamaian baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan ia akan diterima”—bentuk pasif dalam bahasa Ibrani dapat dipahami sebagai merujuk lebih langsung kepada orang yang mempersembahkan, bukan kepada kurban itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Ia harus menumpangkan
  rationale: Dalam konteks persembahan, סמך menunjuk pada tindakan ritual meletakkan atau menekan tangan pada hewan. “Menumpangkan” merupakan padanan Indonesia yang lazim dan bermartabat tanpa menentukan seberapa kuat tekanannya.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Mempertahankan bentuk tunggal dan kepunyaan orang ketiga maskulin dari teks Ibrani.
- source_word: עַל רֹאשׁ
  choice: pada kepala
  rationale: Menyampaikan hubungan fisik gerakan tersebut secara langsung dan alami dalam bahasa Indonesia.
- source_word: הָעֹלָה
  choice: kurban bakaran itu
  rationale: עֹלָה adalah istilah baku bagi persembahan yang dibakar seluruhnya. “Kurban bakaran” jelas bagi pembaca Indonesia dan tidak mengutamakan arti etimologis ‘yang naik’.
- source_word: וְנִרְצָה
  choice: dan kurban itu akan diterima
  rationale: Nifal רצה menyatakan penerimaan dengan baik atau berkenan. Subjek “kurban itu” dinyatakan agar kalimat Indonesia jelas, sedangkan kemungkinan bahwa yang diterima adalah orang yang mempersembahkan dipertahankan dalam catatan kaki.
- source_word: לוֹ
  choice: demi dia
  rationale: Menyatakan manfaat atau kepentingan orang yang membawa persembahan, sekaligus menghindari pengulangan “baginya” yang kaku.
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: Mempertahankan bobot ritual-teologis כפר tanpa memasukkan teori tertentu mengenai cara pendamaian itu bekerja.
- source_word: עָלָיו
  choice: baginya
  rationale: Dalam pemakaian korban bersama כפר, על menunjuk kepada orang yang demi kepentingannya pendamaian diadakan.
theological_decisions:
- issue: Acuan bentuk pasif וְנִרְצָה
  choice: kurban itu akan diterima
  alternative: orang yang mempersembahkan itu akan diterima
  rationale: Dalam alur konteks, penerimaan kurban sebagai sarana pendamaian paling wajar. Namun, bentuk Ibrani memungkinkan penerimaan dipahami lebih langsung berlaku atas pembawa kurban; karena itu kemungkinan tersebut tidak dihapus, melainkan dicatat sebagai pembacaan alternatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah ritual “menumpangkan tangan”, “kurban bakaran”, dan “mengadakan pendamaian” dipertahankan karena dikenal luas serta cukup dekat dengan ungkapan Ibrani. Kata ganti “dia” dipakai secara netral menurut kaidah Indonesia.
