  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: id
  text: Ia harus membasuh bagian dalam dan kaki-kakinya dengan air. Lalu imam harus mempersembahkan semuanya dan membakarnya di atas mazbah. Itulah kurban bakaran, persembahan api[a], aroma yang menyenangkan bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “persembahan yang dibakar dengan api.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: isi perut
  rationale: Dalam konteks kurban, istilah ini menunjuk pada bagian-bagian dalam tubuh hewan. “Isi perut” konkret dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: הַכְּרָעַיִם
  choice: kaki-kakinya
  rationale: Istilah ini mengacu pada kaki, khususnya bagian bawah kaki hewan kurban. Bentuk dengan akhiran posesif memperjelas bahwa kaki itu milik hewan tersebut.
- source_word: יִרְחַץ בַּמָּיִם
  choice: harus dicuci dengan air
  rationale: Mempertahankan tindakan mencuci dan unsur instrumental “dengan air”; bentuk pasif alami karena pelakunya tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: וְהִקְרִיב
  choice: harus mempersembahkan
  rationale: Bentuk kausatif dari קרב dalam tata cara kurban berarti membawa mendekat atau menyajikan di hadapan mezbah. “Mempersembahkan” alami dalam konteks ritual dan tetap dibedakan dari tindakan membakar berikutnya.
- source_word: אֶת־הַכֹּל
  choice: semuanya
  rationale: Menjaga penekanan Ibrani bahwa seluruh bagian hewan yang telah disiapkan dipersembahkan.
- source_word: וְהִקְטִיר
  choice: membakarnya sampai menjadi asap
  rationale: Kata kerja kurban ini lebih khusus daripada sekadar “membakar”; tindakan itu membuat persembahan naik sebagai asap.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Menunjukkan lokasi pembakaran kurban. “Mazbah” merupakan istilah baku dan ringkas untuk altar kurban dalam bahasa Indonesia Alkitabiah.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Padanan yang mapan bagi jenis kurban yang seluruhnya dibakar dan naik sebagai asap.
- source_word: אִשֵּׁה
  choice: persembahan yang dibakar dengan api
  rationale: Menjaga kaitan langsung istilah Ibrani ini dengan api tanpa mengubahnya menjadi “persembahan makanan,” suatu penafsiran yang mungkin tetapi kurang langsung secara leksikal.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Mempertahankan metafora indrawi Ibrani sekaligus menyampaikan bahwa persembahan itu berkenan atau diterima.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” sehingga nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Bahasa antropomorfis dalam רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  alternative: aroma yang menenteramkan
  rationale: Terjemahan mempertahankan gambaran aroma sebagai ungkapan penerimaan ilahi tanpa menjelaskannya sebagai pernyataan harfiah mengenai fisiologi Allah.
- issue: Makna kultis אִשֵּׁה
  choice: persembahan yang dibakar dengan api
  alternative: persembahan makanan
  rationale: Hubungan leksikal dengan api dipertahankan dalam teks utama. Kemungkinan bentuk yang lebih padat dicatat tanpa memaksakan penafsiran bahwa istilah tersebut terutama berarti makanan bagi Allah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Istilah kultis “kurban bakaran” dan “mazbah” dipertahankan karena tepat dan dikenal, sedangkan struktur kalimat dibuat alami bagi pembaca umum. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
