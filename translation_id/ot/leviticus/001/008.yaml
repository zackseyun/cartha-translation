  text: וְ/עָרְכ֗וּ בְּנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים אֵ֚ת הַ/נְּתָחִ֔ים אֶת הָ/רֹ֖אשׁ וְ/אֶת הַ/פָּ֑דֶר עַל הָ/עֵצִים֙ אֲשֶׁ֣ר עַל הָ/אֵ֔שׁ אֲשֶׁ֖ר עַל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: id
  text: Lalu putra-putra Harun, yaitu para imam, harus menata potongan-potongan itu, kepala, dan bagian lemaknya[a] di atas kayu yang berada di atas api, yang berada di atas mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lemak kerasnya” atau “lapisan lemaknya”; istilah Ibrani ini menunjuk pada bagian berlemak dari hewan yang digunakan dalam persembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: Lalu ... harus mengatur
  rationale: Kata ערך dalam tata cara kurban berarti menata atau menyusun dengan teratur. Bentuk 'harus mengatur' menyampaikan kewajiban prosedural, sedangkan וְ diterjemahkan 'Lalu' sebagai penghubung urutan tindakan.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: anak-anak Harun, yaitu para imam
  rationale: 'Frasa ini bersifat aposisional: anak-anak Harun diidentifikasi sebagai para imam. ''Yaitu'' memperjelas hubungan tersebut secara alami dalam bahasa Indonesia.'
- source_word: הַנְּתָחִים
  choice: potongan-potongan itu
  rationale: נְתָחִים menunjuk pada bagian-bagian hewan yang telah dipotong dalam langkah sebelumnya. Bentuk ulang lazim untuk benda jamak dalam bahasa Indonesia, dan 'itu' menandai potongan yang sudah disebut dalam konteks.
- source_word: הָרֹאשׁ
  choice: kepala
  rationale: Padanan anatomis langsung yang sesuai dengan makna sumber.
- source_word: הַפָּדֶר
  choice: lemaknya
  rationale: פָּדֶר menunjuk pada bagian berlemak dari hewan kurban, mungkin lemak keras atau lapisan lemak. 'Lemaknya' mudah dipahami dan akhiran -nya mengaitkannya dengan hewan kurban; ketidakpastian anatomis dipertahankan dalam catatan kaki.
- source_word: עַל הָעֵצִים
  choice: di atas kayu
  rationale: עֵצִים merupakan bentuk jamak yang dalam konteks ini menunjuk secara kolektif pada kayu bakar. 'Di atas kayu' mempertahankan hubungan ruang yang dinyatakan oleh עַל.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: yang ada di atas api yang ada di atas mazbah
  rationale: 'Dua klausa relatif berurutan dipertahankan untuk mencerminkan gambaran ruang sumber: kayu berada di atas api, dan api berada di atas mazbah. Pengulangan tidak dihaluskan agar ketepatan prosedural teks tetap terlihat.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada prosedural. 'Mazbah' dipakai sebagai istilah ringkas dan bermartabat bagi mezbah kurban. Struktur relatif yang berulang sengaja dipertahankan karena mencerminkan susunan spasial teks Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang dijelaskan.
