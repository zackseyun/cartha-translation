  yaml_path: translation/ot/leviticus/001/006.yaml
  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: id
  text: Kemudian ia harus menguliti kurban bakaran itu[a] dan memotongnya menjadi bagian-bagiannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menanggalkan kulit kurban bakaran itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “memotongnya menjadi potongan-potongannya,” yaitu membagi binatang itu menjadi beberapa bagian untuk dipersembahkan.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: Kemudian ia harus menguliti
  rationale: Dalam konteks persembahan kurban, bentuk Hifil dari פשט berarti melepaskan kulit binatang. 'Menguliti' adalah padanan Indonesia yang alami, jelas, dan konkret.
- source_word: הָעֹלָה
  choice: kurban bakaran itu
  rationale: עֹלָה adalah istilah baku bagi persembahan yang dibakar seluruhnya. 'Kurban bakaran' mempertahankan istilah ritual secara ringkas dan mudah dipahami; penunjuk 'itu' mewakili artikel Ibrani dan merujuk pada kurban yang telah disebut.
- source_word: וְנִתַּח
  choice: dan memotongnya
  rationale: נתח menunjuk pada tindakan memotong binatang menjadi beberapa bagian untuk kurban. 'Memotongnya' alami dalam bahasa Indonesia, sedangkan frasa berikutnya menjelaskan hasil pembagiannya.
- source_word: לִנְתָחֶיהָ
  choice: menjadi bagian-bagiannya
  rationale: 'Kata נתח berarti potongan atau bagian. Preposisi ל di sini menyatakan hasil pembagian: binatang itu dipotong menjadi bagian-bagiannya.'
- source_word: וְ
  choice: Kemudian
  rationale: Konjungsi ini menghubungkan perintah tersebut secara berurutan dengan ayat sebelumnya. 'Kemudian' memperjelas urutan prosedurnya dalam bahasa Indonesia.
