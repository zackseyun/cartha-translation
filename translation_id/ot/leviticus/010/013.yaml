  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: id
  text: Engkau dan anak-anak lelakimu harus memakannya di tempat yang kudus, sebab itu adalah bagianmu dan bagian anak-anak lelakimu dari persembahan-persembahan yang dibakar bagi Yahweh[a], karena demikianlah aku diperintahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari persembahan makanan bagi Yahweh.”
    reason: Alternatif leksikal/kategoris untuk אִשֵּׁי; terjemahan utama mempertahankan hubungan istilah itu dengan persembahan melalui api.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Kamu harus memakannya
  rationale: Bentuk verba ini menyampaikan instruksi kepada pihak jamak maskulin. Dalam bahasa Indonesia, “harus” menyatakan kewajiban dengan wajar; akhiran “-nya” sekaligus mewakili objek feminin tunggal אֹתָהּ yang merujuk pada bagian persembahan tersebut.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: di tempat yang kudus
  rationale: Frasa Ibrani tidak memakai artikel tertentu. “Tempat yang kudus” mempertahankan ketidakspesifikan itu dan menjaga register peribadatan tanpa mempersempitnya menjadi suatu ruangan tertentu.
- source_word: חָקְךָ ... וְחָק בָּנֶיךָ
  choice: bagianmu dan bagian anak-anak lelakimu
  rationale: Dalam konteks keimaman, חֹק menunjuk pada jatah atau bagian yang ditetapkan. “Bagian” alami dan jelas dalam bahasa Indonesia. “Anak-anak lelakimu” mempertahankan rujukan eksplisit kepada anak laki-laki Harun dalam pelayanan imam.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: dari persembahan makanan bagi Yahweh
  rationale: Ungkapan ini menunjuk pada kategori persembahan kurban milik Yahweh yang darinya imam menerima bagian. “Persembahan makanan” menyampaikan fungsi kultisnya secara wajar, sedangkan nuansa pembakaran dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: karena demikianlah aku diperintahkan
  rationale: Terjemahan ini mempertahankan hubungan penjelas כִּי כֵן dan bentuk pasif yang menyatakan bahwa Musa menerima perintah tersebut.
theological_decisions:
- issue: Makna חֹק dalam konteks keimaman
  choice: bagian
  alternative: jatah; hak; ketetapan
  rationale: Ayat ini membicarakan bagian konkret dari persembahan yang ditetapkan bagi para imam, bukan terutama ketetapan hukum secara abstrak.
- issue: Makna אִשֵּׁי יְהוָה
  choice: persembahan makanan bagi Yahweh
  alternative: persembahan yang dibakar bagi Yahweh
  rationale: Pilihan utama mengungkapkan kategori persembahan secara jelas bagi pembaca modern, sementara terjemahan yang lebih harfiah dan berorientasi pada api dipertahankan dalam catatan kaki agar rentang maknanya tetap dapat diperiksa.
- issue: Rujukan בָּנֶיךָ
  choice: anak-anak lelakimu
  alternative: anak-anakmu
  rationale: Teks Ibrani secara khusus menyebut anak laki-laki Harun, sesuai dengan konteks jabatan imam; bentuk yang netral gender akan mengaburkan kekhususan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “kamu” dipertahankan karena perintah diarahkan kepada lebih dari satu orang, sedangkan bentuk kepunyaan tunggal pada “bagianmu” dan “anak-anak lelakimu” mengikuti peralihan gramatikal dalam teks Ibrani yang berfokus kepada Harun. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
