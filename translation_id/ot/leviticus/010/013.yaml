  naturalness: ‘Engkau dan anak-anak lelakimu harus ...’ secara alami mengungkapkan perintah jamak sambil mempertahankan kepunyaan tunggal yang tertuju kepada Harun. ‘Persembahan-persembahan yang dibakar bagi Yahweh’ jelas, baku, dan sesuai register kultis.
