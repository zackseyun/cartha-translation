  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: id
  text: Jangan keluar dari pintu masuk Kemah Pertemuan, supaya kalian tidak mati, sebab minyak pengurapan Yahweh ada pada kalian.” Mereka pun melakukan sesuai dengan perkataan Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח אֹהֶל מוֹעֵד
  choice: dari pintu masuk Kemah Pertemuan
  rationale: פֶּתַח menunjuk pada pintu atau jalan masuk, sedangkan אֹהֶל מוֹעֵד adalah sebutan baku bagi tempat kudus itu. Konjungsi awal tidak perlu diterjemahkan tersendiri karena ayat ini melanjutkan langsung larangan sebelumnya.
- source_word: לֹא תֵצְאוּ
  choice: Jangan keluar
  rationale: Bentuk negatif ini menyampaikan larangan langsung kepada lebih dari satu orang; 'jangan' merupakan bentuk alami dan tegas dalam bahasa Indonesia modern.
- source_word: פֶּן תָּמֻתוּ
  choice: supaya kalian tidak mati
  rationale: פֶּן memperkenalkan akibat yang hendak dihindari. Pilihan ini mempertahankan fungsi peringatan tanpa membuat kematian terdengar sebagai akibat yang secara eksplisit dipastikan oleh bentuk sumber.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memberikan alasan bagi larangan tersebut; 'sebab' jelas, ringkas, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: minyak pengurapan Yahweh
  rationale: Rangkaian konstruksi ini menunjuk pada minyak kudus untuk pengurapan yang terkait dengan atau ditetapkan oleh Yahweh. Ungkapan Indonesia ini dekat dengan bentuk Ibrani dan tetap alami.
- source_word: עֲלֵיכֶם
  choice: ada pada kalian
  rationale: Frasa ini menyatakan bahwa minyak pengurapan itu berada pada mereka sebagai imam yang telah ditahbiskan. 'Pada kalian' mempertahankan gambaran konkret teks.
- source_word: וַיַּעֲשׂוּ כִּדְבַר מֹשֶׁה
  choice: Mereka pun melakukan sesuai dengan perkataan Musa
  rationale: וַיַּעֲשׂוּ melanjutkan narasi dan כִּדְבַר menyatakan kesesuaian dengan perkataan atau perintah Musa. 'Pun' menghubungkan tindakan mereka secara alami dengan instruksi sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Makna minyak pengurapan yang 'ada pada' para imam
  choice: mempertahankan gambaran konkret tanpa menambahkan penjelasan teologis
  alternative: menguraikannya sebagai tanda penahbisan atau kekudusan mereka di dalam teks utama
  rationale: Konteks memang berkaitan dengan penahbisan imam, tetapi ayat ini sendiri hanya menyatakan bahwa minyak pengurapan Yahweh ada pada mereka. Terjemahan tidak menambahkan kesimpulan yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk menandai bahwa perintah ditujukan kepada lebih dari satu orang, sesuai bentuk verba Ibrani. Kapitalisasi 'Kemah Pertemuan' mempertahankan fungsinya sebagai sebutan khusus tempat kudus.
