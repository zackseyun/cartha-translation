    rationale: Partisip ini secara harfiah berarti “yang tersisa/yang masih ada.” Walaupun latar langsungnya adalah kematian Nadab dan Abihu, “yang masih hidup” merupakan eksplisitasi kontekstual yang lebih sempit daripada bentuk sumber.
  - severity: medium
    issue: Catatan kaki menerangkan אִשֵּׁי sebagai kemungkinan “persembahan makanan”
    rationale: Dalam terminologi kultis Ibrani, אִשֵּׁי lazimnya menunjuk pada persembahan yang dipersembahkan dengan api. “Persembahan makanan” dapat menyesatkan pembaca dan tidak cocok sebagai alternatif bagi pilihan utama yang menonjolkan api.
