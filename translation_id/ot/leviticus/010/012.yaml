revisions:
- from: Lalu Musa berkata kepada Harun dan kepada Eleazar serta Itamar, anak-anak Harun yang masih hidup, “Ambillah kurban sajian yang tersisa dari persembahan yang dibakar bagi Yahweh[a]. Makanlah itu tanpa ragi di samping mezbah, sebab kurban itu mahakudus.”
  to: Lalu Musa berkata kepada Harun, Eleazar, dan Itamar, anak-anak Harun yang tersisa, “Ambillah kurban sajian yang tersisa dari persembahan yang dipersembahkan dengan api kepada Yahweh[a]. Makanlah itu tanpa ragi di samping mezbah, sebab kurban itu mahakudus.”
  rationale: Revisi mempertahankan makna naratif dan istilah kultis, sambil menerjemahkan הַנּוֹתָרִים dengan lebih dekat sebagai “yang tersisa.” Frasa bagi אִשֵּׁי diperjelas sebagai persembahan yang dipersembahkan dengan api, dan catatan kaki diganti dengan alternatif formal yang tidak mengaburkan makna istilah Ibrani.
