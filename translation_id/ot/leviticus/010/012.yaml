  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: id
  text: Lalu Musa berkata kepada Harun, Eleazar, dan Itamar, anak-anak Harun yang tersisa, “Ambillah kurban sajian yang tersisa dari persembahan yang dipersembahkan dengan api kepada Yahweh[a]. Makanlah itu tanpa ragi di samping mezbah, sebab kurban itu mahakudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dari persembahan-persembahan api Yahweh.”
    reason: alternatif_leksikal
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu Musa berkata
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa. “Lalu” menyatakan urutan secara wajar dalam bahasa Indonesia.
- source_word: הַנּוֹתָרִים
  choice: anak-anak Harun yang masih hidup
  rationale: Partisip ini menunjuk kepada Eleazar dan Itamar sebagai putra-putra Harun yang tersisa sesudah kematian Nadab dan Abihu. Nama Harun diulangi agar rujukan pronomina tidak rancu dalam bahasa Indonesia.
- source_word: הַמִּנְחָה
  choice: kurban sajian
  rationale: Dalam konteks hukum kurban Imamat, istilah ini menunjuk kepada persembahan berbahan hasil tanaman, bukan persembahan secara umum. “Kurban sajian” merupakan padanan yang ringkas dan lazim dalam register Alkitab bahasa Indonesia.
- source_word: הַנּוֹתֶרֶת
  choice: yang tersisa
  rationale: Partisip feminin ini menerangkan kurban sajian, yakni bagian yang masih ada setelah bagian bagi Yahweh dipersembahkan.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: dari persembahan yang dibakar bagi Yahweh
  rationale: Padanan ini mempertahankan hubungan istilah אִשֶּׁה dengan api dan menyatakan bahwa persembahan itu ditujukan kepada Yahweh. Alternatif “persembahan makanan” dicatat karena istilah tersebut juga dapat dipahami sebagai sajian kurban bagi Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְאִכְלוּהָ מַצּוֹת
  choice: Makanlah itu tanpa ragi
  rationale: Bentuk מַצּוֹת berfungsi secara predikatif atau adverbial dan menyatakan bahwa kurban tersebut harus dimakan dalam keadaan tidak beragi.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: di samping mezbah
  rationale: אֵצֶל menyatakan kedekatan tempat; “di samping” mempertahankan arti itu secara alami.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Ungkapan superlatif Ibrani ini menyatakan tingkat kekudusan tertinggi. “Mahakudus” ringkas dan sesuai untuk status kurban tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Rujukan הַנּוֹתָרִים setelah kematian Nadab dan Abihu
  choice: yang masih hidup
  alternative: yang tersisa
  rationale: Dalam konteks langsung, ungkapan ini mengidentifikasi Eleazar dan Itamar sebagai putra-putra Harun yang tetap hidup. Pilihan ini menyampaikan konteks tanpa menambahkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Istilah kultis “kurban sajian,” “mezbah,” dan “mahakudus” dipertahankan karena tepat dan cukup dikenal. Pengulangan “Harun” menghindari kerancuan rujukan kata ganti.
