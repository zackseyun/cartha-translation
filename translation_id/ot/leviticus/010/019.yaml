  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: id
  text: Lalu Harun berkata kepada Musa, “Lihat, hari ini mereka telah mempersembahkan korban penghapus dosa[a] dan korban bakaran mereka di hadapan Yahweh, dan hal-hal seperti ini telah menimpa aku.[b] Seandainya hari ini aku memakan korban penghapus dosa itu[a], apakah itu akan baik di mata Yahweh?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “korban pemurnian” (juga pada kemunculan kedua). Kata Ibrani חַטָּאת dapat berarti “dosa” atau korban yang berkaitan dengan pemurnian dari dosa atau kenajisan; dalam kitab Imamat, “korban penghapus dosa” merupakan terjemahan yang lazim.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan hal-hal seperti ini telah terjadi kepadaku.” Harun merujuk kepada malapetaka pada hari itu, terutama kematian anak-anaknya.
    reason: cultural_note
  - marker: c
    text: Atau “apakah itu akan berkenan kepada Yahweh?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihat
  rationale: Partikel ini menarik perhatian kepada penjelasan Harun. “Lihat” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya serunya.
- source_word: הִקְרִיבוּ
  choice: telah mempersembahkan
  rationale: Bentuk Hifil dari קרב memiliki arti teknis mempersembahkan atau membawa mendekat dalam konteks kurban.
- source_word: חַטָּאתָם / חַטָּאת
  choice: korban penghapus dosa mereka / korban penghapus dosa itu
  rationale: Dalam konteks kurban Imamat, חַטָּאת menunjuk kepada kurban, bukan kepada dosa sebagai gagasan abstrak. Pilihan ini jelas bagi pembaca Indonesia dan tetap menandai kaitannya dengan dosa; alternatif “korban pemurnian” dicatat.
- source_word: עֹלָתָם
  choice: korban bakaran mereka
  rationale: Istilah ini adalah sebutan baku dan mudah dipahami untuk kurban yang dibakar di atas mazbah.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan ungkapan kultis tentang persembahan yang dilakukan dalam hadirat Yahweh.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: dan hal-hal seperti ini telah menimpa aku
  rationale: Ungkapan ini menunjuk kepada berbagai malapetaka yang dialami Harun pada hari itu. “Menimpa aku” merupakan padanan idiomatis tanpa membatasi acuannya hanya pada satu peristiwa.
- source_word: וְאָכַלְתִּי
  choice: Seandainya ... aku memakan
  rationale: Walaupun bentuknya waw ditambah qatal, konteks pertanyaan retoris mendukung nuansa pengandaian yang berlawanan dengan kenyataan.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: apakah itu akan baik di mata Yahweh
  rationale: Mempertahankan metafora Ibrani mengenai penilaian dan persetujuan ilahi, sambil tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Dasar pembelaan Harun karena tidak memakan kurban
  choice: Pertanyaan Harun mengaitkan malapetaka hari itu dengan keraguannya bahwa memakan kurban akan baik di mata Yahweh.
  alternative: Harun hanya mengungkapkan dukacita pribadi, atau mempertanyakan kelayakan ritual dirinya dalam keadaan itu.
  rationale: Teks tidak menjelaskan apakah masalahnya terutama status ritual, keadaan berkabung, atau kepatutan yang lebih luas. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur pertanyaan retoris serta pengulangan istilah kurban dipertahankan. Ungkapan “baik di mata Yahweh” sengaja mempertahankan citra bahasa Ibrani tanpa menjelaskan secara berlebihan alasan ritual atau emosional Harun.
