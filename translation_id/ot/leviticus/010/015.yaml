id: LEV.10.15
reference: Leviticus 10:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: id
  text: Paha persembahan khusus dan dada persembahan unjukan harus mereka bawa bersama persembahan api berupa bagian-bagian lemak, untuk diunjukkan sebagai persembahan unjukan di hadapan Yahweh. Bagian-bagian itu menjadi hakmu dan hak anak-anakmu yang bersamamu sebagai ketetapan untuk selamanya, seperti yang diperintahkan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹק
  choice: paha
  rationale: Dalam konteks pembagian daging kurban, kata ini menunjuk bagian atas kaki belakang; “paha” lebih tepat daripada istilah umum “kaki”.
- source_word: תְּרוּמָה
  choice: persembahan khusus
  rationale: Menunjuk bagian yang dipisahkan dan diserahkan sebagai persembahan; ungkapan ini jelas dalam bahasa Indonesia modern tanpa memaksakan gambaran gerak ritual yang tidak pasti.
- source_word: חָזֶה
  choice: dada
  rationale: Padanan anatomis yang lazim dan tepat dalam konteks kurban.
- source_word: תְּנוּפָה / לְהָנִיף
  choice: persembahan unjukan / diunjukkan
  rationale: Mempertahankan hubungan antara nomina dan verba serumpun serta nuansa tindakan penyajian ritual di hadapan Yahweh.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: bersama persembahan api berupa bagian-bagian lemak
  rationale: “Bersama” menyampaikan hubungan penyertaan secara alami; “persembahan api” mempertahankan istilah kultis אִשֶּׁה, sedangkan “bagian-bagian lemak” menunjuk potongan kurban yang dibakar.
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ
  choice: Bagian-bagian itu menjadi hakmu dan hak anak-anakmu yang bersamamu
  rationale: Menjelaskan hak imam atas kedua bagian kurban dalam bahasa Indonesia yang alami; bentuk kolektif merujuk pada paha dan dada yang baru disebutkan.
- source_word: לְחָק עוֹלָם
  choice: sebagai ketetapan untuk selamanya
  rationale: Menyampaikan ketentuan yang bersifat terus berlaku tanpa memakai diksi yang usang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tampil langsung dalam teks Ibrani.
theological_decisions:
- issue: Pengungkapan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH; “Yahweh” mempertahankan nama itu secara langsung dan konsisten.
- issue: Makna ritual תְּנוּפָה dan לְהָנִיף
  choice: persembahan unjukan / diunjukkan
  alternative: persembahan timangan / ditimang; persembahan penyajian / disajikan
  rationale: “Unjukan” mempertahankan tindakan ritual tanpa memastikan pola gerakan tertentu yang tidak dijelaskan oleh ayat ini, sekaligus menjaga pengulangan akar kata dalam bahasa sumber.
- issue: Cakupan חָק עוֹלָם
  choice: ketetapan untuk selamanya
  alternative: ketetapan kekal
  rationale: Terjemahan ini mempertahankan klaim duratif teks dalam tatanan peribadatan Israel tanpa menambahkan penjelasan teologis mengenai penerapannya di luar konteks ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah kurban dibuat cukup transparan bagi pembaca umum, sementara istilah teknis “persembahan unjukan” dipertahankan karena verba dan nominanya sengaja diulang dalam bahasa Ibrani. Tidak ada catatan kaki karena alternatif utama dapat dicatat dalam keputusan leksikal tanpa membebani teks ayat.
