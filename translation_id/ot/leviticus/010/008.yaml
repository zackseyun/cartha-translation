  text: And Yahweh spoke to Aaron[a], saying,
translation:
  language: id
  text: 'Kemudian Yahweh[a] berfirman kepada Harun:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; dapat juga ditransliterasikan sebagai “Yehuwa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Kemudian” menyatakan urutan peristiwa secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang lazim dan bermartabat untuk ujaran ilahi dalam formula ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai orang yang menjadi tujuan ujaran; “kepada” adalah padanan Indonesia yang alami.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Nama ini memakai bentuk Indonesia yang sudah baku dan dikenal luas.
- source_word: לֵאמֹר
  choice: (tidak dinyatakan tersendiri)
  rationale: Infinitif לֵאמֹר memperkenalkan isi perkataan yang menyusul. Dalam bahasa Indonesia, fungsi tersebut sudah tersampaikan secara alami oleh konstruksi “berfirman kepada Harun” dan tanda koma; menerjemahkannya secara harfiah sebagai “dengan berkata” akan terasa kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar; catatan kaki memberitahukan bentuk Ibraninya dan alternatif transliterasi.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Berfirman” mempertahankan corak formula ujaran ilahi, sementara “Kemudian” mengalirkan narasi secara wajar. Penanda catatan kaki ditempatkan sesudah “Harun” mengikuti lapisan konsultasi yang diberikan, meskipun isi catatan menerangkan nama “Yahweh”.
