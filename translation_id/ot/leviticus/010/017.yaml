id: LEV.10.17
reference: Leviticus 10:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: id
  text: Mengapa kalian tidak memakan kurban penghapus dosa[a] itu di tempat kudus? Sebab kurban itu mahakudus, dan Dia telah memberikannya kepada kalian untuk menanggung kesalahan umat serta mengadakan pendamaian bagi mereka di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban pentahiran.” Istilah Ibrani חַטָּאת dapat menunjuk pada kurban yang berkaitan dengan penghapusan kenajisan maupun penanganan dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: Mengapa kalian tidak memakan
  rationale: Pertanyaan langsung bernada teguran. Bentuk 'kalian' menyatakan orang kedua jamak dalam bahasa Indonesia modern.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks ini kata tersebut jelas menunjuk pada kurban. Pilihan ini mempertahankan kaitannya dengan dosa, sedangkan kemungkinan nuansa pentahiran dicatat dalam catatan kaki.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Menunjuk pada kawasan suci yang ditetapkan sebagai tempat para imam memakan kurban.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Ungkapan superlatif Ibrani yang menyatakan tingkat kekudusan tertinggi; 'mahakudus' alami dan ringkas dalam bahasa Indonesia.
- source_word: נָתַן לָכֶם
  choice: Dia telah memberikannya kepada kalian
  rationale: Verba orang ketiga tunggal tidak menyebut subjek secara eksplisit, tetapi konteks mengarah kepada Allah. Huruf kapital membantu menunjukkan rujukan tersebut tanpa menambahkan nama pada teks.
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: untuk menanggung kesalahan umat
  rationale: נשא עון menyatakan menanggung kesalahan atau akibat kesalahan dalam konteks perwakilan ritual. 'Kesalahan' mempertahankan keluasan עָוֹן tanpa membatasinya hanya pada perasaan bersalah atau hukuman.
- source_word: הָעֵדָה
  choice: umat
  rationale: Dalam konteks Israel sebagai komunitas perjanjian, 'umat' lebih alami bagi pembaca Indonesia daripada 'jemaat' dan tidak membawa asosiasi gerejawi yang tidak perlu.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: mengadakan pendamaian bagi mereka
  rationale: Ungkapan baku yang mempertahankan bobot ritual כפר tanpa menentukan secara sempit mekanisme pendamaian.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Menerjemahkan nama ilahi secara langsung dan mempertahankan gagasan tindakan ritual dalam hadirat-Nya.
theological_decisions:
- issue: Makna חַטָּאת dalam hukum kurban
  choice: kurban penghapus dosa
  alternative: kurban pentahiran
  rationale: Referennya sebagai kurban sudah pasti, tetapi istilah Ibrani dapat menonjolkan penanganan dosa maupun pentahiran. Teks utama memakai istilah yang mudah dikenali, sementara alternatifnya dipertahankan dalam catatan kaki.
- issue: Subjek tersirat pada נָתַן
  choice: Dia, merujuk kepada Allah
  alternative: 'bentuk pasif: kurban itu telah diberikan kepada kalian'
  rationale: Bentuk Ibrani memakai verba orang ketiga tunggal tanpa subjek tertulis. Konteks paling wajar menunjuk kepada Allah, tetapi rujukan itu tidak diperluas dengan tambahan penjelasan teologis.
- issue: Fungsi imam dalam לָשֵׂאת אֶת עֲוֺן
  choice: menanggung kesalahan umat
  alternative: menanggung hukuman umat
  rationale: Teks menyatakan fungsi perwakilan ritual, tetapi tidak secara eksplisit menyamakan tindakan imam dengan menerima hukuman umat. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kurban' mengikuti ejaan baku; 'kalian' menyatakan bentuk jamak Ibrani dengan jelas. Struktur teguran dan alasan ritual dipertahankan secara langsung.
