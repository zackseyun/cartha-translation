  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: id
  text: Kamu bersama anak-anakmu laki-laki dan perempuan harus memakan dada persembahan unjukan[a] dan paha persembahan angkatan[b] di tempat yang tahir. Sebab, semuanya itu telah diberikan sebagai bagianmu dan bagian anak-anakmu laki-laki dari kurban-kurban keselamatan[c] umat Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dada yang diunjukkan.” Istilah Ibraninya menunjuk bagian yang secara ritual diayun atau diunjukkan di hadapan TUHAN.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “paha persembahan khusus.” Istilah Ibraninya menunjuk sesuatu yang diangkat atau dikhususkan sebagai bagian yang menjadi hak imam.'
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani ini juga dapat diterjemahkan “persembahan pendamaian” atau “persembahan persekutuan”; maknanya dapat mencakup damai, keutuhan, dan kesejahteraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: dada persembahan unjukan
  rationale: חֲזֶה menunjuk bagian dada hewan, sedangkan תְּנוּפָה adalah tindakan ritual mengunjukkan atau mengayunkannya di hadapan TUHAN. Istilah baku 'persembahan unjukan' mempertahankan sifat ritualnya.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: paha persembahan khusus
  rationale: שׁוֹק menunjuk paha atau tungkai, sedangkan תְּרוּמָה ialah sesuatu yang diangkat, dipisahkan, atau diserahkan sebagai hak imam. 'Persembahan khusus' terdengar alami tanpa menghilangkan gagasan bahwa bagian itu dikhususkan.
- source_word: תֹּאכְלוּ
  choice: harus memakan
  rationale: Bentuk imperfek ini berfungsi sebagai instruksi dalam konteks hukum; 'harus memakan' menyampaikan daya perintahnya secara wajar dalam bahasa Indonesia.
- source_word: בְּמָקוֹם טָהוֹר
  choice: di tempat yang tahir
  rationale: טָהוֹר dalam konteks Imamat terutama menyangkut ketahiran ritual. 'Tahir' mempertahankan istilah kultis tanpa menambahkan penjelasan yang tidak dinyatakan.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: kamu, anak-anakmu laki-laki, dan anak-anakmu perempuan yang bersamamu
  rationale: Terjemahan mempertahankan penyebutan eksplisit anak laki-laki dan perempuan serta unsur 'bersamamu' dalam sumber.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: kepadamu dan kepada anak-anakmu laki-laki sebagai bagian yang menjadi hak kalian
  rationale: חֹק di sini menunjuk jatah atau hak yang telah ditetapkan, bukan terutama sebuah ketetapan hukum. Susunan ini menghindari pengulangan kaku sekaligus mempertahankan bahwa pemberian tersebut diperuntukkan bagi Harun dan anak-anak lelakinya.
- source_word: נִתְּנוּ
  choice: telah diberikan
  rationale: Bentuk pasif perfektif menyatakan pemberian yang sudah ditetapkan dan tetap berlaku.
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: dari kurban-kurban persembahan keselamatan
  rationale: זִבְחֵי menunjuk kurban-kurban sembelihan, sedangkan שְׁלָמִים memiliki medan makna damai, keutuhan, dan kesejahteraan. 'Persembahan keselamatan' mempertahankan keluasan itu lebih baik daripada terjemahan yang hanya menekankan persekutuan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan Ibrani ini merupakan sebutan kolektif konvensional bagi bangsa Israel. 'Umat Israel' menyampaikan rujukan korporatnya secara alami dalam bahasa Indonesia tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
theological_decisions:
- issue: Cakupan sebutan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak Israel / orang Israel
  rationale: Dalam ungkapan etnis kolektif ini, bentuk filial maskulin merupakan idiom bagi seluruh umat. Terjemahan alami 'umat Israel' mempertahankan cakupan korporat tanpa membuat penegasan gender yang tidak dimaksudkan konteks.
- issue: Makna שְׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan pendamaian / persembahan persekutuan
  rationale: Istilah Ibrani dapat berkaitan dengan damai, keutuhan, kesejahteraan, dan persekutuan. 'Keselamatan' dipakai dalam arti keadaan aman dan sejahtera, sementara catatan kaki menjaga keluasan semantiknya dan tidak membatasi istilah itu pada satu teori teologis.
- issue: Penerima jatah imam
  choice: kepadamu dan kepada anak-anakmu laki-laki sebagai bagian yang menjadi hak kalian
  alternative: bagianmu dan bagian anak-anakmu laki-laki
  rationale: Teks membedakan siapa yang boleh makan—termasuk anak perempuan—dari siapa yang secara formal menerima jatah itu, yaitu Harun dan anak-anak lelakinya. Pembedaan ini dipertahankan tanpa menyimpulkan lebih jauh tentang status para anak perempuan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-kultis yang bermartabat. 'Tahir', 'kurban', dan 'persembahan unjukan' dipertahankan sebagai istilah keagamaan yang ringkas; struktur kalimat dibagi dua agar mudah dipahami pembaca umum.
