id: LEV.10.1
reference: Leviticus 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: id
  text: Kemudian Nadab dan Abihu, anak-anak Harun, masing-masing mengambil perbaraannya, menaruh api di dalamnya, membubuhkan dupa di atasnya, lalu mempersembahkan di hadapan Yahweh api yang tidak diperkenankan[a], yang tidak diperintahkan-Nya kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “api asing”; dapat juga diterjemahkan “api yang tidak sah”. Klausa berikutnya menerangkan bahwa Yahweh tidak memerintahkannya kepada mereka.
    reason: Menjaga metafora dan alternatif leksikal dari אֵשׁ זָרָה sekaligus menjelaskan dasar terjemahan kontekstual dalam teks utama.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: mengambil
  rationale: Verba naratif dasar לקח paling wajar diterjemahkan 'mengambil' dalam rangkaian tindakan ini.
- source_word: בְנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Menerjemahkan frasa konstruksi secara alami dan tetap mempertahankan hubungan keluarga.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadab dan Abihu
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: masing-masing mengambil perbaraannya
  rationale: אִישׁ bersifat distributif, sedangkan מַחְתָּה menunjuk wadah untuk membawa bara; 'perbaraan' merupakan istilah Indonesia yang ringkas dan sesuai konteks ritual.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: menaruh api di dalamnya
  rationale: Mengungkapkan נתן + ב secara alami; bentuk tunggal distributif 'di dalamnya' mengacu pada perbaraan masing-masing.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: membubuhkan dupa di atasnya
  rationale: Mempertahankan tindakan menaruh dupa di atas api atau perbaraan tanpa menjelaskan lebih jauh daripada teks.
- source_word: וַיַּקְרִבוּ
  choice: mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks ibadah berarti membawa atau menyajikan sebagai persembahan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Menerjemahkan ungkapan kultis לִפְנֵי secara langsung dan mempertahankan nama ilahi.
- source_word: אֵשׁ זָרָה
  choice: api yang tidak diperkenankan
  rationale: Dalam konteks keimaman, זָרָה menyatakan sesuatu di luar ketetapan atau kewenangan sakral. Pilihan ini menyampaikan pelanggaran tersebut tanpa menyiratkan bahwa apinya semata-mata ganjil atau berasal dari bangsa asing.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: yang tidak diperintahkan-Nya kepada mereka
  rationale: Mempertahankan klausa relatif serta objek eksplisit 'mereka'; bentuk hormat '-Nya' merujuk kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna אֵשׁ זָרָה
  choice: api yang tidak diperkenankan
  alternative: api asing; api yang aneh; api yang tidak sah
  rationale: Klausa berikutnya menjelaskan bahwa pelanggarannya berkaitan dengan apa yang tidak diperintahkan Yahweh. Terjemahan utama menyampaikan daya legal-kultis sambil mempertahankan alternatif harfiah dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Urutan tindakan Ibrani dipertahankan. Bentuk tunggal distributif digunakan sesudah 'masing-masing', dan ambiguitas mengenai sifat tepat api tersebut tidak diperluas menjadi rincian yang tidak dinyatakan teks.
