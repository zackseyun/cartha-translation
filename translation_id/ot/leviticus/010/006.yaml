  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל אַהֲרֹ֡ן וּ/לְ/אֶלְעָזָר֩ וּ/לְ/אִֽיתָמָ֨ר בָּנָ֜י/ו רָֽאשֵׁי/כֶ֥ם אַל תִּפְרָ֣עוּ וּ/בִגְדֵי/כֶ֤ם לֹֽא תִפְרֹ֨מוּ֙ וְ/לֹ֣א תָמֻ֔תוּ וְ/עַ֥ל כָּל הָ/עֵדָ֖ה יִקְצֹ֑ף וַ/אֲחֵי/כֶם֙ כָּל בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת הַ/שְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהוָֽה־׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: id
  text: Lalu Musa berkata kepada Harun serta kepada Eleazar dan Itamar, anak-anak Harun, “Jangan biarkan rambut kalian terurai[a] dan jangan koyakkan pakaian kalian, agar kalian tidak mati dan murka tidak menimpa seluruh umat. Namun, saudara-saudara kalian, seluruh kaum Israel, akan menangisi api yang telah Yahweh nyalakan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan buka penutup kepala kalian” atau “Jangan biarkan rambut kalian tidak terurus.” Ungkapan Ibrani merujuk pada tanda berkabung yang melibatkan kepala atau rambut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pembakaran yang dibakar Yahweh”; “api yang telah Yahweh nyalakan” dipakai agar ungkapannya wajar dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: Jangan biarkan rambutmu terurai
  rationale: Ungkapan ini menunjuk pada tindakan membiarkan rambut kepala terurai atau tidak terurus sebagai tanda berkabung. Terjemahan ini menyampaikan tindakan yang dimaksud secara wajar dalam bahasa Indonesia tanpa menetapkan bahwa penutup kepala harus dilepas.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: jangan koyakkan pakaianmu
  rationale: Kata kerja פרם berarti mengoyakkan pakaian, khususnya sebagai tanda berkabung. 'Koyakkan' mempertahankan nuansa ritual dan sesuai dengan ragam bahasa Alkitab yang tetap mudah dipahami.
- source_word: וְלֹא תָמֻתוּ
  choice: supaya kamu tidak mati
  rationale: Klausa ini menyatakan akibat yang hendak dihindari setelah dua larangan sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya peringatannya.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: dan murka menimpa seluruh umat
  rationale: Teks Ibrani memakai verba tunggal tanpa subjek yang dinyatakan. Terjemahan dengan nomina 'murka' mempertahankan ketidaktersuratan subjek dan menghasilkan kalimat Indonesia yang alami.
- source_word: וַאֲחֵיכֶם
  choice: saudara-saudaramu
  rationale: Bentuk Ibrani secara harfiah berarti 'saudara-saudaramu'; konteks dan aposisi berikutnya menunjukkan sesama anggota bangsa Israel.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: seluruh kaum Israel
  rationale: '''Kaum Israel'' merupakan ungkapan Indonesia yang alami bagi sebutan kolektif dan nasional ''segenap rumah Israel''.'
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: harus menangisi kebakaran
  rationale: שְׂרֵפָה menunjuk pada pembakaran atau kebakaran yang menewaskan Nadab dan Abihu. Terjemahan konkret ini tidak mengubahnya menjadi tafsiran abstrak seperti 'hukuman' atau 'bencana'.
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: yang dinyalakan Yahweh
  rationale: Bahasa Ibrani secara harfiah mengulang akar kata 'kebakaran yang dibakar Yahweh'. 'Dinyalakan' menghindari pengulangan yang janggal dalam bahasa Indonesia sambil tetap menyatakan tindakan dan pelaku ilahi secara langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Subjek verba יִקְצֹף tidak dinyatakan secara eksplisit
  choice: murka menimpa seluruh umat
  alternative: Ia murka terhadap seluruh umat
  rationale: Walaupun konteks mengisyaratkan Yahweh sebagai pihak yang murka, teks tidak menyatakan subjeknya. Rumusan nominal mempertahankan ketidaktersuratan itu tanpa mengaburkan ancaman hukuman ilahi.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; transliterasi mempertahankan fungsi nama tersebut dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan jamak dinyatakan melalui konteks dan nomina jamak, karena pronomina Indonesia tidak membedakan tunggal-jamak. 'Umat' dipilih untuk עֵדָה dalam arti komunitas Israel, sedangkan 'kaum Israel' mempertahankan ungkapan kolektif בֵּית יִשְׂרָאֵל.
