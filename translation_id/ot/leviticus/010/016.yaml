  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: id
  text: Musa sungguh-sungguh mencari kambing jantan kurban penghapus dosa[a] itu, dan ternyata kambing itu telah dibakar[b]. Maka Musa marah kepada Eleazar dan Itamar, anak-anak lelaki Harun yang tersisa[c], dengan berkata,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kambing jantan dari kurban penghapus dosa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “sudah dibakar.” Bentuk partisipel pasif Ibrani menggambarkan kambing itu dalam keadaan telah dibakar ketika ditemukan.'
    reason: lexical_alternative
  - marker: c
    text: “Anak-anak lelaki Harun yang tersisa” ialah Eleazar dan Itamar, yang tersisa setelah Nadab dan Abihu mati (Im. 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: kambing jantan untuk kurban penghapus dosa
  rationale: שְׂעִיר menunjuk pada kambing jantan, sedangkan חַטָּאת di sini adalah kategori kurban. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan jenis hewan serta fungsi ritualnya.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: mencari dengan sungguh-sungguh
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan Musa. Pilihan ini menyampaikan penekanan tersebut secara alami tanpa meniru pengulangan Ibrani secara kaku.
- source_word: וְהִנֵּה
  choice: tetapi ternyata
  rationale: הִנֵּה mengarahkan perhatian pada keadaan yang ditemukan secara mengejutkan. Dalam konteks ini, 'ternyata' menyampaikan penemuan tersebut, sedangkan 'tetapi' menandai pertentangan dengan pencarian Musa.
- source_word: שֹׂרָף
  choice: sudah dibakar habis
  rationale: Partisipel pasif ini menggambarkan kambing tersebut dalam keadaan telah dibakar. 'Dibakar habis' menangkap keadaan hasil tindakan itu, sementara catatan kaki menjaga kemungkinan terjemahan yang kurang tegas mengenai tingkat pembakarannya.
- source_word: וַיִּקְצֹף
  choice: marahlah Musa
  rationale: Verba ini menyatakan kemarahan. Susunan inversi merupakan bentuk naratif Indonesia yang wajar dan tidak melebih-lebihkan intensitasnya.
- source_word: הַנּוֹתָרִם
  choice: yang masih ada
  rationale: Partisipel ini mengidentifikasi Eleazar dan Itamar sebagai anak-anak Harun yang tersisa sesudah kematian Nadab dan Abihu. Pilihan ini jelas dan tidak seinterpretatif 'yang selamat'.
- source_word: לֵאמֹר
  choice: katanya,
  rationale: Pengantar ujaran ini menghubungkan ayat dengan perkataan langsung pada ayat berikutnya. 'Katanya' alami dalam narasi Indonesia dan mempertahankan kalimat yang belum selesai.
