reference: Leviticus 10:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: id
  text: untuk membedakan antara yang kudus dan yang biasa[a], serta antara yang najis dan yang tahir[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang kudus dan yang profan.” Kata Ibrani yang diterjemahkan “yang biasa” menunjuk pada apa yang tidak dikhususkan sebagai kudus, bukan selalu pada sesuatu yang menghina atau jahat.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, yang najis dan yang tahir secara ritual.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: untuk membedakan
  rationale: Bentuk infinitif berawalan menyatakan tujuan sebagai kelanjutan ayat sebelumnya. “Membedakan” menyampaikan fungsi penilaian para imam secara alami dan tepat.
- source_word: בֵּין
  choice: antara
  rationale: Preposisi ini menandai perbedaan antara dua kategori yang dipasangkan; pengulangannya tercermin dalam kedua frasa.
- source_word: הַקֹּדֶשׁ
  choice: yang kudus
  rationale: Nomina ini menunjuk pada kategori atau ranah segala sesuatu yang dikhususkan sebagai kudus, tanpa membatasi rujukannya pada benda tertentu.
- source_word: הַחֹל
  choice: yang biasa
  rationale: Dalam bahasa kekudusan imamat, kata ini berarti yang tidak berstatus kudus, bukan dengan sendirinya sesuatu yang jahat atau diperlakukan secara tidak hormat. “Yang biasa” mengungkapkan kontras tersebut dalam bahasa Indonesia modern.
- source_word: הַטָּמֵא
  choice: yang najis
  rationale: Dalam konteks Imamat, “najis” merupakan istilah baku bagi status ketidakmurnian ritual dan tidak dengan sendirinya menyatakan kesalahan moral.
- source_word: הַטָּהוֹר
  choice: yang tahir
  rationale: “Tahir” adalah pasangan istilah yang mapan bagi “najis” dalam konteks status ritual dan mempertahankan nuansa kultis teks.
theological_decisions:
- issue: Kontras imamat antara חֹל dan קֹדֶשׁ
  choice: yang kudus dan yang biasa
  alternative: yang kudus dan yang profan
  rationale: Ayat ini membicarakan pembedaan kategori kekudusan. “Yang biasa” menyatakan apa yang tidak dikhususkan sebagai kudus tanpa memberi kesan bahwa hal itu pasti menghina atau jahat.
- issue: Sifat kategori טָמֵא dan טָהוֹר
  choice: yang najis dan yang tahir sebagai kategori ritual
  alternative: yang tidak murni dan yang murni
  rationale: Dalam peraturan keimaman kitab Imamat, istilah-istilah ini terutama menunjukkan status ritual. Pilihan ini tidak menyamakan setiap kenajisan dengan dosa moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel sumber dipertahankan. “Yang biasa” dipilih agar kontras kudus/nonkudus jelas, sedangkan pasangan tradisional “najis/tahir” mempertahankan terminologi ritual kitab Imamat.
