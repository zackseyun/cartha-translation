  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל מִֽישָׁאֵל֙ וְ/אֶ֣ל אֶלְצָפָ֔ן בְּנֵ֥י עֻזִּיאֵ֖ל דֹּ֣ד אַהֲרֹ֑ן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם קִ֠רְב֞וּ שְׂא֤וּ אֶת אֲחֵי/כֶם֙ מֵ/אֵ֣ת פְּנֵי הַ/קֹּ֔דֶשׁ אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: id
  text: Kemudian Musa memanggil Misael dan Elsafan, anak-anak Uziel, paman Harun, lalu berkata kepada mereka, “Mendekatlah. Bawalah saudara-saudaramu[a] dari hadapan tempat kudus[b] ke luar perkemahan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “saudara-saudaramu” juga dapat berarti kerabat laki-laki dekat. Di sini yang dimaksud ialah Nadab dan Abihu, sepupu Misael dan Elsafan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari depan kawasan kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks naratif ini, קרא berarti memanggil seseorang; pilihan ini alami dan tetap mempertahankan makna langsung teks.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: anak-anak Uziel
  rationale: Frasa konstruksi ini secara langsung menyatakan bahwa Misael dan Elsafan adalah anak laki-laki Uziel, bukan sekadar keturunannya.
- source_word: דֹּד אַהֲרֹן
  choice: paman Harun
  rationale: Dalam konteks kekerabatan, דּוֹד paling wajar berarti 'paman' dan menerangkan Uziel.
- source_word: קִרְבוּ
  choice: Mendekatlah
  rationale: Imperatif קרב menyatakan gerakan mendekat; bentuk ini ringkas, wajar, dan sesuai dengan suasana khidmat.
- source_word: שְׂאוּ
  choice: Bawalah
  rationale: נשא dapat berarti mengangkat, membawa, atau memikul. Dalam konteks pemindahan jenazah, 'bawalah' menyampaikan tindakan yang diperintahkan tanpa menambahkan keterangan yang tidak tersurat.
- source_word: אֲחֵיכֶם
  choice: saudara-saudaramu
  rationale: אָח dapat menunjuk saudara laki-laki maupun kerabat laki-laki dekat. Terjemahan ini mempertahankan istilah kekerabatan sumber, sementara catatan kaki menjelaskan rujukannya.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: dari hadapan tempat kudus
  rationale: Ungkapan ini mempertahankan nuansa spasial פְּנֵי ('muka/depan/hadapan') dan tetap membuka kemungkinan pemahaman sebagai lokasi di depan kawasan kudus.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Dalam konteks ini, kata tersebut menunjuk tempat atau kawasan suci; 'tempat kudus' merupakan padanan yang jelas dan tidak terlalu mempersempit acuannya.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Padanan ini mempertahankan arah gerak yang dinyatakan oleh אֶל dan terdengar alami dalam bahasa Indonesia.
