  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: id
  text: Maka mereka mendekat dan membawa kedua jenazah itu dengan jubah mereka ke luar perkemahan[a], seperti yang dikatakan Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam jubah mereka.” Preposisi Ibrani dapat menyatakan sarana atau keadaan; frasa ini mungkin berarti bahwa jenazah itu dibawa dengan memegang atau menggunakan jubah mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: mereka mendekat
  rationale: Bentuk wayyiqtol qal dari קרב menyatakan gerak mendekati jenazah; “mendekat” alami dan tidak menambahkan nuansa ritual yang tidak dinyatakan.
- source_word: וַיִּשָּׂאֻם
  choice: mengangkat kedua jenazah itu
  rationale: נשׂא di sini menggambarkan pengangkatan sekaligus pemindahan Nadab dan Abihu. “Kedua jenazah itu” memperjelas acuan pronomina jamak berdasarkan konteks tanpa menyebut nama kembali.
- source_word: בְּכֻתֳּנֹתָם
  choice: dengan jubah mereka
  rationale: כֻּתֹּנֶת menunjuk pakaian panjang seperti tunik atau jubah. Preposisi ב dapat menyatakan sarana; “dengan jubah mereka” mempertahankan kemungkinan bahwa jenazah diangkat dengan memegang atau menggunakan jubah tersebut.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Ungkapan ini menyatakan gerak menuju tempat di luar batas perkemahan; “ke luar perkemahan” ringkas dan idiomatis dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: tepat seperti yang diperintahkan Musa
  rationale: דבר secara leksikal berarti “berkata/berbicara”, tetapi konteks ayat sebelumnya adalah perintah langsung Musa. “Diperintahkan” menyampaikan fungsi ujaran itu secara alami, sedangkan “tepat seperti” mempertahankan daya komparatif כַּאֲשֶׁר.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Jubah” dipilih karena lebih mudah dipahami daripada transliterasi “tunik”, sementara catatan kaki mempertahankan ambiguitas preposisi Ibrani. Penanda catatan kaki ditempatkan setelah frasa lokasi agar tidak memutus frasa utama.
