revisions:
- from: Maka mereka mendekat dan mengangkat kedua jenazah itu dengan jubah mereka ke luar perkemahan[a], tepat seperti yang diperintahkan Musa.
  to: Maka mereka mendekat dan membawa kedua jenazah itu dengan jubah mereka ke luar perkemahan[a], seperti yang dikatakan Musa.
  rationale: Revisi mengganti “mengangkat” dengan “membawa” untuk mencakup pemindahan hingga ke lokasi tujuan, dan mengganti “yang diperintahkan Musa” dengan “yang dikatakan Musa” agar verba Ibrani dābar diterjemahkan secara langsung. Catatan kaki diperbaiki untuk menjaga ambiguitas frasa tentang jubah tanpa menambahkan bahwa jenazah masih mengenakannya.
