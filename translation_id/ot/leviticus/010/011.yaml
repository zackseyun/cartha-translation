  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: id
  text: dan untuk mengajarkan kepada anak-anak Israel segala ketetapan yang telah Yahweh sampaikan kepada mereka dengan perantaraan Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan tangan Musa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: dan untuk mengajarkan
  rationale: Konjungsi, preposisi, dan infinitif kausatif ini melanjutkan tugas para imam dari ayat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan tujuan atau kewajiban mengajar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan baku ini mempertahankan corak kekeluargaan dari frasa Ibrani secara ringkas, tetapi dalam konteks ini menunjuk secara kolektif kepada umat Israel.
- source_word: כָּל הַחֻקִּים
  choice: segala ketetapan
  rationale: חֻקִּים menunjuk kepada ketentuan atau ketetapan yang ditetapkan dalam konteks hukum perjanjian. 'Segala ketetapan' jelas, bermartabat, dan lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: yang telah Yahweh sampaikan
  rationale: Kata 'sampaikan' cocok dengan adanya penerima dan perantaraan Musa, sedangkan 'telah' menyatakan tindakan ilahi yang sudah terjadi dan tetap relevan. Nama perjanjian יְהוָה dipertahankan sebagai 'Yahweh'.
- source_word: אֲלֵיהֶם
  choice: kepada mereka
  rationale: Preposisi אֶל dengan sufiks pronominal menyatakan pihak yang dituju oleh firman Yahweh.
- source_word: בְּיַד מֹשֶׁה
  choice: dengan perantaraan Musa
  rationale: Idiom harfiah 'dengan tangan Musa' menyatakan bahwa Musa menjadi pengantara. Padanan utama ini lebih alami dalam bahasa Indonesia, sementara bentuk harfiah dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama pribadi perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Pilihan ini menjaga citra keturunan atau keluarga dalam bahasa sumber, sekaligus dapat dipahami secara kolektif sebagai umat Israel tanpa mempersempitnya hanya kepada laki-laki.
- issue: Peran Musa dalam בְּיַד מֹשֶׁה
  choice: dengan perantaraan Musa
  alternative: dengan tangan Musa
  rationale: Frasa Ibrani menekankan mediasi Musa, bukan bahwa ketetapan itu berasal darinya. Terjemahan utama menyatakan fungsi tersebut secara alami, dan catatan kaki menjaga idiom sumber.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada hukum-perjanjian yang bermartabat. Ayat sengaja diawali 'dan' karena secara sintaksis melanjutkan rangkaian tugas imam dari ayat sebelumnya. 'Bani Israel' mempertahankan nuansa kekeluargaan tanpa terdengar sejanggal terjemahan harfiah 'anak-anak lelaki Israel'.
