source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: id
  text: 'Lalu Musa berkata kepada Harun, “Inilah yang difirmankan Yahweh: ‘Di antara orang-orang yang datang mendekat kepada-Ku, Aku akan menyatakan kekudusan-Ku[a], dan di hadapan seluruh umat, Aku akan dimuliakan[b].’” Harun pun terdiam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Melalui orang-orang yang datang mendekat kepada-Ku, Aku akan diperlakukan sebagai Yang Kudus.” Bahasa Ibrani dapat menunjuk baik pada kekudusan Allah yang dinyatakan maupun pada diri-Nya yang diakui dan diperlakukan sebagai kudus oleh mereka yang mendekati-Nya.
    reason: alternative_reading
  - marker: b
    text: Atau, “Aku akan dihormati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה לֵאמֹר
  choice: Inilah yang difirmankan Yahweh
  rationale: Ungkapan ini alami dan bermartabat dalam bahasa Indonesia serta menyampaikan formula pengantar ujaran tanpa perlu mempertahankan pengulangan harfiah 'berfirman, dengan mengatakan'.
- source_word: בִּקְרֹבַי
  choice: Di antara orang-orang yang datang mendekat kepada-Ku
  rationale: Menjaga arti mereka yang mendekati Allah, khususnya dalam konteks pelayanan ibadah, tanpa mempersempit rujukannya secara eksplisit menjadi hanya para imam.
- source_word: אֶקָּדֵשׁ
  choice: Aku akan menyatakan kekudusan-Ku
  rationale: Menyampaikan bentuk Niphal yang dapat menunjuk pada kekudusan Allah yang dinyatakan atau ditampakkan, sambil mempertahankan alternatif bahwa Ia diperlakukan sebagai kudus dalam catatan kaki.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: dan di hadapan seluruh umat
  rationale: Padanan idiomatis bagi ungkapan Ibrani yang menekankan sifat publik dari pernyataan itu; 'umat' sesuai dengan konteks komunitas Israel.
- source_word: אֶכָּבֵד
  choice: Aku akan dimuliakan
  rationale: Menjaga bentuk pasif Niphal dan bobot teologis akar כבד; alternatif 'dihormati' dicatat.
- source_word: וַיִּדֹּם אַהֲרֹן
  choice: Harun pun terdiam
  rationale: Mengungkapkan perubahan atau respons menuju keheningan dengan ringkas dan khidmat.
theological_decisions:
- issue: Hubungan kekudusan Allah dengan orang-orang yang mendekat kepada-Nya
  choice: Di antara orang-orang yang datang mendekat kepada-Ku, Aku akan menyatakan kekudusan-Ku
  alternative: Melalui orang-orang yang datang mendekat kepada-Ku, Aku akan diperlakukan sebagai Yang Kudus
  rationale: Bahasa Ibrani memungkinkan nuansa bahwa kekudusan Allah dinyatakan melalui tindakan-Nya maupun bahwa orang yang mendekat wajib mengakui dan memperlakukan-Nya sebagai kudus. Teks utama dan catatan kaki mempertahankan ketegangan itu.
- issue: Makna אֶכָּבֵד di hadapan umat
  choice: Aku akan dimuliakan
  alternative: Aku akan dihormati
  rationale: '''Dimuliakan'' mempertahankan bobot istilah ketika dikenakan kepada Allah, sedangkan ''dihormati'' merupakan alternatif leksikal yang lebih umum.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kata 'umat' dipilih untuk הָעָם karena konteksnya adalah komunitas Israel. Kapital pada pronomina ilahi mengikuti konvensi Indonesia yang lazim, sedangkan nama Yahweh dipertahankan.
