source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: id
  text: “Engkau beserta anak-anakmu tidak boleh minum anggur ataupun minuman memabukkan ketika kalian masuk ke Kemah Pertemuan, supaya kalian tidak mati. Ini akan menjadi ketetapan tetap bagi kalian, turun-temurun.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַיִן
  choice: anggur
  rationale: Istilah Ibrani baku untuk minuman hasil fermentasi buah anggur; konteks tidak menuntut perluasan atau penyempitan makna.
- source_word: שֵׁכָר
  choice: minuman memabukkan
  rationale: Merujuk secara luas pada minuman beralkohol selain anggur. Pilihan ini lebih tepat daripada istilah yang dapat menyiratkan hanya kadar alkohol tinggi atau satu jenis minuman tertentu.
- source_word: אַל תֵּשְׁתְּ
  choice: tidak boleh minum
  rationale: אַל dengan bentuk imperfek/jusif menyatakan larangan. 'Tidak boleh' menyampaikan daya perintah secara alami dalam bahasa Indonesia modern.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: Engkau dan anak-anakmu yang menyertai engkau
  rationale: Mempertahankan sapaan tunggal kepada Harun, para anaknya, dan unsur eksplisit אִתָּךְ, 'bersama/menyertai engkau'.
- source_word: בְּבֹאֲכֶם
  choice: ketika kalian masuk
  rationale: Preposisi ב pada infinitif konstruk menandai keadaan atau waktu masuk; bentuk jamak dipertahankan melalui 'kalian'.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan Indonesia yang mapan untuk nama kemah suci tempat pertemuan yang ditetapkan.
- source_word: וְלֹא תָמֻתוּ
  choice: supaya kalian tidak mati
  rationale: Dalam rangkaian sesudah larangan, klausa ini secara wajar menyatakan akibat maut yang hendak dihindari, tanpa menjadikannya formula sebab-akibat yang terlalu mekanis.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan tetap
  rationale: Formula hukum untuk ketetapan yang terus berlaku. 'Tetap' alami dan mempertahankan daya duratif עוֹלָם dalam konteks ini.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun bagi kalian
  rationale: Menyatakan keberlakuan berkelanjutan sepanjang generasi-generasi penerima perintah dengan ungkapan Indonesia yang idiomatis.
theological_decisions:
- issue: Daya klausa kematian
  choice: '''supaya kalian tidak mati,'' dengan nuansa pencegahan/akibat yang hendak dihindari'
  alternative: '''jangan sampai kalian mati'' atau secara lebih harfiah ''dan kalian tidak akan mati'''
  rationale: Susunan Ibrani setelah larangan mengaitkan pelanggaran dengan akibat maut. Terjemahan pilihan menjaga daya peringatan tanpa memastikan lebih daripada yang dinyatakan teks.
- issue: Ruang lingkup larangan
  choice: Larangan berlaku ketika Harun dan anak-anaknya masuk ke Kemah Pertemuan.
  alternative: Larangan pantang total bagi para imam dalam setiap keadaan.
  rationale: Frasa temporal בְּבֹאֲכֶם אֶל אֹהֶל מוֹעֵד secara eksplisit membatasi keadaan larangan. Terjemahan tidak memperluasnya menjadi doktrin pantang alkohol secara universal.
- issue: Durasi ketetapan
  choice: Ketetapan itu berlaku tetap turun-temurun bagi mereka.
  alternative: Memahami עוֹלָם secara abstrak sebagai 'kekal' tanpa memperhitungkan frasa 'bagi generasi-generasi kalian.'
  rationale: Gabungan חֻקַּת עוֹלָם dan לְדֹרֹתֵיכֶם menekankan keberlangsungan ketetapan lintas generasi; terjemahan mempertahankan formula perjanjian tersebut tanpa menyelesaikan pertanyaan teologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pergeseran dari 'engkau' tunggal pada subjek pertama kepada 'kalian' jamak pada verba masuk dan mati mencerminkan perubahan jumlah dalam teks Ibrani. Tidak ada penanda catatan kaki karena tidak ada catatan yang diperlukan untuk memahami terjemahan utama.
