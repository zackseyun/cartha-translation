id: LEV.10.2
reference: Leviticus 10:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: id
  text: Lalu keluarlah api dari hadapan Yahweh[a] dan menghanguskan mereka, dan mereka pun mati di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari hadirat Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Lalu keluarlah
  rationale: Bentuk wayyiqtol memajukan alur dengan peristiwa lampau. Susunan inversi dengan partikel -lah mempertahankan arah gerak dari hadapan Yahweh sekaligus memberi gaya naratif yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: אֵשׁ
  choice: api
  rationale: Kata benda ini secara langsung menunjuk pada api sebagai pelaku penghukuman dalam ayat ini.
- source_word: מִלִּפְנֵי יְהוָה
  choice: dari hadapan Yahweh
  rationale: Ungkapan Ibrani secara harfiah berarti keluar dari depan wajah atau hadirat Yahweh. 'Dari hadapan Yahweh' mempertahankan citra dan pengulangan sumber tanpa menutup kemungkinan nuansa kehadiran ilahi.
- source_word: וַתֹּאכַל
  choice: dan menghanguskan
  rationale: אכל secara dasar berarti 'memakan', tetapi dengan api sebagai subjek, 'menghanguskan' merupakan ungkapan Indonesia yang alami untuk tindakan api yang membinasakan.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek ini merujuk kepada Nadab dan Abihu dalam konteks langsung.
- source_word: וַיָּמֻתוּ
  choice: dan mereka pun mati
  rationale: Verba Ibrani berbentuk aktif-intransitif, 'mereka mati'. Partikel 'pun' menandai hasil dalam rangkaian narasi tanpa mengubahnya menjadi bentuk kausatif atau pasif.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Pilihan ini mempertahankan ungkapan lokatif-teologis serta pengulangan לִפְנֵי dalam ayat yang sama.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Apakah וַיָּמֻתוּ perlu diterjemahkan secara pasif-kausatif
  choice: mereka pun mati
  alternative: mereka dibunuh; mereka tewas
  rationale: Bentuk sumber adalah aktif-intransitif, sedangkan klausa sebelumnya sudah menyatakan penyebab kematian. Terjemahan ini tidak menambahkan kausalitas gramatikal yang tidak dinyatakan oleh verba tersebut.
- issue: Nuansa לִפְנֵי sebagai lokasi atau kehadiran ilahi
  choice: di/dari hadapan Yahweh
  alternative: di/dari hadirat Yahweh
  rationale: Pilihan utama mempertahankan idiom dan pengulangan Ibrani; alternatif 'hadirat' dicatat karena konteks dapat menonjolkan kehadiran ilahi, bukan sekadar posisi ruang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Pengulangan 'di/dari hadapan Yahweh' sengaja dipertahankan untuk mencerminkan struktur Ibrani; koordinasi klausa juga dijaga agar hubungan sebab-akibat tidak diperjelas secara berlebihan.
