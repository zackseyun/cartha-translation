  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: id
  text: Lihat, darahnya tidak dibawa masuk ke bagian dalam tempat kudus.[a] Kamu seharusnya benar-benar memakannya di tempat kudus, seperti yang telah kuperintahkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dibawa masuk ke ruang kudus bagian dalam.” Ungkapan Ibrani memakai istilah untuk kawasan kudus dan menambahkan “ke dalam,” sehingga menekankan bagian interiornya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ungkapan Ibraninya berbentuk “memakan, kamu harus memakannya,” yang menegaskan kewajiban untuk makan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihat
  rationale: Kata ini mengarahkan perhatian secara tegas kepada pokok teguran; “Lihat” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya deiktiknya.
- source_word: הוּבָא
  choice: dibawa masuk
  rationale: Bentuk Hofal dari בוא menyatakan tindakan pasif. “Dibawa masuk” juga menyampaikan arah gerak yang ditandai oleh אֶל dan פְּנִימָה.
- source_word: דָּמָהּ
  choice: darahnya
  rationale: Akhiran feminin tunggal mengacu kepada kurban penghapus dosa yang sedang dibicarakan; bentuk “-nya” wajar dan tidak memaksakan gender gramatikal Ibrani ke dalam bahasa Indonesia.
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: masuk ke bagian dalam tempat kudus
  rationale: Ungkapan ini menyatakan gerak menuju kawasan kudus bagian dalam. Terjemahan tersebut mempertahankan unsur arah serta penekanan פְּנִימָה tanpa menentukan lokasi ritual secara lebih sempit daripada teks.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: seharusnya benar-benar memakannya
  rationale: Infinitif absolut yang diikuti verba finit menegaskan tindakan makan. Dalam konteks teguran atas tindakan yang sudah tidak dilakukan, “seharusnya benar-benar” menyampaikan baik kewajiban lampau maupun intensifikasinya.
- source_word: אֹתָהּ
  choice: -nya
  rationale: Pronomina objek mengacu kepada kurban atau daging kurban tersebut; enklitik “-nya” alami karena acuannya jelas dari konteks.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Menunjuk tempat suci yang ditetapkan untuk memakan kurban. “Tempat kudus” mempertahankan istilah kultis tanpa menyamakannya secara eksplisit dengan bagian dalam yang disebut sebelumnya.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: seperti yang telah kuperintahkan
  rationale: Menunjuk perintah Musa yang telah diberikan sebelumnya; “telah” membuat hubungan waktunya jelas dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah ruang kultis
  choice: Menerjemahkan אֶל־הַקֹּדֶשׁ פְּנִימָה sebagai “masuk ke bagian dalam tempat kudus” dan בַּקֹּדֶשׁ sebagai “di tempat kudus”.
  alternative: Menerjemahkan yang pertama sebagai “ke dalam ruang suci” atau menyebut lokasi khusus seperti “di balik tirai”.
  rationale: 'Dua frasa itu berkaitan tetapi tidak sama: frasa pertama memuat arah gerak dan פְּנִימָה, sedangkan frasa kedua menunjuk tempat suci untuk makan. Pembedaan ini mempertahankan logika ritual tanpa menambahkan identifikasi ruang yang tidak dinyatakan secara eksplisit.'
- issue: Daya perintah אָכוֹל תֹּאכְלוּ dalam konteks teguran
  choice: “seharusnya benar-benar memakannya”
  alternative: “harus memakannya” atau “pasti memakannya”
  rationale: Konteks menunjukkan Musa menegur kegagalan yang sudah terjadi. Pilihan ini mempertahankan intensifikasi Ibrani sekaligus menyatakan kewajiban yang tidak dilaksanakan, tanpa mengubahnya menjadi prediksi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan berwibawa. “Kamu” dipakai karena Musa berbicara langsung kepada Harun dan anak-anaknya dalam konteks teguran. Istilah “tempat kudus” menjaga nuansa ritual, sedangkan susunan kalimat dibuat alami bagi pembaca umum.
