id: LEV.22.8
reference: Leviticus 22:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: id
  text: Ia tidak boleh makan bangkai atau hewan yang dicabik binatang buas[a], sehingga ia menjadi najis karenanya. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia tidak boleh makan hewan yang mati dengan sendirinya atau yang dicabik binatang buas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: bangkai
  rationale: Kata ini menunjuk pada bangkai hewan, khususnya hewan yang mati bukan melalui penyembelihan yang semestinya. Dalam konteks hukum makanan, “bangkai” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: וּטְרֵפָה
  choice: atau hewan yang diterkam binatang buas
  rationale: Istilah ini menunjuk pada hewan yang dicabik atau diterkam pemangsa. Penyebutan “binatang buas” mengungkapkan pelaku yang tersirat dan membuat maknanya jelas dalam bahasa Indonesia.
- source_word: לֹא יֹאכַל
  choice: Ia tidak boleh makan
  rationale: Bentuk imperfek yang dinegasikan dalam konteks hukum menyatakan larangan. “Tidak boleh” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya hukum teks.
- source_word: לְטָמְאָה בָהּ
  choice: sehingga ia menjadi najis karenanya
  rationale: Infinitif dengan ל dapat menyatakan tujuan atau akibat. “Sehingga” secara alami menyampaikan akibat ritual dari memakan hewan tersebut tanpa mengubah kenajisan ritual menjadi penilaian moral.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Formula perjanjian ini mempertahankan nama ilahi יהוה sebagai “Yahweh”; bentuk “Akulah” wajar dan tegas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna kenajisan dalam לְטָמְאָה בָהּ
  choice: menjadi najis karenanya
  alternative: menajiskan dirinya dengannya
  rationale: Pilihan ini menjaga istilah kenajisan ritual dan tidak menyiratkan pencemaran moral yang tidak dinyatakan oleh teks.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menggunakan nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankan nama tersebut.
- issue: Hubungan semantis infinitif לְטָמְאָה dengan larangan makan
  choice: sehingga ia menjadi najis
  alternative: untuk menjadi najis
  rationale: Konstruksi Ibrani dapat bernuansa tujuan atau akibat. Dalam konteks ini, “sehingga” menyampaikan akibat dari tindakan makan secara alami, sementara catatan tidak diperlukan karena perbedaan tersebut tidak mengubah pokok larangan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “ia” mengikuti acuan tunggal kepada imam dalam konteks. Istilah “najis” dipertahankan sebagai kosakata teknis kemurnian ritual.
