  text: for your acceptance, it must be a sound male from the cattle, the sheep, or the goats.
translation:
  language: id
  text: Supaya diterima, persembahan itu haruslah seekor jantan yang tidak bercacat dari antara sapi, domba, atau kambing.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: Supaya diterima
  rationale: Dalam konteks persembahan, frasa ini menyatakan tujuan agar persembahan memperoleh penerimaan; bentuk ini alami dalam bahasa Indonesia tanpa menentukan secara berlebihan apakah yang diterima ialah persembahan atau orang yang mempersembahkannya.
- source_word: תָּמִים
  choice: tidak bercacat
  rationale: Istilah ini dalam peraturan korban menunjuk pada keutuhan fisik atau ketiadaan cacat yang mendiskualifikasi, bukan sekadar keadaan sehat.
- source_word: זָכָר
  choice: seekor jantan
  rationale: Menyatakan jenis kelamin hewan secara langsung dan alami.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: dari antara sapi, domba, atau kambing
  rationale: Mewakili tiga kelompok hewan yang diperbolehkan; 'dari antara' memperjelas pemilihan seekor hewan dari kelompok-kelompok tersebut.
theological_decisions:
- issue: Objek penerimaan dalam לִרְצֹנְכֶם
  choice: Supaya diterima
  alternative: supaya kamu diterima
  rationale: Ibrani dapat berkaitan dengan penerimaan bagi para pembawa persembahan, tetapi konteks langsung juga menyoroti kelayakan persembahan. Ungkapan pasif tanpa objek eksplisit mempertahankan keluwesan ini.
- issue: Makna תָּמִים dalam hukum korban
  choice: tidak bercacat
  alternative: sehat/sempurna
  rationale: Pilihan ini mempertahankan kategori ritual-fisik dalam konteks Imamat dan menghindari kesan bahwa hanya kesehatan umum atau kesempurnaan mutlak yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca modern sambil mempertahankan syarat penerimaan, jenis kelamin, kondisi fisik, dan tiga kategori ternak.
