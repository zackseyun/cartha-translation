revisions:
- from: Apabila seorang laki-laki mempersembahkan kepada Yahweh kurban kesejahteraan[a]—untuk memenuhi nazar khusus atau sebagai persembahan sukarela—dari kawanan sapi atau kawanan kambing domba, hewan itu harus tidak bercela supaya diterima; tidak boleh ada cacat apa pun padanya.
  to: Apabila seorang laki-laki mempersembahkan kepada Yahweh kurban kesejahteraan[a]—untuk memenuhi suatu nazar atau sebagai persembahan sukarela—dari sapi atau kambing-domba, hewan itu haruslah tanpa cacat supaya diterima; tidak boleh ada cacat apa pun padanya.
  rationale: Revisi menghapus tambahan makna “khusus” dari frasa tentang nazar, merapikan istilah ternak ke bentuk Indonesia modern yang lebih alami, dan mengganti “harus tidak bercela” dengan “haruslah tanpa cacat.” Makna hukum dan penegasan akhir bahwa tidak boleh ada cacat tetap dipertahankan.
