language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: id
  text: Apabila seorang laki-laki mempersembahkan kepada Yahweh kurban kesejahteraan[a]—untuk memenuhi suatu nazar atau sebagai persembahan sukarela—dari sapi atau kambing-domba, hewan itu haruslah tanpa cacat supaya diterima; tidak boleh ada cacat apa pun padanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini juga diterjemahkan “kurban persekutuan” atau, secara tradisional, “kurban keselamatan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Apabila seorang laki-laki
  rationale: כִּי dengan bentuk verba belum selesai memperkenalkan kasus bersyarat dalam hukum. אִישׁ adalah nomina maskulin tunggal dan dipertahankan secara eksplisit sebagai 'seorang laki-laki'.
- source_word: יַקְרִיב
  choice: mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa atau menyajikan sesuatu sebagai persembahan.
- source_word: זֶבַח שְׁלָמִים
  choice: kurban kesejahteraan
  rationale: זֶבַח menunjuk pada kurban sembelihan, sedangkan שְׁלָמִים adalah jenis persembahannya. 'Kesejahteraan' mempertahankan kaitan leksikal dengan akar שׁלם tanpa menyempitkan maknanya hanya menjadi persekutuan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: לְפַלֵּא נֶדֶר
  choice: untuk memenuhi nazar khusus
  rationale: Dalam konteks persembahan, frasa ini menunjuk pada pelaksanaan atau pemenuhan nazar; bentuk פלא memberi nuansa nazar yang khusus atau istimewa.
- source_word: אוֹ לִנְדָבָה
  choice: atau sebagai persembahan sukarela
  rationale: נְדָבָה adalah persembahan yang diberikan secara sukarela, berbeda dari persembahan yang diwajibkan oleh nazar.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: dari kawanan sapi atau kawanan kambing domba
  rationale: בָּקָר adalah ternak besar, terutama sapi, sedangkan צֹאן mencakup kawanan domba dan kambing.
- source_word: תָּמִים יִהְיֶה לְרָצוֹן
  choice: hewan itu harus tidak bercela supaya diterima
  rationale: תָּמִים dalam hukum kurban berarti bebas dari cacat fisik, dan לְרָצוֹן menyatakan kelayakan kurban untuk diterima.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: tidak boleh ada cacat apa pun padanya
  rationale: מוּם adalah cacat fisik yang membuat hewan tidak layak dipersembahkan; susunan negatif Ibrani menegaskan larangan menyeluruh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks menyebut nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban kesejahteraan
  alternative: kurban persekutuan atau kurban keselamatan
  rationale: Istilah Ibrani dapat menonjolkan keutuhan, kesejahteraan, dan persekutuan dalam perjamuan kurban. 'Kesejahteraan' menjaga keluasan makna dan menghindari kesan bahwa kurban ini terutama berkaitan dengan keselamatan dari dosa.
- issue: Subjek hukum אִישׁ
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Bentuk Ibrani secara eksplisit maskulin tunggal; terjemahan mempertahankan bentuk tersebut tanpa menyimpulkan bahwa asas hukum ini tidak dapat berlaku lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang lugas dan bermartabat. 'Kawanan kambing domba' dipakai untuk menyatakan bahwa צֹאן mencakup domba dan kambing. Tanda pisah memperjelas bahwa nazar dan persembahan sukarela adalah dua alasan alternatif untuk mempersembahkan kurban.
