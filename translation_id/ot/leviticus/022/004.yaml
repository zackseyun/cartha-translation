  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: id
  text: Setiap laki-laki dari keturunan Harun yang terkena penyakit kulit yang menajiskan[a] atau mengalami lelehan tubuh tidak boleh makan dari persembahan-persembahan kudus sampai ia menjadi tahir. Dan siapa pun yang menyentuh apa pun yang najis karena mayat[b], atau laki-laki yang mengeluarkan air mani,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “kusta”. Istilah Ibrani ini mencakup kondisi kulit yang menyebabkan kenajisan ritual dan tidak secara khusus berarti penyakit kusta modern (penyakit Hansen).
    reason: lexical_alternative
  - marker: b
    text: Atau “siapa pun yang najis karena mayat.” Ungkapan Ibrani ini padat dan menunjuk pada kenajisan yang berkaitan dengan orang mati.
    reason: textual_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן
  choice: Setiap laki-laki dari keturunan Harun
  rationale: Pengulangan אִישׁ bersifat distributif, yaitu ‘setiap laki-laki’. Konteksnya secara khusus menyangkut laki-laki keturunan Harun yang dapat menjalankan tugas keimaman.
- source_word: צָרוּעַ
  choice: terkena penyakit kulit yang menajiskan
  rationale: Istilah ini menunjuk pada kondisi kulit yang menyebabkan kenajisan ritual dan tidak boleh disamakan secara khusus dengan penyakit Hansen modern.
- source_word: זָב
  choice: mengalami lelehan tubuh
  rationale: Kata ini menunjuk pada lelehan tubuh yang menimbulkan kenajisan ritual. Ungkapan ini cukup jelas tanpa membatasi jenis lelehan melebihi teks.
- source_word: בַּקֳּדָשִׁים
  choice: dari persembahan-persembahan kudus
  rationale: Dalam konteks keimaman, bentuk jamak ini menunjuk pada bagian-bagian kudus yang boleh dimakan imam; ‘persembahan-persembahan kudus’ menyampaikan rujukan tersebut secara alami.
- source_word: לֹא יֹאכַל
  choice: tidak boleh makan
  rationale: Bentuk ini menyatakan larangan hukum. ‘Tidak boleh’ wajar dalam bahasa Indonesia modern dan tetap mempertahankan daya normatifnya.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: sampai ia menjadi tahir
  rationale: Kata kerja ini menyatakan peralihan ke keadaan tahir secara ritual; ‘menjadi tahir’ mempertahankan kerangka ritual ayat.
- source_word: וְהַנֹּגֵעַ
  choice: Demikian juga orang yang menyentuh
  rationale: Partisipel substantival ini memperkenalkan keadaan lain yang membuat seseorang tidak layak makan persembahan kudus. ‘Demikian juga’ memperjelas hubungan daftar tanpa mengubah isinya.
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: siapa pun yang najis karena mayat
  rationale: Ungkapan ringkas ini paling mungkin menunjuk pada orang yang menjadi najis akibat kontak dengan mayat, tetapi konstruksinya padat dan memiliki kemungkinan pemahaman lain yang dicatat dalam catatan kaki.
- source_word: אִישׁ אֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: laki-laki yang mengeluarkan air mani
  rationale: Ungkapan Ibrani secara konkret menyatakan keluarnya air mani dari seorang laki-laki. Terjemahan ini lugas, bermartabat, dan alami.
theological_decisions:
- issue: Kenajisan ritual dan diagnosis medis modern
  choice: Menggunakan ‘penyakit kulit yang menajiskan’ dan ‘menjadi tahir’
  alternative: ‘kusta’ dan ‘sembuh’
  rationale: Ayat ini mengatur kelayakan ritual imam, bukan menetapkan diagnosis penyakit Hansen atau menyamakan ketahiran dengan kesembuhan medis.
- issue: Subjek hukum yang berjenis kelamin laki-laki
  choice: Mempertahankan ‘laki-laki’ bagi keturunan Harun dan orang yang mengeluarkan air mani
  alternative: ‘orang’ atau ‘siapa saja’ pada semua tempat
  rationale: Bentuk maskulin dan konteks keturunan Harun yang menjalankan keimaman merujuk secara khusus kepada laki-laki; bentuk netral akan mengaburkan cakupan sumber.
- issue: Identitas objek yang terkena kenajisan karena kematian
  choice: Menerjemahkan sebagai orang yang najis karena mayat sambil mencatat alternatif
  alternative: Sesuatu yang najis karena orang mati
  rationale: Konstruksi טְמֵא נֶפֶשׁ bersifat padat dan idiomatis. Bacaan yang menunjuk pada seseorang yang menjadi najis karena mayat sesuai dengan penggunaan ritual, tetapi ambiguitas gramatikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat. Istilah ‘tahir’ dan ‘najis’ dipertahankan karena tepat bagi sistem ritual Imamat dan dikenal luas. Ayat diakhiri koma karena kalimat dan daftar kondisi berlanjut ke ayat berikutnya.
