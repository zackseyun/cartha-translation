  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: id
  text: Katakanlah kepada Harun dan anak-anak lelakinya agar mereka menjauhkan diri dari hal-hal kudus umat Israel, yang dikuduskan umat Israel bagi-Ku, dan tidak mencemarkan nama-Ku yang kudus. Akulah Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Katakanlah
  rationale: Imperatif piel dari דבר menyampaikan perintah untuk berbicara; “Katakanlah kepada” merupakan ungkapan Indonesia yang alami untuk memperkenalkan firman ilahi.
- source_word: וְיִנָּזְרוּ
  choice: agar mereka menjauhkan diri
  rationale: Bentuk nifal dari נזר berarti memisahkan atau menahan diri dari sesuatu. Pilihan ini mempertahankan nuansa refleksif dan tuntutan praktis dalam konteks kekudusan imam.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: dari persembahan-persembahan kudus ... umat Israel
  rationale: קָדְשֵׁי secara harfiah dapat berarti “hal-hal kudus”, tetapi dalam konteks ini menunjuk pada benda atau persembahan yang dikhususkan Israel. “Persembahan-persembahan kudus” jelas dan tetap mempertahankan cakupan kultis.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan harfiah “anak-anak lelaki Israel” merupakan sebutan kebangsaan yang mencakup seluruh umat. “Umat Israel” adalah padanan Indonesia modern yang alami dan tidak mengubah cakupannya.
- source_word: יְחַלְּלוּ
  choice: mencemarkan
  rationale: Piel חלל dalam konteks kekudusan berarti memperlakukan sebagai tidak kudus atau menajiskan. “Mencemarkan” menyampaikan akibat terhadap nama Allah dalam bahasa Indonesia yang bermartabat dan mudah dipahami.
- source_word: שֵׁם קָדְשִׁי
  choice: nama-Ku yang kudus
  rationale: Padanan langsung dan idiomatis bagi frasa konstruksi Ibrani tersebut.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: yang dikuduskan ... bagi-Ku
  rationale: Klausa ini paling wajar menerangkan persembahan-persembahan kudus yang umat Israel khususkan bagi Yahweh. Bentuk pasif membuat hubungan itu jelas dalam bahasa Indonesia tanpa mengubah pelakunya, yang dinyatakan sebagai “umat Israel”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Acuan klausa אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: Klausa menerangkan persembahan-persembahan kudus milik umat Israel.
  alternative: Klausa dapat dibaca secara longgar seolah-olah berkaitan dengan “nama-Ku yang kudus”.
  rationale: Secara sintaksis dan kontekstual, tindakan menguduskan bagi Yahweh paling tepat dikenakan pada benda-benda kudus. Penataan ulang klausa dalam bahasa Indonesia mencegahnya secara keliru terbaca sebagai keterangan bagi nama Allah.
- issue: Hubungan וְלֹא יְחַלְּלוּ dengan perintah sebelumnya
  choice: 'Diterjemahkan sebagai tujuan/akibat: “supaya mereka tidak mencemarkan”.'
  alternative: 'Koordinasi lebih formal: “dan janganlah mereka mencemarkan”.'
  rationale: Dalam rangkaian perintah ini, tindakan menjauhkan diri dimaksudkan untuk mencegah pencemaran nama kudus Yahweh. “Supaya” menyatakan hubungan pragmatis tersebut secara alami tanpa menambah tuntutan teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Anak-anak lelaki Harun” dipertahankan karena yang dimaksud ialah para imam keturunan Harun, sedangkan בְנֵי יִשְׂרָאֵל diterjemahkan secara idiomatis sebagai “umat Israel”. Klausa relatif dipindahkan mendekati acuannya agar tidak ambigu secara menyesatkan.
