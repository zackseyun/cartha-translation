id: LEV.22.32
reference: Leviticus 22:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: id
  text: Janganlah kamu mencemarkan nama-Ku yang kudus, dan Aku akan dinyatakan kudus di tengah-tengah umat Israel.[a] Akulah Yahweh, yang menguduskan kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel,” ungkapan baku untuk umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: mencemarkan
  rationale: Bentuk Piel dari חלל berarti memperlakukan sesuatu yang kudus sebagai tidak kudus atau menajiskannya. “Mencemarkan” alami dalam bahasa Indonesia dan mempertahankan bobot religius ungkapan ini.
- source_word: שֵׁם קָדְשִׁי
  choice: nama-Ku yang kudus
  rationale: Mengungkapkan konstruksi Ibrani secara alami sambil mempertahankan unsur “nama” dan “kudus”.
- source_word: וְנִקְדַּשְׁתִּי
  choice: Aku akan dinyatakan kudus
  rationale: Nifal dari קדשׁ di sini menyatakan bahwa Yahweh diperlihatkan atau diakui sebagai kudus. Bentuk pasif ini mempertahankan ambiguitas pelaku tanpa menyiratkan bahwa Allah dijadikan kudus secara hakiki.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah
  rationale: Mempertahankan citra lokatif Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan Ibrani harfiah “anak-anak lelaki Israel” merupakan sebutan baku bagi komunitas Israel secara keseluruhan. “Umat Israel” menyampaikan referen kolektif itu secara alami dan akurat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
- source_word: מְקַדִּשְׁכֶם
  choice: yang menguduskan kamu
  rationale: Partisip ini menyatakan tindakan Yahweh yang menguduskan umat-Nya dan mempertahankan kaitan leksikal dengan akar קדשׁ sebelumnya.
theological_decisions:
- issue: Makna וְנִקְדַּשְׁתִּי
  choice: Aku akan dinyatakan kudus
  alternative: Aku akan diperlakukan sebagai kudus; Aku akan terbukti kudus
  rationale: Terjemahan pasif mempertahankan kemungkinan bahwa kekudusan Yahweh diperlihatkan, diakui, atau dihormati di tengah Israel tanpa menentukan satu nuansa saja.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Dalam konteks hukum ini, frasa tersebut merupakan sebutan kolektif bagi komunitas Israel, bukan hanya keturunan laki-laki.
- issue: Hubungan kedua klausa dengan וְ
  choice: dan
  alternative: tetapi
  rationale: Konjungsi Ibrani secara formal adalah “dan”; terjemahan tidak menambahkan pertentangan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata “kamu” dipertahankan karena sufiks orang kedua jamak Ibrani tidak dibedakan dalam bahasa Indonesia standar. Huruf kapital pada “-Ku” mengikuti kebiasaan ortografis Indonesia untuk rujukan kepada Allah.
