base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: id
  text: Namun, jika seorang imam membeli seseorang sebagai miliknya dengan uangnya[a], orang itu boleh makan dari makanan kudus yang menjadi bagiannya. Orang-orang yang lahir di rumahnya juga boleh makan dari makanan kudus yang menjadi bagiannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seseorang, perolehan uangnya”—yakni seseorang yang dibeli dengan uangnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rotinya”; di sini “roti” tampaknya dipakai lebih luas untuk makanan kudus yang menjadi bagian imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: Namun, jika seorang imam
  rationale: Kata penghubung melanjutkan sekaligus mengontraskan ketentuan ini dengan ayat sebelumnya, sedangkan כִּי memperkenalkan keadaan bersyarat dalam rumusan hukum.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: membeli seseorang
  rationale: יִקְנֶה dalam konteks ini menunjukkan perolehan melalui pembelian, dan נֶפֶשׁ merujuk kepada seorang manusia, bukan 'jiwa' dalam arti nonjasmani.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: dengan uangnya sebagai miliknya
  rationale: Ungkapan ini menyatakan bahwa orang tersebut diperoleh dengan uang dan berstatus milik; terjemahan mempertahankan dimensi kepemilikan dalam hukum itu tanpa memperhalusnya.
- source_word: הוּא יֹאכַל בּוֹ
  choice: orang itu boleh makan dari bagian kudus tersebut
  rationale: הוּא menunjuk kembali kepada orang yang dibeli, bukan kepada imam. Bentuk verba dalam konteks hukum menyatakan izin. בּוֹ secara harfiah berarti 'darinya' dan dalam konteks menunjuk kepada makanan kudus yang sedang dibicarakan.
- source_word: וִילִיד בֵּיתוֹ
  choice: orang-orang yang lahir di rumah imam itu
  rationale: Ungkapan ini menunjuk kepada mereka yang lahir dalam rumah tangga imam. Meskipun bentuk nomina tunggal-kolektif, kata ganti dan verba berikutnya berbentuk jamak.
- source_word: בְלַחְמוֹ
  choice: dari makanannya
  rationale: לֶחֶם secara harfiah berarti 'roti', tetapi dapat dipakai lebih luas untuk makanan, khususnya bagian makanan imam dalam konteks ini.
theological_decisions:
- issue: Istilah hukum yang menyatakan manusia sebagai milik
  choice: membeli seseorang dengan uangnya sebagai miliknya
  alternative: membeli seseorang dengan uangnya
  rationale: Pilihan ini mempertahankan unsur kepemilikan yang nyata dalam קִנְיַן כַּסְפּוֹ. Terjemahan tersebut menggambarkan ketentuan teks dan tidak dimaksudkan sebagai pembenaran moral atas praktik itu.
- issue: Rujukan makanan yang boleh dimakan
  choice: bagian kudus tersebut
  alternative: darinya
  rationale: Pronomina בּוֹ tidak menyebut ulang bendanya, tetapi konteks langsung membicarakan persembahan kudus yang menjadi bagian imam. 'Bagian kudus tersebut' membuat rujukan dapat dipahami tanpa mengubah lingkup kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya hukum yang lugas dan bermartabat. 'Orang itu' menghindari ketaksaan rujukan pronomina, sedangkan 'rumah imam itu' menjelaskan pemilik rumah tanpa memakai bentuk posesif yang berpotensi kabur.
