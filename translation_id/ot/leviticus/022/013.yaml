  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: id
  text: Namun, jika anak perempuan seorang imam menjadi janda atau diceraikan, tidak mempunyai keturunan, dan kembali ke rumah ayahnya seperti pada masa mudanya, ia boleh makan dari makanan ayahnya.[a] Namun, orang luar[b] tidak boleh memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti ayahnya”. Di sini “roti” tampaknya mengacu secara lebih luas pada persediaan makanan dalam rumah tangga imam.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang tidak berhak”. Istilah Ibraninya menunjuk pada orang di luar kalangan keimaman yang diizinkan, bukan semata-mata orang asing berdasarkan suku bangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: Namun, jika anak perempuan seorang imam
  rationale: Kata penghubung ו dibaca sebagai kontras terhadap ketentuan sebelumnya, sedangkan כִּי memperkenalkan keadaan bersyarat. Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan keluarga serta status keimaman.
- source_word: אַלְמָנָה וּ/גְרוּשָׁה
  choice: menjadi janda atau diceraikan
  rationale: Kedua istilah menunjukkan dua kemungkinan status, bukan keharusan mengalami keduanya sekaligus. Bentuk pasif “diceraikan” sesuai dengan גְרוּשָׁה.
- source_word: וְ/זֶרַע אֵין לָהּ
  choice: tidak mempunyai keturunan
  rationale: זֶרַע secara harfiah berarti “benih”, tetapi dalam konteks keluarga berarti anak atau keturunan. “Keturunan” mempertahankan cakupan yang lebih luas daripada “anak”.
- source_word: וְ/שָׁבָה אֶל בֵּית אָבִיהָ
  choice: dan kembali ke rumah ayahnya
  rationale: שׁוּב menyatakan kembali ke tempat atau keadaan sebelumnya, yaitu masuk kembali ke rumah tangga asalnya.
- source_word: כִּ/נְעוּרֶיהָ
  choice: seperti pada masa mudanya
  rationale: Ungkapan ini membandingkan keadaan setelah ia kembali dengan kehidupannya dahulu di rumah ayahnya, tanpa menambahkan penafsiran tentang status perkawinannya.
- source_word: מִ/לֶּחֶם אָבִיהָ תֹּאכֵל
  choice: ia boleh makan dari makanan ayahnya
  rationale: לֶחֶם secara harfiah “roti”, tetapi dapat merujuk secara metonimis pada persediaan makanan rumah tangga imam. “Boleh” mengungkapkan izin hukum yang dimaksud oleh bentuk verba dalam konteks ini.
- source_word: וְ/כָל זָר
  choice: Namun, orang luar
  rationale: Dalam hukum keimaman, זָר menunjuk pada orang di luar kalangan yang berhak, bukan terutama pada orang asing secara etnis. “Orang luar” mempertahankan makna itu tanpa mempersempit identitasnya.
- source_word: לֹא יֹאכַל בּוֹ
  choice: tidak boleh memakannya
  rationale: Larangan ini menyatakan bahwa orang tersebut tidak berhak makan dari makanan yang disebut sebelumnya. Pronomina “-nya” merujuk kembali kepada makanan ayahnya.
theological_decisions:
- issue: Cakupan “makanan ayahnya” dalam peraturan keimaman
  choice: Menerjemahkan לֶחֶם sebagai “makanan” sambil mencatat arti harfiahnya.
  alternative: “roti ayahnya”
  rationale: Konteks Imamat 22 membahas kelayakan untuk memakan bagian makanan yang tersedia bagi rumah tangga imam. “Makanan” menyampaikan cakupan metonimis yang mungkin dimaksud tanpa menentukan lebih jauh jenis atau tingkat kekudusannya.
- issue: Identitas זָר dalam lingkup keimaman
  choice: “orang luar”
  alternative: “orang yang tidak berhak” atau “orang asing”
  rationale: Istilah ini terutama menandai orang yang berada di luar lingkaran yang diizinkan makan, bukan etnis tertentu. Catatan kaki menjaga nuansa legalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat dan mudah dipahami. “Namun” menandai kontras, “boleh” menyatakan izin, dan struktur kalimat mempertahankan rangkaian syarat dari teks Ibrani. Semua penanda catatan kaki ditempatkan tepat pada istilah yang dijelaskan.
