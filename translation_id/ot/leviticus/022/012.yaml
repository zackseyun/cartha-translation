base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: id
  text: Tetapi, jika anak perempuan seorang imam menikah dengan seorang yang bukan imam[a], ia tidak boleh makan dari bagian yang dikhususkan dari persembahan kudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjadi bagi seorang laki-laki asing/luar.” Dalam konteks ini, ungkapan tersebut berarti menikah dengan seorang yang berada di luar lingkup keimaman; tidak mesti orang asing secara etnis.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “sumbangan dari hal-hal kudus” atau, secara lebih ringkas, “persembahan kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: Tetapi jika anak perempuan seorang imam
  rationale: Waw dipahami secara adversatif karena ketentuan ini berlawanan dengan keadaan dalam ayat sebelumnya; hubungan konstruksi diterjemahkan secara wajar sebagai “anak perempuan seorang imam”.
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: menjadi istri orang di luar kaum imam
  rationale: Ungkapan “menjadi milik/seorang laki-laki” menyatakan pernikahan. Dalam konteks aturan tentang hak memakan makanan kudus, זָר menunjuk kepada orang di luar lingkup keimaman, bukan terutama orang asing secara etnis.
- source_word: הִוא
  choice: ia
  rationale: Kata ganti mandiri Ibrani mempertahankan subjek perempuan secara eksplisit tanpa menambahkan penekanan yang tidak diperlukan dalam bahasa Indonesia.
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: dari bagian yang dipersembahkan dari persembahan-persembahan kudus
  rationale: תְּרוּמָה ialah bagian atau sumbangan yang dikhususkan, sedangkan הַקֳּדָשִׁים berbentuk jamak dan mencakup berbagai persembahan atau benda kudus. Rumusan ini menjaga hubungan konstruksi kedua unsur tersebut.
- source_word: לֹא תֹאכֵל
  choice: ia tidak boleh makan
  rationale: Bentuk negatif dalam materi hukum menyatakan larangan; “tidak boleh” menyampaikan daya preskriptifnya secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Arti זָר dalam peraturan keimaman
  choice: orang di luar kaum imam
  alternative: orang asing; orang awam; bukan imam
  rationale: Konteks Imamat 22 membahas kelayakan memakan bagian kudus dalam rumah tangga imam. Karena itu, istilah ini menyatakan orang di luar lingkup keimaman dan tidak harus menunjuk kepada orang asing secara etnis.
- issue: Cakupan תְרוּמַת הַקֳּדָשִׁים
  choice: bagian yang dipersembahkan dari persembahan-persembahan kudus
  alternative: persembahan kudus; sumbangan dari benda-benda kudus
  rationale: Terjemahan utama mempertahankan baik gagasan bagian yang dikhususkan maupun bentuk jamak kategori kudus, tanpa mempersempitnya kepada satu jenis kurban tertentu.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. “Kaum imam” dipakai untuk menjelaskan batas kelayakan ritual tanpa memberi kesan perbedaan etnis. Pengulangan “dipersembahkan” dan “persembahan-persembahan” dipertahankan demi ketepatan hubungan istilah kultis Ibrani, meskipun catatan kaki menyediakan pilihan yang lebih ringkas.
