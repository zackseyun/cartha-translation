    rationale: Kata Ibrani tersebut menyatakan keadaan patah atau rusak, tetapi tidak menyebut “tulang.” Penambahan itu membatasi referen secara tidak perlu.
  - severity: medium
    issue: “persembahan yang dibakar” kurang tepat untuk אִשֶּׁה.
    rationale: Istilah itu secara tradisional berkaitan dengan persembahan melalui api, tetapi tidak harus berarti persembahan itu sendiri “dibakar.” “Persembahan dengan api” lebih netral dan dekat dengan bentuk istilah teknisnya.
  - severity: low
    issue: “termutilasi” bernada lebih kuat dan lebih teknis daripada yang diperlukan untuk חָרוּץ.
    rationale: Referen tepatnya tidak pasti; “terluka sayat” menyampaikan unsur luka potong tanpa menambahkan tingkat kerusakan tertentu.
  revised_text: Binatang yang buta, yang patah, yang terluka sayat, atau yang memiliki kutil, kudis, atau penyakit kulit, janganlah kamu persembahkan kepada Yahweh. Janganlah kamu menaruh satu pun dari binatang-binatang itu di atas mazbah sebagai persembahan dengan api[a] bagi Yahweh.
