revisions:
- from: Binatang yang buta, yang patah tulang, yang termutilasi, atau yang memiliki kutil, kudis, atau penyakit kulit tidak boleh kamu persembahkan kepada Yahweh. Janganlah kamu menaruh satu pun dari binatang-binatang itu di atas mazbah sebagai persembahan yang dibakar[a] bagi Yahweh.
  to: Binatang yang buta, yang patah, yang terluka sayat, atau yang memiliki kutil, kudis, atau penyakit kulit, janganlah kamu persembahkan kepada Yahweh. Janganlah kamu menaruh satu pun dari binatang-binatang itu di atas mazbah sebagai persembahan dengan api[a] bagi Yahweh.
  rationale: Revisi membetulkan pembatasan yang tidak ada dalam sumber pada “patah tulang,” melembutkan padanan yang terlalu spesifik untuk cacat akibat sayatan, dan menggunakan padanan utama yang lebih aman bagi istilah kultis אִשֶּׁה. Susunan larangan, daftar cacat, rujukan kepada Yahweh, dan jangkar catatan kaki tetap terpelihara.
