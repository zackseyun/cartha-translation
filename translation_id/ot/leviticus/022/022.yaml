id: LEV.22.22
reference: Leviticus 22:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: id
  text: Binatang yang buta, yang patah, yang terluka sayat, atau yang memiliki kutil, kudis, atau penyakit kulit, janganlah kamu persembahkan kepada Yahweh. Janganlah kamu menaruh satu pun dari binatang-binatang itu di atas mazbah sebagai persembahan dengan api[a] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan pangan.” Secara harfiah, istilah Ibrani ini berkaitan dengan api; juga dapat diterjemahkan “persembahan yang dibakar.”
    reason: Istilah Ibrani אִשֶּׁה adalah istilah teknis korban. Nuansa tepatnya diperdebatkan; catatan ini mempertahankan alternatif yang penting tanpa menentukan secara berlebihan.
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: yang buta
  rationale: Bentuk ini menyebut cacat pada binatang korban; frasa relatif ini jelas dan alami dalam bahasa Indonesia.
- source_word: שָׁבוּר
  choice: yang patah tulang
  rationale: Partisip pasif ini menunjuk pada bagian tubuh yang patah; penambahan 'tulang' memperjelas maksud tanpa mengubah jenis cacat.
- source_word: חָרוּץ
  choice: yang termutilasi
  rationale: Istilah ini menunjuk pada bagian tubuh yang terpotong atau tersayat sehingga menimbulkan cacat. 'Termutilasi' mempertahankan beratnya cacat tanpa menentukan anggota tubuh tertentu.
- source_word: יַבֶּלֶת
  choice: kutil
  rationale: Padanan modern yang mudah dipahami untuk benjolan atau pertumbuhan abnormal pada kulit.
- source_word: גָרָב
  choice: kudis
  rationale: Menunjuk pada kelainan kulit yang nyata; 'kudis' merupakan padanan konkret dan umum, meskipun diagnosis persisnya tidak pasti.
- source_word: יַלֶּפֶת
  choice: penyakit kulit
  rationale: Jenis gangguan kulit yang dimaksud tidak dapat dipastikan; padanan umum ini menghindari ketepatan medis yang semu.
- source_word: תַקְרִיבוּ
  choice: kamu persembahkan
  rationale: Dalam konteks kurban, bentuk kausatif dari קרב berarti membawa atau mempersembahkan sesuatu di hadapan Allah.
- source_word: אֵלֶּה
  choice: binatang-binatang itu
  rationale: Rujukan demonstratifnya dibuat eksplisit dalam bahasa Indonesia agar jelas bahwa larangan berlaku atas binatang dengan cacat yang baru disebutkan.
- source_word: וְאִשֶּׁה
  choice: sebagai persembahan yang dibakar
  rationale: Istilah kultis אִשֶּׁה berkaitan dengan persembahan yang disajikan melalui api. Rumusan ini dapat dipahami pembaca umum dan tetap menyisakan alternatif 'persembahan pangan' dalam catatan kaki.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: menaruh satu pun dari binatang-binatang itu di atas mazbah
  rationale: Mengungkapkan tindakan konkret yang dilarang dan mempertahankan makna distributif מֵהֶם.
- source_word: לַיהוָה
  choice: kepada/bagi Yahweh
  rationale: 'Preposisi ל disesuaikan dengan konstruksi bahasa Indonesia: ''kepada'' setelah mempersembahkan dan ''bagi'' setelah jenis persembahan.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Penerjemahan istilah korban אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan pangan; persembahan dengan api
  rationale: Istilah ini berhubungan dengan korban yang disajikan melalui api, tetapi etimologi dan nuansa tepatnya diperdebatkan. Teks utama memakai ungkapan yang alami, sedangkan alternatif penting dicatat agar ambiguitasnya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Mazbah' dipertahankan sebagai istilah kultis yang ringkas dan dikenal dalam bahasa keagamaan; struktur kalimat dibuat alami dengan mengulang 'yang' pada daftar cacat utama. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang diterangkannya.
