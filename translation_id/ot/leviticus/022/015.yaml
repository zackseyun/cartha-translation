  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: id
  text: Mereka tidak boleh mencemarkan persembahan kudus[a] umat Israel yang dipersembahkan[b] kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hal-hal kudus milik umat Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang mereka angkat kepada Yahweh”; dalam konteks ini, kata Ibrani tersebut dapat berarti menyerahkan atau mempersembahkan pemberian kudus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: menajiskan
  rationale: Bentuk piel dari חלל dalam konteks ibadah berarti memperlakukan sesuatu yang kudus sebagai tidak kudus. “Menajiskan” merupakan istilah Indonesia yang wajar dan kuat dalam konteks kekudusan Imamat.
- source_word: קָדְשֵׁי
  choice: persembahan-persembahan kudus
  rationale: Secara harfiah berarti “hal-hal kudus”, tetapi dalam konteks ini menunjuk pada benda atau pemberian yang dikhususkan bagi ibadah. “Persembahan-persembahan kudus” menyatakan rujukan kultisnya secara alami, sementara catatan kaki mempertahankan keluasan ungkapan Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan harfiah “anak-anak Israel” berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Umat Israel” alami dalam bahasa Indonesia modern dan tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: אֲשֶׁר יָרִימוּ
  choice: yang dipersembahkan
  rationale: Bentuk hifil dari רום secara konkret berarti “mengangkat”, tetapi dalam konteks persembahan berarti menyerahkan atau mempersembahkan suatu pemberian kudus. Bentuk pasif menghindari ketidakjelasan rujukan kata ganti “mereka” dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה dialihaksarakan sebagai “Yahweh”, sehingga nama ilahi dalam teks sumber tetap terlihat.
- source_word: וְלֹא
  choice: tidak boleh
  rationale: Imperfek yang dinegasikan dalam bagian hukum menyatakan larangan. “Tidak boleh” adalah bentuk larangan yang alami dan tegas dalam bahasa Indonesia modern.
theological_decisions:
- issue: 'Cakupan קָדְשֵׁי: benda kudus atau persembahan kudus'
  choice: persembahan-persembahan kudus
  alternative: hal-hal kudus
  rationale: Konteks pengkhususan kepada Yahweh mendukung rujukan kepada persembahan, tetapi ungkapan Ibrani lebih luas. Karena itu, terjemahan utama dibuat alami dan makna yang lebih harfiah dicatat sebagai alternatif.
- issue: Rujukan pelaku dalam אֲשֶׁר יָרִימוּ
  choice: bentuk pasif “yang dipersembahkan”
  alternative: “yang mereka persembahkan”
  rationale: Dalam bahasa Ibrani, subjek jamak dapat dipahami sebagai umat Israel yang membawa persembahan, sedangkan subjek klausa utama dalam konteks adalah para imam. Bentuk pasif mempertahankan tindakan tanpa secara keliru menyamakan kedua kelompok tersebut.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi יהוה; “Yahweh” mempertahankannya sebagai nama diri dan sesuai dengan lapisan konsultasi yang telah diselaraskan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tidak boleh” mempertahankan corak hukum tanpa memakai bentuk yang kaku. Pengulangan “persembahan-persembahan” dipakai untuk menyatakan bentuk jamak Ibrani, sedangkan catatan kaki menjaga keluasan leksikal teks sumber.
