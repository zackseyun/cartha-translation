  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Lalu Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; dapat juga ditransliterasikan “Yehuwa”.'
    reason: Mencatat bentuk nama ilahi dalam bahasa Ibrani dan transliterasi alternatif.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר membuka peristiwa tutur baru. Dalam bahasa Indonesia Alkitabiah yang tetap modern, “berfirman” wajar digunakan ketika Allah menjadi subjek dan mempertahankan nada khidmat formula ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menerima firman; “kepada” merupakan padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Nama tokoh digunakan dalam bentuk baku bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam formula pengantar ucapan Ibrani, infinitif ini menandai bahwa isi perkataan akan menyusul. Bahasa Indonesia secara alami menyatakannya melalui “berfirman” dan tanda koma; menerjemahkannya sebagai “demikian” dapat menyiratkan bahwa isi ucapan terdapat dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” menggantinya dengan gelar; “Yehuwa” merupakan bentuk transliterasi alternatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Lalu” mengalirkan rangkaian narasi; koma menunjukkan bahwa isi firman berlanjut pada ayat berikutnya.
