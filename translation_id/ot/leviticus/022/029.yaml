  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: id
  text: Apabila kamu mempersembahkan kurban syukur kepada Yahweh, persembahkanlah itu supaya kamu diterima oleh-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִי
  choice: Apabila
  rationale: Dalam konteks hukum, bentuk ini memperkenalkan keadaan yang menjadi dasar perintah. “Apabila” menyampaikan nuansa waktu sekaligus syarat secara alami dalam bahasa Indonesia.
- source_word: תִזְבְּחוּ
  choice: kamu mempersembahkan kurban
  rationale: Verba זבח merujuk pada tindakan berkurban. Ungkapan ini lebih alami daripada sekadar “menyembelih” dan mempertahankan konteks peribadatan.
- source_word: זֶבַח תּוֹדָה
  choice: kurban syukur
  rationale: Frasa konstruksi ini menunjuk pada jenis kurban yang menyatakan ucapan syukur. “Kurban syukur” ringkas, jelas, dan lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: לַ/יהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima atau menjadi tujuan persembahan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: לִֽ/רְצֹנְ/כֶם
  choice: supaya kamu diterima
  rationale: Dalam konteks kurban, רָצוֹן berkaitan dengan keberterimaan di hadapan Allah. Rumusan ini menyampaikan hasil yang dimaksud bagi para pemberi kurban tanpa mengartikannya sebagai kehendak atau kesukaan subjektif mereka.
- source_word: תִּזְבָּחוּ
  choice: persembahkanlah itu
  rationale: Pengulangan verba Ibrani dipertahankan sebagai perintah, tetapi diterjemahkan secara idiomatis; “itu” mengacu kembali kepada kurban syukur.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi יהוה secara langsung. Transliterasi “Yahweh” mempertahankan nama perjanjian dan selaras dengan lapisan konsultasi POB.
- issue: Makna לִרְצֹנְכֶם dalam konteks kurban
  choice: supaya kamu diterima
  alternative: untuk keberterimaanmu
  rationale: Pilihan utama mengungkapkan secara wajar bahwa kurban harus dipersembahkan dengan cara yang mendatangkan penerimaan bagi pembawanya. Alternatif yang lebih harfiah terasa kaku dalam bahasa Indonesia, sedangkan arti “menurut kehendakmu” kurang sesuai dengan penggunaan kultis רָצוֹן.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal “Yahweh” dipertahankan sebagai nama ilahi; “kurban” memakai ejaan baku KBBI. Kalimat perintah dibuat langsung dan mudah dipahami tanpa menghilangkan pengulangan retoris teks Ibrani.
