base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Yahweh berfirman kepada Musa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Memberi tahu pembaca mengenai bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam konteks perkataan ilahi, verba דבר dalam formula pembuka ini secara alami dan bermartabat diterjemahkan sebagai “berfirman”; awalan waw membuka unit firman baru tanpa harus selalu dinyatakan dengan “dan” dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan firman dan paling alami diterjemahkan “kepada”.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak dinyatakan secara terpisah
  rationale: Infinitif “dengan berkata/untuk mengatakan” memperkenalkan isi firman pada ayat berikutnya; dalam bahasa Indonesia modern, fungsi ini sudah tercakup secara alami oleh “berfirman” dan tanda koma.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Formula Ibrani harfiah “dan ... berbicara ... dengan berkata” dipadatkan menjadi formula Indonesia yang lazim, “berfirman kepada ..., ” tanpa mengurangi fungsi pengantar bagi firman yang menyusul.
