id: LEV.22.31
reference: Leviticus 22:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: id
  text: Karena itu, kalian harus menaati perintah-perintah-Ku dan melakukannya. Akulah Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (secara tradisional diterjemahkan “TUHAN”; dapat pula ditransliterasikan “Yahweh”).'
    reason: Menjelaskan bentuk Ibrani dan dua cara utama menampilkan nama ilahi.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Karena itu, kalian harus menaati
  rationale: Kata שׁמר dalam konteks hukum perjanjian berarti menjaga atau menaati. Ungkapan “harus menaati” terdengar alami dalam bahasa Indonesia dan tetap menyampaikan daya wajib bentuk Ibrani; “karena itu” menghubungkan ayat ini dengan konteks sebelumnya.
- source_word: מִצְוֺתַי
  choice: perintah-perintah-Ku
  rationale: מִצְוָה berarti perintah atau ketetapan. Bentuk ulang menyampaikan jamak, sedangkan huruf kapital pada enklitik “-Ku” mengikuti kelaziman penulisan rujukan kepada Allah.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: dan melakukannya
  rationale: Terjemahan ini mempertahankan pasangan gagasan Ibrani, yaitu menaati dan melakukan, tanpa meleburkan keduanya menjadi satu tindakan.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: “Akulah” mempertahankan penegasan dalam formula pengenalan diri, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama tersebut, sementara catatan kaki mencatat padanan tradisional yang lazim.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk memperjelas bahwa kata kerja Ibrani menyapa orang kedua jamak; struktur dua verba dipertahankan agar penekanan pada menaati dan melakukan tidak hilang.
