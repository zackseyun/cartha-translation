  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: id
  text: Setelah matahari terbenam, ia menjadi tahir. Sesudah itu ia boleh makan dari persembahan kudus[a], karena itulah makanannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hal-hal kudus.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab itu rotinya”; di sini “roti” berarti makanan yang menjadi bagiannya dari persembahan kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: Setelah matahari terbenam
  rationale: Ungkapan Ibrani yang secara harfiah berarti ‘matahari masuk’ merupakan idiom untuk terbenamnya matahari. Bentuk ‘setelah’ menyampaikan urutan waktunya secara alami dalam bahasa Indonesia.
- source_word: וְטָהֵר
  choice: ia menjadi tahir
  rationale: Kata טהר di sini menunjuk pada pemulihan status ketahiran ritual. ‘Menjadi tahir’ mempertahankan ranah keimaman tanpa mengubahnya menjadi penilaian moral.
- source_word: וְאַחַר יֹאכַל
  choice: Sesudah itu ia boleh makan
  rationale: וְאַחַר menandai tahap berikutnya, sedangkan bentuk יֹאכַל dalam ketentuan hukum ini menyatakan tindakan yang diizinkan setelah ketahiran dipulihkan.
- source_word: מִן הַקֳּדָשִׁים
  choice: dari persembahan-persembahan kudus
  rationale: Bentuk jamak הַקֳּדָשִׁים secara harfiah berarti ‘hal-hal kudus’, tetapi dalam konteks ini menunjuk pada bagian-bagian persembahan kudus yang menjadi makanan imam. Pilihan ini alami dan jelas, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: כִּי לַחְמוֹ הוּא
  choice: karena itulah makanannya
  rationale: כִּי menyatakan alasan. לֶחֶם secara harfiah berarti ‘roti’, tetapi dapat berarti makanan atau nafkah secara umum. Kata ganti tunggal הוּא dipertahankan melalui ‘itulah’, sehingga bentuk Ibraninya tidak diselaraskan secara diam-diam dengan nomina jamak sebelumnya.
theological_decisions:
- issue: Sifat ketahiran yang dimaksud
  choice: ketahiran ritual
  alternative: kemurnian moral atau rohani
  rationale: Konteks Imamat 22 membahas hak imam untuk makan bagian kudus setelah kenajisan ritual berakhir. Karena itu, ‘tahir’ dipakai tanpa memasukkan gagasan kesalahan moral yang tidak dinyatakan ayat ini.
- issue: Hubungan ‘makanan’ dengan persembahan kudus
  choice: mempertahankan ungkapan tunggal ‘itulah makanannya’
  alternative: menjamakkannya menjadi ‘semuanya adalah makanannya’
  rationale: Bahasa Ibrani memakai לַחְמוֹ הוּא, secara harfiah ‘itu rotinya’. Bentuk tunggal dipertahankan agar ketegangan gramatikal dengan ‘persembahan-persembahan kudus’ tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ‘tahir’ dipertahankan untuk konteks ritual keimaman; struktur kalimat dibuat lugas agar mudah dipahami pembaca umum.
