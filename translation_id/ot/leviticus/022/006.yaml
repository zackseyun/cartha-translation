  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: id
  text: Orang yang menyentuhnya menjadi najis sampai petang dan tidak boleh makan dari persembahan kudus[a] sebelum ia membasuh tubuhnya dengan air.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hal-hal kudus” atau “benda-benda yang dikuduskan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “membasuh dagingnya dengan air.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: orang
  rationale: Dalam bahasa hukum Imamat, kata ini menunjuk kepada seorang individu, bukan 'jiwa' sebagai unsur tak berwujud.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: yang menyentuhnya
  rationale: Bentuk verba feminin mengikuti gender gramatikal נֶפֶשׁ dan tidak menentukan jenis kelamin. Akhiran pronominal dibiarkan netral melalui '-nya' karena merujuk pada sumber kenajisan dalam konteks sebelumnya.
- source_word: וְטָמְאָה עַד הָעָרֶב
  choice: menjadi najis sampai petang
  rationale: Ungkapan ini menyatakan akibat berupa status kenajisan ritual beserta batas waktunya.
- source_word: וְלֹא יֹאכַל
  choice: dan tidak boleh makan
  rationale: Dalam konteks hukum, bentuk imperfek negatif menyatakan larangan; 'tidak boleh' alami dan tetap tegas dalam bahasa Indonesia modern.
- source_word: מִן הַקֳּדָשִׁים
  choice: dari persembahan-persembahan kudus
  rationale: Bentuk jamak substantival menunjuk pada benda atau makanan yang dikuduskan, khususnya dalam konteks hak imam untuk makan; 'dari' mempertahankan daya partitif מִן. Catatan kaki mempertahankan alternatif yang lebih umum.
- source_word: כִּי אִם
  choice: sebelum
  rationale: Dalam konstruksi dengan larangan, idiom ini menetapkan tindakan yang harus dipenuhi lebih dahulu. 'Sebelum' menghasilkan hubungan temporal-kondisional yang alami tanpa mengubah syaratnya.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: ia membasuh tubuhnya dengan air
  rationale: בָּשָׂר secara harfiah berarti 'daging', tetapi di sini merujuk pada tubuh jasmani. 'Membasuh tubuhnya' jelas dan sesuai konteks ritual.
theological_decisions:
- issue: Sifat kenajisan
  choice: kenajisan ritual
  alternative: kenajisan moral
  rationale: Konteks membahas kelayakan kultis untuk memakan benda kudus sesudah terkena kenajisan dan membasuh diri; terjemahan tidak memasukkan gagasan kesalahan moral yang tidak dinyatakan.
- issue: Cakupan הַקֳּדָשִׁים
  choice: persembahan-persembahan kudus
  alternative: hal-hal kudus / benda-benda kudus
  rationale: Konteks makan mendukung pengertian persembahan atau makanan yang telah dikuduskan, tetapi istilah Ibraninya lebih luas; alternatif tersebut dicatat agar cakupan leksikalnya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang lugas. Kata ganti 'ia' menjaga rujukan tunggal tanpa menentukan jenis kelamin; 'najis' dipakai sebagai istilah status ritual.
