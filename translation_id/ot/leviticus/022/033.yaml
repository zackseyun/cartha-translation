  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: id
  text: yang membawa kalian keluar dari tanah Mesir untuk menjadi Allah kalian. Akulah Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH” (secara tradisional diterjemahkan “TUHAN”; juga ditransliterasikan “Yahweh”).'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: yang membawa ... keluar
  rationale: Partisipel Hifil berfungsi sebagai keterangan relatif tentang Yahweh dan meneruskan kalimat sebelumnya. Bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan hubungan sintaksis ayat.
- source_word: אֶתְכֶם
  choice: kalian
  rationale: Akhiran orang kedua jamak dinyatakan secara eksplisit dengan “kalian”, sehingga jumlah jamak dalam bahasa Ibrani tetap jelas.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: keluar dari tanah Mesir
  rationale: Mempertahankan rumusan eksodus yang lengkap, termasuk kata “tanah”, dan secara alami berpadu dengan verba “membawa keluar”.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: untuk menjadi Allah kalian
  rationale: Menyampaikan rumusan perjanjian היה + ל secara alami serta mempertahankan nuansa tujuan dari לִהְיוֹת.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Kalimat identifikasi tanpa kopula diterjemahkan secara idiomatis dan tegas; nama ilahi ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung. Transliterasi “Yahweh” membedakannya dari gelar אֲדֹנָי dan tidak mengimpor penafsiran denominatif.
- issue: Nuansa relasional rumusan לָכֶם לֵאלֹהִים
  choice: Allah kalian
  alternative: Allah bagi kalian
  rationale: “Allah kalian” merupakan ungkapan perjanjian yang alami dan ringkas dalam bahasa Indonesia, sedangkan “Allah bagi kalian” lebih harfiah tetapi kurang lazim; keduanya menyatakan relasi, bukan kepemilikan dalam arti biasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Kalian” dipilih untuk menandai orang kedua jamak dengan jelas. Ayat sengaja diawali huruf kecil karena secara sintaksis melanjutkan klausa pada ayat sebelumnya.
