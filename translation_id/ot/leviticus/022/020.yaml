  - marker: b
    text: 'Atau: “tidak akan berkenan demi kamu” atau “tidak akan diterima bagi kamu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: apa pun yang bercacat
  rationale: Ungkapan ini bersifat menyeluruh dan tidak tentu, secara harfiah menunjuk pada apa pun yang padanya terdapat cacat. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan larangan total.
- source_word: מוּם
  choice: bercacat
  rationale: Dalam konteks kurban, kata ini menunjuk pada cacat fisik yang membuat persembahan tidak layak. 'Bercacat' mempertahankan nuansa ritual sekaligus mudah dipahami.
- source_word: לֹא תַקְרִיבוּ
  choice: Janganlah kamu mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa atau menyajikan sebagai persembahan. 'Mempersembahkan' merupakan padanan Indonesia yang alami dan tepat untuk tindakan ritual ini.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan sebelumnya; 'sebab' sesuai dengan gaya hukum yang ringkas dan bermartabat.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: itu tidak akan diterima bagi kamu
  rationale: לְרָצוֹן menyatakan penerimaan atau perkenanan dalam konteks kurban, sedangkan לָכֶם mempertahankan relasi kepada pihak yang mempersembahkan. Rumusan ini tidak mengubahnya menjadi sekadar standar abstrak.
theological_decisions:
- issue: Bahasa penerimaan dalam ibadah kurban
  choice: diterima bagi kamu
  alternative: berkenan demi kamu; diterima atas nama kamu
  rationale: Teks menyangkut apakah persembahan diterima dengan perkenanan dalam hubungan antara Allah dan orang yang mempersembahkannya. Pilihan ini mempertahankan frasa לָכֶם tanpa menetapkan secara sempit apakah nuansanya terutama manfaat, perwakilan, atau penerimaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan sesuai dengan gaya hukum ritual. Bentuk jamak 'kamu' mengikuti verba Ibrani orang kedua jamak; konteks pasal menjelaskan kelompok yang disapa.
