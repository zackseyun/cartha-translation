  language: id
  text: Janganlah kamu mempersembahkan apa pun yang bercacat[a], sebab itu tidak akan diterima atas namamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “apa pun yang memiliki cacat.” Istilah Ibrani ini biasanya menunjuk pada cacat fisik yang membuat suatu persembahan tidak memenuhi syarat.'
