  terminology: ‘Mempersembahkan’ dan ‘bercacat’ merupakan istilah yang tepat dan lazim untuk konteks kurban. ‘Atas namamu’ mempertahankan dimensi representatif/relasional dari לָכֶם tanpa menentukan secara doktrinal siapa pelaku penerimaan.
