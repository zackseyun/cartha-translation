lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר membuka peristiwa tutur yang baru. Dalam bahasa Indonesia Alkitabiah yang tetap wajar, “berfirman” tepat untuk tuturan ilahi dan mempertahankan ragam yang khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama pribadi, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menerima firman; “kepada” merupakan padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam formula וידבר ... לאמר, infinitif ini memperkenalkan isi ujaran yang menyusul. Bahasa Indonesia alami cukup memakai “berfirman kepada”; menerjemahkannya sebagai “demikian” atau “kata-Nya” akan terasa berlebih, terlebih isi firman baru muncul pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi itu, sedangkan “TUHAN” merupakan penggantian tradisional dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Koma akhir dipertahankan karena ayat ini merupakan pengantar bagi firman yang berlanjut pada ayat berikutnya.
