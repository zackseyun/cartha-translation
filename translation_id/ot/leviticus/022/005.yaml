base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: id
  text: atau seorang laki-laki yang menyentuh binatang kecil apa pun yang berkerumun atau merayap, yang membuatnya menjadi najis,[a] atau menyentuh seseorang yang membuatnya menjadi najis, apa pun kenajisan orang itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk apa pun yang berkerumun” atau “binatang melata.” Istilah Ibrani ini menunjuk kepada kategori luas makhluk kecil yang berkerumun atau bergerak dekat tanah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “untuk segala kenajisannya,” yaitu apa pun atau segala jenis kenajisan yang ada pada orang itu. Bahasa Ibrani memakai bentuk maskulin tunggal dalam arti umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ אִישׁ אֲשֶׁר יִגַּע
  choice: atau seorang laki-laki yang menyentuh
  rationale: Mempertahankan bentuk maskulin tunggal אִישׁ dan verba נגע secara wajar dalam konteks hukum, sekaligus melanjutkan daftar dari ayat sebelumnya.
- source_word: בְּכָל שֶׁרֶץ
  choice: binatang kecil apa pun yang berkerumun atau merayap
  rationale: שֶׁרֶץ menunjuk kategori luas makhluk kecil yang bergerombol atau bergerak dekat tanah; terjemahan ini menghindari pembatasan zoologis yang tidak ada dalam sumber.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: yang membuatnya menjadi najis
  rationale: Mengungkapkan hasil atau sumber kenajisan dengan bahasa Indonesia yang alami, tanpa memberi nuansa kesalahan moral.
- source_word: בְאָדָם
  choice: menyentuh seseorang
  rationale: Preposisi ב mengulang gagasan kontak dari יִגַּע, sedangkan אָדָם di sini berarti manusia atau seseorang sebagai sumber kenajisan.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: apa pun kenajisan orang itu
  rationale: Mempertahankan keluasan frasa Ibrani dan menjelaskan bahwa sufiks maskulin tunggal merujuk kepada orang yang disentuh, tanpa menentukan jenis kenajisannya.
theological_decisions:
- issue: Sifat bahasa kenajisan dalam hukum Imamat
  choice: najis / kenajisan
  alternative: cemar / kecemaran; tidak tahir / ketidaktahiran
  rationale: טמא dan טֻמְאָה dalam konteks ini terutama merupakan kategori kenajisan ritual, bukan pernyataan bahwa orang tersebut bersalah secara moral.
- issue: Rujukan sufiks dalam טֻמְאָתוֹ
  choice: kenajisan orang itu
  alternative: kenajisannya
  rationale: Frasa Ibrani ringkas dan dapat terdengar ambigu. 'Orang itu' menjaga rujukan paling alami kepada אָדָם, yakni orang yang melalui kontak membuat subjek menjadi najis, sementara catatan kaki mengakui bentuk maskulin tunggal generik.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. 'Menjadi najis' mempertahankan kategori ritual. Pengulangan 'menyentuh' dibuat eksplisit agar hubungan sintaksis alami dalam bahasa Indonesia; kedua penanda catatan kaki muncul dalam teks utama.
