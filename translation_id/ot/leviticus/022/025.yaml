  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: id
  text: Dari tangan orang asing pun janganlah kalian mempersembahkan satu pun dari antara semuanya itu sebagai makanan bagi Allah kalian[a], sebab hewan-hewan itu rusak dan bercacat[b]. Hewan-hewan itu tidak akan diterima untuk kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti Allah kalian”. Di sini “roti” merupakan ungkapan Ibrani dalam konteks kurban untuk makanan yang dipersembahkan kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “bercela”. Istilah Ibrani ini menunjuk pada cacat yang membuat seekor hewan tidak layak dipersembahkan sebagai kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: Dari tangan ... pun
  rationale: Mempertahankan unsur idiomatis “tangan” sebagai penanda sumber atau perantara, sementara “pun” menghubungkannya dengan larangan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: בֶּן נֵכָר
  choice: orang asing
  rationale: Ungkapan harfiah “anak orang asing” merupakan idiom bagi orang non-Israel; “orang asing” menyampaikan makna sosialnya secara wajar.
- source_word: תַקְרִיבוּ
  choice: mempersembahkan
  rationale: Bentuk kausatif dari קרב dalam konteks kurban berarti membawa mendekat atau menyajikan sebagai persembahan; “mempersembahkan” jelas dan sesuai dengan konteks ibadah.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: makanan bagi Allah kalian
  rationale: לֶחֶם secara dasar berarti “roti”, tetapi dalam bahasa ritual imamat dapat menunjuk lebih luas pada makanan yang dipersembahkan kepada Allah. Kata “bagi” memperjelas relasi persembahan tanpa menyatakan bahwa Allah membutuhkan makanan.
- source_word: מִכָּל אֵלֶּה
  choice: satu pun dari semuanya itu
  rationale: Mengungkapkan daya partitif מִן dan cakupan כָּל, dengan rujukan kepada hewan-hewan bercacat yang baru dibicarakan.
- source_word: מָשְׁחָתָם
  choice: kerusakan
  rationale: Kata ini dapat menyatakan kerusakan, kebusukan, atau keadaan yang rusak. “Kerusakan” mempertahankan cakupan yang lebih luas daripada langsung menyamakannya dengan “cacat” pada klausa berikutnya.
- source_word: מוּם
  choice: cacat
  rationale: Istilah baku dalam Imamat 21–22 bagi kekurangan jasmani yang menggugurkan kelayakan hewan kurban; “cacat” jelas dalam bahasa Indonesia modern.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: Semuanya tidak akan diterima untuk kalian
  rationale: Bentuk pasif רצה dalam konteks kurban menyatakan penerimaan atau perkenanan. “Untuk kalian” mempertahankan לָכֶם dan hubungan penerimaan itu dengan pihak yang mempersembahkan, tanpa menentukan lebih jauh sifat manfaatnya.
theological_decisions:
- issue: Ungkapan ritual bagi pemberian kurban
  choice: makanan bagi Allah kalian
  alternative: roti Allah kalian
  rationale: Dalam konteks hewan kurban, “makanan” menyampaikan idiom ritual לֶחֶם tanpa memberi kesan bahwa yang dimaksud hanya roti. Ini merupakan penjelasan leksikal-kultural, bukan penambahan doktrinal.
- issue: Arti penerimaan kurban bagi para pembawa persembahan
  choice: tidak akan diterima untuk kalian
  alternative: tidak akan berkenan demi kalian
  rationale: 'Terjemahan ini mempertahankan ketegangan dalam לָכֶם: kurban itu tidak diterima dalam hubungannya dengan para pemberi, tanpa menetapkan apakah tekanannya pada perkenanan, manfaat, atau penerimaan atas nama mereka.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan lugas. Pronomina “kalian” dipakai untuk mencerminkan sapaan jamak Ibrani. Pengulangan “pada semuanya itu” dipertahankan agar kesejajaran dua klausa Ibrani tetap terdengar dan agar “kerusakan” tidak dilebur begitu saja ke dalam “cacat”.
