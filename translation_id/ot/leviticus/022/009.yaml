  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: id
  text: Mereka harus memelihara kewajiban-Ku[a], supaya mereka tidak menanggung dosa karena hal itu[b] dan mati karena mereka mencemarkannya[c]. Akulah Yahweh yang menguduskan mereka[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menjalankan tugas-Ku” atau “memegang ketetapan-Ku.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “menanggung dosa” juga dapat berarti “menjadi bersalah” atau “menanggung kesalahan”.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “menodainya” atau “memperlakukannya sebagai sesuatu yang biasa.” Kata ganti dalam bahasa Ibrani tidak menyebutkan objeknya secara eksplisit.'
    reason: lexical_and_referential_ambiguity
  - marker: d
    text: 'Atau: “yang menjadikan mereka kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: harus menjalankan
  rationale: Dalam ketetapan keimaman, kata ini menyatakan kewajiban untuk menjaga sekaligus menaati tugas yang dipercayakan. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “menjaga” saja.
- source_word: מִשְׁמַרְתִּי
  choice: tanggung jawab yang Kupercayakan kepada mereka
  rationale: Dalam konteks keimaman, istilah ini menunjuk pada tugas atau kewajiban yang dipercayakan untuk dilaksanakan. Pilihan ini mempertahankan unsur amanat dan kewajiban.
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: menanggung dosa karena hal itu
  rationale: Terjemahan ini mempertahankan idiom Ibrani “menanggung dosa” serta hubungan sebab yang dinyatakan oleh עָלָיו, tanpa membatasi acuannya secara berlebihan.
- source_word: וּמֵתוּ בוֹ
  choice: dan mati karenanya
  rationale: Preposisi בְּ menghubungkan kematian dengan pelanggaran tersebut dan dapat menyatakan akibat atau sebab. “Karenanya” wajar dalam bahasa Indonesia dan tetap cukup ringkas.
- source_word: יְחַלְּלֻהוּ
  choice: mencemarkannya
  rationale: Dalam konteks kekudusan imamat, חלל berarti menodai kekudusan, menjadikan biasa, atau memperlakukan sebagai tidak kudus. “Mencemarkan” menyampaikan pelanggaran terhadap kekudusan dengan bahasa yang mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: מְקַדְּשָׁם
  choice: yang menguduskan mereka
  rationale: Bentuk partisipel ini menggambarkan Yahweh sebagai Dia yang menetapkan dan menjadikan mereka kudus. “Menguduskan” mempertahankan kosakata utama tema kekudusan dalam Imamat.
theological_decisions:
- issue: Acuan kata ganti pada “karena hal itu”, “karenanya”, dan “mencemarkannya”
  choice: Kata ganti dibiarkan umum dan tidak diberi nomina tertentu.
  alternative: Menentukan bahwa semuanya secara khusus mengacu pada makanan kudus, benda kudus, atau tanggung jawab Yahweh.
  rationale: Teks Ibrani memakai kata ganti tunggal tanpa mengulang objeknya. Konteks membicarakan hal-hal kudus dan tanggung jawab imam, tetapi ayat ini sendiri tidak menyebut ulang objek itu. Terjemahan mempertahankan ketidakjelasan tersebut.
- issue: Hubungan klausa כִּי יְחַלְּלֻהוּ dengan kematian
  choice: 'Diterjemahkan secara kausal: “karena mereka mencemarkannya”.'
  alternative: 'Diterjemahkan secara temporal atau kondisional: “apabila mereka mencemarkannya”.'
  rationale: כִּי secara langsung dapat menyatakan alasan, dan terjemahan kausal mempertahankan struktur bahwa kematian terjadi akibat pencemaran terhadap yang kudus tanpa mengubahnya menjadi syarat eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Tanggung jawab yang Kupercayakan” dipilih agar konsep tugas keimaman dapat dipahami pembaca umum, sedangkan “menanggung dosa”, “mencemarkan”, dan “menguduskan” mempertahankan register teologis serta pola kekudusan dalam kitab Imamat.
