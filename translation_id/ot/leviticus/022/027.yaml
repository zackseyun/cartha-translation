- from: Apabila seekor anak lembu, anak domba, atau anak kambing lahir, anak itu harus tinggal bersama induknya selama tujuh hari. Mulai hari kedelapan dan seterusnya, anak itu akan diterima sebagai persembahan yang dibakar bagi Yahweh.[a]
  to: Apabila seekor anak sapi, anak domba, atau anak kambing lahir, anak itu harus tetap bersama induknya selama tujuh hari. Mulai hari kedelapan dan seterusnya, anak itu akan diterima sebagai persembahan yang dipersembahkan dengan api bagi Yahweh.[a]
