  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: id
  text: Apabila seekor anak sapi, anak domba, atau anak kambing lahir, anak itu harus tetap bersama induknya selama tujuh hari. Mulai hari kedelapan dan seterusnya, anak itu akan diterima sebagai persembahan yang dipersembahkan dengan api bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai persembahan makanan bagi Yahweh.” Istilah Ibrani ini menunjuk pada persembahan yang dipersembahkan dengan api.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: anak lembu
  rationale: Dalam konteks kelahiran dan kelayakan hewan untuk dipersembahkan, שׁוֹר menunjuk pada jenis ternak lembu; 'anak lembu' secara alami menyatakan hewan yang baru lahir tanpa membatasi jenis kelaminnya.
- source_word: כֶשֶׂב
  choice: anak domba
  rationale: כֶשֶׂב menunjuk pada hewan dari jenis domba. Karena hewan itu baru lahir, 'anak domba' paling wajar dalam bahasa Indonesia.
- source_word: עֵז
  choice: anak kambing
  rationale: עֵז berfungsi sebagai nama jenis hewan, tanpa keharusan membatasi jenis kelamin; konteks kelahiran mendukung 'anak kambing'.
- source_word: כִּי יִוָּלֵד
  choice: apabila ... lahir
  rationale: כִּי memperkenalkan ketentuan kasus dalam hukum, dan bentuk pasif ילד menyatakan kelahiran. 'Apabila ... lahir' alami dan tetap bersifat normatif.
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: anak itu harus tinggal bersama induknya selama tujuh hari
  rationale: Secara harfiah תַּחַת berarti 'di bawah', tetapi dalam konteks anak hewan ungkapan ini menyatakan keberadaannya bersama atau di bawah pemeliharaan induknya. Bahasa Indonesia alami memakai 'bersama induknya'.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: mulai hari kedelapan dan seterusnya
  rationale: Ungkapan ini menetapkan titik awal dan keberlakuan selanjutnya secara jelas.
- source_word: יֵרָצֶה
  choice: akan diterima
  rationale: Bentuk Nifal רצה di sini menyatakan penerimaan atau kelayakan kultis, bukan sekadar kesukaan.
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: sebagai persembahan yang dibakar
  rationale: קָרְבָּן adalah persembahan yang dibawa mendekat, sedangkan אִשֶּׁה berkaitan dengan penyajian melalui api. Pilihan ini mempertahankan unsur api tanpa mengadopsi parafrasa yang diperdebatkan seperti 'persembahan makanan'.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menyatakan tujuan atau penerima persembahan, dan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Makna kultis אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan makanan
  rationale: Asal dan nuansa tepat istilah אִשֶּׁה diperdebatkan. Terjemahan utama mempertahankan kaitannya dengan api, sedangkan alternatif dicatat tanpa memaksakan penyelesaian teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat. 'Anak lembu, anak domba, atau anak kambing' memperjelas bahwa hewan-hewan tersebut baru lahir. 'Bersama induknya' dipilih daripada ungkapan harfiah 'di bawah induknya' agar alami dan mudah dipahami.
