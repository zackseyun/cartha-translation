  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: id
  text: Jika seorang laki-laki[a] tanpa sengaja memakan sesuatu yang kudus,[b] ia harus menambahkan seperlima dari itu[c] dan menyerahkan benda kudus itu kepada imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seseorang” atau “siapa pun”; bahasa Ibrani memakai bentuk maskulin tunggal “seorang laki-laki”, yang dalam rumusan hukum dapat berfungsi secara umum.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah makanan atau milik yang telah dikhususkan sebagai kudus dan diperuntukkan bagi penggunaan imam.
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah: “menambahkan seperlimanya kepadanya”; maksudnya, menambahkan seperlima di atas jumlah pokok yang harus diganti.'
    reason: translation_clarity
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: seorang laki-laki
  rationale: אִישׁ berbentuk maskulin tunggal. Terjemahan ini mempertahankan bentuk sumber, sementara catatan kaki menjelaskan bahwa rumusan hukum tersebut dapat berlaku secara umum.
- source_word: כִּי
  choice: jika
  rationale: Dalam rumusan hukum kasuistik ini, כִּי memperkenalkan suatu keadaan bersyarat; “jika” alami dan tepat dalam bahasa Indonesia.
- source_word: יֹאכַל
  choice: memakan
  rationale: Kata kerja ini menunjuk pada tindakan makan atau mengonsumsi dalam syarat hukum tersebut.
- source_word: קֹדֶשׁ
  choice: sesuatu yang kudus / benda kudus
  rationale: קֹדֶשׁ di sini adalah sesuatu yang telah dikhususkan sebagai kudus, kemungkinan berupa makanan atau milik yang diperuntukkan bagi imam. Pilihan ini mempertahankan keluasan istilah Ibrani tanpa membatasinya menjadi jenis persembahan tertentu.
- source_word: בִּ/שְׁגָגָה
  choice: tanpa sengaja
  rationale: Istilah ini menandakan tindakan karena kekeliruan atau ketidaksengajaan, bukan pelanggaran yang disengaja.
- source_word: וְ/יָסַף חֲמִשִׁית/וֹ עָלָי/ו
  choice: ia harus menambahkan seperlima lagi
  rationale: Ungkapan Ibrani secara harfiah menyatakan penambahan seperlima dari benda atau nilai pokok itu kepadanya. “Seperlima lagi” menyampaikan kewajiban tambahan 20 persen secara wajar dalam bahasa Indonesia; rincian bentuk harfiahnya dicatat di catatan kaki.
- source_word: וְ/נָתַן
  choice: dan menyerahkan
  rationale: נתן berarti memberi. “Menyerahkan” sesuai dengan konteks pemberian ganti kepada imam tanpa terlalu mempersempitnya menjadi transaksi pembayaran.
- source_word: לַ/כֹּהֵן
  choice: kepada imam
  rationale: Artikel Ibrani menunjuk pada imam sebagai penerima yang semestinya dalam ketentuan ini.
- source_word: אֶת הַ/קֹּדֶשׁ
  choice: benda kudus itu
  rationale: Terjemahan ini mempertahankan pengulangan קֹדֶשׁ dan rujukannya pada benda atau bagian yang telah dikuduskan.
theological_decisions:
- issue: Maskulin tunggal dalam rumusan hukum
  choice: Mempertahankan “seorang laki-laki” dalam teks utama
  alternative: “seseorang” atau “siapa pun”
  rationale: Teks sumber memakai אִישׁ, nomina maskulin tunggal. Namun, karena bentuk demikian dapat berfungsi secara generik dalam rumusan hukum, kemungkinan itu dijelaskan dalam catatan kaki tanpa mengubah bentuk utama.
- issue: Hakikat benda yang harus dipulihkan
  choice: Menerjemahkan קֹדֶשׁ secara luas sebagai “sesuatu yang kudus” dan “benda kudus”
  alternative: “makanan kudus”, “bagian kudus”, atau “persembahan kudus”
  rationale: Ayat ini tidak menentukan secara lebih sempit jenis benda kudus yang dimaksud. Pilihan luas menghindari penambahan rincian yang tidak dinyatakan oleh ayat.
- issue: Dasar perhitungan tambahan seperlima
  choice: Menyatakan “menambahkan seperlima lagi” dan memberi catatan harfiah
  alternative: “menambahkan seperlima dari nilainya”
  rationale: Sufiks pada חֲמִשִׁיתוֹ merujuk kembali pada benda kudus, tetapi “nilai” tidak disebut secara eksplisit. Teks utama dibuat alami tanpa menutup kemungkinan apakah penggantian dipahami sebagai benda atau nilainya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur bersyarat dibuat langsung dan mudah dipahami. Istilah “kudus” dipertahankan untuk menjaga kaitan leksikal kedua kemunculan קֹדֶשׁ, sedangkan catatan kaki menampung nuansa hukum dan kemungkinan makna generik.
