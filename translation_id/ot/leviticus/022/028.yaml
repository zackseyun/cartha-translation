  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: id
  text: Sapi atau domba, janganlah kamu menyembelih hewan itu dan anaknya pada hari yang sama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “hewan itu dan anaknya.” Ungkapan ini merujuk pada seekor hewan bersama keturunannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: sapi
  rationale: Kata ini menunjuk pada ternak sapi. 'Sapi' merupakan padanan tunggal yang alami dalam bahasa Indonesia dan tidak membatasi jenis kelamin seperti 'lembu jantan'.
- source_word: שֶׂה
  choice: domba
  rationale: Kata ini dapat menunjuk pada seekor dari kawanan domba atau kambing. Dalam pasangan dengan sapi dan dalam konteks hukum persembahan, 'domba' adalah padanan representatif yang jelas, tanpa mempersempit usia menjadi 'anak domba'.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: induk dan anaknya
  rationale: Secara harfiah ungkapan Ibrani berbunyi 'dia dan anak jantannya/anaknya'. Dalam bahasa Indonesia, 'induk dan anaknya' menyampaikan hubungan antargenerasi pada hewan secara alami; 'induk' menjelaskan acuan praktis tanpa menetapkan bahwa kata pertama dalam teks Ibrani sendiri berjenis kelamin betina.
- source_word: תִשְׁחֲטוּ
  choice: janganlah kamu menyembelih
  rationale: שׁחט adalah verba baku untuk menyembelih hewan, terutama dalam konteks hukum dan persembahan. 'Menyembelih' mempertahankan makna teknisnya lebih baik daripada 'membunuh'.
- source_word: בְּיוֹם אֶחָד
  choice: pada hari yang sama
  rationale: Secara harfiah berarti 'pada satu hari'. Dalam larangan ini, 'pada hari yang sama' mengungkapkan maksud idiomatisnya dengan jelas dan alami.
- source_word: וְ ... אוֹ
  choice: Entah itu ... atau ...
  rationale: Rangkaian pembuka ini memperkenalkan pilihan kasus dalam ketentuan hukum. 'Entah itu ... atau ...' menyampaikan daya disjungtifnya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah hubungan hewan itu harus dinyatakan sebagai induk-anak atau secara harfiah sebagai hewan dan 'anak jantannya'?
  choice: induk dan anaknya
  alternative: hewan itu dan anaknya
  rationale: Ungkapan tersebut secara idiomatis mengacu pada hewan bersama keturunannya. Terjemahan utama dibuat alami, sedangkan bentuk harfiah dan ambiguitas jenis kelamin dicatat dalam catatan kaki agar teks tidak dibebani rumusan yang janggal.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. Bentuk 'janganlah kamu' mempertahankan sapaan orang kedua jamak yang tidak dibedakan secara morfologis dalam bahasa Indonesia. Catatan kaki menjaga bentuk harfiah serta ambiguitas yang tidak dapat dipertahankan sepenuhnya dalam terjemahan utama.
