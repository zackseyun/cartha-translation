  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: id
  text: Pada hari itu juga kurban itu harus dimakan[a]; jangan sisakan sedikit pun darinya sampai pagi. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pada hari itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu juga
  rationale: Secara harfiah berarti “pada hari itu.” Penambahan “juga” secara alami menegaskan bahwa kurban harus dimakan pada hari yang sama, sesuai daya temporal langsung dalam peraturan ini.
- source_word: יֵאָכֵל
  choice: kurban itu harus dimakan
  rationale: Bentuk Nifal imperfek berfungsi sebagai ketentuan pasif. “Harus dimakan” mempertahankan sifat wajibnya, sedangkan “kurban itu” menyatakan rujukan tersirat dari konteks ayat sebelumnya agar wajar dalam bahasa Indonesia.
- source_word: לֹא תוֹתִירוּ
  choice: jangan sisakan sedikit pun
  rationale: Bentuk Hifil dari יתר berarti membiarkan sesuatu tersisa. Larangan langsung ini disampaikan secara alami dan tegas dalam bahasa Indonesia.
- source_word: מִמֶּנּוּ
  choice: darinya
  rationale: Preposisi dengan sufiks pronominal merujuk kepada kurban tersebut; “darinya” mempertahankan hubungan pronominal itu.
- source_word: עַד בֹּקֶר
  choice: sampai pagi
  rationale: Ungkapan waktu ini melarang penyimpanan sisa hingga pagi dan diterjemahkan dengan ungkapan Indonesia yang alami.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Rumus identifikasi diri tanpa kopula diterjemahkan secara idiomatis dan tegas. Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan menghindari penggantiannya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan nada ketentuan hukum. Bentuk pasif dipertahankan pada perintah pertama, lalu larangan orang kedua jamak disampaikan dengan bentuk imperatif alami. Catatan kaki kedua dari lapisan konsultasi Inggris tidak dipertahankan karena tidak merepresentasikan alternatif tekstual atau leksikal pada posisi tersebut dalam teks Ibrani.
