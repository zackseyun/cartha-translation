id: LEV.22.3
reference: Leviticus 22:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: id
  text: 'Katakan kepada mereka: Dari generasi ke generasi, setiap laki-laki dari antara keturunanmu yang mendekati barang-barang kudus yang dikuduskan umat Israel bagi Yahweh, sedangkan kenajisannya masih melekat padanya, orang itu akan disingkirkan[a] dari hadapan-Ku[b]. Akulah Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah berarti “diputus”. Ini merupakan rumusan hukuman perjanjian; cara penyingkirannya tidak dijelaskan secara pasti dalam ayat ini.
    reason: alternative_reading
  - marker: b
    text: Atau “dari hadirat-Ku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: Katakanlah kepada mereka
  rationale: Bentuk imperatif tunggal ditujukan kepada Musa; ungkapan ini langsung dan wajar dalam bahasa Indonesia.
- source_word: לְדֹרֹתֵיכֶם
  choice: Sepanjang generasi-generasi kamu
  rationale: Mempertahankan rumusan hukum-perjanjian yang menyatakan keberlakuan terus-menerus bagi generasi berikutnya.
- source_word: כָּל אִישׁ ... מִכָּל זַרְעֲכֶם
  choice: setiap laki-laki dari antara keturunanmu
  rationale: אִישׁ berbentuk maskulin dan, dalam konteks ini, menunjuk kepada laki-laki dari garis keturunan Harun; 'keturunan' menyampaikan makna genealogis זֶרַע secara alami.
- source_word: יִקְרַב
  choice: mendekati
  rationale: Menjaga makna spasial sekaligus ritual dari קרב dalam konteks keimaman tanpa menambahkan tindakan yang tidak dinyatakan.
- source_word: הַקֳּדָשִׁים
  choice: barang-barang kudus
  rationale: Bentuk jamak ini mencakup berbagai benda atau persembahan yang telah dikhususkan, tanpa membatasi rujukannya hanya pada satu jenis persembahan.
- source_word: יַקְדִּישׁוּ ... לַיהוָה
  choice: yang dikuduskan ... bagi Yahweh
  rationale: Menyampaikan tindakan mengkhususkan sesuatu sebagai kudus dan mempertahankan nama perjanjian יְהוָה sebagai 'Yahweh'.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Padanan Indonesia yang alami untuk sebutan kolektif etnis 'anak-anak Israel', tanpa mengubah cakupan kelompoknya.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: ketika kenajisannya masih melekat padanya
  rationale: Mempertahankan gambaran Ibrani bahwa keadaan najis berada atau tetap ada pada orang tersebut, bukan sekadar menyatakan bahwa ia najis.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: orang itu harus disingkirkan
  rationale: נֶפֶשׁ dalam rumusan hukum menunjuk kepada orangnya. 'Disingkirkan' mempertahankan sifat hukuman tanpa menentukan mekanismenya sebagai kematian, pengucilan, atau bentuk lain.
- source_word: מִלְּפָנַי
  choice: dari hadapan-Ku
  rationale: Padanan formal yang mempertahankan gambaran relasional dan kultis dari ungkapan Ibrani.
theological_decisions:
- issue: Makna rumusan hukuman וְנִכְרְתָה ('harus diputus/disingkirkan')
  choice: orang itu harus disingkirkan
  alternative: orang itu harus dihukum mati; orang itu harus dikucilkan; orang itu harus dilenyapkan
  rationale: Ayat ini tidak menjelaskan apakah hukuman tersebut dilaksanakan melalui kematian, pengucilan dari umat, tindakan ilahi, atau cara lain. Terjemahan utama tidak menetapkan salah satu tafsiran itu.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankan nama tersebut dan mengikuti keputusan terminologis yang diberikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur hukum ayat dipertahankan, tetapi susunan klausa dibuat cukup alami bagi pembaca umum. Istilah ritual seperti 'kenajisan', 'dikuduskan', dan 'barang-barang kudus' dipertahankan karena penting bagi konteks Imamat.
