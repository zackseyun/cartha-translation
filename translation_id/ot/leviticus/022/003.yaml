  terminology: '"Barang-barang kudus", "dikuduskan", "kenajisan", dan "Yahweh" sesuai register kultis dan legal. "Disingkirkan" tetap cukup terbuka untuk rumusan כרת; catatan kaki perlu menjelaskan bahwa bentuk Ibraninya secara harfiah adalah "diputus/dipotong" tanpa menentukan bentuk hukumannya.'
