  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: id
  text: Namun, sapi atau domba yang salah satu anggota tubuhnya terlalu panjang atau terlalu pendek boleh kamu persembahkan sebagai persembahan sukarela[a], tetapi sebagai persembahan nazar hewan itu tidak akan diterima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih umum, “yang cacat atau kerdil.” Istilah-istilah Ibraninya tampaknya menggambarkan dua bentuk ketidakseimbangan tubuh yang berlawanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: sapi
  rationale: שׁוֹר menunjuk pada hewan jenis sapi. Kata 'sapi' merupakan sebutan generik yang alami dalam bahasa Indonesia dan tidak menambahkan jenis kelamin yang tidak dinyatakan secara tegas.
- source_word: וָשֶׂה
  choice: atau domba
  rationale: שֶׂה menunjuk pada seekor hewan dari kawanan kecil, yang dapat berupa domba atau kambing. 'Domba' mengikuti padanan konvensional dalam konteks ini, tetapi tidak menyatakan usia tertentu.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: yang salah satu anggota tubuhnya terlalu panjang atau terlalu pendek
  rationale: Kedua istilah yang jarang ini tampaknya menggambarkan bentuk ketidakseimbangan tubuh yang berlawanan, yakni anggota tubuh yang memanjang dan yang memendek atau mengerut. Rumusan ini konkret, tetapi ketidakpastian leksikalnya tetap dicatat dalam catatan kaki.
- source_word: נְדָבָה
  choice: persembahan sukarela
  rationale: נְדָבָה adalah persembahan yang diberikan secara sukarela, bukan untuk memenuhi kewajiban nazar.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: boleh kamu persembahkan
  rationale: Secara harfiah berarti 'kamu boleh membuat/melakukannya', tetapi dalam konteks kurban tindakan yang dimaksud ialah menjadikan atau mempersembahkan hewan itu sebagai persembahan.
- source_word: וּלְנֵדֶר
  choice: tetapi sebagai persembahan nazar
  rationale: נֵדֶר menunjuk pada nazar dan, dalam konteks ini, pada persembahan yang diberikan untuk memenuhi nazar.
- source_word: לֹא יֵרָצֶה
  choice: tidak akan diterima
  rationale: Bentuk Niphal dari רצה dalam konteks persembahan menyatakan bahwa sesuatu diterima dengan perkenanan; bentuk negatifnya berarti persembahan itu tidak diterima.
theological_decisions:
- issue: Makna tepat שָׂרוּעַ dan קָלוּט
  choice: Menerjemahkan pasangan itu sebagai anggota tubuh yang terlalu panjang atau terlalu pendek.
  alternative: cacat atau kerdil; salah satu bagian tubuhnya terlalu besar atau terlalu kecil
  rationale: Konteksnya adalah cacat jasmani pada hewan persembahan, dan kedua istilah tampaknya menyatakan dua bentuk ketidakseimbangan yang berlawanan. Karena rincian anatomisnya tidak sepenuhnya pasti, alternatif yang lebih umum dicantumkan dalam catatan kaki.
- issue: Perbedaan antara persembahan sukarela dan persembahan nazar
  choice: Mempertahankan kontras eksplisit antara persembahan sukarela yang diizinkan dan persembahan nazar yang tidak diterima.
  alternative: Menggeneralisasi keduanya sebagai persembahan biasa dan persembahan wajib.
  rationale: Teks Ibrani secara khusus membedakan נְדָבָה dari נֵדֶר. Istilah teknis ini dipertahankan tanpa menambahkan penjelasan doktrinal mengenai alasan perbedaannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang lugas dan bermartabat. 'Persembahan sukarela' dan 'persembahan nazar' mempertahankan istilah kultis secara jelas, sedangkan susunan kalimat dibuat alami bagi pembaca umum.
