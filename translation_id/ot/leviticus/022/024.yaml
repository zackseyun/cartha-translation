  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: id
  text: Janganlah kamu mempersembahkan kepada Yahweh hewan yang buah zakarnya memar, diremukkan, dicabut, atau dipotong[a]. Janganlah kamu melakukan hal itu di negerimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani hanya menyebut “memar, diremukkan, dicabut, atau dipotong”; objeknya tidak dinyatakan, tetapi konteksnya menunjukkan buah zakar hewan jantan.
    reason: Menjelaskan objek yang tersirat dan mempertahankan kesadaran pembaca akan bentuk ringkas teks Ibrani.
lexical_decisions:
- source_word: מָעוּךְ
  choice: tertindih
  rationale: Partisip pasif ini menggambarkan kerusakan akibat tekanan. “Tertindih” mempertahankan penyebab fisiknya dan membedakannya dari istilah berikutnya yang berarti diremukkan.
- source_word: כָתוּת
  choice: diremukkan
  rationale: Istilah ini menunjuk pada sesuatu yang ditumbuk atau dihancurkan. “Diremukkan” menyampaikan kerusakan berat dengan jelas.
- source_word: נָתוּק
  choice: dicabut
  rationale: Kata ini menggambarkan sesuatu yang ditarik hingga terlepas. “Dicabut” menyatakan cara kerusakannya tanpa mengaburkan perbedaannya dari pemotongan.
- source_word: כָרוּת
  choice: dipotong
  rationale: Berasal dari verba yang berarti memotong atau memutuskan. “Dipotong” merupakan padanan langsung dan wajar dalam rangkaian ini.
- source_word: תַקְרִיבוּ
  choice: mempersembahkan
  rationale: Dalam konteks kurban, bentuk Hifil ini berarti membawa atau menyajikan sesuatu sebagai persembahan. “Mempersembahkan” alami dalam bahasa Indonesia dan tidak membatasi tindakan itu pada pembakaran di mazbah.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” sesuai praktik proyek dan bentuk nama dalam sumber.
- source_word: בְאַרְצְכֶם
  choice: di negerimu
  rationale: Frasa ini merujuk pada wilayah tempat umat itu tinggal. “Di negerimu” mempertahankan unsur kepemilikan kolektif dan bernada wajar dalam larangan hukum.
- source_word: תַעֲשׂוּ
  choice: kamu melakukan hal itu
  rationale: Verba “melakukan/membuat” bersifat eliptis dan menunjuk kembali pada tindakan perusakan yang baru disebut. “Melakukan hal itu” membuat acuannya jelas tanpa mempersempit cakupannya.
- source_word: objek tersirat dari מָעוּךְ וְכָתוּת וְנָתוּק וְכָרוּת
  choice: buah zakarnya
  rationale: Teks Ibrani tidak menyebut organ itu secara eksplisit, tetapi konteks dan deretan cacat pada hewan jantan menunjukkan organ kelaminnya, khususnya buah zakar. Istilah ini jelas, bermartabat, dan sesuai untuk hewan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: “Yahweh” mempertahankan nama diri dalam teks sumber serta mengikuti kebijakan proyek tanpa memasukkan penafsiran denominasi.
- issue: Cakupan larangan terakhir וּבְאַרְצְכֶם לֹא תַעֲשׂוּ
  choice: larangan melakukan tindakan perusakan tersebut di negeri mereka
  alternative: larangan mempersembahkan hewan semacam itu di negeri mereka
  rationale: Verba “melakukan” luas dan eliptis. Acuan terdekatnya adalah tindakan-tindakan yang menghasilkan empat macam kerusakan tersebut. Ungkapan “melakukan hal itu” mempertahankan keluasan ini tanpa menjadikannya sekadar larangan mempersembahkan.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. “Janganlah” mempertahankan nada larangan resmi, sedangkan “buah zakar” memberi kejelasan anatomis tanpa memakai eufemisme kuno. Pengulangan “Janganlah kamu” mencerminkan dua larangan dalam bahasa Ibrani dan meningkatkan keterbacaan.
