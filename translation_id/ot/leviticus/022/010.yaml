revisions:
- from: Tidak seorang pun yang bukan anggota keluarga imam boleh memakan persembahan kudus[a]. Seorang pendatang yang tinggal pada seorang imam ataupun seorang pekerja upahan tidak boleh memakan persembahan kudus itu.[b]
  to: Orang luar tidak boleh memakan makanan kudus[a]; seorang pendatang yang tinggal di rumah seorang imam[b] ataupun pekerja upahan tidak boleh memakannya.
  rationale: Revisi mengganti pembatasan “bukan anggota keluarga imam” dengan “orang luar” untuk menjaga cakupan זָר sebagai orang yang tidak berwenang, bukan kategori kekerabatan biologis. Istilah untuk קֹדֶשׁ disesuaikan menjadi “makanan kudus” sesuai fungsi konkret dalam konteks. Frasa bagi תּוֹשַׁב כֹּהֵן dibuat lebih idiomatis dalam bahasa Indonesia dan catatan kaki tetap mempertahankan alternatif serta ambiguitas statusnya.
