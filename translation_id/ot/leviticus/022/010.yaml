  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: id
  text: Orang luar tidak boleh memakan makanan kudus[a]; seorang pendatang yang tinggal di rumah seorang imam[b] ataupun pekerja upahan tidak boleh memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang kudus” atau “hal kudus”. Dalam konteks ini, istilah itu menunjuk pada makanan atau bagian dari persembahan kudus yang dikhususkan untuk dimakan oleh imam dan rumah tangganya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “seorang pendatang milik seorang imam”, “seorang penduduk sementara seorang imam”, atau “seorang asing yang menetap pada seorang imam”. Istilah ini menunjuk kepada seorang penghuni atau pendatang yang terkait dengan rumah tangga imam, bukan terutama kepada kebangsaan atau etnisnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: orang yang bukan anggota keluarga imam
  rationale: Dalam konteks makanan kudus, kata ini menunjuk kepada orang di luar lingkup yang berhak makan, bukan terutama orang asing secara etnis. Ungkapan ini juga mengantisipasi ayat 11, yang mengizinkan anggota rumah tangga tertentu untuk makan.
- source_word: קֹדֶשׁ
  choice: persembahan kudus
  rationale: Kata benda tunggal ini secara konkret menunjuk pada bagian kudus dari persembahan yang menjadi makanan imam. Pilihan ini alami dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: seorang pendatang yang tinggal pada seorang imam
  rationale: Mencerminkan orang bukan keluarga yang menetap atau menumpang dan terikat pada rumah tangga seorang imam, tanpa memastikan status etnisnya.
- source_word: שָׂכִיר
  choice: pekerja upahan
  rationale: Menunjuk pada orang yang bekerja dengan menerima upah dan mempertahankan perbedaannya dari pendatang yang menetap.
- source_word: לֹא יֹאכַל
  choice: tidak boleh memakan
  rationale: Bentuk negatif ini menyatakan larangan dalam bahasa hukum; 'tidak boleh' merupakan padanan Indonesia yang lugas dan alami.
- source_word: וְכָל
  choice: Tidak seorang pun
  rationale: Dalam konstruksi dengan larangan, ungkapan distributif ini secara alami diterjemahkan sebagai larangan universal.
theological_decisions:
- issue: Cakupan זָר dalam hak memakan makanan kudus
  choice: bukan anggota keluarga imam
  alternative: orang luar; orang awam; orang yang tidak berhak
  rationale: Pilihan ini mempertahankan fokus aturan pada hubungan dengan rumah tangga imam dan hak atas makanan kudus, tanpa menafsirkannya sebagai pembatasan etnis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa hukum. 'Pekerja upahan' jelas bagi pembaca umum. Pengulangan 'persembahan kudus' dipertahankan untuk mengikuti struktur ayat. Semua penanda catatan kaki ditempatkan pada bagian teks yang diterangkannya.
