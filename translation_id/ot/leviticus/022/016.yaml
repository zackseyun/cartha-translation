base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: id
  text: dan dengan demikian membuat mereka menanggung kesalahan yang menuntut ganti rugi dengan memakan persembahan-persembahan kudus mereka,[a][b] sebab Akulah Yahweh yang menguduskan mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendatangkan kepada mereka kesalahan”; ungkapan Ibraninya sulit dan dapat menekankan tanggungan akibat suatu pelanggaran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hal-hal kudus mereka”; maksudnya ialah bagian-bagian atau persembahan yang telah dikhususkan.
    reason: cultural_note
  - marker: c
    text: Atau “yang menjadikan mereka kudus” atau “yang menahbiskan mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: dan dengan demikian membuat ... menanggung
  rationale: 'Bentuk hifil dari נשׂא menyatakan sebab: membuat seseorang menanggung sesuatu. Ungkapan “dengan demikian” mempertahankan hubungan akibat dengan larangan pada ayat sebelumnya.'
- source_word: אוֹתָם
  choice: mereka
  rationale: Pronomina objek dipertahankan tanpa mempersempit rujukannya di dalam teks utama.
- source_word: עֲוֺן אַשְׁמָה
  choice: kesalahan yang menuntut ganti rugi
  rationale: Gabungan istilah ini menyatakan kesalahan atau tanggungan akibat pelanggaran dalam konteks hukum ibadah; terjemahan ini menyampaikan unsur kesalahan sekaligus kewajiban pemulihannya.
- source_word: בְּאָכְלָם
  choice: karena memakan
  rationale: ב dengan infinitif konstruk di sini dapat menyatakan keadaan, sarana, atau sebab. “Karena memakan” alami dalam bahasa Indonesia dan memperlihatkan kaitan langsung antara tindakan dan tanggungan kesalahan.
- source_word: קָדְשֵׁיהֶם
  choice: persembahan-persembahan kudus mereka
  rationale: Secara harfiah berarti “hal-hal kudus mereka”; dalam konteks Imamat, yang dimaksud ialah bagian atau pemberian yang dikhususkan. “Persembahan-persembahan kudus” lebih jelas bagi pembaca modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: מְקַדְּשָׁם
  choice: yang menguduskan mereka
  rationale: Partisip piel dari קדשׁ bermakna “menguduskan, menjadikan kudus, menahbiskan”. “Menguduskan” mempertahankan ragam teologis-ibadah dan bentuk partisipnya.
theological_decisions:
- issue: Rujukan “mereka” dalam klausa terakhir
  choice: Dibiarkan sebagai “mereka” dalam teks utama, dengan kemungkinan utama menunjuk kepada orang-orang yang sedang dibicarakan.
  alternative: Menafsirkannya sebagai persembahan-persembahan kudus.
  rationale: Akhiran pronominal Ibrani secara gramatikal tetap terbuka, walaupun konteks paling alami menunjuk kepada orang-orang dalam pembahasan. Terjemahan tidak memaksakan penjelasan yang lebih sempit.
- issue: Makna kultis עֲוֺן אַשְׁמָה
  choice: kesalahan yang menuntut ganti rugi
  alternative: kesalahan; hukuman karena pelanggaran; kesalahan yang mendatangkan tanggungan
  rationale: Pilihan utama mempertahankan ketegangan antara kesalahan moral-ritual dan kewajiban hukum untuk pemulihan, tanpa secara eksplisit memasukkan korban penebus salah ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat yang tetap mudah dipahami. “Akulah” dipakai untuk menonjolkan formula ilahi כִּי אֲנִי יְהוָה. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
