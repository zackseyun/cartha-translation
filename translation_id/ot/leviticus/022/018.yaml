source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: id
  text: '“Berbicaralah kepada Harun, kepada anak-anak lelakinya, dan kepada seluruh bani Israel[a]. Katakanlah kepada mereka: Siapa pun dari kaum Israel atau dari antara para penduduk asing di Israel[b], yang mempersembahkan persembahannya untuk segala nazar atau segala persembahan sukarela mereka[c], yang mereka persembahkan kepada Yahweh sebagai kurban bakaran—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh anak laki-laki Israel”; ungkapan Ibrani ini secara idiomatis menunjuk kepada seluruh umat Israel.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani גֵּר menunjuk kepada orang bukan Israel yang menetap di tengah Israel di bawah tatanan komunitasnya; dapat juga diterjemahkan “orang asing yang menetap di Israel”.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan, “untuk segala persembahan nazar dan segala persembahan sukarela mereka”.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Bentuk imperatif piel ini membuka perintah ilahi. ‘Berbicaralah’ mempertahankan nada resmi yang lazim dalam ketetapan Imamat.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Kata Ibrani ini berbentuk maskulin jamak dan dalam konteks ini menunjuk kepada putra-putra Harun yang menjalankan tugas keimaman.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: seluruh bani Israel
  rationale: ‘Bani Israel’ merupakan ungkapan Indonesia yang ringkas dan bermartabat serta mempertahankan citra kekerabatan dalam frasa Ibrani.
- source_word: אִישׁ אִישׁ
  choice: siapa pun
  rationale: Pengulangan distributif berarti ‘setiap orang/siapa pun’. Pilihan ini menyampaikan cakupan hukum secara alami dalam bahasa Indonesia tanpa menyiratkan bahwa kata itu diulang dalam sumber.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: dari kaum Israel
  rationale: בֵּית secara harfiah berarti ‘rumah’, tetapi di sini menunjuk kepada komunitas atau kaum Israel. ‘Kaum Israel’ mempertahankan nuansa kolektif dengan bahasa Indonesia yang alami.
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: para pendatang yang tinggal di Israel
  rationale: גֵּר menunjuk kepada orang bukan Israel yang menetap di tengah komunitas Israel. Bentuk jamak dalam terjemahan menyatakan kelas kolektif yang dimaksud oleh bentuk tunggal Ibrani.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: mempersembahkan persembahannya
  rationale: Dalam konteks kurban, hiphil קרב berarti membawa atau menyajikan persembahan. Pengulangan akar yang terdengar dalam bahasa Ibrani dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: לְכָל נִדְרֵיהֶם
  choice: untuk segala nazar ... mereka
  rationale: Frasa ini menghubungkan persembahan dengan nazar. Terjemahan tidak mempersempitnya secara pasti menjadi ‘persembahan nazar’, karena bentuk Ibraninya masih memungkinkan hubungan yang lebih umum.
- source_word: נִדְבוֹתָם
  choice: persembahan sukarela mereka
  rationale: נְדָבָה adalah kategori persembahan yang diberikan secara sukarela; ‘persembahan sukarela’ merupakan padanan yang jelas dan lazim.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה dialihaksarakan sebagai ‘Yahweh’, sehingga nama diri dalam teks sumber tetap tampak.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah teknis bagi kurban yang dibakar seluruhnya. ‘Kurban bakaran’ jelas, ringkas, dan sesuai dengan kosakata ritual Indonesia.
theological_decisions:
- issue: Bahasa maskulin representatif dalam rumusan hukum
  choice: Siapa pun
  alternative: Setiap laki-laki
  rationale: אִישׁ אִישׁ adalah rumusan distributif maskulin yang dalam konteks hukum dapat berfungsi secara representatif. ‘Siapa pun’ mempertahankan daya cakupnya tanpa menetapkan secara teologis bahwa hanya laki-laki yang boleh dimaksud; bentuk sumber dijelaskan dalam catatan.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama diri ilahi, bukan gelar. ‘Yahweh’ mempertahankan perbedaan itu dan mengikuti lapisan konsultasi yang telah diselaraskan.
- issue: Hubungan nazar dengan persembahan
  choice: persembahan ... untuk segala nazar
  alternative: segala persembahan nazar
  rationale: Konstruksi לְכָל נִדְרֵיהֶם dapat menunjuk kepada persembahan yang berkaitan dengan nazar, tetapi teks tidak memakai kata ‘persembahan’ langsung di dalam frasa tersebut. Rumusan utama mempertahankan kelonggaran sintaksis ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang bermartabat. Istilah ‘bani Israel’, ‘nazar’, ‘persembahan sukarela’, dan ‘kurban bakaran’ mempertahankan warna keimaman tanpa menjadi arkais. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
