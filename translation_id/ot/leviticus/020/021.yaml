id: LEV.20.21
reference: Leviticus 20:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: id
  text: Jika seorang laki-laki mengambil istri saudaranya, itu adalah kenajisan[a]; ia telah menyingkapkan aurat saudaranya. Mereka akan tidak beranak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini dapat menunjuk pada kenajisan dalam pengertian ritual sekaligus moral; dapat juga diterjemahkan “kecemaran.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Mereka akan tanpa anak.” Teks Ibrani tidak menjelaskan bagaimana hukuman ini terlaksana.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: Jika seorang laki-laki
  rationale: Rumusan relatif dalam konteks hukum ini berfungsi sebagai syarat. Bahasa Indonesia alami tidak memerlukan padanan tersendiri bagi waw penghubung pada awal ayat.
- source_word: יִקַּח
  choice: mengambil
  rationale: Mempertahankan arti dasar לקח tanpa mempersempitnya menjadi upacara perkawinan formal.
- source_word: אֵשֶׁת אָחִיו
  choice: istri saudaranya
  rationale: Padanan langsung bagi frasa konstruksi Ibrani; 'saudara' mempertahankan ketidakjelasan apakah saudara itu masih hidup atau telah meninggal.
- source_word: נִדָּה הִוא
  choice: itu adalah kenajisan
  rationale: נִדָּה di sini menilai hubungan atau tindakan tersebut sebagai kenajisan, bukan terutama menyebut perempuan itu najis.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: ia telah menyingkapkan aurat saudaranya
  rationale: Mempertahankan ungkapan hukum khas Imamat mengenai hubungan seksual terlarang serta keterkaitan antarteksnya.
- source_word: עֲרִירִים יִהְיוּ
  choice: Mereka akan tidak beranak
  rationale: Menyatakan keadaan tanpa anak dengan subjek jamak dan tidak menambahkan cara hukuman itu terlaksana.
theological_decisions:
- issue: Cakupan larangan mengambil istri saudara
  choice: istri saudaranya
  alternative: istri mendiang saudaranya
  rationale: Teks ayat ini tidak menyebut kematian saudara. Terjemahan tidak membatasi larangan dengan tambahan yang tidak dinyatakan, sehingga ketegangan dengan ketentuan perkawinan levirat tetap terbuka.
- issue: Makna עֲרִירִים יִהְיוּ
  choice: Mereka akan tidak beranak
  alternative: Mereka akan mati tanpa anak
  rationale: Bahasa Ibrani menyatakan keadaan tanpa anak, tetapi tidak secara eksplisit mengatakan bahwa mereka akan mati tanpa anak atau menjelaskan mekanisme penghukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'menyingkapkan aurat' dipertahankan karena merupakan idiom hukum penting dalam Imamat. 'Tidak beranak' dipilih daripada 'mandul' agar tidak menyiratkan mekanisme biologis tertentu.
