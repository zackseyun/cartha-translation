  text: 'Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol Piel dari דבר membuka unit firman baru. Dalam bahasa Indonesia Alkitabiah yang tetap modern, “berfirman” merupakan padanan alami ketika subjeknya Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan firman; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: —
  rationale: Infinitif ini merupakan formula pengantar bagi isi firman yang langsung menyusul. Dalam bahasa Indonesia, maknanya tersampaikan secara alami oleh titik dua pada ayat berikutnya atau oleh kesinambungan kalimat, sehingga “dengan mengatakan” tidak perlu dinyatakan secara kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar atau memilih bentuk “Yehuwa” yang lebih jauh dari rekonstruksi pelafalan yang umum.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula Ibrani diterjemahkan secara idiomatis; karena isi perkataan baru muncul pada ayat berikutnya, koma dipertahankan untuk menunjukkan kesinambungan.
