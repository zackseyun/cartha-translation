  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: id
  text: Kamu harus menaati ketetapan-ketetapan-Ku dan melaksanakannya. Akulah Yahweh yang menguduskan kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang menjadikan kamu kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kamu harus menaati
  rationale: Kata שׁמר dalam konteks hukum berarti menjaga atau mematuhi. “Menaati” menyampaikan tuntutan perjanjian secara alami dalam bahasa Indonesia; unsur penghubung ו tidak perlu dinyatakan secara terpisah pada awal kalimat.
- source_word: חֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: חֻקָּה menunjuk pada ketentuan yang ditetapkan dalam hukum Taurat. “Ketetapan” mempertahankan nuansa hukumnya dan bentuk ulang menyatakan jamak.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: dan melaksanakannya
  rationale: עשה dengan objek berupa hukum berarti melakukan atau menjalankannya. “Melaksanakannya” alami dalam konteks ketetapan hukum dan menegaskan tindakan nyata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: מְקַדִּשְׁכֶם
  choice: yang menguduskan kamu
  rationale: Bentuk partisipel dari קדשׁ menggambarkan tindakan Yahweh yang berlangsung atau menjadi ciri-Nya. “Menguduskan” mempertahankan istilah kekudusan dalam konteks perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi.
- issue: Makna bentuk partisipel מְקַדִּשְׁכֶם
  choice: yang menguduskan kamu
  alternative: yang menjadikan kamu kudus; yang mengkhususkan kamu
  rationale: “Menguduskan” menjaga hubungan leksikal dengan bahasa kekudusan serta tidak membatasi tindakan itu hanya pada perbaikan moral atau pemisahan ritual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kamu” dipakai secara kolektif sesuai bentuk orang kedua jamak dalam bahasa Ibrani; kapitalisasi “-Ku” dan “Aku” mengikuti kelaziman bahasa Indonesia untuk rujukan kepada Allah.
