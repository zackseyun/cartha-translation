  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: id
  text: maka Aku sendiri akan menentang orang itu dan keluarganya. Aku akan menyingkirkan[a] dia dan semua orang yang mengikuti jejaknya dalam melacurkan diri[b] kepada Molok dari tengah-tengah umat mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memutuskan”. Ini merupakan ungkapan hukuman dalam hubungan perjanjian; ayat ini tidak menjelaskan apakah orang itu disingkirkan melalui kematian, pengusiran, atau tindakan ilahi lainnya.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai kata kerja yang berarti “melacurkan diri” sebagai gambaran ketidaksetiaan dalam penyembahan berhala.
    reason: metaphor_explanation
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: maka Aku sendiri akan menentang
  rationale: Ungkapan harfiah tentang menghadapkan wajah menyatakan sikap aktif melawan. “Menentang” menyampaikan daya idiomatisnya secara alami, sedangkan אֲנִי dipertahankan sebagai “Aku sendiri” untuk menandai penekanan.
- source_word: בָּאִישׁ הַהוּא
  choice: orang itu
  rationale: Dalam konteks hukum ini, אִישׁ menunjuk kepada pelanggar tertentu. “Orang itu” alami dalam bahasa Indonesia dan tidak mengubah identitas tokoh yang sudah ditentukan oleh konteks ayat sebelumnya.
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: dan keluarganya
  rationale: מִשְׁפָּחָה dapat menunjuk keluarga atau kelompok kerabat; “keluarganya” merupakan padanan modern yang alami tanpa mempersempitnya menjadi rumah tangga inti.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: Aku akan menyingkirkan dia
  rationale: Bentuk Hifil dari כרת dalam hukum perjanjian menyatakan pembuangan atau pemutusan dari umat sebagai hukuman ilahi. “Menyingkirkan” mempertahankan gagasan pengeluaran tanpa menentukan apakah caranya kematian, pengusiran, atau tindakan ilahi lain.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: dan semua orang yang mengikuti dia dengan melacurkan diri kepada Molok
  rationale: זנה mempertahankan metafora seksual bagi ketidaksetiaan dalam penyembahan. Susunan Indonesia ini menyampaikan bahwa mereka mengikuti teladan orang tersebut dalam pengabdian berhala kepada Molok, tanpa pengulangan yang sangat janggal.
- source_word: הַמֹּלֶךְ
  choice: Molok
  rationale: Dalam konteks ini bentuk tersebut secara tradisional dipahami sebagai nama ilah Molok. Ejaan “Molok” mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִקֶּרֶב עַמָּם
  choice: dari tengah-tengah bangsa mereka
  rationale: 'Frasa ini menyatakan pengeluaran dari komunitas. Akhiran jamak pada עַמָּם dipertahankan melalui “mereka”, sesuai dengan objek majemuk: orang itu dan semua pengikutnya.'
theological_decisions:
- issue: Metafora ketidaksetiaan seksual untuk penyembahan berhala
  choice: melacurkan diri kepada Molok
  alternative: berlaku tidak setia kepada Molok; menyembah Molok
  rationale: Bahasa sumber sengaja memakai זנה untuk menggambarkan kemurtadan sebagai ketidaksetiaan seksual dalam hubungan perjanjian. Metafora ini dipertahankan dan tidak diratakan menjadi istilah abstrak.
- issue: Arti hukuman ‘dilenyapkan/diputuskan’ dalam perjanjian
  choice: menyingkirkan ... dari tengah-tengah bangsa mereka
  alternative: membunuh; membinasakan; mengucilkan
  rationale: Ayat ini menyatakan hukuman ilahi tetapi tidak menerangkan mekanismenya. Pilihan ini menghindari penetapan bahwa hukuman tersebut pasti berupa kematian atau hanya pengucilan.
- issue: Sasaran frasa אַחֲרָיו
  choice: mengikuti dia
  alternative: berlaku sundal sesudah dia
  rationale: Pronomina tunggal maskulin paling wajar merujuk kepada orang yang disebut sebelumnya. Terjemahan tetap menunjukkan bahwa orang-orang lain mengikuti teladannya, tanpa menjadikan pria itu sendiri objek penyembahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. “Aku sendiri” mempertahankan penekanan ilahi; “melacurkan diri” mempertahankan metafora sumber, sedangkan “menyingkirkan” menjaga ketidakjelasan mengenai bentuk persis hukuman. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskannya.
