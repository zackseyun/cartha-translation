  verdict: revise
  source_fidelity: Draf secara umum menangkap penegasan ilahi, sasaran hukuman (orang itu, keluarganya, dan para pengikutnya), serta ketidakpastian mekanisme idiom 'memutuskan/melenyapkan'. Namun, 'dari tengah-tengah bangsa mereka' kurang tepat bagi עַמָּם dalam konteks komunitas perjanjian; 'umat mereka' lebih setia. Hubungan ganda antara mengikuti orang itu dan penyimpangan kepada Molok juga dapat dibuat lebih jelas.
  naturalness: Bahasanya modern dan jelas. Susunan 'semua orang yang mengikuti dia dengan melacurkan diri kepada Molok' agak membuka kemungkinan bahwa 'melacurkan diri' hanya menerangkan cara mengikuti orang tersebut. 'yang mengikuti jejaknya dalam melacurkan diri kepada Molok' lebih lancar sekaligus menyatakan bahwa mereka meniru pelanggar itu dalam penyembahan yang tidak setia.
  terminology: '''Molok'' adalah ejaan Indonesia yang lazim. ''Melacurkan diri'' secara wajar mempertahankan metafora זנה, dan catatan kaki perlu ditambatkan pada frasa itu, bukan pada nama Molok. ''Umat'' tepat untuk komunitas yang darinya para pelanggar disingkirkan.'
