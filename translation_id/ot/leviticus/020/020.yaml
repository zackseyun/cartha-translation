id: LEV.20.20
reference: Leviticus 20:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: id
  text: Jika seorang laki-laki tidur dengan istri pamannya, ia telah menyingkapkan ketelanjangan pamannya.[a] Keduanya harus menanggung dosa mereka[b]; mereka akan mati tanpa anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketelanjangan pamannya telah ia singkapkan.” Ini adalah ungkapan khas dalam Imamat untuk pelanggaran ikatan kekerabatan seksual yang terlarang melalui hubungan dengan istri paman.
    reason: cultural_note
  - marker: b
    text: Atau, “kesalahan mereka.” Ungkapan Ibrani ini dapat menyatakan dosa maupun kesalahan atau tanggungan yang harus dipikul karena dosa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Jika seorang laki-laki
  rationale: Rangkaian ini memperkenalkan kasus hukum bersyarat. Bentuk maskulin tunggal tetap dipertahankan sesuai teks sumber.
- source_word: יִשְׁכַּב אֶת
  choice: tidur dengan
  rationale: Dalam konteks ini, ungkapan tersebut merupakan idiom hubungan seksual. Padanan Indonesia ini mempertahankan bentuk idiomatisnya dan tetap mudah dipahami.
- source_word: דֹּדָתוֹ
  choice: istri pamannya
  rationale: Kata ini menunjuk kepada istri paman. Pilihan ini lebih tepat daripada 'bibinya', yang dalam bahasa Indonesia juga dapat berarti saudara perempuan ayah atau ibu.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: ia telah menyingkapkan ketelanjangan pamannya
  rationale: Ungkapan khas Imamat ini dipertahankan karena menghubungkan pelanggaran seksual terhadap istri paman dengan ikatan kekerabatan sang paman.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: Keduanya harus menanggung dosa mereka
  rationale: Bentuk jamak mencakup kedua pihak. 'Menanggung dosa' mempertahankan idiom Ibrani, sementara kemungkinan arti 'kesalahan/hukuman akibat kesalahan' dicatat dalam catatan kaki.
- source_word: עֲרִירִים יָמֻתוּ
  choice: mereka akan mati tanpa anak
  rationale: Terjemahan ini mempertahankan rumusan singkat mengenai keadaan atau akibat akhirnya tanpa menentukan mekanisme hukuman maupun apakah yang dimaksud secara khusus adalah tidak mempunyai keturunan yang bertahan hidup.
theological_decisions:
- issue: Arti sanksi עֲרִירִים יָמֻתוּ
  choice: mereka akan mati tanpa anak
  alternative: mereka akan mati tanpa keturunan yang tetap hidup
  rationale: Teks Ibrani menyatakan hasil atau keadaan secara ringkas, tetapi tidak menjelaskan mekanismenya. Terjemahan utama mempertahankan ketegangan itu tanpa menambahkan rincian yuridis atau teologis.
- issue: Hubungan antara dosa dan tanggungan dalam חֶטְאָם יִשָּׂאוּ
  choice: menanggung dosa mereka
  alternative: menanggung kesalahan mereka / menanggung akibat dosa mereka
  rationale: חֵטְא dapat menunjuk pada dosa maupun kesalahan atau tanggungan yang timbul darinya. Ungkapan formal dipertahankan dan alternatifnya diberi dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang ringkas dan bermartabat. 'Istri pamannya' dipilih demi ketepatan hubungan kekerabatan; idiom 'menyingkapkan ketelanjangan' dipertahankan dan dijelaskan melalui catatan kaki.
