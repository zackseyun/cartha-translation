  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: id
  text: Jika seorang laki-laki tidur dengan menantu perempuannya, keduanya harus dihukum mati. Mereka telah melakukan perbuatan tercela[a]; darah mereka sendiri menimpa mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyimpangan,” “kekacauan,” atau “perbuatan keji.” Kata Ibrani תֶּבֶל dalam konteks hukum ini menunjuk kepada tindakan yang secara moral sangat tidak patut atau tidak teratur.
    reason: lexical_alternative
  - marker: b
    text: Maksud idiom Ibrani ini ialah bahwa mereka sendiri bertanggung jawab atas kematian mereka.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Jika seorang laki-laki
  rationale: Dalam rumusan hukum kasuistik ini, frasa tersebut membuka syarat suatu perkara. Bentuk “Jika seorang laki-laki” alami dalam bahasa Indonesia dan tetap mempertahankan subjek maskulin yang dinyatakan teks Ibrani.
- source_word: יִשְׁכַּב אֶת
  choice: tidur dengan
  rationale: Kata שׁכב dengan אֶת merupakan idiom hubungan seksual dalam konteks ini. “Tidur dengan” mempertahankan idiom sumber dan dapat dipahami dalam bahasa Indonesia modern tanpa menjadi terlalu kasar.
- source_word: כַּלָּתוֹ
  choice: menantu perempuannya
  rationale: כַּלָּה di sini secara khusus menunjuk kepada istri anak laki-laki. Penambahan “perempuan” menghindari ketidakjelasan karena “menantu” dalam bahasa Indonesia tidak menandai gender.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: keduanya harus dihukum mati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan hukuman mati bagi kedua pihak. “Harus dihukum mati” menyampaikan daya wajib dan tegas dari ketentuan hukum tersebut secara alami.
- source_word: תֶּבֶל עָשׂוּ
  choice: Mereka telah melakukan perbuatan tercela
  rationale: תֶּבֶל menyifatkan tindakan itu sebagai pelanggaran moral yang sangat tidak patut atau tidak teratur. “Perbuatan tercela” mempertahankan penilaian moral teks tanpa mempersempit istilah yang jarang ini secara berlebihan.
- source_word: דְּמֵיהֶם בָּם
  choice: darah mereka tertanggung atas diri mereka sendiri
  rationale: Terjemahan ini mempertahankan metafora darah dalam idiom hukum Ibrani sekaligus menyampaikan bahwa tanggung jawab atas kematian itu berada pada para pelanggar sendiri.
theological_decisions:
- issue: Subjek hukum yang bergender
  choice: seorang laki-laki
  alternative: seseorang
  rationale: אִישׁ berbentuk maskulin dan perkara ini secara khusus menyebut laki-laki yang berhubungan dengan istri anaknya. Terjemahan tidak menetralkan gender yang dinyatakan sumber.
- issue: Cakupan makna תֶּבֶל
  choice: perbuatan tercela
  alternative: penyimpangan; kekacauan; perbuatan keji
  rationale: Istilah Ibrani ini mengandung kecaman moral yang kuat, tetapi nuansa tepatnya diperdebatkan. Pilihan utama menyampaikan kecaman itu tanpa menetapkan kategori teologis yang lebih sempit daripada teks.
- issue: Makna idiom darah
  choice: mempertahankan idiom “darah mereka tertanggung atas diri mereka sendiri”
  alternative: mereka sendiri bertanggung jawab atas kematian mereka
  rationale: Metafora darah merupakan bagian penting dari rumusan hukum sumber. Catatan kaki menjelaskan fungsi idiom tersebut tanpa menghapusnya dari teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumusan “tidur dengan” mempertahankan idiom seksual sumber; “menantu perempuannya” memperjelas hubungan kekerabatan; struktur kalimat tetap ringkas sesuai gaya hukum.
