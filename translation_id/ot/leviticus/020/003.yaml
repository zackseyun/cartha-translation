reference: Leviticus 20:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: id
  text: Aku sendiri akan menentang orang itu dan menyingkirkannya dari antara bangsanya, karena ia telah memberikan sebagian keturunannya kepada Molok[a], dengan maksud menajiskan tempat kudus-Ku dan mencemarkan nama-Ku yang kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah mengurbankan sebagian anaknya kepada Molok.” Secara harfiah, bahasa Ibrani mengatakan “telah memberikan sebagian keturunannya kepada Molok”; makna pengurbanan disimpulkan dari konteks yang lebih luas.
    reason: Mempertahankan kata kerja umum “memberikan” dalam teks utama sambil mencatat pembacaan pengurbanan yang sangat didukung oleh konteks, tanpa menambahkannya ke dalam klausa sumber.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Aku sendiri
  rationale: Kata ganti mandiri אָנֹכִי/אֲנִי di sini bersifat menegaskan; “Aku sendiri” menyampaikan keterlibatan pribadi Allah secara wajar dalam bahasa Indonesia.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: akan menentang orang itu
  rationale: Ungkapan harfiah “menaruh wajah-Ku terhadap orang itu” adalah idiom tentang perlawanan ilahi yang disengaja. “Menentang” menyampaikan maknanya secara alami tanpa mengaburkan pelakunya.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: dan melenyapkannya
  rationale: Bentuk Hifil dari כרת menyatakan tindakan menyingkirkan atau memutuskan seseorang. “Melenyapkan” mempertahankan bobot hukuman, tetapi tidak menentukan secara eksplisit cara pelaksanaannya.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: dari tengah-tengah bangsanya
  rationale: Mempertahankan gambaran komunal dalam rumusan penghukuman ini; “bangsanya” merujuk pada kelompok umat tempat orang itu berada.
- source_word: מִזַּרְעוֹ
  choice: sebagian keturunannya
  rationale: מִן bersifat partitif, sedangkan זֶרַע dalam konteks ini menunjuk kepada keturunan atau anak. Pilihan ini dekat dengan bentuk sumber tanpa terlebih dahulu menafsirkan tindakan itu sebagai persembahan.
- source_word: נָתַן לַמֹּלֶךְ
  choice: telah memberikan ... kepada Molok
  rationale: Kata kerja נָתַן berarti “memberikan”. Terjemahan ini tidak menambahkan “mempersembahkan” atau “mengurbankan”, meskipun konteks yang lebih luas mengarah pada praktik pengurbanan anak.
- source_word: לְמַעַן
  choice: sehingga
  rationale: Dalam konteks ini dapat menyatakan tujuan atau akibat. “Sehingga” mempertahankan hubungan erat antara tindakan tersebut dan penajisan yang ditimbulkannya tanpa memaksakan bahwa penajisan itu adalah tujuan subjektif pelaku.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: menajiskan tempat kudus-Ku
  rationale: טמא memiliki nuansa kenajisan ritual dalam konteks imamat. “Menajiskan” tepat dan lazim, sedangkan מִקְדָּשׁ diterjemahkan secara alami sebagai “tempat kudus”.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: dan mencemarkan nama-Ku yang kudus
  rationale: חלל berarti memperlakukan yang kudus sebagai biasa atau menodainya. “Mencemarkan” menyampaikan pelanggaran terhadap kekudusan nama Allah dalam bahasa Indonesia modern dan bermartabat.
- source_word: אִישׁ הַהוּא
  choice: orang itu
  rationale: Walaupun אִישׁ berbentuk maskulin tunggal, “orang itu” merupakan rujukan alami kepada pelanggar tertentu dalam bahasa Indonesia dan tidak mengubah jumlah maupun kekhususan referennya.
- source_word: הַמֹּלֶךְ
  choice: Molok
  rationale: Diperlakukan sebagai nama diri dan ditransliterasikan dengan bentuk Indonesia yang lazim, “Molok”.
theological_decisions:
- issue: Hakikat tindakan yang berkaitan dengan Molok
  choice: Mempertahankan ungkapan “telah memberikan sebagian keturunannya kepada Molok” dalam teks utama.
  alternative: “telah mengurbankan sebagian anaknya kepada Molok” atau “telah membuat anaknya melewati api bagi Molok”.
  rationale: Konteks luas sangat kuat menunjuk kepada pengurbanan anak, tetapi ayat ini memakai kata umum נָתַן, “memberikan”. Terjemahan utama tidak menambahkan rincian yang tidak dinyatakan dalam klausa ini; implikasi ritual dijelaskan dalam catatan kaki.
- issue: Keterlibatan pribadi Allah dalam penghukuman
  choice: “Aku sendiri” serta “akan menentang orang itu”.
  alternative: “Aku akan menghadapkan wajah-Ku kepada orang itu” atau sekadar “Aku akan melawannya”.
  rationale: Kata ganti yang dinyatakan secara mandiri menegaskan tindakan pribadi Allah. Makna idiom wajah dipertahankan secara semantis dalam bahasa Indonesia yang alami.
- issue: Arti penghukuman כרת
  choice: “melenyapkannya dari tengah-tengah bangsanya”.
  alternative: “memutuskan dia dari antara bangsanya”, “mengucilkannya”, atau “membunuhnya”.
  rationale: Istilah itu dapat mencakup hukuman berat berupa pemusnahan atau penyingkiran, tetapi cara tepatnya tidak dijelaskan di sini. “Melenyapkan” menjaga bobotnya tanpa menentukan mekanisme hukuman.
- issue: Nuansa לְמַעַן
  choice: “sehingga”.
  alternative: “dengan maksud untuk” atau “supaya”.
  rationale: Bentuk Ibrani dapat menyatakan tujuan maupun hasil. Dalam konteks kecaman ilahi ini, “sehingga” menghindari penetapan bahwa pelaku secara sadar bertujuan menajiskan tempat kudus, sambil tetap menunjukkan akibat teologis tindakannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pronomina ilahi menggunakan “Aku/-Ku”. Istilah kultis diterjemahkan dengan kosakata yang mudah dipahami tetapi tetap tepat, seperti “menajiskan” dan “tempat kudus”. Idiom Ibrani yang terasa tidak alami dialihkan secara semantis, sedangkan ketegasan dan ambiguitas sumber dipertahankan.
