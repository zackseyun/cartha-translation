  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: id
  text: Jika seorang laki-laki melakukan hubungan seksual dengan seekor binatang[a], ia harus dihukum mati, dan binatang itu harus kalian bunuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan pembaringannya dengan seekor binatang,” sebuah ungkapan Ibrani untuk melakukan hubungan seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina ini menunjuk khusus kepada pelaku laki-laki; kasus perempuan dibahas secara terpisah dalam ayat berikutnya.
- source_word: אֲשֶׁר
  choice: jika
  rationale: Walaupun secara formal merupakan partikel relatif, dalam rumusan hukum kasuistik unsur ini secara alami menyatakan syarat.
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: melakukan hubungan seksual
  rationale: Ungkapan Ibrani harfiah 'memberikan persetubuhannya' adalah idiom untuk hubungan seksual. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בִּבְהֵמָה
  choice: dengan seekor binatang
  rationale: בְּהֵמָה berarti binatang atau hewan; 'binatang' jelas dan alami dalam konteks hukum ini.
- source_word: מוֹת יוּמָת
  choice: ia harus dihukum mati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian serta keharusan hukuman mati. Bahasa Indonesia menyampaikan daya hukum itu secara alami dengan 'harus dihukum mati'.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: dan binatang itu harus kalian bunuh
  rationale: Verba orang kedua jamak ditampilkan dengan 'kalian', sehingga sapaan kepada komunitas atau para pelaksana hukum tetap terlihat; 'harus' menyampaikan tuntutan hukum.
theological_decisions:
- issue: Kekhususan gender pelaku
  choice: laki-laki secara khusus
  alternative: orang secara umum
  rationale: Ayat ini secara khusus membicarakan pelaku laki-laki, sedangkan ayat berikutnya membicarakan kasus perempuan. Terjemahan netral gender akan mengaburkan susunan dan kekhususan hukum sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. 'Melakukan hubungan seksual' dipilih agar makna hukum jelas tanpa bahasa kasar. Bentuk jamak 'kalian' mempertahankan orang kedua jamak dalam teks Ibrani.
