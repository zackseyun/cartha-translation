  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: id
  text: Namun, Aku berfirman kepada kalian, “Kalian akan memiliki tanah mereka[a], dan Aku sendiri akan memberikannya kepada kalian untuk memilikinya”—negeri yang berlimpah dengan susu dan madu.[b] Akulah Yahweh[c], Allah kalian, yang telah memisahkan kalian dari bangsa-bangsa.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kalian akan mewarisi tanah mereka ... untuk mewarisinya.” Kata kerja Ibrani יָרַשׁ dapat berarti mewarisi ataupun mengambil milik.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “negeri yang mengalir dengan susu dan madu” menyatakan kelimpahan dan kesuburan.
    reason: cultural_note
  - marker: c
    text: 'Ibrani: YHWH, yang secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
  - marker: d
    text: Atau, “yang telah memisahkan kalian dari antara bangsa-bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Namun, Aku berfirman
  rationale: Konjungsi waw meneruskan wacana, sedangkan “Namun” menyatakan kontras yang sesuai dengan konteks. “Berfirman” merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: תִּירְשׁוּ ... לָרֶשֶׁת אֹתָהּ
  choice: akan memiliki ... untuk kalian miliki
  rationale: Kata ירשׁ mencakup gagasan memperoleh atau mengambil suatu wilayah menjadi milik. “Memiliki” mempertahankan kesejajaran kedua bentuk verba tanpa menyempitkannya menjadi warisan pasif; kemungkinan “mewarisi” dicatat dalam catatan kaki.
- source_word: אַדְמָתָם
  choice: tanah mereka
  rationale: אדמה secara dasar berarti tanah, dan dalam konteks ini menunjuk pada wilayah yang akan menjadi milik Israel.
- source_word: וַאֲנִי
  choice: dan Aku sendiri
  rationale: Pronomina mandiri memberi penekanan pada Allah sebagai pemberi negeri itu; “Aku sendiri” mempertahankan penekanan tersebut.
- source_word: אֶתְּנֶנָּה
  choice: akan memberikannya
  rationale: Bentuk ini menyatakan janji Allah untuk memberikan tanah tersebut; sufiks objeknya dipertahankan dengan “-nya”.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: negeri yang berlimpah susu dan madu
  rationale: Ungkapan ini menggambarkan kesuburan dan kelimpahan. “Berlimpah susu dan madu” menyampaikan idiom Ibrani secara alami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: הִבְדַּלְתִּי
  choice: telah memisahkan
  rationale: בדל berarti memisahkan atau mengkhususkan. “Memisahkan” adalah padanan langsung yang mempertahankan tema pembedaan dalam konteks pasal ini.
- source_word: הָעַמִּים
  choice: bangsa-bangsa
  rationale: עמים menunjuk pada kelompok-kelompok bangsa secara luas. Bentuk jamak “bangsa-bangsa” alami dalam bahasa Indonesia dan tidak menambahkan nuansa politik yang berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama YHWH secara langsung. “Yahweh” mempertahankan nama perjanjian itu, sementara bentuk tradisional Indonesia dicatat bagi pembaca.
- issue: Makna pembedaan Israel dari bangsa-bangsa
  choice: yang telah memisahkan kalian dari bangsa-bangsa
  alternative: yang telah mengkhususkan kalian dari antara bangsa-bangsa
  rationale: Pilihan utama mengikuti makna langsung בדל dan tidak mengembangkan pernyataan ini menjadi kategori teologis yang tidak dinyatakan dalam ayat.
- issue: Nuansa ירשׁ dalam janji tanah
  choice: memiliki
  alternative: mewarisi
  rationale: Kata Ibrani dapat mencakup pewarisan sekaligus pengambilalihan menjadi milik. Teks utama memakai padanan yang luas, sedangkan alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperlihatkan bahwa sapaan Ibrani berbentuk jamak, sedangkan kapitalisasi “Aku” mengikuti kebiasaan bahasa Indonesia untuk rujukan ilahi. Struktur janji dipertahankan, tetapi idiom tentang susu dan madu dibuat alami serta dijelaskan secara harfiah dalam catatan kaki.
