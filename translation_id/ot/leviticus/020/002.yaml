  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: id
  text: Dan katakanlah kepada orang Israel, “Setiap orang dari antara orang Israel atau dari antara pendatang yang tinggal di Israel[a], yang menyerahkan salah seorang anaknya[b] kepada Molok[c], pasti dihukum mati. Rakyat negeri itu harus merajam dia dengan batu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pendatang yang tinggal”; bahasa Ibrani memakai kata benda dan kata kerja yang seakar.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “anak” secara harfiah berarti “benih” dan di sini mengacu kepada anak atau keturunan seseorang.
    reason: lexical_alternative
  - marker: c
    text: Molok mungkin menunjuk kepada dewa atau gelar yang secara tradisional dikaitkan dengan pengurbanan anak. Sebagian penafsir memahami istilah ini sebagai nama suatu jenis persembahan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini menunjuk kepada anggota umat Israel. ‘Orang Israel’ alami dalam bahasa Indonesia modern dan tetap mempertahankan identitas kolektif yang dimaksud tanpa menambahkan penafsiran.
- source_word: אִישׁ אִישׁ
  choice: siapa pun
  rationale: Pengulangan אִישׁ merupakan ungkapan distributif, yakni setiap orang tanpa pengecualian dalam kelompok yang kemudian disebut. ‘Siapa pun’ menyampaikan daya cakup itu secara alami.
- source_word: הַגֵּר הַגָּר
  choice: pendatang yang tinggal
  rationale: גֵּר adalah orang asing yang menetap di tengah komunitas Israel. Pilihan ini mempertahankan hubungan antara nomina dan verba serumpun tanpa memakai istilah hukum modern yang terlalu teknis.
- source_word: יִתֵּן מִזַּרְעוֹ
  choice: menyerahkan salah seorang keturunannya
  rationale: זֶרַע secara harfiah berarti ‘benih’, tetapi ketika mengacu kepada manusia berarti keturunan atau anak cucu. Unsur partitif מִן tercermin dalam ‘salah seorang dari’.
- source_word: לַמֹּלֶךְ
  choice: kepada Molok
  rationale: Molok dipertahankan sebagai nama atau gelar yang paling lazim dipahami dalam konteks ini; kemungkinan bahwa istilah tersebut menunjuk kepada suatu jenis persembahan dicatat dalam catatan kaki.
- source_word: מוֹת יוּמָת
  choice: pasti dihukum mati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian hukuman mati. Bentuk pasif menunjukkan putusan hukuman, bukan sekadar kematian biasa.
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri itu
  rationale: Terjemahan ini mempertahankan arti konkret ungkapan Ibrani dan dalam konteks hukum menunjuk kepada komunitas negeri yang melaksanakan hukuman.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: harus merajam dia dengan batu
  rationale: ‘Merajam’ merupakan padanan Indonesia yang lazim bagi pelaksanaan hukuman dengan melempari seseorang dengan batu; penyebutan ‘dengan batu’ mempertahankan alat yang dinyatakan dalam teks Ibrani.
theological_decisions:
- issue: Makna tindakan yang berkaitan dengan Molok
  choice: Teks utama menyatakan penyerahan keturunan kepada Molok tanpa menguraikan cara atau bentuk ritusnya.
  alternative: Molok dapat dipahami sebagai nama dewa atau gelar yang terkait dengan pengurbanan anak; sebagian penafsir memahami molekh sebagai nama suatu jenis persembahan.
  rationale: Ayat ini sendiri tidak menyebut api atau menjelaskan tata ritus. Karena itu, terjemahan tidak menambahkan ‘mengurbankan dalam api’, sehingga ketegangan dan keluasan bukti bahasa sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang khidmat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara pengulangan dan penegasan penting dalam bahasa Ibrani dipertahankan sejauh alami. Ejaan ‘Molok’ mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
