  source_fidelity: 'Draf pada umumnya setia kepada struktur dan makna Ibrani: cakupan orang Israel serta pendatang, tindakan memberi keturunan kepada Molok, penegasan hukuman mati, dan pelaksanaan rajam oleh rakyat negeri dipertahankan. Namun, “menyerahkan salah seorang keturunannya” kurang wajar dan kurang tepat secara idiomatis dalam bahasa Indonesia, karena “keturunan” biasanya menunjuk generasi penerus secara kolektif, bukan seorang anak tertentu. Dalam konteks ini זַרְעוֹ paling wajar diterjemahkan “anaknya,” dengan catatan kaki yang mempertahankan arti harfiahnya yang lebih luas.'
