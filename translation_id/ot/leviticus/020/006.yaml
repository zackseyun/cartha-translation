  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: id
  text: “Jika seseorang berpaling kepada para pemanggil arwah dan para peramal roh[a] untuk berzina dengan mengikuti mereka[b], Aku akan menentang orang itu dan memutuskan dia dari tengah-tengah bangsanya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kedua istilah Ibrani ini menunjuk kepada praktisi gaib yang mencari pengetahuan atau petunjuk melalui arwah orang mati atau roh-roh; perbedaan tepat antara kedua istilah itu tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “untuk berzina mengikuti mereka”; ini adalah metafora bagi ketidaksetiaan kepada Allah melalui praktik spiritual yang terlarang.
    reason: lexical_alternative
  - marker: c
    text: “Memutuskan” merupakan rumusan hukum yang baku. Ayat ini tidak menjelaskan secara khusus cara penghakiman itu dilaksanakan.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: seseorang / orang itu
  rationale: Dalam konteks hukum, נֶפֶשׁ menunjuk kepada seorang individu, bukan secara khusus kepada jiwa sebagai unsur nonjasmani.
- source_word: תִּפְנֶה
  choice: berpaling kepada
  rationale: Pilihan ini mempertahankan gambaran dasar verba פנה sekaligus menyampaikan tindakan mencari bantuan atau petunjuk dari praktisi gaib.
- source_word: הָאֹבֹת
  choice: para pemanggil arwah
  rationale: אוֹב dalam konteks ini berkaitan dengan praktisi yang berhubungan dengan arwah atau roh; ungkapan ini lebih jelas bagi pembaca Indonesia modern daripada transliterasi atau istilah teknis yang langka.
- source_word: הַיִּדְּעֹנִים
  choice: para peramal roh
  rationale: יִדְּעֹנִי adalah praktisi pengetahuan gaib yang kerap dipasangkan dengan אוֹב. Terjemahan ini membedakannya dari kelompok pertama tanpa mengklaim perbedaan teknis yang terlalu pasti.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: lalu berzina dengan mengikuti mereka
  rationale: Terjemahan mempertahankan metafora seksual זנה bagi ketidaksetiaan religius atau perjanjian, sedangkan 'dengan mengikuti mereka' menyampaikan unsur אַחֲרֵיהֶם secara wajar dalam bahasa Indonesia.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: Aku akan menghadapkan wajah-Ku melawan orang itu
  rationale: Ungkapan ini mempertahankan citra Ibrani tentang wajah Allah yang diarahkan kepada seseorang dalam perlawanan dan penghakiman.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: dan memutuskan dia
  rationale: Verba כרת secara harfiah berarti 'memotong' atau 'memutuskan'. Pilihan ini mempertahankan rumusan hukum dan tidak menentukan secara berlebihan apakah hukumannya berupa kematian, pengucilan, atau tindakan penghakiman ilahi lainnya.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: dari tengah-tengah bangsanya
  rationale: Terjemahan ini mempertahankan latar komunal dan rumusan sumber secara dekat serta tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Metafora perzinaan bagi ketidaksetiaan kepada Allah
  choice: berzina dengan mengikuti mereka
  alternative: berlaku tidak setia dengan mengikuti mereka
  rationale: Teks Ibrani secara eksplisit memakai זנה. Mempertahankan metafora perzinaan menjaga bobot relasional dan perjanjian dari pelanggaran itu tanpa mereduksinya menjadi ketidaktaatan umum.
- issue: Makna hukuman כרת
  choice: memutuskan dia dari tengah-tengah bangsanya
  alternative: melenyapkan dia dari tengah-tengah bangsanya
  rationale: Cara pelaksanaan hukuman tidak dijelaskan dalam ayat ini. 'Memutuskan' mempertahankan metafora serta keterbukaan rumusan Ibrani, sementara 'melenyapkan' dapat terlalu cepat dipahami khusus sebagai kematian.
- issue: Citra wajah Allah dalam penghakiman
  choice: menghadapkan wajah-Ku melawan orang itu
  alternative: menentang orang itu
  rationale: Bentuk terpilih mempertahankan antropomorfisme sumber dan kekuatan gambaran tentang perhatian ilahi yang diarahkan untuk menghakimi, tanpa mengubahnya menjadi pernyataan abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum bersyarat dibuat alami dengan 'Jika seseorang', sedangkan metafora utama sumber—berpaling, berzina, wajah Allah, dan memutuskan—dipertahankan sejauh masih jelas bagi pembaca umum.
