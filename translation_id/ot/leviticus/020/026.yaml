source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: id
  text: Kamu harus menjadi kudus bagi-Ku, sebab Aku, Yahweh, kudus, dan Aku telah memisahkan kamu dari bangsa-bangsa[a] supaya kamu menjadi milik-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbagai kelompok masyarakat.” Kata Ibrani עַמִּים dapat berarti “berbagai kelompok masyarakat” atau, dalam beberapa konteks, “bangsa-bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: Kamu harus menjadi
  rationale: Bentuk ini dalam konteks hukum dan nasihat menyatakan tuntutan perjanjian dengan nuansa hasil yang diharapkan. Pilihan ini alami dalam bahasa Indonesia dan tidak sekadar menyatakan keadaan pada masa depan.
- source_word: לִי קְדֹשִׁים
  choice: kudus bagi-Ku
  rationale: “Kudus” mempertahankan cakupan moral dan ritual dari קָדוֹשׁ, sedangkan “bagi-Ku” menyatakan hubungan dan pengkhususan kepada Yahweh.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan dasar bagi tuntutan agar umat menjadi kudus.
- source_word: קָדוֹשׁ אֲנִי
  choice: Aku ... kudus
  rationale: Susunan Indonesia ini mempertahankan pernyataan tentang kekudusan Yahweh sekaligus kaitannya dengan kekudusan umat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: dan Aku telah memisahkan kamu
  rationale: “Memisahkan” mempertahankan arti בדל dan membedakannya dari akar kata yang diterjemahkan “kudus”. Bentuk “telah” menyatakan tindakan yang selesai dengan relevansi yang tetap berlangsung.
- source_word: מִן הָעַמִּים
  choice: dari bangsa-bangsa
  rationale: “Bangsa-bangsa” merupakan ungkapan Indonesia yang alami bagi kelompok-kelompok manusia dalam bentuk jamak; cakupan leksikalnya dijelaskan dalam catatan kaki.
- source_word: לִהְיוֹת לִי
  choice: supaya kamu menjadi milik-Ku
  rationale: “Supaya” menyatakan tujuan atau hasil pemisahan itu, dan “menjadi milik-Ku” mengungkapkan hubungan kepunyaan perjanjian secara alami.
theological_decisions:
- issue: Bahasa tentang kekudusan Israel dapat dipersempit menjadi kemurnian moral saja atau keterpisahan ritual saja.
  choice: Memakai “kudus” untuk קדש dan “memisahkan” untuk בדל.
  alternative: Menerjemahkan kedua konsep dengan ungkapan yang sama, seperti “mengkhususkan” atau “dipisahkan”.
  rationale: Teks sendiri membedakan kekudusan umat yang berakar pada kekudusan Yahweh dari tindakan Yahweh memisahkan mereka dari bangsa-bangsa. Pembedaan leksikal ini mempertahankan keluasan dan ketegangan teologis teks.
- issue: Penerjemahan nama ilahi יְהוָה.
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi perjanjian, bukan menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kamu” dipakai sebagai sapaan jamak kolektif sesuai konteks umat Israel; kapitalisasi pada akhiran “-Ku” mengikuti kebiasaan penulisan rujukan kepada Allah dalam bahasa Indonesia.
