  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: id
  text: Kuduskanlah diri kalian[a] dan jadilah kudus, karena Akulah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jadikanlah diri kalian kudus.” Kata kerja Ibrani ini berbentuk refleksif dan menyerukan tindakan aktif untuk menguduskan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Kuduskanlah dirimu
  rationale: Bentuk hitpael dari קדשׁ menyatakan tindakan refleksif yang aktif. Pilihan ini membedakannya dari keadaan atau panggilan untuk 'menjadi kudus' dalam klausa berikutnya.
- source_word: וִהְיִיתֶם
  choice: dan jadilah
  rationale: Bentuk היה yang mengikuti perintah sebelumnya secara alami berfungsi sebagai perintah kedua yang terkoordinasi.
- source_word: קְדֹשִׁים
  choice: kudus
  rationale: Dalam konteks perjanjian dan etika Imamat, 'kudus' mempertahankan bobot teologis kata Ibrani dan lebih utuh daripada sekadar 'terpisah'.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan yang mendasari kedua perintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan untuk mempertahankan nama pribadi yang terdapat langsung dalam teks Ibrani.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Walaupun אֱלֹהִים berbentuk morfologis jamak, dalam konteks ini kata tersebut menunjuk kepada Allah Israel yang tunggal; sufiksnya mengacu kepada Israel secara kolektif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankan nama perjanjian, bukan menggantinya dengan gelar.
- issue: Hubungan tindakan menguduskan diri dan menjadi kudus
  choice: Dua perintah yang terkoordinasi
  alternative: Perintah pertama sebagai sarana atau tujuan eksplisit bagi yang kedua
  rationale: Kata penghubung ו mengoordinasikan kedua bentuk tersebut. Terjemahan tidak mengubahnya menjadi hubungan tujuan seperti 'supaya kamu menjadi kudus', sehingga ketegangan antara tindakan aktif dan keadaan kudus tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk tunggal 'dirimu' dan 'Allahmu' memperlakukan Israel sebagai umat secara kolektif, selaras dengan sufiks orang kedua jamak dalam bahasa Ibrani tanpa menghasilkan ungkapan Indonesia yang kaku.
