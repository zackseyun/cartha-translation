  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: id
  text: Jika seorang laki-laki bersetubuh dengan istri ayahnya, ia telah menyingkapkan aurat ayahnya[a]. Keduanya harus dihukum mati; darah mereka tertimpa kepada mereka sendiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “ia telah mempermalukan ayahnya secara seksual.” Teks Ibrani secara harfiah berbunyi, “ia telah menyingkapkan aurat ayahnya,” sebuah ungkapan tetap dalam Imamat bagi pelanggaran seksual yang terlarang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “darah mereka ada pada mereka.” Ini adalah rumusan hukum yang menunjukkan bahwa tanggung jawab atas kematian mereka berada pada diri mereka sendiri.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Jika seorang laki-laki
  rationale: Rangkaian ini memperkenalkan kasus hukum bersyarat. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan pelaku laki-laki yang dinyatakan secara khusus dalam teks Ibrani.
- source_word: יִשְׁכַּב אֶת
  choice: bersetubuh dengan
  rationale: Dalam konteks hukum seksual, kata kerja ini menyatakan hubungan seksual. 'Bersetubuh dengan' jelas, bermartabat, dan tidak dapat disalahartikan hanya sebagai tidur bersama.
- source_word: אֵשֶׁת אָבִיו
  choice: istri ayahnya
  rationale: Terjemahan ini mengikuti ungkapan Ibrani secara langsung. 'Ibu tirinya' mungkin sering menjadi acuan, tetapi lebih sempit daripada istilah sumber.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: ia telah menyingkapkan aurat ayahnya
  rationale: Ungkapan khas dalam Imamat ini dipertahankan agar hubungan antarteks dan daya moral-hukumnya tidak diratakan menjadi parafrasa.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: Keduanya harus dihukum mati
  rationale: Infinitif absolut bersama verba finit menegaskan hukuman mati. 'Harus dihukum mati' menyampaikan ketetapan hukum yang tegas tanpa menambahkan cara pelaksanaannya.
- source_word: דְּמֵיהֶם בָּם
  choice: darah mereka tertanggung atas mereka sendiri
  rationale: Rumusan hukum ini menyatakan bahwa tanggung jawab atas kematian mereka berada pada diri mereka sendiri. Bentuk idiomatisnya dipertahankan sambil dibuat dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan ungkapan hukum seksual dan kaitannya dengan ayah
  choice: ia telah menyingkapkan aurat ayahnya
  alternative: ia telah mempermalukan ayahnya secara seksual
  rationale: Teks memakai ungkapan baku dalam hukum kekudusan. Mempertahankan metafora 'aurat' menjaga kaitannya dengan Imamat 18 dan tidak mempersempit makna menjadi satu tafsiran saja.
- issue: Subjek hukum yang bergender
  choice: Jika seorang laki-laki
  alternative: Jika seseorang
  rationale: Teks Ibrani secara khusus menyebut seorang laki-laki sebagai pelaku; bentuk netral akan menghilangkan unsur yang ada dalam sumber.
- issue: Tanggung jawab atas hukuman mati
  choice: darah mereka tertanggung atas mereka sendiri
  alternative: mereka menanggung kesalahan yang mendatangkan kematian itu
  rationale: Rumusan darah dipertahankan karena merupakan bahasa hukum-teologis khas teks, sedangkan catatan kaki menjelaskan fungsinya tanpa meniadakan metafora.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bersetubuh' dipilih demi kejelasan dalam konteks hukum; 'menyingkapkan aurat' mempertahankan idiom khas Imamat. Struktur kalimat dibuat ringkas dan tegas sesuai corak ketetapan hukum.
