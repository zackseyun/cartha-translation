id: LEV.20.14
reference: Leviticus 20:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: id
  text: Jika seorang laki-laki mengambil seorang perempuan dan juga ibunya[a], itu adalah perbuatan keji. Mereka harus membakar laki-laki itu dan kedua perempuan tersebut dengan api[b], supaya tidak ada perbuatan keji di tengah-tengah kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menikahi seorang perempuan dan ibunya.” Kata Ibrani yang diterjemahkan “mengambil” dapat menyiratkan perkawinan dalam konteks hukum, tetapi di sini perkawinan tidak disebutkan secara tersurat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka harus membakar dia dan mereka dengan api”; “mereka” sebagai objek merujuk kepada perempuan itu dan ibunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Bentuk Ibrani ini maskulin tunggal dan menunjuk kepada pihak laki-laki yang melakukan pelanggaran.
- source_word: יִקַּח
  choice: mengambil
  rationale: Secara harfiah berarti 'mengambil' dan dalam konteks hukum dapat menyiratkan mengambil sebagai istri; terjemahan ini mempertahankan keluasan ungkapan sumber tanpa secara eksplisit menetapkan perkawinan.
- source_word: אִשָּׁה וְאֶת אִמָּהּ
  choice: seorang perempuan dan juga ibunya
  rationale: אִשָּׁה dapat berarti perempuan atau istri. 'Perempuan' tidak mempersempit status hubungan, sedangkan 'juga' memperjelas bahwa kedua orang itu menjadi objek verba yang sama.
- source_word: זִמָּה
  choice: perbuatan keji
  rationale: Dalam hukum seksual Imamat, istilah ini menunjuk kepada tindakan yang sangat tercela atau tidak senonoh. 'Perbuatan keji' alami dalam bahasa Indonesia dan menyampaikan penilaian moral yang kuat tanpa terlalu menentukan nuansanya.
- source_word: בָּאֵשׁ יִשְׂרְפוּ
  choice: membakar ... dengan api
  rationale: Mempertahankan konstruksi aktif jamak dan fungsi ב sebagai penanda sarana.
- source_word: אֹתוֹ וְאֶתְהֶן
  choice: laki-laki itu dan kedua perempuan tersebut
  rationale: Bentuk אֶתְהֶן adalah objek feminin jamak dan merujuk kepada perempuan serta ibunya. Penyebutan eksplisit menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: supaya tidak ada perbuatan keji di tengah-tengah kamu
  rationale: Ungkapan ini menyampaikan hasil atau tujuan hukuman, dan 'di tengah-tengah kamu' mempertahankan citra spasial-komunal teks Ibrani.
theological_decisions:
- issue: Sifat hubungan yang tersirat oleh 'mengambil seorang perempuan dan ibunya'
  choice: Memakai ungkapan luas 'mengambil seorang perempuan dan juga ibunya'.
  alternative: Menikahi seorang perempuan dan ibunya.
  rationale: לקח dapat menyiratkan perkawinan dalam konteks hukum, tetapi ayat ini tidak memakai istilah yang secara tersurat berarti menikah. Pilihan utama menjaga ambiguitas sumber; kemungkinan perkawinan dicatat dalam catatan kaki.
- issue: Bentuk rumusan hukuman
  choice: 'Mempertahankan kalimat hukum aktif: ''Mereka harus membakar laki-laki itu dan kedua perempuan tersebut dengan api.'''
  alternative: Laki-laki itu dan kedua perempuan tersebut harus dibakar dengan api.
  rationale: Teks Ibrani memakai verba aktif orang ketiga jamak dengan objek yang disebutkan; pelaku pembakaran tidak dijelaskan lebih lanjut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Perbuatan keji' dipakai secara konsisten untuk dua kemunculan זִמָּה. Rumusan aktif dipertahankan, sementara objek feminin jamak dibuat eksplisit agar rujukannya jelas dalam bahasa Indonesia.
