source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: id
  text: Jika seorang laki-laki mengambil saudara perempuannya—anak perempuan ayahnya atau anak perempuan ibunya—lalu ia melihat aurat saudara perempuannya itu, dan saudara perempuannya itu melihat auratnya, itu adalah perbuatan tercela.[a] Mereka harus disingkirkan di hadapan orang-orang sebangsa mereka.[b] Laki-laki itu telah menyingkapkan aurat saudara perempuannya; ia harus menanggung kesalahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata Ibrani yang diterjemahkan “perbuatan tercela” di sini memiliki makna negatif yang langka: dapat juga diterjemahkan “perbuatan memalukan” atau “aib”. Di tempat lain kata ini biasanya berarti “kasih setia” atau “kebaikan”.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “harus disingkirkan” mempertahankan rumusan hukum Ibrani tanpa menentukan apakah hukumannya berupa kematian, pengusiran, atau bentuk penyingkiran lainnya.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk maskulin tunggal dalam rumusan hukum Ibrani.
- source_word: יִקַּח
  choice: mengambil
  rationale: Makna dasarnya adalah 'mengambil'. Dalam konteks ini kata tersebut dapat menyiratkan mengambil sebagai istri atau secara seksual, tetapi terjemahan tidak mempersempit maknanya melampaui teks.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: saudara perempuannya—anak perempuan ayahnya atau anak perempuan ibunya
  rationale: Menjaga penjelasan aposisional bahwa larangan mencakup saudara perempuan seayah maupun seibu.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: lalu melihat aurat perempuan itu, dan perempuan itu melihat auratnya
  rationale: Mempertahankan citra dan idiom hukum 'melihat aurat', yang dalam konteks larangan hubungan sedarah mengacu pada penyingkapan seksual.
- source_word: חֶסֶד
  choice: perbuatan tercela
  rationale: Dalam pemakaian negatif yang langka ini, kata tersebut menunjuk pada tindakan memalukan atau tercela, bukan makna lazimnya 'kasih setia'.
- source_word: וְנִכְרְתוּ
  choice: harus dilenyapkan
  rationale: Menggunakan rumusan hukuman yang kuat tanpa menetapkan secara eksplisit mekanismenya; catatan kaki mempertahankan ketidakpastian apakah ini kematian, pengusiran, atau bentuk penyingkiran lain.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: di depan mata orang-orang sebangsa mereka
  rationale: Menyampaikan unsur publik dari ungkapan Ibrani secara alami dalam bahasa Indonesia.
- source_word: גִּלָּה
  choice: telah menyingkapkan
  rationale: Menjaga idiom utama dalam hukum hubungan seksual Imamat dan kaitannya dengan kata 'aurat'.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: ia harus menanggung kesalahannya
  rationale: Mempertahankan bobot hukum-teologis rumusan Ibrani tanpa mengubahnya secara khusus menjadi hukuman tertentu.
theological_decisions:
- issue: Makna חֶסֶד dalam ayat ini
  choice: 'makna negatif: ''perbuatan tercela'''
  alternative: '''kasih setia'' atau ''kebaikan'', yaitu makna positif yang lazim di tempat lain'
  rationale: Konteks larangan dan penghukuman menuntut makna negatif yang langka; makna positif akan bertentangan dengan konteks.
- issue: Bentuk hukuman dalam וְנִכְרְתוּ
  choice: mempertahankan rumusan umum 'harus dilenyapkan' dan menjelaskan ambiguitasnya dalam catatan kaki
  alternative: menetapkannya secara khusus sebagai hukuman mati atau pengucilan
  rationale: Kata kerja Ibrani di sini tidak menjelaskan mekanisme hukuman, sehingga terjemahan tidak menyelesaikan perdebatan yang tidak diselesaikan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “aurat” mempertahankan idiom seksual-hukum yang dikenal pembaca Alkitab Indonesia; tanda pisah memperjelas bahwa frasa berikutnya menerangkan cakupan 'saudara perempuan'.
