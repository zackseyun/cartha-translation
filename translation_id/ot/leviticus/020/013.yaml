  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: id
  text: Jika seorang laki-laki bersetubuh dengan seorang laki-laki seperti bersetubuh dengan perempuan[a], keduanya telah melakukan kekejian. Mereka harus dihukum mati[b]; darah mereka tertimpa atas mereka sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pembaringan-pembaringan seorang perempuan,” suatu ungkapan Ibrani untuk persetubuhan dengan perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka sendiri menanggung utang darah itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Jika seorang laki-laki
  rationale: Dalam rumusan hukum kasuistik ini, rangkaian tersebut secara alami menyatakan syarat. Pilihan ini mempertahankan makna kondisional tanpa menerjemahkan וְ secara kaku.
- source_word: יִשְׁכַּב אֶת
  choice: bersetubuh dengan
  rationale: Dalam konteks ini, שׁכב adalah ungkapan untuk hubungan seksual. 'Bersetubuh dengan' jelas, wajar, dan bermartabat dalam bahasa Indonesia modern.
- source_word: זָכָר
  choice: seorang laki-laki
  rationale: זָכָר secara leksikal berarti 'jantan/laki-laki'. Untuk manusia, 'seorang laki-laki' lebih alami daripada 'seorang jantan', meskipun perbedaan leksikal dari אִישׁ tidak dapat dipertahankan sepenuhnya tanpa ungkapan yang janggal.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: seperti bersetubuh dengan perempuan
  rationale: Frasa harfiahnya, 'pembaringan-pembaringan seorang perempuan', merupakan idiom bagi persetubuhan dengan perempuan. Terjemahan ini menyampaikan maksud idiom sambil mempertahankan bentuk perbandingannya.
- source_word: תּוֹעֵבָה
  choice: kekejian
  rationale: '''Kekejian'' mempertahankan bobot moral-perjanjian dari תּוֹעֵבָה dan selaras dengan register Alkitab Indonesia yang bermartabat.'
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: keduanya telah melakukan
  rationale: Terjemahan ini mempertahankan penegasan bahwa kedua pelaku melakukan tindakan tersebut.
- source_word: מוֹת יוּמָתוּ
  choice: Mereka harus dihukum mati
  rationale: Gabungan infinitif absolut dan bentuk pasif menegaskan kepastian hukuman mati. 'Harus dihukum mati' menyampaikan daya wajib dan bentuk pasif secara alami.
- source_word: דְּמֵיהֶם בָּם
  choice: darah mereka tertanggung atas diri mereka sendiri
  rationale: Ungkapan ini menyatakan bahwa tanggung jawab atas kematian atau utang darah itu berada pada mereka sendiri. Bentuk ini mempertahankan citra 'darah' dan daya hukum-moral idiom tersebut.
theological_decisions:
- issue: Larangan hukum yang diperdebatkan secara moral dan budaya
  choice: Menerjemahkan tindakan yang disebutkan dalam bahasa Ibrani secara langsung, tanpa memakai kategori identitas seksual modern.
  alternative: Memakai istilah luas seperti 'tindakan homoseksual' atau istilah identitas modern.
  rationale: Teks Ibrani merumuskan tindakan tertentu dalam bentuk hukum, bukan kategori identitas. Karena itu, terjemahan tidak memperluas ataupun mempersempitnya melalui kerangka modern.
- issue: Pembedaan אִישׁ dan זָכָר
  choice: Menerjemahkan keduanya dengan 'laki-laki' dalam susunan Indonesia yang alami.
  alternative: Menerjemahkan זָכָר secara harfiah sebagai 'jantan'.
  rationale: Bahasa Ibrani membedakan 'seorang laki-laki' dan 'laki-laki/jantan', tetapi 'seorang jantan' bagi manusia bernada tidak alami dan merendahkan dalam bahasa Indonesia. Makna jenis kelamin dipertahankan tanpa memaksakan kekakuan leksikal.
- issue: Makna דְּמֵיהֶם בָּם
  choice: Mempertahankan metafora darah sebagai pernyataan tanggung jawab pribadi.
  alternative: Menyatakan secara eksplisit 'utang darah mereka ada pada mereka'.
  rationale: Kata דָּמִים dapat menunjuk darah maupun utang darah. Teks utama mempertahankan citra dan ambiguitas idiomatis; catatan kaki menyebut alternatif hukum yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan bermartabat. Ayat mempertahankan bentuk hukum, bobot istilah 'kekejian', kepastian hukuman, dan metafora darah, tanpa memasukkan istilah identitas atau penafsiran denominasi modern.
