source:
  edition: WLC
  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: id
  text: Karena itu, kamu harus membedakan antara hewan yang tahir dan yang najis, serta antara burung yang najis dan yang tahir. Janganlah kamu menjadikan diri kalian[a] menjijikkan[b] karena hewan, burung, atau segala sesuatu yang merayap di tanah, yang telah Kupisahkan bagimu sebagai yang najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa-jiwamu” atau “pribadi-pribadimu”; ungkapan Ibrani ini berarti “diri kalian”.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “keji”. Kata kerja Ibrani ini berasal dari medan makna “jijik” atau “keji”, bukan dari istilah yang lazim berarti “menjadi najis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: Karena itu, kamu harus membedakan
  rationale: Bentuk hiphil dari בדל menyatakan tindakan mengadakan atau menjaga pembedaan. 'Membedakan' alami dalam bahasa Indonesia, sedangkan 'karena itu' mengungkapkan hubungan ayat ini dengan konteks perintah sebelumnya.
- source_word: הַבְּהֵמָה
  choice: hewan
  rationale: Istilah ini menunjuk pada kategori hewan darat secara umum dalam konteks ini. 'Hewan' modern dan tidak sesempit 'ternak'.
- source_word: הַטְּהֹרָה / הַטְּמֵא / הַטְּמֵאָה / הַטָּהֹר
  choice: tahir / najis
  rationale: Pasangan ini mempertahankan kategori kemurnian ritual dalam Imamat tanpa mengubahnya menjadi penilaian kesehatan atau moral.
- source_word: הָעוֹף
  choice: burung
  rationale: Walaupun עוֹף dapat mencakup makhluk terbang secara lebih luas, 'burung' merupakan padanan yang paling alami dalam konteks penggolongan makanan ini.
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: Janganlah kamu menjadikan ... menjijikkan
  rationale: Piel שׁקץ berada dalam medan makna 'jijik/keji', bukan kata lazim untuk 'menjadi najis'. Terjemahan ini mempertahankan perbedaannya dari טמא yang juga muncul dalam ayat.
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: dirimu
  rationale: Secara harfiah bentuknya 'jiwa-jiwamu', tetapi dalam susunan ini נֶפֶשׁ menunjuk pada pribadi-pribadi itu sendiri. 'Dirimu' menyampaikan idiom tersebut tanpa menyiratkan antropologi dualistis.
- source_word: בַּבְּהֵמָה וּבָעוֹף
  choice: karena hewan, burung
  rationale: Preposisi ב menandai sarana atau hal yang menyebabkan mereka menjadikan diri menjijikkan. 'Karena' menyatakan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: atau segala sesuatu yang merayap di tanah
  rationale: רמשׂ menggambarkan gerak merayap atau bergerak dekat permukaan tanah; 'merayap di tanah' jelas dan tidak memasukkan nuansa berkerumun dari akar lain.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: yang telah Kupisahkan bagimu sebagai yang najis
  rationale: '''Kupisahkan'' mempertahankan pengulangan akar בדל, sedangkan ''sebagai yang najis'' mengungkapkan fungsi klasifikatif infinitif לְטַמֵּא.'
theological_decisions:
- issue: Bahasa kategori ritual atau parafrasa moral
  choice: tahir/najis sebagai kategori kemurnian perjanjian
  alternative: murni/cemar atau baik/buruk secara moral
  rationale: Ayat ini mengatur pembedaan ritual dan makanan bagi Israel. 'Tahir/najis' menjaga kategori khas Imamat tanpa menafsirkannya sebagai soal moral atau kesehatan semata.
- issue: Makna נֶפֶשׁ dalam אֶת נַפְשֹׁתֵיכֶם
  choice: pribadi-pribadi itu sendiri ('dirimu')
  alternative: '''jiwa-jiwamu'''
  rationale: Dalam idiom ini נֶפֶשׁ menunjuk pada seluruh pribadi, bukan secara khusus unsur nonjasmani. Catatan kaki mempertahankan bentuk harfiahnya.
- issue: Hubungan שׁקץ dengan טמא
  choice: memakai 'menjijikkan' untuk שׁקץ dan 'najis' untuk טמא
  alternative: menerjemahkan keduanya dengan bahasa kenajisan
  rationale: Pembedaan leksikal mencegah dua medan makna Ibrani yang berdekatan tetapi tidak identik dilebur secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak orang kedua Ibrani diterjemahkan dengan 'kamu' yang dapat bersifat kolektif dalam bahasa Indonesia. Istilah tradisional 'tahir/najis' dipertahankan karena jelas dalam konteks hukum kemurnian, sementara susunan kalimat dibuat alami bagi pembaca umum.
