  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: id
  text: Sebab, siapa pun yang mengutuki ayahnya atau ibunya harus dihukum mati. Ia telah mengutuki ayahnya dan ibunya; darahnya ada padanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darahnya ada padanya”; ini adalah ungkapan hukum yang menyatakan bahwa ia sendiri bertanggung jawab atas kematiannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ketetapan ini dengan konteks hukum sebelumnya dan mempertahankan daya penjelas partikel Ibrani.
- source_word: אִישׁ אִישׁ
  choice: siapa pun
  rationale: Pengulangan kata benda merupakan ungkapan distributif yang berarti siapa saja; bahasa Indonesia alami tidak perlu mempertahankan bentuk maskulin gramatikal yang tidak menandai jenis kelamin secara eksklusif dalam ketetapan umum ini.
- source_word: יְקַלֵּל / קִלֵּל
  choice: mengutuki / telah mengutuki
  rationale: Bentuk piel קלל di sini menunjuk pada tindakan mengucapkan kutuk terhadap seseorang, bukan sekadar tidak menghormati.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: ayahnya atau ibunya / ayahnya dan ibunya
  rationale: Pada rumusan pelanggaran, 'atau' memperjelas bahwa mengutuki salah satu orang tua sudah dikenai hukuman; pada pernyataan alasan, 'dan' mempertahankan bentuk rangkuman Ibrani.
- source_word: מוֹת יוּמָת
  choice: harus dihukum mati
  rationale: Infinitif absolut disertai verba finit menegaskan kepastian hukuman; bentuk pasif mempertahankan sifat yudisial ungkapan tersebut.
- source_word: דָּמָיו בּוֹ
  choice: darahnya tertanggung atas dirinya sendiri
  rationale: Ungkapan hukum ini menyatakan bahwa pelaku sendiri memikul tanggung jawab atas kematiannya, sambil tetap mempertahankan citra 'darah' dari teks sumber.
theological_decisions:
- issue: Cakupan ungkapan distributif אִישׁ אִישׁ
  choice: siapa pun
  alternative: setiap laki-laki
  rationale: Dalam hukum ini bentuk maskulin berfungsi secara representatif. 'Siapa pun' menyampaikan cakupan universal ungkapan itu secara wajar dalam bahasa Indonesia tanpa mempersempitnya hanya kepada laki-laki.
- issue: Rumus tanggung jawab דָּמָיו בּוֹ
  choice: darahnya tertanggung atas dirinya sendiri
  alternative: hutang darahnya ada padanya
  rationale: Terjemahan utama mempertahankan metafora darah dan menjelaskan tanggung jawab yudisial pelaku tanpa memasukkan gagasan teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rumusan hukum dibuat alami bagi pembaca umum; pengulangan dan metafora penting dari bahasa Ibrani dipertahankan sejauh tidak mengaburkan makna.
