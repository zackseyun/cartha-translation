    rationale: '''Darah mereka tertanggung atas diri mereka sendiri'' bukan kolokasi Indonesia yang wajar. Ibrani menyatakan pertanggungjawaban atas darah/kematian mereka dengan idiom padat, bukan frasa refleksif yang diperluas. ''Darah mereka tertanggung atas mereka'' mempertahankan ambiguitas idiomatik dan lebih alami dalam register Alkitab.'
  - severity: medium
    issue: Catatan kaki a salah menggambarkan relasi gramatikal dan dapat memberi kesan bahwa binatang adalah pelaku yang menaiki perempuan.
