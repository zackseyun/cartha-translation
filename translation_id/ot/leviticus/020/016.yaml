base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: id
  text: Jika seorang perempuan mendekati binatang apa pun untuk bersetubuh dengannya[a], engkau harus membunuh perempuan itu dan binatang itu. Keduanya harus dihukum mati; darah mereka tertanggung atas mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk berbaring dengannya.” Kata Ibrani ini secara khusus menunjuk pada persetubuhan dengan binatang, secara harfiah melibatkan tindakan menaiki.
    reason: lexical_alternative
  - marker: b
    text: Atau, “darah mereka ada atas mereka.” Ungkapan ini berarti bahwa tanggung jawab atas kematian mereka berada pada mereka sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: mendekati
  rationale: Mempertahankan arti konkret verba קרב, yaitu datang mendekat, sementara tujuan seksualnya dinyatakan oleh frasa berikutnya.
- source_word: כָּל בְּהֵמָה
  choice: binatang apa pun
  rationale: בְּהֵמָה merupakan istilah umum bagi binatang, dan כָּל memberi cakupan tak tentu yang secara alami dinyatakan dengan 'apa pun' dalam bahasa Indonesia.
- source_word: לְרִבְעָה אֹתָהּ
  choice: untuk bersetubuh dengannya
  rationale: Verba רבע dalam konteks ini secara khusus menunjuk pada hubungan seksual dengan binatang. 'Bersetubuh' jelas, ringkas, dan bermartabat tanpa mengaburkan tindakan yang dimaksud.
- source_word: וְהָרַגְתָּ
  choice: engkau harus membunuh
  rationale: Bentuk ini memiliki daya perintah dalam konteks hukum. 'Harus' menyampaikan kewajiban hukum secara alami dalam bahasa Indonesia modern.
- source_word: מוֹת יוּמָתוּ
  choice: Keduanya harus dihukum mati
  rationale: Infinitif absolut yang diikuti verba finit menegaskan kepastian hukuman mati. 'Harus dihukum mati' mempertahankan daya hukum dan bentuk pasif rumusan tersebut; 'keduanya' memperjelas subjek jamak, yakni perempuan dan binatang.
- source_word: דְּמֵיהֶם בָּם
  choice: darah mereka tertanggung atas diri mereka sendiri
  rationale: Ungkapan ini menghubungkan darah atau kematian mereka dengan tanggung jawab mereka sendiri. Terjemahan ini mempertahankan citra darah sekaligus membuat fungsi idiomnya dapat dipahami.
theological_decisions:
- issue: Penyampaian larangan dan sanksi berat mengenai hubungan seksual dengan binatang
  choice: 'Menerjemahkan tindakan dan sanksinya secara langsung: ''untuk bersetubuh dengannya ... harus dihukum mati.'''
  alternative: Memakai ungkapan yang lebih eufemistis seperti 'berbaring dengannya' atau ungkapan yang lebih harfiah tetapi kurang jelas mengenai tindakan menaiki.
  rationale: Teks ini adalah ketentuan hukum. Terjemahan perlu mempertahankan kejelasan serta bobot sanksinya tanpa menambahkan penilaian atau penjelasan teologis yang tidak dinyatakan dalam ayat.
- issue: Makna idiom דְּמֵיהֶם בָּם
  choice: Mempertahankan metafora darah sambil menyatakan bahwa darah itu tertanggung atas diri mereka sendiri.
  alternative: Menerjemahkannya secara penuh sebagai 'mereka sendiri bertanggung jawab atas kematian mereka.'
  rationale: Pilihan utama menjaga ketegangan antara ungkapan konkret 'darah mereka' dan implikasi hukum-moral tentang tanggung jawab, tanpa mengganti idiom sepenuhnya dengan tafsiran.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. 'Engkau' mempertahankan sapaan tunggal dalam teks Ibrani; 'keduanya' menghindari ambiguitas rujukan bentuk jamak. Istilah eksplisit dipakai secukupnya agar larangan tidak menjadi samar.
