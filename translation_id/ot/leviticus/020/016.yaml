review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pokok umumnya mengikuti teks Ibrani dengan baik: perempuan itu mendekati seekor binatang untuk melakukan hubungan seksual, dan perempuan serta binatang itu dijatuhi hukuman mati. Namun, idiom penutup perlu diperbaiki. דְּמֵיהֶם בָּם secara harfiah mempertahankan citra ''darah mereka ada atas mereka''; frasa Indonesia ''darah mereka tertanggung atas diri mereka sendiri'' tidak alami dan kurang tepat secara idiomatis.'
  naturalness: Bahasa hukum pada bagian utama jelas dan modern. 'Bersetubuh dengannya' tepat dan cukup eksplisit. 'Binatang tersebut' sedikit lebih formal daripada yang diperlukan, tetapi masih wajar. Kalimat terakhir tidak lazim dalam bahasa Indonesia dan perlu diganti.
  terminology: Istilah 'binatang', 'bersetubuh', 'membunuh', dan 'dihukum mati' sesuai register hukum dan makna sumber. 'Engkau harus membunuh' secara gramatikal benar, tetapi 'haruslah membunuh' atau 'harus membunuh' sama-sama dapat dipakai. Untuk idiom darah, 'darah mereka tertanggung atas mereka' mempertahankan metafora dan merupakan rumusan yang lebih mapan daripada tambahan refleksif 'atas diri mereka sendiri'.
  issues:
