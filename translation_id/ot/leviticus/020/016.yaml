revisions:
- from: Jika seorang perempuan mendekati binatang apa pun untuk bersetubuh dengannya[a], engkau harus membunuh perempuan itu dan binatang tersebut. Keduanya harus dihukum mati[b]; darah mereka tertanggung atas diri mereka sendiri.
  to: Jika seorang perempuan mendekati binatang apa pun untuk bersetubuh dengannya[a], engkau harus membunuh perempuan itu dan binatang itu. Keduanya harus dihukum mati; darah mereka tertanggung atas mereka[b].
  rationale: Revisi mempertahankan susunan hukum, kejelasan seksual, dan penegasan hukuman mati dari teks Ibrani. Idiom terakhir diperbaiki menjadi rumusan Indonesia yang lebih wajar sambil tetap mempertahankan metafora darah dan tanpa menghilangkan makna tanggung jawab. Catatan kaki a diubah agar tidak menyatakan secara keliru bahwa binatang itu menjadi pelaku tindakan menaiki; catatan kaki b kini menjelaskan idiom yang dipertahankan dalam teks utama.
