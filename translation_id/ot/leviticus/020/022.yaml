  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: id
  text: Karena itu, kamu harus menaati segala ketetapan-Ku dan segala peraturan-Ku serta melakukannya,[a] supaya negeri yang sedang Kubawa kamu ke sana untuk tinggal di dalamnya tidak memuntahkan kamu keluar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala ketetapan-Ku dan segala keputusan hukum-Ku serta melaksanakannya.” Bahasa Ibrani memakai dua istilah hukum yang berbeda.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memuntahkan kamu.” Ini adalah gambaran hidup tentang negeri yang mengusir penduduk yang menajiskannya.
    reason: lexical_metaphor
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Karena itu, kamu harus menaati
  rationale: Konjungsi menghubungkan perintah ini dengan peringatan sebelumnya; שׁמר dalam konteks hukum perjanjian berarti menaati atau memelihara. Bentuk orang kedua jamak ditujukan kepada umat secara kolektif.
- source_word: חֻקֹּתַי
  choice: segala ketetapan-Ku
  rationale: חֻקָּה menunjuk pada ketentuan yang ditetapkan; 'ketetapan' mempertahankan corak hukum dan membedakannya dari מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: segala peraturan-Ku
  rationale: מִשְׁפָּט dapat menunjuk pada keputusan atau aturan hukum. 'Peraturan' alami dalam bahasa Indonesia modern dan tetap berbeda dari 'ketetapan'.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: serta melakukannya
  rationale: עשה dengan objek berupa hukum berarti melakukan atau melaksanakan; ungkapan ini mempertahankan tuntutan tindakan nyata.
- source_word: וְלֹא תָקִיא אֶתְכֶם הָאָרֶץ
  choice: supaya negeri ... tidak memuntahkan kamu keluar
  rationale: קיא secara harfiah berarti 'muntah'. Metafora hidup tentang negeri yang mengusir penduduknya dipertahankan, sedangkan 'supaya ... tidak' menyampaikan hubungan maksud atau akibat dalam konteks.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: yang Kutuju bersama kamu
  rationale: Frasa ini menyatakan tindakan Allah membawa umat menuju negeri itu. Rumusan Indonesia ini dibuat alami tanpa mengulang penunjuk tempat secara kaku.
- source_word: לָשֶׁבֶת בָּהּ
  choice: untuk kamu diami
  rationale: ישׁב di sini berarti tinggal atau berdiam. 'Diami' ringkas, bermartabat, dan sesuai dengan tujuan dibawanya umat ke negeri tersebut.
theological_decisions:
- issue: Personifikasi negeri dalam peringatan perjanjian
  choice: Mempertahankan gambaran negeri yang 'memuntahkan' penduduknya.
  alternative: Menghaluskan menjadi 'mengusir' atau 'menolak'.
  rationale: Teks Ibrani sengaja memakai metafora jasmani yang tajam untuk menggambarkan kenajisan dan pengusiran; penghalusan akan mengurangi daya peringatannya.
- issue: Pembedaan חֻקּוֹת dan מִשְׁפָּטִים
  choice: 'Menerjemahkannya dengan dua istilah berbeda: ''ketetapan'' dan ''peraturan''.'
  alternative: Menyatukan keduanya sebagai 'hukum-hukum'.
  rationale: Dua nomina hukum yang berbeda dalam sumber patut tetap dapat dibedakan tanpa menetapkan perbedaan teknis yang tidak dijelaskan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-perjanjian yang bermartabat. Kata ganti 'kamu' mewakili bentuk orang kedua jamak dalam bahasa Ibrani. Metafora sumber dipertahankan, dan kedua istilah hukum diterjemahkan secara berbeda.
