  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: id
  text: Janganlah engkau menyingkapkan aurat saudara perempuan ibumu atau saudara perempuan ayahmu, sebab ia telah menelanjangi kerabat sedarahnya sendiri;[a] mereka harus menanggung kesalahan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dagingnya sendiri”; maksudnya, kerabat sedarahnya sendiri.
    reason: lexical_alternative
  - marker: b
    text: “Menanggung kesalahan mereka” juga dapat berarti menanggung kesalahan atau dosa mereka beserta akibat hukumannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: janganlah engkau menyingkapkan aurat
  rationale: Mempertahankan ungkapan hukum Ibrani harfiah 'menyingkapkan aurat', yang dalam konteks ini merujuk pada hubungan seksual terlarang, sekaligus menjaga keterkaitan dengan larangan-larangan di sekitarnya.
- source_word: אֲחוֹת אִמְּךָ
  choice: saudara perempuan ibumu
  rationale: Menyatakan hubungan kekerabatan secara langsung dan dekat dengan susunan Ibrani; lebih tepat daripada 'bibi', yang dapat mencakup kerabat karena perkawinan.
- source_word: וַאֲחוֹת אָבִיךָ
  choice: atau saudara perempuan ayahmu
  rationale: Kata sambung waw dalam rangkaian larangan ini secara alami berfungsi sebagai alternatif, sehingga 'atau' jelas dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi larangan tersebut tanpa menambahkan penafsiran.
- source_word: שְׁאֵרוֹ
  choice: kerabat sedarahnya sendiri
  rationale: שְׁאֵר adalah istilah kekerabatan yang secara konkret berkaitan dengan 'daging'. Dalam bahasa Indonesia, 'kerabat sedarahnya sendiri' menyampaikan makna kekerabatan dekat secara alami; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: הֶעֱרָה
  choice: telah menelanjangi
  rationale: Menyampaikan tindakan 'membuat telanjang/menyingkapkan' dan membedakannya secara wajar dari kata kerja pada klausa larangan.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: mereka harus menanggung kesalahan mereka
  rationale: Mempertahankan ungkapan Ibrani tentang menanggung עָוֹן, yang dapat mencakup kesalahan, status bersalah, dan akibat hukumannya, tanpa menentukan salah satu secara sempit.
theological_decisions:
- issue: Peralihan dari pelaku tunggal pada klausa alasan kepada pelaku jamak pada klausa akibat
  choice: Mempertahankan bentuk tunggal 'ia ... kerabat sedarahnya sendiri' lalu bentuk jamak 'mereka ... kesalahan mereka'.
  alternative: Menyeragamkan semuanya menjadi bentuk jamak atau mengubah klausa tunggal menjadi ungkapan impersonal.
  rationale: Teks Ibrani memakai sufiks dan verba tunggal dalam klausa alasan, lalu verba dan sufiks jamak dalam klausa penanggungannya. Mempertahankan peralihan ini menjaga ketegangan gramatikal sumber dan memungkinkan klausa terakhir menunjuk kepada kedua pihak.
- issue: Apakah ungkapan seksual harus dijelaskan secara langsung dalam teks utama
  choice: Mempertahankan ungkapan 'menyingkapkan aurat'.
  alternative: Menerjemahkan secara eksplisit sebagai 'melakukan hubungan seksual dengan'.
  rationale: Ungkapan sumber merupakan formula hukum penting dalam Imamat. Bentuk idiomatis Indonesia ini tetap dapat dipahami dan tidak menghilangkan tekstur serta keterkaitan antarayat.
- issue: Cakupan makna עָוֹן dalam rumusan hukuman
  choice: Menggunakan 'kesalahan' dan menjelaskan kemungkinan 'kesalahan/dosa beserta akibat hukumannya' dalam catatan.
  alternative: Memilih hanya 'hukuman' atau hanya 'dosa'.
  rationale: Istilah Ibrani dapat merangkum perbuatan salah, keadaan bersalah, dan konsekuensinya. Terjemahan utama sebaiknya tidak mempersempit ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'janganlah engkau' mempertahankan nada hukum langsung; istilah kekerabatan dijabarkan agar tepat dan tidak memasukkan kerabat karena perkawinan. Semua penanda catatan kaki ditempatkan pada teks utama.
