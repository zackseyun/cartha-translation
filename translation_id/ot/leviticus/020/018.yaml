  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: id
  text: Jika seorang laki-laki bersetubuh dengan seorang perempuan ketika perempuan itu dalam keadaan najis karena haid[a] dan menyingkapkan ketelanjangannya—laki-laki itu telah menyingkapkan sumber darah perempuan itu[b], dan perempuan itu telah membuka sumber darahnya—keduanya harus dilenyapkan dari tengah-tengah bangsa mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika perempuan itu sedang haid.” Istilah Ibrani juga mencakup kenajisan ritual yang berkaitan dengan haid dalam Kitab Imamat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia telah menyingkapkan sumbernya, dan perempuan itu telah membuka sumber darahnya.” “Sumber” merupakan ungkapan halus untuk bagian tubuh tempat darah haid keluar.
    reason: lexical_alternative
  - marker: c
    text: “Harus dilenyapkan” adalah rumusan hukum yang lazim dalam Taurat. Ayat ini tidak menjelaskan bagaimana pelenyapan itu dilaksanakan.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan rujukan khusus kepada peserta laki-laki dalam rumusan hukum berbentuk maskulin tunggal.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: bersetubuh dengan seorang perempuan
  rationale: Menyampaikan idiom Ibrani untuk hubungan seksual dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: דָּוָה
  choice: dalam keadaan najis karena haid
  rationale: Mencakup menstruasi sekaligus status kenajisan ritual yang relevan dalam konteks hukum Imamat.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: menyingkapkan auratnya
  rationale: Mempertahankan idiom khas hukum seksual dalam Imamat dan tetap dapat dipahami pembaca Indonesia.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: telah menyingkapkan sumber darah perempuan itu
  rationale: מָקוֹר secara harfiah berarti sumber atau mata air; konteks menunjukkan sumber keluarnya darah haid. Terjemahan ini mempertahankan citra dan eufemisme Ibraninya.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: dan perempuan itu telah membuka sumber darahnya
  rationale: Menjaga kesejajaran klausa Ibrani sambil menghindari pengulangan kata yang kaku dalam bahasa Indonesia.
- source_word: וְנִכְרְתוּ
  choice: harus disingkirkan
  rationale: Mengungkapkan formula hukuman bahwa keduanya diputuskan atau dikeluarkan dari umat tanpa menentukan mekanismenya.
- source_word: מִקֶּרֶב עַמָּם
  choice: dari tengah-tengah bangsa mereka
  rationale: Mempertahankan latar komunal-perjanjian dan bentuk jamak kolektif dari teks Ibrani.
theological_decisions:
- issue: Sifat keadaan perempuan dalam דָּוָה
  choice: dalam keadaan najis karena haid
  alternative: sedang haid; dalam kesakitannya/kenajisannya
  rationale: Dalam Imamat, istilah ini menunjuk menstruasi beserta status kenajisan ritualnya, bukan penyakit umum.
- issue: Makna hukuman וְנִכְרְתוּ
  choice: harus disingkirkan
  alternative: harus dilenyapkan; harus dikucilkan; harus dihukum mati
  rationale: Teks ayat ini tidak menjelaskan apakah penyingkiran itu berupa kematian, tindakan ilahi, atau pengucilan. Terjemahan tidak menentukan mekanisme yang dibiarkan terbuka oleh bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bersetubuh” dipilih agar jelas tanpa bernada kasar; “menyingkapkan aurat” mempertahankan idiom hukum Imamat. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
