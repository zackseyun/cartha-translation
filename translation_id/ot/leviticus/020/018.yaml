    rationale: Dalam bahasa Indonesia modern, “aurat” terutama merujuk pada bagian tubuh yang wajib ditutup menurut norma keagamaan, bukan ‘ketelanjangan’ sebagai idiom hukum Imamat. “Ketelanjangannya” lebih setia pada istilah sumber dan lebih netral.
