revisions:
- from: Jika seorang laki-laki bersetubuh dengan seorang perempuan ketika perempuan itu dalam keadaan najis karena haid[a] dan menyingkapkan auratnya—laki-laki itu telah menyingkapkan sumber darah perempuan itu[b], dan perempuan itu telah membuka sumber darahnya—keduanya harus disingkirkan dari tengah-tengah bangsa mereka.[c]
  to: Jika seorang laki-laki bersetubuh dengan seorang perempuan ketika perempuan itu dalam keadaan najis karena haid[a] dan menyingkapkan ketelanjangannya—laki-laki itu telah menyingkapkan sumber darah perempuan itu[b], dan perempuan itu telah membuka sumber darahnya—keduanya harus dilenyapkan dari tengah-tengah bangsa mereka.[c]
