  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: id
  text: Namun, jika rakyat negeri itu sengaja menutup mata[a] terhadap orang itu ketika ia menyerahkan salah seorang anaknya[b] kepada Molokh[c], supaya mereka tidak menghukum mati orang itu,[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyembunyikan mata mereka dari orang itu”; maksudnya, sengaja mengabaikannya atau tidak bertindak terhadapnya.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “anaknya” secara harfiah berarti “benih”; di sini kata itu merujuk kepada anak-anaknya. Preposisi Ibrani menyatakan bahwa yang diserahkan adalah sebagian dari mereka.
    reason: lexical_alternative
  - marker: c
    text: Molokh mungkin merupakan nama atau sebutan suatu dewa, atau sebutan yang berkaitan dengan ritus pengorbanan anak. Menurut pembacaan lain, frasa Ibraninya dapat berarti “kepada raja itu.”
    reason: alternative_reading
  - marker: d
    text: 'Konstruksi Ibrani terutama menyatakan tujuan: “supaya mereka tidak menghukum mati orang itu”; dalam konteksnya, tindakan itu juga mengakibatkan hukuman mati tidak dilaksanakan.'
    reason: ambiguity
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: sengaja menutup mata
  rationale: Infinitif absolut yang diikuti verba finit menegaskan tindakan. Bersama ungkapan “mata mereka,” bentuk ini merupakan idiom untuk dengan sengaja mengabaikan atau tidak bertindak.
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri itu
  rationale: Dalam konteks hukum ini, frasa tersebut menunjuk kepada penduduk atau komunitas negeri, bukan secara khusus kelas sosial tertentu.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: menutup mata terhadap orang itu
  rationale: Terjemahan ini mempertahankan gambaran idiom Ibrani sekaligus memakai bentuk yang alami dalam bahasa Indonesia untuk tindakan sengaja mengabaikan kesalahan seseorang.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: ketika ia menyerahkan salah seorang dari keturunannya
  rationale: 'Preposisi min bersifat partitif: orang itu menyerahkan sebagian dari keturunannya, yakni salah seorang anaknya, bukan seluruh keturunannya.'
- source_word: לַמֹּלֶךְ
  choice: kepada Molokh
  rationale: Transliterasi mempertahankan nama atau sebutan penerima kultis sebagaimana ditunjukkan konteks Imamat 18:21 dan 20:2–5 tanpa memasukkan tafsiran tambahan ke dalam teks utama.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: sehingga mereka tidak menghukum mati dia
  rationale: Bentuk ini menyampaikan kaitan tujuan atau akibat antara pengabaian masyarakat dan tidak dilaksanakannya hukuman mati, serta mempertahankan latar yudisial.
theological_decisions:
- issue: Identitas לַמֹּלֶךְ
  choice: Molokh
  alternative: raja itu; atau sebutan bagi suatu ritus pengorbanan
  rationale: Konteks larangan kultis dalam Imamat sangat mendukung Molokh sebagai nama atau sebutan penerima persembahan. Namun, bentuk Ibraninya tetap memungkinkan perdebatan mengenai apakah yang dimaksud adalah dewa, sebutan ritus, atau—menurut pembacaan lain—“raja itu”; karena itu kemungkinan tersebut dicatat tanpa menentukan doktrin tertentu.
- issue: Nuansa לְבִלְתִּי sebagai tujuan atau akibat
  choice: sehingga mereka tidak menghukum mati dia
  alternative: supaya mereka tidak menghukum mati dia
  rationale: Konstruksi ini dapat dipahami sebagai akibat praktis maupun maksud tindakan mereka. “Sehingga” cukup alami dan tidak memaksakan motif batin, sementara kemungkinan makna tujuan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menutup mata terhadap” mempertahankan citra Ibrani dalam idiom Indonesia yang alami; “menghukum mati” sesuai dengan konteks hukum. Tanda koma akhir dipertahankan karena ayat ini merupakan klausa bersyarat yang berlanjut ke ayat berikutnya.
