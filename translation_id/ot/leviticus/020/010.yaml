base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: id
  text: Apabila seorang laki-laki berzina dengan istri orang lain—apabila ia berzina dengan istri sesamanya—pezina laki-laki dan pezina perempuan itu pasti dihukum mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan istri seorang laki-laki ... dengan istri sesamanya.” Pengulangan itu menegaskan sekaligus memperjelas pelanggaran tersebut dalam gaya bahasa hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Apabila seorang laki-laki
  rationale: Gabungan penghubung, nomina, dan partikel relatif ini memperkenalkan suatu kasus hukum. “Apabila” menyampaikan fungsi kondisionalnya secara alami, sementara “seorang laki-laki” mempertahankan bentuk maskulin tunggal sumber.
- source_word: יִנְאַף
  choice: berzina
  rationale: Kata kerja נאף secara khusus menunjuk pada perzinaan, bukan pada percabulan atau pelanggaran seksual secara umum.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: dengan istri orang lain
  rationale: Secara harfiah frasa ini berarti “dengan istri seorang laki-laki.” Ungkapan “istri orang lain” secara idiomatis memperjelas bahwa perempuan itu adalah istri laki-laki selain pelaku.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: istri sesamanya
  rationale: רֵעַ dalam konteks hukum menunjuk pada sesama atau anggota lain dalam komunitas, bukan hanya orang yang tinggal berdekatan. “Sesamanya” mempertahankan cakupan luas tersebut.
- source_word: מוֹת יוּמַת
  choice: pasti dihukum mati
  rationale: Infinitif absolut yang diikuti bentuk verba seakar memberi penegasan kuat pada hukuman mati. “Pasti dihukum mati” mempertahankan daya tegas itu tanpa menentukan cara pelaksanaannya.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: pezina laki-laki dan pezina perempuan
  rationale: Dua partisip substantival ini masing-masing berjenis maskulin dan feminin. Terjemahan simetris mempertahankan penyebutan eksplisit kedua pelaku.
theological_decisions:
- issue: Bahasa hukum yang berjenis kelamin
  choice: Mempertahankan “seorang laki-laki” serta penyebutan eksplisit “pezina laki-laki dan pezina perempuan.”
  alternative: Memakai rumusan netral seperti “siapa pun yang berzina ... kedua pihak.”
  rationale: Teks Ibrani menyatakan jenis kelamin secara eksplisit baik dalam uraian kasus maupun dalam penetapan pihak-pihak yang dihukum; terjemahan tidak menetralkannya.
- issue: Rumus hukuman mati
  choice: Menerjemahkan secara tegas sebagai “pasti dihukum mati” tanpa menyebut cara pelaksanaannya.
  alternative: “harus dieksekusi” atau penyebutan suatu metode hukuman mati tertentu.
  rationale: Ayat ini menegaskan hukuman mati, tetapi tidak menyatakan metode pelaksanaannya. Terjemahan mempertahankan batas informasi teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum. Pengulangan sumber dipertahankan untuk mencerminkan penegasan dan ketepatan legal, sedangkan “sesamanya” dipilih agar רֵעַ tidak dipersempit menjadi tetangga yang tinggal berdekatan.
