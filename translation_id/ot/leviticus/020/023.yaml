  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: id
  text: Janganlah kamu hidup menurut ketetapan bangsa yang Kuhalau dari hadapanmu,[a] sebab mereka melakukan segala hal ini, dan Aku muak kepada mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebiasaan bangsa yang Kusingkirkan dari hadapanmu.” Kata Ibrani yang diterjemahkan “ketetapan” juga dapat menunjuk pada kebiasaan atau tata cara yang sudah baku. Secara harfiah, frasa “dari hadapanmu” berarti “dari depanmu/dari hadiratmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku jijik kepada mereka” atau “Aku membenci mereka dengan rasa muak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: hidup menurut
  rationale: Secara harfiah berarti 'berjalan', tetapi dalam konteks etis-perjanjian merupakan idiom untuk cara hidup atau perilaku. 'Hidup menurut' menyampaikan idiom itu secara alami dalam bahasa Indonesia.
- source_word: בְּחֻקֹּת
  choice: menurut ketetapan
  rationale: חֻקּוֹת dapat berarti ketetapan atau kebiasaan yang sudah baku. 'Ketetapan' mempertahankan bobot normatifnya, sedangkan catatan kaki mencantumkan alternatif yang sesuai konteks.
- source_word: הַגּוֹי
  choice: bangsa
  rationale: Bentuknya tunggal dan menunjuk secara kolektif kepada bangsa yang akan disingkirkan; 'bangsa' alami dan tidak memasukkan konotasi lain.
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: Kuhalau dari hadapanmu
  rationale: Secara leksikal שׁלח berarti mengirim atau menyuruh pergi, tetapi bersama 'dari hadapanmu' dalam konteks ini menyatakan pengusiran. 'Halau' mempertahankan tindakan aktif tersebut.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: sebab mereka melakukan segala hal ini
  rationale: כִּי bersifat kausal, dan klausa ini merujuk kembali kepada berbagai perbuatan terlarang dalam konteks sebelumnya.
- source_word: וָאָקֻץ בָּם
  choice: dan Aku muak terhadap mereka
  rationale: קוץ mengungkapkan rasa jijik atau penolakan yang kuat. 'Muak terhadap' kuat, modern, dan tetap mempertahankan bahwa pronomina 'mereka' adalah objek gramatikalnya.
theological_decisions:
- issue: 'Objek rasa muak ilahi: orang-orang atau perbuatan mereka'
  choice: Aku muak terhadap mereka
  alternative: Aku muak karena semua itu
  rationale: Pronomina jamak בָּם secara gramatikal paling langsung merujuk kepada bangsa/orang-orang tersebut. Terjemahan tidak mengalihkan objeknya hanya kepada perbuatan, meskipun perbuatan mereka dinyatakan sebagai sebab dalam klausa sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal 'kamu/-mu' mengikuti sapaan Ibrani orang kedua tunggal yang mengacu secara kolektif kepada Israel. Idiom Ibrani 'berjalan dalam' diterjemahkan secara alami sebagai 'hidup menurut'.
