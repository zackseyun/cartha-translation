  naturalness: '"Darah mereka tertanggung atas diri mereka sendiri" tidak idiomatis dalam bahasa Indonesia baku. "Darah mereka menjadi tanggungan mereka sendiri" lebih alami dan tetap mempertahankan metafora darah serta daya yuridisnya.'
  terminology: '"Perantara arwah" merupakan pilihan yang wajar untuk אוֹב dalam konteks ini, dengan catatan kaki yang menjaga kemungkinan bahwa istilah itu menunjuk roh yang terkait dengan medium. Untuk יִדְּעֹנִי, "orang yang meminta petunjuk kepada roh" lebih netral dan tidak mengklaim bahwa praktiknya niscaya berupa pemanggilan.'
