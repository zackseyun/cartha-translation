  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: id
  text: Laki-laki atau perempuan yang menjadi perantara arwah atau orang yang meminta petunjuk kepada roh[a] harus dihukum mati. Mereka harus dirajam dengan batu. Darah mereka menjadi tanggungan mereka sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kedua istilah Ibrani ini berkaitan dengan pencarian hubungan atau pengetahuan melalui arwah atau roh. Istilah pertama juga dapat dipahami sebagai arwah yang dikaitkan dengan seorang perantara, bukan hanya sebagai perantaranya sendiri.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Darah mereka ada pada mereka.” Ini merupakan rumusan hukum yang menyatakan bahwa mereka sendiri menanggung tanggung jawab atas kematian mereka.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אוֹ אִשָּׁה
  choice: Laki-laki atau perempuan
  rationale: Mempertahankan penyebutan kedua jenis kelamin secara eksplisit. Kata penghubung awal tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia karena ayat ini berfungsi sebagai ketentuan penutup.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: yang menjadi
  rationale: Ungkapan Ibrani secara harfiah berarti ‘apabila ada pada/dalam mereka’. Dalam konteks hukum ini, bahasa Indonesia lebih alami menyatakan bahwa orang tersebut menjalankan atau memiliki peran yang disebut berikutnya, tanpa menghilangkan ambiguitas leksikal istilah-istilah itu; ambiguitas tersebut dicatat dalam catatan kaki.
- source_word: אוֹב
  choice: perantara arwah
  rationale: Istilah ini berkaitan dengan praktik berhubungan dengan orang mati dan dapat menunjuk kepada arwah yang dikaitkan dengan praktik itu atau kepada orang yang menjadi perantaranya. ‘Perantara arwah’ menyampaikan pengertian kontekstual dengan bahasa modern tanpa asosiasi dunia fantasi.
- source_word: יִדְּעֹנִי
  choice: pemanggil roh
  rationale: Istilah ini berpasangan dengan אוֹב dan menunjuk kepada sosok atau praktik yang mencari pengetahuan melalui roh. Pilihan ini ringkas dan mudah dipahami, tetapi tidak memaksakan taksonomi okultisme yang lebih terperinci daripada teks.
- source_word: מוֹת יוּמָתוּ
  choice: harus dihukum mati
  rationale: Infinitif absolut dengan verba finit menegaskan kepastian hukuman mati. Kata ‘harus’ menyampaikan daya wajib dan tegas dari rumusan hukum tersebut secara alami.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: Mereka harus dirajam dengan batu
  rationale: Mempertahankan tindakan perajaman serta penyebutan alatnya, batu, sebagaimana dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: דְּמֵיהֶם בָּם
  choice: Darah mereka tertanggung atas diri mereka sendiri
  rationale: Mempertahankan metafora darah dan fungsi rumusan hukum yang menyatakan bahwa mereka sendiri menanggung tanggung jawab atas kematian mereka.
theological_decisions:
- issue: Makna istilah-istilah yang berkaitan dengan praktik pemanggilan arwah
  choice: Menerjemahkan אוֹב dan יִדְּעֹנִי sebagai ‘perantara arwah’ dan ‘pemanggil roh’, sambil mencatat ambiguitas istilah pertama.
  alternative: ‘roh perantara’ dan ‘roh peramal’, atau transliterasi istilah Ibrani
  rationale: Konteks menetapkan hukuman atas orang yang terlibat dalam praktik tersebut, tetapi bentuk ungkapan Ibrani dan cakupan אוֹב dapat menunjuk kepada roh ataupun praktisinya. Terjemahan utama dibuat komunikatif, sedangkan catatan kaki menjaga ambiguitas asli tanpa menetapkan teori tertentu mengenai hakikat roh-roh itu.
- issue: Rumusan ‘darah mereka tertanggung atas diri mereka sendiri’
  choice: Mempertahankan gambaran darah dan menjelaskan fungsi hukumnya dalam catatan kaki.
  alternative: ‘Mereka sendiri bertanggung jawab atas kematian mereka’
  rationale: Pilihan utama menjaga bahasa konkret dan ketegangan yuridis teks, tanpa mengubahnya menjadi penjelasan abstrak dalam tubuh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘laki-laki atau perempuan’ mempertahankan pasangan gender dalam sumber. Pergantian ke bentuk jamak ‘mereka’ mengikuti bentuk-bentuk jamak yang mencolok dalam teks Ibrani, sekaligus berlaku secara umum bagi setiap laki-laki atau perempuan yang dimaksud.
