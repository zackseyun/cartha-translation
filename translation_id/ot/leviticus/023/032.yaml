  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הוּא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם בְּ/תִשְׁעָ֤ה לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב מֵ/עֶ֣רֶב עַד עֶ֔רֶב תִּשְׁבְּת֖וּ שַׁבַּתְּ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: id
  text: Hari itu adalah Sabat, hari perhentian penuh bagi kamu. Kamu harus merendahkan diri[a]. Pada hari kesembilan bulan itu, pada petang hari, dari petang hingga petang[b], kamu harus menjalankan Sabatmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyangkal diri” atau “menyusahkan diri.” Idiom Ibrani ini mengacu pada tindakan merendahkan diri dalam ibadah pertobatan dan secara tradisional dikaitkan dengan puasa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari petang hingga petang”; ungkapan ini menandai masa pelaksanaan menurut perhitungan hari orang Israel.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabat, hari perhentian penuh
  rationale: Pasangan nomina ini menguatkan gagasan berhenti dari pekerjaan atau beristirahat. Rumusan ini mempertahankan daya intensifnya dalam bahasa Indonesia yang alami.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: kamu harus merendahkan diri
  rationale: Dalam konteks ibadah pertobatan, idiom ini menunjuk pada tindakan merendahkan atau menyangkal diri, yang secara tradisional mencakup puasa. Pilihan ini terdengar alami tanpa mempersempit perintah hanya menjadi puasa.
- source_word: נַפְשֹׁתֵיכֶם
  choice: diri
  rationale: Dalam idiom ini, נֶפֶשׁ berfungsi secara refleksif dan tidak secara khusus mengacu pada jiwa sebagai unsur tak berjasmani.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: Pada hari kesembilan bulan itu, pada petang hari
  rationale: Urutan sumber dipertahankan dan awal pelaksanaan pada petang hari kesembilan dinyatakan dengan jelas.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: dari petang hingga petang
  rationale: Terjemahan ini mempertahankan ungkapan harfiah sumber dan tidak menggantinya dengan penafsiran 'dari matahari terbenam hingga matahari terbenam'.
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: kamu harus menjalankan Sabatmu
  rationale: Ungkapan ini menyampaikan makna menaati atau melaksanakan perhentian Sabat secara alami, tanpa kekakuan terjemahan harfiah seperti 'mengistirahatkan perhentianmu'.
theological_decisions:
- issue: Makna merendahkan diri dalam konteks ibadah
  choice: merendahkan diri
  alternative: menyiksa diri; berpuasa; menyangkal diri
  rationale: Teks Ibrani tidak secara eksplisit menggunakan kata 'berpuasa'. Terjemahan utama mempertahankan cakupan idiom dan catatan kaki menjelaskan kemungkinan maknanya tanpa menjadikan salah satu praktik sebagai satu-satunya arti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Sabat' dipertahankan sebagai istilah keagamaan yang dikenal; 'hari perhentian penuh' menjelaskan kekuatan bentuk intensif Ibrani. Pronomina jamak sumber diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat bersifat tunggal maupun jamak menurut konteks.
