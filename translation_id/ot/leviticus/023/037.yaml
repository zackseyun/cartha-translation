review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk אִשֶּׁה, yang dalam konteks korban menunjuk pada persembahan yang dipersembahkan dengan api/di atas api mezbah. "Persembahan berupa makanan" dapat mengesankan persembahan pangan secara umum dan tidak menyampaikan unsur ritual tersebut. Penutup דְּבַר־יוֹם בְּיוֹמוֹ menyatakan ketentuan atau kewajiban setiap hari yang dilakukan pada harinya, bukan terutama "hari yang telah ditentukan."
  naturalness: Teksnya umumnya baku dan mudah dipahami. "Persembahan-persembahan curahan" kurang luwes dalam bahasa Indonesia; "persembahan curahan" lazim sebagai istilah kolektif. Frasa penutup direvisi agar idiomatis sekaligus lebih dekat dengan sumber.
  terminology: '"TUHAN," "pertemuan-pertemuan kudus," "kurban bakaran," "persembahan sajian," dan "kurban sembelihan" dapat dipertahankan. "Waktu-waktu yang ditetapkan" menyampaikan מוֹעֲדֵי tanpa menambahkan secara eksplisit unsur "perayaan," yang tidak diperlukan dalam ayat ini.'
  issues:
  - severity: medium
    issue: אִשֶּׁה diterjemahkan "persembahan berupa makanan."
    rationale: Dalam daftar korban ini, istilah teknis tersebut berkaitan dengan persembahan melalui api di mezbah. Terjemahan lama berpotensi mengaburkan ciri itu; daftar sesudahnya juga mencakup kurban hewan, sehingga "berupa makanan" dapat menyesatkan.
  - severity: medium
    issue: דְּבַר־יוֹם בְּיוֹמוֹ diterjemahkan "masing-masing pada hari yang telah ditentukan."
    rationale: Ungkapan ini mencakup ketentuan atau kewajiban bagi setiap hari, yang harus dilakukan pada harinya. Terjemahan lama menghilangkan unsur ketentuan/kewajiban dan memasukkan gagasan "telah ditentukan" yang tidak eksplisit dalam frasa ini.
  - severity: low
    issue: '"Waktu-waktu perayaan" menambahkan nuansa perayaan.'
    rationale: מוֹעֵד terutama berarti waktu yang ditetapkan. Dalam konteks pasal ini nuansa perayaan dapat dipahami, tetapi "waktu-waktu yang ditetapkan" lebih langsung dan mencakup semua pertemuan kudus yang dimaksud.
  revised_text: 'Inilah waktu-waktu yang ditetapkan TUHAN, yang harus kamu umumkan sebagai pertemuan-pertemuan kudus, untuk mempersembahkan kepada TUHAN persembahan yang dibakar: kurban bakaran dan persembahan sajian, kurban sembelihan dan persembahan curahan, sesuai dengan ketentuan setiap hari, pada harinya.'
