revisions:
- from: 'Inilah waktu-waktu perayaan yang ditetapkan TUHAN, yang harus kamu umumkan sebagai pertemuan-pertemuan kudus untuk mempersembahkan persembahan berupa makanan kepada TUHAN: kurban bakaran dan persembahan sajian, kurban sembelihan dan persembahan-persembahan curahan, masing-masing pada hari yang telah ditentukan.'
  to: 'Inilah waktu-waktu yang ditetapkan TUHAN, yang harus kamu umumkan sebagai pertemuan-pertemuan kudus, untuk mempersembahkan kepada TUHAN persembahan yang dibakar: kurban bakaran dan persembahan sajian, kurban sembelihan dan persembahan curahan, sesuai dengan ketentuan setiap hari, pada harinya.'
  rationale: Revisi memulihkan unsur api dalam istilah korban אִשֶּׁה tanpa mengidentifikasikannya secara sempit dengan satu jenis korban, dan menyampaikan idiom penutup sebagai ketentuan harian yang dilakukan pada harinya. Istilah ritual lain dipertahankan dalam register Indonesia baku dan khidmat.
