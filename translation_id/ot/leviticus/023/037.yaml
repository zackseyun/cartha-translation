id: LEV.23.37
reference: Leviticus 23:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: id
  text: 'Inilah waktu-waktu yang ditetapkan TUHAN, yang harus kamu umumkan sebagai pertemuan-pertemuan kudus, untuk mempersembahkan kepada TUHAN persembahan yang dibakar: kurban bakaran dan persembahan sajian, kurban sembelihan dan persembahan curahan, sesuai dengan ketentuan setiap hari, pada harinya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: waktu-waktu perayaan yang ditetapkan
  rationale: מוֹעֵד menunjuk pada waktu yang ditetapkan untuk perayaan atau pertemuan; frasa ini menyampaikan unsur waktu dan penetapan secara alami dalam bahasa Indonesia.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: pertemuan-pertemuan kudus
  rationale: Ungkapan ini berarti pertemuan atau perhimpunan yang dipanggil dan dikhususkan; bentuk jamak sumber dipertahankan.
- source_word: אִשֶּׁה
  choice: persembahan berupa makanan
  rationale: Dalam konteks korban, istilah ini menunjuk pada persembahan yang dipersembahkan di atas mezbah; pilihan ini mengikuti bukti leksikal bahwa yang dimaksud ialah persembahan makanan bagi TUHAN, tanpa membatasi maknanya hanya pada cara pembakaran.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah teknis bagi korban yang dinaikkan dan dibakar seluruhnya di atas mezbah.
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks kultis Imamat, istilah ini lazim menunjuk pada persembahan hasil bumi atau biji-bijian yang disiapkan sebagai sajian.
- source_word: זֶבַח
  choice: kurban sembelihan
  rationale: Mempertahankan gagasan kurban hewan yang disembelih dan membedakannya dari kurban bakaran.
- source_word: נְסָכִים
  choice: persembahan-persembahan curahan
  rationale: Bentuk jamak dan tindakan mencurahkan cairan dalam ritus dipertahankan.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: masing-masing pada hari yang telah ditentukan
  rationale: Ungkapan idiomatis ini menyatakan bahwa kewajiban persembahan setiap hari dilakukan pada harinya; terjemahan harfiah 'urusan hari pada harinya' tidak alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Memakai konvensi Alkitab bahasa Indonesia yang luas dikenal, dengan huruf kapital untuk menandai nama ilahi tanpa menetapkan pelafalan yang diperdebatkan.
- issue: Makna אִשֶּׁה
  choice: persembahan berupa makanan
  alternative: persembahan yang dibakar atau persembahan dengan api
  rationale: Pilihan ini tidak menjadikan api sebagai inti leksikal istilah dan sesuai dengan fungsi korban sebagai persembahan di mezbah, sembari mempertahankan daftar jenis persembahan yang mengikutinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat konsisten dan mudah dibedakan; pengulangan serta bentuk jamak sumber dipertahankan bila wajar.
