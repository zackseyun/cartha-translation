base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: id
  text: 'Kalian harus menghitung sendiri sejak hari sesudah Sabat, sejak hari kalian membawa berkas persembahan unjukan: hendaklah ada tujuh Sabat penuh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tujuh pekan penuh.” Secara harfiah, bahasa Ibrani berbunyi “tujuh Sabat penuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: Kalian harus menghitung
  rationale: Bentuk verba dalam konteks hukum menyampaikan perintah. “Harus menghitung” terdengar alami dalam bahasa Indonesia modern dan mempertahankan daya wajibnya.
- source_word: לָכֶם
  choice: bagi kalian sendiri
  rationale: Pronomina datif ini memberi nuansa refleksif atau keterlibatan pribadi; frasa ini mempertahankan nuansa tersebut meskipun sedikit lebih formal daripada sekadar “bagi kalian”.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: mulai dari hari sesudah Sabat
  rationale: מָחֳרַת menunjuk kepada hari berikutnya. “Sabat” dipertahankan sebagai istilah ibadah khusus dan tidak digeneralisasi menjadi “hari istirahat”.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: yaitu dari hari ketika kalian membawa
  rationale: Frasa ini menandai titik awal penghitungan. “Yaitu” memperjelas bahwa ungkapan ini menerangkan titik waktu yang baru disebutkan tanpa menghapus kemungkinan penafsiran kalendernya.
- source_word: עֹמֶר
  choice: berkas
  rationale: Dalam konteks ini עֹמֶר menunjuk pada berkas hasil panen yang dibawa dalam ritual, bukan terutama pada satuan takaran. “Berkas” mempertahankan benda konkretnya tanpa menambahkan jenis tanaman yang tidak disebut dalam ayat.
- source_word: הַתְּנוּפָה
  choice: persembahan unjukan
  rationale: Istilah ini menunjuk pada persembahan yang secara ritual diunjukkan atau digerakkan di hadapan TUHAN. “Persembahan unjukan” merupakan padanan Indonesia yang dikenal dan tetap mempertahankan kekhususan ritualnya.
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: tujuh Sabat
  rationale: Teks Ibrani secara eksplisit memakai bentuk jamak שַׁבָּתוֹת. Terjemahan utama mempertahankan “Sabat” agar tidak menutup perdebatan apakah istilah itu di sini berarti hari-hari Sabat atau siklus pekan.
- source_word: תְּמִימֹת
  choice: yang utuh
  rationale: Dalam konteks penghitungan waktu, kata ini menyatakan kelengkapan seluruh periode, bukan kesempurnaan moral atau keadaan tanpa cacat.
- source_word: תִּהְיֶינָה
  choice: Harus ada
  rationale: Ungkapan ini menyampaikan konstruksi eksistensial Ibrani sekaligus daya normatif kalimat dalam konteks hukum.
theological_decisions:
- issue: Makna שַׁבָּת / שַׁבָּתוֹת dalam petunjuk kalender
  choice: Mempertahankan “Sabat” dan “tujuh Sabat” dalam teks utama.
  alternative: Menerjemahkannya sebagai “pekan” atau “tujuh pekan penuh”.
  rationale: Istilah Ibrani yang dipakai adalah istilah Sabat, dan ayat ini menjadi bagian dari perdebatan lama mengenai awal penghitungan serta fungsi bentuk jamaknya. Teks utama mempertahankan ketegangan itu, sedangkan catatan kaki menyajikan padanan kalender yang lazim.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bernada hukum yang khidmat. Bentuk jamak “kalian” dipakai karena verba dan pronomina Ibrani berbentuk jamak. Istilah ritual “persembahan unjukan” dipertahankan demi ketepatan kultis, sedangkan susunan dua klausa menghindari kalimat yang terlalu padat.
