  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: id
  text: Janganlah kamu melakukan pekerjaan apa pun. Ini adalah ketetapan tetap[a] bagimu turun-temurun di seluruh tempat tinggalmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketetapan untuk selama-lamanya” atau “ketetapan yang kekal.” Kata Ibrani עוֹלָם dapat menunjuk pada masa yang berkelanjutan atau sangat panjang dan, dalam konteks tertentu, selama-lamanya.
    reason: lexical_alternative
  - marker: b
    text: Atau “di seluruh permukimanmu” atau “di mana pun kamu tinggal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Janganlah kamu melakukan pekerjaan apa pun
  rationale: Larangan dengan כָּל מְלָאכָה mencakup segala jenis pekerjaan. Bentuk “pekerjaan apa pun” menyampaikan cakupan menyeluruh secara alami tanpa menambahkan penekanan yang tidak perlu.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan yang berlaku untuk seterusnya
  rationale: חֻקָּה menunjuk pada ketetapan yang mengikat, sedangkan עוֹלָם menyatakan keberlangsungan yang panjang atau terus-menerus. Pilihan ini mempertahankan daya hukum dan keluasan durasinya tanpa memaksakan pengertian filosofis tentang kekekalan mutlak.
- source_word: לְדֹרֹתֵיכֶם
  choice: bagi kamu turun-temurun
  rationale: Ungkapan ini menyatakan bahwa ketetapan tersebut berlaku bagi generasi-generasi berikutnya. “Turun-temurun” merupakan ungkapan Indonesia yang ringkas dan wajar.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: di seluruh tempat tinggalmu
  rationale: מוֹשָׁב dapat berarti tempat tinggal atau permukiman. Terjemahan ini mempertahankan cakupan semua tempat kediaman tanpa membatasi maknanya pada jenis permukiman tertentu.
theological_decisions:
- issue: Durasi ketetapan dalam hukum ibadah
  choice: ketetapan yang berlaku untuk seterusnya
  alternative: ketetapan untuk selama-lamanya
  rationale: עֹולָם dapat menyatakan keberlangsungan tetap atau tanpa batas yang disebutkan, tetapi konteks dan kata itu sendiri tidak selalu menentukan konsep metafisik tentang kekekalan mutlak. Terjemahan utama mempertahankan ketegangan tersebut, sementara catatan kaki mencatat alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat digunakan tanpa ragam arkais. Partikel “-lah” memberi nuansa larangan resmi, sedangkan “turun-temurun” dan “tempat tinggal” tetap mudah dipahami pembaca Indonesia modern.
