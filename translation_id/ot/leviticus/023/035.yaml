  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: id
  text: Pada hari pertama harus diadakan pertemuan kudus; kamu tidak boleh melakukan pekerjaan biasa apa pun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pekerjaan pelayanan apa pun.” Secara harfiah, “segala pekerjaan pelayanan.” Ungkapan Ibrani ini menunjuk pada pekerjaan biasa yang terkait dengan tugas atau mata pencaharian, bukan setiap bentuk kegiatan tanpa kecuali.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Pada hari pertama
  rationale: Frasa temporal dengan בְּ dan bilangan bertingkat הָרִאשׁוֹן secara alami diterjemahkan sebagai “Pada hari pertama” dalam bahasa Indonesia.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Ungkapan kultis tetap ini menunjuk pada pertemuan suci yang diserukan atau dihimpunkan secara resmi. “Pertemuan kudus” mempertahankan unsur berkumpul tanpa memakai istilah yang terasa usang.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan rutin apa pun
  rationale: Ungkapan ini mengacu pada pekerjaan biasa yang berkaitan dengan mata pencaharian atau pelayanan, bukan pada setiap bentuk kegiatan tanpa kecuali. “Pekerjaan rutin” menyampaikan cakupan itu dengan wajar dalam bahasa Indonesia modern.
- source_word: לֹא תַעֲשׂוּ
  choice: kamu tidak boleh melakukan
  rationale: Bentuk orang kedua jamak dalam ketetapan hukum paling alami dinyatakan sebagai larangan “kamu tidak boleh melakukan”; kata “kamu” dapat dipahami sebagai jamak dari konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “harus diadakan” membuat fungsi מִקְרָא sebagai pertemuan yang ditetapkan jelas tanpa menambahkan pelaku yang tidak disebutkan. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
