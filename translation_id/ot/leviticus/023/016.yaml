id: LEV.23.16
reference: Leviticus 23:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: id
  text: Hendaklah kalian menghitung lima puluh hari[a], sampai hari sesudah Sabat yang ketujuh; lalu hendaklah kalian mempersembahkan persembahan sajian yang baru kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai hari sesudah minggu yang ketujuh.” Teks Ibrani berbunyi “hari sesudah Sabat yang ketujuh,” dan terdapat perbedaan pendapat tentang bagaimana penghitungan hari raya ini dinyatakan menurut kalender.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד
  choice: sampai
  rationale: Menandai batas waktu penghitungan dan secara alami mengantar frasa waktu berikutnya.
- source_word: מִמָּחֳרַת
  choice: hari sesudah
  rationale: Mengungkapkan makna 'keesokan hari/hari setelah' dengan bahasa Indonesia modern yang jelas.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: Sabat yang ketujuh
  rationale: Mempertahankan kata Ibrani שַׁבָּת dan tidak mengubahnya secara interpretatif menjadi 'minggu yang ketujuh'.
- source_word: תִּסְפְּרוּ
  choice: kamu harus menghitung
  rationale: Bentuk orang kedua jamak dalam ketetapan hukum diterjemahkan sebagai kewajiban yang ditujukan kepada umat.
- source_word: חֲמִשִּׁים יוֹם
  choice: lima puluh hari
  rationale: Padanan langsung dan wajar bagi konstruksi bilangan Ibrani.
- source_word: וְהִקְרַבְתֶּם
  choice: lalu kamu harus mempersembahkan
  rationale: Dalam konteks kurban, verba ini berarti membawa atau menyajikan persembahan; 'lalu' memperjelas urutan tindakan.
- source_word: מִנְחָה
  choice: kurban sajian
  rationale: Istilah ritual ini lazim menunjuk persembahan hasil tanaman atau tepung; 'kurban sajian' mempertahankan kekhususan kultis tanpa membatasinya hanya pada biji-bijian mentah.
- source_word: חֲדָשָׁה
  choice: yang baru
  rationale: Menerjemahkan adjektiva secara langsung dan menunjukkan bahwa sajian itu berasal dari hasil yang baru.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל sesuai diterjemahkan 'kepada' dalam konteks mempersembahkan, dan nama perjanjian ilahi dipertahankan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Apakah הַשַּׁבָּת הַשְּׁבִיעִת perlu diperhalus menjadi ungkapan kalender 'minggu yang ketujuh'
  choice: Sabat yang ketujuh
  alternative: minggu yang ketujuh
  rationale: Teks Ibrani secara eksplisit memakai שַׁבָּת, bukan kata biasa untuk 'minggu'. Pilihan ini mempertahankan ketegangan penafsiran kalender tanpa menyelesaikannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kamu' dipakai untuk sapaan orang kedua jamak kepada umat; 'harus' menyampaikan daya perintah hukum. Istilah 'kurban sajian' dipilih sebagai istilah ritual yang ringkas dan mudah dipahami.
