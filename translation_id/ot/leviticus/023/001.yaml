lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר melanjutkan rangkaian narasi dan memperkenalkan perkataan ilahi. Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan perkataan; “kepada” adalah padanan Indonesia yang wajar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Nama Ibrani ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam formula וידבר ... לאמר, infinitif ini memperkenalkan isi firman yang menyusul. Fungsi tersebut sudah tersampaikan secara alami oleh “berfirman”; menambahkan “demikian” atau “katanya” akan terasa berlebihan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri YHWH. Bentuk “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” merupakan penggantian tradisional dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Formula pembuka ilahi diterjemahkan secara idiomatis tanpa menggandakan verba ujaran.
