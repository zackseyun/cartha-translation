  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: id
  text: '“Berbicaralah kepada orang Israel dan katakan kepada mereka: Ketika kamu memasuki negeri yang Kuberikan kepadamu dan menuai hasilnya, bawalah kepada imam seberkas dari hasil pertama panenmu.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “satu omer dari hasil pertama panenmu,” atau, “seberkas hasil sulung panenmu.” Istilah Ibrani omer di sini dapat menunjuk kepada berkas hasil tuaian dan juga dipakai sebagai istilah teknis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini merupakan sebutan kolektif baku bagi bangsa Israel; 'orang Israel' alami dalam bahasa Indonesia dan tidak membatasi sapaan perjanjian itu hanya kepada laki-laki.
- source_word: כִּי
  choice: Apabila
  rationale: Di sini כִּי memperkenalkan keadaan ketika perintah berikut berlaku, bukan alasan kausal.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks ini kata tersebut menunjuk kepada wilayah yang akan diberikan kepada Israel; 'negeri' merupakan padanan geografis yang alami.
- source_word: נֹתֵן
  choice: Kuberikan
  rationale: Bentuk partisip Ibrani menyatakan tindakan ilahi yang sedang berlangsung atau segera terwujud. Bentuk kini bahasa Indonesia ini cukup luwes untuk mencakup nuansa tersebut.
- source_word: וּקְצַרְתֶּם אֶת־קְצִירָהּ
  choice: dan menuai hasilnya
  rationale: Terjemahan ini mempertahankan tindakan menuai dan akhiran orang ketiga feminin yang merujuk kembali kepada negeri.
- source_word: וַהֲבֵאתֶם
  choice: bawalah
  rationale: Dalam rangkaian hukum ini bentuk tersebut berfungsi sebagai perintah yang berlaku setelah keadaan sebelumnya terpenuhi.
- source_word: עֹמֶר
  choice: satu berkas
  rationale: Dalam konteks panen, kata ini paling wajar menunjuk kepada seberkas batang gandum hasil tuaian; istilah teknis 'omer' tetap dicatat dalam catatan kaki.
- source_word: רֵאשִׁית קְצִירְכֶם
  choice: hasil pertama dari panenmu
  rationale: רֵאשִׁית menyatakan bagian awal atau pertama dari panen. Ungkapan ini mempertahankan makna kultis tanpa memaksakan istilah teknis yang kurang lazim.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bahasa Indonesia untuk כֹּהֵן dalam peraturan ibadah Israel.
theological_decisions:
- issue: Sapaan perjanjian yang secara harfiah berbentuk 'anak-anak lelaki Israel'
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam pemakaian Ibrani, frasa itu menjadi sebutan kolektif bagi bangsa Israel. 'Orang Israel' menyampaikan cakupan tersebut secara wajar tanpa menghapus identitas kelompoknya.
- issue: Makna istilah kultis עֹמֶר
  choice: satu berkas
  alternative: satu omer
  rationale: Benda yang dibawa kepada imam dalam konteks ini adalah hasil tuaian yang diberkas. Namun, karena עֹמֶר juga dapat dipahami sebagai istilah teknis, alternatif transliterasinya dipertahankan dalam catatan kaki.
- issue: Hubungan רֵאשִׁית dengan panen
  choice: hasil pertama dari panenmu
  alternative: hasil sulung panenmu
  rationale: Pilihan utama mempertahankan arti bagian pertama tanpa mempersempitnya secara tidak perlu, sedangkan 'hasil sulung' merupakan ungkapan kultis tradisional yang juga mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal kepada Musa memakai bentuk terikat formal ('Berbicaralah', 'katakan'), sedangkan bentuk jamak bagi Israel diterjemahkan dengan 'kamu' sesuai kelaziman bahasa Indonesia. Penulisan 'Kuberikan' menandai subjek ilahi menurut konvensi ejaan Alkitab bahasa Indonesia.
