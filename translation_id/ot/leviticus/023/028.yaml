id: LEV.23.28
reference: Leviticus 23:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: id
  text: Janganlah kamu melakukan pekerjaan apa pun pada hari ini juga, karena hari ini adalah Hari Pendamaian[a], untuk mengadakan pendamaian bagi kamu di hadapan Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “hari pendamaian-pendamaian.” Nama hari raya ini lazim diterjemahkan “Hari Pendamaian.”'
    reason: Menjaga bentuk jamak כִּפֻּרִים yang tidak dapat disampaikan secara alami dalam nama hari raya Indonesia.
lexical_decisions:
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Janganlah kamu melakukan pekerjaan apa pun
  rationale: Larangan dengan לֹא dan bentuk orang kedua jamak diterjemahkan sebagai perintah negatif yang tegas dan wajar dalam bahasa Indonesia. מְלָאכָה berarti pekerjaan atau kegiatan kerja dalam ketentuan hari raya.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: tepat pada hari ini
  rationale: Ungkapan ini menegaskan hari itu sendiri atau persis hari tersebut; 'tepat pada hari ini' mempertahankan tekanan temporal secara alami.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi larangan sebelumnya.
- source_word: יוֹם כִּפֻּרִים
  choice: Hari Pendamaian
  rationale: Ini adalah nama hari raya yang lazim dan mudah dipahami. Bentuk Ibraninya secara harfiah memakai kata benda jamak, sehingga nuansa tersebut dicatat dalam catatan kaki.
- source_word: לְכַפֵּר עֲלֵיכֶם
  choice: untuk mengadakan pendamaian bagimu
  rationale: Dalam konteks ibadah imamat, bentuk piel כפר menyatakan tindakan mengadakan pendamaian. עַל menandai orang yang menerima manfaatnya; bentuk 'bagimu' juga mempertahankan sapaan jamak.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Pilihan ini menyampaikan keberadaan dalam hadirat ilahi dan cocok dengan konteks ibadah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga identitas nama perjanjian dalam teks sumber dipertahankan.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam rumusan perjanjian ini bentuknya bermakna tunggal, 'Allahmu'. Akhiran Ibrani merujuk kepada kelompok; bahasa Indonesia dapat memakai bentuk tunggal kolektif dalam sapaan kepada umat.
theological_decisions:
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama diri ilahi secara langsung. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna kultis כפר dan כִּפֻּרִים
  choice: pendamaian / Hari Pendamaian
  alternative: pengampunan, penutupan, atau penyucian / Hari Pendamaian-pendamaian
  rationale: '''Pendamaian'' mempertahankan bobot kultis dan relasional istilah tersebut tanpa menentukan satu teori teologis tertentu. Bentuk jamak nama hari raya dijelaskan dalam catatan kaki.'
- issue: Pelaku tersirat dalam לְכַפֵּר עֲלֵיכֶם
  choice: untuk mengadakan pendamaian bagimu
  alternative: agar kamu mengadakan pendamaian bagi dirimu
  rationale: Infinitif Ibrani tidak menyebut pelaku secara eksplisit. Rumusan tanpa subjek eksplisit mempertahankan ambiguitas itu dan tidak memaksakan bahwa umat sendiri adalah pelakunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Janganlah' mempertahankan nada hukum tanpa terasa usang; 'pekerjaan apa pun' memperjelas cakupan כָּל. Tanda catatan kaki [a] muncul langsung setelah istilah yang diterangkan.
