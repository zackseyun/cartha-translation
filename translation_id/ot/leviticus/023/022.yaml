    reason: lexical_alternative
  - marker: b
    text: Atau “orang asing yang menetap.” Kata Ibrani ini menunjuk pada orang non-Israel yang tinggal di tengah masyarakat Israel dan berada di bawah perlindungan hukumnya.
    reason: lexical_alternative
