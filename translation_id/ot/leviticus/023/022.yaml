source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: id
  text: Ketika kalian menuai hasil panen tanah kalian, janganlah engkau menghabiskan bagian tepi ladangmu[a], dan janganlah engkau memungut sisa-sisa panenmu. Tinggalkanlah bagian-bagian itu bagi orang miskin dan bagi pendatang yang menetap[b]. Akulah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sudut ladangmu.” Kata Ibrani yang dipakai dapat berarti tepi, sisi, atau sudut.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang asing yang menetap.” Kata Ibrani ini menunjuk pada orang non-Israel yang tinggal di tengah masyarakat Israel dan berada di bawah perlindungan hukumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: Ketika kalian menuai hasil tanah kalian
  rationale: Konstruksi dengan infinitif memperkenalkan keadaan waktu. “Ketika ... menuai” alami dalam bahasa Indonesia, sedangkan “hasil tanah” mempertahankan kaitan panen dengan tanah yang digarap.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ
  choice: janganlah engkau menuai habis sampai ke tepi ladangmu
  rationale: Bentuk Piel dari כלה menyatakan menyelesaikan atau menghabiskan. Ungkapan ini menyampaikan larangan menuai hingga batas terluar ladang; unsur בְּקֻצְרֶךָ terwakili secara alami oleh verba “menuai” tanpa pengulangan yang kaku.
- source_word: פְּאַת שָׂדְךָ
  choice: tepi ladangmu
  rationale: פֵּאָה dapat berarti tepi, sisi, atau sudut. “Tepi” cukup luas untuk mempertahankan cakupan makna sumber; alternatif “sudut” dicatat dalam catatan kaki.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: dan janganlah engkau memungut sisa-sisa panenmu
  rationale: לֶקֶט menunjuk pada bagian hasil panen yang tercecer atau tertinggal untuk dipungut. “Sisa-sisa panen” lebih mudah dipahami pembaca umum daripada istilah teknis yang kurang lazim.
- source_word: לֶעָנִי
  choice: bagi orang miskin
  rationale: עָנִי di sini menunjuk kepada orang yang miskin atau rentan secara ekonomi.
- source_word: וְלַגֵּר
  choice: dan pendatang
  rationale: גֵּר adalah orang bukan pribumi yang menetap di tengah masyarakat Israel. “Pendatang” alami dalam bahasa Indonesia, sementara nuansa menetap dan perlindungan sosial dijelaskan dalam catatan kaki.
- source_word: תַּעֲזֹב אֹתָם
  choice: Tinggalkanlah semuanya
  rationale: עָזַב dalam konteks ini berarti membiarkan atau meninggalkan hasil itu agar tersedia bagi orang lain. “Semuanya” merujuk pada bagian tepi ladang dan sisa-sisa panen.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Akulah Yahweh, Allah kalian
  rationale: Nama perjanjian יְהוָה ditransliterasikan “Yahweh”; formula penutup dipertahankan secara ringkas dan berbobot.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan fungsi nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna sosial-hukum גֵּר
  choice: pendatang
  alternative: orang asing yang menetap
  rationale: Istilah ini bukan sekadar orang asing yang lewat, melainkan orang non-Israel yang tinggal di tengah Israel. Teks utama memakai ungkapan yang wajar, dan catatan kaki mempertahankan nuansa menetap serta perlindungan hukum.
- issue: Peralihan jumlah orang kedua
  choice: kalian ... engkau ... kalian
  alternative: kamu secara seragam
  rationale: Sumber beralih dari bentuk jamak pada pembukaan kepada bentuk tunggal dalam perintah, lalu kembali ke bentuk jamak dalam formula penutup. Terjemahan mempertahankan peralihan kolektif-individual ini tanpa menafsirkannya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “janganlah” dan “Akulah” mempertahankan nada hukum dan formula ilahi tanpa terdengar kuno. Peralihan antara “kalian” dan “engkau” sengaja mengikuti perubahan bentuk jamak dan tunggal dalam teks Ibrani.
