review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya mengikuti teks Ibrani dengan baik, termasuk peralihan kalian–engkau–kalian, nama Yahweh, dan dua kelompok penerima. Namun, “menuai habis sampai ke tepi ladangmu” secara idiomatis dapat berarti menuai hingga batas tepi ladang, yaitu kebalikan dari larangan Ibrani untuk tidak menghabiskan bagian tepi.
  naturalness: Bahasa draf umumnya baku dan jelas. “Janganlah engkau menghabiskan bagian tepi ladangmu” secara langsung dan alami menyatakan maksud hukum tersebut. “Pendatang yang menetap” lebih jelas daripada “pendatang” saja dalam teks utama.
  terminology: “Yahweh” tepat untuk יהוה. “Orang miskin” tepat untuk עני. Untuk גר, “pendatang yang menetap” menjaga nuansa seseorang dari luar yang tinggal di tengah masyarakat, tanpa memaksakan kategori modern. Catatan kaki tetap menyediakan alternatif dan penjelasan sosial-hukum.
  issues:
  - severity: high
    issue: Frasa “menuai habis sampai ke tepi ladangmu” ambigu dan berpotensi berlawanan makna.
    rationale: Dalam pemakaian Indonesia, “sampai ke tepi” lazimnya menyatakan tindakan dilakukan hingga batas tepi. Teks Ibrani melarang menghabiskan/menyelesaikan bagian tepi ladang pada waktu menuai.
  - severity: medium
    issue: “Pendatang” tanpa kualifikasi terlalu luas untuk גר.
    rationale: Istilah ini dapat mencakup pengunjung atau orang yang baru datang, sedangkan גר dalam konteks hukum ini ialah orang dari luar yang menetap di tengah Israel. Penjelasan itu sebaiknya hadir dalam teks utama agar makna tidak hanya bergantung pada catatan kaki.
  revised_text: Ketika kalian menuai hasil panen tanah kalian, janganlah engkau menghabiskan bagian tepi ladangmu[a], dan janganlah engkau memungut sisa-sisa panenmu. Tinggalkanlah bagian-bagian itu bagi orang miskin dan bagi pendatang yang menetap[b]. Akulah Yahweh, Allah kalian.
  revised_footnotes:
