  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: id
  text: supaya keturunanmu, dari generasi ke generasi, mengetahui bahwa Aku membuat orang Israel tinggal di pondok-pondok[a] ketika Aku membawa mereka keluar dari tanah Mesir. Akulah Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “naungan-naungan sementara.” Kata Ibrani sukkot menunjuk pada pondok atau naungan sementara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: supaya ... mengetahui
  rationale: Mengungkapkan tujuan yang diperkenalkan oleh לְמַעַן secara alami dalam bahasa Indonesia.
- source_word: דֹרֹתֵיכֶם
  choice: keturunanmu turun-temurun
  rationale: Menyampaikan rangkaian generasi penerima perintah secara idiomatis tanpa membatasinya pada satu angkatan.
- source_word: בַסֻּכּוֹת
  choice: di pondok-pondok
  rationale: סֻכּוֹת menunjuk pada tempat tinggal atau naungan sementara dan mempertahankan kaitannya dengan hari raya dalam konteks pasal ini.
- source_word: הוֹשַׁבְתִּי
  choice: Aku membuat ... tinggal
  rationale: Mempertahankan bentuk kausatif Hifil dari ישׁב, bukan sekadar menyatakan bahwa Israel tinggal di sana.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Indonesia yang wajar untuk sebutan kolektif harfiah 'anak-anak lelaki Israel', yang di sini merujuk kepada umat Israel.
- source_word: בְּהוֹצִיאִי
  choice: ketika Aku membawa mereka keluar
  rationale: Awalan ב pada infinitif konstruk menyatakan keadaan waktu; bentuk ini alami dan tetap menyatakan tindakan ilahi.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Mempertahankan unsur eksplisit אֶרֶץ, 'tanah/negeri', dengan susunan Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, alih-alih menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Padanan langsung formula perjanjian dengan akhiran orang kedua jamak yang secara wajar dapat dinyatakan sebagai bentuk kolektif dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH, sehingga transliterasi mempertahankan perbedaan antara nama tersebut dan gelar אֲדֹנָי.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam konteks ini ungkapan tersebut merupakan sebutan kolektif bagi umat Israel; 'orang Israel' menghindari kesan keliru bahwa hanya anak-anak atau laki-laki yang dimaksud.
- issue: Daya kausatif הוֹשַׁבְתִּי
  choice: Aku membuat ... tinggal
  alternative: Aku menempatkan ... untuk tinggal
  rationale: Pilihan utama mempertahankan pernyataan bahwa Yahweh menyebabkan Israel tinggal di pondok-pondok tanpa menjelaskan lebih jauh sifat tindakan itu.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Kapitalisasi kata ganti ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Bentuk tunggal -mu dipakai secara kolektif untuk komunitas yang disapa, sebagaimana lazim dalam bahasa Indonesia.
