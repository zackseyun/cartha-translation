id: LEV.23.41
reference: Leviticus 23:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: id
  text: Kamu harus merayakannya sebagai perayaan bagi Yahweh selama tujuh hari setiap tahun. Ini adalah ketetapan yang tetap berlaku bagi generasi-generasimu[a]. Pada bulan ketujuh kamu harus merayakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketetapan untuk selama-lamanya” atau “ketetapan kekal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: kamu harus merayakannya
  rationale: Kata kerja חָגַג menunjuk pada merayakan atau menjalankan perayaan, khususnya perayaan ziarah. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan pengulangan kata kerja Ibrani.
- source_word: חַג
  choice: perayaan
  rationale: חַג berarti perayaan atau hari raya, sering dengan nuansa perayaan ziarah. 'Perayaan' jelas dan menghindari kesan bahwa yang terutama dimaksud ialah jamuan makan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל dapat menandai peruntukan atau penghormatan. 'Bagi Yahweh' menyampaikan bahwa perayaan itu diselenggarakan untuk menghormati-Nya, sedangkan nama perjanjian יהוה dipertahankan sebagai 'Yahweh'.
- source_word: שִׁבְעַת יָמִים בַּשָּׁנָה
  choice: selama tujuh hari setiap tahun
  rationale: Frasa ini menyatakan durasi tujuh hari dan pelaksanaan tahunan. 'Setiap tahun' mengungkapkan maksud idiomatis בַּשָּׁנָה secara alami.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan tetap
  rationale: חֻקָּה ialah ketetapan yang ditentukan, sedangkan עוֹלָם menegaskan keberlakuan yang berkelanjutan. 'Tetap' mempertahankan daya ikat jangka panjang tanpa memaksakan klaim filosofis tentang kemutlakan tanpa akhir.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan ini menyatakan keberlakuan bagi generasi-generasi berikutnya. 'Turun-temurun' ringkas, alami, dan tepat dalam bahasa Indonesia.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: pada bulan ketujuh
  rationale: Terjemahan langsung dan alami untuk penanda waktu pelaksanaan perayaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian יהוה. 'Yahweh' mempertahankan nama itu secara langsung dan tidak menggantinya dengan gelar.
- issue: Daya waktu עוֹלָם dalam hukum peribadatan
  choice: tetap
  alternative: kekal; untuk selama-lamanya
  rationale: Dalam konteks hukum perjanjian, עוֹלָם menandakan keberlakuan yang berkelanjutan atau permanen, tetapi tidak selalu menentukan secara filosofis durasi mutlak tanpa akhir. 'Tetap' menjaga ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kamu' mengikuti sapaan jamak kepada umat dalam bahasa sumber, meskipun bahasa Indonesia tidak menandai jumlah. Pengulangan 'merayakannya' dipertahankan untuk mencerminkan pengulangan verba Ibrani.
