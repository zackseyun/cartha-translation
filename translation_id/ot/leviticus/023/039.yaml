source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: id
  text: Namun, pada hari kelima belas bulan ketujuh, ketika kamu telah mengumpulkan hasil tanah itu, kamu harus merayakan hari raya Yahweh selama tujuh hari. Pada hari pertama harus ada perhentian khidmat[a], dan pada hari kedelapan juga harus ada perhentian khidmat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istirahat Sabat.” Istilah Ibraninya menunjuk pada perhentian khusus yang berkaitan dengan perayaan kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Akan tetapi
  rationale: Partikel ini menandai peralihan atau penegasan yang bersifat membatasi dari ketentuan sebelumnya; “Akan tetapi” mempertahankan fungsi wacananya secara alami.
- source_word: בְּאָסְפְּכֶם אֶת תְּבוּאַת הָאָרֶץ
  choice: setelah kamu mengumpulkan hasil tanah itu
  rationale: Konstruksi infinitif dengan בְ menyatakan keadaan temporal. “Setelah” sesuai dengan konteks selesainya pengumpulan hasil panen, sedangkan “hasil tanah” tidak membatasi makna pada gandum saja.
- source_word: תָּחֹגּוּ אֶת חַג יְהוָה
  choice: kamu harus merayakan perayaan bagi Yahweh
  rationale: Kata kerja חגג dan nomina חַג membentuk ungkapan yang menekankan perayaan hari raya, sering kali dengan nuansa ziarah. “Perayaan bagi Yahweh” terdengar alami dan mempertahankan relasi genitif/dedikatif tanpa menambahkan kekhususan denominasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama diri yang terdapat dalam teks Ibrani.
- source_word: שַׁבָּתוֹן
  choice: beristirahat penuh
  rationale: Istilah ini menunjuk pada penghentian kegiatan secara khusus dalam rangka perayaan kudus. Pilihan ini menghindari penyamaan otomatis dengan Sabat mingguan sekaligus mempertahankan gagasan istirahat yang menyeluruh.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Preposisi “selama” menyatakan durasi perayaan secara idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan bentuk nama itu, bukan menggantinya dengan gelar.
- issue: Makna שַׁבָּתוֹן dalam peraturan perayaan
  choice: beristirahat penuh
  alternative: mengadakan perhentian khidmat; mengadakan istirahat Sabat
  rationale: Konteks menetapkan istirahat khusus pada hari pertama dan kedelapan. Terjemahan ini tidak menyimpulkan bahwa hari-hari tersebut pasti merupakan Sabat mingguan, tetapi tetap menyampaikan penghentian kegiatan yang diwajibkan.
- issue: Hubungan חַג dengan Yahweh
  choice: perayaan bagi Yahweh
  alternative: perayaan Yahweh; hari raya bagi Yahweh
  rationale: Konstruksi Ibrani dapat dipahami sebagai perayaan yang menjadi milik atau dipersembahkan bagi Yahweh. “Bagi Yahweh” menyampaikan orientasinya dengan jelas tanpa mempersempit jenis perayaannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak orang kedua dalam bahasa Ibrani diterjemahkan dengan “kamu” sebagai sapaan kolektif. Repetisi שַׁבָּתוֹן pada klausa terakhir disampaikan secara alami dengan “demikian juga,” tanpa menghilangkan kesetaraan kewajiban pada hari pertama dan kedelapan.
