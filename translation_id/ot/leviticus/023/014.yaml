review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya setia pada rangkaian tiga bentuk hasil gandum, larangan hukum, persembahan kepada Allah, dan cakupan lintas generasi serta semua tempat tinggal. Namun, “sampai hari itu juga” lazimnya berarti ‘pada hari yang sama’ dalam bahasa Indonesia dan tidak menyampaikan penegasan deiktis עַד עֶצֶם הַיּוֹם הַזֶּה (‘hingga tepat pada hari ini’) dengan cukup jelas.
  naturalness: Ragam bahasa draf cukup alami dan sesuai untuk hukum-keagamaan. “Gandum sangrai” lebih ringkas dan idiomatis daripada “gandum yang dipanggang,” sementara “di semua tempat tinggalmu” mempertahankan cakupan eksplisit בְּכֹל dengan lebih dekat daripada “di mana pun kamu tinggal.”
  terminology: “Roti,” “bulir gandum segar,” “persembahan,” dan “ketetapan ... selama-lamanya” merupakan padanan yang layak. “Allahmu” dengan sapaan kolektif “kamu” dapat dipertahankan dalam bahasa Indonesia modern. Catatan alternatif untuk חֻקַּת עוֹלָם tetap sesuai dan tidak menafsirkan implikasi teologis di luar teks.
  issues:
  - severity: medium
    issue: Ungkapan waktu “sampai hari itu juga”
    rationale: Ungkapan ini biasanya menunjuk ‘hari yang sama’ dan dapat mengaburkan unsur demonstratif serta penegas dalam הַיּוֹם הַזֶּה / עֶצֶם. “Sampai tepat pada hari ini” lebih langsung mencerminkan sumber tanpa menambahkan penafsiran.
  - severity: low
    issue: “Di mana pun kamu tinggal” kurang eksplisit untuk ‘di semua tempat tinggalmu’
    rationale: Maknanya hampir sama, tetapi בְּכֹל מוֹשְׁבֹתֵיכֶם secara eksplisit menyebut semua tempat kediaman. Revisi mempertahankan cakupan itu dalam register hukum yang wajar.
  revised_text: Kamu tidak boleh makan roti, gandum sangrai, ataupun bulir gandum segar sampai tepat pada hari ini, sampai kamu membawa persembahan bagi Allahmu. Ini adalah ketetapan yang berlaku untuk selama-lamanya[a], turun-temurun di semua tempat tinggalmu.
  revised_footnotes:
