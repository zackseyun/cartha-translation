  text: וְ/לֶחֶם֩ וְ/קָלִ֨י וְ/כַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה עַ֚ד הֲבִ֣יאֲ/כֶ֔ם אֶת קָרְבַּ֖ן אֱלֹהֵי/כֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: id
  text: Kamu tidak boleh makan roti, gandum sangrai, ataupun bulir gandum segar sampai tepat pada hari ini, sampai kamu membawa persembahan bagi Allahmu. Ini adalah ketetapan yang berlaku untuk selama-lamanya[a], turun-temurun di semua tempat tinggalmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketetapan tetap” atau “ketetapan kekal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: roti
  rationale: Makna konkretnya adalah roti; dalam konteks hukum panen ini, kata tersebut menunjuk pada hasil gandum yang sudah diolah menjadi roti.
- source_word: קָלִי
  choice: gandum yang dipanggang
  rationale: Menunjuk pada biji-bijian yang disiapkan dengan dipanggang atau disangrai. Ungkapan ini jelas bagi pembaca modern dan mempertahankan kekhususan pertaniannya.
- source_word: כַרְמֶל
  choice: bulir gandum segar
  rationale: Dalam rangkaian bersama roti dan gandum panggang, kata ini menunjuk pada bulir yang segar atau baru matang, bukan nama tempat Karmel.
- source_word: לֹא תֹאכְלוּ
  choice: kamu tidak boleh makan
  rationale: Bentuk negatif ini berfungsi sebagai larangan hukum. 'Tidak boleh' menyampaikan kekuatan normatifnya secara alami dalam bahasa Indonesia modern.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: sampai hari itu juga
  rationale: עֶצֶם memberi penegasan pada hari yang dimaksud. Dalam konteks ini, 'hari itu juga' lebih alami daripada terjemahan harfiah 'hari ini juga' dan tetap mempertahankan tekanannya.
- source_word: עַד הֲבִיאֲכֶם
  choice: yaitu sampai kamu membawa
  rationale: Bentuk infinitif sesudah עַד menandai tindakan yang menjadi batas berakhirnya larangan. 'Yaitu' memperjelas bahwa frasa kedua menerangkan batas waktu yang pertama.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: persembahan bagi Allahmu
  rationale: קָרְבָּן adalah istilah umum bagi sesuatu yang dibawa mendekat sebagai persembahan. 'Bagi Allahmu' menyampaikan relasi genitif secara alami tanpa menentukan jenis kurbannya secara berlebihan.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan untuk selama-lamanya
  rationale: Ungkapan ini mempertahankan daya berlaku yang berkelanjutan dari hukum tersebut dan tetap wajar dalam register hukum-keagamaan Indonesia.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Idiom Indonesia yang alami untuk keberlanjutan melintasi generasi-generasi berikutnya.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: di mana pun kamu tinggal
  rationale: Menyampaikan bahwa ketetapan itu berlaku di semua tempat kediaman umat dengan bahasa modern yang langsung dipahami.
theological_decisions:
- issue: Daya berlaku חֻקַּת עוֹלָם dalam hukum Musa
  choice: ketetapan untuk selama-lamanya
  alternative: ketetapan tetap; ketetapan kekal
  rationale: Terjemahan mempertahankan kekuatan kewajiban yang berkelanjutan dalam kerangka hukum perjanjian Imamat, tanpa memutuskan perdebatan teologis yang lebih luas mengenai penerapan hukum seremonial Musa pada masa berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang bermartabat. Bentuk tunggal 'kamu/Allahmu' mengikuti sufiks orang kedua jamak Ibrani sebagai sapaan kolektif yang alami dalam bahasa Indonesia; 'turun-temurun' dan 'di mana pun kamu tinggal' menghindari kekakuan tanpa mengurangi cakupan hukum.
