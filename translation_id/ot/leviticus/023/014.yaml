- from: Kamu tidak boleh makan roti, gandum yang dipanggang, ataupun bulir gandum segar sampai hari itu juga, yaitu sampai kamu membawa persembahan bagi Allahmu. Inilah ketetapan untuk selama-lamanya[a] turun-temurun di mana pun kamu tinggal.
  to: Kamu tidak boleh makan roti, gandum sangrai, ataupun bulir gandum segar sampai tepat pada hari ini, sampai kamu membawa persembahan bagi Allahmu. Ini adalah ketetapan yang berlaku untuk selama-lamanya[a], turun-temurun di semua tempat tinggalmu.
