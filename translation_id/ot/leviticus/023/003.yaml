source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֤ת שַׁבָּתוֹן֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ שַׁבָּ֥ת הִוא֙ לַֽ/יהוָ֔ה בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: id
  text: Selama enam hari pekerjaan boleh dilakukan, tetapi pada hari ketujuh adalah Sabat, hari perhentian penuh[a], suatu pertemuan kudus. Janganlah kamu melakukan pekerjaan apa pun; hari itu adalah Sabat bagi Yahweh di semua tempat tinggalmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sabat perhentian” atau “Sabat, hari istirahat penuh.” Ungkapan Ibraninya menegaskan perhentian Sabat secara penuh.
    reason: lexical_alternative
  - marker: b
    text: Atau “di seluruh permukimanmu.” Kata Ibraninya dapat menunjuk pada tempat tinggal ataupun komunitas permukiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: pekerjaan boleh dilakukan
  rationale: Bentuk Nifal mempertahankan makna pasif, sedangkan 'boleh' menyampaikan nuansa permisif dalam konteks ketetapan hari kerja.
- source_word: מְלָאכָה
  choice: pekerjaan
  rationale: Istilah umum dan alami untuk pekerjaan dalam peraturan Sabat; pilihan ini juga menjaga konsistensi pada kedua kemunculannya.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabat perhentian penuh
  rationale: Gabungan kata Ibrani ini menguatkan gagasan berhenti atau beristirahat sepenuhnya, sambil tetap mempertahankan istilah 'Sabat'.
- source_word: מִקְרָא קֹדֶשׁ
  choice: suatu pertemuan kudus
  rationale: מִקְרָא menunjuk pada pertemuan yang diserukan atau dihimpunkan; 'pertemuan kudus' alami dalam bahasa Indonesia dan mempertahankan sifat sakralnya.
- source_word: לֹא תַעֲשׂוּ
  choice: Janganlah kamu melakukan pekerjaan apa pun
  rationale: Menyampaikan larangan langsung kepada orang kedua jamak dengan jelas dan bermartabat.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: hari itu adalah Sabat bagi Yahweh
  rationale: Kata 'hari itu' memperjelas acuan pronomina feminin הִוא kepada hari Sabat; 'bagi' mempertahankan arah atau peruntukan dalam preposisi ל tanpa mengubahnya menjadi kepemilikan semata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: di seluruh tempat kediamanmu
  rationale: מוֹשָׁב dapat berarti tempat tinggal atau permukiman; frasa ini ringkas dan sesuai dengan cakupan hukum tersebut.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: tetapi pada hari ketujuh
  rationale: Walaupun waw secara dasar berarti 'dan', 'tetapi' mengungkapkan kontras yang jelas antara enam hari kerja dan hari ketujuh tanpa menambah gagasan baru.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Kekuatan ungkapan שַׁבַּת שַׁבָּתוֹן
  choice: Sabat perhentian penuh
  alternative: Sabat, hari istirahat penuh; Sabat perhentian khidmat
  rationale: Pilihan ini menyampaikan penegasan atas penghentian kerja tanpa memasukkan penafsiran doktrinal tambahan.
- issue: Hubungan Sabat dengan Yahweh dalam לַיהוָה
  choice: Sabat bagi Yahweh
  alternative: Sabat milik Yahweh
  rationale: '''Bagi'' mempertahankan keluwesan relasi Ibrani—hari itu diarahkan, dikhususkan, atau diperuntukkan bagi Yahweh—tanpa membatasinya hanya pada kategori kepemilikan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum-keagamaan yang alami dan bermartabat. Bentuk 'janganlah' dipakai untuk larangan langsung, sedangkan 'kamu' dipertahankan tanpa penanda jamak karena bahasa Indonesia tidak selalu menandai jumlah; konteks ketetapan bagi umat menyediakan cakupan kolektif.
