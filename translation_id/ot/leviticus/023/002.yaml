  terminology: '"Yahweh", "waktu-waktu yang ditetapkan", dan "pertemuan-pertemuan kudus" merupakan pilihan yang dapat dipertahankan. Istilah terakhir menyampaikan unsur perhimpunan yang dipanggil serta kekudusannya. Catatan a dan b tepat; tidak diperlukan catatan tambahan untuk "anak-anak Israel", karena ungkapan itu dapat dipahami secara idiomatis sebagai umat Israel dalam bahasa Indonesia.'
