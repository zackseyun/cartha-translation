reference: Leviticus 23:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: id
  text: '“Berbicaralah kepada anak-anak Israel dan katakan kepada mereka: Waktu-waktu yang ditetapkan Yahweh[a], yang harus kamu maklumkan sebagai pertemuan-pertemuan kudus[b]—itulah waktu-waktu-Ku yang telah ditetapkan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “waktu-waktu perayaan yang ditetapkan” atau “hari-hari raya yang ditetapkan”; istilah Ibrani dapat menunjuk berbagai kesempatan suci yang telah ditentukan, bukan hanya pesta perjamuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “perhimpunan-perhimpunan suci.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Imperatif piel yang memerintahkan Musa untuk menyampaikan firman secara langsung; bentuk ini mempertahankan nada resmi konteks hukum.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Mempertahankan bentuk ungkapan perjanjian Ibrani secara wajar dalam bahasa Indonesia; secara kolektif merujuk kepada umat Israel.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: dan katakan kepada mereka
  rationale: Mencerminkan rangkaian perintah Ibrani dan mempertahankan irama resmi tuturan.
- source_word: מוֹעֲדֵי
  choice: waktu-waktu yang ditetapkan
  rationale: מוֹעֵד menunjuk waktu atau kesempatan yang ditentukan; cakupannya lebih luas daripada pesta atau hari raya, dan dalam konteks pasal ini juga mencakup hari Sabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi, bukan menggantinya dengan gelar.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: yang harus kamu maklumkan
  rationale: קרא dalam konteks ini berarti mengumumkan atau menetapkan secara terbuka; 'maklumkan' sesuai dengan suasana ibadah yang resmi.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: pertemuan-pertemuan kudus
  rationale: Mengungkapkan perkumpulan sakral yang diserukan atau dihimpunkan, dengan bahasa Indonesia yang alami dan mudah dipahami.
- source_word: אֵלֶּה הֵם
  choice: itulah
  rationale: Menyampaikan daya tunjuk dan penegasan konstruksi Ibrani secara alami dalam bahasa Indonesia.
- source_word: מוֹעֲדָי
  choice: waktu-waktu yang Kutetapkan
  rationale: Akhiran orang pertama tunggal dipertahankan melalui bentuk 'Ku-', sedangkan verba 'tetapkan' mengungkapkan nuansa waktu yang ditentukan tanpa menghilangkan kepemilikan dan otoritas Allah.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Nama pribadi dipertahankan dalam bentuk transliterasi yang lazim dalam kajian modern, tanpa menggantinya dengan gelar.
- issue: Apakah מוֹעֲדֵי dipersempit menjadi 'hari raya'
  choice: waktu-waktu yang ditetapkan
  alternative: hari-hari raya atau perayaan-perayaan
  rationale: Istilah Ibrani mencakup kesempatan suci yang ditentukan secara umum; konteks langsung memasukkan Sabat, sehingga istilah temporal yang lebih luas lebih tepat.
- issue: Cara menyampaikan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel atau bangsa Israel
  rationale: Bentuk ungkapan Ibrani dipertahankan tanpa menyimpulkan bahwa yang dimaksud hanya laki-laki; dalam pemakaiannya frasa ini menunjuk umat Israel secara kolektif.
- issue: Hubungan antara מוֹעֲדֵי יְהוָה dan מוֹעֲדָי
  choice: Mempertahankan pengulangan sebagai 'waktu-waktu yang ditetapkan Yahweh' dan 'waktu-waktu yang Kutetapkan'
  alternative: Menghaluskan pengulangan menjadi satu pernyataan
  rationale: Pengulangan menegaskan bahwa waktu-waktu tersebut adalah milik dan ketetapan Yahweh; struktur ini dipertahankan tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Maklumkan' dipilih untuk pengumuman resmi kepada umat; 'pertemuan-pertemuan kudus' lebih mudah dipahami pembaca umum daripada istilah teknis 'konvokasi kudus'. Pronomina 'kamu' mengikuti bentuk jamak sumber dan merujuk kepada umat yang diajak bicara.
