  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber serta padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר memperkenalkan peristiwa tutur baru. Dalam bahasa Indonesia Alkitabiah yang tetap modern, “berfirman” merupakan padanan wajar ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang dituju dalam tindakan berbicara; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: dihilangkan secara idiomatis sebelum kutipan
  rationale: Dalam rumus Ibrani yang secara harfiah berarti “untuk berkata”, unsur ini memperkenalkan isi firman pada ayat berikutnya. Bahasa Indonesia alami cukup memakai koma sesudah “berfirman kepada Musa”; makna pengantar kutipan tetap terpelihara tanpa ungkapan janggal “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut dan tidak mengubahnya menjadi gelar, sementara catatan kaki memberi tahu pembaca tentang bentuk Ibrani dan terjemahan tradisional.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. “Berfirman” mempertahankan corak formula ujaran ilahi tanpa terasa usang. Koma menandakan bahwa isi firman berlanjut pada ayat berikutnya.
