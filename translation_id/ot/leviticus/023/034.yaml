base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: id
  text: 'Katakanlah kepada orang Israel: Pada hari kelima belas bulan ketujuh ini berlangsung Perayaan Pondok-Pondok[a] bagi Yahweh selama tujuh hari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional disebut “Hari Raya Pondok Daun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Katakanlah kepada keturunan Israel
  rationale: Ungkapan perintah dan formula kutipan Ibrani dialihkan secara wajar ke dalam bahasa Indonesia. “Keturunan Israel” mempertahankan hubungan dengan ungkapan harfiah “anak-anak Israel” tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: Pada hari kelima belas bulan ketujuh ini
  rationale: Mempertahankan tanggal liturgis dan kata tunjuk “ini” dengan susunan yang alami dalam bahasa Indonesia.
- source_word: חַג הַסֻּכּוֹת
  choice: Perayaan Pondok-Pondok
  rationale: חַג menunjuk pada perayaan keagamaan, sedangkan bentuk jamak סֻכּוֹת berarti pondok-pondok atau tempat-tempat tinggal sementara. Pilihan ini transparan terhadap bentuk sumber dan menghindari istilah yang kurang dipahami pembaca masa kini.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Menyatakan durasi perayaan secara jelas dan idiomatis.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan bahwa perayaan itu diperuntukkan atau dipersembahkan bagi Yahweh; “bagi” mempertahankan nuansa peruntukan tanpa mempersempitnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama perjanjian. Bentuk “Yahweh” mempertahankan nama diri dalam sumber dan tidak menggantinya dengan gelar.
- issue: Nama perayaan סֻכּוֹת
  choice: Perayaan Pondok-Pondok
  alternative: Hari Raya Pondok Daun
  rationale: Terjemahan utama mencerminkan arti leksikal סֻכּוֹת sebagai pondok-pondok sementara. Nama Indonesia yang tradisional dicantumkan dalam catatan kaki agar tetap mudah dikenali tanpa memasukkan unsur “daun” ke dalam arti leksikal kata tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Susunan “diadakan ... selama tujuh hari” mengungkapkan secara alami klausa nominal Ibrani tanpa mengubahnya menjadi perintah langsung untuk merayakan. Tanda catatan kaki ditempatkan tepat setelah nama perayaan yang dijelaskannya.
