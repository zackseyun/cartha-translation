- from: Sebab setiap orang yang tidak merendahkan diri pada hari itu juga[a] akan dilenyapkan dari antara bangsanya.
  to: Sebab setiap orang yang tidak merendahkan diri pada hari itu sendiri[a] akan diputuskan dari antara bangsanya.
  rationale: Revisi mempertahankan padanan utama “merendahkan diri,” tetapi memperbaiki penegasan waktu dan terutama mengganti “dilenyapkan” dengan “diputuskan” agar formula sanksi Ibrani tetap ambigu. Catatan kaki diperbarui agar alternatif leksikal dapat dipahami dalam bahasa Indonesia modern tanpa menganggap puasa sebagai satu-satunya praktik yang dimaksud.
