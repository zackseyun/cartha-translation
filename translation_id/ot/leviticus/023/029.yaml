  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: id
  text: Sebab setiap orang yang tidak merendahkan diri pada hari itu sendiri[a] akan diputuskan dari antara bangsanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak menyangkal dirinya.” Idiom Ibrani ini secara harfiah dapat berarti “tidak menyusahkan atau menganiaya dirinya” dan mengacu pada penyangkalan atau perendahan diri, yang secara tradisional dikaitkan dengan puasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi perintah sebelumnya dan sesuai dengan alur penjelasan hukum.
- source_word: כָל הַנֶּפֶשׁ
  choice: setiap orang
  rationale: נֶפֶשׁ di sini menunjuk kepada seorang pribadi, bukan 'jiwa' sebagai istilah antropologis teknis.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: yang tidak merendahkan diri
  rationale: Bentuk ini dalam konteks Hari Pendamaian menyatakan tindakan merendahkan atau menyusahkan diri, yang secara tradisional berkaitan dengan puasa dan penyangkalan diri; pilihan utama mempertahankan sikap pertobatan tanpa membatasinya pada penderitaan jasmani.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: pada hari itu juga
  rationale: Ungkapan dengan עֶצֶם memberi penegasan waktu; frasa Indonesia ini menyampaikan bahwa yang dimaksud adalah tepat pada hari tersebut.
- source_word: וְנִכְרְתָה
  choice: akan dilenyapkan
  rationale: Menyampaikan bobot sanksi hukum-perjanjian dari כרת tanpa menetapkan mekanismenya secara lebih khusus daripada teks Ibrani.
- source_word: מֵעַמֶּיהָ
  choice: dari antara bangsanya
  rationale: Akhiran feminin mengikuti kata benda נֶפֶשׁ secara gramatikal, tetapi acuannya generik; bentuk Indonesia tidak perlu menandai gender dan 'dari antara bangsanya' mempertahankan relasi komunal.
theological_decisions:
- issue: Makna perintah Hari Pendamaian untuk 'merendahkan/menyusahkan' diri
  choice: Merendahkan diri dalam teks utama
  alternative: Menyusahkan diri; menyangkal diri
  rationale: Idiom Ibrani mencakup perendahan dan penyangkalan diri yang berkaitan dengan pertobatan serta puasa. Pilihan ini alami dalam bahasa Indonesia dan tidak menyempitkan maknanya menjadi penderitaan fisik saja; alternatif formal dicatat dalam catatan kaki.
- issue: Sifat hukuman yang dinyatakan oleh וְנִכְרְתָה
  choice: Akan dilenyapkan dari antara bangsanya tanpa menjelaskan mekanismenya
  alternative: Akan disingkirkan; akan dikucilkan
  rationale: Teks tidak menentukan apakah sanksi itu berupa kematian, pengusiran, atau penghukuman langsung oleh Allah. Rumusan ini mempertahankan bobot dan ketegangan teologisnya tanpa menyelesaikan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum-keagamaan yang lugas dan bermartabat. Struktur kalimat mempertahankan hubungan sebab-akibat, penegasan waktu, serta ketidakjelasan yang disengaja mengenai mekanisme sanksi.
