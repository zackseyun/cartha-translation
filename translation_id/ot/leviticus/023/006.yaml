id: LEV.23.6
reference: Leviticus 23:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: id
  text: Pada hari kelima belas bulan ini adalah Hari Raya Roti Tidak Beragi bagi Yahweh[a]. Selama tujuh hari kamu harus makan roti tidak beragi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk Yahweh.” Preposisi Ibrani dapat menyatakan peruntukan atau kepunyaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Pada hari kelima belas
  rationale: Ungkapan penanggalan Ibrani ini secara idiomatis menunjuk pada hari kelima belas; kata sambung וּ tidak perlu diterjemahkan secara mekanis pada awal ayat agar bahasa Indonesia tetap alami.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: bulan ini
  rationale: Dalam konstruksi tanggal, frasa ini secara alami berarti hari tertentu dalam bulan yang sedang dibicarakan.
- source_word: חַג הַמַּצּוֹת
  choice: Hari Raya Roti Tidak Beragi
  rationale: חַג menunjuk pada perayaan keagamaan, sedangkan הַמַּצּוֹת membentuk nama perayaan tersebut. 'Hari Raya' merupakan istilah Indonesia yang wajar dan bermartabat untuk festival sakral.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל dapat menyatakan peruntukan, pengabdian, atau kepunyaan. 'Bagi' mempertahankan keluasan hubungan itu, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: שִׁבְעַת יָמִים
  choice: Selama tujuh hari
  rationale: Frasa ini menyatakan durasi tindakan makan.
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Bentuk jamak Ibrani menunjuk pada jenis makanan berupa roti tanpa ragi; bahasa Indonesia lazim memakai bentuk kolektif tunggal.
- source_word: תֹּאכֵלוּ
  choice: kamu harus makan
  rationale: Bentuk imperfek dalam konteks hukum berfungsi sebagai ketetapan. 'Harus' menyampaikan daya preskriptifnya secara jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memuat nama ilahi יהוה. Bentuk 'Yahweh' mempertahankan nama perjanjian secara langsung tanpa menggantinya dengan gelar.
- issue: Hubungan perayaan dengan Yahweh dalam לַיהוָה
  choice: bagi Yahweh
  alternative: untuk Yahweh
  rationale: Preposisi ל dapat menandai peruntukan atau kepunyaan. 'Bagi' menjaga ambiguitas yang wajar antara perayaan yang dipersembahkan kepada Yahweh dan perayaan yang menjadi milik-Nya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama resmi perayaan ditulis dengan huruf kapital. Susunan dibagi menjadi dua kalimat agar ketetapan tanggal dan perintah tujuh hari mudah dipahami tanpa mengubah hubungan maknanya.
