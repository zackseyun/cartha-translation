base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: id
  text: Kalian harus mempersembahkan seekor kambing jantan sebagai kurban penghapus dosa[a], dan dua ekor anak domba jantan berumur satu tahun sebagai kurban keselamatan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban persekutuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Kamu harus mempersembahkan
  rationale: Secara harfiah berarti 'melakukan/membuat', tetapi dalam konteks penetapan kurban, 'mempersembahkan' menyampaikan maksud kultisnya secara alami dalam bahasa Indonesia.
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: seekor kambing jantan
  rationale: Frasa ini menunjuk pada satu kambing berkelamin jantan; 'seekor' menyatakan jumlah sekaligus memakai penggolong hewan yang alami.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: חַטָּאת adalah istilah bagi kategori kurban yang berkaitan dengan dosa dan pemurnian. Pilihan utama ini mudah dipahami, sedangkan nuansa alternatif 'kurban pemurnian' dipertahankan dalam catatan kaki.
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: dan dua ekor anak domba jantan
  rationale: כְבָשִׂים menunjuk pada anak-anak domba dan dalam ketentuan kurban ini dipahami sebagai jantan; jenis kelaminnya dinyatakan agar spesifikasi kurban tetap jelas.
- source_word: בְּנֵי שָׁנָה
  choice: berumur satu tahun
  rationale: Ungkapan Ibrani ini secara idiomatis menyatakan umur hewan satu tahun.
- source_word: לְזֶבַח שְׁלָמִים
  choice: sebagai kurban keselamatan
  rationale: זֶבַח שְׁלָמִים adalah nama kategori kurban sembelihan. 'Kurban keselamatan' dekat dengan akar gagasan שׁלם tanpa mempersempitnya hanya pada persekutuan; alternatif 'kurban persekutuan' dicatat.
theological_decisions:
- issue: Makna חַטָּאת dalam hukum kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani dapat menonjolkan kaitan dengan dosa maupun fungsi pemurnian. Teks utama memakai istilah yang lazim dan mudah dipahami, sementara alternatif dipertahankan agar perdebatan tentang fungsi kurban tidak diselesaikan secara sepihak.
- issue: Makna שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan
  rationale: Istilah Ibrani memiliki cakupan yang berhubungan dengan damai, kesejahteraan, dan persekutuan. 'Kurban keselamatan' mempertahankan sebutan kategori yang dekat dengan bentuk sumber, sementara tafsiran relasional 'persekutuan' disajikan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk jamak Ibrani pada שְׁלָמִים tidak dibuat kaku dalam bahasa Indonesia karena nama kategori kurban secara alami berbentuk tunggal; dua ekor hewan tetap dinyatakan dengan jelas.
