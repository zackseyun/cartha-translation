source:
  edition: WLC
  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: id
  text: Pada bulan pertama, pada hari keempat belas bulan itu, pada waktu senja[a], adalah Paskah[b] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di antara dua petang,” suatu ungkapan Ibrani untuk waktu senja di sekitar matahari terbenam.
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan Paskah” atau “kurban Paskah.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Pada bulan pertama
  rationale: Dalam konteks penanggalan, חֹדֶשׁ berarti “bulan”; bersama kata bilangan bertingkat הָרִאשׁוֹן, frasa ini menunjuk bulan pertama dalam kalender peribadatan.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: pada hari keempat belas bulan itu
  rationale: Bahasa Ibrani menyatakan tanggal secara harfiah sebagai “pada empat belas bulan itu.” Penambahan “hari” menghasilkan ungkapan Indonesia yang jelas dan wajar tanpa mengubah ketepatan tanggal.
- source_word: בֵּין הָעַרְבָּיִם
  choice: pada waktu senja
  rationale: Ungkapan Ibrani ini secara harfiah berarti “di antara kedua petang” dan menunjuk waktu senja di sekitar matahari terbenam. Terjemahan utama dibuat alami, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki karena dapat berpengaruh pada pembahasan waktu Paskah.
- source_word: פֶּסַח
  choice: Paskah
  rationale: פֶּסַח dapat menunjuk perayaan atau ritus Paskah maupun kurban Paskah. “Paskah” mempertahankan cakupan yang luas, sementara kemungkinan makna kurban dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan atau pengabdian. “Bagi Yahweh” alami dalam bahasa Indonesia dan menyatakan bahwa Paskah itu dikhususkan bagi-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Makna פֶּסַח dalam konteks ibadah
  choice: Paskah
  alternative: persembahan Paskah; kurban Paskah
  rationale: Istilah Ibrani dapat merujuk pada perayaan/ritus atau pada hewan kurbannya. Teks utama tidak mempersempit maknanya, dan kemungkinan makna kurban disajikan dalam catatan kaki.
- issue: Klausa nominal tanpa kata kerja eksplisit
  choice: diadakan Paskah
  alternative: adalah Paskah
  rationale: Bahasa Ibrani tidak memuat kata kerja eksplisit. “Diadakan” menghasilkan kalimat Indonesia yang wajar dalam konteks kalender perayaan tanpa menetapkan bahwa פֶּסַח hanya berarti pesta; ambiguitas istilah tersebut tetap dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan keterangan waktu mempertahankan ketepatan kalender teks Ibrani. “Diadakan” dipakai agar klausa nominal Ibrani terbaca alami, sedangkan catatan kaki mempertahankan ambiguitas leksikal dan arti harfiah yang penting.
