review_pass:
  verdict: revise
  source_fidelity: Terjemahan dengan tepat menyampaikan durasi tujuh hari, dua perintah untuk mempersembahkan אִשֶּׁה kepada Yahweh, pertemuan kudus pada hari kedelapan, dan larangan melakukan pekerjaan rutin/biasa. “Persembahan yang dibakar dengan api” merupakan padanan yang dapat dipertahankan bagi istilah kurban teknis אִשֶּׁה. Namun, “penutup” dalam terjemahan עֲצֶרֶת menambahkan secara eksplisit suatu nuansa yang tidak dinyatakan oleh kata Ibrani itu sendiri dan yang penjelasan tepatnya diperdebatkan.
  naturalness: Bahasa Indonesia baku, jelas, dan sesuai register peraturan ibadah. “Pertemuan kudus,” “pertemuan khidmat,” dan “pekerjaan rutin” terbaca alami. Mengganti “Hari itu adalah pertemuan penutup yang khidmat” dengan “Itu adalah pertemuan khidmat” juga lebih langsung dan tidak memaksakan keterangan tambahan.
  terminology: “Yahweh” mempertahankan nama ilahi יהוה secara konsisten. “Pertemuan kudus” tepat bagi מִקְרָא־קֹדֶשׁ. Untuk עֲצֶרֶת, “pertemuan khidmat” mempertahankan fungsi pertemuan khusus tanpa menentukan bahwa makna leksikalnya adalah “penutup.” Catatan kaki diperbaiki agar alternatifnya tidak menyatakan secara terlalu sempit bahwa אִשֶּׁה pasti berarti persembahan makanan.
  issues:
  - severity: medium
    issue: “pertemuan penutup yang khidmat” untuk עֲצֶרֶת
    rationale: Walaupun hari kedelapan memang berfungsi sebagai penutup rangkaian perayaan dalam konteksnya, unsur “penutup” bukanlah makna yang perlu atau tidak terbantahkan dari עֲצֶרֶת. Terjemahan sebaiknya tidak mengunci interpretasi tersebut.
  - severity: low
    issue: Catatan kaki menyebut alternatif “persembahan berupa makanan”
    rationale: Alternatif itu dapat memberi kesan bahwa אִשֶּׁה menentukan bahan persembahan sebagai makanan. Istilah tersebut adalah istilah kurban teknis yang lazim berkaitan dengan persembahan melalui api; penjelasan catatan kaki perlu mempertahankan ketelitian itu.
  revised_text: Selama tujuh hari kamu harus mempersembahkan persembahan yang dibakar dengan api kepada Yahweh.[a] Pada hari kedelapan, kamu harus mengadakan pertemuan kudus dan mempersembahkan persembahan yang dibakar dengan api kepada Yahweh. Itu adalah pertemuan khidmat; kamu tidak boleh melakukan pekerjaan rutin.
