  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: id
  text: Selama tujuh hari kamu harus mempersembahkan persembahan yang dibakar dengan api kepada Yahweh.[a] Pada hari kedelapan, kamu harus mengadakan pertemuan kudus dan mempersembahkan persembahan yang dibakar dengan api kepada Yahweh. Itu adalah pertemuan khidmat; kamu tidak boleh melakukan pekerjaan rutin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “persembahan sajian.” Kata Ibrani אִשֶּׁה adalah istilah kurban teknis bagi persembahan yang dipersembahkan melalui api.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Selama tujuh hari
  rationale: Mengungkapkan durasi kewajiban secara wajar dalam bahasa Indonesia.
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: kamu harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks peribadatan berarti membawa atau menyajikan sesuatu sebagai persembahan; 'mempersembahkan' alami dan tepat dalam bahasa Indonesia.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar dengan api
  rationale: Istilah teknis keimaman ini menunjuk pada persembahan yang disajikan melalui api. Terjemahan ini mempertahankan unsur api tanpa menentukan jenis kurban secara lebih sempit daripada teks.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan persembahan, sedangkan nama perjanjian יהוה dipertahankan sebagai 'Yahweh'.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Ungkapan tetap untuk pertemuan keagamaan yang diserukan secara resmi; 'pertemuan kudus' jelas dan alami bagi pembaca modern.
- source_word: עֲצֶרֶת
  choice: pertemuan penutup yang khidmat
  rationale: Dalam konteks hari kedelapan, istilah ini menunjuk pada pertemuan khusus yang menutup rangkaian hari raya dan berciri penahanan diri atau kekhidmatan.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan rutin
  rationale: Ungkapan ini melarang pekerjaan kerja biasa dalam perayaan, bukan menyatakan bahwa setiap kegiatan tanpa kecuali dilarang.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה. Bentuk 'Yahweh' mempertahankan nama perjanjian itu secara langsung.
- issue: Makna teknis אִשֶּׁה
  choice: persembahan yang dibakar dengan api
  alternative: persembahan berupa makanan
  rationale: Unsur api paling jelas ditandai oleh bentuk dan pemakaian istilah Ibrani ini. Alternatif 'persembahan berupa makanan' mencerminkan fungsi persembahan dalam sistem kurban, tetapi dapat terdengar lebih spesifik daripada kata ini sendiri.
- issue: Nuansa עֲצֶרֶת
  choice: pertemuan penutup yang khidmat
  alternative: pertemuan khidmat; pertemuan khusus
  rationale: Konteks hari kedelapan mendukung fungsi penutup, sementara unsur kekhidmatan atau penahanan diri tetap dipertahankan tanpa menjadikannya istilah denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kamu' mengikuti sapaan jamak kepada umat dalam konteks hukum. Istilah peribadatan dibuat jelas tanpa memakai kosakata denominasi tertentu.
