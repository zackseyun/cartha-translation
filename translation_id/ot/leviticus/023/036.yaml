revisions:
- from: Selama tujuh hari kamu harus mempersembahkan persembahan yang dibakar dengan api kepada Yahweh.[a] Pada hari kedelapan, kamu harus mengadakan pertemuan kudus dan mempersembahkan persembahan yang dibakar dengan api kepada Yahweh. Hari itu adalah pertemuan penutup yang khidmat; kamu tidak boleh melakukan pekerjaan rutin.
  to: Selama tujuh hari kamu harus mempersembahkan persembahan yang dibakar dengan api kepada Yahweh.[a] Pada hari kedelapan, kamu harus mengadakan pertemuan kudus dan mempersembahkan persembahan yang dibakar dengan api kepada Yahweh. Itu adalah pertemuan khidmat; kamu tidak boleh melakukan pekerjaan rutin.
  rationale: Revisi menghilangkan “penutup,” yang merupakan penjelasan kontekstual tetapi tidak perlu dimasukkan ke dalam terjemahan עֲצֶרֶת, sehingga ambiguitas leksikal sumber tetap terjaga. Catatan kaki juga diperjelas agar alternatif leksikal tidak membatasi jenis persembahan melampaui istilah Ibrani.
