  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: id
  text: Janganlah kamu melakukan pekerjaan biasa apa pun, dan kamu harus mempersembahkan persembahan melalui api[a] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “persembahan makanan.” Ibrani: “persembahan api” atau “persembahan melalui api.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: Janganlah kamu melakukan ... apa pun
  rationale: Susunan larangan ini menyatakan larangan menyeluruh. Bentuk Indonesia ini alami dan tetap mempertahankan sapaan orang kedua jamak yang dapat diwakili oleh “kamu” secara kolektif.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan berat
  rationale: Frasa ini menunjuk pada pekerjaan atau jerih payah biasa yang dilarang pada hari kudus, bukan setiap tindakan tanpa kecuali. “Pekerjaan berat” merupakan ungkapan Indonesia yang jelas dan tidak memakai istilah kuno.
- source_word: וְהִקְרַבְתֶּם
  choice: dan kamu harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa atau menghadirkan sesuatu sebagai persembahan. “Mempersembahkan” menyampaikan tindakan ritual itu secara alami.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Istilah keimaman ini menunjuk pada persembahan yang diserahkan melalui api. Pilihan ini mempertahankan kaitan dengan api tanpa menyiratkan bahwa persembahan itu pasti kurban hewan atau seluruhnya dibakar.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan bahwa persembahan itu ditujukan kepada Yahweh; “bagi” alami dalam bahasa Indonesia. Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi. “Yahweh” mempertahankan nama tersebut secara langsung tanpa menggantinya dengan gelar.
- issue: Makna istilah kultis אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan melalui api; persembahan makanan
  rationale: Hubungan etimologis dan cakupan tepat istilah ini diperdebatkan. Teks utama mempertahankan unsur persembahan melalui pembakaran, sedangkan catatan kaki mencatat padanan lain yang banyak dipakai tanpa menetapkan satu penjelasan teologis secara mutlak.
translation_notes:
  register: Bahasa hukum-keagamaan yang modern dan bermartabat. “Janganlah” mempertahankan nada larangan resmi, sedangkan struktur kalimat tetap mudah dipahami pembaca umum. Penanda catatan kaki ditempatkan sesudah istilah אִשֶּׁה yang diterangkannya.
