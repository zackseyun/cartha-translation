id: LEV.23.13
reference: Leviticus 23:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: id
  text: Persembahan sajiannya haruslah dua persepuluh efa tepung halus yang dicampur dengan minyak, suatu persembahan yang dibakar[a] bagi Yahweh, suatu aroma yang menyenangkan; dan persembahan curahannya haruslah anggur, seperempat hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “suatu persembahan melalui api bagi Yahweh.”'
    reason: Alternatif leksikal untuk istilah teknis Ibrani אִשֶּׁה.
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: Persembahan sajian yang menyertainya
  rationale: Dalam konteks kurban, מִנְחָה menunjuk pada persembahan berbahan gandum. Sufiks orang ketiga tunggal merujuk pada anak domba di ayat sebelumnya; frasa 'yang menyertainya' menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dua persepuluh efa
  rationale: Ungkapan Ibrani secara harfiah berarti 'dua bagian sepersepuluh'; dalam peraturan keimaman, satuan yang tersirat ialah efa.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Padanan baku dan jelas untuk tepung olahan bermutu yang dipakai dalam persembahan.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif menunjukkan bahwa tepung tersebut dicampurkan dengan minyak.
- source_word: אִשֶּׁה לַיהוָה
  choice: suatu persembahan yang dibakar bagi Yahweh
  rationale: אִשֶּׁה adalah istilah teknis bagi persembahan yang dipersembahkan melalui api. Terjemahan ini mempertahankan unsur api tanpa menyimpulkan bahwa istilah tersebut semata-mata berarti makanan.
- source_word: רֵיחַ נִיחֹחַ
  choice: dengan aroma yang menyenangkan
  rationale: Ungkapan kurban yang tetap ini menggambarkan aroma yang berkenan; pilihan ini mempertahankan metaforanya dalam bahasa Indonesia modern.
- source_word: וְנִסְכֹּה
  choice: dan persembahan curahannya
  rationale: נֶסֶךְ menunjuk pada persembahan cair yang dicurahkan. Sufiksnya kembali merujuk pada kurban yang disebut sebelumnya.
- source_word: יַיִן
  choice: anggur
  rationale: Padanan langsung yang dalam konteks persembahan curahan berarti minuman anggur.
- source_word: רְבִיעִת הַהִין
  choice: seperempat hin
  rationale: Pecahan diterjemahkan secara alami, sedangkan nama satuan kuno 'hin' dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan mengikuti keputusan teologis proyek yang diberikan.
- issue: Makna istilah kurban אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan makanan; persembahan melalui api
  rationale: Istilah ini berkaitan dengan persembahan yang disampaikan lewat api, tetapi etimologi dan nuansa tepatnya diperdebatkan. Teks utama memakai ungkapan yang alami, sementara catatan mempertahankan alternatif yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual 'persembahan sajian' dan 'persembahan curahan' dipakai secara konsisten; satuan kuno efa dan hin dipertahankan. Penanda catatan kaki [a] ditempatkan langsung pada frasa terkait.
