  naturalness: Bahasa draft baku dan mudah dipahami. Revisi kecil memperjelas struktur nominal Ibrani dan hubungan antara persembahan serta aroma tanpa membuatnya kurang alami.
  terminology: “Persembahan sajian,” “tepung halus,” “efa,” “persembahan curahan,” dan “hin” sesuai. “Persembahan yang dibakar” layak untuk אִשֶּׁה, dengan alternatif “persembahan melalui api” dipertahankan dalam catatan kaki. Nama Yahweh konsisten dengan keputusan proyek.
