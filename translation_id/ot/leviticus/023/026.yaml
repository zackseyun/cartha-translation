  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Yahweh berfirman kepada Musa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; dapat juga ditransliterasikan “Yehuwa”.'
    reason: Menjelaskan bentuk nama ilahi dalam bahasa Ibrani dan alternatif transliterasinya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat untuk tindakan Allah berbicara serta cocok dengan rumusan pengantar perkataan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan perkataan dan secara alami diterjemahkan “kepada”.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk nama yang baku dan luas dikenal dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam rumusan Ibrani, infinitif ini memperkenalkan isi perkataan yang menyusul. Setelah verba Indonesia “berfirman”, menerjemahkannya lagi sebagai “demikian” atau “kata-Nya” terasa berulang; tanda koma secara alami mengantar kutipan pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar; catatan kaki memberi tahu pembaca tentang bentuk Ibraninya dan alternatif transliterasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Berfirman” mempertahankan corak formula pengantar perkataan ilahi, sedangkan penghilangan padanan tersendiri bagi לֵאמֹר menghindari pengulangan yang tidak alami dalam bahasa Indonesia.
