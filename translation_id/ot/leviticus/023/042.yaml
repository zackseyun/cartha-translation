  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: id
  text: Kamu harus tinggal di pondok-pondok selama tujuh hari[a]; setiap orang Israel yang lahir di Israel harus tinggal di pondok-pondok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “naungan sementara”; kata Ibrani yang diterjemahkan “pondok-pondok” menunjuk pada naungan sementara untuk perayaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: di pondok-pondok
  rationale: סֻכּוֹת menunjuk pada bangunan perlindungan sementara yang digunakan dalam perayaan ini. 'Pondok-pondok' mempertahankan gambaran konkretnya dan wajar dalam bahasa Indonesia.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: harus tinggal
  rationale: Dalam konteks tempat kediaman, ישׁב berarti tinggal atau berdiam, bukan sekadar duduk. 'Tinggal' alami dalam bahasa Indonesia modern, sedangkan 'harus' menyampaikan daya perintah bentuk imperfek dalam konteks hukum.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: '''Selama'' menyatakan rentang waktu secara alami dan tepat.'
- source_word: כָּל הָאֶזְרָח
  choice: setiap orang Israel asli
  rationale: אֶזְרָח menunjuk pada anggota asli komunitas, berbeda dari pendatang. Ungkapan ini menghindari kategori politis modern yang dapat tersirat oleh 'warga negara' dan tidak membatasi cakupannya hanya pada laki-laki.
- source_word: בְּיִשְׂרָאֵל
  choice: Israel
  rationale: Dalam susunan 'orang Israel asli', hubungan dengan komunitas Israel disampaikan secara alami tanpa terjemahan kaku 'di dalam Israel'.
theological_decisions:
- issue: Cakupan generik kata הָאֶזְרָח yang secara gramatikal maskulin
  choice: setiap orang Israel asli
  alternative: setiap laki-laki Israel asli
  rationale: Bentuk maskulin tunggal memiliki daya perwakilan dan tidak dengan sendirinya membatasi perintah ini kepada laki-laki. 'Setiap orang' mempertahankan cakupan generiknya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina jamak 'kalian' memperjelas bahwa תֵּשְׁבוּ ditujukan kepada orang banyak; pengulangan 'harus tinggal di pondok-pondok' dipertahankan mengikuti penekanan teks Ibrani.
