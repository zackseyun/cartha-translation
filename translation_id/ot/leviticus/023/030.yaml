    issue: Objek kedua “orang itu” tidak diterjemahkan secara eksplisit.
    rationale: 'Teks Ibrani mengulangi subjek sebagai objek langsung: “Aku akan membinasakan orang itu.” Menambahkannya meningkatkan kesetiaan dan kejelasan tanpa mengubah makna.'
  - severity: low
    issue: “Tepat pada hari ini” kurang idiomatis untuk penegasan temporal dalam konteks hukum kuno.
    rationale: “Pada hari itu juga” lebih alami untuk בְּעֶצֶם הַיּוֹם הַזֶּה dan mempertahankan makna “pada hari yang sama/itu sendiri.”
  - severity: medium
    issue: Penjelasan leksikal dalam catatan kaki tentang “melenyapkan” tidak cukup cermat.
    rationale: אבד sendiri dapat diterjemahkan “melenyapkan.” Kontras yang relevan ialah dengan verba כרת, bukan dengan satu padanan Indonesia tertentu.
