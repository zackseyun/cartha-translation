source:
  edition: WLC
  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: id
  text: Setiap orang yang melakukan pekerjaan apa pun pada hari itu juga, orang itu akan Kubinasakan dari tengah-tengah bangsanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan Kusingkirkan orang itu dari antara bangsanya.” Verba Ibrani di sini berarti “membinasakan/menyebabkan binasa,” bukan verba yang lazim dipakai dalam rumusan “memutuskan dari antara bangsanya”; namun, dalam konteks ini keduanya dapat menyatakan penyingkiran melalui hukuman.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: orang
  rationale: Dalam prosa hukum-perjanjian, נֶפֶשׁ di sini menunjuk kepada seorang individu, bukan secara khusus kepada jiwa yang tidak berwujud. 'Orang' alami dan tepat untuk kedua kemunculannya.
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: melakukan pekerjaan apa pun
  rationale: Dengan מְלָאכָה, verba עשה menyatakan melakukan pekerjaan; 'apa pun' mempertahankan cakupan menyeluruh כָּל.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: tepat pada hari ini
  rationale: Ungkapan עֶצֶם הַיּוֹם menegaskan waktu yang dimaksud. 'Tepat pada hari ini' mempertahankan penekanannya dalam bahasa Indonesia alami.
- source_word: וְהַאֲבַדְתִּי
  choice: akan Kubinasakan
  rationale: Bentuk Hifil dari אבד berarti menyebabkan binasa atau membinasakan. Pilihan ini mencerminkan verba sumber dengan lebih langsung daripada istilah teknis 'melenyapkan' atau 'memutuskan'.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: dari tengah-tengah bangsanya
  rationale: Ungkapan ini menyatakan penyingkiran dari lingkungan umat atau bangsa orang tersebut. Sufiks feminin secara gramatikal mengikuti נֶפֶשׁ, sedangkan '-nya' dalam bahasa Indonesia wajar dan netral gender.
theological_decisions:
- issue: Sifat hukuman dalam וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ
  choice: akan Kubinasakan dari tengah-tengah bangsanya
  alternative: akan Kusingkirkan dari antara bangsanya
  rationale: Teks memakai bentuk Hifil אבד, 'membinasakan/menyebabkan binasa', bukan verba כרת yang lazim berarti 'melenyapkan/memutuskan'. Terjemahan utama mempertahankan daya verba sumber, sedangkan catatan kaki menjaga kemungkinan nuansa penyingkiran dalam penghakiman tanpa menentukan mekanisme hukumannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Inversi 'akan Kubinasakan' menjaga penekanan pada tindakan ilahi serta membuat rujukan 'orang' tetap jelas. Istilah 'bangsanya' dipilih untuk עַם tanpa memasukkan tafsiran denominatif mengenai bentuk khusus hukumannya.
