  verdict: revise
  source_fidelity: 'Terjemahan utama pada dasarnya setia pada Ibrani: נֶפֶשׁ tepat sebagai “orang,” כָּל־מְלָאכָה sebagai “pekerjaan apa pun,” dan Hifil אבד sebagai “Kubinasakan.” Namun, objek kedua yang eksplisit dalam teks sumber (הַנֶּפֶשׁ הַהִוא, “orang itu”) sebaiknya diterjemahkan. “Pada hari itu juga” menangkap penegasan עֶצֶם הַיּוֹם dengan lebih wajar dalam konteks naratif/hukum kuno daripada “tepat pada hari ini.”'
  naturalness: Susunan revisi tetap baku, jelas, dan bermartabat. Pengulangan “orang itu” alami dalam gaya hukum serta memperjelas bahwa tindakan ilahi ditujukan kepada pelaku yang disebutkan.
  terminology: “Bangsa” layak untuk עַם dalam konteks ini. Catatan kaki perlu diperbaiki agar tidak menyatakan bahwa verba yang lazim diterjemahkan “melenyapkan” tidak digunakan, karena “melenyapkan” dapat pula menerjemahkan אבד. Perbedaannya adalah bahwa teks ini tidak memakai verba teknis/rutin כרת, yang dapat dinyatakan sebagai “memutuskan” dalam formula pengucilan.
  issues:
