  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/לְּ/בַ֖ד שַׁבְּתֹ֣ת יְּהוָ֑ה וּ/מִ/לְּ/בַ֣ד מַתְּנֽוֹתֵי/כֶ֗ם וּ/מִ/לְּ/בַ֤ד כָּל נִדְרֵי/כֶם֙ וּ/מִ/לְּ/בַד֙ כָּל נִדְב֣וֹתֵי/כֶ֔ם אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: id
  text: di samping[a] hari-hari Sabat Yahweh[b], di samping pemberianmu, di samping semua nazarmu, dan di samping semua persembahan sukarelamu yang kamu berikan kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “terlepas dari” atau, sesuai konteks, “sebagai tambahan pada”; hal yang sama berlaku pada setiap pengulangan “di samping” dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Sabat-Sabat Yahweh”; dapat juga diungkapkan “hari-hari Sabat milik Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: di samping
  rationale: Ungkapan ini menunjukkan bahwa hal-hal yang disebutkan merupakan tambahan pada ketetapan hari raya sebelumnya. Pengulangan “di samping” mempertahankan struktur dan penekanan teks Ibrani, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: שַׁבְּתֹת יְהוָה
  choice: hari-hari Sabat Yahweh
  rationale: Bentuk jamak שַׁבְּתֹת dipertahankan dengan “hari-hari Sabat”, sedangkan hubungan konstruksi dengan nama ilahi diterjemahkan secara langsung.
- source_word: מַתְּנוֹתֵיכֶם
  choice: pemberianmu
  rationale: Kata ini merujuk secara luas pada sesuatu yang diberikan kepada Allah. “Pemberianmu” alami dan tidak mempersempit maknanya menjadi satu jenis persembahan tertentu.
- source_word: כָּל נִדְרֵיכֶם
  choice: semua nazarmu
  rationale: נֶדֶר dapat menunjuk pada nazar atau sesuatu yang dinazarkan. “Nazar” mempertahankan istilah keagamaan yang sudah lazim tanpa menambahkan kata “persembahan” yang hanya tersirat dari konteks.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: semua persembahan sukarelamu
  rationale: Dalam konteks ibadah dan korban, נְדָבָה menunjuk pada persembahan yang diberikan secara sukarela. Pilihan ini lebih jelas daripada sekadar “pemberian sukarela”.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: yang kamu berikan kepada Yahweh
  rationale: “Berikan” menyampaikan arti biasa נתן dengan lugas. Klausa relatif ditempatkan sesudah unsur terakhir sebagaimana dalam bahasa Ibrani, tanpa memperjelas secara berlebihan apakah cakupannya hanya unsur terakhir atau seluruh daftar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai “Yahweh”, mempertahankan nama perjanjian yang muncul langsung dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi dan mengikuti kebijakan proyek tanpa menggantinya dengan gelar.
- issue: Cakupan klausa relatif אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: Dibiarkan mengikuti unsur terakhir tanpa penjelasan tambahan dalam teks utama
  alternative: Menata ulang kalimat agar klausa itu secara tegas mencakup seluruh daftar
  rationale: Susunan Ibrani memungkinkan klausa tersebut dipahami berkaitan erat dengan persembahan sukarela, sementara konteks dapat memperluas cakupannya kepada pemberian yang disebutkan. Terjemahan mempertahankan ketegangan sintaksis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan frasa dipertahankan untuk mencerminkan irama daftar dalam bahasa Ibrani. “Hari-hari Sabat” dipakai agar bentuk jamaknya jelas dan tetap alami.
