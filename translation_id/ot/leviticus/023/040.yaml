language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: id
  text: Pada hari pertama, ambillah bagi kalian buah dari pohon yang elok[a], pelepah-pelepah pohon kurma, ranting-ranting pohon yang rimbun, dan pohon-pohon dedalu di tepi aliran air. Bersukacitalah di hadapan Yahweh, Allah kalian, selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, menurut tradisi Yahudi kemudian, “buah sitrun” (etrog). Secara harfiah, frasa Ibrani ini berbicara tentang “buah dari pohon yang elok atau indah.”
    reason: Menjaga kemungkinan identifikasi tradisional dengan etrog sambil menjelaskan bahwa ungkapan Ibrani sendiri lebih umum.
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: ambillah bagi kalian
  rationale: Bentuk verbal ini berdaya perintah dalam konteks hukum. Imperatif Indonesia menyampaikan daya tersebut secara alami, sedangkan “bagi kalian” mempertahankan לָכֶם.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: pada hari pertama
  rationale: Terjemahan temporal langsung tanpa menambahkan “perayaan,” yang hanya tersirat oleh konteks.
- source_word: פְּרִי עֵץ הָדָר
  choice: buah dari pohon-pohon yang elok
  rationale: הָדָר mengungkapkan keelokan, kemegahan, atau keindahan. Terjemahan umum ini mempertahankan keluasan frasa Ibrani dan tidak memasukkan identifikasi etrog dari tradisi kemudian ke dalam teks utama.
- source_word: כַּפֹּת תְּמָרִים
  choice: pelepah-pelepah pohon kurma
  rationale: כַּפֹּת dalam frasa ini menunjuk pada bagian berdaun dari pohon kurma; “pelepah” merupakan istilah Indonesia yang alami dan tepat.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: ranting-ranting pohon yang rimbun
  rationale: עָבֹת menyatakan ketebalan atau kerapatan, kemungkinan besar kerapatan dedaunan. “Rimbun” menyampaikan gambaran itu secara wajar.
- source_word: וְעַרְבֵי נָחַל
  choice: dahan-dahan pohon dedalu di tepi aliran air
  rationale: עַרְבֵי menunjuk pada pohon dedalu atau jenis serupa, sedangkan נָחַל dapat berarti sungai kecil, wadi, atau aliran air. Rumusan ini tidak mempersempitnya menjadi jenis aliran tertentu.
- source_word: וּשְׂמַחְתֶּם
  choice: bersukacitalah
  rationale: Kata kerja ini berarti bersukacita atau bergembira dan, dalam konteks instruksi, diterjemahkan dengan imperatif yang alami.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: di hadapan Yahweh, Allah kalian
  rationale: לִפְנֵי berarti “di hadapan” atau “dalam hadirat,” dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh.”
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: “Selama” secara alami menandai rentang waktu dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri perjanjian tanpa menggantinya dengan gelar.
- issue: Identifikasi פְּרִי עֵץ הָדָר
  choice: buah dari pohon-pohon yang elok
  alternative: buah sitrun (etrog)
  rationale: Bahasa Ibraninya bersifat umum dan tidak menyebut sitrun secara eksplisit. Identifikasi dengan etrog berasal dari tradisi Yahudi kemudian dan karena itu dicatat dalam catatan kaki, bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “kalian” dipakai untuk memperjelas bahwa sapaan Ibrani berbentuk jamak. Istilah tumbuhan dibuat mudah dipahami tanpa menghilangkan ketidakpastian leksikal pada frasa-frasa yang diperdebatkan.
