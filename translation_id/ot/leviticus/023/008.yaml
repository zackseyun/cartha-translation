  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: id
  text: Selama tujuh hari kamu harus mempersembahkan persembahan yang dibakar kepada Yahweh.[a] Pada hari ketujuh ada pertemuan kudus; kamu tidak boleh melakukan pekerjaan sehari-hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “persembahan dengan api” atau “persembahan api.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: kamu harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa atau menyajikan sesuatu sebagai persembahan; 'mempersembahkan' alami dan tepat dalam bahasa Indonesia.
- source_word: אִשֶּׁה
  choice: kurban bakaran
  rationale: Istilah ritual ini menunjuk pada persembahan yang dibakar bagi Allah. 'Kurban bakaran' cukup alami dalam bahasa Indonesia, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan persembahan; 'kepada' mempertahankan nuansa bahwa persembahan itu ditujukan kepada Yahweh.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Frasa ini menunjukkan rentang waktu berlangsungnya persembahan; 'selama' menyatakan fungsi temporalnya secara jelas.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Padanan temporal langsung dan alami dalam bahasa Indonesia.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Ungkapan ini menunjuk pada pertemuan sakral yang diserukan secara resmi. 'Pertemuan kudus' jelas bagi pembaca modern dan tetap mempertahankan corak ritual.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan sehari-hari
  rationale: Frasa ini tidak melarang setiap tindakan tanpa kecuali, melainkan pekerjaan rutin atau pekerjaan pelayanan yang biasa dilakukan. 'Pekerjaan sehari-hari' menghindari arti yang terlalu luas maupun istilah Indonesia yang usang.
- source_word: לֹא תַעֲשׂוּ
  choice: kamu tidak boleh melakukan
  rationale: Menyampaikan larangan dengan wajar dan tegas dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar atau memilih bentuk pelafalan alternatif.
- issue: Cakupan larangan kerja pada hari ketujuh
  choice: pekerjaan sehari-hari
  alternative: segala pekerjaan berat; pekerjaan pelayanan
  rationale: כָּל מְלֶאכֶת עֲבֹדָה merupakan ungkapan teknis yang membatasi pekerjaan biasa pada hari raya, bukan pernyataan bahwa setiap kegiatan apa pun dilarang. Terjemahan ini menjaga batas makna tanpa menentukan daftar kegiatan secara teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perintah dibuat langsung dan mudah dipahami; istilah ritual dipertahankan tanpa memakai ungkapan arkais. Penanda catatan kaki [a] ditempatkan tepat sesudah istilah yang diterangkan.
