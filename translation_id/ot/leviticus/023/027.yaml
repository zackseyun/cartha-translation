  naturalness: Bahasa pada dasarnya baku dan jelas. “Namun, pada hari kesepuluh ...” lebih lancar dan lebih dekat dengan konstruksi temporal Ibrani daripada “Namun, hari kesepuluh ...”.
  terminology: “Hari Pendamaian” wajar sebagai nama hari raya; catatan kaki dengan tepat memberi tahu pembaca tentang bentuk jamak Ibrani tanpa memaksakan bentuk Indonesia yang janggal. “Merendahkan diri” dapat dipertahankan sebagai salah satu padanan idiomatis, dengan alternatif catatan kaki. Untuk אִשֶּׁה, “persembahan dengan api” menjaga istilah kultis dan ambiguitasnya lebih baik.
