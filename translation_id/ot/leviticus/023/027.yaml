base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: id
  text: Namun, pada hari kesepuluh bulan ketujuh ini adalah Hari Pendamaian.[a] Hari itu harus menjadi pertemuan kudus bagi kalian. Kalian harus merendahkan diri[b] dan mempersembahkan persembahan dengan api bagi Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Hari Pendamaian-Pendamaian”; kata Ibraninya berbentuk jamak.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “menyangkal diri” atau, secara lebih harfiah, “menyusahkan diri.” Ungkapan ini tidak menyebut puasa secara eksplisit.
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional, “persembahan dengan api.” Istilah Ibrani ini menunjuk pada persembahan yang dipersembahkan melalui api; dalam beberapa konteks istilah ini juga dikaitkan dengan persembahan makanan bagi Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang membatasi sekaligus menegaskan ketentuan hari raya berikutnya; “Namun” menyampaikannya secara wajar tanpa menambahkan penafsiran.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: hari kesepuluh bulan ketujuh ini
  rationale: Ungkapan waktu Ibrani menunjuk pada hari kesepuluh dalam bulan tersebut; “hari” dinyatakan agar jelas dan kata tunjuk “ini” dipertahankan.
- source_word: יוֹם הַכִּפֻּרִים
  choice: Hari Pendamaian
  rationale: Ini adalah nama hari raya yang lazim dan mudah dikenali dalam bahasa Indonesia. Bentuk jamak morfologis כִּפֻּרִים dicatat dalam catatan kaki agar ciri teks sumber tetap terlihat.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Ungkapan ini merujuk pada pertemuan sakral yang diserukan secara resmi; pilihan ini alami dan tetap mempertahankan nuansa teknis keagamaan.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Kalian harus merendahkan diri
  rationale: Idiom ini menyatakan tindakan merendahkan atau menyangkal diri secara ritual dan pertobatan. Terjemahan ini tidak mempersempit maknanya hanya menjadi puasa atau penderitaan jasmani.
- source_word: וְהִקְרַבְתֶּם
  choice: mempersembahkan
  rationale: Dalam konteks kurban, bentuk kausatif dari קרב berarti membawa atau menyajikan sesuatu sebagai persembahan.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Istilah kultis ini menunjuk pada persembahan yang diberikan melalui api dan dijadikan asap. Pilihan ini lebih transparan daripada menafsirkannya semata-mata sebagai persembahan makanan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama yang terdapat dalam teks Ibrani tampak secara langsung.
theological_decisions:
- issue: Bentuk jamak Ibrani pada nama Hari Pendamaian
  choice: Hari Pendamaian dalam teks utama, dengan bentuk harfiah jamak dalam catatan kaki
  alternative: Hari Pendamaian-Pendamaian
  rationale: Bentuk tunggal merupakan nama hari raya yang alami dalam bahasa Indonesia, sedangkan catatan kaki menjaga informasi bahwa teks Ibrani memakai bentuk jamak tanpa menghasilkan judul yang janggal.
- issue: Makna perintah menganiaya atau merendahkan diri
  choice: merendahkan diri
  alternative: menyangkal diri; menyusahkan diri
  rationale: Ungkapan Ibrani mencakup penyangkalan diri yang bersifat ritual dan pertobatan. Terjemahan tidak menentukannya sebagai puasa saja dan catatan kaki mempertahankan rentang maknanya.
- issue: Makna istilah kultis אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan dengan api; persembahan makanan
  rationale: Pilihan utama mempertahankan hubungan nyata dengan api tanpa menetapkan bahwa istilah itu hanya berarti makanan bagi Allah; alternatif semantis dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan jamak “kalian” dipakai untuk menampilkan bentuk jamak Ibrani secara jelas. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah ritual yang ambigu dijaga melalui catatan kaki.
