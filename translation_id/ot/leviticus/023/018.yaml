id: LEV.23.18
reference: Leviticus 23:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: id
  text: Bersama roti itu[a], kamu harus mempersembahkan tujuh ekor anak domba jantan berumur satu tahun yang tidak bercacat, seekor sapi jantan dari kawanan, dan dua ekor domba jantan. Semuanya harus menjadi kurban bakaran bagi Yahweh, beserta persembahan sajian mereka dan persembahan curahan mereka, sebagai kurban yang dibakar[b], dengan aroma yang menyenangkan bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di samping roti itu” atau “sebagai tambahan pada roti itu”; kata depan Ibrani dapat menyatakan penyertaan, bukan penempatan secara fisik di atas roti.
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan oleh api”; istilah Ibrani ini menunjuk pada kurban yang dipersembahkan melalui api.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: kamu harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa mendekat atau mempersembahkan; pilihan ini alami dan tepat dalam bahasa Indonesia.
- source_word: עַל הַלֶּחֶם
  choice: bersama roti itu
  rationale: עַל di sini paling wajar menyatakan penyertaan kurban hewan dengan roti yang telah disebutkan, bukan penempatan secara fisik di atasnya; kemungkinan 'di samping' atau 'sebagai tambahan pada' dipertahankan dalam catatan kaki.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: tujuh ekor anak domba jantan berumur satu tahun yang tidak bercacat
  rationale: Terjemahan ini mempertahankan jumlah, jenis kelamin, usia, dan syarat kelayakan ritual hewan.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: seekor sapi jantan dari kawanan
  rationale: פַר בֶּן־בָּקָר menunjuk pada sapi jantan dari ternak besar; ungkapan ini tidak menentukan usia secara lebih sempit daripada teks.
- source_word: וְאֵילִם שְׁנָיִם
  choice: dan dua ekor domba jantan
  rationale: אַיִל secara khusus berarti domba jantan dewasa; bentuk Indonesia ini jelas bagi pembaca umum.
- source_word: יִהְיוּ עֹלָה לַיהוָה
  choice: Semuanya harus menjadi kurban bakaran bagi Yahweh
  rationale: עֹלָה adalah istilah teknis untuk kurban bakaran dan bentuk tunggalnya berfungsi secara kolektif bagi semua hewan yang didaftarkan.
- source_word: וּמִנְחָתָם וְנִסְכֵּיהֶם
  choice: beserta persembahan sajian dan persembahan curahannya
  rationale: Dalam konteks imamat, מִנְחָה adalah persembahan berbahan hasil bumi dan נֶסֶךְ adalah persembahan yang dicurahkan; akhiran jamak posesif dipertahankan secara alami.
- source_word: אִשֵּׁה
  choice: kurban yang dibakar
  rationale: Istilah ini merujuk pada kurban yang dipersembahkan melalui api. Pilihan ini mempertahankan unsur api tanpa memakai ungkapan 'kurban makanan' yang kurang langsung dalam bahasa Indonesia.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Ungkapan formulaik ini menyatakan aroma yang berkenan atau menyenangkan; terjemahan mempertahankan citra indrawinya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, sedangkan ל menyatakan arah atau penerima persembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani menyebut Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna אִשֵּׁה
  choice: kurban yang dibakar
  alternative: kurban makanan atau kurban api-apian
  rationale: Pilihan utama mempertahankan kaitan istilah dengan api dan menghindari kesan bahwa Allah secara harfiah memerlukan makanan, sambil mencatat alternatif leksikal.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Istilah ritual dibuat konsisten dan mudah dipahami: ''kurban bakaran'', ''persembahan sajian'', dan ''persembahan curahan''. Struktur inventaris kurban serta ambiguitas kata depan עַל dipertahankan.'
