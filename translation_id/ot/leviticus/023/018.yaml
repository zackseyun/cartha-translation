  to: Bersama roti itu[a], kamu harus mempersembahkan tujuh ekor anak domba jantan berumur satu tahun yang tidak bercacat, seekor sapi jantan dari kawanan, dan dua ekor domba jantan. Semuanya harus menjadi kurban bakaran bagi Yahweh, beserta persembahan sajian mereka dan persembahan curahan mereka, sebagai kurban yang dibakar[b], dengan aroma yang menyenangkan bagi Yahweh.
