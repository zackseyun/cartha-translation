  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: id
  text: Pada hari pertama harus ada bagimu pertemuan kudus[a]; jangan melakukan pekerjaan rutin apa pun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pertemuan yang suci” atau “pertemuan sakral.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pekerjaan pelayanan/kerja”; yaitu pekerjaan biasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Pada hari pertama
  rationale: Ungkapan temporal ini paling wajar diterjemahkan demikian dalam bahasa Indonesia modern dan tetap mengikuti bentuk teks Ibrani.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Dalam konteks perayaan keagamaan, מִקְרָא menunjuk pada pertemuan yang diserukan atau dihimpunkan, sedangkan קֹדֶשׁ menandainya sebagai kudus. Pilihan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: יִהְיֶה לָכֶם
  choice: kamu harus mengadakan
  rationale: Bentuk idiomatis ini menyampaikan bahwa umat wajib memiliki atau menyelenggarakan pertemuan tersebut, meski struktur harfiahnya ialah 'akan ada bagi kamu'.
- source_word: כָּל ... לֹא
  choice: jangan ... apa pun
  rationale: Konstruksi menyeluruh dengan negasi dinyatakan secara alami dalam bahasa Indonesia dengan 'jangan ... apa pun'.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan rutin
  rationale: Kolokasi ini menunjuk pada pekerjaan biasa yang dilakukan sebagai kerja atau pelayanan, bukan setiap tindakan tanpa kecuali. 'Pekerjaan rutin' menjaga pembatasan makna itu tanpa kesan arkais dari terjemahan seperti 'pekerjaan hamba'.
- source_word: לֹא תַעֲשׂוּ
  choice: jangan melakukan
  rationale: Larangan hukum Ibrani ini paling langsung dan alami dinyatakan dengan bentuk imperatif negatif dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan larangan מְלֶאכֶת עֲבֹדָה
  choice: Larangan itu menyangkut pekerjaan rutin atau pekerjaan biasa, bukan segala tindakan tanpa kecuali.
  alternative: Larangan itu mencakup semua bentuk pekerjaan tanpa pembatasan.
  rationale: Frasa khusus מְלֶאכֶת עֲבֹדָה lebih terbatas daripada larangan atas מְלָאכָה saja dan dalam hukum perayaan menunjuk pada pekerjaan biasa. Terjemahan tidak boleh memperluas larangan melebihi ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada hukum-keagamaan yang bermartabat. Kata ganti jamak Ibrani diterjemahkan dengan 'kamu' yang dalam bahasa Indonesia dapat bersifat jamak; cakupannya terlihat dari konteks umat.
