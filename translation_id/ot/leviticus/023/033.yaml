  text: 'Yahweh berfirman kepada Musa[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: יהוה (YHWH); dapat juga dialihaksarakan “Yehuwa”.'
