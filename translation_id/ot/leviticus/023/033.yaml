lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר memperkenalkan peristiwa ujaran ilahi berikutnya. Dalam bahasa Indonesia Alkitabiah yang modern, “berfirman” merupakan padanan alami dan bermartabat untuk tuturan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri, bukan diganti dengan gelar seperti “TUHAN”.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menerima tuturan; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam formula וידבר ... לאמר, makna לֵאמֹר sudah tersampaikan secara alami oleh “berfirman” dan tanda koma yang mengantar isi firman pada ayat berikutnya. Menerjemahkannya sebagai “dengan mengatakan” terasa kaku dan tidak idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: Yehuwa; TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan fungsi nama tersebut, sedangkan “TUHAN” menggantinya dengan gelar; “Yehuwa” adalah bentuk alternatif yang dikenal.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula pembuka dibuat alami dalam bahasa sasaran, sementara koma menunjukkan bahwa isi firman berlanjut pada ayat berikutnya.
