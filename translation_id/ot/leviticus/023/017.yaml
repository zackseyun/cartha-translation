id: LEV.23.17
reference: Leviticus 23:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: id
  text: Dari tempat tinggalmu, kamu harus membawa dua roti sebagai persembahan unjukan. Keduanya harus dibuat dari dua persepuluh efa[a] dari tepung halus dan dipanggang beragi[b], sebagai hasil pertama bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dua persepuluh”; dalam sistem ukuran keimaman, maksudnya dua persepuluh efa.
    reason: cultural_note
  - marker: b
    text: Atau, “dipanggang sebagai roti beragi.” Teks Ibrani secara khusus menyatakan bahwa roti hasil pertama ini beragi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: Dari tempat-tempat kediamanmu
  rationale: מוֹשָׁב menunjuk pada tempat tinggal atau permukiman. Bentuk ini mempertahankan gambaran sumber dan cocok dengan gaya hukum yang khidmat.
- source_word: תָּבִיאוּ
  choice: kamu harus membawa
  rationale: Bentuk kausatif בוא di sini menyampaikan perintah ritual. 'Harus membawa' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לֶחֶם תְּנוּפָה שְׁתַּיִם
  choice: dua roti sebagai persembahan unjukan
  rationale: Walaupun לֶחֶם berbentuk tunggal, bilangan שְׁתַּיִם menuntut dua roti dalam bahasa sasaran. 'Persembahan unjukan' mempertahankan istilah ritual תְּנוּפָה tanpa menjelaskan gerak ritual secara berlebihan.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dua persepuluh efa
  rationale: עִשָּׂרוֹן adalah ukuran sepersepuluh yang dalam sistem ukuran keimaman dipahami sebagai sepersepuluh efa. 'Efa' ditambahkan demi kejelasan dan dijelaskan dalam catatan kaki.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Padanan alami untuk tepung bermutu yang telah dihaluskan dan dipakai dalam persembahan sajian.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: dipanggang beragi
  rationale: Ungkapan ini menyatakan bahwa roti-roti tersebut dipanggang dalam keadaan beragi. Susunan Indonesia ini ringkas, alami, dan mempertahankan unsur yang secara ritual mencolok.
- source_word: בִּכּוּרִים
  choice: sebagai hasil pertama
  rationale: Istilah ini menunjuk pada hasil awal panen yang dipersembahkan kepada Allah. 'Hasil pertama' jelas bagi pembaca modern dan tidak membatasi maknanya pada buah-buahan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan peruntukan atau pengkhususan persembahan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Istilah ritual תְּנוּפָה
  choice: persembahan unjukan
  alternative: persembahan yang diayunkan
  rationale: '''Persembahan unjukan'' mempertahankan kategori teknis ritual, sedangkan alternatif dapat terdengar seolah-olah seluruh rincian gerak ritual telah ditentukan oleh kata itu sendiri.'
- issue: Cakupan ukuran שְׁנֵי עֶשְׂרֹנִים terhadap dua roti
  choice: Keduanya harus dibuat dari dua persepuluh efa
  alternative: Masing-masing harus dibuat dari dua persepuluh efa
  rationale: Teks Ibrani menyebut dua roti lalu ukuran dua persepuluh, tetapi tidak memakai kata yang secara eksplisit berarti 'masing-masing'. Terjemahan tidak menambahkan pembagian ukuran yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang khidmat. Istilah teknis 'persembahan unjukan' dipertahankan, sementara struktur kalimat dibuat alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
