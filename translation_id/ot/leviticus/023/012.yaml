  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: id
  text: Pada hari ketika kamu mengayunkan berkas hasil panen[a] itu, kamu harus mempersembahkan seekor anak domba jantan berumur satu tahun yang tidak bercacat sebagai kurban bakaran bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “omer”. Di sini istilah ini kemungkinan menunjuk pada berkas hasil panen yang dipersembahkan dalam ritual, bukan sekadar satuan takaran kering.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: kamu harus mempersembahkan
  rationale: Dalam konteks kurban, עשה secara idiomatis berarti melaksanakan atau mempersembahkan kurban; pilihan ini alami dan tepat dalam bahasa Indonesia.
- source_word: בְּיוֹם
  choice: Pada hari
  rationale: Ungkapan temporal ini secara wajar menunjukkan waktu pelaksanaan perintah.
- source_word: הֲנִיפְכֶם
  choice: kamu mengayunkan
  rationale: Bentuk Hifil dari נוף menunjuk pada tindakan ritual mengayunkan persembahan di hadapan Yahweh; istilah ritualnya dipertahankan.
- source_word: הָעֹמֶר
  choice: berkas gandum
  rationale: Dalam konteks panen ini, עֹמֶר paling mungkin menunjuk pada berkas hasil panen yang dipersembahkan, bukan semata-mata satuan takaran. 'Gandum' dipakai secara umum untuk tanaman biji-bijian, tanpa menentukan spesies yang tidak disebutkan dalam ayat ini.
- source_word: כֶּבֶשׂ
  choice: seekor anak domba jantan
  rationale: כֶּבֶשׂ menunjuk pada anak domba, dan bentuk maskulin dalam ketentuan kurban ini menyatakan hewan jantan.
- source_word: תָּמִים
  choice: yang tidak bercacat
  rationale: Dalam hukum kurban, תמים berarti bebas dari cacat fisik yang membuat hewan tidak layak dipersembahkan.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Ini adalah padanan Indonesia yang alami bagi idiom Ibrani mengenai umur hewan; ungkapan sumber juga dapat dipahami sebagai masih dalam tahun pertamanya.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah teknis bagi kurban yang dibakar seluruhnya di atas mazbah.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai bahwa kurban itu diperuntukkan bagi Yahweh; nama ilahi יהוה ditransliterasikan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan mengikuti bukti sumber tanpa menggantinya dengan gelar.
- issue: Makna עֹמֶר dalam ritual hasil pertama
  choice: berkas gandum
  alternative: omer; takaran
  rationale: Konteks tindakan mengayunkan hasil panen mendukung benda konkret berupa berkas, tetapi catatan kaki mempertahankan kemungkinan transliterasi istilah Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual 'mengayunkan' dan 'kurban bakaran' dipertahankan, sedangkan struktur kalimat dibuat alami bagi pembaca umum.
