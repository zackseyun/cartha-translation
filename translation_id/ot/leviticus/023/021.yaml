review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya mengikuti teks Ibrani dengan baik: penegasan waktu, pemanggilan/pernyataan pertemuan kudus, larangan kerja biasa, dan keberlakuan lintas tempat serta generasi semuanya hadir. Namun, frasa "bagi kamu" yang ditempatkan setelah "pertemuan kudus" tidak alami dan kurang jelas fungsinya dalam bahasa Indonesia. Catatan b juga menyebut "pelayanan/kerja" sebagai harfiah, padahal konstruksi Ibraninya lebih tepat "pekerjaan pelayanan" atau "pekerjaan pengabdian".'
  naturalness: Register hukum-keagamaan sudah cocok dan modern. Revisi kecil membuat kalimat pertama lebih lancar dan kalimat terakhir lebih langsung tanpa mengurangi cakupan "di seluruh tempat tinggalmu".
  terminology: '"Pertemuan kudus" merupakan padanan yang baik untuk מִקְרָא קֹדֶשׁ. "Pekerjaan rutin" secara wajar menyampaikan pekerjaan biasa/kerja pelayanan, meskipun "pekerjaan biasa" sedikit lebih transparan dalam konteks hukum. "Ketetapan yang berlaku terus" dapat dipahami, tetapi "ketetapan yang berlaku untuk selamanya" lebih jelas menyatakan formula חֻקַּת עוֹלָם tanpa memaksakan pengertian metafisis.'
  issues:
  - severity: medium
    issue: Penempatan "bagi kamu" dalam kalimat pertama kurang alami dan maknanya kabur.
    rationale: יִהְיֶה לָכֶם memang menyatakan bahwa pertemuan kudus itu berlaku bagi umat yang disapa, tetapi "suatu pertemuan kudus bagi kamu" terdengar seperti pertemuan itu diperuntukkan bagi mereka, bukan ketetapan yang harus mereka tetapkan/umumkan. Unsur tersebut dapat terserap secara idiomatis dalam perintah tanpa mengubah makna.
  - severity: low
    issue: Catatan b tidak tepat sebagai gloss harfiah.
    rationale: כָּל־מְלֶאכֶת עֲבֹדָה secara harfiah adalah "segala pekerjaan pelayanan/pengabdian," bukan "segala pekerjaan pelayanan/kerja." Penjelasan interpretatif dapat tetap menyebut pekerjaan biasa.
