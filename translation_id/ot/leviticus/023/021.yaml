revisions:
- from: Pada hari itu juga kamu harus mengumumkan suatu pertemuan kudus[a] bagi kamu. Jangan lakukan pekerjaan rutin apa pun[b]. Inilah ketetapan yang berlaku terus[c] di mana pun kamu tinggal, turun-temurun.
  to: Pada hari itu juga kamu harus mengumumkan pertemuan kudus[a]. Jangan lakukan pekerjaan biasa apa pun[b]. Ini adalah ketetapan yang berlaku untuk selamanya[c] di semua tempat tinggalmu, turun-temurun.
  rationale: Revisi menghilangkan "bagi kamu" yang tidak idiomatis dalam posisi semula, sambil mempertahankan daya normatif perintah bagi umat yang disapa. "Pekerjaan biasa" menyampaikan cakupan מְלֶאכֶת עֲבֹדָה secara lebih jelas daripada "pekerjaan rutin," dan catatan b diperbaiki agar gloss harfiahnya akurat. Susunan akhir "di semua tempat tinggalmu, turun-temurun" secara eksplisit mempertahankan kedua keterangan cakupan dalam teks Ibrani.
  reviewer_model: gpt-5.6-terra
