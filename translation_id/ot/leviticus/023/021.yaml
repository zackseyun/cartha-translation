language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: id
  text: Pada hari itu juga kamu harus mengumumkan pertemuan kudus[a]. Jangan lakukan pekerjaan biasa apa pun[b]. Ini adalah ketetapan yang berlaku untuk selamanya[c] di semua tempat tinggalmu, turun-temurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perhimpunan suci” atau “pertemuan yang dikhususkan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “segala pekerjaan pelayanan”; yakni pekerjaan biasa, bukan larangan atas setiap kegiatan tanpa kecuali.
    reason: lexical_alternative
  - marker: c
    text: Atau “ketetapan yang tetap” atau “ketetapan yang berlaku terus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: kamu harus mengumumkan
  rationale: Dalam konteks hari raya, קרא menunjuk pada pengumuman atau penetapan resmi kepada umat, bukan sekadar memanggil atau berkata.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: pada hari itu juga
  rationale: Ungkapan ini menegaskan bahwa pengumuman tersebut dilakukan tepat pada hari yang dimaksud; bentuk Indonesia ini alami dan tetap mempertahankan penekanannya.
- source_word: מִקְרָא קֹדֶשׁ
  choice: suatu pertemuan kudus
  rationale: Frasa keagamaan ini berarti pertemuan umat yang dipanggil secara resmi dan dikhususkan bagi Allah. 'Pertemuan kudus' jelas bagi pembaca modern tanpa kehilangan nuansa sakralnya.
- source_word: יִהְיֶה לָכֶם
  choice: bagi kamu
  rationale: Unsur ini dipertahankan untuk menunjukkan bahwa pertemuan tersebut harus menjadi pertemuan umat Israel, meskipun susunan Ibrani tidak dapat disalin secara kaku ke dalam bahasa Indonesia.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan rutin apa pun
  rationale: Frasa ini menunjuk pada pekerjaan biasa atau pekerjaan pelayanan/nafkah, bukan larangan mutlak terhadap segala tindakan. 'Pekerjaan rutin' menghindari kesan bahwa hanya pekerjaan yang berat secara fisik yang dilarang.
- source_word: לֹא תַעֲשׂוּ
  choice: jangan lakukan
  rationale: Bentuk larangan langsung ini alami dalam bahasa Indonesia dan mempertahankan daya hukum perintah Ibrani.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan yang berlaku terus
  rationale: עוֹלָם dalam rumus hukum menyatakan keberlakuan yang berkelanjutan. Pilihan ini mempertahankan sifat permanennya tanpa memaksakan pengertian metafisis yang lebih mutlak daripada idiom Ibrani.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: di mana pun kamu tinggal
  rationale: Terjemahan idiomatis ini menyampaikan cakupan distributif frasa tersebut, yaitu di seluruh tempat kediaman umat.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan Indonesia ini secara ringkas dan alami menyatakan keberlakuan bagi generasi-generasi berikutnya.
theological_decisions:
- issue: Cakupan larangan kerja dalam hukum hari raya
  choice: pekerjaan rutin apa pun
  alternative: pekerjaan apa pun; pekerjaan berat apa pun; pekerjaan untuk mencari nafkah apa pun
  rationale: כָּל מְלֶאכֶת עֲבֹדָה lazimnya menunjuk pada pekerjaan biasa, pekerjaan pelayanan, atau pekerjaan nafkah, bukan setiap kegiatan tanpa kecuali. Terjemahan ini tidak menyamakan larangan hari raya ini secara diam-diam dengan larangan yang lebih luas.
- issue: Daya waktu חֻקַּת עוֹלָם
  choice: ketetapan yang berlaku terus
  alternative: ketetapan untuk selamanya; ketetapan kekal
  rationale: Pilihan utama mempertahankan keberlanjutan ketetapan lintas generasi sambil membiarkan idiom עוֹלָם memiliki rentang maknanya sendiri, tanpa menyelesaikan pertanyaan teologis tentang durasi absolutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang khidmat tetapi tetap mudah dipahami. Bentuk tunggal kolektif 'kamu' dipertahankan untuk sapaan kepada umat, dan susunan kalimat dibuat langsung tanpa istilah gerejawi yang terlalu teknis.
