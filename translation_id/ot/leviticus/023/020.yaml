id: LEV.23.20
reference: Leviticus 23:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: id
  text: Imam harus mengayunkan semua itu bersama roti hasil pertama sebagai persembahan unjukan di hadapan Yahweh[a], bersama kedua anak domba itu. Semua itu harus menjadi kudus bagi Yahweh dan diperuntukkan bagi imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di atas roti hasil pertama” dan “di atas kedua anak domba itu”. Preposisi Ibrani dapat diterjemahkan lebih harfiah demikian, tetapi di sini kemungkinan besar menunjukkan penyajian ritual secara bersama-sama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: harus mengayunkan
  rationale: Bentuk Hifil dari נוּף dalam konteks kurban menunjuk pada tindakan ritual mengayunkan atau mempersembahkan di hadapan Allah. Pilihan ini mempertahankan gambaran tindakan yang mendasari istilah teknis persembahan unjukan.
- source_word: אֹתָם
  choice: semua itu
  rationale: Kata ganti objek jamak ini merujuk secara anaforis pada unsur-unsur yang telah disebutkan dalam konteks sebelumnya. Terjemahan ini mempertahankan rujukannya tanpa menentukan secara lebih sempit apa saja yang tercakup.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: bersama roti hasil pertama
  rationale: Walaupun עַל secara harfiah dapat berarti 'di atas', dalam konteks ritual ini kata tersebut kemungkinan menunjukkan bahwa unsur-unsur itu dipersembahkan bersama-sama, bukan bahwa yang satu secara fisik diletakkan di atas yang lain.
- source_word: לֶחֶם הַבִּכּוּרִים
  choice: roti hasil pertama
  rationale: Ungkapan ini mempertahankan hubungan roti tersebut dengan persembahan hasil pertama dalam perayaan ini dan memakai bahasa Indonesia yang ringkas serta wajar.
- source_word: תְּנוּפָה
  choice: sebagai persembahan unjukan
  rationale: Ini adalah istilah teknis bagi persembahan yang secara ritual diayunkan atau disajikan di hadapan Yahweh. 'Persembahan unjukan' mempertahankan istilah ibadah yang dikenal dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menyatakan bahwa tindakan ritual dilakukan dalam hadirat Allah; 'di hadapan' merupakan padanan Indonesia yang alami dan dekat dengan bentuk Ibraninya.
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: bersama kedua anak domba itu
  rationale: Seperti עַל sebelumnya, preposisi ini paling mungkin menyatakan penyertaan dalam penyajian ritual. Kata sandang tersirat diterjemahkan dengan 'itu' karena kedua anak domba telah disebut dalam konteks sebelumnya.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: semua itu harus menjadi kudus
  rationale: Konstruksi nomina predikatif dengan היה menyatakan status benda-benda tersebut sebagai sesuatu yang kudus. Terjemahan ini mempertahankan bentuk dan daya hukum pernyataannya.
- source_word: לַיהוָה לַכֹּהֵן
  choice: bagi Yahweh dan diperuntukkan bagi imam
  rationale: Frasa pertama menyatakan pengudusan atau kepemilikan bagi Yahweh, sedangkan frasa kedua menunjukkan hak imam atas bagian kudus itu. 'Diperuntukkan' menjelaskan hubungan legal-praktis tanpa menghilangkan pengabdian utamanya kepada Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה dipertahankan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Hubungan antara kekudusan bagi Yahweh dan hak imam
  choice: Semua itu kudus bagi Yahweh dan diperuntukkan bagi imam
  alternative: Semua itu harus menjadi kudus bagi Yahweh, bagi imam
  rationale: Dua frasa ל ditempatkan berdampingan dalam bahasa Ibrani. Terjemahan yang dipilih mempertahankan pengabdian kepada Yahweh sekaligus menyampaikan bahwa benda kudus itu menjadi bagian imam, tanpa menyiratkan bahwa hak imam meniadakan kepunyaan Yahweh.
- issue: Pelafalan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut secara langsung.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami dipakai dengan mempertahankan istilah ritual 'persembahan unjukan'. Pengulangan 'semua itu' menjaga rujukan kata ganti Ibrani tetap terbuka, sedangkan catatan kaki mempertahankan ambiguitas spasial pada preposisi עַל.
