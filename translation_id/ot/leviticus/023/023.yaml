lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר memperkenalkan peristiwa tutur baru. Dalam konteks Allah sebagai subjek, “berfirman” merupakan padanan Indonesia yang alami, khidmat, dan tetap membedakannya dari kata pengantar isi ujaran berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai orang yang menjadi tujuan perkataan; “kepada” adalah padanan Indonesia yang wajar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk baku nama משה dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif לֵאמֹר memperkenalkan isi perkataan yang menyusul. Dalam bahasa Indonesia, “demikian:” menyampaikan fungsi tersebut secara alami dan menghindari ungkapan kaku “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu dalam bentuk alih aksara yang luas diterima, sementara catatan kaki mencantumkan bentuk alternatif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Rumus tutur Ibrani dipertahankan secara fungsional melalui “berfirman ... demikian:” tanpa menghasilkan susunan yang kaku.
