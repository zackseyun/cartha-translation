  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: id
  text: Inilah waktu-waktu yang ditetapkan Yahweh[a], pertemuan-pertemuan kudus[b], yang harus kamu umumkan pada waktunya masing-masing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hari-hari raya yang ditetapkan” atau “waktu-waktu tertentu.” Kata Ibrani מוֹעֲדֵי lebih luas daripada jamuan pesta saja dan menunjuk pada waktu-waktu yang ditetapkan oleh Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Atau “perhimpunan-perhimpunan suci.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Penunjuk jamak ini memperkenalkan daftar yang menyusul; “Inilah” merupakan ungkapan Indonesia yang alami dan tegas.
- source_word: מוֹעֲדֵי
  choice: waktu-waktu yang ditetapkan
  rationale: מוֹעֵד menunjuk pada waktu atau pertemuan yang telah ditentukan. Dalam konteks Imamat 23 cakupannya lebih luas daripada pesta atau perjamuan saja, sehingga unsur waktunya dipertahankan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan tidak menggantinya dengan suatu gelar.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: pertemuan-pertemuan kudus
  rationale: Frasa konstruksi ini menunjuk pada pertemuan yang diserukan atau dihimpunkan dan dikhususkan sebagai kudus; pilihan ini alami dalam bahasa Indonesia modern.
- source_word: תִּקְרְאוּ
  choice: harus kamu umumkan
  rationale: Dalam konteks ini קרא berarti menyerukan atau mengumumkan secara terbuka waktu-waktu ibadah tersebut, bukan sekadar menamainya.
- source_word: אֹתָם
  choice: yang
  rationale: Objek jamak Ibrani terwakili secara alami melalui klausa relatif Indonesia yang merujuk kepada waktu-waktu/pertemuan-pertemuan tersebut.
- source_word: בְּמוֹעֲדָם
  choice: pada waktunya masing-masing
  rationale: Bentuk ini menyatakan bahwa tiap perayaan atau pertemuan harus diumumkan pada waktu yang telah ditentukan baginya, sekaligus mempertahankan gema leksikal מוֹעֵד.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan מוֹעֲדֵי
  choice: waktu-waktu yang ditetapkan
  alternative: hari-hari raya yang ditetapkan
  rationale: Istilah Ibrani menekankan waktu/pertemuan yang ditentukan dan dalam pasal ini tidak terbatas pada perjamuan pesta; terjemahan yang lebih luas menghindari penyempitan makna.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Bentuk jamak ulang mempertahankan rujukan pada beberapa waktu dan pertemuan, sedangkan “pada waktunya masing-masing” menyampaikan sufiks jamak distributif secara alami.
