source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: id
  text: '“Katakanlah kepada orang Israel: Pada bulan ketujuh, pada hari pertama bulan itu, akan menjadi bagimu hari perhentian penuh, suatu peringatan dengan bunyi sangkakala[a], dan pertemuan kudus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “peringatan dengan bunyi nyaring”. Kata Ibrani ini dapat menunjuk secara lebih luas kepada bunyi isyarat yang keras, termasuk seruan, sorak, atau tiupan tanduk maupun sangkakala.
    reason: Menjaga keluasan makna תְּרוּעָה, yang tidak selalu secara khusus berarti bunyi sangkakala.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara harfiah berarti ‘anak-anak Israel’, tetapi berfungsi sebagai sebutan kolektif bagi komunitas Israel. ‘Orang Israel’ alami dalam bahasa Indonesia dan tidak mempersempit acuannya hanya kepada laki-laki.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: Pada bulan ketujuh
  rationale: Padanan langsung dan alami untuk keterangan waktu dalam kalender.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: pada tanggal satu bulan itu
  rationale: Idiom Ibrani harfiah ‘pada satu bulan’ menunjuk kepada hari pertama dalam bulan tersebut; ‘tanggal satu’ merupakan ungkapan kalender yang wajar dalam bahasa Indonesia.
- source_word: יִהְיֶה לָכֶם
  choice: kamu harus mengadakan
  rationale: Mengungkapkan bahwa ketetapan itu berlaku bagi komunitas yang disapa. Bentuk ini lebih alami daripada struktur eksistensial harfiah ‘akan ada bagimu’ tanpa mengubah daya ketetapannya.
- source_word: שַׁבָּתוֹן
  choice: hari perhentian penuh
  rationale: Menyampaikan penghentian kegiatan biasa yang ditetapkan secara khusus, sekaligus membedakannya dari sekadar istirahat biasa.
- source_word: זִכְרוֹן
  choice: suatu peringatan
  rationale: Nomina ini menunjuk kepada sesuatu yang berfungsi sebagai pengingat atau peringatan dalam konteks ibadah.
- source_word: תְּרוּעָה
  choice: bunyi sangkakala
  rationale: Dalam konteks kalender perayaan, bunyi isyarat dari sangkakala atau tanduk merupakan pemahaman yang kuat. Karena kata Ibraninya memiliki cakupan lebih luas, kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Padanan formal namun mudah dipahami bagi pertemuan umat yang dipanggil dan dikhususkan untuk ibadah.
theological_decisions:
- issue: Jenis bunyi yang dimaksud oleh תְּרוּעָה
  choice: bunyi sangkakala
  alternative: bunyi nyaring, seruan, atau sorak
  rationale: Konteks perayaan mendukung bunyi isyarat dari sangkakala atau tanduk, tetapi istilah Ibraninya sendiri tidak secara khusus menyebut alat musik. Catatan kaki menjaga keluasan makna tersebut tanpa menetapkan tradisi denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah peribadatan ‘perhentian penuh’, ‘peringatan’, dan ‘pertemuan kudus’ mempertahankan corak hukum-liturgis teks.
