id: LEV.23.44
reference: Leviticus 23:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: id
  text: Musa pun menyampaikan waktu-waktu yang ditetapkan Yahweh kepada orang Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “keturunan Israel” atau, menurut ungkapan tradisional, “anak-anak Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: pun menyampaikan
  rationale: Bentuk ini melanjutkan dan merangkum rangkaian ketetapan sebelumnya. Dalam konstruksi dengan objek langsung, “menyampaikan” terdengar alami dalam bahasa Indonesia dan tetap mempertahankan tindakan Musa yang memberitahukan ketetapan-ketetapan itu.
- source_word: מֹעֲדֵי
  choice: waktu-waktu yang ditetapkan
  rationale: מוֹעֵד menunjuk pada waktu atau pertemuan yang telah ditentukan. Dalam Imamat 23 cakupannya tidak terbatas pada perayaan dengan jamuan, tetapi juga mencakup Sabat; karena itu, “waktu-waktu yang ditetapkan” mempertahankan keluasan maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi penerima penyampaian Musa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiah “anak-anak lelaki Israel” berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” merupakan padanan Indonesia modern yang alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. Bentuk “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan מֹעֲדֵי dalam kalender kudus
  choice: waktu-waktu yang ditetapkan
  alternative: hari-hari raya atau perayaan-perayaan
  rationale: Istilah ini mencakup seluruh waktu kudus yang ditetapkan dalam pasal ini, termasuk Sabat, sehingga tidak dipersempit hanya menjadi perayaan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Partikel “pun” memberi nuansa kelanjutan sekaligus penutup rangkaian tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan. Istilah teknis yang terlalu sempit seperti “hari raya” dihindari.
