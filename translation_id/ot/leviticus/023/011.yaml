  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: id
  text: Imam harus mengayunkan berkas itu di hadapan Yahweh agar kamu diterima[a]. Pada hari setelah Sabat, imam harus mengayunkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “untuk diterimanya kamu.” Frasa Ibrani ini dapat menyatakan penerimaan para penyembah di hadapan Yahweh melalui persembahan tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: Ia harus mengayun-ayunkan
  rationale: Bentuk Hifil dari נוּף menunjuk pada tindakan ritual mengayunkan atau mempersembahkan sesuatu sebagai persembahan unjukan. Pengulangan verba mempertahankan unsur gerak ritual dalam teks.
- source_word: הָעֹמֶר
  choice: berkas itu
  rationale: Dalam konteks hasil pertama, עֹמֶר menunjuk pada berkas jelai atau gandum yang dibawa, bukan terutama satuan takaran. Kata 'berkas' alami dan jelas dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menyatakan persembahan ritual dalam hadirat Allah. Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: לִרְצֹנְכֶם
  choice: agar kamu diterima
  rationale: Dalam konteks kurban, frasa ini menyatakan penerimaan para penyembah melalui persembahan tersebut. Rumusan ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan antara tindakan ritual dan penerimaan umat.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: Pada hari sesudah hari Sabat
  rationale: Frasa temporal ini menunjuk pada hari yang langsung mengikuti hari Sabat. Pengulangan 'hari' menghasilkan makna yang jelas dalam bahasa Indonesia modern.
- source_word: יְנִיפֶנּוּ הַכֹּהֵן
  choice: imam harus mengayun-ayunkannya
  rationale: Akhiran objek tunggal merujuk kembali kepada berkas, sedangkan הַכֹּהֵן menyebut pelaku secara eksplisit. Verba diterjemahkan sama seperti kemunculan pertamanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Makna לִרְצֹנְכֶם dalam konteks persembahan
  choice: agar kamu diterima
  alternative: untuk penerimaanmu
  rationale: Bahasa Ibrani dapat menyatakan bahwa persembahan itu mendatangkan penerimaan bagi umat di hadapan Yahweh. Terjemahan utama dibuat alami tanpa menentukan mekanisme teologis lebih jauh; bentuk yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Mengayun-ayunkan' mempertahankan tindakan ritual yang tersurat; 'berkas' dipilih daripada transliterasi 'omer' agar mudah dipahami pembaca umum.
