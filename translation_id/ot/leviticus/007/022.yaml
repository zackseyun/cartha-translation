lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר membuka unit firman baru. Dalam bahasa Indonesia Alkitabiah yang modern dan wajar, “berfirman” secara tepat dipakai untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar TUHAN.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi sasaran pembicaraan; “kepada” merupakan padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk baku nama מֹשֶׁה dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan tersendiri
  rationale: Dalam formula וידבר ... לאמר, isi ujaran dimulai pada ayat berikutnya. Bahasa Indonesia alami cukup memakai “berfirman kepada”; menerjemahkan לאמר secara harfiah sebagai “dengan mengatakan” akan terasa berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan fungsi nama pribadi tersebut tanpa menggantinya dengan gelar atau memilih bentuk “Yehuwa” yang kurang mencerminkan rekonstruksi pelafalan yang lazim.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula pembuka ujaran dibuat alami; koma di akhir menandakan bahwa isi firman berlanjut pada ayat berikutnya.
