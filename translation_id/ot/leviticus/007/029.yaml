base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: id
  text: 'Katakanlah kepada orang Israel[a]: Siapa pun yang mempersembahkan kurban damai sejahteranya[b] kepada Yahweh harus membawa persembahannya kepada Yahweh dari kurban damai sejahteranya itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; ungkapan ini juga dapat diterjemahkan “anak-anak Israel,” “keturunan Israel,” atau “umat Israel.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini menunjuk pada jenis kurban yang berkaitan dengan damai, keutuhan, dan kesejahteraan; sering juga disebut “kurban keselamatan” atau “kurban persekutuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Katakanlah kepada orang Israel
  rationale: Ungkapan pembuka ini menyampaikan perintah ilahi agar Musa berbicara kepada komunitas Israel. “Orang Israel” merupakan bahasa Indonesia modern yang alami untuk sebutan kolektif בְּנֵי יִשְׂרָאֵל; arti harfiahnya dicatat dalam catatan kaki.
- source_word: הַמַּקְרִיב
  choice: Siapa pun yang mempersembahkan
  rationale: Partisipel Hifil dari קרב menunjuk pada orang yang membawa atau menyajikan kurban dalam konteks ibadah. “Mempersembahkan” mempertahankan nuansa kultis, sedangkan “siapa pun yang” mengungkapkan fungsi umum partisipel tersebut.
- source_word: זֶבַח שְׁלָמָיו
  choice: kurban damai sejahteranya
  rationale: זֶבַח berarti kurban, sedangkan istilah teknis שְׁלָמִים berkaitan dengan damai, keutuhan, dan kesejahteraan. “Kurban damai sejahtera” mempertahankan kaitan leksikal itu tanpa mempersempit maknanya hanya menjadi persekutuan atau pendamaian.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama diri dalam teks sumber tetap tampak dan berbeda dari gelar “Tuhan”.
- source_word: יָבִיא
  choice: harus membawa
  rationale: Bentuk imperfek Hifil dalam konteks hukum ini menyatakan kewajiban. “Harus membawa” terdengar alami dalam bahasa Indonesia modern dan mempertahankan daya preskriptifnya.
- source_word: קָרְבָּנוֹ
  choice: persembahan
  rationale: קָרְבָּן adalah istilah umum bagi sesuatu yang dibawa mendekat sebagai persembahan. “Persembahan” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: yang diambil dari kurban damai sejahteranya itu
  rationale: Preposisi מִן menunjukkan bahwa persembahan yang dibawa berasal dari kurban damai sejahtera tersebut. Klausa relatif ini membuat hubungan itu jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan status יהוה sebagai nama diri perjanjian dan mengikuti lapisan konsultasi POB terbaru, tanpa menyamakannya dengan gelar umum.
- issue: Istilah זֶבַח שְׁלָמִים
  choice: kurban damai sejahtera
  alternative: kurban keselamatan; kurban persekutuan; kurban pendamaian
  rationale: Pilihan ini mempertahankan cakupan makna שׁלם—damai, keutuhan, dan kesejahteraan—serta unsur kurban dari זֶבַח. “Persekutuan” lebih interpretatif, sedangkan “pendamaian” dapat mengaburkan istilah ini dengan kurban penghapus dosa.
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; keturunan Israel
  rationale: Dalam konteks ini frasa tersebut menyapa komunitas Israel secara kolektif, bukan hanya laki-laki atau anak yang masih muda. Padanan modern ini menyampaikan rujukan kolektif tanpa meniadakan bentuk harfiahnya, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum dipertahankan melalui “harus”, sementara pengulangan “kepada Yahweh” dan “kurban damai sejahteranya” dijaga karena merupakan ciri penting teks Ibrani.
