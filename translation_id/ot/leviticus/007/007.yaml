base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: id
  text: 'Seperti kurban penghapus dosa, demikian juga kurban penebus kesalahan: satu ketentuan berlaku bagi keduanya.[a] Kurban penebus kesalahan itu menjadi bagian imam yang mengadakan pendamaian dengannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Satu torah bagi mereka”; kata Ibrani torah juga dapat berarti “hukum” atau “petunjuk.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת
  choice: Seperti kurban penghapus dosa
  rationale: Prefiks כ menyatakan perbandingan, sedangkan חַטָּאת dalam konteks persembahan menunjuk pada kurban untuk dosa. Istilah ini membedakannya dari dosa itu sendiri.
- source_word: כָּאָשָׁם
  choice: demikian juga kurban penebus kesalahan
  rationale: Struktur berpasangan כ...כ... menyamakan ketentuan kedua kurban. אָשָׁם di sini adalah kurban yang berkaitan dengan kesalahan dan pemulihan, sehingga 'kurban penebus kesalahan' lebih informatif daripada sekadar 'kurban kesalahan'.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: satu ketentuan berlaku bagi keduanya
  rationale: תּוֹרָה dalam bagian hukum ritual ini berarti petunjuk atau ketentuan yang mengatur tata cara. 'Bagi keduanya' memperjelas rujukan pronomina jamak tanpa menambah makna substantif.
- source_word: אֲשֶׁר יְכַפֵּר בּוֹ
  choice: yang mengadakan pendamaian dengannya
  rationale: כפר dipertahankan sebagai istilah teologis-kultis 'mengadakan pendamaian'. בּוֹ paling wajar menyatakan sarana, yaitu dengan kurban itu, tanpa menyisipkan objek penerima yang tidak dinyatakan.
- source_word: לוֹ יִהְיֶה
  choice: Kurban itu menjadi bagian imam
  rationale: Idiom Ibrani menyatakan kepemilikan atau jatah yang menjadi hak imam pelaksana. Susunan ini alami dalam bahasa Indonesia dan membuat anteseden 'itu' jelas.
theological_decisions:
- issue: Makna כפר dalam peraturan kurban
  choice: mengadakan pendamaian
  alternative: mengadakan penghapusan dosa; melakukan ritus penyucian
  rationale: Pilihan ini mempertahankan bobot teologis dan ritual verba כפר tanpa membatasi maknanya pada satu teori tertentu tentang pendamaian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kurban' dipakai sesuai ejaan baku. Istilah persembahan dibuat cukup transparan bagi pembaca umum, sedangkan ungkapan kepemilikan dirumuskan sebagai 'menjadi bagian imam' untuk menyampaikan jatah ritual dengan jelas.
