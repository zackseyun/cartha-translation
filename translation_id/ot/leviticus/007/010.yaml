  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: id
  text: Setiap persembahan sajian yang dicampur dengan minyak, atau yang kering, harus menjadi milik semua anak-anak laki-laki Harun; masing-masing mendapat bagian yang sama dengan saudaranya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks hukum kurban Imamat, istilah ini menunjuk pada persembahan berbahan hasil tanaman atau tepung, bukan persembahan secara umum. “Persembahan sajian” merupakan istilah Indonesia yang ringkas dan lazim untuk jenis persembahan ini.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif dan frasa preposisional menerangkan cara persembahan itu disiapkan; ungkapan ini alami dan tepat dalam bahasa Indonesia modern.
- source_word: חֲרֵבָה
  choice: yang kering
  rationale: Pilihan ini mempertahankan kontras leksikal dengan persembahan yang dicampur minyak tanpa mempersempit maknanya secara interpretatif menjadi “tanpa minyak”.
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: harus menjadi bagian semua anak laki-laki Harun
  rationale: Konstruksi לְ dengan היה menyatakan kepemilikan atau peruntukan. “Menjadi bagian” menyampaikan pembagian hak secara alami tanpa menyiratkan bahwa seluruh persembahan secara kolektif dimiliki tanpa pembagian.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak laki-laki Harun
  rationale: Bahasa sumber memakai istilah kekerabatan maskulin dalam konteks hukum keimaman; bentuk gendernya dipertahankan.
- source_word: אִישׁ כְּאָחִיו
  choice: masing-masing sama banyaknya dengan saudaranya
  rationale: Idiom distributif ini menekankan bahwa setiap anak laki-laki Harun menerima bagian yang setara. Penambahan “banyaknya” membuat maksud pembagian kuantitatif jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa keimaman yang bergender
  choice: anak laki-laki Harun ... saudaranya
  alternative: keturunan Harun ... masing-masing secara merata
  rationale: Teks Ibrani secara eksplisit memakai kata kekerabatan maskulin dalam ketentuan keimaman. Terjemahan mempertahankan hal itu dan tidak menetralkannya.
- issue: Sifat pembagian persembahan di antara para imam
  choice: masing-masing sama banyaknya dengan saudaranya
  alternative: masing-masing seperti saudaranya
  rationale: Ungkapan Ibrani secara harfiah bersifat komparatif, tetapi dalam konteks peruntukan persembahan menyatakan kesetaraan bagian. Terjemahan menyampaikan fungsi idiom tersebut tanpa memasukkan ketentuan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum “harus menjadi bagian” dipilih agar jelas bagi pembaca umum; istilah teknis “persembahan sajian” dipertahankan demi konsistensi konteks kultis.
