    issue: Ungkapan “harus menjadi bagian semua anak laki-laki Harun” tidak tepat secara idiomatis.
    rationale: Dalam bahasa Indonesia, “menjadi bagian [seseorang]” lazimnya berarti menjadi komponen dari orang/kelompok itu, bukan menjadi milik atau jatah mereka. Teks Ibrani menyatakan peruntukan/kepemilikan bagi putra-putra Harun.
  - severity: low
    issue: “anak laki-laki Harun” kurang jelas sebagai rujukan jamak kolektif.
    rationale: Bentuk “anak-anak laki-laki Harun” lebih jelas menyatakan בני אהרן tanpa mengubah makna gender atau status kekerabatannya.
  revised_text: Setiap persembahan sajian yang dicampur dengan minyak, atau yang kering, harus menjadi milik semua anak-anak laki-laki Harun; masing-masing mendapat bagian yang sama dengan saudaranya.
