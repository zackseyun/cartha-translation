  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: id
  text: Daging kurban persembahan keselamatannya untuk ucapan syukur harus dimakan pada hari ia mempersembahkannya; ia tidak boleh menyisakan sedikit pun darinya sampai pagi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Daging kurban ucapan syukur dari persembahan keselamatannya.”'
    reason: Rangkaian konstruksi זֶבַח תּוֹדַת שְׁלָמָיו padat dan dapat diuraikan dengan beberapa susunan yang hampir setara. Alternatif ini lebih dekat pada urutan nomina dalam bahasa Ibrani.
lexical_decisions:
- source_word: וּבְשַׂר
  choice: Daging
  rationale: בשר menunjuk pada daging; dalam bahasa Indonesia, “daging” alami dan tepat untuk konteks kurban.
- source_word: זֶבַח
  choice: kurban
  rationale: זבח menunjuk pada kurban yang disembelih. “Kurban” mempertahankan ragam peribadatan dan menghindari pengulangan yang kurang alami dengan “persembahan”.
- source_word: תּוֹדַת שְׁלָמָיו
  choice: persembahan keselamatan sebagai ucapan syukurnya
  rationale: Frasa ini dipahami sebagai jenis persembahan keselamatan yang dipersembahkan untuk mengungkapkan syukur. Susunan ini tetap memperlihatkan kategori utama dan fungsinya.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: pada hari kurban itu dipersembahkan
  rationale: Ungkapan pasif ini alami dalam bahasa Indonesia dan tidak memaksakan sufiks maskulin tunggal sebagai milik orang tertentu, karena sufiks tersebut juga dapat merujuk pada kurban.
- source_word: יֵאָכֵל
  choice: harus dimakan
  rationale: Bentuk pasif dipertahankan, sedangkan “harus” menyampaikan daya wajib dari ketentuan hukum secara alami.
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: Janganlah ia menyisakan sedikit pun darinya
  rationale: Hifil נוח berarti membiarkan atau menyisakan. Subjek tunggal tetap dinyatakan dengan “ia”, dan מִמֶּנּוּ diterjemahkan secara idiomatis sebagai larangan menyisakan bagian apa pun.
- source_word: עַד בֹּקֶר
  choice: sampai pagi
  rationale: Padanan langsung dan alami bagi batas waktu yang dinyatakan teks.
theological_decisions:
- issue: Padanan kategori kurban שְׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan persekutuan
  rationale: “Persembahan keselamatan” lebih dekat kepada istilah Ibrani dan mempertahankan kategori kurban tanpa terlebih dahulu menafsirkan tujuan ritus itu sebagai persekutuan.
- issue: Hubungan תּוֹדָה dengan שְׁלָמִים
  choice: persembahan keselamatan sebagai ucapan syukur
  alternative: persembahan keselamatan ucapan syukur
  rationale: Pilihan ini menunjukkan bahwa ucapan syukur merupakan fungsi atau subjenis persembahan tersebut, tanpa mengubahnya menjadi kategori teologis terpisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “kurban” dan “persembahan keselamatan” dipakai secara konsisten untuk ragam hukum peribadatan; struktur kalimat dibuat alami tanpa menghilangkan bentuk pasif dan subjek tunggal dalam teks Ibrani.
