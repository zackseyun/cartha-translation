    reason: Rangkaian konstruksi זֶבַח תּוֹדַת שְׁלָמָיו padat dan dapat diuraikan dengan beberapa susunan yang hampir setara. Alternatif ini lebih dekat pada urutan nomina dalam bahasa Ibrani.
