revisions:
- from: Daging dari kurban persembahan keselamatan sebagai ucapan syukurnya[a] harus dimakan pada hari kurban itu dipersembahkan. Janganlah ia menyisakan sedikit pun darinya sampai pagi.
  to: Daging kurban persembahan keselamatannya untuk ucapan syukur harus dimakan pada hari ia mempersembahkannya; ia tidak boleh menyisakan sedikit pun darinya sampai pagi.[a]
  rationale: Revisi memperjelas bahwa persembahan keselamatan itu dipersembahkan untuk mengungkapkan syukur, memulihkan rujukan tunggal kepada pihak yang mempersembahkan kurban dalam "pada hari ia mempersembahkannya", dan menggunakan larangan hukum yang lebih alami. Penanda catatan kaki dipindahkan ke akhir ayat agar melekat pada keseluruhan rangkaian istilah kurban yang dibahas oleh catatan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:12:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Makna dasar draf tepat: daging kurban harus dimakan pada hari persembahan dan tidak boleh ada yang tersisa sampai pagi. Namun, frasa "pada hari kurban itu dipersembahkan" mengaburkan sufiks orang ketiga tunggal pada קָרְבָּנוֹ, yang paling wajar merujuk kepada pihak yang mempersembahkan kurban. Hubungan antara kurban, persembahan keselamatan, dan ucapan syukur juga dapat diungkapkan dengan lebih jelas tanpa kehilangan kepadatan istilah Ibrani.'
  naturalness: '"Daging dari kurban persembahan keselamatan sebagai ucapan syukurnya" terasa berat dan kurang lancar dalam bahasa Indonesia modern. Susunan "kurban persembahan keselamatannya untuk ucapan syukur" lebih mudah dipahami sambil tetap mempertahankan kategori ritual dan tujuannya. Larangan indikatif "ia tidak boleh" lebih selaras dengan gaya ketentuan hukum daripada seruan "Janganlah ia".'
  terminology: '"Daging", "kurban", dan "persembahan keselamatan" dapat dipertahankan. "Persembahan keselamatannya untuk ucapan syukur" menyatakan bahwa ini ialah persembahan keselamatan miliknya yang dibawa sebagai ungkapan syukur, tanpa menggantikan istilah kategori itu dengan tafsiran "persekutuan".'
  issues:
  - severity: medium
    issue: Rujukan pelaku dalam waktu persembahan dikaburkan.
    rationale: Klausa בְּיוֹם קָרְבָּנוֹ secara harfiah berbunyi "pada hari persembahannya"; dalam konteks ini sufiksnya paling alami merujuk kepada orang yang membawa persembahan. Bentuk pasif impersonal "pada hari kurban itu dipersembahkan" menghilangkan unsur tersebut.
  - severity: low
    issue: Rangkaian istilah kurban kurang alami.
    rationale: Frasa "kurban persembahan keselamatan sebagai ucapan syukurnya" sukar diproses karena penumpukan nomina dan letak keterangan "sebagai ucapan syukur". Penataan ulang membuat relasi antarunsurnya lebih jelas.
  - severity: low
    issue: Bentuk larangan kurang sesuai dengan gaya hukum deskriptif.
    rationale: Ibrani memakai bentuk orang ketiga tunggal, "ia tidak akan/tidak boleh meninggalkan", bukan seruan langsung. "Ia tidak boleh menyisakan" mempertahankan subjek tunggal dan daya normatifnya.
  revised_text: Daging kurban persembahan keselamatannya untuk ucapan syukur harus dimakan pada hari ia mempersembahkannya; ia tidak boleh menyisakan sedikit pun darinya sampai pagi.[a]
