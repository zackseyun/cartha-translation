  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: id
  text: Inilah bagian yang menjadi hak Harun dan bagian yang menjadi hak anak-anaknya[a] dari persembahan yang dibakar bagi Yahweh[b], pada hari ketika ia membawa mereka mendekat untuk melayani Yahweh sebagai imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini berkaitan dengan pengurapan dan juga dapat diterjemahkan “bagian pengurapan.” Di sini tampaknya yang dimaksud ialah bagian yang menjadi hak para imam sehubungan dengan pentahbisan mereka.
    reason: lexical_alternative
  - marker: b
    text: 'Secara tradisional: “persembahan-persembahan yang dibakar bagi Yahweh” atau “persembahan-persembahan dengan api bagi Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: bagian yang menjadi hak
  rationale: Dalam rangkuman tentang jatah imam ini, kata tersebut menunjuk pada bagian yang diperuntukkan bagi imam sehubungan dengan pentahbisan mereka. Ungkapan ini alami dalam bahasa Indonesia dan tidak menghilangkan kaitannya dengan pengurapan, yang dijelaskan dalam catatan kaki.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: dari persembahan-persembahan bagi Yahweh yang dibakar
  rationale: אִשֶּׁה menunjuk pada persembahan yang disajikan melalui api. Rumusan ini mempertahankan unsur api tanpa menimbulkan kesan bahwa seluruh persembahan selalu habis dibakar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: בְּיוֹם
  choice: sejak hari ketika
  rationale: Secara harfiah berarti 'pada hari ketika', tetapi dalam hubungan dengan jatah yang menjadi hak imam, frasa ini wajar dipahami sebagai titik awal penetapan hak tersebut; 'sejak' menyatakan nuansa temporal itu dengan alami.
- source_word: הִקְרִיב אֹתָם
  choice: ia membawa mereka mendekat
  rationale: Hifil קרב berarti membawa mendekat atau menghadapkan. Terjemahan ini mempertahankan citra kultis dan menghindari kesan bahwa Harun serta anak-anaknya dipersembahkan sebagai korban.
- source_word: לְכַהֵן לַיהוָה
  choice: untuk melayani Yahweh sebagai imam
  rationale: Infinitif כהן menyatakan pelaksanaan tugas keimaman, sedangkan לַיהוָה menunjukkan kepada siapa pelayanan itu ditujukan.
theological_decisions:
- issue: Makna מִשְׁחַת dalam peraturan tentang bagian imam
  choice: bagian yang menjadi hak
  alternative: bagian pengurapan; pengurapan
  rationale: Konteks ayat 31–34 membahas bagian korban yang diberikan kepada para imam. Namun, hubungan leksikal kata ini dengan pengurapan tetap diakui melalui catatan kaki, sehingga ketegangan maknanya tidak dihapus.
- issue: Subjek tersirat dalam הִקְרִיב אֹתָם
  choice: ia, dibiarkan tanpa identifikasi tambahan
  alternative: Musa; Yahweh
  rationale: Bentuk Ibrani hanya menyatakan subjek maskulin tunggal dan konteks dekat dapat dipahami dengan lebih dari satu cara. Terjemahan tidak menyisipkan nama yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan frasa Ibrani untuk Harun dan anak-anaknya dipertahankan. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
