  naturalness: Bahasa umumnya baku dan jelas. “Pada hari ketika” lebih alami dan tepat daripada “sejak hari ketika” dalam kalimat ini. “Persembahan-persembahan bagi Yahweh yang dibakar” dapat dipahami, tetapi susunan “persembahan yang dibakar bagi Yahweh” lebih lancar dan tidak perlu menggandakan bentuk jamak.
  terminology: Harun dan Yahweh konsisten. “Bagian yang menjadi hak” menyampaikan pengertian jatah/alokasi imam tanpa memaksakan arti harfiah “pengurapan”; catatan kaki dengan tepat memelihara kaitan leksikal itu. “Melayani Yahweh sebagai imam” tepat untuk לְכַהֵן לַיהוָה.
