  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: id
  text: Beserta roti-roti bundar beragi, ia harus mempersembahkan persembahannya di samping kurban keselamatannya sebagai kurban syukur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuannya” atau “kurban kesejahteraannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: di samping; bersama
  rationale: Dalam kedua kemunculannya, עַל menyatakan penyertaan atau penambahan, bukan posisi fisik. Variasi ini menghasilkan bahasa Indonesia yang alami sesuai konteks masing-masing.
- source_word: חַלֹּת לֶחֶם חָמֵץ
  choice: roti-roti bundar beragi
  rationale: חַלּוֹת menunjuk pada roti yang dibentuk atau roti bundar, sedangkan חָמֵץ menandakan bahwa roti itu beragi, berlawanan dengan sajian tidak beragi pada ayat sebelumnya.
- source_word: יַקְרִיב
  choice: harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa ke hadapan Tuhan atau mempersembahkan. Kata 'harus' menyampaikan daya perintah dari bentuk verbal hukum ini.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן adalah istilah umum bagi sesuatu yang dibawa sebagai persembahan; padanan ini jelas dan mempertahankan hubungannya dengan tindakan mempersembahkan.
- source_word: זֶבַח תּוֹדַת
  choice: kurban syukur
  rationale: Gabungan konstruksi ini menunjuk pada kurban yang bercirikan atau menyatakan ucapan syukur. 'Kurban syukur' ringkas dan lazim dalam ragam keagamaan Indonesia.
- source_word: שְׁלָמָיו
  choice: kurban keselamatannya
  rationale: שְׁלָמִים adalah istilah teknis bagi golongan kurban yang berkaitan dengan keutuhan, damai, dan perjamuan bersama. 'Kurban keselamatan' mempertahankan kesinambungan istilah Alkitab bahasa Indonesia, sementara padanan lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Padanan istilah kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan; kurban kesejahteraan
  rationale: Istilah Ibrani ini mencakup gagasan damai, keutuhan, kesejahteraan, dan persekutuan. Teks utama memakai padanan tradisional yang dikenal tanpa membatasi seluruh cakupan maknanya; alternatif yang sah dipertahankan dalam catatan kaki.
- issue: Hubungan תּוֹדַת dengan שְׁלָמָיו
  choice: kurban syukur dari kurban keselamatannya
  alternative: kurban keselamatannya sebagai ucapan syukur
  rationale: Susunan ini mengikuti rangkaian konstruksi Ibrani dan menunjukkan bahwa kurban syukur tersebut termasuk dalam golongan kurban keselamatan, tanpa mengubahnya menjadi sekadar ungkapan batin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum-ibadah. Pengulangan 'mempersembahkan persembahannya' dipertahankan karena mencerminkan permainan akar קרב dalam teks Ibrani dan tetap dapat dipahami. Penanda catatan kaki ditempatkan langsung pada istilah yang dijelaskannya.
