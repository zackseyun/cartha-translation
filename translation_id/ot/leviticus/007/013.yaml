    rationale: Kata “dari” lazimnya menandakan sumber atau bagian yang diambil dari sesuatu. Dalam frasa Ibrani, kurban syukur adalah penandaan/jenis dalam lingkup kurban keselamatan, sehingga “kurban keselamatannya sebagai kurban syukur” menyatakan relasi itu dengan lebih tepat tanpa menambahkan penafsiran.
  - severity: low
    issue: Pemakaian “di samping” lalu “bersama” kurang konsisten dan kurang mengalir.
    rationale: Kedua preposisi itu dapat menerjemahkan עַל dalam konteks ini, tetapi “beserta” untuk roti yang disertakan dan “di samping” untuk kurban yang menyertainya menghasilkan kalimat hukum-ibadah yang lebih alami.
  revised_text: Beserta roti-roti bundar beragi, ia harus mempersembahkan persembahannya di samping kurban keselamatannya sebagai kurban syukur[a].
