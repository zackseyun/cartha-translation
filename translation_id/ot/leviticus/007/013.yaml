  rationale: Revisi memperjelas bahwa kurban syukur merupakan penandaan bagi kurban keselamatan yang dimaksud, bukan sesuatu yang berasal dari kurban itu. Padanan roti beragi, tindakan mempersembahkan, istilah kurban, dan catatan kaki alternatif dipertahankan.
