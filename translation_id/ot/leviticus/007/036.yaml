  text: אֲשֶׁר֩ צִוָּ֨ה יְהוָ֜ה לָ/תֵ֣ת לָ/הֶ֗ם בְּ/יוֹם֙ מָשְׁח֣/וֹ אֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: id
  text: yang Yahweh perintahkan untuk diberikan kepada mereka dari orang Israel[a] pada hari Ia mengurapi mereka—suatu ketetapan untuk selama-lamanya, bagi semua generasi mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari anak-anak Israel”; yaitu, dari orang Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “ketetapan yang berlaku untuk seterusnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Itulah yang
  rationale: Klausa relatif ini mengacu pada bagian para imam dalam konteks sebelumnya. Bentuk “Itulah yang” membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: צִוָּה
  choice: perintahkan
  rationale: Kata kerja ini menyatakan perintah ilahi yang berwibawa; “perintahkan” mempertahankan daya hukum dan perjanjiannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: לָתֵת לָהֶם
  choice: untuk diberikan kepada mereka
  rationale: Bentuk pasif idiomatis dalam bahasa Indonesia menjelaskan bahwa bagian itu harus diberikan kepada Harun dan anak-anaknya, sambil mempertahankan isi infinitif Ibrani.
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: pada hari Ia mengurapi mereka
  rationale: Terjemahan ini mempertahankan ungkapan waktu yang konkret dan makna khusus “mengurapi”, bukan memperluasnya menjadi “menahbiskan”.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: dari bani Israel
  rationale: “Bani Israel” mempertahankan ungkapan perjanjian harfiah “anak-anak Israel”, tetapi tetap dikenal dalam ragam Indonesia keagamaan; padanan yang lebih langsung bagi pembaca umum dicatat dalam catatan kaki.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan untuk selama-lamanya
  rationale: Ungkapan ini mempertahankan bobot hukum dan sifat berkelanjutan dari formula imamat tanpa menjabarkan implikasi teologis di luar teks.
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan Indonesia ini secara alami menyatakan keberlakuan sepanjang generasi-generasi mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Daya makna עוֹלָם dalam hukum keimaman
  choice: untuk selama-lamanya
  alternative: untuk seterusnya; untuk selamanya
  rationale: Pilihan ini menjaga bobot formula hukum yang berkelanjutan, sedangkan frasa “turun-temurun” dalam teks langsung membingkai keberlangsungannya menurut generasi-generasi Israel.
- issue: Subjek tersirat dalam מָשְׁחוֹ
  choice: Ia, mengacu kepada Yahweh
  alternative: ketika mereka diurapi
  rationale: Sufiks orang ketiga maskulin tunggal paling wajar kembali kepada Yahweh, subjek eksplisit sebelumnya. Bentuk aktif dipertahankan, sebagaimana struktur sumber.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami, dengan “bani Israel” dipertahankan sebagai ungkapan perjanjian yang dikenal. Susunan kalimat dibuat alami sebagai kelanjutan dari ayat sebelumnya. Kapitalisasi “Ia” menandai bahwa subjeknya adalah Yahweh.
