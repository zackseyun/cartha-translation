  source_fidelity: 'Makna pokok terjaga: bagian-bagian imam diperintahkan Yahweh untuk diberikan kepada mereka dari orang Israel pada hari pengurapan mereka, sebagai ketetapan yang terus berlaku lintas generasi. Namun, אֲשֶׁר adalah pronomina relatif yang mengacu langsung pada bagian-bagian yang disebut sebelumnya; “Itulah yang” agak demonstratif dan kurang tepat sebagai kelanjutan sintaksis. Selain itu, “bani Israel” dapat dipahami secara historis sebagai kelompok/klan dan tidak merupakan pilihan modern standar yang paling jelas untuk בְּנֵי יִשְׂרָאֵל dalam konteks ini.'
