revisions:
- from: Jika seseorang menyentuh sesuatu yang najis—baik kenajisan manusia, binatang yang najis, maupun segala sesuatu yang menjijikkan dan najis—lalu memakan sebagian daging kurban persembahan keselamatan yang dipersembahkan kepada TUHAN, orang itu harus dilenyapkan dari tengah-tengah bangsanya.[a]
  to: Jika seseorang menyentuh sesuatu yang najis—baik kenajisan manusia, binatang yang najis, maupun segala sesuatu yang menjijikkan dan najis—lalu memakan sebagian daging kurban persembahan keselamatan yang menjadi milik TUHAN, orang itu harus diputuskan dari bangsanya.[a]
  rationale: Revisi mengganti istilah yang berpotensi menetapkan hukuman mati dengan padanan formal yang mempertahankan ketidakpastian formula Ibrani. Frasa mengenai hubungan kurban dengan TUHAN juga dibuat lebih dekat dengan makna kepunyaan atau pengabdian yang dinyatakan dalam teks sumber.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:12:12Z'
review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum mengikuti struktur dan cakupan Ibrani dengan baik. Namun, “harus dilenyapkan” terlalu mudah dipahami sebagai hukuman mati atau pemusnahan, padahal formula וְנִכְרְתָה ... מֵעַמֶּיהָ tidak menentukan cara sanksi itu dilaksanakan. Frasa “yang dipersembahkan kepada TUHAN” dapat diterima secara kontekstual, tetapi “yang menjadi milik TUHAN” lebih langsung mencerminkan אֲשֶׁר לַיהוָה.
  naturalness: Bahasanya baku dan jelas. “Harus diputuskan dari bangsanya” merupakan rumusan yang agak formal, tetapi tepat untuk mempertahankan karakter formula hukum kuno dan ambiguitas sanksinya.
  terminology: “Najis,” “kenajisan,” dan “kurban persembahan keselamatan” konsisten dengan register ritual. “Diputuskan dari bangsanya” lebih netral daripada “dilenyapkan” dan selaras dengan catatan kaki yang tidak menetapkan bentuk hukuman.
  issues:
  - severity: medium
    issue: “Harus dilenyapkan dari tengah-tengah bangsanya” terlalu spesifik.
    rationale: Pilihan ini secara alami dapat menyiratkan kematian atau pemusnahan, sedangkan כרת dalam formula ini tidak menjelaskan apakah sanksinya berupa kematian, pengucilan, atau penghakiman ilahi.
  - severity: low
    issue: “Yang dipersembahkan kepada TUHAN” kurang langsung daripada frasa sumber.
    rationale: אֲשֶׁר לַיהוָה secara harfiah menandai kurban itu sebagai milik atau bagian bagi TUHAN. “Yang menjadi milik TUHAN” menyampaikan hubungan tersebut tanpa mengubah makna.
  revised_text: Jika seseorang menyentuh sesuatu yang najis—baik kenajisan manusia, binatang yang najis, maupun segala sesuatu yang menjijikkan dan najis—lalu memakan sebagian daging kurban persembahan keselamatan yang menjadi milik TUHAN, orang itu harus diputuskan dari bangsanya.[a]
  revised_footnotes:
  - marker: a
    text: Ungkapan “diputuskan dari bangsanya” adalah rumusan sanksi perjanjian. Teks Ibrani tidak menjelaskan apakah ini berarti pengucilan, kematian, atau penghukuman langsung oleh Allah.
    reason: alternative_reading
  revision_rationale: Revisi mengganti istilah yang berpotensi menetapkan hukuman mati dengan padanan formal yang mempertahankan ketidakpastian formula Ibrani. Frasa mengenai hubungan kurban dengan TUHAN juga dibuat lebih dekat dengan makna kepunyaan atau pengabdian yang dinyatakan dalam teks sumber.
