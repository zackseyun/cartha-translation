id: LEV.7.21
reference: Leviticus 7:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: id
  text: Jika seseorang menyentuh sesuatu yang najis—baik kenajisan manusia, binatang yang najis, maupun segala sesuatu yang menjijikkan dan najis—lalu memakan sebagian daging kurban persembahan keselamatan yang menjadi milik TUHAN, orang itu harus diputuskan dari bangsanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “diputuskan dari bangsanya” adalah rumusan sanksi perjanjian. Teks Ibrani tidak menjelaskan apakah ini berarti pengucilan, kematian, atau penghukuman langsung oleh Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: seseorang / orang itu
  rationale: Dalam konteks hukum, נֶפֶשׁ menunjuk kepada seorang individu, bukan secara khusus kepada jiwa sebagai unsur nonjasmani.
- source_word: תִגַּע
  choice: menyentuh
  rationale: Kata ini mempertahankan pengertian kontak yang menimbulkan kenajisan ritual.
- source_word: בְּכָל טָמֵא
  choice: sesuatu yang najis
  rationale: Ungkapan ini bersifat luas dan tak tentu; padanan ini alami dalam bahasa Indonesia.
- source_word: טֻמְאַת אָדָם
  choice: kenajisan manusia
  rationale: Frasa ini menunjuk pada kenajisan ritual yang berkaitan dengan manusia tanpa membatasi jenis kelamin.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: binatang yang najis
  rationale: בְּהֵמָה dipakai sebagai istilah umum bagi binatang dalam konteks ini.
- source_word: שֶׁקֶץ טָמֵא
  choice: sesuatu yang menjijikkan dan najis
  rationale: Padanan ini mempertahankan baik nuansa kejijikan ritual dari שֶׁקֶץ maupun keterangan eksplisit טָמֵא.
- source_word: וְאָכַל מִבְּשַׂר
  choice: lalu memakan sebagian daging
  rationale: Kata 'sebagian' menyatakan fungsi partitif preposisi מִן.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: kurban persembahan keselamatan
  rationale: Padanan ini menjaga istilah persembahan yang berhubungan dengan konsep keutuhan atau kesejahteraan, tanpa mempersempitnya hanya menjadi persekutuan.
- source_word: אֲשֶׁר לַיהוָה
  choice: yang dipersembahkan kepada TUHAN
  rationale: Frasa Ibrani dapat menyatakan bahwa kurban itu diperuntukkan bagi YHWH; rumusan ini alami dan sesuai konteks persembahan.
- source_word: יהוה
  choice: TUHAN
  rationale: Bentuk huruf kapital mengikuti konvensi Indonesia yang lazim untuk menandai nama ilahi YHWH.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: harus dilenyapkan dari tengah-tengah bangsanya
  rationale: Rumusan ini mempertahankan bobot sanksi perjanjian dan hubungannya dengan komunitas, sementara cara pelaksanaannya tetap tidak ditentukan.
theological_decisions:
- issue: Makna sanksi וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: harus dilenyapkan dari tengah-tengah bangsanya
  alternative: harus dikucilkan dari bangsanya; harus dihukum mati
  rationale: Bahasa Ibrani tidak menjelaskan apakah sanksi itu berupa kematian, pengucilan, atau penghukuman langsung oleh Allah. Terjemahan utama mempertahankan ketidakpastian tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual 'najis', 'kurban', dan 'persembahan keselamatan' dipertahankan demi kesinambungan kosakata Imamat. Bentuk feminin gramatikal pada נֶפֶשׁ dan sufiks עַמֶּיהָ tidak ditampilkan sebagai jenis kelamin perempuan karena acuannya generik.
