  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: id
  text: Namun, orang yang memakan daging dari kurban persekutuan bagi TUHAN, sementara kenajisannya masih ada padanya, orang itu harus diputuskan dari umatnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "harus dikeluarkan dari umatnya." Ungkapan "harus diputuskan" dapat merujuk pada pengusiran atau kematian, tetapi bahasa Ibrani di sini tidak menyebutkan caranya secara khusus.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: orang
  rationale: Dalam hukum ritual, נֶפֶשׁ menunjuk kepada seorang individu, bukan secara khusus kepada jiwa sebagai unsur nonjasmani.
- source_word: תֹּאכַל
  choice: yang memakan
  rationale: Bentuk imperfek menyatakan kasus umum dalam rumusan hukum; klausa relatif ini menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: בָּשָׂר
  choice: daging
  rationale: Dalam konteks makanan kurban, 'daging' merupakan padanan modern dan tepat.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: dari kurban persekutuan
  rationale: שְׁלָמִים adalah kategori kurban tertentu. 'Kurban persekutuan' menyampaikan dimensi persekutuan dan lebih mudah dipahami daripada terjemahan harfiah yang dapat disalahartikan sebagai kurban untuk memperoleh kedamaian.
- source_word: אֲשֶׁר לַיהוָה
  choice: yang dipersembahkan kepada TUHAN
  rationale: Frasa ini menandai kurban tersebut sebagai milik atau diperuntukkan bagi YHWH; pilihan ini alami dalam konteks ibadah tanpa mengubah kepemilikan sakral yang dimaksud.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: sementara kenajisannya masih melekat padanya
  rationale: Mempertahankan gambaran Ibrani bahwa kenajisan berada 'di atas' orang itu, dengan ungkapan Indonesia yang wajar. 'Masih' menegaskan keadaan yang sedang berlaku tanpa menambah jenis kenajisannya.
- source_word: וְנִכְרְתָה
  choice: harus dilenyapkan
  rationale: Nifal כרת menyatakan penghilangan berat dari komunitas perjanjian. 'Dilenyapkan' menjaga kekuatan formula itu tanpa menentukan secara tegas apakah caranya pengusiran atau kematian.
- source_word: מֵעַמֶּיהָ
  choice: dari antara bangsanya
  rationale: Sufiks feminin mengikuti נֶפֶשׁ secara gramatikal, bukan menunjukkan jenis kelamin. 'Bangsanya' netral dan menyampaikan komunitas asal orang tersebut.
theological_decisions:
- issue: Makna hukuman וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: harus dilenyapkan dari antara bangsanya
  alternative: harus disingkirkan dari bangsanya; harus mati/dihukum mati
  rationale: Formula Ibrani menunjukkan penghilangan berat dari komunitas perjanjian, tetapi ayat ini tidak menjelaskan mekanismenya. Teks utama mempertahankan ketidakpastian itu, sedangkan kemungkinan pengusiran atau kematian dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual 'kenajisan' dipertahankan untuk membedakannya dari kekotoran biasa. Nama ilahi יהוה ditampilkan sebagai TUHAN sesuai konvensi Alkitab bahasa Indonesia.
