source:
  edition: WLC
  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: id
  text: Inilah hukum tentang kurban bakaran, persembahan sajian, kurban penghapus dosa[a], kurban penebus kesalahan[b], upacara penahbisan[c], dan kurban keselamatan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian”. Istilah Ibrani ini dapat menekankan penghapusan kenajisan maupun penanganan dosa.
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban ganti rugi”. Istilah Ibrani ini dapat menekankan tanggungan karena kesalahan serta pemulihan yang diwajibkan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, istilah Ibraninya berbentuk jamak dan berkaitan dengan “pengisian tangan”; dalam konteks ini, istilah itu menunjuk pada rangkaian upacara pelantikan imam. Dapat juga diterjemahkan “kurban penahbisan”.
    reason: lexical_alternative
  - marker: d
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan”. Istilah Ibrani ini mencakup gagasan damai, keutuhan, dan kesejahteraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Inilah hukum
  rationale: Ungkapan demonstratif ini memperkenalkan rangkuman ketentuan. “Inilah hukum” alami dalam bahasa Indonesia dan mempertahankan sifat normatif תּוֹרָה dalam konteks ritual.
- source_word: לָעֹלָה
  choice: tentang kurban bakaran
  rationale: Preposisi ל menandai pokok yang diatur, sedangkan עֹלָה adalah kurban yang dibakar seluruhnya. “Kurban bakaran” ringkas dan sudah dikenal.
- source_word: לַמִּנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks Imamat, מִנְחָה menunjuk pada persembahan hasil pangan, terutama tepung atau biji-bijian. “Persembahan sajian” cukup luas untuk mencakup bentuk-bentuknya dan tetap wajar dalam bahasa Indonesia.
- source_word: וְלַחַטָּאת
  choice: kurban penghapus dosa
  rationale: חַטָּאת dapat menunjuk pada dosa maupun kurban yang menangani dosa dan kenajisan. Pilihan ini mudah dipahami tanpa meniadakan nuansa pemurnian, yang dicatat dalam catatan kaki.
- source_word: וְלָאָשָׁם
  choice: kurban penebus kesalahan
  rationale: אָשָׁם berkaitan dengan kesalahan, tanggungan, dan dalam sejumlah kasus pemulihan atau ganti rugi. Pilihan ini membedakannya dari חַטָּאת sambil tetap mempertahankan gagasan kesalahan.
- source_word: וְלַמִּלּוּאִים
  choice: upacara penahbisan
  rationale: Bentuk jamak מִלּוּאִים secara harfiah berkaitan dengan “pengisian” dan dalam konteks imam menunjuk pada rangkaian tindakan pelantikan atau penahbisan. “Upacara penahbisan” lebih tepat daripada menjadikannya satu jenis kurban tunggal.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: kurban keselamatan
  rationale: זֶבַח berarti kurban sembelihan, sedangkan שְׁלָמִים berkaitan dengan keadaan utuh, sejahtera, damai, dan persekutuan. “Kurban keselamatan” mempertahankan istilah Indonesia yang dikenal; alternatif semantis dicatat.
theological_decisions:
- issue: Cakupan חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Teks utama memakai istilah yang mudah dikenali, sedangkan catatan mempertahankan kemungkinan bahwa fungsi ritual pemurnian lebih ditonjolkan.
- issue: Cakupan מִלּוּאִים
  choice: upacara penahbisan
  alternative: kurban penahbisan
  rationale: Bentuk jamak dan konteks pelantikan imam mendukung pengertian rangkaian upacara, bukan semata-mata satu persembahan; pilihan ini tidak menentukan lebih jauh rincian teologis ritus tersebut.
- issue: Makna שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan atau kurban kesejahteraan
  rationale: Istilah Ibrani memiliki rentang makna yang mencakup damai, kesejahteraan, dan persekutuan. Teks utama menggunakan istilah tradisional, sementara catatan menjaga keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar Ibrani dipertahankan, tetapi preposisi berulang diringkas secara alami setelah “tentang”. Istilah ritual dibuat konsisten dengan penggunaan “kurban” untuk jenis persembahan sembelihan, sementara מִנְחָה diterjemahkan “persembahan sajian” dan מִלּוּאִים sebagai rangkaian upacara.
