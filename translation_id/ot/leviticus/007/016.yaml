  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: id
  text: Namun, jika kurban persembahannya dipersembahkan untuk memenuhi nazar atau sebagai persembahan sukarela[a], kurban itu harus dimakan pada hari ia mempersembahkan kurbannya. Pada hari berikutnya, apa yang tersisa darinya boleh dimakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani membedakan kurban yang dipersembahkan untuk memenuhi nazar dari persembahan yang diberikan secara sukarela.
    reason: lexical_clarification
lexical_decisions:
- source_word: נֶדֶר
  choice: kurban nazar
  rationale: Dalam konteks ini נֶדֶר menunjuk pada kurban yang berkaitan dengan nazar, bukan sekadar tindakan bernazar. Pilihan ini membedakannya dengan jelas dari persembahan sukarela dan sesuai dengan fungsi sintaksisnya sebagai jenis זֶבַח.
- source_word: נְדָבָה
  choice: persembahan sukarela
  rationale: נְדָבָה adalah pemberian yang dipersembahkan secara sukarela, bukan karena kewajiban nazar. Ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: kurban persembahannya
  rationale: 'Terjemahan ini mempertahankan kedua unsur Ibrani: זֶבַח sebagai ''kurban'' dan קָרְבָּן sebagai ''persembahan'', tanpa menghasilkan frasa Indonesia yang terlalu kaku.'
- source_word: בְּיוֹם הַקְרִיבוֹ
  choice: pada hari ia mempersembahkan
  rationale: Bentuk Hifil dari קרב di sini berarti membawa atau menyajikan sebagai persembahan. 'Mempersembahkan' menyampaikan makna ritual itu secara alami.
- source_word: יֵאָכֵל
  choice: harus dimakan
  rationale: Bentuk Nifal imperfek pertama berfungsi sebagai ketentuan hukum mengenai waktu memakan kurban; 'harus dimakan' mempertahankan nada preskriptifnya.
- source_word: וּמִמָּחֳרָת
  choice: pada hari berikutnya
  rationale: מָחֳרָת menunjuk pada hari sesudah hari persembahan. Frasa ini jelas dan modern.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: apa yang masih tersisa darinya
  rationale: Partisip נוֹתָר menyatakan bagian yang tertinggal. Kata 'masih' memperjelas kesinambungan dari hari pertama tanpa menambah gagasan baru.
- source_word: יֵאָכֵל
  choice: boleh dimakan
  rationale: Kemunculan kedua bentuk yang sama menyatakan bahwa sisa kurban diizinkan dimakan pada hari kedua. 'Boleh' mengungkapkan daya permisif konteks ini dan menghindari kesan bahwa semuanya wajib dihabiskan pada hari kedua.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual diterjemahkan secara konsisten dengan 'kurban', 'persembahan', dan 'mempersembahkan'. Struktur kalimat dibagi menjadi dua agar ketentuan tentang hari pertama dan izin pada hari kedua mudah dipahami.
