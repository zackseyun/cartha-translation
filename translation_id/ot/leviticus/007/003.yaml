  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, sementara “dari kurban itu” dipakai untuk memperjelas rujukan pronomina Ibrani. Tidak ditambahkan catatan alternatif untuk יַקְרִיב karena “mempersembahkan” secara alami mencakup tindakan ritual yang dimaksud.
