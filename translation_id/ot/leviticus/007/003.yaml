  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: id
  text: 'Dari hewan kurban itu ia harus mempersembahkan seluruh lemaknya: ekor berlemak[a] dan lemak yang menutupi isi perut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, ekor domba yang kaya lemak, yaitu bagian lemak khusus yang dipersembahkan dalam kurban.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: lemaknya / lemak
  rationale: Dalam peraturan kurban, חֵלֶב menunjuk pada bagian-bagian lemak tertentu yang dikhususkan untuk dipersembahkan. “Lemak” merupakan padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: יַקְרִיב
  choice: harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa dekat atau menyajikan sebagai persembahan. “Mempersembahkan” menyampaikan fungsi ritualnya secara alami tanpa menentukan tahap tindakan secara berlebihan.
- source_word: מִמֶּנּוּ
  choice: dari kurban itu
  rationale: Akhiran pronomina paling wajar merujuk pada hewan kurban dalam konteks. Penyebutan “kurban itu” memperjelas acuannya dalam bahasa Indonesia tanpa mengubah makna.
- source_word: הָאַלְיָה
  choice: ekor berlemak
  rationale: אַלְיָה menunjuk pada ekor berlemak domba, yaitu bagian lemak khusus dalam persembahan. Padanan ini lebih tepat daripada sekadar “ekor” dan tidak menyiratkan bahwa seluruh ekor selalu dimaksudkan tanpa penjelasan.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: yang menutupi isi perut
  rationale: קֶרֶב di sini menunjuk pada organ-organ di bagian dalam tubuh hewan. “Isi perut” cukup konkret, alami, dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: כָּל
  choice: seluruh
  rationale: כָּל menekankan keseluruhan lemak yang ditetapkan untuk persembahan; “seluruh” menyampaikan penekanan itu dengan tepat.
theological_decisions: []
