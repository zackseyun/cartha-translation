translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'mazbah' dipakai untuk membedakan altar persembahan dalam konteks kultis. Modal 'harus' menyampaikan daya wajib dari bentuk verbal dalam ketentuan ritual.
