  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: id
  text: Imam harus membakar lemak itu di atas mazbah[a], dan bagian dada itu menjadi milik Harun dan anak-anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mempersembahkan lemak itu di atas mazbah sebagai persembahan yang naik dalam asap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: harus membakar
  rationale: Dalam konteks persembahan, bentuk Hifil dari קטר menunjuk pada tindakan membakar bagian persembahan di mazbah sehingga asapnya naik. 'Membakar' jelas dan alami dalam bahasa Indonesia; nuansa asap dipertahankan dalam catatan kaki.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan tepat untuk כֹּהֵן dalam konteks peribadatan Israel; bentuk tunggal Ibrani dipertahankan.
- source_word: הַחֵלֶב
  choice: lemak itu
  rationale: Dalam hukum persembahan Imamat, חֵלֶב merujuk pada bagian-bagian lemak khusus yang diperuntukkan bagi pembakaran di mazbah. Kata penunjuk 'itu' secara alami mencerminkan keartikulan bentuk Ibrani dan konteks yang telah menyebut bagian tersebut.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran direktif secara harfiah dapat menyatakan gerak menuju mazbah, tetapi bersama הִקְטִיר tindakan ritualnya berlangsung di atas mazbah. Ungkapan ini menyampaikan lokasi pembakaran dengan wajar dan tepat.
- source_word: וְהָיָה
  choice: menjadi milik
  rationale: Secara harfiah berarti 'dan itu akan menjadi/ada', tetapi konstruksi dengan לְ di sini menyatakan penetapan hak atas bagian persembahan. 'Menjadi milik' mengungkapkan makna hukum tersebut secara alami.
- source_word: הֶחָזֶה
  choice: bagian dada itu
  rationale: Dalam aturan persembahan, חָזֶה adalah bagian dada hewan yang dialokasikan kepada para imam. 'Bagian dada' menghindari kemungkinan pembaca memahami kata ini sebagai dada secara umum.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Harun dan anak-anaknya
  rationale: Preposisi לְ menandai penerima atau kepemilikan; maknanya sudah dinyatakan oleh 'menjadi milik', sehingga bentuk Indonesia tidak perlu mengulanginya dengan 'bagi' atau 'kepada'.
