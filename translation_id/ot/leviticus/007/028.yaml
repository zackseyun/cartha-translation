lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol membuka unit firman berikutnya. “Kemudian” menyampaikan kelanjutan naratif secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju dalam tindakan berbicara; “kepada Musa” adalah ungkapan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Infinitif formulaik ini memperkenalkan perkataan langsung. “Kata-Nya” mempertahankan fungsi pengantar tersebut dan lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dengan mengatakan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Bentuk “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Konstruksi “berfirman ... kata-Nya” mempertahankan pembedaan antara דּבר dan אמר sejauh wajar dalam idiom Indonesia.
