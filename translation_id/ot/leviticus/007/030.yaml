- from: Tangannya sendiri harus membawa persembahan yang dibakar bagi TUHAN. Ia harus membawa lemak bersama dada itu untuk mengayunkan dada tersebut sebagai persembahan unjukan di hadapan TUHAN.
  to: Dengan tangannya sendiri ia harus membawa persembahan yang dibakar bagi TUHAN. Ia harus membawa lemak yang berada di atas dada itu; ia harus membawa dada itu untuk mengayunkannya sebagai persembahan unjukan di hadapan TUHAN.
  rationale: 'Revisi memulihkan makna spasial עַל («di atas») dan membedakan dua penyebutan tindakan membawa dalam teks Ibrani: membawa lemak di atas dada, lalu membawa dada untuk diunjukkan. Tidak ada ambiguitas tekstual yang memerlukan catatan kaki.'
